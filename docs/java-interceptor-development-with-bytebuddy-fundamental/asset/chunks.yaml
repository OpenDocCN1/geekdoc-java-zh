  trans: "\n\n`isMemberType` 方法以布尔值提供成员类类型的状态。`Storage.java` 是一个内部类，它在 `DataReader.java`\
    \ 中声明。因此，该方法应该返回 `true`，因为 `Storage.java` 是 `DataReader.java` 的成员类：\n\n```java\n\
    public boolean isMemberType(){\n    return true;\n}\n```\n\n# 生成第一级内部类\n\n`firstInnerTd`\
    \ 是 `TypeDescription.Latent` 的实例。在此阶段，该内部类处于 `TypeDescription` 格式，尚未转换为 Java 类格式。为了将\
    \ `TypeDescription` 转换为 Java 类格式，插件程序需要使用 `net.bytebuddy.ByteBuddy` 来实现此目的：\n\n\
    ```java\nDynamicType.Builder<?> firstInnerBuilder=\nnew ByteBuddy()\n  .subclass(Object.class)\n\
    \  .name(firstInnerTd.getName())\n  .innerTypeOf(td).asMemberType()\n  .defineMethod(“createUuid”,\
    \ String.class, Visibility.PUBLIC)\n  .intercept(FixedValue.nullValue());\n```\n\
    \n**(1) 实例化 `ByteBuddy` 实例**\n\n```java\nnew ByteBuddy()\n```\n\n`ByteBuddy` 实例是插码过程的入口点。该实例用于配置插码行为。之前所有的章节都不需要实例化\
    \ `ByteBuddy` 实例，因为插件程序会在 maven 构建期间隐式地创建一个。这里需要一个新实例，是因为插件程序想要使用 `subclass` 方法创建新的\
    \ Java 内部类。`subclass` 方法无法通过 `DynamicType.Builder` 直接使用。\n\n**(2) 配置插码过程以创建一个扩展自\
    \ `java.lang.Object` 的新 Java 类**\n\n```java\n.subclass(Object.class)\n```\n\n\
    `subclass` 方法指示插码过程在 Java 的面向对象编程中使用继承。这意味着生成的 Java 类是 `java.lang.Object` 的派生类。这看起来是冗余的，因为\
    \ `firstInnerTd` 已经在 `TypeDescription.Latent` 的构造函数中指定了父类。然而，此配置是用于生成 Java 类的，而\
    \ `Latent` 用于构建 `TypeDescription`。\n\n**(3) 配置内部类的名称**\n\n```java\n.name(firstInnerTd.getName())\n\
    ```\n\n`name` 方法提供生成的 Java 类的全限定类名。因此，该方法调用 `firstInnerTd` 的 `getName` 方法来获取 `Storage.java`\
    \ 的全限定类名。\n\n**(4) 配置内部类的顶层外部类**\n\n```java\n.innerTypeOf(td).asMemberType()\n\
    ```\n\n`innerTypeOf` 方法指定内部类的顶层外部类。`td` 是 `TypeDescription` 的实例，从 `apply` 方法的第二个参数获取。`td`\
    \ 代表 `DataReader.class` 的实例，它是 `Storage.java` 的顶层外部类。因此，`innerTypeOf` 方法的参数指定了\
    \ `td`。`asMemberType` 方法指定内部类为成员类类型。\n\n# 生成内部类的方法\n\n在此阶段，插码过程的配置应该能够为 `Storage.java`\
    \ 创建 Java 类。然而，内部类是一个空类。插件程序可以通过为内部类声明构造函数、方法、实例变量和其他 Java 元素来继续配置。在本例中，随后的配置声明了一个名为“createUuid”的方法：\n\
    \n```java\n.defineMethod(“createUuid”, String.class, Visibility.PUBLIC)\n  .intercept(FixedValue.nullValue());\n\
    ```\n\n`createUuid` 方法是一个返回 `java.lang.String` 的公共方法。该方法在声明时返回 `null` 值。然后，插件程序进一步使用\
    \ `visit` 方法修改 `createUuid` 方法体方法的实现：\n\n```java\nfirstInnerBuilder=firstInnerBuilder.visit(\n\
    \  Advice.to(UuidGenerator.class)\n  .on(ElementMatchers.named(“createUuid”)));\n\
    ```\n\n`visit` 方法将 `UuidGenerator.class` 建议代码添加到 `createUuid` 方法中。之后，`Storage.java`\
    \ 的配置几乎完成。`Storage.java` 也有一个名为 `Util.java` 的内部类。因此，插件程序继续生成 `Util.java` 内部类。\n\
    \n# 生成第二级内部类\n\n为了为 `Storage.java` 声明 `Util.java` 内部类，插件程序需要声明一个新的 `TypeDescription.Latent`\
    \ 实例。该实例就是 `secondInnerTd`：\n\n```java\nTypeDescription secondInnerTd =\nnew TypeDescription.Latent(\n\
    \  “com.millionstrengthknowledge.interceptorprj.repository.DataReader$Storage$Util”,\n\
    \  Opcodes.ACC_PUBLIC | Opcodes.ACC_STATIC,\n  TypeDescription.Generic.OBJECT)\
    \ {\n  @Override\n  public String getSimpleName() {\n    return “Util”;\n  }\n\
    \  @Override\n  public boolean isAnonymousType() {\n    return false;\n  }\n \
    \ @Override\n  public boolean isMemberType() {\n    return true;\n  }\n};\n```\n\
    \n由于 `Util.java` 是 `Storage.class` 的公共静态内部类，因此它的名称为“com.millionstrengthknowledge.interceptorprj.repository.DataReader$Storage$Util”，修饰符配置为\
    \ `Opcodes.ACC_PUBLIC | Opcodes.ACC_STATIC`。其余实现应与 `firstInnerTd` 相似。\n\n之后，创建另一个\
    \ `ByteBuddy` 实例来配置 `Util.java` 的转换过程：\n\n```java\nnew ByteBuddy()\n  .subclass(AbstractUtil.class)\n\
    \  .name(secondInnerTd.getName())\n  .innerTypeOf(td).asMemberType()\n  .implement(UtilIntf.class)\n\
    \  .defineMethod(“getData”, String.class, Visibility.PUBLIC)\n  .intercept(FixedValue.value(“data\
    \ value”))\n  .make()\n  .saveIn(dir);\n```\n\n新 `ByteBuddy` 实例的配置应遵循以下步骤：\n\n\
    **(1) 创建 `ByteBuddy` 实例**\n```java\nnew ByteBuddy()\n```\n\n**(2) 配置插码过程以扩展 `AbstractUtil.class`**\n\
    ```java\n.subclass(AbstractUtil.class)\n```\n\n**(3) 配置内部类的名称**\n```java\n.name(secondInnerTd.getName())\n\
    ```\n\n**(4) 配置内部类的顶层外部类**\n```java\n.innerTypeOf(td).asMemberType()\n```\n请注意\
    \ `DataReader.java` 是顶层外部类，而不是 `Storage.java`。因此，插件程序将 `td` 变量传递给 `innerTypeOf`\
    \ 方法。\n\n**(5) 可选：配置内部类的超接口**\n```java\n.implement(UtilIntf.class)\n```\n\n**(6)\
    \ 可选：为内部类声明方法**\n```java\n.defineMethod(“getData”, String.class, Visibility.PUBLIC)\n\
    \  .intercept(FixedValue.value(“data value”))\n```\n\n**(7) 完成配置，生成 Java 类并将其存储在\
    \ `Dynamic.Unloaded` 实例中**\n```java\n.make()\n```\n\n**(8) 将 Java 类保存到磁盘**\n```java\n\
    .saveIn(dir)\n```\n\n# 将第二级内部类添加到第一级内部类\n\n在将 `Util.class` 保存到磁盘后，插件程序现在可以完成 `Storage.class`\
    \ 的配置：\n\n```java\nfirstInnerBuilder.declaredTypes(secondInnerTd)\n  .make()\n\
    \  .saveIn(dir);\n```\n\n"
- fmt: "\nInvoke the `declaredTypes` method of `firstInnerBuilder` instance. The `declaredTypes`\
    \ method is similar to `defineMethod` method, which is used for declaring the\
    \ method, while the `declaredTypes` method is used for declaring the inner class.\
    \ The parameter of `declaredTypes` method accepts an instance of `TypeDescription`,\
    \ so the program should pass the `secondInnerTd` to the method to create the `Util.java`\
    \ inner class in `Storage.java`.\n\nAfter that, invokes the `make` and `saveIn`\
    \ method for `Storage.java` to save the `Storage.class` into disk.\n\n### Adding\
    \ first level inner class to outer class\n\nFinally, the plugin program needs\
    \ to declare the `Storage.java` for the `DataReader.java` because `Storage.java`\
    \ is the inner class of `DataReader.java`:\n\n```\nbuilder.declaredTypes(firstInnerTd);\n\
    ```\n\nAfter all, the `DataReaderPlugin.java` plugin program should completely\
    \ generate the `Storage.java` and `Util.java` inner class in the `DataReader.java`.\n\
    \n219\n\n![](Image00000.gif)\n\n### RepositoryPlugin\n\nThis chapter uses two\
    \ plugin programs. This section explains the second plugin for this chapter: `RepositoryPlugin.java`.\
    \ The `RepositoryPlugin.java` is used for instrumenting the inner class and anonymous\
    \ class found in the `com.millionstrengthknowledge.interceptorprj.repository`\
    \ package. This is the matching logic implemented in `matches` method of `RepositoryPlugin.java`:\n\
    \n```\nif(target.getName().startsWith(\"com.millionstrengthknowledge.interceptorprj.repository\"\
    ) && (target.isInnerClass()||target.isAnonymousType()))\n    return true;\nelse\n\
    \    return false;\n```\n\nThe `if` statement checks the name of the package name\
    \ of the `target` variable, and uses `isInnerClass` method to check whether the\
    \ target is an inner class, and uses `isAnonymousType` method to check whether\
    \ the target is an anonymous class. Therefore, the `if` statement returns `true`\
    \ when the target is either the inner class or anonymous class created in `com.millionstrengthknowledge.interceptorprj.repository`\
    \ package. In this chapter, there are two outer classes in the `com.millionstrengthknowledge.interceptorprj.repository`\
    \ package: `DataReader.java` and `DataProducer.java`.\n\n`DataReader.java` does\
    \ not have inner class and anonymous class before the instrumentation. After instrumentation\
    \ process of `DataReaderPlugin.java`, `DataReader.java` contains two inner classes:\
    \ `Storage.java` and `Util.java`.\n\n`DataProducer.java` has three inner classes\
    \ before the instrumentation: `User.java`, `UserEntityUtil.java`, and `Address.java`,\
    \ and two anonymous class: `DataProducer$User$1.java`, `DataProducer$User$UserEntityUtil$1.java`.\
    \ Therefore, `DataProducer.java` will continue to the instrumentation process\
    \ of the `RepositoryPlugin.java`.\n\n220\n\n![](Image00000.gif)\n\n### Generate\
    \ new method in inner class and anonymous class\n\nIn `apply` method, this is\
    \ the implementation of the instrumentation process:\n\n```\nbuilder.defineMethod(\"\
    innerTest\", String.class, Visibility.PUBLIC)\n.intercept(FixedValue.value(td.getName()))\n\
    ```\n\nIn `apply` method of `RepositoryPlugin.java`, the instrumentation adds\
    \ one new method named “innerTest” to the inner classes and anonymous classes.\
    \ After instrumentation process, this is the source code view of the `innerTest`\
    \ method of `DataProducer$User.class`:\n\n```\npublic class DataProducer$User{\n\
    \    public String innerTest() {\n        return \"com.millionstrengthknowledge.interceptorprj.repository.DataProducer$User\"\
    ;\n    }\n    //Other code is omitted\n}\n```\n\nThis is the source code view\
    \ of the `innerTest` method of `DataProducer$User$1.class`:\n\n```java\nclass\
    \ DataProducer$User$1 implements Runnable{\n    public String innerTest() {\n\
    \        return \"com.millionstrengthknowledge.interceptorprj.repository.DataProducer$User$1\"\
    ;\n    }\n    //Other code is omitted\n}\n```\n\nThe `innerTest` method are also\
    \ added to the `UserEntityUtil.java`, and `Address.java`, and the another anonymous\
    \ class: `DataProducer$User$UserEntityUtil$1.java`.\n\n221\n\n![](Image00000.gif)\n\
    \n### Intercepting method of inner class and anonymous class\n\nAfter that, the\
    \ plugin program uses `visit` method to intercept the `InnerClassAdvice.class`\
    \ advice code to all the method of inner class and anonymous class, excepts the\
    \ `innerTest` method:\n\n```\nbuilder.visit(\n    Advice.to(InnerClassAdvice.class)\n\
    \    .on(\n        ElementMatchers.isMethod().and(\n            ElementMatchers.not(\n\
    \                ElementMatchers.named(\"innerTest\")\n            )\n       \
    \ )\n    )\n);\n```\n\nThis is the source code of `InnerClassAdvice.class`:\n\n\
    ```java\npublic class InnerClassAdvice {\n    @OnMethodEnter\n    public static\
    \ void start(\n        @Advice.Origin(\"#t\") String mtdDeclrType,\n        @Advice.Origin(\"\
    #m\") String mtdName\n    ) {\n        System.out.println(\"OnMethodEnter Advice:\
    \ \"++mtdDeclrType+\" \"++mtdName);\n    }\n}\n```\n\nThe `InnerClassAdvice.java`\
    \ implements one `on method enter` advice. The advice code prints the name of\
    \ the Java class and the method of the functional code.\n\n222\n\n![](Image00000.gif)\n\
    \nAfter the instrumentation process, this is the source code view of the `getName`\
    \ of `DataProducer$User.class` (the highlighted code is the generated code based\
    \ on the advice code):\n\n```java\npublic String getName() {\n    System.out.println(\"\
    OnMethodEnter Advice: \" + \"com.millionstrengthknowledge.interceptorprj.repository.DataProducer$User\"\
    \ + \" \" +“getName\");\n    var var1 = new 1(this);\n    var1.run();\n    return\
    \ this.name;\n}\n```\n\nThis is the source code view of the `run` method of `DataProducer$User$1.class`\
    \ (the highlighted code is the generated code based on the advice code):\n\n```java\n\
    public void run() {\n    System.out.println(\"OnMethodEnter Advice: \"+“com.millionstrengthknowledge.interceptorprj.repository.DataProducer$User$1”\
    \ + \" \" +“run\");\n    System.out.println(\"getName anonymous class\");\n}\n\
    ```\n\n`RepositoryPlugin` does not instrument the inner class of `DataReader.class`.\
    \ Observed that the instrumentation process does not add `innerTest` method to\
    \ `Storage.java` and `Util.java` inner class of `DataReader.java`. This is because\
    \ `Storage.java` and `Util.java` are the inner classes that are generated after\
    \ the plugin program starts. Therefore, the plugin program does not include the\
    \ newly generated inner class to the instrumentation process.\n\n223\n\n![](Image00000.gif)\n\
    \n### Conclusion\n\nThis chapter explains about how to add inner class to the\
    \ existing Java class, and how to intercept the inner class and anonymous class\
    \ of the existing Java class.\n\n224\n\n![](Image00000.gif)\n\n### Chapter 19:\
    \ Generate Java Interface, Enum, Annotation, Subclass, and Abstract Class\n\n\
    This chapter explains on how to generate Java Interface, enum, annotation, and\
    \ subclass dynamically. The source code of this chapter is included in ChapterDefineInterface\
    \ project.\n\n`InterceptorPlugin.java` is the main plugin program for this chapter.\
    \ The plugin program implements all the logic of code generation. The plugin program\
    \ matches `User.java` in `com.millionstrengthknowledge.interceptorprj.entity`\
    \ package for the instrumentation process.\n\nThe `apply` method firstly declares\
    \ a `java.io.File` variable `dir` to contain the reference to the directory that\
    \ stores the compiled Java class.\n\n```java\nFile dir = new File(\"C:\\\\Users\\\
