    \n    @Advice.OnMethodEnter\n    public static void methodStart(\n        int\
    \ param1,\n        String param2,\n        @Advice.Origin String mtd,\n      \
    \  @Advice.Origin(\"#t\") String mtdDeclrType,\n        @Advice.Origin(\"#m\"\
    ) String mtdName,\n        @Advice.Origin(\"#d\") String mtdDescr,\n        @Advice.Origin(\"\
    #s\") String mtdParamType,\n        @Advice.Origin(\"#r\") String mtdReturn,\n\
    \        @Advice.Argument(0) int id,\n        @Advice.Argument(1) String data,\n\
    \        @Advice.AllArguments Object[] params,\n        @Advice.This Object thiz,\n\
    \        @Advice.FieldValue(\"recordId\") int data1,\n        @Advice.FieldValue(\"\
    descr\") String data2,\n        @Advice.Unused String unusedParam\n    ) {\n \
    \       // code is omitted\n    }\n\n    @Advice.OnMethodExit\n    public static\
    \ void methodEnd(\n        @Advice.Return(typing=Assigner.Typing.DYNAMIC) Object\
    \ returnObject\n    ) {\n        // code is omitted\n    }\n}\n```\n\n35\n![](Image00000.gif)\n\
    \nParsed that various types of annotation have been applied to the parameters\
