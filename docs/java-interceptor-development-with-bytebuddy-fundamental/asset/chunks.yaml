    .defineMethod(“description”, String.class, Visibility.PUBLIC)

    .withoutCode()

    ```


    Java 注角的属性是方法格式的。因此，插件程序使用 `defineMethod` 方法为 `EntityAnnotation.class` 创建 `name`
    和 `description` 属性。有了此声明，`EntityAnnotation.class` 在此阶段应该具有以下结构：


    ```java

    @Retention(RetentionPolicy.RUNTIME)

    @Target({java.lang.annotation.ElementType.TYPE,

    java.lang.annotation.ElementType.CONSTRUCTOR,

    java.lang.annotation.ElementType.METHOD})

    public @interface EntityAnnotation{

    String name();

    String description();

    }

    ```


    232

    ![](img/Image00000.gif)


    ### (7) 完成配置并生成 Java 注解的 Java 类


    `.make()`


    ### (8) 将新注解的 Java 类保存到磁盘


    `.saveIn(dir)`


    最后，`createAnnotation` 方法已经完整创建了 `EntityAnnotation`。在 `createAnnotation` 方法退出之前，该方法想要返回
    `EntityAnnotation` 的 `AnnotationDescription` 实例，因为插件程序想要使用该实例将 `@ EntityAnnotation`
    添加到 `User.class`。因此，此行代码将 `EntityAnnotation` 的 `java.lang.Class` 加载到 `entityVar`
    变量：


    ```

    Class entityVar=Class.forName(“com.millionstrengthknowledge.interceptorprj.entity.EntityAnnotation”);

    ```


