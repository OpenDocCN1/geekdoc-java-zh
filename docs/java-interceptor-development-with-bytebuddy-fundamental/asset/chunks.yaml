    第 1 章：简介


    ByteBuddy 是一个基于 Java 的开源库，用于 Java 字节码的生成和操作。ByteBuddy 采用 Apache License 2.0 许可，可以在
    Github 上免费获取。本书使用“instrument”（instrument）来描述字节码的生成、操作和拦截。本书提供了示例代码，展示如何利用 ByteBuddy
    能力通过修改字节码来拦截、添加、修改和删除一个或多个 Java 类的功能。


    通过 ByteBuddy，增强过程可以在 maven 构建期间或应用程序运行时发生。


    现代应用程序本质上往往是复杂的，因为程序需要满足不同类型的需求，例如功能性需求和非功能性需求。这些应用程序包含多个模块，每个模块都有自己的功能代码。由于非功能性需求，功能代码被非功能性代码包围，例如安全处理、日志记录、性能监控、用于按需计费的资源使用追踪、DevOps
    相关处理等。


    ```java

    public double calculatePrice(){


    double discount = getDiscount();

    return this.price + this.deliveryCharge -


    discount;

    }

    ```


