    `makeInterface` 方法配置 `ByteBuddy` 实例以生成一个 Java 接口。在这个示例中，Java 接口想要扩展 `java.io.Serializable`。为了实现这一目的，插件程序将
    `java.io.Serializable` 的 Java 类传递给 `makeInterface` 方法的参数。请注意，该参数是可选的。如果 Java 接口不需要扩展其他
    Java 接口，则只需留空参数即可。


    ### (3) 为 Java 接口配置名称


    `.name(“com.millionstrengthknowledge.interceptorprj.entity.EntityIntf”)`


    `name` 方法用于创建 Java 接口的名称。该参数必须是全限定类名。


    ### (4) 为 Java 接口配置方法


    ```

