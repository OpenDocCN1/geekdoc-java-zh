    ```java

    System.out.println(mtdName);

    ```


    在屏幕上打印此字符串值：


    ```text

    create

    ```


    37


    ![](img/Image00000.gif)


    `@Origin(“#d”)` 注解提供了 `create` 方法的方法描述符。例如，


    参数：`@Advice.Origin(“#d”) String mtdDescr`


    ```java

    System.out.println(mtdDescr);

    ```


    在屏幕上打印此字符串值：


    ```text

    (ILjava/lang/String;)V

    ```


    `@Origin(“#s”)` 注解提供了一个列出 `create` 方法所有参数数据类型的字符串。例如，


    参数：`@Advice.Origin(“#s”) String mtdParamType`


    ```java

    System.out.println(mtdParamType);

    ```


    在屏幕上打印此字符串值，因为 `create` 方法的参数使用了 `int` 和 `String`：


    ```text

    (int,java.lang.String)

    ```


    `@Origin(“#r”)` 注解提供了功能方法的返回类型。例如，


    参数：`@Advice.Origin(“#r”) String mtdReturn`


    ```java

    System.out.println(mtdReturn);

    ```


    在屏幕上打印此字符串值，因为 `create` 方法返回 `void`：


    ```text

    void

    ```


    ### @Argument

    `@Argument` 注解提供了 `create` 方法参数的值。该注解接受一个整数参数，表示方法参数的索引号。例如，`InterceptorProgram.java`
    调度了：


    ```java

    new DataProducer.create(10000, ”testValue”);

    ```


    38


    ![](img/Image00000.gif)


    参数：


    `@Advice.Argument(0) int id`

    `@Advice.Argument(1) String value`


    ```java

    System.out.println(id+” “+value);

    ```


    在屏幕上打印此字符串值：


    ```text

    10000 testValue

    ```


    索引 `0` 表示第一个参数，索引 `1` 表示第二个参数，依此类推。


    ### @AllArguments

    `@AllArguments` 注解以对象数组格式提供 `create` 方法所有参数的值。例如，`InterceptorProgram.java` 调度了：


    ```java

    new DataProducer.create(10000, ”testValue”);

    ```


    参数：


    `@Advice.AllArguments Object[] params`


    ```java

    System.out.println(params[0]+” ”+params[1]);

    ```


    在屏幕上打印此字符串值：


    ```text

    10000 testValue

    ```


    ### @This

    `@This` 注解提供了功能代码的 Java 对象。例如，


    参数：`@Advice.This Object thiz`


    ```java

    System.out.println(thiz.getClass().getName());

    ```


    在屏幕上打印此字符串值：


    ```text

    com.millionstrengthknowledge.interceptorprj.program.DataProducer

    ```


    39


    ![](img/Image00000.gif)


    ### @FieldValue

    `@FieldValue` 注解提供了功能代码实例变量的值。该注解接受一个表示实例变量名的参数。例如，`DataProducer.java` 声明了这两个实例变量：


    ```java

    public int recordId=1;

    private String descr=”privateData”;

    ```


    参数：


    `@Advice.FieldValue(“recordId“) int data1`

    `@Advice.FieldValue(“descr“) String data2`


    ```java

    System.out.println(data1+” ”+data2);

    ```


    在屏幕上打印此字符串值：


    ```text

    1 privateData

    ```


    ### @Unused

    `@Unused` 注解表示该参数仅供 `LogInterceptor.java` 中的 `methodStart` 方法内部使用。它没有映射到功能代码的能力。它只是一个标记注解，表示该参数不映射到功能方法的任何参数。例如，


    参数：


    `@Advice.Unused String unusedParam`


    如果 `methodStart` 方法的参数没有任何注解且索引与功能方法的索引不匹配，插桩过程将在 Maven 构建过程中失败。


    40


    ![](img/Image00000.gif)


    ### @Return

    `@Return` 注解仅适用于标记了 `@OnMethodExit` 注解的建议方法。`@Return` 提供了 `create` 方法的返回值。例如，


    参数：`@Advice.Return(typing=Assigner.Typing.DYNAMIC) Object returnObject`


    ```java

    System.out.println(returnObject);

    ```


    在屏幕上打印此字符串值：


    ```text

    null

    ```

    观察到方法的返回值。`@Return` 注解为 void 指定值。`@Return` 属性必须是 `Assigner.Typing.DYNAMIC`。对于
    `void` 返回，`DYNAMIC` 是必须的。

