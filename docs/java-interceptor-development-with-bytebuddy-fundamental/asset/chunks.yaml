    \ The filter is the new concept in this chapter, and it is one of the techniques\
    \ userd to implement the matching logic. To get the instance of `FilterableList`,\
    \ invokes the `getDeclaredAnnotations` method of `TypeDescription`. The `getDeclaredAnnotations`\
    \ returns an instance of `FilterableList`, which contains the list of annotation\
    \ that the Java class uses at class level. The `FilterableList` has a `filter`\
    \ method that can apply `ElementMatchers`. In this example, the filter uses `ElementMatchers.anyOf`\
    \ method:\n\n```java\nint annotationFound=target.getDeclaredAnnotations().filter(\n\
    \    ElementMatchers.anyOf(\n        AnnotationDescription.Builder.ofType(QueryType.class).build(),\n\
    \        AnnotationDescription.Builder.ofType(GenericQueryType.class)\n      \
    \  .build()\n    )\n).size();\n```\n\nIn this example, the filter selects the\
    \ Java class that uses either `@QueryType` or `@GenericQueryType`. The `anyOf`\
    \ method returns true when any one of its parameter fulfills the matching criteria.\n\
    \nThen the `size` method returns the number of items in the filtered list. The\
    \ `size` method returns zero if the list is empty, that means no object in the\
    \ list fulfill the matching criteria. Otherwise, there will be at least one object\
