    \ Eclipse 项目中，该项目的结构如下：\n\n![](img/Image00022.jpg)\n\n61\n\n![](img/Image00000.gif)\n\
    \n本章使用了两个 advice 代码：`PerfObjectReturnInterceptor.java` 和 `PerfVoidReturnInterceptor.java`。`PerfObjectReturnInterceptor.java`\
    \ 用于拦截有返回对象的泛方法，而 `PerfVoidReturnInterceptor.java` 用于拦截返回 void 值的泛方法。\n\n这是本章的功能性代码：\n\
    \n```java\npublic class DataProducer {\n    public void create() {\n        System.out.println(“create\
    \ data”);\n    }\n    public String createData() {\n        String uniqueId=UUID.randomUUID().toString();\n\
    \        return new String(\n            Base64.getEncoder().encode(\n       \
    \         uniqueId.getBytes()),\n            Charset.forName(“UTF-8”)\n      \
    \  );\n    }\n}\n```\n\n`create` 方法在屏幕上打印状态字符串“create data”。`createData` 方法返回一个\
    \ base64 编码的 UUID。\n\n这是 `InterceptorPlugin.java` 中 `apply` 方法的实现：\n\n```java\n\
    public Builder<?> apply(\n    Builder<?> builder, TypeDescription td,\n    ClassFileLocator\
    \ cfl\n) {\n    return builder\n        .method(ElementMatchers.named(“create”))\n\
    \        .intercept(\n            MethodDelegation.to(\n                PerfVoidReturnInterceptor.class)\n\
    \        )\n        .method(ElementMatchers.named(“createData”))\n        .intercept(\n\
    \            MethodDelegation.to(\n                PerfObjectReturnInterceptor.class));\n\
    }\n```\n\n62\n\n![](img/Image00000.gif)\n\n### 用于 create 方法的 Around Advice\n\n\
    在 `apply` 方法中，调用了 `builder` 的 `method` 方法。`method` 方法使用 `ElementMatchers.named`\
    \ 构建匹配逻辑。`named` 方法使用“create”作为其参数值：\n\n```java\nbuilder.method(ElementMatchers.named(“create”))\n\
    ```\n\n因此，`DataProducer.java` 中的 `create` 方法被选中插桩。之后，插件程序调用了 `builder` 的 `intercept`\
    \ 方法。`intercept` 方法的参数指定了 `MethodDelegation.to(PerfVoidReturnInterceptor.class)`：\n\
    \n```java\nreturn builder\n    .method(ElementMatchers.named(“create”))\n    .intercept(\n\
    \        MethodDelegation.to(PerfVoidReturnInterceptor.class)\n    )\n```\n\n\
    这些方法与方法进入/退出 advice 完全不同。首先，`builder` 调用 `intercept` 方法来执行插桩，而不是 `visit` 方法。插桩随后使用了\
    \ `MethodDelegation.to` 而不是 `Advice.to` 方法。匹配逻辑通过 `method` 方法实现，而不是通过 `Advice.to`\
    \ 方法链中的 `on` 方法。\n\n63\n\n![](img/Image00000.gif)\n\n这是 `PerfVoidReturnInterceptor.java`\
    \ 的代码：\n\n```java\npublic class PerfVoidReturnInterceptor {\n    public static\
    \ Logger logger=\n    Logger.getLogger(\n        PerfVoidReturnInterceptor.class.getName());\n\
    \    public static void aroundVoid(\n        @SuperCall Runnable targetCode,\n\
    \        @Origin Method method){\n        long startTime=\n        System.currentTimeMillis();\n\
    \        logger.log(Level.INFO,“Method start”);\n        targetCode.run();\n \
    \       logger.log(Level.INFO,“Method end: “+\n            method.getName()+”\
    \ execution time: “+\n            (System.currentTimeMillis()-startTime));\n \
    \   }\n}\n```\n\n支持 void 返回的 around advice 要求如下：\n\n- advice 方法是静态方法（第 6 行）。\n\
    - advice 方法返回 void（第 6 行）。\n- advice 方法有一个 `java.lang.Runnable` 参数，并标注了 `@SuperCall`（第\
    \ 7 行）。\n\n在本例中，`aroundVoid` 方法是 advice 方法。ByteBuddy 根据 `aroundVoid` 方法生成插桩代码。advice\
    \ 代码目的是测量功能代码的运行时性能。`targetCode` 参数代表功能代码：`DataProducer` 中的 `create` 方法。\n\n64\n\
    \n![](img/Image00000.gif)\n\n方法委托生成的字节码与 `visit` 方法不同。为了进一步理解差异，查看生成的字节码的 Java\
    \ 源：\n\n```java\npublic class DataProducer{\n    public DataProducer(){ }\n  \
    \  public void create(){\n        class auxiliary.mxySqow\n        implements\
    \ Runnable, Callable{\n            public void run(){\n                argument0.createOriginal();\n\
    \            }\n            public Object call(){\n                argument0.createOriginal();\n\
    \                return null;\n            }\n            private DataProducer\
    \ argument0;\n            auxiliary.mxySqow(){\n                argument0 = DataProducer.this;\n\
    \            }\n        }\n        PerfVoidReturnInterceptor.aroundVoid(\n   \
    \         new auxiliary.mxySqow(), mtd);\n    }\n    private void createOriginal(){\n\
    \        System.out.println(“create data”);\n    }\n    private static final Method\
    \ mtd =\n    DataProducer.class.getMethod(“create”);\n    //other code is omitted\n\
    }\n```\n\n65\n\n![](img/Image00000.gif)\n\n在生成的字节码中，ByteBuddy 创建了一个新的私有方法 `createOriginal`，并将原始\
    \ `create` 方法的内容复制到该方法中（第 32-34 行）。\n\n随后，ByteBuddy 修改了 `create` 方法。ByteBuddy\
    \ 在 `create` 方法内部声明了一个名为 `auxiliary.mxySqow` 的内部类。该内部类就是代理类。代理类包含了功能代码的引用：`DataProducer.java`\
    \ 中的 `create` 方法。代理类使用 `argument0` 来存储该引用（第 19 行），该引用被传递了。\n\n66\n\n![](img/Image00000.gif)\n\
    \n"
