    \ 属性。如果织入代码抛出的异常等于 `onThrowable` 属性中定义的异常类或派生类，则织入方法的执行将继续执行建议方法。\n\n观察到 `methodEnd`\
    \ 的参数 `excp` 使用了 `@Thrown` 注解。该参数捕获了从织入方法抛出的异常。例如，如果织入方法抛出 `IllegalArgumentException`，那么\
    \ `excp` 参数的值将是从织入方法抛出的 `IllegalArgumentException` 实例。\n\n要修改织入方法抛出的异常，必须将 `@Thrown`\
    \ 注解的 `readOnly` 属性设置为 `false`。\n\n在此示例中，建议方法捕获了异常并在屏幕上打印异常类及其异常消息。织入代码没有抛出异常，因为建议代码在第\
    \ 30 行抑制了异常：\n\n```java\nexcp = null;\n```\n\n如果建议代码中删除了第 30 行，那么织入方法将抛出异常：\n\n\
    ```\nAug 01, 2020 1:00:00 PM com.millionstrengthknowledge\n.interceptorprj.program.DataProducer\
    \ create\nINFO: Method end with exception:\n==========================\nException\
    \ type: java.lang.IllegalArgumentException\nException message: Data cannot be\
    \ null\nException in thread “main” java.lang.IllegalArgumentException: data cannot\
    \ be null\nat com.millionstrengthknowledge.interceptorprj.program.DataProducer.create(DataProducer.java:5)\n\
    at com.millionstrengthknowledge.interceptorprj.program.InterceptorProgram.main(InterceptorProgram.java:14)\n\
    ```\n\n如果 `InterceptorProgram.java` 变为这一行代码：\n\n```java\nnew DataProducer().createData(“create”);\n\
    ```\n\n那么织入后的代码将在屏幕上产生此结果：\n\n```\ncreate data: test\nOct 1, 2020 1:00:00 PM com.millionstrengthknowledge\n\
    .interceptorprj.program.DataProducer create\nINFO: Method end with no exception\n\
    ```\n\n### @Thrown 注解参数的数据类型\n\n`excp` 参数的数据类型必须是与织入代码中抛出的异常类的相同类或其派生类。否则，织入后的代码将抛出运行时异常\
    \ - `java.lang.ClassCastException`。例如：\n\n```java\npublic static void methodEnd(\n\
    \    @Advice.Thrown(readOnly=false) Error excp)\n```\n\n观察到 `excp` 参数的数据类型为 `java.lang.Error`，这将导致在应用程序运行时出现\
    \ `ClassCastException`，因为 Java 无法将 `java.lang.IllegalArgumentException` 强制转换为\
    \ `java.lang.Error`。\n\n### onThrowable 属性的数据类型\n\n建议代码只能有一个方法退出建议。因此，为了在建议方法中管理所有异常类型，`onThrowable`\
    \ 属性应使用 `Throwable.class`，这允许建议方法捕获 `java.lang.Exception` 和 `java.lang.Error`，以及\
    \ `java.lang.Exception` 和 `java.lang.Error` 的派生类。\n\n如果织入代码抛出的异常与 `onThrowable`\
    \ 属性中指定的类不匹配，建议方法将被跳过。例如，使用此配置：\n\n```java\n@Advice.OnMethodExit(onThrowable=Exception.class)\n\
    ```\n\n如果织入代码抛出 `java.lang.Error`，则建议方法将被跳过。\n\n### 从建议方法抛出新异常\n\n建议方法可以抛出新异常，这将更改从织入代码抛出的原始异常。如果将\
    \ `Interceptor.java` 第 30 行替换为这一行：\n\n```java\nthrow new RuntimeException(“Runtime\
    \ exception”);\n```\n\n那么织入代码将抛出 `RuntimeException`。\n\n如果建议方法抛出受检异常而非 `RuntimeException`，并且\
    \ `methodEnd` 增加了 `throws` 子句：\n\n```java\n@Advice.OnMethodExit(onThrowable=Throwable.class)\n\
    public static void methodEnd(\n    @Advice.Thrown(readOnly=false) Throwable excp\n\
    ) throws Exception {\n    throw new Exception(“checked exception”);\n}\n```\n\n\
    织入代码也将抛出受检异常，类似于在建议方法中抛出 `RuntimeException`。\n\n然而，请注意 `DataProducer.java` 中的\
    \ `create` 方法没有 `throws` 子句：\n\n```java\npublic class DataProducer {\n    public\
    \ void create(String data) {\n        if(data==null)\n            throw new IllegalArgumentException(“Data\
    \ cannot be null”);\n        System.out.println(“create data: “+data);\n    }\n\
    }\n```\n\n根据 Java 编译过程，方法抛出受检异常时必须声明 `throws` 子句。否则，程序将收到编译错误。但在 Java 字节码格式中，当程序抛出异常时\
    \ throw 句 是可选的。因此生成的代码执行没有运行时错误。\n\n这就是 Java 编程与 Java 字节码编程之间的重要区别。Java 编程处理 Java\
    \ 文件，而 Java 字节码编程处理 Java 类文件。它们具有不同的语法，异常管理只是示例之一。\n\n### 总结\n\n本章介绍了：\n\n- 如何使用\
    \ `@OnMethodExit` 注解的 `onThrowable` 属性管理异常\n- 如何通过 `@Thrown` 注解参数将从织入代码抛出的异常映射到建议方法\n\
