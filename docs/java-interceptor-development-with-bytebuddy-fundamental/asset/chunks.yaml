    ## 第 17 章：ElementMatchers\n\n本章提供了如何使用 `net.bytebuddy.matcher.ElementMatchers`\
    \ 来构建匹配逻辑的示例。在之前的章节中，本书演示了 `ElementMatchers` 的一些用法示例：\n\n- `named`\n- `takesArgument`\n\
    - `takesNoArgument`\n- `isConstructor`\n- `isDefaultConstructor`\n\n本章将提供更多 `ElementMatchers`\
    \ 的用法示例。本章将使用三个插件程序：`InterceptorUtilPlugin.java`、`InterceptorRepositoryPlugin.java`\
    \ 和 `InterceptorQueryPlugin.java`。这些插件将对以下包中的 Java 类进行插桩：\n\n`com.millionstrengthknowledge.interceptorprj.repository`\n\
    - `AuthenticationQuery.class`\n- `DataQuery.class`\n- `GeneralRepository.class`\n\
    - `UserQuery.class`\n- `UserRepository.class`\n\n`com.millionstrengthknowledge.interceptorprj.util`\n\
    - `DataProducerUtil.class`\n\n178\n\n![](img/Image00000.gif)\n\n本章源代码包含在 `ChapterElementMatcher`\
    \ Eclipse 项目中。repository 包中有五个 Java 类，util 包中有一个 Java 类。为了演示 `ElementMatchers`\
    \ 的用法，当 `ElementMatchers` 匹配准则返回真时，插件程序会在 Java 元素上添加一个 `@ElementMatched` 注解。这些\
    \ Java 元素可以是 Java 类、构造函数、方法或实例变量。\n\n"
- fmt: "\nSo far all of the chapters only uses the `getName` method of the `net.bytebuddy.description.type.TypeDescription`.\
    \ The `TypeDescription` is the fundamental Java class used in ByteBuddy programming.\
    \ The `TypeDescription` provides a set of API that allows developer to inspect\
    \ the Java class. It is similar to Java Reflection API, but provides more functionality.\
    \ In `InterceptorUtilPlugin.java`, the `matches` method uses the `isGenerified`\
    \ method of `TypeDescription`, this the code of the implementation:\n\n```java\n\
    if(target.getName().startsWith(\"com.millionstrengthknowledge.interceptorprj.util\"\
    )&& target.isGenerified()) {\n    System.out.println(\"InterceptorUtilPlugin found\
    \ target: \"+target.getName());\n    return true;\n}\nelse\n    return false;\n\
    }\n```\n\nThe `target` variable is a parameter from the `matches` method, and\
    \ it is an instance of `TypeDescription`. The matching logic returns true when\
    \ the Java class represented in `target` variable is packaged in `com.millionstrengthknowledge.interceptorprj.util`\
    \ package, and the target is a generic class. The `isGenerified` method return\
    \ true when the target Java class uses type argument at class level. The `DataProducerUtil.java`\
    \ is the generic Java class the uses one type argument `A` at class level:\n\n\
    ```java\npublic class DataProducerUtil<A> {\n    //code is omitted\n}\n```\n\n\
    Therefore, the `DataProducerUtil.java` matches the condition provided in the matching\
    \ logic, and it is going to continue to apply method of `InterceptorUtilPlugin.java`\
    \ for further instrumentation process.\n\n### ElementMatchers.isSetter\n\nThere\
    \ are eight visit methods in `apply` method. This is the implementation of the\
    \ first visit method:\n\n```java\nbuilder.visit(new MemberAttributeExtension.ForMethod()\n\
    \    .annotateMethod(ElementMatcherUtil.create(\"isSetter(uniqueId)\"))\n    .on(ElementMatchers.isSetter(\"\
    uniqueId\")));\n```\n\nThe `visit` method uses `MemberAttributeExtension.ForMethod`\
    \ to instrument the Java class. The instrumentation add the `@ElementMatched(\"\
    isSetter(uniqueId)\")` to the setter method that uses `uniqueId` instance variable.\
    \ After instrumentation process, the `setUniqueId` method of `DataProducerUtil.class`\
    \ is added the annotation:\n\n```java\n@ElementMatched(\"isSetter(uniqueId)\"\
    )\npublic void setUniqueId(long id){ uniqueId=id; }\n```\n\nThe main focus here\
    \ is how the program applies the `ElementMatchers` to match the target Java element\
    \ to add the annotation. In this example, `ElementMatchers.isSetter` method is\
    \ used. The `isSetter` method is the matcher that matches the setter method with\
    \ the name of instance variable specified in the parameter. This example uses\
    \ `uniqueId` for its parameter. Therefore, `setUniqueId` method is selected to\
    \ add the annotation.\n\n### ElementMatcherUtil\n\n`ElementMatcherUtil.java` is\
    \ a utility Java class:\n\n```java\npublic class ElementMatcherUtil {\n    public\
    \ static AnnotationDescription create(String type) {\n        AnnotationDescription\
    \ a = AnnotationDescription.Builder.ofType(ElementMatched.class)\n           \
    \ .define(\"value\", type)\n            .build();\n        return a;\n    }\n\
    }\n```\n\nThe `ElementMatcherUtil.java` has one method named `create`. The method\
    \ accepts one `java.lang.String` parameter. The method creates an instance of\
    \ `AnnotationDescription` that represents `ElementMatched.class`. `ElementMatched.java`\
    \ is a customized Java annotation used in this chapter:\n\n```java\n@Retention(RetentionPolicy.RUNTIME)\n\
    @Target({\n    ElementType.TYPE,\n    ElementType.CONSTRUCTOR,\n    ElementType.METHOD,\n\
    \    ElementType.FIELD\n})\npublic @interface ElementMatched {\n    String value();\n\
    }\n```\n\nThe annotation has one value attribute. The data passed from the parameter\
    \ of `create` method of `ElementMatcherUtil.java` will be stored into the `value`\
    \ attribute. For example, when the program invokes `ElementMatcherUtil.create(\"\
    isSetter(uniqueId)\")`, this program will annotate an annotation `@ElementMatched(\"\
    isSetter(uniqueId)\")` via the `annotateMethod` method of `MemberAttributeExtension.ForMethod.java`.\n\
    \nSo that is how the `ElementMatcherUtil.java` adds the `@ElementMatched` annotation\
    \ to the functional code. This utility Java class will be reused in all of the\
    \ examples in this chapter.\n\n### ElementMatchers.isGetter\n\nThe second visit\
    \ method adds the `@ElementMatched` annotation to the getter method for `uniqueId`\
    \ instance variable:\n\n```java\nbuilder.visit(new MemberAttributeExtension.ForMethod()\n\
    \    .annotateMethod(ElementMatcherUtil.create(\"isGetter(uniqueId)\"))\n    .on(ElementMatchers.isGetter(\"\
    uniqueId\")));\n```\n\nFor this purpose, the `ElementMatchers.isGetter` method\
    \ is used to match the getter method. After instrumentation process, the `@ElementMatched(\"\
    isGetter(uniqueId)\")` is added to `getUniqueId` method of `DataProducerUtil.class`:\n\
    \n```java\n@ElementMatched(\"isGetter(uniqueId)\")\npublic long getUniqueId()\
    \ { return uniqueId; }\n```\n\n### ElementMatchers.isAnnotatedWith\n\nNext, the\
    \ `visit` method uses `ElementMatchers.isAnnotatedWith` method:\n\n```java\nbuilder.visit(new\
    \ MemberAttributeExtension.ForMethod()\n    .annotateMethod(ElementMatcherUtil.create(\"\
    isAnnotatedWith(Deprecated.class)\"))\n    .on(ElementMatchers.isAnnotatedWith(Deprecated.class)));\n\
    ```\n\nThe `isAnnotatedWith` method returns true when the method is annotated\
    \ with the annotation that is specified in the parameter. In this example, this\
    \ annotation is the `@Deprecated` annotation. Therefore, the test method of `DataProducerUtil.class`\
    \ is selected to add the annotation because the test method is annotated with\
    \ `@Deprecated`:\n\n```java\n@ElementMatched(\"isAnnotatedWith(Deprecated.class)\"\
    )\n@Deprecated\npublic void test(){ }\n```\n\n### ElementMatchers.isConstructor\n\
    \nNext, the `visit` method uses `ElementMatchers.isConstructor` method:\n\n```java\n\
    builder.visit(new MemberAttributeExtension.ForMethod()\n    .annotateMethod(ElementMatcherUtil.create(\"\
    isConstructor\"))\n    .on(ElementMatchers.isConstructor()));\n```\n\nThe `isConstructor`\
    \ method returns true when the constructor is detected in Java class. There are\
    \ two constructors in `DataProducerUtil`. Therefore, these two constructors are\
    \ added the annotation:\n\n```java\n@ElementMatched(\"isConstructor\")\npublic\
    \ DataProducerUtil(){ }\n\n@ElementMatched(\"isConstructor\")\npublic DataProducerUtil(long\
    \ id){ }\n```\n\nThe `ElementMatchers` has the ability to match all the Java elements\
    \ that fulfills the matching criteria, for example, the `isConstructor` matches\
    \ all the constructor in the Java class. Sometime the program wants to match only\
    \ the specify element. If this is the case, then the program requires to provide\
    \ more `ElementMatchers` to form the combination of matchers to find the specific\
    \ match. This can be done with the `and`, `or`, and other method provided by the\
    \ `ElementMatchers`.\n\nThere is some other technique that can help in programming\
    \ the specific match. For example, `ElementMatchers.isFinal` method return true\
    \ for all the Java element that are final, including method and instance/class\
    \ variable. However, the `MemberAttributeExtension.ForMethod` is used to limit\
    \ the matching to Java method only and `MemberAttributeExtension.ForField` is\
    \ used to limit the matching to instance/class variable only. So, two visit methods\
    \ are required to annotate the method and instance variable respectively in the\
    \ next example:\n\n```java\nbuilder.visit(new MemberAttributeExtension.ForMethod()\n\
    \    .annotateMethod(ElementMatcherUtil.create(\"isFinal-method\"))\n    .on(ElementMatchers.isFinal()))\n\
    .visit(new MemberAttributeExtension.ForField()\n    .annotate(ElementMatcherUtil.create(\"\
    isFinal-field\"))\n    .on(ElementMatchers.isFinal()));\n```\n\nWith these two\
    \ visit methods, this is the result of instrumentation process on `DataProducerUtil.class`:\n\
    \n```java\n@ElementMatched(\"isFinal-field\")\nprivate final String record=\"\"\
    ;\n\n@ElementMatched(\"isFinal-method\")\nprivate final void process(){ }\n```\n\
    \nThe record instance variable and process method are selected to add the `@ElementMatched`\
    \ annotation because there are final Java elements. Another technique to limit\
    \ the `isFinal` matcher to method and instance variable only when `ForMethod`\
    \ and `ForField` are not used:\n\n```java\nElementMatchers.isFinal().and(ElementMatchers.isMethod());\n\
    ```\n"
