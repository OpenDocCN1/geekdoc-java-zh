- fmt: "\nThe `isMemberType` method provide the status of member class type in boolean\
    \ value. `Storage.java` is an inner class and it is declared in `DataReader.java`.\
    \ So the method should return `true` because the `Storage.java` is the member\
    \ class of `DataReader.java`:\n\n```java\npublic boolean isMemberType(){\n   \
    \ return true;\n}\n```\n\n# Generate first level inner class\n\nThe `firstInnerTd`\
    \ is an instance of `TypeDescription.Latent`. The inner class is in `TypeDescription`\
    \ format at this stage, and not yet in Java class format. To convert `TypeDescription`\
    \ to Java class format, the plugin program needs to use `net.bytebuddy.ByteBuddy`\
    \ for this purpose:\n\n```java\nDynamicType.Builder<?> firstInnerBuilder=\nnew\
    \ ByteBuddy()\n  .subclass(Object.class)\n  .name(firstInnerTd.getName())\n  .innerTypeOf(td).asMemberType()\n\
    \  .defineMethod(“createUuid”, String.class, Visibility.PUBLIC)\n  .intercept(FixedValue.nullValue());\n\
    ```\n\n**(1) Instantiate an instance of `ByteBuddy`**\n\n```java\nnew ByteBuddy()\n\
    ```\n\nThe instance of `ByteBuddy` is the entry point to the instrumentation process.\
    \ The instance is used to configure the instrumentation behavior. All the previous\
    \ chapters does not require to instantiate the instance of `ByteBuddy` because\
    \ the plugin program will create one implicitly during the maven build time. The\
    \ new instance is required here because the plugin program wants to use `subclass`\
    \ method to create new Java inner class. The `subclass` method is not available\
    \ via `DynamicType.Builder`.\n\n**(2) Configure the instrumentation process to\
    \ create a new Java class that extends the `java.lang.Object`**\n\n```java\n.subclass(Object.class)\n\
    ```\n\nThe `subclass` method instructs the instrumentation process to use inheritance\
    \ in Object oriented programming of Java. That mean the generated Java class is\
    \ a derived class of `java.lang.Object`. This looks redundant because the `firstInnerTd`\
    \ has already specifies the superclass in the constructor of `TypeDescription.Latent`.\
    \ However, this configuration is used for the generation of Java class, the `Latent`\
    \ is used for constructing the `TypeDescription`.\n\n**(3) Configure the name\
    \ for the inner class**\n\n```java\n.name(firstInnerTd.getName())\n```\n\nThe\
    \ `name` method provides the fully qualified class name of the generated Java\
    \ class. So the method invokes the `getName` method of `firstInnerTd` to get the\
    \ fully qualified class name of the `Storage.java`.\n\n**(4) Configure the top\
    \ outer class of the inner class**\n\n```java\n.innerTypeOf(td).asMemberType()\n\
    ```\n\nThe `innerTypeOf` method specifies the top outer class for the inner class.\
    \ The `td` is the instance of `TypeDescription`, which is obtained from the second\
    \ parameter of `apply` method. The `td` represents the instance of `DataReader.class`,\
    \ which is the top outer class of `Storage.java`. Therefore, the parameter of\
    \ `innerTypeOf` method specifies `td`. The `asMemberType` method specifies that\
    \ the inner class is type of member class.\n\n# Generate method to inner class\n\
    \nAt this stage, the configuration of the instrumentation process should be able\
    \ to create the Java class for `Storage.java`. However, the inner class is an\
    \ empty class. The plugin program can continue the configuration by declaring\
    \ the constructor, method, instance variable and other Java element for the inner\
    \ class. In this example, the subsequent configuration declares a method named\
    \ “createUuid”:\n\n```java\n.defineMethod(“createUuid”, String.class, Visibility.PUBLIC)\n\
    \  .intercept(FixedValue.nullValue());\n```\n\nThe `createUuid` method is a public\
    \ method that returns a `java.lang.String`. The method returns `null` value at\
    \ the declaration time. Then the plugin program further uses `visit` method to\
    \ modify the implementation of the method body of the `createUuid` method:\n\n\
    ```java\nfirstInnerBuilder=firstInnerBuilder.visit(\n  Advice.to(UuidGenerator.class)\n\
    \  .on(ElementMatchers.named(“createUuid”)));\n```\n\nThe `visit` method adds\
    \ the `UuidGenerator.class` advice code to the `createUuid` method. After that,\
    \ the configuration of `Storage.java` is almost completed. The `Storage.java`\
    \ has an inner class also, named `Util.java`. Therefore, the plugin program continue\
    \ to generate `Util.java` inner class.\n\n# Generate second level inner class\n\
    \nTo declare the `Util.java` inner class for `Storage.java`, the plugin program\
    \ needs to declare a new instance of `TypeDescription.Latent`. This instance is\
    \ the `secondInnerTd`:\n\n```java\nTypeDescription secondInnerTd =\nnew TypeDescription.Latent(\n\
    \  “com.millionstrengthknowledge.interceptorprj.repository.DataReader$Storage$Util”,\n\
    \  Opcodes.ACC_PUBLIC | Opcodes.ACC_STATIC,\n  TypeDescription.Generic.OBJECT)\
    \ {\n  @Override\n  public String getSimpleName() {\n    return “Util”;\n  }\n\
    \  @Override\n  public boolean isAnonymousType() {\n    return false;\n  }\n \
    \ @Override\n  public boolean isMemberType() {\n    return true;\n  }\n};\n```\n\
    \nSince the `Util.java` is the public static inner class of `Storage.class`, so\
