    \ “User”)\n  .define(“description”, “User table for storing user record”).build();\n\
    ```\n\nThe instance defines “ User “ value for `name` attribute, and defines “\
    \ User table for storing user record ” for `description ` attribute. The `build`\
    \ method completes the declaration of the instance of `AnnotationDescription`,\
    \ and this instance is returned from the method.\n\n233\n\n![](Image00000.gif)\n\
    \nAfter the `createAnnotation` method returns, the instance of `AnnotationDescription`\
    \ is stored into `entityAnnotationVar` variable:\n\n```java\nAnnotationDescription\
    \ entityAnnotationVar = createAnnotation(dir);\n```\n\nThe `entityAnnotationVar`\
    \ will be used in the instrumentation of `User.class`. However, before the plugin\
    \ program instruments the `User.class`, the plugin program will generate another\
    \ new Java class, `EntityUtil`.\n\n### Generate new Java class\n\nNext, the plugin\
    \ program generates a new Java class named `EntityUtil`:\n\n```java\nnew ByteBuddy()\n\
    \  .subclass(Object.class)\n  .modifiers(Opcodes.ACC_PUBLIC | Opcodes.ACC_FINAL)\n\
    \  .name(“com.millionstrengthknowledge.interceptorprj.entity.EntityUtil”)\n  .defineMethod(“getUniqueNumber”,\
    \ String.class, Visibility.PUBLIC)\n  .throwing(Exception.class)\n  .intercept(FixedValue.value(“12345”))\n\
    \  .defineMethod(“getWordLengthFunction”, Function.class, Visibility.PUBLIC)\n\
    \  .intercept(\n    InvokeDynamic.lambda(\n      StringService.class.getDeclaredMethod(“wordLength”,\
    \ Object.class),\n      Function.class\n    )\n  )\n  .make()\n  .saveIn(dir);\n\
    ```\n\n234\n\n![](Image00000.gif)\n\nThe subclass method configures the instance\
    \ of `ByteBuddy` to generate a new Java class. Very similar to the Java interface\
    \ and enum explained in last sections, the plugin program instantiates the `ByteBuddy`\
    \ instance, creates the name, defines method, declares the throws clause, generates\
    \ the Java class, and saves the Java class to disk. After all, the code above\
    \ should create this new Java class:\n\n```java\npublic final class EntityUtil\
    \ {\n    public String getUniqueNumber(){\n        return “12345”;\n    }\n}\n\
    ```\n\nThere are two new concepts introduced in this example. First, observed\
    \ that the code uses modifier method: `modifier(Opcodes.ACC_PUBLIC | Opcodes.ACC_FINAL)`.\
    \ The `modifier` method is used to add the modifier to the Java class. In this\
    \ example, the `modifier` method changes the Java class to be public final class.\n\
    \n### Generate lambda expression\n\nSecond, the new Java class declares a method\
    \ named `getWordLengthFunction`, and generates the method body using the `InvokeDynamic.lambda`:\n\
    \n```java\n.defineMethod(“getWordLengthFunction”, Function.class, Visibility.PUBLIC)\n\
    .intercept(\n  InvokeDynamic.lambda(\n    StringService.class.getDeclaredMethod(“wordLength”,\
    \ Object.class),\n    Function.class\n  )\n```\n\nThe plugin program generates\
    \ the method body using lambda expression.\n\n235\n\n![](Image00000.gif) To use\
    \ lambda expression, the defined method must return the functional interface.\
    \ In this example, this functional Interface is the `java.util.function.Function`.\
    \ Then the `intercept` method is used to instrument the defined method. The instrumentation\
    \ generates the lambda expression using the `lambda` method.\n\nThe `InvokeDynamic`\
    \ is a Java component provided by `ByteBuddy` in `net.bytebuddy.implementation`\
    \ package. The `lambda` method is one of the method of `InvokeDynamic`. The `lambda`\
    \ method accepts two parameter: `java.lang.reflect.Method`, `java.lang.Class`.\n\
    \nIn this example, the first parameter obtains an instance of `Method` via `StringService.class.getDeclaredMethod(“wordLength”,\
    \ Object.class)`. This is the source code of `StringService.java`:\n\n```java\n\
    public class StringService {\n    public static Integer wordLength(Object data){\n\
    \        return ((String)data).length();\n    }\n}\n```\n\nThe instance of the\
    \ `Method` is used to provide the implementation of the lambda expression. Observed\
    \ that the `wordLength` method accepts one parameter of `java.lang.Object` and\
    \ returns an `java.lang.Integer`. In this example, the functional interface is\
    \ the `Function.java`, which has this method signature:\n\n```java\npublic interface\
    \ Function<T,R>{\n    public R apply (T param);\n}\n```\n\nTherefore the functional\
    \ interface requires one parameter and return, and `wordLength` method must have\
    \ the same number of parameter and return also. The parameter of the `wordLength`\
    \ method is `java.lang.Object`. This is required because the `Function.java` requires\
