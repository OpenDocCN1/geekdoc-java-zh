    the matching criteria, for example, the isConstructor matches all the constructor
    in the Java class. Sometime the program wants to match only the specify Java element.
    If this is the case, then the program requires to provide more ElementMatchers
    to form the combination of matchers to find the specific match. This can be done
    with the and , or , not , and other method provided by the ElementMatchers.


    There is some other technique that can help in programming the specific match.
    For example, ElementMatchers.isFinal method return true for all the Java element
    that are final, including method and instance/class variable. However, the MemberAttributeExtension.
    ForMethod is used to limit the matching to Java method only and MemberAttributeExtension.ForField
    is used to limit the matching to instance/class variable only. So, two visit methods
    are required to annotate the method and instance variable respectively in the
    next example:


