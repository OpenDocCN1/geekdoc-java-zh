    \n    @OnMethodEnter\n    public static void start() {\n        logger.log(Level.INFO,\
    \ “Method start”);\n    }\n}\n```\n\n在 `LogInterceptor.java` 中，`start` 方法是提供建议逻辑（advice\
    \ logic）的方法。`start` 方法非常简单，该方法仅创建一个日志消息，说明被插桩的方法已启动。\n\n`@OnMethodEnter` 注解必须标注在该方法上，以便\
    \ `ByteBuddy` 能够知道提供建议逻辑的代码段。此外，建议方法必须是 `static` 的。否则字节码插桩过程将失败。\n\n因此，`ByteBuddy`\
    \ 通过此过程将功能性代码转换为插桩代码：\n\n![](img/Image00000.gif)\n\n(1) 找到带有 `@OnMethodEnter`\
    \ 注解的静态方法：\n\n```java\n@OnMethodEnter\npublic static void start() {\n    logger.log(Level.INFO,\
    \ “Method start”);\n}\n```\n\n(2) 将方法内容转换为适用于 Java 执行的字节码。在这种情况下，转换将变为：\n\n从\n\
    `logger.log(Level.INFO, “Method start”)`\n\n变为\n`LogInterceptor.logger.log(Level.INFO,\
    \ “Method start”)`。\n\n(3) 之后，`ByteBuddy` 将生成的字节码添加到 `DataProducer.class` 中：因此，插桩代码的结果包含了非功能代码和功能性代码：\n\
    \n```java\npublic void create() {\n    LogInterceptor.logger.log(Level.INFO, “Method\
    \ start”);\n    System.out.println(“create data”);\n}\n```\n\n请注意，`ByteBuddy`\
    \ 只处理 Java 类格式的 Java 字节码。这意味着 `DataProducer.java` 保持不变，但 `DataProducer.class`\
    \ 会发生变化。上述使用 Java 源代码进行说明，以便于读者理解。\n\n29\n![](img/Image00000.gif)\n\n## Maven\
    \ pom.xml 错误\n\n在 Spring Tool Suite 中，Eclipse 项目会在 `pom.xml` 中显示此错误信息：“Plugin\
    \ execution not covered by lifecycle configuration bytebuddy maven plugin”。该错误不影响插桩过程。因此，只需忽略该错误即可。要忽略此错误，在\
    \ Spring Tool Suite 中，进入 `windows menu->Preferences->Maven->Errors/warning`，通过“`ignore`”禁用该错误。\n\
    \n## Java 编程与 Java 字节码编程的区别\n\nJava 编程与 Java 字节码编程不同，因为 Java 字节码编程根据 Java 类语法编写，而\
    \ Java 编程使用 Java 语言语法。例如，Java 编程允许如下初始化实例变量的值：\n\n```java\npublic class DataProducer{\n\
    \    private String data=”<noData>”;\n}\n```\n\n然而，在 Java 字节码中，这是无效的。`JVM` 不会为此抛出运行时异常，但代码简单无效，这意味着\
    \ `data` 实例变量将保持 `null` 值。要在 Java 字节码中正确初始化实例变量的值，必须通过构造函数完成初始化：\n\n```java\n\
    public class DataProducer{\n    private String data;\n    public DataProducer(){\
    \ data=”<noData>”; } }\n}\n```\n\n因此，当学习者在 `ByteBuddy` 中为拦截器或代码生成代码时，学习者必须根据 Java\
    \ 字节码语法编写 Java 代码。`Java Virtual Machine Specification`（Java 虚拟机规范）是提供 Java 字节码更多信息的文档，该文档可以从网上下载。\n\
    \n30\n![](img/Image00000.gif)\n\n尽管如此，大多数 Java 编程语法仍然适用，因为 `ByteBuddy` 会对其进行相应的翻译。有一些必须注意的异常情况。当示例代码出现此类异常情况时，本书将解释这类异常。\n\
    \n## 总结\n\n本章解释了：\n- 如何在 Eclipse 中执行 `ByteBuddy` 插桩过程\n- 通过 Maven 构建过程执行插桩过程\n\
    - 如何通过 `InterceptorProgram.java` 执行生成的字节码，并在控制台上查看其结果\n- `pom.xml` 中插件的配置\n- 如何创建插件程序\n\
    - 如何创建 `On Method Enter` 建议\n- 如何使用 `net.bytebuddy.dynamic.DynamicType.Builder`\
    \ 的 `visit` 方法将建议代码的字节码内联到功能代码的字节码中\n\n31\n![](img/Image00000.gif)\n\n## 第 3 章：OnMethodExit\
    \ 建议\n\n本章源代码包含在 `ChapterVisitOnMethodExit` Eclipse 项目中。这是该项目结构：\n\n该项目结构与第 2\
    \ 章中的项目结构相同。所有代码的实现与第 2 章的代码相同。唯一的区别是 `LogInterceptor.java` 在本章使用了 `@OnMethodExit`\
    \ 注解。\n\n![](img/Image00013.jpg)\n\n32\n![](img/Image00000.gif)\n\n本章应用 `On Method\
    \ Exit` 建议。`On Method Exit` 建议在方法执行末尾添加建议代码。\n\n功能性代码：\n```java\npublic void create(){\n\
    \    System.out.println(“create data”);\n}\n```\n\n插桩代码：\n```java\npublic void\
    \ create(){\n    System.out.println(“create data”);\n    LogInterceptor.logger.log(Info.LEVEL,\
    \ “Method end”);\n}\n```\n\n这是本章的建议代码：\n\n```java\npublic class LogInterceptor\
    \ {\n    public static Logger logger=Logger.getLogger(LogInterceptor.class.getName());\n\
    \n    @OnMethodExit\n    public static void methodEnd() {\n        logger.log(Level.INFO,\
    \ “Method end”);\n    }\n}\n```\n\n为了实现 `On Method Exit` 建议，该建议代码使用 `@OnMethodExit`\
    \ 注解标注 `methodEnd` 方法。`ByteBuddy` 然后将建议代码的字节码内联到 `create` 方法中。\n\n要查看插桩代码的结果，执行\
