    the loaded Java class in the JVM.


    Next, the program instantiates an instance of AgentBuilder . The AgentBuilder
    is a public static class in net.bytebuddy.agent.builder package. The AgentBuilder.Default
    is used to instantiate a new instance of the AgentBuilder with default configuration.
    Default configuration uses rebase strategy, and the agent will not instrument
    the JDK core class. The program uses with method to configure the AgentBuilder.
    RedefinitionStrategy.REDEFINITION strategy:


    .with(AgentBuilder.RedefinitionStrategy


    .REDEFINITION)


    With redefinition strategy, the agent can instrument the Java class that is already
    loaded, and not yet loaded into JVM. For Java class that is already loaded into
    JVM, the agent will instrument the class when the premain method is invoked. For
    Java class that is not yet loaded


    248


    ![](Image00000.gif)


    into JVM, the agent will instrument the class when the classloader is loading
    the class.


    Next, the program configures agent to enable the agent process logging:


    .with(AgentBuilder.Listener.StreamWriting


    .toSystemOut())


    This line enables the logging of the ByteBuddy instrumentation process to console.


    Next, the program configures new transformer to instrument the JDK core class:


    .ignore(ElementMatchers.none())


    Without this configuration, the new transformer will ignore the JDK core class
    for instrumentation because the instance of AgentBuilder that is instantiated
    via AgentBuilder.Default method disable it by default. That means the JDK core
    class will be skipped for instrumentation process. Since the agent wants to instrument
    java.lang.String , so the new transformer should not ignore the JDK core class.
    The ignore method is used to configure this behavior, and the ElementMatchers.
    none method informs the new transformer that none of the JDK core class should
    be ignored.


    Next, the program specifies the matching logic for the target class:


    .type(ElementMatchers.named(“java.lang.String”))


    This is similar to the matches method in the plugin program. The AgentBuilder
    uses type method to configure the matching logic for the new transformer. In this
    example, the ElementMatchers.named method is used to match java.lang.String .


    249


    ![](Image00000.gif)


    After that, the program invokes transform method:


    .transform(


    builder, typeDescription, classLoader, module)


    -> {


    return builder.visit(


    Advice.to(LogInterceptor.class)


    .on(


    ElementMatchers.named(“toUpperCase”).and(


    ElementMatchers.isMethod()).and(


    ElementMatchers.takesNoArguments()


    )


    ));


    })


    The transform method of AgentBuilder is used to add the instrumentation capability
    to the new transformer. It is similar to the apply method in the plugin program.
    The transform method accepts one parameter, which is type of net.bytebuddy.agent.builder.
    AgentBuilder.Transformer .


    In this example, the program implements the transformer using the lambda expression.
    The AgentBuilder.Transformer has one method, which has this method signature:


    DynamicType.Builder<?> transform(


    DynamicType.Builder<?> builder,


    TypeDescription typeDescription,


    ClassLoader classLoader, JavaModule module)


    This transform method of AgentBuilder.Transformer is the method that will be invoked
    by agent to instrument the Java class file in premain method, and before the Java
    class file is loaded into JVM.


    250


    ![](Image00000.gif)


    The program will use the first parameter, builder , to configure the advice code:


    builder.visit(


    Advice.to(LogInterceptor.class)


    .on(


    ElementMatchers.named(“toUpperCase”).and(


    ElementMatchers.isMethod()).and(


    ElementMatchers.takesNoArguments()


    )));


    The builder uses visit method to configure the Advice. The transformer will apply
    the advice code of LogInterceptor.class when the application invokes toUpperCase
    method of java.lang.String .


    After all, the program chains the method to installOnByteBuddyAgent method. This
    method installs the transformer in the ByteBuddyAgent.


    .installOnByteBuddyAgent();


    Premain-Class attribute in MANIFEST.MF


    In order to activate the agent, the application must create a jar file that package
    the agent Java class file, and one MANIFEST.MF. The manifest file must have one
    Premain-Class attribute. The value of this attribute is the fully qualified class
    name of the agent. Therefore, the application creates the MANIFEST.MF file in
    resources folder of ChapterJdkInstrumentation Eclipse project, and this is the
    content of the file:


    Premain-Class: com.millionstrengthknowledge


    .interceptorprj.interceptor.InterceptorAgent


    Maven pom.xml


    The plugin program is not applicable when the program uses Java Instrumentation
    API. The program will use the maven to create the agent jar file. Instead of using
    byte-buddy-maven-plugin, the pom.xml configures the maven-jar-plugin:


    251


    ![](Image00000.gif)


    <plugin>


    <groupId>org.apache.maven.plugins</groupId>


    <artifactId>maven-jar-plugin</artifactId>


    <version>3.2.0</version>


    <executions>


    <execution>


    <id>agent</id>


    <goals>


    <goal>jar</goal>


    </goals>


    <configuration>


    <classifier>agent</classifier>


    <includes>


    <include>**/interceptor/**</include>


    </includes>


    <archive>


    <manifestFile>src/main/resources/


    META-INF/MANIFEST.MF</manifestFile>


    </archive>


    </configuration>


    </execution>


    </executions>


    </plugin>'
