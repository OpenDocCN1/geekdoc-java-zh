  trans: "\n观察到 `@Deprecated` 的属性：`since`、`forRemoval` 被包含在注解中，并且它们提供了默认值。即使建议代码没有包含该属性，插桩过程也会隐式地添加该属性，因为这是\
    \ `ByteBuddy` 的默认行为。\n\n## 向 Java 方法添加嵌套注解\n\n接下来，插件程序向 `createRecord` 方法添加了注解容器。注解容器是指内部包含嵌套注解的注解。例如：\n\
    \n```java\n@RecordAnnotation({\n@ColumnAnnotation(name=”username”,\nvalue=”user01\"\
    ),\n@ColumnAnnotation(name=”age”, value=”25”)})\npublic void createRecord() {}\n\
    ```\n\n`@RecordAnnotation` 是注解容器，因为它包含了 `@ColumnAnnotation`。在插件程序将 `@RecordAnnotation`\
    \ 添加到 `createRecord` 方法之前，插件程序必须声明代表 `@RecordAnnotation` 的 `AnnotationDescription`\
    \ 实例，及其嵌套注解 `@ColumnAnnotation`。这是 `ColumnAnnotation.java` 的代码：\n\n```java\n@Repeatable(RecordAnnotation.class)\n\
    @Retention(RetentionPolicy.RUNTIME)\n@Target({\nElementType.METHOD, ElementType.FIELD})\n\
    public @interface ColumnAnnotation {\n    String name();\n    String value();\n\
    }\n```\n153\n![](img/Image00000.gif)\n\n这是声明带有 `username` 属性的 `@ColumnAnnotation`\
    \ 的 `AnnotationDescription` 实例的代码：\n\n```java\nAnnotationDescription c1 =\nAnnotationDescription.Builder.ofType(\n\
    ColumnAnnotation.class)\n.define(“name”, “username”)\n.define(“value”, “user01”).build();\n\
    ```\n\n当程序想要为注解定义属性值时，使用了 `define` 方法。在这里，`define` 方法将 `name` 属性定义为 `username`，将\
    \ `value` 属性定义为 `user01`。之后，调用 `build` 方法创建 `AnnotationDescription` 实例，并将其存储在变量\
    \ `c1` 中。同样地，这是声明在 `name` 属性中具有 `age` 值的 `@ColumnAnnotation` 的代码，`c2` 是存储 `AnnotationDescription`\
    \ 实例的变量：\n\n```java\nAnnotationDescription c2 =\nAnnotationDescription.Builder.ofType(\n\
    ColumnAnnotation.class)\n.define(“name”, “age”)\n.define(“value”, “25”).build();\n\
    ```\n\n在嵌套注解的 `AnnotationDescription` 实例创建后，创建 `@RecordAnnotation` 的 `AnnotationDescription`\
    \ 实例：\n\n```java\nAnnotationDescription nestedAnnotation =\nAnnotationDescription.Builder.ofType(\n\
    RecordAnnotation.class)\n.defineAnnotationArray(\n“value”,\nnew TypeDescription.ForLoadedType(\n\
    ColumnAnnotation.class), c1, c2\n).build();\n```\n\n这是 `RecordAnnotation.java`\
    \ 的代码：\n\n154\n![](img/Image00000.gif)\n\n```java\n@Retention(RetentionPolicy.RUNTIME)\n\
    @Target({\nElementType.METHOD, ElementType.FIELD\n})\npublic @interface RecordAnnotation\
    \ {\n    ColumnAnnotation[] value();\n}\n```\n\n`RecordAnnotation.java` 拥有一个数据类型为\
    \ `ColumnAnnotation` 数组的 `value` 属性。为了向 `@RecordAnnotation` 添加多个 `@ColumnAnnotation`，使用了\
    \ `defineAnnotationArray` 方法。\n\n`defineAnnotationArray` 方法需要三个参数：`String`、`TypeDescription`,`AnnotationDescription`。第一个参数用于指定\
    \ `@RecordAnnotation` 中包含嵌套注解数组的属性名。`@RecordAnnotation` 使用`value` 属性来包含嵌套注解（请参考\
    \ `RecordAnnotation.java`），因此第一个参数的值为`“ value`。\n\n第二个参数用于指定 `RecordAnnotation.java`\
    \ 中 `value` 属性的数据类型。数据类型是 `ColumnAnnotation.java`。因此程序在第二个参数中通过 `TypeDescription.ForLoadedType(ColumnAnnotation.class)`\
    \ 实例化 `TypeDescription` 实例。\n\n第三个参数是变长参数，用于指定 `RecordAnnotation.java` 中 `value`\
    \ 属性的内容。因此将变量 `c1` 和 `c2` 传递给此参数。之后，调用 `build` 方法结束方法链。`build` 方法创建代表 `RecordAnnotation`\
    \ 的 `AnnotationDescription` 实例，该实例存储在 `nestedAnnotation` 变量中。\n\n之后，`nestedAnnotation`\
    \ 变量现在已准备用于在 `createRecord` 方法上添加 `@RecordAnnotation`。因此，插件程序调用了 `visit` 方法：\n\
    \n```java\nbuilder.visit(new MemberAttributeExtension\n.ForMethod()\n.annotateMethod(nestedAnnotation)\n\
    .on(ElementMatchers.named(“createRecord”)))\n```\n155\n![](img/Image00000.gif)\n\
    \n创建了 `ForMethod` 实例，并将 `nestedAnnotation` 变量传递给它的 `annotateMethod` 方法。调用 `on`\
    \ 方法来匹配 `DataProducer.class` 中的 `createRecord` 方法。因此，这段代码应该将 `@RecordAnnotaion`\
    \ 添加到 `createRecord` 方法：\n\n```java\n@RecordAnnotation({\n@ColumnAnnotation(name=”username”,\n\
    value=”user01\"),\n@ColumnAnnotation(name=”age”, value=”25”)})\npublic void createRecord()\
    \ {}\n```\n\n## 从 Java 方法中移除注解\n\n接下来，插件程序从 `createData` 方法中移除 `@Deprecated` 注解。为了此目的，插件程序需要实现\
    \ `net.bytebuddy.asm.AsmVisitorWrapper.ForDeclaredMethods.MethodVisitorWrapper`\
    \ 的自定义派生类。\n\n```java\nprivate MethodVisitorWrapper\nmethodRemover() {\n    return\
    \ new MethodVisitorWrapper() {\n        @Override\n        public MethodVisitor\
    \ wrap(\n            TypeDescription type,\n            MethodDescription mtdDesc,\n\
    \            MethodVisitor methodVisitor,\n            Context ctx,\n        \
    \    TypePool pool, int writeFlag, int readFlag\n        ) {\n            return\
    \ new MethodVisitor(Opcodes.ASM7, methodVisitor) {\n                @Override\n\
    \                public AnnotationVisitor visitAnnotation(String desc, boolean\
    \ visible) {\n                    // 156\n                    // !(Image00000.gif)\n\
    \                    if (Type.getDescriptor(Deprecated.class).equals(desc)) {\n\
    \                        return null;\n                    }\n               \
    \     return super.visitAnnotation(desc, visible);\n                }\n      \
    \      };\n        }\n    };\n}\n```\n\n`MethodVisitorWrapper` 的派生类需要实现 `wrap`\
    \ 方法。在这个实现中，`wrap` 方法返回一个匿名类实例，该匿名类实现了 `visitAnnotation` 方法。类似于 `ClassVisitor`，插桩过程在遇到中的注解时会调用\
    \ `visitAnnotation` 方法。当前检查的注解描述符通过 `desc` 参数可用。因此程序使用 `desc` 参数来匹配想要移除的目标注解：\n\
    \n```java\nif (Type.getDescriptor(Deprecated.class).equals(desc)) {\n    return\
    \ null;\n}\n```\n\n如果找到了 `Deprecated.class` 的注解描述符，则返回 `null`。`null` 值会导致插桩过程将\
    \ `@Deprecated` 标记为注释块。为了结束 `visitAnnotation` 方法，在方法末尾调用父类的 `visitAnnotation`\
    \ 方法。\n\n现在 `methodRemover` 方法的实现已经完成。插件程序将在 `visit` 方法中使用该方法：\n\n```java\n//\
    \ 157\n// !(Image00000.gif)\nbuilder.visit(\nnew AsmVisitorWrapper.ForDeclaredMethods()\n\
    .method(\nElementMatchers.named(“createData”),\nmethodRemover()\n)\n);\n```\n\n\
    程序实例化 `ForDeclaredMethods` 实例。然后调用 `ForDeclaredMethods` 的 `method` 方法。`method`\
    \ 方法需要两个参数。第一个参数需要 `ElementMatchers`。在示例中，匹配器尝试匹配 `createData` 方法，因此使用了 `ElementMatchers.named`\
    \ 方法。第二个参数接收 `MethodVisitorWrapper` 实例。在此参数中，调用了 `methodRemover` 方法。之后，`ForDeclaredMethods`\
    \ 实例拥有了必要的匹配器和 `MethodVisitorWrapper` 实例，插桩过程应该从 `createData` 方法中移除 `@Deprecated`\
    \ 注解。这是插桩过程处理后的 `createData` 方法：\n\n"
- fmt: "\n```java\n/* @deprecated */\n\npublic void createData() {}\n```\n\n# Add\
    \ annotation to method parameter\n\nNext, the plugin program adds some annotations\
    \ to the `createFile` method of `DataProducer.class`. This is the original `createFile`\
    \ method before instrumentation process:\n\n```java\npublic void createFile(\n\
    \    int param0, String param1,\n    @Other long param2, @Other double param3)\
    \ { }\n```\n\nAfter the instrumentation process, this is the instrumented `createFile`\
    \ method:\n\n158\n![](Image00000.gif)\n\n```java\n@Deprecated(since=”jdk5”, forRemoval=false)\n\
    @MyAnnotation\npublic void createFile(\n    @MyAnnotation int param0,\n    @MyAnnotation\
    \ @Deprecated(since=”jdk5”, forRemoval=false) String param1,\n    long param2,\
    \ @Other double param3\n) { }\n```\n\nThis example is complex:\n\nThe instrumentation\
    \ process adds `@Deprecated` and `@MyAnnotation` to the `createFile` method. The\
    \ `@Deprecated` annotation has the `since` attribute with “jdk5” value.\n\n- The\
    \ first parameter is added one `@MyAnnotation`.\n- The second parameter is added\
    \ with `@MyAnnotation` and `@Deprecated` annotation.\n- The `@Other` annotation\
    \ is removed from the third parameter.\n- There is no change in the fourth parameter.\n\
    \nThis is the code for this purpose:\n\n```java\n1 builder.visit(new MemberAttributeExtension.ForMethod()\n\
    2 .annotateMethod(jdk5Deprecated)\n3 .annotateMethod(myAnnotation)\n4 .annotateParameter(0,\
    \ myAnnotation)\n5 .annotateParameter(1, jdk5Deprecated)\n6 .annotateParameter(1,\
    \ myAnnotation)\n7 .on(ElementMatchers.named(“createFile”))\n8 )\n9 .visit(\n\
    10 new AsmVisitorWrapper.ForDeclaredMethods()\n11 .method(ElementMatchers.named(“createFile”),\n\
    159\n![](Image00000.gif)\n12 parameterOtherRemover()\n13 )\n14 );\n```\n\nSo,\
    \ this example is going to explain about these new concepts:\n1. How to add annotation\
    \ to the method parameter\n2. How to remove annotation from the method parameter\n\
    \nObserved that the code has two `visit` methods. The first `visit` method adds\
    \ the related annotation to the method and parameter. The second `visit` method\
    \ removes the annotation from the method parameter.\n\nIn first `visit` method,\
    \ the `MemberAttributeExtension` is used to add the annotation. The line 2 and\
    \ 3 invokes the `annotateMethod` method to add the annotation. There is a `jdk5Deprecated`\
    \ variable, which is an instance of `AnnotationDescription`:\n\n```java\nAnnotationDescription\
    \ jdk5Deprecated =\nAnnotationDescription.Builder.ofType(Deprecated.class)\n.define(“since”,\
    \ “jdk5”)\n.build();\n```\n\nThe `jdk5Deprecated` variable represents the `@Deprecated`\
    \ annotation with a “jdk5” value for its `since` attribute. So, the `jdk5Deprecated`\
    \ variable is created and can be used in line 2.\n\nThe code continues, the line\
    \ 4, 5, and 6 invokes the `annotateParameter` method to add the annotations to\
    \ parameter. The `annotateParameter` method has two parameters: `int` and `AnnotationDescription`.\
    \ The `int` parameter is used to specify the index number of the parameter.\n\n\
    `.annotateParameter(0, myAnnotation)`\nThis code add `@MyAnnotation` to the first\
    \ parameter of `createFile` method.\n\n`.annotateParameter(1, jdk5Deprecated)`\n\
    `.annotateParameter(1, myAnnotation)`\n160\n![](Image00000.gif)\nThese two lines\
    \ of code add `@Deprecated(since=”jdk5”, forRemoval=false)` and `@MyAnnotation`\
    \ to second parameter of `createFile` method.\n\n## Remove annotation from method\
    \ parameter\n\nAfter that, the plugin program removes the `@Other` parameter from\
    \ the third parameter:\n\n```java\nbuilder.visit(\nnew AsmVisitorWrapper.ForDeclaredMethods()\n\
    .method(\n    ElementMatchers.named(“createFile”),\n    parameterOtherRemover()\n\
    )\n);\n```\n\nThe `visit` method is used to perform the instrumentation process.\
    \ The instrumentation process requires an instance of `ForDeclaredMethods`. The\
    \ `method` method of `ForMethod` requires one `ElementMatcher`, and an instance\
    \ of `MethodVisitorWrapper`.\n\nThe `parameterOtherRemover` method is the method\
    \ that can returned an instance of `MethodVisitorWrapper`. This is the implementation\
    \ of `parameterOtherRemover` method:\n\n```java\nprivate MethodVisitorWrapper\n\
    parameterOtherRemover() {\n    return new MethodVisitorWrapper() {\n        @Override\n\
    \        public MethodVisitor wrap(\n            TypeDescription td,\n       \
    \     MethodDescription desc,\n            MethodVisitor methodVisitor, Context\
    \ ctx,\n            TypePool pool, int writeFlag, int readFlag\n        ) {\n\
    161\n![](Image00000.gif)\n        return new MethodVisitor(Opcodes.ASM7, methodVisitor)\
    \ {\n            @Override\n            public AnnotationVisitor\n           \
    \ visitParameterAnnotation(\n                int param, java.lang.String desc,\n\
    \                boolean visible\n            ) {\n                if(param==2&&Type.getDescriptor(Other.class).equals(desc))\
    \ {\n                    return null;\n                }\n                return\
    \ super.visitParameterAnnotation(param, desc, visible);\n            }\n     \
    \   };\n        }\n    }\n}\n```\n\nThe `wrap` method is implemented. The `wrap`\
    \ method returns an instance of `MethodVisitor` in inner anonymous class format,\
    \ and it implements the `visitParameterAnnotation` method.\n\nThe `visitParameterAnnotation`\
    \ method has three parameters: `int`, `String`, `boolean`. The `int` parameter\
    \ is used to specify the index number of parameter. The `String` parameter is\
    \ the annotation descriptor of the currently inspecting annotation. The `boolean`\
    \ parameter is not used in this example. So, the instrumentation process wants\
    \ to remove the `@Other` from the third parameter, this is the logic for this\
    \ purpose:\n\n162\n![](Image00000.gif)\n\n```java\nIf(param==2&&Type.getDescriptor(Other.class).equals(desc)){\n\
    \    return null;\n}\n```\n\nTo match for the index number of third parameter,\
    \ the `param==2` is used. Then the `Type.getDescriptor` method converts `Other.class`\
    \ into annotation descriptor and compares it with `desc`. When the `@Other` annotation\
    \ is detected, returns `null`, and the `null` value will cause the instrumentation\
    \ process to remove the annotation. To end the `visitParameterAnnotation` method,\
    \ the return statement invokes the superclass’s `visitParameterAnnotation` method.\n\
    \nNow the `parameterOtherRemover` method is ready to be used. It is used in the\
    \ second `visit` method, and it is invoked in the second parameter of:\n\n```java\n\
    9 .visit(\n10 new AsmVisitorWrapper.ForDeclaredMethods()\n11 .method(ElementMatchers.named(“createFile”),\n\
    12 parameterOtherRemover()\n13 )\n14 );\n```\n\nWith this code, the `@Other` annotation\
    \ is removed from the third parameter of the `createFile` method.\n\n163\n![](Image00000.gif)\n\
    \n## Add annotation to the instance variable\n\nAt this stage, the chapter has\
    \ explained about annotation processing on method and Java class. Next, the chapter\
    \ will explain how to add and remove annotation that is annotated on the instance\
    \ variable. The plugin program will add `@MyAnnotation` to the data instance variable\
    \ of `DataProducer.class`. This is the data instance variable before instrumentation\
    \ process:\n\n```java\n@Deprecated\nprivate String data;\n```\n\nAfter the instrumentation\
    \ process, the `@Deprecated` annotation is removed, and `@MyAnnotation` is added:\n\
    \n```java\n/**\n@Deprecated\n*/\n@MyAnnotation\nprivate String data;\n```\n\n\
    This is the code that adds and removes the annotation that is annotated on data\
    \ instance variable:\n\n```java\n1 builder.visit(new MemberAttributeExtension.ForField()\n\
    2 .annotate(myAnnotation)\n3 .on(ElementMatchers.named(“data”))\n4 )\n5 .visit(new\
    \ AsmVisitorWrapper.ForDeclaredFields()\n6 .field(\n7 ElementMatchers.named(“data”),\n\
    8 fieldDeprecatedRemover()\n9 )\n10 );\n```\n\n164\n![](Image00000.gif)\n\nThe\
    \ `MemberAttributeExtension.ForField` is used to add the annotation to the instance\
    \ variable. The code from line 1 to 4 is the code segment for the purpose.\n\n\
    Invoke `annotate` method to add `@MyAnnotation` to the data instance variable,\
    \ and uses `on` method to configure the `ElementMatchers`.\n\n## Remove annotation\
    \ from instance variable\n\nThen the second `visit` method removes the `@Deprecated`\
    \ annotation from the data instance variable. The program requires the instance\
    \ of `ForDeclaredFields` and `FieldVisitorWrapper` for this purpose. This is the\
    \ implementation of `fieldDeprecatedRemover` method that returns the instance\
    \ of `FieldVisitorWrapper`:\n\n```java\nprivate FieldVisitorWrapper\nfieldDeprecatedRemover()\
    \ {\n    return new FieldVisitorWrapper() {\n        @Override\n        public\
    \ FieldVisitor wrap(\n            TypeDescription td, InDefinedShape sh,\n   \
    \         FieldVisitor fieldVisitor\n        ) {\n            return new FieldVisitor(Opcodes.ASM7,\
    \ fieldVisitor)\n        }\n    }\n}\n```\n"
