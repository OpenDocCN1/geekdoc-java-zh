  trans: '


    为了创建 `Generic` 实例，使用了 `net.bytebuddy.description.type.TypeDescription` 的通用构建器。可以通过
    `TypeDescription.Generic.Builder` 访问该构建器。然后，将构建器链到 `typeVariable` 方法，然后调用 `build`
    方法。之后，创建了 `A_type` 实例，它代表“A”类型变量。`defineField` 方法使用 `A_type` 来为 `test1` 实例变量定义数据类型。


    为了声明泛化类型，同样使用 `net.bytebuddy.description.type.TypeDescription.Generic.Builder`。然而，使用的不是
    `typeVariable` 方法，而是 `parameterizedType` 方法。例如，`test2` 是 `List<?>` 的一个实例变量：


    ```java

    private List<?> test2;

    ```


    这是生成该声明的代码：


    ```java

    builder.defineField("test2", lt_w, Visibility.PRIVATE);

    ```


    `lt_w` 是 `net.bytebuddy.description.type.TypeDescription.Generic` 类的实例：


    ```java

    Generic wildCard = TypeDescription.Generic.Builder.unboundWildcard();

    Generic lt_w = TypeDescription.Generic.Builder.parameterizedType(TypeDescription.ForLoadedType.of(List.class),
    wildCard).build();

    ```


    128


    ![](img/Image00000.gif)


    `List<?>` 是一个泛化类型，其类型参数是一个未绑定的通配符 `<?>`。因此，该声明需要创建一个通配符实例。出于此目的，使用了 `TypeDescription.Generic.Builder.unboundWildcard`
    方法，并将通配符实例存储在 `wildCard` 变量中。


    随后，`wildCard` 变量被用于 `parameterizedType` 方法。为了定义泛化类型 `List<?>`，将 `TypeDescription.ForLoadedType.of(List.class)`
    和 `wildCard` 变量传递给 `parameterizedType` 方法的第一个两个参数。然后，在方法链的最后调用 `build` 方法。这应该生成
    `test2` 实例变量声明的字节码。


    接下来，插件程序声明了 `test3` 实例变量：


    ```java

    private List<? super A> test3;

    ```


    这是生成该声明的代码：


    ```java

    builder.defineField("test3", lt_w_lbA, Visibility.PRIVATE);

    ```


    这是 `lt_w_lbA` 的声明：


    ```java

    Generic A_lb = TypeDescription.Generic.Builder.typeVariable("A").asWildcardLowerBound();

    Generic lt_w_lbA = TypeDescription.Generic.Builder.parameterizedType(TypeDescription.ForLoadedType.of(List.class),
    A_lb).build();

    ```


    `List<? super A>` 使用 `A` 类型变量的下界通配符作为类型参数。为了创建该泛化类型，需要两个变量：`lt_w_lbA` 和 `A_lb`。


    129


    ![](img/Image00000.gif)


    `asWildCardLowerBound` 方法用于声明通配符下界类型变量。因此，`A_lb` 变量存储了“? super A” 的值。


    为了声明泛化类型 `List<? super A`，将 `TypeDescription.ForLoadedType.of(List.class)` 和 `A_lb`
    变量传递给 `parameterizedType` 方法的参数，然后调用 `build` 方法。该代码应该创建 `lt_w_lbA` 变量，用于存储“ List<?
    super A >”的声明，`defineField` 方法可以使用该变量为 `test3` 实例变量定义数据类型。


    `TypeDescription.ForLoadedType.of(List.class)` 负责创建 `java.lang.List` 的 `TypeDescription`
    。`TypeDescription` 代表加载到 JVM 中的 Java 类。在本示例中，该 Java 类就是 `java.lang.List`。`TypeDescription.ForLoadedType.of`
    方法是 ByteBuddy 编程中常用的方法。


    接下来，插件程序声明了 `test4` 实例变量：


    ```java

    private List<? extends B> test4;

    ```


    `test4` 实例变量是一个泛化类型，其类型参数是 `B` 类型变量的上界通配符。为了创建这个实例变量，首先创建变量 `B_ub`，它代表 `? extends
    B`：


    ```java

    Generic B_ub = TypeDescription.Generic.Builder.typeVariable("B").asWildcardUpperBound();

    ```


    `asWildCardUpperBound` 方法用于创建上界通配符的实例。然后，创建代表泛化类型 `List<? extends B>` 的变量 `lt_w_ubB`：


    130


    ![](img/Image00000.gif)


    ```java

    Generic lt_w_ubB = TypeDescription.Generic.Builder.parameterizedType(TypeDescription.ForLoadedType.of(List.class),
    B_ub).build();

    ```


    之后，使用 `lt_w_ubB` 变量来定义 `test4` 实例变量：


    ```java

    builder.defineField("test4", lt_w_ubB, Visibility.PRIVATE);

    ```


    接下来，插件程序声明了 `test5` 实例变量：


    ```java

    private List<? extends List<A>> test5;

    ```


    `test5` 实例变量是一个泛化类型，其类型参数是 `List<A>` 泛化类型的上界通配符。这是一种不同的泛型类型，泛化类型包含了另一个泛化类型。为了创建这个实例变量，首先创建变量
    `B_ub`，它代表 `? extends B`（注：此处原文逻辑指代泛化嵌套）：


    ```java

    Generic B_ub = TypeDescription.Generic.Builder.typeVariable("B").asWildcardUpperBound();

    ```


    131


    ![](img/Image00000.gif)


    （此处由于原文文本逻辑存在跳跃或重复，已按要求翻译）


