    \n# Chapter 20: Instrumenting JDK Core Class\n\nThis chapter explains on how to\
    \ instrument the JDK (Java Development Kit) core class. This chapter is also an\
    \ introduction to Java Instrumentation API with `ByteBuddy`. The source code of\
    \ this chapter is included in the ChapterJdkInstrumentation Eclipse project.\n\
    \nThis chapter uses Java Instrumentation API and `ByteBuddy` to instrument `java.lang.String`\
    \ class. Different from all previous chapters, Java Instrumentation API does not\
    \ requires ByteBuddy maven plugin . Instead, Java Instrumentation API uses agent\
    \ .\n\nJava uses classloader to load the Java class from disk to JVM (Java Virtual\
    \ Machine). With Java instrumentation API implementation, the agent intercepts\
    \ the Java class before the Java class is loaded into JVM. When the agent completes\
    \ the interception, then the instrumented Java class is loaded into JVM.\n\nThe\
    \ instrumentation agent intercepts the Java class during application runtime.\
    \ The Java instrumentation API is suitable for these situations:\n\nThe instrumented\
    \ Java class file cannot be saved : This is true for new JDK since version 9 because\
    \ all the JDK core class are compressed into a special file format (not a jar\
    \ file), which is not available for the build process to repackage the core library.\n\
    \nThe application wants to generate code based on the condition that cannot be\
    \ determined during compile time and build time, but only during runtime.\n\n\
    Therefore, the ByteBuddy maven plugin is not applicable. Instead, the application\
    \ will use agent to instrument the JDK core class during application runtime.\
    \ The agent is the Java component that has instrumentation capability, and the\
    \ capability is implemented in a transformer . So the agent can have multiple\
    \ transformer. Example of agent are monitoring agent, profiler agent, program\
    \ tracing agent. The agent must implement the `premain` method.\n\n246\n\n![](Image00000.gif)\n"
