    .getDeclaredMethod(“getInstantTime”);\n\nbuilder.define(m2).intercept(FixedValue.value(-1L));\n\
    ```\n\n88\n\n`produces` this instrumented code:\n\n```java\nprivate long getInstantTime()\
    \ {\n    return -1L;\n}\n```\n\nThe original `getInstantTime` method has one `@Deprecated`\
    \ annotation. However, the annotation is not cloned via `define` method. The `defineProperty`,\
    \ and `defineMethod` also have the same behavior.\n\nThe `defineProperty` method\
    \ is used to create public setter and getter method. For example, this code:\n\
