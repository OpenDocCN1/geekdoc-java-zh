    \ data cannot be null\nat com.millionstrengthknowledge.interceptorprj.program.DataProducer.create(DataProducer.java:15)\n\
    at com.millionstrengthknowledge.interceptorprj.program.InterceptorProgram.main(InterceptorProgram.java:14)\n\
    ```\n\nAfter that, starts the `maven` build process, and then execute `InterceptorProgram.java`\
    \ in the `Eclipse` project, the program will create this result on the screen:\n\
    \n```\nAug 01, 2020 1:00:00 PM com.millionstrengthknowledge\n.interceptorprj.program.DataProducer\
    \ create\nINFO: Method end with exception:\n==========================\nException\
    \ type: java.lang.IllegalArgumentException\nException message: Data cannot be\
    \ null\n```\n\nAfter the instrumentation process, the instrumented code prints\
    \ the exception information on the screen instead. However, there is no exception\
    \ stack trace showed on the screen, this is because the advice code suppresses\
    \ the exception to `null`.\n\nAdvice code can only intercept the exception in\
    \ the method that is annotated with `@OnMethodExit` annotation. `@OnMethodExit`\
    \ annotation must specify the Java exception class name in the `onThrowable` attribute:\n\
    \n```java\n@Advice.OnMethodExit(onThrowable=Throwable.class)\npublic static void\
    \ methodEnd(\n    @Advice.Thrown(readOnly=false) Throwable excp\n)\n```\n\nBy\
    \ default, the advice method will be skipped if `create` method throws exception.\
    \ To enable the instrumented code continues its method exection to advice code,\
    \ the `onThrowable` attribute must be used. The instrumented method execution\
    \ will continue to advice method if the exception thrown from the instrumented\
    \ code is equivalent to the class or derived class of the exception defined in\
    \ the `onThrowable` attribute.\n\nObserved that the parameter of `methodEnd`,\
    \ named `excp`, is annotated with the `@Thrown` annotation. This parameter captures\
    \ the exception thrown from the instrumented method. For example, if the instrumented\
    \ method throws `IllegalArgumentException`, then the value of the `excp` parameter\
    \ will be the instance of `IllegalArgumentException` that is thrown from the instrumented\
    \ method.\n\nTo alter the exception thrown from the instrumented method, the `readOnly`\
    \ attribute of the `@Thrown` annotation must be set to `false`.\n\nIn this example,\
    \ the advice method captures the exception and prints the exception class and\
    \ its exception message on the screen. The instrumented code does not throw the\
    \ exception because the advice code suppresses the exception at the line 30:\n\
    \n```java\nexcp = null;\n```\n\nIf line 30 is omitted from the advice code, then\
    \ the instrumented method will throw exception:\n\n```\nAug 01, 2020 1:00:00 PM\
    \ com.millionstrengthknowledge\n.interceptorprj.program.DataProducer create\n\
    INFO: Method end with exception:\n==========================\nException type:\
    \ java.lang.IllegalArgumentException\nException message: Data cannot be null\n\
    Exception in thread “main” java.lang.IllegalArgumentException: data cannot be\
    \ null\nat com.millionstrengthknowledge.interceptorprj.program.DataProducer.create(DataProducer.java:5)\n\
    at com.millionstrengthknowledge.interceptorprj.program.InterceptorProgram.main(InterceptorProgram.java:14)\n\
    ```\n\nIf `InterceptorProgram.java` changes to this line of code:\n\n```java\n\
    new DataProducer().createData(“create”);\n```\n\nThen the instrumented code will\
    \ produce this result on the screen:\n\n```\ncreate data: test\nOct 1, 2020 1:00:00\
    \ PM com.millionstrengthknowledge.interceptorprj.program.DataProducer create\n\
    INFO: Method end with no exception\n```\n\n### Data Type for @Thrown Annotated\
    \ Parameter\n\nThe data type for `excp` parameter must be either same class or\
    \ the derived class of the exception class thrown from the instrumented code.\
    \ Otherwise, the instrumented code will throw runtime exception - `java.lang.ClassCastException`.\
    \ For example:\n\n```java\npublic static void methodEnd(\n    @Advice.Thrown(readOnly=false)\
    \ Error excp)\n```\n\nObserved that `excp` parameter has data type of `java.lang.Error`,\
    \ this will cause `ClassCastException` during application runtime because Java\
    \ cannot cast `java.lang.IllegalArgumentException` to `java.lang.Error`.\n\n###\
    \ Data Type for onThrowable Attribute\n\nAdvice code can only have one On Method\
    \ Exit advice. Therefore, to manage all the exception type in the advice method,\
    \ the `onThrowable` attribute should use `Throwable.class`, which enables advice\
    \ method to capture `java.lang.Exception` and `java.lang.Error`, and the exceptions\
    \ that are the derived class of `java.lang.Exception` and `java.lang.Error`.\n\
    \nIf the exception thrown from the instrumented code does not match with the class\
    \ specified in `onThrowable` attribute, the advice method will be skipped. For\
    \ example, with this configuration\n\n```java\n@Advice.OnMethodExit(onThrowable=Exception.class)\n\
    ```\n\nIf instrumented code throws `java.lang.Error`, then the advice method will\
    \ be skipped.\n\n### Throw New Exception from Advice Method\n\nAdvice method can\
    \ throw new exception, which alters the original exception thrown from the instrumented\
    \ code. If the line 30 of `ExceptionInterceptor.java` is replaced with this line:\n\
    \n```java\nthrow new RuntimeException(“Runtime exception”);\n```\n\nThen instrumented\
    \ code will throw the `RuntimeException` instead.\n\nWhat if the advice method\
    \ throws checked exception instead of `RuntimeException`, and `methodEnd` adds\
    \ the valid throws clause?\n\n```java\n@Advice.OnMethodExit(onThrowable=Throwable.class)\n\
    public static void methodEnd(\n    @Advice.Thrown(readOnly=false) Throwable excp\n\
    ) throws Exception {\n    throw new Exception(“checked exception”);\n}\n```\n\n\
    The instrumented code will throw the checked exception also, similar to the result\
    \ of throwing `RuntimeException` in advice method.\n\nHowever, please be aware\
    \ that the functional method has no throws clause in the `create` method of `DataProducer.java`:\n\
    \n```java\npublic class DataProducer {\n    public void create(String data) {\n\
    \        if(data==null)\n            throw new IllegalArgumentException(“Data\
    \ cannot be null”);\n        System.out.println(“create data: “+data);\n    }\n\
    }\n```\n\nAccording to Java compilation process, the `create` method must declare\
    \ the throws clause when the method throws checked exception. Otherwise, the program\
    \ will receive compilation error. However, in Java bytecode format, the throw\
    \ clause is optional when the program throws checked exception. Therefore the\
    \ generated code executes without runtime error.\n\nThis is the important difference\
    \ between Java programming and Java bytecode programming. Java programming deals\
    \ with the Java file, and Java bytecode programing deals with the Java class file.\
    \ They have different syntax, the exception management is one of the example.\n\
