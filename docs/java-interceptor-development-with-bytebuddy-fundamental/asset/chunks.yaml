    \ 调用了 `withArgument(0,1)`，它将 `process11` 方法的第一两个参数传递给 `DiscountUtil.java` 的 `execute`\
    \ 方法。这是 `DiscountUtil.java` 中 `execute` 方法的实现：\n\n```java\npublic static void\
    \ execute(long id, int[] total) {\n    total[0]-=new DiscountQuery().query(id);\n\
    }\n```\n\n`execute` 方法使用 `id` 执行折扣查询，然后减去存储在 `total` 数组第一个元素中的 `total` 价格，并将最新结果存储在\
    \ `total` 数组的第一个元素中。\n\n之后，计算完成，`total` 数组的第一个元素包含了最新的总价。最后一个 `Then` 方法被链链到 `FixedValue.argument(1)`。`FixedValue.argument(1)`\
    \ 生成的代码返回 `process11` 方法的第二个参数。由于所有的 `MethodCall` 都使用第二个参数来存储总价，且它是一个 `int` 数组，因此该\
    \ `int` 数组应该包含最新的总价。因此，`process11` 方法可以使用第二个参数来创建返回语句。\n\n这是 `process11` 方法插桩代码的源码视图：\n\
    \n```java\npublic int[] process11(long p1, int[] p2){\n    LocalVariableAdvice.execute(p2);\n\
    \    PriceUtil.execute(p1, p2);\n    DiscountUtil.execute(p1, p2);\n    return\
    \ p2;\n}\n```\n\n生成的代码非常紧凑， `ByteBuddy` 没有创建任何意外变量，因为 `int` 数组是由工具类的静态方法管理的。因此，`process11`\
    \ 方法可以正确执行计算。\n\n`ByteBuddy` 在代码生成方面存在局限性。某些代码无法直接生成。例如，价格计算代码可以使用以下代码实现：\n\n\
    ```java\npublic int calculatePrice(long id){\n    int total=new PriceQuery().query(id);\n\
    \    total-=new DiscountQuery().query(id);\n    return total;\n}\n```\n\n没有直接的\
    \ API（例如 `MethodCall`）可以生成以下这些行代码：\n\n```java\nnew PriceQuery().query(id);\n```\n\
    \n访问 `total` 局部变量并在 `DiscountQuery` 中使用它。\n\n访问 `total` 局部变量并在返回语句中使用它。\n\n`net.bytebuddy.implementation.bytecode.StackManipulation`\
    \ 可以作为此问题的解决方案，但它不在本书的范围内。使用 `StackManipulation` 需要 Java 字节码编程知识，并且它可能实现更冗长的代码来实现相同的代码。`process9`\
    \ 方法拥有与上述代码最接近的代码。`process9` 方法在 `onMethodEnter` 和 `onExit` 建议中使用 `@Local` 注解来实现插桩。\n\
    \n与使用局部变量相比，价格计算可以使用实例变量来存储计算结果。当程序想要使用实例变量来存储计算结果时，实现应该使用带有 `@FieldValue` 注解的建议代码。该建议代码可以使用\
    \ `onMethodEnter` 建议、`onMethodExit` 建议或两者。\n\n到此阶段，本章已完全解释了 `InterceptorPlugin.java`。\n\
