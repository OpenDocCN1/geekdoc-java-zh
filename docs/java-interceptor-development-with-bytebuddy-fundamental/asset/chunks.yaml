    ```\n\n`net.bytebuddy.implementation.FieldAccessor` 在此处用于设置 118\n![](img/Image00000.gif)\n\
    实例变量。`FieldAccessor` 的用法是设置 `dataProducerId` 实例变量，`setsArgumentAt` 方法配置了 `p2`\
    \ 参数。`setsArgumentAt` 方法值 1 指定了构造函数的参数索引。因此，选择了 `p2` 参数。同样，为了生成此行代码的字节码：\n\n```java\n\
    data=p4;\n```\n\n`FieldAccessor` 用于实现目的：\n\n```java\nandThen(FieldAccessor.ofField(\"\
