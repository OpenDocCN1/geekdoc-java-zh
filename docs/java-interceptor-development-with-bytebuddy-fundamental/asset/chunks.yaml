    This chapter has introduced several methods that can create new Java element:


    makeInterface


    makeEnumeration


    makeAnnotation


    subclass


    There is another method named rebase , which is the method of net. bytebuddy.ByteBuddy
    . The rebase method is used to modify the existing Java element. The rebase method
    is the default method used in the plugin program of the maven build process. That
    means whenever the instrumentation use ByteBuddy maven plugin to instrument the
    class, the maven build process uses the rebase method. It is similar to this line
    of code that instantiate the instance of ByteBuddy:


    new ByteBuddy().rebase(typeDescription)


    However, this line of code is encapsulated in the plugin program. The developer
    can configure the rebase via net.bytebuddy.build. EntryPoint.


    In ChapterDefineInterface Eclipse project, there is Java class named PluginConfig.java
    in com.millionstrengthknowledge. interceptorprj.plugin package. The PluginConfig.java
    implements the net.bytebuddy.build.EntryPoint . The EntryPoint program starts
    before the maven build process. It can be used to configure the instrumentation
    process of the plugin program. This is the source code of the PluginConfig.java
    :


    241


    ![](Image00000.gif)


    public class PluginConfig implements EntryPoint {


    @Override


    public ByteBuddy byteBuddy(


    ClassFileVersion c


    ) {


    System.out.println(“PluginConfig EntryPoint


    start”);


    return new ByteBuddy().with(


    ClassFileVersion.JAVA_V11);


    }


    @Override


    public Builder<?> transform(


    TypeDescription typeDescription,


    ByteBuddy byteBuddy,


    ClassFileLocator cf,


    MethodNameTransformer mtd)


    {


    return byteBuddy


    .rebase(typeDescription, cf, mtd);


    }


    }


    In this chapter, the PluginConfig.java is implemented to demonstrate how the plugin
    program configures the ByteBuddy before the maven build process starts. EntryPoint
    derived class must implement these two methods: byteBuddy , and transform . The
    byteBuddy method is the method used to instantiate the instance of net.bytebuddy.
    ByteBuddy :


    public ByteBuddy byteBuddy(ClassFileVersion c){


    System.out.println(“PluginConfig EntryPoint


    start”);


    return new ByteBuddy().with(


    ClassFileVersion.JAVA_V11);


    }


    242


    ![](Image00000.gif)


    (1) Instantiate the instance of ByteBuddy


    new ByteBuddy()


    (2) Configure the instance of ByteBuddy


    .with(ClassFileVersion.JAVA_V11)


    The with method is used to configure the instance of ByteBuddy. In this example,
    the with parameter configures ByteBuddy to generate the Java class in Java 11
    format. However, this is optional because the plugin always generate the Java
    class based on the version of JDK used by the maven build process.


    This is the source code for the transform method:


    @Override


    public Builder<?> transform(


    TypeDescription typeDescription,


    ByteBuddy byteBuddy,


    ClassFileLocator cf,


    MethodNameTransformer mtd)


    {


    return byteBuddy


    .rebase(typeDescription, cf, mtd);


    }


    The transform method is the place where the plugin program chooses the strategy
    for the instrumentation. In this example, the rebase method is used. However,
    please be noticed that even the plugin program does not implement the EntryPoint,
    the plugin program is defaulted to rebase method..


    To apply the PluginConfig.java to the maven build process, adds the <entryPoint>
    element in the pom.xml :


    <plugin>


    <groupId>net.bytebuddy</groupId>


    <artifactId>byte-buddy-maven-plugin


