    \n`net.bytebuddy.description.modifier.Ownership`\n\n81\n\n![](Image00000.gif)\n\
    \nThe `Visibility` is used to specifies the visibility: `public`, `private`, `protected`,\
    \ `package access`. The `FieldManifestation` is used to specifies `final` or `volatile`\
    \ keyword for the instance variable. The `Ownership` is used when the program\
    \ wants to declare `static`.\n\nTherefore, the instrumentation process generates\
    \ this declaration for the `SERIALNUMBER` variable:\n\n```java\npublic final static\
    \ long SERIALNUMBER=12345L;\n```\n\nNext, the plugin program declares a private\
    \ instance variable named `number1` :\n\n```java\nbuilder.defineField(“number1”,\
    \ long.class, Visibility.PRIVATE);\n```\n\nThis declaration uses `Visibility.PRIVATE`,\
    \ and this is the result of instrumentation:\n\n```java\nprivate long number1;\n\
    ```\n\nTo declare protected variable, uses `Visibility.PROTECTED` :\n\n```java\n\
    .defineField(“number2”, long.class,\nVisibility.PROTECTED)\n```\n\nThe result\
    \ of the instrumentation:\n\n```java\nprotected long number2;\n```\n\nTo declare\
    \ package_private volatile variable:\n\n```java\n.defineField(“number3”, long.class,\
    \ Visibility. PACKAGE_PRIVATE, FieldManifestation.VOLATILE)\n```\n\nThe result\
    \ of the instrumentation:\n\n```java\nvolatile long number3;\n```\n\n82\n\n![](Image00000.gif)\n\
    \nTo declare private transient variable:\n\n```java\n.defineField(“number4”, long.class,\
    \ Visibility. PRIVATE, FieldPersistence.TRANSIENT)\n```\n\nThe result of the instrumentation:\n\
    \n```java\nprivate transient long number4;\n```\n\nTo declare variable without\
    \ specifying the visibility modifier:\n\n```java\n.defineField(“number5”, long.class)\n\
    ```\n\nIf modifier is not specified, then the variable is defaulted to package\
    \ access:\n\n```java\nlong number5;\n```\n\n`net.bytebuddy.jar.asm.Opcodes` is\
    \ another method to specify the modifier for the instance variable. For example,\
    \ this line declares public final static variable:\n\n```java\nbuilder.defineField(“number6”,\
    \ long.class, Opcodes.ACC_PUBLIC | Opcodes.ACC_FINAL | Opcodes.ACC_STATIC);\n\
    ```\n\nThe result of the instrumentation:\n\n```java\npublic final static long\
    \ number6;\n```\n\n`Opcodes` can combine several modifiers in one line, with each\
    \ modifier is separated by a “|” character. Another example that uses `Opcodes`\
    \ :\n\n```java\nbuilder.defineField(“number7”, long.class, Opcodes.ACC_PRIVATE\
    \ | Opcodes.ACC_VOLATILE | Opcodes.ACC_TRANSIENT);\n```\n\nThe result of the instrumentation:\n\
    \n```java\nprivate volatile transient number7;\n```\n\n83\n\n![](Image00000.gif)\n\
    \n# The value Method\n\nThe `value` method only works for static variable. For\
    \ example, the `SERIALNUMBER` is a static variable:\n\n```java\nbuilder.defineField(“SERIALNUMBER”,\
    \ long.class, Visibility.PUBLIC, FieldManifestation.FINAL, Ownership.STATIC).value(12345L);\n\
    ```\n\nWith this configuration, the `SERIALNUMBER` instance variable will have\
    \ long value of `12345`. If the `value` method is used on non-static instance\
    \ variable, for example:\n\n```java\nbuilder.defineField(“number1”, long.class,\n\
    Visibility.PRIVATE).value(1000L);\n```\n\nThe long value of `1000` will not be\
    \ set to `number1` instance variable. To set value to instance variable, the `value`\
    \ must be set via the constructor. This is because the Java bytecode specification\
    \ requires the constructor to set the value for instance variable. The Chapter\
    \ 12 will explain on how to set value to instance variable in the constructor.\n\
    \n# Conclusion\n\nThis chapter explains on how to declare instance variable dynamically.\n\
    \n84\n\n![](Image00000.gif)\n\n# Chapter 11: Generate Java Method\n\nThis chapter\
    \ explains on how to generate Java method dynamically into the functional code.\
