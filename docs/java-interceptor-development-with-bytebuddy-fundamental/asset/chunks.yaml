  trans: "\n\n`net.bytebuddy.description.modifier.Visibility`\n\n`net.bytebuddy.description.modifier.FieldManifestation`\n\
    \n`net.bytebuddy.description.modifier.Ownership`\n\n81\n\n![](img/Image00000.gif)\n\
    \n`Visibility` 用于指定可见性：`public`、`private`、`protected`、`package access`（包访问）。`FieldManifestation`\
    \ 用于为实例变量指定 `final` 或 `volatile` 关键字。当程序想要声明 `static` 时，使用 `Ownership`。\n\n因此，插桩过程为\
    \ `SERIALNUMBER` 变量生成了如下声明：\n\n```java\npublic final static long SERIALNUMBER=12345L;\n\
    ```\n\n接下来，插件程序声明了一个名为 `number1` 的私有实例变量：\n\n```java\nbuilder.defineField(“number1”,\
    \ long.class, Visibility.PRIVATE);\n```\n\n该声明使用了 `Visibility.PRIVATE`，插桩后的结果为：\n\
    \n```java\nprivate long number1;\n```\n\n声明受保护变量，使用 `Visibility.PROTECTED`：\n\n\
    ```java\n.defineField(“number2”, long.class,\nVisibility.PROTECTED)\n```\n\n插桩结果为：\n\
    \n```java\nprotected long number2;\n```\n\n声明包私有的 volatile 变量：\n\n```java\n.defineField(“number3”,\
    \ long.class, Visibility. PACKAGE_PRIVATE, FieldManifestation.VOLATILE)\n```\n\
    \n插桩结果为：\n\n```java\nvolatile long number3;\n```\n\n82\n\n![](img/Image00000.gif)\n\
    \n声明私有的 transient 变量：\n\n```java\n.defineField(“number4”, long.class, Visibility.\
    \ PRIVATE, FieldPersistence.TRANSIENT)\n```\n\n插桩结果为：\n\n```java\nprivate transient\
    \ long number4;\n```\n\n在不指定可见性修饰符的情况下声明变量：\n\n```java\n.defineField(“number5”,\
    \ long.class)\n```\n\n如果没有指定修饰符，则变量默认为包访问：\n\n```java\nlong number5;\n```\n\n\
    `net.bytebuddy.jar.asm.Opcodes` 是另一种为实例变量指定修饰符的方法。例如，这一行声明了 public final static\
    \ 变量：\n\n```java\nbuilder.defineField(“number6”, long.class, Opcodes.ACC_PUBLIC\
    \ | Opcodes.ACC_FINAL | Opcodes.ACC_STATIC);\n```\n\n插桩结果为：\n\n```java\npublic\
    \ final static long number6;\n```\n\n`Opcodes` 可以在一行中组合多个修饰符，每个修饰符用“|”字符分隔。另一个使用\
    \ `Opcodes` 的示例是：\n\n```java\nbuilder.defineField(“number7”, long.class, Opcodes.ACC_PRIVATE\
    \ | Opcodes.ACC_VOLATILE | Opcodes.ACC_TRANSIENT);\n```\n\n插桩结果为：\n\n```java\n\
    private volatile transient number7;\n```\n\n83\n\n![](img/Image00000.gif)\n\n\
    # value 方法\n\n`value` 方法仅适用于静态变量。例如，`SERIALNUMBER` 是静态变量：\n\n```java\nbuilder.defineField(“SERIALNUMBER”,\
    \ long.class, Visibility.PUBLIC, FieldManifestation.FINAL, Ownership.STATIC).value(12345L);\n\
    ```\n\n通过此配置，`SERIALNUMBER` 实例变量将具有 `12345` 的 long 类型。如果在非静态实例变量上使用 `value` 方法，例如：\n\
    \n```java\nbuilder.defineField(“number1”, long.class,\nVisibility.PRIVATE).value(1000L);\n\
    ```\n\nlong 值 `1000` 将不会被设置为 `number1` 实例变量。要为实例变量赋值，必须通过构造函数设置 `value`。这是因为 Java\
    \ 字节码规范要求由构造函数为实例变量赋值。第 12 章将解释如何在构造函数中为实例变量赋值。\n\n# 总结\n\n本章解释了如何动态声明实例变量。\n\n\
    84\n\n![](img/Image00000.gif)\n\n# 第 11 章：生成 Java 方法\n\n本章解释了如何向功能代码中动态生成 Java\
