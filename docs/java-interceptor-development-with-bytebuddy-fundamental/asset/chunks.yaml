    \n223\n\n![](img/Image00000.gif)\n\n### 总结\n\n本章介绍了如何向现有 Java 类添加内部类，以及如何拦截现有类的内部类和匿名类。\n\
    \n224\n\n![](img/Image00000.gif)\n\n### 第 19 章：生成生成接口、枚举、注解、子类和抽象类\n\n本章介绍了如何动态生成接口、枚举、注解和子类。本章的源码包含在\
