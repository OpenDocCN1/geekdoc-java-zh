  trans: "\nJava 类文件将发生变化：类文件包含建议代码（advice code）和功能代码（functional code）。上面的解释使用 Java\
    \ 源代码来展示插桩代码，以便于理解。项目会将此 Java 源代码存储在 `sourceCodeView` 文件夹中。\n\n## 执行项目\n\n项目使用\
    \ maven 构建过程来生成插桩代码。要启动 maven 构建，请使用 `maven clean package -X` 命令执行项目。\n\n按照以下步骤在\
    \ Eclipse 中执行 `clean package -X`：\n\n1. 右键点击项目根节点 `ChapterVisitOnMethodEnter`。\n\
    2. 选择 `Run as` -> `Maven build`。Eclipse 将显示 `Edit Configuration` 窗口。\n3. 在 `Goals`\
    \ 文本框中输入 `clean package -X`。\n4. 点击 `Run` 按钮启动 maven 构建过程。\n\n![](img/Image0001.jpg)\n\
    \n22\n\n![](img/Image00000.gif)\n\n一旦 maven 构建过程完成，执行 `InterceptorProgram.java`：\n\
    \n1. 在 Eclipse 的包资源管理器（package explorer）或项目资源管理器（project explorer）中右键点击 `InterceptorProgram.java`。\n\
    2. 选择 `Run as` -> `Java application`。\n\nEclipse 将执行 `InterceptorProgram.java`，这是\
    \ Eclipse 控制台上的结果：\n\n```\nAug 1, 2020 1:00:00 PM com. millionstrengthknowledge.interceptorprj.program.\
    \ DataProducer create INFO: Method start\ncreate data\n```\n\n## Maven 构建过程\n\n\
    maven 构建过程包含以下流程：\n\n1. Maven 清理项目的 target 文件夹。\n2. Maven 编译项目中的所有可用的 Java 源代码，并将\
    \ Java 类文件存储在项目 target 文件夹中。\n3. Maven 通过调用 `InterceptorPlugin.java` 执行 ByteBuddy\
    \ 插桩过程。\n4. 插件程序将逐一扫描项目 target 文件夹中的所有 Java 类文件。\n5. 对于每个 Java 类文件，插件程序调用 `matches`\
    \ 方法来寻找需要拦截的功能代码。\n6. 如果找到，则 `matches` 方法返回 `true`，插件程序继续执行 `apply` 方法。如果未找到，插件程序将从第\
    \ 5 步重复该过程。\n7. 在 `apply` 方法中，`InterceptorPlugin.java` 将建议代码应用到功能代码中。\n8. `InterceptorPlugin.java`\
    \ 在字节码中创建插桩代码 23\n\n![](img/Image00000.gif)\n\n（Java 类文件）格式并将代码存储在项目 target 文件夹中。\n\
    9. Maven 重复第 4 步到第 8 步，直到 `InterceptorPlugin.java` 检查完项目中所有的类文件。\n10. Maven 创建一个\
    \ jar 包，打包所有包含插桩代码 Java 类文件。\n\n这是 `pom.xml` 中的 ByteBuddy 配置：\n\n```xml\n<plugin>\n\
    \  <groupId>net.bytebuddy</groupId>\n  <artifactId>byte-buddy-maven-plugin</artifactId>\n\
    \  <version>${bytebuddy.version}</version>\n  <executions>\n    <execution>\n\
    \      <goals>\n        <goal>transform</goal>\n      </goals>\n    </execution>\n\
    \  </executions>\n  <configuration>\n    <transformations>\n      <transformation>\n\
    \        <plugin>com.millionstrengthknowledge. interceptorprj.plugin.InterceptorPlugin</plugin>\n\
    \      </transformation>\n    </transformations>\n  </configuration>\n</plugin>\n\
    ```\n\n插件需要 `byte-buddy-maven-plugin`。要启用插桩过程，`<goal>` 标签的值必须为 `transform`。因此，ByteBuddy\
    \ 插桩过程的另一个名称是 `transformation`。\n\n`<transformation>` 标签必须具有插件程序的完全限定类名。项目使用了\
    \ `com.millionstrengthknowledge. interceptorprj.plugin.InterceptorPlugin`。项目可以拥有一个或多个插件程序。\n\
    \n24\n\n![](img/Image00000.gif)\n\n## InterceptorPlugin\n\n`InterceptorPlugin.java`\
    \ 是执行匹配逻辑和拦截逻辑的插件程序。`InterceptorPlugin.java`实现了 Java 接口 `net.bytebuddy.build.Plugin`，并从接口派生了三个方法：`matches`、`apply`、`close`：\n\
    \n```java\npublic class InterceptorPlugin implements Plugin {\n  @Override\n \
    \ public boolean matches(TypeDescription target) {\n    //code omitted\n  }\n\
    \  @Override\n  public Builder<?> apply(Builder<?> builder, TypeDescription typeDescription,\
    \ ClassFileLocator classFileLocator) {\n    /*code omitted*/\n  }\n  @Override\n\
    \  public void close() throws IOException {\n    /*code is omitted*/\n  }\n}\n\
    ```\n\n插件程序将检查项目 target 文件夹中的所有 Java 类文件。插件程序调用 `matches` 方法来执行第一级匹配逻辑。这是在 `InterceptorPlugin.java`\
    \ 中实现的匹配逻辑：\n\n```java\npublic boolean matches(TypeDescription target) {\n  System.out.println(\"\
    Inspecting \"++target.getName());\n  if(target.getName().equals(DataProducer.class.getName())){\
    \ {\n    System.out.println(\"Found target code: \"++target.getName());\n    return\
    \ true;\n  } else {\n    System.out.println(\"Inspected code \" + target.getName()\
    \ + \" is not the target code\");\n  }\n}\n```\n\n25\n\n![](img/Image00000.gif)\n\
    \n在第 7 到 9 行中，匹配逻辑想要找到 `DataProducer.class` 文件。该逻辑将当前 Java 类的名称与 `DataProducer`\
    \ 的类名进行比较。当类匹配时，方法返回 `true`。\n\n"
- fmt: "\n```java\npublic class LogInterceptor {\n    public static Logger logger=Logger.getLogger(LogInterceptor.class.getName());\n\
    \n    @OnMethodEnter\n    public static void start() {\n        logger.log(Level.INFO,\
    \ “Method start”);\n    }\n}\n```\n\nIn `LogInterceptor.java`, the `start` method\
    \ is the method that provides the advice logic. The `start` method is very simple,\
    \ the method simply creates a log message states that the instrumented method\
    \ is started.\n\nThe `@OnMethodEnter` annotation must be annotated on this method\
    \ so that `ByteBuddy` knows the code segment that provides the advice logic. Besides\
    \ that, the advice method must be `static`. Otherwise the instrumentation process\
    \ will fail.\n\nTherefore, `ByteBuddy` transforms the functional code into instrumented\
    \ code via this process:\n\n![](Image00000.gif)\n\n(1) Finds the static method\
    \ with `@OnMethodEnter` annotation:\n\n```java\n@OnMethodEnter\npublic static\
    \ void start() {\n    logger.log(Level.INFO, “Method start”);\n}\n```\n\n(2) Convert\
    \ the method content into bytecode that is valid for Java execution. In this case,\
    \ this will be:\n\nFrom\n`logger.log(Level.INFO, “Method start”)`\n\nTo\n`LogInterceptor.logger.log(Level.INFO,\
    \ “Method start”)`.\n\n(3) After that, `ByteBuddy` adds the generated bytecode\
    \ into `DataProducer.class`: So, the result of instrumented code contains the\
    \ non-functional code and functional code:\n\n```java\npublic void create() {\n\
    \    LogInterceptor.logger.log(Level.INFO, “Method start”);\n    System.out.println(“create\
    \ data”);\n}\n```\n\nPlease be noticed that `ByteBuddy` only processes the Java\
    \ bytecode in Java class format. This means the `DataProducer.java` remains unchanged,\
    \ but the `DataProducer.class` will change. The explanation above uses Java source\
    \ code to explain for easy-to-understand purpose.\n\n29\n![](Image00000.gif)\n\
    \n## Maven pom.xml error\n\nIn Spring Tool Suite, the Eclipse project will show\
    \ this error message: “Plugin execution not covered by lifecycle configuration\
    \ bytebuddy maven plugin” in `pom.xml`. The error does not affect the instrumentation\
    \ process. Therefore, just ignore the error. To ignore the error, in Spring Tool\
    \ Suite, goto `windows menu->Preferences->Maven->Errors/warning`, disable the\
    \ error by “`ignore`”.\n\n## Difference between Java programming and Java Bytecode\
    \ programming\n\nJava programing is different from Java bytecode programming because\
    \ Java bytecode programming programs according to Java class syntax, while Java\
    \ programming uses Java language syntax. For example, Java programming permits\
    \ this type of initialization of value of instance variable:\n\n```java\npublic\
    \ class DataProducer{\n    private String data=”<noData>”;\n}\n```\n\nHowever,\
    \ in Java bytecode, this is no effective. `JVM` will not raise runtime exception\
    \ for this, but the code is simply not effective, that means the `data` instance\
    \ variable will remain `null` value. To properly initialize the value of instance\
    \ variable in Java bytecode, the initialization must be done via constructor:\n\
    \n```java\npublic class DataProducer{\n    private String data;\n    public DataProducer(){\
    \ data=”<noData>”; } }\n}\n```\n\nTherefore, whenever learner develops code for\
    \ interceptor or code generation in `ByteBuddy`, the learner must develop the\
    \ Java code according to Java bytecode syntax. `Java Virtual Machine Specification`\
    \ is the document that provides more information on Java bytecode, and the document\
    \ is available for download from the Internet.\n\n30\n![](Image00000.gif)\n\n\
    Nevertheless, most of the Java programming syntax are still applicable because\
    \ `ByteBuddy` will translate it accordingly. There are some exception cases that\
    \ must be aware of. This book will explain about this type of exception when the\
    \ example code has this type of situation.\n\n## Conclusion\n\nThis chapter explains:\n\
    - How to execute `ByteBuddy` instrumentation process in Eclipse\n- The instrumentation\
    \ process via Maven build process.\n- How to execute generated bytecode via `InterceptorProgram.java`,\
    \ and view its result on console\n- The configuration of plugin in `pom.xml`\n\
    - How to create plugin program\n- How to create `On Method Enter` advice\n- How\
    \ to inline bytecode of advice code into bytecode of functional code by using\
    \ the `visit` method of `net.bytebuddy.dynamic.DynamicType.Builder`\n\n31\n![](Image00000.gif)\n\
    \n## Chapter 3: OnMethodExit Advice\n\nThe source code for this chapter is included\
    \ in `ChapterVisitOnMethodExit` Eclipse project. This is the project structure:\n\
    \nThe project structure has the same structure with the project structure in Chapter\
    \ 2. All the code have the same implementation with the code in Chapter 2. The\
    \ only difference is that the `LogInterceptor.java` uses `@OnMethodExit` annotation\
    \ in this chapter.\n\n![](Image00013.jpg)\n\n32\n![](Image00000.gif)\n\nThis chapter\
    \ applies `On Method Exit` advice. `On Method Exit` advice adds the advice code\
    \ at the end of the method execution.\n\nFunctional code:\n```java\npublic void\
    \ create(){\n    System.out.println(“create data”);\n}\n```\n\nInstrumented code:\n\
    ```java\npublic void create(){\n    System.out.println(“create data”);\n    LogInterceptor.logger.log(Info.LEVEL,\
    \ “Method end”);\n}\n```\n\nThis is the advice code for this chapter:\n\n```java\n\
    public class LogInterceptor {\n    public static Logger logger=Logger.getLogger(LogInterceptor.class.getName());\n\
    \n    @OnMethodExit\n    public static void methodEnd() {\n        logger.log(Level.INFO,\
    \ “Method end”);\n    }\n}\n```\n\nTo implement `On Method Exit` advice, the advice\
    \ code annotates the `methodEnd` static method with the `@OnMethodExit` annotation.\
    \ `ByteBuddy` then inlines the bytecode of the advice code to the `create` method,\
    \ and produces the instrumented code stated above.\n\nTo view the result of the\
