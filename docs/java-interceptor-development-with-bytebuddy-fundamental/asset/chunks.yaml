- fmt: "\nThe code pattern used to create the generic constructor is very similar\
    \ to the generic method. So this chapter will create only one constructor for\
    \ the example. The constructor has one type argument `R`. The `R` type argument\
    \ is used in the third parameter of the constructor. The first and second parameter\
    \ uses `A` and `B`, the type argument of the `DataProducer.java`. So this code\
    \ should generates the constructor:\n\n```java\nbuilder.defineConstructor(Visibility.PUBLIC)\n\
    .withParameters(A_type, B_type, R_type)\n.typeVariable(“R”)\n.intercept(MethodCall.invoke(\n\
    Object.class.getDeclaredConstructor()));\n```\n\n### Developing interceptor with\
    \ generic type\n\nJava applies type erasure for generic type. When developing\
    \ the interceptor, the advice code is required to manage the object differently\
    \ because the type erasure will change the data type that is implemented before\
    \ compilation. For example, the `DataProcessor.java` has type argument of `P`\
    \ , and `Q` extends `Number`.\n\n```java\npublic class DataProcessor<P,Q extends\
    \ Number> {\n    public void process(P p, Q q) {\n        System.out.println(“Paramerer1:\
    \ “+p);\n        System.out.println(“Paramerer2: “+q);\n    }\n}\n```\n\n![](Image00000.gif)\n\
    \nIf the advice code wants to intercept the parameter of `process` method, the\
    \ advice code needs to use `java.lang.Object` and `java.lang.Number` to map the\
    \ first and second parameter. The `DataProcessorInterceptor.java` is the advice\
    \ code developed for `DataProcessor.class`:\n\n```java\npublic class DataProcessorInterceptor\
    \ {\n    @Advice.OnMethodEnter\n    public static void start(\n        @Argument(\n\
    \            value=0,readOnly=false,\n            typing=Assigner.Typing.DYNAMIC\n\
    \        ) Object param1,\n        @Argument(\n            value=1,readOnly=false,\n\
    \            typing=Assigner.Typing.DYNAMIC\n        ) Number param2) {\n    \
    \    if(param1 instanceof String) {\n            param1 = param1+”randomdata”;\n\
    \        }\n        if(param2 instanceof Integer){\n            param2=((Integer)param2)+1;\n\
    \        }\n    }\n}\n```\n\nThe advice code implements the `on method enter`\
    \ advice. The `param1` parameter is mapped to the first parameter of `process`\
    \ method. The first parameter of the `process` method is typed to `P`. When mapping\
    \ this type of parameter in advice code, the `java.lang.Object` is used because\
    \ the type parameter is changed to `java.lang.Object` after compilation.\n\nThe\
    \ `param2` parameter is mapped to the second parameter of the `process` method.\
    \ The second parameter of the `process` method is typed to `Q`, which has upper\
    \ bound of `java.lang.Number`. So the `java.lang.Number` can be used to map to\
    \ the second parameter.\n\nWhen the advice code processes the parameter, the advice\
    \ code needs to check the data type of the parameter. In this example, the advice\
    \ code uses `instanceof` to check the data type of `param1`. If the `param1` is\
    \ a `java.lang.String`, then appends a “ ramdomdata ` to the `param1`. If the\
    \ `param2` is a `java.lang.Integer`, then adds one to the integer.\n\nTherefore,\
    \ the advice code must aware of the type erasure when programming for the generic\
    \ type.\n\n### Conclusion\n\nThis chapter explains on how to generate the generic\
    \ instance variable, generic method and generic constructor.\n\n![](Image00000.gif)\n\
    \n## Chapter 14: Add and Remove Java Annotation\n\nThis chapter explains on how\
    \ to add and remove Java annotation that is annotated on constructor, Java method,\
