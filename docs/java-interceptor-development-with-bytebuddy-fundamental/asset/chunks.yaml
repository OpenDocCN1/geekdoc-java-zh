    return result;\n}\n```\n\nThe `aroundReturn` method is a around advice that can\
    \ return an object. The method uses these annotation, which is included in `net.bytebuddy.implementation.bind.annotation`\
    \ package:\n\n- `@Super`\n- `@SuperMethod`\n- `@This`\n- `@AllArguments`\n- `@Argument`\n\
    - `@FieldValue`\n\n74\n![](Image00000.gif)\n\n### @Super\n`@Super` annotation\
    \ provides the instance of proxy class that is generated by ByteBuddy.\n\nParameter:\
    \ `@Super Object zuper`\n\n```java\nSystem.out.println(zuper.getClass().getName());\n\
    ```\nprints this string value on the screen:\n`com.millionstrengthknowledge.interceptorprj.program.DataProducer$auxiliary.mxySvqOW`\n\
    \n### @SuperMethod\n`@SuperMethod` annotation provides the instance of `java.lang.reflect.Method`\
    \ that representes the delegated method:\n\nParameter: `@SuperMethod Method superMethod`\n\
    \n```java\nSystem.out.println(superMethod.getName());\n```\nprints this string\
    \ value on the screen:\n`createDataOriginal`\n\nThe example here provides a simple\
    \ method name. ByteBuddy can actually create the method name with random character,\
    \ for example, `createData$original$AOgPLhp9$accessor$sMMz5BQl`\n\n### @This\n\
    `@This` annotation provides the instance of the functional code. For example:\n\
    \nParameter: `@This Object target`\n\n```java\nSystem.out.println(target.getClass().getName());\n\
    ```\nprints this string value on the screen:\n`com.millionstrengthknowledge.interceptorprj.program.DataProducer`\n\
    \n75\n![](Image00000.gif)\n\n### @AllArguments\n`@AllArguments` annotation provides\
    \ the value of all the parameters of `createData` method in object array format.\
    \ For example, `InterceptorProgram.java` invokes:\n\n`new DataProducer.create(1,\
    \ ”base64”);`\n\nParameter: `@AllArguments Object[] args`\n\n```java\nSystem.out.println(args[0]+”\
    \ ”+args[1]);\n```\nprints this string value on the screen:\n`1 base64`\n\n###\
    \ @Argument\n`@Argument` annotation provides the value of parameter of `createData`\
    \ method. This annotation accepts one integer parameter that represents the index\
    \ number of method parameter. For example, `InterceptorProgram.java` invokes:\n\
    \n`new DataProducer.create(1, ”base64”);`\n\nParameter:\n- `@Argument(0) int p1`\n\
    - `@Argument(1) String p2`\n\n```java\nSystem.out.println(p1+” ”+p2);\n```\nprints\
    \ this string value on the screen:\n`1 base64`\n\nIndex 0 means first parameter,\
    \ index 1 means second parameter, and so on. Around advice cannot alter the value\
    \ of the parameter of functional method.\n\n### @FieldValue\n`@FieldValue` annotation\
