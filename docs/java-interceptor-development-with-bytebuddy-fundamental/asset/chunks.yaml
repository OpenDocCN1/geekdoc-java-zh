    \        data2=b;\n        data3=c;\n    }\n}\n```\n\n`define` 方法克隆了 `ConstructorPrototype.java`\
    \ 中包含三个参数（`int.class`、`String.class`、`String.class`）的构造函数。为了让 `define` 方法克隆构造函数，程序必须将一个\
    \ `java.lang.reflect.Constructor` 实例传递给 `define` 方法的参数。然而，`define` 方法永远不会克隆方法体，以及声明在原型构造函数上的注解。\n\
    \n115\n![](img/Image00000.gif)\n\n与 Java 方法类似，新声明的构造函数需要构造函数体。`intercept` 方法使用\
    \ `MethodCall` 来生成构造函数体：\n\n```java\n.intercept(MethodCall.invoke(Producer.class.getConstructor()));\n\
