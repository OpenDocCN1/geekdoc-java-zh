  trans: "\n\n默认情况下，`maven-jar-plugin` 会创建一个包含 Eclipse 项目中所有 Java 类文件的 jar 包。该应用程序还需要专门创建一个仅包含\
    \ agent 相关的 Java 类文件的 jar 包。因此，在本章中，`pom.xml` 为 agent jar 包创建一个新的 `<execution>`\
    \ 标签。该配置包含值为 `agent` 的 `<id>` 标签。由于该 jar 包仅为 agent 创建，因此该 jar 包将仅包含通过 `<include>`\
    \ 标签指定的 `com.millionstrengthknowledge.interceptorprj.interceptor` 包中的 Java 类文件。此外，插件需要指定\
    \ `MANIFEST.MF` 的文件位置，以便构建过程能够打包包含 `Premain-Class` 属性的清单文件。`pom.xml` 使用 `<manifestFile>`\
    \ 标签来实现这一目的。\n\n## 在 Eclipse 中运行程序\n\n要查看插桩处理过程的结果，请先执行 maven 构建过程：\n\n1. 在 Eclipse\
    \ 的项目/包资源管理器中，右键点击 `pom.xml`。\n2. 选择 `Run As -> Maven build`。\n3. Eclipse 会显示“Edit\
    \ configuration”窗口，在 `Goals` 文本框中输入 `clean package -X`：\n4. 点击 `Run` 按钮。之后，maven\
    \ 构建过程将开始。\n\nmaven 构建过程完成后，执行 `InterceptorProgram.java`：\n\n1. 在 Eclipse 的项目/包资源管理器中，右键点击\
    \ `InterceptorProgram.java`。\n2. 选择 `Run as -> Java Application`。\n3. Eclipse\
    \ 将显示“Run configurations”。\n4. 选择 `Arguments` 标签页，在 `VM arguments` 文本框中输入此值：`--add-reads\
    \ java.base=java.logging -javaagent:C:/Users/user001/workspace/Interceptor/ChapterJdkInstrumentation/target/ChapterJdkInstrumentation-1.0-agent.jar`。有两个\
    \ VM 参数：\n\n- `--add-reads java.base=java.logging`: 这是必要的，因为 `java.base` 和 `java.logging`\
    \ 位于不同的模块，而 `LogInterceptor.java` 需要 `java.logging` 模块，因此配置了此参数。\n- `-javaagent:C:/Users/user001/workspace/Interceptor/ChapterJdkInstrumentation/target/ChapterJdkInstrumentation-1.0-agent.jar`:\
    \ `-javaagent` 参数指定了 agent jar 包的位置。该 jar 包是由本章 Maven `pom.xml` 文件部分配置的 maven\
    \ 构建过程生成的。请修改文件路径以指向正确的 agent jar。\n\n5. 之后，按下 `Run` 按钮执行程序。这是 `InterceptorProgram.java`\
    \ 的源码：\n\n```java\npublic static void main(String args[]){\n    String data=new\
    \ String(“testTEST”);\n    data.toUpperCase();\n}\n```\n\n程序创建了一个 `data` String\
    \ 变量，然后在该变量上调用了 `toUpperCase` 方法。预期的程序输出将包含建议代码（advice code）打印的来自 `toUpperCase`\
    \ 方法进入和退出建议的日志。Eclipse 控制台应显示此结果：\n\nByteBuddyAgent 生成了插桩处理过程的追踪信息（trace）。该追踪通过\
    \ `InterceptorAgent.java` 中的此配置被启用：\n\n```java\n.with(AgentBuilder.Listener.StreamWriting.toSystemOut())\n\
    ```\n\n检查追踪信息，该信息应包含由 `java.lang.String` 中 `toUpperCase` 方法的建议代码创建的日志（显示为红色）：\n\
    \n```\nJan 01, 2020 1:00:00PM java.lang.String toUpperCase INFO: Method Enter:\
    \ public java.lang.String java.lang.String.toUpperCase()\nJan 01, 2020 1:00:00PM\
    \ java.lang.String toUpperCase INFO: Method Exit: public java.lang.String java.lang.String.toUpperCase()\
    \ return: ‘TESTTEST’\n```\n\n这意味着 `InterceptorAgent.java` 已经成功插桩了 `java.lang.String`。\n\
    \n然而，请注意，JVM 不允许 agent 向 JDK 核心类添加或删除方法、构造函数和实例变量。因此，在插桩过程中对 JDK 核心类执行 `defineMethod`、`defineField`\
    \ 和 `defineConstructor` 方法没有效果。\n\n## 结论\n\n本章解释了如何向 JDK 核心类添加方法进入和退出建议。\n\n"
