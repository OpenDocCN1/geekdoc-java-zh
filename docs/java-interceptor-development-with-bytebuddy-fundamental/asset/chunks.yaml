    In DataReaderPlugin .java, the first level matching logic is implemented in matches
    method. The matching logic uses getName method to match the DataProducer.java
    . Once the class is matched, the method returns true and continue to apply method.


    The apply method will create two new inner classes: Storage.java and Util.java
    . The net.bytebuddy.description.type.TypeDescription. Latent is the fundamental
    Java class used to create inner class in ByteBuddy. The apply method uses TypeDescription.Latent
    to create firstInnerTd and secondInnerTd instance, which represents the Storage.java
    and Util.java respectively:


    TypeDescription firstInnerTd =


    new TypeDescription.Latent(


    “com.millionstrengthknowledge.interceptorprj


