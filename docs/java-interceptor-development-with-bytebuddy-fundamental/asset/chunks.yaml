    \ }\n    @Advice.OnMethodExit\n    public static void end(\n        @Argument(value=1,readOnly=false)\n\
    \        Map<String,Object> data,\n        @Return(readOnly=false) int total\n\
    \    ) {\n        total = (Integer)data.get(\"total\");\n    }\n    //其他代码省略\n\
    }\n```\n"
- fmt: "\nThe `LocalVariableAdvice.java` implements both on method enter and exit\
    \ advice, their name are “ enter ” and “ end ” respectively. Observed that `LocalVariableAdvice.class`\
    \ is used in the first visit method. So the `ByteBuddy` will generate a nested\
