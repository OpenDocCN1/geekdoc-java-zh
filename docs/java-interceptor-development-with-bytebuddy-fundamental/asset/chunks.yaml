    \ according to the steps stated in Chapter 2.\n\n33\n![](Image00000.gif)\n\nThe\
    \ result of execution of the instrumented code should be similar to this, which\
    \ is available in Eclipse console:\n```\ncreate data\nOct 1, 2020 1:00:00 PM com.million.interceptor.program.\
    \ DataProducer create\nINFO: Method end\n```\n\nConclusion: This chapte explains\
    \ on how to create On Method Exit advice\n\n34\n![](Image00000.gif)\n\n## Chapter\
    \ 4: Advice Method Parameter\n\nAdvice code can declare both `On Method Enter`\
    \ and `On Method Exit` advice in the same advice Java file. The static method\
