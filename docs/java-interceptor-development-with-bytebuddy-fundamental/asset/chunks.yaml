  trans: "\n到目前为止，所有章节仅使用了 `net.bytebuddy.description.type.TypeDescription` 的 `getName`\
    \ 方法。`TypeDescription` 是 ByteBuddy 编程中使用的基础 Java 类。`TypeDescription` 提供了一组 API，允许开发者检查\
    \ Java 类。它类似于 Java 反射 API，但提供了更多功能。在 `InterceptorUtilPlugin.java` 中，`matches`\
    \ 方法使用了 `TypeDescription` 的 `isGenerified` 方法，以下是该方法的实现代码：\n\n```java\nif(target.getName().startsWith(\"\
    com.millionstrengthknowledge.interceptorprj.util\")&& target.isGenerified()) {\n\
    \    System.out.println(\"InterceptorUtilPlugin found target: \"+target.getName());\n\
    \    return true;\n}\nelse\n    return false;\n}\n```\n\n`target` 变量是 `matches`\
    \ 方法的参数，它是 `TypeDescription` 的实例。当 `target` 变量表示的 Java 类被封装在 `com.millionstrengthknowledge.interceptorprj.util`\
    \ 包中，且该目标是一个泛型类时，匹配逻辑返回 true。当目标 Java 类在类级别使用类型参数时，`isGenerified` 方法返回 true。`DataProducerUtil.java`\
    \ 是在类级别使用一个类型参数 `A` 的泛型 Java 类：\n\n```java\npublic class DataProducerUtil<A> {\n\
    \    //code is omitted\n}\n```\n\n因此，`DataProducerUtil.java` 符合匹配逻辑中提供的条件，它将继续应用\
    \ `InterceptorUtilPlugin.java` 的方法进行进一步的插桩处理。\n\n### ElementMatchers.isSetter\n\
    \n`apply` 方法中有八个访问（visit）方法。第一个访问方法的实现：\n\n```java\nbuilder.visit(new MemberAttributeExtension.ForMethod()\n\
    \    .annotateMethod(ElementMatcherUtil.create(\"isSetter(uniqueId)\"))\n    .on(ElementMatchers.isSetter(\"\
    uniqueId\")));\n```\n\n`visit` 方法使用 `MemberAttributeExtension.ForMethod` 对 Java\
    \ 类进行插桩。插桩为使用 `uniqueId` 实例变量的 setter 方法添加了 `@ElementMatched(\"isSetter(uniqueId)\"\
    )`。插桩处理后，`DataProducerUtil.class` 的 `setUniqueId` 方法添加了注解：\n\n```java\n@ElementMatched(\"\
    isSetter(uniqueId)\")\npublic void setUniqueId(long id){ uniqueId=id; }\n```\n\
    \n这里的关注重点是程序如何应用 `ElementMatchers` 来匹配目标 Java 元素以添加注解。在本示例中使用了 `ElementMatchers.isSetter`\
    \ 方法。`isSetter` 方法是匹配与参数指定的实例变量名相同的 setter 方法的匹配器。此示例使用 `uniqueId` 作为参数。因此，选择了\
    \ `setUniqueId` 方法添加注解。\n\n### ElementMatcherUtil\n\n`ElementMatcherUtil.java`\
    \ 是一个工具 Java 类：\n\n```java\npublic class ElementMatcherUtil {\n    public static\
    \ AnnotationDescription create(String type) {\n        AnnotationDescription a\
    \ = AnnotationDescription.Builder.ofType(ElementMatched.class)\n            .define(\"\
    value\", type)\n            .build();\n        return a;\n    }\n}\n```\n\n`ElementMatcherUtil.java`\
    \ 有一个名为 `create` 的方法。该方法接受一个 `java.lang.String` 参数。该方法创建一个代表 `ElementMatched.class`\
    \ 的 `AnnotationDescription` 实例。`ElementMatched.java` 是本章节使用的自定义 Java 注解：\n\n```java\n\
    @Retention(RetentionPolicy.RUNTIME)\n@Target({\n    ElementType.TYPE,\n    ElementType.CONSTRUCTOR,\n\
    \    ElementType.METHOD,\n    ElementType.FIELD\n})\npublic @interface ElementMatched\
    \ {\n    String value();\n}\n```\n\n该注解有一个 value 属性。从 `ElementMatcherUtil.java`\
    \ 的 `create` 方法传递的数据将存储在 `value` 属性中。例如，当程序调用 `ElementMatcherUtil.create(\"isSetter(uniqueId)\"\
    )` 时，程序将通过 `MemberAttributeExtension.ForMethod.java` 的 `annotateMethod` 方法标注 `@ElementMatched(\"\
    isSetter(uniqueId)\")` 注解。\n\n这就是 `ElementMatcherUtil.java` 如何为功能代码添加 `@ElementMatched`\
    \ 注解的方式。这个工具 Java 类将在本章节的所有示例中被复用。\n\n### ElementMatchers.isGetter\n\n第二个访问方法为\
    \ `uniqueId` 实例变量的 getter 方法添加 `@ElementMatched` 注解：\n\n```java\nbuilder.visit(new\
    \ MemberAttributeExtension.ForMethod()\n    .annotateMethod(ElementMatcherUtil.create(\"\
    isGetter(uniqueId)\"))\n    .on(ElementMatchers.isGetter(\"uniqueId\")));\n```\n\
    \n为了这个目的，使用了 `ElementMatchers.isGetter` 方法来匹配 getter 方法。插桩处理后，`@ElementMatched(\"\
    isGetter(uniqueId)\")` 被添加到 `DataProducerUtil.class` 的 `getUniqueId` 方法：\n\n```java\n\
    @ElementMatched(\"isGetter(uniqueId)\")\npublic long getUniqueId() { return uniqueId;\
    \ }\n```\n\n### ElementMatchers.isAnnotatedWith\n\n接下来，`visit` 方法使用了 `ElementMatchers.isAnnotatedWith`\
    \ 方法：\n\n```java\nbuilder.visit(new MemberAttributeExtension.ForMethod()\n   \
    \ .annotateMethod(ElementMatcherUtil.create(\"isAnnotatedWith(Deprecated.class)\"\
    ))\n    .on(ElementMatchers.isAnnotatedWith(Deprecated.class)));\n```\n\n当方法带有参数中指定的注解时，`isAnnotatedWith`\
    \ 方法返回 true。在本示例中，该注解是 `@Deprecated` 注解。因此，`DataProducerUtil.class` 的 test 方法被选中添加注解，因为它带有\
    \ `@Deprecated` 注解：\n\n```java\n@ElementMatched(\"isAnnotatedWith(Deprecated.class)\"\
    )\n@Deprecated\npublic void test(){ }\n```\n\n### ElementMatchers.isConstructor\n\
    \n接下来，`visit` 方法使用 `ElementMatchers.isConstructor` 方法：\n\n```java\nbuilder.visit(new\
    \ MemberAttributeExtension.ForMethod()\n    .annotateMethod(ElementMatcherUtil.create(\"\
    isConstructor\"))\n    .on(ElementMatchers.isConstructor()));\n```\n\n当类中检测到构造函数时，`isConstructor`\
    \ 方法返回 true。`DataProducerUtil` 中有两个构造函数。因此，这两个构造函数都添加了注解：\n\n```java\n@ElementMatched(\"\
    isConstructor\")\npublic DataProducerUtil(){ }\n\n@ElementMatched(\"isConstructor\"\
    )\npublic DataProducerUtil(long id){ }\n```\n\n`ElementMatchers` 能够匹配所有符合匹配标准的\
    \ Java 元素，例如 `isConstructor`。有时程序只想匹配特定的元素。如果是这种情况，程序需要提供更多的 `ElementMatchers`\
    \ 来组合匹配器以寻找特定匹配。这可以通过 `ElementMatchers` 提供的 `and`, `or` 等方法实现。\n\n还有其他技术可以帮助进行特定匹配。例如，`ElementMatchers.isFinal`\
    \ 方法对所有 final 的 Java 元素返回 true，包括方法和实例变量。然而，`MemberAttributeExtension.ForMethod`\
    \ 被限制为仅匹配 Java 方法，而 `MemberAttributeExtension.ForField` 被限制为仅匹配实例/类变量。因此，在下一个示例中需要两个访问方法来分别标注方法和实例变量：\n\
    \n```java\nbuilder.visit(new MemberAttributeExtension.ForMethod()\n    .annotateMethod(ElementMatcherUtil.create(\"\
    isFinal-method\"))\n    .on(ElementMatchers.isFinal()))\n.visit(new MemberAttributeExtension.ForField()\n\
    \    .annotate(ElementMatcherUtil.create(\"isFinal-field\"))\n    .on(ElementMatchers.isFinal()));\n\
    ```\n\n通过这两个访问方法，对 `DataProducerUtil.class` 进行插桩的结果如下：\n\n```java\n@ElementMatched(\"\
    isFinal-field\")\nprivate final String record=\"\";\n\n@ElementMatched(\"isFinal-method\"\
    )\nprivate final void process(){ }\n```\n\nrecord 实例变量和 process 方法被选中添加 `@ElementMatched`\
    \ 注解，因为它们是 final 元素。在不使用 `ForMethod` 和 `ForField` 的情况下，另一种技术可以将 `isFinal` 匹配器限制为仅针对方法：\n\
    \n```java\nElementMatchers.isFinal().and(ElementMatchers.isMethod());\n```\n"
- fmt: "\n### `ElementMatchers.isFinal()`\n\n```\n.and(ElementMatchers.isField());\n\
    ```\n\n`and` method and `isMethod` method are used to limit the matching scope\
    \ to method only. Same concept applies to the instance variable.\n\n### `ElementMatchers.returns`,\
    \ `ElementMatchers.takesGenericArgument`\n\nThe next example introduces two new\
    \ matcher methods: `ElementMatchers.returns` and `ElementMatchers.takesGenericArgument`:\n\
    \n```java\nbuilder.visit(new MemberAttributeExtension\n.ForMethod()\n.annotateMethod(ElementMatcherUtil\n\
    .create(\n“returns(long) and takesGenericArgument(A)”))\n.on(\nElementMatchers.returns(long.class).and(\n\
    ElementMatchers.takesGenericArgument(\n1, TypeDescription.Generic.Builder\n.typeVariable(“A”).build())\n\
    ))\n);\n```\n\nThe matching criteria attempts to match the method that returns\
    \ `long` value, and its second parameter is a generic type variable `“A”`. The\
    \ `returns` method is used to match the method that return `long` value. The `takesGenericArgument`\
    \ method is used to match the second parameter. The first parameter of `takesGenericArgument`\
    \ method specifies the index number of the parameter. Because the matcher wants\
    \ to match second parameter, so the value of `“ 1 ”` is used. Then, the program\
    \ creates the type variable instance for `“ A ”`, and passes it in second parameter\
    \ of `takesGenericArgument` method. Therefore, the program should annotate the\
    \ `execute` method of `DataProducerUtil.class` because it matches the matching\
    \ criteria:\n\n```java\n@ElementMatched(“returns(long) and takesGenericArgument(A)”)\n\
    public long execute(int p1, A p2) { return -1; }\n```\n\n### `ElementMatchers.canThrow`,\
    \ `ElementMatchers.or`\n\nNext, the example uses `ElementMatchers.returns`, `ElementMatchers.canThrow`,\
    \ and `ElementMatchers.or` method to form the combination of matchers:\n\n```java\n\
    builder.visit(\nnew MemberAttributeExtension.ForMethod()\n.annotateMethod(ElementMatcherUtil.create(\n\
    “returns(long) and (throw SQLException or\nClassNotFoundException”))\n.on(\nElementMatchers.returns(long.class).and(\n\
    ElementMatchers.canThrow(\nSQLException.class).or(\nElementMatchers.canThrow(\n\
    ClassNotFoundException.class))))\n);\n```\n\nThe matching attempts to match the\
    \ method that returns `long` value, and the method declares either `SQLException`\
    \ or `ClassNotFoundException` in the `throws` clause. The example uses the similar\
    \ `returns` method explained in previous example. Then, the matching criteria\
    \ uses `and` method to chain to another matcher combination, which uses `canThrow`\
    \ method. The `canThrow` method returns `true` when the `throw` clause matches\
    \ with the exception specified in the parameter. The `or` method is used because\
    \ the matching wants to match either `SQLException` or `ClassNotFoundException`.\
    \ Therefore, the `processRecord` and `processData` method of `DataProducerUtil.class`\
    \ are selected because they fulfill the matching criteria:\n\n```java\n@ElementMatched(“returns(long)\
    \ and (throw\nSQLException or ClassNotFoundException”)\npublic long processData()\
    \ throws SQLException{\nreturn -1;\n}\n\n@ElementMatched(“returns(long) and (throw\n\
    SQLException or ClassNotFoundException”)\npublic long processRecord() throws SQLException,\
    \ ScriptException{\nreturn -1; }\n```\n\n### `InterceptorRepositoryPlugin`\n\n\
    At this stage, the chapter has completed the explanation for the `InterceptorUtilPlugin.java`.\
    \ There are two more plugin programs: `InterceptorRepositoryPlugin.java` and `InterceptorQueryPlugin.java`.\
    \ This section provides the explanation for the `InterceptorRepositoryPlugin.java`.\
    \ The `matches` method of `InterceptorRepositoryPlugin.java` uses another method\
    \ of `TypeDescription` to implement the matching logic. The matching logic uses\
    \ `isAssignableTo` method:\n\n```java\nif(target.getName().startsWith(“com.\n\
    millionstrengthknowledge.interceptorprj\n.repository”)&&\ntarget.isAssignableTo(Serializable.class))\
    \ {\n  System.out.println(\n“InterceptorRepositoryPlugin found target: “+\ntarget.getName());\n\
    return true;\n}\nelse\nreturn false;\n```\n\nThe `isAssignableTo` method is a\
    \ very useful method. It return `true` when the instance of `TypeDescription`\
    \ represents a Java class that can be assigned to the instance of Java class that\
    \ is specified in its parameter. For example:\n\n```java\nInteger figure=Integer.valueOf(1000);\n\
    Number n=figure;\n```\n\nThe `figure` variable is assignable to `n`. If this is\
    \ expressed in Java code using `isAssignableTo` method, then the code should be:\n\
    \n```java\ntarget.isAssignableto(Number.class)\n```\n\nIn which the `target` variable\
    \ is an instance of `TypeDescription`, and it represents the `java.lang.Integer`.\n\
    \nTherefore, the matching logic specified in the `matches` method is matching\
    \ the Java class that is in `com.millionstrengthknowledge. interceptorprj.repository`\
    \ package, and the class is assignable to `java.lang.Serializable`. Based on this\
    \ matching criteria, only the `UserRepository.class` fulfills the matching criteria\
    \ because this class implements the `java.io.Serializale` interface.\n\n### `ElementMatchers.nameStartsWith`\n\
    \nSo the `UserRepository.class` continues to apply method of `InterceptorRepositoryPlugin.java`.\
    \ The `apply` method has five `visit` method. The first `visit` method uses `ElementMatchers.nameStartsWith`\
    \ method:\n\n```java\nbuilder\n.visit(new MemberAttributeExtension.ForMethod()\n\
    .annotateMethod(ElementMatcherUtil\n.create(“nameStartsWith(‘create’)”))\n.on(ElementMatchers.nameStartsWith(“create”)))\n\
    ```\n\nThe `nameStartsWith` method is similar to the `startsWith` method of `java.lang.String`.\
