    \ 中是硬编码的。因此，它们通过 `query` 方法分别返回 280 和 10 的值。\n\n名为 `\"end\"` 的 `on method exit`\
    \ 建议方法重用了 `totalParam`，并将 `totalParam` 的值传递给 `returnTotal`。`returnTotal` 是在 `end`\
    \ 方法中声明的参数，它使用了 `@Return` 注解。因此，`returnTotal` 在插桩代码中可用，并且可以通过插桩方法的 `return` 语句返回。\n\
    \n这是 `process9` 方法的插桩代码结果：\n\n```java\npublic int process9(long paramLong){\n\
    \    int p = 0;\n    int j = new PriceQuery().query(paramLong);\n    int m = new\
    \ DiscountQuery().query(paramLong);\n    p = j - m;\n    long var1 = paramLong;\n\
    \    int k = 0;\n    k = p;\n    return k;\n}\n```\n\n观察到生成的字节码使用了不同的变量名 `p` 来表示\
    \ `totalParam`，尽管 `@Local` 注解已经声明了 `“ total `。请注意，当插桩过程执行时，字节码会生成不同的变量名 `var1`，插桩代码可以执行价格计算。\n\
    \n### 生成带有嵌套 visit 的方法\n\n接下来，插件程序使用 `defineMethod` 声明 `process10` 方法：\n\n```java\n\
    builder.defineMethod(\n    \"process10\", int.class, Visibility.PUBLIC\n)\n.withParameter(long.class)\n\
    .withParameter(Map.class)\n.intercept(FixedValue.value(0));\n```\n\n插件程序使用 `defineMethod`\
    \ 声明方法。`process10` 方法是一个返回 `int` 值的公共方法。`withParameter` 用于声明两个参数：一个 `long` 参数和一个\
    \ `java.util.Map` 参数。然后 `intercept` 方法生成一个返回零的方法体。\n\n插件程序通过使用多个 `visit` 方法修改\
    \ `process10` 方法。使用了三个建议：`LocalVariableAdvice.class`、`PriceProcessorAdvice.class`,\
    \ `DiscountQueryAdvice.class`。\n\n请注意建议代码的顺序很重要。`process10` 方法的目的是执行价格计算，这与 `process9`\
    \ 方法的 `total = price - discount` 。然而，`process10` 方法与 `process9` 方法不同，因为 `PriceQuery.java`\
    \ 和 `DiscountQuery.java` 分别封装在 `PriceProcessorAdvice.java` 和 `DiscountQueryAdvice.java`\
    \ 中。而 `process9` 方法将 `PriceQuery.java` 和 `DiscountQuery.java` 封装在一个建议方法中。\n\n\
    因此，`@Local` 注解不再适用，`PriceProcessorAdvice.java` 和 `DiscountQueryAdvice.java` 想要访问同一个\
    \ `total` 变量来执行价格计算。此示例利用功能代码的方法参数创建一个对 `PriceProcessorAdvice.java` 和 `DiscountQueryAdvice.java`\
    \ 都可见的局部变量。因为所有建议代码都插桩同一个方法：`process10` 方法，所以所有建议代码都应该能够访问存储在方法第二个参数中的数据。\n\n\
