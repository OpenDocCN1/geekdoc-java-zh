    Double.class parameter\"))\n  .on(ElementMatchers.hasParameters(paramMatcher)));\n\
    ```\n\n当方法参数与参数中指定的参数器匹配成功时，`hasParameters` 返回 `true`。观察到 `hasParameters` 传递了一个\
    \ `paramMatcher` 变量。以下是该 `paramMatcher` 变量的声明：\n\n```java\nElementMatcher<Iterable<?\
    \ extends ParameterDescription>> paramMatcher =\n(paramDescrList)->{\n  for (ParameterDescription\
    \ param : paramDescrList) {\n    int deprecatedCount = param.getDeclaredAnnotations().filter(\n\
    \      ElementMatchers.annotationType(Deprecated.class)).size();\n    if (deprecatedCount\
    \ > 0 && param.getType().equals(\n        TypeDescription.ForLoadedType.of(Double.class)))\n\
    \      return true;\n  }\n  return false;\n};\n```\n\n200\n\n![](img/Image00000.gif)\n\
    \n`paramMatcher` 是 `net.bytebuddy.matcher.ElementMatcher` 的实例。`ElementMatcher`\
    \ 是一个带有名为 `matches` 方法的函数接口。`matches` 方法的参数是 `java.lang.Iterable` 的实例。\n\n在此示例中，该参数的名称为\
    \ `paramDescrList`，它代表了 Java 方法的所有参数。`paramDescrList` 的元素是 `net.bytebuddy.description.method.ParameterDescription`\
    \ 的类型。`ParameterDescription` 包含了关于 Java 方法中每个参数的元数据。\n\n（此处省略重复内容）\n\n### Import\
    \ static for ElementMatchers\n\n`ElementMatchers` 的所有方法都是静态的。为了减少代码，使用了 `import\
    \ static` 来导入 `ElementMatchers` 的静态方法。例如：\n\n```java\nimport static net.bytebuddy.matcher.ElementMatchers.isDeclaredBy;\n\
    import static net.bytebuddy.matcher.ElementMatchers.not;\nimport static net.bytebuddy.matcher.ElementMatchers.isOverriddenFrom;\n\
    ```\n\n有了这些 `import` 声明，这段代码段：\n\n```java\n.on(ElementMatchers.isDeclaredBy(\n\
    \  DataQuery.class).and(\n  ElementMatchers.not(\n    ElementMatchers.isOverriddenFrom(\n\
    \      Object.class)))));\n```\n\n可以改为：\n\n```java\n.on(isDeclaredBy(DataQuery.class).and(\n\
    \  not(isOverriddenFrom(Object.class)))));\n```\n\n202\n\n![](img/Image00000.gif)\n\
    \n### Conclusion\n\n本章解释了如何使用 `ElementMatchers` 开发匹配逻辑，以匹配插件过程中的目标 Java 元素。\n\n\
