    UTF-8\")));\n    } else {\n        var2 = var3;\n    }\n    return var2;\n}\n\
    ```\n\n观察到第二个参数是一个变长参数。为了创建这种类型参数，我们创建了一个数组类型的方法的最后一个参数，然后在 `defineMethod` 方法的第三个参数处使用\
    \ `Opcodes.ACC_VARARGS` 修饰符。\n\n### 生成带有局部变量的方法\n\n下一个示例展示了如何生成方法体并在方法体内声明局部变量。插件程序使用\
    \ `defineMethod` 声明方法，使用 `FixedValue` 创建方法体，然后使用 `visit` 方法修改方法体：\n\n```java\n\
    builder.defineMethod(\n    \"process9\", int.class, Visibility.PUBLIC\n)\n.withParameter(long.class)\n\
    .intercept(FixedValue.value(0));\n\nbuilder=builder\n.visit(Advice.to(PriceProcessorAdvice.class)\n\
    .on(ElementMatchers.named(\"process9\")));\n```\n\n`visit` 方法应用了 `PriceProcessorAdvice.class`：\n\
    \n```java\npublic class PriceProcessorAdvice {\n    @Advice.OnMethodEnter\n  \
    \  public static void start(\n        long id,\n        @Local(\"total\") int\
    \ totalParam\n    ) {\n        int price=new PriceQuery().query(id);\n       \
    \ int discount=new DiscountQuery().query(id);\n        totalParam=price-discount;\n\
    \    }\n    @Advice.OnMethodExit\n    public static void end(\n        @Local(\"\
    total\") int totalParam,\n        @Return(readOnly=false) int returnTotal\n  \
    \  ) {\n        returnTotal=totalParam;\n    }\n}\n```\n\n建议代码同时声明了 `on method\
    \ enter` 和 `exit` 建议。建议代码使用了一个名为 `@Local` 的新注解。`@Local` 注解包含 `net.bytebuddy.asm.Advice`\
    \ 包中。`@Local` 注解用于在方法体内声明局部变量。在建议代码中，该变量是一个参数。插桩处理后，该参数将变为插桩代码方法体中的局部变量。\n\n`@Local`\
