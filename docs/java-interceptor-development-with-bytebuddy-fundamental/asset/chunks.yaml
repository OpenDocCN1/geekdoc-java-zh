    .withoutCode()

    ```


    这一步是可选的。Java 接口可以不定义任何方法。


    226

    ![](img/Image00000.gif)


    然而，插件程序为 `EntityIntf` 声明了一个名为 `verify` 的方法。


    ### (5) 完成配置并生成 Java 接口的 Java 类


    `.make()`


    `make` 方法完成配置，然后以 Java 类格式创建 Java 接口。`ByteBuddy` 创建一个 `net.bytebuddy.dynamic.Dynamic.Unloaded`
    实例并将 Java 类存储在该实例中。在此阶段，Java 类尚未被加载到 JVM 中。


    ### (6) 将生成的 Java 类保存到磁盘


    `.saveIn(dir);`


    maven 构建过程不会保存新生成的 Java 类。因此，插件程序必须显式地调用 `saveIn` 方法将接口的类文件持久化到磁盘。


    因此，上述代码应该生成此 Java 接口：


    ```java

    public interface EntityIntf

    extends Serializable{

    public void verify(){ }

    }

    ```


