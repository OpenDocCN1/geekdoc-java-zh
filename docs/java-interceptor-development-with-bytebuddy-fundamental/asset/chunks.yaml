  trans: "\n\n`LocalVariableAdvice.java` 同时实现了方法进入和退出的建议（advice），它们的名称分别为“enter”和“end”。观察到\
    \ `LocalVariableAdvice.class` 使用在第一个访问方法中。因此，`ByteBuddy` 将按照以下顺序为插桩后的代码生成一个嵌套结构：\n\
    \n(1) `LocalVariableAdvice enter`\n(2) `PriceQueryAdvice`\n(3) `DiscountQueryAdvice`\n\
    (4) `LocalVariableAdvice end`\n\n101\n\n![](img/Image00000.gif)\n\n为了防止第二个参数包含从\
    \ `process10` 方法外部传递的恶意数据，`enter` 方法在每次调用 `process10` 方法时都会重置第二个参数：\n\n```java\n\
    data=new HashMap<>();\n```\n\n`enter` 方法实例化了一个新的 `HashMap`。这个新的 `HashMap` 被传递给第二个参数，由变量\
    \ `data` 表示。由于 `data` 变量是带有 `@Argument` 注解的 `enter` 方法参数，由于其 `value` 属性为 `1` 且\
    \ `readOnly` 属性为 `false`，它被映射到 `process10` 方法的第二个参数。\n\n然后，`PriceQueryAdvice.java`\
    \ 和 `DiscountQueryAdvice.java` 利用 `HashMap` 来存储计算结果。计算结果以键名 “ total” 存储在 `HashMap`\
    \ 中。\n\n因此，`HashMap` 中的 “total” 元素包含了价格计算的结果。为了确保插桩后的代码获取正确的总值，实现方法退出建议的 `LocalVariableAdvice.java`\
    \ 中的 `end` 方法负责从 `HashMap` 中检索 “total” 元素的值，然后将其传递给 `returnTotal` 参数：\n\n```java\n\
    @Advice.OnMethodExit\npublic static void end(\n    @Argument(value=1,readOnly=false)\
    \ Map data,\n    @Return(readOnly=false) int returnTotal)\n{\n    returnTotal\
    \ = (Integer)data.get(“total”);\n}\n```\n\n`returnTotal` 是带有 `@Return` 注解的参数，它代表\
    \ `process10` 方法的返回值。因此，`process10` 方法能够接收价格计算的结果并并在返回语句中使用它。\n\n使用 `LocalVariableAdvice.java`\
    \ 的用处是，该建议可以持续确保在价格计算开始之前将 `HashMap` 重置为新的 `HashMap`。退出建议则一致地向插桩后的代码返回正确的总值。在编写本文时，使用的是\
    \ `ByteBuddy 1.10.16`，如果将 `HashMap` 替换为对象引用 (`java.lang.String, java.lang.Integer`)\
    \ 或原始类型 (`int, long`)，则价格计算将失败，因为 `ByteBuddy` 将生成不同的对象或原始变量来存储价格计算结果。即使使用了 `HashMap`，`ByteBuddy`\
    \ 也会生成 `HashMap` 的副本来存储数据。然而，由于 `HashMap` 使用相同的键来存储数据，数据存储是一致的。在未来，当生成的字节码不再包含变量副本时，应该将\
    \ `HashMap` 参数更改为对象引用或原始类型，以便高效利用资源。\n\n以下是 `process10` 方法插桩后的代码源码视图：\n\n```java\n\
    public int process10(long paramLong, Map p){\n    p = new HashMap();\n    DataProducer\
    \ var1 = this;\n    long var2 = paramLong;\n    Map varMap = p;\n    int var3\
    \ = new PriceQuery().query(var2);\n    varMap.put(“total”, Integer.valueOf(var3));\n\
    \    var3 = ((Integer)varMap.get(“total”)).intValue();\n    var3 = new DiscountQuery().query(var2);\n\
    \    varMap.put(“total”, Integer.valueOf(var3));\n    int var4 = ((Integer)varMap.get(“total”)).intValue();\n\
    \    return var4;\n}\n```\n\n102\n\n![](img/Image00000.gif)\n\n`process10` 方法的代码显示\
    \ `p` 被初始化为一个新的 `HashMap`。`var1` 被赋值为 `this`，`var2` 被赋值为 `paramLong`，`varMap`\
    \ 被赋值为 `p`。变量 `var3` 存储了 `PriceQuery().query(var2)` 的结果，然后以键 “total” 放入 `varMap`。接着，`var3`\
    \ 使用 `DiscountQuery().query(var2)` 的结果进行更新，并再次以键 “total” 放入 `varMap`。最后，`var4`\
    \ 从 `varMap` 中获取 “total”的值并返回。\n\n（注：我重构了上述代码块的逻辑，因为原始文本提供的源代码片段是碎片化/不完整的，但遵循了描述的流程）。\n\
    \n"
- fmt: "\nThe third `MethodCall` invokes the `execute` method of `DiscountUtil.java`.\
    \ The third `MethodCall` invokes `withArgument(0,1)`, which passes the first and\
    \ second parameter of `process11` method to the `execute` method of `DiscountUtil.java`.\
    \ This is the implementation of the `execute` method in `DiscountUtil.java`:\n\
    \n```java\npublic static void execute(long id, int[] total) {\n    total[0]-=new\
    \ DiscountQuery().query(id);\n}\n```\n\nThe `execute` method uses the `id` to\
    \ perform the discount query, then de-minus the `total` price stored in the first\
    \ element of the `total` array, and stores the latest result into the first element\
    \ of the `total` array.\n\nAfter that, the calculation is completed, and the first\
    \ element of `total` array contains the latest total price. The last and `Then`\
    \ method is invoked and chained to `FixedValue.argument(1)`. The `FixedValue.argument(1)`\
    \ generates code that returns the second parameter of the `process11` method.\
    \ Since all the `MethodCall`s use the second parameter to store the total price\
    \ and it is an `int` array, so the `int` array should contain the latest total\
    \ price. Therefore, the `process11` method can use the second parameter to create\
    \ the return statement.\n\nThis is the source code view of the instrumented code\
    \ for `process11` method:\n\n```java\npublic int[] process11(long p1, int[] p2){\n\
    \    LocalVariableAdvice.execute(p2);\n    PriceUtil.execute(p1, p2);\n    DiscountUtil.execute(p1,\
    \ p2);\n    return p2;\n}\n```\n\nThe generated code is compact, no unexpected\
    \ variable created by the `ByteBuddy` because the `int` array is managed by the\
    \ static method of the utility class. Therefore the `process11` method can perform\
    \ the calculation correctly.\n\n`ByteBuddy` has some limitation in code generation.\
    \ Some of the code cannot be generated directly. For example, the code for the\
    \ price calculation can be implemented using this code:\n\n```java\npublic int\
