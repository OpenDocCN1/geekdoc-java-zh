    ![](img/Image00000.gif)\n\n### RepositoryPlugin\n\n本章使用了两个插件程序。本节介绍了本章的第二个插件：`RepositoryPlugin.java`。`RepositoryPlugin.java`\
    \ 用于对 `com.millionstrengthknowledge.interceptorprj.repository` 包下的内部类和匿名类进行插桩。这是在\
    \ `RepositoryPlugin.java` 的 `matches` 方法中实现的匹配逻辑：\n\n```\nif(target.getName().startsWith(\"\
    com.millionstrengthknowledge.interceptorprj.repository\") && (target.isInnerClass()||target.isAnonymousType()))\n\
    \    return true;\nelse\n    return false;\n```\n\n`if` 语句检查 `target` 变量的包名，使用\
    \ `isInnerClass` 方法检查目标是否为内部类，使用 `isAnonymousType` 方法检查目标是否为匿名类。因此，当目标是 `com.millionstrengthknowledge.interceptorprj.repository`\
    \ 包中创建内部类或匿名类时，`if` 语句返回 `true`。在本章中，`com.millionstrengthknowledge.interceptorprj.repository`\
    \ 包中有两个外部类：`DataReader.java` 和 `DataProducer.java`。\n\n`DataReader.java` 在插桩之前没有内部类和匿名类。经过\
    \ `DataReaderPlugin.java` 的插桩处理后，`DataReader.java` 包含了两个内部类：`Storage.java` 和 `Util.java`。\n\
    \n`DataProducer.java` 在插桩之前有三个内部类：`User.java`、`UserEntityUtil.java` 和 `Address.java`，两个匿名类：`DataProducer$User$1.java`、`DataProducer$User$UserEntityUtil$1.java`。因此，`DataProducer.java`\
    \ 将继续执行 `RepositoryPlugin.java` 的插桩过程。\n\n220\n\n![](img/Image00000.gif)\n\n###\
    \ 在内部类和匿名类生成新方法\n\n在 `apply` 方法中，这是插桩过程的实现：\n\n```\nbuilder.defineMethod(\"innerTest\"\
    , String.class, Visibility.PUBLIC)\n.intercept(FixedValue.value(td.getName()))\n\
    ```\n\n在 `RepositoryPlugin.java` 的 `apply` 方法中，插桩为内部类和匿名类添加了一个名为“innerTest”的新方法。处理处理后，这是\
    \ `DataProducer$User.class` 中 `innerTest` 方法的源码视图：\n\n```\npublic class DataProducer$User{\n\
    \    public String innerTest() {\n        return \"com.millionstrengthknowledge.interceptorprj.repository.DataProducer$User\"\
    ;\n    }\n    // 其他代码省略\n}\n```\n\n这是 `DataProducer$User$1.class` 中 `innerTest`\
    \ 方法的源码视图：\n\n```java\nclass DataProducer$User$1 implements Runnable{\n    public\
    \ String innerTest() {\n        return \"com.millionstrengthknowledge.interceptorprj.repository.DataProducer$User$1\"\
    ;\n    }\n    // 其他代码省略\n}\n```\n\n`innerTest` 方法也被添加到了 `UserEntityUtil.java`、`Address.java`\
    \ 以及另一个匿名类：`DataProducer$User$UserEntityUtil$1.java` 中。\n\n221\n\n![](img/Image00000.gif)\n\
    \n### 拦截内部类和匿名类的方法\n\n之后，插件程序使用 `visit` 方法拦截 `InnerClassAdvice.class` 建议代码应用到所有内部类和匿名类的方法中，但\
    \ `innerTest` 方法除外：\n\n```\nbuilder.visit(\n    Advice.to(InnerClassAdvice.class)\n\
    \    .on(\n        ElementMatchers.isMethod().and(\n            ElementMatchers.not(\n\
    \                ElementMatchers.named(\"innerTest\")\n            )\n       \
    \ )\n    )\n);\n```\n\n这是 `InnerClassAdvice.class` 的源码：\n\n```java\npublic class\
    \ InnerClassAdvice {\n    @OnMethodEnter\n    public static void start(\n    \
    \    @Advice.Origin(\"#t\") String mtdDeclrType,\n        @Advice.Origin(\"#m\"\
    ) String mtdName\n    ) {\n        System.out.println(\"OnMethodEnter Advice:\
    \ \"++mtdDeclrType+\" \"++mtdName);\n    }\n}\n```\n\n`InnerClassAdvice.java`\
    \ 实现了一个 `on method enter` 建议。该建议代码打印 Java 类名和功能性代码的方法名。\n\n222\n\n![](img/Image00000.gif)\n\
    \n插桩处理后，这是 `DataProducer$User` 中 `getName` 方法的源码视图（基于建议代码生成）：\n\n```java\npublic\
    \ String getName() {\n    System.out.println(\"OnMethodEnter Advice: \"com.millionstrengthknowledge.interceptorprj.repository.DataProducer$User\"\
    \ + \"getName\");\n    var var1 = new 1(this);\n    var1.run();\n    return this.name;\n\
    }\n```\n\n这是 `DataProducer$User$1` 中 `run` 方法的源码视图（基于建议代码生成）：\n\n```java\npublic\
    \ void run() {\n    System.out.println(\"OnMethodEnter Advice: \"com.millionstrengthknowledge.interceptorprj.repository.DataProducer$User$1\"\
    \ + \"run\");\n    System.out.println(\"getName anonymous class\");\n}\n```\n\n\
    `RepositoryPlugin` 没有拦截 `DataReader.class` 的内部类。观察到插桩过程没有为 `Storage.java` 和 `Util.java`\
