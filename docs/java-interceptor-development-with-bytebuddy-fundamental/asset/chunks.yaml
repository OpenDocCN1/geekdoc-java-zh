    new MemberAttributeExtension.ForMethod()


    .annotateMethod(


    ElementMatcherUtil.create(


    “isFinal-method”))


    .on(ElementMatchers.isFinal()))


    .visit(


    new MemberAttributeExtension.ForField()


    .annotate(


    ElementMatcherUtil.create(“isFinal-field”))


    .on(ElementMatchers.isFinal()));


