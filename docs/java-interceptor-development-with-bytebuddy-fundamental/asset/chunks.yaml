    to a string value of “ <noData> ”. The setsValue method is the right method to
    use compared to value method introduced in Chapter 10: Declare Instance Variable
    Dynamically . When programming for Java bytecode, the program must use constructor
    to set the initial value of the instance variable.


    Why DataProducer.java contains the default constructor even though the plugin
    program does not declare it? ByteBuddy will create the default constructor implicitly
    when one of these methods is invoked: define, defineConstructor . The define method
    can be used to declare instance variable and Java method also. If define method
    is used to declare constructor, then ByteBuddy will create the default constructor
    automatically. Therefore, the default constructor is already created when the
    DataProducer(int,String,String) constructor is created.


    Generate constructor with visit method


    Finally, the plugin program declares this constructor:


    public DataProducer(


    int p1, String p2, String p3, String p4){


    super(p1, p3);


    if(p1 % 2==0)


    dataProducerId=p1+10000;


    else


    dataProducerId=p2+20000;


    data=p2;


    int01=new BigInteger(data);


    }


    This is the code that generates the constructor:


    builder=builder


    .defineConstructor(Visibility.PUBLIC)


    .withParameters(int.class, String.class,


    String.class, String.class)


    121


    ![](Image00000.gif)


    .intercept(


    MethodCall.invoke(


    Producer.class


    .getDeclaredConstructor(long.class,


    String.class))


    .withArgument(0, 2));


    builder


    .visit(Advice.to(ValueSetter.class)


    .on(


    ElementMatchers.isConstructor()


    .and(ElementMatchers.takesArgument(


    0,int.class))


    .and(ElementMatchers.takesArgument(


    1,String.class))


    .and(ElementMatchers.takesArgument(


    2,String.class))


    .and(ElementMatchers.takesArgument(


    3,String.class))));


    The intercept method only generates the bytecode that invokes the super constructor:


    super(p1, p3);


    The remaining code is generated by the visit method. In visit method, to match
    the constructor, ElementMatchers.isConstructor and ElementMatchers.takesArgument(0,
    int.class) method are used.


    The isConstructor method limits the matching scope to only constructor only.


    The takesArgument method accepts two parameters: int, and java. lang.Class. The
    int parameter specifies the index of the parameter. The second parameter specifies
    its data type. This method matches only one parameter. So, to match the constructor
    that has four parameters, takesArgument is executed for four times. With this
    configuration, the constructor public DataProducer(int, String, String, String)
    should be selected to apply the advice code.


    122


    ![](Image00000.gif)


    ValueSetter.java:


    public class ValueSetter {


