  trans: "\n\n## 简介\n\n`annotateType` 方法是用于向 Java 类添加注解的方法。该方法的参数接收一个 `net.bytebuddy.description.annotation.AnnotationDescription`\
    \ 实例。若要向 Java 类添加注解，需将目标 Java 注解的 `AnnotationDescription` 实例传递给此参数。由于程序想要添加 `@MyAnnotation`，因此在调用方法时传递了\
    \ `myAnnotation` 变量。以下是声明 `myAnnotation` 变量的代码：\n\n```\nAnnotationDescription\
    \ myAnnotation =\nAnnotationDescription.Builder\n.ofType(MyAnnotation.class).build();\n\
    ```\n\n147\n\n![](img/Image00000.gif)\n\n`net.bytebuddy.description.annotation.AnnotationDescription`\
    \ 是 ByteBuddy 中注解编程中使用的基础 Java 类。`AnnotationDescription` 用于创建表示 Java 注解的变量。在本例中，这个\
    \ Java 注解是 `@MyAnnotation`。因此，在声明时，将 `MyAnnotation.class` 传递给 `AnnotationDescription.Builder.ofType`\
    \ 方法，并调用 `build` 方法。之后，创建了 `myAnnotation` 变量，并可以在 `annotateType` 方法中使用。`annotateType`\
    \ 方法在类级别为 `DataProducer.class` 添加了 `@MyAnnotation`。\n\n## 从 Java 类中移除注解\n\n接着，插件程序移除了\
    \ `DataProducer.class` 中的 `@Deprecated` 注解。要移除类级别的注解，需要开发一个继承自 `net.bytebuddy.asm.AsmVisitorWrapper.AbstractBase`\
    \ 的派生类。在本例中，该派生类是 `ClassAnnotationRemoval.java`，用于移除 `@Deprecated` 注解：\n\n派生类需要实现父类的\
    \ `wrap` 方法。`wrap` 方法有八个参数。\n\n![](img/Image00046.jpg)\n\n148\n\n```\npublic ClassVisitor\
    \ wrap(\n    TypeDescription instrumentedType,\n    ClassVisitor classVisitor,\n\
    \    Implementation.Context context,\n    TypePool typePool,\n    FieldList<FieldDescription.InDefinedShape>\
    \ fs,\n    MethodList<?> methods,\n    int writerFlags,\n    int readerFlags\n\
    )\n```\n\n![](img/Image00000.gif)\n\n实现将使用这八个参数中的唯一一个：`ClassVisitor`，即 `wrap`\
    \ 方法的第二个参数。ByteBuddy 会在构建期间为该参数提供 `ClassVisitor` 实例，该实例包含了插件程序生成字节码所需的服务。然而，该实例本身无法移除注解。因此，`ClassAnnotationRemoval.java`\
    \ 使用该实例实例化另一个 `ClassVisitor` 实例，并实现 `visitAnnotation` 方法以便能够移除注解。以下是 `wrap` 方法的实现：\n\
    \n```java\nreturn new ClassVisitor(Opcodes.ASM7, classVisitor) {\n    public AnnotationVisitor\
    \ visitAnnotation(java.lang.String desc, boolean visible) {\n        if (Type.getDescriptor(targetAnnotationClass).equals(desc))\
    \ {\n            return null;\n        }\n        return super.visitAnnotation(desc,\
    \ visible);\n    }\n};\n```\n\n该实现实例化了 `ClassVisitor` 的新实例，这是一个匿名类。构造函数接收两个参数：\n\
    \n149\n\n![](img/Image00000.gif)\n\n`Opcodes.ASM7` 和 `classVisitor`（来自 `wrap`\
    \ 方法的第二个参数）。`Opcodes.ASM7` 配置 `ClassVisitor` 根据 Java 11 生成 Java 字节码。由于实现想要增强 `classVisitor`\
    \ 以便用于移除注解，因此将 `classVisitor` 传递给 `ClassVisitor` 构造函数的第二个参数。\n\n匿名类实现了 `visitAnnotation`\
    \ 方法。`visitAnnotation` 方法用于访问和处理 Java 类的注解。`visitAnnotation` 方法会在插桩处理过程中隐式地调用。当该方法被调用时，它会逐个访问\
    \ Java 类的注解。如果 Java 类有一个注解，则该方法会被调用一次；如果 Java 类有两个注解，则该方法会被调用两次，依此类类推。`visitAnnotation`\
    \ 方法的第一个参数 `desc` 是 `java.lang.String` 实例，包含了注解描述符的值。例如，`\"Ljava/lang/Deprecated\"\
    ` 是 `@Deprecated` 注解的注解描述符。因此，使用 `desc` 参数来匹配要移除的目标注解：\n\n```java\nif(Type.getDescriptor(targetAnnotationClass).equals(desc))\
    \ {\n    return null;\n}\n```\n\n`targetAnnotationClass` 实例变量包含一个表示 `@Deprecated`\
    \ 的 `java.lang.Class` 实例。`Type.getDescriptor` 方法将 `targetAnnotationClass` 实例变量从\
    \ `java.lang.Class` 转换为注解描述符，以便与 `desc` 变量进行比较。因此，当注解匹配时，返回 `null` 值。`null` 值会导致插桩过程标记\
    \ `@Deprecated` 注解。要结束 `visitAnnotation` 方法，调用父类的 `visitAnnotation` 方法：\n\n```java\n\
    return super.visitAnnotation(desc, visible);\n```\n\n150\n\n![](img/Image00000.gif)\n\
    \n`targetAnnotationClass` 是 `ClassAnnotationRemoval.java` 中声明的实例变量。它在构造函数中实例化：\n\
    \n```java\nprivate Class targetAnnotationClass;\npublic ClassAnnotationRemoval(Class\
    \ c) {\n    targetAnnotationClass = c;\n}\n```\n\n插件程序在 `visit` 方法的参数中实例化 `ClassAnnotationRemoval`\
    \ 实例。插件程序将 `Deprecated` 的 `java.lang.Class` 实例传递给 `ClassAnnotationRemoval` 构造函数的第一个参数：\n\
    \n```java\nbuilder.annotateType(myAnnotation)\n.visit(new ClassAnnotationRemoval(Deprecated.class));\n\
    ```\n\n因此，上述代码应为 `DataProducer.class` 添加 `@MyAnnotation`，并从 `DataProducer.class`\
    \ 中移除 `@Deprecated`。\n\n## 为方法添加注解\n\n接下来，插件程序为 `DataProducer.class` 的 `create`\
    \ 方法添加 `@Deprecated` 注解。以下是添加 `@Deprecated` 注解的代码：\n\n```java\nbuilder.visit(\n\
    \    new MemberAttributeExtension.ForMethod()\n    .annotateMethod(defDeprecated)\n\
    \    .on(ElementMatchers.named(\"create\"))\n);\n```\n\n该代码使用 `visit` 方法执行插桩。插桩需要\
    \ `net.bytebuddy.asm`。\n\n151\n\n![](img/Image00000.gif)\n\n`MemberAttributeExtension.ForMethod`。插件程序将使用\
    \ `ForMethod` 的这两个方法进行注解编程：\n\n- `annotateMethod`: 方法级别添加注解\n- `annotateParameter`:\
    \ 方法参数级别添加注解\n\n`annotateMethod` 方法用于添加 `@Deprecated` 注解。`annotateMethod` 方法使用\
    \ `defDeprecated` 变量作为参数。以下是声明 `defDeprecated` 变量的代码：\n\n```\nAnnotationDescription\
    \ defDeprecated =\nAnnotationDescription.Builder.ofType(Deprecated.class).build();\n\
    ```\n\n`defDeprecated` 是表示 `@Deprecated` 注解的 `AnnotationDescription` 实例。`AnnotationDescription.Builder`\
    \ 的 `ofType` 方法使用 `Deprecated` 的 `java.lang.Class` 实例化构建器。然后，`build` 方法完成实例化并将实例存储到\
    \ `defDeprecated` 变量中。\n\n```java\nbuilder.visit(\n    new MemberAttributeExtension.ForMethod()\n\
    \    .annotateMethod(defDeprecated)\n    .on(ElementMatchers.named(\"create\"\
    ))\n);\n```\n\n插件程序刚刚完成了上述 `visit` 方法的 `annotateMethod`。插件程序需要指定目标功能方法。调用 `on`\
    \ 方法来匹配要添加注解的目标方法。在本例中，目标方法是 `create` 方法。因此，执行此代码后，插桩过程应为 `create` 方法添加 `@Deprecated`\
    \ 注解：\n\n```java\n@Deprecated(since=\"\", forRemoval=false)\npublic void create()\
    \ { }\n```\n\n152\n\n![](img/Image00000.gif)\n\n"
- fmt: "\nObserved that the attribute of `@Deprecated` : `since`, `forRemoval`, are\
    \ included in the annotation, and they are provided with the default value. Even\
    \ though the advice code does not include the attribute, the instrumentation process\
    \ will add the attribute implicitly because this is the default behavior of the\
    \ `ByteBuddy`.\n\n## Add nested annotation to Java method\n\nNext, the plugin\
    \ program adds the annotation container to the `createRecord` method. Annotation\
    \ container is the annotation that contains nested annotation. For example,\n\n\
    ```java\n@RecordAnnotation({\n@ColumnAnnotation(name=”username”,\nvalue=”user01\"\
    ),\n@ColumnAnnotation(name=”age”, value=”25”)})\npublic void createRecord() {}\n\
    ```\n\n`@RecordAnnotation` is the annotation container because it contains `@ColumnAnnotation`.\
    \ Before the plugin program can add the `@RecordAnnotation` to the `createRecord`\
    \ method, the plugin program must declare the instance of `AnnotationDescription`\
    \ that represents `@RecordAnnotation`, and its nested annotation `@ColumnAnnotation`.\
    \ This is the code for `ColumnAnnotation.java`:\n\n```java\n@Repeatable(RecordAnnotation.class)\n\
    @Retention(RetentionPolicy.RUNTIME)\n@Target({\nElementType.METHOD, ElementType.FIELD})\n\
    public @interface ColumnAnnotation {\n    String name();\n    String value();\n\
    }\n```\n153\n![](Image00000.gif)\n\nThis is the code that declares the instance\
    \ of `AnnotationDescription` for `@ColumnAnnotation` with `username` attribute:\n\
    \n```java\nAnnotationDescription c1 =\nAnnotationDescription.Builder.ofType(\n\
    ColumnAnnotation.class)\n.define(“name”, “username”)\n.define(“value”, “user01”).build();\n\
    ```\n\nWhen the program wants to define attribute value for the annotation, the\
    \ `define` method is used. Here, the `define` method defines `name` attribute\
    \ to have value of `username`, and `value` attribute to have value of `user01`.\
    \ After that, invokes `build` method to create the instance of `AnnotationDescription`,\
    \ and stores it into `c1` variable. Similarly, this is the code that declares\
    \ the `@ColumnAnnotation` with `age` value in `name` attribute, and the `c2` is\
    \ the variable that stores the instance of the `AnnotationDescription`:\n\n```java\n\
    AnnotationDescription c2 =\nAnnotationDescription.Builder.ofType(\nColumnAnnotation.class)\n\
    .define(“name”, “age”)\n.define(“value”, “25”).build();\n```\n\nAfter the instance\
    \ of `AnnotationDescription` of nested annotation is created, creates the instance\
    \ of `AnnotationDescription` for `@RecordAnnotation`:\n\n```java\nAnnotationDescription\
    \ nestedAnnotation =\nAnnotationDescription.Builder.ofType(\nRecordAnnotation.class)\n\
    .defineAnnotationArray(\n“value”,\nnew TypeDescription.ForLoadedType(\nColumnAnnotation.class),\
    \ c1, c2\n).build();\n```\n\nThis is the code for `RecordAnnotation.java`:\n\n\
    154\n![](Image00000.gif)\n\n```java\n@Retention(RetentionPolicy.RUNTIME)\n@Target({\n\
    ElementType.METHOD, ElementType.FIELD\n})\npublic @interface RecordAnnotation\
    \ {\n    ColumnAnnotation[] value();\n}\n```\n\n`RecordAnnotation.java` has one\
    \ `value` attribute with data type of `ColumnAnnotation` array. To add multiple\
    \ `@ColumnAnnotation` to the `@RecordAnnotation`, the `defineAnnotationArray`\
    \ method is used.\n\nThe `defineAnnotationArray` method requires three parameters:\
    \ `String`, `TypeDescription`, `AnnotationDescription`. The first parameter is\
    \ used to specified the attribute name of `@RecordAnnotation` that contains the\
    \ array of nested annotation. The `@RecordAnnotation` uses `“ value` attribute\
    \ to contain the nested annotation (please refer to `RecordAnnotation.java`),\
    \ so the value of first parameter is `“ value`.\n\nThe second parameter is used\
    \ to specify that the data type of the `value` attribute of `RecordAnnotation.java`.\
    \ The data type is `ColumnAnnotation.java`. So the program instantiates an instance\
    \ of `TypeDescription` via `TypeDescription.ForLoadedType(ColumnAnnotation.class)`\
    \ in second parameter.\n\nThe third parameter is a variable length argument, and\
    \ it is used to specify the content of `value` attribute for `RecordAnnotation.java`.\
    \ So pass the `c1` and `c2` variable to this parameter. After that, invokes `build`\
    \ method to end the method chain. The `build` method creates the instance of `AnnotationDescription`\
    \ that represents the `RecordAnnotation`, and this instance is stored in the `nestedAnnotation`\
    \ variable.\n\nAfter that, the `nestedAnnotation` variable is now ready to be\
    \ used for adding the `@RecordAnnotation` on `createRecord` method. So the plugin\
    \ program invokes the `visit` method:\n\n```java\nbuilder.visit(new MemberAttributeExtension\n\
    .ForMethod()\n.annotateMethod(nestedAnnotation)\n.on(ElementMatchers.named(“createRecord”)))\n\
    ```\n155\n![](Image00000.gif)\n\nThe instance of `ForMethod` is created, and the\
    \ `nestedAnnotation` variable is passed to its `annotateMethod` method. The `on`\
    \ method is invoked to match the `createRecord` method in `DataProducer.class`.\
    \ Therefore, this code should add the `@RecordAnnotaion` to the `createRecord`\
    \ method:\n\n```java\n@RecordAnnotation({\n@ColumnAnnotation(name=”username”,\n\
    value=”user01\"),\n@ColumnAnnotation(name=”age”, value=”25”)})\npublic void createRecord()\
    \ {}\n```\n\n## Remove annotation from Java method\n\nNext, the plugin program\
    \ removes the `@Deprecated` annotation from the `createData` method. For this\
    \ purpose, the plugin program is required to implement a customized derived class\
    \ of `net.bytebuddy.asm.AsmVisitorWrapper.ForDeclaredMethods.MethodVisitorWrapper`.\
    \ The plugin program will create this derived class in anonymous class format,\
    \ and it is created in `methodDeprecatedRemover` method of the plugin program:\n\
    \n```java\nprivate MethodVisitorWrapper\nmethodDeprecatedRemover() {\n    return\
    \ new MethodVisitorWrapper() {\n        @Override\n        public MethodVisitor\
    \ wrap(\n            TypeDescription type,\n            MethodDescription mtdDesc,\n\
    \            MethodVisitor methodVisitor,\n            Context ctx,\n        \
    \    TypePool pool, int writeFlag, int readFlag\n        ) {\n            return\
    \ new MethodVisitor(\n            Opcodes.ASM7, methodVisitor) {\n           \
    \     @Override\n                public AnnotationVisitor\n                visitAnnotation(String\
    \ desc, boolean\n                visible) {\n                    // 156\n    \
    \                // !(Image00000.gif)\n                    if (Type.getDescriptor(\n\
    \                    Deprecated.class).equals(desc)) {\n                     \
    \   return null;\n                    }\n                    return super.visitAnnotation(desc,\n\
    \                    visible);\n                }\n            };\n        }\n\
    \    };\n}\n```\n\nThe derived class of `MethodVisitorWrapper` requires to implement\
    \ the `wrap` method. In this implementation, the `wrap` method returns an instance\
    \ of `net.bytebuddy.jar.asm.MethodVisitor`. The implementation of `wrap` method\
    \ creates the instance of `MethodVisitor` in anonymous class format, and this\
    \ anonymous class implements the `visitAnnotation` method. Similar to `ClassVisitor`,\
    \ the instrumentation process will invoke the `visitAnnotation` method when the\
    \ process encounters an annotation in the method. The annotation descriptor of\
    \ the currently inspecting annotation is available via the `desc` parameter. So\
    \ the program uses `desc` parameter to match the target annotation that the program\
    \ wants to remove:\n\n```java\nif (Type.getDescriptor(Deprecated.class).equals(desc))\
    \ {\n    return null;\n}\n```\n\nIf the annotation descriptor of `Deprecated.class`\
    \ is found, then return `null`. The `null` value causes the instrumentation process\
    \ to mark the `@Deprecated` in comment block. To end the `visitAnnotation` method,\
    \ invokes the superclass’s `visitAnnotation` method at the end of the method.\n\
    \nNow the implementation of `methodDeprecatedRemover` method is completed. The\
    \ plugin program will use this method in the `visit` method:\n\n```java\n// 157\n\
    // !(Image00000.gif)\nbuilder.visit(\nnew AsmVisitorWrapper.ForDeclaredMethods()\n\
    .method(\nElementMatchers.named(“createData”),\nmethodDeprecatedRemover()\n)\n\
    );\n```\n\nThe program instantiates an instance of `ForDeclaredMethods`. Then,\
    \ invokes the `method` method of `ForDeclaredMethods`. The `method` method requires\
    \ two parameters. The first parameter requires the `ElementMatchers`. In this\
    \ example, the matcher attempts to match the `createData` method, so the `ElementMatchers.named`\
    \ method is used. The second parameter takes an instance of `MethodVisitorWrapper`.\
    \ The `methodDeprecatedRemover` method is invoked in this parameter. After this,\
    \ the instance of `ForDeclaredMethods` has the necessary matcher and `MethodVisitorWrapper`\
    \ instance, the instrumentation process should remove the `@Deprecated` annotation\
    \ from the `createData` method. This is the `createData` method after instrumentation\
    \ process:\n"
