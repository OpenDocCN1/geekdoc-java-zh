    \ (public static inner interface)\n\n`DataProducer.java` is the functional code\
    \ of this chapter:\n\n```java\n@Deprecated\npublic class DataProducer {\n    private\
    \ int recordId=-3;\n    @Deprecated\n    public DataProducer(int p1, int p2, @Other\
