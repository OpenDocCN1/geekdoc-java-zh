  trans: "\n\n当 JVM 启动时，JVM 会调用 agent 的 `premain` 方法，然后 JVM 调用应用程序的 `main` 方法来启动应用。当存在多个\
    \ agent 时，每个 agent 的 `premain` 方法将按顺序被调用，然后执行应用程序的 `main` 方法。\n\n在应用程序运行期间，`classloader`\
    \ 会不断将新的 Java 类加载到 JVM 中。每当 `classloader` 将新类加载到 JVM 时，agent 都会拦截该新类。然后 agent\
    \ 会调用它的每个 `transformer` 对新类进行插桩。插桩过程完成后，带有增强代码（advice code）的新类将被加载到 JVM 中。\n\n\
    章中的 `InterceptorAgent.java` 是 agent 的 Java 类：\n\n```java\npublic class InterceptorAgent\
    \ {\n    public static void premain(String arguments, Instrumentation inst) {\n\
    \        ByteBuddyAgent.install();\n        new AgentBuilder.Default()\n     \
    \       .with(AgentBuilder.RedefinitionStrategy.REDEFINITION)\n            .with(AgentBuilder.Listener.StreamWriting.toSystemOut())\n\
    \            .ignore(ElementMatchers.none())\n            .type(ElementMatchers.named(\"\
    java.lang.String\"))\n            .transform((builder, typeDescription, classLoader,\
    \ module) -> {\n                return builder.visit(\n                    Advice.to(LogInterceptor.class)\n\
    \                    .on(\n                        ElementMatchers.named(\"toUpperCase\"\
    )\n                        .and(ElementMatchers.isMethod())\n                \
    \        .and(ElementMatchers.takesNoArguments())\n                    )\n   \
    \             );\n            }).installOnByteBuddyAgent();\n    }\n}\n```\n\n\
    ### InterceptorAgent\n\n这是 `premain` 方法的方法签名：\n\n```java\npublic static void premain(String\
    \ arguments, Instrumentation inst)\n```\n\n该方法接收两个参数：\n\n- `String` 参数是占位符参数，允许开发者向\
    \ agent 传递各种杂数据。\n- 第二个参数类型为 `java.lang.instrument.Instrumentation`。JVM 在应用程序运行期间提供\
    \ `Instrumentation` 实例。该参数提供了插桩 Java 类文件所需的服务。agent 可以通过此实例的 `addTransformer`\
    \ 方法添加 `transformer`。\n\n方法体的第一行是：\n\n```java\nByteBuddyAgent.install();\n```\n\
    \n`ByteBuddyAgent` 是来自 `net.bytebuddy.agent` 包的 Java 类，该类可以通过 `byte-buddy-agent`\
    \ maven 依赖可用。`install` 方法将 ByteBuddy 内置 agent 安装到 JVM 中。插桩 JVM 中已加载的 Java 类需要该\
    \ agent。\n\n接下来，程序实例化 `AgentBuilder` 实例。`AgentBuilder` 是 `net.bytebuddy.agent.builder`\
    \ 包中的一个公共静态类。`AgentBuilder.Default` 用于创建一个带有默认配置的 `AgentBuilder` 新实例。默认配置使用重基策略（rebase\
    \ strategy），且 agent 不会插桩 JDK 核心类。程序使用 `with` 方法配置 `AgentBuilder`。`RedefinitionStrategy.REDEFINITION`\
    \ 策略：\n\n```java\n.with(AgentBuilder.RedefinitionStrategy.REDEFINITION)\n```\n\
    \n使用重定义策略，agent 可以插桩已经加载但尚未加载到 JVM 的 Java 类。对于已经加载到 JVM 的 Java 类，agent 会在 `premain`\
    \ 方法被调用时对类进行插桩。对于尚未加载到 JVM 的 Java 类，agent 会在 `classloader` 加载该类时对该类进行插桩。\n\n接下来，程序配置\
    \ agent 以启用 agent 进程日志：\n\n```java\n.with(AgentBuilder.Listener.StreamWriting.toSystemOut())\n\
    ```\n\n这一行开启了将 ByteBuddy 插桩过程输出到控制台。\n\n接下来，程序配置新的 transformer 来插桩 JDK 核心类：\n\n\
    ```java\n.ignore(ElementMatchers.none())\n```\n\n如果没有此配置，新的 transformer 将忽略对 JDK\
    \ 核心类的插桩，因为通过 `AgentBuilder.Default` 方法实例化的 `AgentBuilder` 实例默认禁用了它。这意味着 JDK 核心类将被插桩过程跳过。由于\
    \ agent 想要插桩 `java.lang.String`，因此新的 transformer 不应忽略 JDK 核心类。`ignore` 方法用于配置此行为，`ElementMatchers.none`\
    \ 方法通知新的 transformer 不应该忽略任何 JDK 核心类。\n\n接下，程序指定了目标类的匹配逻辑：\n\n```java\n.type(ElementMatchers.named(\"\
    java.lang.String\"))\n```\n\n这与插件程序中的 `matches` 方法类似。`AgentBuilder` 使用 `type`\
    \ 方法来为新的 transformer 配置匹配逻辑。在本例中，`ElementMatchers.named` 方法被用于匹配 `java.lang.String`。\n\
    \n之后，程序调用 `transform` 方法：\n\n```java\n.transform(builder, typeDescription, classLoader,\
    \ module)\n-> {\n    return builder.visit(\n        Advice.to(LogInterceptor.class)\n\
    \        .on(\n            ElementMatchers.named(\"toUpperCase\")\n          \
    \  .and(ElementMatchers.isMethod())\n            .and(ElementMatchers.takesNoArguments())\n\
    \        )\n    );\n})\n```\n\n`AgentBuilder` 的 `transform` 方法用于为新的 transformer\
    \ 添加插桩能力。它与插件程序中的 `apply` 方法类似。`transform` 方法接受一个参数，类型为 `net.bytebuddy.agent.builder.AgentBuilder.Transformer`。\n\
    \n在本例中，程序使用 lambda 表达式实现了 transformer。`AgentBuilder.Transformer` 有一个方法，其方法签名如下：\n\
    \n```java\nDynamicType.Builder<?> transform(DynamicType.Builder<?> builder, TypeDescription\
    \ typeDescription, ClassLoader classLoader, JavaModule module)\n```\n\n`AgentBuilder.Transformer`\
    \ 的 `transform` 方法是 agent 在 `premain` 方法中、Java 类文件加载到 JVM 之前调用的插桩方法。\n\n程序使用第一个参数\
    \ `builder` 来配置增强代码：\n\n```java\nbuilder.visit(\nAdvice.to(LogInterceptor.class)\n\
    .on(\n    ElementMatchers.named(\"toUpperCase\")\n    .and(ElementMatchers.isMethod())\n\
    \    .and(ElementMatchers.takesNoArguments())\n));\n```\n\n`builder` 使用 `visit`\
    \ 方法来配置 `Advice`。当应用程序调用 `java.lang.String` 的 `toUpperCase` 方法时，transformer 将应用\
    \ `LogInterceptor.class` 的增强代码。\n\n最后，程序链式调用 `installOnByteBuddyAgent` 方法。该方法将\
    \ transformer 安装到 `ByteBuddyAgent` 中。\n\n```java\n.installOnByteBuddyAgent();\n\
    ```\n\n### MANIFEST.MF 中的 Premain-Class \n\n为了激活 agent，应用程序必须创建一个包含 agent Java\
    \  jar 文件以及 `MANIFEST.MF`。清单文件必须包含 `Premain-Class` 属性。该属性的值是 agent 的全限定类名。因此，应用程序在\
    \ `JdkInstrumentation` Eclipse 项目的资源文件夹中创建 `MANIFEST.MF` 文件，其内容如下：\n\n```\nPremain-Class:\
    \ com.millionstrengthknowledge.interceptorprj.interceptor.InterceptorAgent\n```\n\
    \n### Maven pom.xml\n\n当程序使用 Java Instrumentation API 时，插件程序不再适用。程序将使用 maven 创建\
    \ agent jar 文件。与其使用 `byte-buddy-maven-plugin`，`pom.xml` 配置了 `maven-jar-plugin`：\n\
    \n```xml\n<plugin>\n    <groupId>org.apache.maven.plugins</groupId>\n    <artifactId>maven-jar-plugin</artifactId>\n\
    \    <version>3.2.0</version>\n    <executions>\n        <execution>\n       \
    \     <id>agent</id>\n            <goals>\n                <goal>jar</goal>\n\
    \            </goals>\n            <configuration>\n                <classifier>agent</classifier>\n\
    \                <includes>\n                    <include>**/interceptor/**</include>\n\
    \                </includes>\n                <archive>\n                    <manifestFile>src/main/resources/META-INF/MANIFEST.MF</manifestFile>\n\
    \                </archive>\n            </configuration>\n        </execution>\n\
    \    </executions>\n</plugin>\n```\n\n"
- fmt: "\nBy default, `maven-jar-plugin` will create a jar file that includes all\
    \ the Java class files in the Eclipse project. The application needs to package\
    \ another jar file just for agent related Java class file only. Therefore, in\
    \ this chapter, the `pom.xml` creates a new `<execution>` tag for the agent jar\
    \ file. The configuration has the `<id>` tag of value of `agent`. Because the\
    \ jar file is created for agent only, so the jar will only package the Java class\
    \ file from `com.millionstrengthknowledge.interceptorprj.interceptor` package,\
    \ which is specified via the `<include>` tag. Besides that, the plugin needs to\
    \ specify the file location of `MANIFEST.MF` so that the build process will package\
    \ the manifest file that contains the `Premain-Class` attribute. The `pom.xml`\
    \ uses `<manifestFile>` tag for this purpose.\n\n## Execute the program in Eclipse\n\
    \nTo view the result of the instrumentation process, first executes the maven\
    \ build process:\n\n1. Right click on `pom.xml` in the project/package explorer\
    \ in Eclipse.\n2. Select `Run As -> Maven build`\n3. Eclipse should show the “\
    \ Edit configuration `, enters `clean package -X` in the Goals textbox:\n4. Click\
    \ the `Run` button. After this, the maven build process will start.\n\nAfter the\
    \ maven build process completes, executes `InterceptorProgram.java`:\n\n1. Right\
    \ click on `InterceptorProgram.java` in project/package explorer in Eclipse.\n\
    2. Select `Run as -> Java Application`\n3. Eclipse will show “Run configurations”.\n\
    4. Select the `Arguments` tab, in the `VM arguments` textbox, enters this value:\
    \ `--add-reads java.base=java.logging -javaagent:C:/Users/user001/workspace/Interceptor/ChapterJdkInstrumentation/target/ChapterJdkInstrumentation-1.0-agent.jar`.\
    \ There are two VM arguments:\n\n- `--add-reads java.base=java.logging`: This\
    \ is required because `java.base` and `java.logging` are in different module and\
    \ the `LogInterceptor.java` requires the `java.logging` module, so this parameter\
    \ is configured for this purpose.\n- `-javaagent:C:/Users/user001/workspace/Interceptor/ChapterJdkInstrumentation/target/ChapterJdkInstrumentation-1.0-agent.jar`:\
    \ `-javaagent` parameter specifies the file location of the agent jar. This jar\
    \ file is generated by the maven build process configured in Maven `pom.xml` file\
    \ section of this chapter. Changes the file path so that it points to the right\
    \ agent jar.\n\n5. After that, press the `Run` button to executes the program.\
    \ This is the source code of `InterceptorProgram.java`:\n\n```java\npublic static\
    \ void main(String args[]){\n    String data=new String(“testTEST”);\n    data.toUpperCase();\n\
    }\n```\n\nThe program creates a `data` String variable, and then invokes the `toUpperCase`\
    \ method on that variable. The program output is expected to have the advice code\
    \ prints the log from the `on` method enter and exit advice of `toUpperCase` method.\
    \ The Eclipse console should show this result:\n\nByteBuddyAgent generates the\
    \ trace of the instrumentation process. The trace is enabled by this configuration\
    \ in the `InterceptorAgent.java`:\n\n```java\n.with(AgentBuilder.Listener.StreamWriting.toSystemOut())\n\
    ```\n\nChecks the trace, the trace should include the log created by the advice\
    \ code in the `toUpperCase` method of the `java.lang.String`, which is in red\
    \ color:\n\n```\nJan 01, 2020 1:00:00PM java.lang.String toUpperCase INFO: Method\
    \ Enter: public java.lang.String java.lang.String.toUpperCase()\nJan 01, 2020\
    \ 1:00:00PM java.lang.String toUpperCase INFO: Method Exit: public java.lang.String\
    \ java.lang.String.toUpperCase() return: ‘TESTTEST’\n```\n\nThis means the `InterceptorAgent.java`\
    \ has successfully instrument the `java.lang.String`.\n\nHowever, please be noticed\
    \ that the JVM does not allow agent to add or delete method, constructor and instance\
    \ variable to the JDK core class. Therefore, executing the `defineMethod`, `defineField`\
    \ and `defineConstructor` method on JDK core class has no effect during the instrumentation\
    \ process.\n\n## Conclusion\n\nThis chapter explains on how to add on method enter\
    \ and exit advice to the JDK core class.\n"
