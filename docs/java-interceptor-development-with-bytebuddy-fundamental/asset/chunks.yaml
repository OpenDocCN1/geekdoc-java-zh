    The `makeInterface` method configures the instance of `ByteBuddy` to generate
    a Java interface. In this example, the Java interface wants to extends the `java.io.Serializable`.
    For this purpose, the plugin program passes the Java class of `java.io.Serializable`
    to the parameter of `makeInterface` method. Please be noticed that the parameter
    is optional only. If the Java interface does not require to extend the other Java
    interface, then just leaves the parameter empty.


    ### (3) Configure the name for the Java interface


    `.name(“com.millionstrengthknowledge.interceptorprj.entity.EntityIntf”)`


    The `name` method is used to create the name of the Java interface. This parameter
    must be the fully qualified class name.


    ### (4) Configure the method for the Java interface


    ```

    .defineMethod(“verify”, void.class, Visibility.PUBLIC)

    .withoutCode()

    ```


    This step is optional. The Java interface can have no method defined.


    226

    ![](Image00000.gif)


    However, the plugin program declares one method named `verify` for the `EntityIntf`.


    ### (5) Complete the configuration and generates the Java class of Java interface


    `.make()`


    The `make` method completes the configuration and then creates the Java interface
    in Java class format. `ByteBuddy` creates an instance of `net.bytebuddy.dynamic.Dynamic.Unloaded`
    and stores the Java class into this instance. At this stage, the Java class is
    not loaded into the JVM.


    ### (6) Save the generated Java class into disk


    `.saveIn(dir);`


    The maven build process will not save the newly generated Java class. Therefore,
    the plugin program must explicitly invoke the `saveIn` method to persist the class
    file of interface interface into disk.


    Therefore, the code above should generate this Java interface:


    ```java

    public interface EntityIntf

    extends Serializable{

    public void verify(){ }

    }

    ```


    227

    ![](Image00000.gif)


    ## Generate new Java enum


    Next, the plugin program generates a Java enum named “ DataEnum ”:


    ```

    new ByteBuddy()

    .makeEnumeration(“inst1”, “inst2”)

    .name(“com.millionstrengthknowledge.interceptorprj.entity.DataEnum”)

    .implement(GeneralIntf.class)

    .defineMethod(“execute”, void.class, Visibility.PUBLIC)

    .intercept(StubMethod.INSTANCE)

    .make()

    .saveIn(dir);

    ```


    ### (1) Instantiate an instance of ByteBuddy:


    `new ByteBuddy()`


    ### (2) Create the enum


    `.makeEnumeration(“inst1”, “inst2”)`


    The `makeEnumeration` method configures the instance of `ByteBuddy` to generate
    the Java enum. Its parameter accepts a variable length argument of `java.lang.String`.
    Each of the string value is going to be the name of the instance of enum. This
    enum declares two instances: `inst1`, `inst2`.


    ### (3) Create a name for the enum


    `.name(“com.millionstrengthknowledge.interceptorprj.entity.DataEnum”)`


    ### (4) Optionally implements the Java interface for the enum


    `.implement(GeneralIntf.class)`


    The enum can optionally implement Java interface but not extends.


    228

    ![](Image00000.gif)


    ### (5) Optionally declares the method


    ```

    .defineMethod(“execute”, void.class, Visibility.PUBLIC)

    .intercept(StubMethod.INSTANCE)

    ```


    ### (6) Complete the configuration and generates the Java class of Java enum:


    `.make()`


    ### (7) Save the Java class into disk


    `.saveIn(dir)`


    After that, the code above should completely create the Java enum `DataEnum`:


    ```java

    public enum DataEnum implements GeneralIntf{

    inst1, inst2;

