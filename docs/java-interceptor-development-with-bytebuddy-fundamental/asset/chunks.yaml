  trans: "\n\n`GeneralRepository.class`\n\n当方法重写了父类的方法时，`isOverriddenFrom` 方法返回 true。`UserRepository.java`\
    \ 的父类是 `GeneralRepository.java`，它包含了 `process` 方法。`UserRepository.java` 在其实现中重写了这个方法，因此选择了\
    \ `UserRepository.class` 的 `process` 方法来添加注解：\n\n```java\n@ElementMatched(“Override\
    \ from GeneralRepository.java”)\npublic void process(){ }\n```\n\n### InterceptorQueryPlugin\n\
    \n在此阶段，章节已完成对 `InterceptorRepositoryPlugin.java` 的解释。最后一个程序是 `InterceptorQueryPlugin.java`。这是在\
    \ `InterceptorQueryPlugin.java` 的 `matches` 方法中实现的匹配逻辑：\n\n```java\nif(target.getName().startsWith(\"\
    com.millionstrengthknowledge.interceptorprj.repository\")){\n    int annotationFound=target.getDeclaredAnnotations().filter(\n\
    \        ElementMatchers.anyOf(\n            AnnotationDescription.Builder\n \
    \           .ofType(QueryType.class).build(),\n            AnnotationDescription.Builder\n\
    \            .ofType(GenericQueryType.class)\n            .build()\n        \n\
    \    ).size();\n    int methodFound=target.getDeclaredMethods().filter(\n    \
    \    ElementMatchers.named(“toString”)\n    ).size();\n    if(methodFound>0 &&\
    \ annotationFound>0) {\n        System.out.println(\"InterceptorQueryPlugin found\
    \ target: \"+target.getName());\n        return true;\n    } else {\n        return\
    \ false;\n    }\n} else\n    return false;\n```\n\n该匹配逻辑实现了这三个条件：\n1. 目标 Java\
    \ 类来自 `com.millionstrenthknowledge.interceptorprj.repository` 包。\n2. 目标 Java 类在类级别上必须有\
    \ `@GenericQueryType` 或 `@QueryType` 注解。\n3. 目标 Java 类必须实现 `toString` 方法。\n\n\
    ### FilterableList\n\n第一个条件是通过 `TypeDescription` 的 `getName` 方法实现的。第二个和第三个条件是通过使用\
    \ `net.bytebuddy.matcher.FilterableList` 的 `filter` 方法实现的。过滤器（filter）是本章的新概念，它是用于实现匹配逻辑的技术之一。要获取\
    \ `FilterableList` 的实例，调用 `TypeDescription` 的 `getDeclaredAnnotations` 方法。`getDeclaredAnnotations`\
    \ 返回 `FilterableList` 实例，其中包含了 Java 类在类级别使用的注解列表。`FilterableList` 拥有一个可以应用 `ElementMatchers`\
    \ 的 `filter` 方法。在这个示例中，过滤器使用了 `ElementMatchers.anyOf` 方法：\n\n```java\nint annotationFound=target.getDeclaredAnnotations().filter(\n\
    \    ElementMatchers.anyOf(\n        AnnotationDescription.Builder.ofType(QueryType.class).build(),\n\
    \        AnnotationDescription.Builder.ofType(GenericQueryType.class)\n      \
    \  .build()\n    )\n).size();\n```\n\n在这个示例中，过滤器选择了使用了 `@QueryType` 或 `@GenericQueryType`\
    \ 的 Java 类。当其参数中的任何一个符合匹配标准时，`anyOf` 方法返回 true。\n\n然后，`size` 方法返回过滤后列表中的项目数量。如果列表为空，`size`\
    \ 方法返回零，这意味着列表中没有对象符合匹配标准。否则，列表中将至少有一个对象，且 `size` 方法应该返回一个大于零的整数值。过滤器的的大小存储在 `annotationFound`\
    \ int 变量中。\n\n`matches` 方法随后继续过滤目标类。这一次 `matches` 方法过滤了目标类的方法：\n\n```java\nint\
    \ methodFound=target.getDeclaredMethods()\n    .filter(ElementMatchers.named(“toString”))\n\
    \    .size();\n```\n\n为了过滤方法，首先使用 `TypeDescription` 的 `getDeclaredMethods` 方法获取完整的方法列表。然后调用\
    \ `filter` 方法并应用 `ElementMatchers`。程序想要匹配 `toString` 方法，因此 `named` 方法适用于此情况。之后，调用\
    \ `size` 方法获取完整列表中被过滤后的项目数量，并将该数字存储在 `methodFound` int 变量中。\n\n最后，只有当 `annotationFound`\
    \ 和 `methodFound` 变量的值都大于零时，`matches` 方法才会返回 true。根据匹配标准，只有 `DataQuery.class`\
    \ 和 `UserQuery.class` 被选中进行进一步的插桩处理（instrumentation process）。\n\n`InterceptorQueryPlugin.java`\
    \ 程序继续为 `DataQuery.class` 和 `UserQuery.class` 应用方法。在 `apply` 方法中，应用了另一个过滤器：\n\n\
    ```java\nint queryMethodCount=target.getDeclaredMethods().filter(\n    ElementMatchers.named(“query”)).size();\n\
    ```\n\n`target` 是来自 `apply` 方法第二个参数的变量，它是 `TypeDescription` 的实例。`target` 变量代表与\
    \ `matches` 方法中 `TypeDescription` 参数相同的 Java 类。在 `apply` 方法中，`target` 变量被进一步过滤以匹配名为\
    \ `query` 的 Java 方法。因此，`filter` 方法使用 `ElementMatchers.named` 方法来实现此目的。过滤的结果存储在\
    \ `queryMethodCount` int 变量中。`queryMethodCount` 变量用于条件检查：\n\n```java\nif(queryMethodCount==0)\
    \ {\n    builder=builder.annotateType(\n    ElementMatcherUtil.create(“QueryType\
    \ does not implement query method”));\n}\n```\n\n如果 `queryMethodCount` 等于零，那么意味着\
    \ Java 类没有实现 query 方法，因为过滤器没有找到该方法。如果没有找到，插桩过程会将 `@ElementMatched` 添加到该 Java 类。在这个示例中，该\
    \ Java 类是 `DataQuery.class`。因此，`ElementMatched` 被添加到 `DataQuery.class`：\n\n```java\n\
    @GenericQueryType\n@ElementMatched(“QueryType does not implement method”)\npublic\
    \ class DataQuery<A, B extends Long> {\n```\n\n之后，方法继续处理其他拦截逻辑。有六个 `visit` 方法。第一个\
    \ `visit` 方法尝试匹配 Java 类中的 int 变量：\n\n```java\nbuilder.visit(new MemberAttributeExtension.ForField()\n\
    .annotate(ElementMatcherUtil.create(“int field”))\n.on(ElementMatchers.fieldType(\n\
    ElementMatchers.is(TypeDescription.ForLoadedType.of(int.class)))));\n```\n\n匹配逻辑使用了\
    \ `fieldType` 和 `is` 方法。`is` 方法类似于相等。当匹配标准相等时，`is` 方法返回 true。因为匹配逻辑尝试匹配 int 变量，`is`\
    \ 方法的参数传递了 `TypeDescription.ForLoadedType.of(int.class)`，它返回代表 `int.class` 的 `TypeDescription`\
    \ 实例。`is` 方法的结果传递给 `ElementMatchers.fieldType` 方法，这样匹配逻辑就可以检查变量，如果变量等于 `int.class`\
    \ 则返回 true。因此，程序应该发现 `DataQuery.class` 和 `UserQuery.class` 符合匹配标准。在 `DataQuery.class`\
    \ 中，有一个 int 变量：\n\n```java\n@ElementMatched(“int field”)\nprivate int data1;\n\
    ```\n\n`UserQuery.class` 也有一个 int 变量：\n\n```java\n@ElementMatched(“int field”)\n\
    private int number;\n```\n\n### ElementMatchers.genericFieldType\n\n下一个 `visit`\
    \ 方法匹配类型变量为 `A` 的变量。同样，使用了 `is` 方法。在这个示例中，使用了 `ElementMatchers.genericFieldType`\
    \ 方法而不是 `ElementMatchers.fieldType` 方法，因为该变量是一个泛型字段：\n\n```java\nbuilder.visit(new\
    \ MemberAttributeExtension.ForField()\n.annotate(ElementMatcherUtil.create(“A\
    \ field”))\n.on(ElementMatchers.genericFieldType(\nElementMatchers.is(\nTypeDescription.Generic.Builder\n\
    .typeVariable(“A”).build()))));\n```\n\n因此，`DataQuery.class` 的 `data4` 变量符合匹配标准：\n\
    \n```java\n@ElementMatched(“A field”)\nprivate A data4;\n```\n\n`ElementMatchers.erasure`\n\
    \n"
- fmt: "\nNext, the plugin program matches the generic instance variable that has\
    \ type erasure of `java.lang.Long`. To find the generic instance variable, the\
    \ `ElementMatchers.genericFieldType` method is used. However, the `ElementMatchers.is`\
    \ method is not applicable. Instead, the `ElementMatchers.erasure` method is used:\n\
    \n```java\nbuilder.visit(new MemberAttributeExtension\n  .ForField()\n  .annotate(ElementMatcherUtil.create(\"\
    Long erasure field\"))\n  .on(ElementMatchers.genericFieldType(\n    ElementMatchers.erasure(Long.class))));\n\
    ```\n\n197\n\n![](Image00000.gif)\n\nTherefore, the program should have found\
    \ the instance variable with type erasure of `java.lang.Long` in `DataQuery.class`\
    \ . `DataQuery.class` has one type argument “B”, which is upper bounded to `java.lang.Long`:\n\
    \n```java\npublic class DataQuery<A, B extends Long>\n```\n\nThe `data5` instance\
    \ variable is typed to `B`, so this instance variable matches with the matching\
    \ criteria, and it is selected to add the `@ElementMatched` annotation:\n\n```java\n\
    @ElementMatched(\"Long erasure field\")\nprivate B data5;\n```\n\n### `ElementMatchers.isAnnotatedWith`\n\
    \nThe next visit method matches the instance variable with `@Deprecated` annotation.\
    \ For this purpose, the `ElementMatchers.isAnnotatedWith` method is used:\n\n\
    ```java\nbuilder.visit(new MemberAttributeExtension\n  .ForField()\n  .annotate(ElementMatcherUtil.create(\"\
    Deprecated field\"))\n  .on(ElementMatchers.isAnnotatedWith(\n    Deprecated.class)));\n\
    ```\n\nThe `isAnnotatedWith` method accepts the parameter of `java.lang.Class`,\
    \ in which the class should be the class of Java annotation. The `isAnnotatedWith`\
    \ method returns `true` when the class of annotation of the instance variable\
    \ matches with the class in the parameter. In `DataQuery.class`, the `data6` instance\
    \ variable matches with the matching criteria because it has one `@Deprecated`\
    \ annotation:\n\n```java\n@ElementMatched(\"Deprecated field\")\n@Deprecated\n\
    private String data6;\n```\n\n198\n\n![](Image00000.gif)\n\n### `ElementMatchers.isDeclaredBy`\n\
    \nNext, the plugin program matches the method that is declared by the `DataQuery.java`,\
    \ and the method does not override the method of the `java.lang.Object` super\
    \ class. For this purpose, the `ElementMatchers.isDeclaredBy` and `ElementMatchers.isOverriddenFrom`\
    \ method are used:\n\n```java\nbuilder.visit(new MemberAttributeExtension\n  .ForMethod()\n\
    \  .annotateMethod(ElementMatcherUtil.create(\"Method declared by DataQuery\"\
    ))\n  .on(ElementMatchers.isDeclaredBy(\n    DataQuery.class).and(\n    ElementMatchers.not(\n\
    \      ElementMatchers.isOverriddenFrom(\n        Object.class)))));\n```\n\n\
    The `isDeclaredBy` method returns `true` when the method is owned by the Java\
    \ class specified in the parameter. In order to match the method that does not\
    \ override the `java.lang.Object` super class, the `not` method is used with the\
    \ `isOverriddenFrom` method. Therefore, in `DataQuery.class`, the test method\
    \ matches with the criteria:\n\n```java\n@ElementMatched(\"Method declared by\
    \ DataQuery\")\npublic void test(){ }\n```\n\n199\n\n![](Image00000.gif)\n\n###\
    \ `ElementMatchers.hasParameter` and `ElementMatcher`\n\nNext, the plugin program\
    \ matches the method with `java.lang.Double` parameter, and that parameter is\
    \ annotated with a `@Deprecated` annotation. For this purpose, the `visit` method\
    \ uses `ElementMatchers.hasParameters` method:\n\n```java\nbuilder.visit(new MemberAttributeExtension\n\
    \  .ForMethod()\n  .annotateMethod(ElementMatcherUtil.create(\"Double.class parameter\"\
    ))\n  .on(ElementMatchers.hasParameters(paramMatcher)));\n```\n\nThe `hasParameters`\
    \ return `true` when the method parameter matches with the parameter matcher specified\
    \ in the parameter. Observed that the `hasParameters` is passed with a `paramMatcher`\
    \ variable. This is the declaration of the `paramMatcher` variable:\n\n```java\n\
    ElementMatcher<Iterable<? extends ParameterDescription>> paramMatcher =\n(paramDescrList)->{\n\
    \  for (ParameterDescription param : paramDescrList) {\n    int deprecatedCount\
    \ = param.getDeclaredAnnotations().filter(\n      ElementMatchers.annotationType(Deprecated.class)).size();\n\
    \    if (deprecatedCount > 0 && param.getType().equals(\n        TypeDescription.ForLoadedType.of(Double.class)))\n\
    \      return true;\n  }\n  return false;\n};\n```\n\n200\n\n![](Image00000.gif)\n\
    \nThe `paramMatcher` is an instance of `net.bytebuddy.matcher.ElementMatcher`.\
    \ The `ElementMatcher` is a functional interface with one method named `matches`.\
    \ The parameter of `matches` method is an instance of `java.lang.Iterable`.\n\n\
    In this example, the name of this parameter is `paramDescrList`, and it represents\
    \ all the parameters of the Java method. The element of `paramDescrList` is the\
    \ type of `net.bytebuddy.description.method.ParameterDescription`. The `ParameterDescription`\
    \ contains the meta information about each of the parameter in the Java method.\n\
    \nTo check the data type and annotation used by the parameter, the `for` loop\
    \ is used to iterate the list. Each loop returns an instance of `ParameterDescription`\
    \ and it is stored into `param` variable. In each loop, the program uses the `param`\
    \ variable to access the meta information of each parameter.\n\nIn each loop,\
    \ invokes `paramDescrList.getDeclaredAnnotation` method, which returns the list\
    \ of annotation used by each parameter. Then, chains the method to `filter` method.\
    \ The `filter` uses `ElementMatchers.annotationType` method to match the `@Deprecated`\
    \ annotation on that parameter. The result of `filter` is stored into `deprecatedCount`\
    \ variable. If one `@Deprecated` annotation is found on the parameter, then the\
    \ value of `deprecatedCount` is one.\n\nThen the `deprecatedCount` variable is\
    \ used in next conditional check:\n\n```java\nif (deprecatedCount > 0 && param.getType().equals(\n\
    \    TypeDescription.ForLoadedType.of(Double.class)))\n  return true;\n```\n\n\
    The conditional check verifies that `deprecatedCount` is more than zero, and `param.getType()`\
    \ is type of `java.lang.Double`. The `getType` method of `ParameterDescription`\
    \ is used to check the type of the parameter. The method return `true` if the\
    \ condition check is valid, otherwise `false`. The boolean value is then used\
    \ by `hasParameters` method in the `visit` method. Therefore, the program should\
    \ have matched the target code according to the matching requirement.\n\n201\n\
    \n![](Image00000.gif)\n\n`queryOther` method of `UserQuery.class` fulfills the\
    \ matching criteria, and it is added the `@ElementMatched` annotation:\n\n```java\n\
    @ElementMatched(\"Double.class parameter\")\npublic void queryOther(int p1, @Deprecated\
    \ Double p2, String p3, Double p4) { }\n```\n\n### Import static for ElementMatchers\n\
    \nAll of the method of `ElementMatchers` are `static`. To reduce coding, uses\
    \ `import static` to import the static method of `ElementMatchers`. For example:\n\
    \n```java\nimport static net.bytebuddy.matcher.ElementMatchers.isDeclaredBy;\n\
    import static net.bytebuddy.matcher.ElementMatchers.not;\nimport static net.bytebuddy.matcher.ElementMatchers.isOverriddenFrom;\n\
    ```\n\nWith these declaration of `import`, this code segment:\n\n```java\n.on(ElementMatchers.isDeclaredBy(\n\
    \  DataQuery.class).and(\n  ElementMatchers.not(\n    ElementMatchers.isOverriddenFrom(\n\
    \      Object.class)))));\n```\n\ncan be changed to:\n\n```java\n.on(isDeclaredBy(DataQuery.class).and(\n\
    \  not(isOverriddenFrom(Object.class)))));\n```\n\n202\n\n![](Image00000.gif)\n\
    \n### Conclusion\n\nThe chapter explains on how to use `ElementMatchers` to develop\
    \ matching logic to match the target Java element for instrumentation process.\n\
    \n203\n\n![](Image00000.gif)\n\n# Chapter 18: Generate Inner Class\n\nThis chapter\
    \ explains on how to generate inner class, and intercept inner class and anonymous\
    \ class using ByteBuddy. The source code of this chapter is included in `ChapterDefineInnerClass`\
    \ Eclipse project.\n\nThere are two plugin programs in this chapter: `DataReaderPlugin.java`\
    \ and `RepositoryPlugin.java`. `DataReaderPlugin.java` is responsible to create\
    \ two new inner classes in the `DataReader.java`. Before instrumentation, `DataReader.java`\
    \ is an empty class:\n\n```java\npublic class DataReader{ }\n```\n\nAfter instrumentation,\
    \ this is the java source code view of `DataReader.class` and its inner class:\n\
    \n`DataReader.java`:\n\n```java\npublic class DataReader{ }\n```\n\n`DataReader$Storage.java`:\n\
    \n```java\npublic class DataReader$Storage {\n}\n```\n"
