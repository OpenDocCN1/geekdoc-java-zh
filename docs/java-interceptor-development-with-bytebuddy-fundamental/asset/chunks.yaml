    ### 拦截方法参数值\n\n为了修改 `DataProducer.java` 中 `create` 方法的 `id` 参数的值，`DataInterceptor.java`\
    \ 在 `param1` 参数上使用了 `@Argument` 注解：\n\n`@Advice.Argument(value=0, readOnly=false)\
    \ int param1`\n\n`value` 属性使用值 `0`，这意味着该参数映射到 `create` 方法的第一个参数。注解为 `readOnly`\
    \ 属性指定了 `false` 值，这意味着建议方法想要修改 `create` 方法第一个参数的值。`readOnly` 属性的默认值为 `true`，这会阻止建议代码修改参数值。因此，建议方法可以将值从\
    \ `10000` 修改为 `20000`（第 21 行）：\n\n`param1=20000;`\n\n接下来，该注解被配置为修改 `create` 方法的第二个参数的值：\n\
    \n`@Advice.Argument(value=1, readOnly=false,\ntyping=Assigner.Typing.DYNAMIC)\
    \ Object param2`\n\n`value` 属性为 `1` 意味着 `param2` 映射到 `create` 方法的数据参数。`readOnly`\
    \ 属性为 `false` 意味着数据参数的值是可以修改的，且 `param2` 参数映射到数据参数 46。第三个属性 `typing` 的值为 `Assigner.Typing.DYNAMIC`。数据参数是\
    \ `java.lang.String`，而建议方法尝试使用 `java.lang.Object` 来映射 `param2` 参数。为了让 `param2`\
    \ 拥有除 `java.lang.String` 外的数据类型，`typing` 属性必须具有值 `DYNAMIC`。否则，maven 构建过程将失败。\n\
    \n建议注解的 `typing` 属性默认为 `STATIC`。当 `typing` 为 `STATIC` 时，`param2` 必须与其映射参数具有完全相同的数据类型。由于\
    \ `param2` 想要使用 `java.lang.Object`，因此 `DYNAMIC` 是正确的属性值。\n\n因此，通过 `@Argument`\
    \ 注解中的这些配置，建议代码可以将 `param2` 的值从 “test” 修改为 “test2”（第 22 行）：\n\n`param2=”test2\"\
    ;`\n\n### 拦截实例变量和类变量\n\n建议方法还修改了 `DataProducer.java` 中实例变量和类变量的值。有一个名为 `CLASSNAME`\
    \ 的类变量，以及两个名为 `recordId` 和 `descr` 的实例变量。\n\n为了修改实例或类变量的值，使用了 `@FieldValue` 注解而非\
    \ `@Argument`。该注解被配置为修改 `recordId` 的值：\n\n`@Advice.FieldValue(value=”recordId”,\n\
    readOnly=false) int data1`\n\n为了将 `data1` 参数映射到 `recordId` 实例变量，`value` 属性指定了实例变量的名称\
    \ “ recordId ”。`readOnly` 属性值为 `false`，意味着 `recordId` 变量的值在建议方法是可以修改的。因此，第 24\
    \ 行将 `recordId` 变量的值从 `1` 改为 `2`：\n\n`data1=2;`\n\n该注解被配置为修改 `DataProducer.java`\
    \ 中 47 行的 `descr` 实例变量的值：\n\n`@Advice.FieldValue(value=”descr”,\nreadOnly=false,\n\
    typing=Assigner.Typing.DYNAMIC) Object data2`\n\n建议方法使用 `java.lang.Object` 来映射数据参数。数据参数是\
    \ `java.lang.String`，为了让 `data2` 拥有除 `java.lang.String` 外的数据类型，`typing` 属性必须具有值\
    \ `DYNAMIC`。否则，maven 构建过程将失败。\n\n建议注解的 `typing` 属性默认为 `STATIC`。当 `typing` 为 `STATIC`\
    \ 时，`data2` 必须与其映射参数具有完全相同的数据类型。由于 `data2` 想要使用 `java.lang.Object`，因此 `DYNAMIC`\
    \ 类型是正确的属性值。\n\n通过这些配置，`readOnly` 属性 `false`，第 25 行将 `descr` 的值从 “ data ” 修改为\
    \ “ new data ”：\n\n`data2=”new data\";`\n\n该注解还可以修改类变量：\n\n`@Advice.FieldValue(value=”CLASSNAME”,\n\
    readOnly=false,\ntyping=Assigner.Typing.DYNAMIC) Object data3`\n\n通过这些配置，第 26\
    \ 行将 `CLASSNAME` 的值从 “ Data ” 修改为 “ DataProducer1 ”：\n\n`data3=”DataProducer1\"\
    ;`\n\n### 拦截返回值\n\n除了修改参数、实例变量，建议代码还可以修改返回对象。为了实现这个目的，注入过程必须实现方法进入建议、方法退出建议以及插件程序。\n\
    \n```java\n@Advice.OnMethodExit\npublic static void methodEnd(\n    @Advice.Return(readOnly=false)\n\
    \    int returnObject\n) {\n    returnObject = -2;\n}\n```\n\n48\n\n![](img/Image00000.gif)\n\
    \n使用 `@Return` 注解，`methodEnd` 中的 `returnObject` 将反映在 `create` 方法的返回值上。因此，第 34\
    \ 行将返回值从 1 修改为 -2：\n\n`returnObject = -2;`\n\n### 总结\n\n本章解释了：\n- 如何修改方法参数的值\n\
    - 如何修改实例变量的值\n- 如何修改方法的返回值\n\n49\n\n![](img/Image00000.gif)\n\n### 第 6 章：使用 OnMethodExit\
