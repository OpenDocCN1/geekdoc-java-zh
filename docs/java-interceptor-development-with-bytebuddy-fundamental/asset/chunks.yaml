  trans: "\n接下来，插件程序匹配了类型擦除为 `java.lang.Long` 的泛型实例变量。为了找到该泛型实例变量，使用了 `ElementMatchers.genericFieldType`\
    \ 方法。然而，`ElementMatchers.is` 方法并不适用。相反，使用了 `ElementMatchers.erasure` 方法：\n\n```java\n\
    builder.visit(new MemberAttributeExtension\n  .ForField()\n  .annotate(ElementMatcherUtil.create(\"\
    Long erasure field\"))\n  .on(ElementMatchers.genericFieldType(\n    ElementMatchers.erasure(Long.class))));\n\
    ```\n\n197\n\n![](img/Image00000.gif)\n\n因此，程序应该在 `DataQuery.class` 中找到了类型擦除为\
    \ `java.lang.Long` 的实例变量。`DataQuery.class` 拥有一个类型参数 “B”，其上界界限制为 `java.lang.Long`：\n\
    \n```java\npublic class DataQuery<A, B extends Long>\n```\n\n`data5` 实例变量的类型为\
    \ `B`，因此该实例变量符合匹配标准，并被选中添加 `@ElementMatched` 注解：\n\n```java\n@ElementMatched(\"\
    Long erasure field\")\nprivate B data5;\n```\n\n### `ElementMatchers.isAnnotatedWith`\n\
    \n下一次访问方法匹配带有 `@Deprecated` 注解的实例变量。为了此目的，使用了 `ElementMatchers.isAnnotatedWith`\
    \ 方法：\n\n```java\nbuilder.visit(new MemberAttributeExtension\n  .ForField()\n\
    \  .annotate(ElementMatcherUtil.create(\"Deprecated field\"))\n  .on(ElementMatchers.isAnnotatedWith(\n\
    \    Deprecated.class)));\n```\n\n`isAnnotatedWith` 方法接受 `java.lang.Class` 类型的参数，该类应该是\
    \ Java 注解的类。当实例变量的注解类与参数中的类匹配成功时，`isAnnotatedWith` 方法返回 `true`。在 `DataQuery.class`\
    \ 中，`data6` 实例变量符合匹配标准，因为它有一个 `@Deprecated` 注解：\n\n```java\n@ElementMatched(\"\
    Deprecated field\")\n@Deprecated\nprivate String data6;\n```\n\n198\n\n![](img/Image00000.gif)\n\
    \n### `ElementMatchers.isDeclaredBy`\n\n接下来，插件程序匹配由 `DataQuery.java` 声明的方法，且该方法没有重写\
    \ `java.lang.Object` 超类的方法。为了此目的，使用了 `ElementMatchers.isDeclaredBy` 和 `ElementMatchers.isOverriddenFrom`\
    \ 方法：\n\n```java\nbuilder.visit(new MemberAttributeExtension\n  .ForMethod()\n\
    \  .annotateMethod(ElementMatcherUtil.create(\"Method declared by DataQuery\"\
    ))\n  .on(ElementMatchers.isDeclaredBy(\n    DataQuery.class).and(\n    ElementMatchers.not(\n\
    \      ElementMatchers.isOverriddenFrom(\n        Object.class)))));\n```\n\n\
    当方法由参数中指定的 Java 类所有时，`isDeclaredBy` 方法返回 `true`。为了匹配未重写 `java.lang.Object` 超类方法，使用了\
    \ `not` 方法配合 `isOverriddenFrom` 方法。因此，在 `DataQuery.class` 中，测试方法符合标准：\n\n```java\n\
    @ElementMatched(\"Method declared by DataQuery\")\npublic void test(){ }\n```\n\
