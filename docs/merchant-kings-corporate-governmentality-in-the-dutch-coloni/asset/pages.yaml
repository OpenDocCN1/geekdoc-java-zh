  md: '# 8 MERCHANT KINGS


    do I take seriously Alfred Chandler''s argument that the corporation replaces
    the market through the hierarchical administration of economies of scope and scale
    and displaces less efficient market-based processes by the price mechanism; this
    organizational approach is taken in order to counter the reductionist individualistic
    economic arguments of the New Institutional Economists (Bratton 1989: 1473).


    As Chandler first emphasized, the competitive advantage of corporations lies in
    their "administrative coordination" through which they are able to engineer "greater
    productivity, lower costs and higher profits by coordination by market mechanisms";
    to this I would add the more explicitly political function of administering a
    restrictive class. In his words, this hierarchical administrative coordination
    makes corporations the very visible hand guiding the market (1977: 6). In contrast,
    the New Institutional Economists, led by Jensen and McClure (1976), reduced all
    market transactions to reciprocal individual contracts instead, and considered
    the corporation as a "nexus of contracts" with an "internal market" that remains
    organized by the price mechanism; they equate anonymous market exchange with the
    hierarchical administration of accounting transactions within the corporation
    (Eisenberg 1999: 822–23). Such an approach explicitly ignores the hierarchical
    nature of corporate administration, and the very politics of contending between
    equals within an organization rather than on an open market where all parties
    can simply walk away. By invoking metaphor of the corporation as the visible hand
    of the market, the hierarchical administrative role of the corporation in replacing
    the market with sets of accounts and contracts in the political management of
    colonial commodity chains is emphasized (1977). By invoking Foucault''s neologism,
    governmentality, the continued disciplined aspect of this corporate administration,
    is emphasized; account books that replaced actual market transactions were means
    of holding producers accountable (Miller 1994, 2008).


    Corporization as a political process can be illustrated by the imposition of the
    Cultivation System on Java beginning in 1830, a core subject of this book. The
    Cultivation System is usually described as a system of free cultivation in which
    Javanese peasants were forced to farm export crops like coffee, sugar, and indigo
    for the Dutch. However, the Dutch conceived of this extractive system as a "market
    exchange," codified in contracts between the state and local villages. These contracts
    fixed place in the institutional complex through which the Javanese were obliged
    to farm export crops and framed their "sale" as a contractual obligation by law;
    it was an "apparatus of security" governed by a particular form of governmental
    rationality. The contracts allowed the state to one-sided determine the amounts
    to be grown, and in which the price were to be grown and paid; they went beyond
    mere sale to incorporate management of production itself. This is therefore a
    form of governmentality that manages "the market" by arranging the disposition
    of things in order that Javanese farmers "do they ought." As I will later explore,
    these kinds of contracts invoke a "liberal illusion" in order'
