    oligarchy of gentlemanly capitalists.


    While Chandler has rightly dubbed the modern corporation the “visible hand of
    the market,” the power of its metaphor obscures the governmental impact of the
    corporation: this “visible hand” was the same that steered the ship of state.
    The regent class of the Amsterdam chamber of commerce united with the conservative,
    technocratic engineering elite at the Royal Academy and Royal Mint to take over
    the role of the monarchy in privately managing the new state-funded rail system.
    It was not the Thorian laissez-faire Liberals but the old republican elite that
    ironically adopted the technocratic corporate emphasis of the French utopian socialists.
    The General Society is but one example of how Amsterdam''s old republican political
    and commercial elite were transformed into gentlemanly capitalists usurping the
    role of the merchant king himself in fostering the industrial development of the
    Netherlands and in ultimately ruling the Dutch state itself. This account of the
    politics of the expansion of the Dutch railway system has focused on those national
    factors that favored the introduction of a technocratic form of corporate governmentality.
    Technocracy, supported either by Saint-Simons or by the utopian conservative advisors
    to the king, served a specific role in the new industrial regime; technocracy
    under the guidance of gentlemanly capitalists served as the ideological replacement
    for royalism in the government of corporate economies of scope and scale.


