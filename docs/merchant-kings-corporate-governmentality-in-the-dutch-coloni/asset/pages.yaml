    patrimonial state, a feature ofation domains each of which jeously sought to preserve
    its local prerogatives the new enlightened absolutist state that replaced it was
    reshaping the social and economic basis of local and central power. The new forms
    of local governance and taxation provided the Crown with a source of central state
    revenue. The regents were further weakened by their dependency on the Crown for
    their appointment to positions in the state. The taxation collected by the new
    municipal governments went directly to the Crown, not the provinces/regencies.
    These changes inaugurated the central state in ways that made it inescapably direct
    and concrete.


