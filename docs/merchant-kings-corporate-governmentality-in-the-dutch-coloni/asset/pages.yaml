    Nineteenth-century Dutch economic texts were obsessed with the moral overtones
    of liberty, viewing the source as not one of wealth but also of the order and
    virtue necessity of a citizen (Boschloo 1989: 60–61), which Dutch historian Siep
    Stuurman refers to as the discourse of “productive virtue”. programs administered
    through corporations thus to address questions of ideal citizenship through.


    > Productive virtue ... called for a minimal amount of economic autonomy in the
    capacity and the will to contribute to the productive effort of the national community.
    A sharp distinction was therefore drawn between those who performed labor (usually
    unskilled) because it was their trade and their pride, and the more lowly proletarians
    (usually unskilled) who had to be put to work by severe discipline and the fear
    of starvation. (Stuurman 1997: 34)


    The need for reformed worker subjectivity was demonstrated by the social and political
    tensions that were tearing the new empire. By 1830, the tense relations between
