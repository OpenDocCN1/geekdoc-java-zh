    # Colonial Governmentality in the “Greater Netherlands”


    In tracing the development of these royal corporations, I follow the circulation
    and reach of their sets of governmental practices throughout the Dutch empire.
    In doing so, I go beyond the current bounds of the Dutch historiography on business
    development and industrialization in the Netherlands in the nineteenth century,
    which largely ignores the impact of colonialism on that development (Mokyr 1976;
    Grifts 1979; Sluyter 2005; Wintle 2000; Zanden 1996; Zanden and Riel 2004; for
    exceptions see Manselt 1924; Meerbeek 2019). This neglect is a reflection of a
    wider reluctance of Dutch historians and publics to embrace postcolonial studies,
    and acknowledge the impact of colonialism, empire and imperialism on the processes
    of state and class formation in the homeland—and on the elite noble governing
    of gentlemanly capitalists in particular (Raben 2013).


    In the introduction to a recent panel and essay collection, Koekkoek, Richard,
    and Weesteijn (2017, 2019) note that Dutch colonialism has been extensively studied,
    there is no equivalent to the emergent large literature on British imperialism
    and empire. The Dutch, they have, both the subjects of imperial rule and imperial
    agents, but themselves had no Dutch word for empire (2017: 81–83). As C. J. Lammers
    noted in an early analysis, the concept of the Netherlands as “occupying power
    does not fit into our national self-image. We are not used to seeing ourselves
    and our ancestors as ‘occupiers’, but as ‘occupied,’ as victims of German and
    Japanese and of French in the 19th century, and earlier yet, of Spanish rulers
    (2003: 7). The recent Dutch historiography has largely disregarded the incorporation
    of “colonial” in national history; it acknowledges that “the early Dutch ventures
    overseas since the late-seteenth century were partly motivated by the Netherlands’
    emergence as an independent state, fusing national liberation and overseas conquest,
    but the raison d’être of the Netherlands was not grounded in any imperial motivation.
    The Netherlands themselves were never perceived as an empire and Dutch colonialism
    retained a strong business-oriented and technocratic bent (Raben 2013: 9). In
    addressing the “imperialism debate” in regard to Dutch expansionism in the Indonesian
    archipelago, Kuitenbrouwer summarized the arguments against the Dutch in models
    developed to account for the “scramble for Africa” and concluded that they should
    be considered ‘reluctant imperialists’ at best (1998). As a result, the Netherlands
    and its colony on Java have each been analyzed isolation, but little scholarly
    effort has been devoted to a comparison of their state-formation; indeed, the
    English-language literature on the United Kingdom of the Netherlands is negligible
