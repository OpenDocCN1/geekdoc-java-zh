    # The Emergence of Gentlemanly Capitalism


    Although we will explore each of their networks in greater detail, it is important
    to underscore the core features of rule that have been sketched out so far. This
    approach meant to indicate the manner in which specific regimes of practices—strategies,
    programs, and technologies of rule—circled within an apparatus of security through
    the forging of political and economic alignments and interests. As a sociology
    of rule, its intent was to underscore the context for the subordination of the
    Crown to the old republican governing elite. The cultural context for this transformation
    was a Saint-Simonian-inspired movement with deep roots in Willem’s own strategies
    of economic governance. Saint-Simonian technocracy was adopted as a political
    strategy in order to combat Liberal attacks on a state they characterized as the
    “spirit of Jan Salie.” The Crown’s adoption of the spirit of the Crystal Palace
    infused the engineers and colonial civil servants of the Royal Academy with a
    royalist vision of an “enlightening monarchy for the denominator of order and
    progress in the restoration of social harmony under the spirit of Auguste Comte
    and Napoleon III” (Laarse 2000: 24). Yet, as the Crown’s sovereignty was limited
    by the Liberal revolution of 1848, this project of rule was'
  merge: -1
