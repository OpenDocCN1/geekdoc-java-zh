    technocrats trained in the Royal Academy to become a more efficient state-run
    plantation. They successfully depoliticized control of the vast wealth produced
    by sugar manufacturing by rendering the process technical. In this period, contractual
    relations with the sugar manufacturers were tightened, and greater control was
