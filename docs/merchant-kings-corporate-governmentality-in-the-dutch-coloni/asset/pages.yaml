    # The Renewed Patrimonial State


    While complex variations in forms of noble land ownership, usufruct rights, and
    local patterns of authority existed internally within both the Netherlands and
    Java, it should be clear that the Dutch state under Willem utilized a fairly consistent
    set of governmental policies in both territories. The enlightened absolutist patrimonial
    state that Willem envisioned was to be administered by a regent class of independent
    wealth yet answerable to him alone for his positions. He introduced a uniform
    municipal government that was to serve as the vehicle for extracting the national
    taxes upon which the new state depended, but he excluded the provinces/regencies
    from tax collection, making them dependent on the central state for the revenue
    to implement governmental programs. The state sought to maximize those taxes by
    transforming the productive relations within the territory and encouraging market
    production through a series of cameralistic economic policies, some of them administered
    by royal corporations. Indeed, the maximization of revenue through the capitalist
    transformation of its territorial hinterlands is the governmental project that
    lies at the center of this.


