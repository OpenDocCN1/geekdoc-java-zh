    # The Circulation of Governmental Technologies


    I began this chapter by emphasizing the shared governmental rationality between
    Van den Bosch''s Colonies of Benevolence and the Cultivation System as projects
    of rule; they were development projects meant to transform paupers and lazy natives
    alike by instilling productive virtue and effecting a capitalist transformation
    of state wasteland. Each of these experiments created an apparatus of security
    to protect the fragile state from the historically unleashed by this transformation,
    manifested in the Belgian secession and the Java War. The primary strategy in
    Van den Bosch''s developmental toolkit was use of village-based authoritarian
    regimes to manage production. Prompted by Liberal critiques of the use of force
    (or discipline) in these colonies, he framed these experiments as market transactions;
    commercialized pauper relief. Noting that the propertyless in both the Netherlands
    and Java had no freedom of disposal their labor or produce, he compared their
    servitude to that of slaves, and legit his "educational" use of discipline as
    a viable alternative in his colonies. Colonial discipline was measured out in
    monetary units of account within closed colonial economies. Accounting was used
    within these apparatuses of security to both hold workers and to mimic markets
    that market discipline was installed.


    In the Javanese case, Van den built upon the liberal reforms that had been introduced
    in the British interregnum by Raffles. Raffles had attempted to shift taxation
    from trade, under the VOC, to land ownership as a means of inducing the Javanese
    to produce crops. To implement this, he created a common village government across
    the island, charging it with collecting this tax. This tax was turned over to
    Dutch directs, thereby the economic independence of regents, the representatives
    of the autonomous indigenous states. Van den Bosch built on Landelijke stels,
    this land system, by imposing new "economic" demands. Each village was to become
    a unit of production, growing specified cash crops in order to pay their taxes,
    and they were to only sell these crops to the state at the prices it dictated.
    These "market" transactions became a contractual obligation of the village as
    a utilized the patterns of landlessness and dependency as a means of disciplinary
    production; only landowners held, but they could use their authority over sharecroppers
    in order to meet village contractual obligations. The Janus-faced village head
    became a key accounting node in the developing system, managing cash crop production
    to raise the money he collected as land tax. It is important to underscore the
    ideological separation of land accounts from that village market accounts, that
    is, of the pragmatic means of disembding the economic from the relations of state
    force by which production was organized.'
