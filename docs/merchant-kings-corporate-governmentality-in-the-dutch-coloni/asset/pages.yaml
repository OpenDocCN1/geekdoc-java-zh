    # Benevolent Colonization: Corporate Governmentality and Biopower


    At several points throughout this book I have pointed to several distinctive features
    of this apparatus of security and its use in Dutch colonialism, economic development,
    and state formation that deserve further emphas. They form a unique Dutch tradition.
