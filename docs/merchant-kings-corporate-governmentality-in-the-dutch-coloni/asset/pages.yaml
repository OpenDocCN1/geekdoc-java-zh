    insurers, and retailers. Rather than seeking to maximize profits, the NHM accepted
    its fixed 7 percent interest return on capital and focused instead on increasing
    the efficiency of the industry under its direction so as to control its exposure
    to risk (Mansvelt 1924: 2:360). The provision of credit thus gave the Netherlands
    Trading Company greater control of the industry as a whole, allowing it to act
    as the visible hand coordinating “private” sugar production as it had in the Dutch
    cotton industry. This coordination supplemented that of the state through its
    standard contract.


    As ambitious and wealthy as the NHM was, however, it lacked the resources to meet
    the overall needs of ninety-six sugar factories under contract to the state, as
    became in the 1863 global credit crisis arising out of the American civil war.
    The credit crisis was aggravated by the new sugar contracts imposed in 1861, which
    had increased the state’s share of sugar profits at the expense of manufacturers.
    The civil war’s compounding effect was a “cotton famine” that severely affected
    the manufacture and import of cloth by these trading companies. The crisis resulted
    in the bankruptcy of many of Java’s oldest trading companies who had provided
    short-term credit to manufacturers for whom they exported sugar on commission.
    The crisis created a void in the provision of credit for the private trade in
    sugar and cotton that the NHM was unable to fill, leaving the field open for that
    the Dutch metropolitan coalescing in the credit mobilier movement. As we see,
    two of the most important of these challengers were the NHIB and the Internaty,
    the progeny of those long associates with the NHM, Willem Poolman and G. & H.
    Salomonson. These challengers adopted the same organizational form and strategies
    as the NHM, although given the openness of the field, they were hardy competitors.
    Because all of the players were intimately connected with the NHM, an easy circulation
    of its strategies of economic governance was achieved. Although there is the appearance
    of corporate competition, all three banks operated similarly with the same technologies
    of rule within the constraints of the state-directed system as a whole.


