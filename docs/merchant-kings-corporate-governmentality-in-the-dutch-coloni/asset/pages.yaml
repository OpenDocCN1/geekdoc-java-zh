    By focusing on a new area of concern


    Following Foucault’s lead, the focus of this book shifts attention from the formal
    apparatus of the state to those corporations that contributed to the globalization
    of society. Despite a clear tie between capitalism and the development of liberal
    governmentality, little attention has been focused on the role of the corporate
    form in that development (Nadeshon 2008: 55F). The co-emergence and interdependence
    of the modern nation-state and the corporation need to be underscored, especially
    at the moment of differentiation in the mid-nineteenth century. It was only later
    that corporations “shifted from a quasi-public agency—in principle accountable
    to all, embedded within an institutional structure that shifted the private sector—into
    a private agency, enveloped from government accountability by individuals and
    legally accountable to no one but their owners” (Roy 1997: 41). In that shift,
    corporations did not lose their governmental functions; they continued to a political
    strategy that delegated state (not specifically “economic”) tasks to ancillary
    jurisdictions.


    Foucault’s earlier work focused on the enclosed spaces of institutions where every
    departure from the norm elicited an automatic corrective disciplinary intervention.
    It was consideration of the disparate nature of the nineteenth-century global
    market transition that led Foucault to move beyond this earlier theoretical concern'
