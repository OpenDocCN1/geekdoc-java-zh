    This dual analytic approach has important methodological implications; the set
    of genealogical tools appropriate to the analysis of governmental rationality
    requires supplementation with class analysis. My primary theoretical project,
    the application of theories of governmentality to the corporate sphere, is supplemented
    by an analysis of Dutch and Japanese governing elites. The secondary project of
    this book is an exploration of the particular social and economic form of “gentleman
    capitalism” that emerged through the application of corporate governmentality
    in the Dutch context. By focusing on this class of “merchant kings” I underscore
    how the political process of incorporating enterprises was a means by which the
    govern elite of the Netherlands were able to apply royal sovereignty and establish
    a separate sphere—the “economy”—beyond the Crown’s reign by which they could maintain
    their traditional, hereditary rights to rule. This class attends to rela- tions
    of production within corporate enterprises but addresses them with a concern for
    their governmental implications.


    # Corporatization


    In discussing the specific sociology of rule that undergirs corporate governmentality
    in the nineteenth-century Dutch empire, I introduce the concept of corporatiza
    tion. Corporatization refers to the legal and political processes through which
    the cor- form is strategically used to solidify or fix in place the disparate
    elements of the messy assemblage of a governmental program in order to lead to
    institutional consist-ency, and permanence. Once frozen in this, the format of
    the assemblage can be circulated through the creation of new corporations; and
    these corporations can be tied into larger assemblages through overlapping boards
    of directors who ensure the further circulation of new practices between them.
    Focusing on corporatization is a means of addressing how particular governmental
    strategies circulated within and between corporations and the state in order to
    create a networked assemblage capable of managing global commodity chains.


    Corporatization specifically refers to two technologies of rule utilized in order
    to solidify assemblages: the use of contracts, and of accounting, by which they
    hier- archically organize and manage their personnel and internal economies. In
    focusing'
