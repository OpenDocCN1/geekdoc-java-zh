    # Gentlemanly Capitalism and Corporate Networks


    The Dutch railway corporations were a means by which the mercantilist regents
    of the city of Amsterdam were transformed into *regenten* capitalists much like
    King Willem I. This chapter therefore examined the delegation of royal sovereignty
    to corporations headed by this elite. Chandler views the limits that the new industrial
    technologies placed on the organization of labor (the technical relations of production)
    as critical to the development of scientific management and the modern corporation
    (Roy 1997: 7–10). This analysis, in contrast, has emphasized the social relations
    of production: the ways in which these innovative technologies manage people first
    developed in the royal corporations were redeployed by other gentlemen in private
    corporations. The railways borrowed these management technologies from the royal
    firms such as the *Société Générale* and the Netherlands Trading Society. As a
    delegation, first of royal sovereignty and then of the regent class, the adoption
    of particular social contracts for managing people through corporations was driven
    by political considerations.


    This transition to corporate governmentality embodies a central irony, as the
    corporation itself was transformed from a public economy into a private one as
    the state became increasingly open to democratic influence. On the one hand, the
    liberal emphasis on the separation of state and economy, that “government which
    governs, governs best,” ensured that this critical tool of state formation, the
    railways, remained in private hands rather than under state control. This liberal
    strategy limited the ability of the Crown to continue to dominate the economy
