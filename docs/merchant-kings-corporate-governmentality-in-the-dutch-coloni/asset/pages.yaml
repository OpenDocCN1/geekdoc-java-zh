    crisis; following its decade-long military standoff with a secessionist Belgium,
    it had the highest per capita public debt in Europe and faced bankruptcy, necessitating
    a period of structural readjustment. The sense of crisis was compounded by the
    potato blight, leading to widespread poverty, famine, and emigration with little
    effort by the state to ameliorate the suffering. As a wave of revolutions broke
    out across Europe in 1848, first in Paris then spreading to Belgium and a number
    of German and Italian states, Dutch liberals began to press for constitutional
    reform as the only remedy against an even more revolutionary change. After his
    cabinet resigned in a panicky king transformed, as he joked, from a Conservative
    to a Liberal in a day and yielded to a new liberal constitution (Laarse 1999).
    Rejecting his republican past, the absolute monarchy of the House of Orange was
    transformed into a constitutional monarchy on the British model, marking the transition
