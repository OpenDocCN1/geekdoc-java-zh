  md: '# INTRODUCTION | 3


    for disciplinary institutions the prison, asylum, and clinic to governmentality,
    so as to deal with the enormous growth in national and international markets,
    and the development of capitalism under liberalism. Governmentality invoked a
    regime of power that works on a broader scale, on populations as a whole, through
    an “apparatus of security” where the risks of an intervention must be first calculated
    (Foucault 2007: 44–45). I thus shift attention from the state to its “franchise,”
    the corporation, as one act of security for implementing governmental programs
    of market investment.


    By emphasizing the governmental aspects of corporations, their perceived relationship
    to the market is altered. They are no longer the simple market participants of
    economic theory, but in Alfred Chandler’s (1977) inversion of Adam Smith’s classic
    metaphor, they act as the “visible hand of the market” displacing market transactions
    with more efficient hierarchical administration; like Facebook, they by installing
    habits, educating desires, and “artificially arranging things so that people,
    following their own self-interest, will do as they ought” (Foucault 1991: 100).
    This new form of governmentality defines a population—whether of the “poor” or
    the native”—and frames it in these “mechanisms of security” that these populations
    can be managed in an “economic” way.


    The idea of an “economic government” has, as Foucault points out, a double for
    liberalism: that of government informed by the precepts of political economy,
    but also that of a government which economizes on its own costs: a greater effort
    of technique aimed at accomplishing more through a lesser exertion of force and
    authority. (Gordon 1991: 24)


    Chandler’s insight underscores a paradox: as nineteenth-century liberals were
    preparing a legislative program to laissez-faire markets, those markets came to
    be replaced by a newly emergent corporate order hierarchically organizing economies
    of scope and scale. As liberal capitalist regimes develop, in which those states
    that “governed least,” and therefore most importantly, “governed best,” the transfer
    of economic government to corporations was one means of “economic governance”
    in this dual sense.


    I explore these themes through the example of the royal corporations in the realm
    of the Dutch monarch, Willem I, through which he economically governed an empire
    over the nineteenth century. The Netherlands had been an early creator of the
    corporate form, and of the world’s first stock market. At the start of Willem’s
    reign, the Netherlands was a rural backwater with little industry, high unemployment,
    and a hard-won and costly empire inherited from an earlier golden era, as likely
    to succeed in the competitive industrial revolution as Portugal (Zanden and Riel
    2004: 85–120). Over the course of his reign, a series of royal corporations led
    the empire’s market revolution, organizing global commodity chains that enriched
    the state, fostered the market, and disciplined recalcitrant peasants and'
