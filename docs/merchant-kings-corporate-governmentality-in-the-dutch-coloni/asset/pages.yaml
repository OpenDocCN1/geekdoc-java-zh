    # # Constructing Commodity Chains


    The circulation of governmental technologies of power into the corporate sphere
    promoted the assemblage of these projects of rule into an integrated set of commodity
    chains linking metropole and colony. I return in other words, to the original
    question, the “how” by which the “fragile relays, contested locales and fissiparous
    affiliations” in the active assemblage of projects of rule such as these commodity
    chains are accomplished (Li 2007b: 264). Although global commodity chain analysis
    are rooted in world-systems theory and the dependency tradition (Hopkins and Wallerstein
    1977), its focus has changed and shifted to the analysis of “global value chains”
    as this literature developed, with a more specific focus on their organization
    and governance with little attention to how such comes into being. In the dominant
    approach drawing on the New Institutional Economics, “economists, sociologists
    and geographers have often mobilized a final vocabulary such as the ‘market,’
    ‘the firm,’ ‘the commodity,’ ‘value,’ ‘capital,’ or ‘price,’ which serve as stable
    and unquestioned affairs of explanation a priori (Ouma 2015: 7). In questioning
    the organizational power of the invisible hand of the market and pointing instead
    to the visible hand of the corporation, I hope to underscore the political and
    governmental processes influencing how these commodity chains were originally
    assembled and how they functioned.


    I wish to choose the common theoretical dictum that the market as the preconfigured
    and essential coordination mechanism for such commodity chains. The use of standard
    contracts (like those used with Javanese languages) was the NHM’s hierarchical
    means of replacing market transactions. Chandler has argued that the substitution
    of administrative coordination using monetary units of account to replace market
    coordination is typical of the internal accounting of the corporate form; it is
    estimated that the “closely governed, non-market movement of goods and services
    within corporate hierarchies represents as much as one-third of international
    trade” (Mitchell 2002: 294). The commodity chains in sugar, coffee, and cotton
    cloth linking the greater Netherlands into an interdependent whole in the emergent
    world was accomplished through the same kind of nonadministrative coordination
    by the NHM as was used in the Cultivation itself.


    To ascribe the coordinating function of these chains to a reified market is to
    rehetical rejection of the original impetus of world-systems theory with its specific
    focus on how households, commodities, frontiers, and territories were integrated
