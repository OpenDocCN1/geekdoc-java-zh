    In the introduction, I noted that Thomas Hobbes'' Leviathan served as a key ideological
    means of producing the “state effect”—that is, of imagining the unity of the Western
    state personified in a Crown sitting above and separate from the civil society
    encompasses and rules. It is an origin tale rooted in a mythic of state that thus
    shifted the question of royal legitimacy from history and from conquest to a purely
    philosophical plane. Hobbes'' Leviathan is personified and unified the state whose
    "body politic" was composed of the unamed multitude otherwise engaged in a competitive
    war of "all against all"; a Mult of men are made One Person, when they are by
    one man, or One Person, Represented” (cited in Neoleous 2003: 150). The multitude
    and their representative are bound together in this personified sovereignty through
    a “social contract,” an ambiguous voluntary surrender of individual sovereignty
    to the Crown, which thereby guarantees the rights of sovereigns, the liberties
    of subjects, and the power of law. Through this contract, the state was personified
    in the Crown, and hereby came to deny “the multitude of its sovereignty—to deny
    it unity independent of the state” (Neoleous 2003: 152). No competing source of
    sovereignty, could be sanctioned.


    However, the corporation disrupted this ideal prescription on the pluralization
    of sovereigties. We have traced the corporate means by Willem I, the merchant
    of the Kingdom of the Netherlands, extended its sovereignty by establishing a
    series of “franchise states” that themselves depended upon this Hobbesian ideological
    maneuver. Like the leviathan, the state, the personified corporation came to stand
    apart and separate from the multitude of shareholders who rendered their economic
    sovereignty through a similar social contract. The “separate personality” of the
    corporation made it a personification of shareholder capital that it (not they)
    now owned; the person of the corporation replicates power through its unity as
    the basis for domination. This explains why both state and corporation were historically
    understood through the same category of “body politic” (Neoleous 2003: 158). State
    sovereignty, the right to govern, was now partitioned among these multiple leviathans.'
