    to hold people accountable. Accounting, as it has noted, is way of exercising
    “control at a distance” through the use of “inscription”; it allows for centralized
    comparative insight that offers both global and individualized perspectives (Rose
    and Miller 1990: 10). While not inn hierarchical observation and “normalizing
    judgment” at its disciplinary curve (Hoskin and Macve 1986). Accounts provides
    an “objective” measure of individual performance from a global perspective, allowing
    for them to be graded on a normal curve, and offering the rationale for the application
    of individualized discipline to address their failures.


    Disciplinary accounting systems were used to shape and mold the Dutch and Japanese
