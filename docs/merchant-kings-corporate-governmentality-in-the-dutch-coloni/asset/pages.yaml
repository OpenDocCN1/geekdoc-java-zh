    # CORPORATE GOVERNMENTALITY


    In July 2018, the British government leveled its finest ever on social media giant
    Facebook for breaches of the Data Privacy Act; the £500,000 fine (equal to approximately
    five and a half minutes of the company''s revenue), resulted from its role in
    selling the personal profile data of 50 million of its users to Cambridge Analytica,
    whereupon it was used to influence the Brexit referendum vote and the 2016 U.S.
    presidential election. The U.S. Federal Trade Commission applied a $55 billion
    fine for the same offense. Singling out Facebook, Google, Amazon, Apple, and Microsoft
    are the five largest corporations in the world by market capitalization, and all
    operate on a similar model: that of the surveillance of their active users, the
    silent shadowing of their activity as they traverse the wider web, and all of
    this data in behavioral targeting to subtly influence their market choices and—as
    the Facebook fines—their political views. This combination of individual surveillance
    with the subtle behavioral shaping of populations, many argue the “government
    of conduct” that French philosopher Michel Foucault argued was the core principle
    of “governmentality, a Western form of instrumental rationality that buttresses
    modern forms of power. This strategy is not restricted to technology 1, I will
    argue, but is inherent in the very genealogy of the corporate form itself in the
    nineteenth century.


    One of the most transgressive aspects of the concept of governmentality, or “governmentality,”
    is the underlying assertion that the West is not the “origin of government” but
    that at a specific moment in time the “state was governmental.” The focus on governmentality
    was Foucault’s way of drawing our attention away from the state and its structure
    to the plethora of independent agencies that shared its strategies of social control
    in order to regulate the health and prosperity of a population; agencies that
    argue should include corporations. At a critical juncture in the nineteenth century,
    the state began to connect itself to a series of groups “that in different ways
    had long tried to shape and administer the lives of individuals” rather than simply
    expanding the state’s repressive machinery of social control (Rose, O’Malley,
    and Valverde 2006: 87). Foucault focused on the manager in which both the state
    and these civil organizations came to share a set of programs that were applied
    to a population as a whole in order to secure “the improvement of its condition,
    the increase of its wealth, longevity, health.” Governmentality educates'
