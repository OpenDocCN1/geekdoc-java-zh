    # The Credit Mobaliers in the Java Trade


    Willem II’s "rule of experts" was a phenomenal success for the statechequer and
    a clear expression of state-level development, a "command economy." The managerial
    culture fostered by Royal Academy engineer-administrators increased the efficiency
    of the sugar industry and substantially improved states. It had, however, partially
    accomplished that measure by incentivizing European contractors with a share of
    the increased production for private sale. Although the Cultivation System can
    be treated as a single, multisite state plantation, it was also, after 1847, for
    a dependent private capital accumulation. The new model sugar contracts developed
    in 1847 and 1860 allowed contractors to retain up to a third of their production
    for private sale, and as Knight (2007) emphasizes, were the vast sums generated
    from that funded the bourgeois lifestyles of the sugar lords. In forging their
    alliance with the state, the sugar lords had, however, backed away from Liberalism
    in order to have their contracts renewed. Here we trace how the "private" sale
    of sugar entangled the sugar lords in new forms of economic governance that circulated
    the state through its economic arm, the NHM, and from there through other corporations.
    Here, now, focus shifts to the rule of experts exerted by Willem II to operate
    governmentality under the liberalized regime of Willem III.


    Under the old system of long-term loans for factory capitalization, the NEI state
    had f7 million in credit by 1844, which demanded total control of the factories’
    output, at prices it determined; in contrast, the NHM extended f4.9 million in
    loans to 26 sugar factories by 1861, financing their conversion to steam as prescribed
    under the new model contract (Claver 2014; Mansvelt 1924: 2:361). Their largest
    customers included Fransen van Po, Hubertas Hoeverenaar, D. C. Advent, and P.
    H. A. van Broek, owners of what were considered the most advanced factories in
    the Indies (and, Asia). Sugar producers were obligated, under the new contracts,
    to provide the state with only two-thirds of their production (at cost), leaving
    one-third for private disposition (and profit). The NHM made capital loans to
    these producers at 7.5 percent but discounted by 1 percent if they consigned their
    private sale to the NHM, giving the company its own sugar to trade "privately"
    outside of the consignment system. The company acquired with f5 and 6 million
    worth of sugar per year on the Amsterdam market. By this means, its profits increased
    fourfold during the 1850s (Mansvelt 1924: 2:360–61).


    Transporting and wholesaling the production of twenty-six factories allowed them
    to introduce economies of scale that gave them continuing ability to arbitrarily
    set the terms of their standard contracts with manufacturers, shipping companies,'
