    perpetuated by the House of Orange''s traditional opposition, the conservative
    regents who now contested a Liberal government that impinged on its own traditional
    rights and privileges.


    These regents were rentier capitalists whose wealth and position guaranteed them
    economic and political positions in the royal state. Family businesses based on
    trade and merchant banking were both a source of wealth and also served an educational
    function that schooled their children for their future roles in government. The
    educational function of the family firm was supplemented in this period by the
    Royal Academy, which produced a “rule by experts” schooled in the “practical knowledge”
    required for governing. The engineers that it produced to “govern economically”
    through the technocratic rule of corporations that replaced markets as coordinating
    mechanisms. By the end of the 1860s, the technocratic elite from the Royal Academy
    surrounding the kind had assumed a dominant position among politicians in parliament,
    in the bureaucracies of both the Netherlands and Netherlands Indies, and in the
    heavy industrial corporations, including sugar manufacturing in Java and the railways
    in the Netherlands. These regent engineers gained control of the royal concessions
    in these industries using the transfer of governmental strategies, programs and
    techniques of rule within the state-corporate assemblage. A bourgeois culture
    of corporate management was the product. It is here, that we find the roots of
    the “regenten [gentleman] capitalism that was to drive Dutch imperialism in South
    Africa and the Netherlands Indies archipelago in the latter half of the nineteenth
    century (Kuitenbrawer 1994; 1998; Bossenboek 1996).


