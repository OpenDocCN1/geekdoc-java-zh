    millions, or more than half.Notwithstanding the fact that Holland has held her
    present colonies for several centuries, she has been constantly fighting with
    the indigenous races, and her wars with them have usually been of a sanguinary
    character. At the present day the Achinese in Sumatra occasionally give trouble
    to the Dutch authorities, the people being of a character more turbulent and aggressive
    than the inhabitants of Java, where peace and tranquillity now reigns. It may
    not be generally known, or the fact may now be forgotten by most people, that
    at the time Napoleon was overrunning Holland, the Dutch possessions were either
    taken over or were made over by pre-arrangement to the English, who retained them
    for about five years, and subsequently restored them to Holland when that country
    regained its independence.There is much evidence to show that Java was part and
    parcel of what is now known as British India, at which time its people were followers
    of the Hindu religion. As the result of Mahommedan invasion, they eventually became
    followers of the Prophet, which they remain to this day, although it must be admitted
    that they are by no means orthodox in the observance of that religion. In the
    privacy of their homes, the people to this day indulge in the worship of graven
    images, thus showing the effect of a habit inherited from one generation to another,
    and one which the Mahommedan religion has been incapable of wholly eradicating.Our
    steamer reached Tandjong Priok at seven in the morning, whence, after twenty minutes
    in the train, we reached Batavia. We put up at the Hôtel des Indes, where the
    whole of an annexe had been set aside for my accommodation. The annexe was a large
    building, with lofty rooms, well adapted, as regards furniture, etc., to real
    comfort. The floors were paved with marble, and, as is the case everywhere in
    Java, the beds were of enormous size. It is no exaggeration to say that the bed
    provided for me measured 8 by 6 feet.Shortly after our arrival our first meal
    was served, and this proved quite an interesting feature in our experiences. The
    meal itself is known as “Riz-tafel,” meaning, literally, “rice table,” and is
    served at one o’clock. All the courses were placed in front of one at the same
    time; they consisted of a kind of curried meat, chicken, fish, etc., etc., and
    with the aid of a soup-plate of generous dimensions, upon which a liberal quantity
    of rice was placed, one helped oneself from the numerous dishes on the table in
    front.After the meal most of the people disappear, the shops and places of business
    close, and for the time being a sort of *dolce far niente* feeling pervades everything
    and everybody in the place. At six o’clock, when the great heat is over, a kind
    of resurrection takes place, and signs of life once more become visible.During
    the evening I went for a drive to get a general idea of my new surroundings. In
    the course of the drive I peeped into the barracks of the Dutch troops, and was
    much interested to observe their mode of living. Both the Dutch, European, and
    Native troops live and feed together; the natives are uniformed the same as the
    Dutch, even to their helmets. The total number of European and Native Dutch troops
    is about forty thousand.The town is well designed and laid out; and although most
    of the buildings are unimposing one-storey affairs, they are massive and well
    constructed, and all are provided with roomy verandahs. The streets are well paved,
    and have foot-paths on both sides for the convenience of pedestrians. A military
    band played a good selection of music in a large square called Waterloo Plein,
    to a numerous and appreciative gathering. At 7 p.m. (the usual hour for visiting)
    Mr. Fraser, the British Consul, came to see me. Mr. Fraser is a merchant in a
    large way of business. He took me to the “Harmonie,” a civilians’ club, where
    a string band played for the edification of a number of people who were making
    themselves happy with cool drinks and ices at small tables placed in the open
    air—a form of relaxation one longs for, but rarely gets in India, where the opportunities
    for such diversion are unlimited.The crowd was a select one, and included some
    well-dressed ladies as well as Dutch officers in uniform. The club is a commodious,
    well-arranged place, with appropriate marble floors; it appeared to be a highly
    popular place of resort. Dinner was served at the hotel in the usual manner at
    nine o’clock, that being the usual dining-hour in Java.I visited the museum the
    next morning. It contained a fine collection of articles—some ancient and others
    modern, as well as things illustrative of the arts and sciences practised in the
    Dutch East Indies. One feature of the collection interested me greatly; it was
    the fine assortment of stone images which had been excavated from different parts
    of the island from time to time. These images were in all respects the same as
    those to be seen in Indian temples at this day. For instance, I recognised the
    image of Ganesha, also Shiva and Krishna; indeed, almost all the gods known to
    Hindu mythology appeared to be there.From the presence of these images, and bearing
    in mind their great antiquity, as well as other circumstances, it is not difficult
    to infer that in the past ages Hinduism was the prevailing religion. That Hinduism
    had stamped itself on the people in the time gone by was further evidenced by
    the presence of numerous articles of domestic utility, such as pandans (betel-nut
    boxes), gold and silver dishes, and a number of other things all of a type and
    design used in our country; and the similarity, both as to appearance and use,
    I recognised immediately. Many of these things, apart from their value as curiosities,
    were precious intrinsically.Next I visited the residence of the Governor-General,
    which I found to be an imposing building, well but plainly and substantially furnished.
    The marble floors common to that part of the world were in evidence there. The
    reception-rooms were particularly spacious and lofty. This palate is, however,
    not used very often—indeed, only when the Governor comes down from Buitenzorg
    for a big reception or other function.A feature of life in the country is the
    partial adoption, by Europeans, of the native dress, in which they spend a considerable
    portion of the day. It consists, in the case of women, of a sarong—otherwise a
    kind of loin cloth—and a sort of loosely fitting blouse. The former are sometimes
    fine specimens of local art and vary greatly in value. In this *déshabille* costume,
    and minus shoes, stockings, and hats, they go about all day; they even sit down
    to their midday meal in the diaphanous garments described, and only change into
    European clothing in the afternoon when they go out. Imagine the shocked expression
    that would spread over the features of an Anglo-Indian dame if it were suggested
    that such a costume should be adopted by the ladies in India to combat the exigencies
    of the climate !My surprise on arrival was very great, and for some time it did
    not dawn on me that the fair-haired and blue-eyed women in the costume of the
    country were of European nationality. It is worthy of note that the Dutch seem
    to be the only European race which, after conquering a people of inferior capability,
    have to some extent adopted the customs of the latter as far as their mode of
    living is concerned. There one finds that not only do the Dutch wear the clothes
    common to the country, but they also bathe in the same way and, to a great extent,
    eat the same food as the people.![Image](Images/50.jpeg)[THE GOVERNOR-GENERAL’S
    PALACE, BUITENZORG.](#009_9781317949527_illustrations.html_ill5-1)The system of
    passports is rigorously adhered to in this country, and one is obliged to present
    his card to be *viséd* within three days of his arrival.I found the shops attractive
    in appearance and full of a variety of goods from nearly all the countries in
    Europe. This I found to be a superior arrangement to that prevailing in most of
    the big establishments in Bombay and Calcutta, where one is obliged to take things
    made mostly in England, or go without.During my drive in the afternoon I was struck
    by the arrangements made by the Dutch for the separation of the living-quarters
    of the different races. One portion had been set aside for the exclusive use of
    the European community, another for the Malays, still another for the Chinese.
    The Japanese, of whom there were a few, curiously, did not come under the category
    of Asiatics, and were permitted to live where they pleased. Being transient visitors,
    our nationality did not debar us from living in the European quarter!!!The “Concordia”
    was next visited; this is the military club, and we found it even superior to
    the “Harmonie.” I also saw the Town Hall, in which were a number of fine paintings
    of former governors.Heavy rain was falling when we left on January 5 for Buitenzorg.
    I had a reserved carriage, which was fairly comfortable. Most of the carriages
    have leather-covered or the ordinary cane-bottomed seats. The gauge of the line
    was something between the broad and meter gauge in India. The names of the stations
    were displayed in Roman and Javanese characters, the spelling being, of course,
    on the Dutch system.Buitenzorg was reached after about two and a half hours’ journey.
    The rain continued the whole way, but did not suffice to obliterate the beauty
    of the scenery *en route*. On both sides of the line, as far as the eye could
    reach, there was a dense mass of the most profuse tropical vegetation one could
    imagine.Buitenzorg has an altitude of about two thousand feet above sea level,
    but the gradient of the line was very easy and gradual. After reaching our destination
    we drove to the Hôtel Bellevue, which, by the way, seemed to be very appropriately
    named, inasmuch as the outlook from the hotel verandah was a particularly fine
    one, and extended over beautifully wooded and extremely fertile valleys. Our arrival
    corresponded with the time for “Riz-tafel,” which, at this place, was just the
    same as I described at Batavia.The climate of Buitenzorg was a great improvement
    on that of Batavia, and in every way more pleasant and cooler than the latter.
    In this latitude a great equality of temperature exists at all times of the year
    owing to proximity to the Equator, and the days and nights are of about equal
    length. This being the rainy season, rain fell almost daily.The salubriousness
    of Buitenzorg attracts many people of Batavia to live there, as by so doing they
    avoid the heat and other disadvantages of life in the latter place. For the same
    reasons the Governor-General has his principal residence at Buitenzorg. An intimation
    reached me that the Governor-General Rooseboom would receive me at 6 o’clock,
    and shortly after one of his secretaries, in full uniform, called at the hotel
    to escort me to the Governor’s residence. A State carriage was sent to take me
    there.On arrival I was received, on alighting, by two of the Governor’s secretaries,
    who escorted me up the steps, which were lined on either side by servants of the
    household, whose position was probably the same as that of orderlies in our country.
    The Governor met me at the top of the steps, where, after greeting me in English,
    which he spoke with facility, we proceeded to the reception-room, and had some
    conversation on general topics, during which tea was served. The Governor-General,
    I was told, hardly ever went on tour in the districts, some of which he had never
    seen. In this respect there was a striking difference to be noticed as compared
    with the Viceroy in India.On leaving Government House, I drove about the place
    and admired the splendid avenues of kanari trees which bordered and shaded the
    excellent metalled roads. Here and there we came across pretty residences, always
    embowered in trees and the all-pervading luxuriant tropical vegetation. The kanari
    tree is a magnificent specimen, and grows to a great height; I have never heard
    of it in other countries, and I believe it to be indigenous to this island.![Image](Images/51.jpeg)[A
    SCENE IN THE BOTANICAL GARDENS, BUITENZORG.](#009_9781317949527_illustrations.html_ill5-2)Buitenzorg,
    notwithstanding its excellent climate and delightful surroundings, appeared to
    lack vitality; this was also noticeable in the Dutch residents, whose innate conservatism
    had been enhanced by residence for prolonged periods in the enervating Tropics.January
    6 was profitably and pleasantly spent in seeing the famous botanical gardens,
    which are, without exception, the finest in the world, and cover several square
    miles in area. Arboriculture in this place is brought to the highest pitch of
    excellence; this of course being a matter of no difficulty where soil, climate,
    moisture, etc., all lend their aid in bringing plants of all kinds to perfection.
    I particularly admired the manner in which portions of this lovely garden were
    laid out; there were slopes and terraces bordering a miniature river, and the
    so-called landscape effects were indicative of the highest kind of skill.The Dutch
    have the reputation of being the cleverest gardeners in Europe, and I must say
    their descendants in Java have lost none of their hereditary skill. The only other
    place at all resembling the botanical gardens, or which could be classed with
    it, is the Paradinya garden, near Kandy, in Ceylon; but this, although very fine,
    takes a place second to the one I have been describing at Buitenzorg.Another place
    I saw at Buitenzorg, although interesting, was not so pleasant a sight as the
    botanical garden, *viz*. the lunatic asylum. The Governor-General strongly advised
    me to see this place, which he said was the finest institution of the kind in
    the East. The result of my visit did not belittle his description. The director
    and the doctor went all over it with me, and showed me everything worth seeing.
    One portion of the premises was set apart for the accommodation of European patients,
    and another for the Asiatics; of course, the sexes were separated.The whole place
    was maintained in first-rate order, and the unfortunate inmates appeared to have
    everything necessary and even comforts. I felt quite nervous when taken to the
    place where the dangerous lunatics were confined, but the doctor reassured me
    by going on in advance. Some of the inmates were playing games (of which they
    kept no score), others were amusing themselves in a variety of ways. Some of the
    patients were as jovial as could be; others were in a condition of chronic depression;
    again, others were beating themselves. One man said he was King of England; another
    said, quite seriously, that he was monarch of Spain. It was a pitiful sight to
    see so many people who were absolutely irresponsible for their conduct and actions.The
    next day we effected an early departure by train, and the journey down was most
    enjoyable, as both sides of the railway formed a panorama of the most beautiful
    scenery in Java. We steamed past a number of large tea and coffee plantations,
    and noticed the grand manner in which the wealthy planters appeared to live; their
    houses were really very fine, and each planter appeared to be “monarch of all
    he surveyed.” The journey by rail was interesting in another sense, as from the
    train we saw some of the highest peaks in Java, which probably reach from 8,000
    to 9,000 feet; they are volcanic in origin. The train by which we travelled actually
    reached an altitude of 5,000 feet, and in places the rails were formed into circles
    in order to make the gradient less severe.There were no refreshment cars attached
    to the train, but this was not a serious inconvenience, as one could get “Riz-tafel
    ” in baskets at the big stations, which could be taken in the train. We reached
    Bandong at midday, and drove to the Hôtel Homann. In travelling one cannot avoid
    making comparisons, and this I found myself doing whenever I entered a hotel in
    Dutch Indies. They were superior in the matter of accommodation, appointments,
    cleanliness, etc., etc., to anything we are accustomed to in towns of about the
    same size and importance in India. For an ordinary-sized room, etc, the tariff
    was anything between five and ten gulden[¹](#015_9781317949527_chapterV.html_fn-fnrefV_1)
    per day inclusive.The hotels are usually one-storey structures, with a verandah
    running the entire length. An inconvenient feature was the great distance that
    usually separated the living-rooms from the bathrooms. Sometimes one found a sort
    of covered passage connecting the two, but more often there was no protection
    whatever from the sun and rain. The sanitary arrangements, I may add, were not
    according to the latest methods. The Europeans, like the natives, avoided the
    use of a tub when bathing, and merely poured water over their bodies.In accordance
    with my invariable practice on reaching a place, I went for a drive soon after
    we got to Bandong. Being the headquarters of a division and boasting a Resident,
    the place is one of some importance. It is admirably situated on a plateau surrounded
    by hills, and for this reason enjoys a climate superior to that of most places
    in Java.I was surprised to find some really good shops in such an out-of-the-way
    place. Bandong has nothing particular to attract sightseers, and beyond the substantial
    Residency building and some of the houses of the European residents, there was
    nothing to be seen. I may note one curious feature, however, that is the odd houses
    in which the natives live; they are made entirely of wickerwork with thatched
    tops; from a distance they look exactly like large baskets.On January 8 I visited
    the Indian chief’s school during the morning, and was interested in it to an unusual
    degree, as I had heard that it was the only school in the country at which the
    sons of the nobility could get training and education together with a knowledge
    of the Dutch language. It is only a limited number of the superior class people
    who can get this knowledge. The innate conservatism of the Dutchman in this matter
    is at once apparent when one is told that they have serious objection to the mass
    of the people acquiring a knowledge of Dutch, because it would make them too learned.
    Dutch, by the way, happens to be the only European language taught.The Director
    met me at my hotel, and escorted me to the school, where I was received at the
    entrance by the Principal, who showed me all the different classes. The boys were
    all at work on various subjects, and it amused me to listen to their efforts to
    get the gutturals of the Dutch language during a reading-lesson. It must have
    been most laborious to them, as their own language is distinctly soft and musical.
    Several of the boys were the sons of Sultans and other highly placed members of
    the native aristocracy.All were dressed in their usual costume of sarong and jacket;
    no shoes or stockings were worn. It also amused me to find that these young noblemen,
    as well as the common folk of the country, were forbidden to wear European civil
    clothing; half-castes apparently ranked as European—anyway, as far as their dress
    is concerned. It was also noticeable that the men never had their hair cut. It
    was gathered together and fastened at the back of the head in the form of a knot.
    On asking why the hair was never cut, the reply came “Adat,” or, habit.I asked
    to see a specimen of the boys’ handwriting, and found the characters were nothing
    but Arabic, pure and simple. This refers to the writing of the Malay language;
    but the characters of the Javanese language were totally different, and I failed
    to identify them. There is nothing in particular to mention with regard to the
    other subjects which were being studied by the pupils; they appeared to be the
    usual routine kind, such as arithmetic, reading, writing, geography, etc., etc.
    I may add that the study of geography was chiefly confined to Holland and Java.
    After completing my round of the school, I was shown the dormitories; these were
    decidedly comfortable, and furnished after the European style. Two boys occupied
    one room, in which they took their food, specially prepared for them in the manner
    they were accustomed to. On the approach of the Principal the boys fell on their
    knees, this being the form of salutation to a superior.We departed at one o’clock,
    and after a journey without incident reached Maos at seven in the evening, where
    we found a comfortable bungalow. Maos is a Government halting-place, or, as it
    is called in Java, “passagrahn.” As trains in Java only travel in the day, these
    halting bungalows are essential.Djocjokarta was reached during the afternoon;
    this name is probably derived from the Sanskrit Yogyakarta. We put up at the Hôtel
    Mataram. The town being very low down, and no rain having fallen for some days,
    it was intensely hot. One missed the punkah very much; but with the exception
    of Batavia, where electric fans are installed, I did not see a punkah in the whole
    country.The language difficulty at our hotel was a serious one, as none of the
    people understood either English, French, or German. We actually had trouble in
    procuring mutton for dinner, owing to the European manager being unable to interpret
    our wants. The difficulty was finally surmounted by one of us making a bleating
    noise similar to that usually emitted by a sheep, on hearing which the manager
    was full of intelligence and brought the mutton without delay. It was odd that
    many of the words are the same as ours : for instance, “roti” (bread), “mircha”
    (pepper), are the same in both languages; no doubt there are many other similarities.
    Moreover, several of the words in Javanese are derived from the Sanskrit and Arabic,
    and are precisely the same as in Hindustani.We were in what is known as the “Vurstenland,”
    which corresponds in Hindustani to Rajastan, or Princes’ Land, Djocjokarta being
    the residence of the Sultan of that name. Near by is the State of Solokarta. The
    Sultan of the former place has leased that portion of it to the Dutch Government
    which is occupied by the Resident and the Dutch colony. The Residency is situated
    in the best part of the place and just opposite the moat of the Kraton or Palace
    of the Sultan.The Dutchmen’s houses appeared very snug, and overlooked fine broad
    tree-girt avenues. The merchants in that part of the world are certainly enterprising,
    and even in an out-of-the-way place like Djocjokarta fine shops flourished. A
    French barber had an up-to-date shop there, fitted with all modern appliances,
    and all the other shops were up to a standard of first-rate excellence. There
    is more native life to be seen there than in other parts of Java, owing, probably,
    to its being the seat of a native potentate; and one could not help noticing the
    difference of rank indicated by the varying degree of size, colour, or kind of
    umbrella made use of. Even the rank of the people driving about in carriages was
    indicated by difference in the size or kind of umbrella, each of which had a different
    significance.On the 10th we made an early start to visit the world-famous Temple
    of Boroboedoer. At each seven miles we had relays of ponies; and although we had
    four ponies in the carriage at one time, the journey occupied three and a half
    hours. The road was a fine broad one, on one side of which a steam tramway ran,
    with which we travelled parallel for a considerable distance.The steam tramway
    seems to be popular, and is frequently seen in different places. Important towns
    and villages have the tramways running right through them, to the great convenience
    of the inhabitants. *En route* we came to a “passer,” or open market-place, at
    which we alighted, as it was well worth a visit. The villagers bring their produce
    to these “passers” from the surrounding villages, and expose the different articles
    for sale. There was an heterogeneous collection of things, such as clothing, fruit,
    vegetables, and all kinds of household commodities and requisites, for sale. There
    was an abundant supply of fruit of excellent quality. I had never tasted a mangosteen
    in such perfection until I visited Java, and there I had ample opportunity, which
    I did not forego. Another fruit of a curious nature to be had there was the durian.
    Its smell, however, was so repugnant that although I was strongly tempted to try
    it, I could not muster sufficient courage. The odour of the fruit is so powerful
    that if it is left in a room for a few minutes, the place for some time afterwards
    becomes almost uninhabitable. Those who have overcome the repulsion due to its
    smell declare the fruit to be delicious.![Image](Images/52.jpeg)[THE TEMPLE OF
    BOROBOEDOER.](#009_9781317949527_illustrations.html_ill5-3)After a tedious drive
    of four hours we were much struck, on suddenly emerging in view of this marvellous
    temple, to see its size and grandeur, for although the place is now in a ruinous
    condition, it requires little perspicuity to notice that at one time it must have
    been a magnificent affair. As near as I could guess, it now covers an area of
    five hundred yards square, and a cursory glance at the style of its architecture
    left no doubt on my mind as to the origin of this wonderful place, and the influence
    of the Hindu school of architecture was apparent in a moment. Unfortunately no
    records showing its origin exist, but tradition says it was built by one of the
    old Buddhist kings about two thousand years ago.The tradition referred to is supported
    by the fact that in or about the temple a tablet was exhumed bearing an inscription,
    “Siri Maharaja Mataram,” on it in Sanskrit characters. This would appear to indicate
    that the Maharaja Mataram had built the temple, or was ruling at the time it was
    built. For a great many years the temple was absolutely lost to the world, and
    it is only within the last fifty years that archæologists, having discovered its
    value as a link with the past, have induced the Dutch Government to urge forward
    the exhumation of such a valuable relic. The Dutch Government has now awakened
    to a sense of its duty in the matter, and for the future the safety and maintenance
    of this place, as well as others of a similar kind, is assured.The temple is well
    situated on a mound, the top of which is reached by a flight of steps. Some idea
    of the extent of the temple may be gained by walking around the first terrace.
    In our case this occupied quite an hour, and we found ourselves confronted by
    perhaps the best specimens of stone carving that exist anywhere. This carving,
    with extraordinary fidelity, represented and illustrated in detail the beautiful
    Hindu epic poem of the Mahabharata. The historical details were wonderfully worked
    out, and we were amazed by the very fine state of preservation most of the stone
    pictures were in after hundreds of years of exposure and neglect.![Image](Images/53.jpeg)[SPECIMEN
    OF THE STONE CARVING AT BOROBOEDOER TEMPLE.](#009_9781317949527_illustrations.html_ill5-4)If
    one had an acquaintance with the Mahabharata, it was not difficult to follow the
    story on the stones before him, for there were depicted many of the chief historical
    portions of the poem. Particularly fine were the battle scenes depicted. At the
    head of his army a king rode, in majestic grandeur, on an elephant; following
    him were hordes of men, some afoot, some in war-chariots, all armed with spears,
    swords, bows and arrows, and other weapons of the period. The carvings appealed
    to our imaginations vividly, as they brought home to us with extraordinary force
    and truth every detail of costume, arms, animals, chariots, etc.If one is to judge
    of the degree of civilisation a nation or people possesses by the condition of
    their fine arts, then indeed must the people of India at the time the temple was
    built have been far advanced in civilisation. Nothing could exceed the artistic
    perception needed to conceive the work I have been describing, and it is difficult
    at this period to think that the workmanship and execution could be excelled or
    equalled. The style and, indeed, all in connection with the building of the temple,
    indicate beyond doubt that Indian workmen were imported and employed; and it is
    sad to look back and think of what in those days was achieved, the capability
    for which work was inherent in the people, and compare it with the productions
    of the present day, which lack the artistic touch of the bygone time. Why such
    a glorious art should have been lost to us is, to my mind, mysterious and sad.I
    have described only one tier or storey of this palace of wonders; but it will
    serve for the others (there are four altogether), which, rising tier above tier,
    are reached by difficult steps. The other tiers are all much the same in style
    and character as that I have described. Surmounting the whole, there must have
    been, at one time, a dome, as the place where it rested is easily discernible.
    From the top an enchanting view of the surrounding hills and country is obtainable.
    There, midst the silence, only broken by the twittering of the birds and the sigh
    of the wind, I stood and dreamt of the great past, the like of which, with all
    its glories, will never recur.After lunch at a little rest-house near the temple,
    we wended our way back, and after a wet journey (it poured all the way), we reached
    our hotel at six in the evening. Time just permitted me to change into ceremonial
    dress before a State carriage, sent for me by the Sultan of Djocjokarta, arrived.
    In this I proceeded to the Dutch Residency, where I was received by the Resident
    and his staff. After some conversation in English, he preceded me, by pre-arrangement,
    to the palace of the Sultan, so as to be ready to receive me on my arrival there.
    The palace stands in an enormous walled enclosure, within which the whole establishment
    of about 15,000 lived.On alighting from my carriage at the main entrance, I was
    met by the Dutch Resident and his staff, together with the Sultan’s Ministers.
    Proceeding towards the palace at the entrance of the main courtyard, I was met
    by the Sultan’s sons, who were dressed in Dutch military uniforms with small turbans.
    There a guard of honour, composed of the Sultan’s soldiers (who reminded me irresistibly
    of some of my brother chiefs’ retainers at the Delhi Darbar) presented arms as
    the band played the Dutch national anthem.Going still farther, we finally reached
    a sort of big open pavilion, or Darbar Hall, in which was the Sultan, who received
    me as the Resident doffed his kepi and introduced me by name. The Sultan then
    offered his arm to the representative of the suzerain power, and in this manner
    we entered the pavilion, where we were accommodated with three State chairs. The
    Sultan’s sons and the Resident’s staff were also supplied with seats, but the
    employés of the Sultan squatted on the ground near by.His Highness the Sultan,
    who holds a commission in the Dutch army, was got up in the uniform of a general,
    and appeared with several decorations on his tunic. He is a man of about middle
    age, of pleasing and polite manners, but somewhat reserved. He knows no European
    language; hence everything I said to him or he said to me had to be translated
    by the Resident. After the exchange of the usual polite conventionalities, refreshments
    and cool drinks were served, and I took my departure. The fatigue of the day having
    been great, we were not displeased to retire.![Image](Images/54.jpeg)[HIS HIGHNESS
    THE SULTAN OF DJOCJOKARTA.](#009_9781317949527_illustrations.html_ill5-5)'
