    # 前言


    ![Image](img/3.gif)


    本书的写作主要是为了记录我访问远东的短程，并赠送给我的朋友。它并不标榜文学上的卓越，其设计更多是作为对所见人物和地点事实及个人印象的记录，而不是为了强调我作为作者应该受到公众关注。


    我希望，对于那些正在关注俄日战争进程的人来说，这本书是有趣的，因为它在某种程度上描述了关于后一个国家的一些情况，并简要介绍了满洲和其他地区的一些有趣之处，由于战争，公众的注意力现在正集中在这些地方。迫在眉睫的战争使得我的日本之旅显得格外及时，而研究该国人民也成为了一项异常有趣的活动。


    从旅行者的角度来看，日本也许是世界上最有趣的国家之一；这个国家本身充满了令人愉且多样的风景，而那里的人在相貌举止上有一种在其他地方无处可见的魅力。


    我也访问了中国和爪哇的部分地区；但对于这些国家的人们，我没什么赞美可说的。中国人似乎对目前事件的进展漠不关心；他们似乎没有国家理想，我被这些人明显的个人自私性所震惊，他们之中不存在爱国主义和公共精神。爪哇人是完全冷漠的；他们表现出活力似乎是不可能的。然而，这两个国家都是很有趣且非常值得去。


    与这段记录相比，我唯一的遗憾是，由于我掌握的时间非常有限，我不得不对观察我接触到的不同人的习惯和思想只用了简短且通常不足的时间；这种探索本可以花费一整年的时间。


    现在我剩下的只是感谢我在旅途中各方面所遇到的一如一的善意和好客，并感谢所有帮助我寻找有关我访问的不同地点的信息和细节的人。


    ![Image](img/4.gif)


    卡普尔塔拉，1904 年 12 月 1 日。


