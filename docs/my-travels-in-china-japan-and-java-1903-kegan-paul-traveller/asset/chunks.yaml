    removed our boots and put on house slippers, and then proceeded upstairs and entered
    the room set apart for the purpose of the entertainment. This place was the same
    as all other houses in Japan. It was made of wood, with paper screens to form
    partitions; these screens were made to slide in and out, and by adjustment could
    be made to form as many rooms as desired. The floor was covered with clean brown
    matting, and nothing could exceed the absolute cleanliness of the whole place.At
    one end of the room some cushions were placed for the visitors to sit upon, and
    between each of them a metal or China fire-pot was stood to enable the visitors
    to warm their hands. Soon after we had taken our places, the women musicians put
    in an appearance, and after the usual salutation sat on the ground. Contrary to
    the prevailing idea, the *geishas* do not dance. They play the accompaniments
    only, and the so-called *mykos* do all the dancing. The latter are little mites
    of nine to fourteen years of age. About half a dozen of the *mykos* entered and
    placed themselves in a row facing us, and soon after they commenced their weird
    but graceful dance. This consisted of a variety of pretty movements of the body
    and slow waving of their delicate hands to the accompaniment of the *geishas’*
    music and singing.The *mykos* looked like butterflies in their garments of many
    colours and pretty sashes, while the *geishas* were sombre in their dark costumes.
    At intervals the *mykos* would cease dancing and rest, subsequently resuming.
    The dances represented War, Love, the Seasons of the Year, etc., etc., the interpretations
    being made by the pantomime and gesticulations of the dancers whose mimicry was
    so good as to make this a matter of no difficulty.These miniature dancers were
    absolutely fascinating in their child-like innocence, and resembled dolls more
    than budding women. The *geishas*, I may add, must all be *mykos* before they
    are considered competent to perform the music and sing. I noticed that a number
    of them had disfigured their lips by the too free use of rouge and by blackening
    their teeth, these practices being indicative of extreme coquettishness, in their
    estimation. The performers served refreshments, from time to time, in the shape
    of tea, saki, etc., etc., during intervals of the dance. This novel and interesting
    entertainment enchained me until past midnight. On leaving, with one dulcet voice
    all said, “Sainara,” which means goodbye.![Image](Images/29.jpeg)[A TYPE OF GEISHA.](#009_9781317949527_illustrations.html_ill3-11)On
    the 16th I had lunch with Herr von Erckert, the first secretary to the German
    Legation, and his wife, and subsequently attended a garden party given by Count
    Okuma, one of the so-called “Elder Statesmen.” Such *fêtes* are frequently given
    by the aristocratic members of Japanese society for the purpose, among others,
    of exhibiting their beloved chrysanthemums. Those I saw at Count Okuma’s were
    in no way inferior to those exhibited at the Imperial garden party a few days
    before. The garden was typically Japanese, with the usual characteristic miniature
    lakes, islands, bridges, and dwarf trees. At this party three Imperial Princesses
    and a Prince, besides a large gathering of Tokio society, were present.In company
    with Royalty our venerable host took me for a turn in the garden, and from the
    top of a hillock we obtained a good view of the adjacent country. At four o’clock
    all the guests sat down to a hearty meal. Two tables for Royalty were set apart,
    and at one of them I took my place, with the beautiful Princess Nashimoto on my
    left. She conversed with me in French, and I must confess that the beauty of that
    language lost nothing by her peculiar pronunciation of it. The Princess had been
    married only a short time, and her husband was then in France undergoing a course
    at a military school. The bashful *naïveté*, the manners, and the conversation
    of these Princesses were altogether delightful, and differed wholly from those
    of European ladies. I was plied with questions as to the sights I had seen in
    Japan, and on my mentioning the *geisha* dance, much amusement and laughter were
    the result. The party broke up at five o’clock, and all took leave of their host
    and went home.A ball was given after dinner at the British Legation, so I had
    no time to spare after leaving the garden party. It was a formal affair, and all
    present were in full war-paint. I wore my best Punjabi costume, and this attracted
    much attention, as none of those present had ever seen one before. I entered the
    ballroom in company of the Princesses and the Princes and my host and hostess
    in solemn procession. The European diplomats and Japanese officials, as well as
    the other guests, were collected in the room as we entered, and the sight was
    really a fine one: pretty dresses, uniforms covered with decorations, all made
    up a brilliant scene the like of which is rarely seen in India.![Image](Images/30.jpeg)[HER
    IMPERIAL HIGHNESS PRINCESS NASHIMOTO.](#009_9781317949527_illustrations.html_ill3-12)'
