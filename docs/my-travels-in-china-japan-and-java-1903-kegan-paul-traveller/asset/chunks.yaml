    ![Image](Images/44.jpeg)[TYPICAL JAPANESE TEA-HOUSES.](#009_9781317949527_illustrations.html_ill3-26)


    On our return we saw the great temple called Nishihongwan, one of the newest extant.
    The contrast between this and other places of the same kind was great, owing to
    its newness, which time has not obliterated. I was shown about by a young head-priest,
    who, strange to say, had received about three years education at Oxford. He imparted
    the further information that he had spent some time in India, and was present
    at Delhi during the great Darbar. The 6th was entirely occupied in making an excursion
