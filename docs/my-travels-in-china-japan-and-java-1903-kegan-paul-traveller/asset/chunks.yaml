    of the Author’s Itinerary![Image](Images/7.jpeg)[HIS HIGHNESS AND PARTY.](#009_9781317949527_illustrations.html_illother1-1)MY
    TRAVELS IN THE FAR EAST____________[I](#008_9781317949527_contents.html_chI)[*JOURNEY
    TO COLOMBO*](#008_9781317949527_contents.html_chI)WE left Mussoorie on October
    10, and after spending three days at Kapurthala, to enable me to make a few final
    arrangements, we reached Bombay on the 16th. Leaving that place by the Messageries
    Maritimes steamer *Oceanien* on the 18th, we got to Colombo four days afterwards.
    The steamer was of moderate size only; but as the captain and officers were most
    courteous and obliging, we were quite comfortable. The voyage was almost without
    incident; but during the first two days there was something of a swell on, and
    in consequence my spirits were less exalted than usual: a reclining position,
    however, tended to prevent actual sea-sickness. There was quite a gale blowing
    when we reached Colombo, and it rained heavily; so we were glad to get ashore
    and make ourselves at home, for the time being, at the Galle Face Hotel—a place
    not unknown to me, as I stayed there on my visit to Colombo during the preceding
    March. It is a most luxurious hotel, from which one gets a fine view of the sea
    from two sides. The rain had made the weather quite pleasant and cool, and the
    drives we had in this so-called “Emerald Isle of the East” were more than usually
    enjoyable.On the 23rd we sailed again on the *Ernest Simon* for Singapore. The
    *Ernest Simon*—of about 6,000 tons—is a much bigger and better boat than the one
    we travelled in from Bombay, and she carried a good complement of first, second,
    and third-class passengers. The *cabin de luxe* on the main deck was allotted
    for my use. The comfort and convenience of such cabins is very great, and the
    fact of it being available on these steamers was one of the reasons which induced
    me to travel by the Messageries steamers in preference to the P. & O. The latter
    company’s boats are very good; but the management is never so willing to do anything
    a little bit out of the ordinary run of things for one as is the Messageries—hence
    my preference for the French line. The vessel was not strange to me, as I travelled
    in her once before when I went to Europe in 1898\. Among the first-class passengers
    were good number of French officers en route to French Indo-China; and among the
    second-class lot was a theatrical troupe bound to the same destination. Two or
    three such companies go to the French possessions in the East every year, where
    the people subscribe towards the cost of bringing them out and sending them back
    again; the Government also grants a liberal subsidy. If some such arrangement
    was made in India, we might occasionally have the pleasure of seeing a theatrical
    company worthy of the name.During the first two days out from Colombo the weather
    was again squally; but as I had, by that time, got my sea legs, I did not mind
    it all. For the remainder of the trip nothing could have been finer than the weather
    we had, and the sea was just like a mill-pond.On the 27th we passed some islands
    and got into the Straits of Malacca; on one side of us was Dutch Sumatra, and
    on the other the British Malay States.We arrived at Singapore on the 28th, and
    lost no time in going ashore to have a look about. It is a most interesting place
    to visit, as all the steamers in the Eastern trade touch there. On landing, we
    were much astonished to notice the extraordinary mixture of races there appeared
    to be; besides Europeans and Americans, there were Malays, Javanese, Tamils, and
    a good many Sikhs. Of course, the Chinese predominated; there is a population
    of above 100,000 of that race in Singapore. All these people seemed happy and
    contented under the protection of the flag which covers the “teeming millions”
    of India. In the European quarter there were some handsome buildings to be seen.
    After *déjeûner* and a rest at Raffles Hotel, we visited the Waterworks, which
    are situated on a height commanding a fine view of the city and harbour; thence
    we went to Government House, which is a handsome building situated in a beautiful
    park. We had to be aboard again by two o’clock, as we sailed shortly after that
    hour.It was interesting to see the shipping in the harbour, where ships from all
    parts of the world were anchored. The heat was very trying, but this was not to
    be wondered at, as Singapore is only one degree above the Equator; the weather
    is, moreover, much the same there at all times of the year, and the atmosphere
    is always more or less saturated with moisture, which makes the heat more difficult
    to bear.Cape St. Jacques was sighted early on the morning of the 28th, and shortly
    afterwards we entered the river, which is not wider than perhaps a couple of hundred
    feet or so. On both sides of the river, rice (the staple product there) was in
    full cultivation. We dropped anchor at ten o’clock, and immediately after went
    ashore at Saigon. This was the first French colony I had ever visited: my curiosity
    was consequently at the highest pitch, as I was keen on making comparisons between
    English and French methods of administration. Jinrickshaws and miserable little
    carts were at the landing-place to convey passengers to their destinations; we
    selected one of the latter, drawn by a tiny pony, to take us to the Hôtel Continental,
    where, on arrival, I was horrified to hear that nothing eatable was to be had
    with the exception of cold meat. The reason given was that the shops and places
    of business, as well as the market, were always closed between ten and two o’clock,
    after which they remained open until eight at night. After much difficulty and
    no small amount of persuasion, the French manager turned out a fairly good breakfast
    at midday. The difficulty about meals was, however, not the only one, for I found
    the rooms dirty and the beds so uninviting that it became imperative to look for
    other quarters. We finally succeeded in getting fairly good rooms at a place called
    the Hôtel Olivier.The one big street in Saigon is called the Rue de Catinat. It
    is quite equal in appearance to one in a provincial town in France, and it is
    well arranged with trees on either side; it also has some very fair shops stocked
    chiefly with French goods. Of course, everything was French in appearance, and
    the inhabitants, who were Chinese and Annamese, talked a curious “pidgin” French,
    which I could, with difficulty, understand. Before starting for a drive it was
    necessary to have the driver instructed where he had to go, etc. During the afternoon
    I was surprised to find beautifully laid out boulevards and well-kept roads and
    squares. The place has a number of French residents, most of whom are Government
    officials of sorts; they seemed to be very numerous. The public buildings, such
    as Government House, the Post Office, and the Cathedral are all fine specimens
    of architecture in the French style; they were profusely adorned with statuary,
    and these, as well as the residential villas of the better class of inhabitants,
    are very artistic in appearance. There are also a large number of *cafés* and
    restaurants, the best or most popular of which is the Café de la Musique, which
    is extensively patronised morning and evening. A gipsy band played at odd times,
    and helped to make things cheerful. The whole presented a striking contrast to
    anything we are accustomed to in India. Near by is a theatre—a very handsome building
    which is said to have cost a million francs. During six months of the year a theatrical
    company from France plays operatic pieces, and these, needless to say, are highly
    appreciated by the *habitués* of the place.It was noticeable that every Frenchman,
    from the Governor-General downwards, was dressed in white duck; this costume they
    wore all day and in the evening. The ladies were few in number, and after those
    seen in Paris were disappointing in appearance. A nice breeze made the evening
    pleasantly cool.The next morning we saw the Zoological Gardens, which were beautifully
    arranged, and contained quite a good collection of animals and birds of different
    kinds. On the way to the gardens we passed the barracks of the French troops,
    where a number of marines were also quartered. The barracks are commodious three-storey
    buildings, and appeared to be well adapted to the purpose for which they were
    intended. We also saw a number of Annamese soldiers; but these were an insignificant
    lot and not to be compared to our Indian troops. The total number of French European
    troops in French IndoChina is about 15,000\. The hospital accommodation in this
    place is unusually commodious, and the hospital itself is always more or less
    full, owing to the unhealthiness of the climate for Europeans.In the afternoon
    we drove to the Chinese quarter, about four miles off, where the Chinese simply
    swarmed; they are great traders, and the volume of business they do seems to be
    very large.I wanted to see the internal arrangements of a well-to-do Chinaman’s
    house, so we visited one, and were very politely received. Contrary to my expectation,
    the house was very well kept, and, after its own peculiar style, comfortable.
    We afterwards visited the house of an Annamese nobleman, who was most courteous,
    and deputed his daughter to show us over the place. The daughter was a dainty,
    doll-like girl who spoke French with facility; she explained, in that language,
    all about the different works of art from China, Annam, and Japan, of which the
    house possessed an interesting collection. Her brothers had been educated in France;
    one of them was aide-de-camp to the Governor-General, and had passed through St.
    Cyr, the great military school in France.M. Beau, the Governor-General, invited
    me to see him and dine with him during my stay in Saigon; but being called away
    to Cape St. Jacques, he eventually found it impossible to keep his engagement,
    as he was delayed by a typhoon during his return. Attended by one of my staff,
    I dined at Government House, where, owing to the absence of the Governor-General,
    I was received and entertained by the Assistant Governor-General and the Governor’s
    staff. The house is a very fine one; the entrance hall and the *salle-des-fêtes*
    were quite imposing in their grandeur. After dinner the conversation turned on
    the subject of administration, from which I gathered a good deal of information
    on the interesting matter. We discussed the relations existing between the Suzerain
    power and its so-called neighbouring kingdoms of Annam and Cambodia, which admitted
    of no autonomy, the latter merely receiving suitable allowances with due maintenance
    of respective titles, while the whole administration and the budgets remain entirely
    in the hands of the French residents. On my telling my hosts of the privileges
    enjoyed by the Indian princes under the British, and asking why the nominal sovereigns,
    under the French, had no share in the government of their countries, the reply
    I got was, “Mais ça n’entre pas dans l’esprit français,” meaning, that such an
    idea cannot be grasped by the French mind.The following morning I went to see
    the large college at Saigon. The Governor’s Annamese aidede-camp attended and
    took much trouble in showing me all the classes and explaining all there was to
    be seen. The building was quadrangular in shape, one side of which was reserved
    for the French and Eurasian pupils, and the other for the natives. All the teachers
    are French, and the degree of proficiency attained by the native pupils seemed
    to be very fairly good, as far as I could judge in the short time I spent there.
    At the school I am describing the native pupils are only taught clerical subjects
    to fit them for subordinate appointments; if they desire a higher education, they
    are obliged to go to France to acquire it.On my way to the steamer I had the good
    fortune to have a short interview with the Governor-General, who had just returned.
    M. Beau is said to be one of the most able French administrators, but for one
    of his country his manner was distinctly reserved.In French Indo-China no period
    of office is fixed for the Governor-General; he may be sent for at any time to
    return to France just as convenience and expediency dictate.Our steamer left at
    10 a.m., and so ended our pleasant and instructive sojourn in Saigon.Three days’
    steaming took us to Hong-Kong, at which important place we arrived on October
    5\. The view, on arriving in the harbour, is a very striking one, and it is justly
    said to be one of the finest in the world. The whole harbour is surrounded by
    high hills, which form a perfect amphitheatre, which not only protect the shipping,
    but constitute the most beautiful background imaginable.Immediately after casting
    anchor we went ashore and took up our quarters at the King Edward Hotel, a place
    owned and managed by Parsees, and, I may add, very well managed. Breakfast over
    we went for a drive through Queen’s Street, the principal business street in the
    place. Thence we went to see the Happy Valley, where races are run and polo is
    played; it is an ideal spot for such purposes, and the surroundings are appropriate
    and pretty.I was much astonished to see so many Indians so far from their homes:
    all the policemen are Sikhs, and I was told the local budmashes looked on them
    with terror; one Sikh policeman was estimated to be the equal of ten loafers of
    Chinese nationality.The garrison consists of three English and three Indian regiments,
    such a large number of men being necessitated by the proximity of China proper,
    among other reasons.It is perfectly obvious that the Chinese, who form the bulk
    of the population of Hong-Kong, are considerably better off than are their compatriots
    in China. The Chinese, although very industrious, I must say are as stupid as
    can be imagined; it seemed to be impossible to make them understand what one wanted.
    During my drive we passed the statue of Queen Victoria, and, in order to estimate
    the degree of intelligence possessed by our coachman, I asked him whose statue
    it was. I was amused and astonished when he replied, “Englishman!” On another
    occasion I went to an hotel and selected certain dishes from the menu for dinner,
    and took a lot of trouble to explain exactly what was wanted to the Chinese head-waiter;
    the matter ended by his inquiring if we were dining there!Our steamer was booked
    to leave at five o’clock, but information reached us that it would be impossible
    to leave that day, on account of a typhoon which had been reported as raging about
    two hundred miles outside. This news did not cause us any sorrow as we had by
    no means done Hong-Kong; and it gave us the opportunity of seeing other places
    of interest. For instance, we took the steam tramway and went to the top of a
    hill which must have been 2,000 feet high. On reaching the summit, we found an
    hotel called the “Peak,” which was well situated and commanded a fine view of
    the harbour and the shipping. As the darkness increased, the view at our feet
    became more and more entrancing. Hundreds of lights, which looked like fairy-lamps
    dotted about, twinkled in the twilight; the lights were those of the ships in
    the harbour. The scene was particularly charming, and one not likely to be forgotten.
    The Peak Hotel (a four-storey building) we found very comfortable. Some private
    houses, as well as a house for the Governor, are also situated on the hill, presumably
    on account of its salubrious climate. We dined at the Peak Hotel, and left immediately
    afterwards, much to our regret, as we were obliged to embark, our steamer leaving
    shortly after we got on board. Outside the harbour we met with no indication of
    the typhoon which had been reported; indeed, the sea was as smooth as a lake,
    and remained so for the next two days. Our steamer skirted the coast of China,
    of which we got occasional glimpses; we also passed a number of steamers from
    time to time.[II](#008_9781317949527_contents.html_chII)[*CHINA*](#008_9781317949527_contents.html_chII)ABOUT
    two o’clock on the afternoon of the 8th we reached Woosung, and soon afterwards
    all the passengers were transhipped to a steam launch, in which we ascended the
    river on which Shanghai is situated. Ships of nearly all nationalities were anchored
    in the river, and some American warships attracted our particular attention. Having
    reached Shanghai at about six in the evening, we drove straight to the Astor House
    Hotel, the biggest hotel in the place; but were unfortunate in not being able
    to secure rooms there. Accordingly we went farther afield, and finally got fairly
    good accommodation at the Hôtel des Colonies in the French Concession. The next
    day I went for a drive just to get a general idea of the place. Shanghai is, as
    every one knows, a large commercial city, with a population of 700,000, most of
    which is Chinese. Of Europeans and Americans there are about 8,000; but although
    Europeans of nearly all nationalities lived there, it was noticeable that the
    Anglo-Saxon predominated. As regards its government, Shanghai is probably the
    most curious in the world. At first a stranger is at a loss to know in whose country
    and under whose laws he is living. While Shanghai is actually on Chinese soil,
    its municipality is international, and the people of different nationalities who
    reside there are tried and judged by their own courts. I visited one of the mixed
    English tribunals, where an English and a Chinese magistrate sat jointly and tried
    offenders brought before them. The proceedings were conducted in rotation: that
    is to say, on one occasion a Chinese magistrate will sit with a German; on another
    occasion his colleague will be a Frenchman, and so on. He sits most frequently,
    however, with an Englishman, because of the preponderating interest of the latter
    nationality as compared with other nations.The proceedings of the mixed tribunal
    affect that portion of Shanghai known as the Foreign Settlement only. The city
    of Shanghai proper is under the jurisdiction of Chinese officials only.The English
    magistrate who was sitting at the time of my visit introduced me to his Chinese
    colleague, who, from the fact of his wearing the peacock feather and a necklace
    of some kind of large beads, was a Mandarin of high degree. I was conducted to
    the Court and given the seat of honour on the bench, from which coign of vantage
    I could see and hear all that went on with facility. The arrangements for the
    trial and the conduct of it I found to be most interesting. The culprits were
    brought into court, where they remained in charge of a Sikh policeman; the counsel,
    or pleaders, were English and Chinese, and each pleaded the cause of his client
    in the language of his own country. The magistrates made notes of the case in
    their respective languages, and finally came to a decision, which, before being
    made public, had to be a mutual one. The case tried during my visit was a somewhat
    lengthy one, and I could not therefore wait until its conclusion, as there was
    the prison and other places to be seen.The police is mainly English, Sikhs, and
    Chinese. The French have their own municipality, controlled by their Consul-General,
    under French laws; it goes by the name of the French Concession. There are probably
    not more than four hundred French people in the place.We drove along a road facing
    the river for about three miles, where we saw some very fine and handsome public
    buildings. Thence we went down the Nankin road, where some good European shops
    attracted our attention; there we found a really good assortment of all kinds
    of things one was likely to want. Another fine drive we had took us to the Bubble
    Well road, which skirts the large racecourse and recreation grounds, and is about
    five miles long. Skirting this road are some exceptionally fine double-storied
    residences belonging to rich European and Chinese merchants.During my stay in
    Shanghai I also went to a concert, where I heard a famous French singer, whose
    performance delighted the audience. On another occasion I witnessed a boxing-match
    between the sailors of the English and American war-ships in the harbour. The
    partisans of the opposing sides were enthusiastic in their demonstrations; the
    gathering was an extremely rowdy one, and not to my taste.On the 11th I visited
    the Chinese city which adjoins the foreign concession at Shanghai, which, although
    worth visiting for curiosity’s sake, was so filthy as to take away all pleasure
    from the visit. Words cannot describe the variety and strength of the smells we
    encountered, and we were, perforce, obliged to keep our handkerchiefs applied
    to our noses continuously. The streets were so narrow as not to admit the passage
    of a ’rickshaw, so we were obliged to go a-foot. The chief attraction of the shops
    were the curios they contained; these were great both in number and variety, and
    I could not forego the opportunity of purchasing some. Fixed prices did not prevail,
    and in this respect the Chinaman is the same as Orientals all over the world.
    The shopkeepers were not at all eager to sell, and indeed adopted a somewhat independent
    attitude in their relations towards customers. We noticed some tea-houses as we
    went along, where people were drinking tea out of small cups, without the admixture
    of milk and sugar usual with us; they were seated on narrow benches, and their
    cups were placed on tables. From all I hear, the Chinese system of cookery has
    little to recommend it, and some of their dishes are positively revolting to the
    senses of taste and smell. For instance, I was informed that one of their most
    prized delicacies consisted of a preparation of chicken which was buried for six
    months before being made ready for the table.Another place of the utmost interest
    we saw was an opium den; there we saw people in all stages of intoxication. As
    a sort of recreation, Chinese are known sometimes deliberately to smoke sufficient
    opium to keep them in a comatose condition for days at a time. To see people under
    the influence of the drug is sufficient to convince the most sceptical of the
    degradation engendered by the habitual use of it. During the afternoon Mr. Mansfield,
    the British Consul-General, called on me and took me to the country club, which
    is placed in the middle of a beautiful park. The club is a most extensive place,
    and possesses some very handsome public rooms.Several newspapers—some English,
    one American, one French, and one German—are published daily in Shanghai; they
    partake more of the style of journalism current in America than anything we have
    in India. The papers are full of all kinds of interesting news from every part
    of the world, and they appear to be conducted with all the enterprise for which
    the American papers are renowned. After the prosy news of transfers of officers
    from one station to another (which usually interests only those transferred) and
    the sadly uninteresting news of Indian stations generally, it was quite refreshing
    to find well-conducted, enterprising, and up-to-date journals in this place. At
    night I visited a Chinese theatre, which was indeed an interesting sight. There
    were the usual boxes, pit, etc.; and during the performance the audience drank
    tea and smoked to their heart’s content. A curious way of looking after the comfort
    of the patrons, I noticed, was that waiters went about with warm wet towels, which
    the people used for wiping their hands and faces. The play I witnessed was based
    on Chinese history. Some of the actors danced and sang in a manner somewhat resembling
    that to which one is accustomed in India; their headdresses were very grotesque
    in shape, and their antics reminded one of the “Ram Lela” in Northern India. Among
    the audience were a good many Chinese ladies: they were prettily dressed in garments
    of multifarious colours; they were fair in complexion, but, notwithstanding their
    natural advantage in this respect, their faces were thickly daubed with rouge
    and powder. The practice of binding the girl children’s feet prevails to a great
    extent; the result is that grown women have feet the size of an ordinary child
    of five or six. The distortion is not pretty, and the difficulty in walking is
    most marked.At night the streets presented a most animated appearance; they were
    brilliantly lighted, and almost every other house had an upper floor which might
    be described as a tea-house or restaurant, in which singing-girls chanted and
    danced while the onlookers smoked long pipes, with water in them, and drank tea.
    The common use of tea-houses in China corresponds with the Europeans’ custom of
    taking refreshments at a *café-chantant* or restaurant. In India we have nothing
    of even an approximately similar kind as a means of recreation for the people.
    I think the Chinese are, perhaps, the most conservative people in the world; they
    adhere tenaciously to their ancient habits and costumes, and although many of
    them in this place live under the protection and influence of Europeans, this
    appears to have made no impression on them as far as their habits go. I failed
    to notice a Chinaman dressed wholly or partly in European costume; even those
    who have been converted to Christianity retain their beloved pigtail and original
    costume. Time alone can tell for what further period these people will cling to
    their old-fashioned habits and ways, notwithstanding the all-pervading European
    influence of their surroundings.The Chinese language appears to possess a number
    of variants; the dialects differ to such an extent that people living in one part
    of the country find it difficult or impossible to understand those from another;
    for instance, great divergence is noticeable between the dialects spoken in Canton,
    Shanghai, and Pekin. The “pidgin” English indulged in by some Chinese is very
    droll, and to make themselves understood even the Europeans are obliged to adopt
    it. A common expression is, “You savvey”: the Sikh policemen make free use of
    it. When travelling from one province to another, the servants of Europeans are
    obliged to fall back on “pidgin” English among themselves as a means of making
    themselves understood, so great is the complexity of dialects.Shanghai rejoices
    in no less than seven different post offices—*viz.* English, Russian, French,
    German, American, Chinese, and Japanese. People of these nationalities despatch
    and procure their letters, etc., through their respective post offices, and these
    deal with the mail matter of their own countries only. The reason for all this
    complication is a disbelief in the efficiency of the Imperial Chinese Postal Department.
    We intended to remain for not more than two or three days, and then leave for
    North China and Pekin; but as only small cargo boats were available, and their
    dates of departure uncertain, we were obliged to stay six days.A most interesting
    day was spent in visiting the Jesuit Orphanage and convent at Zikawei, about five
    miles out of Shanghai, in Chinese territory. The convent and orphanage, founded
    by some missionaries about two hundred years ago, is now a most thriving institution.
    The priests, who have adopted the Chinese costume, even to the queue, showed me
    all about the place. The boys are all Chinese Catholics; they study their own
    language, and are taught wood-carving, painting, and sculpture. Some of the boys
    were very busy making a two-storied house, which is to be most lavishly carved
    and decorated, outside and inside, for the King of the Belgians; it is to be erected
    in the Royal Park at Laeken, near Brussels, after being sent there in parts. The
    girl pupils are taught lace-making and embroidery. In one room we saw a number
    of tiny babies who had been rescued from the streets, it being the practice of
    the poor Chinese to abandon their offspring sometimes when they cannot afford
    to keep them.A great library is attached to the convent; it contains several thousand
    volumes, in the European and Chinese languages, relating to the religions and
    literature of the Far East. I also saw the famous observatory near by, which is
    managed by the Roman Catholic priests. It possesses a full complement of scientific
    instruments, and makes meteorological observations for the benefit of the inhabitants,
    and despatches signals to ships, miles away, when they are likely to experience
    bad weather.On our return we saw the outside of the Imperial Chinese College,
    a handsome pile of buildings. The college was founded a short time ago. Its teaching
    staff includes three European professors, and, among other things, the boys learn
    English and French. Upon interrogating the Chinese pupils, we got little satisfaction;
    they did not impress me by their intelligence, and our questions were usually
    answered by a blank stare. The boy’s long, unsportsmanlike garments did not lend
    themselves to English games, and to see the boys playing these was a funny sight.On
    the last day of our stay we saw a great cricket-match, which I was told lasted
    for three days—between Hong-Kong and a local team; there was a large crowd of
    Europeans present, who displayed much interest in the match. After dinner we witnessed
    a very good variety performance by the Shanghai amateurs at a pretty little theatre
    called the “Lyceum,” and then embarked on a small steamer named the *King-Sing,*
    for Tien-Tsin. The steamer was only of about two thousand tons burthen, and sailed
    early the following morning. Besides ourselves, there were not more than half-a-dozen
    passengers; indeed, there was not room for more owing to the smallness of the
    boat. The dining-room had accommodation for ten or twelve persons only. The passengers
    included representatives; of many countries; for instance, there was an Englishman,
    an American, a Russian, and a Japanese on board.The first two days of the voyage
    were smooth and pleasant; but when nearing Chifoo (one of the Treaty Ports of
    North China) the sea became rough, and a high wind began to blow. This made us
    all uncomfortable; the boat rolled and pitched to such an extent as to make sleep
    an impossibility. Early next morning we anchored off Chifoo, where we found the
    cold severe and a high wind still blowing, The sea being too rough for disembarkation
    in the usual way—the vessel being a cargo boat only, and having no special appliances
    for that purpose—we had to make our way ashore in a small boat as best we could.We
    spent the night in a clean and not uncomfortable hotel facing the sea. There was
    nothing of interest to see at Chifoo; the place seemed to be used chiefly as a
    summer resort for the Europeans of North China. The European population of the
    place did not exceed about five hundred. The following day being calm, we left
    Chifoo at ten in the morning; the biting wind rendered it impossible to remain
    on deck, and we were thus obliged to stay in our cabins and endeavour to get warm.
    Next morning saw us at Tangku Bar, but no means of getting ashore presented themselves.
    At noon, the medical inspection being over, a steam launch was procured with great
    difficulty, in which we hoped to go ashore.On going aboard, however, we found
    that it was the intention of the steam-launch people to make a circuit of the
    harbour (an operation of several hours’ duration), in order to pick up more passengers;
    but, having no desire for such an experience, I hired the whole launch, and so
    got ashore in about two hours. On landing, we were disappointed to find that the
    last train for Tien-Tsin had departed, and as the hotel accommodation was indifferent,
    I decided to take a special, which did the trip in an hour’s time. We put up at
    the Astor House Hotel, which was exceedingly comfortable and well arranged.Next
    day I went about the place sight-seeing. There are some good streets in Tien-Tsin,
    and it has the largest foreign settlement in China, with the exception of Shanghai.
    There are eight foreign settlements there, *viz.* English, Russian, German, French,
    Austrian, Italian, American, and Japanese. Of these nations, six maintain troops,
    numbering from five hundred to two thousand in the place. The German probably
    keep up the largest force. It was indeed a curious and unique sight to see the
    soldiers of all the nations mentioned walking about; and the contrast between
    them was most marked. There we saw Germans in their drab-coloured khaki uniforms
    side by side with stumpy Japanese, who bore such a resemblance to our Ghurkas;
    there also we saw Sikhs (of which there are three or four companies) walking about
    as if the place belonged to them.During our drive I stopped in front of the German
    barracks, and with the assistance of my Indian doctor, who speaks German, got
    permission to visit them. A sergeant took us about and showed us the stables and
    quarters of the cavalry, and afterwards the barracks of the Infantry, which formerly
    was the Imperial Chinese College. The men’s dormitories, dining and reading rooms
    were well kept and clean. Upon asking the pay the soldiers received, we were told
    that on foreign service they each got sixty marks a month. The uniforms of the
    German troops, in that part of the world, is made of a greenish khaki stuff; it
    looks smart and workmanlike. The German garrison at Tien-Tsin appears to consist
    of a regiment of infantry, one of cavalry, and a battery of artillery.We left
    Tien-Tsin by the mail at two o’clock. The country we traversed during our journey
    by train was barren and not beautiful; it greatly resembled the plains of Northern
    India. The train, a quick and comfortable one, reached Pekin at 6.30\. The railway
    system of Northern China is now owned by the Chinese Government, but is managed
    by Englishmen in the Chinese service. The French have made a railway from Pekin
    to Hankow, and this they manage themselves. The railways in China were built much
    against the wishes of the people and Government, who feared they would bring ill-fortune;
    nowadays, however, the conservative Dowager-Empress and the Court make use of
    them when necessary. On such occasions the line and stations are cleared of all
    traffic and outsiders.On reaching the capital, we went off in ’rickshaws; a crowd
    of howling and fighting coolies surrounded us, each eager that we would engage
    his particular ’rickshaw, and, to clear a way for us, the German manager of the
    Hôtel du Nord was obliged to make free use of a whip. The hotel is nothing but
    an ordinary Chinese house, badly situated in the middle of the Tartar city, and
    surrounded by lanes possessing an evil odour; the rooms, however, were not bad.The
    morning succeeding our arrival, we went out in ’rickshaws to see a portion of
    the city. Pekin should be called the “City of Chaos and Evil Odours.” There are
    four distinct cities enclosed by high walls: the Chinese city, the Tartar city,
    the Imperial city, and the Forbidden city, the latter being the residence of the
    Court. There is another high wall outside which encircles all these cities, and
    which is about fifteen miles in circumference. There are watch-towers every half
    mile or so, and the walls are massive in appearance and very wide at the top.
    Legation Street (a fine well-kept road) comprises all the different Legations,
    each of which has its own guard of soldiers, generally about two hundred or three
    hundred men. After the recent trouble, it is unlikely that the Legations will
    trust the Chinese to protect them; hence the separate guards. Each Legation has
    a big wall around it, and some have guns mounted in position. The British Legation
    (where I went to call on Sir Ernest Satow) belonged to a Chinese prince; it is
    an elegant place. There are two handsome Chinese pavilions, in which the Minister
    resides. The Russians, Austrians, Italians, and French are building large stone
    houses in the European style; at present they are accommodated in Chinese houses.![Image](Images/8.jpeg)[HIS
    HIGHNESS AND RANI SAHIBA IN PEKIN.](#009_9781317949527_illustrations.html_ill2-1)The
    first morning I went through the Tartar city. The streets are in a shocking condition.
    Of course, there are no carriages, and well-to-do people go about in pretty sedan
    chairs carried by some six bearers, well dressed. The abominable smells and the
    prevailing dirt compelled me to hold a perfumed handkerchief to my nose the whole
    time. The British Minister kindly lent me two of his State sedan chairs to take
    us about. The street scenes were very curious. Here and there one saw a picturesque
    row of Chinese shops and houses with gilded fronts. The modes of locomotion were
    donkeys and carts: the latter looked most uncomfortable, and must have been trying
    to their riders over the rough and stony pavements.Occasionally we came across
    a wedding procession: all the presents, consisting of pieces of silk, furniture,
    vases, and household requisites generally, were carried in front of the bride
    on large trays. Again, we came across a funeral procession: the body of the deceased
    was carried in an elaborately decorated palanquin, followed and escorted by a
    number of the dead person’s friends. The solemnity of the function was greatly
    marred by the corpse-bearers eating apples en route to the burial-place. Women
    also participated in the procession, and their weird cries and wailing were very
    distressing.During the afternoon I visited the famous “Temple of Heaven,” which,
    like every important building in China, is enclosed by a high wall. Inside and
    out the temple is very handsomely decorated in coloured wood. It is to this temple
    that the Emperor goes to pray on certain days, to implore Heaven to intercede
    on his behalf and to avert calamities. On such occasions he fasts all night, and
    in the morning prays at the altar, where sheep and oxen are sacrificed. On asking
    the keeper of the temple if the Emperor had prayed there when the trouble arose
    in 1900, at the time the allied troops attacked Pekin, I was informed, in reply,
    that as soon as the troops appeared in the neighbourhood the Emperor took refuge
    in immediate flight.![Image](Images/9.jpeg)[THE TEMPLE OF HEAVEN.](#009_9781317949527_illustrations.html_ill2-2)In
    the enclosure were a number of other temples, as well as a huge marble pavilion,
    which was used for sacrifices; the latter had no roof. The temple showed every
    sign of neglect; grass was growing even on its steps, and bushes were all about
    the place. It struck me as being curious that, while the people worshipped Buddha,
    the Emperor worshipped Heaven only, and did not follow any particular creed. The
    Chinese believe in Buddha: their moral code they have got from the great reformer
    Confucius; and ancestor worship also forms a strong point in their religion. Distances
    in Pekin being very great, and the methods of conveyance very slow, after seeing
    the temples it was time to return home.The Hôtel du Nord being intolerable in
    the matter of bad smells, I decided to make a change of residence, and accordingly
    went to the Grand Hotel, where the smells were not quite so vile. The next morning
    I visited the Lama Temple, and this itself was worth a visit to Pekin. There are
    a number of other temples in connection with the great one, some of which contained
    huge images of Buddha in different forms and incarnations; the walls and the ceilings
    were most elaborately decorated. One image of Buddha is over sixty feet high,
    and, to get a better view of this interesting statue, we climbed to a gallery,
    from which we got a fine sight of its head. Tradition says that one piece of wood
    only was used in the making of this enormous statue.The walls of the temples were
    covered with Sanscrit inscriptions and pictures of mythological subjects. The
    bronzes and ornaments of jade cloisonné were simply superb. The priests were a
    greedy lot, and pestered me for presents wherever I went; they were all dressed
    in yellow robes. It was my good fortune to be present at the time morning prayers
    were in progress. At certain stages of the prayers the priests joined their hands
    as if in supplication, and at intervals clapped them. The priests squatted on
    the floor and chanted their hymns in a sonorous voice, which reminded me of the
    tone adopted by the Hindu priests in India. The whole ceremony possessed a good
    deal of similarity to the performance of our Hindu ritual.![Image](Images/10.jpeg)[THE
    ENTRANCE TO THE LAMA TEMPLE.](#009_9781317949527_illustrations.html_ill2-3)![Image](Images/11.jpeg)[ALTAR
    IN THE LAMA TEMPLE.](#009_9781317949527_illustrations.html_ill2-4)The Temple of
    Confucius next had our attention; it contained nothing of striking interest, and
    is indeed more of a memorial erected to the memory of a great sage and reformer,
    as are all others dedicated to him, than a place of worship. After lunch at the
    hotel I again went exploring, in the company of Mr. Jones, an excellent Chinese
    scholar, of the British Legation, who took me all about the Imperial city. Notwithstanding
    its grand name, the Imperial city is no better than the one we saw during the
    previous morning. We went up the great drum tower, whence we had a fine view of
    Pekin, and got a better general idea of the place than was possible by other means.
    Two of the gates of the forbidden city or palace enclosure were visible, as was
    a part of the Imperial landscape garden and some pavilions.On leaving the tower,
    I passed in front of some of the State offices, among which I noticed the Board
    of Finance, the Board of Rights, and the Office of Justice, etc. In all these
    places desolation and chaos reigned supreme; dirty stragglers and innumerable
    pariah dogs of uninviting appearance overran these offices. Dogs seem to thrive
    in Pekin, for wherever one went they appeared in large numbers.The same night
    I dined at the British Legation, and was greatly interested to hear details of
    the Imperial Court and the Chinese generally. I was pleased to meet my friend
    Colonel Bower, who was then commanding the British Legation guard.Sir Ernest Satow
    is evidently the right man in the right place in China; his powers as a diplomat
    of the first kind are well known and recognised. To cope with the political situation
    in China—a hot-bed of international rivalries—and to meet the constantly recurring
    international “ incidents,” requires a man of the highest ability and tact: all
    these qualities seem to be combined in Sir Ernest, who immediately gave one the
    impression of strength and of having a thorough grasp of affairs.The small amount
    of insight into politics I was able to gain during my short stay gave me the idea
    that the Russians hold a dominating position in the situation; the British and
    the Japanese, however, form a strong combination, which acts as an effectual check
    on the “ Great Bear of the North.” It was brought home to me, also, that, of all
    the European Powers, the Chinese dreaded the idea of the Russians as their nearest
    neighbour most; and the oddest thing of all to my mind was the ever-present foreign
    soldier of many nationalities and the conspicuous absence of the soldier of the
    country. It seemed almost as if the foreigners were already in possession of the
    country, and the appearance of the very few Chinese soldiers did not impress me
    with an exalted opinion of their apparent soldierly qualities.![Image](Images/12.jpeg)[THE
    ENTRANCE TO THE FORBIDDEN CITY, PEKIN (IMPERIAL PALACE).](#009_9781317949527_illustrations.html_ill2-5)Notwithstanding
    all its glaring shortcomings, the Chinese capital has something attractive about
    it, and the majesty of age was everywhere apparent. I was given much food for
    reflection on seeing, on the one hand, all the evidence of ancient habits and
    civilisation, and on the other to observe the soldiers of the different foreign
    Powers at their up-to-date drill. The incongruity of the spectacle would, if the
    matter were not such a serious one, be laughable; but I can easily conceive that
    when the inevitable struggle takes place, it will not be a laughing matter for
    the Chinese or any of the others concerned. But at the time I visited the place,
    things had more of the appearance of a comic opera than anything else I can think
    of, this idea being forced on one by seeing the soldiers of diverse foreign nations,
    in their different accoutrements, drilling as if they meant real business, and
    by noticing the crowd of Chinese onlookers, who, with imbecile grins, and surrounded
    by the evidence of their own incapacity and apathy, looked on at the workmanlike
    efforts of the foreigners, whose energy the Chinese evidently considered a horrid
    waste of time.The last morning of my stay I devoted to wandering about the different
    Legation grounds, and taking note of all I saw. The barracks of the Italian marines,
    and their wireless telegraph installation, which they use for communication with
    their war-ships at Tongku, interested me greatly. It seemed appropriate that the
    Italians should have the first wireless installation, seeing that it was the now
    famous Italian Marconi who brought the system to its present state of perfection.Subsequently
    I peeped into the barracks of the American soldiers, and there I was met in the
    most friendly manner by all hands. No permission from the commanding officer seemed
    to be necessary before I was allowed to enter; on the contrary, on expressing
    a wish to see the place, the officer of the guard said, “Go right ahead and see
    all you want to.” We promptly availed ourselves of this cordial invitation, and
    were fortunate in arriving just in time to see the change of guards, which was
    effected by bugle call in place of the more usual words of command. The men were
    tidy in appearance, and performed their movements with precision and obvious skill;
    they seemed to be a merry lot, and, off duty, were constantly joking and larking
    with one another. I think the American idea of discipline differs from others;
    and there seemed to be just something about the Americans which engendered the
    suspicion that their soldiers were uniformed civilians.![Image](Images/13.jpeg)[HATAMEN
    GATE, PEKIN.](#009_9781317949527_illustrations.html_ill2-6)After breakfast at
    the hotel we left Pekin by the two o’clock train for Tien-Tsin, and, although
    the place had interested me greatly, I was not sorry to depart. It was a disappointment
    that I had been unable to see the Emperor and the Dowager Empress—not that I had
    an erroneous idea as to his ability as a sovereign, but because I would have found
    it most interesting to have seen a ruler whose Court and surroundings differed
    in every way from the sovereigns who had done me the honour of receiving me in
    Europe.Sir Ernest Satow told me that to procure an audience of the Emperor was
    not unattended with difficulty, as the Court was then staying at the summer palace,
    some distance away. The ways of this Oriental Court are, however, very peculiar,
    and it is not impossible that the British Minister did not wish to place himself
    or his Government under a supposed obligation to the Chinese Government, who,
    had the Emperor received me, would think they were conferring a great honour,
    and would probably have expected something in the way of a substantial political
    consideration in return. The Empress of China is in reality the supreme authority
    in that country, and the Emperor, although ostensibly ruler, is so in name only.
    A few years ago the Emperor, with the assistance of some advanced advisers, desired
    to make certain reforms in the administration of the Empire’s business. The conservative
    party, backed up by the Dowager Empress, did not, however, approve, and therefore
    caused the weak and irresolute Emperor to abdicate in her favour. From that time
    the Dowager Empress has held indisputable sway, and it was no doubt at her instigation
    that the anti-foreign trouble arose in 1900.![Image](Images/14.jpeg)[THE IMPERIAL
    SUMMER PALACE.](#009_9781317949527_illustrations.html_ill2-7)![Image](Images/15.jpeg)[THE
    IMPERIAL THRONE IN THE FORBIDDEN CITY.](#009_9781317949527_illustrations.html_ill2-8)After
    spending a night at Tien-Tsin, I went to see the house of the Viceroy of the province
    of Chi-Li; his name is Yuanshikhai. He is about the only statesman in China who
    realises the grave condition of his country, and who has a real desire to improve
    the economic and political aspect of affairs there, while at the same time preserving
    his position and avoiding offence to the conservative susceptibilities of the
    Dowager-Empress. This Viceroy wields much power, and his position borders on that
    of royalty.In China there are no less than eighteen provinces, and to the head
    of each a Viceroy—who is not a paid official—is appointed. The Viceroy reserves
    to himself a certain portion of the revenues as his remuneration, and is under
    obligation to maintain a certain number of troops for the service of the Imperial
    Government whenever they may be required. The amount of a Viceroy’s income can
    be pretty fairly gauged by the number of men they retain; for instance, the Viceroy
    Yuanshikhai keeps up a force of fifty thousand men, and these are said to be the
    best soldiers in the Chinese Empire. They have been trained by German officers,
    and at present Captain Menzies, an Englishman, is the Viceroy’s military adviser;
    it was this officer who kindly showed me about the Viceroy’s “Yamen,” or official
    residence. We first went through two large quadrangles. At the entrance to the
    first there were a large number of elaborate sedan chairs waiting for the Mandarins,
    and ponies were saddled and ready for retainers. Several soldiers were also present
    at the different gates, and there was a continuous going and coming of high officials,
    whose lovely silk garments made them quite conspicuous, as also did the peacock
    feathers with which their hats were adorned.The scene was distinctly Oriental
    in appearance, and bore some resemblance to a few of the old palaces in India;
    nevertheless, it had a distinctive character of its own, and could not be compared
    with anything of the kind elsewhere. A large, lofty reception-room full of chandeliers
    was shown to me, in which were a number of high officials, who, on meeting, after
    the Chinese fashion, bowed very low and shook their own hands; they were waiting
    for a grand council meeting (at which the Viceroy was to preside) to begin. A
    hint from the English officer who accompanied me, to the effect that foreigners
    were not always welcome on such occasions, caused me to curtail my stay in this
    very interesting room.Next I visited the Viceroy’s son, a young man of about eighteen,
    who spoke English rather well. He received me in a small drawing-room furnished
    after the European fashion, and I found the visit a pleasant one.On arriving at
    the station, I was met by a deputation of Sikhs, who presented an address. These
    men had all gone to China in connection with the Indian garrison there, in one
    capacity or another, and they were anxious to build a Sikh temple, as they had
    no place of worship. I was asked for a donation towards the fulfilment of their
    desire, to which request I acceded.Shanhaikwan was our next stopping-place, for
    which we left Tien-Tsin at ten a.m. The weather was bitterly cold and changeable
    to a degree: a normal spell would almost certainly be followed by a sudden change
    of temperature, due to the icy cold wind which blows from Siberia.Shanhaikwan
    was reached in the evening, and an agreeable surprise, in the shape of a decent
    hotel, awaited us. The hotel was run by an Englishman, who provided excellent
    food, etc.The following morning was so bitterly cold that anything in the way
    of sightseeing was quite impossible, so we did not venture out.At Shanhaikwan
    there are some foreign troops; the Germans, French, Japanese, and Russians have
    each two companies of soldiers stationed there, and a portion of the 30th Punjab
    Infantry from India was in evidence. Some of the native officers of the latter
    regiment came to see me; one of them turned out to be a subject of mine from the
    village of Dhilwan. The opinions of these officers as to the quality of the foreign
    troops they were quartered near were very entertaining, and I derived considerable
    amusement from the visit. The number and strength of the foreign Powers represented
    in different parts of China astonished these Indian officers, who, up to the time
    of their arrival in China, were unaware of the existence of most of these great
    Powers. The Indian officers had a poor opinion of the Russians, but of the Japanese
    they spoke highly, and they seemed to be on the best of terms with them.![Image](Images/16.jpeg)[THE
    GREAT WALL OF CHINA.](#009_9781317949527_illustrations.html_ill2-9)Later in the
    day a Russian officer called on me; he was a most clever man, and spoke nearly
    all the European languages, as well as Persian, with fluency and facility. In
    his company I went out and inspected a portion of the famous wall of China, which
    was built about two thousand years ago, as a means of protection against the Tartar
    invaders. It is said be two thousand miles long, and it appeared to be about fifty
    feet high, while in some places its width, at its top, is sufficient to enable
    a carriage to be driven on it. There being a number of Mohammedans in China, I
    was curious to see one of their mosques, and was fortunate enough to get a chance
    after my inspection of the Great Wall. I was disappointed to find that the so-called
    mosque was no more or less than an ordinary Chinese house with a few Arabic inscriptions
    on the walls indoors. The officiating Mullah, on being asked to read some passages
    from the Koran, was almost unable to do so, and in common with other Chinese Mohammedans,
    he was not distinguishable from the mass of the people. The Mullah showed me the
    Imperial Government permit by virtue of which the Mahommedans were allowed to
    worship after their own fashion. I inquired why the pigtail was worn by the Mahommedans
    in China, and was informed that it was done out of deference to the custom of
    the State religion and the habit of the people of the country. In China the cutting
    of a pigtail is looked on with the utmost condemnation; it is indeed a penal offence.From
    the mosque, I proceeded to a fort occupied by some Cossacks. The officers (who
    received me with the courtesy for which Russian officers are well known) told
    me that they were originally sent there for a couple of months only; but three
    years had passed since then, and there seemed no probability of their being relieved.Early
    the next day we departed from Shanhaikwan, and, as there was no restaurant car
    attached to the train, we had to make shift for breakfast as best we could by
    having a scratch meal prepared in my saloon. Apart from some low hills in the
    distance, the country we passed through was quite flat. The population in that
    part of the world seemed to be very dense, and the villages almost touched one
    another, they were so close together. The houses were mostly of stone or brick,
    but some belonging to the poor people were made of mud. The peasantry in those
    parts possessed a much better physique than those of the south, and they appeared
    to be better clad and fed. I noticed that all the carts were pulled by donkeys,
    as also were, in some places, the ploughs. Pork seemed to be the staple meat food
    of the inhabitants, but they were not above eating an ox which had died from sickness
    or other causes; otherwise the Chinese do not eat beef, as they find the animal
    too valuable to be slaughtered for food only.Newchwang was reached at seven in
    the evening; but, after alighting from the train, we were obliged to cross a river
    in a steam launch, and this occupied twenty minutes. An indifferent sort of hotel
    was the only accommodation available. The people of that part of China are known
    as Manchus, and it is from them that the present Imperial dynasty sprang.The occupation
    of Manchuria by the Russians was engaging the serious attention of some of the
    European Powers, as well as Japan, the reason being that numerous promises had
    been made by the Russians, from time to time, to evacuate the place; but these,
    on one excuse or another, had remained unfulfilled. In the first place they brought
    troops for the ostensible purpose of suppressing the so-called “Boxer” rising;
    then they remained on the excuse of protecting their Manchurian railway; subsequently,
    when further protests were made, other reasons were put forward for continuing
    the occupation. It seemed probable that Russia would never willingly evacuate
    Manchuria, owing to her great interests in that country, and owing to the enormous
    expense she has sustained for building the railway. Russia then maintained a force
    of about a hundred thousand men in Manchuria, which has since been largely added
    to.The Government of the country was nominally in the hands of the Chinese Viceroy;
    but in reality the latter was under the thumb of the Czar and his Viceroy Alexieff,
    who ruled with a rod of iron—so much so that a rumour obtained credence lately
    to the effect that the Russian General at Mukden (the capital of Manchuria) put
    the Chinese Viceroy in prison for daring to do a certain thing contrary to his
    wishes.The province of Manchuria is rich in mineral wealth, and possesses some
    gold and other mines; it is also one of the most fertile places in China, and
    under the Russians or Japanese will doubtless develop greatly.Leaving Newchwang
    during the afternoon, we again crossed the river in a launch, and for the first
    time saw the Russian Eastern Chinese Railway. After about an hour’s run we alighted,
    and had the interesting experience of seeing the Trans-Siberian train arrive from
    Europe. The latter railway was then open its whole length, and, in Europe connects
    with the old lines at Moscow, from Paris, Berlin, Vienna, and St. Petersburg.
    It is said to be the longest line in the world, and was built entirely by Russian
    capital and labour—a performance of a marvellous character, and one of which the
    Russians have reason to be proud. The railway, of course, vastly increases the
    Russian prestige and power in the East, as by its means she can pour enormous
    numbers of troops there in the shortest possible time. Whereas formerly the journey
    from London or Paris took thirty-five to forty days by steamer to China or Japan,
    by means of this wonderful railway passengers and mails were being delivered in
    eighteen to twenty days. This comparison strikingly illustrates the tremendous
    value of the railway to Russia from the strategical point of view as well as for
    the economical conveyance of passengers, goods and mails.The train itself was
    splendidly equipped with every imaginable luxury, even to a piano. Well-furnished
    sleeping and dining cars were attached, and the dinner, by the way, reminded one
    forcibly of that procurable in a first-class restaurant in Europe. Early next
    morning we arrived at Dalny, the terminus of this gigantic railway, and were at
    last in Russian China. The secretary to the Governor of Dalny received me at the
    station, whence we drove in a Russian “droshki” or carriage to the hotel. These
    droshkis were in common use in Dalny, and all had Russian coachmen. The capacity
    of the droshki to negotiate bad or uneven roads, or no roads at all, has to be
    experienced to be credited.The hotel we put up at was fairly good. The food supplied,
    although essentially Russian, was not bad; but there, as at all other places held
    by Russia, the value of ordinary water was at a premium. The use of a bath was
    not clearly understood, and with difficulty I succeeded in getting one only during
    my three days’ stay. Jugs of hot water were looked on as luxuries, and were charged
    as extras in the bill!![Image](Images/17.jpeg)[DALNY HOTEL.](#009_9781317949527_illustrations.html_ill2-10)![Image](Images/18.jpeg)[A
    STREET IN DALNY.](#009_9781317949527_illustrations.html_ill2-11)Three years ago
    the territory we were then in was acquired from China, and in that short time
    the progress made was really wonderful. Tremendous activity prevailed everywhere:
    fine streets lined with handsome stone buildings had sprung up, and miles of roads,
    public buildings, etc., were under construction all about the place. The houses
    of the Government servants were substantial, good-looking villas, which bear a
    striking contrast to those provided for the use of our Anglo-Indian beaureaucracy.M.
    Sakharoff, the Governor, came to see me, and invited me to lunch with him at one
    o’clock, or, as it is called there, dinner. I did not venture to drink the favourite
    Russian spirit vodka; but I enjoyed all the other things, cooked in the Russian
    style, which were set before me. The governor, of course, spoke French, so we
    got on very well together. I found him very polite and hospitable, as indeed were
    all the Russian people with whom I came in contact. I am doubtful, however, from
    what I have been told, if they are as pleasant to deal with when one has official
    business to transact with them.The governor’s residence was a new, well-appointed
    villa, finished recently. After lunch he was good enough to take me for a drive,
    during which he showed me the Russian warships (among the biggest in the world)
    lying a few miles off. The battleships and cruisers numbered about twenty, and
    there were a large number of smaller vessels, torpedo boats, etc., in addition.
    These vessels, as well as about 200,000 men, were under the command of Admiral
    Alexieff, who was recently appointed the Czar’s Viceroy of the Far East. He is
    said to be one of Russia’s foremost statesmen; at the time of my visit the Admiral
    was directing the naval manœuvres, so I had no opportunity of meeting him. It
    is fairly evident that all these warships, troops, etc., were intended to fight
    Japan, and this conflict will decide if the latter Power or Russia is to be supreme
    in the Far East.My intention was to have left on October 28 for Japan, but there
    was a great muddle about the date of the steamer’s departure, and I found it almost
    impossible to obtain definite information on this point. However, I finally discovered
    that the steamer sailed on Saturdays only, and this was a great disappointment
    to me, as I feared the delay would prevent me from being present at the Emperor
    of Japan’s birthday festivities at Tokio on November 3, which I had been looking
    forward to. It seemed odd that in China one could never get really reliable and
    definite information on any subject.Having two additional days at my disposal,
    I availed myself of the opportunity, and went to see Port Arthur (in company with
    the Governor’s aide-de-camp), which place we reached in about three hours. The
    magnificent new hotel was not completed when we arrived; but as the Commissioner
    of Police very kindly placed his house at our disposal for my short stay, and
    as police officers and men were in attendance, we lacked for nothing.The military
    element in Port Arthur predominated, of course: everywhere one saw officers in
    smart uniforms (which they wear on all occasions); Cossacks in Astrakhan caps;
    troops marching about; cavalry galloping by—all was bustle and military activity.
    The garrison of Port Arthur amounted to about 50,000 men, who, although strong
    and workmanlike, were not clean in appearance, and these were continually being
    trained in landing exercises, resisting sham attacks by the fleet, etc., etc.About
    a fortnight before my arrival a great sham fight took place, in which 75,000 men
    and all the warships took part. Nearly all the surrounding hills were strongly
    fortified, and some very heavy ordnance was mounted on them, hundreds of long-range
    guns of recent patterns being in position. It was not permitted that outsiders
    should make close inspection of the fortifications; but the Russian officer who
    accompanied me took me up a hill, from which an excellent idea of the defensive
    works generally was obtained. All this has been evolved from a little strip of
    land which the Russians got on ninety-nine years’ lease of occupation, merely
    to provide a little shelter for their ships and as a coaling station! I was requested
    not to stay too long a time near the forts, and to be careful not to take snapshots
    of what I saw!I got an outside view of the Viceroy’s palace, and listened for
    a time to a military band which was playing in a public garden, where the fashion
    and beauty of Port Arthur were promenading. After an excellent dinner in a Russian
    restaurant, I saw a circus performance by a Russian troupe, and this I found better
    than anything of its kind I had ever seen in India. Subsequently I went to a *café-chantant,*
    which was full of Russian officers in full uniform with swords, who were nearly
    all in the company of women of a certain class who had accompanied them from European
    Russia. If an English officer in uniform was seen in public in such company, he
    would be immediately dismissed; Russian ideas of propriety differ, however.Late
    hours at Port Arthur, as in all other Russian places, was the fashion; people
    seemed to sit up all night enjoying themselves, and got up at a correspondingly
    late hour the following day, thus making it impossible to get anything done or
    to see any one before midday. The day after I returned to Dalny, and as Port Arthur
    had fatigued me greatly, I did not go out all day.The language difficulty we found
    to be a real one, and we had the utmost trouble in making ourselves understood,
    particularly by the servants. Some of the officers and those of the better class
    occasionally spoke French, German, or English.At noon on October 31 we embarked
    on the s.s. *Argaon* of the Russian line of the Chinese Eastern Railway. This
    boat turned out to be a comfortable and well-appointed little vessel of about
    two thousand tons: the dining and smoking: rooms were commodious and comfortable.
    The officers were all Russians, but the passengers seemed to be of all nationalities.
    We were fortunate in having lovely weather, and two days out we passed some low
    rocky islands belonging to Korea.[III](#008_9781317949527_contents.html_chIII)[*JAPAN*](#008_9781317949527_contents.html_chIII)ON
    November 2 the land of Japan was sighted, and at noon we anchored in the beautiful
    harbour of Nagasaki. My first impressions of Japan were indeed favourable. The
    harbour was one of the prettiest I had ever seen; hills surrounded it on three
    sides, all of which were well wooded and pleasantly green. The weather, too, was
    delightful, and reminded one of the Punjab in November. Ships of all nations were
    lying in the harbour. The whole scene, both as regards surroundings and climate,
    formed a vivid contrast to that we had been accustomed to for the past few weeks
    in North China, and we found the change very acceptable.Soon after the formality
    of a medical inspection had been concluded, we went ashore and put up at the Nagasaki
    Hotel, which we found in all respects a desirable place to live in. The day following
    our arrival was the Emperor of Japan’s birthday; in honour of this all the ships
    in the harbour were bedecked with bunting, and the warships fired salutes. In
    company with Mr. Layard, the British Consul, I went to call on the Governor at
    his official residence, to present my congratulations and good wishes on the occasion
    of his Sovereign’s birthday.This official was greatly perplexed as to the proper
    manner in which to receive me, and was profuse in his apologies because of his
    not having gone to see me first: preparations in connection with the Emperor’s
    birthday festivities had prevented him; but notwithstanding this, he insisted
    on adhering to the strict formality usual in such cases. The difficulty was got
    over in a rather novel manner by my being asked by the Governor’s secretary to
    consider one of his sitting rooms as my own in which he would come and pay the
    customary call of formality; this was done, and so the matter ended satisfactorily.The
    Governor was attired in a gorgeous uniform, the breast of which was covered with
    decorations. His nervousness was very marked; indeed, he became so overcome that
    he forgot his English (which ordinarily he spoke well), and was obliged to appeal
    to the British Consul to act as interpreter! The exchange of a few complimentary
    phrases terminated the interview, and the Governor departed. The Consul asked
    me to say nothing about the Emperor’s birthday on the occasion of the Governor’s
    pretended visit to me, but to reserve a reference to it until I paid the return
    visit a few minutes later. This advice was adopted by me, and we all drank the
    Emperor’s health shortly afterwards in extra sweet champagne.Lunch at the hotel
    being over, we left immediately after, by train, for Shimonoseki, en route to
    Kobe and Yokohama. The Governor and some other officials went to the station to
    see me off. The railway by which we travelled was of narrow gauge, as all railways
    are in Japan; the carriages had seats running parallel their whole length, and
    were fairly comfortable. Naturally, having heard so much of Japan, everything
    we saw was full of interest to me, and I was busy the whole time making mental
    notes and comparisons. I found considerable resemblance in the country we passed
    through to some parts of Italy and France, and every now and again our train skirted
    the sea-shore. The villages were most picturesque, and there seemed to be very
    little interval between them, thus showing the country to be thickly populated.
    I noticed that all the houses in the villages, as well as the station buildings,
    were constructed of wood. It was most interesting, at the large stations we stopped
    at, to watch the crowd coming and going, and to notice the peculiar noise they
    made as they walked along on their wooden-soled clogs. With the exception of the
    railway officials, few or none wore anything but the usual Japanese costume, plus
    a European hat.At 10 p.m. we reached Moji, where we were met by the British Consul,
    the mayor of the city, and some police officers. Having arrived at the terminus
    of the line at the end of the southern island, we were obliged to cross the strait
    in a ferry-boat to Shimonoseki, where we spent the night in the railway hotel
    with much satisfaction to ourselves. The hotel management was entirely Japanese,
    and for real comfort, cleanliness, and good service the hotel is not to be beaten
    anywhere. Moji is a small, well-maintained provincial town of no special interest.The
    following day, after seeing a portion of the town, we resumed our journey by railway,
    from which we got a fine view of the famous inland sea of Japan, of which I had
    heard so much. It struck me as being peculiar that Nature should have made the
    islands of Japan, and then have made an inland sea, and have dotted it here and
    there with thousands of islands; but Nature has done things in Japan which she
    has not done elsewhere!The scenery continued to be of the most exquisite kind,
    and our train took us in and out of lovely valleys, and emerged every now and
    then into view of this enchanting sea. After darkness set in, it became still
    more attractive, and the moon added quite a sentimental touch to the whole surroundings.
    I dined and slept in a reserved saloon, and after a comfortable journey reached
    Kobe the next morning at eight o’clock. Kobe is one of the biggest treaty ports
    in Japan, and appears to be a thriving and prosperous town. It is prettily situated,
    surrounded by high hills. The European quarter has some fine streets and modern
    places of business, as well as hotels.Leaving Kobe at one o’clock, our train took
    us through pretty scenery, from which we got a good idea of the real country of
    Japan, until we reached Osaka. This place has been termed the “Manchester of Japan,”
    probably because of the numerous manufactories there. That it is essentially a
    manufacturing town is evident from the large number of chimneys seen about the
    place, and we were interested to notice a lot of curious-looking advertisements
    of fantastic design dotted about the fields bordering the railway. This method
    of advertising has probably been imported from America, where it flourishes.The
    ancient capital, Kioto, was our next place of halt; but as I visited it on my
    return journey, when I had more time at my disposal, I will refrain from giving
    any description just now. I was agreeably surprised to find at all the principal
    stations, that the governor, or his first secretary, and an inspector of police,
    were on the platform to receive me, In each case they handed me their card, on
    which their name was written in Japanese, and sometimes in English or French as
    well. Their demeanour was most respectful, and their bows of the most profound
    kind; in all cases they remained motionless and uncovered until my train was well
    out of the station. The Japanese even excel the French in politeness. The complete
    absence of noise and confusion at the stations was very noticeable features, and
    in this respect they compared very favourably with what one is accustomed to in
    India. The arrangements for the supply of food and refreshments to the passengers
    were excellent; hawkers went about the platforms selling rice, fish, eggs, bread,
    etc., which they dispensed in neat little wooden boxes. Sake (the spirit of the
    country) and beer were also sold, and, in fact, one could purchase a whole meal
    at an exceedingly low cost.After a night in the train we reached Yokohama, where
    I was met by the British Consul, with whom I drove to the newly rebuilt Oriental
    Palace Hotel. This hotel did not belie its name, as I found it indeed a palace,
    and certainly the most luxurious caravanserai of its kind I have ever stayed at
    east of Suez. Two experienced Frenchmen managed the hotel; their long residence
    in that part of the world gave them the control over local conditions essential
    to success, and we had nothing to find fault with. The cuisine was genuinely Parisian;
    our rooms had a charming outlook over the harbour, in which ships of all nations
    were riding at anchor.Amidst these delightful but non-Japanese surroundings we
    passed nine pleasant days. On November 7 I went to Tokio for a day only, as I
    desired to see Sir Claude MacDonald. We reached there in less than an hour. After
    arriving, I immediately called on the British Minister, Sir Claude MacDonald,
    whose suavity and charming manner instantly put me at my ease, and removed any
    suspicion of stiffness during our interview. His Excellency was the hero of the
    great siege of Pekin during 1900, as it was in the enclosure of the British Legation
    that the foreign Ministers and residents took refuge during that troubled and
    dangerous time. I am much indebted to Sir Claude for his kind assistance and advice
    during my stay in Japan.The British Legation is a commodious double-storied building,
    and stands opposite the Imperial Palace and grounds. In celebration of King Edward’s
    birthday, Sir Claude and Lady MacDonald gave a garden party that afternoon, to
    which the *élite* of Yokohama and Tokio was invited. European and Japanese society
    was amply represented, and for the first time I met some of the leading foreign
    and Japanese Ministers, as well as a number of the naval and military element
    of all nations. The Japanese Ministers all wore European frock-coats and top hats,
    in which they looked supremely uncomfortable; the Ministers were extremely polite,
    but were obviously ill at ease in their adopted Western garb. To get on well with
    these representatives of Japan, one’s linguistic abilities must necessarily be
    of a high order, for some of them spoke, apart from their own language, nothing
    but French; others spoke English, but no French; others, again, spoke German,
    but neither English nor French. The reason for this is simple, and lies in the
    fact that the acquirement of the language spoken depended on the country to which
    the possessor went for his education or training. The Japanese early adopted the
    plan of sending their men to certain countries for the acquirement of a subject
    for which that particular country was famous; hence the necessity for their men
    going to different countries arose, thus accounting for the multiplicity of languages
    heard at the garden party, and, indeed, everywhere one meets Japanese who have
    studied abroad.![Image](Images/19.jpeg)[SIR CLAUDE MACDONALD, K.C.M.G.](#009_9781317949527_illustrations.html_ill3-1)Among
    some of the notable men with whom I conversed on this occasion were Count Katsura,
    the Prime Minister; Baron Komura, Minister of Foreign Affairs; Viscount Tanaka,
    Minister of the Imperial Household; Admiral Togo; General Oku, who attended the
    Delhi Darbar; and last, but not least, the Grand Master of Ceremonies at the Imperial
    Court, who plays a predominating part in all the Court functions. The name of
    the Grand Master of Ceremonies is Baron Sannomiya; he was particularly obliging
    and courteous to me, and whenever I required it he was ever ready to render me
    all assistance possible. The Baron was a past master in Court etiquette, and this,
    in a country where ceremonious observances are the salt of life, means a great
    deal.On this occasion I had the good fortune to meet and be presented to some
    Japanese ladies. A number of them were arrayed in European costume, while others
    had the good sense to adhere to their native style of dress, which, I am bound
    to admit, suited their particular style of beauty much better than the latest
    creations of Worth or Paquin. European ladies’ dress, to be seen at its best,
    requires a certain kind of figure, a certain carriage, and a certain gait on the
    part of the wearer, and these things Japanese ladies do not possess.I observed
    also that the European foot-gear which some of them had adopted make them walk
    in an extremely constrained manner; naturally Japanese women walk with their toes
    turned in, and this practice seems to accentuate the clumsiness of their gait
    when European shoes are worn. The ladies were very shy, and kept much to themselves;
    when I addressed them the answer was usually a monosyllable, uttered in a very
    gentle voice, “Oui” or “Yes,” accompanied by a little giggle and a bow. Even among
    themselves there was no familiarity; on the contrary, they were distant and ceremonious
    in their attitude. When greeted by one of their own country-men, bows were exchanged,
    always with the hands touching the knees, and these were repeated whenever a remark
    was made or the usual compliments passed. Shaking of hands is not practised among
    the Japanese.![Image](Images/20.jpeg)[BARON SANNOMIYA, GRAND MASTER OF CEREMONIES.](#009_9781317949527_illustrations.html_ill3-2)An
    informal dance terminated the proceedings, and after two hours, full of interest
    and novelty, we took our departure, bidding our host and hostess good-bye, and
    went by the five o’clock train from Shinbashi, which was crowded with people,
    among whom were many of the guests from the garden party. The weather had become
    so chilly that warm overcoats became a necessity.The temptation to indulge my
    hobby for shopping the following day proved irresistible, and there seemed to
    be every excuse for it, as the shops were crowded with attractive things of local
    manufacture. There I found lovely ivory carvings; lacquer work; cloisonné on gold,
    silver, and copper; work inlaid with mother-of-pearl; silk embroideries; porcelain,
    etc., etc. I was told, however, that the best of such things were to be had at
    Kioto, so I restrained the temptation to buy many articles for the time being,
    and purchased a moderate quantity only.Subsequently I paid a visit to the *Oregon*,
    one of the crack United States cruisers. The officers were very civil, and showed
    me everything worth seeing. Among the marines I observed a number of muscular
    negroes, and was told that no matter how competent they might be, they were never
    promoted to commissioned rank. Such a condition of affairs in a nation which made
    the supposed “equality of man” a fundamental principle of their constitution makes
    one tremble for the future. Will the negro always tolerate being told of his equality
    with the white man at a time when votes are being sought for, and be forever kept
    out of appointments which he may be able to qualify for, only because God made
    him black?![Image](Images/21.jpeg)[A JAPANESE MAIDEN.](#009_9781317949527_illustrations.html_ill3-3)Afterwards
    I went for a short cruise around the harbour, during which I saw a number of warships
    belonging to England, France, Germany, Austria, and Italy. These interested me
    greatly.Being unwell the next day, I did not venture out, but had the pleasure
    of receiving a return visit from the British Minister.The 10th was the day of
    the great race-meeting, to which I went, and had lunch on the race-ground with
    M. Harmand, the French Minister, the Count de Perigny, and some other Frenchmen.
    The racecourse is beautifully situated, and commands a fine view of the Bay of
    Tokio and the surrounding hills. The grand-stand was crowded with the *élite*
    of the European and Japanese society; the racing, however, was, although fairly
    good, not up to that one sees at Lucknow or Calcutta. The most coveted prize,
    the Emperor’s Cup, was won by the Count de Perigny and M. Roonen, both Frenchmen,
    who were joint owners of the winning horse. It was presented to them, in the Emperor’s
    name, by the Baron Sannomiya, to the usual accompaniment of numerous banzais,
    which in English means “Hurra.” On my return, I looked in at the United Club—a
    fine, well-equipped club, probably the best in the East. I was made a member for
    the time of my stay in Yokohama.On the 11th I made an excursion by train to Komakura,
    where we arrived after an hour’s delightful journey through beautiful scenery;
    the autumn tints on the trees and foliage were strikingly beautiful, and the sight
    was perfectly glorious. Half an hour’s drive in a ’rickshaw brought us to the
    main temple. The figure of Daibutsu or Buddha was of enormous size, in the open
    air, so much so that we were able to climb, by means of a ladder, into its interior,
    where there was a shrine. The figure of bronze, said to be one of the finest works
    of art in Japan, sits cross-legged, in an attitude of meditation.Thence we went
    to see another, but smaller temple, and then proceeded in ’rickshaws to a place
    called Enoshima, which is a famous summer resort. The place is really an island,
    joined to the mainland by means of a long wooden bridge. We climbed up a stone
    pavement and went through a long narrow street, in which were all kinds of stones
    and shells, made up into useful forms, exposed for sale at trifling prices. A
    tea-house perched on top of a hill attracted our attention, so we went in and
    had tea. On entering, we were greeted by the women attendants in the fashion usual
    in the country, that is by kneeling and touching the ground with their foreheads.
    Their delightful manners and sweet smiles, coupled with the beauty and peacefulness
    of the scene, made us quite reluctant to leave for Yokohama. Our return to the
    latter place was partly performed by electric car and partly by train.![Image](Images/22.jpeg)[THE
    DAIBUTSU AT KOMAKURA.](#009_9781317949527_illustrations.html_ill3-4)I spent a
    portion of the 12th in revisiting the attractive shops, from which I found difficulty
    in keeping away, and during the same night I attended a ball at the hotel, which
    was a fine sight. The band of the French flagship in harbour supplied the music,
    and I think there must have been quite five hundred people, of all European nationalities
    and Americans, present.The next day was the date fixed for the Empress’s chrysanthemum
    garden party—one of the two great Imperial garden *fêtes* given annually. The
    other is held in the spring. An invitation for this *fête* reached me in due course,
    and I was interested to observe that it was written in the Japanese language,
    with an English translation, to the effect that if it rained on the date appointed,
    the entertainment would be held the day following; and if it rained on that day,
    the party was to be abandoned. The invitation bore the Imperial crest, which consists
    of a sixteen-petalled chrysanthemum, of a very simple design.The morning of the
    *fête* was cloudy; but fortunately the sky cleared up by noon, and we reached
    Tokio in time to lunch with Sir Claude and Lady MacDonald, in whose company we
    proceeded to Asakusa Park. At the entrance gates police and military guards were
    posted, and we noticed serried rows of carriages and ’rickshaws standing. We were
    politely requested to leave our overcoats at the door, after which a ten minutes’
    walk on a gravelled road brought us to a square, where chrysanthemums of all shades
    of colour and in bewildering variety were exposed. There we saw Japanese Ministers,
    foreign representatives, military and naval officers of all nationalities, globe-trotters
    bearing letters of introduction from their respective Legations, men of science,
    literature, etc.The park, a very extensive place, contained huge trees, lakes
    with pretty islands, on which pavilions were built, and which were connected to
    the other portions of the park by means of miniature bridges, and many other attractive
    features. The maple trees, with their deep red yellow and other tints, were then
    at their best, and presented a lovely spectacle. We had scarcely time to take
    in all the lovely sights about us before a hush, which was indicative of the Empress’s
    approach, became noticeable. The military bands then struck up the somewhat melancholy
    Japanese National Anthem, upon which all those wearing hats immediately uncovered:
    our turbans of course prevented us from showing similar outward respect.![Image](Images/23.jpeg)[INVITATION
    TO THE IMPERIAL GARDEN PARTY.](#009_9781317949527_illustrations.html_ill3-5)The
    guests formed themselves into rows, and were asked to remain in their places by
    the Master of Ceremonies. The eyes of all were turned in the direction of the
    road by which the Empress was coming, and shortly the procession appeared, headed
    by the Court Chamberlains in their Court uniforms of European design. After the
    Chamberlains had passed, the Ladies-in-Waiting appeared, walking two and two;
    following these came the Empress, walking alone. Her Majesty, who appeared to
    be not more than five feet high, wore a green velvet dress of European make. She
    was very solemn in manner, and her face was absolutely expressionless and without
    a smile as she acknowledged the curtsies of the ladies and the profound bows of
    the Ministers and other guests in a somewhat automatic manner. Behind the Empress,
    the Princesses of the Imperial House walked; they were all dressed in European
    costumes of bright colours.The procession, which was followed by all the guests,
    slowly wound its way to the receptiontent, at one end of which Her Majesty took
    her place, while on her left the Princesses stood in a row, and behind them the
    Ladies-in-Waiting. We had places in the front line, in which we stood with the
    Diplomatic Corps. The Belgian Minister, Baron d’Anethan, and his wife, were to
    be presented first, he being the “Doyen” or senior member of the Diplomatic Corps.
    Subsequently Sir Claude MacDonald was presented by the Master of the Ceremonies,
    and I was in turn presented by the former.After the Empress had shaken hands with
    me, the Lady-in-Waiting. who interpreted asked me, on behalf of the Empress, if
    I liked Japan, and if I found the cold very severe after the great heat of my
    own country—a question which was often asked of me in Japan. The Empress was astonished
    when I explained that in some parts of India the cold is at certain times almost
    as severe as in Japan. The Empress spoke in an almost inaudible voice, and after
    a few other remarks had been made and my suite had been presented, I was introduced
    to the Princesses. One of them, the Princess Nashimoto, is considered to be one
    of the most beautiful women in the Japanese aristocracy.![Image](Images/24.jpeg)[HER
    IMPERIAL MAJESTY THE EMPRESS OF JAPAN.](#009_9781317949527_illustrations.html_ill3-6)'
