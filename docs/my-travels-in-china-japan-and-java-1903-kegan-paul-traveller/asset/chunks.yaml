    *摘自作者原作*。


    当俄罗斯公使被接觐见时，引起了大量的关注。据说罗森男爵（Baron Rosen）是外国大臣中最聪明的之一，考虑到他国家与日本之间紧张的关系，他的举动一直受到他人的极大关注。接下来是中国公使。他身后跟着一大随从人员，他们都穿着中国宫廷盛装，是场上唯一没穿欧洲服装以外的穿着其他服装的人。


    在外国海军和陆军官员之后，日本大臣也接受了觐见。他们的行礼方式是双手放在膝盖上，深鞠致躬。皇后没有与他们握手。觐见就此结束。


    随后是一场盛大的宴会。这与在其他地方所习惯的下午茶完全不同，而是一顿有几道菜的正规正餐：汤、鱼、肉块、冰淇淋，配有香槟和其他葡萄酒。皇后坐在主位，她旁边坐着东伏宫王子和公主们。我观察到，皇室成员几乎没有碰面前面前的实实在，而客人们则尽情享用了提供的佳肴。


    我的位置面对皇后，可以很好地观察整个过程。除了外交使团和一些较显贵的客人外，用餐时并没有提供餐桌；其他人不得不在一张充当自助餐的长桌旁享用点心，他们站在那里自取。餐桌上的服务由日本侍者执行，他们打扮得像欧洲的随从，隶属于皇室。用餐持续了半小时，皇后通过起身示意宴会结束。


    我必须提提一下，在我们用餐期间，日本军乐队演奏了许多非常精美的欧洲音乐。男士们穿着非常法国式的制服，演奏得非常完美。随后队伍重新整队；但在离开之前，皇后与她一些较显贵的客人握了手，并祝我在日本期间过得愉快，平安回国。就这样，年度菊花节宴会结束了，整个活动的安排之精细，在伦敦的白金汉宫或巴黎的爱丽舍宫都是无法企及的。


    ![Image](img/25.jpeg)

    东京赤坂皇室庭园的菊花花展。


    我所描述的这场娱乐活动是现代日本进步的众多证据之一；而所有安排的完美程度展现了对外部援助的完全独立，这充分说明了日本人民采纳他人习俗并适应现代和变化条件的能力。二十年前，这样一场以这种系统、以这种规模举办的娱乐活动将超出日本人的能力范围；但现在这并不被认为是什么了不起的事。


    皇帝由于忙于秋季演习，未能出席菊花庭园派会，因为他距离那里有一天的路程，且有约 3 万士兵需要视察。


    皇后离开后，现场出现了一阵抢车的人潮。我们的车很快就准备好了，我们急忙赶回横浜的快车。我没有什么时间可以浪费，因为那天晚上有年度俱乐部舞会；晚餐结束后，我来到俱乐部，玩得非常尽兴，并跳得心舒畅。宴会提供了丰盛的夜宵，我与来自各国家欢快的人群一直留到到凌晨一点。


    这场舞会的一个显著特征是，除了横浜总督和他的夫人外，几乎完全没有日本男女。我注意到，尽管日本处于先进状态，但他们与欧洲人之间几乎没有社交往来。只有在仪式性和正式集会上，他们似乎才会聚在一起：原因似乎是日本人在外国社会中并不完全自在。我没有注意到欧洲人在日本有任何排外的倾向。


    由于希望留在首都并参与日本生活中心发生的一切活动，我在与几位英国朋友共进午餐后离开了横浜，在东京停留。东京在过去的两百年里一直是首都，现在人口有 150 万。这是一座距离巨大的城市，从一端到另一端有十英里。在路途中浪费的时间非常可怕。这座城市的面貌拥有壮丽的建筑，如陆军部、议会大厦、法院等，围绕中心公共公园和休闲场形成圈，明显比加尔答或孟买都要整洁得多，让人想起维也纳的环形街（Ring
    Strasse），无疑其整体布局是模仿了那里。


    ![Image](img/26.jpeg)

    东京银街主街（从新桥出发）。


    到达东京后，我们立即前往英国使馆，在那里，二等秘书霍勒先生（Mr. Hohler）带我们去看一场摔跤比赛，比赛在一个铺有草席的房子里举行。进入时，我们必须脱鞋换上帆布室内鞋，这是日本的惯例。起初，摔跤教授用英语解释了摔跤术的基础知识，并进行了实地演示；随后参赛者上场，比赛开始。


    摔跤似乎更多是依靠技巧而非力量或体力，看到一个人仅仅通过转动手或扭动脚就被摔倒，简直太不可思议了。考虑到他们被摔倒时的力度，摔倒的人没有受重，这非常了常。这些人身材矮小而结实，满身肌肉。每场比赛持续五六分钟。摔跤在日本是一门精妙的艺术。警察也被教授了这些技巧，他们经常对那些吵闹但有力的外国水手练习摔跤。


    我们留了大约两个小时，期间我们目睹了大约十场比赛，然后前往帝国酒店，那是我们在东京期间的住所。酒店是一座三层楼的大建筑，立面漂亮，底层有宽敞的公共房间。餐厅可以容纳约两百人，此外还有若干间用于私人娱乐的房间。


    ![Image](img/27.jpeg)

    东京帝国酒店（日式管理）。


    15 日上午，我拜访了几位皇室王子。不幸的是他们全不在，所以我能去打纸牌。这些王子现在拥有许多为了享乐建造的别墅，是根据法国设计建造的。在家具上花费了巨资，装饰得非常华丽；但仅用于娱乐而居住的日本式房屋实际上没有任何家具。


    我还拜访了俄罗斯、意大利和中国大臣，我见到了他们并与他们交谈。俄罗斯公使在我进入时告诉我，他是前任的好朋友，曾和他一起打台球——这一观察直到他误以为我是新到的泰国公使！在交谈期间，俄罗斯公使希望他的政府与日本政府之间的分歧能够友好解决；当我询问日本人是否真的如所信那样强壮时，他回答说他们是不可挡的。他还提到，无论他去哪里都会被日本警察监视，在俄军占领奉天后，为了安全起见，发往他政府的公文必须通过特使派遣并由轮船运送。与中国大臣的会面充满了趣味。对于中国可能采取的行动的同情提问，他露出宽大的微笑，请我喝了茶并给了香烟。


    当天晚些时候，我去上野公园游览——那里被称为东京的海德公园。那里有许多名树和宽阔维护良好的大道；那里还有一个博物馆、一些寺庙、餐厅和一个美术展。我参观了美术展，看到了许多日本艺术家的画作，其中大部分是水彩画。从公园露台，可以俯瞰脚下的城市美景。


    ![Image](img/28.jpeg)

    舞蹈。


    晚餐后，我在一家通常举行此类活动的茶馆看了艺伎表演，这些表演是提前准备好的。到达时，女侍从行了跪下并用头磕地的惯常礼节。我们脱掉靴子换上室内鞋，然后上楼进入专门用于娱乐的房间。这里与日本所有其他房子一样。它是木头制成的，用纸屏风隔开；这些屏风可以推拉，通过调整形成任意数量的房间。地板铺着干净的棕席，整个地方的整洁程度无与伦比。


    房间的一端放了一些垫子供客人坐，在每个垫子之间都放了一个金属或瓷制的火炉，以便客人暖手。在我们就座后不久，女音乐家登场，在行了惯常的礼节后坐在地上。与大众的认知相反，艺伎并不跳舞。她们只负责伴奏，而所谓的“舞姬”（mykos）负责所有的跳舞。后者是九到十四岁的小女孩。大约六个舞姬进入并排成一行面对我们，不久后她们开始了这种奇特而优雅的舞蹈。这包括在艺伎音乐和歌声伴奏下，身体各种优美的动作和纤细手的缓慢挥动。


    舞姬穿着五彩斑斓的衣服和漂亮的腰带，看起来像蝴蝶，而艺伎则穿着深色的服装，显得庄重。间隙，舞姬会停止舞蹈休息，随后继续。舞蹈代表了战争、爱情、四季等，解释是由舞者的肢体剧和手势完成的，他们的模仿能力之好，使得这变得毫不困难。


    这些微型舞者那童般的纯真完全令我着迷，更像娃娃而不是发育中的女性。我必须补充一点，艺伎在被认为胜任演奏和唱歌之前，必须全部当过舞姬。我注意到其中一些人通过黑牙来毁掉唇部形象，这是极度俏皮的习俗。这种新奇的娱乐活动令我着迷直到深夜。


    ![Image](img/29.jpeg)

    一种艺伎。


    16 日，我与德国使馆的一等秘书埃克特先生（Herr Erckert）及其夫人共进午餐，随后参加了由大仓（一位政治家）举办的园游派会。在大仓举办的聚会上比几天前的皇室园游派毫不逊色。花园是典型的日式风格，有微型湖泊、岛屿、桥和矮松树。这次聚会上有三位皇公主和一个王子，以及大量的东京社交人士。


    在皇室成员的陪同下，我们德高望的主人带我们在花园里转了一圈，从小丘上可以获得邻近乡村的好景。四点，所有客人坐下享用丰盛的晚餐。专门留了两张皇室桌，我坐在其中一张，左侧是美丽的梨本公主。她用法语与我交流，我必须承认，她独特的发音并没有让这种语言失去美丽。这位公主结婚不久，她的丈夫当时正在法国的一所军事学校接受培训。这些公主的羞涩、礼仪和对话完全令人愉快，与欧洲女士完全不同。我被连番追问在在日本看到的景光，当我提到艺伎表演时，引起了许多趣味和笑声。派会五点散场，大家向主人告别后回家。


    英国使馆在晚餐后举办了舞会，因此离开园游派会后我没有时间可以浪费。这是一场正式场合，在场所有人都穿着全装礼服。我穿着我最好的旁遮普服装，这引起了许多关注，因为在场没有人以前见过这种衣服。我随公主们、王子们以及我们的主人夫妇庄严地队进入舞厅。当我们进入时，欧洲外交官、日本官员以及其他客人都聚集在房间里，景象确实非常壮丽：漂亮的连衣裙、布满勋章的制服，构成了一幅在印度罕见的绚丽景象。


    ![Image](img/30.jpeg)

    梨本公主殿。


