    THE TWELVE-STORIED TOWER, ASAKUSA PARK, TOKIO.](#009_9781317949527_illustrations.html_ill3-20)Near
    this popular resort stands the famous Temple of Kwannon, the Goddess of Mercy.
    A curious feature of this and other temples in Japan is the free use the people
    made of them for purposes other than worship. The whole temple presented a curious
    medley when we saw it: birds were flying in and out; men were smoking; some were
    lying down or sleeping; merchants were driving bargains; while at the same time
    some of the people were worshipping. The sight was a curious one, and made one
    feel that temples have other uses than, as we understand it, for worship.Being
    desirous of celebrating the anniversary of my birthday in a befitting manner,
    I invited a number of people to dine with me at the hotel. Among others, my guests
    included Sir Claude and Lady MacDonald, Baron Komura, Minister of Foreign Affairs,
    Baron and Baroness Sannomiya (the latter an English lady and a great favourite
    in Tokio society), and the Baron von Erckert, of the German Legation; there were
    also a number of friends of different nationalities present. The matter of precedence
    was full of difficulty, and could only be decided by a reference to the Minister
    of the Imperial Householder, who possesses the right to decide all matters of
    social etiquette.In all there were about forty guests, and to me fell the honour
    of escorting the Baroness Sannomiya to dinner. The *pièce de résistance* was a
    polau made by my own cook, who had come from India with me; his culinary efforts
    were much appreciated by all present, particularly by the Japanese guests. At
    the proper time I proposed the health of the Japanese Emperor in a short speech,
    and in response Baron Komura gave the health of our King Emperor. The band played
    the respective national anthems, and needless to say both toasts were most cordially
    responded to by all present. Baron Sannomiya then proposed my health, making at
    the same time a neat little speech, for which I returned thanks as usual. A Japanese
    military band played a good selection of music during and after dinner.The next
    day we were invited to witness a game of Japanese polo; the game was specially
    got up for my edification by order of the Emperor. Polo in Japan is a relic of
    feudal times, when it was commonly played by the nobles. It is now revived for
    the amusement of important visitors, and for this purpose the teams are maintained
    at Court expense.The game was played in an enclosure near the seashore in one
    of the Imperial parks. The arrangement of the polo-ground was such as to give
    the spectators an excellent view of the game. The usual formalities of receiving
    me on behalf of the Emperor by the Master of Ceremonies and the Master of Horse
    were gone through, and the game commenced.The game itself is totally different
    from English polo. The players in the opposing teams wear different-coloured costumes,
    of a pattern prevailing in feudal times, and each player is armed with a kind
    of bat, with which he endeavours to drive the ball into one of a series of holes,
    with which a structure like a target is perforated. The opposing team try to prevent
    this, and endeavour to divert the ball. Each time a player succeeded in placing
    a ball in one of the holes a goal was scored to the credit of his team, and as
    a sort of forfeit, the opposing team were obliged to dismount and retire from
    the arena afoot. Each round lasted for about ten minutes, after which a short
    rest was indulged in. The scoring of a goal was the signal for a general exodus,
    and gave the opportunity for changing ponies; the latter were gaily caparisoned,
    and the general appearance of the players reminded one of Spanish matadors. The
    game lasted about two hours in all. I enjoyed the novelty of the game very much,
    and on its termination I drove to the Tokio Club, to which I had been elected.
    There I amused myself by playing billiards with Baron Rosen, the Russian Minister,
    who, by the way, I had not much difficulty in disposing of. Nemesis, however,
    awaited me in the person of Captain Trowbridge, British Naval Attaché, who played
    a splendid game.The Tokio Club is largely patronised by the European diplomats
    and by some of the Japanese officials. The club for the purely Japanese aristocracy
    is called the Nobles’ Club, and foreigners are not elected to it. After dinner
    I visited the Shiba Park Club, where I saw some very interesting dances by *geishas*,
    which were said to be of the highest order in their category of dances.At an early
    hour on November 27 I went, accompanied by Colonel Hume, pheasant-shooting in
    one of the Imperial preserves. The journey of four hours was most tedious, and
    involved the use of the carriage and a ’rickshaw as well as the train. The day
    was miserably cold and wholly unfavourable to good shooting. Permission to shoot
    over this preserve is sometimes accorded by the Emperor to distinguished guests,
    but not always.Count Toda, Master of the Imperial Hunt, and some of his assistants
    met me on arrival, and we lost no time in getting to work. Several beats were
    organised, but luck was not my way that day, and I had not even the chance of
    firing off my gun at a pheasant. The birds were very scarce, and Colonel Hume
    was the sole one who killed; his bag amounted to only two pheasants and one woodcock.Lunch
    over (at which meal my hosts were my guests), we again tried our luck with the
    pheasants, with no better results, and, to make matters more disappointing, rain
    began to fall, upon which we gave up the idea of further shooting. My ill-fortune
    did not desert me, for on our return journey my ’rickshaw capsised and precipitated
    me on to the road, which was covered with mud. I extricated myself as best I could,
    and, covered with slush, resumed the journey; finally our hotel was reached late
    at night, and so ended the only really disappointing day I spent in Japan.The
    day after I visited the institution called the Peeresses’ School, where the young
    daughters of the aristocracy and nobility are educated; all sorts of subjects
    were being taught, and the training imparted appeared to be of a comprehensive
    and thorough character. The English and Japanese lady superintendents were good
    enough to conduct me to all the different departments, and they explained the
    system on which the work was carried out. The drawing-class was particularly meritorious,
    and the work turned out of a high order: there I was presented with two specimens
    of the pupils’ skill, both of which I was gratified to receive. These up-to-date
    Japanese maidens were even learning to dance in the Western fashion! It was most
    interesting to notice the difference between the dance of the West and that practised
    usually by the Japanese; the latter was also being taught, and was, of course,
    much more intricate than the other.The singing class was decidedly attractive,
    and the pupils displayed much aptitude. It is rather difficult to describe the
    kinds of music and singing which were being taught at this school, but perhaps
    I can make it more clear by saying that the music native to the country appeared
    to be in a state of transition, and the foreign, or Western system, as well as
    a certain amount of harmony, was introduced to an extent sufficient to make its
    presence noticeable without destroying the original. Saturday, the day of my visit,
    was a half-holiday, and as I happened to be there at twelve o’clock, I witnessed
    a scene of much animation, when the girls, of all ages from tiny mites of five
    to well-grown maidens of seventeen, dispersed to their homes. The kaleidoscopic
    mass of colour in their dainty costumes, as well as the vivacity of their laughter
    and appearance, made up a picture in which colour and animation were the predominating
    notes. Some of the girls had come provided with their breakfast or lunch, which
    was carried in little boxes about the size of an ordinary chocolate box, each
    of which contained the indispensable chopsticks and the equally important rice
    cakes and fish. These viands the girls disposed of on the spot with evident appetite.![Image](Images/39.jpeg)[JAPANESE
    GIRLS AT A MEAL.](#009_9781317949527_illustrations.html_ill3-21)I had heard much
    about the barracks of the Imperial Guards, and after I had seen all there was
    to be seen at the Peeresses’ School, I went to the living-quarters of the Japanese
    Corps d’Elite with Colonel Hume. Some of the superior officers met me on arrival,
    and the customary offerings of tea and cakes were made in their mess, which, although
    unpretentious, was an evidently well-arranged institution. As was always the case
    in Japan, everything about the place was spick and span; absolute cleanliness
    prevailed everywhere.*Apropos* of this subject, I was told that messes are now
    being established in connection with some of the regiments, after the European
    fashion; so far, however, the officers’ affection for their beloved chop-sticks
    has not been alienated to the advantage of the more modern knife and fork. Surrounding
    a large quadrangle, in which the troops drilled, were a number of three-storied
    buildings; these formed the living-quarters of the men. The barracks did not differ
    materially from similar places in Europe. The men’s beds were ranged along the
    room, and their weapons and accoutrements were neatly disposed of on convenient
    shelves fastened to the wall. I also inspected the stores of spare clothing, etc.,
    etc., and found all things in a state of excellent order.At my request the Commanding
    Officer put two companies through their drill in the quadrangle. The men could
    not have been smarter, especially in the manual drill, while their firing and
    other exercises were executed with lightning-like rapidity and precision.It may
    be mentioned here that the Japanese Army, although ranking with any in the world,
    is run on most economical lines; the frugality of the officers’ and men’s living
    renders this possible, and a state of high efficiency is nevertheless maintained.The
    following is a scale of pay given to officers and soldiers in the Japanese Army:'
