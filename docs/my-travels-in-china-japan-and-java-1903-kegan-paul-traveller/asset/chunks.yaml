    # PREFACE


    ![Image](Images/3.gif)


    THIS book is written chiefly as a record of my brief visit to the Far East and
    for the purpose of presentation to my friends. It makes no pretension to literary
    excellence, being designed more as a record of facts and personal impressions
    of people and places seen, than to emphasise any claim, on my part, to consideration
    from the public as an author.


    It may, I hope, be found interesting to those who are now following the course
    of the war between Russia and Japan, as it describes, to a certain extent, some
    things about the latter country, and it gives a brief account of some interesting
    parts of Manchuria and other places, on which, owing to the war, public interest
    is now centred. Impending hostilities rendered my visit to Japan peculiarly opportune,
    and the study of the people of that country an unusually interesting one.


    From the standpoint of the traveller, Japan is perhaps one of the most interesting
    countries in the world; the country itself is full of delightful and varied scenery,
    while its people possess a charm of appearance and manner unlike anything of the
    kind to be met with elsewhere.


    Parts of China and Java were also visited by me; but of the people of those countries
    I have little to say in praise. The Chinese appear to be indifferent to the course
    of present events; they seem to possess no national ideals, and I was much struck
    by the obvious individual selfishness of the people, among whom patriotism and
    public spirit had no existence. The Javanese are absolutely apathetic; a display
    of energy on their part seems an impossibility. Both countries are, however, interesting
    and well worth a visit.


    My only regret, in connection with this record, is that the time at my disposal
    having been very limited, I was perforce able to give a short and usually insufficient
    time to the observation of the habits and thoughts of the different people I came
    in contact with; a whole year could easily have been spent on this quest.


    It now only remains for me to acknowledge the invariable kindness and hospitality
    with which I was met on all hands during my travels, and to thank all those who
    assisted me in my search for information and particulars of the different places
    I visited.


    ![Image](Images/4.gif)


    KAPURTHALA, *December* 1, 1904.


    # CONTENTS


    ![Image](Images/5.gif)


    ## I. JOURNEY TO COLOMBO

    Colombo—Singapore—Saigon—Hong-Kong


    ## II. CHINA

    Shanghai—Mixed Tribunals—Chinese City—Chifoo—Tien-Tsin—Pekin—Sir Ernest Satow—Tien-Tsin—The
    Great Wall of China—Shanhaikwan—Newchwang—The Trans-Siberian Railway—Dalny—Port
    Arthur—*En route* to Japan


    ## III. JAPAN

    Nagaski—Shimonoseki—Yokohama—Kioto—Sir Claude MacDonald—Garden Party at British
    Legation, Tokio—Yokohama—Koma-akura—Imperial Garden Party—Tokio—Ball at British
    Legation—Japanese Society Wedding—Imperial Duck-Hunt—Utsonomiya—Japanese Troops—Imperial
    University, Tokio—Prison—Museum—Chuzenji—Temples, Nikko—Visit to the Emperor,
    Tokio—The Emperor of Japan—Imperial Palace—My Birthday—Japanese Polo—Pheasant
    Shooting—Barracks—Japanese Troops—Departure from Tokio—Excursion to Lake Hakone—Nagoya—Ancient
    Capital of Kioto—Katsura Gava Rapids—Kioto—Nara—Great Geisha Dance—Lake Biwa—Osaka—Great
    Arsenal, Osaka—Departure from Kobe—S.s. *Koenig Albert*—Good-bye to Japan


    ## IV. SHANGHAI

    Chinese Man-of-War—Shanghai—Chinese Dinner—Hong-Kong—At Sea—Singapore—Johore—*En
    route* to Java


    ## V. NETHERLANDS INDIA

    Netherlands India—Batavia—Life in Batavia—Buitenzorg: Visit to Governor-General—Botanical
    Gardens, Bandong—Visit to Chief’s College—Djocjokarta—Visit to Temple, Boroboedoer—Grand
    Temple—Visit to Sultan, Djocjokarta—Solokarta—Sultans of Java—Sultan of Solokarta—Reception
    by Sultan of Solokarta—Javanese Dance: Solokarta Palace—Sultan’s Stables—Reception
    by Sultan of Djocjokarta—Javanese Characteristics—Homeward Bound


