    *From an Original Presented to The Author*.


    The theory of the “Divine right” of Kings is exemplified to the fullest extent
    in Japan, where the Emperors person is considered a sacred thing, and whose photograph
    is not permitted to be sold. All classes of society, from the highest to the lowest,
    practically worship their ruler, whose person embodies all that is holy and saint-like
    in their religious and social estimation. Of course, it is impossible to know
    to what extent the present prosperous and intellectual position of Japan is due
    to the Emperor’s personality; and it is equally difficult to ascertain to what
    extent he, personally, directs the destinies of the nation over which he rules.
    This much, however, is known, *viz.* that no measure is adopted, and nothing of
    an important nature is effected, without his knowledge and sanction. His Majesty
    is well supported by able and experienced Ministers, and recourse to the advice
    of the so-called “Elder Statesmen” is always made when important matters are to
    be discussed. It may be added here that the “Elder Statesmen” comprise some of
    the most distinguished reformers to whom is largely due Japan’s present position
    among the world’s nations.


    ### The Restoration of the Emperor


    Forty years ago, when the present Emperor succeeded to the throne, Japan and its
    institutions were governed on the feudal system; the Emperor was a mere figure-heard,
    and practically a prisoner. All the power of administration rested with the Shoguns,
    or feudal lords, who ruled different provinces. When the Japanese awoke to the
    necessity of reform, their alternatives were to continue the system then prevailing
    or to unite into one powerful nation by concentrating all the power in the person
    of the Emperor. Owing to differences among the people on this important point,
    a sanguinary revolution took place, the result of which was the restoration of
    the Emperor to his proper place and functions. On this taking place, the Shoguns
    abandoned their assumed rights and truculent attitude. Some of the Shoguns now
    hold important posts in the government of the country, and are perfectly loyal
    and obedient to their Emperor. From the political, social, and economical point
    of view, the happy results of the change are now evident to the whole world. The
    Imperial dynasty of Japan is the oldest existing, it being possible to trace a
    direct line of descent for the past 2,500 years.


    ### The Imperial Palace


    My next step was to see the palace itself, the opportunity being one never likely
    to occur again. I went through the banqueting-hall, the reception-rooms, and the
    throne-room, all of which were of large size and decorated in the most sumptuous
    manner. The doors were made of glass, which gave a sort of crystal effect to the
    surroundings, which, in its way, was quite effective. The furniture, of a massive
    kind, was all imported from Germany.


    The purely Japanese decoration was, to my mind, superior to anything I saw which
    had been imported: for instance, the banqueting-hall, a room of more than five
    hundred square yards in area, had a ceiling decorated in gold combined in an artistic
    manner with different colours; its walls were covered with expensive silks. In
    one of the reception-rooms I noticed a really fine piece of tapestry more than
    forty feet long; it was said to have been made in one piece by a weaver in Kioto.
    Wood entered largely into the decorative work, and this had been cleverly worked
    up with lacquers in a manner perfectly inimitable. All the panels were decorated
    with a distinctive design either embossed or painted. The walls of the rooms were
    chiefly covered with brocade, while those of the passages were treated with a
    kind of embossed paper peculiar to Japan. I believe the making of this paper forms
    a large and increasingly important industry. All the rooms were perfumed with
    an essence of lavender, and were well warmed.


    ### Asakusa Park and Public Shows


    Returning to the hotel for breakfast, I subsequently visited the Asakosa Park,
    which to Japan is the same as the Crystal Palace is to London. The park is intersected
    by streets running in different directions, in which all kinds of ornamental goods,
    such as dolls, fans, etc., etc., are sold in booths. Confectionery is made before
    the public and sold on the spot. The prevailing cleanliness and neat surroundings
    of these confectioners formed a temptation to buy and eat which otherwise would
    have been absent.


    The side-shows were very numerous, and all the usual features of a fair were present;
    there we saw clever jugglers, itinerant artists, wrestlers, actors, etc., etc.
    Theatrical performances were in full swing and were well patronised by the people,
    of which large numbers, all bent on holiday-making, were present. The contrast
    between the people at this place and those one sees in Paris and London, or indeed
    anywhere in Europe, similarly occupied, was very marked; here, although obviously
    enjoying themselves, these folk were perfectly well behaved, and the entire absence
    of drunkenness and rowdiness in any form was a pleasing feature of the show.


    ![Image](Images/38.jpeg)

    [PUBLIC SHOWS, WITH THE TWELVE-STORIED TOWER, ASAKUSA PARK, TOKIO.](#009_9781317949527_illustrations.html_ill3-20)


    ### Temple of Kwannon


    Near this popular resort stands the famous Temple of Kwannon, the Goddess of Mercy.
    A curious feature of this and other temples in Japan is the free use the people
    made of them for purposes other than worship. The whole temple presented a curious
    medley when we saw it: birds were flying in and out; men were smoking; some were
    lying down or sleeping; merchants were driving bargains; while at the same time
    some of the people were worshi. The sight was a curious one, and made one feel
    that temples have other uses than, as we understand it, for worship.


    ### A Birthday Dinner


    Being desirous of celebrating the anniversary of my birthday in a befitting manner,
    I invited a number of people to dine with me at the hotel. Among others, my guests
    included Sir Claude and Lady MacDonald, Baron Komura, Minister of Foreign Affairs,
    Baron and Baroness Sannomiya (the latter an English lady and a great favourite
    in Tokio society), and the Baron von Erckert, of the German Legation; there were
    also a number of friends of different nationalities present. The matter of precedence
    was full of difficulty, and could only be decided by a reference to the Minister
    of the Imperial Householder, who possesses the right to decide all matters of
    social etiquette.


    In all there were about forty guests, and to me fell the honour of escorting the
    Baroness Sannomiya to dinner. The *pièce de résistance* was a polau made by my
    own cook, who had come from India with me; his culinary efforts were much appreciated
    by all present, particularly by the Japanese guests. At the proper time I proposed
    the health of the Japanese Emperor in a short speech, and in response Baron Komura
    gave the health of our King Emperor. The band played the respective national anthems,
    and needless to say both toasts were most cordially responded to by all present.
    Baron Sannomiya then proposed my health, making at the same time a neat little
    speech, for which I returned thanks as usual. A Japanese military band played
    a good selection of music during and after dinner.


    ### Polo in Japan


    The next day we were invited to witness a game of polo; the game was specially
    got up for my edification by the Emperor. Polo in Japan is a relic of feudal times,
    when it was commonly played by the nobles. It is now revived for the amusement
    of visitors, and for this purpose the teams are maintained at Court expense. The
    game was played in an enclosure near the seashore in one of the Imperial parks.
    The arrangement of polo-ground was such as to give the spectators an excellent
    view. The game itself is totally different from English polo. The players in the
    opposing teams wear different costumes, prevailing in feudal times, and each player
    is armed with a kind of bat, with which he endeavours to drive the ball into one
    of the holes. Each round lasted for ten minutes, after which the opposing team
    was gaily capisoned. On its termination, I drove to the Tokio Club, to which I
    had been elected. I enjoyed the novelty of the game much and amused myself by
    playing billiards with Baron Rosen, the Russian Minister, who, by the way, I had
    not much difficulty in disposing of. Nemesis, however, awaited me in the person
    of Captain Trowbridge, British Naval Attaché, who played a splendid game.


    The Tokio Club is largely patronised by the European diplomats and by some Japanese
    officials. The club for the purely aristocracy is called the Nobles’ Club, and
    foreigners are not elected to it.


    ### The Hunt


    At an early hour on November 27 I went, accompanied by Colonel Hume, pheasant-shooting
    in one of the Imperial preserves. The journey of four hours was most tedious,
    and involved the use of the carriage and rickshaw as well as the train. The day
    was miserably cold and wholly unfavourable to shooting. Permission to shoot over
    this preserve is sometimes accorded by the Emperor to distinguished guests, but
    not always. Count Toda, Master of the Imperial Hunt, and some of his assistants
    met me on arrival, and we lost no time in getting to work. Several beats were
    organised, but luck was not my way day, and I had not even the chance of firing
    off my gun. The birds were very scarce, and Colonel Hume was the sole one who
    killed; his bag amounted to only two pheants and one woodcock. Lunch over (at
    which meal my hosts were my guests), we again tried our luck with the pheants,
    with no better results, and to make matters more disappointing rain began to fall,
    upon which we gave up the idea of further shooting. My ill-fortune did not desert
    me, for on our return journey my rickshaw capsised and precipitated me on the
    road, which was covered with mud. I extricated myself as best I could, covered
    with slush, resumed the journey; finally our hotel was reached late at night,
    and so ended the only disappointing day I spent in Japan.


    ### The Peeresses’ School


    The day after I visited the institution called the Peeresses’ School, where the
    young daughters of the aristocracy and nobility are educated; all sorts of subjects
    were being taught, and the training imparted appeared to be of a comprehensive
    and thorough character. The English and Japanese lady superintendents were good
    enough to conduct me to all the different departments, and they explained the
    system on which the work was carried out. The drawing-class was particularly meritorious,
    and the work turned out of a high order: there I was presented with two specimens
    of the pupils’ skill, both of which I was gratified to receive. These up-to-date
    Japanese maid were even learning to dance in the Western fashion! It was most
    interesting to notice the difference between the dance of the West and that practised
    usually by the Japanese; the latter was also being taught, and was, of course,
    much more intricate than the other. The singing class was decidedly attractive,
    and the pupils displayed much aptitude. It is rather difficult to describe the
    kinds of music and singing which were being taught at this school, but perhaps
    I can make it more clear by saying that the music native to the country appeared
    to be in a state of transition, and the foreign, or Western system, as well as
    a certain amount of harmony, was introduced to an extent sufficient to make its
    presence noticeable without destroying the original. Saturday, the day of my visit,
    was a half-holiday, and as I happened to be there at twelve o’clock, I witnessed
    a scene of much animation, when the girls, of all ages from tiny mites of five
    to well-grown maidens of seventeen, dispersed to their homes. The kaleidoscopic
    mass of colour in their dainty costumes, as well as the vivacity of their laughter
    and appearance, made up a picture in which colour and animation were the predominating
    notes. Some of the girls had come provided with their breakfast or lunch, which
    was carried in little boxes about the size of an ordinary chocolate box, each
    of which contained the indispensable chopsticks and the equally important rice
    cakes and fish. These viands the girls disposed of on the spot with evident appetite.


    ![Image](Images/39.jpeg)

    [JAPANESE GIRLS AT A MEAL.](#009_9781317949527_illustrations.html_ill3-21)


    ### The Imperial Guards


    I had heard much about the barracks of the Imperial Guards, and after I had seen
    all there was to be at the Peeresses’ School, I went to the living-quarters of
    the Japanese Corps d’Elite with Colonel Hume. Some of the superior officers met
    me on arrival, and the customary offerings of tea and cakes were made in their
    mess, which, although unpretentious, was an evidently well-arranged institution.
    *apropos* of this subject, I was told that messes are now being established in
    connection with some of the regiments, after the European fashion; so far, however,
    the officers’ affection for their beloved chop-sticks has not been alienated to
    the advantage of the more modern knife and fork. Surrounding a large quadrangle,
    in which the troops drilled, were a number of three-storied buildings; these formed
    the living-quarters of the men. The barracks did not differ materially from similar
    places in Europe. The men’s beds were ranged along the room, and their weapons
    and accoutrements were neatly disposed of on convenient shelves fastened to the
    wall. I also inspected the stores of spare clothing, etc., etc., and found all
    things in a state of excellent order. At my request the Commanding Officer put
    two companies through their drill in the quadrangle. The men could not have been
    smarter, especially in the manual drill, while their firing and other exercises
    were executed with lightning-like rapidity and precision. It may be mentioned
    here that the Japanese Army, although ranking with any in the world, is run on
    most economical lines; the frugality of the officers’ and men’s living renders
    this possible, and a state of high efficiency is nevertheless maintained. The
