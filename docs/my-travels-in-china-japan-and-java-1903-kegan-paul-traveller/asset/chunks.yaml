    # *After a photograph presented to the Author*


    It was curious to note the exhibition of Oriental nature in these Sultans; their
    personal jealousy is so great as to prevent the exchange of visits of courtesy.
    Oriental character is such as to make its possessors lose all the advantages of
    combination; and so the foreigner has ever succeeded where Orientals, by the display
    of some self-restraint, would have had at least an equal chance with their enemies.


    The Dutch in `Java` were not slow to observe the jealousies existing between the
    two most powerful Sultans in the country, and in their own interest naturally
    did nothing, and now refrain from doing anything, to bring about a more friendly
    condition of affairs between them. I found peculiar interest in observing such
    things and making mental notes of the comparative conditions in `Java` under the
    Dutch rule to that prevailing in `India` under the English regime. The two countries
    I have named are among the very few, I think, where such an analogy exists, and,
    being an interested person myself, my curiosity was, of course, excited. This
    led me to make certain inquiries, in response to which I acquired information
    to the effect that the income of `Solokarta` is about 4,000,000 florins (Rs. 6,000,000)
    per annum; besides this, the Sultan receives a subsidy of 70,000 florins monthly
    from the Dutch Government—a system differing materially in this respect from that
    prevailing in `India`.


    ## The Sultan of Solokarta


    The Sultan of `Solokarta`’s military force consists of about 1,500 irregulars,
    which term, as applied to them, is perfectly comprehensive. They are armed with
    weapons of an exceedingly ancient date, and these would seem to be more in place
    in a museum as curiosities than in the hands of a soldier. The Sultan has a bodyguard
    of Dutch European soldiers; it is sixty strong and commanded by a captain attached
    to the Sultan’s Court. At least a portion of the bodyguard accompanies the Sultan
    where he goes, which fact, in addition to others, makes it tolerably clear that
    while the bodyguard is ostensibly an honour accorded by the supreme power, the
    latter at the same time desires that the Sultan shall not remain long without
    surveillance!!


    ![Image](Images/56.jpeg)

    [HER HIGHNESS THE SULTANA OF SOLOKARTA.](#009_9781317949527_illustrations.html_ill5-7)


    The total feminine population of the Sultan’s household numbers about 6,000, and
    out of this large number some hundred or so are accredited to the Sultan himself.
    The remainder are relations, wives of officials, servants, etc.


    It was difficult to ascertain, in the short time at my disposal, the extent and
    scope of these Sultans’ powers over their subjects; but I was informed that they
    had authority over their people residing in their respective States; but on all
    important matters they are expected to consult the Dutch Resident, who is touchingly
    designated “elder brother.”


    ## The Reception at Solokarta


    I was invited that evening to an entertainment by the Sultan of `Solokarta` (whose
    official designation is `Susuhnan`), which he was kind enough to get up in my
    honour. The Dutch Resident was unfortunately absent on that occasion, but his
    Chief Secretary came to receive me on behalf of his superior, and accompanied
    me to the Sultan’s palace in the carriage which the Sultan had placed at my disposal.
    A number of officers of the Resident’s staff, as well as some ladies from the
    Residency, were present at the entertainment.


    The details of my reception by the Sultan of `Solokarta` were much the same as
    those I have already described at `Djocjokarta`, the chief difference being that
    on this occasion the reception was, partly owing to the higher rank of `Solokarta`,
    and partly owing to the superior magnificence of his Court and surroundings, on
    a much more elaborate scale. The etiquette observed, however, was the same on
    both occasions. I was most cordially received by His Highness on my arrival, and
    he immediately conducted me to a daïs, on which were standing Her Highness the
    Ratobe, or `Sultana`, with a number of princesses and ladies of the Court, to
    all of whom we were duly presented.


    The ceremony of presentation was very simple. The Sultan, still continuing the
    cordial manner with which I was greeted on arrival, retained my arm in his, and
    introduced me to each of the ladies in turn. I made a bow, and the ladies responded
    feebly by shaking hands.


    The dresses of the ladies were of a class peculiar to themselves, and I had never
    seen anything of the same kind in any other country. I am not an adept at describing
    ladies’ dresses, so will refer my readers to the photographs in this book for
    further details; these give a realistic idea of the get-up of a Javanese princess.
    Some jewels were worn, and the ladies (especially the Sultan’s daughters) were
    distinctly attractive and refined in appearance.


    ![Image](Images/57.jpeg)

    [THE ENTRANCE TO THE SULTAN’S PALACE, SOLOKARTA.](#009_9781317949527_illustrations.html_ill5-8)


    The ladies were somewhat mechanical in their movements, and their faces were to
    a great extent expressionless; they completely lacked vivacity in manner and appearance.
    On the other hand, they were attractively costumed, and looked daintily fragile
    in their pretty gowns. I was obliged to notice, or the fact was forced on me,
    that the Javanese ladies, had a decided `penchant` for perfumery of diverse kinds;
    and that they are in the habit of using many kinds at one time which produced
    an indescribable odour which resembled the emanation from flowers of the orient
    in which sandal-wood oil predominated.


    ## The Banquet and Court Customs


    The presentations over, we were invited to seat ourselves, with the Sultan and
    Sultana, on some elaborately gilded chairs placed in the front part of the daïs.
    On our right were the princesses, and beyond them were the male members of the
    Sultan’s family. On our left were placed the Resident’s staff and mine. Opposite,
    but some distance from our daïs, were squatted a number of the Sultan’s Ministers
    and officials of the Court; all wore their quaint headdress and distinctive but
    attractive costume.


    The pavilion in which we were seated was of great extent, and capable of accommodating
    a very large number of people; the space, although so large, was fully occupied,
    and largely by ladies of the household and Court. These were dressed in a curtailed
    garment comprising a sarong of the country and a waistband carried up to the under-part
    of the arms, thus leaving the upper part of the body completely exposed.


    I was informed that it would have been contrary to Court etiquette had they appeared
    in less `décolleté` costume. Only the ladies of the Sultan’s family have the privilege
    of covering their bosoms and shoulders. The system of `pardah` (or seclusion of
    women) to which we are accustomed in `India` has no place in `Java`; but although
    the women there do not labour under the disadvantages of that system, they nevertheless
    do not mix in the society of men, and they appear in public only on special occasions;
    their social status is the same as women in all countries.


    ![Image](Images/58.jpeg)

    [THE SULTAN OF SOLOKARTA’S DAUGHTER AND SON-IN-LAW.](#009_9781317949527_illustrations.html_ill5-9)


    Immediately behind the Sultan and Sultana were the former’s female attendants.
    These women were of various ages; one old dame of about sixty attracted my attention
    by muttering blessings on her master. I glanced around and caught her eye, upon
    which she smiled and showered blessings on my head. I was informed that her blessings
    comprised thanks to the Almighty for sent such a distinguished person to visit
    her. From time to time one of the Sultan’s women came forward and massaged his
    legs. The mode of saluting was the same as that practised in the Punjab: both
    hands in contact, with which the forehead was touched. Even the Sultan’s sons
    and chief consort, when addressed by him, responded by a gesture. The code of
    etiquette in these Courts is very strictly adhered to; one detail amused me. It
    is forbidden for servants to approach the Sultan in an upright position; so when
    a thing has been brought, it becomes a feat of gymnastics on the part of the servant,
    who is obliged to come forward to complete their errand.


    His Highness’s titles are as follows:

    `Hingkang Sinoeho`

    `Pakoe Boemono Senopati Ingaloge Rachman`

    `Commander of the Lion of the Netherlands`

    `Grand Cross of the Order of Orange`

    `Grand Order of Cambodia`

    `Grand Order of Siam`

    `Grand Order of Belgium`

    `Major-General in the Netherlands Army`

    `Nail of the Universe`


    On the occasion I am describing he was costumed in a beautifully embroidered jacket
    and a handsome sarong. He also wore a number of jewelled orders of Dutch, French,
    Siamese, and German Governments. During our conversation it was made known to
    me that he possessed other orders so numerous that there was insufficient room
    for them at one time on his tunic. It was in the matter of allowing them to accept
    foreign decorations. The entertainment (which lasted for about an hour) was well
    worth going all the way to `Java` to see only.


    The conversation I had with the Sultan was carried on through the medium of Dutch
    Chief Secretary, who made use of French language for interpretation. I was asked
    to give an opinion as to whether Solokarta Palace entertainment and surroundings
    were or not superior to those of `Djocjokarta`. Answers to such questions I found
    most difficult to give, and parried them in my most diplomatic manner. From our
    host manner, as well as from things I had heard, I gathered that he wasted no
    affection on his neighbour; the rivalry and jealousy between them was a perfectly
    open character. Probably if the Dutch were to remove themselves from `Java`, the
    rival Sultans would be at one another’s throats, and revive the old state of bloodshed
    which existed in the time by.


    ## The Dance


    To describe the entertainment itself is a matter of much difficulty, and to do
    justice to it would require the pen of a writer of Pierre Loti’s ability. The
    scene before me was one of bewitching beauty, and in my experience of the many
    countries in the East which were known to me, unparalleled. First came the musicians
    with their quaint instruments, who took up the places allotted to them. Then followed
    the `corps de ballet`, consisting of about fifty girls all dressed in handsome
    sarongs and low vests. These marched in one-eighth time, two and two, in a languorous
    manner from the back portion of the pavilion, and finally deployed into parallel
    lines opposite the daïs on which we were seated. The girls all belong to the Sultan’s
    family, and are probably related to him. They were good-looking, of slender physique,
    and appeared to range in age from fourteen to eighteen. Their colour is olive
    and their features somewhat Mongolian in type.


    ![Image](Images/59.jpeg)

    [COURT MUSICIANS, SOLOKARTA.](#009_9781317949527_illustrations.html_ill5-10)


    On arriving at the daïs, the girls made an obeisance, kneeling with joined hands,
    and then commenced the dance proper. This consisted of numberless postures, accompanied
    by a slow waving of the arms and corresponding movements of the head; languorous
    progress in certain directions, together with the genuflections described, made
    up the figures of the dance. All this was done by clever movements of the body,
    during which the feet played an inferior part. The figures of the dance were complicated
    and numerous; circles, squares, marches backwards and forwards became after a
    time quite bewildering in their multiplicity. Occasionally one of the female attendants
    was obliged to intrude on the charmed circle of dancers for the purpose of adjusting
    the trailing skirt of one of them, which, being inconveniently long, could not
    be attended to by the wearer.


    The musicians did not confine themselves wholly to instrumental music, as every
    now again they burst out in a wild and weird chant of vocal music, which in character
    reminded me somewhat of the music of our country. My imagination was fired by
    the novelty of the scene in front of me to such an extent that I was mentally
    translated to certain periods described in the `Mahabharata`; my imagination carried
    me to the Court of the Raja Indra, renowned in Indian mythology. However, a glance
    at the black evening dresses and uniforms of the European guests sufficed to remind
    me that I still lived in the twentieth century.


    Upon thanking and complimenting my host on the splendid entertainment he had provided
    for me, he replied that had he known of my visit earlier, he would have turned
    out his `corps de ballet` in its full strength of about two hundred girls.


    ## Departure and Final Observations


    On its conclusion, my host conducted me through a number of his apartments, which
    were furnished and decorated in the style peculiar to `Java`. An article of furniture
    which seemed to be specially venerated was a large, handsome, carved and gilded
    bedstead, used as a sort of royal bridal couch, and which occupied the place of
    honour in a large room behind the reception hall.


    Followed by a number of Court officials, flunkeys and attendants, we made our
    way to one of our host’s favourite summer houses in the garden, where we consumed
    a number of delectable and cooling beverages. We remained for some time. Before
    my departure the Sultan was good enough to present me with a handsome walking-stick,
    mounted in gold, and bearing his monogram worked in the handle. Midnight having
    arrived, we took our departure, after bidding our kind-hearted host farewell,
    and ended what was perhaps the most interesting day I spent in the Far East.


    The next morning, in company with the Sultan’s sons, I spent pleasantly visiting
    his mosque (a commonplace affair). The most interesting part of the latter was
    the `toshakhana`, or treasury, in which I saw sufficient gold and silver plate,
    as well as chinaware, etc., to provide for two hundred guests. Upon expressing
    a wish to see the Sultan’s jewels (which I was told were of exceptional value),
    I was politely informed that owing to some superstition it was considered ill
    omen to show such valuables to visitors, and therefore my desire could not be
    gratified. We next saw the armoury, in which was an interesting collection of
    ancient weapons of no use except as curiosities. Our next move took us to the
    stables, where about one hundred riding animals and fifty carriages were accommodated.
    The stables were managed by a retired Dutch cavalry sergeant in service; he did
    the honours of the establishment. Some horses, fully caparisoned in Javanese fashion,
    which bore much resemblance to `India`, were trotted out for our inspection. These
    wore neither boots nor breeches, who, nevertheless, did not appear to miss them.
    The idea of a review was thus, for obvious reasons, abandoned. In reply to a question
    from me, my informant told me further, with much `naivete`, that the existing
    condition of disorder was due to the policy of the Dutch Government which did
    not like to think of the Sultan being in any respect as efficient as its own.


    ## The Temples and the Influence of Hinduism


    No train being available when our inspection of the temples was finished, we were
    obliged to drive to `Djocjokarta` (about twenty miles away), which we reached
    in time for dinner. An entertainment had been got up in my honour by the Sultan
    of `Djocjokarta` the same night, which the Resident and a number of Dutch officers
    attended. Some civilians also were present. The whole palace was `en fête`, and
    on that occasion the general public were admitted. There must have been many thousands
    present, as the whole of the huge walled enclosure was filled.


    There, as at `Solokarta`, the entertainment chiefly took the form of a ballet,
    and was of much the same type. About twenty girls participated, and they differed
    from those I saw at `Solokarta` in the matter of dress only. They had also applied
    some kind of white pigment to their faces and black to their eyebrows, which were
    continued across the top of the nose, and were made to curl in an extraordinary
    manner over the temples. These young women are taught to dance from a very early
    age, and are made to practise some form of it every day for a certain time. They
    are all connected to the Sultan’s household, and they are offered in marriage
    by the Sultan to men of rank and position at his option. At the conclusion of
    the ballet a dagger dance was given, in which those participating exhibited much
    dexterity in the apparently dangerous manipulation of the daggers.


    Then followed a sort of play, in which was represented an episode of the `Mahabharata`,
    a fight between `Janak` and `Sri Sohella`, in which the mimic warriors were apparelled
    in old-style Hindu costumes. Three enormous temples stand in a circle which includes
    a hundred smaller ones. We entered two of the larger ones, and were immediately
    confronted by the large effigies of the familiar deities of Hinduism; there were
    Vishnu, Shiva, and Ganesha, all in a state of excellent preservation. The temples
    are now in a ruinous condition, but their size and extent serve to give one good
    idea of the hold Hinduism once had on the people of that land, and of the heavy
    expenditure they incurred on the building and ornamentation of their places of
    worship.


    With the exception of some people who live on some islands nearby and still worship
    after the Hindu fashion, that religion has ceased to exist in `Java`. As an example
    of the Hindu influence and weakness of the Dutch Government, it was curious to
    hear that lately one of the princes under the Dutch died; his successor forcibly
    caused the widows to commit `sati`, or self-immolation, on hearing of which the
    Government refused to recognise the successor until he promised that such an occurrence
    should not take place in the future. Other ruins of high importance exist in `Java`;
    but, our time being extremely limited, we were sorry to be unable to visit them.

