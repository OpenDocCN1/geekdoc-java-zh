    ![image](img/0.jpeg) 我在中国、日本和爪哇甲的旅行，1903 年


    这种对中国、日本和爪哇甲的独特视角，是由卡普塔拉的印度王拉吉·拉杰甘·贾加吉特·辛格（Jagatjit Singh）殿下撰写的，作为他对远东短暂访问的记录，并献给他的朋友。这与其说是一本学术分析，不如说是他对所到目的地个人印象和经历的记录。


    拉吉·拉杰甘·贾加吉特·辛格写作于世纪交之际，当时公众的注意力已转向 1904-05 年的俄日战争，当时双方为了争夺朝鲜和满洲的主导权而战。这一背景以及作者的王室身份，使得对该地区的旅行提供了一个特别引人入角的视角。


