    My visit to Tokio having now come to an end, it only remained for me to bid goodbye
    to Sir C. MacDonald and his wife, and to thank them cordially for their many kindnesses
    to me. Their assistance went far to make my stay in Tokio both pleasant and instructive.


    The 11th of December was spent in making an excursion to Lake Biwa, about two
    hours. The lake is a large one, surrounded by low hills, near which a number of
    villages are visible. The whole scene forms quite a panorama, and was well worth
    visit. Lake Biwa derives its name from an earthquake which occurred many centuries
    ago, and stands about 350 feet above sea level.


