    etc., to provide for two hundred guests at one time. Upon my expressing a wish
    to see the Sultan’s jewels (which I was told were of exceptional value and beauty),
    I was politely informed that, owing to some superstition, it was considered of
    ill omen to show such valuables to visitors, and therefore my desire could not
    be gratified.We next saw the armoury, in which was an interesting collection of
    ancient weapons of no use except, of course, as curiosities. The night before
    the Sultan had offered to hold a review of his troops (which he said numbered
    2,000) for my entertainment; but on asking to see them the next morning, I learnt
    that it would take quite a week to collect them, as they were scattered far and
    wide. Moreover, my informant said it would hardly be worth while to summon them,
    as some of the horses had no saddles, and many of the soldiers had guns but no
    uniform, while those who were the happy possessors of uniforms had no guns, and
    so on.The idea of a review was thus, for obvious reasons, abandoned. In reply
    to a question from me, my informant told me further, with much *naïveté*, that
    the existing condition of chaotic disorder was due to the policy of the Dutch
    Government, which did not like to think of the Sultan’s soldiers being in any
    respect as well armed or as efficient as its own.Our next move took us to the
    stables, where about one hundred riding animals and some fifty carriages were
    accommodated. The stables were managed by a retired Dutch cavalry sergeant in
    the Sultan’s service; he did the honours of the establishment when we visited
    it. Some horses, fully caparisoned in the Javanese fashion, which bore much resemblance
    to that prevailing in India, were trotted out for our inspection. These were mounted
    by syces, who wore neither boots nor breeches, who, nevertheless, did not appear
    to miss them much.![Image](Images/60.jpeg)[MEMBERS OF THE SULTAN OF SOLOKARTA’S
    FAMILY IN EUROPEANISED GARB.](#009_9781317949527_illustrations.html_ill5-11)During
    our inspection the old duenna who was so attentive during the ballet the night
    before appeared on the scene loaded with compliments from her master, and, what
    was highly appreciated, a number of cool, refreshing drinks. The old dame was
    extremely polite, and followed us about for the remainder of the morning.The carriage
    stables next had our attention; these also were in charge of an old Dutchman.
    Some of the vehicles we saw were really elaborately and beautifully finished traps;
    but the State coach, which the Sultan on rare occasions used, came in for the
    most admiration. It had been built in Europe about half a century ago, and was
    of the most elaborate kind; it reminded me of the old Versailles coach, and was
    said to have cost 40,000 florins originally.During the afternoon, we left by train,
    and were seen off at the station by the Sultan’s sons and the Ministers. The former,
    I may mention, are quiet and gentle-looking boys; two of them are shortly leaving
    for Holland for their education. They spoke no European language other than Dutch.*En
    route* to Djocjokarta we alighted at a roadside station and paid a hurried visit
    to the Brambanam temples. It was a pity that the visit was such a hurried one,
    as the temples are well worth serious study, and, being of Hindu origin, were
    on this account of peculiar interest to us. Being obliged, however, to reach Djocjokarta
    the same evening, we had no alternative but to curtail a visit which might easily
    and with profit have been prolonged.Three enormous temples stand in a circle,
    which includes a hundred smaller ones. We entered two of the larger ones, and
    were immediately confronted by the large effigies of the familiar deities of Hinduism;
    there were Vishnu, Shiva, and Ganesha, all in a state of excellent preservation.
    The temples are now in a ruinous condition, but their size and extent serve to
    give one a good idea of the hold Hinduism once had on the people of that land,
    and of the heavy expenditure they incurred on the building and ornamentation of
    their places of worship.With the exception of some people who live on some islands
    near by, and who still worship after the Hindu fashion, that religion has ceased
    to exist in Java. As an example of the Hindu influence and weakness of the Dutch
    Government, it was curious to hear that lately one of the princes under the Dutch
    died; his successor forcibly caused the widows to commit *sati*, or self-immolation,
    on hearing of which the Government refused to recognise the successor until he
    promised that such an occurrence should not take place in the future. Other ruins
    of high importance exist in Java; but, our time being extremely limited, we were
    sorry to be unable to visit them.No train being available when our inspection
    of the temples was finished, we were obliged to drive to Djocjokarta (about twenty
    miles away), which we reached in time for dinner. An entertainment had been got
    up in my honour by the Sultan of Djocjokarta the same night, which the Resident
    and a number of Dutch officers attended. Some civilians also were present. The
    whole palace was *en fête*, and on that occasion the general public were admitted.
    There must have been many thousands present, as the whole of the huge walled enclosure
    was filled.There, as at Solokarta, the entertainment chiefly took the form of
    a ballet, and it was of much the same type. About twenty girls participated, and
    they differed from those I saw at Solokarta in the matter of dress only. They
    had also applied some kind of white pigment to their faces and black to their
    eyebrows, which were continued artificially across the top of the nose, and were
    made to curl in an extraordinary manner over the temples.These young women are
    taught to dance from a very early age, and are made to practise some form of it
    every day for a certain time. They are all connected with the Sultan’s household,
    and they are offered in marriage by the Sultan to men of rank and position at
    his option. At the conclusion of the ballet a dagger dance was given, in which
    those participating exhibited much dexterity in the apparently dangerous manipulation
    of the daggers. Then followed a sort of play, in which was represented an episode
    of the Mahabharata, a fight between Janak and Sri Sohella, in which the mimic
    warriors were apparelled in old-style Hindu costumes, and fought fiercely with
    bows and arrows. The combatants in this case were represented by the sons and
    relatives of the Sultan.The force of Hinduism and the deep impression it left
    on the Javanese is strikingly exhibited in another instance by the reverence with
    which they to this day refer to and read the Mahabharata.My neighbour at the entertainment
    was an old Dutch gentleman, who held the post of Government archaeologist. He
    knew every detail of the play being performed, and the information he gave me
    on this subject, as well as on others, was of the highest interest. He had passed
    forty years of his life in Java, and, of course, was most learned on all matters
    connected with the archaeology and history of the island.The Hindu character of
    the play itself, and of my surroundings generally, impressed me greatly, for,
    notwithstanding the Mohammedan religion of my host and his subjects, there appeared
    to be nothing in their manner or habits to give one the idea that one was staying
    in a Mohammedan country. On the contrary, all things, the people, their method
    of salutation, their manners, etc., gave one who had lived in India the impression
    of Hinduism as practised and seen in the South of India, which, by the way, is
    the only part of India which retains its original customs uncontaminated by the
    strong Mohammedan influence perceptible in Central and Northern India. On taking
    leave, the Sultan bade me “salamat”—otherwise safety, or safe journey.On January
    13 we turned our faces homewards, and passed the night at Maos, which place we
    left at the unearthly hour of five in the morning. On reaching Bandong, I was
    surprised to see quite a crowd collected on the platform, and among them I was
    delighted to see a number of Punjabis. They brought fruit and money offerings
    for my acceptance, and there was an obvious effort on their part to give me a
    great reception. I chatted with some of my countrymen present, and discovered,
    to my great astonishment, that two of them were natives of a village near Phagwara,
    and consequently my subjects. I inquired what circumstances had taken them so
    far from their homes, and was informed that originally they went to Java to better
    their condition, and there they had remained. A long, tiresome journey brought
    us to Batavia, where we spent the night in our old quarters at the Hôtel des Indes.![Image](Images/61.jpeg)[S.S
    *ANNAM*](#009_9781317949527_illustrations.html_ill5-12)The business portion of
    Batavia is situated about four miles from the European residential quarter, and
    to the former I made my way during the morning. The place seemed to be very bustling,
    and obviously there was a large amount of business being transacted.Our sojourn
    in Java being at an end, we embarked at Tanjong Priok on board the M.M. steamer
    *La Seyne*, which vessel deals with the traffic between Batavia and Singapore,
    in conjunction with the French mail steamers, bi-monthly. It was pleasant indeed,
    after our late experiences, to find our wants understood, and servants about us
    who were prompt and efficient.At Singapore we were fortunate in securing passages
    by the new and luxurious French steamer *Annam*, on which we embarked on January
    18\. I was further fortunate in meeting a number of people among the passengers
    whom I knew. The voyage during the next four days to Colombo was devoid of incident;
    the weather was cool and pleasant, the sea smooth, and so the time passed agreeably
    enough, the days being filled up in writing my book of travels and reading, while
    the evenings were usually devoted to bridge.The *Annam* reached Colombo at one
    o’clock on January 23; but we did not leave her until eight, and subsequently
    spent the day at the Galle Face Hotel very comfortably. In the afternoon I visited
    my acquaintances M. and Madame Marguerite on board their delightful 500-ton yacht
    the *Ophelie*, in which they had come all the way from Marseilles, and in which
    they were returning after visiting India. At the hotel I met Prince Victor Dhulip
    Singh, who was *en route* to Sumatra after tiger. The remainder of the evening
    was passed pleasantly at the hotel among other birds of passage who were waiting
    their respective steamers, and finally we embarked on the M.M. steamer *Caledonien*
    at midnight, soon after which time we sailed once more.The *Caledonien*, although
    a vessel of only about 4,000 tons, was nevertheless fairly comfortable to travel
    in. There were few passengers. One of them, the Count de Perigni, who had been
    making an extended tour through the East, subsequently travelled with me to Kapurthala,
    where he remained for some time as my guest.We reached Bombay during the afternoon
    of the 26th, where we experienced an annoying delay in getting ashore. There seemed
    to be no reason why the passengers should not have been allowed to disembark,
    as there were plenty of opportunities before the steamer was docked. However,
    after about four hours, we got ashore in Princes’ Dock, whence we proceeded direct
    to the newly built palatial Taj Mahal Palace Hotel, where I was delighted to find
    my four dear sons awaiting my advent. It was indeed pleasing to find them well
    and fit after my long absence.![Image](Images/62.jpeg)[THE KAPURTHALA PRINCES.](#009_9781317949527_illustrations.html_ill5-13)The
    Taj Mahal Hotel is a magnificent place, replete with every modern convenience
    and up-to-date in every respect. India owes a great debt of gratitude to the enterprising
    Parsee, the late Mr. Jamsetjee Tata, whose knowledge of local requirements caused
    him to build an hotel in every way deserving of that name, and one which any city
    in the world might be proud to possess. The tariff, I may add, is on a scale of
    magnificence equalling the building itself!After a few days’ stay in Bombay, during
    which I visited Lord Lamington, the Governor, we proceeded to Kapurthala, which
    place we reached on February 1, after one of the most enjoyable journeys I had
    ever made, extending, as it did, over twenty-five thousand miles, through some
    of the most interesting countries in the world. But, after all, there is no place
    like home, and I was glad to rejoin my people once more. My only regret in connection
    with the journey was that I had, perforce, given such a short time to the study,
    in their own countries, of some of the most conservative as well as the most modern
    people in the Far East.[¹](#015_9781317949527_chapterV.html_fnV_1) One gulden
    equals about Rs.1/80.FINIS![Image](Images/63.gif)'
