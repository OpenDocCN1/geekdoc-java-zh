    # 回忆


    *摘自献给拉尼萨希（Rani Sahiba）的照片*。首先跳的是宫廷舞曲，我有幸与这位迷人的梨本公主（Princess Nashimoto）共舞，她穿着极其精致的*欧式*紫色天鹅绒服装，额头和颈子上佩戴着精美的钻石。午夜，我们来到一间为此专门搭建的临时房间吃晚餐。皇室成员离开后，在向我的主人和迷人的女主人道晚晚后，我也离开了。东京社交界对麦唐纳德夫人（Lady
    MacDonald）经常举办的盛大宴会，以及她对所有社会慈善机构的关切关注表示尽表感激。


    17 日，我访问了著名的芝芝寺，那是首都最美的寺庙。几座寺庙坐落在一个方形区域内，内部装饰规模宏大，由彩绘和镀金的木雕组成。我な主寺时恰逢午间祈祷进行。僧侣和信徒们不时站立或跪下，用低沉的声音重复着佛教咒：“Om
    namo ami Daibutsu”（礼拜佛祖）。据说皇帝每年都会去这些佛教寺庙。


    人们可能不知道，在日本流行着两种宗教：一种是以两种或三种不同形式存在的佛教；另一种是神道教，它是国家或皇帝的宗教。后者很难被称为“宗教”，因为它的主要组成部分是祖先崇拜，辅以一套非常简单的道德准则，其核心原则是将天皇（Mikado）神化。然而，事实上，普通日本人并不为任何种宗教问题烦恼。


    参观完寺庙后，我询问是否可以见主持，并被带入寺院。他非常礼貌地接待了我，并端上了通常的茶（在日语中称为 *O’cha*）。我可以提一下，这种茶是黄色的，且不加牛奶或糖。无论去哪里，无论是在商店还是寺庙，奉上这种茶都是习俗。高僧穿着黄色长袍，看起来非常博学且像个圣者。他带我去看其他僧侣朗诵赞，我觉得那听起来像吠吠赞歌，因为两者都采用了那种低沉、如吟唱般的语调。在祈祷结束时，僧侣们低头合十，就像印度教徒一样。离开时，高僧给了我两份印有日字的佛教仪式书。


    ![Image](img/32.jpeg)

    东京的一座寺庙


    离开寺庙的灵性氛围后，我参加了在帝国酒店举办的一场现代婚礼招待会。这对幸福夫妇属于东京的贵族，婚礼仪式结束后，他们在帝国酒店会合了所有朋友，接受他们的祝福和祝贺。数百位宾客出席了，他们包含了欧洲和日本社会的*精英*。新娘（来自少数基督徒家庭之一）和新郎站在入口迎接客人。祝贺结束后，所有人在场移到另一个房间——我随新娘母亲一同——坐下享用了一顿丰盛的晚餐，晚餐快结束时提议并喝了传统的祝酒，随后宾客离开。


    我可以提到，在日本，婚姻是由媒人安排的，与印度的同阶层人不同，这些媒人在各自的圈子里是有影响力的人。婚姻纽带非常松散，在下层阶级中尤为如此。根据现代法律，男人只能有一个合法妻子；但法律非常松散，男人很常见去登记处，以任何微小的借口请求将妻子的名字从其家庭成员中除除。之后，他总会找另一位更合心意的妻子。妻子对丈夫的从属是完全的。她的首要责任是服从丈夫；第二是服从婆婆；第三是在她成为寡妇后服从她的儿子。


    在我所描述的这场婚礼上，新娘和新郎穿着欧洲服装，但我注意到大多数日本女性坚持穿着自己的服饰。对于日本人来说，欧洲服装只有在宫廷活动中才被视为*必须的着装*，且前段时间发布过一项命令，规定国家典礼上将永久废除日本服饰。这项命令适用于男性也适用于女性。大多数欧洲人和许多日本男性（后者出于经济考虑）对从民族服装变为欧洲服装的改变感到遗憾；但根据我所能收集的所有信息，这种变化的真正原因是（与日本所有趋向西方思想和外表的改变一样），为了培养这样一种印象：外表的相似性会引发心理上的平等感。


    傍晚开车经过城市的一个区域时，我来到了一条宽阔、灯光良好的街道，两旁有两三层的建筑。每栋房子前面都有一个宽敞的平台，由镀金铁栏围着，后部部分装饰华丽并镀了金。在这些围栏内，就像动物园里的野生动物一样，坐着许多打扮得极其妖艳的女性。街道上挤满了男女，因为正值某个节日的纪念日，许多人（包括妇女和女孩）通过铁栅观察那些被囚禁其中的华丽生物来消遣自己。后者无言，静静地坐着，似乎对旁观者的目光无然于。。


    我完全无法理解这一景象的含义，向向导询问后得知在这条街道以及其他一些地方，该阶层的女性都是受到限制的，法律规定没有特殊许可绝不允许离开。我提到的这个区域被称为“吉原”（Yoshiwara）；它反映了世界各地在情感和观念上的差异，体面的中产阶级认为去那里没什么。


    11 月 8 日早晨，我们受邀请参加在保护区举行的一次捕鸭活动，这种活动每年举行一次。不幸的是，那天阴云密布。当所有客人都聚集在帐篷下，准备开始行动时，下雨了，但这并未消灭猎者的热情。捕鸭的方法是独特的：他们从野鸭聚集的大片水域引诱野鸭，在水侧筑起一堵覆盖着植物的矮墙。在墙后，猎者们各就其位，每人拿着一种网。信号一响，猎者们突然站起，野鸭受惊，被敏捷的动作和套上的网迅速捕获。我没有成功捕到鸭，尽管这个过程看起来并不困难。然而，我完全想象这看起来比现实要容易，手部的灵活性对于成功至关重要。捕获的猎物立即被处理，随后被做成午餐，这形成了一个愉快的结尾。在运动间隙，有香槟、茶、巧克力等点心在温暖的帐篷里提供，这种消遣愉快地度过了时光。午餐时间，每位男客都安排了一位女士陪同，午餐在湖中心的一座大亭子里进行，通过一座艺术感的小桥到达那里。安排执行得非常完美：甚至我们的外套和披肩也没有被遗漏；所有的经过了仔细的标记和编号以防混淆。亭子的位置选得很好，确保了各个方向的视野，周围的水域和树木景色极佳。


    一小时的车程将我们带到了上野站，在伊里（Imori）上的陪同下离开。我们晚上到达了宇同宫（Utsonomiya），抵达时有来自皇家卫队的官员和警察接我们。他们把我带到附近的一家酒店，里面的房间是欧式的，我在那里舒适地度过了夜晚。第二天，我乘坐人力车环绕宇同宫镇，然后前往约三英外的操练场。到达时，看不到部队，只有远处的炮声和枪击声是距离的唯一证明。等待后，我被带到某处，在那里见到了长川（Hasegawa）将军，他当时担任皇家卫队的司令。


    随后，敌对双方出现了，我冲过去更清楚地观察。在碰撞时，我发现自己陷入了混战中，双方距离不到五十英尺。战斗以典型的火力对决开始，每一一方都希望击败对方，随后步兵部队发动进攻。观察他们侧击对方并寻找机会掩护是非常有趣的。我看到几乎所有的欧洲士兵都在检阅，从这些日本人的装束来看，很难相信自己身处东方。制服都是法式的，但训练动作模仿了德国人。只有在近距离观察时，差异才显现。战斗很快结束，士兵们立刻成为朋友，并在食物和饮料中欢聚。日本人一定有惊人的耐力，正如我描述的那样，士兵们从凌晨四点到十一点一直武装状态，尽管经历了疲惫的时间，但他们看起来并没有糟糕。从我所见，日本军队很容易供应。每个士兵都配备了一个整洁的小盒子，可以放在背包里。盒子的容量能装下一天的口粮，其中一个格是罐肉，另一个格是米饭。米饭煮得像稠胶或布丁。另一个小格用于放置必不可少的筷子。这种安排的巨大优点在于口粮携带方式精美便携，以及食物本身的浓形态，使得每个士兵一天都能自给自足。


    11 月 19 日早晨，我们受邀请参加在保护区举行的一次捕鸭活动，这种活动每年举行一次。不幸的是，那天阴云密布。当所有客人都聚集在帐篷下，准备开始行动时，下雨了，但这并未消灭猎者的热情。捕鸭的方法是独特的：他们从野鸭聚集的大片水域引诱野鸭，在水侧筑起一堵覆盖着植物的矮墙。在墙后，猎者们各就其位，每人拿着一种网。信号一响，猎者们突然站起，野鸭受惊，被敏捷的动作和套上的网迅速捕获。我没有成功捕到鸭，尽管这个过程看起来并不困难。然而，我完全想象这看起来比现实要容易，手部的灵活性对于成功至关重要。捕获的猎物立即被处理，随后被做成午餐，这形成了一个愉快的结尾。在运动间隙，有香槟、茶、巧克力等点心在温暖的帐篷里提供，这种消遣愉快地度过了时光。午餐时间，每位男客都安排了一位女士陪同，午餐在湖中心的一座大亭子里进行，通过一座艺术感的小桥到达那里。安排执行得非常完美：甚至我们的外套和披肩也没有被遗漏；所有的经过了仔细的标记和编号以防混淆。亭子的位置选得很好，确保了各个方向的视野，周围的水域和树木景色极佳。


