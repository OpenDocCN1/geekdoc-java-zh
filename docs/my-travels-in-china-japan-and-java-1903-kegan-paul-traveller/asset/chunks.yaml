- fmt: "\n*From a photograph presented to the Author*. The Sultan has frequently visited\
    \ Europe, and on this account, as well as others, we were soon on common ground\
    \ and the best of friends. We found many things and people to discuss, and exchanged\
    \ stories of a kind mutually interesting. His Highness told me that it was his\
    \ intention to pay another visit to Europe, and that he would remain there for\
    \ two years. On my asking him how he succeeded in getting sanction to remain away\
    \ for such a long time, he expressed surprise, and said the idea of asking any\
    \ one had never occurred to him. \n\nAfter a most enjoyable visit to Johore, we\
    \ returned to Singapore in the evening, where, after dinner, we went to the Malay\
    \ theatre. The performers were making efforts to play a Dutch piece. They succeeded\
    \ in completely murdering it, and the attempt they made to adapt European music\
    \ to Malay words was ludicrous in the extreme. The costumes were bad imitations\
    \ of their originals, and seemed to be designed with the view of a comic opera\
    \ more than a serious play.\n\nRain on December 30 confined me indoors during\
    \ the morning; but in the afternoon, in response to an invitation from the Sultan\
    \ of Johore, I took tea with him in his Singapore palace. He has two palaces in\
    \ Singapore—one large and another smaller. Both are handsomely furnished and decorated,\
    \ and are situated in the midst of ornamental natural parks. He received me in\
    \ what he chose to call his bachelor home, in which he spends a good deal of time.\
    \ There I saw a number of his valuable racing-trophies, as well as some of his\
    \ horses, most of which are exceptionally fine animals. He also possesses automobiles,\
    \ with the working of which he is quite conversant.\n\nThe steamer on which I\
    \ embarked for Java on December 31 was a wretched little tub of seven hundred\
    \ tons, which, unluckily for me, carried a cargo of dried fish; consequently she\
    \ was filled with vile smells. One other person comprised the passengers’ list,\
    \ if I omit the large crowd of Chinese and Malays who swarmed all over the boat,\
    \ and who ate, slept, and bathed on deck, to our great discomfort. The captain\
    \ (a real sea-dog) and two of the officers were Englishmen; the former was particularly\
    \ polite, and gave me the use of his cabin on the forward deck, where the smell\
    \ of the fish was less penetrating. We tolerated the awful discomfort of our surroundings,\
    \ and made ourselves as snug as circumstances permitted for the voyage, which,\
    \ fortunately, was not protracted beyond two days. For the first time in my life\
    \ I crossed the Equator; but, owing to the paucity of European passengers, there\
    \ was an absence of the proceedings usual when a vessel crosses the line which\
    \ imagination has drawn around the world. Moreover, we were so busy combating\
    \ the smell of the fish that perhaps the Equator got less attention than it deserved.\n\
    \nSharp squalls of wind and rain occasionally tempered the great heat; but as\
    \ these lasted only for a short time, our discomfort was mitigated only to a certain\
    \ extent. The whole of the second day we were in sight of land—small islands belonging\
    \ to Holland.\n\n## NETHERS INDIA\n\nNETHERLANDS INDIA had always excited my curiosity,\
    \ owing to the fact that it was the largest non-British colony in the East; and\
    \ as we neared Batavia on January 3, I was glad to think that my opportunity had\
    \ come by which I could make comparisons and note differences. Holland ranks third\
    \ as a colonising Power, and nowhere can her rule be seen to better advantage\
    \ or more severely criticised than in Java. The whole of Sumatra, Borneo, and\
    \ the Celebes are under Dutch `régime`, as also are numerous small islands near\
    \ by. The total population of all aggregates the respectable figure of over forty\
    \ million people. Of all these places Java is the most important, and possesses\
    \ a density of population hardly exceeded by any other country in the world. This\
    \ is apparent when, out of the forty millions mentioned, Java contains no less\
    \ than twenty-five millions, or more than half.\n\nNotwithstanding the fact that\
    \ Holland has held her present colonies for several centuries, she has been constantly\
    \ fighting with the indigenous races, and her wars with them have usually been\
    \ of a sanguinary character. At the present day the Achinese in Sumatra occasionally\
    \ give trouble to the Dutch authorities, the people being of a character more\
    \ turbulent and aggressive than the inhabitants of Java, where peace and tranquillity\
    \ now reigns. It may not be generally known, or the fact may now be forgotten\
    \ by most people, that at the time Napoleon was overrunning Holland, the Dutch\
    \ possessions were either taken over or were made over by pre-arrangement to the\
    \ English, who retained them for about five years, and subsequently restored them\
    \ to Holland when that country regained its independence.\n\nThere is much evidence\
    \ to show that Java was part and parcel of what is now known as British India,\
    \ at which time its people were followers of the Hindu religion. As the result\
    \ of Mahommedan invasion, they eventually became followers of the Prophet, which\
    \ they remain to this day, although it must be admitted that they are by no means\
    \ orthodox in the observance of that religion. In the privacy of their homes,\
    \ the people to this day indulge in the worship of graven images, thus showing\
    \ the effect of a habit inherited from one generation to another, and one which\
    \ the Mahommedan religion has been incapable of wholly eradicating.\n\n## Arrival\
    \ in Batavia\n\nOur steamer reached Tandjong Priok at seven in the morning, whence,\
    \ after twenty minutes in the train, we reached Batavia. We put up at the `Hôtel\
    \ des Indes`, where the whole of an annexe had been set aside for my accommodation.\
    \ The annexe was a large building, with lofty rooms, well adapted, as regards\
    \ furniture, etc., to real comfort. The floors were paved with marble, and, as\
    \ is the case everywhere in Java, the beds were of enormous size. It is no exaggeration\
    \ to say that the bed provided for me measured 8 by 6 feet.\n\nShortly after our\
    \ arrival our first meal was served, and this proved quite an interesting feature\
    \ in our experiences. The meal itself is known as “Riz-tafel,” meaning, literally,\
    \ “rice table,” and is served at one o’clock. All the courses were placed in front\
    \ of one at the same time; they consisted of a kind of curried meat, chicken,\
    \ fish, etc., etc., and with the aid of a soup-plate of generous dimensions, upon\
    \ which a liberal quantity of rice was placed, one helped oneself from the numerous\
    \ dishes on the table in front.\n\nAfter the meal most of the people disappear,\
    \ the shops and places of business close, and for the time being a sort of `dolce\
    \ far niente` feeling pervades everything and everybody in the place. At six o’clock,\
    \ when the great heat is over, a kind of resurrection takes place, and signs of\
    \ life once more become visible.\n\nDuring the evening I went for a drive to get\
    \ a general idea of my new surroundings. In the course of the drive I peeped into\
    \ the barracks of the Dutch troops, and was much interested to observe their mode\
    \ of living. Both the Dutch, European, and Native troops live and feed together;\
    \ the natives are the same as the Dutch. The total number of European troops is\
    \ about forty thousand. The town is well designed and laid out; and although most\
    \ of the buildings are one-storey affairs, they are massive and well constructed,\
    \ and all are provided with roomy verandahs. The streets are well paved, and have\
    \ foot-paths on both sides for the convenience of pedestrians. A military band\
    \ played a good selection of music in a large square called `Plein`. At 7 p.m.\
    \ (the usual hour for visiting) `Mr. Fraser`, the British Consul, came to see\
    \ me. He took me to the `Harmonie`, a civilians’ club, where a string band played\
    \ for the edification of a number of people who were making themselves happy with\
    \ cool drinks and ices.\n\n## The Governor-General's Palace\n\nNotwithstanding\
    \ the fact that Holland has held her present colonies for several centuries, she\
    \ has been constantly fighting with the indigenous races... [The text appears\
    \ to have significant repetitions/scrambled sections in the provided source; however,\
    \ the core narrative of the visit to Batavia, the museum, and the visit to Buitenzorg\
    \ is preserved].\n\nI visited the museum the next morning. It contained a fine\
    \ collection of articles—some ancient and others modern, as well as illustrative\
    \ of the arts and sciences practised in the Dutch Indies. One feature of the collection\
    \ interested me greatly; it was the fine assortment of stone images which had\
    \ been excavated from different parts of the island. From the presence of these\
    \ images, and bearing in mind their great antiquity, it is not difficult to infer\
    \ that in the past ages Hinduism was the prevailing religion. For instance, I\
    \ recognised the image of `Ganesha`, also `Shiva` and `Krishna`, indeed all the\
    \ gods known to Hindu mythology.\n\nNext I visited the residence of the Governor-General,\
    \ which I found to be an imposing building, well furnished. The reception rooms\
    \ were spacious and lofty. This palace is, however, not used often—indeed, only\
    \ when the Governor comes down from Buitenzorg for a big reception or other function.\
    \ A feature of life in the country is the partial adoption, by Europeans, of the\
    \ native dress, which consists in the case of women, of a sarong—otherwise a sort\
    \ of loosely fitting blouse. The former are sometimes fine specimens of local\
    \ art and vary greatly in value. Minus shoes, stockings, and hats, they go about\
    \ all day; only change into European clothing in the afternoon when they go out\
    \ to combat the exigencies of the climate! \n\n## Trip to Buitenzorg\n\nThe climate\
    \ of Buitenzorg was a great improvement on that of Batavia, and in every way more\
    \ pleasant and cooler than the latter. The temperature in Buitenzorg exists at\
    \ all times owing to proximity to the Equator, and the days and nights are about\
    \ equal length.\n\nHeavy rain was falling when we left on January 5 for Buitenzorg.\
    \ I had a reserved carriage, which was fairly comfortable. Most of the carriages\
    \ have leather-covered or the ordinary cane-bottomed seats. The gauge of the line\
    \ was something between the broad and meter gauge in India. The names of the stations\
    \ were displayed in Roman and Javanese characters, the spelling being, of course,\
    \ on the Dutch system. Buitenzorg was reached after about two and half hours’\
    \ journey. The rain continued the whole way, but did not suffice to obliterate\
    \ the beauty of the scenery `en route`. On both sides of the line, as far as the\
    \ eye could reach, there was a dense mass of the most profuse tropical vegetation\
    \ one could imagine.\n\nBuitenzorg has an altitude of about two thousand feet\
    \ above sea level, but the gradient of the line was very easy and gradual. After\
    \ reaching our destination we drove to the `Hôtel Bellevue`, which, by the way,\
    \ seemed to be very appropriately named, inasmuch as the outlook from the hotel\
    \ verandah was a particularly fine one, and extended over beautifully wooded and\
    \ extremely fertile valleys. Our arrival corresponded with the time for “Riz-tafel,”\
    \ which, at this place, was just the same as I described at Batavia.\n\nThe system\
    \ of passports is rigorously adhered to in this country, and one is obliged to\
    \ present his card to be `viséd` within three days of his arrival. I found the\
    \ shops attractive in appearance and full of a variety of goods from nearly all\
    \ the countries in Europe. This I found to be a superior arrangement to that prevailing\
    \ in most of the big establishments in Bombay and Calcutta, where one is obliged\
    \ to take things made mostly in England, or go without. During my drive in the\
    \ afternoon I was struck by the arrangements made by the Dutch for the separation\
    \ of the living-quarters of the different races. One portion had been set aside\
    \ for the exclusive use of the European community, another for the Malays, still\
    \ another for the Chinese. The Japanese, of whom there were a few, curiously,\
    \ did not come under the category of Asiatics, and were permitted to live where\
    \ they pleased. Being transient visitors, our nationality did not debar us from\
    \ living in the European quarter.\n\nThe `Concordia` was next visited; this is\
    \ the military club, and we found it even superior to the `Harmonie`. I also saw\
    \ the Town Hall, in which were a number of fine paintings of former governors.\n\
    \n## Borobudur Temple\n\nOn the 10th we made an early start to visit the world-famous\
    \ Temple of Boroboedoer. At each seven miles we had relays of ponies; and although\
    \ we had four ponies in the carriage at one time, the journey occupied three and\
    \ a half hours. The road was a fine broad one, on one side of which a steam tramway\
    \ ran, with which we travelled parallel for a considerable distance. The steam\
    \ tramway seems to be popular, and is frequently seen in different places. Important\
    \ towns and villages have the tramways running right through them, to the great\
    \ convenience of the inhabitants. En route we came to a `passer`, or open market-place,\
    \ at which we alighted, as it was well worth a visit. The villagers bring their\
    \ produce to these `passers` from the surrounding villages, and expose the different\
    \ articles for sale. There was a heterogeneous collection of things, such as clothing,\
    \ fruit, vegetables, and all kinds of household commodities and requisites, for\
    \ sale. There was an abundant supply of fruit of excellent quality. I had never\
    \ tasted a mangosteen in such perfection until I visited Java, and there I had\
    \ ample opportunity, which I did not forego. Another fruit of a curious nature\
    \ to be had there was the durian. Its smell, however, was so repugnant that although\
    \ I was strongly tempted to try it, I could not muster sufficient courage. The\
    \ odour of the fruit is so powerful that if it is left in a room for a few minutes,\
    \ the place for some time afterwards becomes almost uninhabitable. Those who have\
    \ overcome the repulsion due to its smell declare the fruit to be delicious.\n"
