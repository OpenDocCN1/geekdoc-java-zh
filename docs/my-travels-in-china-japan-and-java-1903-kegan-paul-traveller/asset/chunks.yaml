    The men when I saw them were in Field Service kit, and although travel-stained
    after their arduous work that morning, they looked uncommonly fit, and seemed
    quite up to any enterprise. At the termination of the parade I said good-bye to
    the General Officer Commanding and to some of the officers present, and proceeded
    to the station in time to catch the train for Tokio, which place we reached rather
    late for dinner.The morning of the 20th I devoted to visiting the great Imperial
    University, which was several miles distant from the Imperial Hotel. I was accompanied
    by one of the secretaries of the British Legation, and on arrival was received
    by the director and several officers of the university, under whose guidance we
    commenced a tour of inspection. The university is divided into several large blocks,
    each of which is devoted to a separate subject. I saw the department of languages,
    where in different rooms were professors who taught French, German, and English.Each
    professor was a native of the country whose language he taught; English, however,
    was taught by an American. I listened for a time to the French professor imparting
    instruction, and was amused at the efforts of his pupils to acquire correct pronunciation;
    their knowledge was otherwise fairly correct. Out of a large staff of professors,
    those teaching languages were the only foreigners; all the others were natives
    of Japan, most of whom had studied the higher branches of their subject either
    in Europe or America. The comprehensive nature of the subjects being taught struck
    me as being remarkable, and I could not avoid making comparisons with my own country,
    inasmuch as it had never before occurred to me that the instruction I saw being
    imparted could be acquired out of Europe.The progress these Japanese have made
    during the past thirty years in the arts and sciences is simply amazing. Here
    I saw halls filled with eager students, working hard on such subjects as naval
    architecture, civil engineering, the manufacture of ordnance and ammunition, telegraphy,
    electrical engineering in all its branches, shipbuilding, and many other subjects
    of the highest importance to the prosperity of a rising nation. Among the students
    I was surprised to notice two from Nepal, who had been sent there by the Nepalese
    Government.In each department of the Imperial College I found the most complete
    sets of designs and models of all kinds. This was particularly so in the matter
    of naval architecture, which branch was replete with scale models of all the most
    recent designs of battleships, cruisers, destroyers, torpedo-boats, etc., etc.The
    reason for the present importance of Japan among the nations of the world is not
    far to seek. In order to acquire the knowledge of the arts and sciences which
    the people lacked, the Japanese Government sent several hundred students to the
    best seats of learning in Europe and America. There they got the knowledge they
    needed, and on their return to their native land appointments from among them
    were made, in order that their knowledge might be disseminated. This process was
    repeated year after year in a decreasing ratio, until at this time there is less
    need to send students to Europe, except perhaps for the purpose of original research
    and in order to keep the colleges and institutions in Japan well posted and up-to-date
    in all new inventions and things modern.The Japanese seem to have passed all the
    Western arts and sciences in review, and to have adopted from among them all that
    is good, while they have had the discrimination to reject that which is bad or
    indifferent. In the matter of medical as well as some other sciences, they have
    followed the lead of Germany; similarly for naval architecture they have adopted
    the English system as a model. Again, in matters military and legal they have
    copied the German and French systems respectively, while the mechanical arts in
    Japan are largely the result of American initiative. After having studied the
    various systems in the different countries famous for a particular speciality,
    they have adopted that portion only which in their impartial opinion is good,
    and at the present time they are piecing together, as it were, all the various
    parts of the whole, and evolving a system in each branch of industry of their
    own. It remains to be seen how far their judgment is reliable, but from results
    already achieved it would seem that the Japanese do not lack the power of accurate
    discrimination.My visit to this interesting and highly important institution was
    terminated by a short inspection of the library attached to the university. It
    contained many thousand volumes in different languages on a variety of scientific
    subjects, and must be found an invaluable aid to the students in their search
    for knowledge. In this place also I saw the great Sanskrit collection of the late
    Professor Max Müller, which had been purchased by a wealthy Japanese philanthropist
    and presented to the college.Two hours’ hard work on my part sufficed to give
    me only a general and cursory idea of all the marvels of this truly wonderful
    seat of learning; other engagements compelled me to curtail a pleasure which I
    found full of interest and pregnant with meaning for the future of Japan. To have
    seen the place in a really thorough manner would have taken up the whole of the
    day.My next place of call was the High Court of Justice. On my arrival I was met
    by Sir Claude MacDonald, who, together with some Japanese officials, was good
    enough to conduct me through the building, which, although imposing and substantial
    enough in appearance, lacked the amount of ornate decoration one is accustomed
    to see in similar places in Europe. The judges were all collected in their large
    reception-room, where I was formally received by them with the usual number of
    low bows and smiles. After taking our seats, tea as a matter of course was served;
    this act of politeness demanded that we should partake of it, no matter whether
    we liked it or not.Tea over, I was conducted to the different courts where the
    judges who had just been entertaining me were sitting ready to hear their cases.
    The gown and a peculiar hat were worn by all of them. In each case the place of
    honour on the Bench was given to me, and I listened to the proceedings, which,
    owing to my ignorance of the Japanese language, I was not able to grasp. The cases
    were tried, and the judgments and records were all done in the Japanese language.After
    a morning profitably and interestingly spent in sight-seeing, I had *déjeûner*
    at a Japanese restaurant charmingly situated on an eminence overlooking and commanding
    a fine view of Tokio. Breakfast finished, I went to see a great prison some seven
    miles out of the town. At the entrance I was received by the chief warder, who
    regaled me with tea, and then conducted me through the wards of the huge establishments.The
    arrangements and organisation I found to be perfect; the detail would easily bear
    favourable comparison with the best establishments of a similar kind in any country
    in the world. There were probably about two thousand people incarcerated in the
    jail, all of whom were at the time of my visit busily engaged in their various
    occupations. Basket-weaving, as well as the making of brooms and mats, seemed
    to be the principal things being done, and at these the prisoners were adepts.
    Their dress consisted of a distinctive costume of a yellowish colour, and it was
    noticeable that fetters were in no case resorted to as a means of securing the
    men. On our entering the different wards, the prisoners, at a word of command,
    ceased working; at another order they simultaneously bowed low, and on a final
    order being given, they resumed work.The thing which attracted my attention most
    in connection with the prisoners was their appearance; in jails one instinctively
    looks for, and finds, a type of physiognomy indicative of a low or villainous
    species of humanity. Indeed, the so-called “criminal type” in Europe is well known
    and understood, but among these Japanese prisoners there was nothing in their
    features or appearance to show or to hint that they were other than peaceful,
    law-abiding citizens.On going through the jail yard it was difficult to conceive
    that the prisoners were men under restraint: they were all working with an apparent
    good will, and seemed to be content with their lot, as far as one could judge
    from external appearance; and, above all, the jail-birds had not lost their native
    politeness, which asserted itself by the exhibition of a deferential bow whenever
    one passed them. Inquiry elicited the information that capital punishment was
    rarely resorted to, and that the crime of murder was comparatively rare: by this
    it must be understood that murder is not always punished by death, the extreme
    penalty being inflicted only in special cases, and is then effected by decapitation.The
    living-quarters of the prisoners attracted my attention by the excellence of their
    arrangement and design: three men slept in one cubicle, attached to which are
    the usual modern sanitary appliances; and the whole gave one the idea that the
    place was a model of its kind. The prisoners were also provided with spacious
    plunge-baths, of which they make good use three times a week. Cleanliness is held
    in high esteem in Japan: even the coolies bathe daily! The prisoners are provided
    with an abundance of plain, wholesome food twice daily, consisting of rice, fish,
    and occasionally meat.![Image](Images/33.jpeg)[A VIEW IN UYENO PARK, TOKIO.](#009_9781317949527_illustrations.html_ill3-15)I
    concluded my day by dining with Mr. and Mrs. Barclay; the former is first secretary
    to the British Legation, and his wife a charming American. These were old acquaintances;
    I met them first in Rome during my first visit to Europe, when he was attached
    to the British Embassy. A select party was invited to meet me; it included Viscount
    Aoki, one of the foremost Japanese statesmen: he had married a German lady.On
    the 21st I had *déjeûner* at a Japanese restaurant in Ueno Park with a celebrated
    German physician, Dr. Baelz, who is an old resident of Japan and well acquainted
    with every one in the country, from the Emperor to the peasantry. Although in
    private practice, Dr. Baelz is the recipient of a handsome retaining fee from
    the Imperial Family, whom he attends regularly.I found the doctor a most interesting
    companion, owing to his intimate knowledge of the country and people and to the
    freedom with which he expressed his opinions and imparted his experiences. My
    conversation with him was most instructive, and I gained more information from
    him in a short time than I would otherwise have got from the people of the country
    during the whole of my trip.I found the Japanese either reluctant to give information
    or indifferent to the inquiries of foreigners. When one asked a question, it was
    usually answered by a bow or a smile, or the person interrogated evinced great
    readiness to acquiesce in all one said or thought. I cannot recall a Japanese
    (with one exception) who willingly volunteered information or responded to questions
    on an important topic.Dr. Baelz has a most intimate connection with the Emperor,
    who exhibited his confidence in him by entrusting the care of the Crown Prince
    to him. The latter was formerly of a very delicate temperament, and the utmost
    care and skill were requisite to improve his health; thus Dr. Baelz had no sinecure;
    but he succeeded, however, in completely restoring the Crown Prince from a condition
    of serious bad health to one of comparative robustness; and when the time came
    for his patient to be married, Dr. Baelz was consulted on this delicate and important
    matter. So bad was the Crown Prince’s health that at times it was feared that
    the direct line of male heirs to the Japanese throne would become extinct; happily
    this condition of affairs had been averted, and the young Prince is now the proud
    father of three sons.In the grounds of the Ueno Park there is an Imperial Museum,
    over which Dr. Baelz was good enough to conduct me after breakfast. The building
    is somewhat in the Indian style, inasmuch as the usual minaret, known to every
    traveller in India, formed one of the leading features of the external decoration.
    There was a good collection of Japanese antiquities to be seen, as well as some
    extraordinary sedan chairs and old-fashioned vehicles designed to be drawn by
    bullocks. These were used in the olden time by the Imperial Family and the aristocracy
    of the country. I was surprised to see some stone figures and statues which had
    been unearthed in Japan, and which evidently were of great antiquity. Each one
    bore an inscription in Sanskrit, and on close examination it became quite clear
    that the statues had either been sent from India or were imitations made from
    descriptions given by travellers from that country. In any case, whatever their
    origin, the statues were objects of the greatest interest and curiosity.My attention
    was next attracted to an exhibition of Japanese paintings and industries. The
    artistic rendering of all the subjects depicted was evident, but the style was
    of course essentially Japanese. I indulged my taste for art by making a few purchases.
    Time had passed so pleasantly and quickly that it was with some regret that I
    commenced my journey to the holy city of Nikko, which place we reached at 9 p.m.Nikko
    being in the mountains, and somewhat higher than we had been accustomed to during
    the time preceding our visit, we found the cold intense during our drive in ’rickshaws
    from the station to the Kanaya Hotel, at which place we were hospitably received
    and well treated. The discussion of a *recherché* dinner, well cooked and served
    by charmingly dainty Japanese maidens, soon dispelled the cold discomfort of the
    drive. I think the novelty of being waited on by Japanese waitresses will never
    wholly disappear. They glide about in a perfectly noiseless manner, they are distinctly
    polite, and their national costumes lend them an air of picturesque charm difficult
    to describe. The hotel was managed entirely by Japanese, and its cleanliness and
    comfort were all that could be desired.![Image](Images/34.jpeg)[SOME JAPANESE
    ’RICKSHAWS, WITH THEIR FAIR OCCUPANTS.](#009_9781317949527_illustrations.html_ill3-16)The
    22nd of November was wholly occupied in making an excursion to Chuzenji, the Simla
    of Japan. The journey by ’rickshaws took three hours to complete. The road, which
    was fairly good, passed through fine mountain scenery, and we saw some beautiful
    waterfalls *en route*. The imposing grandeur of the Himalayas or Alps was absent;
    nevertheless, the scenery was pretty of its kind. The ’rickshaw coolies were wonderfully
    strong; one man alone managed the ’rickshaw, and only when the road became very
    steep was the assistance of another called for. A trip of twenty miles at top
    speed is of ordinary occurrence to them. With a single man this performance seemed
    to be wonderful to me.As the end of the journey approached, the road gradually
    became steeper, and wound in and out of the hills. We passed a number of tea-houses
    on the way, at which the ’rickshaw coolies refreshed themselves, while we took
    advantage of the stop-pages to admire the remaining autumn tints which still lingered
    on the maple-trees. Had we been there three weeks earlier, the tints would have
    appeared in their full perfection. Standing on the edge of the precipice, one
    got a view several miles in extent of the really fine trees which had just shed
    their leaves. Some vestige, however, remained, and judging from these, it was
    not difficult to imagine the very fine spectacle which must have been presented
    when the trees were in the full glory of their autumn colour. The sight is one
    which takes numerous people to this place alone, as it is worth a visit for this
    reason, if for no other.A stiff climb took us to Chuzenji, where we put up in
    a little wooden hotel called the Lakeside, and refreshed ourselves with lunch,
    served, as usual, by delightful Japanese waitresses. Owing to the altitude (about
    four thousand feet) and to the season, we found the cold bitter indeed. Chuzenji
    is a favourite resort of the foreign Ministers during the three summer months,
    at which time the climate is very pleasant, although sometimes wet. A lake, the
    banks of which are well wooded, is one of the attractions of the place, and picturesquely
    situated in the woods are the huts occupied by the European visitors. Our visit
    was curtailed owing to threatening weather; but before leaving, we saw all there
    was to be seen. Three hours sufficed for our return, and the remainder of the
    day I passed quietly.![Image](Images/35.jpeg)[A VIEW OF THE CASTLE MOAT, WITH
    THE WAR OFFICES, TOKIO.](#009_9781317949527_illustrations.html_ill3-17)The following
    day (November 23) was spent in sightseeing in Nikko itself. I may mention that
    Nikko is a double glory of nature and of art. Mountains, cascades, monumental
    trees, etc., have always been there. Its altitude of two thousand feet, together
    with its beautiful natural surroundings, all tend to make it unrivalled from the
    scenic point of view. It is famous also for its temples, and it is inconceivable
    to imagine anything more beautiful than the walks through the hills, where one
    sees magnificent avenues of cryptomaria trees. The place has a high reputation
    as a health resort but suffers from the drawback of a somewhat wet climate.During
    the day I visited three of the principal temples, at one of which the high-priest
    kindly took me into the innermost and most sacred recesses, where few foreigners
    were permitted to go. There the head-priest explained a great deal to us, and
    gave us some of the sacred water to drink. The Nikko temples (the finest in Japan)
    are nearly all Buddhist; but there are a few Shinto. In June great festivals are
    held at the temples, and picturesque processions are formed by the people, who,
    for the time being, wholly abandon themselves to rejoicing and pleasure. Nikko
    is also the resort of some members of the Imperial Family during the summer months.On
    rising the next morning I was enchanted to find that a change in the weather had
    made it delightfully cold and bracing. The bright sky, after the past few days’
    dulness, was particularly welcome; the drop in the temperature had reached freezing-point,
    and this was the cause of the hillsides being covered with a thick coating of
    hoar frost—a beautiful sight indeed. A brisk walk through some of the prettiest
    places sharpened my appetite for lunch, after which I left for Tokio, where I
    arrived at seven in the evening.My birthday fell on this day—November 25—and the
    same day had been fixed for my audience with the Emperor; so I proceeded to the
    Imperial Palace, where I was met by Sir Claude MacDonald, who kindly accompanied
    me when I was presented to the Emperor. The Imperial Palace occupies an extensive
    piece of ground, and is surrounded by a large and deep moat. At each entrance
    to the palace there are bridges which lead up to very large and massive iron gates,
    at each of which guards are posted. The buildings and the surroundings are all
    in the Japanese style. In all there are three enormous enclosures, to the first
    of which only is the public admitted.![Image](Images/36.jpeg)[THE OUTER ENTRANCE
    TO THE IMPERIAL PALACE, TOKIO.](#009_9781317949527_illustrations.html_ill3-18)On
    reaching the Palace, I was met by one of the Court officials, who conducted me
    through some long corridors to the large rooms, of magnificent proportions, set
    aside for the purpose of receptions. Soon after my arrival the Baron Sannomiya
    entered the apartment, and informed me of the Emperor’s readiness to receive me;
    we followed the Baron to an apartment close by, where the Emperor advanced to
    the threshold to meet me. Baron Sannomiya introduced me, upon which the Emperor
    shook my hand and conducted me a few paces into the room. During the whole of
    the interview the Emperor stood in front of a chair of State, behind which were
    a number of officials also standing.The Emperor knows no European language, so
    Baron Sannomiya acted as interpreter; this necessarily made the conversation rather
    stilted. Nevertheless, His Majesty asked me if I had enjoyed my visit to Japan,
    if I liked the country, and if I had caught any duck at the duck-hunt a few days
    before. When my replies to his questions were translated, the Emperor gave vent
    to a loud “Ha-Ha-Hum-Hum.” It appears that this “Ha-Ha,” etc., etc., was merely
    indicative of satisfaction or acquiescence in one’s reply, and is a common trait
    with Japanese. A few more commonplaces closed the interview, just before which
    Sir C. MacDonald was presented and shaken hands with, as were two of my staff
    who were with me.The Emperor appeared to be of middle age and medium stature;
    on the occasion of my visit he was got up in a plain dark military uniform without
    decorations. His uniform, by the way, seemed to have been made by guesswork as
    regards its dimensions; this is not to be wondered at when one bears in mind common
    gossip to the effect that, owing to the sanctity of his person, no one of his
    subjects is permitted to touch him.On my departure, His Majesty accompanied me
    as far as the door of the apartment, and there shook hands with me and wished
    me goodbye, at the same time bowing several times. His Majesty’s manner and bearing
    towards me were indicative of unusual cordiality, and I have it on the authority
    of Sir Claude MacDonald that I had been treated with exceptional consideration
    and honour.![Image](Images/37.jpeg)[HIS IMPERIAL MAJESTY THE EMPEROR OF JAPAN,
    WITH FACSIMILE SIGNATURE.](#009_9781317949527_illustrations.html_ill3-19)'
