    some miles away from Kioto. There we found three small tea-houses built for the
    use of the Imperial Family when they visited the place. The garden, beautifully
    situated, was a good example of what the Japanese can do in the matter of landscape
    effects.The Geisha School is well worth a visit. There the fascinating *geisha*
    is taught the clever art of pleasing and other elegant accomplishments, such as
    singing and dancing, as well as floral decoration. The primary lesson to be learnt
    by the budding *geisha* is to be pleasing in manner, and particularly so in the
    company of the opposite sex. The school comprises a number of rooms, each of which
    is devoted to the teaching of a different subject. For instance, in one room we
    saw the tiny children learning to dance; in another they were having lessons in
    instrumental music, and so on. The education of these children commences at a
    very early age, and is always conducted by elderly women. The pupils appeared
    to be of all ages from the smallest to fully grown young women.One of the sights
    of Kioto, or indeed of the whole of Japan, is a dance known as the Miyako-o-dori,
    which is usually performed in the spring-time, when Nature revives after the winter.
    The dance is probably symbolical of some such resuscitation, as it is indulged
    in only when the winter is over and the leaves reappear. I felt disappointed to
    think that my visit to Japan, being in the autumn, would probably deprive me of
    the enjoyment of one of the best sights in the country. Moreover, my imagination
    had been fired by hearing many descriptions of this dance, and finally I found
    the temptation to witness it so strong that with the help of influential people
    I set to work to overcome the conservative prejudice of our Japanese friends to
    anything out of season, and finally managed to arrange the matter satisfactorily.
    This was, however, done only after much difficulty. The dance came off with great
    *éclat* in one of the best tea-houses in the place. A special selection of the
    best and most charming *geishas* was made, and the place was profusely decorated
    with bunting and lanterns of divers patterns and colours. Some thoughtful person
    even went so far as to add my coat-of-arms, as a decorative item to the lanterns.![Image](Images/45.jpeg)[GEISHAS
    HOLIDAY-MAKING.](#009_9781317949527_illustrations.html_ill3-27)One end of the
    room was arranged with a number of luxurious cushions, placed on the floor for
    the accommodation of myself and party. After we had taken our places the dance
    began.The first item was a general advance by the whole *corps de ballet* to a
    position in front of our seats; the dancers made the usual graceful salutation,
    and retired for some distance backwards towards their musicians, who, by the way,
    were of their own sex, but of more advanced age.The dance resolved itself into
    a series of postures and gesticulations, all of which were the very acme of graceful
    movement and delightful to witness. The great charm, to our minds, was, of course,
    the total difference between the dance, so-called, we were then seeing and a dance
    of the West. Whereas in the latter countries men and women dance with their legs,
    in Japan, as in most Oriental countries, the dance consisted of a number of movements
    made with the hands, arms, and bodies. As a matter of fact the feet had the least
    important part to play. A number of complicated evolutions were gone through,
    each of which was supposed to represent some phase of life in the spring of the
    year. After each figure of the dance the *geishas* retired for about ten minutes,
    during which time others came to us and offered refreshments.The costumes of the
    *geishas* are deserving of notice here; they were of numerous and brilliant colours,
    and gave the wearers the appearance of dainty little butterflies as they moved
    in and out, to and fro, in the dance. The grand finale took the form of a dance,
    in which each girl had the flag of a different nation. Even my Kapurthala flag
    had not been forgotton, and loud were the cries of Indo-Banzai when the show came
    to an end. So ended a most enjoyable evening, during which I witnessed an entirely
    novel and unique form of gaiety.The 11th of December was spent in making an excursion
    to Lake Biwa, about two hours’ drive. The lake is a large one, surrounded by low
    hills, near which a number of picturesque villages are visible. The whole scene
    forms quite a panorama, and was well worth a visit. Lake Biwa derives its name
    from a real or supposed resemblance to the shape of a guitar; it is approximately
    the same size as the Lake of Geneva, and it stands about 350 feet above sea level.
    There are a few small islands in the lake, which is said to owe its origin to
    an earthquake which occurred many centuries ago.Our return journey was effected
    in boats, which took us through a canal, the making of which involved a lot of
    difficult tunnelling through the mountains. The flourishing town of Otsu is on
    the south bank of the lake, and there artistic and beautiful pottery of a special
    kind is made. The tunnels referred to are of considerable length, and for a portion
    of the journey we travelled in complete darkness; every now and again we emerged
    into daylight and found ourselves surrounded by the most beautiful scenery imaginable.The
    length of the canal is about fifteen miles, and its width approximated fifty feet.
    The whole is an engineering feat of no mean order. Not only does it furnish a
    waterway for the conveyance of goods and passengers, but it also forms part of
    an irrigation project by which a portion of the adjacent country is supplied with
    water.Mirza Ali Asgar Atabek-i-azam, the ex-Prime Minister of Persia, who, for
    political reasons, has been lately obliged to leave that country, was staying
    here on his way around the world. He, with his son and a friend, were my guests
    at dinner that night, and I fully availed myself of the opportunity thus presenting
    itself of reviving my old knowledge of the beautiful Persian tongue. My Indian
    cook prepared a number of savoury dishes, which met with high approval from my
    guests, who declared that they had enjoyed nothing so much in the way of food
    since their departure from Persia, where, they said, the cooking bore much resemblance
    to that they were then enjoying.We departed from Kioto on the morning of the 12th
    for Osaka, where we arrived in an hour’s time. Osaka has aptly been styled the
    Birmingham of Japan because of its pre-eminence in manufactures. After lunch at
    a comfortable hotel, which was specially built for the accommodation of visitors
    to the great Industrial Exhibition held here last year, we started on a round
    of visits.There is a large garrison of Japanese troops, and the place is of considerable
    military importance. First we saw the Imperial Mint, which was originally started
    by Englishmen, but is now worked entirely by Japanese. The director took me all
    over this immense establishment, which I found to be larger than any similar place
    in India. The machinery and system of working are of the most modern description,
    and we thought the process of making gold and silver coins most interesting. These
    were being produced at the rate of 40,000,000 yen in silver coin and 10,000,000
    yen in gold per annum. It also interested us to learn that a sort of National
    Reserve Fund amounting to many million yen was kept there for national purposes
    in case of sudden emergency.From the Mint we proceeded to the Military Arsenal,
    the most important in Japan. The chief director was awaiting me in the reception-room;
    the different officers in charge of the branches of the Arsenal were there presented
    to me. Thence I was conducted by an officer (who spoke French acquired during
    two years’ residence in France) over the huge establishment, a cursory inspection
    of which took up more than two hours; a whole day, however, could easily have
    been spent there, had time permitted. The processes involved in the making of
    rifles, ammunition, field-guns, siege-guns, torpedoes, shells, etc., etc., are
    of the most complicated kind, and require expert and specialised knowledge to
    describe properly. Such knowledge is not mine; and although I am incapable of
    doing justice to the technical side of this wonderful place, I cannot withhold
    my tribute of admiration of the marvellous grasp of mechanics, etc., palpably
    displayed by these Japanese! I saw some large guns of thirty to forty feet in
    length, and worth *£* 15,000 to *£* 20,000, being made. I was told that such a
    gun cost about *£* 100 for each shot fired out of it. The very guns I saw being
    made are probably now being used against the Russians in Manchuria, with deadly
    effect.The Arsenal employs about four thousand workmen, and at the time of my
    visit the men were working from six o’clock in the morning till ten at night,
    the long hours and high pressure doubtless indicating some prescience as to events
    to follow on the part of the Japanese Government.In point of equipment, machinery,
    and appliances the Japanese Arsenal, although on a smaller scale, makes a good
    comparison with the Armstrong, Krupp, and the Creusot firms in Europe. It is only
    a few years ago that Japan sent to Europe for all her guns, ships, and warlike
    stores; nowadays in this respect she is self-supplying in all these things, with
    the exception of ships of the larger sizes. In respect of these, too, great strides
    have been made by the local builders, and a short time will see Japan in a perfectly
    independent position in this matter, as she already is in so many others. In addition
    to the foregoing, Japan also possesses a large naval arsenal and ship-building
    yards.We left Osaka by the evening train, and reached Kobe in time for dinner.
    This was my last night in Japan.The following day, December 13, I spent in roaming
    about the picturesque streets and shops of Kobe. I also saw a cascade, which forms
    one of the attractions of the place, and had tea at a pretty little tea-house
    near by.At midnight we sailed in the s.s. *Koenig Albert*, of the Norddeutscher
    Line.The *Koenig Albert* is one of the largest and finest steamers plying in Eastern
    waters; she is more than eleven thousand tons’ burthen. The dining-room, ladies’
    saloon, music-room, etc., are all commodiously and elaborately fitted up; the
    former has a good collection of fine oil paintings of some of the old castles
    of Germany. The accommodation allotted to my use was excellent; it consisted of
    a bedroom and a miniature sitting-room *en suite*, while the addition of a bath-room
    near by made my comfort complete. The luxurious nature of my surroundings caused
    me to make mental comparisons with the accommodation provided by, and which one
    is sometimes forced to accept at the hands of, the autocratic P. & O. Co.After
    the foregoing description of the accommodation provided for me in a ship “made
    in Germany,” it is needless to say that the comparison was not flattering to the
    P. & O. The food supplied was excellent in quality, although one missed the little
    culinary refinements common on the French boats. A good string band enlivened
    things at dinner-time. Notwithstanding the superior accommodation and the size
    of the steamer, the number of passengers, who were chiefly American and German,
    was small. I was told that these steamers, eastward bound, seldom carried a full
    complement of passengers. Captain Polacek was a jovial giant of six feet four
    inches, whose geniality and amusing stories were never-ending. The other officers,
    although courteous, adhered so strictly to their duties that one seldom saw them
    on deck or fraternising with the passengers. The promenade deck of this ship is
    unusually commodious, and formed a splendid place for exercise.![Image](Images/46.jpeg)[S.S.
    *KOENIG ALBERT*](#009_9781317949527_illustrations.html_ill3-28)![Image](Images/47.jpeg)[INTERIOR
    OF S.S. *KOENIG ALBERT*.](#009_9781317949527_illustrations.html_ill3-29)The day
    of our departure we traversed the wonderful and beautiful Inland Sea of Japan,
    which in reality forms a sea within an island, as the latter is within a sea.
    The whole of the Inland Sea is dotted about with numerous islands, and the passage
    between them is sometimes so narrow that two ships can hardly pass one another;
    this renders navigation at once difficult and dangerous. The Japanese declare
    that several thousand of these volcanic islands exist in the Inland Sea, and as
    numerous villages are to be seen on them, as well as trading-boats plying between
    them, it is to be assumed that they are of some importance to the people. Evening
    brought us to the end of this wonderful sea; and as the headlands narrowed as
    we approached Shimonoseki the scenery became increasingly romantic and full of
    grandeur.Early on the morning of December 15 we reached Nagasaki in heavy rain.
    On going ashore, I lunched with Mr. and Mrs. Laird at the Nagasaki Hotel; the
    former is British Consul.We re-embarked during the afternoon, and I took a last
    lingering look, full of regret, at a land in which I had found much that was wonderful,
    much to admire, and to which my visit had been all too short. Time and circumstances
    may in future prove more kind, and may give me the opportunity of once more visiting
    this country, of which in so short a time I had become so fond.The protection
    of Nagasaki harbour had evidently been thoughtfully planned and executed. A Russian
    fellow-passenger pointed out to me the heavy fortifications of the surrounding
    hills, and said there was reason to believe that the harbour was thickly mined
    in addition. The Russian with whom I had been conversing assured me that he had
    travelled all over Japan without let or hindrance, but he suspected that he had
    been shadowed and that all his movements had been noted by the Japanese authorities.[¹](#013_9781317949527_chapterIII.html_fnIII_1)
    I yen equals about Rs. 1/8/0.[IV](#008_9781317949527_contents.html_chIV)[*SHANGHAI*](#008_9781317949527_contents.html_chIV)A
    STRONG head-wind the next day caused the vessel to roll and pitch a good deal,
    and in consequence I was confined to my cabin. On the 17th we touched Shanghai
    after a boisterous passage. As the steamer remained there for two full days, I
    went ashore and took up my quarters at the Astor House Hotel. The same evening
    the Shanghai amateurs gave a capital performance of *One Summer Day*; this I found
    most enjoyable.On the 18th, after visiting one of the mixed tribunals, I went
    to see the prison adjoining the Court; and although owing to its being in the
    Foreign Settlement, its condition, and that of its inmates, was not so bad as
    perhaps otherwise it would have been, nevertheless the place bore no comparison
    to that I had recently seen in Japan: this remark applies both to condition and
    management.There seemed to be a great lack of space, and the wretched prisoners
    were huddled up in a place much too small for their requirements. Of course, in
    Shanghai the foreign Governments see that torture and such-like barbarities do
    not take place; but I was told that in the prisons in China the most hideous cruelties
    are still perpetrated.After lunch I visited the Admiral of the British squadron
    in China, Sir Cyprian Bridge, on board his flagship the *Alacrity*. The Admiral
    received me most courteously, with full naval honours.Being anxious to see a Chinese
    man-of-war, I made known my wish to Sir Cyprian, who was good enough to appoint
    his flag-lieutenant to accompany me, and placed his steam launch at my disposal.
    A Chinese cruiser of about four thousand to five thousand tons was anchored a
    few miles off, and to this we made our way. The vessel was commanded by a Chinese
    officer holding the rank of commodore, who had been to England for his training.
    He was most attentive, and took me all over his ship, which, contrary to my expectation,
    I found in a state of admirable cleanliness and efficiency. One foreigner only
    was on board, an Englishman, who held the position of gunnery instructor.The Chinese
    marines, who formed the guard of honour on my arrival and departure, wore a modified
    naval uniform of a blue colour; their pigtails were neatly coiled on the tops
    of their heads, and these were surmounted by a sort of small black turban. The
    Chinese navy was, as every one knows, depleted by their war with the Japanese,
    and their losses then do not appear to have been made good since, as at present
    their whole naval force consists of a few vessels of moderate size, such as the
    one I had just visited. The commodore honoured me on my departure by ordering
    a salute to be fired. This was an unusual proceeding, because of the large number
    of guns for my salute as compared with a maximum of three fired in honour of their
    chief naval, military, and civil dignitaries.My experience would have been incomplete
    had I neglected to dine *à la Chinoise*, and my opportunity arrived in the shape
    of an invitation from two American friends to a Chinese dinner. In addition to
    the two Americans, a few Chinamen of rank sat with us. The whole dinner was placed
    at one time on the table; and although at first I felt some repulsion to the food
    placed before us, this passed away immediately after a commencement had been made.
    Bird’s-nest soup, as well as a preparation of duck, and the bread I found to be
    really good. Chopsticks were used instead of knives and forks, and after the first
    clumsiness of manipulation had been overcome, they did not seem to be as awkward
    to manage as I anticipated.Chinese custom rules that a singing-girl should be
    placed between each two guests at a dinner of this kind, and to be in fashion
    our singing-girls were, of course, forthcoming. Each one sang a song at a proper
    time, which forcibly reminded me of the character of the songs of the hill districts
    of the Punjab: there was a distinct similarity between them. Customs differ in
    different countries. My readers may imagine the effect of a number of music-hall
    artistes placed symmetrically between the guests at a dinner-party, each singing
    her favourite ditty in turn. The singing-girl possesses a strong sense of duty,
    and they refused everything in the shape of food, etc., offered to them. They
    were, however, not above assisting the guests to anything they required. The girls
    were all of fair complexion and had black hair; they were distinctly good-looking
    of their kind, and were richly attired in fine costumes. Although good-looking,
    they wholly lacked the charm of manner which is the undeniable attribute of the
    Japanese maiden.East of Suez, Shanghai is, in my opinion, far and away the finest
    modern city. It possesses magnificent buildings, fine, well-kept roads, and in
    the matter of modern appliances, comforts, etc., is more up-to-date than any city
    in India.The weather had turned bitterly cold, and a snowfall seemed to be imminent.
    *Apropos* of the matter of temperature, it appeared to be odd that although Shanghai
    is on about the same parallel of latitude as parts of the Punjab, the weather
    in the former place is infinitely colder than in the latter. The difference can
    only be accounted for by the exposure of Shanghai to the glacial winds which sweep
    down from the Siberian steppes and so lower the temperature.We left on the morning
    of the 19th by steam launch for Wosung, where our steamer was anchored, and finally
    departed about ten o’clock. A few additional passengers were there embarked.As
    we neared Hong-Kong the weather became more genial—a very acceptable change from
    the arctic conditions we had so lately experienced, The entrance to Hong-Kong
    harbour exhibits a fine panoramic view. The harbour is enclosed by surrounding
    hills, and partly for this reason is said to be one of the finest in the world.
    The admirable foresight of the British statesmen is there exemplified by having
    taken possession of one of the best natural harbours in the East, to be used,
    of course, as a coaling station and naval base in time of war. This was done,
    too, at a time when, in the estimation of the other nations, the place had an
    insignificant importance. As matters now stand, the British (owing to their foresight)
    possess a complete chain of naval bases extending from Suez to Hong-Kong. Their
    value in time of war cannot be over-estimated. We anchored off Kowlong at four
    in the afternoon, and, after much delay in getting ashore, proceeded to the Peak
    Hotel by funiculare (small railway).![Image](Images/48.jpeg)[TYPICAL CHINESE WOMEN.](#009_9781317949527_illustrations.html_ill4-1)On
    December 22 I went down from the Peak to pay a visit to Rear-Admiral Curzon-Howe
    on the flag-ship *Albion*, where I was received with full naval honours. I lunched
    with the Admiral and officers in the wardroom, and afterwards was shown over this
    really fine vessel—one of the latest and most powerful additions to the British
    China squadron. To be prepared for all eventualities, the British maintain a strong
    naval force in these waters at all times. Just now, when anything may happen in
    the East, these vessels are maintained in a state of such efficiency and preparedness
    as to enable them to sail at any moment. The impression one gets by an inspection
    is that nothing is lacking either in equipment or personnel to fit these ships
    to play the part for which they are intended at any time.On my return to Hong-Kong
    I visited Mr. May, the acting Governor, at Government House, and subsequently
    went for a stroll through the principal streets, some of which have really good
    European and Chinese shops, where a large variety of articles can be purchased.Hong-Kong
    justly ranks as one of the finest of Eastern cities; there are handsome public
    buildings, banks, places of amusement, etc., etc. Carriage traffic in the streets
    is impeded owing to the steepness of the streets; in consequence, the bulk of
    the traffic is done by ’rickshaws and Chinese jhampans. The place appears to be
    built on rock, which slopes up rather sharply from the shore, and thus makes carriage
    traffic difficult. We dined with the Governor and Mrs. May, and afterwards went
    to a dance at the City Hall, which was numerously attended by the principal residents
    and the officers of the men-of-war in the harbour. The building is large and well
    adapted for a dance or public entertainment.On December 23 Admiral Curzon-Howe
    was good enough to place his steam launch at my disposal, and we went to Kowlong
    to catch our steamer once more.Christmas Day on board was celebrated with full
    honours. A beautiful tree, profusely decorated and illuminated, was erected in
    the dining-saloon, and during the evening a real old-fashioned jollification in
    the German style took place. The band played a carefully chosen selection of appropriate
    hymns, and all present enjoyed themselves to the utmost.Land appeared early on
    the 27th, and Singapore was reached at midday. There we found the difference in
    the temperature most marked, and the weather was quite tropical and humid. The
    obvious fertility of the soil and the greenness of the surrounding country reminded
    one forcibly of Ceylon.Raffles Hotel was patronised during my stay; it is large
    and fairly comfortable. During the afternoon I went to see the Botanical Gardens,
    which, because of the richness of the soil and the moist, warm atmosphere, are
    very fruitful in the matter of vegetation of all kinds. The place was attractively
    laid out and well maintained. It was my intention to have merely touched at this
    place with the object of catching a steamer to Java, but I found that no boat
    was available until January 1\. This involved a delay of six days, during which
    we were obliged to content ourselves with driving about the parks and neighbourhood
    until the time of our departure.I took the morning train on the 29th to visit
    Johore, an hour’s journey only. On alighting, we took a ferry-boat, which in about
    ten minutes took us to our destination. Johore, an independent principality, situated
    on the extreme point of the Malay Peninsula, has so far succeeded in preserving
    its autonomy. The Federated Malay States, under their respective Sultans, are
    in its vicinity. The whole of the Malay Peninsula, with the Federated States,
    are practically under the British. Johore has acquired the title of the Monte
    Carlo of the East, and gambling is freely carried on, but is confined to the subjects
    of the Sultan, as, for unknown reasons, foreigners are forbidden to participate.On
    landing at the jetty, I was met by one of the Sultan’s *aides-de-camp*, by name
    Captain Daoud, who, during the time he was in Australia, picked up, among other
    things Anglican, a pretty Australian wife. I was conducted by the *aide-de-camp*
    to the Johore Hotel, which is maintained by the State for the accommodation of
    guests and visitors.The stupidity of the Chinese servants is proverbial, but I
    think the acme of thickheadedness was reached by one of the servants who was instructed
    to cool a bottle of mineral water. Instead of adopting the usual method of burying
    the bottle in ice, he took infinite pains to pulverise the latter into the smallest
    fragments, and then attempted to fill up the bottle with them. Such a lack of
    intelligence could hardly be surpassed in any country.After a good breakfast,
    the *aide-de-camp* in attend ance went about the place with me to show me the
    sights.The Sultan’s palace was the first place visited. There was nothing about
    it to justify the idea that it was anything but an ordinary comfortable sort of
    a residence. At the same time I saw the Sultan’s three small sons, who are shortly
    leaving for England to be educated.Before leaving the palace, I saw the State
    regalia, which, among other jewels, comprised a collection of handsome gold and
    silver plate, the State insignia, and some foreign decorations.Thence I drove
    about the place, and saw the State mosque and the jail. The Chinese and Malay
    towns were next visited, and struck me as being efficiently supervised. The natural
    tropical scenery lent a certain air of picturesqueness to the surroundings which
    the abundant foliage added to. Rubber is indigenous to Johore, and the largest
    portion of the State revenue is derived from that source. A number of European
    officers are in the Sultan’s service, among whom are an engineer, a doctor, and
    a commandant of troops, which number about three hundred men ; they are nearly
    all Pathans. One of their officers, a Punjabi, came to see me.Shortly before my
    departure, His Highness the Sultan Ibrahim Ali Khan (who came from his country
    seat specially) paid me a visit. He is a very Anglicised Prince, and was dressed
    in a white duck suit. His style is distinctly “horsey,” and he is the hero of
    many adventures and accidents in connection with his favourite animals. On one
    occasion he received a kick on the mouth from a horse, and this deprived him of
    most of his teeth; a false set is now worn, and, curious to relate, two of the
    upper and two of the lower front teeth have diamonds set in them, which, when
    he opens his mouth to laugh or to speak, shine brilliantly.![Image](Images/49.jpeg)[HIS
    HIGHNESS THE SULTAN OF JOHORE.](#009_9781317949527_illustrations.html_ill4-2)'
