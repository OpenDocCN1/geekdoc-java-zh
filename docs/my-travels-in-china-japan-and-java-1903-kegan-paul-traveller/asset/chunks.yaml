    hillock, on which is situated the Summer Palace, where I was told that the Imperial
    Family resort during the warm weather; the Emperor, however, has been known to
    visit the place but once. The palace is divided into two parts—Japanese and European—the
    latter resembling a palatial `châlet` of the kind one is familiar with on the
    French Riviera; the views obtainable from its windows would rival or excel anything
    to be seen in the South of Europe. The Japanese portion, where the Imperial Family
    reside, was, as usual, devoid of furniture. We regretfully turned our faces from
    these fascinating surroundings, and wended our way homewards, and reached Myanoshita
    at dusk.


    ## Nagoya and the Castle


    The second day of our stay at Myanoshita was remarkable chiefly for the badness
    of the weather. Rain fell in torrents, and this, coupled with the fact that I
    was not feeling particularly well, decided me to remain indoors the whole day.
    The day after we went by the eleven o’clock train to Nagoya, and on the way got
    quite the best view obtainable of the famous Fujjiya Mountain. Nagoya was reached
    after a tiresome journey at 9.30 p.m., where we put up at a small hotel.


    Nagoya is one of the chief towns in Japan; it possesses several manufactories,
    and gives one the idea of prosperity. Having only a few hours at my disposal,
    limited sightseeing to a visit the old castle, said to be the finest specimen
    of feudal castle in the country. This place is inaccessible to the general public,
    and to see it a letter from one of the Legations or Consulates is necessary. Originally
    were two moats, both of which are now allowed to remain dry, and which now serve
    for the barrack accommodation required by the garrison. The apartments inside
    are well worth seeing, as the decorations are with flowers, tigers, cherry-blossom,
    etc., nearly all done by some most renowned artists the country has produced.


