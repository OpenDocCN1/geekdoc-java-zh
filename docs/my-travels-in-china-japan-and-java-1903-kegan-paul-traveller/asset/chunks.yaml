    # *向作者展示照片后*


    值得注意的是，这些苏丹身上展现出一种东方特质；他们的私人嫉妒之情如此，以至于阻止了彼此之间的礼节性访问。东方人的性格使其所有者丧失了所有联合的优势；因此，外人总能获得成功，而东方人如果能表现出某种自我克制，本可以与敌人获得至少平等的机会。


    在`Java` 的荷兰人并没有没有察觉到这个国家两个最强大的苏丹之间存在的嫉妒，出于自己的利益考虑，他们自然无所作为，现在也克制于采取任何行动来促进他们之间建立更友好的关系。我对观察此类现象产生了特别的兴趣，并在脑中对荷兰人统治下
    `Java` 的状况与英国统治下 `India` 的盛况进行了对比记录。我认为，我提到的这两个国家是极少数存在此类类比的国家之一，而且由于我本身也是个感兴趣的人，我的好奇心自然被激发了。这促使我进行了一些询问，作为回应，我获得了如下信息：`Solokarta`
    的年收入约为 4,000,000 法法（（6,000,000 卢比）；此外，苏丹每月从荷兰政府获得 70,000 法林的补贴——这一制度在这方面与 `India`
    盛行的制度有本质区别。


    ## 洛卡塔苏丹


    `Solokarta` 苏丹的军事力量由约 1,500 名非规军组成，这个术语用在他们身上是完全贴切的。他们配备了极其古老的武器，这些武器看起来更适合放在博物馆里作为奇珍陈列，而不是在士兵手中。苏丹拥有一支由荷兰欧洲士兵组成的卫队；人数六十，由一名隶属于苏丹宫廷的上尉指挥。至少有一部分卫兵会随苏丹行踪，这一事实除了其他因素外，也清楚地表明，虽然卫队表面上是最高权力授予的一种荣誉，但后者同时也希望苏丹不要在监视的情况下离开太久！！


    ![Image](img/56.jpeg)

    索洛卡塔苏丹夫人。


    苏丹家庭的女性总人口约为 6,000 人，在这庞大的数字中，约数百人归属于苏丹本人。其余的是亲属、官员的妻子、仆人等。


    在我的有限时间内，很难确定这些苏丹对臣民的权力范围和程度；但我被告知他们对居住在各自国家内的人民拥有权威；但在所有重大事务上，他们被要求咨询荷兰驻员，这位驻员被令人动容地称为“大哥”。


    ## 索洛卡塔的接待


    那天晚上，我受邀参加了`Solokarta` 苏丹（其正式头称为 `Susuhnan`）举办的宴会，他非常体地为我举办了这次活动。不幸的是，荷兰驻员在那一天缺席了，但他的首席秘书代表上级迎接了我，并乘着苏丹为我提供的马车送我前往苏丹宫。几名驻员工作人员的官员以及几位来自驻公馆的女士也出席了宴会。


    索洛卡塔苏丹接待我的细节与我之前在 `Djocjokarta` 描述的大大相同，唯一的区别在于这次接待部分由于 `Solokarta` 地位较高，部分由于其宫廷及周围环境更为华丽，规模要考究得多。然而，所遵循的礼仪在两次场合是相同的。当我到达时，受到了殿下的最热诚的接待，他立即带我来到一个台，台上站着拉托贝（或
    `Sultana`）以及许多公主和宫廷女士，我们被正式向他们介绍。


    介绍仪式非常简单。苏丹延续了我到达时那种热情的方式，挽着我的手臂，逐一向我介绍了每一位女士。我鞠躬，女士们则微弱地回应。


    女士们的服装是她们特有的，我在其他任何国家从未见过类似的。我不擅长描述女士的服装，因此请读者参考书中的照片以获取更多；这些照片真实地展示了爪哇公主的打扮。她们戴着一些珠宝（尤其是苏丹的女儿们），显得漂亮且精致。


    ![Image](img/57.jpeg)

    索洛卡塔苏丹的女儿和女婿。


    女士们的动作有些机械，面部表情在很大程度上是缺失的；她们举止和外完全缺乏活力。另一方面，她们穿着华丽，在裙装中显得纤细脆弱。我不得不注意到，爪哇女士对各种香水有明显的
    `迷恋`；而且她们习惯同时使用多种香料，产生了一种难以描述的气味，其中檀香油占主。


    ## 宴会与宫廷习俗


    介绍结束后，我们被邀请与苏丹和夫人一起坐在放在台前的一些华丽金椅上。在我们右侧是公主们，她们之后是苏丹家族的男性成员。在我们左侧是驻员的随从。在离我们台面的对面，坐着许多苏丹的部长和宫廷官员；他们都穿着奇特的头饰和迷人的服装。


    我们坐的亭子规模宏大，能够容纳许多人；尽管空间很大，也被家庭和宫廷的女士占满了。她们穿着一种短款服装，由萨笼和一条提到手臂下的腰带组成，导致身体上半部完全暴露。我被告知，如果她们穿着低胸（`décolleté`）服装将违反宫廷礼仪。只有苏丹家族的女士才有权遮盖胸部和肩膀。我们在
    `India` 习惯的隔离制度（`pardah`）在 `Java` 没有立足之地；尽管那里的女性没有该制度带来的不利影响，但她们并不与男性社交，仅在特殊场合露面；她们的社会地位与其他国家的女性相同。


    ![Image](img/58.jpeg)

    索洛卡塔苏丹的女儿和女婿。


    苏丹和夫人身后是前者的侍从。这些女性年龄各异；一位六十左右的老妇人通过念诵祝福吸引了我的注意。我环顾四周对上了她的目光，她微笑并向我的头落下祝福。我被告知，她的祝福感谢上主派了这样一位荣誉的人来访。经常，苏丹的一位女性会过来按摩他的腿。行礼的方式与旁遮普的做法相同：双手接触并触碰额头。即使是苏丹的儿子和首席妃，被他说话时也以手势回应。这些宫廷的礼仪规范被非常严格遵守；一个细节令我感到有趣。禁止仆人直立靠近苏丹；因此当某物被送来时，仆人必须通过体操般的动作来完成他们的任务。


    殿下的头衔如下：

    `Hingkang Sinoeho`

    `Pakoe Boemono Senopati Ingaloge Rachman`

    `荷兰狮子勋章指挥`

    `橙色勋章大十字`

    `柬埔寨大勋章`

    `泰国大勋章`

    `比利时大勋章`

    `荷兰陆军少将`

    `宇宙之钉`


    在我所描述的这个场合，他穿着一件刺绣精美的夹克和一条帅的萨笼。他还戴着许多来自荷兰、法国、泰国和德国政府的宝石勋章。在我们的交谈中，我被告知他拥有的其他勋章如此之，以衬子上没有足够的空间一次性全部取出。这是允许他们接受外国勋章的问题。这场宴会（持续了约一小时）仅仅为了看，远赴
    `Java` 也是值得的。


    我与苏丹的对话是通过荷兰首席秘书进行的，他使用法语进行翻译。我被要求对索洛卡塔宫廷的宴会和环境是否优于 `Djocjokarta` 给出意见。我认为这类问题最难回答，并用我最外交的方式回避了它们。从我们主人的态度以及我听到的事情中，我推测他并未对邻国浪费感情；他们之间的竞争和嫉妒是完全公开的。可能如果荷兰人离开
    `Java`，苏丹们会互相掐喉，重演那个时代存在的流血状态。


    ## 舞蹈


    描述舞蹈本身是一件困难的事，要公正评价它需要皮埃（Pierre Loti）那样的笔触。眼前的景象是迷人的，在我见过的许多国家中是无与伦比。首先来的是音乐家，他们带着奇特的器器坐在分配给他们的位置。接着是舞者，由大约五十名穿着漂亮萨笼和低背心的的女孩组成。她们以八分之一的时间，两两成行，从亭子的后部移动，最后在我们坐的台对面排成平行。所有的女孩都属于苏丹家族，并与他有关。她们长相漂亮，身材苗条，年龄似乎在十四到十八岁之间。她们肤色是橄榄色，特征有些是蒙古式的。


    ![Image](img/59.jpeg)

    索洛卡塔的音乐家。


    到达台，女孩们行跪礼，双手合，然后开始跳舞。舞蹈由无数姿势组成，随着手臂的挥动和相应的头部动作；在某些方向缓慢移动，脚起起部分作用。舞蹈的动作复杂且多样；圆形、正方形、进后移动最后变得令人眼花缭乱。偶尔一位侍从不得不介入调整其中一个人的裙摆，由于裙摆太长，无法由者自己照顾。音乐家并没有完全局限于器乐，他们再次爆发出狂野而奇异的歌唱，特质上让我想起了我们国家的音乐。眼前的场景的新奇感让我的想象带到了《摩婆罗婆》（`Mahabharata`）中的某些章节；带到了印度神话中著名的因陀罗（Raja
    Indra）宫廷。然而，欧洲宾客的黑色晚服和制服提醒了我仍然生活在二十世纪。


    在感谢并赞美我的主人为我提供的盛大宴会后，他回答说如果早早知道我的到访，他会派出他全部的、约两百名女孩组成的舞队。


    ## 离开与最终观察


    活动结束后，我的主人带我参观了他的若干间房间，这些房间是按照 `Java` 的独特风格布置和装饰的。一件似乎被特别尊崇的家具是一张巨大的、帅的、雕刻金金床，用作一种皇室床，占据了接待厅后方一间房间的荣誉位置。


    在许多宫廷官员、随从和侍从的陪同下，我们前往了主人花园里的一座喜欢的暑房，我们在那里享用了许多美味清凉的饮料。我们停留了一段时间。在我离开之前，苏丹慷慨送给我一根精美的金镶杖，手柄上刻有他的缩写。午夜降临，我们在向这位善良的主人告别后离开，结束了我在远东度过的最有趣的一天。


    第二天早上，在苏丹儿子们的陪伴下，我愉快地参观了他的清真寺（这是一件常事）。清真寺最有趣的部分是库（`toshakhana`），在我在那里看到了足够的金银器以及瓷器等，足以供应两百位客人。当我表达想看苏丹的珠宝（我被告知价值非凡）时，我被礼貌地告知由于某种迷信，向游客展示此类贵物品是不吉之兆，因此我的愿望未能实现。接着我们看到了兵器库，那里有一些有趣的古代武器，除了作为奇珍外别无用处。我们的下一步是前往马房，那里安置了约一百匹骑用动物和五十辆马。马房由一位退役的荷兰骑兵军士管理；他负责该设施的接待。几匹马着完全的爪哇式马饰（与
    `India` 非常相似）被牵出来供我们检查。这些马既不穿靴也不穿裤子，尽管它们似乎并不缺少这些。因此，由于明显的原因，检阅的想法被放弃了。在回答我的一个问题时，我的信息来源进一步带着非常天真的语气告诉我，现有的混乱状况是由于荷兰政府的政策，他们不喜欢认为苏丹在任何方面如他们高效。


    ## 寺庙与印度教的影响


    当我们结束寺庙检查时没有火车可用，我们不得不开车前往 `Djocjokarta`（二十英里外），我们抵达时赶上了晚餐。那天晚上，`Djocjokarta`
    苏丹为我举办了一场宴会，驻员和许多荷兰官员出席了。一些平民也在场。整个宫殿是一片欢庆，在那场合公众被允许进入。那里一定有几千人在场，因为整个巨大的围墙区域都被挤满了。在那里，正如
    `Solokarta` 一样，宴会主要以舞蹈的形式呈现，类型相似。大约二十名女孩参与，与我在 `Solokarta` 看到的不同仅在于服装。她们还在脸上涂了某种白色颜料，眉毛涂成黑色并横跨鼻梁上方，并在寺庙处以异常的方式弯曲。这些年轻女性从小就开始学习舞蹈，每天练习一段时间某种形式。她们都属于苏丹家庭，由苏丹根据自己的意愿嫁给有地位的男性。


