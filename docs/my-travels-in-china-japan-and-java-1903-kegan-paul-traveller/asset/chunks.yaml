    *After a photograph presented to the Author*. The day after we left Djocjokarta
    for Solokarta, the capital of the most important Sultan in Java. An hour’s run
    took us to our destination, and on arrival we drove straight to the `Hôtel Slier`.
    Solokarta is a place of superior importance, and is the seat of another Dutch
    Resident.


    In the course of an afternoon drive we came across a large, imposing-looking building,
    and, on inquiry, we were informed that it was the residence of the Sultan’s brother-in-law,
    by name `Mankundukuru Adipati`. After getting the necessary permission, we went
    inside to see the place. As seems to be the custom in that country, there was
    an absence of walls in the building, and the rooms were all large and lofty; the
    floors were tiled with marble, and the decoration and furnishing were Orientally
    ornate in character. The building itself was more like a huge pavilion than anything
    else, and was set in the middle of a large quadrangle, which, in turn, was surrounded
    by high walls.


    `Mankundukuru Adipati` is said to be one of the most powerful and enlightened
    princes subject to the Dutch. Owing to the limited time at my disposal, no opportunity
    presented itself of making his acquaintance, which I would much liked to have
    done.


    The next place that attracted my attention was the somewhat formidable-looking
    fort, which was so disposed as to command the Sultan’s palace just opposite. I
    was curious to see the inside of the fort (where a number of Dutch troops with
    guns are stationed), but was not accorded permission, as it would have been contrary
    to the regulations.


    It may be in place here to mention the great difference in the matters of power
    and privileges between the Sultans in Java, under the Dutch, and the Rajas, in
    India, under the English. It was, of course, difficult, in such a short time as
    I stayed in Java, for me to judge personally of such a matter; but from what I
    was told (and the little I saw corroborated it), I arrived at the conclusion that,
    as regards authority and personal liberty, we in India are on the whole infinitely
    better off than the Sultans are in Java.


    It is an amazing fact that neither of the big Sultans in Java have ever seen `Batavia`;
    and from this as well as other things which came to my knowledge the unhappy conclusion
    was forced on me that these unfortunate men, who, although treated with every
    outward form of courtesy and respect by the Dutch, were, after all, little better
    than political prisoners. In bygone times these Sultans fought the Dutch persistently,
    and when their resistance was finally overcome, the Dutch, in self protection,
    and to prevent further outbreaks, imposed such conditions of existence on the
    Sultans as to prevent for ever the possibility of their revolting.


    ![Image](Images/55.jpeg)


    [HIS HIGHNESS THE SULTAN OF SOLOKARTA](#009_9781317949527_illustrations.html_ill5-6)


    (Whose Full Titles, Etc., Appear in the Javanese Language under the Portrait).

