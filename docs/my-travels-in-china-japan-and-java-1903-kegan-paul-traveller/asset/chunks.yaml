    stones. Great engineering difficulties to be overcome in the construction of this
    line, and at the termination of the journey, we alighted, and then proceeded to
    shoot the rapids in a boat. The bed of the stream was rocky, and as we shot up
    and down with the motion of the boat, we found the experience most exciting one.
    Rashiyama was reached after two hours tempestuous about; it is a favourite resort,
    with the usual assortment of tea-houses and inns. The scene must be an exceptionally
    fine one when the cherry-tree is in full bloom, so much that many people congregate
    there for no other purpose than admire the wonderful sight of all trees. Our return
    journey was accomplished by carriage, and on the way we had a glimpse of two theatres,
    at which performances of a unique kind, but quite incomprehensible to us, were
    made. The stream continued for about thirteen miles, between steep hills and through
    scenery of the prettiest.


    The whole of December 7 I devoted to shopping; I went to all the big emporiums,
    where the whole of December 9 I went to Nara, where the usual reception by the
    Governor and police officers took place. The day had been most interesting, but
    nevertheless wearying, and I was glad to reach Kioto in time for the well-earned
    dinner. Our return journey was accomplished by carriage, and on the way we had
    a glimpse of two theatres, at which performances of a unique kind, but quite incomprehensible
    to us, were made.


