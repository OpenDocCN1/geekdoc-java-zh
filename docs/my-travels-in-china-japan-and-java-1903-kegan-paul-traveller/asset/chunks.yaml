    *From an Original Presented to the Author*.


    A lot of interested attention was exhibited when the Russian Minister was presented.
    Baron Rosen was said to be one of the cleverest of the foreign Ministers, and
    having in view the strained relations between his country and Japan, his movements
    were always attended by a good deal of interest by the others. The Chinese Minister
    came next. He was followed by a numerous staff, all dressed in their Chinese Court
    costume, they being the only ones present in anything but European dress.


    After the foreign naval and military officers, the Japanese Ministers were presented.
    Their obeisance consisted of a low bow made while their hands were placed on their
    knees. The Empress did not shake hands with them. This terminated the presentations.


    Then came the great feast. It was nothing like an afternoon tea such as one becomes
    accustomed to elsewhere, but a regular meal of several courses: soup, fish, joints
    of meat, ice cream, with champagne and the other wines. The Empress took her place
    at the head of the table, and near her sat the Prince Higashi Fushimi and the
    Princesses. I observed that the Imperial party hardly touched any of the substantial
    food in front of them, while the guests did ample justice to the good things provided.


    My place, facing the Empress, gave me an excellent view of the whole proceedings.
    With the exception of the Diplomatic Corps, and for some of the more distinguished
    guests, tables were not provided for the meal; the others were obliged to partake
    of refreshments at a long table, serving the purpose of a buffet, at which they
    stood and helped themselves. The service at the tables was performed by Japanese
    waiters, got up in the fashion of European lackeys, belonging to the Imperial
    household. About half an hour was occupied at the meal, and the Empress signified
    its termination by rising.


    I must not omit to mention the very fine selection of European music played by
    the Japanese military bands during the time we were eating. The men wore very
    French-looking uniforms, and played beautifully. The procession then re-formed;
    but before leaving, the Empress shook hands with some of the more distinguished
    of her guests, and wished me a pleasant sojourn in Japan and a safe return to
    my own country. Thus ended the annual chrysanthemum party, the whole of which
    was arranged with a perfection of detail that could not have been excelled at
    Buckingham Palace in London or the Elysée in Paris.


    ![Image](Images/25.jpeg)

    [SHOW OF CHRYSANTHEMUMS IN THE IMPERIAL GARDENS AT AKASAKA, TOKIO.](#009_9781317949527_illustrations.html_ill3-7)


    The entertainment I have been describing was one of the many evidences of the
    advancement of modern Japan; and the complete independence of outside assistance
    exhibited by the perfection of all the arrangements spoke volumes for the ability
    of the people to adopt other people’s customs, and to adapt themselves to modern
    and changed conditions. Twenty years ago such an entertainment, on such a system
    and on such a scale, would have been beyond the capacity of the Japanese; but
    nowadays it is not thought anything wonderful.


    The Emperor, being busy with the autumn manœuvres, was unable to be present at
    the chrysanthemum garden party, as he was about a day’s journey away and had about
    30,000 troops to inspect.


    Immediately after the Empress’s departure there was a rush for carriages. Ours
    was soon procured, and we made haste to catch the express back to Yokohama. I
    had little time to spare, as the annual Club Ball took place that night; and,
    dinner over, I betook myself to the club, and enjoyed myself immensely, and danced
    to my heart’s content. A sumptuous supper was provided, and I remained with the
    gay crowd of all nations until one o’clock in the morning.


    A noticeable feature of this ball was the almost entire absence of Japanese ladies
    and men, except the Governor of Yokohama and his wife. I also observed that, notwithstanding
    the advanced state of the Japanese, there was little social intercourse between
    them and the Europeans. It was only at ceremonial and official gatherings that
    they seemed to come together: the reason appears to be that the Japanese do not
    feel quite at ease in foreign society. I did not notice any disposition on the
    part of the Europeans to be exclusive in Japan.


    Wishing to be at the capital and to participate in all that was going on in the
    centre of Japanese life, I left Yokohama, after having lunch with some English
    acquaintances, to make a stay at Tokio. The latter place has been the capital
    for two hundred years past, and now has a population of a million and a half.
    It is a city of magnificent distances, being ten miles from one end to the other.
    The time wasted in going about was awful. The aspect of the modern city, with
    its splendid buildings, such as the War Office, Houses of Parliament, Law Courts,
    etc., which form a circle about the central public gardens and recreation grounds,
    was distinctly neater than either Calcutta or Bombay, and recalled the appearance
    of the Ring Strasse in Vienna, from which no doubt the general arrangement has
    been copied.


    ![Image](Images/26.jpeg)

    [GINZA DORI, THE MAIN STREET (FROM SHIMBASHI), TOKIO.](#009_9781317949527_illustrations.html_ill3-8)


    On reaching Tokio, we immediately made our way to the British Legation, whence
    Mr. Hohler, the second secretary, took us to see a wrestling-match, which took
    place in a house with a matted floor. On entering, we had to remove our shoes
    and put on canvas house slippers, this being the usual custom in Japan. At the
    outset the professor of wrestling explained, in English, the rudiments of the
    art of wrestling, and gave practical demonstrations; then the competitors came
    on the scene, and the bouts commenced.


    The wrestling seemed to partake more of skill than of force or strength, and it
    was simply wonderful to see the ease with which a man was thrown merely by the
    turn of the hand or a twist of the foot of his opponent. It was extraordinary,
    too, that those who fell were immune from serious hurt, considering the force
    with which they were sometimes thrown. The men were short, sturdy fellows, full
    of muscle. Each bout lasted about five or six minutes. Wrestling is brought to
    a fine art in Japan. Even the policemen are taught all the tricks, and it has
    frequently happened that the police had to exercise their skill on obstreperous
    but powerful foreign sailors, who, owing to the skill, have invariably been promptly.


    We remained for about two hours, during which time we witnessed about a dozen
    bouts and then made our way to the Imperial Hotel, which was our residence during
    our stay in Tokio. The hotel was a big three-storey building, with a handsome
    façade and spacious public rooms on the ground floor. The diningroom had accommodation
    for about two hundred people, besides which are a number of other rooms which
    are kept for private entertainments.


    ![Image](Images/27.jpeg)

    [THE IMPERIAL HOTEL (JAPANESE MANAGEMENT), TOKIO.](#009_9781317949527_illustrations.html_ill3-9)


    On the morning of the 15th I called on some the Imperial Princes who are nearly
    related to the Emperor. Unfortunately they were all out, so I was able to leave
    cards. Most of these Princes now possess substantial villas for pleasure purposes,
    built after French designs. Much expense has been gone in furnishing them, and
    they are elaborately got up; but are used for the purpose of entertaining only,
    as the owners prefer to live in the plain Japanese house, practically devoid of
    furniture.


    I also paid calls on the Russian, Italian, and Chinese Ministers, all of whom
    I saw and conversed with. The Russian Minister told me on entering that he was
    a great friend of my predecessor, and he used to play billiards with him—an observation
    which I was unable to grasp until he mistook me for the newly arrived Siamese
    Minister! During our conversation the Russian Minister expressed the hope that
    the differences between his Government and that of Japan would be settled amicably;
    and on my inquiring if in his opinion the Japanese were really as strong as believed,
    he replied that the imagined they were irresistible. He also mentioned that he
    was spied on by the police in Japan wherever he went, and that State despatches
    to his Government had to be sent by special messenger and forwarded by Russian
    steamer for safety’s sake. My interview with the Chinese Minister was full of
    interest; it took place soon after the Russian occupation of Mukden, the capital
    of Manchuria. In reply to sympathetic questions as to the action China would probably
    take in the matter, His Excellency replied with a broad grin and offered me a
    cup of tea and some cigarettes.


    Later in the day I went for a drive in Ueno Park—the-called Hyde Park of Tokio.
    It contains many fine trees and broad, well-kept avenues; there is also a museum,
    some temples, restaurants, and a fine art exhibition. I went through the latter
    and saw a number of paintings by Japanese artists, most of which were water-colours.
    From the park terrace a fine view of the city, lying as it were at one’s feet,
    is obtainable.


    ![Image](Images/28.jpeg)

    [DANCING.](#009_9781_illustrations.html_ill3-10)


    After dinner I saw a geisha dance, which had been got up beforehand, in a tea-house
    where such entertainments were usually held. On arrival the women attendants made
    the usual salutation of kneeling down and bumping their heads on the ground. We
    removed our boots and put on house slippers, and then proceeded upstairs and entered
    the room set apart for the purpose of the entertainment. This place was the same
    as all other houses in Japan. It was made of wood, with paper screens to form
    partitions; these screens were made to slide in and out, and by adjustment could
    be made to form as many rooms as desired. The floor was covered with clean brown
    matting, and nothing could exceed the absolute cleanliness of the whole place.


    At one end of the room some cushions were placed for the visitors to sit upon,
    and between each of them a metal or China fire-pot was stood to enable the visitors
    to warm their hands. Soon after we had taken our places, the women musicians put
    in an appearance, and after the usual salutation sat on the ground. Contrary to
    the prevailing idea, the geishas do not dance. They play the accompaniments only,
    and the so-called mykos do all the dancing. The latter are little mites of nine
    to fourteen years of age. About half a dozen of the mykos entered and placed themselves
    in a row facing us, and soon after they commenced their weird but graceful dance.
    This consisted of a variety of pretty movements of the body and slow waving of
    their delicate hands to the accompaniment of the geishas’ music and singing.


    The mykos looked like butterflies in their garments of many colours and pretty
    sashes, while the geishas were sombre in their dark costumes. At intervals, the
    mykos would cease dancing and rest, subsequently resuming. The dances represented
    War, Love, the Seasons of the Year, etc., etc., the interpretations being made
    by the pantomime and gesticulations of the dancers whose mimicry was so good as
    to make this a matter of no difficulty.


    These miniature dancers were absolutely fascinating in their child-like innocence,
    and resembled dolls more than budding women. The geishas, I may add, must all
    be mykos before they are considered competent to perform the music and sing. I
    noticed that a number of them had disfigured their lips by blackening their teeth,
    these practices of extreme coquettness. The novel entertainment enchained me until
    past midnight.


    ![Image](Images/29.jpeg)

    [A TYPE OF GEISHA.](#009_9781_317949527_illustrations.html_ill3-11)


    On the 16th I had lunch with Herr Erckert, the first secretary to the German Legation,
    and his wife, and subsequently attended a garden party given by Count Okuma, one
    of the so-called Statesmen. Those I saw at Count Okuma’s were in no way inferior
    to those at the Imperial garden party few days before. The garden was typically
    Japanese, with the usual miniature lakes, islands, bridges, and dwarf trees. At
    this party three Imperial Princesses and a Prince, besides a large gathering of
    Tokio society, were present.


    In company with Royalty our venerable host took me for a turn in the garden, and
    from the top of a hillock we obtained a good view of the adjacent country. At
    four o’clock all the guests sat down to a hearty meal. Two tables for Royalty
    were set apart, and at one of them I took my place, with the beautiful Princess
    Nashimoto on my left. She conversed with me in French, and I must confess that
    the beauty of that language lost nothing by her peculiar pronunciation of it.
    The Princess had been married only a short time, and her husband was then in France
    undergoing a course at a military school. The bashful naïté, the manners, and
    the conversation of these Princesses were altogether delightful, and differed
    wholly from those of European ladies. I was plied with questions as to the sights
    I had seen in Japan, and on my mentioning the geisha dance, much amusement and
    laughter were the result. The party broke up at five o’clock, and all took leave
    of their host and went home.


    A ball was given after dinner at the British Legation, so I had no time to spare
    after leaving the garden party. It was a formal affair, and all present were in
    full war-paint. I wore my best Punjabi costume, and this attracted much attention,
    as none of those present had ever seen one before. I entered the ballroom in company
    of the Princesses and the Princes and my host and hostess in solemn procession.
    The European diplomats and Japanese officials, as well as the other guests, were
    collected in the room as we entered, and the sight was really a fine one: pretty
    dresses, uniforms covered with decorations, all made up a brilliant scene the
    like of which is rarely seen in India.


    ![Image](Images/30.jpeg)

    [HER IMPERIAL HIGHNESS PRINCESS NASHIMOTO.](#009_9781_317949527_illustrations.html_ill3-12)

