    Leaving Nagoya in the evening, we reached Kioto the same night, and put up at
    Myako Hotel, pleasingly situated on the top of a small hill. This hotel is built
    entirely of wood, and has no pretensions to architectural beauty; it was, nevertheless,
    most comfortable to live in, and we found the food good; the courtesy and attention
    exhibited by the management could not have exceeded. During the night a heavy
    fall of snow took place, and on rising in the morning, everything was covered
    with a beautiful mantle of white. A portion of the city is visible from the hotel,
    as also are some mountains in the vicinity. So far, Western influences have not
    made their way to this place, which remains purely in consequence; it has, therefore,
    much more of interest to the sightseer from other lands than cities like Tokio
    and others.


    Formerly, notwithstanding the fact that the Emperor resides here for a portion
    of each year, the city has waned in importance and now ranks second to Tokio.
    Commercially and industrially, however, Kioto still holds premier place, for it
    is here that the best class of Japanese goods are made and sold. My time was unfortunately
    limited, but I determined to make the most of it, and commenced immediately after
    breakfast by visiting two of the Imperial palaces. Both places were purely Japanese
    in style and furnishing, making them in these respects strong contrasts with the
    palaces in Tokio. A visitors’ book at the entrance afforded me an opportunity
    of recording my name. Large notices in the hall announced that smoking was prohibited,
    and that overcoats and umbrellas were to be left behind. Shoes had to be removed
    at the entrance, but, as a special case, I was allowed to retain mine, with the
    addition of a large pair of outer slippers. The palaces occupy a space covering
    an area of no less than twenty-six acres, and six gates afford access to the interior.
    Formerly a number of smaller buildings existed outside the palaces themselves,
    but within the outer enclosures; in these buildings the nobles resided. In some
    portions of the palaces, which were formerly used exclusively by the Sovereign,
    Shinto festivals are now held. Sliding doors, which looked as if they were made
    of paper, were covered with beautiful paintings executed by some of the best artists.
    Here, also, we saw the Emperor’s throne—a canopied structure covered with fine
    silk of many colours.


    The next place we saw was called the Seriyoden; in this place were many paintings,
    the originals of some dating many centuries back. A corridor led us to the so-called
    “Ko-Gosho,” in which are three rooms all comparatively modern; they were decorated
    in bright colours, and were used for meetings of minor importance. Three hours
    only were at my disposal for inspecting the palaces, but to have done them thoroughly
    would have occupied at least a whole day. At the conclusion of the visit to the
    palaces we went to see a Japanese school of fencing. Men, women, and children
    go in for this graceful and healthy exercise. The system of Afrique in Japan is,
    like most other things there, totally different from that of any other country;
    their sticks are longer and more unwieldy, and at each point or lunge the combatants
    gave vent to a curious little whoop. It is odd to note that although Japan is
    abreast of the world in the matter of military science, weapons, etc., the people
    keep up their old style of fencing, wrestling, and athletic sports, merely to
    provide suitable exercise, and partly, in all probability, to prevent themselves
    from wholly losing touch with their ancient customs.


    ##


    After `déjeûner` on the 5th at the Yami Hotel (the largest in Kioto), we drove
    to see Imperial garden of Katsura-no-rikyu, a perfectly representative specimen
    of Japanese landscape gardening of the best kind. The style was most effective,
    and included artificial pools, miniature bridges, stepping-stones, trees cut and
    trained in fantastic shapes, and many other things equally curious and effective.
    The garden was well maintained, but the same cannot be said of the buildings,
    most of which were in a more or less tumbledown state.


