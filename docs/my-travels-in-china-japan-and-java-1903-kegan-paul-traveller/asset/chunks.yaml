    # Travels in Japan: Early Observations


    After lunch I went to a concert at the Ueno Park, about five miles distant. There
    I found myself in the midst of a fashionable gathering. The first part of the
    programme was devoted to European instrumental music, the performers being Japanese
    under the bâton of an Austrian `chef d’orchestre`. The execution was distinctly
    high class and altogether creditable to those who participated in it. The band
    formed part of the Imperial private establishment, hence it was known as the Imperial
    Orchestra. A number of accomplished amateurs also took part in the concert.


    The second part consisted entirely of Japanese singing and instrumental music.
    The singing is hard to describe; but it may be said to consist largely of trills,
    and it appeared to be executed in the minor key, accompanied by numerous facial
    contortions. I was told that the performance I am now endeavouring to describe
    was of a classical character; but it was noticeable that the more classical the
    music became, the more difficult it was for the Europeans present to restrain
    their laughter!


    My visit to Tokio having now come to an end, it only remained for me to bid goodbye
    to Sir C. MacDonald and his wife, and to thank them cordially for their many kindnesses
    to me. Their assistance went far to make my stay in Tokio both pleasant and instructive.


    ![Image](Images/40.jpeg)[TONOSAWA HOT SPRINGS, HAKONE DISTRICT.](#009_9781317949527_illustrations.html_ill3-22)


    Wherever I went in Japan I was shadowed by a couple of plain-clothes detectives.
    At first I was inclined to resent this, and expressed the opinion that their constant
    presence was unnecessary; it was, however, explained to me that it was made an
    invariable rule, when a distinguished visitor went to the country, to place a
    couple of detectives near him at all times and places. On some occasions I found
    these men of use, especially in crowded thoroughfares and at railway stations,
    etc., where, without undue fuss, they cleared a way for me through the crowd.


    ## Journey to Myanoshita


    I left Tokio on November 29 by the midday train. At three we reached a place called
    Noza, and on alighting from the train we proceeded in an electric tram, in which
    we remained for about an hour. The greater part of the way we passed villages
    in considerable numbers on both sides of the tram-line; occasionally we got glimpses
    of the open country, and noticed that we were gradually getting into a more hilly
    country. The hillsides were very fertile, and one could not help admiring the
    beautiful tints of autumn with which the trees were profusely covered. A torrent,
    which eventually formed a river, added another touch of beauty to the scene.


    An hour’s ride in the electric tram brought us to the place where we were obliged
    to change into ’rickshaws for Myanoshita. When we commenced our upward journey
    it was already becoming dark; but although the road was steep it was in good order,
    and we reached our destination in an hour’s time. There we found ourselves in
    a well-appointed hotel called the “Fujjiya.” Mademoiselle Yamagutchi, the charming
    daughter of the proprietor, showed us to our comfortable apartments. This young
    lady was typical of the Europeanised Japanese; her French was excellent.


    On rising the following day, we were delighted to find ourselves in a crisp, bracing
    climate. Myanoshita is another of Japan’s favourite mountain resorts; and although
    we did not visit it in the height of the season (the summer months), nevertheless
    the hotel was fairly full of European and American guests. The splendid climate
    induced us to make an expedition to Lake Hakone; this involved a stiff climb over
    a difficult path for about two and a half hours. `En route` we passed some beautiful
    valleys, and were interested to see a number of hot mineral springs, to which
    people suffering from various diseases go for relief.


    ![Image](Images/41.jpeg)[THE LAKE OF HAKONE.](#009_9781317949527_illustrations.html_ill3-23)


    A glance from the window of the Japanese inn revealed the lake spread out, as
    it were, at our feet. Surrounding it on all sides were high hills; but most magnificent
    of all was Mount Fujjiya, which reared its splendid head thirteen thousand feet
    high, and towered above all about it. Its shape is almost perfectly symmetrical,
    and resembles a cone or a pyramid. A reflection of the mountain in the still water
    of the lake added, if possible, more beauty to the scene. From the top, down to
    about six thousand feet, the peak was covered with glittering eternal snow, the
    reflection of the sun from which almost dazzled one.


