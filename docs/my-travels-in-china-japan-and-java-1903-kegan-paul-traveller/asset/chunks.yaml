- fmt: '

    # Memoirs


    *From a Photograph Presented to Rani Sahiba*. The State quadrille was first danced,
    and for a partner I had the honour of dancing with the charming Princess Nashimoto,
    who was exquisitely dressed, *à l’européenne*, in purple velvet, and wore fine
    diamonds on her head and neck. At midnight we adjourned for supper to a temporary
    room which had been put up for the purpose. Shortly after the Royalties left,
    and after saying good-night to my host and charming hostess, I also departed.
    Tokio society owes Lady MacDonald a debt of gratitude for the splendid entertainments
    which she so frequently gives, and for the kindly interest taken by her in all
    social and charitable institutions.


    On the 17th I visited the famous Shiba Temples, the finest in the capital. Several
    temples are situated in a quadrangle, and their interior decorations were on a
    somewhat elaborate scale, and consisted of painted and gilded wood carvings. I
    happened to visit the main temple at the time midday prayers were in progress.
    The priests and worshippers at intervals stood and knelt, repeating in a droning
    voice the Buddhist formula, “Om namo ami Daibutsu” (“Salute to Buddha”). It is
    said that the Emperor goes to these Buddhist temples once a year.


    It may not be generally known that in Japan two religions prevail: one is Buddhism
    in two or three different forms; the other is Shintoism, which is the State or
    Emperor’s religion. The latter can hardly be dignified by the name of religion,
    as it consists chiefly of ancestor worship, coupled to a very simple moral code,
    the chief principle of which is the deification of the Mikado. As a matter of
    fact, however, the average Japanese does not trouble his head seriously about
    religion of any kind.


    After doing the temples, I asked if I might see the head-priest, and was taken
    into the monastery, where he received me very courteously and offered the usual
    cup of tea (or, as it is called in Japan, *O’cha*). The tea, I may mention, was
    yellow in colour, and was served minus milk or sugar. It is customary to offer
    this tea wherever one went, no matter if it were in a shop or a temple. The high-priest
    was dressed in a yellow robe, and looked very learned and sage-like. He took me
    to see the other priests reciting their hymns, which I thought sounded like the
    Vedic hymns, as in both the droning, chant-like tone is adopted. At the close
    of their devotions the priests bowed their heads and joined their hands just as
    Hindus do. On leaving, the high-priest presented me with two copies of the Buddhist
    ritual printed in Japanese characters.


    ![Image](Images/32.jpeg)

    [A TEMPLE, TOKIO.](#009_9781317949527_illustrations.html_ill3-14)


    Immediately after leaving the spiritual atmosphere of the temples, I participated
    in an up-to-date wedding reception at the Imperial Hotel, to which I had been
    invited. The happy couple belonged to the aristocracy of Tokio, and after the
    wedding ceremony they met all their friends at the Imperial Hotel to receive their
    good wishes and congratulations. Several hundred guests appeared, and they comprised
    the *élite* of European and Japanese society. The bride (who belonged to one of
    the few Christian families) and bride-groom stood at the entrance and received
    their guests. The felicitations over, all present adjourned to the next room—I
    taking in the bride’s mother—and sat down to a tremendous repast, towards the
    end of which the usual healths were proposed and drunk, after which the guests
    departed.


    I may mention that in Japan marriages are arranged by a go-between, who, unlike
    people of the same class in India, are influential folk in their own particular
    circle. The marriage tie is very loose, and this is particularly the case among
    the lower class of people. According to modern law, a man can only have one legal
    wife; but the law is so lax that it is a common thing for a man to go to a registrar’s
    office and on the smallest pretext to request that his wife’s name may be struck
    off as a member of his family. After that he invariably procures another wife
    more to his liking. The subordination of the wife to the husband is complete.
    Her first duty is obedience to her husband; the second, obedience to her mother-in-law;
    and the third, obedience to her son in the event of her becoming a widow.


    At the wedding I have been describing the bride and bridegroom were dressed in
    European costume, but I observed that most of the Japanese ladies adhered to their
    own dress. European dress for Japanese is only considered *de rigueur* at Court
    functions, and some time ago an order was issued to the effect that Japanese costume
    at State ceremonials was to be abolished for all time. This order applied to men
    as well as ladies. A majority of Europeans and many Japanese men (the latter for
    reasons of economy) deplore the change from the national costume to that of the
    European; but from all I was able to gather, the real reason for the change was
    (in common with all other changes in Japan which tend towards Western ideas and
    appearances) to foster the impression that similarity of outward appearance induced
    a mental condition of equality.


    During a drive through a part of the city in the evening, I came to a broad, well-lighted
    street, having two and three-storied buildings on either side. Each house had
    a spacious platform in front of it, which was enclosed by gilt iron railings,
    the back portions being elaborately decorated and gilded. Within these enclosures,
    like a lot of wild animals in a zoological garden, sat a number of women, dressed
    in the gaudiest manner. The street was thronged with people of both sexes, it
    being the anniversary of some festival, and many of them, including women and
    girls, amused themselves by looking through the iron bars at the fair creatures
    imprisoned within. The latter were speechless and sat motionless, apparently indifferent
    to the gaze of the onlookers.


    I was wholly at loss to understand the meaning of this spectacle, and on inquiring
    from my guide, was informed that in this street, as well as some others, all the
    women of the class were confined, and by law were never allowed to leave it without
    special permission. The quarter I refer to is called “Yoshiwara”; and it is indicative
    of the difference in the feelings and ideas of morality prevailing in different
    parts of the world that the respectable middle class thought nothing of going
    there.


    The morning of November 18 we were invited to participate in one of the duck-hunts,
    few of which are annually held in the different preserves. The day was unfortunately
    cloudy and threatening. When all the guests had collected, under tents, and a
    move was to be made, the rain commenced, which, however did not damp the ardour
