  md: '# INTRODUCTION


    # The Passive Voice


    “HAS ALSO BEEN ASSOCIATED...”


    # 1.


    **Chairwoman:** I’d like to ask you one final question, and I’d like to begin
    with you, Dr. ____ Will you apologize to the American people...?


    A group of politicians has called a hearing to discuss an epidemic. Three witnesses
    have been subpoenaena. It’s the height of the pandemic. The meeting is virtual.
    Everyone is at home, in front of bookcases and kitchen cabinets. We’re an hour
    into the proceedings. I’m leaving out all the identifying details for the moment
    I want to focus exclusively on what was *said*: the words that were used, and
    the intentions behind them.


    **Witness #1:** I would be happy to apologize to the American people for all of
    the pain they have suffered and for the tragedies they’ve experienced in their
    families—and I thought I did that earlier in my opening comments. That was my
    intention.


    Witness #1 is in her seventies. Short, white hair. Dressed in black. At the beginning,
    she seemed to struggle with how to work the Mute button. It still seems flustered.
    She isn’t used to this. She comes from a world of privilege. Being confronted
    over her own behavior is clearly not something that has happened in her life with
    any frequency. Her tasteful glasses look like they might slide off the end of
    her nose.'
