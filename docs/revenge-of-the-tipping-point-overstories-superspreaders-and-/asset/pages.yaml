    # 2.


    Twenty-five years ago, in The Tipping Point, I was fascinated by the idea that
    in social epidemics little things could make a big difference. I came up with
    rules to describe the internal workings of social contagions: the Law of the Few,
    the Power of Context, the Stickiness Factor. The laws of epidemics, I argued,
    could be used to promote positive change: lower crime rates, teach kids how to
    read, curb cigarette smoking.


    Look at the world around you,” I wrote. “It may seem like an immovable, implacable
    place. It is not. With the slightest push—in just the right place—it can be tipped.”


    In Revenge of the Tipping Point, I want to look at the upside of the possibilities
    I explored so long ago. If the world could be moved by just the slightest push,
    then the person who knows where and when to push has real power. Who are those
    people? What are their intentions? What techniques are they using? In the world
    of law enforcement, the word forensic refers to an investigation of the origins
    and scope of a criminal act: “reasons, culprits, and consequences.” Revenge of
    the Tipping Point is an attempt to do forensic investigation of social epidemics.


    In the pages that follow, I’m going to take you to a mysterious office building
    in Miami with a very strange group of tenants, to a Marriott Hotel in Boston for
    an executive retreat that went badly awry, a seemingly perfect town called Poplar
    Grove, to a cul-de-sac in Palo Alto, and from there places you’ve heard of and
    places you haven’t. We’re going to investigate what’s weird about Waldorf Schools,
    meet a long-overlooked drug warrior named Paul E. Madden, raise an eyebrow at
    Harvard'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'University’s women’s rugby team, and learn about a 1970s television miniseries
    that changed the world. All of these are cases where people—either deliberately
    or inadvertently, virtuously or maliciously—made choices that altered the course
    and shape of a contagious phenomenon. And in every case those interventions raised
    questions we have to answer and problems we have to solve. That’s the revenge
    of the Tipping Point: The very same tools we use to build a better world can also
    be used against us.


    And at the end of the book I want to use the lessons gleaned from all of these
    examples to tell the real story of Witness #1, Witness #2, and Witness #3.


