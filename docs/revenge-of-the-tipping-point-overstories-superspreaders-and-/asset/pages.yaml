  md: '# Author ''s Note


    Twenty-five years ago, I published my first book. It was entitled The Tipping
    Point: How Little Things Make a Big Difference.


    Back then I had a little apartment in the Chelsea neighborhood of Manhattan, and
    I would sit at my desk with a glimpse of the Hudson River off in the distance,
    and write in the mornings before I headed to work. Because I had never written
    a book, I had no clear idea how to do it. I wrote with that mix of self-doubt
    and euphoria common to every first-time author


    > “The Tipping Point is the biography of an idea,” I began, and the idea is very
    simple.


    It is that the best way to understand the emergence of fashion trends, the ebb
    and flow of crime waves, or, for that matter, the transformation of unknown books
    into bestsellers, or the rise of teenage smoking, or the phenomena of word of
    mouth, or any number of the other mysterious changes that mark everyday life is
    to think of them as epidemics. Ideas and products and messages and behaviors spread
    just like viruses.


    The book was published in the spring of 2000, and the first stop on my book tour
    was a reading at a small independent bookstore in Los Angeles. Two people came,
    a stranger and the mother of a friend of mine—but not my friend. (I have forgiven
    her.) I said to myself, Well, I guess that’s it. But it wasn''t! The Tipping Point
    grew like the epidemics it described—at first gradually, then all in a rush. By
    the time the paperback came out, it had entered the zeitgeist. The book spent
    several years on the New York Times bestseller lists. Bill Clinton referred to
    it as “that book everyone has been'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'talking about.” The phrase tipping point became part of the vernacular. I used
    to joke that those words would be written on my tombstone.


    Do I know The Tipping Point touched such a chord? Not really. But if I had to
    guess, I would say it was because it was a hopeful book that matched the mood
    of a hopeful time. The year 2000 was an optimistic time. The new millennium had
    arrived. Crime and social problems were in freefall. The Cold War was over. I
    offered in my book a recipe for how to promote positive change—as the subtitle
    suggested, to find a way for little things to make a big difference.


    Twenty-five years is a long time. Think about how different you are today than
    you a quarter-century ago. Our opinions change. We care more about some things
    and less about others. Over the years, I would sometimes look back on what I had
    written in The Tipping Point and how I ever came to write the things I did. An
    entire chapter on the children’s television shows Sesame Street and Blue’s Clues?
    Where did that come from? I didn’t even have children back.


    I moved on Blink, Outliers, David and Goliath, Talking to Strangers, and The Bomber
    Mafia. I started the podcast Revisionist History. I settled down with the woman
    I love. I had two children and buried my father and took up running again and
    cut my hair. I sold the Chelsea apartment. I moved out of the city. A friend and
    I started an audio company called Pushkin Industries. I got a cat and named Biggie
    Smalls.


    You know the feeling of looking at a picture of yourself from long ago? When I
    do that, I have difficulty recognizing the person in the photograph. And so I
    thought it might be interesting to revisit The Tipping Point, on the occasion
    of its twenty-fifth birthday, to reexamine what I wrote long ago through a very
    different set of eyes; In The Tipping Point 2.0, a writer would return to the
    scene of his first, youthful success.


    But then, as I immersed myself once again in the world of social epidemics, I
    realized that I didn’t want to return to the same ground I had covered in The
    Tipping Point. The world seemed very different to my eyes. In The Tipping Point,
    I introduced a series of principles to make'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'sense of the kinds of sudden shifts in behavior and belief that make up our
    world. I still consider those ideas useful. But now I have different questions.
    And I find that I still do not understand many things about social epidemics.


    I had not reread The Tipping Point in the years since its publication, and when
    I finally did, in preparation for this project, I stopped every few pages to ask,
    What about this? How could I have left out that? In some far corner of my mind,
    I discovered, I had never stopped arguing with myself about how best to explain
    and understand tipping points and their many mysteries.


    And so I began again, with a fresh sheet of paper. And Revenge of the Tipping
    Point is the result: a new set of theories, stories, and arguments about the strange
    pathways that ideas and behavior follow through our world.'
