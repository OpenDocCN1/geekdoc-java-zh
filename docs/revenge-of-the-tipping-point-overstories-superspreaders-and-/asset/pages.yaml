    The opium poppy is a beautiful flower with a long stalk. After it blooms, the
    petals fall away to reveal a pod the size of a small egg filled with a thick yellowish
    sap. And for thousands of years, that sap has been the object of human fascination—a
    chemical cornucopia, in the words of one historian, “containing sugars, proteins,
    ammonia, latex, gums, plant wax, fats, sulphuric and lactic acids, water, meonic
    acid, and a wide range of alkaloids.


    Dry the sap and smoke it, and you get opium: Kingdoms have risen and fallen over
    opium. By extracting the alkaloids from the sap’s cocktail of compounds yields
    something even more valuable. In the early-nineteenth century, the German pharmacist
    Friedrich Sertürner isolated the first of the poppy’s alkaloids. He called it
    *morphium* or *morphine*, after Morpheus, the Greek god of dreams. Morphine pulled
    pain and produced a pleasing euphoria. It was also highly addictive.


    The next of the poppy’s gifts is codeine, isolated in 1832 by a Frenchman named
    Pierre Jean Robiquet. About forty years after that, the English chemist C. R.
    Wright boiled a mixture of morphine and acetic anhydride over a stove for several
    hours, looking for an opiate that wasn’t addictive. His concoction ended up being
    called *heroin*, and for a time it was heralded as the great alternative to morphine.'
