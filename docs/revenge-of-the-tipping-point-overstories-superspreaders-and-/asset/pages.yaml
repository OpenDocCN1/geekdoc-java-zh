  md: '![](img/6c0468c8c8d112642a113c314ae25fe2_249_0.png)


    That is very hard to accept. But so is the story that we tell ourselves that we
    bear no responsibility for the epidemics that surround us—that they come out of
    nowhere, that they should always surprise us.


    Epidemics have rules. They have boundaries. They are subject to overstories—and
    we are the ones who create overstories. They change in size and where those tipping
    points are. They are driven by a number of people, and those people can be identified.
    The tools necessary to control an epidemic are sitting on the table, right in
    front of us. We can let the unscrupulous take them. Or we can pick them ourselves,
    and use them to build a better world.


