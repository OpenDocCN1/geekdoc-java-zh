  md: '# # Acknowledgments


    The great economist Albert O. Hirschman once wrote:


    Creativity always comes as a surprise to us; therefore we can never count on it
    and we dare not believe in it until it has happened. In other words, we would
    not consciously engage upon tasks whose success clearly requires that creativity
    be forthcoming. Hence, the only way in which we can bring our creative resources
    fully into play is by misjudging the nature of the task, by presenting it to ourselves
    as more routine, simple, demanding of genuine creativity than it will turn out
    to be.


    I thought about Hirschman''s words a lot while writing this book. I started with
    the idea of doing a quick and simple refresh of *The Tipping Point*, on the occasion
    of its twenty-fifth anniversary. I thought, *Oh, this will be easy.* But halfway
    in, I realized I wanted to write an entirely new book. I brought my “creative
    resources fully into play” only because I misjudged the nature of my task. Thank
    you, Albert O., for—as always—explaining how things really work.


    My dear Jacob Weissberg was the person who suggested that I return to *The Tipping
    Point*. Thank you, Jacob.


    I was helped along the way by a long list of generous and insightful colleagues.
    Tali Emden found a million things for me. I have a shorthand use in the subject
    line of all my research requests: “Magic Powers.” Tali has magic powers. Nina
    Lawrence assisted on a hundred interviews. (When I could see Nina noding happily
    on the other side of the studio glass, I knew I was on something). Adam Grant,
    Ben Naddaf-Hafrey, Eloise Lynton,'
