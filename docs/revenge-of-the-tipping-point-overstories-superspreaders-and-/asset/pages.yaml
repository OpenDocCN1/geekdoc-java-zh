    Griffin’s argument goes something like this: Up through the 1970s, Miami was a
    small, sleepy, struggling Southern city. It started out as a winter-vacation haven,
    but just travel drained away many of the tourists. Orlando had become the state’s
    biggest attraction. Miami was dangerous. Miami Beach was a strip of dilapidated
    hotels. When business leaders in Miami thought about reviving their community,
