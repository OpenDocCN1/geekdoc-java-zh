    So OxyContin got an extra decade of life. Many more patients became addicted.
    On the street it was known as the “Rolls Royce of opioids, because it produced
    such a smooth high. Purdue pushed harder. The Core and Super responded. OxyContin
    sales hit $3 billion a year. Then came reformulation, making the pill all but
    impossible to crush and snort, as users had been doing for a decade. So the people
    who had been addicted to OxyContin switched to heroin. Then they switched from
    heroin to fentanyl. And finally they shifted from fentanyl to some combination
    of all of the above, mixed with tranquilizers and veterinary drugs and whatever
    else was at hand. By the early 2020s, the opioid epidemic that had begun back
    in 1996 with the introduction of OxyContin was claiming the lives of almost 70,000
    Americans a year.


    Two decades into a pandemic, that line should be going down, not up.

    “I have tried to figure out, was—is there anything that I could have done differently,
    knowing what I knew then, not what I know now,” Kathe Sackler said. Remember that
    quote from the very beginning of the book? She went on: “And I have to say, I
    can’t.”'
