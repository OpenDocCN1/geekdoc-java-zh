  md: 'In the previous chapter, you have seen how to create empty slides and how to
    add slides to it. In this chapter, you will learn how to get the list of available
    slides, and how to create a slide with different layouts.


    # Available Slide layouts


    PowerPoint presentations have slide layouts, and you can choose a desired layout
    to edit a slide. First of all, let us find out the list of all the slide layouts
    available.


    +   * There are different slide masters and in each slide master, there are several
    slide layouts.

    * You can get the list of the slide masters using the getSlideMasters() method
    of the XMLSlideShow class.

    * You can get the list of slide layouts from each slide master using the getSlideLayouts()
    method of the XSLSlideMaster class.

    * You can get the name of the slide layout from the layout object using the getType()
    method of the XSLFSlideLayout class.


    > Note: All these classes belongs to org.poi.xmlf.usermodel package.


    Given below is the complete program to get the list of available slide layouts
    in the PPT:


    ```

    import java.io.FileInputStream;


    import java.io.FileNotFoundException;


    import java.io.IOException;


    import org.apache.poi.xslf.usermodel.XMLSlideShow;


    import org.apache.poi.xslf.usermodel.XSLFSlideLayout;


    import org.apache.poi.xslf.usermodel.XSLFSlideMaster;

    ```'
