  md: '# 3. APACHE POI – INSTALLATION


    This chapter takes you through the process of setting up Apache POI on Windows
    and Linux based systems. Apache POI can easily be installed and integrated with
    your current Java environment, following a few simple steps without any complex
    setup procedures. User administration is required for installation.


    # System Requirements


    | | |

    |---||

    | JDK | Java SE 2 JDK 1.5 or above |

    | Memory | 1 GB RAM (recommended) |

    | Disk Space | No minimum requirement |

    | Operating System Version | Windows XP or above, Linux |


    Let us now proceed with the steps to install Apache POI.


    # Step 1: Verify your Java Installation


    First of all, you need to have Java Software Development Kit (SDK) installed on
    your system. To verify this, execute any of the following two commands depending
    on the platform you are working on.


    If the Java installation has been done properly, then it will display the current
    version and specification of your Java installation. A sample output is given
    in the following table.


    | Platform | Command | Sample Output |

    |---|---||

    | Windows | Open command console and type: \>java -version | Java version "1.7.0_60"
    Java (TM) SE Run Time Environment (build 1.7.0-60-b19) Java Hotspot (TM) 64-bit
    Server VM (build 24.60-b09,mixed mode) |

    | Linux | Open command | java version "1.7.0_25" |


