  md: '# 8. IMAGES


    In this chapter, you will learn how to add an image to a PPT and how to read an
    image from it.


    # Adding Image


    You can add images to a presentation using the createPicture() method of XSLFSlide.
    This method accepts image in the form of byte array format. Therefore, you have
    create a byte array of the image that is to be added to the presentation.


    Follow the given procedure to add an image to a presentation. Create an empty
    slideshow using XMLSlideShow as shown below:


    ```

    XMLSlideShow ppt = new XMLSlideShow();

    ```


    Create an empty presentation in it using createSlide().


    ```

    XSLFSlide slide = ppt.createSlide();

    ```


    Read the image that file is to be added and convert it into byte array using IOUtils.toByteArray()
    of the IOUTils class as shown below:


    ```

    //reading an image


    File image=new File("C://PPT//boy.jpg");


    //converting it into a byte array


    byte[] picture = IOUTils.toByteArray(new FileInputStream(image));

    ```


    Add the image to the presentation using addPicture(). This method accepts two
    variables: byte array format of the image that is to be added and the static variable
    representing the file format of the image. The usage of the addPicture() method
    is shown below:


    ```

    int idx = ppt.addPicture(picture, XSLFPictureData.PICTURE_TYPE_PNG);

    ```


