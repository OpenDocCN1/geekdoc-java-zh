    | JDK | Java SE 1.5 或以上 |

    | 内存 | 1 GB RAM (推荐) |

    | 磁盘空间 | 无限制 |

    | 操作系统 | Windows XP 或以上 |


    ## 第 1 步验证你的 Java 安装


    首先，你需要在系统中安装 Java 开发工具包 (SDK)。要验证这一点，请根据平台执行以下任意命令。如果 Java 安装正确，它将显示你当前 Java 安装的版本号。下表给示例输出。


    | 平台 | 命令 | 示例输出 |

    | :--- | :--- | :--- |

    | Windows | 打开控制台输入：`java -version` | Java version "1.7.0_60" (TM) SE Runtime
    Environment (HotSpot TM 64-Bit Server VM, build-60-19) |

    | Linux | 打开终端并输入：`java -version` | Java version "1.7.0_60" (TM) SE Runtime Environment
