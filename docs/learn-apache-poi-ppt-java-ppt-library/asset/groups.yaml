    \n59\n\n# 11. FORMATTING TEXT\n\n## Formatting Text in a Presentation\n\nThe text\
    \ in a presentation can be formatted using the methods of the XSLTextRun class.\
    \ For that, you have to create an XLTextRun class object by selecting one of the\
    \ slide layouts as shown below:\n\n```java\n//create the empty presentation\n\
    XMLSlideShow ppt = new XMLSlideShow();\n\n//getting the slide master object\n\
    XLFSlideMaster slideMaster = ppt.getSlideMasters()[0];\n\n//select a layout from\
    \ specified list\nXLFSlideLayout slidelayout = slideMaster.getLayout(SlideLayout.TITLE_AND_CONTENT);\n\
    \n//creating a slide with title and content layout\nXLFSlide slide = ppt.createSlide(slidelayout);\n\
    \n//selection of title place holder\nXLFTextShape body = slide.getPlaceholder(1);\n\
    \n//clear the existing text in the slide\nbody.clearText();\n\n//adding new paragraph\n\
    XLFTextParagraph paragraph=body.addNewTextParagraph();\n\n//creating text run\
    \ object\nXSLFTextRun run = paragraph.addNewRun();\n```\n\nYou can set the font\
    \ size of the text in the presentation setFontSize().\n\n```java\nrun.setFontColor(java.awt.Color.red);\n\
    run.setFontSize(24);\n```\n\nThe following code snippet shows how to apply different\
    \ formatting styles (bold, italic, underline, strikeout) to the text in a presentation.\n\
    \n```java\n//change the text into bold format\nrun.setBold(true);\n\n//change\
    \ the text it to italic format\nrun.setItalic(true);\n\n// strike through the\
    \ text\nrun.setStrikethrough(true);\n\n//underline the text\nrun.setUnderline(true);\n\
    ```\n\nTo have line breaks between paragraphs, use addLineBreak() of the XSLFTextParagraph\
    \ class as shown below:\n\n```java\nparagraph.addLineBreak();\n```\n\nGiven below\
    \ is the complete program to format the text using all the above methods:\n\n\
