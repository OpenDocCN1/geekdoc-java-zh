    Apache POI – PPT


    本教程将引导你如何使用 Java 处理 Microsoft PowerPoint 幻灯片。因此，讨论范围局限于 XSLF 组件。


    > 注意：旧版本的 POI 支持二进制文件格式，如 doc、xls、ppt 等。从 3.5 版本开始，POI 支持 MS-Office 的 OOXML 文件格式，如
    docx、xlsx、pptx 等。


