    # 2. JAVA PPT API 的各种变体


    本章将带你过并了解 Java PowerPoint API 的某些变体及其特性。有许多供应商提供与 Java PPT 相关的 API；本章涵盖了其中一些。


    ## Aspose Slides for Java


    Aspose slides for Java 是一种纯授权许可的 Java PPT API，由供应商 Aspose 开发和分发。该 API 的最新版本是 8.1.2，于
    2014 年 7 月发布。它是一个丰富且重量级的 API（结合了纯 Java 类和 AWT 类），用于设计可以读取、写入和管理幻灯片的 PPT 组件。该 API
    的常见用途如下：


    - 构建动态幻灯片

    - 渲染和打印高保真幻灯片

    - 生成、编辑和打印幻灯片


    ## Apache POI


    Apache POI 是由 Apache 基金提供的 100% 开源库。大多数中小型开发者严重依赖 Apache POI (XSLF) 库；然而，渲染和文本提取是它的主要功能。下面是
    Apache POI 的架构，它支持 PPT 的所有基本功能。


    ![](img/95f35ef98573c69266016c19d4858ebe_6_0.png)

    ![](img/95f35ef98573c69266016c19d4858ebe_7_0.png)


