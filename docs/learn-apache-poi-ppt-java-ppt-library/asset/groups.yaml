    # # 11. FORMATTING TEXT


    # ## Formatting Text in a Presentation


    The text in a presentation can be formatted using the methods of the XSLTextRun
    class. For that, you have to create an XLTextRun class object by selecting one
    of the slide layouts as shown below:


    ```

    //create the empty presentation

    XMLSlideShow ppt = new XMLSlideShow();


    //getting the slide master object

    XLFSlideMaster slideMaster = ppt.getSlideMasters()[0];


    //select a layout from specified list

    XLFSlideLayout slidelelayout = slideMaster.getLayout(SlideLayout.TITLE_AND_CONTENT);


    //creating a slide with title and content layout

    XLFSlide slide = ppt.createSlide(slidelayout);


    //selection of title place holder

    XLFTextShape body = slide.getPlaceholder(1);


    //clear the existing text in the slide

    body.clearText();


    //adding new paragraph

    XLFTextParagraph paragraph=body.addNewTextParagraph();

    ```'
