  - '[PAGE 4]


    # 1. APACHE POI – OVERVIEW


    Many a time, a software application is required to generate reports in Microsoft
    Office file format. Sometimes, an application is even expected to receive MS-Office
    files as input data.


    Any Java programmer who wants to produce MS Office files as output must use a
    predefined and read-only API to do.


    # What is Apache POI?


    Apache POI is a popular API that allows programmers to create, modify, and display
    MS-Office files using Java programs. It is an open source library developed and
    distributed by Apache Software Foundation. It contains classes and methods to
    decode the user input data, or a file into MS Office documents.


    # Components of Apache POI


    Apache POI contains classes and methods to work on all OLE2 Compound documents
    of MS-Office. The list of components of this API is given below:


    +   * POIFS (Poor Obfuscation Implementation File System): This component is the
    basic factor of all other POI elements. It is used to read different files explicitly.

    * HSSF (Horrible Spreadsheet Format): It is used to read and write .xls format
    of MS-Excel files.

    * XSSF (XML Spreadsheet Format): It is used for .xlsx file format of MS-Excel.

    * HPSF (Horrible Property Set Format): It is used to extract property sets of
    MS-Office files.

    * HWPF (Horrible Word Processor Format): It is used to read and write .doc extension
    files of MS-Word.

    * XWPF (XML Word Processor Format): It is used to read and write .docx extension
    files of MS-Word.

    * HSLF (Horrible Slide Layout Format): It is used to read, create, and edit PowerPoint
    presentations.

    * HDGF (Horrible DiaGram Format): It contains classes and methods for MS-Visio
    binary files.

    * HPBF (Horrible PuBlisher Format): It is used to read and write MS-Publisher
    files.'
- md: '

    Apache POI – PPT


    This tutorial guides you through the process of working on Microsoft PowerPoint
    presentation using Java. Therefore the discussion is confined to XSLF component.


    > Note: Older versions of POI support binary file formats such as doc, xls, ppt,
    etc. Version 3.5 onwards, POI supports OOXML file formats of MS-Office such as
    docx, xlsx, pptx, etc.


    2


    ![](img/95f35ef98573c69266016c19d4858ebe_5_0.png)


    # 2. FLAVORS OF JAVA PPT API


    This chapter takes you through some of the flavors of Java PowerPoint API and
    their features. There are many vendors who provide Java PPT related APIs; some
    of them are considered in this chapter.


    ## Aspose Slides for Java


    Aspose slides for Java is a purely licensed Java PPT API, developed and distributed
    by the vendor Aspose. The latest version of this API is 8.1.2, released in July
    2014. It is a rich and heavy API (combination of plain Java classes and AWT classes)
    for designing PPT component that can read, write, and manage slides. The common
    uses of this API are as follows:


    - Build dynamic presentations

    - Render and print high-fidelity presentations

    - Generate, edit, and print presentations


    ## Apache POI


    Apache POI is a 100% open source library provided by Apache Foundation. Most of
    small and medium scale developers depend heavily on Apache POI (XSLF) libraries;
    however, rendering and text extraction are its main features. Given below is architecture
    of Apache POI which supports all basic features of PPT.


    ![](img/95f35ef98573c69266016c19d4858ebe_6_0.png)

    ![](img/95f35ef98573c69266016c19d4858ebe_7_0.png)


    # 3. APACHE POI INSTALLATION


    This chapter takes you through the process of setting up Apache POI on Windows
    and Linux based systems. Apache POI can easily installed and integrated with your
    current Java environment, following a few simple steps without any complex setup
    procedures.


    ## System Requirements


    | Requirement | Value |

    | :--- | :--- |

    | JDK | Java SE 1.5 or above |

    | Memory | 1 GB RAM (recommended) |

    | Disk Space | No minimum |

    | Operating System | Windows XP or above |


    ## Step 1: Verify your Java Installation


    First of all, you need to have Java Development Kit (SDK) installed on your system.
    To verify this, execute any of the following commands depending on the platform.
    If the Java installation has been done properly, it will display the current version
    of your Java installation. A sample output is given in the following table.


    | Platform | Command | Sample Output |

    | :--- | :--- | :--- |

    | Windows | Open console and type: `java -version` | Java version "1.7.0_60" (TM)
    SE Runtime Environment (HotSpot TM 64-Bit Server VM, build-60-19) |

    | Linux | Open terminal and type: `java -version` | Java version "1.7.0_60" (TM)
    SE Runtime Environment (HotSpot TM 64-Bit Server VM, build-60-25) |


    ![](img/95f35ef98573c69266016c19d4858ebe_8_0.png)


    - Java 64-Bit VM (mixed mode)


    - We assume that the readers of this tutorial have Java version 1.7.0_60 installed
    on their system.

    - In case you do not have Java SDK, download its current version from http://www.oracle.com/javase/downloads/index.html
    and install it.


    ## Step 2: Set your Java Environment


    Set the environment JAVA_HOME to point to the base directory where Java is installed
    on your machine. For example, append the full path of Java compiler location to
    the System Path.


    | Platform | Description |

    | :--- | :--- |

    | Windows | Set JAVA_HOME to `C:\Program Files\java\jdk.7.0_60` and append the
    String `"C:\Program Files\java\jdk.7.0_60\bin"` to the end of the system variable
    PATH. |

    | Linux | Export JAVA_HOME=/usr/local/java-current and Export PATH=$PATH:$JAVA_HOME/bin/
    |


    Execute the command `java -version` from the command prompt as above.


    ## Step 3: Install Apache POI Library


    Download the latest version of Apache POI from http://poi.apache.org/download.html
    and unzip its contents to a folder from the required libraries can be linked to
    your Java program. Let us assume the files are collected in a folder on C drive.


    ![](img/95f35ef98573c69266016c19d4858ebe_9_0.png)


    The following images show the directories and the file structures inside the downloaded
    folder:


    ![](img/95f35ef98573c69266016c19d4858ebe_10_0.png)


    Add the complete path of the five jars as highlighted in the blue image to the
    CLSPATH.


    | Platform | Description |

    | :--- | :--- |

    | Windows | Append the following strings to the end of the user variable CLSPATH:
    `"C:\poi-3.9\poi-3.9-20121203.jar;"C:\poi-3.9\poi-oxml-3.9-20121203.jar;"C:\poi-3.9\poi-oxml-schemas-3.9-20121203.jar;"C:\poi-3.9\oxml-lib\dom4j-1.6.1.jar;"C:\poi-3.9\oxml-lib\xmlbeans-2.3.0.jar;"`
    |

    | Linux | Export CLASSPATH=$CLASSPATH:/usr/share/poi-3.9/poi-3.9-20121203.tar:/usr/share/poi-3.9/poi-ooxml-schemas-3.9-20121203.tar:/usr/share/poi-3.9/ooxml-3.9-20121203.tar:/usr/share/poi-3.9/ooxml-lib/dom4j-1.6.1.tar:/usr/share/poi-3.9/ooxml-lib/xmlbeans-2.3.0.tar
    |


    # 4. CLASSES AND METHODS


    In this chapter, we will learn about a few classes and methods under Apache POI
    API that are crucial to work on PPT files using Java programs.


    ## Presentation


    To create and manage a presentation, the methods of the XSLShow class are used.
    Given below are some important methods of this class.


