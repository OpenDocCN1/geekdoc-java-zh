- md: "\nThe output PPT document with newly added slides looks as follows:\n\n![](img/95f35ef98573c69266016c19d4858ebe_24_0.png)\n\
    \nAfter adding slides to a PPT, you can add, perform, read, and write operations\
    \ on the slides.\n\nIn the previous chapter, you have seen how to create empty\
    \ slides and how to add slides to it. In this chapter, you will learn how to get\
    \ the list of available slides, and how to create a slide with different layouts.\n\
    \n## Available Slide layouts\n\nPowerPoint presentations have slide layouts, and\
    \ you can choose a desired layout to edit a slide. First of all, let us find out\
    \ the list of all the slide layouts available.\n\n- There are different slide\
    \ masters and in each slide master, there are several slide layouts.\n- You can\
    \ get the list of the slide masters using the getSlideMasters() method of the\
    \ XMLSlideShow class.\n- You can get the list of slide layouts from each slide\
    \ master using the getSlideLayouts() method of the XSLFMaster class.\n- You can\
    \ get the name of the slide layout from the layout object using the getType()\
    \ method of the XSLFSlideLayout class.\n\n> Note: All these classes belongs to\
    \ org.poi.xmlf.usermodel package.\n\nGiven below is the complete program to get\
    \ the list of available slide layouts in the PPT:\n\n```java\nimport java.io.FileInputStream;\n\
    \nimport java.io.FileNotFoundException;\n\nimport java.io.IOException;\n\nimport\
    \ org.apache.poi.xslf.usermodel.XMLSlideShow;\n\nimport org.apache.poi.xslf.usermodel.XSLFSlideLayout;\n\
    \nimport org.apache.poi.xslf.usermodel.XSLFSlideMaster;\n```\n\n```java\npublic\
    \ class SlideLayouts {\n    public static void main(String[] args[]) throws IOException\
    \ {\n\n        // create an empty presentation\n\n        XMLSlideShow ppt = new\
    \ XMLSlideShow();\n\n        System.out.println(\"Available slide layouts:\");\n\
    \n        // getting the list of all slide masters\n\n        for(XSLFSlideMaster\
    \ master : ppt.getSlideMasters()){\n\n            // getting the list of the layouts\
    \ in each slide master\n            for(XSLFSlideLayout layout : master.getSlideLayouts()){\n\
    \n                // getting the list of available slides\n                System.out.println(layout.getType());\n\
    \            }\n        }\n    }\n}\n```\n\nSave the above Java code as SlideLayouts.java,\
    \ and then compile and execute it from the command prompt as:\n\n```bash\n$javac\
    \ SlideLayouts.java\n```\n\n![](img/95f35ef98573c69266016c19d4858ebe_26_0.png)\n\
    \n```bash\n$java SlideLayouts\n```It will compile and execute to generate the\
    \ following output:\n\n```\nAvailable slide layouts:\n\nTITLE\nPIC_TX\nVERT_TX\n\
    TWO_TX_TWO_OBJ\nBLANK\nVERT_TITLE_AND_TX\nTITLE_AND_CONTENT\nTITLE_ONLY\nSECTION_HEADER\n\
    TWO_OBJ\nOBJ_TX\n```\n\nShown below are some of the sample slide layouts available\
    \ with MS-Office 360, 2013 edition.\n\n![](img/95f35ef98573c69266016c19d4858ebe_28_0.png)\n\
    \n## Title Layout\n\nLet us create a slide in a PPT Using Title layout. Follow\
    \ the steps given below:\n\n**Step 1:** Create an empty presentation by instantiating\
    \ the XMLSlideShow class as shown below:\n\n```java\nXMLSlideShow ppt = new XMLSlideShow();\n\
    ```\n\n**Step 2:** Get the list of slide masters using the getSlideMasters() method.\
    \ Thereafter, select the desired slide master using the index as shown below:\n\
    \n```java\nXSLFSlideMaster master = ppt.getSlideMasters()[0];\n```\n\nHere we\
    \ are getting the default slide master which is in the 0th location of the slide\
    \ masters array.\n\n**Step 3:** Get the desired layout using the getLayout() method\
    \ of the **XSLFSlideMaster** class. This method accepts a parameter where you\
    \ have to pass one of the static variable of the SlideLayout class, which represents\
    \ our desired layout. There are several variables in this class where each variable\
    \ represents a slide layout. The code snippet given below shows how to create\
    \ a slide layout:\n\n```java\nXSLFSlideLayout titleLayout = master.getLayout(SlideLayout.TITLE);\n\
    ```\n\n**Step 4:** Create a new slide by passing a slide layout object as parameter.\n\
    \n```java\nXSLFSlide slide = ppt.createSlide(titleLayout);\n```\n\n**Step 5:**\
    \ Select a placeholder using the getPlaceholder() method of the XSLFSlide class.\
    \ This method accepts an integer parameter. By passing 0 to it, you will get the\
    \ XSLFTextShape object, using which you can access title area of the slide. Set\
    \ the title using the setText() method as shown below:\n\n```java\nXSLFTextShape\
    \ title1 = slide.getPlaceholder(0);\n\n//setting the title\ntitle1.setText(\"\
    Title\");\n```\n\nGiven below is the complete program to create a slide with Title\
    \ layout in a presentation:\n\n```java\nimport java.io.File;\n\nimport java.io.FileOutputStream;\n\
    \nimport java.io.IOException;\n\nimport org.apache.poi.xslf.usermodel.SlideLayout;\n\
    import org.apache.poi.xslf.usermodel.XMLSlideShow;\nimport org.apache.poi.xslf.usermodel.XSLFSlide;\n\
    import org.apache.poi.xslf.usermodel.XSLFSlideLayout;\nimport org.apache.poi.xslf.usermodel.XSLFSlideMaster;\n\
    import org.apache.poi.xslf.usermodel.XSLFTextShape;\n\n![](img/95f35ef98573c69266016c19d4858ebe_29_0.png)\n\
    \n```java\npublic class TitleLayout {\n\n    public static void main(String[]\
    \ args[]) throws Exception {\n\n        // creating presentation\n        XMLSlideShow\
    \ ppt = new XMLSlideShow();\n\n        // getting the slide master object\n  \
    \      XSLFSlideMaster master = ppt.getSlideMasters()[0];\n\n        // get the\
    \ desired slide layout\n        XSLFSlideLayout titleLayout = master.getLayout(SlideLayout.TITLE);\n\
    \n        // creating a slide with title layout\n        XSLFSlide slide1 = ppt.createSlide(titleLayout);\n\
    \n        // selecting the placeholder in it\n        XSLFTextShape title1 = slide1.getPlaceholder(0);\n\
    \n        // setting the title\n        title1.setText(\"Title\");\n\n       \
    \ // create a file object\n        File file = new File(\"C:\\\\PPT\\\\Examples\\\
    \\Titlelayout.pptx\");\n        FileOutputStream out = new FileOutputStream(file);\n\
    \n        // save the changes in a PPT document\n        ppt.write(out);\n\n \
    \       System.out.println(\"created successfully\");\n\n        out.close();\n\
