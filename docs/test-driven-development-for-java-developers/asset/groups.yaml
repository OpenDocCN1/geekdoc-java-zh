    # 5-3 CONFIGURING A MAVEN PLUGIN


    In the previous sections we saw that some Maven plugins are already configured
    so that their goals are bound to the lifecycles of Maven. Such configurations
    are inherited from the super POM and the bindings to the lifecycle phases are
    also based on the packaging type of the current project. We also saw that, independently
    of whether they are configured or not, goals of plugins can be executed directly.


    If we want to configure a Maven plugin in the project POM (or in its parent POM,
    in case of a multi-module project) we must do that in the following section.


    ```

    1 <build>

    2 <plugins>

    3

    4 </plugins>

    5 </build>

    ```


    Each plugin is configured in an element <plugin>.


    The configuration of a plugin typically consists of specifying


    +   * its Maven coordinates.

    * an optional configuration, that is, passing some arguments to the plugin, in
    a <configuration> element; these have the element shape <key>value</key>;

    * the binding of its goals to the lifecycle phases; binding is specified in an
    <execution> element, inside the <executions> element.


    Each <execution> can have a different configuration if needed (otherwise-the main
    <configuration> is used for all the <executions>. Thus,'
- md: "\n## 5.3 CONFIGURING A MAVEN PLUGIN\n\nthe same goal can be configured to run\
    \ multiple times with different configurations in different phases. Each execution\
    \ can also be assigned an <id> (Section Run Maven goals concerning the specification\
    \ of an id when running a Maven goal). When multiple executions are bound to the\
    \ same phase, they will be executed in the order specified in the POM; executions\
    \ that are inherited from the parent POM will be executed first.\n\nThus, a plugin\
    \ configuration typically has the following shape\n\n```xml\n<plugin>\n  <groupId>...</groupId>\n\
    \  <artifactId>...</artifactId>\n  <version>...</version>\n  <executions>\n  \
    \  <execution>\n      <id>...</id>\n      <phase>phase to bind the goal to</phase>\n\
    \      <goals>\n        <goal>plugin goal</goal>\n      </goals>\n      <configuration>\n\
    \        ... configuration for this execution only\n      </configuration>\n \
    \   </execution>\n    <execution>\n      ... as above\n    </execution>\n  </executions>\n\
    \  <configuration>\n    ... configuration common to all executions\n  </configuration>\n\
    </plugin>\n```\n\nNote that a plugin goal might have a default phase; in that\
    \ case, if no phase is specified, the goal mentioned in the <execution> element\
    \ will run in its default phase. When a plugin is configured, possible configurations\
    \ of the same plugin that are inherited from the parent POM are merged in the\
    \ current project. Before going on, let's have a look at the default configuration\
    \ of the maven-compiler-plugin in one of our Maven projects. We can examine this\
    \ by looking at the “Effective POM”\n\nNote that the groupId is omitted since\
    \ this is a standard Maven plugin. There is no explicit <configuration>, thus\
    \ the default configuration values\n\n```xml\n<plugin>\n  <artifactId>maven-compiler-plugin</artifactId>\n\
    \  <version>3.1</version>\n  <executions>\n    <execution>\n      <id>default-compile</id>\n\
    \      <phase>compile</phase>\n      <goals>\n        <goal>compile</goal>\n \
    \     </goals>\n    </execution>\n    <execution>\n      <id>default-testCompile</id>\n\
    \      <phase>test-compile</phase>\n      <goals>\n        <goal>testCompile</goal>\n\
    \      </goals>\n    </execution>\n  </executions>\n</plugin>\n```\n\nare used\
    \ (recall that this plugin also takes into consideration the user properties we\
    \ used for specifying the Java compilation level). Then, the goal compile is bound\
    \ to the phase compile and the goal testCompile is bound to the phase test-compile.\n\
    \nIn the rest of this section we will see a few examples of Maven plugin configurations.\n\
    \n### 5.3.1 Configuring the Maven compiler plugin\n\nAn alternative way of configuring\
    \ the Java compilation setting is to configure the maven-compiler-plugin passing\
    \ the arguments corresponding to the user properties we used before\n\nIn one\
    \ of the Maven projects that we had already configured for Java 8, let's remove\
    \ the properties we had previously set\n\nIn Eclipse, when changing a plugin configuration\
    \ like the maven-compiler-plugin in the POM, you get an error like this\n\nSo\
    \ we also must update the project. The Java compilation level will still be 1.8,\
    \ though we used a different method to configure it.\n\nIf we want to use a plugin\
    \ in all projects of a multi-module project, we configure the plugin in the parent\
    \ POM: all sub-modules will inherit such a configuration.\n\n## 5.3 CONFIGURING\
    \ A MAVEN PLUGIN\n\n```xml\n<plugin>\n  <artifactId>maven-compiler-plugin</artifactId>\n\
    \  <version>3.1</version>\n  <executions>\n    <execution>\n      <id>default-compile</id>\n\
    \      <phase>compile</phase>\n      <goals>\n        <goal>compile</goal>\n \
    \     </goals>\n      <configuration>\n        <source>1.8</source>\n        <target>1.8</target>\n\
    \      </configuration>\n    </execution>\n    <execution>\n      <id>default-test-compile</id>\n\
    \      <phase>test-compile</phase>\n      <goals>\n        <goal>testCompile</goal>\n\
    \      </goals>\n    </execution>\n  </executions>\n  <configuration>\n    <source>1.8</source>\n\
    \    <target>1.8</target>\n  </configuration>\n</plugin>\n```\n\n### 5.3.2 Create\
    \ source and javadoc\n\nFor open source projects that are released on a remote\
    \ repository, it is best practice to publish also a JAR with sources and a JAR\
    \ with Javadoc, besides the standard binary JAR artifact. This is achieved using\
    \ two standard Maven plugins: maven-source-plugin and maven-javadoc-plugin, respectively.\n\
    \nNote that these two plugins, besides generating the JARs with sources and javadoc,\
    \ will also “attach” the two additional JARs as artifacts of the current project.\
    \ This way, these two additional JARs will also be installed and deployed in the\
    \ corresponding lifecycle phases.\n\nIn case of a multi-module project we can\
    \ configure these two plugins in the parent POM, so that all sub-modules will\
    \ automatically have such plugins enabled and configured.\n\nThe idea is to configure\
    \ these two plugins by binding the goals jar (the name of the goal is the same\
    \ in the two plugins) to the phase package, that is, the phase where the standard\
    \ binary JAR is also created.\n\nFor the sources we configure:\n\n```xml\n<plugin>\n\
    \  <groupId>org.apache.maven.plugins</groupId>\n  <artifactId>maven-source-plugin</artifactId>\n\
    \  <version>3.0.1</version>\n  <executions>\n    <execution>\n      <id>attach-sources</id>\n\
    \      <!-- the phase jar would not be required in this case: goal jar of this\
    \ plugin already binds by default to the \"package\" phase -->\n      <phase>package</phase>\n\
    \      <goals>\n        <goal>jar</goal>\n      </goals>\n    </execution>\n \
    \ </executions>\n</plugin>\n```\n\nNote that we could skip the specification of\
    \ the phase: by default, the goal jar is already bound to the phase package.\n\
    \nFor the Javadoc:\n\nNow, if we run the Maven build specifying the phase package\
    \ (or some later phase), the two additional JARS will be generated.\n\nFor example,\
    \ if we configured the above plugins in the my-app-parent of the example we created\
    \ in the previous sections, by running mvn package on the parent project the two\
    \ sub-modules will contain the additional JARS:\n\n## 5.3 CONFIGURING A MAVEN\
    \ PLUGIN\n\n```xml\n<plugin>\n  <groupId>org.apache.maven.plugins</groupId>\n\
    \  <artifactId>maven-javadoc-plugin</artifactId>\n  <version>3.0</version>\n \
    \ <executions>\n    <execution>\n      <id>attach-javadoc</id>\n      <phase>package</phase>\n\
    \      <goals>\n        <goal>jar</goal>\n      </goals>\n    </execution>\n \
    \ </executions>\n</plugin>\n```\n\nThe Javadoc html files are generated in target/apocs\
    \ directory, before they are packaged in jar. You can browse them with.\n\n###\
    \ 5.3.3 Configuring the jar\n\nLet's create a new project using the maven-archetype-quickstart,\
    \ as done before. We use com.company.app for the groupId, my-app for the artifactId\
    \ and 1.0-SNAPSHOT for the version.\n\n```java\npackage com.company.app;\n\npublic\
    \ class App {\n  public static void main(String[] args) {\n    System.out.println(\"\
    Hello World!\");\n  }\n}\n```\n\nLet's create the jar for this project, with mvn\
    \ package. Now we try to run from the command line the Java application by running\
    \ the generated jar, which can be in target/my-app-1.0-SNAPSHOT.jar:\n\nIndeed,\
    \ the generated META-INF/MANIFEST.MF inside the generated JAR, by default, has\
    \ no information about the class with the main method. In such a case, in order\
    \ to run a Java application we need to be more explicit: we add the JAR to the\
    \ classpath and specify the fully qualified name of the class with the main method:\n\
    \n```bash\njava -cp target/my-app-1.0-SNAPSHOT.jar com.company.app.App\n```\n\n\
    This time the main method is correctly executed.\n\nHowever, when a jar is created\
    \ with a main class, it is better to add this information to the manifest in the\
    \ generated JAR, so that we can directly run the JAR, as we tried to previously.\n\
    \nIt is just a matter of configuring the maven-jar-plugin. Such a plugin is already\
    \ configured with its goal bound to the phase package (have a look at the \"Effective\
    \ POM\"). We just need to configure it so that we add the fully qualified name\
    \ of the main class in the generated JAR, this is done by specifying the fully\
    \ qualified name of the main class with the element <className> of the element\
    \ <manifest>\n\n```xml\n<build>\n  <plugins>\n    <plugin>\n      <artifactId>maven-jar-plugin</artifactId>\n\
    \      <version>2.4</version>\n      <configuration>\n        <archive>\n    \
    \      <manifest>\n            <className>com.company.app.App</className>\n  \
    \        </manifest>\n        </archive>\n      </configuration>\n    </plugin>\n\
    \  </plugins>\n</build>\n```\n\nOnce again, our configuration is still merged\
    \ with the inherited one, so that the jar goal is still bound to the phase package\
    \ (have a look at the \"Effective POM\").\n"
  mdcn: "\n\n## 5.3 配置 MAVEN 插件\n\n同一个目标可以配置为在不同的阶段以不同的配置运行多次。每个执行都可以被分配一个 <id>（参见[关于在运行\
    \ Maven 目标时指定 id 规范的运行 Maven 目标]章节）。当多个执行项绑定到同一个阶段时，它们将按照 POM 中指定的顺序进行执行；继承自父\
    \ POM 的执行项将首先执行。\n\n因此，插件配置通常如下所示：\n\n```xml\n<plugin>\n  <groupId>...</groupId>\n\
    \  <artifactId>...</artifactId>\n  <version>...</version>\n  <executions>\n  \
    \  <execution>\n      <id>...</id>\n      <phase>绑定到该目标的阶段</phase>\n      <goals>\n\
    \        <goal>插件目标（plugin goal）</goal>\n      </goals>\n      <configuration>\n\
    \        ... 仅适用于本次执行的配置\n      </configuration>\n    </execution>\n    <execution>\n\
    \      ... 如上所示\n    </execution>\n  </executions>\n  <configuration>\n    ...\
    \ 所有执行通用的配置\n  </configuration>\n</plugin>\n```\n\n注意，插件目标可能有一个默认阶段；在这种情况下，如果没有指定阶段，<execution>\
    \ 元素中提到的目标将在其默认阶段运行。当配置一个插件时，继承自父 POM 的相同插件的可能配置将在当前项目中进行合并。在继续之前，让我们看一眼我们其中一个\
    \ Maven 项目中 `maven-compiler-plugin` 的默认配置。我们可以通过查看“有效 POM（Effective POM）”来检查这一点。\n\
    \n注意由于这是一个标准的 Maven 插件，因此省略了 groupId。没有显式的 <configuration>，因此使用了默认配置值：\n\n```xml\n\
    <plugin>\n  <artifactId>maven-compiler-plugin</artifactId>\n  <version>3.1</version>\n\
    \  <executions>\n    <execution>\n      <id>default-compile</id>\n      <phase>compile</phase>\n\
    \      <goals>\n        <goal>compile</goal>\n      </goals>\n    </execution>\n\
    \    <execution>\n      <id>default-testCompile</id>\n      <phase>test-compile</phase>\n\
    \      <goals>\n        <goal>testCompile</goal>\n      </goals>\n    </execution>\n\
    \  </executions>\n</plugin>\n```\n\n（记住，此插件还考虑了我们用于指定 Java 编译级别的用户属性）。然后，`compile`\
    \ 目标绑定到 `compile` 阶段，`testCompile` 目标绑定到 `test-compile` 阶段。\n\n在本节的剩余部分，我们将看到一些\
    \ Maven 插件配置的示例。\n\n### 5.3.1 配置 Maven 编译器插件\n\n配置 Java 编译设置的另一种方法是配置 `maven-compiler-plugin`，传递与我们之前使用的用户属性相对应的参数。\n\
    \n在我们已经配置为 Java 8 的 Maven 项目之一中，让我们移除之前设置的属性。\n\n在 Eclipse 中，当更改 POM 中像 `maven-compiler-plugin`\
    \ 这样的插件配置时，你会得到如下错误：\n\n所以我们必须更新项目。尽管我们使用了不同的方法来配置它，但 Java 编译级别仍然是 1.8。\n\n如果我们想在多模块项目的所有项目中使用某个插件，我们可以在父\
    \ POM 中配置该插件：所有子模块将继承此类配置。\n\n## 5.3 配置 MAVEN 插件\n\n```xml\n<plugin>\n  <artifactId>maven-compiler-plugin</artifactId>\n\
    \  <version>3.1</version>\n  <executions>\n    <execution>\n      <id>default-compile</id>\n\
    \      <phase>compile</phase>\n      <goals>\n        <goal>compile</goal>\n \
    \     </goals>\n      <configuration>\n        <source>1.8</source>\n        <target>1.8</target>\n\
    \      </configuration>\n    </execution>\n    <execution>\n      <id>default-test-compile</id>\n\
    \      <phase>test-compile</phase>\n      <goals>\n        <goal>testCompile</goal>\n\
    \      </goals>\n    </execution>\n  </executions>\n  <configuration>\n    <source>1.8</source>\n\
    \    <target>1.8</target>\n  </configuration>\n</plugin>\n```\n\n### 5.3.2 创建源码和\
    \ javadoc\n\n对于发布在远程仓库的开源项目，除了标准的二进制 JAR 构件之外，发布包含源码的 JAR 和包含 Javadoc 的 JAR 是最佳实践。这是通过分别使用两个标准的\
    \ Maven 插件实现的：`maven-source-plugin` 和 `maven-javadoc-plugin`。\n\n注意，这两个插件除了生成带有源码和\
    \ javadoc 的 JAR 之外，还将这两个额外的 JAR “附加（attach）”为当前项目的构件。通过这样，这两个额外的 JAR 也将在相应的生命周期阶段被安装和部署。\n\
    \n在多模块项目中，我们可以在父 POM 中配置这两个插件，这样子模块将自动包含这些配置。\n\n这种做法是在 `package` 阶段配置这些插件，以便子模块将包含这些配置。\n\
    \n对于源码，我们配置如下：\n\n```xml\n<plugin>\n  <groupId>org.apache.maven.plugins</groupId>\n\
    \  <artifactId>maven-source-plugin</artifactId>\n  <version>3.0</version>\n  <executions>\n\
    \    <execution>\n      <id>attach-sources</id>\n      <phase>package</phase>\n\
    \      <goals>\n        <goal>jar</goal>\n      </goals>\n      <configuration>\n\
    \        <!-- 包含源码的配置 -->\n      </configuration>\n    </execution>\n  </executions>\n\
    </plugin>\n```\n\n注意，由于没有指定阶段，<execution> 元素中提到的目标将在其默认阶段运行。\n\n对于 Javadoc，如果我们在\
    \ `package` 阶段运行 Maven 构建，那么生成的 JAR 子模块将包含额外的 Javadoc：\n\n（注：此处原文示例代码似乎不完整，已根据翻译逻辑保留上下文结构）\n\
    \n注意，由于没有指定阶段，插件的 `jar` 目标默认绑定到 `package` 阶段。\n\n对于 Javadoc，现在，如果我们在 `package`\
    \ 阶段运行 Maven 构建，那么生成的 JAR 子模块将包含额外的 Javadoc：\n\n## 5.3 配置 MAVEN 插件\n\n```xml\n\
    <plugin>\n  <groupId>org.apache.maven.plugins</groupId>\n  <artifactId>maven-javadoc-plugin</artifactId>\n\
    \  <version>3.0</version>\n  <executions>\n    <execution>\n      <id>attach-javadoc</id>\n\
    \      <phase>package</phase>\n      <goals>\n        <goal>jar</goal>\n     \
    \ </goals>\n    </execution>\n  </executions>\n</plugin>\n```\n\nJavadoc HTML\
    \ 文件生成在 `target/apocs` 目录下，然后它们被打包到 JAR 中。你可以浏览它们。\n\n### 5.3.3 配置 jar\n\n让我们使用\
    \ `maven-archetype-quickstart` 创建一个新项目，如之前所示。我们使用 `company.app` 作为 groupId，`my-app`\
    \ 作为 artifactId，`1.0-SNAPSHOT` 作为 version。\n\n```java\npackage company.app;\n\n\
    public class App {\n  public static void main(String[] args) {\n    System.out.println(\"\
    Hello World!\");\n  }\n}\n```\n\n通过 `mvn package` 为此项目创建 jar。现在我们尝试从命令行运行 Java\
    \ 应用程序，运行生成的 `target/my-app-1.SNAPSHOT.jar`：\n\n确实，生成的 JAR 内部的 `META-INF/MANIFEST.MF`\
    \ 默认没有主类信息。在这种情况下，为了运行 Java 应用程序，我们需要更加显式：我们将 JAR 添加到类路径并指定主类的完全限定名：\n\n```bash\n\
    java -cp target/my-app-1.SNAPSHOT.jar company.app.App\n```\n\n这一次主方法正确执行了。\n\n\
    然而，当创建一个带有主类的 jar 时，最好将此信息添加到生成 JAR 的 manifest 中，这样我们就可以直接运行 jar，正如我们之前尝试的那样。\n\
    \n这只是配置 `maven-jar-plugin` 的问题。该插件已经配置了其目标绑定到 `package` 阶段（查看“有效 POM”）。我们只需要配置它，以便在生成的\
    \ JAR 中添加主类的完全限定名，这是通过指定 `<manifest>` 元素中的 `<className>` 完成的：\n\n```xml\n<build>\n\
    \  <plugins>\n    <plugin>\n      <artifactId>maven-jar-plugin</artifactId>\n\
    \      <version>2.4</version>\n      <configuration>\n        <archive>\n    \
    \      <manifest>\n            <className>com.company.app.App</className>\n  \
    \        </manifest>\n        </archive>\n      </configuration>\n    </plugin>\n\
    \  </plugins>\n</build>\n```\n\n再次，我们的配置仍然与继承的配置合并，因此 `jar` 目标仍然绑定到 `package`\
    \ 阶段（查看“有效 POM”）。\n\n"
