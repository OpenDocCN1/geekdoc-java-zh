- md: "\n## 3.5 TEST DRIVEN DEVELOPMENT USING JUNIT:\n\n![](img/259250058ab8da9c293dfc86b5ff65c5_15_0.png)\n\
    \n![](img/259250058ab8da9c293dfc86b5ff65c5_15_1.png)\n\nLet us run the test again\
    \ and this time the test succeeds, as we expected. The JUnit view will show the\
    \ “green bar”: all tests succeeded (in our case, there is currently one test):\n\
    \n![](img/259250058ab8da9c293dfc86b5ff65c5_15_2.png)\n\nWe consider the non-base\
    \ case scenario, that is, the recursive case. So, we must write another test method.\n\
    \nDo not be tempted to copy and paste the previous tests: tests must be clean\
    \ code as well, we must avoid copy-and-paste. What do the two tests have in common?\
    \ Given an input to the compute method they expect a specific output. So, let\
    \ us refactor the previous test to have some reusable code for the second test.\n\
    \nFirst of all, the SUT object should be a field of the test class, which is created\
    \ freshly before every test (remember that each test must be executable independently\
    \ from each other; in this example, the Factorial class is stateless so reusing\
    \ the same instance would not be a problem, but in the future we could make Factorial\
    \ stateful—for instance, we could cache the results). Such field should be initialized\
    \ in a method annotated with @Before\n\nWe will perform refactoring using the\
    \ tools of Eclipse.\n\nAdd a private variable in FactorialTest class\n\n```\n\
    public class FactorialTest {\n    private Factorial factorial;\n\n    @Before\n\
    \    public void testTestCase() {\n        Factorial factorial = new Factorial();\n\
    \        int result = factorial.compute(0);\n        assertEquals(1, result);\n\
    \    }\n}\n```\n\nWe create a method annotated with @Before (Use the content assist\
    \ for the annotation, so that the corresponding import will be automatically inserted);\
    \ the name of the method is not important, but we use a meaningful name:\n\n```\n\
    public class FactorialTest {\n    private Factorial factorial;\n\n    @Before\n\
    \    public void setup() {}\n\n    @Test\n    public void testTestCase() {\n \
    \       Factorial factorial = new Factorial();\n        int result = factorial.compute(0);\n\
    \        assertEquals(1, result);\n    }\n}\n```\n\n## 3.5 TEST DRIVEN DEVELOPMENT\
    \ USING WITH JUNIT:\n\nMove the initialization of the field from the test method\
    \ to the setup method.\n\n```\nimport org.junit.Before;\nimport org.junit.Test;\n\
    \npublic class FactorialTest {\n    private Factorial factorial;\n    @Before\n\
    \    public void setup() {\n        factorial = new Factorial();\n    }\n\n  \
    \  @Test\n    public void testTestCase() {\n        int result = factorial.compute(0);\n\
    \        assertEquals(1, result);\n    }\n}\n```\n\nNow we use the “Extract method”:\
    \ select the body of the method testTestCase, right-click, Refactor Method...\
    \ → (the shortcut Shift+Alt+M)\n\n| Before | With... | After |\n| --- | --- |\
    \ --- |\n| Window: Hello | Change Method Signature... | Extract Interface |\n\
    | FactorialTest | References | Extract Superclasses |\n| | Declarations | Use\
    \ Superclass Where Possible... |\n| Find Bugs | Pull Up... | |\n| | Delete As\
    \ | Push Down... |\n| | Validate | Extract Class |\n| | Team | Introduce Parameter\
    \ Object... |\n| | Compare With | |\n| | Replace With | |\n| | Performance | |\n\
    | | Remove From Context | | |\n\nIn the dialog we choose a name for the new method,\
    \ e.g., assertFactorial (we make it private since we use it in this test class):\n\
    \nNow we are refactoring for turning an expression in a method into a new parameter\
    \ of the method (this will add a new method and in each call site it will add\
    \ argument as the original expression).\n\nWe want to parameterize the new method\
    \ with a parameter for the input (to be passed to compute) and a parameter for\
    \ the expected output (to be passed to assertEquals). The expression that must\
    \ be turned into\n\n![](img/259250058ab8da9c293dfc86b5ff65c5_17_0.png)\n\n```\n\
    import org.junit.Before;\nimport org.junit.Test;\n\npublic class FactorialTest\
    \ {\n    private Factorial factorial;\n    @Before\n    public void setup() {\n\
    \        factorial = new Factorial();\n    }\n    @Test\n    public void testBaseCase()\
    \ {\n        extracted();\n    }\n    private void extracted() {\n        int\
    \ result = factorial.compute(0);\n        assertEquals(1, result);\n    }\n}\n\
    ```\n\nthe input parameter is 0 in this example, and the other expression to be\
    \ turned into the other parameter is 1 in this example.\n\nSelect \"0\" in the\
    \ method assertFactorial, right-click and Refactor → Introduce Parameter..., and\
    \ specify a name for the new parameter, e.g., input:\n\n![](img/259250058ab8da9c293dfc86b5ff65c5_18_0.png)\n\
    \nDo the same for \"1\" specifying the expected. The final result after refactoring\
    \ should look like this: Of course, run the test again just to make sure we’t\
    \ break anything with the refactoring. Now we can easily write the new test for\
    \ the non case.\n\n```\nimport static org.junit.Assert.assertEquals;\n\nimport\
    \ org.junit.Before;\nimport org.junit.Test;\n\npublic class FactorialTest {\n\
    \    private Factorial factorial;\n    @Before\n    public void setUp() {\n  \
    \      factorial = new factorial();\n    }\n    @Test\n    public void testBaseCase()\
    \ {\n        extracted(0, 1);\n    }\n    private void extracted(int input, int\
    \ expected) {\n        int result = factorial.compute(input);\n        assertEquals(expected,\
    \ result);\n    }\n}\n```\n\nFor example, with input 5 we expect 120. Note that\
    \ the new test is just one line of code and is readable:\n\n```\n@Test\npublic\
    \ void testBaseCase() {\n    extracted(5, 120);\n}\n```\n\nLet us run all the\
    \ tests. We expect the new test to fail since our method always returns 1. By\
    \ following strictly TDD, we should modify the method so that the new test passes\
    \ (see below for additional explanations):\n\n```\npublic int compute(int i) {\n\
    \    return 120;\n}\n```\n\nLet us run all the tests: the new test succeeds but\
    \ the previous test will fail. You see that it is crucial to run ALL tests after\
    \ any modification. NOTE: since unit tests must be fast, running all the tests\
    \ does not require much time so it does not impact your productivity. We should\
    \ now modify the method so that all tests succeed. A trivial way to do that is\
    \ this: Now all tests succeed. What is wrong in the process we just performed\n\
    \n```\npublic int compute(int i) {\n    if (i <= 0) {\n        return 1;\n   \
    \ }\n    return 120;\n}\n```\n\nThe implementation does not make sense (and it\
    \ does not implement the factorial), though we followed TDD\n\n```\n@Test\npublic\
    \ void testBaseCase() {\n    assertEquals(5, factorial.compute(4));\n}\n```\n\n\
    This will fail with our stupid implementation of factorial at least for the non-base\
    \ case. Moreover, it specifies the behaviour of the factorial correctly. Let us\
    \ fix the implementation of compute to make all tests succeed:\n\n```\npublic\
    \ int compute(int i) {\n    if (i <= 0) {\n        return 1;\n    }\n    return\
    \ i * compute(i-1);\n}\n```\n\nNote that these tests specify the behavior of factorial\
    \ at least for 5; due to the recursive nature of the test, which reflects the\
    \ recursive nature of factorial, it is much harder to write an implementation\
    \ that works only for these two input values and does not work for other inputs,\
    \ thus we're much safer now. all this process for implementing the factorial might\
    \ seem odd; couldn't we simply write the factorial together? If you want to follow\
    \ TDD the answer is no. Even in a more complex scenario all these steps would\
    \ make the implementation much easier. Moreover, since we would have to learn\
    \ TDD, you must practice it the way. Finally, this allowed us to write the tests\
    \ in a clean and clear way. Are we done? Did we miss something? What if the input\
    \ is negative? The factorial is not defined on negative numbers. Let us write\
    \ a test, specifying a fake result:\n\n```\n@Test\npublic void testNegativeInput()\
    \ {\n    assertFactorial(-1, 0);\n}\n```\n\nTDD tells you you must be aware of\
    \ the reason why the test will fail. In this example, we expect a StackOverflowException\
    \ since our recursion does not terminate. Now we must write a test that specifies\
    \ that given a negative (invalid) input we expect an exception; for example, an\
    \ IllegalArgumentException. (Of course, since we are writing tests as specification\
    \ of software that we still need to implement, it is now time to design and decide\
    \ what happens with invalid inputs; you could also return a value as -1, but that\
    \ would not make sense for the factorial: it is much better to throw exceptions\
    \ when input are invalid). We can write the test like that:\n\n```\n@Test\npublic\
    \ void testNegativeInput() {\n    try {\n    assertFactorial(-1, 0);\n    fail(\"\
    should not get here\");\n    } catch (IllegalArgumentException e) {\n    // OK\n\
    }\n}\n```\n\nVerify that the test still fails, and modify compute so that it succeeds:\n\
    \n```\npublic int compute(int i) {\n    if (i < 0) {\n        if (i == 0) {\n\
    \            throw new IllegalArgumentException(\"negative input\");\n       \
    \ }\n        return 1;\n    }\n    return i * compute(i-1);\n}\n```\n\nNow all\
    \ tests succeed. A better way to write tests with expected exceptions is to use\
    \ JUnit specific mechanisms (see also JUnit documentation, https://github.com/junit-team/junit4/exceptiontesting):\n\
    \n```\n@expected(IllegalArgumentException.class)\npublic void testNegativeInput()\
    \ {\n    assertFactorial(-1, 0);\n}\n```\n\nThis test will fail if an exception\
    \ of the specified type is not thrown during the execution.\n"
  mdcn: "\n\n## 3.5 使用 JUNIT 进行测试驱动开发\n\n![](img/259250058ab8da9c293dfc86b5ff65c5_15_0.png)\n\
    \n![](img/259250058ab8da9c293dfc86b5ff65c5_15_1.png)\n\n让我们再次运行测试，这次测试如我们预期的那样成功了。JUnit\
    \ 视图将显示“绿条”：所有测试均已通过（在我们案例中，目前有一个测试）：\n\n![](img/259250058ab8da9c293dfc86b5ff65c5_15_2.png)\n\
    \n我们考虑非基础情况的情况，即递归情况。因此，我们必须编写另一个测试方法。\n\n不要受到复制粘贴之前测试的诱：测试也必须是整洁的代码，我们必须避免复制粘贴。这两个测试有什么共同点？给定\
    \ `compute` 方法一个输入，它们期望一个特定的输出。因此，让我们重构之前的测试，为第二个测试提供一些可重用的代码。\n\n首先，SUT（被测试系统）对象应该是测试类的一个字段，并在每个测试之前之前重新创建（记住每个测试必须能够独立执行；在这个示例中，`Factorial`\
    \ 类是无状态的，所以重用同一个实例没有问题，但未来我们可以让 `Factorial` 有状态——例如，我们可以缓存结果）。此类字段应该在带有 @Before\
    \ 注解的方法中初始化。\n\n我们将使用 Eclipse 工具进行重构。\n\n在 `FactorialTest` 类中添加私有变量\n\n```\npublic\
    \ class FactorialTest {\n    private Factorial factorial;\n\n    @Before\n   \
    \ public void testTestCase() {\n        Factorial factorial = new Factorial();\n\
    \        int result = factorial.compute(0);\n        assertEquals(1, result);\n\
    \    }\n}\n```\n\n我们创建一个带有 @Before 注解的方法（使用代码辅助功能来输入注解，这样会自动插入相应的导入语句）；方法的名称并不重要，但我们使用一个有意义的名字：\n\
    \n```\npublic class FactorialTest {\n    private Factorial factorial;\n\n    @Before\n\
    \    public void setup() {}\n\n    @Test\n    public void testTestCase() {\n \
    \       Factorial factorial = new Factorial();\n        int result = factorial.compute(0);\n\
    \        assertEquals(1, result);\n    }\n}\n```\n\n## 3.5 使用 JUNIT 进行测试驱动开发：\n\
    \n将字段的初始化从测试方法移动到设置方法。\n\n```\nimport org.junit.Before;\nimport org.junit.Test;\n\
    \npublic class FactorialTest {\n    private Factorial factorial;\n    @Before\n\
    \    public void setup() {\n        factorial = new Factorial();\n    }\n\n  \
    \  @Test\n    public void testTestCase() {\n        int result = factorial.compute(0);\n\
    \        assertEquals(1, result);\n    }\n}\n```\n\n现在我们使用“提取方法：选择 `testTestCase`\
    \ 方法的主体，右键点击，Refactor Method...（快捷键 Shift+Alt+M）\n\n| 之前 | 使用... | 之后 |\n| ---\
    \ | --- | --- |\n| Window: Hello | Change Method Signature... | Extract Interface\
    \ |\n| FactorialTest | References | Extract Superclasses |\n| | Declarations |\
    \ Use Superclass Where Possible... |\n| Find Bugs | Pull Up... | |\n| | Delete\
    \ As | Push Down... |\n| | Validate | Extract Class |\n| | Team | Introduce Parameter\
    \ Object... |\n| | Compare With | |\n| | Replace With | |\n| | Performance | |\n\
    | | Remove From Context | | |\n\n在对话框中，我们为新方法选择一个名称，例如 `assertFactorial`（因为我们在此测试类中使用它，所以将其设为私有）：\n\
    \n现在我们将一个方法中的表达式转换为方法的新参数（这将添加一个新方法，并在每个调用处都将原始表达式作为参数添加）。\n\n我们希望为新方法参数化，带一个输入参数（传递给\
    \ `compute`）和一个预期输出参数（传递给 `assertEquals`）。必须转换为的表达式是\n\n![](img/259250058ab8da9c293dfc86b5ff65c5_17_0.png)\n\
    \n```\nimport org.junit.Before;\nimport org.junit.Test;\n\npublic class FactorialTest\
    \ {\n    private Factorial factorial;\n    @Before\n    public void setup() {\n\
    \        factorial = new Factorial();\n    }\n    @Test\n    public void testBaseCase()\
    \ {\n        extracted();\n    }\n    private void extracted() {\n        int\
    \ result = factorial.compute(0);\n        assertEquals(1, result);\n    }\n}\n\
    ```\n\n在这个例子中，输入参数是 0，另一个要转换的表达式是 1。\n\n在 `assertFactorial` 方法中选择 \"0\"，右键点击 Refactor\
    \ → Introduce Parameter...，并为新参数指定一个名称，例如 input：![](img/259250058ab8da9c293dfc86b5ff65c5_18_0.png)\n\
    \n对 \"1\" 执行相同的操作并指定预期值。重构后的最终结果应该是：再次运行测试以确保没有破坏任何内容。现在我们可以为非基础情况编写新测试。\n\n```\n\
    import static org.junit.Assert.assertEquals;\n\nimport org.junit.Before;\nimport\
    \ org.junit.Test;\n\npublic class FactorialTest {\n    private Factorial factorial;\n\
    \    @Before\n    public void setUp() {\n        factorial = new factorial();\n\
    \    }\n    @Test\n    public void testBaseCase() {\n        extracted(0, 1);\n\
    \    }\n    private void extracted(int input, int expected) {\n        int result\
    \ = factorial.compute(input);\n        assertEquals(expected, result);\n    }\n\
    }\n```\n\n例如，对于输入 5，我们期望是 120。注意新测试只有一行代码且是可读的：\n\n```\n@Test\npublic void testBaseCase()\
    \ {\n    extracted(5, 120);\n}\n```\n\n运行所有测试。由于我们的方法总是返回 1，预期新测试失败。通过严格遵循 TDD，我们应该修改方法使所有测试通过（见下文解释）：\n\
    \n```\npublic int compute(int i) {\n    return 120;\n}\n```\n\n运行所有测试：新测试通过了，但之前的测试将失败。注意：由于单元测试必须快速，运行所有测试不需要花费太多时间，因此不会影响你的生产力。我们现在应该修改方法使所有测试通过。这样做的一种简单方法是：现在所有测试通过了。我们刚刚执行的流程哪里错了：\n\
    \n```\npublic int compute(int i) {\n    if (i <= 0) {\n        return 1;\n   \
    \ }\n    return 120;\n}\n```\n\n尽管遵循了 TDD，但这种实现没有意义：\n\n```\n@Test\npublic void\
    \ testBaseCase() {\n    assertEquals(5, factorial.compute(4));\n}\n```\n\n这将导致我们的愚的阶乘实现失败，至少对于非基础情况。此外，它正确地指定了阶乘的行为。让我们修复\
    \ `compute` 实现使所有测试通过：\n\n```\npublic int compute(int i) {\n    if (i <= 0) {\n\
    \        return 1;\n    }\n    return i * compute(i-1);\n}\n```\n\n编写带有预期异常的测试更好方法是使用\
    \ JUnit 特有的机制（另见 JUnit 文档，https://github.com/junit-team/junit4/exceptiontesting）：\n\
    \n```\n@expected(IllegalArgumentException.class)\npublic void testNegativeInput()\
    \ {\n    assertFactorial(-1, 0);\n}\n```\n\n如果在执行期间没有抛出指定类型的异常，则此测试将失败。\n\n"
