  mdcn: "\n\n## 7.2 DOCKER 与 JAVA 应用程序\n\n我们的 Java 应用（注意执行命令是如何被拆分为字符串的）。总结来说，Dockerfile\
    \ 中的上述所有指令都将在构建镜像期间执行，而不是在容器中运行镜像时。唯一的例外是 `CMD`，它不会在构建镜像期间执行：它将作为在容器中运行此镜像时执行默认命令。\n\
    \n我们使用 `docker build` 命令构建镜像，通过 `-t` 参数指定镜像名称（后面跟着名称和可选的 `name:tag` 格式），并将上下文路径（context\
    \ path）作为最后一个参数。我们在项目的根目录下运行该命令，该目录是 Dockerfile 创建的地方，目标文件也生成在那里（记住 `COPY` 命令的源相对于上下文目录）。因此，上下文是当前目录“.”。不需要指定\
    \ Dockerfile 的路径，因为默认情况下，它是从执行 `docker build` 命令的目录读取的。\n\n```\n$ docker build\
    \ -t java-hello-world .\nStep 1/5 FROM ubuntu:bionic\n  download the ubuntu:bionic\
    \ image if not already downloaded...\nStep 2/5 RUN apt-get update && \\\\\napt-get\
    \ install -y openjdk-8-jdk && \\\\\napt-get clean\nrun the apt commands, these\
    \ will take a while:\nthe Ubuntu repositories are updated, all the packages are\
    \ downloaded\nand finally installed\nStep 3/5 RUN java-version\n--> Running in\
    \ 3944341d56ea\nopenjdk version \"1.8.0_191\"\nOpenJDK Runtime (build)\n1.8.0.191-b12-0.ubuntu.16.04.1-b12\n\
    OpenJDK JDK 64-Bit Server VM (build 25.191-b12, mixed mode)\nStep 4/5 COPY /target/hellodocker-0.0.1-SNAPSHOT.jar\
    \ /app/app.jar\nStep 5/5 CMD \"java\", \"-cp\", \"/app/app.jar\",\n  \"com.examples.hellodocker.App\"\
    \n\nSuccessfully built ...\nSuccessfully tagged java-hello-world:latest\n```\n\
    \n列表 7.3：Dockerfile 示例\n\n我们可以通过运行以下命令来手动测试镜像：\n\n```\n$ docker run --rm java-hello-world\n\
    Hello World! \n: rm.txt\n```\n\n列表 7.4：构建\n\n如果我们再次尝试构建镜像，将会发现 Docker 足够智能，能够理解自上次构建以来\
    \ Dockerfile 中没有发生任何变化，它将通过重用层来重新构建镜像：它甚至不会再次执行 `apt` 命令，也不会打印 Java 版本：\n\n```\n\
    $ docker build -t java-hello-world\n..\\nStep 2/5 : RUN apt-get update && \\\\\
    \napt-get install -y openjdk-8-jdk && \\\\\napt-get clean\n--> Using cache\nStep\
    \ 7/5 : RUN java -version\n--> Using cache\nStep 4/5 : COPY /target/hellodocker-0.0.1-SNAPSHOT.jar\
    \ /app/app.jar\n--> Using cache\n..\n```\n\n列表 7.5：dockerbuild.txt\n\n但请注意，Docker\
    \ 还会跟踪 `COPY` 命令源文件可能发生的变化：如果我们重新构建了 Java JAR，那么 Docker 构建镜像时将重新执行从 `COPY` 开始的所有步骤。这将确保我们构建的镜像始终包含最新版本的\
    \ JAR。\n\n此外，即使是更改 Dockerfile 中 `RUN` 命令的空格也会导致这些缓存失效。例如，将：\n\n```\n..\\nRUN apt-get\
    \ update && \\\\\napt-get install -y openjdk-8-jdk && \\\\\napt-get clean\n..\n\
    ```\n\n```\n6\n7 into\n8\n9\n10 ...\n11 RUN apt-get update && apt-get install\
    \ -y openjdk-8-jdk && \\\n12 apt-get clean\n13\n```\n\n列表 7.6：apt-get.txt 将使构建重新执行\
    \ `apt` 命令以及 Dockerfile 中的所有后续步骤。\n\n我们在上述 Dockerfile 中采用的方法（即从通用 Linux OS 镜像开始并安装所需的软件）可能并非最优。事实上，我们应该立即查找是否有已经可用的\
