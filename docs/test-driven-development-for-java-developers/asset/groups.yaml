    \n现在我们可以运行这些新的集成测试并验证它们是否成功。在 Eclipse 中运行这些测试时，手动启动 Docker 容器是可以的；但在 Maven 构建时，必须在运行集成测试之前启动容器（至少在该集成测试用例运行之前）。同样，在集成测试之后必须停止容器，无论测试是否成功。\n\
