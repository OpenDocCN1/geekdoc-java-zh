    \ select Maven -> Update Project..., in the dialog make sure that both the parent\
    \ and the module projects are selected and that checkbox \"Update project configuration\
    \ from pom.xml\" is selected.\n\n## 5.2 MAVEN PACKAGING\n\nAlthough the Java compiler\
    \ setting is specified in the parent project, the module project inherits this\
    \ setting as well.\n\nLet’s add a Java class in the src/main/java and a test case\
    \ class in src/test/java in the module project (e.g., the ones created by Maven\
    \ archetype). Although the module POM does not declare JUnit as a test dependency,\
    \ the test still compiles: inherits the JUnit dependency from the parent POM.\n\
    \nWe can now create another module project, my-app-module2, with the above procedure.\
    \ Also this submodule will inherit all the configurations from the parent POM.\n\
    \n![](img/25925005ab8da9c293dfc86b5ff65c5_112_0.png)\n\nNote that in Eclipse,\
    \ you could access the sources of the module projects both from the module project\
    \ itself and from the module project’s subfolder from the parent project.\n\n\
    The “Project Explorer” view allows you to have a single “Hierarchical” presentation\
    \ of nested projects, so that you avoid the above duplicate folders: from the\
    \ view menu select Projects Presentation → Hierarchical.\n\nIn this section, we\
    \ add a dependency on the first module in order to avoid repeating such information\
    \ and to force consistency, we use the parent properties. Once we save this POM,\
    \ in Eclipse, let's see the effective POM of the module that we created in the\
    \ previous section:\n\n## 5.2 MAVEN PACKAGING\n\n```xml\n<project>\n  <modelVersion>4.0.0</modelVersion>\n\
    \  <parent>\n    <groupId>com.example</groupId>\n    <artifactId>my-app-parent</artifactId>\n\
    \    <version>0.1-SNAPSHOT</version>\n  </parent>\n  <artifactId>my-app-module</artifactId>\n\
    \  <dependencies>\n    <dependency>\n      <groupId>com.example</groupId>\n  \
    \    <artifactId>my-app-parent</artifactId>\n      <version>0.1-SNAPSHOT</version>\n\
    \    </dependency>\n  </dependencies>\n</project>\n```\n\nFrom the command line\
    \ the effective POM can be obtained as follows:\n```bash\nmvn help:effective-pom\n\
    ```\n\nIn Eclipse, m2e editor provides a dedicated tab (of course, read-only),\
    \ for example, let's examine the effective POM of my-app-module:\n\n- The groupId\
    \ and version, which we omitted, are there (and they are the same as the parent\
    \ POM);\n- Properties are inherited as well as the JUnit dependency;\n- Many configurations\
    \ are present;\n- All paths are made absolute (source and output directories);\n\
    - The <modules> section is NOT inherited from the parent POM.\n\n## 5.3 CONFIGURING\
    \ A MAVEN PLUGIN\n\n```java\npackage org.app.module2;\n\npublic class App {\n\
    \    public static void main(String[] args) {\n        org.app.module1.App.main(args);\n\
    \    }\n}\n```\n\n##5.3 CONFIGURING A MAVEN PLUGIN\n\nIn the previous sections\
    \ we saw that some Maven plugins are already configured so that their goals are\
    \ bound to the lifecycles of Maven. Such configurations are inherited from the\
    \ super POM and the bindings to the lifecycle phases are also based on the packaging\
    \ type of the current project. We also saw that, independently of whether they\
    \ are configured or not, goals of plugins can be executed directly.\n\nIf we want\
    \ to configure a Maven plugin in the project POM (or in its parent POM, in case\
    \ of a multi-module project) we must do that in the following section.\n\n```xml\n\
    <build>\n  <plugins>\n\n</plugins>\n</build>\n```\n\nEach plugin is configured\
    \ in an element <plugin>.\n\nThe configuration of a plugin typically consists\
    \ of specifying:\n\n- its Maven coordinates.\n- an optional configuration, that\
    \ is, passing some arguments to the plugin, in a <configuration> element; these\
    \ have the element shape <key>value</key>;\n- the binding of its goals to the\
    \ lifecycle phases; binding is specified in an <execution> element, inside the\
    \ <executions> element.\n\nEach <execution> can have a different configuration\
    \ if needed (otherwise-the main <configuration> is used for all the <executions>.\n"
