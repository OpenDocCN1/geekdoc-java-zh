    - flightsSearchSteps.verifyThatTitleAndHeadingIsCorrect();\n- flightsSearchSteps.searchFlightsBetween(\"\
    Boston\", \"New York\");\n- assertThat(flightsSearchSteps.foundFlights().size(),\
    \ greater(0));\n```\nListing 10.5: openHomePage.java\n\nWe have a handy example\
    \ for this case as well, which you can find by \"src/test/java/ui/pageobject/FindFlightsPageObjectWithStepsExample.java\"\
    \ in the project.\n\nBut if you use the Page objects, you might get or later run\
    \ into a contradiction that you will stuck with a framework that is very heavy\
