- md: "\n## 5.1 MAVEN\n\n`<groupId>:<artifactId>:<version>:<goal>`\n\nThe version\
    \ can be omitted. In that case, the version will be taken from the configuration\
    \ of that plugin in the POM (taking into consideration also the parent POM, see\
    \ Section Parent and modules). If no configuration is found, the latest version\
    \ will be used.\n\n`<groupId>:<artifactId>:<goal>`\n\nFor the standard Maven plugins,\
    \ the group can be omitted:\n\n`<artifactId>:<goal>`\n\nIf a plugin has several\
    \ goals with the same name attached to the same phase(that is, executions, which\
    \ we'll see later in Section Configuring a Maven plugin), you can specify the\
    \ `<goal>` id of a single execution of that goal.\n\n`<groupId>:<artifactId>:<goal>@<id>`\
    \ Moreover, if an artifactId has occurrences of “maven” and “plugin”, surrounded\
    \ by hyphens (“-”), a shorter form can be used, by specifying only the prefix.\
    \ For example, instead of maven-compiler-plugin we can simply specify compiler.\n\
    \nThis is based on a convention for naming Maven plugins:\n\n```\nmaven-${prefix}-plugin\n\
    \  for official plugins maintained by the Apache Maven team itself\n${prefix}-maven-plugin\n\
    \  for plugins developed by other teams\n```\n\nSpecifying a goal at command line\
    \ means executing only that goal independently from any phase. For example, the\
    \ following command only compiles the Java sources (compare this with the execution\
    \ of mvn compile):\n\n```\nmvn compiler:compile\n```\n\nThat is, it executes only\
    \ the compile goal of the maven-compiler-plugin.\n\nOf course, phases and goals\
    \ can be mixed on the command line. This is especially useful when you need to\
    \ explicitly run a goal of a plugin, which by default is not bound to any phase.\
    \ Note that some goals of plugins can automatically invoke complete phases. An\
    \ example is the goal report of the maven-surefire-report-plugin, which automatically\
    \ executes the phase of the default lifecycle.\n\nSuch a plugin also provides\
    \ the goal report-only, which does not execute the test test, it assumes that\
    \ tests have already been run. The web site will be generated by default in the\
    \ target/site directory, since such web contents are meant to be included in the\
    \ web site generated during the site lifecycle. In fact, the web contents generated\
    \ by this plugin rely on images and CSS files that are generated by the goal site\
    \ of the maven-site-plugin (the one goals are bound by default to phases of the\
    \ site lifecycle). If we want a nice rendering of the test web page, we need images\
    \ and CSS files as well. If we don't want to execute the whole site lifecycle,\
    \ we can invoke only the goal site of the maven-site-plugin, by specifying that\
    \ we don't want the whole site generation. This can be achieved by passing the\
    \ value false for the property generateReports. As example, we run the test, the\
    \ goal for generating the web page with test results and the goal for generating\
    \ the images and CSS files:\n\n```\nmvn test surefire-report:report-only \\\n\
    site=\\n-DgenerateReports=false\n```\n\nOpen the file target/site/surefire-report.html\
    \ to see the generated web page with the run tests.\n\nIn this case, we use the\
    \ default versions of maven-surefire-report-plugin and maven-site-plugin; these\
    \ defaults are part of the current Maven installation. We could use the complete\
    \ syntax for invoking the goal by specifying an explicit version of a plugin (in\
    \ the following example, we specify version 3.7.1 of the maven-site-plugin):\n\
    \n```\nmvn test surefire-report:report-only \\\norg.apache.maven.plugins:maven-site-plugin:3.7.1:site=\\\
    n-DgenerateReports=false\n```\n\n### 5.1.15 Run Maven from Eclipse\n\nThe Eclipse\
    \ plugin m2 also provides tools for running a Maven build directly from Eclipse.\
    \ By default, a version of Maven embedded in the m2 plugin is used, thus you can\
    \ run Maven builds from Eclipse without installing Maven in your system. This\
    \ can be configured with the property Maven -> Installations, in case you want\
    \ to use a Maven distribution installed in your system. The contextual menu Run\
    \ As of a Maven project has many submenus for invoking Maven with some predefined\
    \ goals. The submenu Maven build.. allows you to specify the phases or goals to\
    \ execute, the profiles to activate and other configurations. Remember that this\
    \ is an Eclipse run configuration, and, as such, it is not portable.\n\n## 5.2\
    \ MAVEN PACKAGING\n\n### 5.2.1 jar\n\nThe packaging element in the POM defines\
    \ the type of artifact to be produced. The default is jar. If it is not specified,\
    \ the default is jar. This is the most common packaging type for Java projects.\n\
    \n### 5.2.2 pom\n\nThe packaging type pom is used for projects that do not produce\
    \ an artifact themselves, but are used to aggregate other modules. This is useful\
    \ for multi-module projects. \n\n### 5.2.3 war\n\nThe packaging type war is used\
    \ for web applications. It produces a web archive file that can be deployed to\
    \ a web server.\n\n### 5.2.4 ear\n\nThe packaging type ear is used for enterprise\
    \ applications. It produces an enterprise archive that can contain multiple war\
    \ files and other modules.\n\n### 5.2.5 Parent and modules\n\nThe parent element\
    \ in the POM allows you to inherit configurations from another POM. This is useful\
    \ to avoid repeating common configurations in all the projects.\n\n```xml\n<parent>\n\
    \  <groupId>...</groupId>\n  <artifactId>...</artifactId>\n  <version>...</version>\n\
    \  <relativePath>../pom.xml</relativePath>\n</parent>\n```\n\nIf the current project's\
    \ groupId and version are the same as the one of the parent, then they can be\
    \ omitted. For example, One can simply write:\n\n```xml\n<parent>\n  <groupId>com.mycompany.app</groupId>\n\
    \  <artifactId>my-app-parent</artifactId>\n  <version>1.0.0-SNAPSHOT</version>\n\
    \  <relativePath>../pom.xml</relativePath>\n</parent>\n<groupId>com.mycompany.app</groupId>\n\
    <artifactId>my-app</artifactId>\n<version>1.0.0-SNAPSHOT</version>\n```\n\nIf\
    \ the parent POM is in the parent directory of the current project, the relativePath\
    \ needs not be specified. In such a case, One can simply write:\n\n```xml\n<parent>\n\
    \  <groupId>com.mycompany.app</groupId>\n  <artifactId>my-app-parent</artifactId>\n\
    \  <version>1.0.0-SNAPSHOT</version>\n</parent>\n<groupId>com.mycompany.app</groupId>\n\
    <artifactId>my-app</artifactId>\n<version>1.0.0-SNAPSHOT</version>\n```\n\n###\
    \ 5.2.5 Create a parent project and a module project\n\nWe will now create a parent\
    \ project and two module projects. For simplicity, the module projects will be\
    \ in two subfolders of the parent folder.\n"
  mdcn: "\n\n## 5.1 MAVEN\n\n`<groupId>:<artifactId>:<version>:<goal>`\n\n版本可以省略。在这种情况下，版本将从\
    \ POM 中该插件的配置中获取（同时也会考虑父 POM，请见“父项目与模块”章节）。如果没有找到配置，则将使用最新版本。\n\n`<groupId>:<artifactId>:<goal>`\n\
    \n对于标准的 Maven 插件，可以忽略组 ID（group）：\n\n`<artifactId>:<goal>`\n\n如果一个插件有多个具有相同名称并绑定到同一阶段的\
    \ goal（即执行单元，我们将在稍后在“配置 Maven 插件”章节中看到），你可以指定该目标单次执行的 `<goal>` id。\n\n`<groupId>:<artifactId>:<goal>@<id>`\
    \ 此外，如果一个构件 ID（artifactId）中包含“maven”和“plugin”字样，且被连字符（“-”）包围，则可以通过仅指定前缀来使用更短的形式。例如，与其指定\
    \ `maven-compiler-plugin`，我们只需指定 `compiler`。\n\n这是基于 Maven 插件命名的命名约定：\n\n```\n\
    maven-${prefix}-plugin\n  用于由 Apache Maven 团队维护的官方插件\n${prefix}-maven-plugin\n\
    \  用于其他团队开发的插件\n```\n\n在命令行中指定 goal 意味着独立于任何阶段仅执行该 goal。例如，以下命令仅编译 Java 源代码（将其与\
    \ `mvn compile` 的执行进行比较）：\n\n```\nmvn compiler:compile\n```\n\n也就是说，它只执行了 `maven-compiler-plugin`\
    \ 的 `compile` goal。\n\n当然，在命令行上可以混合使用阶段（phases）和目标（goals）。当你需要显式运行某个插件的 goal 时（该\
    \ goal 默认未绑定到任何阶段），这尤为有用。请注意，某些插件的 goal 可以自动调用整个阶段。例如 `maven-surefire-report-plugin`\
    \ 插件的 `report` goal，它会自动执行默认生命周期的阶段。\n\n此类插件还提供了 `report-only` goal，它不会执行 `test\
    \ test` 任务，而是假设测试已经运行过。网站默认会在 `target/site` 目录下生成，因为此类网页内容旨在包含在 `site` 生命周期期间生成的网站中。事实上，由此插件生成的网页内容依赖于\
    \ `maven-site-plugin` 的 `site` goal 生成的图像和 CSS 文件（这些 goal 默认绑定到 `site` 生命周期的阶段）。如果我们希望对测试页面有良好的渲染，我们需要图像和\
    \ CSS 文件。如果我们不想执行整个 `site` 生命周期，可以只调用 `maven-site-plugin` 的 `site` goal，只需指定我们不需要生成整个网站。这可以通过向属性\
    \ `generateReports` 传递值 `false` 来实现。例如，我们运行测试、生成带有测试结果网页的 goal 以及生成图像和 CSS 文件的\
    \ goal：\n\n```\nmvn test surefire-report:report-only \\\nsite=\\n-DgenerateReports=false\n\
    ```\n\n打开 `target/site/surefire-report.html` 文件即可查看运行测试后生成的网页。\n\n在这种情况下，我们使用了\
    \ `maven-surefire-report-plugin` 和 `maven-site-plugin` 的默认版本；这些默认值是当前 Maven 安装的一部分。我们可以通过指定插件的显式版本，使用完整语法来调用\
    \ goal（在接下来的示例中，我们指定了 `maven-site-plugin` 的 `3.7.1` 版本）：\n\n```\nmvn test surefire-report:report-only\
    \ \\\norg.apache.maven.plugins:maven-site-plugin:3.7.1:site=\\n-DgenerateReports=false\n\
    ```\n\n### 5.1.15 在 Eclipse 中运行 Maven\n\nEclipse 插件 `m2` 也提供了直接从 Eclipse 运行 Maven\
    \ 构建的工具。默认情况下，使用 m2 插件嵌入的 Maven 版本，因此你无需在系统中安装 Maven 即可从 Eclipse 运行 Maven 构建。这可以通过\
    \ `Maven -> Installations` 属性进行配置，以便你使用安装在系统中的 Maven 分发版。Maven 项目的 `Run As` 菜单有许多子菜单，用于指定要执行的阶段、激活的配置以及其他配置。\n\
    \n## 5.2 MAVEN PACKAGING\n\n### 5.2.1 jar\n\nPOM 中的 `packaging` 元素定义了生成的构件类型。默认是\
    \ `jar`。如果没有指定，默认为 `jar`。这是 Java 项目最常用的打包类型。\n\n### 5.2.2 pom\n\n`pom` 打包类型用于不产生构件、但用于聚合模块的项目。这对于多模块项目很有用。\n\
    \n### 5.2.3 war\n\n`war` 打包类型用于 Web 。它生成一个可以部署到 Web 服务器的归归文件。\n\n### 5.2.4 ear\n\
    \n`ear` 打包类型用于企业级应用。它生成一个包含多个 `war` 文件和其他模块的企业包。\n\n### 5.2.5 Parent and modules\n\
    \n`parent` 元素允许继承另一个 POM 的配置。这对于避免在所有项目中重复配置很有用。\n\n```xml\n<parent>\n  <groupId>...</groupId>\n\
    \  <artifactId>...</artifactId>\n  <version>...</version>\n  <relativePath>../pom.xml</relativePath>\n\
    </parent>\n```\n\n如果当前项目的 `groupId` 和 `version` 与父项目相同，则可以省略它们。例如，我们可以只需写：\n\n\
    ```xml\n<parent>\n  <groupId>com.mycompany.app</groupId>\n  <artifactId>my-app-parent</artifactId>\n\
    \  <version>1.0.0-SNAPSHOT</version>\n  <relativePath>../pom.xml</relativePath>\n\
    </parent>\n<groupId>com.mycompany.app</groupId>\n<artifactId>my-app</artifactId>\n\
    <version>1.0.0-SNAPSHOT</version>\n```\n\n如果父 POM 位于当前项目的父目录下，则不需要指定 `relativePath`。在这种情况下，我们可以只需写：\n\
    \n```xml\n<parent>\n  <groupId>com.mycompany.app</groupId>\n  <artifactId>my-app-parent</artifactId>\n\
    \  <version>1.0.0-SNAPSHOT</version>\n</parent>\n<groupId>com.mycompany.app</groupId>\n\
    <artifactId>my-app</artifactId>\n<version>1.0.0-SNAPSHOT</version>\n```\n\n###\
    \ 5.2.5 创建父项目和模块项目\n\n我们现在将创建一个父项目和两个模块项目。为了简单起见，模块项目将位于父文件夹的两个子目录中。\n\n"
