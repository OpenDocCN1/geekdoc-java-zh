    # 3.2 BLACK-BOX TESTING AND WHITE-BOX TESTING:


    Within the automated testing world there are two predominant testing methodologies:
    black-box and white-box.


    # 3.2.1 White-box Testing:


    The white box approach is based on the premise of testing a product knowing how
    it is done and having access to the code. This type of approach is generally pursued
    by developers because they know the code. Such tests would be better if they were
    performed by industry experts or at least by the same person who developed the
    code. This is because who test what he has produced is less likely to find problems
    regarding the code that he himself has created. The advantage of this approach
    is that you can do tests (unit tests) much targeted than the other approaches
    and therefore could lead to detect problems that could hardly be found otherwise.
    Examples of this approach are techniques based on covering paths, decisions, conditions,
    etc.


    # 3.2.2 Black-box Testing:


    The black box approach is what is generally used by testers. It is based on the
    assumption of not knowing how the functionality is realized, only interested in
    what it does, so the point of view is (almost) the same as'
