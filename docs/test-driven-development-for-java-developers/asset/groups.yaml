    givenThat(yuri).wasAbleTo(Start.withHomePage());\nthen(yuri).should(\n    seeThat(Application.information,\n\
    \    displays(\"title\",isEqualTo(\"BlazeDemo\")),\n    displays(\"heading\",isEqualTo(\"\
    Welcome to the Simple Travel Agency!\"))\n);\nthen(yuri).attemptsTo(\n    SearchFlights.betweenCountries(\"\
    Boston\",\"New York\")\n);\nthen(yuri).should(\n    seeThat(\n        TheFlights.displayed(),\n\
    \        hasSize(greaterThan(0))\n    )\n);\n```\n\nListing 10.6: withHomePage.java\n\
    \nYou can find a fully working example in our test project, which has been implemented\
    \ following these practices. It is located at \"/src/test/java/ui/screen/FindFlightsPlayExampleTest.java\"\
    .\n\nThe behavior of web applications depends on many factors like work speed,\
    \ your machine capabilities or the current load on application servers. Because\
    \ of all these factors, you cannot always predict how much time it will take to\
    \ load a specific page or web element. That's why you might want to add a timeout\
    \ and pause script execution for at least a certain amount to deal with.\n\nIf\
    \ you do not know how to deal with this in the right way, you will never see stability\
    \ in your UI automation.\n\nLet's assume that in our test we are going to open\
    \ the home page and verify the heading of the main page. Extremely simple. You\
    \ just need to implement two functions. One that opens the page and the second\
    \ that verifies the heading element is presented and has the right value. But\
    \ what if we knew our application can take up to 7-8 seconds to start?\n\nSelenium,\
    \ we browser automation tool, works pretty fast and honestly, even faster than\
    \ you. It can open the page in milliseconds and will try to get the text of heading\
    \ element while the application itself is still starting. In this situation...\
    \ please, NEVER write a code like this:\n\n```java\ndriver.openHomePage();\nThread.sleep(5000);\n\
    driver.verifyThatTitleAndHeadingTextIsCorrect();\n```\n\nThis is the strongest\
    \ killer of UI automation tests stability. Why?\n\nWe lose time because you know\
    \ that in 95 percentage of cases, the application should be up and running in\
    \ 7-8 seconds. Therefore, each time we lose 2-3 seconds of execution time.\n\n\
    What happens if application load 10.5 seconds one day? Because of some network\
    \ slowness. We will get failed tests. But when you try to run it locally on the\
    \ next day, it works perfectly fine. This is one more example of the troubles\
    \ you might get into by using this way of waiting in your tests.\n\nThis is how\
    \ you can specify the implicit wait in Java by using Selenium.\n\n```java\nWebDriver\
    \ driver = new FirefoxDriver();\ndriver.manage().timeouts().implicitlyWait(5,\
    \ TimeUnit.SECONDS);\n```\n\nListing 10.7: FirefoxDriver.java\n\nWhat is the explicit\
    \ wait then? The explicit wait is designed for needs when certain web element\
    \ or action takes a much longer time to load than the rest. If your application\
    \ works in a way that it takes a long time to start (7-8 seconds) but after that\
    \ it works very fast! There is no sense to specify the implicit wait as 10 or\
    \ even 15 seconds because only you have a slow application loading. For this,\
    \ you can use the explicit wait, which waits for a certain condition for a specified\
    \ amount of time.\n\nHere is how we rewrite our previous example by using the\
    \ idea of the explicit wait:\n\n```java\nuri.openHomePage();\nwithTimeout(15,\
    \ TimeUnit.SECONDS).waitFor(MAIN_HEADING_LABEL);\nuri.verifyThatTitleAndTextIsCorrect();\n\
    ```\n\nIn this case, we also do not waste any time and the script execution will\
    \ continue immediately after the expected element will be found.\n\nClear right?\
    \ Not as clear you might think... the official Selenium website displays this\
    \ very important note:\n\nYou can use this article as well as this to learn why\
    \ it is better and enough to use ONLY explicit waits.\n\nWe have seen many automation\
    \ frameworks that require high efforts to run them on another machine, unlike\
    \ the one which was used for framework creation. This is a very bad practice because\
    \ it doesn't allow new engineers or other team members to run tests, without struggling\
    \ with setup troubles. And what if you need to run your tests on the CI server?\
    \ It would be a very tricky task if your UI test automation framework is not portable.\
    \ That's why we have a few tips that can help you avoid such issues.\n\nThe same\
    \ principle goes for the web driver.\n\n## 11\n\n## END-TO-END TESTING\n\nEnd\
    \ To End Testing is a software testing method that validates entire software from\
    \ starting to the end along with its integration with external interfaces. The\
    \ purpose of end-to-end testing is testing whole software for dependencies, data\
    \ integrity and communication with other systems, interfaces and databases to\
    \ exercise complete production like scenario.\n\nAlong with the software system,\
    \ it also validates batch/data processing from other upstream/downstream systems.\
    \ Hence, the name \"End-to-End\" is usually executed after functional and System\
    \ Testing. End-to-End Testing is also called Chain Testing.\n\n### 11.1 WHY END\
    \ TO END TESTING\n\nEnd To End Testing verifies complete system flow and increases\
    \ confidence by detecting issues and increasing Test Coverage of subsystems. Modern\
    \ software systems are complex and interconnected with multiple subsystems that\
    \ may differ from current systems. The whole system can collapse by failure of\
    \ any subsystem that is major risk which can be avoided by End-to-End testing.\n\
    \n### 11.1.1 End to End Testing Process:\n\nThe following diagram gives an overview\
    \ of the End to End testing process.\n\nThe chief activities involved in End to\
    \ End Testing are:\n\n- Study of an end to testing requirements\n- Test Environment\
    \ setup and hardware/software requirements\n"
  mdcn: "\n\n## 10.2 考虑使用 BDD 框架\n\n这一原则，因为页面类（page classes）可能包含数百个执行许多不同动作的函数。\n\n\
    不用担心，我们不会详细介绍每个原则的含义。你可以浏览网络上的许多文章来获得了解（例如，你可以从 wiki 开始）。但你只需要知道，为了在使用页面对象模式（Page\
    \ Objects pattern）时遵循 SOLID 原则，我们应该关注如何跨页面和网页元素的动作，并定期进行额外的代码重构以保持框架的可维护性。\n\n\
    引入剧本模式（Screenplay Pattern），它是从零开始为遵循 SOLID 原则而设计的。简之，Screenplay 是用于验收测试（包括 UI\
    \ 测试）的设计模式，它可以让你轻松地遵循 SOLID 原则。我推荐查看这篇文章，它将为你提供剧本模式及其在 UI 自动化中用法的极佳解释。但你可以回顾我们之前的同一个测试，只是使用剧本模式编写，并亲身体验其中的差异：\n\
    \n```java\ngivenThat(yuri).wasAbleTo(Start.withHomePage());\nthen(yuri).should(\n\
    \    seeThat(Application.information,\n    displays(\"title\",isEqualTo(\"BlazeDemo\"\
    )),\n    displays(\"heading\",isEqualTo(\"Welcome to the Simple Travel Agency!\"\
    ))\n);\nthen(yuri).attemptsTo(\n    SearchFlights.betweenCountries(\"Boston\"\
    ,\"New York\")\n);\nthen(yuri).should(\n    seeThat(\n        TheFlights.displayed(),\n\
    \        hasSize(greaterThan(0))\n    )\n);\n```\n\n列表 10.6: withHomePage.java\n\
    \n你可以在我们的测试项目中找到一个完全可运行示例，该示例是按照这些实践实现的。它位于 \"/src/test/java/ui/screen/FindFlightsPlayExampleTest.java\"\
    。\n\n应用程序的行为取决于许多因素，如工作速度、你的机器能力或应用程序服务器的当前负载。由于这些因素，你无法总是预测加载特定页面或网页元素需要多少时间。这就是为什么你可能想要添加超时，并暂停脚本执行至少一段时间以进行处理。\n\
    \n如果你不知道如何正确地处理这个问题，你将永远无法看到 UI 自动化测试的稳定性。\n\n假设在测试中，我们将打开首页并验证主页的标题。这非常简单。你只需要实现两个函数：一个是打开页面的函数，另一个是验证标题元素是否存在并具有正确值的函数。但如果我们知道应用程序可能需要\
    \ 7-8 秒才能启动呢？\n\nSelenium，我们用用的浏览器自动化工具，运行速度非常快，老实说甚至比你还快。它可以在毫秒内打开页面，并在应用程序仍在启动时尝试获取标题元素的文本。在这种情况下……请**千万不要**写这样的代码：\n\
    \n```java\ndriver.openHomePage();\nThread.sleep(5000);\ndriver.verifyThatTitleAndHeadingTextIsCorrect();\n\
    ```\n\n这是破坏 UI 自动化测试稳定性的最大杀手。为什么？\n\n我们浪费了时间，因为你知道在 95% 的情况下，应用程序应该在 7-8 秒内运行。因此，我们每次都会损失\
    \ 2-3 秒的执行时间。\n\n如果某天由于网络缓慢，应用程序加载了 10.5 秒怎么办？我们将得到失败的测试。但当你第二天尝试在本地运行时，它又运行得完美。这就是你通过这种等待方式可能会遇到的问题的另一个示例。\n\
    \n这是你如何使用 Selenium 在 Java 中指定隐式等待（implicit wait）。\n\n```java\nWebDriver driver\
    \ = new FirefoxDriver();\ndriver.manage().timeouts().implicitlyWait(5, TimeUnit.SECONDS);\n\
    ```\n\n列表 10.7: FirefoxDriver.java\n\n那么显式等待（explicit wait）是什么？显式等待的设计是为了某些网页元素或动作的加载时间比其他部分长多的情况。如果你的应用程序运行方式是启动需要很长时间（7-8\
    \ 秒），但在之后运行得非常快！那么指定隐式等待为 10 秒甚至 15 秒是没有意义的，因为只有你的应用程序加载慢。对于这种情况，你可以使用显式等待，它会在指定时间内等待特定条件。\n\
    \n以下是我们如何使用显式等待的思想重写之前的示例：\n\n```java\nuri.openHomePage();\nwithTimeout(15, TimeUnit.SECONDS).waitFor(MAIN_HEADING_LABEL);\n\
    uri.verifyThatTitleAndTextIsCorrect();\n```\n\n在这种情况下，我们也没有浪费任何时间，脚本将在找到预期元素后立即继续执行。\n\
    \n很清楚对吧？不像你想象的那么简单……Selenium 官方网站显示了这条非常重要的提示：\n\n你可以参考这篇文章以及这里来了解为什么只使用显式等待是更好且足够的。\n\
    \n我们见过许多自动化框架，它们在其他机器上运行它们需要投入大量精力，这与用于创建框架的机器不同。这是一个非常糟糕的做法，因为它不允许新工程师或其他团队成员在不挣扎于配置困扰的情况下运行测试。如果你需要在\
    \ CI 服务器上运行测试呢？如果你的 UI 测试自动化框架不是可移植的，那将是一项棘手的任务。这就是为什么我们有一些可以帮助你避免此类问题的建议。\n\n\
    同样的原则适用于 web driver。\n\n## 11\n\n## 端端测试 (END-TO-END TESTING)\n\n端端测试是一种软件测试方法，用于从开始到结束验证整个软件，以及其与外部接口的集成。端端测试的目的是对整个软件进行依赖关系、数据完整性以及与其他系统、接口和数据库通信的测试，以执行完整的生产场景。\n\
    \n除了软件系统，它还验证了来自其他上游/下游系统的批/数据处理。因此，“端到端”通常在功能测试和系统测试之后执行。端端测试也称为链测试（Chain Testing）。\n\
    \n### 11.1 为什么要进行端端测试\n\n端端测试验证完整的系统流，通过检测问题和增加子系统的测试覆盖来增加信心。现代软件系统是复杂的，并与多个可能与当前系统不同的子系统相互连接。任何子系统的故障都可能导致整个系统的崩溃，这是一个主要风险，但可以通过端端测试来避免。\n\
    \n### 11.1.1 端端测试流程：\n\n下面的图提供了端端测试流程的概述。\n\n端端测试涉及的主要活动包括：\n\n-   研究端端测试需求\n\
    -   测试环境搭建和硬件/软件需求\n\n"
