    \ But all you need to know that in order to follow SOLID principles with the Page\
    \ Objects pattern, we should always care how we separate actions across pages\
    \ and web elements and make additional code refactoring once awhile to keep our\
    \ framework maintainable.\n\nCue the Screenplay Pattern, which is designed to\
    \ follow the SOLID principles from scratch. Briefly, Screenplay is the design\
    \ pattern for acceptance tests (including UI tests) that allows you to easily\
    \ follow SOLID principles. I recommend checking out this article, which will give\
    \ you an outstanding explanation of the Screenplay pattern and its usage in UI\
    \ automation. But you go over the same test we had before, but written with the\
