- md: "\nLet’s run mvn package once again and this time we can simply run the JAR:\n\
    \n```bash\n1 java -jar <fullpath>/target/my-app-1.0-SNAPSHOT.jar\n2\n3 Hello World!\n\
    ```\n\n## 5.3-4 Plugin management\n\nThe <pluginManagement> section in the <build>\
    \ section has the same aim as the <dependencyManagement> section (see Section\
    \ Dependency management) but for plugins.\n\nThis is even more useful for plugins\
    \ since Maven will still merge the configurations inherited from a parent POM\
    \ (including the super-POM) and the ones of the current POM, taking into consideration\
    \ both the ones in <pluginManagement> and the ones in <plugins>.\n\nIn Section\
    \ Configuring the Maven compiler plugin we saw how to configure the Java compilation\
    \ level directly in the maven-compiler-plugin. We can do that in <pluginManagement>:\n\
    \n```xml\n1 <build>\n2   <pluginManagement>\n3     <plugins>\n4       <plugin>\n\
    5         <artifactId>maven-compiler-plugin</artifactId>\n6       <configuration>\n\
    7         <source>1.8</source>\n8         <target>1.8</target>\n9       </configuration>\n\
    10    </plugin>\n11  </plugins>\n12  </pluginManagement>\n13 </build>\n```\n\n\
    Note that in this case we don’t even need to specify the version of the plugin,\
    \ since that is taken automatically after merging the inherited configuration\
    \ of the plugin.\n\n## 5.3 CONFIGURING A MAVEN PLUGIN\n\n### 5.3.5 PIT Maven plugin\n\
    \nWe saw that it might take some time to run such a tool, thus, in a Maven build,\
    \ we might want to run it only from time to time, by specifying the plugin goal\
    \ explicitly. However, we configure the plugin once and for all in the <pluginManagement>,\
    \ by specifying the classes to mutate (targetClasses), the tests to run with the\
    \ mutators (targetTests) and many additional parameters, like the mutators to\
    \ apply. See http://pitest.org/quickstart/maven/ for more information about the\
    \ plugin configuration. As we anticipated in Chapter Mutation Testing, Section\
    \ Narrowing mutations, the PIT Maven plugin allows us to exploit the advanced\
    \ configuration features of PIT itself for narrowing the mutation testing procedure\
    \ during a Maven build.\n\nFor the Maven bank-example we could configure the plugin\
    \ as follows:\n\n```xml\n<build>\n  <pluginManagement>\n    <plugins>\n    ...\n\
    \    <plugin>\n      <groupId>org.pitest</groupId>\n      <artifactId>pitest-maven</artifactId>\n\
    \      <version>1.4.10</version>\n      <configuration>\n        <targetClasses>\n\
    \          <!-- excludes testing.example.bank.Main *-->\n        </targetClasses>\n\
    \        <mutators>\n          <param>testing.example.bank.*</param>\n       \
    \   <mutator>DEFAULTS</mutator>\n        </mutators>\n        <mutationThreshold>80</mutationThreshold>\n\
    \      </configuration>\n    </plugin>\n  </pluginManagement>\n</build>\n```\n\
    \nWe specify the pattern for the classes to mutate (excluding the Main class,\
    \ which has no test) and the pattern for the tests to execute. Moreover, we enable\
    \ only the default mutators. Finally, by using <mutationThreshold> we specify\
    \ the threshold for killed mutations. This represents the percentage of mutants\
    \ that must be killed in order to get a successful build. If the pattern is below\
    \ the threshold, the Maven build will fail.\n\nWe can now run PIT from Maven with\
    \ the following command:\n\n```bash\nmvn test org.pitest:pitest-maven:mutationCoverage\n\
    ```\n\nThe web report from PIT can be found in the directory target/pit-reports;\
    \ each report is created in a subdirectory with the date and time.\n\n### 5.3.6\
