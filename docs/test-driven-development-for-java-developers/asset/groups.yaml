    \ 10.2: someTest.java\n\nA design pattern is a reusable solution for a common\
    \ problem in software design. We can say that each pattern is a particular example\
    \ of a specific solution for a specific problem, regardless of the programming\
    \ language or paradigm. Complementing design patterns, we have design principles.\
    \ Design principles provide you with guidelines or rules that you need to follow\
    \ for constructing well-built and maintainable software. While patterns apply\
    \ for specific issues, design principles apply regardless of context.\n\nHow is\
    \ this relevant to UI Automation testing? As discussed before, UI testing is a\
    \ hard and treacherous road full of different holes. But I have good news for\
    \ you. You are not the first driver to travel this road. That's why there are\
    \ many holes and no one has ever passed through you. You can think of design patterns\
    \ and principles as powerful navigators. One tells you how to drive safely in\
    \ general (design principle), while another gives clear instructions about how\
    \ to handle each specific hole if it got in your way (design pattern).\n\nIn this\
    \ section, I want to talk about two patterns: The Page Objects pattern, which\
    \ has become the most popular UI automation pattern among test automation engineers,\
    \ and the Screen pattern, which organizes the Page Objects pattern and improves\
    \ it.\n\nThe concept of the Page Objects pattern was introduced almost 10 years\
    \ ago. Its purpose was to make UI automation tests consistent, to avoid code duplication,\
    \ to improve readability and organize code for pages interaction. During web tests\
    \ creation you always need to interact with web pages and web elements (buttons,\
    \ input elements, images, etc.). The Page Objects pattern takes this requirement\
    \ and applies object-oriented programming principles on top of this, enforcing\
    \ you to interact with all pages and elements as objects.\n\nFor example, if you\
    \ need to click on a button, you don't need to care about how to retrieve this\
    \ button in the test, as it will already be handled in page objects. You should\
    \ have the object of the page you are looking for and it should already contain\
    \ the object of the button you are looking for inside it. All you need is to use\
    \ a reference to this button object and apply the \"click\" action on it. You\
    \ can think about all pages and web elements like this:\n\nTravel The Word home\n\
    \n# Welcome to the Simple Travel Agency!\n\nThe is a simple site you can test\
    \ with Blazemeter!\nCheck out our destination of the week! The Beach\n\nChoose\
    \ your departure city:\n\nParis\n\nChoose your destination city:\n\nBuenos Aires\n\
    \nTest Flights\n\nObject\nObject\nObject\nObject\n\n...\n\nTest\nTest\nTest\n\n\
    For each page and element you need to interact with, you should create a separate\
    \ object that will be a reference to this web element in your test. This is an\
    \ example of the test written without the Page Objects pattern:\n\n```java\n1\
    \ WebDriver WebDriver = driver;\n3 driver.navigate().to(\"blazemeter.com\");\n\
    5 string heading = driver.findElement(By.cssSelector(HEADING_ELEMENT)).getText();\n\
    6 Assert.assertEquals(heading, \"Welcome to the Simple Travel Agency!\");\n7 Assert.assertEquals(driver.getTitle(),\
    \ \"BlazeDemo\");\n9 select flightsFromSelectElement = new Select(driver.findElement(By.cssSelector(FLIGHT_FROM_SELECT)));\n\
    10 select flightsToSelectElement = new Select(driver.findElement(By.id(FLIGHT_TO_SELECT)));\n\
    12 flightsFromSelectElement.selectValue(\"Boston\");\n13 flightsToSelectElement.selectValue(\"\
    New York\");\n14 driver.findElement(By.cssSelector(FIND_FLIGHTS)).click();\nAssert.assertTrue(webDriver.findElements(By.cssSelector(FLIGHTS.ROW.ELEMENTS)).size\
    \ > 0);\n```\nListing 10.3: webDriver.java\n\nIf we apply the Page Objects pattern\
    \ and refactor the same test, we see in an absolutely different picture:\n\n```java\n\
    - homePage.open();\n- homePage.waitUntilPageLoaded();\n- Assert.assertEquals(homePage.getTitle(),\
    \ \"BlazeDemo\");\n- Assert.assertEquals(homePage.headingText(), \"Welcome to\
    \ the Simple Travel Agency!\");\n- homePage.findFlights(\"Boston\", \"New York\"\
    );\n- Assert.assertTrue(flightsPage.getFlights().size() > 0);\n```\nListing 10.4:\
    \ homePage1.java\n\nYou can find the working example of a test in the test project\
    \ under `/src/test/java/ui/pageobject/FindFirstSimplePageObjectTest.java` location.\
    \ Just go ahead and try it yourself.\n\nTo sum up, the Page Objects brings you\
    \ these benefits:\n- Makes your tests much clearer and easy to read by providing\
    \ an interaction with pages and application page elements\n- Organises code structure\n\
    - Helps to avoid duplications (we should never specify the same page locator twice)\n\
    - Saves a lot of time on maintenance and reduces costs\n\nIf you want to make\
    \ this test cleaner and more maintainable, you can introduce one more level of\
    \ abstraction - steps or keywords. In different frameworks you might see different\
    \ names of these modules but the principles are the same. Steps (keywords) form\
    \ modules of actions that you can reuse in any test. Once these steps (keywords)\
    \ modules are written, all you need is make a reference to the module in your\
    \ test and you can use all the functionalities provided by these modules.\n\n\
    For example, if we create a module that aggregates all functionalities related\
    \ to flightsSearch on our website, then the test would look like this:\n\n```java\n\
