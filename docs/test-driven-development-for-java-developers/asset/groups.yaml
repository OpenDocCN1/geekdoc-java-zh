    work, which has to be done if long-term and best solutions are not sought, and
    things are implemented keeping the ease in mind, for short term.


    +   2. Technical Debt: → It describes the estimated effort to fix to fix all the
    maintainability Issues / code smells. It is a programming concept that reflects
    the extra development work, which has to be done if long-term and best solutions
    are not sought, and things are implemented keeping the ease in mind, for short
    term.


    +   3. Code coverage: → It is a measure which describes the degree of which the
    source code of the program has been tested. It is one form of white box testing
    which finds the areas of the program not exerted by a set of test cases.


    +   4. Code Bugs: → A problem or an issue that shows something is wrong in the
    code. It might not break the code right away, but surely will, and may be at the
    moment when its impact is huge. It has to be fixed.


    +   5. Vulnerabilities: → It is a cyber-security term that refers to a flaw or
    loophole in the system that makes it vulnerable to attack. A vulnerability may
    also refer to any type of weakness in a set of procedures, or in anything that
    leaves information security exposed to a threat. Minimizing vulnerabilities leaves
    bare chances of unwanted access to sensitive and secure data by malicious users.


