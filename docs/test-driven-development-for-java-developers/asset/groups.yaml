- md: "\n## 11.1 WHY END TO END TESTING\n\nDescribe all the systems and its subsystems\
    \ processes.\n\nDescription of roles and responsibilities for all the systems\n\
    \nTesting methodology and standards\n\nEnd to end requirements tracking and designing\
    \ of test cases\n\nInput and output data for each system\n\n### 11.1.2 How to\
    \ create End-to-End Test Cases?\n\nEnd to Testing Design framework consists of\
    \ three parts:\n\n- Build user functions\n- Build Conditions\n- Build Test Cases\n\
    \nLet's look at them in detail: -\n\n#### Build User Functions\nFollowing activities\
    \ should be done as a part of build user functions:\n\n- List the features of\
    \ the system and their interconnected components\n\n- List the input data, action\
    \ and the output data for each feature or function\n\n- Identify the relationships\
    \ between the functions\n\n- Determine whether the function can be reusable or\
    \ independent\n\nFor example - Consider a scenario where you login into your bank\
    \ account and transfer some money to another account from some other bank (3rd\
    \ party sub-system)\n\n- Login into the banking system\n- Check for the balance\
    \ amount in the account\n- Transfer some amount from your account to some other\
    \ bank account (3rd party sub-system)\n- Check your latest account balance\n-\
    \ Logout of the application\n\n#### Build Conditions based on User Function\n\
    Following activities are performed as a part of build conditions:\n\nBuilding\
    \ a set of conditions for each user function defined. Conditions include sequence,\
    \ timing and data conditions. For example - Checking of more conditions like:\n\
    \n- Login Page\n    - Invalid User Name and Password\n    - Checking with valid\
    \ username and password\n    - Password strength checking\n    - Checking of error\
    \ messages\n- Balance Amount\n    - Check the current balance after 24 hours.\
    \ (If the transfer is sent to a different bank)\n    - Check the error message\
    \ if the transfer amount is greater than the current balance amount\n\n#### Build\
    \ a Test Scenario\nBuilding the Test Scenario for the user function defined. In\
    \ this case:\n\n- Login into the system\n- Check of bank balance amount\n- Transfer\
    \ the bank balance amount\n\n#### Build Multiple Test cases\nBuild one or more\
    \ test cases for each scenario defined. Test cases may include each condition\
    \ as a single test case.\n\n#### Metrics for End to End Testing:\nFollowing are\
    \ few of many metrics used for End to End Testing:\n\n- **Test Case preparation\
    \ status**: It gives Test Case preparation progress against planned.\n- **Weekly\
    \ Test Progress**: Provides week-wise details of percentage test completion -\
    \ Failed, not executed and executed against planned for execution tests.\n- **Defects\
    \ Status and Details**: It gives Percentage of open and closed defects by the\
    \ week. Also, week-wise defects distribution based on severity and priority.\n\
    - **Environment Availability**: Total number of hours \"up\" / Total number of\
    \ hours scheduled per day for testing.\n\n## 12\nPART 4\n\n## 12.1 CODE QUALITY-SONARQUBE\
    \ -\n\nCode quality is an extremely important parameter for software quality deliverables\
    \ and affects the overall success of a software organization. It is critical to\
    \ ensure utmost quality of delivered software as code quality defines how safe,\
    \ secure and reliable the software is.\n\nEnsuring high quality of software should\
    \ definitely be the goal throughout any development process. It can surely be\
    \ achieved if everyone in the team is determined to deliver quality and holds\
    \ himself accountable for it.\n\nCode quality depends on a number of different\
    \ attributes and requirements, primarily determined and prioritized by the business\
    \ needs.\n\n### 12.1.1 Key Aspects to Measure\n\nThe typical structure of a test\
    \ consists of the following 3 main phases. The key traits to measure for higher\
    \ quality are:\n\n- **Reliability**: Reliability measures the system’s probability\
    \ to run without failure over a specific period of operation. It relates to the\
    \ number of defects and availability of the software.\n- **Maintainability** →\
    \ Maintainability measures how easy is the system maintenance. It relates to the\
    \ size, consistency, structure, and complexity of the codebase. Ensuring that\
    \ source code is maintainable depends on a number of factors, such as testability\
    \ and understandability.\n- **3. Testability** → Testability measures how well\
    \ the software can be tested. It relies on the extent to which you can control,\
    \ observe, isolate, and automate testing.\n- **4. Portability** → Portability\
    \ measures how usable or portable the same software is across different environments.\
    \ Platform independence is the key factor.\n- **5. Reusability** → Reusability\
    \ measures whether existing code can be used again or not. Modular and loosely\
    \ coupled code, is easy to reuse.\n\n### 12.1.2 How to Improve Code Quality\n\n\
    Once, the code quality is measured, we can take steps to improve it. Let us discuss\
    \ some ways you can improve code quality:\nCoding Standards using a static code\
    \ analyzer.\n\n- 1. **Code Analysis before Code Reviews** → Quality should be\
    \ a priority from the very start of development and that why it's important to\
    \ analyze code before code reviews begins. Inact, its best to analyze code as\
    \ soon as it's written. The earlier the defects are detected, the easier and faster\
    \ it is to resolve them.\n- 2. **Code Review Best Practices** → Good code reviews\
    \ help improve overall software quality. We will discuss Code reviews in detail\
    \ shortly.\n- 3. **Refactor Legacy Code** → One way to improve the quality of\
    \ an existing codebase by refactoring.\n\nCode Review is a phase of the software\
    \ development process in which the authors of the code use a system of review\
    \ to examine the source code. The code is usually reviewed by another programmer\
    \ who inspects the code for mistakes, irregular formatting, or inconsistencies\
    \ with the system requirements that may create larger issues during the integration\
    \ process.\n\nCode review is the most commonly used procedure for validating the\
    \ design and implementation of features.\n\nCode Review is an instrumental component\
    \ of an efficient software solution. It creates consistent code and enables better\
    \ QA testing and seamless software integration. By diminishing mistakes and fixing\
    \ errors at the review stage, programmers become more efficient in designing customized\
    \ solutions in line with the specifications to the client.\n\nCode Reviews primarily\
    \ check for four things:\n\n- 1. Code issues\n- 2. Consistency in formatting with\
    \ the overall software design\n- 3. Quality of documentation\n- 4. Consistency\
    \ with coding standards and project requirements\n\nThe major purpose of the review\
    \ process is to create a collective responsibility of the software’s quality through\
    \ knowledge transfer by examining the source code collectively as a team.\n\n\
    Another advantage of maintaining consistent code standards is that it is easier\
    \ for specialists and testers to understand the source code.\n\nSource code that\
    \ is constantly under review allows developers to learn more reliable techniques\
    \ and best practices leading to robust software for seamless integration and functionality.\n\
    \nCode review can be performed in two levels:\n\n#### Peer review\nIt is mainly\
    \ focused on functionality, design, and the implementation and usefulness of proposed\
    \ fixes for stated problems. Peer reviewers look for the following in the code:\n\
    \n- Feature Completion\n- Potential Side Effects\n- Readability and Maintenance\n\
    - Consistency\n- Performance\n- Exception Handling\n- Simplicity\n- Reuse of Existing\
    \ Code\n- Test Cases\n\n#### External review\nIt is different than peer reviews\
    \ as it addresses different kinds of issues. Specifically, external reviews focuses\
    \ on how to enhance code quality, promote best practices, and remove “code smells.”\
    \ External reviewers look for following in the code:\n\n- Readability and Maintenance\n\
    - Coding Style\n- Code Smells\n\n## 12.2 SONARQUBE\n\nSonarQube is a web-based\
    \ open source platform by SonarSource, used to measure and analyse the source\
    \ code quality. Code quality analysis makes your code more reliable and readable.\n\
    \nIt is implemented in Java language and can analyze the code of about 20 different\
    \ languages, including c/c++, PL/SQL, Cobol et through plugins. More than 50 plugins\
    \ are available which extend the functionality of SonQube.\n\nSonarQube can inspect\
    \ and evaluate anything that affects code base, from minor styling details to\
    \ critical design errors. Hence, it is a great aid to software application developers\
    \ in identifying the issues and their impact.\n"
  mdcn: "\n\n## 11.1 为什么要进行端到端测试\n\n描述所有系统及其子系统的流程。\n\n所有系统的角色和职责描述\n\n测试方法论和标准\n\n\
    端到端需求跟踪和测试用例设计\n\n每个系统的输入和输出数据\n\n### 11.1.2 如何创建端到端测试用例？\n\n端到端测试设计框架由三部分组成：\n\
    \n- 构建用户函数\n- 构建条件\n- 构建测试用例\n\n让我们详细查看： -\n\n#### 构建用户函数\n在构建用户函数过程中，应完成以下活动：\n\
    \n- 列出系统功能及其相互关联的组件\n\n- 列出每个功能或逻辑的输入数据、操作和输出数据\n\n- 识别函数之间的关系\n\n- 确定函数是否可以复用或是独立的\n\
    \n例如 - 考虑这样一种场景：你登录了自己的银行账户，并向另一个银行的某个账户（第三方子系统）转账某些资金。\n\n- 登录银行系统\n- 检查账户中的余额\n\
    - 从你的账户转账某些金额到另一个银行账户（第三方子系统）\n- 检查你最新的账户余额\n- 退出应用程序\n\n#### 根据用户函数构建条件\n在构建条件过程中，执行以下活动：\n\
    \n为定义的每个用户函数构建一组条件。条件包括顺序、时机和数据条件。例如 - 检查更多条件，如：\n\n- 登录页面\n    - 无效的用户名和密码\n\
    \    - 使用有效的用户名和密码进行检查\n    - 密码强度检查\n    - 错误信息检查\n- 余额金额\n    - 检查 24 小后的当前余额。（如果转账到不同的银行）\n\
    \    - 如果转账金额大于当前余额，检查错误信息\n\n#### 构建测试场景\n为定义的用户函数构建测试场景（Scenario）。在这种情况下：\n\n\
    - 登录系统\n- 检查银行余额\n- 转账银行余额\n\n#### 构建多个测试用例\n为定义的每个场景构建一个或多个测试用例。测试用例可以将每个条件作为一个单独的测试用例。\n\
    \n#### 端到端测试指标：\n以下是用于端到端测试的许多指标之一：\n\n- **测试用例准备状态**：显示相对于计划的进度。\n- **每周测试进度**：提供每周的测试完成百分比详细信息\
    \ - 针对计划测试的失败、未执行和已执行情况。\n- **缺陷状态和详情**：显示每周开放和关闭的缺陷百分比。此外还有根据严重程度和优先级的每周缺陷分布。\n\
    - **环境可用性**：测试的“运行”总小时数 / 每天计划测试的总小时数。\n\n## 12\n第 4 部分\n\n## 12.1 代码质量-SONARQUBE\
    \ -\n\n代码质量是软件质量交付中极其重要的参数，影响着软件组织的整体成功。确保交付软件的最高质量至关重要，因为代码质量定义了软件的安全性、可靠性和稳定性。\n\
    \n在任何开发过程中，确保软件的高质量绝对应该是目标。如果团队中的每个人都下心交付质量并对此负责，那么目标一定可以实现。\n\n代码质量取决于许多不同的属性和需求，主要由业务需求决定并排序。\n\
    \n### 12.1.1 待衡量的关键方面\n\n测试的典型结构由以下 3 个主要阶段组成。为了衡量更高质量的关键特征是：\n\n- **可靠性**：可靠性衡量了系统在特定运行期间内无故障运行的概率。它与缺陷数量和软件的可用性有关。\n\
    - **可维护性** → 可维护性衡量了系统维护的难易程度。它与代码库的大小、一致性、结构和复杂性有关。确保源代码的可维护性取决于许多因素，如可测试性和理解性。\n\
    - **3. 可测试性** → 可测试性衡量了软件的可测试程度。它取决于软件的可测试化程度。\n- **4. 可移植性** → 可移植性衡量了软件在不同环境下的可用性。\n\
    - **5. 复用性** → 复用性衡量了代码是否可以被重复使用。模块化和低耦合的代码是易于复用的。\n\n### 12.1.2 如何提高代码质量\n\n\
    一旦衡量了代码质量，就可以采取步骤来改进它。让我们讨论一些提高代码质量的方法：使用静态代码分析器。\n\n- 1. **代码审查前的代码分析**：在开发开始时就对代码进行分析是非常重要的。越早发现缺陷，解决起来就越容易。\n\
    - 2. **代码审查最佳实践**：良好的代码审查有助于提高整体质量。我们将很快详细讨论。\n- 3. **重构遗留代码**：通过重构提高现有代码质量的一种方法。\n\
    \n代码审查是软件开发过程中的一个阶段，作者由另一个程序员检查代码以检查错误、格式异常或与系统不一致之处，这些在集成过程中可能会产生更大的问题。\n\n代码审查是验证设计和实现的最常用程序。\n\
    \n代码审查是高效解决方案的重要组成部分。它创建一致的代码并实现更好的 QA 测试。通过在审查阶段减少错误和修复问题，程序员可以更高效地设计符合需求的定制解决方案。\n\
    \n代码审查主要检查以下四点：\n\n- 1. 代码问题\n- 2. 与整体设计的一致性\n- 3. 文档质量\n- 4. 符合编码标准和项目要求\n\n\
    审查的主要目的是通过集体检查代码进行知识传递，建立软件质量的共同责任。\n\n维护一致代码标准的另一个优点是，专家和测试人员更容易理解源代码。\n\n持续接受审查的代码允许开发者学习更可靠的技术和最佳实践，从而实现健壮的集成和功能。\n\
    \n代码审查可以通过两种方式进行：\n\n#### 同行评审\n主要关注功能、设计以及针对陈述问题的修复方案的有效性。评审人员检查代码中的以下内容：\n\n\
    - 功能完成情况\n- 潜在副作用\n- 可读性和可维护性\n- 一致性\n- 性能\n- 异常处理\n- 简单性\n- 现有代码的复用\n\n#### 外部评审\n\
    与同行评审不同，因为它解决不同类型的问题。具体来说，外部评审关注如何提高代码质量、推广最佳实践并消除“代码异味”。外部评审检查代码中的：\n\n## 12.2\
    \ SONARQUBE\n\nSonarQube 是 SonarSource 开发的基于 Web 的开源平台，用于衡量和分析源代码质量。代码质量分析使您的代码更可靠、易读。\n\
    \n它使用 Java 语言实现，并通过插件分析约 20 种不同语言的代码，包括 c/c++、PL/SQL、Cobol 等。有超过 50 个插件可以扩展 SonQube\
    \ 的功能。\n\n"
