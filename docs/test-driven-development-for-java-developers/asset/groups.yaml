    1 FROM openjdk:8\n2 ARG jarToCopy\n5 COPY /target/$jarToCopy /app/app.jar\n7 CMD\
    \ [\"java\", \"-cp\", \"/app/app.jar\", \"com.examples.hellodocker.App\"]\n```\n\
    \nNow, when we build the image we must pass a value for jarToCopy:\n\n```\n1 docker\
    \ build --build-arg jarToCopy=hellodocker-0.0.1-SNAPSHOT.jar \\\n2   -t java-hello-world\n\
    ```\n\nWhile this is tedious from the command line, in Maven we can use the standard\
    \ properties to refer to the produced artifact: project.artifactId-version.jar.\
    \ We then use the <args> element of docker-maven-plugin when building from Maven:\n\
    \n```\n1 1 ...\n2 <build>\n3 <dockerFileDir>${project.basedir}</dockerFileDir>\n\
