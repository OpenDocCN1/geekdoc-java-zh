    As we already know, the plugin for unit tests is surefire, whose goal test is\
    \ automatically bound to the phase test. In this phase only unit tests should\
    \ be executed.\n\nMaven, in its default lifecycle, has 4 phases and a specific\
    \ plugin, maven-failsafe-plugin, for integration tests. These are the 4 phases\
    \ involved in integration tests:\n\n- ## pre-integration-test\nfor setting up\
    \ the integration test environment, e.g., starting a server needed by integration\
    \ tests.\n- ## integration-test\nwhere integration tests are effectively run.\n\
    - ## post-integration-test\nfor cleaning the integration test environment, e.g.,\
    \ stopping a server used by integration tests.\n- ## verify\nwhere results of\
    \ integration tests are checked.\n\nAs documented these phases are executed after\
    \ package, which in turn, is executed after test. Thus, they are executed after\
    \ unit tests have already been executed with success. The name failsafe is due\
    \ to the fact that the build does not fail immediately if integration tests fail\
    \ (differently from sufire). Thus, when it fails, it does so in a “safe” way.\
    \ If the build stopped when an integration test fails, during the phase integration,\
    \ the phase post-integration-test would not be executed and the additional resources\
    \ started in pre-integration-test would still be running. Instead, in case of\
    \ integration test failures, the build would fail in the phase verify, that if,\
    \ after post-integration-test, we have the chance to stop and clean resources\
    \ allocated during pre-integration.\n\nDifferently from sufire, failsafe is not\
    \ enabled by default. If we want to run integration tests we must configure the\
    \ plugin explicitly, as we will see in a minute. The plugin, once configured,\
    \ executes all the tests that match these patterns and are not abstract classes:\
    \ **/IT.java, ****/ITCase.java. As shown in Chapter Maven, sufire will not run\
    \ such tests, since its patterns are /**Test*.java, ***/Test.java, /**/*Tests.java,\
    \ /**TestCase.java. Thus, following the naming conventions for test cases, as\
    \ we also did in, the pre-integration-test and post-integration-test phases are\
    \ typically used by other plugins to start and stop, respectively, the integration\
    \ environment for integration tests. For the moment, we will use the docker-plugin.\n\
    \n```xml\n<plugin>\n  <groupId>org.apache.maven</groupId>\n  <artifactId>maven-failsafe-plugin</artifactId>\n\
    \  <version>22.1</version>\n  <executions>\n    <execution>\n      <goal>integration-test</goal>\n\
    \      <goal>verify</goal>\n    </execution>\n  </executions>\n</plugin>\n```\n\
