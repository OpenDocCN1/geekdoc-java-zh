    # 2


    # INTRODUCTION TO TEST DRIVEN DEVELOPMENT


    In computer science, software development, test-driven development (in short TDD
    is a software development model, which provides that the drafting of the automatic
    testing occurs before the software that must be tested, and that the development
    of a software application is exclusively oriented to the goal of passing the automated
    tests you have previously prepared.


    In recent years, tests have become even more integral to the software development
    phase. Practices such as Test-Driven Development and Continuous Integration are
    widely used by industry. But writing the tests is not enough, you need to write
    quality tests. TDD provides for the repetition of a short three-phase development
    cycle, called the “TDD cycle”. In the first phase (called the “Red phase”), the
    programmer writes an automatic test for the new function to be developed, which
    must fail because the function has not yet been realized. In the second phase
    (called the “green phase”), the programmer developps the minimum amount of code
    needed to pass the test. In the third phase (called “gray phase” or refactoring),
    the programmer refactors the code to adapt it to certain quality standards.'
  - '[PAGE 7]


    # 3


    PART 1


    # 3.1 CYCLE: RED-GREEN-REFACTOR


    # Red Phase:


    In TDD, the development of a new feature always begins with writing an automatic
    test to validate that feature, i.e. to check if the software exposes it. Since
    the implementation does not yet exist, writing the test is a creative task, since
    the programmer must determine in what form the functionality will be exposed by
    the software, and understand and define its details. For the test to be complete,
    it must be executable, and when it is performed, produce a negative result.


    # Green phase:


    In this stage, the programmer must write the minimum amount of code needed to
    pass the test that fails. Written code is not required to be of good quality,
    elegant, or general; the only explicit goal is for it to work, that is, pass the
    test. In fact, it is explicitly forbidden by the practice of TDD to develop parts
    of code not strictly aimed at passing the test that fails. When the code is ready,
    the programmer again launches all available tests on the modified software (not
    just the one that previously failed). By this way, the programmer can immediately
    realize if the new implementation caused pre-existing test failures, i.e caused
    regression in the code. The green phase ends when all tests are " green" (i.e.
    they are passed successfully).


    # Refactor (gray phase):


    When the software passes all the tests, the programmer devotes a certain amount
    of time to refactoring it, that is to improve its structure through a procedure
    based on small controlled modifications aimed at eliminating or reducing objectively
    recognizable defects in the internal structure of the code. Typical examples of
    refactoring actions include'
  - '[PAGE 8]


    choosing more expressive identifiers, eliminating duplicate code, simplifying,
    and streamlining the source architecture.


    In general, we could summarize:


    Red:


    Write a test and

    Make sure it fails


    Green:

    Write only enough code to make the test succeed


