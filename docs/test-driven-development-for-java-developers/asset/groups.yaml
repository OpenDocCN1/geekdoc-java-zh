  - '[PAGE 175]


    Maven, in its default lifecycle, has 4 phases and a specific plugin, maven-failsafe-plugin,
    for integration tests. These are the 4 phases involved in integration tests:


    # pre-integration-test


    for setting up the integration test environment, e.g., starting a server needed
    by integration tests.


    # integration-test


    where integration tests are effectively run.


    # post-integration-test


    for cleaning the integration test environment, e.g., stopping a server used by
    integration tests.


    # verify


    where results of integration tests are checked.


    As documented these phases are executed after package, which in turn, is executed
    after test. Thus, they are executed after unit tests have already been executed
    with success. The name failsafe is due to the fact that the build does not fail
    immediately if integration tests fail (differently from sufire). Thus, when it
    fails, it does so in a “safe” way. If the build stopped when an integration test
    fails, during the phase integration, the phase post-integration-test would not
    be executed and the additional resources started in pre-integration-test would
    still be running. Instead, in case of integration test failures, the build would
    fail in the phase verify, that if, after post-integration-test, we have the chance
    to stop and clean resources allocated during pre-integration.


    Differently from sufire, failsafe is not enabled by default. If we want to run
    integration tests we must configure the plugin explicitly, as we will see in a
    minute. The plugin, once configured, executes all the tests that match these patterns
    and are not abstract classes: **/IT.java, ****/ITCase.java. As shown in Chapter
    Maven, sufire will not run such tests, since its patterns are /**Test*.java, ***/Test.java,
    /**/*Tests.java, /**TestCase.java. Thus, following the naming conventions for
    test cases, as we also did in the previous section, allows failsafe to automatically
    run our integration tests, once configured.


    The pre-integration-test and post-integration-test phases are typically used by
    other plugins to start and stop, respectively, the execution environment for integration
    tests. We use them in the next section, as you can'
  - '[PAGE 176]


    # 9.1 UNIT TESTS WITH DATABASES


    imagine, for running and stopping a Docker container with the docker-maven-plugin.
    For the moment, we will not use pre and post integration test phases. In fact,
    our integration tests rely on a Docker container started automatically. Thus,
    to enable failsafe it is enough to enable its goals, integration-test and verify.
    These goals are automatically bound to the homogenous phases of the default lifecycle:


    ```

    <plugin>

    <groupId>org.apache.maven</groupId>

    <artifactId>maven-failsafe-plugin</artifactId>

    <version>2.22.1c</version>

    <executions>

    <execution>

    <goal>integration-test</goal>

    <goal>verify</goal>

    </execution>

    </executions>

    </plugin>

    ```


    Listing 9.13: integration-test.txt


    Now, running mvn test will only run unit tests while running mvn verify will also
