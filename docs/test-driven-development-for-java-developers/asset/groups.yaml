    \n## 4.1 Structure\n\nThe typical structure of a test consists of the following:\n\
    \n- 1. Setup: In this phase we create the environment for the test. In unit tests,\
    \ this usually corresponds to creating the SUT (Software Under Test). This phase\
    \ establishes the state prior to any test activities.\n- 2. Exercise: In this\
