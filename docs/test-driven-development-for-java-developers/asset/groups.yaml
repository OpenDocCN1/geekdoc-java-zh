    \    <build>\n    <plugins>\n      <plugin>\n        <!-- configured in pluginManagement\
    \ -->\n        <groupId>org.jacoco-maven-plugin</groupId>\n        <artifactId>jacoco-maven-plugin</artifactId>\n\
    \      </plugin>\n    </plugins>\n    </build>\n  </profile>\n  <profile>\n  \
    \  <id>mutation-testing</id>\n    <build>\n    <plugins>\n      <plugin>\n   \
    \     <!-- configured also in pluginManagement -->\n        <groupId>org.pitest</groupId>\n\
    \        <artifactId>pitest-maven</artifactId>\n        <executions>\n       \
    \   <execution>\n            <goals>\n              <goal>mutationCoverage</goal>\n\
    \            </goals>\n            <phase>verify</phase>\n          </execution>\n\
    \        </executions>\n      </plugin>\n    </plugins>\n    </build>\n  </profile>\n\
    </profiles>\n```\n\npossible solution is to specify its `<activation>` based on\
    \ the fact that a system property is NOT defined. For example, this makes the\
    \ jacoco profile active when the system property skipCoverage is NOT defined at\
    \ all. Thus, this profile is effectively active by default, unless the system\
    \ property skipCoverage is defined:\n\nNow, if you run verify the jacoco profile\
    \ will be active. If you run verify -DskipSkipCoverage or verify -DskipCoverage=<any\
    \ value> the jacoco profile will be deactivated.\n\nAlternatively, we could define\
    \ the `<activation>` as follows:\n\n## 5.5 MAVEN DEPLOY\n\n```xml\n<activation>\n\
    <activeByDefault>true</activeByDefault>\n</activation>\n```\n\n```xml\n<profile>\n\
    \  <id>jacoco</id>\n  <activation>\n    <!-- Activated when the system property\
    \ \"skipCoverage\" is not defined at\n    all, then, implicitly active by default\
    \ -->\n    <property>\n      <name>skipCoverage</name>\n    </property>\n  </activation>\n\
    </profile>\n```\n\n```xml\n<profile>\n  <id>jacoco</id>\n  <activation>\n    <!--\
    \ Activated when the system property \"skipCoverage\" is not defined at\n    all\
    \ or is defined with a value which is not \"true\", thus, implicitly active\n\
    \    by default -->\n    <property>\n      <name>skipCoverage</name>\n      <value>!true</value>\n\
    \    </property>\n  </activation>\n</profile>\n```\n\nThe comment in the XML should\
    \ be clear: if you run verify the jacoco profile will be active. It will be active\
    \ also if you run verify -DskipCoverage=<any value different from true>. It will\
    \ be deactivated if you run verify -DskipCoverage or verify -DskipCoverage=true.\n\
    \n## 5.5 MAVEN DEPLOY\n\nThe last phase of the default lifecycle, deploy, aims\
    \ at copying your artifacts to a remote Maven repository, for sharing with other\
    \ developers.\n\nThe repository to deploy can be specified and deployment to a\
    \ local filesystem is supported as well.\n\nDeployment to Maven Central is the\
    \ best solution for sharing your Java projects. This requires to follow a (long)\
    \ procedure, which is described here https://central.sonatype.org/pages/ossr-guide.html.\
    \ The length of the procedure concerns only the initial setup: after the first\
    \ release,\n\n## 5.6 MAVEN WRAPPER\n\ndeploying is just a matter of running the\
    \ deploy phase (with a good Internet). This procedure includes specifying several\
    \ information in the POM and configuring the digital signing of artifacts through\
    \ GPG.\n\nNote that deploying snapshot versions is different from deploying final\
    \ versions. Snapshot artifacts will have the SNAP replaced using a timestamp and\
    \ a build number. Moreover, snapshot artifacts are meant to be removed from time\
    \ to time, while actively released artifacts are meant to stay forever. The deployment\
    \ phase is out of the scope of this book.\n\n## 5.6 MAVEN WRAPPER\n\nIf you want\
    \ to run a Maven build from the command line, you need Maven installed on your\
    \ system. The system holds for every team member working on the same project and\
    \ for the Continuous Integration server, which we'll see in Chapter Continuous\
    \ Integration. The Maven Wrapper, https://github.com/takari/maven-wrapper, provides\
    \ an easy way to make that every user of your Maven project has everything necessary\
    \ to run the Maven build, enforcing a specific Maven version.\n\nThis wrapper\
    \ consists of a shell script mvnw (to be used in a Unix-like system like Linux\
    \ and Mac) and a batch script mvnw.cmd (for Windows). These scripts will first\
    \ check the specific version of Maven is already installed on the current system;\
    \ if not, they download and install it by default in the home directory in the\
    \ subdirectory .m2/wrapper/dists. Then, the scripts will run Maven from the above\
    \ installation directory.\n\nThese scripts are created by running the following\
    \ Maven command, typically from the root of your Maven project or multi-module\
    \ project (of course, Maven is needed at least when creating the wrapper):\n\n\
    ```bash\nmvn -N io.takari:maven-wrapper\n```\n\nThis command will create, in the\
    \ current directory, the above mentioned scripts and a small JAR .mvn/wrapper/maven-wrapper.jar.\
    \ The JAR is used to bootstrap the download and the invocation of Maven from the\
    \ wrapper shell scripts.\n\nNow, in order to build the project with Maven, instead\
    \ of running the command mvn, you run the command ./mvnw, from the directory where\
    \ the scripts are located. The first time, the Maven binary distribution will\
    \ be downloaded and unpacked in your home directory in .m2/wrapper/dists. The\
    \ wrapper also has the benefit of enforcing a specific version, so that anyone\
    \ using the wrapper will use that Maven version. Recall that each Maven version\
    \ comes with default versions of the plugins, thus using a specific Maven version\
    \ implies using those versions of the plugins (of course, unless the POM specifies\
    \ specifies versions, as we saw in Plugin management).\n\nThe specific version\
    \ of Maven is hardcoded in the download URL in the file .mvn/wrapper/maven-wrapper.properties.\
    \ To switch the wrapper to another version of Maven, simply change the version\
    \ in that file. Otherwise, the Maven version can be specified when creating the\
    \ wrapper or updated by running the Maven command with the command line argument\
    \ -Dmaven=<maven version>, e.g.,\n\n```bash\nmvn -N io.takari:maven-wrapper -Dmaven=3.6.0\n\
    ```\n\n# 6 CONTINUOUS INTEGRATION\n\nContinuous Integration in the world of modern\
    \ software development is an increasingly widespread and practiced practice, which\
    \ reduces the possibility of bugs and favors the correct integration of the components\
    \ developed by many programmers.\n\nThe typical workflow of the CI process can\
    \ be summarized as follows: Continuous integration, abbreviated to CI, is a software\
    \ development practice that consists to integrate all changes into the entire\
    \ application or project continuously, multiple times a day. This integration\
    \ is meant to be built automatically, verifying that the compilation is successful,\
    \ and fully tested, running all application tests. If a bug is introduced in the\
    \ application by a single component, this is detected at the very first integration\
    \ of that component into the application. Obviously, CI is based on an autofill\
    \ mechanism (like Maven, Chapter Maven) to perform all his duties. Also, a version\
    \ control system is required (like Git, Chapter Git) to store the entire application\
    \ code base. Finally, the compilation process is delegated to a dedicated server,\
    \ called Continuous Integration server (CI server).\n\n- A change is pushed to\
    \ a remote VCS repository;\n- The push notifies the CI server, which fetches the\
    \ pushed changes into its repository, builds the whole application and runs all\
    \ the tests;\n- The CI server notifies the developer(s) about the result of the\
    \ build and of the tests.\n\nWhile a full integration build can take several minutes,\
    \ developers can keep working while the server is building. Periodically, the\
    \ developers check the results provided by the CI server and, in the event of\
    \ a particular build failure, breaking changes of the corresponding commit it\
    \ can be analyzed and corrected.\n"
