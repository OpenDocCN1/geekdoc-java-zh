    # 5.3.6 Configuring the JaCoCo Maven plugin


    In Chapter Code we used JaCoCo for code coverage, in

    particular, its integration in Eclipse, EclEmma. In this section we use

    JaCoCo and its Maven plugin, org.jacoco:jacoco-maven-plugin, to keep

    track of code coverage and create a code coverage report.


    This also allows us to further experiment with Maven plugins exec-

    tutions and configurations. In that chapter, we saw that JaCoCo implements

    code coverage by using a custom Java agent. EclEmma provides a special

    run configuration to the JUnit tests through this Java agent and then it

    shows the report in an Eclipse view. In order to use JaCoCo from Maven,

    instead, we need to use its plugin goals appropriately so that the tests

    will be executed through the JaCoCo agent.


    The jacoco-maven-plugin provides the prepare-agent that prepares

    a Maven property pointing to the JaCoCo Java agent. The idea is to

    pass this property as a VM argument to the maven-surefire-plugin, so

    tests are run through the agent and code coverage information is

    collected in a file. By default, the property set by this goal is argLine.

    Since that the property is used by maven-surefire-plugin when running

    tntests, this goal alone, executed before running tests, is enough to

    create the file with code coverage information. As usual, this goal can

    configured (see https://www.eclemma.org/jacoco/trunk/doc/prepare-\agent-mojo.html)
    by specifying another property to set with the path

    of the agent and by configuring the output folders for JaCoCo. In this

    section, we will use the defaults. If you change the defaults, you will have

    to configure other plugins accordingly.


    Let’s run this Maven built from one of our projects, e.g., the bank

    example, invoking the prepare-agent goal explicitly:'
