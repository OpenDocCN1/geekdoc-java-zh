    to verify.


    Each test method must execute independently from other test methods. This means
    that a test method must never rely on possible side effects of other methods.
    In the fact, the setup and teardown phases are meant to make each test independent
    from each other. Moreover, JUnit does not guarantee that test methods are executed
    in a predefined order. Finally, JUnit does not necessarily reuse the same instance
    of the test case class for running all its methods. Thus, the state of the test
