    # 5


    # PART 3


    # 5.1 MAVEN:


    So far we have always used Eclipse to compile and run tests. We also used Eclipse
    for manage the dependencies of the project by modifying the project classpath.


    When we needed additional libraries (i.e. JARs) we turned to Eclipse. If the library
    is part of Eclipse itself, like JUnit, is quite simple. Otherwise we had to manually
    download the JARs from the Internet and add them to our projects in Eclipse by
    setting the classpath as well. Adding JAR to the file classpath is easy with Eclipse
    anyway. The most difficult problem with the JAR download process deals with transitive
    dependencies, that is, addictions of dependencies (recursive).


    Dealing with transitive addictions could become a nightmare, as we need to be
    fixed manually. First you need to know the external JARs needed by the libraries
    you want to use. Then, you have to download them too, until dependencies are resolved
    and available in your file project.


    So far we have been lucky as external JARs had no further dependencies (or they
    did, these were part of the JAR). In any case, this manual approach requires some
    effort. Remember that for Log4j we had to download a zip file, unzip the file
    and then only the JARs we actually have necessary.


    We have chosen to add the JARs directly into the project itself. When working
    on a team, the fact that external libraries are part of the project relieves other
    developers from doing all of the above manual steps repeatedly each time they
    want to set up the development environment. However, Having external libraries
    as part of your code base is also not ideal.'
  - '[PAGE 86]


    # 5.1 MAVEN: 87


    In the JUnit Chapter, Section Keeping Test Code Separate From Main Code, we showed
    the importance to keep the main code separate from the test code and that this
    separation should also cover the corresponding dependencies. In the section Export
    an executable JAR we also saw how to export a JAR with all the addictions. After
    separating the main code from the test code and the corresponding dependencies,
    the jar will contain only the external libraries needed by the main code, excluding
    dependencies needed for testing.


    Packing dependencies in our JARs makes sense if we want to provide an executable
    JAR, which is autonomous. However, if we want to distribute a library, including
    dependencies in the JAR it could be overwhelming. For libraries, we therefore
    document the necessary dependencies, since the users of our JAR will need to add
    our library dependencies to the classpath as well. Again, this it is cumbersome
    for our library users.


    Either way, dealing with addictions manually is effort and error prone To mention
    which does not fit complex programs with many dependencies.


    We will soon deal with “Continuous Integration servers”, Chapter Continuous Integration,
    which automatically.


    +   - Compile the entire program.

    - Run all tests.

    - Track possible problems with reports on:


    +   - Compilation errors.

    - Failed tests.

    - Code coverage.

    - Quality of the code.


    Continuous integration relies on a build automation tool, which is a capable “command
    line tool to automatically perform all the above tasks. In particular, such a
    tool should mimic what it usually does in Eclipse but automatically:


    +   - Download all project dependencies

    - Compile the entire application

    - Run all tests'
  - '[PAGE 87]


    +   • Generate reports


    Build automation and Continuous Integration is a requirement even for medium-sized
    projects. when there are many tests and some of them integration tests, which
    take much longer to run compared to unit tests, during a TDD cycle, a developer
    only runs unit tests that affect the current CUT. A single developer can also
    run all application unit tests, as they are fast, while all other long-running
    tests are performed by the Continuous Integration server.


    Maven comes to help us in all the above issues, with the aim of making all the
    above processes automatic, starting from a configuration file that defines the
    dependencies of the project and the file build automation infrastructures.


    # 5.1.1 Maven: Installation


    Maven is a command line Java program. It is available for any platform that is
    able to execute the JVM.

    It can be downloaded from https://maven.apache.org/download.cgi. It is just a
    matter of extracting the archive somewhere in your system and of setting the PATH
    accordingly. Alternatively, you may want to use SDKMan for installing Maven.


    Maven relies on the Java JDK, which must be already installed in your system.

    Eclipse comes with very nice support for Maven, in the shape of the M2Eclipse
    project (maze for short), https://www.eclipse.org/m2e/. This plugin is already
    part of Eclipse distributions, including the one for Java developers. Otherwise
    it can be installed from the update date that can be found in the project''s web
    page.


    M2Eclipse comes with Maven binaries, you do not need to manually install Maven
    in your system if you can run Maven builds only from Eclipse and not manually
    from the command line. The main features of M2Eclipse project are summarized in
    its main web page:


    +   • Starting Maven builds from Eclipse.

    • Dependency management from pom.xml based Eclipse build path.

    • Resolve Maven dependencies from the Eclipse workspace without installing locally
    Maven Repository.'
