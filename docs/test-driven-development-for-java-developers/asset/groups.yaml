    \ exceptions as executed. This is not a problem, since test classes should be\
    \ excluded from code coverage: we must concentrate on SUT classes. In EclEmma\
    \ such exclusion can be configured in the Run Configuration of the test in the\
    \ tab “Coverage” you can refine the scope of the analysis by excluding tests directories:\n\
