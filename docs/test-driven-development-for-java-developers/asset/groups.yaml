    \ > Console PIT Mut\n> default\nRun As\n> Definition As\n> Cover As > JUnit Test\n\
    > classpath\n> .gitignore\n```\n\nTests will execute as before, but this time,\
    \ JaCoCo will keep track of instructions that are executed and will show a report\
