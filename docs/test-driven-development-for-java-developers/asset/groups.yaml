  mdcn: '


    基于容器的虚拟化的巨大优势在于，具有不同要求的应用程序可以相互隔离运行，而无需提供独立的客系统开销。为了实现这一点，容器技术利用了 Linux 内核的两个基本功能：控制组（Cgroups）和内核命名空间（Kernel
    Namespaces）。


    Cgroups 限制进程对内存、CPU 和 I/O 资源的访问，从而防止某个进程所需的资源影响正在运行的其他进程。


    命名空间（namespace）将进程及其子进程限制在它们所基于的系统的有限部分。为了封装进程，Docker 在五个不同的领域使用了命名空间：


    - 系统标识符 (UTS)：在基于容器的虚拟化中，使用 UTS 命名空间是为了为每个容器提供自己的主机名和域名。

    - 进程标识符 (PID)：每个 Docker 容器都使用自己的命名空间来标识进程。在容器外部执行的进程从内部是不可见的。通过这种方式，同一宿主机系统中封装在容器内的进程可以相同的
    PID 而不会产生冲突。

    - 进程间通信 (IPC 或也称为 Inter-Process Communication)：IPC 命名空间隔离容器内的进程，防止与容器外部的进程进行通信。

    - 网络区域 (NET)：通过网络命名空间，你可以为每个容器分配单独的网络资源，如 IP 地址和路由表。

    - 文件系统挂载点 (MNT)：得益于命名空间，隔离的进程永远看不到主机的整个文件系统，而是看到一部分，这部分通常对应于该容器的特定镜像。


    在 0.8.1 版本之前，Docker 的进程隔离基于 Linux 容器 (LXC)，但从 0.9 版本开始，用户可以访问 Docker 自行开发的容器格式：Libcontainer。这允许你在各种平台上使用
    Docker，并在不同的宿主机系统运行相同的容器。通过这种方式，为 Windows 和 macOS 提供 Docker 版本也变得可能了。


    ## 7.0.2 可扩展性、高可用性和可移植性


    容器技术不仅是更关注资源节省传统硬件虚拟化的替代方案：容器还允许在不同的平台和各种基础设施上使用，而无需专门针对相应宿主机系统的硬件和软件配置进行适配。


    Docker 使用所谓的镜像（images）作为容器的可移植副本。镜像包含了单个应用程序，包括在封装进程期间所需的所有库以及所有二进制文件和配置文件，从而最大限地减少了对宿主机系统的请求。通过这种方式，容器可以轻松地在
    Linux、Windows 或 macOS 系统之间移动，而无需重新配置。只需安装 Docker 平台，它将作为一个抽象层。Docker 是构建可扩展、高可用
    (HA) 软件架构的理想基础。Docker 实际上被用于 Spotify、Google、eBay 或 Zalando 等公司的生产系统。


    ## 7.0.3 Docker：结构与功能


    Docker 是所有为用户提供基于容器的虚拟化技术项目中中最受欢迎的软件。该开源平台基于三个基本组件：要运行容器，用户只需要 Docker Engine 和特殊的
    Docker 镜像，这些镜像要么引用自 Docker Hub，要么可以独立创建。


    ## 7.0.4 Docker 镜像


    与虚拟机类似，Docker 容器基于镜像。镜像是一个不可编辑的模板，包含了 Docker Engine 创建容器所需的所有信息。作为容器的可移植副本，Docker
    镜像被描述为一个文本文件，也称为 Dockerfile。如果要在系统上启动容器，首先需要加载带有相应镜像的包，只要本地尚不存在该镜像。上传的镜像提供了运行期间所需的数据系统以及所有参数。正在运行的容器可以被视为镜像的一个正在进行中的进程。


    ## 7.0.5 Docker Hub


    Docker Hub 是一个基于云的存储库注册中心，或者通俗地说，类似于 Docker 库。该在线服务分为公共和私有部分。公共部分为用户提供了独立开发以及与社区共同开发镜像的机会。这里有大量来自
    Docker 开发团队和成熟的开源项目的官方镜像。上传到注册中心私有部分的镜像不是公开可见的，但可以进行共享，例如与公司内部的人员或你的朋友、熟人共享。


    ## 7.1 DOCKER-START


    首先，按照此处 https://docs.docker.com/install/ 上的说明安装 Docker 社区版 (CE)。在本书中我们使用 Linux，安装取决于取决于所使用的发行版。


    当从命令行运行时，Docker 命令的格式如下如下：


    ```

    docker <command> <arguments>

    ```


    如需获取帮助（即特定命令的格式和接受的命令行参数），只需输入：


    ```

    docker <command> --help

    ```


    在 Linux 中，Docker 命令必须以超级用户身份运行，例如在 Ubuntu 中使用 sudo，除非你将用户添加到 Docker 组，例如使用：


    ```

    sudo usermod -a docker $USER

    ```


    第一次运行此命令时，将下载（并在本地缓存）最新版本的 hello-world 镜像，然后启动运行该镜像的容器。该镜像仅用于打印一个 hello。


    之后，你需要注销并重新登录。然后你就可以用自己的用户运行 Docker 了。


    容器使用 `run` 命令和镜像名称执行。让我们运行


