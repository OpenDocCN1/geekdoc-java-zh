- md: '

    ## 12.3 KEY CONCEPTS IN STATIC CODE ANALYSIS


    A code review typically starts with the static analysis of the source code using
    a static analysis tool. Various key statistics are analyzed on the basis of software
    metrics.


    - 1. Code Smell: → It describes the estimated effort to fix all the maintainability
    Issues / code smells. It is a programming concept that reflects the extra development
    work, which has to be done if long-term and best solutions are not sought, and
    things are implemented keeping the ease in mind, for short term.

    - 2. Technical Debt: → It describes the estimated effort to fix all the maintainability
    Issues / code smells. It is a programming concept that reflects the extra development
    work, which has to be done if long-term and best solutions are not sought, and
    things are implemented keeping the ease in mind, for short term.

    - 3. Code coverage: → It describes the degree of code that has been tested.

    - 4. Bugs: → It is a problem in the code.

    - 5. Vulnerabilities: → It is a flaw in the code that can be exploited for attack.


    SonarQube is an open-source platform that performs static analysis of source code.
    It provides reports on the quality of the code, and can be integrated with various
    CI/CD pipelines.


    ## 12.3 KEY CONCEPTS IN STATIC CODE ANALYSIS


    SonarQube provides analysis of the quality of the code. It provides reports on
    various metrics, including:


    - Bugs

    - Vulnerabilities

    - Code Smells

    - Technical Debt

    - Coverage

    - Complexity


    These metrics help developers to identify areas of the code that can be improved.
    By using SonarQube, teams can maintain a high-quality codebase over time.

