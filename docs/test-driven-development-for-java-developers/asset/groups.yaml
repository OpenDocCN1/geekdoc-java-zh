    \  <version>0.1-SNAPSHOT</version>\n  <packaging>pom</packaging>\n</project>\n\
    ```\n\nThe parent project also contains the empty src/site; since we won’t create\
    \ a site for our projects, you can delete that folder.\n\nNow we create the first\
    \ module. As usual, Eclipse can infer default settings when actions are context\
    \ menus when a folder is selected. Since we want to create a module of a parent\
    \ project, we select the parent project we have created and use the context menu\
    \ New Project → Maven → Maven Module (note “Module”, not “Project”).\n\nWe specify\
    \ the “Module Name”, e.g., my-app-module. Note that the “Parent Project” is already\
    \ filled. Alternatively, another parent project can be selected among the Maven\
    \ projects currently opened in the workspace. We skip the archetype selection:\n\
    \n![](img/259250058ab8da9c293dfc86b5ff65c5_110_0.png)\n\nOn the next page, the\
    \ groupId is automatically inferred from the specified parent project. The artifactId\
    \ corresponds to the “Module Name” previously specified and cannot be changed.\n\
    \n![](img/259250058ab8da9c293dfc86b5ff65c5_110_1.png)\n\nPress “Finish” and the\
    \ Maven module is created. During this process, the parent project’s pom.xml has\
    \ been updated with the newly created module:\n```xml\n<project>\n  <modelVersion>4.0.0</modelVersion>\n\
    \  <groupId>com.example</groupId>\n  <artifactId>my-app-parent</artifactId>\n\
    \  <version>0.1-SNAPSHOT</version>\n  <packaging>pom</packaging>\n  <modules>\n\
    \    <module>my-app-module</module>\n  </modules>\n</project>\n```\n\nThe pom.xml\
    \ of the module project refers to the parent project. Note that since the module\
    \ lives in a subdirectory of the parent project, no path information has to be\
    \ specified. groupId and version are inherited from the parent POM and are not\
    \ repeated:\n```xml\n<project>\n  <modelVersion>4.0.0</modelVersion>\n  <parent>\n\
    \    <groupId>com.example</groupId>\n    <artifactId>my-app-parent</artifactId>\n\
    \    <version>0.1-SNAPSHOT</version>\n  </parent>\n  <artifactId>my-app-module</artifactId>\n\
    </project>\n```\n\nWe create the <properties> and the <dependencies> sections\
    \ in the parent POM. The POM of the parent is now as follows:\n```xml\n<project>\n\
    \  <modelVersion>4.0.0</modelVersion>\n  <groupId>com.example</groupId>\n  <artifactId>my-app-parent</artifactId>\n\
    \  <version>0.1-SNAPSHOT</version>\n  <packaging>pom</packaging>\n  <modules>\n\
    \    <module>my-app-module</module>\n  </modules>\n  <properties>\n    <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>\n\
    \    <!-- Change the Java compilation level to 1.8 -->\n    <maven.compiler.source>1.8</maven.compiler.source>\n\
    \    <maven.compiler.target>1.8</maven.compiler.target>\n  </properties>\n  <dependencies>\n\
    \    <dependency>\n      <groupId>junit</groupId>\n      <artifactId>junit</artifactId>\n\
