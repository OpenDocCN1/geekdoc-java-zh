    location. Just go ahead and try it yourself.


    To sum up, the Page Objects brings you these benefits: Makes your tests much clearer
    and easy to read by providing an interaction with pages and application page elements

    Organises code structure


    Helps to avoid duplications (we should never specify the same page locator twice)


    Saves a lot of time on tests maintenance and makes the UI automation pipeline
    => reduces costs


    If you want to make this test cleaner and more maintainable, you can introduce
    one more level of abstraction - steps or keywords. In different frameworks, you
    might see different names of these modules but the principles are the same. Steps
    (keywords) form modules of actions that you can reuse in any test. Once these
    steps (keywords) modules are written, all you need to make a reference to the
    module in your test and you can use all the functionalities provided by these
    specific modules.'
