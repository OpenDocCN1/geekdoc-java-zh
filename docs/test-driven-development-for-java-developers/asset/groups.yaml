    \ clean verify\n```\n列表 9.19: travisYml\n\n## 10. 图形界面测试\n\n在软件工程中，图形界面测试是确保产品符合规格的过程。\n\
    \n### 10.1 你检查什么？\n\nGUI 测试基本上涉及：\n\n- 检查尺寸、位置、宽度\n- 检查错误信息\n- 检查对齐\n- 检查字体\n\
    - 检查颜色\n- 检查图像\n- 检查按钮\n- 检查功能\n- 检查分辨率\n\n### 10.1.2 测试中的挑战\n\n在软件工程中，进行回归测试时常见的问题是应用程序\
    \ GUI 频繁变化。如果没有关于 GUI 变化的文档，要测试并识别这是一个问题还是增强是非常困难的。\n\n### 10.1.3 GUI 工具\n\n以下是流行的\
