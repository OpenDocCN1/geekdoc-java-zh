    \ .tar file only contains the JAR (and the Dockerfile).\n\nBefore including this\
    \ section, let's go back to our Dockerfile, in particular, with this command:\n\
    \n```\nCOPY /target/hellodocker-0.0.1-SNAPSHOT.jar /app/app.jar\n```\n\nThe name\
    \ of the JAR to copy from our system into the image is hardcoded, and most of\
    \ all, it includes the version of the artifact. If we changed the version in the\
    \ POM, we should also remember to change the version in the Dockerfile or the\
    \ build will fail.\n\nIn this very example, simply using a wildcard of the shape\
    \ *.jar would be enough. However, let's see another feature of the Dockerfile\
