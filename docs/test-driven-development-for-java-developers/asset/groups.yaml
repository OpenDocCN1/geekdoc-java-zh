    \ `SNAPSHOT`。此外，快照产物旨在定期被删除，而正式发布的产物旨在永久保留。`deploy` 阶段不在本书的讨论范围内。\n\n## 5.6 MAVEN\
    \ WRAPPER\n\n如果你想从命令行运行 Maven 构建，你需要在系统中安装 Maven。这对于每个参与同一项目的团队成员以及持续集成服务器都是必须的，我们将在“持续集成（Continuous\
    \ Integration）”章节中看到它。Maven Wrapper，https://github.com/takari/maven-wrapper 提供了一种简单的方法，确保你的\
    \ Maven 项目的每个用户都拥有运行 Maven 构建所需的所有内容，并强制使用特定的 Maven 版本。\n\n该包装器由一个 shell 脚本 `mvnw`（用于\
    \ Linux 和 Mac 等类 Unix 系统）和一个批处理脚本 `mvnw.cmd`（用于 Windows）组成。这些脚本将首先检查当前系统中是否已安装特定版本的\
    \ Maven；如果没有，它们将默认下载并安装到主目录下的 `.m2/wrapper/dists` 子目录。然后，脚本将从上述安装目录运行 Maven。\n\
    \n这些脚本通过运行以下 Maven 命令创建，通常从你的 Maven 项目或多模块项目的根目录运行（当然，在创建包装器时至少需要 Maven）：\n\n\
    ```bash\nmvn -N io.takari:maven-wrapper\n```\n\n此命令将在当前目录下创建上述脚本以及一个小 JAR 包 `.mvn/wrapper/maven-wrapper.jar`。\n\
    \n现在，为了使用 Maven 构建项目，与其运行 `mvn` 命令，不如运行 `./mvnw` 命令（位于脚本所在的目录）。第一次运行时，Maven 二进制文件将下载并解压到你的主目录\
    \ `.m2/wrapper/dists`。该 JAR 包用于引导下载。包装器的另一个优势是它可以强制使用特定版本，使得任何使用包装器的人都会使用该 Maven\
    \ 版本。由于每个 Maven 版本都带有默认插件版本，因此使用特定的 Maven 版本意味着使用这些插件（除非 POM 指定了版本，正如我们在插件管理中所看到的）。\n\
    \n特定的 Maven 版本硬编码在 `.mvn/wrapper/maven-wrapper.properties` 文件的下载 URL 中。要切换包装器到另一个\
    \ Maven 版本，只需更改该文件中的版本。否则，可以在创建包装器时通过命令行参数 `-Dmaven=<maven version>` 指定版本，例如：\n\
    \n```bash\nmvn -N io.takari:maven-wrapper -Dmaven=3.6.0\n```\n\n# 6 持续集成\n\n持续集成在现代软件开发领域是一种日益广泛采用和实践的方法，它减少了\
    \ Bug 的产生，并有利于许多开发者组件的正确集成。\n\nCI 流程的典型工作流可以总结如下：持续集成（缩写为 CI）是一种软件开发实践，涉及每天多次将所有更改集成到整个应用程序或项目中。这种集成旨在自动构建，以验证编译是否成功，并运行所有应用程序测试。如果某个组件为应用程序引入了\
    \ Bug，在该组件首次集成到应用程序时就会被检测到。\n\n- 更改推送到远程 VCS 仓库；\n- 推送通知 CI 服务器，服务器获取推送的更改到其仓库，构建整个应用程序并运行所有测试；\n\
    - CI 服务器通知开发者构建和测试的结果。\n\n虽然完整的集成构建可能需要几分钟，但开发者可以在服务器构建时继续工作。\n\n"
