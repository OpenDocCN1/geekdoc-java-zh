- md: "\n## 10.2 CONSIDER USING A BDD FRAMEWORK\n\nthis principle, because page classes\
    \ can contain hundreds of functions which do many different actions.\n\nNo worries,\
    \ we are not going to cover the meaning of each principle in detail. You can go\
