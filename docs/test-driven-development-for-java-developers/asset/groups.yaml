    In general, each unit test should test only a single behavior of the SUT. Recall
    that you have several assertions in a test method, if one fails, the test method
    terminates immediately, and subsequent assertions are not executed. However, in
    some cases in order to verify a single behavior several assertions must be written
    in the same test method. Summarizing, a single test method should exercise and
    verify a single scenario and behavior, but to do that, it is allowed to write
    several assertions.


    JUnit follows the all or nothing philosophy: if a single assertion fails in a
    test method, the method fails, the whole test case fails, and if the test case
    is part of a test suite (that is, we run several cases in the same run), then
    the whole test is marked with a failure.


    JUnit provides additional method annotations for the setup and teardown phases,
