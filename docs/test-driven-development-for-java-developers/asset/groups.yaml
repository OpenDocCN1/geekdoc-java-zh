    # 5.6 MAVEN WRAPPER


    If you want to run a Maven build from the command line, you need Maven installed
    on your system. The system holds for every team member working on the same project
    and for the Continuous Integration server, which we''ll see in Chapter Continuous
    Integration. The Maven Wrapper, https://github.com/takari/maven-wrapper, provides
    an easy way to make that every user of your Maven project has everything necessary
    to run the Maven build, enforcing a specific Maven version.


    This wrapper consists of a shell script mvnw (to be used in a Unix-like system
    like Linux and Mac) and a batch script mvnw.cmd (for Windows). These scripts will
    first check the specific version of Maven is already installed on the current
    system; if not, they download and install it by default in the home directory
    in the subdirectory .m2/wrapper/dists. Then, the scripts will run Maven from the
    above installation directory.


    These scripts are created by running the following Maven command, typically from
    the root of your Maven project or multi-module project (of course, Maven is needed
    at least when creating the wrapper):


    ```

    mvn -N io.takari:maven:wrapper

    ```


    This command will create, in the current directory, the above mentioned scripts
    and a small JAR .mvn/wrapper/maven-wrapper.jar. The JAR is used to bootstrap the
    download and the invocation of Maven from the wrapper shell scripts.'
  - '[PAGE 130]


    Now, in order to build the project with Maven, instead of running the command
    mvn, you run run the command ./mvnw, from the directory where the scripts are
    located. The first time, the Maven binary distribution will be downloaded and
    unpacked in your home directory in the subdirectory .m2/wrapper/dists. Distributing
    the wrapper (i.e., the scripts and the wrapper JAR) together with your project
    will allow anyone to build it by running the scripts, without an already installed
    Maven program.


    The wrapper has also the benefit of enforcing a specific version of Maven, so
    that anyone using the wrapper will use that Maven version. Recall that each Maven
    version comes with default versions of the standard plugins, thus using a specific
    Maven version also implies using those versions of the standard plugins (of course,
    unless the POM explicitly specifies plugin versions, as we saw in Section Plugin
    management).


    The specific version of Maven is hardcoded in the download URL in the file .mvnw/wrapper/maven-wrapper.properties.
    To switch the wrapper to another version of Maven, simply change the version in
    the URL in that file. Otherwise, the Maven version can be specified when creating
    the wrapper or updated by running the Maven command above with the command line
    argument -Dmaven=<maven version>, e.g.,


    ```

    mvn -N io.takari:maven:wrapper -Dmaven=3.6.0

    ```'
