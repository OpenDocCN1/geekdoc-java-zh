    # 7


    # DOCKER


    "Build, Ship and Run Any App, Anywhere", this is the motto with the open source
    container platform promotes a flexible and not too costly alternative to the emulation
    of hardware components, based on virtual machines (VMs) . In our Docker tutorial
    we delve into the differences between the two virtualization technologies and
    introduce you to the open source Docker project with a clear step-by-step guide.


    While classic hardware virtualization is based on booting several guest systems
    on a common host system, with Docker, thanks to its so-called containers, applications
    are launched as isolated processes on the same system. In this regard, there is
    talk of container-based virtualization and also of an operation system level virtualization.


    # 7.0.1 Container: virtualization with minimal overhead


    When applications are encapsulated within a classic hardware virtualization, this
    occurs by means of a so-called hypervisor, which acts as an abstraction layer
    between the host system and the various virtual guest systems. Each guest system
    is built as a complete machine with a separate kernel. The hardware resources
    of the host system (CPU, memory, hard disk space, peripheral units available)
    are proportionally allocated by the hypervisor.


    With container-based virtualization, a complete guest system is not reproduced:
    the applications are launched inside the containers, which share the same kernel
    (that of the host system), however functioning as isolated processes within the
    user space.'
- md: '

    The great advantage of container-based virtualization is that applications with
    different requirements can run in isolation from each other, without requiring
    the overhead of a separate guest system to be provided. To do this, the container
    technology uses two basic functions of the Linux Kernel: Control Groups (Cgroups)
    and the Kernel Namespaces.


    Cgroups limit the access of processes to memory, CPU and I/O resources and thus
    prevent the resources needed for a process from compromising other processes in
    progress.


    Namespaces (namespace) restrict a process and its child processes to a limited
    portion of the system on which they are based. In order to encapsulate processes,
    Docker uses Namespaces in five different areas:


    - System identification (UTS): in container-based virtualization UTS Namespaces
    are used in order to give each container its own host and domain name.

    - Process Identifier (PID): Each Docker container uses its own namespace for identification
    processes. The processes performed outside a container are not visible from the
    inside. In this way, the processes encapsulated within containers on the same
    host system can have the same PIDs, without however creating a conflict.

    - Inter-Process Communication (IPC or also Inter-Process Communication): IPC namespaces
    isolate processes in a container so that communication with processes outside
    the container is prevented.

    - Network Neighborhood (NET): With network namespaces, you can assign separate
    network resources to each container, such as IP addresses and routing tables.

    - File System Mount Point (MNT): Thanks to the namespaces, an isolated process
    never sees the entire file system of the host, but rather only a part of it, which
    usually corresponds to a specific image for this container.


    Up to version 0.8.1, process isolation with Docker was based on Linux containers
    (LXC), but starting from version 0.9, users have access to the container format
    developed by Docker itself: Libcontainer. This allows you to use Docker on various
    platforms and to run the same container on different host systems. In this way
    it has also become possible to offer a version of Docker for Windows and macOS.


    ## 7.0.2 Scalability, high availability and portability


    Container technology is not just an alternative to classic hardware virtualization
    that is more attentive to saving resources: containers also allow to be used on
    different platforms and various infrastructures, without having to specifically
    adapt them to the hardware and software configurations of the respective host
    systems.


    Docker uses so-called images as portable copies of containers. The images contain
    individual applications including all the libraries and all binary and configuration
    files necessary for the duration of the encapsulated processes, minimizing the
    requests on the host system. In this way a container can be moved between Linux,
    Windows or macOS systems, without difficulty and without having to reconfigure.
    It is enough to install the Docker platform which will act as an abstraction layer.
    Docker is the ideal foundation for building scalable, high availability (HA) software
    architectures. Docker is in fact used in the production systems of companies such
    as Spotify, Google, eBay or Zalando.


    ## 7.0.3 Docker: structure and functions


    Docker is the most popular software project among those that make container-based
    virtualization technology available to users. The open source platform is based
    on three fundamental components: to run a container, users only need the Docker
    Engine and the special Docker Images, which either refer to the Docker Hub or
    can be created independently.


    ## 7.0.4 Docker Images


    Similar to virtual machines, Docker Containers are based on images. An Image is
    a non-editable template that contains all the information needed by the Docker
    Engine to create a container. As a portable copy of a container a Docker image
    is described as a text file, also referred to as a Dockerfile. If a container
    is to be launched on a system, first a package with the corresponding image is
    loaded, as long as this is not already present locally. The uploaded image provides
    the data system necessary for the duration, together with all the parameters.
    A running container can be considered as an ongoing process of an Image.


    ## 7.0.5 Docker Hub


    The Docker Hub is a cloud-based registry for repositories, or in easier-to-understand
    words sort of Docker library. The online service is divided between public and
    private. The public section offers users the opportunity to upload images developed
    independently and with the community. A large number of official images from the
    Docker development team and established open source projects are available here.
    The images that are uploaded to the private section of the registry are not openly
    accessible but can be shared, for example, with people inside your company or
    in your circles of friends or acquaintances.


    ## 7.1 DOCKER-START


    First of all, install Docker Community Edition (CE), following the instructions
    that can be found here https://docs.docker.com/install/. In this book we use Linux,
    and the installation depends on the distribution used.


    When run from the command line, Docker commands have the shape


    ```

    docker <command> <arguments>

    ```


    For getting help, that is, the format of a specific command and the accepted command
    line argument, just type


    ```

    docker <command> --help

    ```


    In Linux, Docker commands must be run as super user, e.g., in Ubuntu, by using
    sudo, unless you add your user to the Docker group, e.g., with


    ```

    sudo usermod -a docker $USER

    ```


    The first time you run this command, the latest version of the hello-world image
    is downloaded (and cached locally) and then a container running the image is started.
    The image is meant to only print a hello.


    After that, you need to logout and login again. Then, you can run Docker with
    your own user.


    Containers are executed with the command run and the name of the image. Let''s
    run

