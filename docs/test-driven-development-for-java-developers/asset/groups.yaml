    \ the JUnit tests through this Java agent and then it shows the report in the\
    \ report.\n\n## 5.4 MAVEN PROFILES\n\nMaven profiles are a mechanism that allows\
    \ you to activate a subset of configurations (including properties, plugins even\
    \ modules) according to some criteria. Profiles are defined in <profiles>, each\
    \ one given an id.\n\nWhen profiles are activated their contents are merged into\
    \ the “Effective POM”, following the definition order. Otherwise, an inactive\
    \ profile is simply ignored. Any profile can be explicitly activated on the command\
    \ line with the option -P. In Eclipse, in the Maven build configuration, there\
    \ is a field, “Profiles”, where the ids of profiles to be activated can be listed.\n\
    \nA few activation policies are useful when the project is meant to be built in\
    \ different environments.\n\nThis activation rule is based on the current Java\
    \ version, e.g., for JDK 9 or newer:\n\n```xml\n1 <activation>\n2 <jdk>[1.9,)</jdk>\n\
    3 </activation>\n```\n\nThis activation rule is based on the current operating\
    \ systems, e.g., when running on a Mac:\n\n```xml\n1 <activation>\n2 <os>\n3 <family>mac</family>\n\
    4 </os>\n5 </activation>\n```\n\nWe can use profiles to activate specific plugins\
    \ only on demand. Let's take the Maven example developed up to now. We can have\
    \ a profile for activating the JaCoCo plugin (already configured in the <pluginManagement>\
    \ section) and another one where the PIT Maven plugin has the goal mutationCoverage\
    \ bound to the phase verify. This is useful since both coverage and mutation testing\
    \ typically increase the build time, thus might want to activate them on-demand,\
    \ not for every build.\n\nThe simplest activation policy is the following one:\n\
    \nThis activates a profile by default. Note however that all profiles are active\
    \ by default are automatically deactivated when another profile is activated explicitly\
    \ on the command line or through its activation rule.\n"
  mdcn: "\n让我们再次运行 `mvn package`，这次我们可以直接运行 JAR 包了：\n\n```bash\n1 java -jar <fullpath>/target/my-app-1.0-SNAPSHOT.jar\n\
    2\n3 Hello World!\n```\n\n## 5.3-4 插件管理\n\n`<build>` 部分中的 `<pluginManagement>`\
    \ 部分与 `<dependencyManagement>` 部分的目的相同（请参见“依赖管理”章节），但它是针对插件的。\n\n对于插件来说，这更加有用，因为\
    \ Maven 仍然会合并继承自父 POM（包括超类 POM）的配置以及当前 POM 的配置，并同时考虑 `<pluginManagement>` 和 `<plugins>`\
    \ 中的配置。\n\n在“配置 Maven 编译器插件”章节中，我们看到了如何在 `maven-compiler-plugin` 中直接配置 Java 编译级别。我们可以在\
    \ `<pluginManagement>` 中进行这一点：\n\n```xml\n1 <build>\n2   <pluginManagement>\n\
    3     <plugins>\n4       <plugin>\n5         <artifactId>maven-compiler-plugin</artifactId>\n\
    6       <configuration>\n7         <source>1.8</source>\n8         <target>1.8</target>\n\
    9       </configuration>\n10    </plugin>\n11  </plugins>\n12  </pluginManagement>\n\
    13 </build>\n```\n\n注意，在这种情况下我们甚至不需要指定插件的版本，因为在合并继承的插件配置后，版本会自动获取。\n\n## 5.3 配置\
    \ MAVEN PLUGIN\n\n### 5.3.5 PIT Maven 插件\n\n我们看到运行此类工具可能需要一些时间，因此在 Maven 构建中，我们可能想通过显式指定插件目标（goal）来偶尔运行它。然而，我们在\
    \ `<pluginManagement>` 中一次性配置该插件，指定要变异的类 (`targetClasses`)、使用变异器运行的测试 (`targetTests`)\
    \ 以及许多额外参数，如要应用的变异器。关于插件配置的更多信息，请访问 http://pitest.org/quickstart/maven/。正如我们在“变异测试”章节“缩小变异”节中预期的那样，PIT\
    \ Maven 插件允许我们利用 PIT 本身的高级配置功能，在 Maven 构建期间缩小变异测试过程。\n\n对于 Maven `bank-example`，我们可以如下配置插件：\n\
    \n```xml\n<build>\n  <pluginManagement>\n    <plugins>\n    ...\n    <plugin>\n\
    \      <groupId>org.pitest</groupId>\n      <artifactId>pitest-maven</artifactId>\n\
    \      <version>1.4.10</version>\n      <configuration>\n        <targetClasses>\n\
    \          <!-- 排除 testing.example.bank.Main *-->\n        </targetClasses>\n\
    \        <mutators>\n          <param>testing.example.bank.*</param>\n       \
    \   <mutator>DEFAULTS</mutator>\n        </mutators>\n        <mutationThreshold>80</mutationThreshold>\n\
    \      </configuration>\n    </plugin>\n  </pluginManagement>\n</build>\n```\n\
    \n我们指定了变异类的模式（排除没有测试的 Main 类）以及要执行的测试模式。此外，我们只启用了默认变异器。最后，通过使用 `<mutationThreshold>`\
    \ 指定了杀死的变异的阈值。这代表了为了成功构建而必须杀死的变异体百分比。如果模式低于阈值，Maven 构建将失败。\n\n我们现在可以使用以下命令从 Maven\
    \ 运行 PIT：\n\n```bash\nmvn test org.pitest:pitest-maven:mutationCoverage\n```\n\
    \nPIT 的 Web 报告可以在 `target/pit-reports` 目录下找到；每个报告都创建一个带有日期和时间的子目录中。\n\n### 5.3.6\
