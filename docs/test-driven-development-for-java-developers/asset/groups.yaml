    # 6


    # CONTINUOUS INTEGRATION


    Continuous Integration in the world of modern software development is an increasingly
    widespread and practiced practice, which reduces the possibility of bugs and favors
    the correct integration of the components developed by many programmers, especially
    in very large software projects.


    The typical workflow of the CI process can be summarized as follows: Continuous
    integration, abbreviated to CI, is a software development practice that consists
    to integrate all changes into the entire application or project continuously,
    multiple times a day. This integration is meant to be built automatically, verifying
    that the compilation is successful, and fully tested, running all application
    tests. If a bug is introduced in the application by a single component, this is
    detected at the very first integration of that component into the application.
    Obviously, CI is based on an autofill mechanism (like Maven, Chapter Maven) to
    perform all his duties. Also, a version control system is required (like Git,
    Chapter Git) to store the entire application code base. Finally, the compilation
    process is delegated to a dedicated server, called Continuous Integration server
    (CI server).


    +   1. A change is pushed to a remote VCS repository;

    2. The push notifies the CI server, which fetches the pushed changes into its
    repository, builds the whole application and runs all the tests;

    3. The CI server notifies the developer(s) about the result of the build and of
    the tests.


    While a full integration build can take several minutes, developers can keep working
    while the server is building. Periodically, the developers check the results provided
    by the CI server and, in the event of a particular build failure, breaking changes
    of the corresponding commit it can be analyzed and corrected.'
- md: "\nIn addition to building and running tests, a CI build process typically performs\
    \ additional checks, such as creating a code coverage report and performing further\
    \ code analysis with the code quality tools (see Chapter quality). Again, these\
    \ additional steps are generally skipped when developing, as they take time. These\
    \ are delegated to the CI server and will be part of its reports. These reports\
    \ are usually stored in a database and provided to developers via some websites\
    \ pages. The history of these reports will then be kept in order to have some\
    \ statistics on the project relationships.\n\nIn this book we implement the CI\
    \ process:\n\n## GitHub\nas the Git repository host (see Chapter Git, Section\
    \ GitHub)\n\n## Travis CI\n(https://travis-ci.com/) as the CI server, which will\
    \ use Maven to build and test our projects. By default, Travis provides a available\
    \ Linux distributions and which one can be found on the Travis web site; as we\
    \ will see in this chapter, we can also build the projects on Travis on a macOS.\n\
    \n## Coveralls\n(https://coveralls.io/) to store code coverage history and statistics.\n\
    \n## SonarCloud\n(https://sonarcloud.io/) to perform code quality analysis (this\
    \ will be described in a separate chapter, Chapter Code Quality)\n\nAll of these\
    \ tools are freely available for public open source projects. Plus, they're all\
    \ set up to be interoperable. It's just a matter of creating free accounts on\
    \ these services and linking them to implement the CI process:\n\n- We push to\
    \ our Git repository on GitHub;\n- This triggers a build on Travis CI;\n- The\
    \ project is completed;\n- Tests run with code coverage;\n- The result of the\
    \ code coverage is sent to Travis;\n- Code quality analysis is performed on SonarCloud;\n\
    - The results of all remote services are sent back to GitHub and will be used\
    \ to annotate the file commit and possibly the PR with those results (including\
    \ failures).\n\n## 6.1 EXAMPLE\n\nFirst of all, we need an example to experiment\
    \ with the CI process detailed above. As usual, we will keep the example extremely\
    \ simple, to focus on the tools and the CI process.\n\nCreate a Maven project\
    \ in Eclipse with the archetype maven-archetype-quickstart as done before. You\
    \ can create it in the workspace since later it will be automatically moved inside\
    \ a git repository.\n\nWe'll keep the POM to the very minimum (when we do not\
    \ change the Java compilation level, we only change the JUnit version as usual):\n\
    \n```xml\n<project>\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>com.examples</groupId>\n\
    \  <artifactId>myproject</artifactId>\n  <version>0.0.1-SNAPSHOT</version>\n \
    \ <packaging>jar</packaging>\n\n  <properties>\n    <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>\n\
    \  </properties>\n\n  <dependencies>\n    <dependency>\n      <groupId>junit</groupId>\n\
    \      <artifactId>junit</artifactId>\n      <version>4.13</version>\n      <scope>test</scope>\n\
    \    </dependency>\n  </dependencies>\n</project>\n```\nListing 6.1: pom.xml\n\
    \nThe SUT com.examples.myproject and the corresponding test case are really simple:\n\
    \n```java\npackage com.examples.myproject;\n\npublic class App {\n  public String\
    \ sayHello() {\n    return \"Hello\";\n  }\n}\n```\nListing 6.2: App.java\n\n\
    ```java\npackage com.examples.myproject;\n\nimport static org.junit.Assert.*;\n\
    import org.junit.Before;\nimport org.junit.Test;\n\npublic class AppTest {\n \
    \   private App app;\n\n    @Before\n    public void setup() {\n        app =\
    \ new App();\n    }\n\n    @Test\n    public void testSayHello() {\n        assertEquals(\"\
    Hello\", app.sayHello());\n    }\n}\n```\nListing 6.3: AppTest\n\nAdd an Eclipse\
    \ project to a new Git repository, we add this project to a new Git repository.\
    \ We call the Git repository github-travis-coversalls-example. we see in Chapter\
    \ Git, Section Create a repository on GitHub, we create a Git repository on GitHub\
    \ (with the same name of the local Git repository) and we push our local repository.\n\
    \n## 6.2 TRAVIS CI\n\nFirst of all, log into Travis CI - go to https://travis-ci.com/\
    \ and log in your GitHub account (the first time you will be asked to authorize\
    \ Travis CI to log into your GitHub). Then you will be redirected to a webpage\
    \ on the Travis website where you need to activate yours GitHub repositories using\
    \ Travis CI. By clicking on the button you will be redirected to your GitHub account\
    \ to approve and install the Travis CI app on your GitHub (you may want to select\
    \ \"All repositories\", so all your current and future repositories will be activated\
    \ automatically on Travis CI).\n\n### 6.2.1 Configure the Travis build\n\nTravis\
    \ uses YAML (https://yaml.org/), a typical format for configuration files, the\
    \ build configuration elects to find the .travis.yml file in the git repository.\
    \ It doesn't have to be in the project root, but in the root directory. Then,\
    \ edit that file from Eclipse (File → Open ...) or with the default text editor.\
    \ The details of such a file are documented on the Travis website and according\
    \ to the language used by the project. These are the initial contents:\n\n```yaml\n\
    language: java\njdk: openjdk8\ninstall: true\nscript:\n  - mvn -f com.examples/myproject/pom.xml\
    \ clean verify\n```\nListing 6.4: .travis.yml\n\nFor this example, the content\
    \ of that file should be clear: we specify that our project uses Java, in particular,\
    \ we specify the version of JDK to use. The important part is the script in which\
    \ we specify the Maven command to run during build. The installation specification\
    \ is used simply to skip the installation phase in Travis, which has nothing to\
    \ do with the Maven phase. The installation phase in Travis is used to install\
    \ dependencies needed for compilation. Since we use Maven, Travis automatically\
    \ takes care of dependencies. Add this file to the git repository, commit and\
    \ submit to GitHub. In few seconds, Travis will start the build, cloning the GitHub\
    \ repository and running the commands specified in the file .travis.yml (the Maven\
    \ build). We can follow the build using the button upper right corner of the section\
    \ (\"Follow log\"). The build should finish without errors:\n\n```\nCurrent Branches\
    \ Build History Pull Requests\n✔ Pull Request #1 passed from 4.13.0 to 4.13.1\
    \ in com.examples.myproject 30 seconds ago\n✔ Commit 7fa4a13 passed from 4.13.0\
    \ to 4.13.1 in com.examples.myproject\n  Branch master\n  dependabot\n```\nWorker\
    \ information\nBuild system information\n$ git clone --depth=50 https://github.com/JosephHachill/TravisExample\
    \ JosephHachGeorge/TravisExample\nSetting up build cache\n$ mvn -DskipTests -version\n\
    \nAbout the Linux machine can be viewed by expanding “Build System Information”\
    \ at the beginning of the compilation log. From now on, whenever we submit this\
    \ project’s repository to GitHub, Travis will automatically build the project.\
    \ The interaction between GitHub and Travis is bidirectional: Travis tells GitHub\
    \ whether a commit succeeded or not, and GitHub will show this information on\
    \ the commit.\n\n## 6.3 COVERAGE WITH COVERALLS\n\nCoveralls is a web service\
    \ to help you track your code coverage over time, and ensure that all your new\
    \ code is fully covered. There is but one prerequisite for Coveralls Cloud (Coveralls\
    \ Enterprise) can use a variety of repo-hosting options: The Coveralls service\
    \ is language-agnostic and CI-agnostic, but we have not yet built easy solutions\
    \ for all the possibilities as far as repo hosting. Creating an account is fast\
    \ and easy, just click the “Sign in” button for your git service (you can link\
    \ accounts later) and authorize Coveralls to access your repos - no forms to fill\
    \ out.\n\nCoveralls, https://coveralls.io/, is a free service that tracks code\
    \ coverage of public projects on GitHub. Code coverage reports are sent to Coveralls,\
    \ for example, by a Travis build. Coveralls can be used when compiling from our\
    \ computer, using a user-available token profile on the site Coveralls. When communicating\
    \ to Suits from a Travis build, the token is not necessary and should not be used.\n\
    \nFirst of all, we need to add our GitHub repository to Coveralls. Go to https://coveralls.io/\
    \ and sign in with the GitHub account (the first time you will be asked to authorize\
    \ Coveralls to access your GitHub account).\n\nOn the left choose “Add Repos”.\n\
    \n![](img/259250058ab8da9c293dfc86b5ff65c5_137_0.png)\n\nUse “Sync Repos” if the\
    \ project is not available from the list. Once found, enable the project.\n\n\
    We will experiment with Coveralls in a brand new local branch, e.g., coveralls.\n\
    \nWe use the Maven plugin for Coveralls (https://github.com/trautonen/coveralls-maven-plugin).\
    \ This plugin relies on the XML report generated by JaCoCo, so we must configure\
    \ JaCoCo in our POM accordingly. We have already seen the configuration of JaCoCo\
    \ in Chapter Maven, Section Configuring the JaCoCo Maven plugin.\n"
  mdcn: "\n\n除了构建和运行测试之外，CI 构建过程通常还会执行额外的检查，例如创建代码覆盖率报告，并使用代码质量工具进行进一步的代码分析（见“质量”（quality）章节）。同样，在开发过程中，通常会跳过这些额外步骤，因为它们需要时间。这些步骤被委托给\
    \ CI 服务器处理，并将作为其报告的一部分。这些报告通常存储在数据库中，并通过某些网页页面提供给开发者。这些报告的历史记录将被保留，以便对项目关系进行某些统计。\n\
    \n在书中，我们实现了以下 CI 流程：\n\n## GitHub\n作为 Git 仓库托管主机（见“Git”章节，“GitHub”节）\n\n## Travis\
    \ CI\n(https://travis-ci.com/) 作为 CI 服务器，它将使用 Maven 来构建和测试我们的项目。默认情况下，Travis 提供了可用的\
    \ Linux 发行版，可以在 Travis 网站上找到它们；正如我们在本章中将看到的，我们也可以在 macOS 上在 Travis 上构建项目。\n\n\
    ## Coveralls\n(https://coveralls.io/) 用于存储代码覆盖率历史和统计数据。\n\n## SonarCloud\n(https://sonarcloud.io/)\
    \ 用于执行代码质量分析（这将在单独的章节中描述，即“代码质量”章节）\n\n所有工具对于公共开源项目都是免费提供的。此外，它们都设置为可以相互操作。只需在这些服务上创建免费账户并将其链接以实现\
    \ CI 流程即可：\n\n- 我们将代码推送到 GitHub 上的 Git 仓库；\n- 这触发 Travis CI 上的构建；\n- 项目完成；\n-\
    \ 运行带有代码覆盖率的测试；\n- 代码覆盖率结果发送到 Travis；\n- 在 SonarCloud 上进行代码质量分析；\n- 所有远程服务的结果将传回\
    \ GitHub，并将用于这些结果来注释文件提交，并可能对 PR 进行相应的注释（包括失败结果）。\n\n## 6.1 示例\n\n首先，我们需要一个示例来对上述详细的\
    \ CI 流程进行实验。像往常一样，我们将保持示例极其简单，专注于关注工具和 CI 流程。\n\n在 Eclipse 中使用 `maven-archetype-quickstart`\
    \ 骨架（如之前所做）创建一个 Maven 项目。你可以在工作区中创建它，因为它之后会被自动移动到 git 仓库内部。\n\n我们将 POM 保持在最小范围内（当我们不更改\
    \ Java 编译级别时，我们像往常一样只更改 JUnit 版本）：\n\n```xml\n<project>\n  <modelVersion>4.0.0</modelVersion>\n\
    \  <groupId>com.examples</groupId>\n  <artifactId>myproject</artifactId>\n  <version>0.0.1-SNAPSHOT</version>\n\
    \  <packaging>jar</packaging>\n\n  <properties>\n    <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>\n\
    \  </properties>\n\n  <dependencies>\n    <dependency>\n      <groupId>junit</groupId>\n\
    \      <artifactId>junit</artifactId>\n      <version>4.13</version>\n      <scope>test</scope>\n\
    \    </dependency>\n  </dependencies>\n</project>\n```\n列表 6.1:pom.xml\n\nSUT\
