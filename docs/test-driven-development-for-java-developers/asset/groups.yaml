- md: "\n## 5.1.8 Properties\n\nWe have already used the properties section when we\
    \ switched the Java compilation level to version 8. Maven properties are key/value\
    \ pairs to define values and can be used in other parts of the POM. In the <properties>\
    \ section, properties are defined with the syntax:\n\n```xml\n<key>value</key>\n\
    ```\n\nDefining a property also implicitly overrides the possibly pre-existing\
    \ property defined with the same key. Many Maven plugins pick properties defined\
    \ in the POM or default to some values for such properties. If you know a plugin\
    \ picks properties with a given key, then specifying a value for property in the\
    \ <properties> section results in configuring the plugin behavior.\n\nAs we did\
    \ in Java settings, knowing in advance that the Maven compiler honors the properties\
    \ <maven.compiler.source> and <maven.compiler.target>, we can configure the compilation\
    \ level by providing values for those properties. Typically, a Maven plugin can\
    \ be configured by specifying values for some of its parameters. If the value\
    \ for an optional parameter is not specified, then the default value is assumed\
    \ for that parameter. However, if for a parameter a user property is taken into\
    \ consideration, then user property has the precedence. For example, for the Maven\
    \ compiler plugin, <maven.compiler.source> is the user property corresponding\
    \ to the parameter <source>.\n\nFor example, we can define a new property for\
    \ the JUnit version and use it as the version of corresponding dependency:\n\n\
    ```xml\n<properties>\n  <junit.version>4.13</junit.version>\n</properties>\n<dependencies>\n\
    \  <dependency>\n    <groupId>junit</groupId>\n    <artifactId>junit</artifactId>\n\
    \    <version>${junit.version}</version>\n    <scope>test</scope>\n  </dependency>\n\
    </dependencies>\n```\n\n## 5.1.9 Resources\n\nWe have already seen the concept\
    \ of a Java resource in Chapter JUnit. For example, the configuration file log4j2.xml,\
    \ placed in the root of the src/source folder, is a resource of our application,\
    \ that is, some data is needed by our application to run and can be accessed by\
    \ the application. Resources must be available at runtime in the classpath.\n\n\
    In that chapter, we directly put the resource file log4j2.xml in the src/source\
    \ folder. Eclipse automatically copies any data file (that, is, are not Java sources)\
    \ in the output folder of the source folder. We also had another resource file\
    \ log4j2.xml in the tests/source folder, used by tests. The test resource has\
    \ the precedence over the homonymous file in the src directory.\n\nMaven fosters\
    \ the separation of source Java files from resource files, both for the main code\
    \ and for the test code. By default, main resources should be placed in the directory\
    \ src/main/resources and test resources should be placed in the directory src/test/resources.\
    \ A Maven Java project's POM is implicitly configured with such directories; if\
    \ they are not present they are ignored.\n\nFor example, in the project we created\
    \ with the archetype, create the directory resources in src/main and in src/test.\
    \ Then create any text file in both directories. They will be automatically copied\
    \ in the corresponding output folders, that is, target/classes and target/test-classes,\
    \ respectively.\n\n```\n1 target\n2 └── classes\n3     ├── afile.txt\n4     ├──\
    \ com\n5         └── mycompany\n6             └── app\n7                 └── App.class\n\
    8\n9 └── test-classes\n10    ├── afile.txt\n11    ├── com\n12        └── mycompany\n\
    13            └── app\n14                └── myapp\n15                    └──\
    \ AppTest.class\n```\n\nNote that while Eclipse is automatically copying such\
    \ resource files, the corresponding source folders are not marked as source directories.\
    \ It is enough to update the Eclipse project with Maven → Update Project…\n\n\
    This also has the benefit of updating the Eclipse project encoding of the files\
    \ in the resources folders (again, taking the setting from the pom.xml). Once\
    \ again, the src/test/resources is colored as a source folder for tests.\n\n##\
    \ 5.1.10 Example of a Maven project\n\nIn the POM we specify the encoding for\
    \ the resources and the Java compilation settings as properties, as we have already\
    \ seen:\n\n```xml\n<project>\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>com.id.bank-example</groupId>\n\
    \  <artifactId>artifactId</artifactId>\n  <version>0.0.1-SNAPSHOT</version>\n\
    \  <properties>\n    <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>\n\
    \    <maven.compiler.source>1.8</maven.compiler.source>\n    <maven.compiler.target>1.8</maven.compiler.target>\n\
    \  </properties>\n</project>\n```\n\nSave the file, wait for Eclipse to download\
    \ these dependencies (if they are not already cached) and the project will compile.\
    \ Let's run the Main application. We don't see any output from Log4j since we\
    \ did not specify any configuration file. Such a file is a good candidate for\
    \ being a resource file. Let's copy the log4j2.xml from the src folder of the\
    \ original example into the src/main/resources of this project.\n\nNow the application\
    \ runs and information is correctly logged on the console.\n\nNow let's copy the\
    \ test code from the project into the src/test/java folder. The code does not\
    \ compile since neither JUnit nor Assertj are available to this project. We find\
    \ the Maven coordinates for Assertj from its home page https://assertj.github.io/doc/assertjcore-quick-start\
    \ and we already know how to add JUnit:\n\n```xml\n<dependency>\n  <groupId>junit</groupId>\n\
    \  <artifactId>junit</artifactId>\n  <version>4.13</version>\n  <scope>test</scope>\n\
    </dependency>\n<dependency>\n  <groupId>org.assertj</groupId>\n  <artifactId>assertj-core</artifactId>\n\
    \  <version>3.15.0</version>\n  <scope>test</scope>\n</dependency>\n```\n\n##\
    \ 5.1.11 Build with Maven\n\nIn this section we will see how to perform a build\
    \ with Maven. Up to now, we created projects and developed them in Eclipse. However,\
    \ to see how to perform a build with Maven. During the build the following tasks\
    \ will be performed:\n\n- Dependencies are downloaded (if not already cached)\n\
    - The main code, that is, what's in src/main/java will be compiled, using scope\
    \ compile\n- The test code, that is, what's in src/test/java will be compiled,\
    \ using scope test\n- Tests will be run and their results recorded\n- The JAR\
    \ with only the main code will be created\n\nThe complete set of executed tasks\
    \ is much more complex, and it will be detailed later. Of course, if anything\
    \ goes wrong in any of the tasks, the whole build will be interrupted and marked\
    \ with failure. As already sketched before, all generated artifacts will be created\
    \ in target (so called build directory). You can always safely remove this directory\
    \ and it will be recreated on the next build.\n\n## 5.1.12 Maven lifecycles\n\n\
    In the end, to understand how a Maven build works, and thus, to be able to configure\
    \ a Maven project, it is enough to understand the concept of Maven lifecycle,\
    \ which can be summarized as follows:\n\n- A Maven lifecycle is an ordered list\
    \ of\n- Phases, which have some associated\n- Goals, provided by Maven plugins\n\
    - Maven plugins have some goals that are bound to some phases; some plugin goals\
    \ are bound by default to specific phases; otherwise, plugin goals can be explicitly\
    \ bound to specific phases in the configuration of the plugin in the POM.\n\n\
    Maven provides 3 built-in lifecycles:\n\n- clean: removes all artifacts from previous\
    \ builds\n- default: generates all the artifacts of the build\n- site: generates\
    \ a web site with documentation and reports (e.g., unit test results and code\
    \ coverage)\n\nWe will not deal with the site lifecycle we won't further discuss\
    \ that. For example, the clean lifecycle defines these 3 phases:\n\n- pre-clean\n\
    - clean\n- post-clean\n\nWhen you request Maven to execute a phase then that phase\
    \ is executed only after executing all the previous phases in the corresponding\
    \ lifecycle. Executing a phase corresponds to executing all the goals of plugins\
    \ that are bound to that phase. Such goals are executed according to the order\
    \ with which plugins have bound their goals. For example, if we execute\nmvn clean\n\
    \nFirst the phase pre-clean is executed (that is, all the goals bound to that\
    \ phase) and then the phase clean is executed.\n\nNote that clean passed on the\
    \ command line is the phase clean of the lifecycle clean, not the name of the\
    \ lifecycle clean.\n\nThe most interesting lifecycle is course the default lifecycle,\
    \ where most of the work is done (compilation, testing, packaging). This lifecycle\n"
  mdcn: "\n\n## 5.1.8 属性\n\n我们在将 Java 编译级别切换到版本 8 时已经使用过属性部分。Maven 属性是键值对，用于定义值，并可以用于\
    \ POM 的其他部分。在 `<properties>` 部分中，属性的定义语法如下：\n\n```xml\n<key>value</key>\n```\n\
    \n定义属性也会隐式地覆盖可能存在的、具有相同键的属性。许多 Maven 插件会读取 POM 中定义的属性，或者对这些属性使用默认值。如果你知道某个插件会读取给定键的属性，那么在\
    \ `<properties>` 部分中为该属性指定一个值就可以配置插件的行为。\n\n正如我们在 Java 设置中所做的那样，预先知道 Maven 编译器遵循\
    \ `<maven.compiler.source>` 和 `<maven.compiler.target>` 属性，我们可以通过为这些属性提供值来配置编译级别。通常情况下，可以通过指定其某些参数的值来配置一个\
    \ Maven 插件。如果没有指定可选参数的值，则假设该参数使用默认值。然而，如果对某个参数考虑了用户属性，则用户属性具有更高的优先级。例如，对于 Maven\
    \ 编译器插件，`<maven.compiler.source>` 是对应参数 `<source>` 的用户属性。\n\n例如，我们可以为 JUnit 版本定义一个新属性，并将其作为相应依赖的版本：\n\
    \n```xml\n<properties>\n  <junit.version>4.13</junit.version>\n</properties>\n\
    <dependencies>\n  <dependency>\n    <groupId>junit</groupId>\n    <artifactId>junit</artifactId>\n\
    \    <version>${junit.version}</version>\n    <scope>test</scope>\n  </dependency>\n\
    </dependencies>\n```\n\n## 5.1.9 资源\n\n我们已经在 JUnit 章节中看到过 Java 资源的概念。例如，放置在 `src/source`\
    \ 文件夹根下的配置文件 `log4j2.xml` 是我们应用程序的资源，也就是说，应用程序运行需要某些数据，并且可以访问这些数据。资源在运行时必须在类路径可用。\n\
    \n在那个章节，我们直接将资源文件 `log4j2.xml` 放在 `src/source` 文件夹中。Eclipse 会自动将源文件夹输出中的任何数据文件（即非\
    \ Java 源码）复制到输出文件夹中。我们在 `tests/source` 文件夹中还有另一个资源文件 `log4j2.xml`，供测试使用。测试资源的优先级高于\
    \ `src` 目录下的同名文件。\n\nMaven 促进了源 Java 文件与资源文件的分离，无论是主代码还是测试代码。默认情况下，主资源应该放置在 `src/main/resources`\
    \ 目录，测试资源应该放置在 `src/test/resources` 目录。Maven Java 项目的 POM 隐式地配置了这些目录；如果它们不存在，则会被忽略。\n\
    \n例如，在我们用构架创建的项目中，在 `src/main` 和 `src/test` 中创建 `resources` 目录。然后在两个目录中都创建任何文本文件。它们将自动复制到对应的输出文件夹中，分别是\
    \ `target/classes` 和 `target/test-classes`。\n\n```\n1 target\n2 └── classes\n\
    3     ├── afile.txt\n4     ├── com\n5         └── mycompany\n6             └──\
    \ app\n7                 └── App.class\n8\n9 └── test-classes\n10    ├── afile.txt\n\
    11    ├── com\n12        └── mycompany\n13            └── app\n14            \
    \    └── myapp\n15                    └── AppTest.class\n```\n\n注意，虽然 Eclipse\
    \ 会自动复制此类资源文件，但相应的源文件夹并没有被标记为源目录。只需通过 `Maven → Update Project…` 更新 Eclipse 项目即可。\n\
    \n这样做还有一个好处，可以更新 Eclipse 项目中资源文件夹内文件的编码（再次，从 `pom.xml` 中获取设置）。再次，`src/test/resources`\
    \ 会被着色为测试的源文件夹。\n\n## 5.1.10 Maven 项目示例\n\n在 POM 中，我们将资源的编码和 Java 编译设置指定为属性，正如我们已经所见的那样：\n\
    \n```xml\n<project>\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>com.id.bank-example</groupId>\n\
    \  <artifactId>artifactId</artifactId>\n  <version>0.0.1-SNAPSHOT</version>\n\
    \  <properties>\n    <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>\n\
    \    <maven.compiler.source>1.8</maven.compiler.source>\n    <maven.compiler.target>1.8</maven.compiler.target>\n\
    \  </properties>\n</project>\n```\n\n保存文件，等待 Eclipse 下载这些依赖（如果尚未缓存），项目将进行编译。让我们运行\
    \ Main 应用程序。我们没有看到 Log4j 的任何输出，因为我们没有指定任何配置文件。这样的文件是作为资源文件的良好选择。让我们从原始示例的 `src`\
    \ 文件夹将 `log4j2.xml` 复制到此项目的 `src/main/resources` 中。\n\n现在应用程序运行了，信息正确地记录在控制台上。\n\
    \n现在将测试代码从项目复制到 `src/test/java` 文件夹。代码无法编译，因为该项目既没有 JUnit 也没有 Assertj。我们从 Assertj\
    \ 的主页 https://assertj.github.io/doc/assertjcore-quick-start 找到了 Assertj 的 Maven\
    \ 坐标，并且已经知道如何添加 JUnit：\n\n```xml\n<dependency>\n  <groupId>junit</groupId>\n \
    \ <artifactId>junit</artifactId>\n  <version>4.13</version>\n  <scope>test</scope>\n\
    </dependency>\n<dependency>\n  <groupId>org.assertj</groupId>\n  <artifactId>assertj-core</artifactId>\n\
    \  <version>3.15.0</version>\n</dependency>\n```\n\n## 5.1.11 使用 Maven 构建\n\n\
    在本节中，我们将看到如何使用 Maven 进行构建。到目前为止，我们在 Eclipse 中创建并开发了项目。然而，现在来看看如何使用 Maven 构建。在构建期间将执行以下任务：\n\
    \n- 下载依赖（如果尚未缓存）\n- 主代码（即 `src/main/java`）将被编译，使用阶段 `compile`\n- 测试代码（即 `src/test/java`）将被编译，使用阶段\
    \ `test`\n- 运行测试并记录结果\n- 创建只有主代码的 JAR\n\n执行的完整任务集要复杂得多，稍后将详细介绍。当然，如果任何任务出现问题，整个构建将中断并标记为失败。正如之前概述的，所有生成的文件将创建在\
    \ `target`（称为构建目录）。你可以安全地删除此目录，它将在下次构建时重建。\n\n## 5.1.12 Maven 生命周期周期\n\n最后，为了理解\
    \ Maven 构建如何工作，从而能够配置 Maven 项目，只需理解 Maven 生命周期周期的概念，该概念可以总结如下：\n\n- Maven 生命周期周期是一个有序列表，包含\n\
    - 阶段（Phases），每个阶段关联到\n- 插件提供的目标（Goals）\n- Maven 插件具有绑定某些阶段的目标；某些插件目标默认绑定到特定阶段；否则可以在\
    \ POM 的插件配置中显式绑定到特定阶段。\n\nMaven 提供了 3 个内置生命周期：\n\n- clean：移除之前构建的所有产物\n- default：生成构建的所有制品\n\
    - site：生成带有文档和报告的网站（例如，单元测试结果和代码覆盖率）\n\n我们不会处理 site 生命周期周期，我们将不再进一步讨论它。例如，`clean`\
    \ 生命周期周期定义了这 3 个阶段：\n\n- pre-clean\n- clean\n- post-clean\n\n当你请求 Maven 执行某个阶段时，该阶段只有在执行了相应周期中所有之前的阶段之后才会执行。执行一个阶段对应于执行绑定到该阶段的所有插件目标。这些目标按照插件绑定其目标的顺序执行。例如，如果我们执行\n\
    mvn clean\n\n首先执行 `pre-clean` 阶段（即绑定到该阶段的所有目标），然后执行 `clean` 阶段。\n\n注意命令行传递的 `clean`\
    \ 是 `clean` 生命周期周期中的 `clean` 阶段，而不是 `clean` 生命周期周期的名称。\n\n最有趣的周期当然是 `default`\
    \ 生命周期周期，大部分工作都在这里完成（编译、测试、打包）。这个周期\n\n"
