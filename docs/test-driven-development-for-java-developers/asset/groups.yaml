    包含 20 多个阶段。我们现在来看主要阶段并总结它们的意图：


    - **validate**：验证 pom.xml 文件并检查所有必要信息是否可用。

    - **initialize**：初始化构建，包括创建和设置目录以及设置属性。

    - **generate-sources**：生成任何作为编译一部分的所需的源代码。（如果你使用额外的工具生成 Java 代码，这非常有用。）

    - **generate-resources**：生成将成为最终产物的一部分（并在测试中使用）的资源。

    - **process-resources**：将资源复制到它们的构建目录。

    - **compile**：编译主源代码。

    - **process-classes**：处理在编译阶段生成的字节码，例如用于代码增强。

    - **generate-test-sources,..., test-compile, process-test-classes**：与上述阶段相同，但目标是测试资源和测试代码。

    - **test**：使用单元测试框架运行测试。


    # 5.1 MAVEN: 101


    ### prepare-package

    为打包产物做准备。


    这些内容与集成测试有关，我们将在“集成测试”章节中看到。


    ### verify

    验证包的有效性以及项目的整体有效性（通常包括验证结果）。


    ### install

    将打包好的产物安装到本地仓库（下载的产物缓存在此，例如在主目录下的 .m2 子目录中），供其他项目作为依赖。


    ### deploy

    将打包好的产物部署到远程仓库。


    一些标准 Maven 插件具有默认绑定到特定阶段的目标（goals）。对于默认生命周期，绑定取决于打包类型。通过运行此 Maven 命令来执行这些绑定：


    ```

    mvn help:describe -Dcmd=<phase name>

    ```

    例如，

    ```

    mvn help:describe -Dcmd=clean

    [INFO] ''clean'' 是 ''clean'' 生命周期周期中的一个阶段，它包含以下阶段：

    * pre-clean: 未定义

    * clean: org.apache.maven.plugins.maven-clean-plugin:2.5:clean

    * post-clean: 未定义

    ```


    这表明没有插件目标绑定到 pre-clean 阶段，并且 maven-clean-plugin 插件的 clean 目标绑定到了 clean 阶段。正如你所想象的，maven-clean-plugin
    插件的 clean 目标会清理构建目录，删除 target 目录。


    # 5.1.13 使用命令行运行 Maven


    为了从命令行运行 Maven，我们必须使用它的二进制文件 `mvn`。如果我们在 Maven bank-example 示例项目的根目录下运行此命令，可以看到此输出：


    在调用 Maven 时可以指定多个阶段。例如，通过以下命令，我们首先执行 clean（在执行完 clean 生命周期周期的之前的阶段之后），然后执行 compile
    阶段（在执行完 default 生命周期周期的之前的阶段之后）：


    我们可以看到几个目标的执行情况：


    - maven-clean-plugin 插件的 clean 目标绑定到了 clean 阶段（我们之前已经见过），

    - maven-resources-plugin 的 resources 目标（绑定到默认生命周期的 process-resources 阶段），

    - maven-compiler-plugin 的 compile 目标（绑定到默认生命周期的 compile 阶段）。


    从输出中我们可以验证，maven-resources-plugin 的 resources 目标将我们从 src/main/resources 的 log4j2.xml
    复制到输出文件夹 target/classes，而 maven-compiler-plugin 的 compile 目标将 src/main/java 中的
    Java 文件编译到输出文件夹 target/classes。


    当我们调用 test 阶段时，生命周期中之前的所有阶段都将被执行（包括之前运行中看到的），特别是测试资源会被复制到输出文件夹 target/test-classes，src/test/java
    中的 Java 文件被编译到输出文件夹 target/test-classes，最后运行单元测试（将在输出目录 target/surefire-reports
    中生成一份已执行测试的报告）。


    我们可以看到，由于没有调用 clean 阶段，主源之前生成的 Java 类仍然在那里，因此它们不会被重新编译。maven-resources-plugin
    和 maven-compiler-plugin 有特定的目标用于复制测试资源和编译测试代码，并绑定到默认生命周期的相应阶段。maven-surefire-plugin
    的 test 目标绑定到默认生命周期的 test 阶段，负责负责执行测试。当 Java 源码被编译时，Maven 使用当前已安装的 JDK 中的默认 Java
    编译器。例如，JDK 的版本必须至少等于 POM 中指定的编译级别。相反地，请记住 Eclipse 使用它自己的编译器来编译 Java 源码。事实上，Eclipse
    不需要 JDK，JRE 就够了。Maven 使用的 Java 编译器是可以更改的：请参考 http://maven.apache.org/plugins/maven-compiler-plugin/javac.html。


    ```

    mvn clean

    [INFO] Scanning for projects...

