    # 5.1.12 Maven lifecycles


    In the end, to understand how a Maven build works, and thus, to be able to configure
    a Maven project, it is enough to understand the concept of Maven lifecycle, which
    can be summarized as follows:


    +   - A Maven lifecycle is an ordered list of

    - Phases, which have some associated

    - Goals, provided by Maven plugins

    - Maven plugins have some goals that are bound to some phases; some plugin goals
    are bound by default to specific phases; otherwise, plugin goals can be explicitly
    bound to specific phases in the configuration of the plugin in the POM.


    Maven provides 3 built-in lifecycles:


    +   clean

    removes all the artifacts from previous builds

    default

    generates all the artifacts of the build

    site

    generates a web site with documentation and reports (e.g., unit test results and
    code coverage)


    We will not deal with the site lifecycle we won''t further discuss that.

    For example, the clean lifecycle defines these 3 phases:


    +   - pre-clean

    - clean

    - post-clean


    When you request Maven to execute a phase then that phase is executed only after
    executing all the previous phases in the corresponding lifecycle. Executing a
    phase corresponds to executing all the goals of plugins that are bound to that
    phase. Such goals are executed according to the order with which plugins have
    bound their goals. For example, if we execute

    mvn clean


    First the phase pre-clean is executed (that is, all the goals bound to that phase)
    and then the phase clean is executed.


    Note that clean passed on the command line is the phase clean of the lifecycle
    clean, not the name of the lifecycle clean.


    The most interesting lifecycle is course the default lifecycle, where most of
    the work is done (compilation, testing, packaging). This lifecycle'
