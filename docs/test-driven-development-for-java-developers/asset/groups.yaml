    \ become the reason of an anti-pattern called \"Large Class\". This happens when\
    \ you have too many elements on the pages, so the number of functions on an object\
    \ that represents the page might become really huge. This goes against one of\
    \ the most important design principles in object-oriented programming called SOLID:\n\
    \nSingle Responsibility Principle\n\nOpen Closed Principle\n\nLiskov Substitution\
    \ Principle\n\nInterface Substitution Principle\n\nDependency Inversion Principle\n\
    \nThe main contradiction it goes against is the Single Responsibility Principle,\
    \ which says that each class should have a single functionality. Robert C. Martin\
    \ (one of the well-known software engineers and collaborators in SOLID) described\
    \ this principle with these words: \"A class should have only one reason to change.\"\
    \ That's why Page Objects might contradict\n"
  mdcn: "\n\n## 10.2 考虑使用 BDD 框架\n\n现在让我们来看一个简单的例子。假设我们想编写一个非常小的测试，来验证 blazedome.com\
    \ 网站上的基本工作流。尝试浏览一下这个场景并理解它的功能：\n\n```java\n1 HomePage homePage = new HomePage();\n\
    2 homePage.open();\n3 homePage.waitUntilPageLoaded();\n4 Assert.assertEquals(homePage.getTitle(),\
    \ \"BlazeDemo\");\n5 Assert.assertEquals(homePage.getTitle(), \"Welcome to the\
    \ Simple Travel Agency!\");\n6 FlightsPage flightsPage = homePage.findFlights(\"\
    Boston\", \"New York\");\n7 List<String> foundFlights = flightsPage.getFlights();\n\
    8 Assert.assertTrue(foundFlights.size() > 0);\n```\n列表 10.1: homePage.java\n\n\
    这很简单，对吧？但让我们想象一下如果你是经理——阅读此类测试对你来说有多容易？或者假设你是一个新团队成员，你喜欢通过查看现有测试来理解它们的功能。你会喜欢查看这样的测试吗？或者你可能乐意看到像这样编写的相同测试：\n\
    \n第二个例子是同一个测试，但使用了最著名的 BDD 框架之一——Cucumber，使用 Gherkin 行导语言以 BDD 风格编写。\n\n即使你不倾向于在人类可读的测试文件中编写测试，也有很多选项可以将\
    \ BDD 模型应用到你的测试中，无论它们使用哪种编程语言。例如，你可以自己在代码中放置 BDD 风格的注释：\n\n```java\n@Test\npublic\
    \ void someTest() {\n    // given\n    Something something = getSomething();\n\
    \    // when\n    something.doSomething();\n    // then\n    assertSomething();\n\
    }\n```\n列表 10.2: someTest.java\n\n设计模式是软件设计中常见问题的可重用解决方案。我们可以说，每个模式都是针对特定问题的特定解决方案的实例，无论使用什么编程语言或范式。作为设计模式的补充，我们还有设计原则。设计原则为你提供了构建良好且易于维护的软件时需要遵循的指南或规则。模式适用于特定问题，而设计原则无论无论上下文如何都适用。\n\
    \n这与 UI 自动化测试有什么关系？正如之前讨论的，UI 测试是一条艰辛且危险的道路，充满了各种陷阱。但我有一个好消息。你不是在这条路上旅行的第一个驾驶员。这就是为什么有这么多陷阱，而且没有人曾绕过你。你可以将设计模式和原则看作强大的导航员。一个告诉你通常如何安全地驾驶（设计原则），而另一个则就如何处理挡住道路的每个特定陷阱给出清晰的指令（设计模式）。\n\
    \n在本节中，我想谈论两种模式：页面对象模式（Page Objects pattern），它已成为测试自动化工程师中最流行的 UI 自动化模式；以及屏幕模式（Screen\
    \ pattern），它组织并改进了页面对象模式。\n\n页面对象模式的概念几乎是在 10 年前引入的。它的目的是让 UI 自动化测试具有一致性，避免代码重复，提高可读性，并为页面交互组织代码。在创建\
    \ Web 测试期间，你总是需要与网页和 Web 元素（按钮、输入元素、图像等）进行交互。页面对象模式获取了这一需求，并在此应用了面向对象的编程原则，强制你将所有页面和元素作为对象进行交互。\n\
    \n例如，如果你需要点击按钮，你不需要担心在测试中如何获取此按钮，因为它已经在页面对象中处理好了。你应该拥有你正在查找的页面对象，它内部应该包含了你正在查找的按钮对象。你只需要使用该按钮对象的引用并对其应用“点击”动作即可。你可以这样考虑所有页面和\
    \ Web 元素：\n\nTravel The Word 首页\n\n# 欢迎来到简单旅行社！\n\n这是一个你可以用 Blazemeter 测试的简单站点！\n\
    查看我们本周的目的地！海滩\n\n选择你的出发城市：\n\n巴黎\n\n选择你的目的地：\n\n布宜诺斯艾利斯\n\n测试航班\n\n对象\n对象\n对象\n\
    对象\n\n...\n\n测试\n测试\n测试\n\n对于你需要交互的每个页面和元素，你应该创建一个单独的对象，它将作为你测试中该 Web 元素的引用。这是一个没有使用页面对象模式编写的测试示例：\n\
    \n```java\n1 WebDriver WebDriver = driver;\n3 driver.navigate().to(\"blazemeter.com\"\
    );\n5 string heading = driver.findElement(By.cssSelector(HEADING_ELEMENT)).getText();\n\
    6 Assert.assertEquals(heading, \"Welcome to the Simple Travel Agency!\");\n7 Assert.assertEquals(driver.getTitle(),\
    \ \"BlazeDemo\");\n9 select flightsFromSelectElement = new Select(driver.findElement(By.cssSelector(FLIGHT_FROM_SELECT)));\n\
    10 select flightsToSelectElement = new Select(driver.findElement(By.id(FLIGHT_TO_SELECT)));\n\
    12 flightsFromSelectElement.selectValue(\"Boston\");\n13 flightsToSelectElement.selectValue(\"\
    New York\");\n14 driver.findElement(By.cssSelector(FIND_FLIGHTS)).click();\nAssert.assertTrue(webDriver.findElements(By.cssSelector(FLIGHTS.ROW.ELEMENTS)).size\
    \ > 0);\n```\n列表 10.3: webDriver.java\n\n如果我们应用页面对象模式并重构同一个测试，我们将看到完全不同的画面：\n\n\
    ```java\n- homePage.open();\n- homePage.waitUntilPageLoaded();\n- Assert.assertEquals(homePage.getTitle(),\
    \ \"BlazeDemo\");\n- Assert.assertEquals(homePage.getTitle(), \"Welcome to the\
    \ Simple Travel Agency!\");\n- homePage.findFlights(\"Boston\", \"New York\");\n\
    - Assert.assertTrue(flightsPage.getFlights().size() > 0);\n```\n列表 10.4: homePage.java\n\
    \n你可以在项目中找到页面对象模式的测试示例，位于 `src/test/java/pageobject/FindFirstPageObject.java`。只需亲自尝试一下即可。\n\
    \n总结来说，页面对象带来了这些益处：\n- 通过提供页面和元素的交互，使你的测试更加清晰易于阅读\n- 组织代码结构\n- 避免重复（我们不应多次指定相同的定位器）\n\
    - 节省大量的维护时间\n\n如果你想让测试更简洁、更具可维护性，可以引入另一个高级别的抽象——步骤（steps）或关键词（keywords）。在不同的框架中，你可能会看到这些模块的不同名称，但原理是相同的。步骤（关键词）形成了可以在任何测试中使用的模块。一旦编写了这些步骤模块，你只需要在测试中对它们建立引用即可。\n\
    \n例如，如果我们创建一个与网站上航班搜索相关的模块，那么测试将如下：\n\n```java\n- flightsSearchSteps.openHomePage();\n\
    - flightsSearchSteps.verifyThatHomePageIsOpen();\n- flightsSearchSteps.verifyThatTitleAndHeadingIsCorrect();\n\
    - flightsSearchSteps.searchFlightsBetween(\"Boston\", \"New York\");\n- assertThat(flightsSearchSteps.foundFlights().size(),\
    \ greater(0));\n```\n列表 10.5: openHomePage.java\n\n"
