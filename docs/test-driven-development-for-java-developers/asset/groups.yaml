    7 </build>\n8  ...\n```\n\nListing 8.3: project.basedir.txt\n\nIf we changed the\
    \ project version or even the identifier our Dockerfile would still be valid.\n\
    \n# 9\n# INTEGRATION TESTS\n\nTo build this confidence, we must have a framework\
    \ for automatic regression testing. For doing regression testing, there are many\
    \ tests that should be carried out from an API-level point of view, but here we'll\
    \ cover two major types of tests.\n\n# Unit testing\n\nwhere any given test covers\
    \ the smallest unit of a program (a function or procedure). It may or not take\
    \ some input parameters and may or not return some values.\n\n# Integration testing\n\
    \nwhere individual units are tested together to check whether all the units interact\
    \ with each other as expected.\n\nIt is also important to keep unit and integration\
    \ tests separate, in particular, during compilation execution. Also, unit tests\
    \ must run after any code changes, during integration tests may run less often,\
    \ especially if they take much longer than unit tests. Typically, integration\
    \ tests are performed on the CI server.\n\nFinally, it usually doesn't make sense\
    \ to run integration tests if the unit tests fail - integration tests it should\
    \ also fail, since, if the individual components do not perform properly in isolation\
    \ and in a mocked environment, they are likely to fail if integrated together\
    \ and with external services.\n\nAs we will see in the examples in this chapter,\
    \ integration tests do not necessarily have to test the whole application: as\
    \ long as at least some real dependencies are used, we consider a test an integration\
    \ test.\n\nNote that we still use JUnit to write integration tests. The \"Unit\"\
    \ in the name is not meant for relegate JUnit to unit tests only.\n\nIntegration\
    \ tests, in addition to external components, should connect our components (e.g.\
    \ objects of our classes). Integration tests must be written after the individual\
    \ components involved in the file test have been fully tested, with unit tests.\
    \ Therefore, the individual components are known to function correctly in insulation\
    \ and are now being tested together. Integration tests are usually expected to\
    \ be successful right away, as they verify that the components already tested\
    \ still work together.\n\n# 9.0.1 Example\n\nTo get familiar with integration\
    \ testing, we'll implement some simple interacting classes together in a Model-View-Controller\
    \ (MVC) architecture.\n\nIn this chapter we do not implement the \"view\" part:\
    \ we will focus on the controller, which acts as a bridge between the view and\
    \ the data store of our model. We will implement the view in User interface test\
    \ chapter.\n\nAs done in the Mocking Chapter, Mockito Section: we use the Repository\
    \ pattern to access the database. In that chapter, we use Mockito and stubbing\
    \ its methods for unit tests. The only domain class is the Student class:\n\n\
    ```java\npackage com.examples.school.model;\n\npublic class Student {\n    private\
    \ String id;\n    private String name;\n\n    public Student() {}\n\n    public\
    \ Student(String id, String name) {\n        this.id = id;\n        this.name\
    \ = name;\n    }\n\n    // getters, setters, equals, hashCode, toString...\n}\n\
    ```\n\nThe repository interface is as follows:\n\n```java\npackage com.examples.school.repository;\n\
    \nimport java.util.List;\n\npublic interface StudentRepository {\n    List<Student>\
    \ findAll();\n    Student findById(String id);\n    void save(Student student);\n\
    \    void delete(String id);\n}\n```\n\nThe view interface is as follows:\n\n\
    ```java\npackage com.examples.school.view;\n\nimport java.util.List;\n\npublic\
    \ interface StudentView {\n    void showAllStudents(List<Student> students);\n\
    \    void showError(String message, Student student);\n    void studentAdded(Student\
    \ student);\n    void studentRemoved(Student student);\n}\n```\n\nFinally, we\
    \ have the following implementation of the controller:\n\n```java\npackage com.examples.school.controller;\n\
    \npublic class SchoolController {\n    private StudentView studentView;\n    private\
    \ StudentRepository studentRepository;\n\n    public SchoolController(StudentView\
    \ studentView, StudentRepository studentRepository) {\n        this.studentView\
    \ = studentView;\n        this.studentRepository = studentRepository;\n    }\n\
    \n    public void allStudents() {\n        studentView.showAllStudents(studentRepository.findAll());\n\
    \    }\n\n    public void newStudent(Student student) {\n        Student existingStudent\
    \ = studentRepository.findById(student.getId());\n        if (existingStudent\
    \ != null) {\n            studentView.showError(\"Already existing student with\
    \ id \" + student.getId(), existingStudent);\n        }\n        studentRepository.save(student);\n\
    \        studentView.studentAdded(student);\n    }\n\n    public void deleteStudent(Student\
    \ student) {\n        if (studentRepository.findById(student.getId()) == null)\
    \ {\n            studentView.showError(\"No existing student with id \" + student.getId(),\
    \ student);\n            return;\n        }\n        studentRepository.delete(student.getId());\n\
    \        studentView.studentRemoved(student);\n    }\n}\n```\n\nListing 9.4: SchoolController.java\n\
    \nThus, the controller processes user requests from the view by delegating database\
    \ operations (both read and write operations) and presents the results to the\
    \ user by delegating to the view.\n"
