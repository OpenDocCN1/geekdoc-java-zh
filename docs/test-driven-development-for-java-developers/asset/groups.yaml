    # 5.1.15 Run Maven from Eclipse


    The Eclipse plugin m2 also provides tools for running a Maven build directly from
    Eclipse. By default, a version of Maven embedded in the m2 plugin is used, thus
    you can run Maven builds from Eclipse without installing Maven in your system.
    This can be configured with the property Maven -> Installations, in case you want
    to use a Maven distribution installed in your system. The contextual menu Run
    As of a Maven project has many submenus for invoking Maven with some predefined
    goals. The submenu Maven build.. allows you to specify the phases or goals to
    execute, the profiles to activate and other configurations. Remember that this
    is an Eclipse run configuration, and, as such, once it can be stored in the project.


    # 5.2 MAVEN PACKAGING


    Each Maven project specifies the packaging in the pom.xml, which represents the
    final produced artifact from the project. This is also strictly related to the
    Maven lifecycles and also to the Maven plugins that are enabled by default (with
    the default settings) in the Maven project. We will now describe the main packaging
    types we will use in the book.


    # 5.2.1 Packaging “jar”


    The default, if not specified, is jar. This is explicit in the projects created
    starting from the archetype “simple Java project”. In fact, most of the time,
    from a Java project you want to create a JAR, e.g., with a library or with a complete
    application. Other examples of packaging types, which we will not use, are war
    or ear, intended for Java web applications.


    # 5.2.2 Packaging “pom”


    Besides “jar”, the only other packaging type we will use in this book is This
    kind of packaging is not meant to produce any (binary) artifact, but it is crucial
    for dealing with Maven modules, which we’ll describe in Section Parent and modules.


    In particular, a project of type pom can be used'
  - '[PAGE 107]


    # 5.2 MAVEN PACKAGING 108


    +   - for aggregating configurations, dependencies and plugins that are

    common to several projects;

    - for building together several sub-projects (Maven modules).


    Note that usually a project with type pom is used for both the above

    goals, but it is not strictly required: you can have two separate pom

    projects for the two goals.


    # 5.2.3 Parent and modules


    Each pom can specify a Parent POM: all the configurations of the

    parent POM will be inherited, similarly to what happens with Java class

    inheritance.


    The parent POM is specified as follows:


    ```

    1 <parent>

    2 <groupId>...</groupId>

    3 <artifactId>...</artifactId>

    4 <version>...</version>

    5 <relativePath>../pom.xml</relativePath> <!-- optional -->

    6 </parent>

    ```


    As usual the GAV coordinates must be specified. By default, the parent\POM is
    looked up in the physical parent directory of the current project.

    In such a case, the <relativePath> needs not be specified. Otherwise, the

    full path to the parent''s pom.xml file must be specified, e.g.,


    ```

    1 <parent>

    2 <groupId>...</groupId>

    3 <artifactId>...</artifactId>

    4 <version>...</version>

    5 <relativePath>../pom.xml</relativePath>

    6 </parent>

    ```


    If the current project''s groupId and version are the same as the one of

    the parent, then they can be omitted. For example, instead of One can

    simply write:'
  - '[PAGE 108]


    # 5.2 MAVEN PACKAGING 109


    ```

    1 <parent>

    2 <groupId>com.mycompany.app</groupId>

    3 <artifactId>my-app-parent</artifactId>

    4 <version>1.0.0-SNAPSHOT</version>

    5 </parent>

    6 <groupId>com.mycompany.app</groupId>

    7 <artifactId>my-app</artifactId>

    8 <version>1.0.0-SNAPSHOT</version>

    ```


    ```

    1 <parent>

    2 <groupId>com.mycompany.app</groupId>

    3 <artifactId>my-app-parent</artifactId>

    4 <version>1.0.0-SNAPSHOT</version>

    5 </parent>

    6 <artifactId>my-app</artifactId>

    ```


    Even if no parent pom is specified, POMs implicitly inherit from the Super POM,
    which is part of the current Maven installation (similarly to the Class Object
    in Java).


    Code modularity is known to be an important characteristic aiming at easy maintainability
    and high code reuse. It is also important to have a modular structure of the files
    and folders of an application as well. We can split the code of an application
    in separate projects with a few dependency relations among them we can maintain
    them easily and only in other applications we can reuse, by adding a dependency,
    only the projects that we actually need, instead of the whole application. However,
    we would like to avoid repeating common configurations in all the POMs of the
    projects, by reusing common configurations just like we do, for example, with
    class inheritance in Java.


    It is common practice to have several Maven modules, each representing a Maven
    project, that have in common the configuration of a Parent pom.


    # 5.2.4 Create a parent project and a module project


    We will now create a parent project and two module projects. For simplicity, the
    module projects will be in two subfolders of the parent folder.'
