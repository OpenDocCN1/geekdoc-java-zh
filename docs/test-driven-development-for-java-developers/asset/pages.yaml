    # 10.2 CONSIDER USING A BDD FRAMEWORK


    BDD is a software development methodology in which software is implemented in
    the way its behavior is described. BDD can be applied for any type of testing
    including unit tests, component, integration as well as for many other types.
    UI testing is one of the main areas where BDD can be applied with a great success.
    BDD is recommended for UI Automation, for many reasons.


    First of all, BDD is a methodology that helps teams understand each other, creating
    strong outside and inside team collaboration. By writing your tests with BDD you
    also create specifications that can help your team understand tests and requirements
    much better. This means along with writing your tests, you are creating clear
    tests documentation. This ensures you don''t waste team members'' time (who might
    work on your tests later), as well as your own time, because you don''t need to
    explain and help with such tests if they are unclear.


    Second, BDD helps the Business side (e.g.Test and Project managers) understand
    these tests. This brings additional value to testing because they can make recommendations
    based on business benefits.


    Third, BDD usually forces you to follow a strict code organization pattern, which
