  md: '10.2 CONSIDER USING A BDD FRAMEWORK 187


    Listing 10.2: someTest.java


    A design pattern is a reusable solution for a common problem in software design.
    We can say that each pattern is a particular example of a specific solution for
    a specific problem, regardless of the programming language or paradigm. Complementing
    design patterns, we have design principles. Design principles provide you with
    guidelines or rules that you need to follow for constructing well built and maintainable
    software. While patterns apply for specific issues, design principles apply regardless
    of context.


    How is this relevant to UI Automation testing? As discussed before, UI testing
    is a hard and treacherous road full of different holes. But I have good news for
    you. You are not the first driver to travel this road. That''s why there are many
    holes and no one has ever passed through you. You can think of design patterns
    and principles as powerful navigators. One tells you how to drive safely in general
    (design principle), while another gives clear instructions about how to handle
    each specific hole if it got in your way (design pattern).


    In this section, I want to talk about two patterns: The Page Objects pattern,
    which has become the most popular UI automation pattern among test automation
    engineers, and the Screen pattern, which organizes the Page Objects pattern and
    improves it.


    The concept of the Page Objects pattern was introduced almost 10 years ago. Its
    purpose was to make UI automation tests consistent, to avoid code duplication,
    to improve readability and organize code for pages interaction. During web tests
    creation you always need to interact with web pages and web elements (buttons,
    input elements, images, etc.). The Page Objects pattern takes this requirement
    and applies object oriented programming principles on top of this, enforcing you
    to interact with all pages and elements as objects.


    For example, if you need to click on a button, you don''t need to care about how
    to retrieve this button in the test, as it will already be handled in page objects.
    You should have the object of the page you are looking for and it should already
    contain the object of the button you are looking for inside it. All you need is
    to use a reference to this button object and apply the “click” action on it. You
    can think about all pages and web elements like this:'
