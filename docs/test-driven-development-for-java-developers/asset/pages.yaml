  md: '# 10


    GRAPHICAL USER INTERFACE TESTING


    In software engineering, graphical user interface testing is the process of testing
    a product’s graphical user interface to ensure it meets its specifications. This
    is normally done through the use of a variety of test cases.


    # 10.1 WHAT DO YOU CHECK-IN GUI TESTING?


    The following checklist will ensure detailed GUI Testing in Software Testing.


    +   - Check all the GUI elements for size, position, width, length, and acceptance
    of characters or numbers. For instance, you must be able to provide inputs to
    the input fields.

    - Check you can execute the intended functionality of the application using the
    GUI

    - Check Error Messages are displayed correctly

    - Check for Clear demarcation of different sections on screen

    - Check Font used in an application is readable

    - Check the alignment of the text is proper

    - Check the Color of the font and warning messages is aesthetically pleasing

    - Check that the images have good clarity

    - Check that the images are properly aligned

    - Check the positioning of GUI elements for different screen resolution.'
