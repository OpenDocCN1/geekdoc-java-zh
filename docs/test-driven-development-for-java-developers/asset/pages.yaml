  md: '# 3


    PART 1


    # 3.1 CYCLE: RED-GREEN-REFACTOR


    # Red Phase:


    In TDD, the development of a new feature always begins with writing an automatic
    test to validate that feature, i.e. to check if the software exposes it. Since
    the implementation does not yet exist, writing the test is a creative task, since
    the programmer must determine in what form the functionality will be exposed by
    the software, and understand and define its details. For the test to be complete,
    it must be executable, and when it is performed, produce a negative result.


    # Green phase:


    In this stage, the programmer must write the minimum amount of code needed to
    pass the test that fails. Written code is not required to be of good quality,
    elegant, or general; the only explicit goal is for it to work, that is, pass the
    test. In fact, it is explicitly forbidden by the practice of TDD to develop parts
    of code not strictly aimed at passing the test that fails. When the code is ready,
    the programmer again launches all available tests on the modified software (not
    just the one that previously failed). By this way, the programmer can immediately
    realize if the new implementation caused pre-existing test failures, i.e caused
    regression in the code. The green phase ends when all tests are " green" (i.e.
    they are passed successfully).


    # Refactor (gray phase):


    When the software passes all the tests, the programmer devotes a certain amount
    of time to refactoring it, that is to improve its structure through a procedure
    based on small controlled modifications aimed at eliminating or reducing objectively
    recognizable defects in the internal structure of the code. Typical examples of
    refactoring actions include'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'choosing more expressive identifiers, eliminating duplicate code, simplifying,
    and streamlining the source architecture.


    In general, we could summarize:


    Red:


    Write a test and

    Make sure it fails


    Green:

    Write only enough code to make the test succeed


    Refactor:

    In case, refactor the code to make it clean.

    Re-execute all the tests to make sure they still succeed.


    # 3.2 BLACK-BOX TESTING AND WHITE-BOX TESTING:


    Within the automated testing world there are two predominant testing methodologies:
    black-box and white-box.


    # 3.2.1 White-box Testing:


    The white box approach is based on the premise of testing a product knowing how
    it is done and having access to the code. This type of approach is generally pursued
    by developers because they know the code. Such tests would be better if they were
    performed by industry experts or at least by the same person who developed the
    code. This is because who test what he has produced is less likely to find problems
    regarding the code that he himself has created. The advantage of this approach
    is that you can do tests (unit tests) much targeted than the other approaches
    and therefore could lead to detect problems that could hardly be found otherwise.
    Examples of this approach are techniques based on covering paths, decisions, conditions,
    etc.


    # 3.2.2 Black-box Testing:


    The black box approach is what is generally used by testers. It is based on the
    assumption of not knowing how the functionality is realized, only interested in
    what it does, so the point of view is (almost) the same as'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'the end user focusing on what the system does and the requirements provided
    by the specifications. The disadvantage of this approach is that it often leads
    to a coverage of all scenarios rather poor so bugs could be left latent that could,
    then, detected because of later developments. Examples of this approach are only
    partitioning techniques, limit value analysis, cause and effect tables, the exploration
    test, the error guessing test, the state diagram, etc.


    # 3.2.3 The grey box :


    approach is an intermediate approach, in practice you know broadly how the functionality
    was implemented and the data structures used. In this way you can perform more
    targeted tests than the black box approach, obviously not knowing the whole code
    the tests will be less effective than the white box technique.


    # 3.3 JUNIT:


    In Computer Science JUnit is a unit testing framework for the Java programming
    language. The experience with JUnit has been important in the growth of the idea
    of Test-Driven Development and is one of a family of unit testing Framework known
    collectively as xUnit.


    The framework is currently at version 5, which is organized into 3 subprojects
    / modules and needs java version 8 or newer. Version 4 brought structural changes
    compared to Version 3, with which it is incompatible. The classes that make up
    the framework belong to different packages for versions 3 and 4; junit.framework
    up to 3.8, org.junit from 4.


    +   Each test is represented by a public method annotated with @Test.


    +   Each test method verify a single scenario – Using a part of the SUT (e.g.,
    calling a method on the SUT class).


    +   Verification consists in checking that the output (or outcome) is as expected.


    # 4 stages:


    +   Setup: prepare the context for testing the SUT:


    +   Creates an instance of the SUT (this instance is usually called “fixture”).'
