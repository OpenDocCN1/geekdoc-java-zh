    # 5.1.2 Import a Maven project in Eclipse


    A Maven project is configured in the pom.xml file. Obviously there is no trace
    of Eclipse project metadata, therefore Eclipse cannot directly open a Maven project
    of this type. However, thanks to the M2E plugin, Eclipse is able to import the
    Maven project and automatically derive your own project metadata. ccc


    Select File -> Import -> Maven -> Existing Maven Projects and specify the root
    path of the file project created through the above archetype. The specified path
    can also contain Maven projects and Eclipse can import them all. Once the root
    path is specified, the detected projects are displayed for selection. Make sure
    the one we created is selected and hit ''Finish''.


    Once the import terminates, Eclipse will have the project metadata .project and
    .classpath, together with the directory .settings with some settings for the Java
    compiler and the encoding of the resources. All these files are derived from the
    pom.xml file.


    Since this is probably the first time you are using Maven, you will note also
    that some JARs are downloaded from the Internet after the project has been imported.
    We''ll get back to that later. Note that the name of the Eclipse project, by default,
    will be the same as the artifactId specified when creating the project through
    the archetype..


