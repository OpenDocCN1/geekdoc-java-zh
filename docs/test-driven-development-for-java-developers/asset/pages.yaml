  md: '# 6


    # CONTINUOUS INTEGRATION


    Continuous Integration in the world of modern software development is an increasingly
    widespread and practiced practice, which reduces the possibility of bugs and favors
    the correct integration of the components developed by many programmers, especially
    in very large software projects.


    The typical workflow of the CI process can be summarized as follows: Continuous
    integration, abbreviated to CI, is a software development practice that consists
    to integrate all changes into the entire application or project continuously,
    multiple times a day. This integration is meant to be built automatically, verifying
    that the compilation is successful, and fully tested, running all application
    tests. If a bug is introduced in the application by a single component, this is
    detected at the very first integration of that component into the application.
    Obviously, CI is based on an autofill mechanism (like Maven, Chapter Maven) to
    perform all his duties. Also, a version control system is required (like Git,
    Chapter Git) to store the entire application code base. Finally, the compilation
    process is delegated to a dedicated server, called Continuous Integration server
    (CI server).


    +   1. A change is pushed to a remote VCS repository;

    2. The push notifies the CI server, which fetches the pushed changes into its
    repository, builds the whole application and runs all the tests;

    3. The CI server notifies the developer(s) about the result of the build and of
    the tests.


    While a full integration build can take several minutes, developers can keep working
    while the server is building. Periodically, the developers check the results provided
    by the CI server and, in the event of a particular build failure, breaking changes
    of the corresponding commit it can be analyzed and corrected.'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'In addition to building and running tests, a CI build process typically performs
    additional checks code, such as creating a code coverage report and performing
    further code analysis with the code quality tools (see Chapter quality). Again,
    these additional steps are generally skipped when developing, as they take time.
    These are delegated to the CI server and will be part of its reports. These reports
    are usually stored in a database and provided to developers via some websites
    pages. The history of these reports will then be kept in order to have some statistics
    on the project relationships.


    In this book we implement the CI process


    # GitHub


    as the Git repository host (see Chapter Git, Section GitHub)


    # Travis CI


    (https://travis-ci.com/) as the CI server, which will use Maven to build and test
    our projects. By default, Travis provides a available Linux distributions and
    which one can be found on the Travis web site); as we will see in this chapter,
    we can also build the projects on Travis on a macOS.


    # Coveralls


    (https://coveralls.io/) to store code coverage history and statistics .


    # SonarCloud


    (https://sonarcloud.io/) to perform code quality analysis (this will be described
    in a separate chapter, Chapter Code Quality)


    All of these tools are freely available for public open source projects. Plus,
    they''re all set up to be interoperable. It''s just a matter of creating free
    accounts on these services and linking them to implement the CI process:


    +   * We push to our Git repository on GitHub;

    * This triggers a build on Travis CI;

    * The project is completed;

    * Tests run with code coverage;

    * The result of the code coverage is sent to Tute;

    * Code quality analysis is performed on SonarCloud;

    * The results of all remote services are sent back to GitHub and will be used
    to annotate the file commit and possibly the PR with those results (including
    failures).'
