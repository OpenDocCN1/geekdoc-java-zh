  md: '# 9


    # INTEGRATION TESTS


    To build this confidence, we must have a framework for automatic regression testing.
    For doing regression testing, there are many tests that should be carried out
    from an API-level point of view, but here we''ll cover two major types of tests.


    # Unit testing


    where any given test covers the smallest unit of a program (a function or procedure).
    It may or not take some input parameters and may or not return some values.


    # Integration testing


    where individual units are tested together to check whether all the units interact
    with each other as expected.


    It is also important to keep unit and integration tests separate, in particular,
    during compilation execution. Also, unit tests must run after any code changes,
    during integration tests may run less often, especially if they take much longer
    than unit tests. Typically, integration tests are performed on the CI server.


    Finally, it usually doesn''t make sense to run integration tests if the unit tests
    fail - integration tests it should also fail, since, if the individual components
    do not perform properly in isolation and in a mocked environment, they are likely
    to fail if integrated together and with external services.


    As we will see in the examples in this chapter, integration tests do not necessarily
    have to test the whole application: as long as at least some real dependencies
    are used, we consider a test a integration test.


    Note that we still use JUnit to write integration tests. The "Unit" in the name
    is not meant for relegate JUnit to unit tests only.'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'Integration tests, in addition to external components, should connect our components
    (e.g. objects of our classes). Integration tests must be written after the individual
    components involved in the file test have been fully tested, with unit tests.
    Therefore, the individual components are known to function correctly in insulation
    and are now being tested together. Integration tests are usually expected to be
    successful right away, as they verify that the components already tested still
    work together.


