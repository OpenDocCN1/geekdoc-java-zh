  md: "# 12.3 KEY CONCEPTS IN STATIC CODE ANALYSIS\n\nEverything right from minor\
    \ styling details to critical design errors, are inspected and evaluated by SonarQube,\
    \ thereby enabling developers to access and track code analysis continuously,\
    \ ranging from styling errors, potential bugs, and code defects to design inefficiencies,\
    \ code duplication, lack of test coverage, and excess complexity.\n\nThe Sonar\
    \ platform analyzes source code from different aspects and drills down to your\
    \ code layer by layer, moving from the module level down to the class level, giving\
    \ metric values and statistics, revealing issues in the source code at each level,\
    \ that needs to be addressed.\n\nYour project home page tells you where you stand\
