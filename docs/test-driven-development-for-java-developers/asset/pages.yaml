    \nDefining a property also implicitly overrides the possibly pre-existing property\
    \ defined with the same key. Many Maven plugins pick properties defined in the\
    \ POM or default to some values for such properties. If you know a plugin picks\
    \ with a given key, then specifying a value for property in the <properties> section\
    \ results in configuring the plugin behavior.\n\nAs we did in Java settings, knowing\
    \ in advance that the Maven compiler honors the properties <maven.compiler.source>\
    \ and <maven.compiler.target> we can configure the compilation level by providing\
    \ values for those properties. Typically, a Maven plugin can be configured by\
    \ specifying values for some of its parameters. If the value for an optional parameter\
    \ is not specified, then the default value is assumed for that parameter. However,\
    \ if for a parameter a user property is taken into consideration, then user property\
    \ has the precedence. For example, for the Maven compiler plugin, <maven.compiler.source>\
