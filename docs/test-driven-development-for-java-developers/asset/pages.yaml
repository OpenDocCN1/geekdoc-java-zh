    What is the explicit wait then? The explicit wait is designed for needs when certain
    web element or action takes a much longer time to load than the rest. If your
    application works in a way that it takes a long time to start (7-8 seconds) but
    after that it works very fast! There is no sense to specify the implicit wait
    as 10 or even 15 seconds because only you have a slow application loading. For
    this, you can use the explicit wait, which waits for a certain condition for a
    specified amount of time.


    Here is how we rewrite our previous example by using the idea of the explicit
    wait:


    ```

    uri.openHomePage();

    withTimeout(15, TimeUnit.SECONDS).waitFor(MAIN_HEADING_LABEL);

    uri.verifyThatTitleAndTextIsCorrect());

    ```


    In this case, we also do not waste any time and the script execution will continue
    immediately after the expected element will be found.


    Clear right? Not as clear you might think... the official Selenium website displays
    this very important note:


    You can use this article as well as this to learn why it is better and enough
    to use ONLY explicit waits.


