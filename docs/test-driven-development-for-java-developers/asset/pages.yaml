  md: '# 13


    # JAVA PROJECT USING TEST DRIVEN DEVELOPMENT


    The following report describes the various stages that make up the development
    of a small Java project and it has Login System using web application, which manages
    login system for a user. The application was developed through the use of TDD
    techniques (a development model of software that provides the drafting of automatic
    tests takes place before that of software that must be tested). Here we focus
    on Build Automation. In general, techniques and the technologies illustrated in
    Test-Driven Development, Build Automation, Continuous Integration.


    The main purpose of this project is to store login data of a user in database
    and retrieve those data. The project version 1.0 is stored in GitHub repository
    and able to access publicly. The language uses here is Java and Spring boot technology.
    Additionally, Docker tool used to design to make it easier to create, deploy,
    and run applications by using containers. Docker is integrated with travis-ci.
    As a database I use the document-based MongoDB for this application. This project
    can be useful for any company to login to their service. This project successfully
    tested and able to use in different platforms.


    Project source code: https://github.com/JosephThachilGeorge/TDD'
