  md: 'SonarQube enables organization to estimate and predict project risks as there
    is a centralized system of storing the code metrics. It simplifies deployment
    and helps monitor the project status.


    # Shared rulesets


    SonarQube provides the facility to create your own quality profiles and define
    Sonar Rules shareable across different projects.


    # Quality Gates


    Quality Gates are a powerful feature by SonarQube.


    They are a combination of threshold measures set on your project.


    A quality gate is the best way to enforce a quality policy in your company.


    They are basically a set of conditions that the project must meet before it can
    be delivered to production.


    You can define as many quality gates as you wish to, depending on the project
    need.


    Each Quality Gate condition is typically a combination of:


    measure


    +   1. period: Value (to date) or New Code (differential value over the New Code
    period)

    2. comparison operator

    3. warning value (optional)

    4. error value (optional)


    For instance, a condition might be:


    +   1. measure: Blocker issue

    2. period: Value

    3.comparison operator: >

    4. error value: o


    All projects may not be verified against the same quality gate, as it’s not practical
    that the threshold measures would be the same for all projects.


    To manage Quality Gates, go to Quality Gates (top menu bar) in sonarqube. Quality
    Gates are defined and managed in the Quality Gates page found in the top menu.
    If your project passes the Quality Gate, this is how it will be displayed.'
