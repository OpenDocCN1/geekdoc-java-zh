    +   - Suppose we have in our SUT this line

    if (a && b) {...}

    - A "mutant" consists of the mutated line

    if (a || b) {...}

    - If at least one test fails, then we say "the mutant was killed"

    Otherwise, "the mutant survived"

    - And that is bad!

    - If our tests effectively test the overall behaviour of the SUT then all mutants
    must be killed!


    Automatic tools:


    +   - They create mutants on the fly

    - For each mutant they run all the tests

    - And report mutated mutants

    - The creation of mutants is based on a set of mutation operators, e.g.,n- Change
    to =

    - Change >= to =

    - Change == to !

    - Set an initialized field to null

    - These mutants aim at spotting typical programming errors.


    To convince you of the power of mutation tests I will show you a simple example
    in java with unit tests written using the junit framework. Suppose we need to
    implement a very simple class that validates a password entered by the user. The
    specification is very simple:

    null or empty string is not accepted as possible password .

    The password must be at least 3 characters long.

    Below is a simple java implementation of the described algorithm.

    We also propose the PasswordValidator test class.


    After introducing the mutation, all tests are launched, and the result is observed.
    Tests on a mutation must fail (i.e. at least 1 Test in our suite must fail). If
    the test does not fail, it says the mutant survived or the mutant was killed.
    The higher percentage of mutants killed, the more'
