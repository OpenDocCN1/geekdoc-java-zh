    additional error message since, in case of failure, JUnit automatically reports
    the expected and the actual value. On the contrary, if you directly provide a
    boolean expression, e.g., with assertTrue, it might be useful to provide a better
    failure message than the default error message, which only states that the assertion
    failed.


    If an assertion fails, the test terminates with a failure. If an exception is
    thrown during the test, the test terminates with an error. Otherwise it succeeds.


    In general, each unit test should test only a single behavior of the SUT. Recall
    that you have several assertions in a test method, if one fails, the test method
    terminates immediately, and subsequent assertions are not executed. However, in
    some cases in order to verify a single behavior several assertions must be written
    in the same test method. Summarizing, a single test method should exercise and
    verify a single scenario and behavior, but to do that, it is allowed to write
    several assertions.


    JUnit follows the all or nothing philosophy: if a single assertion fails in a
    test method, the method fails, the whole test case fails, and if the test case
    is part of a test suite (that is, we run several cases in the same run), then
    the whole test is marked with a failure.


    JUnit provides additional method annotations for the setup and teardown phases,
    which are useful when these phases have a behavior common to all tests.


    The following annotations must be used with public static void methods:


    @BeforeClass The annotated method is executed only once before any of the test
    methods in the class is run


    @AfterClass The annotated method is executed only once after all the tests in
    the class have run


