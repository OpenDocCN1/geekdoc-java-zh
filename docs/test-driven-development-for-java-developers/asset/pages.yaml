    # 5.3-4 Plugin management


    The <pluginManagement> section in the <build> section has the same aim as the
    <dependencyManagement> section (see Section Dependency management) but for plugins.


    This is even more useful for plugins since Maven will still merge the configurations
    inherited from a parent POM (including the super POM) and the ones of the current
    POM, taking into consideration both the ones in <pluginManagement> and the ones
    in <plugins>.


    In Section Configuring the Maven compiler plugin we saw how to configure the Java
    compilation level directly in the maven-compiler-plugin. We can do that in <pluginManagement>:


    ```

    1 <build>

    2   <pluginManagement>

    3     <plugins>

    4       <plugin>

    5         <artifactId>maven-compiler-plugin</artifactId>

    6       <configuration>

    7         <source>1.8</source>

    8         <target>1.8</target>

    9       </configuration>

    10    </plugin>

    11  </plugins>

    12  </pluginManagement>

    13 </build>

    ```


    Note that in this case we don’t even need to specify the version of the plugin,
    since that is taken automatically after merging the inherited configuration of
    the plugin.'
