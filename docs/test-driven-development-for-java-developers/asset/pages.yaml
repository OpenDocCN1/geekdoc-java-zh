  md: '# 3.6 REFACTORING UNIT TESTS:


    One of the great things about unit tests is that they allow you to refactor and
    restructure your code in safety, because you get immediate feedback when you break
    it. Because you constantly (and do) refactor your code, it is simpler, more modular,
    and easier to extend and maintain. But what about the tests themselves? Over time,
    you will develop a testing codebase that may be larger than the mainline code.


    After refactoring, your tests will better convey exactly what you are trying to
    test. There is a hidden prize, however: in many cases you discover or create methods
    that can be reused. For example, an assertion that uses XPath to verify the contents
    of a generated XML document. When you find such code, pull it out into a “testing
    library,” available for your next project.


    # 3.7 CODE COVERAGE:


    In computer science, code coverage is a measure used to describe the degree to
    which the source code of a program is executed when a particular test suite runs.
    A program with high code coverage, measured as a percentage, has more of its source
    code executed during testing which suggests it has a lower chance of containing
    undetected software bugs compared to a program with low code coverage.


    There are a few tools for computing code coverage. In Java the most used is JaCoCo
    (Java Code Coverage), http://www.eclemma.org/jacoco/.


    The tool executes a Java application and provides a report with all the lines
    of code executed during the application. If there are branch instructions, if
    an then else, it also says if all branches are executed during the application.
    If the application we run is a test suite we get the parts of our application
    that are executed during the tests. If the tests are written correctly, this will
    tell you which parts of the applications are tested.


    The JaCoCo plug-in for Eclipse is EclEmma: http://www.eclemma.org/


    Use the update site http://update.eclemma.org/ and install “EclEmma Java Code
    Coverage”. Since version 3, EclEmma is an official Eclipse project so it is available
    also from the main Eclipse update site.'
