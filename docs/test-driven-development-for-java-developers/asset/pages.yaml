    End To End Testing is a software testing method that validates entire software
    from starting to the end along with its integration with external interfaces.
    The purpose of end-to-end testing is testing whole software for dependencies,
    data integrity and communication with other systems, interfaces and databases
    to exercise complete production like scenario.


    Along with the software system, it also validates batch/data processing from other
    upstream/downstream systems. Hence, the name "End-to-End" is usually executed
    after functional and System Testing. It uses actual production like data and test
    environment to simulate real-time settings. End-to-End Testing is also called
    Chain Testing.


