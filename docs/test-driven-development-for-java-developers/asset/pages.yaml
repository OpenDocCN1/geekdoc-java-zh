    # 5.4 MAVEN PROFILES


    Maven profiles are a mechanism that allows you to activate a subset of configurations
    (including properties, dependencies, plugins and even modules) according to some
    criteria.


    Profiles are defined in the section <profiles>, each one in a <profile> element.
    Each profile is given an <id> and, as hinted above, can define properties, dependencies,
    plugins and even modules. The parts defined in the profile are active during the
    build (and in dependency resolution) only when the profile is active.


    When profiles are activated their contents are merged into the “Effective POM”,
    following the definition order. Otherwise, the content of an inactive profile
    is simply ignored. Any profile can be explicitly activated on the command line
    with the option -P, specifying its id. In Eclipse, in the Maven build run configuration,
    there is a field, “Profiles”, where the ids of profiles to be activated can be
    listed.


    Moreover, a profile can be activated automatically by its element <activation>.
    For the complete reference of the <activation> element, we refer to https://maven.apache.org/guides/introduction/introduction-to-profiles.html.


    A few activation policies are useful when the project is meant to be built in
    different execution environments.


    This activation rule is based on the current Java version, e.g., for JDK 9 or
    newer'
