  md: '# 4-1 JUNIT: 28


    consisting of the SUT instance and of possible other related objects needed during
    the tests, is usually called test fixture. A test fixture is all the things that
    must be in place to order the SUT. It is a fixed state of a set of objects used
    as a baseline for running tests (https://github.com/junit-team/junit/wiki/test-fixtures).
    The test fixture must ensure there is a well-known and fixed environment in which
    tests are run. Thus, the test fixture, when setup correctly, ensures that test
    results are repeatable.


    +   2. Exercise → In this phase we interact with the SUT (e.g., by calling an
    instance method), possibly getting a result from it or generating some side effect
    in other instances.


    +   3. Verify → In this phase we verify that the outcome actually matches the
    expected behavior, typically using some assertions. This could consist in checking
    that the returned value of the SUT invoked method is as expected. Alternatively,
    we verify that the side effects of the invoked method are as expected, by performing
    assertions on the changed state of the fixture. These 3 phases are also known
    in the literature as Arrange, Assert (Becoa), or typically using the BDD style,
    Given, When, Then. There’s a fourth phase, which is usually not strictly required,
    depending on the testing context:


    +   4. Teardown → In this phase we cleanup the environment, bringing it back to
    the condition it used to be before the execution of the test. For example, if
    we created a few files, we should remove them in this phase.


    In JUnit, a test case is a standard Java class, which does not have to inherit
