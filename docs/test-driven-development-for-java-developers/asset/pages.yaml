  md: '# 5


    # PART 3


    # 5.1 MAVEN:


    So far we have always used Eclipse to compile and run tests. We also used Eclipse
    for manage the dependencies of the project by modifying the project classpath.


    When we needed additional libraries (i.e. JARs) we turned to Eclipse. If the library
    is part of Eclipse itself, like JUnit, is quite simple. Otherwise we had to manually
    download the JARs from the Internet and add them to our projects in Eclipse by
    setting the classpath as well. Adding JAR to the file classpath is easy with Eclipse
    anyway. The most difficult problem with the JAR download process deals with transitive
    dependencies, that is, addictions of dependencies (recursive).


    Dealing with transitive addictions could become a nightmare, as we need to be
    fixed manually. First you need to know the external JARs needed by the libraries
    you want to use. Then, you have to download them too, until dependencies are resolved
    and available in your file project.


    So far we have been lucky as external JARs had no further dependencies (or they
    did, these were part of the JAR). In any case, this manual approach requires some
    effort. Remember that for Log4j we had to download a zip file, unzip the file
    and then only the JARs we actually have necessary.


    We have chosen to add the JARs directly into the project itself. When working
    on a team, the fact that external libraries are part of the project relieves other
    developers from doing all of the above manual steps repeatedly each time they
    want to set up the development environment. However, Having external libraries
    as part of your code base is also not ideal.'
