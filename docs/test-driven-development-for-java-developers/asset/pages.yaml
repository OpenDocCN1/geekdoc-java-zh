    \ However, we configure the plugin once and for all in the <pluginManagement>,\
    \ by specifying the classes to mutate (targetClasses), the tests to run with the\
    \ mutators (targetTests) and many additional parameters, like the mutators to\
    \ apply. See http://pitest.org/quickstart/maven/ for more information about the\
    \ plugin configuration. As we anticipated in Chapter Mutation Testing, Section\
    \ Narrowing mutations, the PIT Maven plugin allows us to exploit the advanced\
    \ configuration features of PIT itself for narrowing the mutation testing procedure\
    \ during a Maven build.\n\nFor the Maven bank-example we could configure the plugin\
    \ as follows:\n\n```\n<build>\n  <pluginManagement>\n    <plugins>\n    ...\n\
    \    <plugin>\n      <groupId>org.pitest</groupId>\n      <artifactId>pitest-maven</artifactId>\n\
    \      <version>1.4.10</version>\n      <configuration>\n        <targetClasses>\n\
    \          <!-- excludes testing.example.bank.Main *-->\n        </targetClasses>\n\
    \        <mutators>\n          <param>testing.example.bank.*</param>\n       \
    \   <mutator>DEFAULTS</mutator>\n        </mutators>\n        <mutationThreshold>80</mutationThreshold>\n\
    \      </configuration>\n    </plugin>\n</build>\n```\n\nWe specify the pattern\
    \ for the classes to mutate (excluding the Main class, which has no test) and\
    \ the pattern for the tests to execute. Moreover, we enable only the default mutators.\
    \ Finally, by using <mutationThreshold> we specify the threshold for killed mutations.\
    \ This represents the percentage of mutants that must be killed in order to get\
    \ a successful build. If the pattern is below the threshold, the Maven build will\
    \ fail."
