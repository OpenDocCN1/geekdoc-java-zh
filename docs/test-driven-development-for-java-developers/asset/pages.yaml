    # 4.1 JUNIT:


    In this chapter we get familiar with the main testing framework that we use throughout
    the book, JUnit, which is the most popular testing framework for Java developers.
    As mentioned in Chapter Testing, The "Unit" in "Unit" is definitely misleading;
    JUnit is not only for unit tests. In this book, we use JUnit 4, https://junit.org/junit4/,
