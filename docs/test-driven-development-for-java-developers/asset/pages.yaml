    In this chapter, we will not apply TDD. Thus, we will write the tests after writing
    the code to test. In this chapter we give an introduction to JUnit. Moreover,
    we start to see how to structure projects, separating tests from production code.
    We also see a few additional testing frameworks for enhancing the use of JUnit,
    especially the assertion API.


    Moreover, we also show a few best practices in writing tests and some strategies
    that instead should be avoided.


    # 4.1.1 Structure


    The typical structure of a test consists of the following 3 main phases.


    +   1. Setup -> In this phase we create the environment for the test. In unit
    tests, this usually corresponds to creating the SUT (Software Under Test) and
    in Java, this usually corresponds to creating an instance of the class to test.
    This phase establishes the state of the SUT prior to any test activities. The
