  md: '# 4.2 EXAMPLE


    @Before The annotated method is executed before each individual test method


    @After The annotated method is executed after each individual test method, even
    in case of failure or error


    The lifecycle of JUnit tests can be represented as in the following figure.


    ![](img/259250058ab8da9c293dfc86b5ff65c5_29_0.png)


    JUnit only takes annotations into consideration during the test lifecycle. However,
    it is best practice to give annotated methods a very meaningful way. This is especially
    crucial for test methods: their names should describe what the test is trying
    to verify.


    Each test method must execute independently from other test methods. This means
    that a test method must never rely on possible side effects of other methods.
    In the fact, the setup and teardown phases are meant to make each test independent
    from each other. Moreover, JUnit does not guarantee that test methods are executed
    in a predefined order. Finally, JUnit does not necessarily reuse the same instance
    of the test case class for running all its methods. Thus, the state of the test
    case class, that is, its fields, should never be treated as an object state in
    standard programs.


