    into more detail in the report in order to learn more about the surviving mutant


    The detail of the analysis performed by PIT during the mutation test is fantastic:


    +   - shows us the types of mutations on the mutants.


    +   - shows us the tests performed on the mutants.


    +   - shows us in red the line changed during the mutation test and that did not
    fail the tests. It also highlights the type of mutation of the surviving mutant
    in red. In our example, the surviving mutant was born from a mutation of the condition
    that controls the length of the password. By introducing a decision mutation on
    the password length check (replacing the equal greater with the narrow greater)
    our tests do not fail and therefore the mutant survives.


    From these reports it can be deduced that the tests are not robust and a big bug
    on this condition may not be detected by our unit tests (already understood this
    at the beginning of the article when we tried to insert the bug on this condition).
    How can we fix this gap in our tests? Let''s go and strengthen our suite. As is
    known in the theoretical studies of tests, when you go to write unit tests on
    a property that is valid within two extremes, the following test scenarios must
    be provided:


    +   - test case in which the property is outside the permitted extremes.

    - in the event that you have the property within the permitted limits.'
