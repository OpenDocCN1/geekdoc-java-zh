    # 5.1.9 Resources


    We have already seen the concept of a Java resource in Chapter JUnit. For example,
    the configuration file log4j2.xml, placed in the root of the src source folder,
    is a resource of our application, that is, some data is needed by our application
    to run and can be accessed by the application. Resources must be available at
    runtime in the classpath.


    In that chapter, we directly put the resource file log4j2.xml in the src source
    folder. Eclipse automatically copies any data file (that, is, are not Java sources)
    in the output folder of the source folder. We also had another resource file log4j2.xml
    in the tests source folder, used by tests. The test resource has the precedence
    over the homonymous file in the src directory.


    Maven fosters the separation of source Java files from resource files, both for
    the main code and for the test code. By default main resources should be placed
    in the directory src/main/resources and test resources should be placed in the
    directory src/test/resources. A Maven Java project''s POM is implicitly configured
    with such directories; if they are not present they are ignored.


    For example, in the project we created with the archetype, create the directory
    resources in src/main and in src/test. Then create any text file in both directories.
    They will be automatically copied in the corresponding output folders, that is,
    target/classes and target/test-classes, respectively.


    ```

    1 target

    2 └── classes

    3     ├── afile.txt

    4     ├── com

    5         └── mycompany

    6             └── app

    7                 └── App.class

    8

    9 └── test-classes

    10    ├── afile.txt

    11    ├── com

    12        └── mycompany

    13            └── app

    14                └── myapp

    15                    └── AppTest.class

    ```


    Note that while Eclipse is automatically copying such resource files, the corresponding
    source folders are not marked as source directories. It is enough to update the
    Eclipse project with Maven → Update Project…'
