  md: 'Now, in order to build the project with Maven, instead of running the command
    mvn, you run run the command ./mvnw, from the directory where the scripts are
    located. The first time, the Maven binary distribution will be downloaded and
    unpacked in your home directory in the subdirectory .m2/wrapper/dists. Distributing
    the wrapper (i.e., the scripts and the wrapper JAR) together with your project
    will allow anyone to build it by running the scripts, without an already installed
    Maven program.


    The wrapper has also the benefit of enforcing a specific version of Maven, so
    that anyone using the wrapper will use that Maven version. Recall that each Maven
    version comes with default versions of the standard plugins, thus using a specific
    Maven version also implies using those versions of the standard plugins (of course,
    unless the POM explicitly specifies plugin versions, as we saw in Section Plugin
    management).


    The specific version of Maven is hardcoded in the download URL in the file .mvnw/wrapper/maven-wrapper.properties.
    To switch the wrapper to another version of Maven, simply change the version in
    the URL in that file. Otherwise, the Maven version can be specified when creating
    the wrapper or updated by running the Maven command above with the command line
    argument -Dmaven=<maven version>, e.g.,


    ```

    mvn -N io.takari:maven:wrapper -Dmaven=3.6.0

    ```'
