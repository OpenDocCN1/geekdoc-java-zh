  md: 'has more than 20 phases. We now see the main phases and summarize their intents:


    +   - **validate**:n  validates the pom.xml file and checks that all the necessary
    information is available.

    - **initialize**:n  initializes the build, including creating and setting up the
    directories and setting properties.

    - **generate-sources**:n  generates any required source code that is meant to
    be part of the compilation. (This is useful if you use additional tools to generate
    Java code.)

    - **generate-resources**:n  generates resources that will be part of the final
    artifact (and used in tests).

    - **process-resources**:n  copies the resources to their build directory.

    - **compile**:n  compiles the main source code.

    - **process-classes**:n  processes the byte-code generated during the compilation
    phase, e.g., for code enhancements.

    - **generate-test-sources,..., test-compile, process-test-classes**:n  as above,
    but for test resources and test code.

    - **test**:n  runs tests using a unit testing framework.'
