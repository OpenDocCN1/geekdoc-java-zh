    The behavior of web applications depends on many factors like work speed, your
    machine capabilities or the current load on application servers. Because of all
    these factors, you cannot always predict how much time it will take to load a
    specific page or web element. That''s why you might want to add a timeout and
    pause script execution for at least a certain amount to deal with.


    If you do not know how to deal with this in the right way, you will never see
    stability in your UI automation.


    Let''s assume that in our test we are going to open the home page and verify the
    heading of the main page. Extremely simple. You just need to implement two functions.
    One that opens the page and the second that verifies the heading element is presented
    and has the right value. But what if we knew our application can take up to 7-8
    seconds to start?


    Selenium, we browser automation tool, works pretty fast and honestly, even faster
    than you. It can open the page in milliseconds and will try to get the text of
    heading element while the application itself is still starting. In this situation...
    please, NEVER write a code like this:


    ```

    driver.openHomePage();

    Thread.sleep(5000);

    driver.verifyThatTitleAndHeadingTextIsCorrect();

    ```


    This is the strongest killer of UI automation tests stability. Why?


    We lose time because you know that in 95 percentage of cases, the application
    should be up and running in 7-8 seconds. Therefore, each time we lose 2-3 seconds
    of execution time.


    What happens if application load 10.5 seconds one day? Because of some network
    slowness. We will get failed tests. But when you try to run it locally on the
    next day, it works perfectly fine. This is one more example of the troubles you
    might get into by using this way of waiting in your tests.


    This is how you can specify the implicit wait in Java by using Selenium.


    +   1 WebDriver driver = new FirefoxDriver();

    2 driver.manage().timeouts().implicitlyWait(5, TimeUnit.SECONDS);'
