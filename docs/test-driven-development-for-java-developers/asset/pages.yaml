    # 7.2.1 The Dockerfile


    A Dockerfile is a textual file with the instructions to create a Docker image
    using the docker build command. The syntax of this file is documented here https://docs.docker.com/engine/reference/builder/.
    In this book we only use a minimal part of the syntax:


    # FROM


    Defines the base image for our image (recall that images reuse other images''
    layers); the base image highly depends on the kind of application we want to docker,
    since the base image should provide enough software for the application. In our
    example, it makes sense to start from a Java base image.


    # COPY


    Copies source files from the context into the file system of the container (we''ll
    get back to the concept of context soon).


    # RUN


    Executes a command; for example, this is typically used to install programs in
    the container or create configuration files. If the container is running in a
    Linux distribution based on apt, we can run apt commands to install Linux packages.


    # CMD


    Default command to execute when executing the container. This can be overridden
    from the command line specifying the command to execute as the last argument (like
    we did for the ubuntu image, specifying the command bash)


    The instructions of the Dockerfile can access only the directories of the context,
    when the image is built. The context directory is passed as argument to the build
    command. Thus, source directories of the COPY command are relative to the context
    directory (i.e., / is the root of the context). The context directory is processed
    recursively and all its contents'
