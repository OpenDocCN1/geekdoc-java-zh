  md: '# HOUR 24

    Writing Android Apps


    This Hour''s To-Do List:


    +   - Learn why Android was created.

    - Create an Android app.

    - Learn how an Android app is structured.

    - Run an app on an emulator.

    - Run an app on an Android phone.


    Java''s general-purpose programming language that can run on a wide variety of
    platforms. One of those platforms has arisen in recent years to become an enormously
    successful spark for new Java development.


    The Android operating system, which started out on cell phones and has spread
    to a variety of other devices, exclusively runs programs in Java.


    These programs, called apps, are built on an open source mobile platform that''s
    completely free for developers to build on. Anyone can write, deploy, and sell
    Android apps.


    During this hour, you learn about how Android can be made, what makes it special,
    and why many programmers are developing on the platform. You also create an app
    and run it on an Android phone (if you have one) and emulator (if you don''t).


    # Introduction to Android


    Android was born in 2003, acquired by Google, and launched in 2007 as part of
    an industry-wide effort to establish a new mobile phone platform that is non-proprietary
    and open, unlike the technology that drives BlackBerry and Apple iPhone. Some
    of the biggest names in mobile phones and technology—Google, Intel, Motorola,
    Nvidia, Samsung, and other companies—formed the Open Handset Alliance to promote
    the new platform for mutual benefit.


    Google released the Android Software Development Kit (SDK), a free set of tools
    for developing Android apps. The first phone running Android, the T-Mobile G1,
    came out in June 2008.'
  merge: -1
  pgno: 372
- img_proc: true
  md: 'This effort started slowly, but since early 2010 has exploded and become a
    genuine rival to iPhone and other mobile platforms. All major phone carriers now
    offer Android phones. There''s also a growing market for tablet and ebook readers.


    Before Android, mobile application development required expensive programming
    tools and developer programs. The makers of the phone had control over who''d
    be allowed to create apps for them and whether the apps could be used to users.


    Android tears down that wall.


    The open source and non-proprietary nature of Android means that anyone can develop,
    release, and sell apps. The only cost involved is a nominal fee to submit apps
    to Google''s marketplace. Everything else is free.


    The place to download the Android SDK and find out about creating programs for
    the platform is the Android Developer site at https://developer.android.com. You
    will consult it often as you write your apps, because it documents every in Android''s
    class library and serves as an extensive reference.


    Writing Android apps is easier if you''re using an integrated development environment
    (IDE) that''s equipped to support the Android SDK. The recommended IDE for Android
    programming is Android Studio, which is also free and open source.


    You can use Android Studio to write Android apps, test them in an emulator that
    acts like an Android phone, and deploy them on an actual device.


    For most of its existence, the Java language has been used to write programs that
    run in one of three places: a desktop computer, a web server, or a web browser.


    Android puts Java everywhere. Your programs can be deployed on millions of phones
    and other mobile devices.


    This fulfills the original design goal of Java back when James Gosling invented
    the language in the mid-1990s. He was tasked with creating a language that could
    run everywhere on devices such as phones, smart cards, and appliances.


    Java''s developers set aside those dreams when the language became popular first
    as a means of running interactive web programs, and then as a general-purpose
    language.


    Two decades later, the Android platform is hosting as many as 3 billion Java programs
    around the world, according to one industry estimate.


    Android has the potential to be the most pervasive—and lucrative—area of Java
    programming for years to come.'
  merge: -1
