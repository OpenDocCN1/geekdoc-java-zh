    # Overriding Methods


    Some methods defined in the InputStream class of objects are also defined in one
    of its superclasses. For an example, the close() method is part of both the InputStream
    and the Reader class. When a method is defined in a subclass and itssuperclass,
    the subclass method is used. This enables a subclass to change, replace, or completely
    wipe out of the behavior or attributes of its superclasses.


    Creating a new method in a subclass to change behavior inherited from asuperclass
    is called overriding. You need to override a method time the inherited behavior
    produces an undesired result or you want to do something different.


    # Establishing Inheritance


    A class is defined as the subclass of another class using the extends statement,
    in the following:


    ```

    class FileReader extends InputStreamReader {

    // behavior and attributes go here

    }

    ```


    The extends statement establishes the FileReader class of objects as a subclass
    of BufferedReader. All file readers must be subclasses of input stream readers.
    They need the functionality to provide a file over an input stream.


    One method that FileReader could override the close() method, which does what
    is necessary to close the file after the text has been read. The close() method,
    implemented by the Reader class, is passed the way down to FileReader.


    To override a method, you must declare the method in the same way it was declared
    in the superclass from which it inherited. A public method must remain public,
    the value back by the method must be the same, and the number and type of arguments
    to the method must not change.


    The read( ) method of the Reader class begins as follows:


    ```

    public int read(char[] buffer) {

    ```


    When FileReader overrides this method, it must begin with a statement like this:


    ```

    public int read(char[] cbuf) {

    ```'
