  md: 'The benefits of a standard include the following:


    +   - There''s less need to document how an object works because anyone knows
    the standard already knows a lot about it functions.


    +   - You design development tools that follow the standard, making it possible
    to work easily with these objects.


    +   - Two objects that follow the standard can interact with each other without
    special programming to make them compatible.


    JavaBeans are objects that follow a strict set of rules for how they are created
    and their instance variables are accessed. A Java class that follows the rules
    is called a bean. The NetBeans IDE is used to make beans. An introductory tutorial
    using JavaBeans in NetBeans is at http://wiki.netbeans.org/NetBeansBeansTutorial.


    # Storing Objects of the Same Class in Array Lists


    An important decision to make when writing a computer program is where to store
    data. In the first half of your book, you''ve discovered three places to keep
    information:


    +   - Basic data types such as int and char (or their corresponding classes)


    +   - Arrays


    +   - String objects


    There are far more places to store information, because any Java class can hold
    data data. One of the most useful is ArrayList, a data structure that holds objects
    of the same class or a common superclass.


    As the name suggests, array lists are like arrays, which also hold elements of
    related data, but they can grow or shrink in size at any time.


    The ArrayList belongs to the java.util package of classes, one of the most useful
    in the Java Class Library. An import statement makes it available in your program:


    ```

    import java.util.ArrayList;

    ```


    An array holds objects that either belong to the same class or share the same
    superclass. They are created by referencing two classes: the ArrayList class and
    the list holds.


    The name of the class held by the list is placed within < and > characters, as
    in this statement:


    ```

    ArrayList<String> structure = new ArrayList<String>();

    ```'
