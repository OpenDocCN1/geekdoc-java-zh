    \ = \"Joe Dante\";\n```\n\nIn the Gremlin class, the creator variable is also\
    \ public, so it can be used freely from other programs. The other variable, maximumAge,\
    \ can only be used within the class itself.\n\nWhen you make a variable in class\
    \ public, the class loses control over how variable is used by other programs.\
    \ In many cases, this might not be a problem. For example, the creator variable\
    \ can be changed to any name that identifies the creator of the gremlin.\n\nRestricting\
    \ access to a variable keeps errors from occurring if the variable is set incorrectly\
    \ by another program. The maximumAge variable contains the number of hours the\
    \ gremlin will exist in its current format. It wouldn't make sense for maximumAge\
    \ to be set to a negative value. The Gremlin class of objects needs to guard against\
    \ this, you need to do these two things:\n\n+   - Switch the variable from public\
    \ to protected or private, two other statements that provide more restrictive\
