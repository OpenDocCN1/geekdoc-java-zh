  md: "# Inner Classes\n\nWhen you create a class in Java, you define the attributes\
    \ and behavior for that class. The attributes are the class and instance variables\
    \ that hold data. The behavior is the methods that perform tasks with that data.\n\
    \nA class can also contain something that consists of both attributes and behavior:\
    \ an inner class.\n\nInner classes are helper classes that are contained within\
    \ an enclosing class. You may wonder why they're necessary, it's as easy to create\
    \ a program of as many new classes as you need. If you are writing a CheckBook\
    \ program that needs objects for each check person writes, you create a Check\
    \ class. If the program supports recurring monthly payments, add an Autopayment\
    \ class.\n\nInner classes aren't necessary. But when you learn all the things\
    \ they can do, you'll find many situations where they're incredibly handy.\n\n\
    There are three reasons that Java includes inner classes:\n\n+   1. When a helper\
    \ class is only used by one other class, it makes sense to define it within that\
    \ class.\n\n+   2. They enable a helper class to access private methods and variables\
    \ it could not access as a separate class.\n\n+   3. They put a helper class as\
    \ close as possible to where it is being used in another class.\n\nAn inner class\
    \ is created with the class keyword, like any other class, but it is declared\
    \ inside the containing class. Typically, this is placed with class and instance\
    \ variables.\n\nHere's an example of an inner class called InnerSimple being created\
    \ inside a class Simple:\n\n```\npublic class Simple {\n    class InnerSimple\
    \ {\n        InnerSimple() {\n            System.out.println(\"I am an inner class!\"\
    );\n        }\n    }\n\n    public Simple() {\n        // empty constructor\n\
    \    }\n\n    public static void main(String[] arguments) {\n        Simple program\
    \ = new Simple();\n    }\n```"
