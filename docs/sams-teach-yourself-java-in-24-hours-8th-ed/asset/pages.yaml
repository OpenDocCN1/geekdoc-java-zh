  md: '# Workshop 139


    Terms such as program, class, and object make more sense as you become more experienced
    with this style of development. OOP is a concept that takes some time to get used
    to. When you have mastered it, you will find that it''s an effective way to design,
    develop, and debug computer programs.


    # Workshop


    # Q&A


    +   Q. Can classes inherit from more than one class?

    A. It''s possible with classes in some programming languages (such as C++), but
    not Java. Multiple inheritance is a powerful feature, but it also makes OOP harder
    to learn and use. Java''s developers decided to limit inheritance to one class,
    although a class has numerous subclasses. One way to compensate for this limitation
    is to inherit from a special type of class called an interface. You learn more
    about interfaces during Hour 15, "Creating a Threaded Program."


    +   Q. When would you want to create a method that isn''t public?

    A. The main time to do that is when the method is strict for the use of the program
    you''re writing. If you are creating a game program and your shootRaycast() method
    is highly specific to the game you''re writing, it could be a private method.
    To keep a method from being public, leave off the public statement in front of
    the method''s name.


    +   Q. Why is it possible to use char values as if they were int values?

    A. A character can be used as an int variable because each character has a corresponding
    numeric code in the character set. If you have a named k with the value 67, the
    cast (char) produces the character value ''C'' because the numeric code associated
    with a character C is 67, according to the ASCII character set. The ASCII character
    set is part of the Unicode character standard adopted by the Java language.


    +   Q. Does Tabasco hot sauce spill?

    A. No, it doesn''t, though if you keep an opened bottle for several years it will
    change color. The ingredients of vinegar, red pepper, and salt are extremely inhospitable
    environment for bacterial growth.


    McIlheny Company, the makers of Tabasco, say the original brand has a shelf life
    of five years. Other versions have a shelf life from 18 months to three years.


    As a huge fan of the product, I find it hard to believe anyone keeping a bottle
    of Tabasco around long enough for this to be an issue.'
