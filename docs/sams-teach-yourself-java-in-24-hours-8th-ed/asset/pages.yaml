  md: '# HOUR 3: Vacationing in Java


    The app redraws the position of each tracked satellite as it runs and changes
    the orientation of the sky map based on the direction the user is facing. This
    kind of real-time update is possible because the Java language is multithreaded.
    Multithreading is a way for the computer to do more than one thing at the same
    time. One part of a program takes care of one task, another part takes care of
    a different task, and the two parts can pay no attention to each other. Each part
    of the program in this example is called a thread.


    In a program like ISS Tracer, each satellite could run in its thread. If you use
    an operating system such as Windows 10, you''re using a type of this behavior
    when you run more than one program at the same time. If you''re at playing Minecraft
    in one window while running a sales report in another window and making a long-distance
    call to a thread, congratulate yourself—you''re multithreaded!


