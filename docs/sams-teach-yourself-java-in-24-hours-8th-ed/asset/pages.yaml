  md: '# # Using the NetBeans Integrated Development Environment


    Although it''s possible to create Java programs with nothing than the Java Development
    Kit and a text editor, the experience is considerably more pleasant when you use
    an integrated development environment (IDE).


    Most of this book employs NetBeans, a free IDE offered by Oracle for Java programmers.
    NetBeans is a program that makes it easier to organize, write, compile, and debug
    Java software. It includes a project and file manager, graphical user interface
    designer, and many other tools. One killer feature is a code editor that automatically
    detects Java syntax errors as you type.


    Now in version 8.2, NetBeans has become a favorite of professional Java developers,
    offering functionality and performance that would be the money 10 times the price.
    (See what I did there?) NetBeans is also one of the easiest IDEs for Java novices
    to use.


    In this appendix, you will learn about NetBeans to install the software and to
    use it throughout this book.


    # ## Installing NetBeans


    From inausicious beginnings, the NetBeans IDE has grown to become one of the leading
    programming tools for Java developers. James Gosling, the creator of the Java
    language, gave it the ultimate vote of confidence in his *NetBeans Field Guide*:
    "I use NetBeans for all my Java development." After trying many of the IDEs available
    for the language over the years, I''ve become a convert well.


    NetBeans supports all facets of Java programming for the three editions of the
    language—Java Standard Edition (JSE), Java Enterprise Edition (JEE), and Java
    Mobile Edition (IME). It also supports web application development, web services,
    and JavaBeans. This book focuses on the JSE.


    You can download NetBeans, available for Windows, Mac OS, and Linux, from https://netbeans.org.
    The software is available for download bundled with the Java Development Kit and
    can be downloaded separately. You must have NetBeans and the JDK installed on
    your computer. NetBeans is available in several bundles. Choose the one that supports
    Java SE.'
