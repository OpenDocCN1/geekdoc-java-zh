  md: "# Running the Thread\n\nThe run() method is where the main work of a thread\
    \ takes place. In the LinkRotator program, the following represents the run()\
    \ method:\n\n```\npublic void run() {\n    Thread thisThread = Thread.currentThread();\n\
    \    while (runner == thisThread) {\n        current++;\n        if (current >\
    \ 5) {\n            current = 0;\n        }\n        siteLabel.setText(pageTitle[current]);\n\
    \        repaint();\n        try {\n            Thread.sleep(1000);\n        }\
    \ catch (InterruptedException e) {\n            // do nothing\n        }\n   \
    \ }\n}\n```\n\nThe first thing that takes place in the run() method is the creation\
    \ of a Thread called thisThread. A class method of the Thread class, currentThread(),\
    \ sets up the value for the thisThread object. The currentThread() method keeps\
    \ track of the thread that's currently running.\n\nAll statements in this method\
    \ are part of a while loop that compares the runner object to the thisThread object.\
    \ Both objects are created, and as long as they refer to the same object, the\
    \ while loop continues looping. There is no statement inside this loop that calls\
    \ the runner thisThread object to have different values, so it loops indefinitely\
    \ unless something outside of the loop changes one of the Thread objects.\n\n\
    The run() method calls repaint(). Next, the value of the current variable increases\
    \ by one, and if current exceeds 5, it is set to 0 again. The current variable\
    \ is used to determine which website's information to display. It is used as the\
    \ index to the pageTitle array of strings, and the title is set as the siteLabel\
    \ user interface component.\n\nThe run() method includes another try-catch block\
    \ that handles errors. The Thread.sleep(1000) statement causes a thread to pause\
    \ 1 second, long enough for users to read the name of the website and its address.\
    \ The catch statement takes care of any InterruptedException errors that might\
    \ occur while the Thread.sleep() statement is being handled. These errors would\
    \ occur if something interrupted the thread as it slept."
