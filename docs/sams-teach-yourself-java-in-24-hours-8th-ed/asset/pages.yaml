    # Workshop


    # Q&A


    +   Q. The term “initialization” has been used in several places. What does it
    mean?


    +   A. It means to give something an initial value and set it up. When you create
    a variable and assign a starting value to it, you are initializing the variable.


    +   Q. If a loop never ends, does the program stop running?


    +   A. Usually in a program where a loop does not end, something else in the program
    is set up to stop execution in some way. For example, a loop in a game program
    could continue indefinitely while the player still has left.


    One bug that crops up when you work on programs is an infinite loop, a loop that
    never stops because one of the Java programs you run is stuck in an infinite loop,
    please the red alert to the left of the Output pane.


