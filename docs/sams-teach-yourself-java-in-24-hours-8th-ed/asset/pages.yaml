  md: "In this example, the break statement causes the for loop to end if the points\
    \ variable is greater than 50. However, the while loop never ends because target\
    \ is never greater than 100.\n\nIn some cases, you might want to break out of\
    \ more than one loop at the same time. To make this possible, you might have the\
    \ outer loop—in this, the while statement—a name. To name a loop, put the name\
    \ on the line before the beginning of the loop and follow it with a colon (:).\n\
    \nWhen the loop has a name, use the name after the break or continue statement\
    \ to indicate the loop to which the break or continue statement applies. The following\
    \ example repeats the previous one with the exception of one thing: If the points\
    \ variable is greater than 50, both loops end.\n\n```\nint points = 0;\nint target\
    \ = 100;\ntargetLoop:\nwhile (target <= 100) {\n  for (int i = 0; i < target;\
    \ i++) {\n    if (points > 50) {\n      break targetLoop;\n    }\n    points =\
    \ points + i;\n  }\n}\n```\n\nWhen a loop's name is used in a break or continue\
    \ statement, the name does not include a colon.\n\n# Complex for Loops\n\nA loop\
    \ can be more complex than shown up to this point in the hour. The loop can include\
    \ more than one variable in its initialization, conditional, and change sections.\
    \ A for loop can have more than one variable set during the initialization section\
    \ and more than one statement in the change section, in the following code:\n\n\
    ```\nint i, j;\nfor (i = 0, j = 0; i * j < 1000; i++, j *= 2) {\n  System.out.println(\"\
    \"\" + i + \" * \" + j + \" = \" + (i * j));\n}\n```\n\nIn each section of the\
    \ for loop semicolons (;), commas are used to separate the variables, as in i\
    \ = 0, j = 0. The example displays a list of equations where the i and j variables\
    \ are multiplied together. The i increases by 1, and the j increases by 2 during\
    \ each trip through the loop. When i multiplied by j is equal or greater than\
    \ 1,000, the loop ends."
