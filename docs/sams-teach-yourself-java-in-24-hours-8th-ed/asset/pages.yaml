    When you are using an expression with more than one operator, you need to know
    what order the computer uses as it works out the expression. Consider the following
    statements:


    ```

    int y = 10;

    x = y * 3 + 5;

    ```


    Unless you know what the computer uses when working out the math in these statements,
    you cannot be sure what the variable will equal. It could be set to either 35
    or 80, depending on whether y * 3 is evaluated first or 3 + 5 is evaluated first.


    The following evaluation order is used when working out an expression:


    +   1. Incrementing and decrementing take place first.

    2. Multiplication, division, and modulus division occur next.

    3. Addition and subtraction follow.

    4. Comparisons take place next.

    5. The equal sign = is used to set a variable''s value.


    Because multiplication takes place before addition, you can revisit the previous
    example and come up with the answer: y is multiplied by 3 first, which equals
    30, and then 5 is added. The x variable is set to 35.


