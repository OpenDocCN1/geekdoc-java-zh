  md: 'You can use a protected variable only in the same class as the variable, any
    subclasses of that class, or by classes in the same package. A package is a group
    of related classes that serve a common purpose. An example is the java.util package,
    which contains classes that offer useful utilities such as date and time programming
    and file archiving. When you use the import statement in a Java program with an
    asterisk, as in import java.util., you are making it easier to refer to the classes
    of that package in a program.


    A private variable is restricted even further than a protected variable—you can
    use it in the same class. Unless you know that a variable can be changed to anything
    affecting how its class functions, you should make the variable private or protected.


    The following statement makes guid a private variable:


    ```

    private int guid;

    ```


    If you want other programs to use the guid variable in some way, you have to create
    behavior that makes it possible. This task is covered in later on.


    There is also another type of access control: the lack of any public, private,
    or protected statement when the variable is created.


    In most of the programs you have developed prior to this hour, when no access
    control is set, the variable is available only to classes in the same package.
    This is called default or package access.


    # Creating Class Variables


    When you create an object, it has its version of all variables that are part of
    the object''s class. Each object created from the Gremlin class of objects has
    its own version of the guid, maximumAge, and creator. If you modified one of these
    variables in an object, it would not affect the same variable in another Gremlin
    object.


    There are times when an attribute should describe an entire class of objects instead
    of a specific object. These are called class variables. If you want to track of
    how many Gremlin objects are being used in a program, you could use a class variable
    to store this information. Only one copy of the variable exists for the whole
    class. The variables you are creating for objects thus far can be called object
    variables because they are associated with a specific object.


    Both types of variables are created and used in the same way, but static is part
    of the statement that creates class variables. The following statement creates
    a class variable for the Gremlin example:


    ```

    static int gremlinCount = 0;

    ```'
