  md: "# Handling User Events\n\nWhen a user event is generated by a component that\
    \ has a listener, a method is called automatically. The method must be found in\
    \ the class specified when the listener is attached to the component.\n\nEach\
    \ listener has different methods that can receive their events. The ActionListener\
    \ interface sends events to a method called actionPerformed(). The following is\
    \ a short example of an actionPerformed() method:\n\n```\npublic void actionPerformed(ActionEvent\
    \ event) {\n    // method goes here\n}\n```\n\nAll events are sent in the program\
    \ to do this method. If only one component in a program can possibly send action\
    \ events, you can put statements in this method to handle the event. If more than\
    \ one component can send these events, you need to check the object to send the\
    \ method.\n\nAn ActionEvent object is sent to the actionPerformed() method. Several\
    \ classes of objects represent the user events that can be generated in a program.\
    \ These classes have methods to determine which component caused the event to\
    \ happen. In the actionPerformed() method, if the ActionEvent object is named\
    \ event, you can identify the component with the following statement:\n\nString\
    \ cmd = event.getActionCommand();\n\nThe getCommand() method sends a string. If\
    \ the component is a button, the string is the label on it. If it is a text field,\
    \ the text is entered in the field. The getSource() method sends back the object\
    \ that caused the event.\n\nYou could use the following actionPerformed() method\
    \ to receive events from three components: a JButton called start, a JTextField\
    \ called speed, and another JTextField called viscosity:\n\n```\npublic void actionPerformed(ActionEvent\
    \ event) {\n    Object source = event.getSource();\n    if (source == speed) {\n\
    \        // speed field caused event\n    } else if (source == viscosity) {\n\
    \        // viscosity field caused event\n    } else {\n        // start button\
    \ caused event\n    }\n}\n```\n\nCall the getSource() method on all user events\
    \ to identify the specific object that caused the event."
