    If this seems confusing, think of the hierarchy as a family tree. InputStreamReader
    inherits from its parent and on onward. The InputStreamReader class does not inherit
    from its siblings or cousins, however.


    Creating a new class boils down to the following task: You must only define the
    ways in which it is different from an existing class. The rest of the work is
    done for you.


    # Inheriting Behavior and Attributes


    The behavior and attributes of a class are a combination of two things: its own
    behavior and attributes and all the behavior and attributes it inherits from its
    superclasses.


    The following are some of the behavior and attributes of InputStreamReader:


    +   - The `equals()` method determines whether an InputStreamReader object has
    the same value as another object.


    +   - The `getEncoding()` method returns the name of the character encoding used
    by the stream.'
