- img_proc: true
  md: 'To achieve this goal, this book uses the English language as much as possible
    instead of technical jargon or obscure acronyms. All new programming terms are
    thoroughly explained as they are introduced.


    If you succeed, you will finish this book with enough programming skills to be
    a danger to yourself and others. You''ll be able to write programs, plunge into
    programming classes and books with more confidence, and learn new languages more
    easily. (Programming languages, to be clear. This book won''t help you master
    Spanish, Esperanto, or Klingon).


    You will also have skills with Java, the most widely used programming language
    on the planet.


    The first hour of this book provides an introduction to programming and guidance
    on setting up your computer so you can use it to write and run Java programs.


    # # Choosing a Language


    If you''re comfortable enough with computer to prepare a nice-looking résumé,
    balance a checkbook, or share your vacation photos on Instagram, you can create
    computer software.


    The key to learning how to program is to start with the right language. The programming
    language you choose often depends on the tasks you want to accomplish. Each language
    has strengths and weaknesses. Back in my day, you whippersnappers, people learned
    to program with the BASIC language because it was created in mind.


    NOTE


    The BASIC language was invented to be easy for students to learn (the B in BASIC
    stands for Beginner''s). The downside to using some form of BASIC is that it''s
    easy to fall into sloppy programming-habits with the language.


    The most popular language that employs BASIC is today Visual Basic, a programming
    language from Microsoft that has moved far its roots. VB, as it is also called,
    is designed for creating programs to run on computers and mobile devices that
    use the Windows operating system. Another popular language is PHP, a scripting
    language for creating websites. Other widely used languages C++, Ruby, Javascript,
    and Python.


    Each of these languages has its adherents, but the most widely taught in computer
    science classes at the high school and collegiate level is Java.


    The Java programming language, which is offered by Oracle, is more difficult to
    learn than some languages like VB and PHP, but it''s a great start for several
    reasons. One advantage of learning Java is that you can use it across a variety
    of operating systems and computing environments. Java programs can be desktop
    software, web applications, web servers,'
  merge: -1
