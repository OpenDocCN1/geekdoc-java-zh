  md: 'The following statement is the only thing located inside the block:


    ```

    // My first Java program goes here

    ```


    This line is a placeholder. The // at the beginning of the line tells the computer
    to ignore this line because it was put in the program solely for the benefit of
    humans who are looking at the source code. Lines that serve this purpose are called
    comments.


    Right now, you have written a complete Java program. It can be compiled, but if
    you run it, nothing happens. The reason is that you haven''t told the computer
    to do anything yet. The main statement blocks only a single comment, which is
    ignored by the computer. You must add some statements inside the opening and closing
    brackets of the main block.


    # Storing Information in a Variable


    In the programs you write, you need a place to store information for a brief period
    of time. You can do this by using a variable, a storage place that can hold information
    such as integers, floating-point numbers, true-false values, and lines of text.
    The information stored in a variable can change, which is how it gets its name.


    In Salut.java file, replace Line 5 with the following:


    ```

    String greeting = "Salution mondo!"

    ```


    This statement tells the computer to store the "Salution mondo! in a variable
    greeting.


    In a Java program, you must tell the computer what type of information a variable
    will hold. In this program, greeting is a string—a line of text that can include
    letters, numbers, punctuation, and other characters. Putting String in the statement
    sets up the variable to hold string values.


    When you enter this statement into the program, a semicolon must be included at
    the end of the line. Semicolons end each statement in a Java program. They''re
    like the period at the end of a sentence. The computer uses them to determine
    when one statement ends and the next one begins.


    Putting only one statement on each line makes a program more understandable (for
    humans).


    # Displaying the Contents of a Variable


    If you run the program at this point, it still seems like nothing happens. The
    command to store text in the greeting variable occurs behind the scenes. To make
    the computer show that it is doing something, you can display the contents of
    variable.'
