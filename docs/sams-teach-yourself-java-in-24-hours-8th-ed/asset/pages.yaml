  md: '# Setting Up a Minecraft Server


    Developing mods requires access to a Minecraft server. The best way to do this
    when you''re starting out as a mod developer is to install and run a server on
    your own computer. Because there''s not yet a standard way to add mods to the
    game, different servers have different ways to make this possible.


    The easiest to use when creating mods comes from the Spigot Project, a Minecraft
    server and Java class library designed specifically for this purpose. Spigot is
    free and can be downloaded from the website www.javamincraft.com/spigot. Look
    for—the spigotserver.jar.


    This file contains the Minecraft server and class library packaged as a JAR file.


    The Spigot API is a set of Java packages that will be used when creating mods.


    When the download is complete, create a new folder on your computer and store
    the files in it. On my Windows PC I created c:\minecraft\server and copied the
    JAR file into it.


    Next, copy spigotserver.jar to the same folder. This is the file you run to start
    the Minecraft server.


    The following command starts the server:


    ```

    java -Xms1024M -Xmx1024M -jar spigotserver.jar

    ```


    This command tells the Java Virtual Machine to run the application packaged as
    the JAR file spigotserver.jar, allocating 1,024MB of memory to the program.


    To avoid this command every time you run the server, you can create a batch or
    shell file that contains it and then run that instead.


    On Windows, use a text editor as Notepad and enter the text of Listing 23.1 into
    the file, saving it as start-server.bat in the same folder where you put spigotserver.jar.


    # LISTING 23.1 The Full Text of start-server.bat


    ```

    1: java -Xms1024M -Xmx1024M -jar spigotserver.jar

    2: pause

    ```


    Double-click this file to run the server. If it runs successfully, a window opens
    that displays what the server is doing as it starts.


    You will see an error message, “Failed to load eula.txt,” as shown in Figure 23.1.
    This is supposed to happen.'
