  md: '# HOUR 8: Repeating an Action with Loops


    The following things take place in the program:


    +   - Line 5—The startTime variable is created with the current time in milliseconds
    as its value, measured by calling the currentTimeMillis() method of Java’s System
    class.


    +   - Line 6—The endTime variable is created with a value 60,000 higher than startTime.
    Since one minute equals 60,000 milliseconds, this sets the variable one minute
    past startTime.


    +   - Line 7—A long named index is set up with an initial value of 0.


    +   - Line 8—The while statement begins a loop using true as the conditional,
    which causes the loop to continue forever (in other words, until something stops
    it).


    +   - Line 9—The square root of index is calculated and stored in the x variable.


    +   - Line 10—If now is greater than endTime, the now variable is created with
    the current time.


    +   - Line 11–13—If now is greater than endTime, this signifies that the loop
    has been running for one minute and break ends the while loop. Otherwise, it keeps
    looping.


    +   - Line 14—The index variable is incremented by 1 with each trip through the
    loop.


    +   - Line 16—Outside the loop, the program displays the number of times it performed
