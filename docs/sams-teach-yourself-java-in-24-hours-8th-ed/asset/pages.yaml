    # Completing a Graphical Application


    I see how Swing''s event-handling classes in a Java program, you will finish LottoMadness,
    the lottery simulation begin after Hour 18, "Laying Out a User Interface."

    At this point, LottoMadness is a GUI. You can click buttons and enter text into
    boxes, but nothing happens in response. In this workshop, we create LottoEvent,
    a new class that receives user input, collects drawings, and keeps track of the
    number of times you win. When the class is complete, you add a few lines to LottoMadness
    so that it makes use of LottoEvent. It is convenient to divide Swing projects
    in this manner, with the GUI in one class and the event-handling methods in another.


    The purpose of this application is to assess the user''s chance of winning a six-number
    lot drawing in a lifetime. Figure 19.2 shows a screen capture of the program as
    it runs.


    ![](img/d09a156b28ce3a26efd211fe0a9c6991_278_0.png)


    FIGURE 19.2 Running the LottoMadness application.'
