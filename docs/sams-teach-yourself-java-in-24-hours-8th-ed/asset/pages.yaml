  md: '# HOUR 23: Creating Minecraft Mods with Java


    This statement creates a speed potion of the maximum possible duration—the highest
    value an integer can hold in Java:


    ```

    PotionEffect potion = new PotionEffect(

    PotionEffectType.SPEED,

    Integer.MAX_VALUE,

    10 + (coat * 10));

    ```


    The third argument to PotionEffect() sets the speed of the horse. It has a base
    value of 10 plus the random number used to determine the horse''s color. Because
    the colors in the switch-case statement are ordered from darkest to lightest,
    the formula 10 + (coat * 10) causes horses to run faster the darker coloration.


