  md: 'The Java class is defined in lines 11–22. Everything above Line 11 is a comment
    included by NetBeans in every new class when you choose Java Application as the
    project type. These comments help explain things about the program to humans reading
    the source code. The compiler ignores them.


    # # Running the Application


    After you''ve created the class Spartacus.java and compiled it successfully, you
    can run it within NetBeans in two ways:


    +   - Choose Run, Run File from the menu.

    - Right-click Spartacus.java in the Projects pane and choose Run File.


    When you run a Java class, its main() method is called by the Java Virtual Machine.
    The string “I am Spartacus!” appears in the Output pane, as shown in Figure A.4.


    ![](img/d09a156b28ce3a26efd211fe0a9c6991_400_0.png)


    **FIGURE A.4**

    Output of the Spartacus application.


    A Java class must have a main() method to be run. If you attempt to run a class
    that lacks one, NetBeans responds with an error.


    When you’re finished reviewing the program’s output, close the Output pane by
    clicking the X on the pane’s tab (the place with the title Output – Java24 (run)).
    This makes the source editor larger so that more lines are displayed, which comes
    in handy when you are creating a program.


    # # Fixing Errors


    Now that the Spartacus application has been written, compiled, and run, it’s time
    to break something to get some experience with how NetBeans responds when things
    go terribly wrong.


    Like any programmer, you’ll have plenty of practice screwing things up on your
    own, but pay attention here anyway.'
