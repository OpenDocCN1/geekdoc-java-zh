    To see an example of inheritance at work, in the next project you create a class
    called Point3D that represents a point in three-dimensional space. You can express
    a two-dimensional point with (x,y) coordinate. Three-dimensional space adds a
    coordinate, which can be called z.


    The Point3D class of objects can do three things:


    +   - Keep track of an object''s (x,y) coordinate

    - Move an object to a new (x,z) coordinate

    - Move an object by a specified amount of x, y, and z values


    Java already has a standard class that represents two-dimensional points called
    Point. This class can be found in the java.awt package.


    It has two integer variables x and y that store a Point object''s (x,y) location.
    It also has a move() method to place a point at the specified location and a translate()
