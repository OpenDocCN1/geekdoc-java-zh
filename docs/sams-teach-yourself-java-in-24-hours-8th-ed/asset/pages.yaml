  md: "# Handling Something After an Exception\n\nWhen you are dealing with multiple\
    \ exceptions using try and catch, there are times when you want the program to\
    \ do something at the end of the block whether an exception occurred or not.\n\
    \nYou can handle this using a try-catch-finally block, which takes the following\
    \ form:\n\n```\ntry {\n  // statements that might cause the exception\n} catch\
    \ (Exception e) {\n  // what to do when the exception occurs\n} finally {\n  //\
    \ statements to execute no matter what\n}\n```\n\nThe statement or statements\
    \ within the finally section of the block are executed after everything else in\
    \ the block, even if an exception occurs.\n\nOne place this is useful is a program\
    \ that reads data from a file, which you can do in Hour 20, \"Reading and Writing\
    \ Files.\" There are several ways an exception can occur when you are accessing\
    \ data: the file might not exist, a disk error could occur, and so on. If the\
    \ statements to read the disk are in a try statement and errors are handled in\
    \ a catch section, you can close the file in the finally section. This makes sure\
    \ that the file is closed whether or not an exception is thrown as it is read.\n\
    \n# Throwing Exceptions\n\nWhen you call a method of another class, that class\
    \ can control how the method is used by throwing exceptions.\n\nAs you make use\
