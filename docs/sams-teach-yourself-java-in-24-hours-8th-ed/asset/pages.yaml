  md: '# HOUR 22

    Creating Java2D Graphics


    # This Hour''s To-Do List:


    +   - Set the font and color of text.

    - Set up a container''s background color.

    - Draw lines, rectangles, and other shapes.

    - Draw GIF and JPEG graphics.

    - Draw filled and unfilled shapes.


    During this hour, you learn how to turn containers—the plain gray panels and frames
    that hold graphical user interface (GUI) components—into an artistic canvas on
    which you can draw various fonts, colors, shapes, and graphics.


    # Using the Font Class


    Colors and fonts are represented in Java by the Color and Font classes in the
    java.awt package. With these classes, you can present text in different fonts
    and sizes and change the color of text and graphics. Fonts are created with the
    Font (String, int, int) constructor, which takes three arguments:


    +   - The typeface of the font as a generic name ("Dialog," "DialogInput," "Monospaced,"
    "SanSerif," or "Serif") or an actual font name ("Arial Black," "Helvetica," or
    "Courier New")

    - The style as one of three class variables: Font.BOLD, Font.ITALIC, or Font.PLAIN

    - The size of the font in points


    The following statement creates a 12-point Serif font:


    ```

    Font current = new Font("Serif", Font.ITALIC, 12);

    ```


    If you use a specific font rather than one of the generic ones, it already must
    be installed on the computer of the user running your program.'
