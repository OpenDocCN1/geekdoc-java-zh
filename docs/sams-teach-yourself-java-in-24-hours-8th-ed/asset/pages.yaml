    # Writing Data to a Stream


    In the java.io package, the classes for working with streams come in matched sets.
    There are FileInputStream and FileOutputStream classes for working with byte streams,
    FileReader and FileWriter classes for working with character streams, and many
    other sets for working with other kinds of data stream.


    To begin writing data, you first create a File object that is associated with
    an output stream. This file does not have to exist on your system.


    You can create a FileOutputStream in two ways. If you want to append bytes onto
    an existing file, call the FileOutputStream() constructor with two arguments:
    a File object representing the file and the boolean of true. By bytes you write
    to the stream are tacked onto the end of the file.


    If you want to write bytes into a new file, call the FileOutputStream() constructor
    with a File object as its only object.'
