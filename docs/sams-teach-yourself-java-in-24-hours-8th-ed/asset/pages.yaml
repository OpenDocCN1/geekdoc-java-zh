  md: "# Closures\n\nThis next section introduces the most highly requested language\
    \ feature for years: closures.\n\nClosures, which are also called lambda expressions,\
    \ allow an object with a single method to be created with only an -> operator,\
    \ as long as other conditions are met.\n\nHere's an example:\n\n```\nRunnable\
    \ runner = () -> { System.out.println(\"Run!\"); };\n```\n\nThis single line creates\
    \ an object that implements the Runnable interface and makes its run() method\
    \ equivalent to the following code:\n\n```\nvoid run() {\n    System.out.println(\"\
    Run!\");\n}\n```\n\nIn a lambda expression, the statement to the right of the\
    \ arrow operator -> becomes the method that implements the interface.\n\nThis\
    \ can be done only when the interface has a single method to implement, such as\
    \ Runnable, which contains run(). An interface in Java that has one method is\
    \ now called a functional interface.\n\nA lambda expression also has something\
    \ to the left of the arrow operator. In the first example, it's an empty set of\
    \ parentheses, and it refers to the arguments to the method of the functional\
    \ interface. Since run() takes no arguments in the Runnable interface, no arguments\
    \ are required in the expression.\n\nHere's a second example of a lambda expression\
    \ that puts something in those parentheses:\n\n```\nActionListener al = (ActionEvent)\
    \ -> {\n    System.out.println(act.getSource());\n}\n```\n\nThis is equivalent\
    \ to the following code in an object that implements the ActionListener interface\
    \ in the java.awt.event package:\n\n```\npublic void actionPerformed(ActionEvent\
    \ act) {\n    System.out.println(act.getSource());\n}\n```\n\nThe ActionListener\
    \ interface receives action events, such as when a user clicks a button. The only\
    \ method in the functional interface is actionPerformed(ActionEvent). The argument\
    \ is an ActionEvent object that describes the user action that triggered the event."
  merge: -1
  pgno: 228
- img_proc: true
  md: "The right half of the lambda expression defines the actionPerformed() method\
    \ as a single statement that displays information about the user interface content\
    \ that triggered the event.\n\nThe left half of the expression declares that an\
    \ ActionEvent object named act is the argument to the method.\n\nThis object,\
    \ act, is used inside the body of the method. The left-half reference to act appears\
    \ to be outside the scope of the right-half implementation of the method. This\
    \ is because closures allow code to refer to the variables of another method outside\
    \ the scope of those variables.\n\nAs you see, one effect of lambda expressions\
    \ is that they shorten code. A single expression creates an object and implements\
    \ an interface.\n\nThis feature of Java can make the code even shorter through\
    \ the language's support for target typing.\n\nIn a lambda expression, it is possible\
    \ to infer the class of the argument or arguments sent to the method. Consider\
    \ the last example. Because the ActionListener functional interface has a method\
    \ that takes an ActionEvent object as its argument, the name of that class can\
    \ be omitted.\n\nHere's a revised version of the lambda expression taking this\
