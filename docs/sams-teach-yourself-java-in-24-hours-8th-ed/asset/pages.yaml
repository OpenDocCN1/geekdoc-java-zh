    # Workshop


    # Q&A


    +   Q. How important is it to put the right number of blank spaces on a line in
    a Java program?


    +   A. It is completely unimportant as far as the computer is concerned. Spacing
    is strictly for the benefit of looking at a computer program—the Java compiler
    couldn''t care less. You could have written the Saluton program without including
    blank spaces or using the Tab to key indent lines, and it would compile successfully.

    Although the number of spaces in front of lines isn''t important to the computer,
    you should use consistent spacing and indentation in your Java programs anyway.
    Why? Because spacing makes it easier for you to see how a program is organized
    and to which programming statement belongs.'
