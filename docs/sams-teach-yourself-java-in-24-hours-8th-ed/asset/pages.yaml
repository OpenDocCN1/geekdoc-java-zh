  md: 'Consider the following statements:


    ```

    int x = 3;

    int answer = x++ * 10;

    ```


    What does the answer variable equal after these statements are handled? You might
    expect it to equal 40—which would be true if 3 was incremented by 1, which equals
    4, and then 4 was multiplied by 10.


    However, answer ends up with the value 30 because the postfixed operator was used
    instead of the prefixed operator.


    When a postfix operator is used on a variable inside an expression, the variable''s
    value doesn''t change after the expression has been completely evaluated. The
    statement answer = x++ * 10 does the same thing in the same order as the following
    two statements:


    ```

    int answer = x * 10;

    x++;

    ```


    The opposite is true of prefixed operators. If they are used on a variable inside
    an expression, the variable''s value changes before the expression is evaluated.


    Consider the following statements:


    ```

    int x = 3;

    int answer = ++x * 10;

    ```


    This does result in the answer being equal to 40. The prefixed operator causes
    the value of the x to be changed before the expression is evaluated. The statement
    answer = ++x * 10 does the same thing, in order, as these statements:


    ```

    x++;

    int answer = x * 10;

    ```


    It''s easy to become exasperated with the ++ and -- operators because they''re
    not straightforward as many of the concepts you encounter in this book.


    I hope I''m not breaking some unspoken line of programmers by telling you this,
    you don''t need to use the increment and decrement operators in your own programs.
    You can achieve the same results by using the + and – operators like this:


    ```

    x = x + 1;

    y = y - 1;

    ```


    Incrementing and decrementing are useful shortcuts, but taking the longer route
    in an expression is fine, too.'
