    # Understanding Inheritance


    A big advantage to inheritance, which enables one object to inherit behavior and
    attributes from another object.


    When you start creating objects, you sometimes find that a new object you want
    is like one you already have.


    If David Lightman wanted an object that could handle error correction and other
    modem features that were around in 1983 when WarGames were released? Lightweight
    could create a new ErrorCorrectionModem object by copying the statements of the
    Modem object and revising them. However, if most of the behavior and attributes
    of ErrorCorrectionModem are the same as Modem, this is a lot of unnecessary work.
    It also means that Lightman would have two separate programs to update if something
    needed to be changed.


    Through inheritance, a programmer can create a new class of objects by defining
    how they are different from an existing class. Lightman could make ErrorCorrectionModem
    inherit from Modem, and all he would need to write things that make error-correction
    modems different from others.'
