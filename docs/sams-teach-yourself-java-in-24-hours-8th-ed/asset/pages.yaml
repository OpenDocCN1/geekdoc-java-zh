  md: '# Storing Objects of the Same Class in Array Lists


    The preceding statement creates a list that holds strings. Identifying a list''s
    class in this manner utilizes generics, a way to indicate the kinds of objects
    a data structure such as an array list holds. If you were using lists with an
    older version of Java, you would have written a constructor like this:


    ```

    ArrayList structure = new ArrayList();

    ```


    Although you can do this, generics make your code more reliable because they give
    the compiler a way to prevent more errors. Here, they stop you from misusing an
    array list by putting the wrong class of objects in it. If you attempt to put
    an object in a list that''s supposed to hold String objects, the compiler fails
    with an error.


    Unlike arrays, lists aren''t created with a fixed number of elements they hold.
    The list is created with 10 elements. If you''re storing more objects than that,
    you can specify a size as an argument to the constructor. Here''s a statement
