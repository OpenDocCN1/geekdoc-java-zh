  md: '# Creating a New Project 401


    A NetBeans project consists of some related Java classes, files used by those,
    and Java class libraries. Each project has its own folder, which you can explore
    and modify outside NetBeans using text editors and other programming tools.


    To begin a new project, click the New Project button shown in Figure A.1 or choose
    the File, Project menu command. The New Project Wizard opens, as shown in Figure
    A.2.


    ![](img/d09a156b28ce3a26efd211fe0a9c6991_397_0.png)


    Figure A.2

    The New Project Wizard.


    NetBeans can create several types of Java projects, but during this book you can
    focus on one type: Java Application.


    For your first project (and most of the projects in this book), choose the project
    type Java Application and click Next. The wizard asks you to choose a name and
    location for the project


    The Project Location field identifies the root folder of the programming projects
    you create with NetBeans. On Windows, this is a subfolder of My Documents (or
    Documents) folder named NetBeansProjects. All projects you create are stored inside
    this folder, each in its own folder.


    In the Project Name field, enter Java24. The Create Main Class text box changes
    in response to the input, recommending java24.Java24 as the name of the main Java
    class in the project. Change this to Spartacus and click Finish, accepting all
    other defaults. NetBeans creates the project and its first class.'
