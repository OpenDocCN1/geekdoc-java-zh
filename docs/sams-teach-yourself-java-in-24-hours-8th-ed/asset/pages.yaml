  md: 'There have been 10 major releases of the Java language, each with some essential
    new features.

    Here are the first:


    +   - Java 1.0—The original release (1995)


    +   - Java 1.1—Java Database Connectivity (JDBC), improved graphical user interfaces
    (1997)


    +   - Java 2 version 1.2—Inner classes, the Java Plug-in for web browsers, and
    data structures (1998)


    +   - Java 2 version 1.3—Enhanced multimedia (2000)


    +   - Java 2 version 1.4—Improved Internet support, XML processing, and assertions
    (2002)


    +   - Java 5—Generics, for loops, annotations, and automatic data conversion (2005)


    +   - Java 6—The built-in Derby database and web services (2006)


    +   - Java 7—Memory and resource management improvements and the Nimbus graphical
    user interface (2014)


    +   - Java 8—Closures (2014)


    The current release, Java 9, came out in 2017. Three years, this new version introduces
    improvements to interfaces and closures, an advanced feature you can learn about
    Hour 16, “Using Inner Classes and Closures.” There’s also an HTTP client for receiving
    and sending data over the Web, as covered in Hour 21, “Using Java 9’s New HTTP
    Client.”


    If you don''t know what these things are—such as inner classes, generics, or HTTP—don’t
    freak out. You''ll learn about them over the next 21 hours.


    NOTE


    Are you wondering why Java’s versions are numbered so strangely, skipping from
    2 to 6, calling the seventh version Java 6, and including an integer and decimal
    number in some versions? Me, too! Java’s major made some odd decisions along the
    way as new versions were released.

    Fortunately, the numbering scheme has made more sense since 2006, with each new
    release an integer higher than the last.


    # Going to School with Java


    The Web includes numerous resources for educators and schoolchildren. Because
    Java apps offer a more interactive experience than web pages, the language is
    a natural choice for programs that enhance learning.'
