  md: '# HOUR 17


    # Building a Simple User Interface


    This Hour''s To-Do List:


    +   - Create interface components such as buttons.

    - Create labels, text fields, and other components.

    - Group components together.

    - Put components inside other components.

    - Scroll components horizontally and vertically.

    - Open and close windows.


    Things are going to get pretty gooey during this hour. You will make an enormous
    mess creating your first graphical user interface (GUI) with Java.


    Computer users have to expect software to feature a GUI, take user input from
    a mouse, and work like other programs. Although some users still work in command-line
    environments such as a Linux or Unix shell, must be confused by software that
    does not offer a pointand-click, drag-and-drop graphical interface like Microsoft
    Windows or Mac OS.


    Swing supports this kind of software with Swing, a collection of Java classes
    that represent all the different buttons, text fields, sliders, and other components
    that can be part of a GUI, as well as the classes needed to take user input from
    those components.


    During this hour and the next, you create and organize GUIs in Java. Afterward,
    in Hour 19, "Responding to Input," you will need those interfaces to receive mouse
    clicks and other user input.


    # Swing and the Abstract Windowing Toolkit


    Because Java is a cross-platform language that enables you to write programs for
    many operating systems, its graphical user interface must be flexible. Instead
    of catering only to the Windows style or the Mac version, it must handle both,
    along with other platforms.'
