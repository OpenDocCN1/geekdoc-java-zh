  md: "The anonymous inner class has replaced the reference to worker with the following\
    \ code:\n\n```\nnew Runnable() {\n    public void run() {\n        // thread's\
    \ work to perform goes here\n    }\n}\n```\n\nThis creates an anonymous class\
    \ that implements the Runnable interface and overrides the run() method. The statements\
    \ inside the method would perform whatever the class requires.\n\nThis concept\
    \ will be easier to comprehend with a full example of how an anonymous inner class\
    \ is written and what it's useful.\n\nA Java application can receive keyboard\
    \ input with the Swing graphical user interface packages. The application monitors\
    \ the keyboard with an object that implements the KeyListener interface.\n\nA\
    \ class that implements the interface must implement three methods: keyTyped(),\
    \ keyPressed(), and keyReleased(), as in this code:\n\n```\npublic void keyTyped(KeyEvent\
    \ input) {\n    char key = input.getKeyChar();\n    keyLabel.setText(\"You pressed\
    \ * \" + key);\n}\n```\n\n```\npublic void keyPressed(KeyEvent txt) {\n    //\
    \ do nothing\n}\n```\n\n```\npublic void keyReleased(KeyEvent txt) {\n    // do\
    \ nothing\n}\n```\n\nIn the same class as these statements, the key listener is\
    \ set to use the class to monitor keyboard events:\nkeyText.addKeyListener(this);\n\
    \nWith an anonymous inner class and the KeyAdapter class in the java.awt.event\
    \ package, there's a better way to create the listener and add it to the graphical\
    \ user interface.\n\nThe KeyAdapter class implements the KeyListener interface\
    \ with do-nothing implementations of all three methods. It makes it easy to create\
    \ a listener for keyboard events, because you can create a subclass that only\
    \ overrides the method that actually does anything."
