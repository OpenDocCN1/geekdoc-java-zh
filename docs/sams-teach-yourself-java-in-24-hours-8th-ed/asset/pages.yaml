    # CAUTION


    Resources are identified in an app using an ID formed from their filename with
    the extension removed. appicon.png has the ID icon, browser.png has the ID browser,
    and so on. No two resources can have the same ID (with the exception of the same
    graphic being stored at different resolutions) in the mipmap folders, because
    they count as a single resource.


    If two resources have the same name without the extension, such as appicon.png
    and appicon.gif, Android Studio will flag the error and the app won''t compile.


    Resources also have names that contain only lowercase letters, numbers, underscores
    (_), and periods (.). The files in this project follow these rules.


