  md: '# Workshop


    # Q&A


    +   - Why is Android Studio used to create Android apps instead of NetBeans?


    You can use NetBeans to develop apps, but it''s a more cumbersome and less well-supported
    IDE for Android programming. Android Studio has been designated by Google as the
    preferred Android IDE. The official documentation and tutorials on the Android
    Developer site at http://developer.android.com use all Android Studio.


    Most programming books for Android also employ Android Studio. There''s a learning
    curve to switch from NetBeans to Android Studio when you dive into Android, after
    you master the basics of writing, debugging, and deploying an app, you should
    find Android Studio easier to use because it''s so much better supported by Android
    programmers and writers.


    +   - Why do many movies have the exact sound of a scream in anguish?


    That is the Wilhelm scream, a sound effect that was heard in the 1951 movie Distant
    Drums. It turns up often when somebody falls from a great height, is shot by a
    gun, or knocked back by an explosion. Two famous uses in the original Star Wars,
    when a stormtrooper is shot by Luke Skywalker and falls off a ledge, and the animated
    movie Toy Story knocks Woody Buzz Lightyear out the window.


    The sound was popularized by movie sound designer Ben Burt, who found it in a
    Warner Brothers stock library when developing for Star Wars and included it in
    every Steven Spielberg and George Lucas movie he worked on. It has since become
    a tradition among sound designers and can be heard in more than 140 movies.


    The actor who screamed is believed to be She Wooley, an actor and singer who recorded
    the 1958 novelty song "Purple People Earth."


    The scream being named Wilhelm comes from the third movie to use the sound effect.
    The 1953 film The Charge at Feather River, Private Wilhelm yells in anguish as
    he is shot by an arrow.


