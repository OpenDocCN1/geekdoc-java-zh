  md: "# Reading and Writing Configuration Properties\n\nJava programs are more versatile\
    \ when they can be configured using command-line arguments, as you have demonstrated\
    \ in several applications created in earlier hours. The java.util package includes\
    \ a class, Properties, that enables configuration settings to be loaded from another\
    \ source: a text file.\n\nThe file can be read like other files in Java:\n\n+\
    \   * Create a File object that represents the file.\n* Create a FileInputStream\
    \ object from that File object.\n* Call load() to retrieve the properties from\
    \ that input stream.\n\nA properties file has a set of property names followed\
    \ by an equal sign = and their values. Here's an example:\n\n```\nusername=lepton\n\
    lastCommand=open database\nwindowSize=32\n```\n\nEach property has its own line,\
    \ so this sets up properties named username, lastCommand, and windowSize with\
    \ the \"lepton\", \"open database\", and \"32\", respectively. The same format\
    \ was used by the Config application.\n\nThe following code loads a properties\
    \ file config.dat:\n\n```\nFile configFile = new File(\"config.dat\")\nInputStream\
    \ inputStream = new FileInputStream(configFile)\nProperties config = new Properties();\n\
    config.load(inputStream);\n```\n\nConfiguration settings, which are called properties,\
    \ are stored as strings in the Properties object. Each property is identified\
    \ by a key. The getProperty() method retrieves a property using its key, as in\
    \ this statement:\n\n```\nString username = config.getProperty(\"username\");\n\
    ```\n\nBecause properties are stored as strings, you must convert them in some\
    \ manner to use a numerical value, as in this code:\n\n```\nString windowProp\
    \ = config.getProperty(\"windowSize\");\nint windowSize = 24;\ntry {\n    windowSize\
    \ = Integer.parseInt(windowProp);\n} catch (NumberFormatException exception) {\n\
    \    // do nothing\n}\n```"
