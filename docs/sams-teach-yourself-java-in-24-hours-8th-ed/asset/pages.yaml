  md: '# # APPENDIX E

    # Fixing Package Not Visible Errors in NetBeans


    One of the most interesting features introduced in Java 9 modules, which enable
    Java programs to indicate which parts of the Java Class Library they require and
    what class packages they export.


    Modules also can be used to access Java packages in the class library that aren''t
    normally available. In Hour 21, "Using Java 9''s New HTTP Client," the experimental
    support for the new HTTP Client was not usable in a programming project until
    the module jdk.incubator.client was added to that project.


    The modules that are standard in Java 9—and don''t require special effort to use—are
    still being decided by Oracle and the other companies finalizing the new release
    of the Java language.


    This appendix covers what to do when a Java project in NetBeans experiences an
    error because a module is not available.


    # ## Adding Module Info


    The Java Class Library includes hundreds of packages. A small number of them are
    only usable when their module has been added to a project.


    If you try to import a class or group of classes that are in a module not yet
    available, the import statement will cause an error flagged in the NetBeans source
    code editor.


    Here''s an example of such a statement:


    ```

    import jdk.incubator.http;

    ```


    If this causes an error flagged by a red sign icon along the left edge of the
    source editor, hover over the icon to see the error message:


    ```

    package jdk.incubator.http is not visible

    (package jdk.incubator.http is declared in module

    jdk.incubator.httpclient, which is not in the module

    graph)

    ```'
  merge: -1
