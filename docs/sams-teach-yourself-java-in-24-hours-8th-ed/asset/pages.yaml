  md: 'Because Java programs are text files, you can open and edit them with any text
    editor. You could write a Java program with NetBeans, open it in Windows Notepad
    and make changes, and open it again later in NetBeans without any problems.


    # Creating the Saluton Program


    To prepare for the first programming project in NetBeans, if you haven''t already
    done so, create a new project called Java24 by following these steps:


    +   1. Choose the menu command File, New File. The Project dialog opens.


    +   2. Choose the project category Java and the project type Java Application
    and then click Next.


    +   3. Enter Java24 as the project''s name. (If you created a project with this
    name previously, you see the error message “Project folder already exists and
    is not empty.”)


    +   4. Deselect the Create Main Class box.


    +   5. Click Finish.


    The Java24 project is created in its own folder. You can use this project for
    the Java programs you write as you progress through this book.


    # Beginning the Program


    NetBeans groups relate projects together into a project. If you don''t have the
    Java24 project open, here''s how to load it:


    +   1. Choose File, Open Project. A file dialog appears.


    +   2. Find and select the NetBeansProjects folder (if necessary).


    +   3. Choose Java24 and click Open Project.


    The Java24 project appears in the Projects pane next to a coffee icon and a +
    sign that can be expanded to see the files and folders that the project contains.


    To add a new Java program to the currently open project, choose File, New File.
    The New File Wizard opens, as shown in Figure 2.1.'
