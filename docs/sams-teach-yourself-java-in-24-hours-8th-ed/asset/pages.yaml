  md: '# Quiz


    The following questions test your knowledge of loops. In the spirit of the subject
    matter, repeat each of these until you get them right.


    +   1. What must be used to separate each section of a for statement?


    +   A. Commas


    +   B. Semicolons


    +   C. Off-duty police officers


    +   2. Which statement causes a program to go back to the statement that began
    a loop and then keeping going from there?


    +   A. continue


    +   B. next


    +   C. skip


    +   3. Which loop statement in Java always runs at least once?


    +   A. for


    +   B. while


    +   C. do-while


    # Answers


    +   1. Commas are used to separate things within a section, but semicolons separate
    sections.


    +   2. The break statement ends a loop entirely, continue skips to the next go-round
    of the loop.


    +   3. The do-while conditional is not evaluated until after the first pass through
    the loop.


    # Activities


    If your head''s not going in circles from all this looping, review the topics
    of this hour with the following activities:


    +   ▶ Modify Benchmark program to test the execution of simple mathematical calculation,
    such as multiplication or division.


    +   ▶ Write a short program using loops that finds the first 400 numbers that
    are multiples of 13.


    See Java programs that implement these activities, visit the book''s website at
    www.java24.com.'
