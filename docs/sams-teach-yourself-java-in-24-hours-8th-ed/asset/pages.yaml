    \ If you gave the count variable an initial value of 6 instead of 1, the text\
    \ would never be displayed.\n\n# do-while Loops\n\nThe do-while loop is similar\
    \ to the while loop, but the conditional test goes in a different place. The following\
    \ is an example of a do-while loop:\n\n```\nint gameLives = 0;\ndo {\n    // the\
    \ statements inside the loop go here\n} while (gameLives > 0);\n```\n\nLike the\
    \ while loop, this loop continues continuing until the gameLives variable is no\
    \ longer greater than 0. The do-while loop is different because the conditional\
    \ test is conducted after the statements inside the loop, instead before them.\n\
    \nWhen the do is reached for the first time as a program runs, the statements\
    \ between the do and while are handled automatically, the while condition is tested\
    \ to determine whether the loop should be repeated. If the condition is false,\
