  md: '# Throwing and Catching Exceptions


    The string http://www.java24hours.com is not a valid URL because it''s missing
    some punctuation: two slash characters (// after the colon.


    Since the loadURL() method has been declared to throw MalformedURLException errors,
    it does not have to deal with inside the method. The responsibility for catching
    this exception falls to any method that calls the loadURL() method.


    # Exceptions That Don''t Need catch


    Although this hour has shown that exceptions need to be caught with try-catch
    or declared to be thrown with a throws clause, there''s an exception.


    Some exceptions that might occur in a Java program do not to be handled in any
    way. The compiler won''t come to screeching halt when it detects that the exception
    is being ignored. These exceptions are unchecked exceptions, while the others
    are checked exceptions.


    Unchecked exceptions are subclasses of RuntimeException in the java.lang package.
    A common example of an unchecked exception is IndexOutOfBoundsException, which
    indicates that the index used to access an array, string, or list is not within
    its boundaries. If an array has five elements and you attempt to read element
    10, this exception will occur.


    Another is NullPointerException, which occurs when an object has no value is used.
    Object variables have a value null before they are assigned an object. Some methods
    also return when an object can''t be returned. If a statement incorrectly assigns
    an object has a value, a NullPointerException occurs.


    Both errors are things programmer could (and should) prevent in the code, not
    things that require exception handling. If you write a program that does this
    and recompile it. If you expect an object and it equals null, the code that accesses
    an out-of-bounds array element, first to check with an if condition before using
    the object.


    The rationale for unchecked exceptions in Java is that they can be prevented by-written
    code, or they could occur so often that catching them all time would make programs
    unnecessarily complex. A NullPointerException could occur in every statement in
    a program where an object''s methods are called.


    Of course, because an exception can be ignored doesn''t mean it should be. You
    still have the option of using try, catch, and throws with unchecked exceptions.


