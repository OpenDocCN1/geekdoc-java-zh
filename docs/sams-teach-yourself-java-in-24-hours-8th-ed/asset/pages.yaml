  md: "A loop statement causes a computer program to return to the same place more\
    \ than once, like a stunt plane completing an acrobatic loop.\n\nJava's most complex\
    \ loop statement is for. A for loop repeats a section of a program fixed number\
    \ of times. Take a look at one here:\n\n```\nfor (int dex = 0; dex < 1000; dex++)\
    \ {\n    if (dex % 12 == 0) {\n        System.out.println(\":# \" + dex);\n  \
    \  }\n}\n```\n\nThis loop displays every number from 0 to 999 that is evenly divisible\
    \ by 12.\n\nA for loop has a variable that determines when the loop should begin\
    \ and end. This variable is called the counter (or index). The counter in the\
    \ preceding loop is the dex variable.\n\nA for loop has three parts within the\
    \ parentheses that follow the for keyword: the initialization, conditional, and\
    \ change sections. These sections are divided by semi-colons (;). The example\
    \ illustrates these three sections:\n\n+   * The initialization section—In the\
    \ first part, the dex variable is given an initial value of 0.\n\n+   * The conditional\
    \ section—In the second part, there is a conditional test like one might use in\
    \ an if statement: dex < 1000.\n\n+   * The change section—The third part is a\
    \ statement that changes the value of the dex variable, in this example using\
    \ the increment operator.\n\nIn the initialization section, you set up the counter\
    \ variable. You can create the variable in the for statement, as the preceding\
    \ example does with the integer variable. You can also create the variable elsewhere\
    \ in the program. The variable should be a starting value in this section. The\
    \ variable stays when the loop starts.\n\nThe conditional section contains a test\
    \ that must remain true for the loop to keep looping. When the test is false,\
    \ the loop ends. The loop ends when the dex variable is equal to or greater than\
    \ 1,000.\n\nThe last section of the for statement contains a statement that changes\
    \ the value of the counter variable. This statement is handled each time the loop\
    \ goes around. The counter has to change in some way or the loop never ends. In\
    \ the example, dex is incremented by one in the change section. If dex was not\
    \ changed, it would stay at its original value of 0 and the conditional dex <\
    \ 1000 always would be true.\n\nThe for statement's block is executed during each\
    \ trip through the loop."
