  md: '# HOUR 21: Using Java 9''s New HTTP Client


    Q. What was the first website on the Internet?


    A. The first site was http://info.cern.ch, which is still online today. Tim Berners-Lee,
    a British physicist at the European Organization for Nuclear Research (CERN),
    used the site to describe his new invention, the World Wide Web.


    The first web page was we at http://info.cern.ch/hypertext/WWW/TheProject.html
    and was updated the Web with attracted users, publishers, and software developers.


    The site defined the Web as “a wide-area information retrieval initiative giving
    universal access to a large universe of documents.”


    # Quiz


    Check how well you''ve absorbed a web of information on HTTP programming by answering
    the following questions.


    +   1. Which type of request can be used to send information to a web server?


    +   A. GET


    +   B. POST


    +   C. Both GET and POST


    +   2. What class holds the information received from a server produced by a request?


    +   A. HttpClient


    +   B. HttpResponse


    +   C. HttpRequest


    +   3. What''s one reason to use the Optional data structure?


    +   A. To avoid NullPointerException errors.


    +   B. To hold a collection of null values.


    +   C. To run faster.


    # Answers


    +   1. POST sends a large amount of data; GET sends data on a web address(URI).


    +   2. The HttpResponse object is returned by a call to the browser''s send()
    method.


    +   3. Calling isPresent() checks whether this structure holds null instead of
    a valid object.'
