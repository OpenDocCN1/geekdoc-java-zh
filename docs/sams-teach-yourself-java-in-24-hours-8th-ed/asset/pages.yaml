    # # Laying Out an Application


    The layout managers you have seen thus far were applied to an entire frame. The
    setLayout() method of the frame was used, and all components followed the same
    rules. This setup can be suitable for some programs, but as you try to develop
    a GUI with Swing, you often find that none of the layout managers fit.


    One way around this problem is to use a group of JPanel objects as containers
    to hold different sections of a GUI. You can set up layout rules for each of these
    by using the setLayout() methods of each JPanel. After these panels contain all
    the components you need to contain, you can add the panels directly to the frame.


