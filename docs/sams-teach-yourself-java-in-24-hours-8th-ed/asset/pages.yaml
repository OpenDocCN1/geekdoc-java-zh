    fake phone calls and SMS messages, but making real calls and sending messages
    requires the real thing.


    Because it''s not a fully functional device, the apps that you develop must be
    tested on actual Android phones and tablets.


    If you can connect an Android phone (or other device) to your computer using a
    USB cord, you should be able to run the app if the phone is in debugging mode.
    Apps developed with the Android SDK can only be deployed on a phone in mode.


    On the phone, enter this mode by choosing Home, Settings, Applications, Development
    (or Home, Settings, Developer Options). The Development settings are displayed.
    Choose the USB debugging option.


    Connect your Android phone to your computer with the USB cord. An Android icon
    will appear on the bar at the top of the phone''s screen. If you drag this bar
    down, you should see the message "USB Debugging Connected." Next, in Android,
    follow these steps:


    +   1. Choose RunApp.


    +   2. Under Connected Devices, choose your phone.


    +   3. Click OK.


    The app runs on the phone as it did on the emulator.


    Like the first program you wrote in Java back in Hour 2, the first app you created
    on Android is exceptionally non-exceptional. The next project is more ambitious.


    Close this project by choosing the menu command File, Close Project.


