  md: '# Choosing a Java Programming Tool


    NOTE


    One of the first computer bugs was discovered in 1947 by a team that included
    the American scientist Grace Hopper, Hopper was testing a computer at Harvard
    when a relay malfunctioned. The cause was not a software problem—it was an actual
    bug! A team debugged the computer by removing a dead moth and taped it into a
    logbook with the note, "First actual of bug being found." The bug and logbook
    page can be viewed at www.doncia.navy.mil/CHIPS/ArticleDetails.aspxid=3489.


    # Choosing a Java Programming Tool


    Starting writing Java programs, you must have a Java programming tool. Several
    programs are available for Java, including the simple Java Development Kit and
    the more sophisticated Eclipse, IntelliJ IDEA, and NetBeans. The latter three
    are each an integrated environment (IDE), a powerful tool used by professional
    programmers to get work done.


    When Oracle releases a new version of Java, the first tool that it supports is
    the Java Development Kit (JDK).


    To create the programs in this book, you must use JDK version 9 or a programming
    tool that works on top of it. The JDK is a set of free command-line tools for
    creating Java software. It lacks a graphical user interface, so if you have never
    worked in a non-graphical environment such as the Windows command prompt or Linux
    command-line interface, you will find it challenging to use the JDK.


    The NetBeans IDE, also offered for free by Oracle, is a much easier to write and
    test Java code than the JDK. NetBeans includes a graphical user interface, source
    code editor, interface designer, and project manager. It works in complement to
    the JDK, running behind the scenes, so you must have both tools on your system
    when you are developing Java programs.


    Most of the programs in this book were created with NetBeans, which you can download
    and install separately from the JDK. You can use other Java tools as long as they
    support JDK 9.


    NOTE


    You don''t have to use NetBeans in this book. If you use the JDK or another tool
    to create, compile, and run a program, those tasks are all that most projects
    require. NetBeans is covered for readers of past editions it has proven after
    the JDK. I use NetBeans for most of my Java programming.'
  merge: -1
