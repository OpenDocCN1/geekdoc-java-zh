    \ the variable that is tested—in this example,\ngrade. Then, the switch statement\
    \ uses the ( ) brackets to form a block statement.\n\nEach case statement checks\
    \ the test variable in the switch statement against a specific value.\nThe value\
    \ used in a case statement can be a character, integer, or string. In the preceding\n\
    example, there are case statements for the characters 'A', 'B', and 'C'. Each\
    \ has one or two\nstatements that follow it. When one of these case statements\
    \ matches the variable in switch,\nt computer executes all statements after the\
