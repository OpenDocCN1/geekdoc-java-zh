  md: '# Drawing Lines and Shapes


    Drawing shapes as lines and rectangles is as easy in a Java program as displaying
    text. All you need is a Graphics2D object to define the drawing surface and objects
    that represent things to draw.


    The Graphics2D object methods used to draw with a command such as the following:
    `comp2D.drawString("Draw, partner!", 15, 40);`


    This draws the text “Draw, partner!” at the coordinates (15, 40). Drawing methods
    use the same (x, y) coordinate system. The (0, 0) coordinate is at the upper-left
    corner of the container, x values increase to the right, and y values increase
    as you go down. You can determine the maximum (x, y) value you can use in a frame
    or another container with the following:


    ```

    int maxXValue = getSize().width;

    intValue = getSize().height;

    ```


    With the exception of lines, shapes you can draw can be filled or unfilled. A
    filled shape is drawn with the current color completely filling the space taken
    up by the shape. Unfilled shapes draw a border with the current color.


    # Drawing Lines


    2D drawing of an object is created and represents the shape that is being drawn.


    The objects that define shapes belong to the `java.awt.geom` package of classes.


    The Line2D.Float class creates a line connecting a beginning (x, y) point and
    an ending (x, y) point. The following statement creates a line from the point
    (40, 200) to the point (70, 130):

    `Line2D.Float line = new Line2D.Float(40, 200, 70, 130);`


    The arguments are followed by the letter F to indicate that they are floating-point
    values. If this was omitted, Java would treat them as integers.


    > NOTE


    Line2D.Float has a period in the middle of its class name, which differs from
    most classes you worked with. Because Float is a static inner class of the Line2D
    class, a subject covered in Hour 16, “Using Inner Classes and Closures."


    All shapes except for lines are drawn by calling a method of the Graphics2D class:
    `draw()` outlines and `fill()` for filled shapes.'
