  md: '# HOUR 17: Building a Simple User Interface


    A Path object represents the location of a file or folder. The Paths class has
    a get (String) method that converts a string to a path matching string. When called
    with " (an empty string), it returns the path of the current folder in the Java
    application is running:

    Path current = Paths.get("");


    Storage information for a disk is represented in Java by a FileStore object which
    is a file storage pool. After you have a path, you can get the file store that
    path is located with a method in the Files class. Call the getStore(Path) method
    of Files to retrieve that file storage pool:

    FileStore store = Files.getFileStore(current);


    With this path you can call its getTotal() and getUsableSpace() methods to find
    out much disk space is available on the current:

    long totalSpace = store.getTotal();

    long freeSpace = store.getUsableSpace();

    double percent = (double) freeSpace / (double) totalSpace * 100;


    # CAUTION


    The expression that calculates the percentage includes a lot of references to
    double, which may seem weird. The second and third cast the freeSpace and totalSpace
    variables to double values before they are used in the expression. This is necessary
    to keep the expression from producing an integer value instead of a floating-point
    number. Java determines the data type of an expression''s result by the types
    in the expression. A long divided by a long multiplied by the integer 100 would
    produce a long, not the desired percentage.


    The value calculated in the final result may be an extremely long number of digits
    post the decimal point, such as 64.8675309.


    The following expression converts a double percentage to no more than two decimal
    places:

    percent = (int)percent * 100) / (double)100;


    The first half of the expression multiplies the percentage by 100—moving the decimal
    places to the right—and converts it to an integer, so 64.8675309 becomes 6487.


    The second half divides this by 100—moving the decimal back places to the left—restore
    an approximation of the percentage. This makes 6486 into 64.86.


    With a percentage limited to two decimal places, the label''s text can be set
    to report the available occupied disk space:


    ```

    space.setText(freeSpace + " free out of " + totalSpace + " (")n+ percent + " %%");

    ```'
