  md: '# # Introduction


    As the author of computer books, I spend a lot of time lurking in the computer
    section of bookstores, observing the behavior of readers while I''m pretending
    to read the latest issue of Soap Opera Digest magazine.


    Because of my research, I''ve learned that if you have picked up this book and
    turned to this introduction, I only have 13 minutes before you put it down and
    head to the coffee bar for a double-tall-decaf-skim-with-two-shots-of-vanilla-hold-the-whip
    latte.


    So I''ll keep this brief: Computer programming with Java is easier than it looks.


    I''m not supposed to tell you that thousands of programmers have used their Java
    skills to get high-paying jobs in software development, server programming, and
    Android app creation. The last thing any programmer wants is for the boss to know
    that anyone with persistence and a little free time can learn this language, the
    most popular programming language on the planet. By working your way through each
    of the one-hour tutorials in Sams Teach Yourself Java in 24 Hours, you will be
    able to learn Java programming quickly.


    Anyone can learn how to write computer programs, even if you can''t program a
    DVR. Java is one of the best programming languages to learn because it''s a useful,
    powerful, modern technology that''s embraced by communities around the world.


    This book is aimed at non-programmers, new programmers who think they have this
    stuff, and experienced programmers who want to get up speed swiftly with Java.
    It uses Java 9, the latest and greatest version of the language.


    Java is an enormously popular programming language because of the things it makes
    possible. You can create programs that feature a graphical user interface, connect
    to web services, run on an Android phone or tablet, and more.


    This language turns up in amazing places. One of them is Minecraft, the gaming
    phenomenon written entirely in Java. (In this book you will learn how to create
    Java programs that run in that alongside creepers and zombie pigs!)


    This book teaches Java programming from the ground up. It introduces the concepts
    in English instead of jargon with step-by-step examples of working programs you
    will create. Spend 24 hours with this book and you''ll be writing your own Java
    programs, confident in your ability'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'to use the language and learn more about it. You also will have skills that
    are becoming increasingly important—such as Internet computing, graphical user
