  md: "As the Database class is doing its job, what happens if the credit card lender's\
    \ computer doesn't respond to any attempts to connect? This kind of error is exactly\
    \ the kind of thing that the catch block was designed for, and it is used within\
    \ Database to handle connection errors.\n\nIf the Database class handles this\
    \ by itself, the CreditCardChecker application doesn't know that the exception\
    \ took place at all. This isn't a good idea—the application should know when a\
    \ connection cannot be made so it can report this to the person using the application.\n\
    \nOne way to notify the CreditCardChecker application is for Database to catch\
    \ the exception in a catch block, and then throw it again with a throw statement.\
    \ The exception is thrown in Database, which must deal with it like any other\
    \ exception.\n\nWhen you throw in a catch block that catches a parent class, such\
