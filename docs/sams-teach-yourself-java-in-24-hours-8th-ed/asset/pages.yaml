    # Multidimensional Arrays


    The arrays so far in the hour have one dimension, so you can retrieve an element
    using a single number. Some types of information require more dimensions to store
    as arrays, such as points in an (x,y) coordinate system. One dimension of the
    array could store the x coordinate and the other dimension could store the y coordinate.'
