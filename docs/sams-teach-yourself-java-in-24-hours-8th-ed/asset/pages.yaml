  md: 'Next, the block''s setType() method is called with Material.AIR, which is one
    of several dozen values that represent the block can be made of Minecraft.


    The same technique that''s used to destroy a block by turning it into air can
    be used to build things. The only thing that changes is the type of material.
    If you had to dig out a scoop of the game and turn it into diamond instead of
    air, this statement would be:

    `current.setType(Material.DIAMOND);`


    When a scoop has been dug from the world, the mod does two things to note the
    accomplishment: A sound is played and a message is sent to the server log.


    Sounds are played by calling a world''s playSound() method with four arguments—the
    sound''s location, type, volume, and pitch:

    `world.playSound(spot, Sound.BURP, 3, 5);`


    As you might have guessed, the sound is a burst. There are dozens of possible
    sounds that could be used.


    A message is logged on the server by calling the Logger object''s info() command
    with the text of the message:

    `log.info("IceCreamScoop Scooped at " + spot);`


    The project''s plugin.yml file is shown in Listing 23.9. Create an empty file
    called plugin.yml in the project''s src folder to match this listing.


