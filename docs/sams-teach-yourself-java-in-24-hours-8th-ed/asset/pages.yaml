  md: 'To cast information into a new format, you precede it with the new format surrounded
    by parentheses. For example, if you want to cast something into a long variable,
    you precede it with (long). The following statements cast a float value into an
    int:


    ```

    float source = 7.00F;

    int destination = (int) source;

    ```


    In variable casting where the destination holds larger values than the source,
    the value is converted easily, such as when a byte is cast into an int. A byte
    holds values from -128 to 127, whereas an int holds values from -2.1 to 2.1 billion.
    No matter what the value byte holds, the new int variable has plenty of room for
    it.


    You sometimes can use a variable in a different format without casting it at all.
    For example, you can use char variables if they are int variables. Also, you can
    use int variables if they are long variables, and any numeric type can be used
    as a double.


    In most cases, the destination provides more room than the source, the information
    is converted without changing its value. The main exceptions occur when an int
    or long variable is cast to a float, or a long is cast into a double.


    When you are converting from a larger variable type into a smaller type, you must
    explicitly cast it, as in the following statements:


    ```

    int xNum = 103;

    byte val = (byte) xNum;

    ```


    Here, casting converts an integer value called xNum to a byte variable called
    val. This is an example where the destination holds a smaller range of values
    than the source variable. A byte holds integer values ranging from -128 to 127,
    and an int holds a much larger range of integer values.


    When the source variable in a casting operation has a value that doesn''t fit
    in the destination variable type, Java changes to make the cast fit successfully.
    This can produce unexpected results and should be avoided.


    # Casting Objects


    You can cast objects into other objects when the source and destination are related
    by inheritance. One class must be a subclass of the other.


    Some objects do not require casting at all. You can use an object where any of
    its superclasses are expected. All objects in Java are subclasses of the Object
    class, so you can use any object as an argument when Object is expected.


    You can also use an object where one of its subclasses is expected. However, because
    subclasses usually contain more information than their superclasses, you might
    lose some of this'
