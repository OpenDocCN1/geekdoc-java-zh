  md: "# Slowing Down a Program\n\nThe Thread class has a sleep() method that you\
    \ can call in any program that should stop running for a short period of time.\
    \ Often use this technique in a program that features animation prevents it from\
    \ being displayed faster than the Java Virtual Machine can handle them.\n\nTo\
    \ use the sleep() method, call `Thread.sleep()` with the number of milliseconds\
    \ to pause, as in the following statement:\n\n```\nThread.sleep(5000);\n```\n\n\
    The preceding statement causes the JVM to pause for five seconds (5,000 milliseconds)\
    \ before doing anything else. If some reason the JVM can't pause that long, an\
    \ InterruptedException is thrown by the sleep() method.\n\nBecause this exception\
    \ might be thrown, you must deal with it in some manner when using the sleep()\
    \ method. One way to do this is to place the `Thread.sleep()` statement inside\
    \ a try-catch block:\n\n```\ntry {\n  Thread.sleep(5000);\n} catch (InterruptedException\
    \ e) {\n  // wake up early\n}\n```\n\nWhen you want a Java program to handle more\
    \ than one thing at a time, you must organize the program into threads. Your program\
    \ can have as many threads as needed, and they can all run simultaneously without\
    \ affecting each other.\n\n# Creating a Thread\n\nA java class that can be run\
    \ as a thread is referred to as a runnable (or threaded) class. Although you often\
    \ use threads for the opposite reason—speed up a program. If you put time-consuming\
    \ tasks in their own threads, the rest of the program runs more quickly. This\
    \ is often to prevent a task from slowing down the responsiveness of a program's\
    \ graphical user interface (GUI).\n\nFor example, if you have written an application\
    \ that loads market price data from a file and compiles statistics, the most-consuming\
    \ task is to load the data. If threads are not used in the application, the program's\
    \ interface might respond sluggishly as the data is being loaded. This can be\
    \ extremely frustrating to a user.\n\nTwo ways to put a task in your own thread\
    \ include\n\n+   - Putting the task in a class that implements the Runnable interface\n\
    \n+   - Putting the task in a class that is a subclass of Thread"
