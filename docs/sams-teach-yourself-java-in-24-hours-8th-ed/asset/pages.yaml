  md: '# LISTING 2.1 The Salutton Program


    ```

    1: package com.java24hours;

    2:

    3: class Salutton {

    4: public static void main(String[] arguments) {

    5: // My first Java program goes here

    6: }

    7: }

    ```


    Make sure to capitalize everything exactly as shown, and use your spacer or Tab
    key to insert the blank spaces in Lines 4-6. When you''re done, choose File, Save
    to save the file.


    At this point, Salutton.java carries the bare bones of a Java program. You will
    create many programs that start exactly like this one, except for the word Salutton
    on Line 3. This represents the name of your program and each change with program
    you write. Line 5 should make sense to you, because it''s a sentence in actual
    English. The rest is probably new to you.


    # The class Statement


    The first line of the program is the following:


    ```

    package com.java24hours;

    ```


    A package is a way to group Java programs together. This line tells the computer
    com.java24hours the package name of the program.


    After a blank line, the third line is this:


    ```

    class Salutton

    ```


    Translated into English, it means, "Computer, give my Java program the name Salutton."


    As you might recall from Hour 1, each instruction you give a computer is called
    a statement. The class statement is the way you give your computer program name.
    It''s also used to determine other things about the program, as you will see later.
    The significance of the term class Java programs are also called classes.


    In this example, the program name Salutton matches the document''s filename, Salutton.
    java. A Java program must have a name that matches the first part of its filename—the
    portion before the \." period character—and should be capitalized the same way.


    If the program name doesn''t match the filename, you will get an error when you
    try to compile some Java programs, depending on how the class statement is being
    used to configure the program.'
