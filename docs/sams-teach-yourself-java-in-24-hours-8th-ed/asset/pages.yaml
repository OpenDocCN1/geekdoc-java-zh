    # Characters and Strings


    Because the variables you dealt with far are numeric, you might have the impression
    that all variables are used to store numbers. You can also use variables to store
    text. Two types of text can be stored as variables: characters and strings. A
    character is a single letter, number, punctuation mark, or symbol. A string is
    a group of characters.


    Your next step in creating the Variable program is to create a char variable and
    a String variable. Add these two statements above the float gradePointAverage
    line:


    ```

    char Key = ''C'';

    String productName = "Larvets";

    ```


    As you have noticed, these two statements use different characters over the text
    values. When you are using character values in your program, you must put quotation
    marks on both sides of the character value being assigned to a variable. For string
    values, you must surround them with double quotation marks.


    Quotation marks prevent the character or string from being confused with a variable
    name or another part of a statement. Take a look at the following statement:


    ```

    String productName = "Larvets";

    ```


    This might look like one telling the computer to create a string variable called
    productName with the text value of Larvets. However, because there are no quotation
    marks around the word Larvets, the computer is being told to set the productName
    value to the same value as a variable named Larvets. (If there is no variable
    name Larvets, the program fails to compile with.)


