    # Summary


    The use of HTTP for software and web services was probably inevitable. The protocol
    is implemented everywhere and firewalls have to let the traffic through port 80
    or web browsers wouldn''t work.


    The new HTTP Client Library in Java 9 is an attempt to make it easier to exploit
    this useful two-way channel of information.


    You might be confused about why the hour''s final project was given the odd name
    SalonVerkisto.


    There''s a class in the program Salaton you created during Hour 2, “Writing Your
    First Program.” That application displayed the message “Salaton, mundo!” which
    is the phrase “Hello, world!” in the Esperanto language. The word “salut” translates
    to “hello.”


    “Salaton verkisto” means “Hello, author.”


    # Q&A


    +   Q. Why is there an incubator warning in the output of this hour''s three programs?


    +   A. The creators of Java have introduced the concept of an incubator in Java
    9. The new HTTP Client library is in incubation, which means that it''s still
    in an early stage of development.


    A project in incubation is likely to change in the next version of Java. This
    is something to keep in mind as you use the classes of the jdk.incubator.http
    package.'
