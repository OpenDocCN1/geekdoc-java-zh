  md: 'Insert another blank line in the Saluton program after the String greeting
    = "Saluton mondo!" statement. Use that empty space to enter the following statement:


    System.out.println(greeting);


    This statement tells the computer to display the value stored in the greeting
    variable. System.out.println statement makes the computer display information
    on the system output device—your monitor.


    Now you''re getting somewhere.


    # Saving the Finished Product


    Your program should now resemble Listing 2.2, although you might have used slightly
    spacing in Lines 5–6. Make any corrections that are needed and save the file (by
    choosing File, Save).


    LISTING 2.2 The Finished Version of the Saluton Program


    ```

    1: package com.java24hours;

    2:

    3: class Saluton {

    4:     public static void main(String[] arguments) {

    5:     String greeting = "Saluton mondo!";

    6:     System.out.println(greeting);

    7: }

    8: }

    ```


    When the computer runs this program, it executes each of the statements in the
    main statement on Lines 5 and 6. Listing 2.3 shows what the program would look
    like if it was written in the English language instead of Java.


    LISTING 2.3 A Line-by-Line Breakdown of the Saluton Program


    ```

    1: Put this program in the com.java24hours package.

    2: The Saluton program begins here:

    3:     The main part of the program begins here:

    4:     Store the text "Saluton mondo!" in a String variable named greeting.

    5:     Display the contents of the variable greeting.

    6:     The main part of the program ends here.

    7: The Saluton program ends here.

    ```'
