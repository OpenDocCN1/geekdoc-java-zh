  md: '# Workshop


    # Q&A


    +   Q. BASIC: C++? Smalltalk? Java? What are the names of these languages supposed
    to mean?


    +   A. BASIC gets its name from an acronym: Beginner''s All-purpose Symbolic Instruction
    Code. C++ is a programming language that was created to be an improvement on the
    C language, which itself was an improvement of the B programming language. Smalltalk
    is an innovative object-oriented language developed in the 1970s that had numerous
    ideas adopted by Java.


    Java goes against the tradition of naming a language with an acronym or other
    meaningful term. It''s just the name that Java''s developers liked the best, beating
    out WebRunner, Silk, Ruby, and others. (The Ruby programming language didn''t
    exist back then.)


    When I create my programming language, it will be named Salsa. Everybody loves
    salsa.


    +   Q. Why are interpreted languages slower than compiled ones?


    +   A. They''re slower for the reason that a person interpreting a live speech
    in a foreign language is slower than a translator interpreting a printed speech.
    The live interpreter has to think about each statement that''s being made as it
    happens, while the other interpreter can work on the speech as a whole and take
    shortcuts to speed up the process. Compiled languages can be much faster than
    interpreted languages because they do things to make the program run efficiently.


    +   Q. Do you only answer questions about Java?


    +   A. Not at all. Ask me anything.


    +   Q. Okay, what is the lowest score for ever on Dancing with the Stars?


    +   A. The worst dance by a celebrity contestant on the ABC TV show in the United
    States was performed by the rapper Master P during the second season in 2006.
    His paso double was performed by professional dancer Ashley DelGrosso score lowest-ever
    8. Judges Len Goodman and Bruno Tonioli scored it a 2 and 2 judge Carrie Ann Inba
    a 4.


    Tonioli''s take: "It was a nightmare. You looked like a child on the mall looking
    for her mother."


    Goodman: "I know viewers think they''re kind by bringing you back. They''re not.
    They''re being cruel—to Ashley, to the judges."


    Inaba: "I actually thought that that was your best dancing."


    Master P only trained 20 hours for the show, compared to 130 for the other contestants
    at that point in the season. He refused to wear dancing shoes and performed in
    basket-sneakers. The dance was last voted off


    The dance can be seen on YouTube, where one commenter writes, "Thumbs up if you''re
    watching this to see the 2 paddle."


    On Dancing with the Stars internationally, reality TV star Dave Graham got the
    lowest score—a 1 from all judges for a total of 4–in Australia in 2007. He saw
    the performance on his YouTube account, writing, "Perhaps not the best claim to
    fame, but you take your records where you can.'
