  md: '# HOUR 2: Writing Your Program


    The programs you write must be understandable to other programmers, including
    yourself when you look at the code weeks or months later to fix a bug or make
    an enhancement. Consistency in spacing and indentation are part of what''s called
    a programming style. Good programmers adopt a style and practice it in all they
    work.


    Q. A Java program has been described as a class and as a group of classes. Which
    is it?


    A. Both the simple Java programs you create during the next few months are compiled
    into a single file with the extension .class. You can run these with the Java
    Virtual Machine. Java programs can also be made up of a set of classes that work
    together. This topic is fully explored during Hour 10, "Creating Your First Object"


    Q. If semicolons are needed at the end of each statement, what does the comment
    line


    ```

    // My first Java program goes here not end with a semicolon;

    ```


    A. Comments are completely ignored by the compiler. If you put // on a line in
    your program, this tells the Java compiler to ignore everything to the right of
    the // on that line. The following example shows a comment on the line as a statement:


    ```

    System.out.println(greeting); // hello, world!

    ```


    Q. I couldn''t find any errors in the line where the compiler noted an error.
    What can I do?


    A. The line number displayed with the error message is not always the place where
    an error needs to be fixed. Examine the statements that are directly above the
    error message to see whether you can spot any types or other bugs. The error usually
    is within the same programming block.


    Q. How can I visit Antarctica?


    A. If you''re not willing to be a scientific researcher or a support staffer such
    as a cook, electrician, or doctor, you can become one of the 10,000 people who
    visit the frozen Antarctica as tourists.


    Flyovers are available from Australia, New Zealand, and South America and cost
    around $1,000 per person.


    Several cruise ships visit for a trip lasting from 10 days to three weeks, the
    most expensive of which is around $25,000. Some cruises offer a chance to kayak
    or hike among many people, visit icebergs, and even camp overnight.


    The Polar Cruises website at www.polarcruises.com provides more information for
    prospective Antarctica visitors.


    The British Antarctic Survey offers a piece of advice for visitors: "Do not walk
    onto glaciers or large snowfields unless properly trained."'
