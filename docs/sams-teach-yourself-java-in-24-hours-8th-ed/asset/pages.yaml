  md: 'GridLayout places all components as they are added into a place on a grid.
    Components are added from left to right until a row is full, and then the leftmost
    column of the next grid is filled.


    The following statements create a container and set it to use a grid layout that
    is two rows wide and three columns tall:


    ```

    GridLayout grid = new GridLayout(2, 3);

    setLayout(grid);

    ```


    Figure 18.2 shows what the Crisis application would look like if it used grid
    layout.


    ![](img/d09a156b28ce3a26efd211fe0a9c6991_261_0.png)


    FIGURE 18.2

    Arranging components using grid layout.


    # The BorderLayout Manager


    The BorderLayout class, also in java.awt, arranges components at specific positions
    within the container that are identified by one of five directions: north, south,
    east, west, or center.


    The BorderLayout manager arranges components into five areas: four denoted by
    directions and one for the center area. When you add a component under this layout,
    the add() method includes a second argument to specify where the component should
    be placed. This argument should be one of five class variables of the BorderLayout
    class: NORTH, SOUTH, WEST, and CENTER used for this argument.


    The GridLayout class, BorderLayout devotes all available space to the components.
    The component placed in the center is given all the space that isn''t needed for
    the four border components, so it''s usually the largest.


    The following statements create a container that uses border layout:


    ```

    BorderLayout crisisLayout = new BorderLayout();

    setLayout(crisisLayout);

    add(panicButton, BorderLayout.NORTH);

    add(dontPanicButton, BorderLayout.SOUTH);

    ```'
