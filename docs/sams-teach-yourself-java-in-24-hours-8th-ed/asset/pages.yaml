    ```\npublic class Gremlin {\n    public int guid;\n    public String creator =\
    \ \"Chris Columbus\";\n    int maximumAge = 240;\n}\n```\n\nAll three variables\
    \ are attributes for the class: guid, maximumAge, and creator.\n\nPutting a statement\
    \ as public in a variable declaration statement is access control because it determines\
    \ how other objects from other classes can use that variable—or if they can use\
    \ it at all.\n\nMaking a variable public makes it possible to modify the variable\
    \ from another program that is using the Gremlin object.\n\nIf the other program\
    \ wants to assign another creator, for instance, it can change creator to that\
    \ value. The following statements create a Gremlin object called gizmo and set\
