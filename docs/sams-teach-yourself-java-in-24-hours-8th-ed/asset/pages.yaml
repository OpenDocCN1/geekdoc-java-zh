    # Copying a String with a New String


    Because computers take everything literally, it''s easy to confuse them. Although
    a human recognizes that the Ian Ziering and the text IAN ZIER refer to the same
    thing, computers would disagree. The equals() method discussed previously in this
    hour would state authoritatively that "Ian Ziering" is not equal to "IANIERING".


    To get around some of these obstacles, Java has methods that take a string variable
    and create another with all its uppercase or all lowercase, toUpperCase() and
    toLowerCase(), the following example shows the toUpperCase() method in action:


    ```

    String fin = "Ian Ziering";

    String change = fin.toUpperCase();

    ```


    This code sets the string variable change to the fin string converted to uppercase
    letters—“IAN ZIERING”. The toLowerCase() method works in the same fashion and
    returns an all-lowercase string value.


    Note that the toUpperCase() method does not change the case of the string variable
    it is. In the preceding example, the fin variable is still equal to "Ian Ziering".


    # Looking for a String


    Another common task when handling strings is to see whether one string can be
    found inside another. To use a string, use its indexOf() method. Put the string
    you are looking for inside the parentheses. If the string is not found, indexOf()
    produces the value -1. If it is found, indexOf() produces an integer that represents
    the position where the string begins.'
