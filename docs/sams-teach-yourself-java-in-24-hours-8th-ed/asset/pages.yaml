  md: '# Creating an Android App


    Android apps are ordinary java programs that use an application framework, a core
    set of classes and files that all apps have in common. The framework embodies
    a set of rules for how apps must be structured in order to run properly on Android
    devices.


    To get started writing apps, you must install Android Studio. To download the
    software, visit https://developer.android.com. Run the installation wizard and
    follow the instructions to set up the software on your computer.


    To begin using the IDE on a project:


    +   1. Run Android Studio.


    +   2. In the dialog that appears at startup, choose Start a New Android Project.
    The Create New Project wizard opens, as shown in Figure 24.1.


    ![](img/d09a156b28ce3a26efd211fe0a9c6991_374_0.png)


    FIGURE 24.1

    Creating a new Android project in Android Studio.'
