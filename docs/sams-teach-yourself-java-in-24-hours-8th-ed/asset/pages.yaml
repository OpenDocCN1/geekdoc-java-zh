  md: 'To create an array that has two dimensions, you must use an additional set
    of square brackets when creating and using the array, as in these statements:


    ```

    boolean[] selectedPoint = new boolean[50][50];

    selectedPoint[4][13] = true;

    selectedPoint[7][6] = true;

    selectedPoint[11][22] = true;

    ```


    This example creates an array of Boolean values called selectedPoint. The array
    has 50 elements in its first dimension and 50 elements in its second dimension,
    so there are 2,500 individual array elements (50 × 50). When the array is created,
    each element gives the default value of false. Three elements are the value true:
    a point at the (x,y) position of 4,13, one at 7,6, and one at 11,22.


    Arrays can have as many dimensions as you need, but keep in mind that they can
    take up a lot of memory. Creating the 50 by 50 selectedPoint array was equivalent
    to creating 2,500 individual variables.


    # # Sorting an Array


    When you have grouped a bunch of items together into an array, one thing you can
    do is rearrange them. The following swaps the values of two elements in an integer
    array called numbers:


    ```

    int[] numbers = {3, 7, 9, 12, 5, 0, 8, 19 };

    int temporary = numbers[5];

    numbers[5] = numbers[6];

    numbers[6] = temporary;

    ```


    These results result in numbers[5] and numbers[6] trading values with each other.
    The integer variable called temporary is used as a temporary storage place for
    one of the values being swapped. Sorting is the process of arranging a list of
    related items into a set order, such as when a list of numbers is sorted from
    lowest to highest.


    Santa Claus could sort to arrange the order of gift recipients by last name with
    Willie Aames and Hank Aaron ranking in the Yuletide plunder much earlier than
    alphabetical unfortunate Steve Zahn and Mark Zuckerberg.


    Sorting an array is easy in Java because the Arrays class does all the work. Arrays,
    which is part of the java.util group of classes, can rearrange arrays of any variable
    types.'
