  md: '# Writing a Mod that Can Build Things


    To guard against bad input from a user, you put parseDouble() inside a try-catch
    block. A NumberFormatException occurs when the user''s value isn''t numeric.


    If the user''s value is a number, that becomes the radius. But there''s one more
    check: if conditional in Lines 23–25 that makes the radius falls into the acceptable
    range of values from 5 to 25.


    The IceCreamScoop class has a scoopTerrain() method that digs out the circle.


    Like other mods, this requires player, player location, and world objects.


    There are different techniques that could be used to dig out a circle around a
    player in a three-dimensional grid like the Minecraft World.


    This mod accomplishes it by looking at every block in a square around the player
    that has sides a little bigger than twice the radius. The center of the square
    is the spot where the player is standing.


    Three nested for that begin in Lines 47–49 loop through all the squares. There''s
    a loop for the X axis, for the Y axis, and one for the Z axis.


    A Location object is created to represent the spot''s being examined in one trip
    through the loop:


    ```

    loc = new Location(world, x, y, z);

    ```


    The player''s location was previously stored in the spot object in Line 43:


    ```

    Location spot = me.getLocation();

    ```


    Three statements measure the distance between the current spot and the player,
    on all three axes:


    ```

    double xd = x - spot.getX();

    double yd = y - spot.getY();

    double zd = z - spot.getZ();

    ```


    Using the Pythagorean Theorem, you can calculate the distance by squaring xD,
    yd, and zd, adding them together, and using the Math sqrt() to get the square
    root of that sum:


    ```

    double distance = Math.sqrt(xd * xd + yd * yd + zd * zd);

    ```


    If the distance from the current block to the player is within the player''s chosen
    radius, that block is turned into air with these two statements:


    ```

    Block current = world.getBlockAt(loc);

    current.setType(Material.AIR);

    ```


    First, a Block object is created that represents the block.'
