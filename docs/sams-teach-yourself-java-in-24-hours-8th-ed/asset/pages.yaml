  md: "This error reveals the name of the module that must be added to the project\
    \ to resolve the problem. in this example, it's jdk.incubator.http.\n\nModules\
    \ are set in a Java class called module-info in the default package (in other\
    \ words, a class with no package statement at).\n\nFollow these steps to add a\
    \ module to the Java24 project in NetBeans:\n\n+   * Choose File, New File, then\
    \ choose Java in the Categories pane.\n\n+   * In the File Types pane, choose\
    \ Java Module Info.\n\n+   * Choose Java Module Info, then click Next. The dialog\
    \ displays Class Name module-info and does not let a package name be chosen. Click\
    \ Finish.\n\nThe file module-info.java opens for editing the source code editor.\
    \ It only needs three statements of this form:\n\n```\nmodule Java24 {\n  requires\
    \ jdk.incubator.httpclient;\n}\n```\n\nThe module keyword is followed by Java24\
    \ because that's the project's name. If you were adding a module to a different\
    \ project, the statement should be revised accordingly.\n\nInside the module block\
    \ within the { and } squiggly brackets, the requires keyword is followed by the\
    \ module name jdk.incubator.httpclient. If your project requires a different module,\
    \ edit this statement to reflect that.\n\nA project can have more than one requires\
    \ statement.\n\nWhen the module-info.java file has been saved, the classes in\
    \ the module (or modules) can be used by any Java program in the project. The\
    \ import statements that add packages in that module will have no error and the\
    \ program can be compiled and run."
