  md: 'First Stop: Oracle 29


    More than 300


    Java was developed in 1990 by James Gosling as a language that would serve as
    the brains for smart appliances (interactive TVs, omniscient ovens, time-traveling
    Terminators, SkyNet military satellites that enslave mankind). Gosling was unhappy
    with the results he getting writing programs with a programming language called
    C++. In a burst of inspiration, he held up in his office and wrote a new language
    to suit his needs.


    Gosling named his new language Oak after a tree he saw from his office window.
    The language was part of his company’s strategy to make a fortune when interactive
    TV became a multimillion-dollar industry. That still hasn’t happened today (though
    Amazon, Apple, Roku, and others are making a game attempt), but something completely
    different took place for Gosling’s new language. As Oak was about to be scraped,
    the Web became popular.


    In a fortuitous circumstance, many qualities that made Gosling’s language good
    on his appliance project made it suitable for adaptation to the Web. His team
    devised a way for programs to run safely from web pages, and a catchy new name
    was chosen to accompany the language’s new purpose: Java.


    NOTE


    You might have heard that Java is an acronym that stands for Just Another Vague
    Acronym. You also might have heard that was named for Gosling’s love of coffee.


    The story behind Java’s naming contains contains no secret messages or declarations
    of liquid love. Java was chosen as the name for the same reason that the comedian
    Jerry Seinfeld likes to say the word salsa: It sounds cool.


    Although Java can be used for many other things, the Web provided the original
    showcase needed to seize the attention of the world’s software developers. When
    the language rose to prominence, you had to be in solitary confinement or a long-term
    orbital to avoid hearing about it.'
