  md: 'Instead of using probability to figure out this problem, the computer conducts
    drawings

    in rapid succession and doesn''t stop until there''s a winner. Because the 6-out-of-6
    win is

    extremely unlikely, the program also reports on any combination of three, four,
    or five

    winning numbers.


    The interface includes 12 text fields for lotto numbers and two check boxes labeled
    Quick Pick\and Personal. Six text fields, disabled for input, are used to display
    the winning numbers of each

    drawing. The other six text fields are for the user''s choice of numbers. Selecting
    the Quick Pick

    box six random numbers for a user. Selecting the Personal box enables the user
    to select

    desired numbers.


    Three buttons control the activity of the program: Stop, Play, and Reset. When
    the Play button is

    pressed, the program starts a thread called playing and generates Lotto.


    Pressing the Stop button stops the thread, and Reset clears all fields so the
    user can start

    over. You learn about threads in Hour 15, "Creating a Threaded Program."


    The LottoEvent class implements three interfaces: ActionListener, ItemListener,\and
    Runnable. The Runnable interface relates to threads and was covered in Hour 15.

    The listeners are used to listen to user events generated by the application''s
    buttons and check

    boxes. The program does not need to listen to any events related to the text fields
    because they

    are used strictly to store the user''s choice of numbers. The user interface handles
    this storage

    automatically.


    The class requires the use of the Swing package, javax.swing, and Java''s event-handling

    package, java.awt.event.


    The class has two instance variables:


    +   - gui, a LottoMadness object

    - playing, a Thread object used to conduct continuous lotto drawings


    The gui variable is used to communicate with the LottoMadness object that contains
    the

    program''s GUI. When you need to make a change to the interface or retrieve a
    value from one

    of its text fields, you use the gui object''s instance variables.


    For example, the play instance variable of LottoMadness represents the Play button.
    To

    disable this button in LottoEvent, you can use the following statement:


    ```

    gui.play.setEnabled(false);

    ```


    You can use the next statement to retrieve the value of the JTextField object
    got3:


    ```

    String got3value = gui.got3.getText();

    ```'
