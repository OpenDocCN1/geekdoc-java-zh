  md: 'The most common cause of this problem is that the server is running a different
    version of Minecraft than the client. In the server window, the first message
    indicates the version server is running. It says "Starting Minecraft version 1.8.7."


    The Minecraft client normally runs the up-to-date version. You can edit your profile
    to use an older version instead. Exit the Minecraft client completely. You need
    to reload it to change this.


    Run the client again and follow these steps to choose a different version in your
    profile:


    +   1. In the Minecraft Launcher dialog, click the Launch Options button, then
    click Add New.


    +   2. In the Version drop-down, choose Release 1.8.7.


    +   3. Click Save.


    +   4. Click Settings.


    +   5. Click the arrow on the green Play button, then choose Unnamed Configuration
    1.8.7.


    Click Play, and then Multiplayer. You should see your server with green connection
    bars.


    CAUTION


    Changing your player profile affects all Minecraft servers you use, including
    the ones you play when you''re not creating and testing mods. Make sure to change
    the configuration on the Play button back to the current version when you''re
    not connecting to your own Spigot server (or create a second player profile so
    one is for mod work and one is for playing).


    # Creating Your First Mod


    Now that you''ve got a Spigot server for Minecraft set up and running, you''re
    ready to begin developing mods for that server.


    Mods have to be packaged as Java archive files, also called JAR files. NetBeans,
    the free integrated development environment from Oracle used throughout this book,
    automatically creates JAR files every time you build a project.


    When you have finished writing mod, you will be adding to the server''s folder
    in a subfolder named plugins.


    This hour''s first mod is a simple one that demonstrates the framework in every
    mod you create for Spigot. The mod adds "/siamesecat" command to the game that
    creates a Siamese cat mob, adds it to the world, and makes you (the player) its
    owner.'
