  md: "+   Handle the exception with a try-catch block\n\n+   Throw the exception\n\
    \n+   Handle the exception with a try-catch block and then throw it\n\nUp to this\
    \ point in the hour, you have seen how to handle exceptions. If you would like\
    \ to throw an exception after handling it, you can use a throw statement followed\
    \ by the exception object to throw.\n\nThe following statements handle a NumberFormatException\
    \ error in a catch block, and then throw the exception:\n\n```\nfloat principal;\n\
    try {\n    principal = Float.parseFloat(loanText) * 1.1F;\n} catch (NumberFormatException\
    \ e) {\n    System.out.println(arguments[0] + \" is not a number.\");\n    throw\
