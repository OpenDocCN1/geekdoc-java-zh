  md: '# 300  HOUR 20: Reading and Writing Files


    After you have an output stream, you can call different write() methods to write
    bytes to it:


    +   Call write() with a byte as its only argument to write that byte to the stream.


    +   Call write() with a byte array as its only argument to write all the array''s
    bytes to the stream.


    +   Specify three arguments to the write(byte[], int, int) method: a byte array,
    an integer representing the first element of the array to write to the stream,
    and the number of bytes to write.


    The following statement creates a byte array with 10 bytes and writes the last
    4 to an output stream:


    ```

    File dat = new File("data.dat");

    OutputStream datStream = new FileOutputStream(dat);

    byte[] data = new byte[] { 5, 12, 4, 13, 3, 15, 2, 17, 1, 18 };

    datStream.write(data, 6, 4);

    ```


    When writing bytes to a stream, you can convert an array of bytes by calling the
    String object''s getBytes() method, as in this example:


    ```

    String name = "Puddin N. Tane";

    byte[] nameBytes = name.getBytes();

    ```


    After you have finished writing bytes to a stream, you close it by calling the
    stream''s close() method.


