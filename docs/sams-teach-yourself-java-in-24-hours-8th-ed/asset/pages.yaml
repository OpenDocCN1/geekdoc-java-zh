    # Summary


    In all the years I''ve been writing Java programs and teaching people how to use
    this language, I never expected that I would put those skills to work making a
    zombie ride for a horse.


    Or the horse would buck that zombie if not trained.


    Or the zombie would immediately catch fire because the sun was out.


    Or you could dig a hole so large you fell out of the world.


    This is the *funnest* kind of Java programming. I know that''s not a word, but
    it should be one, and it should be used despite putting your own Java objects
    into a three-dimensional world where you fight monsters, dungeons, build houses,
    and dodge the logic of the living dead.


    Minecraft is also an excellent way to learn object-oriented programming, one of
    the toughest aspects of the language to master. Everything you do in Java is accomplished
    with objects. You create them with constructors, give them knowledge in instance
    variables, and tell them to do things by calling methods. Objects indicate the
    tasks they can perform by implementing interfaces.


    All these concepts directly relate to mod programming. Need a zombie? Create a
    *Zombie* object. Want the player to move to a new spot? Call his `teleport()`
    method. Did you lose your horse? Call its `getLocation()` method.


    So as deep you get into Minecraft programming as you like. You''re going to be
    able to use these skills far beyond the realm of creepers and wither skeletons
    and pig zombies.


    # Workshop


    # Q&A


    +   Q. I made an enormous mess of my server''s world with the IceCream mod. How
    can I start over?


    +   A. The Minecraft server makes it easy to create a new world from scratch or
    switch from one world to another.


    To start and delete the old world, stop the server, open the Minecraft server''s
    folder, and delete the world subfolder. When you start the server, Minecraft figures
    out the world is gone and creates a new one. This process is a little slower than
    usual. The server log explains what it is doing.'
