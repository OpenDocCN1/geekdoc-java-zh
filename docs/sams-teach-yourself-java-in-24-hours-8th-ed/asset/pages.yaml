  md: '# Exceptions


    Although you are learning about them now, you have probably become well acquainted
    with exceptions during the previous 13 hours. These errors turn up when you write
    a Java program that compiles successfully but encounters a problem as it runs.


    For an example, a common programming mistake is to refer to an element of an array
    that doesn''t exist, as in the following statements:


    ```

    String[] greek = { "Alpha", "Beta", "Gamma" };

    System.out.println(greek[3]);

    ```


    The array greek has three elements. Because the first element of an array is numbered
    0 rather than 1, the first is greek[0], the second greek[1], and the third greek[2].
    This makes the statement attempting to display greek[3] erroneous. The preceding
    statements compile successfully, but when you run the program, the Java Virtual
    Machine halts with a message as the following:


    # Output ▼


    ```

    Exception in thread "main" java.lang.ArrayIndexOutOfBoundsException: 3

    at SampleProgram.main(SampleProgram.java:4)

    ```


    This message indicates that the application has generated an exception, which
    the JVM noted displaying an error message and stopping the program.


    The error message refers to a class ArrayIndexOutOfBoundsException in the java.lang
    package. This class is an exception, an object that represents an exceptional
    circumstance that has taken place in a program.


    Exception handling is a way that classes communicate with each other in the event
    of an error or other unusual circumstance.


    When a Java class encounters an exception, it alerts users of the class to the
    error. In this example, the user of the class is the JVM.


    # NOTE


    Two terms are used to describe this process: throw and catch. Objects throw exceptions
    to alert other objects that they have occurred. These exceptions are caught by
    other objects or by the Java Virtual Machine.


    All exceptions are subclasses of Exception in the java.lang package. The ArrayIndexOutOfBoundsException
    does what you would expect—it reports that an array element has been accessed
    outside the array''s boundaries.'
