  md: '# Quiz


    The following questions test your knowledge of objects and the programs that use
    them.


    +   1. What statement is used to enable one class to inherit from another class?


    +   A. inherits


    +   B. extends


    +   C. handItOverAndNobodyGetsHurt


    +   2. Why are compiled Java programs saved with the .class file extension?


    +   A. Java''s developers think it''s a class language.


    +   B. It''s a subtle tribute to the world''s teachers.


    +   C. Every Java program is a class.


    +   3. What are the two things that make up an object?


    +   A. Attributes and behavior


    +   B. Commands and data files


    +   C. Spit and vinegar


    # Answers


    +   1. B. The extends statement is used because the subclass is an extension of
    the attributes and behavior of the superclass and of any superclasses above that
    in the class hierarchy.


    +   2. C. Your programs are always made up of at least one main class and any
    other classes that are needed.


    +   3. A. In a way, B is also true because commands are comparable to behavior,
    and data files are analogous to attributes.


