- img_proc: true
  md: 'An array is a group of related variables that share the same type. Any type
    of information that can be stored as a variable can become the items stored in
    an array. Arrays can be used to keep track of more sophisticated information than
    a single variable, but they are almost easy to create and manipulate.


    # # Creating Arrays


    Arrays are variables grouped together under a common name. The term array should
    be familiar to you—think of a spokeswoman showing off her array of products or
    a game with a dazzling array of prizes. Like variables, arrays are created by
    stating the type of variable organized into the array and the name of the array.
    A pair of square brackets [] follow the type to distinguish arrays from variables.


    You can create arrays for any type of information that can be stored as a variable.
    The following statement creates an array of string variables:


    ```

    String[] naughtyChild;

    ```


    Here are two statements that create arrays of integers and Boolean values, respectively:


    ```

    int[] reindeerWeight;

    boolean[] hostileAirTravelations;

    ```


    > NOTE


    Java is flexible about where the square brackets are placed when an array is created.
    You can put them after the variable instead of the variable type, as in the following:

    String niceChild[];


    To make arrays easier to spot in your programs (for humans), you should stick
    to one style rather than switching back and forth. Programs that use arrays in
    this way always place the brackets before the variable or object type.


    The previous examples create arrays to hold values, but do not store any values
    in them. To do this, you can use the new keyword with the variable type, or store
    values in the array within ( ) marks. When using new, you must specify how many
    different items are stored in the array. Each item in an array is called an element.
    The following statement creates an array and sets aside space for the values that
    it holds:


    ```

    int[] elfSeniority = new int[25];

    ```


    This example creates an array of integers called elfSeniority. The array can store
    the months that each of Santa''s elves has been employed at the Pole. (If Santa
    runs a union shop, this information is extremely important to track.)'
