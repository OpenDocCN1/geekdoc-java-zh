  md: 'In Hour 24, "Writing Android Apps," you will use the Android Studio IDE. Google,
    which created Android, recommends free tool to Java programmers who are creating
    programs for Android.


    # # Installing a Java Development Tool


    Every hour of this book includes Java programming projects you can undertake to
    enhance your knowledge of the subject matter while it percolates in your brain.


    You can''t do any of that percolating if you lack a Java programming tool on your
    computer.


    If you have already installed a tool that supports Java, you can use it to develop
    the tutorial programs in the next 23 hours. However, you should already have some
    familiarity with how to use the tool. Learning Java and a complex IDE at the same
    time can be daunting.


    The recommended choice for programming as you read this book is NetBeans, which
    is free from Oracle''s website at http://netbeans.com. Though NetBeans has advanced
    features that take time to learn, it makes easy to create and run simple Java
    applications.


    To find out how download and install NetBeans, read Appendix A, "Using the NetBeans
    Integrated Environment."


    # # Summary


    During this hour, you were introduced to the concept of programming a computer—giving
    it a set of instructions called statements that tell it what to do. You also learned
    why you made a good call choosing to teach yourself Java instead of another programming
    language.


    You might also have downloaded and installed a Java development tool to use on
    the programs you create in the hours to come.


    Ask 10 programmers for the best programming language and you may get 10 answers,
    complete with "my language can beat your language" taunts and "your source code
    is so bloated" jokes. Java scores highly in such arguments because it is widely
    adopted, extremely versatile, and smartly designed. You can accomplish a lot with
    this language, and it makes learning others a little easier.


    If you are still confused about programs, programming languages, or Java in general,
    don''t panic. Everything will begin to make sense in the next hour, "Writing Your
    First Program," which gently steps through the process of creating a Java program.'
