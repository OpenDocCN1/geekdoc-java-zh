    # Other Numeric Variable Types


    The types of variables you have been introduced to so far are the main ones you
    will use for most of your Java programming. You can employ a few other types of
    variables in less common circumstances.


    One is byte, which holds integers that range from -128 to 127. The following statement
    creates a variable escapeKey with an initial value of 27:


    ```

    byte escapeKey = 27;

