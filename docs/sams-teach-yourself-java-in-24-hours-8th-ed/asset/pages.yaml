  md: '# Choosing a Language


    Android apps, and more, running on Windows, Mac, Linux, and other operating systems.
    The versatility is referenced by the ambitious early Java slogan “Write once,
    run anywhere.”


    # NOTE


    Early Java programmers had a less flattering slogan: “Write once, debug everywhere.”
    The language has come a long way, baby, baby, since the first version was released
    in 1996.


    Another important advantage is that Java requires a highly organized approach
    for getting programs to work. You must be particular about how you write programs
    and how they store and alter data.


    When you start writing programs, you might not see the language''s persnickety
    behavior as an advantage. You might tire of writing a program and having several
    errors to fix before the program can run. The benefit of this extra effort is
    that the software is more reliable, useful, and error-free.


    In the coming hours, you will learn all of Java''s rules and the pitfalls to avoid.


    Java was invented by the Canadian scientist James Gosling as a better way to create
    computer programs. While working at Sun Microsystems in 1991, Gosling was unhappy
    with the C++ programming language was performing on a project, so he created a
    new language that did the job better. It''s a matter of contentious debate whether
    Java is superior to other programming languages, of course, the success of the
    language demonstrates the strength of its initial design. Fifteen billion devices
    across the running Java, a number so amazing I am going to repeat it. Fifteen
    billion! More than 1,000 books have been published about the language since its
    introduction. (This is my twelfth).


    Regardless of whether Java is the best language, it is definitely a great language
    to learn. Your first chance to try out during Hour 2, “Writing Your First Program."


    Learning one programming language makes it easier to learn subsequent languages.
    Many are similar to each other, so you aren''t starting from scratch when you
    plunge into a new one. For instance, many C++ and Smalltalk programmers find it
    easy to learn Java because Java borrows ideas from earlier languages. Similarly,
    C# adopts many ideas from Java, so it is easier to pick up for Java programmers.


    # NOTE


    C++ is mentioned several times this hour, so you might be tripping over the term,
    wondering what it means—and how it''s pronounced. C++ is pronounced “C-Plus-Plus,”
    and it''s a programming language developed by Danish computer scientist Bjarne
    Stroustrup at Bell Laboratories. C++ is an enhancement of the C programming language,
    hence the Plus-Plus part of the name. Why not just call it C++? The Plus-Plus
    part is a computer joke you''ll understand later in this book.'
  merge: -1
