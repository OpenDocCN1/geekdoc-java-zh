    \ in the try block and throw them:\n\n```\nfloat principal;\ntry {\n    principal\
    \ = Float.parseFloat(loanText) * 1.1F;\n} catch (Exception e) {\n    System.out.println(\"\
    Error \" + e.getMessage());\n    throw e;\n}\n```\n\nException is the parent of\
    \ all exception subclasses. A catch statement will catch the class and any subclass\
    \ below it in the class hierarchy.\n\nWhen you throw an exception with throw,\
    \ it generally means you have not done everything that needs to be done care of\
    \ the exception.\n\nAn example of where this might be useful: Consider a hypothetical\
    \ program called CreditCardChecker, an application that verifies credit card purchases.\
    \ This application uses a class called Database, which has the following job:\n\
    \n+   Make a connection to the credit card ledger's computer.\n\n+   Ask that\
