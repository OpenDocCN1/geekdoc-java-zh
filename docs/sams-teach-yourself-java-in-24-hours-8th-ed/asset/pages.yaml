  md: "# 294 HOUR 20: Reading and Writing Files\n\nMethods that read or write files\
    \ can fail with an IOException if there's an error accessing the file. Many of\
    \ the methods associated with reading and writing files generate this exception,\
    \ so a try-catch block is often used. This exception belongs to the java.io package.\n\
    \nStreams are one of the resources in Java that must be closed when they're no\
    \ longer used. Leaving a stream open is a significant drain on resources in the\
    \ JVM as a program.\n\nA special try statement try-with-resources makes it easy\
    \ to ensure that a resource, such as a file input stream, will be closed when\
    \ it's no longer needed. The try statement is followed by parentheses. Inside\
    \ the parentheses are one or more Java statements that declare variables that\
    \ read or write data through a resource.\n\nHere's an example that reads a file\
    \ called cookie.web using a file input stream named stream:\n\n```\nFile cookie\
    \ = new File(\"cookie.web\");\ntry (InputStream stream = new FileInputStream(cookie))\
    \ {\n    System.out.println(\"Length of file: \" + cookie.length());\n} catch\
    \ (IOException ie) {\n    System.out.println(\"Could not read file.\");\n}\n```\n\
    \nBecause stream is in the try statement, the stream is closed automatically when\
    \ the try-catch block completes (if it hasn't been).\n\nFile input streams read\
    \ data in bytes. You can read a single byte by calling the stream's read() method\
    \ without an argument. If no more bytes are available in the stream you have reached\
    \ the end of the file, a byte value of -1 is returned.\n\nWhen you read an input\
    \ stream, it begins with the first byte in the stream, such as the first byte\
    \ in a file. You can skip some bytes in a stream by calling its skip() method\
    \ with one argument: an int representing the number of bytes to skip. The following\
    \ statement skips the next 1,024 bytes in a stream named scanData.skip(1024);\n\
    \nIf you want to read more than one byte at a time, do the following:\n\n+   -\
    \ Create a byte array that is exactly the size of the number of bytes you want\
