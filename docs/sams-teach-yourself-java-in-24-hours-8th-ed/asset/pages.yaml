  md: 'There are hundreds of exceptions in Java. Many such as the array exception
    indicate a problem that can be fixed with a programming change. These are comparable
    to compiler errors. After you correct the situation, you don''t have to concern
    yourself with the exception any longer.


    Other exceptions must be dealt with every time a program runs by using five new
    keywords: try, catch, finally, throw, and others.


    # Catching Exceptions in a try-catch Block


    Up to this point, you have dealt with exceptions by fixing the problem that caused
    them. There are times you can''t deal with an exception in that manner and must
    handle the issue within a Java class.


