    Creating a File object doesn''t create a file on your computer. It''s just a reference
    to a file that may or not yet exist.


    When you have a File object, you can call several useful methods on that object:


    +   - exists()--true if the file exists, false otherwise

    - getName()--The name of the file, as a String

    - length()--The size of the file, as a long value

    - createFile()--Creates a file of the same name, if one does not exist already

    - delete()--Deletes the file, if it exists

    - renameTo(File)--Renames the file, using the name of the File object specified
    as an argument


    You can also use a File object to represent a folder on your system rather than
    a file. Specify the folder name in the File constructor, which can be absolute
    (such as C:\Documents\) or relative (such as java\database).


    After you have object representing a folder, call its listFiles() method to see
    what''s inside the folder. This method returns an array of File objects representing
    every file and subfolder it contains.


