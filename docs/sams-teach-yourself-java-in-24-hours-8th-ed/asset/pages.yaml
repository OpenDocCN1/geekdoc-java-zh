    \ This requires the super keyword, as in the following statements:\n\n```\npublic\
    \ DataReader(String name, int length) {\n  super(name, length);\n}\n```\n\nThis\
    \ example is the constructor of a subclass, which is using the statement super(name,\
    \ length) to call a comparable constructor in its super.\n\nIf you don't use super()\
    \ to call a constructor in the super, Java automatically calls super() with no\
