  md: '# Teaching Zombies to Ride Horses 359


    A loop that begins in Line 26 loops once for each zombie-horse pair.


    Their location is set by calling the Location() constructor with four arguments:
    the game world, x coordinate, and z coordinate.


    ```

    Location horseSpot = new Location(world,

    spot.getX() + (Math.random() * 15),

    spot.getY() + 20,

    spot.getZ() + (Math.random() * 15));

    ```


    The player''s location in the spot variable is used to pick a location for each
    zombie horse. For the x coordinate, the player''s getX() coordinate is retrieved
    and a random number from 0 to 14 is added. For the z coordinate, getY() and a
    random number from 0 to 14 are added. The y coordinate, 20 is added.


    This means that the mobs will appear 20 blocks above the player in the sky and
    within 14 blocks in the other two directions.


    Horses and zombies are created as ocelots. The world''s spawn() method with the
    mob''s location and its class, which is Horse for horses and Zombie for zombies.


    Every mob that can be ridden in Minecraft has a setPassenger() method, which takes
    the rider as the argument:


    ```

    horse.setPassenger(zombie);

    ```


    If you stopped here, the zombie would appear on the horse, but the horse would
    quickly buck it off. This can be prevented by making the player that horse''s
    owner:


    ```

    horse.setOwner(me);

    ```


    A tamed horse does not buck its rider, even if the rider is a zombie that hungers
    for human brains. When you create a mob, it inherits the default behavior of that
    mob from the game.


    Like ocelots, horses can be customized in several ways. One is to give the horse
    a different color coat by calling its setColor() method. There are seven possibilities.


    After a random number from 0 to 6 is generated, that is used in a switch-case
    statement in Lines 38–59 to set that horse''s color.


    To make the horse a little crazy, you can customize its speed as well. The effects
    of a game potion can be applied to a mob. There are 23 different effects, which
    are indicated by the PotionEffectType class.


    A potion effect is created by calling the PotionEffect constructor with three
    arguments: the effect type, the duration the potion should be in, and the value
    of that effect.'
