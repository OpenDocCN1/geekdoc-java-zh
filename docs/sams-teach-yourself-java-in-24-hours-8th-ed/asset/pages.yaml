  md: '# Array Lists


    In Hour 9, "Storing Information with Arrays," you were introduced to arrays, which
    are extremely handy way to work with groups of variables and objects in programs.
    Arrays are so essential to Java that they have a built-in data type like integers
    and characters. An array packages together elements of the same type or class.


    As arrays can be, they are limited by the fact that the size of an array does
    not change. After an array is created to hold 90 elements, it can''t be altered
    to hold a larger or smaller size. This is fixed. The fancy way of saying this
    is to call the array size "immutable."


    There''s a class in the java.util package that does everything an array can do
    without that limitation: ArrayList.


    An list is a data structure that holds objects of the same class or a common superclass.
    The list can grow or shrink as needed while a program is running.


    The simplest way to create an array is by calling its constructor with no arguments:


    ```

    ArrayList servants = new ArrayList();

    ```


    Array lists can be created by specifying an initial capacity, which provides some
    guidance on how many elements the list hold. The capacity is set as an integer
    to the constructor, as in this statement that sets an array''s capacity to 30:


    ```

    ArrayList servants = new ArrayList(30);

    ```


    Although this looks a lot like creating an array and determining its exact size,
    it is just a hint. If the capacity is exceeded, the array will be adjusted accordingly
    and continue to function properly. The better you estimate the capacity, the more
    efficient the list will be as the program runs.


    The list holds objects that belong to the same class or share a superclass.


    When you create an array list, you know the class or superclass it is intended
    to hold. This can be specified in the constructor with < and >, a feature of Java
    called generics. Here''s an improvement of the constructor for a list that holds
    String objects:


    ```

    ArrayList<String> servants = new ArrayList<String>();

    ```


    This statement creates an array list of String objects. Only that class or a subclass
    can be stored in the list. Otherwise, the compiler detects an error.


    To add an object, call the array''s add(Object) method with that object as the
    argument. Here are statements that add five strings:


    ```

    servants.add("Bates");

    ```


    ```

    servants.add("Anna");

    ```'
