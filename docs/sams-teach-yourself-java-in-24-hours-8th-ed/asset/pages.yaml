  md: '# Summary


    Inner classes, anonymous inner classes, and lambda expressions are among the complex
    parts of the Java language to learn. They appeal primarily to programmers who
    have been writing programs in the language for while can take advantage of powerful
    features to accomplish more in fewer lines of code.


    But even before you reach a point where you are writing your lambda expressions,
    you should be able to benefit from the use of inner classes and anonymous inner
    classes.


    A non-anonymous inner class is structured like a separate helper class, but it''s
    placed inside another class alongside the instance variables, class variables,
    instance methods, and class methods. Unlike a helper class, it can access the
    private variables and methods of the class that it is created inside.


    An anonymous inner class removes the need to devote an object to a class that''s
    only used once, such as an event listener attached to a user interface component
    in Swing.


    Lambda expressions are deceptively simple in appearance, requiring only a new
    arrow operator -> to create. But the implications of what they enable a Java programmer
    to be enormous. Programmers with experience in other languages have been clamoring
    for this functionality for years.


    # Workshop


    # Q&A


    +   Q. Anonymous inner classes are confusing. Do I have to use them in my programs?


    +   A. No. As other complex features of the Java language, you don''t have to
    use them if you can get the job done some other way.


    But you should learn them anyway, because you''re likely to encounter them in
    Java code.


    When you look at the Java programs written by experienced programmers, you often
    find both inner classes and anonymous inner classes. So if you''re not ready to
    create yourself, it''s worthwhile to learn what they are and how they work.


    +   Q. Are the Hatfields and McCoys still fighting?


    +   A. The West Virginia and Kentucky families are on good terms 126 years after
    the last casuality in their 35-year conflict.


    In 1979, Hatfields and McCoys got together to play the TV show Family Feud for
    a week. A pig was kept on stage and awarded to the winning family.


    In 2003, a formal peace treaty was reached between the families in Pikeville,
    KY.'
