  md: 'When you run a Java application, the Java Virtual Machine (JVM) looks for a
    main() block and starts handling Java statements within that block. If your program
    does not have a main() block, the JVM responds with an error.


    The statement Math.sqrt(number) in line 9 demonstrates a built-in capability of
    the Java language—the ability to determine the square root of a number. There
    is a Java program named Math that has a method called sqrt() to find a specific
    number''s square.


    The Math program is part of the Java Class Library, which you explore later this
    hour.


    # Sending Arguments to Applications


    You can run Java applications from a command line using java, a program that invokes
    the JVM. NetBeans uses this program before the scenes when you run programs. When
    a Java program is run as a command, the JVM loads the application. The command
    can include extra items of information, as in this example:


    ```

    java TextDisplayer readme.txt /p

    ```


    Any extra information sent to a program is called an argument. The first argument,
    if there is one, provided one space after the name of the application. Each additional
    argument also is separated by a space. In the preceding example, the arguments
    are readme.txt and /p.


    If you want to include a space inside an argument, you must put quotation marks
    around it, as in the following:


    ```

    java TextDisplayer readme.txt /p "Page Title"

    ```


    This example runs the TextDisplayer program with three arguments: readme.txt,
    /p, and "Page Title". The quotation marks prevent Page and Title from being treated
    as separate arguments.


    You can send as many arguments as you want to a Java application (within reason).
    To do something with them, you must write statements in the application to handle
    them.


    To see how arguments work in an application, create a new class in the Java24
    project:


    +   1. Choose File, New File.


    +   2. In the New File Wizard, choose the category Java and file type Empty Java
    File.


    +   3. Give the class name BlankFiller, the package com.java24hours, and click
    Finish.


    Enter the text of Listing 4.2 in the source code and edit it when you''re done.
    Compile the program, correcting any errors that are flagged by the editor as you
    type.'
