  md: '# HOUR 19: Responding to User Input


    Second, the class must use the implements keyword to declare that it supports
    one or more listening interfaces. The following statement creates a class that
    uses ActionListener, an interface for responding to button and menu clicks:


    ```

    public class Graph implements ActionListener {

    ```


    EventListener interfaces enable a component of a GUI to generate user events.
    Without one of the listeners in place, a component cannot do anything that can
    be heard by other parts of a program. A program must include a listener interface
    for each type of component to which it listens. To have the program respond to
    a mouse click on a button or the Enter key being pressed in a text field, you
    must include the ActionListener. To respond to the use of a list or check box,
    you must use the ItemListener interface.


    When you require more than one in the same class, separate your names with commas
    after the implements keyword, as in this code:


    ```

    public class Graph implements ActionListener, MouseListener {

    // ...

    }

    ```


    # Setting Up Components to Be Heard


    After you have implemented the interface required for a particular component,
    you must cause that component to generate user events. The ActionListener interface
    listens for action events, such as a button click or the Enter key being pressed.


    To make a JButton object generate an event, employ the addActionListener() method,
    in the following statements:


    ```

    JButton fireTorpedos = new JButton("Fire torpedoes");

    fireTorpedos.addActionListener(this);

    ```


    This code creates the fireTorpedos button and calls the button''s addActionListener()
    method. The this keyword used as an argument to the addActionListener() method
    indicates the current object which receives the event and handles it as needed.


    # NOTE


    The this keyword confuses a lot of readers when it is first introduced. this refers
    to the object in which the keyword appears. So, if you create a LottoMadness class
    and use this in a statement inside that class, it refers to the LottoMadness object
    executing the code.'
