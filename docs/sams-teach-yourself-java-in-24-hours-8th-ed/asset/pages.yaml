    \ expressions.\n\n+   1. What makes some inner classes anonymous?\n   A. They\
    \ implement an interface.\n   B. They aren’t given a name.\n   C. Both.\n2. What's\
    \ another name for an interface that contains only one method?\n   A. Abstract\
    \ interface\n   B. Class\n   C. Functional interface\n3. What is it called when\
    \ a lambda expression guesses the class of an argument to a method?\n   A. Target\
    \ typing\n   B. Type casting\n   C. Class inference\n\n# # Answers\n\n+   1. C.\
    \ An anonymous inner class implements an interface with the new keyword, skipping\
    \ the creation and naming of a class that implements it.\n2. C. Functional interface,\
    \ as of Java 8. They were called single abstract method interfaces in earlier\
    \ versions of the language.\n3. A. Target typing can infer the class of any functional\
    \ interface method argument."
