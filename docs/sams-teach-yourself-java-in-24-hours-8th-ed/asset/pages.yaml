  md: '# HOUR 8

    Repeating an Action with Loops


    This Hour''s To-Do List:


    +   - Use the for loop.

    - Use the while loop.

    - Use the do-while loop.

    - Exit a loop prematurely.

    - Name a loop.


    One of the more annoying punishments for schoolchildren is to make them write
    something over and again on a chalkboard. The Simpsons, in one of his frequent
    trips to the board, Bart Simpson had to write, “I will stop asking when Santa
    goes to the bathroom," dozens of times. This punishment might work on children
    but would be completely useless on a computer. A computer program can repeat a
    task with ease.


    Programs are ideally suited to do the same thing over and because of loops. A
    loop is a statement or block that is repeated in a program. Some loops run a fixed
    number of times. Others run indefinitely.


    There are three loop statements in Java: for, do, and while. Each can work like
    the others, but it''s beneficial to learn how all three operate. You often can
    simplify a loop section of a program by choosing the right statement.


    # for Loops


    In your programming, you find many circumstances in which a loop is useful. You
    can use it to keep doing something several times, such as when an antivirus program
    opens each new email as it comes to look for viruses. You can also use loops to
    cache the computer to do nothing for a brief period, such as an animated clock
    that moves a minute hand once per minute.'
