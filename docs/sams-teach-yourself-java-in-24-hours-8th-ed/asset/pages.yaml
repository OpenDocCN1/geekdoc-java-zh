- img_proc: true
  md: '![](img/d09a156b28ce3a26efd211fe0a9c6991_128_0.png)


    # ### FIGURE 10.1


    A pie chart produced by a Java program.


    Each object has things that make it different from other objects. Pie charts are
    circular, whereas bar graphs represent data as a series of rectangles. A pie chart
    is an object that is made up of smaller objects—individual slices of different
    colors, a legend identifying what each slice represents, and a title. If you break
    down computer programs in the same way a pie chart is broken down, you''re engaging
    in OOP.


    In OOP, an object contains two things: attributes and behavior. Attributes are
    things that describe the object and show how it is different from other objects.
    Behavior is what an object does.


    You create objects in Java by using a class as a template. A class is a master
    copy of the object that determines the attributes and behavior an object should
    have. The term class should be familiar to you because Java programs are called
    classes. Every program you create with Java is a class that you can use as a template
    for the creation of new objects. As example, any Java program that uses strings
    is using objects created from the String class. This class contains attributes
    that determine what a String object is and behavior that determines what String
    objects can do.'
