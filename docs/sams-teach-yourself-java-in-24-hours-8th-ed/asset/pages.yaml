    What''s a Chris Steak House, and which does Ruth have one?


    +   Ruth''s Chris Steak House, the chain of more than 130 upscale steak restaurants
    across the United States and a handful of other countries, has an odd-two-first-name
    name that reveals its humble origins and the stubborn streak of its founder.


    The chain was founded in 1965 as a solitary New Orleans restaurant owned by Ruth
    Fertel, a single mother of two sons. Fertel saw a classified advertised for a
    restaurant sale and took out a $22,000 home mortgage to buy it (equivalent to
    around $150,000 in present dollars).


    She reached a deal to keep the name Chris Steak House with original owner Chris
    Matulich, but later had to relocate after a kitchen fire.


    Fertel''s contract did not permit her to use the Chris Steak House name anywhere
    but the original location, so she renamed Ruth''s Steak House. Though she had
    no restaurant or culinary expertise, the business was so successful that she began
    opening it as a franchise within 12 years. She disregarded several suggestions
    over the years to change the name to broaden its appeal.


    > "I''ve always hated the name," she once told a reporter for Fortune magazine,
    "but we''ve always managed to work around it."


    Fertel, who died in 2002, was born on February 5, 1927—the same day that Matulich
    opened the original steakhouse.


