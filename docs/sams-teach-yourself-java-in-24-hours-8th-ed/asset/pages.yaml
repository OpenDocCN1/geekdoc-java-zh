    \n# Anonymous Inner Classes\n\nA common task you undertake in Java programming\
    \ is to create a class that will be used only once and with a simple purpose.\
    \ A special kind of inner class is perfect for this purpose.\n\nAn anonymous inner\
    \ class is one that has no name and is declared and created at the same time.\n\
    \nTo use one, you replace a reference to an object with the new keyword, a call\
    \ to a constructor, and the class definition inside { and } characters.\n\nHere's\
    \ some code that does not use an anonymous inner class:\n\n```\nWorkerClass worker\
    \ = new WorkerClass();nThread main = new Thread(worker);\nmain.start();\n```\n\
    \nThe worker object presumably implements the Runnable interface and can be run\
    \ as a thread.\n\nIf the code in WorkerClass is short and simple, and the class\
    \ only needs to be used once, it could be worthwhile to put it in an anonymous\
    \ inner class. Here's a new version to do that:\n\n```\nThread main = new Thread(new\
    \ Runnable() {\n    public void run() {\n        // thread's work to perform goes\
    \ here\n    }\n});\nmain.start();\n```"
