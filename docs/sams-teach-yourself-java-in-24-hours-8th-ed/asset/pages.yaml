  md: 'There are several layout managers you can use to affect how components are
    shown. The default layout manager for panels is the FlowLayout class in the java.awt
    package, which was used during the previous hour.


    Under FlowLayout, components are dropped onto an area in the same way words are
    organized on a page in English—from left to right and down to the next line when
    there''s no more space.


    The following example could be used in a frame so that it flows layout when components
    are added:


    ```

    FlowLayout topLayout = new FlowLayout();\setLayout(topLayout);

    ```


    You can also set a layout manager to work within a specific container, such as
    a JPanel object. You can do this by using the setLayout() method of container
    object.


