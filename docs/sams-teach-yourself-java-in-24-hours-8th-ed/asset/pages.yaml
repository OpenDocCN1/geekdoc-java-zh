    +   A. Unless the publicly owned NFL team decides to hold another stock sale,
    the only way to become a stockholder is to inherit shares in a will.


    The Packers have sold stock in 1923, 1935, 1950, 1997, and 2011. Approximately
    360,000 people own five shares in the team, despite the fact that they have very
    limited rights associated with the stock.


    Holders don’t earn a dividend and can’t profit from their shares. They can only
    sell them back to the team and lose money in the deal. No individual can own more
