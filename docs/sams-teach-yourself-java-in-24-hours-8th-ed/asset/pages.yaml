  md: '# Telling the Computer What to Do


    A computer program, also called software, is a way to tell a computer to perform
    a task. Everything that the computer does, from booting up to shutting down, is
    done by a program. Mac OS X is a program; Minecraft is a program; the driver software
    controls your printer is a program; the dreaded blue screen of death on a crashed
    Windows PC is a program.


    Computer programs are made up of a list of commands the computer handles in a
    specific order when the program is run. Each command is a statement.


    If your house has its butler and you are a control freak with a Type-A personality,
    could give your servant a detailed set of instructions to follow every day, like
    this:


    +   Dear Mr. Jeeves,


    Please take care of these errands for me while I''m out asking Congress for a
    bailout:

    - Item 1: Vacuum the living room.

    - Item 2: Go to the store.

    - Item 3: Pick up soy sauce, wasabi, and as many California sushi rolls as you
    can carry.

    - Item 4: Return home.


    Sincerely, your lord and master,


    Bertie Wooster


    If you tell a human butler what to do, there''s a certain amount of leeway in
    how your requests are fulfilled. If California rolls aren''t available, Jeeves
    could bring Boston rolls home instead.


    Computers don''t leeway. They follow instructions literally. The programs that
    you write are followed precisely, one instruction at a time.


    The following example is a three-line computer program, written in BASIC. Take
    a look at it, but don''t worry too much about what each line is supposed to mean.


    ```

    1 PRINT "Hey Tom, it''s Bob from the office down the hall."

    2 PRINT "It''s good to see you buddy, how''ve you been?"

    3 INPUT A$

    ```


    Translated into English, this program is equivalent to giving a computer the following
    to do:


    +   Dear personal computer,

    - Item 1: Display the message, "Hey Tom, it''s Bob from the office down the hall."

    - Item 2: Ask the question, "It''s good to see you buddy, how''ve you been?"'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Item 3: Give the user a chance to answer the question.


    Sincerely, your lord and master,


    Ima Coder


    Each line in a computer program is called a *statement*. A computer handles each
    statement in a program in a specific order, in the same way that a cook follows
    a recipe or Mr. Jeeves the butler follows the orders of Bertie Wooster. In BASIC,
    the line numbers are used to put the statements in the correct order. Other languages
    like Java do not use line numbers, favoring different ways to tell the computer
    how to run a program.


    Because of the way programs function, you can''t blame the computer when something
    goes wrong as the computer is doing exactly what you told it to do, so the blame
    for any errors lies with the programmer.


    That''s the bad news. The news is you can''t lose any permanent harm. No computers
    will be injured as you learn to program in Java.


    # How Programs Work


    The collection of statements that make up a computer program is called its *source
    code*.


    Most computer programs are written in the same way that you write an email—by
    typing each statement into a text window. Some programming tools come with their
    own code editor and others can be used with any text-editing software.


    When you have finished writing a computer program, you save the file to disk.
    Computer programs often have their own filename extension to indicate what type
    of file they are. Java programs must have the extension `.java`, as in `Calculator.java`.


    NOTE


    Computer programs should be prepared as text files with no special formatting.
    Notepad, a text editor that works with Windows, saves all files as unformatted
    text. You can also use TextEdit on Mac or emacs on Linux systems to create text
    files without formatting. An easier solution is coming later this hour.


    To run a program you have saved as a file, you need some help. The kind of help
    required depends on the programming language you''re using. Some languages require
    an interpreter to run their programs. The interpreter examines each line of a
    computer program and executes that line, then proceeds to the next line. Many
    versions of BASIC are interpreted languages.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# HOUR 1: Becoming a Programmer


    The biggest advantage of interpreted languages is that they are faster to test.
    When you are writing a BASIC program, you can try it out immediately, fix errors,
    and try again. The primary disadvantage is that interpreted languages run slower
    than other programs. Each line has to be translated into instructions the computer
    can run, one line at a time.


    Compiled programs run more quickly than interpreted programs but take more time
    to test. You have to write your program and the whole thing while trying it out.
    If you find an error and fix it, you must compile the program again.


    Java is unusual because it requires both a compiler and an interpreter. The compiler
    converts the statements that make up the program into bytecode. Once this bytecode
    has been created successfully, it can be run by an interpreter the Java Virtual
    Machine.


    The Java Virtual Machine, also called a JVM, is the thing that makes it possible
    for the Java program to run without modification on different operating systems
    and different kinds of computing devices. The virtual machine turns bytecode into
    instructions that a particular device''s operating system can execute.


    > NOTE

    Java 9 introduces a new tool called JShell which acts like an interpreter, running
    a Java statement right when it is typed. JShell works by putting the statement
    into a Java program, compiling that program into bytecode, and running it. It
    is a useful tool for learning and testing.


    # When Programs Don’t Work


    Many programmers become discouraged when they start to test their programs. Errors
    appear everywhere. Some of these are syntax errors, which are identified by the
    computer as it looks at the program and becomes confused by the statement it has
    written. Other errors are logic errors, which are only noticed by the programmer
    as the program is being tested (or might be overlooked entirely). Logic errors
    often cause it to do something unintended.


    As you begin writing your own programs, you become well acquainted with errors.
    They''re the natural part of the process. Programming errors are bugs, a term
    that dates back a century or more to describe errors in technical devices.


    The process of fixing errors also has its own term: debugging.


    It’s no coincidence that there are many ways to describe errors. You get a lot
    of debugging experience as you learn programming—whether you want it or not.'
