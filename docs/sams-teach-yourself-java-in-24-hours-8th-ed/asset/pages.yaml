  md: '# Stopping by SourceForge for Directions


    You can think of a program like this stock ticker app in several ways. One is
    to think of a program as an object—something that exists in the world, takes up
    space, and has certain things it can do. Object-oriented programming, which Java
    uses, as you discover in Hour 10, “Creating Your First Object,” is a way of creating
    computer programs as a group of objects. Each object handles a specific job and
    knows how to speak to other objects. For example, a stock ticker program could
    be set up as the following group of objects:


    +   - A quote object, which represents an individual stock quote

    - A portfolio object, which holds a set of quotes for specific stocks

    - A ticker object, which displays a portfolio

    - An Internet object, a user object, and many others


    Under that model, the stock ticker software is a collection of all the objects
    necessary to work done.


    OOP is a powerful way to create programs, and it makes the programs you write
    more useful. Consider the stock software. If the programmer wants to use the capabilities
    of that program with some other software, the quote object can be used with any
    new program. No changes need to be made.


    Programs created with objects are easier to maintain because they are better organized.
    An object contains the data necessary to do its job and the code required to do
    that work. Objects also make a program more extensible. A new object can be patterned
    after an existing one and enhanced with new capabilities.


    # Stopping by SourceForge for Directions


    This world of Java programs is being led by a professional who is well versed
    in the hazards and highlights of app-based travel. You''ll be venturing on your
    own trips soon, so it''s worthwhile to learn the land of an incredibly useful
    site for programmers: SourceForge, one of the places to find complete examples
    of working programs with Java (or any other language). Find it at www.sourceforge.net.


    SourceForge is an enormous website devoted to collaborative programming projects.
    If you have an interest in working with others on a program you are developing,
    you can start a project on SourceForge, share all its files, recruit others, and
    communicate with them. The 430,000-plus projects on the site are all open source,
    which means that the programmers have shared all the source code. In case you''re
    unfamiliar with the term, source code is another name for the text files that
    are used to create computer programs. The Salut.java file you developed during
    Hour 2 is an example of source code.'
