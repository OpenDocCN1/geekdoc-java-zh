  md: 'Scaling—You can change the size of an entire image that uses polygons simply
    by changing the values to create it. For example, you could add a function to
    the Sign class that multiplies all (x, y) points in each shape before they are
    created, and it would result in an image twice as large. Polygon images scale
    much more quickly than image files and produce better results.


    # # Workshop


    # ## Q&A


    +   Q. How can I draw arcs that go clockwise rather than counterclockwise?


    +   A. You can accomplish this by specifying the size of the arc as a negative
    number. The arc begins at the same point but goes in the opposite direction in
    an elliptical path. For example, the following statement draws an arc at (35,
    20) which is 90 degrees, begins at the O degree mark, goes clockwise, and has
    a height of 20 and a width of 15:


    ```

    Arc2D.Float scale = new Arc2D.Float(35F, 20F, 15F, 20F, -90F, Arc2D.Float.OPEN);

    ```


    +   Q. Ellipses and circles have no corners. What are the (x, y) coordinates specified
    with the Ellips.Float constructor?


    +   A. The (x, y) coordinates represent the smallest x value and smallest y value
    of the oval or circle. If you draw an invisible rectangle around it, the upper-left
    corner of the rectangle would be the x and y coordinates used as arguments to
    the method.


    +   Q. Why do photographers ask you to say “cheese”?


    +   A. The word “cheese” forces your mouth into a smile, as do the whiskey, breeze,
    and money. Words that end with a long “e” generally cause the sides of your lips
    to curl upwards and reveal your teeth.


    Another word that photographers sometimes uses is "grin.\ Though it doesn''t end
    in an "e", it contorts the mouth and the meaning makes people smile.


    Spanish photographers tell people to say "patata" (potato), French "ouistiti"
    (marmoset) and German "Ksekuchen" (cheesecake).


