  md: '# Summary


    Now that you can use conditional statements, the intelligence of your Java programs
    has improved greatly. Your programs can evaluate information and use it to react
    differently in different situations, even if information changes as the program
    is running. They can decide between two or more alternatives based on specific
    conditions.


    Programming a computer forces you to break a task down into a logical set of steps
    to undertake and decisions that must be made. Using the if statement and other
    conditionals in programming also promotes a kind of logical thinking that can
    reap benefits in other aspects of your life:


    +   * “If that candidate is elected president in November, I will move to Canada.”


    +   * “If my OK Cupid date likes me, I''ll pay for dinner at an expensive restaurant,
    else we will go to Taco Bell.


    +   * “If I violate my probation, the only team that will draft me is the Dallas
    Cowboys.”


    # Workshop


    # Q&A


    +   Q. The if statement seems like the one that''s most useful. Is it possible
    to use only statements in programs and never use the others?


    +   A. It is possible to do without else or switch, and many programmers never
    use the ternary operator ?. However, else and switch often are beneficial to use
    in your programs because they make the programs easier to understand. A set of
    if statements chained together can become unwieldy.


    +   Q. During this hour, opening and closing brackets { } are sometimes not used
    an if statement it is used with only one statement. Is it mandatory to use brackets?


    +   A. No, Brackets can be used as part of any if statement to surround the program
    that''s dependent on the conditional test. Using brackets is a good practice to
    get into because it prevents a common error that might take place when you review
    the program. If you don''t add brackets in an if conditional with a single statement,
    what happens when you add a second statement but neglect to add brackets? I''ll
    answer my own question: Unexpected things, and the word "unexpected" is almost
    never good in programming.


    +   Q. Must break be in each section of statements that handle a case?


    +   A. You don''t have to use break. If you do not use it at the end of a group
    of statements, all the remaining statements inside the switch block statement
    are handled, regardless of the case value they are tested with.


    However, in most cases you''re likely to want a break statement at the end of
    each group.'
