  md: '# Setting Up a Minecraft Server


    To fix this problem, make sure the file spigotserver.jar is in the same folder
    as the file you ran to start the server (start-server.bat). Then try to start
    the server again.


    The second error displays the message "java'' is not recognized as an internal
    or external command" as in Figure 23.4.


    ![](img/d09a156b28ce3a26efd211fe0a9c6991_342_0.png)


    FIGURE 23.4

    The Java Virtual Machine (JVM) can''t be found.


    The JVM is in a file called java.exe, which is in the bin subfolder of the folder
    where Java is installed on your computer. When the java command is not recognized,
    this means the computer doesn''t know how to find java.exe.


    On a Windows system, this problem can be fixed by adding the name of the folder
    that contains java.exe to a Control Panel setting called the Path environmental
    variable.


    First, find your Java folder. Go to the top-level folder of your main drive, then
    open the Program Files or Program Files (x86) to see if one contains a Java subfolder.
    If you find it, open that folder.


    The Java folder may contain several versions of the Java Development Kit (JDK),
    with a version number. On my computer, there are jdk1.8.0 and jdk-9 folders. The
    higher number contains the current JDK.


    Open that folder, and open its bin subfolder. There should be a couple dozen applications,
    including one called java.


    Your computer''s Path variable needs to be updated to include the full name of
    this folder, which is something like C:\Program Files\jdk-9\bin (with your JDK
    version number).


    To add the JVM to the Control Panel, perform these steps:


    +   1. Choose the Control Panel on the Start Menu or typing it in the search box.

    2. Choose System, and then choose Advanced System Settings. The Advanced dialog
    opens.'
