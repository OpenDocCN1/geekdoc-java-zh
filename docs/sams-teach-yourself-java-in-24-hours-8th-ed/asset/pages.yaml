    # # Summary


    Users have come to expect a point-and-click, visual environment for the programs
    they run. This expectation makes creating software more of a challenge, but Java
    puts these capabilities into your hands with Swing, which provides all the classes
    you need to provide a working, useful GUI—regardless of what kind of setup you
    are using to run Java programs.


    Developing Java applications with Swing is a good way to get some practice working
    with object-oriented programming. Every component, container, and layout manager
    is represented by its own class of object. Many of them inherit their behavior
    from the same superclass. For instance, all user interfaces introduced during
    this hour are subclasses of `javax.swing.Component`.


    During the next hour, you learn more about the design of a GUI as you work with
    new layout managers that can specify the placement of components within a container
    in more sophisticated ways than `FlowLayout`.


    # # Workshop


    # # Q&A


    +   - **Q. How are components arranged if I don''t assign a layout manager to
    a container?**

    - **A.** In a simple container such as a panel, components are arranged using
    `FlowLayout` by default. Each component is added in the same manner that words
    are displayed on a page in English, from left to right, then down to the next
    line when there''s no more room. Frames, windows, and applets use the `BorderLayout`
    default style you learn about during the next hour.

    - **Q. Why so many of the graphical user interface classes have names preceded
    by a “J,” such as `JFrame` and `Label`?**

    - **A.** These classes are part of the Swing framework, which was the second attempt
    at graphical user interfaces in the Java class library. The Abstract Windowing
    Toolkit (AWT) was first, and it had simpler class names, such as `Frame` and `Label`.'
