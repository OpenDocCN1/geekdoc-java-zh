  md: '# # Pasting Strings Together


    When you use System.out.println() and work with strings in other ways, you can
    paste strings together using +, the same operator that is used to add numbers.


    The + operator has a different meaning in relation to strings. Instead of performing
    some math, it pastes two strings together. This action can cause strings to be
    displayed together or make one big string out of two smaller ones.


    Linking two things together in a string is called concatenation.


    NOTE

    You''ll probably see the term "concatenation" in other books as you build your
    programming skills, it''s worth knowing. However, pasting is the term used here
    when one string and another are joined together. Pasting sounds like fun. Concatenating
    sounds like something that should never be done in the presence of an open flame.


    The following statement uses the + operator to display a long string:


    ```

    System.out.println("Sharkado\ is an hour and a half of your "n+ "life that you''ll
    never get back.\nAnd you won''t want to.\\n"

    + \- David Hinckley, New York Daily News");

    ```


    Instead of putting a string on a single line, which might make it harder to understand
    when you look at the program later, you can use the + operator to break the text
    over two lines of the program''s Java source code. When this is displayed, it
    appears as the following:


