  md: 'Workshop


    Managing exceptions in your Java programs makes them more reliable, more versatile,
    and easier to use because you don''t display any cryptic error messages to people
    who are running your software.


    # Workshop


    # Q&A


    +   Q. Is it possible to create your own exceptions?

    A. It''s not just possible, it''s really a good idea. Making your own exceptions
    for problems that may arise makes your classes more robust. You can create your
    own exceptions easily by making them a subclass of an existing exception, such
    as Exception, the superclass of all exceptions. In a subclass of Exception, there
    are only two constructors you might want to override: Exception() with no arguments
    and Exception() with a String as an argument. In the latter, the string should
    be a message describing the error that has occurred.


    +   Q. Why doesn''t this cover how to throw and catch errors in addition to exceptions?

    A. Java divides problems into Errors and Exceptions because they differ in severity.
    Exceptions are less severe, so they are everything that should be dealt with in
    your programs using try-catch or throws in the method declaration. Errors, on
    the other hand, are more serious and can''t be dealt with adequately in a program.


    Two examples of these errors are stack overflows and out-of-memory errors. These
    can cause the JVM to crash, and there''s no way you can fix them in your program
    as the JVM runs it.


    +   Q. What is the oldest comic strip that''s still running in newspapers?

    A. Katzenjammer Kids, what was created by Rudolph Links in 1897 and is still offered
    today by Key Features Syndicate. The strip started only two years after the first
    comic strip, The Yellow Kid, and is the first to use balloons.

    Dirks, a German immigrant to the United States, was inspired to create the rebellious
    kids Hans and Fritz by a child''s story from his native country. He quit the strip
    in a contractual dispute and was succeeded by Harold Kerrner, who wrote and drew
    it until 1949. There have been five subsequent cartoonists working on it. Hy Eismman
    wrote and drew it from 1986 to 2006. Since then the strip has featured reprints.


    The word katzenjammer literally means "the wailing of cats" in German, but it''s
    more often used to describe a hangover.'
