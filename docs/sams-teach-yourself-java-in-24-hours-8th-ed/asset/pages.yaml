    # # Workshop


    # # Q&A


    +   - Most Java programs created up to this point have not used extends to inherit
    from a superclass. Does this mean they exist outside the class hierarchy?


    +   - All classes you create in Java are part of the hierarchy because the default
    superclass for the programs you write is `Object` when you aren''t using the `extends`
    keyword. `equals()` and `toString()` methods of all classes are part of the behavior
    that automatically inherited from `Object`.


    +   - Why do people yell "eureka" when they''ve discovered something?


    +   - A eureka is borrowed from ancient Greek, where it meant ''I have found it!''
    The phrase was supposedly exclaimed by the Greek scholar Archimedes when he stepped
    into a bath.


    +   - What did the Greek discover in the bathtub? The rising water level, which
    led him to understand that the volume of displaced water must equal the volume
    of his body parts.


    +   - The story about Archimedes was spread two centuries later by Vitruvius in
    his multiline *De Architecture*, a book about architecture.


    +   - "Eureka" has been in the California state seal since 1849, referring to
    the exclamation that accompanied the discovery of gold near Sutter''s Mill year
    earlier.


    # # Quiz


    To determine what much knowledge you inherited from the past hour''s work, answer
