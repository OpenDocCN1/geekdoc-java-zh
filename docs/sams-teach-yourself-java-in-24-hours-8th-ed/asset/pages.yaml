    # Buffered Input Streams


    One of the ways to improve the performance of a program that reads input streams
    is to buffer

    t input. Buffering is the process of saving data in memory for use when a program
    needs

    it. When a program needs data from a buffered input stream, it looks in the buffer
    first,

    which is faster than reading from a source such as a file.


    To use a buffered input stream, you create an input stream such as a FileInputStream

    object, then use that object to create a buffered stream. Call the BufferedInputStream

    (InputStream) constructor with the input stream as the argument. Data is buffered
    as it

    is read from the input stream.


    To read from a buffered stream, call the read() method with no arguments. Integer
    from

    0 to 255 is returned and represents the next byte of the stream. If no more bytes
    are

    aavailable, -1 is returned instead.


    As a demonstration of buffered streams, the next program creates a feature to
    Java that

    many programmers miss from other languages they have used: console input.


    Console input is the ability to read characters from the console (also known as
    the command

    line) while running an application.


    The System class, which contains the out variable in the System.out.print()

    an System.out.println() statements, has a class called in that represents an

    InputStream object. This object receives input from the keyboard and makes it
    available as a

    stream.


    You can work with this input stream like any other. The following statement creates
    a buffered

    input stream associated with the System.in input stream:

    BufferedInputStream bin = new BufferedInputStream(System.in);


    The next project, the Console class in the com.java24hours package, contains a
    class method

    you can use to receive console input in any of your Java applications. Enter the
    text from

    Listing 20.2 in a new Java file named Console.'
