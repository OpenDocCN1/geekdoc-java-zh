    # Summary


    Array lists and hash maps are two of the more useful data structures in the java.util
    package. The array list class expands the functionality of arrays, making it possible
    to overcome the fixed-size limitation of that data type. Hash maps enable any
    object to be used as the key to retrieve a value.


    There also are bit sets (the BitSet class), which hold the bit values of 0 and
    1; stacks (Stack), which are a last-in, first-out collection of data similar to
    array lists; the sorted structures TreeMap and TreeSet; and properties (Properties),
    a specialized hash map that holds configuration properties for a program in a
    file or another permanent storage place.'
