    # 5-Arrays in Java


    Arrays are storage structures used for storing same-type elements. An array has
    a fixed size, which cannot be increased after definition. The first element in
    an array is at index 0.


    # Single Dimensional Arrays


    These are arrays in which the elements are stored linearly. The declaration of
    an array takes the syntax given below:


    ```

    <elementDataType>[] <arrayName>;

    ```


    Another syntax:


    ```

    <elementDataType> <arrayName> [];

    ```'
