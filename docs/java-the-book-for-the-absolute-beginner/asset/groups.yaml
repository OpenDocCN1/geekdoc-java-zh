    \ return wage/52;\n    }\n}\n```\n\n# 方法重载\n\n当我们有两个或多个同相同但参数不同的方法时，就会发生这种情况。参数的差异可以体现在数量或类型上。\n\
    \n考虑下面给出的示例：\n\n# Java：初学者入门教程\n\n```java\npublic class static MethodOverloading\
