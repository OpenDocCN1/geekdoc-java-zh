    \ newPersonID) {\n    personID = newPersonID;\n}\n```\n\n任何需要访问私有变量的类必须使用公共方法：setter\
    \ 和 getters。\n\n我们使用下面提供的方法进行访问：\n\n```java\npublic class MyClassTest extends\
    \ MyClass{\n    public static void main(String args[]) {\n        MyClassTest\
    \ mct = new MyClassTest();\n        mct.setName(\"Joel\");\n        mct.setAge(32);\n\
    \        mct.setID(\"4458972\");\n        System.out.print(\"Name : \" + mct.getName()\
    \ + \" Age : \" + mct.getAge());\n    }\n}\n```\n\n你应该将这两个代码写在两个独立的文件。执行后，你应该得到以下结果：\n\
    \n```\nC:\\Users\\admin>javac MyClass.java\nC:\\Users\\admin>javac MyClassTest.java\n\
    C:\\Users\\admin>java MyClassTest\nName : Joel Age : 32\nC:\\Users\\admin>\n```\n\
    \n# 13-接口\n\n接口（Interface）是类的蓝图。它包含抽象方法和静态常量。接口提供了实现抽象的机制。接口只能有抽象方法，而没有方法体。它对于实现多继承非常重要。它类似于类，但只包含抽象方法。任何类都必须实现接口才能使用它的方法。除了抽象方法外，它还可以拥有常量、静态方法、默认方法、嵌套类型等。\n\
    \n接口拥有可以类实现的方法。要实现接口方法，类必须是抽象的。否则，所有接口方法都必须在类中定义。接口不能实例化。它不能有构造函数。它所有的字段必须是 `final`\
    \ 或 `static`，不能是实例字段。\n\n要设置接口，我们使用 `interface` 关键字。\n\n# Java：初学者入门读物\n\n这里是语法：\n\
    \n```java\ninterface <接口Name>{\n  // 常量字段\n  // 抽象方法\n}\n```\n\n接口是隐式的抽象；因此在声明它时不需要添加\
    \ `abstract` 关键字。方法是隐式抽象的；因此在声明它们时不需要使用 `abstract` 关键字。它们是隐式的公有的。\n\n示例：\n\n```java\n\
    interface Mammal {\n  public void run();\n  public void eat();\n}\n```\n\n可以使用类来实现接口：\n\
    \n```java\ninterface Mammal {\n  public void run();\n  public void eat();\n}\n\
    ```\n\n```java\npublic class Cow implements Mammal{\n  public void run() {\n \
    \   System.out.println(\"Interface Method run implemented\");\n  }\n  public void\
    \ eat() {\n    System.out.println(\"Interface Method eat already implemented\"\
    );\n  }\n  public static void main(String args[]) {\n    Mammal mm = new Cow();\n\
    \    mm.run();\n  }\n```\n\n```java\nmm.eat();\n}\n```\n\n代码执行后应返回以下结果：\n\nInterface\
    \ Method run already Implemented\nInterface Method eat already Implemented\n\n\
    我们创建了接口 `Mammal`，它已被 `Cow` 类实现。它的 `run()` 和 `eat()` 方法已 `Cow` 类中使用。\n\n对于两个接口，一个接口可以通过\
    \ `extends` 关键字扩展另一个。子接口将继承父接口的方法。\n\n示例：\n\n```java\npublic interface Toyotas\
    \ {\n    public void setCarPrice(String carPrice);\n    public void setCC(String\
    \ cc);\n}\n```\n\n```java\npublic interface Harrier extends Toyotas {\n    public\
    \ void maximumMileage(int miles);\n    public void seats(int seats);\n}\n```\n\
    \n```java\npublic interface Prado extends Toyotas {\n    public void interiorSpace();\n\
    \    public void kilometersLiter(int kms);\n}\n```\n\n```java\npublic interface\
    \ Prado extends Toyotas {\n    public void interiorSpace();\n    public void kilometersLiter(int\
    \ kms);\n}\n```\n\n# Java：初学者入门读物\n\n我们定义了 `Toyotas` 接口。其他的 `Harrier` 和 `Prado`\
    \ 扩展了 `Toyotas`。`Prado` 接口有四个方法，但其中两个继承自 `Toyota` 接口。\n\nJava 不支持多继承，但我们可以通过接口来实现。\n\
    \n这是另一个接口示例：\n\n```java\ninterface ObjectInterface{\n    void drawObject();\n\
    \    static int cubeObject(int ab){return ab*ab*ab;}\n}\nclass Cuboid implements\
    \ ObjectInterface{\n    public void drawObject() {\n        System.out.println(\"\
    Cube is drawn\");\n    }\n}\npublic class InterfaceTest{\n    public static void\
    \ main(String args[]) {\n        ObjectInterface ob=new Cuboid();\n        ob.drawObject();\n\
    \        System.out.println(ObjectInterface.cubeObject(3));\n    }\n}\n```\n\n\
    嵌套接口是在另一个接口内部定义的。\n\n```java\ninterface Message{\n    void printMessage();\n \
    \   interface ShortMessage{\n```\n\n```java\nvoid message();\n}\n}\n```\n\n`ShortMessage`\
    \ 接口被定义在 `Message` 接口内部，使其成为嵌套接口。\n\n"
