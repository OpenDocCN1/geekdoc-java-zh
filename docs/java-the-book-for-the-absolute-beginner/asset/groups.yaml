  md: "\n##6-Operators in Java\n\nOperators are symbols used to perform operations.\
    \ Example, the + symbol is used for arithmetic operations. Java supports different\
    \ operators:\n\n### Unary Operator\n\nThis is an operator that takes one operand.\
    \ They increment/decrement a value. They include ++ (increment) and -- (decrement).\n\
    \nExample:\n\n```java\npublic class JavaUnaryOperator{\n  public static void main(String\
    \ args[]){\n    int p=0;\n    System.out.println(p++);//from 0 to 1\n    System.out.println(++p);//2\n\
    \    System.out.println(p--);//1\n    System.out.println(--p);//0\n}\n```\n\n\
    The program prints the following after execution:\n\n0\n2\n2\n0\n\nThe p++ means\
    \ that the value of p is read first before the increment is done; hence we got\
    \ the value of p as 0. If it was ++p, then we would get a 1 as the first value\
    \ of p. You can try it.\n\n### Arithmetic Operators\n\nThese operators are used\
    \ for performing mathematical operations like multiplication, addition, division,\
    \ subtraction, etc. They are used as mathematical operators.\n\nExample:\n\n```java\n\
    public class ArithmeticOperators{\npublic static void main(String args[]) {\n\
    int p=13;\nint q=4;\nSystem.out.println(p+q); //17\nSystem.out.println(p-q); //9\n\
    System.out.println(p*q); //52\nSystem.out.println(p/q); //3\nSystem.out.println(p%q);\
    \ //6\n}\n```\n\nThe code returns the following result upon execution:\n\n```\n\
    17\n9\n52\n3\n6\n```\n\nWe have two integer variables p and q with their respective\
    \ values initialized. We have got the addition, subtraction, multiplication, and\
    \ division of these variables. The division ignores the decimal part as the variables\
    \ have been declared as integers rather than floats or doubles. The only operator\
    \ that may look unfamiliar is the % (modulus operator), which returns the rest\
    \ after division.\n\n### Logical Operators\n\nThese operators are used together\
    \ with binary values. They help in the evaluation of conditions in loops and conditional\
    \ statements. They include ||, &&, !. Suppose we have two Boolean variable a1\
    \ and a2, the following conditions apply:\n\n- a1&&a2 will return true if both\
    \ a1 and a2 are true, otherwise, false.\n- a1||a2 will return false if both a1\
    \ and a2 are false, otherwise.\n- !a1 will return opposite of a1.\n\nExample:\n\
    \n```java\npublic class JavaLogicalOperator {\n    public static void main(String\
    \ args[]) {\n        boolean p = true;\n        boolean q = false;\n\n       \
    \ System.out.println(\"p && q: \" + (p&&q));\n        System.out.println(\"p ||\
    \ q: \" + (p||q));\n        System.out.println(\"!(p && q): \" + !(p&&q));\n \
    \   }\n}\n```\n\nThe program will return the following upon execution:\n\n![](img/7911bbd6775001f16b2e1aab0ab64f4b_41_0.png)\n\
    \nThe value of variable p has been set to true while that of variable q has been\
    \ set to a false. In the first case, we are using && operator, hence true and\
    \ false return a false. In the second case, we are using the || operator, hence\
    \ true or false give a true. In the last case, we are negating the result of the\
    \ && operation.\n\n### Comparison Operators\n\nJava supports 6 types of comparison\
    \ operators, ==, !=, <, >=, <=:\n\n- == will return true if both left and right\
    \ sides are equal.\n- != will return true if the left and right sides of the operator\
    \ are not equal.\n- > returns true if the left side is greater than the right\
    \ side.\n- < returns true if the left side is less than the right side.\n- >=\
    \ returns true if the left side is greater/equal to the right.\n- <= returns true\
    \ if the left side is less than the right side.\n\nExample:\n\n```java\npublic\
    \ class RelationalOperator {\n    public static void main(String[] args[]) {\n\
    \        int p = 10;\n        int q = 15;\n        if (p==q)\n            System.out.println(\"\
    p and q are equal\");\n        else\n            System.out.println(\"p and q\
    \ aren't equal\");\n\n        if (p != q) {\n            System.out.println(\"\
    p and q aren't equal\");\n        } else {\n            System.out.println(\"\
    p and q are equal\");\n        }\n\n        if (p > q){\n            System.out.println(\"\
    p is greater than q\");\n        } else {\n            System.out.println(\"p\
    \ isn't greater than q\");\n        }\n\n        if (p >= q){\n            System.out.println(\"\
    p is equal or greater than q\");\n        } else {\n            System.out.println(\"\
    p is less than q\");\n        }\n\n        if (p < q){\n            System.out.println(\"\
    p is less than q\");\n        } else {\n            System.out.println(\"p isn't\
    \ less than q\");\n        }\n\n        if (p <= q) {\n            System.out.println(\"\
    p is equal or less than q\");\n        } else {\n            System.out.println(\"\
    p is greater than q\");\n        }\n    }\n}\n```\n\nWe have used various comparison\
    \ operators to compare the values of variables p and q.\n\n## 7-Decision Making\
    \ Statements\n\nIn Java, decision making helps us to test conditions and run statements\
    \ based on the outcome of the condition. Let us discuss the statements for decision\
    \ making:\n\n### if statement\n\nThis statement has a Boolean expression and statement(s).\
    \ Its syntax is given below:\n\n```java\nif(boolean_expression) {\n  // Statement(s)\
    \ to be run if true\n}\n```\n\nExample:\n\n```java\npublic class JavaIfStatement\
    \ {\n    public static void main(String[] args[]) {\n        int x = 5;\n    \
    \    if( x < 10) {\n            System.out.print(\"The value of x is below 10\"\
    );\n        }\n    }\n}\n```\n\nThe code will return the following result upon\
    \ execution:\n\nThe value of x is below 10\n\nWe have declared a variable named\
    \ x and initialized its value to 5. In the if condition, we are checking whether\
    \ the value of this variable is below 10. Since this is true, the statement below\
    \ this condition has been executed.\n\n### if...else statement\n\nThis statement\
    \ combines an \"if\" with \"else\", with the latter specifying the statement(s)\
    \ to run if the expression is false. Syntax:\n\n```java\nif(boolean_expression)\
    \ {\n    // Statement(s) to run if expression is true\n} else {\n    // Statement(s)\
    \ to run if expression is false\n}\n```\n\nExample:\n\n```java\npublic class JavaIfElseStatement\
    \ {\n    public static void main(String args[]) {\n        int marks = 30;\n\n\
    \        if ( marks < 50 ) {\n            System.out.print(\"The marks is below\
    \ 50\");\n        } else {\n            System.out.print(\"The marks is above\
    \ 50\");\n        }\n    }\n}\n```\n\nThe first statement will be printed, the\
    \ marks are below 50. This is because the Boolean expression will be true. If\
    \ it is false, the other statement will be printed.\n\nExample:\n\n```java\npublic\
    \ class JavaIfElseStatement {\n    public static void main(String args[]) {\n\
    \        int x = 10;\n\n        if(x < 5) {\n            System.out.print(\"The\
    \ value of x is below 5\");\n        } else {\n            System.out.print(\"\
    The value of x is above 5\");\n        }\n    }\n}\n```\n\nThe code returns the\
    \ following execution:\n\nThe value of x is above 5\n\nThe value of variable x\
    \ has been set to 10. In the if condition, we are checking whether this value\
    \ is below 5. This will test to a false, hence the else part will be executed.\n\
    \n### if...else if...else Statement\n\nIf you have several conditions to test,\
    \ use this statement. Syntax:\n\n```java\nif(boolean_expression a) {\n  // Statement(s)\n\
    } else if(boolean_expression b) {\n  // Statement(s)\n} else if(boolean_expression\
    \ c) {\n  // Statement(s)\n} else {\n  // Statement(s)\n}\n```\n\nExample:\n\n\
    ```java\npublic class JavaIfElseIfStatement {\n  public static void main(String\
    \ args[]) {\n    int x = 15;\n\n    if( x == 10) {\n      System.out.print(\"\
    value of x is 10\");\n    } else if (x == 15) {\n        System.out.print(\"value\
    \ of x is 15\");\n    } else if ( x == 20 ) {\n        System.out.print(\"value\
    \ of x is 20\");\n    } else {\n        System.out.print(\"None of the above\"\
    );\n    }\n  }\n}\n```\n\nThe code gives the following result after execution:\n\
    \nvalue of x is 15\n\nThe value of variable x was initialized to 15, hence the\
