    # Type Casting and Type Conversion


    It is possible for a variable of a particular type to get a value of some other
    type. Type conversion is when a variable of a smaller capacity is assigned a variable
    of a bigger capacity.


    Example:


    ```

    double p;

    int q=6;

    p-q;

    ```


    Typecasting is when a variable of larger capacity is assigned some other variable
    of a smaller capacity.


    Example:


    ```

    p =6;

    int q;

    q=(int) p;

    ```


    The (int) is known as the type cast operator. If it is not specified you get an
    error. Typecasting example:


    ```

    public class TypecastingExample{

    public static void main(String[] args) {

    float p=6.0;

    //int q=p;//a compile time error

    int q=(int)p;

    System.out.println(p);

    System.out.println(q);

    }

    }

    ```'
