    # 引言


    Java 是一门优秀的编程语言，可用于开发独立应用程序，也可用于分布式应用程序。Java 这种类型的应用程序目前在小型和大型企业中都有巨大的需求。Java
    提供了一种名为 Applet 的功能，即可以嵌入网页的程序。这意味着 Java 可以帮助你为应用程序添加功能。Java 是一门范围内广受欢迎的编程语言，它拥有许多可以在开发应用程序时利用的特性。例如，Java
    是一门面向对象的编程语言。如果你熟悉其他的面向对象语言，学习 Java 将非常容易。Java 的语法简单，即使是初学者也能理解。编写和运行 Java 程序非常容易。你只需要在计算机上安装
    Java 编译器和一个文本编辑器。有了这些，你就可以编写 Java 程序并获得即时结果。


    # 1-Java 入门


    # 什么是 Java？


    Java 既是一个平台也是一门编程语言。作为一个平台，我们拥有 Java 运行环境（JRE），它是程序运行在其上的软件环境。作为一种语言，Java 是一门高级、健壮且面向对象的编程语言。该语言是由
    Sun Micros 公司于 1995 年开发的。


    由于 Java 是一种面向对象的编程语言，它将一切视为对象。该语言的对象模型特性也使其易于扩展。Java 程序通过两个步骤生成结果：第一步是编译，之后生成字节码。Java
    字节码是跨平台的，这意味着它可以在任何机器上运行。编译后，字节码将通过执行步骤生成结果。


    Java 以易于上手著称。如果你熟悉面向对象编程的概念，那么编写和运行 Java 程序对你来说将很容易。你只需要在计算机上安装 Java 编译器和一个文本编辑器（如
    Windows 中的记事本）。


