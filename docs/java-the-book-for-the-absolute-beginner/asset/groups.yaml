    # Java: The Book For The Absolute Beginner


    Run the following command on the terminal:


    ```

    javac Hello.java

    ```


    The above command should generate the Hello.class file. This is the file with
    the Java byte code, which is platform-independent. You can confirm this by checking
    the same directory for this file. What we have done is that we have invoked the
    Java compiler (Jayac) on the file to compile the Java code contained in the file.


    Now that the code has compiled with no error, we can execute it. Just run the
    following command on the same terminal:


    ```

    java Hello

    ```


    The above command should return results on the terminal as shown below:


