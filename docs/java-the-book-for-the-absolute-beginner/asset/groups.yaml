  mdcn: "\n通常情况下，JDK 的安装位于 `c:\\Program Files\\java\\jdk` 目录。在 Windows 上，你可以通过右键点击“我的电脑”然后选择“属性”来设置环境变量。接下来，打开“高级”选项卡并选择“环境变量”。添加\
