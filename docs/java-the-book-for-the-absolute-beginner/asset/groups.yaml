    This book will introduce you to some basic concepts of Java. Daniel Bell teaches
    you to get familiar with Java language, features of Java and how you can install
    Java on your system. This will help you grab Java concepts quickly and easily.
    The author iteratively walks you through the language-specific concepts and explains
    the object-oriented philosophy behind Java. With or without programming knowledge,
    this book is a perfect guide for the absolute beginner who want to learn java
    programming from A to Z. Indeed, Java: the book for the absolute beginner is an
    excellent textbook to start learning java programming since through it you can
    learn the basics of variables and how to create different functions in Java just
    in few hours.


    The book has been grouped into chapters, with each chapter exploring a different
    feature of Java programming language. The author has provided Java codes, each
    code performing a different task. Corresponding explanations have also been provided
    alongside each piece of code to help the reader understand the meaning of the
    various lines of the code. Moreover, Screenshots showing the output that each
    code should return have been given. The author has used a simple language to make
    it easy even for beginners to understand.


    ![](img/7911bbd6775001f16b2e1aab0ab64f4b_203_0.png)'
