    with abstract methods only. Any class must implement an interface to use its methods.
    Other than abstract methods, it may have constants, static methods, default methods,
    nested types, etc.


    An interface has methods that can be implemented by classes. To implement interface
    methods, a class must be abstract. Otherwise, all interface methods must be defined
    in the class. An interface can’t be instantiated. It also can’t have constructors.
    All its fields must be final or static, not instance fields.


    To set one, we use the interface keyword.'
