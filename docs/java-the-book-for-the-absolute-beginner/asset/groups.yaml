  md: "\n## 3-Variables in Java\n\nA variable can be seen as a container responsible\
    \ for holding value during the life of a program. Each variable is of a certain\
    \ data type, designating the value it can hold. There are two steps in using Java\
    \ variables: variable declaration, and variable initialization.\n\n## Variable\
    \ Declaration\n\nThe declaration of a variable involves giving it a name and specifying\
    \ its data type. Below are examples of valid variable declaration:\n\n```\nint\
    \ a, x, p;\nfloat pi;\n```\n\ndouble p;\n\nchar c;\n\nThe int, float, double and\
    \ char are the data types, specifying the value each variable can or or should\
    \ hold. To declare several variables in one line, separate them using a comma\
    \ (,) as in the first example. A variable declaration should end with a semicolon\
    \ (;).\n\n## Variable Initialization\n\nVariable initializing involves assigning\
    \ it a valid value. The value to be assigned to the variable is determined by\
    \ the data type the variable is of. Below are examples of valid variable initializations.\n\
    \n```\npi = 1;\na = 10.5;\nc = 's';\n```\n\nBoth declaration and initialization\
    \ of a variable can be done at once as shown below:\n\n```\nint a=1, x=4, p=5;\n\
    float pi=3.14f;\ndouble p=15.23d;\nchar c='s';\n```\n\n## Variable Types\n\nJava\
    \ supports three variable types:\n\n1. Local Variables\n2. Static Variables\n\
    3. Instance Variables\n\nThese are variables declared within a method body. They\
    \ can only be accessed from within that method.\n\nThese are the variables that\
    \ have been defined without the use of a STATIC keyword. These variables are specific\
    \ to an object.\n\nThese are variables initialized once and at the beginning of\
    \ program execution. You should initialize them before instance variables.\n\n\
    The following example shows the different Java variables:\n\n```\nclass VariablesExample\
    \ {\n    int p = 1; //an instance variable\n    static int q = 5; //a static variable\n\
    \    void methodName() {\n        int r = 10; //a local variable\n    }\n}\n```\n\
    \nThe variable *integer q* is a static variable since it has been defined with\
    \ the *static* keyword. The variable *int r* has been declared within the *methodExample*\
    \ method, making it a local variable. It can only be accessed from within that\
    \ method.\n\n## 4 - Java Data Types\n\nIn Java, a data type can be primitive or\
    \ non-primitive.\n\n## Primitive Data Types\n\nThese are the pre-defined data\
    \ types that are already provided by Java. They are 8 in number including byte,\
    \ short, long, char, int, float, Boolean and double data types.\n\nLet us now\
    \ discuss the various primitive data types in Java:\n\nThis data type stores only\
    \ two values, which are true and false. It is used in simple statements that track\
    \ only true/false conditions. It specifies only one bit of information, but we\
    \ cannot define its size precisely.\n\nThis has a default value of 0, and its\
    \ minimum value is -128 (-2^7). It helps in saving space in large arrays as it\
    \ is 4 times smaller than integers.\n\nIt has a default value of 0 and values\
    \ lying with the range of -32,768 to 32,767. It can also be used for saving on\
    \ space just like the byte data type.\n\nThis int also has a default value of\
    \ 0 and values ranging between -2,147,483,648 and 2,147,483,647. It has a minimum\
    \ value of -2,147,483,648 and a maximum value of 2,147,483,647.\n\nThis data type\
    \ also has a default value of 0 with its values ranging between -9,223,372,036,854,775,808\
    \ and 9,223,372,036,854,775,807. Its minimum value is - 9,223,372,036,854,775,808\
    \ while its maximum value is 9,223,372,036,854,775,807. It is the best data type\
    \ to use when you want to have long range of values than the ones provided by\
    \ the int type.\n\nThis long type has an unlimited range of values. It can help\
    \ you save space compared to the use of double. Its default value is 0.0.\n\n\
    This data type has a default value of 0.0 and it comes with an unlimited range\
    \ of values. It is used to represent values with decimal part just like float\
    \ type.\n\n## Non-Primitive Data Types\n\nThese are defined by the use of constructors.\
    \ They help programmers access objects. They include Strings and arrays. The example\
    \ below shows the use of variables:\n\n```\npublic class AddVariables{\n    public\
    \ static void main(String[] args) {\n        int p=10;\n        int q=22;\n  \
    \      int r=p+q;\n        System.out.println(r);\n    }\n}\n```\n\nWe have defined\
    \ three variables p, q, and r. The values for p and q have been initialized, while\
    \ the value for r is the addition of two. We have then invoked the println function\
    \ to print the value of r.\n\n## Type Casting and Type Conversion\n\nIt is possible\
    \ for a variable of a particular type to get a value of other type. Type conversion\
    \ is when a variable of larger capacity is assigned a smaller capacity.\n\nExample:\n\
    \n```\ndouble p;\nint q;\n```\n\nThe (int) is known as the type cast operator.\
    \ If it is not specified you get an error. Typecasting example:\n\n```\npublic\
    \ class TypecastingExample{\npublic static void main(String[] args) {\nfloat p=6.0;\n\
    //int q=p;//a compile error\nint q=(int)p;\nSystem.out.println(p);\nSystem.out.println(q);\n\
    }\n```\n\nThe code returns the following upon execution:\n\n```\n6.0\n6\n```\n\
    \n## 5-Arrays in Java\n\nArrays are storage structures for storing same-type elements.\
    \ An array has a fixed size, which cannot be increased after definition. The first\
    \ element in an array is at index 0.\n\n## Single Dimensional Arrays\n\nThese\
    \ are arrays in which the elements are stored linearly. The declaration of an\
    \ array takes the syntax given below:\n\n```\n<elementDataType>[] arrayName;\n\
    ```\n\nAnother syntax:\n\n```\n<elementDataType> arrayName[];\n```\n\nExample:\n\
    \n```\nint arrayExample[];\nint []arrayExample;\n```\n\nAn array can be initialized\
    \ as follows:\n\n```\narrayExample[0]=20;\n```\n\nThe line states that the element\
    \ 10 should be stored at index 0 of the array. An array can also be declared and\
    \ initialized simultaneously:\n\n```\nint arrayExample[] = {10,21,22};\n```\n\n\
    The value 10 will be stored at index 0 of the array, 21 at index 1 and so on.\n\
    \nExample:\n\n```java\npublic class JavaArrayExample{\n    public static void\
    \ main(String args[]){\n        int myarr[] = new int[15];\n        for (int p=0\
    \ ;p<15;p++){\n            myarr[p]=p+1;\n        }\n        for (int p=0;p<15;p++){\n\
    \            System.out.println(\"myarr[\"+p+\"]=\"+myarr[p]);\n        }\n  \
    \      System.out.println(\"The Array Length: \"+myarr.length);\n    }\n}\n```\n\
    \nThe array will print the elements contained at different indices as shown below:\n\
    \n```\nmyarr[0] = 1\nmyarr[1] = 2\nmyarr[2] = 3\nmyarr[3] = 4\nmyarr[4] = 5\n\
    myarr[5] = 6\nmyarr[6] = 7\nmyarr[7] = 8\nmyarr[8] = 9\nmyarr[9] = 10\nmyarr[10]\
    \ = 11\nmyarr[11] = 12\nmyarr[12] = 13\nmyarr[13] = 14\nmyarr[14] = 15\nThe Array\
    \ Length = 15\n```\n\nWe also got the length of the array, which is 15.\n\n##\
    \ Multi-Dimensional Arrays\n\nThese can be seen as arrays of other arrays. In\
    \ a multi-dimensional array declaration, you only add another set of square brackets\
    \ to define the other index. Example:\n\n```\nint arr2[][][] = new int[12][45];\n\
    ```\n\nYou have the authority to control the length of your multi-dimensional\
    \ array.\n\nExample:\n\n```java\npublic class JavaArrayExample2 {\npublic static\
    \ void main(String[] args) {\n\n// Creating a 2-dimensional array.\nint arr2[][]\
    \ = new int[12][45];\n// Assign only three elements\narr2[0][0] = 0;\narr2[1][1]\
    \ = 12;\narr2[3][2] = 23;\nSystem.out.println(arr2[0][0] + \" \");\nSystem.out.println(arr2[1][1]\
    \ + \" \");\n}\n}\n```\n\nThe program will return the value stored at index [0][0]\
    \ and index [1][1] as shown below:\n\n![](img/7911bbd6775001f16b2e1aab0ab64f4b_37_0.png)\n"
  mdcn: "\n\n## Java 中的三变量\n\n变量可以被看作是一个在程序运行期间存储值的容器。每个变量都具有特定的数据类型，该类型指定了它可以存储的值。使用\
    \ Java 变量有两个步骤：变量声明和变量初始化。\n\n## 变量声明\n\n变量声明涉及为变量命名名称并指定其数据类型。以下是有效的变量声明示例：\n\
    \n```\nint a, x, p;\nfloat pi;\n```\n\ndouble p;\n\nchar c;\n```\n\n`int`、`float`、`double`\
    \ 和 `char` 是数据类型，指定了每个变量可以或应该存储的值。要在一行中声明多个变量，可以使用第一个示例所示的逗号（,）将它们分隔。变量声明应以分号（;）结束。\n\
    \n## 变量初始化\n\n变量初始化涉及为变量赋一个有效值。赋给变量的值取决于变量的数据类型。以下是有效的变量初始化示例。\n\n```\npi = 1;\n\
    a = 10.5;\nc = 's';\n```\n\n变量的声明和初始化可以同时完成，如下所示：\n\n```\nint a=1, x=4, p=5;\n\
    float pi=3.14f;\ndouble p=15.23d;\nchar c='s';\n```\n\n## 变量类型\n\nJava 支持三种变量类型：\n\
    \n1. 局部变量\n2. 静态变量\n3. 实例变量\n\n这些是在方法体内部声明的变量。它们只能在该方法内部访问。\n\n这些是在没有使用 `STATIC`\
    \ 关键字的情况下定义的变量。这些变量特定于某个对象。\n\n这些是在程序执行开始时初始化一次的变量。你应该实例化变量之前初始化它们。\n\n以下示例展示了不同的\
    \ Java 变量：\n\n```\nclass VariablesExample {\n    int p = 1; // 实例变量\n    static\
    \ int q = 5; // 一个静态变量\n    void methodName() {\n        int r = 10; // 一个局部变量\n\
    \    }\n}\n```\n\n变量 *integer q* 是一个静态变量，因为它使用了 *static* 关键字定义。变量 *int r* 在 *methodExample*\
    \ 方法内部声明，使其成为一个局部变量。它只能在该方法内部被访问。\n\n## 4 - Java 数据类型\n\n在 Java 中，数据类型可以是基本类型或非基本类型。\n\
    \n## 基本数据类型\n\n这些是 Java 提供的预定义数据类型。共有 8 种，包括 `byte`、`short`、`long`、`char`、`int`、`float`、`Boolean`\
    \ 和 `double` 数据类型。\n\n现在让我们讨论 Java 中的各种基本数据类型：\n\n这种数据类型只存储两个值，真和假。它用于仅跟踪真/假 条件的简单语句。但我们无法精确定义它的大小。\n\
    \n它具有默认值 0，最小值为 -128 (-2^7)。它有助于在大型数组中节省空间，因为它比 `int` 小 4 倍。\n\n它的默认值为 0，取值范围在\
    \ -32,768 到 32,767 之间。它也可以像 `byte` 数据类型一样用于节省空间。\n\n这种 `int` 也有默认值 0，值范围在 -2,147,483,648\
    \ 到 2,147,483,647 之间。它的最小值为 -2,147,483,648，最大值为 2,147,483,647。\n\n这种数据类型也有默认值\
    \ 0，取值范围在 -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807 之间。它的最小值为 -9,223,372,036,854,775,808，最大值为\
    \ 9,223,372,036,854,775,807。当你想要获得比 `int` 类型提供的更广泛的值范围时，这是最佳数据类型。\n\n这种 `long`\
    \ 类型具有无限范围的值。与使用 `double` 相比，它可以帮助你节省空间。它的默认值为 0.0。\n\n这种数据类型默认值为 0.0，并且具有无限范围的值。它用于像\
    \ `float` 类型一样表示带有小数部分的值。\n\n## 非基本数据类型\n\n这些通过使用构造函数定义。它们帮助程序员访问对象。它们包括 `String`\
    \ 和数组。下面的示例展示了变量的使用：\n\n```\npublic class AddVariables{\n    public static void\
    \ main(String[] args) {\n        int p=10;\n        int q=22;\n        int r=p+q;\n\
    \        System.out.println(r);\n    }\n}\n```\n\n我们定义了三个变量 p、q 和 r。p 和 q 的值已经初始化，而\
    \ r 的值是两者的和。然后我们调用了 `println` 函数来打印 r 的值。\n\n## 类型转换和类型转换\n\n特定类型的变量可以获取其他类型的值。类型转换是将较大容量的变量赋值较小容量的变量。\n\
    \n示例：\n\n```\ndouble p;\nint q;\n```\n\n`(int)` 被称为类型转换运算符。如果一个变量被赋值为另一个类型的值，就会发生类型转换。\n\
    \n```\ndouble p;\nint q;\n```\n\n## 5 - 数组\n\n数组是存储相同类型元素的结构。Java 中的数组大小是固定的，定义后无法增加。\n\
    \n## 单维数组\n\n这些是线性存储元素的数组。数组的声明语法如下：\n\n```\n<数据类型>[]\n```\n\n另一种语法：\n\n```\n\
    <数据类型>[]\n```\n\n示例：\n\n```\nint arrayExample[];\n```\n\n数组可以如下方式初始化：\n\n```\n\
    arrayExample[0]=10;\n```\n\n该行表示 10 存储在索引 0 处。数组也可以同时声明并初始化：\n\n```\nint arrayExample[]\
    \ = {10,21,22};\n```\n\n这些变量是特定于对象的。\n\n示例：\n\n```java\npublic class JavaArrayExample{\n\
    \    public static void main(String args[]){\n        int myarr[] = new int[15];\n\
    \        for (int p=0 ;p<15;p++){\n            myarr[p]=p+1;\n        }\n    \
    \    for (int p=0;p<15;p++){\n            System.out.println(\"myarr[\"+p+\"]=\"\
    +myarr[p]);\n        }\n        System.out.println(\"Array Length: \"+myarr.length);\n\
    \    }\n}\n```\n\n数组将显示位于不同索引的元素：\n\n```\nmyarr[0] = 1\nmyarr[1] = 2\nmyarr[2]\
    \ = 3\nmyarr[3] = 4\nmyarr[4] = 5\nmyarr[5] = 6\nmyarr[6] = 7\nmyarr[7] = 8\n\
    myarr[8] = 9\nmyarr[9] = 10\nmyarr[10] = 11\nmyarr[11] = 12\nmyarr[12] = 13\n\
    myarr[13] = 14\nmyarr[14] = 15\nArray Length = 15\n```\n\n我们也得到了数组的长度，为 15。\n\n\
    ## 多维数组\n\n这些可以被视为数组的数组。在多维数组中，你只需要添加另一个方括号来定义另一个索引。示例：\n\n```\nint arr2[][] =\
    \ new int[12][45];\n```\n\n你有权控制多维数组的长度。\n\n示例：\n\n```java\npublic class JavaArrayExample2\
    \ {\npublic static void main(String[] args) {\n\n// 创建一个二维数组。\nint arr2[][] =\
    \ new int[12][45];\n// 仅赋值三个元素\narr2[0][0] = 0;\narr2[1][1] = 12;\narr2[3][2]\
    \ = 23;\nSystem.out.println(arr2[0][0] + \" \");\nSystem.out.println(arr2[1][1]\
    \ + \" \");\n}\n}\n```\n\n程序将返回索引 [0][0] 和 [1][1] 处存储的值，如下：\n\n![](img/7911bbd6775001f16b2e1aab0ab64f4b_37_0.png)\n\
    \n"
