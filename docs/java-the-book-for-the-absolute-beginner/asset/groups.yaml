  mdcn: "\n## 18-Java AWT\n\nAWT 代表 Abstract Window kit（抽象窗口工具包），它是我们用于 Java 开发基于窗口或\
    \ GUI 应用程序的 API。Java AWT 的组件是平台无关的，这意味着这些组件是根据操作系统进行显示的。该 API 是重量级的，意味着它的组件使用了操作系统的资源。\n\
    \njava.awt 包包含许多用于 AWT API 的类，如 TextField、Label、RadioButton、CheckBox、TextArea、Choice、List\
    \ 等。让我们来讨论其中一些重要的组件：\n\n- Container（容器）-这是一种 AWT 组件，能够容纳其他组件，如文本字段、标签、按钮、文本区域等。它被\
    \ Frame、Panel 和 Dialog 等类所派生。\n\n- Window（窗口）-这是一个没有菜单栏和边框的容器。要创建一个窗口，可以使用 dialog（对话框）、frame（帧）或另一个窗口。\n\
    \n## Java：初学者教程\n\n- Panel（面板）-这是一个没有菜单栏和标题栏的容器。你可以向它添加文本字段和按钮等其他组件。\n\n- Frame（帧）-这是一个带有标题栏的容器，它可能带有菜单栏。你可以向它添加文本字段和按钮等其他组件。\n\
    \n此类带有不同的方法，其中最重要的包括以下：\n\n- public void add(Component c)-此方法将组件添加到该组件中。\n\n-\
    \ public void getSize(int width, int height)-此方法设置组件的尺寸，包括宽度和高度。\n\n- public void\
    \ setLayout(LayoutManager m)-此方法定义组件的布局管理器。\n\n- public void setVisible(boolean\
    \ status)-这是我们用来更改组件可见性的方法。它的默认设置为 false。\n\n我们需要创建一个 awt 示例。为此我们需要一个 frame。我们可以通过两种方式来创建它：\n\
    \n- 通过扩展 Frame 类（继承）。\n\n- 通过创建 Frame 类的对象（关联）。\n\n让我们通过继承 Frame 类来创建第一个示例。我们将在帧中添加一个按钮：\n\
    \n```java\nimport java.awt.*;\npublic class MyGui extends Frame {\n    MyGui()\
    \ {\n        Button btn=new Button(\"click Here\");\n        btn.setBounds(30,100,60,30);//设置按钮的位置\n\
    \        add(btn);//将按钮添加到帧中\n        setSize(300,300);//设置帧的大小，宽度 300，高度 300\n\
    \        setLayout(null);//无布局管理器\n        setVisible(true);//让帧可见，默认不可见\n   \
    \     it is not visible\n    }\n\n    public static void main(String args[]) {\n\
    \        MyGui mg=new MyGui();\n    }\n}\n```\n\n代码执行后将返回以下结果：\n\n![](img/7911bbd6775001f16b2e1aab0ab64f4b_166_0.png)\n\
    \n我们使用了 setBounds() 方法来设置按钮的位置。\n\n现在让我们展示如何通过关联来创建 awt：\n\n```java\nimport java.awt.*;\n\
    public class MyGui2 {\n    MyGui2() {\n        Frame fr=new Frame();\n       \
    \ Button btn=new Button(\"click here\");\n        btn.setBounds(30,50,80,30);\n\
    \        fr.add(btn);\n        fr.setSize(300,300);\n        fr.setLayout(null);\n\
    \        fr.setVisible(true);\n    }\n\n    public static void main(String args[])\
    \ {\n        MyGui2 mg=new MyGui2();\n    }\n}\n```\n\n代码应该返回以下图形用户界面：\n\n![](img/7911bbd6775001f16b2e1aab0ab64f4b_167_0.png)\n\
    \n## 事件处理\n\n事件是指改变对象状态的过程。事件的示例包括拖动鼠标按钮、点击按钮等。名为 java.awt.event 的 Java 包提供了许多监听器接口和事件类用于处理事件。\n\
    \n要处理事件，你必须向监听器（Listener）注册必要的组件。例如，如果是按钮，你希望它在被点击时做出响应。在我们之前的示例中，按钮在被点击时什么都不做。要将组件注册到监听器，我们通常像下面所示调用\
    \ actionListener() 方法：\n\n```java\npublic void addActionListener(ActionListener\
    \ a) {\n}\n```\n\n现在我们已经向监听器注册了组件，可以添加事件处理代码了。考虑下面的示例：\n\n```java\nimport java.awt.*;\n\
    import java.awt.event.*;\nclass MyEvent extends Frame implements ActionListener\
    \ {\n    TextField txtf;\n    MyEvent() {\n      //创建组件\n      txtf=new TextField();\n\
    \      txtf.setBounds(60,170,20);\n      Button btn=new Button(\"click Here\"\
    );\n      btn.setBounds(100,120,80,30);\n      //将组件注册到监听器\n      btn.addActionListener(this);\n\
    \      // 将按钮添加到帧中\n      add(btn);\n      //设置帧的大小\n      setSize(300,300);\n\
    \      //无布局管理器\n      setLayout(null);\n      //让帧可见\n      setVisible(true);\n\
    \    }\n\n    public void actionPerformed(ActionEvent e) {\n      txtf.setText(\"\
    This message\");\n    }\n\n    public static void main(String args[]) {\n    \
    \  new MyEvent();\n    }\n}\n```\n"
