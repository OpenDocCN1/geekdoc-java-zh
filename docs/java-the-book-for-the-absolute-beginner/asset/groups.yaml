    # 3-Variables in Java


    A variable can be seen as a container responsible for holding value during the
    life of a program. Each variable is of a certain data type, designative the value
    it can hold. There are two steps in using Java variables: variable declaration,
    and variable initialization.


    # Variable Declaration


    The declaration of a variable involves giving it a name and specifying its data
    type. Below are examples of valid variable declaration:


    ```

    int a, x, p;

    float pi;

    ```'
