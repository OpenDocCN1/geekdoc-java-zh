  mdcn: "\n\n## 6-Java 中的运算符 (Operators)\n\n运算符是用于执行操作的符号。例如，`+` 符号用于算术运算。Java 支持不同的运算符：\n\
    \n### 一元运算符\n\n这是接收一个操作数的运算符。它们用于增加/减少一个值。它们包括 `++`（增）和 `--`（自减）。\n\n示例：\n\n```java\n\
    public class JavaUnaryOperator{\n  public static void main(String args[]){\n \
    \   int p=0;\n    System.out.println(p++);//从 0 到 1\n    System.out.println(++p);//2\n\
    \    System.out.println(p--);//1\n    System.out.println(--p);//0\n}\n```\n\n\
    程序执行后将打印以下内容：\n\n0\n2\n2\n0\n\n`p++` 意味着在执行增之前先读取 p 的值；因此，我们得到的 p 的值为 0。如果是 `++p`，那么我们得到的\
    \ p 的第一个值将是 1。你可以尝试一下。\n\n### 算术运算符\n\n这些运算符用于执行如乘法、加法、除法、减法等数学运算。它们用作数学运算符。\n\
    \n示例：\n\n```java\npublic class ArithmeticOperators{\npublic static void main(String\
    \ args[]) {\nint p=13;\nint q=4;\nSystem.out.println(p+q); //17\nSystem.out.println(p-q);\
    \ //9\nSystem.out.println(p*q); //52\nSystem.out.println(p/q); //3\nSystem.out.println(p%q);\
    \ //6\n}\n```\n\n代码执行后返回以下结果：\n\n```\n17\n9\n52\n3\n6\n```\n\n我们有两个整数变量 `p` 和\
    \ `q`，并初始化了它们各自的值。我们得到了这些变量的加、减、乘、除。由于变量被声明为整数而不是浮点或或双精度，除法忽略了小数部分。唯一看起来陌生的运算符可能是\
    \ `%`（取模运算符），它返回除法后的余数。\n\n### 逻辑运算符\n\n这些运算符与二值值一起使用。它们有助于在循环和条件语句中评估条件。它们包括\
    \ `||`、`&&`、`!`。假设我们有两个布尔变量 `a1` 和 `a2`，适用以下条件：\n\n- `a1&&a2` 如果 `a1` 和 `a2` 都为\
    \ true，则返回 `true`，否则返回 `false`。\n- `a1||a2` 如果 `a1` 和 `a2` 都为 false，则返回 `false`，否则返回\
    \ `true`。\n- `!a1` 返回 `a1` 的反值。\n\n示例：\n\n```java\npublic class JavaLogicalOperator\
    \ {\n    public static void main(String args[]) {\n        boolean p = true;\n\
    \        boolean q = false;\n\n        System.out.println(\"p && q: \" + (p&&q));\n\
    \        System.out.println(\"p || q: \" + (p||q));\n        System.out.println(\"\
    !(p && q): \" + !(p&&q));\n    }\n}\n```\n\n程序执行后返回以下内容：\n\n![](img/7911bbd6775001f16b2e1aab0ab64f4b_41_0.png)\n\
    \n变量 `p` 的值被设置为 `true`，而变量 `q` 的值被设置为 `false`。在第一的情况下，我们使用 `&&` 运算符，因此 `true`\
    \ 和 `false` 返回 `false`。在第二情况下，我们使用 `||` 运算符，因此 `true` 或 `false` 得到 `true`。在最后的情况下，我们对\
    \ `&&` 操作的结果进行了取反。\n\n### 比较运算符\n\nJava 支持 6 种比较运算符：`==`、`!=`、`<`、`>=`、 `<=`\n\
    \n- `==` 如果左右双方相等，则返回 `true`。\n- `!=` 如果运算符的左右双方不等，则返回 `true`。\n- `>` 如果左侧大于右侧，则返回\
    \ `true`。\n- `<` 如果左侧小于右侧，则返回 `true`。\n- `>=` 如果左侧大于等于右侧，则返回 `true`。\n- `<=` 如果左侧小于右侧，则返回\
    \ `true`。\n\n示例：\n\n```java\npublic class RelationalOperator {\n    public static\
    \ void main(String[] args[]) {\n        int p = 10;\n        int q = 15;\n   \
    \     if (p==q)\n            System.out.println(\"p and q are equal\");\n    \
    \    else\n            System.out.println(\"p and q aren't equal\");\n\n     \
    \   if (p != q) {\n            System.out.println(\"p and q aren't equal\");\n\
    \        } else {\n            System.out.println(\"p and q are equal\");\n  \
    \      }\n\n        if (p > q){\n            System.out.println(\"p is greater\
    \ than q\");\n        } else {\n            System.out.println(\"p isn't greater\
    \ than q\");\n        }\n\n        if (p >= q){\n            System.out.println(\"\
    p is equal or greater than q\");\n        } else {\n            System.out.println(\"\
    p is less than q\");\n        }\n\n        if (p < q){\n            System.out.println(\"\
    p is less than q\");\n        } else {\n            System.out.println(\"p isn't\
    \ less than q\");\n        }\n\n        if (p <= q) {\n            System.out.println(\"\
    p is equal or less than q\");\n        } else {\n            System.out.println(\"\
    p is greater than q\");\n        }\n    }\n}\n```\n\n我们使用了各种比较运算符来比较变量 `p` 和 `q`\
    \ 的值。\n\n## 7-条件语句 (Decision Making)\n\n在 Java 中，条件语句帮助我们根据操作的结果执行语句。\n\n### if\
    \ 语句\n\n`if` 语句用于测试条件。语法：\n\n```java\nif (条件) {\n    // 语句\n}\n```\n\n示例：\n\n\
    ```java\npublic class IfStatement {\n    public static void main(String args[])\
    \ {\n        int x = 10;\n        if (x > 5) {\n            System.out.println(\"\
    x is greater than 5\");\n        }\n    }\n}\n```\n\n### else 语句\n\n如果 `if` 条件不成立，则执行\
    \ `else`:\n\n```java\nif (条件) {\n    // 语句\n} else {\n    // 语句\n}\n```\n\n示例：\n\
    \n```java\npublic class IfElseStatement {\n    public static void main(String\
    \ args[]) {\n        int x = 3;\n        if (x > 5) {\n            System.out.println(\"\
    x is greater than 5\");\n        } else {\n            System.out.println(\"x\
    \ is not greater than 5\");\n        }\n    }\n}\n```\n\n### else if 语句\n\n如果你有多个条件需要测试，可以使用\
    \ `else if`：\n\n```java\nif (条件1) {\n    // 语句\n} else if (条件2) {\n    // 语句\n\
    } else {\n    // 语句\n}\n```\n\n示例：\n\n```java\npublic class IfElseIfStatement\
    \ {\n    public static void main(String args[]) {\n        int x = 15;\n     \
    \   if (x < 5) {\n            System.out.println(\"x is less than 5\");\n    \
    \    } else if (x < 10) {\n            System.out.println(\"x is less than 10\"\
    );\n        } else {\n            System.out.println(\"x is greater than or equal\
    \ to 10\");\n        }\n    }\n}\n```\n\n"
