    \ `super` 关键字：\n\n```java\nsuper(values);\n```\n\n以下示例演示了这一点：\n\n```java\nclass\
    \ MySuperclass {\n  int x;\n  MySuperclass(int x) {\n    this.x = x;\n  }\n  public\
    \ void getX() {\n    System.out.println(\"The value of x in super class: \" +x);\n\
    \  }\n}\npublic class MySubclass extends MySuperclass {\n  MySubclass(int x) {\n\
    \    super(x);\n  }\n  public static void main(String argd[]) {\n    MySubclass\
    \ sb = new MySubclass(32);\n    sb.getX();\n  }\n}\n```\n\n## Java: 零基础入门教程\n\n\
    代码在执行时将产生以下输出：\n\nThe value of x in super class is: 32\n\n在上面的示例中，我们演示了如何使用 `super`\
    \ 关键字来访问父类中定义的参数化构造函数。程序既有父类也有子类，父类拥有一个接收整数值的参数化构造函数。我们随后使用了 `super` 关键字来访问该构造函数。\n\
    \n## instanceof 关键字\n\n该关键字可用于检查一个对象是否是另一个对象的实例。让我们通过一个示例来展示：\n\n```java\ninterface\
    \ Mammal{}\nclass Cow implements Mammal{\n  public class BabyCow extends Cow {\n\
    \    public static void main(String args[]) {\n      Cow c = new Cow();\n    \
    \  BabyCow bc = new BabyCow();\n\n      System.out.println(c instanceof Mammal);\n\
    \      System.out.println(bc instanceof Cow);\n      System.out.println(bc instanceof\
    \ Mammal);\n    }\n  }\n}\n```\n\n代码应返回以下结果：\n\n```\ntrue\ntrue\ntrue\n```\n\n\
    此截图显示我们的测试结果为 true。这意味着 `Cow` 是 `Mammal` 的实例，`BabyCow` 是 `Cow` 的实例，且 `BabyCow`\
    \ 也是 `Mammal` 的实例。\n\n## Java 中的抽象\n\n抽象是一项让开发者只向用户展示必要内容而隐藏其他所有内容的特性。开发者必须区分哪些是必须展示给用户的内容，哪些是不需要的。例如，当你发送电子邮件时，你需要输入内容、添加文档并点击“发送”按钮，而无需知道背后发生了什么。同样，当你开车时，你踩下油门就能看到速度增加，当踩下刹车时汽车就会停止。你并不知道后台发生了什么。这就是我们在本章中将讨论的抽象。\n\
    \n通过抽象，用户感知不到实现细节。开发者隐藏了它们。用户只获取应用程序的功能。因此，用户获取的是关于程序做什么的信息，而不是如何实现。*abstract*\
    \ 类拥有 *abstract* 关键字。如果任何类拥有抽象方法，它就必须被识别为抽象类。抽象类还必须继承自另一个抽象类。\n\n示例：\n\n```java\n\
    abstract class Student {\n    abstract void register();\n}\n\npublic class John\
    \ extends Student {\n    void register() {\n        System.out.println(\"John\
    \ is going for registration\");\n    }\n\n    public static void main(String args[])\
    \ {\n        Student st = new John();\n        st.register();\n        System.out.println(\"\
    Done\");\n    }\n}\n```\n\n代码在执行后返回如下结果：\n\n> John is going for registration\n\
    > Done\n\n抽象类并不一定非包含抽象方法。你不能实例化抽象类。这就是为什么我们实例化了 `John` 类，因为它继承了抽象类的方法。\n\n示例：\n\
    \n```java\npublic abstract class Worker {\n    private String name;\n    private\
    \ String workerAddress;\n```\n\n"
