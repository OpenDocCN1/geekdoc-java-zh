    # 15-Java Applets


    Applets are Java programs that run on web browsers. An applet may act as a fully
    functional app since it comes with a full Java API. The applet class extends *java.applet.Applet*.
    Applets don''t have the main method, hence they don''t invoke main(). They are
    instead embedded on HTML pages. After an HTML page with an applet is opened, its
    code is downloaded to the local machine. The JVM (Java Virtual Machine) is mandatory
    for you to view applets.

    Applets are processed on the client side; hence they give users a quick response
    compared to other apps. Applets offer good security.


    # Applets'' Lifecycle


    Applets go through these steps:


    +   1. **Initialization**- the *init()* method initializes applets.


    +   2. **Starting**- the *start()* method starts applets.


    +   3. **Painting**- done after calling *paint()* method.'
