    );\n        final Label lab = new Label();\n        lab.setAlignment(Label.CENTER);\n\
    \        lab.setSize(100,100);\n        CheckboxGroup cg = new CheckboxGroup();\n\
    \        Checkbox cbl = new Checkbox(\"yes\", cg, false);\n        cbl.setBounds(10,\
    \ 20, 100, 20);\n        Checkbox cb2 = new Checkbox(\"No\", cg, false);\n   \
    \     cb2.setBounds(10, 50, 100, 20);\n        fr.add(cbl);\n        fr.add(cb2);\n\
    \        fr.add(lab);\n        fr.setSize(400,400);\n        fr.setLayout(null);\n\
    \        fr.setVisible(true);\n    }\n    cbl.addItemListener(new ItemListener()\
    \ {\n        public void itemStateChanged(ItemEvent ev) {\n            lab.setText(\"\
    Yes checkbox: Checked\");\n        }\n    });\n    cb2.addItemListener(new ItemListener()\
    \ {\n        public void itemStateChanged(ItemEvent ev) {\n            lab.setText(\"\
    No checkbox: Checked\");\n        }\n    });\n    public static void main(String[]\
    \ args) {\n        new MyCheckboxGroup2();\n    }\n}\n```\n\nRun the code and\
    \ click any of the checkboxes. You will see some text on the label.\n\nThe text\
    \ will change when you click another checkbox:\n\n![](img/7911bbd6775001f16b2e1aab0ab64f4b_188_0.png)\n\
    \nWe have successfully added an ItemListener to the checkbox group.\n\n## AWT\
    \ Menu and MenuItem\n\nThese are used for adding menus and menu items to the menu.\
    \ This can be explained best by creating an example:\n\n```java\nimport java.awt.*;\n\
    class MyMenu {\n  MyMenu() {\n    Frame fr= new Frame(\"My Menu and MenuItem\"\
    );\n    MenuBar mnb=new MenuBar();\n    Menu mn=new Menu(\"File\");\n    Menu\
    \ smn=new Menu(\"Save\");\n    MenuItem i1=new MenuItem(\"New\");\n    MenuItem\
    \ i2=new MenuItem(\"Copy\");\n    MenuItem i3=new MenuItem(\"Cut\");\n    MenuItem\
    \ i4=new MenuItem(\"Save\");\n    MenuItem i5=new MenuItem(\"Save As\");\n   \
    \ mn.add(i1);\n    mn.add(i2);\n    mn.add(i3);\n    smn.add(i4);\n    smn.add(i5);\n\
    \    mn.add(smn);\n    mnb.add(mn);\n    fr.setMenuBar(mnb);\n    fr.setSize(400,400);\n\
    \    fr.setLayout(null);\n    fr.setVisible(true);\n  }\n  public static void\
    \ main(String args[])\n  {\n    new MyMenu();\n  }\n}\n```\n\nRun the code and\
    \ you will get a window. Click the File menu at the top left corner of the window.\
    \ You will see several menu items under it. Click the Save option and see the\
    \ submenus added to it:\n\n![](img/7911bbd6775001f16b2e1aab0ab64f4b_189_0.png)\n\
    \n## KeyListener Interface\n\nThe KeyListener will be notified after you have\
    \ changed the state of the key. The notification is done against the KeyEvent.\
    \ The KeyListener interface in the java.awt.event package has three important\
    \ methods:\n\n- `void keyPressed(KeyEvent ev)`\n- `void keyReleased(KeyEvent ev)`\n\
    - `void keyTyped(KeyEvent ev)`\n\nConsider the example:\n\n```java\nimport java.awt.*;\n\
    import java.awt.event.*;\npublic class MyKeyListener extends Frame implements\
    \ KeyListener {\n    Label lab;\n    TextArea area;\n\n    MyKeyListener() {\n\
    \        Frame fr = new Frame(\"KeyListener\");\n        lab = new Label();\n\
    \        lab.setAlignment(Label.CENTER);\n        lab.setSize(100,100);\n    \
    \    area = new TextArea();\n        fr.add(lab);\n        fr.add(area);\n   \
    \     fr.setSize(400,400);\n        fr.setLayout(null);\n        fr.setVisible(true);\n\
    \        fr.addKeyListener(this);\n    }\n\n    @Override\n    public void keyPressed(KeyEvent\
    \ ev) {\n        lab.setText(\"Key Pressed\");\n    }\n\n    @Override\n    public\
    \ void keyReleased(KeyEvent ev) {\n        lab.setText(\"Key Released\");\n  \
    \  }\n\n    @Override\n    public void keyTyped(KeyEvent ev) {\n        lab.setText(\"\
    Key Typed\");\n    }\n\n    public static void main(String args[]) {\n       \
    \ new MyKeyListener();\n    }\n}\n```\n\nExecute the code and click any of the\
    \ checkboxes. You will see some text on the label.\n\n![](img/7911bbd6775001f16b2e1aab0ab64f4b_191_0.png)\n\
    \n## Conclusion\n\nThis marks the end of this book. Java is a popular language.\
    \ It is easy to learn, especially with object-oriented programming. It supports\
    \ features like polymorphism, inheritance, encapsulation. To code in Java, you\
    \ need the Java compiler (javac) to compile the code and generate a .class file.\
    \ The .class file has byte-code, which is platform-independent, it can be run\
    \ on any platform, example Unix, Windows, Mac OS, etc.\n\n## About the Author\n\
    \nDaniel Bell was born in the Bronx, New York. When he was nine, he moved with\
    \ his father Guy to Nice in France. He received his PhD degree in computer science\
    \ from the University of Nice in 2012. Daniel is conducting research in data management,\
    \ with an emphasis on topics related to Big Data and data sharing, such as probabilistic\
    \ data, data pricing, parallel data processing, data security. He spends his free\
    \ time writing books on computer programming and data science to help absolute\
    \ beginners in computer programming code easily. He lives in Chatillon, near Paris.\n\
    \n## Acknowledgments\n\nForemost, I would like to express my sincere gratitude\
    \ to my family, my wife Genevieve and my son Adan for the continuous support in\
    \ my everyday life, for their patience, motivation, enthusiasm. Besides my family,\
    \ I would like to thank my friends and colleagues: Prof. Jule Villepreux, Hugo\
    \ D. and Dr. James Rivera, for their encouragement, insightful comments, and hard\
    \ questions. I thank my fellow labmates: Gang Yu, Ting Fan, Djibrilla Diallo,\
    \ Juan Sanchez, for the stimulating discussions, for the sleepless nights we were\
    \ working together before deadlines, and for all the fun we had. Last but not\
    \ least, I would like to thank my parents Guy Bell and Ezra Bell, for giving birth\
    \ to me at the first place and supporting me spiritually throughout my life.\n\
    \nThanks for reading! Please add a short review and let us know what you thought!\n"
