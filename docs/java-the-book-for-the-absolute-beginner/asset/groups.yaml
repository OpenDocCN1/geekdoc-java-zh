    You can donate blood\");\n      }\n    }\n}\n}\n```\n\n该代码执行后打印以下结果：\n\nYou can\
    \ donate blood.\n\n如果第一个条件变为真，则将测试第二个条件。在我们的案例中情况是真的；因此 `println` 语句被执行了。如果任何条件为假，则\
    \ `println` 语句将不会执行。这意味着为了执行 `println` 语句，所有条件必须测试为真。\n\n# switch 语句\n\n该语句允许我们将某个变量与一组值列表进行等值测试。每个值被称为一个\
