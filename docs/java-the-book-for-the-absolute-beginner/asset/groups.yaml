    \ Java 代码添加到该文件中并保存：\n\n```\npublic class Hello {\n  /* my first java program\n\
    \  * the code will print 'Hello World'\n  */\n  public static void main(String[]\
    \ args) {\n    System.out.println(\"Hello World\"); // to print\n    Hello World\n\
    \  }\n}\n```\n\n一旦你保存了上述代码，打开你操作系统的终端，并导航到保存该文件的目录。\n\n# Java：初学者的书籍\n\n在终端上运行以下命令：\n\
    \n```\njavac Hello.java\n```\n\n上述命令应该生成 `Hello.class` 文件。这是一个包含 Java 字节码的文件，它是平台无关的。你可以检查相同目录下是否存在该文件来确认。我们所做的是对文件调用了\
    \ Java 编译器 (javac) 以编译文件中包含的 Java 代码。\n\n现在代码已经编译且没有错误，我们可以执行它。只需在同一个终端上运行以下命令：\n\
    \n```\njava Hello\n```\n\n上述命令应该在终端上返回如下所示的结果：\n\n![](img/7911bbd6775001f16b2e1aab0ab64f4b_13_0.png)\n\
    \n上述输出显示代码返回了 Hello World 作为输出。\n\n考虑我从代码中提取的这一行：\n\n```\npublic class Hello {\n\
    ```\n\n我们在上述行中中所做的是创建一个名为 Hello 的类。类名中的 H 是大写的；因此，当我们引用该类时，必须这样写。Java 是一种区分大小写的语言。public\
    \ 是一个访问修饰符，将类声明为公共，这意味着它可以从同一包内包含的其他类进行访问。左大括号 { 标记类主体的开始，要关闭它，我们必须使用右大括号 }。\n\
    \n考虑从代码中提取的以下部分：\n\n```\n/* my first java program\n * the code will print 'Hello\
    \ World'\n */\n```\n\n上述是一个注释。注意，我们将它们封装在 /* 和 */ 之间。这是我们在 Java 中表示块注释的方式。注释也可以是单行的，这种注释使用两个正斜杠\
    \ // 来表示。这里有一个例子：\n\n```\n// my first java program\n```\n\nJava 编译器对注释不做任何操作，但它它会跳过它们。注释提高了代码的可读性。它们被用于解释不同行代码的作用。\n\
    \n请注意，文件被命名为 Hello.java，而类被命名为 Hello。如果这两个不以这种方式匹配，将生成错误。当你想要从操作系统的终端运行 Java 代码时，这种情况应该始终保持一致。\n\
    \n# Java：初学者的书籍\n\n这是从代码中提取的另一行代码：\n\n```\npublic static void main(String args[])\
    \ {\n```\n\n上述指的是 main 方法。没有 main 方法，任何 Java 程序都无法运行或执行。这是从代码中提取的另一行代码：\n\n```\n\
    System.out.println(\"Hello World\");\n```\n\n我们调用了一个名为 println 的方法，帮助我们将传递给它的文本打印在显示器上。你还注意到我们使用了两个右大括号\
    \ }}。第一个关闭 main 方法，而第二个关闭类。\n\n## 2-Java 类和对象\n\n正如我们所说的，Java 是一种面向对象的编程语言。这意味着它支持面向对象编程范式的各种概念。\n\
    \n在 Java 中，对象以状态和行为为特征。对象的一个例子是狗。描述它的特征的一些状态包括名字、颜色和品种。描述它的特征的一些行为包括 进食、吠叫和摇尾巴。对象是类的实例。\n\
    \n类是一个模板或蓝图，描述了该类型的任何对象应该支持的状态和行为。这里有一个类的例子：\n\n```java\npublic class Dog {\n\
    \    String name;\n    int breed;\n    String color;\n```\n\n# Java：初学者的书籍\n\n\
    ```java\nvoid eating() {\n}\nvoid barking() {\n}\nvoid sleeping() {\n}\n}\n}\n\
    ```\n\n在上述示例中，我们定义了一个名为 Dog 的类。类内部定义了三个变量，分别是 name、breed 和 color。这些是 Dog 类的属性。我们还为该类定义了\
    \ 3 个方法。这些是 eating()、barking() 和 sleeping()。我们类内部定义许多方法。\n\n## 构造函数\n\n构造函数是类的重要部分。每个类都有一个构造函数。如果你不显式创建类构造函数，Java\
    \ 编译器将自动为类初始化一个默认构造函数。\n\n每当你创建一个新对象，至少会调用一个构造函数。注意有一个规则约束此。\n\n```java\npublic\
    \ class Dog {\n    Dog() {\n    }\n}\n```\n\n# Java：初学者的书籍\n\n这是一个带有参数的构造函数的示例：\n\
    \n```java\npublic class Dog {\n    String name;\n    Dog(String name) {\n    \
    \    name = name;\n    }\n}\n```\n\n## 创建对象\n\n类的目的是提供一个模板，我们从中创建对象。在 Java 中，对象是通过以下步骤创建的：\n\
    \n- 1. 声明 - 这涉及声明变量。\n- 2. 实例化 - new 关键字。\n- 3. 初始化 - 调用构造函数。\n\n下面的示例显示了如何创建对象：\n\
    \n```java\npublic class Dog {\n    public Dog(String breed) {\n        System.out.println(\"\
    You passed the breed :\" + breed);\n    }\n\n    public static void main(String[]\
    \ args) {\n        /* 对象创建 */\n        Dog puppy = new Dog(\"poodle\");\n    }\n\
    }\n```\n\n执行后，代码将返回：\n\nYou passed the breed :poodle\n\n## 访问变量和方法\n\n在类中，我们访问实例变量的方法的方法之一是通过创建对象。实例变量可以通过遵循下面的步骤进行访问：\n\
    \n```\n/* 开始创建一个对象 */\nDogReference = new Dog();\n\n/* 接下来调用变量 */\nObjectReference.variableName;\n\
    \n/* 调用类方法 */\nObjectReference.MethodName();\n```\n\n这里有一个显示此点的示例：\n\n```java\n\
    public class Dog {\n    String name;\n    public Dog(String breed) {\n       \
    \ System.out.println(\"You passed the breed :\" + breed);\n    }\n\n    public\
    \ void setName(String puppyName) {\n        name = puppyName;\n    }\n\n    public\
    \ String getName() {\n        System.out.println(\"Puppy's name is :\" + name);\n\
    \        return name;\n    }\n\n    public static void main(String[] args) {\n\
    \        /* 对象创建 */\n        Dog puppy = new Dog(\"poodle\");\n\n        /* 调用类方法并设置狗的名字\
