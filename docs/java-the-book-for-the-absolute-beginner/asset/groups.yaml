    \n# 8-Java 循环\n\nJava 循环帮助我们重复执行某些任务。循环按顺序执行语句。首先运行第一个，然后是第二个以此类推。让我们讨论 Java 支持的各种循环类型：\n\
    \n# for 循环\n\n只要条件测试为真，循环就会运行。一旦条件变为假，执行立即停止。语法：\n\n```\nfor(initialization; loop_condition\
    \ ; \nIncrement/decrement_part)\n{\n    the_statement(s);\n}\n```\n\n# Java：初学者入门教程\n\
    \n`initialization` 定义循环的初始值。`loop_condition` 指定循环运行必须始终为真的条件。`loop_increment/decrement`\
    \ 定义了每次迭代后初始化值增加或减少的量。示例：\n\n```\npublic class ForLoopExample {\n    public static\
    \ void main(String args[]) {\n        for(int p=0; p<10; p++) {\n            System.out.println(\"\
    The value \" + p + \" is: \" + p);\n        }\n    }\n}\n```\n\n程序返回如下输出：\n\n\
    | The value of p now is: 0 |\n| The value of p now is: 1 |\n| The value of p now\
    \ is: 2 |\n| The value of p now is: 3 |\n| The value of p now is: 4 |\n| The value\
    \ of p now is: 5 |\n| The value of p now is: 6 |\n| The value of p now is: 7 |\n\
    | The value of p now is: 8 |\n| The value of p now is: 9 |\n\n输出显示循环返回变量 `p` 从\
    \ 0 到 9 的值。当循环将 9 增加到 10 时，它发现违反了循环条件 `p<10`，因此立即停止。\n\n# while 循环\n\n只要指定的条件为真，该循环就会执行语句。首先测试条件，如果为真，则执行循环语句。如果条件变为假，将跳转执行循环之后的语句。建议在循环中添加增/减部分，以便在条件变为假时停止循环。否则，循环可能会无限运行。\n\
    \n语法：\n\n```\nwhile (A_boolean_expression) {\n    // Statement(s)\n}\n```\n示例：\n\
    ```java\npublic class JavaWhileLoopExample {\n    public static void main(String\
