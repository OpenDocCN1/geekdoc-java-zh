    \ 到 11 的值。这是因为条件为（5 小于12）。假设我们将循环条件设置为假，例如将 `p` 的值初始化为 20。\n\n# do...while 循环\n\
    \n这与 `while` 循环密切相关。在 `while` 循环中，体可能永远不执行但在 `do...while` 循环中，体至少执行一次。\n\n语法：\n\
