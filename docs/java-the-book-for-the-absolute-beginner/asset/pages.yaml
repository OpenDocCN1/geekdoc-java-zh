  md: '# 11-Abstraction in Java


    Abstraction is a feature that makes a developer present to the user, only what
    is necessary and hides the rest. The developer must differentiate what is necessary
    to be presented to the users from what is not. When you send an email, for example,
    you need to type the content, attach documents and press the “Send” button, without
    knowing what happens behind the scenes. Also, when you drive a car, you press
    the accelerator and you see the speed increasing, and when you press the brakes
    your car stops. You don’t know what happens in the background. This is the abstraction
    we will talk about, in this chapter.


    With abstraction, users aren’t aware of the implementation details. The developer
    hides them. The user gets only the functionality of the app. Thus, the user gets
    information on what app does rather than how it’s done. An *abstract* class has
    the *abstract* keyword. If'
