  md: '# Reading and Writing Files


    We use the **InputStream** to read data from a source and **OutputStream** to
    write data to a destination. The most important streams for reading and writing
    files are the **FileInputStream** and **FileOutputStream**.


    The **FileInputStream** helps us to read data from files. We can create objects
    by use of the new keyword and we have access to a wide range of constructors.
    Consider the example given below:


    ```

    InputStream f = new FileInputStream("F:/java/names");

    ```


    In the above example, the constructor takes the name of a file as a string for
    creation of an input stream object for reading the file. Consider the next example
    given below:


    ```

    File f = new File("F:/java/names");

    InputStream f = new FileInputStream(f);

    ```


    In the above case, we have a constructor taking a file object for creation of
    an **input stream** object to be used for reading the file. We have first used
    the **File()** method to create a file object.


    Once you have created the **InputStreamObject**, you are provided with several
    helper methods you can use for the purpose of reading the stream or perform other
    operations on it.


    We use the **FileOutputStream** for the purpose of creating a file then writing
    some data into it. The stream will create a file if it is not found before it
    can be opened.'
