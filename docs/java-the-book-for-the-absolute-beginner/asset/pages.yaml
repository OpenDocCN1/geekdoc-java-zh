  md: '# Java: The Book For The Absolute Beginner


    double p;


    char c;


    The int, float, double and char are the data types, specifying the value each
    variable can or should hold. To declare several variables in one line, separate
    them using a comma (,) as in the first example. A variable declaration should
    end with a semicolon (;).


    # Variable Initialization


    Variable initializing involves assigning it a valid value. The value to be assigned
    to the variable is determined by the data type the variable is of. Below are examples
    of valid variable initializations.


    ```

    pi = 1;

    a = 10.5;

    c = ''s'';

    ```


    Both declaration and initialization of a variable can be done at once as shown
    below:


    ```

    int a=1, x=4, p=5;

    float pi=3.14f;

    double p=15.23d;

    char c=''s'';

    ```'
