  md: '# 1-Getting Started with Java


    # What is Java?


    Java is both a platform and a programming language. As a platform, we have the
    Java runtime environment (JRE) which is a software environment on which programs
    can run. As a language, Java is a high-level, robust and object-oriented programming
    language. The language was developed by Sun Microsystems in 1995.


    Since Java is an object-oriented programming language, it treats everything as
    an object. The object model nature of the language also makes it easy for us to
    extend it. Java programs go through two steps to generate results. The first step
    is compilation after which the Java bytecode is generated. The Java bytecode is
    platform independent, meaning that it can be run on any machine. After the compilation,
    the bytecode is passed through the execution step to generate the results.


    Java is known to be an easy language. If you are familiar with the'
