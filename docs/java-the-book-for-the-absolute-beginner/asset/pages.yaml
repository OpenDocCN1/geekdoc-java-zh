  md: "# 10-Inheritance in Java\n\nIn inheritance, an object gains the behaviors and\
    \ properties of another object. The object gaining the behaviors and the properties\
    \ becomes the child, while the object from which they are inherited is the parent.\
    \ They can also be referred to as subclass and superclass, respectively. Inheritance\
    \ makes information manageable in a hierarchical order. The methods that had been\
    \ defined in the superclass can be reused in the subclass without defining them\
    \ again.\n\nTo Inher from a parent class, we use the extends keyword. Inheritance\
    \ is done using the syntax given below:\n\n```\nclass Child-class-name extends\
    \ Parent-class-name\n{\n  // fields and methods\n}\n```\n\nThe extends keyword\
    \ is an indication that we are creating some new class from the existing class."
