  md: "# Finally Statement\n\nThe finally block comes after the try or catch block.\
    \ This block will always be executed, regardless of whether or not the exception\
    \ occurred. The final statement provides you with a good way of running your cleanup-type\
    \ statements you need to be executed regardless of what happens inside your protected\
    \ code. It should be added at the end of the catch blocks as showed in the following\
    \ syntax:\n\n```\ntry {\n  // The protected code\n} catch (ExceptionType ex1)\
    \ {\n  // A Catch block\n} catch (ExceptionType2 ex2) {\n  // A Catch block\n\
    } catch (ExceptionType3 ex3) {\n  // A Catch block\n} finally {\n  // The finally\
    \ block to always execute.\n}\n```\n\nThe following example shows this:\n\n```\n\
    public class ExceptionTest {\n  public static void main(String args[]) {\n   \
    \ int x[] = new int[3];\n    try {\n      System.out.println(\"Access element\
    \ four: \" + x[0]);\n    } catch (ArrayIndexOutOfBoundsException ex) {\n     \
    \ System.out.println(\"Exception thrown : \" + ex);\n    } finally {\n      x[0]\
    \ = 0;\n      System.out.println(\"Element at index 0 is: \" + x[0]);\n    }\n\
    }\n```"
