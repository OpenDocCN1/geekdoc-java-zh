  md: '# About the Author


    Daniel Bell was born in the Bronx, New York. When he was nine, he moved with his
    father Guy Bell to Nice in France. He received his PhD degree in computer science
    from the University of Nice (France) in 2012. Daniel is conducting research in
    data management, with an emphasis on topics related to Big Data and data sharing,
    such as probabilistic data, data pricing, parallel data processing, data security.
    He spends his free time in the writing of books on computer programming and data
    science, to help the absolute beginners in computer programming to code easily.
    He lives in Chatillon, near Paris.'
