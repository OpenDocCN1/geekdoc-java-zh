  \ 赋值对象引用变量\n\n在上一个示例中，你可能注意到创建了两个 `Cylinder` 类的对象，并且它们都维护了各自实例变量的副本。此外，如果对对象的实例变量副本进行任何更改，都不会影响其他对象。但是，如果你希望两个对象共享同一份实例变量副本，可以通过将对象引用变量赋值给另一个变量来实现。将对象引用变量赋值给另一个变量的语法如下：\n\
  \n```java\nclass_name var_name = obj_ref_var;\n```\n\n在此语法中，`class_name` 代表一个类。`obj_ref_var`\
  \ 代表一个对象引用变量，它已经指向由 `class_name` 代表的对象。`obj_ref_var` 通过赋值运算符（`=`）将引用赋值给由 `var_name`\
  \ 指定变量。\n\n例如：\n```java\nRectangle obj1 = new Rectangle( );\nRectangle obj2 = obj1;\n\
  ```\n在此示例中，`Rectangle` 类的 `obj1` 和 `obj2` 对象共享 `length` 和 `breadth` 实例变量的同一副本，如图\
  \ 4-4 所示。如果其中一个对象对其实例变量的值进行任何更改，另一个对象也会受到影响。\n\n![4-4](img/4-4.jpg)\n\n### 示例 3\n\
