  \n# 第 6 章\n\n![1788.jpg](img/1788.jpg)\n\n## 包、接口和内部类\n\n### 学习目标\n完成本章后，你将能够：\n\
  - 理解对象类的概念\n- 理解包的概念\n- 理解接口的概念\n- 理解嵌套类的概念\n\n### 单元介绍\n在上一章中，你学习了超类和子类的概念。在本章中，你将学习\
  \ `Object` 类，它是在 Java 中创建的每个类的超类。此外，你还将学习包、接口和内部类。定义在另一个类体内部的类被称为内部类。包被视为类的容器。此外，它们还被用于提供访问保护和命名空间管理。\n\
  \n### Object 类\n在 Java 中，每个类（无论是超类还是子类）都自动派生自 `Object` 类。`Object` 类位于类层级结构的顶端。因此，该类被视为所有使用\
  \ Java 定义的类的超类。`Object` 类提供了某些方法，可以用于特定的目的，例如比较两个对象的内容、从现有对象创建新对象等等。这些方法及其简要描述如表\
  \ 6-1 所示。\n\n#### 表 6-1 `object` 类的方法\n\n| 方法 |  |\n| :--- | :--- |\n| `protected\
  \ object clone()` | 用于从现有对象创建新对象 |\n| `boolean equals(Object obj)` | 用于比较两个对象的内容\
  \ |\n| `protected void finalize()` | 当对象即将被销毁时，垃圾回收器会调用此方法 |\n| `Class getclass()`\
  \ | 在运行时返回对象的类类型 |\n| `int hashCode()` | 返回调用对象的哈希码值 |\n| `void notify()` | 唤醒一个正在等待调用对象的单个线程\
  \ |\n| `void notifyAll()` | 唤醒所有正在等待调用对象的线程 |\n| `String toString()` | 返回一个表示对象的文本化形式的字符串\
  \ |\n| `void wait()` `wait(long time)` `wait(long time, int nanosecond)` | 导致当前线程等待\
  \ |\n\n`Object` 类的某些方法如 `getclass()`、`notify()`、`notifyall()` 和 `wait()` 被声明为 `final`，因此在其他类中不能被重写。然而，你可以重写剩余的方法。\n\
  \n### 包 (Packages)\n\n你可能已经注意到，在前面的章节中，程序是使用不同的名称定义的。这样做是为了避免名称冲突，因为这些程序中的所有类都使用了相同的命名空间。为了解决这个问题，Java\
  \ 提供了包的机制。包被定义为类的容器。它提供了命名和访问保护控制机制。你不仅可以在包内部定义类，还可以定义它们对同一包内其他部分的可见性。可见性也可以定义给其他包。包分为两种类型：\n\
  \n### 内置包 (Built-in packages)\n在 Java 库中已经定义的包，如 `java.io.*`、`java.lang.*` 等被称为内置包。\n\
  \n### 用户自定义包 (User defined packages)\n由用户创建的包被称为用户自定义包。\n\n### 定义包\n你可以通过将包语句作为\
  \ Java 程序的第一个条语句来定义或创建一个包。定义包的语法如下如下：\n\n```java\npackage pack_name;\n```\n\n在该语句中，`package`\
  \ 是一个关键字，`pack_name` 定义了包名。\n\n当类在包内部声明时，它只属于那个特定的包。但如果在声明类时没有定义包，则该类将被包含在默认包 `java.lang`\
  \ 中。在 Java 中，每个程序文件中只能包含一个包语句，但同一个包语句可以包含在多个程序文件中。\n\n例如：\n\n```java\npackage demo;\n\
  \nclass A\n{\n----------\n----------\n}\n```\n\n在此示例中，包语句 `package demo;` 作为源文件的第一个语句包含，`A`\
  \ 类被声明在 `demo` 包内部。现在，`A` 类属于 `demo` 包。\n\n每当创建一个包时，Java 都会使用文件系统目录来存储该包。定义在该包内部的所有类都存储在文件系统目录下。存储包的目录名称应与包名相同。\n\
  \n### 访问包\n如你所知，当创建一个包时，Java 将其存储在文件系统目录。默认情况下，Java 在当前工作目录下创建一个子目录来存储新创建的包。例如，如果当前目录是\
  \ `bin`，Java 会其中创建一个与包同名的子目录。\n\n### 示例 1\n以下示例演示了包的使用。程序将计算学生在三门学科中的平均分并在屏幕上显示结果值。\n\
  \n```java\n//计算三门学科平均分的程序\npackage Student;\nclass Avg_demo\n{\n    double sub1,\
  \ sub2, sub3, result;\n    void get_points(double s1, double s2, double s3)\n  \
  \  {\n        sub1 = s1;\n        sub2 = s2;\n        sub3 = s3;\n    }\n    void\
  \ average()\n    {\n        result = (sub1+sub2+sub3)/3;\n        System.out.println(\"\
  Average is: \" +result);\n    }\n    public static void main(String arg[])\n   \
  \ {\n        Avg_demo avg = new Avg_demo();\n        avg.get_points(75.5, 89.5,\
  \ 78);\n        avg.average();\n    }\n}\n```\n\n#### 解析\n**第 1 行**\n`package Student;`\n\
  在此行中，通过 `package` 关键字定义了 `Student` 包。这里包语句是源文件的第一个语句。因此，源文件中定义的类将存储在 `Student` 包中。\n\
  \n**第 2 行**\n`class Avg_demo`\n在此行中，`Avg_demo` 被声明为 `Student` 包内部的类。因此，它将存储在 `Student`\
  \ 包中。\n\n**注意**\n你可以使用以下语句编译并执行给源代码：\n\n```\nD:\\Java Projects\\Ch06>javac -d .\
  \ Avg_demo.java\nD:\\Java Projects\\Ch06>java Student.Avg_demo\n```\n\n在给定语句中，`-d`\
  \ 开关指定了生成类文件的位置。`.` 表示你可以将包保持在当前目录下。\n\n或者，你可以在当前工作目录下创建一个名为 `Student` 的新文件夹，并将程序保在该文件夹中的\
  \ `Avg_demo.java`。\n\n```\nD:\\Java Projects\\Ch06\\Student>javac Avg_demo.java\n\
  D:\\Java Projects\\Ch06>java Student.Avg_demo\n```\n\n\n\n\n\n在上一节中，你学习了包的机制用于命名空间管理和可见性控制。在本节中，你将学习如何在包中实现可见性控制或访问保护。如你所知，类是数据成员和方法的集合。包是类的容器。因此，包可以控制同一包内或不同包的类对类数据成员的访问。Java\
  \ 包为类成员提供了以下四种类型的可见性控制：\n\n1. 同一包中的类子类是否可以访问数据成员。\n2. 同一包中的非子类是否可以访问数据成员。\n3. 不同包中的子类是否可以访问数据成员。\n\
  4. 不同包中的非子类是否可以访问数据成员。\n\n这些可见性控制可以使用不同的访问限定符以不同的模式应用，如表 6-2 所示。\n\n### 表 6-2 可见性控制\n\
  \n| 类与包 | Public | Private | Protected | Default |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| 同一个类 | Yes | Yes | Yes | Yes |\n| 同一包中的子类 | Yes | No | Yes | Yes |\n\
  | 同一包中的非子类 | Yes | No | Yes | Yes |\n| 不同包中的子类 | Yes | No | Yes | No |\n| 不同包中的非子类\
  \ | Yes | No | No | No |\n\n如表 6-2 所示，当类的数据成员被声明为 `public` 数据成员时，不仅同一包的子类和非子类可以访问，不同包的子类和非子类也可以访问。当类的数据成员声明为\
  \ `private` 数据成员时，只有类本身可以访问。当类的数据成员声明为 `protected` 数据成员时，同一包的子类和非子类可以访问，不同包的子类也可以访问。当类的数据成员不使用访问限定符（即默认数据成员）时，只有同一包的子类和非子类可以访问。\n\
  \n### 导入包\n\n如果你要在另一个程序中使用 `pack` 包的任意一个所有类，需要使用 `import` 语句。`import` 语句帮助你将包导入到另一个文件中。例如，如果你只想访问\
  \ `pack` 包中的 `Package_data` 类，可以使用以下语句：\n\n```java\nimport pack.Package_data;\n\
  ```\n\n你也可以使用 `import` 语句访问整个包，如下语句所示：\n\n```java\nimport pack.*;\n```\n\n在此语句中，星号\
  \ `*` 符号表示 `pack` 包的所有成员。现在源文件可以访问 `pack` 包的所有类。\n\n**注意**\n在程序中使用星号 `*` 符号，与在 `import`\
  \ 语句中明确指定类相比，编译时间会增加。当源文件通过 `import` 语句导入完整包时，成员的可见性取决于表 6-2 中使用的访问限定符。\n\n### 示例\
  \ 2\n\n下面的示例说明了 `import` 语句的使用。程序将显示员工的详情。\n\n```java\n// 编写一个显示员工信息的程序\n// 以下程序是\
  \ Details.java\npackage Employee;\n\npublic class Details\n{\n    String name;\n\
  \    int emp_id;\n    long salary;\n    public Details(String n, int id, long sal)\n\
  \    {\n        name = n;\n        emp_id = id;\n        salary = sal;\n    }\n\
  \    public void display( )\n    {\n        System.out.println(\"Name: \" +name);\n\
  \        System.out.println(\"Employee ID is: \" +emp_id);\n        System.out.println(\"\
  Salary: \" +salary);\n    }\n}\n\n// 以下程序是 Emp_demo.java\nimport Employee.Details;\n\
  class Emp_demo\n{\n    public static void main(String arg[])\n    {\n        Details\
  \ obj1 = new Details(\"Smith\", 102, 500);\n        obj1.display();\n    }\n}\n\
  ```\n\n**解释 Details.java：**\n第 2 行：`package Employee;` —— 该语句定义了 `Employee` 包。\n\
  第 3 行：`public class Details` —— 此行包含了在 `Employee` 包下的 `Details` 类。\n第 8 行：`public\
  \ Details(String n, int id, long sal)` —— 这些行定义了 `Details()` 构造函数。参数列表包含 `String\
  \ n`、`int id` 和 `long sal`。\n第 10-12 行：`name = n;`, `emp_id = id;`, `salary = sal;`\
  \ —— 在构造函数内部赋值了 `name`、`emp_id` 和 `salary` 变量。\n第 14 行：`public void display( )`\
  \ —— `display()` 方法被声明为 `public`，允许包外的任何类访问它。\n\n**解释 Emp_demo.java：**\n第 2 行：`import\
  \ Employee.Details;` —— 在此行，使用 `import` 语句访问 `Employee` 包中的 `Details` 类。\n第 7 行：`Details\
  \ obj1 = new Details(\"Smith\", 102, 500);` —— 在此行，`obj1` 被声明为 `Details` 类的对象。同时，调用了带有三个参数\
  \ `Smith`、`102`、`500` 的 `Details()` 构造函数。\n第 8 行：`obj1.display();` —— 在此行，通过 `obj1`\
  \ 对象调用了 `display()` 方法。\n\n### \n\n某些 C++ 等面向对象的语言提供多继承。在多继承中，一个类可以继承多个类的特征。但 Java\
  \ 不支持多继承。相反，它提供了一种名为“接口”的新功能。接口类似于抽象类，在其中没有方法的实现，只给出了声明部分。换句话说，接口定义了类要执行的任务，但它没有指定执行该任务的过程。接口与类相同，但它们不包含任何实例变量（static\
  \ 和 final 类型除）或任何类型的代码。一个接口可以被任意数量的类实现，反之亦然。这意味着一个类可以实现多个接口。\n\n### 定义接口\n\n你可以以与定义类相同的方式定义接口，只是你需要在定义语句中使用\
  \ `interface` 关键字，如下语法所示：\n\n```java\naccess_specifier interface interface_name\n\
  {\n    return_type method_name1 (parameters list);\n    return_type method_name2\
  \ (parameters list);\n    final data_type var_name = value;\n    return_type method_name3\
  \ (parameters list);\n}\n```\n\n\n\n\n\n在此语法中，`access_specifier` 代表可以为 `public`、`private`、`protected`\
  \ 或 `default` 的访问修饰符。访问修饰符表示接口的可见性。例如，如果你用访问修饰符 `public` 定义一个接口，那么它可以被任何其他源代码使用。语法中的\
  \ `interface` 代表一个关键字，而 `interface_name` 代表接口的名称，它应该是一个有效的标识符。接口内部的方法以分号结尾，且不包含实现。在接口体内部声明的变量是\
  \ `final` 或 `static` 类型，且这些变量的值在任何类中都不能更改。\n\n例如：\n\n```java\npublic interface demo\n\
  {\n    void show( );\n    int sqr( );\n    final int num =10;\n}\n```\n\n在示例示例中，`demo`\
  \ 接口包含两个带有其签名的方法，但没有定义方法体。在这里，`num` 使用 `final` 关键字声明为整型类型变量，并为其赋值了值 `10` 作为初始值，该值在整个程序中都不能被更改。\n\
  \n### 实现接口\n\n一旦定义了接口，其他类就可以通过类定义语句中的 `implements` 关键字来实现该接口。实现接口的语法如下：\n\n`access_specifier\
  \ class class_name [extends superclass] implements interface_name`\n\n{\n    //类体\n\
  }\n\n在此语法中，由 `class_name` 代表的类实现了由 `interface_name` 代表的接口。如果一个类实现了一个接口，接口内部声明的所有方法都应该由该类来实现。\n\
  \n一个类也可以通过逗号分隔接口列表来实现一个多个接口。实现多个接口的语法如下：\n\n`access_specifier class class_name implements\
  \ interface1, interface2, interfaceN`\n\n{\n    //类体\n}\n\n### 示例 3\n\n下面的示例说明了接口的使用。该程序将计算给定数字的阶乘和平方，并在屏幕上显示结果。\n\
  \n```java\n//写一个程序来计算给定数字的阶乘和平方\ninterface Calculate\n{\n    long fact(int num);\n\
  \    long sqr(int n);\n}\nclass interface_demo implements Calculate\n{\n    public\
  \ long fact(int num)\n    {\n        int a = 1;\n        while(num>0)\n        {\n\
  \            a = num*a;\n            num--;\n        }\n        return a;\n    }\n\
  \    public long sqr(int n)\n    {\n        return n*n;\n    }\n    public static\
  \ void main(String arg[])\n    {\n        long fac, sq;\n        interface_demo\
  \ obj1 = new interface_demo();\n        fac = obj1.fact(10);\n        sq = obj1.sqr(23);\n\
  \        System.out.println(\"10 的阶乘是: \" +fac);\n        System.out.println(\"\
  23 的平方是: \" +sq);\n    }\n}\n```\n\n#### 解释\n\n**第 1 到 5 行**\n```java\ninterface\
  \ Calculate\n{\n    long fact(int num);\n    long sqr(int n);\n}\n```\n这些行包含了 `Calculate`\
  \ 接口的定义。在接口内部，声明了 `fact()` 和 `sqr()` 方法，这两个方法都接收整数参数。\n\n**第 6 行**\n```java\nclass\
  \ interface_demo implements Calculate\n```\n在这一行中，`interface_demo` 被声明为一个类，并且通过\
  \ `implements` 关键字实现了 `Calculate` 接口。现在，`interface_demo` 类必须实现所有在 `Calculate` 接口内部声明的方法。\n\
  \n**第 8 到 17 行**\n```java\npublic long fact(int num)\n{\n    int a = 1;\n    while(num>0)\n\
  \    {\n        a = num*a;\n        num--;\n    }\n    return a;\n}\n```\n这些行包含了\
  \ `Calculate` 接口中 `fact()` 方法的实现。该方法被声明为 `public`，因为它是一个接口方法。\n\n**第 18 到 21 行**\n\
  ```java\npublic long sqr(int n)\n{\n    return n*n;\n}\n```\n这些行包含了 `Calculate`\
  \ 接口中 `sqr()` 方法的实现。\n\n**第 25 行**\n```java\ninterface_demo obj1 = new interface_demo(\
  \ );\n```\n在这一行中，`obj1` 被声明为 `interface_demo` 类的一个对象。\n\n**第 26 行**\n```java\nfac\
  \ = obj1.fact(10);\n```\n在这一行中，调用了 `fact()` 方法并将值 `10` 作为参数传递给它。现在，控制将转移到方法体（从第\
  \ 8 到 17 行），并将计算值 `10` 的阶乘。接下来，结果 `3628800` 将返回到这一行并赋值给变量 `fac`。\n\n**第 27 行**\n\
  ```java\nsq = obj1.sqr(23);\n```\n在这一行中，调用了 `sqr()` 方法并将值 `23` 作为参数传递给它。\n\n\n\n\
  \n\n```java\n30 result = obj1.mul(105, 63);\n31 rem = obj1.remdr(105, 63);\n32 System.out.println(“The\
  \ sum is: ” +total);\n33 System.out.println(“The multiplication is: ” +result);\n\
  34 System.out.println(“The remainder is: ” +rem);\n35 }\n36 }\n```\n\n#### 解析\n\n\
  #### 第 1 行\n`interface mathematical`\n在这一行中，`mathematical` 使用 `interface` 关键字定义了一个接口。\n\
  \n#### 第 3 行和第 4 行\n```java\nint sum(int a, int b);\nlong mul(int num1, int num2);\n\
  ```\n这些行包含了 `sum()` 和 `mul()` 方法的声明部分。这些方法被声明在 `mathematical` 接口内部。方法的实现部分将由实现 `mathematical`\
  \ 接口的类定义。\n\n#### 第 6 行\n`interface remainder extends mathematical`\n在这一行中，`remainder`\
  \ 使用 `interface` 关键字定义了一个接口。同时，它继承了另一个 `mathematical` 接口。\n\n#### 第 8 行\n```java\n\
  int remdr(int a, int b);\n```\n这一行包含了 `remdr()` 方法的声明部分。该方法声明在 `remainder` 接口内部。因此，它必须由实现\
  \ `remainder` 接口的类来实现。\n\n#### 第 10 行\n`class Extend_interface implements remainder`\n\
  在这一行中，`Extend_interface` 类使用 `implements` 关键字实现了 `remainder` 接口。该类可以实现 `remainder`\
  \ 和 `mathematical` 接口的所有方法。\n\n#### 第 12 行到第 15 行\n```java\npublic int sum(int a,\
  \ int b)\n{\nreturn a+b;\n}\n```\n这些行包含了 `mathematical` 接口中 `sum()` 方法实现。在方法体内，变量\
  \ `a` 和 `b` 的值将相加，并将结果返回给调用者。\n\n#### 第 16 行到第 19 行\n```java\npublic long mul(int\
  \ num1, int num2)\n{\nreturn num1*num2;\n}\n```\n这些行包含了 `mathematical` 接口中 `mul()`\
  \ 方法实现。在方法体内，变量 `num1` 和 `num2` 的值将相乘，并将结果返回给调用者。\n\n#### 第 20 行到第 23 行\n```java\n\
  public int remdr(int a, int b)\n{\nreturn a%b;\n}\n```\n这些行包含了 `remainder` 接口中 `remdr()`\
  \ 方法实现。在方法体内，变量 `a` 的值将除以变量 `b` 的值，并将余数返回给调用者。\n\n#### 第 28 行\n`Extend_interface\
  \ obj1 = new Extend_interface( );`\n在这一行中，`obj1` 被声明为 `Extend_interface` 类的对象。\n\
  \n#### 第 29 行\n`total = obj1.sum(105, 63);`\n在这一行中，调用了 `sum()` 方法并将 `105` 和 `63`\
  \ 作为参数传递。这些值将赋值给第 12 行中的两个参数 `a` 和 `b`。在执行完 `sum()` 方法体后，返回的结果值将赋值给变量 `total`。\n\
  \n第 30 行和第 31 行的原理与第 29 行相同。\n\n示例 4 的输出显示如图 6-4 所示所示\n\n![C06SC004.tif](img/C06SC004_fmt.jpeg)\n\
  图 6-4 示例 4 的输出\n\n### 嵌套接口\n\n当一个接口声明在类或另一个接口内部时，它被称为成员接口或嵌套接口。你可以使用任何访问修饰符（如 `public`、`private`\
  \ 或 `protected`）来声明成员接口或嵌套接口。\n\n例如：\n```java\npublic interface Outer\n{\n    //\
  \ 接口体\n    public interface Inner\n    {\n        // 接口体\n    }\n}\n```\n在这个示例中，`Inner`\
  \ 接口声明在另一个 `Outer` 接口内部。因此，它被称为嵌套接口。现在，一个类可以通过以下语句实现 `Inner` 嵌套接口：\n```java\nclass\
  \ Demo implements Outer.Inner\n{\n    // 类体\n}\n```\n在这些语句中，`Outer` 代表 `Inner` 接口所在的接口。\n\
  \n以下示例说明了成员接口：\n```java\nclass Demo\n{\n    // 类体\n    public interface Inner\n\
  \    {\n        // 接口体\n    }\n}\n```\n在这个示例中，`Inner` 接口声明在 `Demo` 类内部。因此，它被称为成员接口。现在，一个类可以通过以下语句实现\
  \ `Inner` 成员接口：\n```java\nclass A implements Demo.Inner\n{\n    // 类体\n}\n```\n\
  在这些语句中，`Demo` 代表 `Inner` 接口所在的类。\n\n### 示例 5\n\n以下示例说明了嵌套接口的使用。程序将计算一个数字的平方并在屏幕上显示结果。\n\
  \n```java\n//写一个程序计算数字的平方\n1 写一个程序计算数字的平方\n2 class Outer\n3 {\n4 interface member\n\
  5 {\n6 void getdata(int n);\n7 void sqr( );\n8 void showdata( );\n9 }\n10 }\n11\
  \ class Nested_demo\n12 {\n13 int result;\n14 public void getdata(int n)\n15 {\n\
  16 num = n;\n17 }\n18 public void sqr( )\n19 {\n20 result = num*num;\n21 }\n22 public\
  \ void showdata( )\n23 {\n24 System.out.println(“The square of ” +num+ “ is: ” +result);\n\
  25 }\n26 public static void main(String args[])\n27 {\n28 Nested_demo obj1 = new\
  \ Nested_demo( );\n29 total = obj1.sum(105, 63);\n30 result = obj1.mul(105, 63);\n\
  31 rem = obj1.remdr(105, 63);\n32 System.out.println(“The sum is: ” +total);\n33\
  \ System.out.println(“The multiplication is: ” +result);\n34 System.out.println(“The\
  \ remainder is: ” +rem);\n35 }\n36 }\n```\n\n#### 解析\n\n#### 第 1 行\n`class Outer`\n\
  在这个行中，`Outer` 被声明为一个类。\n\n#### 第 2 行\n`{`\n类的体的开始。\n\n### 第 3 行\n`interface member`\n\
  在这个行中，`member` 被声明为内部接口。\n\n#### 第 4 行\n`{`\n接口体的开始。\n\n#### 第 5 行\n`void getdata(int\
  \ n);`\n这一行包含了 `getdata()` 方法的声明。\n\n#### 第 6 行\n`void sqr( );`\n这一行包含了 `sqr()`\
  \ 方法的声明。\n\n#### 第 7 行\n`void showdata( );`\n这一行包含了 `showdata()` 方法的声明。\n\n####\
  \ 第 8 行\n`}`\n接口体的结束。\n\n#### 第 9 行\n`}`\n类的结束。\n\n#### 第 10 行\n`class Nested_demo`\n\
  在这一行中，`Nested_demo` 被声明为一个类。\n\n#### 第 11 行\n`{`\n类体的开始。\n\n#### 第 12 行\n`int result;`\n\
  声明了一个整型变量 `result`。\n\n#### 第 13 行\n`public void getdata(int n)`\n这一行是 `getdata()`\
  \ 方法的实现。\n\n#### 第 14 行\n`{`\n方法体的开始。\n\n#### 第 15 行\n`num = n;`\n将参数 `n` 的值赋值给变量\
  \ `num`。\n\n#### 第 16 行\n`}`\n方法体的结束。\n\n#### 第 17 行\n`public void sqr( )`\n这一行是\
  \ `sqr()` 方法的实现。\n\n#### 第 18 行\n`{`\n方法体的开始。\n\n#### 第 19 行\n`result = num*num;`\n\
  将 `num` 的值相乘并将结果赋值给变量 `result`。\n\n#### 第 20 行\n`}`\n方法体的结束。\n\n#### 第 21 行\n`public\
  \ void showdata( )`\n这一行是 `showdata()` 方法的实现。\n\n#### 第 22 行\n`{`\n方法体的开始。\n\n####\
  \ 第 23 行\n`System.out.println(“The square of ” +num+ “ is: ” +result);`\n打印计算结果。\n\
  \n#### 第 24 行\n`}`\n方法体的结束。\n\n### 第 25 行\n`public static void main(String args[])`\n\
  这是程序的主方法。\n\n#### 第 26 行\n`{`\n主方法的开始。\n\n#### 第 27 行\n`Nested_demo obj1 = new Nested_demo(\
  \ );`\n在这一行中，`obj1` 被声明为 `Nested_demo` 类的对象。\n\n#### 第 28 行\n`total = obj1.sum(105,\
  \ 63);`\n注意：此处代码中调用了 `sum` 方法但在 `Nested_demo` 类定义中未显示该方法，可能为示例代码省略。\n\n#### 第 29\
  \ 行\n`result = obj1.mul(105, 63);`\n\n#### 第 30 行\n`rem = obj1.remdr(105, 63);`\n\
  \n**注意**\n如果一个类实现一个接口但只提供了部分方法的实现，则该类应该声明为抽象类（abstract class）。注意：如果一个类实现一个接口但只提供了部分方法的实现，则该类应该声明为抽象类。\n\
  \n\n\n\n静态嵌套类是外部类的静态成员，使用 `static` 关键字声明。它们只能访问外部类的静态成员，而不能访问外部类的实例成员（如非静态成员）。因此，静态嵌套类很少被使用。静态嵌套类的示例如下：\n\
  \n```java\nclass outer\n{\n    static class static_nested\n    {\n        ---------;\n\
  \        ---------;\n    }\n}\n```\n\n在此示例中，`outer` 代表外部类，`static_nested` 类定义在 `outer`\
  \ 类内部，并在后跟 `static` 关键字。\n\n你可以通过在外部类名前加上前缀来创建静态嵌套类的对象。\n\n例如：\n```java\nouter.static_nested\
  \ obj = new outer.static_nested();\n```\n\n在此示例中，`obj` 代表静态嵌套类 `static_nested` 的对象，它是通过前缀外部类名创建的。\n\
  \n# 示例 6\n\n以下示例说明了静态嵌套类的用法。该程序将计算矩形的面积并将结果显示在屏幕上。\n\n```java\n//写一个计算矩形面积的程序\n\
  1 class Static_demo\n2 {\n3 static int area,l,b;\n4 static class Inner\n5 {\n6 Inner(int\
  \ x, int y)\n7 {\n8 l=x;\n9 b=y;\n10 }\n11 void Calculate()\n12 {\n13 area=l*b;\n\
  14 System.out.println(“Area of rectangle is ” +area);\n15 }\n16 }\n17 public static\
  \ void main(String args[])\n18 {\n19 Static_demo.Inner obj=new Static_demo.Inner(85,\
  \ 63);\n20 obj.Calculate();\n21 }\n22 }\n```\n\n#### 解析\n\n**第 1 行**\n`class Static_demo`\n\
  在该行中，使用 `class` 关键字将 `Static_demo` 为一个外部类。\n\n**第 3 行**\n`static int area, l, b;`\n\
  在该行中，`area`、`l` 和 `b` 变量使用 `static` 关键字声明为静态整数类型。\n\n**第 4 行到 16 行**\n```java\n\
  static class Inner\n{\n    Inner(int x, int y)\n    {\n        l=x;\n        b=y;\n\
  \    }\n    void Calculate()\n    {\n        area=l*b;\n        System.out.println(“Area\
  \ of rectangle is ” +area);\n    }\n}\n```\n这些行包含了 `Inner` 类的定义，它在 `Static_demo`\
  \ 类内部使用 `static` 关键字声明为静态。它有一个 `Inner` 构造函数和一个 `Calculate()` 方法，这些方法作为 `Inner` 类的静态成员存在，并且也可以访问外部类\
  \ `Static_demo` 的静态成员。\n\n**第 19 行**\n`Static_demo.Inner obj=new Static_demo.Inner(85,\
  \ 63);`\n在该行中，`obj` 被声明为 `Inner` 类的对象，前缀为 `Static_demo` 类。这里，将调用 `Inner()` 构造函数并将两个整数值\
  \ `85` 和 `63` 传递给第 6 行中的变量 `x` 和 `y`。现在，这些值将分别赋值给 `Inner` 构造函数定义内部的整数变量 `x` 和 `y`。接下来，`x`\
  \ 和 `y` 变量的值 `(85, 63)` 将赋值给静态变量 `l` 和 `b` 的副本。\n\n**第 20 行**\n`obj.Calculate();`\n\
  在该行中，将调用 `Calculate()` 方法并将控制转移到第 11 行。\n\n示例 6 的输出如图 6-6 所示。\n\n![C06SC006.tif](img/C06SC006_fmt.jpeg)\n\
  \n图 6-6 示例 6 的输出\n\n### 非静态嵌套类\n\n非静态嵌套类使用频繁。它们也被称为内部类。类不能被声明为 `private`，但在外部类内部，内部类可以声明为\
  \ `private` 并对外部世界隐藏。现在，内部类可以直接访问外部类的所有实例成员（包括私有成员），但外部类仍然无法直接访问内部类的成员。Java 中有三种类型的非静态嵌套类：\n\
  \n1. 成员内部类\n2. 局部内部类\n3. 匿名内部类\n\n#### 成员内部类\n\n当一个非静态类声明在另一个类内部但在方法外部时，它被称为成员内部类。成员内部类的示例如下：\n\
  \n```java\nclass outer\n{\n    --------;\n    --------;\n    class member_inner\n\
  \    {\n        --------;\n        --------;\n    }\n}\n```\n\n在此示例中，`member_inner`\
  \ 代表内部类，它作为封闭外部类的成员存在。`member_inner` 类的作用范围受限于 `outer` 类，且 `member_inner` 类可以直接访问外部类的任何成员（包括私有成员）。\n\
  \n要创建内部类的对象，需要先创建外部类的对象。内部类对象使用外部类和内部类的类的引用来声明。要初始化内部类对象，`new` 关键字以外部类对象为前缀。\n\n\
  例如：\n```java\nouter obj = new outer();\nouter.member_inner in_obj = obj.new member_inner();\n\
  ```\n\n在此示例中，创建了外部类对象 `obj`，而 `in_obj` 是内部类对象，它是使用外部类和 `member_inner` 类的引用声明的。为了初始化\
  \ `in_obj`，`new` 关键字以外部类对象 `obj` 为前缀。\n\n### 示例 7\n\n以下示例说明了成员内部类的用法。该程序将执行两个数的加法并将结果显示在屏幕上。\n\
  \n```java\n//写一个两个数加数的程序\n1 class member_demo\n2 {\n3 int result;\n4 class Inner\n\
  5 {\n6  int i, j;\n7 Inner(int x, int y)\n8 {\n9  i = x;\n10  j = y;\n11 }\n12 void\
  \ add( )\n13 {\n14 result = i+j;\n15 System.out.println(“The result of addition\
  \ is: ” +result);\n16 }\n17 }\n18 public static void main(String arg[])\n19 {\n\
  20 member_demo obj1 = new member_demo();\n21 member_demo.Inner obj = obj1.new Inner(10,\
  \ 20);\n22 obj.add();\n23 }\n```\n\n#### 解析\n\n**第 1 行**\n`class member_demo`\n\
  在该行中，`member_demo` 被声明为外部类。\n\n**第 4 行**\n`class Inner`\n`Inner` 类被声明在另一个类 `member_demo`\
  \ 内部。\n\n**第 6 行**\n`int i, j;`\n`i` 和 `j` 是 `Inner` 类的实例变量。\n\n**第 20 行**\n`member_demo\
  \ obj1 = new member_demo();`\n在该行中，创建了 `member_demo` 类对象 `obj1`。\n\n**第 21 行**\n\
  `member_demo.Inner obj = obj1.new Inner(10, 20);`\n在该行中，`obj` 是 `Inner` 类的对象，使用\
  \ `member_demo` 和 `Inner` 类的引用声明。\n\n**第 22 行**\n`obj.add();`\n在该行中，将调用 `add()`\
  \ 方法。\n\n示例 7 的输出如图 6-7 所示。\n\n![C06SC007.tif](img/C06SC007_fmt.jpeg)\n\n图 6-7 示例\
  \ 7 的输出\n\n### 局部内部类\n\n当一个非静态类声明在另一个类的方法内部时，它被称为局部内部类。该局部内部类的作用范围局限于方法，因此不能有任何访问标识符。如果你想调用局部内部类的方法，必须在方法内部创建该类的对象。局部内部类的示例如下：\n\
  \n```java\nclass Outer\n{\n    ---------;\n    void declare()\n    {\n        class\
  \ local_inner\n        {\n            ---------;\n            ---------;\n     \
  \   }\n        local_inner L = new local_inner(); //创建对象\n    }\n}\n```\n\n在此示例中，`local_inner`\
  \ 是 `Outer` 类 `declare()` 方法内部的内部类。它不是 `Outer`类的成员，因为 `local_inner` 类的范围受限于 `declare()`\
  \ 方法。`L` 是 `local_inner` 类的对象，必须在方法内部声明。\n\n### 示例 8\n\n以下示例说明了局部内部类的用法。在这里，程序将计算一个数的立方并将结果显示在屏幕上。\n\
  \n```java\n//写一个计算一个数立方的程序\n1 class Local_demo\n2 {\n3 int cube, num;\n4 void show()\n\
  5 {\n6 class Inner\n7 {\n8 Inner(int x)\n9 {\n10 num = x;\n11 }\n12 void Cube( )\n\
  13 {\n14 cube= num*num*num;\n15 System.out.println(“Cube of ” + num + “ is ” +cube);\n\
  16 }\n17 }\n18 Local_demo obj1 = new Local_demo();\n19 Local_demo.Inner obj = obj1.new\
  \ Inner(10);\n20 obj.Cube();\n21 }\n22 }\n```\n\n\n\n\n```java\n18 Inner ob = new\
  \ Inner(19);\n\n19 ob.Cube();\n\n20 }\n\n21 public static void main(String arg[])\n\
  22 {\n23 Local_demo obj = new Local_demo( );\n\n24 obj.show();\n\n25 }\n26 }\n```\n\
  \n#### 解析\n\n#### 第 1 行\n`class Local_demo` 使用 class 关键字被声明为一个外部类。\n\n#### 第 4 行\n\
  `void show()`\n这一行包含了 `Local_demo` 类中 `show()` 方法的声明。\n\n#### 第 6 行\n`class Inner`\n\
  在此行中，`Inner` 类声明在 `Local_demo` 类的 `show()` 方法内部。`Inner` 类不是 `Local_demo` 类的成员，它的作用域限制在\
  \ `show()` 方法内。\n\n#### 第 8 到 11 行\n```java\nInner(int x)\n{\nnum = x;\n}\n```\n\
  这些行包含了内部类 `Inner` 构造函数的定义。`Inner()` 构造函数的参数列表包含一个整数类型的参数，这表示在创建对象时必须传递一个整数值。该整数值将赋值给变量\
  \ `x`。在构造函数体内部，变量 `x` 的值将赋值给变量 `num`。\n\n#### 第 12 到 16 行\n```java\nvoid Cube( )\n\
  {\ncube= num*num*num;\nSystem.out.println(“Cube of ” + num + “ is ” +cube);\n}\n\
  ```\n这些行包含了 `Inner` 类 `Cube()` 方法的实现。在方法体内，`num` 变量的值将自身乘以 3 次，结果将赋值给变量 `cube`。\n\
  \n#### 第 18 行\n`Inner ob = new Inner(19);`\n在此行中，`ob` 被声明为 `Local_demo` 类 `show()`\
  \ 方法内部的一个 `Inner` 类对象，并将值 `19` 作为参数传递给第 8 行的构造函数。\n\n#### 第 23 行\n`Local_demo obj\
  \ = new Local_demo( );`\n在此行中，`obj` 被声明为 `Local_demo` 类的对象。\n\n#### 第 24 行\n`obj.show(\
  \ );`\n在此行中，将调用 `show()` 方法并将控制权转移到第 4 行。\n\n示例 8 的输出结果如图 6-8 所示。\n\n![C06SC008.tif](img/C06SC008_fmt.jpeg)\n\
  \n图 6-8 示例 8 的输出\n\n### 匿名内部类\n\n当在没有类名的情况下声明内部类时，被称为匿名内部类。\n\n它是同时被声明和实例化的。它可以用于覆盖另一个类的方法。匿名类的示例如下：\n\
  \n```java\nclass outer\n{\n------------;\n------------;\n\npublic static void main(String\
  \ arg[])\n{\nAnonymous_demo a = new Anonymous_demo()\n//声明并实例化一个匿名类\n{\nvoid demo()\n\
  {\n-----------;\n-----------;\n}\n};\na.demo(); //匿名类的类调用\n}\n}\n\nclass Anonymous_demo\n\
  {\nvoid demo()\n{\n}\n}\n```\n\n在这个示例中，`Anonymous_demo` 是实例化时声明的匿名内部类，而 `a` 是匿名类的实例。当使用实例\
  \ `a` 调用 `demo()` 方法时，`Anonymous_demo` 类的 `demo()` 方法将被匿名内部类的方法覆盖。如果使用匿名类实例调用不是匿名类成员的方法，则会产生错误。\n\
  \n### 示例 9\n\n下面的示例说明了匿名内部类的用法。此处程序将计算数字的平方并在屏幕上显示结果。\n\n```java\n//写一个程序计算一个数字的平方\n\
  1 class anonymous_demo\n{\nint num=15, sqr;\npublic static void main(String[] args)\n\
  {\nanonymous_demo ad = new anonymous_demo();\nSquare s = new Square()\n{\nvoid calculate()\n\
  {\nad.sqr=ad.num*ad.num;\nSystem.out.println(“Square of ” +ad.num +“ is ” +ad.sqr);\n\
  }\n};\ns.calculate();\n}\n}\nclass Square\n{\nvoid calculate()\n{\n}\n}\n```\n\n\
  #### 解析\n\n#### 第 6 行\n`anonymous_demo ad = new anonymous_demo();`\n在此行中，创建了外部类\
  \ `Anonymous_demo` 的类的 `ad` 对象。\n\n#### 第 7 到 14 行\n```java\nSquare s = new Square()\n\
  {\nvoid calculate()\n{\nad.sqr=ad.num*ad.num;\nSystem.out.println(“Square of ” +ad.num\
  \ +“ is ” +ad.sqr);\n}\n};\n```\n这些行包含了匿名内部类 `Square` 的定义。在第 7 行中，声明并实例化了匿名类 `Square`。匿名类的定义包含了\
  \ `calculate()` 方法，该方法覆盖了另一个 `Square` 类（第 20 行）的 `calculate()` 方法。`num` 变量的平方将使用外部类\
  \ `anonymous_demo` 对象的引用进行计算。接下来，结果将赋值给变量 `sqr`，`sqr` 变量的值将被显示。\n\n示例 9 的输出如图 6-9。\n\
  \n![C06SC008.tif](img/C06SC008_fmt.jpeg)\n\n图 6-9 示例 9 的输出\n\n### 自测测试\n\n回答以下问题：\n\
  \n1. __________ 是从类派生的。\n2. __________ 被称为包。\n3. 你可以使用 __________ 来导入。\n4. 两种类型的类是\
  \ __________ 和 __________。\n5. __________ 在包内部声明的。\n6. 你可以通过 __________ 创建其对象。\n\
  7. 局部内部类定义在方法内部。\n8. 静态类可以直接访问其外部类的成员。\n\n### 复习题\n\n回答以下问题：\n\n1. 用合适的示例定义一个包。\n\
  2. 什么是接口？请用合适的示例说明。\n3. 如何在 Java 文件中导入包？\n4. 区分静态非静态嵌套类。\n5. 定义成员内部类并用合适的示例说明。\n\
  6. 找出以下代码中的错误：\n\n```java\n(a) class A\n{\ninterface demo\n{\nvoid get(int n);\n\
  void show( );\n}\n}\n\nclass B implements demo\n{\nint num;\nvoid get(int n)\n{\n\
  num = n;\n}\nvoid show( )\n{\nSystem.out.println(\"Value is: ” +num);\n}\n}\n```\n\
  \n```java\n(b) package demo\nclass A\n{\nint data;\nvoid getdata(double n)\n{\n\
  data = n;\n}\nvoid showdata( )\n{\nSystem.out.println(“Value is: ”, +data);\n}\n\
  }\n```\n\n```java\n(c) interface A\n{\nvoid get(int n);\nvoid show( );\n}\n\nabstract\
  \ class implements A\n{\nint num;\npublic void get(int n)\n{\nnum = n;\n}\npublic\
  \ void show( )\n{\nSystem.out.println(“Value is: ” +num);\n}\n}\n```\n\n```java\n\
  (d) interface A\n{\nvoid sum(int a, int b);\nvoid mul(int x, int y);\n}\n\ninterface\
  \ B\n{\nint rmndr(int var1, int var2)\n}\n\ninterface C extends A, B\n{\n//接口体\n\
  }\n```\n\n### 练习\n\n#### 练习 1\n写一个程序创建一个包含详情类的包。在类内部，定义用于获取和显示员工详情的方法。\n\n#### 练习\
  \ 2\n写一个程序创建一个 demo 接口，包含以下方法：\n`void getnum(int a)` - 获取值\n`void evodd()` - 检查给定数字是偶数还是奇数\n\
  `void show()` - 在屏幕上显示结果\n\n\n\n\n当方法或段代码在执行过程中发生运行时错误时，会创建一个对象。该对象代表错误并被称为异常（exception）。此异常被抛出到导致错误的方法。现在，该方法有两种方式来处理异常：要么它可以自己处理该异常，要么将其传递给其他方法进行处理。在这两种情况下，Java\
  \ 运行时环境都会搜索一个可以处理异常的特定代码块。当找到该代码时，异常将传递给它并由其处理。这段代码被称为处理器（handler），该过程被称为异常处理（exception\
  \ handling）。\n\n# 异常类\n\n众你所知，每当引发异常时，都会创建一个该异常的对象并将其抛给该方法。但仅对于 `Throwable` 类的子类对象是如此。`Throwable`\
  \ 类位于异常类层次结构的最顶端，如图 7-1 所示。\n\n![7-1](img/7-1.jpg)\n\n`Throwable` 类有两个直接子类：`Exception`\
  \ 和 `Error`，参见图 7-1。`Exception` 类用于程序内部可以被捕获并处理的异常情况。它也具有某些直接子类，如 `RuntimeException`、`InterruptedException`\
  \ 等。另一方面，`Error` 类定义了简单的 Java 程序无法处理的类型异常。\n\n# 异常的类型\n\n在 Java 中，接下来将讨论两种类型的异常。\n\
  \n1. 检查型异常（Checked exceptions）\n2. 未检查异常（Unchecked exceptions）\n\n## 检查型异常\n\n检查异常在程序的编译期间会被检查。例如，`EOFException`\
  \ 就是一个检查型异常。这类异常的父类是 `java.lang.Exception`。\n\n## 未检查异常\n\n未检查异常发生在程序的运行期间。这些异常由\
  \ Java 自身处理。`NullPointerException` 和 `IndexOutOfBoundsException` 是未检查异常的两个示例。\n\n\
  # 异常处理机制中使用的代码块\n\n在 Java 中，异常处理机制使用了五种类型的块。它们如下：\n\n1. `try`\n2. `catch`\n3. `throw`\n\
  4. `throws`\n5. `finally`\n\n## try 块\n\n`try` 块包含用于监控异常状态或异常的语句。使用 `try` 块的语法如下：\n\
  \n```java\ntry\n{\n// 监控错误或异常的语句\n}\n```\n\n在此语法中，`try` 是一个关键字，大括号 `{}` 表示 `try`\
  \ 块的开始和结束。`try` 块的体部包含监控异常或错误的语句。\n\n例如：\n\n```java\ntry\n{\n    int result = 10/0;\n\
  }\n```\n\n在此示例中，`try` 块包含一个用于监控异常的语句。\n\n## catch 块\n\n`catch` 块捕获由 `try` 块生成的异常。`catch`\
  \ 块充当异常处理器，包含了用于执行以处理异常的语句。使用 `catch` 块的语法如下：\n\n```java\ncatch(Exception Type obj)\n\
  {\n// 要执行的语句\n}\n```\n\n在此语法中，`catch` 是关键字，`Exception Type` 代表异常类型，`obj` 代表由 `try`\
  \ 块生成的异常类型对象。`catch` 块体部包含用于处理异常的语句。\n\n例如：\n\n```java\ntry\n{\n    result = 10/0;\n\
  }\ncatch(ArithmeticException e)\n{\n    System.out.println(\"Divide by zero\");\n\
  }\n```\n\n在此示例中，`try` 块生成异常 `java.lang.ArithmeticException: / by zero`。接着，生成并抛出一个表示此异常的对象。`catch`\
  \ 块捕获该对象，并在 catch 块内部显示语句“Divide by zero”。如果没有使用 `try` 和 `catch` 块，程序将发生异常终止。\n\n\
  **注意：** `catch` 块或 `finally` 块都应与 `try` 块关联。此外，在 `catch` 块中，可以使用 `Exception` 类的对象来代替使用特定的异常类型。\n\
  \n### 示例 1\n\n下面的示例说明了 `try` 和 `catch` 语句的使用。程序将访问数组的所有元素并将它们显示在屏幕上。\n\n```java\n\
  // 编写一个程序显示数组的所有元素\n1 class Exception_demo\n2 {\n3 public static void main(String[]\
  \ args)\n4 {\n5 int i[] = {10, 20, 30, 40, 50};\n6 int len = i.length;\n7 try\n\
  8 {\n9 for(int j=0; j<=len; j++)\n10 {\n11 System.out.println(i[j]);\n12  }\n13\
  \ }\n14 catch(IndexOutOfBoundsException e)\n15 {\n16 System.out.println(\"Out of\
  \ index\");\n17 }\n18 }\n19 }\n```\n\n**解释**\n\n**第 5 行**\n`int i[] = {10, 20, 30,\
  \ 40, 50};`\n在这一行中，`i` 被声明为整数数组，并将值 10, 20, 30, 40 和 50 赋值给其元素；例如，10 被赋值给 `i[0]`\
  \ 位置。\n\n**第 6 行**\n`int len = i.length;`\n在此行中，`len` 被赋值为数组的长度。\n\n**第 7 到 13 行**\n\
  ```java\ntry\n{\n    for(int j=0; j<=len; j++)\n    {\n        System.out.println(i[j]);\n\
  \    }\n}\n```\n这些行包含了 `try` 的定义。在 `try` 块内部，使用了循环来显示元素。\n\n**第 14 到 17 行**\n```java\n\
  catch(IndexOutOfBoundsException e)\n{\n    System.out.println(\"Out of index\");\n\
  }\n```\n这些行包含了 `catch` 块的定义。该块将捕获并处理由 `try` 块抛出的异常。当 `IndexOutOfBoundsException`\
  \ 发生时，会创建一个该异常的对象并将其抛出。`catch` 块捕获该对象，并在 catch 块内部显示语句“Out of index”。如果没有使用 `try`\
  \ 和 `catch` 块，程序将发生异常终止。\n\n## 多重 catch 块\n\n在之前的示例中，`try` 块内部的代码只产生一种类型的异常，并由单个\
  \ `catch` 块处理。但有时，代码会产生多种异常。在这种情况下，你需要定义多个 `catch` 块来处理多种异常，使这些块与单个 `try` 块关联。使用多个\
  \ `catch` 块的语法如下：\n\n```java\ntry\n{\n// 要监控的语句\n}\ncatch(ExceptionType1 obj)\n\
  {\n// 处理异常的语句\n}\ncatch(ExceptionType2 obj)\n{\n// 处理异常的语句\n}\n...\ncatch(ExceptionTypeN\
  \ obj)\n{\n// 处理异常的语句\n}\n```\n\n在此语法中，首先抛出 `try` 块中生成的异常，然后将此异常与所有 `catch` 块的异常进行匹配。当找到匹配时，执行与特定\
  \ `catch` 块关联的语句以处理异常。在执行匹配的 `catch` 块后，剩余的 `catch` 块将被跳过，控制将转移到 `try/catch` 块之后的后续语句。\n\
  \n### 示例 2\n\n下面的示例说明了多个 catch 块的实现。程序将除一个数字并将数组的元素显示在屏幕上。\n\n```java\n1 class multi_catch_demo\n\
  2 {\n3 public static void main(String arg[])\n4 {\n5 int num=10;\n6 int a = arg.length;\n\
  ```\n\n\n\n\n```java\nclass nested_try_demo {\n    public static void main(String\
  \ arg[]) {\n        int num=10, val=0;\n        int a = arg.length;\n        int\
  \ ar[ ] = {12, 23, 35, 46, 78};\n        try {\n            int result = num/a;\n\
  \            System.out.println(“After division, the result is: ” +result);\n  \
  \          try {\n                for(int i=0; i<=5; i++) {\n                  \
  \  System.out.println(“Value at ar[”+i+“] is: ”+ar[i]);\n                }\n   \
  \         } catch (ArrayIndexOutOfBoundsException e) {\n                System.out.println(“An\
  \ exception ” +e+ “ occurred”);\n            }\n        } catch (ArithmeticException\
  \ e) {\n            System.out.println(“An exception ” +e+ “ occurred”);\n     \
  \   }\n    }\n}\n```\n\n#### 解析\n\n### 行\n`int a = arg.length;`\n\n在这一行中，`length()`\
  \ 方法将返回程序执行期间传递的参数数量。接下来，结果值将赋值给整数类型变量 `a`。\n\n### 行\n`int ar[ ] = {12, 23, 35,\
  \ 46, 78};`\n\n在这一行中，`ar` 被声明为整数类型数组。值 `12`、`23`、`35`、`46` 和 `78` 将赋值给数组 `ar[]`\
  \ 的元素；例如，值 `12` 将赋值给 `ar[0]`，`23` 赋值给 `ar[1]`，依此类推。\n\n### 第 8 到 16 行\n```java\n\
  try {\n    int result = num/a;\n    System.out.println(“After division, the result\
  \ is: ” +result);\n    try {\n        for(int i=0; i<=5; i++) {\n            System.out.println(“Value\
  \ at ar[”+i+“] is: ”+ar[i]);\n        }\n    } catch (ArrayIndexOutOfBoundsException\
  \ e) {\n        System.out.println(“An exception ” +e+ “ occurred”);\n    }\n}\n\
  ```\n这些行包含了 `try` 块的定义。在 `try` 块内部，变量 `num` 的值将除以变量 `a` 的值，结果值将赋值给整数类型变量 `result`。如果变量值为\
  \ `0`，则将产生 `ArithmeticException`（除零异常），并跳过 `try` 块的剩余部分。否则，将显示 `result` 变量的值。此外，在\
  \ `for` 循环体内部，将显示数组 `ar[]` 元素中存储的值。在这里，`for` 循环将产生 `ArrayIndexOutOfBoundsException`\
  \ 异常，因为程序将尝试访问数组 `ar[]` 中不存在的第六个元素。\n\n### 第 17 到 20 行\n```java\ncatch(ArrayIndexOutOfBoundsException\
  \ e) {\n    System.out.println(“An exception ” +e+ “ occurred”);\n}\n```\n这些行包含了\
  \ `catch` 块的定义，该块将通过 `e` 对象处理类型为 `ArrayIndexOutOfBoundsException` 的异常。当异常发生时，将执行\
  \ `catch` 块内部的语句并显示以下结果：\n\n`An exception java.lang.ArrayIndexOutOfBoundsException:\
  \ 5 occurred`\n\n接下来，将跳过剩余的 `catch` 块并将控制转移到 `try/catch` 块之后的语句。\n\n### 第 21 到 24\
  \ 行\n```java\ncatch(ArithmeticException e) {\n    System.out.println(“An exception\
  \ ” +e+ “ occurred”);\n}\n```\n这些行包含了 `catch` 块的定义，该块将通过 `e` 对象处理类型为 `ArithmeticException`\
  \ 的异常。当异常发生时，将执行 `catch` 块内部的语句，并在屏幕上显示以下输出：\n\n`An exception java.lang.ArithmeticException:\
  \ / by zero occurred`\n\n示例 2 的输出如图 7-3 所示。\n\n![C07SC002.tif](img/C07SC002_fmt.jpeg)\n\
  \n图 7-3 示例 2 的输出\n\n如果你在执行期间按如下方式传递单个命令行参数：\n\n`D:\\Java Projects\\Ch07>java multi_catch_demo\
  \ first`\n\n输出将如图 7-4 所示。\n\n![C07SC003.tif](img/C07SC003_fmt.jpeg)\n\n图 7-4 使用单个命令行参数的示例\
  \ 2 输出\n\n正如你已经学过的，所有异常类如 `ArithmeticException`、`ArrayIndexOutOfBoundsException`、`NullPointerException`\
  \ 等都是 `Exception` 类的子类。有时在多个 `catch` 块中，会在子类之前使用 `Exception` 父类。在这些情况下，控制将无法到达子类并会发生错误。\n\
  \n例如：\n\n```java\ntry {\n    int result = num/a;\n    System.out.println(“After\
  \ division, the result is: ” +result); \n    for(int i=0; i<=5; i++) {\n       \
  \ System.out.println(“Value at ar[” +i+ “] is: ” +ar[i]);\n    }\n} catch(Exception\
  \ e) {\n    System.out.println(e);\n} catch(ArrayIndexOutOfBoundsException e) {\n\
  \    System.out.println(“An exception ” +e+ “ occurred”);\n} catch(ArithmeticException\
  \ e) {\n    System.out.println(“An exception ” +e+ “ occurred”);\n}\n```\n\n在这个示例中，`Exception`\
  \ 父类在其子类 `ArrayIndexOutOfBoundsException` 和 `ArithmeticException` 之前使用。如果代码通过编译，将产生以下错误：\n\
  \n`multi_catch_demo.java:23: exception java.lang.ArrayIndexOutOfBoundsException\
  \ has already been caught`\n\n`multi_catch_demo.java:27: exception java.lang.ArithmeticException\
  \ has already been caught`\n\n\n\n\n\n# throw 语句\n\n在之前给出的示例中，`catch` 块仅处理了由 Java\
  \ 运行时抛出的异常。但是，程序也可以使用 `throw` 语句显式地抛出异常。使用 `throw` 语句的语法如下：\n\n```\nthrow ThrowableObject;\n\
  ```\n\n在此语法中，`throw` 是关键字，`ThrowableObject` 代表 `Throwable` 类的任何子类的对象。\n\n使用 `throw`\
  \ 关键字时，你只能抛出 `Throwable` 类或其子类的对象。如果你尝试抛出除 `Throwable` 类或其子类以外的任何类的对象，编译器将编译你的程序并显示错误信息。\n\
  \n当在程序中遇到 `throw` 语句时，在执行该语句后，程序将显示错误信息。在这种情况下，所有后续语句都将被跳过，控制权转移到最近的 `try/catch`\
  \ 块，以检查 `catch` 块是否能够处理通过 `throw` 语句抛出的异常类型。如果没有找到匹配项，则将检查下一个 `try/catch` 块，并重复此过程，直到所有的\
  \ `catch` 块都耗尽。如果没有任何 `catch` 块能够处理该异常，则由默认异常处理器通过停止程序来处理异常。\n\n### 示例 4\n\n下面的示例说明了\
  \ `throw` 语句的使用。程序将处理由 `throw` 语句抛出的算术异常，并在屏幕上显示消息。\n\n```java\n//写一个程序处理算术异常的程序\n\
  class throw_demo\n{\n    public static void main(String arg[ ])\n    {\n       \
  \ int a = Integer.parseInt(arg[0]);\n        int b = Integer.parseInt(arg[1]);\n\
  \        try\n        {\n            if(b==0)\n            {\n                throw\
  \ new ArithmeticException(\"demo\");\n            }\n            else\n        \
  \    {\n                int result = a%b;\n                System.out.println(\"\
  After division, the remainder is: \" +result);\n            }\n        }\n     \
  \   catch(ArithmeticException e)\n        {\n            System.out.println(\"Thrown\
  \ exception caught \" +e);\n        }\n    }\n}\n```\n\n#### 解析\n\n**第 5 行和第 6 行**\n\
  ```java\nint a = Integer.parseInt(arg[0]);\nint b = Integer.parseInt(arg[1]);\n\
  ```\n在这些行中，`parseInt` 是 `Integer` 类的方法，用于从命令行参数中读取数值。接下来，结果值将分别赋值给整数类型变量 `a` 和 `b`。\n\
  \n**第 9 行到第 12 行**\n```java\nif(b==0)\n{\n    throw new ArithmeticException(\"demo\"\
  );\n}\n```\n在这些行中，首先将检查变量 `b` 的值，以确定它是否等于零。如果等于，控制权将转移到 `throw` 语句。`throw` 语句将借助\
  \ `new` 操作符创建一个 `ArithmeticException` 类的类对象，并将其命名为 `demo`。接下来，该对象将由 `throw` 语句抛出。在执行\
  \ `throw` 语句后，后续语句将被跳过，控制权将转移到 `catch` 语句（第 19 行）。\n\n**第 13 行到第 17 行**\n```java\n\
  else\n{\n    int result = a%b;\n    System.out.println(\"After division, the remainder\
  \ is: \" +result);\n}\n```\n如果变量 `b` 的值不等于 0，控制权将转移到 `else` 语句。在 `else` 块内部，变量 `a`\
  \ 的值将除以变量 `b` 的值，并将余数赋值给整数变量 `result`。\n\n**第 19 行到第 22 行**\n```java\ncatch(ArithmeticException\
  \ e)\n{\n    System.out.println(\"Thrown exception caught \" +e);\n}\n```\n这些行包含了\
  \ `catch` 块的定义。`catch` 语句的参数列表包含 `ArithmeticException` 的对象 `e`。`catch` 块将处理由 `throw`\
  \ 语句抛出的异常，然后显示输出。\n\n示例 4 的输出如图 7-7 所示所示\n\n![C07SC006.tif](img/C07SC006_fmt.jpeg)\n\
  \n图 7-7 示例 4 的输出\n\n## throws 关键字\n\n有时，程序的方法生成了异常但无法处理它。在这种情况下，方法应该指定程序的其他部分或调用者，以便它们能够免受异常的影响。为了这个目的，方法应该在方法的声明语句中使用\
  \ `throws` 关键字。使用 `throws` 关键字，你可以指定方法将抛出的异常类型。使用 `throws` 关键字的语法如下：\n\n```\nreturntype\
  \ method_name(parameter list) throws exception1, exception2,....., exceptionN\n\
  {\n    //方法正体\n}\n```\n\n在此语法中，`exception1` 到 `exceptionN` 代表该方法可以抛出的异常类型。\n\n例如：\n\
  ```java\nstatic void demo(int a, int b) throws IllegalAccessException\n{\n    //----------\n\
  \    throw new IllegalAccessException(\"trial\");\n}\n```\n在此示例中，`demo()` 方法可以抛出\
  \ `IllegalAccessException` 异常。\n\n### 示例 5\n\n下面的示例说明了 `throws` 关键字的使用。程序将处理抛出的检查异常\
  \ `IllegalException` 并在屏幕上显示消息。\n\n```java\n//写一个处理检查异常的程序\nclass throws_demo\n\
  {\n    static void demo( ) throws IllegalAccessException\n    {\n        System.out.println(\"\
  Inside demo\");\n        throw new IllegalAccessException(\"Trial\");\n    }\n \
  \   public static void main(String arg[ ])\n    {\n        try\n        {\n    \
  \        demo();\n        }\n        catch(IllegalAccessException e)\n        {\n\
  \            System.out.println(\"Exception caught \" +e);\n        }\n    }\n}\n\
  ```\n\n#### 解析\n\n**第 3 行**\n```java\nstatic void demo( ) throws IllegalAccessException\n\
  ```\n此行是 `demo()` ` 方法的声明语句。在此行中，通过 `throws` 关键字指定了方法将抛出 `IllegalAccessException`\
  \ 类型。\n\n**第 6 行**\n```java\nthrow new IllegalAccessException(\"Trial\");\n```\n\
  此行位于 `demo()` 方法的体内。在此行中，通过 `new` 操作符创建了一个 `IllegalAccessException` 类对象，并通过 `throw`\
  \ 语句将其抛出。\n\n**第 12 行**\n```java\ndemo();\n```\n在此行中，对 `demo()` 方法进行了调用。接下来，控制权将转移到\
  \ `demo()` 方法中（从 3 行到 7 行）。\n\n**第 15 行到第 17 行**\n```java\ncatch(IllegalAccessException\
  \ e)\n{\n    System.out.println(\"Exception caught \" +e);\n}\n```\n在 `demo()` 方法中抛出的异常对象将被\
  \ `catch` 块捕获并处理。因此，`catch` 语句体内的语句将在屏幕上显示。\n\n示例 5 的输出如图 7-8 所示\n\n![C07SC007.tif](img/C07SC007_fmt.jpeg)\n\
  \n图 7-8 示例 5 的输出\n\n## finally 子句\n\n当 `try` 块中发生异常时，程序的正常执行流会改变，`try` 块内部的一些语句将被跳过。在这种情况下，某些资源（如文件、数据库连接等）无法正确关闭。结果这些资源无法在其他程序或同一程序的其他部分使用。为了避免这个问题，Java\
  \ 使用了 `finally` 子句。该子句包含了释放其 `try` 块语句获取的资源的代码。注意，`finally` 子句只有在程序存在 `try` 块时才会被使用。\n\
  \n如果程序中存在 `finally` 子句，它将在 `try/catch` 块之后、`try/catch` 块之后的语句之前执行。使用该子句的主要优势是，无论是否发生异常，其内部的代码都会执行。使用\
  \ `finally` 子句的语法如下：\n\n```\nfinally\n{\n    //要执行的语句\n}\n```\n\n`finally` 子句是可选的，如果它与\
  \ `try` 块一起使用，它将放置在与该 `try` 块关联的最后一个 `catch` 块之后，如下：\n\n```java\ntry\n{\n    //语句\n\
  }\n```\n\n\n\n\n\n```java\ncatch(ExceptionType obj)\n{\n    //语句\n}\n\ncatch(ExceptionType\
  \ obj)\n{\n    //语句\n}\n\nfinally\n{\n    //语句\n}\n```\n\n但是，如果没有与 `try` 块关联的 catch\
  \ 块，则 `finally` 子句将紧跟在 `try` 块之后，如下所示：\n\n```java\ntry\n{\n    //语句\n}\nfinally(\
  \ )\n{\n    //语句\n}\n```\n\n# 示例 6\n\n下面的示例说明了 `finally` 子句的使用。该程序将计算用户作为命令行参数传递的数字的。。此外，程序程序使用\
  \ `try-catch-finally` 机制处理异常并在屏幕上显示消息。\n\n```java\n//编写一个程序来计算数字的平方并处理异常\n1 class\
  \ finally_demo\n2 {\n3 public static int sqr(int n)\n4 {\n5 try\n6 {\n7 int result\
  \ = n*n;\n8 if(result ==0)\n9 {\n10 throw new ArithmeticException(“demo”);\n11 }\n\
  12 else\n13 {\n14 return result;\n15 }\n16 }\n17 finally\n18 {\n19 System.out.println(“Inside\
  \ the finally block”);\n20 }\n21 }\n22 public static void main(String arg[ ])\n\
  23 {\n24 int sq;\n25 int val = Integer.parseInt(arg[0]);\n26 try\n27 {\n28 sq =\
  \ sqr(val);\n29 System.out.println(“The square of ” +val+ “ is: ” +sq);\n30 }\n\
  31 catch(ArithmeticException e)\n32 {\n33 System.out.println(“Exception caught ”\
  \ +e);\n34 }\n35 }\n36 }\n```\n\n#### 解析\n\n### 第 3 行\n`public static int sqr(int\
  \ n)`\n这一行包含了 `sqr()` 方法的声明部分。方法的参数列表包含一个整数类型参数 `n`。每当调用此参数时，传递一个整数值并赋值给整数变量 `n`。\n\
  \n### 第 5 到第 16 行\n```java\ntry\n{\n    int result = n*n;\n    if(result ==0)\n\
  \    {\n        throw new ArithmeticException(“demo”);\n    }\n    else\n    {\n\
  \        return result;\n    }\n}\n```\n这些行包含了 `try` 块的定义。在 `try` 块内部，首先将变量 `n`\
  \ 的值与其相乘，并将结果赋值给整数类型变量 `result`。接下来，将评估 `if` 语句内部给出的条件。如果评估结果为真，则将抛出一个 `ArithmeticException`\
  \ 异常对象。否则，将执行与 `else` 块关联的 `return` 语句。但在执行 `return` 语句之前，控制将转移到 `finally` 块。\n\n\
  ### 第 17 到第 20 行\n```java\nfinally\n{\n    System.out.println(“Inside the finally\
  \ block”);\n}\n```\n这些行代表了 `finally` 块。与其关联的语句将在屏幕上显示以下消息：\n`Inside the finally\
  \ block`\n在执行 `finally` 块之后，将执行 `return` 语句。\n\n### 第 25 行\n`int val = Integer.parseInt(arg[0]);`\n\
  在这一行中，将作为命令行参数传递的值被读取并赋值给整数类型变量 `val`。\n\n### 第 27 到第 31 行\n```java\ntry\n{\n  \
  \  sq = sqr(val);\n    System.out.println(“The square of ” +val+ “ is: ” +sq);\n\
  }\n```\n这些行包含了定义在 `main()` 方法内部的 `try` 块。在 `try` 块内部，将调用 `sqr()` 方法，并将 `val` 变量的值作为参数传递给\
  \ `sqr()` 方法，然后将其赋值给第 3 行中的变量 `n`。\n\n### 第 31 到第 34 行\n```java\ncatch(ArithmeticException\
  \ e)\n{\n    System.out.println(“Exception caught ” +e);\n}\n```\n当传递值 `0` 作为命令行参数时，第\
  \ 11 行给出的 `throw` 语句将抛出一个 `ArithmeticException` 类的对象。该对象将被 `catch` 块捕获并处理。\n\n如果你在执行期间按照如下方式传递\
  \ `0` 作为命令行参数：\n`D:\\Java Projects\\Ch07>java finally_demo 0`\n输出将如图 7-9 所示。\n\n\
