  ## 算术运算符\n用于数学表达式的运算符称为算术运算符。表 2-5 列出了 Java 中使用的所有算术运算符。\n\n### 表 2-5 算术运算符及其语法\n\
  | 运算符 | 描述 | 语法 |\n| :--- | :--- | :--- |\n| `+` | 加法 | `var1=var2 + var3` |\n|\
  \ `-` | 减法 | `var1=var2 - var3` |\n| `*` | 乘法 | `var1=var2 * var3` |\n| `/` | 除法\
  \ | `var1=var2 / var3` |\n| `%` | 取模运算符；给出余数 | `var1=var2 % var3` |\n\n# 示例 6\n\
  以下程序将使用算术运算符对两个数字进行加、减、乘、除和取模运算，并在屏幕上显示结果。\n\n```java\n/* 写一个程序使用算术运算符对两个数字执行各种算术运算：\
  \ */\nclass Arith_operators\n{\n    public static void main(String arg[])\n    {\n\
  \        int val1=30, val2=10;\n        int sum= val1+val2;\n        int sub= val1-val2;\n\
  \        int mul= val1*2;\n        int div= val1/val2;\n        int mod=mul%7;\n\
  \        System.out.println(“Value 1 = ” +val1);\n        System.out.println(“Value\
  \ 2 = ” +val2);\n        System.out.println(“Addition = ” +sum);\n        System.out.println(“Subtraction\
  \ = ” +sub);\n        System.out.println(“Multiplication = ” +mul);\n        System.out.println(“Division\
  \ = ” +div);\n        System.out.println(“Modulus = ” +mod);\n    }\n}\n```\n\n\
  #### 解析\n\n#### 第 5 行\n```java\nint val1=30, val2=10;\n```\n在此行中，`val1` 和 `val2`\
  \ 被声明为整数类型变量，它们的初始值分别赋值为 30 和 10。\n\n#### 第 6 行\n```java\nint sum= val1+val2;\n\
  ```\n在此行中，变量 `val1` 的值 (30) 与变量 `val2` 的值相加，结果赋值给变量 `sum`。\n\n#### 第 7 行\n```java\n\
  int sub= val1-val2;\n```\n在此行中，变量 `val1` 的值 (30) 减去变量 `val2` 的值 (10)，结果赋值给变量 `sub`。\n\
  \n#### 第 8 行\n```java\nint mul= val1*2;\n```\n在此行中，变量 `val1` 的值 (30) 乘以 2，结果赋值给变量\
  \ `mul`。\n\n#### 第 9 行\n```java\nint div= val1/val2;\n```\n在此行中，变量 `val1` 的值 (30)\
  \ 除以变量 `val2` 的值 (10)，结果赋值给变量 `div`。\n\n#### 第 10 行\n```java\nint mod=mul%7;\n```\n\
  在此行中，变量 `mul` 的值 (60) 除以 7，余数 (4) 赋值给变量 `mod`。\n\n#### 第 11 行\n```java\nSystem.out.println(“Value\
  \ 1 = ” +val1);\n```\n这一行将在屏幕上显示如下：\nValue 1 = 30\n\n#### 第 12 行\n```java\nSystem.out.println(“Value\
  \ 2 = ” +val2);\n```\n这一行将在屏幕上显示如下：\nValue 2 = 10\n\n#### 第 13 行\n```java\nSystem.out.println(“Addition\
