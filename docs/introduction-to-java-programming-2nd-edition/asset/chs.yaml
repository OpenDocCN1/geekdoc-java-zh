  10  Rectangle obj1 = new Rectangle( );\n11 double area;\n12 obj1.length = 85;\n\
  13 obj1.breadth = 73;\n14 area= obj1.length * obj1.breadth;\n15 System.out.println(“Area\
  \ is: ” +area);\n16 }\n17 }\n```\n\n**解释**\n\n- **第 1 到 5 行**：\n  ```java\n  class\
  \ Rectangle\n  {\n      double length;\n      double breadth;\n  }\n  ```\n  这些行定义了\
  \ `Rectangle` 类。大括号 `{}` 表示 `Rectangle` 类的开始和结束。`length` 和 `breadth` 是变量。\n- **第\
  \ 6 行**：`class Rectangle_demo`。\n- **第 10 行**：`Rectangle obj1 = new Rectangle( );`\n\
  \  执行此行后，`obj1` 是 `Rectangle` 类的实例。\n- **第 11 行**：`double area;`\n  在此行中，`area`\
  \ 被声明为 `double` 类型变量。\n- **第 12 行**：`obj1.length = 85;`\n  在此行中，`85` 被赋值给 `obj1`\
  \ 对象的实例变量。\n- **第 13 行**：`obj1.breadth = 73;`\n  在此行中，`73` 被赋值给 `obj1` 对象的实例变量。\n\
  - **第 14 行**：`area= obj1.length * obj1.breadth;`\n  在此行中，首先 `obj1` 对象的实例变量 `length`\
  \ 和 `breadth` 相乘。接下来，结果值 `6205.0` 被赋值给 `area` 变量。\n- **第 15 行**：`System.out.println(“Area\
