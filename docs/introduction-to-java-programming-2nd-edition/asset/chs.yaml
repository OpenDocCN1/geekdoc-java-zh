  ![78288.jpg](img/78288.jpg)\n\n## Java 简介\n\n### 学习目标\n完成本章后，你将能够：\n* 理解 Java 的历史、演变和特性\n\
  * 理解面向对象编程（OOPS）的概念\n* 理解 Java 编译器和解释器\n* 安装 Java 开发包（JDK）\n* 编写、编译、设置路径并运行你的第一个\
  \ Java 程序\n* 安装 NetBeans IDE\n* 在 NetBeans IDE 中编写、构建和运行 Java 程序\n\n### 简介\n本章将向你介绍\
  \ Java 编程语言，并允许你编写第一个 Java 程序。在本章中，你将简要地了解该语言的历史、演变和特性。此外，你还将学习如何在系统上安装 Java 和 NetBeans\
  \ IDE（集成开发环境）并运行 Java 程序。此外，你将获得面向对象编程概念及其在开发 Java 程序重要性的知识。\n\n**注意**\n1. 集成开发环境（`IDE`）是一种为计算机程序员提供全面软件开发功能的应用程序。它通常由源代码编辑器、构建自动化工具和调试器组成。\n\
  2. 本书中的示例在 Windows 平台上经过测试，而该平台本身是用 Java 编写的。\n\n## Java 的历史与演变\nJava 的第一个版本是由 James\
  \ Gosling 在 1991 年在美国的太阳微系统公司（现已被甲骨文收购）开发的。最初，它被 James Gosling 命名为 Oak，但在 1995 年，它被重命名为\
  \ Java。第一个版本的应用程序是为电子设备和电路使用设计的，该计划取得了成功。后来，它被称为绿色项目（Green project），导致了 Java 的发明。\n\
  \n除了通用用途外，它被认为是一种领先的基于 Web 的技术。当它被发明时，没有人知道它会有多流行。它是第一个平台无关且可以在任何平台上运行的面向对象编程语言。它允许开发者遵循“一次编写，随处运行”（`WORA`）的概念。虽然\
  \ Java 的基础语法取自 C 和 C++，但它与 C 或 C++ 仍很大不同。\n\n目前有四种主要的 Java 版本：\n* Java 标准版（`Java\
  \ SE`）\n* Java 企业版（`Java EE`）\n* Java 微型版（`Java ME`）\n* JavaFX\n\n用于计算机软件的 Java\
  \ 应用程序是在 Java 标准版上开发的。用于 Web 服务器的 Java 应用程序是使用 Java 企业版开发的。多媒体平台的应用程序使用 JavaFX 开发，而移动设备的应用程序是在\
  \ Java 微型版上开发的。\n\n你可以使用 Java 编程语言创建两种类型的程序：Applets（小程序）和应用程序（应用程序）。Applets 是用于网页浏览器的较小代码段。它们是轻量级应用程序，通常用于为浏览器提供导航增强或额外的交互。\n\
  \n你可以使用 Java 创建的另一种类型的软件是控制台应用程序。这些应用程序是独立程序，旨在像其他程序一样运行在你的计算机上。像 NetBeans 这样的 IDE\
  \ 带有集成控制台环境，你可以使用它来运行你的 Java 程序。\n\n**注意**\n与独立应用程序不同，Java Applets 执行不需要任何解释器。\n\
  \n## Java 特性\nJava 的流行是因为它先进的特性，如平台无关性、简单性、安全性等。接下来将解释 Java 的一些主要特性。\n\n### 平台无关性\n\
  你已经知道 Java 是一种平台无关的语言，这意味着它可以在任何操作系统上运行。例如，在 Windows 平台上编写的 Java 应用程序可以在 Linux、Macintosh\
  \ 和任何其他操作系统上运行。当 Java 在系统上运行时，它会将源代码转换为字节码。这种字节码是由 Java 编译器在 `JVM`（Java 虚拟机）的帮助下生成的，可以在任何系统上独立工作。你将在本章稍后学习更多关于\
  \ `JVM` 的知识。由于其可移植性，在一个平台上创建的 Java 应用程序可以在任何其他平台上运行。\n\n### 简单性\n与其他语言相比，Java 语言的语法非常简单。它与\
  \ C 或 C++ 语言非常相似。Java 中的每个关键字都有意义；因此，你可以轻松识别关键字的作用。\n\n### 双阶段系统\nJava 为你提供了分两个阶段编译程序的功能。在第一阶段，Java\
  \ 编译器将源代码转换为字节码；在第二阶段，Java 解释器将该字节码转换为机器码。由于计算机可以理解机器码，因此它会执行代码并产生输出。这被称为双阶段系统。\n\
  \n### 面向对象\nJava 是完全的面向对象编程语言，因为它将万物都视为对象。Java 的基本概念取自 C 和 C++。C 不是面向对象编程语言，而是结构化编程语言。然而，作为\
  \ C 扩展的 C++ 是面向对象编程语言。Java 比 C 或 C++ 更具有独立性。你将在本章晚些部分了解更多关于 Java、C 和 C++ 之间的相似与差异。\n\
  \n### 安全性\n安全性是任何编程语言中最重要的问题之一。如果你的应用程序不安全，你的数据也不安全。Java 是一种基于安全的语言，因为 Java 不像 C++\
  \ 那样支持指针，因此代码无法访问内存。Java 的内部系统会验证尝试访问内存的代码。\n\n### 多线程\nJava 支持多线程，这意味着 Java 可以在进程中处理多个任务。这是\
  \ Java 最重要的特性之一。此外，它支持线程同步，这有助于多个线程以同步的方式工作。你将在后面的章节中学习更多关于多线程的知识。\n\n### 易于操作\n\
  Java 非常友好用户且易于操作。编写 Java 程序不需要特定的环境。你只需在任何文本编辑器中输入 Java 程序即可。例如，你可以在记事本中编写 Java\
  \ 程序，并在保存程序后，像在 C 或 C++ 编程语言中那样使用命令行窗口执行它。\n\n## 面向对象编程的概念\n当谈到面向对象编程系统时，Java 的名字名在前列，因为它满足了真正的面向对象编程系统的所有要求，例如它支持数据抽象、封装、多态和继承。\n\
  \n\n\n\n\n类、实例和对象是程序中不可或缺的一部分，如果该程序是使用 `Java` 等面向对象的编程语言创建的。类可以被定义为一种模板/蓝图，描述不同对象的行为/状态。对象是体现其类所定义的属性和行为的具体元素。相同类型的对象被称为同类型或同一类对象。一旦从类中派生出一个对象，它就变成了一个实例。对象可以执行的操作称为方法。在\
  \ `Java` 中，这些方法在其他语言中被称为过程、方法、函数或子程序。\n\n为了理解类和对象的概念，假设 `Vehicles`（车辆）是一个类。在 `Vehicles`\
  \ 类下，你有不同类型的车辆，如 `Cars`（汽车）、`Buses`（公交）、`Trucks`（卡车）等。`Cars`、`Buses` 和 `Trucks`\
  \ 就是 `Vehicles` 类下的对象。\n\n## 面向对象编程的特性\n\n某些特性使得面向对象编程非常流行。接下来将讨论这些特性。\n\n### 数据抽象\n\
  从面向对象编程语言的角度来说，`Data Abstraction`（数据抽象意味着意味着显示功能而隐藏实现细节。它有助于隐藏多个数据的复杂性。数据抽象的现实世界例子是发送\
  \ `E-mail`，用户只需撰写邮件并发送给另一个用户，而无需知道后台运行内部过程。\n\n### 封装\n这是面向对象编程语言的另一个特性。在封装中，方法和数据被组合或封装在一个单一单元中。换句话说，方法和数据被封装在一起，并作为一个名为\
  \ `object`（对象）的单一实体工作，参见图 1-1。这个概念称为数据隐藏。在这个过程中，数据无法被任何外部方法或过程访问，只有那些组合作为单一实体工作的方法才能访问它。\n\
  \n![Encapsulation](img/C01SC001.tif)\n\n### 多态\nPolymorphism 是一个希腊词，`poly` 意味着“多”，`morph`\
  \ 意味着“形式”。在面向对象编程中，`polymorphism`（多态）意味着“一名多形”。在 `polymorphism` 中，单个方法可以有不同的形式，或者多个方法具有相同的名称但不同的参数。\n\
  \n## 继承\n`Inheritance`（继承）是面向对象编程的关键特性。它允许一个类重用另一个类的代码。在 `inheritance` 中，类派生自基类并继承它的属性和方法。这减少了代码重复并提高了可重用性。\n\
  \n## 继承的类型\n\n主要有三种继承类型：\n\na. `Single Inheritance`（单继承）\nb. `Multilevel Inheritance`（多级继承）\n\
  c. `Hierarchical Inheritance`（层级继承）\n\n### 单继承\n当一个类派生自单一基类时，它被称为 `single inheritance`。图\
  \ 1-3 展示了这一点，其中类 `B` 继承类 `A`。\n\n![Single Inheritance](img/C01SC003.tif)\n\n###\
  \ 多级继承\n当一个类派生自另一个类时，它被称为 `multilevel inheritance`。图 1-4 显示了这一点，其中类 `C` 继承类 `B`。\n\
  \n![Multilevel Inheritance](img/C01SC004.tif)\n\n### 层级继承\n当多个类派生自同一个基类时，它被称为 `hierarchical\
  \ inheritance`。图 1-5 展示了这一点，其中类 `B` 和 `C` 继承类 `A`。\n\n![Hierarchical Inheritance](img/C01SC005.tif)\n\
  \n### 多继承\n在 `multiple inheritance` 中，一个类派生自多个超类。然而，`Java` 的设计者认为这太复杂，不符合保持 Java\
  \ 简单性的目标。因此，这种类型的继承在 `Java` 中没有实现。\n\n### 接口\nJava 通过 `Interface` 满足了多继承的需求。`interface`\
  \ 是类的蓝图。它与类非常相似，但它只包含抽象方法。接口只能由类实现或由其他接口扩展。\n\n![Interface](img/C01SC002.tif)\n\n\
  ## Java 编译器和解释器\n\n当你运行 Java 程序时，它会经过两个阶段：编译和解释。在编译期间，编译器将源代码转换为中间语言。\n\n\n\n\n\n\
  1. `Compiler`（编译器）是一种特殊目的程序，它将高阶语言（人类容易编写和理解的语言）如`Java` 程序转换为低级语言程序（机器语言）。\n\n2.\
  \ `Byte-code`（字节码）是用于名为`Java Virtual Machine`（`JVM`）的虚拟计算机的机器语言。每个计算机平台都有自己的程序来执行`byte-code`\
  \ 指令。\n\n# Java Virtual Machine\n\n你知道在`Java` 程序中，源代码会被转换为`byte-code`，而 `byte-code`\
  \ 又会被转换为机器码。`Byte-code` 并不是任何类型计算机的机器语言。事实上，它是名为`Java Virtual Machine`或`JVM`的虚拟计算机的机器语言。`JVM`\
  \ 一词用于指代充当此类角色的软件。`JVM` 这种软件就像一个计算机。`JVM` 这种软件是虚构的计算机。每当你安装 `JVM` 时，它会被加载到计算机内存。`JVM`\
  \ 具有非常强大的架构。将`Java` 程序转换为机器码的示意图如图 8。\n\n![图-8](img/C01se08.tif)\n\n# Java Development\
  \ Kit\n\n在本节中，你将学习`Java Development Kit`（`JDK`）的安装过程。安装 `JDK` 是在计算机上运行 `Java` 程序的非常容易的过程。你可以从\
  \ Oracle 网站下载最新版本的 `JDK`：`www.oracle.com/java/technologies/downloads/index.html`\n\
  \    {\n        System.out.println(\"Hello Java\");\n    }\n}\n```\n\n上面的代码示例通过\
  \ `package` 关键字定义了包。\n\n### The import Keyword\n\n正如其名所示，该关键字用于导入包、类或方法。导入包的修饰符在\
  \ Java 程序中非常常见。例如：\n\n`import java.lang.*;`\n\n这里 `*` 表示包中的所有类。\n\n如果你没有设置任何修饰符，它将遵循默认访问权限。为了访问特定的类，例如：\n\
  \n`import java.lang;`\n\n### The class Keyword\n\n`class` 是面向对象语言的基础。它包含了方法、对象、属性、变量。任何有效的类名都可以通过\
  \ `class` 关键字来定义。例如：\n\n`class JavaBook`\n\n这行代码表示 `JavaBook` 类。\n\n### System.out.println()\
  \ Statement\n\n该语句用于向下一行打印输出。这里 `println` 指的是 `out` 对象，而 `System` 指的是类。例如：\n\n```java\n\
  System.out.println(\"Hello Java\");\n```\n\n该语句会在下一行打印 \"Hello Java\"。\n\n\n\n\n\
  \n当你希望类的成员仅由该特定类访问，而不允许其他类访问时，可以声明 `private` 访问修饰符。\n\n例如：\n\n```java\nprivate class\
  \ JavaBook\nprivate Author() {...........}\n```\n\n# Java 中的注释\n\n为了方便起你你可以在 Java\
  \ 程序中编写注释。Java 支持两种类型的注释，C++ 也支持这些注释。它们是单行注释和多行注释。\n\n## 单行注释\n当你想在 Java 程序中编写一个主题或短注释时，使用单行注释。它以两个正斜杠（`//`）开头。\n\
  \n例如：\n\n```java\n//这是一个单行注释。\n```\n\n## 多行注释\n当你想为程序编写较长的描述或短小的文档时，使用多行注释。多行注释包含在\
  \ `/*` 和 `*/` 之间。这两个标记之间的任何内容都会被编译器忽略。\n\n例如：\n\n```java\n/*这是一个多行注释。其中的任何内容\n都会被编译器忽略.*/\n\
  ```\n\n# 编写第一个 Java 程序\n市场上有许多编辑器可以用来编写和运行 Java 程序。你可以使用编辑器，也可以简单地使用记事本编辑器来编写 Java\
  \ 程序。在本节中，你将学习如何在记事本编辑器中编写 Java 程序，并在命令提示符中编译和运行它们。\n\n要编写 Java 程序，首先，从开始菜单打开记事本编辑器，在其中编写程序，然后以文件名\
  \ `FirstProgram.java` 保存程序。\n\n### 示例 1\n以下示例是一个简单的 Java 程序。该程序将在屏幕上打印 Hello Java。\n\
  \n```java\n// The program will print Hello Java\n1 class FirstProgram\n2 {\n3 public\
  \ static void main(String args[ ])\n4 {\n5 System.out.println(“Hello Java”);\n6\
  \ }\n7 }\n```\n\n#### 解释\n对给定程序的逐行解释如下：\n\n**第 1 行**\n`class FirstProgram`\n这一行表示创建一个名为\
  \ `FirstProgram` 的类。\n\n**第 2 行**\n`{`\n这一行表示 `FirstProgram` 类定义的开始。\n\n**第 3 行**\n\
  `public static void main(String arg[])`\n该语句用于每个 Java 程序中，是 Java 的 `main` 方法。它是每个程序的入口。控制流将始终到达此语句。\n\
  * `public`: 这是一个访问修饰符，任何具有 public 访问修饰符的方法在整个范围内都是可见的。\n* `static`: `static` 关键字允许在不创建类实例的情况下调用\
  \ `main()` 方法。这是必要的，因为 `main()` 方法在创建任何对象之前由 Java 解释器调用。\n* `void`: `void` 关键字表示\
  \ `main()` 方法不返回任何值。\n* `main(String args[])`: `args[]` 是字符串类对象的数组，是 `main()` 方法的参数。\n\
  \n**第 4 行**\n`{`\n这一行表示 `main()` 方法定义的开始。\n\n**第 5 行**\n`System.out.println(“Hello\
  \ Java”);`\n这一行将在屏幕上打印 Hello Java。\n\n**第 6 行**\n`}`\n这一行表示 `main()` 方法定义的结束。\n\n\
  **第 7 行**\n`}`\n这一行表示 `FirstProgram` 类定义的结束。\n\n> **注意**：程序中的初始行 `// The program\
  \ will print Hello Java` 并不是程序的一部分。它是一个单行注释，仅供参考。\n\n# 编译和运行 Java 程序\nJava 程序很容易编译和运行。你可以在任何命令编辑器中编译\
  \ Java 程序。在编译和运行 Java 程序之前，你需要知道用于编译和运行 Java 程序的两个关键字。这些关键字将在接下来讨论。\n\n## javac\
  \ 命令\n`javac` 命令用于编译 Java 程序。你可以通过以下方式使用 `javac` 命令编译 Java 程序：\n\n```bash\njavac\
  \ Name_of_file with extension\n```\n在这里，`javac` 是一个关键字，`Name_of_file` 是带有 `.java`\
  \ 扩展名的 Java 程序文件名。\n\n## java 命令\n`java` 命令在编译后运行 Java 程序，并将输出显示到命令提示符。\n\n你可以通过以下方式使用\
  \ `java` 命令运行 Java 程序：\n\n```bash\njava Name_of_file\n```\n\n> **注意**：使用程序中的类名保存你的\
  \ Java 程序是一个好习惯，可以避免错误。例如，如果程序中的类名为 `FirstProgram`，则文件名必须保存为 `FirstProgram.java`。\n\
  \n# 设置程序目录路径\n要编译和运行程序，必须设置一个路径（位置）来定位如 `javac` 和 `java` 等 JDK 二进制文件。环境变量 `path`\
  \ 用于定位这些 JDK 二进制文件。\n\n设置路径目录有两种方法。首先，你可以临时设置路径，这意味着你可以可以使用该路径直到命令编辑器打开。一旦退出命令编辑器，你就无法再次使用它。其次，你可以永久设置路径，这意味着即使关闭电脑，该路径也不会丢失。这两种方法将在接下来详细讨论。\n\
  \n## 临时设置路径\n临时设置你的 Java 项目路径目录需要以下步骤：\n\n**步骤 1**\n在硬盘的任何位置创建一个包含所有 Java 程序的文件夹，并根据你的喜好命名。例如，`Java\
  \ Projects`。\n\n**步骤 2**\n从开始菜单打开命令编辑器。进入你保存文件的驱动器和目录。例如，根目录是 `D:`。\n\n**步骤 3**\n\
  在命令提示符中输入以下命令：\n```bash\npath=The full path of bin directory of Java\n```\n在这里，`path`\
  \ 是赋值。输入 Java bin 目录的完整路径，然后按回车键。\n\n**步骤 4**\n现在，你可以在项目目录中编译和运行所有的程序。你可以运行示例 1\
  \ 进行测试。对你之前学过的程序重复相同的过程。\n\n> **注意**：要返回上一级目录，你可以直接输入 `cd\\`\n\n## 永久设置路径\n永久设置你的\
  \ Java 项目路径目录需要以下步骤：\n\n**步骤 1**\n从开始菜单进入控制面板。接下来，点击“系统”图标；将显示计算机的基本信息窗口。或者，从开始菜单右键点击“计算机”，然后选择“属性”来显示计算机的基本信息窗口。\n\
  \n**步骤 2**\n在计算机的基本信息窗口中，选择“高级系统”选项；将显示系统属性对话框。\n\n**步骤 3**\n在系统属性对话框中，选择“高级”选项卡，然后选择“环境变量”按钮；将显示环境变量对话框。\n\
  \n\n\n\n\n## 第 4 步\n\n在“环境变量”对话框的系统变量区域选择`新建`按钮；将显示“新建系统变量”输入框。\n\n## 第 5 步\n\n\
  在“变量名”文本框中输入 `PATH`，在“变量值”文本框中输入 JDK bin 目录的完整路径，并选择`确定`按钮，如图 1-15 所示。\n\n![C01SC015.tif](img/C01SC015_fmt.jpeg)图\
  \ 1-15 新系统变量输入框\n\n再次在“环境变量”对话框中选择`确定`按钮，然后在“系统属性”对话框中选择`确定`按钮。\n\n现在，路径目录已永久设置，你可以使用命令行编辑器在硬盘的任何地方编译并运行程序。\n\
  \n永久设置路径后，`Example 1`的输出如图 1-16 所示。\n\n![C01SC0016.tif](img/C01SC0016_fmt.jpeg)\n\
  \n图 1-16 永久设置路径后 Example 1 的输出\n\n## 安装 NetBeans IDE\n\nNetBeans 是一个流行的免费开源 IDE，用于使用\
  \ Java、JavaScript、HTML5、PHP、C/C++ 等语言快速方便地开发桌面、移动端和 Web 应用程序。大多数程序员使用 IDE，是因为它消除了对文本编辑器、编译器和运行程序等独立工具的需要。\n\
  \nIDE 将所有这些工具集成到一个具有图形用户界面的单一工具集中。互联网上有许多 IDE 可用，其中一些还拥有自己的编译器和虚拟机。\n\n要安装 NetBeans，请导航到\
