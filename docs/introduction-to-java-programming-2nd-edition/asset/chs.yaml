  ### 垃圾回收\n\n在某些面向对象的语言（如 C++）中，你需要手动回收内存。但 Java 提供了一种自动机制，被称为垃圾回收。\n\n当一个对象不再被引用时，它就变得可以被垃圾回收。你可以通过\
  \ `System.gc()` 方法手动使用这种机制。\n\n### finalize() 方法\n\n如前所述，在垃圾回收时，不再使用的对象会被销毁。但有时你希望在对象销毁之前执行某些操作。为了这个目的，Java\
  \ 提供了一个 `finalize()` 方法。其语法如下：\n\n```java\nprotected void finalize()\n{\n  //最终化代码\n\
  }\n```\n\n\n\n\n此示例的工作原理与`Example 12`相同，唯一的区别在于此示例中使用了 `this` 运算符。当创建 `obj1` 对象时，`this`\
