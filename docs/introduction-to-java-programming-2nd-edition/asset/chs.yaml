  \ 对象。接下来，执行方法定义内部的所有语句。\n\n示例 7 的输出如图 4-9 所示。\n\n![C04SC007.tif](img/C04SC007_fmt.jpeg)\n\
  \n图 4-9 示例 7 的输出\n\n### 从方法返回对象\n\n在本章之前的示例中，你观察到方法只返回了如 `int`、`double` 等简单数据类型的变量。在本节中，你将学习如何通过\
