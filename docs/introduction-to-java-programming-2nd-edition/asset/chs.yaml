  \n图 4-8 示例 6 的输出\n\n### 将对象传递给方法\n\n在本章的节节中，你已经学习了向方法传递参数，其中，当你向方法传递一个简单的数据项时，Java\
  \ 仅传递该数据的副本，而不是原始数据项。这个过程被称为按值传递（pass by value）。在按值传递中，你只能对数据项的副本进行更改，而不影响原始数据项。同样，你也可以将对象传递给方法，但这个过程与传递参数不同。Java\
  \ “按值”传递对象引用。当对象作为参数传递给方法时，实际上传递的是该对象的引用。因此，如果你对传递的对象进行任何更改，它都将影响原始对象。\n\n例如：\n\n\
  ```java\nclass Demo\n{\n----------;\nint area(Rect obj1, Rect obj2)\n{\n----------;\n\
  ----------;\n}\n}\n```\n\n在这个示例中，`Demo` 类的 `area()` 方法包含两个参数。两个参数 `obj1` 和 `obj2`\
  \ 都表示为 `Rect` 类的对象。因此，每当调用 `area()` 方法时，两个 `Rect` 类的对象都会作为参数传递。\n\n### 示例 7\n\n\
