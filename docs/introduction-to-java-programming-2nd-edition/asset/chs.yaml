  \n### 多线程\n\n### 学习目标\n完成本章后，你将能够：\n* 理解多线程的概念\n* 理解线程模型\n* 理解主线程的概念\n* 理解创建新线程的步骤\n\
  * 理解创建多个线程的步骤\n* 理解 `isAlive()` 和 `join()` 方法的概念\n* 设置线程优先级\n* 理解同步的概念\n* 理解死锁的概念\n\
  \n### 引言\n在本章中，你将学习 Java 的另一个特殊特性，称为多线程。在学习多线程概念之前，你应该先了解 `thread`（线程）。一个 `thread`\
  \ 是程序的一部分或正在执行的指令序列。每个 `thread` 的执行路径与程序中的所有其他 `threads` 都不同，但这些 `threads` 可以直接相互共享数据。因此，在学习多线程概念和线程同步的同时，你将在本章中学习创建多个线程。\n\
  \n### 多线程\n多线程意味着并发执行两个或多个 `threads` 或程序的部分。它是多任务处理的一种特殊形式。它提供了编写程序的能力，有助于最大化 CPU\
  \ 利用率并最小化 CPU 空闲时间。多任务处理过程分为两类：基于进程的多任务和基于线程的多任务。这些类型将在接下来讨论。\n\n1. 在基于进程的多任务中，两个或多个程序可以并发运行。在这种多任务中，每个程序被视为一个\
  \ `process`（进程）。这个 `process` 也被称为重量级进程。基于进程的多任务的主要缺点是每个 `process` 都需要独立的地址空间，且从一个\
  \ `process` 到另一个 `process` 的切换时间非常长。\n2. 在基于线程的多任务中，程序的两个或多个部分可以并发运行。在这种多任务中，每个\
  \ `thread` 被称为轻量级进程。使用基于线程的多任务的主要优势是程序的每个 `thread` 共享内存空间，且从一个 `thread` 到另一个 `thread`\
  \ 的切换时间非常短。\n\n### 线程模型\n多线程环境最棒的部分是每个 `thread` 的功能都独立于程序的其他 `threads`。如果一个 `thread`\
  \ 停止运行，其他 `threads` 的运行不受影响。因此，使用这种环境的主要优势是一个 `thread` 的空闲时间可以用于程序的其他地方。在多线程环境中，每个\
  \ `thread` 可以处于以下状态之一：\n\n1. **New**（新建）：`thread` 已创建但尚未启动的状态。\n2. **Runnable**（可运行）：`thread`\
  \ 在调用 `start()` 方法后等待 CPU 时间片的状态。\n3. **Running**（运行中）：`thread` 正在执行的状态。\n4. **Waiting**（等待中）：`thread`\
  \ 等待另一个 `thread` 执行任务的状态。在这种情况下，`thread` 仍然存存的。\n5. **Blocked**（阻塞）：`thread` 等待被另一个\
  \ `thread` 使用的资源的状态。\n6. **Terminated**（已终止）：`thread` 执行完成的状态。\n\n### 线程优先级\n每当创建一个\
  \ `thread` 时，Java 会根据其整数值对其优先级排序。程序中 `thread` 的优先级代表了其相对于程序中其他 `threads` 的重要性。在设置优先级时，会给\
  \ `thread` 分配一个 1 到 10 的整数值。最高优先级为 10，最低优先级为 1，普通优先级为 5。给线程设置优先级有助于确定从当前执行的 `thread`\
  \ 切换到其他 `thread` 的时间。从一个线程切换到另一个线程的过程被称为上下文切换。\n\n1. 线程可以主动释放控制权。在这种情况下，CPU 将提供给优先级最高的线程。\n\
  2. 低优先级线程可以被高优先级线程替换。在这种情况下，低优先级线程会被挂一段时间。\n\n如果存在多个相同优先级的线程，它们的执行取决于所使用的操作系统。例如，在\
  \ Windows 操作系统中，线程执行的时间片是以轮转方式分配的。\n\n注意：优先级决定了线程的执行顺序。然而，高优先级线程和低优先级线程的执行速度并没有区别。\n\
  \n### 主线程\n当 Java 程序启动时，一个线程会启动。这个线程被称为主线程（main thread）。主线程被视为父线程，其余由它生成的子线程。主线程的另一个重要特点是它是程序中最后一个执行的线程。当主线程执行完毕时，程序终止。\n\
  \n每当 Java 程序启动时，主线程会自动创建。这个线程在所有 Java 程序中都是可用的。你可以通过对象和 `Thread` 类的成员方法来控制线程的执行。这样做，你需要使用\
  \ `Thread` 类的 `currentThread()` 方法创建主线程的引用，如下所示：\n\n```java\nThread obj = Thread.currentThread();\n\
  ```\n\n在这个示例中，`obj` 是 `Thread` 类的对象。在这里，`Thread` 类的 `currentThread()` 方法返回调用它的线程的引用。接下来，将该引用赋值给\
  \ `Thread` 类的对象 `obj`。同样，一旦获取了主线程的引用，就可以控制它的执行。\n\n### 示例 1\n以下示例演示了主线程的概念。程序将获取并显示主线程的名称。还将更改其名称并在屏幕上显示。\n\
  \n```java\n//编写一个更改主线程名称的程序\nclass main_thread_demo\n{\n    public static void main(String\
  \ arg[ ])\n    {\n        Thread obj = Thread.currentThread();\n        System.out.println(“Current\
  \ thread is: ” +obj);\n        System.out.println(“Name of the current thread is:\
  \ ” +obj.getName( ));\n        obj.setName(“New Thread”);\n        System.out.println(“After\
  \ the change of name, the current thread is: ” +obj);\n    }\n}\n```\n\n\n\n\n\n\
  ```java\nThread obj = Thread.currentThread();\n```\n\n在这一行中，`obj` 对象被创建为 `Thread`\
  \ 类的一个对象。在这里，`currentThread()` 方法返回主线程的引用，因为它是在主线程内部调用的。接下来，主线程的引用将赋值给 `Thread`\
  \ 类的 `obj` 对象。\n\n#### 第 6 行\n```java\nSystem.out.println(\"Current thread is: \"\
  \ +obj);\n```\n\n这一行将在屏幕上显示以下内容：\n\nCurrent thread is: Thread[main,5,main]\n\n在上述行提供的方括号中，第一个值\
  \ `main` 代表线程名称；第二个值 `5` 代表主线程的优先级；第三个值 `main` 代表主线程所属的组名称。\n\n#### 第 7 行\n```java\n\
  System.out.println(\"Name of the current thread is: \" +obj.getName());\n```\n\n\
  在这里，`Thread` 类的 `getName()` 方法将返回 `obj` 对象所引线程的名字。这一行将在屏幕上显示以下消息：\n\nName of the\
  \ current thread is: main\n\n#### 第 8 行\n```java\nobj.setName(\"New Thread\");\n\
  ```\n\n在这一行中，`Thread` 类的 `setName()` 方法将主线程的名字从 `main` 改为 `New Thread`。\n\n####\
  \ 第 9 行\n```java\nSystem.out.println(\"After the change of name, the current thread\
  \ is: \" +obj);\n```\n\n这一行将在屏幕上显示以下内容：\n\nAfter the change of name, the current\
  \ thread is: Thread[New Thread,5,main]\n\n示例 1 的输出如图 8-1 所示。\n\n![C08SC001.tif](img/C08SC001_fmt.jpeg)\n\
  \n图 8-1 示例 1 的输出\n\n## 创建新线程\n\n在 Java 中，你可以通过以下两种方法创建一个新线程：\n\n1. 实现 `Runnable`\
  \ 接口。\n2. 扩展 `Thread` 类。\n\n## 实现 Runnable 接口\n\n要使用此方法创建新线程，你首先需要声明一个实现 `Runnable`\
  \ 接口的类。为了实现 `Runnable` 接口，该类只需要实现一个方法，即 `run()` 方法。在 `run()` 方法内部，你可以指定由新线程执行的代码。`run()`\
  \ 方法的声明语法如下：\n\n```java\npublic void run()\n{\n    //Statements to be executed concurrently\n\
  }\n```\n\n实现接口后，你可以在同一个类内部通过 `Thread` 构造函数创建 `Thread` 类的对象。创建 `Thread` 类对象的语法如下：\n\
  \n```java\nobj = new Thread(Runnable obj1, name)\n```\n\n在此语法中，`obj` 是 `Thread`\
  \ 类的一个对象。`Thread` 构造函数的参数列表包含两个参数：`obj1` 和 `name`。`obj1` 参数代表实现 `Runnable` 接口的类的对象，而\
  \ `name` 参数指定分配给新线程的名字。\n\n一旦创建了对象，你就对它调用 `Thread` 类的 `start()` 方法。调用 `start()`\
  \ 方法的语法如下：\n\n```java\nobj.start();\n```\n\n在此语法中，`obj` 代表 `Thread` 类的对象。在这里，`start()`\
  \ 方法会调用 `run()` 方法。现在，每当 `run()` 方法的执行停止时，线程的执行也会停止。\n\n### 示例 2\n\n下面的示例说明了如何使用\
  \ `Runnable` 接口创建线程。该程序将创建一个新线程，并显示有关运行中线程的信息。\n\n```java\n//Write a program to\
  \ create a new thread\n1 class newthread implements Runnable\n2 {\n3 Thread obj;\n\
  4 newthread()\n5 {\n6 obj = new Thread(this, \"New Thread\");\n7 System.out.println(\"\
  Starting new thread: \" +obj);\n8 obj.start();\n9 }\n10 public void run()\n11 {\n\
  12 try\n13 {\n14 for(int i=0; i<5; i++)\n15 {\n16 System.out.println(\"Executed\
  \ new thread\");\n17 Thread.sleep(500);\n18 }\n19 }\n20 catch(InterruptedException\
  \ e)\n21 {\n22 System.out.println(\"New thread interrupted\");\n23 }\n24 System.out.println(\"\
  New thread stopped\");\n25 }\n26 public static void main(String arg[ ])\n27 {\n\
  28 newthread obj1 = new newthread();\n29 try\n30 {\n31 for(int i=0; i<5; i++)\n\
  32 {\n33 System.out.println(\"Executed main thread\");\n34 Thread.sleep(1000);\n\
  35 }\n36 }\n37 catch(InterruptedException e)\n38 {\n39 System.out.println(\"Main\
  \ thread interrupted\");\n40 }\n41 System.out.println(\"Main thread stopped\");\n\
  42 }\n43 }\n```\n\n#### 解释\n\n**第 1 行**\n`class newthread implements Runnable`\n\
  在这一行中，`newthread` 类通过 `implements` 关键字实现了 `Runnable` 接口。\n\n**第 3 行**\n`Thread obj;`\n\
  在此行中，`obj` 被声明为 `Thread` 类的一个对象。\n\n**第 4 到 9 行**\n```java\nnewthread()\n{\n   \
  \ obj = new Thread(this, \"New Thread\");\n    System.out.println(\"Starting new\
  \ thread: \" +obj);\n    obj.start();\n}\n```\n这些行定义了 `newthread` 构造函数。在体内，使用 `Thread`\
  \ 构造函数创建了 `obj` 对象。`System.out.println` 语句显示：`Starting new thread: Thread[New Thread,5,main]`。接下来调用了\
  \ `start()` 方法，它会调用 `run()` 方法。\n\n**第 10 行**\n`public void run()`\n这一行是 `run()`\
  \ 方法的声明。\n\n**第 12 到 19 行**\n```java\ntry {\n    for(int i=0; i<5; i++) {\n    \
  \    System.out.println(\"Executed new thread\");\n        Thread.sleep(500);\n\
  \    }\n}\n```\n当调用 `run()` 方法时，控制权转移到 `try` 块内部。在 `try` 块内部，执行了 `for` 循环。在这种情况下，`Thread.sleep(500)`\
  \ 方法会让正在运行的线程挂起。\n\n**第 20 到 23 行**\n```java\ncatch(InterruptedException e) {\n\
  \    System.out.println(\"New thread interrupted\");\n}\n```\n这些行包含了 `catch` 块的定义。只有当\
  \ `sleep()` 方法产生 `InterruptedException` 类型的异常时，该块才会执行。\n\n**第 24 行**\n`System.out.println(\"\
  New thread stopped\");`\n\n**第 26 行**\n`public static void main(String arg[ ])`\n\
  \n**第 28 行**\n`newthread obj1 = new newthread();`\n在这一行中，创建了 `newthread` 类的 `obj1`\
  \ 对象，并对 `newthread()` 构造函数进行了调用。\n\n**第 31 到 35 行**\n```java\ntry {\n    for(int\
  \ i=0; i<5; i++) {\n        System.out.println(\"Executed main thread\");\n    \
  \    Thread.sleep(1000);\n    }\n}\n```\n`for` 循环位于主线程下。在 `try` 块内部，`Thread.sleep(1000)`\
  \ 方法会让 for 循环的执行挂起 1000 毫秒。\n\n\n\n\n\n在多线程中，输出可能会因为各种因素（如优先级、机器上运行的任务、CPU 时间、睡眠时间等）而不同。\n\
  \n## 扩展 Thread 类\n\n如前所述，还有另一种创建新线程的方法。在这种方法中，你需要创建一个继承自 `Thread` 类的新类。你已经知道 `Thread`\
  \ 类是 Java 默认包 `java.lang` 的一部分，并且已经包含在每个 Java 文件中。`Thread` 类封装了对包的处理。`Thread` 类还包含可以用于管理程序中线程的方法。表\
  \ 8-1 给出了 `Thread` 类的一些方法的名称和描述。\n\n### 表 8-1 `Thread` 类的方法\n\n| 方法 | 描述 |\n| :---\
  \ | :--- |\n| `getName()` | 返回一个表示线程名称的字符串。 |\n| `setName()` | 用于给线程命名。 |\n| `getPriority()`\
  \ | 返回一个 1 到 10 之间的整数值，表示线程的优先级。最高优先级为 10，最低优先级为 1，普通优先级为 5。 |\n| `setPriority()`\
  \ | 用于设置线程的优先级。 |\n| `isAlive()` | 返回一个布尔值，指示线程是否正在运行。 |\n| `interrupt()` | 用于中断线程。\
  \ |\n| `join()` | 使线程等待另一个线程终止其进程。 |\n| `run()` | 用于定义线程执行的任务。该方法仅在 `start()` 方法执行后才会执行。\
  \ |\n| `sleep()` | 用于停止当前执行的线程一段时间。 |\n| `start()` | 通过调用其 `run()` 方法来启动线程的执行。 |\n\
  \n众所周知，要通过扩展 `Thread` 类来创建新线程，你需要创建一个继承 `Thread` 类的新类。创建继承 `Thread` 类的新类的语法如下：\n\
  \n```java\nclass classname extends Thread\n```\n\n创建类后，你需要创建该类的实例。此外，新创建的类应该重写 `Thread`\
  \ 类的 `run()` 方法。在这里，`run()` 方法被新线程的入口。你不能直接执行 `run()` 方法，因此你需要调用 `Thread` 类的 `start()`\
  \ 方法。\n\n### 示例 3\n\n下面的示例说明了通过扩展 `Thread` 类创建新线程的方法。该程序将创建一个新线程，并显示有关运行线程的信息。\n\
  \n```java\n//写一个程序来创建一个新线程\n1 class newthread extends Thread\n2 {\n3 newthread()\n\
  4 {\n5 super (\"New Thread\");\n6 System.out.println(\"Starting new thread: \" +this);\n\
  7 start();\n8 }\n9 public void run()\n10 {\n11 try\n12 {\n13 for(int i=0; i<5; i++)\n\
  14 {\n15 System.out.println(\"Executed new thread\");\n16 Thread.sleep(500);\n17\
  \ }\n18 }\n19 catch(InterruptedException e)\n20 {\n21 System.out.println(\"New thread\
  \ interrupted\");\n22 }\n23 System.out.println(\"New thread stopped\");\n24 }\n\
  25 public static void main(String arg[])\n26 {\n27 new newthread();\n28 try\n29\
  \ {\n30 for(int i=0; i<5; i++)\n31 {\n32 System.out.println(\"Executed main thread\"\
  );\n33 Thread.sleep(1000);\n34 }\n35 }\n36 catch(InterruptedException e)\n37 {\n\
  38 System.out.println(\"main thread interrupted\");\n39 }\n40 System.out.println(\"\
  Main thread stopped\");\n41 }\n42 }\n```\n\n#### 解析\n\n**第 5 行**\n`super (\"New\
  \ Thread\");`\n在此行中，`super()` 方法代表 `Thread` 类的构造函数。在参数列表中，字符串 `New Thread` 作为参数传递，并将作为新线程的名称。\n\
  \n该程序的工作方式与之前的程序相同。\n\n示例 3 的输出如图 8-3 所示。\n\n![C08SC003.tif](img/C08SC003_fmt.jpeg)\n\
  图 8-3 示例 3 的输出\n\n## 创建多个线程\n\n在本章的节节中，你只处理两个线程：主线程和新线程。在本节中，你将处理多个线程，并学习在程序中创建多个线程的方法。\n\
  \n### 示例 4\n\n下面的示例说明了创建多个线程的概念。该程序将创建三个新线程并在屏幕上显示一些信息。\n\n```java\n//写一个程序来创建三个新线程\n\
  1 class Multiple_Thread implements Runnable\n2 {\n3 String name;\n4 Thread obj;\n\
  5 Multiple_Thread(String n)\n6 {\n7 name = n;\n8 obj = new Thread(this, name);\n\
  9 obj.start();\n10 }\n11 public void run()\n12 {\n13 try\n14 {\n15 for(int i=5;\
  \ i>0; i--)\n16 {\n17 System.out.println(name + \" is executed\");\n18 Thread.sleep(1000);\n\
  19 }\n20 }\n21 catch(InterruptedException e)\n22 {\n23 System.out.println(name +\
  \ \" is interrupted\");\n24 }\n25 System.out.println(name + \" is stopped\");\n\
  26 }\n27 public static void main(String arg[])\n28 {\n29 Multiple_Thread first =\
  \ new Multiple_Thread(\"First\");\n30 Multiple_Thread second = new Multiple_Thread(\"\
  Second\");\n31 Multiple_Thread third = new Multiple_Thread(\"Third\");\n32 }\n```\n\
  \n#### 解析\n\n**第 29 行**\n`Multiple_Thread first = new Multiple_Thread(\"First\"\
  );`\n在此行中，`first` 被创建为 `Multiple_Thread` 类的实例。\n\n**第 32 行**\n`String current =\
  \ Thread.currentThread().getName();`\n在此行中，获取当前线程的名称并将其赋值给变量 `current`。\n\n示例 4\
  \ 的输出如图 8-4 所示。\n\n*(注：由于原文未提供图 8-4 的具体图片描述，此处保留占位符逻辑)*\n\n\n\n\n以下示例演示了 `isAlive()`\
  \ 和 `join()` 方法的使用。程序将创建多个线程，并对这些线程应用 `isAlive()` 和 `join()` 方法。它还会在屏幕上显示一些消息。\n\
  \n```java\n/* 写一个程序来创建多个线程并说明 isAlive( ) 和 join( ) 方法的工作原理 */\n\nclass isalive_and_join\
  \ implements Runnable {\n    String name;\n    Thread obj;\n\n    isalive_and_join(String\
  \ threadname) {\n        name = threadname;\n        obj = new Thread (this, name);\n\
  \        obj.start();\n    }\n\n    public void run( ) {\n        try {\n      \
  \      System.out.println(\"Thread “ +name+ \" is executed\");\n            Thread.sleep(1000);\n\
  \        } catch (InterruptedException e ) {\n            System.out.println(\"\
  Thread “ +name+ \" is interrupted\");\n        }\n        System.out.println(\"\
  Thread “ +name+ \" is stopped \" );\n    }\n\n    public static void main(String\
  \ arg[ ]) {\n        isalive_and_join thrd1 = new isalive_and_join(“First”);\n \
  \       isalive_and_join thrd2 = new isalive_and_join(“Second”);\n        System.out.println(\"\
  Checking the status of each thread:\");\n        System.out.println(\"Thread First:\
  \ “ +thrd1.obj.isAlive( ));\n        System.out.println(\"Thread Second: “+thrd2.obj.isAlive(\
  \ ));\n        try {\n            System.out.println(\"Applying the join( ) method\"\
  );\n            thrd1.obj.join( );\n            thrd2.obj.join( );\n        } catch(InterruptedException\
  \ e) {\n            System.out.println(\"Exception occurred in main\");\n      \
  \  }\n        System.out.println(\"Again checking the status of each thread:\");\n\
  \        System.out.println(\"Thread First: “ +thrd1.obj.isAlive( ));\n        System.out.println(\"\
  Thread Second: “+thrd2.obj.isAlive( ));\n        System.out.println(\"Main thread\
  \ stopped\");\n    }\n}\n```\n\n#### 解释\n\n#### 第 26 行和第 27 行\n```java\nisalive_and_join\
  \ thrd1 = new isalive_and_join(“First”);\nisalive_and_join thrd2 = new isalive_and_join(“Second”);\n\
  ```\n在这些行中，`thrd1` 和 `thrd2` 被创建为 `isalive_and_join` 类的对象，而 `First` 和 `Second` 将被赋值为两个新线程的名称。\n\
  \n#### 第 29 行\n```java\nSystem.out.println(\"Thread First: ” +thrd1.obj.isAlive(\
  \ ));\n```\n在这一行中，在名为 `First` 的第一个线程上调用了 `isAlive()` 方法。在这里，`isAlive()` 方法将返回 `true`，因为指定的线程正在运行。\n\
  \n第 30 行的工作原理与第 29 行相同。\n\n#### 第 31 行到第 36 行\n```java\ntry {\n    System.out.println(\"\
  Applying the join( ) method\");\n    thrd1.obj.join( );\n    thrd2.obj.join( );\n\
  }\n```\n这些行包含了 `try` 块的定义。在 `try` 块内部，在新线程 `First` 和 `Second` 上调用了 `join()` 方法。该方法将暂停执行，直到这些线程完成任务。\n\
  \n#### 第 42 行和第 43 行\n```java\nSystem.out.println(\"Thread First: ” +thrd1.obj.isAlive(\
  \ ));\nSystem.out.println(\"Thread Second: ”+thrd2.obj.isAlive( ));\n```\n在这些行中，将再次在两个新线程上调用\
  \ `isAlive()` 方法。\n\n示例 5 的输出如图 8-5 所示。\n\n![C08SC005.tif](img/C08SC005_fmt.jpeg)\n\
  \n图 8-5 示例 5 的输出\n\n### 设置线程优先级\n\n你已经学习过每当在程序创建新线程时，Java 环境都会赋予它一个优先级。线程的优先级决定了它何时被允许访问\
  \ CPU、处理器等资源。\n\n在 Java 中，优先级是一个从 1 到 10 的整数值。值 10 被视为最高优先级，1 被视为最低优先级，5 被视为普通优先级。普通优先级是默认优先级，在线程创建时分配给线程。优先级高的线程比优先级低的线程利用更多的\
  \ CPU 时间。\n\n你也可以通过 `Thread` 类的 `setPriority()` 方法根据你的需求设置线程的优先级。使用 `setPriority()`\
  \ 方法的语法如下：\n\n```java\nfinal void setPriority(int val)\n```\n\n在此语法中，整数变量 `val`\
  \ 为调用 `setPriority()` 方法的线程设置新优先级。你可以通过给出的两种方式使用整数变量 `val` 为线程分配优先级：\n\n1. 分配一个\
  \ 1 到 10 的整数值。\n2. 分配 `Thread` 类中的三个 final 变量之一。这些变量是 `MIN_PRIORITY`（等于 1）、`MAX_PRIORITY`（相当于\
  \ 10）和 `NORM_PRIORITY`（相当于 5）。\n\n你还可以使用 `Thread` 类的 `setPriority()` 方法设置线程的优先级。使用\
  \ `setPriority()` 方法的语法如下：\n\n```java\nfinal void setPriority(int val)\n```\n\n\
  在此语法中，整数变量 `val` 为调用 `setPriority()` 方法的线程设置新优先级。你可以通过给出的两种方式使用整数变量 `val` 为线程分配优先级：\n\
  \n1. 分配一个 1 到 10 的整数值。\n2. 分配 `Thread` 类中的三个 final 变量之一。这些变量是 `MIN_PRIORITY`（等于\
  \ 1）、`MAX_PRIORITY`（相当于 10）和 `NORM_PRIORITY`（相当于 5）。\n\n\n\n这些行包含了 `run(()` 方法的定义。每当对\
  \ `Thread` 类的对象调用 `start(()` 方法时，该对象反过来会调用 `start(()` 方法。在方法体内部，将检查布尔类型变量 `status`\
  \ 的值。如果该值结果为 `true`，将执行下一条语句。否则，`run(()` 方法将终止。\n\n第 26 到 30 行\n```java\npublic\
  \ void stop( )\n{\n    status = false;\n    System.out.println(obj.getName( ) +\
  \ “ is stopped”);\n}\n```\n\n这些行包含了 `stop(()` 方法的定义。在方法体内部，将值 `false` 赋值给布尔类型变量\
  \ `status`。\n\n第 33 行\n```java\npriority thrd1 = new priority(3, “First”);\n```\n\
  在这一行中，`thrd1` 被创建为 `priority` 类的对象。在这里，将调用 `priority(()` 构造函数，并将值 `3` 和 `First`\
  \ 作为参数传递给它。这些值随后在构造函数定义中分别赋值给变量 `p` 和 `n`。结果是线程的优先级（即 `First`）现在被设置为 `3`。\n\n第 34\
  \ 行的工作原理与第 33 行相似。\n\n第 35 行\n```java\nString current = Thread.currentThread( ).getName(\
  \ );\n```\n在这一行中，`Thread` 类的 `currentThread(()` 方法返回当前对象的引用，`getName(()` 方法返回当前线程的名字\
  \ `(main)`，它被赋值给 `String` 类型。\n\n第 36 行\n```java\nthrd1.start( );\n```\n在这一行中，将调用\
  \ `priority` 类的 `start(()` 方法。因此，控制权将转移到方法定义并执行方法体。结果是，这一行中线程 `First` 将开始运行。\n\n\
  第 37 行的工作原理与第 36 行相似。\n\n第 40 行\n```java\nThread.sleep(2000);\n```\n在这一行中，调用了 `Thread`\
  \ 类的 `sleep(()` 方法使主线程挂起 `2000` 毫秒。\n\n第 46 行\n```java\nthrd1.stop( );\n```\n在这一行中，调用了\
  \ `priority` 类的 `stop(()` 方法。现在，控制权将转移到方法定义并执行方法体。因此，这一行中线程 `First` 的执行将停止。\n\n\
