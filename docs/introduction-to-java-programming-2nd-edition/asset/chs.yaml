  \ 10。\n\n### 自测测试答案\n1. multithreading, 2. process-based, 3. runnable, 4. 5, 5.\
  \ main, 6. `currentThread()`, 7. `Thread`, 8. `sleep()`, 9. `isAlive()`, 10. `MAX_PRIORITY`,\
  \ `MIN_PRIORITY`, `NORM_PRIORITY`, 11. T, 12. F, 13. T, 14. F, 15. F\n\n## 第 9 章\n\
  \n![1850.jpg](img/1850.jpg) ![1848.jpg](img/1848.jpg)\n\n## 字符串处理\n\n### 学习目标\n\
  完成本章后，你能够：\n* 理解 `String` 类\n* 理解用于比较字符串的方法\n* 理解 `toString()` 方法\n* 理解用于提取字符的方法\n\
  * 理解用于修改字符串的方法\n* 理解用于更改字符大小的方法\n* 理解用于搜索字符串的方法\n* 理解 `valueOf()` 方法的概念\n* 理解 `StringBuffer`\
  \ 类\n* 理解 `StringBuffer` 类的方法\n\n### 简介\n在大多数编程语言中，字符串被实现为字符数组。但 Java 将字符串实现为 `String`\
  \ 类的一个对象。`String` 类是 Java 的一个内置类，定义在 `java.lang` 包中。`String` 类被声明为 `final`，这意味着它不能被任何其他类继承。在\
  \ Java 中，字符串被视为一个值，而不是像大多数其他编程语言那样被视为字符数组。`String` 类还定义了某些方法，可以轻松地处理或操作字符串。\n\n\
  当创建一个 `String` 类的对象时，该对象的字符串值就不能改变。这表明 `String` 类的对象是不可变的（immutable）。每当现有的 `String`\
  \ 类对象发生变化时，就会创建一个包含修改后的字符串值的新对象。在这种情况下，原始对象的字符串值保持不变。\n\nJava 还提供了另外两个类：`StringBuffer`\
  \ 和 `StringBuilder`。当你希望字符串可以被修改但不是不可变的时，就会使用这些类。与 `String` 类一样，这些类也被声明为 `final`\
  \ 类并定义在 `java.lang` 包中。\n\n在本章中，你将详细学习 `String` 和 `StringBuffer` 类。\n\n### 字符串\n\
  `String` 是字符序列，在 Java 编程语言中被处理为 `String` 类的对象。你可以通过接下来将讨论的字符串字面量和拼接来创建和操作字符串对象。\n\
  \n#### 字符串字面量\n你可以使用字符串字面量创建 `String` 类的对象。字符串字面量是封装在双引号 “ ” 内的字符组。字符串字面量被视为单一值。你可以通过以下方式使用字符串字面量创建\
  \ `String` 类的对象：\n\n```java\nString obj = \"Smith\";\n```\n\n在这个示例中，创建了 `String`\
  \ 类的 `obj` 对象并初始化为字符串 Smith。\n\n此语句等于以下语句：\n```java\nchar arr[] = {'S', 'm', 'i',\
  \ 't', 'h'};\nString obj = new String(arr);\n```\n\n#### 使用 + 运算符进行字符串拼接\n在 Java\
  \ 中，`+` 运算符用于连接两个字符串并产生单个字符串。\n\n例如：\n```java\nint val = 500;\nString obj = \"I\
  \ earn \" + val + \" dollars daily\";\n```\n\n在这个示例中，`I earn` 字符串通过 `+` 运算符与变量 `val`\
  \ 的整数值 `500` 拼接在一起。在这里，变量 `val` 的整数值被视为字符串值。接下来，`I earn 500` 字符串与 `dollars daily`\
  \ 字符串拼接，产生 `I earn 500 dollars daily` 字符串。\n\n#### String 类构造函数\n`String` 类提供了不同类型的构造函数，可以在创建\
  \ `String` 对象时使用。\n\n`String()`\n`String()` 构造函数用于创建 `String` 类的对象，但不分配任何字符串值。也就是说，`String()`\
  \ 构造函数用于创建一个空的 `String` 对象。这是 `String` 类的默认构造函数。使用 `String()` 的语法如下：\n\n```java\n\
  String obj_name = new String();\n```\n在此语法中，`obj_name` 对象没有字符串值。\n\n`String(char\
  \ arr[])`\n`String(char arr[])` 用于当你想要为 `String` 类对象分配初始值时。这是最常用的构造函数。你可以按照下面的示例使用\
  \ `String(char arr[])` 构造函数：\n\n```java\nchar arr[] = {'S', 'm', 'i', 't', 'h'};\n\
  String obj = new String(arr);\n```\n在这个示例中，数组 `arr` 作为参数传递给构造函数，“Smith\" 字符串被赋值给\
  \ `obj` 对象。\n\n`String(char arr[], int start, int length)`\n`String(char arr[],\
  \ int start, int length)` 构造函数用于当你想要为数组子数组分配字符串时，作为参数传递。在该构造函数中，整数变量 `start` 指定子数组的开始，`length`\
  \ 指定子数组中包含的字符数量。你可以按照下面的示例使用 `String(char arr[], int start, int length)` 构造函数：\n\
  \n```java\nchar arr[] = {'S', 'm', 'i', 't', 'h'};\nString obj = new String(arr,\
  \ 1, 3);\n```\n在这个示例中，`mit` 字符串被赋值给 `String` 类的 `obj` 对象，其中 `m` 位于第 1 个位置，`t` 位于第\
  \ 3 个位置。\n\n`String(String obj)`\n`String(String obj)` 构造函数用于当你想要将 `obj` 对象中相同的字符串值赋值一个新的\
  \ `String` 对象时。你可以按照下面的示例使用 `String(String obj)` 构造函数：\n\n```java\nchar arr[] =\
  \ {'S', 'm', 'i', 't', 'h'};\nString obj = new String(arr);\nString obj1 = new String(obj);\n\
  ```\n在这个示例中，`obj` 对象包含 Smith 字符串。在创建 `obj1` 对象时，`obj` 对象作为参数传递给构造函数。结果是 `obj` 对象中相同的\
  \ Smith 字符串被赋值给新的 `obj1` 对象。\n\n`String(byte asciiarr[])`\n\n\n\n\n`String(byte\
  \ asciiarr[ ])` 构造函数用于你想将一个包含 ASCII 字符的字节数组传递给 `String` 类的构造函数时。在这种情况下，ASCII 字符将使用\
  \ ASCII 字符集解码为它们的原始值。接下来，一个新的字符串对象将使用传递给构造函数的数组解码后获得的字符串进行初始化。你可以像下面的示例一样使用 `String(byte\
  \ asciiarr[ ])` 构造函数：\n\n```java\nbyte arr[ ] = {97, 98, 99, 100, 101};\nString\
  \ obj = new String(arr);\n```\n\n在这个示例中，ASCII 值 `97` 到 `101` 分别被解码为从 `a` 到 `e` 的原始值值。数组\
  \ `arr[ ]` 包含 `abcde` 字符序列。接下来，数组 `arr[ ]` 作为参数传递给 `String()` 构造函数，`String` 类的 `obj`\
  \ 对象将用相同的 `abcde` 字符串初始化。\n\n### String(byte asciiarr[ ], int start, int length)\n\
  \n`String(byte asciiarr[ ], int start, int length)` 构造函数用于你想将字符子数组分配给 `String` 类的新对象时。`start`\
  \ 和 `length` 变量的用法与 `String(char arr[ ], int start, int length)` 构造函数的解释相同。你可以像下面的示例一样使用\
  \ `String(byte asciiarr[ ], int start, int length)` 构造函数：\n\n```java\nbyte arr[\
  \ ] = {97, 98, 99, 100, 101};\nString obj = new String(arr, 1, 3);\n```\n\n在这个示例中，`String`\
  \ 类的 `obj` 对象用 `bcd` 字符串初始化，其中 `b(98)` 位于第 1 位置，`d(100)` 位于第 3 位置。\n\n### 用于字符串比较的方法\n\
  \n在 Java 中，`String` 类定义了某些方法来比较两个字符串的内容。接下来将讨论这些方法。\n\n#### equals( )\n\n`String`\
  \ 类的 `equals()` 方法用于检查两个字符串是否相等。`equals()` 方法的语法如下：\n\n```java\nboolean equals(String\
  \ string)\n```\n\n在此语法中，`string` 代表 `String` 类的一个对象。该方法的返回类型为 `boolean`。如果 `string`\
  \ 对象包含相同的字符序列，且顺序与调用对象表示的相同，则它将返回 `true`。否则，它将返回 `false`。\n\n使用 `equals()` 方法进行的比较是区分大小写的。\n\
  \n例如：\n\n```java\nString s1 = “smith”;\nString s2 = “Smith”;\nboolean val = s1.equals(s2);\n\
  ```\n\n在这个示例中，`s1` 对象用 `smith` 字符串初始化，`s2` 对象用 `Smith` 字符串初始化。在这里，`equals()` 方法返回\
  \ `false`，因为两个字符串的第一个字母大小不同。\n\n#### equalsIgnoreCase( )\n\n在上一节中，你学到帮助通过 `equals()`\
  \ 方法进行的比较是区分大小写的。但有时，你需要不考虑大小差异来比较两个字符串。在这种情况下，你可以使用 `String` 类的 `equalsIgnoreCase()`\
  \ 方法。在比较两个字符串时，`equalsIgnoreCase()` 方法会将大写字母 (A-Z) 和小写字母 (a-z) 视为相同。使用 `equalsIgnoreCase()`\
  \ 方法的语法如下：\n\n```java\nboolean equalsIgnoreCase(String obj)\n```\n\n在此语法中，`obj`\
  \ 代表 `String` 类的一个对象。该方法的返回类型为 `boolean`。如果 `string` 对象包含相同的字符序列且顺序与调用对象表示的相同，则它将返回\
  \ `true`。否则，它将返回 `false`。\n\n例如：\n\n```java\nString s1 = “smith”;\nString s2 = “Smith”;\n\
  boolean val = s1.equalsIgnoreCase(s2);\n```\n\n在这个示例中，`s1` 和 `s2` 对象分别用 `smith`\
  \ 和 `Smith` 字符串初始化。在这里，`equalsIgnoreCase()` 方法返回 `true`，因为两个字符串包含相同的字符序列且顺序也相同。\n\
  \n### 示例 1\n\n下面的示例说明了 `String` 类 `equals()` 和 `equalsIgnoreCase()` 方法的使用。程序将使用\
  \ `equals()` 和 `equalsIgnoreCase()` 方法比较字符串，并在屏幕上显示结果值。\n\n```java\n//写一个程序来比较字符串\n\
  1 class stringcomparedemo\n{\n    public static void main(String arg[ ])\n    {\n\
  \        boolean result;\n        String obj1 = “Your name”;\n        String obj2\
  \ = “Jack”;\n        String obj3 = “YOUR NAME”;\n        String obj4 = “Smith”;\n\
  \        System.out.println(“The strings ” +obj1+ “ and ” +obj3+ “ are equal: ”\
  \ +obj1.equals(obj3));\n        System.out.println(“The strings ” +obj2+ “ and ”\
  \ +obj4+ “ are equal: ” +obj2.equals(obj4));\n        System.out.println(“The strings\
  \ ” +obj1+ “ and ” +obj3+ “ are equal: ” +obj1.equalsIgnoreCase(obj3));\n    }\n\
  }\n```\n\n#### 解释\n\n**第 6 行**\n`String obj1 = “Your name”;`\n在此行中，`obj1` 用 `Your\
  \ name` 字符串初始化。\n\n**第 10 行**\n`System.out.println(“The strings ” +obj1+ “ and ”\
  \ +obj3+ “ are equal: ” +obj1.equals(obj3));`\n在此行中，`equals()` 方法用于比较 `Your name`\
  \ 和 `YOUR NAME` 字符串。\n\n**第 11 行**\n`System.out.println(“The strings ” +obj2+ “\
  \ and ” +obj4+ “ are equal: ” +obj2.equals(obj4));`\n在此行中，`equals()` 方法用于比较 `Jack`\
  \ 和 `Smith` 字符串。\n\n**第 12 行**\n`System.out.println(“The strings ” +obj1+ “ and\
  \ ” +obj3+ “ are equal: ” +obj1.equalsIgnoreCase(obj3));`\n在此行中，`equalsIgnoreCase()`\
  \ 方法用于比较 `Your name` 和 `YOUR NAME` 字符串。\n\n#### compareTo( )\n\n`compareTo()` 方法用于你想对字符串列表进行排序。此方法比较两个字符串：作为参数传递方法的字符串和调用字符串，并检查传递参数的字符串是否大于、小于或等于另一个字符串。使用\
  \ `compareTo()` 方法的语法如下：\n\n```java\nint compareTo(String obj)\n```\n\n在此语法中，`obj`\
  \ 被声明为 `String` 类的对象。在这里，`obj` 字符串与调用对象的字符串进行比较。`compareTo()` 方法返回以下整数值：\n\n1. 如果方法返回的整数小于零，意味着调用对象的字符串小于\
  \ `obj`（作为参数传递给方法）。\n2. 如果方法返回的整数大于零，意味着调用对象的字符串大于 `obj`（作为参数传递给方法）。\n3. 如果方法返回零，意味着两个字符串，即调用对象的字符串以及作为参数传递的字符串相等。\n\
  \n例如：\n\n```java\nint result;\nString s1 = “Williams”;\nString s2 = “John”;\nresult\
  \ = s1.compareTo(s2);\n```\n\n在这个示例中，使用 `compareTo()` 方法比较 `s1` 对象的 `Williams` 字符串与\
  \ `s2` 对象的 `John` 字符串。此方法返回一个大于零的值，因为调用的 `Williams` 字符串大于 `John` 字符串。\n\n**注意**：`compareTo()`\
  \ 方法像 `equals()` 方法一样区分大小写。\n\n\n\n以下示例说明了 `==` 运算符的使用。该程序将使用 `==` 运算符比较 `String`\
  \ 类对象的引用，并在屏幕上显示结果值。\n\n```java\n//Write a program to compare the references of\
  \ the objects of the String class\nclass equaldemo\n{\n    public static void main(String\
  \ arg[ ])\n    {\n        String s1 = “Smith”;\n        String s2 = “Smith”;\n \
  \       String s3 = new String(s1);\n        boolean val;\n        val = (s1==s2);\n\
  \        System.out.println(“The objects s1 and s2 refer to the same instance in\
  \ memory: ” +val);\n        val = (s1==s3);\n        System.out.println(“The objects\
  \ s1 and s3 refer to the same instance in memory: ” +val);\n    }\n}\n```\n\n####\
  \ 解析\n\n#### 第 5 行\n`String s1 = “Smith”;`\n在这一行中，`s1` 被创建为 `String` 类的一个实例，并将 `Smith`\
  \ 字符串作为初始值赋值给它。\n\n#### 第 7 行\n`String s3 = new String(s1);`\n在这一行中，`s3` 被创建为 `String`\
  \ 类的一个实例，并将 `s1` 对象的 `Smith` 字符串作为初始值赋值给它。\n\n#### 第 9 行\n`val = (s1==s2);`\n在这一行中，`==`\
  \ 运算符比较 `String` 类中 `s1` 和 `s2` 对象的引用。如果这些对象指向内存中的同一个实例，运算符将返回布尔值 `true`。否则，它将返回布尔值\
  \ `false`。接下来，结果将被赋值给布尔类型变量 `val`。\n\n示例 2 的输出如图 9-2 所示。\n\n![C09SC002.tif](img/C09SC002_fmt.jpeg)\n\
  \n图 9-2 示例 2 的输出\n\n### regionMatches( )\n\n`String`  `regionMatches( )` 方法用于将一个字符串的特定区域与另一个字符串的特定区域进行匹配。使用\
  \ `regionMatches( )` 方法的语法如下：\n\n`boolean regionMatches(int start, String str, int\
  \ startstr, int number)`\n\n在此语法中，整数变量 `start` 代表调用字符串对象的区域开始的索引。`String` 类的 `str`\
  \ 对象表示第二个字符串。整数变量 `startstr` 代表第二个字符串区域开始的索引。该区域将与调用字符串对象的区域进行比较。整数变量 `number` 代表正在被比较的区域或子字符串的长度。如果在调用字符串对象的特定区域与传递的字符串对象之间发现了匹配项，则\
  \ `regionMatches( )` 方法返回 `true`。否则，它返回 `false`。\n\n使用 `regionMatches( )` 方法进行的比较是区分大小写的。`regionMatches(\
  \ )` 方法还有另一个重载版本，在该版本中，比较是不区分大小写的。使用 `regionMatches( )` 方法重载版本的语法如下：\n\n`boolean\
  \ regionMatches(boolean ignoreCase, int start, String str, int startstr, int number)`\n\
  \n在此语法中，如果布尔变量 `ignoreCase` 的值设置为 `true`，则将无忽略子字符串的大小写进行比较。否则，比较将区分大小写。\n\n### startsWith(\
  \ )\n\n`startsWith( )` 方法用于比较调用字符串的字符序列是否与作为方法参数传递的字符串的字符序列相同。使用 `startsWith( )`\
  \ 方法的语法如下：\n\n`boolean startsWith(String str)`\n\n在此语法中，`str` 对象表示在调用对象内部匹配的字符串。如果找到匹配项，则方法返回\
  \ `true`。否则，它返回 `false`。\n\n例如：\n\n```java\nString s1 = “Smith”;\nString s2 = “Smi”;\n\
  s1.startsWith(s2);\n```\n在此示例中，`startsWith( )` 方法返回 `true`，因为调用 `s1` 对象的 `Smith`\
  \ 字符串与 `s2` 对象的 `Smi` 字符串具有相同的字符序列。\n\n`startsWith( )` 方法另一个重载版本如下：\n\n`boolean\
  \ startsWith(String str, int start)`\n\n在此语法中，`str` 对象表示与调用对象匹配的字符串。此外，整数变量 `start`\
  \ 代表调用字符串内部的索引，从该索引处开始比较。\n\n例如：\n\n```java\nString s1 = “Smith”;\nString s2 = “ith”;\n\
  s1.startsWith(s2, 2);\n```\n在此示例中，比较从调用 `Smith` 字符串的第二个元素 `i` 开始。在这里，方法返回 `true`。\n\
  \n### endsWith( )\n\n`endsWith( )` 方法用于检查调用字符串的字符序列是否以作为方法参数传递的字符串的相同字符序列结尾。如果找到匹配项，它返回布尔值\
  \ `true`。否则，它返回 `false`。使用 `endsWith( )` 方法的语法如下：\n\n`boolean endsWith(String str)`\n\
  \n在此语法中，`str` 对象表示要在调用对象内部匹配的字符串。如果找到匹配项，则方法返回 `true`。否则，它返回 `false`。\n\n例如：\n\n\
  ```java\nString s1 = “Smith”;\nString s2 = “th”;\ns1.endsWith(s2);\n```\n在此示例中，由于\
  \ `s1` 对象的 `Smith` 字符串以 `s2` 对象的 `th` 字符串相同的字符序列结尾，该方法返回 `true`。\n\n### toString(\
  \ )\n\n`toString( )` 方法用于将对象表示为字符串。它是定义在 `Object` 类中的。但你可以根据需要重载 `toString( )` 方法。使用\
  \ `toString( )` 方法的语法如下：\n\n`String toString()`\n\n### 示例 3\n\n以下示例说明了 `toString(\
  \ )` 方法的使用。该程序将计算整数的平方并重载 `toString( )` 方法将结果显示在屏幕上。\n\n```java\n//Write a program\
  \ to square a number\nclass Square\n{\n    int x, result;\n    Square(int num)\n\
  \    {\n        x = num;\n    }\n    void sqr( )\n    {\n        result = x * x;\n\
  \    }\n    public String toString( )\n    {\n        return “the square of ”+x+“\
  \ is ” +result;\n    }\n    public static void main(String arg[])\n    {\n     \
  \   String str;\n        Square obj = new Square(10);\n        obj.sqr( );\n   \
  \     str = “After calculation, ” + obj;\n        System.out.println(str);\n   \
  \ }\n}\n```\n\n#### 解析\n\n### 第 12 到 15 行\n```java\npublic String toString( )\n\
  {\n    return “the square of ”+x+“ is ” +result;\n}\n```\n在这些行中，`Object` 类的 `toString(\
  \ )` 方法被重载了。每当调用此方法时，它都会通过 `return` 关键字返回指定的字符串。\n\n#### 第 19 行\n`Square obj = new\
  \ Square(10);`\n在这一行中，`obj` 被声明为 `Square` 类的一个对象，并将整数 `10` 作为参数传递给 `Square()` 构造函数。\n\
  \n#### 第 21 行\n`str = “After calculation, ” + obj;`\n在这一行中，`Square` 类的 `obj` 对象用于拼接表达式。这隐式地调用了重载的\
  \ `toString( )` 方法。拼接后，结果字符串被赋值给 `String` 类的 `str` 对象。\n\n### 字符的方法\n\n众所字符串是字符集合。你可以使用\
  \ `String` 类提供的方法从 `String` 对象中提取这些字符。接下来讨论这些方法。\n\n### charAt( )\n\n`String`  `charAt(\
  \ )` 方法用于从字符串中提取单个字符。使用 `charAt( )` 方法的语法如下：\n\n`char charAt(int position)`\n\n\n\
  \n\n在此语法中，整数变量 `position` 被视为你想要提取的字符的索引。`position` 变量的值不应为负数，且必须位于 0（包含）到字符串长度减\
  \ 1 之间。否则，该方法将返回一个空字符串。\n\n例如：\n\n```\nString str = “Smith”;\nchar result = str.charAt(2);\n\
  ```\n\n在例例中，首先方法 `charAt()` 返回字符 `i`，然后将结果字符 `i` 赋值给字符变量 `result`。\n\n### getChars()\n\
  \n`charAt()` 方法用于从字符串中提取单一个的字符。但如果你想从字符串中提取多个一个的字符，可以使用 `String` 类的 `getChars()`\
  \ 方法。使用 `getChars()` 方法的语法如下：\n\n```\nvoid getChars(int start, int end, char dest[\
  \ ], int deststart)\n```\n\n在此语法中，整数变量 `start` 指定了要从调用字符串中提取的子字符串的起始。整数变量 `end`\
  \ 指定了子字符串的结束。包含从 `start` 到 `end-1` 字符的子字符串存储在字符类型数组 `dest[]` 中。整数变量 `deststart`\
  \ 包含一个表示数组 `dest[]` 起偏移量的整数值。\n\n**注意**\n\n字符类型数组的大小应该足够大以容纳子字符串的字符数量。\n\n### 示例\
  \ 4\n\n下面的示例说明了 `String` 类 `getChars()` 方法的使用。以下程序将使用 `getChars()` 方法从字符串中提取指定的字符并将其显示在屏幕上。\n\
  \n```java\n//写一个程序从字符串中提取字符\nclass getCharsdemo {\n    public static void main(String\
  \ arg[]) {\n        String str = “Smith has already completed his graduation”;\n\
  \        int startindex = 6;\n        int endindex = 17;\n        int size = endindex-startindex;\n\
  \        char arr[ ] = new char[size];\n        str.getChars(startindex, endindex,\
  \ arr, 0);\n        System.out.println(arr);\n    }\n}\n```\n\n#### 解析\n\n**第 10\
  \ 行**\n`str.getChars(startindex, endindex, arr, 0);`\n\n在这一行中，将对 `getChars()` 方法的调用，使用包含字符串\
  \ `Smith has already completed his graduation` 的字符串对象 `str`。该方法将从字符串 `str` 的第 7\
  \ 个字符 `h`（包含）到第 17 个字符 `y`（包含）开始提取字符。现在，结果子字符串已经存储在字符数组 `arr` 中。\n\n**第 12 行**\n\
  `System.out.println(arr);`\n\n这一行将在屏幕上显示以下内容：\n\n`has already`\n\n示例 4 的输出如图 9-4\
  \ 所示。\n\n![C09SC004.tif](img/C09SC004_fmt.jpeg)\n\n图 9-4 示例 4 的输出\n\n### 修改字符串的方法\n\
  \n在 Java 中，所有的字符串都是不可变的。如果你对字符串进行更改，修改后的字符串将存储在一个新对象中，而不是在 `String` 类的同一个对象中。`String`\
  \ 类提供了某些方法来修改字符串并创建修改后字符串的新副本。这些方法如下所示。\n\n#### substring()\n\n`substring()` 方法用于提取字符串的特定部分或子字符串。使用\
  \ `substring()` 方法的语法如下：\n\n```\nString substring(int start)\n```\n\n在此语法中，整数变量\
  \ `start` 代表调用字符串中指定字符的索引，子字符串从此处开始。该方法返回一个从索引开始到调用字符串结束的字符串。\n\n例如：\n\n```java\n\
  String str = “How are you?”;\nString result = str.substring(4);\nSystem.out.println(result);\n\
  ```\n\n在例例中，对 `String` 类的 `str` 对象调用了 `substring()` 方法。整数值 `4` 被参数传递，它指定子字符串从调用\
  \ `str` 字符串的第 5 个字符开始，并包含 `str` 字符串的所有剩余字符（直到末尾）。该示例产生以下输出：\n\n`are you?`\n\n`substring()`\
  \ 方法也以另一种形式使用，如下所示：\n\n```\nString substring(int start, end)\n```\n\n在这里，整数变量 `start`\
  \ 代表子字符串的起始索引，整数变量 `end` 代表子字符串的结束索引。在 `substring()` 方法的这种形式中，结束索引指定的字符被排除在结果子字符串之外。\n\
  \n例如：\n\n```java\nString str = “How are you?”;\nString result = str.substring(0,\
  \ 6);\nSystem.out.println(result);\n```\n\n在例例中，子字符串从调用 `str` 字符串对象的第 0 位置的字符 (H)\
  \ 开始到第 5 位置的字符 (r)。现在，结果子字符串 `How ar` 被赋值给 `result` 字符串对象。\n\n#### concat()\n\n\
  你已经知道 `+` 运算符用于连接操作。`String` 类的 `concat()` 方法用于连接作为参数传递给该方法的调用字符串。使用 `concat()`\
  \ 方法的语法如下：\n\n```\nString concat(String str)\n```\n\n在此语法中，`str` 指定了要与调用字符串连接的字符串。\n\
  \n例如：\n\n```java\nString s1 = “How are you?”;\nString s2 = “ am fine”;\nString result\
  \ = s1.concat(s2);\n```\n\n在例例中，对 `String` 类的 `str` 对象调用了 `substring()` 方法。整数值 `4`\
  \ 作为参数传递，它指定子字符串从调用 `str` 字符串的第 5 个字符开始，并包含 `str` 字符串的所有剩余字符（直到末尾）。该示例产生以下输出：\n\n\
  `are you?`\n\n（注：此处原文逻辑似乎存在错乱或重复，已根据原文结构进行对应翻译）\n\n**注意**\n\n`concat()` 方法总是将作为参数传递给它的字符串，附加到调用字符串的末尾。\n\
  \n#### replace()\n\n`String` 类的 `replace()` 方法用于将字符串中的所有特定字符替换为另一个字符。使用 `replace()`\
  \ 方法的语法如下：\n\n```\nString replace(char exist, char replacement)\n```\n\n在此语法中，字符变量\
  \ `exist` 指定了要替换为 `replacement` 所代表的字符。\n\n例如：\n\n```java\nString s1 = “Good Morning”;\n\
  String result = s1.replace('o’, ‘w’);\n```\n\n在例例中，`s1` 字符串中所有的 `o` 都被替换为 `w`。替换后，结果字符串\
  \ `Gwwd Mning` 被赋值给结果对象。\n\n`replace()` 方法也以另一种形式使用，即将字符序列替换为另一个字符序列。这种形式的 `replace()`\
  \ 方法的语法如下：\n\n```\nString replace(CharSequence exist, CharSequence replacement)\n\
  ```\n\n例如：\n\n```java\nString s1 = “What are you doing?”;\nString result = s1.replace(“doing”,\
  \ “eating”);\n```\n\n在例例中，调用字符串中的字符序列 `doing` 被替换为字符序列 `eating`。结果，字符串将是 `What are\
  \ you eating`。\n\n#### trim()\n\n`trim()` 方法用于从调用字符串中移除前后空格。在移除空格后，调用字符串的副本被赋值给\
  \ `String` 类的对象。使用 `trim()` 方法的语法如下：\n\n```\nString trim()\n```\n\n例如：\n\n```java\n\
  String s1 = “ How are you? ${(trim();\n```\n\n在例例中，`trim()` 方法移除调用 `How are you?`\
  \ 字符串的前后空格。在移除所有空格后，结果字符串 `How are you?` 被赋值给 `s1` 字符串对象。\n\n\n\n\n\n在本示例中，`toLowerCase()`\
  \ 方法将调用者 `John Smith` 字符串中的所有大写字母（J 和 S）转换为小写字母（j 和 s）。现在，生成的 `john smith` 字符串被赋值给\
  \ `s1` 字符串对象。\n\n### toUpperCase()\n\n`toUpperCase()` 方法用于将调用字符串的所有小写字母转换为大写字母。使用\
  \ `toUpperCase()` 方法的语法如下：\n\n```java\nString toUpperCase()\n```\n\n例如：\n\n```java\n\
  String s1 = “John Smith”.toUpperCase();\n```\n\n在本示例中，`toUpperCase()` 方法将调用者 `John\
  \ Smith` 字符串中的所有小写字母转换为大写。现在，生成的 `JOHN SMITH` 字符串被赋值给 `s1` 字符串对象。\n\n### 用于搜索字符串的方法\n\
  \n`String` 类提供了两个方法来在另一个字符串中搜索字符序列。这些方法如下：\n\n#### indexOf()\n\n`indexOf()` 方法用于在调用字符串中搜索字符或子字符串的第一次出现，并返回找到匹配的索引位置。`indexOf()`\
  \ 方法可以用以下两种方式使用：\n\n要搜索字符的第一次出现，可以使用以下方式使用 `indexOf()` 方法：\n\n```java\nint indexOf(char\
  \ ch)\n```\n\n在此语法中，`indexOf()` 方法搜索字符 `ch` 的第一次出现。\n\n**注意**\n你也可以在 `indexOf()`\
  \ 方法的参数列表中用 `int` 类型代替 `char` 类型。\n\n要搜索子字符串或字符序列的第一次出现，可以使用以下方式使用 `indexOf()` 方法：\n\
  \n```java\nint indexOf(String str)\n```\n\n在此语法中，`indexOf()` 方法搜索由 `str` 字符串对象表示的子字符串的第一次出现。\n\
  \n在 `indexOf()` 方法中，你还可以指定搜索开始的起始点，如下语法所示：\n\n```java\nint indexOf(String str, int\
  \ start)\nint indexOf(char ch, int start)\n```\n\n在这些语法中，整数变量 `start` 指定了在调用字符串中搜索的起始点。\n\
  \n#### lastIndexOf()\n\n`lastIndexOf()` 方法的工作原理与 `indexOf()` 方法相同，不同于 `lastIndexOf()`\
  \ 方法搜索指定为搜索项目的字符或字符序列的最后一次出现。`lastIndexOf()` 方法以如下所示的不同形式使用：\n\n```java\nint lastIndexOf(char\
  \ ch)\nint lastIndexOf(String str)\nint lastIndexOf(String str, int start)\nint\
  \ lastIndexOf(char ch, int start)\n```\n\n#### Example 5\n\n以下示例演示了 `String` 类中\
  \ `indexOf()` 和 `lastIndexOf()` 方法的使用。程序将使用 `indexOf()` 和 `lastIndexOf()` 方法的不同形式来查找字符以及子字符串的第一次和最后一次出现。程序还将显示调用字符串中找到匹配的索引位置。\n\
  \n```java\n//写一个程序来查找字符和子字符串的第一次和最后一次出现\n1 class searchdemo\n2 {\n3 public static\
  \ void main(String arg[ ])\n4 {\n5  int index;\n6 String s1 = “This is the demo\
  \ of the methods of the String \n7 class that are used for searching strings”;\n\
  8 System.out.println(“--------------------------------------”);\n9  System.out.println(“indexof(char\
  \ ch) and lastIndexOf (char ch)”\n10 index = s1.indexOf(‘d’);\n11 System.out.println(“The\
  \ first occurrence is at: ” +index);\n12 index = s1.lastIndexOf(‘d’);\n13 System.out.println(“The\
  \ last occurrence is at: ” +index);\n14 System.out.println(“--------------------------------------”);\n\
  15 System.out.println(“indexof(String str) and lastIndexOf (String str)”\n16  index\
  \ = s1.indexOf(“the”);\n17 System.out.println(“The first occurrence is at: ” +index);\n\
  18 index = s1.lastIndexOf(“the”);\n19 System.out.println(“The last occurrence is\
  \ at: ” +index);\n20 System.out.println(“--------------------------------------”);\n\
  21 System.out.println(“indexof(String str, int start) and lastIndexOf(String str,\
  \ int start)”\n22 index = s1.indexOf(‘d’, 15);\n23 System.out.println(“The first\
  \ occurrence is at: ” +index);\n24 index = s1.lastIndexOf(“the”, 10);\n25 System.out.println(“The\
  \ last occurrence is at: ” +index);\n26 }\n27 }\n```\n\n#### Explanation\n\n**第\
  \ 10 行**\n`index = s1.indexOf(‘d’);`\n在这一行中，`String` 类的 `indexOf()` 方法将在 `s1` 字符串对象的调用字符串中搜索字符\
  \ `d` 的第一次出现。在这种情况下，方法将在索引位置 `12` 处找到字符 `d` 的第一次出现。接下来，方法将返回 `12` 作为结果值并将其赋值给变量\
  \ `index`。\n\n**第 12 行**\n`index = s1.lastIndexOf(‘d’);`\n在这一行中，`String` 类的 `lastIndexOf()`\
  \ 方法将在 `s1` 字符串对象的调用字符串中搜索字符 `d` 的最后一次出现。在这种情况下，方法将在索引位置 `23` 处找到字符 `d` 的最后一次出现。\n\
  \n**第 16 行**\n`index = s1.indexOf(“the”);`\n在这一行中，`indexOf()` 方法将在 `s1` 字符串对象的调用字符串中搜索子字符串\
  \ `the` 的第一次出现。\n\n**第 18 行**\n`index = s1.lastIndexOf(“the”);`\n在这一行中，`lastIndexOf()`\
  \ 方法将在调用字符串中搜索子字符串 `the` 的最后一次出现。\n\n**第 22 行**\n`index = s1.indexOf(‘d’, 15);`\n\
  在这一行中，`indexOf()` 方法将从索引 15 开始在字符串中搜索字符 `d` 的第一次出现。\n\n**第 24 行**\n`index = s1.lastIndexOf(“the”,\
  \ 10);`\n在这一行中，`lastIndexOf()` 方法将从索引 10 开始在字符串中搜索子字符串 `the` 的最后一次出现。\n\n### valueOf\n\
  \n在本章的上一个节中，你学习了 `Object` 类的 `toString()` 方法。但 `toString()` 方法的主要局限性在于你无法用它将原始数据类型表示为\
  \ `String` 对象。为了解决这个问题，Java 提供了静态 `valueOf()` 方法。`valueOf()` 方法接收任何原始数据类型的参数并将其转换为对象。使用\
  \ `valueOf()` 方法的语法如下：\n\n```java\nstatic String valueOf(type obj)\n```\n\n在此语法中，`type`\
  \ 指定任何原始数据类型，例如 `double`、`int`、`boolean` 等。在这里，`valueOf()` 方法将 `obj` 数据类型转换为 `String`\
  \ 对象。\n\n例如：\n\n```java\nboolean i = true;\nString s = String.valueOf(i);\n```\n\
  \n在本示例中，`valueOf()` 方法返回字符串值 `true`，它被赋值给字符串对象 `s`。\n\n### Example 6\n\n以下示例演示了\
  \ `valueOf()` 方法的使用。程序将不同类型的数据转换为字符串，并在屏幕上显示结果值。\n\n```java\n//写一个程序将不同类型的数据转换为字符串\n\
  1 class valueOfdemo\n2 {\n3 public static void main(String arg[ ])\n4 {\n5 char\
  \ arr[ ] = {‘J’, ‘o’, ‘h’, ‘n’, ‘S’, ‘m’, ‘i’, ‘t’, ‘h’};\n6 int value = 10;\n7\
  \ boolean val = true;\n8 double dbl = 123.5240;\n9 char ch = ‘G’;\n10 System.out.println(“String.valueOf(arr)\
  \ = ”+String.valueOf(arr));\n11 System.out.println(“String.valueOf(value) = ”+String.valueOf(value));\n\
  12 System.out.println(“String.valueOf(val) = ”+String.valueOf(val));\n13 System.out.println(“String.valueOf(dbl)\
  \ = ”+String.valueOf(dbl));\n14 System.out.println(“String.valueOf(ch) = ”+String.valueOf(ch));\n\
  15 }\n16 }\n```\n\n\n\n\n\n```java\nSystem.out.println(“String.valueOf(arr) = ”\
  \ +String.valueOf(arr));\n```\n\n在这一行中，字符类型数组 `arr` 被作为参数传递给 `valueOf()` 方法。`valueOf()`\
  \ 方法将字符类型数组 `arr` 的元素转换为单个字符串值 `JohnSmith`。接下来，该方法返回结果字符串，并在屏幕上显示如下：\n\n```\nString.valueOf(arr)\
  \ = JohnSmith\n```\n\n同样，在第 11 到 14 行，`valueOf()` 方法将不同的数据类型转换为字符串，并将结果字符串显示在屏幕上。\n\
  \n示例 6 的输出如图 9-6 所示。\n\n![C09SC006.tif](img/C09SC006_fmt.jpeg)图 9-6 示例 6 的输出\n\n\
  # 获取字符串的长度\n\n你可以使用 `length()` 方法计算字符串的长度。该方法返回一个整数值，指定了应用于方法的字符串中所包含的字符数量。你可以像示例所示使用\
  \ `length()` 方法：\n\n```java\nchar arr[ ] = {‘S’, ‘m’, ‘i’, ‘t’, ‘h’};\nString obj\
  \ = new String(arr);\nint len = obj.length( );\n```\n\n在这个示例中，`length()` 方法返回 5，这是赋值给\
  \ `obj` 对象作为初始值的 `Smith` 字符串的长度。\n\n# StringBuffer 类\n\n你已经知道 `String` 类的对象是不可变的。这意味着一旦创建了该类的对象，就无法对其内容进行任何更改。如果你更改了内容，将创建一个新对象，并将修改后的字符串赋值给它。但在\
  \ Java 中，你可以借助 `StringBuffer` 类动态地创建并更改内容。赋值给 `StringBuffer` 类对象的字符串在本质上是动态的，可以很方便地修改。例如，如果\
  \ `StringBuffer` 类中的字符数量超过了对象的容量，其容量将自动增加以适应增加的体积。你可以通过以下方式创建 `StringBuffer` 类的对象：\n\
  \n```java\nStringBuffer obj = new StringBuffer( )\n```\n\n在这条语句中，`obj` 被创建为 `StringBuffer`\
  \ 类的一个对象。在这里，`StringBuffer()` 是用于初始化 `obj` 对象的构造函数。\n\n## StringBuffer 类的构造函数\n\n\
  `StringBuffer` 类提供了以下三种类型的构造函数：\n\n### StringBuffer( )\n\n`StringBuffer()` 构造函数是\
  \ `StringBuffer` 类的默认构造函数。它不包含任何参数。`StringBuffer()` 构造函数创建一个对象，在没有任何字符序列的情况下初始化它，并预留\
  \ 16 个字符的初始容量。你可以像示例所示使用 `StringBuffer()` 构造函数：\n\n```java\nStringBuffer s1 = new\
  \ StringBuffer( );\n```\n\n在这个示例中，`s1` 被创建为 `StringBuffer` 类的一个对象。在这里，`s1` 对象在没有任何字符序列的情况下初始化，并预留了\
  \ 16 个字符的初始容量。\n\n### StringBuffer(int val)\n\n`StringBuffer(int val)` 构造函数接受一个整数参数。它创建一个对象，在没有任何字符序列的情况下初始化它，并预留初始容量以容纳\
  \ `val` 变量值所指定的字符数量。\n\n例如：\n\n```java\nStringBuffer s1 = new StringBuffer(20);\n\
  ```\n\n在这个示例中，`s1` 被创建为 `StringBuffer` 类的一个对象。在这里，`s1` 对象在没有任何字符序列的情况下初始化，并预留了 20\
  \ 个字符的初始容量（值 20 被参数传递进去）。\n\n### StringBuffer(String obj)\n\n`StringBuffer(String\
  \ obj)` 构造函数接受 `String` 对象作为参数。该构造函数创建一个对象，用与 `obj` 字符串对象相同的字符序列对其初始化，并为 `obj` 对象的总字符数预留初始容量，额外增加\
  \ 16 个字符。\n\n例如：\n\n```java\nStringBuffer s1 = new StringBuffer(“Williams”);\n```\n\
  \n在这个示例中，`s1` 被创建为 `StringBuffer` 类的一个对象。在这里，`s1` 对象用字符序列 `Williams` 进行初始化，并预留了\
  \ 24 个字符的初始容量（`Williams` 字符串的字符数加上 16 个字符）。\n\n# StringBuffer 类的方法\n\n`StringBuffer`\
  \ 类提供了许多方法来操作该类的对象。接下来将讨论这些方法。\n\n### length( )\n\n`StringBuffer` 类的 `length()`\
  \ 方法返回对象中包含的当前字符数量。使用 `length()` 方法的语法如下：\n\n```java\nint length( )\n```\n\n例如：\n\
  \n```java\nStringBuffer s1 = new StringBuffer(“Good Morning”);\nint i = s1.length(\
  \ );\n```\n\n在这个示例中，`Good Morning` 字符串被设置为 `s1` 对象的初始内容。在这里，`length()` 方法返回 12，因为目前\
  \ `s1` 对象包含 12 个字符。\n\n### capacity( )\n\n`StringBuffer` 类的 `capacity()` 方法返回对象在不增加容量的情况下可以存储的字符数量。使用\
  \ `capacity()` 方法的语法如下：\n\n```java\nint capacity( )\n```\n\n例如：\n\n```java\nStringBuffer\
  \ s1 = new StringBuffer(“Good Morning”);\nint i = s1.capacity( );\n```\n\n在这个示例中，`Good\
  \ Morning` 字符串被设置为 `s1` 对象的初始字符串。在这里，`capacity()` 方法返回 28，因为 `s1` 对象包含 12 个字符，并且已经预留了\
  \ 16 个字符的内存。\n\n### ensureCapacity( )\n\n`ensureCapacity()` 方法确保 `StringBuffer`\
  \ 类对象创建后预留的最小容量。该方法的主要功能是确保对象创建时的容量。使用 `ensureCapacity()` 方法的语法如下：\n\n```java\n\
  void ensureCapacity(int size)\n```\n\n在此语法中，`ensureCapacity()` 方法通过整数变量 `size` 的设置存储区域的大小。\n\
  \n例如：\n\n```java\nStringBuffer s1 = new StringBuffer( );\ns1.ensureCapacity(85);\n\
  ```\n\n在这个示例中，`ensureCapacity()` 方法确保 `s1` 对象的容量为 85。\n\n### setLength( )\n\n`setLength()`\
  \ 方法用于增加或减少 `StringBuffer` 类对象的长度。使用 `setLength()` 方法的语法如下：\n\n```java\nvoid setLength(int\
  \ length)\n```\n\n在此语法中，整数变量 `length` 指定字符串的长度。\n\n注意：传递给 `setLength()` 方法的值应该总是正数。如果传递给\
  \ `setLength()` 方法的值小于当前字符串长度，则字符串的部分字符将会丢失。如果传递给 `setLength()` 方法的值大于当前字符串长度，会在字符串末尾追加大量的空字符。\n\
  \n### 示例 7\n\n以下示例说明了 `length()` 和 `setLength()` 方法的使用。程序将显示字符串的当前长度，设置新长度，并根据新长度显示字符串。\n\
  \n```java\n//编写一个设置字符串新长度的程序\nclass setLengthdemo\n{\n    public static void main(String\
  \ arg[ ])\n    {\n        int len;\n        StringBuffer s1 = new StringBuffer(“Good\
  \ Morning”);\n        len = s1.length( );\n        System.out.println(“Current string\
  \ is: ” +s1.toString( ));\n        System.out.println(“Length of the current string\
  \ is: ” +len);\n        s1.setLength(8);\n        len = s1.length( );\n        System.out.println(“New\
  \ length is: ” +len);\n        System.out.println(“Now, the object s1 contains:\
  \ ”+s1.toString( ));\n    }\n}\n```\n\n#### 解析\n\n第 6 行\n`StringBuffer s1 = new\
