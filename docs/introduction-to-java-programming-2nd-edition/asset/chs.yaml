  \n### Applet 与事件处理\n\n### 学习目标\n完成本章后，你将能够：\n* 理解 `Applet` 类\n* 理解 applet 的生命周期\n\
  * 理解 `paint()` 方法\n* 创建 applet\n* 操作 applet 的颜色\n* 理解向 applet 传递参数的概念\n* 理解 `getCodeBase()`\
  \ 和 `getDocumentBase()` 方法\n* 理解事件处理\n* 理解事件委托机制\n* 理解事件类\n* 理解事件源\n* 理解事件监听接口\n\
  \n### 简介\n在本章中，你将学习某些不能作为独立应用程序运行的 Java 程序。这些程序被称为 applet。applet 只能运行在网络浏览器或 applet\
  \ 查看器中。在本章中，你还将学习 `Applet` 类及其生命周期。此外，你将学习各种类型 `Applet` 类的创建和执行。本章还将详细讨论对 applet\
  \ 颜色的操作、向其传递参数以及各种事件处理机制。\n\n#### Applet\nApplet 是一种运行在网络浏览器并共享在互联网上的小型 Java 程序。它的响应时间较短。Applet\
  \ 设计为嵌入在 HTML 页面中，需要 JVM（Java 虚拟机）或单独运行环境。\n\n#### Applet 类\n`java.applet` 包中的 `Applet`\
  \ 类被认为是所有 applet 的基础。它提供了用于创建、操作和执行 applet 的许多方法。`Applet` 类继承自 `Panel` 类，`Panel`\
  \ 类继承自 `Container` 类，而 `Container` 类继承自 `Component` 类。`Object`、`Component`、`Container`\
  \ 和 `Panel` 类都定义在 `java.awt` 中，并可以用于创建窗口图形界面。通过这种方式，`Applet` 类也支持创建 applet。表 10-1\
  \ 显示了 `Applet` 类定义的方法。\n\n**表 10-1 Applet 类定义的方法**\n\n| 方法 |  |\n| :--- | :--- |\n\
  | `void init()` | applet 开始执行时调用的第一个方法。 |\n| `void start()` | applet 开始执行时调用此方法。\
  \ |\n| `void stop()` | 浏览器或 applet 查看器停止 applet 执行时调用此方法。 |\n| `void destroy()`\
  \ | 浏览器或 applet 查看器在 applet 终止前的清理阶段调用此方法。 |\n| `String getAppletInfo()` | 返回包含\
  \ applet 描述的 `String` 对象。 |\n| `AppletContext getAppletContext()` | 返回 applet 的上下文。\
  \ |\n| `AccessibleContext getAccessibleContext()` | 返回 applet 的可访问上下文。 |\n| `AudioClip\
  \ getAudioClip(URL url)` | 返回由参数 `url` 指定 `AudioClip` 对象。 |\n| `AudioClip getAudioClip(URL\
  \ url, String name)` | 返回由参数 `url` 和 `String` 对象名称指定的 `AudioClip` 对象。 |\n| `URL\
  \ getCodeBase()` | 返回包含 applet 的目录的 URL。 |\n| `URL getDocumentBase()` | 返回嵌入 applet\
  \ 的文档的 URL。 |\n| `Image getImage(URL url)` | 返回由 `url` 指定位置的 `Image` 对象。 |\n| `Image\
  \ getImage(URL url, String name)` | 返回由 `url` 指定位置并由 `String` 对象名称指定的 `Image` 对象。\
  \ |\n\n\n\n\n\n| `Locale getLocale( )` | 此方法返回 applet 的 Locale（语言区域设置），如果它已设置。否则，返回默认的\
  \ Locale。 |\n| `String getParameter(String name)` | 此方法返回 HTML 标签中参数名的值。如果未找到指定的参数，则返回\
  \ NULL。 |\n| `String[ ][ ]getParameterInfo( )` | 此方法返回 applet 识别的所有参数的信息。 |\n| `boolean\
  \ isActive( )` | 如果 applet 激活状态，则返回 true；否则返回 false。 |\n| `public static final AudioClip\
  \ new AudioClip(URL url)` | 此方法返回包含从 `url` 接收到的音频的 `AudioClip` 对象。 |\n| `void play(URL\
  \ url)` | 此方法播放由 `url` 指定位置的音频。 |\n| `void play(URL url, String name)` | 此方法播放由\
  \ `url` 和 `String` 对象指定位置和名称的音频。 |\n| `void resize(Dimension d)` | 此方法用于根据对象 `d`\
  \ 指定的调整 applet 的大小。 |\n| `void showStatus(String s1)` | 此方法用于在浏览器或 applet 查看器状态窗口中显示对象\
  \ `s1` 的内容。 |\n| `void resize(int width, int height)` | 此方法根据整数变量 `width` 和 `height`\
  \ 分别指定的值调整 applet 的宽度和高度。 |\n| `void paint(Graphics g)` | 此方法用于在 applet 上绘制图形。 |\n\
  | `void update(Graphics g)` | `paint()` 不直接调用。这是调用 `paint()` 的方法。你可能需要重写此方法以实现动画和双缓冲图形。\
  \ |\n| `void setBackground(Color x)` | 定义背景颜色属性。 |\n| `void setForeground(Color\
  \ x)` | 定义前景颜色属性。 |\n| `void repaint()` | 此方法用于重绘 applet 的图形。 |\n\n# Applet 的生命周期\n\
  \n在 Java 中，每个 applet 在执行期间都有一个生命周期。Applet 的生命周期经历四个阶段，接下来将进行讨论。\n\n### init( )\n\
  applet 的生命周期从 `init( )` 方法开始。这是浏览器或 applet 查看器在上传 applet 时调用的第一个方法。在 `init( )` 方法内部，你应该提供\
  \ applet 所需初始化代码。`init( )` 方法在 applet 的整个生命周期中只被调用一次。\n\n### start( )\n`start( )`\
  \ 方法在 `init( )` 方法之后自动调用。此方法用于启动 applet 的执行。每当 applet 在指定的暂停后恢复工作时，此方法就会被调用。\n\n\
  ### stop( )\n每当网络浏览器离开对包含 applet 的网页的控制并移动到另一个网页时，`stop( )` 方法会被自动调用。通过此方法的帮助，applet\
  \ 将挂起一段时间。\n\n### destroy( )\n当包含 applet 的网络浏览器或 applet 查看器完全关闭时，`destroy( )` 方法会被调用。此方法在\
  \ applet 的整个生命周期中只被调用一次。\n\n# paint( ) 方法\n\n`paint( )` 方法用于在 applet 上绘制图形。该方法定义在\
  \ `java.awt.Component` 中，包含一个参数，即 `Graphics` 类的对象。使用 `paint( )` 方法的语法如下：\n\n```java\n\
  public void paint(Graphics g)\n```\n\n在此语法中，`g` 是 `Graphics` 类的对象，包含了 applet 运行的图形上下文。\n\
  \n# 创建 Applet\n\n在创建 applet 之前，你需要了解 applet 的整体框架，以及保存、编译和运行 applet 的步骤。运行 applet\
  \ 有两种方法。这些方法如下：\n\n1. 使用 HTML 文件。\n2. 不使用 HTML 文件。\n\n## 使用 HTML 文件\n要使用 HTML 文件执行\
  \ applet，请创建两个文件：一个是以 `.java` 扩展保存的 applet 文件，另一个是以 `.html` 扩展保存的 HTML 文件。以下示例通过创建\
  \ HTML 文件展示了 applet 的整体框架：\n\n```java\n//以下程序用于 Appletdemo.java\nimport java.awt.*;\n\
  import java.applet.*;\n\npublic class Appletdemo extends Applet\n{\n    public void\
  \ init()\n    {\n        // 初始化语句\n    }\n\n    public void start()\n    {\n   \
  \     // 启动语句\n    }\n\n    public void paint(Graphics g)\n    {\n        // 显示图形的语句\n\
  \    }\n\n    public void stop()\n    {\n        // 停止语句\n    }\n\n    public void\
  \ destroy()\n    {\n        // 销毁语句\n    }\n}\n\n//以下程序用于 Appletdemo.html\n<html>\n\
  <applet code=\"Appletdemo.class\" width=\"500\" height=\"100\">\n</applet>\n</html>\n\
  ```\n\n在此示例中，创建了两个文件：一个是 `Appletdemo.java`，另一个是 `Appletdemo.html`。在 `Appletdemo.java`\
  \ 中，前两个语句是导入语句。这些语句用于将 `Applet`、`Graphics` 等类导入程序中。每当你创建一个 applet 时，都必须导入这些类。在类定义中，通过\
  \ `extends` 关键字继承 `Applet` 类。你可以根据需要重写 `init()`、`start()`、`stop()` 等方法。在此示例中，方法没有任何定义，因此输出是一个空的\
  \ applet。\n\n要在 HTML 页面嵌入 applet，请创建一个包含 `<applet>` 标签的 `Appletdemo.html` 文件。传递类文件并指定\
  \ applet 的宽度和高度。保存文件后，使用 `javac` 命令编译程序生成类文件：\n\n```bash\njavac Appletdemo.java\n\
  ```\n\n现在执行 applet。你可以通过 `appletviewer` 命令执行它：\n\n```bash\nappletviewer Appletdemo.html\n\
  ```\n\n当你执行 applet 时，屏幕上将显示一个 500x100 尺寸的 applet 窗口，如图 10-1 所示。\n\n## 不使用 HTML 文件\n\
  要不使用 HTML 文件执行 applet，创建一个包含注释中 applet 标签的 applet，然后将其编译。以下示例展示了没有 HTML 的 applet\
  \ 整体框架：\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n\n//<applet code=\"\
  Appletdemo.class\" width=\"500\" height=\"100\"></applet>\npublic class Appletdemo\
  \ extends Applet\n{\n    public void init()\n    {\n        // 初始化语句\n    }\n\n\
  \    public void start()\n    {\n        // 启动语句\n    }\n\n    public void paint(Graphics\
  \ g)\n    {\n        // 显示图形的语句\n    }\n\n    public void stop()\n    {\n      \
  \  // 停止语句\n    }\n\n    public void destroy()\n    {\n        // 销毁语句\n    }\n\
  }\n```\n\n在此示例中，前两个语句是导入语句。这些语句用于将 `Applet`、`Graphics` 等类导入程序中。每当你创建一个 AWT applet\
  \ 时，都必须导入这两个导入语句。接条语句包含了 `<applet>` 标签。由于该标签不是 Java 语言的一部分，因此被视为注释语句。\n\n\n\n\n\n\
  当编码部分完成后，你需要将文件保存为 `Appletdemo.java`。接下来，你需要编译该程序以生成传递给 `<applet>` 标签的类文件。你可以使用\
  \ `javac` 命令编译 `Appletdemo.java` 文件，如下所示行所示：\n\n```bash\njavac Appletdemo.java\n\
  ```\n\n现在，你需要执行该 applet。你可以使用下面提供的 `appletviewer` 命令来执行它：\n\n```bash\nappletviewer\
  \ Appletdemo.java\n```\n\n当你执行 applet 时，屏幕上将显示一个尺寸为 500*100 的 applet 窗口，如图图 10-2\
  \ 所示。\n\n![C10SC002.tif](img/C10SC002_fmt.jpeg)\n\n图 10-2 不使用 HTML 文件的 Applet 窗口\n\
  \n### 示例 1\n\n以下示例说明了如何创建一个简单的 applet。该程序将创建一个用于在屏幕上显示字符串的 applet。\n\n```java\n\
  //写一个程序来创建一个 applet\n1 import java.awt.*;\n2 import java.applet.*;\n3 //<applet\
  \ code= “FirstApplet.class” width=300 height=100></applet>\n4 public class FirstApplet\
  \ extends Applet\n5 {\n6 public void paint(Graphics g)\n7 {\n8 g.drawString(“First\
  \ applet”, 100, 50);\n9 }\n10 }\n```\n\n#### 解析\n\n#### 第 1 行和第 2 行\n```java\nimport\
  \ java.awt.*;\nimport java.applet.*;\n```\n这些行包含 `import` 关键字，用于导入两个包 `java.awt.*`\
  \ 和 `java.applet.*`。这些包内部定义的所有类都将包含在此程序中。现在，`FirstApplet` 类可以使用这些包内部定义的所有类或方法。\n\
  \n### 第 3 行\n```java\n//<applet code=“Firstapplet.class” width=300 height=100></applet>\n\
  ```\n此行包含 HTML `<applet>` 标签。Java 将此标签视为注释。在标签内部，`FirstApplet` 的类文件被赋值给 `code` 变量。接下来，300\
  \ 和 100 分别是 applet 窗口 `width` 和 `height` 变量的值。\n\n#### 第 4 行\n```java\npublic class\
  \ FirstApplet extends Applet\n```\n在这一行中，`FirstApplet` 类被声明为一个公共类。在这里，`FirstApplet`\
  \ 类将继承 `Applet` 类的所有属性，该类定义在 `java.applet.*` 包中。\n\n#### 第 6 行到第 9 行\n```java\n\
  public void paint(Graphics g)\n{\ng.drawString(“First applet”, 100, 50);\n}\n```\n\
  这些行包含了 `paint( )` 方法的定义。`paint( )` 方法的参数列表包含 `Graphics` 类的 `g` 对象。该对象定义了 applet\
  \ 的环境。在 `paint( )` 方法内部，将调用 `Graphics` 类的 `drawString( )` 方法。该方法将从位置 100, 50 开始绘制字符串\
  \ First applet。在这里，100 和 50 分别是 applet 窗口的 `x` 和 `y` 坐标的值。在 Java 中，applet 窗口的左上角坐标为\
  \ (0,0)。\n\n示例 1 的输出显示在图 10-3 中。\n\n![C10SC003.tif](img/C10SC003_fmt.jpeg)\n\n图\
  \ 10-3 示例 1 的输出\n\n## 操作 Applet 的颜色\n\n你也可以设置或操作 applet 的背景和前景颜色。要做到这一点，你可以使用以下两种方法之一：\n\
  \n- `setBackground(Color objColor)`\n- `setForeground(Color objColor)`\n\n这些方法由\
  \ `Component` 类定义。在这些方法中，`objColor` 指定新颜色，它可以取 `Color` 类中以下常量值之一：\n\n- `Color.black`\n\
  - `Color.white`\n- `Color.orange`\n- `Color.blue`\n- `Color.cyan`\n- `Color.magenta`\n\
  - `Color.gray`\n- `Color.lightGray`\n- `Color.darkGray`\n- `Color.red`\n- `Color.green`\n\
  - `Color.yellow`\n- `Color.pink`\n\n### 示例 2\n\n以下示例说明了 `setBackground( )` 和 `setForeground(\
  \ )` 方法的使用。该程序将改变 applet 的背景和前景颜色。\n\n```java\n//写一个程序来改变 applet 的背景和前景颜色\n1 import\
  \ java.awt.*;\n2 import java.applet.*;\n3 //<applet code= “Colorsdemo.class” width=300\
  \ height=100></applet>\n4 public class Colorsdemo extends Applet\n5 {\n6 public\
  \ void init( )\n7 {\n8 setBackground(Color.cyan);\n9 setForeground(Color.blue);\n\
  10 }\n11 public void paint(Graphics g)\n12 {\n13  g.drawString(“Background color\
  \ is set to cyan”, 65, 30);\n14  g.drawString(“Foreground color is set to blue”,\
  \ 65, 30);\n15 }\n```\n\n#### 解析\n\n#### 第 6 行到第 10 行\n```java\npublic void init(\
  \ )\n{\nsetBackground(Color.cyan);\nsetForeground(Color.blue);\n}\n```\n这些行包含了 `init(\
  \ )` 方法将背景颜色设置为青色（cyan），并将前景颜色设置为蓝色（blue）。\n\n#### 第 11 行到第 15 行\n```java\npublic\
  \ void paint(Graphics g)\n{\n  g.drawString(“Background color is set to cyan”, 65,\
  \ 30);\n  g.drawString(“Foreground color is set to blue”, 65, 30);\n}\n```\n这些行包含了\
  \ `paint( )` 方法的定义。它在 (65, 30) 处绘制字符串“Background color is set to cyan”，在 (65, 30)\
  \ 处绘制字符串“Foreground color is set to blue”（*注：原文中第 14 行坐标似乎有重复，此处根据逻辑保持翻译一致*）。\n\n\
  （注：原文提供的文本中第 14、15 行的示例代码块存在格式错乱，已根据代码逻辑进行了完整还原）\n\n\n\n\n\n在这一行中，属性 `rollnumber`\
  \ 被作为参数传递给方法 `getParameter()`。在这里，属性 `rollnumber` 包含一个整数值。`getParameter()` 方法将获取并返回属性\
  \ `rollnumber`，其作为一个 `String` 类的对象。现在，整数值 `110` 被视为字符串对象的值。接下来，结果将赋值给字符串对象 `rollnum`。\n\
  \n示例 3 的输出显示在图 10-5 中。\n\n![C10SC005.tif](img/C10SC005_fmt.jpeg)\n\n图 10-5 示例 3\
  \ 的输出\n\n## `getCodeBase()` 和 `getDocumentBase()` 方法\n\n在程序中，`getCodeBase()` 方法返回包含\
  \ applet 的目录 URL，而 `getDocumentBase()` 方法返回嵌入 applet 的文档的 URL。要使用这些方法，首先你需要在程序中导入\
  \ `java.net` 包。\n\n### 示例 4\n\n以下示例说明了 `getCodeBase()` 和 `getDocumentBase()` 方法的使用。程序将通过\
  \ `getCodeBase()` 和 `getDocumentBase()` 方法获取 applet 的 URL。程序还将在 applet 窗口中显示结果的\
  \ URL。\n\n```java\n/* 写一个程序来演示 getCodeBase() 和 getDocumentBase() 方法的使用 */\n\n1 import\
  \ java.awt.*;\n2 import java.applet.*;\n3 import java.net.*;\n4 //<applet code=\
  \ “CodeDocumentBase.class” width=525 height=100>\n   </applet>\n5 public class CodeDocumentBase\
  \ extends Applet\n6 {\n7 String code;\n8  URL url;\n9 public void paint(Graphics\
  \ g)\n10 {\n11 url = getCodeBase();\n12 code = “The getCodeBase() returns: ” + url.toString();\n\
  13 g.drawString(code, 0, 20);\n14 url = getDocumentBase();\n15 code = “The getDocumentBase()\
  \ returns: ” +url.toString();\n16 g.drawString(code, 0, 50);\n17 }\n18 }\n```\n\n\
  #### 解析\n\n#### 第 8 行\n`URL url;`\n在这一行中，`url` 被声明为 `URL` 类的一个对象。\n\n#### 第 11 行\n\
  `url = getCodeBase();`\n在这一行中，`getCodeBase()` 方法将返回包含 applet 的目录的 URL 地址。接下来，结果\
  \ URL 将赋值给 `url` 对象。该方法返回的 `URL` 如下：\n`file:/D:/Java%20Projects/Ch10/`\n\n#### 第\
  \ 12 行\n`code = “The getCodeBase() returns: ” + url.toString();`\n在这一行中，`toString()`\
  \ 方法将 `url` 对象表示为字符串对象。接下来，结果对象的值将连接到字符串 `The getCodeBase() returns:` 之后，结果字符串将赋值给\
  \ `code` 字符串对象。\n\n#### 第 14 行\n`url = getDocumentBase();`\n在这一行中，`getDocumentBase()`\
  \ 方法将返回嵌入 applet 的文件的 URL。接下来，结果 URL 将赋值给 `url` 对象。该方法返回的 `URL` 如下：\n`file:/D:/Java%20Projects/Ch10/CodeDocumentBase.java`\n\
  \n示例 4 的输出显示在图 10-6 中。\n\n![C10SC006.tif](img/C10SC006_fmt.jpeg)\n\n图 10-6 示例 4\
  \ 的输出\n\n## 事件处理\n\n在本章的早期章节中，你学习了 applet 及其功能。在这一节中，你将学习另一个重要概念，即事件处理。Java applet\
  \ 是一种事件驱动的程序以及用于与终端用户交互的图形用户界面。当终端用户以不同方式与 GUI 交互时（例如点击鼠标按钮、移动鼠标或在文本框中输入文本），applet\
  \ 将产生特定的事件。为了处理这些事件，程序内部使用了特定的事件处理命令。`java.awt.event` 和 `java.util` 包包含了支持事件处理机制的类。\n\
  \n在这一节中，你将学习事件处理机制、事件类，以及事件类的常量和方法。\n\n### 事件处理机制\n\n在 Java 中，用于事件处理的最新且简单的方法被称为委托事件模型（delegation\
  \ event model）。在模型模型中，从产生事件到处理事件的整个过程是一致的。委托事件模型使用的三个主要组件如下：\n\n#### 事件源 (Event\
  \ Source)\n事件源是一个 GUI 组件，如按钮、鼠标、键盘等，终端用户可以与其交互。每当组件的内部状态发生变化，源组件就会产生一个或多个事件。\n\n\
  #### 事件对象 (Event Object)\n当事件发生时会创建一个事件对象。该对象封装了所有信息，例如事件类型、事件源以及发生事件的情况。\n\n####\
  \ 事件监听器 (Event Listener)\n事件监听器是一个在事件发生时由事件源通知的对象。它通知事件并对其进行相应的处理。每个事件监听器都应该注册到源组件上。\n\
  \n接下来的部分描述了委托事件模型的工作原理，以及上述三个组件如何在其中使用。\n\n1. 首先，应该使用以下语法在事件源上注册监听器：\n`public void\
  \ addTypeListener(Type ref)`\n在此语法中，`Type` 是监听器类型，`ref` 是引用。一旦监听器注册好，它将等待事件发生。\n\
  2. 第二，当事件发生时，事件对象会被发送给监听器。\n3. 第三，当事件对象被监听器接收时，它会处理事件。\n\n### 事件类 (Event Classes)\n\
  你知道当事件发生时，会创建一个事件对象。Java 提供了以下事件类：\n1. `EventObject`\n2. `AWTEvent`\n3. `ActionEvent`\n\
  4. `ItemEvent`\n5. `AdjustmentEvent`\n6. `TextEvent`\n7. `ComponentEvent`\n8. `InputEvent`\n\
  9. `KeyEvent`\n10. `MouseEvent`\n11. `FocusEvent`\n12. `ContainerEvent`\n13. `WindowEvent`\n\
  这些类将在后续讨论。\n\n#### EventObject 类\n`EventObject` 类定义在 `java.util` 包中。该类位于事件类层次结构的根部，其他事件类都派自该类。`EventObject`\
  \ 类定义了构造函数：\n`EventObject(Object source)`\n在此语法中，`source` 代表产生事件的对象（或 GUI 组件）。\n\
  \n`EventObject` 类还包含以下方法：\n`Object getSource()`\n`getSource()` 方法返回事件源。使用 `getSource()`\
  \ 方法的语法如下：`Object getSource()`\n\n`String toString()`\n`toString()` 方法返回表示事件对象的字符串。使用\
  \ `toString()` 方法的语法如下：`String toString()`\n\n#### AWTEvent 类\n`AWTEvent` 类定义在 `java.awt`\
  \ 包中。在事件类的层次结构中，它位于 `EventObject` 类之下。因此，它被视为 `EventObject` 类的子类。它是所有基于 AWT 事件的父类。\n\
  \n#### ActionEvent 类\n当组件上执行操作时（例如按下按钮、选择菜单项等），会生成一个 `ActionEvent` 类的事件对象。`ActionEvent`\
  \ 类包含三种类型的构造函数：\n\n`ActionEvent(Object source, int id, String cmd)`\n在此语法中，`source`\
  \ 代表产生事件的对象（或 GUI 组件）。整数变量 `id` 指定事件类型，字符串对象 `cmd` 指定事件的命令。\n\n`ActionEvent(Object\
  \ source, int id, String cmd, int modifiers)`\n在此语法中，前三个参数与上一个构造函数相同。整数类型变量 `modifiers`\
  \ 是第四个参数，它指定了产生事件时应用的修饰键。\n\n`ActionEvent(Object source, int id, String cmd, long\
  \ time, int modifier)`\n在此语法中，`time` 参数指定事件发生的时间段。\n\n\n\n\n\n`ActionEvent` 类定义四个整数常量：`ALT_MASK`、`CTRL_MASK`、`META_MASK`\
  \ 和 `SHIFT_MASK`。这些常量用于识别在生成事件时按下的修饰键。\n\n`ActionEvent` 类包含以下方法：\n\n### `getActionCommand()`\n\
  `getActionCommand()` 方法返回一个与事件相关的命令字符串。使用 `getActionCommand()` 方法的语法如下：\n\n```\n\
  String getActionCommand( )\n```\n\n### `getModifiers()`\n`getModifiers()` 方法返回一个整数值，表示在生成事件期间应用的修饰键。使用\
  \ `getModifiers()` 方法的语法如下：\n\n```\nString getModifiers( )\n```\n\n### `getWhen()`\n\
  `getWhen()` 方法返回事件发生的时间戳。使用 `getWhen()` 方法的语法如下：\n\n```\nlong getWhen( )\n```\n\n\
  # ItemEvent 类\n\n当选中或取消选择复选框或列表项时，会生成 `ItemEvent` 类对象。`ItemEvent` 类包含以下整数常量：\n\n\
  1. `DESELECTED`\n2. `SELECTED`\n3. `ITEM_STATE_CHANGED`\n\n在这里，`DESELECTED` 和 `SELECTED`\
  \ 常量用于具有两个项目的事件，而 `ITEM_STATE_CHANGED` 常量指定项目的状态是否发生了变化。\n\n`ItemEvent` 类包含以下构造函数：\n\
  \n```\nItemEvent(ItemSelectable source, int id, Object item, int state)\n```\n\n\
  在此构造函数中，参数 `source` 表示生成事件的对象，整数变量 `id` 表示生成的事件类型。`item` 对象指定受事件影响的项。整数变量 `state`\
  \ 表示项的当前状态。\n\n`ItemEvent` 类包含以下方法：\n\n### `getItem()`\n`getItem()` 方法返回生成事件的项的引用。使用\
  \ `getItem()` 方法的语法如下：\n\n```\nObject getItem( )\n```\n\n### `getStateChange()`\n\
  `getStateChange()` 方法返回一个整数值，指示事件的状态变化（选中或取消选中）。使用 `getStateChange()` 方法的语法如下：\n\
  \n```\nint getStateChange( )\n```\n\n### `getItemSelectable()`\n`getItemSelectable()`\
  \ 方法返回源自事件的 `ItemSelectable` 对象的引用。使用 `getItemSelectable()` 方法的语法如下：\n\n```\nItemSelectable\
  \ getItemSelectable( )\n```\n\n# AdjustmentEvent 类\n\n`AdjustmentEvent` 类对象由滚动条等可调整对象生成。`AdjustmentEvent`\
  \ 类定义的整数常量如下：\n\n1. `BLOCK_INCREMENT`\n2. `BLOCK_DECREMENT`\n3. `TRACK`\n4. `UNIT_DECREMENT`\n\
  5. `UNIT_INCREMENT`\n6. `ADJUSTMENT_VALUE_CHANGED`\n\n前提到的的五个常量用于识别五种类型的调整事件。最后一个常量\
  \ `ADJUSTMENT_VALUE_CHANGED` 指示调整值是否发生了变化。\n\n`AdjustmentEvent` 类包含以下构造函数：\n\n```\n\
  AdjustmentEvent(Adjustable source, int id, int type, int curvalue)\n```\n\n在此语法中，参数\
  \ `source` 表示生成 `AdjustmentEvent` 类型事件的 `Adjustable` 对象。整数变量 `id`、`type` 和 `curvalue`\
  \ 分别指定事件类型、调整类型以及调整的当前值。\n\n`AdjustmentEvent` 类包含以下方法：\n\n### `getAdjustable()`\n\
  `getAdjustable()` 方法返回生成事件的 `Adjustable` 对象。使用 `getAdjustable()` 方法的语法如下：\n\n```\n\
  Adjustable getAdjustable( )\n```\n\n### `getValue()`\n`getValue()` 方法返回调整事件执行的调整量。使用\
  \ `getValue()` 方法的语法如下：\n\n```\nint getValue( )\n```\n\n### `getAdjustmentType()`\n\
  `getAdjustmentType()` 方法返回事件期间执行的调整类型。此方法返回由 `AdjustmentEvent` 类定义的整数常量。使用 `getAdjustmentType()`\
  \ 方法的语法如下：\n\n```\nint getAdjustmentType( )\n```\n\n# TextEvent 类\n\n`TextEvent`\
  \ 类对象由文本框、文本区域等文本字段组件生成。当用户在文本字段中输入字符值时，会生成此事件。`TextEvent` 类定义了整数常量 `TEXT_VALUE_CHANGED`，显示文本字段中的文本是否发生了变化。\n\
  \n`TextEvent` 类包含以下构造函数：\n\n```\nTextEvent(Object source, int id)\n```\n\n在此语法中，`source`\
  \ 表示生成事件的对象。在这里，整数变量 `id` 标识事件类型。\n\n# ComponentEvent 类\n\n当组件移动、调整大小或可见性发生变化时，会生成\
  \ `ComponentEvent` 类对象。`ComponentEvent` 类定义的四个整数常量如下：\n\n1. `COMPONENT_HIDDEN`\n\
  2. `COMPONENT_MOVED`\n3. `COMPONENT_RESIZED`\n4. `COMPONENT_SHOWN`\n\n所有上述整数常量用于识别由\
  \ `ComponentEvent` 类生成的四种不同类型的组件事件。\n\n`ComponentEvent` 类包含以下构造函数：\n\n```\nComponentEvent(Component\
  \ source, int id)\n```\n\n在此语法中，`source` 表示生成事件的对象，整数变量 `id` 表示事件类型。\n\n`ComponentEvent`\
  \ 类包含以下方法：\n\n### `getComponent()`\n`getComponent()` 方法返回生成事件的组件对象。使用 `getComponent()`\
  \ 方法的语法如下：\n\n```\nComponent getComponent( )\n```\n\n# InputEvent 类\n\n`InputEvent`\
  \ 类是 `ComponentEvent` 的直接父类。它定义了某些整数常量：\n\n1. `ALT_MASK`\n2. `ALT_MASK`\n3. `BUTTON1_MASK`\n\
  4. `BUTTON2_MASK`\n5. `BUTTON3_MASK`\n6. `CTRL_MASK`\n7. `META_MASK`\n8. `SHIFT_MASK`\n\
  \n`InputEvent` 类包含以下方法：\n\n### `getModifiers()`\n`getModifiers()` 方法返回所有的修饰位。使用\
  \ `getModifiers()` 方法的语法如下：\n\n```\nint getModifiers( )\n```\n\n### `isAltDown()`\n\
  `isAltDown()` 方法根据事件期间是否按下 `ALT` 修饰键返回 true 或 false。使用 `isAltDown()` 方法的语法如下：\n\n\
  ```\nboolean isAltDown( )\n```\n\n就像 `isAltDown()` 方法一样，`InputEvent` 类还有其他方法。这些方法根据事件生成期间是否按下了相应的修饰键返回\
  \ true 或 false。这些方法如下：\n\n```\nboolean isAltGraph( )\nboolean isControlDown( )\n\
  boolean isMetaDown( )\nboolean isShiftDown( )\n```\n\n# KeyEvent 类\n\n`KeyEvent`\
  \ 类对象在按键按下、释放或输入时生成。`KeyEvent` 类定义的三个整数常量如下：\n\n1. `KEY_PRESSED`\n2. `KEY_RELEASED`\n\
  3. `KEY_TYPED`\n\n这些整数常量用于识别三种不同的按键事件，如 `KEY_PRESSED`、`KEY_RELEASED` 和 `KEY_TYPED`。\n\
  \n按键按下时生成 `KEY_PRESSED` 事件，按键释放时生成 `KEY_RELEASED` 事件。每当按键按下时，都会生成其虚拟键码，用于标识该键在键盘上的位置。例如，当按下\
  \ ALT 键时，会生成虚拟键码 `VK_ALT` 并伴之发生 `KEY_PRESSED` 事件。以下列表显示了常量 `VK` 指定的一些虚拟键码：\n\n1.\
  \ `VK_0` 到 `VK_9` 表示从 0 到 9 的数字键\n2. `VK_A` 到 `VK_Z` 表示 A-Z 和 a-z 的字符键及其 ASCII 值\n\
  3. `VK_ALT` 表示 ALT 键\n4. `VK_CONTROL` 表示 CTRL 键\n5. `VK_DOWN` 向下箭头键\n6. `VK_UP`\
  \ 向上箭头键\n7. `VK_RIGHT` 表示右箭头键\n8. `VK_LEFT` 表示左箭头键\n9. `VK_SHIFT` 表示 SHIFT 键\n\n\
  \n\n\n第三个事件是 `KEY_TYPED` 事件，它在文本字段中输入字符时生成。但在这种情况下，并不是所有的按键都会生成字符。例如，当你按下 `ALT`\
  \ 键时，它不会生成任何字符。\n\n`KeyEvent` 类包含以下构造函数：\n\n```\nKeyEvent(Component source, int\
  \ id, long time, int modifiers, int code, char chr)\n```\n\n在此语法中，`source` 代表生成事件的\
  \ `Component` 对象。整数变量 `id` 指定事件的类型，长型变量 `time` 包含按下按键时的系统时间。整数变量 `modifiers` 代表在事件生成期间按的键。整数变量\
  \ `code` 代表所按按键的虚拟键代码。但在按键事件中，虚拟键代码将包含 `VK_UNDEFINED`。字符变量 `chr` 代表在事件期间生成的字符。如果生成的字符是无效的\
  \ Unicode 字符，则会将 `CHAR_UNDEFINED` 赋值给字符变量 `chr`。\n\n以下是 `KeyEvent` 类中最常用的方法：\n\n\
  ### getKeyCode()\n\n`getKeyCode()` 方法返回与事件生成期间的按键相关的虚拟键代码。使用 `getKeyCode()` 的语法如下：\n\
  \n```\nint getKeyCode( )\n```\n\n### getKeyChar()\n\n`getKeyChar()` 方法返回与事件生成期间的按键相关的\
  \ Unicode 字符。使用 `getKeyChar()` 的语法如下：\n\n```\nchar getKeyChar( )\n```\n\n### getKeyText(int\
  \ keycode)\n\n`getKeyText(int keycode)` 方法返回一个字符字符串，该字符串定义了传递给它的参数 `keycode`。使用\
  \ `getKeyText()` 的语法如下：\n\n```\nString getKeyText(int keycode)\n```\n\n# MouseEvent\
  \ 类\n\n当鼠标在组件内移动、拖动、按下、释放、进入、退出或点击时，会生成 `MouseEvent` 类的事件对象。`MouseEvent` 类定义了以下整数常量：\n\
  \n1. `MOUSE_CLICKED`\n2. `MOUSE_DRAGGED`\n3. `MOUSE_ENTERED`\n4. `MOUSE_EXITED`\n\
  5. `MOUSE_MOVED`\n6. `MOUSE_PRESSED`\n7. `MOUSE_RELEASED`\n\n所有这些常量都用于识别鼠标事件。\n\n\
  `MouseEvent` 类包含以下构造函数：\n\n```\nMouseEvent(Component source, int id, long time,\
  \ int modifiers, int x, int y, int count, boolean popuptrigger)\n```\n\n在此语法中，`source`\
  \ 代表生成事件的 `Component` 对象。整数变量 `id` 指定事件类型，长型变量 `time` 指定事件发生的时间。整数变量 `modifiers`\
  \ 指定鼠标事件生成时按下的修饰键。整数变量 `x` 和 `y` 指定鼠标位置的 `x` 和 `y` 坐标，整数变量 `count` 指定鼠标点击次数。布尔变量\
  \ `popuptrigger` 如果事件是从弹出菜单中生成的，则返回 true。\n\n`MouseEvent` 类包含以下方法：\n\n### getX()\n\
  \n`getX()` 方法返回事件生成时相对于 `source` 组件的鼠标 `x` 坐标位置。使用 `getX()` 方法的语法如下：\n\n```\nint\
  \ getX( )\n```\n\n### getY()\n\n`getY()` 方法返回事件生成时相对于 `source` 组件的鼠标 `y` 坐标位置。使用\
  \ `getY()` 方法的语法如下：\n\n```\nint getY( )\n```\n\n### getPoint()\n\n`getPoint()` 方法返回一个\
  \ `Point` 类的对象。该对象包含存储在其实例变量 `x` 和 `y` 中的 `x` 和 `y` 坐标位置。这些位置相对于事件生成生成时的 `source`\
  \ 组件。使用 `getPoint()` 方法的语法如下：\n\n```\nPoint getPoint( )\n```\n\n### translatePoint()\n\
  \n`translatePoint()` 方法通过通过传递给方法的参数的值来改变事件的 `x` 和 `y` 坐标。使用 `translatePoint()` 方法的语法如下：\n\
  \n```\nvoid translatePoint(int x, int y)\n```\n\n在此语法中，变量 `x` 和 `y` 的值分别被加到 `x`\
  \ 和 `y` 坐标上。\n\n### getClickCount()\n\n`getClickCount()` 方法返回与事件相关的鼠标点击次数。使用 `getClickCount()`\
  \ 方法的语法如下：\n\n```\nint getClickCount( )\n```\n\n### isPopupTrigger()\n\n`isPopupTrigger()`\
  \ 方法如果事件是从弹出菜单中生成的，则返回 true。否则，返回 false。使用 `isPopupTrigger()` 方法的语法如下：\n\n```\n\
  boolean isPopupTrigger( )\n```\n\n### getButton()\n\n`getButton()` 方法返回鼠标按钮的状态的状态或生成事件的鼠标按钮。使用\
  \ `getButton()` 方法的语法如下：\n\n```\nint getButton( )\n```\n\n`getButton()` 方法返回以下值之一：\n\
  \n1. `NOBUTTON`\n2. `BUTTON1`\n3. `BUTTON2`\n4. `BUTTON3`\n\n# FocusEvent 类\n\n\
  当组件获得或丢失输入焦点时，会生成 `FocusEvent` 类的事件对象。`FocusEvent` 类定义两个整数常量：`FOCUS_GAINED` 和 `FOCUS_LOST`。这两个常量用于识别两个焦点事件。\n\
  \n`FocusEvent` 类包含以下构造函数：\n\n```\nFocusEvent(Component source, int id)\n```\n\n\
  在此语法中，`source` 代表生成事件的 `Component` 对象，整数变量 `id` 代表生成的事件类型。\n\n```\nFocusEvent(Component\
  \ source, int id, boolean temporary)\n```\n\n在此语法中，`source` 代表生成事件的 `Component`\
  \ 对象。整数变量 `id` 代表生成的事件类型。布尔变量 `temporary` 检查焦点变化是临时的还是永久的。如果焦点变化是临时的，则将变量设置为 true。否则，将其设置为\
  \ false。\n\n`FocusEvent` 类包含以下方法：\n\n### isTemporary()\n\n`isTemporary()` 方法如果焦点事件变化是临时的，则返回\
  \ true。否则，返回 false。使用 `isTemporary()` 方法的语法如下：\n\n```\nboolean isTemporary( )\n\
  ```\n\n# ContainerEvent 类\n\n当容器的内容改变时，会生成 `ContainerEvent` 类的事件对象。换句话说，当组件从容器中被移除时，会生成该类的事件对象。`ContainerEvent`\
  \ 类定义了两个常量：`COMPONENT_ADDED` 和 `COMPONENT_REMOVED`。这些常量用于识别容器事件。\n\n`ContainerEvent`\
  \ 类包含以下构造函数：\n\n```\nContainerEvent(Component source, int id, Component obj)\n```\n\
  \n在此语法中，`source` 代表生成事件的 `Component` 对象。在这种情况下，组件是容器。整数变量 `id` 代表生成的事件类型。`obj` 对象代表从容器中被移除的组件。\n\
  \n`ContainerEvent` 类包含以下方法：\n\n### getContainer()\n\n`getContainer()` 方法返回生成事件的\
  \ `Container` 对象。使用 `getContainer()` 的语法如下：\n\n```\nContainer getContainer( )\n\
  ```\n\n### getChild()\n\n`getChild()` 方法返回从容器中被移除的 `Component` 对象。使用 `getChild()`\
  \ 的语法如下：\n\n```\nComponent getChild( )\n```\n\n# WindowEvent 类\n\n当窗口对象激活、取消、最小化、恢复最大、打开、关闭、获得焦点、丢失焦点或即将关闭时，会生成\
  \ `WindowEvent` 的事件对象。为了识别这些事件，`WindowEvent` 类定义了以下整数常量：\n\n1. `WINDOW_ACTIVATED`\n\
  2. `WINDOW_DEACTIVATED`\n3. `WINDOW_ICONIFIED`\n4. `WINDOW_DEICONIFIED`\n5. `WINDOW_OPENED`\n\
  6. `WINDOW_CLOSED`\n7. `WINDOW_CLOSING`\n8. `WINDOW_GAINED_FOCUS`\n9. `WINDOW_LOST_FOCUS`\n\
  10. `WINDOW_STATE_CHANGED`\n\n`WindowEvent` 类包含以下构造函数：\n\n```\nWindowEvent(Window\
  \ source, int id)\n```\n\n\n\n在该语法中，`source` 代表产生事件的 `Window` 对象，整数变量 `id` 代表事件的类型。\n\
  \n```\nWindowEvent(Window source, int id, int previousstate, int newstate)\n```\n\
  \n在该语法中，`source` 代表产生事件的 `Window` 对象，整数变量 `id` 代表事件的类型。在这种情况下，事件类型为 `WINDOW_STATE_CHANGED`。整数变量\
  \ `previousstate` 和 `newstate` 分别代表之前的窗口状态和新的窗口状态。\n\n```\nWindowEvent(Window source,\
  \ int id, Window opponent)\n```\n\n在该语法中，`source` 代表产生事件的 `Window` 对象。整数变量 `id`\
  \ 代表事件的类型。`Window` 类的 `opponent`` 对象代表包含在窗口事件中的另一个窗口。\n\n```\nWindowEvent(Window\
  \ source, int id, Window opponent, int previousstate, int newstate)\n```\n\n在该语法中，`source`\
  \ 代表产生事件的 `Window` 对象。整数变量 `id` 代表事件的类型。`opponent` 对象代表包含在窗口事件中的另一个窗口。整数变量 `previousstate`\
  \ 和 `newstate` 分别代表之前的窗口状态和新的窗口状态。\n\n## WindowEvent 类\n\n`WindowEvent` 类包含以下方法：\n\
  \n### getWindow()\n`getWindow()` 方法返回产生事件的 `Window` 对象。使用 `getWindow()` 方法的语法如下：\n\
  \n```\nWindow getWindow( )\n```\n\n### getOppositeWindow()\n`getOppositeWindow()`\
  \ 方法返回包含在窗口事件中的相反窗口。使用 `getOppositeWindow()` 方法的语法如下：\n\n```\nWindow getOppositeWindow(\
  \ )\n```\n\n### getOldState()\n`getOldState()` 方法返回窗口之前的状态。使用 `getOldState()` 方法的语法如下：\n\
  \n```\nint getOldState( )\n```\n\n### getNewState()\n`getNewState()` 方法返回窗口的新状态。使用\
  \ `getNewState()` 方法的语法如下：\n\n```\nint getNewState( )\n```\n\n## 事件源\n\n事件源基本上是产生事件的图形用户界面（GUI）组件。一些主要的\
  \ GUI 组件如下：\n\n1. `Button`（按钮）\n2. `TextField`（文本框）\n3. `TextArea`（文本区域）\n4. `Lists`（列表）\n\
  5. `Choice lists`（选择列表）\n6. `Check Boxes`（复选框）\n7. `Scroll Bars`（滚动条）\n8. `Menu\
  \ Items`（菜单项）\n\n你将在下一章学习更多关于这些组件以及许多相关概念。\n\n## 创建事件监听器\n\n在本章上一节中，你学习了事件监听器。在本节中，你将学习如何创建这些事件监听器。你可以通过实现\
  \ `java.awt.event` 包定义的定义或多个接口来创建事件监听器。\n\n### ActionListener 接口\n`ActionListener`\
  \ 接口专门用于处理按钮点击等动作事件。该接口定义了以下方法：\n\n```\nvoid actionPerformed(ActionEvent eventobj)\n\
  ```\n\n每当发生动作事件时，事件源就会调用 `actionPerformed()`，事件对象 `eventobj` 作为参数传递给该方法。方法体包含语句，指定了当动作事件发生时应该执行的任务。\n\
  \n### ItemListener 接口\n`ItemListener` 接口专门用于处理项目事件，例如选中复选框、从选择列表中选择项目等。该接口定义了以下方法：\n\
  \n```\nvoid itemStateChanged(ItemEvent eventobj)\n```\n\n每当发生项目事件时，事件源就会调用 `itemStateChanged()`，事件对象\
  \ `eventobj` 作为参数传递给该方法。\n\n### AdjustmentListener 接口\n`AdjustmentListener` 接口专门用于处理调整事件。该接口定义了以下方法：\n\
  \n```\nvoid itemValueChanged(AdjustmentEvent eventobj\n\n```\n\n当发生调整事件时，事件源就会调用\
  \ ` `ValueChanged()`，事件对象 `eventobj` 作为参数传递给该方法。\n\n### ComponentListener 接口\n`ComponentListener`\
  \ 接口专门用于处理组件调整大小、移动等隐藏事件。该接口定义了以下方法：\n\n```\nvoid componentResized(ComponentEvent\
  \ eventobj)\nvoid componentMoved(ComponentEvent eventobj)\nvoid componentShown(ComponentEvent\
  \ eventobj)\nvoid componentHidden(ComponentEvent eventobj)\n```\n\n每当组件被调整、、、显示或隐藏时，，发生事件事件事件。obj`\
  \ 作为参数传递给该方法。\n\n### ContainerListener 接口\n`ContainerListener` 接口专门用于处理向容器的容器事件。该接口定义了以下方法：\n\
  \n```\nvoid componentAdded(ContainerEvent eventobj)\nvoid componentRemoved(ContainerEvent\
  \ eventobj)\n```\n\n每当组件被添加到或从容器中移除时，发生容器事件。事件源就会调用相应的方法，`eventobj` 作为参数传递给该方法。\n\
  \n### KeyListener 接口\n`KeyListener` 接口专门用于处理按键事件，如按下、释放和 `Typed`。该接口定义了以下三个方法：\n\
  \n```\nvoid keyPressed(KeyEvent eventobj)\nvoid keyReleased(KeyEvent eventobj)\n\
  void keyTyped(KeyEvent eventobj)\n```\n\n每当发生按键事件时，事件源就会调用相应的方法，事件对象 `eventobj`\
  \ 作为参数传递给该方法。\n\n### FocusListener 接口\n`FocusListener` 接口专门用于处理焦点事件，例如焦点获取和丢失。该接口定义了以下两个方法：\n\
  \n```\nvoid focusGained(FocusEvent eventobj)\nvoid focusLost(FocusEvent eventobj)\n\
  ```\n\n### MouseListener 接口\n`MouseListener` 接口专门用于处理鼠标点击、按下、释放等事件。该接口定义了以下五个方法：\n\
  \n```\nvoid mouseEntered(MouseEvent eventobj)\nvoid mousePressed(MouseEvent eventobj)\n\
  void mouseReleased(MouseEvent eventobj)\nvoid mouseExited(MouseEvent eventobj)\n\
  void mouseClicked(MouseEvent eventobj)\n```\n\n### MouseMotionListener 接口\n`MouseMotionListener`\
  \ 接口专门用于处理鼠标移动和拖拽等鼠标移动事件。该接口定义了以下两个方法：\n\n```\nvoid mouseMoved(MouseEvent eventobj)\n\
  void mouseDragged(MouseEvent eventobj)\n```\n\n### WindowListener 接口\n`WindowListener`\
  \ 接口专门用于处理窗口事件，例如窗口激活、去激活、最小化、恢复、关闭等。该接口定义了以下七个方法：\n\n```\nvoid windowActivated(WindowEvent\
  \ eventobj)\nvoid windowDeactivated(WindowEvent eventobj)\nvoid windowIconified(WindowEvent\
  \ eventobj)\nvoid windowDeiconified(WindowEvent eventobj)\nvoid windowOpened(WindowEvent\
  \ eventobj)\nvoid windowClosed(WindowEvent eventobj)\nvoid windowClosing(WindowEvent\
  \ eventobj)\n```\n\n### TextListener 接口\n`TextListener` 接口专门用于处理文本事件，例如文本区域中的文本改变。该接口定义了以下方法：\n\
  \n```\nvoid textChanged(TextEvent eventobj)\n```\n\n注意：你将在下一章学习更多这些方法的实现。\n\n##\
