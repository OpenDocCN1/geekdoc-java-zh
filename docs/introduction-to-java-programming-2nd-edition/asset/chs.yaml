  \ F, 12. T\n\n![17341.jpg](img/17341.jpg)\n\n## Java 基础元素\n\n### 学习目标\n完成本章后，你将能够：\n\
  * 理解标识符的概念\n* 理解关键字的概念\n* 理解数据类型的概念\n* 理解转义序列\n* 理解变量的概念\n* 理解类型转换的概念\n* 理解运算符的概念\n\
  * 理解命令行参数的概念\n\n### 引言\n在本章中，你将学习 Java 的基础元素，例如标识符、关键字、字面量、数据类型、变量、运算符等。标识符是包、类、接口、方法或变量的。字面量是表示存储在变量中的固定值的表示法。元素的数据类型指定了存储在其中的数据类型以及数据元素可以包含的值的范围。变量是一个可以存储数据的命名存储位置。运算符定义为表示操作的符号。在本章中，你还将学习类型转换的概念。\n\
  \n### 标识符（注：此处原文为 Identifiers，下文统一译为标识符，此处保持逻辑一致性）\nJava 的所有组件都需要名称。因此，标识符是包、类、接口、方法或变量的名称。要命名一个标识符，必须遵循某些规则。这些规则如下：\n\
  \na. 标识符必须以字母 (A-Z, a-z) 或下划线 (`_`) 或美元符号 (`$`) 开头，不能与数字开头。\nb. 在第一个字符之后，标识符可以是字母或数字的任何字符组合，但除了下划线\
  \ (`_`) 和美元符号 (`$`) 之外不能有特殊字符。\nc. Java 是大小敏感的，因此编译器会将大小写字母分开对待，例如 `Cadcim` 和 `CADCIM`\
  \ 是两个不同的标识符。\nd. Java 关键字不能作为标识符。\n\n以下变量名在 Java 中是有效的：\n`idname_6`\n`id_name`\n\
  `_idname`\n\n以下变量名在 Java 中是无效的：\n`6_idname` // 以数字开头\n`idname#` // 使用了特殊字符 (`#`)，如\
  \ %, *, # 等等。\n`id name` // 使用了空格\n\n### 关键字\nJava 编程语言有一些保留关键字，它们不能作为标识符名称，因为它们对编译器有特殊含义。由于它们在语言中的特定功能，在大多数\
  \ Java 集成开发环境中，关键字会以不同的颜色显示，以便识别。\n\nJava 中有 50 个关键字，列如下：\n`abstract` `assert` `boolean`\
  \ `break` `byte` `case` `catch` `char` `class` `const` `continue` `default` `do`\
  \ `double` `else` `enum` `extends` `final` `finally` `float` `for` `goto` `if` `implements`\
  \ `import` `instanceof` `int` `interface` `long` `native` `new` `package` `private`\
  \ `protected` `public` `return` `short` `static` `strictfp` `super` `switch` `synchronized`\
  \ `this` `throw` `throws` `transient` `try` `void` `volatile` `while`\n\n以下是关于 Java\
  \ 关键字的一些点：\na. `const` 和 `goto` 是保留关键字，但未使用。\nb. 所有关键字都是小写的。\nc. `true`、`false`\
  \ 和 `null` 是字面量，不是关键字。\n\n### 数据类型\n数据类型描述了存储在变量中的值的大小和类型。在任何程序中，你都需要在计算机内存中存储特定类型的数据。编译器应该知道为该特定数据分配多少内存。为了这个目的，使用了数据类型。数据类型的主要作用是指导编译器为特定类型的数据分配特定数量的内存。Java\
  \ 是一种强类型语言，这意味着每种数据类型都是作为语言的一部分预定义的。在 Java 中，数据类型分为三类：\n1. 原始数据类型\n2. 派生数据类型\n3.\
  \ 用户定义数据类型\n\n注意：变量将在本章稍后讨论。\n\n#### 原始数据类型\n原始数据类型是由 Java 编程语言预定义的。这些是基本数据类型。它们是声明类型，用于表示单个值而不是多个值。Java\
  \ 提供了八种原始数据类型，如下：\n* `byte`\n* `short`\n* `int`\n* `long`\n* `float`\n* `double`\n\
  * `char`\n* `boolean`\n\n这八种原始数据类型被分为四类，将在后续讨论。\n\n注意：在 C++ 等大多数语言中，为特定数据类型分配的内存取决于机器架构。但在\
  \ Java 中，所有数据类型的大小都是严格定义的，不依赖于机器架构。\n\n###### 整数\n整数数据类型仅用于不包含任何部分或小数点的数字。换句话说，这种数据类型用于正负符号位整数。在\
  \ Java 中有四种整数类型：`byte`、`short`、`int` 和 `long`。它们之间的区别在于分配的内存量。\n\n表 2-1：整数类型大小\n\
  | 名称 | 大小（字节） | 范围 |\n| :--- | :--- | :--- |\n| `byte` | 1 | -128 到 127 |\n| `short`\
  \ | 2 | -32,768 到 32,767 |\n| `int` | 4 | -2,147,483,648 到 2,147,483,647 |\n| `long`\
  \ | 8 | -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807 |\n\n`byte`\n`byte`\
  \ 是最小的整数类型。它的大小是 8 位（1 字节），范围是从 -128 到 127。它在处理文件或流时有用。\n```java\nbyte var_name;\n\
  ```\n\n`short`\n`short` 数据类型的大小为 16 位（2 字节），范围是从 -32,768 到 32,767。\n```java\nshort\
  \ var_name;\n```\n\n`int`\n在整数中，`int` 是最常用的数据类型。它的大小是 32 位（4 字节），范围是从 -2,147,483,648\
  \ 到 2,147,483,647。除非内存内存，否则它是整数值的默认类型。\n```java\nint var_name;\n```\n\n`long`\n\
  `long` 是最大的存储类型，当 `int` 的范围不够时需要。它的大小是 64 位（8 字节）。\n```java\nlong var_name;\n```\n\
  \n###### 浮点类型\n\n\n\n\n浮点数据类型仅用于那些包含小数点或带有小数部分的数字。这些类型的数字也被称为实数。在 Java 中，定义了两种浮点类型：`float`\
  \ 和 `double`。表 2-2 显示了这两种数据类型的大小和范围。\n\n### 表 2-2 浮点类型及其大小和范围\n\n| 名称 | 大小（字节） |\
  \ 范围（约数） |\n| :--- | :--- | :--- |\n| `float` | 4 | 1.40e-45 到 3.40e+38 |\n| `double`\
  \ | 8 | 4.9e-324 到 1.8e+308 |\n\n### float\n`float` 类型用于单精度值（即小数点后最多包含 8 位数字的值）。`float`\
  \ 数据类型的大小为 32 位（4 字节），范围从 1.40e-45 到 3.40e+38。你可以像下面所示创建一个 `float` 类型的变量：\n\n```java\n\
  float var_name;\n```\n在此语法中，变量 `var_name` 被声明为 `float` 数据类型。\n\n### double\n如名所示，`double`\
  \ 类型用于双精度值（即小数点后最多包含 15 位数字的值）。这种数据类型主要用于科学计算，用户希望结果值具有准确性。`double` 数据类型的大小为 64\
  \ 位，范围从 4.9e-324 到 1.8e+308。你可以像下面所示创建一个 `double` 类型的变量：\n\n```java\ndouble var_name;\n\
  ```\n在此语法中，变量 `var_name` 被声明为 double 数据类型。\n\n### 字符\n`char` 类型包含在此类别中。在 Java 中，`char`\
  \ 数据类型用于存储由字母、数字和特殊符号表示的单个字符值。\n\n#### char\n如前所述，`char` 数据类型用于存储属于 Unicode 字符集的字符值。但\
  \ Java 中的 `char` 类型与 `C`、`C++` 等其他编程语言中的 `char` 类型完全不同。在 `C`/`C++` 中，`char` 类型的大小为\
  \ 8 位（1 字节），它只能支持英语、德语等少数字符集。在 Java 中，`char` 类型的大小为 16 位（2 字节），用于存储 Unicode 字符集的值。Unicode\
  \ 字符集是存在于所有人类语言中的字符集合。`char` 类型的范围从 0（最小）到 65,535（最大）。你可以像下面所示创建一个 `char` 类型的变量：\n\
  \n```java\nchar var_name;\n```\n在此语法中，变量 `var_name` 被声明为 `char` 数据类型。\n\n**注意**：赋值给\
  \ `char` 变量的字符应该用单引号 ' ' 包围。\n\n### 布尔\n基本数据类型 `boolean` 属于此类。它可以用于存储真（true）或假（false）。\n\
  \n#### boolean\n这种数据类型只能存储一个值，真或假。`boolean` 数据类型的大小为 1 位。这种数据类型用于存储逻辑值。默认情况下，它返回\
  \ false。你可以像下面所示创建一个 `boolean` 类型的变量：\n\n```java\nboolean var_name;\n```\n在此语法中，变量\
  \ `var_name` 被声明为 `boolean` 数据类型。\n\n### 派生数据类型\n派生数据类型是指其变量可以存储多个相同类型值的数据类型。它们不允许存储不同类型的多个值。它们是用基本数据类型构造的。派生数据类型的示例是数组和字符串。例如：\n\
  \n```java\nint a[]={10, 20, 30}; // 有效数组\nint b[]={10,5,'A'}; // 无效数组\nchar carray[]={'c','a','d','c','i','m'};\
  \ // 有\n```\n\n### 用户定义数据类型\n用户定义数据类型是指其变量可以存储多个相同类型或不同类型值的数据类型。这些类型由程序员利用语言的适当特性定义。一些用户定义数据类型是类和接口。\n\
  \n**注意**：你将在后面的章节中学习数组、字符串、类和接口。\n\n### 转义序列\n转义序列是用于向设备或程序发送命令的字符序列。这些字符前面有一个反斜杠\
  \ `\\`，它被称为转义字符。这些字符不仅用于文本格式化，还具有特殊用途。表 2-3 显示了 Java 中使用的转义序列列表。\n\n#### 表 2-3 转义序列列表\n\
  | 转义序列 | 说明 |\n| :--- | :--- |\n| `\\t` | 插入制表符 |\n| `\\\\` | 插入反斜杠 |\n| `\\'` |\
  \ 插入单引号 |\n| `\\\"` | 插入双引号 |\n| `\\r` | 插入回车 |\n| `\\n` | 插入换行 |\n| `\\b` | 插入退格\
  \ |\n| `\\f` | 插入分页符 |\n\n### 示例 1\n以下程序将显示转义序列字符的使用。\n\n```java\n//写一个程序显示转义序列字符的使用\n\
  class Escape {\n    public static void main(String[] args) {\n        System.out.println(\"\
  Tab\\tContent\");\n        System.out.println(\"Backslash: \\\\Backslas\");\n  \
  \      System.out.println(\"Single quote: \\\\'\");\n        System.out.println(\"\
  Double quote: \\\\\\\"\");\n        System.out.println(\"Carriage return\\rNext\
  \ line\");\n        System.out.println(\"New line\\nNext line\");\n        System.out.println(\"\
  Backspace\\bText\");\n        System.out.println(\"Form feed\\fText\");\n    }\n\
  }\n```\n\n#### 解释\n- **1 行**：`class Escape`。在此处，`class` 关键字用于定义一个类，`Escape` 是类名。\n\
  - **2 行**：`public static void main(String[] args)`。此行包含 `main()` 方法，它是程序的起点。程序的执行从该行开始。\n\
  - **3 行**：`System.out.println(\"Tab\\tContent\");`。这一行将显示：\n  `Tab     Content`\n\
  - **4 行**：`System.out.println(\"Backslash: \\\\Backslas\");`。这一行将显示：\n  `Backslash:\
  \ \\Backslas`\n- **5 行**：`System.out.println(\"Single quote: \\\\'\");`。这一行将显示：\n\
  \  `Single quote: '`\n- **6 行**：`System.out.println(\"Double quote: \\\\\\\"\");`。这一行将显示：\n\
  \  `Double quote: \"`\n- **7 行**：`System.out.println(\"Carriage return\\rNext line\"\
  );`。这一行将显示：\n  `Carriage return`\n  `Next line`\n- **8 行**：`System.out.println(\"\
  New line\\nNext line\");`。这一行将显示：\n  `New line`\n  `Next line`\n- **9 行**：`System.out.println(\"\
  Backspace\\bText\");`。这一行将显示：\n  `BackText`（退格删除了 Backspace）\n- **10 行**：`System.out.println(\"\
  Form feed\\fText\");`。这一行将显示：\n  `Form feed`\n  `Text`（分页符）\n\n\n\n在此语法中，`var1`、`var2`\
  \ 和 `var3` 被声明为特定数据类型的变量，该数据类型由 `data_type` 表示。在这里，所有三个变量都是相同的数据类型。\n\n例如：\n\n```\n\
  float highest_temp, lowest_temp;\n```\n\n在这个示例中，`highest_temp` 和 `lowest_temp` 被声明为\
  \ `float` 类型变量。\n\n### 变量初始化\n\n初始化意味着为变量分配一个初始值。你可以使用赋值运算符（`=`）为变量赋值。赋值运算符将在本章稍后进行讨论。初始化变量的语法如下：\n\
  \n```\ndata_type var_name = value;\n```\n\n在此语法中，`data_type` 指定数据的类型，`var_name`\
  \ 指定变量的名称，而 `value` 指定初始值，该初始值被赋值给变量 `var_name`。\n\n例如：\n\n```\nchar ch = ‘y’;\n\
  ```\n\n在这个示例中，字符值 `y` 被作为初始值赋值给字符变量 `ch`。现在，字符值 `y` 被存储在由变量 `ch` 所指的内存位置上。\n\n###\
  \ 动态初始化变量\n\n在上一节中，你已经学习了变量在声明时初始化。在 Java 中，你也可以动态地初始化变量（在程序执行时）。\n\n例如：\n\n```\n\
  int sum=a+b;\n```\n\n当执行此语句时，首先在加法运算符（`+`）的帮助下加上变量 `a` 和 `b` 的值。接下来，将结果赋值给整数变量 `sum`。\n\
  \n**注意**\n\n本将在稍后讨论所有的运算符。\n\n### 示例 2\n\n以下程序说明了变量动态初始化的概念。该程序将计算三个数的平均值，将结果赋值给另一个变量，并在屏幕上显示。\n\
  \n```java\n//写一个程序计算三个数的平均值\n1 class average\n2 {\n3 public static void main(String\
  \ arg[])\n4 {\n5 int a=10, b=14, c=33;\n6 float avg;\n7 avg= (a+b+c)/3; //动态初始化变量\
  \ avg\n8 System.out.println(“The average of three numbers is: ” +avg);\n9 }\n10\
  \ }\n```\n\n#### 解析\n\n**第 5 行**\n`int a=10, b=14, c=33;`\n在此行中，`a`、`b` 和 `c` 被声明为整数类型变量，并在赋值运算符（`=`）的帮助下分别将初始值\
  \ `10`、`14` 和 `33` 赋值给它们。\n\n**第 6 行**\n`float avg;`\n在此行中，`avg` 被声明为 `float` 类型变量。\n\
  \n**第 7 行**\n`avg=(a+b+c)/3;`\n此行代表变量 `avg` 的动态初始化。在此行中，首先相加变量 `a`、`b` 和 `c` 的值\
  \ `10`、`14` 和 `33`。之后，将结果 `57` 除以 `3`。接下来，在执行时将结果值 `19.0` 赋值给变量 `avg`。\n\n**第 8\
  \ 行**\n`System.out.println(“The average of three numbers is:” +avg);`\n此行将在屏幕上显示以下内容：\n\
  `The average of three numbers is: 19.0`\n\n**注意**\n\n在第 8 行，`+` 号用于将变量 `avg` 的值连接到给定的字符串。\n\
  \n示例 2 的输出如图 2-2 所示。\n\n![C02SC002.tif](img/C02SC002_fmt.jpeg)\n\n图 2-2 示例 2 的输出\n\
  \n### 变量类型\n\nJava 中有以下四种变量：\n\na. 局部变量\nb. 实例变量\nc. 类/静态变量\nd. 方法参数变量\n\n#### 局部变量\n\
  \n在代码块内部或方法（或构造函数）体内声明的变量被称为局部变量。\n\n局部变量遵循的限制有：\n\n- 它们具有局部作用域；不能在定义的块之外访问。这些变量仅在该特定块内可访问。\n\
  - 局部变量不能使用访问修饰符。\n- 局部变量没有默认值。这些变量在第一次使用之前应该声明并为它们分配初始值。\n\n例如：\n\n```java\nint\
  \ mul( )\n{\nint a=10, b=10, c;\nc=a*b;\n}\n```\n\n在这个示例中，`mul()` 是一个方法，变量 `a`、`b`\
  \ 和 `c` 声明在其内部。这些变量是该方法的局部变量，只能在该方法内进行访问或操作。你将在后面的章节中学习方法、构造函数或访问修饰符。\n\n#### 实例变量\n\
  \n在类内部但在方法外部声明的变量被称为实例变量。它与类的单个实例相关。这些变量可以被类的不同方法使用。它们也被称为成员变量，且没有声明为 `static`。\n\
  \n例如：\n\n```java\nclass Demo\n{\npublic static void main(String arg[])\n{\nint a,\
  \ b;\n----------;\n}\n}\n```\n\n在这个示例中，变量 `a` 和 `b` 声明在类内部但在方法外部，因此是实例变量，可以被类的不同方法使用。\n\
  \n#### 类/静态变量\n\n类变量与实例变量相同，不同之处它们声明了 `static` 关键字。这些变量是类级别的。无论类实例化多少次，都只存在拷贝。你将在后面的章节中学习静态数据。\n\
  \n例如：\n\n```java\nclass Demo\n{\npublic static void main(String arg[])\n{\nstatic\
  \ int a, b;\n----------;\n}\n}\n```\n\n在这个示例中，`a` 和 `b` 被声明为 `static`，因此它们是类变量。\n\
  \n#### 方法参数变量\n\n方法参数变量是在方法签名中声明的变量。与局部变量一样，它们没有默认值。因此，应该为其分配初始值，否则编译器将报错。\n\n例如：\n\
  \n```java\nvoid demo_method( int a, int b)\n{\n-----------;\n}\n```\n\n在这个示例中，`demo_method()`\
  \ 是一个方法，`a` 和 `b` 是该方法的参数。正如你知道 `public static void main(String[] arg)` 是程序的入口，变量\
  \ `arg` 是该方法的参数。要记住的重要点是，参数始终被分类为“变量”而非“字段”。\n\n### 变量的作用域与生命周期\n\n变量的作用域是指可以对其访问和操作的程序部分。作用域还规定了何时分配或释放变量内存。生命周期规定了变量在内存中的生存时间。\n\
  \n### 类型转换\n\n类型转换意味着将一种数据类型转换为另一种数据类型，也称为类型转换（Type Casting）。例如，`byte` 类型的数据元素可以通过类型转换转换为\
  \ `int` 类型。Java 支持以下两种类型的转换：\n\na. 隐式转换（宽幅转换）\nb. 显式转换（窄收转换）\n\n#### 隐式转换（宽幅转换）\n\
  \n当目标数据类型大于源数据类型且两种数据类型兼容时，发生隐式转换。它也被称为自动转换。例如，`short` 类型的数据元素转换为 `int` 类型。在这种情况下，Java\
  \ 执行隐式转换，因为 `int` 数据类型大于 `short` 类型，且两种数据类型兼容。在隐式转换中，转换过程中不会丢失信息。\n\n示例 3\n\n\n\n\
  以下程序将利用隐式类型转换的概念将 `byte` 类型的数据元素转换为 `int` 类型，并在屏幕上显示结果。\n\n```java\n//Write a program\
  \ to convert a data element of byte type into the integer type\nclass Type_demo\
  \ {\n    public static void main(String arg[]) {\n        byte src=127;\n      \
  \  int dest;\n        dest= src;\n        System.out.println(“dest = ” +dest);\n\
  \    }\n}\n```\n\n#### Explanation\n\n**第 5 行**\n`byte src=127;`\n在这一行中，`src` 被声明为\
  \ `byte` 类型变量，并将 `127` 赋值为它的初始值。\n\n**第 6 行**\n`int dest;`\n在这一行中，`dest` 被声明为整数类型变量。\n\
  \n**第 7 行**\n`dest= src;`\n在这一行中，发生了隐式转换，变量 `src` 的值 `127` 被赋值给整数类型变量 `dest`。\n\n\
  **第 8 行**\n`System.out.println(“dest = ” +dest);`\n这一行将在屏幕上显示以下内容：\n`dest = 127`\n\
  \n示例 3 的输出如图 2-3 所示。\n\n![C02SC003.tif](img/C02SC003_fmt.jpeg)\n图 2-3 示例 3 的输出\n\
  \n### 显式转换（窄转换）\n\n在前面的节中，你学习了目标类型大于源类型的类型转换。但有时你可能需要将一个较大的元素类型转换为较小的类型。例如，你可能需要将\
  \ `int` 类型转换为 `byte` 类型。在这种情况下，就会使用显式转换。在显式类型转换中，某些信息总是丢失。因此，这种转换也被称为窄转换。显式转换的语法如下：\n\
  \n`(destination_data_type) value`\n\n在此语法中，`destination_data_type` 指定了你想要转换的值的数据类型，该值由\
  \ `value` 指定。\n\n**提示**\n显式转换的法则是两边都应该存在相同的数据类型。\n\n例如，你可以将 `int` 类型的值转换为 `byte`\
  \ 类型，如下所示：\n\n```java\nbyte b;\nint i =300;\nb = (byte) i;\n```\n\n在这个示例中，括号中的 `byte`\
  \ 指导编译器将整数类型 `i` 的值转换为 `byte` 类型。现在，将结果值赋值给字节型变量 `b`。\n\n### 示例 4\n\n以下程序将利用显式类型转换的概念将\
  \ `int` 类型转换为 `byte` 类型，并在屏幕上显示结果值：\n\n```java\n//Write a program to convert an\
  \ int type into a byte type\nclass Explicit_demo {\n    public static void main(String\
  \ arg[]) {\n        byte b;\n        int val = 300;\n        b = (byte) val;\n \
  \       System.out.println(“After conversion, value of b is: ” +b);\n    }\n}\n\
  ```\n\n#### Explanation\n\n**第 5 行**\n`byte b;`\n在这一行中，变量 `b` 被声明为 `byte` 数据类型。\n\
  \n**第 6 行**\n`int val = 300;`\n在这一行中，`val` 被声明为整数类型变量，并将 `300` 赋值为它的初始值。\n\n**第\
  \ 7 行**\n`b = (byte) val;`\n在这一行中，变量 `val` 的值被转换为 `byte`，因为 `byte` 是目标类型，结果值将被赋值给变量\
  \ `b`。\n\n**第 8 行**\n`System.out.println(“After conversion, value of b is: ” +b);`\n\
  这一行将在屏幕上显示以下内容：\n`After conversion, value of b is: 44`\n\n示例 4 的输出如图 2-4 所示。\n\n\
  ![C02SC004.tif](img/C02SC004_fmt.jpeg)\n图 2-4 示例 4 的输出\n\n**注意**\n`boolean` 值不能赋值给任何其他数据类型。`Boolean`\
  \ 与转换之间是不兼容的。`Boolean` 值只能赋值给另一个 `boolean`。\n\n### 运算符\n\n运算符被定义为在对变量或常量执行操作时使用的符号。Java\
  \ 提供了丰富的运算符，这些运算符被分为不同的类别，如下：\n\na. 一元运算符\nb. 算术运算符\nc. 位运算符\nd. 关系运算符\ne. 逻辑运算符\n\
  f. 赋值运算符\ng. 杂运算符\n\n### 一元运算符\n\n只需要一个操作数的运算符被称为一元运算符。表 2-4 列出了 Java 中用到的所有一元运算符。\n\
