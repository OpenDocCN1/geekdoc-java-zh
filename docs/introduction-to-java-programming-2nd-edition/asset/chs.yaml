  \ 7 行**\n`b = (byte) val;`\n在这一行中，变量 `val` 的值被转换为 `byte`，因为 `byte` 是目标类型，结果值将被赋值给变量\
  \ `b`。\n\n**第 8 行**\n`System.out.println(“After conversion, value of b is: ” +b);`\n\
