  \ 被赋值为 `obj1` 实例变量 `height` 的初始值。\n\n第 15 行\n```java\nCylinder1 obj2 = obj1;\n```\n\
  在此行中，对象引用变量 `obj1` 被赋值给 `obj2`，这意味着 `obj1` 和 `obj2` 指向同一个对象。此外，它们将共享同一份实例变量副本。\n\
  \n第 16 行到第 19 行的工作原理分别相同第 18 行和第 19 行。\n\n第 20 行\n```java\nobj2.radius = 15;\n```\n\
  在此行中，`15` 被赋值为 `obj2` 实例变量 `radius` 的初始值。\n\n第 21 行\n```java\nobj2.height = 32.5;\n\
  ```\n在此行中，`32.5` 被赋值为 `obj2` 实例变量 `height` 的初始值。\n\n第 22 行到 25 行的工作原理分别相同第 18 行和第\
  \ 19 行。\n\n### 方法\n\n在本章中，你已经学习了类包含实例变量和方法。现在在本节中，你将更多地学习方法。方法是执行特定任务的语句组。方法对数据进行操作。\n\
  \n#### 定义方法\n\n定义方法的语法如下：\n\n```java\naccess_specifier return_type method_name(list\
  \ of arguments)\n{\n    body of the method;\n}\n```\n\n在此语法中，`access_specifier`\
  \ 代表访问修符，可以是 `public`、`private` 或 `protected`。`return_type` 指定方法返回的数据类型。如果方法不返回任何值，则\
  \ `return_type` 应为 `void`。`method_name` 指定方法的名称。方法的名称应该是有效的标识符。括号内的参数列表代表标识符及其类型，用逗号分隔。当调用方法时，这些参数将传递给方法。大括号\
  \ `{}` 表示方法体的开始和结束，在调用时需要执行方法体。注意，每当调用特定方法时，它都会执行相同的任务。方法体内的下一个语句是 `return` 语句。该值代表方法返回的值。该语句仅用于具有某种返回类型的方法。\n\
  \n例如：\n```java\npublic void cylinder_volume( )\n{\n    double volume = pi * (obj1.radius*obj1.radius)\
  \ * obj1.height;\n    System.out.println“Volume is: ” +volume);\n}\n```\n在此示例中，`cylinder_volume(\
  \ )` 方法的返回类型为 `void`，这意味着在调用时不返回任何值。括号也是空的，因为在调用时没有传递任何值。\n\n#### 调用方法\n\n调用方法的语法如下：\n\
  \n```java\nobj_name.method_name(list of values);\n```\n\n在此语法中，`method_name` 指定由\
  \ `obj_name` 代表的相关对象调用的方法。值列表代表传递给方法定义中参数列表中标识符的值。\n\n\n\n\n\n```java\n10 }\n11\
  \ }\n12 class Cylinder1_demo\n13 {\n14 public static void main(String arg[ ])\n\
  15 {\n16 Cylinder1 obj1 = new Cylinder1( );\n17 Cylinder1 obj2 = new Cylinder1(\
  \ );\n18 obj1.radius = 13.5;\n19 obj1.height = 30;\n20 obj1.cylinder_volume( );\n\
  21 obj2.radius = 15.5;\n22 obj2.height = 10.5;\n23 obj2.cylinder_volume( );\n24\
  \ }\n25 }\n```\n\n#### 解析\n\n#### 第 5 行\n`public void cylinder_volume( )`\n在这一行中，`void`\
  \ 是一个返回类型，表示该方法不会返回任何值。`cylinder_volume()` 是方法的名称。\n\n#### 第 7 行\n`double volume,\
  \ pi = 3.14;`\n在这一行中，`volume` 和 `pi` 被声明为 `double` 类型变量，`3.14` 被赋值给 `pi` 作为初始值。\n\
  \n#### 第 8 行\n`volume = pi * (radius*radius) * height;`\n在这一行中，`radius` 和 `height`\
  \ 变量将使用调用 `cylinder_volume()` 方法的对象的实例变量的值。\n\n#### 第 20 行\n`obj1.cylinder_volume(\
  \ )`\n在这一行中，对 `obj1` 对象调用了 `cylinder_volume()` 方法。现在，控制转移到方法定义处并执行与其相关的语句。\n\n####\
  \ 第 23 行\n`obj2.cylinder_volume( )`\n在这一行中，对 `obj2` 对象调用了 `cylinder_volume()` 方法。现在，控制转移到函数定义处并执行与其相关的语句。\n\
  \n示例 4 的输出如图 4-6 所示。\n\n![C04SC004.tif](img/C04SC004_fmt.jpeg)\n图 4-6 示例 4 的输出\n\
  \n### 返回值的方法\n\n在上一个示例中，所有操作都是在 `cylinder_volume()` 方法定义内部执行的，它没有向调用者返回任何值。在这种情况下，你使用另一种调用方法的方法。在这个过程中，`cylinder_volume()`\
  \ 方法将在其定义内部计算体积，然后将结果返回给调用者。\n\n例如：\n```java\npublic double cylinder_volume( )\n\
  {\n    return pi * (radius*radius) * height;\n}\n```\n\n在这个示例中，首先在方法定义内部计算体积。接下来，通过\
  \ `return` 语句将结果返回给调用者。\n\n**注意**\n在这些类型的方法中，方法的返回类型应与方法返回的数据类型兼容。此外，接收方法返回值的变量类型也应与方法指定的返回类型兼容。\n\
  \n### 示例 5\n\n以下示例展示了返回值的方法的工作。程序将计算给定尺寸圆柱的体积并在屏幕上显示结果。\n\n```java\n//编写计算圆柱体积的程序\n\
  1 class Cylinder2\n2 {\n3 double radius;\n4 double height;\n5 double pi =3.14;\n\
  6 public double cylinder_volume( )\n7 {\n8 return pi * (radius*radius) * height;\n\
  9 }\n10 }\n11 class Cylinder2_demo\n12 {\n13 public static void main(String arg[\
  \ ])\n14 {\n15 Cylinder2 obj1 = new Cylinder2( );\n16 Cylinder2 obj2 = new Cylinder2(\
  \ );\n17 double volume;\n18 obj1.radius = 13.5;\n19 obj1.height = 30;\n20 volume\
  \ = obj1.cylinder_volume( );\n21 System.out.println(“Volume is: ” +volume);\n22\
  \ obj2.radius = 15.5;\n23 obj2.height = 10.5;\n24 volume = obj2.cylinder_volume(\
  \ );\n25 System.out.println(“Volume is: ” +volume);\n26 }\n27 }\n```\n\n#### 解析\n\
  \n#### 第 6 行到第 9 行\n```java\npublic double cylinder_volume( )\n{\n    return pi\
  \ * (radius*radius) * height;\n}\n```\n这些行包含了 `cylinder_volume()` 方法的定义。在这里，方法的返回类型是\
  \ `double`，这意味着该方法返回的是 `double` 类型。在定义内部，首先计算圆柱的体积，然后将结果返回给调用者。\n\n#### 第 20 行\n\
  `volume = obj1.cylinder_volume( );`\n在这一行中，对 `obj1` 对象调用了 `cylinder_volume()` 方法。接下来，控制转移到方法定义（第\
  \ 6 行到第 9 行）。在函数定义内部，使用 `obj1` 的值（13.5 和 30）计算体积。方法通过 `return` 语句返回结果（17167.95）。接下来，将结果赋值给\
