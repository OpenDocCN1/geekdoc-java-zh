  \ `temp` 对象的实例变量 `x`。然后，`square()` 方法返回 `temp` 对象。结果引用赋值给第 24 行的 `obj2`。\n\n###\
  \ 将数组传递给方法\n\n与变量和对象一样，你也可以将数组作为参数传递给方法。在这种情况下，传递的是数组的引用。如果在方法体内部对传递的数组进行任何更改，原始数组也会受到影响。你可以通过简单在方法括号内传递名称来传递数组。\n\
  \n例如：\n\n```java\nint arr[ ] = {10, 20, 30, 40};\nDemo obj1 = new Demo( );\nobj1.sum(arr);\n\
  ```\n在这个示例中，通过在方法括号内编写名称将整数类型数组 `arr[]` 作为参数传递给 `sum()` 方法。\n\n### 示例 9\n\n以下示例说明了将数组传递给方法的概念。程序将计算前五个奇数的平方，并在屏幕上显示结果值。\n\
  \n```java\n//写一个程序计算前五个奇数的平方\n1 class Square\n2 {\n3 int result;\n4 void sqr(int\
  \ a[])\n5 {\n6 for(int i=0; i<a.length; i++)\n7 {\n8 result = a[i]*a[i];\n9 System.out.println(“Square\
  \ of ”+a[i]+ “ is: ”+result);\n10 }\n11 }\n12 }\n13 class PassArray\n14 {\n```\n\
  \n\n\n\n\n```java\n15 public static void main(String arg[])\n{\n    int i;\n   \
  \ int numbers[] = {1, 3, 5, 7, 9};\n    Square obj1 = new Square( );\n    obj1.sqr(numbers);\n\
  }\n```\n\n#### 解释\n\n#### 第 6 行\n`for(int i=0; i<a.length; i++)`\n\n这一行包含 `for`\
  \ 循环。在这一行中，变量 `i`（循环控制变量）被初始化为 `0` 并检查条件 `i<a.length`。在 `i` 变量小于数组 `a` 的长度之前，该条件被求值为真。如果条件为真，控制权将转移到循环内部的语句。当条件求值为假时，循环结束。\n\
  \n#### 第 8 行\n`result = a[i]*a[i];`\n\n在这一行中，数组 `a` 在第 `i` 个索引处的值与其相乘，并将结果结果赋值给\
  \ `result` 变量。\n\n#### 第 18 行\n`int numbers[] = {1, 3, 5, 7, 9};`\n\n在这一行中，`numbers`\
  \ 被声明为整数数组，并将值 `(1, 3, 5, 7 和 9)` 赋值给它的元素。\n\n#### 第 19 行\n`Square obj1 = new Square(\
  \ );`\n\n在这一行中，`obj1` 被声明为 `Square` 类的一个对象。\n\n#### 第 20 行\n`obj1.sqr(numbers);`\n\
  \n在这一行中，调用了 `sqr()` 方法并将整数数组 `numbers` 作为参数传递给它。现在，控制权转移到第 4 行。接下来，数组 `numbers`\
  \ 的引用被赋值给整数数组 `a[]` 并执行与 `sqr()` 方法相关的语句。\n\n示例 9 的输出如图 4-11 所示。\n\n![C04SC009.tif](img/C04SC009_fmt.jpeg)\n\
  \n图 4-11 示例 9 的输出\n\n### 方法重载\n\n在类内部，当你定义两个或多个同相同但参数列表不同的方法时，你就在对方法进行重载。方法重载是 Java\
  \ 中实现多态的一种。在方法重载中，所有重载的方法必须包含不同数量或不同类型的参数。因此，每当调用重载方法时，编译器都会根据参数的类型和/或数量将该特定方法区分开。当找到精确匹配项时，编译器会执行该特定方法的体。\n\
  \n例如：\n\n```java\nclass Demo\n{\n    int i, j;\n    void setvalues()\n    {\n  \
  \      i=0;\n        j=0;\n    }\n    void setvalues(int x, int y)\n    {\n    \
  \    i =x;\n        j =y;\n    }\n}\n```\n\n在这个示例中，`Demo` 类中定义了两个方法，它们都共享相同的名称 `setvalues`。但是，这两个方法都包含不同的参数列表。第一个方法\
  \ `void setvalues()` 的参数列表为空，而另一个方法 `void setvalues(int x, int y)` 包含两个参数。现在，每当调用重载方法\
  \ `setvalues` 时，编译器将根据根据参数的数量和/或类型对它们进行区分：\n\n```java\nobj1.setvalues( );\nobj2.setvalues(10,\
  \ 20);\n```\n\n当执行这些语句时，编译器首先执行不带参数的方法，然后将执行另一个在参数列表中包含两个整数类型变量的方法。\n\n#### 示例 10\n\
  \n以下示例说明了方法重载的概念。该程序将计算给定值的平方，并在屏幕上显示结果。\n\n```java\n//写一个程序来计算给定值的平方\nclass Overload\n\
  {\n    void square( )\n    {\n        System.out.println(\"No parameters\");\n \
  \   }\n    void square(int x)\n    {\n        int result;\n        result = x*x;\n\
  \        System.out.println(\"Square of ” +x+ “ is: ” +result);\n    }\n    void\
  \ square(double x)\n    {\n        double result;\n        result = x*x;\n     \
  \   System.out.println(\"Square of ” +x+ “ is: ” +result);\n    }\n}\nclass Overload_demo\n\
  {\n    public static void main(String arg[])\n    {\n        Overload obj1 = new\
  \ Overload( );\n        Overload obj2 = new Overload( );\n        Overload obj3\
  \ = new Overload( );\n        obj1.square( );\n        obj2.square(10);\n      \
  \  obj3.square(14.5);\n    }\n}\n```\n\n#### 解释\n\n#### 第 24 行到 26 行\n```java\n\
  Overload obj1 = new Overload( );\nOverload obj2 = new Overload( );\nOverload obj3\
  \ = new Overload( );\n```\n\n在这些行中，`obj1`、`obj2` 和 `obj3` 被创建为 `Overload` 类的对象。\n\
  \n#### 第 27 行\n`obj1.square( );`\n\n在这一行中，调用了重载方法 `square()` 且没有传递参数。接下来，编译器将返回类型、参数的数量和/或类型与所有重载方法进行比较。它在第\
  \ 3 行找到了匹配项。\n\n#### 第 28 行\n`obj2.square(10);`\n\n在这一行中，调用了重载方法 `square()` 并传递了整数\
  \ `10` 作为参数。接下来，编译器再次搜索匹配项，在第 7 行找到了匹配，并执行该特定方法的语句。\n\n#### 第 29 行\n`obj3.square(14.5);`\n\
  \n在这一行中，调用了重载方法 `square()` 并传递了双精度值 `14.5` 作为参数。接下来，编译器再次搜索匹配项，在第 13 行找到了匹配，并执行该特定方法的语句。\n\
  \n示例 10 的输出如图 4-11 所示。\n\n### 构造函数\n\n构造函数是类的一种特殊方法，用于在创建对象时对其初始化。它的名称与类相同，且没有返回类型。Java\
  \ 中有三种构造函数，它们如下：\n\n1. **默认构造函数**：无参数的构造函数被称为无参构造函数。\n2. **参数构造函数**：带有参数的构造函数。\n\
  3. **拷贝构造函数**：用于使用另一个对象来初始化。\n\n如果类内部没有定义构造函数，编译器会自动创建一个默认构造函数。\n\n#### 示例 11\n\n\
  以下示例说明了构造函数用法。程序将对给定值执行加法、减法、乘法和除法运算。\n\n```java\nclass Construct\n{\n    int x,\
  \ y;\n    Construct()\n    {\n        x=20;\n        y=15;\n    }\n    int sum()\n\
  \    {\n        int result = x+y;\n        return result;\n    }\n    int subtract()\n\
  \    {\n        int result = x-y;\n        return result;\n    }\n    int multi()\n\
  \    {\n        int result = x*y;\n        return result;\n    }\n    double div()\n\
  \    {\n        double result = x/y;\n        return result;\n    }\n}\nclass Construct_demo\n\
  {\n    public static void main(String arg[])\n    {\n        Construct obj1 = new\
  \ Construct( );\n        int add = obj1.sum();\n        System.out.println(\"Sum\
  \ is: ” +add);\n        int sub = obj1.subtract();\n        System.out.println(\"\
  Subtraction is: ” +sub);\n        int mul = obj1.multi();\n        System.out.println(\"\
  Multiplication is: ” +mul);\n        double div = obj1.div();\n        System.out.println(\"\
  Division is: ” +div);\n    }\n}\n```\n\n\n\n\n\n在此行中，`x` 和 `y` 被声明为 `Construct`\
  \ 类的成员变量。\n\n### 第 4 到 8 行\n```\nConstruct( )//Constructor\n{\n  x=210;\n  y=15;\n\
  }\n```\n这些行包含了 `Construct` 类构造函数的定义。每当创建一个 `Construct` 类的对象时，就会执行该构造函数的体。在函数体内部，实例变量\
  \ `x` 和 `y` 分别初始化为值 210 和 15。\n\n### 第 34 行\n```\nConstruct obj1 = new Construct(\
  \ );\n```\n在此行中，`obj1` 被创建为 `Construct` 类的一个对象。在这里，调用了 `Construct()` 构造函数，它将初始值（210\
  \ 和 15）赋值给 `obj1` 对象实例变量（`x` 和 `y`）的副本。\n\n#### 第 35 行\n```\nint add = obj1.sum(\
  \ );\n```\n在此行中，对 `Construct` 类的对象 `obj1` 调用了 `sum()` 方法。现在，控制权转移到 `sum()` 方法的定义（从第\
  \ 9 到 13 行）。接下来，在定义内部执行加法操作，并将结果值 225 传回此行（第 35 行）。然后，结果值被赋值给整数变量 `add`。\n\n####\
  \ 第 36 行\n```\nSystem.out.println(“Sum is: ” +add);\n```\n此将在屏幕上显示如下：\nSum is: 225\n\
  \n第 37 到 42 行的工作原理与第 35 和 36 行相同。示例 11 的输出显示在图 4-13。\n\n![C04SC011.tif](img/C04SC011_fmt.jpeg)\n\
  图 4-13 示例 11 的输出\n\n### 参数构造函数\n在之前的示例中，当创建 `obj1` 对象时，`Construct()` 构造函数将实例变量 `x`\
  \ 和 `y` 分别初始化为值 210 和 15。同样，每当你创建 `Construct` 类的不同对象时，不同对象的实例变量将被初始化为相同的值 210 和\
  \ 15。但在实践中，创建这些对象时，你可能需要为不同的对象初始化不同的实例变量。在这种情况下，你可以使用参数构造函数。在这些类型的构造函数中，你可以在创建对象时传递参数。\n\
  \n例如：\n```\nclass Demo\n{\n  int i, j;\n  Demo(int x, int y) //Parameterized Constructor\n\
  \  {\n    i = x;\n    j = y;\n  }\n}\n```\n在此示例中，`Demo(int x, int y)` 构造函数表示参数构造函数。现在，每当创建一个\
  \ `Demo` 类的对象时，你需要传递两个整数值作为参数，如下：\n```\nDemo obj1 = new Demo(10,20);\n```\n在该语句中，两个整数值\
