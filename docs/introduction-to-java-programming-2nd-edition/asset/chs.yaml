  \ 9. `this`, 10. `recursion`\n\n# 第 5 章\n\n![1683.jpg](img/1683.jpg)\n![1681.jpg](img/1681.jpg)\
  \ \n\n## 继承\n\n### 学习目标\n完成本章后，你将能够：\n* 理解继承的基础知识\n* 理解访问修饰符的概念\n* 理解 super 关键字的概念\n\
  * 理解方法重写的概念\n* 理解动态方法分发的概念\n* 理解抽象类的概念\n* 理解 final 关键字的概念\n\n### 引言\n在上一章中，你已经学习了面向对象编程的一些特性，例如类、对象等。在本章中，你将学习面向对象编程的另一个重要特性，称为继承（inheritance）。这一特性允许你通过使用现有类的部分或全部特性（实例变量和方法）来创建一个新类。\n\
  \n## 继承的基础\n通过使用另一个类的特性和实现创建一个新类的过程被称为继承。继承另一个类特性的类被称为 `subclass`（子类），而被继承特性的类被称为\
  \ `superclass`（父类）。使用继承的主要优点是代码的可重用，它允许你使用类的预定义方法和/或实例变量来创建一个新类。这样，你就不需要重复编写相同的代码。此外，当子类被创建时，它会在继承自父类的特性基础上添加一些自己的功能。因此，这个子类可以作为后续子类的父类。继承的一个常见例子是父子关系。孩子继承了父母的大部分特性，并添加了一些他自己的特性。\n\
  \n在继承中，`superclass` 充当普通类，它只包含共同的特性。但派生自特定父类的类被定义为专门的类，因为每个子类在继承父类特性的基础上添加了自己特有的特性。\n\
  \n通过类的层次结构可以很好地定义继承。在 Java 中，每个类都继承自一个名为 `Object` 的特定类（`Object` 类属于默认包 `java.lang`）。因此，在类的层次结构中，`Object`\
  \ 类位于层次结构的顶端。在这个层次结构中，父类可以是直接父类，也可以是间接父类。在这个层次结构中，父类可以是直接父类或间接父类。\n\n![1683.jpg](img/1683.jpg)\n\
  *父类的分级表示*\n\n![1681.jpg](img/1681.jpg)\n*继承的层次结构*\n\n### 示例 1\n以下示例说明了继承的概念。程序将计算给定尺寸的方体的体积并显示结果值。\n\
  \n```java\nclass Box\n{\n    double length, width, height;\n    void display( )\n\
  \    {\n        System.out.println(“长度为: ” +length);\n        System.out.println(“宽度为:\
  \ ” +width);\n        System.out.println(“高度为: ” +height);\n    }\n}\n\nclass Volume\
  \ extends Box\n{\n    double result;\n    void volume( )\n    {\n        result\
  \ = length*width*height;\n        System.out.println(“体积为: ” +result);\n    }\n\
  \    public static void main(String arg[])\n    {\n        Volume obj1= new Volume(\
  \ );\n        obj1.length=10.5;\n        obj1.width=12;\n        obj1.height=26.7;\n\
  \        obj1.display( );\n        obj1.volume( );\n    }\n}\n```\n\n#### 解析\n第\
  \ 1 行\n`class Box`\n在这一行中，`Box` 被定义为一个类，没有使用访问修饰符（私、公或保护）。因此，默认访问修饰符分配给了 `Box` 类。现在，在继承过程中，`Box`\
  \ 类的实例变量和方法可以被子类继承。\n\n第 3 行\n`double length, width, height;`\n在这一行中，`length`、`width`\
  \ 和 `height` 被声明为双类型。这些变量被视为 `Box` 类的实例变量。\n\n第 4 到第 9 行\n`void display( )`\n`{`\n\
  `System.out.println(“长度为: ” +length);`\n`System.out.println(“宽度为: ” +width);`\n\
  `System.out.println(“高度为: ” +height);`\n`}`\n这些行包含了 `display( )` 方法的定义。该方法是 `Box`\
  \ 类的成员，用于显示箱体的尺寸。\n\n\n\n\n\n### 第 14 到 18 行\n\n```java\nvoid volume( )\n{\n   \
  \ result = length*width*height; System.out.println(“Volume is: ” +result);\n}\n\
  ```\n\n这些行包含了 `volume()` 方法的定义。该方法是 `Volume` 类的成员。`Box` 类的 `length`、`width` 和 `height`\
  \ 变量被继承，它们的值被相乘。现在，将结果赋值给 `result` 变量并将其显示在屏幕上。\n\n#### 第 21 行\n\n```java\nVolume\
  \ obj1= new Volume( );\n```\n\n在这一行中，`obj1` 被声明为 `Volume` 类的对象。\n\n### 第 22 到 24\
  \ 行\n\n```java\nobj1.length=10.5;\nobj1.width=12;\nobj1.height=26.7;\n```\n\n在这些行中，`Volume`\
  \ 类的对象 `obj1` 了 `Box` 类的三个实例变量 `length`、`width` 和 `height`，并将 `10.5`、`12` 和 `26.7`\
  \ 分别赋值为它们的初始值。\n\n### 第 25 行\n\n```java\nobj1.display( );\n```\n\n在这一行中，`Volume`\
  \ 类的对象 `obj1` 继承了 `Box` 类的成员方法 `display()`。现在，控制转移到了第 5 行的方法定义。\n\n#### 第 26 行\n\
  \n```java\nobj1.volume( );\n```\n\n在这一行中，使用对象 `obj1` 调用了 `Volume` 类的 `volume()`\
  \ 方法。现在，控制转移到了第 14 行的方法定义。\n\n示例 1 的输出如图 5-2 所示。\n\n![C05SC002.tif](img/C05SC002_fmt.jpeg)\n\
  \n图 5-2 示例 1 的输出\n\n### 多级继承\n\n在本章之前的示例中，你可能观察过由父类和子类组成的简单类层次结构。但在本节中，你将学习多级层次结构，即多级继承。在多级继承中，一个子类被用另一个类的父类。\n\
  \n例如：\n\n```java\nclass A\n{\n    ----------;\n    ----------;\n}\n\nclass B extends\
  \ A\n{\n    ----------;\n    ----------;\n}\n\nclass C extends B\n{\n    ----------;\n\
  \    ----------;\n}\n```\n\n在这个示例中，`B` 类充当 `A` 类的子类，`C` 类充当 `B` 类的子类。在这里，`B` 子类充当\
  \ `C` 类的父类。因此，`B` 类继承了 `A` 父类的全部或部分特性，而 `C` 类继承了 `A` 和 `B` 类全部或部分特性。\n\n### 示例 2\n\
  \n下面的示例说明了多级继承的使用。程序将计算学生在所有科目上的得分，并将结果显示在屏幕上。\n\n```java\n//写一个计算学生成绩的程序\nclass\
  \ Rollnumber\n{\n    int roll_num;\n    void get_rollnum(int x)\n    {\n       \
  \ roll_num = x;\n    }\n    void show_rollnum()\n    {\n        System.out.println(“Roll\
  \ Number is: ”+roll_num);\n    }\n}\n\nclass Marks extends Rollnumber\n{\n    double\
  \ math, physics, chemistry;\n    void get_marks(int a, int b, int c)\n    {\n  \
  \      math = a;\n        physics = b;\n        chemistry = c;\n    }\n    void\
  \ show_marks()\n    {\n        System.out.println(“Marks in Mathematics are: ” +math);\n\
  \        System.out.println(“Marks in Physics are: ” +physics);\n        System.out.println(“Marks\
  \ in Chemistry are: ” +chemistry);\n    }\n}\nclass Result extends Marks\n{\n  \
  \  double res;\n    void calculate_result()\n    {\n        res = ((math+physics+chemistry)*100)/300;\n\
  \    }\n    void show_result()\n    {\n        System.out.println(“Total is: ” +res+“%”);\n\
  \    }\n    public static void main(String[] args) \n    {\n        Result obj1\
  \ = new Result();\n        obj1.get_rollnum(101);\n        obj1.get_marks(74, 90,\
  \ 91);\n        obj1.calculate_result();\n        obj1.show_rollnum();\n       \
  \ obj1.show_marks();\n        obj1.show_result();\n    }\n}\n```\n\n#### 解释\n\n\
  在这个示例中，`Marks` 类继承了 `Rollnumber` 父类的特性。现在，`Marks` 子类充当 `Result` 类的父类。所以，`Result`\
  \ 类继承了 `Rollnumber` 和 `Marks` 两个类的特性。\n\n示例 2 的输出如图 5-3 所示。\n\n![C05SC003.tif](img/C05SC003_fmt.jpeg)\n\
  \n图 5-3 示例 2 的输出\n\n### 层级继承\n\n当多个子类从一个父类继承特性时，被称为层级继承。这种继承中只有一个父类。\n\n例如：\n\n\
  ```java\nclass A\n{\n    ----------;\n    ----------;\n}\n\nclass B extends A\n\
  {\n    ----------;\n    ----------;\n}\n\nclass C extends A\n{\n    ----------;\n\
  \    ----------;\n}\n```\n\n在这种继承中，`A` 是父类。\n\n### 示例 3\n\n下面的示例说明了层级继承的使用。程序将计算平方和立方，并将结果显示在屏幕上。\n\
  \n```java\nclass Number\n{\n    int num;\n    void get_num(int x)\n    {\n     \
  \   num = x;\n    }\n    void show_num()\n    {\n        System.out.println(“Number\
  \ is: ”+num);\n    }\n}\n\nclass Square extends Number\n{\n    int square;\n   \
  \ void get_square(int x)\n    {\n        square = x * x;\n    }\n    void show_square()\n\
  \    {\n        System.out.println(“Square is: ” +square);\n    }\n}\n\nclass Cube\
  \ extends Number\n{\n    int cube;\n    void get_cube(int x)\n    {\n        cube\
  \ = x * x * x;\n    }\n    void show_cube()\n    {\n        System.out.println(“Cube\
  \ is: ” +cube);\n    }\n}\n\nclass Hierarchical_demo\n{\n    public static void\
  \ main(String[] args)\n    {\n        Square s = new Square();\n        s.get_num(4);\n\
  \        s.get_square(4);\n        s.show_num();\n        s.show_square();\n\n \
  \       Cube c = new Cube();\n        c.get_num(3);\n        c.get_cube(3);\n  \
  \      c.show_num();\n        c.show_cube();\n    }\n}\n```\n\n#### 解释\n\n在这个示例中，`Number`\
  \ 是父类，`Square` 和 `Cube` 是它的子类。\n\n### 多重继承\n\n当一个类从多个父类继承特性时，被称为多重继承。Java 不支持多重继承。为了在\
  \ Java 中实现多重继承，可以使用接口。\n\n### 为什么 Java 不支持多重继承\n\n在 Java 中使用多重继承会导致歧义。如果多个父类中存在相同名称的方法，在调用该方法时将无法确定调用哪个父类中的方法。\n\
  \n### 混合继承\n\n当一种或多种继承类型组合在一起时，被称为混合继承。如果混合继承中的组合之一是多重继承，那么这种混合继承是不支持的。\n\n例如，如果你将层级继承和多级继承结合在一起，这就变成了混合继承，Java\
  \ 支持这种继承。\n\n### 访问修饰符与继承\n\n在之前的示例中，你可能注意到，实例变量 `length`、`width` 和 `height` 以及\
  \ `display()` 方法都没有使用访问修饰符。因此，它们被分配了默认访问修饰符。在实例变量、方法或类上使用访问修饰符的主要目的是定义它们对类的其他部分以及对其他类的可见性。使用访问修饰符的实例变量、方法和类的语法如下：\n\
  \n```java\naccess_specifier class class_name\n{\n    access_specifier datatype var1;\n\
  \    ----------;\n    access_specifier datatype varN;\n\n    access_specifier return_type\
  \ name(parameters list)\n    {\n        //方法的正体;\n    }\n}\n```\n\n在这个语法中，`access_specifier`\
  \ 代表一个修饰符，可以是以下之一：\n\nPrivate\n\n\n\n\n\n## Private\n\n如果一个类成员（实例变量或方法）被声明为 `private`（私有），它将只在指定的特定类内部可见或可被访问。它不能从声明或定义的类外部访问。此外，如果一个类被声明为\
  \ `private`，则它不能作为超类（父类），这意味着你不能继承该特定类、其成员或方法。\n\n例如：\n\n```java\nclass Demo\n{\n\
  \    private double age;\n    private double income;\n    ----------;\n}\n```\n\n\
  在这个示例中，`age` 和 `income` 被声明为 `double` 类型变量。这些变量只能在 `Demo` 类中使用，因为它们被声明为 `private`。`Demo`\
  \ 类的子类无法直接访问这些变量。与变量一样，如果 `Demo` 类内部的某个方法被声明为 `private`，则它不能在 `Demo` 类外部访问或使用。\n\
  \n## Public\n\n当类成员（实例变量或方法）被声明为 `public`（公共）时，它将可以在程序的任何地方可见或可被访问。你可以在声明该类的内部或访问该类的公共成员。因此，当你希望完整的数据在程序的任何地方可见或被访问时，可以使用这种访问修饰符。\n\
  \n例如：\n\n```java\nclass Demo\n{\n    public double age;\n    public double income;\n\
  \    ----------;\n}\n```\n\n在这个示例中，`age` 和 `income` 被声明为 `double` 类型变量。这些变量可以在 `Demo`\
  \ 类中使用或访问，也可以在 `Demo` 类以外的其他类中访问，因为它们被声明为 `public`。与变量一样，如果 `Demo` 类内部的某个方法被声明为\
  \ `public`，则可以在 `Demo` 类外部访问或使用。\n\n## Protected\n\n当类成员（实例变量或方法）被声明为 `protected`（保护）时，它可以在声明或定义的类内部使用或访问，也可以在该特定类的子类中使用访问。它还可以被同一包中的类访问。你将在后面的章节中学习更多关于包（packages）的知识。\n\
  \n例如：\n\n```java\nclass Demo\n{\n    protected double age;\n    protected double\
  \ income;\n    ----------;\n}\n\nclass Sub extends Demo\n{\n    ----------;\n}\n\
  ```\n\n在这个示例中，`Demo` 类被 `Sub` 类继承。在这里，`Sub` 类可以直接访问 `Demo` 类的保护数据成员 `age` 和 `income`。\n\
  \n## Default\n\n如果你没有为类的成员指定任何任何修饰符，则这些成员将被分配默认修饰符。默认修饰符主要用于在处理包时。\n\n> **注意**：在定义类时，建议将所有实例变量声明为\
  \ `private`，并将方法声明为 `public`。\n\n### 示例 4\n\n接下来的示例说明了访问修饰符的使用。该程序将计算学生在三门科目中的得分平均分，并将结果显示在屏幕上。\n\
  \n```java\n//写一个程序来计算三门科目的平均分\nclass student\n{\n    private int roll_num;\n   \
  \ protected void get_rollnum(int x)\n    {\n        roll_num = x;\n    }\n    void\
  \ show_rollnum( )\n    {\n        System.out.println(“Roll Number is: ” +roll_num);\n\
  \    }\n}\n\nclass Points extends student\n{\n    private double sub1, sub2, sub3;\n\
  \    public void get_points(double a, double b, double c)\n    {\n        sub1 =\
  \ a;\n        sub2 = b;\n        sub3 = c;\n    }\n    public void show_points(\
  \ )\n    {\n        System.out.println(“Points scored in Subject1 are: ” +sub1);\n\
  \        System.out.println(“Points scored in Subject2 are: ” +sub2);\n        System.out.println(“Points\
  \ scored in Subject3 are: ” +sub3);\n    }\n    public double avrg( )\n    {\n \
  \       return (sub1+sub2+sub3)/3;\n    }\n}\n\nclass Average\n{\n    public static\
  \ void main(String arg[])\n    {\n        double result;\n        Points obj1 =\
  \ new Points( );\n        obj1.get_rollnum(101);\n        obj1.get_points(66,78.5,89.5);\n\
  \        result = obj1.avrg( );\n        System.out.println(“Average is: ” +result);\n\
  \    }\n}\n```\n\n#### 解析\n\n`private int roll_num;` 在第 4 行，`roll_num` 被声明为 `private`。这意味着它只能在\
  \ `student` 类内部访问。\n\n`protected void get_rollnum(int x)` 在第 5 行，该方法被声明为 `protected`。它可以在\
  \ `student` 类内部或其子类（如 `Points`）中访问。\n\n`void show_rollnum( )` 在第 9 行，该方法使用了默认修饰符。\n\
  \n`private double sub1, sub2, sub3;` 在第 16 行，`sub1`, `sub2` 和 `sub3` 被声明为 `private`，它们只能在\
  \ `Points` 类内部使用。\n\n`public void get_points(double a, double b, double c)` 在第 17\
  \ 行，该方法被声明为 `public`，可以在程序的任何地方被访问。\n\n`public void show_points( )` 在第 23 行，该方法被声明为\
  \ `public`，可以在程序的任何地方被访问。\n\n`public double avrg( )` 在第 28 行，该方法被声明为 `public`，它计算并返回三个科目的平均分。\n\
  \n`double result;` 在第 37 行，`result` 被声明为 `double` 类型变量。\n\n`Points obj1 = new Points(\
  \ );` 在第 38 行，`obj1` 是 `Points` 类的一个实例。\n\n`obj1.get_rollnum(101);` 在第 39 行，调用了\
  \ `get_rollnum` 方法。\n\n`obj1.get_points(66,78.5,89.5);` 在第 40 行，调用了 `get_points`\
  \ 方法。\n\n`result = obj1.avrg( );` 在第 41 行，调用了 `avrg` 方法并将返回的结果赋值给 `result`。\n\n\n\
  \n\n\n在此行中，对 `Points` 类的 `obj1` 对象调用了 `student` 类的 `show_rollnum()` 方法。现在，控制转移到第\
  \ 8 行，变量 `roll_num` 的值 `101` 显示在屏幕上。\n\n第 43 行\n\n```\nobj1.show_points();\n```\n\
  \n在此行中，对 `Points` 类的 `obj1` 对象调用了 `show_points()` 方法。现在，控制转移到第 22 行，变量 `sub1`、`sub2`\
  \ 和 `sub3` 的值显示在屏幕上。\n\n第 44 行\n\n```\nSystem.out.println(“Average is: ” +result);\n\
  ```\n\n此行将在屏幕上显示以下内容：\n\nAverage is: 78\n\n示例 4 的输出如图 5-5 所示。\n\n![C05SC005.tif](img/C05SC005_fmt.jpeg)\n\
  \n图 5-5 示例 4 的输出\n\n## super 关键字\n\n每当从基类继承派生类时，派生类的某些可能与基类的特征相似。此类情况会导致 JVM 产生歧义，因此需要进行区分以避免这种情况。为了区分基类特征和派生类特征，使用了\
  \ `super` 关键字。通过使用 `super` 关键字，子类可以轻松地引用其直接父类。`super` 关键字主要用于以下两个目的：\n\na. 调用父类构造函数。\n\
  \nb. 访问父类和子类的同名成员。\n\n**注意**\n\n`super` 关键字只能访问父类的公共（public）和受保护（protected）成员。它无法访问父类的私有（private）成员。\n\
  \n#### 调用父类构造函数\n\n子类可以使用 `super` 关键字调用由其父类定义的构造函数，如下所示：\n\n```\nsuper(arg1, arg2,\
  \ ........, argN);\n```\n\n在这一语句中，`arg1` 到 `argN` 指定了父类构造函数所需的参数列表。\n\n例如：\n\n```java\n\
  class A\n{\n    A(int a, int b)\n    {\n        // ...\n    }\n}\n\nclass B extends\
  \ A\n{\n    B( int x, int y, int z)\n    {\n        super(x, y);\n        // ...\n\
  \    }\n}\n```\n\n在这个示例中，`B` 类继承了 `A` 类的特征。在子类 `B` 的构造函数内部，使用 `super` 关键字调用了父类 `A`\
  \ 的构造函数，并将两个类型变量 `x` 和 `y` 的值作为参数传递。现在，这些值被赋值给父类构造函数参数列表内部变量 `a` 和 `b`。\n\n**注意**\n\
  \n在子类构造函数内部，`super()` 语句应该是第一个执行的语句，否则将得到编译信息：“构造函数调用必须是构造函数中的第一个语句”。\n\n### 示例\
  \ 5\n\n以下示例说明了调用父类构造函数的概念。程序将计算圆柱体积并将结果显示在屏幕上。\n\n```java\n//写一个计算圆柱体积的程序\n1 class\
  \ Cylinder\n2 {\n3 double radius;\n4 Cylinder(double r)\n5 {\n6 radius = r;\n7 }\n\
  8 }\n9 class Cylinderheight extends Cylinder\n10 {\n11 double height;\n12 double\
  \ pi = 3.14;\n13 Cylinderheight(double rad, double hgt)\n14 {\n15 super(rad);\n\
  16 height = hgt;\n17 }\n18 double volume()\n19 {\n20 return pi*(radius*radius)*height;\n\
  21 }\n22 }\n23 class Volume\n24 {\n25 public static void main(String[] args)\n26\
  \ {\n27 double result;\n28 Cylinderheight obj1 = new Cylinderheight(10.5,20.2);\n\
  29 result = obj1.volume();\n30 System.out.println(“Volume of first cylinder is:\
  \ ” +result); \n31 Cylinderheight obj2 = new Cylinderheight(8.5,12);\n32 result\
  \ = obj2.volume();\n33 System.out.println(“Volume of second cylinder is: ” +result);\n\
  34 }\n35 }\n```\n\n#### 解释\n\n**第 4 到 7 行**\n\n```java\nCylinder(double r)\n{\n\
  \    radius = r;\n}\n```\n这些行包含了 `Cylinder` 类构造函数的定义。参数列表包含 double 类型变量 `r`。每当调用此构造函数时，都会传递\
  \ double 类型的值或变量作为参数。在构造函数体内部，实例变量 `radius` 初始化为调用时传递给它的值。\n\n**第 9 行**\n```java\n\
  class Cylinderheight extends Cylinder\n```\n此行表示 `Cylinderheight` 类可以继承 `Cylinder`\
  \ 类的特征。在这里，`Cylinder` 类充当 `Cylinderheight` 类的父类。\n\n**第 13 到 17 行**\n```java\nCylinderheight(double\
  \ rad, double hgt)\n{\n    super(rad);\n    height = hgt;\n}\n```\n这些行包含了 `Cylinderheight`\
  \ 类构造函数的定义。参数列表包含了 `rad` 和 `hgt`。每当调用此构造函数时，使用 `super` 关键字调用了父类的构造函数，并将 `hgt` 赋值给\
  \ `height`。\n\n**第 28 行**\n```java\nCylinderheight obj1 = new Cylinderheight(10.5,20.2);\n\
  ```\n在此行，`obj1` 被声明为 `Cylinderheight` 的对象。在这里，`10.5` 和 `20.2` 被传递作为参数。现在，控制转移到第\
  \ 13 行，并将 `10.5` 和 `20.2` 分别传递给 `rad`。\n\n## 使用 super 关键字访问成员\n\n子类可以通过在成员名前符添加\
  \ `super` 关键字来访问父类的成员。如果不在成员名前添加 `super` 关键字，它将访问子类。在本节中，你将学习如何使用 `super` 访问父类成员。\n\
  \n# 示例 6\n\n以下示例说明了使用 super 关键字访问父类成员。程序将在屏幕上显示父类及其子类实例变量的值。\n\n```java\n/*写一个显示父类及其子类实例变量值的程序\
  \ */\n1 class Super\n2 {\n3 int v1, v2;\n4 }\n5 class Sub extends Super\n6 {\n7\
  \  int v1, v2;\n8 Sub(int a, int b, int c, int d)\n9 {\n10 super.v1 = a;\n11 super.v2\
  \ = b;\n12 v1 = c;\n13 v2 = d;\n14 }\n15 void display()\n16 {\n17 System.out.println(“Instance\
  \ variables of superclass are ” +super.v1 + “ and ” + super.v2);\n18 System.out.println(“Instance\
  \ variables of subclass are ” + v1 + “ and ” + v2);\n19 }\n20 }\n21 class Super_demo\n\
  22 {\n23 public static void main(String[] args)\n24 {\n25 Sub obj1 = new Sub(10,\
  \ 20, 30, 40);\n26 obj1.display();\n27 }\n28 }\n```\n\n#### 解释\n\n**第 3 行**\n```java\n\
  int v1, v2;\n```\n在此行中，`v1` 和 `v2` 被声明为 `Super` 类的变量。\n\n**第 7 行**\n```java\nint\
  \ v1, v2;\n```\n在此行中，`v1` 和 `v2` 被声明为 `Sub` 类的变量。在这里，子类 `Sub` 的实例变量隐藏了其父类 `Super`\
  \ 的实例变量。\n\n**第 10 和 11 行**\n```java\nsuper.v1 = a;\nsuper.v2 = b;\n```\n这些行使用 `super`\
  \ 关键字初始化了父类的 `v1` 和 `v2`。\n\n\n\n\n\n在这些行中，通过 `super` 关键字访问了 `Super` 类的实例变量 `v1`\
  \ 和 `v2`，并将变量 `a` 和 `b` 的值分别赋值给 `v1` 和 `v2`。\n\n第 25 行\n\n```\nSub obj1 = new Sub(10,\
  \ 20, 30, 40);\n```\n\n在这一行中，`obj1` 被声明为 `Sub` 类的对象。在这里调用了 `Sub` 子类的构造函数 `Sub()`，并将值\
  \ `10`、`20`、`30` 和 `40` 作为参数传递。现在，控制转移到第 8 行，并将值 `10`、`20`、`30` 和 `40` 分别赋值给变量 `a`、`b`、`c`\
  \ 和 `d`。\n\n示例 6 的输出如图 5-7 所示\n\n![C05SC007.tif](img/C05SC007_fmt.jpeg)\n\n图 5-7\
  \ 示例 6 的输出\n\n### 方法重写（Overriding Methods）\n\n在子类中，如果你定义的方法与其父类中定义的方法具有相同的名称、相同的类型和相同的参数数量，那么新的方法定义将隐藏旧的方法定义。这个过程被称为重写。在方法重写中，子类和其父类都包含一个签名相同的方法。\n\
  \n例如：\n\n```java\nclass A\n{\nvoid show(int x)\n{\n----------;\n}\n}\n\nclass B\
  \ extends A\n{\nvoid show(int y)\n{\nsuper.show(20);\n//调用父类 A 的 show( ) 方法\n----------;\n\
  }\n}\n```\n\n在这个示例中，`B` 类继承了 `A` 类的特征。在这里，`B` 类包含了 `show()` 方法，该方法的名称、返回类型、参数类型和参数数量与父类\
  \ `A` 的 `show()` 方法相同。因此，使用 `super` 关键字来调用父类 `A` 的 `show()` 方法。\n\n### 示例 7\n\n\
  以下示例说明了重写方法的使用。该程序将计算矩形和长方体的体积，并在屏幕上显示结果。\n\n```java\n//编写一个计算矩形和长方体体积的程序\n1 class\
  \ Rectangle\n2 {\n3 double l, w;\n4 Rectangle(double length, double width)\n5 {\n\
  6  l = length;\n7 w = width;\n8 }\n9 double area( )\n10 {\n11 return l * w;\n12\
  \ }\n13 }\n14 class Cuboid extends Rectangle\n15 {\n16 double h;\n17 Cuboid(double\
  \ a, double b, double c)\n18 {\n19 super(a, b);\n20 h = c;\n21 }\n22 double area(\
  \ ) //重写的方法\n23 {\n24 return 2*((l*w) + (w*h) + (h*l));\n25 }\n26 void show_message()\n\
  27 {\n28 double result;\n29 result = super.area();\n30 System.out.println(“Area\
  \ of the rectangle is ” +result);\n31 result = area();\n32 System.out.println(“Area\
  \ of the cuboid is ” +result);\n33 }\n34 public static void main(String[] args)\n\
  35 {\n36 Rectangle r = new Rectangle(10.5, 20);\n37 Cuboid c = new Cuboid(10, 20.5,\
  \ 30.7);\n38 c.show_message();\n39 }\n40 }\n```\n\n#### 解析\n\n#### 第 9 到第 12 行\n\
  ```java\ndouble area( )\n{\nreturn l * w;\n}\n```\n这些行包含了 `Rectangle` 类 `area()`\
  \ 方法的定义。在方法体内，变量 `l` 和 `w` 的值相乘。接下来，通过 `return` 语句将结果返回给调用者。\n\n#### 第 22 到第 25\
  \ 行\n```java\ndouble area( ) //重写的方法\n{\nreturn 2*((l*w) + (w*h) + (h*l));\n}\n\
  ```\n这些行包含了 `Cuboid` 类 `area()` 方法的定义。这是一个重写的方法。该方法的名称、返回类型和空参数列表与父类 `Rectangle`\
  \ 中定义的相同。在方法体内，对了变量 l`、`w` 和 `h` 的值进行计算。接下来，通过 `return` 语句将结果返回给调用者。\n\n#### 第 26\
  \ 到第 33 行\n```java\nvoid show_message()\n{\ndouble result;\nresult = super.area();\n\
  System.out.println(“\\n Area of the rectangle is ” +result);\nresult = area();\n\
  System.out.println(\" Area of the cuboid is ” +result);\n}\n```\n这些行包含了 `Cuboid`\
  \ 类 `show_message()` 方法的定义。在方法体内，使用 `super` 关键字访问父类中重写的 `area()` 方法，控制转移到第 9 行。结果被赋值给变量\
  \ `result` 并使用 `System.out.println` 显示在屏幕上。`result = area();` 随后 `System.out.println`\
  \ 显示长方体的面积。\n\n#### 第 36 行\n```java\nRectangle r = new Rectangle(10.5, 20);\n```\n\
  在这一行中，`r` 被声明为 `Rectangle` 类的对象。\n\n#### 第 37 行\n```java\nCuboid c = new Cuboid(10,\
  \ 20.5, 30.7);\n```\n在这一行中，`c` 被声明为 `Cuboid` 类的对象。\n\n#### 第 38 行\n```java\nc.show_message();\n\
  ```\n在这一行中，调用了 `Cuboid` 类的 `show_message()` 方法。\n\n### 动态派发（Dynamic Dispatch）\n\n\
  动态方法派发是 Java 的一个特性。它也被称为运行时多态。这是一个父类引用可以存储子类对象的过程。当调用重写的方法时，动态派发根据引用的对象决定执行序列。当父类引用指向子类对象时被称为向上转型。\n\
  \n### 抽象类（Abstract Classes）\n\n正如你所了解的，父类包含了所有子类共有的特征。有时要求父类只提供结构，而不是整个实现。在这种情况下，父类必须使用\
  \ `abstract` 关键字声明为抽象类。定义抽象类的语法如下：\n\n```java\naccess_specifier abstract class class_name\n\
  \n{\n\n----------;\n\n----------;\n\n}\n```\n\n\n\n\n\n在本示例中，`Demo` 类被定义为一个抽象类。在这里，它被\
  \ `Sub1` 类继承。\n\n与抽象类一样，Java 还提供了抽象方法。抽象方法是那些只包含声明部分、不包含实现部分的方法。这类方法在声明时不使用大括号，并以分号结束。声明抽象方法的语法如下：\n\
  \n`abstract return_type method_name(parameter list);`\n\n抽象类可能包含抽象方法，也可能不包含。但如果一个类包含一个抽象方法，那么该特定类必须声明为抽象类。否则，在编译期间，编译器将生成错误。\n\
  \n### 示例 9\n\n接下来的示例说明了抽象类和抽象方法的使用。该程序将计算矩形的面积，并将结果显示在屏幕上。\n\n```java\n//Write a\
  \ program to calculate the area of a rectangle\n1 abstract class Shape\n2 {\n3 abstract\
  \ double area( );\n4 }\n5 class Rect extends Shape\n6 {\n7  double length, width;\n\
  8 Rect(double l, double w)\n9 {\n10 length = l;\n11 width = w;\n12 }\n13 double\
  \ area( )\n14 {\n15 return length * width;\n16 }\n17 }\n18 class Abstract_demo\n\
  19 {\n20 public static void main(String arg[])\n21 {\n22 double result;\n23 Rect\
  \ r1 = new Rect(10.5, 12.3);\n24 result = r1.area( );\n25 System.out.println(“Area\
  \ of the rectangle is: ” +result);\n26 }\n27 }\n```\n\n#### 解析\n\n**第 1 行**\n`abstract\
  \ class Shape`\n在这一行中，通过 `abstract` 关键字将 `Shape` 声明为抽象类。在这里，抽象类 `Shape` 用于仅其子类提供结构，而不是实现。\n\
  \n**第 3 行**\n`abstract double area( );`\n在这一行中，`area` 被声明为抽象方法，其返回类型为 `double`。在这里，该方法仅包含声明部分，不包含实现或定义部分。当一个类继承\
  \ `Shape` 类时，该特定子类将根据其需求定义此方法。\n\n**第 5 行**\n`class Rect extends Shape`\n在这一行中，`Rect`\
  \ 类继承了抽象类 `Shape`。\n\n**第 13 到 16 行**\n```java\ndouble area( )\n{\nreturn length\
  \ * width;\n}\n```\n在这些行中，`Shape` 类的抽象 `area()` 方法在其子类 `Rect` 的定义内部定义。在方法体内，变量 `length`\
  \ 和 `width` 的值相乘。接下来，将结果传递给该方法的调用者。\n\n示例 9 的输出如图 5-10 所示。\n\n![C05SC010.tif](img/C05SC010_fmt.jpeg)\n\
  图 5-10 示例 9 的输出\n\n### final 关键字\n\n在 Java 中，`final` 是一个保留关键字。它用于限制用户。它有以下三个用途：\n\
  a. 将变量声明为常量\nb. 防止重写\nc. 防止继承\n\n#### 将变量声明为常量\n\n`final` 关键字用于将变量声明为常量。你只能对 `final`\
  \ 变量赋值一次，且该值在整个程序中都不能更改。在 Java 中，`final` 变量的处理方式与其他编程语言中的常量变量相同。声明 final 变量的语法如下：\n\
  \n`final datatype var_name = value;`\n\n例如：\n`final int i = 10;`\n\n在这个示例中，整数类型变量\
  \ `i` 通过 `final` 关键字声明为 final 变量。接下来，将值 `10` 赋值为它的初始值，该值在整个程序运行期间将保持不变。\n\n### 防止重写\n\
  \n在本章中，你已经学习了方法重写。有时，你需要防止某个方法被其子类重写。在这种情况下，你可以使用 `final` 关键字声明该方法。声明 final 方法的语法如下：\n\
  \n`final returntype method_name(parameters list)`\n\n例如：\n```java\nclass A\n{\n\
  ----------;\nfinal double area( )\n{\n----------;\n----------;\n}\n}\n\nclass B\
  \ extends A\n{\n----------;\n----------;\n}\n```\n在这个示例中，`A` 类的 `area()` 方法使用 `final`\
  \ 关键字声明，它不能被 `B` 子类重写。如果 `B` 子类尝试在其定义中重写 `area()` 方法，编译器将生成错误。\n\n### 防止继承\n\n在继承中，一个类被另一个类继承以重用其代码或特性。但在某些情况下，你需要防止一个类被任何其他类继承。在这种情况下，你必须使用\
  \ `final` 关键字声明类。当一个类被声明为 `final` 时，它内部的方法也被声明为 `final`。声明 final 类的语法如下：\n\n`final\
  \ class classname`\n\n例如：\n```java\nfinal class A\n{\n----------;\nvoid area( )\n\
  {\n----------;\n}\n}\n```\n在这个示例中，`A` 类被声明为 final 类。因此，该类中的 `area()` 方法也被隐式地声明为\
  \ final 方法。现在，`A` 类不能被任何其他类继承。\n\n### 自评测试\n\n回答以下问题，并与本章末出的答案进行比较：\n1. 从现有类派生新类的机制被称为\
