  \n图 4-15 示例 13 的输出\n\n### 构造方法重载\n\n构造方法重载意味着在同一个类中定义多个构造方法。这些构造方法通过参数的数量和/或类型来区分。重载构造方法的工作方式与重载方法相同。重载构造方法用于用不同的值初始化实例变量。\n\
  \n例如：\n\n```java\nclass Demo\n{\n  int i, j;\n\n  Demo()\n  {\n    i = 0;\n    j\
  \ = 0;\n  }\n\n  Demo(int x)\n  {\n    i = j = x;\n  }\n\n  Demo(int x, int y)\n\
  \  {\n    i = x;\n    j = y;\n  }\n}\n```\n\n在这个示例中，`Demo()`构造方法被重载了三次。这三个构造方法根据参数的数量进行区分。第一个构造方法没有参数，第二个构造方法只有一个参数，第三个构造方法有两个参数。编译器将根据创建对象时传递的参数数量执行相应的构造方法体，如下：\n\
  \n```java\nDemo obj1 = new Demo(10);\n```\n\n在这一语句中，只传递了一个整数类型的参数。因此，编译器执行了第二个构造方法。\n\
  \n#### 示例 14\n\n下面的示例说明了重载构造方法的使用。程序将将两个数字相加并在屏幕上显示结果。\n\n```java\n//写一个两个两个数字的程序\n\
