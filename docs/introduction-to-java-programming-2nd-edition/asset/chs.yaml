  \n# 抽象窗口工具包 (Abstract Window Toolkit)\n\n### 学习目标\n\n完成本章后，你能够：\n* 使用 AWT 窗口\n*\
  \ 应用 AWT 图形\n* 使用 AWT 控件\n* 使用布局管理器\n\n### 引言\n\n在上一章中，你学习了 applet、`Applet` 类以及事件委托机制。事件委托机制的三个主要组成部分是：事件源、事件对象和事件监听器。在本章中，你将学习事件源如何生成事件对象，以及该对象如何被事件监听器处理。此外，你还将了解到抽象窗口工具包。\n\
  \n## AWT 窗口\n\n当执行 applet 或窗口应用程序时，会显示一个 AWT 窗口。AWT 最常用的窗口是 applet 窗口和帧窗口（frame\
  \ window）。当执行 applet 程序时显示 applet 窗口，而执行窗口应用程序时则显示帧窗口。`java.awt.Frame` 类支持帧窗口。在本节中，你将详细学习帧窗口。\n\
  \n### 帧窗口 (Frame Window)\n\n帧窗口是图形界面中最常用的窗口。该窗口继承自 `Frame` 类。它包含了标题栏、菜单栏、边界以及用于调整窗口大小按钮。它也可以用于\
  \ applet 窗口内部。你可以通过创建 `Frame` 类的对象来创建一个帧窗口。在本节中，你将学习 `Frame` 类的构造函数。你还将学习如何创建帧窗口并使用各种方法在帧窗口上应用不同的设置。\n\
  \n### Frame 类的构造函数\n\n`Frame` 类的构造函数用于创建帧窗口。`Frame` 类有以下四个构造函数：\n* `Frame()`\n*\
  \ `Frame(GraphicsConfiguration gc)`\n* `Frame(String title)`\n* `Frame(String title,\
  \ GraphicsConfiguration gc)`\n\n在这些语法中，第一个构造函数 `Frame()` 创建一个标题栏中不包含标题的帧窗口。第二个构造函数\
  \ `Frame(GraphicsConfiguration gc)` 创建一个包含 `GraphicsConfiguration` 的帧窗口。第三个构造函数\
  \ `Frame(String title)` 创建一个标题栏中包含标题字符串对象指定标题的帧窗口。第四个构造函数 `Frame(String title, GraphicsConfiguration\
  \ gc)` 创建一个包含标题和 `GraphicsConfiguration` 的帧窗口。\n\n### 设置帧窗口的大小\n\n你可以使用 `setSize()`\
  \ 方法设置帧窗口的大小。使用 `setSize()` 方法的语法如下：\n```\nvoid setSize(int width, int height)\n\
  void setSize(Dimension size)\n```\n在第一种语法中，帧窗口的 `width` 和 `height` 分别设置为整数变量 `width`\
  \ 和 `height` 指定的值。在第二种语法中，帧窗口的大小由 `size` 指定 `width` 和 `height` 字段设置。\n\n你也可以使用 `getSize()`\
  \ 方法获取帧窗口的大小。使用 `getSize()` 方法的语法如下：\n```\nDimension getSize()\n```\n在此语法中，`getSize()`\
  \ 方法返回一个 `Dimension` 类的对象。在这里，对象的 `width` 和 `height` 字段包含了帧窗口当前的大小。\n\n### 设置帧窗口的可见性\n\
  \n创建帧窗口后，可以使用 `setVisible()` 方法设置其可见性。使用该方法的语法如下：\n```\nvoid setVisible(boolean\
  \ val)\n```\n在此语法中，如果 `setVisible()` 方法的布尔值为 `true`，则帧窗口是可见的。否则不可见。\n\n### 设置帧窗口的标题\n\
  \n你可以使用 `setTitle()` 方法设置帧窗口的标题。使用 `setTitle()` 方法的语法如下：\n```\nvoid setTitle(String\
  \ title)\n```\n在此语法中，`title` 表示帧窗口的新标题。\n\n### 关闭帧窗口\n\n要关闭帧窗口，可以使用 `WindowListener`\
  \ 接口的 `windowClosing()` 方法。为了关闭帧窗口，你需要实现 `windowClosing()` 方法。\n\n## 创建帧窗口\n\n在本节中，你将学习如何创建一个帧窗口。\n\
  \n### 示例 1\n\n下面的示例展示了创建帧窗口的过程。程序将创建一个帧窗口并在其中显示字符串。\n\n```java\n//编写一个创建一个帧窗口的程序\n\
  import java.awt.*;\nimport java.awt.event.*;\n\nclass Firstedemo extends WindowAdapter\n\
  {\n    public void windowClosing (WindowEvent event)\n    {\n        System.exit\
  \ (0);\n    }\n}\n\nclass FirstFrame extends Frame\n{\n    private Firstedemo obj1;\n\
  \    FirstFrame( )\n    {\n        obj1 = new Firstedemo( );\n        setTitle(“First\
  \ Frame”);\n        setSize(300, 200);\n        addWindowListener (obj1);\n    \
  \    setVisible(true);\n    }\n    public void paint(Graphics g)\n    {\n      \
  \  g.drawString(“First Frame Window”, 100,110);\n    }\n    public static void main(String\
  \ arg[ ])\n    {\n        Frame f1;\n        f1 = new FirstFrame( );\n    }\n}\n\
  ```\n\n#### 解析\n\n第 3 行：`class Firstedemo extends WindowAdapter`\n`Firstedemo` 类继承了\
  \ `WindowAdapter` 类。\n\n第 5 行到第 8 行：\n```java\npublic void windowClosing (WindowEvent\
  \ event)\n{\n    System.exit (0);\n}\n```\n这些行包含了 `WindowListener` 接口中 `windowClosing()`\
  \ 方法的定义。该方法的参数列表包含一个 `WindowEvent` 类的对象 `event`。每当程序生成关闭事件时，事件对象将传递给该事件对象。接下来，方法将通过执行\
  \ `System.exit (0)` 语句来处理该事件。该语句将从屏幕上移除窗口。\n\n`FirstFrame` 类继承了 `Frame` 类。\n\n`private\
  \ Firstedemo obj1;` \n\n在此行中，`obj1` 被声明为 `Firstedemo` 类的对象。该对象将用于处理窗口事件。\n\n第 14\
  \ 行到第 21 行：\n```java\nFirstFrame( )\n{\n    obj1 = new Firstedemo( );\n    setTitle(“First\
  \ Frame”);\n    setSize(300, 200);\n    addWindowListener (obj1);\n    setVisible(true);\n\
  }\n```\n\n\n\n\n\n这些行包含了 `FirstFrame` 类 `FirstFrame()` 构造函数的定义。在构造函数体内，第一条语句通过 `new`\
  \ 运算符将 `obj1` 定义为 `FirstFramedemo` 类的对象。在下一条语句中，`setTitle()` 方法将将 \"First Frame\"\
  \ 字符串设置为帧窗口的标题。接下来，`setSize()` 方法将将帧窗口的宽度和高度分别设置为 300 和 200。在下一条语句中，`FirstFramedemo`\
  \ 类的对象 `obj1` 将注册以接收窗口事件。在最后一条语句中，`setVisible()` 方法包含布尔值 `true`，这将使帧窗口在屏幕上可见。\n\n\
  ### 第 21 到 24 行\n\n```java\npublic void paint(Graphics g)\n{\n    g.drawString(“First\
  \ Frame Window”, 100,110);\n}\n```\n\n这些行包含了 `paint()` 方法的定义。在该方法的体内，使用 `drawString()`\
  \ 方法在位置 100, 110 处绘制 \"First Frame Window\" 字符串。\n\n#### 第 28 行\n\n```java\nFrame\
  \ f1;\n```\n\n在这一行中，`f1` 被声明为 `Frame` 类的对象。\n\n#### 第 29 行\n\n```java\nf1 = new\
  \ FirstFrame();\n```\n\n在这一行中，`FirstFrame` 类对象的引用将被赋值给 `f1` 对象。在这里，将调用 `FirstFrame()`\
  \ 构造函数，并将控制转移到构造函数的定义处。\n\n程序将被编译并执行，如下语句所示：\n\n```bash\nD:\\Java Projects\\Ch11>javac\
  \ FirstFrame.java\nD:\\Java Projects\\Ch11>java FirstFrame\n```\n\n示例 1 的输出显示在图\
  \ 11-1。\n\n![C11SC001.tif](img/C11SC001_fmt.jpeg)\n\n图 11-1 示例 1 的输出\n\n## 在 Applet\
  \ 中创建帧窗口\n\n在在上一个示例中，你观察到帧窗口是独立应用程序的顶层窗口。但你也可以在 applet 内部创建一个子窗口帧窗口。\n\n### 示例 2\n\
  \n以下示例说明了在 applet 中创建帧窗口的步骤。程序将在 applet 中创建一个帧窗口，并在帧窗口内显示字符串。此外，程序将在屏幕上同时显示 applet\
  \ 窗口和帧窗口。\n\n```java\n//写一个程序在 applet 中创建一个帧窗口\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import java.applet.*;\n//applet code=“Appletframedemo” width=300 height=100></applet>\n\
  class childframe extends Frame\n{\n    childframe()\n    {\n        setTitle(“Child\
  \ Frame”);\n        windowadapterdemo adapter = new windowadapterdemo();\n     \
  \   addWindowListener(adapter);\n    }\n    public void paint(Graphics g)\n    {\n\
  \        g.drawString(“Child Frame Window”, 10,40);\n    }\n}\nclass windowadapterdemo\
  \ extends WindowAdapter\n{\n    public void windowClosing(WindowEvent event)\n \
  \   {\n        System.exit(0);\n    }\n}\npublic class Appletframedemo extends Applet\n\
  {\n    Frame frm;\n    public void init()\n    {\n        frm = new childframe();\n\
  \        frm.setSize(200, 100);\n        frm.setVisible(true);\n    }\n    public\
  \ void start()\n    {\n        frm.setVisible(true);\n    }\n    public void stop()\n\
  \    {\n        frm.setVisible(false);\n    }\n    public void paint(Graphics g)\n\
  \    {\n        g.drawString(“Applet Window”, 10,40);\n    }\n}\n```\n\n#### 解释\n\
  \n#### 第 27 行\n\n```java\nFrame frm;\n```\n\n在这一行中，`frm` 被声明为 `Frame` 类的对象。\n\n\
  ### 第 28 到 33 行\n\n```java\npublic void init()\n{\n    frm = new childframe();\n\
  \    frm.setSize(200, 100);\n    frm.setVisible(true);\n}\n```\n\n在这些行中，`Applet`\
  \ 类的 `init()` 方法在 `AppletFramedemo` 类中被重写。在 `init()` 方法内部，`childframe` 类对象的引用将被赋值给\
  \ `Frame` 类的对象 `frm`。在这里，将调用构造函数 `childframe()`。接下来，控制将转移到 `childframe()` 构造函数体内，并在构造函数体内将帧窗口的标题设置为\
  \ \"Child Frame\"。`init()` 方法的下一条语句将帧窗口的宽度和高度分别设置为 200 和 100。该方法的最后一条语句 `frm.setVisible(true)`\
  \ 将使帧窗口在屏幕上可见。\n\n### 第 34 到 37 行\n\n```java\npublic void start()\n{\n    frm.setVisible(true);\n\
  }\n```\n\n在这些行中，`Applet` 类的 `start()` 方法在 `AppletFramedemo` 类中被重写。在方法体内，`setVisible()`\
  \ 包含布尔值 `true`，这将使帧窗口在屏幕上可见。每当调用 `start()` 方法时，都会显示 applet 和帧窗口。\n\n### 第 38 到 41\
  \ 行\n\n```java\npublic void stop()\n{\n    frm.setVisible(false);\n}\n```\n\n这些行中，`Applet`\
  \ 类的 `stop()` 方法在 `AppletFramedemo` 类中被重写。\n\n### 第 42 到 45 行\n\n```java\npublic\
  \ void paint(Graphics g)\n{\n    g.drawString(“Applet Window”, 10,40);\n}\n```\n\
  \n这些行包含了 `paint()` 方法的定义。在该方法的体内，使用 `drawString()` 方法在位置 100, 110 处绘制 \"First Frame\
  \ Window\" 字符串。（注：此处原文描述与代码内容有出入，已按原文逻辑翻译）\n\n#### 第 28 行\n\n```java\nFrame f1;\n\
  ```\n\n在这一行中，`f1` 被声明为 `Frame` 类的对象。\n\n#### 第 29 行\n\n```java\nf1 = new FirstFrame();\n\
  ```\n\n在这一行中，`FirstFrame` 类对象的引用将被赋值给 `f1` 对象。在这里，将调用 `FirstFrame()` 构造函数，并将控制转移到构造函数的定义处。\n\
  \n程序将被编译并执行，如下语句所示：\n\n```bash\nD:\\Java Projects\\Ch11>javac FirstFrame.java\n\
  D:\\Java Projects\\Ch11>java FirstFrame\n```\n\n示例 1 的输出显示在图 11-1。\n\n![C11SC001.tif](img/C11SC001_fmt.jpeg)\n\
  \n图 11-1 示例 1 的输出\n\n## 图形操作\n\nAWT 支持许多处理图形对象（如线条、矩形等）的方法。在本节中，你将学习：\n\n### 绘制线条\n\
  \n你可以使用 `Graphics` 类的 `drawLine()` 方法绘制线条。`drawLine()` 方法的语法如下：\n\n`drawLine(int\
  \ x, int y, int x1, int y1)`\n\n在此语法中，整数变量 `x` 和 `y` 代表起点，`x1` 和 `y1` 代表终点。\n\n\
  ### 绘制矩形\n\n你可以使用 `drawRect()` 方法在窗口内绘制矩形。`drawRect()` 方法的语法如下：\n\n`drawRect(int\
  \ x, int y, int wid, int hgt)`\n\n在此语法中，整数变量 `x` 和 `y` 指定起始点，`wid` 和 `hgt` 分别指定矩形的宽度和高度。\n\
  \n\n\n\n\n在本示例中，带有指定整数变量的 `drawRect()` 方法会在窗口内创建一个矩形，如图 11-5 所示。\n\n![C11SC005.tif](img/C11SC005_fmt.jpeg)\n\
  \n图 11-5 矩形的轮廓\n\n此示例显示，`drawRect()` 方法只能绘制矩形的轮廓。但如果你想填充矩形，可以使用 `Graphics` 类的 `fillRect()`\
  \ 方法来实现。使用 `fillRect()` 方法的语法如下：\n\n```\nfillRect(int x, int y, int wid, int hgt)\n\
  ```\n\n在该语法中，整数变量 `x` 和 `y` 指定矩形的起始点或左上角。而，整数变量 `wid` 和 `hgt` 分别指定矩形的宽度和高度。\n\n\
  例如：\n\n```\ng.drawRect(10, 10, 150, 100);\ng.fillRect(10, 10, 150, 100);\n```\n\n\
  在本示例中，`drawRect()` 方法绘制一个具有指定尺寸的矩形，而 `fillRect()` 方法用颜色（通常为黑色）填充矩形，如图 11-6 所示。\n\
  \n![C11SC006.tif](img/C11SC006_fmt.jpeg)\n\n图 11-6 填充矩形\n\n你还可以使用 `Graphics` 类的\
  \ `drawRoundRect()` 方法绘制圆角矩形。使用 `drawRoundRect()` 方法的语法如下：\n\n```\ndrawRoundRect(int\
  \ x, int y, int wid, int hgt, int arcwid, int archgt)\n```\n\n在该语法中，整数变量 `x` 和 `y`\
  \ 指定矩形的起始点（左上角）。而，整数变量 `wid` 和 `hgt` 代表矩形的宽度和高度。此外，整数变量 `arcwid` 和 `archgt` 分别指定弧的水平和垂直直径。\n\
  \n你还可以使用 `Graphics` 类的 `fillRoundRect()` 方法填充圆角矩形。使用 `fillRoundRect()` 方法的语法如下：\n\
  \n```\nfillRoundRect(int x, int y, int wid, int hgt, int arcwid, int archgt)\n```\n\
  \n在该语法中，整数变量 `x` 和 `y` 指定矩形的起始点（左上角）。而，整数变量 `wid` 和 `hgt` 分别代表矩形的宽度和高度。同样，整数变量 `arcwid`\
  \ 和 `archgt` 分别指定矩形弧的水平和垂直直径。\n\n### 示例 4\n\n以下示例说明了 `Graphics` 类的 `drawRect()`、`fillRect()`、`drawRoundRect()`\
  \ 和 `fillRoundRect()` 方法的使用。程序将在 applet 窗口中绘制并填充矩形，并将窗口显示在屏幕上。\n\n```java\n//Write\
  \ a program to draw and fill rectangles\nimport java.awt.*;\nimport java.applet.*;\n\
  //<applet code= “RectangleDemo.class” width=275 height=150>\n</applet>\npublic class\
  \ RectangleDemo extends Applet\n{\n    public void paint(Graphics g)\n    {\n  \
  \      g.drawRect(10, 10, 100, 50);\n        g.fillRect(120, 10, 140, 50);\n   \
  \     g.drawRoundRect(10, 70, 100, 70, 10, 10);\n        g.fillRoundRect(120, 70,\
  \ 140, 70, 10, 10);\n    }\n}\n```\n\n该程序的工作原理与之前的程序相似。\n\n示例 4 的输出显示如图 11-7 所示。\n\
  \n![C11SC007.tif](img/C11SC007_fmt.jpeg)\n\n图 11-7 示例 4 的输出\n\n### 绘制圆和椭圆\n\n你还可以使用\
  \ `Graphics` 类的 `drawOval()` 方法在窗口内绘制圆和椭圆。使用 `drawOval()` 方法的语法如下：\n\n```\ndrawOval(int\
  \ x, int y, int wid, int hgt)\n```\n\n`drawOval()` 方法用于在矩形或正方形内绘制椭圆或圆，其起始点或左上角由整数变量\
  \ `x` 和 `y` 指定。边界区域的宽度和高度分别由整数变量 `wid` 和 `hgt` 指定。\n\n类似于矩形，你还可以使用 `Graphics` 类的\
  \ `fillOval()` 方法填充椭圆或圆。使用 `fillOval()` 方法的语法如下：\n\n```\nfillOval(int x, int y,\
  \ int wid, int hgt)\n```\n\n`x`, `y`, `wid`, 和 `hgt` 变量的描述与 `drawOval()` 方法的变量相同。\n\
  \n### 示例 5\n\n以下示例说明了 `drawOval()` 和 `fillOval()` 方法的使用。程序将在 applet 窗口中绘制并填充椭圆和圆，并将窗口显示在屏幕上。\n\
  \n```java\n//Write a program to draw and fill ellipses and circles\nimport java.awt.*;\n\
  import java.applet.*;\n//<applet code= “EllipseCircleDemo.class” width=310 height=300>\n\
  </applet>\npublic class EllipseCircleDemo extends Applet\n{\n    public void paint(Graphics\
  \ g)\n    {\n        g.drawOval(10, 10, 100, 100);\n        g.drawOval(150, 10,\
  \ 100, 70);\n        g.fillOval(130, 70, 140, 70);\n        g.fillOval(150, 90,\
  \ 150, 100);\n    }\n}\n```\n\n**解释**\n\n**第 8 行** `g.drawOval(10, 10, 100, 100);`\n\
  在此行中，整数值 `10`, `10`, `100`, 和 `100` 指定了正方形边界区域的起始点 `(10,10)`、宽度 `100` 和高度 `100`。现在，`drawOval()`\
  \ 方法在该区域内绘制一个圆，如图 11-8 所示。注意，在这种情况下，是在 applet 窗口内绘制圆，而不是边界区域。\n\n![C11SC008.tif](img/C11SC008_fmt.jpeg)\n\
  图 11-8 边界区域内的圆\n\n**第 9 行** `g.drawOval(150, 10, 100, 70);`\n在此行中，整数值 `150`, `10`,\
  \ `100`, 和 `70` 指定了矩形边界区域的起始点 `(150,10)`、宽度 `100` 和高度 `70`。现在，`drawOval()` 方法在该区域内绘制一个椭圆，如图\
  \ 11-9 所示。\n\n![C11SC009.tif](img/C11SC009_fmt.jpeg)\n图 11-9 边界区域内的椭圆\n\n**第 10\
  \ 行** `g.fillOval(130, 70, 140, 70);`\n在此行中，`fillOval()` 方法填充边界区域内的圆。\n\n**第 11\
  \ 行** `g.fillOval(150, 90, 150, 100);`\n在此行中，`fillOval()` 方法填充边界区域内的椭圆。\n\n示例 5\
  \ 的输出显示在图 11-10 中。\n\n![C11SC010.tif](img/C11SC010_fmt.jpeg)\n图 11-10 示例 5 的输出\n\
  \n### 绘制弧\n\n你可以使用 `Graphics` 类的 `drawArc()` 方法绘制圆弧或椭弧。使用 `drawArc()` 方法的语法如下：\n\
  \n```\ndrawArc(int x, int y, int wid, int hgt, int startangle, int arcangle)\n```\n\
  \n`drawArc()` 方法在矩形内绘制弧，其起始点或左上角由整数变量 `x` 和 `y` 指定。矩形的宽度和高度分别由整数变量 `wid` 和 `hgt`\
  \ 指定。整数变量 `startangle` 指定弧的起始角度，`arcangle` 指定相对于起始角度的角度范围。\n\n注意你只能使用 `drawArc()`\
  \ 方法绘制弧的轮廓。要填充弧，你可以使用 `Graphics` 类的 `fillArc()` 方法。使用 `fillArc()` 方法的语法如下：\n\n```\n\
  fillArc(int x, int y, int wid, int hgt, int startangle, int arcangle)\n```\n\n`x`,\
  \ `y`, `wid`, `hgt`, `startangle`, 和 `arcangle` 变量的描述与 `drawArc()` 方法的变量相同。\n\n\
  # 示例 6\n\n以下示例说明了 `drawArc()` 和 `fillArc()` 方法的使用。程序将在 applet 窗口中绘制并填充弧，并将窗口显示在屏幕上。\n\
  \n```java\n//Write a program to draw and fill arcs\nimport java.awt.*;\nimport java.applet.*;\n\
  //<applet code=“arcdemo.class” width=250 height=200></applet>\npublic class arcdemo\
  \ extends Applet\n{\n    public void paint(Graphics g)\n    {\n        g.drawArc(10,\
  \ 10, 50, 40, 0, 105);\n        g.drawArc(70, 10, 100, 100, 0, 180);\n        g.fillArc(10,\
  \ 70, 50, 80, 0, 105);\n        g.fillArc(70, 100, 100, 110, 0, 180);\n    }\n}\n\
  ```\n\n**解释**\n\n**第 8 行** `g.drawArc(10, 10, 50, 40, 0, 105);`\n在此行中，整数值 `10`,\
  \ `10`, `50`, 和 `40` 指定了矩形边界区域的起始点 `(10,10)`、宽度 `50` 和高度 `40`。现在，`drawArc()` 方法在该边界区域内绘制一条从\
  \ 0 度到 105 度的弧，如图 11-11 所示。注意，这里是在 applet 窗口内绘制该弧，而不是边界区域。\n\n**第 9 行** `g.drawArc(70,\
  \ 10, 100, 100, 0, 180);`\n\n\n\n\n\n在这一行中，`drawArc()` 方法将在边界区域内绘制一个弧。这里，弧从 0 度角开始，延伸到\
  \ 180 度角，如图 11-12 所示。\n\n![C11SC011.tif](img/C11SC011_fmt.jpeg)图 11-11 边界区域内的 105\
  \ 度弧\n\n![C11SC012.tif](img/C11SC012_fmt.jpeg)图 11-12 边界区域内的 180 度弧\n\n#### 第 10\
  \ 行\n```\ng.fillArc(10, 70, 50, 80, 0, 105);\n```\n\n在这一行中，`fillArc()` 方法将在边界区域内填充一个弧。这里，弧将从\
  \ 0 度角开始，延伸到 105 度角，如图 11-13 所示。\n\n![C11SC013.tif](img/C11SC013_fmt.jpeg)图 11-13\
  \ 边界区域内的 105 度填充弧\n\n#### 第 11 行\n```\ng.fillArc(70, 100, 100, 110, 0, 180);\n```\n\
  \n在这一行中，`fillArc()` 方法将在边界区域内填充一个弧。这里，弧将从 0 度角开始，延伸到 180 度角，如图 11-14 所示。\n\n![C11SC014.tif](img/C11SC014_fmt.jpeg)图\
  \ 11-14 边界区域内的 180 度填充弧\n\n示例 6 的输出显示在图 11-15 中。\n\n![C11SC015.tif](img/C11SC015_fmt.jpeg)\n\
  \n图 11-15 示例 6 的输出\n\n## 绘制多边形\n\n你可以使用 `Graphics` 类的 `drawPolygon()` 方法在窗口内绘制具有不同线段的多边形。使用\
  \ `drawPolygon()` 方法的语法如下：\n\n```\ndrawPolygon(int x[ ], int y[ ], int numberpoints)\n\
  ```\n\n在此语法中，整数数组 `x` 和 `y` 包含定义多边形端点的坐标。整数变量 `numberpoints` 指定由 `x` 和 `y` 数组共同定义的坐标对总数。\n\
  \n`drawPolygon()` 方法仅绘制由 `x` 和 `y` 数组定义端点的闭合多边形的轮廓。你也可以使用 `fillPolygon()` 方法填充多边形。使用\
  \ `fillPolygon()` 方法的语法如下：\n\n```\nfillPolygon(int x[ ], int y[ ], int numberpoints)\n\
  ```\n\n`fillPolygon()` 方法的整数变量描述与 `drawPolygon()` 方法的变量相同。\n\n### 示例 7\n\n以下示例说明了\
  \ `drawPolygon()` 和 `fillPolygon()` 方法的使用。程序将在 Applet 窗口中绘制并填充多边形，并将窗口显示在屏幕上。\n\n\
  ```java\n//写一个用于绘制和填充多边形的程序\n1 import java.awt.*;\n2 import java.applet.*;\n3 //<applet\
  \ code= “polygondemo.class” width=200 height=150></applet>\n4 public class polygondemo\
  \ extends Applet\n5 {\n6 public void paint(Graphics g)\n7 {\n8 int x[ ] = {30, 10,\
  \ 30, 50, 70, 50};\n9 int y[ ] = {10, 30, 50, 50, 30, 10};\n10 int numberpoints\
  \ = 6;\n11 g.drawPolygon(x, y, numberpoints);\n12  int x1[ ] = {100, 80, 100, 120,\
  \ 140, 120};\n13 int y1[ ] = {10, 30, 50, 50, 30, 10};\n14 g.fillPolygon(x1, y1,\
  \ numberpoints);\n15 }\n16 }\n```\n\n#### 解析\n\n**第 8 行**\n`int x[ ] = {30, 10,\
  \ 30, 50, 70, 50};`\n在这一行中，六个整数值被赋值给整数类型数组 `x[]` 作为其坐标。\n\n**第 9 行**\n`int y[ ]\
  \ = {10, 30, 50, 50, 30, 10};`\n在这一行中，六个整数值被赋值给整数类型数组 `y[]` 作为其坐标。\n\n**第 10 行**\n\
  `int numberpoints = 6;`\n在这一行中，整数值 `6` 被赋值给整数变量 `numberpoints`。该整数值指定了由整数数组 `x`\
  \ 和 `y` 定义的端点总数。\n\n**第 11 行**\n`g.drawPolygon(x, y, numberpoints);`\n在这一行中，整数类型数组\
  \ `x`、`y` 以及整数变量 `numberpoints` 的值将作为参数传递给 `drawPolygon`。\n\n**第 14 行**\n`g.fillPolygon(x1,\
  \ y1, numberpoints);`\n在这一行中，整数类型数组 `x1`、`y1` 以及整数变量 `numberpoints` 的值将作为参数传递给 `fillPolygon`。\n\
  \n\n\n\n\n```java\n29 setSize(450, 200);\n30 setLayout(new GridLayout(3,1));\n31\
  \ setVisible(true);\n32 }\n33 public static void main(String args[ ])\n34 {\n35\
  \ LabelDemo l=new LabelDemo();\n36 }\n37 }\n```\n\n#### 解析\n\n#### 第 16 行\n`Label\
  \ L1 = new Label(“First label left aligned”, Label.LEFT);`\n在这一行中，`L1` 是 `Label`\
  \ 类型的对象，并创建了具有 `LEFT` 对齐方式的 `First label left aligned` 字符串。\n第 17 行和 18 行的作用与第 16\
  \ 行相似。\n\n#### 第 19 行\n`String text = L3.getText( );`\n在这一行中，对标签对象 `L3` 调用了 `getText()`\
  \ 方法。在这里，该方法返回标签对象 `L3` 中当前用的文本字符串。接下来，得到的文本字符串将被赋值给 `text` 字符串对象。\n\n#### 第 20\
  \ 行\n`int align = L3.getAlignment( );`\n在这一行中，对标签对象 `L3` 调用了 `getAlignment()` 方法。该方法返回标签对象\
  \ `L3` 当前对齐方式。在这里，由于标签是左对齐的，该方法将返回 `0`。接下来，得到的整数将被赋值给整数变量 `align`。\n\n#### 第 21\
  \ 行\n`L3.setText(“Third label right aligned”);`\n在这一行中，对标签对象 `L3` 调用了 `setText()`\
  \ 方法。结果，方法将为标签对象 `L3` 设置新的文本字符串 `Third label right aligned`。现在，旧的文本字符串 `Third Label`\
  \ 将被新文本字符串 `Third label right aligned` 替换。\n\n#### 第 22 行\n`L3.setAlignment(Label.RIGHT);`\n\
  在这一行中，对标签对象 `L3` 调用了 `setAlignment()` 方法。结果，方法将为标签对象 `L3` 设置新的对齐方式 `Label.RIGHT`。\n\
  \n#### 第 23 行\n`add(L1);`\n在这一行中，`add()` 方法将添加作为参数传递的标签对象 `L1`。\n第 24 行和 25 行的作用与第\
  \ 23 行相似。\n\n#### 第 30 行\n`setLayout(new GridLayout(3,1));`\n在这一行中，`setLayout()`\
  \ 方法将窗口的布局设置为 `GridLayout`。在这里，该网格将包含三行一列。你将在本章后面学习更多关于该方法的知识。\n\n示例 8 的输出显示在图 11-17。\n\
