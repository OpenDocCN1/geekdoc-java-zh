  \ 语句被称为 `__________` 语句。\n6. 当你知道循环体执行的次数时，使用 `for` 循环。（T/F）\n7. 你可以跳过 `for` 循环的部分或全部部分。（T/F）\n\
  8. 在嵌套 `for` 循环中，外层 `for` 循环获取内层 `for` 循环的控制权。（T/F）\n9. `break` 语句将控制权传回循环的开头。（T/F）\n\
  10. `continue` 语句用于终止循环。（T/F）\n\n### 复习题\n\n回答以下问题：\n\n1. 定义控制（control）语句。\n2. 区分选择（selection）语句和迭代（iteration）语句。\n\
