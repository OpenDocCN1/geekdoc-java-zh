  14  obj1.height = 30;\n15 Cylinder_Vol obj2 = obj1;\n16 volume = pi * (obj1.radius*obj1.radius)\
  \ * obj1.height;\n17 System.out.println“Volume is: ” +volume);\n18 volume = pi *\
