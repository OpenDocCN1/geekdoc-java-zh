  # 同步\n\n有时，当多个线程尝试访问同一资源时，会遇到并发问题。为了克服这些问题，Java 提供了一种名为同步（synchronization）的解决方案。线程同步确保一次允许一个线程访问资源。Java\
  \ 使用一种名为 `monitor` 的机制来支持线程同步。该机制支持两种线程同步。\n\n1. 互斥\n2. 协作（线程间通信）\n\n## 互斥\n\n在互斥中，`monitor`\
  \ 充当互斥锁，这意味着只有一个线程可以使用资源上的 `monitor`。一旦一个线程获取了资源的锁，在第一个线程释放特定锁之前，其他任何线程都无法访问该资源或获取其锁。在\
  \ Java 中，每个对象都关联一个隐式的 `monitor`。当线程获取锁时，该过程被称为进入监器（entered the monitor）。当线程释放锁时，该过程被称为退出监器（exited\
  \ the monitor）。\n\n互斥防止线程在共享数据时相互干扰。线程可以通过 `synchronized` 关键字获取对象的锁。这可以通过两种方式实现：\n\
  \n1. 同步方法\n2. 同步块\n\n当一个方法或代码块被声明为 `synchronized` 时，它一次只能被单个线程使用。\n\n### 同步方法\n\n\
  如果你将任何方法声明为 `synchronized`，则它被称为同步方法。当线程调用同步方法时，它会自动获取该对象的锁，并在线程完成任务时释放该锁。你可以通过以下方式使用\
  \ `synchronized` 关键字对方法进行同步：\n\n```java\nsynchronized ret_type method_name\n{\n\
  \    执行的语句\n}\n```\n\n### 示例 7\n\n以下示例说明了同步方法的使用。程序将创建多个线程并使用同步方法对它们进行同步。\n\n```java\n\
  //写一个程序来演示同步方法的使用\n1 class synchro\n2 {\n3 synchronized void demo(int p, String\
  \ name)\n4 {\n5 System.out.println(“Priority of thread ”+name+“ is: ”+p);\n6 System.out.println(“Executing\
  \ ” +name);\n7 try\n8 {\n9 Thread.sleep(1500);\n10 }\n11 catch(InterruptedException\
  \ e)\n12 {\n13 System.out.println(“Exception occurred”);\n14 }\n15 System.out.println(“\
  \ is stopped”);\n16 }\n17 class synchro_demo extends Thread\n18 {\n19 obj;\n20 current;\n\
  21 priority;\n22 synchro_demo(synchro instance, String str)\n23 {\n24 super(str);\n\
  25 obj = instance;\n26 priority = getPriority();\n27 }\n28 void start( )\n29 {\n\
  30 }\n31 public void run( )\n32 {\n33 obj.demo(priority, current);\n34 }\n35 }\n\
  36 class synchro\n37 {\n38 static void main(String[])\n39 {\n40 synchro obj1 = new\
  \ synchro();\n41 synchro_demo thrd1 = new synchro_demo(obj1, “First”);\n42 synchro_demo\
  \ thrd2 = new synchro_demo(obj1, “Second”);\n43 synchro_demo thrd3 = new synchro_demo(obj1,\
  \ “Third”);\n44 current = Thread.currentThread( ).getName();\n45 thrd1.start( );\n\
  46 thrd2.start( );\n47 thrd3.start( );\n48 try\n49 Thread.sleep(2000);\n50 }\n51\
  \ catch(InterruptedException e)\n52 {\n53 System.out.println(“Exception occurred”);\n\
  54 }\n55 }\n```\n\n**解释**\n\n第 3 行：`synchronized void demo(int p, String name)`\n\
  这一行定义了 `synchro` 类的同步方法。参数列表包含整数类型变量 `p` 代表线程优先级，以及字符串类型变量 `name` 代表线程的名字。\n\n第\
  \ 22 行：`synchro_demo(synchro instance, String str)`\n这一行是 `synchro_demo` 的构造函数。参数列表中，`instance`\
  \ 是 `synchro` 类的对象，`str` 是字符串类型变量。\n\n第 25 行：`super(str);`\n在这一行中，调用了 `super()`\
  \ 方法，这将调用 `Thread` 类的构造函数并将 `str` 作为参数传递。。\n\n第 26 行：`obj = instance;`\n在这一行中，将\
  \ `instance` 对象的引用赋值给 `obj`。\n\n第 27 行：`priority = getPriority();`\n在这一行中，`Thread`\
  \ 类的 `getPriority(()` 方法返回当前线程的优先级，并将该值赋值给整数变量 `priority`。\n\n第 31 到 34 行：\n```java\n\
  public void run( )\n{\n    obj.demo(priority, current);\n}\n```\n这些行包含了 `run(()`\
  \ 方法的定义。在方法体内部，对 `obj` 对象调用了 `demo(()` 方法。`priority` 和 `current` 变量的值作为参数传递给 `demo(()`\
  \ 方法。\n\n第 40 行：`synchro obj1 = new synchro();`\n在这一行中，`obj1` 被创建为 `synchro` 类的对象。\n\
  \n第 41 行：`synchro_demo thrd1 = new synchro_demo(obj1, “First”);`\n在这一行中，`thrd1`\
  \ 被创建为 `synchro_demo` 类的对象。在这里，将调用 `synchro_demo()` 构造函数，并将 `obj1` 对象和字符串 `First`\
  \ 作为参数传递给它。\n\n第 42 和 43 行的工作原理与第 41 行相似。\n\n\n\n\n在此行中，`getName()` 方法返回当前线程的名称，并将其赋值给\
  \ `String` 类型变量 `cur`。\n\n示例 7 的输出显示如图 8-7 所示。\n\n![C08SC007.tif](img/C08SC007_fmt.jpeg)\n\
  \n图 8-7 示例 7 的输出\n\n# 同步块 (Synchronized Block)\n\n同步块可以对方法的任何特定块执行同步。它的范围比方法小。你可以使用下面的\
  \ `synchronized` 关键字对代码块进行同步：\n\n```java\nsynchronized (object)\n{\n    要执行的语句\n\
  }\n```\n\n在这里，`object` 代表被同步的对象。\n\n### 示例 8\n\n下面的示例（与之前相同）说明了 `synchronized` 块的使用。程序将创建多个线程并使用\
  \ `synchronized` 块对它们进行同步。\n\n```java\n//写一个程序说明同步块的使用\nclass synchro\n{\n    void\
  \ demo(int p, String name)\n    {\n        System.out.println(\"Priority of thread\
  \ \"+name+\" is: \"+p);\n        System.out.println(\"Executing \" +name);\n   \
  \     try\n        {\n            Thread.sleep(1500);\n        }\n        catch(InterruptedException\
  \ e)\n        {\n            System.out.println(\"Exception occurred\");\n     \
  \   }\n        System.out.println(name+\" is stopped\");\n    }\n}\n\nclass synchro_demo\
  \ extends Thread\n{\n    synchro obj;\n    String current;\n    int priority;\n\
  \    synchro_demo(synchro instance, String str)\n    {\n        super(str);\n  \
  \      current = str;\n        this.obj = instance;\n        priority = this.getPriority();\n\
  \        start();\n    }\n    public void run()\n    {\n        synchronized(obj)\n\
  \        {\n            obj.demo(priority, current);\n        }\n    }\n}\nclass\
  \ synchronized_demo\n{\n    public static void main(String arg[ ])\n    {\n    \
  \    synchro obj1 = new synchro();\n        synchro_demo thrd1 = new synchro_demo(obj1,\
  \ \"First\");\n        synchro_demo thrd2 = new synchro_demo(obj1, \"Second\");\n\
  \        synchro_demo thrd3 = new synchro_demo(obj1, \"Third\");\n        String\
  \ cur = Thread.currentThread().getName();\n        try\n        {\n            Thread.sleep(5000);\n\
  \        }\n        catch(InterruptedException e)\n        {\n            System.out.println(\"\
  Exception occurred\");\n        }\n        System.out.println(cur+\" is stopped\"\
  );\n    }\n}\n```\n\n#### 解释\n\n该程序的工作原理与之前的程序类似，不同在于在此情况下，每当调用 `run()` 方法时，`run()`\
  \ 方法体内的 `synchronized` 代码块都会被执行。\n\n该程序的输出也与之前的程序相似。\n\n# 协作（线程间通信）\n\n同步线程可以通过协作（线程间通信）相互通信。在这个过程中，一个线程的执行会被暂停，以允许另一个线程执行。它通过\
  \ `Object` 类的以下方法实现：\n\n1. `wait()`\n2. `notify()`\n3. `notifyAll()`\n\n## wait()\
  \ 方法\n\n`wait()` 方法通知调用线程放弃监视器并进入睡眠模式，直到其他线程进入同一个监视器并调用 `notify()` 或 `notifyAll()`\
  \ 方法。你可以指定线程等待的时间段。\n\n## notify() 方法\n\n`notify()` 方法通知等待的线程。如果有多个线程处于等待状态，则将随机选择其中一个进行通知。\n\
  \n## notifyAll() 方法\n\n`notifyAll()` 方法通知所有等待的线程。优先级最高的线程将首先运行。\n\n### 示例 9\n\n\
  下面的示例说明了 `wait()` 和 `notify()` 方法的使用。程序将创建两个线程并在它们上应用 `wait()` 和 `notify()` 方法。它还会在屏幕上显示一些消息。\n\
  \n```java\n/*写一个程序创建两个线程并说明 wait() 和 notify 方法的工作原理 */\nclass Inter_Thread_demo\
  \ extends Thread\n{\n    boolean flag;\n    String name;\n    Inter_Thread_demo(String\
  \ str)\n    {\n        super(str);\n        name = str;\n        flag = false;\n\
  \        start();\n    }\n    public void run()\n    {\n        try\n        {\n\
  \            for(int i=0; i<=5; i++)\n            {\n                System.out.println(\"\
  Executing: \" +name);\n                Thread.sleep(500);\n                synchronized(this)\n\
  \                {\n                    while(flag)\n                    {\n   \
  \                     wait();\n                    }\n                }\n      \
  \      }\n        }\n        catch(InterruptedException e)\n        {\n        \
  \    System.out.println(name + \" is interrupted\");\n        }\n        System.out.println(\"\
  Exiting: \" +name);\n    }\n    void wait()\n    {\n        // 方法实现略\n    }\n  \
  \  void notify()\n    {\n        // 方法实现略\n    }\n}\n```\n（注：示例 9 提供的文本包含行号和碎片逻辑；上述已根据源文本中的逻辑将其清理为标准的代码块结构。）\n\
  \n![C08SC008.tif](img/C08SC008_fmt.jpeg)\n\n图 8-8 示例 9 的输出\n\n# 死锁 (Deadlock)\n\n\
  死锁是指两个线程需要对方的资源，但它们中的一个都不准备释放自己的资源的情况。在这种情况下，两个线程相互产生循环依赖并永久阻塞，因为由于缺乏资源，没有线程可以完成执行。当程序发生死锁时，系统无法避免或纠正它。因此，程序员有责任避免此类情况，并确保两个线程之间永远不存在循环依赖。\n\
