  \ 对象的引用。现在，结果引用赋值给 `Demo` 类的另一个对象 `obj2`。\n\n### 示例 8\n\n以下示例说明了从方法返回对象的概念。程序将计算前十个自然数的平方，并在屏幕上显示结果值。\n\
