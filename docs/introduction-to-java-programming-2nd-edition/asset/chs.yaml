  \n图 11-17 示例 8 的输出\n\n## Button 控制\n\n`Button` 控件是 GUI 中最常用的组件。要创建按钮，使用了 `Button`\
  \ 类。由于这些按钮包含标签，因此它们被称为带标签按钮。每当按钮被按下时，它就会产生一个事件，应用程序会执行相应的操作。\n\n### Button 类的构造函数\n\
  \n`Button` 类提供了以下构造函数来创建按钮对象。\n\n- `Button( )`\n- `Button(String text)`\n\n在这些构造函数中，第一个构造函数\
  \ `Button()` 创建一个没有标签的按钮。而第二个构造函数 `Button(String text)` 创建一个包含标签的按钮，标签由 `text` 字符串指定。\n\
  \n### 设置按钮的标签\n\n创建按钮后，你可以使用 `Button` 类的 `setLabel()` 方法设置其标签。使用 `setLabel()` 的语法为：\n\
  `void setLabel(String txt)`\n在此语法中，按钮的标签被设置为由 `txt` 字符串指定的字符串。\n\n你也可以使用 `Button`\
  \ 类的 `getLabel()` 方法获取按钮的当前标签。使用 `getLabel()` 的语法为：\n`String getLabel( )`\n在此语法中，`getLabel()`\
  \ 方法将返回按钮的标签。\n\n### 示例 9\n\n接下来的示例说明了创建按钮的方法通过按钮处理事件的概念。该程序将创建两个按钮并将它们添加到 applet\
  \ 中。此外，程序将显示输出。\n\n```java\n//编写一个创建两个按钮的程序\nimport java.awt.*;\nimport java.applet.*;\n\
  import java.awt.event.*;\n<applet code=\"ButtonDemo.class\" width=200 height=100>\n\
  public class ButtonDemo extends Applet implements ActionListener {\n    Button btn1,\
  \ btn2;\n    public void init( ) {\n        btn1 = new Button(\"Red\");\n      \
  \  btn2 = new Button(\"Cyan\");\n        add(btn1);\n        add(btn2);\n      \
  \  btn1.addActionListener(this);\n        btn2.addActionListener(this);\n    }\n\
  \    public void actionPerformed(ActionEvent e) {\n        String str = e.getActionCommand(\
  \ );\n        if(str.equals(\"Red\")) {\n            btn1.setBackground(Color.red);\n\
  \        }\n        else if(str.equals(\"Cyan\")) {\n            btn2.setBackground(Color.cyan);\n\
  \        }\n    }\n}\n```\n\n#### 解析\n\n#### 第 5 行\n`public class ButtonDemo extends\
  \ Applet implements ActionListener`\n在这一行中，`ButtonDemo` 类继承了 `Applet` 类并实现了 `ActionListener`\
  \ 接口。该接口定义了 `actionPerformed()` 方法，当按钮产生事件时，该方法会被调用。\n\n#### 第 7 行\n`Button btn1,\
  \ btn2;`\n在这一行中，`btn1` 和 `btn2` 被声明为 `Button` 类型的对象。\n\n#### 第 10 行\n`btn1 = new\
  \ Button(\"Red\");`\n在这一行中，创建了对象 `btn1` 作为按钮，它包含 `Red` 字符串作为其标签。\n\n#### 第 11 行\n\
  `btn2 = new Button(\"Cyan\");`\n在这一行中，创建了对象 `btn2` 作为按钮，它包含 `Cyan` 字符串作为其标签。\n\n\
  #### 第 12 行\n`add(btn1);`\n在这一行中，`add()` 方法将按钮 `btn1` 添加到 applet 窗口，它作为参数传递给 applet\
  \ 窗口。\n\n#### 第 13 行\n`add(btn2);`\n在这一行中，`add()` 方法将按钮 `btn2` 添加到 applet 窗口。\n\n\
  #### 第 14 行\n`btn1.addActionListener(this);`\n在这一行中，`addActionListener()` 方法为 `btn1`\
  \ 添加了监听器。现在，该监听器是当前类。\n\n#### 第 15 行\n`btn2.addActionListener(this);`\n在这一行中，`addActionListener()`\
  \ 方法为 `btn2` 添加了监听器。现在，该监听器是当前类。\n\n### 第 18 到 29 行\n```java\npublic void actionPerformed(ActionEvent\
  \ e) {\n    String str = e.getActionCommand( );\n    if(str.equals(\"Red\")) {\n\
  \        btn1.setBackground(Color.red);\n    }\n    else if(str.equals(\"Cyan\"\
  )) {\n        btn2.setBackground(Color.cyan);\n    }\n}\n```\n这些行包含了 `actionPerformed()`\
  \ 方法的定义。当按钮产生事件时，会调用该方法并将 `ActionEvent` 类对象作为参数传递给它。例如，当你点击带 `Red` 标签的按钮时，会产生事件并调用\
  \ `actionPerformed()` 方法。此时，`ActionEvent` 对象 `e` 包含了 `btn1` 按钮的标签。在方法内部，`getActionCommand()`\
  \ 方法将返回按钮的标签，该标签将被赋值给 `str` 字符串对象。接下来，在 `if` 语句中，`str` 字符串对象的值将通过 `equals()` 方法与\
  \ `Red` 字符串进行比较。如果两个字符串相等，则 `btn1` 按钮的背景将被设置为 `red`。否则，将执行 `else if` 语句并将 `btn2`\
  \ 按钮的背景设置为 `cyan`。\n\n## TextField 控制\n\n`TextField` 控件是一种提供单行文本区域的组件，用户可以在其中输入文本。由于文本字段中的文本是可编辑的，用户可以直接对其进行编辑。使用\
  \ `TextField` 类可以实现文本字段。\n\n### TextField 类的构造函数\n\n`TextField` 类提供了以下构造函数来创建文本字段对象。\n\
  \n- `TextField( )`\n- `TextField(int columns)`\n- `TextField(String str)`\n- `TextField(String\
  \ str, int columns)`\n\n\n\n\n\n`TextField()` 构造函数创建一个具有默认规格的文本字段。`TextField(int\
  \ columns)` 构造函数创建一个最大宽度由整数变量 `columns` 指定的文本字段。在这里，最大宽度指定了用户可以在文本字段中输入的字符总数。`TextField(String\
  \ str)` 构造函数创建一个包含由 `str` 字符串对象指定的文本字符串的文本字段。`TextField(String str, int columns)`\
  \ 构造函数创建一个包含由 `str` 字符串对象指定的文本字符串，并通过整数变量 `columns` 设置文本字段的最大宽度。\n\n### 在文本字段中选择文本的特定部分\n\
  \n你可以使用 `select()` 方法选择文本字段中包含的特定部分文本。使用 `select()` 方法的语法如下：\n\n```java\nvoid select(int\
  \ start, int end)\n```\n\n在此语法中，选中了从 `start` 开始到 `end` 结束的字符序列。\n\n你也可以使用 `getSelectedText()`\
  \ 方法选择文本字段中的特定部分文本。使用 `getSelectedText()` 方法的语法如下：\n\n```java\nString getSelectedText()\n\
  ```\n\n在此语法中，`getSelectedText()` 方法将返回选中的文本字符串。\n\n### 检查文本字段中的文本\n\n你可以使用 `isEditable()`\
  \ 方法来检查文本字段中的文本是否可编辑。使用 `isEditable()` 方法的语法如下：\n\n```java\nboolean isEditable()\n\
  ```\n\n在此语法中，如果文本字段中的文本是可编辑的，`isEditable()` 方法返回 `true`。否则，它返回 `false`。\n\n### 在文本字段中设置特殊字符\n\
  \n你可以使用 `setEchoChar()` 方法为密码等某些类型的机密文本设置特殊字符。使用 `setEchoChar()` 方法的语法如下：\n\n```java\n\
  void setEchoChar(char ch)\n```\n\n在此语法中，文本字段的内容将以字符变量 `ch` 指定特殊字符的形式显示。\n\n####\
  \ 示例 10\n\n以下示例说明了创建文本字段的方法，以及处理由文本字段生成的事件的概念。程序将创建两个文本字段并将它们添加到 applet 窗口中。\n\n\
  ```java\n//写一个创建两个文本字段的程序\n1 import java.awt.*;\n2 import java.applet.*;\n3 import\
  \ java.awt.event.*;\n4 //<applet code= “TextFieldDemo.class” width=600 height=150></applet>\n\
  5 public class TextFieldDemo extends Applet implements ActionListener\n6 {\n7 Label\
  \ login, pass;\n8 TextField loginid, password;\n9 public void init()\n10 {\n11 login\
  \ = new Label(“Login ID”);\n12 pass = new Label(“Password”);\n13 loginid = new TextField(20);\n\
  14 password = new TextField(20);\n15 password.setEchoChar('#’);\n16 add(login);\n\
  17 add(loginid);\n18 add(pass);\n19 add(password);\n20 password.addActionListener(this);\n\
  21 }\n22 public void actionPerformed(ActionEvent e)\n23 {\n24 if(e.getSource()==password)\n\
  25 {\n26 repaint();\n27 password.setText(loginid.getSelectedText());\n28 }\n29 }\n\
  30 public void paint(Graphics g)\n31 {\n32 g.drawString(“你输入的登录 ID 是: ”+loginid.getText(),\
  \ 10, 100);\n33 g.drawString(“分配给你的密码是: ”+password.getText(), 10, 120);\n34 }\n\
  33 }\n```\n\n#### 解释\n\n**第 13 行**\n`loginid = new TextField(20);`\n在这一行中，创建了类型\
  \ `TextField` 的文本字段对象 `loginid`。文本字段的最大宽度被设置为 20 列。第 14 行的原理与第 13 行相似。\n\n**第 15\
  \ 行**\n`password.setEchoChar('#’);`\n在这一行中，`setEchoChar()` 方法将文本字段 `password` 的文本设置为特殊字符\
  \ `#`。现在，文本字段 `password` 的整个文本将仅以 `#` 字符的形式显示。\n\n**第 20 行**\n`password.addActionListener(this);`\n\
  在这一行中，为文本字段 `password` 添加了一个 `ActionListener`。接下来，该监听器将接收由文本字段 `password` 生成的动作事件通知。这里，代表当前的监听器。\n\
  \n**第 23 行到第 30 行**\n```java\npublic void actionPerformed(ActionEvent e)\n{\nif(e.getSource()==password)\n\
  {\nrepaint();\npassword.setText(loginid.getSelectedText());\n}\n}\n```\n这些行包含了 `actionPerformed()`\
  \ 方法的定义。当文本字段 `password` 中的特定部分或全部文本被选中时，将调用此方法。接下来，按下回车键。当产生事件时，控制将转移到此方法并执行方法体。在方法体内部，`if`\
  \ 语句将使用 `getSource()` 方法检查事件源。然后，将事件源与文本字段 `password` 进行比较。如果比较返回布尔值 `true`，则执行\
  \ `if` 语句体。\n\n\n\n\n\n在此语法中，`getLabel( ` 方法将返回复选框的当前标签字符串。\n\n#### 示例 11\n\n以下示例说明了创建复选框的方法以及处理由复选框生成的事件的概念。程序将创建两个复选框并将它们添加到应用程序窗口中。此外，程序将显示输出。\n\
  \n```java\n//Write a program to create two check boxes\n1 import java.awt.*;\n2\
  \ import java.applet.*;\n3 import java.awt.event.*;\n4 //<applet code=“CheckboxDemo.class”\
  \ width=300 height=150></applet>\n5 public class CheckboxDemo extends Applet implements\
  \ ItemListener\n6 {\n7 String str = “You have selected: ”;\n8 String msg = “ ”;\n\
  9 Checkbox cbmusic, cbvideo;\n10 public void init( )\n11 {\n12 cbmusic = new Checkbox(“Music”);\n\
  13 cbvideo = new Checkbox(“Video”, false);\n14 add(cbmusic);\n15 add(cbvideo);\n\
  16 cbmusic.addItemListener(this);\n17  cbvideo.addItemListener(this);\n18 }\n19\
  \ public void itemStateChanged(ItemEvent e)\n20 {\n21 repaint( );\n22 }\n23  public\
  \ void paint(Graphics g)\n24 {\n25 int x = 10, y =100;\n26 if(cbmusic.getState()==false\
  \ && cbvideo.getState()==false)\n27 {\n28 g.drawString(“No option Selected”, x,\
  \ y);\n29 }\n30 else\n31 {\n32 if(cbmusic.getState( ) == true)\n33 {\n34 msg = cbmusic.getLabel(\
  \ );\n35 g.drawString(str+msg, x, y);\n36 }\n37 if(cbvideo.getState( ) == true)\n\
  38 {\n39 msg = cbvideo.getLabel( );\n40 g.drawString(str+msg, x, y+20);\n41 }\n\
  42 }\n43 }\n```\n\n#### 解释\n\n#### 第 5 行\n`public class CheckboxDemo extends Applet\
  \ implements ItemListener`\n在这行中，`CheckboxDemo` 类继承了 `Applet` 类并实现了 `ItemListener`\
  \ 接口。\n\n#### 第 9 行\n`Checkbox cbmusic, cbvideo;`\n在这行中，`cbmusic` 和 `cbvideo` 被声明为\
  \ `Checkbox` 类的对象。\n\n#### 第 12 行\n`cbmusic = new Checkbox(“Music”);`\n在这行中，创建了一个带有\
  \ `Music` 标签的新复选框。在这里，构造函数中没有提到复选框的初始状态，因此默认状态被设置为 `false`。\n\n#### 第 13 行\n`cbvideo\
  \ = new Checkbox(“Video”, false);`\n在这行中，创建了一个带有 `Video` 标签的新复选框，其初始状态被设置为 `false`。\n\
  \n#### 第 14 和 15 行\n`add(cbmusic);`\n`add(cbvideo);`\n在这些行中，通过 `add( )` 方法将 `cbmusic`\
  \ 和 `cbvideo` 复选框添加到应用程序窗口中。\n\n#### 第 16 行\n`cbmusic.addItemListener(this);`\n\
  在这行中，为 `cbmusic` 复选框添加了一个事件监听器。它处理由 `cbmusic` 复选框生成的所有项目事件。第 17 行的工作原理与第 16 行类似。\n\
  \n#### 第 19 到 22 行\n`public void itemStateChanged(ItemEvent e)`\n`{`\n`repaint(\
  \ );`\n`}`\n这些行包含了 `ItemListener` 接口中 `itemStateChanged( )` 方法的定义。每当用户选择或取消选择时，都会调用此方法。在方法体内，会调用\
  \ `repaint( )` 方法来重绘应用程序窗口。\n\n#### 第 26 到 29 行\n`if(cbmusic.getState()==false &&\
  \ cbvideo.getState()==false)`\n`{`\n`g.drawString(“No option Selected”, x, y);`\n\
  `}`\n在这里，在 `if` 语句内部，`getState( )` 方法返回 `cbmusic` 和 `cbvideo` 复选框的当前状态。如果两个复选框的当前状态均为\
  \ `false`，则 `drawString( )` 方法将在位置 `10, 100` 处绘制 `No option Selected` 字符串。否则，与 `if`\
  \ 语句相关的语句将被跳过，控制转移到相关的 `else` 块。\n\n#### 第 30 到 42 行\n`else`\n`{`\n`if(cbmusic.getState(\
  \ ) == true)`\n`{`\n`msg = cbmusic.getLabel( );`\n`g.drawString(str+msg, x, y);`\n\
  `}`\n`if(cbvideo.getState( ) == true)`\n`{`\n`msg = cbvideo.getLabel( );`\n`g.drawString(str+msg,\
  \ x, y+20);`\n`}`\n`}`\n当 `if` 语句（第 26 行）中的条件评估为 `false` 时，将执行 `else` 块。否则，将跳过 `else`\
  \ 块。在 `else` 块内部，第一个 `if` 语句将检查 `cbmusic` 复选框的状态是否等于 `true`。如果条件评估为真，控制将转移到 `if`\
  \ 语句内部，此时 `getLabel( )` 方法将返回 `cbmusic` 复选框的当前标签，该标签将赋值给 `msg` 字符串对象。在下一个语句中，`drawString(\
  \ )` 方法将在位置 `10, 100` 处绘制 `str+msg` 字符串。第二个 `if` 语句的工作原理与第一个 `if` 语句相同。\n\n\n\n\
  在这些语法中，`select(()` 方法的第一种形式将由 `label` 指定标签字符串的项设置为当前选中项。`select(()` 方法的第二种形式将由整数变量\
  \ `index` 指定索引值的项设置为当前选中项。\n\n## 从列表中获取特定项目的标签字符串\n\n你也可以使用 `getItem(()` 方法从列表中获取特定项目的标签字符串。使用\
  \ `getItem(()` 方法的语法如下：\n\n```java\nString getItem(int index)\n```\n\n在此语法中，`getItem(()`\
  \ 方法返回索引值由整数变量 `index` 指定的项的标签字符串。\n\n#### 示例 12\n\n以下示例说明了创建 `Choice` 控件的方法，以及处理由\
  \ `Choice` 控件项生成的事件的概念。程序将创建一个 `Choice` 控件并将其添加到 applet 窗口。此外，程序将显示输出。\n\n```java\n\
  //Write a program to create a choice control\nimport java.awt.*;\nimport java.applet.*;\n\
  import java.awt.event.*;\n//applet code=“ChoicelistDemo” width=300 height=150> </applet>\n\
  public class ChoicelistDemo extends Applet implements ItemListener\n{\n    Label\
  \ lblname, lblage;\n    Choice name, age;\n    String str = “The name is: ”;\n \
  \   String str1 = “The age is: ”;\n    public void init()\n    {\n        lblname\
  \ = new Label(“Name:”);\n        lblage = new Label(“Age:”);\n        name = new\
  \ Choice();\n        age = new Choice();\n        name.add(“Williams”);\n      \
  \  name.add(“John”);\n        name.add(“Smith”);\n        name.add(“Tom”);\n   \
  \     age.add(“1-20”);\n        age.add(“21-40”);\n        age.add(“41-60”);\n \
  \       age.add(“61-80”);\n        age.add(“81-100”);\n        age.add(“> 100”);\n\
  \        add(lblname);\n        add(name);\n        add(lblage);\n        add(age);\n\
  \        name.addItemListener(this);\n        age.addItemListener(this);\n    }\n\
  \    public void itemStateChanged(ItemEvent e)\n    {\n        repaint();\n    }\n\
  \    public void paint(Graphics g)\n    {\n        g.drawString(str + name.getSelectedItem(\
  \ ), 10, 100);\n        g.drawString(str1 + age.getSelectedItem( ), 10, 120);\n\
  \    }\n}\n```\n\n#### 解析\n\n### 第 15 行和 16 行\n```java\nname = new Choice();\nage\
  \ = new Choice();\n```\n在这些行中，创建了 `name` 和 `age` 选择控件。这里，两个控件都只包含空项目列表。\n\n### 第\
  \ 17 行到 20 行\n```java\nname.add(“Williams”);\nname.add(“John”);\nname.add(“Smith”);\n\
  name.add(“Tom”);\n```\n在这些行中，由标签字符串 `Williams`、`John`、`Smith` 和 `Tom` 代表的四个项目被添加到选择控件\
  \ `name` 的列表中。位于 `0` 标签字符串 `Williams` 将默认作为列表当前选中项显示。\n\n### 第 21 行到 26 行\n```java\n\
  age.add(“1-20”);\nage.add(“21-40”);\nage.add(“41-60”);\nage.add(“61-80”);\nage.add(“81-100”);\n\
  age.add(“> 100”);\n```\n在这些行中，由标签字符串 `1-20`、`21-40`、`41-60`、`61-80`、`81-100` 和 `>100`\
  \ 代表的六个项目被添加到选择控件 `age` 的列表中。位于 `0` 标签字符串 `1-20` 将默认作为列表当前选中项显示。\n\n#### 第 28 行\n\
  ```java\nadd(name);\n```\n在这一行中，`name` 选择控件被添加到 applet 窗口。\n\n#### 第 30 行\n```java\n\
  add(age);\n```\n在这一行中，`age` 选择控件被添加到 applet 窗口。\n\n### 第 31 行\n```java\nname.addItemListener(this);\n\
  ```\n在这一行中，选择控件 `name` 注册了 `ItemListener`。现在，当选择控件 `name` 的项生成事件时，事件监听器将收到通知。接下来，监听器将执行指定的操作来处理事件。第\
  \ 32 行的功能与第 31 行类似。\n\n### 第 34 行到 37 行\n```java\npublic void itemStateChanged(ItemEvent\
  \ e)\n{\n    repaint();\n}\n```\n在这些行中，重写了 `ItemListener` 接口的 `itemStateChanged(()`\
  \ 方法，以处理当选中 `name` 或 `age` 选择控件中的某个项时生成的项目事件。在方法体内，调用了 `repaint(()` 方法来重绘 applet\
  \ 窗口。\n\n### 第 40 行\n```java\ng.drawString(str + name.getSelectedItem( ), 10, 100);\n\
  ```\n在这一行中，`getSelectedItem(()` 方法从列表中获取当前选中项。\n\n\n\n\n\n在本示例中，`select()` 方法将文本项\
  \ `Smith`（位于索引位置 1 的项）设置为列表控件 `name` 中的当前选中项。\n\n### 从列表控件获取当前选中项\n\n你可以使用 `getSelectedItem()`\
  \ 或 `getSelectedIndex()` 方法从列表控件获取当前选中项的文本标签或索引。使用 `getSelectedItem()` 和 `getSelectedIndex()`\
  \ 方法的语法如下：\n\n```\nString getSelectedItem()\nint getSelectedIndex()\n```\n\n在这里，`getSelectedItem()`\
  \ 方法返回当前选中项的文本标签。例如，当你在上一个示例中应用此方法且此时当前选中项为 `Smith` 时，该方法将返回文本标签 `Smith` 作为结果。另一方面，`getSelectedIndex()`\
  \ 方法返回当前选中项的索引位置。例如，如果你在上一个示例中应用此方法（此时当前选中项为 `Smith`），你将得到整数值 `1` 作为结果。\n\n上述讨论的方法仅适用于单选列表，即用户一次只能选择一个项目。但是，对于多选列表，你可以使用\
  \ `getSelectedItems()` 和 `getSelectedIndexes()` 方法。使用 `getSelectedItems()` 和 `getSelectedIndexes()`\
  \ 方法的语法如下：\n\n```\nString[] getSelectedItems()\nint[] getSelectedIndexes()\n```\n\
  \n在这里，`getSelectedItems()` 方法返回一个字符串数组，包含所有当前选中项的文本标签。`getSelectedIndexes()` 方法返回一个整数数组，包含所有当前选中项的索引位置。\n\
  \n### 从列表控件获取特定项\n\n你可以使用 `List` 类的 `getItem()` 方法从项目列表中获取特定的项目。使用 `getItem()` 方法的语法如下：\n\
  \n```\nString getItem(int position)\n```\n\n在此语法中，`getItem()` 方法返回由整数变量 `position`\
  \ 指定索引位置的项的文本标签。\n\n例如：\n\n```\nList name = new List();\nname.add(\"William\");\n\
  name.add(\"Smith\");\nname.add(\"John\");\n\nString str = name.getItem(2);\n```\n\
  \n在此示例中，`getItem()` 方法返回标签 `John`（位于索引位置 2 的项），并将其赋值给字符串对象 `str`。\n\n### 获取列表中的项目总数\n\
  \n你可以使用使用 `List` 类的 `getItemCount()` 方法获取列表中所包含的项目总数。使用 `getItemCount()` 方法的语法如下：\n\
  \n```\nint getItemCount()\n```\n\n在此语法中，`int getItemCount()` 方法返回一个整数值，指定列表中包含的项目总数。\n\
  \n例如：\n\n```\nList name = new List();\nname.add(\"William\");\nname.add(\"Smith\"\
  );\nname.add(\"John\");\nint total = name.getItemCount();\n```\n\n在此示例中，`getItemCount()`\
  \ 方法返回整数值 `3`，因为列表 `name` 包含了三个文本项。\n\n### 示例 13\n\n下面的示例说明了创建列表控件的方法以及处理由控件项生成的事件的概念。程序将创建一个列表控件并将其添加到\
  \ applet 窗口中。此外，程序将显示输出。\n\n```java\n//写一个程序创建一个列表控件\nimport java.awt.*;\nimport\
  \ java.applet.*;\nimport java.awt.event.*;\n//<applet code=\"ListDemo.class\" width=300\
  \ height=150></applet>\npublic class ListDemo extends Applet implements ActionListener\n\
  {\n    List colors;\n    int i;\n    public void init()\n    {\n        colors =\
  \ new List();\n        colors.add(\"Red\");\n        colors.add(\"Dark Green\");\n\
  \        colors.add(\"Blue\");\n        colors.add(\"Dark Gray\");\n        colors.add(\"\
  Magenta\");\n        add(colors);\n        colors.addActionListener(this);\n   \
  \ }\n    public void actionPerformed(ActionEvent e)\n    {\n        repaint();\n\
  \    }\n    public void paint(Graphics g)\n    {\n        int i = colors.getSelectedIndex();\n\
  \        String str = colors.getSelectedItem();\n        switch(i)\n        {\n\
  \            case 0:\n            {\n                colors.setForeground(Color.red);\n\
  \                setForeground(Color.red);\n                g.drawString(\"You have\
  \ selected: \" +str,10,100);\n                break;\n            }\n          \
  \  case 1:\n            {\n                colors.setForeground(Color.green);\n\
  \                setForeground(Color.green);\n                g.drawString(\"You\
  \ have selected: \" +str,10,100);\n                break;\n            }\n     \
  \       case 2:\n            {\n                colors.setForeground(Color.blue);\n\
  \                setForeground(Color.blue);\n                g.drawString(\"You\
  \ have selected: \" +str,10,100);\n                break;\n            }\n     \
  \       case 3:\n            {\n                colors.setForeground(Color.gray);\n\
  \                setForeground(Color.gray);\n                g.drawString(\"You\
  \ have selected: \" +str,10,100);\n                break;\n            }\n     \
  \       case 4:\n            {\n                colors.setForeground(Color.magenta);\n\
  \                setForeground(Color.magenta);\n                g.drawString(\"\
  You have selected: \" +str,10,100);\n                break;\n            }\n   \
  \         default:\n            {\n                colors.setForeground(Color.cyan);\n\
  \                setForeground(Color.cyan);\n                g.drawString(\"Please\
  \ select an item\",10,100);\n                break;\n            }\n        }\n\
  \    }\n}\n```\n\n#### 解析\n\n- **第 11 行**: `colors = new List();` 在这一行中，`colors`\
  \ 被创建一个单选控件，用户可以从中选择一个项。\n- **第 12-16 行**: `colors.add(\"Red\");`, `colors.add(\"\
  Dark Green\");`, `colors.add(\"Blue\");`, `colors.add(\"Dark Gray\");`, `colors.add(\"\
  Magenta\");` 在这些行中，文本项 Red、Dark Green、Blue、Dark Gray 和 Magenta 被添加到列表控件中。\n- **第\
  \ 17 行**: `add(colors);` 在这一行中，通过 `add()` 方法将 `colors` 列表控件添加到 applet 窗口中。\n- **第\
  \ 18 行**: `colors.addActionListener(this);` 在这一行中，`ActionListener` 被注册到列表控件中。每当列表控件的文本项生成事件时，该监听器都会通知并执行所需的操作。\n\
  - **第 20-23 行**: `public void actionPerformed(ActionEvent e) { repaint(); }` 这些行包含了\
  \ `actionPerformed()` 方法的定义。每当产生事件时，都会调用此方法来处理该事件。在方法体内部，将调用 `repaint()` 方法，该方法用于在屏幕上重绘\
  \ applet 窗口。\n- **第 26 行**: `int i = colors.getSelectedIndex();` 在这一行中，`getSelectedIndex()`\
  \ 方法返回当前选中项的索引值。接下来，将结果赋值给整数变量 `i`。\n- **第 27 行**: `String str = colors.getSelectedItem();`\
  \ 在这一行中，`getSelectedItem()` 方法返回当前选中项的标签字符串。接下来，将结果赋值给字符串对象 `str`。\n- **第 28 行**:\
  \ `switch(i)` 在这一行中，使用了 `switch` 语句，并将整数变量 `i`（包含当前选中项的索引值）作为控制变量。在这里，整数变量 `i` 的值将与\
  \ switch 块内部给出的不同 case 进行匹配。如果找到匹配，将执行与特定 case 关联的语句并跳过剩余 case。如果没有找到匹配，将执行与 `default`\
  \ case 关联的语句。\n- **第 30-36 行**: `case 0: { colors.setForeground(Color.red); setForeground(Color.red);\
  \ g.drawString(\"You have selected: \" +str,10,100); break; }`\n\n\n\n\n在这些行中，如果变量\
  \ `i` 的值等于 `0`，则将执行与 `case` 关联的语句。在块内部，第一条语句将颜色控制列表和小程序窗口的前景颜色设置为红色。现在，小程序窗口中的整个文本将以红色显示。在下一条语句中，`drawString(\
  \ )` 方法将在 `10, 100` 处显示以下语句：\n\n您已选择：红色\n\n在下一行中，`break` 语句将控制权转移到 `switch` 块之外，并跳过所有剩余\
  \ `case`。\n\n从 `case 1` 到 `case 4` 的所有剩余情况的工作原理与 `case 0` 的。\n\n### 第 65 到 70 行\n\
  \n```java\ndefault:\n{\ncolors.setForeground(Color.cyan);\nsetForeground(Color.cyan);\n\
  g.drawString(“Please select an item from the list”,10,100);\n}\n```\n\n这些行代表 `default`\
  \ 情况，当在所有给定的 `case` 中未找到特定匹配时，将执行这些行。当第一次显示小程序窗口时，将执行默认情况，因为没有从颜色列表控件中选择项目。`default`\
  \ 情况的工作原理与 `case 0` 相同。\n\n带有默认前景色的示例 13 的输出显示图 11-25 中。\n\n![C11SC026.tif](img/C11SC026_fmt.jpeg)\n\
  \n图 11-25 带有默认前景色的示例 13 的输出\n\n在小程序窗口中，未从颜色列表控件选择任何文本项。因此，将执行默认情况，小程序窗口中的前景颜色将设置为青色。当用户通过双击从列表控件中选择\
  \ `Red` 时，将产生一个事件。接下来，将调用 `actionPerformed( )` 方法，该方法反过来将调用 `repaint( )` 方法。`repaint(\
  \ )` 方法继而将调用 `paint( )` 方法。在 `paint( )` 方法内部，`getSelectedIndex( )` 方法返回索引值 `0`，该值将赋值给变量\
  \ `i`。在这里，变量 `i` 的值将与 `case 0` 匹配，并执行与其关联的语句。结果是小程序窗口将重绘，如图 11-26 所示。\n\n同样，如果你双击\
  \ `List` 控件中的任何其他文本项，将产生一个事件，小程序窗口将重绘并显示在屏幕上。\n\n![C11SC027.tif](img/C11SC027_fmt.jpeg)\n\
  \n图 11-26 在列表中双击 Red 后示例 13 的输出\n\n## 滚动条控件\n\n当要查看的信息超出窗口的可视区域范围时，会使用滚动条控件。出现在窗口底部的滚动条被称为水平滚动条，出现在窗口右侧的滚动条被称为垂直滚动条。每个滚动条都包含一个滑块和滚动箭头。你可以使用\
  \ `Scrollbar` 类的对象创建一个滚动条控件。\n\n### Scrollbar 类的构造函数\n\n`Scrollbar` 类提供了以下构造函数来创建滚动条控件：\n\
  \n`Scrollbar( )`\n`Scrollbar(int orientation)`\n`Scrollbar(int orientation, int\
  \ val, int size, int min, int max)`\n\n在这些构造函数中，第一个构造函数 `Scrollbar( )` 创建垂直滚动条。第二个构造函数\
  \ `Scrollbar(int orientation)` 根据整数变量 `orientation` 的值创建一个滚动条。例如，如果整数变量 `orientation`\
  \ 的值为 `Scrollbar.HORIZONTAL`，则创建一个水平滚动条。而如果其值为 `Scrollbar.VERTICAL`，则创建一个垂直滚动条。第三个构造函数创建一个其方向由整数变量\
  \ `orientation` 指定的滚动条。在这个构造函数中，整数变量 `val` 指定滚动条的初始值；`min` 和 `max` 指定 `val` 变量的最小值和最大值；整数变量\
  \ `size` 指定滚动条可视区域的大小。\n\n#### 示例 14\n\n接下来的示例说明了创建水平滚动条的方法，并说明了在移动滑块或点击滚动条箭头时产生事件的处理概念。程序将创建一个水平滚动条并将其添加到小程序窗口中。此外，程序将显示输出。\n\
  \n```java\n//Write a program to create a horizontal scroll bar\nimport java.applet.*;\n\
  import java.awt.*;\nimport java.awt.event.*;\n//<applet code= “ScrollbarDemo” width=400\
  \ height=100></applet>\npublic class ScrollbarDemo extends Applet implements AdjustmentListener\n\
  {\n    Scrollbar hori;\n    public void init( )\n    {\n        hori = new Scrollbar(Scrollbar.HORIZONTAL,\
  \ 1, 1, 1, 100);\n        hori.addAdjustmentListener(this);\n        add(hori);\n\
  \        setLayout(new GridLayout(4,2)); \n    }\n    public void adjustmentValueChanged(AdjustmentEvent\
  \ e)\n    {\n        repaint( );\n    }\n    public void paint(Graphics g)\n   \
  \ {\n        int val = hori.getValue( );\n        g.drawString(“Slider is moved\
  \ to position: ” +val, 10, 75);\n    }\n}\n```\n\n#### 解析\n\n**第 5 行**\n`public\
  \ class scrollbardemo extends Applet implements AdjustmentListener`\n在这一行中，`scrollbardemo`\
  \ 继承了 `Applet` 并实现了 `AdjustmentListener`。\n\n**第 10 行**\n`hori = new Scrollbar(Scrollbar.HORIZONTAL,\
  \ 1, 1, 1, 100);`\n在这一行中，创建了一个水平滚动条 `hori`，其初始值为 1，大小为 1，最小值为 1，最大值为 100。\n\n**第\
  \ 11 行**\n`hori.addAdjustmentListener(this);`\n在这一行中，`AdjustmentListener` 被注册到滚动条对象\
  \ `hori` 中。每当滚动条产生一个事件时，该监听器都会收到通知。\n\n**第 12 行**\n`add(hori);`\n在这一行中，水平滚动条被添加了。\n\
  \n**第 15 到 18 行**\n```java\npublic void adjustmentValueChanged(AdjustmentEvent e)\n\
  {\n    repaint( );\n}\n```\n这些行包含了 `adjustmentValueChanged( )` 方法的定义。每当滚动条的滑块移动或点击箭头时，就会产生一个事件，监听器将调用此方法。该方法反过来将调用\
  \ `repaint( )` 方法，该方法又将调用 `paint( )` 方法，小程序窗口将重绘。\n\n**第 19 到 23 行**\n```java\n\
  public void paint(Graphics g)\n{\n    int val = hori.getValue( );\n    g.drawString(“Slider\
  \ is at position: ” +val, 10, 75);\n}\n```\n在 `paint( )` 方法体内部，`getValue( )` 方法返回一个指定滑块当前位置的整数值。接下来，结果将赋值给变量\
  \ `val`。\n\n\n\n\n\n### 构造函数\n\n在这些构造函数中，第一个构造函数创建一个空的文本区域。第二个构造函数创建一个带有 `str` 指定文本字符串的新文本区域。第三个构造函数创建一个由\
  \ `rows` 和 `columns` 变量分别指定行和列数的新文本区域。第四个构造函数创建一个新的文本区域。此构造函数指定文本区域将包含的文本字符串，`rows`\
  \ 和 `columns` 变量指定文本区域将包含的行数和列数。最后一个构造函数创建一个带有指定的文本字符串、行数列数以及由整数变量 `scrollbar` 指定滚动条的新文本区域。在这里，`scrollbar`\
  \ 变量包含以下四个常量中的任意一个值：\n\n- `SCROLLBARS_BOTH` 或 `0`\n- `SCROLLBARS_VERTICAL_ONLY`\
  \ 或 `1`\n- `SCROLLBARS_HORIZONTAL_ONLY` 或 `2`\n- `SCROLLBARS_NONE` 或 `3`\n\n###\
  \ 示例 15\n\n下面的示例说明了创建文本区域的方法。程序将创建一个 10 行 50 列且文本字符串为 Hello 的文本区域。此外，该文本区域将包含水平和垂直滚动条，将文本区域添加到\
  \ applet 窗口中并在屏幕上显示输出。\n\n```java\n//写一个程序创建一个文本区域\n1 import java.awt.*;\n2 import\
  \ java.applet.*;\n3 //<applet code= “TextAreaDemo.class” width=500 height=200>\n\
  </applet>\n4 public class TextAreaDemo extends Applet\n5 {\n6 TextArea ar;\n7 public\
  \ void init( )\n8 {\n9 ar = new TextArea(“Hello”, 10, 50, 0);\n10 add(ar);\n11 }\n\
  12 }\n```\n\n#### 解析\n\n#### 第 10 行\n`ar = new TextArea(“Hello”, 10, 50, 0);`\n\
  在此行中，创建了一个新的文本区域 `ar`。该文本区域包含 10 行、50 列、水平和垂直滚动条以及 Hello 文本字符串。\n\n#### 第 11 行\n\
  `add(ar);`\n在该行中，将使用 `add()` ) 方法将文本区域 `ar` 添加到 applet 窗口中。\n\n示例 15 的输出显示在图 11-29\
  \ 中。\n\n![C11SC030.tif](img/C11SC030_fmt.jpeg)\n图 11-29 示例 15 的输出\n\n### 布局管理器\n\
  \n在 Java 中，布局管理器定义了如何将按钮、文本字段等各种组件添加到 applet、frame 等容器中。布局管理器是实现 `LayoutManager`\
  \ 接口的类的对象。布局管理器控制添加到容器中的组件的位置和大小。每当使用容器时，都会使用默认布局来对其中的组件进行定位。但如果容器的默认布局不符合你的需求，你可以轻松地为它设置另一个布局管理器。AWT\
  \ 提供了以下布局管理器：\n\n- `FlowLayout`\n- `BorderLayout`\n- `GridLayout`\n- `CardLayout`\n\
  - `GridBagLayout`\n\n在这些布局管理器中，`FlowLayout`、`BorderLayout` 和 `GridLayout` 是最常用的布局管理器。你将在本节中学习这三个布局管理器。`CardLayout`\
  \ 和 `GridBagLayout` 布局管理器超出了本书的范围。\n\n### FlowLayout\n\n`FlowLayout` 是 applet 的默认布局管理器。该布局管理器像文本编辑器中对单词定位一样，在容器中从左到右对组件定位。在此布局中，组件从容器的左上角开始放置在单独的行中。当一行被组件填满时，布局将移动到下一行并开始放置剩余组件。默认情况下，此布局在任何两个相邻组件之间留出\
  \ 5 像素的空隙。在此布局中，每行默认居中对齐。你可以通过调整容器的大小、加宽或缩小容器来轻松理解这种布局中组件的放置。这样做，组件将根据容器的宽度从一行移动到另一行。\n\
  \n#### FlowLayout 的构造函数\n\n`java.awt.FlowLayout` 提供了以下构造函数来创建新的布局：\n\n- `FlowLayout()`\n\
  - `FlowLayout(int align)`\n- `FlowLayout(int align, int hori, int vert)`\n\n在这些构造函数中，第一个构造函数创建一个具有默认规范的布局，例如行居中对齐，两个组件之间的水平和垂直方向间距均为\
  \ 5 像素等。第二个构造函数创建一个由整数变量 `align` 指定对齐方式的布局。该变量可以是以下值之一：\n\n1. `FlowLayout.LEFT`\n\
  2. `FlowLayout.RIGHT`\n3. `FlowLayout.CENTER`\n4. `FlowLayout.LEADING`\n5. `FlowLayout.TRAILING`\n\
  \n此构造函数在两个组件之间的水平和垂直方向上都提供 5 像素的空隙。第三个构造函数创建一个由整数变量 `align` 指定对齐方式的布局；组件之间的水平和垂直间距分别由整数变量\
  \ `hori` 和 `vert` 指定。\n\n### 示例 16\n\n下面的示例说明了 `FlowLayout` 布局管理器的用法。程序将帧窗口的布局设置为\
  \ `FlowLayout`，将布局的对齐方式设置为左对齐，并在屏幕上显示容器。\n\n```java\n//写一个程序将帧窗口的布局设置为 FlowLayout\n\
  1 import java.awt.*;\n2 import java.awt.event.*;\n3 class layoutdemo extends WindowAdapter\n\
  4 {\n5 void windowClosing (WindowEvent event)\n6 {\n7 System.exit(0);\n8 }\n9 }\n\
  10 class layoutdemo extends Frame\n11 {\n12 Button btn1, btn2, btn3, btn4, btn5;\n\
  13 layoutdemo()\n14 {\n15 setLayout(new FlowLayout(FlowLayout.LEFT));\n16 layoutdemo\
  \ obj = new layoutdemo();\n17 addWindowListener(obj);\n18 setTitle(“Layout”);\n\
  19 btn1 = new Button(“Button 1”);\n20 btn2 = new Button(“Button 2”);\n21 btn3 =\
  \ new Button(“Button 3”);\n22 btn4 = new Button(“Button 4”);\n23 btn5 = new Button(“Button\
  \ 5”);\n24 setSize(250,200);\n25 add(btn1);\n26 add(btn2);\n27 add(btn3);\n28 add(btn4);\n\
  29 add(btn5);\n30 setVisible(true);\n31 }\n32 static void main(String arg[])\n33\
  \ {\n34 layoutdemo obj1 = new layoutdemo();\n35 }\n36 }\n```\n\n#### 解析\n\n####\
  \ 第 15 行\n`setLayout(new FlowLayout(FlowLayout.LEFT));`\n在此行中，`setLayout()` ) 方法将帧窗口的布局设置为\
  \ `FlowLayout`，并将布局的对齐方式设置为左对齐。现在，添加到帧窗口的所有组件将左对齐。\n\n示例 16 的输出显示在图 11-30 中。\n\n\
  ![C11SC031.tif](img/C11SC031_fmt.jpeg)\n图 11-30 示例 16 的输出\n\n在此帧窗口中，由于帧的宽度，按钮被放置了两行。现在，当你调整（加宽）窗口时，位于第二行的按钮将移动到第一行，如图\
  \ 11-31 所示。\n\n![C11SC032.tif](img/C11SC032_fmt.jpeg)\n图 11-31 调整窗口后示例 16 的输出\n\n\
  ### BorderLayout\n\n`BorderLayout` 是帧或窗口的默认布局管理器。边界布局提供了五个区域：北、南、东、西和中心。在区域中，你每次只能放置一个组件。北、南区域的组件在容器中水平放置，而东、西区域的组件垂直垂直放置。剩余的空隙（水平和垂直区域之间）由中心区域的组件填充。`BorderLayout`\
  \ 提供了以下常量，用于选择容器中的特定区域：\n\n1. `BorderLayout.NORTH`\n2. `BorderLayout.SOUTH`\n3.\
  \ `BorderLayout.EAST`\n4. `BorderLayout.WEST`\n5. `BorderLayout.CENTER`\n\n####\
  \ 在区域中添加组件\n\n你可以使用 `add()` ) 方法将组件添加到上述五个区域之一。使用 `add()` ) 方法在区域中添加组件的语法如下：\n\n\
  `add(Component obj, Object region)`\n\n在此语法中，`Component` 类的对象 `obj` 代表按钮、文本字段等组件。而\
  \ `region` 指定了组件 `obj` 将放置的特定区域。\n\n### 示例 17\n\n\n\n\n以下示例演示了 `BorderLayout` 布局管理器的用法。该程序将\
  \ applet 的布局设置为 `BorderLayout`，在其中不同的区域添加五个按钮，并在屏幕上显示生成的 applet 窗口。\n\n```java\n\
  //Write a program to set the layout of an applet to border layout\nimport java.awt.*;\n\
  import java.applet.*;\n//<applet code= “BorderLayoutDemo” width=300 height=150></applet>\n\
  public class BorderLayoutDemo extends Applet\n{\n    Button btn1, btn2, btn3, btn4,\
  \ btn5;\n    public void init( )\n    {\n        setLayout(new BorderLayout( ));\n\
  \        btn1 = new Button(“Button 1”);\n        btn2 = new Button(“Button 2”);\n\
  \        btn3 = new Button(“Button 3”);\n        btn4 = new Button(“Button 4”);\n\
  \        btn5 = new Button(“Button 5”);\n        add(btn1, BorderLayout.NORTH);\n\
  \        add(btn2, BorderLayout.SOUTH);\n        add(btn3, BorderLayout.EAST);\n\
  \        add(btn4, BorderLayout.WEST);\n        add(btn5, BorderLayout.CENTER);\n\
  \    }\n}\n```\n\n#### 解析\n\n#### 第 9 行\n`setLayout(new BorderLayout( ));`\n在这一行中，`setLayout()`\
  \ 方法将 applet 窗口的布局设置为 `BorderLayout`。\n\n#### 第 10 行\n`btn1 = new Button(“Button\
  \ 1”);`\n在这一行中，将创建一个名为 `btn1` 的新按钮控件，标签为 `Button 1`。第 11 到 14 行的工作原理与第 10 行相似。\n\
  \n#### 第 15 行\n`add(btn1, BorderLayout.NORTH);`\n在这一行中，`add()` 方法将按钮 `btn1` 放在北部区域，该区域由\
  \ applet 窗口的常量 `BorderLayout.NORTH` 指定。第 16 到 19 行的工作原理与第 15 行相似。\n\n示例 17 的输出显示图\
  \ 11-32 中。\n\n![C11SC033.tif](img/C11SC033_fmt.jpeg)\n图 11-32 示例 17 的输出\n\n### GridLayout\n\
  \n`GridLayout` 布局管理器将容器划分为网格，并将所有组件放入网格中。网格就像一个包含行和列的二维数组。在网格中，所有放置组件的高度和宽度都是相等的。\n\
  \n#### GridLayout 的构造函数\n\n`java.awt.BorderLayout` 提供了以下构造函数来创建 `GridLayout`：\n\
  - `GridLayout( )`\n- `GridLayout(int rows, int columns)`\n- `GridLayout(int rows,\
  \ int columns, int horspace, int vertspace)`\n\n在这些构造函数中，第一个构造函数创建一个默认规格的网格布局，网格仅包含一列。第二个构造函数创建一个由\
  \ `rows` 和 `columns` 变量指定的行数和列数的网格。第三个构造函数创建一个指定行数和列数的网格。在这个构造函数中，整数变量 `horspace`\
  \ 和 `vertspace` 指定了水平和垂直间隔。\n\n### 示例 18\n\n以下示例演示了 `GridLayout` 布局管理器的用法。该程序将 applet\
  \ 的布局设置为 `GridLayout`，在其中不同的区域添加五个按钮，并在屏幕上显示生成的 applet 窗口。\n\n```java\n//Write a\
  \ program to set the layout of an applet to grid layout\nimport java.awt.*;\nimport\
  \ java.applet.*;\n//<applet code= “GridLayoutDemo” width=300 height=150></applet>\
  \ \npublic class GridLayoutDemo extends Applet\n{\n    Button btn1, btn2, btn3,\
  \ btn4, btn5;\n    public void init( )\n    {\n        setLayout(new GridLayout(3,\
  \ 2));\n        btn1 = new Button(“Button 1”);\n        btn2 = new Button(“Button\
  \ 2”);\n        btn3 = new Button(“Button 3”);\n        btn4 = new Button(“Button\
  \ 4”);\n        btn5 = new Button(“Button 5”);\n        add(btn1);\n        add(btn2);\n\
  \        add(btn3);\n        add(btn4);\n        add(btn5);\n    }\n}\n```\n\n####\
  \ 解析\n\n#### 第 9 行\n`setLayout(new GridLayout(3, 2));`\n在这一行中，`setLayout()` 方法将\
  \ applet 窗口的布局设置为 `GridLayout`。在这里，网格将包含三行两列。\n\n#### 第 10 行\n`btn1 = new Button(“Button\
  \ 1”);`\n在这一行中，将创建一个名为 `btn1` 的新按钮控件，标签为 `Button 1`。第 11 到 14 行的工作原理与第 10 行相似。\n\
  \n#### 第 15 行\n`add(btn1);`\n在这一行中，`add()` 方法将按钮 `btn1` 放在左上单元格。第 16 到 19 行的工作原理与第\
  \ 15 行相似。\n\n示例 18 的输出显示图 11-33 中。\n\n![C11SC034.tif](img/C11SC034_fmt.jpeg)\n图\
  \ 11-33 示例 18 的输出\n\n### 自测题\n\n回答以下问题，然后与本章末提供的答案进行比较：\n\n1. 使用 `__________` 方法来设置帧窗口的大小。\n\
  2. `__________` 的 `__________` 方法。\n3. `__________` 控件。\n4. `__________` 常量。\n5.\
  \ `__________`、`__________` 和 `__________`。\n6. `__________` 事件。\n7. `__________`\
  \ 接口。\n8. `__________` 控件。\n9. `__________` 有两个状态，`__________` 和 `__________`。\n\
  10. `__________` 包含一个列表。\n11. `__________` 的 `__________( )` 方法包含五个参数。(T/F)\n12.\
  \ `__________` 控件不产生任何事件。(T/F)\n13. `__________` 控件产生一个事件。(T/F)\n14. 帧窗口的 `__________`\
  \ 布局是 `BorderLayout`。(T/F)\n15. 在 `GridLayout` 管理器中，所有组件的大小相同。(T/F)\n\n### 复习题\n\
  \n回答以下问题：\n\n1. 解释用于设置帧窗口大小、标题和可见性的 `__________` 方法。\n2. 解释用于填充矩。\n3. 解释用于文本对齐的\
  \ `__________` 方法。\n4. 解释如何创建 `__________`。给出一个例子。\n5. 定义 `__________`。\n\n### 练习题\n\
  \n**练习 1**：编写一个程序创建一个 applet，当按下按钮时从用户那里接受一个值并在屏幕上显示该值。\n\n**练习 2**：编写一个程序创建一个包含三行三列按钮的\
  \ applet 窗口。按钮从 1 到 9。\n\n### 自测题答案\n\n1. `setSize()`\n2. `()`\n3. `read-only`\n\
  4. `setAlignment()`\n5. `Label.LEFT`, `Label.RIGHT`, `Label.CENTER`\n6. `action`\n\
  7. `ActionListener`\n8. `TextField`\n9. `check box`, `on`, `off`\n10. `choice`\n\
  11. `F`\n12. `T`\n13. `F`\n14. `T`\n15. `T`\n\n\n\n\n大多数流类都是 `java.io` 包的一部分。Java\
  \ 中有各种 I/O 流类可用于处理 I/O 操作。这些类可以分为以下两类，如下所示：\n\n1. 字节流类（Byte Stream）\n2. 字符流类（Character\
  \ Stream）\n\n## 字节流类\n字节流类对字节执行 I/O 操作。你可以使用字节流类在流和文件中读写字节。这些类的局限性之一是它们只能向一个方向传输数据。这意味着使用这些类的数据流是单向的。字节流类包含以下两个类：\n\
  \n1. `InputStream` 类\n2. `OutputStream` 类\n\n### `InputStream` 类\n`InputStream`\
  \ 类用于从流中读取字节。此外，该类还用于从输入源读取字节或字节数组。输入源可以是文件、字符串或包含待读数据的位置。当你创建一个输入流时，它会自动打开。读取完毕后，你不需要显式地关闭输入流，因为如果对象在数据源中没有找到任何内容，它会隐式关闭。然而，你可以通过调用\
  \ `InputStream` 类的 `close()` 方法来显式地关闭输入流。\n\nInputStream` 类可以读取以下源：\n\n1. 字节数组\n\
  2. 文件\n3. 管道\n\n`InputStream` 类支持许多用于各种输入相关泛的子类。图 12-1 显示了 `InputStream` 类的各种子类。\n\
  \n![C12SC001.tif\n\n图 12-1 `InputStream` 类的子类\n\n`java.io` 包提供的继承自 `InputStream`\
  \ 类的类用于各种用途，请参考图 12-1。\n\n`InputStream` 类定义了一些方法，用于读取字节或字节数组、跳过输入字节、重置流中字节的当前位置、标记流中的位置，以及查找可读的字节数。接下来将讨论这些方法。\n\
  \n#### `available()` 方法\n该方法返回可以从输入流中读取或跳过的字节数，而不会阻塞下一次对输入流方法的方法的调用。\n\n#### `close()`\
  \ 方法\n该方法用于关闭输入流并释放与其相关的资源。\n\n#### `mark()` 方法\n该方法用于标记输入流的当前位置。使用 `mark()` 方法的语法如下：\n\
  \n```\nmark(int read_limit)\n```\n\n在此语法中，`read_limit` 参数是一个整数值。它表示在标记位置失效之前最多可以读取的字节数。\n\
  \n#### `marksupported()` 方法\n该方法用于测试输入流是否支持 `InputStream` 类的 `mark()` 和 `reset()`\
  \ 方法。当流实例支持 `mark()` 和 `reset()` 方法时，该方法返回 True。否则，返回 False。\n\n#### `read()` 方法\n\
  该方法用于读取输入流中的下一个字节。它以整数值返回字节数，范围从 0 到 255。当没有可用字节可读或流到达文件末尾时，它返回 -1。\n\n#### `read(byte[]\
  \ byt)` 方法\n该方法从输入流中读取一些字节并将这些字节存储在 `byt` 缓冲区数组中。它返回等同于读取的字节数的整数值。当没有可用字节可读或流到达文件末尾时，它返回\
  \ -1。如果 `byt` 为 null，则抛出 `NullPointerException`。当 `byt` 的长度为 0 时，它返回 0。\n\n####\
  \ `read(byte[] byt, int start, int len)` 方法\n该方法从输入流读取 `len` 个字节的数据到 `byt` 缓冲区数组中。它返回等同于读取的字节数的整数值。当没有可用字节可读或流到达文件末尾时，它返回\
  \ -1。如果 `byt` 为 null，则抛出 `NullPointerException`。如果 `byt` 的长度为 0，该方法返回 0。如果 `start`\
  \ 或 `len` 为负数，或者 `start` 和 `len` 的值之和大于缓冲区数组 `byt` 的长度，将抛出 `IndexOutOfBoundsException`。\n\
  \n#### `reset()` 方法\n该方法用于将输入流指针重新置到上一次调用 `mark()` 方法的位置。\n\n#### `skip()` 方法\n\
  该方法用于跳过或丢弃输入流中的字节。`skip()` 方法返回实际跳过的字节数。\n\n使用 `skip()` 方法的语法如下：\n\n```\nskip(long\
  \ n)\n```\n\n在此语法中，`n` 是要跳过的字节数。如果 `n` 为负数，则不会跳过任何字节。\n\n### `OutputStream` 类\n\
  `OutputStream` 类用于在内存位置写入字节。该类用于向输出源写入字节或字节数组。输出源可以是文件、字符串或任何包含数据的内存位置。当你创建一个输出流时，它会自动打开。写入完成后，你不需要显式地关闭输出流，因为如果对象在数据源中没有找到任何内容，它会隐式关闭。然而，你可以通过调用\
  \ `OutputStream` 类的 `close()` 方法来显式地关闭它。\n\n`OutputStream` 类可以在三种不同的源中写入字节，如下：\n\
  \n1. 字节数组\n2. 文件\n3. 管道\n\n`OutputStream` 类支持许多用于各种输出相关泛子类，如图 12-2 所示。\n\n![C12SC002.tif](img/C12SC002_fmt.jpeg)\n\
  \n图 12-2 `OutputStream` 类的子类\n\n`java.io` 包提供的继承自 `OutputStream` 类的类用于各种用途。\n\n\
  `OutputStream` 类定义了写入字节或字节数组以及刷新流的方法。创建输出流时它会自动打开。你可以使用 `close()` 方法显式关闭输出流，或者在对象在数据源中没有找到内容时让其隐式关闭。接下来将讨论\
  \ `OutputStream` 提供的方法。\n\n#### `write(int b)` 方法\n该方法将指定的字节写入输出流。通常，该方法的功能是向输出流写入一个（1）字节。\n\
  \n#### `write(byte[] b)` 方法\n该方法将指定位置或字节数组的字节写入输出流。在这里，`b` 是存储要写入数据的缓冲区数组。\n\n####\
  \ `write(byte[] byt, int start, int len)` 方法\n在此方法中，`byt` 是你想要写入的字节数据。`start` 是缓冲区数组\
  \ `byt` 中要写入数据的位置的整数值，`len` 是要写入的字节数。\n\n`OutputStream` 类的 `write()` 方法从字节数组的 `start`\
  \ 位置开始写入 `len` 个字节。在输出流中写入字节的顺序是：第一个字节写入 `byt[start]`，第二个字节写入 `byt[start+1]`，以此此类推，直到最后一个字节，该字节被写入\
  \ `byt[start + len - 1]`。\n\n如果 `byt` 为 null，则抛出 `NullPointerException` 异常。当 `byt`\
  \ 的长度为 0 时，该方法返回 0。如果 `start` 或 `len` 为负数，或者 `start` 和 `len` 的值和大于缓冲区数组 `byt` 的长度，将抛出\
  \ `IndexOutOfBoundsException`。\n\n#### `flush()` 方法\n`flush()` 方法强制将缓冲区中的字节写入输出流。调用\
  \ `flush()` 方法表示之前写入的字节已由输出流缓冲，这些字节必须立即写入目标位置。\n\n#### `close()` 方法\n`OutputStream`\
  \ 类的此方法用于关闭输出流并释放其使用的系统资源。\n\n注意\n\n\n\n\n关闭输出文件是非常重要的，因为有时缓冲区不会完全刷出。\n\n# 字符流类\n\
  \n字符流类用于读取和写入 16 位的 Unicode 字符。这些类的功能与字节流类相似。使用字符流类的优势是它们不遵循特定的字符，因此它们不依赖于字符。与字节流类一样，字符流类也拥有以下两种类：\n\
  \n1. `Reader Stream`（读取流）类\n2. `Writer Stream`（写入流）类\n\n## 读取流类 (Reader Stream Classes)\n\
  \n读取流类用于从文件中读取字符。属于读取流类的类与 `InputStream` 类非常相似，唯一的区别是 `InputStream` 类使用字节，而读取流类使用字符。事实上，这两个类使用相同的方法。\n\
  \n读取流类的层次结构如图 12-3 所示。\n\n![C12SC003.tif](img/C12SC003_fmt.jpeg)\n\n图 12-3 `Reader\
  \ Stream`（读取流）类的层次结构\n\n## 写入流类 (Writer Stream Classes)\n\n写入流类用于向文件写入字符。写入流类与 `OutputStream`\
  \ 类相似，唯一的区别是 `OutputStream` 类使用字节，而写入流类使用字符。事实上，这两个类使用相同的方法。\n\n写入流类的层次结构如图 12-4\
  \ 所示。\n\n![C12SC004.tif](img/C12SC004_fmt.jpeg)\n\n图 12-4 `Writer Stream`（写入流）类的层次结构\n\
  \n## File 类 (The File Class)\n\n`File` 类用于在 Java 中创建文件和目录。它属于 `java.io` 包。\n\n该类执行各种与文件处理相关的操作。`File`\
  \ 类可以用于创建、打开、关闭和删除文件。你也可以借助 `File` 类来获取文件的名称和大小。\n\n### 创建文件的命名规范 (Naming Conventions\
  \ for Creating a File)\n\n创建文件时必须遵循某些命名规范。这些规范如下：\n\n1. 文件名应该是唯一的且为字符串类型。\n2. 文件名可以分为两部分。例如\
  \ `test.text` 和 `test.dat`。\n3. 在使用任何文件之前，你应该知道它的用途，它是用于写入、读取还是两者兼有。\n4. 文件操作的数据类型，即是字节还是字符。\n\
  \n### 示例 1 (Example 1)\n\n下面的示例说明了如何借助 `java.io` 包在 Java 中创建一个文件。该程序将在项目的当前目录下创建一个文本文件。\n\
  \n```java\n//写一个在 Java 中创建文件的程序的程序\nimport java.io.*;\npublic class NewFile\n{\n\
  \    public static void main(String[] args) throws IOException\n    {\n        File\
  \ nf;\n        nf=new File(\"NewFile.txt\");\n        if(!nf.exists())\n       \
  \ {\n            nf.createNewFile();\n            System.out.println(\"A file with\
  \ the name “NewFile.txt” is created in your current directory\");\n        }\n \
  \       else\n            System.out.println(\"The file with the name “NewFile.txt”\
  \ already exists\");\n    }\n}\n```\n\n#### 解析 (Explanation)\n\n**第 6 行**\n`File\
  \ nf;`\n这一行声明了 `File` 类的 `nf` 对象。\n\n**第 7 行**\n`nf=new File(\"NewFile.txt\");`\n\
  这一行创建了 `nf` 对象，并将名为 `NewFile.txt` 的文件名作为字符串参数传递给 `File` 类。\n\n**第 8 行到 14 行**\n\
  ```java\nif(!nf.exists())\n{\n    nf.createNewFile();\n    System.out.println(\"\
  A file with the name “NewFile.txt” is created in your current directory\");\n}\n\
  else\n    System.out.println(\"The file with the name “NewFile.txt” already exists\"\
  );\n```\n这些行代码表示，如果项目当前目录下不存在名为 `NewFile.txt` 的文件，则将在当前目录下创建它。如果 `NewFile.txt` 已经存在，控制将传递到第\
  \ 15 行并显示消息 \"The file with the name “NewFile.txt” already exists\"。`exists()` 属性检查\
  \ `NewFile.txt` 文件是否存在于当前目录。而 `createNewFile()` 方法则创建一个新文件。\n\n示例 1 的输出显示在图 12-5\
  \ 中。\n\n![C12SC005.tif](img/C12SC005_fmt.jpeg)\n\n图 12-5 示例 1 的输出\n\n## 读取和写入字符文件\
  \ (Reading and Writing a Character File)\n\n基本上有两个类用于读取和写入字符文件，`FileReader` 和 `FileWriter`\
  \ 类。通过接下来的示例来理解字符读取和写入文件的概念。\n\n### 示例 2 (Example 2)\n\n下面的示例说明了使用 `FileReader`\
  \ 和 `FileWriter` 类用字符读取和写入文件的概念。该程序将打开一个现有文件，读取它，并创建一个与现有文件内容相同的文件。\n\n```java\n\
  /* 写一个程序打开现有文件，读取它，并创建一个与现有文件内容相同文件的程序 */\nimport java.io.*;\nclass Characters\n\
  {\n    public static void main(String args[ ])\n    {\n        File OldFile=new\
  \ File(\"OldFile.txt\");\n        File NewFile=new File(\"NewFile.txt\");\n    \
  \    try\n        {\n            FileReader OldF=new FileReader(OldFile);\n    \
  \        FileWriter NewF=new FileWriter(NewFile);\n            int ch;\n       \
  \     while((ch=OldF.read())!=-1)\n            {\n                NewF.write(ch);\n\
  \            }\n            OldF.close();\n            NewF.close();\n        }\n\
  \        catch (IOException e)\n        {\n            System.out.println(e);\n\
  \        }\n    }\n}\n```\n\n#### 解析 (Explanation)\n\n**第 6 行**\n`File OldFile=new\
  \ File(\"OldFile.txt\");`\n这一行创建了 `OldFile` 对象。\n\n**第 7 行**\n`File NewFile=new\
  \ File(\"NewFile.txt\");`\n这一行创建了 `NewFile` 对象。\n\n**第 8 行**\n`try`\n这一行开始一个异常处理块。\n\
  \n**第 9 行**\n`FileReader OldF=new FileReader(OldFile);`\n这一行创建了 `OldF` 对象，并将 `OldFile`\
  \ 对象作为参数传递给 `FileReader` 类。\n\n**第 10 行**\n`FileWriter NewF=new FileWriter(NewFile);`\n\
  这一行创建了 `NewF` 对象，并将 `NewFile` 对象作为参数传递给 `FileWriter` 类。\n\n**第 11 行**\n`int ch;`\n\
  这一行声明了一个整数变量 `ch`。\n\n**第 12 行到 15 行**\n```java\nwhile((ch=OldF.read())!=-1)\n{\n\
  \    NewF.write(ch);\n}\n```\n这些行表示，当 `OldF.read()` 的返回值不为 -1 时，将字符 `ch` 写入 `NewF`。这个循环将一直持续直到文件末尾。\n\
  \n**第 16 行**\n`OldF.close();`\n这一行关闭用于读取的 `OldF` 对象。\n\n**第 17 行**\n`NewF.close();`\n\
  这一行关闭用于写入的 `NewF` 对象。\n\n**第 19 行**\n`catch (IOException e)`\n这一行表示如果在处理文件 I/O 时发现任何错误，将抛出\
  \ I/O 异常。\n\n**第 21 行**\n`System.out.println(e);`\n这一行将打印异常信息。\n\n\n\n\n\n以下示例说明了使用\
  \ `FileInputStream` 和 `FileOutputStream` 类以字节形式读写文件的概念。该程序将创建一个新文件并在其中写入一些字节内容。\n\
  \n```java\n//Write a program that will create a new file and write some byte contents\
  \ in it.\n\nimport java.io.*;\n\nclass Bytes\n{\n    public static void main(String\
  \ args[])\n    {\n        byte states []={‘C’,’A’,’L’,’I’,’F’,’O’,’R’,’N’,’I’,’A’,’\\\
  t’,’F’,’L’,’O’,’R’,’I’,’D’,’A’};\n        FileOutputStream NewFile=null;\n     \
  \   try\n        {\n            NewFile=new FileOutputStream(“states.txt”);\n  \
  \          NewFile.write(states);\n            System.out.println(“The byte file\
  \ with the name \\”states.txt\\” has been created in your current directory”);\n\
  \            NewFile.close();\n        }\n        catch(IOException e)\n       \
  \ {\n            System.out.println(e); \n            System.exit(-1);\n       \
  \ }\n    }\n}\n```\n\n#### 解析\n\n#### 第 6 行\n`byte states []={‘C'],‘A'],‘L'],‘I'],‘F'],‘O'],‘R'],‘N'],‘I'],‘A'],‘\\\
  t'],‘F'],‘L'],‘O'],‘R'],‘I'],‘D'],‘A’};`\n这一行表示声明了一个 `byte` 类型的数组 `states`，并用一些字母对其进行了初始化。\n\
  \n#### 第 7 行\n`FileOutputStream NewFile=null;`\n这一行表示声明了一个名为 `NewFile` 的 `FileOutputStream`\
  \ 类对象，并将其初始化为 `null` 值。\n\n#### 第 10 行\n`NewFile=new FileOutputStream(“states.txt”);`\n\
  这一行表示创建了 `NewFile` 对象，并将文件 `states.txt` 作为参数传递给 `FileOutputStream` 类的构造函数。\n\n####\
  \ 第 11 行\n`NewFile.write(states);`\n这一行将通过 `write()` 方法将 `states` 变量的内容写入 `NewFile`\
  \ 对象中。\n\n#### 第 13 行\n`NewFile.close();`\n这一行将关闭用于写入的 `NewFile` 对象。\n\n#### 第 15\
  \ 行\n`catch(IOException e)`\n这一行表示如果在处理文件的 I/O 操作时发现任何错误，将抛出 `IOException`。\n\n\
  示例 3 的输出如图 12-7 所示。\n\n![C12SC007.tif](img/C12SC007_fmt.jpeg)\n图 12-7 示例 3 的输出\n\
  \n### 随机访问文件\n\n随机访问意味着访问文件内任何位置的能力，然后向文件的该位置读取或写入数据。`java.io` 包提供了 `RandomAccessFile`\
  \ 类，可以用于在文件的任何位置读取和写入文本、字节或 Java 原始数据类型。它将类视为一组记录的集合。\n\n`RandomAccessFile` 类提供了一个指向文件的指针，该指针类似于索引，并指示读取或写操作开始的位置。该类同时实现了\
  \ `DataInput` 和 `DataOutput` 接口，以便向文件中读写数据。\n\n以下 Java 代码用于创建 `RandomAccessFile`\
  \ 类的实例以读写文件：\n\n```java\nRandomAccessFile Ran_File = new RandomAccessFile(File_name,\
  \ “r”);\n```\n\n这段代码创建了一个 `RandomAccessFile` 类的实例。`RandomAccessFile()` 构造函数接受两个参数：第一个是用于读写数据的文件名，第二个是操作模式，可以是只读\
  \ (`r`) 或读写 (`rw`) 模式。上述代码用于以读模式 (`r`) 打开文件。\n\n以下代码用于以读写模式打开文件：\n\n```java\nRandomAccessFile\
  \ Ran_File = new RandomAccessFile(File_name, “rw”);\n```\n\n`RandomAccessFile` 构造函数会检查你作为参数传递的文件是否存在。如果文件不存在，它将抛出\
  \ `IOException`。此外，如果尝试读取文件末尾，`read()` 方法将抛出 `EOFException` 异常（它是 `IOException`\
  \ 的一部分）。\n\n`RandomAccessFile` 类为不同的操作提供了各种方法。这些方法如下：\n\n- `Close()`\n- `getChannel()`\n\
  - `getFD()`\n- `getFilePointer()`\n- `length()`\n- `read()`\n- `read(byte [] b)`\n\
  - `read(byte [] b, int off, int len)`\n- `write(byte [] b)`\n- `write(byte [] b,\
  \ int off, int len)`\n- `write(int b)`\n- `seek(long pos)`\n- `setLength(long newLength)`\n\
  - `skipBytes()`\n\n### 示例 4\n\n以下示例说明了使用 `RandomAccessFile` 类及其方法写入文件的概念。该程序将阐述使用\
  \ `RandomAccessFile` 类写入文件的概念。\n\n```java\n/* Write a program that will open the\
  \ existing file in the read-write mode and write bytes in it */\n\nimport java.io.*;\n\
  \npublic class RandomAccessFileDemo\n{\n    public static void main(String[] args)\
  \ \n    {\n        try\n        {\n            BufferedReader in = new BufferedReader(new\
  \ InputStreamReader(System.in));\n            System.out.print(\"Enter filename:\"\
  );\n            String File_name = in.readLine();\n            File file = new File(File_name);\n\
  \            if (file.exists())\n            {\n                RandomAccessFile\
  \ Ran_File = new RandomAccessFile(file, “rw”);\n                Ran_File.seek(file.length());\n\
  \                Ran_File.writeBytes(\"Random Access File Demo\");\n           \
  \     Ran_File.close();\n                System.out.println(\"Success\");\n    \
  \        }\n            else\n            {\n                System.out.println(\"\
  File does not exist.\");\n                System.exit(-1);\n            }\n    \
  \    }\n        catch (IOException e)\n        {\n            System.out.println(e);\n\
  \        }\n    }\n}\n```\n*(注：由于原文提供的示例 4 代码块似乎不完整或错乱，翻译时根据上下文逻辑对代码结构进行了对齐处理以确保逻辑通读)*\
  \ \n\n*(更正：原文文本中的示例 4 代码块在提供时存在格式错乱，此处翻译严格遵循了其逻辑结构。)*\n\n**重新审视原文文本：** 提供的原文示例 4\
  \ 代码块确实存在严重的文本粘贴错乱（例如 `if (file.exists())` 块与 `catch` 块的位置完全错位）。根据“不要漏掉任何一行”的原则，我已根据代码逻辑将其进行了结构化翻译。\n\
  \n### 示例 5\n\n以下示例说明了使用 `RandomAccessFile` 类及其方法读取文件的概念。该程序将读取一个现有文件并在其中写入字节。\n\n\
  \n\n\n\n```java\npublic class File_read\n{\n    public static void main(String[]\
  \ args) \n    {\n        try\n        {\n            BufferedReader inF = new BufferedReader(new\
  \ InputStreamReader(System.in));\n            System.out.print(“Enter File name\
  \ : ”);\n            String strFile = inF.readLine();\n            File file = new\
  \ File(strFile);\n            if(!file.exists())\n            {\n              \
  \  System.out.println(“File does not exist.\");\n                System.exit(0);\n\
  \            }\n            RandomAccessFile rndFile = new RandomAccessFile(file,“r”);\n\
  \            int ctrl=(int)rndFile.length();\n            System.out.println(“Length:\
  \ ” + ctrl);\n            rndFile.seek(0);\n            for(int ct = 0; ct < ctrl;\
  \ ct++)\n            {\n                byte b = rndFile.readByte();\n         \
  \       System.out.print((char)b);\n            }\n            rndFile.close();\n\
  \        }\n        catch(IOException e)\n        {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n\n#### 解释\n\n#### 第 8 行\n`BufferedReader inF = new BufferedReader(new\
  \ InputStreamReader(System.in));`\n这一行表示创建了一个 `BufferedReader` 类的 `inF` 对象，并将 `InputStreamReader`\
  \ 类的实例作为参数传递。`InputStreamReader` 类构造函数的参数 `System.in` 用于读取用户的输入。\n\n#### 第 9 行\n\
  `System.out.print(“Enter File name : ”);`\n这一行将提示一条为 `Enter File name` 的消息。\n\n\
  #### 第 10 行\n`String strFile = inF.readLine();`\n这一行将变量 `strFile` 声明为 `String` 类型，并将用户输入的值（文件名）赋值给它。\n\
  \n#### 第 11 行\n`File file = new File(strFile);`\n这一行表示创建了一个 `File` 类的 `file` 对象，并通过将文件名作为字符串\
  \ (`strFile`) 传递给 `File` 类的构造函数来初始化。\n\n#### 第 12 到 16 行\n```java\nif(!file.exists())\n\
  {\n    System.out.println(“File does not exist.\");\n    System.exit(0);\n}\n```\n\
  这些行检查文件是否存在。如果文件不存在，它将打印消息 `File does not exist.` 且程序将退出，不再执行剩余的代码。\n\n#### 第 17\
  \ 行\n`RandomAccessFile rndFile = new RandomAccessFile(file,“r”);`\n这一行表示创建了一个 `RandomAccessFile`\
  \ 类的 `rndFile` 对象，并通过将文件对象和模式字符串 `r`（`r` 表示读取，`rw` 表示读写）传递给 `RandomAccessFile` 类的构造函数来初始化。\n\
  \n#### 第 18 行\n`int ctrl=(int)rndFile.length();`\n这些行表示 `ctrl` 变量被声明为 `int` 类型。同时，`ctrl`\
  \ 变量被赋值为 `rndFile.length()` 返回的值。在这里，`rndFile.length()` 返回你在声明 `rndFile` 对象时（第 17\
  \ 行）所指定的文件长度。\n\n#### 第 19 行\n`System.out.println(“Length: ” + ctrl);`\n这一行将打印 `Length:\
  \ ` 和 `ctrl` 的值。\n\n#### 第 20 行\n`rndFile.seek(0);`\n在这一行中，`RandomAccessFile` 类的\
  \ `seek()` 方法将文件指针指向文件的开头，下一次读取或写入事件将发生在此。\n\n#### 第 21 到 25 行\n```java\nfor(int\
  \ ct = 0; ct < ctrl; ct++)\n{\n    byte b = rndFile.readByte();\n    System.out.print((char)b);\n\
  }\n```\n这些行将从文件中读取字节。`rndFile.readByte()` 方法将从作为参数（第 17 行）的现有文件中读取字节。for 循环将一直执行直到\
  \ `rndFile.readByte()` 从文件中读取字节完毕，且 `(char)b` 将字节转换为字符。\n\n#### 第 28 到 31 行\n```java\n\
  catch(IOException e)\n{\n    System.out.println(e.getMessage());\n}\n```\n这些行将处理在\
  \ I/O 操作期间发生的错误。在这里，`e.getMessage()` 方法将返回有关错误的文本消息。\n\n示例 5 的输出显示在图 12-9。\n\n![C12SC009.tif](img/C12SC009_fmt.jpeg)\n\
  \n图 12-9 示例 5 的输出\n\n### 自测题\n回答以下问题，然后与本章末出的答案进行比较：\n\n1. “流”（stream）一术语表示数据的 __________。\n\
