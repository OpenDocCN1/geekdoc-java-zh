  \ `a`。接下来，调用 `main( )` 方法。在 `main( )` 方法内部，调用了 `sum( )` 方法。然后，将值 102 作为参数传递。现在，这个值被赋值给静态整数变量\
  \ `b`。接下来执行加法操作，并将结果赋值给整数变量 `result`。\n\n示例 16 的输出显示如图 4-18 所示。\n\n![C04SC016.tif](img/C04SC016_fmt.jpeg)\n\
  \n图 4-18 示例 16 的输出\n\n### 递归\n\n递归是一个方法反复调用自身以执行连续步骤的过程，其中每一步都使用上一步的输出。\n\n例如：\n\
  \n```java\nlong fib(long n)\n{\nif(n==0||n==1)\n{\nreturn n;\n}\nelse\n{\nreturn\
  \ fib(n-1) + fib(n-2);\n}\n}\n```\n\n在给定的示例中，`fib( )` 方法被认为是递归的，因为它被反复调用以返回 else\
  \ 块内给定语句的最终输出。\n\n### 示例 17\n\n下面的示例说明了递归的使用。程序将计算一个数字的阶乘，并在屏幕上显示结果。\n\n```java\n\
