  \n# 静态数据成员和方法\n\n在所有之前的示例中，你都观察到类的每个对象都维护着自己的实例变量副本。但有时，你需要定义一个副本被类中所有对象共享的变量。为了这个目的，Java\
  \ 提供了 `static` 数据成员。类中只存在一个静态变量的副本，该副本被所有对象共享。声明静态数据成员的语法如下：\n\n```\nstatic data_type\
  \ var_name;\n```\n\n在此语法中，`static` 关键字告诉编译器，类中只存在一个由 `var_name` 指定的变量副本。\n\n例如：\n\
  \n```java\nstatic int a;\n```\n\n在此示例中，`a` 被声明为整类型的静态变量。\n\n静态变量的主要属性是，你可以在不创建类对象的情况下使用它。在\
  \ Java 中，这些变量的处理方式与其他面向对象的语言中的全局变量相同。\n\n与静态变量一样，你也可以创建静态方法。类的普通方法与静态方法的主要区别在于，静态方法只能访问类的静态数据成员和静态方法。但它们不能使用\
  \ `this` 关键字。你可以在不创建类对象的情况下使用这些方法。静态方法最常见的例子是 `main( )` 方法。在所有之前的示例中，`main( )` 方法都被声明为静态方法。\n\
