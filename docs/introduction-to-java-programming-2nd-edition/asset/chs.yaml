  \ `class_name`，它是由程序员提供的、用于指定类名的标识符。在类内部定义的 `variable1` 和 `variable2` 变量被称为实例变量。在大多数情况下，这些实例变量只能通过同一类的方法进行访问。方法体包含了用于操作数据的语句。\n\
  \n例如：\n\n```java\nclass Rectangle\n{\n    double length;\n    double breadth;\n\
  }\n```\n\n在这个示例中，定义了 `Rectangle` 类。在类定义中，定义了两个实例变量 `length` 和 `breadth`。该类还定义了一个名为\
  \ `Rectangle` 的新数据类型。现在，这个新数据类型 `Rectangle` 可以用来声明其类型类型的对象。\n\n### 对象 (Objects)\n\
  \n对象被定义为类的实例或物理实例化。它也被称为程序中的一个活动实体。当在类内部创建对象时，它维护着自己在在类内部定义的实例变量的副本。类提供了某些属性，每个对象对这些属性可以有不同的值。因此，类的每个对象都是被唯一标识的。\n\
  \n### 创建对象 (Creating an Object)\n\n每当定义一个新类，就会创建一个新的数据类型。你可以使用此数据类型创建该特定类型的对象。你可以通过以下两个步骤创建类的对象：\n\
  \n1.  在第一步中，你需要声明一个类类型的变量。该变量将用作指向特定类对象的引用。\n2.  在第二步中，通过 `new` 运算符获取对象的物理副本并将其赋值给第一步中已经声明的变量。`new`\
  \ 运算符在运行时为对象分配内存并返回对象的内存地址。现在，该内存地址作为引用赋值给变量。\n\n例如，你可以按照如下方式创建 `Rectangle` 类的对象：\n\
  \n```java\nRectangle obj1; //第 1 步\nobj1= new Rectangle( ); //第 2 步\n```\n\n在第一步中，`obj1`\
  \ 被声明为指向 `Rectangle` 类型对象的引用。当执行这行代码时，值 `NULL` 被赋值给 `obj1` 变量。现在，`obj1` 变量包含 `NULL`\
  \ 值，它没有引用任何实际对象。在第二步中，通过 `new` 运算符保留了所需的内存（16 字节）。接下来，`new` 运算符返回预留内存空间的引用，并赋值给\
  \ `obj1` 变量。现在，`obj1` 变量持有真实的 `Rectangle` 对象的内存地址，如图 4-1 所示。\n\n![4-1](img/4-1.jpg)\n\
  \n**注意**：在给定的示例中，`Rectangle()` 是构造函数，用于初始化 `Rectangle` 类的对象。你将在本章后面学习更多关于构造函数的知识。\n\
  \n你也可以使用以下语句创建一个 `Rectangle` 类 `obj1` 对象：\n\n```java\nRectangle obj1 = new Rectangle(\
  \ );\n```\n\n上述语句是之前讨论过的两个语句的结合。\n\n### 为实例变量分配初始值 (Assigning Initial Values to\
  \ Instance Variables)\n\n如你所知，每当类的对象被创建时，它都会维护在该特定类内部定义的实例变量副本。例如，如果你创建了十个 `Rectangle`\
  \ 类的对象，每个对象都将维护自己的实例变量 `length` 和 `breadth` 副本。你可以通过点运算符 (`.`) 为类对象的实例变量分配一个初始值。为实例变量分配初始值的语法如下：\n\
  \n`obj_name.var_name = value or expression;`\n\n在此语法中，`obj_name` 代表一个对象，而 `var_name`\
  \ 代表类的实例变量，`value` 或 `expression` 代表初始值。\n\n### 访问实例变量 (Accessing Instance Variables)\n\
  \n如前所述，每个对象都维护自己的实例变量副本，并可以使用点运算符 (`.`) 访问它自己的副本。访问实例变量的语法如下：\n\n`obj_name.var_name;`\n\
  \n在此语法中，`obj_name` 代表一个对象，`var_name` 代表类的实例变量。\n\n例如，要访问 `obj1` 对象的 `breadth` 实例变量，你需要使用以下语句：\n\
  \n`obj1.breadth;`\n\n### 示例 1\n\n以下示例说明了类及其对象的概念。程序将计算给定尺寸的矩形的面积，然后将结果显示在屏幕上。\n\n\
  ```java\n//写一个程序来计算矩形的面积\n1 class Rectangle\n2 {\n3 double length;\n4 double breadth;\n\
