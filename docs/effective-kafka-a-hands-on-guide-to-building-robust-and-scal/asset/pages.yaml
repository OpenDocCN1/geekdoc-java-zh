    # Renewing tokens


    The renewal of a token can only be attempted by the user listed in --rewewer-principal,
    and must happen before the token expires. The kafka-delegation-tokens.sh command
    requires both the user''s credentials and the token being renewed—specifically,
    the HMAC value:


    ```

    $KAFKA_HOME/bin/kafka-delegation-tokens.sh \n  --bootstrap-server localhost:9094
    \n  --command-config $KAFKA_HOME/config/client.properties \n  --renew-time-period
    -1 \n  --hmac Aftqd/cv/fcCawR...PqJq=

    ```


    The renewal-time-period specifies the duration of time (in milliseconds) that
    the token should be extended. If set to -1, the token will be renewed for the
    duration specified by the delegation.token.expiry.time property.


    # Expiring tokens


    The expiration time of a token can be adjusted after its creation. The most common
    case is to explicitly invalidate a token, accomplished using the command below.


