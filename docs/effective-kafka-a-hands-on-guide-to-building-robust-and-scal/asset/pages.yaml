    The leader-epoch-checkpoint file contains the leader epoch — the number of times
    the leadership of a partition has been reassigned by the cluster controller. The
    replicas use the leader epoch as a mean of verifying the current leader, fencing
    a prior leader if their leadership status has been superseded. If a displaced
    leader attempts to sync data, the replicas sense that it is operating under an
    outdated epoch number and will ignore its commands.


    # Indexes


    The files named with a large, zero-padded integer are log segments. Kafka does
    not store its partition log in a single, contiguous ''jumbo'' file. Instead, logs
    are broken down into discrete chunks. Each segment is indexed in accordance with
    the offset of the first records that it contains. This is called the base offset.


    Records may be of arbitrary size, and therefore occupy a variable amount of space
    in their respective .log file. To further complete matters, records are persisted
    in batches (which might be compressed). Record size and batching mean that a record
    cannot be trivially located by offset using the log file alone. This is where
    the .index file comes in. Essentially, an index is a sorted map of record offsets
    to the physical locations of the records in the .log file. Where a record is encompassed
    within a batch, the index file points to the beginning of the batch entry. For
    compactness, the index file use a 32-bit integer to store offsets, subtracted
    the base offset from the record''s offset beforehand. The physical locations to
    the index are stored as 32-bit integers, for a combined entry size of 8 bytes.
    Indexes are memory-mapped files; the storage space for an index is preallocated
    when the index file is created. The amount of preallocation space is prescribed
    by the .index.size.max.bytes property, which defaults to 10485760 (10 MiB) and
    acts as a default value for all topics. To control the preallocation for a specific
    topic, set the segment.index.bytes property. When a log is rolled, the remaining
    unused space in its index is referred to the filesystem.


    > Kafka uses different names for properties that affect the behaviour versus those
    that target topics. There is no particular naming convention to these properties;
    for example, the log.roll.ms cluster-wide property corresponds to the segment.ms
    per-topic property.


    Every record in the log has a corresponding entry in the index. For starters,
    records may be part of a batch, and only the location of the batch is indexed.
    In addition, to constrain the size of the index files and to minimise the amount
    of additional disk IO, records are indexed at an interval'
