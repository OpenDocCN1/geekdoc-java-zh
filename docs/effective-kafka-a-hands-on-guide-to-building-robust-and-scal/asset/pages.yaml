    # ## ZooKeeper nodes


    While the controller is entrusted with another party — ZooKeeper, the responsibility
    for electing a controller lies with another party. In fact, ZooKeeper is itself
    a cluster of cooperating processes called an *ensemble*. Every broker node will
    register its intent with ZooKeeper, but only one will be elected as the controller.
    ZooKeeper ensures that at most one broker node will be assigned the controller
    status, and should the controller node fail or leave the cluster, another broker
    node will promptly take its place.


    A ZooKeeper ensemble acts as a consistent and highly available configuration repository
    of sorts, maintaining cluster metadata, leader-follower states, quotas, user information,
    access control lists, and other keeping items. Owning to the underlying gossiping
    and consensus protocol *the number of ZooKeeper nodes must be odd.*


    While ZooKeeper is bundled with Kafka for convenience, it is important to acknowledge
    that ZooKeeper is not an internal component of Kafka, but an open-source project
    in its own right.


    # ## Producers


    A Kafka producer is a client application that can act as a source of data in a
    Kafka cluster. A producer communicates with the cluster over a set of persistent
    TCP connections, with an individual connection established with each broker. Producers
    can publish records to one or more Kafka topics, and any number of producers can
    append records to the same topic. Generally speaking, only producers are allowed
    to append records to topics; a consumer cannot modify a topic in any way.


    # ## Consumers


    A consumer is a client application that acts as a data sink, subscribing to streams
    of records from one or more topics. Consumers are conceptually more complex than
    producers — they have to coordinate among themselves to balance the load of consuming
    records and track their progress through the stream.


