  md: 'Chapter 6: Design Considerations


    # Internal consumer parallelism


    An alternate mode of increasing consumer throughput, without widening the topic
    or scaling the consumer group, is to exploit parallelism within the consumer process.
    This can be achieved by partitioning the workload among a pool of threads by independently
    hashing the record keys to maintain local order. This strategy would be classed
    as vertical scaling, requiring increased parallelism on each consumer node in
    exchange for reducing the number of consumers, and hence the number of partitions.


    # Idempotence and exactly-once delivery


    Chapter 3: Architecture and Core Concepts had introduced the concepts of delivery
    guarantees, stating that Kafka allows for two different modes of delivery by simply
    shifting the point when the consumer commits its offsets. At-least once and at-most-once
    guarantees were named, but there was no message of exactly-once guarantee. This
    might be a good segue to discuss the differences between delivery modes; ultimately,
    it will help us understand what it means to do something ''exactly once''.


    The role of messaging middleware is to decouple communications between collaborating
    parties. When a sender publishes a message, there is an assumption that the receiver
    (or receivers, there may be multiple parties) will eventually consume and process
    the message. Messaging middleware is generally divided into two categories: those
    that offer at-most-once and those that offer at-least-once guarantees. And we
    have Kafka, which has a foot in each camp.


    The at-most-once guarantee means that a message is never delivered to its recipient,
    no matter the contingency. The consumer could read the record, but then fail for
    whatever reason before processing the record. If the offsets for the said record
    were committed before the record was processed, the reassignment of the partition
    following the consumer''s failure will result in the skipping of the record by
    the new consumer.


    Some messaging systems are truly fire-and-forget, in the sense that there might
    not even be an initial attempt to deliver the message in the first place. For
    example, some brokers support load shedding, in which case a message might be
    purged from the queue to avoid accumulating a backlog of stale messages. Other
    messaging systems, such as ZeroMQ, be purely in-memory, in which the loss of a
    node will result in loss of undelivered messages. Some systems use the term ''maybe-once''
    as a stand-in for ''at-most-once'', which seems more fitting in some cases. Kafka''s
    at-most-once processing is significantly different from some of its counterparts.
    That provided a record has been stably persisted to a topic, and is within the
    retention period, Kafka will always allow the consumer to read the record at least
    once, no matter what. So the ''at-most-once'' applies to the processing of the
    record, rather than the mere act of reading the record.


    The at-least-once guarantee means that a message is only marked as delivered when
    it completes its entire journey within the consumer application. Failure prior
    to this point is treated as non-delivery and a retry will ensure.'
