  md: '# Chapter 10: Client Configuration


    +   - Runtime exceptions from the interceptor will be caught and logged, but will
    not be allowed to propagate to the application code. As such, it is important
    to monitor the client logs when writing interceptors. A trapped exception from
    one interceptor has no bearing on the next interceptor in the list: the latter
    will be invoked after the exception is logged.

    - An interceptor may be invoked from multiple threads, potentially concurrently.
    The implementation must be thread-safe.

    - When multiple interceptors are registered, their `onSend()` method will be invoked
    in the order they were specified. The `interceptor.classes` property acts as a
    transformation pipeline, where changes produced from one interceptor can be fed
    as an input to the next. This style of chaining is generally discouraged, as it
    leads to content coupling between successive interceptor implementations — generally
    regarded as the worst form of coupling and leading to brittle code. An exception
    in one interceptor will not abort the chain — the next interceptor will still
    be invoked without having the previous transformation applied, breaking any assumptions
    it may have to the effects of the previous interceptor.

    - The `onAcknowledgement()` method will be invoked by the I/O thread of the producer.
    This blocks the I/O thread until the method returns, preventing it from processing
    other acknowledgments. As a rule of, the implementation of `onAcknowledgement()`
    should be fast, returning without unnecessary delays or blocking. It should ideally
    avoid any time-consuming I/O of its own. Any time-consuming operations on acknowledged
    records should be delegated to background threads.


    In light of the above, ProducerInterceptor implementations should be fast, standalone
    units of code that maintain minimal state, with no dependencies on one another.
    Any non-trivial interceptor implementation should have a mandatory exception handler
    surrounding the bodies of `onSend()` and `onAcknowledgement()`, so as to control
    precisely what happens in the event of an error.


    # Maximum block time


    The `block.ms` configuration property controls how long `KafkaProducer.send()`
    and `KafkaProducer.partitions` will block. These methods can be blocked for two
    reasons: the internal accumulator buffer is full or the metadata required for
    their operation is unavailable. The default value is `60000` (one minute). Blocking
    in the user-supplied serializers or partitioner will not be counted against this
    timeout.


    # Batch size and linger time


    The `batch.size` and `linger.ms` properties control the extent to which the producer
    will attempt to batch queued records in order to maximise the outgoing transmission
    efficiency. The default values of `batch.size` and `linger.ms` are 16384 (16 KiB)
    and 0 (milliseconds), respectively.


    The `linger.ms` setting induces batching in the absence of heavy producer traffic
    by adding a small amount of artificial delay — rather than immediately sending
    a record the moment it is enqueued,'
