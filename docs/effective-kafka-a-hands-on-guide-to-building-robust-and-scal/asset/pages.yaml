  md: '# Controlling the fetch size


    When retrieving records from a Kafka cluster, one ultimately needs to decide how
    much data is enough, and how much is too much. More is not always better; while
    increasing the fetch size will lead to improved network utilisation and therefore
    higher throughput, it comes at a price — the end-to-end propagation delay will
    suffer as a result. Conversely, fetching a few records will make the application
    more responsive, but small fetches require more round-trips to move the same amount
    of data, negatively impacting the throughput.


    Tuning the fetch size is among the performance-impact decisions one has to face
    when building consumer applications. Kafka does little to simplify this process.
    There is no consolidated throughput latency dial that one can adjust to instead,
    there are numerous consumer settings that collectively impact the fetch behaviour.


    The most apparent control is the timeout parameter to the Consumer.poll() method.
    However, this is only an upper bound on the time that the method can block for;
    its effects are limited to the consumer — it does not limit the amount of data
    retrieved from the brokers. There are several other consumer properties that influence
    the fetching of data; their influence extends past the consumer behaviour, affecting
    how the brokers respond to fetch queries.


    The first pair of properties is the fetch.min.bytes and fetch.max.bytes. Respectively,
    these properties constrain the minimum and the maximum amount of data the broker
    should return for a fetch request.


    If insufficient data is available, the request will wait for the data specified
    by fetch.min.bytes to accumulate before answering the request. The default setting
    is 1, meaning that a broker will respond as soon as a single byte is available,
    or if the fetch times out. The latter is governed by a separate and complementary
    fetch.max.wait.ms property, which defaults to 500 (milliseconds).


    The fetch.max.bytes sets a soft upper bound on the fetch request, acting more
    as a guide than a limit. Records are written and fetched in batches, which are
    treated as indivisible units from a broker''s perspective. Considering that the
    size of a single record might conceivably exceed the fetch.max.bytes limit, and
    indeed, the size of a batch match might also be correspondingly larger, the fetch
    mechanism allows for this — returning a larger batch than what was specified by
    fetch.max.bytes. In doing so, it allows the consumer to make progress, which would
    otherwise be indefinitely obstructed had the fetch.max.bytes limit enforced verbatim.
    More accurately, the query permits an ‘oversized’ batch if it is the first batch
    in the non-empty partition. The default value of fetch.max.bytes is 52428800 (50
    MiB).'
