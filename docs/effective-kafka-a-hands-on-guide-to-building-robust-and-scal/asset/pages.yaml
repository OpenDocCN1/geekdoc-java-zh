    Topic replication


    Now let''s take the client''s perspective for a moment. When a producer wishes
    to publish a record, it must contact the leader broker for the target partition,
    which in turn, will disseminate the record to the followers, before acknowledging
    the write. Since a producer will typically publish to all partitions at some point,
    it will require a direct connection to most, if not all, brokers in a Kafka cluster.(Whether
    these connections are established eagerly — at initialisation, or lazily — on
    demand, will depend on the client library implementation.)


    > Unfortunately Kafka brokers are incapable of forwarding a write request to the
    leader broker. When attempting to publish a record to a broker that is not a declared
    leader within a replica set, the latter will fail with a NOT_LEADER_ERROR. This
    error sits in the category of retryable errors, and may occur from time to time,
    notably when the leadership status changes among the set of in-sync replicas for
    whatever reason. The producer client will simply fetch the new cluster metadata,
    discover the updated leader, and will re-address the write request accordingly.
    The NOT_LEADER_FOR_PARTITION error is mostly harmless in small doses; however,
    repeated and unresolved recurrence of this error suggests a more profound problem.'
