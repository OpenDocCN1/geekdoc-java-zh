    In Kafka''s parlance, both the leader and the follower roles are collectively
    referred to as replicas. The number of replicas is configured at the topic level,
    and is known as the topic''s replication factor. During the exercises in Chapter
    5: Getting Started, we created topics with a replication factor of one. There
    was no other choice then, as our test cluster comprised a single broker node.
    In practice, production clusters will comprise multiple nodes — three is often
    the minimum, although larger clusters are common.


    The minimum permitted replication factor is one — offering no redundancy. Increasing
    the replication factor to two provides for a single follower replica, but will
    prevent further modifications to the data if one of the replicas fails. This configuration
    provides durability, but as for availability — this is only provided in the read
    aspect, as writes are not highly available. A replication factor of three provides
    both read and write availability, providing certain other conditions are met.
    Naturally, the replication factor cannot exceed the size of the cluster.


