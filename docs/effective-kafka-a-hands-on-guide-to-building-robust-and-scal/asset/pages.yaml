  md: '# Chapter 5: Getting Started


    With the theoretical foundations nailed, and a fresh installation of Kafka standing
    by, it is time to roll up our sleeves for a more practical approach to learning
    Kafka.


    This chapter will focus on the two fundamental operations: publishing records
    to Kafka topics and subsequently consuming them. We are going to explore the various
    mechanisms for interacting with the broker and also for exploring the contents
    of topics and partitions.


    # Publishing and consuming using the CLI


    When discussing producers and consumers, the first thing that might spring to
    mind is a set of bespoke applications that someone — or more likely, a team of
    developers — will build and maintain as part of operating a broader event-streaming
    system. One does not need fully-fledged application to publish or consume from
    a Kafka topic — this task can be accomplished using the set of CLI (command-line
    interface) tools that are shipped with Kafka, located in the $KAFKA_HOME/ directory.


    # Creating a topic


    Let''s get started then. The first is to create a topic, which can be accomplished
    using the kafka-topics.sh tool:


    ```

    $KAFKA_HOME/bin/kafka-topics.sh --bootstrap-server localhost:9092 \

    --partitions 3 --replication-factor 1 \

    --topic getting-started

    ```


    Observe, although the parameter --bootstrap-server is named in singular form,
    the kafka-topics.sh tool will, unexpectedly, accept a comma-separated list of
    brokers. We have specified localhost:9092 as the bootstrap server, because that
    is where our cluster is currently running. If you are using a remote Kafka broker
    or a managed Kafka service, you will have been provided with an alternate list
    of broker addresses.


    > The packaged CLI utilities are not the most intuitive of those one can use with
    Kafka; in fact, they are widely regarded as awkward to use and barely adequate
    in functionality. Most Kafka practitioners have long abandoned the out-of-the-box
    utilities in favour of other open-source and commercial tools; Kafkadrop is one
    such tool, but there are others. This book covers the Kafka CLI tools that you
    are sure to get with. Having basic awareness of the built-in tooling is as essential
    as knowing the basic commands when working in Linux — you can berate the archaic
    tooling and laud the alternatives, but which only get you so far as your first
    production incident. (In saying that, comparing Kafka''s built-in tooling to Vim
    is a travesty.)'
  merge: -1
