  md: '# Chapter 16: Security


    In the meantime, the particularly security-minded deployments where encryption
    between brokers is a mandatory requirement, consider tunnelling the connection
    over a secure point-to-point link. This can be accomplished by positioning VPN
    terminators directly on the broker nodes, such that unencrypted traffic never
    leaves a broker. Alternatively, one can use a service mesh or a lightweight proxy
    capable of transparently initiating TLS connections, which are then terminated
    on ZooKeeper.


    # Encryption at rest


    The encryption methods discussed earlier protect the confidentiality of data in
    transit. When data arrives at the broker, it will be persisted to its attached
    storage in log segments — cleartext.


    Kafka does not have native facilities for enabling encrypted storage of record
    data. One has to resort to external options to accomplish this. The two popular
    approaches are full encryption and filesystem-level encryption. Ensure that the
    disk is protected from unauthorized access when it is detached from the host.


    While both of storage encryption provide a high level of protection against threats
    outside the host, the only way to protect the confidentiality of persisted data
    from member threats (rogue processes executing on the host) is to utilise end-to-end
    encryption. This involves encrypting outgoing records from the producer with a
    shared-key or an asymmetric cipher — to be decrypted at the consumer. This strategy
    ensures that neither the broker nor any intermediate conduits are aware of record
    content. Kafka does not support end-to-end encryption natively. There is a provisional
    ... discusses the prospect of adding this capability in the future. There are
    several open-source projects that implement this capability over the top of Kafka’s
    serialization mechanism. One example is the open-source Kafka Encryption project,
    hosted on GitHub at github.com/QuickSign/kafka-encryption³⁴.


    > When using encryption, the information entropy of record batches reaches its
    maximum of utility. Therefore, it is better to disable compression, as the latter
    will only burn CPU cycles without decreasing the payload size. (If anything, it
    will likely go up due to the overheads of compression). For more information on
    compression, Chapter 12: Batching and Compression.


    End-to-end encryption, being focused solely on the record payload, does not eliminate
    the need for transport layer security. SSL (TLS) covers all of the information
    exchange between clients and brokers, including metadata, record headers, offsets,
    group membership, and so on. SSL also protects the integrity of the data, guards
    against man-in-the-middle attacks, and uses X.509 certificates to provide assurance
    to the client party that the broker is authentic.


    ³³https://wiki.apache.org/confluence/x/AFIYBQ

    ³⁴https://github.com/QuickSign/kafka-encryption'
