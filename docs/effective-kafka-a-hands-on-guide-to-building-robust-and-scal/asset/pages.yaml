    The Facets of information security are numerous and varied, and it can be said
    without exaggeration securing Kafka is an epic journey. If there is one thing
    to be taken away from this chapter, it is that threats are not confined to external,
    anonymous actors. Threats can exist internally and may persist for extended periods
    of time, masquerading as legitimate users and occasionally posed by them.


    The correct approach to securing Kafka is a layered one. With network policy,
    the objective is to logically segment networks and restrict access to authorized
    network segments, using virtual networking if necessary to securely attach edges
    to operational sites. Network policies block clients out of untrusted networks
    and erect barriers to thwart internal threats, restricting their ability to access
    vital infrastructure.


    Having segregated the network, the attention should be turned to securing the
    confidentiality and integrity of communications. This is accomplished using transport
    layer security, which in Kafka is implemented under the SSL moniker. The use of
    X.509 certificates complements SSL, providing further assurance to the clients
    to the identity of the brokers — verifying that the brokers are who they claim
    to be. SSL can be applied both to client-to-broker and interbroker communications.
    We also learned the inability to use SSL to secure broker-to-Zookeeper communications.


    SSL can also be used in reverse, as an authentication mechanism — attending the
    identity of the connected client to the broker. On the point of authentication,
    Kafka offers a myriad of options using SASL. These range from the enterprise-focused
    SSAPI (Kerberos), to PLAIN and SCRAM schemes for username/password-based authentication,
    OAuth 2.0 bearer tokens, and finally to delegation tokens that simplify the authentication
    process for large herds of ephemeral worker nodes. Authentication is not just
    limited to broker nodes; it can also be enabled on Zookeeper limiting one''s ability
    to view and modify the contents of potentially sensitive nodes.


    Authentication, as we have learned, is really a stepping stone towards authorization.
    There is little benefit in knowing the identity of a connected part if all parties
    are to be treated equally. Parties clients and peer brokers — bear different roles
    within the overall architecture landscape. They have different needs and are associated
    with varying levels of trust. Kafka combines elaborate, rule-based ACLs with a
    default-deny permission model to create a tailored profile for every client.


    The layered security controls supported by Kafka, in conjunction with externally-sourced
    controls — such as firewalls, VPNs, transparent TLS proxies and storage encryption
    — collectively form an'
