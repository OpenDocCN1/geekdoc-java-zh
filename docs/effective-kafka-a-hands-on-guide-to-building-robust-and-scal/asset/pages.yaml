  md: 'The term ''delivery'' may seem somewhat confusing, especially if one perceives
    delivery in a postal sense. Delivery is not just leaving a record at the consumer''s
    doorstep, but seeing the consumer ''sign'' for the delivery by committing the
    record''s offset.


    The at-most-once approach for delivery is acceptable in many cases, where the
    occasional loss of a record does not leave a system in perpetually inconsistent
    state. At-most delivery is useful where the source of the record is continuously,
    within a fixed interval, emitting updates to system of interest, such that the
    loss of one record can be recovered from bounded in time. Conversely, the at-least-once
    approach is more fitting where the loss of a record constitutes an irreversible
    loss of data, violating some fundamental invariant of the system. But the flip
    side is that processing record multiple times may introduce undesirable side-effects.
    This is where the notion of exactly-once processing enters the scene. In fact,
    contrasting at-least-once with at-most-once delivery semantics, an often-asked
    question is: Can we not just have it once?


    Without the academic details, which involve conjectures and impossibility proofs,
    it is sufficient to say that exactly-once semantics are not possible without tight-knit
    collaboration with the consumer application. As disappointing as it may sound,
    a messaging platform cannot offer exactly-once guarantees on its own. What does
    this mean in practice?


    To achieve exactly-once semantics, consumers in event streaming applications must
    be idempotent. Otherwise, processing the same record repeatedly should have no
    effect on the consumer ecosystem. If the consumer has no additive effect, the
    consumer is inherently idempotent. (For example, if the consumer simply overwrites
    an existing database entry with a new one, then the update is idempotent.) Otherwise,
    the consumer must check whether a record has already been processed, and to what
    extent, prior to processing the record. The combination of at-least-once delivery
    and consumer idempotence leads to exactly-once semantics.


    The design of an idempotent consumer demands that all effects of processing a
    record must be traceable to the record. For example, a record might require updating
    a database, using some API, or processing one or more records to a set of downstream
    processes. The latter is particularly common in SEDA systems, which are essentially
    graphs of processing nodes joined by topics. When a consumer processes a record,
    it will have no awareness of whether the record is being processed for the first
    time, or whether the record is a repeat of an earlier failed delivery. As such,
    the consumer must always assume that a record is a duplicate, and handle it accordingly.
    Every side-effect must be checked to ensure it hasn''t already occurred, before
    attempting it a second time. If a side-effect is idempotent, then it can be repeated
    unconditionally.


    In some cases, there may not be any way to determine whether a potential side-effect
    had already occurred as a result of a previous action. For example, the side-effect
    might be to publish a record on another topic; there is often no practical way
    of querying for the presence of a prior record. Kafka offers an advanced mechanism
    for correlating the records consumed from input topics with the resulting records
    on output topics — this is discussed in Chapter 18: Transactions. Transactions
    can create atomicity and isolation around the production of records, such that
    either all scoped actions appear to have occurred, or none.'
