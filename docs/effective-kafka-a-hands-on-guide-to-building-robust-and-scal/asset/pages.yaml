    It is worth noting that event streaming is not required to implement the event
    channel element of EDA. Other transports, such as message queues, may be used
    to fulfill similar objectives. In fact, there is nothing to say that EDA is exclusive
    to distributed systems; the earliest forms of EDA were realised within the confines
    of a single process, using purely in-memory data structures. It may seem banal
    in comparison, but even UI frameworks of the bygone era, such as Java Swing, draw
    on the foundations of EDA, as do their more contemporary counterparts, as React.


    When operating in the context of a distributed system, the primary reason for
    choosing event streaming over the competing alternatives is that the former was
    designed specifically for use in EDA, and its various implementations — event
    streaming— offer a host of capabilities that streamline their adoption in EDA.
    A well-designed event streaming platform provides direct correspondence with native
    EDA concepts. For example, it takes care of event immutability, record ordering,
    and supports multiple independent consumers — concepts that might not necessarily
    be endemic to alternate solutions, such as message queues.


    This chapter has furnished an overview of the challenges of engineering distributed
    systems, contrasted with the building of monolithic business applications. The
    numerous drawbacks of distributed systems increase their cost and complicate their
    upkeep. Generally speaking, the components of a complex system are distributed
    out of necessity — namely, the requirement to scale in both the performance plane
    and in the engineering capacity to deliver change.


