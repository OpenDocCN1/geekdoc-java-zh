  md: '# Chapter 9: Broker Configuration


    143


    +   1. read-only: The configuration is effectively static, requiring a change
    to server.properties and a subsequent broker restart to come into effect.

    2. per-broker: May be updated dynamically for each broker. The configuration is
    applied immediately, without requiring a broker restart.

    3. cluster-wide: May be updated dynamically as a cluster-wide default. May also
    be updated as a per-broker value for canary testing.


    These modes apply to the brokers entity type. Each subsequent mode in this list
    is a strict superset of its predecessors. In words, properties that support the
    cluster-wide mode, will also support per-broker and read-only modes. However,
    supporting per-broker does not imply supporting cluster-wide. For an example,
    the advertised.listeners property can be defined on a per-broker basis, but it
    cannot be applied cluster-wide.


    For other entity types, such as per-topic or per-user configuration, the settings
    can be dynamically via the API. The scoping rules are also different. For example,
    there is no concept of per-broker configuration for topics; one can target all
    or individual topics, but the configuration always applies to the entire cluster.
    (It would make no sense to roll out a configuration to just one broker.)


    > The term dynamic update might sound a little confusing, particularly for the
    read-only mode. The latter is effectively a static configuration defined in the
    server.properties file - it cannot be assigned or updated via the Admin API, and
    is anything but dynamic.


    Dynamic configuration (which excludes the read-only mode) is persisted centrally
    in the ZooKeeper cluster. You do not need to interact with ZooKeeper to directly
    assign the configuration entries. This option is still supported for backward
    compatibility; however, it is deprecated and its use is strongly discouraged.
    Instead, the Kafka Admin API and the built-in CLI tools allow an authorized user
    to import changes to the Kafka cluster configuration, which in turn, will be written
    back to ZooKeeper.


    The ''Broker configs'' section in the Kafka documentation indicates the highest
    supported dynamic update mode for each configuration.


    The documentation has a separate Topic configs* section, listing configuration
    properties that target individual topics. There is no dynamic update mode indicated
    in the documentation; in all cases, the update mode is either per-topic or cluster-wide.


