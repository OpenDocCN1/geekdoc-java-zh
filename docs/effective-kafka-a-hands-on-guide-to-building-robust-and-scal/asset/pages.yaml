    report or supplier request. Some variations of this model use message queues for
    systems to send commands and queries to one another.


    +   **Data decapsulation.** If system integrators were cowboys, this would be
    the prairie. Data decapsulation (a coined term, if one were to ask) systems ''reaching
    over'' into each other''s ''backyard'', so to speak, retrieve data directly from
    the source (for example, from an SQL database) — without asking the owner of the
    data, and withouttimes their awareness.


    +   **Shared data.** Build separate applications that share the same datastore.
    Each application is aware of all data, and can read and modify any data element.
    Variations of this scheme use database-level permissions to restrict access to
    the data based on an application''s role, binding the scope of each application.


    Once laid out, the drawbacks of each model become apparent. The first approach
    — the proverbial monolith suffers from uncontrolled complexity growth. In effect,
    it is to satisfy *everyone* and *everything*. This also makes it very difficult
    to change. From a reliability standpoint, it is equivalent of putting all of one''s
    eggs in one basket — if the monolith were to fail, it will impact all stakeholders
    simultaneously.


    The second approach — integrate everything — is what days is becoming more commonly
    known as the ''distributed monolith'', especially when it is being discussed in
    the context of microservices. While the systems (or services, as the case may)
    appear to be standalone — might be independently sourced and maintained — they
    are not autonomous, as they cannot change freely without impacting their peers.


    The third approach — read others — is the architectural equivalent of a ''get
    rich quick scheme'' that always ends in tears. It takes the path of least resistance,
    making it highly alluring. However, the model creates the tightest possible level
    of coupling, making it very difficult to change the parties down the track. It
    is also brittle — a minor and seemingly benign change to the internal data representation
    in one system could have a catastrophic effect on another system.


    The final model — the use of a shared datastore — is a more civilised variation
    of the third approach. While it may be easy to develop, especially with the aid
    of database-level access control — the negative attributes are largely the same.


    Now imagine that the business operates multiple e-commerce platforms, located
    in different geographic regions or selling different sorts of products. And to
    top off, the business needs a separate data warehouse for long-term data collection
    and analysis. The addition of each new component significantly increases the complexity
    of the above solutions; in other words, they do not scale. By comparison, EDA
    scales perfectly. Systems are unaware of one another and react to discrete events
    — the origin of an event is largely circumstantial. This level of autonomy permits
    the components to evolve rapidly in isolation, meeting functional and non-functional
    requirements as necessary.


    # Resilience


    The autonomy created by the use of EDA ensures that, as a whole, the system is
    less prone to outage if any of its individual components suffer a catastrophic
    failure. How is this achieved?'
