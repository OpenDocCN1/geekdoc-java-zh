  md: '# Chapter 17: Quotas


    | Precedence order | Username partial association | Client ID partial association
    |

    | --- | --- | --- |

    | 1 | Specific username | Specific client ID |

    | 2 | Specific username | Default client ID |

    | 3 | Specific username | Unspecified |

    | 4 | Default username | Specific client ID |

    | 5 | Default username | Default client ID |

    | 6 | Default username | Unspecified |

    | 7 | Unspecified | Specific client ID |

    | 8 | Unspecified | Default client ID |


    Upon the consumption of a resource, Kafka will iterate through the table above
    in order of increasing number, stopping at the first rule that matches the client''s
    attributes (being the username and client ID). If Kafka is unable to match any
    of the rules listed above, it will consult the `quota.producer.default` and `quota.consumer.default`
    broker properties to determine whether a static default has been set. It is recommended
    to avoid defining quotas in `server.properties`; instead, quotas should be managed
    exclusively using the `kafka-configs.sh` CLI or the equivalent Admin Client APIs.
    Finally, in the absence of a rule matching the supplied username and client ID,
    Kafka will not apply a quota to a connected


    With the exception of `quota.producer.default` and `quota.consumer.default` properties,
    quotas are persisted in ZooKeeper, under the `/config/users` and `/config/clients`
    znodes. Specifically, for the eight options, the corresponding persistence schemes
    are:


    +   1. Username + client ID: /config/users/<username>/clients/<clientId>

    2. Username + default client ID: /config/users/<user>/clients/<default>

    3. Username: /config/users/<username>

    4. Default username + specific client ID: /config/users/<default>/clients/<client>

    5. Default username + default client ID: /config/users/<default>/clients/<default>

    6. Default username: /config/users/<default>

    7. Client ID: /config/clients/<client>

    8. Default client ID: /config/clients/<default>


