  md: '# Chapter 6: Design Considerations


    Where a predecessor-downstream relationship exists between stable entities, and
    that relationship is significant to downstream subscribers, there are generally
    two approaches one may take. The first is to co the granularity of event ordering,
    for example, using the tournament identifier is the record key. This preserves
    the chronological order of in-play events within a tournament, and by extension,
    with a match. The second approach is to transfer the responsibility of event reordering
    to the downstream subscriber.


    Coarsening of causal chains is generally preferred when said order is an intrinsic
    characteristic of the publisher''s domain. In our example, the publisher is well
    aware of the relationship between tournaments and matches, so why not depict this?


    The main drawback of this approach is the reduced opportunity for consumer parallelism,
    coarsening leads to a reduction in the cardinality of the partitioning key. Subscribers
    will not be able to utilise Kafka''s load-balancing capabilities to process match-level
    substreams in parallel; tournaments will be subject to parallelism. This may satisfy
    some subscribers, but penalise others.


    An extension of this model is to introduce conditioning stages for those subscribers
    who benefit from the finer granularity. A conditioning stage would consume a coarse-grained
    input, then republish the same value to output with a different key — for example,
    switching the key from a tournament ID to a match ID. This model nicely dovetets
    into the broader principle of producer-driven domain modelling, while satisfying
    individual subscriber needs with the help of SEDA.


    The second approach — fine-grained causal chains with consumer-side reordering
    — assumes that the consumer, or some intermediate stage acting on itself, is responsible
    for coarsening the granularity of the event substreams to fit some processing
    need. The conditioning stage will need to be stable, maintaining a datastore for
    incoming events so they can be reordered. In practice, this is much more difficult
    than it appears. In some cases, there simply isn’t enough data available for a
    downstream subscriber to reconstruct the original event order. In short, consumer-side
    reordering may not always be a viable option.


    There is no one-size-fits-all approach to partitioning events. As a rule of thumb,
    the producer should publish at the finest level of granularity that makes sense
    in its respective domain, supporting a diverse subscriber base. A crucial point:
    being agnostic of subscribers does not equate to being ignorant of their needs.
    The effective modelling of the domain and the associated event streams falls on
    the shoulders of architects and senior technologists; consultation and understanding
    of the overall landscape are essential in constructing a sustainable solution.


    In the absence of consumer awareness, a litmus test for formulating partial order
    is to ascertain that the resulting stream can be used to reconstruct the source
    domain. Ask the question: Can a hypothetical subscriber rebuild an identical replica
    of the domain purely from the emitted events while maintaining causal consistency?
    If the answer is ''yes'', then the event stream should be suitable for any downstream
    subscriber. Otherwise, if the answer is ''no'', then there is a gap in the condition
    of the emitted events that requires attention.'
