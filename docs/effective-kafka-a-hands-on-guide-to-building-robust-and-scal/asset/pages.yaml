  md: '# ## Chapter 6: Design Considerations


    Previous chapters have taken us through the essentials of event streaming and
    the core concepts of Kafka. By now, the reader should be familiar with the architecture
    of Kafka, its internal components, as well as the producer and consumer ecosystems.
    We have set up a Kafka broker, a Kafdrop UI and built basic producer and consumer
    applications using the Java client APIs.


    In essence, the reader should now be equipped with the tools and foundational
    knowledge required to start building event streaming applications. But it takes
    time and experience to become proficient in Kafka. This is another way of saying:
    *To write good software, you need to make lots of mistakes.* Mistakes need to
    be made; they are an essential part of learning. Learning from others'' mistakes
    is better than learning from one''s. This chapter presents a list of considerations
    that are instructive in the design of performant and sustainable event streaming
    applications; considerations that have been amassed over years of working with
    these sorts of systems across a variety of industries.


    # Roles and responsibilities


    Kafka permits a flexible arrangement between producers and consumers, allowing
    for a host of similar and disparate applications to interact with a topic simultaneously.
    In coming to terms with this, an often-asked question is: *Which party owns the
    topic, and who is responsible for its upkeep?*


    # ## Event-oriented broadcast


    In a broadcast arrangement, where the producer-consumer relationship follows a
    (multi)point-to-multipoint topology, it is accepted best-practice for the producer
    ecosystem to assume custodian-ship over the topic, and to effectively prescribe
    the entirety of the topic''s configuration and usage semantics.


    +   - The lifecycle of the topic, as well as the associated broker-side configuration,
    such as the retention period and compaction policy;

    - The nature and content of the published data, encodings, record schema, versioning
    strategy and associated deprecation period; and

    - The sizing of the topic with respect to the partition count and the keys of
    records.


    In no uncertain terms: the *producer is king*. The producer will warrant all existential
    and behavioural aspects of the topic; the only decision left to the discretion
    of the consumer is whether subscribe'
  merge: -1
