  md: '# Chapter 16: Security


    not all which may enrolled in the directory. For example, a single application
    may connect to Kafka, a Postgres database, Redis cluster, and consume third-party
    APIs that are external to the organisation. While Kafka and Postgres support Kerberos,
    Redis does not. And a third-party API will almost certainly not support Kerberos
    (Some providers may indirectly support Kerberos, typically via a federation protocol).


    When the time comes to control the permissions of a service account, the administrator
    might manipulate the representation of the service account in the directory. Perhaps
    the service account should be disabled altogether, which is a trivial ‘one-click’
    action in a service account such as Active Directory. This creates a false sense
    of security, as the permissions for the service account do not cover all resources;
    while the service account may appear to be disabled in the centralised directory,
    the underlying principle is still able to operate on one of its resources.


    It is a common misunderstanding that centralised authentication systems exist
    to simplify the onboarding process. In practice, the benefits of such systems
    are predominantly concentrated in the off-boarding scenario. It is convenient
    to set up a profile for a new employee with one click of a button, granting them
    to all necessary systems. Convenient but not essential. Without a centralised
    authentication system, the onboarding may take days or weeks to complete. And
    while this is not ideal, it is mostly the productivity loss that affects the organisation
    — a cost that can be quantified and managed carefully. Conversely, termination
    of employment immediate action from a security standpoint — revoking the employee''s
    access simultaneously from all resources previously available to them, preferably
    before the person has left the premises. Failure to act in a timely manner, or
    forgetting to apply the change to some resources, may pose an immediate and persistent
    threat to the organisation, particularly if the employee was not completely content
    with the circumstances of their dismissal.


    While the benefits of centralised authentication are clear for end-users and administrators,
    particularly in a large setting, the benefits cannot be easily reproduced for
    service accounts — unless the organisation mandates that all technical infrastructure
    supports Kerberos and all interactions between application components and their
    dependencies are authenticated accordingly. Stated plainly, this is a pipe dream.


    For service accounts and similar use cases, the prevalent trend is in the migration
    away from directory-based authentication systems towards centralised secrets management
    systems. In other words, rather than managing principals, which we established
    is futile, we manage their credentials and any other secret they need to function.
    Provided the principal receives the entirety of the secrets from the secrets management
    system and does not cache them locally, disabling the principal will eventually
    affect its ability to consume downstream resources, effectively isolating it.


    One notable drawback of this scheme is that the effect of disabling a principal
    may not be timely. While it makes future retrieval of secret material impossible,
    it does not necessarily render the existing material invalid or obsolete. On top
    of this, the client may have cached the secret material or the latter may have
    become compromised by other means. This is why security best-practices'
