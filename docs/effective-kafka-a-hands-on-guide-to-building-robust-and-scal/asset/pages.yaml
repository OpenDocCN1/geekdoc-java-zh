  md: '# Chapter 16: Security


    works internally, it is also necessary to grant topic access to brokers. Specifically,
    replicas must be authorized for Read and Describe operations on the topics being
    replicated. The Describe permission is granted implicitly, as the Read permission
    is present.


    Kafka takes a default-deny stance, which is otherwise known as a positive or additive
    security model. Unless an attempted access is explicitly allowed, it is assumed
    to be denied. This behaviour can be inverted by adding the following value to
    server.properties:


    ```

    allow.everyone.if.no.acl=true

    ```


    Generally speaking, the default-deny model is recommended over the default-allow,
    as it takes a more conservative approach to dispensing access. One should think
    of it as an additive approach: starting from a blank slate, adding permissions
    on needs basis. At any point, it can be clearly reasoned as to who has access
    to a resource by simply looking over the permissions list. Unless an allow explicitly
    stating the principal and the resource is present, there can be no access-granting
    relationship between the pair of entities.


    Once the brokers restart, we can use the kafka-acls sh tool to view and manipulate
    ACLs. The command will list all configured ACLs, internally utilising the Kafka
    Admin API.


    ```

    $KAFKA_HOME/bin/kafka-acls.sh \

    --config $KAFKA_HOME/config/client.properties \

    --bootstrap-server localhost:9092 \

    --list

    ```


    It should come with an empty list of rules. This is because as we haven''t yet
    configured any.


    When specifying a bootstrap list via the --bootstrap-server flag, it is also necessary
    to state the location of the JAAS file used for authenticating to Kafka. When
    Kafka is running with authorization enabled, users cannot view and alter ACLs
    — unless they have been explicitly authorized to do so. By connecting with the
    admin user, we are effectively operating in ''god mode''.


    An alternate way of viewing and setting ACLs is to connect to ZooKeeper directly.
    This will work provided ZooKeeper is reachable from the network where the command
    runs, and ZooKeeper is not running with authentication and ACLs of its own. The
    command shows how kafka-acls.sh can be used directly with an unauthenticated ZooKeeper
    node.


    ```

    $KAFKA_HOME/bin/kafka-acls.sh \

    --authorizer-properties zookeeper.connect=localhost:2181 \

    ```'
