  md: '# Chapter 10: Client Configuration


    of this property are confined to the client. After receiving the record batches
    from the brokers, the consumer will artificially limit the number of records returned.
    having unpacked the batches, the excluded records will remain in the fetch buffer
    — to be returned in a subsequent call to Consumer.poll(). The default value of
    max.poll.records is 500.


    > The original motivation for artificially limiting the number of returned records
    was largely historical


    The act of polling a Kafka cluster did not retrieve records — it had the added
    effect of signing the coordinator that the consumer is in a sufficiently stable
    state and able to handle its share of the event stream. With a combination of
    a large batch and high time-cost of processing individual records, a consumer''s
    poll loop might have taken longer than the deadline enforced by the session.timeout.ms.
    When this happened, the consumer had given up, so to speak, and reassign its partitions
    to the remaining consumers in the encompassing consumer group. In reducing the
    number of records returned from poll(), the application would effectively slack
    its obligations between successive polls, increasing the likelihood that a cycle
    would complete before the session.timeout.ms elapsed.


    A second change was introduced in version 0.10.0 and is in effect to today: the
    behaviour of polling with respect to consumer liveness was radically altered as
    per KIP-62. The consumer heartbeat was extracted from the poll() method into a
    separate background thread, invoked asynchronously at an interval that is not
    heartbeat.interval.ms. Regular polling is still a requirement for ensuring that
    a consumer is healthy; however, the deadline max.poll.interval.ms is the upper
    bound. If the application fails to poll within this period, the client will simply
    stop sending heartbeats. This fixed the root cause of the problem — conflicting
    the cycle with heartbeat, resulting in either undesirable compromise on failure
    detection or failing a consumer prematurely, inadvertently creating a scenario
    where two consumers simultaneously handle the same


    The change to heartbeat markedly improved the situation with respect to timeouts,
    but it did not address all issues. There is no reliable way for the outgoing consumer
    to determine that its partitions were revoked — not until the next call to poll().
    By then, any uncommitted records may have been replayed by the new consumer —
    resulting in the simultaneous processing of identical records by two consumers
    — each believing ''they'' own the partitions — a highly undesirable scenario in
    most stream processing applications. The use of a ConsumerRebalanceListener does
    not help in this scenario, as rebalance callbacks are only invoked from a call
    to poll(), using the application''s polling thread — the same thread that is overwhelmed
    by the record batch.


    To be clear, improvements introduced in Kafka 0.10.0 have not eliminated the need
    for max.poll.records. Particularly when the average time-cost of processing a
    record is high, limiting the number of in-flight records the number of returned
    records is still essential to a predictable, time-bound poll loop. In the absence
    of this limit, the number of returned records could still backlog the consumer,
    breaching the deadline set by max.poll.interval.ms. The combination of the max.poll.records
    and the more recent max.poll.interval.ms settings should be used to properly manage
    consumer liveness.'
