  md: '# Chapter 1: Event Streaming Fundamentals


    they were observed on the emitter, creating sequential consistency — a model of
    consistency where updates do not have to be instantaneously, but must be presented
    in the same order to all observers, which is also the order they were observed
    on the emitter. Alternatively, events may be emitted in causal order, categorising
    them into multiple repeated sequences, where events within any sequence are relaxed
    amongst themselves, unrelated to events in another sequence. This is a slight
    relaxation of sequential consistency to allow for safe parallelism, and is sufficient
    in the overwhelming majority of use cases.


    # Applicability


    For all its outstanding benefits, EDA is not a panacea and cannot supplant integrated
    or monolithic systems in all cases. For instances, EDA is not well-suited to synchronous
    interactions, as unilateral awareness among participating parties contrary to
    the grant of EDA and negates most of its benefits.


    EDA is not a general-purpose architectural paradigm. It is designed to be used
    in conjunction with other paradigms and design patterns, such as synchronous request-response
    style messaging, to solve more general problems. In the areas where it can be
    applied, ordinarily leads to significant improvements in the system''s non-functional
    characteristics. Therefore, one should seek to maximise opportunities for event-driven
    complexes, refactoring the architecture to that extent.


    # What is event streaming?


    Finally, we arrive at the central question: *What is event streaming?* And frankly,
    there is little left to explain. There is one short-fall in the early narrative:
    *EDA is an architectural paradigm — it does not prescribe the particular semantics
    of the event interchange. Events could be broadcast among parties using different
    mechanisms, all potentially satisfying the basic tenets of EDA.*


    *Event streaming is a mechanism that can be used to realise the event channel
    element in EDA.* It is primarily concerned with the following aspects of event
    propagation:


    +   - Interface between the emitter and the channel, and the consumer and the
    channel;

    - Cardinality of the emitter and consumer elements that interact with a common
    channel;

    - Delivery semantics;

    - Enabling parallelism in the handling of event notifications;

    - Persistence, durability, and retention of event records;

    - Ordering of events and associated consistency models.


    The focal point of event streaming is, unsurprisingly, an event stream. At minimum,
    an event stream is a durable, totally-ordered, unbounded sequence of immutable
    event records, delivered at least once to its subscriber(s). An event streaming
    platform is a concrete technology that implements the event streaming model, addressing
    the points enumerated above. It interfaces with emitter and consumer'
