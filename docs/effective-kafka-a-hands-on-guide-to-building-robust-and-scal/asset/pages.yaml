  md: "# Chapter 17: Quotas\n\nstill an excellent metric. The main issue with bandwidth\
    \ metrics is that they focus on the payload, overlooking the request itself. And\
    \ indeed, when the requests are reasonably sized and the clients are properly\
    \ configured (well-behaved), the act of making the request carries a negligible\
    \ overhead on the broker to servicing the request. However, if a client sends\
    \ requests too quickly (for example, a consumer with fetch.wait.ms or max.partition.bytes\
    \ set to very small values), it can overwhelm the broker even though individual\
    \ request/response sizes may be small.\n\nRequest rate quotas were introduced\
    \ in KIP-124 as of release 11.0.0, when it became obvious that an additional level\
    \ of control was required to prevent denial of service from frequent protocol\
    \ activity. In addition to protecting brokers from excessive rates,, improvement\
    \ proposal was generalised to other scenarios that saw clients utilise the broker's\
    \ CPU disproportionately to the request/response size. We include –\n\n+   - Denial\
    \ of service from clients that overload brokers with continuous unauthorized requests.\n\
    - Compression settings on the broker that contradict producers' assigned scheme,\
    \ requiring decompression and re-compression on the broker.\n- A mixture of TLS\
    \ and non-TLS clients (where both listener types have been exposed); the former\
    \ exert a significantly greater load on the broker for the same amount of traffic.\n\
    \nRequest quotas are configured as a fraction of overall time a client is allowed\
    \ to occupy request handler (I/O) threads and network threads within each quota\
    \ window. For example, a quota of 50% implies that half of a thread can be utilised\
    \ within the measured time window, 100% implies that a full thread may be utilised,\
    \ 200% is the equivalent of two full-threads, and so on.\n\nThe underlying mechanism\
    \ for enforcing request quotas is virtually identical to the one used for network\
    \ bandwidth quotas, with the only difference being the metric that is collected\
    \ over the sampling window — using CPU time rather than the number of bytes sent\
    \ or received.\n\nThe request rate calculations piggyback on the quota.window.num\
    \ and quota.window.size.seconds properties, originally designed for network bandwidth\
    \ quotas. The enforcement mechanism applies an artificial delay, using the formula\
    \ presented earlier. The parity between the two mechanisms simplifies their management\
    \ and reduces the number of tuning parameters.\n\n> Request rate quotas are effective\
    \ at avoiding DoS from misconfigured applications or defective clients, where\
    \ by may inadvertently result in a high request rate. While this counters some\
    \ DoS, it does not completely insulate the cluster from all types of DoS attacks\
    \ originating from malicious clients. A malicious actor may launch a distributed\
    \ denial of service (DDoS) attack by recruiting a large number of connections,\
    \ originating from multiple nodes. This would result in a large amount of expensive\
    \ authentication or CPU-intensive requests that may overwhelm the broker.\n\n\
    \ Ordinarily, the number of I/O and network threads is set in some proportion\
    \ to the capabilities of the underlying hardware — typically, the number of CPU\
    \ cores. One of the advantages of expressing"
