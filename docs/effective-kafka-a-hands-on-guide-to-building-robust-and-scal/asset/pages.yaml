    near-zero value when the limit is lifted. By observing this counter, the application
    can infer the approximate likelihood of a queued record being sent immediately.
    Alternatively, the counter may be replaced with the timestamp of the most recent
    unacknowledged record. (The timestamp is cleared when the last record has been
    acknowledged). By comparing the wall clock to this timestamp, the application
    is able to infer the presence of throttling and actual activity. Both methods
    are probabilistic; there is no categorical way to determine whether a throttle
    is in force, or whether the delayed acknowledements are a result of genuine congestion.
    At any rate, both are indicative of degraded behaviour.


    # Tuning the duration and number of sampling windows


    As it was previously stated, the quota enforcement algorithm represents a sliding
    window comprising N samples (given by quota.window.num), each being S long (given
    by quota.window.size.seconds). By default, these values are 11 and 1 respectively,
    implying that the sliding window spans at most eleven seconds of observed utilisation.
    In reality, the calculation of the window size subtract the current time from
    the oldest in the set of retained samples. When the wall clock approaches the
    boundary of the current period, the window size T approaches the boundary of the
    product of N and S. However, when the current samples roll over the next, the
    oldest sample used in the previous calculation is dropped, leaving the next sample
    seconds later than its predecessor. This creates a sort of snapback effect, where
    the T instantaneously goes from being N seconds wide, to (N-1) × S.


    Looking at the output of the most recent example, there is a clear spike of throughput,
    followed by a period of suppressed (but not entirely) activity, which seems to
    recur in a predictable cycle. To understand the reason for this comb-like shape,
    consider what happens at various points in the client-broker interaction.


    Given a mim of 11 seconds at its peak and a set rate of 100 KB/s, the client should,
    in theory, be able to produce up to 1,100 KB of data in any eleven-second window.
    The window is important; although the quota is stated in bytes per second, the
    enforcement algorithm operates in terms of the current window size — varying between
    ten and eleven seconds. Following the initial metadata retrieval, the client is
    free to produce a volume of traffic that does not reach the threshold within the
    observed window. In fact, the client will overproduce by some margin before the
    limit kicks in, as the delay is a function of the difference between the observed
    utilisation and the actual utilisation.


    At this point, the client is being delayed by a small amount of time, as the extent
    of overproduction is quite minimal. Delayed does not mean stopped; the client
    will transmit the next batch after the broker’s response is received. The batch
    is given by the batch.size client property, which defaults to 16 KiB — just enough
    to fit one record. The client is gently throttled until the conclusion of the
    first sampling period, where T approaches 11 seconds. By this time, the client
    would have produced just over 1,100 KB of data.


    At the commencement of the second period, the value of T will abruptly snap back
    to 10 seconds.'
