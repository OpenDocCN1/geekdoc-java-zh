  md: '# # Chapter 2: Introducing Apache Kafka


    Apache Kafka (or simply Kafka) is an event streaming platform. But it is also
    more than that. It is an entire ecosystem of technologies designed to assist in
    the construction of complete event-driven systems. Kafka goes above and beyond
    the essential set of event streaming capabilities, providing rich persistence,
    transformation, and processing semantics.


    Event streaming platforms are a comparatively recent paradigm in the broader message-oriented
    middleware class. There are only a handful of mainstream implementations available,
    compared to hundreds of MQ-style brokers, some going back to the 1980s (for example,
    Tuxedo). Compared to established standards such as AMQP, XMPP, and JMS, there
    are no equivalent standards in the streaming space. Kafka is a leader in the area
    of event streaming, and more broadly, event-driven architecture. While there is
    no deure standard in event streaming, Kafka is the benchmark to which most competing
    products orient themselves. To this effect, several competitors—such as Azure
    Events and Apache Pulsar—offer APIs that mimic Kafka.


