  md: '# Topic width


    With the correct keying granularity in place, the next consideration is the `width`
    of the topic — the number of partitions in time encompasses. Assuming a fair distribution
    of keys, increasing the number of partitions creates more opportunities for the
    consumer ecosystem to process records in parallel. Getting the topic width right
    is essential to a performant event streaming architecture.


    Regrettably, Kafka does not make this easy for us. Kafka permits non-destructive
    resizing of topics when increasing the partition count. Decreasing the number
    of partitions is a destructive operation — requiring the topic to be created anew,
    and manually repopulated.


    One of the main costly of resizing topics is the effect they have on order. As
    stated in [Chapter 3: Architecture and Core Concepts], a Kafka producer hashes
    the key to arrive at the partition number. The hashing scheme is not consistent
    — two records with the same key hashed at different points in time will correspond
    to an identical partition number *if and only* the number of partitions has not
    changed in time. Increasing the partition count results in the records occupying
    potentially different partitions — a clear breach of Kafka''s key-ordering guarantee.
    Kafka will not rehash records as part of resizing, as that would be prohibitively
    expensive in the absence of consistent hashing (To be clear, consistent hashing
    would eliminate the need for rehashing records *per se*, but would dramatically
    reduce the number of affected hashes when the topic is widened).


    > When the consistency of a system is predicated on the key-centric ordering of
    records, avoid resizing the topic as it would void any guarantees that the consumer
    ecosystem may have to rely upon.


    An approach to dealing with prospective growth is to start with a sufficiently
    over-provisioned topic, perhaps an order of magnitude more partitions than one
    would reasonably expect — avoiding the skew problem down the track. On the flip
    side, increasing the number of partitions may increase the load on the brokers
    and consumers.


    A partition is backed by log files, which require additional file descriptors.
    (At minimum, there is one log segment and one index file per partition.) Inbound
    writes to dedicated buffers, which are allocated per partition on the broker.
    Therefore, increasing the number of partitions, in addition to consuming extra
    file handles, will result in increased memory utilisation on the brokers. A similar
    impact will be felt by consumers, the file handles, which also employ per-partition
    buffers for fetching records.


    A further impact of wide topics may be felt to the limitations of the inter-broker
    replication and its underlying threading model. Specifically, a broker will allocate
    one thread for every broker that maintains a connection, which covers the set
    of replicated partitions — where the two peers have a leader-follower relationship.
    The replication threads may act as a bottleneck when shuttling records from the
    partition leader to in-sync replicas, and therefore impact the publishing latency
    when the producer requests all replicas to acknowledge the writes. This problem
    is ameliorated when the number of brokers increases, as the growth of the cluster
