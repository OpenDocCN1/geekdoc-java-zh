  md: '# Chapter 15: Group Membership and Partition Assignment


    The reader should be aware by now that partitions in a topic are allocated approximately
    evenly among the lives of a consumer group, and that partition allocations for
    one group are entirely independent of the allocations of any other group. On the
    whole, group membership is pivotal to Kafka’s architecture; it acts as a load
    balancing mechanism and ensures that any given partition is assigned to at most
    one member of a group.


    This chapter explores Kafka''s group protocol and the underlying mechanisms by
    which Kafka ensures that members are always able to make progress in the consumption
    of records, and that records are processed in the prescribed order and on at most
    one consumer in a group.


    > Parts of this chapter contain sizable doses of theory on Kafka''s inner workings,
    and might not immediately feel useful to a Kafka practitioner. Nonetheless, an
    appreciation of the underlying mechanics will go a long way in understanding the
    more practical material, such as session timeouts, liveness, partition assignment,
    and static membership.


    # Group membership basics


    A consumer group is a set of related consumers that contend for the assignment
    of a mutually exclusive set of partitions for the subscribed topics, such that
    a given topic-partition combination is assigned to at most one consumer. We say
    ‘at most one’ to cover the case when all consumers are offline or not responding.
    Rest assured — when all is well and there is at least one consumer in the group,
    a partition will be assigned to exactly one consumer.


    Members of one consumer group cannot interfere with those of another group; in
    other words, consumer groups are completely isolated from one another.


    # Establishing group membership


    Kafka’s group management protocol is divided into two phases: group membership
    and state synchronisation. The group membership phase is used to identify the
    active members of the group and appoint a group leader. The state synchronisation
    phase is used by the group leader to derive the partition assignment for all group
    members, including itself, and to disseminate this state among the remaining population
    of consumers. The sequence diagram below illustrates the phases of the protocol.
    Explanations follow.'
  merge: -1
