  md: '# Chapter 16: Security


    There may also be legitimate reasons to allow external clients to connect; for
    example, if these clients reside on a remote network that is also trusted, but
    the two networks are separated by an untrusted network, Often this scenario occurs
    in a hybrid deployment topology, where some parts of an organisation''s IT systems
    may be deployed in one or more data centres, while other parts may be deployed
    in the public Cloud, or multiple Clouds in different geographical regions, for
    that matter.


    # Ensure traffic confidentiality


    Traffic flowing in and out of the cluster, and within the cluster, needs to be
    protected from eavesdropping and tampering. Ordinarily, this implies some sort
    of encryption, a message signing protocol, and a secure exchange protocol that
    could ensure the end-to-end confidentiality of messages.


    Encryption protocols must be chosen that they comply with industry-accepted standards
    for the secure exchange of information. These standards exist for a broad set
    of applications, curated by organisations such as the National Institute of Standards
    and Technology (NIST). NIST breaks down into cryptographic hash functions, symmetric
    key algorithms, and asymmetric key algorithms — all of which will apply to Kafka
    at some point during the connection. In all general-purpose standards, specific
    industry — such as PCI, as well as legislative acts — such as HIPAA, GLBA and
    SOX, will mandate security controls in addition to the baseline. When deploying
    Kafka for applications that are expected to comply with regulation, care must
    be taken to ensure that the applications'' approach to information security is
    equally compliant.


    # Know the client


    Kafka clients are typically embedded into or on behalf of others that play a role
    in the overall architecture landscape. Identifying clients is a prerequisite for
    access control; if we don''t know who clients are, we cannot possibly guarantee
    that access has been restricted to the minimum set of actions that a client is
    reasonably expected to undertake. A reader familiar with the principles of information
    security will recognise this as the Principle of Least Privilege (PoLP). To select,
    attesting the identity of a client does not in itself realise PoLP, but is nonetheless
    essential for subsequent controls whose role it is to categorially enforce this
    principle.


    # Limit access to essential data and functionality


    This is the direct enforcement of PoLP. We need to identify all prospective principals
    — users of the cluster — are allowed to operate upon. ''resources'', it is any
    entity that may pose a threat if consumed uncontrollably. These include topics,
    consumer groups, brokers, configuration entries, as well as users. The latter
    is a resource like any other — the uncontrolled modification of users'' profiles
    may lead to a privilege escalation, where a less privileged user may gain a level
    of access above what has officially been allocated to them. It may also lead to
    a denial of service, where a legitimate user has been blocked from carrying out
    their normal functions.'
