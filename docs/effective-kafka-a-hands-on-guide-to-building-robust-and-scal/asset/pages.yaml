  md: '# Retries and retry backoff


    The retries and retry.backoff.ms properties specify the number of retries for
    transient errors and the interval (in milliseconds) to wait before each subsequent
    retry attempt, respectively. The number of retries occurs on top of the initial
    attempt, in other words, the upper bound on the total number of retries is +1.


    To clarify, a transient error is any condition that is deemed potentially recoverable.
    Timeouts are the most common form of transient error, but there are many others
    that relate to the cluster state — for example, stale metadata or a controller
    change.


    While the retry.backoff.ms property applies to all three clients, the retries
    only exists for the producer and admin clients; it is not supported by the consumer
    client. Instead of limiting the number of retries, the consumer limits the total
    time accounted to a query — for example, when the poll() method is invoked — obviating
    the explicit retry counter. In spite of this minor disparity, we will discuss
    these two configuration aspects as a collective.


    The default setting of retries is Integer.MAX_VALUE, and the producer and admin
    clients will wait 100 ms between each attempt. There is no default value for the
    poll timeout to consumers — the timeout is explicitly specified as a parameter
    to the poll() method. Whether these defaults are sensible depends on the combination
    of retry, the amount of resources available to both the cluster and the client
    apps, and your user’s tolerance for awaiting a successful or failed outcome of
    publishing a record.


    > There is a gotta, albeit a subtle one. It does not fundamentally matter how
    many retries one performs, or the total time spent retrying; there are only two
    possible outcomes. The number of retries and the backoff time could be kept to
    a minimum, in which case the likelihood of an error reaching the application is
    high. Even if these numbers are empirically derived, one will eventually observe
    a scenario where the retries are exhausted. Alternatively, one might leave retries
    at its designated default of Integer.MAX_VALUE, in which case the client will
    keep hammering the broker, while the application fails to make progress. We need
    to acknowledge that failures are possible and must be accounted for at the application
    level.


    When Kafka was first released into the world, every broker was self-hosted, and
    most were running in either a data centre or on a public cloud, in proximity to
    the client applications. In other words, the network was rarely the culprit. The
    landscape has shifted considerably; it is far more common to see many Kafka offerings,
    which are delivered over the public Internet or VPC peering. Also, with the increased
    adoption of event streaming in the industry, an average broker now carries more
    traffic than used, with the increase in easily outstanding the performance advancements
    attributable to newer hardware and efficiency gains in the Kafka codebase. The
    adoption of cloud providers, organisations are increasingly looking to leverage
    availability zones to protect them from site failures. As a result, Kafka clusters
    are now larger than ever before, in terms of the number of broker nodes and their
    geographic distribution. One needs'
