  md: '# Chapter 15: Group Membership and Partition Assignment


    example, as a result of scaling events or one-off consumer failures. However,
    if group members are joining at a rapid rate, the number of unnecessary rebalances
    will go through the roof. This ‘swarm’ effect can typically be felt on application
    startup or when previously connected reconnect en due to an intermittent network
    failure.


    This issue was addressed in Kafka 0.11.0.0 as part of KIP-134. A new property
    — `group.initial_rebalance.delay` — was introduced for the group coordinator to
    allow additional time for consumers to join before sending JoinGroupResponse messages,
    thereby reducing the number of rebalances. The delay is applied when the group
    is empty; membership changes in a non-empty group will not incur the initial rebalance
    delay. The default value for this property is 3000 (ms).


    A drawback of the initial rebalance delay is its treatment of a singleton group,
    where only one member exists. This is typical of test scenarios and local development.
    When Kafka for small-scale testing or development, it is recommended that `group.initial_rebalance.delay_ms`
    is set to 0.


    # Changing group membership


    The coordinator maintains a generation ID — a monotonically-increasing-32-bit
    integer — representing a point-in-time snapshot of the group membership state.
    When a new member wishes to join an existing group, they will send a JoinRequest
    to the coordinator. Conversely, a member may gracefully leave the group at any
    point by sending a LeaveGroupRequest. Each action will result in the coordinator
    awaiting for all remaining members to rejoin the group.


    While in the Joining state, the coordinator will reject heartbeats and all operations
    with REBALANCE_IN_PROGRESS error. This will be detected by the remaining members
    upon their next heartbeat attempt, forcing them to rejoin with their existing
    member IDs. Once all members have successfully rejoined, the coordinator will
    increment the generation ID and transition to the Waiting state — initiating the
    phase of protocol and causing the rebalancing of partition assignments on the
    group leader. Upon successful rebalancing and state synchronisation, the coordinator
    will again settle in the Stable state.


    > It may be possible for a member to miss a change in group membership — for example,
    due to a delayed heartbeat — and thereby forcibly excluded from the group by the
    coordinator. The member might still believe it is part of the group and may attempt
    to fetch records or send commit requests. These members are referred to as ‘zombies’.
    The use of an increasing generation ID on the coordinator acts as a fencing mechanism
    — rejecting requests with an ILLEGAL_GENERATION error where the presented generation
    ID does not match the coordinator’s generation ID. This forces consumers to discard
    their assignments, clear their member ID, and rejoin the group from a clean state.


