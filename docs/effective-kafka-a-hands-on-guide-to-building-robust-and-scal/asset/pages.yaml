    A totally ordered set is one where every element has a well-defined ordering relationship
    with every other element in the set. Consider, for example, the range of natural
    numbers one to five. When sorted in increasing order, it follows the following
    sequence:


    ![](img/a4d2c17b478048c90e0b48be89cde5c1_27_0.png)


    Totally ordered set


    An ordered set, as every element has a well-defined predecessor-successor relationship
    with every other element. One can remove arbitrary values from this set and reinsert
    those back into the set and arrive at the same sequence, no matter how many times
    this is attempted. Stated otherwise, there is only one permutation of elements
    that satisfies the ordering constraints.


    Ordered sets exhibit the convenient property of transitivity. From the above example,
    we know that 2 must come before 1 and before 3. We also know that 3 must come
    before 4. Therefore, we can use the transitivity relation to deduce that 4 must
    come after 2.


    The direct antithesis of a totally ordered set is an unordered set. For example,
    an offhand list of capital cities [Sydney, New York, London] is unordered. Without
    applying further constraints, one cannot reason whether Sydney should appear before
    or after New York. One can arbitrarily permute the elements to arrive at different
    sequences of cities without upsetting anyone.


    Between the two extremes, we find a partially ordered set. Consider the set of
    natural numbers ordered by divisibility, such that a number must appear after
    its divisor. For the range of numbers two to twelve, one instantiation of a sequence
    that satisfies this partial ordering constraint might be [2, 3, 5, 7, 11, 4, 6,
    9, 10, 8, 12]. But that is just one instance — there are several such sequences
    that are distinct, yet equivalent. Looking at the set, we can state that the numbers
    4 and 6 must appear after 2, but there is no predecessor-successor relationship
    between 4 and 6 — they are mutually incomparable.'
