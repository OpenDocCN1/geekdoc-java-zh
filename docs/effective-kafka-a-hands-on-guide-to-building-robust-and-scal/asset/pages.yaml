    sitably sized and appropriately configured, a cluster should tolerate the failure
    of a bounded number of replicas. What happens when we''ve gone over that number?


    At this point, Kafka essentially provides two options: either wait until an in-sync
    replica is restored or perform unclean leader election. The latter is enabled
    by setting unclean.election.enable to true (it is false by default). Unclean leader
    election allows replicas that are not in the ISR at the time of failure to take
    over partition leadership, trading consistency for availability.


    To maintain consistency in the face of multiple replica failures, one should set
    the replication factor higher than the minimum recommended value of three, and
    boost the min.insync.replicas to equate to the replication factor, thereby increasing
    the likelihood of a surviving replica being fully-synchronised with the leader.
    One could further ensure that every replica fits to act as a leader. The downside
    of this approach is the loss of availability in the write aspect: should a replica
    fail, consistency will be preserved, but no further writes to the partition will
    be allowed having insufficient replicas in the ISR. It is also less performant,
    making the main point of ISR to reduce the impact of slow replicas.


    > To be clear, the consistency-availability tradeoffs alluded to are not unique
    to Kafka''s replication protocol, affecting every distinct consensus protocol.
    Given a constant number of replicas, one can increase the number of replicas that
    must agree on a write, thereby increasing the likelihood that at least one replica
    survives—but in doing so, the system''s ability to make progress with a reduced
    replica. Reducing the number of voting replicas will allow the system to tolerate
    a greater number of failures, but increases the likelihood of losing all complete
    replicas—leaving just the partial ones, or not at all. The only way to solve both
    problems simultaneously is to increase the replication factor, which increases
    the cost of the setup and impacts the performance of durable writes requiring
    more acknowledgments. Whichever the approach, it has its drawbacks.


