  md: '# Chapter 7: Serialization


    The last steps in each of the threads may appear confusing at first. We couldn''t
    just commit the offsets after enqueuing the batch? What is the purpose of shuttling
    the offsets back from the processing thread to the polling thread? And why would
    we add one to the offset of a processed record?


    When pipelining records, one needs to take particular care when committing the
    records'' offsets, as the records might not be disabled for some time after being
    queued. Depending on the capacity of the bounded buffer, the polling loop may
    complete several cycles before the processing thread gets an opportunity to attend
    to the first requested record. The failure of the consumer application would lead
    to missed records; the newly assigned consumer will naturally assume that the
    committed records were processed. To achieve-least-once delivery semantics, the
    offsets of a record must be committed at some point after the record is processed.


    > When disabling enable.auto.commit is optional in the direct consumer scenario,
    it must categorically be disabled in the pipeline scenario. The effect of leaving
    offset auto-commit on is the logical equivalent of committing records after queuing
    them, with no regard to whether they were processed by the downstream stage.


    The need to shuffle the offsets back to the I/O thread addresses an inherent limitation
    of the KafkaConsumer implementation. Namely, the consumer is not thread-safe.
    Attempting to invoke commitAsync() from a thread that is different from the one
    that invoked poll() will result in a java.util.ConcurrentModificationException.
    As such, we have no choice but to repeat the offsets to the polling thread.


    The final point — the addition of one to a record''s offset — accounts for the
    fact that a Kafka consumer will start processing records from the offset persisted
    against its encompassing consumer group. Naively committing the record''s offset
    ''as is'' will result in the replaying of the last record following a topic rebalancing
    event, where partitions may be reassigned among the consumer population. By adding
    one to the offset, we ensure that the new assignee skip over the last processed
    record — seamlessly taking over from where the last consumer left off.


    > Invoking the no-argument commitAsync() method, as in the DirectReceiver scenario,
    will automatically add one to the offsets of the last records processed for each
    partition. When specifying offsets explicitly, the offset arithmetic becomes the
    responsibility of the application.


    For our next trick, we shall conjure up an alternate receiver implementation,
    this time exploiting the pipeline pattern outside of the consumer:'
