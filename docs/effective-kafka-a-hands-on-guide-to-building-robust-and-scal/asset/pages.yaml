    Kafka is a highly tunable and adaptable streaming event platform. Understanding
    the ins and outs of Kafka configuration is essential to operating a production
    cluster at scale.


    Kafka provides a fair degree of scope granularity of an individual configuration
    entry. Configuration entries may apply to a range of entity types, including brokers,
    topics, users, and clients. Depending on the nature of the configuration, a change
    may be administered either statically — by amending `server.properties`, or dynamically
    — via the Kafka Admin API. A combination of whether remote changes are supported
    and the targeted scope of a configuration entry is referred to as its `dynamic
    update mode`. The broadest of supported dynamic update modes applies a cluster-wide
    setting to all entities — a specific broker, user, topic, or client. The read-only
    dynamic update mode bears the narrowest of scopes, and the per-entity dynamic
    mode allows the operator to target an individual entity — and is reserved for
    static, per-broker configuration.


    In addition to navigating the theory, we have also racked up some hands-on time
    with the `kafka-configs.sh` built-in CLI tool. This utility can be used to view
    and assign dynamic configuration entries. And while it is effective, `kafka-configs.sh`
    has its idiosyncrasies and limitations — for example, it requires a direct ZooKeeper
    connection for administering certain entity types.'
