  md: '# Chapter 8: Bootstrapping and Advertised Listeners


    An elaboration of the above technique is to use round-robin DNS. Rather than maintaining
    multiple A records for unique hosts, DNS permits several A records for the same
    host, pointing to different IP addresses. A DNS query for a host will return all
    A records, permuting the records prior to returning. Furthermore, the returned
    list may be mixture of IPv4 and IPv6 addresses. Assuming the client will try the
    first IP address in the returned list, each will serve at an approximately equal
    number of requests. The client does not have to stop at the first entry; it can
    try any number of, all of them, until it reaches a host to satisfy its request.


    The ability to use all resolved addresses is utilised to Kafka in version 2.1,
    as part of KIP-302. (KIP stands for Kafka Improvement Proposal). To enable this
    feature, the client.lookup configuration to use_all_dns_ips is default. Once enabled,
    the client will use all resolved addresses.


    The advantage of this approach is that it does not require us to bootstrap the
    list when there are more fallback addresses. The list may be resolved to a single
    entry — for example, broker.ext.prod.kafka.mycompany — which will resolve to an
    arbitrary number of IP addresses, depending on how the DNS records are configured.
    Furthermore, multi-record DNS resolution applies not only to bootstrapping, but
    also to subsequent connections to the resolved brokers.


    The use of multiple alternate records for the same host requires the resolved
    brokers to agree on a common port number. Also, it is limited to A records; the
    DNS specifies the use of multiple fully-qualified domain name. Another potential
    limitation relates to the client implementation. The client.lookup property is
    accessed by the Java library; ports to other languages may not support this capability
    — check with your library before using this feature. With the exception of the
    last point, these constraints are rarely show-stoppers in practice. The benefit
    of this approach — having a centralised administration point with a set-and-forget
    bootstrap list — may not be immediately discernible with a handful of clients,
    but becomes more apparent as the client ecosystem grows.


    # A simple scenario


    In a simple networking topology, where each broker can be reached on a single
    address and port number, the bootstrapping mechanism can be made to work with
    minimal configuration. Consider a simple scenario with three brokers connected
    to a private network, such that the producer and consumer clients are also deployed
    on the same network. Keeping things simple, let''s assume the broker IP addresses
    are 10.0.1, 10.0.2, and 10.0.3. Each broker is listening on port 9092. A client
    application is deployed on 20.0.0.1 which is attempting to connect to the cluster.
    This scenario is illustrated below.


