  md: '# Authentication


    Kafka supports several modes for attesting the identity of the connected clients.
    This section explores the authentication options at our disposal.


    # Mutual TLS


    Mutual TLS (mTLS), also known as client-side X.509 authentication or two-way SSL/TLS,
    utilises the same principle of certificate signing used by conventional TLS, but
    in the opposite direction. In addition to the mandatory server-side authentication,
    the client presents a certificate that is verified by the broker. Each client
    will have a dedicated certificate, signed by a CA that is trusted by the broker.
    It may be the same CA used for the broker certificate, as is often the case.


    To enable client authentication on the broker, one must set the ssl.client.auth
    property in server.properties. The permissive values are:


    +   - none: Client authentication is disabled.

    - requested: Client may optionally initiate SSL authentication, but this is not
    mandated by the broker. However, should the client present its certificate, it
    will be verified.

    - required: The broker mandates the use of client-side SSL authentication. The
    client will not be allowed to connect without a valid certificate.


    The requested option is a permissive ''halfway house'' setting that enables the
    gradual migration from unauthenticated TLS. To begin the transition, set all brokers
    to use ssl.client.auth=requested. This can be done statically — by editing individual
    server properties file and bouncing the brokers, or dynamically — via the API
    or the CLI tools. Once all brokers are running in permissive mode, the rollout
    of client updates. Once all clients have been verified to work stably with mTLS,
    upgrade the ssl.client.auth setting to required.


    In order to use this authentication scheme, the client must be equipped with a
    dedicated private key, signed with a CA that is trusted by the broker. The key
    and certificate should be installed in the keystore.client.jks file, alongside
    the truststore.client.jks file. The process below mimics the previous examples.


    The following provides a worked example for enabling mutual TLS. Once again, the
    examples are going to use the /tmp/kafka-ssl directory. The ca-key and ca-cert
    files have been carried out from the previous examples.


    # Generate the private key


    Generate a private key for the client application, using localhost as the value
    for the ''first and name'' attribute, leaving all others blank.'
