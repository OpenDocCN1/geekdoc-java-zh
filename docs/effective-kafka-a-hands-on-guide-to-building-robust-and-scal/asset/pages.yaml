    Believe it or not, the most useful information one can get out of Kafka''s logs
    is actually the version number. Admittedly, it sounds somewhat banal, but how
    many times have you stared helplessly at the screen wondering why a piece of software
    still has the same bug that the authors swear they had fixed? Invariably, it is
    always some simple mistake - a synonym for wrong binary, a typo in the path, a
    wrong value in an environment variable, or some other mouth-eaten stuff along
    those lines. Printing the application version number in the logs is a simple way
    of eradicating these classes of errors.


    # Running in the background


    When launching ZooKeeper or Kafka, you have the option of running it as a daemon
    by passing the -daemon flag. In simple terms, this means launching ZooKeeper in
    the background, without holding the terminal. Kill the existing ZooKeeper process
    by pressing CTRL+C, and try the following:


    ```

    $KAFKA_HOME/bin/zookeeper-server-start.sh -daemon \

    $KAFKA_HOME/config/zookeeper.properties

    ```


    That''s all well and good, but where have the logs go? When launched as a daemon,
    the standard output of the ZooKeeper process is piped to $AFKA_HOME/logs/zookeeper.out.
    We can tail the logs by running:


    ```

    tail -f $KAFKA_HOME/logs/zookeeper.out

    ```


    To stop a daemon ZooKeeper process, run $KAFKA_HOME/bin/zookeeper-server-stop.sh.
    This will stop the background process if there is one running. If not, it will
    respond with No zookeeper server to stop.


    ZooKeeper and Kafka shell scripts are essentially mirror images of each other.
    To launch Kafka as a daemon,


    ```

    $KAFKA_HOME/bin/kafka-server-start.sh -daemon \

    $KAFKA_HOME/config/server.properties

    ```


    Kafka standard output logs are written to $KAFKA_HOME/logs/kafkaServer.out. To
    stop a daemon Kafka process, run $KAFKA_HOME/bin/kafka-server-stop.sh.'
