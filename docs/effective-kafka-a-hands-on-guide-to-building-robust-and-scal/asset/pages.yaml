  md: '# Confidentiality


    Kafka supports Transport Layer Security (TLS) for encrypting traffic between several
    key components. Unlike the discussion on network traffic policy, which maintained
    a purely theoretical stance, this section offers hands-on examples for configuring
    TLS and securely connecting producer and consumer clients over encrypted links.


    The reader may be familiar with TLS just by browsing websites. You may have noticed
    the padlock on the bar of the browser — this is an indication that the browser
    is communicating over an encrypted connection. HTTPS is increasingly used in place
    of HTTP to secure websites; the ''S'' in HTTPS stands for ''secure'' and implies
    the use of SSL and TLS algorithms. In nutshell, SSL is obsolete and TLS is the
    new name of the old SSL protocol. the term TLS is more accurate, but most people
    use SSL. Digital Certificates used to verify the communicating parties are often
    referred to as ''SSL Certificates'', but the name is plenty historical — in fact,
    they can be used to secure both SSL and TLS traffic.


    Like most of Java and the rest of the world, Kafka uses the term SSL to refer
    to TLS. The latest version of TLS we are writing is v1.3. The latest version supported
    by Kafka is TLS v1.2. From a security standpoint, the differences between v1.3
    and v1.2 are generally considered to be minor — v1.3 removes deprecated ciphers
    that have known exploits, reducing the likelihood of misconfiguration impacting
    the security posture. v1.3 trumps its predecessor in the area of performance —
    specifically, in connection establishment time.


    At the time of writing, support for TLS v1.3 is scheduled to be introduced in
    version 2.5.0 of Kafka. The main reason for the delayed adoption of TLS v1.3 in
    Kafka is that it introduces a dependency on Java 11, which is a step up from its
    current reliance on Java 8, but also a break in runtime compatibility. All, when
    correctly configured, TLS v1.2 is considered to be adequate for general use, and
    mandated by the Payment Card Industry (PCI) Security Standards Council for the
    Data Security Standards (DSS).


    An essential element of TLS is an X.509 Certificate, often referred to as ''Digital
    Certificate'' or simply ''certificate''. At a minimum, a certificate authenticates
    the server side of a TLS connection to the client, the latter that initiates the
    connection, while the former accepts the connection on a TLS socket. In such case,
    the server is a broker node. By verifying the certificate presented by the broker
    against a trusted certificate authority or a pre-agreed signed certificate, the
    client can be assured that the broker is, in fact, who claims to be. Certificates
    also be used in the opposite direction, attesting the identity of the client to
    the broker. This scenario will be covered later, in the case of authentication.


    In cryptography, X.509 is a standard defining the format of public-key certificates.
    X.509 certificates are used in TLS/SSL, which is the basis for HTTPS. They are
    also used in offline applications'
