    over a series of operations — using pessimistic locking or multi-version concurrency
    control. When the critical section is bound to a single database, the transactional
    capabilities of the database should be preferred over a DLM, as this minimises
    the amount of network I/O, simplifies the design of the application, and leads
    to a stronger consistency model.'
