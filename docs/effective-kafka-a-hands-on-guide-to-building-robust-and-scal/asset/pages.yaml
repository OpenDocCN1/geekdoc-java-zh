    # Protocol phases


    The group membership phase commences when a consumer sends a JoinGroupRequest
    to the group''s coordinator. The request will contain the group ID (specified
    by the `group.id` configuration), the internal member ID of the consumer (which
    is empty for new consumers), the desired session timeout (specified by `session.timeout`),
    as well as the consumer''s own metadata.


    Upon receiving a JoinGroupRequest, the coordinator will update its state and select
    a leader from the group, if one has not been already assigned. The coordinator
    will park the request, intentionally delaying the response until all expected
    members of the group have sent their join requests. The delay acts as a synchronisation
    barrier, ensuring all members become simultaneously aware of another. The responses
    will contain the set of individual member IDs and the ID of the group leader.'
