  md: '# Chapter 10: Client Configuration


    # 172


    The await-send stage is the most troublesome section of the record''s journey,
    as there is no way to precisely determine how long a record will spend in this
    state. Firstly, the batch could be held back by an issue in the cluster, beyond
    the producer''s control. Secondly, it may be held back by the preceding batch,
    which is particularly likely when the max.in.flight.requests.per.connection is
    set to 1.


    > Prior to the Kafka 2.1.0, time spent in the await-send stage used to be bounded
    by the same transmission timeout that is used after the batch is — request.timeout.ms.
    The producer would eagerly start the transmission clock when the record entered
    await-send, even though technically it was still queued waiting for Records blocked
    waiting for a metadata refresh or for a prior batch to complete could pessimistically
    expire, This problem was compounded if the prior batch was stuck in the sending
    stage, which granted it additional time credit amplified by the value of retries.
    In other words, it was possible for an await-send batch to time before its immediate
    referrer, if the preceding batch happened to have made more progress.


    The strength of the delivery.timeout.ms property is that it does not discriminate
    between the various stages of a record''s journey, nor does it unfairly penalise
    the record due to contingencies in a preceding batch.


    # Transactional ID and transaction timeout


    The transactional.id and transaction.timeout.ms properties alter the behaviour
    of the producer with respect to transactions. Transactions would be classed as
    a relatively advanced topic on the Kafka ''complexity'' spectrum; please consult
    Chapter 18: Transactions for a more in-depth discussion.


