    the producer will wait up for a set delay to allow other records to accumulate
    in a batch. This maximises the amount of data that can be transmitted in one go.
    Although records may be allowed to linger for the duration specified by _linger.ms_,
    the batch.size property will have an overriding effect, dispatching the batch
    it reaches the maximum size. Another way of looking at it: while the linger.ms
    property only comes into the picture when the producer is lightly loaded, batch.size
    property is continuously in effect, ensuring the batch never grows above a set
    cap.


    This topic is discussed in greater detail in Chapter 12: Batching and Compression.
    To summarise, batching improves network efficiency and throughput, at the expense
    of increasing publishing latency. It is often used collectively with compression,
    as the latter is more effective in the presence of batching.


    # Request timeout


    The request.timeout.ms property controls the maximum amount of time the client
    will wait for a broker to respond to an in-flight request. If the response is
    not received before the timeout elapses, the client will either resend the request
    if it has a retry buffer available (configured by the retries property), or otherwise
    fail the request. The default value of request.timeout.ms is 30000 (30 seconds).


    # Delivery timeout


    The delivery.timeout.ms property sets an upper bound on the time to report success
    or failure after a call to send() returns, having a default value of 120000 (two
    minutes).


    This setting acts as an overarching limit, —


    +   - The time that a record may be delayed prior to sending:

    - The time to wait acknowledgement from the broker (if acks=1 or acks=all);

    - The time budgeted for retryable send fails.


    The producer may report failure to send a record earlier than this time if either
    an unrecoverable error is encountered, the retries have been exhausted, or the
    record is added to a batch which reached an earlier delivery expiration deadline.
    The value of this property is greater than equal to the sum of request.timeout.ms
    and linger.ms.


    This property is a relatively recent addition, introduced in Kafka 2.1.0 as KIP-92.
    The main motivation was to consolidate the behavior of several related configuration
    properties that could potentially affect the time a record may be in a pending
    state, and inadvertently extend this time beyond the application’s tolerance to
    obtain a successful or failed output of publishing the record. The consolidated
    delivery.timeout.ms property acts as an overarching budget on the total time spent,
    terminating the publishing process and yielding an outcome or just before this


