    \ for our upcoming examples, which use Kafka's authorization capabilities. Unless\
    \ Kafdrop is set up to use SASL and SSL, it will be of no use once the Kafka cluster\
    \ is fully hardened. The same can be said about built-in CLI tools and any third-party\
    \ tools one might use.\n\n# Authorization\n\nWith SASL and authentication ticked\
    \ off, we are two-thirds of the way there. Authentication is necessary to identify\
    \ the user principal, and that is immensely useful for allowing or blocking access\
    \ to individual clients. Quite often, especially when the cluster is shared across\
    \ multiple applications, the binary allow-or-deny policy is insufficient; we need\
    \ more fine-grained control over the actions that an authenticated client should\
    \ be allowed to perform. This is where authorization comes into the picture.\n\
    \nKafka implements authorization using resource-centric ACLs. An ACL specifies\
    \ the following:\n\n+   **Principal** — the user performing the operation.\n-\
    \ **Operation** — the action being performed. For example, Read or Write.\n- **Host**\
    \ — an optional restriction on the addresses that the rule applies to.\n- **Resource\
    \ type** — the type of object on which the action is to be performed. For example,\
    \ Topic or Group.\n- **Resource pattern** — a simple rule for matching the subject\
    \ by its name. Rules specify a single resource by its literal name, or group multiple\
    \ resources using prefixes or wildcards.\n- **Outcome** — whether the action should\
    \ be allowed or denied."
