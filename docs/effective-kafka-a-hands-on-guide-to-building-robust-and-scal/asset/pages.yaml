    their indexes are copied (including those that have been previously compacted),
    purging records that have been superseded — except for tomestones, which are treated
    differently than conventional records. As the cleaner works through the log segments,
    new segments get swapped into the log, replacing older segments. This compaction
    does not require double the space of the entire partition; only the free space
    for one additional log segment is required.


    Compaction preserves the surviving records and their original order; it will never
    remember records or manipulate them in a way that might confuse a prospective
    consumer or contradict the producer''s original intent. In event, compaction converts
    a densely populated log into a sparse one, with ''holes'' in offsets that should
    be disregarded by consumers. Reverting to what was stated in Chapter 3: Architecture
    and Core Concepts, a consumer should not interpret the offsets literally — using
