    # Compaction


    # Use cases behind compaction


    Overwhelmingly, Kafka is used as a replicated log for notifying downstream parties
    of events of certain relevance, where the latter typically correlate to changes
    in an upstream system of record. Often, this is backed by a database or some other
    persistent store that offers an interface for querying the current state of the
    data, should the need for a holistic view of the state snapshot archive. Consumers
    may build their bespoke projections of the upstream system by faithfully replicating
    relevant changes, these are emitted as events. At either rate, Kafka is used as
    an intermediate transport of sorts — essential middleware that underpins a broader,
    event-driven system. And as essential as it may appear in this context, in the
    majority of its uses, Kafka does not entirely replace a system of record.


    Although one might argue, Kafka seems remarkably close to fulfilling the role
    of a data store — particularly as applications grow more on a replicated log.
    In even event-driven systems, the notion of querying the master store has been
    virtually eliminated, or more, relegated to the hydration scenario, where first-time
    consumers may query the master data in order to prime their internal projection,
    and switch to Kafka-based replication thereafter. For the reader''s reference,
    such systems are all bimodal — in they employ one mode for the initial hydration
    and another for the subsequent replication. While they are mostly straightforward
    — in that both modes can be easily reasoned about — there is the added complexity
    of maintaining code that deals with a one-off event — a contingency that typically
    occurs once in the lifetime of an application in its target operating environment.


    What if Kafka was going to be event sourcing? Specifically, in the role of a definitive
    event store that could reconstruct the state of an entire domain from first principles
    — by replaying all updates from the point of contention. Such an arrangement would
    have a clear benefit — unimodality; specifically, using one mode of operation
    to accommodate both the hydration scenario and the subsequent replication of event
    data. Simpler code; easier to test; easier to maintain.'
