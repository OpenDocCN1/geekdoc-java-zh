  md: '# Chapter 16: Security


    The lists above may appear confusing, especially the combination of resource types
    and operations. Kafka''s official documentation API provides a more detailed matrix
    of the relationships between lowlevel protocol messages (or API calls), operations
    and resource types — not that it makes things a whole clearer. (Unless you are
    intimately familiar with the underlying protocol messages.) This might not sound
    very encouraging, but ACL-related issues are diagnosed and resolved through experimentation
    and consulting people who have seen a similar problem before. Admittedly, it''s
    not great, but it''s the best answer to there.


    To make this process less ambiguous, Kafka clients will throw specific subclasses
    of AuthorizationException if the evaluation of rules results in a deny for one
    of the resources types. For example, a deny will result in a TopicAuthorizationException,
    a deny against a group will lead to a GroupAuthorizationException, and so forth.


    > There will be times when a developer will swear that they have enabled an operation
    on a resource, such as a topic, only to get some obscure ClusterAuthorizationException
    at runtime. It might seem nonsensical at the time — one trying to publish a record,
    but is inexplicably knocked back at the cluster level. Confusions as these typically
    occur when a client enables multiple API calls, and one of calls is being denied.


    # Enable authorization on the broker


    To enable authorization, edit server.properties, adding the following lines:


    ```

    authorizer.class.name=kafka.security.auth.SimpleAclAuthorizer

    super.users=User:*

    ```


    Restart the broker for changes to take.

    The super.users property specifies semicolon-delimited list of privileged users
    that are able to perform any operation. In this example, we specified admin for
    convenience, given that we already have this cluster configured, and we are also
    signing on the same user for interbroker authentication. You may specify other
    users, but make sure the interbroker user remains in the list.


    > Kafka delimits usernames with semicolons as a comma is a valid character in
    a username that has been derived from the attributes of an SSL certificate.


    As it is generally accepted, operating a secure cluster implies that both client
    and interbroker operations are subject to authentication and authorization controls.
    The interbroker operations are split into two broad classes: cluster and topic.
    Cluster operations refer to the actions necessary for the management of the cluster,
    such as updating broker and partition metadata, changing the leader and the in-sync
    replicas of a partition, and initiating a controlled shutdown. One of the defining
    responsibilities of a broker is the replication of partition data. Because of
    the way replication'
  merge: -1
