  md: '# Chapter 13: Replication and Acknowledgements


    We, use the term ''durable write'' to refer to the persistence of records where
    the producer has requested the highest level of durability. This is not necessarily
    the case with all writes; the producer can dictate the level of durability by
    specifying the number of required acknowledgments.


    To lighten the burden of slow replicas, Kafka introduces the concept of In-Sync
    Replicas, abbreviated as ISR. ISR is a dynamically allocated set of replicas that
    can demonstrably keep pace with the leader. The leader is also included in the
    ISR. Normally, this implies that a replica is trailing the leader within some
    bounded window of time (The time window being the difference between the timestamp
    of the record at the leader''s log offset and that of the follower). Slow replicas
    are automatically removed from the ISR, as the cardinality of the ISR set may
    be lower than the replication factor. A partition that has at least one replica
    removed from the ISR is said to be under-replicated. The responsibility of evaluating
    the performance of the ISR and maintaining the state of the ISR falls on the partition
    leader, which must also persist a copy of the ISR to ZooKeeper upon every change.
    This ensures that, should the leader fail, any of the followers can reconstruct
    the state of the ISR — enabling them to take over the leadership of topic.


    Instead of requiring the leader to garner acknowledgments from all follower replicas
    in the earlier example, a durable write only requires that acknowledgments are
    received from those replicas in the ISR. The lower bound on the size of the ISR
    is specified by the min.insync.replicas configuration on the broker. This property
    is complementary to the default.replication.factor property, being the defaults
    that will be applied to all topics. When creating a topic, its custodian may set
    an alternate replication factor and override the min.insync.replicas property
    as required. The producer client can specify whether a write should be durable
    or not. Naturally, the consumer client has no say in the replication factor or
    the minimum size of the in-sync replica set — it can no say in any matter regarding
    durability.


    When a partition leader is asserting a durability guarantee, it must ensure that
    all replicas in the ISR have acknowledged the write, because the ISR excludes
    underperforming replicas, the performance of the replication protocol is minimally
    impacted by a stalled or lagging replica. To be specific, a deteriorated replica
    will still affect the replication performance for as long as it is deemed a member
    of the ISR, but eventually it will be removed from the ISR — at that point and
    thereafter it will have no impact on performance. Prior to rejoining the ISR,
