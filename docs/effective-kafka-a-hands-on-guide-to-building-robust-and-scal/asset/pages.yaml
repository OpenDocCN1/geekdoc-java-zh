    In the arrangement above, the network is partitioned into four static segments.
    The ZooKeeper operates within its own, highly isolated network segment. This might
    be a subnet or a series of mutually-routable subsets. The latter would be used
    in a multi-site deployment, where disparate physical networks are used to collectively
