    > Setting acks=0 in no way implies that records will not be replicated by the
    leader to the in-sync replicas. Standard asynchronous replication behaves identically
    in all cases, irrespective of the number of requested acknowledgments, provided
    that the record actually arrives at the leader. You can think of the acks as the
    assurance level of a nominal contract between three parties — the client, the
    partition leader, and the follower replicas. The contract is always present, with
    each party having the best intentions, but nonetheless, the contract may not be
    fulfilled if one of the parties were to fail. At its most relaxed level acks=0
    — the extent of assurance is constrained to the client. With each increase the
    value of acks, the producer expands the scope of assurance to include the next
    party in the list. With acks=1, the producer will not be satisfied until all parties
    have fulfilled their contractual obligations.


    # One acknowledgement


    When acks=1, the client will wait until the partition leader queues the write
    to its local log. The broker will asynchronously forward the record to all follower
    replicas and respond to the publisher before it receives acknowledgments from
    all in-sync replicas.


    On the face of it, this may appear to offer a significantly stronger durability
    guarantee over acks=0. If in the acks=0 the system was not tolerant of the failure
    of a single party, in acks=1 case the failure of the partition leader should be
    tolerated, provided the clients remain online. Should the leader fail, the producer
    can forward its request to another replica, whichever takes the place of the leader.


    In reality, this is ill-advised for several reasons. One is to do with when Kafka
    writes records to its log. Records are considered written when they are handed
    over to the underlying file system buffers. However, the broker does not invoke
    fsync operation for each written record, in other words, it does not wait for
    the write to be flushed before replying to the client. Therefore, it is possible
