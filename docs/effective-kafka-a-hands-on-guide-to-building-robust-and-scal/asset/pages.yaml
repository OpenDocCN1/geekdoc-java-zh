  md: 'transit or impersonate either the broker or the client. In addition to client
    traffic, interbroker traffic is also insecure by default.


    +   * **Connections to Kafka brokers are unauthenticated.** Any client with knowledge
    of the bootstrap endpoints can establish a connection to the brokers, appearing
    as a legitimate client to Kafka. A client does not have to identify itself, nor
    prove that the supplied identity is genuine.

    * **No authorization controls are in place.** Even if authentication is enabled,
    a client may perform any action on a broker. The default authorization policy
    is allow-all, letting a rogue client amok.


    > The reason for Kafka''s default security profile is largely historical. Early
    versions of Kafka had no support for security, and introducing mandatory security
    controls would have impacted compatibility with existing clients.


