    make the final call on the optimisation strategy. An argument could be made that
    since Kafka-based applications need to be throughput-oriented, optimisations of
    this nature are timely and appropriate.


    > Kafa''s performance doctrine has traditionally been to add more consumers, more
    partitions, and more brokers. Often, little regard is given to the cost-effectiveness
    of this model. It is not uncommon to observe a high number of mostly-idle consumers
    in an autoscaling group to get a moderately loaded topic. One cannot help but
    question the actual number of consumer instances required, had each utilised resources
    to provide their capacity.


    And for the best part. Previous examples have leveraged the EventReceiver interface
    to decouple the business logic from the low-level Kafka Consumer handling. As
    we have just demonstrated, pipelining can fit entirely into the EventReceiver
    implementation, with no impact to the business logic layer. The complexities of
    multi-threaded code, queuing of records, and the shuffling of offsets are concealed
    behind the EventReceiver interface. In fact, we see multiple EventReceiver implementations—a
    conventional DirectReceiver and a multi-threaded PipelinedReceiver. These are
    functionally equivalent, but exhibit different performance and resource utilization
    characteristics. The PipelinedReceiver adds 30 or so lines on top of the DirectReceiver
    implementation. Comparatively speaking, this may seem like a lot, given that the
    extra code is around 50% of the original implementation. But in the larger scale
    of things, the added complexity is incurred once—the improved resource utilization
    and the resulting performance gains more than make up for the effort.


    > In this case the reader is wondering, the pipelining optimisation is less effective
    in producer applications, as serialization is typically less processor and memory-intensive
    compared to deserialization. Also, the KafkaProducer is pipelined internally,
    separating serialization from network i/o. Little in the way of performance gains
    would be accomplished by moving record serialization to a dedicated thread.


    # Record filtering


    In rounding off this chapter, we shall highlight another compelling reason for
    the filtering of records. Filtering fulfills a set of use cases where either a
    deserializer, or an application-level unmarshaller could potentially present a
    record to the rest of the application. This is not a native capability of a Kafka
    consumer, requiring a bespoke implementation.


    The natural question one might ask: Why not filter at the business logic layer
    with one moves up the application stack. Firstly, it assumes that the client has
    the requisite domain objects that can be mapped from a record''s serialized form.
    Secondly, it incurs the performance overhead of unconditionally unmarshalling
    all records, only to discard some records shortly thereafter.'
