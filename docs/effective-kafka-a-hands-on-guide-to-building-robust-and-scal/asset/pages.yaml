  md: '# Chapter 5: Getting Started


    In case you were wondering, the arrow to the left of the record lets lets you
    expand and pretty-print JSON-encoded records. As our examples didn''t use JSON,
    there''s nothing to pretty-.


    # Consuming records


    ```

    $KAFKA_HOME/bin/kafka-console-consumer.sh \n  --bootstrap-server localhost:9092
    \n  --topic getting-started --group cli-consumer --from-beginning \n  --property
    "print.key=true" --property "key.separator="

    ```


    The terminal will echo the following:


    ```

    bar:first message

    bar:second message

    foo:first message

    foo:second message

    foo:third message

    ```


    Because the consumer is running as a subscription, with a provided consumer group,
    the output will stall on the last record. The consumer will effectively tail the
    topic — continuously polling for new records and printing them as they arrive
    on the topic. To terminate the consumer, press CTRL+D.


    Note that we specified the --from-beginning flag when invoking the command. By
    default, a first-time consumer (for a previously non-existent group) will have
    its offsets reset to the topic''s high-water mark. In order to read the previously
    published records, we override the default offset strategy to tail from the topic''s
    low-water. If we run the same command again, we see no records -- the consumer
    will halt, waiting for the arrival of new records.


    > There is no --from-beginning flag. To tail the end of the topic, simply delete
    the consumer offsets and restart the CLI command. Deleting offsets and other offset
    manipulation commands are described in the section that.


    Having consumed the backlog of records with the new cli-consumer consumer group,
    we can switch back to Kafdrop to observe the addition of the new group. The new
    group appears in the topic overview screen, under the section ''Consumers'', in
    the bottom-right.'
