  md: '# Chapter 18: Transactions


    For the reveal: the transactional ID for each producer is derived by concatenating
    the corresponding input topic and partition index pair.


    To understand this approach works, consider the earlier example with P0 and P1,
    where I2 was transferred from P1 to P0 as a result of a perceived failure. For
    simplicity, the input and output topics are named tx-input and tx-output. Under
    the reised architecture, P0 starts with one consumer and two producers with transactional
