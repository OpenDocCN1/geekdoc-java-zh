    # Committing offsets


    It has already been said that consumers maintain an internal state with respect
    to their partition offsets. At some point, that state must be shared with Kafka,
    so when a partition is reassigned, the new consumer can resume processing from
    where the outgoing consumer left off. Similarly, if the consumers were to disconnect,
    they would ideally skip over any records that they have already processed.


    Persisting the consumer state back to the Kafka cluster is called committing an
    offset. Typically, a consumer will read a record (or a batch of records) and commit
    the offset of the last record plus one. If a new consumer takes over the topic,
    it will commence processing from the last committed offset — the plus-one shift
    is essential.(Otherwise, the last processed record would be handled a second time.)


    > Curious fact: Kafka employs a recursive approach to managing offsets, utilising
    itself to persist and track offsets. When an offset is committed, the group coordinator
    will publish a record on the internal `consumer_offsets` topic. The contents of
    this topic are compacted in the background, creating an efficient event store
    that progressively reduces to only the last known commit points for any given
    group consumer.


    Controlling the point an offset is committed provides a great deal of flexibility
    regarding delivery guarantees, further highlighting Kafka''s adaptability to various
    messaging scenarios. The term ''delivery'' assumes not just reading a record,
    but the full processing cycle, with side effects.(For example, updating a database,
    or invoking a service) One can shift from an *at-most-once* to *at-least-once*
    delivery model by simply moving the commit point from before the processing of
    a record is commenced, to a sometime after the processing is complete. With this
    model, the consumer may fail midway processing a record, it will be re-read following
    partition reassignment.


    By default, a Kafka consumer will automatically commit offsets at an interval
    of at least every five seconds. The interval will be automatically extended in
    the presence of in-flight records — the records that are still being processed
    by the consumer. This interval can be controlled by the `auto.commit.interval.ms`
    property, which is discussed in Chapter 10: Client Configuration. The implication
    of this offset-commit feature is that it extends the window of unnoticed offsets;
    in other words, the consumer might finish processing a batch of records without
    necessarily committing the offsets. If the consumer''s partitions are not reassigned,
    the new consumer will end up processing the same batch second time. To constrain
    the window of unnoticed offsets, one needs to commit offsetting into their own
    hands. This can be done by setting the `enable.auto.commit` client property to
    false.


