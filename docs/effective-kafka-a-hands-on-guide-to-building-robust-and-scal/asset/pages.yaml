  md: 'require tamper-proof signatures. An X.509 certificate contains a public key
    and an identity (a hostname, an organisation, or an individual) — this is depicted
    in either the Common Name (CN) attribute of the certificate or the Subject Alternative
    Name (SAN), the latter being an extension to the X.509 base standard.


    A certificate is signed by a Certificate Authority (CA) or self-signed. When a
    certificate is signed by a trusted certificate authority, or validated by other
    members, someone holding that certificate can rely on the public key it contains
    to establish secure communications with another party, or validate documents digitally
    signed by the corresponding private key.


    A certificate authority is akin to a government office that issues passports.
    Passports are printed on specially-crafted materials and use various stamps, watermarks,
    ultraviolet ink, magnetic strips and holograms to make them difficult to forge.
    Other governments may inspect the passport using the verification methods at their
    disposal to ascertain its authenticity. Whereas a passport predominantly relies
    on physical means for ensuring security, the signing of X.509 certificates achieves
    the equivalent using cryptographic algorithms, the certificate authority acting
    as the digital equivalent of a passport office. For long as the CA remains a genuine
    and trusted authority, the clients have the assurance that they are connecting
    to authentic parties. (More recently, passports have also started embedding an
    RFID chip that holds digital biometric data of the passport holder — adding digital
    security to a traditionally physical device).


    Complementary to X.509 certificates is Public Key Infrastructure (PKI) — a comprehensive
    set of roles, policies, hardware, software and procedures needed to create, manage,
    use, store and revoke digital certificates and manage public-key encryption. PKI
    is an arrangement that binds public keys with respective identities of entities
    (individuals, hosts and organisations). The binding is established through a process
    of registration and issuance of certificates at and by a CA. Depending on the
    assurance level of the binding, this may be carried out an automated process or
    under human supervision.


    The diagram below illustrates the relationship between a pair of communicating
    parties — a client and a server — and the supporting mechanisms by which the integrity
    and confidentiality of the information exchange is guaranteed.'
