    the retry profile and the error handling must be devised with that in mind.


    # Testing considerations


    Continuing the discussion above, another cause of failures that is often overlooked
    relates to running Kafka in performance-constrained environments as part of automated
    testing. Developers will routinely run single-broker Kafka clusters in a containerised
    environment or in a virtual machine. Kafka''s I/O performance is significantly
    diminished in Docker or on a virtualised system (The reasons as why are not important
    for the moment).The problem is exacerbated when Docker is run on macOS, which
    additionally incurs cost of virtualisation. As a consequence, expect a longer
    initial readiness time and more anarch transitions at the controller. The test
    may assume that Kafka is available because the container has started and Kafka
    is connecting on its listener ports; the latter does not imply that the broker
    is ready to accept requests. It may take several seconds for it to be ready and
    the timing will not be consistent from run to run. The default tolerance (effectively
    infinite retries) actually couples well with these sorts of scenarios. Tuning
    retry behaviour to better represent production scenarios, while appearing prudent,
    may hamper local test automation – leading to brittle tests that occasionally
    fail due to uncertainty.


    One way of solving this problem is to allow for configurable retry behaviour,
    which may legitimately vary between deployment environments. The problem with
    this approach is it introduces variance between real and test environments, which
    is rarely ideal from an engineering standpoint. An alternate approach, and one
    that is preferred by the author, is to introduce an extended wait at the beginning
    of each test, allowing for some grace time for the broker to start up. The loop
    can poll the broker for incoming read-only query, such as listing topic names.
    The broker may initially take some time to respond, returning a series of errors
    — which are ignored while it is still in the process of starting up. When it does
    respond, it usually indicates that the cluster has stabilised and the test may
    commence.


    # Security configuration


    All three client types can be configured for secure connections to the cluster.
    We are not going to explore security configuration in this chapter, partly because
    the range of supported options is overbearing, but mostly because this topic area
    is covered in Chapter 16: Security.'
