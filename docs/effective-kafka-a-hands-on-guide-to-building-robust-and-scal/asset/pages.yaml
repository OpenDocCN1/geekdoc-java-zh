  md: '# Chapter 7: Serialization


    +   1. Implement a custom deserializer to directly handle the encoded form, such
    that the application code deals exclusively with typed payloads.

    2. Pigback on an existing deserializer, such as a StringDeserializer (for text
    encodings) or a ByteArrayDeserializer (for binary encodings), deferring the final
    unmarshalling of the encoded payload to the application.


    There are no strong merits of one approach over the other that are worthy of a
    debate. Like in the producer scenario, we will use a custom deserializer to implement
    the forthcoming examples, being the idiomatic approach.


    The section on serializers questioned the merits of type safety at the level of
    the producer, instead advocating for a façade over the top of the Kafka client
    code to insulate the business logic from the intricacies of Kafka connectivity,
    and to well mock the latter in unit tests. As we will shortly discover, the case
    for a dedicated insulation layer is further bolstered when dealing with the consumer
    scenario.


    # Receiving events


    Continuing from the producer example, let''s examine the routine concerns of a
    typical business logic that might reside in a consumer application. How would
    it react to events received from Kafka? And more importantly, would it even receive
    these events?


    The standard mechanism for interacting with a Kafka consumer is to block on Consumer.poll(),
    then iterate over the returned records — invoking an application-level handler
    for each record. Kafka''s defaults around automatic offset committing have also
    been designed specifically around this pattern — the poll-process loop.


    > The poll-process loop is a coined term, in lieu of an official name put forth
    by the Kafka documentation or a common name adopted by the user community.


    A poll-process loop requires a thread on the consumer, as well as all the life-cycle
    management that goes with it — when to start the, how to stop it, and so on.


    Ideally, we would simply inject a high-level event receiver into the business
    logic, register a listener callback with the receiver to be invoked every time
    the receiver pulls a record from the topic. Perhaps something along these lines:'
