    In this chapter, we looked at one of Kafka''s main mechanisms for facilitating
    multitenancy. Quotas support this capability by mitigating denial of service attacks,
    allowing for capacity planning and addressing quality of service concerns.


    Quotas may be set in terms of allowable network bandwidth and request rates, applying
    either to a user principal or a client ID, or a combination of both. The enforcement
    algorithm works by comparing the client''s resource utilisation to the set maximum,
    over a sliding window. Where the utilisation exceeds the set limit, the broker
    delays its responses, forcing the client to slow down.


    Finally, we looked at the parameters behind the quota enforcement algorithm and
    their effect on the resulting traffic shape. The relationship is nuanced, the
    resulting characteristics of the traffic profile are tightly coupled to the implementation
    and are difficult to infer. The dependable attribute to reason about is widening
    the sliding window allows for increased tolerance to burst traffic.


