    # PLAIN AND SCRAM


    +   The complete source code listings for the SASL producer and consumer examples
    are available at github.com/ekoutanov/effectivekafka/ in the src/main/java/effectivekafka/sasl
    directory.


    SASL offers two username-password based authentication methods: PLAIN and SCRAM.
    (There are more in existence, but Kafka supports these two for authenticating
    clients.) The former refers to cleartext authentication where credentials are
    presented verbatim. The latter is an acronym for Salted Challenge Response Authentication
    Mechanism — a protocol designed to fulfill authentication without the explicit
    transfer of credentials.


    To the user, there is little discernible difference between the two. In both cases,
    the application is configured with a username and password pair, with the only
    difference being the fully-qualified name of the JAAS (Java Authentication and
    Authorization Service) module. Under the hood, they are very different. PLAIN
    provides no confidentiality of its own, requiring the use of an encrypted channel.
    SCRAM is in its own right, providing confidentiality in the absence of any transport
    layer.


    > When the question might arise, PLAIN is not an acronym. The exact origin of
    the name is unspecified, but it is a candidate calcification of the adjective
    ''plain'' — being ''simple or basic in character'', or opposed to an abbreviation
    of ''plaintext'' — the cryptographic term meaning ''input to a cipher''. Indeed,
    RFC 4616 specifies PLAIN as a simple mechanism for the exchange of passwords.
    The exchange although occurs in cleartext — there is no encryption at the application
    level. As such, PLAIN is intended to be used with lower-level mechanisms that
    guarantee the confidentiality of data.


    As the PLAIN mechanism itself provides no integrity or confidentiality protections,'
  merge: -1
