  md: '# Chapter 1: Event Streaming Fundamentals


    Integrated systems, and generally, any topological arrangement that exhibits a
    high degree of component coupling is prone to correlated failure — the failure
    of one component can take down an entire system. In a tightly coupled system,
    components directly rely on one another to jointly achieve some goal. If one of
    these components fails, then the remaining components that depend on it also function;
    at minimum, they will not be able to carry out those operations that depend on
    the failed component.


    In the case of a monolith, the failure assertion is trivial — if a fail-stop scenario
    occurs, the entire process is affected.


    Under EDA, a enduring coupling failure implies the inability to emit every event
    or consume them. In the event of emitter failure, consumers may still operate,
    albeit without a facility for reacting to new events. Using our example, if the
    e-commerce engine fails, none of the downstream processes will be affected — the
    business can still run analytics and attend to resource planning concerns. Conversely,
    if the ERP system fails, the business will still make sales; however, some products
    might not be placed on back-order in time, potentially leading to low stock levels.
    Furthermore, provided the event channel is durable, the e-commerce engine will
    continue to publish events, which will eventually be processed by the system when
    it is restored. The failure of an event channel can be countered by implementing
    a local, stateful buffer on the emitter, In other words, not only is an event-driven
    system more resilient by retaining operational status during component failure,
    but it is also capable of self-healing when failed components are replaced.


    In practice, systems may suffer from soft failures, when components are saturated
    beyond their capacity to process requests, creating a cascading effect. In networking,
    this phenomenon is called "congestive collapse". In effect, components appear
    to be online, but are stressed — unable to turn around some fraction of requests
    within acceptable time frames. In turn, the requesting components — having detected
    a timeout — retransmit requests, hoping to eventually get a response. This increases
    pressure on the stressed components, exacerbating the situation. Often, the missed
    response is merely an acknowledgement of receiving the request — in effect, the
    requester is piling on duplicate work.


    Under EDA, requesters do not require a confirmation from downstream consumers
    — a simple acknowledgement from the event channel is sufficient to assume that
    the event has been stably enqueued and the consumer(s) will get to it some future
    point in time.


    # Consistency


    EDA ameliorates the problem of distributed consistency by attributing explicit
    mastership to state, such that any stately element can be manipulated by at most
    one system — its designated owner. This is also referred to as the originating
    domain of the event. Other domains may only react to the event; for example, they
    may reduce the event to a local projection of the emitter''s state.


    Under this model, consistency within the originating domain is trivially maintained
    by enforcing the single writer principle. External to the domain, the events can
    be exact'
