  md: "# Chapter 16: Security\n\n```\n{\n  \"alg\": \"none\"\n}\n```\n\nThe JWS Signature\
    \ used for unsecured tokens is an empty octet string, which base-64\nencodes to\
    \ an empty string.\n\nUnsecured tokens claim out-of-the-box with minimalconfiguration\
    \ and no OAuth 2.0\ninfrastructure required. The principal’s username is taken\
    \ directly from the sub (subject) claim in\nthe JWT.\n\nIn its default usage,\
    \ the OAUTHBEARER mechanism cannot be used securely in production environments,\n\
    as it cannot verify user claims. In order to practise this algorithm, one must\
    \ implement a pair\ncallback handlers. The callbacks are necessary to allow the\
    \ client to generate and sign access tokens,\nan for the broker to validate them\
    \ against a trusted certificate.\n\nOn the client implement, the org.apache.kafka.common.security.auth.AuthenticateCallbackHandler\n\
    interface to retrieve a token. The implementation must be able to handle an instance\
    \ of an OAuthBearerTokenCallback\nfeeding it with a well-formedOAuthToken. The\
    \ implementation class is specified via the sasl.login.callback\n property.\n\n\
    On the broker, implement the org.apache.kafka.common.security.auth.AuthenticateHandler\n\
    interface capable of handling an OAuthValidatorCallback. Its role is to validate\
    \ the attributes\nof the token and provide a validated token to the callback.\
    \ The implementation is configured via the\nlistener_name.sasl.oauthbearer.sasl.server.handler.class\
    \ property. The class\ndefinition, along all dependencies must be on the classpath\
    \ of the broker’s JVM instance. This\ncan be accomplished by packaging the kafka\
    \ handler and its dependencies into a Jar file, and\nplacing the latter in $KAFKA_HOME/libs.\n\
    \nRather implementing OAuth handling from scratch, you can use the open-source\
    \ Kafka OAuth\nproject at [github.com/jairsjunior/kafka-oauth](https://github.com/jairsjunior/kafka-oauth).\n\
    \n> A secondary objective of supporting Oauth bearer tokens was the internal testing\
    \ of\nSASL. Kafka’s SASL implementation can now be considered mature, but nonetheless,\
    \ the\nAUTHBEARER can still be useful for testing with different users.\n\n# Delegation\
    \ tokens\n\nConcluding the discussion on authentication methods, we have delegation\
    \ tokens. Delegation tokens\nare used as a lightweight authentication mechanism\
    \ that is way to SASL. It was intro-\nduced in [KIP-48](https://cwiki.apache.org/confluence/display48)\
    \ as part of release 1.1.0. The initial motivation for delegation tokens was to\
    \ simplify\n\n*https://github.com/jairsjunior/kafka-oauth\n*https://cwiki.apache.org/confluence/x/tfmAnn"
