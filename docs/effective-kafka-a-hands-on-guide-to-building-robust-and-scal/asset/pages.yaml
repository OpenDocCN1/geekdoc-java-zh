    +   2. Dynamic cluster-wide configuration; followed by

    3. Static read-only configuration from server properties.


    A seasoned Kafka practitioner may have picked up on two additional, easily overlooked,
    configuration levels which we have not mentioned — default configuration and deprecated
    configuration. The default configuration is advertised automatically if no other
    configuration can be resolved. There is a caveat: A property may be a relatively
    recent addition, replacing an older, deprecated property. If the newer property
    is not set, Kafka will apply the value of a deprecated property if one is set,
    otherwise, and only then, will the default value be applied. (In fact, a configuration
    property may shadow multiple deprecated properties, in which case a more complex
    chain of precedence is formed.)


    Configuration defaults are also specified in the Kafka documentation page, but
    there is a sign: the default value does not convey any practical meaning. For
    example, what when the default is stated as null? In addition to viewing the default,
    one must carefully read the description of the property, particularly when a property
    replaces one or more deprecated properties. The documentation delineates the behaviour
    of an entity (broker, topic, etc.) to when the property is not set.


    Dynamic updates were introduced in Kafka 1.1 as KIP-226* (KIP stands for Kafka
    Improvement Proposal) to reduce the overhead of administering a large Kafka cluster
    and potential for interruptions and performance degradation caused by rolling
    broker restarts. Some key motivating cases include —


    +   * Updating short-lived SSL keystores on the broker;

    * Performance-tuning based on metrics (e.g. increasing network or I/O threads);

    * Adding, removing, or reconfiguring metrics reporters;

    * Updating configuration of all topics consistently across the cluster;

    * Updating cleaner configuration for tuning; and

    * Updating listener/security configuration.


    The original proposal considered deprecating the static configuration entries
    in server.properties together for those that could be altered programmatically.
    In the course of analysis and community consultation, this measure was found too
    drastic and consequently rejected entries in server.properties were allowed to
    stay, as it was considered useful to maintain a simple quick-start experience
    of working with Kafka without setting up options in ZooKeeper first.


    > https://wiki.apache.org/confluence/display/KAFKA/KIP-226+-+Dynamic+Broker+Configuration'
