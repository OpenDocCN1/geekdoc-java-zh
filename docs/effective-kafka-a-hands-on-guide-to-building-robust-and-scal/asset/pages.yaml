  md: '# Event-sourced CQRS


    ![](img/a4d2c17b478048c90e0b48be89cde5c1_21_0.png)


    CQRS


    Command-Query Responsibility Segregation (CQRS) separates the actions that mutate
    state from the actions that query the state. Because mutations and queries typically
    exhibit contrasting runtime characteristics and require vastly different, often
    contradictory optimisation decisions, the separation of these concerns is conducive
    to building highly performant systems. The flip side is complexity — requiring
    multiple datastores and duplication of data — each datastore will maintain a unique
    projection of the master dataset, built from a duplicated data pipe. Kafka curbs
    some of the complexity inherent in CQRS architectures by acting as a common event-sourced
    ledger, using the concept of consumer groups to individually feed the different
    query-centric datastores.


    This pattern is related to log shipping, and might appear identical at glance.
    The differences are subtle. Log shipping is performed on low-level, internal representations
    of data, where both the replicas and the master datastore are coupled to, and
    share the same internal data structures. Put differently, log shipping is an internal
    mechanism that shuttles data within the confines of a single domain. In comparison,
    CQRS assumes disparate systems and spans domain boundaries. All parties are coupled
    to some canonical representation of events, which is versioned independently of
    the parties'' internal representations of these events.'
