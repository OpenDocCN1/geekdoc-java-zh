  md: '# Chapter 2: Introducing Apache Kafka


    Staged Event-Driven Architecture (SEDA) is the application of pipelining to event-oriented
    data. Events flow unidirectionally through a series of processing stages linked
    by topics, each one performing a mapping operation before publishing a transformed
    event to the next topic. Intermediate stages simultaneously act as both consumers
    and producers, may scale autonomously and independently of one another to match
    their load demands. By breaking a complex process into stages, SEDA improves the
    modularity of the system.


    A SEDA pipeline may combine fan-in and fan-out topologies. Stages may consume
    events from multiple topics simultaneously, performing the equivalent of an SQL
    JOIN on event streams. Stages can also publish to multiple topics, feeding downstream
    pipelines.


    As a pattern, SEDA is readily found in data warehousing, data lakes, reporting,
    analytics, and other Business Intelligence systems, and is often a crucial element
    of Big Data applications. SEDA can also be used in log aggregation; in fact, log
    aggregation is a narrow privatisation of SEDA.


    # CEP


    ![](img/a4d2c17b478048c90e0b48be89cde5c1_20_0.png)


    Complex Event Processing (CEP) extracts meaningful information and patterns in
    a stream of discrete events, or across a set of disjoint event streams. CEP processors
    tend to be stateful, as they must be able to efficiently recall prior events to
    identify patterns that may span a broad timeframe, ranging from milliseconds to
    days, depending on the context.


    CEP is heavily employed in such applications as algorithmic stock trading, security
    threat analysis, real-time fraud detection, and control systems.'
  merge: -1
