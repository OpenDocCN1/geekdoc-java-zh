    Tombstone records are preserved longer by design. The preservation for tomstones
    is revealed in the following scenario. A publisher emits records for an entity,
    generalised by `Create` and `Update` events. Eventually, when the entity is deleted,
    the producer will follow with a tombstone — indicating to the cleaner and the
    consumer ecosystem that the entity in question should be completely purged from
    the topic and all projections. This makes sense for a consumer that has not seen
    traces of the surviving records. If the entity has already been deleted, then
    dropping `Create`, `Update` and tombstone records for it is a waste of the consumer''s
    time. It is more a trivial waste of resources; in fact, it runs contrary to the
    requirements of a pure event store — the consumer current state should only be
    exposed to the surviving records to reconstruct the current state, having initiated
    with a clean state.


