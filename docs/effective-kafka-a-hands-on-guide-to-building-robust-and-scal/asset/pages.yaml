  md: '# Chapter 17: Quotas


    both those values are set to `<default>`, the quota will be allocated for the
    sole use of the connected client, as well as all clients with identical username
    and client ID attributes.


    Conversely, if a quota specifies either the username or the client ID, but not
    both, then the quota will be shared among all clients that match that username
    or client ID, whichever one was supplied, and irrespective of the value of the
    omitted attribute.


    Understandably, this might cause a certain amount of confusion, which can be resolved
    with a few examples. We shall focus on rules #1, #2 and #3 because they capture
    scenarios where both attributes are assigned to specific values, where one is
    assigned and the other references the default entity, and where one is assigned
    and the other is omitted. Consider the following quotas:


    | Username | Client ID | Read rate (kB/s) | Rule type |

    | --- | --- | --- | --- |

    | alice | pump | 400 | 1 |

    | alice | <default> | 300 | 2 |

    | alice | | 200 | 3 |


    Note, the value ` means that the attribute is not set; the `<default>` implies
    the default entity for the attribute in question.


    When a client C0 with the username/client ID tuple (alice,pump) connects, it will
    be allocated 400 kB/s of read capacity — having the most specific profile.


    When C1 — a client with the same attributes (alice,pump) — subsequently connects,
    it will share the quota with C0 — matching the same rule. In other words, the
    two clients will not be able to consume more than 400 kB/s of data between them.
    If C0 over-consumes, it will affect C1 and versa.


    A third client C2 connects with (alice,sink) — matching the (alice,<default>)
    rule for 300 kB/s of bandwidth.


    A fourth client C3 connects with (alice,drain) — matching the (alice,<default>)
    rule for 300 kB/s. However, C2 and C3 were matched by the same rule, they have
    different client IDs and will not share the quota. In other words, C2 and C3 have
    300 kB/s of each available bandwidth.


    A fifth client C4 connects with the same (alice,drain) attributes as C3. This
    client will end sharing the bandwidth with C3 — 300 kB/s among them.


    Next, we have C5 — a client authenticated as alice, having the optional client
    ID. Despite what one might think, this is matched by the (alice,<default>) rule.
    When a default entity is specified in a rule, it will match a client where no
    value for the corresponding attribute is provided. Essentially, at no point is
    the (alice,0) rule fired; deleting it would make no difference.


    C6 — another client without a client ID, will not match any of the rules in the
    table and will be allowed to operate with unbounded capacity.


    Summarising the above examples, we have the table below:'
