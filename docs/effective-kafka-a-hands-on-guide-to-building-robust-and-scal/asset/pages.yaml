  md: '# Chapter 10: Client Configuration


    175


    The reason that batches are not broken up into individual records and returned
    in sub-batch quantities is due to Kafka''s fundamental architecture and design
    decisions that contribute to its performance characteristics. Batches are an end-to-end
    construct; formed by the producer, they are transported, persisted, and delivered
    to the consumers as without unpacking the batch or inspecting its contents — minimising
    unnecessary work on the broker. In the best-case scenario, a batch is persisted
    and retrieved using zero-copy, where transfer operations between the network and
    the storage devices occur with no involvement from the CPU. Brokers are often
    the point of contention — they form a static topology that does not scale elastically
    — unlike, some, consumers. Reducing their workload by performing more work onto
    the producer and consumer clients leads to a more scalable system.


    A refinement of fetch.max.bytes is the max.partition.fetch.bytes, applying a soft
    limit on a per-partition basis. The default value of max.partition.fetch.bytes
    is 1048576 (1 MiB).


    There are no official guidelines for tuning Kafka with respect to fetch.max.bytes
    and max.partition.fetch.bytes. While their individual functions are clear, their
    mutual relationship is not as apparent. One might consider what happens when a
    fetch response aggregates batches from multiple partitions. Suppose a topic is
    unevenly loaded, where relatively few partitions carry more records than the remaining
    majority of partitions. If the max.partition.fetch.bytes is set overly relaxed,
    the results of the fetch will be biased towards the heavily-loaded partitions.
    In other words, the fetch quota will be disproportionately exhausted by the minority
    partitions. In the best case, this might negatively affect the propagation latencies
    of the majority partitions; in the worst case, this might lead to periods of starvation,
    where records for certain partitions are unceingly dropped from the response.


    This Pareto Effect is actually more common than one might imagine. Record keys
    to reflect the identifiers of real-world entities, the distribution of records
    within a Kafka topic often acquires an uncanny resemblance to the real world,
    which we know, is often accurately described by the power law. Setting a conservative
    value for max.partition.fetch.bytes improves fairness, increasing the likelihood
    of aggregating data over the majority partitions by penalising heavily loaded
    partitions. However, an overly conservative value undermines the allowance by
    fetch.max.bytes. Further, it may lead to a buildup of records in minority topics.


    To its devices, this discussion leads to broader topics, such as queuing and quality
    of service, and further still, such as economics, politics, and philosophy, which
    are firmly outside the scope of this text. The relative tuning of fetch controls
    can be linked to the redistribution of wealth. It can only be said that the decision
    to favor one group over another (in the context of Kafka’s topic partitioning,
    of course) must stem from the non-functional requirements of the application,
    rather than some hard and fast rule.


    The final configuration property pertinent to this discussion is max.poll.records,
    which sets the upper bound on the number of records returned in a single call
    to poll(). Unlike some of the other properties that control the fetch operation
    on the broker, and akin to the poll timeout,'
