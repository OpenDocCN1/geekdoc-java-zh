    # Network traffic policy


    Speaking to the earlier point on reducing the attack surface, no control is more
    effective than a network-level traffic policy — or as it is more commonly known,
    a firewall.


    > Without burrowing into the details, the defining role of a firewall is to segregate
    traffic between two network segments, such that only legitimate traffic is permitted
    to traverse the firewall. Conversely, illegitimate traffic (which may be malicious
    or accidental) is not permitted to pass through the firewall. Network and transport-level
    controls tend to be simple, straightforward rules that restrict the flow of packets.
    are both efficient and difficult to bypass. Especially when used in conjunction
    with a default-deny policy, one can confidently reason about the behaviour of
    a firewall, and more importantly, verify its behaviour using real and simulated
    traffic.


    This chapter is not going to examine the different firewall types and how one
    would practically configure and maintain a firewall. The technology options and
    physical deployment topologies are just too varied. The physical architecture
    will further be complicated with the introduction of geographical regions or the
    use of multiple redundant hosting locations. Rather than attempting to prescribe
    a physical topology, the intention is to capture the network architecture at a
    logical level.


    At a minimum, the following network partitioning scheme is recommended.'
