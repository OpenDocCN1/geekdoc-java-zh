  md: '# # Chapter 17: Quotas


    There has been a strong emphasis throughout this book on Kafka''s role as a proverbial
    ''glue'' that binds disparate systems. At the very core of the event streaming
    paradigm is the notion of multiple tenancies.


    Chapter 16: Security has set the foundation for multitenancy — delineating how
    clients different roles and objectives can securely connect to, and share broker
    infrastructure — the underlying topics, consumer groups and other resource types.
    Despite the unmistakable overlap between security and quotas, the latter stands
    on its. The discussion on quotas transcends security, affecting areas such as
    quality of service and capacity planning. In saying that, the use of quotas requires
    authentication controls; therefore, Chapter 16: Security is a prerequisite for
    this chapter.


    > The examples in this chapter will not work unless authentication has been enabled
    on the broker and suitable client-side preparations have been made. If you have
    not yet read Chapter 16: Security and worked through the examples, please do so
    before proceeding with the material.


    # ## The rationale denial of service attacks


    # ### Mitigating denial of service attacks


    As it has just said, the discussion on quotas is a logical extension of the ''security''
    topic. At the heart of information security are three primordial concepts, referred
    to as the CIA triad. (Not to be confused with the intelligence agency.) The acronym
    deciphers to confidentiality, integrity and availability — phrased relation to
    information assets. Chapter 16: Security touched on all aspects of CIA triad,
    but focused on confidentiality and integrity, using specific security controls
    such as encryption (TLS), X.509 certificates, authentication (Kerberos, SASL,
    OAuth) and authorization (ACLs). The availability aspect is partly covered by
    the authorization control: by ensuring that parties are only acting in a manner
    that has been prescribed for them, we can protect other parties from unsolicited
    interference.


    The flexibility of Kafka''s rule-based ACLs enables us to apply varying levels
    of assurance to different resources. We might have low-assurance topics collocated
    with high-assurance topics, where a greater number of semi-trusted clients may
    be allowed to access the former, admitting a much more select group of clients
    to the latter. In another scenario, we might be operating a SaaS business, where
    resources are partitioned on a per-customer basis and where it is essential that
    customers cannot access or manipulate each other’s data.'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# Chapter 17: Quotas


    Even with fine-grained ACLs in place, an authorized client with the lowest level
    of access may attempt to monopolise cluster resources with the intent of disrupting
    the operation of legitimate clients. This might be a client with read-only access
    to some innocuous topic. Alternatively, in the SaaS scenario, it may be a low-tier
    customer whose sole intent is to saturate the service provider and thereby cause
    financial harm.


    The mechanism for a denial of service (DoS) attack is fairly straightforward.
    Once a client gains access to a resource, it can generate large volumes of read
    queries or write requests (depending on its level of access), causing network
    congestion, memory pressure and I/O load on the brokers. As these are all finite
    resources, their disproportionate consumption by one client creates starvation
    for the rest.


    Quotas fill the gap left by ACLs, preventing the extent of resource utilisation
    to be accorded to a user. Whose limit has been breached, the brokers will automatically
    activate mitigating controls, throttling a client until its request profile complies
    with the set quota. There are no further penalties to the offending client beyond
    throttling. This is intended, as from a traffic spike, there is nothing to suggest
    that a client is malicious; it may simply be responding to elevated levels of
    demand.


    # Capacity planning


    With multiple clients contending for the use of a common Kafka cluster, how can
    the operator ensure that the finite resources available to the cluster are sufficient
    to meet the needs of its clients?


    This answer leads to the broader topic of capacity planning. This is a complex,
    multi-disciplinary topic that includes elements of measurement, modelling, forecasting
    and optimisation. And it is fair to say that this material is well outside our
    scope. However, the first step of capacity planning is modelling the demand, and
    quotas are remarkably helpful in this regard. If all current and prospective users
    of a cluster have been identified, and each has their quotas negotiated, the aggregate
    ''peak'' demand can be determined. Whether or not the cluster''s resources (disks,
    CPU, memory, network bandwidth, etc.) will be provisioned to cover the worst-case
    demand is a separate matter — the balance of cost and willingness to accept the
    risk of failing to meet demand.


    # Quality of service


    Quality of service (QoS) is strongly related to both the security and capacity
    aspects. QoS focuses on the customer (or the client, in the context of Kafka),
    ensuring that the latter receives a service that meets or exceeds the baseline
    warranted by the service provider. This measure is, in simple terms, a function
    of the provider''s ability to furnish sufficient capacity when it is called for,
    as well as its resistance to DoS attacks.


    QoS naturally dovetails into operational-level agreements (OLAs) — arrangements
    between collaborating parties that influence the consuming party''s ability to
    provide a service to the downstream consumer — ultimately affecting support-level
    agreements (SLAs) at the organisation''s boundary.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# Chapter 17: Quotas


    Without specific QoS guarantees, OLAs cannot be reliably fulfilled — that is,
    in the absence of excessive-over-provisioning of resources. The latter is expensive
    and wasteful; in most cases, it is more economically viable to ration resources
    than to purchase excess capacity, unless the cost of rationing exceeds the cost
    of the resources that are being preserved.


    When operating a small cluster with only a handful of connected clients, the baseline
    capacity is often already in excess of the peak demand, particularly when the
    cluster comprises multiple brokers for availability and durability. In such deployments,
    Kafka''s efficiency provides for ample headroom, and managing quotas may not be
    the most productive use an operator''s time and resources. As the number of clients
    grows and their diversity broadens, the need to manage quotas becomes more


    # Types of quotas


    Kafka supports two types of quotas:


    +   1. **Network bandwidth quotas** — inhibit producers and consumers from transferring
    data above a set rate, measured in bytes per second.

    2. **Request rate quotas** — limit a client''s CPU utilisation on the broker as
    a percentage of one network or I/O thread.


    Quotas (both types) are defined on a per-broker basis. In other words, a quota
    is enforced locally within an individual broker — irrespective of what the client
    may be doing on other brokers. If a client connects to two brokers, it will be
    served the equivalent of two quotas; a multiple of N quotas for N brokers. Even
    though a client may receive multiple of its original quota, it can never exceed
    the original quota limit on any given broker.


    > The addition of quotas to Kafka was one of the earliest proposals, implemented
    within KIP-13³ and released in version 0.9.0. The decision to enforce quotas at
    the broker level rather than the cluster level was due to pragmatism — it seemed
    too complicated to pool resource metrics in real-time from all brokers to determine
    the aggregate consumption and to enforce the combined usage uniformly across all
    brokers. The consensus mechanism for tracking cross-broker resource usage was
    considered to be more difficult to implement the quota enforcement mechanism.
    As such, the simpler solution was chosen instead, and despite numerous iterative
    enhancements, remains per broker to day.


    The application of per-broker quotas suffers from one notable drawback: a client''s
    effective (multiplied) quota dilates with the cluster size. The addition of nodes
    to (meet increased demand or to increase durability) carries with it an increased
    likelihood that a client will connect to more brokers as a result, potentially
    leading to a higher quota multiple. At the same time, it cannot


    *https://wiki.apache.org/confluence/x/cpcWAw'
  merge: -1
  pgno: 347
