  md: "# Chapter 11: Robust Configuration\n\nChapter 10: Client Configuration covered\
    \ all aspects of client configuration in detail. Among other points, it was mentioned\
    \ that when a client is instantiated, it verifies that the supplied configuration\
    \ is valid. In other words, it checks that the given keys correspond to valid\
    \ configuration property names that are supported in the context of that client\
    \ type. Failing to meet this requirement will result in a warning message emitted\
    \ by the configured logger, but the client will still launch. Kafka's cavalier\
    \ approach to configuration raises the following questions: How does one make\
    \ sure that the supplied configuration is valid before launching the client application?\
    \ Or must we wait for the application to be deployed before being told we messed\
    \ something up?\n\n# Using constants\n\nThe most common source of misconfiguration\
    \ is a simple type. Depending on the nature of the mis-elled entry, there may\
    \ be a substantial price to pay for getting it wrong. The example presented in\
    \ Chapter 10: Client Configuration, involving max.in.fetch.per.connection, suggests\
    \ that a mistake may incur the loss of record under certain circumstances. Relying\
    \ on inspecting log files does not inspire a great deal of confidence — the stakes\
    \ are too high. There must be a way of nailing the property names; knowing up-front\
    \ what you give the client actually be used; and knowing early, before any harm\
    \ is done.\n\nKafka does not have a satisfactory answer to this, nor is there\
    \ a Kip in the pipeline that aims to solve this. As a concession, Kafka can manage\
    \ well with constants:\n\n```\nMap<String, Object> config =\nMap.of(ProducerConfig.BOOTSTRAP_SERVERS_CONFIG,\n\
    \  \"localhost:9092\",\n  ProducerConfig.KEY_SERIALIZER_CLASS_CONFIG,\n  StringSerializer.class.getName(),\n\
    \  ProducerConfig.VALUE_SERIALIZER_CLASS_CONFIG,\n  StringSerializer.class.getName(),\n\
    \  ProducerConfig.MAX_IN_FLIGHT_REQUESTS_PER_CONNECTION,\n  1);\n```\n\nIn the\
    \ listing above, property names are replaced with static constants. These constants\
    \ are stable and will not be changed between release versions. So you can be certain\
    \ that property names have not been misspelled if they were embedded in code.\
    \ The last point is crucial, as properties may be loaded from an external source,\
    \ as it is often the case. Constants will guard against this."
