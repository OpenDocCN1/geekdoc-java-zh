  md: '# Chapter 16: Security


    The fourth network segment is everything outside the perimeter, which can simply
    be treated as the external network. In the simplest case, the external network
    is the public Internet. However, this is a relative term. In more elaborate segregation
    topologies, the external segment might still be within the organisation’s perimeter,
    outside the client network. It may be the general-purpose staff network or some
    other corporate intranet. And while in a relative sense, this network might be
    more trusted than the public Internet, its level of assurance is largely classified
    as a ‘walk-in’ network – it should not be allowed to interface directly with the
    technology infrastructure underpinning the revenue-generating systems that operate
    the organisation.


    In addition to the static segments, there may be a case for one or more dynamic
    networks for the client ecosystem that could appear and disappear at short notice.
    A common use is edge computing, where sites may be spun up ‘closer to the action’,
    so to speak, the sites themselves might not be long-lived or may change their
    location. There may be other ways to remotely-deployed applications to Kafka –
    for example, via dedicated APIs. Kafka does not preclude access in some cases
    this may be desirable – the remote site may have a requirement to permit events
    entirely but might not have a local deployment of Kafka at its convenience. Edge
    computing details nicely into Kafka’s authorization controls, although some remote
    sites may have a requirement for technology infrastructure to maintain productivity.


    Perhaps the most common use for remote connectivity is telecommuting. Engineers
    may be working from a variety of locations, which could be a mixture of private
    networks, public network, fixed location and mobile networks. These sites cannot
    be easily controlled and are therefore labelled as untrusted. Nevertheless, telecommuters
    will require first-class access to backend systems and key technology infrastructure
    to maintain productivity. Although some remote sites may be untrusted, the individual
    hosts may still be trusted – for example, a remote worker accessing the corporate
    network over a free Wi-Fi in a cafe.


    Edge locations that require direct connectivity into the core client network are
    best accommodated using secure virtual networks, such as VPNs. Rather than maintaining
    ‘pinhole’ firewall rules that allow access from specific locations based on origin
    networks (which may not always be discernible, particularly if the site is a NAT
    device), a VPN can be used to securely physically separate networks. The sites
    (or individual hosts) would be dispensed digital credentials, which will be used
