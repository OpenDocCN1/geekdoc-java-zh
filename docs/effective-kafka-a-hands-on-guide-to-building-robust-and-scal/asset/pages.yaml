  md: '# Chapter 18: Transactions


    Specifically, when records are published within transaction scope; these records
    are persisted to their target partitions even before the transaction commits (or
    aborts, for that matter). A transaction might span multiple records across disparate
    topics. For transactions to retain the isolation property, it is essential that
    the consumer ecosystem collaborates with the producer and the transaction coordinator.
    This is accomplished by terminating a sequence of records that form part of a
    transaction by a control marker — every partition that is featured within the
    transaction scope.


    All consumers above version 0.11.0.0 understand the notion of control markers;
    however, the way a consumer reacts to a control marker varies depending on the
    consumer''s isolation.level. The default isolation level is read_uncommitted —
    meaning the consumer will disregard the control markers and deliver the records
    as-is to the polling application. This includes records that are part of in-flight
    transactions as well as those records that were part of an aborted transaction.


    To enable transactional semantics on a consumer, the isolation.level must be set
    to read_committed. In this mode, the behavior of the producer changes with respect
    to the offset. Normally, the offsets are equal to the high-water mark — the offset
    immediately following the last successfully replicated record. A transactional
    consumer replaces its offset of ends with the Last Stable Offset (LSO) — the minimum
    of the high-water mark and the smallest offset of any transaction. Under the constraint
    of the LSO, a producer will not be allowed to enter an error in the log that contains
    an open transaction — not until the transaction commits or aborts. In the former,
    the contents of the transaction will be delivered in the result of Consumer.poll().
    In the latter, the records will be silently discarded.


    Having acquired an understanding of how consumers are bound their progression
    through the assigned partitions, it is easy to see why fencing is an essential
    element of transactional messaging. Without fencing measures in place, a producer
    in an open transaction will impede the advancement of the LSO for up to transactional.id.expiration.ms
    — impacting all downstream consumers running with isolation.level=read_committed.


