  md: '# Chapter 14: Data Retention


    intentionally taken offline for long periods; for example, non-production environments.
    Also, it might not be sufficient for systems that need to tolerate longer periods
    of downtime; for example, to account for operational contingencies.


    Compaction is a resource-intensive operation, requiring a full scan of the log
    time it runs. The purpose of the log.cleaner.cleanable.ratio property (and its
    per-topic equivalent) is to throttle compaction, preventing it from running continuously,
    in detriment to the broker''s normal operation. In addition to the cleanable ratio,
    the compactor can further be throttled by applying the log.cleaner.backoff property,
    controlling the amount of time cleaner will sleep between compaction runs, defaulting
    to 15000 (15 seconds). On top of this, the log.cleaner.io.max.bytes.per.second
    property can be used to apply an I/O quota to log cleaner thread, that the sum
    of its read and write bandwidth does not exceed the stated value. The default
    setting is Double.MAX_VALUE, which effectively disables the quota.


    # An example


    To demonstrate the Kafka compaction in action, we are going to create a topic
    named prices with aggressive compaction settings:


    ```

    $KAFKA_HOME/bin/kafka-topics.sh --bootstrap-server localhost:9092 \

    --topic prices --replication-factor 1 --partitions 1 \

    --config cleanup.policy=compact \

    --config delete.retention.ms=100 \

    --config segment.ms=1 \

    --config min.cleanable.dirty.ratio=0.01

    ```


    Normally, making small segment sizes and aggressive cleanable ratios is strongly
    discouraged, as it creates an unnecessarily number of files and leads to heavy
    resource utilization — every new record will effectively mark the partition as
    dirty, instigating compaction. This is done purely for show, with conservative
    strategies the compactor will simply not kick in for our trivial example. (The
    records will be in the active segment, where they will remain out of the compactor’s
    reach.)


    Next, run a console producer:


    ```

    $KAFKA_HOME/bin/kafka-console-producer.sh \

    --broker-list localhost:9092 --topic prices \

    --property parse.key=true --property key.separator=

