    to store all this data? And how would the initial hydration take — having to painstakingly
    replay all records from day zero?


    Even with infinite retention, the naive approach of storing everything would hardly
    be practical — especially for fast-moving data where every entity might be generalised
    by a considerable number of updates over its lifetime. The replay time would grow
    beyond comprehension; we would have ourselves an event store that no one would
