  md: '# Chapter 10: Client Configuration


    restarts. Static members join a group like their dynamic counterparts and receive
    a share of partitions. However, when a static member leaves, the group leader
    preserves the member''s partition assignments, irrespective of whether the departure
    was planned or unplanned. The affected partitions are simply parked; there no
    reassignment, and consequently, the partitions will begin to accumulate lag. Upon
    its return, the bounced member will resume the processing of partitions from its
    last committed point. Static membership aims to lessen the impact of rebalancing
    at the expense of individual partition availability.


    # Heartbeat interval, session timeout, and the maximum poll interval


    The heartbeat.interval.ms, session.timeout.ms, and max.poll.interval.ms properties
    are intertwined, collectively controlling Kafka''s failure detection behaviour.
    This behaviour only applies to consumers operating within a group; free consumers
    are not subject to health checks.


    The topic of failure detection and liveliness of the consumer ecosystem is covered
    in Chapter 15: Group Membership and Partition Assignment. The reader will be advised
    that this topic ranks on the ''gotcha'' spectrum: so much that the incorrect use
    of Kafka''s failure detection capabilities will jeopardise the correctness of
    the system, leading to stalled consumers or state corruption.


    The following is a highly condensed summary of these properties and their effects.


    The heartbeat.interval.ms controls the frequency with which the KafkaClient will
    automatically send heartbeats to the coordinator, indicating that its process
    is alive and can reach the cluster. On its end, the group coordinator will allow
    up to the value of session.timeout.ms to receive the heartbeat; failure to receive
    a heartbeat within the deadline will result in the expulsion of the consumer from
    the group, and the reassignment of the consumer''s partitions. (This is true for
    static and dynamic consumers).


    The max.poll.interval.ms stipulates the maximum delay between successive inversions
    of poll(), enforced by the KafkaConsumer. For dynamic consumers, if the poll-process
    loop fails to poll in time, the consumer will cease to send heartbeats and proactively
    reclaim the group — prompting a rebalance on the coordinator. For static consumers,
    a missed deadline will result in a failed consumer if the latter fails to reappear
    within the session.timeout.ms deadline.


    The table below lists the default values of these properties.


    | Property | Default value |

    | --- | --- |

    | heartbeat.interval.ms | 3000 (3 seconds) |

    | session.timeout.ms | 10000 (10 seconds) |

    | max.poll.interval.ms | 300000 (5 minutes) |


    While the effects of these three properties are abundantly documented and clear,
    the idiosyncrasies of the associated failure recovery apparatus and the implications
    of the numerous edge cases remain a mystery to most Kafka practitioners. For getting
    caught out, the reader is out to study'
