    nIt was stated in Chapter 6: Design Considerations, that exactly-once semantics
    are not possible at the middleware layer without tight-knit collaboration with
    the application. This axiom applies to the general case, where record processing
    events side effects. It is important to appreciate that this statement holds in
    Kafka''s achievements in the area of transactional messaging. The latter solves
    a limiting case of the exactly-once problem; specifically, it eliminates duplicate
    records in a graph of event processing stages, where each stage comprises exclusively
    of pure functions. Once again, there is no ''silver bullet''.


    It should be acknowledged that the exactly-once impossibility dictum does not
    take anything away from Kafka; the release of transactional messaging is not in
    a limited sense. Where the application domain does not fit entirely into the limiting
    case for transactional messaging holds, the reader must take their own measures
    in ensuring idempotence across all affected resources.


    https://wiki.apache.org/confluence/x/ASD8Aw


    For the majority of event-driven applications, the most useful and practical aspect
    of transactional messaging is the idempotence guarantee on the producer. This
    feature utilises the same underlying PID concept and transactional infrastructure,
    ensuring that records do arrive out-of-order on the broker within the timeframe
    allowed by delivery.timeout.ms.


    We have just emerged from one of the most taxing topics in all of Kafka. Transactional
    messaging was introduced in version 0.11.0.0, bringing capabilities to support
    a combination of producer idempotence and end-to-end exactly-once delivery guarantees.


    Transactional messaging improves upon Kafka durability guarantee, adding atomicity,
    consistency and isolation with respect to the production and consumption of records
    in a graph of stream processing applications. When operating within transactional
    scope, processing stages can avoid duplicate records in the output topics — ensuring
    a one-to-one correspondence between the set of input records and the output set.


    The challenges of transactional messaging are largely concentrated in the mapping
    of stage inputs to outputs, by way of a stable transactional ID. The latter identifies
    a logical producer spanning multiple physical producer instances. As partitions
    are reassigned among consumer processes, the transactional ID follows the partition
    assignment, resuming the processing of records and fencing'
