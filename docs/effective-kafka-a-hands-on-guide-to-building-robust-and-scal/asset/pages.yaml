    back to November 2015. ZooKeeper is a highly prized trophy for potential attackers,
    as with znodes (internal data structure used to persist state within ZooKeeper)
    will trivially compromise the entire cluster.


    +   * Connections to Kafka brokers are unencrypted. Connections are established
    over TCP, with the parties exchanging data over a well-documented binary protocol.
    A third party with access to the transit network may use a basic packet sniffer
    to capture and analyse the network traffic, obtaining unauthorized access to information.
    A malicious actor may alter the information in'
