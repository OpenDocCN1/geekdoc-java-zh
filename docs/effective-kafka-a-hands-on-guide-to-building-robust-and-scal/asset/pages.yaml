  md: '# # Chapter 1: Event Streaming Fundamentals


    It is amazing how the software engineering landscape has transformed over the
    last decade. Not long ago, applications were largely monolithic in nature, internally-layered,
    typically hosted within application servers and backed by ‘big iron’ relational
    databases with hundreds or thousands of interrelated tasks. Distributed applications
    were the ‘gold standard’ by those measures coarse-grained deployable units scattered
    among a static cluster of application servers, hosted on a fleet of virtual machines
    and communicating over SOAP-based APIs or message queues. Containerisation, cloud
    computing, elasticity, ephemeral computing, functions-as-a-service, immutable
    infrastructure — all concepts that were just starting to surface, making minor,
    barely perceptible ripples in an architectural institution that was otherwise
    well-settled in its ways.


    That was Then. Today these concepts are commonplace. Engineers are often heard
    interleaving such terms in the same sentence; it would seem the engineering community
    had miraculously stumbled upon upon an elixir that has but cursed of our prior
    burdens — least when it comes to develop velocity, time-to-market, system availability,
    scalability, and just about every other material concern that had kept the engineering
    manager of y awake at night. Today, we have microservices in the cloud. Problem
    solved Next question.


    Except no such event actually occurred. We did not discover a solution to the
    problem; we shifted the problem. Aspects of software development that were used
    to be straightforward in the ‘old world’, such as debugging, profiling, performance
    management, and state consistency — are now an order of magnitude more complex.
    On top of this, a microservices architecture brings its own unique woes. Services
    are more fluid and elastic, and tracking of their instances, their versions and
    dependencies is a Hercule challenge that balloons in complexity as the compound
    landscape evolves. To off, this will fail in isolation, further exacerbated by
    unreliable networks, potentially leaving some activities in a state of partial
    completeness. Given a large system, parts of it may be suffering a minor outage
    at any given point, potentially impacting a subset of users, quite without the
    operator’s awareness.


    With so many moving parts, how does one stay on top of these challenges? How does
    one make the engineering process sustainable? Should we just write off the metamorphosis
    of the recent decade as a failed experiment?


    # ## The real challenges of distributed systems


    If there is none to be learned from the opening gambit, it is that there is no
    ‘silver bullet’. Architectural paradigms are somewhat like design patterns, but
    broader, more subjective,'
