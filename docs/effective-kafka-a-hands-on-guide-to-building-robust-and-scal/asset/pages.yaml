  md: "# Chapter 16: Security\n\nThe version of ZooKeeper (3.5.6) bundled with the\
    \ latest Kafka version (2.4.0 at the time of writing) does not enforce authentication\
    \ — only authorization. A client can connect without presenting any credentials\
    \ — its session will be associated with the world scheme. Although we can't block\
    \ unauthenticated connections, we can limit their level of access using znode\
    \ ACLs. In effect, this how ZooKeeper restricts unauthenticated connections —\
    \ it accepts the connection but restricts its further actions.\n\nEnable authentication\
    \ on a ZooKeeper ensemble that has already been confined to a segregated network\
    \ seems excessive. In some ways, it is the security of information assets can\
    \ be compounded almost indefinitely until the usability of the system is crippled\
    \ by legitimate users. At which point are: *Have we just made the system less\
    \ secure by blurring the line between legitimate and illegitimate users?*\n\n\
    The answer to this is subjective, and really depends on several factors, such\
    \ as existing security controls, the nature of the industry and level of regulation,\
    \ existing organisational security policies and guidelines, the likelihood of\
    \ a breach and the cost of mitigation. The following subsections include examples\
    \ for enabling ZooKeeper authentication for new and existing clusters; however,\
    \ the rest of the chapter and the book will assume that ZooKeeper authentication\
    \ is disabled.\n\n# Enable authentication on ZooKeeper\n\nZooKeeper supports a\
    \ different set of SASL methods compared to what Kafka offers its clients; nonetheless,\
    \ the basic principles are the same. Like Kafka, ZooKeeper uses JAAS for configuration.\n\
    \nCreate a new file named zookeeper_jaas.conf in the $KAFKA_HOME/config directory,\
    \ with the contents below. The admin username will be zkadmin. Replace the value\
    \ zkadmin-secret with a secure password for authenticating ZooKeeper.\n\n```\n\
    Server {\n  org.apache.zookeeper.server.auth.DigestLoginModule required\n  user_zkadmin=\"\
    zkadmin-secret\";\n}\n```\n\nMake sure the file is world-readable:\n\n```\nchmod\
    \ 600 $KAFKA_HOME/config/zookeeper_jaas.conf\n```\n\nEdit zookeeper.properties,\
    \ adding the following configuration:"
