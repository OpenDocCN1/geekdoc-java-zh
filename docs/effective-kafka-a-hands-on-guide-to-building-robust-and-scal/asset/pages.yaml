    # Chapter 15: Group Membership and Partition Assignment.


    # Auto offset reset


    The `auto.offset.reset` property stipulates the behaviour of the consumer when
    no prior committed offsets exist for the partitions that have been assigned to
    it, or if the specified offsets are invalid.


    From the perspective of a consumer acting within an encompassing group, the absence
    of valid offsets may be observed in three scenarios:


    +   1. When the group is initially formed and the lack of offsets is to be expected.
    This is the most intuitive and distinguishable scenario and largely self-explanatory.

    2. When an offset for a particular partition has not been committed for a period
    of time that exceeds the configured period of the `__consumer_offsets` topic,
    and where the most recent offset record has subsequently been truncated.

    3. When a committed offset for a partition exists, but the location it points
    to is no longer valid.


    To elaborate on the second scenario: in order to commit offsets, a consumer will
    send a message to the group coordinator, which will cache the offsets and also
    publish the offsets to an internal topic named `__consumer_offsets`. Other than
    being an internal topic, there is nothing special about it behaves like any other
    topic in Kafka, meaning that it will eventually start shedding old records. The
    offsets topic has its retention set to seven days by default. This is configurable
    via the `offsets.retention.minutes` broker property. After this time expires,
    the records become eligible for collection


    > Prior to Kafka 2.0, the default retention period of `__consumer_offsets` was
    24 hours, which confusingly not aligned with the default retention period of seven
    days for all other topics. This used to catch out unsuspecting users; keeping
    a consumer for a day was all it took to lose all to offsets. One could wrap their
    work on a Friday, come back on the Monday and occasionally find their offsets
    had been reset. Because records are not immediately purged, they become candidates
    for truncation. The truncation happens when a log file is closed, which cannot
    be easily predicted as it depends on the amount of data that is written to the
    topic. KIP-186 addressed this issue for release 2.0.


    The third scenario occurs as a result of runtime truncation, with a condition
    where at least one offset refers to the truncated range. This may happen when
    the topic in question has shorter retention than the `__consumer_offsets` topic
    — such as, the consumer offsets outlive the data residing at those offsets.


    The offset reset consideration is not limited to consumer groups. A *free consumer*
    — one that is operating without an encompassing consumer group — can experience
    an invalid offset during a


    *https://wiki.apache.org/confluence/display/AFKA/KIP-186%3A+Increase+offsets+retention+default+to+7+days'
