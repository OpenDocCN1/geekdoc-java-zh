  md: '# Chapter 10: Client Configuration


    167


    The RoundRobinPartitioner will forward the record to a user-specified partition
    if one is set; otherwise, it will indiscriminately distribute the writes to all
    partitions in a round-robin fashion, regardless of the value of the record''s
    key. Because the allocation of unkeyed records to partitions is nondeterministic,
    it is entirely possible for records with the same key occupy different partitions
    and be processed out of order. This partitioner is useful when an event is not
    subject to ordering constraints, in other words, when Kafka is a proverbial ''firehose''
    of unrelated events. Alternatively, this partitioner may be used when the consumer
    ecosystem has its mechanism for reassembling events, which is independent of Kafka''s
    native partitioning scheme.


    The UniformStickyPartitioner is a pure implementation of KIP-480 that was introduced
    in Kafka 2.4.0. This partitioner will forward the record to a user-specified partition
    if one is set; otherwise, it will ignore the key, and instead assign ''sticky''
    partitions numbers to the current batch.


    > One ''gotcha'' with partitioners liers in them being a producer-side concern.
    The broker has no awareness of the partitioner used, it defers to the producer
    to make this decision for each submitted record. This assumes that the producer
    ecosystem has a single partitioning scheme and is applying it uniformly. Naturally,
    if reconfiguring the producers to use an alternate partitioner, one must ensure
    that this change is rolled out atomically—there cannot be two or more producers
    concurrently operating with different partitioners.


    One can implement their own partitioner, should the need for one arise. Perhaps
    you are faced with a bespoke requirement to partition records based on the contents
    of their payload, rather than the key. While a custom partitioner may satisfy
    this requirement, a more straightforward approach would be to concatenate the
    attributes of the payload into a synthetic key, so that the default partitioner
    can be used. (It may be necessary to pre-hash the key to cap its size.)


    # Interceptors


    The interceptor.classes property enables the application to intercept and potentially
    mutate records on route to the Kafka cluster, just prior to serialization and
    partition assignment. This is empty by default. The application can specify one
    or more interceptors, as a comma-separated list of org.apache.kafka.clients.producer.ProducerInterceptor
    classes. The ProducerInterceptor interface is shown below, with the Javadoc comments
    removed for brevity.


    ![](img/a4d2c17b478048c90e0b48be89cde5c1_173_0.png)


    22https://wiki.apache.org/confluence/display/KAFKA/KIP-480%3A+Sticky+Partitioner'
