    The very point of fencing is to eliminate these sorts of scenarios, but for fencing
    to function correctly, the producer''s session must somehow relate back to the
    input source. This is a confession be made: the issue isn''t just with the transactional
    ID assignment scheme, but with the internal architecture of the processing stage.
    In the original example, we used a pair of clients — a consumer and a producer
    — in a back-to-back arrangement. A process would work for all assigned partitions
    in the input set, via a single consumer instance. It would then publish a record
    (or multiple records) to an arbitrary output partition via single, long-lived
    producer instance.


    Before continuing with the transactional ID conundrum, we need to rework the internal
    architecture of the processing stage. Let the singleton consumer be, but replace
    the singleton producer with a collection of producers — one for each assigned
    partition in the input set. The assignment of partitions is subject to change,
    which can be accommodated by registering a ConsumerRebalanceListener. When a partition
    is assigned, create and initialise a producer instance; when a partition is revoked,
    dispose of the producer instance. When publishing an output record, always use
    the producer instance that corresponds to the partition index of the input record.
    The diagram below illustrates this internal topological arrangement.


    ![](img/a4d2c17b478048c90e0b48be89cde5c1_381_0.png)


    # Pinned producers


    > The number of partitions in the input topic(s) might be in the hundreds or thousands;
    spawning a producer instance for each conceivable topic-partition is wasteful,
    entails a potentially significant connection establishment overhead, in addition
    to utilising memory (buffers), file handles and OS-level threads. Thus, reducing
    the producer clients to the set of assigned partitions is the preferred approach.
    Furthermore, the producer instances may be lazily realised — amortising the overhead
    from the point of partition assignment to points of the first read from each input
    topic-partition.'
