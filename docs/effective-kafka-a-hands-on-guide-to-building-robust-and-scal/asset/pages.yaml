    In our example, the consumer offset recorded for each partition is the same as
    the respective high-water mark. The consumer lag is zero for each column. This
    is the difference between the committed offset and the high-water mark. When the
    lag is zero, it means the consumer has worked through the entire backlog of records
    for the partition; in other words, the consumer has caught up to the producer.
    Lag may vary between partitions — the busier the partition, in terms of record
    throughput, the more likely it will accumulate lag. The aggregate lag (also known
    as the combined lag) is the sum of all individual per-partition lags.'
