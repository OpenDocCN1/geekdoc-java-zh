  md: '# Chapter 8: Bootstrap and Advertised Listeners


    The challenge boils down to this: How does a client discover the Kafka cluster?
    A naive solution would have required us to explicitly configure the client with
    the complete set of individual addresses of each broker node. Establishing direct
    connections would be trivial, but the solution would not scale to a dynamic cluster
    topology; adding or removing nodes from the cluster would require a reconfiguration
    of all clients.


    The solution that Kafka designers went with is based on a directory metaphor.
    Rather than being the broker addresses, clients look up the cluster metadata in
    a directory in the first phase in the bootstrapping process, then establish direct
    connections to the discovered brokers in the second phase. Rather than coming
    up with moving parts, the role of the directory is conveniently played by each
    of the brokers. Since brokers are intrinsically aware of one another via ZooKeeper,
    every broker is able to impart this view of cluster metadata onto a request. Still,
    the brokers might change, which contradicts the notion of a ''stable'' directory.
    To counteract this, clients are configured with a bootstrap list of broker addresses
    that only needs to be partially accurate. As long as an address in the bootstrap
    list points to a live broker, the client will learn the entire topology.


    # Taking advantage of DNS


    You would be right in thinking that this model feels brittle. If we recycle all
    brokers in a cluster? What if the brokers are hosted on ephemeral instances in
    the Cloud and may come and go as they please, with a new IP address each time?
    The bootstrap list would soon become useless. Aren''t we just kicking the ''reconfiguration''
    down the road?


    While there is no official response to this, the practice adopted in the community
    is to use a tier of DNS entries. Suppose we have an arbitrarily-sized cluster
    that could be recycled on demand. Each broker would be assigned an IP address
    and like an auto-generated hostname, both being ephemeral. To complement the directory
    metaphor, we create a handful of well-known canonical CNAME or A records with
    a minimal TTL, pointing to the IP addresses or the hostnames of a subset of our
    broker nodes. The fully-qualified domain names of new DNS entries might be like


    +   - broker0.ext.prod.kafka.mycompany.com.

    - broker1.ext.prod.kafka.mycompany.com.

    - broker2.ext.prod.kafka.mycompany.com.


    The clients would only be configured with the list of canonical bootstrap addresses.
    Every address-impacting broker change would entail updating the canonical DNS
    entries; but it''s easier to keep DNS up to date, to ensure that all clients (where
    there could be hundreds or thousands) are correctly configured. Furthermore, DNS
    entries can easily be tested. One could implement a trivial ''canary'' app that
    periodically connects to the brokers on one of the canonical addresses to verify
    their availability. This way we would soon learn when something untoward happens,
    before the issue escalates to the point of an all-out failure.'
