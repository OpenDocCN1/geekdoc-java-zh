  md: 'Once more, we revert to outside strategies for dealing with partition exclusivity.
    There are three at our disposal:


    +   1. Ensure that the poll loop always completes within the progress deadline
    set by max.poll.interval.ms, thereby sidestpping the problem.


    +   2. Employ an external fencing mechanism for dealing with critical sections.


    +   3. Employ fencing at the process level, terminating the outgoing process,
    or isolating it from the outside world. This may be used in addition to #2.


    The first strategy has already been covered in the previous section. It tries
    to avoid a deadline overrun by either yielding the subscription, shedding the
    load, or requeuing records. It is not a universal strategy, in that it has drawbacks
    and might not apply in all cases.


    The second strategy relies on an external arbitration mechanism — typically a
    distributed lock manager (DLM) — used to ensure exclusivity over a critical section.
    Before processing a record, the consumer process would attempt to acquire a lock
    with the DLM, proceeding only upon successful acquisition. The name of the lock
    can be derived from the record''s key or the partition number. This aligns critical
    sections to partitions and ensures that only one consumer may operate within a
    critical section at any one time; however, it does not preclude the record from
    being processed multiple times, as the two consumers may have handled the record
    at different, non-overlapping times. This is illustrated in the sequence diagram
    below.'
  merge: -1
