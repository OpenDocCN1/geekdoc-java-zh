  md: '# Chapter 17: Quotas


    request rates in absolute percentage terms (i.a. a fraction of one core) is that
    it pins the quota values, preventing the quotas from inadvertently dilating with
    the scaling of a broker''s resources. For example, if the broker instance were
    to undergo a hardware refresh to quadruple the CPU cores, the absolute quotas
    would not be affected. Had the quotas been expressed in relative terms (i.a. a
    fraction of all cores), all request rate quotas would have been implicitly dilated
    by a factor of four. Note, the dilation-resistance of request rate quotas only
    applies to scaling in the vertical plane; in other words, when a broker''s processing
    capacity is increased. When scaling horizontally — through the addition of broker
    nodes — the request rate quotas suffer from the same dilation effect that we saw
    with bandwidth quotas.


    > The main drawback of restating absolute values is that it requires the operator
    to be aware of the available capacity — the num.threads and network.threads broker
    properties configured, as in Chapter 9: Broker Configuration, can also be changed
    remotely. Due attention should be paid to the contents of server.properties and
    the dynamic configuration; otherwise, the quotas may end misconfigured — dispensing
    a different amount of resources to what was intended.


    # Subject affinity and precedence order


    Quotas apply to two entity types: user principals and client IDs. The reader should
    now be familiar with users, which were covered in detail in Chapter 16: Security.
    Users are the subjects of authentication and authorization controls. A client
    ID is an optional, free-form logical identifier of a client connection, configured
    via the client.id client-side property. Client IDs allow Kafka to distinguish
    between variations of a client and are orthogonal to usernames.


    Unlike usernames, whose use is policed by Kafka’ authentication machinery, arbitrary
    client IDs can be presented at the discretion of the client. Client IDs may be
    used to further categorise clients that operate under a single username. Perhaps
    an application cises multiple discrete processes that share the same Kafka credentials.
    These processes may be designated different tasks, which carry out on behalf of
    the encompassing application. When the multiple different but related processes
    connect to Kafka, it is prudent to distinguish among them — maintaining fine-grained
    accounting and traceability of client actions.


    Quotas are defined for either usernames or client IDs individually, or may cover
    a combination of the two. There are a total of eight ways a quota may be associated
    with its subject, depicted in the table below. Additionally, the table captures
    the precedence order of each association, with the lowest number corresponding
    to the highest priority.'
