  md: '# # Chapter 4: Installation


    Previous chapters have given us a reasonably grounded understanding of what Kafka
    is and isn’t, where it is used, and how dovetails into the rest of the software
    landscape. So far we have just been circling the shore; time to dive in for a
    deeper look. Before we can get much further, we need a running Kafka setup.


    This requires us to install several things:


    +   1. **Kafka and ZooKeeper**. Recall from our earlier coverage of the Kafka
    architecture, a function-setting requires both Kafka and ZooKeeper nodes. These
    are plain Java applications with no other requirements or dependencies, and can
    run on any operating system and any hardware supported by Java.

    2. **Kafkadrop**. While this is not strictly required to operate Kafka, Kafkadrop
    is the most widely-used web-based tool for working with Kafka, and would be widely
    considered as an essential item of your Kafka toolkit.

    3. **A Java Development Kit (JDK)**. Kafka is part-written in Scala and part in
    Java, and requires Java version 8 or newer to run. Kafkadrop is more modern, requiring
    Java 11.


    If you haven''t done so already, install a copy of the JDK. Version 11 or newer
    will do. The rest of the chapter assumes that you have a JDK installed.


    > The requirement for JDK 11 is to accommodate Kafkadrop. If you are installing
    Kafka on its own, JDK 11 is still recommended over Java 8 as it is the current
    Long-Term Support (LTS) version. The last free updates of JDK 8 have ended in
    January 2019. Free updates for JDK 11 will continue through September 2021, by
    which the point would have transitioned to JDK 17 LTS. (LTS releases) are publicly
    supported for three years.


    # # Installing Kafka and ZooKeeper


    There are at four avenues at one’s disposal installing Kafka and ZooKeeper:


    +   1. Run Kafka and ZooKeeper using Docker.

    2. Install Kafka and ZooKeeper using a package manager, such as DNF (formerly
    known as YUM) for RedHat, CentOS and Fedora Linux distributions, APT for Debian
    and Ubuntu, and Homebrew for macOS. There are many others.'
  merge: -1
