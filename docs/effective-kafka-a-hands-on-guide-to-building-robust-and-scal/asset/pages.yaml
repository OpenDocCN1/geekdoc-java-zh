  md: '# # Chapter 10: Client Configuration


    Some of the previous chapters have gotten us well underway in publishing and consuming
    records, without dwelling on the individual client properties. This is a good
    time to take a brief detour and explore the world of client configuration.


    In contrast to broker configuration, with its dynamic update modes, selective
    updates, and baffling CLI tools, configuring a client is *comparatively straightforward*
    — in that client configuration is static and *mostly applies to the instance being
    configured. (There are a few exceptions). However, client configuration is significantly
    more nuanced — requiring a greater degree of insight on the user''s behalf.


    This chapter subdivides the configuration into producer, consumer, and admin settings.
    Some configurable items are common, and have been extracted into their own section
    accord. The reader may consult this chapter in the online documentation, available
    at kafka.apache.org/documentation*. However, the analysis presented here is much
    more in-depth, covering material that is not readily available from official sources.


    Of the numerous client configuration properties, there are several dozen that
    relate to performance tuning and varying esoteric connection-related behaviour.
    The primary focus of this chapter is to cover properties that affect the client
    functionally, or qualitatively impact any of the guarantees that may be taken
    for granted. As a secondary objective, the chapter will outline the performance
    implications of the configuration where the impacts are material or at least perceptible,
    but the intention is not to cover performance in fine detail — the user may want
    to defer to specialised texts for a finer level of analysis. Other chapters will
    also cover aspects of Kafka’s performance in more detail.


    # ## Configuration gotchas


    Client configuration is arguably more crucial than broker configuration. Broker
