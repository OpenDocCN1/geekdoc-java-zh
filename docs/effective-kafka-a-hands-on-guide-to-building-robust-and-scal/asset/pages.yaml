    reduced, compared to the bespoke process of managing self-signed certificates.
    In addition, selfsigned certificates increase the likelihood of them being intercepted
    and moved in route, which also erodes the trust one may place in self-signed certificates.


    For the upcoming examples, we are going to generate our own CA for signing certificates.
    Naturally, we would have proceeded with a complete PKI scenario, but in practice,
    the choice of PKI Technology elements and their deployment options will be independent
