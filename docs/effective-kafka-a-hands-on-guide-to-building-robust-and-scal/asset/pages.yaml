  md: '# Deleting offsets


    Another method of resetting the offsets is to delete the offsets altogether, shown
    in the example below. This is, in effect, a lazy form of reset — the assignment
    of new offsets does not occur until a consumer connects to the cluster. When this
    happens, the auto.reset client property will stipulate which the offset should
    be reset to either the earliest or the latest.


    ```

    $KAFKA_HOME=/bin/kafka-consumer-groups.sh \

    --bootstrap-server localhost:9092 \

    --topic getting-started --group cli-consumer --delete-offsets

    ```


    # Deleting a consumer group


    Deleting a consumer group erases all persistent state associated with it. This
    is accomplished by passing the --delete flag to the kafka-consumer-groups.sh CLI,
    as shown below.


    ```

    $KAFKA_HOME=/bin/kafka-consumer-groups.sh \

    --bootstrap-server localhost:9092 \

    --group cli-consumer --delete

    ```


    Deleting the consumer group is equivalent to deleting offsets for all topics and
    partitions.


    # A basic Java producer and consumer


    A CLI is a great place to start, and can be driven programmatically from a shell
    script. But this is more of a convenience; an automation of repetitive functionality,
    if you will. Any serious streaming application will employ a high-level language
    such as Java, C, or Python to implement the business logic required to publish
    records and to react to events emitted by other applications.


    # Client libraries


    Unlike the built-in CLI, which relies on the power of binaries and a pre-installed
    Java runtime, applications rely solely onable client libraries. These are available
    for just about every programming language under the sun, from the mainstream to
    the esoteric.


    In this book, we are going to focus solely on the Java ecosystem — among the most
    popular mainstream software development environments and the ''home turf'' of
    Kafka and many related event technologies. The Java client implementation is the
    most mature of the available client libraries, developed alongside and at the
    same cadence as the Kafka broker. Other languages will have similar clients; they
    are maintained independently of Kafka and feature varying level of feature support
    and stability. Be in mind, that these libraries will slightly lag the mainstream
    Kafka releases in terms of feature sets; if you are after a ''bleeding edge''
    capabilities, you will be served by the Java client library and, to a marginally
    lesser extent, the C library — librdkafka, maintained by Magnus Edenhill.'
