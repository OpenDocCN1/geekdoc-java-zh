  md: '# # Chapter 13: Replication and Acknowledgements


    Fundamentals, Apache Kafka is a distributed log-centric data store. Data is written
    across multiple nodes in a cluster and may be subject to a range of contingencies
    — disk failures, intermittent timeouts, process crashes, and network partitions.
    How Kafka behaves in the face of a contingency and the effect this has on the
    published data should be of material concern to the designer of an event-driven
    system.


    This chapter explores one of the more nuanced features of Kafka — its replication
    protocol.


    # ## Replication basics


    The deliberate decisions made during the design of Kafka ensure the cluster will
    be both durable and available — meaning that it will survive failures of broker
    nodes and will be accessible to clients. The replication protocol is the specific
    mechanism by which this is achieved.


    As was stated in Chapter 3: Architecture and Core Concepts, the fundamental unit
    of streaming in Kafka is a partition. For all intents and purposes, a partition
    is replicated. The basic premise of a replicated log is straightforward: data
    is written to multiple replicas so that the failure of one replica does not lose
    the data. Furthermore, replicas must agree with themselves with respect to the
    contents of the replicated log — reflecting their local facsimile of the log.
    It would be unacceptable for one (or more replicas) to differ in their contents
    in some conflicting manner, as this would lead to data corruption. Broadly speaking,
    this notional agreement among the replicas is referred to as distributed consensus,
    and is one of the basic challenges faced by the designers of distributed systems.


    There are several approaches to implementing a distributed log: the one by Kafka
    follows a leader-follower model — a single leader is assigned by the cluster coordinator
    to take absolute mastery of the partition, with zero or more followers that tail
    the data written by the leader in near real-time, progressively building their
    own copies of the log. Putting it another way, replication in Kafka is asynchronous:
    replicas lag behind the leader, converging on its state when the traffic flows
    from the leader. Consensus is formed by ensuring that only one party changes to
    the log; all other parties implicitly agree by unconditionally replicating changes
    from the leader, achieving sequential consistency. Under this model, replicas
    can only vary in a contiguous segment comprising the last few records in the log
    — they cannot have gaps, nor can two replicas have different records at the same
    position in the log. This model vastly simplifies the consensus protocol, but
    some level of agreement is required nevertheless, because'
