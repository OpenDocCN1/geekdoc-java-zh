    in Chapter 8: Bootstrapping and Advertised Listeners. The property is optional,
    accepting an enumerated constant from the list below.


    +   - default: Retains legacy behaviour with respect to DNS resolution, in other
    words, it will resolve a single address for each bootstrap endpoint being the
    first entry returned by the DNS query. This option applies both to the bootstrap
    list and the advertised hosts disclosed in the cluster metadata.

    - resolve_canonical_bootstrap_servers_only: Detects aliases in the bootstrap list,
    expanding to a list of resolved canonical names using a reverse DNS lookup. This
    option was introduced in Kafka 2.1.0 as part of Kip-2357, to properly support
    secured connections using Kerberos authentication. This behaviour applies to the
    bootstrap list only; the advertised hosts are treated conventionally, as per the
    default option.

    - use_ai_dns_ips: Supports multiple A records for the fully-qualified domain name,
    resolving all hosts for each endpoint in the bootstrap list. The client will try
    each host in turn until a successful connection is established. This was introduced
    in Kafka 2.1.0 as part of Kip-302, and applies to both the bootstrap list and
    the advertised hosts.


