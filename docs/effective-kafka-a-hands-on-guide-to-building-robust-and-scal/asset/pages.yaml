  md: '# Chapter 15: Group Membership and Partition Assignment


    Kubernetes, due to its overwhelming popularity, is often quoted as a ubiquitous
    ''placeholder'' for any control system that takes on additional health assurance
    responsibilities. When ''Kubernetes'' is written in quotes, in the preceding instance,
    one should assume that the conversation relates to any control system.


    In the ''Kubernetes'' deployment model, a container may be terminated spuriously
    as a result of a failed health check, only to be restarted shortly afterwards.
    It would be highly advantageous for the partitions assigned to the failed consumer
    to remain as such, with no intermediate reassignment, until the consumer rejoins.
    The model avoids a stop-the-pause at the expense of individual partition availability
    — one or more partitions (depending on the failed consumer''s assignment) will
    remain for some time. This may result in greater overall throughput and more pronounced
    positive skew in the distribution of response times — lower median latencies at
    the expense of a longer latency timeout.


    Under the static model, members are allowed to leave and join a group without
    forfeiting their partition assignment or causing a rebalance, providing that they
    are not away for longer than the session.timeout.ms deadline; failing to rejoin
    within the heartbeat deadline causes a purge, triggering a subsequent rebalance.
    There is no material difference in the behaviour between the static and dynamic
    protocols from the coordinator''s perspective.


    Naturally, if one is using an external orchestrator for managing consumer health,
    it makes sense to desensitize the coordinator''s own health check mechanism to
    prevent a premature expulsion of the bounced consumer, but still allow the coordinator
    to act as a ''safety net'' if the orchestrator does not detect and remediate the
    process failure in a timely manner. This can be achieved by setting the session.timeout.ms
    max.poll.interval.ms deadline would also be elevated accordingly.


    The effect of max.poll.interval.ms differs under the static group membership scheme.
    The KafkaConsumer will be kicked if the deadline is not met by the process loop,
    no further action will be taken — namely, the coordinator will not send a request
    and no reassignment will occur. The static consumer process will be given until
    session.timeout.ms. If no heartbeat is received within the session.timeout.ms
    deadline, only then will the coordinator evict the failed consumer and reassign
    its partitions. In the course of introducing the static membership feature, the
    hard upper bound on session.timeout.ms was increased to 1800000 (30 minutes).


    With the additional consumer health management options offered by static group
    membership, one might wonder whether this changes the liveness and safety landscape.
    The somewhat grim answer is: not by lot


    The liveness property is fundamentally satisfied by identifying consumer failures.
    Whether the failure is identified by the coordinator or by an external process
    is mostly an implementation detail. A static model may reduce the impact of imperfect
    failure on the group, at the expense of individual partition stalls.'
