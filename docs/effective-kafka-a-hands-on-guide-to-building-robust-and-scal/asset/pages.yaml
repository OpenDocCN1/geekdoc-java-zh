    The Configurable super-interface enables classes instantiated by reflection to
    take configuration parameters:


    ```

    public interface Configurable {

    void configure(Map<String, ?> configs);

    }

    ```


    Interceptors act as a plugin mechanism, enabling the application to inject itself
    into the publishing (and acknowledgement) process without directly modifying the
    application code.


    This naturally leads to a question: Why would anyone augment the publisher by
    obscurity-configured interceptors, rather than modifying the application code
    to address these additional behaviours directly in the application code?


    Interceptors add an Aspect-Oriented Programming (AOP) style to modelling producer
    behaviour, allowing one to uniformly address cross-cutting concerns at independent
    producers in a manner that is modular and reusable. Some examples demonstrate
    the viability of AOP-style interceptors include:


    +   - Accumulation of producer metrics — tracking the total number of records
    published, by category, etc.

    - End-to-end tracing of information flow through the system - using correlation
    headers present in records to establish graph traversal of messages through the
    relay applications, identifying each intermediate junction and the timings at
    each point.

    - Logging of entire record payloads or a subset of the fields in a record.

    - Ensuring that outgoing records comply with some schema contract.

    - Data leak prevention — looking for potentially sensitive information in records,
    such as credit card numbers or JWT bearer tokens.


    Once defined and tested in isolation, this behaviour could then be encompassed
    in a shared library and applied to any number of producers.


    There are several caveats to implementing an interceptor:'
