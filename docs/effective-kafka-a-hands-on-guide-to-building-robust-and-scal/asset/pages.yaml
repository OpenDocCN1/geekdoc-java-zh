    completeness.


    The more commonly use case is when a stateless or ephemeral consumer needs to
    monitor a topic. For example, an application might tag a topic to identify records
    that were published during a monitoring or debugging aid. One might only care
    about records that were published when the stateless consumer was online, so concerns
    such as persisting offsets and resuming from the last processed record become
    largely irrelevant. A good example of where this is used routinely is the Kafkadrop
    tool, which we will explore in the upcoming chapters. When the user clicks on'
