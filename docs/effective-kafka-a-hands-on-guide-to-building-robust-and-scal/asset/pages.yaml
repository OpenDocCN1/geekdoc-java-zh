  md: '# Chapter 8: Bootstrapping and Advertised Listeners


    +   - PLAINTEXT: Plaintext TCP connection without principal authentication.

    - SSL: TLS connection without authentication.

    - SASL_PLAINTEXT: Plaintext connection with SASL (Simple Authentication and Security
    Layer) to authenticate users principals.

    - SASL_SSL: The combination of TLS for transport-security and SASL for user authentication.


    To map a listener to a security protocol, uncomment the `listener.security.protocol.map`
    property and add the new name. The mapping will be in the form `<listener protocol
    name>:<security protocol name>`.


    > The listener name is a major source of confusion among first-time Kafka users.
    There is a misconception, and surprisingly so, that PLAINTEXT at the listener
    level relates to the encryption scheme (or lack thereof). In fact, the listener
    protocol names are completely arbitrary. And it is good practice to assign them
    meaningful names, a listener URI DONALD_DUCK:9092 is perfectly valid, provided
    that DONALD_DUCK has a corresponding mapping in `listener.security.protocol.map`,
    e.g. DONALD_DUCK:SASL_SSL.


    In specifying a socket listener in listeners, you need to state how the listener
    is advertised to producer and consumer clients. In the form of `<listener protocol>::<advertised
    host name>:<advertised port>`. Returning to our earlier example, we would like
    the first broker to be advertised on `10.10.0.1:9092`. So we would use `server.properties`
    to the tune:


    ```

    advertised.listeners=PLAINTEXT:10.10.0.1:9092

    ```


    Note: There was no need to change listeners or `listener.security.protocol.map`
    because we didn''t introduce a new listener; we simply changed the existing listener
    is advertised. In a multi-broker setup, we would make similar changes to the other
    brokers.


    > Don''t forget to restart Kafka after changing any values in `server.properties`.


    How this fix bootstrapping? The client will still connect to a random host specified
    in the bootstrap list. This, the client metadata returned by the host will contain
    the client-reachable addresses and port numbers of broker nodes, rather than a
    set of `localhost:9092` entries. Now the client is to establish direct connections,
