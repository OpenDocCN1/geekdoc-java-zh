    # Compression type


    The compression type controls the algorithm that the producer will use to compress
    record batches before forwarding them to the partition leaders. The valid values
    are:


    +   - none: Compression is disabled. This is the default setting.

    - gzip: Use the GNU Gzip algorithm — released in 1992 as a free substitute for
    the proprietary compress program used by early UNIX systems.

    - snappy: Use Facebook''s Snappy compression format – optimised for throughput
    at the expense of compression ratios.

    - lz4: Use the LZ4 algorithm — also optimised for throughput, most notably for
    the decompress speed.

    - zstd: Use Facebook''s ZStandard — a newer algorithm introduced in Kafka 2.1.0,
    intended to achieve an effective balance between throughput and compression ratios.


    This topic is discussed in greater detail in Chapter 12: Batching and Compression¹⁸.
    To summarise, compression may offer significant gains in network efficiency. It
    reduces the amount of disk I/O and storage space taken up on the brokers.


