  md: 'topic to view the records, Kafdrop creates a free consumer and assigns the
    requested partition to it, reading the records from the supplied offsets. Navigating
    to a different topic or partition will reset the consumer, discarding any prior
    state.


    One scenario that benefits from free consumers is the implementation of the sync-over-async
    pattern using Kafka. For example, a producer might issue a command-style request
    (query) to a downstream consumer and expect a response on the same or different
    topic. might be operating in a synchronous context; for example, it might be responding
    to a synchronous request of its own, and so it has no choice but wait for the
    downstream response before proceeding. To complicate matters, there might be multiple
    initiators in operation, and it is essential that the response is processed by
    the same initiator that issued the original request.


    The sync-over-async scenario is a special case of the stateless consumer scenario
    presented above. The initiator starts by assigning itself all partitions of the
    response topic and resetting the offsets to the high-water mark. It then publishes
    the request command with a unique identifier that will be echoed in the response.
    (Typically, this is a UUID). The downstream consumer will eventually process the
    message and publish its response. Meanwhile, the initiator will poll the topic
    for responses, filtering by ID. Eventually, either the response will arrive within
    a set deadline, or the initiator will time out. Either way, the assignment of
    the partitions to the initiator is temporary, and no state is preserved between
    successive assignments.


    # Summary of core concepts


    The illustration below outlines the relationship between the core concepts presented
    in this chapter, including entities such as the cluster, broker nodes, producers,
    topics, partitions, syncconsumers, and consumer groups.'
