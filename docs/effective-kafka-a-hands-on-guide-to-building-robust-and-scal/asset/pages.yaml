    # # Log shipping


    ![](img/a4d2c17b478048c90e0b48be89cde5c1_19_0.png)


    While sounding similar to log aggregation, the shipping of logs is a vastly different
    concept. Essentially, this involves the real-time copying of journal entries from
    a master data-centric system to one or more read-only replicas. Assuming stage
    changes are fully captured as journal records, replaying those records allows
    the replicas to accurately mimic the state of the master, albeit with some lag.


    Kafka''s optional ability to partition records within a topic to create independent,
    causality ordered sequences of events allows for replicas to operate in one of
    sequential or causal consistency models — depending on the chosen partitioning
    scheme. The various consistency models were briefly covered inChapter 1: Event
    Streaming Fundamentals](#). Both consistency models are sufficient for creating
    read-only copies of the original data.


    Log shipping is a key enabler for another related architectural pattern — event
    sourcing. Kafka will act as a durable event store, allowing any number of consumers
    to rebuild a point-in-time snapshot of their application state by replaying all
    records up to that point in time. Loss of information in any of the downstream
    consumers can be recovered by replaying the events from the last stable checkpoint,
    reducing the need to frequent backups.


