  md: "# Creating delegation tokens\n\nTo create a delegation token, use the kafka-delegation-tokens.sh\
    \ CLI, as shown in the example below.\n\n```\n$KAFKA_HOME/bin/kafka-delegation-tokens.sh\
    \ \\\n--bootstrap-server localhost:9094 \\\n--command-config $KAFKA_HOME/config/client.properties\
    \ \\\n--create --max-life-time-period -1 \\\n--renewer-principal User:admin\n\
    ```\n\nThe owner of the token is the principal in the supplied properties file.\
    \ If client.properties has been configured with the credentials of the admin user,\
    \ this is not ideal in production, as the token bearer gathers significantly more\
    \ privileges than it requires.\n\nRunning the above command produces the following\
