  md: 'Where the target endpoint is a (non-Kafka) message queue, the downstream receiver
    must be made idempotent. In other words, two (or more) identical records with
    different offsets must not result in material duplication down the track. This
    is called end-to-end idempotence. The name suggests, this guarantee spans the
    entirety of an event-streaming graph, covering all nodes and edges. In practice,
    this is achieved by ensuring that any two neighbouring nodes have an established
    mechanism for idempotent communication.


