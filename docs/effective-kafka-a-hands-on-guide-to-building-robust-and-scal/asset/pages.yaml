  md: '# Chapter 10: Client Configuration


    call to `seek()`, if the supplied offset lies outside the range bounded by the
    low-water and high-water marks.


    Whatever reason for the missing or invalid offsets, the consumer needs to adequately
    deal with the situation. The `auto.offset.reset` property lets the consumer select
    from one of options:


    +   - **earliest**: Reset the consumer to the low-water mark of the topic — the
    offset of the first retained record for each of the partitions assigned to the
    consumer where no offset exists.


    +   - **latest**: Reset the consumer to the high-water mark — the offset immediately
    following that of the most recently published record for each partition. This
    is the default.


    +   - **none**: Do not attempt to reset the offsets if any are missing; instead,
    throw a `NoOffsetForPartitionException`.


    > Resetting the offset to `latest`, the default setting, has caused havoc, as
    it runs contrary to Kafka''s at-least-once processing tent. If a consumer group
    were to commit offsets following a period of downtime, the resulting reset would
    cause the consumers'' ''jump'' instantaneously to the high-water mark, skipping
    all records from the last committed point (inclusive of it). Any lag accumulated
    by the consumer would suddenly disappear. The delivery characteristics for the
    skipped records would be reduced to ''at most once''. Where consumers request
    a subscription under a consumer group, it is highly recommended that the default
    offset scheme be set to earliest, thereby maintaining at-least-once semantics
    as long as the consumer''s true lag does not exceed the retention of the subscribed
    topic(s).


    # Enable auto-commit and the auto-commit interval


    The `enable.auto.commit` property controls whether automatic offsetting should
    be enabled for grouped consumers. The default setting is true, which activates
    the periodic background committing of offsets. This process starts from the point
    when the consumer subscribes to one or more topics by invoking one of the overloaded
    `subscribe()` methods. When enabled, the `auto.commit.ms` property controls the
    interval of the background auto-commit task, which is set to 5000 (5 seconds)
    by default. The auto-commit encompasses the offsets of the records returned during
    the most recent call to `poll()`.


    The above narrative reflects the official Kafka documentation, but there is more
    to take. Taking the above for gospel, the more cautious among might spot a problem.
    If auto-commit unconditionally commits offsets every five seconds (or whatever
    the interval has been set to), what happens to the in-flight records that are
    yet to be processed? Would they be inadvertently committed, and wouldn''t violate
    the at-least-once processing semantics?


    Indeed, practitioners are mostly divided into two camps: the majority, who have
    remained oblivious to this concern, and the remaining minority, who have expressed
    their discomfort with Kafka''s default approach. The real answer is somewhat paradoxical.
