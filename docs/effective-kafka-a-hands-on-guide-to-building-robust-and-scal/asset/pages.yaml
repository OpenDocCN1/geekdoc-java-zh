    It should be stated out that the use of a Certificate Authority and PKI is unequivocally
    preferred over self-signed certificates. It is not that CA-signed certificates
    are inherently more secure from a purely cryptographic perspective; rather, the
    use of PKI makes it easier to manage large numbers of certificates, streamlining
    the process of issuing, rotating, and revoking certificates. This aspect makes
