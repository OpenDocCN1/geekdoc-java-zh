  md: "# Chapter 15: Group Membership and Partition Assignment\n\nNotwithstanding\
    \ the various controls one employ to ensure partition exclusivity, it can be shown\
    \ that in the absence of a deterministic system, the safety property cannot be\
    \ unconditionally satisfied in all cases.\n\nSources of nondeterminism in the\
    \ execution of applications, such as interrupts, paging, heap compaction, garbage\
    \ collection, and so forth, can lead to undetectable gaps in the evaluation of\
    \ successive statements. Consider the following code, typical of 'safe' access\
    \ to a critical section.\n\n```\ndistributedLock.acquire();\n{\n  try {\n    criticalSection.enter();\n\
    \    //\n    criticalSection.leave();\n  } finally {\n    distributedLock.release();\n\
    \  }\n```\n\nThe acquisition of an entry to a critical section may be invalidated\
    \ before the section is submitted due to an event that has its partitions revoked\
    \ as a result of a garbage collector pause. In the example, the criticalSection.enter()\
    \ may be called by an abnormally long pause, such that the DLM may deem the lock\
    \ holder 'dead' and transfer the lock to the next contender. When the code resumes\
    \ executing and calls criticalSection.enter(), it will conflict with the new holder's\
    \ actions and violate the safety property.\n\nThe third strategy — process-fencing\
    \ — augments strategy #2 by identifying and restarting (or otherwise isolating)\
    \ processes that have had their partitions revoked as a result of a heartbeat\
    \ failure. This can be accomplished using an external health check mechanism that\
    \ continually queries the process on a well-known endpoint — determine whether\
    \ the process can satisfy its routine polling obligations. If the endpoint does\
    \ not respond within a set timeframe, or if the response is negative, the process\
    \ will be forcibly restarted. The health check should be tuned to respond negatively\
    \ well before the max.poll.interval deadline, so that the process can be restarted\
    \ before its death is detected on the coordinator and before its partitions are\
    \ reassigned.\n\n# Utilising static members\n\nAs mentioned earlier in this chapter,\
    \ Kafka offers the notion of static group membership — allowing for an external\
    \ health check and healing mechanism for ensuring the liveness of the consumer\
    \ ecosystem. The requirement for static membership stems from the more contemporary\
    \ use cases involving container orchestration engines as Kubernetes. Under the\
    \ 'Kubernetes model, the container orchestrator is responsible for the ongoing\
    \ health of its subordinate containers, restarting them if a failure is detected."
