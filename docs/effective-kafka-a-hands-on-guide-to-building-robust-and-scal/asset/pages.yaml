    # Identifying the user principal


    When authenticating a client to the broker, hostname verification is not performed.
    Instead, the user principal taken verbatim as the value of the CN attribute of
    the certificate. One can change how a certificate''s attributes translate to a
    username, by overriding the ssl.principal.mapping.rules property to provide an
    alternate mapping. The format of this setting is a list, where each rule starts
    with the prefix RULE;, specifies a regular expression to match the desired attributes,
    followed by a / (slash) character, then a replacement, another slash, and finally,
    an optional U or L character indicating whether the replacement should be capitalised
    or forced to lower case, respectively. The format is depicted below.


    ```

    RULE:pattern/replacement/

    RULE:pattern/replacement/[LU]

    ```


    There are several examples listed on the official Kafka documentation page at
    kafka.apache.org/documentation. Mutual TLS is frequently used in machine-to-machine
    authentication — ideal for the Kafka use case, where the client is an application
    that operates independently of its end-users. There may be complications, however.
    The degree of authentication assurance in mTLS is limited by the level of rigour
    in the certificate signing process. Specifically, the broker can determine with
    a high level of assurance that the client is a trusted party. But which trusted
    party? That is the more challenging question.


    Recall, the client is trusted because it presents a valid certificate signed by
    a trusted issuer. The username implied by the certificate (represented by the
    CN by default) is assumed to be strongly associated with the user that presented
    the certificate, because this relationship was presumably verified by the issuer
    — a CA that we trust priori.


    Consider, for two trusted clients: C0 and C1. Both have a dedicated private key,
    signed by a trusted CA for use. If the signing is naively implemented, there is
    little stopping C0 from issuing another request to the CA, using the username
    of C1 in the CN field. If this were to happen, C0 could connect to the broker
    with an alternate certificate — impersonating C1. To prevent this from occurring,
    the process of signing certificates cannot be left to the clients'' hands — irrespective
    of whether the clients operate within the organisation’s perimeter. The relationship
    between a client and the CA must be individually authenticated, so that a client
    can only issue a request for a CN that has been authorized for that client.'
