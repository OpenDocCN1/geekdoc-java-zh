    \ Isr: 0\nTopic: getting-started Partition: 2 Leader: Replicas: 0 Isr: 0\n\n#\
    \ Deleting a topic\n\nTo delete an existing topic, use the kafka-topics.sh tool.\
    \ The example below deletes the getting-started topic from our cluster.\n\n```\n\
    $KAFKA_HOME/bin/kafka-topics.sh \\\n  --bootstrap-server localhost:9092 \\\n \
    \ --topic getting-started --delete\n```\n\nTopic deletion is an asynchronous operation\
    \ — a topic is marked for deletion, to be subsequently cleaned up by a background\
    \ process at an indeterminate time in the future. Inbetween the marking and the\
    \ final deletion, a topic might linger around — only to disappear moments later.\n\
    \nThe asynchronous behavior of topic deletion should be taken into account when\
    \ dealing with short topics — for example, when conducting an integration test.\
    \ The latter typically requires a state reset between tests, wiping associated\
    \ database tables and streams. Because there is no equivalent of a blocking DELETE\
    \ TABLE operation in Kafka, one must think outside the box. The options are:\n\
    \n+   - Forcibly reset consumer offsets to the high-water mark prior to each test,\
    \ delete the offsets, delete the consumer group (all three achieve equivalent\
    \ results);\n- Truncate the underlying partitions by shifting the low-water mark\
    \ (truncation will be described shortly); or\n- Use unique, disposable topic names\
    \ for each test, deleting any ephemeral topics when the test ends.\n\nThe latter\
    \ is the recommended option, as it creates de isolation between tests and allows\
    \ tests to operate concurrently with no mutually-observable side-effects.\n\n\
    # Truncating partitions\n\nAlthough a partition is backed by an immutable log,\
    \ Kafka offers a mechanism to truncate records in the log up to a user-specified\
    \ low-water mark. This can be achieved by passing a JSON document to the kafka-delete-records.sh\
    \ tool specifying the topics and partitions for truncation, with the new low-water\
    \ mark in the offset attribute. Several topic-partition-offset triples can be\
    \ specified in a batch. In the example below, we are truncating the first record\
    \ from getting-started:2, leaving records at offset 1 and newer intact."
