  md: '# Chapter 16: Security


    With the phenomenal level of interconnectedness prevalent in the modern world,
    opportunities arise not just in legitimate commercial enterprises, but also in
    the more clandestine establishments — individuals or organisations that seek to
    capitalise on unprotected systems and networks, with an overarching motive to
    threaten their targets for the purpose of extortion, cause immediate and lasting
    harm, or directly profit from illicit activities. The topic of conversation is,
    of course, cybercrime and information security.


    There is a common misconception that cybercriminals target an organisation''s
    most secure defences and employ highly sophisticated techniques to penetrate defences.
    This view has been largely popularised in modern fiction, where the persona of
    a hacker has been romanticised as a lone, reclusive individual with above-average
    skills who acts out of spite or takes their target as a personal challenge. In
    practice, it is more instructive to view cybercrime as a business, albeit an illegitimate
    one. While any target is theoretically ''hackable'', some are not worth it, insofar
    the cost of breaking into an organisation may outweigh the prospective gains.
    Like any business, a criminal organisation will seek to profit with minimal outlay,
    which means avoiding the easy prospects. Where an organisation is heavily defended,
    cybercriminals will often probe for ways in, looking for weaknesses at the perimeter,
    as well as from the organisation — using social hacking to gain access. As such,
    it is imperative to utilise multi-layered defences, creating redundancy in the
    security control fails or a vulnerability is exposed


    Kafka is a persistent data store that potentially contains sensitive organisational
    data. It often acts as a communication medium, connecting disparate systems and
    ensuring seamless information flow within the organisation. These characteristics
    make Kafka a lucrative target for cybercriminals: if breached, the entire organisation
    could be brought to its knees. As such, it is essential that particular attention
    is paid to the security of Kafka deployments, particularly if the cluster is being
    hosted among other infrastructure components or if it is accessible from outside
    the perimeter network.


    # State of security in Kafka


    Let us start by making one thing clearly: Kafka is not secure by default. Kafka
    has numerous security controls that cover virtually all aspects of information
    security; however, these controls are disabled out of the box.


    The default Kafka security profile is illustrated below.'
