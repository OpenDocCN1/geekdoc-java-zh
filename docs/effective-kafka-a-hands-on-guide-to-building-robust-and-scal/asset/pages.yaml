    the answer is condensed into the following: the parties might not be aware of
    another or they might not be present at the same point in time. The latter parties
    an additional demand on the broker: it must be stated. In other words, it must
    persist the records by the producer, so that they may be delivered to the consumer
    when it is convenient to do so. The broker needs to be not persistent, but also
    *durable*. By ''durable'', it is implied that its persistence guarantees can be
    extended over a period of time and can scenario that involve component failure.


    > Discussions of brokers as a means of decoupling may conjure images of message
    queues from the days of yore. Many Kafka users prefer message queue, an event
    streaming platform. While the argument holds on the whole, the underpinning objectives
    remain largely unchanged. We still have a publishing party, a subscribing party,
    and an intermediary to facilitate their interaction. And we would ideally like
    the parties to remain minimally coupled.


    A Kafka broker is a Java process that acts as part of a larger cluster, where
    the minimum size of the cluster is one. (Indeed, even we use a singleton cluster
    for testing.) A broker is *one* of the units of scalability in Kafka; by increasing
    the number of brokers, one can achieve improved I/O, availability, and durability
    characteristics. (There are other ways of scaling Kafka, as we shall soon discover.)


    A broker fulfills its persistence obligations by hosting a set of append-only
    log files that comprise the *partitions* hosted by the cluster. A more thorough
    discussion on partitions is to come; it will suffice to say now that partitions
    are elements of storage that one can address in Kafka.


    Each partition is mastered by exactly one broker — the partition *leader*. Partition
    data is replicated to a set of zero or more *follower brokers*. Collectively,
    the leader and the followers are referred to as *replicas*. Broker shares the
    load of data and follower roles among themselves; a broker node may act as the
    leader for certain replicas, while being a follower for others. The roles may
    change — a follower may be promoted to leader in the event of failure or as part
    of a manual rebalancing operation. The more replicas the lower the likelihood
    of data loss due to an isolated partition failure.


    Broker nodes are largely identical in every way; each node competes for the mastery
    of partition data on equal footing with its peers. Given the symmetric nature
    of the cluster, Kafka requires a mechanism for arbitrating the roles within the
    cluster and assigning partition leadership statuses among broker nodes. Rather
    than making these decisions collectively, broker follow a rudimentary chain-of-command.
    A single node is elected as the *cluster controller* which, in turn, directs all
    nodes (including itself) to assume specific roles. In other words, it is the controller''s
    responsibility for managing the states of partitions and replicas, and for performing
    administrative tasks like reassignment partitions among the broker nodes.'
