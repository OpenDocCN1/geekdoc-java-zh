    # # Acknowledgements


    The acks property stipulates the number of acknowledgments the producer requires
    the leader to have received before considering a request complete, before acknowledging
    the write with the producer. This is fundamental to the durability of records;
    a misconfigured acks property may result in the loss of data while the producer
    naively assumes that a record has been stably persisted.


    Although the producer property relates to the number of acknowledgments, it accepts
    an enumerated constant being one —


    +   - 0: Don''t require an acknowledgement from the leader.

    - 1: Require one acknowledgement from the leader, being the persistence of the
    record to its local log. This is the default when enable idempotence is set to
    false.

    - -1 or all: Require the leader to receive acknowledgments from all in-sync replicas.
    This is the default setting when enabling. idempotence is set to true.


    Each of these modes is discussed in detail in the following subsections.


    # # No acknowledgments


    When acks=0, any records queued on the outgoing socket are assumed to have been
    published, with no explicit acknowledgments required from the leader. This option
    provides the weakest durability guarantee. Only is it impacted by a trivial loss
    of a broker, but the availability of the client is also a determinant in the durability
    of the record. If the client were to fail, any queued records would be lost.


    In addition to forfeiting any of durability guarantees, the client will not be
    informed of the offset of the published record. Normally, a client would obtain
    the offset in two different ways: supplying `org.apache.kafka.clients.Producer.send()`
    method, or blocking on the result of a `Future<RecordMetadata>` object that is
    returned from `send()`. However, the resulting `RecordMetadata` would contain
    the offset of the published record. However, when acks=0, RecordMetadata.hasOffset()`
    will return false, and `RecordMetadata.offset()` will return -1, signifying that
    offset is not available.


    The main use case for acks=0 is that the publisher can afford to lose either one-record
    or small contiguous batches of records with a negligible impact on the correctness
    of the overall system. Consider a temperature sensor that is periodically submitting
    telemetry readings to a server, which in turn, is publishing these to a Kafka
    topic. A downstream process will ingest these readings and populate a web-based
    dashboard in real-time.


    In this hypothetical scenario, provided that historical temperature readings are
    not significant, we can afford to lose some of intermediate readings, provided
    that a reading for every sensor eventually comes through. This is not to say that
    a higher durability rating would somehow'
