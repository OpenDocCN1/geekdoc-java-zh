  md: '# Chapter 16: Security


    the logistics of key distribution for Kerberos clients — specifically, the need
    to deploy TGT or keytab files to each client. Delegation tokens also reduce the
    overhead of the authentication process rather than engaging the KDC to get a ticket
    and periodically renewing the TGT, the authentication protocol is reduced to verifying
    the delegation token, which is persisted in ZooKeeper. This approach is also more
    secure, reducing the blast radius of compromised credentials — if a delegation
    token is covertly obtained, the attacker is limited to the permissions attached
    to the delegation token. By comparison, the compromise of a Kerberos TGT or keytab
    carries more dangerous consequences.


    The most common use for delegation tokens is event stream processing when a swarm
    of worker nodes is orchestrated by a centralised coordinator. Worker nodes tend
    to be ephemeral. Rather than provisioning access independently for each worker
    node, the coordinator creates a time-delegation token, spins up a worker node,
    handling the newly-generated token. Under this scheme, only the coordinator requires
    access to long-lived credentials (a TGT or keytab or a username/password for SCRAM
    or PLAIN); the highly sensitive material never leaves the coordinator.


    Delegation tokens are for a lifespan — an upper bound on the maximum age of a
    token. Furthermore, a token has an expiration time, which sets a soft limit on
    the time that the token may be used to authenticate a client. The expiry time
    may be extended by renewing the token, subject to the upper bound enforced by
    its lifespan. An expired token is eventually purged from ZooKeeper using a background
    housekeeping thread. Because purging happens asynchronously, it is possible for
    a token to be used for some time after its official expiry.


    # Enable delegation tokens on the broker


    To enable delegation tokens, edit server.properties, adding the following lines:


    ```

    delegation.token.master.key=secret-master-key

    delegation.token.expiry.ms=3600000

    delegation.token.max.lifetime.ms=7200000

    ```


    The delegation.token.master.key specifies a key for signing tokens that must be
    shared by all brokers in a cluster. This property is required — delegation tokens
    are disabled without it. Replace the string secret-master-key as appropriate.


    The delegation.token.expiry.ms specifies the token expiry time in milliseconds.
    The default value is 86400000 (24 hours).


    The delegation.token.max.lifetime specifies the hard upper bound on the lifespan
    of the token in milliseconds. When issuing a token, the user can specify any value
    for the --max-life-time-period that is below this setting. The default value value
    of delegation.token.max.lifetime.ms is 604800000 (7 days).


    Restart the broker for the changes to take effect.'
