  md: '# Chapter 17: Quotas


    be stated definitively that a client will connect to more brokers as the latter
    are scaled out — the actual number of broker connections will depend on the number
    of partitions for the topics that the client publishes to or consumes from, as
    well as the number of replicas. When scaling the cluster, it may be necessary
    to adjust each client''s quota individually, projecting aggregate numbers and
    working back to determine what the per-broker quotas should be — compensating
    for the effects of the dilation.


    # Network bandwidth quotas


    Network bandwidth quotas rely on the amount of transferred data as a definitive
    metric for assessing a client''s utilisation of a broker''s available resources.
    It may be thought of as a compound metric increasing the rate of data transfer
    places a greater strain on the broker, but also utilizes the I/O channels on the
    broker, and may lead to increased memory pressure (due to buffering). In addition,
    when the client connects to an SSL listener, the broker loses its ability to employ
    the zero-copy optimisation, involving the CPU to encrypt and decrypt network data.
    With SSL enabled, the greater the transfer rate, the greater the load on the CPU.


    > Zero-copy describes compute operations in which the CPU does not perform the
    task of copying data from one memory area to another. In a typical I/O scenario,
    the transfer of data from a network socket to a storage device occurs without
    the involvement of the CPU and with a reduced number of switches between the kernel
    and user mode.


    A network bandwidth quota is specified as a pair of values: a producer_byte_rate
    and a consumer_byte_rate — representing the upper bound on the allowable bandwidth,
    in bytes per second (B/s). This unit of measurement is a slight departure from
    the conventional way of measuring bandwidth bits per second; however, when dealing
    with application-payload sizes, operating with byte rate is more convenient.


    Quotas are enforced by sampling the client''s activity over a period of time,
    using a sliding window algorithm. A pair of broker properties — quota.num.window
    and quota.window.size — stipulate the number of samples N retained and the duration
    of each sampling S period, respectively. The defaults are 1 — for the sample duration,
