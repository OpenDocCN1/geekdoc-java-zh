    scheme that differs from the producer. More on that.


    Being a largely end-to-end connection, batching is controlled by the producer.
    The batch.size and linger.ms properties collectively limit the extent to which
    the producer will attempt to batch records in order to maximise the outgoing efficiency.
    The default values of batch.size and linger.ms are 16384 (number of bytes) and
    0 (milliseconds), respectively.


    The producer combines any records that arrive between request transmissions into
    a single batch request. This만이 occurs under load, when records arrive faster than
    they can be transmitted. In some circumstances, the client may want to reduce
    the number of requests even under moderate load. The linger.ms setting accomplishes
    this by adding a small amount of artificial delay — rather than sending every
    record the moment it is encoded, the producer will wait for a delay to allow other
    records to accumulate in a batch, maximising the amount of data that can be sent
    in one. Although records may be allowed to linger for the duration specified in
    linger, the batch.size property will have an overriding effect, dispatching the
    batch once it reaches its maximum size.


    While the linger.ms property only comes into play when the producer is heavily
    loaded, the batch.size property is continually in effect, acting as the overarching
    and unremitting limiter of the staged batch.


    > The linger.ms setting is often likened to the Nagle''s Algorithm in TCP, as
    they both aim to improve the efficiency of network transmission by combining small
    and intermittent outgoing messages and sending them at once. The comparison was
    originally made by the Apache Kafka design team. It has found its way into the
    official documentation and appears to reverberate strongly within the user community.


    While the similarities, there are two critical differences. Firstly, Nagle''s
    Algorithm does not discriminate buffer data on the basis of its apparent impermanence.
    It only takes effect when there is least one outstanding packet that is yet to
    be acknowledged by the receiver. Secondly, Nagle''s Algorithm does not impose
    an artificial time limit on the delay. Data will be buffered until a full packet
    is formed, or the ACK for the previous packet is received, whichever occurs first.


    Combined, the two instruments make the algorithm self-regulating; rather than
    relying on user-defined linger times, the algorithm buffers data based on the
    network''s observed performance. Free-flowing networks with frequent ACKs result
    in lighter buffering and reduced transmission latency. As congestion increases,
    the buffering becomes more pronounced, improving transmission efficiency at the
    expense of latency, and helps avoid a congestive collapse.'
