- img_proc: true
  md: 'should not be used without adequate external security data protection, as TLS
    services provided by many application-layer protocols. By default, implementations
    **should not advertise** and **should not** make use of the PLAIN mechanism unless
    adequate data security services are in place.


    https://tools.iet.org/html/rfc4616


    Guided by the **Defence in Depth** principle, the SCRAM option should be preferred
    over PLAIN. This ensures that no singlehandedly impacts the integrity of the system
    if compromised. SCRAM acts in both directions: not only the client prove to the
    broker that it has the password, but the broker is required to do the same. (Caveat
    below.) In other words, SCRAM protects the client from connecting to a rogue broker,
    which acts in addition to the certificate-based attestation mechanism used natively
    in TLS. The only practical drawback of SCRAM over PLAIN is the added network round
    trip, which is necessary for both parties to identify one another. (SCRAM requires
    a total of two round-trips.) However, this penalty is paid once, during connection
    establishment — it has no subsequent bearing on throughput or latency.


    > SCRAM authentication is bidirectional, it is not completely symmetric — there
    is a subtle difference between the assurance each party provides to the other.
    Specifically, the client must prove to the broker that it has *present* knowledge
    of the password — at the time of connection establishment; the broker only needs
    to prove that it knows the password at some point in time. This is a desirable
    property — it relieves the broker from having to persist the password verbatim,
    and therefore risking exposure; instead, the broker persists irreversible derivations
    of the password that are subsequently used for mutual authentication. In theory,
    the client can discard the password and store the hashed version, it provides
    the salt used on the server (which is disclosed as part of the authentication
    flow).


    Because of the similarity in how the two authentication methods appear to the
    user, the worked examples will focus on the SCRAM case.


