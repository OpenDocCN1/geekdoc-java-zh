    \ flag and a topic name to kafka-topics.sh, we can get more detailed information\
    \ about specific topic, including the partition leaders, follower replicas, and\
    \ the in-sync replica set:\n\n```\n$KAFKA_HOME/bin/kafka-topics.sh \\\n  --bootstrap-server\
