    # Resetting offsets


    In the course of working with Kafka, we occasionally come across a situation where
    the committed offsets of a consumer group require minor adjustment; in the more
    extreme case, that adjustment might entail a complete reset of the offsets. An
    adjustment might be necessary if, the consumer has to skip some records -- perhaps
    due to the records containing erroneous data.(These are sometimes referred to
    as ''poisoned'' records). Alternatively, the consumer may be required to reprocess
    earlier records -- possibly due to a bug in the application which was subsequently
    released. Whatever the reason, the kafka-consumer-groups.sh tool can be used with
    the --reset-offsets flag to affect fine-grained control over the consumer group''s
    committed offsets.


    The example below rewinds the offsets for the consumer group cli-consumer to the
    low-water mark, using the --to-earliest flag -- resulting in the forced reprocessing
    of all records when the consumer group reconnects. Alternatively, the --to-latest
    flag can be used to fast-forward the offsets to the high-water mark extremity,
    skipping all backlogged records. Resetting offsets is an offline operation; the
    operation will not proceed in the presence of a connected consumer.'
  merge: -1
  pgno: 73
- img_proc: true
  md: "# Chapter 5: Getting Started\n\n```\n$KAFKA_HOME/bin/kafka-consumer-groups.sh\
    \ \\\n  --bootstrap-server localhost:9092 \\\n  --topic getting-started --group\
    \ cli-consumer \\\n  --reset-offsets --to-earliest --execute\n```\n\nBy default,\
    \ the --reset-offsets flag will result in a dry run, where the tool will list\
    \ the partitions that will be subject to a reset, the existing offsets, as well\
    \ as the candidate offsets that will be assigned upon completion. This is equivalent\
    \ to running the tool with the --dry-run flag, and is designed to prevent the\
    \ user from accidentally corrupting the consumer group's state. To enact the change,\
    \ run the command with the --execute flag, as shown in the example above.\n\n\
    In addition to resetting offsets for the entire topic, the reset operation can\
    \ be performed on a subset of the topic's partitions. This can be accomplished\
    \ by using a list of partitions following the topic name, in the form <topic-name>:<first-partition>,<second-partition>,...,N-partition>.\
    \ An example of this syntax is featured below. Also, rather than resetting the\
    \ offset to a partition extreme, you use the --offset parameter to specify a numeric\
    \ offset.\n\n```\n$KAFKA_HOME/bin/kafka-consumer-groups.sh \\\n  --bootstrap-server\
    \ localhost:9092 \\\n  --topic getting-started:0,1 --group cli-consumer \\\n \
    \ --reset-offsets --to-offset 2 --execute\n```\n\nThe next example uses Kafka's\
    \ time-using to locate an offset based on the given date-time value, quoted in\
    \ ISO8601 format. Specifically, the offsets will be reset to the earliest point\
    \ in time that occurs at the timestamp or after. This feature is convenient when\
    \ one needs to wind the offsets back to a known point in time. When using the\
    \ --datetime parameter, ensure that the offset is passed using the correct timezone;\
    \ if unspecified, the timezone defaults to the Coordinated Universal Time (UTC),\
    \ also known as Zulu time. In the example below, the timezone had to be adjusted\
    \ to Australian Eastern Daylight Time (AEDT), eleven hours east of Zulu, as this\
    \ book was written in Sydney.\n\n```\n$KAFKA_HOME/bin/kafka-consumer-groups.sh\
    \ \\\n  --bootstrap-server localhost:9092 \\\n  --topic getting-started:2 --group\
    \ cli-consumer \\\n  --reset-offsets --to-datetime 2020-01-27T14:35:54+11:00 \\\
    \n  --execute\n```\n\nThe final option offered by this tool is to shift the offsets\
    \ by a fixed quantity n, using the --shift-by parameter. The magnitude of the\
    \ shift may be a positive number — for a forward movement, or a negative number\
    \ — to rewind the offsets. The extent of the shift is bounded by the partition\
    \ extremities; the result of 'current offset' + n will be capped by the low-water\
    \ and high-water marks."
