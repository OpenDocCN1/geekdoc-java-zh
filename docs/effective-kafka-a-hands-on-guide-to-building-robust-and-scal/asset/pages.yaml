  md: '# Chapter 16: Security


    As much as it is a convenience, it is also a ''gotcha'': it is possible to accidentally
    create a rule that references a mistyped user or topic — provided the rule is
    well-formed, Kafka will vacuously persist it. When creating ACL rules, particularly
    when these rules relate to high-assurance resources, it is considered best-practice
    to validate these rules. The best way to do this is programmatically, writing
    a script that performs specific actions and allows the deny or deny. However,
    the cost of getting the wrong test can be catastrophic — imagining a operation
    that succeeds when it is expected to fail. The result is deletion of resources
    — not just a failure of the test, but loss of potentially vital data and the deletion
    of downstream consumers.


    The recommended way to test rules is to operate two clusters — a staging and a
    production setup — where production is only manipulated via pre-scanned scripts
    that have been validated against the staging cluster. This strategy implies that
    users are mirrored in both clusters and have identical permissions. In that sense,
    a staging cluster is quite different from a typical non-production cluster, where
    users might routinely give elevated permissions to enable productivity.


    # Network address restrictions


    In addition to restrictions on user principals, Kafka allows rules to specify
    the network addresses of connected clients. This is done with --allow-host or
    --deny-host flags, with their sole argument being the target IP address. Multiple
    --allow-host and --deny-host flags may be specified in a single command, resulting
    in the addition of multiple rules.


    > The hosts passed to --allow-host and --deny-host must be specific addresses
    — either IPv4 or IPv6 form. Hostnames and IP address ranges are not presently
    supported. KIP-252 extends the existing ACL functionality to support address ranges
    as groups of addresses in CIDR notation; however, this KIP is still in its infancy.


    When the option is present, the changing landscape of application architecture
    — the proliferation of Cloud-based technologies, containerisation, and elastic
    deployment topologies, make it difficult to recommend host-based rules as a legitimate
    form of application-level access control. It is becoming more challenging and
    sometimes downright to isolate application processes based on their network address.
    When this makes sense, controlling access on origin addresses is best accomplished
    with a firewall — a device that is designed for this purpose and provides effective
    network and transport-layer controls. Furthermore, firewalls understand ports,
    protocols and, crucially, address ranges. The latter represents an absolute requirement
    when dealing with elastic deployments. At the application layer, access should
    be a function of user principals, and ideally, their roles.


    *https://wiki.apache.org/confluence/x/jb0HB'
