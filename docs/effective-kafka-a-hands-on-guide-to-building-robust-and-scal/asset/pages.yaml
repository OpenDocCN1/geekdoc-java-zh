  md: '# Parallelism


    It was previously stated in Chapter 3: Architecture and Core Concepts that exploiting
    partial order enables consumer parallelism. The distribution of partition assignments
    among members of a consumer group is the very mechanism by which this is achieved.
    While consumer load-balancing is straightforward in theory, the practical implications
    of aspects such as topic sizing, record key selection, and consumer scaling are
    not so apparent.


    There are several factors one must account for when designing highly performant
    event streaming applications. The following is an enumeration of some of these
    factors.


    # Producer-driven partitioning


    Irrespective of the particular messaging topology employed, the responsibility
    of assigning records to partitions lies solely with the producer. This stems from
    a fundamental design limitation of Kafka: both topics and partitions are physical
    constructs, implemented as segmented log files under the hood. The publishing
    of a record results in the appending of a serialized form of the record to the
    head-end of an appropriate log file. Once this occurs, the relationship between
    a record and its partition is cemented for the lifetime of the record.


    > In Kafka terminology, the most recent records are considered to be at the ''head''
    end of a partition.


    The implication of this constraint is that the producer should take the utmost
    care in keying the records such as to preserve the essential causal relations,
    without overly constraining the record order. In practice, events will relate
    to some stable entity; the identifier of that entity can serve as the key of the
    corresponding record.


    By example, consider a hypothetical content syndication catering to football fans.
    Our system integrates with real-time content providers, listening to in-play events
    from football matches as they unfold, then publishes a consolidated event stream
    to power multiple downstream consumers — mobile apps, scoreboards, player and
    match stats, video overlays, social networks such as Twitter, and other subscribers.
    True to the principles of event-driven architecture, we try to remain agnostic
    of what downstream, focusing instead on the completeness and correctness of the
    emitted event stream — the data content of the records, their timing, and granularity.
    A simplified domain model for this contrived scenario is illustrated below.'
