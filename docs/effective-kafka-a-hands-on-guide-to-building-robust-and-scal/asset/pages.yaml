  md: '# Applying broker configuration


    # Static configuration


    The static configuration for all Kafka components is housed in $KAFKA_HOME/config.
    A broker sources its read-only static configuration from server.properties.


    With one exception, all entries in server.properties are optional. If omitted,
    the fallback chain comprising deprecated properties and the default value takes
    effect. The only mandatory setting is zookeeper.connect. It connects the ZooKeeper
    connection string as a comma-separated list of host:port, in the form host1:port1,host2:port2,...,hostN:portN
    — allowing for multiple redundant ZooKeeper connections.


    > Other than sharing the comma-separated host format, the ZooKeeper connection
    string has nothing in common with the bootstrap servers used to configure Kafka
    clients. While a Kafka client employs a two-step process to connect to all brokers
    and will establish it directly. A broker needs only one connection to a ZooKeeper
    node and ZooKeeper employs an atomic broadcast protocol to syndicate updates among
    all peer nodes, eliminating the need for every broker to connect to every ZooKeeper


    Another cluster configuration entry in server.properties is broker.id, which specifies
    the unique identifier of the broker within the cluster. This is brought up now
    because awareness of the broker IDs for nodes in a Kafka cluster is required to
    administer targeted configuration, which may be progressively applied to select
    subsets of the broker nodes.


    If left unspecified or set to -1, the broker ID will be dispensed automatically
    by the ZooKeeper ensemble, using an atomically-generated sequence starting from
    100 (This can be configured by using setting.broker.max.id; the sequence will
    begin at one higher than this number).


    It is considered good practice to set broker.id explicitly, as it is easy to determine
    the broker ID by looking at server.properties. Once the ID has been assigned,
    it is written to a meta.properties file, residing in the Kafka logs directory.
    This directory is specified by the log.dirs property, defaulting to /tmp/kafka-logs.


    > While the naming might suggest to otherwise, the Kafka logs directory is not
    the same as the directory used for application logging. The logs directory houses
    the segment, indexes, and checkpoints — used by the broker to persist partition-data.
    The contents of this directory are essential to the operation of the broker; the
    loss of the logs directory amounts to the loss of data for the broker in question.


    To change the ID of an existing broker, you must first stop the broker. Then remove
    the broker.id entry from meta.properties or delete the file altog. You can then
    change broker.id in'
