    ![](img/a4d2c17b478048c90e0b48be89cde5c1_204_0.png)


    Information entropy is the measure of the informational content contained by an
    element in a stream. It is determined by the likelihood of predicting the value
    of an element in a stream based on the observations of prior elements, with the
    score ranging between zero (no entropy, perfectly predictable) and one (highest
    entropy, completely unpredictable). In the context of a data record, an element
    might be an individual or a byte in the record. The easier it is to predict the
    value of the next byte, the less information it carries. As an example of low
    entropy source, consider a formatted JSON document. Having observed a newline
    character, it is extremely likely the next element is a whitespace character,
    with the next candidate being a double quote, followed by a closing brace. Compare
    this to a truly random sequence of bytes. The likelihood of predicting the next
    byte is unity; this is an example of maximum entropy. This type of data will only
    lead to an increase in the output size as the overheads of the compression algorithm
    will be added into the output, not offset by any gains in entropy.


