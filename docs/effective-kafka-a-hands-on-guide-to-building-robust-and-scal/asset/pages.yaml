    # ## Architecture Overview


    While the intention isn''t to indoctinate the reader with the minutia of Kafka''s
    inner workings (for now), some appreciation of its design will go a long way in
    explaining the foundational concepts that will be covered shortly.


    Kafka is a distributed system comprising several key components. At an outline
    level, these are:


    +   - **Broker nodes**: Responsible for the bulk of I/O operations and durable
    persistence within the cluster.

    - **Zookeeper nodes**: Under the hood, Kafka needs a way of managing the overall
    controller status within the cluster. Zookeeper fulfills this role, additionally
    acting as a consistent state repository that can be safely shared among the brokers.

    - **Producers**: Client applications responsible for appending records to Kafka
    topics.

    - **Consumers**: Client applications that read from topics.


    The diagram below offers a brief overview of the Kafka component architecture,
    illustrating the relationships between its constituent parts. A further elaboration
    of the components follows.'
