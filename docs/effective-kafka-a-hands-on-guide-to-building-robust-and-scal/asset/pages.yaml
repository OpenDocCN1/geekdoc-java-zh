  md: '# Chapter 12: Batching and Compression


    The biggest gains will be felt when starting from small batches. As the batch
    size increases, the laws of diminishing returns take effect — an increase in the
    batch size will yield a proportionally smaller gain in compression ratio. The
    incremental reduction in the number of packets used, and hence the transmission
    efficiency, will also be less noticeable with higher batch sizes.


    The compression.type configuration property controls the algorithm that the producer
    will use to compress records before forwarding them on the partition leaders.
    The valid values are:


    +   - none: Compression is disabled. This is the default setting.

    - gzip: The GNU Gzip algorithm — released in 1992 as a free substitute for the
    proprietary compress program used by early UNIX systems.

    - snappy: Google’s Snappy compression format — optimised for throughput at the
    expense of compression ratios.

    - lz4: The LZ4 algorithm — also optimised for throughput, most notably for the
    speed of decompression.

    - zstd: Facebook’s ZStandard — a new algorithm introduced in Kafka 2.1.0, intended
    to achieve an effective balance between throughput and compression ratios.


    Kafka compression applies to every entity record, which as we know be end-to-end
    depending on the settings on the broker. Specifically, when the broker is configured
    to accept the producer’s preferred compression scheme, it will not interfere with
    the contents of the batch. The batch flows from the producer to the broker, is
    persisted across multiple replicas, and is eventually served to one or more consumers
    — all as a single, indivisible chunk. The broker simply acts as a relay party
    — it does not decompress and re-compress the record as part of its role. Each
    chunk has a header that notes the algorithm that was used during compression,
    allowing the consumers to apply the same when unpacking the chunk.


    The compression.type broker property applies to all topics by default, overriding
    the producer property. In addition, it is possible to configure individual topics
    by using the kafka-configs.sh CLI to specify a dynamic configuration for the topics
    entity type.


    On the flip side, end-to-end compression has a subtle drawback, which can catch
    unexpected users. Because the broker is unable to mediate the interchange format,
    the result is a latent coupling between the producer’s capabilities and that of
    the consumer clients. Although Kafka strives to maintain binary protocol compatibility
    with minor releases, this promise does not cover end-to-end contracts, such as
    compression and checksumming. As such, the producer application must use a compression
    format that is compatible with the oldest consumer version.'
