  md: '# Chapter 1: Event Streaming Fundamentals


    Distributed systems typically require a different approach to resilience compared
    to their centralised counterparts. The quantity and nature of failure scenarios
    is much more daunting in distributed systems. Failures in centralised systems
    are mostly generalised as fail-stop scenarios — where a process fails totally
    or permanently, or a network partition occurs, which separates the entirety of
    the system from one or more clients, or the system from its dependencies. At either
    rate, the failure modes are trivially understood. By contrast, distributed systems
    introduce the concept of partial failures, intermittent failures, and in the more
    extreme cases, Byzantine failures. The latter represents a special class of failures
    where processes submit incorrect or misleading information to unsuspecting peers.


    # Consistency


    Ensuring state consistency in a distributed system is perhaps the most difficult
    aspect to get right. One can think of it as a vast state machine, with some elements
    of it being updated independently of others. There are varying levels of consistency,
    and different applications demand specific forms of consistency to satisfy their
    requirements. The stronger the consistency level, the more synchronisation is
    necessary to maintain it. Synchronisation is generally regarded as a difficult
    problem; it is also expensive — requiring additional resources and impacting the
    performance of the system.


    Cost being a constant, the greater requirement for consistency, the less distributed
    a system will be. There is a natural counterbalance between consistency and availability,
    identified by Eric Brewer in 1998. The essence of it is in the following: distributed
    systems must be tolerant of network partitions, but in achieving this tolerance,
    they will have to give up consistency or availability guarantees. Note, this conjecture
    does not claim that a consistent system cannot simultaneously be highly available,
    only that it must give up if a network partition occurs.


    By comparison, centralised systems are not bound by the same laws, they don''t
    have to contend with network partitions. They can also take advantage of the underlying
    hardware, as CPU cache lines and atomic operations, to ensure that individual
    threads within a process maintain consistency of shared data. When they do fail,
    they failially as a unit — losing any ephemeral state and leaving the persistent
    state as it was just before failure.


    # Event-Driven Architecture


    Event-Driven Architecture (EDA) is a paradigm promoting the production, detection,
    consumption of, and reaction to events. An event is a significant state change,
    that may be within the domain where this state occurred, or outside of that. Interested
    parties can be notified of an event by having the originating domain push some
    depiction of the event to a well-known conduit — a message broker, a ledger, or
    a shared datastore of sort. The event itself does not travel — only its notification;
    however, we often metonymically refer to the notification of the event as the
    event. (While formally incorrect, it is convenient.)'
