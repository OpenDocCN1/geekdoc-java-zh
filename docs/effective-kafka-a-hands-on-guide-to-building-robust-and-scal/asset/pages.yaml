    # Switching to SASL/PLAIN


    It was previously stated that SASL/PLAIN and SASL/SCRAM are not materially differentiated
    from a user''s perspective. To change events over SASL/PLAIN, set the sasl.mechanism
    client property to PLAIN and replace the fully-qualified class name of the JAAS
    module from org.apache.kafka.common.security.s org.apache.kafka.common.security.plain.PlainLoginModule


    On the broker, the differences are slightly more perceptible. PLAIN mode does
    not use ZooKeeper to store credentials. Credentials are defined directly in the
    JAAS configuration.


    To enable SASL/PLAIN, edit server.properties, changing the following lines:


    ```

    sasl.enabled.mechanism=PLAIN \

    sasl.mechanism.inter.broker.protocol=PLAIN \

    llistener.name.sasl_ssl.plain.jaas.config=\\norg.apache.kafka.common.security.plain.PlainLoginModule
    \

    required=\\nusername="admin" \

    password="admin-secret" \

    user_admin="admin-secret" \

    user_alice="alice-secret";

    ```


    Also, remove the listener.name.sasl_ssl.sha-512.jaas.config property from the
    SASL/SCRAM example. (Unless you need to maintain SCRAM alongside PLAIN.)


    On the client-side, change the value of the sasl.mechanism property to PLAIN.


