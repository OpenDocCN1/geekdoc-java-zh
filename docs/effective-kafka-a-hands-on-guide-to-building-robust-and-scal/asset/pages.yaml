    # Transactions under the hood


    # Role of the transaction coordinator


    Chapter 10: Client Configuration At the heart of the implementation is a unique
    producer ID (PID) that is assigned by a transaction coordinator for the duration
    of the producer’s session. A transaction coordinator is a module running within
    a broker process, serving idempotent and transactional producers — akin to the
    group coordinator used by consumers to manage group membership. The transaction
    coordinator is responsible for issuing PIDs and managing transaction state. The
    producer starts by issuing an InitProducer request to the appropriate transaction
    coordinator (there may be multiple coordinators); the latter replies with a unique
    PID that is valid for the duration of the producer’s session.


    Transactional messaging builds upon this infrastructure by increasing the lifetime
    of a producer’s PID such that it survives a single producer session. This is achieved
    by specifying an optional transactional.id property on the producer. If the property
    is not set, the transaction coordinator will issue a new PID on each request;
    otherwise, the transaction coordinator will associate the PID with the transactional
    ID and maintain this association for the duration specified in the transactional.id
    broker property, which defaults to 604800000 (one week). The transactional ID
    → PID mapping includes the epoch corresponding to the point when the association
    was updated. The epoch acts as a fencing mechanism, blocking zombie processes
    that have been displaced by a new PID assignment. (A zombie producer might attempt
    to use their PID to manipulate an in-flight transaction or initiate a new one;
    however, they will act using an older epoch number, which gives them away.) A
    ProducerFencedException is thrown when the producer attempts to manipulate a transaction
    that has been fenced off.'
