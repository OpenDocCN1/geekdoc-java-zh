    After ZooKeeper starts with the server-side JAAS configuration, connections will
    be authenticated using SASL and clients able to set ACLs on nodes. However, any
    existing nodes that were created prior to enabling SASL will remain fully-accessible
    by the world scheme. Recall, ZooKeeper''s authentication exists to support its
    authorization controls. Enabling authentication on its own has no effect on existing
    nodes. Fortunately, Kafka provides a convenient migration script that edits ACLs
    on existing nodes, transferring permissions from world to an admin user of our
    choice.'
