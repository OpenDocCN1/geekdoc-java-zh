  md: '# Partitioner


    The partitioner.class property allows the application to override the default
    partitioning scheme by specifying an implementation of org.apache.kafka.clients.producer.Partitioner.
    Unless otherwise, the producer will use the org.apache.kafka.clients.producer.internals.DefaultPartitioner
    implementation.


    The behaviour of the DefaultPartitioner varies depending on the attributes of
    the record:


    +   1. If a partition is explicitly specified in the ProducerRecord, that partition
    will always be used.

    2. If no partition is set, but a key has been specified, the key is hashed to
    determine the partition number.

    3. If neither the partition nor the key is specified, and the current batch already
    has a ''sticky'' partition assigned to it, maintain the same partition number
    as the current batch.

    4. If either of the conditions are met, then assign a new ''sticky'' partition
    to the current batch and use it for the current record.


    > Points #1 and #2 capture the age-old behaviour of the DefaultPartitioner. Points
    #3 and #4 were added in the 2.4.0 release of Kafka, as part of KIP-480. Previously,
    the producer would vacuously allocate records in a round-robin fashion. While
    this spreads the load evenly among the partitions, it largely negates the benefits
    of batching. Since partitions are mastered by different brokers in the cluster,
    this approach used to potentially several brokers to publish a batch, resulting
    in a much higher latency, influenced by the slowest broker. The 2.4.0 update limits
    the engagement to a single broker for any unkeyed hash, reducing the 99th percentile
    latency by a factor of two to three, depending on the record throughput. The partitions
    are still evenly loaded over a long series of batches.


    Hashing a key to resolve the partition number is performed by passing the byte
    contents of the key through a MurmurHash2 function, taking the lower-order 31
    bits from the 32-bit by masking off the highest bit (bitwise AND 0xffffff). The
    resulting value is taken, modulo of the partitions, to arrive at the partition.


    > While hashing of keys and mapping of records to partitions might appear straightforward,
    it is gotten through a more thorough analysis of the problem and that potential
    solutions are presented in Chapter 6: Design Considerations. Without going into
    the details here, the reader is urged to abide by one rule: when the correctness
    of a system is predicted on the key-centric ordering of records, avoid resizing
    the topic as this would effectively void any guarantee that the consumer ecosystem
    may come rely upon.


    In addition to the DefaultPartitioner, the Java producer client also contains
    a RoundRobinPartitioner and a UniformStickyPartitioner.'
