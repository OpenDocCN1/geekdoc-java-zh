  md: '# Chapter 3: Architecture and Core Concepts


    +   - A consumer will commit the offset of a record when it is done processing.
    The commits are directed to a consumer coordinator, which will end up written
    to an internal __consumer_offsets topic. The offset of the record is incremented
    by one before committing, to prevent unnecessary replay.

    - Partitions may be manually assigned to free consumers. If necessary, an entire
    topic may be assigned to a single free consumer — this is done by individually
    assigning all partitions.


    Event streaming platforms are a highly effective building block in the construction
    of modular, loosely-coupled, event-driven applications. Within the world of event
    streaming, Kafka has solidified its position as the go-to-source solution that
    is both flexible and highly performant. Concurrency and parallelism are at the
    heart of Kafka’s architecture, forming partially-ordered event streams that can
    be load-balanced across a scalable consumer ecosystem. A simple reconfiguration
    of consumers and their encompassing groups can bring about vastly different event
    distribution and processing semantics; shifting the offset commit point can invert
    the delivery guarantee from at-most-once to an at-least-once model.


    The consumer group is a somewhat underestimated concept that is pivotal to the
    versatility of an event streaming platform. By simply varying the affinity of
    consumers with their groups, one can arrive at vastly different distribution topologies
    — from a topic-like, pub-sub behaviour to an MQ-style, point-to-point model. Because
    records are never truly consumed (the advancing offset only creates the illusion
    of consumption), one can concurrently superimpose disparate distribution topologies
    over a single event stream.'
  merge: -1
