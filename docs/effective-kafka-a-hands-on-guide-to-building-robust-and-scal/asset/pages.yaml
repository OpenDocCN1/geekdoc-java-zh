  md: '# Chapter 12: Batching and Compression


    Congestive collapse is a phenomenon that occurs when a network is overwhelmed
    by a high packet rate, usually at narrow choke points, leading to increased failures
    (packet loss and timeouts) and a corresponding escalation of retries. This creates
    a perpetuating feedback loop that degrades to a parasitic stable state where the
    traffic demand is high, but there is little throughput available.


    The batching algorithm used by Kafka is crude. It requires careful tuning and
    imposes a fixed penalty on intermittent publishing patterns regardless of the
    network''s performance or the observed latency. This does not necessarily render
    it ineffective. On the contrary, the batching algorithm can be very effective
    over high-latency networks. Its main issue is the lack of adaptability, making
    it suboptimal in dynamic network climates or in cases of varying cluster performance.
    Kafka places the onus of tuning the algorithm parameters on the user, requiring
    careful and extensive experimentation to empirically reach the optimal set of
    parameters for a given network and cluster profile. These parameters must also
    be periodically revised to ensure their continued viability.


    Even with the default linger_ms value of 0, the producer will still allow for
    some buffering due to the asynchronous nature of the transmission: send() serializes
    the record, assigns a partition number, and places the serialized contents into
    the accumulator buffer, but does not transmit it. The actual communications are
    handled by a background I/O thread. So if send() is called multiple times in rapid
    succession, at least some of records will be batched.


    Due to the diminishing returns exhibited with larger batch sizes and the lack
    of self-regulation in Kafka''s batching algorithm, it may be prudent to err on
    the side of smaller values of linger_ms—from zero to several milliseconds. The
    non-functional requirements of the overall system should also specify the tolerance
    for latency, which ought to be honoured over any gains in network efficiency or
    storage savings on the brokers. The extent of batching may be increased further
    if the network is becoming a genuine bottleneck; however, such changes should
    be temporary—the focus should be addressing the root cause.


    # Compression


    The effectiveness of batching increases substantially when complemented by record
    compression. As compression operates on an entity, the resulting compression ratios
    increase with the batch size. The effects of compression are particularly pronounced
    when using text-based encodings such as JSON, where the records exhibit low information
    entropy. For JSON, compression ratios ranging from 5x to 7x are not unusual, which
    makes compression a no-brainer. Furthermore, batching and compression are largely
    done as a client-side operation, which transfers the load onto the client and
    has a positive effect not only on the network bandwidth, but also on the brokers''
    disk I/O and storage utilisation.'
