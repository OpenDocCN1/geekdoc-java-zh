    # The solution — transactions


    The transactional messaging capability introduced in release 0.11.0. strengthens
    Kafka’s delivery semantics. Namely, it introduces atomicity, consistency and isolation
    guarantees on top of the existing durability pledge, for a combined ACID experience
    that is characteristic of relational databases (and occasionally of NoSQL).


    +   Atomicity — ensures that, for a group of records published within an encompassing
    transaction scope, either all records are visibly persisted to their respective
    logs, or none are persisted. In other words, the transaction succeeds or fails
    as a whole. The logs, in this case, are not limited to a single partition; transactions
    may span multiple topics and partitions.'
