  md: 'Both Kafka and ZooKeeper utilise ACLs for authorization; however, their implementations
    are distinct and should not be confused. The table below outlines the differences.


    | ZooKeeper ACLs | Kafka ACLs |

    |---|---|

    | Apply to distinct resources. | Can specify multiple resources using prefixes
    and wildcards. |

    | Restrict operations to users. | Restrict operations to users or network addresses.
    |

    | Can only allow an operation. | Can allow or deny operations. |


    There are several supported operations:


    +   - Read — view data-centric resource (for example, a topic), but not write
    to its contents.

    - Write — modify the contents of a data-centric resource.

    - Create — create a new resource.

    - Delete — delete a resource.

    - Alter — change the contents of a non-data resource (for example, ACLs).

    - Describe — get information about a resource.

    - ClusterAction — operate on the cluster. For example, fetch metadata or initiate
    a shutdown of a broker.

    - DescribeConfig — retrieve the configuration of a resource.

    - AlterConfigs — alter the configuration of a resource.

    - IdempotentWrite — perform an idempotent write. Idempotent writes are described
    in Chapter 10: Client Configuration.

    - All — all of the above.


    The operations act on resource types. The following is a list of supported resource
    types and related operations:


    +   - Cluster — the entire Kafka cluster. Supports: Alter, AlterConfigs, ClusterAction,
    Create, Describe and DescribeConfig.

    - DelegationToken — a delegation token. This type is different from the others
    in that it is bound by rules, where permissions apply to the owner and renewer.
    Supports: Describe.

    - Group — a consumer group. Supports: Delete, Describe and Read.

    - Topic — a topic. Supports: Alter, AlterConfigs, Create, Delete, Describe, DescribeConfigs
    Read and Write.

    - TransactionalId — transactional sessions of the same logical producer. Supports:
    Describe and Write.'
  merge: -1
  pgno: 325
