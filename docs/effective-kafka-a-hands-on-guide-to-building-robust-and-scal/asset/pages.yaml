  md: '# Chapter 18: Transactions


    When discussing event stream application, one topic of conversation that invariably
    comes up is that of delivery guarantees.


    To recount our journey far, Chapter 3: Architecture and Core Concepts has introduced
    the concept of design semantics — distinguishing between *at-most-once* and *at-least-once*
    models and how either can easily be achieved in a Kafka consumer by changing the
    relative order of processing a record and confirming its offsets.


    We subsequently looked at the notions of *idempotence* and *exactly-once* delivery
    in Chapter 6: Design Considerations — namely, the role of the client application
    ensuring that the effects of processing a record are not repeated if the same
    record were consumed multiple times.


    Finally, Chapter 10: Client Configuration demonstrated the use of the `enable`
    idempotent producer property to ensure that records are not duplicated or out-of-order
    in the face of intermittent errors.


    This chapter looks at one last control available by Kafka — transactions. Transactions
    fill certain gaps of idempotent consumers with respect to the side-effects of
    processing records, and enable end-to-end, exactly-once transactional semantics
    across a series of loosely-coupled stream processing stages.


    # Preamble


    > Before we get too involved into unravelling the joys of transactional event
    processing, it is worth taking a moment to contemplate the extent of the work
    that has gone into its design and construction, and acknowledge the colossal efforts
    of numerous contributors who made this possible. The Kip was comprised around
    60 individual work items and was planned over three years. The final design was
    subject to a nine-month period of public scrutiny and evolved substantially as
    a result of community feedback. The design was one of the most profound changes
    to Kafka since its public release, delivering in excess of 15,000 lines of unit
    tests alone. Crucially, the performance overhead of transactions was kept to a
    minimum — subtracting an average of three to five percent from the throughput
    of an equivalent nonexistent producer.


    Transactions arrived in release 01.11.0, as part of a much larger Kip-98*. The
    significance of this may not be immediately apparent, but the reader has already
    witnessed this Kip in action in Chapter 10:'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# Chapter 18: Transactions


    Client Configuration, and most of our examples have, in fact, utilised the capabilities
    introduced by this KIP — namely, the enable idempotence property. That''s correct,
    both the idempotent producer and transactional messaging features are highly related
    and share a great deal in common. So in effect, the forthcoming study of transactional
    messaging might be seen as close off the discussions started many chapters ago.


    # The rationale behind transactions


    As it has been extensively discussed in the introductory chapters, the role of
