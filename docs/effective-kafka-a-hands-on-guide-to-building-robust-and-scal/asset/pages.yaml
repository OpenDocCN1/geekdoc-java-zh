  md: '# Chapter 10: Client Configuration


    A critical flaw in the consumer''s design, and, indeed, the documentation seems
    to support this theory, the implementation compensates for this in a subtle and
    surreptitious manner. Whilst the documentation states that a commit will occur
    in the background at an interval specified by the configuration, the implementation
    relies on the async-process to initiate the commit from within the poll() method,
    rather than tying an auto-commit directly to the system time. Furthermore, the
    auto-commit only occurs if the last auto-commit was longer than auto-commit.interval.ms
    ago. By committing from the processing thread, and providing record processing
    performed synchronously from the poll-process loop, the KafkaConsumer implementation
    will not commit the offsets of in-flight records, standing by its at-least-once
    processing views.


    > While the above explanation might mean reassuring at first, consider: the following
    present behaviour is implementation-specific and unwarranted. It is not stated
    in the documentation, nor in the Javadocs, nor in the KIP. As such, there is no
    commitment, implied or otherwise to honour this behaviour. Even a minor release,
    to move the auto-commit from a poll-initiated to a timer-driven model. If the
    reader is concerned about the prospect of this occurring, it may be prudent to
    disable the auto-commit feature and to always commit the offsets using Consumer.commitAsync().


    Another implication of the offset auto-commit feature is that it extends the window
    of uncommitted offsets beyond the set of in-flight records. While this is also
    Consumer.commitAsync() to a degree, commit will further compound the delay—up
    to the value of auto.commit.interval.ms. With in mind, asynchronous manual committing
    is preferred if the objective is to reduce the persisted offset while maintaining
    a decent performance profile. If, on the other hand, the objective is to curtail
    the persisted offset at any cost, the use of the synchronous Consumer.commitSync()
    method would be most appropriate. The latter may be fitting when the average time-cost
    of processing a record is high, and so replaying of records is highly undesirable.


    Enabling auto-commit may have a minor performance benefit in some cases. If ''cheap''
    to process (other records, handling is not resource-intensive), the poll-process
    cycle will be short, and manual committing will occur frequently. This frequent
    commit messages and increased bandwidth utilization. By setting a minimum interval
    between commits, the bandwidth efficiency is achieved with the expense of a longer
    uncommitted window. Of course, a similar effect may be achieved with a simple
    conditional expression that checks the last commit time and only commits if the
    offsets are stale (a simple local variable) for the next go-round.


    # Partition assignment strategy


    The partition.assignment.strategy property specifies a comma-separated list of
    org.apache.kafka.clients.consumer implementations (in the order of preference)
    that should be used to orchestrate partition assignment among members of a consumer
    group. The default value of this property is org.apache.kafka.clients.consumer.Range
    which assigns contiguous partition ranges to the members of the group.'
