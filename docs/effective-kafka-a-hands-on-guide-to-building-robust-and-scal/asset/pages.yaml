    The brokers operate within a dedicated network segment, which is separated from
    the ZooKeeper segment by way of a stateful firewall. This ensures that legitimate
    connections can be established from the brokers to the ZooKeeper nodes, but only
    those connections and nothing else. No other network segment is permitted to access
    the ZooKeeper segment. In practice, there may be a need to make specific exclusions
    for administrative purposes, so that authorized operators of Kafka are to make
    changes to the underlying ZooKeeper configuration, deploy software updates, and
    so forth.


    The next outermost segment is the internal client network. This includes producer,
    consumer and admin clients — essentially the full suite of internal applications
    that run on Kafka to shuttle event data. There may be such client networks, or
    the client network may be fragmented internally. This often happens in hybrid
    deployment topologies involving different sites. But the topology is more or less
    stable; in other words, we don''t expect entire sites to come and go on a whim.'
