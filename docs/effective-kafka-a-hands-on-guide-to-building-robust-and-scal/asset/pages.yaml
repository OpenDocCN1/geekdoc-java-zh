  md: '# Chapter 6: Design Considerations


    While this problem might not be trivially solvable, it can be readily compartmentalised.
    The use of a staged event-driven architecture (SEDA) offers a way of managing
    the complexity of diverse consumer requirements without negatively impacting the
    consumer applications directly or coupling the parties. Rather than feeding consumers
    off the producer-driven process, intermediate processing stages are employed to
    condition the data to conform to an individual consumer group’s expectations.
    These stages are replicated for each independent set of consumers, as shown in
    the diagram below.


    ![](img/a4d2c17b478048c90e0b48be89cde5c1_87_0.png)


    Under this model, the impedance mismatch is resolved by the intermediate stages,
    leading to improved maintainability of the overall solution and allowing each
    of the end-parties to operate strictly within the confines of their respective
    domain models. The responsibilities of the parties are unchanged; the consumer
    takes ownership of the conditioning stage, responsible for its development and
    upkeep. While this might initially appear like a zero-sum transfer, the benefit
    of this approach is in its modularity. It embraces the single responsibility principle,
    does not clutter the consumer with transformational logic, and can lead to a more
    sustainable solution.


    The acquired modularity may also lead to opportunities for component reuse. If
    two (or more) distinct consumer groups share similar data requirements, a common
    conditioning stage powers both consumer groups C and D. In the example above,
    a single conditioning stage powers both consumer groups C and D.


