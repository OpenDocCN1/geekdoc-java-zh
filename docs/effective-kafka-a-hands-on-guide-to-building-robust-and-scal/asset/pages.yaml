  md: '# Chapter 6: Design Considerations


    A downward effect on the ratio of partitions to brokers, taking the pressure off
    each connection. Confluent — one of the major contributors to Apache Kafka — recommends
    the number of partitions per broker to $100 \times b \times r$, where $b$ is the
    number of brokers in a Kafka cluster and $r$ is the replication factor.


    While a wider topic provides greater theoretical throughput, it does carry practical
    and immediate implications on the client and broker performance. The impacts of
    widening individual topics may not be substantial, but they may be felt in aggregate.
    This is not to say that topics should not be over-provisioned; rather, decisions
    regarding the sizing of the topics and the extent of over-provisioning should
    not be taken on a whim. The broker topology and the overall capacity of the cluster
    play a crucial role; these should be adequately specified and taken into consideration
    when sizing topics.


    If dealing with an existing topic that has saturated its capacity for consumer
    parallelism, consider a staged resize. Create a new topic of the desired size,
    using a tool such as *MirrorMaker* to replicate the contents onto the wider topic.
    When the replication catches up, switch the producers to double-publish to both
    the old and the new topics. There may need to be some downtime to allow for topic
    parity. Migrating consumers can start migrating to the new topic at their discretion;
    however, the misalignment of partitions may present a challenge with persisted
    offsets. As consumers have been designed with idempotency in mind, one should
    be able to set the `auto.offset.reset` property to earliest to force the reprocessing
    of the records from the beginning. Depending on the retention of the topic, this
    may take some time, which will also delay the consumers'' ability to produce new
    records. Alternatively, one can reset the offsets to a specific timestamp, which
    will substantially reduce the quantity of replayed records. Some reprocessing
    will likely be unavoidable; such is the price for resizing strongly-ordered topics.
    (The double-publishing code can be removed when all consumers have migrated.)


    # Scaling of the consumer group


    Kafka will allocate partitions approximately among members of a consumer group,
    up to the width of the topic. To increase parallelism, one must ensure sufficient
    consumer instances in the group. Allocating a fixed number of instances to the
    group is usually not economical, as it may result in idle capacity, particularly
    for event streams that exhibit cyclic or burst loading. The recommended approach
    is to employ an automated horizontal scaling technique to dynamically expand or
    contract the population of the group in response to load demand. For example,
    if deploying the consumer group within a public cloud environment like AWS, one
    may use an autoscaling to provide additional instances based on CPU utilisation
    metrics. Alternatively, if the consumer application is containerised, the use
    of a container orchestration platform is recommended. For example, when deployed
    in Kubernetes, one would employ horizontal pod autoscaling to dynamically size
    the consumer group.'
