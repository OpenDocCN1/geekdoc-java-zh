  md: '# Chapter 12: Batching and Compression


    Chapter 10: Client Configuration mostly attended to the aspects of client configuration
    related to functionality and safety, deliberately sidestepping any serious discussions
    on performance. The intent of this chapter is to focus on one specific area of
    performance optimisation — batching and compression. The two are related, collectively
    bearing a significant impact on the performance of an event streaming system.


    # Comparing disk and network I/O


    Kafka utilises a segmented, append-only log, largely limiting itself to sequential
    I/O for both reads and writes, which is fast across a wide variety of storage
    media. Disks are slow; however, the performance of storage media (particularly
    rotating media) is greatly dependent on access patterns. The performance of random
    I/O on a typical 7,200 RPM SATA disk is between three and four orders of magnitude
    slower than sequential I/O. Furthermore, a modern operating system provides read-ahead
    and write-behind techniques that prefetch data in block multiples and group logical
    writes into large physical writes. Because of this, the difference between sequential
    I/O and random I/O is still visible in flash and other forms of solid-state volatile
    media, although the effects are less dramatic compared to rotating media.


    Sequential I/O is comparable to the peak performance of network I/O. Furthermore,
    disk I/O is local to the host, where network I/O is shared. In practice, this
    means a well-designed log persistence layer will keep up with the network traffic.
    In often, the bottleneck of Kafka''s performance isn''t the disk, but the network.
    Stated bluntly, the network fabric will run out of steam from the broker.


    # Producer record batching


    To counter the limitations of the network, Kafka clients will batch multiple records
    before sending them over the network. This is independent of, and in addition
    to, the low-level batching provided by the OS at the TCP socket layer. Batching
    of records avoids the overhead of network round-trip, using larger packets and
    improving bandwidth efficiency.


    Batching in Kafka can act end-to-end. The producer client uses an accumulator
    buffer for staging records prior to forwarding them to the leader broker. Once
    the records are batched, the broker will (in most cases) persist them as-is, without
    unpacking the batch or performing any intermediate'
