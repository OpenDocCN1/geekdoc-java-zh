    about the implications of its adoption — both immediate and long-term.


    The principal inconvenience of a distributed system is that it shifts the complexity
    from the innards of a service implementation to the nordic fabric that spans across
    services. Some might say, it lifts the complexity from the micro level to the
    macro level. In doing so, it does not reduce the complexity; on the contrary,
    it increases the aggregate complexity of the combined solution. An astute engineer
    reading is well-aware of this. The reason a distributed architecture is chosen
    — assuming it is correct — to enable the conceptualisation of the problem domain.
    It can, if necessary, be decomposed into smaller chunks and solved in partial
    isolation, typically by different teams — then progressively integrated into a
    complete whole. In some cases, this decomposition is deliberate, whereby teams
    are organised around the problem. In other, lessideal cases, the breakdown of
    the problem is a reflection of Conway’s Law, conforming to organisational structures.
    Presumed to be the architect, or a senior engineering figure that orchestrates
    the decomposition, assuming the responsibility for ensuring the conceptual integrity
    and efficacy of the overall solution. Centralised communication may not always
    be present — some organisations have opted for a more democratic style, whereby
    teams act in concert to decompose the problem organically, with little influence.


    # Coupling


    Whichever the style of decomposition, the notion of macro complexity cannot be
    escaped. Fundamentally, components must communicate in one manner or another,
    and therein lies the problem: components are often inadvertently aware of each
    other. This is called coupling — the degree of interdependence between software
    components. The lower the coupling, the greater the propensity of the system to
    meet new requirements, performance demands, and operational challenges. Conversely,
    tight coupling shackles the components of the system, increasing their mutual
    reliance and impeding their evolution.


    There are known ways for alleviating the problem of coupling, such as the use
    of an asynchronous communication style and message-oriented middleware to segment
    components. These techniques have been used to varying degrees of success; there
    are times when message-based communication has created a false economy — collaborating
    components may be transitively dependent upon one another in spite of their designers''
    best efforts to forge opaque conduits between them.


    # Resilience


    It would rather nice if computers never failed and networks were reliable; as
    it happens, reality differs. The problem is exacerbated in a distributed context:
    the likelihood of any one component experiencing an isolated failure increases
    with the total number of components, which carries negative ramifications if components
    are interdependent.'
