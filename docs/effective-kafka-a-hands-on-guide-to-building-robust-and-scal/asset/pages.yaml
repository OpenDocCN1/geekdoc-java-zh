  md: '# Common authorization scenarios


    Although there are numerous supported operations and resource types supported
    by Kafka''s authorization model, the majority of authorization needs fall under
    a handful of use cases. These are presented here.


    # Creating topics


    The creation of a topic requires Create privileges on the Topic resource type.
    The topic name can be literal, although more often topic creation and publishing
    rights are granted over a prefixed resource pattern. In the example below, user
    bob is granted permission to create any topic that begins with the string prefixes...


    ```

    $KAFKA_HOME/bin/kafka-acls.sh \

    --command-config $KAFKA_HOME/config/client.properties \nn--bootstrap-server localhost:9094
    \

    --add --allow-principal User:bob \\

    --resource-pattern-type-prefixed \\

    --operation Create --topic prices.

    ```


    # Deleting topics


    Topic deletion privileges are the logical opposite of creation, replacing the
    Create operate with Delete:


    ```

    $KAFKA_HOME/bin/kafka-acls.sh \

    --command-config $KAFKA_HOME/config/client.properties \nn--bootstrap-server localhost:9094
    \

    --add --allow-principal User:bob \\

    --resource-pattern-type-prefixed \\

    --operation Delete --topic prices.

    ```


    # Publishing to a topic


    Like creating a topic, publishing is often granted as a prefixed permission —
    requiring Write capability on the Topic resource type.'
