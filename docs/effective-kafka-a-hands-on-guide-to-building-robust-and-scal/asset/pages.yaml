    # # Rotation of log segments


    With the basics covered, we arrive at the most crucial part of our preamble —
    the rotation of log segments. Specifically, it is the log rotation behaviour that
    has the greatest potential to cause confusion in relation to Kafka’s data retention
    mechanisms that will be discussed shortly.


    A replica maintains a active log segment for every partition that it hosts. The
    active segment corresponds to the head end of the log. All writes performed by
    producers are appended to the active log segment, while consumer reads occur from
    any segment in the log. For a given active segment, no entity other a producer
    is permitted to modify the segment and its corresponding index bytes; this constraint
    is perfectly intuitive in relation to the append-only nature of a log in Kafka.


    At some point, the active segment will reach a set of predefined constraints that,
    when breached, will trigger a roll-over. These constraints are defined by the
    following properties:


    +   - log.segment.bytes — the maximum size of a single log file. Defaults to 1073741824
    (1 GiB).

    - log.roll.hours — the maximum amount of time (in hours) that an active segment
    is allowed to exist before being closed. The default value is 168 (one week).
    The age of a segment is derived by subtracting the timestamp of the first record
    from the current time. The size-based and time-based properties are complementary
    — tripping either of these thresholds is sufficient to initiate a roll-over.

    - log.roll.ms — where the use of hours to specify the roll-over does not provide
    sufficient granularity, this property may be used to specify the threshold with
    millisecond precision. When set, this property supersedes log.roll.hours.


    Replicas typically host multiple log files, particularly when dealing with ‘wide’
    topics (i.e. with lots of partitions). It is likely that when a log segment reaches
    its roll-over, other log segments would have reached theirs, or are just about
    to. To prevent a stampede of I/O requests, a broker will introduce a random amount
    of jitter — an artificial delay from the time a roll-over of multiple log segments
    over a larger time. The jitter values apply to the log.roll.hours and log.roll.ms
    settings, and are named log.roll.jitter.hours and log.roll.jitter.ms, respectively.
    No jitter is applied by default.


    The properties listed above represent the baseline configuration applicable to
    all topics, and may be updated statically or dynamically, but cannot be used to
    target individual topics. There are equivalent per-topic properties that can be
    set dynamically:


    +   - segment.bytes — in place of log.segment.bytes.

    - segment.ms — in place of log.roll.ms.

    - segment.jitter.ms — in place of log.roll.jitter.ms.'
