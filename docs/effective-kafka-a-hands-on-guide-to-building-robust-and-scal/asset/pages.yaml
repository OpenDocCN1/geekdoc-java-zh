  md: '# Chapter 4: Installation


    [2019-12-25 13:30:36,951] WAR Either no config or quorum defined []

    in config, running in standalone mode (org.apache.zookeeper).

    server.quorum.QuorumPeerMain


    All this is saying that we started ZooKeeper in standalone mode, without configuring
    a quorum. When running ZooKeeper locally, availability is rarely a concern, and
    a standalone (of one member node) configuration is sufficient.


    > Recall from a discussion on the Kafka architecture, it was stated that ZooKeeper
    acts as an arbiter — electing a controller over the available Kafka broker nodes.
    Internally, ZooKeeper employs an atomic broadcast protocol to agree and subsequently
    maintain a consistent view of the cluster state throughout the ZooKeeper ensemble.
    This protocol operates on the concept of a majority vote, also known as quorum,
    which in turn, requires an order of participating ZooKeeper nodes. When running
    in a production environment, ensure that at least three nodes are deployed in
    a manner that no pair of nodes are impacted by the same contingency. Ideally,
    ZooKeeper should be deployed in geographically separate data centres.


