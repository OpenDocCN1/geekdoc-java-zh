  md: '# Chapter 1: Event Streaming Fundamentals


    An event-driven system formally consists of emitters (also known as producers
    and agents), consumers (also known as subscribers and sinks), and channels (also
    known as brokers). We also use the term upstream — to refer to the elements prior
    to a given element in the event-consumer relation, and downstream — to refer to
    the subsequent elements.


    An emitter is not aware of any of the event''s downstream consumers. This statement
    captures the essence of an event-driven architecture. An emitter does not know
    whether a consumer exists; every transmission of an event is effectively a ''blind''
    broadcast. Likewise, consumers react to respect events without the knowledge of
    the particular emitter that published the event. A consumer need not be the final
    destination of the event; the event notification may be persisted or transformed
    by the consumer before broadcasting to the next stage in a notional pipeline.
    In other words, an event may spawn events; elements in an event-driven architecture
    may combine the roles of emitters and consumers, simultaneously acting as both.


    Event notifications are immutable. An event cannot modify an event''s representation
    once it has been emitted, even if it is the original emitter. At most, it can
    emit new notifications relating to that event — enriching, refining, or using
    the original intention.


    # Coupling


    Elements within EDA are exceedingly loosely coupled, to the point that they are
    largely unaware of one another. Emitters and consumers are only coupled to the
    intermediate channels, as well as to the representations of events — schemas.
    While coupling invariably remains, in practice, EDA offers the lowest degree of
    coupling of any practical system. The collaborating components become largely
    autonomous, standalone systems that operate in their own right — each with their
    individual set of stakeholders, operational teams, and governance mechanisms.


    By of example, an e-commerce system might emit events for product purchase, detailing
    the time, product type, quantity, the identity of the customer, and so on. Downstream
    of the emitter, two systems — a business intelligence (BI) platform and an enterprise
    resource planning (ERP) platform — might reach to the sales events and build their
    own sets of materialised views. (In effect, view-only projections of the emitter''s
    state.) Each of these platforms are completely independent systems with their
    own stakeholders: the BI system satisfies the business reporting and analytics
    requirements for the marketing business unit, while the ERP system supports chain
    management and capacity planning — the remit of an entirely different unit.


    To put things into perspective, we should consider the potential solutions to
    this problem in the absence of EDA. There are several ways one could have approached
    the solution; each approach commonly found in the industry to this day:


    +   1. Build a monolith. Conceptually, the simplest approach, requiring a system
    to fulfill all requirements and cater to all stakeholders as an indivisible unit.

    2. Integration. Allow the systems to invoke one another via some form of an API.
    Either the e-commerce platform could invoke the BI and ERP platforms at the point
    of sale, or the BI and ERP platforms could invoke the e-commerce platform APIs
    before generating a business'
