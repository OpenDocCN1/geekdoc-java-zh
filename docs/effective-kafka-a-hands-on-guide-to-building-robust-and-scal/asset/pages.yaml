  md: '# Installing Kafdrop


    Next on our list is Kafdrop. It''s a Java application with no dependencies, and
    the avenues for installing it are most similar to Kafka, except it does not package-based
    installation. In practice, Docker greatly alleviates the need for packages, and
    the sheer number of Kafdrop Docker pulls (over a million at the time of writing)
    is a testament to that.


    As practical as a Docker image may be, we are going to ditch this option for now.
    Because we are running Kafka on localhost, Docker will struggle to connect to
    our broker, as Docker containers are normally unaware of processes running on
    the host machine. There is a way to change this but it is not portable across
    Linux and macOS, and will also require changes to the Kafka broker configuration
    — something we are not prepared to do. We will revisit Kafdrop later. For now,
