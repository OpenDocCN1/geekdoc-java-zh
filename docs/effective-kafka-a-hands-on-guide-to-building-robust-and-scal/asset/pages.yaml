  md: '# Chapter 15: Group Membership and Partition Assignment


    The safety property is achieved by conveying an exclusive partition assignment,
    on the assumption that the assignment is commensurably honoured on the consumers.
    We previously looked at process fencing as a mechanism for ensuring partition
    exclusivity among consumers. Static membership, coupled with an external orchestrator,
    offers a straightforward implementation path for the fencing strategy. The process
    health check will factor into account the poll time — reporting a heavily backlogged
    process as failed. The orchestrator will restart the consumer process, causing
    it to rejoin with its group instance ID, restoring any prior assignments. The
    consumer''s progress in the stream will be reset to the last committed offsets,
    allowing it to repro the last batch. The combination of locking sections and process
    fencing effectively neutralises any residual likelihood of a ''zombie'' process.


    # Mixing membership models


    The static membership model on its own is generally incompatible with the notion
    of consumer elasticity. With a programmatic assignment of the group.instance.id
    property, it is possible to accommodate the scale-up scenario. A newly spawned
    static consumer joining a group would acquire a share of partitions, working in
    much the way as a dynamic consumer. The problem occurs on the scale-down path:
    a terminated static consumer will lead to partition unavailability for the period
    of session.timeout.ms, which has presumably increased as part of switching to
    static membership. In other words, scale-up will be responsive while scale-down
    will be sluggish.


    It is possible to mix elastic and inelastic consumers in the same consumer group.
    Consider a case where an application is experiencing a constant load throughout
    the day. Occasionally, the load peaks over the routine threshold, requiring additional
    burst capacity to process the stream. Assuming that throughput takes priority
    over latency and occasional partition pauses are acceptable, the consumer population
    might comprise a mixture of statically-configured and dynamic consumers. When
    utilising public cloud infrastructure, it is more-effective to provide long-term
    capacity for fixed loads, while utilising ephemeral instances (e.g. Spot Instances
    in AWS) for spillover capacity. Kafka''s static membership feature doves nicely
    into this model.


    When consumer types change, dynamic consumers should be configured differently
    for the session.timeout.ms property. Dynamic consumers will have a much shorter
    session.timeout.ms deadline, leading Kafka manage consumer lifetimes. Static consumers
    will have a more relaxed session.timeout.ms deadline, but will also typically
    use another orchestrator with a more aggressive health interval.


    # Partition assignment strategy


    All considerations around group membership ultimately serve one purpose — to ensure
    that partitions are assigned among the members of a consumer group. As previously
    discussed, partition assignment takes place on a single consumer — the leader
    of the group.


    The principal motivation for performing custom assignment on a consumer process
    is that it enables the application developers to substitute one of the assignment
    strategies with a custom one,'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Chapter 15: Group Membership and Partition Assignment


    without having to include the implementation of the custom strategy in the classpath
    of each of the broker nodes. This is particularly crucial when a cluster is being
    utilised in a multitenancy arrangement, where different teams or even paying customers
    share the same set of brokers. It would be intractable to redeploy a broker upon
    change to the rebalancing strategy, due to the disruption which would cause to
    all clients. On the consumer-led model, one can easily roll out an update to the
    assignment strategy by redeploying the consumers, with no change or interruption
    to the Kafka cluster.


    One of the challenges of the consumer-led model is the possible disagreement as
    the preferred assignor implementation among the population of consumers. The leader
    will attempt to determine the most-agreed-upon strategy from the list of preferred
    strategies submitted by each member. If no common strategy can be agreed upon,
    the leader will return an error to the coordinator, which will be propagated to
    the remaining group members.


    A consumer specifies its preferred assignors by supplying a list of their fully-qualified
    class names via the partition.assignment strategy property. The assignor must
    conform to the org.apache.kafka.clients.ConsumerPartitionAssignor interface. The
    assignors appear in the order of priority; the first assignor is the highest priority,
    followed by the next, and so on.


    Although assignments are specified as class names, they are communicated using
    their symbolic synchronisation phase of the protocol. This allows for interoperability
    between different client implementations – for example, Java clients interspersed
    with Python clients. As long as the assignor name matches, the consumers can agree
    on a common one.


    # Built-in assignors


    There are four built-in assignors at one''s disposal. At an overview level, these
    are:


    +   1. RangeAssignor: the default assignor implied in the client configuration.
    The range assignor works by laying out the partitions for a single subscribed
    topic in numeric order and the consumers in lexicographic order. The number of
    partitions is then divided by the number of consumers to determine the difference
    of partitions each consumer will receive. Since the two might not divide evenly,
    the first few consumers may receive an extra partition. This process is repeated
    for each subscribed topic.

    2. RoundRobinAssignor: allocates partitions in a round-robin fashion. The round-robin
    assignor works by laying out partitions across all subscribed topics in one list,
    assigning one partition to the first consumer, the second partition to the next
    consumer, and so on – all partitions have been assigned. When the number of consumers
    is exhausted, the algorithm rotates back to the first consumer.

    3. StickyAssignor: maintains an evenly-balanced distribution of partitions while
    preserving the prior assignment as much as possible, minimising the difference
    in the allocations between successive assignors.

    4. CooperativeStickyAssignor: a variant of the sticky assignor that utilises the
    newer cooperative rebalancing protocol to reduce the stop-the-world pause.'
