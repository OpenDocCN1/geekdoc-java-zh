  md: '# Chapter 10: Client Configuration


    A comprehensive discussion of this topic is presented in Chapter 15: Group Membership
    and Partition Assignment. In summary, partition assignment occurs on one of the
    members of the group — the group leader. In order for assignment to proceed, members
    must agree on a common strategy — constrained by the assigners in the intersection
    of the (ordered) sets of assigners across all members.


    > The reader would have picked up on such terms as ''group leader'' and ''group
    coordinator'' throughout the course of this chapter. They refer to different entities.
    The group leader is a consumer client that is responsible for performing partition
    assignment. On the other hand, the group coordinator is a broker that arbitrates
    group membership.


    Changing assigners can be tricky, the group must always agree on at least one
    assignor. When migrating from one assignor to another, start by specifying both
    assigners (in either order) in partition.assignment.strategy and bouncing consumers
    until all members have joined the group with both assigners. Then perform the
    second round of bouncing, removing the outgoing assignor from partition.assignment.strategy
    leaving only the preferred assignor over the conclusion of the round. When migrating
    from the default ''range'' assignor, make sure it is added explicitly to the partition.assignment.strategy
    list prior to performing the first round of bounces.


    # Transactions


    The isolation.level property controls the visibility of records written within
    a pending transaction scope where a transaction has commenced but not yet completed.
    The default isolation level is read_committed, which has the effect of returning
    all records from Consumer.poll(), irrespective of whether they are part of a transaction,
    and if so whether the transaction has been committed.


    Conversely, the read_committed isolation mode will return all non-transactional
    records, as well as those transactional which have successfully been committed.
    Because the read_committed isolation level conceals any pending records from poll(),
    it will also conceal following records, irrespective of whether they are part
    of a transaction — to maintain strict order from a consumer''s perspective.


    For a more in-depth discussion on Kafka transactions, the reader may consult Chapter
    18: Transactions.


    # Admin client configuration


    The admin client does not have any unique configuration properties of its own;
    the properties are shared with the producer and consumer clients.


    There is a difference in the construction of a KafkaAdminClient, compared to its
    KafkaProducer and KafkaConsumer siblings. The latter are instantiated directly
    using a constructor, as we have seen in the examples far. KafkaAdminClient does
    not expose a public constructor.'
