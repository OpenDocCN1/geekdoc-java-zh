- img_proc: true
  md: '# Chapter 4: Installation


    +   3. Clone the Kafka and ZooKeeper repositories and build from source code.


    +   4. Download and unpack the official Kafka distribution from kafka.apache.org/downloads¹,
    which comes bundled with ZooKeeper.


    Let''s briefly touch upon each of these options. It might sound like overkill
    first — we could pick the easiest and get cracking — but we''re in it for the
    long haul. And sometimes the easiest approach isn''t the right one.


    Docker is an excellent all-round approach for getting started with Kafka, developing
    a local Kafka broker, and even running Kafka in a production configuration. And
    best of all, a Docker image will come with an appropriate version of the JDK.


    There is one drawback, Kafka in Docker is notoriously difficult to configure,
    as everything is baked in and not designed for change. (That''s not to say it
    can''t be done) We won''t go the Docker path for now, just because we will be
    making changes to the broker configuration at various points along our journey,
    and ideally, we would want this to be as simple and painless as possible.


    Installing Kafka and ZooKeeper from a package is convenient to too. And if it
    doesn''t come bundled with a JDK, a package will typically declare JDK as a dependency,
    which the package manager will attempt to resolve at the point of installation
    (or when updating the package). Still, this approach isn''t without its drawbacks:
    there may be other applications installed on the target machine that might require
    a different version of the JDK, would warrant further configuration of Kafka and
    ZooKeeper to wire it up to the correct JDK.


    Another drawback to the ''packaged Kafka'' approach is that the installation path
    and the layout of the files will vary depending on the chosen package manager.
    For example, on macOS, Homebrew installs Kafka into /usr/local/etc,/usr/local/bin,
    and /usr/local/var/lib/. On the other hand, YUM will install it under /bin,/opt,
    and /var/lib/. This makes it tremendously difficult to write and include examples
    that work consistently for all readers. Rather than focusing on the subject matter,
    this book would have been polluted with excerpts and call-outs targeting different
    operating systems and package managers.


    The third option is building from source code. It might sound a bit extreme for
    someone who has just opened a book on Kafka. Nonetheless, it is a valid option
    and the only option if you happen to be a contributor. Unexpectedly, we won''t
    delve into it much deeper, and blissfully pretend it doesn''t exist — at least
    in the universe bound by this.


    The final option, and the one we will inevitably proceed with, is to download
    the latest version of the official Kafka tarball from kafka.apache.org/downloads².
    There might be several options — pick one in ''Binary downloads'' that targets
    the latest version of Scala, as shown in the screenshot


    > https://kafka.apache.org/downloads


    > https://kafka.apache.org/downloads'
