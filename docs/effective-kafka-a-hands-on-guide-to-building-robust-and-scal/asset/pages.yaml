  md: "# Chapter 16: Security\n\n```\nJAAS_CONFIG=$KAFKA_HOME/config/kafka_server_jaas.conf\
    \ \\\nKAFKA_OPTS=-Djava.security.auth.login.config=$JAAS_CONFIG \\\n$KAFKA_HOME/bin/zookeeper-security-migration.sh\
    \ \\\n  -zookeeper.connect localhost:2181 \\\n  -zookeeper.acl secure\n```\n\n\
    This operation will take a few seconds and exit without outputting anything to\
    \ the console.\n\nThe migration step is only necessary for existing ZooKeeper\
    \ ensembles that have previously initialised by Kafka. Fresh ZooKeeper installations\
    \ (with no prior data) will function securely without migration, provided that\
    \ SASL has been enabled prior to connecting Kafka brokers.\n\n# Configure the\
