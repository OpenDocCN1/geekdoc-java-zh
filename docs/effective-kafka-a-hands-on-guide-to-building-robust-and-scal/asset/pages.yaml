  md: "# Chapter 5: Getting Started\n\nAmong the useful characteristics of tools such\
    \ as Kafdrop and the Kafka CLI is the ability to enumerate and monitor individual\
    \ consumer groups — inspect the per-partition lags and spot indicators of degraded\
    \ consumer performance or, in the worst-case scenario, a stalled consumer. Much\
    \ like any other middleware, a solid comprehension of the available tooling —\
    \ be it the built-in or the external tools — is essential to effective operation.\
    \ This is particularly crucial for overseeing mission-critical systems in production\
    \ environments, where minutes of downtime and the fruitless head-scratching of\
    \ the engineering and support counsel can result in significant incurred costs.\n\
    \nSo there you have it. We have published and consumed records from a Kafka topic\
    \ using the built-in CLI tools. It isn't much, but it's a start.\n\n# Useful CLI\
