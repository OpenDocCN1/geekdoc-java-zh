    237


    > The coordinator of each group is implicitly selected from the partition leaders
    of the internal topic __consumer_offsets, which is used to store committed offsets.
    The group''s ID is hashed to one of partitions for the __consumer_offsets topic
    and the leader of that partition is to the coordinator. By piggybacking on an
    existing election process, Kafka conveniently avoids another arbitration process
    to elect group coordinators. Also, the management of consumer groups is divided
    approximately across all the brokers in the cluster, which allows the number of
    groups to scale by increasing the number of brokers.


    # State synchronisation


    The responsibility of assigning topic-partitions to consumers falls upon the group
    leader, and is performed in the state synchronisation phase of the protocol. The
    assignment (sub)-protocol is conveniently tunneled within the broader group management
    protocol and is concealed from the coordinator – in the sense that the coordinator
    largely treats the contents of state synchronisation messages as a ''black box''.
    As such, the assignment protocol is referred to as an embedded protocol. Other
    embedded protocols may coexist, tunneled in the same manner, bearing no relation
    to partition assignment.


    To make it abundant, the terms ''group leader'' and ''group coordinator'' refer
    to different entities. The group leader is a consumer client that is responsible
    for performing partition assignment; the group coordinator is a broker that arbitrates
    group membership.


    Once group membership has been established by the completion of the first phase,
    the coordinator will enter the WaitSync state, waiting for the partition assignment
    to be performed by the leader. The leader will delegate to an implementation of
    a ConsumerPartitionAssignor to perform partition assignment, communicating the
    outcome of the assignment to the coordinator in a SyncGroupRequest.


    In the meantime, all members will send their SyncGroupRequest messages to the
    coordinator. Having received the SyncGroupRequest from the leader, containing
    the partition assignments for each member, the coordinator replies with a SyncResponse
    to all members of the group – informing them of their individual partition assignments
    and completing the protocol. Having done so, the coordinator enters the Stable
    state, and will maintain this state until group membership changes.


    > As version 0.9.0.0, Kafka separates the management of group membership from
    partition assignment. While group arbitration is performed on the coordinator,
    the partition assignment is delegated to one of the members – the group leader.
    Before Kafka 0.9.0.0, the coordinator was responsible for both functions.


    # Delayed rebalance


    Having the coordinator reply a JoinGroupResponse immediately after all expected
    members have joined generally works well when a group is undergoing minor changes
    in population – for'
