  md: 'Chapter 15: Group Membership and Partition Assignment


    # Range assignor


    The range assignor, along with the round-robin assignor, is among the two of the
    oldest assignors in Kafka''s arsenal. The range assignor is the default, yielding
    contiguous partition numbers for consumers. (This is easier on the one, not that
    it matters much.) To understand how it works, consider the following scenario,
    a topic with eight partitions is grown from one consumer to two, then to three,
    and finally, to four consumers. Initially, consumer assignments would resemble
    the following:


    | Consumer | Partitions |

    |---|-|

    | C0 | P0, P1, P2, P3, P4, P5, P6, P7 |


    With the addition of a second consumer, the partition assignments would be altered
    to:


    | Consumer | Partitions |

    |---|-|

    | C0 | P0, P1, P2, P3 |

    | C1 | P4, P5, P6, P7 |


    Comparing the two states, we arrive at the following delta:


    | Consumer | Assigned | Revoked |

    |---|---|-|

    | C0 | | |

    | C1 | P4, P5, P6, P7 |


    The change encompasses four assignments and four revocations across consumers
    — four swaps, so to speak. This is on par with the best assignment scheme, representing
    the optimal outcome, in terms of minimising reassignments and maintaining an evenly-balanced
    consumer group. By ‘evenly-balanced’, it is meant that the difference between
    the partition count of the largest allocation and that of the smallest allocation
    cannot exceed one.


    Now consider the addition of a third consumer:


    | Consumer | Partitions |

    |---|-|

    | C0 | P0, P1, P2 |

    | C1 | P3, P4, P5 |

    | C2 | P6, P7 |


    | Consumer | Assigned | Revoked |

    |---|---|-|

    | C0 | | P3 |

    | C1 | P3 | P6, P7 |

    | C2 | | |


    There are three swaps in this scenario. How would this compare to an optimal assignment?
    To maintain even balance with minimal reshuffling, we would simply revoke P3 from
    C0 and P7 from C1, transferring them to C2:'
