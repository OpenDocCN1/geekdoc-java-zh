  md: '# Chapter 14: Data Retention


    Both strategies can co-exist. This section will focus on the delete strategy;
    the following section will address compaction.


    The cleanup policy can be assigned via the log.cleanup.policy broker property,
    which takes a comma-separated list of policy values delete and compact. The default
    is delete. This setting can be assigned statically or dynamically, acting as a
    cross-topic default. A topic-specific policy can be assigned via the cleanup.policy
    property — overriding the default log.cleanup.policy for the topic in question.


    The delete policy operates at the granularity of log segments. A background process,
    operating within a replica, looks at each inactive log segment to determine whether
    a segment is eligible for deletion. The thresholds constrain the retention of
    log segments are:


    +   - log.retention.bytes — the maximum allowable size of the log before its segments
    may be pruned, sometimes with the tail segment. This value is not set by default
    as most retention requirements are specified in terms of time, rather than size.

    - log.retention.hours — the number of hours to keep a log segment before deleting
    it. The default value is 168 (one week). The size-based and time-based properties
    are complementary; the breach of any of the two constraints is sufficient to trigger
    segment deletion.

    - log.retention.minutes — specifies the retention in minutes, where hours fail
    to provide sufficient granularity. If set, this property overrides the log.retention.hours.

    - log.retention.ms — specifies the retention in milliseconds, overriding the log.retention.hours.


    The background process checks files at an interval specified by log.retention.check_interval.ms,
    defaulting to 300000 (five minutes). This is sufficient for retention settings
    where the lifetime of a log is measured in hours, days or weeks. When setting
    the deletion policy over smaller time frames, it may be necessary to wind this
    down to decrease the time between successive checks.


    As stated in Chapter 3: Architecture and Core Concepts, the deletion of records
    results in the advancement of the beginning offsets (also as the low-water marker)
    to the point of the first preserved record. This happens automatically as log
    segments are deleted.


    Because the delete policy is a log policy, it may be necessary to adjust the maximum
    size of a segment depending on one''s expectations on the responsiveness of the
    deletion process. Suppose there was a requirement that a record should not be
    longer than seven days, but at least five days of retention is required. Setting
    log.retention.hours to 168 (seven days) would satisfy the lower bound of five
    days, but depending on how long it takes for the active segment to roll over,
    the upper might not be satisfied. Recall, only producer-initiated writes are allowed
    on the active segment; all modifications — deletion and compaction — may only
    occur on the inactive segment. With the default settings in place, log files are
    not rotated unless they either reach a maturity of seven days or grow to 1 GiB
    in size. To satisfy the upper bound, we must constrain the lifetime of a log segment
    so that it rolls over within a more suitable time frame. For example, we might
    set log.retention.hours to 132 (five days and twelve hours) and log.roll.hours
    to 24, forcing a collection after six-and-a-half days.'
