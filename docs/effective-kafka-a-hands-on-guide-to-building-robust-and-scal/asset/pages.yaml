  md: '# Chapter 7: Serialization


    The first problem — missing domain objects or the lack of knowledge of certain
    record schemas the two are logically equivalent) — can be attributed to several
    causes:


    +   - The Kafka topic is coarse-grained, containing more types of records that
    the consumer legitimately requires for routine operation.

    - The record types may be known to the consumer, but it may have no interest in
    processing them. For example, a topic might represent a global database, whereas
    a consumer deployed in a single region might only care about the subset of customers
    in its locality.

    - The record structure has evolved over time, such that the topic may contain
    records that to varying schema versions. To accommodate the gradual transition
    of consumers to a newer schema, producers will typically publish the record in
    multiple versions.


    At any rate, the consumer will selectively parse the record''s value on the basis
    of some explicit indicator. This indicator may be a well-known header — for example,
    recordType: CREATE_CUSTOMER, region: Asia-Pacific, version: 2. Alternatively,
    the indicator may be inferred from the record''s value without having to parse
    the entire payload, alone mapping the payload to a POJO. For example, the Jackson
    library allows you to create a custom deserializer that can inspect the document
    object before deciding to map it to an existing Java class.


    > In some cases, filtering records within the business logic is a valid approach,
    particularly when the filtering requires deep inspection of the record''s payload
    or are related to the current application state.


    The final point relates to performance. While premature optimisation should be
    avoided, there may be legitimate cases where the sheer amount of data on a topic
    places a strain on the consumer ecosystem, particularly when the topic is coarse-grained.
    If the options for increasing the granularity of topics and the scaling of consumers
    have been exhausted, the sole remaining option might be to pre-filter records
    in an attempt to extract the last ounce of performance. Sounds terrible? Agreed!
    The recommendation is to avoid complexity on the basis of performance alone. Instead,
    the application should be architected from the outset to cope with the expected
    load.


    Kafka’s idiomatic approach for dealing with varying record representations is
    through custom (de)serializers. Once implemented and configured, (de)serializers
    work behind the scenes, accepting and delivering native-record keys and values
    via a generically typed API. The producer application is expected to address the
    Producer implementation detail directly, while on the consumer-end, this approach
    is often paired with a simple poll-process loop.


    This chapter has explored some of the typical concerns of producer and consumer
    applications, arguing for the use of an abstraction layer to separate Kafka-specific
    messaging code from the'
