  md: '# Chapter 3: Architecture and Core Concepts


    # 42


    ![](img/a4d2c17b478048c90e0b48be89cde5c1_48_0.png)


    The key takeaways are:


    +   - A cluster hosts multiple topics, each having an assigned leader and zero
    or more follower replicas.

    - Topics are subdivided into partitions, with each partition forming an independent,
    totally-ordered sequence within a wide, partially-ordered stream.

    - Multiple producers are able to publish to a topic, picking a partition at will.
    The partition may be selected directly – by specifying a partition number, or
    indirectly – by way of a record key, which deterministically hashes to a partition
    number.

    - Partitions in a topic can be load-balanced across a population of consumers
    in a consumer group, allocating partitions approximately evenly among the members
    of that group.

    - A consumer in a group is not guaranteed a partition assignment. Where the group’s
    population outperforms the partitions, some consumers will remain idle until this
    balance equals or tips in favour of the other side.'
  merge: -1
  pgno: 48
