    The DirectReceiver maintains a single polling thread. Rather than incorporating
    threading from first principles, the examples in this book use the Fulcrum micro-library,
    available at github.com/obsidiandynamics/. Specifically, the examples import the
    fulcrum-worker module, which provides complete life-cycle management on top conventional
    java.lang.Thread. A FulcrumWorker class provides an opinionated set of controls
    and templates that standardise all aspects of a thread''s behaviour — the initial
    startup, steady-state operation, interrupt-triggered termination, and exception
    handling. These are typical concerns in multi-threaded applications, which are
    difficult to get and require a copious amount of non-trivial boilerplate code
    to adequately cover all the edge cases.


    Our receiver takes three parameters — a map of configuration properties for the
    Kafka consumer, the name of the topic to subscribe, and a timeout value to use
    in Consumer.poll(). Like its DirectSender, the DirectReceiver will overwrite every
    event in the user-specified map — are required for the correct operation of the
    receiver and should not be interfered with by external code.


    The onPollCycle method represents a single iteration of the poll-process loop.
    Its role is straightforward — fetches records from Kafka, constructing a corresponding
    KeyEvent, and dispatch the event to all registered listeners. Once all records
    in the batch have been dispatched, the commitAsync() of the consumer is invoked,
    which will have the effect of asynchronously committing the offsets for records
    fetched in the last call to poll(). Being asynchronous, the client will dispatch
    the request in a background thread, waiting for the commit response from the brokers;
    the responses will answer at an indeterminate time in the future, commitAsync()
    returns.


    > The use of commitAsync() makes it possible to process multiple batches before
    committing the first are reflected on the brokers, increasing the window of uncommitted
    records. And this will lead to a greater number of repeated records following
    partition reassignment, this behaviour is still consistent with the concept of
    at-least-once delivery.

    Using the blocking commitSync() variant reduces the number of uncommitted records
    in-flight at the expense of throughput. Unless the cost of processing a record
    is very high, the asynchronous commit model is generally preferred.


    Finally, the close() method disposes of the receiver by terminating the polling
    thread, awaiting its termination, then the Kafka consumer.


    Notice how we have caught an odd-looking org.apache.kafka.common.errors.InterruptException
    in the body of the onPollCycle() method, re-throwing a java.lang.InterruptedException
    in its place. This is because the idiosyncrasies of the Kafka API — are traceable
    to Scala,


    https://github.com/obsidiandynamics/fulcrum'
