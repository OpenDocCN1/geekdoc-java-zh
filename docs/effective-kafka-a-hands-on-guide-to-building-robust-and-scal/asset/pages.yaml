    # Configuring clients


    Delegation tokens are passed similarly to credentials, using the SASL/SCRAM method.
    The username attribute is set to the token ID, with the password attribute is
    assigned the HMAC value from the table. In addition to these attributes, a third
    attribute tokenauth must be present, set to true. This attribute distinguishes
    authentication from conventional username/password authentication.


    ```

    final var sasJaasConfig = loginModuleClass

