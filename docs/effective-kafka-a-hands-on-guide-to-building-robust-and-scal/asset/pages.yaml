    \n# Rotating secrets\n\nKafka does not yet have an elegant mechanism for rotating\
    \ the shared secret. This is currently a three-step process:\n\n+   * Expire all\
    \ tokens.\n* Perform a rolling bounce of the cluster with the new secret.\n* Generate\
    \ and distribute new tokens.\n\nAs tokens are verified only during connection\
    \ establishment, all clients that are already connected will continue to function\
    \ normally. New connections using old tokens will be rejected, as will any attempt\
    \ to renew or expire tokens.\n\n# ZooKeeper authentication\n\nThe final stretch\
    \ in our authentication journey is hardening the link between the brokers and\
    \ the ZooKeeper ensemble. ZooKeeper supports SASL client authentication using\
    \ the DIGEST-MD5 method. In our context, the client is the Kafka broker or a CLI\
    \ tool.\n\n> ZooKeeper authentication powers its authorization model, which is\
    \ implemented by way of Access Control List (ACL). An ACL applies individually\
    \ to each node, in a manner that is similar to UNIX file and directory permissions.\n\
    \nZooKeeper supports the following permission types on nodes:\n\n+   * CREATE:\
    \ create a child node.\n* READ: get data from a node and list its children.\n\
    * WRITE: set data for a node.\n* DELETE: delete a child node.\n* ADMIN: set permissions.\n\
    \nPermissions are recorded against a node in a list. Each element is a triplet,\
    \ comprising the authentication scheme, the allowed principal, and the set of\
    \ permissions. There are several built-in schemes. The two notable that apply\
    \ in our context are world — meaning anyone (including unauthenticated users),\
    \ and sasl — referring to a user that has been authenticated via SASL."
