    still something to be wary of.


    # Type-safe configuration


    When bootstrapping Kafka client configuration from code or loading configuration
    artifacts from an external source, the recommended approach is to craft dedicated
    Java classes with strongly typed values, representing the complete set of configuration
    items that one can reasonably expect to be supplied when their application is
    run. The external configuration documents can then be mapped to an object using
    a JSON or YAML parser. It is also possible to use a plain .properties file if
    the configuration structure is flat. Alternatively, if using an application framework
    like Spring Boot or Micronaut, the built-in configuration mechanism which supports
    all three formats.


    If it is necessary to use free-form configuration in addition to some number of
    expected items, add a Map<String, Object> attribute to the configuration class.
    When staging the Kafka configuration, apply the free-form properties first, then
    apply the expected ones. When applying the expected properties, check if the staging
    configuration already has a value set — if it does, throw a runtime exception.
    While this doesn''t protect against misspelt property names in the free-form section,
    it will at least ensure that the expected configuration takes precedence.


    For cases where there is an absolute requirement for the property names to be
    correct before initialisation, one can take their validation step first: The java.lang.reflect
    package can be used to scan the static constants in CommonClientConfigs, ProducerConfig
    or ConsumerConfig, then have those constants cross-checked against the user-supplied
    property names. The validation method will fail with a runtime exception if a
    property name cannot be resolved among the scanned constants.


    The rest of this section will focus on the uncompromising, fully type-safe class.
    Expect a bit of coding. All sample code is provided at github.com/ekoutanov/effectivekafka25,
    in the src/main/java/effectivekafka/types directory.


    There are two classes in this example. The first defines a self-validating structure
    for containing producer client configuration. It has room for both expected properties
    and a free-form set of custom properties. The listing for TypeSafeProducerConfig
    follows.


    > 25https://github.com/ekoutanov/effectivekafka/tree/master/src/main/java/effectivekafka/typesafeproducer'
