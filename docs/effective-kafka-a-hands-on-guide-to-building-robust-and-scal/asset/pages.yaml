  md: '# Chapter 6: Design Considerations


    # 83


    ![](img/a4d2c17b478048c90e0b48be89cde5c1_89_0.png)


    Mimicking the real-life order of events is a good starting point for designing
    a streaming application. With this in mind, it makes sense to appoint the football
    match as the stable entity — its identifier will act as a record key to induce
    the partial order. This means that goals, corners, penalties, and so forth, will
    appear in the order they occurred within a match; records across matches will
    not be ordered by virtue of the matches unrelated.


    The basic requirement for the stability of the chosen entities is that they should
    persist for the lifetime of all causally related events. This does not imply that
    the entities should be long-lived, only that they exist long to survive the causality
    chains that depend on them. To our earlier example, the football match survives
    all of its in-play events.


    > Record keys bound to some stable entity can be thought of as equivalent of foreign
    keys in database parlance, and the stability characteristic be likened to a referential
    integrity constraint. Exploring the relational database analogy, the entity in
    the linked table would persist as long as it is referenced by one or more foreign
    keys. Likewise, the linked stable entity persists for the duration of time from
    the point when the first record is published to when the last record leaves the
    producer. Therefore, once the causal order is materialised in Kafka, the entity
    becomes largely irrelevant.


    Assuming special predecessor-successor relationship between the chosen stable
    entities, the partial order of the resulting records will generally be sufficient
    for most, if not all, downstream consumers. Conversely, if the entities exhibit
    causal relationships, then the resulting stream may fail to capture the complete
    causality. Reverting to our earlier example, suppose one downstream subscriber
    is a tournament leaderboard application, needing to capture and present the relative
    standing of the teams as they progress through a tournament. Match-centric order
    may be insufficient, as goals would need to be collated in tournament order.'
