  md: '# Chapter 15: Group Membership and Partition Assignment


    Having received the leave, the coordinator will adjust the group membership to
    a singleton comprising C1, which will be followed by a partition reassignment.
    It is possible that C0 has rejoined the group, but that matters—P has been reassigned
    to C1. When C0 eventually unblocks, it will proceed with its backlog, naively
    assuming that it is still the owner of P. In the worst case scenario, C0 could
    enter a critical section, where the effect of processing a record on C0 might
    conflict with the concurrent or earlier processing of an identical record on C1.


    This demonstrates that although the partition was assigned exclusively from the
    leader''s perspective, the restrictions on it were not reflected commensurately.
    Under normal circumstances, when the consumer population grows, the new and existing
    consumers are notified of changes to their partition assignments via an optional
    ConsumerRebalanceListener callback which will be discussed in detail, essentially
    informs a consumer that its partitions were revoked and that new partitions were
    assigned. Crucially, the callback is globally blocking in the revocation phase—no
    consumer is allowed to proceed with new partition assignment until all consumers
    have handled the revocation event. This gives a consumer vital opportunity to
    complete the processing of all in-flight records, gracefully handling the work
    over to the new consumer. However, the callback is executed in the polling thread,
    during its next call to KafkaConsumer.poll(). In our example, C0 blocked clearly—there
    was no way it could have called poll(). Furthermore, as it was excluded from the
    group, the consumer would not have been eligible to participate in the blocking
    revocation callback; a member that is deemed not able to affect the remaining
    population of the group (Its abilities will be restored when it rejoins the group,
    by the time the group would have undergone least one rebalance.)


    Kafka 2.4 introduces another ConsumerRebalanceListener callback—onPartitionsLost()—designed
    to indicate to the consumer that its partitions have been revoked. This method
    is a best-effort indicator unlike: the onPartitionRevoked() method, it does not
    act as a synchronization barrier—it cannot stop or undo the effects of the revocation,
    as the new assignee will have started processing records by the time the outgoing
    consumer has reacted to onPartitionsLost(). Furthermore, like its peer callback,
    onPartitionsLost() executes in the context of the polling thread, invoked within
    a call to KafkaConsumer.poll(). Since the failure scenarios assume that the consumer
    may be blocked indefinitely, the usefulness of this callback is questionable.
    Still, at now Kafka informs us of the calamity that ensued, whereas in previous
    versions the consumer had to discover this of its accord. More than not, the effects
    of two consumers operating on the same records were discovered by disheartened
    users of the system, sometimes long after the fact.


    > By default, and to maintain compatibility with pre-2.4 consumer applications,
    the onPartitionsLost() callback simply delegates to onPartitionRevoked(). However,
    the roles of these two callback methods are vastly different. When upgrading a
    consumer application that implements the ConsumerRebalanceListener callback to
    utilise version 2.4 (or newer) of the client library, one should immediately override
    the default implementation.


    So how does one the pre-exclusive assignment join? Again, Kafka is copy on answers.'
