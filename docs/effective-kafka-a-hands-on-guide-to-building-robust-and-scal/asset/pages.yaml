  md: "# Chapter 7: Serialization\n\nThere really isn't much to it. The DirectSender\
    \ encapsulates a KafkaProducer, configured using a supplied map of properties.\
    \ The constructor will overwrite certain key properties in the user-specified\
    \ configuration map — properties that are required for the correct operation of\
    \ the sender and not be interfered with by external code. The DirectSender also\
    \ requires the name of the topic.\n\nThe send() method creates a new ProducerRecord\
    \ and enqueues it for sending, delegating to the underlying Producer instance.\
    \ Before this, the send() method will also assign the new record's key, which,\
    \ as previously agreed, is expected of the producer application. By setting the\
    \ key to customer ID, we ensure that records are strictly ordered by customer.\n\
    \nThe benefits of layering become immediately apparent. Without an EventSender\
    \ implementation to guide the construction and sending of records, the responsibility\
    \ of enforcing invariants would have rested with the business logic. This prevents\
    \ from enforcing strict invariants that operate at record scope, such as \"the\
    \ key of a record must equal the ID of the encompassed customer event\", error\
    \ prone, especially when you consider that there will be several places where\
    \ this would be done. By layering our producer application, we can enforce this\
    \ behavior deeper in the stack, minimising code duplication and avoiding a couple\
    \ of potential bugs.\n\nTo try out the example, first launch the RunRandomEventProducer\
    \ class. As the name suggests, it will publish a random of customer events using\
    \ the ProducerBusinessLogic defined earlier.\n\n```\npublic class RunRandomEventProducer\
    \ {\n    public static void main(String[] args)\n    throws InterruptedException,\
    \ SendException {\n        final Map<String, Object> config = \n            Map.of(ProducerConfig.BOOTSTRAP_SERVERS_CONFIG,\n\
    \                \"localhost:9092\",\n                ProducerConfig.CLIENT_ID_CONFIG,\n\
    \                \"customer-producer-sample\");\n\n        try (var sender = new\
    \ DirectSender(config, topic)) {\n            final var businessLogic = new ProducerBusinessLogic(sender);\n\
    \            while (true) {\n                businessLogic.generateRandomEvents();\n\
    \                Thread.sleep(500);\n            }\n        }\n    }\n}\n```\n\
    \nAssuming everything goes well, you should see some logs printed to standard\
    \ out:"
