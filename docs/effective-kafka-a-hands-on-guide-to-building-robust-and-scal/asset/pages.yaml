  md: '# Chapter 14: Data Retention


    Conversely, when a topic is compacted, one naturally assumes that it is utilised
    as the source of truth — where the preservation of state is an essential attribute
    — more than the preservation of discrete changes. Under this model, there is either
    a characteristic absence of a queryable data source, or it becomes intractable
    for the consumer to issue queries. This enables unimodal processing which is its
    dominant advantage.


    Combining the two strategies might appear counterintuitive at first. It has been
    said: a compacted topic can be logically equated to a database (or a K-V store)
    — the most recent updates corresponding to rows in a table of finite size. Slapping
    a deletion policy on top feels like we are building a database that silently drops
    records when it gets to a certain size (or age). This configuration is peculiar,
    at the very least.


    Nonetheless, a size-bound, compacted topic is useful in limited cases of data
    capture and processing. This can be seen as an extension of the conventional,
    event-driven replication model. In the presence of fast-moving data, where updates
    are self-contained and the time-value of data is low, the use of compaction can
    dramatically accelerate the processing of data. More often than not, entity deletion
    is a non-issue, and tombstones are excluded from the model (although they have
    to be). The intention is not to conserve state or enable unimodal processing;
    rather, it is to reduce wastage on events that lose their significance. Because
    the size of the topic is inherently constrained (by way of deletion), one can
    afford to run a more aggressive compressor, using a much larger log.cleaner.min.ratio
    in conjunction with smaller sizes. The more aggressive the compaction, the larger
    the likelihood that an obsolete record is observed by a consumer.


    > An example of this ‘hybrid’ model is used by the internal _consumer_offsets
    topic to manage state for consumer groups. This topic’s segments are subjected
    to both compaction and deletion. Compaction allows for the rapid reconstruction
    of consumer state on the group coordinator, while deletion binds the size of the
    topic and acts as a natural ‘garbage collector’ of consumer groups that have not
    been utilised for some time.


    This chapter looked at how Kafka deals with data retention. We started with a
    tour of its storage internals — understanding how topic-partition data on the
    replicas maps to the underlying filesystem. Along the key takeaways is the nature
    of a segmented log, whereby the partition is broken into a series of chunks —
    each accompanied by a set of indexes — permitting O(1) lookups of records by their
    offset or timestamp. Of the logs, the most recent is the active segment. Any producer
    may write to the active segment — a fundamental design that influences the remainder
    of Kafka’s data retention machinery. And, one that frequently causes confusion.


    Kafka offers two independent but related cleanup policies — deletion and compaction.
    Deletion is relatively straightforward — truncating segments when the log reaches
    a certain size or where the oldest record matures to a certain age. As a cleanup
    policy, deletion is suitable where consumers'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'are expected to keep up with the data syndicated over a topic, or where an
    alternate mechanism for retrieving lapsed data exists.


    Compaction is the more elaborate cleanup policy, providing a fine-grained, per-record
    retention strategy. The idea is to selectively remove records where the latter
    represent entity updates, and where a more recent update record exists for the
    same key. Compaction leaves at least one record that represents the most recent
    update snapshot of an entity — turning an event stream into a continuously updating
    data store.


    Crucially, compaction is a best-effort endeavour — it ensures that at least one
    record for a given key is preserved. There is no exactly-one guarantee when it
    comes to compaction. Depending on various factors — the contents of the active
    segment and the dirty ratio — compaction might not run, or having run, it might
    appear to have a partial effect. Also, compaction is not bound by a deadline —
    being subject to the availability of cleaner threads, the backlog of competing
    partitions in need of compaction, and the actual compaction time.


    The deletion and compaction policies may be used in concert, which is typically
    done to expedite the processing of change records while constraining the size
    of the log.


    Among them, Kafka’s cleanup policies provide sufficient flexibility to accommodate
    a range of data retention needs — from event-driven services to accelerated stream
    processing graphs and fully-fledged event-sourcing models.'
