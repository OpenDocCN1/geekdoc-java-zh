  md: '# # Chapter 8: Bootstrapping and Advertised Listeners


    Who are these listeners? And what are they advertising?


    Having been in the Kafka game since 2015, without exaggeration, the most common
    question that gets asked is: “Why can’t I connect to my broker?” And it is typically
    followed up with: “I’m sure the firewall is open; I tried pinging the box; I even
    tried telnetting into port 9092, but I still can’t connect.” The bootstrapping
    configuration will frustrate the living daylights out of most developers and operations
    folk at some point, and that’s unfortunate: for all the flexibility that Kafka
    has to offer, it certainly isn’t without its drawbacks.


    # A gentle introduction to bootstrapping


    Before we can start looking into advertised listeners, we need a thorough understanding
    of the client bootstrapping process. As it was previously stated, Kafka replicates
    a topic and its underlying partitions among several broker nodes, such that one
    broker will act as a leader for one partition and a follower for several others.
    Assuming that a topic has many partitions and the allocation of replicas is approximately
    level, no single broker will master a topic in its entirety. The illustration
    below depicts a four-broker cluster hosting a topic with four partitions, with
    a replication factor of three. (Meaning that each partition will have one leader
    and two follower replicas.)'
