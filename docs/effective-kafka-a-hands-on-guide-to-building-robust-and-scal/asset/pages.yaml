    # Limitations\n\nThere are several limitations of transactional messaging in Kafka\
    \ which the reader should be mindful of.\n\n# Bound to Kafka resources\n\nTransactional\
    \ messaging is implemented using a proprietary Kafka protocol that is not interoperable\
    \ with other persistence systems and messaging middleware. Kafka does not support\
    \ standard transaction APIs such as XA and JTA.\n\n# Cannot span producers\n\n\
    Transactions cannot be used to span multiple producer instances. Transactions\
    \ are forwarded to specific transaction coordinators, which are assigned the role\
    \ of managing transactional IDs by way of a hash function. Two producers with\
    \ different transactional IDs may map to two different coordinators, making cross-producer\
    \ transactions intractable within the constraints of the current design.\n\n#\
    \ Cannot span clusters\n\nWhere the producer and consumer sides of a processing\
    \ stage connect to different clusters, consumer-side offsets cannot be committed\
    \ by relaying them through the transaction coordinator, as the latter resides\
    \ in a different cluster."
