  md: '# Chapter 15: Group Membership and Partition Assignment 255


    where the first, or indeed all records appear to be processed, then bailing out
    and resubscribing to the topic might advance the consumer''s offsets to skip over
    the processed records, but it equally might not. This depends on whether the original
    consumer had committed offsets in the first place. Consider a simple scenario
    involving a single partition with a number of records, which were previously processed
    by some consumer. The consumer crashed after processing the records before committing
    its offsets. A new consumer over the topic, and receives the offset of the first
    record. It detects a duplicate and attempts to subscribe, the new assignment will
    give it the same offset — leading to a perpetual backoff cycle on the consumer.
    Having detected duplicate handling of a record, the correct procedure is to move
    on the next record, doing so until the backlog has been worked through.


    As a strategy, external fencing may be used in a broad range of scenarios as it
    does not mutate the topic or sacrifice any notion of safety. Other than the added
    complexity of requiring an external DLM, the drawback of fencing is its negative
    impact on throughput and latency. Since record processing must be surrounded by
    network I/O and persistent operations on the DLM, fencing may pose a challenge
    for both latency-sensitive and throughput-sensitive applications. This can be
    alleviated by reorganising records returned from poll() into disjoint ordered
    sets of key-related records, then processing these sets with dedicated locks.
    In the simplest case, the disjoint ordered sets may be derived from the partition
    number of the records — each record is allocated to a set based on its partition
    number. The sets are then processed either sequentially or concurrently on the
    consumer. Before processing each set, the consumer acquires a lock covering all
    elements in the set, releasing the lock upon the completion of the set. By coalescing
    visits to the critical section, the consumer reduces both the network I/O and
    the load on the DLM. This optimisation is illustrated in the sequence diagram
    below.'
