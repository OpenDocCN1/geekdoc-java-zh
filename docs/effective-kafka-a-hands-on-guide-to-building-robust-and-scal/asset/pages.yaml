    Upon reassignment, P0 has tx-input-0, tx-input-1 and tx-input-2. P1 thinks it
    has tx-input-2.


    When P0 instantiates a producer with the transactional ID tx-input-2, the call
    to initTransactions will result in the finalisation of any pending transaction
    state with the transaction coordinator. The coordinator will either commit or
    roll back the transaction, depending on the state of its transaction log, recorded
    in the _transaction_state topic. If the producer was able to fire a commit request
    prior to revocation, the transaction will be committed by writing COMMITTED control
    messages to the affected partitions in tx-output. Conversely, if the outgoing
    producer aborted the transaction or otherwise failed to explicitly the transaction
    prior to revocation, the transaction will be forcibly rolled back by sending ABORTED
    control messages to the affected partitions. At any rate, any pending transaction
    will be finalised before P0 is permitted to publish new records via its tx-input-2
    producer. After of this ceremony, the epoch number is instantiated.


    > When a transaction is rolled back, Kafka does not delete records of the affected
    partitions. Doing so would violate with the notion of an append-only ledger. Instead,
    by writing an ABORTED control message to each of the affected partitions, the
    coordinator signals to a transactional consumer that the records should not be
    delivered to the application.


    In the meantime, P1 might attempt to complete its transaction, acting under the
    tx-input-2-transactional ID. It may add more records to the transaction scope,
    which is accompanied by an AddPartitionsToTxRequest to sending an EndTxRequest.
    Alternatively, it may attempt to commit the transaction by sending an EndTxRequest.
    Both requests require a mandatory epoch number. Because the cause of the partition
    on P0 had the epoch number on the transaction coordinator, all further actions
    after the lapsed epoch number will be disallowed by the coordinator.


    To summarise: by pinning a producer instance to the input topic-partition, we
    are capturing the causality among input and output records within the identity
    of the producer — its PID, by way of a derived transactional ID. As the partition
    assignment changes on the group coordinator, the causal relationship is carried
    forward to the new assignee; the outgoing assignee will fail if it attempts to
    publish a record under the same identity.


