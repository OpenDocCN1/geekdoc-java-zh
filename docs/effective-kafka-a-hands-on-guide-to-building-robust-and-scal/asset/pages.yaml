- img_proc: true
  md: '# Chapter 6: Design Considerations


    the topic or not. This, categorical, approach to role demarcation is essential
    to preserving the key characteristic of an event-driven architecture — loose coupling.
    The producer cannot intrinsically aware of the topic''s consumers, as so would
    largely defeat the intent of the design. This is not to say that producers should
    publish on a whim, or that the suitability of the published data is somehow immaterial
    to the outcome. Naturally, the published data should be correct, complete and
    timely; however, the assurance of this lies with the designers of the system and
    is heavily predicated on the efficacy of domain modelling and stakeholder consultation.
    It is also evolutionary in nature; feedback from the consuming parties during
    the design, development, and operation phases should be used iteratively to improve
    the data quality. Stated otherwise, while the consuming parties are consulted
    as appropriate, the final decision rights and associated responsibilities rest
    with the producer.


    # Peer-to-peer messaging


    Kafka may be used in peer-to-peer messaging arrangement, whereby the consumer
    is effectively responding to specific commands issued by a producer, and in most
    cases emitting responses back to the initiator. This model sees a role reversal:
    the consumer plays the role of the service provider, and therefore assumes custody
    over the lifecycle of the topic and its defining characteristics.


    Where the response is sent over a different topic, shared among message initiators,
    the semantics of the response topic are also fully defined by the consumer. In
    elaborate messaging scenarios, the initiator of the request may ask that the response
    be ferried over a dedicated topic to avoid sharing; in this case, the lifecycle
    of the topic and its retention will typically be managed by the initiator, with
    record-related aspects remain within the consumer''s remit.


    # Topic conditioning


    Reading the section on producer-driven topic modelling may fail to instill confidence
    in would-be consumers. The flip side of the producer is to optimise topics within
    their own domain, what measures exist to assure the consumers that the upstream
    directions do not impact advers? A compromise is possible, and how does one neutralise
    the apparent bias without negatively impacting all parties.


    These are fair questions. In answering, the reader is invited to consider the
    case where there are multiple disparate consumers. Truly, a single-producer-multiple-consumers
    is a fairly routine arrangement in contemporary event-driven architecture. And
    this is precisely the case that highlights a compromise is not a viable option.
    As the number of disagreeing parties grows, the likelihood of striking an effective
    compromise decreases to the point where the resulting solution is barely tractable
    for either party. It is the architectural equivalent of children fighting over
    a stuffed toy, where the inevitable outcome is the tearing of the toy, the dramatic
    scattering of its plush contents, resulting in discontent but ultimately quiesced
    children.


    So what is to do?'
