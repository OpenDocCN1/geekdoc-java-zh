  md: '# Producer configuration


    This section describes configuration options that are specific to the producer
    client type.


    # Acknowledgements


    The acks property stipulates the number of acknowledg the producer requires the
    leader to have received before considering a request complete, before acknowledging
    the write with the producer. This is fundamental to the durability of records;
    a misconfigured acks property may result in the loss of data while the producer
    naively assumes that a record has been stably persisted.


    Although the property relates to the number of acknowledements, it accepts an
    enumerated constant being one of –


    +   - 0: Do not require an acknowledgement from the leader.

    - 1: Require one acknowledgement from the leader, being the persistence of the
    record to its local log. This is the default setting when enable.idempotence is
    set to false.

    - -1 or all: Require the leader to receive acknowledgments from all in-sync replicas.
    This is the default setting when enable.idempotence is set to true.


    Each of these modes, as well as the interplay between acknowledements and Kafka''s
    replication protocol, are discussed in detail in Chapter 13: Replication and Acknowledgements.


    # Maximum in-flight requests per connection


    The max.in.flight.requests.per.connection property sets an upper bound on the
    number of unacknowledged requests the producer will send on a single connection
    before being forced to wait for their acknowledgments. The default value of this
    property is 5.


    The purpose of this configuration is to increase the throughput of a producer.
    This is particularly evident over long-lag, high-latency networks, where long
    acknowledgement times continually interrupt a producer''s ability to publish additional
    records, even if the network capacity permits this. The problem is not exclusive
    to high-latency networks; any internal constraint that contributes to increases
    in acknowledgement times – for example, slow replication within the cluster due
    to lagging in-sync replicas – will negatively impact the transmission rate.


    This is a classic problem of flow control. Anyone familiar with the inner workings
    of networking protocols will immediately lik the behaviour max.in.flight.requests.per.connection
    to the sliding window used for TCP''s flow control. However, it is not quite the
    same; there is one key distinction – the lack of ordering and reassembly of in-flight
    requests over the extent of the unacknowledged window when idempotence is disabled.


    This problem is best explained with an example. Suppose a producer, configured
    with default values for max.in.flight.requests.per.connection and retries, queues
    records A, B, and C to the broker'
