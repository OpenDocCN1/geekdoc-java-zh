    idea with few esoteric use cases; they can be applied effectively to a broad range
    of messaging and event scenarios, routinely displacing their traditional counterparts.


    Kafka is written in Java, meaning it can run comfortably on most operating systems
    and hardware configurations. It easily be deployed on bare metal, in the Cloud,
    and a Kubernetes cluster. And finally, Kafka has libraries written for just about
    every programming language, meaning that virtually every developer can start taking
    advantage of event streaming and push their architecture to the next level of
    resilience and scalability.


