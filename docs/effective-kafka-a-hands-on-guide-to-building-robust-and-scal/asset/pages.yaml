    Recalling the earlier-stated formula relating the delay to the duty cycle, one
    might assume that the cyclic phase of the bandwidth and the duty cycle are somewhat
    equivalent or at least comparable. Curiously, this is not the case: The duty cycle
    relates to an individual penalty and represents the ratio of the request time
    to the duration of one-response cycle. It can be thought of as operating at the
    micro level. By comparison, the macro-level cycle is trivially observable — the
    one we have just been discussing — a function of the length of the sliding window
    and the duration of each sampling period.


    This brings us to the next point: how do the quota.window.num and quota.window.size
    properties (the values N and S) affect the behaviour of the system?


    By increasing quota.window.num, the overall duration of the window T is increased,
    elevating the tolerance for burst traffic. In the example of the default window
    (ranging from ten to eleven seconds), the system tolerated a burst of just over
    eleven times the prescribed limit. It did so at the expense of spike traffic.
    Conversely, reducing the overall window duration leads to a flatter traffic profile,
    having less tolerance for periods of heightened activity. The reader may want
    to try changing the quota.window.num setting in server.properties — increasing
    and decreasing the duration of the window and rerunning the on each occasion.
    The behaviour will be confirmed. And either way, the long-term average throughput
    will remain the same.


