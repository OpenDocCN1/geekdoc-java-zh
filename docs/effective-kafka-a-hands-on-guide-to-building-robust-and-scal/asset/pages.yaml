    # Sensing quota enforcement


    One of the well-known challenges of Kafka''s quota implementation is the lack
    of explicit communication of the quota from the broker to the offending (in a
    manner of speaking) client. A quota may be breached by a well-behaved client;
    the cause none other than an attempt to produce or consume at a rate greater than
    the broker is willing to support. The delay introduced by the broker is largely
    driven by a combination of two intentions: maintaining compatibility with older
    client versions and simplifying the client implementation, which remains agnostic
    to the goings-on in the broker.


    The drawback of Kafka''s implementation of quotas is that the client observes
    what it believes is degraded performance. In the more extreme cases, when the
    penalty is substantial or the number of backed records is high, the client will
    begin to time out. This can result in the compounding of retry attempts, similar
    to the effects of a congestive collapse, discussed in Chapter 12: Batching and
    Compression. What Kafka lacks a mechanism for signalling the client that it is
    either approaching the limit of the quota or in breach, so that the client can
    act at its discretion (independent of broker-side enforcement).


    The conventional way of solving this problem, as we have seen earlier, is to limit
    the buffer size using the buffer_memory property — creating backpressure on the
    client. This works well in the majority of cases, particularly when dealing with
    non-sensitive data. On the other hand, if the client needs to know whether it
    is being throttled, there is no out-of-the-box mechanism to determine this, nor
    is there a way of probing the available buffer capacity. Kafka offers Producer.trySend()
    method that publishes a conditional on the available channel.


    One scenario where blocking behaviour is undesirable is a producer needs to publish
    heterogeneous data with quality service characteristics to a single topic. The
    client might be collecting data from multiple sources, but there may be a clear
    need to emit certain types of events over others. For example, the client may
    need to periodically transmit status updates. At the same time, it may transmit
    metrics which are useless to downstream consumers, but it is not critical that
    these metrics are delivered in a timely manner. This scenario assumes, for whatever
    reason, it is not feasible to separate the data into multiple streams with QoS
    guarantees; otherwise, this is addressed by the use of topic-level quotas.


    Where blocking behaviour is unacceptable, the client may choose to track the in-flight
    records and correlate these to the received acknowledgments, keeping a ''pending
    records'' counter. The counter will increase as a result of throttling, to the
    number of buffered records, and will revert to a'
