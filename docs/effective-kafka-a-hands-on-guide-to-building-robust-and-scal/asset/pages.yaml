    # May be partially observed by a consumer


    As transactions can span multiple partitions, it is possible for any given consumer
    operating within a consumer group to only witness a subset of the records emitted
    within a broader transaction, being oblivious to the effects of the transaction
    that do not affect its assigned partitions. Because partition assignment is balanced
    among members of a consumer group, the records of one transaction may be subdivided
    among multiple consumers in a group.


    Transactions may straddle log segments in a partition. When the lagged log segments
    are deleted as a result of retention constraints, it may appear that parts of
    the transaction have vanished. In practice, this problem only impacts consumers
    who have accumulated significant lag, or are starting to read a topic from the
    beginning.


    Records published within a transaction are not accorded any special treatment
    from the perspective of compaction. A background compaction process may void individual
    records, leaving a partial set. To be fair, the behaviour of transactional records
    with respect to retention and compaction is not a limitation of transactions as
    such, but more of a caveat that warrants awareness.


    # Incomplete exactly-once semantics


    The biggest limitation of transactional messaging with respect to exactly-once
    processing is that it does nothing to prevent an input record from being handled
    twice; if the processor suffers a failure mid-stream, an alternate process will
    take over and may need to deal with partially processed records. This is straightforward
    if the processing stage embeds a pure function; in other words, it is deterministic
    and has no state of its own. On the other hand, if the processing stage must write
    to a database or invoke a downstream service, side effects must be taken into
    account.


    # Are transactions over-hyped?


    For the proverbial ‘tyre pumping’ of the transactional messaging capability, one
    must question the added complexity of dealing with transactions and pinning producers,
    in terms of what it provides. All persistent side effects are idempotent, a completely
    written transform-produce loop provides the requisite exactly-once semantics end-to-end.
    Of course, since we assume we don''t create duplicates in Kafka, and one might
    go as far as arguing that the atleast once of event stream processing already
    implies some degree of robustness vis à duplicates, provided there is a reliable
    way of identifying them.


    Transactional messaging eliminates duplicate records in event stream processing
    graphs. This may be useful when applications rely on Kafka as a primary event
    store and when dealing with duplicate records may be non-trivial at the application
    level. The complexity of managing pinned consumers may be encapsulated within
    a dedicated messaging layer, or a framework. For example, the Kafka Streams client
    library can transparently deal with transactions, relieving the application from
    having to manage consumers and producers, demarcate transactions and commit offsets.
