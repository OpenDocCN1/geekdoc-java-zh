    # Removing permissions


    To remove a permission, simply run kafka-acls.sh with the --remove switch in place
    of --add, with the rest of the flags used for adding a permission, as shown in
    the example below.


    ```

    $KAFKA_HOME/bin/kafka-acls.sh \\

    --authorizer-properties zookeeper.connect=localhost:2181 \\

    --remove --allow-principal User:alice \\

    --operation Read --operation Write --topic getting-started \\

    --force

    ```


    +   The use of the --remove switch prevents the operator from having to respond
    to a yes/no safety prompt.


    Later in the chapter, we will look at bulk-removing permissions.


    # Mixing allow and deny permissions


    One of the complications of Kafka''s rules is that they support both allow and
    deny actions. This makes them more flexible, also easier to misconfigure. For
    example, you can allow access to all users on a specific topic, but then deny
    access to a smaller group of users. A natural response might be: Doesn''t this
    contradict the default-deny model, and if not, what would this capability be useful?


    One way of looking at it, is that it allows us to interleave default-allow and
    default-deny tactics in the same overall security model, creating a hierarchy
    of sorts. To understand where this might be beneficial, consider the following
    challenge, a hypothetical Kafka cluster that provides guest level access for a
    small subset of resources. Guest credentials can be procured easily easily— there
    might be a pre-canned set of shared credentials that are freely available. Assuming
    strong network-level controls are in place, guest access is only permitted from
    a trusted network.


    We might be publishing something trivial on a topic we would make like available
    to guests for reading, as well as to trusted users. Let''s call this low-assurance
    topic guest-readable. Now, assume there is another topic which contains information
    for authenticated users that have a higher level of clearance than guest — a medium
    assurance topic. We will call it trusted-only. And finally, the cluster may contain
    numerous high-assurance topics that are admissible to specific'
