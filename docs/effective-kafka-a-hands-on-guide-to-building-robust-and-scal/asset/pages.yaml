    # # Minimise the attack surface


    There are several ways to connect to the Kafka and ZookKeeper cluster, and most
    of these ingress points are of no use to legitimate clients. On the flip side,
    they create a large attack surface, making it difficult to enforce. As such, we
    need to limit access to the cluster at the lowest possible level, exposing the
    minimally-essential set of endpoints for legitimate clients.


    In addition to limiting ingress, we may also want to explicitly allow specific
    groups of clients. We may only allow clients from the organisation''s internal
    network to access the cluster. But we may go further than that, segregating traffic
    based on clients within the internal network. For example, we may partition the
    internal network into multiple segments, and only allow clients deployed in the
    operational network (such as the data centre) to access Kafka, while blocking
    clients in the general-purpose (office) network.'
