  md: '# Chapter 7: Serialization


    +   2. Wait for the outcome of a pending fetch, checking the status of the fetch
    buffer. The accumulation of the fetch results will be performed by a background
    I/O thread. This operation will block until the data becomes available or the
    poll timeout expires.


    +   3. Decompress the batch if compression was set on the producer.


    +   4. Deserialize each record in the batch.


    +   5. Prior to returning from poll(), initiate a prefetch. This action is non-blocking;
    it fires off a set of queries to the brokers and returns immediately, without
    waiting for responses. The control is transferred back to the application code.
    When the results eventually arrive, they will be decompressed and deserialized,
    with the results placed into a fetch buffer.


    +   6. The application applies the requisite business logic to process each record
    by invoking the registeredEventListener callbacks. In most applications, this
    would involve updating a database and possibly other I/O. More than not, the cost
    of processing a record is significantly greater than the cost of reading it from
    a Kafka topic.


    +   7. After the application has completed processing the batch, it can safely
    consume the consumer''s offsets by invoking Consumer.commitAsync(). This will
    have the effect of committing the offsets for all records returned during the
    poll(). Being an asynchronous operation, the committing of offsets will occur
    in a background I/O thread.


    The last step in the poll-process loop is optional, in which we could have deferred
    to the consumer''s built-automatic offset committing'' by leaving enable.auto.commit
    at its default value. In the DirectReceiver example, we have chosen to disable
    auto-commit, going with the manual option instead. The principal advantage of
    committing offsets manually is that it results in a narrower window of uncommitted
    offsets compared to the automatic option, even if done asynchronously, as the
    offset auto-commit feature is the reduction in the number of commit requests sent
    to the brokers, which has a small positive effect on throughput.


    The I/O thread works in the background.



    The I/O thread works in the background. Among its key responsibilities is the
    handling of responses from earlier fetch requests, accumulating the received batches
    in a fetch buffer. With the assistance of the background prefetch mechanism, and
    assuming a steady flow of records through the pipeline, most calls to poll() should
    block.


    While the KafkaConsumer allows for pipeling via its prefetch mechanism, the implementation
    handles the deserialization of records and their subsequent handling on a single
    thread of execution. The thread that is responsible for deserializing the records
    is also used to do business logic. Both operations are potentially time-consuming;
    when a record is being deserialized, the polling thread is unable to execute the
    EventListener callbacks, and vice versa.


    While we can control this element of the client''s standard behaviour, we can
