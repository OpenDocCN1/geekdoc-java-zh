  md: '# Topic creation


    ![](img/a4d2c17b478048c90e0b48be89cde5c1_64_0.png)


    Kafkadrop — creating a new topic


    However, the point of the exercise is to demonstrate the CLI tool, rather than
    to explore all the possible ways one can create a topic in Kafka.


    > This might be a good segue to discuss the importance of explicit topic creation.
    Kafka does not require clients to create topics by default. When the auto.create.topics.enable
    broker configuration is set to true, Kafka will automatically create the topic
    when clients attempt to produce, consume or fetch metadata for a non-existent
    topic. This might sound like a nifty idea at first, but the drawbacks significantly
    outweigh the minor convenience one gets from not having to create the topic explicitly.


    First, Kafka''s defaults as of 2011, and are generally optimised for the sorts
    of use cases Kafka was originally designed for — high volume log shipping. Many
    things have changed; as it happens, Kafka is no longer a one-trick pony. As such,
    one would typically configure the topic at the point of creation, or immediately
    thereafter — certainly before it gets a real workout.


    Secondly, the partition count: Kafka allows you to specify the default number
    of partitions for all newly created topics using the num.partitions broker setting,
    but this is largely a meaningless number. Topics should be sized individually
    on the basis of expected parallelism, and a number'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'of other factors, which are discussed in Chapter 6: Design Considerations.
    Specifying the partition count requires explicit topic creation. A similar statement
    might be made regarding the replication factor, but it is arguably easier to agree
    on a sensible default for the replication factor than it is for the partition
    count.


    Finally, having Kafka auto-create topics when a client subscribes to a topic or
    simply fetches the topic metadata is careless, to put it mildly. A misbehaving
    client may initiate arbitrary metadata queries that could inadvertently create
    a copious number of stray topics.


    # Publishing records


    With the topic creation out of the way, let''s publish a few records. We are going
    to use the kafka-console-producer.sh tool:


    ```

    $KAFKA_HOME/bin/kafka-console-producer.sh \n--broker-list localhost:9092 \n--topic
    getting --property "parse.key=true" \n--property "key.separator=\:

    ```


    Records are separated by newlines. The key and value pairs are delimited by colons,
    as indicated by the key.separator property. For the sake of an example, type in
    the following (a copy-paste past will do):


    ```

    foo:first message

    foo:second message

    bar:first message

    foo:third message

    bar:second message

    ```


    Press CTRL+D. When the terminal echoes a right angle (>) for every record published.


    > Note, the kafka-topics.sh tool uses the --bootstrap-server parameter to configure
    the Kafka broker list, while kafka-console-producer.sh uses the --broker-list
    parameter for an identical purpose. Also, --property arguments are largely undocumented
    — be prepared to Google your way around.


    At this point we can switch back to Kafrod and view the contents of the getting-started
    topic. We are presented with an overview of the topic, along with a detailed breakdown
    of the underlying partitions:'
