    # SASL


    Kafka supports Simple Authentication and Security Layer (SASL) — an extensible
    framework for embedding authentication in application protocols. The strength
    of SASL is that it decouples authentication from application protocols, in theory
    allowing any authentication mechanism supported by SASL to be embedded in any
    application that uses SASL. SASL is not responsible for the confidentiality of
    the message exchange, and is therefore rarely used on its own. The most common
    deployment model of SASL involves TLS.


    # GSSAPI


    Kafka supports the Generic Security Service API (GSSAPI), which enables compliant
    security-vendors to exchange opaque tokens with participating applications. These
    tokens are inherently tamper-proof, and are used to establish a security context
    among collaborating parties. Once the context is established, the parties can
    communicate securely and access resources.


    > GSSAPI is commonly associated with Kerberos, being its dominant implementation.
    The primary distinction is that the Kerberos API has not been standardised among
    vendors, whereas GSSAPI has vendor-neutral from the outset. In a manner of speaking,
    GSSAPI standardises Kerberos.


    The official documentation treats GSSAPI synonymously with Kerberos. The professed
    relationship between GSSAPI and Kerberos typically extends to centralised directory
    services — Active Directory (predominantly due to its native Kerberos version
    5 support) and similarly positioned single sign-on (SSO) services.


    Kerberos and Active Directory work for interactive users in a corporate setting;
    however, Kafka users are rarely individuals, but applications. Even when a Kafka
    client acts on behalf of an end-user, it will ordinarily authenticate to the broker
    via an end-user-mechanism — typically a service account. The authenticated session
    makes it infeasible to spawn a new set of connections for every user interaction,
    or to tear them down shortly afterwards. In the overwhelming majority of cases,
    service accounts are the only practical way to manage Kafka clients.


    In theory, a service account could be provisioned in a centralised authentication
    server such as Active Directory. On the surface, it sounds beneficial. By centralising
    services accounts, it should make the governance more straightforward and transparent
    affair.


    While the theoretical arguments are not disputed, the main challenge with the
    centralised model is that it only works if the principal in question can be modelled
    as a resource in a directory and all the resources it consumes are represented
    in some sort of permission model that can be associated with the principal. In
    other words, an application can access all of its resources using a single set
    of credentials. (Or these credentials are somehow related, and their relationship
    can be modelled accordingly.) In reality, backend applications may consume numerous
    disparate resources,'
