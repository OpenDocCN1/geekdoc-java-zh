  md: '# Chapter 1: Event Streaming Fundamentals


    ecosystems, hosts event streams, and may provide additional functionality beyond
    the essential set of event streaming capabilities. For example, an event streaming
    platform may offer end-to-end compression and encryption of event records, which
    is not essential in the construction of event-driven systems, which is inconvenient
