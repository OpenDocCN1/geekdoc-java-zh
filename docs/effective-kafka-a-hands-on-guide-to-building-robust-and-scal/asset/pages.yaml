  md: '# Listing and bulk-removal of permissions using the CLI


    It has been shown how rules can be created and removed using the CLI. The most
    convenient way to list rules, when you are working in a broker environment, is
    via Kafka''s ACL screen. In those cases Kafdrop is not at hand, the kafka-acls.sh
    script can be used to query rules and even remove them in bulk.


    We''ve already seen how the --list switch can be used to display the rules. But
    a production environment containing hundreds or thousands of ACL entries makes
    the unfiltered --list command unwieldy. Running --list (with no predicates) on
    the state of the ACLs accumulated from all previous examples results in the following:


    +   ACLs for resource `Topic:LITERAL:guest-readable`:nUser:* has Allow permission
    for operations: Read from hosts: *


    +   ACLs for resource `Cluster:LITERAL:kafka-cluster`:nUser:alice has Allow permission
    for operations: []

    IdempotentWrite from hosts: *


    +   ACLs for resource `Topic:PREFIXED:trusted`:nUser:guest has Deny permission
    for operations: Read from hosts: *


    +   ACLs for resource `Topic:LITERAL:getting-started`:nUser:alice has Allow permission
    for operations: Read from hosts: *

    User:alice has Allow permission for operations: Write from hosts: *


    +   ACLs for resource `Topic:LITERAL:trusted-only`:nUser:guest has Deny permission
    for operations: Read from hosts: *

    User:* has Allow permission for operations: Read from hosts: *


    +   ACLs for resource `Group:LITERAL:basic-consumer-sample`:nUser:alice has Allow
    permission for operations: Read from hosts: *


    The output is large but still useful. In fact, we can observe that the Deny permission
    for the literal trusted-only topic is redundant, as it is covered by the broader-matching
    Deny permission on the prefix trusted topic; both targeting the same user principal
    alice.


    The basic --list switch can be elaborated upon using two additional resource pattern
    types: any and match. Any pattern type allows rules that match the specified resource
    name exactly, which includes literal, wildcard and prefixed patterns.'
