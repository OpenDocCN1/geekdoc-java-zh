    # MULTILATERAL OPERATIONAL COOPERATION AMONG FRONTEX, EASO AND EUROPE


    Frontex, EASO and Europol were originally established under different Treaty frameworks
    and operate in a fragmented and constantly evolving field, like the AFSJ, which
    demands horizontal cooperation between the agencies. These agencies'' multilateral
    cooperation contributes to promoting an effective, coherent and uniform implementation
    of EU policies by the competent national authorities. Since the mandates of Frontex,
    EASO and Europol are so closely related, they need to seek synergies, share resources
    and tools, and adopt consistent and mutually reinforcing operational activities,
    with the aim of avoiding competition, overlaps, duplications and working inefficiencies.
    This section therefore studies the evolution of the multilateral cooperation between
