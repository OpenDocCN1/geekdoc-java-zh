  md: '# 2. The establishment and initial operational role of Frontex, EASO and Europol


    The institutional evolution in the Area of Freedom, Security and Justice (AFSJ)
    is a highly complex process characterized by its intergovernmental judicial and
    police cooperation in criminal matters under the former third pillar of the EU.
    In 1992, the Treaty of Maastricht integrated the powers regarding judicial and
    police cooperation. Thereafter, in 1997, the Treaty of Amsterdam established the
    AFSJ, which marked the beginning of the communitization of migration and asylum
    matters. Finally, the Treaty of Lisbon set the AFSJ as a key objective for the
    EU and strengthened the role of the European Institutions to achieve such an objective.
    The increasing importance of the decentralized agencies in EU administrative law
    and governance is reflected in the Treaty of Lisbon. Article 263 TFEU states that
    the Court of Justice of the EU (CJEU) is fully recognized to review the acts adopted
    by EU agencies since they have legal effects. The extension of the CJEU’s jurisdiction
    to EU agencies indicates that their acts do not escape judicial control, but are
    fully recognized in European governance and form part of the European institutional
    legal system.


    Institutionalization and integration in migration, asylum and border management
    matters have incessantly expanded the EU since enhanced cooperation between Member
    States was originally devised by the Treaty of Maastricht. Initially, the Justice
    and Home Affairs (JHA) policies were split between the first and the third pillars,
    which clearly favored the position of the Member States and limited the EU institutions’
    role and prerogatives. The former third pillar quickly revealed its limitations
    in ensuring effective national implementation of the measures adopted at the EU
    level. Precisely,


