    Vesting Frontex, EASO and Europol with precisely defined operational tasks should
    be deemed constitutional and in conformity with the Meroni doctrine. That is,
    in transboundary policy measures like border management, asylum and migration,
    and when the competent national administrations do not or cannot effectively apply
    the adopted EU measures, Frontex, EASO and Europol should act operationally. The
    EU legislature shall abstain from conferring competences on Frontex, EASO and
    Europol and/or empowering them to make policy decisions. Yet, this requirement
    remains vague since it does not specify enjoy in practice or the exact limits
    that their operational tasks are subject to. Without a legal framework detailing
    the conditions to empower EU decentralized agencies is adopted, it can be expected
    that the CJEU will need to keep assessing and clarifying the constitutionality
    of the powers conferred on the EU decentralized agencies.


