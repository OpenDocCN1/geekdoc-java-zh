  md: '# Frontex, EASO and Europol as operational decentralized agencies


    the operational nature of Frontex, EASO and Europol is a singularity that no other
    AFSJ agency has apart from Eurojust. That is, of the nine agencies that operate
    in the FSAJ, none Frontex, EASO, and Europol may directly access the competent
    national authorities on the ground in implementing the AFSJ goals (see Figure
    1.1).⁵


    The operational powers delegated to EU decentralized agencies may include facilitating
    the exchange of information between Member States to enable subsequent operational
    activities, training national competent authorities, coordinating and organizing
    joint operations, launching operations and monitoring inspection activities.³
    The tasks conferred on Frontex, EASO and Europol fall into two categories: regulatory
    and operational.⁷ These agencies provide the Member States and the European Commission
    with technical and informational support to effectively achieve the AFSJ''s goals.
    In addition, they operationally assist the competent national administrations
    via the coordination of joint operations or deploying teams in the territory of
    the Member States, while Frontex, EASO and Europol develop classical regulatory
    competences bestowed upon many other EU decentralized agencies, the operational
    powers and work conducted on the ground clearly不利 them and this is precisely the
    scope of analysis of this thesis.


