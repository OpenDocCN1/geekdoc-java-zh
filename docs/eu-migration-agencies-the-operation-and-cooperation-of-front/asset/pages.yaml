  md: '# Frontex, EASO and Europol as operational decentralized agencies


    In the hotspots, Europol''s guest officers are in charge of identifying risk profiles,
    performing second-line security checks and providing analytical and investigation
    support to dismantle illegal migrant networks. EASO assists the asylum authorities
    by providing information to the arriving migrants, as well as identifying, registering
    and examining applications for international protection. The experts and technical
    equipment deployed by Frontex in the hotspots facilitate national border surveillance
    and search and rescue operations. Frontex also assists the authorities in disembarking,
    screening, registering, identifying, fingerprinting, debriefing and assessing
    the nationality of the arriving migrants, as well as facilitating and coordinating
    the operations of those migrants with no right to remain in the EU.


    In the hotspots, the Member States are no longer exclusively competent to register,
    identify, screen, debrief, or inform returning migrants, nor examine asylum applications.
    The competent national authorities, facing extraordinary pressure at the external
    borders, further rely on Frontex, EASO and Europol. The hotspot approach is a
    flexible framework that allows these AFSI agents to tailor the degree of their
    operational assistance depending on the needs of the concerned Member States on
    the ground. The strengthened AFSI role and cooperation of these agencies is progressively
    moving the AFSI towards an integrated migration, asylum and border protection
    administration.


    # RESEARCH DESIGN


    The operational powers of Frontex, EASO and Europol are moving from technically
    assisting and supporting the Member States to developing tasks with an operational
    nature that have an impact in ensuring the effective and uniform implementation
    at the national level of the EU AFSI laws and policies. The evolution of the operational
    tasks and cooperation of Frontex, EASO and Europol is analyzed in this book with
    the aim of assessing to what extent Frontex, EASO and Europol are playing a growing
    operational role in the AFSI, as well as being increasingly involved in steering
    and shaping the implementation of border management, migration and asylum policies
    at the national and local level. Hence, this book centers on studying the forced
