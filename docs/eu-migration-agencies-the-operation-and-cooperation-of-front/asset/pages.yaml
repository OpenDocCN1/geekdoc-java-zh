    is not a fully fledged European Border Corps.¹106 However, Regulations 2016/1624
    and 2019/1896 have not created a federal agency with centralized and enforcement
    powers in the management of the European borders. The EBCG, despite its fancy
    name, will continue to operate in a decentralized border management system. The
    EBCG could be better defined as a Frontex+107 or a mere legal fiction made up
    of the sum of the new agency and the national authorities that remain in charge
    of the management of the external borders.¹108


    The EBCG has not been bestowed with executive and powers in the management of
    the external borders, as was proposed by “Unisys” in its third and final phase
    of Frontex’s. The recently established EBCG could be situated between the first
    and second phases of the “Unisys” model, since the technical and operational tasks
    originally conferred on Frontex have been significantly broadened by the Member
    States ultimately to be in charge of the executive and coercive activities at
    their external borders. In this regard, Article 7 Regulation 2019/1896 states
    that the Member States are primarily responsible for the management of their section
