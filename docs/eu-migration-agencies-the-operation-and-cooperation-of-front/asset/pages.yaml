    Figure 6.2 Evolution of the operational and implementation role of Frontex, EASO
    and Europol


    The reinforcement of the operational tasks and implementation role of Frontex,
    EASO and Europol is not in itself an issue. What is problematic the broad formulation
    of these AFSJ agencies’ legal bases and the lack of transparency surrounding their
    operational activities and cooperation, rendering the task of determining the
    degree of discretion they enjoy difficult. The key challenge involves determining
    the degree of discretion that Frontex, EASO and Europol enjoy and whether the
    institutional balance in the EU is respected. In this light, and despite the fact
    they have been vested with delegated powers, this study followed the CJEU’s non-delegation
    doctrine as useful guidance to analyze the legality of these AFSJ agencies’ operational
    functions under EU constitutional law. The'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'CJEU, in *Short-Selling*, updated and relaxed its initial *Meroni* doctrine,
    by no longer confining delegation to clearly defined executive powers, but rather
    to powers precisely delineated and amenable to judicial review in the light of
    the objectives established by the delegating authority.


    Unlike the case of *Short-Selling*, the operational powers of Frontex, EASO and
    Europol are merely circumscribed by well-detailed conditions that limit their
    discretion, not clearly detailed in a legal framework or their Regulations. These
    ASFS operational tasks are not restricted to merely providing technical support
    to the frontline Member States, but rather, they developing cross-agency operational
    cooperation and activities on the ground. Agencies tasks entail the exercise of
    discretionary prerogatives that are not merely delineated or clearly conditioned
    in any national or EU instrument.


    For instance, Frontex and EASO play a strong recommendatory role in the hotspots,
    which in principle, is compatible with the non-delegation doctrine, since the
    concerned Member States are not bound by Frontex and EASO''s recommendations.
    Nevertheless, the national authorities, subject to extraordinary migratory pressure,
    may decide to rubber-stamp the recommendations put forward by agencies. Frontex''s
    influence over the Greek officials in determining the nationality of the arriving
    migrants, Europol''s advice and operational support to the enforcement authorities
    to dismantle migrant smuggling networks, and EASO''s admissibility assessment
    of the asylum applications or the detection of vulnerable applicants encompass
    in practice discretion and political choices. In these cases, the responsibilities
    of the agencies are blurred, since the national authorities adopt a final decision
    based on the assessment of the agencies.


    Although fully autonomous enforcement and coercive powers are not possible under
    the current Treaties and would breach the non-delegation doctrine, the ambiguity
    and lack of transparency surrounding the operational tasks that Frontex, EASO
    and Europol undertake on the ground challenge the determination of their discretion
    and whether they actually make policy choices. In the author''s view, the main
    limitation and control of operational role currently come from the Member States.
    While it is true that Frontex, EASO and Europol assist the Member States in matters
    closely linked to their national sovereignty prerogatives, the competent national
    authorities vote at the management boards tightly control their recently reinforced
    operational, implementation and supervisory functions. Only two representatives
    of the European Commission have voting rights in Frontex and EASO''s management
    boards and this figure falls to just one representative in the case of Europol.
    The presence of the European Parliament in Frontex, EASO and Europol''s management
    boards is non-existent. Member States also exert their influence over the appointment'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'and supervision of the executive directors, who lead the governance, manage-
    and daily administration of Frontex, EASO and Europol.


    Member States'' reluctance to fully abandon their well-established bilateral practices,
    share information and operationally cooperate with Frontex, EASO and Europol in
    core sovereignty matters, like border management, asylum or migration, is especially
    reflected in these FSJS agencies'' boards. The Member States will maintain control
    of the strategic decisions and the daily management of Frontex, EASO and Europol.
    While centralizing the executive, decisal and enforcement powers of Frontex, EASO
    and Europol will ensure a fully effective and harmonized implementation, it is
    important to keep in mind that these agencies represent an institutional trade-off
    or a common ground between intergovernmental and communitarization in the FSJS.
    That is, Member States do not wish to relinquish further sensitive competences
    to the EU institutions; but at the same time, they increasingly need supranational
    assistance regarding matters that can only be managed in an integrated manner
    at the EU level. For this reason, whereas Frontex, Europol and EASO have been
    conferred with significant tasks, none of these agencies are vested with full
    decision, enforcement or coercive powers, which remain an exclusive competence
    of the competent national authorities.


    # 5 PERSPECTIVES


    This book has comparatively analyzed the evolution of the operational tasks of
    the three most representative decentralized EU agencies involved in migration,
    border management and asylum matters. The *agencification* of the FSJS is at an
    early stage and the avenues for further research in this policy area with the
    aim of designing better and more effective measures are thus numerous. The most
    obvious question to be drawn from this book is whether the operational role of
    Frontex, EASO and Europol in the FSJS will be further expanded in the future.
    Specifically, one may wonder how the intervention or operational powers of the
    recently established EBCG and the future EUAA will develop, as well as to what
    extent the Member States will limit these significant tasks in the agencies''
    management boards, or if the agencies will be finally provided with the resources
    and staff required to effectively and autonomously function. In regard to Europol,
    it remains to be seen whether the Agency will, in operational terms, as relevant
    as Frontex and EASO in migration matters.


    It remains to be seen whether the hotspot approach will become the central crisis
    management instrument in order to operationally support the Member States on the
    ground when they are confronted with a sudden and extraordinary migratory pressure
    in their external borders. The hotspots could'
