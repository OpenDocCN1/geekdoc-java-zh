    # REINFORCED MULTILATERAL AND OPERATIONAL COOPERATION OF FRONTEX, EASO AND EUROPOL


    Frontex, EASO and Europol have been conferred upon overlapping and fragmented
    functions over migration, asylum and border management matters. Against this background,
    inter-agency cooperation needs to be promoted to prevent redundancy or inefficiency.
    Frontex, EASO and Europol do not just coexist, yet respective Regulations call
    them to horizontally cooperate. This cooperation has taken place over time both
    in a bilateral and multilateral way, as well as in a formal and informal manner.
    Frontex, EASO and Europol regularly exchange information and best practices, in
    collaboration to join projects or activities.


    The hotspot approach is the most important framework to date, under which Frontex,
    EASO and Europol are called upon to operate on the ground (see Figure 6.1). In
    the author''s view, the hotspot approach will not only be consolidated as a strategic
    measure for the EU to handle migratory crises but will also serve to ensure that
    frontline Member States are sufficiently prepared for extraordinary and sudden
    migratory pressures. Therefore, if the hotspots cease to be a short-term measure
    as a result of the "refugees crisis" and become a long-term approach, under which
    Frontex, EASO and Europol jointly deploy teams on the ground, a legislative instrument
    specifying the responsibility of each actor should be urgently adopted.


    Frontex, EASO and Europol are required to work together in the hotspots with the
    shared aim of coordinating their operational support to those Member States facing
    a sudden and disproportionate migratory pressure in their external borders. The
    role that these agencies play in ensuring consistent and coherent operational
    responses and implementation in crisis and emergency situations is crucial. The
    hotspot approach also shows that Frontex, EASO and Europol are increasingly expanding
