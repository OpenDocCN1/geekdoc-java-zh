  md: '# Foreword


    My research has focused on EU Justice and Home Affairs (JHA) for almost twenty
    years. During the early years, just after 9/11, I focused significantly on the
    European response to the terrible terror attacks on the United States and Europe.
    While my early work had focused on the European Commission, and perhaps, subsequently
    upon the Council Secretariat, I started to work more and on the then "new" phenomenon
    of *agencification* in the Area of Freedom, Security and Justice (AFSJ) of the
    European Union (EU). I was very fortunate to have a Marie Curie Senior Research
    Fellowship at the European University Institute in Florence (2010-2012), where
    I worked significantly on the emerging agencies in the EU JHA. Over the years,
    I have worked with many agencies in the European internal security field, from
    Europol, to Eurojust, to which I have been an invited expert for the Counter-Terrorism
    Committee of the European Parliament and the EU Institute for Security Studies,
    and have devoted to South Wales in the United Kingdom as Professor of Policing
    and Security, I have since established an international research center devoted
    to policing and security, dealing with internal security agencies at the EU, national
    and regional level.


    It is therefore great honor and privilege to be introduce this wonderful book
    by Dr David Fernández-Rojo. I had the fortune to get to know him several years
    ago, very friendly, very polite, and with a lot of competence and dynamism that
    had impressed me much from the beginning. I am now extremely impressed with his
    book, covering very interesting topic which continues to be both theoretically
    and policy relevant. It is very rare to find a young scholar with a deep knowledge
    of EU JHA agencies. It is ever rarer to find a young researcher to also have the
    required knowledge of the EU JHA more generally, which, by most academics'' accounts,
    is one of the most complicated of all EU policy fields.


    In his book'
