    The complaints lodged with the EBCG are not publicly available, but access is
    granted on a case-by-case basis upon submitting a request to the Agency for access
    to documents. Publicizing the complaints is an essential task, since it would
    facilitate future complaints in assessing the effectiveness of the mechanism,
    which would put pressure on the Agency to more effectively mainstream fundamental
    rights and would encourage the Agency to adjust its actions in the future. Hence,
    the findings and follow-up of the complaints submitted should also be forwarded
    by the FRO to the CF, the European Ombudsman and the European Parliament’s Committee
    on Civil Liberties, Justice and Home Affairs.


    The main issue with the individual complaint mechanism as designed is based on
    its lack of independence and impartiality.¹⁶⁸ The executive director, who is in
    charge of reporting back to the FRO about the measures to be taken regarding an
    admitted complaint, is independent from the Agency. Rather, the executive director
    is appointed by the management board, which is composed of one representative
    from each Member State and two representatives from the Commission. The mandate
    of the FRO should be enhanced, since she does not have the power to suggest operational
    improvements to enhancing processes, to implement a plan to execute the measures
    adopted by the EBCG or Member States or to impose any sanctions against the Agency.
    Had the FRO been provided with the function to compensate individuals, for the
    harm the complaint mechanism would have been effectively enhanced. The FRO could
    have been directly allocated a special budget to compensate an aggrieved complainant
    whose fundamental rights were found to have been violated or to finance other
    remedies. The FRO could have been least granted, jointly with the executive director,
    the power to terminate, suspend or withdraw financial support if an operation
    of the Agency did not comply with fundamental rights.


    Lastly, no reference is made to a remedy within the EBCG if the complaint or the
    concerned measures adopted by the Agency are not executed or implemented effectively.
    Offering the option to file a complaint of maladministration against the Agency
    with the European Ombudsman would more effectively ensure the complainant’s rights.
    For instance, the European Investment Bank, which has a complaint mechanism in
    place, signed a memorandum of


