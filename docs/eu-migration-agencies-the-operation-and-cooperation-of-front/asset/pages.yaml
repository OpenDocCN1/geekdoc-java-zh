  md: '# 2.2 A Stringent Application of the Non-Delegation Doctrine to the Operational
    Tasks and Cooperation of Frontex, EASO and Europol


    In the absence of explicit provisions in primary law that address the establishment
    and delegation of tasks to EU decentralized agencies, CJEU''s non-delegation doctrine
    shifts the degree of powers that can be bestowed upon EU agencies, particularly
    those that operate in the internal market. However, since the Treaty of Amsterdam
    entered into force, EU decentralized agencies have started to become key players
    in other policy matters the AFSI. The functions of Frontex, EASO and Europol are
    no longer limited to operationally supporting and coordinating the competent national
    authorities''. The latest legislative revisions of the AFSI agencies aimed to
    strengthen their position in relation to the Member States and to overcome the
    implementation deficit of EU border management and asylum measures. Frontex, EASO
    and Europol now conduct significant operational activities, deploy support teams
    in the territory of the Member States and play a supervisory role. The impact
    of the Meroni doctrine and specifically, the implications of the Short-Selling
    ruling in the expanding operational role that Frontex, EASO and Europol play in
    the AFSI, will be analyzed.


    In Short-Selling, the CJEU disregarded whether the tasks bestowed upon EU agencies
    constitute a delegation or a conferral of powers. Using these terms interchangeably
    is not tricky, especially when AFSI agencies are studied, since the main recipients
    of their operational tasks are the competent national administrations. Hofmann
    and Morlini explained the direct delegation *a qui potest plus minus* approach
    to Article 291 TFEU. They stated that “if Member States under Article 291(1) TFEU
    can maintain fulfilling powers, they may also pool some of these in specific legal
    bodies". However, in Short-Selling, the CJEU finally designed a parallel delegation
    system to Articles 290 and 291 TFEU. The Court did not understand that Article
    291 TFEU might implicitly allow the conferral of powers on EU agencies. The CJEU
    in Short-Selling eluded to drawing a distinction between “delegation”


