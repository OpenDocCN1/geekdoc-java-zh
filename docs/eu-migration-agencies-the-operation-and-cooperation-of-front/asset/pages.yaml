    Following the mandate of the European Council of Laeken and having consulted the
    feasibility study led by Italy, the European Commission published a communication
    in May 2002 “towards integrated management of the external borders of the Member
    States of the European Union”.39 The main challenge that the Commission identified
    in the management of the European external borders consisted in the lack of effective
    operational coordination between the national authorities, preventing the achievement
    of a uniform level of security by the borders.40 The Commission considered it
    essential to design an operational common cooperation and coordination body that,
    in the short term, would consist of an External Borders Practitioners Unit, and
    in the medium term, a European Corps of Border Guards.41


    The External Borders Practitioners Common Unit would have an intergovernmental
    nature and would be integrated into the structures of the Corps. By contrast,
    the European Corps of Border Guards would be an independent supranational organization
    in charge of initially deploying surveillance and control missions at the external
    borders and would commission its own border guards at a later stage. The European
    Commission acknowledged that the design of the European Corps of Border Guards
    would require revising the Treaties and overcoming a major constitutional challenge,
    namely,”conferring the prerogatives of public authority on staff who do not have
    the membership of the Member State where they are deployed”.42 Furthermore, other
    practical issues would need to be settled: the recruitment, statutory and disciplinary
    conditions of the border guards placed at the disposal of the European Corps by
    the Member States and the allocation of its own equipment.43


    The European Commission concluded that operational coordination and cooperation
    should rest upon two instruments: an External Borders Practitioners Common Unit
    and a permanent post of exchange of data and information. The Common Unit would
