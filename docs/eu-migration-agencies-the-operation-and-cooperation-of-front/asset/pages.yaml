  md: 'The legal provisions of Frontex, EASO and Europol neither provide a comprehensive
    framework detailing the extent of the powers conferred on the EBGTs, ASTs or the
    participation of Europol in the JITs, nor do they offer a clear account of the
    operational measures that the deployed officials conduct on the ground. The operational
    powers of Europol officials in the JITs are ambiguous; since it is unclear to
    what extent Europol may support or attend the operations developed by the competent
    national enforcement authorities.¹16 As De Moor reasoned, Europol’s presence and
    assistance to the Member States might provide benefit, since the Agency holds
    a “unique background knowledge and expertise about specific phenomena which they
    can offer to the officers in the field”.17 Furthermore, the key objective of Regulation
    1168/2011 was to tackle the dependence of Frontex on the Member States’ willingness
    to contribute to the Agency’s operations. In this respect, Member States were
    required to make their border guards available for every operation and the pool
    of seconded guest officers, provided the discharge of their national tasks was
    not seriously affected. However, the specific operational powers and the limits
    of the EBGTs’ action on the ground lacked precision. Similarly, Regulation 439/2010
    of EASO ambiguously and openly refers to the operational powers of the ASTs.


