    the legality of AFSJ agencies under EU constitutional law. Meroni and Romano specified
    under which conditions the delegation of powers is constitutional. It is stipulated
    that the delegation of open, discretionary or normative functions to agencies
    is prohibited since the institutional balance would be upset. The Short-Selling
    case brought the old but still good law, the Meroni doctrine, up to date, and
    clarified to what extent powers may be constitutionally bestowed upon EU agencies.
    The implications of the CJEU''s non-delegation doctrine to Frontex, EASO and Europol
    in the post-Lisbon era are assessed.


    This chapter concludes by arguing that the main limitation to Frontex, EASO and
    Europol''s reinforced operational and implementation role come from the Member
    States and civil society. While it is true that Frontex, EASO and Europol assist
    the Member States in matters closely linked to their national sovereignty prerogatives,
    the competent national authorities that vote the management boards of the agencies
    control their recently reinforced operational functions. Member States also exert
    their influence on the appointment and supervision of the executive directors,
    who lead the governance, management and daily administration of Frontex, EASO
    and Europol. Lastly, civil society through the consultative and the individual
    complaint mechanism make more transparent the operational activities that these
    AFSJ agencies conduct practice on the ground.


    +   1. THE UNSUITABILITY OF A PRINCIPAL–AGENT APPROACH AS AN EXPLAINING MODEL
    FOR THE OPERATIONAL TASKS CONFERRED ON FRONTEX, EASO AND EUROPOL


    Primary law only refers to decentralized agencies indirectly, without offering
    a definition or stating common legal guidelines regarding their creation and delegation
    of powers. Articles 15 and 16 TFEU mention “Union institutions, bodies, offices
    and agencies” and Article 263 TFEU denotes one of the key characteristics of EU
    agencies, their establishment by secondary law, declaring that the CJEU “shall
    [...] review the legality of acts of bodies, offices or agencies of the Union
    intended to produce legal effects vis-à-vis third parties”. The CJEU may review
