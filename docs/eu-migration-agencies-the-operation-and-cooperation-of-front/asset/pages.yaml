  md: '# Tasks of Frontex, EASO and Europol and impact of their activities


    In 2013, the European Commission ordered a study from "Unisys" in order to examine
    the feasibility of introducing a European System of Border Guards. The study,
    which was published on 16 June 2014, put forward a model, divided into three subsequent
    phases, to gradually achieve integrated management of the European borders. On
    the one hand, the model sought to accommodate the position of Frontex, the Commission
    and a large number of Members of the European Parliament$^{102}$ that advocated
    for a greater delegation of powers to the EU. On the other, the Member States
    prioritized a more moderate integration of border management measures.$103$


    According to the study conducted by "Unisys", the first phase (until 2020) for
    the development of a European System of Border Guards should consist in deepening
    and developing Frontex’s powers and structure to the fullest. The Agency should
    continue to support the work of national authorities without delegating competences.
    The second phase, however, could encompass a transfer of executive powers to Frontex
    but only the so-called hotspots (geographic areas subject to disproportionate
    migratory pressure). That is, while the daily management of the borders would
    continue to be the exclusive function of the Member States, the hotspots operations
    would be the guard.$104$ As early as 2030 (phase three), the "Unisys" study envisaged
    an decentralized Agency that would be completely centralized and in charge of
    the supranational management of the European external borders. Due to the executive
    and decision-making powers of this new "European agency, a reform of the current
    Treaties and the internal legislation of some Member States is deemed necessary
    by the "Unisys" study.


    Although the recently adopted Regulations 2016/1624 and 2019/1896 misleading refer
    to a "European Border and Coast Guard",$^{105}$ this new Frontex


