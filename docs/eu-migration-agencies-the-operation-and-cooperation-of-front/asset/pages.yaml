  md: '# Operational cooperation among Frontex, EASO and Europol


    While inter-agency cooperation is highly desirable in fragmented policy matters
    like migration, asylum and border management, the agencies involved may face difficulties
    in achieving effective coordination. The mandate and tasks of the agencies may
    be presenting conflicting priorities and goals, or cooperation between the agencies
    may lead to competition to gain further control over the common policy field,
    which may limit the agencies'' autonomy, flexibility and functions. Hence, effective
    and attractive cooperation between agencies over a common policy demands a clear
    legal framework that protects the shared objectives of the agencies and ensures
    the autonomy of each agency.


    The third scenario depicted in Figure 4.1 consists of the EU legislature deciding
    to either merge Frontex and EASO into a single agency or to design a central department
    to vertically coordinate every task conferred on Frontex and EASO. The Common
    Approach for EU Agencies stated that “merging agencies should be considered in
    cases where their respective tasks are overlapping, when synergies could be contemplated
    or when agencies would be more efficient if inserted in a bigger structure”. While
    the creation of a single agency would remove any risk of overlap or duplication,
    the uniqueness and added value of each agency would also disappear. In practice,
    the merger of agencies is a rather hypothetical scenario to the agencies'' constant
    rejection of such option and the questionable logic behind the combination of
    agencies with different natures of tasks.


    In the AFSJ, two cases regarding the merging of EU agencies were unsuccessfully
    negotiated: the European Institute for Gender Equality (EIGE) with the FRA and
    Europol with the EU Agency for Law Enforcement Training (Cepol). On the one hand,
    the European Commission assessed, in its Proposal for a Regulation establishing
    the Institute, whether the tasks of the Institute should be included within the
    remit of the FRA. The Commission finally argued that the creation of a separate
    agency was justified due to the “advanced state of


