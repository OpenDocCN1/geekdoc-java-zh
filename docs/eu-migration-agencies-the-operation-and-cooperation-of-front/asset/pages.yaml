    A Member State facing an exceptional and sudden arrival of migrants at the external
    borders may request the assistance of the European Commission and the AFSJ agencies
    through the establishment of a hotspot or several hotspots in its territory. However,
    if a concerned Member State is subject to a disproportionately high influx of
    third-country nationals and not receive sufficient support, the European Commission
    may also suggest the creation of hotspots in the territory of the Member State.
