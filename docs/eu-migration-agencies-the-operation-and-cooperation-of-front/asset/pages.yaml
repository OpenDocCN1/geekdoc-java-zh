    in the administration of its borders, registration and asylum systems. If a Member
    State fails to take the measures recommended by these agencies or does not take
    the necessary action in the face of disproportionate migratory pressure, the EBCG
    and the EUAA shall adopt a unified and effective EU approach, since the functioning
    of the Schengen area and the CEAS may otherwise be jeopardized. Whereas the current
    tasks already present an erosion of the operational powers and implementation
    prerogatives of the Member States, some of these AFSJ agencies have been bestowed
    with centralized, fully autonomous operational and enforcement powers on the ground.
    Figure 6.2 shows that Frontex, EASO and Europol are still far from the upper-right
    corner of the right quadrant, which represents the full centralization or federalization
    of border management, asylum and migration matters. It remains to be seen, however,
    how broadly the EBCG and the EUAA will interpret their supervisory and intervention
    capacity, and whether the EU rules and policies on border management and asylum
    will ultimately be more effectively and uniformly implemented.'
