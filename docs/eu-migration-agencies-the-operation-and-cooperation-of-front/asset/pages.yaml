    The second scenario would consist in Frontex and EASO cooperating and exerting
    a greater influence over the common policy issue. Inter-agency cooperation would
    promote a coherent and consistent approach and encourage joint workings, since
    each agency exerts a coordinated degree of power over the common policy area.
    Overlaps and duplication may still occur under this scenario, but fragmentation
    should diminish, since coordination may increase the effectiveness and consistency
    of the agencies’ action. According to a study commissioned by the European Parliament,
    there are several cases hindering a fully effective inter-agency cooperation in
    the AFSI; (1) these agencies were designed in different times, contexts and decisional
    frameworks (for example, Europol was negotiated and established by the Treaty
    of Maastricht, Frontex under the Treaty of Nice and EASO under the current Treaty
    of Lisbon); (2) Frontex, EASO and Europol are driven by different philosophies,
    natures and logics; (3) these agencies present distinctive structures, resources
    available and professional cultures; (4) the Regulations governing these agencies
    remain vague in regard to cooperation, leaving the agencies to develop their inter-agency
    relationships themselves.


