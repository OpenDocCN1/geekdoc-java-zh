  md: '# 4. Bilateral and multilateral operational cooperation among Frontex, EASO
    and Europol


    The European Border and Coast Guard (EBCG) and the future EU Agency for Asylum
    (EUAA) shall guarantee and even intervene if the actions or omissions of a concerned
    Member State jeopardize the effective functioning of the Schengen area the Common
    European Asylum System (CEAS). Europol may launch and carry out investigations
    and those Member States that decide not to participate be obliged to justify their
    reasoning. The EBCG, the EUAA and Europol have thus vested with monitoring and
    recommend powers, as well as important operational tasks to further assist the
    concerned Member States on the ground. Not only are the operational and overseeing
    tasks of Frontex, EASO and Europol reinforced, but their multilateral cooperation
    on the ground to assist the frontline Member States also has been expanded after
    the adoption of the hotspot approach. Gradually, these Area of Freedom, Security
    and Justice (AFSJ) agencies have been assigned operational tasks on closely intertwined
    matters, which require their coordination and cooperation to prevent overlaps,
    duplications and working silos. The shared policy areas in which Frontex, EASO
    and Europol operate increasingly demand inter-agency cooperation.


    While Frontex, EASO and Europol were already cooperating on a bilateral and multilateral
    basis before the hotspot approach was designed in 2015, the "refugee crisis" revealed
    the need to develop a more systematic and operational cooperation of these agencies
    on the territory of the Member States. Precisely, the European Agency on Migration
    introduced a system of enhanced cooperation, the hotspot approach, with the aim
    of facilitating rapid and integrated intervention of EU AFS agencies in Member
    States subject to a specific and disproportionate migratory pressure at their
    external borders. The hotspot approach is based on Articles 78(3) and 80 TFEU,
    which provide that if a Member State is facing a sudden and unexpected influx
    of migrants, the EU may adopt provisional measures in accordance with the principles
    of solidarity and fair sharing of responsibility.


