  md: '# Operational cooperation among Frontex, EASO and Europol


    According to the Regulations establishing Frontex, EASO, and the Council Decision
    designing Europol, these agencies are called on to “cooperate”. Cooperation not
    only entails an informal communication among them, but also a more formalized
    inter-agency exchange, with the aim of effectively attaining their objectives.
    Nevertheless, cooperation leads to an attenuation of these agencies'' independence,
    which may jeopardize their organizational uniqueness and require them to undertake
    additional tasks. Any type of inter-agency cooperation primarily aims to overcome
    fragmentation, duplication and overlap. Fragmentation may take place when Frontex,
    EASO and Europol are competent over the same policy area. In fact, migration,
    asylum and border management are characteristically fragmented matters, where
    duplication is very likely to arise when Frontex, EASO and Europol provide parallel
    support to the same national authorities. In these circumstances, overlap may
    also occur as a result of Frontex, EASO and Europol having related objectives,
    in analogous activities to attain such objectives and assisting the Member States.


    Against this background, in view three approaches can be used as scenarios to
    analyze issues that affect policy fields simultaneously and in which two or more
    agencies exert their influence. As can be seen in Figure 4.1, the first approach
    encompasses a lack of cooperation among agencies, with the second promoting inter-agency
    cooperation and the third merging the existing agencies.


    To illustrate these three scenarios set out in Figure 4.1, Frontex (Agency A)
    and EASO (Agency B) can be taken as a first scenario. The objective of Frontex
    is to assist the competent national authorities in effectively managing their
    external borders (policy field A) and EASO’s goal consists in supporting the Member
    States in effectively and uniformly applying the CEAS (policy field B). However,
    Frontex and EASO may be confronted with an issue (for example, a sudden and exceptional
    arrival of migration flows at the external border of a Member State) that concurrently
    affects the mandate of both agencies. In such a situation, Frontex and EASO may
    separately and independently tackle the common issue. In this case, although the
    agencies would see their independence and authority untouched, duplication and
    overlap may arise. Thus, such a problem affecting Frontex and EASO may be tackled
    incoently, inconsistently and insufficiently, since the scope of the policy problem
    requires the interaction of both agencies.


    4, Madalina, “Friend or foe? Inter-agency cooperation, organizational reputation,
    and turf”, Public Administration, 94(1), 2016, p. 44.'
