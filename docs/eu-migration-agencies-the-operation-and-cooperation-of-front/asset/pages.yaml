    For the management and coordination of every joint operation, Frontex also deploys
    an operational team, which is led by an operational manager in the territory of
    the host Member State. The operational manager, with the assistance of specialized
    staff from the relevant Frontex units, the operational manager coordinates the
    planning, implementation, reporting and evaluation of the operational activities.
    In particular, the operational manager elaborates Frontex''s financial contribution,
    implements the operational activities of the Agency in a flexible manner, follows
    the developments of the concerned operation and proposes updating the operational
    plan accordingly.¹⁶⁰


    Therefore, Frontex has not been a passive spectator during the operations that
    it organized and coordinated. The Agency closely managed the operational implementation
    of the activities and owned the operation in practice. Although the national ICC
    Coordinator of the host Member State is formally the authority coordinating the
    concerned joint operation, cooperation cooperation between ICC coordinator and
    Frontex''s operational coordinator and manager, combined with the lack of transparency
    surrounding the operations coordinated by Frontex, makes it difficult to draw
    clear limits between their functions.


    Furthermore, the dependency of Frontex on the resources available by the Member
