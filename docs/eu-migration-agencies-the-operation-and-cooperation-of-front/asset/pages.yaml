    # 1.1 Europol''s Participation in the Joint Investigation Teams and the Deployment
    of Frontex''s European Border Guard Teams and EASO''s Asylum Support Teams


    A JIT is an investigation team established in accordance with an agreement between
    two or more Member States with the aim of effectively achieving a specific objective
    during a set period of time, regarding criminal investigations in one or more
    of the involved States. Since 2007, Europol may directly participate in the JITs
    in a support capacity by exchanging and coordinating information and providing
    legal advice, analytical, investigative and forensic expertise or financial assistance.
    Additionally, Europol shall ensure the efficiency and operational capacity of
    the JITs and the overall success of the investigation.


    Concurrently, in 2007, Frontex''s Rapid Border Intervention Teams (RABITs) were
    introduced. According to Regulation 863/2007, the RABITs were mandated, by the
    Member States, to provide rapid operational assistance for a limited period of
    time in the territory of the requesting national authority. Subsequently, Regulation
    1168/2011 transformed the RABITs into the EBGTs, which Frontex could deploy not
    only in raid border interventions, but also in joint operations.


    In a similar vein, Article 13 Regulation 439/2010 of EASO indicates that the Agency
    may deploy ASTs in order to provide emergency operational support to those Member
    States facing a sudden and extraordinary pressure on their asylum and reception
    systems. In such a case, asylum experts are


