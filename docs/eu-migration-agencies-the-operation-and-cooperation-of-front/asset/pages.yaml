    COOPERATION OF FRONTEX, EASO AND EUROPOL


    With regard to Frontex, EASO and Europol, control over the de facto expansion
    of the operational tasks that these agencies develop on the ground is essential
    due to the direct or indirect impact of their activities on the fundamental rights
    of the individuals and also due to the potential tensions with the competent national
    authorities’. The de facto reinforcement of the operational powers and cooperation
    of Frontex, EASO and Europol has led to gaps in the multidimensional control system,
    which is naturally designed to assess these ASFS agencies de jure authorities.
    Since civil society is gaining momentum in the EU and these ASFS agencies have
    a duty to maintain a close dialogue with relevant civil society organizations,
    social accountability suggests a suitable control mechanism with the aim of addressing
    the challenges posed by the recent expansion of Frontex, EASO and Europol''s operational
    mandate.¹166


    While Frontex, EASO and Europol shall take into account the views of relevant
    stakeholders, only Frontex and EASO have formalized a relationship with the several
