    # 2 THE EUROPEAN BORDER AND COAST GUARD, THE FUTURE EU AGENCY FOR ASYLUM AND EUROPOL’S
    MIGRANT SMUGLING CENTER: DEVELOPING OPERATIONAL TEETH


    Frontex, EASO and Europol come to the forefront with the “refugee crisis”. The
    European Commission showed no hesitation in tabling the transformation of Frontex
    and EASO into what the Commission misleadingly referred to as “fledged agencies”.
    In the aftermath of the “refugee crisis”, the EU’s strategy relied on strengthening
    the operational and administrative capabilities of the EU, rather than adopting
    new laws. Regulation 2016/1624, establishing the European Border and Coast Guard
    Agency (EBCG), was agreed upon by co-decision in record. Regulation 2017/794 of
    Europol entered into force in May 2017 and the final adoption of the Regulation
    on the EU Agency for Asylum (EUAA) awaits the pending negotiations on the rest
    of the CEAS package.


    While Regulation 2017/794 of Europol explicitly indicates that the EU may establish
    centers of specialized expertise, such as the European Migrant Smuggling Centre
    (EMSC), it does not fully clarify the specific operational tasks that Europol
    may conduct through these centers. Europol may deploy staff on the ground to support
    the national enforcement authorities in dismantling the illegal migrant smuggling
    networks. The extent of Europol’s involvement and operational support to the Member
    States on the ground is very difficult to determine, due to the secrecy and systematic
    refusal of the Agency to grant full or partial access to documents.


    The EMSC delivers crossmatch and operational analysis reports, facilitates information
    exchange among the Member States and deploys mobile teams of specialists and forensic
    support to the national law enforcement officers¹. Europol recognizes that a “strong
    operational capacity [...] has also been used in the set-up of secondary security
    checks [...] to strengthen security checks on the inward flows of migrants, to
    disrupt migrant smuggling networks and identify suspected terrorists and criminals”².
    In the aftermath of the “refugee crisis”, Europol started to develop an unprecedented
    operational role in migration and asylum matters


