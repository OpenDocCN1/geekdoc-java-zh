    # 4.2.2 The functioning of the EBCG''s individual complaint mechanism


    With the aim of studying the complaint mechanism, its functioning is divided into
    three consecutive phases: (1) presentation, registration, and referral of the
    complaint to the Agency or to the Member State as appropriate; (2) follow-up of
    the complaint accepted; and (3) findings and monitoring of the Agency or the concerned
    national authority to a specific complaint. Regarding the first phase, Article
    112(2) Regulation 2019/1896 declares that “any person who is directly affected
    by the actions or failure to act on the part of staff involved in a joint operation
    [...] of the Agency [...], who considers himself or herself to have been the subject
    of a breach of his or her fundamental rights due to those actions or failure to
    act, or any party representing such a person, may submit a complaint in writing
    to the Agency”.


    Complainants must be directly affected by the actions of personnel involved in
    the specific operation and demonstrate a causal link between such actions and
    the violation of a particular fundamental right. Article 5 of the Agency’s rules
    on the complaints mechanism states that any complaint shall be in writing, preferably
    through the form created for that purpose¹⁶ and should describe in sufficient
    detail the concrete action of the Agency that has violated the complainant''s
    fundamental rights (see Table 5.2).¹⁵⁷ Article 8 goes to say that the complaint
    must be filed within one year from the date on which the alleged violation of
    the fundamental right occurred or the complainant was informed or learnt about
    such violation.


    The second phase of the complaint mechanism involves an appropriate follow-up
    of the complaint by the EBCG''s executive director or the concerned Member State,
    depending on whether the complaint relates to a staff member of the Agency or
    to one of the national border guards. On the one hand, Article 111(6) Regulation
    2019/1896 indicates that “the executive director shall ensure the appropriate
