  md: '# 1. Introduction to Frontex, EASO and Europol as operational decentralized
    agencies


    # 1. SETTING THE SCENE


    # 1.1 The Agencification of the Area of Freedom, Security and Justice


    Article 3(2) of the Treaty on the European Union (TEU) states that the European
    Union (EU) shall offer its citizens an Area of Freedom, Security and Justice (AFSJ).
    The AFSJ covers a wide range of policy fields: border management, asylum, the
    recognition of judgments in civil and criminal matters, and police cooperation
    (67 Treaty on the Functioning of the European Union (TFEU)). While these are sensitive
    matters, representing traditional State-centered competencies and the fundamental
    rights of the individuals, the EU has a shared competence in AFSJ matters (Article
    4(2)(j) TFEU). Additionally, the Member States shall adopt all measures of national
    law necessary to implement the Union acts (Article 29(1) TFEU in relation to Article
    4(3) TEU).


    The evolution of the AFSJ has been characterized by the Member States'' reluctance
    to vest more powers in the EU institutions. events like the abolition of internal
    borders, the increasing migratory pressure on the external borders, the rise in
    asylum applications or cross-border criminality could no longer be effectively
    managed by the national authorities individually. Therefore, one way to support
    the Member States and streamline their cooperation was through the establishment
    of several decentralized European agencies. These agencies'' mission centers on
    providing assistance to the competent national authorities to ensure that the
    AFSJ policies are implemented. As the European Commission observes, “agencies
    have proved particularly relevant in field of shared compet, when the implementation
    of new policies at Community level needs to be accompanied by close'
