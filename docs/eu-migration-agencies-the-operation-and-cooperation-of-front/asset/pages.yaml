    developing the agencies'' regular cooperation and building mutual trust with the
    competent national authorities, which will enhance the swift exchange of information
    and data among the hotspot stakeholders and promote the effective and uniform
    application of the EU acquis at the hotspot and local level.


    The lack of a legal framework defining the specific tasks of Frontex, EASO and
    their reinforced multilateral cooperation at the hotspots hinders the allocation
    of operational responsibilities among the agencies and makes it difficult to determine
    the specific powers that each agency shall undertake upon the ground. This section
    analyzes the precise role and operational tasks that Frontex, EASO and Europol
    are developing in practice at the hotspots (see Figure 4.2).


    # 4.2.1 Frontex''s assistance in registering, debriefing and reviewing the arriving
    migrants


    Frontex performs a threefold operational role at the hotspots: a registration
    and screening – by assisting the concerned Member State in fingerprinting and
    determining the identity and nationality of the arriving migrants; a debriefing
    role – by contributing to the national illegal migrant smuggling and trafficking
    investigations; and lastly, a return role – by coordinating with the competent
    national authorities regarding the removal of those migrants who do not qualify
    for asylum or international protection. All of these tasks are explicitly stated
    in Article 40(4) Regulation 2019/1896 on the EBC, which regulates the deployment
    of migration management support teams in the hotspots.


    Concerning the registration and screening tasks of Frontex, it should be pointed
    out that the ‘Agency’s assistance starts even before the irregular migrants arrive
    at the Member States hosting the hotspots.


