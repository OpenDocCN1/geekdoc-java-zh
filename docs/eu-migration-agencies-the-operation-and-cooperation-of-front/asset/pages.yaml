    # 2.3 Working Arrangements: Formal Bilateral Cooperation among Frontex, EASO and
    Europol


    Regulation 2019/1896 establishing the EBCG, the partially agreed text on

    the EUAA and Regulation 2016/794 on Europol all state that the cooperation

    among them be formalized by the adoption and signature of working

    arangements. The EBCG shall cooperate with Europol and EASO “within

    the framework of working arrangements”, which shall receive the Commission’s

    prior approval. The European Parliament and the Council also need to be

    informed about any such arrangements (Article 68(2) Regulation 2019/1896).

    TheBCG needs to coordinate its activities with Frontex to prevent and

    combat crimes directly into unauthorized crossings of the external

    borders (Article 10(1)(q) Regulation 2019/1896). The EBCG should prim-

    ordinate with EASO regarding migratory challenges characterized by

    large inward migratory flows and procedures regarding third-party

    nations whose international protection are rejected (recital

    53 Regulation 2019/1896).


    Similarly, Article 36 of the partially agreed text on the EUAA indicates

    the Agency, within the framework of working arrangements, shall cooperate

    with the agencies, bodies and offices of the Union that conduct functions

    to the EUAA’s field of activity, and in particular, with the EBCG.

    Lastly, Article 23(1) of Regulation 2016/794 on Europol more vaguely stated

    at“in so far as regard for the performance of its tasks, Europol may estab-

    ish and maintain cooperative relations with Union bodies in accordance with

    the objectives of those bodies”. To this end, Europol may conclude working

    arangements with such bodies to exchange relevant information regarding the

    performance of Europol’s tasks (Article 23(4) Regulation 2016/794).


    Given the significance of the working arrangements in the formal bilateral

    cooperation among Frontex, EASO and Europol, these instruments, their

    characteristics and nature are further analyzed. The working arrangements

