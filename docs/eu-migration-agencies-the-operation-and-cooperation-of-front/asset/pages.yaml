  md: '# OUTLINE THE BOOK


    Due to the predominantly operational nature of the AFSJ, the EU decentralized
    agencies stand out as the mode of administrative governance, specially tasked
    with providing technical expertise, exchanging information and coordinating the
    operational activities of the Member States. Consequently, attention is gradually
    shifting from adopting new AFSJ policy proposals to effectively and implementing
    the existing policy and legislative instruments at the national level. EU AFSJ
    agencies were called to play a key role in the implementation of the EU policies
    on migration, asylum, border management and police and judicial cooperation in
    matters. Precisely, in relation to EU migration, asylum and external border management
    policies, the Stockholm Programme underlined "effective implementation of all
    relevant legal instruments to be undertaken and full should be made of relevant
    Agencies and Offices operating in this field"⁶⁵ In the same vein, the 2014 European
    Council conclusions, setting the strategic guidelines until 2020 for the AFSJ,
    stressed that implementation should be the overall priority. The functional operations
    of agencies like Frontex, EASO and Europol should be further developed to contribute
    to "filling the gap between political decisions in Brussels and the reality on
    the ground"⁶⁶


    This book is divided into six chapters. The first and last chapters are devoted
    to the introduction and conclusion. The second chapter studies the establishment
    and initial operational tasks of Frontex, EASO and Europol, which directly influence
    the current operational powers and cooperation bestowed upon these AFSJ agencies.
    In particular, the agification of the AFSJ, the increasing decreasing of operational
    tasks to Frontex, EASO and Europol and the progressive Europeanization of the
    Justice and Home Affairs (JHA) matters are examined. Frontex, EASO and Europol
    reflect, as the "refugee crisis" has clearly revealed, the institutional tug-of-war
    between the Member States and the EU in very sensitive matters such as border
    management, asylum and migration.


    Chapter 3 maps Frontex, EASO and Europol''s growing operational tasks and the
    impact of their activities on the ground as EU decentralized agencies. Specifically,
    the deployment of EBGTs by Frontex and ASTs by EASO, and the participation of
    Europol in JITs, is examined. Furthermore, the oper-


