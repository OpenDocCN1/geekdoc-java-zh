  md: '# EU migration agencies


    While the operational tasks of Fronttex, and to a lesser extent EASO and Europol,
    have been separately studied by the literature, a comparative analysis of the
    powers and cooperation of Fronttex, EASO and Europol is necessary. The expansion
    of the operational activities and multilateral cooperation of these agencies on
    the ground to the frontline Member States is unprecedented. It is timely to analyze
    the evolution of the operational powers of Fronttex, EASO and Europol in border
    management, asylum and migration matters and to examine to what extent the tasks
    that they conduct in practice are aligned with the provisions established in their
    recently adopted or proposed Regulations. Research is needed in regard to the
    degree of operational support that Fronttex, EASO and Europol are providing and
    the impact of these agencies'' activities in shaping the implementation of a further
    integrated administration of the AFSI.


    This book contributes to the current scholarly research regarding the increasing
    volume of the EU in the implementation or enforcement of laws and policies. It
    is argued that the focus of the EU in border management, migration and asylum
    matters is shifting from adopting measures to tackling the existing implementation
    deficit. The analysis of the evolution of the operational tasks of Fronttex, EASO
    and Europol contributes to the understanding as to what extent the assistance
    of these agencies has an impact on the implementation prerogatives of the Member
    States. Currently, there are three priorities in the AFSI: to offer operational
    support to the Member States, to promote cooperation and coordination and to ensure
    a uniform and effective implementation of the AFSI policies and instruments adopted
    at the EU level.


