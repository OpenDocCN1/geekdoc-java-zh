  md: '# Conclusions and perspectives


    actually become a useful testing ground to further strengthen the operational
    and implementation powers of Frontex, EASO and Europol when the Member States
    face sudden and disproportionate mixed migratory flows. In this regard, a parallel
    legal framework for the hotspots could be adopted. Under this framework, EASO,
    Europol and Frontex could be conferred with executive powers by the Member State,
    for instance and respectively, jointly assess asylum applications, investigate
    the modus operandi of migrant smuggling facilitators or organize and lead border
    operations using its own equipment and border guards.


    Furthermore, the growing operational role of Frontex, EASO and Europol, in implementing
    EU border management, migration and asylum measures, poses questions about the
    legitimacy and constitutionality of this emerging trend, and most importantly,
    on how to hold these agencies effectively accountable and responsible. The operational
    and implementation functions of these FSJ agencies will inevitably have a direct
    or indirect impact on the fundamental rights of the irregular migrants and asylum
    seekers. Since Frontex, EASO and Europol’s operational role under EU law has significantly
    expanded, the responsibility of these agencies should be clarified and their capacity
    to deal with possible violations of fundamental rights should also be strengthened.


    In particular, the operational activities that Frontex, EASO and Europol conduct
    on the ground should be subject to relevant safeguards that protect the fundamental
    rights of the individuals, grant them access to effective remedies and streamline
    the transparency of the ''agency'' activities. In this regard, the key question
    to be addressed is whether these agencies adopt legally binding decisions for
    third parties, since the regulatory or direct enforcement competence, which ultimately
    and in principle remain an exclusive competence of the Member States. ... Frontex,
    EASO and Europol conduct important operational tasks in practice that should at
    least trigger a shared responsibility between the agencies and the Member States.


    Hence, the lack of transparency of these FS agencies’ operations and the obscure
    allocation of responsibilities among the high number of actors involved at the
    external borders makes it difficult to effectively hold the agencies accountable.
    Due to the difficulties that individuals may face when seeking judicial redress
    at the EU or national level, the recent introduction of a complaints mechanism
    within the EBCG and the future EUAA may be regarded as a useful mechanism to promote
    bottom-up accountability. Allowing any person to lodge a complaint against these
    agencies would open a direct channel of communication between the individual and
    the EBCG or the EUAA. However, as this book has pointed out, the main limitation
    of the individual complaints mechanism is based on its lack of independence and
    impartiality. The individual complaints mechanism appears to be merely'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'administrative in nature, implying that it is not fully autonomous to operate
    independently from the EBCG or the future EUAA, and cannot investigate alleged
    fundamental rights violations. Additionally, no further administrative or judicial
    remedies are available if the complainant is not satisfied with the reply or the
    inadmissibility of the complaint, or if the measures adopted by the agency or
    the respective Member State are not executed.


    It is thus necessary to further research how to enhance the effectiveness of the
    complaints mechanism, as well as the role of the Consultative Forum and the Fundamental
    Rights Officer of the EBCG and the future EUAA to effectively and sufficiently
    determine the responsibility of these agencies and ensure that individuals have
    access to effective remedies. While it is true that Europol plays a secondary
    operational role in comparison to Frontex and EASO, that Agency is increasingly
    conducting operational tasks on the ground. If the operational role of Europol
    keeps expanding, the appropriate-ness of creating a CF, a FRO and an individual
    complaints mechanism within Europol should be examined as well.'
