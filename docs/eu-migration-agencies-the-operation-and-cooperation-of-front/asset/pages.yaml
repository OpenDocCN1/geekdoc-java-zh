  md: '# EU migration agencies


    Informal cooperation between Frontex, EASO and Europol is important, if not more
    important, formal cooperation. These AFSJ agencies hold meetings and conversations,
    share practices, exchange information, and work together to closely consider the
    actions, operations and analyses of their counterparts undertake. Informal coordination,
    based on personal relations of trust and mutual respect, significantly contributes
    and complements the agencies'' formal cooperation. Nevertheless, the main issue
    in relation to informal cooperation is the difficulty of tracking, measuring and
    assessing its impact.


    Inter-agency cooperation in border management and asylum policy matters has become
    a key priority at the EU level. The AFSJ agencies, whose tasks are closely connected,
    are progressively reinforcing their cooperation or are least ensuring that they
    work in a compatible manner. In particular, the legal instruments establishing
    Frontex, EASO and Europol called for the promotion of a formal cooperation between
    them. Article 13 Regulation 2007/204 that "the Agency may cooperate with Europol
