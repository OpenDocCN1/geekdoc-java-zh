    evolution of the bilateral and multilateral operational cooperation among Frontex,
    EASO and Europol is studied. Subsequently, the functioning and the reinforced
    operational cooperation in the hotspots among Frontex, EASO and Europol are analyzed.
    This chapter concludes by analyzing the recently established hotspot approach,
    its limitations and its impact in effectively assisting the Member States in implementing
    migration, border management and asylum laws.


    # 1 INTER-AGENCY COOPERATION IN THE AREA OF FREEDOM, SECURITY AND JUSTICE


    The administration of the FSJ is fragmented, with several agencies vested with
    similar tasks or charge of assisting the Member States in regard to similar subjects.
    Such overlap and duplication are very likely to arise in fragmented policy matters
    like the FSJ. For this reason, the agencies participating in the FSJ shall cooperate,
    at the same time, preserve their uniqueness and value. Effective inter-agency
    cooperation encourages the exchange of information, best practices, resources
    and synergies, as strengthening the capabilities, mutual understanding and operability
    of each agency, leading to future cooperation. A consistent and well-articulated
    FSJ demands complementarity between all of the institutional actors concerned,
    which in turn, “requires for each other''s mandate and expertise as well as good
    communication, and coordination in case of an overlap”.2 Nonetheless, inter-agency
    cooperation remains challenging in control over their specific policy matters,
    which were created under different institutional contexts, and the participating
    agencies need to compete in maintaining them been vaguely and flexibly defined.


    The internal and horizontal cooperation among Frontex, EASO and Europol can occur
    in a formal or informal manner. Regarding formal cooperation, these EU FSJ agencies
    have signed bilateral memoranda of understanding to regulate and define the cooperation
    among them. The agreements adopted topics ranging from information, training and
    data exchange to sharing best practices, threat assessments, risk analyses or
    equipment. Additionally, Frontex, EASO and Europol participate and cooperate in
    joint operations.


