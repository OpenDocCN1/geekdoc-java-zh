    # 5 CONCLUSION


    While bilateral and multilateral cooperation among Frontex, EASO and Europol were
    promoted their early establishment, the hotspot approach has reinforced their
    inter-agency operational cooperation. The complementarity of these agencies''
    operational tasks and the increasing need to provide coordinated assistance to
    the frontline Member States were key factors leading to the hotspot approach in
    2015 by the EU Agenda on Migration. Then, the hotspot approach has become a crucial
    EU measure to ensure effective multilateral and systematic cooperation among the
    EU AFSJ agencies on the ground. That is, the hotspots aim to advance the agencies''
    synergies, avoid duplication and overlaps in a fragmented policy area like the
    AFSJ and enhances the agencies'' direct operational engagement with the competent
    authorities.


    Formally, the hotspot approach does not confer on Frontex, EASO or Europol any
    executive, enforcement, or coercive powers. However, in practice, these agencies''
    operational powers and cooperation have a clear impact on implementation matters,
    which previously were the Member States'' exclusive competence. Due to the extraordinary
    migratory pressure that the competent national authorities are subject to the
    hotspots, the EU AFSJ agencies play a significant role in registering the arriving
    migrants, assessing their asylum applications, and issuing recommendations regarding
    the third-country nationals'' countries of origin, vulnerability and/or merits
    of their asylum claim.


    Since the hotspot approach is an EU emergency mechanism that is here to stay,
    as far can be inferred from its explicit inclusion in the EBCG Regulation and
    the proposed EUAA Regulation, a legislative instrument would regulate and detail
    the operational powers of Frontex, EASO and Europol be adopted. Such a legislative
    instrument would not only clarify the allocation of responsibilities among the
    several actors that closely cooperate in the hotspots, but also provide some transparency
    regarding the functioning of the hotspots, promoting coordination and control
    of the AFSJ agencies.


    > 163 Human Rights Council, “Report of the Special Rapporteur on the human rights
    of migrants on his mission to Greece”, A/HRC/35/25/Add.2, 24.04.2017, para. 82.'
