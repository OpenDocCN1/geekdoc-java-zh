  md: 'Frontex’s initial operational character is best reflected in the role that
    the Agency played in coordinating and organizing joint operations to enhance the
    integrated management of the Member States’ external borders. In accordance with
    Article 3(1) Regulation 2007/2004 that established Frontex, the Agency shall evaluate,
    approve and coordinate proposals for joint operations made by the Member States.
    More importantly, Frontex was conferred with the power to, in agreement with the
    Member State(s) concerned, launch initiatives for joint operations.


    Article 3(1) Regulation 2007/2004 did not specify how a joint operation needed
