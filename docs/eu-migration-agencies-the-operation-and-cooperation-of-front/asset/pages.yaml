    should monitor and assess the availability of the technical equipment, systems,
    capabilities, resources, infrastructure and adequately skilled and trained staff
    Member States for border control (Article 32(2) Regulation 2019/1896). In turn,
    Member States are to collaborate with the EBCG in elaborating the vulnerability
    assessment. Pursuant to Article 32(1) Regulation 2019/1896, the Agency by decision
    of the management board based on a proposal of the executive director, establish
    a common vulnerability assessment methodology. This methodology consists of a
    baseline assessment, a simulation exercise, a simulation assessment and the recommendations
    issued by the EBCG. During the baseline assessment, the Agency is in charge of
    checking for vulnerabilities and analyzing the data gathered. The Agency''s executive
    director may decide to conduct a simulation exercise for select Member States
    and a stress test of the national authorities'' preparedness for specific threats
    and challenges at the external borders, which may lead to additional recommendations
    on measures for the Member States.¹109 Finally, the Member States are informed
    of the results of their vulnerability assessments and the EBCG''s executive director
    may recommend that the concerned Member State adopt, within a certain period of
    time, certain measures.


