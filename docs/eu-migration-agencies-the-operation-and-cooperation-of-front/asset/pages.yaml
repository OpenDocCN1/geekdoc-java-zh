    migration and asylum matters in the EU


    The so-called “refugee crisis” revealed revealed the urge to ensure the functioning
    of the Schengen area and the Common European Asylum System (CEAS), the need to
    operationally assist those Member States most affected by the sudden and extraordinary
    arrival of mixed migratory flows, and the need to effectively and uniformly implement
    the EU measures adopted in regard to migration, asylum and border management measures.
    Against this background, Frontex, EASO and Europol have emerged as key actors,
    not only in providing operational assistance to the frontline Member States, but
    also in implementing the hotspot approach. The expansion of the operational role,
    multilateral cooperation, presence on the ground and institutional significance
    within the Area of Freedom, Security and Justice (AFSJ) of Frontex, EASO and Europol,
    is now unquestionable. This book has therefore comparatively analyzed the evolution
    of the operational tasks of Frontex, EASO and Europol. Special attention was paid
    to the expansion of the legal mandates of the AFSJ agencies, the reinforcement
    of the activities they undertake in practice and to what extent a gap exists between
    these two dimensions.


    This book makes four main contributions. First, it mapped Frontex, EASO and Europol
    decentralized agencies, which are clearly distinguished by their operational powers
    and by the possibility to directly assist the competent national authorities on
    the ground. In practice, the establishment and early operational functions conferred
    on Frontex, EASO and Europol were studied. Second, it comparatively analyzed the
    reinforcement of the operational tasks vested in Frontex, EASO and Europol, as
    well as the extent of their assistance on the ground and influence on the implementation
    prerogatives of the national authorities in the aftermath of the “refugee crisis”.
    Third, it explored the bilateral and multilateral inter-agency cooperation between
    Frontex, EASO and Europol. Specifically, the expanded multilateral and operational
    cooperation that takes place in the hotspots was studied. Fourth, the limitations
    to the reinforced operational activities and cooperation of Frontex, EASO and
    Europol'
