  md: '# Operational cooperation among Frontex, EASO and Europol


    As soon the migrants arrive at the hotspots, Frontex provides them with information
    regarding asylum procedures and assists in their registration, identification
    and screening. A key step in identifying and registering the disembarked migrants
    consists in determining their nationality, many of them undocumented or with forged
    or falsified documents. Frontex and the competent national officials, with the
    aid of an interpreter and a document expert made by the Agency, conduct the nationality
    screening by assessing the documents that the irregular migrant has brought; in
    the absence of such documents, the third country national stands to a mandatory
    interview with the gathering of sufficient information to establish a country
    of origin.^94


    Frontex''s support teams in the hotspots also play a significant role in identification
    procedures, particularly by filling out a screening form, which includes the nationality,
    age, language spoken and whether the individual has the intention of applying
    for asylum.^95 Once the migrants have been identified and registered, Frontex''s
    fingerprinting officers deployed at hotspots assist the national authorities in
    collecting their fingerprints and registering them in Eurodac, the European database
    of fingerprints taken from, and to identify, asylum seekers and irregular migrants
    who enter the EU. The migrants must be fully informed about the obligation and
    objective of taking their fingerprints.^96 In the event that the migrants oppose
    being infringed, only the competent national officers may, as a last resort, apply
    the minimum level of coercion to obtain their fingerprints.^97


    Frontex''s equipment and experts are then deployed to facilitate the effective
