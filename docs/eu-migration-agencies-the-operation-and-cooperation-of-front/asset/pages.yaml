    and considered the risk analysis prepared by Frontex and EASO. The Standard Operating
    Procedures (SOP) adopted for the Italian hotspots provided a twofold definition
    of the hotspots. Structurally, the hotspots are designated areas where new arrivals
    may land safely and be subjected to medical screenings, and when the migrants
