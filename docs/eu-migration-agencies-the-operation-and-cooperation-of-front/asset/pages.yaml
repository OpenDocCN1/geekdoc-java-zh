  md: '# CONCLUSION


    Frontex, EASO and Europol were not conferred quasi-regulatory powers like other
    EU decentralized agencies but are functionally and instrumentally characterized
    by their own operational nature. AFSJ agencies gear their assistance to the Member
    States and play a strategic operational role in policy areas closely linked to
    the core of national sovereignty. Member States generally looked favorably upon
    the establishment of Frontex, EASO and Europol since they were established to
    function as operational structures of cooperation and coordination as bodies with
    autonomous operational powers. Nevertheless, the Member States acknowledged the
    need to broaden their collaboration through the operational empowerment of Frontex,
    EASO and Europol to effectively manage transboundary policy like migration, asylum
    and border management.


    The real push for Frontex, EASO and Europol’s operational powers came from the
    experimental, dynamic and broad interpretive approach and practices they took
    in regard to their legal mandates.¹189 Frontex, EASO and Europol’s finding legal
    instruments of these agencies’ assistance to the competent national authorities
    did not clarify the operational implications or practical limits of these.¹190
    In other words, the ‘operational role’ of these agencies as ‘initiators’ and ‘coordinators’
    of the EU-level coordinated action might lead to ‘unexpected terrains’, even for
    the representatives of the agencies themselves, in relation to their de jure mandate
    and responsibilities.1191 The soft and non-binding nature of the powers bestowed
    upon Frontex have progressively and in practice become “harder”. Operational tasks
    involving genuine initiation and planning by the agencies hide behind the merely
    technical and administrative concepts of facilitation, coordination or assistance.


    > 1189 Pollak, Johannes and Słominski, Peter, “Experimentalist but not accountable
    governance? The role of Frontex in managing the EU’s external borders”, West European
    Politics, 32(5), 2009, pp. 904–924.

    1190 Carrera, Sergio, et al., “The peculiar nature”, p. 343. See Rijma, Jorrit,
    “Hybrid agencification in the Area of Freedom, Security and Justice its inherent
    tensions: The case of Frontex” in Busuci, Madalina, et al. (eds), The Agency Phenomenon
    in the European Union: Emergence, Institutionalisation and Everyday Decision-Making,
    Manchester: Manchester University Press, 2012, p. 93.

    1191 Guild, Elspeth, et al., “Implementation of the EU Charter”, p. 94.'
