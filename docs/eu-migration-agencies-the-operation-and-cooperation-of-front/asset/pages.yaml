    # 4.3 The Initial Operational Tasks of EASO


    The Regulation establishing EASO was adopted in May 2009, but the Agency did not
    officially start operations until June 2011. Soon after, the Agency coined its
    motto "support is our mission",173 EASO is mandated to: (1) facilitate an initial
    analysis of asylum cases under examination by the Member States; (2) guarantee
    that reception facilities (for example, emergency accommodation, transport and
    medical assistance) are made available by the Member States subject to particular
    pressure; and (3) deploy, at the request of the national asylum authorities concerned,
    provide the general expertise interpreting services, information on countries
    of origin and knowledge of the handling and management of asylum cases. By providing
    any case EASO manages an Early Warning and Preparedness System, allowing the Agency
    to establish a situational picture on migration, asylum influx, trends and potential
    risk scenarios. That EASO gathers may offer an evidence base for the future support
    activities of the Agency and may feed into asylum policymaking and response preparation.174


