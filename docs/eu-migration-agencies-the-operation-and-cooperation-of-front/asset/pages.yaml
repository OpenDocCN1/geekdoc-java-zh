  md: '# 5. Limitations to the reinforced operational tasks and cooperation of Frontex,
    EASO and Europol


    The original operational tasks conferred on Frontex, EASO and Europol were reinforced
    in the aftermath of the ''refugee crisis'' and these agencies are increasingly
    called to develop a noteworthy policy-implementing role. The European Border and
    Coast Guard (EBCG) and the future EU Agency for Asylum (EUAA) shall not only monitor
    that the Member States uniformly implement the border management and asylum acquis,
    but also intervene by assisting the national authorities facing emergency situations
    at their external borders. The EBCG and EUAA are now mandated to respect the functioning
    of the Schengen area and the Common European Asylum System (CEAS). Moreover, the
    hotspot approach strengthens, like never before, the operational assistance and
    inter-agency cooperation of Frontex, EASO and Europol on the ground. Nonetheless,
    there is not yet a legally binding framework regulating and delimiting the tasks
    of these agencies and the competent national authorities in the hotspots.


    Against this background, institutional balance is an EU principle considered as
    a limit to the establishment and delegation of powers to agencies. According to
    Article 13(2) TEU, ''each institution shall act within the limits of the powers
    conferred on it in the Treaties, and in conformity with the procedures, conditions
    and objectives set out in them''. Hence, this chapter firstly explores, in light
    of the principal-agent theory, the concept of delegation of powers and the inadequacy
    of this model in regard to the Area of Freedom, Security and Justice (AFSJ) agencies
    like Frontex, EASO and Europol characterized by their operational role. In this
    regard, the Court of Justice of the EU (CJEU) non delegation doctrine examined
    as useful guidance to analyze


    > ¹ See CJEU, ''European Parliament v Council of the European Communities'', C-70/88,
    22 May 1990, ELI:CJEU:1990:17. See also Chamon, Merijen, ''The institutional balance,
    and ill-fitted principle of EU law?'', European Public Law, 21(2), 2015, pp. 371–392;
    Jacqué, Jean-Paul, ''The principle of institutional balance'', Common Market Law
    Review, 41, 2004, pp. 383–391; Everson, Michelle and Vos, ''European agencies.
    What about the institutional balance?'', Maastricht Working Papers Series, 4,
    2014, pp. 1–18.'
