  md: '# The Establishment of Europol''s European Migrant Smuggling Centre


    One of the measures introduced by Regulation 2016/794 of Europol is the development
    of centers of specialized expertise. These centers aim to coordinate, organize
    and implement investigative and operational actions to assist Member States in
    combating transnational crime and terror. Article 4(1)(d) Regulation 2016/794
    shall develop Union centers of specialized expertise for combating certain types
    of crime falling within the scope of Europol''s objectives. The Agency''s management
    board, upon a proposal of the executive director, decides on the establishment
    of these centers (Article 11(s) Regulation 2016/794). Thus far, Europol has introduced
    three centers of specialized expertise: the European Cybercrime Centre (EC3),
    the EMSC and the European Terrorism Centre (ECTC).


    In the aftermath of the "refugee crisis", one of the goals of the 2015 European
    Agenda on Migration was the fight against illegal migrant smugglers. According
    to Europol, more than one million irregular migrants reached Europe and at least
    90 percent of these migrants resorted to facilities provided by criminal groups.⁷⁴
    In March 2015, Europol had already launched a Joint Operation Team (JET) to combat
    irregular migration and tackle the smugglers operating in the Mediterranean (MARE).
    In regard, the European Commission indicated that “Europol would immediately strengthen
    its recently established joint maritime operation (JET MARE) – and its focal point
    on migrant smuggling⁷⁵ The JOT MARE was mandated to coordinate and intelligence-driven
