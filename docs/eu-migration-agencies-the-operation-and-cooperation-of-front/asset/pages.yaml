  md: '# Frontex, EASO and Europol as operational decentralized agencies


    and providing operational support to Member States subject to particular pressure
    on their asylum and reception systems.⁹


    Although Europol is explicitly mentioned in the Treaties, Frontex, EASO and Europol
    are set up through EU Regulations.¹⁰ Whereas Article 88 TFEU refers to Europol''s
    mission and tasks, a similar legal basis Frontex and EASO is missing from the
    Treaties. Due to the nonexistence of a general section in the Treaties to establish
    or confer competences on EU agencies,¹¹ opens clauses (namely Articles 352 and
    114 TFEU) provides the legal bases for the introduction of EU decentralized agencies.
    Specifically, Frontex was created based on Articles 77(2)(b)(d) and 79(2)(c) TFEU
    and EASO was established to confer on Articles 74 and 78(1)(2) TFEU. These provisions
    confer on the European Parliament and the Council the power to adopt measures
    regarding the crossing of persons across the European external borders, the gradual
    establishment of an integrated management system for borders, the management of
    irregular migration including removal and repatriation of a common policy on asylum,
    subsidiary protection and temporary protection.


    Frontex and EASO have not been delegated implementing competences from the EU
    institutions, but these agencies constitute specific measures adopted in the harmon
    of the implementation tasks of the Member States.¹² That is, Article 291(1) TFEU
    declares that Member States are primarily responsible for applying legally binding
    conduct in policy areas like border management, migration and asylum. However,
    the EU has been empowered to adopt measures in order to ensure a uniform and effective
    application of common AFSJ goals. Therefore, the key question to be answered is
    whether the term “measures”, found in Articles 74, 77, 78 and 79(2)(c) TFEU, allows
    for the establishment of Frontex and EASO.


    +   ⁹ See Chapter 2.


    +   ¹⁰ Chamon, Merijn, “Transforming the EU Administration”, p. 12.


    +   ¹¹ According to Scholten, the absence of an explicit Treaty provision authorizing
    the creation and delegation of competences to the EU regulatory agencies has several
    implications that negatively impact the legitimacy of the agencies, their organisation,
    management, creation and accountability. Scholten, Miroslava, The Political Accountability
    of EU and US Independent Regulatory Agencies, Leiden: Martus Nijhof(Publishers,
    2014, p. 63.


    +   ¹² Hofmann, Merwig and Morin, Alessandro, “Constitutional aspects of the pluralisation
    of the EU Executive through ‘agencification’, University of Luxembourg Law Working
    Paper Series, 1, 2012.'
