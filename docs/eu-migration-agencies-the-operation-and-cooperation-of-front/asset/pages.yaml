  md: 'The Court of Justice of the EU (CJEU) ruled in the cases Smoke Flavourings,$^{13}$
    ENISA$^{14}$ and Short-Selling$^{15}$ that the concept, “measures for the approximation”
    of Article 114 TFEU, authorizes the establishment of EU regulatory agencies. Article
    114(1) TFEU is an open clause that has served as a legal basis for the introduction
    of several agencies, since it grants the European Parliament and the Council the
    power to adopt measures for the approximation of national laws as market object.
    Although the CJEU has not yet assessed whether the term “measures”, found in Articles
    74, 77, 78 and 79(2)(c) TFEU, authorizes the establishment of Frontex and EASO,
    in regard to Article 114 TFEU, may be applied by analogy to Frontex and EASO.


    Frontex and EASO constitute one of the “measures” that may be adopted to effectively
    and uniformly implement a common border management, migratory and asylum system
    at the EU level. Nevertheless, the powers in matters that do not fall within its
    exclusive competence, are governed by the subsidiarity and proportionality principles
