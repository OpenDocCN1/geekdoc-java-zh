    Consequently, Short-Selling represents the up-to-date non-delegation doctrine
    in the post-Lisbon era, which provides a far-reaching delegation of powers (legally
    binding and of general application) to EU agencies, provided their exercise is
    exerted, circumscribed by conditions that limit the agency’s discretion and subject
    to judicial review. The core of the Meroni doctrine, which wide discretionary
    powers exercise establishes still as a parallel delegation system to Articles
    290 and 291 TFEU. However, Meroni’s delegation functionality has been significantly
    strained and remains to be seen whether it will be relaxed in the future to better
    accommodate the ever-expanding competences of the EU decentralized agencies.⁵³


