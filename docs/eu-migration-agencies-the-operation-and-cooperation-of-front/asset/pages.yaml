  md: '# 3 THE PREEMINENCE OF THE MEMBER STATES IN THE ADMINISTRATIVE GOVERNANCE OF
    FRONTEX, EASO AND EUROPOL


    This section discusses the administrative organization of Frontex, EASO and Europol,
    which constitutes an important determinant of the degree of influence that the
    Member States exert in the operational powers conferred over these ASFJ agencies.
    The operational role of Frontex, EASO and Europol is expanding, and thereby the
    administration of migration, asylum and border management is further Europeanized.
    However, through the election and supervision of the executive directors and through
    the majority presence of national representatives at the management boards of
    these agencies, Member States effectively steer and control their activities.
    While the executive directors represent and are responsible for the daily management
    of Frontex, EASO and Europol, the management boards are in charge of making the
    strategic decisions. The twofold internal administrative configuration of Frontex,
    EASO and Europol is analyzed.


    # 3.1 The Intergovernmental Management Boards of Frontex, EASO and Europol


    The management board is the strategic planning body of Frontex, EASO and Europol.
    The boards are in charge of a wide range of managerial and oversight tasks, which
    mainly include appointing and exercising disciplinary control over the agency''s
    executive director and annually adopting the general budget, the work program
    and the activity report.⁷¹ The Common Approach on EU Decentralized Agencies recommended
    that the management boards should consist of one representative from each Member
    State, two representatives from the European Commission, and where appropriate,
    stakeholder representatives and one member designated by the European Parliament.
    This configuration would “improve the performance of agencies'' boards and reinforce
    their capacity to supervise the administrative, operational and budgetary management
    of agencies”.⁷² However, the distinc


