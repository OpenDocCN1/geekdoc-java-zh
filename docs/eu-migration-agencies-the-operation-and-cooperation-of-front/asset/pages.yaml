    # 1 THE INITIAL OPERATIONAL ACTIVITIES OF FRONTEX, EASO AND EUROPOL UNDER THE
    UNRELENTING INTEGRATION OF THE AREA OF FREEDOM, SECURITY AND JUSTICE


    Europol originally had a purely intergovernmental character, since every amendment
    of its mandate required the ratification of all the participating Member States,
    ultimately hindering the Office''s ability to swiftly and effectively respond
    to volatile challenges inherent in police cooperation matters. In spite of Europol''s
    intergovernmental nature, its mere introduction already symbolized institutional
    shift for the AFSJ. Member States showed their openness to balance the protection
    of national sovereign interests due to the increasing need to provide a common
    and coordinated approach to boundary issues.


    Since Europol became an decentralized agency on 1 January 2010, its operational
    role to gain momentum. Although the Agency''s mission still consists of sharing
    criminal intelligence, developing operational analyses and assisting the Member
    States to initiate or strengthen cross-border criminal investigations, Europol
    began to offer operational support to the competent national law enforcement authorities.
    Specifically, Europol provided assistance through specialized data extraction
    equipment, technical expertise and operational analyses and the deployment of
    mobile offices and experts on the ground. Europol experts were present and provided
    assistance even during national enforcement and coercive activities, such as house
    searches and arrests.


    Until recently, Europol mandate was primarily characterized by the intergovernmentalism
    remained in the third pillar and under Europol was originally established. Europol,
    however, undertakes several activities while participating in the Joint Investigation
    Teams (JITs), which may involve a degree of discretion in operational matters,
    as proposing its initiation, planning, organization and effective implementation.
    Europol is not responsible for launching JITs, but rather the Agency''s staff
    may participate in assisting the members of the team. The JITs are managed by
    a leader of the team that is always a national authority of one of the participating
    States.'
