    the first years of Frontex centered on assisting the national border authorities
    in circumstances requiring technical assistance, the operational functions of
    the Agency grew. Firstly, the RABITS were introduced in 2007 to operationally
    support those Member States facing a disproportionate influx of irregular migrants.
