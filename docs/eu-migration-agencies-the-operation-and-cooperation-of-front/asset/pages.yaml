    investigative and operational actions in order to support the enforcement authorities
    (Article 4(1)(c) and (d) Regulation 2016/794). Europol is not authorized to apply
    coercive measures to conduct any of its operational investigation tasks (Article
    4(5) Regulation 2016/794). Article 5(1) of Regulation 2016/794 states that “Europol
    may participate in the activities of joint investigation teams dealing with crime
    falling under Europol''s objectives.” Although the Agency no longer needs the
    authorization of the Member States to take part in a JIT, Europol remains unable
    to independently initiate a JIT, and may only propose such a measure and take
    actions to assist the competent national authorities in setting up the team (Article
    5(5) Regulation 2016/794).


