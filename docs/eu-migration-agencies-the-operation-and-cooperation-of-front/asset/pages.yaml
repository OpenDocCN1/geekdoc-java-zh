  md: '# EUROPEAN SECURITY AND JUSTICE CRITIQUES


    **Series Editors:** Christian Kaunter and Sarah Leonard, School of Humanities,
    University of Dundee, Andrew Gedmillis, Professor, Department of Politics, University
    of Sheffield, Emil Kirchner, Jean Monet Chair in European Political Integration,
    Department of Government, University of Essex, UK; John Oochipiti, Director of
    European Studies, Department of Political Science. Canist College, New York, US;
    Knud Joergensen, Professor, Department of Political Science and Government, Aarhus
    University, Denmark, Kamil Zwoski, Lecturer in Global Politics and Policy, University
    of Southampton, Vamis Mitsilegas, Head of Department of Law, Professor of European
    Criminal Law, Mary University of London, UK, Dora Kostoulou, Professor of European
    Union Law, European Integration and Public Policy, Warwick Law School, Warwick
    Amsterdam, and Monica Boer, Faculty of Social Sciences, VU University Amsterdam,
    the Netherlands


    What is security in the 21st Century? Recently, issues such as crime, terrorism,
    energy security, movements and migration, environmental and climate security,
    underdevelopment, health and pandemic diseases, as well as economic security have
    become important matters of European security. Furthermore, traditional security
    challenges, such as military conflicts and the proliferation of mass destruction
    (WMDs), have evolved and changed character. In this context, an increasing body
    of scholarship has recognized the European Union (EU) as a security actor, which
    is equipped to tackle these complex security challenges, due to the multi-dimensional
    or structural character of its policies.


    Based on a broad definition of security, this unprecedented series examines the
    role of Europe in international security and justice matters. Taking inspiration
    from the European Security Strategy (ESS), it identifies more traditional security
    threats but also points to global warming and poverty as the possible cause of
    conflict. Moreover, the series promises to recognize the intrinsic links between
    security and justice from a multidisciplinary perspectives and provides a platform
    for research that focuses on the study of Europe as a whole, going beyond only
    the European Union.


    The series and its initial publications will be of interest to both students and
    academics across the areas of politics, international relations, law, sociology,
    history, area studies, gender studies, post-colonial studies and human and political
    geography. Titles in the series include:


    The European Union

    Facing the Challenge of Multiple Security Threats

    Edited by Antonina Bakardievieva Engelbert, Anna Michalski, Niklas Nilsson and
    Lars Oxelheim


    EU Migration Agencies

    The Operation and Cooperation of FRONTEX, EASO and EUROPOL

    David Fernández-Rojo'
