    # 5 CONCLUSION


    The agencification of the AFSJ is an unrelenting process, which the CJEU has recently
    and indirectly endorsed and invigorated. Not only are the Meroni non-delegation
    requirements now more leniently applied, but the boundaries of the operational
    and implementation powers conferred on Frontex, EASO and Europol are also expanding.
    In this regard, the absence of a common legally binding framework in the Treaties
    regarding the establishment and conferral of powers on EU decentralized agencies,
    it can be anticipated that their operational, monitoring and implementation powers
    will progressively stretch. Until the CJEU specifically clarifies the degree of
    operational discretion that Frontex, EASO and Europol enjoy, it must be in mind
    that their activities may rise to national sovereignty concerns and fundamental
    rights implications, which may enable a narrower application of the updated non-delegation
    doctrine and exclude fullyfledged and autonomous operational powers.


    Furthermore, Member States generally favorably upon the reinforcement of the operational
    tasks and cooperation of Frontex, EASO and Europol since they were established
    to function as operational structures of cooperation and coordination than as
    bodies with autonomous operational and implementation powers. Nevertheless, while
    the Member States acknowledged the need to broaden their collaboration through
    the operational empowerment of Frontex, EASO and Europol to effectively manage
    transboundary policy matters like migration, asylum and border management, they
    ensured that they would keep these agencies'' management boards and executive
    directors under tight control.


