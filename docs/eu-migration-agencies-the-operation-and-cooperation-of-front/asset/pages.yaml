  md: '# Foreword


    xi


    evolution of the operational tasks of the three most representative operational
    decentralized EU agencies. He focused primarily on the subject of migration, notably
    on the EU "refugee crisis"; While agification of the AFSJ is still at an early
    stage, it may be further expanded in the future. During the crisis, the hotspot
    approach became the central crisis management instrument for Member States. The
    book will provide us with good analytical tools to assess whether they will continue
    to become significant within the EU''s AFSJ. As a potential outlook, a parallel
    legal framework for the hotspots could be adopted, as in the book. The book further
    raises important questions in terms of the legitimacy and constitutionality of
    the aforementioned emerging trend, which have clear implications on fundamental
    rights in the EU. The book, thus, makes a strong case for further research as
    to how to enhance the effectiveness of the complaint mechanism against these agencies.


    David''s book demonstrates an excellent grasp of the relevant scholarship and
    provides a very nuanced and sophisticated analysis of all the key issues pertaining
    to the research question — one that had been largely neglected in the relevant
    academic literature. He also provides an excellent framework for analysis, which
    is clearly articulated, explained and in its context within the literature of
    the work. He had have wonderful engagement with the main authors to the debate,
    their contributions and the insights taken from them. The selected methodologies
    are appropriate, and the book has generated newly empirical knowledge.


    In conclusion, the book is a very serious piece of legal scholarship on JHA agencies.
    It develops broader questions of significant interest to political science, European
    studies and international relations scholars. It raises insights into transactional
    benefits of mutual cooperation amongst EU Member States. The “reugee crisis” in
    the EU in 2015 demonstrated the importance of European collaboration significantly
    in its absence. At the same time, subsequent events have pushed the case for a
    cooperative Europe where Member States help one another in times of serious crisis.
    At no point in history could this be clearer than now — during the COVID-19 pandemic,
    which has provided the EU with the greatest public health crisis since the so-called
    Spanish flu at the beginning of the 20th century and the most serious economic
    crisis since the Great Depression. Now, more than ever, European cooperation is
    needed. Despite the questions this book raises, it provides a strong case for
    a strong EU in the face of calamity.


    Prof. Dr Christian Kaunert

