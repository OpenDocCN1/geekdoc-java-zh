  md: '# 3. The reinforced operational tasks of Frontex, EASO and Europol and the
    impact of their activities on the ground


    This chapter delves into the operational functions formally conferred upon Frontex,
    EASO and Europol in their Regulations and the activities under-practice on the
    ground, with a view to analyze the extent to which a gap exists between the two.
    To this end, the evolution of the de jure and facto operational tasks of these
    agencies is examined in depth. The aim is to analyze what extent the tasks of
    Frontex, EASO and Europol are moving from merely providing the competent national
    authorities with technical assistance to developing powers with a significant
    operational nature.


    The most distinctive feature of Frontex, EASO and Europol is their operational
    character, and in particular, the possibility to directly assist the Member States
    on the ground by deploying European Border Guard Teams (EGTs), Asylum Support
    Teams (ASTs) and participating in Joint Investigation Teams (JITs), respectively.
    None of these Area of Freedom, Security and Justice (AFSJ) agencies are competent
    to conduct fullyfledged operational support to the competent national border,
    asylum and law enforcement authorities. This chapter firstly analyzes the operational
    that Frontex, EASO and Europol develop in the territory of the Member States through
    the EGTs, ASTs and JITs, as well as the impact that the deployment of these teams
    has on the effective and uniform implementation of border management, migration
    and asylum measures adopted at the EU level.


    Subsequently, the latest legislative revisions of Frontex, EASO and Europol, which
    primarily aim to reinforce their operational position and autonomy from the Member
    States, are studied. Specifically, the recently adopted Regulations 2016/1624
    and 2019/1896 transforming the European Border and Coast Guard (EBCG) and the
    proposal for transforming EASO into an EU Agency for Asylum (EUAA) not only strengthen
    these agencies’ operational role and cooperation on the ground in situations requiring
    urgent action, but also introduce a monitoring task to guarantee that the functioning
    of the Schengen space and the Common European Asylum System (CEAS) is not jeopardized
    by specific actions or omissions of the Member States. Europol is also starting'
