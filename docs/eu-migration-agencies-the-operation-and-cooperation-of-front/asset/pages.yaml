  md: 'Fronttex, EASO and Europol as operational decentralized agencies


    Whereas the mandate and mission of Frontex, EASO and Europol are broader, this
    book only focuses on these agencies'' operational role when supporting the Member
    States in border management, asylum and illegal migrant smuggling matters, respectively.
    The non-operational tasks of Frontex, EASO and Europol are not the subject matter
    of this book, which exclusively centers on analyzing: (1) the operational support
    for Frontex, EASO and Europol provided to a concerned EU Member State, excluding
    any tasks bestowed upon these agencies that are not insisted upon a Member; (2)
    the operational cooperation between Frontex, EASO and Europol, excluding any bilateral
    and multilateral exchange of information between these agencies and any operational
    cooperation between these agencies and the EU institutions or third countries.
    In this regard, how the operational activities and cooperation of Frontex, EASO
    and Europol are monitored, to what extent these agencies are held accountable,
    the allocation of the responsibilities between the actors involved in their operations
    are not the subject matter of this book either. Nevertheless, by examining the
    de jure and de facto operational tasks of Frontex, EASO and Europol, this book
    may indirectly shed light on the distribution of responsibilities or better monitoring
    of these agencies'' reinforced operational activities and cooperation.


    # # 3 SCIENTIFIC RELEVANCE


    This book explores the european agification of the AFSJ, the distinctive characteristics
    of three EU decentralized agencies that operate within the AFSJ, the noteworthy
    expansion of the operational tasks and cooperation of Frontex, EASO and Europol,
    and the crucial role that these agencies are called to play in ensuring an effective
    and uniform implementation of the common border management, migration and asylum
    laws and policies. Nonetheless, agification has not been a process confined solely
    to the AFSJ, but rather developed in parallel to the European integration process,
    which requires a harmonized implementation of the EU laws and policies. As stressed
    by the European Commission, "creation of further autonomous EU regulatory agencies
    in clearly defined areas will improve the way rules are applied and enforced across
    the Union".55 The added value of the EU agencies as an institutional and administrative
    governance option underpinned to great extent their existential creation and empowerment.56
