- md: "\n# Object-Oriented Programming\nExercises with Java\n\n![](img/1f98a1391ec8e96d0767f489f1aceed7_0_0.png)\n\
    \nHaris Tsetsekas\n\n# Object-Oriented Programming Exercises with Java\n\nISBN:\
    \ 9798387780431\n\nCopyright © 2023 by Haris Tsetsekas\n\n# Table of Contents\n\
    \n1. Movies\n2. Hospital\n3. Package Shipping\n4. Package Shipping with Persistence\n\
    5. Package Shipping with GUI\n6. Insurance\n7. Reservations\n8. Tax declaration\n\
    9. PacMan game\n\n# 1. Movies\n\nLet’s create a program that handles movies and\
    \ their ratings. We need to record the following information on movies:\n\n- Title\n\
    - Director\n- Duration (in minutes)\n- Year of release\n\nThe Movie class should\
    \ have a method that returns the movie’s age, based on the current year and the\
    \ release year.\n\nFor each Movie, we should also keep a number of Ratings, ranging\
    \ from 0 to 5. Moreover, a Movie of type Movie should be able to calculate the\
    \ average of the ratings.\n\nIn the main method, we should create a number of\
    \ Movies, along with some ratings. Then, we should print the details of each movie,\
    \ as well as the ratings average.\n\n# Proposed Solution\n\nWe begin with creating\
    \ the Movie class:\n\n```java\nimport java.time.Year;\nimport java.util.ArrayList;\n\
    \npublic class Movie {\n    private String name;\n    private int year;\n    private\
    \ int duration;\n    private String director;\n    private ArrayList<Integer>\
    \ reviews;\n    //more stuff here\n}\n```\n\nListing 1-1: Movie.java\n\nThen,\
    \ we add three more constructors, the default, the full and the copy constructor:\n\
    \n```java\npublic Movie() {\n    name = \"N/A\";\n    year = 0;\n    duration\
    \ = 0;\n    director = \"N/A\";\n    reviews = new ArrayList<>();\n}\npublic Movie(String\
    \ _name, int _year, int _duration, String _director) {\n    name = _name;\n  \
    \  year = _year;\n    duration = _duration;\n    director = _director;\n    reviews\
    \ = new ArrayList<>();\n}\npublic Movie(Movie _movie) {\n    name = _movie.name;\n\
    \    year = _movie.year;\n    duration = _movie.duration;\n    director = _movie.director;\n\
    \    reviews = new ArrayList<>(_movie.reviews);\n}\n```\n\nListing 1-2: Movie.java\n\
    \nNote that the copy constructor is not provided by default in Java; we will have\
    \ to introduce it ourselves.\n\nMoreover, in the copy constructor, we instantiate\
    \ the reviews list by using the ArrayList copy constructor. This should work fine,\
    \ as long as the list contains primitive or immutable types such as int or String\
    \ respectively).\n\nIf the list contained custom objects, then we would have to\
    \ do two things: First of all, we would have to implement the Cloneable interface\
    \ in the custom class (i.e. implement the clone() method inside the custom class).\
    \ Then, we would have to clone the list itself with the following line:\n\n```java\n\
    reviews = (ArrayList<MyCustomClass>)_movie.reviews.clone();\n```\n\nNext, we add\
    \ the setter methods:\n\n```java\npublic void setName(String _name) {\n    name\
    \ = _name;\n}\npublic void setYear(int _year) {\n    year = _year;\n}\npublic\
    \ void setDuration(int _duration) {\n    duration = _duration;\n}\npublic void\
    \ setDirector(String _director) {\n    director = _director;\n}\n```\n\n# Listing\
    \ 1-3: Movie.java\n\nIn the constructors and the setter methods, we definitively\
    \ can make some checks on the input values, e.g. verify that the year value is\
    \ beyond 1900. We will leave such functionality for later projects, where we will\
    \ introduce interaction with the user.\n\nWith regard to the reviews list, we\
    \ add two methods; one to insert a review in the list and another one to calculate\
    \ the average score:\n\n```java\npublic void addReview(int score) {\n  if (score\
    \ >= 0 && score <= 5)\n    reviews.add(score);\n  else\n    System.out.println(\"\
    invalid review score\");\n}\npublic double getReviewAverage() {\n  double sum\
    \ = 0.0;\n  for (int i = 0; i < reviews.size(); i++) {\n    sum += reviews.get(i);\n\
    \  }\n  if (reviews.size() > 0)\n    return sum / reviews.size();\n  else\n  \
    \  return 0;\n}\n```\n\nListing 1-4: Movie.java\n\nNext, we add a method to calculate\
    \ the movie's age:\n\n```java\npublic int getAge() {\n  int current_year = Year.now().getValue();\n\
    \  return current_year - year;\n}\n```\n\nListing 1-5: Movie.java\n\nIn order\
    \ to get the current year from the system, we use the java.time.Year class.\n\n\
    Finally, we add a toString() method that provides a string representation of the\
    \ Movie object:\n\n```java\n@Override\npublic String toString() {\n    return\
    \ \"Movie{\" +\n        \"name=\" + name + \"\\\" +\n        \"year=\" + year\
    \ +\n        \"duration=\" + duration +\n        \"director=\" + director + \"\
    \\\" +\n        \"reviews=\" + reviews + \n };}\n}\n```\n\nListing 1-6: Movie.java\n\
    \nIn the main method, we create some Movie objects and we test their functionality:\n\
    \n```java\npublic static void main(String args[]) {\n    Movie m1 = new Movie();\n\
    \    Movie m2 = new Movie(\"Hunger Games\", 2012, 142, \"Gary Ross\");\n    m2.addReview(5);\n\
    \    m2.addReview(4);\n    m2.addReview(6);\n    Movie m3 = new Movie(m2);\n \
    \   System.out.println(m1);\n    System.out.println(m2);\n    System.out.println(m3);\n\
    }\n```\n\nListing 1-7: Movie.java\n\nYou can find this project in GitHub:\n\n\
    https://github.com/htset/java_oop_exercises/tree/master/Movies/src\n\n# 2. Hospital\n\
    \nIn this project, we will create a console application that manages patients\
    \ in a hospital. The hospital consists of clinics (e.g. surgery). For each patient,\
    \ we will maintain the following:\n\n- name and surname\n- Year of birth\n- Room\
    \ number\n- A list of measurements (temperature and time)\n\nThe patient class\
    \ should be able to return the maximum temperature recorded for a patient. In\
    \ the main method, we should create a number of clinics, along with patients,\
    \ as well as add some measurements to each.\n\n# Proposed Solution\n\nWe begin\
    \ with the definition of the Clinic class:\n\n```java\npublic class Clinic {\n\
    \    private String name;\n    private String director;\n    public Clinic(String\
    \ _name, String _director) {\n        name = _name;\n        director = _director;\n\
    \    }\n    public Clinic() {\n        name = \"N/A\";\n        director = \"\
    N/A\";\n    }\n    @Override\n    public String toString() {\n        return \"\
    name=\" + name + \"\\\" +\n        \", director=\" + director + \"\\\"\";\n  \
    \  }\n    public void setDirector(String _director) {\n        director = _director;\n\
    \    }\n}\n```\n\nListing 2-1: Clinic.java\n\nWe proceed with the definition of\
    \ the Patient class:\n\n```java\npublic class Patient {\n    private String name;\n\
    \    private String surname;\n    private int yearOfBirth;\n    private Clinic\
    \ clinic;\n    private String room;\n    private ArrayList<Measurement> pm;\n\
    }\n```\n\nListing 2-2: Patient.java\n\nThere are two things worth mentioning here:\
    \ First of all, the Patient object keeps a reference to a Clinic object. The Clinic\
    \ object exists independently of the Patient object, as there are patients that\
    \ may belong to the same clinic. This is an example of Aggregation: we keep references\
    \ to external objects that are related to the object.\n\nThe opposite of Aggregation\
    \ is Composition: it's when an object contains other objects inside it. This is\
    \ the case of the Measurement list. The temperature taken for a patient is strongly\
    \ connected to the patient and does not make any sense without one. If the patient\
    \ object is deleted, it is OK to delete also the temperature information.\n\n\
    Let's get the definition of the simple Measurement class out of the way:\n\n```java\n\
    import java.time.LocalDateTime;\npublic class Measurement {\n    private double\
    \ temp;\n    private LocalDateTime date;\n    public Measurement(double _temp,\
    \ LocalDateTime _date){\n        temp = _temp;\n        date = _date;\n    }\n\
    \    public Measurement(){\n        temp = 0;\n        date = LocalDateTime.now();\n\
    \    }\n    public double getTemp() {\n        return temp;\n    }\n    public\
    \ LocalDateTime getDate() {\n        return date;\n    }\n    @Override\n    public\
    \ String toString() {\n        return \"Measurement{\" +\n            \"temp=\"\
    \ + temp +\n            \", date=\" + date +\n            \"}\";\n    }\n}\n```\n\
    \nListing 2-3: Measurement.java\n"
  mdcn: "\n\n# 面向对象编程\nJava 练习\n\n![](img/1f98a1391ec8e96d0767f489f1aceed7_0_0.png)\n\
    \nHaris Tsetsekas\n\n# Java 面向对象编程练习\n\nISBN: 9798387780431\n\n版权所有 © 2023 由 Haris\
    \ Tsetsekas\n\n# 目录\n\n1. 电影\n2. 医院\n3. 包裹运输\n4. 带有持久化的包裹运输\n5. 带有 GUI 的包裹运输\n\
    6. 保险\n7. 预订\n8. 纳税申报\n9. PacMan 游戏\n\n# 1. 电影\n\n让我们创建一个处理电影及其评分的程序。我们需要记录关于电影的以下信息：\n\
    \n- 标题\n- 导演\n- 时长（分钟）\n- 发映年份\n\n`Movie` 类应该有一个方法，根据当前年份和发行年份返回电影的年龄。\n\n对于每部电影\
    \ `Movie`，我们还应该保留一组范围从 0 到 5 的评分 `Ratings`。此外，类型为 `Movie` 的电影应该能够计算评分的平均值。\n\n\
    在 `main` 方法中，我们应该创建多个电影以及一些评分。然后，我们应该打印每部电影的详情以及评分平均值。\n\n# 建议解决方案\n\n我们从创建 `Movie`\
    \ 类开始：\n\n```java\nimport java.time.Year;\nimport java.util.ArrayList;\n\npublic\
    \ class Movie {\n    private String name;\n    private int year;\n    private\
    \ int duration;\n    private String director;\n    private ArrayList<Integer>\
    \ reviews;\n    // 这里有更多内容\n}\n```\n\n列表 1-1: Movie.java\n\n然后，我们添加另外三个构造函数：默认构造函数、全构造函数和拷贝构造函数：\n\
    \n```java\npublic Movie() {\n    name = \"N/A\";\n    year = 0;\n    duration\
    \ = 0;\n    director = \"N/A\";\n    reviews = new ArrayList<>();\n}\npublic Movie(String\
    \ _name, int _year, int _duration, String _director) {\n    name = _name;\n  \
    \  year = _year;\n    duration = _duration;\n    director = _director;\n    reviews\
    \ = new ArrayList<>();\n}\npublic Movie(Movie _movie) {\n    name = _movie.name;\n\
    \    year = _movie.year;\n    duration = _movie.duration;\n    director = _movie.director;\n\
    \    reviews = new ArrayList<>(_movie.reviews);\n}\n```\n\n列表 1-2: Movie.java\n\
    \n注意，Java 默认并不提供拷贝构造函数；我们必须自己引入它。\n\n此外，在拷贝构造函数中，我们通过使用 `ArrayList` 的拷贝构造函数来实例化\
    \ `reviews` 列表。只要列表包含基本数据类型或不可变类型（分别为 `int` 或 `String`），这就能正常工作。\n\n如果列表包含自定义对象，那么我们必须做两件事：首先，我们必须在自定义类中实现\
    \ `Cloneable` 接口（即在自定义类内部实现 `clone()` 方法）。然后，我们必须使用以下代码对列表本身进行拷贝：\n\n```java\n\
    reviews = (ArrayList<MyCustomClass>)_movie.reviews.clone();\n```\n\n接下来，我们添加设置器方法（`setter`\
    \ 方法）：\n\n```java\npublic void setName(String _name) {\n    name = _name;\n}\n\
    public void setYear(int _year) {\n    year = _year;\n}\npublic void setDuration(int\
    \ _duration) {\n    duration = _duration;\n}\npublic void setDirector(String _director)\
    \ {\n    director = _director;\n}\n```\n\n# 列表 1-3: Movie.java\n\n在构造函数和 setter\
    \ 方法中，我们确实对输入值进行一些检查，例如验证年份值是否大于 1900 年。我们将此类功能留给以后的项目，届时我们将引入与用户的交互。\n\n关于 `reviews`\
    \ 列表，我们添加了两个方法：一个用于向列表中插入评分，另一个用于计算平均分：\n\n```java\npublic void addReview(int\
    \ score) {\n  if (score >= 0 && score <= 5)\n    reviews.add(score);\n  else\n\
    \    System.out.println(\"invalid review score\");\n}\npublic double getReviewAverage()\
    \ {\n  double sum = 0.0;\n  for (int i = 0; i < reviews.size(); i++) {\n    sum\
    \ += reviews.get(i);\n  }\n  if (reviews.size() > 0)\n    return sum / reviews.size();\n\
    \  else\n    return 0;\n}\n```\n\n列表 1-4: Movie.java\n\n接下来，我们添加一个计算电影年龄的方法：\n\
    \n```java\npublic int getAge() {\n  int current_year = Year.now().getValue();\n\
    \  return current_year - year;\n}\n```\n\n列表 1-5: Movie.java\n\n为了从系统获取当前年份，我们使用了\
    \ `java.time.Year` 类。\n\n最后，我们添加一个 `toString()` 方法，来提供 `Movie` 对象的字符串表示：\n\n```java\n\
    @Override\npublic String toString() {\n    return \"Movie{\" +\n        \"name=\"\
    \ + name + \"\\\" +\n        \"year=\" + year +\n        \"duration=\" + duration\
    \ +\n        \"director=\" + director + \"\\\" +\n        \"reviews=\" + reviews\
    \ + \n };}\n}\n```\n\n列表 1-6: Movie.java\n\n在 `main` 方法中，我们创建了一些电影对象并测试其功能：\n\n\
    ```java\npublic static void main(String[] args) {\n    Movie m1 = new Movie();\n\
    \    Movie m2 = new Movie(\"Hunger Games\", 2012, 142, \"Gary Ross\");\n    m2.addReview(5);\n\
    \    m2.addReview(4);\n    m2.addReview(6);\n    Movie m3 = new Movie(m2);\n \
    \   System.out.println(m1);\n    System.out.println(m2);\n    System.out.println(m3);\n\
    }\n```\n\n列表 1-7: Movie.java\n\n你可以在 GitHub 上找到此项目：https://github.com/htset/java_oop_exercises/tree/master\n\
    \n# 2. 医院\n\n在这个项目中，我们将创建一个管理患者的控制台应用程序。医院由诊所组成（例如手术室）。对于每个患者，我们将维护以下信息：\n\n-\
    \ 姓名\n- 出生年份\n- 房间号\n- 测量列表（温度和时间）\n\n患者类应该能够返回记录的最高温度。在 `main` 方法中，我们应该创建一些诊所以及患者，并为它们添加一些测量数据。\n\
    \n# 建议解决方案\n\n我们从定义 `Clinic` 类开始：\n\n```java\npublic class Clinic {\n    private\
    \ String name;\n    private String director;\n    public Clinic(String _name,\
    \ String _director) {\n        name = _name;\n        director = _director;\n\
    \    }\n    public Clinic() {\n        name = \"N/A\";\n        director = \"\
    N/A\";\n    }\n    @Override\n    public String toString() {\n        return \"\
    name=\" + name + \"\\\" +\n        \", director=\" + director + \"\\\"\";\n  \
    \  }\n    public void setDirector(String _director) {\n        director = _director;\n\
    \    }\n}\n```\n\n列表 2-1: Clinic.java\n\n我们继续定义 `Patient` 类：\n\n```java\npublic\
    \ class Patient {\n    private String name;\n    private String surname;\n   \
    \ private int yearOfBirth;\n    private Clinic clinic;\n    private String room;\n\
    \    private ArrayList<Measurement> pm;\n}\n```\n\n列表 2-2: Patient.java\n\n这里有两个值得提到的点：首先，`Patient`\
    \ 对象持有对 `Clinic` 对象的引用。`Clinic` 对象独立于 `Patient` 对象存在，因为多个患者可能属于同一个诊所。这是聚合（Aggregation）的一个示例：我们保留了指向外部对象的引用。\n\
    \n聚合的反面是组合（Composition）：当一个对象包含其他对象时。这就是 `Measurement` 列表的情况。为患者采集的温度与患者紧密相连，离开患者没有任何意义。如果患者对象被删除，删除温度信息也是可以的。\n\
    \n让我们先定义简单的 `Measurement` 类：\n\n```java\nimport java.time.LocalDateTime;\npublic\
    \ class Measurement {\n    private double temp;\n    private LocalDateTime date;\n\
    \    public Measurement(double _temp, LocalDateTime _date){\n        temp = _temp;\n\
    \        date = _date;\n    }\n    public Measurement(){\n        temp = 0;\n\
    \        date = LocalDateTime.now();\n    }\n    public double getTemp() {\n \
    \       return temp;\n    }\n    public LocalDateTime getDate() {\n        return\
    \ date;\n    }\n    @Override\n    public String toString() {\n        return\
    \ \"Measurement{\" +\n            \"temp=\" + temp +\n            \", date=\"\
    \ + date +\n            \"}\";\n    }\n}\n```\n\n列表 2-3: Measurement.java\n\n"
