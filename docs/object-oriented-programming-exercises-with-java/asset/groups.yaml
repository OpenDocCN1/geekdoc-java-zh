    \n# 8. Tax declaration\n\nIn this exercise, we will create an application for\
    \ the submission of property tax declarations. Our application will support three\
    \ kinds of properties (Apartment, Store and Plot) with different methods for calculating\
    \ the corresponding tax:\n\n- Apartment: Tax = 1.3 * surface + 10* floor + 150\n\
    - Store: Tax = 2.5 * surface + 20* commerciality + 100\n- Plot: Tax = 0.3 * surface\
    \ + 100 * cultivated + 200 * withinCityLimits\n\nThe tax depends on the following\
    \ parameters:\n\n- The surface area of the property\n- The floor of the apartment\n\
    - The commerciality of the store (a number between 1 and 5 that characterizes\
    \ the importance of the store's road in commerce)\n- Whether the plot of land\
    \ is cultivated or not\n- Whether the plot of land is within city limits or not\n\
    \nWe will create a user interface that will provide users with the following options:\n\
    \n- Create a new tax declaration and calculate the resulting tax according to\
    \ the properties declared\n- Delete an existing tax declaration\n- Search for\
    \ declaration(-s)\n\nMoreover, the application should provide the following statistics\
    \ on the tax declarations:\n\n- The total tax of all declarations\n- The declaration\
    \ with the highest tax incurred\n\nWe will create the application to be persistence\
    \ agnostic. That is, we will provide the option to store the declarations in a\
    \ text file and in a database.\n\n# Proposed Solution\n\nLet’s start with the\
