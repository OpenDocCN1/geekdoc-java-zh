    \ void setAddress(Address address) {\n        this.address = address;\n    }\n\
    }\n```\n\n列表 8-1: Property.java\n\n注意 `Property` 定义了一个抽象方法 `calculateTax()`。这意味着它不能被实例化。派生类必须实现该方法。`Property`\
