    \ FileService.java\n\nIn FileService, we store the data in JSON format by using\
    \ the Jackson library. Jackson enables us to transform an entire ArrayList of\
    \ Objects in JSON format in a simple method call. Note how Jackson’s ObjectMapper\
    \ object provides us with a StreamReader that can parse a JSON array into an ArrayList<TaxDeclaration>\
    \ object in one go (through readValue()).\n\nJackson also enables us to transform\
    \ ArrayList<TaxDeclaration> object into a JSON array. We use this in saveToFile():\n\
    \n```java\nprivate void saveToFile() {\n    ObjectMapper mapper = new ObjectMapper();\n\
    \    ObjectWriter writer = mapper.writer(new DefaultPrettyPrinter());\n    try\
    \ {\n        writer.writeValue(new File(filename, declarations));\n    } catch\
    \ (IOException e) {\n        System.out.println(\"Problem writing to file. Exiting...\"\
    );\n        e.printStackTrace();\n        System.exit(0);\n    }\n}\n```\n\nListing\
    \ 8-20: FileService.java\n\nWhen there is a change in the data, for example, when\
    \ we create a new declaration, or delete an existing one, we save all the TaxDeclaration\
    \ objects into the file (we overwrite the existing data in the file). As we pointed\
    \ out in a previous exercise, it is not possible to insert or delete an entry\
    \ in the middle of a text file, so we have to create a new one from scratch.\n\
    \nWhile Jackson can easily parse objects as well as simple lists of objects, it\
    \ needs our help when polymorphic objects are used. For instance, when a property\
    \ objects is read from a JSON string, Jackson cannot know whether it is an Apartment\
    \ Or Plot object. For this to work, we add annotations in the Property base class\
