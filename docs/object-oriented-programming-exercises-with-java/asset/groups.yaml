    \ name = \"Store\"),\n  @JsonSubTypes.Type(value = Plot.class, name = \"Plot\"\
    )\n}})\npublic abstract class Property {\n    protected int id;\n    protected\
    \ int surface;\n    protected Address address;\n\n    public Property(int id,\
