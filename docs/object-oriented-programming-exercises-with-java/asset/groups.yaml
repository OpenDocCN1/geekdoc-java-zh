    # 2. Hospital


    In this project, we will create a console application that will manage patients
    in a hospital.


    The hospital consists of clinics (e.g. surgery). We should keep track of the clinic''s
    name and its director’s name.


    For each patient, we will maintain the following information:


    +   - Patient name and surname

    - Year of birth

    - The clinic in which the patient has been admitted to

