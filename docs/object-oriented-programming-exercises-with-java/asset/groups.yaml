    # 8. Tax declaration


    In this exercise, we will create an application for the submission of property
    tax declarations. Our application will support three kinds of properties (Apartment,
    Store and Plot) with different methods for calculating the corresponding tax:


    +   * Apartment: Tax = 1.3 * surface + 10* floor + 150

    * Store: Tax = 2.5 * surface + 20* commerciality + 100

    * Plot: Tax = 0.3 * surface + 100 * cultivated + 200 * withinCityLimits


    The tax depends on the following parameters:


    +   * The surface area of the property

    * The floor of the apartment

    * The commerciality of the store (a number between 1 and 5 that characterizes
    the importance of the store''s road in commerce)

    * Whether the plot of land is cultivated or not

    * Whether the plot of land is within city limits or not


    We will create a user interface that will provide users with the following options:'
