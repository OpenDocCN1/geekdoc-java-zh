    \            game.gameActive = false;\n            move(candidateBlocks.get(minDistIn).x,\n\
    \            candidateBlocks.get(minDistIn).y);\n          }\n        } else {\n\
    \          move(candidateBlocks.get(minDistIn).x,\n          candidateBlocks.get(minDistIn).y);\n\
    \        }\n    }\n}\n```\n\n列表 9-19: Ghost.java\n\n在 `play()` 方法中，我们再次寻找移动的候选方格。此外，我们计算了每个候选位置到\
    \ PacMan 实体的直线距离数组。\n\n我们使用 `Collections.min()` 方法来找到 `distanceToPacman` 列表中包含最近位置的\
    \ `Pair` 的索引。这里需要 `Pair` 类的 `equals()` 方法。在这里，我们定义两个 `Pair` 对象仅当它们的内容（x 和 y）相同时才为相等。相比之下，默认的\
    \ `equals()` 方法仅在两个引用指向同一个对象时返回 true。如果使用该方法的默认实现，我们将无法让这些代码工作。\n\n在计算出距离较小的方格后，Ghost\
    \ 将移动到该方格，以尽量接近 PacMan。Ghost 不能移动到有另一个 Ghost 的方格中，但它可以移动到 PacMan 所在的方格。在这种情况下，PacMan\
    \ 会被 Ghost 吃掉，游戏结束。\n\n这个游戏显然还有很多工作要做。例如，我们必须实现模式切换，即 PacMan 吞下大药丸并在短时间内开始追逐 Ghost。这种功能留给读者作为练习题。\n\
    \n你可以在 GitHub 上找到这个项目：\n\nhttps://github.com/htset/java_oop_exercises/tree/master/PacMan/src\n\
    \n"
