    \        game.gameActive = false;\n    }\n}\n```\n\n列表 9-18: PacMan.java\n\n重要的内容在于\
    \ `play()` 方法的实现。首先，我们找到所有 PacMan 可以移动的相邻方格（实际上不是墙），并将它们放入一个候选方格列表中。\n\n接下来，根据用户当前选择的方向（使用方向键），我们将\
