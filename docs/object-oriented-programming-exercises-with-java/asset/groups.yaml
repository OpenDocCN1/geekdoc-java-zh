    \ 9-19: Ghost.java\n\nIn the play() method, we again find the candidate blocks\
    \ for a move. Moreover, we calculate an array of the straight line distances of\
    \ each candidate position to the PacMan entity.\n\nWe use the Collections.min()\
    \ method in order to find the index in the distanceToPacman list that contains\
