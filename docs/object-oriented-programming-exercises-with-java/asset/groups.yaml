    \ address) {\n        this.id = id;\n        this.surface = surface;\n       \
    \ this.address = address;\n    }\n\n    public Property() {\n    }\n\n    public\
    \ abstract double calculateTax();\n\n    public int getId() {\n        return\
    \ id;\n    }\n\n    public void setId(int id) {\n        this.id = id;\n    }\n\
    \n    public int getSurface() {\n        return surface;\n    }\n\n    public\
