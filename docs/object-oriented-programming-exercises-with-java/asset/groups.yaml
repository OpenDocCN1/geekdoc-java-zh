    # Listing 4-3: UIService.java\n\nOne note about reading with the Scanner class,\
    \ when we mix using nextLine() and nextInt() (or nextXXX() in general): When we\
    \ use nextInt() to read an integer from the console, the trailing line is not\
    \ read and remains as the next character in the stream. If we use nextLine() after\
    \ that, e.g. to read a full line, the newline character will be read and the method\
    \ will return without reading any text. To solve this, we call nextLine() after\
    \ nextInt() (or any similar method) so to take the newline character out of the\
    \ stream.\n\nNext, the addPackage() method gets the package information from the\
    \ user, creates the selected type of Package and inserts it into the list:\n\n\
