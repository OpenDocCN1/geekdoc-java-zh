    ##### Event Objects


    Event objects are synchronization primitives used to communicate between threads
    by signaling when a certain event has occurred. Threads can wait for an event
    to be set by another thread and then proceed accordingly.


    Threads can call the wait() method to wait for the event to be set. If the event
