    ## 第 5 章：面向对象编程\n\n### 5.1 类与对象\n\n在 Python 中，类似于 Java，类定义了该类所有对象都将拥有的属性（数据）和方法（行为）。\n\
    \n然而，与 Java 相比有几个关键区别：\n\n- **语法**：Python 不使用大括号 `{}`，而是使用缩进表示类的作用域。\n- **构造函数**：在\
    \ Python 中，只有一个名为 `__init__()` 的构造方法，用于初始化对象属性。为了实现类似于 Java 中多个构造函数的功能，你可以使用默认参数值和变长参数列表。\n\
    - **访问修饰符**：虽然 Python 没有提供显式的访问修饰符，但它使用 `_` 表示保护，`__` 表示私有。\n\n#### 运算符\n\n`==`\
    \ 运算符检查值的相等性，而 `is` 运算符检查标识标识。在 Python 中，`==` 运算符调用 `__eq__()` 方法，该方法默认像 `is`\
    \ 运算符一样比较值。\n\n```python\nclass Pair:\n    x = 0\n    y = 0\n\n    def __init__(self,\
    \ x=0, y=0):\n        self.x = x\n        self.y = y\n\n    def print_xy(self):\n\
    \        print(f\"x = {self.x} y = {self.y}\")\n\n    def __eq__(self, other):\n\
    \        if type(other).__name__ == \"Pair\":\n            return self.x == other.x\
    \ and self.y == other.y\n        else:\n            return False\n\nobj_1 = None\n\
    print(obj_1 is None)  # True\n\nobj_1 = Pair(10)\nobj_1.print_xy()  # x = 10 y\
    \ = 0\n\nobj_2 = Pair(10, 0)\nobj_3 = obj_1\n\nprint(obj_2 == obj_1)  # True\n\
    print(obj_2 is obj_1)  # False\nprint(obj_3 is obj_1)  # True\nprint(obj_1 ==\
    \ 10)  # False\n```\n\n"
- fmt: "\nAdditionally, the `del` statement can be used to remove an instance variable:\n\
    \n```python\nclass MyClass:\n    def __init__(self):\n        self.my_attribute\
    \ = 42\n\n    def remove_attribute(self):\n        del self.my_attribute\n\nobj\
    \ = MyClass()\nprint(obj.my_attribute)  # 42\n\nobj.remove_attribute()\nprint(obj.attribute)\
    \  # AttributeError\n```\n\nIn Python, there are also class variables that are\
    \ similar to static variables in Java. They are variables that are associated\
    \ with the class itself rather than with instances of the class.\n\nDefined within\
    \ the class definition but outside of any class methods, class variables are shared\
    \ by all instances of the class.\n\nHere is an example:\n\n```python\nclass MyClass:\n\
    \    x = \"Hello\"\n    def print_x(self):\n        print(MyClass.x)\n\nobj1 =\
    \ MyClass()\nobj2 = MyClass()\nobj1.print_x()  # Hello\nobj2.print_x()  # Hello\n\
    \nMyClass.x = \"Bye\"\nobj1.print_x()  # Bye\nobj2.print_x()  # Bye\n```\n\nPlease\
    \ note that in the example above `del MyClass.x` is possible as well, it removes\
    \ the class attribute.\n\nAs in Java, accessing class attributes through instance\
    \ objects is possible, but it should be avoided for clarity and consistency.\n\
    \nIn the example above, the statement `obj1.x = \"Good Morning\"` is possible\
    \ but would create an instance variable `obj1.x`, so `obj1.print_x()` would still\
    \ print the old value of `x` and not \"Good Morning\".\n\n### 5.2 Inheritance\n\
    \nIn Python, a subclass of an existing class is defined by specifying the name\
    \ of the parent class in parentheses after the subclass name.\n\nSubclasses inherit\
    \ all attributes and methods from their parent class, and they can access and\
    \ use these inherited members as if they were defined directly within the subclass\
    \ itself. Unlike Java, Python does not enforce access restrictions on inherited\
    \ members, meaning that the parent class cannot prevent them from being used by\
    \ a subclass.\n\nIn contrast to Java, Python does not automatically invoke the\
    \ constructor of the superclass from a subclass constructor.\n\nInstead, if the\
    \ subclass does not define its own constructor, Python automatically looks for\
    \ a constructor in the superclass. If found, it is called automatically. However,\
    \ if the subclass defines its own constructor, it must explicitly call the superclass\
    \ constructor if desired, typically using `super().__init__()()`. But this step\
    \ is not mandatory, and failing to do so will not result in a compile error.\n\
    \nSubclasses can override methods of the parent class without any special annotation\
    \ like `@override` in Java. When overriding methods in a subclass, the `super()`\
    \ function can be used to call the overridden method in the superclass.\n\nTo\
    \ determine whether an object is an instance of a class or one of its subclasses,\
    \ you can utilize the `isinstance()` function.\n\nHere is a code sample demonstrating\
    \ the usage of all these concepts:\n\n```python\nclass Animal:\n    def __init__(self,\
    \ name):\n        self.name = name\n    def sound(self):\n        pass\n\nclass\
    \ Cat(Animal):\n    def __init__(self, name, color):\n        super().__init__(name)\n\
    \        self.color = color\n    def sound(self):\n        return \"Meow!\"\n\n\
    our_cat = Cat(\"Louis\", \"tabby\")\nprint(our_cat.sound())  # Meow!\nprint(our_cat.name)\
    \  # Louis\nprint(our_cat.color)  # tabby\nprint(isinstance(our_cat, Cat))  #\
    \ True\nprint(isinstance(our_cat, Animal)) # True\n```\n\n### 5.3 Multiple Inheritance\n\
    \nMultiple inheritance is a feature supported by Python, but its popularity varies\
    \ among developers and is often a topic of debate.\n\nNevertheless, multiple inheritance\
    \ is used frequently, even within Python’s built-in libraries, to implement what\
    \ is called a mixin in object-oriented programming: Small, reusable pieces of\
    \ code that can be \"mixed in\" to multiple classes to provide common functionality.\
    \ Therefore, we will briefly describe multiple inheritance here.\n\nIn Python,\
    \ multiple inheritance is achieved by listing more than one parent class inside\
    \ parentheses after the subclass name.\n\n```python\nclass Animal:\n    def speak(self):\n\
    \        print(\"Animal speaks\")\n\nclass Bird:\n    def fly(self):\n       \
    \ print(\"Bird flies\")\n\nclass Parrot(Animal, Bird):\n    def __init__(self,\
    \ name):\n        self.name = name\n\n    def speak(self):\n        print(f\"\
    {self.name} speaks\")\n\nparrot = Parrot(\"Polly\")\nparrot.speak()\nparrot.fly()\n\
    ```\n\nIn Python, the Method Resolution Order (MRO) determines the sequence in\
    \ which classes are searched for methods. The MRO is generated using the C3 linearization\
    \ algorithm, which addresses the diamond problem.\n\nHere is an example to demonstrate\
    \ MRO:\n\n```python\nclass A:\n    def method(self):\n        print(\"A\")\n\n\
    class B(A):\n    def method(self):\n        print(\"B\")\n\nclass C(A):\n    def\
    \ method(self):\n        print(\"C\")\n\nclass D(B, C):\n    def method(self):\n\
    \        print(\"D\")\n\nd = D()\nprint(type(d).__mro__)\n```\n\n### 5.4 Access\
    \ Modifiers\n\n#### 5.4.1 Using _ and __ Prefixes\n\nProtected members of a class\
    \ are conventionally indicated by prefixing their names with a single underscore\
    \ (`_`). While this doesn’t enforce strict protection, it signals to other developers\
    \ that these members are intended for internal use within the class or subclasses.\n\
    \nPrivate members in Python are denoted by prefixing their names with double underscores\
    \ (`__`). This naming convention triggers mangling, making it more difficult for\
    \ external code to access these members directly.\n\nMangling works as follows:\n\
    \nWhen a member of a class is prefixed with double underscores (`__`), Python\
    \ internally renames the member by adding the class name as a prefix to the original\
    \ name. This renaming process occurs during compilation, not runtime. For example,\
    \ if class `MyClass` has a function `__func()`, this function will be renamed\
    \ to `_MyClass__func()` during compilation, and references to the function in\
    \ the code will be updated accordingly.\n\nAttributes and methods surrounded by\
    \ double underscores, such as `__name__` and `__init__`, are not subject to name\
    \ mangling. These are typically part of Python’s standardized data model and serve\
    \ specific, predefined roles within the language.\n\n```python\nclass MyClass:\n\
    \    def __init__(self):\n        self._protected_var = 42\n\n    def _protected_method(self):\n\
    \        return \"Protected\"\n\n    def __private_method(self):\n        return\
    \ \"This is a private method\"\n\nobj = MyClass()\n\n# These statements compile\
    \ and run but\n# are marked in the editor as\n# \"Access to protected member\"\
    \nprint(obj._protected_var)  # 42\nprint(obj._protected_method())  # Protected\n\
    \n# This code will fail with an AttributeError\nprint(obj.__private_method())\n\
    ```\n\n#### 5.4.2 Setters and Getters via Decorators\n\nDecorators in Python and\
    \ annotations in Java serve somewhat similar purposes, but they operate differently\
    \ and have distinct syntax and functionality (Decorators will be discussed in\
    \ Chapter [19](#part0025.xhtml_a26j): [Meta-Programming](#part0025.xhtml_a26j)).\n\
    \nPython provides the decorators\n\n*   `@property`\n\n*   `@<attr>.setter`\n"
  raw: 'Additionally, the del statement can be used to remove an instance variable:


    class MyClass:


        def __init__(self):


            self.my_attribute = 42


        def remove_attribute(self):


            del self.my_attribute


    obj = MyClass()


    print(obj.my_attribute)  # 42


    obj.remove_attribute()


    print(obj.attribute)  # AttributeError


    In Python, there are also class variables that are similar to static variables
    in Java. They are variables that are associated with the class itself rather than
    with instances of the class.


    Defined within the class definition but outside of any class methods, class variables
    are shared by all instances of the class.


    Here is an example:


    class MyClass:


        x = "Hello"


        def print_x(self):


            print(MyClass.x)


    obj1 = MyClass()


    obj2 = MyClass()


    obj1.print_x()  # Hello


    obj2.print_x()  # Hello


    MyClass.x = "Bye"


    obj1.print_x()  # Bye


    obj2.print_x()  # Bye


    Please note that in the example above del MyClass.x is possible as well, it removes
    the class attribute.


    As in Java, accessing class attributes through instance objects is possible, but
    it should be avoided for clarity and consistency.


    In the example above, the statement obj1.x = "Good Morning" is possible but would
    create an instance variable obj1.x, so obj1.print_x() would still print the old
    value of x and not "Good Morning".


    ### 5.2 Inheritance


    In Python, a subclass of an existing class is defined by specifying the name of
    the parent class in parentheses after the subclass name.


    Subclasses inherit all attributes and methods from their parent class, and they
    can access and use these inherited members as if they were defined directly within
    the subclass itself. Unlike Java, Python does not enforce access restrictions
    on inherited members, meaning that the parent class cannot prevent them from being
    used by a subclass.


    In contrast to Java, Python does not automatically invoke the constructor of the
    superclass from a subclass constructor.


    Instead, if the subclass does not define its own constructor, Python automatically
    looks for a constructor in the superclass. If found, it is called automatically.
    However, if the subclass defines its own constructor, it must explicitly call
    the superclass constructor if desired, typically using super().__init__(). But
    this step is not mandatory, and failing to do so will not result in a compile
    error.


    Subclasses can override methods of the parent class without any special annotation
    like @override in Java. When overriding methods in a subclass, the super() function
    can be used to call the overridden method in the superclass.


    To determine whether an object is an instance of a class or one of its subclasses,
    you can utilize the isinstance() function.


    Here is a code sample demonstrating the usage of all these concepts:


    class Animal:


        def __init__(self, name):


            self.name = name


        def sound(self):


            pass


    class Cat(Animal):


        def __init__(self, name, color):


            super().__init__(name)


            self.color = color


        def sound(self):


            return "Meow!"


    our_cat = Cat("Louis", "tabby")


    print(our_cat.sound())  # Meow!


    print(our_cat.name)  # Louis


    print(our_cat.color)  # tabby


    print(isinstance(our_cat, Cat))  # True


    print(isinstance(our_cat, Animal)) # True


    ### 5.3 Multiple Inheritance


    Multiple inheritance is a feature supported by Python, but its popularity varies
    among developers and is often a topic of debate.


    Nevertheless, multiple inheritance is used frequently, even within Python’s built-in
    libraries, to implement what is called a mixin in object-oriented programming:
    Small, reusable pieces of code that can be "mixed in" to multiple classes to provide
    common functionality. Therefore, we will briefly describe multiple inheritance
    here.


    In Python, multiple inheritance is achieved by listing more than one parent class
    inside parentheses after the subclass name.


    class Animal:


        def speak(self):


            print("Animal speaks")


    class Bird:


        def fly(self):


            print("Bird flies")


    class Parrot(Animal, Bird):


        def __init__(self, name):


            self.name = name


        def speak(self):


            print(f"{self.name}, {self.name}")


    parrot = Parrot("Polly")


    parrot.speak()  # Polly, Polly


    parrot.fly()    # Bird flies


    In Python, the Method Resolution Order (MRO) determines the sequence in which
    methods are sought and invoked, especially in the context of multiple inheritance
    to address the so-called diamond problem.


    The MRO is a list of classes that dictates the order in which Python searches
    for method implementations when a method is called on an object.


    The MRO list is generated using the C3 linearization algorithm, which considers
    the inheritance hierarchy and the order of parent classes to establish the method
    resolution sequence. The resulting list defines the order in which Python scans
    for methods in the class hierarchy.


    Notably, methods of classes positioned earlier in the parent class list of a subclass
    hold higher precedence compared to those listed later.


    To explicitly call an overridden method in a class with lower hierarchy, you can
    use the super() function with a class name or explicitly specify the name of the
    class whose method you want to call.


    Here is an example to demonstrate what the MRO looks like:


    class A:


        def method(self):


            print("A’s method")


    class B(A):


        def method(self):


            print("B’s method")


    class C(A):


        def method(self):


            print("C’s method")


    class D(B, C):


        def method(self):


            super().method()  # Calls B’s method


            C.method(self)  # Calls C’s method


            # Calls first class in MRO after C


            super(C, self).method()  # : Calls A’s method


    d = D()


    d.method()  # B’s method, C’s method, A’s method


    # MRO as list of classes


    print(type(d).__mro__)  # D, B, C, A, object


    ### 5.4 Access Modifiers


    #### 5.4.1 Using _ and __ Prefixes


    Protected members of a class are conventionally indicated by prefixing their names
    with a single underscore (_).


    While this doesn’t enforce strict protection, it signals to other developers that
    these members are intended for internal use within the class or its subclasses.


    Private members in Python are denoted by prefixing their names with double underscores
    (__). This naming convention triggers name mangling, making it more difficult
    for external code to access or modify these members directly.


    Mangling works as follows:


    When a member of a class is prefixed with double underscores (__), Python internally
    renames the member by adding the class name as a prefix to the original member
    name.


    This renaming process occurs during compilation, not runtime.


    For example, if class MyClass has a function named __func(), this function will
    be renamed to _MyClass__func() during compilation, and references to the function
    in the code will be updated accordingly.


    Attributes and methods surrounded by double underscores, such as __name__ and
    __init__(), are not subject to name mangling. These are typically part of Python’s
    standardized data model and serve specific, predefined roles within the language.


    class MyClass:


        def __init__(self):


            self._protected_var = 42


        def _protected_method(self):


            return "Protected"


        def __private_method(self):


            return "This is a private method"


    obj = MyClass()


    # These statements compile and run but


    # are marked in the editor as


    # "Access to protected member"


    print(obj._protected_var)  # 42


    print(obj._protected_method())  # Protected


    # This code will fail with an AttributeError


    print(obj.__private_method())


    #### 5.4.2 Setters and Getters via Decorators


    Decorators in Python and annotations in Java serve somewhat similar purposes,
    but they operate differently and have distinct syntax and functionality (Decorators
    will be discussed in Chapter [19](#part0025.xhtml_a26J): [Meta-Programming](#part0025.xhtml_a26J).).


    Python provides the decorators


    *   @property


    *   @<attr>.setter'
