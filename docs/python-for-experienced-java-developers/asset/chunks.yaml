    To include a file in the body of a POST request, you can first read its contents
    into a variable and then send the variable’s contents as raw data, following the
    method just described.


    If you want to include files to be uploaded alongside the form data in the body
    of a POST request, you can utilize the files parameter. In its simplest form the
    files parameter is a dictionary mapping the form names of the files to upload
    to their contents in the form of an already openend file.


    Here is an example:


    import requests


    url = "http://httpbin.org/post"


    data = {


        "number_of_reports": 2


    }


    with open("report1.csv", "rb") as file1, \


            open("report2.csv", "rb") as file2:


        files = {


            "report1": file1,


            "report2": file2


        }


        r = requests.post(url, data=data, files=files)


        print(r.text)


    # ...


    #   "files": {


