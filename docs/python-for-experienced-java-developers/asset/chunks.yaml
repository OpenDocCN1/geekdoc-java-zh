    ```\n\n#### 4.5.3 函数作用域\n\n函数可以访问全局作用域内的变量。要在函数内部修改全局变量，可以使用 `global` 关键字。\n\n\
    ```python\ncount = 0\ndef increment():\n    global count\n    count += 1\n\nincrement()\n\
    print(count) # 1\n```\n\n#### 4.5.4 函数作为参数\n\n函数在 Python 中是类对象，这意味着可以作为参数传递给其他函数。\n\
