    ## 5.交叉执行\n\nPython 解释器包含一个调度器，用于管理线程的交叉执行。然而，该调度器在 `GIL` 的限制内运行，GIL 允许允许一个线程执行\
    \ Python 字节码。\n\n尽管有此限制，调度器仍确保所有线程都有机会获取 `GIL` 并以交叉的方式执行它们的字节码。\n\n调度器还可以切换到另一个等待线程，当某个线程释放\
    \ `GIL` 时（例如在进行 I/O 操作或长时间计算期间），允许其执行自己的字节码。\n\n总而言之，这意味着虽然 Python 中的多个线程可以并发运行，但它们的性能受到全局解释器锁（`GIL`）的限制，这限制了它们有效利用多个\
    \ CPU 核心的能力。这种限制严重阻碍了并行性和扩展性，特别是在 CPU 密集型工作负载中。\n\n如之前在多进程章节中所讨论的，克服 Python 中\
