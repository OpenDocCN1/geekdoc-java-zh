    my_tuple = TupleWithHash(1, 2, 3, 4, 5)


    print(my_tuple)


    # (1, 2, 3, 4, 5, -5659871693760987716)


    The __call__ method allows an instance of a class to be called as if it were a
    function:


    class Multiplier:


        def __init__(self, factor):


            self.__factor = factor


        def __call__(self, value):


            return value * self.__factor


    double = Multiplier(2)


    print(double(5))  # 10


    ### 19.4 Metaclasses


    Metaclasses are classes whose instances are classes. They are constructs that
    Python uses to create class objects and instances, dictating how they are constructed
    and initialized.


    The only metaclass that comes built-in with Python is type. It is the metaclass
    that Python uses by default to create new class objects.


    In addition, you can define your own metaclasses to customize the class creation
    process. This allows you, for example, to automatically add or modify class attributes
    and methods, or to ensure that classes meet certain criteria, such as having specific
    attributes or methods.


    Interestingly, the metaclass of type itself is type. This self-referential property
    illustrates the recursive nature of Python’s type system, where type is both an
    instance and a subclass of itself.


    In the following sections, we will explore how to define custom metaclasses, how
    they interact with the class creation process, and the role they play when creating
    an instance of a class.


    #### 19.4.1 Defining Metaclasses


    When creating your own metaclass, it is generally recommended to inherit from
    type. This is because type is the default metaclass and provides the necessary
    infrastructure to create classes.


    A metaclass is an ordinary class whose constructor parameters are as follows:


    cls: The newly created class.


    name: The name of the class being created.


    bases: A tuple containing the base classes of the class being created.


    attr: A dictionary mapping the names of the attributes and methods of the class
    being created to their values.


    Here is an example of a metaclass that adds a version number to every class created
    with this metaclass:


    class MyMetaClass(type):


        version = "1.0"


        def __init__(cls, name, bases, attr):


            attr["version"] = MyMetaClass.version


            super().__init__(name, bases, attr)


    class MyClass(metaclass=MyMetaClass):


        x = 42


    print(MyClass.version)  # 1


    print(MyClass.x)  # 42


    It is also possible to instantiate the metaclass directly. For example, the definition
    of MyClass in the example above could be accomplished like this:


    MyClass = MyMetaClass(


        "MyClass",


        (object,),


        {"x": 42}


    )


    However, the resulting class is not identical. In the original example, the Python
    interpreter automatically adds attributes like __module__, containing the module
    name, which does not occur when the metaclass is instantiated directly.


    #### 19.4.2 Intercepting Object Creation


    In Python, creating an instance of a class is essentially equivalent to invoking
    the __call__ method of the class’s metaclass.


    The default __call__ method of the built-in metaclass type is responsible for
    creating instances of classes.


    When you call a class object, the __call__ method of type is invoked behind the
    scenes, which in turn invokes the __new__ and __init__ methods of the class to
    create and initialize the instance.


    This mechanism allows you to intercept the creation of class instances by defining
    a custom __call__ method in a metaclass.


    Here is an example implementing a singleton pattern:


    class SingletonMeta(type):


        __instances = {}


        def __call__(cls, *args, **kwargs):


            if cls not in SingletonMeta.__instances:


                ins = super().__call__(*args, **kwargs)


                SingletonMeta.__instances[cls] = ins


            return SingletonMeta.__instances[cls]


    class SingletonClass(metaclass=SingletonMeta):


        def __init__(self, value):


            self.value = value


    singleton1 = SingletonClass(10)


    singleton2 = SingletonClass(20)


    print(singleton1.value)  # 10


    print(singleton2.value)  # 10


    print(singleton1 is singleton2)  # True


    ### 19.5 Class and Object Introspection


    As in Java, Python provides built-in functions and modules like inspect that allow
    introspection of classes and objects at runtime.


    Introspection enables developers to examine the structure, attributes, and methods
    of classes and objects dynamically, facilitating tasks like runtime debugging,
    documentation generation, and dynamic code generation.


    #### 19.5.1 Built-in Functions for Introspection


    Python includes several built-in functions that are particularly useful for introspection:


    type(obj): Returns the class that the object is an instance of.


    dir(obj): Returns a list of the attributes and methods of an object.


    getattr(obj, name[, default]): Returns the value of the named attribute of an
    object. If the attribute is not found, the default value is returned if provided;
    otherwise, an AttributeError is raised.


    hasattr(obj, name): Checks if the object has the named attribute.


    setattr(obj, name, value): Sets the named attribute on the object to the specified
    value.


    delattr(object, name): Deletes the named attribute from the object.


    isinstance(obj, class): Checks if an object is an instance or subclass of a class.


    issubclass(subclass, class): Checks if a class is a subclass of another class.


    Here is an example:


    class MyClass:


        def __init__(self, x, y):


            self.x = x


            self.y = y


    class MySubClass(MyClass):


        def __init__(self, x, y, z):


            super().__init__(x,y)


            self.z = z


    my_subclass = MySubClass(1, 2, 3)


    print(type(my_subclass))


    # <class ’__main__.MySubClass’>


    print(dir(my_subclass))


    # [’__class__’, ’__delattr__’, ... ’x’, ’y’, ’z’]


    print(getattr(my_subclass, "x"))  # 1


    print(hasattr(my_subclass, "z"))  # True


    setattr(my_subclass, "has_towel", True)


    print(my_subclass.has_towel)  # True


    delattr(my_subclass, "has_towel")


    print(hasattr(my_subclass, "has_towel"))  # False


    print(isinstance(my_subclass, MyClass))  # True


    print(issubclass(MySubClass, MyClass))  # True'
