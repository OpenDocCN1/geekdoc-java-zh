    ```\n\nPython 集合的主要运算符包括：\n\n- 并集 (`|`）：合并两个集合，返回包含两个集合中所有唯一元素的新集合。\n- 交集 (`&`）：找到两个集合之间的公共元素，返回一个新集合。\n\
