    \ classes.\n\nAlthough the scope of this book does not allow for a comprehensive\
    \ overview of the functionalities offered by `unittest.mock`, we will provide\
    \ a brief introduction to some of its key features in this section.\n\n### 15.4.1\
    \ Creating Mocks\n\nWith `unittest.mock`, the simplest way to create a mock object\
    \ is by calling `Mock()`. The resulting object can then be invoked as a function\
    \ or accessed as an object with attributes and methods.\n\nThere is no need to\
    \ explicitly specify the names and return values of the functions it represents\
    \ or the attributes it should contain. Whenever the mock object is called or queried,\
    \ it dynamically creates another mock object and returns it.\n\nAdditionally,\
    \ it is possible to specify the behavior of the mock object.\n\nIts behavior as\
    \ a function is determined by assigning a value to its `return_value` attribute,\
    \ while its behavior for attribute queries is determined by assigning a value\
    \ to the corresponding attribute.\n\nHere is an example:\n\n```python\nfrom unittest.mock\
    \ import Mock\n\nfunction_mock = Mock()\nfunction_mock.return_value = 42\n\nresult_1\
    \ = function_mock(\"Life\", \"Universe\")\nresult_2 = function_mock()\n\nprint(result_1,\
    \ result_2)  # 42 42\n\nobject_mock = Mock()\nobject_mock.name = \"Arthur Dent\"\
    \nobject_mock.luggage = \"Towel\"\nobject_mock.great_question = function_mock\n\
    \nresult_3 = object_mock.name\nresult_4 = object_mock.luggage\nresult_5 = object_mock.great_question()\n\
    \nprint(result_3, result_4, result_5)\n\n# Arthur Dent Towel 42\n```\n\nAs `result_1`\
    \ and `result_2` show, a function mock can be called with an arbitrary number\
    \ of arguments.\n\nIt is also possible to verify both the number of method calls\
    \ and the parameters passed to those calls.\n\nThe assertions in the following\
    \ example would be applicable to the scenario described above:\n\n```python\n\
    function_mock.assert_called()\nfunction_mock.assert_any_call(\"Life\", \"Universe\"\
    )\nassert object_mock.great_question.call_count == 3\n```\n\nThere is also a subclass\
    \ of `Mock` called `MagicMock`, which offers useful default values for unconfigured\
    \ attributes or functions when used with standard functions, for example:\n\n\
    ```python\nint(MagicMock())  # returns 1\nfloat(MagicMock())  # returns 1.0\n\
    MagicMock()[5]  # returns a MagicMock object\nlen(MagicMock())  # returns 0 !!!\n\
    ```\n\nUsing `Mock` instead of `MagicMock` would raise an exception in these examples.\n\
    \nSo in tests where a mock is needed for an arbitrary value that won’t affect\
    \ the test’s outcome, `MagicMock` can simplify mock setup.\n\nFinally there is\
    \ an attribute called `side_effect` that you can specify for a mocked method in\
    \ a mock.\n\nIt allows you to specify a function or an iterable that will be called\
    \ or returned when the mock is called. This attribute is useful for custom actions\
    \ or varied return values based on test inputs or context.\n\nThis is how it works:\n\
    \n- If `side_effect` is set to a function, that function will be called with the\
    \ same arguments as the mock, and its return value will be used as the return\
    \ value of the mock call.\n- If `side_effect` is set to an iterable (such as a\
    \ list or a generator), the mock will return values from the iterable each time\
    \ it is called.\n- If `side_effect` is set to an exception, then when the mock\
    \ is called, it will raise that exception instead of returning a value.\n\nHere\
    \ is an example:\n\n```python\nfrom unittest.mock import Mock\n\nfunc_1 = Mock();\
    \ func_2 = Mock(); func_3 = Mock()\nfunc_1.side_effect = lambda x: x + 1\nfunc_2.side_effect\
    \ = range(1, 3)\nfunc_3.side_effect = ValueError(\"Ooops\")\n\nassert func_1(10)\
    \ == 11\nassert func_2() == 1\nassert func_2() == 2\ntry:\n    func_3()\nexcept\
    \ ValueError as e:\n    assert str(e) == \"Ooops\"\n```\n\n### 15.4.2 Patching\n\
    \nTo isolate the code under test from its dependencies, such as external libraries,\
    \ modules, or objects, `unittest.mock` provides a mechanism called patching. While\
    \ covering all aspects of this mechanism is beyond the scope of this book, we\
    \ will at least cover the most important features.\n\nA frequently occurring task\
