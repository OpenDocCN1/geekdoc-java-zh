    operational.


    Additionally, especially for the sdist file, you can check the directory of the
    virtual environment to ensure that all additional files, such as the README or
    the LICENSE file, have been installed correctly.


    #### 14.2.3 Uploading Packages


    Python’s package manager, pip, relies on HTTP for downloading packages, enabling
    the upload of Python packages to any server that provides download URLs, such
    as AWS S3, Google Cloud Storage, Microsoft Azure Blob Storage, or a generic web
    server or file hosting service.


    GitHub, in particular, offers a convenient platform for hosting code repositories
    and distributing software releases.


    To begin, you can create a repository and upload your package code. Then, you
    can utilize the Create a new release link on the repository’s homepage to upload
    the sdist or wheel file as a release. This allows you to upload various versions
    of your package under their respective version numbers.


    Now, every user of your package can install it using the pip command:


    pip install <package_download_url>


    Additionally, users can add a dependency in a requirements.txt file or in the
    dependency list of the install_requires parameter in setup.py using the following
    syntax:


    <package_name> @ <package_download_url>


    To share your package widely, publish it on PyPI after creating an account. You
    will need tools like twine, which won’t be detailed here.


    # Part IV


    Advanced Python Techniques


    ## Chapter 15


    Writing Python Test Code


    Among the most popular testing frameworks for Python, two frameworks stand out:
    unittest and pytest.


    unittest is Python’s built-in testing framework, drawing inspiration from the
    xUnit family of testing frameworks. It is sometimes referred to as PyUnit and
    shares similarities with JUnit for Java. Being included in every Python distribution,
    unittest is readily available and widely adopted, especially in projects that
    prioritize standardization and compatibility.


    On the other hand, pytest is a third-party testing framework known for its simplicity,
    flexibility, and powerful features. It offers advanced capabilities such as fixtures,
    parameterized testing, and extensive plugin support, enabling thorough customization
    and seamless integration with other tools and libraries.


    In this chapter, we will focus on unittest. Understanding unittest provides a
    strong foundation for mastering other testing frameworks, including pytest.


    ### 15.1 Structure of a Test Case Class


    In unittest, a test case class inherits from unittest.TestCase. This base class
    provides various assertion methods for verifying expected outcomes.


    Here is a basic example of a test case class:


    import unittest


    class MyTestCase(unittest.TestCase):


        def test_addition(self):


            result = 2 + 2


            self.assertEqual(result, 4)


        def test_check_positive_number(self):


            result = 5


            self.assertTrue(result > 0)


        def test_division_by_zero(self):


            with (self.assertRaises(ZeroDivisionError)):


                result = 5 / 0


    Defining more than one test case class in a single module is also possible.


    In contrast to JUnit, unittest relies on a naming convention rather than a decorator
    to identify methods as test cases. In unittest, any method whose name begins with
    test is treated as a test function, while any other method is considered an auxiliary
    function.


    This naming convention also applies to the file names of modules within a package;
    failure to adhere to this convention may result in the modules not being recognized
    as containing tests when running all tests within a package.


    ### 15.2 Running Test Cases


    Running Python test cases in IntelliJ IDEA is similar to running JUnit test cases.
    You can choose to run a specific test module or an entire test package directory
    using the following methods:


    *   Right-click on the test module or test package directory in the project window
    and select Run Python Tests in... from the context menu.


    *   Click on the gutter icon next to your test case or test class in the editor
    window.


    The results of the test run will be presented similarly to JUnit test runs in
    the Run window, which is typically located at the bottom of the screen by default.


    Alternatively, you can execute the tests from the command line using a terminal.


    To run the tests of a specific module, enter:


    python -m unittest <module_name>


    To run all tests within a package directory, use the following command:


    python -m unittest discover -s <path to directory>


    unittest provides several command-line options to tailor the test execution process.


    For instance, using -v increases the verbosity of the command’s output, which
    can be particularly useful for pinpointing the cause of failures. Additionally,
    you can use the --help option to list all available options.


    Please note that the discovery mechanism of the unittest test runner can handle
    only top-level namespace packages but will ignore all subpackages unless they
    are regular packages.


    ### 15.3 Test Organization


    Similar to Java, it is considered good practice in Python to keep your test code
    closely integrated with the corresponding production code but within a separate
    directory. This means organizing test modules and packages in parallel with the
    structure of your application’s source code.


    For instance, if you have a module named calculator.py in a package named utility
    in your production code, you might create a corresponding test package named test_utility,
    which contains a module named test_calculator.py.


    In unittest, to avoid code duplication, you have fixtures similar to those available
    in JUnit. These fixtures are methods of the TestCase class that you can override
    in your test class:


    The setUp() method is called before each test method in a test case class and
    is used to set up any required resources or state for the test. Conversely, the
    tearDown() method is called after each test method and is used to clean up any
    resources allocated during testing.


    In addition to per-test setup and teardown, unittest also provides class-level
    setup and teardown methods: setUpClass() and tearDownClass(). These methods are
    called once for the entire test case class, allowing you to perform setup and
    cleanup actions that are shared across multiple test methods.


    Apart from defining test cases, the unittest module provides decorators that allow
    you to modify the behavior of individual test methods or entire test classes.
    These decorators are similar to the corresponding annotations used in JUnit for
    Java.


    @unittest.skip("<Reason for skipping>")


    This decorator marks a test method or a test class as skipped. When applied, the
    code inside the decorated method or class will not be executed, and the test case(s)
    will be marked as ignored in the result list.


    You can provide an optional reason for skipping, which will be displayed in the
    test output.


    @unittest.expectedFailure'
