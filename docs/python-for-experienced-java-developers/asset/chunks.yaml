    ### 16.4 Managing Concurrency with Pools


    The concurrent package in Python offers a range of tools for managing concurrency
    and parallelism at a lower, and sometimes more platform-dependent, level. Providing
    a comprehensive description of this package is beyond the scope of this book.


    However, we will focus on key components such as process and thread pools, as
    well as futures, provided by its concurrent.futures subpackage.


    Thread and process pools are an important tool for managing concurrency because
    they pre-allocate a pool of threads or processes that remain alive and ready to
    execute multiple tasks until the pool is explicitly shut down. This approach avoids
    the overhead of creating and destroying threads or processes for each individual
    task.


    They are similar to Java’s ExecutorService interface but, unlike Java, support
    not only thread pools but also process pools.


    Here is an example of using a process pool:


    from concurrent.futures import ProcessPoolExecutor


    from time import sleep


    def square(x):


        sleep(2)


        return x * x


    if __name__ == "__main__":


        with ProcessPoolExecutor(max_workers=2)\


                as executor:


            futures = [executor.submit(square, i)


                       for i in range(1, 6)]


            print("Everything submitted")


            for future in futures:


                result = future.result()


                print("Result:", result)


    # Everything submitted


    # Result: 1


    # Result: 4


    # Result: 9


    # Result: 16


    # Result: 25


    Please note that the if __name__ == "__main__": guard is necessary here for the
    same reasons as explained in the multiprocessing examples.


    The statement


    ProcessPoolExecutor(max_workers=2)


    creates a ProcessPoolExecutor object, which manages a pool of 2 worker processes
    for executing tasks. This executor can be used as a context manager within a with
    statement, handling the setup and teardown of the process pool.


    Using the submit method of a ProcessPoolExecutor object, you can asynchronously
    submit a callable (like a function or lambda) along with its arguments for execution
    in one of the worker processes.


    If all worker processes are busy when a new task is submitted, it is queued until
    a worker becomes available. Once a worker is free, it picks up the next task from
    the queue and starts processing it.


    The submit method returns a Future object immediately, representing the result
    of the asynchronous computation. This Future object can be used to monitor the
    task’s status and retrieve its result once it is completed.


    The most important methods of a Future object are:


    done(): Returns True if the future has completed its computation or been cancelled,
    False otherwise.


    result(): Returns the result of the computation if it is available. If the computation
    has not yet completed, this method will block until the result is available or
    until the optional timeout (in seconds) expires.


    exception(): Returns the exception raised by the computation if it has failed.
    If the computation has not yet completed or has not raised an exception, this
    method will block until an exception is raised or until the optional timeout (in
    seconds) expires.


    cancel(): Attempts to cancel the execution of the computation. Returns True if
    the cancellation was successful, False otherwise.


    add_done_callback(<callback function>): Adds a callback function to be called
    when the future completes its computation or is cancelled. The callback function
    will be executed in one of the processes from the process pool with the future
    object as its sole argument.


    The above code functions similarly when


    ProcessPoolExecutor(max_workers=2)


    is replaced with


    ThreadPoolExecutor(max_workers=2),


    except that now all tasks are executed within threads running in the same process
    on a single CPU core.


    The explanation for why thread pools in Python, unlike Java, cannot achieve true
    parallelism is provided in the following section.


    ### 16.5 Global Interpreter Lock (GIL)


    The Global Interpreter Lock (GIL) in Python ensures that only one thread can execute
    Python bytecode at a time, even on multi-core systems with multiple CPU cores,
    in contrast to Java’s concurrency model. Here is a detailed explanation of how
    it operates:


    1.


    Thread Execution:


    When a Python program starts, the interpreter initializes the GIL, which acts
    as a mutex to control access to Python objects and memory.


    As the program executes, multiple threads may be created to perform concurrent
    tasks, such as I/O operations, computation, or data processing.


    Each thread operates independently and can execute Python bytecode instructions
    to perform its assigned tasks.


    2.


    GIL Acquisition:


    When a thread wants to execute Python bytecode, it attempts to acquire the GIL.


    If the GIL is available (i.e., no other thread currently holds it), the thread
    acquires the GIL and proceeds with executing bytecode.


    If the GIL is already held by another thread, the requesting thread must wait
    until the GIL is released.


    3.


    Exclusive Execution:


    Once a thread holds the GIL, it has exclusive access to Python objects and memory,
    allowing it to execute Python bytecode without interference from other threads.


    4.


    GIL Release:


    When a thread completes its task or reaches a point where it can voluntarily release
    the GIL, such as during I/O operations or long-running computations that do not
    require the GIL, it releases the lock to allow other threads to acquire it.


    For example, a thread performing file I/O operations may voluntarily release the
    GIL while waiting for data to be read from or written to a file.'
