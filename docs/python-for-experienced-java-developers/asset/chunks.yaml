- fmt: '

    The commands for installing a package are very similar for `pip` and `Conda`.
    For example, to install the `numpy` package, a fundamental package for scientific
    computing with Python, you would use one of these:


    ```bash

    pip install numpy

    conda install numpy

    ```


    Here `numpy` is the package name for the `numpy` package.


    The package names in Python are not inherently hierarchical in the same way as
    Java packages, like `com.example.package`. They are typically using lowercase
    letters and hyphens to separate words, such as `numpy`, or `requests-toolbelt`,
    or `eyed3`.


    `pip` and `Conda` fetch their libraries from online repositories.


    The primary source for `pip` is the Python Package Index (`PyPI`), which is a
    repository of software packages developed and maintained by the Python community.
    `PyPI` has a similar role for Python as `Maven Central` has for Java. It hosts
    thousands of Python packages that can be easily installed using `pip`.


    `Conda`, on the other hand, has its own package repositories managed by `Anaconda,
    Inc.`. These repositories contain a curated collection of packages optimized for
    use with `Conda` and are accessed when installing packages using the `Conda` package
    manager.


    In addition to these primary sources, `pip` and `Conda` can also be configured
    to fetch packages from other repositories or local directories as needed.


    Similar to Java, external packages in Python may have dependencies on other external
    packages. This dependency information is typically stored in special files and
    evaluated by package management tools. When installing a package, these tools
    automatically install the required dependencies as well.


    For example, when installing the data analysis package `pandas`, the `numpy` package
    is automatically installed as well.


    Similar to Java, Python packages have version numbers and the version number of
    the latest version of a package can be queried from the repository, where the
    package is stored. Thus it is possible to install a special version of a package
    or upgrade a packet to the latest version:


    ```bash

    pip install numpy==1.21.0

    pip install --upgrade numpy

    conda install numpy=1.21.0

    conda update numpy

    ```


    In `Conda`, it is also possible to update all installed packages at once:


    ```bash

    conda update --all

    ```


    Similar to Java, in Python only one version of a package can be installed in a
    specific environment at a time. This means that if multiple packages depend on
    different versions of the same package, it can lead to version conflicts and compatibility
    issues within the environment.


    Therefore it is generally recommended to upgrade packages individually or in smaller
    groups to mitigate the risk of conflicts.


    To list all installed packages along with their versions, use the following commands:


    ```bash

    pip list

    conda list

    ```


    Both `pip` and `Conda` offer straightforward methods for uninstalling packages.
    For example, to remove the `numpy` package, you can use the following commands:


    ```bash

    pip uninstall numpy

    conda remove numpy

    ```


    When uninstalling packages using `pip` or `Conda`, dependent packages that are
    no longer needed by any other installed packages will not be automatically uninstalled.
    This is because package managers typically do not track dependencies beyond the
    initial installation.


    However, you can use special commands to remove packages along with their dependencies.
    For `pip` environments you can use:


    ```bash

    pip-autoremove numpy

    ```


    As `pip-autoremove` is not included with the standard Python installation or the
    `pip` package manager by default, you need to install it first:


    ```bash

    pip install pip-autoremove

    ```


    As of the time of writing this book, additionally, under Windows, after installing
    `pip-autoremove`, you may need to manually adjust the command for it to work properly.
    See `https://github.com/invl/pip-autoremove/pull/44` for the details.


    With `Conda`, you can use the `--prune` option to remove the package along with
    its unused dependencies:


    ```bash

    conda remove --prune numpy

    ```


    ## 12.2 IntelliJ IDEA Package Management


    IntelliJ IDEA offers a built-in Python Packages Tool that simplifies the process
    of managing external packages and dependencies within your Python projects. You
    can access the tool by clicking on the corresponding icon, located in the lower
    part of the left menu bar by default.


    The tool manages the virtual environment that is currently active. On the left
    side, it displays the packages currently installed along with their version numbers.
    If a newer version is available for a package, the version number is shown as
    `<old version>→<new version>`, and clicking on the version number updates the
    package to the newest version.


    There are also lists for available packages on `PyPI` and, if the virtual environment
    is a `Conda` environment, for `Conda` packages. A search field at the top of the
    tool window filters the package names in all lists, making it easy to find a specific
    package.


    Clicking on a package name shows the package description on the right side of
    the tool window. At the top of this description, there is either an install button
    and a drop-down menu for selecting the version, or for installed packages, a vertical
    ellipsis icon that shows a button to uninstall the package.


    It is also possible to manage the packages of all available virtual environments
    by navigating to `File → Project Structure → Platform Settings →SDKs`.


    For a selected virtual environment, the `Packages` tab displays the currently
    installed packages and offers the same options to install, update, and uninstall
    packages as the Python Packages Tool.


    ## 12.3 Managing Project Dependencies


    Managing dependencies is a crucial aspect of Python projects, ensuring smooth
    development, deployment, and collaboration. One commonly used method for specifying
    project dependencies in Python is through the use of a `requirements.txt` file.
    Similar to the dependencies section in a Gradle script in Java, this file serves
    as a manifest of all the external packages and their respective versions required
    for your project to run.


    While it is common practice to check a `requirements.txt` file into version control
    systems (VCS) to document project dependencies, it is generally discouraged to
    include the entire virtual environment directory in VCS. Instead, including only
    the `requirements.txt` file allows collaborators to recreate the virtual environment
    locally using this file and tools like `pip` or `Conda`.


    While there are alternatives to `requirements.txt`, such as `Pipfile` (used by
    `Pipenv`) and `environment.yml` (used by `Conda`), this section will focus on
    the usage of `requirements.txt`. It remains one of the most widely adopted methods
    for managing Python project dependencies across various tools and workflows, including
    `Pip`, `virtualenv`, and `Docker`, due to its familiarity to many developers.


    ### 12.3.1 Structure of requirements.txt


    The `requirements.txt` file is typically located at the root directory of your
    project. For each external package that your project relies on, the file contains
    a line starting with the package name followed by the version specification. Here
    is an example:


    ```text

    pillow==10.2.0

    numpy~=1.26.4

    matplotlib>=3.6.0,<=3.8.3

    requests

    ```


    You can specify versions in various ways:


    - **Exact Version**: Pins the version to a specific release. For example: `numpy==1.21.0`.

    - **Version Range**: Defines a range of acceptable versions using comparison operators.
    For example: `numpy>=1.20.0,<1.22.0`.

    - **Compatible Releases**: Specifies that minor version updates are acceptable
    as long as they do not increment the leftmost non-zero digit. For example: `numpy~=1.20.0`
    allows updating from `1.20.0` to `1.21.0` but not to `2.0.0`.

    - **Latest Version**: Indicates that your project should use the latest available
    version of a package. However, this approach can potentially introduce compatibility
    issues, so it is generally not recommended. For example: `numpy`.


    Comment lines starting with `#` are possible as well. Additionally, there are
    other specifications possible in this file, such as referencing other requirements
    files, but this is beyond the scope of this book.

