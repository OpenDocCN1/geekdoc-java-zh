    \ 启动循环，它会处理所有任务直到完成。\n\n### 16.6.3 执行器\n\n在带有 `asyncio` 的异步编程中，协程是并发执行的构建块。与线程不同（线程由操作系统处理上下文切换和调度），在协程中，确保协程及时将控制权交给事件循环是程序员的责任。\n\
    \n未能这样做会导致阻塞其他协程，可能导致应用出现延迟甚至死锁。（虽然有更快的方法来寻找斐波契契数，但为了演示，我们选择了一种需要大量计算的方法。）\n\n\
    ```python\nimport asyncio\n\ndef fibonacci(n):\n    if n <= 1:\n        return\
    \ n\n    else:\n        return fibonacci(n-1) + fibonacci(n-2)\n\nasync def fibonacci_async(n):\n\
    \    result = fibonacci(n)\n    print(f\"fib({n}) = {result}\")\n\nasync def hello():\n\
    \    print(\"Hello!\")\n\nasync def main():\n    tasks = [\n        asyncio.create_task(fibonacci_async(36)),\n\
    \        asyncio.create_task(hello())\n    ]\n    await asyncio.wait(tasks)\n\n\
    asyncio.run(main())\n\n# fib(36) = 14930352\n# Hello!\n```\n\n尽管连续启动了两个任务，但第二个任务只有在斐波那契数计算完成后才开始。\n\
    \n一种简单的方法是将斐波那契数计算转换为协程，并在计算的递归部分加入 `asyncio.sleep()` 语句。这允许协程周期地将控制权交还给事件循环。\n\
    \n```python\nasync def fibonacci(n):\n    if n <= 1:\n        return n\n    else:\n\
    \        await asyncio.sleep(0.001)  # 1ms sleep\n        f_1 = await fibonacci(n-1)\n\
    \        f_2 = await fibonacci(n-2)\n        return f_1 + f_2\n```\n\n这种方法的缺点是计算过程明显变慢了，不仅是因为执行延迟，还是因为它为事件循环生成了大量新任务。\n\
    \n`asyncio` 为此问题提供了一个更好的解决方案，它有能力将同步操作委托给独立的线程或进程。以下是一个示例：\n\n```python\nimport\
    \ asyncio\nfrom concurrent.futures import ProcessPoolExecutor\n\ndef fibonacci(n):\n\
    \    if n <= 1:\n        return n\n    else:\n        return fibonacci(n-1) +\
    \ fibonacci(n-2)\n\nasync def fibonacci_async(n):\n    event_loop = asyncio.get_event_loop()\n\
    \    with ProcessPoolExecutor(max_workers=1) as executor:\n        result = await\
    \ event_loop.run_in_executor(executor, fibonacci, n)\n        print(result)\n\n\
    async def hello():\n    print(\"Hello!\")\n\nasync def main():\n    tasks = [\n\
    \        asyncio.create_task(fibonacci_async(36)),\n        asyncio.create_task(hello())\n\
    \    ]\n    await asyncio.wait(tasks)\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n\
    \n# Hello!\n# 14930352\n```\n\n要在执行器中执行函数，你可以使用事件循环的 `run_in_executor` 方法。该方法接收执行器池、要运行的函数以及函数的参数。`run_in_executor`\
    \ 然后会将任务提交给执行器池。注意 `run_in_executor` 仅接受位置参数。此外，你可以将执行器参数设置为 `None`，此时使用事件循环的默认池。默认情况下这是一个线程池，但可以通过事件循环的\
    \ `set_default_executor()` 方法进行覆盖。\n\n16.4 协程同步\n\n虽然协程本身不会引入竞态条件，但它们通常与共享资源工作或执行需要协调的操作。`asyncio`\
    \ 提供的 `Queue`、`Lock` 和 `Event` 有助于管理协程间的并发访问。线程同步原语如 `Lock` 和 `Semaphore` 会阻塞整个线程直到它们获取或释放。如果在协程中使用，它们可能会阻塞事件循环，阻止其他协程执行，从而违背异步编程的目的。\n\
    \n因此，`asyncio` 提供了自己的套专为协程异步编程设计的同步原语。以下是一个基于线程同步示例重写的示例：\n\n```python\nimport\
    \ asyncio\n\nbuffer = []\nitem_available = asyncio.Event()\nsignal_term = \"Terminate\"\
    \n\nasync def producer():\n    for item in range(100):\n        if item % 10 ==\
    \ 0:\n            item_available.set()\n            await asyncio.sleep(5)\n \
    \           print(f\"Producer: Item {item}\")\n        buffer.insert(0, item)\n\
    \    buffer.insert(0, signal_term)\n    item_available.set()\n\nasync def consumer(consumer_id):\n\
    \    while True:\n        if buffer:\n            item = buffer.pop()\n      \
    \      if item == signal_term:\n                buffer.insert(0, signal_term)\n\
    \                return\n            print(f\"Consumer {consumer_id}: Item {item}\"\
    )\n            await asyncio.sleep(5)\n        else:\n            item_available.clear()\n\
    \            await item_available.wait()\n\nasync def main():\n    tasks = [asyncio.create_task(producer())]\
    \ + [\n        asyncio.create_task(consumer(consumer_id))\n        for consumer_id\
    \ in range(12)\n    ]\n    await asyncio.gather(*tasks)\n\nasyncio.run(main())\n\
    \n# Producer: Item 0\n# ...\n# Producer: Item 90\n# Consumer 0: Item 0\n# Consumer\
    \ 1: Item 1\n# ...\n```\n\n"
