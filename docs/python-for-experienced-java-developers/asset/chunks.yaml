            self.error_code = 500


    def failing_operation():


        raise CustomError("Function failed.")


    try:


        failing_operation()


    except CustomError as e:


        print(e)  # Function failed.


        print(e.error_code)  # 500


    In contrast to Java, where the constructor of the Exception class typically accepts
    standard arguments like message or stack trace, the constructor of the base Exception
    class in Python only accepts a variable argument list (*args) and does not define
    standard arguments like message or stack trace explicitly.


    These exceptions can then be accessed later through the args attribute of the
    raised exception.


    Custom exceptions should be derived from Exception rather than its base class,
    BaseException. From the BaseException class exceptions such as SystemExit and
    KeyboardInterrupt are inherited which are typically reserved for system-level
    exceptions.


    ## Chapter 8


    Basic File Handling


    This chapter covers fundamental file operations like opening, reading, and writing
    files, as well as exception handling during file operations.


    ### 8.1 Opening and Closing Files


    Opening and closing a file in Python is similar to Java.


    To open a file, you use the open() function. Once you’re done working with the
    file, it’s essential to close it using the close() method to release system resources.


    file = open("example.txt", "r")


    data = file.read()


    # Close the file


    file.close()


    The first parameter in the open function specifies the file path. In this example,
    it is relative to the current working directory, where the Python script is executed.


    Absolute paths are also possible by providing the complete path to the file. However,
    absolute paths may require platform-specific formatting depending on the operating
    system used.


    This formatting typically involves specifying the path separators correctly for
    the operating system in use, but it is not directly handled by Python’s core functionality.


    The second parameter in the open function is the mode parameter. It determines
    how you want to access the file.


    Some common options are read (r), write (w), append (a), binary (b), and text
    (t). Combinations like rb for reading a binary file are possible as well.


    In Python, you can use the with statement to automatically handle the opening
    and closing of files. This is similar to the try-with-resources statement in Java.
    The with statement ensures that the file is properly closed after its suite finishes,
    even if an exception is raised during the execution of the code block.


    with open("example.txt", "r") as file:


        data = file.read()


        print(data)


    ### 8.2 Reading from Files


    Reading from files in Python is as straightforward as in Java, and there are multiple
    methods to achieve it:


    Using the read method, a file can be read either completely or in chunks, which
    is the preferred method for binary files, as in Java.


    with open("example.txt", "r") as file:


        contents = file.read()


    # Process the contents


    chunk_size = 1024  # Read 1 KB at a time


    with open("example.bin", "rb") as file:


        while True:


            chunk = file.read(chunk_size)


            if not chunk:


                break


            # Process the chunk of data


    For text files, readline() and readlines() can be used.


    with open("example.txt", "r") as file:


        lines = file.readlines()


    # Process the list of lines


    with open("example.txt", "r") as file:


        while True:


            line = file.readline()


            if not line:


                break


            # Process the current line


    Finally, Python file objects can be used as iterators to iterate over lines in
    a file directly within a loop.


    with open("filename.txt", "r") as file:


        for line in file:


            # Process the current line


    ### 8.3 Writing to Files


    The write() method allows you to write data directly to a file. You can use it
    to write strings and bytes. Any other data types must be converted before writing.


    The file must have been opened in write mode (w) if you want to create or overwrite
    a file or in append mode (a) if you want to add data to an existing file without
    overwriting its content.


    # Writing strings to a text file


    with open("example.txt", "w") as file:


        file.write("Hello, World!\n")


        file.write("This is a sample text.\n")


    # Appending text to a text file


    with open("example.txt", "a") as file:


        file.write("Appended line.\n")


    # Writing binary data


    data = b"\x48\x65\x6c\x6c\x6f"'
