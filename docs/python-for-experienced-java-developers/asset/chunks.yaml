    \ platform_A (S)/\n|..|..|- my_package/\n|..|..|..|- my_platform_module.py\n|..|-\
    \ platform_B (E)/\n|..|..|- my_package/\n|..|..|..|- my_platform_module.py.\n\
    ```\n\n最后，供你参考，将目录标记为源根会自动将其添加到 `PYTHONPATH` 变量中，该变量是 Python 解释器在搜索模块或包时遍历的目录列表，类似于\
    \ Java 的 classpath。\n\n### 10.3 导入模块\n\nPython 支持从模块导入多种类型，每种类型都有特定的用途：\n\n- **导入整个模块**：最常见的导入类型，使用\
    \ `import` 关键字导入整个模块。这使得模块中定义的所有名称都可以通过模块的命名空间访问。\n- **导入特定项**：使用 `from` 关键字可以将特定项直接导入到当前命名空间。这便于选择性地访问必要的组件，而无需在它们前面加上模块名。这种做法增强了代码的可读性并减少了命名空间的混乱。\n\
    - **重命名导入项**：通过 `as` 关键字，可以重命名导入的项以避免命名冲突或提供更具描述性的名称。\n- **通配符导入**：虽然 Python 支持使用通配符导入模块中的所有名称，但由于潜在的命名空间污染和可读性问题，通常不建议这样做。\n\
    \n在接下来的章节中，将详细解释每种导入类型。所有示例代码将基于以下模块，其模块名为 `my_module`，包名为 `my_package`。\n\n```python\n\
    # my_package/my_module\n\nclass MyClass:\n    def __init__(self, name):\n    \
    \    self.name = name\n    def greet(self):\n        return f\"Hello, {self.name}!\"\
    \n\ndef my_function():\n    return \"Hello from my_module.\"\n\nmy_variable =\
    \ \"Hello, World!\"\n```\n\n在 Python 中，当你从包而不是模块导入内容时，对象是从包的 `__init__.py` 文件导入的。\n\
    \n因此，如果上述代码位于 `my_package` 的 `__init__.py` 文件中，那么下面描述的导入也可以通过从 `my_package` 而不是\
    \ `my_package.my_module` 导入来实现。在本章末尾提供了一个说明这种方法原理的示例。\n\n#### 10.3.1 导入整个模块\n\n\
    你可以使用 `import` 关键字后跟包名和模块名来导入整个模块。\n\n一旦导入，你就可以使用点符号来访问模块的内容。\n\n```python\nimport\
    \ my_package.my_module\nprint(my_package.my_module.my_variable)\nprint(my_package.my_module.my_function)\n\
    \nobj = my_package.my_module.MyClass()\n```\n\n#### 10.3.2 导入特定项\n\n你可以使用 `from`\
    \ 关键字后跟模块名以及 `import` 语句来导入特定项，如类、函数或变量。\n\n一旦导入，你就可以直接引用它们，而无需在它们前面加上模块名。\n\n\
    ```python\nfrom my_package.my_module import my_variable, my_function, MyClass\n\
    print(my_variable)\nprint(my_function())\n\nobj = MyClass()\n```\n\n#### 10.3.3\
    \ 重命名导入项\n\n从模块导入项时，可以使用 `as` 关键字后跟别名对其进行重命名，这可以提高代码可读性或解决命名冲突。\n\n```python\n\
    from my_package.my_module import my_variable as renamed_variable, my_function\
    \ as renamed_function, MyClass as RenamedClass\nprint(renamed_variable)\nprint(renamed_function())\n\
    \nobj = RenamedClass()\n```\n\n#### 10.3.4 通配符导入\n\n通配符导入使用 `*` 符号从模块导入所有项到当前命名空间。\n\
    \n```python\nfrom my_package.my_module import *\nprint(my_variable)\nprint(my_function())\n\
    \nobj = MyClass()\n```\n\n虽然通配符导入很方便，但它们会导致命名空间污染，并不清楚哪些符号被导入了，从而引发问题。\n\n通过为\
    \ `__all__` 变量赋值一个项列表，可以限制模块的通配符导入。\n\n#### 10.4 绝对导入与相对导入\n\n在 Python 中，导入分为两种类型：绝对导入和相对导入。\n\
    \n绝对导入从顶级包开始指定要导入的模块或包的精确位置。这种导入类型类似于 Java 的 import 语句，提供了从项目根目录到目标模块的完整路径。\n"
- fmt: "\nRelative imports specify the location of the module or package relative\
    \ to the current module. This type of import is useful when importing modules\
    \ or packages within the same project or package hierarchy.\n\nWhen using relative\
    \ imports in Python, you can specify the number of levels up in the package hierarchy\
    \ to traverse by prefixing the import path with one or more dots (`.`).\n\nEach\
    \ dot represents one level up in the hierarchy. For example, to import a module\
    \ from the parent package, you use a single dot (`.`); to import from the grandparent\
    \ package, you use two dots (`..`), and so on.\n\nAs an example, consider this\
    \ project structure:\n\n```text\nsrc/\n|- main.py\n|- package/\n|..|- module\n\
    |..|- second_module\n|..|- sub_package/\n|..|..|- sub_module.py\n|..|..|- sub_sub_package/\n\
    |..|..|..|- sub_sub_module.py\n|..|- other_sub_package/\n|..|..|- other_module.\n\
    ```\n\nIf `main.py` wants to import a function from `sub_module.py`, it must use\
    \ an absolute import because scripts are not part of any package and therefore\
    \ cannot use relative imports.\n\n#### `main.py`\n\n```python\nfrom package.sub_package.sub_module\n\
    \    import my_function\n```\n\nIf `second_module` wants to import a function\
    \ from the `module`, it can use a relative import using a single `.` to indicate\
    \ that the module is located in the same package.\n\n#### `second_module`\n```python\n\
    from .module import my_function\n```\n\nIf `sub_sub_module.py` wants to import\
    \ functions from `sub_module.py` and `other_module.py`, it can do so by using\
    \ `..` and `...` as prefixes, respectively.\n\n#### `sub_sub_module`\n```python\n\
    from ..sub_module\n    import my_function as func_1\n\nfrom ...other_sub_package.other_module\n\
    \    import my_function as func_2\n```\n\nAfter discussing relative imports here,\
    \ it is important to note that according to `PEP 8`, the Python style guide, absolute\
    \ imports are generally recommended over relative imports. `PEP 8` states:\n\n\
    > Absolute imports are recommended, as they are usually more readable and tend\
    \ to be better behaved (or at least better error messages) if the import system\
    \ is incorrectly configured.\n\n### 10.5 Package Interfaces\n\nIn Python, placing\
    \ import statements within an `__init__.py` file or a module of a package makes\
    \ those imports directly accessible for use in other modules or packages.\n\n\
    This behavior allows packages to provide a convenient interface for users to access\
    \ commonly used objects directly from the package namespace.\n\nFor example, consider\
    \ a package named `mypackage` with the following structure:\n\n```text\nmy_package/\n\
    |- __init__.py\n|- my_module_1.py\n|- my_module_2.py\n```\n\nIf `my_module_1.py`\
    \ contains a function `my_function`, and `my_module_2.py` contains a class named\
    \ `MyClass`, you can import these objects in `__init__.py`:\n\n#### `__init__.py`\n\
    ```python\nfrom my_module_1 import my_function\n\nfrom my_module_2 import MyClass\n\
    ```\n\nThat way every script can directly import these items directly from the\
    \ package:\n\n```python\nfrom mypackage import my_function, MyClass\n```\n\nThis\
    \ allows for a cleaner and more intuitive API for users of the package, as they\
    \ can access the objects they need directly from the package namespace.\n\n###\
    \ 10.6 The `__name__` Attribute in Python Modules\n\nIn Python, there is a special\
    \ built-in attribute called `__name__` that is automatically defined for every\
    \ module and script (Please notice: The name attribute discussed here, should\
    \ not be confused with `__name__` when referring to class objects in Python. The\
    \ former pertains to module-level metadata, while the latter typically refers\
    \ to the name of the class itself within the context of object-oriented programming.).\
    \ It serves a crucial role in distinguishing between whether a module is being\
    \ run as the main program or imported as a module into another program.\n\n- **Main\
    \ Program Execution**: When a Python script is executed directly using `python\
    \ script.py`, the `__name__` attribute for that script is set to `\"__main__\"\
    `.\n- **Module Import**: When a Python script is imported as a module into a script\
    \ or another module, its `__name__` attribute is set to the module’s name.\n\n\
    The `__name__` attribute is commonly used in Python to control the execution of\
    \ code based on whether the module is run as the main program or imported as a\
    \ module.\n\nHere is a simple example to illustrate its use:\n\n#### `my_module.py`\n\
    ```python\ndef script():\n    print(\"Running as script.\")\n\ndef imported():\n\
    \    print(f\"Module {__name__} imported.\")\n\nif __name__ == \"__main__\":\n\
    \    script()\nelse:\n    imported()\n```\n\nRunning `my_module.py` directly would\
    \ output:\n```\nRunning as script\n```\nwhereas importing `my_module.py` elsewhere\
    \ would output:\n```\nModule my_module imported.\n```\n\n## Chapter 11: Python\
    \ Environments\n\n### 11.1 Introduction to Python Environments\n\nA Python environment,\
    \ much like a Java Development Kit (JDK), encompasses the collection of resources\
    \ and settings required for executing Python code and running Python-based applications.\n\
    \nIt includes essential components such as the Python interpreter, libraries,\
    \ dependencies, configuration settings, and runtime environment.\n\nIn summary,\
    \ a Python environment provides the necessary infrastructure for creating, executing,\
    \ and managing Python programs effectively.\n\nThere are two types of environments:\n\
    \n- **System-wide Environment**: This is the default environment active when you\
    \ run the Python interpreter in a newly created shell.\n- **Virtual Environments**:\
    \ These provide a sandboxed environment where project-specific dependencies can\
    \ be installed and managed independently of other Python projects.\n\n### 11.2\
    \ Managing Virtual Environments\n\n#### 11.2.1 Available Tools\n\n- **venv**:\
    \ This is the standard tool provided by Python itself. You can create a virtual\
    \ environment using Python scripts from the `venv` module, which is included with\
    \ Python by default.\n- **Virtualenv**: This popular third-party tool enhances\
    \ the functionality provided by the `venv` module.\n\n(Note: The text mentions\
    \ virtual environments provide activation and deactivation scripts that modify\
    \ the shell environment to use the virtual environment’s interpreter and modify\
    \ the shell’s PATH variable to prioritize the virtual environment’s binary directory\
    \ for package execution. This allows you to switch between virtual environments\
    \ seamlessly within a shell session.)\n"
  raw: 'Relative imports specify the location of the module or package relative to
    the current module. This type of import is useful when importing modules or packages
    within the same project or package hierarchy.


    When using relative imports in Python, you can specify the number of levels up
    in the package hierarchy to traverse by prefixing the import path with one or
    more dots (.).


    Each dot represents one level up in the hierarchy. For example, to import a module
    from the parent package, you use a single dot (.); to import from the grandparent
    package, you use two dots (..), and so on.


    As an example, consider this project structure:


    src/


    |- main.py


    |- package/


    |..|- module


    |..|- second_module


    |..|- sub_package/


    |..|..|- sub_module.py


    |..|..|- sub_sub_package/


    |..|..|..|- sub_sub_module.py


    |..|- other_sub_package/


    |..|..|- other_module.


    If main.py wants to import a function from sub_module.py, it must use an absolute
    import because scripts are not part of any package and therefore cannot use relative
    imports.


    # main.py


    from package.sub_package.sub_module\


        import my_function


    If second_module wants to import a function from the module, it can use a relative
    import using a single . to indicate that the module is located in the same package.


    # second_module


    from .module import my_function


    If sub_sub_module.py wants to import functions from sub_module.py and other_module.py,
    it can do so by using .. and ... as prefixes, respectively.


    # sub_sub_module


    from ..sub_module \


        import my_function as func_1


    from ...other_sub_package.other_module \


        import my_function as func_2


    After discussing relative imports here, it is important to note that according
    to PEP 8, the Python style guide, absolute imports are generally recommended over
    relative imports. PEP 8 states:


    Absolute imports are recommended, as they are usually more readable and tend to
    be better behaved (or at least give better error messages) if the import system
    is incorrectly configured.


    ### 10.5 Package Interfaces


    In Python, placing import statements within an __init__.py file or a module of
    a package makes those imports directly accessible for use in other modules or
    packages.


    This behavior allows packages to provide a convenient interface for users to access
    commonly used objects directly from the package namespace.


    For example, consider a package named mypackage with the following structure:


    my_package/


    |- __init__.py


    |- my_module_1.py


    |- my_module_2.py.


    If my_module_1.py contains a function my_function, and my_module_2.py contains
    a class named MyClass, you can import these objects in __init__.py:


    # __init.py__


    from my_module_1 import my_function


    from my_module_2 import MyClass


    That way every script can directly import these items directly from the package:


    from mypackage import my_function, MyClass


    This allows for a cleaner and more intuitive API for users of the package, as
    they can access the objects they need directly from the package namespace.


    ### 10.6 The __name__ Attribute in Python Modules


    In Python, there is a special built-in attribute called__name__ that is automatically
    defined for every module and script (Please notice: The name attribute discussed
    here, should not be confused with __name__ when referring to class objects in
    Python. The former pertains to module-level metadata, while the latter typically
    refers to the name of the class itself within the context of object-oriented programming.).
    It serves a crucial role in distinguishing between whether a module is being run
    as the main program or imported as a module into another program.


    Main Program Execution: When a Python script is executed directly using python
    script.py, the __name__ attribute for that script is set to "__main__".


    Module Import: When a Python script is imported as a module into a script or another
    module, its __name__ attribute is set to the module’s name.


    The __name__ attribute is commonly used in Python to control the execution of
    code based on whether the module is run as the main program or imported as a module.


    Here is a simple example to illustrate its use:


    # my_module.py


    def script():


        print("Running as script.")


    def imported():


        print(f"Module {__name__} imported.")


    if __name__ == "__main__":


        script()


    else:


        imported()


    Running my_module.py directly would output


    Running as script


    whereas importing my_module.py elsewhere would output


    Module my_module imported.


    ## Chapter 11


    Python Environments


    ### 11.1 Introduction to Python Environments


    A Python environment, much like a Java Development Kit (JDK), encompasses the
    collection of resources and settings required for executing Python code and running
    Python-based applications.


    It includes essential components such as the Python interpreter, libraries, dependencies,
    configuration settings, and runtime environment.


    In summary, a Python environment provides the necessary infrastructure for creating,
    executing, and managing Python programs effectively.


    There are two types of environments:


    System-wide Environment: This is the default environment active when you run the
    Python interpreter in a newly created shell.


    Virtual Environments: These provide a sandboxed environment where project-specific
    dependencies can be installed and managed independently of other Python projects.
    They can be activated either manually or automatically, for example, from your
    IDE when you open a project.


    When you activate a virtual environment, any subsequent Python commands or scripts
    executed in the shell will use the Python interpreter and libraries associated
    with the activated virtual environment.


    Conversely, deactivating a virtual environment restores the shell environment
    to its previous state, reverting to the system-wide Python interpreter and installed
    packages.


    Virtual environments are typically created within a directory containing a specific
    structure that includes a separate Python interpreter and a set of directories
    for package installations and other resources.


    Each virtual environment contains its own copy of the Python interpreter executable.
    This ensures that when the virtual environment is activated, it uses its own interpreter
    rather than the system-wide one.


    Additionally, virtual environments include their own directories for installing
    Python libraries and packages. When you install a package within a virtual environment
    using pip or another package manager, the packages are installed into this isolated
    directory structure, separate from other environments.


    Installation of packages and managing dependencies will be covered in the following
    chapter.


    Virtual environments provide activation and deactivation scripts that modify the
    shell environment to use the virtual environment’s Python interpreter and modify
    the shell’s PATH variable to prioritize the virtual environment’s binary directory
    for package execution. This allows you to switch between virtual environments
    seamlessly within a shell session.


    Virtual environments are not inherently tied to a specific project.


    While it is common practice to create a virtual environment for each project to
    manage project-specific dependencies, technically, the same virtual environment
    can be used across different projects.


    ### 11.2 Managing Virtual Environments


    #### 11.2.1 Available Tools


    For creating and activating virtual environments in Python, several tools are
    available, each with its own advantages:


    venv: This is the standard tool provided by Python itself. You can create a virtual
    environment using Python scripts from the venv module, which is included with
    Python by default.


    Virtualenv: This popular third-party tool enhances the functionality provided
    by the venv module.


    While it utilizes venv under the hood, Virtualenv adds extra features and flexibility
    to make the process more robust and user-friendly.'
