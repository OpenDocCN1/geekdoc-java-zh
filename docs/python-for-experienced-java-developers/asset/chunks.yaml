    \ 1: Item 1\n# ...\n\n## Event 对象\n\nEvent 对象是同步原语，用于通过信号特定事件的发生并在线程之间进行通信。线程可以等待另一个线程设置事件，然后据此继续操作。\n\
    \n线程可以调用 `wait()` 方法等待事件被设置。如果事件已经设置，线程将立即继续执行。如果未设置，它将一直等待，直到另一个线程使用 `set()`\
    \ 方法设置事件。\n\n`set()` 方法设置事件，允许等待该事件的线程继续执行。\n\n`clear()` 方法重置事件，表示其未被设置。在事件被重置后调用\
    \ `wait()` 的线程将阻塞，直到另一个线程再次设置事件。\n\n这里是一个示例，其中线程在延迟后提供了“打印机访问权限”：\n\n```python\n\
    from threading import Thread, Event\nfrom time import sleep\n\nprinter_available\
    \ = Event()\nprinter = None\n\nclass PrinterCreator(Thread):\n    def run(self):\n\
    \        sleep(3)\n        global printer\n        printer = lambda x: print(f\"\
    Printer: {x}\")\n        printer_available.set()\n\nPrinterCreator().start()\n\
    printer_available.wait()\nprinter(\"Hello World\")\n```\n\n# Printer: Hello World\n\
    \n## 16.4 使用池管理并发\n\nPython 中的 `concurrent` 包提供了一系列工具，用于在较低（有时更依赖于平台）的层级管理并发和并行。对该包提供详尽描述超出了本书的范围。\n\
    \n然而，我们将重点关注其 `concurrent.futures` 子包提供的关键组件，例如进程池、线程池以及未来（futures）。\n\n线程池和进程池是管理并发的重要工具，因为它们预分配了一个线程或进程池，这些线程或进程保持存活并准备执行多个任务，直到池被显式关闭。这种方法避免了为每个单独任务创建和销毁线程或进程的开销。\n\
    \n类似于 Java 的 `ExecutorService` 接口，但与 Java 不同，它们不仅支持线程池，还支持进程池。\n\n以下是使用进程池的示例：\n\
    \n```python\nfrom concurrent.futures import ProcessPoolExecutor\nfrom time import\
    \ sleep\n\ndef square(x):\n    sleep(2)\n    return x * x\n\nif __name__ == \"\
    __main__\":\n    with ProcessPoolExecutor(max_workers=2)\\\n            as executor:\n\
    \        futures = [executor.submit(square, i)\n                   for i in range(1,\
    \ 6)]\n        for future in futures:\n            print(future.result())\n```\n\
    \n## 16.5 全局解释器锁 (GIL)\n\nPython 中的全局解释器锁 (GIL) 同一时间只有一个线程执行 Python 字节码，即使在具有多个核心的系统上，这与\
    \ Java 的并发模型不同。以下是其运行机制的详细解释：\n\n### 1. 线程执行：\n\n当 Python 程序启动时，解释器初始化 GIL，它作为一个互斥锁控制对\
    \ Python 对象和内存的访问。随着程序的执行，可能会创建多个线程来执行并发任务，例如 I/O 操作、计算或数据处理。每个线程独立运行并可以执行 Python\
    \ 字节码来完成任务。\n\n### 2. 获取 GIL：\n\n当线程想要执行 Python 字节码时，它尝试获取 GIL。如果 GIL 可用（即没有其他线程持有它），该线程获取\
    \ GIL 并继续执行字节码。如果 GIL 已被另一个线程持有，请求线程将一直等待 GIL 被释放。\n\n### 3. 独他执行：\n\n一旦线程持有了\
    \ GIL，它对 Python 对象和内存具有独他访问权限，允许其在不受其他线程干扰的情况下执行 Python 字节码。\n\n### 4. 释放 GIL：\n\
    \n当线程完成任务或达到可以主动释放 GIL 的点时（例如在 I/O 操作期间或不需要 GIL 的长时间计算期间），它会释放锁以允许其他线程获取。\n\n\
    例如，执行文件 I/O 操作的线程在等待从文件读取或写入数据时，可能会主动释放 GIL。\n\n"
- fmt: "\nSimilarly, a thread executing a time-consuming mathematical computation\
    \ that does not involve shared Python objects may release the `GIL` to allow other\
    \ threads to execute Python bytecode concurrently.\n\nThis is typically handled\
    \ automatically by the Python interpreter.\n\nReleasing the `GIL` allows other\
    \ waiting threads to acquire it and continue executing Python bytecode, enabling\
    \ concurrent execution of multiple threads.\n\n## 5. Interleaved Execution\n\n\
    The Python interpreter includes a scheduler for managing the interleaved execution\
    \ of threads. However, this scheduler operates within the constraints of the `GIL`,\
    \ which allows only one thread to execute Python bytecode at a time.\n\nDespite\
    \ this limitation, the scheduler ensures that all threads have a chance to acquire\
    \ the `GIL` and execute their bytecode in an interleaved manner.\n\nThe scheduler\
    \ can also switch to another waiting thread, enabling it to execute its bytecode\
    \ when a thread releases the `GIL`, such as during I/O operations or long-running\
    \ computations.\n\nAll in all, this means that while multiple threads in Python\
    \ can run concurrently, their performance is constrained by the Global Interpreter\
    \ Lock (`GIL`), which limits their ability to effectively utilize multiple CPU\
    \ cores. This limitation significantly hinders parallelism and scalability, particularly\
    \ in CPU-bound workloads.\n\nAs previously discussed in the section on multiprocessing,\
    \ one effective approach to overcome the limitations imposed by the `GIL` in Python\
    \ is to leverage multiprocessing instead of multithreading.\n\nBy utilizing separate\
    \ processes, each with its own Python interpreter and `GIL`, multiprocessing enables\
    \ true parallelism across multiple CPU cores without being constrained by the\
    \ `GIL`.\n\nAnother approach to overcoming the limitations imposed by the `GIL`\
    \ is through cooperative multitasking, which will be described in the next section.\n\
    \n## 16.6 Asynchronous Programming\n\n### 16.6.1 Overview\n\nAsynchronous programming\
    \ is a programming paradigm that enables concurrent execution of multiple tasks\
    \ without the need for explicit threading or multiprocessing.\n\n`asyncio` is\
    \ a Python library that simplifies asynchronous programming by providing high-level\
    \ abstractions for managing asynchronous tasks.\n\nIt consists of the following\
    \ components:\n\n- **Coroutines**: Special functions that run asynchronously within\
    \ a thread. They are defined using the `async` keyword, indicating that the function\
    \ is asynchronous and can be awaited for completion. Coroutines can start other\
    \ coroutines and await their results.\n- **Event loop**: Coordinates the scheduling\
    \ and execution of coroutines. Each thread typically has exactly one associated\
    \ event loop, and coroutines scheduled by the event loop run within that thread.\n\
    - **Tasks**: Objects that represent the execution of coroutines within the event\
    \ loop. Tasks allow you to manage the execution of coroutines and await their\
    \ results asynchronously.\n- **Executors**: Objects that manage the execution\
    \ of blocking or CPU-bound tasks in separate threads or processes, allowing the\
    \ event loop to remain responsive. Executors are typically created within a coroutine\
    \ that asynchronously waits for the executor to finish and return a result.\n\n\
    Coroutines are lightweight concurrency units that can be cooperatively scheduled\
    \ within a single thread. They typically have lower overhead compared to threads,\
    \ as they don’t involve context switching or OS-level thread management.\n\nWith\
    \ the help of executors, coroutines provide a convenient way to work around the\
    \ limitations imposed by the `GIL` for I/O-bound or CPU-bound tasks.\n\nWhile\
    \ `asyncio` offers many features for async programming, its full depth is beyond\
    \ the scope of this book. However, in the next sections, you will get a good overview,\
    \ so you will understand how `asyncio` works and how to use it effectively.\n\n\
    ### 16.6.2 Creating and Running Coroutines\n\nCreating just one coroutine and\
    \ running it is very simple with `asyncio`.\n\nHere is an example:\n\n```python\n\
    import asyncio\n\nasync def my_coroutine():\n    print(\"Coroutine started\")\n\
    \    await asyncio.sleep(1)\n    print(\"Coroutine resumed after 1 second\")\n\
    \    return 42\n\nresult = asyncio.run(my_coroutine())\nprint(result)\n# Coroutine\
    \ started\n# Coroutine resumed after 1 second\n# 42\n```\n\nThe keywords `async\
    \ def` mark the function `my_coroutine` as a coroutine, indicating that it cannot\
    \ be directly invoked but must be scheduled for execution by the event loop.\n\
    \nUsing `asyncio.run(my_coroutine())` initiates the creation of an event loop\
    \ for the current thread. It then generates a task for `my_coroutine`, allows\
    \ the event loop to begin executing the task, waits for its completion, and finally\
    \ returns its result.\n\nPlease note that while `asyncio.sleep()` suspends the\
    \ execution of the coroutine for the specified duration, allowing other coroutines\
    \ to run in the meantime, using `time.sleep()` instead would have blocked the\
    \ entire thread, preventing the event loop from processing other coroutines during\
    \ this period.\n\nThe following example demonstrates a main coroutine initiating\
    \ another coroutine, awaiting its completion, and then initiating the next coroutine.\n\
    \n```python\nimport asyncio\n\nasync def my_coroutine(number, sleep_time):\n \
    \   print(f\"{number}: Falling asleep ...\")\n    await asyncio.sleep(sleep_time)\n\
    \    print(f\"{number}: Waking up ...\")\n\nasync def main():\n    await my_coroutine(1,\
    \ 2)\n    await my_coroutine(2, 8)\n\nasyncio.run(main())\n# 1: Falling asleep\
    \ ...\n# 1: Waking up ...\n# 2: Falling asleep ...\n# 2: Waking up ...\n```\n\n\
    `await` creates a task from a coroutine, schedules it into the event loop of the\
    \ thread, and then waits for its completion, eventually returning its result.\n\
    \nIn this modification of the last example, the coroutines run concurrently, meaning\
    \ the second coroutine is already scheduled while the first coroutine is suspended.\n\
    \n```python\nimport asyncio\n\nasync def my_coroutine(number, sleep_time):\n \
    \   print(f\"{number}: Falling asleep ...\")\n    await asyncio.sleep(sleep_time)\n\
    \    print(f\"{number}: Waking up ...\")\n\nasync def main():\n    result = await\
    \ asyncio.gather(\n        my_coroutine(1, 2),\n        my_coroutine(2, 8)\n \
    \   )\n    print(result)\n\nasyncio.run(main())\n# 1: Falling asleep ...\n# 2:\
    \ Falling asleep ...\n# 1: Waking up ...\n# 2: Waking up ...\n```\n\n`asyncio.gather`,\
    \ similar to `await`, creates tasks for every coroutine passed, schedules them\
    \ into the event loop, waits for completion, and returns their results in a list.\n\
    \nFinally, here is an example demonstrating the explicit creation of tasks:\n\n\
    ```python\nimport asyncio\n\nasync def my_coroutine(number, sleep_time):\n   \
    \ print(f\"{number}: Falling asleep ...\")\n    await asyncio.sleep(sleep_time)\n\
    \    print(f\"{number}: Waking up ...\")\n    return number\n\nasync def main():\n\
    \    task_1 = asyncio.create_task(my_coroutine(1, 3))\n    task_2 = asyncio.create_task(my_coroutine(2,\
    \ 10))\n    task_3 = asyncio.create_task(my_coroutine(3, 10))\n\n    done, pending\
    \ = await asyncio.wait(\n        [task_1, task_2, task_3],\n        return_when=asyncio.FIRST_COMPLETED\n\
    \    )\n\n    for task in done:\n        name = task.get_name()\n        result\
    \ = task.result()\n        print(f\"Done: {name}, result = {result}\")\n\n   \
    \ for task in pending:\n        print(f\"Pending: {task.get_name()}\")\n\n   \
    \ task_2.cancel()\n    task_3.cancel()\n\nasyncio.run(main())\n# 1: Falling asleep\
    \ ...\n# 2: Falling asleep ...\n# 3: Falling asleep ...\n# 1: Waking up ...\n\
    # Done: Task 1, result = 1\n# Pending: Task 3\n# Pending: Task 2\n```\n\n`asyncio.create_task`\
    \ not only creates a task but also submits it to the event loop for processing.\n\
    \n`asyncio.wait` is a coroutine function that waits until a certain condition\
    \ is fulfilled for a list of tasks. The default condition is \"all tasks completed\"\
    . In this example, the condition is fulfilled when at least one task is completed.\n"
