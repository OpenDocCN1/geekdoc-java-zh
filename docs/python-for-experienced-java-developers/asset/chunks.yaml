    \ packages）。\n\n以下是一个更复杂的项目结构。\n\n```\nmy_project/\n|- src_1/\n|..|- package_1/\n\
    |..|..|- data/\n|..|..|..|- data.json\n|..|..|..|- webpage.html\n|..|..|- sub_package/\n\
    |..|..|..|- __init__.py__\n|..|..|..|- sub_module_1\n|..|..|..|- sub_module_2\n\
    |..|..|- __init__.py__\n|..|..|- module_1\n|..|..|- module_2\n|..|..|- module_3\n\
    |..|- package_2/\n|..|..|- __init__.py__\n|..|..|- module_4\n|..|- package_3/\n\
    |..|..|- __init__.py__\n|..|..|- module_5\n|- src_2/\n|..|- package_name_spc/\n\
    |..|..|- module_name_spc\n|- src_3/\n|..|- test_package/\n|..|..|- test_module_1\n\
    |..|..|- test_module_2\n|- MANIFEST.in\n|- setup.py.\n```\n\n该项目由组织在三个不同根目录中的代码组成，其中一个目录包含多个顶层普通包，而另一个目录容纳了一个命名空间包。\n\
    \n此外，还有一个专门为测试目的设计的包，包含专门为测试定制的模块。这些测试模块应该被包含在 `sdist` 分发中，但从 wheel 包中排除。\n\n\
