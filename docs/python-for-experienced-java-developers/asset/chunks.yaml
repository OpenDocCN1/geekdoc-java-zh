    # Foreword


    Welcome to "Python for Experienced Java Developers." This book represents a unique
    experiment at the intersection of human expertise and artificial intelligence.
    With decades of experience in various programming languages and particularly with
    Java since its version 1.1, I embarked on a journey to learn and master Python
    with the assistance of `ChatGPT`, an advanced AI language model.


    When I began this project, I had no prior knowledge of the Python programming
    language. However, my extensive background in software development equipped me
    with a clear understanding of what I wanted to learn about Python. This book is
    the result of my collaboration with `ChatGPT`, crafted under my guidance and shaped
    by my expertise.


    The process of creating this book was both innovative and intensive. It started
    with `ChatGPT` generating a proposed outline for each chapter. From there, `ChatGPT`
    provided detailed suggestions for each point in the outline. My role involved
    shortening, rearranging, and refining the text, correcting and enhancing Python
    examples, running and testing every line of code provided by `ChatGPT`, and often
    creating entirely new examples. Finally, I turned to `ChatGPT` again to make final
    corrections on the wording. This iterative process ensured that while `ChatGPT`
    had the first and last word on every chapter, the content in between required
    a significant amount of my effort and insight.


    The result is the book I envisioned: a concise, focused guide that doesn’t waste
    pages on basics such as list manipulations, object orientation, or functional
    programming—concepts that every experienced Java programmer is already well-acquainted
    with. Instead, this book delves deeply into the unique features and capabilities
    that Python offers, providing a rich learning experience for seasoned developers.


    I hope that other experienced software developers will appreciate the outcome
    of this experiment as much as I do. Whether you are looking to add Python to your
    skill set or to deepen your understanding of its advanced features, I believe
    you will find this book both valuable and enjoyable.


    Enjoy your journey into Python!


    # Part I: Setting Up Your Development Environment


    ## Chapter 1: Installing Python


    Other components, such as IDEs and development tools, depend on the presence of
    Python. Therefore, installing Python first ensures that these tools have the necessary
    runtime environment.


    Here are the steps you need to follow:


    ### 1.1 Downloading Python


    *   Visit the official Python website at `python.org`.

    *   Navigate to the "Downloads" section.

    *   Choose the appropriate installer based on your operating system: Windows,
    macOS, or Linux.

    *   Select the desired Python version (`Python 3.x` is recommended for most projects,
    this book is based on `Python 3.11.8`).


    ### 1.2 Running the Installer


    *   Once the installer is downloaded, double-click to run it.

    *   Follow the prompts in the installation wizard.

    *   On Windows, ensure the option to add Python to `PATH` is selected. This allows
    Python to be accessible from the command line.

    *   On macOS and Linux, Python is typically installed by default. Ensure you are
    installing the desired version if multiple versions are available.


    ### 1.3 Verification


    *   After the installation is complete, open a terminal or command prompt.

    *   Run `python --version` to verify the installation.

    *   You should see the installed Python version displayed.


    ### 1.4 Updating Pip (Python Package Installer)


    *   `pip` is the default package manager for Python, used to install additional
    libraries and packages. Further details about packages will be provided in a later
    chapter.

    *   Run `python -m pip install --upgrade pip` to ensure you have the latest version
    of `pip` installed.


    ## Chapter 2: Choosing an IDE


    In addition to specialized Integrated Development Environments (IDEs), it is worth
    noting that popular Java IDEs like `IntelliJ IDEA` and `Eclipse` also support
    Python development. In this book, we will primarily focus on using `IntelliJ IDEA
    Community Edition` (Version 2023.3.4) for Python development.


    While `IntelliJ IDEA Community Edition` provides robust support for Python, it
    is important to recognize that there are IDEs specifically tailored for Python
    development.


    Here are some of the most popular Python IDEs, all favored by AI developers for
    their extensive features and strong Python support.


    *   `PyCharm`: Developed by JetBrains, `PyCharm` is a powerful IDE with a rich
    set of features tailored for Python development. `PyCharm` offers intelligent
    code completion, debugging tools, integration with version control systems, and
    support for popular AI libraries like `TensorFlow`, `PyTorch`, and `scikit-learn`.

    *   `Jupyter Notebook / JupyterLab`: `Jupyter Notebook` is a web-based interactive
    computing environment that allows developers to create and share documents containing
    live code, equations, visualizations, and narrative text. `Jupyter Notebook` was
    initially developed by a team of researchers led by Fernando Pérez and Brian Granger.
    They began developing `Jupyter Notebook` in 2011 as part of the `IPython` project,
    an interactive computing environment for Python. It is widely used in the AI and
    data science community for prototyping, experimentation, and collaboration. `JupyterLab`
    is an enhanced version of `Jupyter Notebook` with a more comprehensive interface
    and additional features.

    *   `Google Colab`: A free, cloud-based Jupyter notebook environment provided
    by Google. It allows developers to write and execute Python code in a browser-based
    interface, with access to powerful computing resources provided by Google’s infrastructure.

    *   `Spyder`: An IDE specifically designed for scientific computing and data analysis,
    developed by the `Spyder Project Contributors`, an open-source community of developers.
    It provides features such as an interactive console, variable explorer, debugger,
    and support for plotting libraries like `Matplotlib` and `seaborn`. `Spyder` is
    popular among AI developers for its ease of use and integration with scientific
    computing libraries.

    *   `Visual Studio Code (VS Code)`: A lightweight and versatile IDE developed
    by Microsoft. `VS Code` offers extensive customization options and support for
    Python through plugins like `Python` and `Pylance`.

    *   `Atom`: A customizable and open-source text editor developed by GitHub. It
    offers features such as syntax highlighting, code folding, and package management.
    `Atom` is popular among AI developers for its flexibility and support for plugins
    that extend its functionality for AI development.


    ## Chapter 3: Create Your First Project


    ### 3.1 Project Creation


    *   Launch `IntelliJ IDEA` and create a new project.

    *   Select `Python` as the programming language.

    *   If this is your first Python project you will see a list of available plugins.
    Select the `Python Community Edition` plugin and install it.

    *   If you have more than one Python version installed, make sure that you choose
    the right version of the Python interpreter.

    *   Eventually select the creation of a repository for your VCS, for example `GIT`,
    and leave all other parameters as they are.

    *   Press the `Create` button.


    ### 3.2 Select the Python Interpreter


    *   Navigate to `File → Project Structure → Project Settings → Project`.

    *   For `SDK`, select a `Python SDK` from the dropdown menu.

    *   Apply the changes and close the settings window.


    ### 3.3 Other Configurations

