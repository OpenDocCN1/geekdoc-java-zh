    \ CPU 核心上实现真正的并行，而不受 `GIL` 的限制。\n\n另一种克服 `GIL` 限制的方法是通过协作式多任务，这将在下一节中描述。\n\n##\
    \ 16.6 异步编程\n\n### 16.6.1 概述\n\n异步编程是一种编程范式，能够在不需要显式线程或多进程的情况下实现多个任务的并发执行。\n\n\
    `asyncio` 是一个 Python 库，通过提供管理异步任务的高级抽象来简化异步编程。\n\n它由以下组件组成：\n\n- **协程 (Coroutines)**：在线程内异步运行的特殊函数。它们使用\
    \ `async` 关键字定义，表示该函数是异步的，并且可以等待完成。协程可以启动其他协程并等待它们的结果。\n- **事件循环 (Event loop)**：协调协程的调度和执行。每个线程通常恰好有一个关联的事件循环，由事件循环调度的协程在在该线程内运行。\n\
    - **任务 (Tasks)**：代表在事件循环中执行协程的对象。任务允许你管理协程的执行并异步地等待它们的结果。\n- **执行器 (Executors)**：在单独的线程或进程中管理阻塞或\
    \ CPU 密集型任务执行的对象，允许事件循环保持响应状态。执行器通常在协程内部创建，该协程会异步地等待执行器完成并返回结果。\n\n协程是轻量级的并发单元，可以在单个线程内进行协作调度。与线程相比，它们的开销通常更低，因为它们不涉及上下文切换或操作系统级别的线程管理。\n\
    \n在执行器的帮助下，协程为 I/O 密集型或 CPU 密集型任务提供了一种绕过 `GIL` 带来的限制的方便方法。\n\n虽然 `asyncio` 为异步编程提供了许多功能，但其完整深度超出了本书的范围。不过，在接下来的章节中，你将获得一个很好的概述，从而将理解\
    \ `asyncio` 是如何工作的以及如何有效地使用它。\n\n### 16.6.2 创建和运行协程\n\n使用 `asyncio` 创建并运行一个协程非常简单。\n\
    \n这里是一个示例：\n\n```python\nimport asyncio\n\nasync def my_coroutine():\n    print(\"\
    Coroutine started\")\n    await asyncio.sleep(1)\n    print(\"Coroutine resumed\
    \ after 1 second\")\n    return 42\n\nresult = asyncio.run(my_coroutine())\nprint(result)\n\
    # Coroutine started\n# Coroutine resumed after 1 second\n# 42\n```\n\n关键字 `async\
    \ def` 将函数 `my_coroutine` 标记为协程，表示它不能被直接调用，而必须由事件循环调度执行。\n\n使用 `asyncio.run(my_coroutine())`\
    \ 启动为当前线程的事件循环的创建。然后它为 `my_coroutine` 生成一个任务，允许事件循环开始执行该任务，等待其完成，最后返回其结果。\n\n\
    请注意，虽然 `asyncio.sleep()` 会挂起协程的执行指定的持续，允许在此期间运行其他协程，但如果使用 `time.sleep()` 则会阻塞整个线程，防止事件循环在此期间处理其他协程。\n\
    \n以下示例演示了主协程启动另一个协程，等待其完成，然后启动下一个协程。\n\n```python\nimport asyncio\n\nasync def\
    \ my_coroutine(number, sleep_time):\n    print(f\"{number}: Falling asleep ...\"\
    )\n    await asyncio.sleep(sleep_time)\n    print(f\"{number}: Waking up ...\"\
    )\n\nasync def main():\n    await my_coroutine(1, 2)\n    await my_coroutine(2,\
    \ 8)\n\nasyncio.run(main())\n# 1: Falling asleep ...\n# 1: Waking up ...\n# 2:\
    \ Falling asleep ...\n# 2: Waking up ...\n```\n\n`await` 从协程创建一个任务，将其调度到线程的事件循环，然后等待其完成，最终返回其结果。\n\
    \n在在上一个示例的修改中，协程是并发运行的，这意味着当第一个协程挂起时，第二个协程已经完成调度。\n\n```python\nimport asyncio\n\
    \nasync def my_coroutine(number, sleep_time):\n    print(f\"{number}: Falling\
    \ asleep ...\")\n    await asyncio.sleep(sleep_time)\n    print(f\"{number}: Waking\
    \ up ...\")\n\nasync def main():\n    result = await asyncio.gather(\n       \
    \ my_coroutine(1, 2),\n        my_coroutine(2, 8)\n    )\n    print(result)\n\n\
    asyncio.run(main())\n# 1: Falling asleep ...\n# 2: Falling asleep ...\n# 1: Waking\
    \ up ...\n# 2: Waking up ...\n```\n\n`asyncio.gather` 与 `await` 类似，为传入每个协程创建任务，将其调度到事件循环，等待完成并返回它们的结果。\n\
    \n最后，这是一个演示显式创建任务的示例：\n\n```python\nimport asyncio\n\nasync def my_coroutine(number,\
    \ sleep_time):\n    print(f\"{number}: Falling asleep ...\")\n    await asyncio.sleep(sleep_time)\n\
    \    print(f\"{number}: Waking up ...\")\n    return number\n\nasync def main():\n\
    \    task_1 = asyncio.create_task(my_coroutine(1, 3))\n    task_2 = asyncio.create_task(my_coroutine(2,\
    \ 10))\n    task_3 = asyncio.create_task(my_coroutine(3, 10))\n\n    done, pending\
    \ = await asyncio.wait(\n        [task_1, task_2, task_3],\n        return_when=asyncio.FIRST_COMPLETED\n\
    \    )\n\n    for task in done:\n        name = task.get_name()\n        result\
    \ = task.result()\n        print(f\"Done: {name}, result = {result}\")\n\n   \
    \ for task in pending:\n        print(f\"Pending: {task.get_name()}\")\n\n   \
    \ task_2.cancel()\n    task_3.cancel()\n\nasyncio.run(main())\n# 1: Falling asleep\
    \ ...\n# 2: Falling asleep ...\n# 3: Falling asleep ...\n# 1: Waking up ...\n\
    # Done: Task 1, result = 1\n# Pending: Task 3\n# Pending: Task 2\n```\n\n`asyncio.create_task`\
    \ 不仅创建任务，还将其提交给事件循环处理。\n\n`asyncio.wait` 是一个协程函数，用于等待任务列表满足特定条件。默认条件是“所有任务已完成”。在例示例中，当至少有一个任务完成时，条件即满足了。\n\
    \n"
