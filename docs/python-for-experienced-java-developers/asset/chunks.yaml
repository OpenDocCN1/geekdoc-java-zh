    \n## 19.5.2 The `inspect` Module\n\nThe `inspect` module in Python, much like\
    \ Java’s reflection API, enables you to examine the structure and members of an\
    \ object.\n\nExplaining the complete functionality provided by this module would\
    \ be beyond the scope of this book. Instead, here are two examples demonstrating\
    \ frequently occurring tasks.\n\n### Logging Method Calls\n\nThis example shows\
    \ how to automatically add logging to every method call of an object. Automatically\
    \ wrapping methods can be generally useful when writing test code.\n\n```python\n\
    import inspect\n\ndef add_logging(obj):\n    for name, value in inspect.getmembers(\n\
    \            obj, inspect.ismethod):\n        setattr(obj, name, add_logger(value))\n\
    \ndef add_logger(meth):\n    def wrapper(*args, **kwargs):\n        print(f\"\
    *** Calling method: {meth.__name__}\")\n        return meth(*args, **kwargs)\n\
    \    return wrapper\n\nclass MyClass:\n    def __init__(self, value):\n      \
    \  self.value = value\n    def print_value(self):\n        print(f\"value = {self.value}\"\
    )\n\nmy_object = MyClass(42)\nadd_logging(my_object)\nmy_object.print_value()\n\
    # *** Calling method: print_value\n# value = 42\n```\n\nThe function `inspect.getmembers()`\
    \ retrieves all the members of an object. The object can be an instance, a class,\
    \ a module, or any other type of object in Python. A member can be a method, attribute,\
