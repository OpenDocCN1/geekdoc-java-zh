    # Conda

    `Conda` is a popular package and environment management system, commonly utilized
    within the data science community. It serves as the package manager for the Anaconda
    Python distribution.


    It provides functionality for creating and managing virtual environments, along
    with package installation and dependency management.


    # Pipenv

    `Pipenv` is a popular tool that combines package management with virtual environment
    management. It creates a `Pipfile` to manage dependencies and a `Pipfile.lock`
    to lock dependency versions.


    # Poetry

    `Poetry` is a modern dependency management tool and project manager for Python
    projects. It allows you to define project dependencies and settings in a `pyproject.toml`
    file.


    Virtual environments can be created using these tools either from the command
    line or through an integrated development environment (IDE) like `IntelliJ IDEA`.


    While there are scenarios where creating virtual environments from the command
    line may be necessary, such as when working on a remote server or when specific
    configurations are required, generally, using the IDE is the preferred approach.


    This is because IDEs streamline the process, offer visual aids, and integrate
    seamlessly with the development workflow.


    In the following, we will demonstrate how to manage virtual environments directly
    within `IntelliJ IDEA`. It’s worth noting that in `IntelliJ IDEA`, the term `SDK`
    (Software Development Kit) is often used interchangeably with Virtual Environment
    in the context of Python projects, as a virtual environment serves a similar purpose
    to an `SDK` in other languages.


    `IntelliJ IDEA` has the capability to create virtual environments internally without
    the need for any external tools to be installed.


    However, for the purposes of this demonstration, we will utilize `Conda`. `Conda`
    offers the advantage of creating environments for various Python versions without
    the necessity of pre-installing those versions on the computer.


    You can download and install `Conda` from `conda.io`.


    ## 11.2.2 Creating a Virtual Environment


    1. Navigate to `File` → `Project Structure` → `Platform Settings` → `SDKs`.


    2. Click on the `+` icon and select `Python SDK` from the dropdown menu. In the
    dialog that appears, choose `Conda Environment` and keep the selection as `New
    environment`.


    3. Specify the location for the new virtual environment. The location can be anywhere,
    but it is recommended to create a new directory within your project directory.


    4. Select the desired Python version for the virtual environment. Keep in mind
    that you can only create virtual environments for Python versions supported by
    `Anaconda`, as `Conda` will download an Anaconda Python distribution.


    5. Click `OK` to create the virtual environment.


    `Conda` will then download the selected Python interpreter and pre-install numerous
    modules so that you don’t have to install them manually later on.


    6. After creating the environment, `IntelliJ IDEA` will assign it a default name.
    You can and should rename the virtual environment to something more descriptive.


    Note that this name is only used within `IntelliJ IDEA`, so `Conda` command-line
    tools will not show this name but the directory path instead.


    ## 11.2.3 Changing a Virtual Environment


    1. Navigate to `File` → `Project Structure` → `Project Settings` → `Modules` and
    click on the `Dependencies` tab.


    2. Under `Module SDK`, select the virtual environment you want to use from the
    dropdown menu and click `OK`.


    From then on, the selected virtual environment will be used for running Python
    scripts within `IntelliJ IDEA` with standard settings.


    Note that you can also change the virtual environment in the runtime configuration.
    Each runtime configuration can run with a different virtual environment. This
    flexibility allows you to comfortably test your scripts against different Python
    versions, for example.


    ## 11.2.4 Deleting a Virtual Environment


    1. Navigate to `File` → `Project Structure` → `Platform Settings` → `SDKs`.


    2. Select the virtual environment you want to delete from the list and click on
    `-`.


    3. Navigate to the directory where the virtual environment is located.


    # Chapter 12: Using External Packages


    In Python development, much like Java, external packages are essential for extending
    the language beyond its standard library. These packages, also referred to as
    libraries or modules, are developed and maintained by the Python community, providing
    a diverse array of tools for tasks ranging from data manipulation to scientific
    computing.


    The term "package" can be somewhat misleading. Similar to Java, where dependencies
    are often managed by build tools, Python requires external packages to be explicitly
    installed, either globally or within a virtual environment, before they can be
    used. A module from an installed external package is then usable in Python just
    like a module from an internal package, as described in Chapter 10.


    The most common approach to installing external packages in Python is through
    package managers like `pip`, `Conda`, `Pipenv`, or `Poetry`, as well as built-in
    IDE tools like the `Python Packages Tool` in `IntelliJ IDEA`. These tools streamline
    the process of locating, downloading, and installing Python packages from online
    repositories.


    Alternatively, you can install external packages from their source code or pre-built
    binaries by manually downloading them from the package’s repository or website.
    Subsequently, these packages can be installed using the `setup.py` script or other
    installation mechanisms provided by the package. This method is less common than
    using package managers, as it requires more manual effort and is prone to dependency
    resolution issues. Although necessary in certain cases, it will not be discussed
    in this book.


    Instead, we will focus on the usage of `pip` and `Conda`, as they are the most
    widely used tools for managing Python packages and environments.


    ### 12.1 Command Line Package Management


    When you install Python libraries without an activated virtual environment using
    a packet manager, they are stored in the `site-packages` directory of the system-wide
    Python installation. When you have a virtual environment activated, the Python
    libraries installed using a packet manager are stored within the `site-packages`
    directory specific to that virtual environment.


    Therefore, before executing any package manager command from the command line,
    it is crucial to ensure that you are using the correct shell environment. The
    easiest way to do this is to open a terminal program on your computer system to
    install packages system-wide or to open a terminal in `IntelliJ IDEA`, which activates
    the virtual environment configured for your project.

