    After creating the package, it is advisable to conduct a quick "smoke test" to
    confirm its correct bundling and functionality.


    To do this, set up a new project with a fresh virtual environment. Install the
    newly created package by opening a terminal and executing


    pip install <package_file>


    where <package_file> refers to either the wheel or the sdist file.


    Once the package is installed in the virtual environment, you can proceed to write
