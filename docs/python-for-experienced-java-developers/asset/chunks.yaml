    ## 19.2 装饰器 (Decorators)\n\n装饰器是修改函数或方法的高阶函数。它们接受一个函数作为输入并返回修改后的版本。\n\n这里是一个示例：\n\
    \n```python\ndef log(func):\n    def wrapper(*args, **kwargs):\n        print(f\"\
    Function {func.__name__} called.\")\n        result = func(*args, **kwargs)\n\
    \        print(f\"args: {args}\")\n        print(f\"kwargs: {kwargs}\")\n    \
    \    print(f\"Return value: {result}\")\n        return result\n    return wrapper\n\
    \n@log\ndef add(a, b):\n    return a + b\n\nadd(3, 5)\n# Function add called.\n\
    # args: (3, 5)\n# kwargs: {}\n# Return value: 8\n```\n\n装饰器可以接受参数。当装饰器带有参数时，它变成一个返回另一个装饰器的函数（即装饰器）。\n\
    \n```python\ndef repeat(n):\n    def decorator(func):\n        def wrapper(*args,\
    \ **kwargs):\n            for _ in range(n):\n                result = func(*args,\
    \ **kwargs)\n            return result\n        return wrapper\n    return decorator\n\
    \n@repeat(n=3)\ndef greet(name):\n    print(f\"Hello {name}!\")\n\ngreet(\"Alice\"\
    )\n# Hello Alice!\n# Hello Alice!\n# Hello Alice!\n```\n\n除了函数装饰器，还有类装饰器。这些函数接受类作为输入，并返回该类的修改或增强版本。\n\
    \n这里是一个示例：\n\n```python\ndef add_x(cls):\n    def init(self, value):\n       \
    \ self.x = value\n    def print_x(self):\n        print(self.x)\n    cls.__init__\
    \ = init\n    cls.print_x = print_x\n    return cls\n\n@add_x\nclass MyClass:\n\
    \    pass\n\nobj = MyClass(42)\nobj.print_x()  # 42\n```\n\n## 19.3 特殊方法 (Special\
    \ Methods)\n\nPython 提供了一系列丰富的特殊方法，也称为“魔法方法”或“双下方法”（dunder methods），允许开发者自定义对象和类的行为。\n\
    \n这些方法在 Python 解释器响应涉及对象的特定操作或表达式时被调用。通过实现这些方法，你可以为你的类和对象定义定制的行为。\n\n由于空间限制，本书仅提供了有限数量的特殊方法示例，展示了它们在自定义对象行为方面的灵活性。\n\
    \n### 19.3.1 算术运算 (Arithmetic Operations)\n\n"
- fmt: "\nFunctions like `__add__`, `__sub__`, `__mul__`, and others help objects\
    \ perform basic math operations like addition, subtraction, and multiplication.\
    \ Similarly, methods such as `__iadd__` (for `+=`), `__isub__` (for `-=`) and\
    \ `__imul__` (for `*=`) enable objects to support in-place operations.\n\nHere\
    \ is an example:\n\n```python\nclass Vector:\n    def __init__(self, *args):\n\
    \        self.__vector = args\n\n    def __add__(self, other):\n        return\
    \ Vector(*self.__add_tuples(other))\n\n    def __iadd__(self, other):\n      \
    \  self.__vector = self.__add_tuples(other)\n        return self\n\n    def __str__(self):\n\
    \        return str(self.__vector)\n\n    def __add_tuples(self, other):\n   \
    \     if isinstance(other, Vector):\n            x = self.__vector\n         \
    \   y = other.__vector\n            if len(x) == len(y):\n                addition\
    \ = tuple(\n                    x[i] + y[i]\n                    for i in range(len(x))\n\
    \                )\n                return addition\n            else:\n     \
    \           raise ValueError(\"Not same length\")\n        else:\n           \
    \ raise ValueError(\"Not a vector\")\n\nv1 = Vector(1, 2, 3)\nv2 = Vector(4, 5,\
