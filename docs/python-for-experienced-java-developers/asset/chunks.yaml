    ## Chapter 12


    Using External Packages


    In Python development, much like in Java, external packages are essential for
    extending the language’s functionality beyond its standard library.


    These packages, also referred to as libraries or modules, are developed and maintained
    by the Python community, providing a diverse array of tools and utilities for
    tasks ranging from data manipulation and scientific computing to web development
    and beyond.


    The term "package" can be somewhat misleading. Similar to a Java JAR file, an
    external package in Python is an archive that comprises Python code organized
    into packages and modules, along with other file types such as JSON, HTML, LICENSE,
    README, and metadata like version number, package dependencies, and author name.


    It is important to note that the name of a package is a piece of metadata.


    Consequently, an external package can contain more than one Python package, although
    this is uncommon. Additionally, the name of the external package might differ
    from the name of the contained Python package, which is a frequent occurrence.


    For instance, consider the Pillow package, which is a fork of the Python Image
    Library but is named differently from the top-level package PIL it contains.


    In contrast to Java, where external dependencies are often managed automatically
    by build tools like Gradle during the compilation process, Python requires external
    packages to be explicitly installed into the environment, either globally or within
    a virtual environment, before they can be used.


    A module from an installed external package is then usable in Python code just
    like a module from an internal package, as described in Chapter [10](#part0015.xhtml_a26N):
    [Modules and Packages](#part0015.xhtml_a26N).


    The most common approach to installing external packages in Python is through
    package managers like pip, Conda, Pipenv, or Poetry, as well as built-in IDE tools
    like the Python Packages Tool in IntelliJ IDEA. These tools streamline the process
    of locating, downloading, and installing Python packages from online repositories.


    Alternatively, you can install external packages from their source code or pre-built
    binaries by manually downloading them from the package’s repository or website.
    Subsequently, these packages can be installed using the setup.py script or other
    installation mechanisms provided by the package.


    This method is less common than using package managers, as it requires more manual
    effort and is prone to dependency resolution issues. Although necessary in certain
    cases, it will not be discussed in this book.


    Instead, we will focus on the usage of pip and Conda, as they are the most widely
    used tools for managing Python packages and environments.


    We will first explain how to use the package managers from a command line in IntelliJ
    IDEA’s Python terminal as this is a good way to understand the principles of package
    management and then show how to do the same things using IntelliJ IDEA’s Python
    Packages Tool.


    ### 12.1 Command Line Package Management


    When you install Python libraries without an activated virtual environment using
    a packet manager, they are stored in the site-packages directory of the system-wide
    Python installation.


    When you have a virtual environment activated, the Python libraries installed
    using a packet manager are stored within the site-packages directory specific
    to that virtual environment.


    Therefore, before executing any package manager command from the command line,
    it is crucial to ensure that you are using the correct shell environment.


    The easiest way to do this is to open a terminal program on your computer system
    to install packages system-wide or to open a terminal in IntelliJ IDEA, which
    activates the virtual environment configured for your project.'
