    strings or convert integers to floating-point numbers.


    bool(): Converts a given value to a boolean. It returns True if the value is considered
    "truthy" and False otherwise. For example, bool(0) returns False, while bool(1)
    returns True.


    str(): Converts a given value to a string. It can convert numbers, booleans, or
    other data types to their string representations. This is equivalent to the toString()
    function in Java.


    ### 4.7 Top-Level Code


    In contrast to Java, which requires all code to be encapsulated within classes
    and methods, Python allows top-level code to exist outside of any functions or
    classes. This top-level code is executed immediately when the module is imported
    or run as a script (Modules and how to import them, as well as scripts, will be
    discussed in Chapter [10](#part0015.xhtml_a26N): [Modules and Packages](#part0015.xhtml_a26N).
    For now, you can think of it as a process similar to importing packages in Java,
    and running a script is like executing a main method in a Java program.).


    Top-level code in Python is executed in the following scenarios:


    *   When the module containing the code is run as a standalone script.


    *   During the import process, when the module is imported and cached into memory.


    Here is an example to illustrate this concept (The exact meaning of the __name__
    attribute will be discussed in Chapter [10](#part0015.xhtml_a26N): [Modules and
    Packages](#part0015.xhtml_a26N).):


    # example.py


    print("This is top-level code")


    def my_function():


        print("This is a function")


    if __name__ == "__main__":


        print("This script is being run directly")


        my_function()


    else:


        print("This module is being imported")


    When you run example.py as a standalone script, the output will be:


    This is top-level code


    This script is being run directly


    This is a function


    When you run another script that imports example.py like this


    import example


    ...


    the output will be:


    This is top-level code


    This module is being imported


    ## Chapter 5


    Object-Oriented Programming


    ### 5.1 Classes and Objects


    In Python, similar to Java, a class defines the attributes (data) and methods
    (behavior) that all objects of that class will have.


    However, there are several key differences compared to Java:


    Syntax: Instead of braces {}, Python uses indentations to denote the scope of
    classes.


    Constructor: In Python, there is only one constructor method named __init__()
    that is used to initialize object attributes. To achieve functionality similar
    to having multiple constructors in Java, you can use default parameter values
    and variable-length argument lists.


    Access Modifiers: While Python does not provide explicit access modifiers like
    Java (public, private, protected), it does offer conventions such as single (_)
    and double (__) underscore prefixes to indicate visibility. These conventions
    serve a similar purpose to access modifiers in Java and will be discussed in a
    later section.


    Method Overloading: Python does not support method overloading based on different
    parameter types. Instead, you can utilize default parameter values and conditional
    logic within the method to achieve similar functionality.


    Reference to Current Object: In Python, unlike Java, there is no this keyword.
    Instead, the constructor and every method within a class need to have at least
    one parameter, conventionally named self. Python automatically passes the object
    instance as the first argument when you call a method on an object.


    Object Creation: In Python, as in Java, objects are created using the class name
    followed by the constructor parameters enclosed in parentheses.


    Garbage Collection: Similar to the Java Virtual Machine (JVM), the Python interpreter
    utilizes a reference counting mechanism along with a cycle detection algorithm
    to manage memory.


    Null reference: Python’s None reference is equivalent to null in Java.


    object class: As in Java, in Python, all classes ultimately inherit from a built-in
    class called object. This class provides default implementations for a variety
    of special methods, often referred to as dunder methods (double underscore methods).
    These dunder methods allow objects to interact with built-in language features,
    such as __eq__ for the equality operator, __str__ for the str() function, and
    __init__ for object initialization.


    Equality Operators: In Python, similar to Java, there are two equality operators
    for objects.


    The == operator checks for equality of values, comparing the contents of two objects.
    On the other hand, the is operator checks for identity, determining whether two
    variables reference the exact same object in memory.


    In Python the == operator invokes the __eq__() method, which by default compares
    values like the is operator. However, the behavior of __eq__() can be customized
    by overriding it, as is often done for many standard objects like numbers, strings,
    lists or sets.


    class Pair:


        x = 0


        y = 0


        def __init__(self, x=0, y=0):


            self.x = x


            self.y = y


        def print_xy(self):


            print(f"x = {self.x} y = {self.y}")


        def __eq__(self, other):


            if type(other).__name__ == "Pair":


                return (self.x == other.x and


                        self.y == other.y)


            else:


                return False


    obj_1 = None


    print(obj_1 is None)  # True


    obj_1 = Pair(10)


    obj_1.print_xy()  # x = 10 y = 0


    obj_2 = Pair(10, 0)


    obj_3 = obj_1


    print(obj_2 == obj_1)  # True


    print(obj_2 is obj_1)  # False


    print(obj_3 is obj_1)  # True


    print(obj_1 == 10)  # False


    In contrast to Java, in Python attributes need to be added by any method at runtime,
    typically within an __init__ method, simply by assigning them a value, as demonstrated
    by the self.x and self.y attributes in the previous example. These dynamically
    created attributes are referred to as instance variables because each instance
    of a class can have a distinct set of attributes.'
