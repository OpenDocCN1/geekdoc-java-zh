    \ 等工具，此处将不再进行详细介绍。\n\n# 第四部分：高级 Python 技术\n\n## 第 15 章：编写 Python 测试代码\n\n在 Python\
    \ 最流行的测试框架中，有两个框架脱颖而出：`unittest` 和 `pytest`。\n\n`unittest` 是 Python 内置的测试框架，灵感源自\
    \ `xUnit` 系列测试框架。它有时被称为 `PyUnit`，并与 Java 的 `JUnit` 具有相似之处。由于包含在每个 Python 分发版中，`unittest`\
    \ 即可获取并被广泛采用，特别是在那些优先考虑标准化和兼容性的项目中。\n\n另一方面，`pytest` 是一个第三方测试框架，以其简单、灵活和强大的功能而闻名。它提供了高级能力，如固件（fixtures）、参数化测试和广泛的插件支持，能够实现彻底的自定义以及与其他工具和库的无缝集成。\n\
    \n在本章中，我们将重点关注 `unittest`。理解 `unittest` 为掌握其他测试框架（包括 `pytest`）打下坚实的基础。\n\n###\
    \ 15.1 测试用例类的结构\n\n在 `unittest` 中，测试用例类继承自 `unittest.TestCase`。该基类提供了多种断言方法用于验证预期的结果。\n\
    \n以下是一个测试用例类的基本示例：\n\n```python\nimport unittest\n\nclass MyTestCase(unittest.TestCase):\n\
    \    def test_addition(self):\n        result = 2 + 2\n        self.assertEqual(result,\
    \ 4)\n\n    def test_check_positive_number(self):\n        result = 5\n      \
    \  self.assertTrue(result > 0)\n\n    def test_division_by_zero(self):\n     \
    \   with (self.assertRaises(ZeroDivisionError)):\n            result = 5 / 0\n\
    ```\n\n在单个模块中定义多个测试用例类也是可以的。\n\n与 `JUnit` 不同，`unittest` 依赖命名约定而非装饰器来识别方法是否为测试用例。在\
    \ `unittest` 中，任何以 `test` 开头的方法都会被视为测试函数，而任何其他方法都被视为辅助函数。\n\n这种命名约定也适用于包内模块的文件名；如果不遵守这一约定，可能会导致在运行整个包内的所有测试时，这些模块未被识别为包含测试。\n\
    \n### 15.2 运行测试用例\n\n在 IntelliJ IDEA 中运行 Python 测试用例与运行 `JUnit` 测试用例类似。你可以使用以下方法运行特定的测试模块或整个测试包目录：\n\
    \n- 在项目窗口中右键点击测试模块或测试包目录，并在右键菜单中选择 `Run Python Tests in...`。\n- 点击编辑器窗口中测试用例或测试类旁边的行槽图标（gutter\
    \ icon）。\n\n测试运行的结果将类似于 `JUnit` 测试运行，显示在 `Run` 窗口中，该窗口通常位于屏幕底部。\n\n或者，你也可以通过终端从命令行执行测试。\n\
    \n要运行特定模块的测试，输入：\n\n```\npython -m unittest <module_name>\n```\n\n要运行包目录内的所有测试，使用以下命令：\n\
    \n```\npython -m unittest discover -s <path to directory>\n```\n\n`unittest` 提供了几个命令行选项来定制测试执行过程。\n\
    \n例如，使用 `-v` 可以增加命令输出的详细程度，这对于确定失败原因特别有用。此外，你可以使用 `--help` 选项来列出所有可用选项。\n\n请注意，`unittest`\
    \ 测试运行器的发现机制只能处理顶层命名包，会忽略所有子包，除非它们是普通包。\n\n### 15.3 测试组织\n\n与 Java 类似，Python 中被认为良好的实践是将测试代码与相应的代码紧密集成，但放在独立的目录中。这意味着按照应用程序源代码的结构并行组织测试模块和包。\n\
    \n例如，如果你在代码包 `utility` 中有一个模块 `calculator.py`，你可能会创建一个对应的测试包 `test_utility`，其中包含一个模块\
    \ `test_calculator.py`。\n\n在 `unittest` 中，为了避免代码重复，你拥有类似于 `JUnit` 中的固件（fixtures）。这些固件是\
    \ `TestCase` 类的方法，你可以在测试类中对其进行覆盖：\n\n`setUp()` 方法在测试用例类中的每个测试方法之前调用，用于设置测试所需的任何资源或状态。相反，`tearDown()`\
    \ 方法在每个测试方法之后调用，用于清理测试期间分配的资源。\n\n除了每个测试的设置和拆析外，`unittest` 还提供了类级设置和拆析方法：`setUpClass()`\
    \ 和 `tearDownClass()`。这些方法在整个测试用例类中调用一次，允许你执行多个测试方法共享的设置和清理操作。\n\n除了定义测试用例外，`unittest`\
    \ 模块还提供了装饰器，允许你修改单个测试方法或整个测试类的行为。这些装饰器类似于 Java 中 `JUnit` 对应的注解。\n\n```python\n\
    @unittest.skip(\"<跳过的原因>\")\n```\n\n此装饰器将标记测试方法或测试类为已跳过。应用后，被装饰的方法或类中的代码将不会执行，测试用例将在结果列表中被标记为忽略。\n\
    \n你可以提供可选的跳过原因，该原因将显示在测试输出中。\n\n```python\n@unittest.expectedFailure\n```\n"
