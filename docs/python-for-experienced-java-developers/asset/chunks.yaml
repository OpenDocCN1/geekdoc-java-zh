    but this aspect will not be covered here.


    Also, note that the post() function does not automatically close the files. This
    responsibility falls on the calling code, which is managed here using a with statement.


    To conclude this section, it is important to note that all the functionalities
    described for the get() function, such as parsing JSON responses, also apply to
    the post() function.


    ### 17.7 Miscellaneous Topics


    In this final section of the chapter, we will cover various miscellaneous topics
    related to HTTP requests.


    #### 17.7.1 Other HTTP Methods


    For each of the HTTP methods DELETE, HEAD, OPTIONS, PATCH, PUT, the requests package
    has a corresponding function that can be used in the same way as the already described
    functions get() and post().


    #### 17.7.2 SSL Certificates


    If you want to use locally stored SSL certificates with the requests library,
    you can pass the path to the certificate file as the value of the cert parameter
    when making the request. This parameter expects a string representing the path
    to the certificate file.


    #### 17.7.3 Authentication


    The requests package offers extensive support for request authentication. However,
    providing an in-depth explanation of all its capabilities is beyond the scope
    of this book.


    Nonetheless, here is a brief overview of the authentication possibilities:


    To perform simple authentication in requests, you can utilize the auth parameter,
    which accepts a tuple containing the username and password.


    You can enable Digest Authentication by passing the auth parameter with an instance
    of the HTTPDigestAuth class initialized with a username and password. This class
    is available in the requests.auth module.


    OAuth2 is not directly supported by the requests package. However, there are other
    packages that provide OAuth2 support. For example, requests_oauthlib is a specific
    package that integrates OAuth support into the requests package, enabling developers
    to perform OAuth2 authentication using the familiar requests API. This package
    builds upon OAuthLib, handling OAuth-related tasks within the context of requests.


    #### 17.7.4 Coroutine Support


    If you want to make HTTP requests within coroutines, it is crucial to perform
    the requests asynchronously to avoid blocking the event loop.


    While using a thread or process executor is one approach, a more appropriate solution
    is to use asynchronous HTTP client libraries like aiohttp, which are designed
    for asynchronous programming and integrate seamlessly with asyncio.


    Describing the functionality of aiohttp is beyond the scope of this book, but
    here is a short example that shows the basic functionality.


    Please note that it uses async with statements, which ensure that the session
    and response created by the coroutine are automatically closed at the end.


    import aiohttp


    import asyncio


    url = "https://reqres.in/api/users/1"


    async def fetch_data():


        async with aiohttp.ClientSession() as session:


            async with session.get(url) as response:


                return await response.text()


    async def main():


        data = await fetch_data()


        print(data)


    asyncio.run(main())


    # {"data":{"id":1, ...


    ## Chapter 18


    Type Hinting


    In Python, type hinting is a technique used to annotate code with information
    about the expected types of variables, function parameters, and return values.
    While Python is a dynamically typed language, meaning that variables do not have
    fixed types, type hinting allows developers to provide hints about the intended
    types of data used in their programs.


    Using type hinting in Python is optional, but it can be beneficial in projects
    of all sizes, especially in large and complex codebases.


    For instance, integrated development environments like IntelliJ IDEA offer seamless
    on-the-fly checks for type hint violations as code is being written. This immediate
    feedback loop aids in maintaining adherence to type hints, enhancing code quality
    and reliability.


    Moreover, tools such as MyPy, though not explored within this book, facilitate
    static analysis of program code, diligently detecting deviations from specified
    type hints.


    ### 18.1 Basic Type Hinting


    Type hinting in Python does use a different syntax compared to Java declarations
    but shares similarities. In Python, type hints are specified using : to denote
    types and -> to indicate return types in function signatures.


    Python supports various types and annotations, including built-in types such as
    int, float, str, bool, as well as more complex types like lists, tuples, dictionaries,
    and custom classes.


    Here is an example:


    from typing import List, Tuple, Dict, Any


    def add(a: int, b: int) -> int:


        return a + b


    def create_tuple() -> Tuple[str, int]:


        name: str = "John"


        age: int = 30


        return name, age


    def to_string(data: List[Any]) -> List[str]:


        return [str(x) for x in data]


    def to_dict(*data: int) -> Dict[str, int]:


        result: Dict[str, Any] = {}


        for i, num in enumerate(data):


            result[f"#{i}"] = num


        return result


    def print_kw_args(**kwargs: float):


        for key in kwargs:


            print(f"{key}: {kwargs[key]}")


    class Point:


        def __init__(self, x: float, y: float):


            self.x: float = x


            self.y: float = y


    my_int: int = 5


    my_float: float = 3.14


    my_string: str = "Hello"


    is_valid: bool = True


    my_point: Point = Point(2.5, 4.7)


    addition: int = add(3, 4)


    my_list: List[str] = to_string(


        [42, "Hello World", True])


    my_dict: Dict[str, int] = to_dict(1, 2, 3)


    my_tuple: Tuple[str, int] = create_tuple()


    print(addition)  # 7


    print(my_list)  # [’42’, ’Hello World’, ’True’]


    print(my_dict)  # {’#0’: 1, ’#1’: 2, ’#2’: 3}


    print(my_tuple)  # (’John’, 30)


    print_kw_args(x=1.1, y=2.2, z=3.3)


    # x: 1.1


    # y: 2.2


    # z: 3.3


    Type aliases, usually written in CamelCase, provide descriptive names for complex
    types or combinations of types, thereby improving code readability.


    from typing import List, Tuple


    FirstName = str


    LastName = str


    UserName = Tuple[FirstName, LastName]


    def print_first_names(*names: UserName):


        for name in names:


            print(name[0])


    print_first_names(("John", "Doe"), ("Jane", "Doe"))


    # John


    # Jane


    ### 18.2 Advanced Type Hinting


    #### 18.2.1 Union Types


    Union types allow you to specify that a variable can accept values of multiple
    types. This is useful when a variable or function parameter can have different
    types under different circumstances.


    Union types are either expressed using the Union type constructor from the typing
    module or by using parentheses.


    from typing import Union


    def square_root_1(


            x: Union[int, float]


    ) -> float:


        return x ** 0.5


    def square_root_2(


            x: (int, float)


    ) -> float:


        return x ** 0.5'
