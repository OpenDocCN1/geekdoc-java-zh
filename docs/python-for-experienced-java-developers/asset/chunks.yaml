    ```\n\nIf necessary, you can create an immutable set using the `frozenset()` function,\
    \ which converts a normal (mutable) set into an immutable set, preventing any\
    \ further modifications.\n\n```python\nmy_set = {1, 2, 3, 4}\n\nfrozen_set = frozenset(my_set)\n\
    \n# This statement raises an AttributeError\nfrozen_set.add(5)\n```\n\n### 6.6\
    \ Equality\n\nIn Python, equality for lists, tuples, dictionaries, and sets is\
    \ based on their contents:\n\n- Lists and tuples are considered equal if they\
    \ contain the same elements in the same order.\n- Dictionaries are considered\
    \ equal if they have the same key-value pairs.\n- Sets are considered equal if\
