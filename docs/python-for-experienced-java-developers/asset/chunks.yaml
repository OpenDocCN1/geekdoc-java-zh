    of package_name_spc, along with its subpackages, should be found in the directory
    src_2/package_name_sp.


    The package_data parameter is used to specify additional files or patterns to
    include in the distribution package alongside Python modules.


    These files can include data files, configuration files, templates, and more.
    The parameter accepts a dictionary where the keys are package names, and the values
    are lists of file patterns or file paths relative to each package directory.


    The install_requires parameter is utilized to specify the dependencies, namely
    the packages required for your package to operate correctly. It accepts a list
    containing strings formatted similarly to the lines in a requirements.txt file.


    The statement recursive-include src * in the MANIFEST.in file instructs the packaging
    tool to recursively include all files and directories within the src directory
    when creating the distribution package.


    #### 14.2.2 Building Packages


    Once you have created the setup.py and, optionally, the MANIFEST.in file, you
    are ready to generate the distribution archives.


    In IntelliJ IDEA, you can achieve this by selecting Run setup.py Task... from
    the Tools menu.


    However, there are limitations to this approach: The setup.py file must be located
    in the top-level project directory, you can only create one distribution archive
    at a time, and the archive is generated by directly calling setup.py, which is
    discouraged by the developers of setuptools.


    A more robust solution is to use the build package, distributed by the Python
    Packaging Authority (PyPA). This package is available on both PyPI and the Anaconda
    repository and can be installed using standard tools, as described in Chapter
    [10](#part0015.xhtml_a26N): [Modules and Packages](#part0015.xhtml_a26N).


    The benefit of using build is that it creates the package in an isolated environment,
    generating both an sdist and a wheel archive with just one command.


    To do this, open a Python shell, navigate to the directory containing the setup.py
    file, and execute the following command:


    python -m build


    This command will create a directory named dist in the current directory, containing
    two files: an sdist file with a .tar.gz extension and a wheel file with a .whl
    extension. These files are then ready for testing and distribution.'
