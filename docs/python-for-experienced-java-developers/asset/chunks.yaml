    # 前言


    欢迎阅读《面向资深 Java 开发者的 Python》。这本书代表了人类专业知识与人工智能交叉领域的一次独特实验。凭借在各种编程语言中数十年的经验，特别是自
    Java 1.1 版本以来的经验，我在 `ChatGPT`（一种先进的 AI 语言模型）的帮助下，开启了学习并掌握 Python 的旅程。


    当我开始这个项目时，我对 Python 编程语言一无所知。然而，我在软件开发领域的深厚背景让我清楚自己想要学习 Python 的哪些内容。这本书是我与 `ChatGPT`
    协作的成果，在我的指导下创作，并由我的专业知识进行塑造。


    这本书的过程既具有创新性又具有高强度。它始于 `ChatGPT` 为每一章生成建议的大纲。随后，`ChatGPT` 为大纲中的每个点提供了详细的建议。我的角色包括缩减、重新排列和精炼文本，纠正并增强
    Python 示例，运行并测试 `ChatGPT` 提供的每一行代码，并且经常创建全新的示例。最后，我再次转向 `ChatGPT` 对措辞进行最后的修正。这种迭代过程确保了，虽然
    `ChatGPT` 在每一章中拥有最终发言权和最终定稿权，但中间的内容需要我投入大量的努力和见解。


    结果就是我构想中的这本书：一本简洁、重点出的指南，它没有在列表操作、面向对象或函数式编程等基础知识上浪费篇幅——这些概念是每个资深 Java 程序员已经非常熟悉的。相反，这本书深入探讨了
    Python 提供的独特特性和功能，为经验开发者提供了丰富的学习体验。


    我希望其他资深软件开发者能像我一样欣赏这次实验的结果。无论你是想将 Python 添加到你的技能树中，还是加深对其高级特性的理解，我相信你会发现这本书既有价值又有趣。


    祝你的 Python 之之旅愉快！


    # 第一部分：搭建你的开发环境


    ## 第一章：安装 Python


    其他组件（如 IDE 和开发工具）依赖于 Python 的存在。因此，首先安装 Python 可以确保这些工具拥有必要的运行时环境。


    以下是你需要遵循的步骤：


    ### 1.1 下载 Python


    *   访问 Python 官方网站 `python.org`。

    *   导航到“Downloads（下载）”部分。

    *   根据你的操作系统（Windows、macOS 或 Linux）选择合适的安装程序。

    *   选择所需的 Python 版本（大多数项目建议使用 `Python 3.x`，本书基于 `Python 3.11.8`）。


    ### 1.2 运行安装程序


    *   下载安装程序后，双击运行。

    *   按照安装向导中的提示操作。

    *   在 Windows 上，确保勾选“Add Python to PATH（将 Python 添加到路径）”选项。这允许从命令行访问 Python。

    *   在 macOS 和 Linux 上，Python 通常默认安装。如果存在多个版本，请确保你安装的是所需的版本。


    ### 1.3 验证


    *   安装完成后，打开终端或命令提示符。

    *   运行 `python --version` 来验证安装。

    *   你应该能看到显示的已安装的 Python 版本。


    ### 1.4 更新 Pip（Python 包安装器）


    *   `pip` 是 Python 默认的包管理器，用于安装额外的库和包。关于包的更多细节将在后续章节提供。

    *   运行 `python -m pip install --upgrade pip` 以确保你安装了最新版本的 `pip`。


    ## 第二章：选择 IDE


    除了专门的集成开发环境（IDE）之外，值得注意的是，如 `IntelliJ IDEA` 和 `Eclipse` 等流行的 Java IDE 也支持 Python
    开发。在书中，我们将主要关注使用 `IntelliJ IDEA Community Edition`（版本 2023.3.4）进行 Python 开发。


    虽然 `IntelliJ IDEA Community Edition` 为 Python 提供了强力支持，但重要的是要意识到有专门为 Python 开发定制的
    IDE。


    以下是一些流行的 Python IDE，它们都因其丰富的功能对 Python 的强大支持而受到 AI 开发者的喜爱。


    *   `PyCharm`：由 JetBrains 开发，`PyCharm` 是一个强大的 IDE，拥有一套为 Python 开发定制的丰富功能。`PyCharm`
    提供智能代码补全、调试工具、与版本控制系统的集成，并支持 `TensorFlow`、`PyTorch` 和 `scikit-learn` 等流行的 AI 库。

    *   `Jupyter Notebook / JupyterLab`：`Jupyter Notebook` 是一个基于 Web 的交互式计算环境，允许开发者创建和共享包含实时代码、方程、可视化和叙述文本的文档。`Jupyter
    Notebook` 最初由 Fernando Pérez 和 Brian Granger 领导的研究团队开发。他们于 2011 年作为 `IPython`
    项目（一个 Python 交互式计算环境）的一部分开始开发 `Jupyter Notebook`。它广泛应用于 AI 和数据科学社区的原型设计、实验和协作。`JupyterLab`
    是 `Jupyter Notebook` 的增强版本，具有更全面的界面和功能。

    *   `Google Colab`：Google 提供的免费云端 notebook 环境。允许开发者在浏览器界面中编写和执行 Python 代码，并访问
    Google 基础设施提供的强大计算资源。

    *   `Spyder`：一个专为科学计算和数据分析设计的 IDE，由 `Spyder Project Contributors`（一个开源开发者社区）开发。它提供了交互式控制台、变量查看器、调试器以及对
    `Matplotlib` 和 `seaborn` 等绘图库的支持。`Spyder` 因其易用性以及与科学计算库的集成而深受 AI 开发者的喜爱。

    *   `Visual Studio Code (VS Code)`：由微软开发的轻量级且多功能的 IDE。`VS Code` 通过 `Python` 和
    `Pylance` 等插件提供广泛的自定义选项和 Python 支持。

    *   `Atom`：由 GitHub 开发的可定制文本编辑器。提供语法高亮、代码折叠和包管理功能。`Atom` 因其灵活性以及扩展 AI 开发功能的插件支持而深受
    AI 开发者的喜爱。


    ## 第三章：创建你的第一个项目


    ### 3.1 创建项目


    *   启动 `IntelliJ IDEA` 并创建一个项目。

    *   选择 `Python` 作为编程语言。

    *   如果这是你的第一个 Python 项目，将看到可用插件列表。选择 `Python Community Edition` 插件并安装。

    *   如果你安装了多个 Python 版本，请确保选择了正确的 Python 解释器版本。

    *   最终为你的 VCS 创建仓库（例如 `GIT`），并保持其他参数不变。

    *   点击 `Create` 按钮。


    ### 3.2 选择 Python 解释器


    *   导航到 `File → Project Structure → Project Settings → Project`。

    *   对于 `SDK`，从下拉菜单中选择一个 `Python SDK`。

    *   应用更改并关闭设置窗口。


    ### 3.3 其他配置


