    \n当发生未处理的异常时，回溯默认会打印到控制台。详细解释回溯的结构超出了本书的范围。\n\n`__context`：当异常在处理另一个异常的上下文中发生时，Python\
    \ 解释器会自动设置此属性。它通常包含发生当前异常时正在被处理的异常对象。\n\n这种情况的一个示例是：在处理不同异常的 `try - except` 语句的\
    \ `except` 块抛出一个异常。\n\n`__cause`：此属性通常使用 `raise` 语句中的 `from` 关键字手动设置，下文将进行解释。\n\
    \n## 7.2 异常处理\n\n虽然 Java 和 Python 的异常处理语法可能有所不同，但基本原理是相似。异常会沿着调用栈向上传播，直到被适当的 `try\
    \ - except` 块捕获，或者传播到程序顶层导致程序终止。\n\n然而，一个重要的区别是 Python 没有像 Java 那样的受检异常（checked\
    \ exceptions）的概念。在 Python 中，所有异常都被视为未检异常（unchecked），这意味着你不需要在方法签名中声明它们。\n\n这是一个完整的示例。\n\
    \n```python\ndef divide_numbers(x, y):\n    try:\n        result = x / y\n   \
    \ except ZeroDivisionError:\n        print(\"Zero Division\")\n    except Exception\
    \ as e:\n        # 所有其他异常，\n        # 'as' 是可选的，并将异常\n        # 绑定到变量\n      \
    \  print(\"Exception:\", e)\n    else:\n        # 如果没有发生错误则执行\n        print(\"\
    Result:\", result)\n    finally:\n        # 始终执行\n        print(\"Finished\")\n\
    \ndivide_numbers(10, 2)\n# Result: 5.0\n# Finished\n\ndivide_numbers(10, 0)\n\
    # Zero Division\n# Finished\n\ndivide_numbers(10, \"2\")\n# Exception: unsupported\
    \ operand type(s) for /: ...\n# Finished\n```\n\n## 7.3 异常链\n\n异常链（Exception chains），也称为异常嵌套或链，指的是一个异常作为另一个异常的原因与之关联的概念。\n\
    \n这通常发生在处理另一个异常的过程中抛出一个异常时。\n\n如前所述，当异常在处理另一个异常的上下文中发生时，Python 会自动设置异常的 `__context__`\
    \ 属性。\n\n此外，你可以使用 `raise ... from ...` 语句显式地建立异常之间的因果关系，这会设置抛出异常的 `__cause__`\
    \ 属性。\n\n```python\ndef divide(x, y):\n    try:\n        return x / y\n    except\
    \ ZeroDivisionError:\n        divisor_ex = ValueError(\"Divisor is zero.\")\n\
    \        cause = AttributeError(\"x={x}, y={y}\")\n        raise divisor_ex from\
    \ cause\n\ntry:\n    divide(1, 0)\nexcept Exception as ex:\n    print(f\"ex: {type(ex)}\"\
    )\n    print(f\"__cause__: {type(ex.__cause__)}\")\n    print(f\"__context__:\
    \ {type(ex.__context__)}\")\n# ex: <class 'ValueError'>\n# __cause__: <class 'AttributeError'>\n\
    # __context__: <class 'ZeroDivisionError'>\n```\n\n## 7.4 自定义异常\n\n在 Python 中，类似于\
    \ Java，你可以通过继承 `Exception` 类来创建自定义异常。\n\n```python\nclass CustomError(Exception):\n\
    \    def __init__(self, message):\n        super().__init__(message)\n       \
    \ self.error_code = 500\n\ndef failing_operation():\n    raise CustomError(\"\
    Function failed.\")\n\ntry:\n    failing_operation()\nexcept CustomError as e:\n\
    \    print(e)  # Function failed.\n    print(e.error_code)  # 500\n```\n\n与 Java\
    \ 相比，Java 类的构造函数通常接受标准参数，而 Python 在定义异常方面提供了灵活性。\n\n## 8 基本文件操作\n\n本章涵盖了文件的打开、读取和写入。\n\
    \n### 8.1 打开与关闭\n\n打开和关闭文件与 Java Go。打开文件使用 `open()`。完成后，使用 `close()` 资源。\n\n`open()`\
    \ 的第一个参数是路径。第二个参数是模式（例如 `r`、`w`、`a`、`rb`）。Python 的 `with` 语句确保即使发生异常，文件也能被正确关闭。\n\
    \n### 8.2 读取文件\n\n在 Python 中读取文件非常简单。你可以使用以下几种方法：\n- `read()`：读取整个文件。\n- `readline()`：读取单行。\n\
    - `readlines()`：将所有行读取到列表中。\n\n最后，Python 文件对象可以作为迭代器，直接在循环中遍历文件中的行。\n\n### 8.3\
    \ 写入文件\n\n`write()` 方法允许将数据直接写入文件。你可以用它写入字符串和字节。任何其他数据类型在写入之前必须进行转换。\n\n文件必须以写入模式\
