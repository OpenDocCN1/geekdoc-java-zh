    \ 4.6 数据类型转换函数\n\nPython 提供了一系列内置函数，方便用于各种常用操作。\n\n首先，这里有一些用于数据类型转换的内置函数：\n\n\
    - `int()`：将给定的值转换为整数。它可以解析数值字符串，或通过删除小数部分而不四舍五入将浮点数转换为整数。\n- `float()`：将给定的值转换为浮点数。它可以解析数值字符串，或将整数转换为浮点数。\n\
    - `bool()`：将给定的值转换为布尔。如果值被视为“真”（truthy）则返回 `True`，否则返回 `False`。例如，`bool(0)` 返回\
    \ `False`，而 `bool(1)` 返回 `True`。\n- `str()`：将给定的值转换为字符串。它可以将数字、布尔或其他数据类型转换为字符串表示。这等同于\
    \ Java 中的 `toString()` 函数。\n\n### 4.7 顶级代码\n\n与 Java 不同（Java 要求所有代码封装在类和方法中），Python\
