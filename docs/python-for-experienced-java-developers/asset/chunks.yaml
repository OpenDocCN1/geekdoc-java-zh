    Similar to source sets in the Gradle build process, Python projects in IntelliJ
    IDEA can organize source code into different directories.


    IntelliJ IDEA provides a project configuration feature where directories can be
    designated for different purposes.


    This can be done by using the Mark directory as option in the context menu, accessed
    by right-clicking on a directory name in the project window.


    Alternatively, you can navigate to File →Project Structure →Project Settings →Modules
    →Sources to configure directories.


    The two most important markings are:


    Sources Root: Indicates that all directories within it are considered top-level
    packages, and all Python files contained in this directory are considered part
    of the root package.


    Excluded: Indicates that the files and directories in this package should be ignored
    when building and running the project.


    The example below illustrates a directory structure with markings (S = Sources
    Root, E = Excluded) for a project that includes a legacy section utilizing regular
    packages and a newer section employing namespace packages, suitable for execution
    on two distinct operating system platforms.


    With this configuration the project is ready to run on platform A using the packages


    my_legacy_common_package


    my_legacy_platform_package


    my_package


    To make the project ready to run on Platform B, you simply need to swap the Source
    Root and Excluded markings on the platform packages.


    Notice that the src directory needs no marking to run the entry point main.py
    as this file is directly passed to the Python interpreter.


    This example also illustrates the advantage of namespace packages. Both platform-dependent
    and platform-independent code can reside in the same namespace package, my_package.
    The legacy code requires two separate regular packages, my_legacy_common_package
    and my_legacy_platform_package


    src/


    |- main.py


    |- legacy/


    |..|- common (S)/


    |..|..|- my_legacy_common_package/


    |..|..|..|- my_common_module.py


    |..|..|..|- __init__.py/


    |..|- platform_A (S)/


    |..|..|- my_legacy_platform_package/


    |..|..|..|- my_platform_module.py


    |..|..|..|- __init__.py/


    |..|- platform_B (E)/


    |..|..|- my_legacy_platform_package/


    |..|..|..|- my_platform_module.py


    |..|..|..|- __init__.py/


    |- non_legacy/


    |..|- common (S)/


    |..|..|- my_package/


    |..|..|..|- my_common_module.py


    |..|- platform_A (S)/


    |..|..|- my_package/


    |..|..|..|- my_platform_module.py


    |..|- platform_B (E)/


    |..|..|- my_package/


    |..|..|..|- my_platform_module.py.


    Finally, for your reference, marking directories as source roots automatically
    adds them to the PYTHONPATH variable, which is a list of directories that the
    Python interpreter traverses when searching for modules or packages, similar to
    Java’s classpath.


    ### 10.3 Importing Modules


    Python supports various types of imports from modules, each serving specific purposes:


    Importing Entire Modules: The most common type of import, where an entire module
    is imported using the import keyword. This makes all names defined in the module
    accessible via the module’s namespace.


    Importing Specific Items: Using the from keyword allows for the direct import
    of specific items into the current namespace. This facilitates selective access
    to only the necessary components, eliminating the need to prefix them with the
    module name. This practice enhances code readability and reduces namespace clutter.


    Renaming Imported Items: With the as keyword, it is possible to rename imported
    items to avoid naming conflicts or provide more descriptive names.


    Wildcard Imports: While Python supports wildcard imports to import all names from
    a module, it is generally discouraged due to potential namespace pollution and
    readability issues.


    In the following sections, each type of import will be explained in detail. All
    example code will be based on the following module whose name is my_module and
    whose package is my_package.


    # my_package/my_module


    class MyClass:


        def __init__(self, name):


            self.name = name


        def greet(self):


            return f"Hello, {self.name}!"


    def my_function():


        return "Hello from my_module."


    my_variable = "Hello, World!"


    In Python, when you import from a package instead of a module, the objects are
    imported from the package’s __init__.py file.


    So the imports described in the following would also work with imports from my_package
    instead of my_package.my_module if the code above were to reside in the __init__.py
    file of my_package.


    An example demonstrating the rationale behind this approach is provided at the
    end of the chapter.


    #### 10.3.1 Importing Entire Modules


    You can import an entire module using the import keyword followed by the package
    and module name.


    Once imported, you can access the contents of the module using dot notation.


    import my_package.my_module


    print(my_package.my_module.my_variable)


    print(my_package.my_module.my_function())


    obj = my_package.my_module.MyClass("Bob")


    print(obj.greet())


    # Hello, World!


    # Hello from my_module.


    # Hello, Bob!


    #### 10.3.2 Importing Specific Items


    You can import specific items such as classes, functions, or variables from a
    module using the from keyword followed by the module name and import statement
    for the specific item(s) you want to import.


    Once imported, you can directly reference the imported items without prefixing
    them with the module name.


    from my_package.my_module import \


        my_variable, my_function, MyClass


    print(my_variable)


    print(my_function())


    obj = MyClass("Charlie")


    print(obj.greet())


    # Hello, World!


    # Hello from my_module.


    # Hello, Charlie!


    #### 10.3.3 Renaming Imported Items


    When importing items from a module, you can rename them using the as keyword followed
    by the desired alias. This allows for better code readability or resolving naming
    conflicts.


    from my_package.my_module import \


        my_variable as renamed_variable, \


        my_function as renamed_function, \


        MyClass as RenamedClass


    print(renamed_variable)


    print(renamed_function())


    obj = RenamedClass("Louis")


    print(obj.greet())


    # Hello, World!


    # Hello from my_module.


    # Hello, Louis!


    #### 10.3.4 Wildcard Imports


    Wildcard imports, also known as star imports, allow importing all items from a
    module into the current namespace using the * symbol.


    from my_package.my_module import *


    print(my_variable)


    print(my_function())


    obj = MyClass("Lucy")


    print(obj.greet())


    # Hello, World!


    # Hello from my_module.


    # Hello, Lucy!


    While convenient, wildcard imports can lead to namespace pollution and make it
    unclear which symbols are being imported, potentially causing conflicts or ambiguities
    in the code.


    It is possible to restrict wildcard imports from a module by assigning the __all__
    variable with a list of items that will be imported using wildcards.


    For example, placing


    __all__ = ["MyClass"]


    at the end of my_package.my_module would prevent my_variable and my_function from
    being imported with a wildcard.


    However, these items would still be importable using other types of imports.


    PEP 8, the official style guide for Python code, discourages the use of wildcard
    imports:


    Wildcard imports (from <module> import *) should be avoided, as they make it unclear
    which names are present in the namespace, confusing both readers and many automated
    tools.


    ### 10.4 Absolute vs Relative Imports


    In Python, imports can be categorized into two types: absolute imports and relative
    imports.


    Absolute imports specify the exact location of the module or package to import,
    starting from the top-level package. This type of import is similar to Java’s
    import statements and provides a full path from the project’s root directory to
    the target module or package.'
