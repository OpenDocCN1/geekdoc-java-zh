    ### 15.4 Mocking and Patching


    In contrast to Java, creating mock objects in Python and integrating them into
    the code under test is much simpler, thanks to Python’s dynamically typed nature.
    The unittest.mock subpackage provides all the necessary tools for creating mocks
    and specifying their behavior. It also offers functionality for patching, allowing
    for the temporary substitution of attributes or functions within modules or classes.


    Although the scope of this book does not allow for a comprehensive overview of
    the functionalities offered by unittest.mock, we will provide a brief introduction
    to some of its key features in this section.


    #### 15.4.1 Creating Mocks


    With unittest.mock, the simplest way to create a mock object is by calling Mock().
    The resulting object can then be invoked as a function or accessed as an object
    with attributes and methods.


    There is no need to explicitly specify the names and return values of the functions
    it represents or the attributes it should contain. Whenever the mock object is
    called or queried, it dynamically creates another mock object and returns it.


    Additionally, it is possible to specify the behavior of the mock object.


    Its behavior as a function is determined by assigning a value to its return_value
    attribute, while its behavior for attribute queries is determined by assigning
    a value to the corresponding attribute.


    Here is an example:


    from unittest.mock import Mock


    function_mock = Mock()


    function_mock.return_value = 42


    result_1 = function_mock("Life", "Universe")


    result_2 = function_mock()


    print(result_1, result_2)  # 42 42


    object_mock = Mock()


    object_mock.name = "Arthur Dent"


    object_mock.luggage = "Towel"


    object_mock.great_question = function_mock


    result_3 = object_mock.name


    result_4 = object_mock.luggage


    result_5 = object_mock.great_question()


    print(result_3, result_4, result_5)


    # Arthur Dent Towel 42


    As result_1 and result_2 show, a function mock can be called with an arbitrary
    number of arguments.


    It is also possible to verify both the number of method calls and the parameters
    passed to those calls.


    The assertions in the following example would be applicable to the scenario described
    above:


    function_mock.assert_called()


    function_mock.assert_any_call("Life", "Universe")


    assert object_mock.great_question.call_count == 3


    There is also a subclass of Mock called MagicMock, which offers useful default
    values for unconfigured attributes or functions when used with standard functions,
    for example:


    int(MagicMock())  # returns 1


    float(MagicMock())  # returns 1.0


    MagicMock()[5]  # returns a MagicMock object


    len(MagicMock())  # returns 0 !!!


    Using Mock instead of MagicMock would raise an exception in these examples.


    So in tests where a mock is needed for an arbitrary value that won’t affect the
    test’s outcome, MagicMock can simplify mock setup.


    Finally there is an attribute called side_effect that you can specify for a mocked
    method in a mock.


    It allows you to specify a function or an iterable that will be called or returned
    when the mock is called.


    This attribute is useful for custom actions or varied return values based on test
    inputs or context.


    This is how it works:


    *   If side_effect is set to a function, that function will be called with the
    same arguments as the mock, and its return value will be used as the return value
    of the mock call.


    *   If side_effect is set to an iterable (such as a list or a generator), the
    mock will return values from the iterable each time it is called.


    *   If side_effect is set to an exception, then when the mock is called, it will
    raise that exception instead of returning a value.


    Here is an example:


    from unittest.mock import Mock


    func_1 = Mock(); func_2 = Mock(); func_3 = Mock()


    func_1.side_effect = lambda x: x + 1


    func_2.side_effect = range(1, 3)


    func_3.side_effect = ValueError("Ooops")


    assert func_1(10) == 11


    assert func_2() == 1


    assert func_2() == 2


    try:


        func_3()


    except ValueError as e:


        assert str(e) == "Ooops"


    #### 15.4.2 Patching


    To isolate the code under test from its dependencies, such as external libraries,
    modules, or objects, unittest.mock provides a mechanism called patching.


    While covering all aspects of this mechanism is beyond the scope of this book,
    we will at least cover the most important features.


    A frequently occurring task when writing test cases is mocking HTTP requests.
    This can be easily achieved using the @patch decorator. As an example, consider
    the following function that performs a simple HTTP request:


    # user_data.py


    import requests


    url = "https://api.example.com/users"


    def get_user_list():


        response = requests.get(url)


        if response.status_code == 200:


            return response.json()


        else:


            return None


    To test the behavior of this function with both successful and failed requests,
    you need to patch the requests.get call, as illustrated in this example:


    import unittest


    from unittest.mock import patch, Mock


    from user_data import get_user_list


    @patch("user_data.requests.get")


    class TestGetUserData(unittest.TestCase):


        def test_success(self, mock_get):


            data = ["John", "Jill", "Anna"]


            json_mock = Mock()


            json_mock.return_value = data


            response_mock = Mock()


            response_mock.status_code = 200


            response_mock.json = json_mock


            mock_get.return_value = response_mock


            result = get_user_list()


            self.assertEqual(result, data)


        def test_failure(self, mock_get):


            response_mock = Mock()


            response_mock.status_code = 404


            mock_get.return_value = response_mock


            result = get_user_list()


            self.assertIsNone(result)'
