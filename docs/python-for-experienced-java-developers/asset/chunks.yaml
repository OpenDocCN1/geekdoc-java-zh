    Python provides control flow keywords such as break, continue, and pass to modify
    the behavior of loops and if-else statements.


    break: Terminates the loop immediately.


    continue: Skips the remaining code in the current iteration and moves to the next
    iteration of the loop.


    pass: Acts as a placeholder and does nothing. It is commonly used when a statement
    is syntactically required but no action is needed.


    for i in range(-20,20):


