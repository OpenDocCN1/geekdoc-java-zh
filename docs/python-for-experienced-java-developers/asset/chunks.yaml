    \ is not run at all.\n\nAlso, the clause `if __name__ == \"__main__\":` prevents\
    \ the test runner from executing if the script is loaded elsewhere, for example,\
    \ when running a single test case in `MyTestCase` in a debugger while tracking\
    \ down an issue.\n\nAdditionally, in a real project, you would keep the test class\
