    : [\"data/*.json\", \"data/*.html\"]\n    },\n    install_requires=[\n       \
    \ \"matplotlib>=3.8.0\",\n        \"numpy~=1.26.4\"\n    ],\n    license=\"MIT\"\
    ,\n    author=\"Dr. Jörg Richter\",\n    author_email=\"python-book@nantoka.de\"\
    ,\n    description=\"A simple packaging test\"\n)\n\n# MANIFEST.in\nrecursive-include\
    \ src *\n```\n\n`find_packages()` 函数扫描指定目录，根据 `__init__.py` 文件的存在返回包列表。\n\n`find_namespace_packages()`\
    \ 与 `find_packages()` 类似，但专门为命名空间包设计。与 `find_packages()` 不同，它即使目录没有包含 `__init__.py`\
