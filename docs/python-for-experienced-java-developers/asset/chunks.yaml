    #### 19.3.5 __new__ and __call__


    In Python, __new__ and __call__ are two powerful special methods that play crucial
    roles in object creation and instance behavior.


    __new__ is a class method responsible for creating a new instance of a class.
    It receives the arguments of the class constructor call and must return a new
