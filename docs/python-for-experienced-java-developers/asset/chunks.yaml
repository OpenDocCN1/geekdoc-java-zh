    \    import my_function as func_2\n```\n\n在讨论完相对导入后，需要注意的是根据 Python 风格指南 `PEP\
    \ 8`，通常推荐使用绝对导入而非相对导入。`PEP 8`all：\n\n> 推荐使用绝对导入，因为它们通常更具读性，并且如果导入系统配置错误，它们的行为往往更好（或者至少错误信息更准确）。\n\
    \n### 10.5 包接口\n\n在 Python 中，将导入语句放置在 `__init__.py` 文件或包的模块中，可以让这些导入在其他模块或包中直接可用。\n\
    \n这种行为允许包提供一个方便的接口，使用户可以直接从包命名空间访问常用的对象。\n\n例如，考虑一个名为 `mypackage` 的包，其结构如下：\n\n\
    ```text\nmy_package/\n|- __init__.py\n|- my_module_1.py\n|- my_module_2.py\n```\n\
    \n如果 `my_module_1.py` 包含函数 `my_function`，且 `my_module_2.py` 包含一个名为 `MyClass` 的类，你可以在\
    \ `__init__.py` 中导入这些对象：\n\n#### `__init__.py`\n```python\nfrom my_module_1 import\
    \ my_function\n\nfrom my_module_2 import MyClass\n```\n\n这样，每个脚本都可以直接从包导入这些项：\n\
    \n```python\nfrom mypackage import my_function, MyClass\n```\n\n这为包的用户提供了一个更简洁、更直观的\
    \ API，因为他们可以直接从包命名空间访问所需的对象。\n\n### 10.6 Python 模块中的 `__name__` 属性\n\n在 Python\
    \ 中，有一个特殊的内置属性称为 `__name__`，它会为每个模块和脚本自动定义（请注意：此处讨论的 name 属性不应与 Python 中引用类对象时的\
