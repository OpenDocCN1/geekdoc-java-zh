    \ is also possible to constrain the type variable to a specific type or a union\
    \ type:\n\n```python\nclass Point[T: (int, float)]:\n    def __init__(self, x:\
    \ T, y: T):\n        self.x: T = x\n        self.y: T = y\n\nclass Vector[T: Point]:\n\
    \    def __init__(self, point_1: T, point_2: T):\n        self.point_1: T = point_1\n\
    \        self.point_2: T = point_2\n\nmy_point_1: Point = Point(1.1, 2.2)\nmy_point_2:\
    \ Point = Point(3.3, 4.4)\nmy_vector: Vector = Vector(my_point_1, my_point_2)\n\
    ```\n\nType variables with constraints can be made reusable by utilizing the `TypeVar`\
    \ constructor from the `typing` module:\n\n```python\nfrom typing import TypeVar\n\
    \nNumeric = TypeVar(\"Numeric\", int, float)\n\ndef square(x: Numeric) -> Numeric:\n\
    \    return x*x\n\ndef cube(x: Numeric) -> Numeric:\n    return x*x*x\n\nprint(square(2))\
    \  # 4\nprint(cube(3.3))  # 35.937\n```\n\nPlease note that the first parameter\
    \ of the `TypeVar` constructor must be identical to the name of the variable to\
    \ which the result is assigned.\n\nFinally, it is also possible to constrain a\
    \ type variable to a single class or its subclasses:\n\n```python\nfrom typing\
    \ import TypeVar\n\nclass MyClass[T: (float, int)]:\n    def __init__(self, value:\
