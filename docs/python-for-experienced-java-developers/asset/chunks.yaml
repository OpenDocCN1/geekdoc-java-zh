    #### 16.6.3 Executors


    In asynchronous programming with asyncio, coroutines are the building blocks of
    concurrent execution. Unlike threads, where the operating system handles context
    switching and scheduling, with coroutines, it is the responsibility of the programmer
    to ensure that a coroutine relinquishes control to the event loop in a timely
    manner.


    Failure to do so can lead to blocking other coroutines, potentially causing delays
    or even deadlock in the application.


    Here is an example where a coroutine inadvertently blocks the event loop, leading
    to degraded performance (While there are faster ways to find Fibonacci numbers,
    we picked for demonstration purposes a method that requires a lot of calculations.):


    import asyncio


    def fibonacci(n):


        if n <= 1:


            return n


        else:


            return fibonacci(n-1) + fibonacci(n-2)


    async def fibonacci_async(n):


        result = fibonacci(n)


        print(f"fib({n}) = {result}")


    async def hello():


        print("Hello!")


    async def main():


        tasks = [


            asyncio.create_task(fibonacci_async(36)),


            asyncio.create_task(hello())


        ]


        await asyncio.wait(tasks)


    asyncio.run(main())


    # fib(36) = 14930352


    # Hello!


    Despite initiating both tasks consecutively, the second task begins only after
    the Fibonacci number calculation is complete.


    A straightforward approach would be to transform the Fibonacci number calculation
    into a coroutine and incorporate an asyncio.sleep() statement within the recursive
    section of the calculations. This allows the coroutine to relinquish control back
    to the event loop periodically.


    async def fibonacci(n):


        if n <= 1:


            return n


        else:


            await asyncio.sleep(0.001)  # 1ms sleep


            f_1 = await fibonacci(n-1)


            f_2 = await fibonacci(n-2)


            return f_1 + f_2


    The drawback of this method is that the calculation process is noticeably slowed
    down, not only due to the delayed execution but also because it generates a large
    number of new tasks for the event loop.


    A much better solution for this problem is offered by asyncio, which has the capability
    to delegate synchronous operations to separate threads or processes in a thread
    or process executor pool.


    Here is an example:


    import asyncio


    from concurrent.futures import ProcessPoolExecutor


    def fibonacci(n):


        if n <= 1:


            return n


        else:


            return fibonacci(n-1) + fibonacci(n-2)


    async def fibonacci_async(n):


        event_loop = asyncio.get_event_loop()


        with ProcessPoolExecutor(max_workers=1)\


                as executor:


            result = await event_loop.run_in_executor(


                executor, fibonacci, n)


            print(result)


    async def hello():


        print("Hello!")


    async def main():


        tasks = [


            asyncio.create_task(fibonacci_async(36)),


            asyncio.create_task(hello())


        ]


        await asyncio.wait(tasks)


    if __name__ == "__main__":


        asyncio.run(main())


    # Hello!


    # 14930352


    To execute a function in an executor, you use the run_in_executor method of the
    event loop. This method takes the executor pool to use, the function to run, and
    any parameters for the function.


    The run_in_executor method then submits the function to the executor pool. The
    pool selects an idle thread or process to execute the function with the given
    parameters.


    Note that the run_in_executor method accepts only positional and no keyword parameters.
    Additionally, you can set the parameter for the executor pool to None, in which
    case the default process pool of the event loop is used. By default, this is a
    thread pool, but it can be overwritten using the set_default_executor() method
    of the event loop.


    #### 16.6.4 Coroutine Synchronization


    While coroutines themselves don’t inherently introduce race conditions, they often
    work with shared resources or perform I/O operations where coordination is necessary
    to prevent conflicts. The Queue, Lock, Semaphore, and Event provided by asyncio
    help manage concurrent access to shared resources among coroutines.


    Thread synchronization primitives like Lock and Semaphores block the entire thread
    until they are acquired or released. If used with coroutines, they may inadvertently
    block the event loop, preventing other coroutines from executing concurrently,
    defeating the purpose of asynchronous programming.


    Therefore, asyncio provides its own set of synchronization primitives tailored
    for coroutine-based asynchronous programming.


    Here is an example rewritten for coroutines, based on the example of using events
    from the thread synchronization section:


    import asyncio


    buffer = []


    item_available = asyncio.Event()


    signal_term = "Terminate"


    async def producer():


        for item in range(100):


            if item % 10 == 0:


                item_available.set()


                await asyncio.sleep(5)


            print(f"Producer: Item {item}")


            buffer.insert(0, item)


        buffer.insert(0, signal_term)


        item_available.set()


    async def consumer(consumer_id):


        while True:


            if buffer:


                item = buffer.pop()


                if item == signal_term:


                    buffer.insert(0, signal_term)


                    return


                print(f"Consumer {consumer_id}: Item {item}")


                await asyncio.sleep(5)


            else:


                item_available.clear()


                await item_available.wait()


    async def main():


        tasks = [asyncio.create_task(producer())] + [


            asyncio.create_task(consumer(consumer_id))


            for consumer_id in range(12)


        ]


        await asyncio.gather(*tasks)


    asyncio.run(main())


    # Producer: Item 0


    # ...


    # Producer: Item 9


    # Consumer 0: Item 0


    # Consumer 1: Item 1


    # ...'
