    \ However, there are scenarios where explicitly creating an event loop can be\
    \ beneficial.\n\nOne reason is the need for more fine-grained control over the\
    \ event loop’s behavior and execution. Moreover, explicit event loop creation\
    \ allows developers to implement custom monitoring, tracing, and debugging functionalities\
    \ tailored to their specific requirements. Additionally, explicit event loop management\
    \ can be useful in situations where multiple event loops need to coexist or when\
    \ integrating `asyncio` with other event loop frameworks.\n\nWhile providing examples\
    \ for all potential use cases of explicit event loop creation is beyond the scope\
    \ of this book, we will illustrate one example to demonstrate its practical application.\n\
    \n```python\nimport asyncio\n\nasync def worker(worker_id):\n    if worker_id\
    \ >= 0:\n        await asyncio.sleep(1)\n        print(f\"Worker {worker_id}:\
    \ Finished\")\n    else:\n        raise ValueError()\n\nasync def main():\n  \
    \  tasks = [\n        asyncio.create_task(\n            worker(i), name=f\"Worker:\
    \ {i}\")\n        for i in [1, -1, 2, -2, 3, -3]\n    ]\n    await asyncio.wait(tasks)\n\
    \ndef custom_exception_handler(loop, context):\n    task_name = context[\"future\"\
    ].get_name()\n    print(f\"{task_name} raised an exception\")\n\nloop = asyncio.new_event_loop()\n\
    loop.set_exception_handler(custom_exception_handler)\nloop.run_until_complete(main())\n\
