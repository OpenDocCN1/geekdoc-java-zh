    \    print(\"Permission denied!\")\nexcept IOError:\n    print(\"An I/O error\
    \ occurred!\")\n```\n\n## 第 9 章\n\n### 函数式编程\n\n在本章中，我们将探索 Python 中的函数式编程，涵盖其特性、语法和应用。\n\
    \n虽然 Python 的支持类似于 Java（包括高阶函数、lambda 表达式和闭包），但正如我们将看到的，Python 的动态特性提供了独特的机遇。\n\
    \n### 9.1 一等函数\n\n在 Python 中，函数可以像任何其他数据类型（如整数或字符串）。以下示例说明了这一特性的主要方面。\n\n函数可以赋值给变量。\n\
    \n```python\ndef greet(name):\n    return f\"Hi {name}!\"\n\ngreet_function =\
    \ greet\n\nprint(greet_function(\"Alice\"))  # Hi Alice!\n```\n\n函数可以作为参数传递给其他函数。\n\
    \n```python\ndef apply_operation(operation, x, y):\n    return operation(x, y)\n\
    \ndef multiply(x, y):\n    return x * y\n\nresult = apply_operation(multiply,\
    \ 3, 4)\nprint(result)  # 12\n```\n\n函数可以作为其他函数的返回值返回。\n\n```python\ndef create_multiplier(factor):\n\
    \    def multiplier(x):\n        return x * factor\n    return multiplier\n\n\
    triple = create_multiplier(3)\nprint(triple(5))  # 15\n```\n\n在 Python 中，可以将对象的方法作为参数传递给函数。\n\
    \n虽然这与 Java 中的方法引用（由 `::` 运算符表示）有一些相似之处，但其语法和实现是不同的。\n\n```python\nclass MyClass:\n\
    \    def __init__(self, value):\n        self.value = value\n    def multiply(self,\
    \ other):\n        return self.value * other\n\ndef use(function, obj):\n    return\
    \ function(obj)\n\nmy_object = MyClass(2)\nresult = use(my_object.multiply, 5)\n\
    print(result)  # 10\n```\n\n### 9.2 Lambda 表达式\n\n在 Java 和 Python 中，lambda 表达式都是匿名函数，可以用于创建小型、一次性的函数，而不需要显式地定义独立的函数。\n\
    \nPython 中的 lambda 表达式使用 `lambda` 关键字定义，后面跟着一个由逗号分隔的参数列表、一个冒号（:`）以及一个表示函数调用返回值的表达式。\n\
    \n与 Java 不同，Python 的动态类型特性意味着你不需要在 lambda 函数中指定参数类型。\n\n```python\nadd = lambda\
    \ x, y: x + y\nprint(add(3, 5))  # 8\n```\n\nPython 的 lambda 可以访问其闭包词法作用域中的变量，创建的闭包即使在外部作用域退出后也能保留对这些变量的访问；而在\
    \ Java 中，则需要 `final` 或不可变声明。\n\n```python\ndef create_list_appender(x):\n    return\
    \ lambda y: x.append(y)\n\nmy_list = [1, 2]\nadd_to_my_list = create_list_appender(my_list)\n\
    add_to_my_list(3)\nprint(my_list)  # [1, 2, 3]\n```\n\n### 9.3 内置高阶函数\n\nlambda\
    \ 表达式配合 Python 的内置高阶函数使用非常方便。\n\n以下是 `map()` 和 `filter()` 的示例。注意在 Python 中，它们返回的是迭代器，与\
    \ Java 的对应实现不同。\n\n```python\nnumbers = [1, 2, 3, 4, 5]\nsquared = map(lambda\
    \ x: x ** 2, numbers)\nprint(list(squared))  # [1, 4, 9, 16, 25]\n\nevens = filter(lambda\
    \ x: x % 2 == 0, numbers)\nprint(list(evens))  # [2, 4]\n```\n\n# 第三部分\n\n###\
    \ Python 环境管理\n\n## 第 10 章\n\n### 模块与包\n\n#### 10.1 概述\n\n在 Python 中，类似于 Java，代码被组织成模块和包。然而，我们将探索一些显著的区别。考虑以下结构：\n\
    \n```\nsrc/\n├── main.py\n└── utils/\n    ├── __init__.py\n    └── helper.py\n\
    └── data/\n    ├── __init__.py\n    └── data_processing.py\n```\n\n在 Python 中，模块包含包含\
    \ 定义的文件。包是一个包含模块和一个特殊的 `__init__.py` 文件的目录。\n\n要从包中导入模块，使用点符号法。例如，在上面的结构中，`helper.py`\
    \ 被引用为 `utils.helper`。\n\n在 Python 中，没有 `package` 语句；模块的包完全取决于其在层次结构中的位置。因此，在\
    \ Python 中（与 Java 不同），两个类不能共享同一个命名空间，除非它们在同一个文件 `helper.py` 中。\n\n#### 10.2 包\n\
    \n在 Python 中有普通包和命名包。普通包在 Python 2 和 3 中均可用，而命名包是 3.3 版本引入的特性。\n\n普通包是包含 `__init__.py`\
    \ 文件的目录。当导入相应的包或其部分时，该文件会被执行。`__init__.py` 文件可以包含初始化代码，例如定义变量、导入模块或设置包所需的资源。或者，也可以保持为空。无论导入多少次，它每个\
    \ Python 进程只会执行一次。一旦执行，模块会被缓存在内存中，后续对同一包的导入将重用已初始化的模块。\n\n"
