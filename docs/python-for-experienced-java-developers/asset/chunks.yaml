- fmt: "\nAdditionally, you may want to consider other configurations such as version-control\
    \ management, configuring code style, and adjusting editor settings for features\
    \ like code completion. These tasks can be configured in a manner similar to Java.\n\
    \n### 3.4 Create a Directory Structure\n\nWhile Java projects typically adhere\
    \ to a mandatory directory structure when using a Gradle-based build process,\
    \ Python projects do not have such strict requirements. However, organizing your\
    \ Python project into a structured directory layout can significantly enhance\
    \ maintainability, collaboration, and ease of development. Here is a proposed\
    \ directory structure that you will need to create manually.\n\n```\nproject_name/\n\
    |- src/\n|..|- package_name/\n|..|..|- __init__.py\n|..|..|- module1.py\n|..|..|-\
    \ module2.py\n|- tests/\n|..|- test_package_name/\n|..|..|- test_module1.py\n\
    |..|..|- test_module2.py\n|- docs/\n|..|- conf.py\n|..|- index.rst\n|- data/\n\
    |..|- dataset1.csv\n|..|- dataset2.json\n|- README.md\n|- LICENSE\n|- requirements.txt\n\
    |- .gitignore.\n```\n\n`src/`: Contains the source code of the project, organized\
    \ into packages and modules. Each package may contain submodules and related files.\
    \ This will be explained in a later chapter.\n\n`tests/`: Contains unit tests\
    \ and test scripts for testing the functionality of the project. Tests should\
    \ be organized to mirror the structure of the `src` directory.\n\n`docs/`: Contains\
    \ project documentation, like configuration files for documentation tools such\
    \ as Sphinx (`conf.py`) or the main documentation file (`index.rst`).\n\n`data/`:\
    \ Contains data files or datasets used by the project. This directory may also\
    \ include any generated or processed data files.\n\n`README.md`: Provides an overview\
    \ of the project, including installation instructions, usage examples, and other\
    \ relevant information.\n\n`LICENSE`: Contains the project’s license file specifying\
    \ the terms of use and distribution.\n\n`requirements.txt`: The file lists project\
    \ dependencies and their versions, enabling easy installation of dependencies\
    \ using `pip`. The contents of this file will be explained in a later chapter.\n\
    \n`.gitignore`: Specifies files and directories to be ignored by the GIT version\
    \ control systems.\n\n### 3.5 Run a Test Program\n\nAs a final step to test that\
    \ your IDE is properly set up, write a small ‘Hello World’ program and run it\
    \ in the console window:\n\n*   In IntelliJ IDEA, select a directory in the `src`\
    \ branch of your directory tree, do a right mouse click and select `New→Python\
    \ File`.\n*   Enter a name for your Python file, for example `hello_world.py`.\n\
    *   In the newly created Python file, enter the following code:\n\n    ```\n \
    \   print(\"Hello World\")\n    ```\n*   Right-click on the Python file in the\
    \ project explorer and select: `Run ’Hello_World’`.\n*   After running the program,\
    \ you should see Hello World printed in the console output window at the bottom\
    \ of the IntelliJ IDEA interface.\n\n# Part II\n\nThe Python Language\n\n## Chapter\
    \ 4\n\nSyntax: Python vs Java\n\n### 4.1 Basic Syntax Differences\n\nIn contrast\
    \ to Java, Python syntax diverges from the C-like style. Here are some fundamental\
    \ syntax differences between Python and Java:\n\n**Indentation vs. Braces**: Python\
    \ uses indentation to define blocks of code, such as loops, functions, and conditionals\
    \ instead of delineating code with braces.\n\n**Semicolons**: Python does not\
    \ require semicolons at the end of statements. However, you can use semicolons\
    \ to separate multiple statements on the same line.\n\n**Comments**: Python supports\
    \ single-line comments denoted by the `#` symbol and multi-line comments using\
    \ triple quotes `'''` or `\"\"\"`.\n\n```\n# This is a single-line comment\n\n\
    \"\"\"\nThis is a\nmulti-line comment\n\"\"\"\n```\n\n**Strings**: In Python,\
    \ strings can be defined using single (`'`) or double (`\"`) quotes interchangeably.\
    \ The `==` operator checks whether the content of two strings is the same, whereas\
    \ the `is` operator can be used to check whether two string variables refer to\
    \ the same object in memory.\n\n**Line Continuation**: In Python, unlike Java,\
    \ continuing a statement on the next line typically requires the continuation\
    \ character `\\` at the line’s end. However, an important exception exists: Within\
    \ parentheses, brackets, or braces `()`, `[]`, `{}``, line continuation is implicit\
    \ and doesn’t necessitate any special syntax.\n\n```python\nlong_string = \"This\
    \ string spans \\\ntwo lines.\"\n\nprint(\"Hello\",\n      \"World\")\n```\n\n\
    ### 4.2 Data Types\n\nPython supports various built-in data types, including:\n\
    \n`int`\nInteger numbers without decimal points (e.g., 10, -5, 1000). In Python,\
    \ there is no predefined limit on the size of integers like there is for `int`\
    \ and `long` in Java. As long as your computer’s memory can accommodate it, Python\
    \ can handle very large integer values.\n\n`float`\nFloating-point numbers with\
    \ decimal points (e.g., 3.14, -0.5, 2.718). They represent floating-point numbers\
    \ with double precision according to the IEEE 754 standard, typically providing\
    \ around 15 decimal digits of precision. There is no distinct type specifically\
    \ for single precision floating-point numbers like in Java.\n\n`complex`\nComplex\
    \ numbers with real and imaginary parts (e.g., 3+4j, -2-5j).\n\n`str`\nStrings\
    \ representing immutable sequences of unicode characters.\nString literals can\
    \ be written with single or double quotes, allowing the use of the other quote\
    \ type inside the string.\n\n```\n\"He said: ’Hello!’\"\n'He said: \"Hello!\"\
    ’\n```\nAs with comments, triple quotes for multiline string literals are supported\
    \ as well.\nString literals can contain arbitrary Unicode characters, either directly\
    \ typed in or represented as code points.\n\n`bool`\nBoolean values representing\
    \ `True` or `False`.\n\n`bytes`\nbytes objects can store immutable sequences of\
    \ bytes, representing binary data ranging from 0 to 255.\nbytes objects can be\
    \ created using:\n*   a bytes literal prefixed with `b`, for example `b\"Hello\"\
    `\n*   the `bytes()` constructor who accepts a variety of input, for example `bytes(65)`,\
    \ `bytes([72, 91])`, `bytes(\"Hello\", \"utf-8\")`\n\nPython has two additional\
    \ numerical operators that Java does not: `**` for exponentiation and `//` for\
    \ floor division. In Java, you would use `Math.pow(a, b)` for exponentiation and\
    \ `Math.floor(a / b)` for floor division.\n\n### 4.3 Variable Declarations\n\n\
    Python is a dynamically typed language, meaning that variables do not require\
    \ explicit type declarations. Instead, the type of a variable is inferred at runtime\
    \ based on the value assigned to it.\nTherefore, variables in Python are declared\
    \ by simply assigning a value to a name.\n\n```python\n# Integer variable\nmy_integer\
    \ = 10\n\n# Float variable\nmy_float = 3.14\n\n# String variable\nmy_string =\
    \ \"Hello World!\"\n```\n\nThis example also demonstrates that, unlike Java, static\
    \ variables in Python can be defined outside of class definitions simply by declaring\
    \ them in the top-level scope.\nIn Python, variables can dynamically change their\
    \ type based on the assigned value at any time.\n\n```python\n# Assigning with\
    \ a string\nmy_variable = \"Hello\"\nprint(type(my_variable)) # <class 'str'>\n\
    \n# Reassigning with a boolean\nmy_variable = True\nprint(type(my_variable)) #\
    \ <class 'bool'>\n```\n\n### 4.4 Control Flow Statements\n\n#### 4.4.1 if-else\
    \ Statements\n\nIn Python, if-else statements function similarly to those in Java,\
    \ with the distinction that they do not require braces for the condition and utilize\
    \ indentations to differentiate the if and else blocks within the statement.\n\
    Conditions are written similarly to Java, but Python uses `and` and `or` instead\
    \ of `&&` and `||` for logical operations.\n\n```python\nif x > 0 and y > 0:\n\
    \    print(\"both numbers are positive\")\nelse:\n    print(\"at least one number\
    \ is non-positive\")\n```\n\nIn Python, there is no switch statement, but using\
    \ `elif` statements (abbreviation for else if) serves a similar purpose.\n"
