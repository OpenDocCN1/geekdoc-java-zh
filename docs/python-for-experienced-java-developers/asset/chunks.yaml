    \n```\nmy_project/\n|- src/\n|..|- my_package/\n|..|..|- my_sub_package/\n|..|..|..|-\
    \ __init__.py__\n|..|..|..|- my_sub_module_1\n|..|..|..|- my_sub_module_2\n|..|..|-\
    \ __init__.py__\n|..|..|- my_module_1\n|..|..|- my_module_2\n|..|..|- my_module_3\n\
    |..|- setup.py.\n```\n\n针对该场景的简单 `setup.py` 如下所示：\n\n```python\nfrom setuptools\
    \ import setup\n\nsetup(\n    name=\"python-simple-packaging-test\",\n    version=\"\
