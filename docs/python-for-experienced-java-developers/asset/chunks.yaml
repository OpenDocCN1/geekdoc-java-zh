    使用 `pip` 生成 `requirements.txt`，请使用以下命令：


    ```bash

    pip freeze > requirements.txt

    ```


    该命令将在你的项目目录下创建一个 `requirements.txt` 文件，其中包含所有已安装的包及其精确版本。


    或者，你也可以通过以下步骤在 `IntelliJ IDEA` 中创建 `requirements.txt`：


