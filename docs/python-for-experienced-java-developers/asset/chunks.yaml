    ## Chapter 9


    Functional Programming


    In this chapter, we will explore functional programming in Python, covering its
    features, syntax, and applications.


    While Python’s support resembles Java, including higher-order functions, lambda
    expressions, and closures, Python’s dynamic nature presents unique opportunities,
    as we will see.


    ### 9.1 First-Class Functions


    In Python, functions can be treated just like any other data type, such as integers
    or strings. The following examples illustrate the main aspects of this feature.


    Functions can be assigned to variables.


    def greet(name):


        return f"Hi {name}!"


    greet_function = greet


    print(greet_function("Alice"))  # Hi Alice!


    Functions can be passed as arguments to other functions.


    def apply_operation(operation, x, y):


        return operation(x, y)


    def multiply(x, y):


        return x * y


    result = apply_operation(multiply, 3, 4)


    print(result)  # 12


    Functions can be returned as values from other functions.


    def create_multiplier(factor):


        def multiplier(x):


            return x * factor


        return multiplier


    triple = create_multiplier(3)


    print(triple(5))  # 15


    In Python, it is possible to pass a method of an object to a function as a parameter.


    While this shares some similarities with method references in Java (denoted by
    the :: operator), the syntax and implementation are different.


    class MyClass:


        def __init__(self, value):


            self.value = value


        def multiply(self, other):


            return self.value * other


    def use(function, obj):


        return function(obj)


    my_object = MyClass(2)


    result = use(my_object.multiply, 5)


    print(result)  # 10


    ### 9.2 Lambda Expressions


    In both Java and Python, lambda expressions are anonymous functions that can be
    used to create small, one-off functions without needing to explicitly define a
    separate function.


    Lambda expressions in Python are defined using the keyword lambda, followed by
    a list of parameters separated by commas, a colon (:), and an expression that
    represents the return value of the function call.


    Unlike Java, Python’s dynamically typed nature means that you don’t need to specify
    parameter types in lambda functions.


    add = lambda x, y: x + y


    print(add(3, 5))  # 8


    Python lambdas can access variables from their enclosing lexical scope, creating
    closures that retain access to these variables even after the enclosing scope
    exits, unlike Java where final or immutable declarations are necessary.


    def create_list_appender(x):


        return lambda y: x.append(y)


    my_list = [1, 2]


    add_to_my_list = create_list_appender(my_list)


    add_to_my_list(3)


    print(my_list)  # [1, 2, 3]


    ### 9.3 Built-in Higher-Order Functions


    Lambda expressions are particularly handy with Python’s built-in higher-order
    functions.


    Here are examples showcasing map() and filter(). Note that in Python, they return
    iterators, unlike their Java counterparts.


    numbers = [1, 2, 3, 4, 5]


    squared = map(lambda x: x ** 2, numbers)


    print(list(squared))  # [1, 4, 9, 16, 25]


    evens = filter(lambda x: x % 2 == 0, numbers)


    print(list(evens))  # [2, 4]


    # Part III


    Managing Python Environments


    ## Chapter 10


    Modules and Packages


    ### 10.1 Overview


    In Python, similar to Java, code is structured into a tree format of directories
    and code files, establishing a hierarchical namespace for accessing variables,
    functions, and classes within the code files. However, there are notable distinctions,
    as we will explore in this chapter.


    Consider the following file tree example:


    src/


    |- main.py


    |- utils/


    |..|- __init__.py


    |..|- helper.py


    |- data/


    |..|- __init__.py


    |..|- data_processing.py.


    This file tree contains examples of the following elements:


    Scripts like main.py typically refer to standalone Python files that contains
    executable code meant to be run directly. They are the entry points to applications
    or workflows.


    In a typical Python project structure, scripts are often either located at the
    top level of a project directory or in a directory named scripts or bin directly
    below the top level.


    This separation helps to distinguish scripts, which are meant to be directly executable,
    from modules.


    Modules like helper.py are Python files that contain reusable code, including
    variables, functions, and classes.


    Each module can be imported and used in other modules or scripts.


    Packages like utils are directories that contain Python modules and a special
    file named __init__.py. They provide a way to organize and namespace related modules.


    The file names of modules must must end with the .py extension. Technically you
    can name your Python scripts without the .py extension, but doing so is not standard
    practice and may lead to confusion for other developers.


    In Python, similar to Java, namespaces are hierarchical, consisting of modules
    and packages. When importing modules from packages, the dot notation is used to
    traverse the namespace hierarchy. For example, in the scenario described above,
    the helper.py module is referenced as utils.helper in an import statement.


    In Python, there is no package statement; a module’s package is solely determined
    by its position within the package hierarchy.


    Therefore, in Python, unlike Java, two classes cannot share the same namespace
    if they are in different files. They must be in the same module file. For instance,
    both utils.helper.class_1 and utils.helper.class_2 need to be defined within the
    same module file, named helper.py.


    ### 10.2 Packages


    In Python, there are regular packages and namespace packages. Regular packages
    have been available since both Python 2 and 3, while namespace packages are a
    feature introduced in version 3.3.


    It is possible to use regular packages and namespace packages in parallel within
    a Python project.


    Regular packages are directories that contain a file __init__.py. This file is
    executed when the corresponding package or parts of it are imported.


    The __init__.py file can contain initialization code, such as defining variables,
    importing modules, or setting up resources needed by the package. Alternatively,
    it can be left empty.


    It is executed only once per Python process, regardless of how many times the
    package is imported by different modules. Once it is executed, the module is cached
    in memory, and subsequent imports of the same package will reuse the already initialized
    module.


    Namespace packages in Python enable multiple directories, ZIP files, or other
    file systems to collectively behave as a single Python package.


    This feature is particularly useful for structuring large libraries or projects
    that may need to be distributed across different locations.


    All package sources must not contain a __init__.py.


    Python combines the contents of all directories or archives found within a single
    namespace, akin to Java packages.


    It is possible to have namespace subpackages of regular packages and vice versa.


    In contrast to Java Python does not throw an exception if a regular package exists
    twice or a namespace package finds the same module name in two different sources.'
