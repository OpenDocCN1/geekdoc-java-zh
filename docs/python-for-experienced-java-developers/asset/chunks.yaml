  raw: 'Please note that the dir() function does not show all attributes of an object.
    It lists most of the attributes and methods associated with an object but may
    exclude certain special or dynamically added attributes.


    Here is an example:


    class MyClass:


        def __getattr__(self, name):


            if name == "dyn_attr":


                return "Dynamic Attribute"


            raise AttributeError(f"{name} not found")


    obj = MyClass()


    print(obj.dyn_attr)  # Dynamic Attribute


    print(dir(obj))  # List does not contain dyn_attr


    #### 19.5.2 The inspect Module


    The inspect module in Python, much like Java’s reflection API, enables you to
    examine the structure and members of an object.


    Explaining the complete functionality provided by this module would be beyond
    the scope of this book. Instead, here are two examples demonstrating frequently
    occurring tasks.


    ##### Logging Method Calls


    This example shows how to automatically add logging to every method call of an
    object. Automatically wrapping methods can be generally useful when writing test
    code.


    import inspect


    def add_logging(obj):


        for name, value in inspect.getmembers(


                obj, inspect.ismethod):


            setattr(obj, name, add_logger(value))


    def add_logger(meth):


        def wrapper(*args, **kwargs):


            print(f"*** Calling method: {meth.__name__}")


            return meth(*args, **kwargs)


        return wrapper


    class MyClass:


        def __init__(self, value):


            self.value = value


        def print_value(self):


            print(f"value = {self.value}")


    my_object = MyClass(42)


    add_logging(my_object)


    my_object.print_value()


    # *** Calling method: print_value


    # value = 42


    The function inspect.getmembers() retrieves all the members of an object. The
    object can be an instance, a class, a module, or any other type of object in Python.
    A member can be a method, attribute, property, or any other type of member that
    an object can have.


    inspect.getmembers() returns a list of tuples, where each tuple contains two elements:
    the name of the member and the value of the member.


    inspect.getmembers() takes as parameters the object to be inspected and, optionally,
    a predicate function that filters the members.


    inspect.ismethod() is a predicate function that returns True if its parameter
    is a bound method.


    The inspect module provides other predicate functions like


    inspect.isfunction() for functions


    inspect.isbuiltin() for built-in functions such as __new__().


    ##### Mock Creation


    This example demonstrates how to create a mock for a class by replacing all methods
    with a dummy method. It returns values based on the return type hint: 0 for int,
    False for bool, an empty string for str, and None for other types.


    import inspect


    def mock(cls):


        methods = {}


        for key, value in inspect.getmembers(


                cls, inspect.isfunction):


            methods[key] = mock_method(value)


        methods["__init__"] = lambda x: None


        mock_class = type(


            f"{cls.__name__}_mock",


            (cls,),


            methods


        )


        return mock_class()


    def mock_method(method):


        signature = inspect.signature(method)


        return_annotation = signature.return_annotation


        def mocked_method(*args, **kwargs):


            signature.bind(*args, **kwargs)


            if return_annotation == int:


                return 0


            elif return_annotation == bool:


                return False


            elif return_annotation == str:


                return ""


            elif return_annotation is not None:


                return None


        return mocked_method


    class MyClass:


        def __init__(self, value):


            self.value = value


        def add(self, second_value) -> int:


            self.value += second_value


            return self.value


        def is_positive(self) -> bool:


            return self.value > 0


        def as_tuple(self) -> tuple:


            return (self.value,)


        def __str__(self) -> str:


            return f"Value: {self.value}"


    obj = MyClass(42)


    mocked_obj = mock(MyClass)


    print(obj.__class__)


    # <class ’__main__.MyClass’>


    print(mocked_obj.__class__)


    # <class ’__main__.MyClass_mock’>


    print(isinstance(mocked_obj, MyClass))  # True


    print(obj.is_positive())  # True


    print(mocked_obj.is_positive())  # False


    print(obj.as_tuple())  # (42,)


    print(mocked_obj.as_tuple())  # None


    print(obj.add(1))  # 43


    print(mocked_obj.add(1))  # 0


    print(obj)  # Value: 43


    print(mocked_obj)  # <empty string>


    The mock() function takes a class object as an argument and creates a mock for
    that class. It does so by generating a subclass of the given class, where all
    methods of the parent class are overridden with mocked methods. The function then
    returns an instance of this subclass.


    Here are a few points in this code that are worth explaining in detail:


    The expression


    inspect.getmembers(cls, inspect.isfunction)


    returns all the methods of the class and its superclasses. The filter function
    used here is inspect.isfunction() instead of inspect.ismethod(), because methods
    are bound to an instance of a class, not to the class itself.


    The statement


    methods["__init__"] = lambda x: None


    creates a constructor for the mock class that does nothing. This allows the mock()
    function to create an instance of the mock class using a parameterless constructor.


    The inspect.signature() function returns a complex object that describes the signature
    of a method or function.


    Its main components include a list of objects describing the parameters of the
    signature (signature.parameters) and, if specified by a type hint, the expected
    return type of the method or function (signature.return_annotation).


    In the example above, signature.bind() is used to test whether a mock method is
    called with the correct parameters. This ensures that the mock implementation
    faithfully mimics the interface of the original method.


    For instance, in the example above, calling the add() method of mocked_obj without
    arguments would cause signature.bind() to raise a TypeError.


    More generally, the signature.bind() function returns a BoundArguments object,
    which represents the mapping between the passed arguments and the function’s parameters.


    This complex object contains several attributes, among them arguments, an OrderedDict
    (a dictionary where the keys maintain their order) that maps the parameter names
    of the original signature to the passed arguments.


    By using .apply_defaults() on the BoundArguments object, it is also possible to
    fill in any missing arguments with their default values from the signature.


    Here is an example:


    import inspect


    def my_method(x, y, z=42):


        pass


    my_signature = inspect.signature(my_method)


    bound_args = my_signature.bind(1, y=2)


    print(bound_args.arguments)


    # {’x’: 1, ’y’: 2}


    bound_args.apply_defaults()


    print(bound_args.arguments)


    # {’x’: 1, ’y’: 2, ’z’: 42}


