    \n### 3.4 创建目录结构\n\n虽然 Java 项目在使用基于 Gradle 的构建过程时通常需要遵循强制性的目录结构，但 Python 项目没有此类严格的要求。然而，将你的\
    \ Python 项目组织成结构化的目录布局可以显著提高可维护性、协作性和开发便利性。以下是一个建议的目录结构，你需要手动创建它。\n\n```\nproject_name/\n\
    |- src/\n|..|- package_name/\n|..|..|- __init__.py\n|..|..|- module1.py\n|..|..|-\
    \ module2.py\n|- tests/\n|..|- test_package_name/\n|..|..|- test_module1.py\n\
    |..|..|- test_module2.py\n|- docs/\n|..|- conf.py\n|..|- index.rst\n|- data/\n\
    |..|- dataset1.csv\n|..|- dataset2.json\n|- README.md\n|- LICENSE\n|- requirements.txt\n\
    |- .gitignore.\n```\n\n`src/`: 包含项目的源代码，组织成包和模块。每个包可能包含子模块和相关文件。这将在后面的章节中解释。\n\
    \n`tests/`: 包含用于测试项目功能的单元测试和测试脚本。测试的组织应镜像 `src` 目录的结构。\n\n`docs/`: 包含项目文档，例如 Sphinx\
    \ 等文档工具的配置文件（`conf.py`）或主文档文件（`index.rst`）。\n\n`data/`: 包含项目使用的数据或数据集。该目录也可以包含任何生成或处理过的数据文件。\n\
    \n`README.md`: 提供项目概述，包括安装说明、用法示例和其他相关信息。\n\n`LICENSE`: 包含项目的许可证文件，规定了使用和发行条款。\n\
    \n`requirements.txt`: 该文件列出了项目依赖及其版本，允许使用 `pip` 轻松安装依赖。该文件的内容将在后面的章节中解释。\n\n`.gitignore`:\
    \ 指定被 GIT 版本控制系统忽略的文件和目录。\n\n### 3.5 运行测试程序\n\n测试你的 IDE 是否已正确设置的最后一步是编写一个小的“Hello\
    \ World”程序并在控制窗口中运行它：\n\n*   在 IntelliJ IDEA 中，在目录树的 `src` 分支选择一个目录，右键点击并选择 `New→Python\
    \ File`。\n*   为你的 Python 文件输入一个名称，例如 `hello_world.py`。\n*   在新创建的 Python 文件中，输入以下代码：\n\
    \n    ```\n    print(\"Hello World\")\n    ```\n*   在项目管理器中右键点击该 Python 文件并选择：`Run\
    \ ’Hello_World’`。\n*   运行程序后，你应该能在 IntelliJ IDEA 界面底部的控制输出窗口看到打印 Hello World。\n\
    \n# 第二部分\n\nPython 语言\n\n## 第 4 章\n\n语法：Python vs Java\n\n### 4.1 基础语法差异\n\n与\
    \ Java 相比，Python 语法偏离了 C 类风格。以下是 Python 和 Java 之间的一些基本的语法差异：\n\n**缩进 vs 大括号**：Python\
    \ 使用缩进来定义代码块（如循环、函数和条件判断），而不是用大括号来界定代码。\n\n**分号**：Python 语句末尾不需要分号。然而，你可以使用分号来分隔同一行上的多个语句。\n\
    \n**注释**：Python 支持由 `#` 符号表示的单行注释，以及使用三引号 `'''` 或 `\"\"\"` 的多行注释。\n\n```\n# 这是一个单行注释\n\
    \n\"\"\"\n这是一条\n多行注释\n\"\"\"\n```\n\n**字符串**：在 Python 中，可以使用单引号（`'`）或双引号（`\"\"\
    `）交替定义字符串。`==` 运算符检查两个字符串的内容是否相同，而 `is` 运算符可以用于检查两个字符串变量是否引用内存中的同一个对象。\n\n**换行延续**：在\
    \ Python 中，与 Java 不同，将语句延续到下一行通常需要在行末尾使用延续字符 `\\`。然而，存在一个重要的例外：在圆括号、中括号或大括号 `()`、`[]`、`}`\
    \ 内部，换行延续是隐式的，不需要任何特殊语法。\n\n```python\nlong_string = \"This string spans \\\n\
    two lines.\"\n\nprint(\"Hello\",\n      \"World\")\n```\n\n### 4.2 数据类型\n\nPython\
    \ 支持多种内置数据类型，包括：\n\n`int`\n不带小数点的整数（例如 10, -5, 1000）。在 Python 中，整数的大小没有像 Java\
    \ 中 `int` 和 `long` 那样的预定义限制。只要你的计算机内存足够，Python 就可以处理非常大的整数值。\n\n`float`\n带有小数点的浮点数（例如\
    \ 3.14, -0.5, 2.718）。它们根据 IEEE 754 标准代表双精度浮点数，通常提供约 15 位小数精度。Python 像 Java 那样没有专门针对单精度浮点数的独立类型。\n\
    \n`complex`\n具有实部和虚部的复数（例如 3+4j, -2-5j）。\n\n`str`\n表示不可变 Unicode 字符序列的字符串。\n字符串字面量可以使用单引号或双引号编写，允许在字符串内部使用另一种引号类型。\n\
    \n```\n\"He said: ’Hello!’\"\n'He said: \"Hello!\"’\n```\n与注释一样，也支持三引号多行字符串字面量。\n\
    字符串字面量包含任意 Unicode 字符，可以直接输入或以代码点表示。\n\n`bool`\n表示 `True` 或 `False` 的布尔值。\n\n\
    `bytes`\n`bytes` 对象可以存储不可变的字节序列，表示从 0 到 255 的二进制数据。\n可以使用以下方式创建 `bytes` 对象：\n\
    *   带有 `b` 前缀的字节字面量，例如 `b\"Hello\"`\n*   使用 `bytes()` 构造函数，它可以接受各种输入，例如 `bytes(65)`、`bytes([72,\
    \ 91])`、`bytes(\"Hello\", \"utf-8\")`\n\nPython 有两个 Java 没有数值运算符：用于幂的 `**` 和用于地板除的\
    \ `//`。在 Java 中，你会使用 `Math.pow(a, b)` 进行幂，使用 `Math.floor(a / b)` 进行地板除。\n\n###\
    \ 4.3 变量声明\n\nPython 是一种动态类型语言，这意味着变量不需要显式的类型声明。相反，变量的类型根据赋值它的值在运行时推断。\n因此，Python\
    \ 中的变量通过简单地为名称赋值来声明。\n\n```python\n# 整数变量\nmy_integer = 10\n\n# 浮点数变量\nmy_float\
    \ = 3.14\n\n# 字符串变量\nmy_string = \"Hello World!\"\n```\n\n此示例还证明了，与 Java 不同，Python\
    \ 中的静态变量可以通过简单地在顶层作用域中声明来实现。\n在 Python 中，变量可以根据赋值的值动态更改其类型。\n\n```python\n# 赋值字符串\n\
    my_variable = \"Hello\"\nprint(type(my_variable)) # <class 'str'>\n\n# 重新赋值布尔值\n\
    my_variable = True\nprint(type(my_variable)) # <class 'bool'>\n```\n\n### 4.4\
    \ 控制流语句\n\n#### 4.4.1 if-else 语句\n\n在 Python 中，if-else 语句的功能与 Java 类似，区别在于条件不需要大括号，并利用缩进来区分语句中的\
    \ if 和 else 块。\n条件的写法与 Java 相似，但 Python 使用 `and` 和 `or` 代替 `&&` 和 `||` 进行逻辑操作。\n\
