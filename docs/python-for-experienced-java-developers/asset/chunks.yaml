    #### 16.6.5 Asynchronous Context Managers


    Asynchronous context managers are classes that can be used with an async with
    statement.


    In contrast to synchronous context managers, they must implement the coroutines
    __aenter__ and __aexit__ instead of the __enter__ and __exit__ methods.


    These coroutines are awaited by the async with statement, allowing for non-blocking
    execution during setup and cleanup.


    Here is an example:


    import asyncio


    class MyAsyncContextManager:


        data = [1, 2, 3, 4, 5]


        async def __aenter__(self):


            print("__aenter__ called")


            return self


        async def __aexit__(self, exc_type,


                            exc_value, traceback):


            print("__aexit__ called")


            self.data = None


    async def main():


        async with MyAsyncContextManager() as manager:


            print(manager.data)


    asyncio.run(main())


    # __aenter__ called


    # [1, 2, 3, 4, 5]


    # __aexit__ called


    ## Chapter 17


    HTTP Requests


    Python provides several libraries for making HTTP requests, each with its own
    strengths and features. One of the most commonly used libraries is requests, which
    will be covered in this chapter.


    Popular alternatives include urllib and http.client.


    ### 17.1 GET Requests


    Making an HTTP GET request using the get function from the requests package is
    quite simple.


    Here is an example (Reqres.in is a REST-API service for mocking HTTP responses
    used in testing and prototyping applications.):


    import requests


    url = "https://reqres.in/api/users/1"


    try:


        response = requests.get(url)


        if response.ok:


            print(f"Content Type: {


                response.headers["content-type"]}"


            )


            print(f"Contents: {response.text}")


        else:


            print(f"Error: {response.status_code}")


    except Exception as ex:


        print(f"An exception occurred: {ex}")


    # Content Type: application/json; charset=utf-8


    # Contents: {"data":{"id":1, ...


    The get() function of the requests module returns a Response object containing
    all data retrieved from the HTTP request in a structured format. The most important
    attributes of Response include:


    ok Returns True if HTTP status code is less than 400, False otherwise.


    status_code: The HTTP status code of the response.


    headers: A dictionary containing the response headers.


    text: The content of the response, in Unicode format.


    content: The content of the response, in bytes.


    request: An object providing information about the HTTP request


    url: The URL of the response.


    The get function in the requests library may raise exceptions under certain circumstances.
    Here are three of the most important exceptions that the get function may raise:


    ConnectionError: Raised when a network connection error occurs, such as a DNS
    resolution failure, a refused connection, or a timeout.


    Timeout: Raised when the request takes longer than the specified timeout period
    to complete.


    TooManyRedirects: Raised when the request encounters too many redirects.


    If you want to handle responses with an HTTP status code different from 200 by
    raising exceptions as well, you can call the raise_for_status() method of the
    Response class. This method raises a HTTPError exception if the response status
    code indicates an error.


    ### 17.2 Parsing JSON Responses


    The json() method of the Response class parses the content of the response as
    a JSON string into a Python object using Python’s built-in json.loads() function.


    This function maps JSON data types to corresponding Python data structures as
    follows:


    JSON object ({}): Mapped to a Python dictionary.


    JSON array ([]): Mapped to a Python list.


    JSON string: Mapped to a Python string.


    JSON number (integer or float): Mapped to a Python int or float.


    JSON true: Mapped to Python True.


    JSON false: Mapped to Python False.


    JSON null: Mapped to Python None.


    Here is an example:


    import requests


    url = "https://reqres.in/api/users/1"


    response = requests.get(url)


    user_data = response.json()


    print(


        user_data["data"]["first_name"],


        user_data["data"]["last_name"],


    )


    # George Bluth


    Please note that the requests package does not include built-in support for parsing
    XML structured content.


    Instead, you can parse XML contents using the built-in xml library, which provides
    SAX and DOM interfaces for XML parsing. Alternatively, you can utilize third-party
    libraries such as ElementTree.


    However, detailed coverage of these parsing techniques is beyond the scope of
    this book.


    ### 17.3 Reading Streamed Contents


    The Response object can also be used as a context manager in a with statement,
    which is useful when utilizing the iter_content() method to read the content sent
    by the HTTP server in chunks. This can be particularly helpful when downloading
    a large file.


    Here is an example:


    import requests


    url = "http://speedtest.tele2.net/10MB.zip"


    chunk_size = 1024


    with requests.get(url, stream=True) as response:


        with open(’large_file.zip’, ’wb’) as file:


            for chunk in response.iter_content(


                    chunk_size=chunk_size


            ):


                print(f"Read {len(chunk)} bytes")


                file.write(chunk)


    # Read 1024 bytes


    # Read 1024 bytes


    # Read 1024 bytes


    # ...


    In this example, the stream parameter of the get method is set to True to prevent
    reading the entire content of the response into memory at once. Instead, it allows
    the content to be iteratively read in smaller chunks using the iter_content()
    method.


    ### 17.4 Using Query Parameters


    To include query parameters in a GET request, you can pass them as a dictionary
    to the params parameter of the get function.


    Here is an example (The examples below utilize httpbin.org, a testing site designed
    to mirror various HTTP requests, serving as a developer tool.):


    import requests


    url = "https://httpbin.org/get"


    params = {


        "name": "Zaphod",


        "job": "President",


    }


    response = requests.get(url, params=params)


    print(response.request.url)


    print(response.json()["args"])


    # https://httpbin.org/get?name=Zaphod&job=President


    # {’job’: ’President’, ’name’: ’Zaphod’}


    ### 17.5 Adding Custom Headers to Requests


    Custom headers can be easily added to an HTTP request by passing a dictionary
    that maps header names to their respective values as an additional keyword parameter
    called headers.


    Here is an example:


    import requests


    url = "https://httpbin.org/headers"


    custom_headers = {


        "User-Agent": "CustomUserAgent",


        "Accept": "application/json",


    }


    response = requests.get(url, headers=custom_headers)


    print(response.request.headers)


    # {’User-Agent’: ’CustomUserAgent’,


    # ’Accept-Encoding’: ’gzip, deflate’,


    # ’Accept’: ’application/json’,


    # ’Connection’: ’keep-alive’}


    Please note that the request contains additional headers like Accept-Encoding
    that have been added by the requests package.


    ### 17.6 POST Requests


    For sending an HTTP POST request, the requests package provides a function called
    post().


    Here is an example that sends a POST request where the body has the format used
    by HTML forms:


    import requests


    url = "https://reqres.in/api/users"


    data = {


        "name": "Arthur",


        "job": "Traveller"


    }


    response = requests.post(url, data=data)


    print(response.text)


    # {"name":"Arthur","job":"Traveller","id":"307" ...


    The post() function supports various forms for the body of the request.


    Here are two frequently used examples:


    JSON Data: If you need to send JSON data, you can use the json parameter. This
    will automatically serialize the data to JSON format.


    json_data = {"key1": "value1", "key2": "value2"}


    response = requests.post(url, json=json_data)


    Raw Data: For sending raw data in the body of the request, you can use the data
    parameter with a bytes or string object.


    raw_data = b"raw data"'
