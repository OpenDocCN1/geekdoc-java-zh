    \ \\\n        .run(suite)\n```\n\n该脚本构建了测试套并启动了一个能够处理 `TestSuite` 对象的运行器，使用了 `unittest`\
    \ 提供的 `TextTestRunner`。\n\n你可以在终端中使用以下命令执行脚本：\n\n`python my_test_suite.py`\n\n\
    在配置的详细级别 2 下，它将输出每个测试用例的结果。\n\n请注意，测试套被配置为先运行 `test_subtract`，然后运行两次 `test_add`，并且不运行\
    \ `test_divide`。\n\n此外，`if __name__ == \"__main__\":` 子句防止测试运行器在脚本被加载到其他地方时执行，例如在调试器中为了查找问题而运行\
    \ `MyTestCase` 中的单个测试用例时。\n\n另外，在实际项目中，你会将测试类放在单独的模块中，并在创建和运行测试套的测试脚本中导入该模块。\n\
    \n最后，请注意，如果你在 IntelliJ IDEA 的右菜单中运行此脚本，它将其识别为测试文件，并恰好运行一次 `MyTestCase` 中的三个测试。\n\
    \n因此，为了执行该测试套，你需要在终端中运行它。\n\n## 15.4 Mock 与补丁 (Patching)\n\n与 Java 不同，得益于 Python\
    \ 的动态类型特性，在 Python 中创建 mock 对象并将其到被测试代码要简单得多。`unittest.mock` 子包提供了创建 mock 和指定其行为的所有工具。它还提供了补丁（patching）功能，允许临时替换模块或类中的属性或函数。\n\
    \n尽管本书的范围不允许对 `unittest.mock` 提供的功能进行全面概述，但我们将在本节中对其一些关键特性进行简要介绍。\n\n### 15.4.1\
    \ 创建 Mock\n\n使用 `unittest.mock`，创建 mock 对象最简单的方法是调用 `Mock()`。生成的对象可以像函数一样调用，也可以作为带有属性和方法的对象访问。\n\
    \n不需要显式指定它所代表的函数名称和返回值，或者它应该包含的属性。每当 mock 对象被调用或查询时，它都会动态地创建另一个 mock 对象并返回它。\n\
    \n此外，可以指定 mock 对象的行为。\n\n通过给其 `return_value` 属性赋值来确定其作为函数的行为，而通过给相应的属性赋值来确定其属性查询的行为。\n\
    \n以下是一个示例：\n\n```python\nfrom unittest.mock import Mock\n\nfunction_mock = Mock()\n\
    function_mock.return_value = 42\n\nresult_1 = function_mock(\"Life\", \"Universe\"\
    )\nresult_2 = function_mock()\n\nprint(result_1, result_2)  # 42 42\n\nobject_mock\
    \ = Mock()\nobject_mock.name = \"Arthur Dent\"\nobject_mock.luggage = \"Towel\"\
    \nobject_mock.great_question = function_mock\n\nresult_3 = object_mock.name\n\
    result_4 = object_mock.luggage\nresult_5 = object_mock.great_question()\n\nprint(result_3,\
    \ result_4, result_5)\n\n# Arthur Dent Towel 42\n```\n\n如 `result_1` 和 `result_2`\
    \ 所示，可以带任意数量的参数调用函数 mock。\n\n还可以验证方法调用的次数以及传递给这些调用的参数。\n\n以下示例中的断言适用于上述场景：\n\n\
    ```python\nfunction_mock.assert_called()\nfunction_mock.assert_any_call(\"Life\"\
    , \"Universe\")\nassert object_mock.great_question.call_count == 3\n```\n\n还有一个\
    \ `Mock` 的子类叫做 `MagicMock`，它与标准函数一起使用时为未配置的属性或函数提供了有用的默认值，例如：\n\n```python\nint(MagicMock())\
    \  # 返回 1\nfloat(MagicMock())  # 返回 1.0\nMagicMock()[5]  # 返回一个 MagicMock 对象\n\
    len(MagicMock())  # 返回 0 !!!\n```\n\n在这些示例中使用 `Mock` 代替 `MagicMock` 将抛出异常。\n\n\
    因此，在需要对不影响测试结果任意值进行 mock 的测试中，`MagicMock` 可以简化 mock 设置。\n\n最后，有一个名为 `side_effect`\
    \ 的属性，你可以为 mock 方法指定它。\n\n它允许你指定一个函数或迭代器，并在 mock 被调用时使用它。该属性对于根据测试输入返回不同的值非常有用。工作原理如下：\n\
    \n- 如果 `side_effect` 设置为函数，则当 mock 被调用时将调用该函数。\n- 如果 `side_effect` 设置为可迭代器（如列表或生成器），则\
    \ mock 每次被调用都会从迭代器中返回值。\n- 如果 `side_effect` 设置为异常，当 mock 被调用时将抛出该异常而不是返回值。\n\n\
    这是一个示例：\n\n```python\nfrom unittest.mock import Mock\n\nfunc_1 = Mock(); func_2\
    \ = Mock(); func_3 = Mock()\nfunc_1.side_effect = lambda x: x + 1\nfunc_2.side_effect\
    \ = range(1, 3)\nfunc_3.side_effect = ValueError(\"Ooops\")\n\nassert func_1(10)\
    \ == 11\nassert func_2() == 1\nassert func_2() == 2\ntry:\n    func_3()\nexcept\
    \ ValueError as e:\n    assert str(e) == \"Ooops\"\n```\n\n### 15.4.2 补丁 (Patching)\n\
    \n为了将被测试代码与其依赖项（如外部库、模块或对象）隔离，`unittest.mock` 提供了一种名为补丁（patching）的机制。虽然涵盖该机制的所有方面超本书的范围，但我们至少将涵盖最重要的功能。\n\
    \n编写测试用例时经常出现的一个任务是 mock requests。这可以使用 `@patch` 装饰器轻松实现。作为一个示例，考虑以下执行简单请求的函数：\n\
    \n```python\n# user_data.py\nimport requests\n\nurl = \"https://api.example.com/users\"\
    \ndef get_user_list():\n    response = requests.get(url)\n    if response.status_code\
    \ == 200:\n        return response.json()\n    else:\n        return None\n```\n\
    \n为了测试该函数在成功和失败请求下的行为，你需要补丁 `requests.get` 调用，如下所示：\n\n```python\nimport unittest\n\
    from unittest.mock import patch, Mock\nfrom user_data import get_user_list\n\n\
    @patch(\"user_data.requests.get\")\nclass TestUserData(unittest.TestCase):\n \
    \   def test_success(self, mock_get):\n        data = [\"John\", \"Jill\", \"\
    Anna\"]\n        json_mock = Mock()\n        json_mock.return_value = data\n \
    \       response_mock = Mock()\n        response_mock.status_code = 200\n    \
    \    response_mock.json = json_mock\n        mock_get.return_value = response_mock\n\
    \        result = get_user_list()\n        self.assertEqual(result, data)\n\n\
    \    def test_failure(self, mock_get):\n        response_mock = Mock()\n     \
    \   response_mock.status_code = 404\n        mock_get.return_value = response_mock\n\
    \        result = get_user_list()\n        self.assertIsNone(result)\n```\n"
- fmt: "\nThis example demonstrates the use of the `@patch` decorator. The decorator\
    \ can be applied to individual test functions or to the entire test class, which\
    \ is equivalent to applying the decorator to every test function within the class.\n\
    \nThe argument to `@patch` is the target specification, which specifies the attribute,\
    \ function or object to be patched as a string representing the import path to\
    \ the object.\n\nIn the example, `user_data.requests.get` specifies the `requests.get`\
    \ function as the target, which has become a part of the `user_data` module through\
    \ the import statement at the beginning of the module.\n\nThe `@patch` decorator\
    \ then creates a mock object for the `requests.get` function and passes it as\
    \ an additional parameter `mock_get` to the test methods.\n\nWithin the test method,\
    \ a mock object is first created to simulate the return value of `requests.get`,\
    \ and this mock object is then set as the `return_value` for the mocked `requests.get`\
    \ function.\n\nPlease note that the target specified for `@patch` is `user_data.requests.get`\
    \ and not `requests.get`.\n\nIn this example, the latter one would have worked\
    \ as well but would have violated a general recommendation for patching: Patch\
    \ where it is used and not where it is defined.\n\nNed Batchelder has written\
    \ an excellent article explaining the reason for this rule on his blog at [https://nedbatchelder.com](https://nedbatchelder.com).\
    \ I encourage you to read the article for a deeper understanding of this principle.\n\
    \n[https://tinyurl.com/y5k8y3ht](https://tinyurl.com/y5k8y3ht)\n\nA more complex\
    \ example is this simple repository, fetching data via network calls from an external\
    \ source and buffering it in a database (The database and remote data implementations\
    \ are omitted as they are not needed for the test.)::\n\n```python\n# repository.py\n\
    \nfrom time import time\n\nfrom model import Database\n\nfrom model import RemoteData\n\
    \n_update_interval = 60.0  # seconds\n\nclass UserRepository:\n\n    def __init__(self):\n\
    \        self._database = Database()\n        self._remote = RemoteData()\n  \
    \      self._last_update = 0.0\n\n    def get_user_list(self):\n        elapsed\
    \ = time() - self._last_update\n        if elapsed > _update_interval:\n     \
    \       self._update_database()\n        return self._database.get_user_list()\n\
    \n    def _update_database(self):\n        data = self._fetch_data()\n       \
    \ self._database.save_user_list(data)\n        self._last_update = time()\n\n\
    \    def _fetch_data(self):\n        return self._remote.user_list()\n```\n\n\
    To test the repository’s behavior at startup in isolation, you need to replace\
    \ the database and remote access. Though not strictly necessary, you may also\
    \ want to replace the real system clock with a mocked clock, allowing you to control\
    \ the time.\n\nHere is an example of how you can do this:\n\n```python\nfrom unittest\
    \ import TestCase\n\nfrom unittest.mock import patch, Mock\n\nfrom repository\
    \ import UserRepository\n\nclass TestUserRepository(TestCase):\n\n    @patch(\"\
    repository.time\")\n    @patch(\"repository.UserRepository._fetch_data\")\n  \
    \  @patch(\"repository.Database\")\n    def test_repository_start(\n         \
    \    self, mock_db, mock_fetch, mock_time):\n\n        current_time = 1709579635\n\
    \        mock_time.return_value = current_time\n        mock_db_inst = Mock()\n\
    \        mock_db.return_value = mock_db_inst\n        data = Mock()\n        mock_fetch.return_value\
    \ = data\n        mock_db_inst.get_user_list.return_value = \\\n            data\n\
    \        repo = UserRepository()\n        user_list = repo.get_user_list()\n \
    \       mock_fetch.assert_called()\n        mock_db_inst.save_user_list.\n   \
    \         assert_called_once_with(data)\n        self.assertEqual(repo._last_update,\
    \ current_time)\n        self.assertEqual(user_list, data)\n```\n\nThis example\
    \ demonstrates a few important features of `@patch`:\n\n- You can attach more\
    \ than one `@patch` decorator to a test function or class.\n- Each decorator adds\
    \ an additional mock as a parameter to the test function. The decorators are stacked,\
    \ meaning that parameters appear in reverse order of the `@patch` statements.\n\
    - The `@patch(\"repository.Database\")` decorator creates a mock for a class,\
    \ which is not the same as a mock for an instance of a class. A class can be called\
    \ as a method, simulating the behavior of the `__init__` constructor.\n- So, these\
    \ two statements:\n  ```python\n  mock_db_inst = Mock()\n  mock_db.return_value\
    \ = mock_db_inst\n  ```\n  have the effect that `Database()` always returns `mock_db_inst`.\n\
    - The `save` method of `Database()` is not mocked explicitly in preparation of\
    \ the test. However, it is still possible to check whether it has been called\
    \ using the statement:\n  ```python\n  mock_db_instance.save.assert_called_once_with(data)\n\
    \  ```\n  This is because calling a mock of an instance with any method automatically\
    \ creates a mock, which then creates an answer and returns it as a result of the\
    \ method call.\n- `@patch(\"repository.UserRepository._fetch_data\")` is an example\
    \ of how to patch an internal method of a class. Since it is an internal function,\
    \ the patch target is both where it is defined and where it is used. Therefore,\
    \ the rule for patching mentioned earlier is not violated in this case.\n\nPlease\
    \ also note that `@patch` cannot handle private functions due to name mangling\
    \ (Name mangling is explained in Chapter 5). If you replace `_fetch_data` with\
    \ `__fetch_data`, the corresponding `@patch` statement will throw an `AttributeError`\
    \ because, due to name mangling, the `__fetch_data` method does not exist at runtime.\n\
    \nAs an alternative to the `@patch` decorator, `unittest.mock` provides a function\
    \ `patch()`, which returns a context manager that can be used with `with` statement.\n\
    \nAdditionally, there is a function `patch.object()`, which allows you to temporarily\
    \ patch an attribute or method of an already instantiated object. This function\
    \ is especially useful you want to patch instance variables created in an `__init__`\
    \ function of a class, as these variables are not yet available at compile time\
    \ and cannot be accessed with `@patch`.\n\nUsing `patch` and `patch.object`, the\
    \ test class for `UserRepository` can be rewritten as follows:\n\n```python\n\
    from unittest import TestCase\nfrom unittest.mock import patch, Mock\nfrom repository\
    \ import UserRepository\n\nclass TestUserRepository(TestCase):\n    def test_repository_start(self):\n\
    \        with patch(\"repository.time\") as mock_time:\n            current_time\
    \ = 1709579635\n            mock_time.return_value = current_time\n          \
    \  repo = UserRepository()\n            with patch.object(repo, \"_database\"\
    ) \\\n                    as mock_db, \\\n                 patch.object(repo,\
    \ \"_remote\") \\\n                    as mock_rem:\n                data = Mock()\n\
    \                mock_rem.user_list.return_value = data\n                mock_db.get_user_list.return_value\
    \ = data\n                user_list = repo.get_user_list()\n                mock_rem.user_list.assert_called()\n\
    \                mock_db.save_user_list.assert_called_once_with(data)\n      \
    \          self.assertEqual(repo._last_update, current_time)\n               \
    \ self.assertEqual(user_list, data)\n```\n"
  raw: 'This example demonstrates the use of the @patch decorator. The decorator can
    be applied to individual test functions or to the entire test class, which is
    equivalent to applying the decorator to every test function within the class.


    The argument to @patch is the target specification, which specifies the attribute,
    function or object to be patched as a string representing the import path to the
    object.


    In the example, user_data.requests.get specifies the requests.get function as
    the target, which has become a part of the user_data module through the import
    statement at the beginning of the module.


    The @patch decorator then creates a mock object for the requests.get function
    and passes it as an additional parameter mock_get to the test methods.


    Within the test method, a mock object is first created to simulate the return
    value of requests.get, and this mock object is then set as the return_value for
    the mocked requests.get function.


    Please note that the target specified for @patch is user_data.requests.get and
    not requests.get.


    In this example, the latter one would have worked as well but would have violated
    a general recommendation for patching: Patch where it is used and not where it
    is defined.


    Ned Batchelder has written an excellent article explaining the reason for this
    rule on his blog at [https://nedbatchelder.com](https://nedbatchelder.com). I
    encourage you to read the article for a deeper understanding of this principle.


    [https://tinyurl.com/y5k8y3ht](https://tinyurl.com/y5k8y3ht)


    A more complex example is this simple repository, fetching data via network calls
    from an external source and buffering it in a database (The database and remote
    data implementations are omitted as they are not needed for the test.):


    # repository.py


    from time import time


    from model import Database


    from model import RemoteData


    _update_interval = 60.0  # seconds


    class UserRepository:


        def __init__(self):


            self._database = Database()


            self._remote = RemoteData()


            self._last_update = 0.0


        def get_user_list(self):


            elapsed = time() - self._last_update


            if elapsed > _update_interval:


                self._update_database()


            return self._database.get_user_list()


        def _update_database(self):


            data = self._fetch_data()


            self._database.save_user_list(data)


            self._last_update = time()


        def _fetch_data(self):


            return self._remote.user_list()


    To test the repository’s behavior at startup in isolation, you need to replace
    the database and remote access. Though not strictly necessary, you may also want
    to replace the real system clock with a mocked clock, allowing you to control
    the time.


    Here is an example of how you can do this:


    from unittest import TestCase


    from unittest.mock import patch, Mock


    from repository import UserRepository


    class TestUserRepository(TestCase):


        @patch("repository.time")


        @patch("repository.UserRepository._fetch_data")


        @patch("repository.Database")


        def test_repository_start(


                self, mock_db, mock_fetch, mock_time):


            current_time = 1709579635


            mock_time.return_value = current_time


            mock_db_inst = Mock()


            mock_db.return_value = mock_db_inst


            data = Mock()


            mock_fetch.return_value = data


            mock_db_inst.get_user_list.return_value = \


                data


            repo = UserRepository()


            user_list = repo.get_user_list()


            mock_fetch.assert_called()


            mock_db_inst.save_user_list.\


                assert_called_once_with(data)


            self.assertEqual(


                repo._last_update, current_time)


            self.assertEqual(user_list, data)


    This example demonstrates a few important features of @patch:


    You can attach more than one @patch decorator to a test function or class.


    Each decorator adds an additional mock as a parameter to the test function. The
    decorators are stacked, meaning that the parameters appear in reverse order of
    the @patch statements.


    The @patch("repository.Database") decorator creates a mock for a class, which
    is not the same as a mock for an instance of a class. A class mock can be called
    as a method, simulating the behavior of the __init__ constructor of the class.


    So, these two statements:


    mock_db_inst = Mock()


    mock_db.return_value = mock_db_inst


    have the effect that Database() always returns mock_db_inst.


    The save method of Database() is not mocked explicitly in the preparation of the
    test case. However, it is still possible to check whether or not it has been called
    using the statement:


    mock_db_instance.save.\


        assert_called_once_with(data)


    This is because calling a mock of an instance with any method automatically creates
    a method mock, which then creates an answer mock and returns it as a result of
    the method call.


    @patch("repository.UserRepository._fetch_data") is an example of how to patch
    an internal method of a class. Since it is an internal function, the patch target
    is both where it is defined and where it is used. Therefore, the rule for patching
    targets mentioned earlier is not violated in this case.


    Please also note that @patch cannot handle private member functions due to name
    mangling (Name mangling is explained in Chapter [5](#part0009.xhtml_a26T): [Object-Oriented
    Programming](#part0009.xhtml_a26T)). If you replace the _fetch_data method with
    __fetch_data, the corresponding @patch statement will throw an AttributeError
    because, due to name mangling, the __fetch_data method does not exist at runtime.


    As an alternative to the @patch decorator, unittest.mock provides a function patch(),
    which returns a context manager that can be used with a with statement.


    Additionally, there is a function named patch.object(), which allows you to temporarily
    patch an attribute or method of an already instantiated object.


    This function is especially useful when you want to patch instance variables created
    in an __init__ function of a class, as these variables are not yet available at
    compile time and cannot be accessed with @patch.


    Using patch and patch.object, the test class for UserRepository can be rewritten
    as follows:


    from unittest import TestCase


    from unittest.mock import patch, Mock


    from repository import UserRepository


    class TestUserRepository(TestCase):


        def test_repository_start(self):


            with patch("repository.time") as mock_time:


                current_time = 1709579635


                mock_time.return_value = current_time


                repo = UserRepository()


                with patch.object(repo, "_database") \


                        as mock_db, \


                     patch.object(repo, "_remote") \


                        as mock_rem:


                    data = Mock()


                    mock_rem.user_list.return_value\


                        = data


                    mock_db.get_user_list.return_value\


                        = data


                    user_list = repo.get_user_list()


                    mock_rem.user_list.assert_called()


                    mock_db.save_user_list.\


                        assert_called_once_with(data)


                    self.assertEqual(


                        repo._last_update, current_time)


                    self.assertEqual(user_list, data)


    Please note the different setup of the test case: Instead of patching the class
    definitions first and then creating the object under test, the object under test
    is created first, and then the attributes of the object are patched afterward.


    Also note that the statement patch.object(repo, "_remote") has the object as a
    patch target, in contrast to patch that has the import path of the class as the
    target.


    ### 15.5 Code Coverage Reports


    As in Java, measuring code coverage in Python tests is crucial for understanding
    how much of your code is exercised by your tests.


    There are several tools available for measuring code coverage in Python, with
    coverage.py being among the most popular ones, which will be described in the
    following.'
