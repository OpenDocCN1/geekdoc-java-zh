  trans: "\n\n此外，`del` 语句可以删除实例变量：\n\n```python\nclass MyClass:\n    def __init__(self):\n\
    \        self.my_attribute = 42\n\n    def remove_attribute(self):\n        del\
    \ self.my_attribute\n\nobj = MyClass()\nprint(obj.my_attribute)  # 42\n\nobj.remove_attribute()\n\
    print(obj.attribute)  # AttributeError\n```\n\n在 Python 中，还有类似于 Java 中静态变量的类变量。这些变量与类本身关联，而不是与类的实例关联。\n\
    \n类变量定义在类定义内部但在任何类方法之外，被类的所有实例共享。\n\n以下是一个示例：\n\n```python\nclass MyClass:\n \
    \   x = \"Hello\"\n    def print_x(self):\n        print(MyClass.x)\n\nobj1 =\
    \ MyClass()\nobj2 = MyClass()\nobj1.print_x()  # Hello\nobj2.print_x()  # Hello\n\
    \nMyClass.x = \"Bye\"\nobj1.print_x()  # Bye\nobj2.print_x()  # Bye\n```\n\n请注意，在上面的示例中\
    \ `del MyClass.x` 也是可能的，它会删除类属性。\n\n与 Java 一样，通过实例对象访问类属性是可能的，但为了清晰和一致，应该避免这样做。\n\
    \n在上面的示例中，语句 `obj1.x = \"Good Morning\"` 是可能的，但会创建一个实例变量 `obj1.x`，因此 `obj1.print_x()`\
    \ 仍然会打印 `x` 的旧值，而不是 \"Good Morning\"。\n\n### 5.2 继承\n\n在 Python 中，通过在子类名称后的括号内指定父类的来定义现有类的子类。\n\
    \n子类继承父类的所有属性和方法，它们可以访问并使用这些继承的成员，就像它们直接定义在子类内部一样。与 Java 不同，Python 不对继承的成员强制执行访问限制，这意味着父类无法阻止子类使用它们。\n\
    \n与 Java 相比，Python 不会在子类构造函数从中自动调用父类的构造函数。\n\n相反，如果子类没有定义自己的构造函数，Python 会自动在父类中查找构造函数。如果找到，则会自动调用。然而，如果子类定义了自己的构造函数，如果需要，则必须显式调用父类构造函数，通常使用\
    \ `super().__init__()`。但这一步不是强制的，这样做不会导致编译错误。\n\n子类可以覆盖父类的方法，而不需要像 Java 那样的 `@override`\
    \ 这样的特殊注解。在子类中重写方法时，可以使用 `super()` 函数来调用父类中被重写的方法。\n\n要确定一个对象是否是某个类的实例或其子类之一，你可以利用\
    \ `isinstance()` 函数。\n\n这里是一个演示所有这些概念用法的代码示例：\n\n```python\nclass Animal:\n  \
    \  def __init__(self, name):\n        self.name = name\n    def sound(self):\n\
    \        pass\n\nclass Cat(Animal):\n    def __init__(self, name, color):\n  \
    \      super().__init__(name)\n        self.color = color\n    def sound(self):\n\
    \        return \"Meow!\"\n\nour_cat = Cat(\"Louis\", \"tabby\")\nprint(our_cat.sound())\
    \  # Meow!\nprint(our_cat.name)  # Louis\nprint(our_cat.color)  # tabby\nprint(isinstance(our_cat,\
    \ Cat))  # True\nprint(isinstance(our_cat, Animal)) # True\n```\n\n### 5.3 多继承\n\
    \n多继承是 Python 支持的一个特性，但它在开发者之间的流行程度不异，通常是一个争议的话题。\n\n尽管如此，多继承被频繁使用，即使在 Python\
    \ 的内置库中也是如此，用于实现面向对象编程中所谓的混入（mixin）的东西：小的、可重用的代码片段，可以被“混合”到多个类中以提供公共功能。因此，我们在这里简要描述多继承。\n\
    \n在 Python 中，多继承通过在子类名称后的括号内列出多个父类来实现。\n\n```python\nclass Animal:\n    def speak(self):\n\
    \        print(\"Animal speaks\")\n\nclass Bird:\n    def fly(self):\n       \
    \ print(\"Bird flies\")\n\nclass Parrot(Animal, Bird):\n    def __init__(self,\
    \ name):\n        self.name = name\n\n    def speak(self):\n        print(f\"\
    {self.name} speaks\")\n\nparrot = Parrot(\"Polly\")\nparrot.speak()\nparrot.fly()\n\
    ```\n\n在 Python 中，方法解析顺序（MRO）决定了搜索类方法的序列。MRO 使用 C3 线性化算法生成，该算法解决了菱继承问题。\n\n以下是一个演示\
    \ MRO 的示例：\n\n```python\nclass A:\n    def method(self):\n        print(\"A\"\
    )\n\nclass B(A):\n    def method(self):\n        print(\"B\")\n\nclass C(A):\n\
    \    def method(self):\n        print(\"C\")\n\nclass D(B, C):\n    def method(self):\n\
    \        print(\"D\")\n\nd = D()\nprint(type(d).__mro__)\n```\n\n### 5.4 访问修饰符\n\
    \n#### 5.4.1 使用 _ 和 __ 前缀\n\n类的受保护成员习惯上通过在其名称前加上单下划线（`_`）表示。虽然这不会强制严格的保护，但它向其他开发者信号，这些成员旨在供类或子类内部使用。\n\
    \nPython 中的私有成员通过在其名称前加上双下划线（`__`）来表示。这种命名约定会触发命名修饰（mangling），使得外部代码访问这些成员变得困难。\n\
    \n命名修饰机制如下：\n\n当类的成员以前双下划线（`__`）开头时，Python 会通过将类名作为前缀内部重命名该成员。此重命名过程发生在编译期间，而不是运行时。例如，如果类\
    \ `MyClass` 有函数 `__func()`，该函数将在编译期间重命名为 `_MyClass__func()`，代码对函数的引用也会相应更新。\n\n\
    被双下划线包围的属性和方法（如 `__name__` 和 `__init__`）不受修饰。这些通常是 Python 标准数据模型的一部分，并在语言中具有特定的、预定义的角色。\n\
    \n```python\nclass MyClass:\n    def __init__(self):\n        self._protected_var\
    \ = 42\n\n    def _protected_method(self):\n        return \"Protected\"\n\n \
    \   def __private_method(self):\n        return \"This is a private method\"\n\
    \nobj = MyClass()\n\n# 这些语句可以编译并运行\n#但在编辑器中会被标记为“访问保护成员”\nprint(obj._protected_var)\
    \  # 42\nprint(obj._protected_method())  # Protected\n\n# 这段代码将抛出 AttributeError\n\
    print(obj.__private_method())\n```\n\n#### 5.4.2 通过装饰器实现 Setter 和 Getter\n\nPython\
    \ 中的装饰器和 Java 中的注解功能 set 相似，但它们的运行方式不同，并且具有不同的语法和功能（装饰器将在第 19 章：元编程中讨论）。\n\nPython\
    \ 提供了装饰器\n\n*   `@property`\n\n*   `@<attr>.setter`\n\n"
- fmt: "\n### `@<attr>.deleter`\n\nfor defining getter, setter, and deleter methods\
    \ for class attributes.\n\nThese decorators provide precise control over attribute\
    \ access while preserving the illusion of direct attribute access.\n\nThe example\
    \ below demonstrates their usage.\n\nPlease note that in this example, the method\
    \ `radius` is overloaded, meaning there are two methods named `radius` with different\
    \ signatures.\n\nPython does not support method overloading in the sense of having\
    \ multiple methods with the same name but different parameters. However, Python’s\
    \ property feature allows to define getters, setters, and deleters for class attributes,\
    \ which can give the appearance of overloading.\n\nThis approach is commonly employed\
    \ alongside property decorators to define getter, setter, and deleter methods\
    \ for a single attribute.\n\n```python\nclass Circle:\n    def __init__(self,\
    \ radius):\n        self.__radius = radius\n\n    @property\n    def radius(self):\n\
    \        return self.__radius\n\n    @radius.setter\n    def radius(self, value):\n\
    \        if value <= 0:\n            raise ValueError(\"Radius must be positive\"\
    )\n        self.__radius = value\n\n    @radius.deleter\n    def radius(self):\n\
    \        del self.__radius\n\ncircle = Circle(5)\nprint(circle.radius)  # 5\n\n\
    circle.radius = 7\nprint(circle.radius)  # 7\n\ndel circle.radius\nprint(circle.radius)\
    \  # AttributeError\n```\n\n### 5.5 Classes as First Class Objects\n\nIn Python,\
    \ everything is an object, including classes themselves. As such, classes are\
    \ instances of the type `class`.\n\nTo obtain the class object of an object, you\
    \ can use the built-in `type()` function.\n\n```python\nx = 42\nprint(type(x))\
    \  # <class 'int'>\n```\n\nOf course, you can use the class definition itself\
    \ to refer to the class object.\n\n```python\nclass MyClass:\n    def __init__(self,\
    \ value):\n        self.x = value\nprint(MyClass)  # <class '__main__.MyClass'>\n\
    ```\n\nYou can also use the `type()` function to dynamically create class objects\
    \ by providing it with a class name, a tuple of base classes, and a dictionary\
    \ of attribute and method names with their corresponding values (Tuples and dictionaries\
    \ will be discussed in Chapter 6).\n\n```python\ndef init_method(self, value):\n\
    \    self.x = value\n\ndef print_all(self):\n    print(self.a, self.x)\n\nname\
    \ = \"MyClass\"\nbase = (object,)\nattributes_and_methods = {\n    \"__init__\"\
    : init_method,\n    \"print\": print_all,\n    \"a\": 1\n}\nMyClass = type(name,\
    \ base, attributes_and_methods)\nobj = MyClass(42)\nobj.print()  # 1 42\n```\n\
    \nIt is also possible to dynamically add a method to a statically defined class.\n\
    \n```python\nclass MyClass:\n    x = 42\n\ndef print_x(self):\n    print(self.x)\n\
    \nMyClass.print_x = print_x\nobj = MyClass()\nobj.print_x()  # 42\n```\n\nFinally,\
    \ you can also add a method to an instance of a class instead to the class itself.\
    \ For this purpose, it is important to understand the distinction between two\
    \ types of methods in Python: bound and unbound.\n\nA **bound method** is a method\
    \ that is associated with a specific instance of a class. Since the instance (`self`)\
    \ is passed as the first argument to the method, it can interact with the instance’s\
    \ attributes and other methods.\n\nOn the other hand, an **unbound method** is\
    \ a standalone function that is not associated with any particular instance, similar\
    \ to a static function in Java.\n\nTo add a function as a method to an instance,\
    \ create a bound method using `types.MethodType`:\n\n```python\nimport types\n\
    \ndef print_x(self):\n    print(self.x)\n\nclass MyClass:\n    def __init__(self,\
    \ value):\n        self.x = value\n\nobj = MyClass(42)\nobj.print = types.MethodType(print_x,\
    \ obj)\nobj.print_unbound = print_x\nobj.print()  # 42\nobj.print_unbound(obj)\
    \  # 42\n```\n\nThe methods of a class that we have discussed so far are instance\
    \ methods, meaning they are executed on an instance of a class. In addition, there\
    \ are two other types of methods: **static methods** and **class methods**, which\
    \ are marked with `@staticmethod` and `@classmethod`, respectively.\n\nSimilar\
    \ to Java, a **static method** is a method that belongs to a class rather than\
    \ any instance. It does not require access to the instance (`self`) or the class\
    \ (`cls`) as a parameter. They are typically used for utility functions that perform\
    \ a task in isolation from the class or instance.\n\n```python\nclass MathUtils:\n\
    \    @staticmethod\n    def add(a, b):\n        return a + b\n\nresult = MathUtils.add(5,\
    \ 3)\nprint(result)  # 8\n```\n\n**Class methods** are instance methods on the\
    \ class object. This means they take a reference to the class (`cls`) as their\
    \ first parameter and can modify class state across all instances of the class.\n\
    \n```python\nclass TimeStamp:\n    @classmethod\n    def set_date(cls, year, month,\
    \ day):\n        cls.year = year\n        cls.month = month\n        cls.day =\
    \ day\n\nTimeStamp.set_date(year=2024, month=5, day=16)\ntime_stamp = TimeStamp()\n\
    print(time_stamp.year)  # 2024\n```\n\n## Chapter 6: Python’s Data Structures\n\
    \nPython offers similar collections and data structures as Java, albeit with some\
    \ differences in implementation and syntax. Both languages provide common data\
    \ structures such as list, maps (diction) and sets. In this chapter, we will explore\
    \ Python’s native data structures, including lists, dictionaries, sets.\n\n###\
    \ 6.1 Lists\n\nSimilar to Java, Python lists allow you to store and manipulate\
    \ collections of items in an ordered sequence. Lists are mutable, meaning their\
    \ elements can be modified after creation. Python lists are heterogeneous, capable\
    \ of holding elements of any type, including other lists or custom objects. Like\
    \ Java, the positions in a Python list are zero-indexed, meaning the first element\
    \ of a list has position zero. It is also possible to use negative indices starting\
    \ with `-1` from the end of the list.\n\nPython supports various list operators\
    \ and methods for manipulating lists. The code sample demonstrates some common\
    \ list operators and methods.\n\n```python\n# Creating an empty list\nmy_empty_list\
    \ = []\n\n# Creating a list\nmy_list = [1, 2, 3, 4]\nprint(my_list[0])  # 1\n\
    print(my_list[-1])  # 4\nprint(my_list + [5, 6])  # [1, 2, 3, 4, 5, 6]\nprint([1,\
    \ 2] * 3)  # [1, 2, 1, 2, 1, 2]\nprint(1 in my_list)  # True\nprint(7 not in my_list)\
    \  # True\nprint(len(my_list))  # 4\n\none, two, three, four = my_list\nprint(one,\
    \ two, three, four)  # 1 2 3 4\n\nfirst, *rest = my_list\nprint(first, rest) \
    \ # 1 [2, 3, 4]\n\nindex = my_list.index(3)\nprint(index)  # 2\n\nmy_list.append(\"\
    Hello\")\nprint(my_list)  # [1, 2, 3, 4, 'Hello']\n\ndel my_list[4]\nprint(my_list)\
    \  # [1, 2, 3, 4]\n\nmy_list.insert(2, 6)\nprint(my_list)  # [1, 2, 6, 3, 4]\n\
    \ntop = my_list.pop()\nprint(top, my_list)  # 4 [1, 2, 6, 3]\n\nmy_list.reverse()\n\
    print(my_list)  # [3, 6, 2, 1]\n\nmy_list.sort()\nprint(my_list)  # [1, 2, 3,\
    \ 6]\n\nmy_list.clear()\nprint(my_list)  # []\n\ncount = [1, 2, 2, 2, 3].count(2)\n\
    print(count)  # 3\n```\n\nIn contrast to Java, Python does not have arrays. Instead,\
    \ lists of a fixed length are used. Multidimensional arrays can be replaced with\
    \ nested lists:\n\n```python\nnested_list = [[1, 2, 3], [3, 4, 6]]\nprint(nested_list[1][1])\
    \  # 4\n```\n\nFor generating longer lists with predefined values, Python has\
    \ a feature called list comprehension. It generates the list elements from a `for`\
    \ clause, and optionally, additional `for` or `if` clauses.\n\n```python\n# List\
    \ comprehension to generate a list of squared numbers\nsquares = [x ** 2 for x\
    \ in range(1, 5)]\nprint(squares)  # [1, 4, 9, 16]\n\n# List comprehension to\
    \ generate squares of even numbers\neven_squares = [x**2 for x in range(1, 10)\
    \ if x % 2 == 0]\nprint(even_squares)  # [4, 16, 36, 64]\n\n# List comprehension\
    \ with two for statements\npairs = [f\"{x}{y}\" for x in range(1, 3)]\n```\n"
  raw: '*   @<attr>.deleter


    for defining getter, setter, and deleter methods for class attributes.


    These decorators provide precise control over attribute access while preserving
    the illusion of direct attribute access.


    The example below demonstrates their usage.


    Please note that in this example, the method radius is overloaded, meaning there
    are two methods named radius with different signatures.


    Python does not support method overloading in the sense of having multiple methods
    with the same name but different parameters. However, Python’s property feature
    allows to define getters, setters, and deleters for class attributes, which can
    give the appearance of overloading.


    This approach is commonly employed alongside property decorators to define getter,
    setter, and deleter methods for a single attribute.


    class Circle:


        def __init__(self, radius):


            self.__radius = radius


        @property


        def radius(self):


            return self.__radius


        @radius.setter


        def radius(self, value):


            if value <= 0:


                raise ValueError(


                    "Radius must be positive")


            self.__radius = value


        @radius.deleter


        def radius(self):


            del self.__radius


    circle = Circle(5)


    print(circle.radius)  # 5


    circle.radius = 7


    print(circle.radius)  # 7


    del circle.radius


    print(circle.radius)  # AttributeError


    ### 5.5 Classes as First Class Objects


    In Python, everything is an object, including classes themselves. As such, classes
    are instances of the type class.


    To obtain the class object of an object, you can use the built-in type() function.


    x = 42


    print(type(x))  # <class ’int’>


    Of course, you can use the class definition itself to refer to the class object.


    class MyClass:


        def __init__(self, value):


            self.x = value


    print(MyClass)  # <class ’__main__.MyClass’>


    You can also use the type() function to dynamically create class objects by providing
    it with a class name, a tuple of base classes, and a dictionary of attribute and
    method names with their corresponding values (Tuples and dictionaries will be
    discussed in Chapter [6](#part0010.xhtml_a26S): [Python’s Data Structures](#part0010.xhtml_a26S).).


    def init_method(self, value):


        self.x = value


    def print_all(self):


        print(self.a, self.x)


    name = "MyClass"


    base = (object,)


    attributes_and_methods = {


        "__init__": init_method,


        "print": print_all,


        "a": 1}


    MyClass = type(name, base, attributes_and_methods)


    obj = MyClass(42)


    obj.print()  # 1 42


    It is also possible to dynamically add a method to a statically defined class.


    class MyClass:


        x = 42


    def print_x(self):


        print(self.x)


    MyClass.print_x = print_x


    obj = MyClass()


    obj.print_x()  # 42


    Finally, you can also add a method to an instance of a class instead to the class
    itself. For this purpose, it is important to understand the distinction between
    two types of methods in Python: bound and unbound.


    A bound method is a method that is associated with a specific instance of a class.
    Since the instance (self) is passed as the first argument to the method, it can
    interact with the instance’s attributes and other methods.


    On the other hand, an unbound method is a standalone function that is not associated
    with any particular instance, similar to a static function in Java.


    To add a function as a method to an instance, create a bound method using types.MethodType:


    import types


    def print_x(self):


        print(self.x)


    class MyClass:


        def __init__(self, value):


            self.x = value


    obj = MyClass(42)


    obj.print = types.MethodType(print_x, obj)


    obj.print_unbound = print_x


    obj.print()  # 42


    obj.print_unbound(obj)  # 42


    The methods of a class that we have discussed so far are instance methods, meaning
    they are executed on an instance of a class.


    In addition, there are two other types of methods: static methods and class methods,
    which are marked with the decorators (Decorators will be discussed in Chapter
    [19](#part0025.xhtml_a26J): [Meta-Programming](#part0025.xhtml_a26J).) @staticmethod
    and @classmethod, respectively.


    Similar to Java, a static method is a method that belongs to a class rather than
    any instance of the class. It does not require access to the class or its instances,
    so it neither takes a reference to the instance (self) nor to the class (cls)
    as a parameter.


    They are typically used for utility functions that perform a task in isolation
    from the class or instance data.


    class MathUtils:


        @staticmethod


        def add(a, b):


            return a + b


    result = MathUtils.add(5, 3)


    print(result)  # 8


    Class methods are instance methods on the class object. This means they take a
    reference to the class object as their first parameter (cls) and can modify the
    class state that applies across all instances of the class.


    They can be used for various purposes, such as setting configuration parameters
    of a class:


    class TimeStamp:


        @classmethod


        def set_date(cls, year, month, day):


            cls.year = year


            cls.month = month


            cls.day = day


    TimeStamp.set_date(year=2024, month=5, day=16)


    time_stamp = TimeStamp()


    print(time_stamp.year)  # 2024


    ## Chapter 6


    Python’s Data Structures


    Python offers similar collections and data structures as Java, albeit with some
    differences in implementation and syntax. Both languages provide common data structures
    such as list, maps (called dictionaries in Python) and sets, among others.


    In this chapter, we will explore Python’s native data structures, including lists,
    dictionaries, sets, tuples and more.


    ### 6.1 Lists


    Similar to Java, Python lists allow you to store and manipulate collections of
    items in an ordered sequence.


    Lists are mutable, meaning their elements can be modified after creation. Python
    lists are heterogeneous, capable of holding elements of any data type, including
    other lists or custom objects.


    Like Java, the positions in a Python list are zero-indexed, meaning the first
    element of a list has the position zero. It is also possible to use negative indices
    starting with -1 from the end of the list.


    Python supports various list operators and methods for manipulating lists. The
    code sample below demonstrates some common list operators and methods.


    # Creating an empty list


    my_empty_list = []


    # Creating a list


    my_list = [1, 2, 3, 4]


    print(my_list[0])  # 1


    print(my_list[-1])  # 4


    print(my_list + [5, 6])  # [1, 2, 3, 4, 5, 6]


    print([1, 2] * 3)  # [1, 2, 1, 2, 1, 2]


    print(1 in my_list)  # True


    print(7 not in my_list)  # True


    print(len(my_list))  # 4


    one, two, three, four = my_list


    print(one, two, three, four)  # 1 2 3 4


    first, *rest = my_list


    print(first, rest)  # 1 [2, 3, 4]


    index = my_list.index(3)


    print(index)  # 2


    my_list.append("Hello")


    print(my_list)  # [1, 2, 3, 4, ’Hello’]


    del my_list[4]


    print(my_list)  # [1, 2, 3, 4]


    my_list.insert(2, 6)


    print(my_list)  # [1, 2, 6, 3, 4]


    top = my_list.pop()


    print(top, my_list)  # 4 [1, 2, 6, 3]


    my_list.reverse()


    print(my_list)  # [3, 6, 2, 1]


    my_list.sort()


    print(my_list)  # [1, 2, 3, 6]


    my_list.clear()


    print(my_list)  # []


    count = [1, 2, 2, 2, 3].count(2)


    print(count)  # 3


    In contrast to Java, Python does not have arrays. Instead, lists of a fixed length
    are used.


    Multidimensional arrays can be replaced with nested lists:


    nested_list = [[1, 2, 3], [3, 4, 6]]


    print(nested_list[1][1])  # 4


    For generating longer lists with predefined values, Python has a feature called
    list comprehension.


    It generates the list elements from a for clause, and optionally, additional for
    or if clauses.


    # List comprehension to generate a list


    # of squared numbers


    squares = [x ** 2 for x in range(1, 5)]


    print(squares)  # [1, 4, 9, 16]


    # List comprehension to generate squares


    # of even numbers


    even_squares = [x**2 for x in range(1, 10)


                    if x % 2 == 0]


    print(even_squares)  # [4, 16, 36, 64]


    # List comprehension with two for statements


    pairs = [f"{x}{y}" for x in range(1, 3)'
