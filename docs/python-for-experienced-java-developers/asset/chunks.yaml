- fmt: "\n### 12.3.2 Creating requirements.txt\n\nIn addition to manually creating\
    \ a `requirements.txt` file, you can utilize command-line tools such as `pip`\
    \ or utilize IDE features like the one provided by `IntelliJ IDEA`, to automatically\
    \ generate the file.\n\nBefore proceeding, please ensure that the virtual environment\
    \ containing the dependencies you wish to record is activated.\n\nTo generate\
    \ `requirements.txt` using `pip`, use the following command:\n\n```bash\npip freeze\
    \ > requirements.txt\n```\n\nThis command will create a `requirements.txt` file\
    \ in your project directory containing all the installed packages and their exact\
    \ versions.\n\nAlternatively you can create `requirements.txt` in `IntelliJ IDEA`\
    \ by following these steps:\n\n1. From the `Tools` menu, select `Sync Python Requirements....`.\n\
    2. In the opened dialog, you can specify the name of the file (by default, it\
    \ is set to `requirements.txt`), the version type (such as no version, exact version,\
    \ minimum version, or compatible releases), and a few other options like removing\
    \ unused packages.\n3. Click `OK` to create the file.\n\n### 12.3.3 Installing\
    \ requirements.txt\n\nTo install the dependencies specified in `requirements.txt`\
    \ from the command line, use the following `pip` command:\n\n```bash\npip install\
    \ -r requirements.txt\n```\n\nThis command instructs `pip` to install all the\
    \ packages listed in the `requirements.txt` file along with their specified versions.\n\
    \nIn `IntelliJ IDEA`, when you open `requirements.txt` or a Python file within\
    \ a project containing `requirements.txt`, `IntelliJ IDEA` checks whether all\
    \ the packages specified in `requirements.txt` are installed for the current virtual\
    \ environment. If any packages are missing, a notification bar appears at the\
    \ top of the editor, offering to install the missing requirements.\n\nNote that\
    \ for this the `Unsatisfied package requirements` inspection needs to be enabled,\
    \ which is enabled by default. You can find this inspection under `Settings` →\
    \ `Editor` → `Inspections`.\n\n# Chapter 13: Executing Python Code\n\nBefore exploring\
    \ the creation of external code distributions, it is important to understand the\
    \ process of compiling and running code in Python.\n\nUnlike `Java`, where a separate\
    \ compilation step is required to generate bytecode, Python dynamically generates\
    \ bytecode on-the-fly when executing a Python program.\n\nHere is a brief overview\
    \ of the process:\n\n- **Compilation**: The Python interpreter compiles the source\
    \ code of a Python file into bytecode and stores it in a file with the same name\
    \ but ending in `.pyc`.\n- **Interpretation**: The Python Virtual Machine (`PVM`)\
    \ reads the bytecode instructions from the `.pyc` files and executes them sequentially.\n\
    \nWhen you run a Python script or load a module, the interpreter checks if there\
    \ is already a compiled bytecode file (`.pyc`) corresponding to the source code\
    \ (`.py`) and if the source code has not been modified since the bytecode was\
    \ created. \n\nIf both conditions are met, the interpreter can reuse the existing\
    \ bytecode file, skipping the compilation step and directly executing the bytecode.\n\
    \nProvided that the code in a `.py` file has been written in a platform-independent\
    \ way (for example, by using a delimiter in file paths imported from a platform\
    \ package), the bytecode in the `.pyc` file is platform-independent.\n\nHowever,\
    \ the `.pyc` code depends on the Python version, and Python makes no guarantee\
    \ about bytecode compatibility between versions.\n\nAdditionally, it is possible\
    \ to have modules written in languages other than Python, such as `C++`. These\
    \ modules are called `extension modules`. They typically consist of compiled binary\
    \ code in a platform-specific format (for example, `DLLs` for Windows, `shared\
    \ libraries` for Linux, `macOS`) and provide a certain set of functions and data\
    \ structures in a format defined by Python.\n\nThis enables the Python interpreter\
    \ to convert standard import statements and function calls from Python modules\
    \ into native code calls of the extension module. Integrating external modules\
    \ into a Python project requires additional IDE and tool support, which is beyond\
    \ the scope of this book.\n\n# Chapter 14: External Code Distribution\n\nUnlike\
    \ `Java`s `JAR` files, Python offers a range of packaging options for external\
    \ distributions, each suited to different scenarios.\n\nDescribing all of them\
    \ is beyond the scope of this book. Instead, we will focus on one set of configuration\
    \ files and tools in the following sections, which should cover the most common\
    \ scenarios for external distributions.\n\n### 14.1 Python Code Package Types\n\
    \nPython code can be packaged into several types of archives, but the most common\
    \ formats are `sdist` and `wheel`.\n\nA `wheel` file contains pre-built artifacts\
    \ for the target system, making installation straightforward by copying its contents\
    \ to the appropriate directories and processing metadata such as dependencies.\
    \ Typically, a `wheel` includes uncompiled `.py` files for Python modules, compiled\
    \ extension modules for the target platform, and additional data files and metadata.\n\
    \nSince Python modules are compiled at execution time, different platforms require\
    \ different `wheels`, mainly for extension modules or when compatibility with\
    \ both Python 2 and 3 is necessary.\n\nOn the other hand, an `sdist` (source distribution)\
    \ file contains the source code for extension modules, and may include configuration\
    \ files like `setup.py` for setting up the distribution. When installing from\
    \ an `sdist` file, extension modules are compiled during the installation process\
    \ on the target platform.\n\nWhile `wheel` files are preferred for production\
    \ environments due to their pre-built nature, `sdist` files are useful when a\
    \ suitable `wheel` is unavailable or for distributing test cases without bloating\
    \ a production wheel. It is common practice to publish projects in both formats\
    \ simultaneously on platforms like `PyPI`.\n\nAdditionally, there are specialized\
    \ or less commonly used formats tailored to specific use cases or environments:\n\
    \n- **Conda Package (`.conda`)**: `Conda` packages are a distribution format used\
    \ by the `Conda` package manager, typically associated with the `Anaconda` distribution.\
    \ They contain contents similar to those found in a `wheel` file.\n- **Docker\
    \ Containers**: Python Docker containers used for software distribution via `Docker`\
    \ are typically based on official Python Docker images provided by `Docker Hub`\
    \ or other reputable sources. These official images serve as the foundation for\
    \ Python Docker containers, containing the core Python runtime environment along\
    \ with additional libraries or dependencies.\n\nThe following section will provide\
    \ detailed instructions on how to create `sdist` and `wheel` packages.\n\n###\
    \ 14.2 Package Creation\n\nBefore creating a package file, ensure your project\
    \ includes the key components: a well-organized structure, comprehensive documentation,\
    \ thorough test scripts, specified dependencies, a `README` file, and a `LICENSE`.\n\
    \nThe process of creating a package then involves two main steps:\n\nFirst, creating\
    \ the `setup.py` file to define package metadata and configuration, and then compiling\
    \ the package to generate distributable package files.\n\nThere are various tools\
    \ available for package creation in Python, with `distutils` and `setuptools`\
    \ being among the most popular choices. While `distutils` comes bundled with Python\
    \ itself, this is not always the case for `setuptools`, and other tools definitely\
    \ require separate installation.\n\nIt is important to install the chosen tool\
    \ before writing the `setup.py` file because the file typically imports functions\
    \ specific to the chosen tool, such as the `setup()` function in `setuptools`\
    \ and `distutils`. In our case, we will use `setuptools`.\n\nIt is worth mentioning\
    \ that `setuptools` also supports other configuration files, such as `setup.cfg`\
    \ or `pyproject.toml`, although these alternatives will not be explained in this\
    \ book.\n\n#### 14.2.1 Creating setup.py\n\nIn this section, we will demonstrate\
    \ the creation of a `setup.py` file.\n"
