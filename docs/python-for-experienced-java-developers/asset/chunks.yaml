    \n## 19.5.2 `inspect` 模块\n\nPython 中的 `inspect` 模块类似于 Java 的反射 API，它允许你检查对象的结构和成员变量。\n\
    \n解释该模块提供的完整功能将超出本书的范畴。相反，这里有两个演示常见任务的示例。\n\n### 记录方法调用\n\n此示例展示了如何为对象的每个方法调用自动添加日志。在编写测试代码时，自动封装方法通常有用。\n\
    \n```python\nimport inspect\n\ndef add_logging(obj):\n    for name, value in inspect.getmembers(\n\
    \            obj, inspect.ismethod):\n        setattr(obj, name, add_logger(value))\n\
    \ndef add_logger(meth):\n    def wrapper(*args, **kwargs):\n        print(f\"\
    *** Calling method: {meth.__name__}\")\n        return meth(*args, **kwargs)\n\
    \    return wrapper\n\nclass MyClass:\n    def __init__(self, value):\n      \
    \  self.value = value\n    def print_value(self):\n        print(f\"value = {self.value}\"\
    )\n\nmy_object = MyClass(42)\nadd_logging(my_object)\nmy_object.print_value()\n\
    # *** Calling method: print_value\n# value = 42\n```\n\n`inspect.getmembers()`\
    \ 函数检索对象的所有成员。该对象可以是实例、类、模块或 Python 中的任何类型对象。成员可以是方法、属性、属性或对象可以拥有的任何其他类型的成员。\n\
    \n`inspect.getmembers()` 返回一个元组列表，每个元组包含两个元素：成员的名称和成员的值。\n\n`inspect.getmembers()`\
    \ 的参数是待检查的对象，以及一个可选的用于过滤成员的谓词函数。\n\n`inspect.ismethod()` 是一个谓词函数，如果其参数是绑定方法，则返回\
    \ `True`。\n\n`inspect` 模块提供了其他谓词函数，例如：\n- `inspect.isfunction()` 用于函数\n- `inspect.isbuiltin()`\
    \ 用于内置函数，如 `__new__()`。\n\n### 创建 Mock（模拟）\n\n此示例演示了如何通过将所有方法替换为虚拟方法来为类创建 mock。它根据返回类型提示返回值：`int`\
