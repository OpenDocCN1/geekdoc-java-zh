    ### 6.6 Equality


    In Python, equality for lists, tuples, dictionaries, and sets is based on their
    contents:


    *   Lists and tuples are considered equal if they contain the same elements in
    the same order.


    *   Dictionaries are considered equal if they have the same key-value pairs.


    *   Sets are considered equal if they contain the same elements.


    The elements are compared using the == operator to determine if they are equal.


    ### 6.7 Iterators and Generator Functions


    In Python, an iterator is an object that implements two methods:


    __next__(): This method returns the next item in the stream of data. If there
    are no more items, it raises a StopIteration exception (Exceptions will be explained
    in Chapter [7](#part0011.xhtml_a26M): [Exceptions](#part0011.xhtml_a26M).).


    __iter__(): This method returns the iterator object itself. It enables an iterator
    to be used in a context where an iterable is expected, such as in a for loop.


    Lists, tuples, dictionaries, and sets in Python implement only the __iter__()
    method, which is responsible for creating an iterator when called. These objects
    do not implement the __next__() method directly.


    Instead, Python’s for loops use the iter() function (which calls the object’s
    __iter__() method) to obtain an iterator, and then repeatedly call next() on the
    iterator to fetch elements sequentially.


    Conversely, functions like list(), tuple(), dict(), and set() convert iterators
    into their corresponding data structures. Here is an example for all this:


    class MyIterator:


        def __init__(self, limit):


            self.limit = limit


            self.current = 0


        def __iter__(self):


            return self


        def __next__(self):


            if self.current < self.limit:


                self.current += 1


                return self.current


            else:


                raise StopIteration


    for x in MyIterator(4):  # 1 2 3 4


        print(x)


    my_list = list(MyIterator(4))


    print(my_list)  # [1, 2, 3, 4]


    my_tuple = tuple(MyIterator(4))


    print(my_tuple)  # (1, 2, 3, 4)


    my_set = set(MyIterator(4))


    print(my_set)  # {1, 2, 3, 4}


    # You have to use enumerate for dict()


    my_dict = dict(enumerate(MyIterator(4)))


    print(my_dict)  # {0: 1, 1: 2, 2: 3, 3: 4}


    Note that there is an alternative way to define iterators in Python by using a
    construct called a generator function.


    Generator functions are regular functions that use a yield statement to provide
    the next element in the sequence.


    def my_iterator(limit):


        for i in range(1, limit+1):


            yield i


    for x in my_iterator(4):  # 1 2 3 4


        print(x)


    print(list(my_iterator(4)))  # [1, 2, 3, 4]


    Generator functions automatically manage their state between yield statements,
    enabling them to resume execution from where they left off. This simplifies the
    implementation of complex iteration logic.


    ### 6.8 Context Managers


    Context managers in Python streamline resource management and controlled setup
    and cleanup actions. They are typically used with the with statement, which is
    similar to Java’s try-with-resources statement.


    Here is an example:


    with open("example.txt", "r") as file:


        data = file.read()


    In this example, the open function returns a context manager that manages the
    file resource (File handling will be discussed in Chapter [8](#part0012.xhtml_a26U):
    [Basic File Handling](#part0012.xhtml_a26U)). The with statement ensures that
    the file is properly opened and closed, even if an exception occurs while reading
    the file.


    You can create a custom context manager by defining __enter__ and __exit__ methods
    in a class.


    Here is an example:


    class MyContextManager:


        def __enter__(self):


            print("__aenter__ called")


            self.data = [1, 2, 3, 4, 5]


            return self


        def __exit__(self, exc_type, exc_value,


                     traceback):


            print("__aexit__ called")


            del self.data


    with MyContextManager() as manager:


        print(manager.data)


    # __aenter__ called


    # [1, 2, 3, 4, 5]


    # __aexit__ called


    The __enter__ method of a context manager is responsible for setting up the context
    and returning the object that will be used within the with statement block.


    It is called automatically when entering the with block.


    The __exit__ method of a context manager is responsible for performing cleanup
    actions and handling any exceptions that occur within the context managed by the
    with statement.


    It is called automatically when exiting the with block, whether due to normal
    execution or an exception.


    In case an exception (Exceptions will be discussed in Chapter [7](#part0011.xhtml_a26M):
    [Exceptions](#part0011.xhtml_a26M).) occurs during the execution of the with block,
    the exc_type, exc_value, and traceback parameters hold the class of the exception,
    the exception itself, and the exception’s traceback attribute, respectively.


    All parameters will be None if no exception occurred.


    ## Chapter 7


    Exceptions


    Exception creation and handling share common concepts in both Python and Java,
    such as try-except blocks and exception classes.


    In this chapter, we will explore these similarities and differences in more detail.


    ### 7.1 Standard Exceptions


    Python comes with a variety of built-in exceptions that cover common error cases.
    Some of the commonly used standard exceptions include:


    TypeError: Raised when an operation or function is applied to an object of inappropriate
    type.


    ValueError: Raised when an operation or function receives a correct type but an
    inappropriate value.


    ZeroDivisionError: Raised when the second operand of a division or modulo operation
    is zero.


    IndexError: Raised when a sequence index is out of range.


    KeyError: Raised when a dictionary key is not found.


    FileNotFoundError: Raised when a file or directory is requested but cannot be
    found.


    AttributeError: Raised when attempting to access an attribute or method that doesn’t
    exist or is not accessible within the context of the object.


    These exceptions are raised by Python’s built-in functions, but they can also
    be raised by custom code.


    def divide(x, y):


        if y == 0:


            raise ValueError("Zero Divisor")


        return x / y


    In Python, most built-in exceptions inherit from the Exception class, which itself
    inherits from the BaseException class. The BaseException class has several standard
    attributes. Here are a few important ones:


    args: This attribute is set automatically when an exception object is created.
    It contains a tuple of arguments passed to the exception constructor.


    Typically, the args tuple contains one or more values that provide additional
    information about the exception. These values are often descriptive messages or
    data relevant to the specific error condition that caused the exception to be
    raised.


    For example, when raising a ValueError, the args tuple may contain a message indicating
    why the value is considered invalid.


    This is equivalent to the message string that can be passed as a parameter to
    the constructor of a Java exception.


    __traceback__: This attribute is set automatically by the Python interpreter when
    an exception occurs. It contains the traceback associated with the exception.'
