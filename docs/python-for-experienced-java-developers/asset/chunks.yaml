    #### 19.3.2 Object Comparison


    In Python, you can customize the default behavior of comparison operators such
    as ==, <=, !=, etc., by overriding the corresponding special methods:


    __eq__(self, other): Equality (==)


    __ne__(self, other): Inequality (!=)


    __lt__(self, other): Less than (<)


    __le__(self, other): Less than or equal to (<=)


    __gt__(self, other): Greater than (>)


    __ge__(self, other): Greater than or equal to (>=)


    The only operators that are implemented for all classes in Python are == and !=.


    == by default checks if the two objects are the same instance. If != is not defined
    for a class, it is automatically derived from __eq__ by inverting its result.
    If __eq__ returns True, __ne__ will return False, and vice versa.


    Therefore, it is usually sufficient to override only __eq__.


    If you try to use the other operators (<, <=, >, >=) on an object of a class that
    does not implement the corresponding special methods, Python will raise a TypeError.


    Python is able to replace any of these operators by deriving it from its reverse
    operator. For example, it can replace a <= b with b >= a, but it cannot combine
    operators, such as replacing a <= b with a < b or a == b.


    The following example shows a minimum set of special methods that need to be defined
    so that all comparison operators work:


    class Point:


        def __init__(self, x, y):


            self.x = x


            self.y = y


        def __eq__(self, other):


            return (


                self.x == other.x and self.y == other.y


            )


        def __lt__(self, other):


            return (


                self.x < other.x and self.y < other.y


            )


        def __le__(self, other):


            return (


                self.x <= other.x and self.y <= other.y


            )


        def __hash__(self):


            return hash((self.x, self.y))


    point1 = Point(2, 3)


    point2 = Point(5, 7)


    point3 = Point(2, 3)


    print(point1 == point3)  # True


    print(point1 <= point3)  # True


    print(hash(point1) == hash(point3))  # True


    print(point1 == point2)  # False


    print(point1 < point2)  # True


    print(point2 >= point3)  # True


    As demonstrated in the example above, it is a good practice in Python, similar
    to Java, to override the __hash__ function if you have overridden the __eq__ operator.
    You can use the built-in hash() function to compute a hash value.


    The hash() function can handle only immutable types of objects. Immutable types
    are those whose state cannot be modified after creation. Examples of immutable
    types include integers, floats, strings, tuples, and frozensets.


    Mutable types, such as lists, dictionaries, and sets, cannot be hashed directly
    because their state can change after creation.


    #### 19.3.3 Attribute Access


    The __getattr__ method is invoked when an attribute is accessed but not found.
    It can either raise an exception or return a value as the result of the attribute
    access.


    The __setattr__ method is invoked when an attribute is set. It can then set the
    attribute by calling the __setattr__ method of its superclass. Directly setting
    the attribute within __setattr__ is not possible as this would call __setattr__
    again, resulting in an infinite recursion loop.


    Here is an example:


    class MyClass:


        def __getattr__(self, name):


            return f"{name} not found"


        def __setattr__(self, name, value):


            print(f"{name} set to {value}")


            super().__setattr__(name, value)


    obj = MyClass()


    print(obj.unknown_attr)  # unknown_attr not found


    obj.my_attr = 42  # my_attr set to 42


    #### 19.3.4 Indexing Protocol


    In Python, protocols define a set of methods or attributes that objects can implement
    to achieve a specific interaction or behavior. They provide a flexible way to
    establish contracts between different parts of a program without relying on inheritance.


    Protocols are not explicitly enforced by the language but serve as informal agreements
    or conventions. (Please note that the Python standard PEP 544 introduces a more
    formal approach to protocols in Python. It introduces the concept of protocol
    classes, which are abstract base classes that specify the expected methods and
    attributes of objects that conform to a particular protocol. However, this formalization
    of protocols will not be discussed in this book.)


    In contrast, Java uses interfaces to achieve similar goals. Interfaces define
    a set of methods that classes must implement to adhere to a certain behavior or
    functionality.


    While the terminology differs, the underlying concept of defining contracts for
