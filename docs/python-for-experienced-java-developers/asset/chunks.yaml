  trans: "\n此示例演示了 `@patch` 装饰器的用法。该装饰器可以应用于单个测试函数，也可以应用于整个测试类，后者等同于对类中的每一个测试函数应用装饰器。\n\
    \n`@patch` 的参数是目标规范（target specification），它以表示对象导入路径的字符串指定要补丁的属性、函数或对象。\n\n在示例中，`user_data.requests.get`\
    \ 指定 `requests.get` 函数为目标，该函数通过模块开头的导入语句成为了 `user_data` 模块的一部分。\n\n`@patch` 装饰器会为\
    \ `requests.get` 函数创建一个 mock 对象（mock object），并作为额外参数 `mock_get` 传递给测试方法。\n\n在测试方法内部，首先创建一个\
    \ mock 对象来模拟 `requests.get` 的返回值，然后将该 mock 对象设置为被模拟的 `requests.get` 函数的 `return_value`。\n\
    \n请注意，`@patch` 指定的目标是 `user_data.requests.get` 而不是 `requests.get`。\n\n在这个示例中，后者也可以运行，但它违反了补丁的一般建议：在对象被使用的地方进行补丁，而不是在它定义的地方。\n\
    \nNed Batchelder 在他的博客 [`nedbatchelder.com`](https://nedbatchelder.com) 上写过非常非常优秀的文章解释了这一规则的原因。我鼓励你阅读这篇文章以更深地理解这一原则。\n\
    \n[`tinyurl.com/y5k8y3ht`](https://tinyurl.com/y5k8y3ht)\n\n一个更复杂的示例是这个简单的仓库，它通过网络调用从外部源获取数据并缓冲在数据库中（省略了数据库和远程数据的实现，因为测试不需要它们）：\n\
    \n```python\n# repository.py\n\nfrom time import time\n\nfrom model import Database\n\
    \nfrom model import RemoteData\n\n_update_interval = 60.0  # seconds\n\nclass\
    \ UserRepository:\n\n    def __init__(self):\n        self._database = Database()\n\
    \        self._remote = RemoteData()\n        self._last_update = 0.0\n\n    def\
    \ get_user_list(self):\n        elapsed = time() - self._last_update\n       \
    \ if elapsed > _update_interval:\n            self._update_database()\n      \
    \  return self._database.get_user_list()\n\n    def _update_database(self):\n\
    \        data = self._fetch_data()\n        self._database.save_user_list(data)\n\
    \        self._last_update = time()\n\n    def _fetch_data(self):\n        return\
    \ self._remote.user_list()\n```\n\n为了隔离地测试仓库启动时的行为，你需要替换数据库和远程访问。虽然不是严格必要的，但你可能希望将真实的系统时钟替换为\
    \ mock 时钟，以便你控制时间。\n\n以下是如何实现此示例：\n\n```python\nfrom unittest import TestCase\n\
    \nfrom unittest.mock import patch, Mock\n\nfrom repository import UserRepository\n\
    \nclass TestUserRepository(TestCase):\n\n    @patch(\"repository.time\")\n   \
    \ @patch(\"repository.UserRepository._fetch_data\")\n    @patch(\"repository.Database\"\
    )\n    def test_repository_start(\n             self, mock_db, mock_fetch, mock_time):\n\
    \n        current_time = 1709579635\n        mock_time.return_value = current_time\n\
    \        mock_db_inst = Mock()\n        mock_db.return_value = mock_db_inst\n\
    \        data = Mock()\n        mock_fetch.return_value = data\n        mock_db_inst.get_user_list.return_value\
    \ = \\\n            data\n        repo = UserRepository()\n        user_list =\
    \ repo.get_user_list()\n        mock_fetch.assert_called()\n        mock_db_inst.save_user_list.\n\
    \            assert_called_once_with(data)\n        self.assertEqual(repo._last_update,\
    \ current_time)\n        self.assertEqual(user_list, data)\n```\n\n此示例演示了 `@patch`\
    \ 的几个重要特性：\n\n- 你可以向测试函数或类附加多个 `@patch` 装饰器。\n- 每个装饰器都会将额外的 mock 作为参数添加到测试函数中。装饰器是堆叠的，这意味着参数出现的顺序与\
    \ `@patch` 语句的顺序相反。\n- `@patch(\"repository.Database\")` 装饰器为类创建一个 mock，这与类的实例\
    \ mock 不同。类可以像方法一样被调用，模拟 `__init__` 构造函数的行为。\n- 所以这两个语句：\n  ```python\n  mock_db_inst\
    \ = Mock()\n  mock_db.return_value = mock_db_inst\n  ```\n  的效果是 `Database()`\
    \ 始终返回 `mock_db_inst`。\n- `Database()` 的 `save` 方法在准备测试时没有显式地 mock。然而，仍然可以使用以下语句检查它是否被调用过：\n\
    \  ```python\n  mock_db_instance.save.assert_called_once_with(data)\n  ```\n \
    \ 这是因为对实例的 mock 调用任何方法都会自动创建一个 mock，该 mock 会创建一个答案并将其作为方法调用的结果返回。\n- `@patch(\"\
    repository.UserRepository._fetch_data\")` 是补丁类内部方法的示例。由于它是内部函数，补丁目标既是它定义的地方，也是它使用的地方。因此，在这种情况下没有违反前面提到的补丁规则。\n\
    \n请注意，由于名称修饰（Name mangling），`@patch` 无法处理私有函数（名称修饰在第 5 章中解释）。如果你将 `_fetch_data`\
    \ 替换为 `__fetch_data`，相应的 `@patch` 语句将抛出 `AttributeError`，因为由于名称修饰，`__fetch_data`\
    \ 方法在运行时并不存在。\n\n作为 `@patch` 装饰器的替代方案，`unittest.mock` 提供了一个函数 `patch()`，它返回一个可以与\
    \ `with` 语句一起使用的上下文管理器。\n\n此外，还有一个函数 `patch.object()`，它允许你临时补丁已实例化对象的属性或方法。当你想要补丁类\
    \ `__init__` 函数中创建的实例变量时，此函数特别有用，因为这些变量在编译时尚不可，且无法通过 `@patch` 访问。\n\n使用 `patch`\
    \ 和 `patch.object`，`UserRepository` 的测试类可以重写如下：\n\n```python\nfrom unittest import\
    \ TestCase\nfrom unittest.mock import patch, Mock\nfrom repository import UserRepository\n\
    \nclass TestUserRepository(TestCase):\n    def test_repository_start(self):\n\
    \        with patch(\"repository.time\") as mock_time:\n            current_time\
    \ = 1709579635\n            mock_time.return_value = current_time\n          \
    \  repo = UserRepository()\n            with patch.object(repo, \"_database\"\
    ) \\\n                    as mock_db, \\\n                 patch.object(repo,\
    \ \"_remote\") \\\n                    as mock_rem:\n                data = Mock()\n\
    \                mock_rem.user_list.return_value = data\n                mock_db.get_user_list.return_value\
    \ = data\n                user_list = repo.get_user_list()\n                mock_rem.user_list.assert_called()\n\
    \                mock_db.save_user_list.assert_called_once_with(data)\n      \
    \          self.assertEqual(repo._last_update, current_time)\n               \
    \ self.assertEqual(user_list, data)\n```\n"
- fmt: "\nBefore using the tool you need to install the `coverage` package (Installing\
    \ packages is explained in Chapter [12](#part0017.xhtml_a26V): [Using External\
    \ Packages](#part0017.xhtml_a26V)).\n\nNext, open a terminal and navigate to the\
    \ directory where your tests are stored. Then, execute the following command:\n\
    \n```bash\ncoverage run -m unittest discover\n```\n\nThis command will execute\
    \ all tests found in the directory and its subdirectories, generating a binary\
    \ result file named `.coverage`.\n\nThe command\n\n```bash\ncoverage report\n\
    ```\n\nwill then output a simple report containing the coverage percentages of\
    \ all involved modules. Conversely, the command\n\n```bash\ncoverage html\n```\n\
    \nwill create a directory named `htmlcov` that contains a webpage `index.html`,\
    \ displaying a detailed coverage report.\n\n# Chapter 16: Parallelism and Concurrency\n\
    \nParallelism and concurrency are often used interchangeably, but they represent\
    \ distinct concepts:\n\nParallelism involves executing multiple processes simultaneously\
    \ on multiple CPU cores or processing units. This means that multiple tasks are\
    \ being performed at the same time, allowing for potentially increased throughput\
    \ and performance.\n\nConcurrency, on the other hand, refers to the ability of\
    \ a system to execute multiple tasks within a single process simultaneously. While\
    \ these tasks may appear to overlap in time, they are often managed by the operating\
    \ system’s scheduler, which switches between tasks rapidly, giving the illusion\
    \ of simultaneous execution.\n\nIn Python programming, parallelism and concurrency\
    \ play a critical role in building responsive, scalable, and efficient applications,\
    \ particularly in scenarios involving I/O-bound and CPU-bound tasks:\n\nCPU-bound\
    \ tasks are those that primarily require processing power or computational resources\
    \ to complete. These tasks typically involve heavy calculations, mathematical\
    \ operations, or data manipulation that heavily utilize the CPU. Examples include\
    \ sorting large datasets, performing complex mathematical computations, or running\
    \ intensive algorithms.\n\nI/O-bound tasks are those that primarily involve waiting\
    \ for input/output operations to complete, such as reading from or writing to\
    \ files, network operations, or interacting with databases. These tasks spend\
    \ a significant amount of time waiting for external resources to respond and are\
    \ not heavily CPU-intensive.\n\nPython provides several packages and libraries\
    \ to handle CPU-bound and I/O-bound tasks efficiently. In the following sections,\
    \ we will explore the `multiprocessing`, `threading`, `process / thread pools`,\
    \ and `asyncio` packages in depth.\n\n## 16.1 Multiprocessing\n\nMultiprocessing\
    \ is a technique used in Python to execute multiple processes concurrently, taking\
    \ advantage of multiple CPU cores or processors. These processes are separate\
    \ instances of the Python interpreter running in their own memory space.\n\nStarting\
    \ a process involves defining the task to be executed in a function and passing\
    \ this function to an instance of the `Process` class provided by Python’s built-in\
    \ `multiprocessing` module, optionally along with additional parameters.\n\nYou\
    \ can start a process using the `start()` method, which launches the process and\
    \ executes the target function. You can also use methods like `join()` to wait\
    \ for a process to complete and `terminate()` or `kill()` to terminate a process\
    \ prematurely.\n\nHere is an example:\n\n```python\nfrom multiprocessing import\
    \ Process\n\ndef worker(name, age):\n    print(f\"{name} is {age} years old\"\
    )\n\nif __name__ == \"__main__\":\n    args = (\"Alice\", 30)\n    process = Process(target=worker,\
    \ args=args)\n    process.start()\n    process.join()\n# Alice is 30 years old\n\
    ```\n\nNot all objects can be passed as process parameters in Python. Python uses\
    \ a process called `pickling` to serialize and deserialize objects, allowing them\
    \ to be passed as arguments to processes.\n\nPickling involves converting Python\
    \ objects into a byte stream that can be transmitted across processes or stored\
    \ in files, and then reconstructing the original objects from the byte stream.\n\
    \nHowever, not all objects can be pickled. For example, objects that represent\
    \ open file handles, sockets, or database connections typically cannot be pickled.\
    \ Each process needs to create these objects separately.\n\nPlease note that in\
    \ the context of multiprocessing, each process created by `Process` will import\
    \ the script module, including all its global variables and top-level code. Without\
    \ the `if __name__ == \"__main__\":` guard, the top-level code would be executed\
    \ in each child process again, leading to an infinite recursion of child process\
    \ creation.\n\n## 16.2 Inter-Process Communication\n\nMultiple processes cannot\
    \ communicate directly using global attributes because each process has its own\
    \ separate memory space. Therefore, changes made to global attributes in one process\
    \ are not visible to other processes.\n\nFor example, the following code will\
    \ repeatedly print 42 for ten seconds and ignore any changes made to the global\
    \ variable, which is set to 0:\n\n```python\nfrom multiprocessing import Process\n\
    from time import sleep\n\ni = 42\n\ndef worker():\n    while True:\n        print(i)\n\
    \nif __name__ == \"__main__\":\n    process = Process(target=worker)\n    process.start()\n\
    \    i = 0\n    sleep(10)\n    process.kill()\n# 42\n# 42\n# ...\n```\n\nThus,\
    \ Inter-Process Communication (IPC) is crucial for enabling communication between\
    \ processes in a multiprocessing environment.\n\nPython offers various IPC mechanisms,\
    \ of which we will explore the basics of the following three:\n\n`Queues` are\
    \ thread and process-safe data structures used for communication between processes.\
    \ They support multiple producers and consumers.\n\n`Pipes` allow two processes\
    \ to communicate by creating a pipe, which acts as a bidirectional communication\
    \ channel. One process writes data to the pipe, and the other process reads data\
    \ from.\n\n`Locks` allow only one process at a time to access a shared resource,\
    \ such as a file.\n\n### 16.2.1 Queues\n\nThe `Queue` class provided by `multiprocessing`\
    \ facilitates smooth coordination among processes, adhering to the FIFO (First-In,\
    \ First-Out) principle. This enables one or more processes to produce and enqueue\
    \ items, while others dequeue them.\n\nHere is an example (in all examples in\
    \ this chapter, `sleep()` is used as a placeholder for CPU-bound or I/O-bound\
    \ task):\n\n```python\nfrom multiprocessing import Process, Queue\nfrom time import\
    \ sleep\n\ndef worker(number, input_queue):\n    while True:\n        item = input_queue.get()\n\
    \        if item == \"Terminate\":\n            break\n        print(f\"Worker\
    \ {number}: {item}\")\n        sleep(1)\n\nif __name__ == \"__main__\":\n    q\
    \ = Queue()\n    process_1 = Process(target=worker, args=(1, q))\n    process_2\
    \ = Process(target=worker, args=(2, q))\n    process_3 = Process(target=worker,\
    \ args=(3, q))\n    process_1.start()\n    process_2.start()\n    process_3.start()\n\
    \    for i in range(15):\n        q.put(i)\n    q.put(\"Terminate\")\n    q.put(\"\
    Terminate\")\n    q.put(\"Terminate\")\n    process_1.join()\n    process_2.join()\n\
    \    process_3.join()\n# Worker 1: 0\n# Worker 2: 1\n# Worker 3: 2\n# ...\n```\n\
    \n### 16.2.2 Pipes\n\nThe `Pipe` class provided by the `multiprocessing` package\
    \ facilitates two-way communication between two processes.\n\nLeveraging lower-level\
    \ operating system features, communication via pipes is typically significantly\
    \ faster compared to queues.\n\nHere is an example where two processes send the\
    \ words \"Ping\" and \"Pong\" back and forth:\n\n```python\nfrom multiprocessing\
    \ import Process, Pipe\nfrom time import sleep\n\ndef worker(my_pipe, ping_or_pong,\
    \ start):\n    if start:\n        my_pipe.send(ping_or_pong)\n    while True:\n\
    \        word = my_pipe.recv()\n        print(word)\n        my_pipe.send(ping_or_pong)\n\
    \nif __name__ == \"__main__\":\n    pipe_ends = Pipe()\n    args_1 = (pipe_ends[0],\
    \ \"Ping\", True)\n    process_1 = Process(target=worker, args=args_1)\n```\n"
  raw: 'Before using the tool you need to install the coverage package (Installing
    packages is explained in Chapter [12](#part0017.xhtml_a26V): [Using External Packages](#part0017.xhtml_a26V)).


    Next, open a terminal and navigate to the directory where your tests are stored.
    Then, execute the following command:


    coverage run -m unittest discover


    This command will execute all tests found in the directory and its subdirectories,
    generating a binary result file named .coverage.


    The command


    coverage report


    will then output a simple report containing the coverage percentages of all involved
    modules. Conversely, the command


    coverage html


    will create a directory named htmlcov that contains a webpage index.html, displaying
    a detailed coverage report.


    ## Chapter 16


    Parallelism and Concurrency


    Parallelism and concurrency are often used interchangeably, but they represent
    distinct concepts:


    Parallelism involves executing multiple processes simultaneously on multiple CPU
    cores or processing units. This means that multiple tasks are being performed
    at the same time, allowing for potentially increased throughput and performance.


    Concurrency, on the other hand, refers to the ability of a system to execute multiple
    tasks within a single process simultaneously. While these tasks may appear to
    overlap in time, they are often managed by the operating system’s scheduler, which
    switches between tasks rapidly, giving the illusion of simultaneous execution.


    In Python programming, parallelism and concurrency play a critical role in building
    responsive, scalable, and efficient applications, particularly in scenarios involving
    I/O-bound and CPU-bound tasks:


    CPU-bound tasks are those that primarily require processing power or computational
    resources to complete. These tasks typically involve heavy calculations, mathematical
    operations, or data manipulation that heavily utilize the CPU. Examples include
    sorting large datasets, performing complex mathematical computations, or running
    intensive algorithms.


    I/O-bound tasks are those that primarily involve waiting for input/output operations
    to complete, such as reading from or writing to files, network operations, or
    interacting with databases. These tasks spend a significant amount of time waiting
    for external resources to respond and are not heavily CPU-intensive.


    Python provides several packages and libraries to handle CPU-bound and I/O-bound
    tasks efficiently. In the following sections, we will explore the multiprocessing,
    threading, process / thread pools, and asyncio packages in depth.


    ### 16.1 Multiprocessing


    Multiprocessing is a technique used in Python to execute multiple processes concurrently,
    taking advantage of multiple CPU cores or processors. These processes are separate
    instances of the Python interpreter running in their own memory space.


    Starting a process involves defining the task to be executed in a function and
    passing this function to an instance of the Process class provided by Python’s
    built-in multiprocessing module, optionally along with additional parameters.


    You can start a process using the start() method, which launches the process and
    executes the target function. You can also use methods like join() to wait for
    a process to complete and terminate() or kill() to terminate a process prematurely.


    Here is an example:


    from multiprocessing import Process


    def worker(name, age):


        print(f"{name} is {age} years old")


    if __name__ == "__main__":


        args = ("Alice", 30)


        process = Process(target=worker, args=args)


        process.start()


        process.join()


    #  Alice is 30 years old


    Not all objects can be passed as process parameters in Python. Python uses a process
    called pickling to serialize and deserialize objects, allowing them to be passed
    as arguments to processes.


    Pickling involves converting Python objects into a byte stream that can be transmitted
    across processes or stored in files, and then reconstructing the original objects
    from the byte stream.


    However, not all objects can be pickled. For example, objects that represent open
    file handles, sockets, or database connections typically cannot be pickled. Each
    process needs to create these objects separately.


    Please note that in the context of multiprocessing, each process created by Process
    will import the script module, including all its global variables and top-level
    code. Without the if __name__ == "__main__": guard, the top-level code would be
    executed in each child process again, leading to an infinite recursion of child
    process creation.


    ### 16.2 Inter-Process Communication


    Multiple processes cannot communicate directly using global attributes because
    each process has its own separate memory space. Therefore, changes made to global
    attributes in one process are not visible to other processes.


    For example, the following code will repeatedly print 42 for ten seconds and ignore
    any changes made to the global variable, which is set to 0:


    from multiprocessing import Process


    from time import sleep


    i = 42


    def worker():


        while True:


            print(i)


    if __name__ == "__main__":


        process = Process(target=worker)


        process.start()


        i = 0


        sleep(10)


        process.kill()


    # 42


    # 42


    # ...


    Thus, Inter-Process Communication (IPC) is crucial for enabling communication
    between processes in a multiprocessing environment.


    Python offers various IPC mechanisms, of which we will explore the basics of the
    following three:


    Queues are thread and process-safe data structures used for communication between
    processes. They support multiple producers and consumers.


    Pipes allow two processes to communicate by creating a pipe, which acts as a bidirectional
    communication channel. One process writes data to the pipe, and the other process
    reads data from the pipe.


    Locks allow only one process at a time to acquire access to a shared resource,
    such as a log file.


    #### 16.2.1 Queues


    The Queue class provided by the multiprocessing package facilitates smooth coordination
    among multiple processes, adhering to the FIFO (First-In, First-Out) principle.
    This enables one or more processes to produce and enqueue items, while others
    dequeue and consume them.


    Here is an example ( In all examples in this chapter, the sleep() function is
    used as a placeholder for a blocking CPU-bound or I/O-bound task.) where the main
    process distributes 15 jobs to a pool of three worker processes:


    from multiprocessing import Process, Queue


    from time import sleep


    def worker(number, input_queue):


        while True:


            item = input_queue.get()


            if item == "Terminate":


                break


            print(f"Worker {number}: {item}")


            sleep(1)


    if __name__ == "__main__":


        q = Queue()


        process_1 = Process(target=worker, args=(1, q))


        process_2 = Process(target=worker, args=(2, q,))


        process_3 = Process(target=worker, args=(3, q,))


        process_1.start()


        process_2.start()


        process_3.start()


        for i in range(15):


            q.put(i)


        q.put("Terminate")


        q.put("Terminate")


        q.put("Terminate")


        process_1.join()


        process_2.join()


        process_3.join()


    # Worker 1: 0


    # Worker 2: 1


    # Worker 3: 2


    # ...


    #### 16.2.2 Pipes


    The Pipe class provided by the multiprocessing package facilitates two-way communication
    between two processes.


    Leveraging lower-level operating system features, communication via pipes is typically
    significantly faster compared to queues.


    Here is an example where two processes send the words "Ping" and "Pong" back and
    forth:


    from multiprocessing import Process, Pipe


    from time import sleep


    def worker(my_pipe, ping_or_pong, start):


        if start:


            my_pipe.send(ping_or_pong)


        while True:


            word = my_pipe.recv()


            print(word)


            my_pipe.send(ping_or_pong)


    if __name__ == "__main__":


        pipe_ends = Pipe()


        args_1 = (pipe_ends[0], "Ping", True)


        process_1 = Process(target=worker, args=args_1)'
