    5.


    Interleaved Execution:


    The Python interpreter includes a scheduler for managing the interleaved execution
    of threads. However, this scheduler operates within the constraints of the GIL,
    which allows only one thread to execute Python bytecode at a time.


    Despite this limitation, the scheduler ensures that all threads have a chance
    to acquire the GIL and execute their bytecode in an interleaved manner.


    The scheduler can also switch to another waiting thread, enabling it to execute
    its bytecode when a thread releases the GIL, such as during I/O operations or
    long-running computations.


    All in all, this means that while multiple threads in Python can run concurrently,
    their performance is constrained by the Global Interpreter Lock (GIL), which limits
    their ability to effectively utilize multiple CPU cores. This limitation significantly
    hinders parallelism and scalability, particularly in CPU-bound workloads.


    As previously discussed in the section on multiprocessing, one effective approach
    to overcome the limitations imposed by the GIL in Python is to leverage multiprocessing
    instead of multithreading.


    By utilizing separate processes, each with its own Python interpreter and GIL,
    multiprocessing enables true parallelism across multiple CPU cores without being
    constrained by the GIL.


    Another approach to overcoming the limitations imposed by the GIL is through cooperative
    multitasking, which will be described in the next section.


    ### 16.6 Asynchronous Programming


    #### 16.6.1 Overview


    Asynchronous programming is a programming paradigm that enables concurrent execution
    of multiple tasks without the need for explicit threading or multiprocessing.


    asyncio is a Python library that simplifies asynchronous programming by providing
    high-level abstractions for managing asynchronous tasks.


    It consists of the following components:


    Coroutines: Special functions that run asynchronously within a thread. They are
    defined using the async keyword, indicating that the function is asynchronous
    and can be awaited for completion. Coroutines can start other coroutines and await
    their results.


    Event loop: Coordinates the scheduling and execution of coroutines. Each thread
    typically has exactly one associated event loop, and coroutines scheduled by the
    event loop run within that thread.


    Tasks: Objects that represent the execution of coroutines within the event loop.
    Tasks allow you to manage the execution of coroutines and await their results
    asynchronously.


    Executors: Objects that manage the execution of blocking or CPU-bound tasks in
    separate threads or processes, allowing the event loop to remain responsive. Executors
    are typically created within a coroutine that asynchronously waits for the executor
    to finish and return a result.


    Coroutines are lightweight concurrency units that can be cooperatively scheduled
    within a single thread. They typically have lower overhead compared to threads,
    as they don’t involve context switching or OS-level thread management.


    With the help of executors, coroutines provide a convenient way to work around
    the limitations imposed by the GIL for I/O-bound or CPU-bound tasks.


    While asyncio offers many features for async programming, its full depth is beyond
    the scope of this book. However, in the next sections, you will get a good overview,
    so you will understand how asyncio works and how to use it effectively.


    #### 16.6.2 Creating and Running Coroutines


    Creating just one coroutine and running it is very simple with asyncio.


    Here is an example:


    import asyncio


    async def my_coroutine():


        print("Coroutine started")


        await asyncio.sleep(1)


        print("Coroutine resumed after 1 second")


        return 42


    result = asyncio.run(my_coroutine())


    print(result)


    # Coroutine started


    # Coroutine resumed after 1 second


    # 42


    The keywords async def mark the function my_coroutine as a coroutine, indicating
    that it cannot be directly invoked but must be scheduled for execution by the
    event loop.


    Using asyncio.run(my_coroutine()) initiates the creation of an event loop for
    the current thread. It then generates a task for my_coroutine, allows the event
    loop to begin executing the task, waits for its completion, and finally returns
    its result.


    Please note that while asyncio.sleep() suspends the execution of the coroutine
    for the specified duration, allowing other coroutines to run in the meantime,
    using time.sleep() instead would have blocked the entire thread, preventing the
    event loop from processing other coroutines during this period.


    The following example demonstrates a main coroutine initiating another coroutine,
    awaiting its completion, and then initiating the next coroutine.


    import asyncio


    async def my_coroutine(number, sleep_time):


        print(f"{number}: Falling asleep ...")


        await asyncio.sleep(sleep_time)


        print(f"{number}: Waking up ...")


    async def main():


        await my_coroutine(1, 2)


        await my_coroutine(2, 8)


    asyncio.run(main())


    # 1: Falling asleep ...


    # 1: Waking up ...


    # 2: Falling asleep ...


    # 2: Waking up ...


    await creates a task from a coroutine, schedules it into the event loop of the
    thread, and then waits for its completion, eventually returning its result.


    In this modification of the last example, the coroutines run concurrently, meaning
    the second coroutine is already scheduled while the first coroutine is suspended.


    import asyncio


    async def my_coroutine(number, sleep_time):


        print(f"{number}: Falling asleep ...")


        await asyncio.sleep(sleep_time)


        print(f"{number}: Waking up ...")


        return number


    async def main():


        result = await asyncio.gather(


            my_coroutine(1, 2),


            my_coroutine(2, 8)


        )


        print(result)


    asyncio.run(main())


    # 1: Falling asleep ...


    # 2: Falling asleep ...


    # 1: Waking up ...


    # 2: Waking up ...


    # [1, 2]


    asyncio.gather, similar to await, creates tasks for every coroutine passed, schedules
    them into the event loop of the thread, waits for the completion of all tasks,
    and returns their results in a list.


    Finally, here is an example demonstrating the explicit creation of tasks:


    import asyncio


    async def my_coroutine(number, sleep_time):


        print(f"{number}: Falling asleep ...")


        await asyncio.sleep(sleep_time)


        print(f"{number}: Waking up ...")


        return number


    async def main():


        task_1 = asyncio.create_task(my_coroutine(1, 3),


                                     name="Task 1")


        task_2 = asyncio.create_task(my_coroutine(2, 10),


                                     name="Task 2")


        task_3 = asyncio.create_task(my_coroutine(3, 10),


                                     name="Task 3")


        done, pending = await asyncio.wait(


            [task_1, task_2, task_3],


            return_when=asyncio.FIRST_COMPLETED)


        for task in done:


            name = task.get_name()


            result = task.result()


            print(f"Done: {name}, result = {result}")


        for task in pending:


            print(f"Pending: {task.get_name()}")


        task_2.cancel()


        task_3.cancel()


    asyncio.run(main())


    # 1: Falling asleep ...


    # 2: Falling asleep ...


    # 3: Falling asleep ...


    # 1: Waking up ...


    # Done: Task 1, result = 1


    # Pending: Task 3


    # Pending: Task 2


    asyncio.create_task not only creates a task but also submits it to the event loop
    for processing.


    asyncio.wait is a coroutine function that waits until a certain condition is fulfilled
    for a list of tasks. The default condition is "all tasks completed". In this example,
    the condition is already fulfilled when at least one task is completed.'
