    # Value -1 not found


    ### 4.5 Functions


    #### 4.5.1 Definition and Invocation


    In Python, you can define a function using the def keyword, followed by the function
    name and its parameters (if any).


    Unlike Java, functions can be defined at the top-level scope outside of class
    definitions, akin to static methods in Java.


    Additionally, unlike in Java, functions must be defined in the code before they
    can be called.


    Similar to Java, parameters in Python are specified within the parentheses following
    the function name.


    In Python, local variables are declared simply by assigning a value.


    This means that the syntax for assigning to a global and a local variable is the
    same. To clarify that an assignment in a function body is for a global variable,
    you need to use the global keyword beforehand.


    last_name = ""


    def greet(name):


        global last_name


        last_name = name


        return f"Hello {name}!"


    message = greet("John")


    print(message)  # Hello John!


    print(last_name)  # John


    In Python, as in Java, methods are functions associated with objects. They are
    invoked using dot notation on an object of a specific type. For example, strings
    have built-in methods like upper() and split().


    string1 = "hello, world!"


    print(string1.upper())  # HELLO, WORLD!


    string2 = "a,b,c"


    print(string2.split(","))  # [’a’, ’b’, ’c’]


    #### 4.5.2 Unused Parameters


    In Python, a common convention for marking unused parameters in functions is to
    name them _, __, ___, and so on, for each unused parameter.


    def func(_, __, ___, x):


        print(x)


    func(1, 2, 3, "Hello")  # Hello


    #### 4.5.3 Variable Argument Lists


    Variable argument lists for functions and methods are also available in Python,
    indicated by the * symbol.


    However, unlike Java, in Python, the function receives the parameters as a tuple,
    not as an array (Tuples will be discussed in Chapter [6](#part0010.xhtml_a26S):
    [Python’s Data Structures](#part0010.xhtml_a26S).).


    def func(*args):


        print(args)


    func(1, "hello")  # (1, ’hello’)


    func()  # ()


    #### 4.5.4 Default Parameters and Keyword Arguments


    You can specify default parameter values for functions. If a parameter is not
    provided when the function is called, it will use the default value.


    Default values can only be assigned to parameters that appear at the end of the
    parameter list. Once a default value is assigned to a parameter, all subsequent
    parameters must also have default values.


    In function calls, keyword arguments are supported, enabling you to specify arguments
    by their parameter names when calling a function.


    It is important to note that if a function call has both positional and keyword
    arguments, positional arguments must be specified first in the function call.


    def greet(name, age, city="Unknown"):


        print(f"Hello, {name}!")


        print(f"You are {age} years old.")


        print(f"You live in {city}.")


    # Positional parameters only


    greet("Alice", 30)


    # Hello, Alice!


    # You are 30 years old.


    # You live in Unknown.


    # Positional parameters followed by a


    # keyword argument


    greet("Bob", 25, city="New York")


    # Hello, Bob!'
