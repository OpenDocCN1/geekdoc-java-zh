    # Java Break/Continue


    In Java, the break and continue statements are control flow  statements used within
    loops to alter the normal flow of  execution.


    Java break Statement:


    1.  Loop  Termination:


    ![](image_rsrc9TX.jpg)The break statement is used to terminate the execution of
    a  loop prematurely. When encountered within a loop, the break  statement immediately
    exits the loop, and control is  transferred to the statement following the loop.


    2.  Early  Exit:


    ![](image_rsrc9TY.jpg)break is often used within loops to exit the loop early
    based on a certain condition. Once the break statement is  encountered, any remaining
    iterations of the loop are  skipped, and the program continues with the statement  following
    the loop.


    3.  Switch  Statements:


    ![](image_rsrc9TZ.jpg)In addition to loops, the break statement is used within  switch
    statements to exit the switch block. It is commonly placed at the end of each
    case block to prevent fall-through to subsequent case blocks.


    4.  Loop Nesting:


    ![](image_rsrc9U0.jpg)When dealing with nested loops, a break statement inside
    an  inner loop exits only that loop, not the outer loop(s). If a break statement
    is used within the outer loop, it exits the  outer loop.


    Java continue Statement:


    1\. Skip Current Iteration:


    ![](image_rsrc9U1.jpg)The continue statement is used to skip the rest of the code
    inside the current iteration of a loop and proceed to the next  iteration. It
    does not exit the loop; rather, it skips the  remaining statements within the
    loop body for the current  iteration.


    Loop  Increment/Update:


    ![](image_rsrc9U2.jpg)After  encountering  a  continue  statement,  the  loop''s
    increment or update expressions are executed, and control moves to the next iteration
    of the loop. This allows the loop to continue with the next set of iterations.


    3.  Filtering Out Elements:


    ![](image_rsrc9U3.jpg)continue is often used to filter out specific elements or  conditions
    within a loop. For example, if a certain condition is met, the continue statement
    can be used to skip further  processing for that particular iteration.


    4.  Loop Nesting:


    ![](image_rsrc9U4.jpg)Similar to the break statement, the continue statement  affects
    only the innermost loop in the case of nested loops. It skips the remaining code
    in the current iteration of the inner  loop and proceeds to the next iteration
    of that inner loop.


    5. Use in while and do-while Loops:


    ![](image_rsrc9U5.jpg)The continue statement can be used in while and do-while
    loops, just like in for loops, to achieve similar effects of  skipping the remaining
    code in the current iteration and  moving to the next one.


    6. Labelled continue (Java 8 and later):


    ![](image_rsrc9U6.jpg)Java 8 introduced the ability to use a label with continue  statements,
    allowing developers to specify which loop to  continue  when  dealing  with  nested  loops.  This  labeled
    continue statement provides more control in scenarios with  multiple nested loops.


    In summary, both break and continue statements are important  control flow constructs
    in Java that are commonly used within loops to alter the normal execution flow.
    While break is used to terminate the loop prematurely, continue is used to skip
    the  remaining code in the current iteration and move on to the next  iteration
    of the loop. Careful use of these statements can  enhance the flexibility and
    efficiency of loop structures in Java programs.


    In  Java,  break  and  continue  are  control  flow  statements  used  in loops.


    public class BreakContinueExample {  public static void main(String[] args) {


    // Example with break  System.out.println("Example  with  break:"); for (int i
    = 1; i <= 5; i++) {


    if (i == 3) {


    break; // Terminate the loop when i is 3


    }


    System.out.println("Iteration " + i);


    }


    // Example with continue  System.out.println("\nExample  with  continue:");  for
    (int j = 1; j <= 5; j++) {


    if (j == 2 || j == 4) {


    continue;  //  Skip  the  rest  of  the  loop  body  and  move  to the next iteration
    when j is 2 or 4


    }


    System.out.println("Iteration " + j);


    }


    }


    }


    Explanation:


    1.     break  statement:


    ![](image_rsrc9PM.jpg)In the first loop, when i becomes equal to 3, the break
    statement is encountered, causing the loop to terminate immediately. As a result,
    the loop doesn''t execute  further iterations.


    2.      continue  statement:


    ![](image_rsrc9PM.jpg)In the second loop, when j is equal to 2 or 4, the continue
    statement is encountered. It skips the remaining code  inside the loop for that
    particular iteration and moves to the next iteration. As a result, the "Iteration"
    statement is not printed for j values 2 and 4.


    In  summary:


    ![](image_rsrc9U7.jpg)break: Terminates the loop immediately, and control passes
    to the statement following the terminated loop.


    ![](image_rsrc9U8.jpg)continue: Skips the rest of the loop body for the current  iteration
    and moves to the next iteration of the loop.


    # JAVA ARRAYS


    In Java, an array is a data structure that allows you to store  multiple values
    of the same data type under a single variable  name.


    1.  Homogeneous  Elements:


    ![](image_rsrc9U9.jpg)Arrays in Java are homogeneous, meaning that all elements  within
    an array must be of the same data type. For example,  you can have an array of
    integers, an array of characters, or an array of objects.


    2.  Fixed  Size:


    ![](image_rsrc9UA.jpg)Once an array is created, its size is fixed and cannot be  changed.
    If you need a dynamic collection that can grow or shrink, you might consider using
    other data structures, such  as ArrayList or LinkedList.


    3.  Zero-Based Indexing:


    ![](image_rsrc9UB.jpg)Array elements are accessed using an index, and the indexing
    starts from 0\. The first element is at index 0, the second at index 1, and so
    on. The last element is at index length-1,  where length is the size of the array.


    4. Declaration and Initialization:


    ![](image_rsrc9UC.jpg)Arrays are declared and initialized using square brackets
    [].  For example, int[] numbers = new int[5]; declares an integer  array named
    numbers with a size of 5\. The new keyword is used to allocate memory for the
    array.


    5.  Length  Property:


    ![](image_rsrc9UD.jpg)Arrays have a length property that indicates the number
    of elements in the array. This property is often used in loops  and other constructs
    to iterate over the elements of the  array.


    6.  Random  Access:


    ![](image_rsrc9UE.jpg)Arrays allow for direct access to any element using its
    index. This enables efficient random access to elements, and the time complexity
    for accessing an element is constant O(1).


    Similar  Syntax  for  Multi-Dimensional  Arrays:


    ![](image_rsrc9UF.jpg)Java supports multi-dimensional arrays, such as 2D arrays.
    The syntax for accessing elements in multi-dimensional  arrays is similar to that
    of one-dimensional arrays, using  multiple indices.


    8.  Memory  Contiguity:


    ![](image_rsrc9UG.jpg)Array elements are stored in contiguous memory locations.
    This ensures efficient memory usage and allows for quick  access to elements based
    on their indices.


    9. Primitive and Object Arrays:


    ![](image_rsrc9UH.jpg)Arrays can hold both primitive data types (e.g., int, char)
    and  objects (e.g., instances of a class). Primitive arrays store the  actual
    values, while object arrays store references to objects.


