    Grade is D\");\n        } else {\n            System.out.println(\"Grade is F\"\
    );\n        }\n\n        // Example 3: Nested if...else 语句\n        int num =\
    \ -5;\n        if (num > 0) {\n            System.out.println(\"Positive number\"\
    );\n        } else {\n            if (num < 0) {\n                System.out.println(\"\
    Negative number\");\n            } else {\n                System.out.println(\"\
    Zero\");\n            }\n        }\n    }\n}\n```\n\n### if...else 语句解释：\n\n1.\
    \ Simple if...else 语句：\n![](img/image_rsrc9PM.jpg)第一个示例检查 `x` 是否大于 `y`。如果条件为真，执行第一个块；否则执行\
    \ `else` 块中的代码。\n\n2. if...else...else 梯形：\n![](img/image_rsrc9PM.jpg)第二个示例使用\
    \ `if...else if...else` 梯形根据分数确定等级。按顺序评估条件，并执行第一个真条件的块。\n\n3. 嵌套 语句：\n![](img/image_rsrc9PM.jpg)第三个示例检查\
