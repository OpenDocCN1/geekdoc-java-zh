  trans: "\n在 Java 中，`LinkedList` 是实现 `List` 接口的类，属于 `java.util` 包的一部分。它表示一个双链表，其中列表中的每个元素（节点）都包含数据以及指向下一个元素和上一个元素的引用。与\
    \ `ArrayList` 不同，`LinkedList` 不使用连续的内存块来存储元素；相反，它使用分散在内存中的节点，通过引用相互连接。以下是使用 `LinkedList`\
    \ 的示例：\n\n```java\nimport java.util.LinkedList;\n\npublic class LinkedListExample\
    \ {\n    public static void main(String[] args) {\n        // 创建一个 String  LinkedList\n\
    \        LinkedList<String> colors = new LinkedList<>();\n\n        // 向 LinkedList\
    \ 中添加元素\n        colors.add(\"Red\");\n        colors.add(\"Green\");\n      \
    \  colors.add(\"Blue\");\n\n        // 使用增强 for 循环显示元素\n        System.out.println(\"\
    Colors in the LinkedList:\");\n        for (String color : colors) {\n       \
    \     System.out.println(color);\n        }\n\n        // 在特定位置添加元素\n        colors.add(1,\
    \ \"Yellow\");\n        colors.addLast(\"Purple\");\n\n        // 显示更新后的 LinkedList\n\
    \        System.out.println(\"\\nColors after adding 'Yellow' at index 1 and 'Purple'\
    \ at the end:\");\n        for (String color : colors) {\n            System.out.println(color);\n\
    \        }\n\n        // 按值删除元素\n        colors.remove(\"Green\");\n\n       \
    \ // 显示删除 \"Green\" 之后的 LinkedList\n        System.out.println(\"\\nColors after\
    \ removing 'Green':\");\n        for (String color : colors) {\n            System.out.println(color);\n\
    \        }\n\n        // 按索引访问元素\n        System.out.println(\"\\nElement at index\
    \ 2: \" + colors.get(2));\n\n        // 检查 LinkedList 是否包含特定元素\n        String\
    \ searchColor = \"Blue\";\n        System.out.println(\"\\nDoes the LinkedList\
    \ contain \" + searchColor + \"? \" + colors.contains(searchColor));\n\n     \
    \   // 清空 LinkedList 中的所有元素\n        colors.clear();\n\n        // 显示清空后的 LinkedList\n\
    \        System.out.println(\"\\nColors after clearing the LinkedList:\");\n \
    \       for (String color : colors) {\n            System.out.println(color);\n\
    \        }\n    }\n}\n```\n\n### 解释：\n\n1. **创建 `LinkedList` (`colors`)：**\n![](img/image_rsrcA51.jpg)\
    \ 创建了一个 `LinkedList` 来存储字符串（`String`）。\n\n2. **向 LinkedList 中添加元素：**\n![](img/image_rsrcA52.jpg)\
    \ 使用 `add()` 方法向 `LinkedList` 中添加元素（\"Red\"、“Green\"、“Blue\"）。\n\n3. **使用增强 for\
    \ 循环显示元素：**\n![](img/image_rsrcA53.jpg) 使用增强 for 循环遍历 `LinkedList` 并显示其元素。\n\n\
    4. **在特定位置添加元素：**\n![](img/image_rsrcA54.jpg) 使用 `add()` 和 `addLast()` 方法向 `LinkedList`\
    \ 中添加元素（索引 1 处的 \"Yellow\" 和末尾的 \"Purple\"）。\n\n5. **显示更新后的 `LinkedList`：**\n\
    ![](img/image_rsrcA55.jpg) 在特定位置添加元素后显示 `LinkedList`。\n\n6. **按值删除元素：**\n![](img/image_rsrcA56.jpg)\
    \ 使用 `remove()` 方法从 `LinkedList` 中删除元素（\"Green\"）。\n\n7. **删除后显示 `LinkedList`：**\n\
    ![](img/image_rsrcA57.jpg) 在删除指定元素后显示 `LinkedList`。\n\n8. **按索引访问元素：**\n![](img/image_rsrcA58.jpg)\
    \ 使用 `get()` 方法访问并显示特定索引（索引 2）处的元素。\n\n9. **检查 `LinkedList` 是否包含特定元素：**\n![](img/image_rsrcA59.jpg)\
    \ 使用 `contains()` 方法检查 `LinkedList` 是否包含特定元素（\"Blue\"）。\n\n10. **清空 `LinkedList`：**\n\
    ![](img/image_rsrcA5A.jpg) 使用 `clear()` 方法从 `LinkedList` 中移除所有元素。\n\n11. **清空后显示\
    \ `LinkedList`：**\n![](img/image_rsrcA5B.jpg) 清空后显示 `LinkedList`，应该是应该是。\n\n总结，`LinkedList`\
    \ 是 Java 中的一种动态数据结构，允许高效地插入和删除元素，特别是在频繁从列表中间添加或删除元素的场景下。它提供了以链表方式添加、删除、访问和操作元素的方法。在\
    \ `ArrayList` 和 `LinkedList` 之间的选择取决于应用程序的具体需求，每种都有自己的优势和权衡。\n\n# Java HashMap\n\
    \nJava 中的 `HashMap` 是 Java 集合框架的一部分，由 `HashMap` 类实现。它提供了一种允许存储键值对的数据结构，其中每个键都与一个对应的值相关联。\n\
    \n1. **键值对存储：**\n![](img/image_rsrcA5C.jpg) `HashMap` 以键值对的形式存储元素。每个键在映射中都是唯一的，并且它映射到一个特定的值。\n\
    \n2. **快速检索：**\n![](img/image_rsrcA5D.jpg) 使用 `HashMap` 的主要优势之一是它能够根据键提供快速的检索。\n\
    \n3. **哈希机制：**\n![](img/image_rsrcA5E.jpg) 在内部，`HashMap` 使用哈希机制组织元素。\n\n4. **桶与冲突处理：**\n\
    ![](img/image_rsrcA5F.jpg) `HashMap` 组织在桶（buckets）中；如果两个键具有相同的哈码，它们会被放在同一个桶中。\n\
    \n5. **空键与空值：**\n![](img/image_rsrcA5G.jpg) `HashMap` 允许使用空值。这意味着一个键可以映射到一个空值。\n\
    \n6. **无序集合：**\n![](img/image_rsrcA5H.jpg) `HashMap` 中键值对的顺序不保证是特定的。如果顺序很重要，可以使用\
    \ `LinkedHashMap` 类。\n\n7. **键集视图：**\n![](img/image_rsrcA5J.jpg) `HashMap` 的 `keySet()`\
    \ 方法返回键的集合视图。同样，`values()` 返回值的集合视图。\n\n8. **性能特征：**\n![](img/image_rsrcA5K.jpg)\
    \ `HashMap` 对于常用操作（如 `get()` 和 `put()`）的性能通常很高。然而，实际性能取决于映射的容量、负载因子以及哈希函数的质量等。\n\
    \n9. **迭代：**\n![](img/image_rsrcA5M.jpg) 使用迭代器或增强 for 循环对 `HashMap` 的键值对进行迭代。`entrySet()`\
    \ 方法提供了键值对的集合视图，使得迭代变得高效。\n\n10. **动态调大小：**\n![](img/image_rsrcA5N.jpg) `HashMap`\
    \ 可以动态调整大小以容纳更多元素。随着元素数量增加，映射的容量会增加以保持低负载因子并确保操作高效。\n\n11. **无重复键：**\n![](img/image_rsrcA5P.jpg)\
    \ `HashMap` 中的每个键必须是唯一的。如果尝试插入已存在的键，则会替换该键相关的现有值。\n\n12. **线程安全：**\n![](img/image_rsrcA5R.jpg)\
    \ 默认情况下，`HashMap` 不是线程安全的。多个线程的并发访问会导致未定义行为。如果考虑线程安全，可以使用 `Collections.synchronizedMap()`\
    \ 或 `ConcurrentHashMap` 作为线程安全的替代方案。\n\n总结来说，Java 中的 `HashMap` 是一种键值对数据结构，它通过哈希机制根据键快速检索值。它被广泛应用于各种应用程序中用于高效的数据存储和检索。\n"
