- fmt: "\n# Java Interface\n\nIn Java, an interface is a fundamental construct that\
    \ allows the definition of a contract for a class without specifying its implementation.\
    \ Here's an explanation of Java interfaces without providing specific coding examples:\n\
    \n## 1. Definition\n![](image_rsrcA24.jpg)An interface in Java is a collection\
    \ of abstract methods (methods without a body) and constant values (final variables).\
    \ It provides a way to declare a set of functionalities that classes must implement.\n\
    \n## 2. Abstract Methods\n![](image_rsrcA25.jpg)Interfaces declare abstract methods,\
    \ which are methods without an implementation. These methods serve as a contract,\
    \ specifying what behavior a class implementing the interface must provide.\n\n\
    ## 3. No Implementation\n![](image_rsrcA26.jpg)Unlike abstract classes, interfaces\
    \ do not contain any implementation of methods. They define what methods a class\
    \ should have, but the actual implementation is left to the implementing classes.\n\
    \n## 4. Multiple Inheritance\n![](image_rsrcA27.jpg)Java interfaces support multiple\
    \ inheritance, meaning a class can implement multiple interfaces. This allows\
    \ a class to inherit behavior from multiple sources, promoting flexibility in\
    \ code design.\n\n## 5. Contractual Agreement\n![](image_rsrcA28.jpg)Implementing\
    \ an interface in Java is a way for a class to enter into a contractual agreement.\
    \ By implementing an interface, a class commits to providing concrete implementations\
    \ for all the abstract methods declared by the interface.\n\n## 6. Public Access\
    \ Modifier\n![](image_rsrcA29.jpg)Interface members (methods and constants) have\
    \ the implicit public access modifier. This means that the methods declared in\
    \ an interface are accessible to any class that implements the interface.\n\n\
    ## 7. Constants (Final Variables)\n![](image_rsrcA2A.jpg)Interfaces can declare\
    \ constant values, which are implicitly public, static, and final. These constants\
    \ provide a way to define and share common values across multiple classes.\n\n\
    ## 8. Blueprint for Classes\n![](image_rsrcA2B.jpg)An interface acts as a blueprint\
    \ or a contract for classes that implement it. It defines a set of methods that\
    \ any implementing class must provide, allowing for a standardized way of interacting\
    \ with objects.\n\n## 9. Achieving Multiple Inheritance\n![](image_rsrcA2C.jpg)Java\
    \ interfaces are often used to achieve multiple inheritance without the complications\
    \ associated with inheriting from multiple classes. A class can implement multiple\
    \ interfaces, inheriting their abstract methods.\n\n## 10. Polymorphism\n![](image_rsrcA2D.jpg)Interfaces\
    \ contribute to polymorphism by allowing objects of different classes to be treated\
    \ as objects of a common interface type. This enables more generic and adaptable\
    \ code.\n\n## 11. Code Organization\n![](image_rsrcA2E.jpg)Interfaces provide\
    \ a way to organize code by grouping related abstract methods together. This promotes\
    \ a modular and organized structure in large codebases.\n\n## 12. Java 8 and Default\
    \ Methods\n![](image_rsrcA2F.jpg)Starting from Java 8, interfaces can also have\
    \ default methods, which are methods with a default implementation. Default methods\
    \ allow interfaces to evolve without breaking existing implementations.\n\n##\
    \ 13. Marker Interfaces\n![](image_rsrcA2G.jpg)Some interfaces serve as marker\
    \ interfaces, indicating a special property or capability of a class. Marker interfaces\
    \ don't declare any methods but are used to signal certain characteristics.\n\n\
    ## 14. Callbacks and Event Handling\n![](image_rsrcA2H.jpg)Interfaces are commonly\
    \ used in scenarios such as callbacks and event handling. For example, an event\
    \ listener may define methods that get invoked when a specific event occurs.\n\
    \nIn summary, abstraction allows you to define abstract classes and interfaces,\
    \ which provide a way to hide the implementation details and define a common interface\
    \ for subclasses or implementing classes. Abstract classes and interfaces are\
    \ crucial for building flexible and extensible software systems, enabling code\
    \ reuse and promoting a clear separation of concerns.\n\n## Example Implementation\n\
    \n```java\n// Example of Java Interface\n// Interface representing a shape that\
    \ can be drawn\ninterface Drawable {\n    // Abstract method (to be implemented\
    \ by classes)\n    void draw();\n    // Constant (implicitly public, static, and\
    \ final)\n    String COLOR = \"Black\";\n}\n\n// Concrete class implementing the\
    \ Drawable interface\nclass Circle implements Drawable {\n    // Implementation\
    \ of the draw method\n    @Override\n    public void draw() {\n        System.out.println(\"\
    Drawing a circle with color: \" + COLOR);\n    }\n}\n\n// Another concrete class\
    \ implementing the Drawable interface\nclass Rectangle implements Drawable {\n\
    \    // Implementation of the draw method\n    @Override\n    public void draw()\
    \ {\n        System.out.println(\"Drawing a rectangle with color: \" + COLOR);\n\
    \    }\n}\n\npublic class InterfaceExample {\n    public static void main(String[]\
    \ args) {\n        // Using interface and its implementing classes\n        Drawable\
    \ circle = new Circle();\n        Drawable rectangle = new Rectangle();\n\n  \
    \      // Calling the draw method on objects of implementing classes\n       \
    \ circle.draw();\n        rectangle.draw();\n\n        // Accessing the constant\
    \ from the interface\n        System.out.println(\"Default color from interface:\
    \ \" + Drawable.COLOR);\n    }\n}\n```\n\n## Abstraction Demonstration\n\n###\
    \ 2. Concrete Subclasses (Circle and Rectangle)\n![](image_rsrc9PM.jpg)The `Circle`\
    \ and `Rectangle` classes extend the `Shape` abstract class and provide implementations\
    \ for the abstract `draw` method.\n\n### 3. Interface (Drawable)\n![](image_rsrc9PM.jpg)The\
    \ `Drawable` interface declares an abstract method (`draw`).\n![](image_rsrc9PM.jpg)It\
    \ serves as a contract for classes that implement it.\n\n### 4. Class Implementing\
    \ Interface (Triangle)\n![](image_rsrc9PM.jpg)The `Triangle` class implements\
    \ the `Drawable` interface and provides an implementation for the `draw` method.\n\
    \n### 5. Object Creation and Method Invocation\n![](image_rsrc9PM.jpg)Objects\
    \ of the concrete subclasses and the implementing class are created.\n![](image_rsrc9PM.jpg)The\
    \ `draw` and `displayInfo` methods are invoked on these objects.\n\n### 6. Output\n\
    ![](image_rsrc9PM.jpg)The program demonstrates the concept of abstraction by using\
    \ abstract classes and interfaces. The concrete classes provide specific implementations\
    \ of abstract methods, and the interface defines a contract for implementing classes.\n"
