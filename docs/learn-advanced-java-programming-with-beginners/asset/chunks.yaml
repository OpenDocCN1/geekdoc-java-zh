    \ Java 程序中用于决策的基础控制流结构。\n\n# Java Switch\n\n在 Java 中，`switch` 语句是一种控制流语句，提供了一种简洁易读的方式处理多个条件或情况。它允许程序根据表达式的值执行不同的代码块。\n\
    \n### 1. 表达式评估\n\n![](img/image_rsrc9SU.jpg)`switch` 语句以 `switch` 关键字开头，随后跟着括号内的表达式。该表达式被评估，其结果决定了执行哪个代码块。\n\
    \n### 2. Case Labels\n\n![](img/image_rsrc9SV.jpg)`switch` 语句包含多个 case 标签，每个标签表示表达式可能具有的值或值范围。case\
    \ 标签后面跟着冒号（:）和关联的代码块。\n\n### 3. 匹配与执行\n\n![](img/image_rsrc9SW.jpg)当表达式的值与某个 case\
    \ 标签匹配时，将执行相应的代码块。`switch` 语句继续执行代码，直到遇到 `break` 语句或到达 switch 块的结束。\n\n### 4.\
