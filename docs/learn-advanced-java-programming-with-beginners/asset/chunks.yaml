    ![](image_rsrcA1B.jpg)Static Nested Class: A static class that is defined within  another
    class. It is not associated with instances of the  enclosing class.


    ![](image_rsrcA1C.jpg)Local Inner Class: A class defined within a block of code,
    such  as a method. It has access to local variables of the enclosing scope.


    ![](image_rsrcA1D.jpg)Anonymous Inner Class: A class without a name that is  defined
    and instantiated in a single expression. It is often  used for one-time use, such
    as in event handling.


