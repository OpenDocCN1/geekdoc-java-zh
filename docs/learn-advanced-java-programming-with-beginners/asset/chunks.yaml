    ) are added to the `ArrayList` using the `add` method.\n\n3. **Displaying Elements\
    \ using Enhanced For Loop:**\n![](image_rsrcA4E.jpg)An enhanced for loop is used\
    \ to iterate through the `ArrayList` and display its elements.\n\n4. **Accessing\
    \ Elements by Index:**\n![](image_rsrcA4F.jpg)The `get` method is used to access\
    \ and display the element at a specific index (index 1).\n\n5. **Checking if ArrayList\
    \ Contains a Specific Element:**\n![](image_rsrcA4G.jpg)The `contains` method\
    \ is used to check if the `ArrayList` contains a specific element (\"Banana\"\
    ).\n\n6. **Removing an Element by Value:**\n![](image_rsrcA4H.jpg)The `remove`\
    \ method is used to remove an element (\"Orange\") from the `ArrayList`.\n\n7.\
    \ **Displaying Updated ArrayList:**\n![](image_rsrcA4J.jpg)The `ArrayList` is\
    \ displayed after removing the specified element.\n\n8. **Checking the Size of\
    \ the ArrayList:**\n![](image_rsrcA4K.jpg)The `size` method is used to get the\
    \ size (number of elements) of the `ArrayList`.\n\n9. **Clearing the ArrayList:**\n\
    ![](image_rsrcA4M.jpg)The `clear` method is used to remove all elements from the\
    \ `ArrayList`.\n\n10. **Displaying the ArrayList after Clearing:**\n![](image_rsrcA4N.jpg)The\
    \ `ArrayList` is displayed after clearing, and it should be empty.\n\nIn summary,\
    \ `ArrayList` is a dynamic array implementation in Java that provides flexibility\
    \ in managing collections of elements. It is part of the Java Collections Framework\
    \ and offers various methods for adding, accessing, removing, and manipulating\
    \ elements in a list-like structure. The ability to dynamically resize makes it\
    \ a convenient choice for scenarios where the size of the collection is not known\
    \ in advance or may change during runtime.\n\n# Java LinkedList\n\nA `LinkedList`\
    \ in Java is a class provided by the Java Collections Framework that represents\
    \ a doubly-linked list. Unlike arrays or `ArrayLists`, a `LinkedList` is not based\
    \ on contiguous memory blocks. Instead, it consists of nodes, each containing\
    \ a data element and references to the previous and next nodes in the list.\n\n\
    1. **Doubly-Linked Structure:**\n![](image_rsrcA4P.jpg)Each node in a `LinkedList`\
    \ contains a data element and two references: one to the previous node and another\
    \ to the next node.\n\n2. **Dynamic Sizing:**\n![](image_rsrcA4R.jpg)A `LinkedList`\
    \ can dynamically grow or shrink as elements are added. This makes it suitable\
    \ for scenarios where the list size changes frequently.\n\n3. **Constant-Time\
    \ Insertions and Removals:**\n![](image_rsrcA4S.jpg)Insertions and removals at\
    \ the beginning, end, or at a specific index of a `LinkedList` can be performed\
    \ in constant time (O(1)) compared to an `ArrayList`, where such operations may\
    \ take linear time (O(n)).\n\n4. **No Contiguous Memory Requirement:**\n![](image_rsrcA4T.jpg)Unlike\
    \ arrays or `ArrayLists`, a `LinkedList` does not require a contiguous block to\
    \ store its elements. This non-contiguous allows for efficient insertions and\
    \ removals.\n\n5. **Slower Random Access:**\n![](image_rsrcA4U.jpg)Accessing elements\
    \ in a `LinkedList` by index is slower compared to an `ArrayList`. In a `LinkedList`,\
    \ accessing an element at a specific index may require traversing the list from\
    \ the beginning or end.\n\n6. **Iterators for Traversal:**\n![](image_rsrcA4V.jpg)`LinkedList`\
    \ provides iterators that facilitate efficient traversal of the list. These iterators\
    \ allow you to move forward or backward through the elements.\n\n7. **Support\
    \ for Duplicate Elements:**\n![](image_rsrcA4W.jpg)`LinkedList` supports the storage\
    \ of duplicate elements, allowing multiple occurrences of the same value in the\
    \ list.\n\n8. **Suitable for Frequent Insertions and Removals:**\n![](image_rsrcA4X.jpg)`LinkedList`\
    \ is well-suited for scenarios where frequent insertions and removals are expected.\
    \ This makes it a good choice for implementing certain data structures or algorithms.\n\
    \n9. **Limited Random Access:**\n![](image_rsrcA4Y.jpg)While `LinkedList` supports\
    \ random access, it is less efficient than an `ArrayList` for scenarios where\
    \ frequent random access is a primary requirement.\n\n10. **Node-Based Structure:**\n\
    ![](image_rsrcA4Z.jpg)The `LinkedList` class contains an internal implementation\
    \ of nodes that manage the links between elements. Each node contains a reference\
    \ to the previous and next nodes, forming the linked structure.\n\n11. **Available\
    \ in the java.util Package:**\n![](image_rsrcA50.jpg)The `LinkedList` class is\
    \ part of the `java.util` package, which is a part of the Java Collections Framework.\
    \ This framework provides a comprehensive set of interfaces and classes for handling\
    \ collections of objects.\n\nIn summary, a `LinkedList` in Java is a doubly-linked\
    \ list with dynamic sizing and efficient insertions and removals. It is suitable\
    \ for scenarios where the list size changes frequently, and constant-time insertions\
    \ and removals are important. However, its performance for random access operations\
    \ is slower compared to an `ArrayList`.\n"
