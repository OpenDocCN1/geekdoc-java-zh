    9. Default Values and Initialization:


    ![](image_rsrc9YC.jpg)Constructors are responsible for assigning initial values
    to the  object''s attributes. If attributes are not explicitly initialized, Java
    provides default values based on their data types.


    10.  Object  Allocation:


    ![](image_rsrc9YD.jpg)Constructors are called when an object is created using
    the new keyword. The new keyword allocates memory for the object and calls the
