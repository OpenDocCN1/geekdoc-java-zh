  trans: "\n\n![](img/image_rsrc9YE.jpg)构造函数可以拥有访问修饰符（例如 `public`、`private`、`protected`\
    \ 或 `package-private`），用于控制它们的可见性。访问修饰符的选择决定了构造函数可以在哪里调用。\n\n## 12. 构造函数链\n\n\
    ![](img/image_rsrc9YF.jpg)构造函数可以使用 `this()` 调用同一类中的其他构造函数。这允许代码重用，并能够为某些参数提供默认值。\n\
    \n总之，Java 中的构造函数是用于初始化对象的特殊方法。它们通过为属性分配初始值，确保对象具有有效且一致的状态。构造函数可以是参数化的、重载的，并根据对象创建期间提供的值来定制初始化过程。\n\
    \n在 Java 中，构造函数是一种特殊方法，在创建类对象时被调用。它用于初始化对象的状态，通常通过为类的实例变量设置初始值。这里有一个说明 Java 构造函数的示例：\n\
    \n```java\npublic class ConstructorsExample {\n    // 实例变量\n    String brand;\n\
    \    String model;\n    int year;\n\n    // 默认构造函数（无参数构造函数）\n    public ConstructorsExample()\
    \ {\n        // 默认值\n        brand = \"Unknown\";\n        model = \"Unknown\"\
    ;\n        year = 0;\n    }\n\n    // 参数化构造函数\n    public ConstructorsExample(String\
    \ brand, String model, int year) {\n        // 使用提供的值初始化实例变量\n        this.brand\
    \ = brand;\n        this.model = model;\n        this.year = year;\n    }\n\n\
    \    // 显示汽车信息的方法\n    public void displayInfo() {\n        System.out.println(\"\
    Car: \" + brand + \" \" + model + \" (\" + year + \")\");\n    }\n\n    public\
    \ static void main(String[] args) {\n        // 使用不同的构造函数创建对象\n        ConstructorsExample\
    \ defaultCar = new ConstructorsExample(); // 使用默认构造函数\n        ConstructorsExample\
    \ customCar = new ConstructorsExample(\"Toyota\", \"Camry\", 2022); // 使用参数化构造函数\n\
    \n        // 显示汽车信息\n        System.out.println(\"Default Car:\");\n        defaultCar.displayInfo();\n\
    \n        System.out.println(\"\\nCustom Car:\");\n        customCar.displayInfo();\n\
    \    }\n}\n```\n\n### 解析：\n\n#### 1. 默认构造函数\n![](img/image_rsrc9YG.jpg)该类有一个没有参数的默认构造函数（`public\
    \ ConstructorsExample()`）。\n\n![](img/image_rsrc9YH.jpg)当在不提供特定值创建对象时，此构造函数用默认值初始化实例变量。\n\
    \n#### 2. 参数化构造函数\n![](img/image_rsrc9YJ.jpg)还有一个参数化构造函数（`public ConstructorsExample(String\
    \ brand, String model, int year)`），允许在带参数创建对象时用特定值初始化实例变量。\n\n#### 3. this 关键字\n\
    ![](img/image_rsrc9YK.jpg)`this` 关键字用于引用当前实例。\n\n#### 4. 对象创建\n![](img/image_rsrc9YM.jpg)创建了对象\
    \ `defaultCar` 和 `customCar`。\n\n#### 5. 显示方法\n![](img/image_rsrc9YN.jpg)使用 `displayInfo`\
    \ 方法显示。\n\n总之，Java 中的构造函数是用于初始化对象的特殊方法。它们通过为属性分配初始值，确保对象具有有效且一致的状态。构造函数可以是参数化的、重载的，并根据对象创建期间提供的值来定制初始化过程。\n\
    \n## 修饰符\n\n在 Java 中，修饰符是控制类、方法和变量的访问、可见性和行为的关键字。\n\n### 1. 访问修饰符\n访问修饰符控制类和成员的可见性。共有四种访问级别：\n\
    \n- `public`：可以从任何类访问。\n- `protected`：可以在同一个包内以及子类中访问。\n- `default` (包私有)：可以在同一个包内访问。\n\
    - `private`：仅在所属类内部访问。\n\n### 2. 非访问修饰符\n非访问修饰符为元素提供了额外信息：\n\n- `final`：类不能被继承，方法不能被重写，变量在初始化后不能重新赋值。\n\
    - `abstract`：抽象类不能实例化，抽象方法必须由子类实现。\n- `static`：成员属于类本身而不是类的实例。\n- `transient`：表示在对象持久化时变量不应被序列化。\n\
    - `volatile`：用于可能被多个线程访问的变量；确保读写操作是原子的且对所有线程可见。\n\n### 3. 修饰符组合\n多个修饰符可以一起使用。例如，一个方法可以同时是\
    \ `public` 和 `static`，一个变量可以同时是 `final` 和 `static`。\n\n### 4. 默认访问\n如果没有指定访问修饰符，默认访问级别为包私有（package-private）。这意味着该类或成员仅在其包内可访问。\n\
    \n### 5. 封装\n修饰符在封装中起着至关重要的作用，封装是将数据（属性）和方法封装在类中，并控制对对象内部状态的访问。\n\n"
