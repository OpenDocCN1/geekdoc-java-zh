    ### 2. True Block Execution\n\n![](image_rsrc9SF.jpg)If the boolean expression\
    \ evaluates to `true`, the block of code immediately following the `if` statement\
    \ is executed. This block is often referred to as the \"true block\" or \"if block.\"\
    \n\n### 3. Else Block\n\n![](image_rsrc9SG.jpg)Optionally, the `if...else` statement\
