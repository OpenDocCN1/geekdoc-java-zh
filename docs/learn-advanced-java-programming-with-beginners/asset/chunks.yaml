    # Java Enums


    In Java, an enum (enumeration) is a special data type that  consists of a fixed
    set of named values.


    1.  Definition:


    ![](image_rsrcA2T.jpg)An enum in Java is a way to represent a fixed set of named
    values or constants. It provides a convenient and type-safe way to work with predefined,
    distinct values.


    2.  Named  Constants:


    ![](image_rsrcA2U.jpg)Enums are often used to define a set of named constants  that
    represent the possible values for a certain property or  attribute. These constants
    are typically related and have a  well-defined, limited scope.


    3.  Type Safety:


    ![](image_rsrcA2V.jpg)Enums  provide  type  safety,  meaning  that  the  compiler
    checks the validity of enum values at compile time. This  helps avoid runtime
    errors related to incorrect or undefined values.


    4.  Enumeration  Members:


    ![](image_rsrcA2W.jpg)Enumerations  consist  of  a  finite  list  of  members,  each
    representing a distinct value. Members are usually named  using uppercase letters
    to emphasize their constant nature.


    5.  Limited Instances:


    ![](image_rsrcA2X.jpg)Enums are designed to have a limited, predefined number
    of instances.  Unlike  other  classes,  you  cannot  create  new instances of
    an enum using the new keyword.


    6.  Enumerating Values:


    ![](image_rsrcA2Y.jpg)You can iterate over the values of an enum using the values()  method,
    which returns an array containing all the enum  constants in the order they were
    declared.


    7.  Enum  Constants  as  Objects:


    ![](image_rsrcA2Z.jpg)Each enum constant is an object of its enum type. This  means
    that enum constants can have associated methods,  fields, or even implement interfaces.


    8.  Improving  Readability:


    ![](image_rsrcA30.jpg)Enums enhance code readability by providing a clear and
    self- documenting way to represent a set of related values. Instead  of using
    arbitrary integers or strings, enum constants give  meaningful names to values.


    9.  Switch Statements:


    ![](image_rsrcA31.jpg)Enums are often used with switch statements to handle  different
    cases based on the enum value. This improves the  readability and maintainability
    of switch-based logic.


    10.  Singleton Pattern:


    ![](image_rsrcA32.jpg)Enums can be used to implement the singleton pattern. By  defining
    a single enum constant, you ensure that only one  instance of the enum type exists.


    11.       Enhanced Enum Features (Since Java 5):


    ![](image_rsrcA33.jpg)Starting from Java 5, enums gained additional features,
    such as the ability to declare constructors, instance methods, and  fields. Enums
    can also implement interfaces and override  methods.


    12.  Improved Code Safety:


    ![](image_rsrcA34.jpg)Enums contribute to improved code safety by preventing the
    accidental use of invalid values. With enums, you can be  confident that a variable
    of the enum type can only hold one of the predefined constant values.


    13.  Enums  in  API  Design:


    ![](image_rsrcA35.jpg)Enums are commonly used in API design to define sets of  related
    values and provide a stable interface. They help avoid the use of magic numbers
    or strings in method parameters.


    14.  Constants with Behavior:


    ![](image_rsrcA36.jpg)Enums can encapsulate behavior along with constants. Each
    enum constant can have its own behavior, allowing for a more  organized and modular
    code structure.


    In summary, Java enums are a way to represent a fixed set of  named values or
    constants. They provide type safety, limited  instances, and improved code readability.
    Enums are often used to define sets of related constants, improving the robustness
    and  maintainability of Java code.


    In Java,  an  interface  is  a  collection  of  abstract  methods (methods without
    a body) and constants. Interfaces provide a way to achieve abstraction, define
    contracts for classes, and  enable multiple inheritance of method signatures.
    Any class that implements  an  interface  must  provide  concrete implementations
    for all the abstract methods declared in that interface. Here''s an example that
    demonstrates the use of a  Java interface:


    //  Example  of  Java  Interface


    // Interface representing a shape that can be drawn interface Drawable {


    // Abstract method (to be implemented by classes) void draw();


    // Constant (implicitly public, static, and final) String COLOR = "Black";


    }


    // Concrete class implementing the Drawable interface class Circle implements
    Drawable {


    // Implementation of the draw method @Override


    public  void  draw()  {


    System.out.println("Drawing  a  circle  with  color:  "  +  COLOR);


    }


    }


    // Another concrete class implementing the Drawable interface class Rectangle
    implements Drawable {


    // Implementation of the draw method @Override


    public  void  draw()  {


    System.out.println("Drawing  a  rectangle  with  color:  "  +  COLOR);


    }


    }


    public class InterfaceExample {


    public  static  void  main(String[]  args)  {


    // Using interface and its implementing classes Drawable circle = new Circle();


    Drawable  rectangle  =  new  Rectangle();


    // Calling the draw method on objects of implementing classes circle.draw();


    rectangle.draw();


    // Accessing the constant from the interface  System.out.println("Default color
    from interface: " + Drawable.COLOR);


    }


    }


    Explanation:


    1.     Interface  (Drawable):


    ![](image_rsrc9PM.jpg)The Drawable interface declares an abstract method  (draw)
    and a constant (COLOR).


    ![](image_rsrc9PM.jpg)The  draw  method  represents  the  contract  that implementing
    classes must fulfill, and the constant is  implicitly public, static, and final.


    2.      Concrete Classes (Circle and Rectangle):


    ![](image_rsrc9PM.jpg)The  Circle  and  Rectangle  classes  implement  the  Drawable
    interface, providing concrete implementations  for the draw method.


    3.      Object Creation and Method Invocation:


    ![](image_rsrc9PM.jpg)Objects of the implementing classes are created using the
    interface type (Drawable).


    ![](image_rsrc9PM.jpg)The draw method is called on these objects.


    4.  Accessing Interface Constant:


    ![](image_rsrc9PM.jpg)The  constant  COLOR  is  accessed  directly  from  the
    interface, demonstrating that interface constants are  implicitly public, static,
    and final.


    5.  Output:


    ![](image_rsrc9PM.jpg)The program demonstrates the use of an interface to  define  a  contract  for  classes.  Objects  of  the  implementing  classes  are  created,  and  their  draw  methods
    are invoked. The interface constant is also  accessed.


    In summary, a Java interface is a way to achieve abstraction by  defining a contract
    that classes must adhere to. Implementing classes provide concrete implementations
    for the abstract  methods declared in the interface, allowing for a consistent
    and  flexible design. Interfaces are widely used in Java for achieving  multiple
    inheritance, enabling the creation of classes with  shared behavior without a
    common base class.


