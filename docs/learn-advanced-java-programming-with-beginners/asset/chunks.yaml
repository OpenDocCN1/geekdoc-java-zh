    System.out.println(\"Double Number: \" + doubleNumber); \nSystem.out.println(\"\
    Character: \" + character);  \nSystem.out.println(\"Flag: \" + flag);  \nSystem.out.println(\"\
    Text: \" + text);\n\n// Using arrays (reference data type)\nint[] numbers = {1,\
