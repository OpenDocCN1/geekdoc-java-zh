    \ 来表示不包含时间部分的日期，使用 `DateTimeFormatter` 用于解析。\n\n# JAVA ArrayList\n\n让我们讨论一下 Java\
    \ 中 `ArrayList` 的概念。\n\n1. **动态扩展：**\n![](img/image_rsrcA3Z.jpg)`ArrayList` 会随着元素的添加而自动增长或收缩。\n\
    \n2. **泛型：**\n![](img/image_rsrcA40.jpg)`ArrayList` 是泛型的，这意味着它可以存储特定类型的元素。\n\n\
    3. **可调整数组：**\n![](img/image_rsrcA41.jpg)`ArrayList` 内部使用可调整的数组来存储元素。当数组达到容量时，它会自动调整大小。\n\
    \n4. **操作方法：**\n![](img/image_rsrcA42.jpg)`ArrayList` 提供了许多操作元素的方法，如 `add()`、`remove()`、`get()`、`set()`\
    \ 等。这些方法允许你添加、删除、访问和修改元素。\n\n5. **零索引：**\n![](img/image_rsrcA43.jpg)像数组一样，`ArrayList`\
    \ 使用零索引。第一个元素位于索引 0，第二个位于索引 1，依此类推。\n\n6. **空值：**\n![](img/image_rsrcA44.jpg)`ArrayList`\
    \ 允许存储空值，为处理未元素提供了灵活性。\n\n7. **性能考量：**\n![](img/image_rsrcA45.jpg)虽然 `ArrayList`\
    \ 提供动态调整，但它可能涉及频繁的调整操作，影响性能。对于频繁插入删除的场景，`LinkedList` 可能更合适。\n\n8. **遍历元素：**\n\
    ![](img/image_rsrcA46.jpg)你可以使用迭代器、增强 for 循环或 Java 8 引入的流操作来遍历 `ArrayList` 的元素。\n\
    \n9. **集合框架：**\n![](img/image_rsrcA47.jpg)`ArrayList` 是 Java 集合框架的一部分，该框架包含了处理对象集合的各种接口和类。该框架简化了\
    \ Java 中处理集合的过程。\n\n10. **增强 for 循环：**\n![](img/image_rsrcA48.jpg)增强 for 循环（for-each\
    \ 循环）常用于遍历 `ArrayList` 中的元素，了一种简洁易读的方式顺序访问每个元素。\n\n11. **随机访问：**\n![](img/image_rsrcA49.jpg)`ArrayList`\
    \ 提供常数时间的随机访问，这意味着根据索引访问元素所需的时间与列表大小无关。\n\n12. **List 接口的实现：**\n![](img/image_rsrcA4A.jpg)`ArrayList`\
    \ 实现了 `List` 接口，该接口扩展了 `Collection` 接口。这意味着它支持这些接口定义的所有操作，包括添加、删除和访问元素。\n\n13.\
    \ **装箱与拆箱**\n\n"
- fmt: "\n![](image_rsrcA4B.jpg)`ArrayList` automatically handles the boxing and unboxing\
    \ of primitive data types, allowing you to store integers, booleans, and other\
    \ primitives without explicitly converting them to their corresponding wrapper\
    \ classes.\n\nIn summary, `ArrayList` in Java is a dynamic, resizable array-like\
