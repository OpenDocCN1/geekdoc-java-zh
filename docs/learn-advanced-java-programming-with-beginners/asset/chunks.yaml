    \ // Calls the overridden calculateArea method based on the actual object type\n\
    \        calculateAndPrintArea(circle);\n        calculateAndPrintArea(rectangle);\n\
    \    }\n\n    // Compile-time polymorphism (method overloading)\n    public static\
    \ void printArea(int side) {\n        System.out.println(\"Area of Square: \"\
    \ + (side * side));\n    }\n\n    public static void printArea(double side) {\n\
    \        System.out.println(\"Area of Square (double): \" + (side * side));\n\
    \    }\n\n    // Runtime polymorphism (method overriding)\n    public static void\
    \ calculateAndPrintArea(Shape shape) {\n        // Calls the overridden calculateArea\
    \ method based on the actual object type\n        shape.calculateArea();\n   \
    \ }\n}\n```\n\n### Explanation:\n\n1. **Base Class (Shape):**\nThe `Shape` class\
    \ is a base class with a method `calculateArea` that serves as a placeholder to\
    \ be overridden by subclasses.\n\n2. **Subclasses (Circle and Rectangle):**\n\
    The `Circle` and `Rectangle` classes are subclasses of `Shape` that override the\
    \ `calculateArea` method.\n\n3. **Compile-time Polymorphism (Method Overloading):**\n\
    The `printArea` method is overloaded with two versions—one accepting an `int`\
    \ and another accepting a `double`. The appropriate version is selected based\
    \ on the argument type at compile time.\n\n4. **Runtime Polymorphism (Method Overriding):**\n\
    Objects of the `Circle` and `Rectangle` classes are created and assigned to variables\
    \ of type `Shape`.\nThe `calculateAndPrintArea` method demonstrates runtime polymorphism.\
    \ It takes a `Shape` parameter, and the actual method called depends on the type\
    \ of the object at runtime.\n\n5. **Output:**\nThe program demonstrates how polymorphism\
    \ allows different methods to be called based on the context, enabling flexibility\
    \ in handling objects of different types.\n\nIn summary, polymorphism in Java\
    \ allows methods to be called on objects of different types, either at compile\
    \ time (method overloading) or at runtime (method overriding). It provides a way\
