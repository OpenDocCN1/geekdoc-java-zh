    # Java Inheritance


    In  Java,  inheritance  is  a  fundamental  concept  in  object-oriented  programming
    (OOP) that allows one class to inherit the properties and  behaviors (fields and
    methods) of another class.


    1.  Definition:


    ![](image_rsrcA09.jpg)Inheritance is a mechanism that enables a new class (subclass
    or derived class) to inherit attributes and behaviors from an existing class (superclass
    or base class). The new class can then extend or specialize the functionalities
    of the existing class.


    2.  Superclass  and  Subclass:


    ![](image_rsrcA0A.jpg)The existing class from which properties and behaviors are
    inherited  is known as the superclass. The new class that inherits from the  superclass
    is called the subclass. The subclass is said to "extend" or  "derive from" the
    superclass.


    3.  Code  Reusability:


    ![](image_rsrcA0B.jpg)Inheritance promotes code reusability by allowing the reuse
    of fields  and methods defined in the superclass. This reduces redundancy and
    supports the principle of "Don''t Repeat Yourself" (DRY).


    4.  "is-a"  Relationship:


    ![](image_rsrcA0C.jpg)Inheritance models the "is-a" relationship between classes.
    If Class B inherits from Class A, it can be said that "B is a type of A." This  relationship  enhances  code  clarity  and  reflects  real-world  relationships.


    5.  Fields  Inheritance:


    ![](image_rsrcA0D.jpg)Subclasses inherit fields (attributes) from the superclass.
    This means that the subclass automatically has access to the fields of the  superclass
    without needing to redefine them.


    6.  Methods Inheritance:


    ![](image_rsrcA0E.jpg)Subclasses inherit methods from the superclass. They can
    use the  methods  as  they  are,  override  them  to  provide  specialized  implementations,
    or introduce new methods.


    7.  Access Modifiers:


    ![](image_rsrcA0F.jpg)Access modifiers (e.g., public, protected, private, or package-private)
    influence the visibility of inherited members. For example, a private  field in
    the superclass is not directly accessible in the subclass.


    8.  Overriding  Methods:


    ![](image_rsrcA0G.jpg)Subclasses  can  override  (redefine)  methods  inherited  from  the
    superclass. Method overriding allows a subclass to provide its own  implementation
    of a method while keeping the method signature the same.


    9.  Method  Overloading:


    ![](image_rsrcA0H.jpg)Overloading methods in a subclass (having multiple methods
    with the same  name  but  different  parameter  lists)  is  not  considered  overriding.
    Overloading in the subclass does not replace or override the superclass methods.


    10.  Inheriting  Constructors:


    ![](image_rsrcA0J.jpg)Constructors are not inherited, but they are invoked in
    the process of creating an object of the subclass. Subclasses can use the super()  keyword
    to call a constructor from the superclass.


    11.  Multiple  Inheritance:


    ![](image_rsrcA0K.jpg)Java supports single inheritance, meaning a class can inherit
    from  only  one  superclass.  This  avoids  the  complexity  and  ambiguity associated
    with multiple inheritance.


    12.  Abstract  Classes  and  Interfaces:


    ![](image_rsrcA0M.jpg)Abstract classes and interfaces in Java are used to define
    common  structures for multiple classes. Abstract classes can provide a partial
    implementation, while interfaces define a contract for implementing classes. Both
    support inheritance.


    13.  Final  Classes  and  Methods:


    ![](image_rsrcA0N.jpg)The final keyword can be used to prevent a class from being
    extended (final class) or a method from being overridden (final method).


    14.  Polymorphism:


    ![](image_rsrcA0P.jpg)Inheritance is closely related to polymorphism, another
    OOP concept. Polymorphism allows objects of different classes to be treated as  objects
    of a common base type, enabling flexibility in code design and usage.


    15.  Object-Oriented  Design:


    ![](image_rsrcA0R.jpg)Inheritance is a key component of object-oriented design.
    It allows for  the creation of hierarchies of related classes, making it easier
    to  model and understand complex systems.


    In summary, Java inheritance is a mechanism that allows a new class to inherit
    properties and behaviors from an existing class, promoting code reusability, modeling
    relationships, and supporting the principles of OOP. The "is-a" relationship,
    code clarity, and polymorphism are among the  benefits of inheritance in Java.


    In Java, inheritance is a key concept in Object-Oriented Programming  (OOP) that
    allows a class to inherit the properties and behaviors (fields  and methods) of
    another class. The class that is inherited from is called  the superclass or parent
    class, and the class that inherits is called the  subclass or child class. Inheritance
    facilitates code reuse, promotes  modularity, and supports the creation of a hierarchy
    of classes. Here''s an example of Java inheritance:


    // Parent class (superclass) class Vehicle {


    // Fields (attributes) String brand;


    String  model;


    // Constructor


    public  Vehicle(String  brand,  String  model)  { this.brand = brand;


    this.model = model;


    }


    //  Method  to  display  information  about  the  vehicle public void displayInfo()
    {


    System.out.println("Vehicle: " + brand + " " + model);


    }


    }


    /


    /  Child  class  (subclass)  inheriting  from  Vehicle class Car extends Vehicle
    {


    //  Additional  field  specific  to  Car int year;


    //  Constructor  for  Car


    public  Car(String  brand,  String  model,  int  year)  {


    //  Call  the  constructor  of  the  superclass  (Vehicle) super(brand, model);


    this.year  =  year;


    }


    //  Overridden  method  to  include  Car-specific  information @Override


    public void displayInfo() {


    super.displayInfo();  //  Call  the  displayInfo  method  of  the superclass


    System.out.println("Year: " + year);


    }


    }


    public class InheritanceExample {  public static void main(String[] args) {


