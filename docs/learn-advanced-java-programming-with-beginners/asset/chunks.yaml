    # Java OOP


    Object-Oriented Programming (OOP) is a programming paradigm  that uses objects,
    which are instances of classes, to organize and structure code.


    1.  Objects:


    ![](image_rsrc9WE.jpg)In OOP, everything is treated as an object. An object is
    an  instance of a class and represents a real-world entity with attributes (data)
    and behaviors (methods).


    2.  Classes:


    ![](image_rsrc9WF.jpg)A class is a blueprint or template for creating objects.
    It  defines the properties (attributes) and behaviors (methods)  that its objects
    will have.


    3.  Encapsulation:


    ![](image_rsrc9WG.jpg)Encapsulation is the bundling of data (attributes) and the  methods
    that operate on the data within a single unit, i.e., a class. This helps in hiding
    the internal details of an object and exposing only what is necessary.


    4.  Abstraction:


    ![](image_rsrc9WH.jpg)Abstraction is the process of simplifying complex systems
    by modeling  classes  based  on  essential  properties  and  behaviors. It allows
    programmers to focus on what an object  does without worrying about how it achieves
    its functionality.


    5.  Inheritance:


    ![](image_rsrc9WJ.jpg)Inheritance is a mechanism that allows a class (subclass
    or  derived  class)  to  inherit  properties  and  behaviors  from another class
    (superclass or base class). It promotes code  reuse  and  establishes  an  "is-a"  relationship  between  classes.


    6.  Polymorphism:


    ![](image_rsrc9WK.jpg)Polymorphism allows objects of different classes to be  treated
    as objects of a common base class. It enables  flexibility and extensibility in
    the code, allowing methods to  be used with objects of different types.


    7.  Overloading and Overriding:


    ![](image_rsrc9WM.jpg)Method overloading involves defining multiple methods with  the
    same name in a class but with different parameter lists. Method overriding occurs
    when a subclass provides a specific implementation for a method that is already
    defined in its  superclass.


    8.  Modularity:


    ![](image_rsrc9WN.jpg)OOP promotes modularity by dividing a complex system into  smaller,  manageable  units  (objects).  Each  object  encapsulates
    its data and behavior, making it a self-contained module.


    9.  Message  Passing:


    ![](image_rsrc9WP.jpg)Objects communicate with each other by sending messages.  This
    involves invoking methods on one object, triggering  actions or requesting information.


    10.  Instantiation:


    ![](image_rsrc9WR.jpg)Instantiation is the process of creating an object from
    a class. When an object is instantiated, memory is allocated for its attributes,
    and it becomes a distinct entity with its own state.


    11.  Constructor and Destructor:


    ![](image_rsrc9WS.jpg)A constructor is a special method in a class used for  initializing
    the object''s state when it is created. A destructor, though not explicitly defined
    in Java, is responsible for  releasing resources before an object is destroyed.


    12.  Interfaces:


    ![](image_rsrc9WT.jpg)Interfaces define a contract for classes, specifying a set
    of  methods that implementing classes must provide. They  support multiple inheritance
    in Java and help achieve a level  of abstraction.


    In summary, Java Object-Oriented Programming is centered  around the concepts
    of objects and classes, encapsulation,  abstraction,  inheritance,  and  polymorphism.  These  principles  help
    organize code, improve code reuse, and model real-world entities and relationships,
    leading to more modular, extensible,  and maintainable software.


