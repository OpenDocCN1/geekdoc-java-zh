  trans: "\n\n![](img/image_rsrc9XN.jpg)属性声明在类体内部但在任何方法之外。它们通常使用访问修饰符（例如 `public`、`private`、`protected`\
    \ 或 `package-private`）来控制它们的可见性。\n\n### 5. 可访问性\n\n![](img/image_rsrc9XP.jpg)访问修饰符定义了类属性的可见性和可访问性。例如，使用\
    \ `private` 可以确保属性仅在类内部可访问，从而促进封装性。\n\n### 6. 数据类型\n\n![](img/image_rsrc9XR.jpg)属性具有特定的数据类型，定义了它们可以存储的数据种类。常见类型包括基本类型（例如\
    \ `int`、`double`）和对象（例如自定义类、`String`）。\n\n### 7. 初始化\n\n![](img/image_rsrc9XS.jpg)类属性可以在声明时初始化，也可以在构造函数中初始化。初始化是在创建对象时为属性设置初始值。\n\
    \n### 8. 默认值\n\n![](img/image_rsrc9XT.jpg)如果属性没有显式初始化，Java 会根据其数据类型分配一个默认值。例如，数值类型的默认值为\
    \ `0`，而对象引用的默认值为 `null`。\n\n### 9. 实例属性与静态属性\n\n![](img/image_rsrc9XU.jpg)类属性可以是实例（非静态）的或静态的。实例属性为每个对象拥有独立的拷贝，而静态属性在类的所有对象之间共享。\n\
    \n### 10. 封装\n\n![](img/image_rsrc9XV.jpg)属性通过允许类控制对其内部状态的访问，有助于封装。封装通过限制直接访问和修改来保护对象数据的完整性。\n\
    \n### 11. 访问器和变器方法\n\n![](img/image_rsrc9XW.jpg)为了与私有属性交互，通常会提供访问器（getter）和变器（setter）方法。访问器方法获取属性的值，变器方法修改其值。\n\
    \n### 12. 与方法的关系\n\n![](img/image_rsrc9XX.jpg)属性与类中的方法紧密相关。方法对存储在属性中的数据进行操作，提供定义类功能的行为。\n\
    \n总结，Java 中的类属性定义了从类创建的对象的或或特征。它们在建模与对象相关的数据方面起着至关重要的作用，并对类的整体结构和行为有所贡献。属性在类内部声明，并被该类的方法访问。\n\
    \n在 Java 中，类方法是与类本身关联而非与类的实例（对象）关联的方法。类方法也被称为静态方法，使用 `static` 关键字声明。这些方法可以直接在类上调用，而无需创建类的实例。这里有一个示例来说明\
    \ Java 类方法：\n\n```java\npublic class ClassMethodsExample {\n    // 类属性（静态变量）\n\
    \    static int numberOfCars = 0;\n\n    // 实例变量\n    String brand;\n    String\
    \ model;\n    int year;\n\n    // 初始化实例变量的构造函数\n    public ClassMethodsExample(String\
    \ brand, String model, int year) {\n        this.brand = brand;\n        this.model\
    \ = model;\n        this.year = year;\n\n        // 增加类属性（在所有实例间共享）\n        numberOfCars++;\n\
    \    }\n\n    // 显示汽车信息的实例方法\n    public void displayInfo() {\n        System.out.println(\"\
    Car: \" + brand + \" \" + model + \" (\" + year + \")\");\n    }\n\n    // 显示汽车总数的类方法\n\
    \    public static void displayTotalCars() {\n        System.out.println(\"Total\
    \ number of cars: \" + numberOfCars);\n    }\n\n    public static void main(String[]\
    \ args) {\n        // 创建类的对象\n        ClassMethodsExample car1 = new ClassMethodsExample(\"\
    Toyota\", \"Camry\", 2022);\n        ClassMethodsExample car2 = new ClassMethodsExample(\"\
    Honda\", \"Accord\", 2023);\n\n        // 通过对象访问实例方法\n        car1.displayInfo();\n\
    \        car2.displayInfo();\n\n        // 直接通过类访问类方法\n        ClassMethodsExample.displayTotalCars();\n\
    \    }\n}\n```\n\n### 解释：\n\n1. **类方法 (displayTotalCars):**\n\n![](img/image_rsrc9XY.jpg)`displayTotalCars`\
    \ 方法使用 `static` 关键字声明，使其成为类方法。\n![](img/image_rsrc9XZ.jpg)类方法可以直接在类上调用，例如 `ClassMethodsExample.displayTotalCars();`。\n\
    \n2. **实例方法 (displayInfo):**\n\n![](img/image_rsrc9Y0.jpg)`displayInfo` 方法是与类的每个独立对象关联的实例方法。\n\
    ![](img/image_rsrc9Y1.jpg)它在类的实例上被调用，例如 `car1.displayInfo();`。\n\n3. **访问类方法:**\n\
    类方法通过类直接访问。\n\n4. **静态上下文:**\n类方法在静态上下文中操作。\n\n总结，Java 中的类方法是属于类本身而非属于类实例的方法。它们用\
    \ `static` 关键字声明并可以被调用。\n\n# Java 构造函数\n\n在 Java 中，构造函数是一种用于初始化对象的特殊类型方法。\n\n\
    1. **初始化：**\n![](img/image_rsrc9Y4.jpg)构造函数用于初始化对象的状态。\n\n2. **特殊方法：**\n![](img/image_rsrc9Y5.jpg)构造函数的名称与其所属的类相同，且没有返回类型。\n\
    \n3. **无显式返回类型：**\n![](img/image_rsrc9Y6.jpg)与普通方法不同，构造函数没有显式的返回类型。\n\n4. **默认构造函数：**\n\
    ![](img/image_rsrc9Y7.jpg)如果类没有显式定义任何构造函数，Java 会自动提供一个默认构造函数。\n\n5. **参数构造函数：**\n\
    ![](img/image_rsrc9Y8.jpg)构造函数可以接收参数，允许开发者自定义初始化过程。\n\n6. **重载构造函数：**\n一个类可以有多个构造函数，即具有不同参数列表的函数。\n\
    \n7. **隐式调用父类构造函数：**\n如果一个类继承另一个类，父类的构造会在子类的构造函数之前被隐式调用。\n\n8. **默认值与初始化：**\n\
    构造函数负责为属性分配初始值。\n\n9. **对象分配：**\n当使用 `new` 关键字创建对象时，会调用构造函数。\n\n"
- fmt: "\n![](image_rsrc9YE.jpg)Constructors can have access modifiers (e.g., `public`,\
    \ `private`, `protected`, or `package-private`) that control their visibility.\
    \ The choice of access modifier influences where the constructor can be called\
    \ from.\n\n## 12. Chain of Constructors\n\n![](image_rsrc9YF.jpg)Constructors\
    \ can call other constructors in the same class using the `this()` keyword. This\
    \ allows for code reuse and the ability to provide default values for certain\
    \ parameters.\n\nIn summary, constructors in Java are special methods used to\
    \ initialize objects. They ensure that objects have a valid and consistent state\
    \ by assigning initial values to attributes. Constructors can be parameterized,\
    \ overloaded, and used to customize the initialization process based on the values\
    \ provided during object creation.\n\nIn Java, a constructor is a special type\
    \ of method that is called when an object of a class is created. It is used to\
    \ initialize the object's state, often by setting initial values for the instance\
    \ variables of the class. Here's an example to illustrate Java constructors:\n\
    \n```java\npublic class ConstructorsExample {\n    // Instance variables\n   \
    \ String brand;\n    String model;\n    int year;\n\n    // Default constructor\
    \ (no-argument constructor)\n    public ConstructorsExample() {\n        // Default\
    \ values\n        brand = \"Unknown\";\n        model = \"Unknown\";\n       \
    \ year = 0;\n    }\n\n    // Parameterized constructor\n    public ConstructorsExample(String\
    \ brand, String model, int year) {\n        // Initialize instance variables with\
    \ provided values\n        this.brand = brand;\n        this.model = model;\n\
    \        this.year = year;\n    }\n\n    // Method to display information about\
    \ the car\n    public void displayInfo() {\n        System.out.println(\"Car:\
    \ \" + brand + \" \" + model + \" (\" + year + \")\");\n    }\n\n    public static\
    \ void main(String[] args) {\n        // Creating objects using different constructors\n\
    \        ConstructorsExample defaultCar = new ConstructorsExample(); // Using\
    \ default constructor\n        ConstructorsExample customCar = new ConstructorsExample(\"\
    Toyota\", \"Camry\", 2022); // Using parameterized constructor\n\n        // Displaying\
    \ information about the cars\n        System.out.println(\"Default Car:\");\n\
    \        defaultCar.displayInfo();\n\n        System.out.println(\"\\nCustom Car:\"\
    );\n        customCar.displayInfo();\n    }\n}\n```\n\n### Explanation:\n\n####\
    \ 1. Default Constructor\n![](image_rsrc9YG.jpg)The class has a default constructor\
    \ (`public ConstructorsExample()`) with no parameters.\n\n![](image_rsrc9YH.jpg)This\
    \ constructor initializes the instance variables with default values when an object\
    \ is created without providing specific values.\n\n#### 2. Parameterized Constructor\n\
    ![](image_rsrc9YJ.jpg)There is also a parameterized constructor (`public ConstructorsExample(String\
    \ brand, String model, int year)`) that allows you to initialize the instance\
    \ variables with specific values when an object is created with arguments.\n\n\
    #### 3. this Keyword\n![](image_rsrc9YK.jpg)The `this` keyword is used to refer\
    \ to the current instance.\n\n#### 4. Object Creation\n![](image_rsrc9YM.jpg)Objects\
    \ `defaultCar` and `customCar` are created.\n\n#### 5. Display Method\n![](image_rsrc9YN.jpg)The\
    \ `displayInfo` method is used to display.\n\nIn summary, constructors in Java\
    \ are special methods used to initialize objects. They ensure that objects have\
    \ a valid and consistent state by assigning initial values to attributes. Constructors\
    \ can be parameterized, overloaded, and used to customize the initialization process\
    \ based on the values provided during object creation.\n\n## Modifiers\n\nIn Java,\
    \ modifiers are keywords that control access, visibility, and behavior of classes,\
    \ methods, and variables.\n\n### 1. Access Modifiers\nAccess modifiers control\
    \ the visibility of classes and members. There are four main access levels:\n\n\
    - `public`: Accessible from any class.\n- `protected`: Accessible within the same\
    \ package and by subclasses.\n- `default` (package-private): Accessible within\
    \ the same package.\n- `private`: Accessible only within the own class.\n\n###\
    \ 2. Non-Access Modifiers\nNon-access modifiers provide additional information\
    \ about elements:\n\n- `final`: The class cannot be subclassed, a method cannot\
    \ be overridden, or a variable cannot be reassigned after initialization.\n- `abstract`:\
    \ Abstract classes cannot be instantiated, and abstract methods must be implemented\
    \ by subclasses.\n- `static`: Members belong to the class itself rather than instances\
    \ of the class.\n- `transient`: Indicates that variables should not be serialized\
    \ when the object is persisted.\n- `volatile`: Used with variables that may be\
    \ accessed by multiple threads; ensures that reads and writes are atomic and visible\
    \ to all threads.\n\n### 3. Combination of Modifiers\nMultiple modifiers can be\
    \ used together. For example, a method can be both `public` and `static`, and\
    \ a variable can be both `final` and `static`.\n\n### 4. Default Access\nIf no\
    \ access modifier is specified, the default access level is package-private. This\
    \ means the class or member is accessible only within its package.\n\n### 5. Encapsulation\n\
    Modifiers play a crucial role in encapsulation, which is the bundling of data\
    \ (attributes) and methods within a class and controlling access to the internal\
    \ state of objects.\n"
