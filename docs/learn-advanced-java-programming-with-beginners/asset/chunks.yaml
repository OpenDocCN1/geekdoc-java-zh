    12.  Copying Arrays:


    ![](image_rsrc9UM.jpg)Arrays can be copied using various methods, such as the  clone()
    method or using arraycopy methods provided by the System class. These methods
    allow you to create a new array with the same elements.


    In summary, Java arrays are a fundamental data structure that allows you to store
    and manipulate multiple elements of the  same data type. They provide a simple
    and efficient way to work  with collections of values, offering direct access
    to elements  through indexing and supporting various operations for array  manipulation.


    In Java, an array is a data structure that allows you to store  multiple values
    of the same type under a single variable name. Here''s an example of using arrays
    in Java:


    public  class  ArraysExample  {


    public static void main(String[] args) {


    //  Declaration  and  initialization  of  an  array  of  integers int[] numbers
    = {1, 2, 3, 4, 5};


    // Accessing and printing array elements System.out.println("Array elements:");  for
    (int i = 0; i < numbers.length; i++) {


    System.out.println("Element  at  index  "  +  i  +  ":  "  + numbers[i]);


    }


    // Declaration and initialization of an array of strings  String[]  fruits  =  {"Apple",  "Banana",  "Orange",  "Grapes"};


    // Accessing and printing array elements System.out.println("\nArray elements:");  for
    (int j = 0; j < fruits.length; j++) {


    System.out.println("Element  at  index  "  +  j  +  ":  "  +  fruits[j]);


    }


    }


    }


