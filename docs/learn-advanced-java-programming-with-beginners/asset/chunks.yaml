    \     // 要写入文件的内容\n            String content = \"Hello, Java Files!\\nThis is\
    \ a sample content.\";\n            // 将内容写入文件 \n            Files.write(filePath,\
    \ content.getBytes());\n            System.out.println(\"File 'output.txt' created\
    \ successfully.\");\n        } catch (IOException e) {\n            System.out.println(\"\
    An error occurred while writing to the file: \" + e.getMessage());\n        }\n\
