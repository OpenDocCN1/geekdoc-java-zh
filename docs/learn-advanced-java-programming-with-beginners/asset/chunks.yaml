    \ a double quote.\n\n## 7. String Comparison\n\n![](image_rsrc9RG.jpg)Comparing\
    \ strings in Java is done using methods like `equals()` or `compareTo()`. It's\
    \ important to note that `==` compares references, not the actual content of the\
    \ strings.\n\n## 8. String Interning\n\n![](image_rsrc9RH.jpg)String interning\
    \ is the process of putting unique `String` literals into the `String` pool, ensuring\
    \ that identical literals refer to the same `String` object. This can be done\
    \ explicitly using the `intern()` method.\n\n## 9. String Indexing\n\n![](image_rsrc9RJ.jpg)Characters\
    \ in a `String` are indexed starting from 0. Accessing individual characters is\
    \ done using the `charAt()` method. Strings are immutable, so modifying a character\
    \ requires creating a new `String`.\n\n## 10. Unicode Support\n\n![](image_rsrc9RK.jpg)Java\
    \ Strings support Unicode, allowing them to represent characters from various\
    \ writing systems. This makes Java suitable for internationalization and localization.\n\
    \n## 11. Regular Expressions\n\n![](image_rsrc9RM.jpg)Java provides support for\
    \ regular expressions through the `String` class and the `java.util.regex` package.\
    \ Regular expressions allow for powerful string matching and manipulation.\n\n\
    ## 12. StringBuffer and StringBuilder\n\n![](image_rsrc9RN.jpg)While `String`\
    \ objects are immutable, `StringBuffer` and `StringBuilder` classes provide mutable\
    \ alternatives for string manipulation. They are more efficient for scenarios\
    \ involving frequent modifications.\n\nIn summary, Java Strings are a fundamental\
    \ part of the language, offering a versatile and powerful way to work with textual\
    \ data. Understanding the immutability of `Strings`, their methods, and related\
    \ concepts like the `String` pool is crucial for effective string manipulation\
    \ in Java programs.\n\nIn Java, a `String` is a sequence of characters. It is\
    \ a class in Java, and instances of this class represent sequences of characters.\n\
    \n```\npublic class StringsExample {\n\n    public static void main(String[] args)\
    \ {\n        // Creating strings\n        String greeting = \"Hello, \"; \n  \
    \      String name = \"John\";\n\n        // Concatenation\n        String welcomeMessage\
    \ = greeting + name + \"!\";  \n        System.out.println(\"Welcome Message:\
    \ \" + welcomeMessage);\n\n        // String length\n        int length = welcomeMessage.length();\
    \  \n        System.out.println(\"Length of Welcome Message: \" + length);\n\n\
    \        // Accessing characters in a string\n        char firstChar = welcomeMessage.charAt(0);\n\
    \        char lastChar = welcomeMessage.charAt(length - 1);  \n        System.out.println(\"\
    First Character: \" + firstChar);  \n        System.out.println(\"Last Character:\
    \ \" + lastChar);\n\n        // Substring\n        String substring = welcomeMessage.substring(7,\
    \ 12);  \n        System.out.println(\"Substring: \" + substring);\n\n       \
    \ // String comparison\n        String anotherName = \"john\";\n        boolean\
    \ isEqualIgnoreCase = name.equalsIgnoreCase(anotherName);  \n        System.out.println(\"\
    Is name equal to anotherName (ignore case)? \" + isEqualIgnoreCase);\n\n     \
    \   // String modification (Strings are immutable)\n        String originalString\
    \ = \"abc\";\n        String modifiedString = originalString.concat(\"def\");\
    \  \n        System.out.println(\"Original String: \" + originalString);  \n \
    \       System.out.println(\"Modified String: \" + modifiedString);\n    }\n}\n\
    ```\n\n## Explanation of Java strings:\n\n1. **Creating Strings:**\n\n![](image_rsrc9PM.jpg)Strings\
    \ can be created using double quotes. For example, `String greeting = \"Hello,\
    \ \";`.\n\n2. **Concatenation:**\n\n![](image_rsrc9PM.jpg)Strings can be concatenated\
    \ using the `+` operator. In the example, `welcomeMessage` is formed by concatenating\
    \ `greeting`, `name`, and `\"!\"`.\n\n3. **String Length:**\n\n![](image_rsrc9PM.jpg)The\
    \ `length()` method is used to find the length of a string.\n\n4. **Accessing\
    \ Characters:**\n\n![](image_rsrc9PM.jpg)The `charAt(index)` method allows you\
    \ to access characters at a specific index in a string.\n\n5. **Substring:**\n\
    \n![](image_rsrc9PM.jpg)The `substring(startIndex, endIndex)` method extracts\
    \ a portion of a string.\n\n6. **String Comparison:**\n\n![](image_rsrc9PM.jpg)The\
    \ `equals()` method is used for case-sensitive string comparison, and `equalsIgnoreCase()`\
    \ is used for case-insensitive comparison.\n\n7. **String Modification (Immutability):**\n\
    \n![](image_rsrc9PM.jpg)Strings in Java are immutable, meaning their values cannot\
    \ be changed after they are created. Operations like concatenation create new\
    \ strings rather than modifying the original.\n\nStrings are fundamental in Java\
    \ and are extensively used for representing.\n\n# Math\n\nIn Java, the `Math`\
    \ class is a part of `java.lang` and provides a set of static methods.\n\n1. **Static\
    \ Methods:**\n\n![](image_rsrc9RP)All methods in `Math` are static, meaning you\
    \ don't need to create an instance of the class to use them.\n\n2. **Basic Arithmetic:**\n\
    \n![](image_rsrc9RR)The `Math` class includes methods for basic arithmetic, such\
    \ as `addExact()`, `subtractExact()`, `multiplyExact()`, and `floorDiv()`. These\
    \ methods handle overflow and underflow more robustly.\n\n3. **Exponential and\
    \ Logarithmic Functions:**\n\n![](image_rsrc9RS)The `Math` class provides methods\
    \ for exponential functions, such as `exp()` and `pow()`, which raise a base to\
    \ a specified power. It also includes logarithmic functions like `log()` and `log10()`\
    \ for different bases.\n\n4. **Trigonometric Functions:**\n\n![](image_rsrc9RT)Common\
    \ trigonometric functions are available in the `Math` class, including `sin()`,\
    \ `cos()`, and `tan()`. There are also their inverse counterparts, such as `asin()`,\
    \ `acos()`, and `atan()`.\n\n5. **Rounding Functions:**\n\n![](image_rsrc9RU)Methods\
    \ like `round()`, `floor()`, and `ceil()` are provided for rounding to the nearest\
    \ integer, rounding down to the nearest integer, and rounding up to the nearest\
    \ integer, respectively.\n\n6. **Square Root and Cube Root:**\n\n![](image_rsrc9RV)The\
    \ `sqrt()` method calculates the square root of a number, and the `cbrt()` method\
    \ calculates the cube root of a number.\n\n7. **Absolute Value:**\n\n![](image_rsrc9RW)The\
    \ `abs()` method returns the absolute value of a given number, effectively removing\
    \ any negative sign.\n\n8. **Minimum and Maximum:**\n\n![](image_rsrc9RX)Math\
    \ provides methods for determining the minimum (`min()`) and maximum (`max()`)\
    \ of two values.\n\n9. **Random Number Generation:**\n\n![](image_rsrc9RY)The\
    \ `Math` class supports random number generation through the `random()` method,\
    \ which returns a pseudorandom double value between 0.0 and 1.0.\n\n10. **Constants:**\n\
    \n![](image_rsrc9RZ)Math class includes constants such as `PI` and `E` for the\
    \ mathematical constants pi (π) and the base of natural logarithms, respectively.\n\
    \n11. **Special Functions:**\n\n![](image_rsrc9S0)Special mathematical functions,\
    \ like `hypot()` (calculating the hypotenuse of a right-angled triangle) and `toDegrees()`/`toRadians()`\
    \ for converting between degrees and radians, are also available.\n\n12. **IEEE\
    \ 754 Standard:**\n\n![](image_rsrc9S1)Many methods in the `Math` class follow\
    \ the IEEE 754 standard for floating-point arithmetic, ensuring consistent behavior\
    \ across different platforms.\n"
  raw: '![](image_rsrc9RE.jpg)The String class provides numerous methods for manipulating  and
    querying strings. These methods include operations for  finding the length of
    a string, extracting substrings, converting  case, comparing strings, and more.


    6.  Escape Sequences:


    ![](image_rsrc9RF.jpg)Strings in Java support escape sequences to represent special  characters.
    For example, \n represents a newline character, \t  represents a tab character,
    and \" represents a double quote.


    7.  String Comparison:


    ![](image_rsrc9RG.jpg)Comparing strings in Java is done using methods like equals()
    or compareTo(). It''s important to note that == compares  references, not the
    actual content of the strings.


    8.  String  Interning:


    ![](image_rsrc9RH.jpg)String interning is the process of putting unique String
    literals into the String pool, ensuring that identical literals refer to the  same
    String object. This can be done explicitly using the  intern() method.


    9.  String Indexing:


    ![](image_rsrc9RJ.jpg)Characters in a String are indexed starting from 0\. Accessing
    individual characters is done using the charAt() method.  Strings are immutable,
    so modifying a character requires  creating a new String.


    10.  Unicode  Support:


    ![](image_rsrc9RK.jpg)Java Strings support Unicode, allowing them to represent  characters
    from various writing systems. This makes Java  suitable for internationalization
    and localization.


    11.  Regular Expressions:


    ![](image_rsrc9RM.jpg)Java provides support for regular expressions through the  String  class  and  the  java.util.regex  package.  Regular  expressions  allow  for  powerful  string  matching  and  manipulation.


    12.  StringBuffer and StringBuilder:


    ![](image_rsrc9RN.jpg)While  String  objects  are  immutable,  StringBuffer  and  StringBuilder
    classes provide mutable alternatives for string manipulation. They are more efficient
    for scenarios involving frequent modifications.


    In summary, Java Strings are a fundamental part of the language,  offering a versatile
    and powerful way to work with textual data. Understanding the immutability of
    Strings, their methods, and  related concepts like the String pool is crucial
    for effective string manipulation in Java programs.


    In Java, a String is a sequence of characters. It is a class in Java, and instances
    of this class represent sequences of characters.


    public class StringsExample {


    public  static  void  main(String[]  args)  {


    // Creating strings


    String  greeting  =  "Hello,  "; String name = "John";


    //  Concatenation


    String welcomeMessage = greeting + name + "!";  System.out.println("Welcome  Message:  "  +  welcomeMessage);


    // String length


    int length = welcomeMessage.length();  System.out.println("Length  of  Welcome  Message:  "  +  length);


    // Accessing characters in a string


    char  firstChar  =  welcomeMessage.charAt(0);


    char  lastChar  =  welcomeMessage.charAt(length  -  1);  System.out.println("First  Character:  "  +  firstChar);  System.out.println("Last  Character:  "  +  lastChar);


    // Substring


    String  substring  =  welcomeMessage.substring(7,  12);  System.out.println("Substring:
    " + substring);


    //  String  comparison


    String  anotherName  =  "john";


    boolean  isEqualIgnoreCase  =  name.equalsIgnoreCase(anotherName);  System.out.println("Is
    name  equal to  anotherName (ignore  case)? "  +


    isEqualIgnoreCase);


    //  String  modification  (Strings  are  immutable)  String originalString = "abc";


    String  modifiedString  =  originalString.concat("def");  System.out.println("Original  String:  "  +  originalString);  System.out.println("Modified  String:  "  +  modifiedString);


    }


    }


    Explanation of Java strings:


    1.     Creating  Strings:


    ![](image_rsrc9PM.jpg)Strings can be created using double quotes. For example,
    String greeting = "Hello, ";.


    2.      Concatenation:


    ![](image_rsrc9PM.jpg)Strings can be concatenated using the + operator. In the
    example, welcomeMessage is formed by concatenating greeting, name, and "!".


    3.      String  Length:


    ![](image_rsrc9PM.jpg)The length() method is used to find the length of a string.


    4.  Accessing Characters:


    ![](image_rsrc9PM.jpg)The  charAt(index)  method  allows  you  to  access  characters
    at a specific index in a string.


    5.  Substring:


    ![](image_rsrc9PM.jpg)The substring(startIndex, endIndex) method extracts a  portion
    of a string.


    6.  String Comparison:


    ![](image_rsrc9PM.jpg)The equals() method is used for case-sensitive string  comparison,
    and equalsIgnoreCase() is used for case-  insensitive comparison.


    7.     String Modification (Immutability):


    ![](image_rsrc9PM.jpg)Strings in Java are immutable, meaning their values  cannot
    be changed after they are created. Operations  like  concatenation  create  new  strings  rather  than  modifying
    the original.


    Strings are fundamental in Java and are extensively used for representing text.
    The String class provides various methods for manipulating and working with strings,
    making it versatile for handling textual data in Java programs. Understanding
    string operations is crucial for many programming tasks involving text  manipulation.


    # JAvA MAth


    In Java, the Math class is a part of the java.lang package and provides a set
    of static methods for performing mathematical operations. These methods cover
    a wide range of mathematical  functions and are useful for various applications.


    1.  Static Methods:


    ![](image_rsrc9RP.jpg)All the methods in the Math class are static, meaning you
    don''t need to create an instance of the class to use them. You can directly call
    these methods using the class name.


    2.  Basic Arithmetic Operations:


    ![](image_rsrc9RR.jpg)The  Math  class  includes  methods  for  basic  arithmetic
    operations,  such  as  addition  (addExact()),  subtraction (subtractExact()),
    multiplication (multiplyExact()), and  division (floorDiv()). These methods handle
    overflow and  underflow conditions more robustly.


    3.  Exponential and Logarithmic Functions:


    ![](image_rsrc9RS.jpg)The Math class provides methods for exponential functions,
    such as exp() and pow(), which raise a base to a specified power. It also includes
    logarithmic functions like log() and log10() for different bases.


    4.  Trigonometric Functions:


    ![](image_rsrc9RT.jpg)Common trigonometric functions are available in the Math
    class, including sin(), cos(), and tan(). There are also their inverse counterparts,
    such as asin(), acos(), and atan().


    5.  Rounding Functions:


    ![](image_rsrc9RU.jpg)Methods like round(), floor(), and ceil() are provided for  rounding
    numbers to the nearest integer, rounding down to  the nearest integer, and rounding
    up to the nearest integer,  respectively.


    6. Square Root and Cube Root:


    ![](image_rsrc9RV.jpg)The sqrt() method calculates the square root of a number,
    and the cbrt() method calculates the cube root of a number.


    7.  Absolute Value:


    ![](image_rsrc9RW.jpg)The abs() method returns the absolute value of a given  number,
    effectively removing any negative sign.


    8.  Minimum and Maximum:


    ![](image_rsrc9RX.jpg)Math provides methods for determining the minimum (min())
    and maximum (max()) of two values.


    9. Random Number Generation:


    ![](image_rsrc9RY.jpg)The  Math  class  supports  random  number  generation  through  the  random()  method,  which  returns  a  pseudorandom
    double value between 0.0 and 1.0.


    10.  Constants:


    ![](image_rsrc9RZ.jpg)Math class includes constants such as PI and E for the  mathematical
    constants pi (π) and the base of natural  logarithms, respectively.


    11.       Special Functions:


    ![](image_rsrc9S0.jpg)Special mathematical functions, like hypot() (calculating
    the  hypotenuse  of  a  right-angled  triangle)  and  toDegrees()/toRadians()
    for converting between degrees and radians, are also available.


    12.  IEEE 754 Standard:


    ![](image_rsrc9S1.jpg)Many methods in the Math class follow the IEEE 754  standard
    for floating-point arithmetic, ensuring consistent behavior across different platforms.'
