    These are known as parameterized  constructors.


    6.  Overloaded  Constructors:


    ![](image_rsrc9Y9.jpg)A class can have multiple constructors, known as overloaded  constructors,
    with different parameter lists. This enables objects to be initialized in different
    ways.


