    # JAvA OpeRAtoRS


    In Java, operators are symbols that perform operations on  variables and values.
    They are crucial for manipulating data and controlling the flow of a program.


    1.  Arithmetic  Operators:


    ![](image_rsrc9PZ.jpg)Arithmetic  operators  perform  basic  mathematical  operations.  These  include  addition  (+),  subtraction  (-),
    multiplication (*), division (/), and modulus (%). Modulus  returns the remainder
    of a division operation.


    2.  Relational Operators:


    ![](image_rsrc9R0.jpg)Relational operators are used to compare values. Common  relational  operators  include  equality  (==),  inequality  (!=),  greater
    than (>), less than (<), greater than or equal to (>=),  and less than or equal
    to (<=).


    3.  Logical  Operators:


    ![](image_rsrc9R1.jpg)Logical operators perform logical operations on boolean  values.
    The logical AND (&&) returns true if both operands are true, the logical OR (||)
    returns true if at least one  operand is true, and the logical NOT (!) returns
    the opposite  boolean value.


    4.  Assignment  Operators:


    ![](image_rsrc9R2.jpg)Assignment operators are used to assign values to variables.
    The  basic  assignment  operator  is  =.  Other  assignment  operators include
    +=, -=, *=, /=, and %= which perform an  operation and assign the result to the
    variable.


    5.  Increment and Decrement Operators:


    ![](image_rsrc9R3.jpg)Increment (++) and decrement (--) operators are used to  increase  or  decrease  the  value  of  a  variable  by  1,  respectively.
    They can be used in prefix or postfix form,  affecting the order of evaluation.


    6.  Bitwise Operators:


    ![](image_rsrc9R4.jpg)Bitwise  operators  perform  operations  at  the  bit  level.  Examples
    include bitwise AND (&), bitwise OR (|), bitwise  XOR (^), bitwise NOT (~), left
    shift (<<), and right shift (>>).


    7.  Conditional (Ternary) Operator:


    ![](image_rsrc9R5.jpg)The conditional or ternary operator (? :) is a shorthand
    way of expressing an if-else statement. It evaluates a boolean  expression and
    returns one of two values depending on  whether the expression is true or false.


    8.  instanceof Operator:


    ![](image_rsrc9R6.jpg)The instanceof operator is used to test whether an object
    is an instance of a particular class or interface. It returns true if the object
    is an instance; otherwise, it returns false.


    9. Equality and Identity Operators:


    ![](image_rsrc9R7.jpg)The equality operator (==) checks if two values are equal.
    The identity operators (== and !=) check if two references point to the same object.


    10.  String Concatenation Operator:


    ![](image_rsrc9R8.jpg)The + operator is used for concatenating strings in Java.  When
    used with strings, it joins them together to create a  new string.


    11.       Other Operators:


    ![](image_rsrc9R9.jpg)Java includes other operators, such as the conditional null
    operator (??), which returns the left operand if it is non-null, and the right
    operand otherwise (introduced in Java 12).


    Understanding how these operators work and their precedence  is crucial for writing
    correct and efficient Java code. Operators are  fundamental  tools  for  expressing  computations  and  decision-making
    in programs.


    In Java, operators are symbols that perform operations on  variables and values.
    There are various types of operators in Java,  including  arithmetic,  relational,  logical,  assignment,  bitwise,
    and others.


    public  class  OperatorsExample  {


    public  static  void  main(String[]  args)  {


    //  Arithmetic  operators int num1 = 10;


    int num2 = 5;


    int sum = num1 + num2;


    int difference = num1 - num2; int product = num1 * num2;  int quotient = num1
    / num2; int  remainder  =  num1  %  num2;


    System.out.println("Arithmetic  Operators:");  System.out.println("Sum: " + sum);  System.out.println("Difference:  "  +  difference);
    System.out.println("Product: " + product);  System.out.println("Quotient: " +
    quotient); System.out.println("Remainder:  "  +  remainder);


    // Relational operators


    boolean isEqual = (num1 == num2);  boolean isNotEqual = (num1 != num2);  boolean
    isGreater = (num1 > num2);  boolean isLessOrEqual = (num1 <= num2);


    System.out.println("\nRelational Operators:");  System.out.println("Is Equal:
    " + isEqual);  System.out.println("Is Not Equal: " + isNotEqual);  System.out.println("Is
    Greater: " + isGreater);  System.out.println("Is Less or Equal: " + isLessOrEqual);


    // Logical operators


    boolean logicalAnd  =  (true &&  false); boolean logicalOr = (true || false);
    boolean logicalNot = !true;


    System.out.println("\nLogical Operators:");  System.out.println("Logical  AND:  "  +  logicalAnd);
    System.out.println("Logical OR: " + logicalOr);  System.out.println("Logical  NOT:  "  +  logicalNot);


    // Assignment operators int x = 5;


    x += 3; // Equivalent to x = x + 3


    System.out.println("\nAssignment  Operator:");  System.out.println("Updated x:
    " + x);


    // Bitwise operators


    int binaryNum1 = 0b1010; // Binary literal for 10 int binaryNum2 = 0b1100; //
    Binary literal for 12 int bitwiseAnd = binaryNum1 & binaryNum2;


    int bitwiseOr = binaryNum1 | binaryNum2;  int  bitwiseXor  =  binaryNum1  ^  binaryNum2;


    System.out.println("\nBitwise Operators:");  System.out.println("Bitwise  AND:  "  +  bitwiseAnd);
    System.out.println("Bitwise OR: " + bitwiseOr);  System.out.println("Bitwise  XOR:  "  +  bitwiseXor);


    }


    }


    Explanation of Java operators:


    1.     Arithmetic  Operators:


    ![](image_rsrc9PM.jpg)+, -, *, /, % perform addition, subtraction, multiplication,  division,  and  modulus  (remainder)  operations,  respectively.


    2.     Relational Operators:


    ![](image_rsrc9PM.jpg)==, !=, >, >=, <, <= compare values and return boolean  results.


    3.  Logical  Operators:


    ![](image_rsrc9PM.jpg)&& (logical AND), || (logical OR), ! (logical NOT) perform  logical
    operations and return boolean results.


    4.  Assignment Operator:


    ![](image_rsrc9PM.jpg)= assigns a value to a variable. Compound assignment  operators
    like += combine an operation with assignment.


    5.  Bitwise Operators:


    ![](image_rsrc9PM.jpg)& (bitwise AND), | (bitwise OR), ^ (bitwise XOR) perform  operations
    at the bit level.


    Operators are essential for performing various operations in  Java, and understanding
    their usage is crucial for writing  effective  and  efficient  code.  They  enable  developers  to  manipulate
    variables and values to achieve desired results.


