  trans: "\n总而言之，Java 中的 `while` 循环是用于根据指定条件创建重复执行的一种基础结构。它在处理迭代次数由程序状态决定的场景时提供了灵活性。仔细考虑入口条件并对循环体内部的变量进行适当修改，对于确保行为的正确和可预测至关重要。\n\
    \n在 Java 中，`while` 循环是一种控制流语句，只要指定的条件为真，它就会重复执行一个代码块。\n\n```java\npublic class\
    \ WhileLoopExample {\n    public static void main(String[] args) {\n        //\
    \ Example 1: Simple while loop\n        int i = 1;\n        while (i <= 5) {\n\
    \            System.out.println(\"Iteration \" + i);\n            i++;\n     \
    \   }\n\n        // Example 2: Infinite loop with break statement\n        int\
    \ j = 1;\n        while (true) {\n            System.out.println(\"Infinite Loop,\
    \ Iteration \" + j);\n            j++;\n            if (j > 3) {\n           \
    \     break; // Exit the loop after three iterations\n            }\n        }\n\
    \n        // Example 3: While loop with user input\n        java.util.Scanner\
    \ scanner = new java.util.Scanner(System.in);\n        System.out.print(\"Enter\
    \ a number (0 to exit): \");\n        int userInput = scanner.nextInt();\n   \
    \     while (userInput != 0) {\n            System.out.println(\"You entered:\
    \ \" + userInput);\n            System.out.print(\"Enter a number (0 to exit):\
    \ \");\n            userInput = scanner.nextInt();\n        }\n        System.out.println(\"\
    Exited the loop. Program complete.\");\n        scanner.close();\n    }\n}\n```\n\
    \n### 对 while 循环的解释：\n\n1. **语法**:\n![](img/image_rsrc9PM.jpg) `while` 循环以关键字\
    \ `while` 开始，后面跟着圆括号内的布尔表达式。只要布尔表达式为真，大括号内的代码块就会重复执行。\n\n2. **条件**:\n![](img/image_rsrc9TF.jpg)\
    \ 只要指定的条件求值为为真，循环就会继续执行。如果条件初始为假，则循环内部代码将永远不会执行。\n\n3. **初始化与更新**:\n![](img/image_rsrc9TF.jpg)\
    \ 在进入循环之前，初始化条件中使用的任何变量是非常关重要的，并且应该在循环内部更新条件，以便最终使其变为假并退出循环。\n\n4. **死循环**:\n\
    ![](img/image_rsrc9TF.jpg) 应该避免死循环。在第二个示例中，使用了 `break` 语句在满足特定条件后退出循环。\n\n5. **用户输入循环**:\n\
    ![](img/image_rsrc9TG.jpg) 第三个示例展示了一个 `while` 循环，它会持续提示用户输入，直到他们输入 0。\n\n当迭代次数预先不可知且取决于特定条件时，`while`\
    \ 循环非常适用。确保条件最终变为假以防止死循环是非常重要的。只要条件保持为真，循环就会继续执行，这使其成为代码块重复执行的灵活结构。\n\n# Java\
    \ For 循环\n\n在 Java 中，`for` 循环是一种控制流语句，允许指定的代码块重复执行特定次数。它为执行迭代操作提供了一种简洁且表达力强的方式。\n\
    \n1. **初始化**:\n![](img/image_rsrc9TH.jpg) `for` 循环以关键字 `for` 开始，后面跟着一组圆括号。在圆括号内部，指定了循环的初始化部分。该部分通常包含循环控制变量的初始化。\n\
    \n2. **控制变量**:\n![](img/image_rsrc9TJ.jpg) 循环控制变量是用于控制迭代次数的变量。它在 `for` 循环的第一部分初始化，并通常用于跟踪循环的进度。\n\
    \n3. **条件**:\n![](img/image_rsrc9TK.jpg) `for` 循环圆括号的第二部分包含循环继续的条件。该条件在每次迭代之前都会进行求值，如果其求值为真，则执行循环体。如果条件为假，则循环终止。\n\
    \n4. **迭代表达式**:\n![](img/image_rsrc9TM.jpg) `for` 循环圆括号的第三部分包含迭代表达式。该表达式在循环体每次迭代后后执行，通常用于更新循环控制变量。\n\
    \n5. **循环体**:\n![](img/image_rsrc9TN.jpg) `for` 循环的体包含在大括号 `{}` 之中。该代码块包含了只要循环继续条件为真就会被重复执行的语句。\n\
    \n6. **预测试循环**:\n![](img/image_rsrc9TP.jpg) `for` 循环被称为预测试循环，因为循环继续的条件是在执行循环体之前进行求值的。如果条件初始为假，则将完全跳过循环体。\n\
    \n7. **初始化一次**:\n![](img/image_rsrc9TR.jpg) `for` 循环的初始化部分只在循环开始时执行一次。它负责设置循环控制变量的初始状态。\n\
    \n8. **灵活的控制流**:\n![](img/image_rsrc9TS.jpg) 当迭代次数预知时，`for` 循环是表达重复执行的一种简洁且高效的方式。它为每次迭代期间的初始化、测试和更新提供了清晰的结构。\n\
    \n9. **增强型 for 循环 (Java 5)**:\n![](img/image_rsrc9TT.jpg) 除了传统的 `for` 循环外，Java\
    \ 还引入了增强型 `for` 循环（也称为 foreach 循环），以简化数组和集合的迭代。\n\n10. **嵌套循环**:\n![](img/image_rsrc9TU.jpg)\
    \ `for` 循环可以嵌套其他循环内部，以处理复杂的模式。\n\n11. **变量作用域**:\n![](img/image_rsrc9TV.jpg) 在\
    \ `for` 循环初始化部分声明的变量具有有限的作用域，仅在循环内部可访问。\n\n12. **替代循环结构**:\n![](img/image_rsrc9TW.jpg)\
    \ 除了 `for` 循环，Java 还提供了其他结构，如 `while` 循环和 `do-while` 循环，它们各有各自的适用场景。\n"
- fmt: "\n![](image_rsrc9PM.jpg)The loop control variable is scoped to the `for` loop\
    \ and is only accessible within the loop.\n\n### 6. Nested For Loop\n\n![](image_rsrc9TG.jpg)The\
    \ `for` loop can be nested inside another `for` loop. In the third example, a\
    \ nested loop is used to print a multiplication table.\n\nThe `for` loop is a\
    \ concise and expressive way to iterate over a range of values. It is commonly\
    \ used when the number of iterations is known beforehand. The loop control variable\
    \ is often used to track the progress of the loop, and it can be used within the\
    \ loop for various purposes. The `for` loop is a versatile and powerful construct\
    \ in Java programming.\n\n# Java Break/Continue\n\nIn Java, the `break` and `continue`\
    \ statements are control flow statements used within loops to alter the normal\
    \ flow of execution.\n\n## Java break Statement\n\n#### 1. Loop Termination\n\n\
    ![](image_rsrc9TX.jpg)The `break` statement is used to terminate the execution\
    \ of a loop prematurely. When encountered within a loop, the `break` statement\
    \ immediately exits the loop, and control is transferred to the statement following\
    \ the loop.\n\n#### 2. Early Exit\n\n![](image_rsrc9TY.jpg)`break` is often used\
    \ within loops to exit the loop early based on a certain condition. Once the `break`\
    \ statement is encountered, any remaining iterations of the loop are skipped,\
    \ and the program continues with the statement following the loop.\n\n#### 3.\
    \ Switch Statements\n\n![](image_rsrc9TZ.jpg)In addition to loops, the `break`\
    \ statement is used within `switch` statements to exit the `switch` block. It\
    \ is commonly placed at the end of each `case` block to prevent fall-through to\
    \ subsequent case blocks.\n\n#### 4. Loop Nesting\n\n![](image_rsrc9U0.jpg)When\
    \ dealing with nested loops, a `break` statement inside an inner loop exits only\
    \ that loop, not the outer loop(s). If a `break` statement is used within the\
    \ outer loop, it exits the outer loop.\n\n## Java continue Statement\n\n#### 1.\
    \ Skip Current Iteration\n\n![](image_rsrc9U1.jpg)The `continue` statement is\
    \ used to skip the rest of the code inside the current iteration of a loop and\
    \ proceed to the next iteration. It does not exit the loop; rather, it skips the\
    \ remaining statements within the loop body for the current iteration.\n\n####\
    \ 2. Loop Increment/Update\n\n![](image_rsrc9U2.jpg)After encountering a `continue`\
    \ statement, the loop's increment or update expressions are executed, and control\
    \ moves to the next iteration of the loop. This allows the loop to continue with\
    \ the next set of iterations.\n\n#### 3. Filtering Out Elements\n\n![](image_rsrc9U3.jpg)`continue`\
    \ is often used to filter out specific elements or conditions within a loop. For\
    \ example, if a certain condition is met, the `continue` statement can be used\
    \ to skip further processing for that particular iteration.\n\n#### 4. Loop Nesting\n\
    \n![](image_rsrc9U4.jpg)Similar to the `break` statement, the `continue` statement\
    \ affects only the innermost loop in the case of nested loops. It skips the remaining\
    \ code in the current iteration of the inner loop and proceeds to the next iteration\
    \ of that inner loop.\n\n#### 5. Use in while and do-while Loops\n\n![](image_rsrc9U5.jpg)The\
    \ `continue` statement can be used in `while` and `do-while` loops, just like\
    \ in `for` loops, to achieve similar effects of skipping the remaining code in\
    \ the current iteration and moving to the next one.\n\n#### 6. Labelled continue\
    \ (Java 8 and later)\n\n![](image_rsrc9U6.jpg)Java 8 introduced the ability to\
    \ use a label with `continue` statements, allowing developers to specify which\
    \ loop to continue when dealing with nested loops. This labeled continue statement\
    \ provides more control in scenarios with multiple nested loops.\n\nIn summary,\
    \ both `break` and `continue` statements are important control flow constructs\
    \ in Java that are commonly used within loops to alter the normal execution flow.\
    \ While `break` is used to terminate the loop prematurely, `continue` is used\
    \ to skip the remaining code in the current iteration and move on to the next\
    \ iteration of the loop. Careful use of these statements can enhance the flexibility\
    \ and efficiency of loop structures in Java programs.\n\n```java\npublic class\
    \ BreakContinueExample {\n    public static void main(String[] args) {\n     \
    \   // Example with break\n        System.out.println(\"Example with break:\"\
    ); \n        for (int i = 1; i <= 5; i++) {\n            if (i == 3) {\n     \
    \           break; // Terminate the loop when i is 3\n            }\n        \
    \    System.out.println(\"Iteration \" + i);\n        }\n\n        // Example\
    \ with continue\n        System.out.println(\"\\nExample with continue:\"); \n\
    \        for (int j = 1; j <= 5; j++) {\n            if (j == 2 || j == 4) {\n\
    \                continue;  // Skip the rest of the loop body and move to the\
    \ next iteration when j is 2 or 4\n            }\n            System.out.println(\"\
    Iteration \" + j);\n        }\n    }\n}\n```\n\n### Explanation:\n\n1. break statement:\n\
    \n![](image_rsrc9PM.jpg)In the first loop, when `i` becomes equal to 3, the `break`\
    \ statement is encountered, causing the loop to terminate immediately. As a result,\
    \ the loop doesn't execute further iterations.\n2. continue statement:\n\n![](image_rsrc9PM.jpg)In\
    \ the second loop, when `j` is equal to 2 or 4, the `continue` statement is encountered,\
    \ skipping the rest of the loop body and moving to the next iteration.\n\nIn summary:\n\
    `break`: Terminates the loop immediately.\n`continue`: Skips the remaining code\
    \ in the current iteration and moves to the next iteration.\n\n# JAVA ARRAYS\n\
    \nIn Java, an array is a data structure that allows you to store multiple values\
    \ of the same type under a single variable.\n\n#### 1. Homogeneous Elements\n\n\
    ![](image_rsrc9U9.jpg)Arrays in Java are homogeneous, meaning that all elements\
    \ within an array must be of the same type. For example, integers, characters,\
    \ or objects. \n\n#### 2. Fixed Size\n\n![](image_rsrc9UA.jpg)Once an array is\
    \ created, its size is fixed and cannot be changed. If you need a dynamic collection,\
    \ you might consider other structures.\n\n#### 3. Zero-Based Indexing\n\n![](image_rsrc9UB.jpg)Array\
    \ elements are accessed using an index, and the indexing starts from 0. The first\
    \ element is at index 0, the second at 1, and so on. The last element is at `length-1`,\
    \ where `length` is the size of the array.\n\n#### 4. Declaration and Initialization\n\
    \n![](image_rsrc9UC.jpg)Arrays are declared and initialized using square brackets\
    \ `[]`. For example, `int[] numbers = new int[5];` declares an integer array `numbers`\
    \ with a size of 5. The `new` keyword is used to allocate memory for the array.\n\
    \n#### 5. Length Property\n\n![](image_rsrc9UD.jpg)Arrays have a `length` property\
    \ that indicates the number of elements in the array. This property is often used\
    \ in loops and other constructs to iterate over the elements of the array.\n\n\
    #### 6. Random Access\n\n![](image_rsrc9UE.jpg)Arrays allow for direct access\
    \ to any element using its index. This enables efficient random access to elements,\
    \ and the time complexity for accessing an element is constant O(1).\n\n#### 7.\
    \ Similar Syntax for Multi-Dimensional Arrays\n\n![](image_rsrc9UF.jpg)Java supports\
