    \n![](img/image_rsrc9PM.jpg)`public`：带有此修饰符的类、字段或方法可以从任何其他类访问。\n\n![](img/image_rsrc9PM.jpg)`private`：带有此修饰符的类、字段或方法仅在其所属类内部访问。\n\
    \n![](img/image_rsrc9PM.jpg)![](img/image_rsrc9PM.jpg)`protected`：带有此修饰符的类、字段或方法在其所属类及其子类内访问。（默认/包私有）：无修饰符（包私有）的类、字段或方法在所属的包内访问。\n\
    \n2. **非访问修饰符**：\n\n![](img/image_rsrc9PM.jpg)`static`：静态修饰符用于创建类方法和变量。类方法可以在无需创建类实例的情况下调用。\n\
    \n![](img/image_rsrc9PM.jpg)![](img/image_rsrc9PM.jpg)`final`：final 修饰符用于限制类、方法和变量的修改。final\
