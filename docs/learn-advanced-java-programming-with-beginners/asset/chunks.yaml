    \ scanner.nextInt();\n\n            System.out.print(\"Enter the second number:\
    \ \");\n            int num2 = scanner.nextInt();\n\n            // Performing\
    \ division\n            int result = divideNumbers(num1, num2);\n\n          \
    \  // Displaying the result\n            System.out.println(\"Result of division:\
    \ \" + result);\n\n        } catch (ArithmeticException e) {\n```\n"
