    1.     Method  Declaration  with  Parameters:


    ![](image_rsrc9PM.jpg)In the add method, two integer parameters (int a and int
    b) are specified in the parentheses. The method returns the sum of these parameters.


    ![](image_rsrc9PM.jpg)In the multiply method, two double parameters (double  x
    and double y) are specified. The method returns the product of these parameters.


    ![](image_rsrc9PM.jpg)The greet method takes a single string parameter (String  name)
    and does not return any value (void).


    2.      Method  Calling  with  Parameters:


    ![](image_rsrc9PM.jpg)When calling the add method, values 5 and 3 are passed as  arguments.  These  values  are  assigned  to  the  parameters
    a and b within the method.


    ![](image_rsrc9PM.jpg)Similarly,  the  multiply  method  is  called  with  arguments


    4.5 and 2.0, which are assigned to the parameters x and y.


    ![](image_rsrc9PM.jpg)The greet method is called with the argument "John",  which
    is assigned to the parameter name.


    3.      Return Values and Output:


    ![](image_rsrc9PM.jpg)The methods return values (int or double), and these  values
    are used in the println statements in the main method.


    In summary, Java method parameters allow you to pass values to a method, making
    it more versatile and capable of working  with different input data. Parameters
    are specified in the  method declaration and are used within the method body to
    perform operations.


