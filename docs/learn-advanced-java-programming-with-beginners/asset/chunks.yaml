    of the java.util package. It represents an unordered  collection of unique elements,
    where duplicate elements are not allowed. HashSet is based on the hash table data
    structure,  which  provides  constant-time  average  complexity  for  basic  operations
    such as add, remove, contains, and size. Here''s an  example of using HashSet:


    import java.util.HashSet; import  java.util.Iterator;  import java.util.Set;


    public  class  HashSetExample  {


    public static void main(String[] args) {


    // Creating a  HashSet of  Strings


    Set<String> uniqueColors = new HashSet<>();


    //  Adding  elements  to  the  HashSet uniqueColors.add("Red");  uniqueColors.add("Green");  uniqueColors.add("Blue");


    uniqueColors.add("Red"); // Duplicate element (ignored)


    // Displaying the elements using an iterator  System.out.println("Colors in the
    HashSet:");  Iterator<String>  iterator  =  uniqueColors.iterator(); while (iterator.hasNext())
    {


    System.out.println(iterator.next());


    }


    // Checking if the HashSet contains a specific element String searchColor = "Green";


    System.out.println("\nDoes​the​HashSet​contain              "              + searchColor
    + "? " + uniqueColors.contains(searchColor));


    // Removing an element from the HashSet String colorToRemove = "Blue";  uniqueColors.remove(colorToRemove);


    // Displaying the updated HashSet  System.out.println("\nColors              after              removing              "              +


    colorToRemove + ":");


    for  (String  color  :  uniqueColors)  { System.out.println(color);


    }


    // Checking the size of the HashSet  System.out.println("\nSize              of              the              HashSet:              "              +


    uniqueColors.size());


    // Clearing all elements from the HashSet uniqueColors.clear();


    // Displaying the HashSet after clearing  System.out.println("\nColors after clearing
    the HashSet:"); for (String color : uniqueColors) {  System.out.println(color);


    }


    }


    }


    Explanation:


    1.      Creating a HashSet (uniqueColors):


    ![](image_rsrc9PM.jpg)A HashSet is created to store strings (String).


    2.      Adding  Elements  to  the  HashSet:


    ![](image_rsrc9PM.jpg)Elements  ("Red,"  "Green,"  "Blue")  are  added  to  the
    HashSet using the add method.


    ![](image_rsrc9PM.jpg)The  attempt  to  add  a  duplicate  element  ("Red")  is  ignored,
    as HashSet does not allow duplicates.


    3.  Displaying Elements  using  Iterator:


    ![](image_rsrc9PM.jpg)An  iterator  is  used  to  iterate  through  the  HashSet  and
    display its elements.


    4.  Checking  if  HashSet  Contains  a  Specific  Element:


    ![](image_rsrc9PM.jpg)The  contains  method  is  used  to  check  if  the  HashSet
    contains a specific element ("Green").


    5.  Removing an  Element  from  the  HashSet:


    ![](image_rsrc9PM.jpg)The remove method is used to remove a specific element ("Blue")
    from the HashSet.


    6.  Displaying  Updated  HashSet:


    ![](image_rsrc9PM.jpg)The  HashSet  is  displayed  after  removing  an  element.


    7.     Checking the Size of the HashSet:


    ![](image_rsrc9PM.jpg)The  size  method  is  used  to  get  the  size  (number  of
    elements) of the HashSet.


    8.  Clearing the HashSet:


    ![](image_rsrc9PM.jpg)The clear method is used to remove all elements from the
    HashSet.


    9.  Displaying  the  HashSet  after  Clearing:


    ![](image_rsrc9PM.jpg)The  HashSet  is  displayed  after  clearing,  and  it  should  be
    empty.


    In summary, HashSet is a widely used implementation of the Set interface in Java,
    providing a fast and efficient way to store and retrieve unique elements. It is
    particularly useful in scenarios  where you need to maintain a collection of distinct
    values. The  order of elements in a HashSet is not guaranteed, as it does not
    maintain the insertion order. The use of hash functions enables quick lookups
    and ensures uniqueness in the set.


    # Java Iterator


    An Iterator in Java is an interface provided by the Java Collections  Framework.
    It is part of the java.util package and is used to traverse elements in a collection
    sequentially.


    1.  Traversal of Collections:


    ![](image_rsrcA6F.jpg)The primary purpose of an Iterator is to provide a way to
    iterate (traverse) through the elements of a collection, one element at a time.


    2.  Interface  in  the  java.util  Package:


    ![](image_rsrcA6G.jpg)The  Iterator  interface  is  part  of  the  Java  Collections  Framework,
    which includes a set of interfaces and classes for handling collections of objects.


    3.  Sequential Access:


    ![](image_rsrcA6H.jpg)An Iterator provides a mechanism for sequentially accessing
    elements in a collection. It ensures that elements are accessed  in the order
    they appear in the collection.


    4.  Methods for Traversal:


    ![](image_rsrcA6J.jpg)The  Iterator  interface  defines  three  main  methods  for  traversing
    through a collection:


    ![](image_rsrcA6K.jpg)boolean hasNext(): Returns  true if there  are more  elements
    in the collection, and false otherwise.


    ![](image_rsrcA6K.jpg)E next(): Returns the next element in the collection.


    ![](image_rsrcA6K.jpg)void remove(): Removes the last element returned by next()
    from the underlying collection (optional operation).


    5.  Obtaining  an  Iterator:


    ![](image_rsrcA6M.jpg)To use an Iterator, it must be obtained from the collection.
    This is typically done by calling the iterator() method on the  collection, which
    returns an instance of the Iterator interface.


    6.  Fail-Fast  Behavior:


    ![](image_rsrcA6N.jpg)Many implementations of the Iterator interface exhibit a
    fail- fast behavior. If the underlying collection is modified while an Iterator  is  in  use,  the  Iterator  may  throw  a  ConcurrentModificationException  to  prevent  unpredictable
    behavior.


    7.  Immutable Iterator:


    ![](image_rsrcA6P.jpg)The remove() method in the Iterator interface is optional,
    and  not all iterators support removal. Attempting to use the  remove()  method  on  an  iterator  that  does  not  support  removal
    may result in an UnsupportedOperationException.


    8.  Universal Traversal:


    ![](image_rsrcA6R.jpg)The Iterator interface provides a uniform way to traverse  elements
    across different types of collections, such as lists,  sets, and maps.


    9. Example Use Cases:


    ![](image_rsrcA6S.jpg)Iterator is commonly used in conjunction with enhanced for  loops
    to iterate through elements in collections, especially  when  the  removal  of  elements  is  required  during  the  iteration.


    10. Enhanced for Loop:


    ![](image_rsrcA6T.jpg)While an enhanced for loop provides a concise syntax for  iterating
    through collections, the Iterator interface provides  more control over the iteration
    process, such as removing  elements during traversal.


    11.  Implementation  by  Collection  Classes:


    ![](image_rsrcA6U.jpg)Most collection classes in Java, including ArrayList, HashSet,
    LinkedList, and others, implement the Iterator interface to  support sequential
    traversal of their elements.


    12.  Thread  Safety  Consideration:


    ![](image_rsrcA6V.jpg)It''s important to note that the Iterator itself does not
    provide thread safety. If multiple threads are concurrently modifying the  underlying  collection,  external  synchronization  mechanisms
    should be used to ensure thread safety.


    In summary, the Iterator interface in Java provides a standard  way to traverse
    elements in a collection sequentially. It defines  methods for checking the presence
    of more elements (hasNext()),  obtaining the next element (next()), and optionally
    removing  elements from the collection (remove()). The use of Iterator  facilitates  uniform  and  controlled  traversal  across  different  types
    of collections in the Java Collections Framework.'
