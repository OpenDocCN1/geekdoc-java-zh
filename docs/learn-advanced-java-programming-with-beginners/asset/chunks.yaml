    5.


    ![](image_rsrc9TF.jpg)String[] fruits = {"Apple", "Banana", "Orange", "Grapes"};:  This
    line declares an array of strings named fruits and  initializes it with string
    values.


    2.      Accessing  Array  Elements:


    ![](image_rsrc9PM.jpg)Arrays in Java are zero-indexed, meaning the first  element
    is at index 0, the second at index 1, and so on.


    ![](image_rsrc9PM.jpg)The for loops are used to iterate through the arrays, and
    the elements are accessed using square brackets ([]). The length  property  is  used  to  determine  the  size  of  the  array.


    3.  Printing Array Elements:


    ![](image_rsrc9UN.jpg)The elements of the arrays are printed to the console,  showing
    the values at each index.


    In summary, Java arrays are used to store multiple values of the  same data type
    in a single variable. The elements are accessed  by their index within the array,
