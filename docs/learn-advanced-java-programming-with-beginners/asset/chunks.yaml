  trans: "\n\n![](img/image_rsrc9WA.jpg)递归是解决问题的迭代（循环）的替代方案。这两种方法都可以实现相同的结果，但某些问题使用递归来表达会更加自然。\n\
    \n### 10. 作为子问题的函数调用\n![](img/image_rsrc9WB.jpg)在递归解决方案中，每个 `function call` 实际上都代表一个子问题。`recursive\
    \ call` 的结果为解决更大的问题做出了贡献。\n\n### 11. 可读性与代码结构\n![](img/image_rsrc9WC.jpg)递归可以产生简洁且优雅的代码，以镜像问题结构的方式表达解决方案。然而，它需要仔细的设计以确保终止的运行和效率。\n\
    \n### 12. 递归问题的示例\n![](img/image_rsrc9WD.jpg)递归解决方案通常用于涉及树结构、搜索、排序和数学计算的问题。示例包括遍历目录结构、`quicksort`（快速排序）、`mergesort`（合并排序）以及解决二叉树上的问题。\n\
    \n总之，递归是一种编程技术，其中`method` 通过调用自身将问题分解为更小的子问题来解决问题。它涉及 `base case`（基本情况）、`recursive\
    \ calls`（递归调用）和 `termination condition`（终止条件）以防止无限递归。递归解决方案可以是优雅且富有表现力的，但适当的设计和对效率的考虑至关重要。\n\
    \n递归是一种编程概念，其中`method` 调用自身来解决问题的规模实例。在 Java 中，递归通常用于将复杂问题分解为更简单的子问题。这里有一个 Java\
    \ 递归示例：\n\n```java\npublic class RecursionExample {\n\n    public static void\
    \ main(String[] args) {\n        // 递归示例：计算阶乘\n        int n = 5;\n        int\
    \ factorialResult = calculateFactorial(n);\n        System.out.println(\"Factorial\
    \ of \" + n + \" is: \" + factorialResult);\n    }\n\n    // 计算阶乘的递归方法\n    public\
    \ static int calculateFactorial(int num) {\n        // 基本情况：0 的阶乘为 1\n       \
    \ if (num == 0) {\n            return 1;\n        } else {\n            // 递归情况：num!\
    \ = num * (num-1)!\n            return num * calculateFactorial(num - 1);\n  \
    \      }\n    }\n}\n```\n\n#### 解析：\n\n1. **递归方法 (calculateFactorial):**\n![](img/image_rsrc9TF.jpg)`calculateFactorial`\
    \ 方法设计用于计算给定数字的阶。\n![](img/image_rsrc9PM.jpg)它包含一个 `base case`：当 `num` 为 `0` 时，阶乘为\
    \ `1`。\n![](img/image_rsrc9TF.jpg)`recursive case` 表示为 `num * calculateFactorial(num\
    \ - 1)`，将问题分解为更小的实例。\n\n2. **Main 方法:**\n![](img/image_rsrc9PM.jpg)在 `main` 方法中展示了一个示例，使用\
    \ `calculateFactorial` 方法计算 `5` 的阶乘。\n\n3. **递归是如何工作的：**\n![](img/image_rsrc9TG.jpg)对\
    \ `calculateFactorial(5)` 的初始调用触发了后续递减值的调用，直到达到 `base case`（`calculateFactorial(0)`）。\n\
    ![](img/image_rsrc9TF.jpg)每个 `recursive call` 都对最终结果做出贡献，值在返回 `call stack`（调用栈）的过程中进行相乘。\n\
    \n4. **递归的重要方面：**\n![](img/image_rsrc9TG.jpg)`base case` 对于防止无限递归并确保问题最终变得简单到可以直接解决至关重要。\n\
    ![](img/image_rsrc9TG.jpg)`Recursive calls` 应该朝着 `base case` 逐渐进展进。\n\n递归是一种强大且优雅的技术，但它需要仔细考虑基本情况和终止条件以避免无限循环。它通常用于处理具有递归结构问题的算法中。\n\
    \n# Java OOP\n\n面向对象编程 (OOP) 是一种使用对象（类的实例）来组织和结构化代码的编程范式。\n\n### 1. 对象\n![](img/image_rsrc9WE.jpg)在\
    \ OOP 中，一切都被视为一个对象。对象是 `class` 的实例，代表具有属性（数据）和行为（方法）的真实世界实体。\n\n### 2. 类\n![](img/image_rsrc9WF.jpg)`class`\
    \ 是创建对象的蓝图或模板。它定义了其对象将拥有的属性（属性）和行为（方法）。\n\n### 3. 封装\n![](img/image_rsrc9WG.jpg)封装是将数据（属性）和操作数据的方法封装在单个单元（即一个\
    \ `class`）中。这有助于隐藏对象的内部细节，并只暴露必要的内容。\n\n### 4. 抽象\n![](img/image_rsrc9WH.jpg)抽象是通过根据基本属性和行为对\
    \ `classes` 来简化复杂系统的过程。它允许程序员关注对象做什么，而无需担心它是如何实现其功能的。\n\n### 5. 继承\n![](img/image_rsrc9WJ.jpg)继承是一种机制，允许\
    \ `class`（子类或派生类）从另一个 `class`（父类）继承属性和行为。\n\n### 6. 多态\n![](img/image_rsrc9WK.jpg)多态允许不同类的对象被视为共同基类的对象。\n\
    \n### 7. 重载与重写\n![](img/image_rsrc9WM.jpg)方法重载涉及定义多个相同名称但不同参数列表的方法。方法重写发生在子类为父类中定义的方法提供特定实现时。\n\
    \n### 8. 模块化\n![](img/image_rsrc9WN.jpg)OOP 通过将复杂系统划分为更小、可管理的单元（对象）来促进模块化。每个对象封装了其数据和行为。\n\
    \n### 9. 消息传递\n![](img/image_rsrc9WP.jpg)对象通过发送消息相互通信。这涉及调用一个对象上的方法并请求信息。\n\n\
    ### 10. 实例化\n![](img/image_rsrc9WR.jpg)实例化是从 `class` 创建对象的过程。当对象实例化时，会为其属性分配内存，并成为一个具有独立状态的实体。\n\
    \n### 11. 构造函数与析构函数\n![](img/image_rsrc9WS.jpg)`constructor` 是 `class` 中的特殊方法，用于在创建对象时初始化其状态。析构函数在\
    \ Java 中没有显式定义，但负责在对象被销毁之前释放资源。\n\n### 12. 接口\n![](img/image_rsrc9WT.jpg)接口定义了\
    \ `classes` 的约定，规定了实现类必须提供的方法 set。它们在 Java 中支持多继承并有助于实现抽象层。\n\n总而言之，Java 面向对象编程围绕对象和类、封装、抽象、继承和多态等概念。这些原则有助于组织代码、提高代码重用性并模拟真实的实体和关系，从而构建出更模块化、可扩展且易于维护的软件。\n\
    \n"
- fmt: "\n```java\npublic SportsCar(String brand, String model, int year, boolean\
    \ isConvertible) {\n    super(brand, model, year); // Call the constructor of\
    \ the base class (Car)\n    this.isConvertible = isConvertible;\n}\n\n    // Overriding\
    \ the displayInfo method to include SportsCar-specific information\n    @Override\n\
    \    public void displayInfo() {\n        super.displayInfo(); // Call the displayInfo\
    \ method of the base class (Car)\n        System.out.println(\"Convertible:  \"\
    \ + isConvertible);\n    }\n}\n\npublic class OOPExample {\n    public static\
    \ void main(String[] args) {\n        // Creating objects of the Car and SportsCar\
    \ classes \n        Car sedan = new Car(\"Toyota\", \"Camry\", 2022);\n      \
    \  SportsCar sportsCar = new SportsCar(\"Porsche\", \"911\", 2022, true);\n\n\
    \        // Calling methods on the objects \n        sedan.displayInfo();\n  \
    \      sportsCar.displayInfo();\n    }\n}\n```\n\n## Explanation:\n\n1. **Classes\
    \ and Objects**:\n   ![](image_rsrc9TF.jpg)The `Car` class and `SportsCar` class\
    \ are examples of classes in Java.\n   ![](image_rsrc9PM.jpg)Objects (`sedan`\
    \ and `sportsCar`) are instances of these classes.\n\n2. **Attributes and Constructor**:\n\
    \   ![](image_rsrc9PM.jpg)Classes have attributes (instance variables) such as\
    \ `brand`, `model`, and `year`.\n   ![](image_rsrc9PM.jpg)The `Car` class has\
    \ a constructor (`public Car(...)`) to initialize these attributes.\n\n3. **Inheritance**:\n\
    \   ![](image_rsrc9PM.jpg)The `SportsCar` class extends (inherits from) the `Car`\
    \ class. This allows `SportsCar` to inherit the attributes and methods of `Car`.\n\
    \n4. **Polymorphism**:\n   ![](image_rsrc9TF.jpg)The `displayInfo` method is overridden\
    \ in the `SportsCar` class to provide a specialized version of the method.\n\n\
    5. **Encapsulation**:\n   ![](image_rsrc9TG.jpg)Attributes are encapsulated within\
    \ classes, and access to them is controlled through methods.\n\n6. **Abstraction**:\n\
    \   ![](image_rsrc9TG.jpg)Abstraction is achieved through the use of classes,\
    \ where the internal details of the implementation are hidden, and only the essential\
    \ features are exposed.\n\nIn summary, Object-Oriented Programming in Java involves\
    \ creating classes and objects, utilizing inheritance for code reuse, achieving\
    \ polymorphism through method overriding, encapsulating attributes, and promoting\
    \ abstraction to model real-world entities in a modular and organized manner.\
    \ OOP enhances code structure, readability, and maintainability.\n\n# JAVA Classes/Objects\n\
    \nIn Java, classes and objects are fundamental concepts in object- oriented programming\
    \ (OOP).\n\n1. **Classes**:\n   ![](image_rsrc9WU.jpg)A class is a blueprint or\
    \ template for creating objects in Java. It defines a set of attributes (fields\
    \ or properties) and behaviors (methods) that characterize objects of that class.\n\
    \n2. **Objects**:\n   ![](image_rsrc9WV.jpg)An object is an instance of a class.\
    \ It represents a real-world entity with characteristics and behaviors defined\
    \ by the class. Objects are created based on the structure provided by the class.\n\
    \n3. **Attributes (Fields/Properties)**:\n   ![](image_rsrc9WW.jpg)Attributes\
    \ are the data members of a class, also known as fields or properties. They represent\
    \ the state or characteristics of objects. Each object created from a class has\
    \ its own set of attribute values.\n\n4. **Behaviors (Methods)**:\n   ![](image_rsrc9WX.jpg)Behaviors\
    \ are the methods or functions defined within a class. They represent the actions\
    \ or operations that objects of the class can perform. Methods can interact with\
    \ the object's attributes.\n\n5. **Encapsulation**:\n   ![](image_rsrc9WY.jpg)Encapsulation\
    \ is one of the core principles of OOP. It involves bundling the data (attributes)\
    \ and the methods that operate on the data within a single unit (a class). This\
    \ helps hide the internal implementation details and exposes only what is necessary.\n\
    \n6. **Constructor**:\n   ![](image_rsrc9WZ.jpg)A constructor is a special method\
    \ in a class that is used to initialize the object's state when it is created.\
    \ Constructors have the same name as the class and do not have a return type.\n\
    \n7. **Instantiation**:\n   ![](image_rsrc9X0.jpg)Instantiation is the process\
    \ of creating an object from a class. It involves allocating memory for the object,\
    \ initializing its attributes (using the constructor), and obtaining a reference\
    \ to the newly created object.\n\n8. **Class Members**:\n   ![](image_rsrc9X1.jpg)Class\
    \ members include both static and instance members. Static members belong to the\
    \ class itself and are shared among all instances. Instance members are specific\
    \ to individual objects.\n\n9. **Inheritance**:\n   ![](image_rsrc9X2.jpg)Inheritance\
    \ is another OOP concept that allows a class (subclass or child class) to inherit\
    \ attributes and behaviors from another class (superclass or parent class). This\
    \ promotes code reuse and supports the \"is-a\" relationship.\n\n10. **Polymorphism**:\n\
    \    ![](image_rsrc9X3.jpg)Polymorphism allows different classes to be treated\
    \ as objects of a common base through method overriding.\n\n11. **Abstraction**:\n\
    \    ![](image_rsrc9X4.jpg)Abstraction is the process of simplifying systems by\
    \ focusing on what an object does rather than how.\n\n12. **Modularity**:\n  \
    \  ![](image_rsrc9X5.jpg)OOP promotes modularity by organizing classes, making\
    \ it easier to understand and extend.\n"
