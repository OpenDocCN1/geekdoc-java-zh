    \ through the `Files` class. The `createSymbolicLink()` and `createLink()` methods\
    \ allow the creation of symbolic and hard links, respectively.\n\n### 9. Path\
    \ Normalization\n![](image_rsrcA9U.jpg)The `normalize()` method of the `Path`\
