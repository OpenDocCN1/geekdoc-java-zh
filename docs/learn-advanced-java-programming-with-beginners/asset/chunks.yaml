  trans: "\nJava 中的方法重载（Method overloading）是一种特性，允许类拥有多个同名但参数列表不同的方法。每个具有不同参数列表的方法版本都被视为一个独立的方法。以下是对\
    \ Java 方法重载的解释，不提供具体的代码示例：\n\n### 1. 相同的方法名\n![](img/image_rsrc9VP.jpg)当一个类拥有两个或多个同名方法时，就发生了方法重载。\n\
    \n### 2. 不同的参数列表\n![](img/image_rsrc9VR.jpg)重载的方法必须具有不同的参数列表。这可能涉及不同的参数数量、不同的参数类型或两者兼有。\n\
    \n### 3. 返回类型\n![](img/image_rsrc9VS.jpg)在判断方法是否重载时，不考虑方法的返回类型。不允许具有相同方法名和参数列表但返回类型不同的方法。\n\
    \n### 4. 编译时决策\n![](img/image_rsrc9VT.jpg)关于调用哪个重载方法的决策是由编译器在编译时做出的，依据是方法调用中提供的参数的数量和类型。\n\
    \n### 5. 增强可读性\n![](img/image_rsrc9VU.jpg)方法重载通过允许开发者对同一任务的不同变使用相同的方法名来增强代码的可读性。这使得代码更加直观且易于理解。\n\
    \n### 6. 避免命名冲突\n![](img/image_rsrc9VV.jpg)通过重载方法，开发者可以避免为相似的操作构不同的名称。相反，方法名保持不变，差异通过参数列表来体现。\n\
    \n### 7. 灵活输入\n![](img/image_rsrc9VW.jpg)重载允许方法接受各种输入，而无需创建多个方法名称。例如，`calculate`\
    \ 方法可以被重载以接受不同类型的数值参数。\n\n### 8. 常见用例\n![](img/image_rsrc9VX.jpg)方法重载的常见用例包括为可选参数提供默认值、支持各种数据类型以及处理多种参数场景。\n\
    \n### 9. 构造函数重载\n![](img/image_rsrc9VY.jpg)Java 中的构造函数也可以重载。这允许具有不同参数列表的多个构造函数以多种方式初始化对象。\n\
    \n### 10. 局限性\n![](img/image_rsrc9VZ.jpg)重载方法时，必须确保参数列表足够独特，以便编译器能够做出明确的决策。如果两个方法具有相同数量和类型的参数，但顺序不同，则不被视为有效的重载。\n\
    \n### 11. 无变长参数歧义\n![](img/image_rsrc9W0.jpg)在重载方法时，`varargs`（变长参数列表）被视为与数组不同。这有助于避免具有不同参数类型（包括变长参数）的重载方法之间的歧义。\n\
    \n### 12. 编译时多态\n![](img/image_rsrc9W1.jpg)方法重载是编译时多态的一个示例，其中调用哪个方法的决策在编译时根据方法签名解决。\n\
    \n总之，Java 中的方法重载允许开发者对同一任务的不同变使用相同的方法名，使代码更具可读性并保持一致的命名规范。它为处理多种输入场景提供了灵活性，而不会引入命名冲突或破坏代码结构。\n\
    \n在 Java 中，方法重载允许你在同一个类中定义多个同名但参数列表不同的方法。方法可以有不同数量或类型的参数。以下是 Java 方法重载的一个示例：\n\
    \n```\npublic class MethodOverloadingExample {\n    public static void main(String[]\
    \ args) {\n        // 调用重载方法\n        displayInfo(\"John\");\n        displayInfo(\"\
    Alice\", 25);\n        displayInfo(\"Bob\", \"Engineering\");\n    }\n\n    //\
    \ 有一个参数的方法\n    public static void displayInfo(String name) {\n        System.out.println(\"\
    Name: \" + name);\n    }\n\n    // 有两个参数的重载方法\n    public static void displayInfo(String\
    \ name, int age) {\n        System.out.println(\"Name: \" + name + \", Age: \"\
    \ + age);\n    }\n\n    // 另一个不同参数类型的重载方法\n    public static void displayInfo(String\
    \ name, String occupation) {\n        System.out.println(\"Name: \" + name + \"\
    , Occupation: \" + occupation);\n    }\n}\n```\n\n### 解释：\n\n#### 1. 方法重载\n![](img/image_rsrc9TF.jpg)示例中\
    \ `displayInfo` 方法被重载了三次。\n![](img/image_rsrc9PM.jpg)第一个版本接受单个参数（`String name`），第二个版本接受两个参数（`String\
    \ name` 和 `int age`），第三个版本接受两个参数（`String name` 和 `String occupation`）。\n\n####\
    \ 2. 调用重载方法\n![](img/image_rsrc9PM.jpg)在 `main` 方法中，使用不同的参数集调用重载的 `displayInfo`\
    \ 方法。\n\n#### 3. 编译时解析\n![](img/image_rsrc9PM.jpg)在编译期间，编译器确定调用哪个方法。\n\n#### 4.\
    \ 多态\n![](img/image_rsrc9PM.jpg)方法重载是多态的一种形式，根据方法签名解决决策。\n\n# Java 递归\n\n递归是一种编程概念，其中方法直接或间接地调用它自己。\n\
    \n### 1. 定义\n![](img/image_rsrc9W2.jpg)递归是一个过程，方法通过直接或间接地调用自身（带有更小的问题实例）来解决问题。\n\
    \n### 2. 基准情形 (Base Case)\n![](img/image_rsrc9W3.jpg)每个递归算法必须有一个基准情形，它代表可以直接解决的最简单问题形式。基准情形防止递归无限持续。\n\
    \n### 3. 问题的拆解\n![](img/image_rsrc9W4.jpg)在递归解决方案中，原始问题被拆分为更小的子问题。每个递归调用处理一个更小的问题实例，向基准情形推进。\n\
    \n### 4. 调用堆栈\n![](img/image_rsrc9W5.jpg)递归创建了一个方法调用栈，每个方法调用都被推入栈中。当每个递归调用完成时，它会从栈中弹出，程序继续下一个方法调用。\n\
    \n### 5. 执行流\n![](img/image_rsrc9W6.jpg)递归解决方案的执行流涉及反复划分问题直到到达基准情形。一旦到达基准情形，就会将结果组合以解决原始问题。\n\
    \n### 6. 内存使用\n![](img/image_rsrc9W7.jpg)递归使用调用栈来跟踪方法调用。每个递归调用都会消耗栈内存。过度递归会导致栈溢出，特别是当没有适当终止条件（基准情形）时。\n\
    \n### 7. 直接递归与间接递归\n![](img/image_rsrc9W8.jpg)在直接递归中，方法直接调用自己。在间接递归中，方法调用链最终会回到原始方法，过程中可能涉及多个方法。\n\
    \n### 8. 数学模型\n![](img/image_rsrc9W9.jpg)递归通常用于实现具有自相似重复模式的数学模型和算法。示例包括斐波那契数列、阶乘以及求解某些数学方程。\n\
    \n### 9. 递归与迭代解决方案\n\n"
- fmt: "\n![](image_rsrc9WA.jpg)Recursion is an alternative to iteration (loops) for\
    \ solving problems. Both approaches can be used to achieve the same result, but\
    \ certain problems are more naturally expressed using recursion.\n\n### 10. Function\
    \ Calls as Subproblems\n![](image_rsrc9WB.jpg)In recursive solutions, each `function\
    \ call` effectively represents a subproblem. The result of the `recursive call`\
    \ contributes to solving the larger problem.\n\n### 11. Readability and Code Structure\n\
    ![](image_rsrc9WC.jpg)Recursion can lead to concise and elegant code, expressing\
    \ the solution in a way that mirrors the problem's structure. However, it requires\
    \ careful design to ensure termination and efficiency.\n\n### 12. Examples of\
    \ Recursive Problems\n![](image_rsrc9WD.jpg)Recursive solutions are commonly employed\
    \ in problems involving tree structures, searching, sorting, and mathematical\
    \ computations. Examples include traversing a directory structure, `quicksort`,\
    \ `mergesort`, and solving problems on binary trees.\n\nIn summary, recursion\
    \ is a programming technique where a `method` calls itself to solve a problem\
    \ by breaking it down into smaller subproblems. It involves a `base case`, `recursive\
    \ calls`, and a `termination condition` to prevent infinite recursion. Recursive\
    \ solutions can be elegant and expressive, but proper design and consideration\
    \ of efficiency are essential.\n\nRecursion is a programming concept where a `method`\
    \ calls itself to solve a smaller instance of a problem. In Java, recursion is\
    \ often used to break down complex problems into simpler sub-problems. Here's\
    \ an example of recursion in Java:\n\n```java\npublic class RecursionExample {\n\
    \n    public static void main(String[] args) {\n        // Example of recursion:\
    \ Calculating factorial\n        int n = 5;\n        int factorialResult = calculateFactorial(n);\n\
    \        System.out.println(\"Factorial of \" + n + \" is: \" + factorialResult);\n\
    \    }\n\n    // Recursive method to calculate factorial\n    public static int\
    \ calculateFactorial(int num) {\n        // Base case: factorial of 0 is 1\n \
    \       if (num == 0) {\n            return 1;\n        } else {\n           \
    \ // Recursive case: num! = num * (num-1)!\n            return num * calculateFactorial(num\
    \ - 1);\n        }\n    }\n}\n```\n\n#### Explanation:\n\n1. **Recursive Method\
    \ (calculateFactorial):**\n![](image_rsrc9TF.jpg)The `calculateFactorial` method\
    \ is designed to calculate the factorial of a given number.\n![](image_rsrc9PM.jpg)It\
    \ has a `base case`: when `num` is `0`, the factorial is `1`.\n![](image_rsrc9TF.jpg)The\
    \ `recursive case` is expressed as `num * calculateFactorial(num - 1)`, breaking\
    \ the problem down into a smaller instance.\n\n2. **Main Method:**\n![](image_rsrc9PM.jpg)In\
    \ the `main` method, an example is shown where the factorial of `5` is calculated\
    \ using the `calculateFactorial` method.\n\n3. **How Recursion Works:**\n![](image_rsrc9TG.jpg)The\
    \ initial call to `calculateFactorial(5)` triggers subsequent calls with decreasing\
    \ values until the `base case` is reached (`calculateFactorial(0)`).\n![](image_rsrc9TF.jpg)Each\
    \ `recursive call` contributes to the final result, and the values are multiplied\
    \ on the way back up the `call stack`.\n\n4. **Important Aspects of Recursion:**\n\
    ![](image_rsrc9TG.jpg)A `base case` is crucial to prevent infinite recursion and\
    \ ensure the problem eventually becomes simple enough to solve directly.\n![](image_rsrc9TG.jpg)`Recursive\
    \ calls` should be making progress towards the `base case`.\n\nRecursion is a\
    \ powerful and elegant technique, but it requires careful consideration of base\
    \ cases and termination conditions to avoid infinite loops. It's often used in\
    \ algorithms dealing with problems that exhibit a recursive structure.\n\n# Java\
    \ OOP\n\nObject-Oriented Programming (OOP) is a programming paradigm that uses\
    \ objects, which are instances of classes, to organize and structure code.\n\n\
    ### 1. Objects\n![](image_rsrc9WE.jpg)In OOP, everything is treated as an object.\
    \ An object is an instance of a `class` and represents a real-world entity with\
    \ attributes (data) and behaviors (methods).\n\n### 2. Classes\n![](image_rsrc9WF.jpg)A\
    \ `class` is a blueprint or template for creating objects. It defines the properties\
    \ (attributes) and behaviors (methods) that its objects will have.\n\n### 3. Encapsulation\n\
    ![](image_rsrc9WG.jpg)Encapsulation is the bundling of data (attributes) and the\
    \ methods that operate on the data within a single unit, i.e., a `class`. This\
    \ helps in hiding the internal details of an object and exposing only what is\
    \ necessary.\n\n### 4. Abstraction\n![](image_rsrc9WH.jpg)Abstraction is the process\
    \ of simplifying complex systems by modeling `classes` based on essential properties\
    \ and behaviors. It allows programmers to focus on what an object does without\
    \ worrying about how it achieves its functionality.\n\n### 5. Inheritance\n![](image_rsrc9WJ.jpg)Inheritance\
    \ is a mechanism that allows a `class` (subclass or derived class) to inherit\
    \ properties and behaviors from another `class` (superclass).\n\n### 6. Polymorphism\n\
    ![](image_rsrc9WK.jpg)Polymorphism allows objects of different classes to be treated\
    \ as objects of a common base class.\n\n### 7. Overloading and Overriding\n![](image_rsrc9WM.jpg)Method\
    \ overloading involves defining multiple methods with the same name but different\
    \ parameter lists. Method overriding occurs when a subclass provides a specific\
    \ implementation for a method already defined in the superclass.\n\n### 8. Modularity\n\
    ![](image_rsrc9WN.jpg)OOP promotes modularity by dividing a complex system into\
    \ smaller, manageable units (objects). Each object encapsulates its data and behavior.\n\
    \n### 9. Message Passing\n![](image_rsrc9WP.jpg)Objects communicate with each\
    \ other by sending messages. This involves invoking methods on one object, requesting\
    \ information.\n\n### 10. Instantiation\n![](image_rsrc9WR.jpg)Instantiation is\
    \ the process of creating an object from a `class`. When an object is instantiated,\
    \ memory is allocated for its attributes, and it becomes a distinct entity with\
    \ its own state.\n\n### 11. Constructor and Destructor\n![](image_rsrc9WS.jpg)A\
    \ `constructor` is a special method in a `class` used for initializing the object's\
    \ state when it is created. A `destructor`, though not explicitly defined in Java,\
    \ is responsible for releasing resources before an object is destroyed.\n\n###\
    \ 12. Interfaces\n![](image_rsrc9WT.jpg)Interfaces define a contract for `classes`,\
    \ specifying a set of methods that implementing classes must provide. They support\
    \ multiple inheritance in Java and help achieve a level of abstraction.\n\nIn\
    \ summary, Java Object-Oriented Programming is centered around the concepts of\
    \ objects and classes, encapsulation, abstraction, inheritance, and polymorphism.\
    \ These principles help organize code, improve code reuse, and model real-world\
    \ entities and relationships, leading to more modular, extensible, and maintainable\
    \ software.\n"
