  trans: "\n\n总而言之，类定义了创建具有特定属性和行为对象的蓝图。对象是类的实例，它们封装了数据和行为。类和对象的概念是面向对象编程（OOP）的基础，它提供了一种基于现实实体对代码进行建模和组织的方法。\n\
    \n# Java 类属性\n\n在 Java 中，类属性（也称为字段或属性）是在类内部定义的变量，用于定义从该类创建的对象的状态或特征。\n\n1. **定义**：\n\
    ![](img/image_rsrc9X6.jpg)类属性是属于类的变量。它们代表与从该类创建的对象相关联的数据或状态。该类的每个对象都有自己的一组属性值。\n\
    \n2. **对象的状态**：\n![](img/image_rsrc9X7.jpg)属性定义了对象的状态。它们代表描述对象身份或当前状况的信息或特征。\n\
    \n3. **数据成员**：\n![](img/image_rsrc9X8.jpg)类属性也被称为数据成员。它们持有与对象相关的数据，并决定了类实例的属性。\n\
    \n4. **声明**：\n![](img/image_rsrc9X9.jpg)属性在类体内声明，但在任何方法之外。它们通常带有访问修饰符（例如 `public`、`private`、`protected`\
    \ 或包私有）来控制它们的可见性。\n\n5. **可访问性**：\n![](img/image_rsrc9XA.jpg)访问修饰符定义了类属性的可见性和访问权限。例如，使用\
    \ `private` 可以确保属性仅在类内部可访问，从而促进封装。\n\n6. **数据类型**：\n![](img/image_rsrc9XB.jpg)属性具有特定的数据类型，定义了它们可以存储的数据。常见的数据类型包括基本类型（例如\
    \ `int`、`double`）和对象（例如自定义类、`String`）。\n\n7. **初始化**：\n![](img/image_rsrc9XC.jpg)类属性可以在声明时或在构造函数中初始化。初始化在创建对象时为属性设置初始值。\n\
    \n8. **默认值**：\n![](img/image_rsrc9XD.jpg)如果属性没有显式初始化，Java 将根据其数据类型分配默认值。例如，数值类型的默认值为\
    \ `0`，对象引用的默认值为 `null`。\n\n9. **实例属性 vs. 静态属性**：\n![](img/image_rsrc9XE.jpg)类属性可以是实例（非静态）的或静态的。实例属性每个对象都有一个独立的副本，而静态属性由类的所有对象共享。\n\
    \n10. **封装**：\n![](img/image_rsrc9XF.jpg)属性通过允许类控制对其内部状态的访问，有助于封装。封装通过限制直接访问和修改来保护对象数据的完整性。\n\
    \n11. **访问器和变异器方法**：\n![](img/image_rsrc9XG.jpg)为了与私有属性交互，通常提供访问器（getter）和变异器（setter）方法。访问器方法获取属性的值，变异方法修改其值。\n\
    \n12. **与方法的关系**：\n![](img/image_rsrc9XH.jpg)属性与类中的方法密切相关。方法对存储在属性中的数据进行操作，提供定义类类功能的行为。\n\
    \n总而言之，Java 中的类属性定义了从类创建的对象的状态或特征。它们在建模与对象相关的数据方面起着至关重要的作用，对类的整体结构和行为有所贡献。属性在类内部声明，并可供类内部的方法访问。\n\
    \n在 Java 中，类属性是与类关联而非与类的实例（对象）关联的变量。这些属性也被称为类变量或静态变量。类属性在类的所有实例之间共享。下面是一个说明 Java\
    \ 类属性示例：\n\n```java\npublic class ClassAttributesExample {\n    // 类属性（静态变量）\n\
    \    static int numberOfCars = 0;\n\n    // 实例变量\n    String brand;\n    String\
    \ model;\n    int year;\n\n    // 初始化实例变量的构造函数\n    public ClassAttributesExample(String\
    \ brand, String model, int year) {\n        this.brand = brand;\n        this.model\
    \ = model;\n        this.year = year;\n        // 增加类属性（所有实例间共享）\n        numberOfCars++;\n\
    \    }\n\n    // 显示汽车信息的方法\n    public void displayInfo() {\n        System.out.println(\"\
    Car: \" + brand + \" \" + model + \" (\" + year + \")\");\n    }\n\n    // 显示汽车总数的方法\n\
    \    public static void displayTotalCars() {\n        System.out.println(\"Total\
    \ number of cars: \" + numberOfCars);\n    }\n\n    public static void main(String[]\
    \ args) {\n        // 创建类的对象\n        ClassAttributesExample car1 = new ClassAttributesExample(\"\
    Toyota\", \"Camry\", 2022);\n        ClassAttributesExample car2 = new ClassAttributesExample(\"\
    Honda\", \"Accord\", 2023);\n\n        // 通过对象访问并修改类属性\n        System.out.println(\"\
    Number of cars: \" + car1.numberOfCars);\n    }\n}\n```\n\n解释：\n\n1. **类属性 (`numberOfCars`)**：\n\
    ![](img/image_rsrc9PM.jpg)变量 `numberOfCars` 使用 `static` 关键字声明的类属性。它在实例之间共享。\n\n\
    2. **实例变量 (`brand`, `model`, `year`)**：\n![](img/image_rsrc9TF.jpg)这些与类的每个实例关联的非静态变量。它们代表每辆汽车的个体特征。\n\
    \n3. **构造函数**：\n![](img/image_rsrc9TG.jpg)构造函数负责初始化实例变量，并在创建新对象时增加类属性（`numberOfCars`）。\n\
    \n4. **访问类属性**：\n![](img/image_rsrc9PG.jpg)类属性可以通过对象（`car1.numberOfCars`）或直接通过类（`ClassAttributesExample.numberOfCars`）访问。\n\
    \n5. **静态方法 (`displayTotalCars`)**：\n![](img/image_rsrc9PG.jpg)`displayTotalCars`\
    \ 方法是一个静态方法，无需创建类的实例即可调用。它显示汽车的总数。\n\n"
