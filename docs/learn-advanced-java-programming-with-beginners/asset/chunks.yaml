    # Java Methods


    In Java, a method is a block of code that performs a specific task and can be
    called by name from another part of the program. Methods provide a way to structure
    and organize code, promote code reuse, and improve the readability and maintainability
    of a Java program.


    ## 1. Declaration and Definition


    ![](image_rsrc9UP.jpg)A method is declared and defined using the `method` keyword,
    followed by the method''s return type, name, parentheses, and a block of code
    enclosed in curly braces `{}`. The return type specifies the type of value the
    method returns or indicates `void` if the method does not return any value.


    ## 2. Method Signature


    ![](image_rsrc9UR.jpg)The combination of a method''s name and its parameter list
    is known as the method signature. It uniquely identifies the method within its
    class. The return type is not considered part of the method signature.


    ## 3. Parameters


    ![](image_rsrc9US.jpg)A method can accept parameters, which are values passed
    to the method when it is called. Parameters are specified within the parentheses
    in the method signature. The values provided during the method call are referred
    to as arguments.


    ## 4. Return Type


    ![](image_rsrc9UT.jpg)The return type of a method indicates the type of value
    the method produces. If a method does not return any value, the return type is
    specified as `void`. Methods with a return type other than `void` must use the
    `return` statement to return a value of the specified type.


    ## 5. Method Call


    ![](image_rsrc9UU.jpg)To execute the code within a method, the method must be
    called from another part of the program. The method call consists of the method
    name followed by parentheses enclosing any required arguments.


    ## Access Modifiers


    ![](image_rsrc9UV.jpg)Methods can have access modifiers, such as `public`, `private`,
    or `protected`, which control the visibility of the method. The absence of an
    access modifier implies package-private.


    ## 7. Static and Instance Methods


    ![](image_rsrc9UW.jpg)Methods can be `static` or instance methods. `static` methods
    belong to the class rather than an instance. Instance methods operate on an instance.


    ## 8. Method Overloading


    ![](image_rsrc9UX.jpg)Java supports method overloading, which allows multiple
    methods to have the same name but different parameter lists. Overloaded methods
    provide flexibility in calling methods with varying argument types.


    ## 9. Recursion


    ![](image_rsrc9UY.jpg)A method can call itself, a concept known as recursion.
    Recursive methods can be powerful for solving problems that can be broken down
    into smaller instances.


    ## 10. Java Standard Library Methods


    ![](image_rsrc9UZ.jpg)Java comes with a rich set of standard library methods,
    provided by classes like `Math`, `String`, and others. These methods can be called
    by any Java program without the need for explicit import statements.


    ## 11. Encapsulation


    ![](image_rsrc9V0.jpg)Methods contribute to encapsulation by allowing the hiding
    of implementation details. Methods can be used to expose only the necessary functionality
    to the outside world, protecting the internal state of an object.


    ## 12. Code Reusability


    ![](image_rsrc9V1.jpg)Methods promote code reusability by allowing the same block
    of code to be called from different parts of the program. This reduces redundancy
    and improves the maintainability of the code.


    In summary, Java methods are essential building blocks that encapsulate functionality,
    promote code organization, and facilitate code reuse. They play a crucial role
    in structuring programs, enhancing readability, and supporting modular and maintainable
    code development.


    In Java, a method is a block of code that performs a specific task and is defined
    within a class. Methods are used to organize code into reusable units and promote
    code modularity. Here''s an example of using methods in Java:


    ```

    public class MethodsExample {


    public static void main(String[] args) {


    // Calling a method with parameters and returning a value

    int sum = addNumbers(3, 7);


    System.out.println("Sum:  " +  sum);


    // Calling a method without parameters and returning a value

    double result = calculateSquareRoot();

    System.out.println("Square root: " + result);


    // Calling a method with parameters and no return value

    printMessage("Hello, Java Methods!");


    // Calling a method without parameters and no return value

    displayGreeting();


    }


    //  Method with parameters  and a return value

    public static int addNumbers(int a, int b) {


    return a + b;


    }


    //  Method  without  parameters  and  a  return value

    public static double calculateSquareRoot() {


    double number = 25.0;  return  Math.sqrt(number);


    }


    }

    ```

