  trans: "\n\n## 2. 布尔表达式\n\n![](img/image_rsrc9PM.jpg)布尔表达式是评估为布尔值（`true` 或 `false`）的条件或比较。在示例中，`isEqual`\
    \ 是一个测试相等性的布尔表达式。\n\n## 3. 条件语句\n\n![](img/image_rsrc9PM.jpg)条件语句（如 `if` 和 `else`）允许你根据布尔条件执行不同的代码块。\n\
    \n## 4. 逻辑运算符\n\n![](img/image_rsrc9PM.jpg)逻辑运算符（`&&` 表示与，`||` 表示或，!` 表示非）用于组合或否定布尔值。\n\
    \n布尔值在编程中是基础性的，因为它们允许程序进行决策和控制流。它们通常用于条件语句和循环中，以根据某些条件确定执行流。理解如何操作布尔值对于在 Java\
    \ 中编写高效且逻辑逻辑严密的代码至关重要。\n\n# Java If...Else\n\n在 Java 中，`if...else` 语句是一种控制流语句，允许程序根据布尔表达式的评估结果执行不同的代码块。\n\
    \n![](img/image_rsrc9SE.jpg)`if...else` 语句以 `if` 关键字开头，随后跟着括在括号内的布尔表达式。该表达式被评估为\
    \ `true` 或 `false`。\n\n### 2. 真块执行\n\n![](img/image_rsrc9SF.jpg)如果布尔表达式评估为 `true`，则执行紧随\
    \ `if` 语句之后的代码块。该块通常被称为“真块”或“if 块”。\n\n### 3. Else 块\n\n![](img/image_rsrc9SG.jpg)可选情况下，`if...else`\
    \ 语句可以包含一个 `else` 关键字，后跟另一个代码块。如果 `if` 语句中的布尔表达式评估为 `false`，则执行该代码块。该块通常被称为“else\
    \ 块”。\n\n### 4. 互斥执行\n\n![](img/image_rsrc9SH.jpg)真块或 `else` 块执行其一，但两者都不同执行。`if...else`\
    \ 语句根据条件在两种可选执行路径之间提供互斥选择。\n\n### 5. 嵌套\n\n![](img/image_rsrc9SJ.jpg)多个 `if...else`\
    \ 语句可以嵌套在彼此内部，创建更复杂的决策结构。这允许处理多个条件并根据它们的评估结果执行不同的代码块。\n\n### 6. 链式\n\n![](img/image_rsrc9SK.jpg)多个\
    \ `if... else if` 语句可以链在一起，形成一系列条件，每个条件都有其关联的代码块。如果存在 `else` 块，则只有在之前的所有条件都不为真时才执行它。\n\
    \n### 7. 三元运算符作为简写\n\n![](img/image_rsrc9SM.jpg)在某些情况下，可以使用三元条件运算符（`? :`）表示 `if...else`\
    \ 的简洁形式。该运算符评估布尔表达式，并根据条件是 `true` 还是 `false` 返回两个值之一。\n\n### 8. 代码块作用域\n\n![](img/image_rsrc9SN.jpg)与\
    \ `if` 和 `else` 语句相关的代码块定义了一个作用域。在这些块内部声明的变量可见性有限，只能在各自的作用域内访问。\n\n### 9. 常见用例\n\
    \n![](img/image_rsrc9SP.jpg)`if...else` 语句常用于各种场景下的决策，例如验证用户输入、根据条件处理不同情况以及响应事件。\n\
    \n### 10. 错误处理\n\n![](img/image_rsrc9SR.jpg)在错误处理中，可以使用 `if...else` 语句检查异常情况或错误状态。`if`\
    \ 块处理正常执行路径，而 `else` 块处理错误场景。\n\n### 11. 默认行为\n\n![](img/image_rsrc9SS.jpg)`else`\
    \ 块通常用于指定当一系列 `if` 和 `else if` 语句中没有一个条件为 `true` 时的默认行为。\n\n### 12. 可读性与可维护性\n\
    \n![](img/image_rsrc9ST.jpg)正确使用 `if...else` 语句通过根据条件组织逻辑，有助于代码的可读性和可维护性，使代码更容易理解和修改。\n\
    \n总结来说，Java 中的 `if...else` 语句允许开发者在代码中创建条件分支，能够根据布尔表达式的评估结果执行不同的代码块。它是 Java 程序中决策和控制流的基础结构。\n\
