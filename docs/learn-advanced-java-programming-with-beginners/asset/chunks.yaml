    \n# Java 包装类 (Wrapper Classes)\n\n在 Java 中，包装类是提供了一种将基本数据类型（如 `int`、`char`、`boolean`\
    \ 等）用对象的方法。每个基本数据类型都有对应的包装类，它们是 `java.lang` 包的一部分。\n\n1. **基本数据类型**:\n![](img/image_rsrcA6W.jpg)\
    \ Java 有八种基本数据类型：`byte`、`short`、`int`、`long`、`float`、`double`、`char` 和 `boolean`。这些数据类型不是对象，也不继承自任何公共类。\n\
    \n2. **对象表示**:\n![](img/image_rsrcA6X.jpg) 包装类作为将基本类型表示为对象的方法。它们提供了将基本值转换为对象以及反之的机制。\n\
    \n3. **命名规范**:\n![](img/image_rsrcA6Y.jpg) 包装类的命名规范是使用首字母大写的基本类型名称。例如，`int` 的包装类是\
    \ `Integer`，`char` 是 `Character`，以此此类推。\n\n4. **继承自 Object 类**:\n![](img/image_rsrcA6Z.jpg)\
    \ 所有包装类都继承自 `Object` 类，它是 Java 类层次结构中的根类。这意味着包装类可以访问 `Object` 类中定义的方法。\n\n5. **不可变性**:\n\
    ![](img/image_rsrcA70.jpg) 包装类通常是不可变的，这意味着在实例化后它们的值不能更改。任何看似修改包装对象的值的操作实际上都是创建了一个新对象。\n\
    \n6. **自动装箱和拆箱 (Autoboxing and Unboxing)**:\n![](img/image_rsrcA71.jpg) Java 在基本数据类型与其对应的包装类之间提供了自动转换，被称为“自动装箱”（从基本类型到对象的转换）和“拆箱”（从对象到基本类型的转换）。这允许\
    \ Java 代码中基本类型和对象之间的无缝集成。\n\n7. **工具方法**:\n![](img/image_rsrcA72.jpg) 包装类通常提供用于处理基本值的工具方法。\n\
    \n8. **集合中的用法**:\n![](img/image_rsrcA73.jpg) 包装类在集合中被广泛使用，因为集合需要对象。\n\n9. **Null\
    \ 值**:\n![](img/image_rsrcA74.jpg) 包装类可以表示 `null` 值，而基本类型无法做到。\n\n10. **类型转换**:\n\
    ![](img/image_rsrcA75.jpg) 包装类提供了不同数据类型之间的转换。\n\n11. **泛型类**:\n![](img/image_rsrcA76.jpg)\
    \ 包装类在泛型文中非常有用，因为泛型需要对象。\n\n总结来说，包装类是基本数据类型和对象之间的桥梁。它们允许在需要对象的地方使用基本值，启用类型转换并提供处理相应数据类型的方法。包装类对于使\
    \ Java 类型系统更加灵活和一致至关重要。\n\n在 Java 中，包装类是提供基本数据类型对象表示的一类类。它们是 `java.lang` 包的一部分，并在需要基本类型的对象表示时使用。这些包装类包括：\n\
    \n![](img/image_rsrcA77.jpg)![](img/image_rsrcA78.jpg)![](img/image_rsrcA79.jpg)![](img/image_rsrcA7A.jpg)![](img/image_rsrcA7B.jpg)![](img/image_rsrcA7C.jpg)![](img/image_rsrcA7D.jpg)`Byte`\
