    \n![](img/image_rsrc9PM.jpg)使用 `Pattern` 类来编译数字模式，并为输入句子创建一个 `Matcher`。\n\n![](img/image_rsrc9PM.jpg)在循环中使用\
    \ `find()` 方法来查找并打印句子中所有数字出现的位置。\n\n总结，Java 正则表达式为处理字符串中的模式提供了一种灵活且强大的方式。它们被用于搜索、匹配和文本处理等任务。`java.util.regex`\
    \ 包中的关键类包括用于编译正则表达式的 `Pattern` 和用于执行匹配操作的 `Matcher`。正则表达式由字符和特殊符号组成，这些符号定义了字符串匹配的模式。正则表达式的灵活性表达力使其成为处理字符串操作和验证任务的价值工具。\n\
    \n# Java 线程 (JAVA THREADS)\n\n在 Java 中，线程是程序中执行的最小单元，多线程是两个或多个线程的并发执行，以实现更好的性能和响应速度。\n\
    \n### 1. 线程定义\n![](img/image_rsrcA8A.jpg)Java 线程是一个轻量级、独立的执行单元。它包含自己的程序计数器、栈和一组寄存器。程序中的多个线程共享相同的内存空间，但独立运行。\n\
    \n### 2. 线程生命周期\n![](img/image_rsrcA8B.jpg)Java 线程在生命周期内会经历各种状态。这些状态包括：\n\n![](img/image_rsrcA8C.jpg)新建\
    \ (New)：线程已创建但尚未启动。\n\n![](img/image_rsrcA8D.jpg)可运行 (Runnable)：线程已就绪，正在等待线程调度器选择它运行。\n\
    \n![](img/image_rsrcA8E.jpg)阻塞 (Blocked)：线程正在等待监器锁以进入同步块或方法。\n\n![](img/image_rsrcA8F.jpg)等待\
    \ (Waiting)：线程正在等待另一个线程执行特定的动作。\n\n![](img/image_rsrcA8G.jpg)计时等待 (Timed Waiting)：线程等待另一个线程，持续为指定的时间。\n\
    \n![](img/image_rsrcA8H.jpg)终止 (Terminated)：线程已完成执行。\n\n### 3. 线程创建\n![](img/image_rsrcA8J.jpg)在\
    \ Java 中，可以通过扩展 `Thread` 类或实现 `Runnable` 接口来创建线程。`Thread` 类提供了 `start()` 方法来开始线程的执行。\n\
    \n### 4. Runnable 接口\n![](img/image_rsrcA8K.jpg)`Runnable` 接口提供了一种通过实现 `run()`\
    \ 方法在 Java 中创建线程的方法。可以将 `Runnable` 对象传递给 `Thread` 构造函数。\n\n### 5. 线程优先级\n![](img/image_rsrcA8M.jpg)Java\
    \ 每个线程都有一个优先级，范围从 `Thread.MIN_PRIORITY` 到 `Thread.MAX_PRIORITY`。默认优先级是 `Thread.NORM_PRIORITY`。高优先级线程比低优先级线程获得更多的\
    \ CPU 时间。\n\n### 6. 同步\n![](img/image_rsrcA8N.jpg)在多线程环境中，多个线程可能会并发访问共享资源。同步是\
    \ Java 中控制多个线程访问共享资源的机制，防止数据损坏并确保线程安全。\n\n### 7. 线程安全\n![](img/image_rsrcA8P.jpg)线程安全是程序在并发执行多个线程而不引入数据不一致的属性。适当的同步和锁的使用确保了线程安全。\n\
    \n### 8. 守护线程 (Daemon Threads)\n![](img/image_rsrcA8R.jpg)守护线程是后台线程，即使它们仍在运行，也不会阻止程序的终止。当所有非守护线程完成后，它们会自动终止。\n\
    \n### 9. 线程中断\n![](img/image_rsrcA8S.jpg)`interrupt()` 方法用于中断线程。当线程被中断时，它会接收到一个\
    \ `InterruptedException`，并据此处理其正常流程。\n\n### 10. 线程等待\n![](img/image_rsrcA8T.jpg)`join()`\
    \ 方法用于让一个线程等待另一个线程完成。这对于协调不同线程的活动非常有用。\n\n### 11. 线程间通信\n![](img/image_rsrcA8U.jpg)线程可以使用\
    \ `wait()`、`notify()` 和 `notifyAll()` 等方法相互通信。这些方法用在 `synchronized` 块中用于协调线程的执行。\n\
    \n### 12. 线程池\n![](img/image_rsrcA8V.jpg)线程池是预初始化线程的集合，可以重用于执行任务。它们有助于管理线程的生命周期，减少创建和销毁线程的开销。\n\
    \n### 13. 线程本地存储\n![](img/image_rsrcA8W.jpg)线程本地存储提供了一种存储局部于线程的数据的方法。\n\n### 14.\
    \ volatile 关键字\n![](img/image_rsrcA8X.jpg)`volatile` 关键字用于指示变量可能会被多个线程更改。\n\n\
    ## 示例\n\n```java\nclass MyThread extends Thread {\n    public void run() {\n \
    \       for (int i = 1; i <= 5; i++) {\n            System.out.println(Thread.currentThread().getId()\
    \ + \" - Count: \" + i);\n            try {\n                Thread.sleep(1000);\
    \ // 睡眠 1 秒\n            } catch (InterruptedException e) {\n                System.out.println(e.getMessage());\n\
    \            }\n        }\n    }\n}\n\npublic class ThreadExample {\n    public\
    \ static void main(String[] args) {\n        // 创建两个线程\n        MyThread thread1\
    \ = new MyThread();\n        MyThread thread2 = new MyThread();\n\n        //\
    \ 启动线程\n        thread1.start();\n        thread2.start();\n    }\n}\n```\n\n\
    ### 解析\n\n1. **创建线程类 (MyThread)**\n![](img/image_rsrcA8Y.jpg)`MyThread` 类扩展了 `Thread`\
    \ 类，并重写了 `run()` 方法。`run()` 方法包含了线程启动时执行的代码。\n\n2. **线程执行逻辑**\n![](img/image_rsrcA8Z.jpg)在\
    \ `run()` 方法中，使用循环打印从 1 到 5 的计数，以及当前线程的 ID。\n![](img/image_rsrcA90.jpg)`Thread.sleep(1000)`\
    \ 语句导致线程在每次迭代时睡眠 1 秒，模拟耗时任务。\n\n3. **主类 (ThreadExample)**\n![](img/image_rsrcA91.jpg)`ThreadExample`\
    \ 类是包含 `main()` 方法的主类。\n![](img/image_rsrcA92.jpg)创建了两个 `MyThread` 类实例（`thread1`\
    \ 和 `thread2`）。\n\n4. **启动线程**\n![](img/image_rsrcA93.jpg)对每个线程实例调用 `start()`\
    \ 方法以启动它们的执行。\n![](img/image_rsrcA94.jpg)`start()` 方法在内部新的新的执行线程中调用 `run()` 方法。\n\
    \n5. **输出**\n![](img/image_rsrcA95.jpg)由于线程并发运行，输出可能会有所不同，但通常会显示两个线程计数的交织结果。\n\
    \n"
- fmt: "\nIn summary, Java threads provide a way to achieve concurrent execution in\
    \ a program, allowing multiple tasks to run concurrently. The `Thread` class is\
    \ extended to create custom thread classes, and the `run` method contains the\
    \ code to be executed by the thread. The `start` method is used to initiate the\
    \ execution of a thread. Threads share the same resources but have their own program\
    \ counters, stacks, and registers. Multithreading is commonly used to improve\
    \ the performance of applications that require concurrent processing, such as\
    \ handling multiple user requests or parallelizing computationally intensive tasks.\n\
    \n# JAVA LAMBDA\n\nIn Java, lambda expressions provide a concise way to express\
    \ instances of single-method interfaces (functional interfaces). Lambda expressions\
    \ enhance the readability and flexibility of code, particularly when dealing with\
    \ functional programming concepts.\n\n### 1. Definition\n![](image_rsrcA96.jpg)A\
    \ lambda expression is a concise way to express anonymous functions (functions\
    \ without a name) in Java. It provides a way to represent a block of code that\
    \ can be passed around and executed later.\n\n### 2. Functional Interfaces\n![](image_rsrcA97.jpg)Lambda\
    \ expressions are often used with functional interfaces, which are interfaces\
    \ with a single abstract method. Functional interfaces enable lambda expressions\
    \ to be assigned to them, providing a clear and concise syntax for working with\
    \ single-method interfaces.\n\n### 3. Syntax\n![](image_rsrcA98.jpg)The syntax\
    \ of a lambda expression consists of the parameter list, the arrow `->`, and the\
    \ body. The parameter list represents the input parameters of the method, and\
    \ the arrow separates the parameter list from the body.\n\n### 4. Implicitly Typed\
    \ Parameters\n![](image_rsrcA99.jpg)In many cases, the types of parameters in\
    \ a lambda expression can be inferred by the compiler. This allows developers\
    \ to omit explicit parameter types, making lambda expressions more concise.\n\n\
    ### 5. Functional Interface Compatibility\n![](image_rsrcA9A.jpg)Lambda expressions\
    \ are compatible with functional interfaces. If a lambda expression matches the\
    \ method signature of a functional interface, it can be assigned to a variable\
    \ of that interface type.\n\n### 6. Body of Lambda Expressions\n![](image_rsrcA9B.jpg)The\
    \ body of a lambda expression can be either an expression or a block of code.\
    \ If it's an expression, it implicitly returns a value. If it's a block, it can\
    \ contain multiple statements, and explicit return statements may be used.\n\n\
    ### 7. Capturing Variables\n![](image_rsrcA9C.jpg)Lambda expressions can capture\
    \ variables from their enclosing scope. These variables must be effectively final,\
    \ meaning their values don't change after being captured.\n\n### 8. Compact and\
    \ Readable Syntax\n![](image_rsrcA9D.jpg)Lambda expressions provide a compact\
    \ and readable syntax for expressing behavior in a more functional programming\
    \ style. This is particularly useful when dealing with operations like filtering,\
    \ mapping, and reducing collections.\n\n### 9. Common Use Cases\n![](image_rsrcA9E.jpg)Lambda\
    \ expressions are commonly used in scenarios involving the Streams API, which\
    \ provides a declarative approach to processing collections. They are also used\
    \ in event handling, concurrency, and other situations where concise and expressive\
    \ code is beneficial.\n\n### 10. Java 8 Feature\n![](image_rsrcA9F.jpg)Lambda\
    \ expressions were introduced in Java 8 as part of the effort to enhance support\
    \ for functional programming constructs in the language. They contribute to the\
    \ development of more expressive and modular code.\n\n### 11. Method References\n\
    ![](image_rsrcA9G.jpg)Lambda expressions can be further simplified using method\
    \ references, which are shorthand notations for calling methods. Method references\
    \ provide an alternative, often more readable, syntax for expressing lambda expressions.\n\
    \n### 12. Conciseness and Expressiveness\n![](image_rsrcA9H.jpg)Lambda expressions\
    \ contribute to the conciseness and expressiveness of Java code by reducing boilerplate\
    \ code and allowing developers to focus on the essence of the functionality being\
    \ implemented.\n\nIn summary, Java lambda expressions provide a concise and expressive\
    \ way to represent anonymous functions, particularly in the context of functional\
    \ interfaces. They contribute to the development of more readable and modular\
    \ code, especially in scenarios involving functional programming constructs and\
    \ the Streams API. Lambda expressions are a key feature introduced in Java 8 that\
    \ enhances the language's support for modern programming paradigms.\n\nIn Java,\
    \ lambda expressions provide a concise way to express anonymous functions (also\
    \ known as lambda functions or closures). Lambda expressions simplify the syntax\
    \ required to create instances of functional interfaces (interfaces with a single\
    \ abstract method), which are often used in the context of Java's functional programming\
    \ features.\n\nHere's an example demonstrating the use of a lambda expression:\n\
    \n```java\n// Functional interface with a single abstract method\ninterface MyFunctionalInterface\
    \ {\n    void myMethod(String s);\n}\n\npublic class LambdaExample {\n    public\
    \ static void main(String[] args) {\n        // Using a lambda expression to implement\
    \ the functional interface\n        MyFunctionalInterface myLambda = (s) -> System.out.println(\"\
    Hello, \" + s);\n\n        // Calling the method defined in the functional interface\
    \ using the lambda expression\n        myLambda.myMethod(\"World\");\n    }\n\
    }\n```\n\nExplanation:\n\n1. **Functional Interface (MyFunctionalInterface):**\n\
    ![](image_rsrc9PM.jpg)A functional interface is defined with a single abstract\
    \ method `myMethod`.\n\n2. **Lambda Expression:**\n![](image_rsrc9PM.jpg)The lambda\
    \ expression `(s) -> System.out.println(\"Hello, \" + s)` represents an implementation\
    \ of the `myMethod`.\n![](image_rsrc9PM.jpg)The `(s)` represents the parameter\
    \ of the method, and `System.out.println(\"Hello, \" + s)` is the method body.\n\
    \n3. **Creating an Instance of the Functional Interface:**\n![](image_rsrc9PM.jpg)The\
    \ lambda expression is used to create an instance of the functional interface\
    \ `MyFunctionalInterface` named `myLambda`.\n\n4. **Calling the Lambda Expression:**\n\
    ![](image_rsrc9PM.jpg)The `myLambda` instance is used to call the `myMethod` defined\
    \ in the functional interface, passing the argument `\"World\"`.\n\n5. **Output:**\n\
    ![](image_rsrc9PM.jpg)The output of the program is \"Hello, World\" as the lambda\
    \ expression prints a greeting message.\n\nIn summary, a lambda expression provides\
    \ a concise way to create an instance of a functional interface by directly expressing\
    \ the implementation of its single abstract method. It eliminates the need for\
    \ explicit inner classes, making the code more readable and expressive. Lambda\
    \ expressions are commonly used in the context of functional programming, where\
    \ they can be passed as arguments to methods or stored in variables. They are\
    \ a key feature introduced in Java 8 to support functional programming paradigms.\n\
