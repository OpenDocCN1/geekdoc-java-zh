    \ This block is often referred to as the \"else block.\"\n\n### 4. Exclusive Execution\n\
    \n![](image_rsrc9SH.jpg)Either the true block or the `else` block is executed,\
    \ but not both. The `if...else` statement provides an exclusive choice between\
    \ two alternative paths of execution based on the condition.\n\n### 5. Nesting\n\
    \n![](image_rsrc9SJ.jpg)Multiple `if...else` statements can be nested inside each\
