    \ or equal to (`<=`).\n\n### 3. Logical Operators\n![](image_rsrc9R1.jpg)Logical\
    \ operators perform logical operations on boolean values. The logical AND (`&&`)\
    \ returns true if both operands are true, the logical OR (`||`) returns true if\
    \ at least one operand is true, and the logical NOT (`!`) returns the opposite\
    \ boolean value.\n\n### 4. Assignment Operators\n![](image_rsrc9R2.jpg)Assignment\
    \ operators are used to assign values to variables. The basic assignment operator\
    \ is `=`. Other assignment operators include `+=`, `-=`, `*=`, `/=`, and `%=`\
    \ which perform an operation and assign the result to the variable.\n\n### 5.\
    \ Increment and Decrement Operators\n![](image_rsrc9R3.jpg)Increment (`++`) and\
    \ decrement (`--`) operators are used to increase or decrease the value of a variable\
    \ by 1, respectively. They can be used in prefix or postfix form, affecting the\
    \ order of evaluation.\n\n### 6. Bitwise Operators\n![](image_rsrc9R4.jpg)Bitwise\
    \ operators perform operations at the bit level. Examples include bitwise AND\
    \ (`&`), bitwise OR (`|`), bitwise XOR (`^`), bitwise NOT (`~`), left shift (`<<`),\
    \ and right shift (`>>`).\n\n### 7. Conditional (Ternary) Operator\n![](image_rsrc9R5.jpg)The\
    \ conditional or ternary operator (`? :`) is a shorthand way of expressing an\
    \ if-else statement. It evaluates a boolean expression and returns one of two\
    \ values depending on whether the expression is true or false.\n\n### 8. instanceof\
    \ Operator\n![](image_rsrc9R6.jpg)The `instanceof` operator is used to test whether\
    \ an object is an instance of a particular class or interface. It returns true\
