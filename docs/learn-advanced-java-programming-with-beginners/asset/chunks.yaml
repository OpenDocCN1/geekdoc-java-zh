  trans: "\n\n![](img/image_rsrc9SY.jpg)与某些其他编程语言不同，Java 的 `switch` 语句表现出“贯穿”（fall-through）行为。这意味着如果\
    \ `case` 块不包含 `break` 语句，控制将贯穿到下一个 `case`。开发者应该在执行完目标代码后使用 `break` 语句退出 `switch`\
    \ 块。\n\n### 6. 基本类型与枚举\n\n![](img/image_rsrc9SZ.jpg)switch 语句内的表达式可以是整合类型（`byte`、`short`、`int`、`char`）或枚举类型（`enum`）。这种限制由于\
    \ Java 中 `switch` 语句的实现方式。\n\n### 7. Java 7 之前不支持 String\n\n![](img/image_rsrc9T0.jpg)在\
    \ Java 7 之前，`switch` 语句不支持 `String` 表达式。在处理基于字符串的条件时，开发者必须依赖其他结构，例如一系列 `if...else\
    \ if` 语句。从 Java 7 开始，`switch` 语句支持 `String` 表达式。\n\n### 8. Java 12 和 13 中的增强\n\
    \n![](img/image_rsrc9T1.jpg)Java 12 引入了 `switch` 语句的增强，提供了额外的活性和简洁性。这些增强包括将 `switch`\
    \ 作为表达式使用（允许其返回值），并简化了多个标签的语法。\n\n### 9. 用例\n\n![](img/image_rsrc9T2.jpg)当针对单个表达式有多个可能的值或条件需要检查时，`switch`\
    \ 语句 特别有用。在多个 `if...else if` 语句可能很繁琐的场景下，它有助于提高代码的可读性和可维护性。\n\n### 10. 代码组织\n\n\
    ![](img/image_rsrc9T3.jpg)`switch` 语句允许根据不同的 `case` 组织代码，这使得更容易理解程序的逻辑和流程，特别是在处理大量条件时。\n\
    \n总之，Java 中的 `switch` 语句是根据表达式的值来处理多个条件的的强大工具。它提供了多个 `if...else if` 语句的替代方案，使代码更加简洁易读。\n\
    \n在 Java 中，`switch` 语句是一种控制流语句，它允许程序评估表达式的值并根据匹配的 `case` 标签执行不同的操作。\n\n```java\n\
    public class SwitchExample {\n    public static void main(String[] args) {\n \
    \       int dayOfWeek = 3;\n        String dayName;\n\n        // 使用 switch 确定名称\n\
    \        switch (dayOfWeek) {\n            case 1:\n                dayName =\
    \ \"Monday\"; break;\n            case 2:\n                dayName = \"Tuesday\"\
    ; break;\n            case 3:\n                dayName = \"Wednesday\"; break;\n\
    \            case 4:\n                dayName = \"Thursday\"; break;\n       \
    \     case 5:\n                dayName = \"Friday\"; break;\n            case\
    \ 6:\n                dayName = \"Saturday\"; break;\n            case 7:\n  \
    \              dayName = \"Sunday\"; break;\n            default:\n          \
    \      dayName = \"Invalid day\";\n        }\n\n        // 显示结果\n        System.out.println(\"\
    Day of the week: \" + dayName);\n\n        // 使用 char 的示例\n        char grade\
    \ = 'B';\n        String result;\n        switch (grade) {\n            case 'A':\n\
    \                result = \"Pass\"; break;\n            case 'B':\n          \
    \      result = \"Pass\"; break;\n            case 'C':\n                result\
    \ = \"Partial\"; break;\n            case 'D':\n                result = \"Partial\"\
    ; break;\n            case 'F':\n                result = \"Fail\"; break;\n \
    \           default:\n                result = \"Invalid\";\n        }\n     \
    \   System.out.println(\"Result: \" + result);\n    }\n}\n```\n\n### switch 语句说明：\n\
    \n1. **语法**: ![](img/image_rsrc9PM.jpg)`switch` 语句由 `switch` 关键字后跟表达式组成。\n2. **匹配\
    \ Case**: ![](img/image_rsrc9PM.jpg)表达式匹配 `case` 标签。如果找到匹配项，则执行内部的代码。\n3. **break\
    \ 语句**: ![](img/image_rsrc9PM.jpg)`break` 语句用于退出 `switch`。如果没有它，控制将贯穿。\n4. **default\
    \ Case**: ![](img/image_rsrc9PM.jpg)`default` 情况是可选的，如果没有任何 `case` 匹配，则执行它。\n\
    5. **多个 Case**: ![](img/image_rsrc9PM.jpg)`case` 可以组合在一起共享相同的代码。\n\n当一个变量有多个值时，`switch`\
    \ 语句是一个非常有用的工具。它提供了一系列 `if...else` 语句的替代方案。\n\n# Java While 循环\n\n在 Java 中，`while`\
    \ 循环是一种控制流语句，只要指定的表达式为真，它就会重复执行代码块。\n\n1. **条件评估**: ![](img/image_rsrc9.jpg)`while`\
    \ 循环以 `while` 关键字开始，后面跟着括号内的布尔表达式。\n2. **循环体**: ![](img/image_rsrc9.jpg)`while`\
    \ 循环的体由大括号 `{}` 包围的块组成。\n3. **迭代执行**: ![](img/image_rsrc9.jpg)如果入口条件为真，则执行循环体，然后再次评估入口条件。\n\
    4. **死循环风险**: ![](img/image_rsrc9.jpg)必须确保入口条件最终可以评估为假。否则，`while` 循环可能会导致死循环。\n\
    5. **变量初始化**: 使用 `while` 循环时，在进入循环之前初始化入口条件中使用的任何变量。\n6. **退出条件**: 在循环体内，开发者通常会包含修改入口条件中使用变量值的语句。这确保了随着时间的推移，条件会变为假，允许循环终止。\n\
    7. **灵活的控制流**: `while` 循环是多功能的，可以适用于根据条件重复执行代码块的各种场景。在预先不知道迭代次数的情况下，它特别有用。\n8.\
    \ **预测试循环**: `while` 循环被称为预测试循环，因为在执行循环体之前会先评估条件。如果初始条件为假，则跳过循环体。\n9. **替代循环结构**:\
    \ 除了 `while` 循环外，Java 还提供了其他循环结构，如 `for` 循环和 `do-while` 循环，它们都有自己的特点和用例。\n10.\
    \ **嵌套循环**: `while` 循环可以嵌套在其他循环或控制结构中，允许程序中出现更复杂的重复和决策模式。\n\n"
- fmt: "\nIn summary, the `while` loop in Java is a fundamental construct for creating\
    \ repetitive execution based on a specified condition. It offers flexibility in\
    \ handling scenarios where the number of iterations is determined by the state\
    \ of the program. Careful consideration of the entry condition and proper modification\
    \ of variables inside the loop body are essential to ensure correct and predictable\
    \ behavior.\n\nIn Java, a `while` loop is a control flow statement that repeatedly\
    \ executes a block of code as long as a specified condition is true.\n\n```java\n\
    public class WhileLoopExample {\n    public static void main(String[] args) {\n\
    \        // Example 1: Simple while loop\n        int i = 1;\n        while (i\
    \ <= 5) {\n            System.out.println(\"Iteration \" + i);\n            i++;\n\
    \        }\n\n        // Example 2: Infinite loop with break statement\n     \
    \   int j = 1;\n        while (true) {\n            System.out.println(\"Infinite\
    \ Loop, Iteration \" + j);\n            j++;\n            if (j > 3) {\n     \
    \           break; // Exit the loop after three iterations\n            }\n  \
    \      }\n\n        // Example 3: While loop with user input\n        java.util.Scanner\
    \ scanner = new java.util.Scanner(System.in);\n        System.out.print(\"Enter\
    \ a number (0 to exit): \");\n        int userInput = scanner.nextInt();\n   \
    \     while (userInput != 0) {\n            System.out.println(\"You entered:\
    \ \" + userInput);\n            System.out.print(\"Enter a number (0 to exit):\
    \ \");\n            userInput = scanner.nextInt();\n        }\n        System.out.println(\"\
    Exited the loop. Program complete.\");\n        scanner.close();\n    }\n}\n```\n\
    \n### Explanation of the while loop:\n\n1. **Syntax**:\n![](image_rsrc9PM.jpg)\
    \ The `while` loop starts with the keyword `while`, followed by a boolean expression\
    \ in parentheses. The code block inside the curly braces is executed repeatedly\
    \ as long as the boolean expression is true.\n\n2. **Condition**:\n![](image_rsrc9TF.jpg)\
    \ The loop continues to execute as long as the specified condition evaluates to\
    \ true. If the condition is initially false, the code inside the loop is never\
    \ executed.\n\n3. **Initialization and Update**:\n![](image_rsrc9TF.jpg) It's\
    \ essential to initialize any variables used in the condition before entering\
    \ the loop, and the condition should be updated inside the loop to eventually\
    \ make it false and exit the loop.\n\n4. **Infinite Loop**:\n![](image_rsrc9TF.jpg)\
    \ Care should be taken to avoid infinite loops. In the second example, a `break`\
    \ statement is used to exit the loop after a certain condition is met.\n\n5. **User\
    \ Input Loop**:\n![](image_rsrc9TG.jpg) The third example shows a `while` loop\
    \ that continues to prompt the user for input until they enter 0.\n\nThe `while`\
    \ loop is suitable when the number of iterations is not known beforehand and depends\
    \ on a specific condition. It's important to ensure that the condition eventually\
    \ becomes false to prevent infinite loops. The loop continues to execute as long\
    \ as the condition remains true, making it a flexible construct for repeated execution\
    \ of a block of code.\n\n# Java For Loop\n\nIn Java, the `for` loop is a control\
    \ flow statement that allows a specified block of code to be repeatedly executed\
    \ a certain number of times. It provides a concise and expressive way to perform\
    \ iterative operations.\n\n1. **Initialization**:\n![](image_rsrc9TH.jpg) The\
    \ `for` loop starts with the keyword `for` followed by a set of parentheses. Inside\
    \ the parentheses, the loop's initialization section is specified. This section\
    \ typically includes the initialization of a loop control variable.\n\n2. **Control\
    \ Variable**:\n![](image_rsrc9TJ.jpg) The loop control variable is a variable\
    \ that is used to control the number of iterations. It is initialized in the first\
    \ part of the `for` loop and is often used to keep track of the loop's progress.\n\
    \n3. **Condition**:\n![](image_rsrc9TK.jpg) The second part of the `for` loop's\
    \ parentheses contains the loop continuation condition. This condition is evaluated\
    \ before each iteration, and if it evaluates to true, the loop body is executed.\
