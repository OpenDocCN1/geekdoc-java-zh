    is widely used  in scenarios where the number of iterations is known in advance.


    In Java, a for loop is a control flow statement that allows you to  repeatedly
    execute a block of code for a specific number of  iterations.


    public class ForLoopExample {


    public static void main(String[] args) {


    //  Example  1:  Simple  for  loop for (int i = 1; i <= 5; i++) {


    System.out.println("Iteration " + i);


    }


    // Example 2: Sum of numbers using a for loop int sum = 0;


