    to the ArrayList using the add method.


    3.  Displaying  Elements  using  Enhanced  For  Loop:


    ![](image_rsrcA4E.jpg)An  enhanced  for  loop  is  used  to  iterate  through  the
    ArrayList and display its elements.


    4.  Accessing Elements by Index:


    ![](image_rsrcA4F.jpg)The  get  method  is  used  to  access  and  display  the  element  at
