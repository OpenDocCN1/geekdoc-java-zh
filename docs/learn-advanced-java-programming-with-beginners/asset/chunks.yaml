    ## 1. Vehicle Class (Superclass)


    ![](image_rsrc9PM.jpg)The `Vehicle` class is a parent class with fields `brand`
    and `model`, a constructor to initialize them, and a method `displayInfo` to display
    information about the vehicle.


    ## 2. Car Class (Subclass)


    ![](image_rsrc9PM.jpg)The `Car` class is a child class that inherits from the
    `Vehicle` class using the `extends` keyword.


    ![](image_rsrc9PM.jpg)It has an additional field `year` specific to cars, a constructor
    that calls the superclass constructor using `super(brand, model)`, and an overridden
    `displayInfo` method to include car-specific information.


    ## 3. Inheritance Relationship


    ![](image_rsrc9PM.jpg)The `Car` class inherits the fields and methods of the `Vehicle`
    class. This means that a `Car` object has all the characteristics of a `Vehicle`
    in addition to its specific attributes.


    ## 4. Object Creation and Method Invocation


    ![](image_rsrc9PM.jpg)An object of the `Car` class is created, and the `displayInfo`
    method is called on it. The overridden method in the `Car` class is executed.


    In summary, Java inheritance allows a subclass to inherit attributes and methods
    from a superclass, promoting code reuse and creating a hierarchy of classes. Subclasses
    can extend the functionality of the superclass, override methods, and add new
    fields or methods. Inheritance is a fundamental concept in OOP and plays a crucial
    role in building flexible and modular software systems.


    # Java Polymorphism


    In Java, polymorphism is a fundamental concept in object-oriented programming
    (OOP) that allows objects of different types to be treated as objects of a common
    base type. Polymorphism enables flexibility and adaptability in code design and
    usage.


    ## 1. Definition


    ![](image_rsrcA0S.jpg)Polymorphism is the ability of a single entity, such as
    a method or class, to take on multiple forms. In Java, there are two main types
    of polymorphism: compile-time polymorphism (method overloading) and runtime polymorphism
    (method overriding).


    ## 2. Compile-Time Polymorphism (Static Binding)


    ![](image_rsrcA0T.jpg)Compile-time polymorphism occurs when the method to be invoked
    is determined at compile time. This is achieved through method overloading, where
    multiple methods with the same name but different parameter lists coexist in the
    same class.


    ![](image_rsrcA0U.jpg)The compiler decides which method to call based on the number,
    order, and types of arguments provided during the method call. Overloaded methods
    are resolved at compile time.


    ## 3. Runtime Polymorphism (Dynamic Binding)


    ![](image_rsrcA0V.jpg)Runtime polymorphism occurs when the method to be invoked
    is determined at runtime. This is achieved through method overriding, where a
    subclass provides a specific implementation for a method that is already defined
    in its superclass.


    ![](image_rsrcA0W.jpg)The decision on which method to call is made dynamically
    during program execution, based on the actual type of the object. This flexibility
    allows for substitutability of objects and supports the "is-a" relationship between
    classes.


    ## 4. Method Overloading


    ![](image_rsrcA0X.jpg)Method overloading is a form of compile-time polymorphism
    where multiple methods in the same class have the same name but different parameter
    lists (different types, number, or order of parameters).


    ![](image_rsrcA0Y.jpg)Overloaded methods share the same name, making the code
    more readable and allowing developers to use a single method name for related
    operations with different inputs.


    ## 5. Method Overriding


    ![](image_rsrcA0Z.jpg)Method overriding is a form of runtime polymorphism where
    a subclass provides a specific implementation for a method that is already defined
    in its superclass. The overridden method in the subclass must have the same method
    signature as the method in the superclass.


    ![](image_rsrcA10.jpg)Overriding allows a subclass to provide a specialized implementation
    for a method inherited from its superclass. This is essential for achieving flexibility
    and adaptability in code design.


    ## 6. "IS-A" Relationship


    ![](image_rsrcA11.jpg)Polymorphism in Java is closely tied to the "IS-A" relationship
    between classes. If Class B inherits from Class A, an object of Class B is considered
    to be an object of Class A. This relationship supports polymorphic behavior.


    ## 7. Interface Polymorphism


    ![](image_rsrcA12.jpg)Interface polymorphism allows objects to be treated as instances
    of their interface type. An object that implements an interface can be referred
    to by its interface type, enabling code to work with objects that share a common
    interface.


    ## 8. Abstract Class Polymorphism


    ![](image_rsrcA13.jpg)Abstract classes can also participate in polymorphism. An
    abstract class can define abstract methods that must be implemented by its subclasses,
    enabling a level of polymorphism even without a direct interface.


    ## 9. Dynamic Method Dispatch


    ![](image_rsrcA14.jpg)Dynamic method dispatch is the mechanism by which the correct
    version of an overridden method is called at runtime. The actual type of the object
    is determined at runtime, and the corresponding method in the subclass is invoked.


    ## 10. Flexibility and Extensibility


    ![](image_rsrcA15.jpg)Polymorphism enhances the flexibility and extensibility
    of code by allowing for the inclusion of new classes and methods without modifying
    existing code. This supports the open/closed principle of software design.


    ## 11. Method Signature


    ![](image_rsrcA16.jpg)Polymorphism is based on the method signature, which includes
    the method''s name, return type, and parameter types. The method signature determines
    which method is called during both method overloading and method overriding.


    ## 12. Benefits of Polymorphism


    ![](image_rsrcA17.jpg)Polymorphism promotes code reusability, abstraction, and
    a more natural representation of real-world relationships. It simplifies code
    maintenance and allows for the creation of adaptable and extensible software systems.


    In summary, polymorphism in Java refers to the ability of a method or class to
    take on multiple forms. It provides flexibility in code design, supports the "IS-A"
    relationship between classes, and allows for code that is adaptable to different
    types of objects. Polymorphism is achieved through method overloading (compile-time
    polymorphism) and method overriding (runtime polymorphism).

