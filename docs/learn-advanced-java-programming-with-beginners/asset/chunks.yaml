    \n### 4. 文件操作\n![](img/image_rsrcA9N.jpg)`Files` 类提供了执行常见文件操作的方法，例如创建目录 (`createDirectory()`)、复制文件\
    \ (`copy()`)、移动文件 (`move()`)、删除文件或目录 (`delete()`) 以及检查文件是否存在 (`exists()`)。\n\n\
    ### 5. 读写文件\n![](img/image_rsrcA9P.jpg)`Files` 类提供了读写文件的方法，例如 `readAllBytes()`、`readAllLines()`、`write()`\
    \ 和 `newBufferedWriter()`。\n\n### 6. 文件属性\n![](img/image_rsrcA9R.jpg)`Files` 类和\
    \ `Path` 接口暴露了获取文件属性的方法，例如文件大小、创建时间、最后修改时间以及文件权限。\n\n### 7. 目录流\n![](img/image_rsrcA9S.jpg)`Files`\
    \ 类提供了处理目录流的方法，例如用于遍历目录内容的 `newDirectoryStream()`。\n\n### 8. 符号链接与硬链接\n![](img/image_rsrcA9T.jpg)Java\
    \ 通过 `Files` 类支持符号链接和硬链接。`createSymbolicLink()` 和 `createLink()` 方法分别允许创建符号链接和硬链接。\n\
    \n### 9. 路径规范化\n![](img/image_rsrcA9U.jpg)`Path` 接口的 `normalize()` 方法可通过移除冗余元素来规范路径，例如\
    \ `.`（当前目录）和 `..`（父目录）。\n\n### 10. 文件监控服务\n![](img/image_rsrcA9V.jpg)Java 提供了\
    \ `WatchService` 接口用于监控文件或目录的变化。它允许应用程序接收文件系统事件通知，例如文件的创建、修改或删除。\n\n### 11. 文件权限\n\
    ![](img/image_rsrcA9W.jpg)`Files` 类提供了设置和检查文件权限的方法，例如 `setPosixFilePermissions()`\
    \ 和 `getPosixFilePermissions()`。\n\n### 12. 文件锁定\n![](img/image_rsrcA9X.jpg)Java\
    \ 使用 `FileChannel` 类（它是 `java.nio.channels` 包的一部分）支持文件锁定。文件锁可用于协调多个进程对文件的访问。\n\
    \n### 13. 安全考量\n![](img/image_rsrcA9Y.jpg)在处理文件时，考虑安全因素非常重要，例如处理文件权限、验证用户输入以防止路径遍历攻击，以及避免硬编码的绝对路径。\n\
    \n### 14. 异常处理\n![](img/image_rsrcA9Z.jpg)Java 中的许多文件操作可能会抛出受检异常，如 `IOException`。适当的异常处理对于解决潜在问题（如找不到文件或权限不足）至关重要。\n\
    \n总之，Java 中的 `java.nio.file` 包提供了一套强大且灵活的类和方法用于处理文件和目录。无论是读写文件、操作路径还是监控文件系统事件，Java\
