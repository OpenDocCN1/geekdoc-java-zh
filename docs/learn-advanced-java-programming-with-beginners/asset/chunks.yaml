    \ 和模 (`%`)。模返回除法运算的余数。\n\n### 2. 关系运算符\n![](img/image_rsrc9R0.jpg)关系运算符用于比较值。常见的关系运算符包括等于\
    \ (`==`)、不等于 (`!=`)、大于 (`>`)、小于 (`<`)、大于等于 (`>=`) 和小于等于 (`<=`)。\n\n### 3. 逻辑运算符\n\
