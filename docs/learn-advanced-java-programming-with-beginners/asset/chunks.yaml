    \ 的对象，并调用了它的 `displayMessage` 方法。\n\n总结来说，Java 中的包用于将类组织成模块化和层次化的结构，减少了命名冲突并提供了更好的组织方式。`Java\
    \ API` 是预构建的类和接口的集合，为开发者提供了常用功能。导入语句用于包含除当前包之外的包中的类，允许代码访问 `Java API` 或其他自定义包提供的特性。\n\
    \n# Java 继承\n\n在 `Java` 中，继承是面向对象编程 (OOP) 的基本概念，它允许一个类继承另一个类的属性和行为（字段和方法）。\n\n\
    ### 1. 定义\n![](img/image_rsrcA09.jpg)继承是一种机制，允许新类（`subclass` 或派生类）从现有类（`superclass`\
    \ 或基类）继承属性和行为。新类随后可以扩展或专门化现有类的功能。\n\n### 2. 父类和子类\n![](img/image_rsrcA0A.jpg)继承属性和行为的现有类被称为\
    \ `superclass`。继承自 `superclass` 的新类被称为 `subclass`。子类被认为“扩展”了或“派生自” `superclass`。\n\
    \n### 3. 代码重用性\n![](img/image_rsrcA0B.jpg)继承通过允许重用在 `superclass` 中定义的字段和方法来促进代码的重用。这减少了冗余并支持“不要重复自己”(DRY)\
    \ 原则。\n\n### 4. “是一个”关系\n![](img/image_rsrcA0C.jpg)继承模拟了类之间的“是是”（is-a）关系。如果 `Class\
    \ B` 继承自 `Class A`，那么可以说“B 是 A 的类型”。这种关系增强了代码的清晰性并反映了现实世界的关系。\n\n### 5. 字段继承\n\
    ![](img/image_rsrcA0D.jpg)子类从 `superclass` 继承字段（属性）。这意味着子类自动拥有 `superclass` 的字段，而无需重新定义它们。\n\
    \n### 6. 方法继承\n![](img/image_rsrcA0E.jpg)子类从 `superclass` 继承方法。它们可以直接使用这些方法，也可以重写它们以提供专门的实现，或者引入新方法。\n\
    \n### 7. 访问修饰符\n![](img/image_rsrcA0F.jpg)访问修饰符（例如 `public`、`protected`、`private`\
    \ 或包私有）会影响继承成员的可见性。例如，`superclass` 中的 `private` 字段在子类中无法直接访问。\n\n### 8. 方法重写\n\
    ![](img/image_rsrcA0G.jpg)子类可以重写（重新定义）从 `superclass` 继承的方法。方法重写允许子类在保持方法签名相同的同时，提供该自己的方法实现。\n\
    \n### 9. 方法重载\n![](img/image_rsrcA0H.jpg)子类中的方法重载（具有相同名称但不同参数列表的方法方法）被视为重写。子类中的重载不会替换或覆盖\
    \ `superclass` 的方法。\n\n### 10. 继承构造函数\n![](img/image_rsrcA0J.jpg)构造函数不被继承，但它们在创建子类对象的过程中会被调用。子类可以使用\
    \ `super()` 关键字调用 `superclass` 的构造函数。\n\n### 11. 多重继承\n![](img/image_rsrcA0K.jpg)Java\
    \ 支持单继承，这意味着一个类只能继承一个 `superclass`。这避免了歧义。\n\n### 12. 抽象类和接口\n![](img/image_rsrcA0M.jpg)抽象类和接口用于为类定义通用结构。抽象类可以部分实现，而接口定义约定。\n\
    \n### 13. Final 类和方法\n![](img/image_rsrcA0N.jpg)`final` 关键字可以防止类被扩展（`final class`）或方法被重写（`final\
    \ method`）。\n\n### 14. 多态\n![](img/image_rsrcA0P.jpg)继承与多态密切相关。多态允许不同类的对象被视为公共基类型的对象，增加了代码设计的灵活性。\n\
    \n### 15. 面向对象设计\n![](img/image_rsrcA0R.jpg)继承是面向对象设计的核心组件。它允许层次结构的创建。\n\n总结来说，Java\
    \ 继承是一种允许新类从现有类继承属性和行为的机制，促进了代码重用、关系建模并支持 OOP 原则。“是一个”关系、代码清晰度和多态都是继承在 `Java`\
    \ 中的优点。\n\n```java\n// 父类 (superclass)\nclass Vehicle {\n    // 字段（at 属性）\n  \
    \  String brand;\n    String model;\n\n    // 构造函数\n    public Vehicle(String\
    \ brand, String model) {\n        this.brand = brand;\n        this.model = model;\n\
    \    }\n\n    // 显示车辆信息\n    public void displayInfo() {\n        System.out.println(\"\
    Vehicle: \" + brand + \" \" + model);\n    }\n}\n\n// 继承自 Vehicle 的子类 (subclass)\n\
    class Car extends Vehicle {\n    // Car 特有的字段\n    int year;\n\n    // Car 的构造函数\n\
    \    public Car(String brand, String model, int year) {\n        // 调用父类 (Vehicle)\
    \ 的构造函数\n        super(brand, model);\n        this.year = year;\n    }\n\n  \
    \  // 重写方法以包含 Car 特有的信息\n    @Override\n    public void displayInfo() {\n    \
    \    super.displayInfo(); // 调用父类的 displayInfo 方法\n        System.out.println(\"\
    Year: \" + year);\n    }\n}\n\npublic class InheritanceExample {\n    public static\
    \ void main(String[] args) {\n        // 创建 Car 类的对象\n        Car myCar = new\
    \ Car(\"Toyota\", \"Camry\", 2022);\n\n        // 调用 Car 类的 displayInfo 方法\n \
    \       myCar.displayInfo();\n    }\n}\n```\n"
