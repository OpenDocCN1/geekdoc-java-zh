    \ type safety, and the class provides various methods for manipulating and accessing\
    \ elements.\n\nIn Java, `ArrayList` is a part of the `java.util` package and provides\
    \ a dynamic array implementation, allowing you to store and manipulate a resizable\
    \ list of elements. Unlike regular arrays, `ArrayList` can dynamically grow or\
    \ shrink in size during runtime. Here's an example of using `ArrayList`:\n\n```java\n\
    import java.util.ArrayList;\n\npublic class ArrayListExample {\n    public static\
    \ void main(String[] args) {\n        // Creating an ArrayList of Strings\n  \
    \      ArrayList<String> fruits = new ArrayList<>();\n\n        // Adding elements\
    \ to the ArrayList\n        fruits.add(\"Apple\");\n        fruits.add(\"Banana\"\
    );\n        fruits.add(\"Orange\");\n        fruits.add(\"Grapes\");\n\n     \
    \   // Displaying the elements using enhanced for loop\n        System.out.println(\"\
    Fruits in the ArrayList:\");\n        for (String fruit : fruits) {\n        \
    \    System.out.println(fruit);\n        }\n\n        // Accessing elements by\
    \ index\n        System.out.println(\"\\nElement at index 1: \" + fruits.get(1));\n\
    \n        // Checking if the ArrayList contains a specific element\n        String\
    \ searchFruit = \"Banana\";\n        System.out.println(\"\\nDoes the ArrayList\
    \ contain \" + searchFruit + \"? \" + fruits.contains(searchFruit));\n\n     \
    \   // Removing an element by value\n        fruits.remove(\"Orange\");\n\n  \
    \      // Displaying the updated ArrayList\n        System.out.println(\"\\nFruits\
    \ after removing 'Orange':\");\n        for (String fruit : fruits) {\n      \
    \      System.out.println(fruit);\n        }\n\n        // Checking the size of\
    \ the ArrayList\n        System.out.println(\"\\nSize of the ArrayList: \" + fruits.size());\n\
    \n        // Clearing all elements from the ArrayList\n        fruits.clear();\n\
    \n        // Displaying the ArrayList after clearing\n        System.out.println(\"\
    \\nFruits after clearing the ArrayList:\");\n        for (String fruit : fruits)\
    \ {\n            System.out.println(fruit);\n        }\n    }\n}\n```\n\n### Explanation:\n\
    \n1. **Creating an ArrayList (`fruits`):**\n![](image_rsrcA4C.jpg)An `ArrayList`\
