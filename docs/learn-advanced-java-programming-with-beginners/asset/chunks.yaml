    # Java 方法 (Methods)


    在 Java 中，方法是执行特定任务的代码块，并且可以通过名称从程序的其他部分调用。方法提供了一种结构化和组织代码的方式，促进了代码复用，并提高了 Java
    程序的可读性和可维护性。


    ## 1. 声明和定义


    ![](img/image_rsrc9UP.jpg)使用 `method` 关键字声明并定义方法，随后是方法的返回类型、名称、括号以及封装在花括号 `{}`
    中的代码块。返回类型指定了方法返回的值类型，或者如果方法不返回任何值，则指示 `void`。


    ## 2. 方法签名 (Method Signature)


    ![](img/image_rsrc9UR.jpg)方法名及其参数列表的组合被称为方法签名。它在类中唯一标识该方法。返回类型不被视为方法签名的一部分。


    ## 3. 参数 (Parameters)


    ![](img/image_rsrc9US.jpg)方法可以接受参数，参数是在调用方法时传递给方法的值。参数指定在方法签名的括号内。方法调用期间提供的值称为参数（arguments）。


    ## 4. 返回类型 (Return Type)


    ![](img/image_rsrc9UT.jpg)方法的返回类型指示方法产生的值类型。如果方法不返回任何值，则返回类型指定为 `void`。具有 `void`
    以外返回类型的方法必须使用 `return` 语句返回指定类型的值。


    ## 5. 方法调用 (Method Call)


    ![](img/image_rsrc9UU.jpg)要执行方法中的代码，必须从程序的其他部分调用该方法。方法调用由方法名以及包含任何所需参数的括号组成。


    ## 访问修饰符 (Access Modifiers)


    ![](img/image_rsrc9UV.jpg)方法可以拥有访问修饰符，如 `public`、`private` 或 `protected`，用于控制方法的可见性。缺少访问修饰符意味着包私有（package-private）。


    ## 7. 静态方法 (Static and Instance Methods)


    ![](img/image_rsrc9UW.jpg)方法可以是 `static` 方法或实例方法。`static` 方法属于类而不是实例。实例方法在实例上操作。


    ## 8. 方法重载 (Method Overloading)


    ![](img/image_rsrc9UX.jpg)Java 支持方法重载，允许方法具有相同名称但不同的参数列表。重载方法为带有不同参数的方法提供了灵活性。


    ## 9. 递归 (Recursion)


    ![](img/image_rsrc9UY.jpg)方法可以调用自己，这种概念被称为递归。递归方法可以解决可以分解为更小问题的。


    ## 10. Java 标准库方法 (Standard Library Methods)


    ![](img/image_rsrc9UZ.jpg)Java 带有丰富的标准库方法，由 `Math`、`String` 等类提供。这些方法可以在任何 Java
    程序中调用，无需显式的导入语句。


    ## 11. 封装 (Encapsulation)


    ![](img/image_rsrc9V0.jpg)方法通过允许隐藏实现细节有助于封装。方法可以用于向外部暴露必要的功能，保护对象的内部状态。


    ## 12. 代码复用 (Code Reusability)


    ![](img/image_rsrc9V1.jpg)方法通过允许从程序的不同部分调用同一个代码块来促进代码复用。这减少了冗余并提高了代码的可维护性。


