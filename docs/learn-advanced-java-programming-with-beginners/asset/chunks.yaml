    \ 在至少一个操作数为真时返回真，而逻辑非 (`!`) 返回相反的布尔值。\n\n### 4. 赋值运算符\n![](img/image_rsrc9R2.jpg)赋值运算符用于给变量赋值。基础赋值运算符是\
    \ `=`。其他赋值运算符包括 `+=`、`-=`、`*=`、`/=` 和 `%=`，它们会执行某种操作并将结果赋值给变量。\n\n### 5. 递增和递减运算符\n\
    ![](img/image_rsrc9R3.jpg)递增 (`++`) 和递减 (`--`) 运算符分别用于增加或减少变量的值。它们可以以前缀或后置形式使用，影响求值顺序。\n\
    \n### 6. 位运算符\n![](img/image_rsrc9R4.jpg)位运算符在位层级上执行操作。示例包括按位与 (`&`)、按位或 (`|`)、按位异或\
