    that require objects. The process of converting a  primitive type to its corresponding
    wrapper class is called  autoboxing,  and  the  reverse  process  is  called  unboxing.  Autoboxing
    and unboxing are performed automatically by the Java compiler when needed. Wrapper
    classes are commonly  used  in  scenarios  where  objects  are  required,  such  as  collections
    and generic types.


    # Java  Exceptions


    In Java, exceptions are events that occur during the execution of a  program that
    disrupts the normal flow of instructions. Exception  handling  is  a  mechanism  provided  by  Java  to  deal  with  these  unexpected
    situations.


    1.  Types  of  Exceptions:


    ![](image_rsrcA7F.jpg)Exceptions in Java are divided into two main categories:


    ![](image_rsrcA7G.jpg)Checked Exceptions: These are exceptions that are checked
    at compile-time. Programmers are required to either handle these exceptions using
    try-catch blocks or declare that they may  throw these exceptions using the throws
    clause.


    ![](image_rsrcA7H.jpg)Unchecked  Exceptions  (Runtime  Exceptions):  These  are  exceptions
    that are not checked at compile-time. They usually occur  due  to  programming  errors  or  unexpected  runtime  conditions.


    2.  Exception  Hierarchy:


    ![](image_rsrcA7J.jpg)All exception classes in Java are subclasses of either the
    Exception class  or  the  RuntimeException  class.  The  Exception  class  represents
    checked exceptions, and the RuntimeException class  represents unchecked exceptions.


    3.  try,  catch,  and  finally  Blocks:


    ![](image_rsrcA7K.jpg)Exception handling is typically done using try-catch blocks.
    The try block  contains  the  code  that  may  throw  an  exception.  If  an exception
    occurs, it is caught by the corresponding catch block.  The finally block, if
    present, is executed whether an exception  occurs or not.


    4.  Throwing  Exceptions:


    ![](image_rsrcA7M.jpg)In addition to catching exceptions, Java allows the programmer
    to explicitly throw exceptions using the throw keyword. This is useful when  a  method  encounters  an  error  condition  and  wants  to
    indicate the problem.


    5.  Exception  Propagation:


    ![](image_rsrcA7N.jpg)When an exception is thrown inside a method and not caught,
    it  propagates up the call stack. This means that the method that  called the
    current method is given an opportunity to catch the  exception.


    6.  throws Clause:


    ![](image_rsrcA7P.jpg)When a method might throw a checked exception, it must either
    handle  the exception using a try-catch block or declare the exception in its  method
    signature using the throws clause. This informs the calling code  that it needs
    to handle or declare the exception.


    7.  try-with-resources Statement:


    ![](image_rsrcA7R.jpg)In Java, the try-with-resources statement is used to automatically
    close  resources such as files, sockets, or database connections when they are  no
    longer needed. This is achieved by implementing the AutoCloseable interface.


    8.  Custom Exceptions:


    ![](image_rsrcA7S.jpg)Java allows programmers to create their own exception classes
    by  extending existing exception classes. This is useful when a program  encounters  specific  error  conditions  that  are  not  adequately  represented
    by standard exceptions.


    9.  Handling Unchecked Exceptions:


    ![](image_rsrcA7T.jpg)While it''s not mandatory to catch unchecked exceptions,
    it is good  practice to handle or at least log them appropriately. Unhandled  exceptions
    can lead to abnormal program termination.


    10.  RuntimeException Subtypes:


    ![](image_rsrcA7U.jpg)Common  subclasses  of  RuntimeException  include NullPointerException,              ArrayIndexOutOfBoundsException,  ArithmeticException,
    and others. These exceptions typically indicate  programming errors or runtime
    conditions that may not be recoverable.


    11.  Checked Exception Examples:


    ![](image_rsrcA7V.jpg)Examples of checked exceptions include IOException, SQLException,  and  ClassNotFoundException.  These  exceptions  are  checked  at  compile-time,
    and the compiler enforces handling or declaration of  such exceptions.


    12.  Unchecked Exception Examples:


    ![](image_rsrcA7W.jpg)Examples  of  unchecked  exceptions  include  NullPointerException,  ArrayIndexOutOfBoundsException,  and  ArithmeticException.  These
    exceptions are not checked at compile-time and often result from  errors in the
    logic of the program.


    In summary, exceptions in Java are events that disrupt the normal flow of program
    execution. They can be categorized into checked and unchecked exceptions. Exception
    handling in Java involves using try-catch blocks,  declaring exceptions with the
    throws clause, and handling resources with the try-with-resources statement. Custom
    exceptions can be created, and unchecked exceptions are often indicative of programming
    errors. Handling  exceptions is an essential part of writing robust and reliable
    Java programs.


