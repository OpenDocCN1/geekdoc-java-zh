    Double wrappedDouble = Double.valueOf(primitiveDouble);  Character wrappedChar
    = Character.valueOf(primitiveChar);  Boolean  wrappedBoolean  =  Boolean.valueOf(primitiveBoolean);


    // Displaying values


    System.out.println("Primitive int: " + primitiveInt);  System.out.println("Wrapped
    Integer: " + wrappedInt);


    System.out.println("\nPrimitive double: " + primitiveDouble); System.out.println("Wrapped
