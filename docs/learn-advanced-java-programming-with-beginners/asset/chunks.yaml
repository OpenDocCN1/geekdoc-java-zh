    \   ![](img/image_rsrc9WU.jpg)类是 Java 中创建对象的蓝图或模板。它定义了一组刻画该类对象的属性（字段或属性变量）和行为（方法）。\n\
    \n2. **对象**：\n   ![](img/image_rsrc9WV.jpg)对象是类的实例。它代表一个具有类定义的特征和行为的现实世界实体。对象是根据类提供的结构创建的。\n\
    \n3. **属性（字段/属性）**：\n   ![](img/image_rsrc9WW.jpg)属性是类的数据成员，也称为字段或属性。它们代表对象的状态或特征。从类创建的每个对象都有自己的一组属性值。\n\
    \n4. **行为（方法）**：\n   ![](img/image_rsrc9WX.jpg)行为是在类内部定义的方法或函数。它们代表类对象可以执行的操作或动作。方法可以与对象的属性进行交互。\n\
    \n5. **封装**：\n   ![](img/image_rsrc9WY.jpg)封装是 OOP 的核心原则之一。它将数据（属性）和操作数据的方法封装在单个单元（类）中。这有助于隐藏内部实现细节并只暴露必要的内容。\n\
    \n6. **构造函数**：\n   ![](img/image_rsrc9WZ.jpg)构造函数是类中的特殊方法，用于在创建对象时初始化对象的状态。构造函数的名称与类相同，且没有返回类型。\n\
    \n7. **实例化**：\n   ![](img/image_rsrc9X0.jpg)实例化是从类创建对象的过程。它包括为对象分配内存、初始化其属性（使用构造函数）并获取新对象的引用。\n\
    \n8. **类成员**：\n   ![](img/image_rsrc9X1.jpg)类成员包括静态成员和实例成员。静态成员属于类本身，并在所有实例之间共享。实例成员属于特定的对象。\n\
    \n9. **继承**：\n   ![](img/image_rsrc9X2.jpg)继承是另一个 OOP 概念，允许类（子类或子类）从另一个类（父类或基类）继承属性和行为。这促进了代码复用并支持“是一个”关系。\n\
    \n10. **多态**：\n    ![](img/image_rsrc9X3.jpg)多态通过方法重写允许不同的类被视为共同基类的对象。\n\n11.\
    \ **抽象**：\n    ![](img/image_rsrc9X4.jpg)抽象是通过关注对象做什么而不是如何做来简化系统的过程。\n\n12. **模块化**：\n\
    \    ![](img/image_rsrc9X5.jpg)OOP 通过组织类来促进模块化，使其更容易理解和扩展。\n\n"
- fmt: "\nIn summary, a class defines a blueprint for creating objects with specific\
    \ attributes and behaviors. Objects are instances of classes, and they encapsulate\
    \ data and behavior. The concept of classes and objects is fundamental to Object-Oriented\
    \ Programming (OOP), providing a way to model and organize code based on real-world\
    \ entities.\n\n# Java Class Attributes\n\nIn Java, class attributes, also known\
    \ as fields or properties, are variables that are declared within a class and\
    \ define the state or characteristics of objects created from that class.\n\n\
    1. **Definition**:\n![](image_rsrc9X6.jpg)Class attributes are variables that\
    \ belong to a class. They represent the data or state associated with objects\
    \ created from that class. Each object of the class has its own set of attribute\
    \ values.\n\n2. **State of Objects**:\n![](image_rsrc9X7.jpg)Attributes define\
    \ the state of objects. They represent the information or characteristics that\
    \ describe the object's identity or current condition.\n\n3. **Data Members**:\n\
    ![](image_rsrc9X8.jpg)Class attributes are also referred to as data members. They\
    \ hold data associated with the objects and determine the properties of instances\
    \ of the class.\n\n4. **Declaration**:\n![](image_rsrc9X9.jpg)Attributes are declared\
    \ within the class body but outside of any methods. They are typically specified\
    \ with an access modifier (e.g., `public`, `private`, `protected`, or package-private)\
    \ to control their visibility.\n\n5. **Accessibility**:\n![](image_rsrc9XA.jpg)The\
    \ access modifiers define the visibility and accessibility of class attributes.\
    \ For example, using `private` ensures that the attribute is only accessible within\
    \ the class, promoting encapsulation.\n\n6. **Data Types**:\n![](image_rsrc9XB.jpg)Attributes\
    \ have specific data types that define the kind of data they can store. Common\
    \ data types include primitives (e.g., `int`, `double`) and objects (e.g., custom\
    \ classes, `String`).\n\n7. **Initialization**:\n![](image_rsrc9XC.jpg)Class attributes\
    \ can be initialized at the time of declaration or within a constructor. Initialization\
    \ sets the initial values for the attributes when an object is created.\n\n8.\
    \ **Default Values**:\n![](image_rsrc9XD.jpg)If an attribute is not explicitly\
    \ initialized, Java assigns a default value based on its data type. For example,\
    \ numeric types have a default value of `0`, and object references have a default\
    \ value of `null`.\n\n9. **Instance vs. Static Attributes**:\n![](image_rsrc9XE.jpg)Class\
    \ attributes can be either instance (non-static) or static. Instance attributes\
    \ have a separate copy for each object, while static attributes are shared among\
    \ all objects of the class.\n\n10. **Encapsulation**:\n![](image_rsrc9XF.jpg)Attributes\
    \ contribute to encapsulation by allowing the class to control access to its internal\
    \ state. Encapsulation protects the integrity of the object's data by restricting\
    \ direct access and modification.\n\n11. **Accessor and Mutator Methods**:\n![](image_rsrc9XG.jpg)To\
    \ interact with private attributes, accessor (getter) and mutator (setter) methods\
    \ are often provided. Accessor methods retrieve the value of an attribute, and\
    \ mutator methods modify its value.\n\n12. **Relationship with Methods**:\n![](image_rsrc9XH.jpg)Attributes\
    \ are closely related to methods within a class. Methods operate on the data stored\
    \ in the attributes, providing behaviors that define the functionality of the\
    \ class.\n\nIn summary, class attributes in Java define the state or characteristics\
    \ of objects created from a class. They play a crucial role in modeling the data\
    \ associated with objects and contribute to the overall structure and behavior\
    \ of a class. Attributes are declared within the class and are accessible to methods\
    \ within that class.\n\nIn Java, class attributes are variables that are associated\
    \ with a class rather than with instances of that class (objects). These attributes\
    \ are also known as class variables or static variables. Class attributes are\
    \ shared among all instances of a class. Here's an example to illustrate Java\
    \ class attributes:\n\n```java\npublic class ClassAttributesExample {\n    //\
    \ Class attribute (static variable)\n    static int numberOfCars = 0;\n\n    //\
    \ Instance variables\n    String brand;\n    String model;\n    int year;\n\n\
    \    // Constructor to initialize instance variables\n    public ClassAttributesExample(String\
    \ brand, String model, int year) {\n        this.brand = brand;\n        this.model\
    \ = model;\n        this.year = year;\n        // Increment the class attribute\
    \ (shared among all instances)\n        numberOfCars++;\n    }\n\n    // Method\
    \ to display information about the car\n    public void displayInfo() {\n    \
    \    System.out.println(\"Car: \" + brand + \" \" + model + \" (\" + year + \"\
    )\");\n    }\n\n    // Method to display the total number of cars\n    public\
    \ static void displayTotalCars() {\n        System.out.println(\"Total number\
    \ of cars: \" + numberOfCars);\n    }\n\n    public static void main(String[]\
    \ args) {\n        // Creating objects of the class\n        ClassAttributesExample\
    \ car1 = new ClassAttributesExample(\"Toyota\", \"Camry\", 2022);\n        ClassAttributesExample\
    \ car2 = new ClassAttributesExample(\"Honda\", \"Accord\", 2023);\n\n        //\
    \ Accessing and modifying class attribute through an object\n        System.out.println(\"\
    Number of cars: \" + car1.numberOfCars);\n    }\n}\n```\n\nExplanation:\n\n1.\
    \ **Class Attribute (`numberOfCars`)**:\n![](image_rsrc9PM.jpg)The `numberOfCars`\
    \ variable is a class attribute declared with the `static` keyword. It is shared\
    \ among instances.\n\n2. **Instance Variables (`brand`, `model`, `year`)**:\n\
    ![](image_rsrc9TF.jpg)These are non-static variables associated with each instance\
    \ of the class. They represent individual characteristics of each car.\n\n3. **Constructor**:\n\
    ![](image_rsrc9TG.jpg)The constructor is responsible for initializing instance\
    \ variables and incrementing the class attribute (`numberOfCars`) whenever a new\
    \ object is created.\n\n4. **Accessing Class Attribute**:\n![](image_rsrc9PG.jpg)The\
    \ class attribute can be accessed through an object (`car1.numberOfCars`) or directly\
    \ through the class (`ClassAttributesExample.numberOfCars`).\n\n5. **Static Method\
    \ (`displayTotalCars`)**:\n![](image_rsrc9PG.jpg)The `displayTotalCars` method\
    \ is a static method that can be called without creating an instance of the class.\
    \ It displays the total number of cars.\n"
