    In Java, a while loop is a control flow statement that repeatedly executes a block
    of code as long as a specified condition is true.


    public class WhileLoopExample {


    public static void main(String[] args) {


    //  Example  1:  Simple  while  loop int i = 1;


    while (i <= 5) {  System.out.println("Iteration  "  +  i); i++;


    }


    //  Example  2:  Infinite  loop  with  break  statement int j = 1;


    while (true) {


    System.out.println("Infinite Loop, Iteration " + j); j++;


    if (j > 3) {


    break; // Exit the loop after three iterations


    }


    }


    // Example 3: While loop with user input


    java.util.Scanner  scanner  =  new  java.util.Scanner(System.in);  System.out.print("Enter
    a number (0 to exit): ");


    int userInput = scanner.nextInt();


    while (userInput != 0) {


    System.out.println("You entered: " + userInput); System.out.print("Enter a number
    (0 to exit): ");  userInput = scanner.nextInt();


    }


    System.out.println("Exited the loop. Program complete."); scanner.close();


    }


    }


    Explanation of the while loop:


    1.      Syntax:


    ![](image_rsrc9PM.jpg)The while loop starts with the keyword while, followed by
    a  boolean expression in parentheses. The code block inside the curly braces is
    executed repeatedly as long as the  boolean expression is true.


    2.      Condition:


    ![](image_rsrc9TF.jpg)The loop continues to execute as long as the specified  condition
    evaluates to true. If the condition is initially  false, the code inside the loop
    is never executed.


    3.  Initialization and Update:


    ![](image_rsrc9TF.jpg)It''s  essential  to  initialize  any  variables  used  in  the  condition
    before entering the loop, and the condition  should be updated inside the loop
    to eventually make it  false and exit the loop.


    4.  Infinite Loop:


    ![](image_rsrc9TF.jpg)Care should be taken to avoid infinite loops. In the second
    example, a break statement is used to exit the loop after a certain condition
    is met.


    5.  User Input Loop:


    ![](image_rsrc9TG.jpg)The third example shows a while loop that continues to  prompt
    the user for input until they enter 0.


    The while loop is suitable when the number of iterations is not  known beforehand
    and depends on a specific condition. It''s  important to ensure that the condition
    eventually becomes false to prevent infinite loops. The loop continues to execute
    as long as the condition remains true, making it a flexible construct for  repeated
    execution of a block of code.


