- fmt: "\nIn Java, `HashSet` is a class that implements the `Set` interface and is\
    \ part of the `java.util` package. It represents an unordered collection of unique\
    \ elements, where duplicate elements are not allowed. `HashSet` is based on the\
    \ hash table data structure, which provides constant-time average complexity for\
    \ basic operations such as `add`, `remove`, `contains`, and `size`. Here's an\
    \ example of using `HashSet`:\n\n```java\nimport java.util.HashSet;\nimport java.util.Iterator;\n\
    import java.util.Set;\n\npublic class HashSetExample {\n    public static void\
    \ main(String[] args) {\n        // Creating a HashSet of Strings\n        Set<String>\
    \ uniqueColors = new HashSet<>();\n\n        // Adding elements to the HashSet\
    \ uniqueColors\n        uniqueColors.add(\"Red\");\n        uniqueColors.add(\"\
    Green\");\n        uniqueColors.add(\"Blue\");\n\n        uniqueColors.add(\"\
    Red\"); // Duplicate element (ignored)\n\n        // Displaying the elements using\
    \ an iterator\n        System.out.println(\"Colors in the HashSet:\");\n     \
    \   Iterator<String> iterator = uniqueColors.iterator();\n        while (iterator.hasNext())\
    \ {\n            System.out.println(iterator.next());\n        }\n\n        //\
    \ Checking if the HashSet contains a specific element\n        String searchColor\
    \ = \"Green\";\n        System.out.println(\"\\nDoes the HashSet contain \" +\
    \ searchColor + \"? \" + uniqueColors.contains(searchColor));\n\n        // Removing\
    \ an element from the HashSet\n        String colorToRemove = \"Blue\";\n    \
    \    uniqueColors.remove(colorToRemove);\n\n        // Displaying the updated\
    \ HashSet\n        System.out.println(\"\\nColors after removing \" + colorToRemove\
    \ + \":\");\n        for (String color : uniqueColors) {\n            System.out.println(color);\n\
    \        }\n\n        // Checking the size of the HashSet\n        System.out.println(\"\
    \\nSize of the HashSet: \" + uniqueColors.size());\n\n        // Clearing all\
    \ elements from the HashSet\n        uniqueColors.clear();\n\n        // Displaying\
    \ the HashSet after clearing\n        System.out.println(\"\\nColors after clearing\
    \ the HashSet:\");\n        for (String color : uniqueColors) {\n            System.out.println(color);\n\
    \        }\n    }\n}\n```\n\n### Explanation:\n\n1. **Creating a HashSet (`uniqueColors`):**\n\
    ![](image_rsrc9PM.jpg)A `HashSet` is created to store strings (`String`).\n\n\
    2. **Adding Elements to the HashSet:**\n![](image_rsrc9PM.jpg)Elements (\"Red,\"\
    \ \"Green,\" \"Blue\") are added to the `HashSet` using the `add` method.\n\\\n\
    ![](image_rsrc9PM.jpg)The attempt to add a duplicate element (`\"Red\"`) is ignored,\
    \ as `HashSet` does not allow duplicates.\n\n3. **Displaying Elements using Iterator:**\n\
    ![](image_rsrc9PM.jpg)An `iterator` is used to iterate through the `HashSet` and\
    \ display its elements.\n\n4. **Checking if HashSet Contains a Specific Element:**\n\
    ![](image_rsrc9PM.jpg)The `contains` method is used to check if the `HashSet`\
    \ contains a specific element (`\"Green\"`).\n\n5. **Removing an Element from\
    \ the HashSet:**\n![](image_rsrc9PM.jpg)The `remove` method is used to remove\
    \ a specific element (`\"Blue\"`) from the `HashSet`.\n\n6. **Displaying Updated\
    \ HashSet:**\n![](image_rsrc9PM.jpg)The `HashSet` is displayed after removing\
    \ an element.\n\n7. **Checking the Size of the HashSet:**\n![](image_rsrc9PM.jpg)The\
    \ `size` method is used to get the size (number of elements) of the `HashSet`.\n\
    \n8. **Clearing the HashSet:**\n![](image_rsrc9PM.jpg)The `clear` method is used\
    \ to remove all elements from the `HashSet`.\n\n9. **Displaying the HashSet after\
    \ Clearing:**\n![](image_rsrc9PM.jpg)The `HashSet` is displayed after clearing,\
    \ and it should be empty.\n\nIn summary, `HashSet` is a widely used implementation\
    \ of the `Set` interface, providing efficient storage and retrieval of unique\
    \ elements.\n\n---\n\n# Java Iterator\n\nAn `Iterator` is an interface in the\
    \ `java.util` package used to traverse elements of a collection.\n\n### 1. Traversal\
    \ of Collections\n![](image_rsrc9PM.jpg)The primary purpose of `Iterator` is to\
    \ traverse a collection.\n\n### 2. Interface in java.util\n![](image_rsrc9PM.jpg)The\
    \ `Iterator` interface is part of the Java Collections Framework.\n\n### 3. Sequential\
    \ Access\n![](image_rsrc9PM.jpg)It provides a mechanism for accessing elements\
    \ through a collection.\n\n### 4. Methods for Traversal\n![](image_rsrc9PM.jpg)The\
    \ `Iterator` interface defines three main methods:\n- `hasNext()`: Returns `true`\
    \ if there are more elements in the collection, and `false` otherwise.\n- `next()`:\
    \ Returns the next element.\n- `remove()`: Removes the last element returned by\
    \ `next()` (optional).\n\n### 5. Obtaining an Iterator\n![](image_rsrc9PM.jpg)To\
    \ use an `Iterator`, it must be obtained from the collection, typically by calling\
    \ the `iterator()` method, which returns an instance of `Iterator`.\n\n### 6.\
    \ Fail-Fast Behavior\n![](image_rsrc9PM.jpg)Many implementations of `Iterator`\
    \ exhibit a fail-fast behavior. If the underlying collection is modified while\
    \ an `Iterator` is in use, it may throw a `ConcurrentModificationException`.\n\
    \n### 7. Immutable Iterator\n![](image_rsrc9PM.jpg)The `remove()` method in the\
    \ `Iterator` interface is optional, and not all iterators support removal. Attempting\
    \ to use the `remove()` method on an iterator that does not support it may result\
    \ in an `UnsupportedOperationException`.\n\n### 8. Universal Traversal\n![](image_rsrc9PM.jpg)The\
    \ `Iterator` interface provides a uniform way to traverse elements across different\
    \ types of collections, such as lists, sets, and maps.\n\n### 9. Example Use Cases\n\
