  trans: "\n\n![](img/image_rsrc9RE.jpg)`String` 类提供了许多用于操作和查询字符串的方法。这些方法包括了查找字符串长度、提取子字符串、转换大小写、比较字符串等操作。\n\
    \n## 6. 转义序列\n\n![](img/image_rsrc9RF.jpg)Java 中的字符串支持转义序列来表示特殊字符。例如，`\\n` 表示换行符，`\\\
    t` 表示制表符，而 `\\\"` 表示双引号。\n\n## 7. 字符串比较\n\n![](img/image_rsrc9RG.jpg)Java 中的字符串比较通过\
    \ `equals()` 或 `compareTo()` 等方法完成。需要注意的是，`==` 比较的是引用，而不是字符串的实际内容。\n\n## 8. 字符串池（String\
    \ Interning）\n\n![](img/image_rsrc9RH.jpg)字符串池（String interning）是将唯一的 `String`\
    \ 字面量放入 `String` 池的过程，以确保相同的字面量引用同一个 `String` 对象。可以使用 `intern()` 方法显式地完成这一点。\n\
    \n## 9. 字符串索引\n\n![](img/image_rsrc9RJ.jpg)`String` 中的字符索引从 0 开始。使用 `charAt()`\
    \ 方法可以访问单个字符。字符串是不可变的，因此修改字符需要创建一个新的 `String`。\n\n## 10. Unicode 支持\n\n![](img/image_rsrc9RK.jpg)Java\
    \ 字符串支持 Unicode，允许它们表示来自各种书系统的字符。这使得 Java 适用于国际化和本地化。\n\n## 11. 正则表达式\n\n![](img/image_rsrc9RM.jpg)Java\
    \ 通过 `String` 类和 `java.util.regex` 包提供了对正则表达式的支持。正则表达式允许强大的字符串匹配和处理。\n\n## 12.\
    \ StringBuffer 和 StringBuilder\n\n![](img/image_rsrc9RN.jpg)虽然 `String` 对象是不可变的，但\
    \ `StringBuffer` 和 `StringBuilder` 类提供了字符串操作的可变替代方案。在涉及频繁修改的场景下，它们的效率更高。\n\n总而言之，Java\
    \ 字符串是该语言的基础部分，为处理文本数据提供了一种通用且强大的方式。理解 `Strings` 的不可变性、其方法以及 `String` 池等相关概念，对于在\
    \ Java 程序中进行有效的字符串操作至关重要。\n\n在 Java 中，`String` 是字符序列。它是 Java 中的一个类，而该类的实例代表字符序列。\n\
    \n```\npublic class StringsExample {\n\n    public static void main(String[] args)\
    \ {\n        // 创建字符串\n        String greeting = \"Hello, \"; \n        String\
    \ name = \"John\";\n\n        // 拼接\n        String welcomeMessage = greeting\
    \ + name + \"!\";  \n        System.out.println(\"Welcome Message: \" + welcomeMessage);\n\
    \n        // 字符串长度\n        int length = welcomeMessage.length();  \n        System.out.println(\"\
    Length of Welcome Message: \" + length);\n\n        // 访问字符串中的字符\n        char\
    \ firstChar = welcomeMessage.charAt(0);\n        char lastChar = welcomeMessage.charAt(length\
    \ - 1);  \n        System.out.println(\"First Character: \" + firstChar);  \n\
    \        System.out.println(\"Last Character: \" + lastChar);\n\n        // 子字符串\n\
    \        String substring = welcomeMessage.substring(7, 12);  \n        System.out.println(\"\
    Substring: \" + substring);\n\n        // 字符串比较\n        String anotherName =\
    \ \"john\";\n        boolean isEqualIgnoreCase = name.equalsIgnoreCase(anotherName);\
    \  \n        System.out.println(\"Is name equal to anotherName (ignore case)?\
    \ \" + isEqualIgnoreCase);\n\n        // 字符串字符串（字符串是不可变的）\n        String originalString\
    \ = \"abc\";\n        String modifiedString = originalString.concat(\"def\");\
    \  \n        System.out.println(\"Original String: \" + originalString);  \n \
    \       System.out.println(\"Modified String: \" + modifiedString);\n    }\n}\n\
    ```\n\n## Java 字符串解释：\n\n1. **创建字符串：**\n\n![](img/image_rsrc9PM.jpg)可以使用双引号创建字符串。例如，`String\
    \ greeting = \"Hello, \";`。\n\n2. **拼接：**\n\n![](img/image_rsrc9PM.jpg)可以使用 `+`\
    \ 运算符拼接字符串。在示例中，`welcomeMessage` 是通过拼接 `greeting`、`name` 和 `\"!\"` 形成的。\n\n3.\
    \ **字符串长度：**\n\n![](img/image_rsrc9PM.jpg)使用 `length()` 方法查找字符串的长度。\n\n4. **访问字符：**\n\
    \n![](img/image_rsrc9PM.jpg)`charAt(index)` 方法允许你访问字符串中特定索引处的字符。\n\n5. **子字符串：**\n\
    \n![](img/image_rsrc9PM.jpg)`substring(startIndex, endIndex)` 方法提取字符串的一部分。\n\n\
    6. **字符串比较：**\n\n![](img/image_rsrc9PM.jpg)`equals()` 方法用于区分区分大小写的字符串比较，而 `equalsIgnoreCase()`\
    \ 用于不区分大小写的比较。\n\n7. **字符串修改（不可变性）：**\n\n![](img/image_rsrc9PM.jpg)Java 中的字符串是不可变的，这意味着它们的值在创建后无法更改。像拼接这样的操作会创建新字符串，而不是修改原始字符串。\n\
    \n字符串在 Java 中是基础，并被广泛用于表示。\n\n# 数\n\n在 Java 中，`Math` 类是 `java.lang` 的一部分，提供了一系列静态方法。\n\
    \n1. **静态方法：**\n\n![](img/image_rsrc9RP)`Math` 中的所有方法都是静态的，这意味着你不需要创建类的实例即可使用它们。\n\
    \n2. **基础算术：**\n\n![](img/image_rsrc9RR)`Math` 类包含了用于基础算术的方法，如 `addExact()`、`subtractExact()`、`multiplyExact()`\
    \ 和 `floorDiv()`。这些方法更稳健地处理溢出和下溢。\n\n3. **指数和对数函数：**\n\n![](img/image_rsrc9RS)`Math`\
    \ 类提供了指数函数的方法，如 `exp()` 和 `pow()`，用于计算指定的幂。它还包含了不同底数的对数函数，如 `log()` 和 `log10()`。\n\
    \n4. **三角函数：**\n\n![](img/image_rsrc9RT)`Math` 类提供了常用的三角函数，包括 `sin()`、`cos()`\
    \ 和 `tan()`。反反函数 `asin()`、`acos()` 和 `atan()`。\n\n5. **取整函数：**\n\n![](img/image_rsrc9RU)提供了\
    \ `round()`、`floor()` 和 `ceil()` 方法，分别用于四舍五入到整数、向下取整和向上取整。\n\n6. **平方根和立方根：**\n\
    \n![](img/image_rsrc9RV)`sqrt()` 方法计算数的平方根，`cbrt()` 方法计算数的立方根。\n\n7. **绝对值：**\n\
    \n![](img/image_rsrc9RW)`abs()` 方法返回给定数的绝对值，有效消除了负号。\n\n8. **最小值和最大值：**\n\n![](img/image_rsrc9RX)Math\
    \ 提供确定两个值的最小值 (`min()`) 和最大值 (`max()`) 方法。\n\n9. **随机数生成：**\n\n![](img/image_rsrc9RY)`Math`\
    \ 类通过 `random()` 方法支持随机数生成，该方法返回 0.0 到 1.0 之间的伪随机双精度值。\n\n10. **常量：**\n\n![](img/image_rsrc9RZ)Math\
    \ 类包含了常量 `PI` 和 `E`，分别代表数学常数圆周率 和自然对数的底。\n\n11. **特殊函数：**\n\n![](img/image_rsrc9S0)还有特殊的数学函数可用，如\
    \ `hypot()`（计算直角形的斜边）以及用于角度和弧度转换的 `toDegrees()`/`toRadians()`。\n\n12. **IEEE 754\
    \ 标准：**\n\n![](img/image_rsrc9S1)`Math` 类中的许多方法遵循 IEEE 754 浮点算术标准，确保在不同平台上的行为一致。\n\
    \n"
- fmt: "\nIn summary, the `Math` class in Java provides a comprehensive set of mathematical\
    \ functions for performing common mathematical operations. These methods are widely\
    \ used in scientific computations, engineering applications, and various other\
    \ domains where precise mathematical calculations are required.\n\nIn Java, the\
    \ `Math` class provides a set of static methods for performing mathematical operations.\
    \ These methods cover a range of common mathematical functions.\n\n```java\npublic\
    \ class MathExample {\n    public static void main(String[] args) {\n        //\
    \ Basic arithmetic operations\n        int a = 5;\n        int b = 3;\n      \
