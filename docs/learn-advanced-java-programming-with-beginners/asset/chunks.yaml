    ![](image_rsrc9PM.jpg)The myLambda instance is used to call the myMethod  defined
    in the functional interface, passing the argument  "World".


    5.  Output:


    ![](image_rsrc9PM.jpg)The output of the program is "Hello, World" as the  lambda
    expression prints a greeting message.


    In summary, a lambda expression provides a concise way to  create  an  instance  of  a  functional  interface  by  directly  expressing
    the implementation of its single abstract method. It  eliminates the need for
