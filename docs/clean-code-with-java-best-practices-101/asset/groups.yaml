    These tests are more focused and provide clearer feedback when failures occur.


    Another important aspect of writing effective unit tests is avoiding flaky tests.
    Flaky tests are tests that sometimes pass and sometimes fail without any changes
    to the code being tested. These tests can erode confidence in the test suite and
    waste time as developers investigate false failures.


    Common causes of flaky tests include:


    +   1. Reliance on external resources: Tests that depend on external services
    or databases can be affected by network issues or data changes.


    +   2. Time sensitivity: Tests that rely on specific timing or delays can fail
    intermittently due to variations in system performance.


    +   3. Shared state: Tests that modify shared resources without proper cleanup
    can interfere with each other.


    +   4. Race conditions: Concurrent operations in multi-threaded code can lead
    to inconsistent results.


    To avoid flaky tests, consider the following strategies:'
  - "[PAGE 212]\n\n+   1. Use dependency injection and mocking to isolate the code\
    \ under test from external dependencies.\n\n+   2. Avoid relying on specific timing.\
    \ Instead, use techniques like polling with timeouts when waiting for asynchronous\
    \ operations.\n\n+   3. Ensure each test runs in isolation by properly setting\
    \ up and tearing down test data.\n\n+   4. Use thread-safe data structures and\
    \ synchronization mechanisms when testing current code.\n\nHere's an example of\
