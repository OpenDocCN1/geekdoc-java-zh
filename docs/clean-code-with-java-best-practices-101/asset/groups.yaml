    \ >= 18) {\n    System.out.println(customer.getName() + \" is eligible for a loan.\"\
    );\n    // Process loan application\n  }\n}\n```\n\nIn this case, the age check\
    \ is duplicated. To refactor, we can extract this logic into a separate method:\n\
    \n```\npublic boolean isAdult(Customer customer) {\n    return customer.getAge()\
    \ >= 18;\n}\n```\n\n```\npublic void processCustomer(Customer customer) {\n  \
    \  if (isAdult(customer)) {\n        System.out.println(customer.getName() + \"\
    \ is eligible for a credit card.\");\n        // Process credit card application\n\
    \    }\n}\n```\n\n```\npublic void processLoan(Customer customer) {\n    if (isAdult(customer))\
    \ {\n        System.out.println(customer.getName() + \" is eligible for a loan.\"\
    );\n        // Process loan application\n    }\n}\n```\n\nAnother prevalent code\
    \ smell is long methods. Methods that are excessively long are often doing too\
    \ much, violating the Single Responsibility Principle. They are harder to understand,\
    \ test, and maintain. Consider this example:\n\n```\npublic void processOrder(Order\
    \ order) {\n    // Validate order\n    if (order.getItems().isEmpty()) {\n   \
    \     throw new IllegalArgumentException(\"Order must contain items\");\n    }\n\
    \    if (order.getCustomer() == null) {\n        throw new IllegalArgumentException(\"\
    Order must have a customer\");\n    }\n\n    // Calculate total\n    double total\
    \ = 0;\n    for (Item item : order.getItems()) {\n        total += item.getPrice()\
    \ * item.getQuantity();\n    }\n\n    // Apply discount\n    if (order.getCustomer().isPreferred())\
    \ {\n        total *= 0.9; // 10% discount for preferred customers\n    }\n\n\
    \    // Update inventory\n    for (Item item : order.getItems()) {\n        Inventory.decreaseStock(item.getProductId(),\
    \ item.getQuantity());\n    }\n\n    // Generate invoice\n    Invoice invoice\
    \ = new Invoice(order.getCustomer(), order.getItems(), total);\n    InvoiceRepository.save(invoice);\n\
    \n    // Send confirmation email\n    EmailService.sendOrderConfirmation(order.getCustomer(),\
    \ order.getEmail(), order.getId(), total);\n}\n```\n\nThis method is doing multiple\
    \ tasks: validation, calculation, inventory management, invoice generation, and\
    \ email sending. We can refactor it by extracting each responsibility into separate\
    \ methods:\n\n```\npublic void processOrder(Order order) {\n  validateOrder(order);\n\
    \  double total = calculateTotal(order);\n  updateInventory(order);\n  Invoice\
    \ invoice = generateInvoice(order, total);\n  sendConfirmationEmail(order, total);\n\
    }\n```\n\n```\nprivate void validateOrder(Order order) {\n    if (order.getItems().isEmpty())\
    \ {\n        throw new IllegalArgumentException(\"Order must contain items\");\n\
    \    }\n    if (order.getCustomer() == null) {\n        throw new IllegalArgumentException(\"\
    Order must have a customer\");\n    }\n}\n```\n\n```\nprivate double calculateTotal(Order\
    \ order) {\n    double total = order.getItems().stream()\n        .mapToDouble(item\
    \ -> item.getPrice() * item.getQuantity())\n        .sum();\n\n    if (order.getCustomer().isPreferred())\
    \ {\n        total *= 0.9; // 10% discount for preferred customers\n    }\n  \
    \  return total;\n}\n```\n\n```\nprivate void updateInventory(Order order) {\n\
    \  order.getItems().forEach(item ->\n    Inventory.decreaseStock(item.getProductId(),\
    \ item.getQuantity()));\n}\n```\n\n```\nprivate Invoice generateInvoice(Order\
    \ order, double total) {\n  Invoice invoice = new Invoice(order.getCustomer(),\
    \ order.getItems(), total);\n  InvoiceRepository.save(invoice);\n  return invoice;\n\
    }\n```\n\n```\nprivate void sendConfirmationEmail(Order order, double total) {\n\
    \  EmailService.sendOrderConfirmation(order.getCustomer(), order.getEmail(), order.getId(),\
    \ total);\n}\n```\n\nThis refactored version is more readable, maintainable, and\
    \ testable. Each method now has a single responsibility, making the code easier\
    \ to understand and modify.\n\nAnother common code smell is inappropriate intimacy,\
    \ where classes become too interconnected. This often manifests as one class having\
    \ excessive access to the internal details of another. For example:\n\n```java\n\
    public class OrderProcessor {\n  public void process(Order order) {\n    if (order.getItemCount()\
    \ > 10) {\n      order.applyBulkDiscount();\n    }\n    order.applyCustomerDiscount();\n\
    \    // More processing...\n  }\n}\n```\n\n```java\npublic class Order {\n   \
    \ private List<Item> items;\n    private Customer customer;\n\n    public int\
    \ getItemCount() {\n      return items.size();\n    }\n\n    public void applyBulkDiscount()\
    \ {\n      // Apply discount logic\n    }\n\n    public void applyCustomerDiscount()\
    \ {\n      items.forEach(item -> item.applyDiscount(customer.getDiscountRate()));\n\
    \    }\n}\n```\n\n```java\npublic class Customer {\n  private double discountRate;\n\
    \n  public double getDiscountRate() {\n    return discountRate;\n  }\n}\n```\n\
    \n```java\npublic class Item {\n    private double price;\n\n    public void applyDiscount(double\
    \ rate) {\n        price *= (1 - rate);\n    }\n}\n```\n\nThis refactored version\
    \ respects encapsulation and reduces the coupling between classes.\n\nTools can\
    \ greatly assist in identifying code smells and facilitating refactoring. IDEs\
    \ like IntelliJ IDEA and Eclipse offer built-in refactoring tools that can automate\
