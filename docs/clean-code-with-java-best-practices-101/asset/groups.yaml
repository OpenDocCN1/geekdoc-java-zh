- md: "\nHowever, it’s crucial to avoid over-commenting. Comments that merely restate\
    \ what the code does are unnecessary and can clutter the codebase. For example:\n\
    \n```\n// Bad: Restating the obvious\n// Increment the counter\ncounter++;\n```\n\
    \n```\n// Good: No comment needed for simple, self-explanatory code\ncounter++;\n\
    ```\n\nIn this case, the comment adds no value and should be omitted.\n\nAnother\
    \ common pitfall is outdated comments. As code evolves, comments may become inconsistent\
    \ with the actual implementation. This can be more harmful than having no comments\
    \ at all, as it can mislead developers. Always update comments when modifying\
    \ code to ensure they remain accurate.\n\nComments should not be used to explain\
    \ poorly written code. If you find yourself writing extensive comments to clarify\
    \ a complex method, it's often a sign that the code itself needs refactoring.\
    \ Consider this example:\n\n```\n// Bad: Using comments to explain convoluted\
    \ code\npublic void processData(List<String> data) {\n    // Check if data is\
    \ not null and not empty\nif (data != null && data.isEmpty()) {\n  // Iterate\
    \ through each item in the data list\n  for (String item : data) {\n    // Check\
    \ if the item is not null or empty\n    if (item != null && !item.trim().isEmpty())\
    \ {\n      // Process the item\n      System.out.println(\"Processing: \" + item);\n\
    \    }\n  }\n}\n```\n\n// Good: Refactored code with minimal need for comments\n\
    \n```\npublic void processData(List<String> data) {\n  if (isNullOrEmpty(data))\
    \ {\n    return;\n  }\n\n  data.stream()\n    .filter(this::isValidItem)\n   \
    \ .forEach(this::processItem);\n}\n```\n\n```\nprivate boolean isNullOrEmpty(List<String>\
    \ list) {\n    return list == null || list.isEmpty();\n}\n```\n\n```\nprivate\
    \ boolean isValidItem(String item) {\n    return item != null && !item.trim().isEmpty();\n\
    }\n```\n\n```\nprivate void processItem(String item) {\n    System.out.println(\"\
    Processing: \" + item);\n}\n```\n\nIn the refactored version, the code is more\
    \ readable and self-explanatory, reducing the need for comments.\n\nTODOs and\
    \ FIXMEs are special types of comments that can be useful for marking areas of\
    \ code that need attention. However, these should be used sparingly and addressed\
    \ promptly to prevent them from accumulating and becoming ignored. For example:\n\
    \n```\n// TODO: Implement proper error handling\npublic void riskyOperation()\
    \ {\n  // Temporary implementation\n  try {\n    // Some risky code\n  } catch\
    \ (Exception e) {\n    e.printStackTrace();\n  }\n}\n```\n\nWhile this TODO serves\
    \ as a reminder, it's important to address it quickly to improve code quality.\n\
    \nWhen writing comments, aim for clarity and conciseness. Use proper grammar and\
    \ punctuation, and avoid abbreviations or jargon that might not be universally\
    \ understood within your team. For instance:\n\n```\n// Bad: Unclear and uses\
    \ abbreviations\n// Calc avg of nums\ndouble calculateAverage(List<Integer> nums)\
    \ {\n  // Implementation...\n}\n```\n\n```\n// Good: Clear and descriptive\n//\
    \ Calculates the average of a list of integers\ndouble calculateAverage(List<Integer>\
    \ numbers) {\n    // Implementation...\n}\n```\n\nIn some cases, comments can\
    \ be used to provide examples or usage instructions, particularly for public APIs\
    \ or libraries. This can be especially helpful when the code is intended for use\
    \ by other developers:\n\n```java\n/**\n * Encrypts the given plaintext using\
    \ AES encryption.\n *\n * @param plaintext The text to be encrypted\n * @param\
    \ key The encryption key (must be 16, 24, or 32 bytes)\n * @return The encrypted\
    \ text as a Base64 encoded string\n *\n * @throws IllegalArgumentException if\
    \ the key length is invalid\n * @throws EncryptionException if encryption fails\n\
    \ *\n * Example usage:\n * String encrypted = AESUtil encrypt(\"Hello, World!\"\
    , \"1234567890123456\");\n */\npublic static String encrypt(String plaintext,\
    \ String key) throws EncryptionException {\n  // Implementation...\n}\n}\n```\n\
    \nThis comment provides clear usage instructions, parameter descriptions, and\
    \ even an example, making it easier for other developers to use the method correctly.\n\
    \nIn conclusion, comments should be used thoughtfully to enhance code readability\
    \ and maintainability. They should provide context, explain complex logic, or\
    \ offer high-level overviews. Avoid redundant or obvious comments, and always\
    \ keep comments up-to-date with code changes. Remember that the best code is self-documenting,\
    \ with comments serving as supplementary information rather than a crutch for\
    \ poorly written code. By following these principles, you can ensure that your\
    \ comments contribute positively to the overall quality and clarity of your codebase.\n\
    \n# Formatting and Style\n\nFormatting and style are crucial aspects of clean\
    \ code that significantly impact readability and maintainability. Consistent indentation,\
    \ proper spacing, and alignment with team guidelines create a visual structure\
    \ that helps developers quickly understand and navigate the codebase.\n\nIndentation\
    \ is a fundamental aspect of code formatting. It visually represents the logical\
    \ structure of the code, making it easier to identify blocks, nesting levels,\
    \ and relationships between different parts of the program. Consistent indentation\
    \ is essential for readability. In Java, the standard practice is to use 4 spaces\
    \ for each indentation level. For example:\n\n```java\npublic class User {\n \
    \   private String name;\n    private int age;\n\n    public User(String name,\
    \ int age) {\n        this.name = name;\n        this.age = age;\n    }\n\n  \
    \  public void printDetails() {\n        if (age >= 18) {\n            System.out.println(name\
    \ + \" is an adult.\");\n        } else {\n            System.out.println(name\
    \ + \" is a minor.\");\n        }\n    }\n}\n```\n\nSpacing is another element\
    \ of clean code. Proper use of whitespace can greatly enhance readability. This\
    \ includes spacing around operators, after commas in parameter lists, and between\
    \ methods. For instance:\n\n```java\n// Poor spacing\npublic int calculate(int\
    \ a,int b){\n    return a+b*2-1;\n}\n```\n\n```java\n// Good spacing\npublic int\
    \ calculate(int a, int b) {\n    return a + b * 2 - 1;\n}\n```\n\nLine breaks\
    \ also play a crucial role in formatting. Long lines of code should be broken\
    \ into multiple lines to improve readability. The general rule is to keep lines\
    \ under 80-120 characters, depending on team preferences. When breaking lines,\
    \ align the continuation lines with the opening parenthesis or indent them one\
    \ level. For example:\n\n```java\n// Long line\nString result = someObject.someMethod(parameterOne,\
    \ parameterTwo, parameterThree, parameterFour);\n```\n\n```java\n// Better formatting\n\
    String result = someObject.someMethod(\n    parameterOne,\n    parameterTwo,\n\
    \    parameterThree,\n    parameterFour\n);\n```\n\nConsistency in brace placement\
    \ is another important aspect of code style. In Java, it's common to use the \"\
    Egyptian brackets\" style, where opening braces are placed on the same line as\
    \ the control statement. For example:\n\n# Egyptian brackets style\n\n```java\n\
    if (condition) {\n// code\n} else {\n// code\n}\n```\n\n```java\n// Avoid mixing\
    \ styles\nif (condition)\n{\n    // code\n}\nelse {\n    // code\n}\n```\n\nWhen\
    \ it comes to class and interface declarations, it’s standard practice to have\
    \ each in its own file, with the filename matching the class or interface name.\
    \ This makes it easier to navigate the codebase and find specific code components.\n\
    \nGrouping related code together enhances readability. Within a class, group fields,\
    \ constructors, and methods logically. A common practice is to order elements\
    \ by their visibility:\n\n```java\npublic class Example {\n    // Public static\
    \ fields\n    public static final int CONSTANT = 42;\n\n    // Private fields\n\
    \    private int someField;\n\n    // Constructors\n    public Example() {\n \
    \       // Constructor code\n    }\n\n    // Public methods\n    public void publicMethod()\
    \ {\n        // Method code\n    }\n\n    // Private methods\n    private void\
    \ privateMethod() {\n        // Method code\n    }\n}\n```\n\nComments and documentation\
    \ should also follow consistent formatting. Javadoc comments for classes and public\
    \ methods are crucial for generating useful API documentation. Use consistent\
    \ indentation and line breaks within comments to maintain readability:\n\n```java\n\
    /**\n * This class represents a user in the system.\n */\n```\n"
  mdcn: "\n然而，避免过度注释至关重要。仅仅复述代码功能的注释是没必要的，并且会让代码库变得杂乱。例如：\n\n```\n// 错误：复述显而易见的内容\n\
    // 增加计数器\ncounter++;\n```\n\n```java\n// 良好：简单且自解释的代码不需要注释\ncounter++;\n```\n\n\
    在这种情况下情况下，注释没有添加价值，应该被省略。\n\n另一个常见的陷阱是过时的注释。随着代码的演变，注释可能会与实际实现不一致。这比完全没有注释更有害，因为它会误导开发者。在修改代码时，请务必更新注释，以确保它们保持准确性。\n\
    \n注释不应被用来解释写得糟糕的代码。如果你发现自己正在编写大量的注释来澄清一个复杂方法，这通常意味着代码本身需要重构。考虑这个例子：\n\n```java\n\
    // 错误：使用注释来解释复杂的代码\npublic void processData(List<String> data) {\n    // 检查数据是否不为空且为空\n\
    if (data != null && data.isEmpty()) {\n  // 遍历数据列表中的每一项\n  for (String item :\
    \ data) {\n    // 检查项目是否为空或为空\n    if (item != null && !item.trim().isEmpty())\
    \ {\n      // 处理项目\n      System.out.println(\"Processing: \" + item);\n    }\n\
    \  }\n}\n}\n\n// 良好：重构后的代码，最少需要注释\n\n```java\npublic void processData(List<String>\
    \ data) {\n  if (isNullOrEmpty(data)) {\n    return;\n  }\n\n  data.stream()\n\
    \    .filter(this::isValidItem)\n    .forEach(this::processItem);\n}\n```\n\n\
    ```java\nprivate boolean isNullOrEmpty(List<String> list) {\n    return list ==\
    \ null || list.isEmpty();\n}\n```\n\n```java\nprivate boolean isValidItem(String\
    \ item) {\n    return item != null && !item.trim().isEmpty();\n}\n```\n\n```java\n\
    private void processItem(String item) {\n    System.out.println(\"Processing:\
    \ \" + item);\n}\n```\n\n在重构后的版本中，代码更具读性且自解释，减少了对注释的需求。\n\nTODO 和 FIXME 是特殊类型的注释，对于标记需要关注的代码区域非常有用。然而，这些应该节节使用，并及时处理，以防止它们堆积并被忽视。例如：\n\
    \n```\n// TODO: 实现适当错误处理\npublic void riskyOperation() {\n  // 临时实现\n  try {\n\
    \    // 某些风险代码\n  } catch (Exception e) {\n    e.printStackTrace();\n  }\n}\n\
    ```\n\n虽然这个 TODO 起到了提醒作用，但快速处理它对提高代码质量非常重要。\n\n在编写注释时，目标是清晰和简洁。使用正确的语法和标点符号，避免使用团队内可能无法通用理解的缩写或术语。例如：\n\
    \n```java\n// 错误：不清晰且使用了缩写\n// 计算数字的平均值\ndouble calculateAverage(List<Integer>\
    \ nums) {\n  // 实现...\n}\n```\n\n```java\n// 良好：清晰且具有描述性\n// 计算整数列表的平均值\ndouble\
    \ calculateAverage(List<Integer> numbers) {\n    // 实现...\n}\n```\n\n在某些情况下，注释可以用来提供示例或使用说明，特别是对于公共\
    \ API 或库。当代码旨在供其他开发者使用时，这特别有帮助：\n\n```java\n/**\n * 使用 AES 加密给定的明文。\n *\n * @param\
    \ plaintext 要加密的文本\n * @param key 加密密钥（必须是 16、24 或 32 字节）\n * @return 作为 Base64\
    \ 编码字符串的加密文本\n *\n * @throws IllegalArgumentException 如果密钥长度无效\n * @throws EncryptionException\
    \ 如果加密失败\n *\n * 示例用法:\n * String encrypted = AESUtil encrypt(\"Hello, World!\"\
    , \"1234567890123456\");\n */\npublic static String encrypt(String plaintext,\
    \ String key) throws EncryptionException {\n  // 实现...\n}\n}\n```\n\n此注释提供了清晰的使用说明、参数描述，甚至还有一个示例，使得其他开发者更容易正确地使用该方法。\n\
    \n总之，应该审慎地使用注释来增强代码的可读性和可维护性。它们应该提供背景、解释复杂逻辑或提供高层概述。避免冗余或显而易见的注释，并始终保持注释与代码更改同步。记住，最好的代码是自文档的，注释应作为补充信息，而不是写得糟糕的代码的拐杖。通过遵循这些原则，你可以确保注释对代码库的整体质量和清晰度做出积极贡献。\n\
    \n# 格式与风格\n\n格式和风格是清洁代码的关键方面，显著影响可读性和可维护性。一致的缩进、适当的间距以及与团队指南的对创建了视觉结构，帮助开发者快速理解和导航代码库。\n\
    \n缩进是代码格式的一个基本方面。它在视觉上表示了代码的逻辑结构，有助于识别块、嵌套层次以及程序不同部分之间的关系。一致的缩进对于可读性至关重要。在 Java\
    \ 中，标准做法是每个缩进层使用 4 个空格。例如：\n\n```java\npublic class User {\n    private String\
    \ name;\n    private int age;\n\n    public User(String name, int age) {\n   \
    \     this.name = name;\n        this.age = age;\n    }\n\n    public void printDetails()\
    \ {\n        if (age >= 18) {\n            System.out.println(name + \" is an\
    \ adult.\");\n        } else {\n            System.out.println(name + \" is a\
    \ minor.\");\n        }\n    }\n}\n```\n\n间距是清洁代码的另一个元素。适当使用空格可以极大提高可读性。这包括运算符周围、参数列表逗号之后以及方法之间的空格。例如：\n\
    \n```java\n// 糟糕的间距\npublic int calculate(int a,int b){\n    return a+b*2;\n}\n\
    ```\n\n```java\n// 良好的间距\npublic int calculate(int a, int b) {\n    return a +\
    \ b * 2;\n}\n```\n\n换行在格式化中起着重要作用。长代码应该换行以提高可读性。通常规则是将行保持在 80-120 个字符以内，取决于团队偏好。换行时，将延续行与左括号对齐或缩进一级。例如：\n\
    \n```java\n// 长行\nString result = someObject.someMethod(parameterOne, parameterTwo,\
    \ parameterThree, parameterFour);\n```\n\n```java\n// 更好的格式\nString result = someObject.someMethod(\n\
    \    parameterOne,\n    parameterTwo,\n    parameterThree,\n    parameterFour\n\
    );\n```\n\n括号位置的一性是代码风格的另一个方面。在 Java 中，通常使用“埃及式括号”风格，将大括号放在与控制语句同一行。例如：\n\n# 埃及式括号风格\n\
    \n```java\nif (condition) {\n// 代码\n} else {\n// 代码\n}\n```\n\n```java\n// 避免混合风格\n\
    if (condition)\n{\n    // 代码\n}\nelse {\n    // 代码\n}\n```\n\n对于类和接口声明，标准做法是每个一个位于一个文件中，文件名与类或接口名称匹配。这有助于导航代码库并寻找特定的代码组件。\n\
    \n将相关的代码分组可以增强可读性。在类内部，将字段、构造函数和方法逻辑地分组。常见的做法是按可见性对元素排序：\n\n```java\npublic class\
    \ Example {\n    // 公共静态字段\n    public static final int CONSTANT = 42;\n\n   \
    \ // 私有字段\n    private int someField;\n\n    // 构造函数\n    public Example() {\n\
    \        // 构造函数代码\n    }\n\n    // 公共方法\n    public void publicMethod() {\n \
    \       // 方法代码\n    }\n\n    // 私有方法\n    private void privateMethod() {\n  \
    \      // 方法代码\n    }\n}\n```\n\n注释和文档也应该遵循一致的格式。类和公共方法的 Javadoc 注释对于生成实用的 API\
    \ 文档非常重要。注释内部使用一致的缩进和换行以保持可读性：\n\n```java\n/**\n * 此类代表系统中的用户。\n */\n```\n\n"
