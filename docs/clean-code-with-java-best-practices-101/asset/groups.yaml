- md: "\n- 1. Start small: Begin with simple projects or features to get comfortable\
    \ with the TDD workflow.\n- 2. Practice regularly: Like any skill, TDD improves\
    \ with consistent practice.\n- 3. Focus on behavior, not implementation: Write\
    \ tests that describe what the code should do, not how it should do it.\n- 4.\
    \ Refactor tests: Apply the same clean code principles to your tests as you do\
    \ to your production code.\n- 5. Use mocking judiciously: Learn when and how to\
    \ use mocks to isolate units of code for testing.\n\nHere's an example of using\
    \ mocks in TDD:\n\n```java\npublic interface EmailService {\n    void sendEmail(String\
    \ to, String subject, String body);\n}\n```\n\n```java\npublic class UserService\
    \ {\n    private EmailService emailService;\n\npublic UserService(EmailService\
    \ emailService) {\n    this.emailService = emailService;\n}\n\npublic void registerUser(String\
    \ email) {\n    // Registration logic...\n    emailService.sendEmail(email, \"\
    Welcome\", \"Welcome to our service!\");\n}\n\n@Test\npublic void testUserRegistration()\
    \ {\n    // Arrange\n    EmailService mockEmailService = mock(EmailService.class);\n\
    \    UserService userService = new UserService(mockEmailService);\n\n    // Act\n\
    \    userService.registerUser(\"user@example.com\");\n\n    // Assert\n    verify(mockEmailService).sendEmail(\"\
    user@example.com\", \"Welcome\", \"Welcome to our service!\");\n}\n```\n\nIn this\
    \ example, we use a mock EmailService to verify that the UserService interacts\
    \ correctly with the email service without actually sending emails during tests.\n\
    \nTDD can be particularly powerful when combined with other clean code practices.\
    \ For instance, the Single Responsibility Principle (SRP) often naturally emerges\
    \ when following TDD, as it becomes easier to test classes with a single, well-defined\
    \ responsibility.\n\nMoreover, TDD can help in designing better interfaces. As\
    \ you write tests first, you're essentially defining how you want to use your\
    \ code before implementing it. This often leads to more intuitive and usable APIs.\n\
    \nWhile TDD is a powerful tool, it's important to remember that it's not a silver\
    \ bullet. It should be used in conjunction with other software development best\
    \ practices and adapted to fit the specific needs of each project and team.\n\n\
    In conclusion, Test-Driven Development is a valuable approach for creating clean,\
    \ maintainable code. By following the red-green-refactor cycle, developers can\
    \ build robust, well-tested systems. While it presents initial challenges, the\
    \ long-term benefits in code quality, maintainability, and developer confidence\
    \ make it a worthwhile practice to adopt and master.\n\n## Mocking and Stubbing\n\
    \nMocking and stubbing are essential techniques in unit testing that allow developers\
    \ to isolate the code under test from its dependencies. These practices are crucial\
    \ for creating focused, reliable, and fast unit tests.\n\nMocking involves creating\
    \ objects that simulate the behavior of real objects in controlled ways.\nStubs,\
    \ on the other hand, are simplified implementations of dependencies that return\
    \ predefined responses to method calls. Both techniques are used to replace real\
    \ dependencies with test doubles, enabling developers to test units of code in\
    \ isolation.\n\nWhen deciding whether to mock dependencies, consider the following\
    \ factors:\n\n- 1. Complexity: Mock complex dependencies that are difficult to\
    \ set up or control in a test environment.\n- 2. External resources: Mock dependencies\
    \ that rely on external resources like databases or web services to avoid slow,\
    \ unreliable tests.\n- 3. Side effects: Mock dependencies that cause side effects\
    \ you want to avoid during testing, such as sending emails or making payments.\n\
    - 4. State: Mock dependencies when you need to control their state to test specific\
    \ scenarios.\n\nHere's an example of when to use mocking:\n\n```java\npublic class\
    \ UserService {\n    private EmailService emailService;\n\npublic UserService(EmailService\
    \ emailService) {\n    this.emailService = emailService;\n}\n\npublic void registerUser(String\
    \ email) {\n    // Registration logic\n    emailService.sendWelcomeEmail(email);\n\
    }\n\n@Test\npublic void testRegisterUser() {\n    EmailService mockEmailService\
    \ = mock(EmailService.class);\n    UserService userService = new UserService(mockEmailService);\n\
    \n    userService.registerUser(\"user@example.com\");\n\n    verify(mockEmailService).sendWelcomeEmail(\"\
    user@example.com\");\n}\n```\n\nIn this example, we mock the EmailService to avoid\
    \ sending actual emails during testing and to verify that the sendWelcomeEmail\
    \ method is called with the correct argument.\n\nWriting clear stubs is crucial\
    \ for maintaining readable and maintainable tests. Here are some best practices:\n\
    \n- 1. Keep stubs simple: Implement only the methods necessary for the test.\n\
    - 2. Use descriptive names: Name your stubs clearly to indicate their purpose.\n\
    - 3. Avoid complex logic: Stubs should return predefined values or perform simple\
    \ actions.\n- 4. Document assumptions: If a stub makes assumptions about the system's\
    \ state, document them in the test.\n\nHere's an example of a clear stub:\n\n\
    ```java\npublic class SimpleUserRepository implements UserRepository {\n    private\
    \ Map<String, User> users = new HashMap<>();\n\n    @Override\n    public User\
    \ findByEmail(String email) {\n        return users.get(email);\n    }\n\n   \
    \ @Override\n    public void save(User user) {\n        users.put(user.getEmail(),\
    \ user);\n    }\n\n    // Other methods throw UnsupportedOperationException\n\
    }\n\n@Test\npublic void testUserAuthentication() {\n    SimpleUserRepository userRepository\
    \ = new SimpleUserRepository();\n    AuthenticationService authService = new AuthenticationService(userRepository);\n\
    \    boolean result = authService.authenticate(\"user@example.com\", \"password123\"\
    );\n    assertTrue(result);\n}\n```\n\nThis stub implements only the necessary\
    \ methods for the test. Java provides several libraries for mocking and stubbing.\
    \ The most popular ones are:\n\n- 1. Mockito: A powerful and flexible mocking\
    \ framework.\n- 2. EasyMock: Another mocking library with a slightly different\
    \ syntax.\n- 3. PowerMock: An extension to other mocking frameworks that allows\
    \ mocking of static methods, constructors, and private methods.\n\nHere's an example\
    \ using Mockito:\n\n```java\nimport static org.mockito.Mockito.*;\n\n@Test\npublic\
    \ void testOrderProcessing() {\n    // Create mocks\n    PaymentGateway mockPaymentGateway\
    \ = mock(PaymentGateway.class);\n    InventoryService mockInventoryService = mock(InventoryService.class);\n\
    \n    // Set up expectations\n    when(mockPaymentGateway.process(any())).thenReturn(true);\n\
    \    when(mockInventoryService.isInStock(\"ITEM001\")).thenReturn(true);\n\n \
    \   // Create the system under test\n    OrderService orderService = new OrderService(mockPaymentGateway,\
    \ mockInventoryService);\n\n    // Perform the test\n    Order order = new Order(\"\
    ITEM001\", 2);\n    boolean result = orderService.processOrder(order);\n\n   \
    \ // Verify the result\n    assertTrue(result);\n    verify(mockPaymentGateway).process(order);\n\
    \    verify(mockInventoryService).reduceStock(\"ITEM001\", 2);\n}\n```\n\nThis\
    \ example demonstrates how to use Mockito to create mocks, set up expectations,\
    \ and verify interactions.\n"
  mdcn: "\n\n- 1. 从小处开始：从简单的项目或功能开始，以熟悉 TDD 工作流。\n- 2. 定期练习：像任何技能一样，TDD 会随着持续的练习而提高。\n\
    - 3. 关注行为而非实现：编写描述代码*应该做什么*的测试，而不是它*应该如何做*。\n- 4. 重构测试：像对待生产代码一样，将整洁代码原则应用于你的测试代码。\n\
    - 5. 谨慎使用 Mock（打桩）：学习何时以及如何使用 Mock 来隔离代码单元以进行测试。\n\n以下是一个在 TDD 中使用 Mock 的示例：\n\
    \n```java\npublic interface EmailService {\n    void sendEmail(String to, String\
    \ subject, String body);\n}\n```\n\n```java\npublic class UserService {\n    private\
    \ EmailService emailService;\n\npublic UserService(EmailService emailService)\
    \ {\n    this.emailService = emailService;\n}\n\npublic void registerUser(String\
    \ email) {\n    // Registration logic...\n    emailService.sendEmail(email, \"\
    Welcome\", \"Welcome to our service!\");\n}\n\n@Test\npublic void testUserRegistration()\
    \ {\n    // Arrange\n    EmailService mockEmailService = mock(EmailService.class);\n\
    \    UserService userService = new UserService(mockEmailService);\n\n    // Act\n\
    \    userService.registerUser(\"user@example.com\");\n\n    // Assert\n    verify(mockEmailService).sendEmail(\"\
    user@example.com\", \"Welcome\", \"Welcome to our service!\");\n}\n```\n\n在这个示例中，我们使用了一个\
    \ Mock `EmailService` 来验证 `UserService` 是否正确地与邮件服务交互，而无需在测试期间实际发送电子邮件。\n\nTDD\
    \ 在与其它整洁代码实践结合时会变得特别强大。例如，在遵循 TDD 时，单职责原则（SRP）通常会自然而然，因为测试具有单一且定义良好的职责的类变得更容易了。\n\
    \n此外，TDD 可以帮助设计更好的接口。当你先写测试时，你实际上是在实现代码之前定义了想要如何使用它。这通常会导致更直观、更易用的 API。\n\n虽然\
    \ TDD 是一个强大的工具，但要记住它并不是万能灵药。它应该与其他软件开发最佳实践结合使用，并根据每个项目和团队的具体需求进行调整。\n\n总之，测试驱动开发是创建整洁、可维护代码的一种价值方法。通过遵循“红-绿-重构”（red-green-refactor）循环，开发者可以构建稳健且经过充分测试的系统。虽然它带来了最初挑战，但在代码质量、可维护性和开发者信心方面的长期收益使其成为一种值得采用和精通的实践。\n\
    \n## Mocking（模拟）与 Stubbing（存桩）\n\nMock 和 Stub 是单元测试中的基本技术，允许开发者将被测代码与其依赖项隔离开。这些实践对于创建关注点、可靠且快速的单元测试至关重要。\n\
    \nMocking 涉及创建对象，以受控的方式模拟真实对象的行为。\n而 Stubs（存桩）则是依赖项的简化实现，它们对方法调用返回预定义的响应。这两种技术都用于用测试双（test\
    \ doubles）替换真实依赖，以便开发者隔离测试代码单元。\n\n在决定是否 Mock 依赖项时，请考虑以下因素：\n\n- 1. 复杂性：对于在测试环境中难以设置或控制的复杂依赖进行\
    \ Mock。\n- 2. 外部资源：对于依赖数据库或 Web 服务等外部资源的依赖项进行 Mock，以避免缓慢且不可靠的测试。\n- 3. 副作用：对于产生你在测试期间想要避免的副作用的依赖项进行\
    \ Mock，例如发送电子邮件或进行支付。\n- 4. 状态：当你需要控制状态以测试特定场景时，对依赖项进行 Mock。\n\n以下是一个使用 Mock 的示例：\n\
    \n```java\npublic class UserService {\n    private EmailService emailService;\n\
    \npublic UserService(EmailService emailService) {\n    this.emailService = emailService;\n\
    }\n\npublic void registerUser(String email) {\n    // Registration logic\n   \
    \ emailService.sendWelcomeEmail(email);\n}\n\n@Test\npublic void testRegisterUser()\
    \ {\n    EmailService mockEmailService = mock(EmailService.class);\n    UserService\
    \ userService = new UserService(mockEmailService);\n\n    userService.registerUser(\"\
    user@example.com\");\n\n    verify(mockEmailService).sendWelcomeEmail(\"user@example.com\"\
    );\n}\n```\n\n在这个示例中，我们 Mock 了 `EmailService` 以避免在测试期间发送实际电子邮件，并验证 `sendWelcomeEmail`\
    \ 方法是否用正确的参数被调用。\n\n编写清晰的 Stub 对于保持测试的可读性和可维护性至关重要。这里是一些最佳实践：\n\n- 1. 保持 Stub\
    \ 简单：仅实现测试所需的方法。\n- 2. 使用描述性名称：清晰地命名你的 Stub 以指示其目的。\n- 3. 避免复杂逻辑：Stub 应该返回预定义值或执行简单的操作。\n\
    - 4. 记录假设：如果 Stub 对系统状态做出了假设，请在测试中记录它们。\n\n以下是一个清晰的 Stub 示例：\n\n```java\npublic\
    \ class SimpleUserRepository implements UserRepository {\n    private Map<String,\
    \ User> users = new HashMap<>();\n\n    @Override\n    public User findByEmail(String\
    \ email) {\n        return users.get(email);\n    }\n\n    @Override\n    public\
    \ void save(User user) {\n        users.put(user.getEmail(), user);\n    }\n\n\
    \    // Other methods throw UnsupportedOperationException\n}\n\n@Test\npublic\
    \ void testUserAuthentication() {\n    SimpleUserRepository userRepository = new\
    \ SimpleUserRepository();\n    AuthenticationService authService = new AuthenticationService(userRepository);\n\
    \    boolean result = authService.authenticate(\"user@example.com\", \"password123\"\
    );\n    assertTrue(result);\n}\n```\n\n这个 Stub 仅实现了测试所需的必要方法。Java 提供了多个用于 Mock\
    \ 和 Stub 的库。最流行的有：\n\n- 1. Mockito：一个强大且灵活的 Mock 框架。\n- 2. EasyMock：另一个语法稍不同的\
    \ Mock 库。\n- 3. PowerMock：其他 Mock 框架的扩展，允许对静态方法、构造函数和私有方法进行 Mock。\n\n以下是一个使用 Mockito\
    \ 的示例：\n\n```java\nimport static org.mockito.Mockito.*;\n\n@Test\npublic void\
    \ testOrderProcessing() {\n    // Create mocks\n    PaymentGateway mockPaymentGateway\
    \ = mock(PaymentGateway.class);\n    InventoryService mockInventoryService = mock(InventoryService.class);\n\
    \n    // Set up expectations\n    when(mockPaymentGateway.process(any())).thenReturn(true);\n\
    \    when(mockInventoryService.isInStock(\"ITEM001\")).thenReturn(true);\n\n \
    \   // Create the system under test\n    OrderService orderService = new OrderService(mockPaymentGateway,\
    \ mockInventoryService);\n\n    // Perform the test\n    Order order = new Order(\"\
