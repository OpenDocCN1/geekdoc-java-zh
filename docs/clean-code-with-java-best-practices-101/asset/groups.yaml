    }\n```\n\n```\npublic int getItemCount() {\n    return itemCount;\n}\n}\n```\n\
    \n// Now the test passes, but the implementation is minimal\n\n// Step 3: Refactor\
    \ - Improve the code while keeping tests green\n\n```\npublic class ShoppingCart\
    \ {\n    private List<Item> items = new ArrayList<>();\n\n    public void addItem(String\
    \ name, double price) {\n        items.add(new Item(name, price));\n    }\n\n\
    \    public int getItemCount() {\n        return items.size();\n    }\n}\n```"
  - "[PAGE 217]\n\n```\nprivate static class Item {\n    private String name;\n  \
    \  private double price;\n\n    public Item(String name, double price) {\n   \
    \     this.name = name;\n        this.price = price;\n    }\n}\n```\n\n// The\
    \ implementation is now more robust and extensible, and the test still passes.\n\
    \nThis cycle is repeated for each new feature or behavior, gradually building\
    \ up the system’s functionality.\n\nTDD offers several advantages:\n\n+   1. Improved\
    \ code quality: By writing tests first, developers are forced to think about the\
    \ design and functionality of their code before implementation. This often leads\
    \ to cleaner, more modular designs.\n\n+   2. Better test coverage: Since tests\
    \ are written for every feature, TDD naturally results in comprehensive test suites."
