    \n依赖倒置原则（DIP）是面向对象设计的 SOLID 原则之一。它规定，高层模块不应该依赖于低层模块；两者都应该依赖抽象。此外，抽象不应该依赖于细节；细节应该依赖于抽象。这一原则促进了松耦合，并增强了代码的灵活性和维护性。\n\
