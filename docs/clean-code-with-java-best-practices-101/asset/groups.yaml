    ```\n\n```\nList<Integer> evenSquares = numbers.size() > 10000\n? numbers.stream()\n\
    .filter(n -> n % 2 == 0)\n.map(n -> n * n)\n.collect(Collectors.toCollection(()\
    \ -> new ArrayList<>(numbers.size() / 2)))\n```"
  - "[PAGE 198]\n\n```\n:numbers.stream()\n.filter(n -> n % 2 == 0)\n.map(n -> n *\
    \ n)\n.collect(Collectors.toList());\n```\n\nThis approach uses the more readable\
    \ stream-based code for smaller collections and switches to a more optimized version\
