  md: 'When reviewing code, it''s crucial to maintain a respectful and collaborative
    tone. The goal is to improve the code, not criticize the author. Phrases like
    “Have you considered...” or “What do you think about...” can make suggestions
    feel more like a collaborative effort rather than a critique.


    It’s also important for reviewers to explain the reasoning behind their suggestions.
    This helps the author understand the importance of the change and promotes learning
    within the team. For example:


    “Consider using a StringBuilder here instead of string concatenation in a loop.
    This can significantly improve performance for large datasets because StringBuilder
    is mutable and more efficient for multiple string operations.”


    Code reviews should also check for adherence to team coding standards and best
    practices. This includes consistent formatting, proper use of design patterns,
    and following agreed-upon conventions. Tools like linters and static code analyzers
    can help automate some of these checks, allowing reviewers to focus on more complex
    issues.


    Reviewers should be mindful of the scope of their suggestions. While it can be
    tempting to suggest large-scale refactoring during a review, it’s often more productive
    to focus on improvements that can be reasonably implemented within the context
    of the current changes. Larger refactoring efforts should be discussed and planned
    separately.'
