    interchangeably with their base classes.

    3. Favor composition over inheritance when possible, using interfaces to define
    behavior.

    4. Avoid deep inheritance hierarchies, as they can become difficult to understand
    and maintain.

    5. Use polymorphism to eliminate conditional logic based on type, but be cautious
    of overusing it for simple scenarios.'
