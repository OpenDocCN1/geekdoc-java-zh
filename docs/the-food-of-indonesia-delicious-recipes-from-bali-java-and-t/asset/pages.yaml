  md: 'of a buffet. Portions of as many as 20 dishes are carried from their display
    counter and placed on the table in front of you. You help yourself to whatever
    you want, paying only for what you eat. If you don''t fancy the goat braised in
    a rich spicy coconal gravy, never mind, try the chicken in coconut with lemongrass,
    back slices of beef dender, large prawns poached with ginger, or eggs in spicy
    sambal—the list goes on and on.


    Most people describe Padang food as spicy, but dry spices are only one part of
    the story. In the market of Bukittinggi, where the proud Minang women are clothed
    in vivid purple velvet, there are mounds of cinnamon, pepper, coriander, chili
    powder, cumin and fennel—and also fresh chilies, ginger, garlic, shallalots, galangal,
    turmeric, lemongrass, fragrant lime and salam as pungent dried shrimp paste. Nearby
    lie pies of ripe coconututs, their flesh grated to make the rich, creamy milk
    that soothes (only slightly) the impact of the spices.


    # Endless islands, endless variety


    With thousands of miles of the coastline, the orchid-shaped island of Sulawesi
    (Celebes) at the center of the archipelago is renowned for its freshly-caught
    fish. Ikan bakar, fish roasted over charcoal and served with a variety of dipping
    sauces, is a regional favorite, one of my most memorable meals in Sulawesi in
    the highlands of Tana Toraja, where the villages lie marooned like islands in
    a vast sea of clouds.


    Assured to see the famous Torajan cliff burial sites with their ever burning by
    the deceased, I asleep from Masakar to Rantepao. After a couple of hours'' sleep,
    I noticed the sight of people on the road from my countrymen. We headed for the
    funeral, the most important event in the Torajan life and an occasion for mutual
    ritual fasting.


    Not long afterwards, I was seated in the bamboo shelter built for the guests during
    the funeral celebrations. Streams of steam billowed from bamboo pots filled with
    hot palm wine (tua), and pigs were stung by heat from bamboo poles. The inevitable
    and gruesome slaughter of pigs and water buffalo was followed by the preparation
    of pork, bamboo tubes stuffed with chunks of lightly-saed meat, fresh beef, spinach
    leaves and the bamboo tubes were roasted over an open fire. Eaten with excellent
    rice and washed down with huo, this was a meal I will never forget.


    Feasts are also common in Bali, and I have spent many happy hours helping chop
    and pound seasonings, coloring rice cakes and composing ritual village temple
    offerings. Even relatively simple food in Bali can be excellent. Other Indonesians
    may sniff that the Balinese prefer their seasoning by adding coconut rather than
    using only milk or chicken...


    ![](img/84810ddf87352f3d89892fec747b364a_8_0.png)


    chopped seafood or poultry mixed with coconut and molded around stalks of fragrant
    lemongrass, the best stay I ever saw in the entire archipelago.


    The interiors of the so-called wilds of Borneo bring back many wonderful meat
    of wild boar caught in the surrounding forest and smoked over a fire of tender,
    sweet meat so melting up the whole soul, and wild ferns that baby rival asparagus
    for flavor


    Travel in Indonesia has many places, not just the destination but en route. Buses
    stop at 2 am so that passengers can buy snacks from the villagers who sell, in
    the light of their flickering kerosene lamps, for the liking of which they are
    renowned. Passengers on board ship their home-prepared boneless food fish or sticky
    rice rolls. Endless islands, endless variety, generosity. One could go on eating
    across Indonesia.


    caption: Tribes from the Bali valley in Javan starting to eat the inevitable meat
    of wild potatoes. A plentiful supply of bamboo makes it a logical cooking utensil
    in Tana Toraja, Sulawesi. The Torajan men are preparing pork—bamboo tubes stuffed
    with meat—for a funeral.


    Food in indonesia'
