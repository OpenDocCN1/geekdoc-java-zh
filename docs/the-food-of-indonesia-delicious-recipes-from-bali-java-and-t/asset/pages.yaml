  md: 'The food was eventually cooked and a leaf filled with pork was handed to me
    by an incredibly filthy woman. It smelled like sweet pork. As I sat staring at
    the steaming pork, I thought of all the diseases I might catch. Sheer hunger and
    desperation won out. Unwrapped the little packet of sausage in the valley, I tore
    some on the pork and took my first mouthful. Moist, sweet, full of flavor—I will
    never forget my Dani pig feast! The sweet potatoes tasted steamed in this earthy
    oven (and I suffered no ill-effects whatsoever).


    By contrast, the Javanese city of Yogyakarta seems to be located on an entirely
    different planet. Ancient stone temples—including the famous Borobudur and the
    exquisite Hindu temple Prambanan—rise up from the surrounding land with rich volcanic
    ash.


    The people of Yogyakarta and nearby Surakarta are proud of their refined culture,
    their dances, *gamel music*, batik and intricate handicrafts. This is a highly
    structured society in which harmony depends upon consideration for others and
    the group is more than the individual. Ritual events are marked by a communal
    feast (*selamatan*), it was appropriate that our arrival in the household of a
    Yogyakarta family, where we were to stay for a year, was the occasion for such
    a feast.


    Prayers were said to confess upon our family and everyone present. The centerpiece
    of a cone-shaped mound of yellow rice, the selamatan, symbolic of the holy Mount
    Meru, although most Muslim, Buddhist and Hindu observances are still incorporated
    in their rituals. At least, including *gudeg* (young fruit steamed in palm sugar,
    coriander and coconut milk); fried chicken with palm sugar; red chili sambal,
    and deep-fried crispy shall—a harmonious blend of fermented soybean cakes (*tempeh*)
    fried with shrimp and sweetened with palm sugar, shrimp crackers (*krupuk*). The
    overall impression is one of subtlety and sweetness that is quintessentially Javanese.


    At another end of the spectrum is the food of the west Sumatra region of Padang.
    If you like hot and spicy food, do Padang restaurants are found in most cities
    throughout the country—you''ll have no hesitate in calling this the best cuisine
    of Indonesia. In a nation full of stunning scenery, the rugged mountains, lakes
    and glorious coastline of Sumatra more than enough. The picturesque view of Bukittinggi
    (“High Hill”), the heart of the Minangkab people, is perfect for sampling the
    local food.


    This is one of few finest cuisines found in a restaurant or simple eating shop;
    it is the spicy counter


