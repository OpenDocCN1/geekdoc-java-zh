  md: '# Authentic Indonesian Recipes


    Portions

    In Indonesia, as most Asian countries, food is served in individual portions.
    Large serving bowls of rice and other main dishes are normally placed on the table
    for diners to help themselves family style. Small amounts of the main dishes are
    eaten with copious amounts of fluffy boiled rice. It is difficult to estimate
    the exact number of portions each recipe will provide. As a general rule, however,
    the recipes in this book will serve 4 to 6 people as part of a meal with 3 or
    4 other dishes.


    Pickles, Sambals and Dipping Sauces

    Cucumber Pickles


    Indonesian seasonings

    The quantities of chili, sweet Indonesian soy sauce (kecap manis) and dried shrimp
    paste (tris) given in the following recipes are to be taken as approximate guides,
    without absolute measures. Bear in mind that you can always increase the amount
    of seasonings later before serving, if you overdo it in the initial stages, you
    cannot reduce the seasonings later.


    +   - 1 cucumber, peeled, halved lengthwise, deseeded and sliced

    - 1 tablespoon white vinegar

    - 2/2 tablespoons sugar

    - 1 teaspoon salt

    - 2/2 tablespoons hot water


    Place the cucumber in a bowl. Combine the vinegar, sugar, salt and hot water in
    another bowl, then add to the cucumber and mix well. Set aside to cure for 1 hour
    before serving. This pickle keeps for a week in the refrigerator.


    Pickles and sambals

    The pickles and sambals given on pages 31 to 34 can be stored in a well-sealed
    glass jar in a refrigerator for some. Like Acar Segar, Segunda and Sambal Tris
    (a sambal is a chili sauce or spicy relish) can be served as appetizer or side
    dishes with a meal. It is not unusual to find bowls of different pickles and sambals
    on the dining table in an Indonesian home.


    Makes 1

    Preparation time: 10 mins + 1 hour to cure


    Ingredients

    Many Indonesian ingredients are now available in well-stocked supermarkets outside
    of Indonesia—like dried shrimp paste (tris), black shrimp paste (petels), kencur
    (zedoary), coconut cream and lemongrass. The names on the packages may be different,
    or similar or identical ingredients from Singapore, Malaysia, Thailand and Vietnam
    are called by different names in countries. Check the ingredient listings on pages
    22 to 27 for these alternative names and look for ingredients that are more difficult
    to find in Asian specialty shops.


    Mixed Vegetable Pickles

    Acar Segar


    +   - 1 small cucumber, peeled, deseeded and cut into matchsticks

    - 1 small carrot, peeled and cut into matchsticks

    - 8 shallots, peeled and quartered

    - ½ cup (180 ml) water

    - 3 tablespoons white vinegar

    - 1 tablespoon sugar

    - 1 teaspoon salt


    Tips on grinding\When using a mortar and pestle to prepare spice pastes, it helps
    to peel and slice all the ingredients before grinding them. Grind ingredients
    first before the softer ones. If using a blender, add a little liquid (oil, coconut
    milk or water, depending on the recipe) to keep the mixture thin. Be not to over-blend
    the——if the quantity is too large, pulse in batches and grind each batch before
    the next. If you have to roast some ingredients before grinding, which is usually
    the case with dried shrimp paste (tris), allow them to cool before grinding. Spice
    pastes need only be ground coarsely—not to a puree. Store unused spice pastes
    in plastic wrap or an airtight container in the refrigerator or freezer.


    Place the sliced vegetables in the bowl. In another bowl, combine the vinegar,
    sugar, and salt and then add to the vegetables and mix well. Set aside to cure
    for 2 or 3 days in the refrigerator before serving. This pickle keeps for 2 weeks
    in the refrigerator.


    Time estimates

    Time estimates are for preparation and curing, and are based on the assumption
    that a food processor or blender will be used.


    Makes 2

    Preparation time: 20 mins + 2 to 3 days to cure


    Pickles, Sambals and Dipping Sauces 31'
