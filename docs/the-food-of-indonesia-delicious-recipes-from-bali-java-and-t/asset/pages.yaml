    \ plants and were too valuable to eat! Nutmeg fruit, the fleshy covering of the\
    \ hard nut used as a spice, however is picked as a snack. It is also the traveler's\
    \ friend, considered good for seasoning, while cloves are the universal cure for\
    \ a toothache.\n\nWhile these are indigenous spices, some of the others used in\
    \ Indonesian cooking came from the Middle East or India, or from fibrous cardamom\
    \ pods containing tiny black seeds known in the Middle Ages as \"grains of paradise,\"\
    \ native to India and Sri Lanka. True cinnamon grows in Sri Lanka, while the coarse\
    \ bark generally sold as cinnamon in Indonesia and other parts of Southeast Asia\
