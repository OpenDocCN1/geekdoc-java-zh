  md: '# # Authentic Indonesian Ingredients


    Banana leaves infuse a delicate flavor and aroma to foods. They are often used
    as wrappers when steaming or grilling dishes, or as little trays to hold food
    when cooking. Soft them in boiling water before use to prevent them from cracking
    when wrapping foods.


    be used as a substitute, although less-expensive almonds or cashews will also
    do. Candlenuts are never eaten raw or on their own, but are chopped and cooked
    with seasonings and spice mixes for flavor and texture. They go rancid quickly
    because of their high oil content, so by small quantities and keep refrigerated.


    ![](img/84810ddf87352f3d89892fec747b364a_23_0.png)


    Bean sprouts commonly used in Indonesia are sprouted from mung beans. Soybean
    sprouts are available but are less common. Purchase sprouts fresh as they lose
    their crisp texture quickly. They will keep for a few days, however, if kept in
    the refrigerator immersed in a tap of water.


    Caramom pods (kepulaga) are used to flavor cuisines and desserts—giving foods
    a hearty, sweet scent. The fibrous, star-colored pods enclose 15-20 pigment, black
    seeds. Whole pods are bruised lightly with a cleaver or a pestle before use. Try
    not to use ground cardamom as it is virtually inferior to the whole pods.


    Carambola a pale green fruit (5-8 cm) long. It grows in clusters and is related
    to the large starfruit. Carambola is used whole or sliced to add a sour tang to
    soups, fish dishes and sambals. Substitute tamarind juice or grapefruit.


    ![](img/84810ddf87352f3d89892fec747b364a_23_1.png)


    Candlenuts (buah kemi) are creamy, cream-colored nuts similar in size and texture
    to macadamia nuts, which can


    Celery (selden) is often referred to as "Chinese celery" in Indonesia. The stems
    are slender and more fragrant than regular celery vegetable. The leaves are generously
    used as a garnish on soups and stews. Substitute celery or Italian parsley.


    ![](img/84810ddf87352f3d89892fec747b364a_23_2.png)


    Basil is often used as a seasoning and garnish in Indonesian cooking, and there
    are several types. The most commonly used basil is Asian basil or selasih and
    similar to European and American sweet basil. It is used liberally as a seasoning
    and springs of it often added to plates of fresh vegetables. Lemon basil (kemangi)
    is similar but with a distinct citrus fragrance. Holy basil, known as kaprow in
    Thailand, has a fragrant redolent of cloves. Its taste is sharp and hot it is
    used mainly in stir-fries. Asian basils are generally available in Asian food
    stores and many supermarkets, but sweet basil makes an acceptable substitute.


    ![](img/84810ddf87352f3d89892fec747b364a_23_3.png)


    Chayote (choko) is an oval, green squash with a small white seed. When boiled,
    the seed is not edible, but also very delicious. Sold in well-stocked supermarkets
    and Latino stores. Substitute zucchini.'
