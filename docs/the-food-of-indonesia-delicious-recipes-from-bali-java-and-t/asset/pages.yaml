  md: '![](img/84810ddf87352f3d89892fec747b364a_11_0.png)


    Indonesia''s cuisines, especially in the major islands, have borrowed ingredients
    and cooking styles from many sources over the centuries. Arab and Indian traders
    brought their spices, sweet rose essence and one or two dishes (including Indian
    sugar Martabak, a type of pancake found at the street food stalls).


    The Spanish were responsible for the introduction of chillies, which were discovered
    in the New World and carried to the islands of the Philippines. These fiery fruits
    swept throughout Southeast Asia and India, and are so finally established as part
    of the local cuisine that it''s hard to imagine what the food was like without
    them.


    During the long period as colonial rulers, apart from the introduction of new
    vegetables and bread, they had an enormous impact on the local cuisines. The so-called
    ''rijsttafel'' which was a colonial invention, a larger-than-life adaptation of
    the Indonesian style of serving rice with several savory dishes and condiments.
    With time, money and plenty of servants to make almost anything possible, the
    Dutch developed a ''rice table'' where as many as 18-25 dishes grew, each served
    into the dining room by a maid or unformeden ''boy''.


    It is the Chinese that had the greatest influence on Indonesian cooking. They
    introduced the ubiquitous ingredients (like soy sauce, which the Indonesians modified
    to make their tasty kecap manis); bean sprouts (tauge); tofu and soybeans, also
    used to make the excellent and nutritious tempeh.


    # Islands that changed the world


    Apart from the crumbling remains of Portuguese and Dutch forts, there''s little
    that sets several small Moluccan islands apart from countless other islands in
    Indonesia. Yet five of these islands were once the only place in the world where
    cloves grew, while another group, the Bandas, were the sole source of nutmeg and
    mace. These islands were literally responsible for starting the Age of Exploration
    and for the discovery of the Americas by Christopher Columbus.


    With todays refrigeration and food processing, it''s hard to fully appreciate
    the importance of spices in earlier times. Cloves, pepper and nutmeg were sought
    by the Romans, Egyptians and Chinese as long as 2000 years ago, used to add flavor
    and to mask the flavors of less-than-fresh meat, to permeate the air during funerals
    and to be used in medicines.


    During the Middle Ages, the spice trade in Europe was controlled by Arab merchants,
    who purchased spices from Indian traders. They kept prices astronomically high
    by supplying Venetian merchants, who distributed the spices to the rest of Europe.
    For the search of such spices and rare and expensive items—worth far more gold
    or precious metal—Christopher Columbus set to sail upon the Indies (he thought
    he was going to Indonesia). Other voyages of exploration were made by the Portuguese,
    who eventually reached the Spice Islands of Indonesia at the beginning of the
    16th century, followed by the Spanish, English and Dutch.'
