  md: '# # Wrapping Foods in Banana Leaves


    The muli-purpose food wrapper


    Steaming, grilling or frying foods that have been wrapped in banana leaves imparts
    a subtle fragrance to them. Before wrapping, cut the leaves into rectangles, rinse
    them well and scald them in a basin by by pouring boiling water over them. This
    softens the leaves so that they bend easily without cracking when you fold them.


