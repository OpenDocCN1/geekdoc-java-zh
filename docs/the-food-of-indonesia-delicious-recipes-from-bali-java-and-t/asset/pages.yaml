    mountain, Meru, while yellow is the color of royalty and one of the sacred colors
    for Hindus. Even on Muslim Java, this festive dish remains popular, is accompanied
    by Sambal Trasi (page 33), Classic Grilled Chicken (page 64) and Eggs in Fragrant
    Lemongrass Sauce (page 76).


