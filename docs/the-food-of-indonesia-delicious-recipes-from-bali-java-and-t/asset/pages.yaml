    2 Peel and devein the shrimp. Open the stinkbean pods and reserve the beans, about
    35 of them. Discard the pods.

    3 To make the Spice Paste, grind all the ingredients to a smooth paste in a mortar
    or blender, adding a little oil if necessary to keep the mixture fragrant, 3 to
    5 minutes. Stir gently.

    4 Heat the oil in a wok over medium heat and stir-fry the Spice Paste until uncovered
    until the sauce has thickened. Add the stinkbeans (if using) and coconut milk
    and bring to a boil, stirring gently. Add the sliced potato, carrot, chill (if
    using) and tamarind juice, and mix well. Bring the ingredients to a boil and simmer
    for 3 to 5 minutes. Add the shrimp and simmer for 2 to 3 minutes until the shrimp
    turns pink. Season with the sugar (if using) and salt, remove from the heat.

