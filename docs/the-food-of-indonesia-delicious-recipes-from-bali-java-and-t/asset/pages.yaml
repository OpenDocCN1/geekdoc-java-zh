  md: '# # Martabak Pancakes with Curried Meat Filling


    This Indian Muslim speciality, a night-time favorite, is often bought as a snack
    or light meat meal from food stalls.


    +   2 tablespoons oil

    4 cloves garlic, minced

    12 oz (350 g) ground lamb or beef

    1 onion, diced

    1 small leek, halved lengthwise and very thinly sliced

    1 red finger-length chili, deseeded and sliced

    3 minced celery leaves

    1 tablespoon curry powder

    2 eggs

    1 spring onion, thinly sliced

    ½ teaspoon salt

    ½ teaspoon ground white pepper

    Green chillies, deseeded, to serve (optional)

    1 portion Mixed Vegetable Pickles (page 31), to serve


    Dough


    +   2 cups (300 g) flour

    3 tablespoons oil

    ¾ cup (185 ml) water

    ½ teaspoon salt


    +   1 Prepare the Mixed Vegetable Pickles by following the recipe on page 31.

    2 Make the Dough by combining and kneading the ingredients at room temperature
    for 2 hours, in an oily, elastic dough. Cover and set aside at room then quarter
    each piece into a ball. Lightly roll a rolling pin and roll the Dough on an oiled
    smooth surface to make a large thin circle. Repeat with the rest of the Dough
    and set aside.

    3 To prepare the filling, heat the oil in a wok or skillet over high heat and
    stir-fry the garlic for a few seconds until fragrant and brown. Add the ground
    meat and stir-fry until it changes color, about 2 minutes. Add the onion, leek
    and celery leaves, and blended, stir-fry for 2 more minutes. Add the curry powder
    and stir-fry until well blended, 2 to 3 minutes. Remove from the heat and set
    aside to cool. Divide the filling into 4 equal portions: Add 1 egg, a spring onion,
    salt and pepper to each portion and mix well.

    4 Heat a heavy girdle or skillet over medium heat until hot. Place 1 portion of
    the filling on the center of each Dough. Then fold the sides of the Dough to completely
    enclose the filling. Place the package on the griddle or pan-fry until golden
    brown, 2 to 3 minutes, flip it over and fry the other side until browned. Repeat
    with the rest of the Dough and filling.

    5 Serve hot with fresh chillies (if using) and a bowl of the Mixed Vegetable Pickles
    on the side. For a more elaborate presentation, garnish with spring onions, chillies
    and celery leaves.


    Makes 4 Martabak Preparation time: 30 mins + to prepare the pickles

    Cooking time: 25 mins'
