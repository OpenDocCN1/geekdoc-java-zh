  md: "# # Classic Nasi Goreng Indonesian Fried Rice\n\nOne of Indonesia's most popular\
    \ dishes, Nasi Goreng is prepared in countless ways and is eaten morning, noon\
    \ and night. This classic version is accompanied by fried egg, fried chicken,\
    \ satay and krupuk (deep-fried shrimp crackers) for a substantial meal. Any sort\
    \ of leftover or fresh meat may be added, but the true flavor of Indonesia comes\
    \ from the pungent chilies and trasi (dried shrimp paste).\n\n+   - 5 cups (500\
    \ g) cooked cold rice or leftover rice\n- 3 tablespoons oil\n- 4-5 shallots, peeled\
    \ and sliced\n- 2 cloves garlic, peeled and sliced\n- 1-2 red-finger length chilies,\
    \ diced and minced\n- 2 teaspoons dried shrimp paste (trasi), dry-roasted (2-3\
    \ g)\n- 5 oz (150 g) fresh shrimp, peeled and diced\n- 1 cup (200 g) leftover\
    \ chicken, lamb or beef, diced\n- 2 cups (250 g) thinly sliced cabbage\n- 1 tablespoon\
    \ salt\n- 1 tablespoon Indonesian soy sauce (kecap manis)\n- Sliced cucumber and\
    \ sliced tomato, to garnish (optional)\n cucumber and sliced tomato, to garnish\
    \ (optional)\n\n+   1 Prepare the Javanese Fried Chicken, Beef Satay, Crispy Fried\
    \ Shallots, Sambal Kecap and Mixed Vegetable Pickles by following the respective\
    \ recipes.\n2 Flake the cold rice with a fork or your fingers to separate the\
    \ grains. Set aside.\n3 Lightly grease a non-stick skillet with a little oil and\
    \ fry the eggs side up. Remove from the heat and set aside.\n4 Heat the oil in\
    \ a wok over medium heat and stir-fry the shallots, garlic, minced chili and dried\
    \ shrimp paste until fragrant, 1 to 2 minutes. Add the cabbage and leftover cooked\
    \ meat, and stir-fry until the cabbage is slightly wilted, about 2 minutes. Increase\
    \ the heat to, add the rice, salt and sweet Indonesian soy sauce, and stir-fry\
    \ briskly until the ingredients are mixed well and heated through, about 2 minutes.\
    \ Remove from the heat Transfer the rice to a serving platter, with the fried\
    \ eggs and arrange the fried chicken and satays on the side. Garnish with cucumber\
    \ and tomato slices (if using) and serve with the Accompaniments on the side.\n\
    \nAccompaniments\n1 portion Javanese Fried Chicken (page 67)\n1/2 portion Beef\
    \ Satay (page 38)\nCrispy Fried Shallots (page 34)\n1 portion Sambal Kecap (page\
    \ 33)\nKrupuk shrimp crackers (page 24)\n1/2 portion Mixed Vegetable Pickles (page\
    \ 31)\n\n> Note: It is essential to use cold rice for this dish. Freshly cooked\
