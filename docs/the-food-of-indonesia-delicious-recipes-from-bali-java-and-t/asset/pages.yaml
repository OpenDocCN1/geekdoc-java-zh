    # Manadonese Ginger Pork


    In Northern Sulawesi, where many of the population are Christians and Chinese,
    the Muslim strictures on eating

    pork do not apply.


    +   - 1/2 lbs (700 g) boneless pork

    shoulder or leg

    - 2½ in (6 cm) fresh ginger, peeled

    and sliced

    - 2-3 finger-length chilies,

    deseeded

    - 3 shallots, peeled

    - 2 tablespoons oil

    - 5 k lime leaves

    - 2 turmeric leaves (optional)

    - 3 stalks lemongrass, thick bottom

    only, outer layers discarded,

    inner part bruised and sliced

    - 1/2 teaspoon salt


    +   - 1 Cut the pork into bite-sized chunks. Set aside.

