  md: '# # Grilled Fish with Basil and Tomato Sambal


    Ikan Bakar Colo Colo


    Fish, grilled plain or wrapped in banana leaves, is very popular on the eastern
    indonesian islands of Sulawesi and Maluku. This recipe is very simple—flavored
    with a typical Colo Sambal.


    +   - 21 whole fresh fish (about 2 lbs/1 kg), or 11½ lbs (700 g) fish steaks

    - 1/2 teaspoon salt

    - 1 tablespoon freshly squeezed lime or lemon juice

    - 2 tablespoons oil

    - 1 large banana leaf or aluminum foil, for wrapping

    - Colo Sambal

    - 3–4 red finger-length chilies or bird''s-eye chilies, deseeded and sliced

    - 4 shallots, peeled and sliced

    - 2 ripe tomatoes, diced

    - 4 sprigs Asian basil, minced

    - 4 tablespoons sweet Indonesian soy sauce (kecap manis)

    - 2 tablespoons freshly squeezed lime or lemon juice


    +   1 If using whole fish, scale, gut and clean the fish, then make several diagonal
    slits on each side. Season the fish with the salt and lime or iemon juice, then
    brush it with the oil. Set aside for 15 minutes.

    2 Make the Colo Colo Sambal by combining all the ingredients in a bowl and mixing
    well.

    3 Scald the banana leaf in a basin by pouring boiling water over it, then wipe
    it dry. Wrap the parcel directly over hot charcoal or under a preheated broiler
    until the banana leaf is evenly browned and the fish is,one, 10 to 15 minutes
    on each side.

    4 Unwrap the fish parcel and spoon the sambal over it. Serve immediately. Alternatively
    serve the Colo Colo Sambal in a small bowl on the side.


    Serves 4 Preparation time: 20 mins Cooking time: 30 mins'
