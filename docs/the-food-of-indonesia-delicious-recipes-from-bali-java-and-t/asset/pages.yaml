  md: '# Pork Stewed with Tomatoes


    A simple recipe from Kalimantan, where pork (particularly wild boar from the jungle)
    is popular among the Dyaks.


    +   - 1/2 lbs (700 g) pork

    - 4 tomatoes, cut into wedges

    - 4-6 garlic chives (kucai) or spring

    onions, cut into lengths

    - 1 stalk lemongrass, thick bottom

    only, outer layers discarded, inner

    part bruised

    - 1 cup (250 ml) water


    +   - 1 Cut the pork into bite-sized chunks.

    - 2 Grind the Spice Paste ingredients to a smooth paste in a mortar or blender,
    adding a little water if necessary to keep the mixture turning.

    - 3 Bring the Spice Paste and all the other ingredients to a boil in a wok or
    saucepan, then simmer over medium heat until the pork is tender, 3 to 5

    minutes, adding a little sugar if the tomatoes are quite sour and a little water

    if the sauce dries before the meat is cooked. Remove from the heat and

    serve immediately with steamed rice.


