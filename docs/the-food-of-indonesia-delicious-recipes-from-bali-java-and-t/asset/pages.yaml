  md: 'The faded Spice Islands of Indonesia encompass the most astonishing physical
    and cultural diversity in Asia. This book introduces a sampling of the most popular
    recipes across the archipelago. Included recipes spicy Padang favorites from West
    Sumatra, healthy Javanese vegetable creations, succulent satays and barbecued
    poultry dishes from Bali and Lombok, and unusual recipes from Kalimantan and the
    remote eastern isles of Indonesia.


    Heinz von Hol, a chef and restaurateur in Bali, trained in native Switzerland
    before working in Australia and Singapore and coming to Bali in 1990. He wrote
    the first cookbook ever published on Bali''s fascinating cuisine in 1993. An enthusiastic
    food photographer since 1987, he coordinated the recipes and photographed the
    food within this volume as well.


    Lother Arsana has over 20 years of experience as a chef and is responsible for
    the Indonesian cuisine served at the Grand Hyatt Bali. He has been involved in
    food promotions internationally, and has an extensive knowledge of Indonesia''s
    regional cuisines.


    The Food of Indonesia presents 79 easy-to-prepare recipes with detailed descriptions
    of cooking methods and ingredients, enabling you to reproduce the flavors of the
    Spice Islands at home.


    Wendy Huton is a writer and editor specializing in cuisine and travel, and has
    lived in Southeast Asia since 1967. She has written many books on the food of
    Southeast Asia, including Southeast Asia''s Best Recipes, Tropical Asian Cooking
    and A Cook''s Guide to Asian Vegetables.


