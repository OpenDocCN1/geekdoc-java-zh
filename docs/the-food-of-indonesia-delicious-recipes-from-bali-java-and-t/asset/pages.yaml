  md: '# # Food in Indonesia


    # A Cuisine Exiting and Diverse as the Country Itself


    Indonesia is the world''s largest archipelago—thousands of tropical islands ranging
    from the world''s largest to tiny coral atolls marooned in a sapphire sea. With
    snow-capped mountains and lush rainforests, and savannahs and irrigated fields,
    it''s hard to imagine a more appropriate motto for this Bhinneka Tunggal-Ika—unity
    in diversity.


    Eating your way around the archipelagonWhat do a feast of pig steamed over hot
    stones in an eastern oven, a ritual selamatan centered upon a golden rice mellow
    by Muslim prayers, a bamboo tube of buffalo meat spiked with roasted coals over
    a fire, and days of minced seafood with spices and fresh coconut after all? They''re
    just some of the foods I have enjoyed in travels throughout Indonesia more than
    two decades.


    Over the past two thousand years, Buddhist and Hindu kingdoms rose and fell in
    Sumatra, Java and Borneo, attracting merchants from far away as China, the Middle
    East and, as well as Siam the archipelago''s eastern islands were the original
    Spice Islands—the only places in where clove and nutmeg grew free, and a more
    powerful for traders and pilgrims.


    Visitors encountering the limited modern and nasi goreng found in most Indonesian
    restaurants might be brave thinking that there''s more than urban variety in diversity.
    The food here is simple (as opposed to those run by migrants the ubiquitous soto
    or mie bakes) when you arrive is a feast of one, or best of all, to stay in Indonesia
    then, that you have a chance of discovering the Indonesia''s native cuisines.


    European explorers and merchants were not far off. Portuguese, English and Dutch
    ships set forth on voyages of discovery to these islands during the 16th and 17th
    centuries. The Dutch were the victors in battle for control over the region, implementing
    a plantation system on the main islands, wherever to produce sugar, spices and
    coffee (the crop that grew best). A nationalist movement arose as early as 1908,
    but not until 1949 that the Republic of Indonesia came to power, being after an
    armed struggle against the Dutch Indonesia''s declaration of independence in 1945.


    3,200 feet (1,000 meters) in the highlands of I Guinea, lies a fertile, stream-lashed
    valley isolated from the world by most impassable mountains and jungle-conquered
    The Bali Valley, discovered by expedition in 1938 and visited by the first anthropologists
    in 1961, is the home of the Stone Age Dani people. They are gardeners growing
    a variety of vegetables, yet 90 percent of their diet consists of rice and sweet
    potatoes. Some 70 varieties of preparations of vegetables.


    With its gastronomic cultural diversity, the diversity of Indonesia is tremendously
    varied. Also, whereas in Indonesia focuses on Java and Sumatra, non-islands we
    agree that each region has its own distinct cuisine. These regional styles have
    been influenced by diversity over the centuries by ingredients and cultures from
    China, India, Europe and other parts of Asia.


    While trekking in this beautiful valley in 1976, we met a family where hospitality
    was taking place. Indonesian Dani are hospitable and literally dragged me and
    my young child into a tent to join what proved to be a brave feast. The men, in
    pierced ears, faces painted with colored clay, and feathers in their silky black
    hair, adorned playing bamboo hoops. The women, naked in a short skirt perched
    precariously on their hips and ankles-free shoulders, busy wrapped wrapped of
    meat in leaves and stacked on on river stones heated by a fire.


    A "typical" Indonesian meal might be described as a simple round of rice accompanied
    by savory side dishes of vegetable, fish or perhaps a poultry dish, with a chili-hot
    condiment on the side and various crispy wafers (krupuk) and fried shrimp on the
    plate to provide a crunchy texture. While such a description might be valid for
    Java, Sumatra and Bali, in other areas of the archipelago, the meat might be made
    of cassava, yams or corn instead of rice.


    The whole pot was fed then they left to eat—just like a Masi horn, as a child,
    I had regarded as to unique New Zealand


    Increasing numbers of visitors are discovering the rich cultural diversity of
    venturing, off the beaten path Java-Sumatra tourist track. Let us take you on
    a voyage of culinary discovery, exploring the unknown and revealed about the local
    freedom


    OPPOSITE: The base is of every meal, with sides of meat, poultry or vegetables
    that provide crunchy dishes and the ubiquitous hot sambals or chili sauces and
    relieves.'
