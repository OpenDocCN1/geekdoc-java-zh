  md: '# Beef Soup with Chilies and Tamarind


    This soup from Timor in eastern Indonesia has a wonderful sweet-sour edge to it.


    +   - 8 cups (2 liters) water

    - 2 lbs (1 kg) top round or stewing beef

    - 3 tablespoons oil

    - 4-5 shallots, peeled

    - 2 cloves garlic, peeled

    - 1 teaspoon dried shrimp paste (trasi), dry-roasted chili paste (23)

    - 2 tablespoons shaved palm sugar or dark brown sauce

    - 1 tablespoon sweet Indonesian sauce (kecap manis)

    - 2 tablespoons tamarind juice (page 26)

    - 1 tablespoon salt

    - 1-2 red finger chillies, deseeded and sliced into strips

    - 2 spring onions, cut into short lengths


    +   1. Bring the water to a boil in a large pot. Add the beef, reduce the heat
    to simmer until the meat is half cooked, about 15 minutes. Turn off the heat.
    Remove the beef from the stock and drain. Strain and reserve the stock.

    2. When cool enough to handle, cut the beef into cubes. Heat 2 tablespoons of
    the oil over medium heat in a skillet and pan-fry the beef until cooked, 2 to
    3 minutes. Remove from the heat and set aside.

    3. Grind the shall, garlic, dried shrimp paste and sugar to a smooth paste in
    a mortar or blender, adding a little water if necessary to keep the mixture turning.
    Set aside.

    4. Heat the remaining oil in a wok over medium heat and stir-fry the ground paste
    until fragrant. Add the beef cubes and Indonesian soy sauce, stir-fry for 2 minutes,
    then pour in the reserved beef stock and tamarind juice, season with the salt.
    Bring the soup to a boil, simmer uncovered until the beef is tender, 10 to 15
    minutes. Adjust the taste with more salt or tamarind juice as desired, stir in
    the sliced chillies and spring onions, and remove from the heat. Serve hot.


