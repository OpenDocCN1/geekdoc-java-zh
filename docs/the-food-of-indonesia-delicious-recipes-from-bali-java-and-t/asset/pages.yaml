  md: '# Banana Fritters


    This is a great way to use up-ripe bananas, mashing them up with flour, sugar
    and coconut cream, and deep-frying them.


    +   2 large or 6 small over-ripe bananas

    (about 10 oz/300 g), peeled

    1 tablespoon sugar

    1/4 teaspoon salt (optional)

    1 tablespoon flour

    1/4 cup (60 ml) coconut cream

    Oil, for deep-frying


    +   1 In a mixing bowl, mash the bananas with the sugar, salt (if using), flour
    and coconut cream in a sticky, slightly moist batter.

    2 Heat the oil in a wok or large saucepan until very hot. Using very moist fingers,
    pinch about 1 heaped tablespoons of the batter, roll it into a ball and gently
    lower it into the hot oil. Deep-fry for 3 to 5 minutes, turning occasionally until
    crispy and brown on all sides. Do not crowd the pan with the batter or the temperature
    of the oil will drop. Remove from the hot oil and drain on towels.

    3 Transfer to serving plate and serve with ice cream or a bit of coconut cream
    on top.


    Serves 4 Preparation time: 10 mins Cooking time: 15 mins


    # Steamed Banana Cakes Kue Nagasari


    Bananas are the most widely available fruit throughout Indonesia, so it''s not
    surprising they feature in many desserts and cakes.


    +   6 small or 2 large ripe bananas

    1 1/4 cup (150 g) rice flour

    4 tablespoons bean flour or

    tapioca flour

    2 cups (500 ml) thin coconut milk

    1/4 cup (50 g) sugar

    Pinch of salt

    Twelve 7-in (18-cm) square pieces of

    banana''s leaf, for wrapping

    Toothpicks, to fasten


    +   1 Peel and halve each small banana or if using large bananas, slice each into
    1/2-inch (1cm) thick slices. Set aside.

    2 Combine both types of flour and 1 1/2 cups (325 ml) of the coconut milk in a
    bowl and mix into a batter, free of any lumps.

    3 Combine the remaining coconut milk, sugar and salt in a saucepan, and heat over
    medium heat, mixing until the sugar is dissolved. Bring to a boil, pour into the
    batter and cook for 10 minutes, stirring constantly until the mixture thickens,
    then remove from the heat and set to cool.

    4 Scald the bananas by pouring boiling water over them in a basin, so they become
    flexible. Drain and place the bananas on a clean work surface.

    5 Wrap the cakes, spread 2 tablespoons of the flour mixture across the center
    of a banana leaf. Lay a slice of the banana on top and then spread 2 tablespoons
    of the flour mixture over it, covering the banana. Wrap by folding one end of
    the banana leaf over the filling, forming a tight parcel. Tie both ends and defasten
    with toothpicks. Continue to wrap the remaining ingredients in this manner.

    6 Steam the parcels in a wok on rolling boiling water or in a steamer for about
    20 minutes. Remove from the heat and allow to cool before serving.


    > Note: Mung flour (tepung kwe) is used in paper-wrapped cylinders—sometimes,
    the flour is colored pink or green and the paper wrapper correspondingly colored.
    It gives a more delicate texture to desserts than rice flour, although the latter
    is an acceptable substitute.


    Makes 12 cakes Preparation time: 25 mins Cooking time: 35 mins'
