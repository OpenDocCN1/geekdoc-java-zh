  md: '# # The Indonesian Kitchen


    A combination of simplicity and practicality


    One of the many surprising aspects of Indonesia is the way such delicious foods–often
    complex blending of herbs, spices and seasonings–come out of the simplest of kitchens.
    The gleaming modern designer kitchen tiled surfaces, electric appliances and hot
    and cold water is unknown to the majority of Indonesians. Kitchens are far from
    rustic, with meals cooked over a wood fire or a kompor, a kerosene burner. In
    many urban areas, gas burners fueled by LPG are commonly used.


    Preparing Indonesian food in your kitchen requires a fair amount of skill as the
    many utensils needed is not that great (see following section). First and foremost
    you need something to grind or crush the seasonings (bumbu) that form the base
    of countless Indonesian dishes and are also used as condiments for sambals. In
    Indonesia, a saucer-shaped mortar with a pestle, made of volcanic stone, is very
    often used. Unlike Malaysia and Thailand, where the ingredients are pounded with
    a deep mortar, the Indonesian cobek rubs ingredients with a backward motion across
    the stone, which is slightly rounded by use.


    A mortar and pestle is very ideal for small amounts of ingredients, most modern
    cooks would use a food processor, blender or spider the easiest way to prepare
    the basic spice paste or rempah. Small spice grinder attachments are widely available
    now and very handy for many dishes


    Also important is a chopper and board. This pair provides a myriad of tasks: chopping
    up into the required size, cutting vegetables; finely mincing meat or fish in
    the form of food. The flat side of the cleaver is used to lemongrass, cardamom
    or galangal (to the garlic) and so on. In Asia, a thick cross-section of a tree
    trunk is used as a chopping board; this type of board is durable and functional.
    With a cleaver that has a blade 3-4 (7-10 cm) wide.


    A wok, basically a conical pan, is used for frying for many dishes. Known as a
    kwal (or in Javanese), this versatile utensil is practical for deep-frying (which
    uses less oil) and also allows the right amount of evaporation for many dishes
    which begin with a large amount of liquid and finish with a dry spice.


    A heavy iron wok that won''t tip easily is preferable, or best of all, the Rolls
    of Royce, which is


    made of a non-stick alloy that will not scratch when metal scoops are used. To
    partner your work, a metal spatula and a perforated ladle for dipping deep-fried
    food, are useful.


    Indonesian cooking also uses an assortment of coconut aluminum or cast iron sauces
    for cooking food. Many recipes contain acidic ingredients, as tamarind juice or
    lime, or coconut milk, and using aluminum or cast iron will ruin the sauce or
    cause a chemical taste. Either stainless steel, glass or enamel saupans.


    One item used in Indonesian cooking is seldom available outside. This is the multi-purpose
    banana leaf, used for wrapping food, steaming, or placing directly on hot coals.
    The variety of the banana leaf is remarkable it illustrates 24 different ways
    of wrapping food in banana leaves, depending on the contents and the style of
    preparation! If you are able to obtain banana leaves, wipe them clean and use
    them to wrap the food. Boiling water in a basin until it softens before using
    to wrap. Aluminum foil can be substituted by wrapping the food in paper first,
    then in foil. The wrapped food is then steamed usually inside cold water steaming
    baskets to steam rice.


    The kitchen in Indonesia is known to have a Chinese steamer with a cover. This
    steamer sits inside a wok above the boiling water. The bamboo lid, as it absorbs
    moisture retard


    An alternative to the bamboo steamer is a perforated metal disc that sits inside
    a wok above the boiling water, however, this will not hold as much food as a two-tiered
    steamer, and you will need to find a cover that fits your work.


    PROCURE: The traditional mortar and pestle made of volcanic stone is commonly
    found in Indonesia, an essential tool for preparing the spice pastes that are
    a part of every Indonesian recipe. The basic spice paste or rempah consists of
    shallots, ginger, galangal, lemongrass and candies, with other spices or herbs
    often added as


    ![](img/84810ddf87352f3d89892fec747b364a_18_0.png)'
