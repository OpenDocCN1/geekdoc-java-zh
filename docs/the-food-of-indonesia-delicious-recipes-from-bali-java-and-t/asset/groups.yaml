    Rice flour is made from ground uncooked rice grains. It is used to make the dough
    or batter for many desserts.


    Sago flour is made from ground sago palm and imparts a very subtle flavor and
    delicate texture to desserts. Solid in plastic packets in Asian specialty shops.


    Lemongrass (serai) is a fragrant, lemon stalk that is either bruised and used
    in soups or curries, or sliced and used as part of a basic spice, sold in bunches
    of 3 to 4 in supermarkets. The tougher outer layers should be peeled away and
    only the inner part of the thick lower third of the stem is used. Always slice
    the stem before grinding to get a smooth paste.


    Palm sugar (gula jawa) is sold as a solid block or cylinder of sugar made from
    the sap of coconut or arenga sugar. It varies in color to light brown and has
    a caramel taste. It is used to make Palm Sugar Syrup (page 104). To measure, hard
    palm sugar should be shaved, grated or melted in a microwave oven. Substitute
    dark brown sugar.


    Salam leaves, from the cassia family, are used in the same way they are used in
    Western cooking—to add a complex earthy fragrance to dishes. If unavailable, omit
    from the recipe altogether. Do not substitute with bay leaves as the flavor is
    totally different.


    Limes of several types are used in Indonesia. Round yellow-skinned limes (jeruk
    nipis) are significantly larger than a golf ball. The small, dark green limes
    (jeruk limau) are used for their fragrance and juice. Other types of limes may
    also be used.


    Pandan leaves impart a subtle fragrance and green hue to a range of Indonesian
    dishes. They are usually tied in a knot and added to a liquid recipe. Bottled
    pandan extract can be substituted in desserts, but if fresh or dried pandan leaves
    are not available, omit them from savory dishes. Vanilla essence may be substituted
    instead.


    Star anise (bunga lawang) is an 8-pointed dried pod enhancing shiny black seeds
    with an anise flavored aroma. The whole is used when cooking and is discarded
    before serving. Whole star anise keeps for years in an airtight container.


    Mung bean flour (tepung hoang kwe) is sold in paper-wrapped cylinders—sometimes,
    it is colored pink or green and the paper wrapper is correspondingly colored.
    It gives a more delicate texture to desserts than rice flour.


    Nutmeg (pala) is the inner kernel of the fruit of the nutmeg tree. The leaf covering
    the nutmeg is another spice—may grate whole nutmeg just before using the powdered
    spice loses its fragrance quickly. While nutmegs keep almost indefinitely.


    Soy sauce is brewed from soybeans and fermented with salt. It is salty and used
    as a table dip or cooking seasoning. Black soy sauce is denser and salty than
    regular soy sauce. Sweet soy adds a smoky flavor to dishes. Sweet soy sauce (kecap
    manis) is much sweeter and thicker than normal soy sauce. It has palm sugar and
    molasses added. Sweet Chinese sauce may be substituted or you can just add dark
    brown sugar to normal soy, or try to find Indonesian kecap manis if you can, because
    it has a distinctive flavor.


    ![](img/84810ddf87352f3d89892fec747b364a_26_0.png)


    Tamarind (asam jawa) is a fruit that is often sold dried in Indonesia, still encased
    inside its long narrow tree pod. Outside of Indonesia, the pulp is more often
    used in jams and packets already shelled, but containing some fibers and seeds.
    It is used as a souring agent in many dishes. To obtain tamarind juice, mash pulp
    into 2 parts water and strain. If using already cleaned tamarind pulp, reduce
    the amounts called for in the recipes. The dried pulp keeps indefinitely in an
    airtight container.


