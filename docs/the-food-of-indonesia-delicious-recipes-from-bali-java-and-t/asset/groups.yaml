    ## Chicken with Green Tomatoes and Sambal Ayam


    This recipe comes from Kalimantan, where it is usually made with sour tomatoes.
    The lemon juice makes a delicious counterpoint to the spiciness of the dish.


    - fresh chicken (2 lbs/1 kg)

    - 1 teaspoon salt

    - 1 tablespoon freshly squeezed lime or lemon juice

    - 2 cups (500 ml) water

    - 3-4 finger-length chilies, deeeded

    - 5-10 shallots, peeled

    - 4 unripe tomatoes

    - 1 spring basil

    - 1 kaffir lime leaves

    - 2 spring onions

    - 1/2 in (1 cm) fresh galangal, peeled and sliced


    ### Fragrant Chili Sambal

    - 1/4 teaspoon freshly grated nutmeg or ground nutmeg

    - 3-4 finger-length chilies, seeded

    - 5-6 shallots, peeled

    - 3 cloves garlic, peeled

    - 1 teaspoon salt

    - 2 tablespoons shaved palm sugar or dark brown sugar

    - 1 tablespoon dried shrimp paste (trasi), dry-roasted (page 23)

    - 1 tablespoon oil

    - 1 salam leaf

    - 1 stalk lemongrass, thick third only, outer layers discarded, inner braised


    1. Clean and cut the chicken into serving pieces. Season the chicken pieces with
    the salt and lime and lemon juice, then set aside to marinate for at least 20
    minutes.

    2. Make theant Chili Sambal by grinding the ingredients to a smooth paste in a
    mortar or blender, adding a little oil if necessary to keep the mixture turning.
    Heat the oil in a wok or skillet over medium heat and stir-fry the ground paste
    with the salam leaf, lemongrass and galangal fragrant. 3 to 5 minutes. Add the
    tamarind juice and bring the mixture to a boil, then reduce the heat to low and
    simmer for about 1 minute. Remove from the heat and set aside to cool.

    3. Bring the water to a boil in a wok or large saucepan. Add the marinated chicken
    and simmer uncovered over medium heat until the chicken is just tender, 5 to 10
    minutes. Add all the other ingredients, well mix and cook for 15 more minutes
    before removing from the heat. Serve immediately with a bowl of Fragrant Chili
    Sambal on the side or serve mixed with the fragrant Chili Sambal.


    Serves 4 to 6 | Preparation time: 45 mins | Cooking time: 40 mins


