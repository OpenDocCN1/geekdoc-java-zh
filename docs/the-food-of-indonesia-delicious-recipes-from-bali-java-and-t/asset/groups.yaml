    ## Pork Stewed with Tomatoes


    A simple recipe from Kalimantan, where pork (particularly wild boar from the jungle)
    is popular among the Dyaks.


    - 1/2 lbs (700 g) pork

    - 4 tomatoes, cut into wedges

    - 4-6 garlic chives (kucai) or spring onions, cut into lengths

    - 1 stalk lemongrass, thick bottom only, outer layers discarded, inner part bruised

    - 1 cup (250 ml) water


    1. Cut the pork into bite-sized chunks.

    2. Grind the Spice Paste ingredients to a smooth paste in a mortar or blender,
    adding a little water if necessary to keep the mixture turning.

    3. Bring the Spice Paste and all the other ingredients to a boil in a wok or saucepan,
    then simmer over medium heat until the pork is tender, 3 to 5 minutes, adding
    a little sugar if the tomatoes are quite sour and a little water if the sauce
    dries before the meat is cooked. Remove from the heat and serve immediately with
    steamed rice.


    ### Spice Paste

    - 1 in (2.½ cm) fresh ginger, peeled and sliced

    - 2-3 red finger-length chilies, deseeded

    - 4 shallots, peeled


    Serves 4 to 6 Preparation time: 15 mins Cooking time: 5 mins


    ## Manadonese Ginger Pork


    In Northern Sulawesi, where many of the population are Christians and Chinese,
    the Muslim strictures on eating pork do not apply.


    - 1/2 lbs (700 g) boneless pork shoulder or leg

    - 2½ in (6 cm) fresh ginger, peeled and sliced

    - 2-3 finger-length chilies, deseeded

    - 3 shallots, peeled

    - 2 tablespoons oil

    - 5 k lime leaves

    - 2 turmeric leaves (optional)

    - 3 stalks lemongrass, thick bottom only, outer layers discarded, inner part bruised
    and sliced

    - 1/2 teaspoon salt


    1. Cut the pork into bite-sized chunks. Set aside.

    2. Grind the ginger, chilies and shallots coarsely in a mortar or blender, adding
    a little water if necessary to keep the mixture turning. Set aside.

    3. Heat the oil in wok over medium heat and stir-fry the ground mixture fragrant,
    for about 2 minutes, reduce the heat to low, cover the pork and all the other
    ingredients and stir-fry pork in its own juices until tender, 3 to 5 minutes.
    Add a little warm water if the gravy dries up before the meat is cooked. Remove
    from the heat and serve with steamed rice.


    Serves 4 to 6 Preparation time: 15 mins Cooking time: 15 mins


    ## Balinese Black Rice Pudding Bubur Injin


    It''s hard to find a foreign visitor to Bali who does not fall in love with the
    wonderful nutty flavor and melt-in-your mouth texture of Black Rice Pudding, served
    with swirls of delicious coconut cream on top.


    - 1 cup (200 g) uncooked black glutinous rice (see note)

    - 3/4 cup (150 g) uncooked white glutinous rice

    - 6 cups (11/2 liter) water

    - 2 pandanus leaves, tied into a knot,

    - 1 drop vanilla extract

    - 1/4 cup (50 g) shaved palm sugar or dark brown sugar

    - Pinch of salt

    - 1/2 cup (125 ml) coconut cream


    1. Rinse both types of glutinous rice in several changes of water until runs clear,
    and soak overnight.

    2. In a saucepan, bring the glutinous rice, water and pandanus leaves to extract
    to a boil over medium heat and simmer uncovered for about 40 minutes, stirring
    occasionally until the rice is soft and cooked, with porridge-like consistency.
    Discard the pandanus leaves, if using. Add the palm sugar and stir until the sugar
    is dissolved. Reduce the heat to low and simmer for about 5 minutes before removing
    the heat.

    3. Combine the coconut cream and salt in a bowl and mix well.

    4. To serve, spoon the pudding into individual serving bowls and top with the
    salted coconut cream.


    > Note: *Black glutinous rice* is a variety of glutinous rice found mainly in
    Indonesia. Normal glutinous rice may be substituted, although the texture is not
    quite the same.


    Serves 6 to 8 Preparation time: 10 mins + overnight soaking Cooking time: 50 mins


    ## Fried Bananas Pisang Goreng


    There are many ways of cooking bananas in Indonesia. Here are two examples, but
    you can also add coconut cream to the batter or coat the bananas with grated coconut
    (as shown on left).


    - 1 cup (125 g) rice flour or plain flour, sifted

    - 1/3 cup (80 ml) water

    - 1/3 cup (80 ml) coconut cream

    - 1/4 teaspoon salt

    - Oil, for deep-frying

    - 8 small finger bananas, peeled and halved, or 4 regular bananas, peeled and
    halved


    1. Place the flour in a mixing bowl. Make a well in the middle and add the water,
    coconut cream, and salt. Gradually incorporate the flour into the liquid to make
    a smooth dough.

    2. Heat the oil in wok until moderately hot. Dip the bananas into the batter and
    deep-fry for 5 to 10 minutes, turning occasionally, until golden brown and crispy.

    3. Transfer to a serving platter and serve with ice cream.


    Serves 4 to 6 Preparation time: 15 mins Cooking time: 20 mins


    ## Coconut Cake


    - 2 cups (200 g) desiccated coconut

    - 3/4 cup (120 g) glutinous rice

    - 1/2 cup (120 ml) milk

    - 1/2 cup (50 g) sugar

    - 1/4 cup (50 g) rice flour

    - 1/2 teaspoon salt


    1. Combine all ingredients in a mixing bowl; knead until smooth and pulls away
    from the sides.

    2. Preheat the oven to 350°F (180°C). Dust a cake with a little flour and press
    the dough into it.

    3. Bake in the oven for about 35 minutes until the cake is golden brown and cooled.

    4. To remove the cake from the pan, run a knife between the pan and it, then invert.


    Serves 6 to 8 Preparation time: 10 mins Cooking time: 35 mins


    ## Glutinous Rice Cakes with Palm Sugar Wajik


    There are many variations on this popular cake, which can be stored in the refrigerator
    for several days. It is normally served at room temperature, but can be served
    warm topped with coconut cream. Another variation adds diced jackfruit or raisins
    when the rice is partially cooked.


    - 1 cup (200 g) uncooked glutinous rice

    - 1/2 cup (50 g) shaved palm sugar

    - 1/2 cup (125 ml) water

    - 1 pandanus leaf, tied in a knot, or 1 drop vanilla extract

    - 1/4 cup (60 ml) coconut milk

    - Pinch of salt


    1. Rinse the rice in several changes of water until the water runs clear, soak
    overnight.

    2. Line a steamer basket with cheesecloth and spread the rice evenly over the
    cloth. Steam the rice for 15 minutes, then turn and fluff it up with a fork and
    steam for 10 minutes until cooked.

    3. In a saucepan, bring the sugar and water to a boil over medium heat timer uncovered,
    stirring until the mixture has reduced to halt, about 15 minutes. Add all the
    ingredients and mix well. Continue simmering for 3 to 5 more minutes and remove
    from the heat.

    4. Combine the glutinous rice and coconut milk in a saucepan and mix well, cook
    over low heat, stirring from time to time, until the mixture thickens and becomes
    sticky, 10 to 15 minutes. Remove from the heat and discard the pandanus leaf,
    if using.

    5. Transfer the cake to a lightly greased shallow cake pan or tray, smoothing
    the surface with the blade of a wet spoon, and set aside to cool. Cut the cake
    into squares or diamond shapes and serve at room temperature.


    Serves 6 to 8 Preparation time: 10 mins + overnight soaking Cooking time: 1 hour
    10 mins

