    # 用香蕉叶包裹食物


    多功能食物包装材料


    用香蕉叶包裹食物进行蒸、烤或煎炸，可以赋予食物一种清新的的香气。在包裹之前，将叶子切成矩形，冲洗干净，并放入盆中用沸水烫一下。这能让叶子变软，使其在折叠时容易弯曲而不会断裂。


