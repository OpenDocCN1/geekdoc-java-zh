    ## 节日姜黄米饭 (Nasi Kuning)


    用姜黄染色并制成锥形的米饭是巴厘和爪哇答节庆期间常见的景象。这种锥形形状呼应了神话中的印度教须鲁山（Meru），而黄色是皇室的颜色，也是印度教徒的神圣颜色之一。即使在穆斯林的爪哇答，这道节日菜肴依然受欢迎，通常配有
    Sambal Trasi（第 33 页）、经典烤鸡（第 64 页）和香柠檬茅汁水煮蛋（第 76 页）。


    - 2 英寸（5 cm）新鲜姜黄，去皮并切片，或 2 茶匙姜黄粉

    - 1/2 杯（60 ml）水

    - 1/2 杯（300 g）生米，洗净并沥干

    - 1/2 杯（375 ml）椰子奶

    - 1/2 杯（125 ml）鸡汤，或将 1/4 茶匙鸡汤颗粒溶解在 1/2 杯（125 ml）温水中

    - 1 片苏拉叶（salam）或香兰叶

    - 1 根香柠檬，仅取厚实的三分之一，去掉外层，内里部分拍碎

    - 1 英寸（2-1½ cm）新鲜高南姜，去皮并切片

    - 1 茶匙盐


    ### 配菜

    新鲜切块的黄瓜和番茄

    - 1 份 Sambal Trasi（第 33 页）

    - 1 份烤鸡（第 64 页）

    - 1 份 Sambal Goreng Tempeh（第 60 页）

    - 1 份香柠檬茅汁水煮蛋（第 76 页）

    - Emping（洋山参果脆片）


    1. 按照各自的配方准备配菜。

    2. 在研钵中将姜黄和水研磨至细腻。通过筛网滤出所有汁液。弃掉固体。如果使用姜黄粉，请将粉末溶解在 2 汤匙水中。

    3. 将米、姜黄、椰子奶、鸡汤、苏拉叶或香兰叶、高南姜和盐放入锅中，大火煮沸。转中火，盖盖锅慢煮至液体被吸收，需 10 到 15 分钟，然后转至小火煮 5
    到 10 分钟，直到米饭干燥且蓬松。离火并拌匀。或者，也可以用电饭煲烹制米和配料。

    4. 弃掉苏拉叶或香兰叶、香柠檬和高南姜。如果需要，将煮好的姜黄米饭压成锥形。盛出米饭并配上配菜。


    供 4 至 6 人享用准备时间：15 分钟 + 配菜准备时间烹饪时间：15 分钟 + 配菜准备时间


