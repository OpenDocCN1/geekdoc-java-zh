    # # Sayur Vegetables in Sweet Tamarind Broth


    4 cups (1 liter) water

    2 salam leaves (optional)

    1 (2½ cm) fresh galangal, bruised

    1 fresh or frozen corn cob, into sections


    200 (8 g) hypo leaves, sweet potato leaves, spinach and melonjo leaves (see note)

    100 (1 g) green beans, into short lengths

    2 to 3 finger-length chillies, deseeded, and cut into short lengths (optional)


    1½ cup (75 g) lightly boiled peas or fresh melonjo nuts

    1¼ cup (60 ml) tamarind juice (page 26) or 4 to 6 carambola (belimbing wuluh),
    sliced

    1½ cup (125 g) fresh shrimp, deseeded (optional)


    1 ripe tomato, cut into wedges

    2 tablespoons sugar

    1½ teaspoon salt

    Spice Paste

    2 to 4 finger-length chillies, deseeded

    4 shallots, peeled

    3 cloves garlic, peeled

    1½ teaspoon salt


    +   1 Make the Spice Paste by grinding all the ingredients into a smooth paste
    with a mortar or blender, adding a little water if necessary to keep the mixture
    tender. Set aside.


    +   2 Bring the water to a boil over medium heat in a saucepan. Add the Spice
    Paste, salam leaves (if using) and galangal, mix well and bring to a boil, then
    simmer for 2 minutes. Add the vegetables, chillies (if using), peanuts and tamarind
    juice or coconut water. Bring the mixture to boil until the vegetables are tender,
    3 to 5 minutes. Finally add the shrimp, tomato and sugar, and simmer for 1 to
    2 minutes until the shrimp turn pink. Remove from the heat and serve hot as part
    of a rice-based meal.


    In Asia, the tender leaves of many vegetable plants are cooked as vegetables.
    Tapioca leaves, sweet potato leaves and melonjo leaves are readily available in
    Indonesia. Substitute water spinach (kangkung), regular spinach or bok choy.


    Serves 4 to 6 Preparation time: 30 mins Cooking time: 20 mins


    # # Water Spinach with Coconut and Spicy Dressing Pelecing Kangk


    10 oz (300 g) water spinach

    (kangkung) or regular spinach

    1 kaffir lime

    1 clove garlic, peeled

    1 tablespoon palm sugar or dark brown sugar

    1 cup (100 g) freshly grated coconut

    3 bird''s-eye chillies or red finger-length chillies, deseeded

    1½ teaspoon dried shrimp

    (trasi), dry-roasted (page 23)

    1 tablespoon salt

    1 tablespoon freshly squeezed lime or lemon juice

    2 tablespoons warm water

    2 tablespoons roasted unsalted peanuts

    4 to serve

    4 limes, halved, to serve


    +   1 Wash the spinach well and discard the tough stems. Cut them into lengths.
    Boiling in water for 1 to 2 minutes, then set aside on a plate.


    +   2 Grind the kaffir lime leaf, palm sugar and grated coconut in a blender until
    smooth and set aside in a bowl, then grind the chillies, dried shrimp paste, salt,
    lime or lemon juice and water to a smooth paste.


    +   3 To serve, the blanched spinach with the dried shrimp paste mixture. Sprinkle
    the grated coconut and peanuts on top and serve with halves on the sides.


    If spinach is not available, substitute any other leafy vegetable such as spinach
    or Chinese cabbage.


    Serves 4 Preparation time: 20 mins Cooking time: 2 mins'
