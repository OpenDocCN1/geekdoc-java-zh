    5 garlic cloves, peeled

    1/2 tablespoon dried dried shrimp paste (trasi), dry-roasted (page 23)

    1 teaspoon salt

    2 tablespoons oil

    1 cups (250 ml) coconut milk


    Makes 24 satays or serves 4 to 6 Preparation time: 25 mins + 2 hours to marinade
    Cooking time: 30 mins'
