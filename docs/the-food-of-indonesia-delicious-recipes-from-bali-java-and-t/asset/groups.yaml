    食物终于做好了，一个极其肮脏的女人递给我一片装满猪肉的叶子。它闻起来有甜肉的味道。当我坐着盯着冒着热气的猪肉时，我想到了自己可能感染的所有疾病。极度的饥饿和绝望战胜了理智。我在山谷中拆开那小包香肠，撕下一些放在猪肉上，吃下了第一口。湿润、甜美、滋味丰富——我永远不会忘记我的顿丹尼猪（Dani
    pig）大餐！红薯吃起来像是在这种土窑里蒸过一样（而且我完全没有受到任何副作用）。


    相比之下，爪哇的日万加塔（Yogyakarta）似乎位于另一个完全不同的星球。古老的石质寺庙——包括著名的罗布兰石佛寺和精美的印度教寺庙普兰巴南寺——从富含火山灰的土地上拔地而起。


    日万加塔和附近的苏加卡塔（Surakarta）人以他们精致的文化、舞蹈、*甘兰音乐*、蜡染和复杂的手工艺品为自豪。这是一个高度结构化的社会，其和谐取决于对他人的体谅，且集体胜于个人。仪式性活动以社区宴会（*selamatan*）为标志，我们入住一个日万加塔家庭（我们将在那里住一年），举办这样一场宴会是非常恰当的。


    人们祈祷并为我们一家和在场的每个人忏罪。宴会的核心是一个锥形的黄米堆，即 *selamatan*，象征着神圣的梅鲁山，尽管大多数是穆斯林，但许多佛教和印度教的习俗仍然被包含在他们的仪式中。至少包括
    *gudeg*（用棕糖、香菜和椰奶蒸熟的嫩果实）；棕糖炸鸡；红辣椒辣椒（sambal），以及油炸脆红葱——一种与虾仁油炸并用棕糖甜味的发酵大豆饼（*tempeh*）以及虾脆片（*krupuk*）的和谐融合。整体印象是微妙而甜美的，是典型的爪哇风味。


    在光谱的另一端是苏门答腊西部达当（Padang）地区的食物。如果你喜欢辛辣的食物，印尼大部分城市都能找到达当餐厅——你将毫不犹豫将其称为印尼最好的美食。在一个充满壮丽风景的国家里，苏门答腊崎岖的山脉、湖泊和壮丽的海岸线已经足够了。布基廷基（Bukittinggi，意为“高丘”）是米南加包人的核心区域，那里如画的风景是品尝当地美食的完美之处。


    这是餐厅或简单小吃店里有的少数顶级美食之一；它是自助餐中的辛辣对照。多达20道菜从展示台上被端出来，放在你面前的桌子上。你可以随心挑选任何想要的，只需为你吃的部分付费。如果你不喜欢用浓郁辛辣的椰奶汁煮的羊肉，没关系，试试椰子柠檬草鸡、香醋牛肉后脑片、姜水煮大虾，或者辛辣辣椒酱（sambal）鸡蛋——名单长得列不完。


    大多数人形容达当菜是辛辣的，但干香料只是故事的一部分。在布基廷基的市场里，自豪的米南加族女性穿着鲜艳的紫色天鹅绒衣服，那里堆着肉桂、黑胡椒、香菜、辣椒粉、孜然和茴香——还有新鲜的辣椒、生姜、大蒜、红葱、南姜、黄姜、柠檬草、芳香青柠和作为辛辣干虾膏的叶子。附近躺着成熟的椰子，它们的果肉被磨成浓郁、像奶油一样的牛奶，可以（轻微地）缓解香料的影响。


    ## 无尽的岛屿，无尽的品种


    拥有数千英里的海岸线，位于群岛中心的、兰花形状的苏拉西岛（Celebes）以新鲜捕获的鱼类闻名。烤鱼（Ikan bakar，炭火烤的鱼并配以各种蘸料）是当地的最爱，也是我在苏拉西岛塔纳托拉雅（Tana
    Toraja）高地最难忘的晚餐，那里的村庄像漂浮在广阔云海中的岛屿。


    为了看到著名的托拉雅悬崖墓（那里有为逝者永不熄灭的灯），我从马萨卡（Masakar）睡到了兰得跑（Rantepao）。睡了几个小时后，我注意到路上的同胞。我们前往葬礼，这是托拉雅人生活中最重要的活动，也是相互禁食的场合。


    不久后，我坐在葬礼庆祝期间为客人搭建的竹棚里。蒸汽从装满热棕酒的竹筒中涌而出。selamatan* 象征着神圣的梅鲁山，尽管大多数是穆斯林，但许多佛教和印度教的习俗仍然被包含在他们的仪式中。至少包括
    *gudeg*（用棕糖、香菜和椰奶蒸熟的嫩果实）；棕糖炸鸡；红辣椒辣椒（sambal），以及油炸脆红葱——一种与虾仁油炸并用棕糖甜味的发酵大豆饼（*tempeh*）以及虾脆片（*krupuk*）的和谐融合。整体印象是微妙而甜美的，是典型的爪哇风味。


