    ### Mixed Vegetable Pickles

    Acar Segar


    Ingredients

    - 1 small cucumber, peeled, deseeded and cut into matchsticks

    - 1 small carrot, peeled and cut into matchsticks

    - 8 shallots, peeled and quartered

    - ½ cup (180 ml) water

    - 3 tablespoons vinegar

    - 1 tablespoon sugar

    - 1 teaspoon salt


    ### Tips on grinding

    When using a mortar and pestle to prepare spice pastes, it helps to peel and slice
    all the ingredients before grinding them. Grind ingredients before the softer
    ones. If using a blender, add a little liquid (oil, coconut milk or water, depending
    on the recipe) to keep the mixture thin. Be not to over-blend—if the quantity
    is too large, pulse in batches and grind each batch before the next. If you have
    to roast some ingredients before grinding, which is usually the case with dried
    shrimp paste (tris), allow them to cool before grinding. Spice pastes need only
    be ground coarsely—not to a puree. Store unused spice pastes in plastic wrap or
    an airtight container in the refrigerator or freezer.


    Place the sliced vegetables in the bowl. In another bowl, combine the vinegar,
    sugar, and salt and then add to the vegetables and mix well. Set aside to cure
    for 2 or 3 days in the refrigerator before serving. This pickle keeps for 2 weeks
    in the refrigerator.


