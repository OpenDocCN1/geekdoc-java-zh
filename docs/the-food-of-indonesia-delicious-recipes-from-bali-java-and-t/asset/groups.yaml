    ![](img/84810ddf87352f3d89892fec747b364a_11_0.png)


    Indonesia''s cuisines, especially in the major islands, have borrowed ingredients
    and cooking styles from many sources over the centuries. Arab and Indian traders
    brought their spices, sweet rose essence and one or two dishes (including Indian
    sugar Martabak, a type of pancake found at the street food stalls).


    The Spanish were responsible for the introduction of chillies, which were discovered
    in the New World and carried to the islands of the Philippines. These fiery fruits
    swept throughout Southeast Asia and India, and are so finally established as part
    of the local cuisine that it''s hard to imagine what the food was like without
    them.


    During the long period as colonial rulers, apart from the introduction of new
    vegetables and bread, they had an enormous impact on the local cuisines. The so-called
    ''rijsttafel'' which was a colonial invention, a larger-than-life adaptation of
    the Indonesian style of serving rice with several savory dishes and condiments.
    With time, money and plenty of servants to make almost anything possible, the
    Dutch developed a ''rice table'' where as many as 18-25 dishes grew, each served
    into the dining room by a maid or unformeden ''boy''.


