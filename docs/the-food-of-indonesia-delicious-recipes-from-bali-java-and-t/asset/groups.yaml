    印度尼西亚调味品

    食材

    许多印度尼西亚食材现在可以在印尼外的优质超市买到——如干抽（tris）、黑虾膏、山姜（kencur）、椰奶和香茅。包装上的名称可能不同，或者来自新加坡、马来西亚、泰国和越南的类似原料名称不同。查看22至27页的食材列表获取这些替代名称，并寻找在亚洲特色食品店较难找到的食材。

