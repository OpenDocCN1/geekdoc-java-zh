    ## Grilled Chicken with Chili Sauce Ayam Taliwang


    Lombok''s most famous chicken dish is grilled over a charcoal fire and served
    with a spicy coconut sauce. This version suggests partially grilling the chicken
    and finishing it off by deep-frying. Alternatively, the chicken could be deep-fried
    only, depending on your preference.


    - 1 chicken (about 2 lbs/ 1 kg), cleaned and cut into serving pieces

    - 1 teaspoon salt

    - 1 red finger-length chili, thinly sliced, to garnish

    - Sprigs of basil leaves, to garnish


    ### Chili Sauce

    - 3-4 red finger-length chilies or 2-3 bird''s eye chilies, deseeded

    - 4 shallots, peeled

    - 1 teaspoon dried shrimp paste (trasi), dry-roasted (page 23)

    - 1 teaspoon shaved palm sugar or dark brown sugar

    - 1/4 teaspoon salt

    - 2 tablespoons oil

    - 1 tablespoon freshly squeezed lime or lemon juice


    1. Make the Chili Sauce by grinding the chilies, shallots, shrimp paste, sugar
    and salt in a mortar or blender, adding a little oil if necessary to keep the
    mixture turning. Heat the oil in a wok or skillet over medium heat and stir-fry
    the ground paste for 2 to 3 minutes until fragrant. Reduce the heat and set aside.
    If prepared in advance, reheat the Chili Sauce before serving. Add the lime or
    lemon juice and mix well.

    2. Season the chicken pieces with the salt and set aside for 5 minutes, then grill
    the chicken pieces over charcoal or under a preheated broiler until half-done
    for 2 to 3 minutes. Brush the chicken pieces on both sides with the Chili Sauce
    and continue to grill for 10 to 15 minutes, basting with the sauce, until cooked.
    Alternatively, after brushing with the Chili Sauce, deep-fry the chicken pieces
    in the hot oil until cooked.

    3. Spread the remaining Chili Sauce on the cooked chicken. Transfer to a serving
    platter, garnish with freshly sliced chili and serve with steamed rice.


    Serves 4 to 6 | Preparation time: 20 mins | Cooking time: 35 mins


    ## Balinese Duck or Chicken Curry Bebek Menenyat


    Ducks waddling along the banks of rice fields or following the flag held by their
    (or his) children are a common sight in Bali. In festive occasions, duck is a
    great favorite. Spiced stuffed duck baked in banana leaves (Bebek Betutu) is one
    popular recipe, this curry dish is another. Chicken is also delicious when cooked
    in this way—which is essentially the Balinese equivalent of a spicy Rendang.


    - 1 fresh duck or roasting chicken (about 4 lb/1.8 kg)

    - 2 tablespoons oil

    - 4 cups (1 liter) thick coconut milk

    - 2 stalks lemongrass, thick third only, outer layers discarded, inner part pruned

    - 2 salam (optional)

    - 1 tablespoon salt

    - 1 teaspoon freshly ground black pepper


    ### Spice Paste

    - 3 candlen, roughly chopped

    - 1 (2½ cm) fresh galangal, peeled and sliced

    - 1 (2½ cm) fresh kencur root, peeled and sliced

    - 1 (2½ cm) fresh turmeric, peeled and sliced, or 1 teaspoon turmeric

    - 2-3 red finger-length chilies, deeeded

    - 8-10 shallots, peeled

    - 6 cloves garlic, peeled

    - 2 cloves

    - 2 teaspoon coriander seeds or 1 teaspoon ground coriander

    - 1/4 teaspoon freshly ground black pepper

    - 1/4 teaspoon freshly grated nutmeg or ground nutmeg

    - 1 teaspoon dried shrimp paste (trasi), dry-roasted (page 23)


    1. Clean and cut the duck or chicken into serving pieces, then dry with paper
    towels.

    2. Make the Spice Paste by grinding all the ingredients in a mortar or blender
    until fine, adding a little of oil if necessary to keep the mixture turning.

    3. Heat the oil in a wok over high heat and stir-fry the Spice Paste until fragrant,
    about 1 minute. Add the duck or chicken pieces and stir-fry for 3 minutes. Add
    the coconut milk, lemongrass, salam, salt and pepper, mix well and bring to a
    boil. Reduce the heat to medium low and simmer uncovered, turning frequently,
    until the duck or chicken pieces are tender and the sauce has thickened, 30 to
    35 minutes. Remove from the heat. Garnish with Crispy Fried Shallots and serve
    with fragrant steamed rice.


    Serves 6 to 8 | Preparation time: 30 mins | Cooking time: 40 mins


    ## Buginese Chicken Stew Ayam Masak Bugis


    A Buginese favorite from Southern Sulawesi, this dish is prepared by simmering
    a whole chicken in seasoned stock and coconut milk.


    - fresh chicken (1 liter) chicken stock or 2 teaspoons chicken stock granules
    dissolved in 4 cups (1 liter) warm water

    - 2 cloves garlic, peeled and sliced

    - 12 shallots, peeled and sliced

    - 1 tablespoon dried shrimp paste (trasi), dry-roasted (page 23)

    - 2 tablespoons tamarind juice (page 26)

    - 1 teaspoon ground white pepper

    - 2 salam leaves

    - 1 cinnamon stick

    - 4 cloves

    - 1/4 teaspoon freshly grated nutmeg or ground nutmeg

    - 1 teaspoon salt

    - 1 tablespoon shaved palm sugar or dark brown sugar

    - 1 cup (250 ml) thick coconut milk

    - Crispy Fried Shallots

    - fresh chicken garnish


    1. Prepare the Crispy Fried Shallots (following the recipe).

    2. Clean and cut the chicken.

    3. Bring the stock to a boil in a a. Add the chicken and simmer uncovered over
    medium heat until tender, about 20 minutes.

    4. Add all the ingredients except the coconut milk. Simmer for 10 more minutes
    until the sauce is thickened.

    5. Pour the coconut milk in and simmer for 5 more minutes. Remove from the heat
    and garnish with Crispy Fried Shallots.


    Serves 4 | Preparation time: 25 mins | Cooking time: 40 mins


