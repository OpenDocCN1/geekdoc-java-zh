    # # Lamb Satay Sate Madura


    Normal with goat meat, this is probably the most popular type of satay in Indonesia,
    originating from the island of Madura to the northeast of Java.


    +   1/2 lbs (750 g) boneless lamb

    24 bamboo skewers, soaked in water

    for 4 hours before using

    lime wedges, to serve

    1 portion Sambal Kecap (page 33)

    1 portion Sambal Kacang (page 34)


    +   1 Cut the lamb into bite-sized cubes. Combine the Marinade ingredients in
    a bowl and mix. Pour two-third of the Marinade to the meat cubes, mix until well
    coated and allow to marinade for at least 2 hours. Reserve the remaining Marinade.

    2 Prepare the Sambal Kecap and Sambal Kacang by following the recipes on pages
    33 34. Set aside.

    3 Thread the marinated meat onto the bamboo skewers and grill over hot charcoal
    or under a preheated broiler for 5 to 7 minutes, turning and basting frequently
    with the reserved Marinade, until the meat is well cooked and browned on all sides.
