    ## Vegetables with Coconut Sauce


    7 oz (200 g) green beans, cut into lengths

    2 cups (180 g) spinach leaves or young tips fern (fiddleheads)

    1 cup (50 g) bean sprouts, with and tails discarded

    Crispy Shallots (page 34)


    ### Coconut Sauce

    1½ in (1 cm) fresh turmeric

    1 teaspoon ground turmeric

    2-3 bird''s eye chilies or ginger leaves, diced

    2-3 shallots, peeled

    2 cloves garlic, peeled

    1 tablespoon shaved palm sugar

    or dark brown

    1 tablespoon dried shrimp (trash), dry-roasted (page 23)

    1 cup (100 g) freshly grated coconut

    or sweetened desiccated coconut

    1 cup (250 ml) water

    1 salam leaf or bay leaf

    1¼ teaspoon salt


    1. Prepare the Crispy Shallots following the recipe on 34.

    2. Make the Coconut Sauce by grinding the turmeric, chilies, shallots, garlic,
