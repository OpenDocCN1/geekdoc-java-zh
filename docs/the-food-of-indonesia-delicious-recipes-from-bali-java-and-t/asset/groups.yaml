    # 甜味椰子煎饼 (Dadar)


    这些煎饼包裹着一种名为 *unti* 的甜味椰子内料，是一种受欢迎的零食，有时也用作早餐。


    - 1 杯 (150 g) 面粉，经过过筛的

    - 2 颗鸡蛋

    - 2 杯 (500 ml) 浓稠椰奶

    - 1/2 茶匙盐

    - 2 汤匙


    ### 椰子内料 (Unti)

    - 1/2 杯 (100 g) 棕榈糖或深色红糖

    - 1/4 杯 (60 ml) 水

    - 1 杯 (100 g) 现擦的椰子肉

    - 1/4 茶匙盐

    - 1 片香兰叶，打成结


    1. 在平底锅中将糖和水煮沸以制作椰子内料。转小火，不盖盖子慢煮约 10 分钟，期间偶尔搅拌，直到糖溶解且混合物变成糖浆。加入所有其他食材，不断搅拌烹煮 10
    到 15 分钟，直到混合物变干。离火，弃掉香兰叶并备用。


    2. 制作煎饼时，在搅拌碗中将面粉、鸡蛋、椰奶和盐混合，搅拌成光滑且具有流体浓度的面糊。滤掉任何结块。轻微涂抹不粘炒锅或煎锅，用小火加热。搅拌面糊，用汤子舀一勺（约
    3 汤匙）倒入锅中，转动锅使其形成一个薄的圆形层，直径约 7 英寸（18 厘米）。煎至煎饼定型并开始上色，翻面在另一面煎几秒钟，然后离火。继续制作煎饼直到面糊用完。


    3. 享用时，将煎饼放在平整面上，上面放上 2 汤匙椰子内料。将煎饼的一侧折叠到料上，折叠两侧并紧紧卷成圆柱形。同样的方法组装煎饼。


    注意：煎饼和椰子内料均可提前制作并冷藏；组装前使其恢复至室温。


    可制作 12 个煎饼 | 准备时间：45 分钟 | 烹饪时间：35 分钟


    # 香蕉酥 (Banana Fritters)


    这是一个利用熟香蕉的好方法，将它们压碎并与面粉、糖和椰奶油混合，进行油炸。


    - 2 根大香蕉或 6 根小熟香蕉（约 10 盎司/300 g），去皮

    - 1 汤匙 糖

    - 1/4 茶匙盐（可选）

    - 1 汤匙 面粉

    - 1/4 杯 (60 ml) 椰奶油

    - 食油，用于油炸


    1. 在搅拌碗中，将香蕉与糖、盐（如果使用）、面粉和椰奶油混合压碎，制成粘稠且略微湿润的面糊。

    2. 在锅或大平底锅中加热油至非常热。用非常湿润的手指捏起约 1 满满汤匙的面糊，揉成球，轻轻放入热油中。油炸 3 到 5 分钟，偶尔翻面，直到各面都金黄酥酥脆。不要让锅内面糊过多，否则油温会下降。从热油中取出并放在纸巾上沥油。

    3. 移至盘中，撒上冰淇淋或少量椰奶油即可。


    供 4 人享 | 准备时间：10 分钟 | 烹饪时间：15 分钟


    # 蒸制香蕉蛋糕 (Kue Nagasari)


    香蕉是印度尼西亚最常见的水果，因此它们出现在许多甜点和蛋糕中并不意外。


    - 6 根小香蕉或 2 根大熟香蕉

    - 1 1/4 杯 (150 g) 米粉

    - 4 汤匙 豆粉或木薯粉

    - 2 杯 (500 ml) 稀椰奶

    - 1/4 杯 (50 g) 糖

    -  少许盐

    - 十二块 7 英寸（18 厘米）的正方形香蕉片


    1. 将米粉、豆粉（或木薯粉）、稀椰奶、糖和盐混合，搅拌均匀。

    2. 在平底锅中将香蕉片加热，准备香兰叶。

    3. 将香蕉片放入香兰叶中，包裹好。

    4. 蒸锅中蒸制约 20 分钟。

    5. 冷却后享用。


