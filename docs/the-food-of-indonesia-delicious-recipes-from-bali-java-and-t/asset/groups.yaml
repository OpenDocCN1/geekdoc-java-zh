    ### 混合蔬菜腌

    Acar Segar


    配料

    - 1个小黄瓜，去皮去籽切丝

    - 1个小胡萝卜，去皮切丝

    - 8颗红葱，去皮切成四份

    - ½杯（180 ml）水

    - 3汤匙醋

    - 1汤匙糖

    - 1茶匙盐


    ### 关于磨碎的小贴士

    使用石臼准备香料时，提前将所有食材去皮并切片会有帮助。先磨质地较软的食材。如果使用搅拌机，加入少量液体（根据配谱加入油、椰奶或水）保持稀。不要过度搅拌——如果量太大，分批处理，磨好后再后再批。如果在磨碎前需要烘烤某些食材（干抽通常如此），请让其冷却后再磨。香料只需要粗磨——不需要磨成泥。将未使用的香料放入保鲜膜或密封容器冷藏或冷冻。


    将切好的蔬菜放入碗中。在另一个碗中混合醋、糖和盐，然后加入蔬菜中拌匀。放在冰箱中腌制2至3天后食用。这种腌菜在冰箱中可以保存2周。

