    - 1/2 (in) fresh tomato, peeled and sliced, and 1/2 teaspoon ground turmeric

    - 2 cloves garlic, peeled

    - 1 teaspoon coriander seeds

    - 2 kaffir lime leaves (optional)

    - 1/2 teaspoon salt


    Makes about 30 wafers Preparation time: 20 mins Cooking time: 25 mins


    Salads and Appetizers: 37


    ## Fragrant Beef Satay Sapi


    - 1 1/2 lbs (700 g) top beef

    - 30 Bamboo skewers, soaked in water for 4 hours before using

    - 2 portions Sambal Kacang (page 34)


    1. Prepare the Sambal Kacang by following the recipe on page 34.

    2. Cut the beef into 1-in (2½½-cm) cubes and set aside.

    3. Make the Spice Paste by grinding all the ingredients, except the oil and salam
    leaf, to a smooth paste in a mortar or blender, adding a little oil if necessary
    to keep the mixture turning. Heat the oil in a wok over medium heat and stir-fry
    the paste with the salam leaf for 3 to 5 minutes until removed from the heat and
    set to cool.

    4. When cooled, place the Spice Paste and the beef in a large bowl and mix well.
    Set in the refrigerator to maintain overnight.

    5. Soak bamboo skewers in water for 4 hours before using so they do not burn when
    grilling the meat. Thread the marinated beef onto the skewers and grill over charcoal
    or under a preheated broiler for 2 to 3 minutes on each baste, with the marinade.
    Turn the skewers frequently to prevent from burning, it should be browned on the
    outside and cooked on the inside.

    6. Arrange the satay on a serving platter and serve with a bowl of Sambal Kecap
    and Sambal Kacang on the side.


    - 4 shallots, roughly chopped

    - 2 (cm) fresh galangal, peeled and sliced

    - 1 (½ cm) fresh ginger, peeled and sliced

    - 2-3 red finger chillies, sliced

    - 5 shallots, peeled

    - 3 cloves garlic, peeled

    - 1½ teaspoon ground black pepper

    - 1 tablespoon coriander seeds

    - 3 tablespoons palm sugar

    - 1 teaspoon salt

    - 2 tablespoons oil

    - 1 salam leaf


    Serves 6 Preparation time: 45 mins + to marinate Cooking time: 45 mins


    ## Balinese Style Chicken or Duck Satay


    - 1 lb (500 g) chicken or duck

    - 2 cups (200 g) freshly grated coconut

    - 3 kaffir lime leaves, thinly sliced

    - 2 tablespoons shaved palm sugar

    - 1 teaspoon salt

    - 4 bamboo skewers

    - 2 portions Sambal Kecap (page 33)


    1. Prepare the Sambal Kecap by following the recipe on page 33.

    2. Make the Spice Paste by grinding all the ingredients, except the oil, to a
    smooth paste in a mortar or blender, adding a little oil if necessary to keep
    the mixture turning. Heat the oil in a wok over medium heat and stir-fry the paste
    for 3 to 5 minutes, remove from the heat and set aside to cool.

    3. When cooled, mix the Spice Paste with the ground chicken or duck and all other
    ingredients, except the skewers, well blended. Set aside to marinate for 2 hours
    in the refrigerator.

    4. If using bamboo skewers, soak in water for 4 hours before using. Mold 2 heaped
    tablespoons of the meat mixture onto either bamboo skewer with your hands and
    press it together to form a kebab. Repeat until the meat mixture is used.

    5. Grill the skewers over charcoal or under a preheated broiler for 2 to 3 minutes
    on each side, basting with the marinade, until cooked. Turn the skewers frequently
    to prevent the meat from burning. Arrange the satay on a serving platter and serve
    hot with Sambal Kecap.


    - 4 shallots, roughly chopped

    - 1/2 (cm) fresh galangal, peeled and sliced

    - 1/2 (cm) fresh kencur root, peeled and sliced

    - 1/2 (cm) fresh turmeric, peeled and sliced

    - 2 red finger chillies, desired

    - 4-6 shallots, peeled

    - 2 cloves garlic, peeled

    - 2 tablespoons coriander seeds

    - 1½ teaspoon freshly ground black peppercorns

    - Pinch of ground nutmeg

    - 1 tablespoon dried shrimp paste (trasi), dry-roasted (page 23)

    - 1 tablespoon oil


    Serves 4 to 6 Preparation time: 45 mins + 2 hours Cooking time: 20 mins


    ## Lotek Steamed Vegetables with Peanut Dressing

    The sauce served with this vegetable salad has ground peanuts for flavor and nutrition.
    It is said that Sudanese women have such beautiful skin when they eat so many
    vegetables.


    - 6 oz (175 g) water spinach (kangkung) or spinach

    - 6 oz (175 g) pumpkin or squash

    - 6 oz (175 g) green beans

    - 1 large potato, peeled and diced

    - 1 cup (50 g) bean sprouts, seed coats and tails discarded


    1. Make the Lotek by pulsing the peanuts in a blender until coarsely ground, then
    add the kencur, chilies, dried shrimp paste, palm sugar, salt and water to grind
    to a smooth sauce. Set aside.

    2. Prepare the vegetables, rinse and trim the young shoots of the spinach from
    the main stems. Peel and dice the pumpkin or squash. Cut the green beans into
    lengths. Bring a squash of water to a boil over medium heat, then blanch the vegetables
    until (about 30 seconds for the bean sprouts, 1 minute for the spinach, 1 to 2
    minutes for the pumpkin and 2 to 3 minutes for the green beans). Drain and place
    the blanched vegetables on a serving platter.

    3. Drizzle the dressing over the vegetables, then toss to coat each.


    - Lotek Dressing

    - 1/2 cup (75 g) fried or roasted unsalted peanuts

    - 3/4 cup (in dry) fresh kencur, peeled and sliced

    - 2-3 bird-eye-chilies, deseeded

    - 1/2 tablespoon dried shrimp paste (trasi), dry-roasted (page 23)

    - 1 tablespoon shaved palm sugar or dark brown sugar

    - 1 tablespoon salt

    - 2 tablespoons water


    Serves 4 Preparation time: 20 mins Cooking time: 5 mins


    ## Karedok Vegetable Salad with Palm Sugar Dressing

    The Sudanese of West Java are renowned for their love of vegetables, both raw
    and cooked, and often eat them as between-meal snacks. Serve Karedok with rice
    as part of a main meal.


    - 1/4 head cabbage

    - 1 small cucumber

    - 2 cups (100 g) bean sprouts, coats and tails discarded

    - 1 slender eggplant, thinly sliced

    - 1 cup (100 g) thinly sliced green beans

    - 2 tablespoons Crispy Fried Shall (page 34), to garnish

    - Kruuk shrimp crackers (page 24), to serve


    1. Prepare the Crispy Fried Shallots by following the recipe on page 34.

    2. To make the Karedok Dressing, grind all the ingredients to a smooth paste in
    a mortar or blender. Set aside.

    3. Separate the cabbage leaves, rinse and then slice them very thinly and place
    in a large bowl. Peel the cucumber, quarter it lengthwise and slice the quarters
    across vertically. Place in the bowl with the cabbage. Rinse and drain the bean
    sprouts and place in the bowl. Add the eggplant and green beans.

    4. Pour the Dressing over the vegetables and toss well. Garnish with Crispy Fried
    Shallots and serve with kruuk.


    - Karedok Dressing

    - 1 in (2½ cm) fresh kenc, peeled and sliced

    - 3-4 red finger-length-chilies, deseeded

    - 3 cloves garlic, peeled

    - 3 tablespoons shaved palm sugar or dark brown sugar

    - 1/2 tablespoon dried shrimp paste (trasi), dry-roasted (page 23)

    - 2 tablespoons tamarind juice (page 26)

    - 2 tablespoons warm water

    - 1 tablespoon salt


    Serves 4 Preparation time: 25 mins

