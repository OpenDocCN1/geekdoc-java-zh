    # Classic Grilled Chicken Ayam Panggang


    This is one of Indonesia''s most traditional dishes and plays an important role
    in many ceremonies. It is served on special occasions everywhere throughout the
    archipelago.


    +   -1 fresh chicken (2 lbs/1 kg)

    -2 tablespoons oil

    -2-3 bird''s eye chilies or finger-length chilies

    -3 stalks lemongrass, thick bottom third only, outer layers discarded, inner part
    brazised

    -2 1/2 cups (675 ml) thin coconut milk

    -2 cups (500 ml) chicken stock or 1 teaspoon stock granules dissolved in 2 cups
    (500 ml) warm water

    -2 salam leaves (optional)

    -1 teaspoon salt

    -1 teaspoon ground black pepper

    -1 teaspoon Siberian soy sauce (*kecap manis*), for glazing

    -1 portion Sambal Kecap (page 33)


    # Spice Paste


    +   -3 candlenuts, roughly chopped

    -1/2 in (1 cm) krench root, peeled and sliced (optional)

    -1 in (2 1/2 cm) fresh galangal, peeled and sliced

    -1 in (2 1/2 cm) fresh turmeric, peeled and sliced,

    or 1 teaspoon ground turmeric

    -4 shallots, peeled

    -5 cloves garlic, peeled

    -2 tablespoons palm sugar or dark brown sugar


    +   1 Prepare the Sambal Kecap by following the recipe on page 33.

    2 Clean and cut the chicken into pieces and press to flatten.

    3 Make the Spice Paste by grinding all the ingredients to a smooth paste in a
    mortar or blender, adding a little oil if necessary to keep the mixture turning.

    4 Heat the oil in a wok or large saucepan over medium heat and stir-fry the ground
    paste, with the chicken and the 2 stalks of the lemongrass the mixture is fragrant
    and changes to a golden color, 3 to 5 minutes. Add the coconut milk, chicken stock
    and remaining lemongrass, and bring to a boil, then reduce the heat to low and
    simmer uncovered for about 5 minutes. Add the chicken, *salam* leaves, salt and
    pepper, and continue to simmer for about 30 minutes, turning the chicken frequently
    in the pan to cook it evenly and allow the spices to penetrate the meat. Turn
    off the heat and allow the chicken to cool in the room to temperature.

    5 Remove the chicken pieces from the sauce and dry in an open, airy place for
    30 minutes, then grill the chicken over hot charcoal or a preheated broiler for
    3 to 5 minutes on each side and brush with a little sweet Indonesian soy sauce
    to glaze the skin. Serve the grilled chicken with steamed rice, vegetables and
    a bowl of Sambal Kecap on the side.


