    # Cooking Methods


    Preparing the all-important spice pastes, rice and coconut milk


    Indonesian food is prepared in a variety of ways: pan-fried or deep-fried, grilled
    over hot coals, steamed, steamed and even—in remote areas of Irian Jaya—baked
    in an earth oven in Polynesia.


    It is essential to master the art of preparing the basic spice paste or rempah
    using a grinder to so many dishes. Indonesian cuisine uses a grinding stone; ingredients
    are peeled if necessary and, where relevant, sliced or chopped into small pieces
    before being. If you use a blender or food processor, the process of preparing
    the spices is much faster but need to add some milk to keep the mixture inside
    the processor. The spice paste to be fried first in hot oil, add a little of the
    specified amount to the food process. If the spice is to be simmered in coconut
    milk, stock or water, add a little of this instead needed.


    The order when grinding or processing spices is important. Grind hard items first:
    spices, nuts and tough roots or leaves, such as lemongrass. When they are fine,
    add soft roots, then add ingredients that are full of moisture, such as shallots
    and garlic. Finally, add crumbly or liquid ingredients like shrimp paste, palm
    sugar and turmeric, and process to mix. If the mixture is sticking to the sides,
    you may have to turn off the machine and shake the container or open it and push
    the ingredients center using a spatula.


    The spice is then simmered in the wok. If it is to be fried, put it in oil over
    low to moderate heat and fry, stir from time to time until tender. This takes
    5-15 minutes. Pieces of meat or poultry are added to the spice paste and stir-fried
    until they are coated and the color has changed. Coconut milk is frequently added
    at this stage and the liquid brought to simmer until the heat is lowered and the
    food cooked until done.


    When cooking with coconut milk, it is important to prevent it from curdling or
    breaking apart. Stir the milk frequently, lifting it with a large spoon or ladle
    and pouring it into the wok. Once the milk is simmering, reduce the heat and not
    cover the pan. Thick coconut milk


    should be added at the final stages of cooking a dish to thicken and absorb the
    flavor. Stir while constantly heating and not allow the coconut to boil.


    # Rice, the staff life


    Rice, the physical mainstay of Indonesians, is far more than just a staple food.
    The plant is perceived to have a soul and is therefore subject to many obstacles
    during growth and harvesting. Having dozens of varieties in Indonesia, the most
    common fall are long-grain white rice and glutinous rice. Rice is a staple with
    almost every meal, while glutinous rice is used for cakes and desserts on special
    occasions. Glutinous or sticky rice (ketan) is either white or purple-black (pulut
    hitam), with a wonderfully fluffy


    Cooking rice is a subject that often arouves, whatever method is used, it is essential
    to first wash the rice to remove any starch and clinging to the grains; to prevent
    it from becoming gummy. In a saucepan, pot, rub the grains for a few minutes,
    then pour off the water. Repeat this process as many times as necessary until
    the water runs clear Drain.


    The absorption of rice depends on the variety and it, with age older rice absorbing
    more. Cooking times depend on the type and weight of your saucepan, and the following
    absorption method is used by millions throughout Asia.


    # Line Past (Nasi Putih)


    Measure out 1/2 cup (100 g) of uncooked rice and place in heavy-bottomed saucepan
    with water until the rice comes up to the level of the first joint on your finger-about
    1/2 inch (1.2 cm). Cover the pan and bring to a boil over high heat. Set the lid
    to sideways, once only. Lower the heat and simmer until the water is absorbed
    and creates ''craters'' in top of the rice, about 10 minutes. Reduce the heat
    to the minimum, cover and leave for ten minutes. Remove the lid, fluff the rice
    with a fork (do not stir before), wipe any condensation off the lid and cover
    the pan again. Set aside until required. The rice should keep warm for at least
    15-20 minutes.


    > A traditional stone pestle is used to grind the basic spice paste or rempah,
    but a modern food processor does the job faster and efficiently.


