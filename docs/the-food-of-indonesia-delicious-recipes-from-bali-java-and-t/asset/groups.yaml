    ## 番茄炖猪肉


    一道来自加里曼丹的简单食谱，在那里，猪肉（尤其是森林里的野猪）在达雅族中非常流行。


    - 1/2 磅 (700 g) 猪肉

    - 4 个西红柿，切成楔

    - 4-6 根韭菜（kucai）或小葱，切段

    - 1 根柠檬草，仅留粗壮底部，去去外皮，内部用拍碎

    - 1 杯 (250 ml) 水


    1. 将猪肉切成一口口大小的块。

    2. 在研钵或搅拌机中将调料糊原料磨成光滑的糊，必要时加入少许水以保持混合物旋转。

    3. 将调料糊和其他食材放入���或锅中煮沸，然后用中火慢炖至猪肉软烂（3 到 5 分钟）。如果西红柿很酸，可以加一点糖；如果肉熟前酱汁干了，可以加一点水。离火，立即搭配米饭食用。


    ### 调料糊

    - 1 英寸 (2.5 cm) 新生姜，去皮切片

    - 2-3 根手指长度的红辣椒，去籽

    - 4 瓣红葱，去皮


    供 4 至 6 人享用准备时间：15 分钟烹饪时间：5 分钟


    ## 万纳腊姜肉猪肉


    在苏拉威锡岛北部，许多人口是基督徒和华人，因此对食用猪肉的宗教禁忌并不适用于这里。


    - 1/2 磅 (700 g) 无骨猪肩肉或猪腿肉

    - 2½ 英寸 (6 cm) 新生姜，去皮切片

    - 2-3 根手指长度的辣椒，去籽

    - 3 瓣红葱，去皮

    - 2 汤匙油

    - 5 片青柠叶

    - 2 片姜黄叶（可选）

    - 3 根柠檬草，仅留粗壮底部，去外皮，内部用拍碎并切片

    - 1/2 茶匙盐


    1. 将猪肉切成一口口大小的块。备用。

    2. 在研钵或搅拌机中将姜、辣椒和红葱粗磨，必要时加入少许水以保持混合物旋转。备用。

    3. 在���中用中火热油，炒炒碎的混合物直至香味，约 2 分钟，转小火，盖上猪肉和其他食材，让猪肉在自身的汁水中翻炒至软烂（3 到 5 分钟）。如果肉熟前汤汁干了，可以加一点温水。离火，搭配米饭食用。


    供 4 至 6 人享用准备时间：15 分钟烹饪时间：15 分钟


    ## 巴厘黑糯米粥 Bubur Injin


    很难找到一位来过巴厘岛的外国游客不爱上黑糯米那奇妙的坚果香气和入口即化的口感，上面还淋上了一圈圈美味的椰奶奶油。


    - 1 杯 (200 g) 生黑糯米（详见备注）

    - 3/4 杯 (150 g) 生白糯米

    - 6 杯 (1.5 升) 水

    - 2 叶香兰叶，打成结

    - 1 滴香草精

    - 1/4 杯 (50 g) 刨椰糖或深色红糖

    - 一小撮盐

    - 1/2 杯 (125 ml) 椰奶奶油


    1. 将两种糯米洗几次水，直到水变清，然后浸泡过夜。

    2. 在锅中，将糯米、水和香兰叶煮沸，用中火不盖盖慢煮约 40 分钟，偶尔搅拌直到糯米软熟，呈粥状粘稠度。如果使用了香兰叶，将其丢弃。加入椰糖并搅拌至溶解。转小火慢煮约
    5 分钟后离火。

    3. 在碗中混合椰奶奶油和盐并搅拌均匀。

    4. 时，将粥盛入小碗中，顶部淋上咸椰奶奶油。


    > 备注：*黑糯米*是一种主要在印度尼西亚发现糯米。可以用普通糯米代替，尽管口感不完全相同。


    供 6 至 8 人享用准备时间：10 分钟 + 过夜浸泡烹饪时间：50 分钟


    ## 炸香蕉 Pisang Goreng


    在印度尼西亚烹饪香蕉有很多。这里有两个例子，但你也可以在面糊中加入椰奶奶油，或在香蕉裹上椰丝（所示）。


    - 1 杯 (125 g) 米粉或面粉，过筛

    - 1/3 杯 (80 ml) 水

    - 1/3 杯 (80 ml) 椰奶奶油

    - 1/4 茶匙盐

    - 油，用于深炸

    - 8 根小手指香蕉，去皮对半切，或 4 根普通香蕉，去皮对半切


    1. 将面粉放入放入混合碗中。在中间挖一个坑，加入水、椰奶奶油和盐。逐渐将面粉融入液体，揉成光滑的面团。

    2. 在���中热油至中温。将香蕉浸入面糊中深炸 5 到 10 分钟，偶尔翻面，直到金黄色且酥脆。

    3. 转移到盘中，搭配冰淇淋食用。


    供 4 至 6 人享用准备时间：15 分钟烹饪时间：20 分钟


    ## 椰子蛋糕


    - 2 杯 (200 g) 椰子丝

    - 3/4 杯 (120 g) 糯米

    - 1/2 杯 (120 ml) 牛奶

    - 1/2 杯 (50 g) 糖

    - 1/4 杯 (50 g) 米粉

    - 1/2 茶匙盐


    1. 将所有食材放入混合碗中；揉至光滑且不粘锅壁。

    2. 预热烤箱至 350°F (180°C)。在蛋糕模上撒一些面粉，将面团压入。

    3. 在烤箱中烘烤约35 分钟，直到蛋糕呈金黄色并冷却。

    4. 从模中取出蛋糕，在模边缘划刀，然后倒扣。


    供 6 至 8 人享用准备时间：10 分钟烹饪时间：35 分钟


    ## 棕糖糯米饼 Wajik


    这种流行的蛋糕有很多变体，可以在冰箱里储存几天。它常在室温下食用，也可以淋上椰奶奶油食用。另一种变体是在米半熟时加入菠萝块或葡萄干。


    - 1 杯 (200 g) 生糯米

    - 1/2 杯 (50 g) 刨椰糖

    - 1/2 杯 (125 ml) 水

    - 1 叶香兰叶，打成结，或 1 滴香草精

    - 1/4 杯 (60 ml) 椰奶

    - 一小撮盐


    1. 将米洗几次水，直到水变清，浸泡过夜。

    2. 在蒸锅内铺上纱布，将米平铺在布上。蒸 15 分钟，然后翻面用叉子拨散，再蒸 10 分钟直到煮熟。

    3. 在锅中，用中火将糖和水煮沸，不盖盖搅拌直到混合物浓稠，约 15 分钟。加入所有食材并搅拌均匀。继续慢煮 3 到 5 分钟后离火。

    4. 将糯米和椰奶放入锅中混合均匀，用小火煮，偶尔搅拌，直到混合物变稠变粘（10 到 15 分钟）。离火并丢弃香兰叶（如果使用了）。

    5. 将蛋糕转移到抹了油的浅蛋糕盘或盘中，用湿匙抹平表面，静置冷却。将蛋糕切成正方形或菱形，在室温下食用。


    供 6 至 8 人享用准备时间：10 分钟 + 过夜浸泡烹饪时间：1 小时 10 分钟


