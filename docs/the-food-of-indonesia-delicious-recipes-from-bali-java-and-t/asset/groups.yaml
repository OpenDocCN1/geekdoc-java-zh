    - 3 汤匙水

    - 几枝柠檬罗勒，作装饰


    1. 用盐腌制鱼肉，静置 15 分钟。

    2. 在研钵或搅拌机中将所有食材磨成光滑的酱糊，必要时加入少量油使混合物旋转。备用。

    3. 在炒锅中用中火加热 3 汤匙油，至冒油。煎鱼至金黄色且酥脆，需 5 到 7 分钟。从锅中捞出，放在厨房纸上吸油。

    4. 在炒锅中用中火加热剩余油，翻炒调料酱至闻香，需 3 到 5 分钟。加入切片辣椒（如使用）、红葱、大蒜、西番茄块、斑兰叶和罗望水，翻炒 1 分钟，然后用糖、盐和胡椒调味。最后加入炸鱼和水，搅拌均匀并小火炖
    1 分钟后离火。

    5. 盛入浅盘中，离火前撒上罗勒装饰即可食用。


