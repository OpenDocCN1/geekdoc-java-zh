    ## Sambal Goreng Tempeh Sweet and Spicy Fried Tempeh


    Sweetened with palm sugar and spiced with galangal, lemongrass, shrimp paste,
    tamarind and chillies, this dish is a Javanese favorite.


    - 2 cakes tempeh (1 lb/500 g in total)

    - Oil, for deep-frying

    - 2 shallots, peeled and sliced

    - 3 cloves garlic, peeled and sliced

    - 2 red-finger chillies, deseeded and sliced

    - 1 in (2½ cm) fresh galangal, peeled and sliced

    - 2 stalks lemongrass, thick bottom third only, layers discarded, inner part bruised

    - 1½ teaspoon dried shrimp paste (terasi)

    - 2 teaspoons, dry-roasted paste (page 23)

    - 3 tablespoons shaved palm sugar or dark brown sugar

    - 3 tablespoons water

    - 2 tablespoons tamarind juice (page 26)

    - 1½ teaspoon salt


    1 Slice the tempeh into long, narrow strips. Heat the oil in a wok over high heat
    and deep-fry the strips until browned and crispy, 3 to 5 minutes. Remove from
    the hot oil and set aside to drain on paper towels.


    2 Drain the oil from the wok and wipe clean. 1 tablespoon of fresh oil in the
    wok medium heat and stir-fry the shallots, garlic, chillies, galangal, lemongrass
    and dried shrimp paste for 3 to 5 minutes until fragrant. Add the palm sugar,
    tamarind juice and water, and stir-fry until the sugar has dissolved and turns
    to caramel. Add the deep-fried tempeh strips until the sauce has thickened and
    completely coats the tempeh 3 to 5 minutes. Season with the salt and remove from
    the heat. Discard the galangal and lemongrass, and garnish with sliced chili,
    if desired.


    ## Tempeh Stewed in Coconut Milk and Spices Gulai Tempeh


    A Sumatran dish using protein-rich tempeh with vegetables in a rich coconut gravy.


    - 2 cups (500 ml) thick coconut milk

    - 2 cloves

    - 4 cakes tempeh (2 lbs/1 kg in total), cubed

    - 8 oz (250 g) tapioca leaves, spinach or water spinach (kangkung)

    - 1½ teaspoon salt

    - 1 spring onion, thinly sliced, to garnish

    - 1 to 2 red-finger chillies, deseeded and diced, to garnish


    ### Spice Paste

    - 1 tablespoon white peppercorns

    - 1½ in (4 cm) fresh turmeric, peeled and sliced, or 1½½ teaspoons ground turmeric

    - 1 in (2½ cm) fresh ginger, peeled and sliced

    - 4 cloves garlic, peeled

    - 1 tablespoon shaved palm sugar or dark brown sugar


    | Method | Preparation Time | Cooking Time |

    | :--- | :--- | :--- | :--- |

    | 1 Make the Spice Paste by grinding all the ingredients to a mortar or blender,
    adding a little coconut milk if necessary to keep the mixture turning. 2 Bring
    the coconut milk to a boil in a saucepan. Add the Spice Paste, chillies and tapioca
    leaves or spinach and bring to a boil. Reduce the heat to low and simmer uncovered,
    until the vegetables are tender and the sauce has thickened, 7 to 10 minutes.
    Season with the salt and garnish with freshly sliced onion and chili. | Serves
    4 to 6 | 20 mins | 15 mins |


    ![](img/84810ddf87352f3d89892fec747b364a_63_0.png)


    ## Fern Tips or Asparagus in Coconut Gravy Gulai Daun Pakis


    The young of several varieties of wild ferns are enjoyed in many parts of Indonesia.
    They are sold in wet markets throughout Southeast Asia and have excellent flavor.
    Young asparagus or spinach make excellent substitutes.


    - 2 cups (500 ml) coconut milk

    - 1 lb (500 g) fresh tips (fiddleheads) or young asparagus, washed

    - 2 slams (optional)

    - 1 tablespoon tamarind juice (page 26)

    - 1/2 teaspoon salt


    1 Make the Spice Paste by grinding the ingredients to a smooth paste in a mortar
    or blender, adding a little coconut milk if necessary to keep the mixture turning.
    2 Bring the Spice Paste and coconut milk to a boil in a saucepan. Reduce the heat
    and simmer uncovered for 2 minutes. Add the fern tips or asparagus, leaves and
    tamarind juice, mix well and bring to a boil, then simmer for about 15 minutes,
    frequently until the vegetables are tender. Season with the salt and remove from
    the heat. 3 Transfer to a serving casserole and serve immediately with steamed
    rice.


    ### Spice Paste

    - 1 in (2½ cm) fresh garlic, peeled and sliced

    - 1/2 in (1 cm) fresh turmeric, peeled and sliced, and 1/2 teaspoon ground turmeric

    - 1 in (2½ cm) fresh ginger, peeled and sliced

    - 2-3 red finger-length chillies, deesed

    - 3 shallots, peeled

    - 2 cloves garlic, peeled


    Serves 4 to 6 Preparation time: 20 mins Cooking time: 20 mins


    ## Eggplant in Tamarind Broth Asam Terong


    A simple and quick vegetable dish that enhances the taste of eggplants.


    - 2-3 red finger-length chillies, deesed and sliced

    - 3 shallots, sliced

    - 2 cloves garlic, sliced

    - 2 cups (500 ml) water

    - 1 lb (500 g) 2-3 slender eggplant (1) halved and sliced

    - 2 tablespoons tamarind juice (page 26)

    - 1 ripe tomato, cut into wedges

    - 2 teaspoons shaved palm sugar or dark brown sugar

    - 1/2 teaspoon salt


    1 Prepare the Crispy Fried Shallots by following the recipe on 34. 2 In a large
    saucepan, bring the sliced chili, garlic and water to a boil over medium heat,
    then simmer uncovered for 3 to 5 minutes. Add the eggplant and tamarind, and simmer
    until half cooked, about 2 minutes. Add the tomato and, simmer until the tomato
    is soft, about 2 minutes. Season with the salt and remove from the heat. 3 Transfer
    to a serving bowl and serve hot, garnished with Crispy Fried Shallots, celery
    leaves and spring onion.


    ### Garnishes

    - Crispy Fried Shallots (page 34)

    - 1 spring onion, sliced


    Serves 4 Preparation time: 20 mins Cooking time: 15 mins


    ## Classic Grilled Ayam Panggang


    This is one of Indonesia''s most traditional dishes and plays an important role
    throughout the archipelago.


    - 1 fresh chicken (2 lbs/kg)

    - 2 tablespoons oil

    - 2-3 bird''s eye chillies or finger-length chillies

    - 3 stalks lemongrass, thick bottom third only, layers discarded, inner part braised

    - 1/2 cups (775 ml) thin coconut milk

    - 2 cups (500 ml) chicken stock or 2 cups (500 ml) warm water

    - 2 salam leaves (optional)

    - 1 teaspoon salt

    - 1 teaspoon black pepper

    - 1 teaspoon soy sauce (*kecap manis*), for glazing

    - 1 portion Sambal Kecap (page 33)


    ### Spice Paste

    - 3 candlenuts, roughly chopped

    - 1/2 in (1 cm) galangal root, peeled and sliced (optional)

    - 1/2 in (1 cm) fresh galangal, peeled and sliced

    - 1/2 in (1 cm) fresh turmeric, peeled and sliced, or 1 teaspoon ground turmeric

    - 4 shallots, peeled

    - 5 cloves garlic, peeled

    - 2 tablespoons palm sugar or dark brown sugar


    1 Prepare the Sambal Kecap by following the recipe on page 33. 2 Clean and cut
    the chicken into pieces and flatten. 3 Make the Spice Paste by grinding all the
    ingredients to a smooth paste in a mortar or blender, adding a little oil if necessary
    to keep the mixture. 4 Heat the oil in a wok or large saucepan over medium heat
    and stir-fry the ground paste, with the chicken and the 2 stalks of lemongrass
    until the mixture is fragrant and changes to golden color, 3 to 5 minutes. Add
    the coconut milk, chicken stock and remaining lemongrass, and bring to a boil,
    then reduce the heat to low and simmer uncovered for about 5 minutes. Add the
    chicken, *salam* leaves, salt and pepper, and continue to simmer for about 30
    minutes, turning the chicken frequently in the pan to cook it evenly and allow
    the spices to penetrate the meat. Turn off the heat and allow the chicken to cool
    to temperature. 5 Remove the chicken pieces from the sauce and dry in an open,
    airy place for 30 minutes, then grill the chicken over hot charcoal or a preheated
    broiler for 3 to 5 minutes on each side and brush with a little sweet soy sauce
    to glaze the skin. Serve the grilled chicken with steamed rice, vegetables and
    a bowl of Sambal Kecap on the side.


    Serves 4 to 6 Preparation time: 40 mins Cooking time: 1 hour


    ## Chicken Simmered in Mild Coconut Gravy Opor Ayam


    A mild dish with chilies but redolent of coriander, lemongrass, salam leaves and
    galangal, Opor Ayam is a universal favorite in Indonesia.


    - 3 cups (750 ml) thin coconut milk

    - 1 fresh chicken (2 lb/kg), cleaned and cut into serving pieces

    - 1 lemongrass, thick bottom third only, layers discarded, inner partised

    - 2 salam leaves

    - 1/2 teaspoon salt

    - 1/2 cup (125 ml) thin coconut milk


    Make the Spice Paste by grinding all the ingredients to a smooth paste in a mortar
    or blender, adding a little coconut milk if necessary to keep the mixture. Bring
    the coconut milk and Spice Paste to a boil over high heat in a wok or large saute.
    Add the chicken pieces, lemongrass, salam leaves and salt, mix well and bring
    to a boil. Reduce the heat to low simmer uncovered about 30 minutes, until the
    chicken is cooked and the sauce has reduced by a third. Finally add the thick
    coconut milk, simmer 5 minutes and remove from the heat.


    ### Spice Paste

    - 5 shallots, roughly chopped

    - 1 in (2 1/2 cm) fresh galangal, peeled and sliced

    - 3 shallots, peeled

    - 3 cloves garlic, peeled

    - 2 tablespoons coriander seeds or 1 tablespoon ground coriander

    - 1 teaspoon ground white pepper

    - 1/2 tablespoon shaved palm sugar or dark brown sugar


    3 Transfer to a serving casserole and garnish with fresh chillies if desired.
    4 to 6


    ## Javanese Fried Chicken Ayam Goreng Yogya


    Seasoned chicken that is simmered in coconut and spices until almost cooked, then
    flash-fried to give it a crispy coating, make this central Javanese dish a favorite.


    - Oil, for deep-frying

    - 2 salam leaves

    - 1 fresh chicken (2 lb/kg), cleaned and into serving pieces

    - 2 cups (500 ml) thin coconut milk

    - 2 limes, cut into wedges, to serve

    - 1 portion Samb Trasi (page 33)


    ### Spice Paste

    - 1 tablespoon coriander seeds, 2 tablespoons ground coriander

    - 1/2 in (1 cm) fresh galangal, peeled and sliced

    - 1/2 in (1 cm) fresh turmeric, peeled and sliced, or 1/2 teaspoon ground turmeric

    - 1/2 in (2 cm) fresh ginger, peeled and sliced

    - 4-5 shallots, peeled

    - 3 cloves garlic, peeled

    - 1 tablespoon shaved palm sugar or dark brown sugar

    - 1/4 teaspoon salt


