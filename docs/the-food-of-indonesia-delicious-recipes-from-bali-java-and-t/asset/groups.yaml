    Picked the green, the fragrant flat-shaped bud of the *Eugenia aromatica* is sundried
    for several days, until finally reaching the rich dark brown color found on supermarket
    shelves around the world.


    Coastal areas of Indonesia, which were major trading centers (such as the east
    coast of Sumatra, which was inhabited long before the Arabs, Europeans, and the
    west and north coasts of Java), use a wider range of spices that had limited contact
    with the outside world. While all nutmeg, regarded by many as the most beautiful
