    - 2 in (5 cm) fresh turmeric, peeled and sliced, or 2 tablespoons ground turmeric

    - 2 in (5 cm) ginger, peeled and sliced

    - 1/2 teaspoon dried shrimp paste (dried), de-hydrated (page 23)

    - 1 salam leaf or bay leaf

    - 2 tablespoons tamarind juice (page 26)


    1. Prepare the Crispy Fried Shallots by following the recipe on page 34.

    2. Scrub and clean the lobsters. Bring to a boil over medium heat in a pot, add
    the lobsters and boil for 10 to 15 minutes. Remove the lobsters from the heat
    and immediately plunge them into a basin of ice water for 1 minute to cool. Strain
    and reserve the stock. Drain the lobsters and remove the meat from the shells.
    Discard the shells.

    3. Prepare the Spice Paste by grinding all the ingredients (except the oil, salam
    leaf and tamarind juice) to a smooth paste in a mortar or blender, adding a little
    oil if necessary to make the mixture turning. Heat the oil over medium heat in
    a wok or skillet and stir-fry the Spice Paste until fragrant, 3 to 5 minutes.
    Then remove from the heat. Set aside.

    4. In a pot, bring the lobster stock, Spice Paste, lemongrass, lime leaves and
    vinegar to a boil over medium heat, then simmer uncovered for 3 to 5 minutes.
    Add the coconut cream, mix well and bring to a boil, then simmer for about 5 minutes.
    Finally add the lobster meat, season with the salt and simmer for 1 minute. Remove
    from the heat.

    5. Transfer to a serving bowl, garnish with Crispy Fried Shallots and serve with
    steamed rice.


    | Serves 4 | Preparation time: 30 mins | Cooking time: 35 mins |

    | --- | --- | --- |


