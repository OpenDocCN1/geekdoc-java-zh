    2 片苏拉叶（可选）

    1 根（2½ cm）新鲜高南姜，拍碎

    1 根新鲜或冷冻玉米棒，切成段


    200（80 g）去脉叶、红薯叶、菠菜叶和甘木果叶（见备注）

    100（100 g）豆角，切成短段


    2 至 3 根手指长的辣椒，去籽并切成短段（可选）


    1½ 杯（75 g）轻煮豌豆或新鲜甘木果仁

    1¼ 杯（60 ml）酸望子汁（第 26 页）或 4 至 6 个酸角棱果（belimbing wuluh），切片

    1½ 杯（125 g）新鲜虾仁，去壳（可选）


    1 个熟透的番茄，切成楔

    2 汤匙糖

    1½ 茶匙盐


    ### 调味酱

    2 至 4 根手指长的辣椒，去籽

    4 瓣头红洋葱，去皮

    3 瓣瓣大蒜，去皮

    1½ 茶匙盐


    1. 用研钵或搅拌机将所有配料研磨成光滑的酱料，必要时加少量水以保持混合物质软。备用。

    2. 在平锅中中火将水煮沸。加入调味酱、苏拉叶（如果使用）和高南姜，搅拌均匀煮沸，然后慢煮 2 分钟。加入蔬菜、辣椒（如果使用）、花生和酸望子汁或椰子水。将混合物煮沸至蔬菜软，需
    3 至 5 分钟。最后加入虾、番茄和糖，慢煮 1 到 2 分钟直到虾变粉色。离火，作为米饭餐的一部分热热享用。


    在亚洲，许多植物的嫩叶被用作蔬菜烹饪。木薯叶、红薯叶和甘木果叶在印度尼西亚很容易获得。可用空心菜（kangkung）、普通菠菜或小白菜代替。


    供 4 至 6 人享用准备时间：30 分钟烹饪时间：20 分钟


    ## 椰奶辣味空心菜 (Pelecing Kangk)


    10 盎司（300 g）空心菜（kangkung）或普通菠菜

    1 个青柠

    1 瓣大蒜，去皮

    1 汤匙棕榈糖或深色红糖

    1 杯（100 g）新鲜碎的椰蓉

    3 根小鸟辣椒或 3 根手指长的红辣椒，去籽

    1½ 茶匙干虾（trasi），干烤过（第 23 页）

    1 汤匙盐

    1 汤匙现榨青柠汁或柠檬汁

    2 汤匙温水

    2 汤匙烤过的无盐花生

    供 4 人享用

    4 个青柠，对半切


    1. 洗洗净菠菜并去掉茎。将其切成段。

    2. 焯菠菜。将青柠、棕榈糖和椰蓉搅拌至光滑。备用。

    3. 将辣椒、干虾、盐、柠檬汁和水搅拌至光滑。

    4. 在锅中加热油，翻炒酱料至香。加入菠菜，烹制 5 分钟。

    5. 撒上碎的椰蓉即可享用。


    供 4 人享用准备时间：20 分钟烹饪时间：5 分钟


    ![](img/84810ddf87352f3d89892fec747b364a_58_0.png)


    ## 椰奶香料炖菠萝


    1 个大熟透菠萝

    2 汤匙油

    3½ 杯（875 ml）稀椰子奶

    ¼ 茶匙现磨黑胡椒

    2 颗八角

    1 根肉桂棒

    ¼ 茶匙肉豆蔻粉

    1 根香柠檬，拍碎

    1 cm 高南姜，切片


    1. 按照第 34 页的配方准备炸洋葱。

    2. 去掉菠萝芯并切块。

    3. 用研钵或搅拌机将姜黄、洋葱、大蒜、棕榈糖和虾酱研磨成光滑的酱料，必要时加少量水以保持混合物干净。备用。

    4. 在锅中中火加热油，翻炒酱料至闻香。加入椰子奶、八角、肉桂棒。煮沸。

    5. 加入菠萝和其他配料，煮沸。转小火，盖盖慢煮至菠萝变软，需 10 到 15 分钟。

    6. 根据喜好加糖或盐调味后即可。


    供 4 人享用准备时间：40 分钟烹饪时间：30 分钟


    ## 椰子酱蔬菜


    7 盎司（200 g）豆角，切成段

    2 杯（180 g）菠菜叶或嫩蕨菜尖（蕨头）

    1 杯（50 g）豆芽，去掉尾部

    炸洋葱（第 34 页）


    ### 椰子酱

    1½ 英寸（1 cm）新鲜姜黄

    1 茶匙姜黄粉

    2 至 3 根小鸟辣椒或姜叶，切碎

    2 至 3 瓣洋葱，去皮

    2 瓣大蒜，去皮

    1 汤匙切片棕榈糖

    或深色红糖

    1 汤匙干虾（trash），干烤过（第 23 页）

    1 杯（100 g）新鲜碎椰蓉

    或甜味椰蓉

    1 杯（250 ml）水

    1 片苏拉叶或月桂叶

    1¼ 茶匙盐


    1. 按照第 34 页的配方准备炸洋葱。

    2. 用研钵或搅拌机将姜黄、辣椒、洋葱、大蒜、棕榈糖和虾酱研磨成光滑的酱料。将研好的酱料放入平锅中，不盖盖慢煮 5 到 10 分钟直到酱汁变稠。离火冷却。

    3. 在平锅中中火将水煮沸。将蔬菜煮 1 到 2 分钟。离火，沥干水分并摆放在菜盘上。

    4. 将椰子酱淋在蔬菜上，撒上炸洋葱装饰，或如上所示将酱放在旁边。


    供 4 人享用准备时间：25 分钟烹饪时间：15 分钟


