    of Sambal Kecap and Sambal Kacang on the side.


    +   Marinade

    1/2 cup (125 ml) sweet Indonesian soy sauce kecap

    1/2 teaspoon coriander seeds, crushed, and 1/2 teaspoon ground coriander

    1/4 teaspoon white pepper

    1 tablespoon squeezed lime or lemon juice


    Makes 24 satays or serves 4 to 6 Preparation time: 30 mins + 2 hours to marinade
    Cooking time: 15 mins


    # # Lombok-style Marinated Beef Satay Sate Aspek Sasak


    In Lombok, in neighboring Bali, satay is usually highly seasoned and marinated
    before grilling.


    +   2 lbs (1 kg) beef sirloin

