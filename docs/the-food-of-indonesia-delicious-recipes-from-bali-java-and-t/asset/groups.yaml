    # # Tropical Islands of Spice and Rice

    An Archipelago of Snow-capped Mountains, Rainforest,

    Rice Fields, Swamps and Savannah


    Stretching 5,000 miles (8,000 kilometers) from the northwestern tip of Sumatra
    to the southeastern Iraya Java, Indonesia''s 18,000 or islands (home to some 235
    million people) extend from roughly 6 degrees of the equator to 11 degrees. The
    large islands of Sumatra, Java, Borneo (where three-quarters of the land mass
    is occupied by Indonesian Kalimantan) and Bali were part of the Asian mainland
    until they became permanently separated at the end of the last Ice Age.


    Indonesia lies within the so-called "Ring of Fire," the meeting point of two of
    the earth''s tectonic plates, gives rise to frequent seismic activity. Smoldering
    volcanoes—like the Hindu god Shiva, both Creator and Destroyer—periodically shelter
    ash over the land. The western islands of Indonesia are lush and evergreen. While
    Borneo has rainforests and sweeping coasts, Java and Sumatra are abound with fertile
    gardens, coconut groves and paddy fields. Fast-flowing rivers and gloriousant
    beaches complete the vision of a tropical paradise.


    All Indonesia tropical warm and relatively humid, and most areas experience a
    dry season followed by monsoon rains. However, the eastern islands of the archipelago
    (especially Nusa Tenggara, the long chain of southeastern islands from Lombok
    to Timor) are semi-arid and the dry season is longer and hotter, with the land
    being degraded by tree-felling and consequent erosion as a result.


    ![](img/84810ddf87352f3d89892fec747b364a_10_0.png)


    Not surprising for an archipelago, the most popular accompaniment to the staple
    food is fish, which is often fried with a little seasoning of tamarind, turmeric
    and salt, or simmered in water or coconut milk. There are, of course, hundreds
    of more complex recipes for both freshwater (raised in ponds) and ocean fish.
    Because of limited transport and refrigeration, dried fish more commonly encountered
    than fresh fish. Dried fish adds flavor also to a variety of spicy snacks and
    crunchy sauces.


    Although vegetables are grown throughout Indonesia, they do not produce greenery
    in the diet. Certain wild young leaves of plants for their fruit or tubers are
    cooked as vegetables. These are supplemented with many other edible vegetables,
    such as spinach and water spinach (kangkung), bean runners, eggplant, pumpkins
    and cucumbers. Especially in regions with rich volcanic soil, are perfect for
    temperate vegetables. The Dutch brought, squash, potatoes, cabbage and tomatoes—easily
    adopted by Indonesiansians.


    The staple throughout is rice, which is grown in irrigated paddies (where up to
    three crops a year can be achieved by special strains of rice and fertilizers)
    and in unirrigated fields, especially during the monsoon rains. In eastern islands
    where rainfall or unsuitable terrain make rice growing impossible, so corn and
    sweet potato, tapioca (also known as cassava or manioc), corn and sticky starch
    carved from the trunk of a palm tree—are the staples. Though it will buy rice
    from other regions of Indonesia, but in remote areas, the traditional staple still
    reigns. For economy, Indonesians sometimes adds corn or sweet potato to their
    daily rice to give it extra starch; this also brings the benefits of varying flavor.


    addy fields, coconut palms and a dry volcano in this case, Bali'' Mount Agung
    creates the exquisite smoky flavor of Bali, Java and Sumatra. Millions of areas
    of irrigated rice fields produce not only the staple of life but also, small fish,
    food for the ducks and a pleasant place for cattle to cool down.


