    - 2 个熟透西番茄，切丁

    - 4 枝新鲜亚洲罗勒，切碎

    - 4 汤匙甜酱油 (kecap manis)

    - 2 汤匙新鲜柠檬汁

    - Colo Sambal（见下方配料）


    1. 如果使用完整鱼，去鳞、去内脏并清洗，然后在侧面切几刀。用盐和柠檬汁调味，刷上油。备用 15 分钟。

    2. 制作 Colo Sambal：将所有配料放入碗中混合均匀。

    3. 用沸水烫香蕉叶后擦干。将包裹直接放在炭火上或预热烤箱下烤，直到香蕉叶变色且鱼熟，每面烤 10 至 15 分钟。

    4. 打开香蕉叶，将 sambal 淋在鱼上。立即食用。或者将 Colo Sambal 盛放在小碗中作为配料。


    供 4 人享 | 准备时间：20 分钟 | 烹饪时间：30 分钟


