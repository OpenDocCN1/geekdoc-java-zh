    香茅（serai）是一种带有清香的柠檬茎，既可以被捣碎加入汤中或咖喱中，也可以切片作为基础香料使用，在超市中以3到4根一捆的形式出售。应剥去较硬的外层，仅使用茎部下部三分之一的内层。在磨碎前务必切片茎，以获得光滑的糊。


    棕糖（gula jawa）以固体块或圆柱形糖的形式出售，由椰子汁或油棕汁制成。颜色从浅棕色不等，带有焦糖味。它用于制作棕糖糖（见第104页）。用量时，应将硬棕糖刨碎、磨碎或在微波炉中融化。可用深红糖代替。


