    # Sweet Coconut Pancakes Dadar


    These pancakes, with a sweet coconut filling known as *unti*, are a popular snack
    food and are sometimes eaten for breakfast.


    +   - 1 cup (150 g) flour, sifted

    - 2 eggs

    - 2 cups (500 ml) thick coconut milk

    - 1/2 teaspoon salt

    - 2 tablespoons oil


    +   Coconut Filling (Until)

    - 1/2 cup (100 g) palm sugar or dark brown sugar

    - 1/4 cup (60 ml) water

    - 1 cup (100 g) freshly grated coconut

    - 1/4 teaspoon salt

    - 1 pandanus leaf, tied into a knot


    +   1 Make the Coconut Filling by bringing the sugar and water to a boil in a
    saucepan. Reduce the heat and simmer uncovered for about 10 minutes, stirring
    occasionally, until the sugar is dissolved and the mixture turns syrup. Add all
    the other ingredients and cook, stirring constantly, for 10 to 15 minutes, until
    the mixture dries up. Remove from the heat, discard the pandanus leaf and set
    aside.


    +   2 To make the pancakes, combine the flour, eggs, coconut milk and salt in
    a mixing bowl, and whisk into a smooth that has a pouring consistency. Strain
    away any lumps. Lightly grease a non-stick wok or skillet and heat over low heat.
    Stir the batter and ladle 1 scoop (about 3 tablespoons) onto the pan and turn
    the pan to obtain a thin round layer, about 7 (18 cm) in diameter. Cook until
    the pancake sets and begins to brown, flip it over and cook for a few seconds
    on the other side, and remove from the heat. Continue to make the pancakes until
    all the batter is used.


    +   3 To serve, place a pancake on a flat surface and top with 2 tablespoons of
    the Coconut Filling. Fold one side of the pancake over the filling, fold in the
    sides and roll up tightly into a cylinder. Assemble the pancakes in the same manner.


    Note: The pancakes and Coconut Filling can both be made in advance and refrigerated;
    allow to warm to room temperature before assembling.


    Makes 12 pancakes Preparation time: 45 mins Cooking time: 35 mins'
