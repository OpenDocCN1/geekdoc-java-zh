    # Fried Fish with Tomato Sambal


    Small fish like sardines, are used in this typical seafood dish from village near
    Pekalongan, on the northern coast of Central Java.


    - 1/2 lb (700 g) small fish, cut and cleaned, then left over, or fish steaks

    - 1 tablespoon salt

    - 5 tablespoons oil

    - 2 red finger-length chilies, de-seeded and sliced (optional)

    - 3 shallots, peeled and sliced

    - 2 cloves garlic, peeled and sliced

    - 2 ripe tomatoes, cut into wedges

    - 1 salam leaf

    - 2 tablespoons tamarind juice (page 26)

    - 2 teaspoons sugar

    - Pinch of salt

    - 1/2 teaspoon ground white pepper

    - 3 tablespoons water

    - Sprigs of Lemon Basil, to garnish


    1. Season the fish with the salt and set aside for 15 minutes.

    2. Prepare the Spice Paste by grinding all the ingredients to a smooth paste in
    a mortar or blender, adding a little oil if necessary to keep the mixture turning.
    Set aside.

    3. Heat 3 tablespoons of the oil in a wok over medium heat until oily. Pan-fry
    the fish until golden brown and crispy, 5 to 7 minutes. Remove from the pan and
    drain on paper towels.

    4. Heat the remaining oil over medium heat in a wok and stir-fry the Spice Paste
    until fragrant, 3 to 5 minutes. Add the sliced chili (if using), shallot and garlic,
    tomato wedges, salam leaf and tamarind juice, and stir-fry for 1 minute, then
    season with the sugar, salt and pepper. Finally add the fried fish and water,
    mix well and simmer for 1 minute before removing from the heat.

    5. Transfer to a serving platter, garnish with basil before removing from the
    heat and serve.


    ### Spice Paste

    - 2 galangal, roughly chopped

    - 3-4 finger-length chilies, desired

    - 6 shallots, peeled

    - 2 cloves garlic, peeled

    - 1/2 in (1 cm) fresh galangal, peeled and sliced

    - 1/2 in (1 cm) fresh ginger, peeled and sliced

    - 1/2 in (1 cm) fresh turmeric, peeled and sliced, or 1 teaspoon ground coriander


    Serves 4 to Preparation time: 30 mins Cooking time: 15 mins


    # Fish Stew with Lemongrass and Turmeric


    This dish is typically cooked with fish in Indonesia, as shown in the photo above,
    but is equally delicious with whole fish or fillets.


    - 1½ lbs (700 g) whole snapper, tuna or sea bream, or fish fillets

    - 1 tablespoon oil

    - 4 cups (1 liter) water

    - 1 teaspoon salt

    - 3 stalks lemongrass, thick bottom, outer layers discarded, inner part bruised

    - 5 kaffir lime leaves

    - 1-2 finger-length chillies, sliced

    - 2 spring onions, cut into lengths

    - Crispy Fried Shallots (page 34)


    ### Spice Paste

    - 1/2 in (1 cm) fresh turmeric, peeled and sliced, or 1½ teaspoons ground turmeric

    - 1/2 in (1 cm) fresh ginger, peeled and sliced

    - 2-3 finger-length chillies, de-seeded

    - 4-6 shallots, peeled

    - 3 cloves garlic, peeled


    1. If using whole fish, scale, gut and clean the fish, then make several diagonal
    cuts on each side.

    2. Make the Spice Paste by grinding all ingredients to a smooth paste in a mortar
    or blender, adding a little water if necessary to keep the mixture turning.

    3. Heat the oil in a wok over high heat and stir-fry the Spice Paste for 1 to
    2 minutes until fragrant. Add the water, salt, lemongrass and kaffir lime leaves,
    and bring to a boil. Add the fish, reduce the heat to medium and return to a boil,
    then simmer uncovered until the fish is cooked. Adjust taste with more salt as
    desired and remove from the heat.

    4. Transfer to a serving plate and serve with steamed rice, garnished with sliced
    chilli and Crispy Fried Shallots (if using).


    Serves 4 Preparation time: 20 mins Cooking time: 15 mins


    # Beef Soup with Chilies and Tamarind


    This soup from eastern Indonesia has a wonderful sweet-sour taste to it.


    - 8 cups (2 liters) water

    - 2 lbs (1 kg) top round or stewing beef

    - 3 tablespoons oil

    - 4-5 shallots, peeled

    - 2 cloves garlic, peeled

    - 1 teaspoon dried shrimp paste (terasi)

    - 2 tablespoons shaved palm sugar or dark brown sugar

    - 1 tablespoon sweet sauce (kecap manis)

    - 2 tablespoons tamarind juice (page 26)

    - 1 tablespoon salt

    - 1-2 finger chillies, deeeded and sliced into strips

    - 2 spring onions, cut into short lengths


    1. Bring the water to a boil in a large pot. Add the beef, reduce the heat to
    simmer until the meat is half cooked, about 15 minutes. Turn off the heat. Remove
    the beef from the stock and drain. Strain and reserve the stock.

    2. When cool enough to handle, cut the beef into cubes. Heat 2 tablespoons of
    the oil over medium heat in a skillet and pan-fry the beef until cooked, 2 to
    3 minutes. Remove from the heat and set aside.

    3. Grind the shallots, garlic, dried shrimp paste and sugar to a smooth paste
    in a mortar or blender, adding a little water if necessary to keep the mixture
    turning. Set aside.

    4. Heat the remaining oil in a wok over medium heat and stir-fry the ground paste
    until fragrant. Add the beef cubes and Indonesian soy sauce, stir-fry for 2 minutes,
    then pour in the reserved beef stock and tamarind juice, season with the salt.
    Bring the soup to a boil, simmer uncovered until the beef is tender, 10 to 15
    minutes. Adjust the taste with more salt or tamarind juice as desired, stir in
    the sliced chillies and spring onions, and remove from the heat. Serve hot.


    Serves 4 to 6 Preparation time: 20 mins Cooking time: 45 mins


    # Beef Rendang Spicy Beef in Coconut


    This is one of the most popular Indonesian dishes, which originated in Padang,
    West Sumatra, and features chunks of beef stewed in coconut and spices.


    - 2 lbs (1 kg) top round or stewing beef

    - 2 tablespoons oil

    - 2 cups (500 ml) coconut cream or 3 cups (750 ml) thick coconut milk

    - 3 saffron leaves

    - kaffir lime leaves

    - 3 fresh turmeric leaves (optional)

    - 1 cinnamon stick

    - 2 tablespoons shaved palm sugar or dark brown sugar

    - 2 teaspoons salt

    - Crispy Fried Shallots (page 34), to garnish


    ### Spice Paste

    - 1 tablespoon black peppercorns

    - 3 in (8 cm) fresh galangal, peeled and sliced

    - 2 lemongrass, thick third only, outer layers discarded, inner part sliced

    - 2 in (5 cm) fresh ginger, peeled and sliced

    - 3-4 finger-length chilies, de-seeded

    - 8-10 shallots, peeled

    - 6-10 cloves garlic, peeled


    1. Prepare the Crispy Fried Shallots by following the recipe on page 34.

    2. Cut the beef into bite-sized chunks and set aside.

    3. Make the Spice Paste by grinding all the ingredients very coarsely in a mortar
    or blender, adding a little coconut cream if necessary to keep the mixture turning.

    4. Heat the oil in a wok over high heat and stir-fry the Spice Paste fragrant,
    1 to 2 minutes. Add the beef chunks and all the other ingredients, except the
    Crispy Fried Shallots, and bring to a boil, stirring constantly. Reduce the heat
    to medium and simmer uncovered for about 1 hour, then reduce the heat to low and
    continue simmering for 1 more hour until the meat is tender and most of the liquid
    has evaporated. By then, the oil will have separated from the milk. Continue to
    stir-fry the beef in this oil for about 25 minutes until it turns a dark brown
    color, remove from the heat.

    5. Transfer the beef to a serving platter, garnish with Crispy Fried Shallots
    and serve with steamed rice. This dish tastes better if left to sit for several
    hours, or overnight in the refrigerator, stir-fry it again for several minutes
    to reheat, and serve.


    Serves 4 to 6 Preparation time: 30 mins Cooking time: 2 hours 30 mins

