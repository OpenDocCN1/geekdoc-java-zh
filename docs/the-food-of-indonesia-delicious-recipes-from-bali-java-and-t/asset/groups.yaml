    ## Lamb Satay Sate Madura


    Normal with goat meat, this is probably the most popular type of satay in Indonesia,
    originating from the island of Madura to the northeast of Java.


    - 1/2 lbs (750 g) boneless lamb

    - 24 bamboo skewers, soaked in water for 4 hours before using

    - lime wedges, to serve

    - 1 portion Sambal Kecap (page 33)

    - 1 portion Sambal Kacang (page 34)


    - 1 Cut the lamb into bite-sized cubes. Combine the Marinade ingredients in a
    bowl and mix. Pour two-thirds of the Marinade to the meat cubes, mix until well
    coated and allow to marinade for at least 2 hours. Reserve the remaining Marinade.

    - 2 Prepare the Sambal Kecap and Sambal Kacang by following the recipes on pages
    33-34. Set aside.

    - 3 Thread the marinated meat onto the bamboo skewers and grill over hot charcoal
    or under a preheated broiler for 5 to 7 minutes, turning and basting frequently
    with the reserved Marinade, until the meat is well cooked and browned on all sides.
    Arrange the satays on a serving platter and serve with the lime wedges and bowls
    of Sambal Kecap and Sambal Kacang on the side.


    ### Marinade

    - 1/2 cup (125 ml) sweet Indonesian soy sauce kecap

    - 1/2 teaspoon coriander seeds, crushed, and 1/2 teaspoon ground coriander

    - 1/4 teaspoon white pepper

    - 1 tablespoon squeezed lime or lemon juice


    Makes 24 satays or serves 4 to 6 Preparation time: 30 mins + 2 hours to marinade
    Cooking time: 15 mins


    ## Lombok-style Marinated Beef Satay Sate Aspek Sasak


    In Lombok, in neighboring Bali, satay is usually highly seasoned and marinated
    before grilling.


    - 2 lbs (1 kg) beef sirloin

    - 24 bamboo skewers, soaked in water for 4 hours before using

    - lime or lemon wedges, to serve

    - 1 portion Sambal Kecap (page 34)


    - 1 Cut the beef into bite-sized cubes and set aside.

    - 2 Prepare the Marinade by grinding all the ingredients (except the oil and coconut
    milk) to a smooth paste in a mortar or blender and adding a little oil if necessary
    to keep the mixture tender. Heat the oil in a wok over medium heat and stir-fry
    the paste until fragrant, for 3 to 5 minutes. Reduce the heat to low, add the
    coconut milk and simmer until the Marinade has thickened, about 10 minutes. Remove
    from the heat and set cool. Pour the Marinade over the beef cubes in a large bowl,
    mix until well coated and allow to marinade for at least 2 hours.

    - 3 Prepare the Sambal Kecap by following the recipe on page 34.

    - 4 Thread the marinated cubes onto the bamboo skewers and grill over hot charcoal
    or under a preheated broiler for 5 to 7 minutes, turning and basting frequently
    with the Marinade, until the meat is well cooked and browned on all sides. Arrange
    the satays on a serving platter and serve with the lime or lemon wedges and a
    bowl of Sambal Kecap on the side.


    ### Marinade

    - 4 shallots, roughly chopped

    - 1 (2 1/2) cm fresh ginger, peeled and sliced

    - 2 red length chillies, deseeded

    - 2-3 bird''s eye chilies, deseeded

    - 5 garlic cloves, peeled

    - 1/2 tablespoon dried shrimp paste (trasi), dry-roasted (page 23)

    - 1 teaspoon salt

    - 2 tablespoons oil

    - 1 cup (250 ml) coconut milk


    Makes 24 satays or serves 4 to 6 Preparation time: 25 mins + 2 hours to marinade
    Cooking time: 30 mins


    ## Seasoned Fried Beef Slices


    As the Indonesian name of this dish implies, it comes from Manado, in Northern
    Sulawesi.


    - 1 1/2 lbs (700 g) sirloin beef

    - 3 cloves

    - 1/4 teaspoon freshly grated nutmeg or ground nutmeg

    - 1 teaspoon salt

    - 2 cups (500 ml) water

    - Oil, for deep-frying


    ### Spice Paste

    - 6-8 red finger-length chillies, deseeded

    - 1 in (2.5 cm) fresh kencur root, peeled and sliced

    - 1 in (2.5 cm) fresh turmeric, peeled and sliced, or 1 teaspoon ground turmeric

    - 1 in (2.5 cm) fresh ginger, peeled and sliced

    - 2 teaspoons coriander seeds, or 1 teaspoon ground coriander

    - 1 teaspoon ground white pepper


    - 1 Prepare the Spice Paste by grinding all the ingredients to a smooth paste
    in a mortar or blender, adding a little water if necessary to keep the mixture
    turning.

    - 2 Heat 1 tablespoon of the oil in a wok over medium heat and stir-fry the Spice
    Paste until fragrant, 3 to 5 minutes. Add the beef, cloves, nutmeg, salt and water
    to bring to a boil, then simmer uncovered for 3 to 5 minutes, until the beef is
    half cooked. Remove the beef from the pan and continue to simmer the stock for
    5 minutes until it thickens, then turn off the heat. Slice the beef into strips.

    - 3 Heat the oil in a wok over high heat until hot. Deep-fry the beef strips for
    2 to 3 minutes until browned and cooked. Remove from the hot oil and drain on
    paper towels. Arrange the beef on a serving platter and pour the gravy over it.
    Serve immediately.


    Serves 4 to 6 Preparation time: 15 mins Cooking time: 15 mins


    ![](img/84810ddf87352f3d89892fec747b364a_94_0.png)

    ![](img/84810ddf87352f3d89892fec747b364a_95_0.png)


    ## Beef with Coconut


    A rich dish from Ambon, in the Maluku Islands, unlike dishes from Java, the combination
    of coconut with galangal, turmeric and ginger gives this dish wonderfully aroma
    and flavor.


    - 2 lbs (1 kg) stew beef

    - 1 cup (100 g) freshly grated coconut

    - 1 cup (80 g) desiccated coconut

    - 2½ cups (675 ml) thick coconut milk

    - 2 tablespoons lemongrass, outer layers discarded, inner part bruised


    - 1 Slice the beef into bite-sized chunks.

    - 2 Dry-fry the grated coconut or desiccated coconut in a skillet over high heat
    until golden brown, stirring frequently, about 10 minutes for freshly grated coconut
    or 8 minutes for desiccated coconut. Remove from the heat and allow to cool. While
    still warm, grind the coconut in a mortar or blender until fine.

    - 3 Prepare the Spice Paste by adding all the ingredients to a paste in a mortar
    or blender, adding a little oil if necessary to keep the mixture turning.

    - 4 Heat the oil in a wok over medium heat and stir-fry the Spice Paste until
    fragrant, 3 to 5 minutes. Add the beef, coconut milk and lemongrass, mix well
    and bring to boil, then simmer uncovered for about 10 minutes, stirring constantly
    to prevent the coconut milk from separating. Reduce the heat to low and continue
    to simmer uncovered, stirring from time to time, until the beef is tender and
    the sauce has dried up, about 30 minutes. Remove from the heat.

    - 5 Transfer to a serving platter and serve with steamed rice.


    ### Spice Paste

    - 6 cilantro, roughly chopped

    - 2 in (5 cm) fresh galangal, peeled and sliced

    - 3 in (8 cm) fresh turmeric, peeled and sliced, and 1 tablespoon turmeric

    - 3 in (8 cm) fresh ginger, peeled and sliced

    - 1½ teaspoon coriander seeds

    - 2 tablespoons ground white pepper

    - 1 teaspoon salt


    Serves 6 to 8 Preparation time: 20 mins Cooking time: 1 hour


    ## Corn Rice


    Corn is often used to add bulk to rice in areas where rice is costly or difficult
    to obtain. Dried corn should be soaked for 24 hours before use, although this
    is unnecessary using fresh or canned corn.


    - 1½ cups (300 g) uncooked rice, washed and thoroughly drained

    - 1½ cups (360 g) sweet corn kernels, cut from fresh cobs, or 15-oz (425 g) can
    sweet corn kernels, drained

    - 3½ cups (775 ml) water


    - 1 Bring all the ingredients to a boil in a pot. If using sweet corn, do not
    add at stage. Reduce the heat to medium and simmer until the water has already
    dried up, 5 to 7 minutes. If using canned sweet corn, add the corn to the rice.

    - 2 Reduce the heat to low and continue cooking the rice for 10 more minutes,
    stirring from time to prevent burning, until the rice is dry and fluffy. Remove
    from the heat, stir and serve hot.


    Serves 4 to 6 Preparation time: 5 mins Cooking time: 20 mins


    ## Makassarese Sparerib Soup Konro Makassar


    The Makassar of Southern Sulawesi are renowned for their hearty soups with lemongrass
    and coconut.


    - 2 lbs (1 kg) meaty beef spareribs, ribs separated and cut into lengths

    - 3 cups (300 g) freshly grated coconut, or 2 cups (150 g) unsweetened desiccated
    coconut

    - 16 cups (4 liters) water

    - 3 stalks lemongrass, thick part only, outer layers discarded, inner part bruised

    - 1 in (2.5 cm) fresh galangal, peeled and sliced

    - 3 kaffir lime leaves

    - 1 teaspoon ground white pepper

    - 1 teaspoon salt

    - Crispy Fried Shallots (page 34), to garnish


    ### Spice Paste

    - 3 candlenuts, roughly chopped

    - 3–4 shallots, peeled

    - 2 cloves garlic, peeled


    - 1 Prepare the Crispy Fried Shallots by following the recipe on page 34.

    - 2 Separate the beef ribs and cut into lengths. Set aside.

    - 3 Dry-fry the grated coconut in a skillet over low heat, stirring constantly
    until it turns golden brown, about 10 minutes for fresh coconut and 5 to 7 minutes
    for desiccated coconut. Remove from the heat and allow to cool. While still warm,
    grind the coconut in a mortar or blender until fine.

    - 4 Prepare the Spice Paste by grinding all the ingredients to a smooth paste
    in a mortar or blender, adding a little water if necessary to keep the mixture
    turning. Set aside.

    - 5 Bring the beef and water to a boil in a large pot and simmer uncovered over
    medium heat until the beef is tender, 30 to 40 minutes. Add the ground coconut,
    Spice Paste and all the remaining ingredients (except the Crispy Fried Shallots),
    mix well and continue to simmer for 15 more minutes, until the beef is very tender,
    not falling off the bones. Remove from the heat and serve garnished with the Crispy
    Fried Shallots.


    Serves 4 to 6 Preparation time: 20 mins Cooking time: 1 hour 5 mins

