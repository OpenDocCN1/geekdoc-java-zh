    # Nasi Kebuli Seasoned Rice with Chicken and Pineapple


    1 lb (500 g) boneless chicken, diced

    3 cups (750 ml) chicken stock or 1 1/2 teaspoons chicken stock granules dissolved
    in 3 cups (750 ml) warm water


    - 1 teaspoon salt

    2 cups (400 g) uncooked rice, washed

    1/2 small pineapple (about 8/250 g) to garnish

    Crispy Fried Shallots (page 34),


    Rice Seasonings


    - 2 tablespoons butter or oil

    6 shallots, peeled and sliced

    5 cloves garlic, peeled and sliced

    3 cardamom pods, pierced

    2 cloves

    - 1 stick lemongrass, thick bottom third only, outer layers discarded, inner part
    bruised

    1 in (2-1/2 cm) fresh ginger, peeled and thinly sliced

    1 cinnamon stick

    1 teaspoon coriander seeds

    1/2 teaspoon white pepper


    1. Prepare the Crispy Fried Shallots by following the recipe on page 34

    2. To make all the Rice Seasonings, heat the butter or oil in a wok over high
    heat, and stir-fry all the ingredients until fragrant, 2 to 3 minutes.

    3. Add the chicken to the wok and stir-fry for 2 to 3 minutes. Pour in the chicken
    stock, mix well and season with the salt, then bring the ingredients to a boil.
    Reduce the heat to medium and simmer uncovered until the chicken is tender, about
    5 minutes. Remove from the heat. Strain and serve the stock. Set the chicken pieces
    aside and discard all the other solids.

    4. Bring the uncooked rice and 2-1/2 cups (625 ml) of the reserved stock to a
    bowl over high heat. Reduce the heat to medium, cover and simmer until the rice
    is almost cooked and the liquid is absorbed, 5 to 10 minutes. Add the chicken,
    mix well and continue to simmer uncovered until the rice is fluffy, 5 minutes.
    Alternatively, cook the rice in a rice cooker with 2-1/2 cups (625 ml) of the
    reserved stock and add the chicken during the last 5 minutes of cooking.

    5. Peel the pineapple, rinse, remove the eyes and fibrous core, diced. Transfer
    the cooled rice to a serving platter, garnished with the pineapple and Crispy
    Fried Shallots, and serve hot.


    Serves 6 to 8 Preparation time: 30 mins Cooking time: 35 mins


    ## Classic Nasi Goreng Indonesian Fried Rice


    One of Indonesia''s most popular dishes, Nasi Goreng is prepared in countless
    ways and is eaten morning, noon and night. This classic version is accompanied
    by fried egg, fried chicken, satay and krupuk (deep-fried shrimp crackers) for
    a substantial meal. Any sort of leftover or fresh meat may be added, but the true
    flavor of Indonesia comes from the pungent chilies and trasi (dried shrimp paste).


    - 5 cups (500 g) cooked cold rice or leftover rice

    - 3 tablespoons oil

    - 4-5 shallots, peeled and sliced

    - 2 cloves garlic, peeled and sliced

    - 1-2 red-finger length chilies, diced and minced

    - 2 teaspoons dried shrimp paste (trasi), dry-roasted (2-3 g)

    - 5 oz (150 g) fresh shrimp, peeled and diced

    - 1 cup (200 g) leftover chicken, lamb or beef, diced

    - 2 cups (250 g) thinly sliced cabbage

    - 1 tablespoon salt

    - 1 tablespoon Indonesian soy sauce (kecap manis)

    - Sliced cucumber and sliced tomato, to garnish (optional)


    1. Prepare the Javanese Fried Chicken, Beef Satay, Crispy Fried Shallots, Sambal
    Kecap and Mixed Vegetable Pickles by following the respective recipes.

    2. Flake the cold rice with a fork or your fingers to separate the grains. Set
    aside.

    3. Lightly grease a non-stick skillet with a little oil and fry the eggs side
    up. Remove from the heat and set aside.

    4. Heat the oil in a wok over medium heat and stir-fry the shallots, garlic, minced
    chili and dried shrimp paste until fragrant, 1 to 2 minutes. Add the cabbage and
    leftover cooked meat, and stir-fry until the cabbage is slightly wilted, about
    2 minutes. Increase the heat, add the rice, salt and sweet Indonesian soy sauce,
    and stir-fry briskly until the ingredients are mixed well and heated through,
    about 2 minutes. Remove from the heat. Transfer the rice to a serving platter,
    with the fried eggs and arrange the fried chicken and satays on the side. Garnish
    with cucumber and tomato slices (if using) and serve with the Accompaniments on
    the side.


    Accompaniments

    - 1 portion Javanese Fried Chicken (page 67)

    - 1/2 portion Beef Satay (page 38)

    - Crispy Fried Shallots (page 34)

    - 1 portion Sambal Kecap (page 33)

    - Krupuk shrimp crackers (page 24)

    - 1/2 portion Mixed Vegetable Pickles (page 31)


    Note: It is essential to use cold rice for this dish. Freshly cooked rice is too
    soft and will absorb the oil, resulting in an oily and mushy fried rice. In Asia,
    leftover rice is used the next day for fried rice as it is easier to fry.


    Serves 4 Preparation time: 30 mins + time to prepare the Accompaniments Cooking
    time: 15 mins + time to prepare the Accompaniments


    ## Soto Ayam with Potato Croquettes


    Soto is a robust soup made with turmeric and coriander, and served with noodles
    or potato croquettes.


    - chicken

    - 8 cups (2 liters) water

    - 2 stalks lemongrass, thick bottom third only, outer layers discarded, inner
    part bruised

    - 2 sprigs kaffir leaves

    - 2 tablespoons celery, sliced

    - 1/2 teaspoon salt

    - 1/2 teaspoon white pepper

    - 7 oz (200 g) glass noodles (tanghoon), soaked in water

    - 5 hard-boiled eggs


    1. Prepare the Sambal Soto on page 34.

    2. Clean and rinse the chicken. Bring the water to a boil over high heat, immerse
    the chicken for 15 minutes. Turn off the heat and strain the stock. Separate the
    chicken from the bone and tear the meat into shreds.

    3. Make the Potato Croquettes by combining the mashed potato with all ingredients
    except the egg, and mix well. Shape the mixture and chill in the refrigerator
    for 45 minutes. Heat the oil in a wok over medium heat. Dip each potato in the
    egg, then turn golden, 2 to 3 minutes on each side. Remove from the heat and drain
    on paper-els.

    4. To make the paste, use a mortar or blender to grind the garlic and coriander
    to a smooth paste, adding a little oil to keep the paste. Heat the oil in a wok
    over medium heat and stir-fry the paste until fragrant, 3 to 5 minutes. Set aside.

    5. Bring the 8 cups (2 liters) of reserved chicken stock, lemongrass, kaffir leaves
    and celery to boil in a pot. Reduce the heat to low simmer uncovered for 15 minutes.
    Season with the salt and pepper, and keep the broth hot over low heat.

    6. To serve, portion the softened glass noodles and shredded chicken into individual
    serving bowls. Lay the broth over and top with hard-boiled eggs, bean sprouts
    and Potato Croquettes. Garnish with Crispy Fried Shallots and celery leaves, and
    serve with lime wedges and a bowl of Sambal Soto.


    Potato Croquettes

    - 2 potatoes, boiled and mashed

    - 1/4 teaspoon ground white pepper

    - 1 spring onion, thinly sliced

    - 1/4 teaspoon salt

    - 1/4 teaspoon freshly grated nutmeg or ground nutmeg

    - 1 tablespoon minced celery leaves

    - 2 tablespoons Crispy Fried Shallots (page 34)

    - Oil, for deep-frying


    Crispy Fried Shallots (page 34)

    - 2 tablespoons Chinese celery leaves, to garnish

    - Lime wedges, to serve

    - 1 portion Sambal Soto (page 34)


    Spice Paste

    - 1 in (1/2 cm) fresh turmeric, peeled and sliced, and 1 tablespoon turmeric

    - 5 shallots, peeled

    - 5 cloves garlic, peeled

    - 2 tablespoons ground coriander

    - 1 tablespoon oil

