    Apart from the crumbling remains of Portuguese and Dutch forts, there''s little
    that sets several small Moluccan islands apart from countless other islands in
    Indonesia. Yet five of these islands were once the only place in the world where
    cloves grew, while another group, the Bandas, were the sole source of nutmeg and
    mace. These islands were literally responsible for starting the Age of Exploration
    and for the discovery of the Americas by Christopher Columbus.


    With todays refrigeration and food processing, it''s hard to fully appreciate
    the importance of spices in earlier times. Cloves, pepper and nutmeg were sought
    by the Romans, Egyptians and Chinese as long as 2000 years ago, used to add flavor
    and to mask the flavors of less-than-fresh meat, to permeate the air during funerals
    and to be used in medicines.


    During the Middle Ages, the spice trade in Europe was controlled by Arab merchants,
    who purchased spices from Indian traders. They kept prices astronomically high
    by supplying Venetian merchants, who distributed the spices to the rest of Europe.
    For the search of such spices and rare and expensive items—worth far more gold
    or precious metal—Christopher Columbus set to sail upon the Indies (he thought
    he was going to Indonesia). Other voyages of exploration were made by the Portuguese,
    who eventually reached the Spice Islands of Indonesia at the beginning of the
    16th century, followed by the Spanish, English and Dutch.


    In 1602 the Dutch set up the East India Company to exploit the riches of the archipelago
    that eventually became Indonesia. They ruthlessly established a total monopoly
    in the spice trade and any grower who traded "illegally" by punishing his high-value
    spice trees cut down.


    Coriander was known to ancient Greeks and is found throughout the Middle East,
    as well as in Southeast Asia. Coriander is commonly partnered with peppercorns,
    garlic and coconut to flavor dishes. Another spice used with cloves is cumin,
    an elongated seed that looks and smells like cinnamon. A similar spice,


    Intricately, more cloves are grown now in Sulawesi and Zanzibar than in Maluku,
    and Indonesia now imports cloves to meet the demand for the spice. Don''t expect
    to find it in Indonesian dishes today—most of the cloves go up in smoke, added
    to tobacco in the kretek cigarettes.


    Both black and white peppercorns, each of which has distinct flavor, are used
    in parts of the archipelago. Peppercorns are the berry of a vine native to Mal
    Coast of India, brought to Indonesia many centuries ago. Black peppers are the
    dried berry with the skin intact, while white peppers have the skins removed.


    Desire for these spices (which caused a profit of 1,000 million for early explorers
