    - 2 汤匙罗望水（第 26 页）


    1. 按照第 34 页食谱准备酥炸洋葱。

    2. 刷净龙虾。在锅中用中火将水烧沸，放入龙虾煮 10 到 15 分钟。捞出龙虾，立即浸入冰水盆中 1 分钟以冷却。过滤并保留汤汁。沥干龙虾并从壳中剥出肉。丢弃虾壳。

    3. 在研钵或搅拌机中将所有食材（油、斑兰叶和罗望水除外）磨成光滑的酱糊，必要时加入少量油使混合物旋转。在炒锅或平底锅中中火加热油，翻炒调料酱至闻香，需 3
    到 5 分钟。然后离火备用。

    4. 在锅中，将龙虾汤、调料酱、香茅、柠檬叶和醋用中火烧沸，然后不盖盖小火炖 3 到 5 分钟。加入椰奶奶油，搅拌均匀并煮沸，然后小火煮约 5 分钟。最后加入龙虾肉，用盐调味并煮
    1 分钟。离火。

    5. 盛入碗中，撒上酥炸洋葱装饰，配米饭食用。


    | 供 4 人食用 | 准备时间：30 分钟 | 烹饪时间：35 分钟 |

