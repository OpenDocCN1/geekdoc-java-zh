    ## 马杜拉羊肉串 (Lamb Satay Sate Madura)


    这种普通的羊肉串可能是印尼最受欢迎的沙爹，起源于爪哇答岛东北部的马杜拉岛。


    - 1/2 磅 (750 g) 无骨羊肉

    - 24 根竹签，使用前在水中泡4小时

    - 柠檬角，备用

    - 1 份 Sambal Kecap（甜酱，第33页）

    - 1 份 Sambal Kacang（花生酱，第34页）


    - 1 将羊肉切成一口口大小的块。在碗中混合腌料原料并搅拌。将二之二的腌料倒入肉块中，搅拌至裹匀，腌制至少2小时。保留剩余腌料。

    - 2 按照第3-34页的食谱准备 Sambal Kecap 和 Sambal Kacang。备用。

    - 3 将腌制好的肉串在竹签上，放在热炭上烤或在预热的烤箱下烤5至7分钟，期间频繁翻面并用剩余的腌料刷味，直到肉全熟且各面呈金黄色。将沙爹放在盛盘中，配上柠檬角和一碗
    Sambal Kecap 以及 Sambal Kacang 即可。


    ### 腌料

    - 1/2 杯 (125 ml) 印尼甜酱油 (kecap)

    - 1/2 茶匙碎香菜籽，和 1/2 茶匙香菜粉

    - 1/4 茶匙白胡椒粉

    - 1 汤匙挤出的柠檬或柠檬汁


    可制作24串沙爹或供4至6人食用准备时间：30分钟 + 2小时腌制 烹饪时间：15分钟


    ## 龙目岛风味腌牛肉串 (Lombok-style Marinated Beef Satay Sate Aspek Sasak)


    在邻巴厘岛的龙目岛，沙爹在烤之前通常会经过深度调味和腌制。


    - 2 磅 (1 kg) 牛里脊肉

    - 24 根竹签，使用前在水中泡4小时

    - 柠檬或柠檬角，备用

    - 1 份 Sambal Kecap（第34页）


    - 1 将牛肉切成一口口大小的块备用。

    - 2 准备腌料：在研钵或搅拌机中将所有原料（油和椰奶除外）磨成光滑糊，必要时加入少量油以保持混合物顺滑。在锅中中火加热油，炒糊至闻香，持续3至5分钟。转小火，加入椰奶慢煮至腌料变稠，约10分钟。离火放凉。将腌料倒入大碗中，与牛肉块混合，搅拌至裹匀，腌制至少2小时。

    - 3 按照第34页的食谱准备 Sambal Kecap。

    - 4 将腌制好的肉块串在竹签上，放在热炭上烤或在预热的烤箱下烤5至7分钟，期间频繁翻面并用腌料刷味，直到肉全熟且各面呈金黄色。将沙爹放在盛盘中，配上柠檬或柠檬角和一碗
    Sambal Kecap 即可。


    ### 腌料

    - 4 颗洋葱，粗切

    - 1 (2 1/2) 厘米新鲜生姜，去皮切片

    - 2 根红长辣椒，去籽

    - 2-3 根鸟指天椒，去籽

    - 5 瓣大蒜，去皮

    - 1/2 汤匙干虾膏 (trasi)，干烘制后用（第23页）

    - 1 茶匙盐

    - 2 汤匙油

    - 1 杯 (250 ml) 椰奶


    可制作24串沙爹或供4至6人食用准备时间：25分钟 + 2小时腌制 烹饪时间：30分钟


    ## 调味炸牛肉片 (Seasoned Fried Beef Slices)


    正如这道菜的印尼名称所暗示的，它源于苏威拉腊北部的曼纳多。


    - 1 1/2 磅 (700 g) 牛脊肉

    - 3 瓣大蒜

    - 1/4 茶匙现磨肉豆蔻或肉豆蔻粉

    - 1 茶匙盐

    - 2 杯 (500 ml) 水

    - 油，用于深炸


    ### 香料糊

    - 6-8 根红长指辣椒，去籽

    - 1 英寸 (2.5 cm) 新鲜山姜 (kencur)，去皮切片

    - 1 英寸 (2.5 cm) 新鲜黄姜，去皮切片，或1 茶匙黄姜粉

    - 1 英寸 (2.5 cm) 新鲜生姜，去皮切片

    - 2 茶匙香菜籽，或1 茶匙香菜粉

    - 1 茶匙白胡胡椒粉


    - 1 在研钵或搅拌机中将所有原料磨成光滑糊，必要时加入少量水以保持混合物转动。

    - 2 在锅中中火加热1汤匙油，炒香香料糊，持续3至5分钟。加入牛肉、大蒜、肉豆蔻、盐和水煮沸，然后不盖盖子慢煮3至5分钟，直到牛肉半熟。将牛肉从锅中取出，继续炖汤5分钟直到汤汁变稠，然后关火。将牛肉切成条。

    - 3 在锅中大火加热油至热。深炸牛肉条2至3分钟直到呈金黄色且熟透。捞牛肉并放在纸巾上沥油。将牛肉放在盛盘中，淋上肉汁。立即食用。


    供4至6人食用准备时间：15分钟 烹饪时间：15分钟

    ![](img/84810ddf87352f3d89892fec747b364a_94_0.png)

    ![](img/84810ddf87352f3d89892fec747b364a_95_0.png)


    ## 椰奶牛肉 (Beef with Coconut)


    这是一道来自马鲁库群岛阿汶的浓郁菜肴，与爪哇菜肴不同，椰奶与南姜、生姜的结合赋予这道菜极人的香气。


    - 2 磅 (1 kg) 牛肉

    - 1 杯 (100 g) 新鲜磨椰丝

    - 1 杯 (80 g) 干椰丝

    - 2½ 杯 (675 ml) 浓椰奶

    - 2 汤匙香ongrass，去外皮并拍碎


    - 1 将牛肉切成一口口大小的块。

    - 2 在平锅中大火炒新鲜椰丝或干椰丝至金黄色，频繁搅拌，新鲜椰丝约10分钟，干椰丝约8分钟。离火放凉。温热时在研钵或搅拌机中将椰丝磨细。

    - 3 在研钵或搅拌机中将所有原料磨成糊状，必要时加入少量油以保持混合物转动。

    - 4 在锅中中火加热油，炒香香料糊，持续3至5分钟。加入牛肉、椰奶和香ongrass，搅拌均匀煮沸，然后不盖盖子慢煮约10分钟，频繁搅拌防止椰奶分离。转小火继续慢煮直到牛肉软且酱汁收干，约30分钟。离火。

    - 5 放入盛盘中，配米饭食用。


    ### 香料糊

    - 6 根香菜，粗切

    - 2 英寸 (5 cm) 新鲜南姜，去皮切片

    - 3 英寸 (8 cm) 新鲜黄姜，去皮切片，以及1汤匙黄姜

    - 3 英寸 (8 cm) 新鲜生姜，去皮切片

    - 1½ 茶匙香菜籽

    - 2 汤匙白椒

    - 1 茶匙盐


    供6至8人食用准备时间：20分钟 烹饪时间：1小时


    ## 玉米饭 (Corn Rice)


    在米昂贵或难以获取的地区，玉米常用于增加饭的量。干玉米需浸泡24小时，但使用新鲜或罐装玉米不需要。


    - 1½ 杯 (300 g) 生米，洗净并彻底沥干

    - 1½ 杯 (360 g) 玉米粒，从新鲜玉米上取出，或15盎司 (425 g) 罐装玉米粒，沥干

    - 3½ 杯 (775 ml) 水


    - 1 在锅中将所有原料煮沸。如果使用新鲜玉米，不要在此阶段加入。转中火慢煮直到水干，5至7分钟。如果使用罐装玉米，将玉米加入米中。

    - 2 转小火继续煮110分钟，频繁搅拌防止烧焦，直到米饭干且松软。离火，搅拌热食用。


    供4至6人食用准备时间：5分钟 烹饪时间：20分钟


    ## 万加达式排骨汤 (Makassarese Sparerib Soup Konro Makassar)


    苏威拉腊部的望加达人以含有香ongrass和椰奶的浓肉汤而闻名。


    - 2 磅 (1 kg) 肉多的牛肉排骨，分开并切成段

    - 3 杯 (300 g) 新鲜磨椰丝，或2杯 (150 g) 无糖干椰丝

    - 16 杯 (4升) 水

    - 3 茎香ongrass，只要厚部，去外皮并拍碎

    - 1 英寸 (2.5 cm) 新鲜南姜，去皮切片

    - 3 叶青柠檬叶 (kaff lime leaves)

    - 1 茶匙白胡椒

    - 1 茶匙盐

    - 炸洋葱酥（第34页），用于装饰


    ### 香料糊

    - 3 颗山竹果，粗切

    - 3–4 颗洋葱，去皮

    - 2 瓣大蒜，去皮


    - 1 按照第34页的食谱准备炸洋葱酥。

    - 2 分开牛肉排骨并切成段。备用。

    - 3 在平锅中低火干炒磨椰丝，频繁搅拌直到变成金黄色，新鲜椰丝约10分钟，干椰丝约5至7分钟。离火放凉。温热时在研钵或搅拌机中将椰丝磨细。

    - 4 在研钵或搅拌机中将所有原料磨成光滑糊，必要时加入少量油以保持混合物转动。备用。

    - 5 在大锅中将牛肉和水煮沸，转中火不盖盖子慢煮直到牛肉软，30至40分钟。加入磨椰丝、香料糊和所有剩余原料（除炸洋葱酥外），搅拌均匀继续慢煮15分钟，直到牛肉非常软但不脱骨。离火，撒上炸洋葱酥作为装饰食用。


    供4至6人食用准备时间：20分钟 烹饪时间：1小时5分钟'
