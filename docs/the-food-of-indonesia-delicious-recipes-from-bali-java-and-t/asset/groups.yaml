    # # Beef with Coconut


    A coconut-rich beef dish from Ambon, in the Spice Islands of Maluku, which unlike
    dishes from Java and Sumatra has no chili, sugar and soy sauce. Nevertheless,
    the combination of coconut with galangal, turmeric and ginger gives this dish
    a wonderfully aroma and flavor.


    +   - 2 lbs (1 kg) top round or stewing beef

    - 1 cup (100 g) freshly grated coconut

    - or 1 cup (80 g) unsweeted desiccated coconut

    - 2 tablespoons

    - 2½ cups (675 ml) thick coconut milk

    - 1 lemongrass ginger, thickly bottom

    - thirdly, outer layers discarded,

    inner part bruised


    +   1 Slice the beef into bite-sized chunks.

    2 Dry-fry the grated coconut or desiccated coconut in a skillet over high heat
    until golden brown, stirring frequently, about 10 minutes for freshly grated coconut
    or 5 to 8 minutes for desiccated coconut. Remove from the heat and allow to cool.
    While still warm, grind the coconut in a mortar or blender until fine.

    3 Prepare the Spice Paste by adding all the ingredients to a paste in a mortar
    or blender, adding a little oil if necessary to keep the mixture turning.

    4 Heat the oil in a wok over medium heat and stir the Spice Paste until fragrant,
    3 to 5 minutes. Add the beef, coconut milk and lemongrass, mix well and bring
    to boil, then simmer uncovered for about 10 minutes, stirring constantly to prevent
    the coconut milk from separating. Reduce the heat to low and continue to simmer
    uncovered, stirring from time to time, until the beef is tender and the sauce
    has dried up, about 30 minutes. Add a little water if the sauce dries up before
    the meat is cooked. Remove from the heat.

    5 Transfer to a serving platter and serve with steamed rice.


    Serves 6 to 8 | Preparation time: 20 mins | Cooking time: 1 hour


    +   - 6 cilantro, roughly chopped

    - 2 in (5 cm) fresh galangal, peeled and sliced

    - 3 in (8 cm) fresh turmeric, peeled and sliced, and 1 tablespoon turmeric

    - 3 in (8 cm) fresh ginger, peeled and sliced

    - 1½ teaspoon coriander seeds

    - 2 tablespoons ground white pepper

    - 1 teaspoon salt


    # # Corn Rice


    Corn is often used to add bulk to rice in areas where rice is costly or difficult
    to obtain. Dried corn should be soaked for 24 hours before use, although this
    is unnecessary if using fresh or canned corn.


    +   - 1½ cups (300 g) uncooked rice, washed and thoroughly drained

    - 1½ cups (360 g) sweet corn kernels, cut from fresh cobs,

    - or one 15-oz (425-g) can get sweet corn kernels, drained

    - 3½ cups (875 ml) water


    +   1 Bring all the ingredients to a boil in a pot. If using sweet corn, do not
    add at stage. Reduce the heat to medium and simmer until the water has already
    dried up, 5 to 7 minutes. If using canned sweet corn, add the corn to the rice.

    2 Reduce the heat to low and continue cooking the rice for 10 more minutes, stirring
    from time to prevent burning, until the rice is dry and fluffy. Remove from the
    heat, stir and serve hot.


    Serves 4 to 6 | Preparation time: 5 mins | Cooking time: 20 mins'
