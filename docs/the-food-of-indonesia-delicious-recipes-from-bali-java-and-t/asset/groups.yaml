    - 1/2 (1 cm) 新鲜生姜，去皮切片

    - 2-3 根红色指长辣椒，去籽

    - 4-5 根红葱

    - 4 瓣大蒜，去皮

    - 1/2 茶匙盐


    1. 如果使用完整鱼，去鳞、去内脏并清洗，然后在侧面切几道浅斜刀。用盐和白椒调味，备用 15 分钟。

    2. 调制香料酱：在研钵或搅拌机中研磨所有配料，必要时加入少量水以保持混合物流动。

    3. 在�埚或煎锅中将香料酱、水和罗望子汁煮沸。转中火，不盖盖子慢炖 10 分钟，期间均匀翻鱼。

    4. 将鱼移至盛盘中，淋上酱汁。撒上小葱和柠檬块装饰。


    供 4 人享 | 准备时间：25 分钟 | 烹饪时间：25 分钟


