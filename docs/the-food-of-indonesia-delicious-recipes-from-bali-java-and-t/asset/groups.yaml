    # # Sweet Sugar Rolls with Palm Sugar Syrup


    An inexpensive dessert in Indonesia where sugar flour, palm sugar and coconut
    are readily available.


    +   - 1 cup (120 g) sugar flour (see note)

    - or tapioca flour

    - 1 cup (185 g) shaved palm sugar or dark brown sugar

    - 31/2 cups (875 ml) water

    - 2 pandanus leaves, tied in a knot,

    - or 1/4 teaspoon pandanus extract

    - Large square of banana leaf or parchment paper

    - Toothpicks, to fasten

    - 1 cup (100 g) freshly grated coconut

    - or 1 cup (90 g) lightly unsweetened coconut flakes

    - 1/2 teaspoon salt


    +   1 Make the Palm Sugar Syrup by bringing the palm sugar and water to a boil
    over high heat in a saucepan. Reduce the heat to low, simmer uncovered for about
    10 minutes, stirring from time to time, until the sugar is dissolved and the mixture
    turns syrup.

    2 Combine the tapioca flour, palm sugar and water in a saucepan and mix well.
    Add the pandanus leaves to the mixture and bring the mixture to a boil over high
    heat. Reduce the heat to simmer and uncovered for about 30 minutes, stirring from
    time to time until the mixture thickens. Remove from heat and set aside cool.

    3 When cool enough, place the mixture on the piece of banana leaf or parchment
    and roll it up to form a cylinder. fasten the ends of the roll with toothpicks
    and set aside to cool.

    4 Combine the grated coconut and salt, and mix well.

    5 To serve, slice the rolls into disks, sprinkle with a little grated coconut
    (mixed with salt) and drizzle the Palm Sugar Syrup over.


    +   Palm Sugar Syrup

    - 1/2 cup (100 g) shaved palm sugar

    - 1/2 cup (125 ml) water


    > Note: Sugar flour, from the trunk of the palm tree is produced in Indonesian
    and Pacific islands. It is in powder form in plastic packets in supermarkets,
    as is tapioca flour (also known as cassava flavour).


    Serves 6 to 8 Preparation time: 20 mins Cooking time: 45 mins


    # # Sweet Rice Flour Porridge Bubur Sumsum


    Various types of flour made from sugar, tapioca, rice and round green mung beans
    are widely used for making simple desserts and cakes. Bubur Sumsum is the Indonesian
    equivalent of a Jewish mother''s Chicken Soup—if you have a problem, eat a bowl
    of Bubur Sumsum and all will be well.


    +   - 1/2 cup (180 g) rice flour

    - 6 cups (1.5 liter) water

    - 1/2 cup (50 g) freshly grated coconut

    - 1/2 cup (40 g) lightly unsweetened dried coconut flakes

    - 1/2 teaspoon salt

    - 1 portion Palm Sugar Syrup (see above)


    +   1 Make the Palm Sugar Syrup by following the above recipe (step 1).

    2 Combine the flour and water in a mixing bowl and mix well. Strain the mixture
    through a fine sieve to remove any lumps. Place in a non-stick saucepan and bring
    the mixture to a boil over high heat, reduce the heat and simmer for about 30
    minutes, stirring from time to time until it thickens. Remove from the heat and
    allow to cool.

    3 Combine the grated coconut and salt, and mix well.

    4 To serve, scoop the rice porridge into individual serving bowls and top with
    a little grated coconut (mixed with the salt), followed by a drizzling Palm Sugar
    Syrup over.


    Serves 4 to 6 Preparation time: 10 mins Cooking time: 30 mins


