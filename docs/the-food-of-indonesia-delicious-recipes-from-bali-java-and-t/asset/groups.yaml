    # # An Invitation to a Feast

    How an Indonesian Meal is Composed and Eaten


    "Silakan makan" is the polite Indonesian invitation that precedes any meal served
    to guests (and a phrase that foreigners should always wait for before eating any
    food or snack served by their Indonesian hosts). But in most homes throughout
    the archipelago, when not present, meals are an informal affair and often eat
    alone. Millions of Indonesians wake up before dawn, when the fragrance of freshness
    of their morning returns from market with ingredients. The task of cooking begins,
    there will be a breakfast of few leftovers from the night before, perhaps a few
    sticky cakes from the market, a bowl of noodles or a simple plate of fried rice.


    family help themselves to whatever they want whenever they feel hungry during
    the day, or may take a container of food to the office or to be eaten at midday.
    Evening meals, taken at the end of the day, are often born from leftover meat
    from the midday meal, or two extra dishes cooked independently


    The most staple food is rice (although there are variations in regions) and Indonesians
    surprisingly large amounts of it, together with many side dishes and condiments.
    Only small amounts of these savory dishes—which may include poultry, meat, eggs,
    vegetables, tofu or tempehare variety.


    As the food is even sometimes after it has been prepared, it is served at room
    temperature. Modern homes in the towns and cities often have rice coolers, to
    keep warm for several hours.


    Where meals are communal, the rice and all the accompanying dishes are placed
    in the middle of the table or on a mat one helps themselves to whatever they want.
    It is considered impolite to take one plate with the first serving; just little
    will do, as there is plenty of opportunity to make more food as the meal progresses.


    Rather than the name of the meal, Indonesians prefer to enjoy a little of four
    or five rather than large holdings of one or two.


    Indonesians traditionally eat with the right hand (the left is unclean by Muslims),
    although serving spoons are used to transfer the food


    Condiments are as important as the savory dishes and usually include a chili-sambal
    as well as something to provide a crunchy contrast. This could be deep-fried tempeh,
    deep fried fish (ikan teri), wafers of tapa seasoned with shrimp, or bitter melon
    nuts then deep-fried coconut concoction such as rendang or peanut water


    The rice and dishes are served quickly in the day, immediately after a trip to
    the market or with items gathered from the garden. Many meals, especially in the
    remote areas of far-reaching archipelago, are extremely simple and consist of
    the local staple plus a little fried fish and chili sambal, with some deep-fried
    shallots or a drizzle of sweet black sauce (kecap manis) with chopped herbs or
    lime juice.


    or bowls for the serving dishes. (Using a spoon or fork that you are eating from
    in a communal serving dish, as this is considered unclean!) Most households and
    restaurants provide a spoon and fork, while chopsticks can be expected in Chinese
    restaurants.


    The prepared food is usually set on a table in the kitchen protected from insects
    by cool food covers made of wonden banana leaves or plastic mesh. Members of the


    In more affluent households, the choice of dishes to accompany the rice is made
    with a view of achieving balanced flavors and textures. One of the savory dishes
    has a rich coconut-gravy, which is served with a sharper flavor. There may also
    be a pungent sambal made from a spicy chili (sambal), but this is served with
    balanced rice or other dishes using kecap manis (sweet soy sauce or palm sugar)


    Part of cooking Indonesian food is planning the range of dishes. Many of these
    can be prepared in advance, once the guests arrive, they can relax and enjoy their
    company.


    ![](img/84810ddf87352f3d89892fec747b364a_15_0.png)


    Congregated girls in Southern Sulawesi enjoy a meal, in typical Indonesian style,
    rice and side dishes are placed in the center of the table to help them remember.
    A back lane in Ubud is for a temple festival. The bamboo poles of the roadside
    are known as jenjor, and are symbols of prosperity.'
