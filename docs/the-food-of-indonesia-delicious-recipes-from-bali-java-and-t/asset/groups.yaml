    ## 罗勒番茄 Sambal 烤鱼


    Ikan Bakar Colo Colo


    鱼肉直接烤或用香蕉叶包裹，在印尼东部的苏拉威锡和马鲁古岛非常受欢迎。这个食谱非常简单——使用典型的 Colo Sambal 调味。


    - 2 条完整鲜鱼（约 1 kg），或 1.5 磅 (700 g) 鱼排

    - 1/2 茶匙盐

    - 1 汤匙新鲜柠檬汁

    - 2 汤匙油

    - 1 片大香蕉叶或铝箔，用于包裹

    - 3-4 根红色指长辣椒，去籽切片

