    ## Grilled Fish with Basil and Tomato Sambal


    Ikan Bakar Colo Colo


    Fish, grilled plain or wrapped in banana leaves, is very popular on the eastern
    Indonesian islands of Sulawesi and Maluku. This recipe is very simple—flavored
    with a typical Colo Sambal.


    - 2 whole fresh fish (about 2 lbs/1 kg), or 1 1½ lbs (700 g) fish steaks

    - 1/2 teaspoon salt

    - 1 tablespoon freshly squeezed lime or lemon juice

    - 2 tablespoons oil

    - 1 large banana leaf or aluminum foil, for wrapping

    - Colo Sambal

    - 3–4 red finger-length chilies or bird''s-eye chilies, deseeded and sliced

    - 4 shallots, peeled and sliced

    - 2 ripe tomatoes, diced

    - 4 sprigs Asian basil, minced

    - 4 tablespoons sweet Indonesian soy sauce (kecap manis)

    - 2 tablespoons freshly squeezed lime or lemon juice


    1. If using whole fish, scale, gut and clean the fish, then make several diagonal
    slits on each side. Season the fish with the salt and lime or lemon juice, then
    brush it with the oil. Set aside for 15 minutes.

    2. Make the Colo Colo Sambal by combining all the ingredients in a bowl and mixing
    well.

    3. Scald the banana leaf in a basin by pouring boiling water over it, then wipe
    it dry. Wrap the parcel directly over hot charcoal or under a preheated broiler
    until the banana leaf is evenly browned and the fish is, 10 to 15 minutes on each
    side.

    4. Unwrap the fish parcel and spoon the sambal over it. Serve immediately. Alternatively
    serve the Colo Colo Sambal in a small bowl on the side.


    Serves 4 | Preparation time: 20 mins | Cooking time: 30 mins


    ## Lemongrass Tamarind Fish Arsin Ikan Mas


    With plentiful lakes and rivers, Sumatra is the source of many delicious freshwater
    fish recipes, including this one.


    - 2 lbs (1 kg) freshwater fish as carp or trout, either whole fish or fillets

    - 1 teaspoon salt

    - 1 teaspoon ground white pepper

    - 2 cups (500 ml) water

    - 3 stalks lemongrass, thick third only, outer layers discarded, inner part bruised

    - 2 tablespoons tamarind juice, sliced, to garnish

    - 1 spring onion, roughly chopped

    - 2 limes or 1½ lemon, cut into wedges


    ### Spice Paste

    - 6 candied nuts

    - 1 (½ cm) fresh galangal, peeled and sliced

    - 1 (½ cm) fresh turmeric, peeled and sliced, or 1 teaspoon ground turmeric

    - 1 (½ cm) fresh ginger, peeled and sliced

    - 2-3 red finger-length chilies, deseeded

    - 4-5 shallots

    - 4 cloves garlic, peeled

    - 1½ teaspoon salt


    1. If using whole fish, scale, gut and clean the fish, then make several shallow
    diagonal slits on each side. Season the fish with the salt and pepper, and set
    aside for 15 minutes.

    2. Make the Spice Paste by grinding all the ingredients in a mortar or blender,
    adding a little water if necessary to keep the mixture turning.

    3. Bring the Spice Paste, water, and tamarind juice to a boil in a wok or skillet.
    Reduce the heat to medium and simmer uncovered for 10 minutes, turning the fish
    evenly.

    4. Transfer the fish to a serving platter and pour the sauce over it. Garnish
    with spring onion and lime wedges.


    Serves 4 | Preparation time: 25 mins | Cooking time: 25 mins

