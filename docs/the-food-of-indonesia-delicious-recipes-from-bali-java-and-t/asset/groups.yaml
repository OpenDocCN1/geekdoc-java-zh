    # Soto Ayam with Potato Croquettes Chicken Noodle Soup


    Soto is a robust soup made with lemongrass, turmeric and coriander, and served
    with noodles, lontong (compressed rice) or potato croquettes (perkedel). If desired,
    the croquettes can be omitted and the dish can be garnished with potato chips
    or emping (melin nuts, saute so).


    +   - fresh chicken

    - 12 cups (3 litres) water

    - 2 stalks lemongrass, thick bottom

    - third only, outer leaves discarded, inner part bruised

    - 3 kaffir leaves

    - 2 sprigs Chinese celery leaves, sliced

    - 1/2 teaspoons salt

    - 1/2 tablespoon ground white pepper

    - 7 oz (200 g) dried glass noodles (tanghoon), soaked in water (so soft) or dried
    rice vermicelli (beehoon)

    - 5 hard-boiled eggs, peeled and quartered


    +   1 Prepare the Samb Soto by following the recipe on page 34.

    2 Clean and rinse the chicken well. Bring the water to a boil over high heat in
    a large pot, immerse the chicken in the boiling water and boil for 15 minutes.
    Turn off the heat and let the chicken steam in the pot for 15 to 20 minutes. Remove
    the chicken and strain the stock. Separate the chicken from the bone and tear
    the meat into shreds. Set aside.

    3 Make the Potato Croquettes by combining the mashed potato with all other ingredients,
    except the egg and oil, and mix well. Shape the mixture and set aside to chill
    in the refrigerator for 45 minutes. Heat the oil in a wok over medium heat. Dip
    each potato in the egg, then turn golden, 2 to 3 minutes on each side. Remove
    from the heat and drain on paper towels. Repeat until all patties are cooked.

    4 To make the paste in a mortar or blender, grind the garlic and coriander to
    a smooth paste, adding a little oil if necessary to keep the mixture turning.
    Heat the oil in a wok or skillet over medium heat and stir-fry the paste until
    fragrant, 3 to 5 minutes. Set aside.

    5 Bring 8 cups (2 liters) of the reserved chicken stock, lemongrass, kaffir lime
    leaves and celery to boil in a pot. Reduce the heat to low simmer uncovered for
    about 15 minutes. Season with the salt and pepper, and keep the broth hot over
    very low heat.

    6 To serve, portion the softened glass noodles and shredded chicken into individual
    serving bowls. Lay the broth over and top with hard-boiled eggs, bean sprouts
    and Potato Croquettes. Garnish with Crispy Fried Shallots and celery leaves, and
    serve with lime wedges and a bowl of the Sambal Soto.


    +   Potato Croquettes

    - 2 potatoes, boiled, and mashed

    - 1/4 teaspoon ground white pepper

    - 1 spring onion, thinly sliced

    - 1/4 teaspoon salt

    - 1/4 teaspoon freshly grated nutmeg or ground nutmeg

    - 1 tablespoon minced celery leaves

    - 2 tablespoons Crispy Fried Shallots (page 34)

    - Oil, for deep-frying


    +   Crispy Fried Shallots (page 34)

    - 2 tablespoons Chinese celery leaves, to garnish

    - Lime wedges, to serve

    - 1 portion Sambal Soto (page 34)


    +   Spice Paste

    - 1 in (1/2 cm) fresh turmeric, peeled and sliced, and 1 tablespoon turmeric

    - 5 shallots, peeled

    - 5 cloves garlic, peeled

    - 2 tablespoons ground coriander

    - 1 tablespoon oil


    Note: Glass noodles (tanghoon), also made from mung bean, are also called transparent
    or cellophane noodles. They are used in soups and vegetable dishes. Substitute
    dried rice vermicelli—see page instructions for preparation. To save time, prepare
    the chicken stock and Potato Croquettes in advance and reheat before serving.


    Serves 6 to 8 Preparation time: 1 hour + 45 mins chilling Cooking time: 55 mins'
