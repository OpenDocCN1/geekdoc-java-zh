    ## 印度尼西亚厨房


    简约与实用的结合


    印度尼西亚许多令人惊叹的特点之一，是如此美味的食物——通常是草药、香料和调味品的复杂融合——竟然是从最简单的厨房中诞生的。大多数印度尼西亚人从未见过那种光发亮的现代设计师厨房、瓷砖表面、家用电器以及冷热水。那里的厨房远非乡村风格，菜肴是在木火或
    `kompor`（煤炉）上烹饪的。在许多城市地区，通常使用 LPG 燃料的燃气灶。


    在你的厨房里准备印尼菜需要相当的技巧，因为所需的厨具并不多（见下节）。首先，你需要某种东西来研磨或捣碎调味品（bumbu），它们是无数印尼菜肴的基础，也用作辣椒酱（sambal）的配料。在印度尼西亚，经常使用由火山岩制成的盘状研臼和石杵。与马来西亚和泰国使用深口研臼捣碎食材不同，印度尼西亚的
    `cobek` 是在石面上通过后退动作揉搓食材，而石面因使用而变得略微圆润。


    研臼和石杵非常适合少量的食材，大多数现代厨师会使用食物加工机、搅拌机或漏勺（spider），这是准备基础香料糊或 `rempah` 最简单的方法。现在小型的香料研磨机配件非常齐全，对许多菜肴非常方便。


    菜刀和菜板同样重要。这对组合可以完成许多任务：将蔬菜切成所需的尺寸；将肉或鱼切成细末状的食物。菜刀的平面用于处理柠檬草、豆蔻或南姜（以及大蒜）等。在亚洲，树干的粗壮横面被用作菜板；这种板材既耐用又实用。配合一把刃宽为
    3-4 英寸（7-10 厘米）的菜刀。


    锅基本上是一个圆锥形锅，用于许多菜肴的煎炸。它被称为 `kwal`（或爪哇语中），这种多功能工具对于深炸（用油较少）非常实用，而且对于许多以大量液体开始、以干香料结束的菜肴，它提供了恰蒸发量。


    一个不易翻倒的重型铁锅更好，最好是“劳斯莱斯”级别的，即由不粘合金制成，在使用金属铲时不会刮伤。为了配合工作，一把金属铲和一个用于捞出油炸食物的带孔勺是很有用的。


    印度尼西亚烹饪还使用各种铝制或铸铁的锅来烹饪食物。许多配方含有酸性成分，如罗望子汁或柠檬汁或椰奶，使用铝或铸铁会破坏酱汁或产生化学味。应使用不锈钢、玻璃或搪琅汤锅。


    印度尼西亚烹饪中使用的一种物品在外面很少买到。这就是多功能香蕉叶，用于包裹食物、蒸制或直接放置在热炭上。香蕉叶的种类令人惊叹，它展示了 24 种用香蕉叶包裹食物的方法，取决于内容和制作风格！如果你能获得香蕉叶，请将它们擦干净并用它们包裹食物。在使用前，在盆中放入沸水直到其变软。铝箔可以用先用纸包裹食物，再裹上铝箔来代替。然后将包裹好的食物通常放在冷水蒸笼内，蒸制米饭。


    印度尼西亚的厨房以带盖的中国式蒸器而闻名。蒸器放在锅内，沸水上方。竹盖会吸收水分并减缓……


    竹蒸器的替代品是放在锅内沸水上方的带孔金属盘，但它盛装的食物没有双层蒸器多，而且你需要找到一个适合你工作的盖子。


    采购：由火山岩制成的传统研臼和石杵在印度尼西亚很常见，它是准备每道印尼菜所需香料糊的重要工具。基础香料糊或 `rempah` 由红葱、姜、南姜、柠檬草和糖组成，通常还会加入其他香料或草药作为


    ![](img/84810ddf87352f3d89892fec747b364a_18_0.png)


    ## 烹饪方法


    准备关重要的香料糊、米饭和椰奶


    印尼菜有多种准备方法：煎或油炸、在热炭上烤、蒸，甚至——在伊门望亚的偏远地区——在波利尼西亚式的土炉中烘烤。


    掌握使用研磨机准备基础香料糊或 `rempah` 的艺术对许多菜肴至关重要。印尼料理使用石臼；必要时对食材去皮，并在相关情况下前将其切片或切成小块。如果你使用搅拌机或食物加工机，准备香料的过程快得多，但需要加入一些牛奶来保持机器内的混合物。香料糊要先在热油中煎炸，将规定量的一部分加入食物中。如果香料要在椰奶、高汤或水中炖，则加入少量的这种液体即可。


    研磨或处理香料的顺序很重要。先研磨硬物品：香料、坚果和坚韧的根部或叶子，如柠檬草。当它们变细后，加入软根部，然后加入水分充足的食材，如红葱和大蒜。最后加入碎末状或液体成分，如虾酱、棕榈糖和姜黄，并加工混合。如果混合物粘在侧壁，你可能需要关闭机器并摇晃容器，或打开它并用铲将食材推向中心。


    香料要先在热油中煎炸，将规定量的一部分加入食物中。如果香料要在椰奶、高汤或水中炖，则加入少量的这种液体即可。


    研磨或处理香料的顺序很重要。先研磨硬物品：香料、坚果和坚韧的根部或叶子，如柠檬草。当它们变细后，加入软根部，然后加入水分充足的食材，如红葱和大蒜。最后加入碎末状或液体成分，如虾酱、棕榈糖和姜黄，并加工混合。如果混合物粘在侧壁，你可能需要关闭机器并摇晃容器，或打开它并用铲将食材推向中心。


