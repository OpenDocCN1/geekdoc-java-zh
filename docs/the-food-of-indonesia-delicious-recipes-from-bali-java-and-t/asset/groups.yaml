    # 番茄三巴辣椒炸鱼


    这种典型的海鲜菜来自中爪岛北部海岸佩卡洛贡县的村庄，使用像鲱鱼那样的小鱼。


    - 1/2 磅（700 克）小鱼，切块清洗后留用，或鱼排

    - 1 汤匙盐

    - 5 汤匙油

    - 2 根红手指指椒辣椒，去籽切片（可选）

    - 3 头红葱，去皮切片

    - 2 瓣大蒜，去皮切片

    - 2 个熟西番茄，切成块

    - 1 片斑兰叶

    - 2 汤匙罗望水（第 26 页）

    - 2 茶匙糖

    - 一小撮盐

    - 1/2 茶匙白胡椒粉

    - 3 汤匙水

    - 几枝柠檬罗勒，作装饰


    1. 用盐腌制鱼肉，静置 15 分钟。

    2. 在研钵或搅拌机中将所有食材磨成光滑的酱糊，必要时加入少量油使混合物旋转。备用。

    3. 在炒锅中用中火加热 3 汤匙油，至冒油。煎鱼至金黄色且酥脆，需 5 到 7 分钟。从锅中捞出，放在厨房纸上吸油。

    4. 在炒锅中用中火加热剩余油，翻炒调料酱至闻香，需 3 到 5 分钟。加入切片辣椒（如使用）、红葱、大蒜、西番茄块、斑兰叶和罗望水，翻炒 1 分钟，然后用糖、盐和胡椒调味。最后加入炸鱼和水，搅拌均匀并小火炖
    1 分钟后离火。

    5. 盛入浅盘中，离火前撒上罗勒装饰即可食用。


    ### 调料酱

    - 2 块南姜，粗切

    - 3-4 根手指指椒辣椒，根据喜好

    - 6 头红葱，去皮

    - 2 瓣大蒜，去皮

    - 1/2 英寸（1 厘米）新鲜南姜，去皮切片

    - 1/2 英寸（1 厘米）新鲜生姜，去皮切片

    - 1/2 英寸（1 厘米）新鲜黄姜，去皮切片，或 1 茶匙香菜粉


    供 4 人食用 | 准备时间：30 分钟 烹饪时间：15 分钟


