    ## 地道的印尼西亚食材


    香蕉叶为食物注入细腻的味和香气。它们在蒸或烤菜肴时常作包装，或在烹饪时作为盛食物的小托盘。使用前在沸水中泡软，以防包裹食物时破裂。


    可以作为替代品，虽然较便宜的杏仁或腰果也可以。山油果从不生吃，也不单独食用，而是切碎后与调料和香料混合一起烹饪，以增加风味和口感。由于含油量高，它们变质很快，所以要少量购买并冷藏保存。


    ![](img/84810ddf87352f3d89892fec747b364a_23_0.png)


    印尼常用的豆芽是由绿豆发芽而成的。虽然有豆芽但不常见。购买新鲜的豆芽，因为它们很快失去清脆的口感。不过，如果放在冰箱里浸泡在水中，可以保存几天。


    豆蔻荚 (kepulaga) 用于菜肴和甜点的调味——赋予食物浓郁、甜美的香气。纤维状的星形果壳包裹着 15-20 颗黑色种子。使用前用菜刀或研杵轻微压碎。尽量不要使用豆蔻粉，因为它的品质远逊于完整的豆蔻。


    杨果是一种淡绿色的水果（长 5-8 厘米）。它们成簇生长，与大星果有关。杨果可以整颗或切片使用，为汤、鱼类菜和辣酱 (sambal) 增加酸味。可以用罗子汁或西柚汁代替。


    ![](img/84810ddf87352f3d89892fec747b364a_23_1.png)


    山油果 (buah kemi) 是奶油色的坚果，大小和质地与马斯加加果相似，可以


    芹菜 (seledri) 在印尼通常被称为“中式芹菜”。它的茎很细，比普通的蔬菜芹菜更香。它的叶子被大量用作汤和炖菜的点缀。可以用芹菜或意大利欧芹代替。


    ![](img/84810ddf87352f3d89892fec747b364a_23_2.png)


    罗勒在印尼烹饪中常用作调料和点缀，有多种类型。最常用的罗勒是亚洲罗勒或 selasih，与欧洲和美国的甜罗勒相似。它被大量用作调料，罗勒叶也经常被加入新鲜蔬菜盘中。柠檬罗勒
    (kemangi) 与之相似，但带有独特的柑橘香气。圣罗勒在泰国被称为 kaprow，具有丁香的香气。它的味道辛辣火热，主要用于炒菜。亚洲罗勒通常可以在食品商店和许多超市买到，但甜罗勒是可以接受的替代品。


    ![](img/84810ddf87352f3d89892fec747b364a_23_3.png)


    冬瓜 (labu) 是一种椭形的绿色南瓜，带有小白色种子。煮熟时，种子是可以食用的，非常美味。在货源充足的超市出售。可以用西芦代替。


    ## 干辣椒


    罐装椰奶有不同的稠度，取决于品牌，你可能需要加水来调整厚度。通常情况下，向 1 杯罐装椰奶油加入 1 杯水获得椰奶，或加入 2 杯水获得浓椰奶油。细碎的椰丝以各种尺寸出售，通常在烘焙区。


    鸟眼辣椒 (cabai) 遍布印尼。新鲜的红色和绿色辣椒中等辣。干红色或绿色辣椒通常切成段并泡在温水中使其变软。在准备前丢掉部分或全部辣椒以减轻辣度。


    ![](img/84810ddf87352f3d89892fec747b364a_24_0.png)


    干虾 (ebbi) 是受欢迎的亚洲食材，用于酱汁和辣酱。日干的虾类呈红色且饱满，可以保存几个月。寻找颜色亮且完全去壳的干虾。


    香菜 (ketumbar) 是印尼最常用的香料之一。小圆种子呈淡棕色到黑色，外面有纹路。它们赋予食物泥土芬芳，可以整颗使用或磨成粉。孜然籽通常与香菜籽配对，经常干烤或在油中炸香以增强风味。在某些食谱中，干虾与其他食材一起磨碎，并在油中炸香而不干烤。


    ![](img/53289892fec747b364a_24_1.png)


    孜然籽 (jinten) 是脱水的。甜味和无甜味的椰丝在各种商店出售。


    虾膏 (terasi) 是发酵干虾的浓稠混合物，气味非常强烈，可能令某些人反感。马来语也称为 belacan，块状使用，在平锅上用火火烘烤以增强风味。


    肉桂比桂皮颜色更浅、更薄、也更贵。桂皮的味道比肉桂更强，但可以是可以接受的替代品。在需要肉桂棒的地方，不要用肉桂粉代替：


    ![](img/53289892fec747b364a_24_2.png)


    咖喱粉是一种商业香料混合，包含孜然籽、香菜籽和丁香。不同颜色和风味的组合用于不同的咖喱——肉、鱼或鸡肉。如果没有特定的咖喱粉，可以使用全能混合粉。放在冰箱的密封容器中。


    椰奶或奶油 (santan) 有新鲜的也有包装的，快速且方便。


    南姜 (galangalang) 是姜科的一种香根根。它为许多东南亚菜肴带来了独特的味道和香气。尝试寻找嫩的粉南姜，因为它们更软。磨碎前总是去皮并切片，因为根很硬。南姜也有干的、冷冻的包装在水里的，但尽可能获取新鲜根，因为它更香气。


    ![](img/53289892fec747b364a_24_3.png)


    山药 (jicama) 可以生吃，切片后配岩盐或酱料，作为清爽的零食食用。在超市的蔬菜区寻找它。


    柠檬青柠叶 (daun jeruk purut) 加入咖喱中，或切细丝加入沙拉中，赋予它们极佳的酸甜味。它们常用于印尼和其他东南亚菜系，在亚洲食品商店有冷冻或干的。冷冻叶比干的更有香气。


    ![](img/53289892fec747b364a_24_4.png)


    大蒜韭 (kucai)，在印尼有时被称为中式韭，叶子扁平像洋葱。它们有浓浓的大蒜味，在中式烹饪中经常加入面条或炒蔬菜中。可以用洋葱代替，尽管它们味道很淡。


    山山 (kencur)，有时被误认为小南姜，也称为 zedoary。山山具有独特的、类似樟脑的味道，应该节制使用。使用前必须先冲洗并刮去皮。干山山在使用前最好在沸水中浸泡
