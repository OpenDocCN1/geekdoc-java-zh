    ## Marinated Shrimp


    Belimbing wuluh are small, carambola fruits grow abundantly in house gardens throughout
    Indonesia and other parts of Southeast Asia. They add a delicious tang to this
    North Sumatran salad, although tamarind may also be used.


    - 1/2 lb (700 g) large fresh shrimp

    - 4 cups (1 liter) water

    - 2 red-finger chilies, deseeded

    - 4 shallots, peeled

    - 2 belimbing wuluh (carambola), or 2 tablespoons tamarind juice (page 26)

    - Sprigs of fresh parsley or coriander leaves (cilantro), to garnish

    - Bottled sweet sweet chili sauce, to serve


    1. Bring the shrimp and water to boil in a large saucepan. Immediately reduce
    the heat and simmer until the shrimp turn pink, 2 to 3 minutes. Quickly drain
    and plunge the shrimp into a bowl of iced water for 30 seconds to stop the cooking.
    Drain, peel and devein. Transfer to a serving platter and set aside.

    2. Grind the chilies, shallots and belimbing or tamarind juice to a smooth paste
    in a mortar or blender, adding a little lime or lemon juice for a more sour taste
    desired. Set aside.

    3. Add the ground paste to the shrimp and toss gently until well coated. Garnish
    with parsley or coriander leaves (cilantro), and serve with a small bowl of sweet
    chili sauce on the side.


    Serves 4 to 6 | Preparation time: 20 mins | Cooking time: 5 mins


    ## Fresh Tuna and Green Mango Salad


    This recipe comes from Ambon, Maluku, where fresh tuna is abundant. If tuna is
    not available, use canned tuna as a substitute, although the flavor is not the
    same.


    - 1 to 2 unripe mangoes (1 lb/500 g in total), peeled and pitted, then thinly
    sliced into matchsticks

    - 1 teaspoon salt

    - 1 lb (500 g) fresh tuna steaks, grilled and debboned, freshly flaked

    - 3 to 4 shallots, peeled and sliced

    - 1 teaspoon ground white pepper

    - 3 tablespoons coconut milk


    1. Place the mango shreds in a colander. Sprinkle the salt over them and mix well.
    Set aside to drain for 10 minutes, then squeeze the mango to remove as much liquid
    as possible.

    2. Place the mango in a large salad bowl. Add the flaked tuna, shallots, pepper
    and coconut milk, and toss well. Serve chilled.


    Serves 4 to 6 | Preparation time: 25 mins


    ## Seasoned Grilled Fish in Banana Leaves Pepes Ikan


    This Kalimantan recipe calls for steamed fishes of flaky, seasoned fish be grilled
    directly over hot charcoal, giving an inimitable flavor.


    - 1 lb (600 g) white fish fillets, skinned and cut into chunks

    - 4-5 shallots, peeled

    - 3 cloves garlic, peeled

    - 2 spring onions, sliced

    - 1 teaspoon white pepper

    - 1/2 cup (85 ml) thick coconut milk

    - 1 tablespoon squeezed lime or lemon juice

    - 1/2 teaspoon salt

    - 2 eggs

    - Banana leaves or aluminum foil, cut into 8-in (20-cm) square pieces, for wrapping


    1. Place the fish chunks in a blender or food processor and pulse for several
    seconds, then add all other ingredients, the banana leaves, and grind to a paste.
    Set aside.

    2. Scald the banana leaves by pouring boiling water over them in a basin, before
    they become flexible. Drain and place the leaves on a clean surface.

    3. Spoon 3 heaped tablespoons of the fish mixture onto each piece of banana leaf
    (or aluminum) and wrap it up as desired for pepes on page 19. Repeat until all
    the fish mixture is used up.

    4. Grill each parcel directly over charcoal or under a preheated broiler for 10
    to 15 minutes, turning from time to time until the banana wrapper is charred.
    Serve hot.


    Serves 4 to 6 | Preparation time: 40 mins | Cooking time: 30 mins


    ## Fragrant Fried Fish Cakes Otak Tok Pipih


    These Japanese fish cakes are flavored with coconut, spices and shallots, and
    can be prepared several hours in advance and kept refrigerated before the final
    deep-frying.


    - 1 cup (100 g) freshly grated coconut

    - 1 cup (80 g) desiccated coconut

    - 1 lb (500 g) white fish fillets, skinned and cut into chunks

    - 2 eggs

    - 1 teaspoon sugar

    - 1 teaspoon salt

    - 1 cup (250 ml) thick coconut milk

    - Oil, for deep-frying

    - 1 portion Pickled Shallots (page 32), to serve

    - 1/2 portion Sambal Soto (page 34), to serve

    - Spice Paste

    - 2 shallots, roughly chopped

    - 1/2 (1 cm) fresh ginger, peeled and sliced

    - 1/2 (1 cm) fresh ginger, peeled and sliced

    - 3 shallots, peeled

    - 2 cloves garlic, peeled


    1. Prepare the Pickled Shallots and Sambal Soto by following recipes on pages
    32 and 34.

    2. Dry-fry the coconut in a skillet over low heat, stirring constantly until golden
    brown, 10 minutes for fresh coconut and 7 minutes for desiccated coconut. Do not
    allow the coconut to burn. Set aside in a small bowl.

    3. Make the Spice Paste by grinding all ingredients in a mortar or blender, adding
    a little oil if necessary to keep the mixture. Add the fish chunks and grind until
    fine.

    4. Place the mixture in a large bowl. Add the eggs, sugar and salt, mix well.
    Shape the mixture into small balls, flatten them with your palm and shape them
    into patties.

    5. Heat the oil in a wok and deep-fry the patties until golden brown on all sides,
    about 5 minutes. Remove from oil and drain on paper towels. Serve hot with bowls
    of Pickled Shallots and Sambal Soto.


    Serves 4 to 6 | Preparation time: 20 mins + time to prepare the pickles and sambal
    | Cooking time: 25 mins + time to prepare the pickles and sambal


    ## Martabak Pancakes with Curried Meat


    This Indian speciality, a nighttime favorite, is often bought as a snack meal
    from food stalls.


    - 2 tablespoons oil

    - 4 cloves garlic, minced

    - 12 oz (350 g) ground lamb or beef

    - 1 onion, diced

    - 1 small leek, halved and thinly sliced

    - 1 red finger chili, deseeded and sliced

    - 3 minced celery leaves

    - 1 tablespoon curry powder

    - 2 eggs

    - 1 spring onion, thinly sliced

    - ½ teaspoon salt

    - ½ teaspoon ground white pepper

    - Green chillies, deseeded, to serve (optional)

    - 1 portion Mixed Vegetable Pickles (page 31), to serve


    Dough

    - 2 cups (300 g) flour

    - 3 tablespoons oil

    - ¾ cup (185 ml) water

    - ½ teaspoon salt


    1. Prepare the Mixed Vegetable Pickles by following the recipe on page 31.

    2. Make the Dough by combining and kneading the ingredients at room temperature
    for 2 hours, until elastic dough. Cover and set aside, then quarter each piece
    into a ball. Lightly roll a rolling pin and roll the Dough on an oiled surface
    to make a large thin circle. Repeat with the rest of the Dough and set aside.

    3. To prepare the filling, heat the oil in a wok or skillet over high heat and
    stir-fry the garlic for a few seconds until fragrant and brown. Add the ground
    meat and stir-fry until it changes color, about 2 minutes. Add the onion, leek
    and celery leaves, blended, stir-fry for 2 more minutes. Add the curry powder
    and stir-fry until well blended, 2 to 3 minutes. Remove from the heat and set
    aside to cool. Divide the filling into 4 equal portions: Add 1 egg, a spring onion,
    salt and pepper to each portion and mix well.

    4. Heat a heavy griddle or skillet over medium heat until hot. Place 1 portion
    of the filling on the center of each Dough. Then fold the sides of the Dough to
    completely enclose the filling. Place the package on the griddle or pan-fry until
    golden brown, 2 to 3 minutes, flip it over and fry the other side until browned.
    Repeat with the rest of the Dough and filling.

    5. Serve hot with fresh chillies (if using) and a bowl of the Mixed Vegetable
    Pickles on the side. For a more elaborate presentation, garnish with spring onions,
    chillies and celery leaves.


    Makes 4 Martabak Preparation time: 30 mins + to prepare the pickles | Cooking
    time: 25 mins


    ## Rujak Fruit and Vegetable Salad with Sweet Tamarind Dressing


    This popular snack, an intriguing mixture of sweet, sour and spicy flavors, is
    prepared at countless warungs throughout Indonesia. The list of raw fruits and
    vegetables that can be included is endless—simply depends on what is available
    and what you feel like eating.


    - ½ small pineapple, peeled, eyes and fibrous core discarded, then sliced

    - 1 unripe mango, peeled and pitted, flesh sliced

    - 1 small cucumber, peeled, deseeded and sliced

    - 3 water apples (see note) or 1 green apple, rinsed and sliced

    - 1 starfruit, sliced

    - ½ small papaya, peeled, halved, deseeded and sliced

    - 1 portion Sambal Rujak (page 34)


    1. Prepare the Sambal Rujak by following the recipe on page 34.

    2. Place all cut fruits and vegetables in a large salad bowl, drizzle the Sambal
    Rujak over them and toss to coat well. Serve immediately.


    Note. Although this is served as a snack in Indonesia, you can serve it as an
    appetizer or as part of a meal or buffet. Water apples (jambu air) are very juicy
    and crunchy fruits that come in three colors: red, white and pink. They have a
    mild flavor and crisp texture. They have a thin, edible skin which looks a little
    wavy.


    Serves 6 to 8 Preparation time: 45 mins Cooking time: 20 mins

