    # Avocado Smoothies


    This recipe sounds odd but it''s a popular drink throughout Indonesia and actually
    tastes delicious!


    - 4 ripe avocados (10 oz/300 g each)

    - 1/2 cup (60 ml) sweetened condensed milk, cream or evaporated milk

    - 1 tablespoon freshly squeezed lime or lemon juice

    - 3 cups ice cubes

    - Cocoa powder or chocolate syrup (optional)

    - 1 portion Palm Sugar Syrup (page 108)


    - 1 Peel and pit the avocado, then cut the flesh into cubes and set aside.

    - 2 Make the Palm Sugar Syrup by following the recipe (step 1) on page 108.

    - 3 Place all the ingredients, except the cocoa powder or chocolate syrup, in
    a blender and puree until smooth. Serve chilled with a sprinkle of powdered cocoa
    or a drizzling of chocolate syrup if desired.


    Serves 4 | Preparation time: 10 mins | Cooking time: 15 mins


    # Mixed Shaved Ice Dessert


    Indonesia has a multitude of thirst-quenching sweet snacks that are also enjoyed
    as desserts. As Es Campur (Mixed Ice), the contents of this dessert depend upon
    the availability of the ingredients and the preference of the individual. The
    ones listed here are just suggestions. Popular also in the Philippines, where
    it is Halo Halo.


    - 1 portion Palm Sugar Syrup (page 108)

    - 8 tablespoons agar jelly cubes or gelatin cubes

    - 8 tablespoons diced fermented tapioca (tapi, see note)

    - 8 tablespoons diced kolang palm fruits (see note)

    - 2 cups (250 g) diced fruit (papaya, pineapple)

    - 1 young coconut, flesh removed with a spoon, 1 cup (250 ml) of the coconut juice
    removed (optional, see note)

    - 1/2 cup (125 ml) sweetened condensed milk, cream or evaporated milk

    - Crushed ice


    - 1 Prepare the Palm Sugar Syrup by following the recipe (step 1) on page 108.

    - 2 Drain the jelly cubes, fermented tapioca (if using) and kolang. Cut the coconut
    fruit into bite-sized pieces.

    - 3 Place the fruit with all the other ingredients, except the crushed ice, in
    a mixing bowl and mix well. Serve, add the mixture into glasses and with some
    crushed ice.


    > Note: Agar-agar jelly cubes, flavored gelatin cubes, fermented tapioca, kolang
    kaling and coconut water are available in some Asian specialty stores. For bottles
    of young coconut in Filipino stores under the name buko. This is also with jelly
    in cans.


    Serves 6 to 8 | Preparation time: 25 mins | Cooking time: 15 mins


    # Fruit in Coconut Ice


    - 1 portion Palm Sugar Syrup (page 108)

    - 1 sweet potato,

    - 1 large banana, peeled and sliced

    - 5 pieces jackfruit, pitted and sliced

    - 4 cups (1 liter) thick coconut milk

    - Pinch of salt

    - Crushed ice


    - 1 Prepare the Palm Sugar Syrup by following the recipe (step 1) on page 108.

    - 2 Clean the sweet potato, boil in a sauce of water over medium until tender
    and cooked, to 15 minutes. Remove and set aside to cool. Peel and slice the sweet
    potato. Alternatively, steam the sweet potato in a steamer for 15 minutes or microwave
    for 4 to 6 minutes on high.

    - 3 Place all the ingredients in a mixing bowl and mix well. Serve, into individual
    serving bowls and with some crushed ice.


    Serves 6 to 8 | Preparation time: 15 mins | Cooking time: 40 mins


