    4. 在�埚中中火加热油，放入香料酱炒出香气，持续 3 到 5 分钟。加入糖炒至完全溶解，加入椰奶、辣椒、香柠檬和斑苏兰叶煮沸后小火慢炖。转小火加入鸡蛋，不盖盖煮至酱汁浓稠，8
    至 10 分钟。用盐调味关火。撒上炸洋葱装饰并配米饭食用。


