  mdcn: "\n\n![](img/84810ddf87352f3d89892fec747b364a_110_0.png)\n\n# 牛油果奶昔\n\n这个食谱听起来很奇怪，但它是印度尼西亚非常流行的饮料，而且味道美味！\n\
    \n- 4 个熟透的牛油果（每个 10 oz/300 g）\n- 1/2 杯 (60 ml) 甜炼乳、奶油或淡色奶\n- 1 汤匙新鲜榨的青汁或柠檬汁\n\
    - 3 杯冰块\n- 可可粉或巧克力酱（可选）\n- 1 份 棕榈糖浆（第 108 页）\n\n- 1 去掉牛油果的皮并去核，然后将果肉切成块备用。\n-\
    \ 2 按照第 108 页的食谱（步骤 1）制作棕榈糖浆。\n- 3 将可可粉或巧克力酱以外的所有原料放入搅拌机中，搅拌至光滑。冷藏食用，根据需要撒上可可粉或淋上巧克力酱。\n\
    \n 4 人份 | 准备时间：10 分钟 | 烹饪时间：15 分钟\n\n# 混合刨冰甜点\n\n印度尼西亚有很多解渴的甜点，也可以作为甜点享。作为 Es\
    \ Campur（混合冰），这种甜点的内容取决于食材的可用性和个人喜好。这里列出的只是建议。在菲律宾也很流行，被称为 Halo Halo。\n\n- 1 份\
    \ 棕榈糖浆（第 108 页）\n- 8 汤匙 琼胶块或明胶块\n- 8 汤匙 切块的发酵西薯露（tapi，见备注）\n- 8 汤匙 切块的 kolang\
    \ 棕榈果实（见备注）\n- 2 杯 (250 g) 切块的水果（木瓜、菠萝）\n- 1 个青椰子，用勺挖出果肉，取出 1 杯 (250 ml) 椰子水（可选，见备注）\n\
    - 1/2 杯 (125 ml) 甜炼乳、奶油或淡色奶\n- 碎冰\n\n- 1 按照第 108 页的食谱（步骤 1）制作棕榈糖浆。\n- 2 沥干胶块、发酵西薯露（如果使用）和\
    \ kolang。将椰子肉切成一口大小的。\n- 3 将水果与碎冰以外的所有原料放入混合碗中拌均匀。将混合物加入杯中，加入一些碎冰即可食用。\n\n> 备注：琼胶块、调味明胶块、发酵西薯露、kolang\
    \ kaling 和椰子水在某些亚洲特色商店可以买到。菲律宾商店以 buko 之名出售瓶装青椰子。也有罐装带胶的。\n\n 6 至 8 人份 | 准备时间：25\
    \ 分钟 | 烹饪时间：15 分钟\n\n# 水果椰子冰\n\n- 1 份 棕榈糖浆（第 108 页）\n- 1 个 红薯，\n- 1 根大香蕉，去皮切片\n\
    - 5 片 波菠萝，去核切片\n- 4 杯 (1 升) 浓椰奶\n- 一小撮盐\n- 碎冰\n\n- 1 按照第 108 页的食谱（步骤 1）制作棕榈糖浆。\n\
    - 2 洗净红薯，在水中用中火煮至软熟，耗时 15 分钟。取出放凉。去去红薯皮并切片。或者，在蒸锅中蒸 15 分钟，或用微波炉高火加热 4 到 6 分钟。\n\
    - 3 将所有原料放入混合碗中拌均匀。装入个人碗中，加入一些碎冰即可。\n\n 6 至 8 人份 | 准备时间：15 分钟 | 烹饪时间：40 分钟\n\n\
