    ## 腌制虾仁


    碧山果（Belimbing wuluh）是一种小水果，在印度尼西亚及东南亚其他地区的庭院中生长茂。它们为这道北苏门腊沙拉增添了美味的酸味，尽管也可以使用酸梅。


    - 1/2 磅 (700 g) 大鲜虾

    - 4 杯（1 升）水

    - 2 个红指辣椒，去籽

    - 4 根红洋葱，去皮

    - 2 个碧山果（carambola），或 2 汤匙酸梅汁（第 26 页）

    - 新鲜欧芹碎或香菜叶，用作装饰

    - 瓶装甜辣辣椒酱，用作食用


    1. 在大汤锅中将虾和水煮沸。立即减小火并焖煮，直到虾变成粉红色，约需 2 到 3 分钟。快速滤干，并将虾浸入冰水中 30 秒以停止烹饪。沥干、去壳并去除虾筋。转移到盛菜盘中备用。

    2. 在研钵或搅拌机中将辣椒、洋葱和碧山果或酸梅汁磨成光滑的糊，如果想要更酸的味道，可以加入少量青汁或柠檬汁。备用。

    3. 将磨好的酱料加入虾中，轻轻拌匀至均匀裹上。撒上欧芹或香菜叶装饰，并配上一小碗甜辣辣椒酱食用。


    供 4 至 6 人 | 准备时间：20 分钟 | 烹饪时间：5 分钟


    ## 新鲜金枪鱼青芒果沙拉


    这道菜谱来自安汶岛（Ambon），那里新鲜金枪鱼充足。如果没有新鲜金枪鱼，可以使用罐头金枪鱼代替，尽管味道有所不同。


    - 1 到 2 个未熟芒果（共 1 磅/500 g），去皮去核，然后切成丝条状

    - 1 茶匙盐

    - 1 磅 (500 g) 新鲜金枪鱼排，煎烤并去骨，新鲜切成块

    - 3 到 4 根红洋葱，去皮切片

    - 1 茶匙磨白胡椒粉

    - 3 汤匙椰奶


    1. 将芒果丝放在滤篮中。撒上盐并拌匀。备用沥干 10 分钟，然后挤压芒果以尽可能排出水分。

    2. 将芒果放入大沙拉碗中。加入金枪鱼块、洋葱、胡椒和椰奶，拌匀。冷藏食用。


    供 4 至 6 人 | 准备时间：25 分钟


    ## 香蕉叶包调味烤鱼 (Pepes Ikan)


    这道加里曼丹（Kalimantan）菜谱要求将蒸好的调味易碎肉鱼直接放在热炭上上烤，赋予其无与伦比的味道。


    - 1 磅 (600 g) 白鱼鱼片，去皮切成块

    - 4-5 根红洋葱，去皮

    - 3 瓣大蒜，去皮

    - 2 根小葱，切片

    - 1 茶匙白胡椒

    - 1/2 杯 (85 ml) 浓椰奶

    - 1 汤匙挤出的青汁或柠檬汁

    - 1/2 茶匙盐

    - 2 个鸡蛋

    - 香蕉叶或铝箔，切成 8 英寸（20 厘米）的正方形块，用于包裹


    1. 将鱼块放入搅拌机或食物加工机中脉冲几秒，然后加入所有其他原料、香蕉叶并磨成糊。备用。

    2. 在盆中向香蕉叶淋上开水，使其变得柔韧。沥干并将叶子放在干净的表面。

    3. 将 3 汤匙满的鱼肉糊盛在每片香蕉叶（或铝箔）上，按照第 19 页的 pepes 方法包裹。重复此操作直到所有鱼肉糊用完。

    4. 将每个包裹直接放在炭火上或在预热的烤箱上模式下烤 10 到 15 分钟，随时翻面，直到香蕉叶焦化。热食用。


    供 4 至 6 人 | 准备时间：40 分钟 | 烹饪时间：30 分钟


    ## 芳香炸鱼饼 (Otak Pipih)


    这些日式风格鱼饼用椰奶、香料和洋葱调味，可以提前几小时准备并冷藏后再油炸。


    - 1 杯 (100 g) 新鲜碎椰丝

    - 1 杯 (80 g) 干燥椰丝

    - 1 磅 (500 g) 白鱼鱼片，去皮切成块

    - 2 个鸡蛋

    - 1 茶匙糖

    - 1 茶匙盐

    - 1 杯 (250 ml) 浓椰奶

    - 油，用于油炸

    - 1 份腌渍洋葱（第 32 页），食用

    - 1/2 份 Sambal Soto（第 34 页），食用

    - 香料糊

    - 2 根红洋葱，粗碎

    - 1/2 厘米厚的新鲜生姜，去皮切片

    - 1/2 厘米厚的新鲜生姜*，去皮切片

    - 3 根红洋葱，去皮

    - 2 瓣大蒜，去皮


    1. 按照第 32 和 34 页准备腌渍洋葱和 Sambal Soto。

    2. 在锅中用小火干煎椰子，不断翻炒直到金黄色，新鲜椰子需 10 分钟，干燥椰子需 7 分钟。不要烧焦。备用。

    3. 用研钵或搅拌机将所有原料制作香料糊，必要时加入油。加入鱼块磨至细腻。

    4. 将混合物放入大碗。加入鸡蛋、糖和盐拌匀。将混合物揉成小球，用手掌压成饼状。

    5. 锅中热油，炸鱼饼至双面金黄色，约 5 分钟。出油并放在纸巾上沥干。配腌渍洋葱和 Sambal Soto 食用。


    供 4 至 6 人 | 准备时间：20 分钟 + 准备腌菜和 sambal 时间 | 烹饪时间：25 分钟


    ## 咖喱肉饼 (Martabak)


    这种印度特色美食是夜宵喜爱，通常在路边摊作为小吃购买。


    - 2 汤匙油

    - 4 瓣大蒜，切末

    - 12 盎司 (350 g) 羊肉糜或牛肉糜

    - 1 根洋葱，切丁

    - 1 根大葱，对半并切片

    - 1 根红指辣椒，去籽切片

    - 3 碎芹菜叶

    - 1 汤匙咖喱粉

    - 2 个鸡蛋

    - 1 根小葱，切薄片

    - 1/2 茶匙盐

    - 绿辣椒，去籽，食用（可选）

    - 1 份腌渍蔬菜（第 31 页），食用


    **面团**

    - 2 杯 (300 g) 面粉

    - 3 汤匙油

    - 3/4 杯 (185 ml) 水

    - 1/2 茶匙盐


    1. 按照第 31 页准备腌渍蔬菜。

    2. 将所有原料在室温下揉和 2 小时直到面团有弹性。盖好备用，然后将每块分成球。用面杖在涂油的表面将面团擀成大圆。剩余面团重复此操作并备用。

    3. 制作馅料：在鬥或锅中大火热油，炒大蒜几秒至焦香变色。加入肉糜炒至变色，约 2 分钟。加入洋葱、大葱和碎芹菜，再炒 2 分钟。加入咖喱粉炒至均匀，2 到
    3 分钟。离火冷却，分成 4 份：每份加入 1 个鸡蛋、一根小葱、盐和胡椒，拌匀。

    4. 中火加热平底锅或锅至热。在每个面团中心放入 1 份馅料。然后折叠面团两侧完全包裹馅料。将包裹放在平底锅或锅中煎至金黄色，2 到 3 分钟，翻面煎另一侧至上色。剩余面团和馅料重复此操作。

    5. 配新鲜辣椒（如果使用）和一碗腌渍蔬菜热食用。为了呈现更美观，可撒上小葱、辣椒和芹菜叶装饰。


    制作 4 个 Martabak | 准备时间：30 分钟 + 准备腌菜时间 | 烹饪时间：25 分钟


    ## 甜酸梅酱水果蔬菜沙拉 (Rujak)


    这种受欢迎的小吃是甜、酸、辣味道的奇妙结合，在印度尼西亚无数的小吃摊（warungs）制作。可以包含的生水果蔬菜清单是无尽的——完全取决于供应情况和你想吃什么。


    - 1/2 个小菠萝，去皮，去掉果眼和纤维芯，然后切片

    - 1 个未熟芒果，去皮去核，切切片

    - 1 个小黄瓜，去皮，去籽并切片

    - 3 个水苹果（见备注）或 1 个青苹果，清洗并切片

    - 1 个星果，切片

    - 1/2 个小木瓜，去皮，对半，去籽并切片

    - 1 份 Sambal Rujak（第 34 页）


    1. 按照第 34 页食谱准备 Sambal Rujak。

    2. 将所有切好的水果蔬菜放入大沙拉碗中，淋上 Sambal Rujak 并拌匀。立即食用。


    备注。虽然这在印度尼西亚是作为小吃提供的，但你也可以将其作为前菜或正餐/自助餐的一部分。水苹果（jambu air）是非常多汁且脆的水果，有红色、白色和粉三种颜色。它们味道清淡，口感爽脆。它们有薄而可食的皮，看起来有些波浪状。


    供 6 至 8 人 | 准备时间：45 分钟 | 烹饪时间：20 分钟


