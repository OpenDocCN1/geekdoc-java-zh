    ## 辣酱塔里旺鸡 (Ayam Taliwang)


    龙望岛最著名的鸡肉菜是用炭火烤制的，并配上美味的椰奶酱。这个版本建议先部分烤鸡肉，最后通过油炸完成。或者，根据你的喜好，也可以完全油炸。


    - 1 只鸡（约 2 磅/ 1 公斤），清洗并切成块状

    - 1 茶匙盐

    - 1 根手指长度的红辣椒，切薄，用于装饰

    - 几枝罗勒叶，用于装饰


    ### 辣酱

    - 3-4 根手指长度的红辣椒或 2-3 根鸟眼椒，去籽

    - 4 个红洋葱，去皮

    - 1 茶匙干虾酱 (trasi)，干焙过（见第 23 页）

    - 1 茶匙刨棕糖或红糖糖

    - 1/4 茶匙盐

    - 2 汤匙油

    - 1 汤匙新鲜榨的青汁或柠檬汁


    1. 用研钵或搅拌机将辣椒、红洋葱、虾酱、糖和盐磨碎制成辣酱，必要时加入少量油以保持混合物旋转。在炒��锅中中火加热油，将磨好的酱料炒 2 到 3 分钟直到闻香。关小火备用。如果是提前准备的，食用前重新加热辣酱。加入青汁或柠檬汁拌匀。

    2. 用盐腌制鸡块并静置 5 分钟，然后在炭火上或预热的烤箱模式下将鸡块烤 2 到 3 分钟至半熟。在鸡块的双面都刷上辣酱，继续烤 10 到 15 分钟，期间不断刷酱，直到煮熟。或者，在刷上辣酱后，将鸡块放入热油中炸至熟。

    3. 将剩余的辣酱涂在熟鸡肉上。转移到盛盘中，撒上切好的辣椒装饰，配蒸米饭食用。


    供 4 至 6 人 | 准备时间：20 分钟 | 烹饪时间：35 分钟


    ## 巴厘鸭肉或鸡肉咖 (Bebek Menenyat)


    在巴厘岛，鸭子在稻田边漫步或跟随孩子（或主人）手中的旗帜行走是常见的景象。在节日场合，鸭肉是非常受欢迎的。香蕉叶包裹的香料烤鸭（Bebek Betutu）是一种流行食谱，而这道咖喱则是另一种。这种做法鸡也非常美味——这实际上是巴厘岛版的辣味
    Rendang。


    - 1 只鲜鸭或或烤鸡（约 4 磅/1.8 公斤）

    - 2 汤匙油

    - 4 杯（1 升）浓稠椰奶

    - 2 根柠檬草，仅取粗壮的三分之一部分，弃去外层，修剪内层

    - 2 叶圣罗兰叶（可选）

    - 1 汤匙盐

    - 1 茶匙现磨黑胡椒


    ### 香料酱

    - 3 颗马蹄山豆子，粗碎

    - 1 个 (2½ cm) 新鲜黄姜，去皮切片

    - 1 个 (2½ cm) 新鲜山南姜 (kencur)，去皮切片

    - 1 个 (2½ cm) 新鲜姜黄，去皮切片，或 1 茶匙姜黄粉

    - 2-3 根手指长度的红辣椒，去籽

    - 8-10 个红洋葱，去皮

    - 6 瓣大蒜，去皮

    - 2 瓣

    - 2 茶匙香菜籽或 1 茶匙香菜粉

    - 1/4 茶匙现磨黑胡椒

    - 1/4 茶匙现磨或现屑的肉豆蔻，或肉豆蔻粉

    - 1 茶匙干虾酱 (trasi)，干焙过（见第 23 页）


    1. 清洗鸭肉或鸡肉并切成块状，然后用纸巾吸干。

    2. 用研钵或搅拌机将所有配料磨至细，制成香料酱，必要时加入少量油以保持混合物旋转。

    3. 在炒��锅中大火加热油，将香料酱炒至闻香，约 1 分钟。加入鸭肉或鸡肉。加入椰奶、圣罗兰叶和盐，经常翻炒，直到酱料浓稠且鸭肉煮软，约 30 分钟。关火。


    ## 苏拉威锡炖鸡 (Ayam Masak)


    这道源自南部苏拉威锡的喜爱菜肴，是在椰奶中炖制的。


    - 鲜鸡（1 公升）

    - 1 杯（250 ml）浓稠椰奶

    - 4 杯（1 升）水或鸡汤

    - 6 瓣大蒜，去皮切片

    - 5-10 个红洋葱，去皮切片

    - 1 汤匙干虾酱 (trasi)，干焙过（见第 23 页）

    - 2 汤匙罗子汁

    - 1 茶匙白胡椒

    - 2 叶圣罗兰叶

    - 1 根肉桂

    - 1/4 茶匙现屑的肉豆蔻

    - 1 茶匙盐

    - 1 汤匙棕糖


    1. 清洗鸡肉并切成块状。

    2. 在炒��锅中将水煮沸。加入鸡肉，中火加盖焖煮至鸡肉变软，约 5 到 10 分钟。

    3. 加入除椰奶外的所有原料，加盖焖煮 10 分钟直到酱汁浓稠。

    4. 倒入椰奶，小火煮 5 分钟。

    5. 关火，撒上洋葱装饰。


    供 4 人 | 准备时间：25 分钟 | 烹饪时间：40 分钟


    ## 青番茄辣酱鸡 (Ayam Sambal)


    这道食谱来自加里曼丹，通常用青番茄制作。柠檬汁为菜肴的辣味提供了很好的平衡。


    - 鲜鸡（2 磅/1 公斤）

    - 1 茶匙盐

    - 1 汤匙新鲜榨的青汁或柠檬汁

    - 2 杯（500 ml）水

    - 3-4 根手指长度的辣椒，去籽

    - 5-10 个红洋葱，去皮

    - 4 个青番茄

    - 1 枝罗勒

    - 1 片澳洲青柠檬叶

    - 2 根青葱

    - 1/2 个 (1 cm) 新鲜黄姜，去皮切片


    ### 香料辣酱

    - 1/4 茶匙现屑的肉豆蔻，或肉豆蔻粉

    - 3-4 根手指长度的辣椒，去籽

    - 5-6 个红洋葱，去皮

    - 3 瓣大蒜，去皮

    - 1 茶匙盐

    - 2 汤匙棕糖或红糖

    - 1 汤匙干虾酱 (trasi)，干焙过（见第 23 页）

    - 1 汤匙油

    - 1 叶圣罗兰叶

    - 1 根柠檬草，仅取粗壮的三分之一部分，弃去外层，修剪内层


    1. 清洗鸡肉并切成块。用盐、青汁或柠檬汁腌制鸡块，静置腌制至少 20 分钟。

    2. 用研钵或搅拌机将配料磨成光滑的酱料制成辣酱，必要时加入少量油以保持混合物旋转。在炒��锅中中火加热油，将磨好的酱料与圣罗兰叶、柠檬草和黄姜一同炒至闻香，约
    3 到 5 分钟。加入罗望汁使混合物沸腾，然后转小火焖煮约 1 分钟。关火放凉。

    3. 在炒��锅中将水煮沸。加入腌好的鸡肉，中火加盖焖煮至鸡肉恰好软，约 5 到 10 分钟。

    4. 加入所有其他原料，充分搅拌并继续煮 15 分钟后关火。

    5. 立即食用，旁边配一碗香料辣酱，或混合香料辣酱食用。


    供 4 至 6 人 | 准备时间：45 分钟 | 烹饪时间：40 分钟


