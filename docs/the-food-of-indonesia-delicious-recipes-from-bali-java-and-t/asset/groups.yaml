    ## Stewed pineapple with Coconut and Spices


    1 large ripe pineapple

    2 tablespoons oil

    3½ cups (875 ml) thin coconut milk

    ¼ teaspoon freshly ground black pepper

    2 star anise pods

    1 cinnamon stick

    ¼ teaspoon ground nutmeg

    1 stalk lemongrass, bruised

    1 cm fresh galangal, and sliced


    1. Prepare the Crispy Shallots following the recipe on page 34.

    2. Core the pineapple and slice it into bite-sized chunks.

    3. Make the Spice Paste by grinding the turmeric, shallots, garlic, palm sugar
    and shrimp paste to a smooth paste in a mortar or blender, adding a little water
    if necessary to keep the mixture clean. Set aside.

    4. Heat the oil in a wok over medium heat and stir-fry the Spice Paste until fragrant.
    Add the coconut milk, star anise, cinnamon stick, lemongrass, and galangal. Bring
    to a boil.

    5. Add the pineapple and all other ingredients, and bring to a boil. Reduce the
