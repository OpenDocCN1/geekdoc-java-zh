    # 2. Understanding SQL (Structured Query Language):


    SQL is a domain-specific language used for managing relational databases. It provides
    a standardized syntax for performing various operations such as querying, updating,
    inserting, deleting, and managing database structures.


    # Basic SQL Commands:


    +   - **SELECT**: Retrieves data from one or more tables based on specified criteria.

    - **INSERT**: Inserts new rows of data into a table.

    - **UPDATE**: Modifies existing data in a table based on specified conditions.

    - **DELETE**: Deletes rows of data from a table based on specified conditions.

    - **CREATE TABLE**: Creates a new table with specified columns and constraints.

    - **ALTER TABLE**: Modifies the structure of an existing table, such as adding
    or dropping columns.

    - **DROP TABLE**: Deletes an existing table and its data from the database.


