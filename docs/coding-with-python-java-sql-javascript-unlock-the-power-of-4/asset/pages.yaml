  md: '+   - Query: A request for data or information from a database.


    +   - Table: A collection of related data stored in rows and columns.


    +   - Primary Key: A unique identifier for each record in a table.


    +   - Join: A method for combining data from multiple tables.


    # 4. JavaScript:


    +   - Variable: A container for storing data values.


    +   - Function: A block of code designed to perform a particular task.


    +   - Array: A special variable that can hold more than one value.


    +   - DOM (Document Object Model): A programming interface for web documents.


    +   - Event: An action that occurs as a result of user interaction or browser
