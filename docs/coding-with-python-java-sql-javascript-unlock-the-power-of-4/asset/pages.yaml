    # Glossary of coding terms


    A glossary of coding terms can be immensely helpful for beginners and seasoned
    developers alike. Here''s a brief glossary covering key terms in Python, Java,
    SQL, and JavaScript:


    +   1. Python:


    +   - Variable: A named storage location in memory.

    - Function: A block of code that performs a specific task.

    - List: An ordered collection of items.

    - Dictionary: A collection of key-value pairs.

    - Loop: A control flow statement for iterating over a sequence of code.


    +   2. Java:


    +   - Class: A blueprint for creating objects.

    - Method: A block of code associated with a specific task.

    - Inheritance: The ability of a class to inherit properties and behavior from
    another class.

    - Interface: A collection of method signatures without implementation.

    - Exception: An event that disrupts the normal flow of a program.


    +   3. SQL (Structured Query Language):


    +   - Database: A structured set of data stored in a computer.'
  merge: -1
  pgno: 357
