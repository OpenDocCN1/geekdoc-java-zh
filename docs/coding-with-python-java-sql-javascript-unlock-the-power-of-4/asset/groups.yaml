    \ non-positive\");\n}\n```\n\n### 2. 循环：\n\n循环用于在满足指定条件之前重复执行代码块。常见类型包括 `for`\
    \ 和 `while`。\n\nPython:\n\n```python\n# Demo 循环的 Python 代码\nfor i in range(5):\n\
    \    print(i)\n\n# while 循环\nx = 0\nwhile x < 5:\n    print(x)\n    x += 1\n```\n\
    \nJava:\n\n```java\n// Demo 循环的 Java 代码\nfor (int i = 0; i < 5; i++) {\n    System.out.println(i);\n\
    }\n\n// while 循环\nint x = 0;\nwhile (x < 5) {\n    System.out.println(x);\n  \
    \  x++;\n}\n```\n\nSQL:\n\n```sql\n-- Demo 循环的 SQL 代码\nDECLARE @i INT = 0;\nWHILE\
    \ @i < 5\nBEGIN\n    PRINT @i;\n    SET @i = @i + 1;\nEND\n```\n\nJavaScript:\n\
    \n```javascript\n// Demo 循环的 JavaScript 代码\nfor (let i = 0; i < 5; i++) {\n  \
    \  console.log(i);\n}\n\n// while 循环\nlet x = 0;\nwhile (x < 5) {\n    console.log(x);\n\
    \    x++;\n}\n```\n\n### 3. `else if` 语句：\n\n`else if` 语句用于指定多个待测条件。它通常与 `if`\
    \ 和 `else` 结合使用。\n\nPython:\n\n```python\n# Demo else if 语句的 Python 代码\nx = 10\n\
    if x > 0:\n    print(\"x is positive\")\nelif x < 0:\n    print(\"x is negative\"\
    )\nelse:\n    print(\"x is zero\")\n```\n\nJava:\n\n```java\n// Demo else if 语句的\
    \ Java 代码\nint x = 10;\nif (x > 0) {\n    System.out.println(\"x is positive\"\
    );\n} else if (x < 0) {\n    System.out.println(\"x is negative\");\n} else {\n\
    \    System.out.println(\"x is zero\");\n}\n```\n\nSQL:\n\n```sql\n-- Demo else\
    \ if 语句的 SQL 代码\nDECLARE @x INT = 10;\nIF @x > 0\n    PRINT 'x is positive';\n\
    ELSE IF @x < 0\n    PRINT 'x is negative';\nELSE\n    PRINT 'x is zero';\n```\n\
    \nJavaScript:\n\n```javascript\n// Demo else if 语句的 JavaScript 代码\nlet x = 10;\n\
