    \ + name + \"!\";\n    }\n}\n```\n\nSQL:\n\n```sql\n-- Example SQL code for defining\
    \ a function\nCREATE FUNCTION greet (@name VARCHAR(50))\nRETURNS VARCHAR(100)\n\
    AS\nBEGIN\nRETURN 'Hello, ' + @name + '!';\nEND;\n```\n\nJavaScript:\n\n```javascript\n\
    // Example JavaScript code for defining a function\nfunction greet(name) {\n \
    \   return `Hello, ${name}!`;\n}\n```\n\n## 2. 调用函数：\n\n一旦定义了函数，就可以带有参数调用或触发它以执行代码。\n\
    \nPython:\n\n```python\n# Example Python code for calling a function\nprint(greet(\"\
    Alice\"))\n```\n\nJava:\n\n```java\n// Example Java code for calling a function\n\
    System.out.println(Greeting.greet(\"Alice\"));\n```\n\nSQL:\n\n```sql\n-- Example\
