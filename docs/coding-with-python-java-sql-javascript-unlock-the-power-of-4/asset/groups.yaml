    let myArray = [1, 2, 3, 4, 5];

    ```


    - 2. Tuples:


    Tuples are similar to lists but are immutable, meaning their elements cannot be
    modified after creation. They are typically used to store fixed collections of
    items.


    Python:


    ```python

    # Example Python code for tuples

    my_tuple = (1, 2, 3, 4, 5)

