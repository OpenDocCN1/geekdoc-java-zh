    # Example Python code for numbers\nx = 10 # Integer\ny = 3.14 # Float\n```\n\n\
    ### Java:\n\n```java\n// Example Java code for numbers\nint x = 10; // Integer\n\
    double y = 3.14; // Double\n```\n\n### SQL:\n\n```sql\n-- Example SQL code for\
    \ numbers\nDECLARE @x INT = 10; -- Integer\nDECLARE @y FLOAT = 3.14; -- Float\n\
    ```\n\n### JavaScript:\n\n```javascript\n// Example JavaScript code for numbers\n\
    let x = 10; // Integer\nlet y = 3.14; // Float\n```\n\n## 2. Strings:\n\nStrings\
    \ represent sequences of characters enclosed within single or double quotation\
    \ marks. They are commonly used for storing text data and manipulating strings.\n\
    \n### Python:\n\n```python\n# Example Python code for strings\nname = \"John Doe\"\
