    ```\n\n### Java:\n\n```java\n// Example Java code for booleans\nboolean isValid\
    \ = true;\n```\n\n### SQL:\n\n```sql\n-- Example SQL code for booleans\nDECLARE\
    \ @isValid BIT = 1; -- 1 represents true\n```\n\n### JavaScript:\n\n```javascript\n\
    // Example JavaScript code for booleans\nlet isValid = true;\n```\n\n## 4. Lists\
