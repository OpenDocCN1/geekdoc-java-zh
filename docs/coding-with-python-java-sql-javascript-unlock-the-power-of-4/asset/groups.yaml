    \ their usage.\n\n## 1. `if` Statements:\n\n`if` statements are used to execute\
    \ a block of code if a specified condition is true. They can be followed by optional\
    \ `else` statements to execute code when the condition is false.\n\nPython:\n\n\
    ```python\n# Example Python code for if statements\nx = 10\nif x > 5:\n    print(\"\
