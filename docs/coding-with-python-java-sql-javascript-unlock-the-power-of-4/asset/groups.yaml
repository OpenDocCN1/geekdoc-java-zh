    # Inheritance and Polymorphism: Building Reusable Code


    In object-oriented programming (OOP), inheritance and polymorphism are powerful
    concepts that allow developers to create reusable and modular code. These concepts
    facilitate code organization, promote code reuse, and enable the creation of flexible
    and extensible software systems. In this guide, we''ll explore how inheritance
    and polymorphism work in Java, Python, SQL, and JavaScript, along with examples
    demonstrating their usage.


    # 1. Inheritance:


    Inheritance is the process by which a new class (subclass or child class) inherits
    properties and behaviors from an'
- md: "\nexisting class (superclass or parent class). This allows for the creation\
    \ of hierarchical relationships between classes, where subclasses can extend and\
    \ specialize the functionality of their parent classes.\n\n## Java:\n\n```java\n\
    // Example Java code demonstrating inheritance\npublic class Animal {\n    public\
    \ void eat() {\n        System.out.println(\"Animal is eating...\");\n    }\n\
    }\npublic class Dog extends Animal {\n    public void bark() {\n        System.out.println(\"\
    Dog is barking...\");\n    }\n}\npublic class Cat extends Animal {\n    public\
    \ void meow() {\n        System.out.println(\"Cat is meowing...\");\n    }\n}\n\
    ```\n\nIn the above example, the `Dog` and `Cat` classes inherit the `eat()` method\
    \ from the `Animal` class. This allows instances of `Dog` and `Cat` to use the\
    \ `eat()` method without redefining it.\n\n## Python:\n\n```python\n# Example\
    \ Python code demonstrating inheritance\nclass Animal:\n    def eat(self):\n \
    \       print(\"Animal is eating...\")\nclass Dog(Animal):\n    def bark(self):\n\
    \        print(\"Dog is barking...\")\nclass Cat(Animal):\n    def meow(self):\n\
    \        print(\"Cat is meowing...\")\n```\n\nSimilarly, in Python, the `Dog`\
    \ and `Cat` classes inherit the `eat()` method from the `Animal` class.\n\n##\
    \ 2. Polymorphism\n\nPolymorphism is the ability of objects to take on multiple\
    \ forms or behaviors based on their context. In OOP, polymorphism is achieved\
    \ through method overriding and method overloading.\n\n## Java:\n\n```java\n//\
    \ Example Java code demonstrating polymorphism\npublic class Animal {\n    public\
    \ void makeSound() {\n        System.out.println(\"Animal is making a sound...\"\
    );\n    }\n}\n\npublic class Dog extends Animal {\n    @Override\n    public void\
    \ makeSound() {\n        System.out.println(\"Dog is barking...\");\n    }\n}\n\
    \npublic class Cat extends Animal {\n    @Override\n    public void makeSound()\
    \ {\n        System.out.println(\"Cat is meowing...\");\n    }\n}\n```\n\nIn the\
    \ above example, the `makeSound()` method is overridden in the `Dog` and `Cat`\
    \ classes to provide different behaviors based on the type of animal.\n\n## Python:\n\
    \n```python\n# Example Python code demonstrating polymorphism\nclass Animal:\n\
    \    def make_sound(self):\n        print(\"Animal is making a sound...\")\nclass\
    \ Dog(Animal):\n    def make_sound(self):\n        print(\"Dog is barking...\"\
    )\nclass Cat(Animal):\n    def make_sound(self):\n        print(\"Cat is meowing...\"\
    )\n```\n\nSimilarly, in Python, the `make_sound()` method is overridden in the\
    \ `Dog` and `Cat` classes to provide different behaviors based on the type of\
    \ animal.\n\n## 3. Integration with SQL and JavaScript:\n\nWhile SQL and JavaScript\
    \ are not inherently object-oriented languages like Java and Python, they still\
    \ support concepts related to inheritance and polymorphism in certain contexts.\n\
    \n## SQL:\n\n```sql\n-- Example SQL code demonstrating inheritance-like behavior\n\
