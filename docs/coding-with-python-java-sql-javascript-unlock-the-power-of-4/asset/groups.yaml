    \  FOREIGN KEY (id) REFERENCES Vehicle(id)\n);\n```\n\n在 SQL 中，表可以通过外键约束建立联系，创建类似于继承的层次关系。\n\
    \n## JavaScript:\n\n```javascript\n// Example JavaScript code demonstrating polymorphism-like\
