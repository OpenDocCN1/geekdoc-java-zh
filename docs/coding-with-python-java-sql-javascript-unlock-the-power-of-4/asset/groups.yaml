    DECLARE @name NVARCHAR(50) = 'John Doe';\n```\n\n### JavaScript:\n\n```javascript\n\
    // Example JavaScript code for strings\nlet name = \"John Doe\";\n```\n\n## 3.\
    \ Booleans:\n\nBooleans represent logical values of true or false. They are used\
