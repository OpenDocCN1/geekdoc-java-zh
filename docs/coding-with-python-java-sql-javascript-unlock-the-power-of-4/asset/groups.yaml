    \ = 0;\nWHILE @i < 5\nBEGIN\n    PRINT @i;\n    SET @i = @i + 1;\nEND\n```\n\n\
    JavaScript:\n\n```javascript\n// Example JavaScript code demonstrating loops\n\
    for (let i = 0; i < 5; i++) {\n    console.log(i);\n}\n\n// while loop\nlet x\
    \ = 0;\nwhile (x < 5) {\n    console.log(x);\n    x++;\n}\n```\n\n### 3. `else\
