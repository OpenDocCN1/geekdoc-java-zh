    Dictionaries are key-value pairs that allow you to store and retrieve data based
    on keys rather than indexes. They provide fast lookup times and are suitable for
    representing relationships between data.


    Python:


    ```python

    # Example Python code for dictionaries

    my_dict = {''name'': ''Charlie'', ''age'': 30, ''city'': ''New York''}

    ```


