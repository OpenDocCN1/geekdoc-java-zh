    \    System.out.println(\"x is non-positive\");\n}\n```\n\nSQL:\n\n```sql\n--\
    \ Example SQL code demonstrating if statement\nDECLARE @x INT = 10;\nIF @x > 0\n\
    \    PRINT 'x is positive';\nELSE\n    PRINT 'x is non-positive';\n```\n\nJavaScript:\n\
    \n```javascript\n// Example JavaScript code demonstrating if statement\nlet x\
    \ = 10;\nif (x > 0) {\n    console.log(\"x is positive\");\n} else {\n    console.log(\"\
    x is non-positive\");\n}\n```\n\n### 2. Loops:\n\nLoops are used to execute a\
    \ block of code repeatedly until a specified condition is met. Common types include\
    \ `for`, `while`.\n\nPython:\n\n```python\n# Example Python code demonstrating\
    \ loops\nfor i in range(5):\n    print(i)\n\n# while loop\nx = 0\nwhile x < 5:\n\
    \    print(x)\n    x += 1\n```\n\nJava:\n\n```java\n// Example Java code demonstrating\
    \ loops\nfor (int i = 0; i < 5; i++) {\n    System.out.println(i);\n}\n\n// while\
