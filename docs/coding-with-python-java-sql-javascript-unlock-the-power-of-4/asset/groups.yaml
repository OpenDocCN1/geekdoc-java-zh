    \ `if` Statements:\n\nThe `if` statement is used to execute a block of code if\
    \ a specified condition is true. It can be followed by an optional `else` statement\
    \ to execute a different block of code if the condition is false.\n\nPython:\n\
    \n```python\n# Example Python code demonstrating if statement\nx = 10\nif x >\
    \ 0:\n    print(\"x is positive\")\nelse:\n    print(\"x is non-positive\")\n\
    ```\n\nJava:\n\n```java\n// Example Java code demonstrating if statement\nint\
