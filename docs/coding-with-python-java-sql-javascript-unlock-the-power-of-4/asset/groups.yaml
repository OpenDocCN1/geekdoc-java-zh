  mdcn: "\n# 使用 `if`, `else` 和 `for` 循环控制流\n\n控制流结构（如 `if` 语句和 `for` 循环）是编程中的基本工具，允许开发者根据条件控制代码的执行并对数据集合进行迭代。在本指南中，我们将探索如何在\
    \ Python、Java、SQL 和 JavaScript 中使用 `if`、`else` 语句和 `for` 循环，并演示其用法示例。\n\n## 1.\
    \ `if` 语句：\n\n`if` 语句用于在指定条件为真时执行代码块。可以后续可选的 `else` 语句，在条件为假时执行代码。\n\nPython:\n\
    \n```python\n# Example Python code for if statements\nx = 10\nif x > 5:\n    print(\"\
    x is greater than 5\")\nelse:\n    print(\"x is less than or equal to 5\")\n```\n\
    \nJava:\n\n```java\n// Example Java code for if statements\nint x = 10;\nif (x\
    \ > 5) {\n    System.out.println(\"x is greater than 5\");\n} else {\n    System.out.println(\"\
    x is less than or equal to 5\");\n}\n```\n\nSQL:\n\n```sql\n-- Example SQL code\
    \ for if statements (using CASE expressions)\nDECLARE @x INT = 10;\nSELECT CASE\
    \ WHEN @x > 5 THEN 'x is greater than 5' ELSE 'x is less than or equal to 5' END\
    \ AS result;\n```\n\nJavaScript:\n\n```javascript\n// Example JavaScript code\
    \ for if statements\nlet x = 10;\nif (x > 5) {\n    console.log(\"x is greater\
    \ than 5\");\n} else {\n    console.log(\"x is less than or equal to 5\");\n}\n\
    ```\n\n## 2. `for` 循环：\n\n`for` 循环用于遍历元素序列（如列表、元组或数组），为每个元素执行代码块。\n\nPython:\n\
    \n```python\n# Example Python code for loops\nnumbers = [1, 2, 3, 4, 5]\nfor number\
    \ in numbers:\n    print(number)\n```\n\nJava:\n\n```java\n// Example Java code\
    \ for loops (using arrays)\nint[] numbers = {1, 2, 3, 4, 5};\nfor (int number\
    \ : numbers) {\n    System.out.println(number);\n}\n```\n\nSQL:\n\n```sql\n--\
    \ Example SQL code for loops (using a cursor)\nDECLARE @numbers TABLE (number\
    \ INT);\nINSERT INTO @numbers VALUES (1), (2), (3), (4), (5);\nDECLARE @number\
    \ INT;\nDECLARE number_cursor CURSOR FOR SELECT number FROM @numbers;\nOPEN number_cursor;\n\
    FETCH NEXT FROM number_cursor INTO @number;\nWHILE @@FETCH_STATUS = 0\nBEGIN\n\
