    const params = {\n  FunctionName: 'my-serverless-function',\n  InvocationType:\
    \ 'RequestResponse',\n  Payload: JSON.stringify({ key: 'value' })\n};\n\nlambda.invoke(params,\
    \ (err, data) => {\n  if (err) console.error(err);\n  else console.log(data);\n\
    });\n```\n\n在这个 JavaScript 示例中，开发者使用 JavaScript AWS SDK 在 AWS Lambda 上调用了一个名为\
    \ `my-serverless-function` 的无服务器函数。通过利用无服务器架构，开发者可以专注于编写业务逻辑和构建可扩展应用程序，而无需承担服务器管理的开销。\n\
