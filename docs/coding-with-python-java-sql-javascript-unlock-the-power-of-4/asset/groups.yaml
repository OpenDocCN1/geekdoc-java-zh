    \ JavaScript 更改所选 HTML 元素的文本内容、HTML 内容、属性和 CSS 类。\n\n## 3. 处理事件：\n\nJavaScript\
    \ 允许开发者处理用户交互并响应由 HTML 元素触发的事件，例如点击、鼠标移动、按键和表单提交。\n\n示例：\n\n```javascript\n//\
    \ 在 JavaScript 中处理事件\n// 添加事件监听器\nelementById.addEventListener(\"click\", function()\
    \ {\n  console.log(\"Element clicked!\");\n});\n\n// 移除事件监听器\nelementById.removeEventListener(\"\
    click\", clickHandler);\n// 事件委托\ndocument.addEventListener(\"click\", function(event)\
    \ {\n  if (event.target.tagName === \"BUTTON\") {\n    console.log(\"Button clicked!\"\
    );\n  }\n});\n```\n\n在此示例中，我们演示了如何向 HTML 元素添加事件监听器、移除事件监听器以及使用事件委托来高效处理事件。\n\n\
    ## 4. 操作 HTML 内容：\n\nJavaScript 允许开发者动态创建、删除和操作 HTML 元素，从而创建动态且交互的网页。\n\n示例：\n\
    \n```javascript\n// 在 JavaScript 中操作 HTML 内容\n// 创建新元素\nlet newElement = document.createElement(\"\
