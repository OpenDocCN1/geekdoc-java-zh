  md: '# INTRODUCTION


    Before we start, let’s just clarify the purpose of this book. This is not intended
    as an all-knowing reference book on the ins and outs of the Sinclair BASIC language.
    This is a book to facilitate the learning of Sinclair BASIC by typing through
    the code listings for various games, the added benefit of is that you get to enjoy
    your efforts in the form of some ‘old school’ gaming. As you progress through
    the book, we do less explaining so as to bore you. There are many different types
    of games in this book, so I hope there is something of interest for everyone.


    Perhaps some of you want to introduce a younger generation to the glory days of
    early micro computing with a machine that you grew up with. Or you may wish to
    provide a local Code Club with easy to learn activities for building fun games,
    without the need to be a skilled artist, boffin or whiz kid. Or perhaps you are
    a ZX fan and have gotten yourself one of those new Bluetooth ZX Spectrums, either
    way we hope you have fun using this book.


    As a teenager I benefited from learning BASIC programming and the experience opened
    doors to many possibilities, it gave me a passion for computing and coding in
    general. Today, I am involved in desktop, web and mobile coding for both game
    development, business applications and Internet startups. Everyone has to start
    somewhere and it’s never too late or too early to learn to code.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '# So why Sinclair BASIC?


    The Sinclair BASIC language is one of the gateways to professional coding that
    many successful British and European programmers started with before going to
    program amazing games and utilities, during the 1980s. All this was done in less
    than 48k of RAM. Some examples of these are RARE (aka Ultimate Play the Game,
    aka ACG), The Oliver Twins (Dizzy series), Codemasters, and many more.


    BASIC stands for Beginners All Purpose Symbolic Instruction Code, so it''s perfect
    for beginners learning to code. It is friendly and fun to learn and the commands
    are logical and clearly named after the function they perform.


    Sinclair BASIC teaches logic, how to perform decisions and structure your code
    but only for simple concepts. It helps with basic math skills – and you do not
    need to be a math Guru to learn it.


    The BASIC ROM (Read Only Memory) is the operating system of the Sinclair machine
    and is setup in such a way it will not allow illegal code to be entered. Each
    line is validated by the ROM, so after entering a line you will hear an acceptance
    beep sound for a line entered correctly. If the line is incorrect, then a lower
    tone sound is used and the system prompts you to fix any incorrect code.


    A note of thanks must go to the Sinclair guys and especially Steve Vickers and
    the rest of the guys at Nine Tiles Ltd for creating Sinclair BASIC.


    # What do you need before we start?


    Any of the following configurations is fine for starting quickly:


    +   a) A Real ZX Spectrum: e.g. ZX Spectrum 16k, 48k, 48K+, or 128K or any further
    model.'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'b) A computer that can run an emulator: Example of some emulators for various
    platforms...


    Windows: ZX Spin, Spectacular, Speccy plus many more.


    Mac OS: Fuse


    Linux/Unix: Fuse


    iOS/Android: Spectacular, Fuse, Speccy, Marvin


    Chrome/FF: There are a couple of online emulators that will work from a browser.
    Using Google will lead you to these, but here are two examples I know of that
    will work in your browser...


    http://jsspeccy.zxdemo.org

    http://torinak.com/qaop


    c) Another good option is the new Recreated ZX Spectrum (Bluetooth) which works
    with Android and IOS.


    For beginners to the ZX Spectrum I would suggesting coding in 128k mode as this
    allows for typed commands and does not require combination key-presses required
    by 48k mode. But if you are up to the challenge or you want a nostalgia hit then
    by all means go for 48k or 16k mode.'
