    Rules: Limited turns to guess the colour code sequence. Choosing from Red, Blue,
    Green, Cyan, Magenta (purple) and Yellow. The CPU will tell you indicate Y with
    number of colours correct in sequence and C for number of colours correct.


    Controls: Enter a colour sequence per turn using previous turns to work out the
    code.


