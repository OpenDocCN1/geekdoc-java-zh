    # # Making your game fun


    Everyone wants to make a game fun. But the concept can sound a lot more fun than
    the end result. The game Retro Hunter started out with your character Ally collecting
    on the screen against the clock it had no real challenge as just a running maze
    game. The end version became a puzzle game with only small tweaks to the code
    and a redesign of the screen map. So re-thinking your ideas is better than scrapping
    a game completely. And this is a lot more fun now.


    ![](img/a5b1b953bf13d825daab6d82a3f4e6b5_93_0.png)


