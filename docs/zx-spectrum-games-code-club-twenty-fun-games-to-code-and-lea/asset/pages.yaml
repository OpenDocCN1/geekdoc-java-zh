- img_proc: true
  md: "# Game Loop Basics\n\nThe Game Loop is the part of your game where all the\
    \ action happens and runs repeatedly until the game is over. It follows a certain\
    \ structure or sequence of events. This structure is not set in stone, but a simple\
    \ example is shown below of how a Game Loop fits into your code.\n\n+   - Setup\
    \ : Graphic UDGs (a.k.a. Sprites) or loading data\n- Initialise: Key variables,\
    \ strings and arrays\n- Menu / Start Screen for Game\n- Game Loop:\n  - Process\
    \ Input / Keypresses\n  - Updating positions / AI updates etc\n  - Draw / Print\
    \ Screen items\n  - Repeat Loop\n- End / Quit Game\n\nI have used this type structure\
    \ for most of the games in this book. I hope you find that the format helps you\
    \ get your head around what a Game Loop does and how it should be used.\n\n# How\
    \ to use this Book\n\nYou can code or type in these listings in any order you\
    \ wish. Some commands or newer concepts though may not be explained as they may\
    \ have been dealt with in a previous listing but is fine. You will get there eventually.\
    \ Remember this is for fun so if a certain game is not of interest to you feel\
    \ free to skip it.\n\nAlso here is a very handy space character rule (only relevant\
    \ to printed versions of book) for the printed book, each 12 characters is approx.\
    \ 3cm."
