    # # Progress


    Well how are you getting along with BASIC? You should be understanding certain
    commands are specifically used for by now. You will have noticed a lot of Character
    codes in the last listing. These can be looked up at the end of the book in Appendix
    A.


    # # Input


    We used a fair amount of INPUT commands. This is quite a useful command for asking
    the user to perform actions or make decisions. It is very useful for text adventure
    games or interactive stories where the users decisions can change the route of
    the story.


    # # PEEKs and POKES


    For our UDG graphics we used a command called POKE. This commands places a decimal
    value into a memory location. We can then collect this value using a PEEK command.


    e.g. Try POKE 33000,45 then enter, now try PEEK 33000 to get the value back.


    # # Maths Functions


    Sinclair BASIC has a lot of maths functions. It is not perfect, nor does it have
    every function but it has the majority of what a beginner would need for simple
    Trigonometry or Alegebra. Examples: PI (that 3.141592....), EXP (Exponential),
    LN (Logarithms), SIN (Sine), COS (Cosine), TAN (Tangent).'
