  md: '# Basic Animation


    Animating with UDGs (a.k.a. Sprites) is executed very simply here.


    ```

    1033 IF INKEY$<>" THEN anim=1

    ```


    The line above sets the anim value to 1 so that we can know to draw the flapping
    UDG sprite, making our bird flap his wings.


    ```

    1012 IF anim=1 THEN INK 1: PRINT AT fly-1,10;"CHR$(145)

    ```


    This is a very simple method but easily, to do more than one frame of animation
    usually involves tracking movement with a timer value. But that level of detail
    is for another time. The first part of the PRINT command clears the old position
    of our bird before printing at the new position.


    ```

    302 FOR o=1 TO 10

    303 LET h(o)=INT(RND*8)+1

    305 NEXT o

    306 FOR l=1 TO 10

    308 LET x(l)=25+(l*5)

    309 NEXT 1

    ```


    Above creates our pipe positions and heights but will not display them until they
    have scrolled left enough to show on our screen.


    ![](img/a5b1b953bf13d825daab6d82a3f4e6b5_49_0.png)


    > Suggestions for Extending (optional)


    +   1] Add enemies

    2] Remove the top pipes and work on a Scramble clone!'
