  md: '# What’s New?


    ATTR() function is similar to SCREEN($) but it returns the colour attributes for
    the screen location queried in the form of a numeric value. It’s slightly more
    complex but much more useful where the collision detection cannot rely on SCREEN($).
    SCREEN($) will not work with UD for instance. The workings of the ATTR() function
    is harder to work out but here is the gist


    ATTR() is the sum of the following values of attributes for a single character
    position on the screen.


    If the character position is flashing = 128 otherwise O

    If the character position is bright = 64 otherwise 0

    Paper colour = colour value * 8 (e.g. Paper Cyan = 5*8 = 40)

    Ink colour = colour value (e.g. Ink Red = 2)


    So adding all of those attributes will tell you what value should be returned'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'ATTR() function ATTR is lot more reliable than SCREEN($).


    ```

    3010 LET att1=INT (ATTR (y,x+1)/8)

    3020 LET att2=INT (ATTR (y,x-1)/8)

    3030 LET att3=INT (y-1,x)/8)

    3040 LET att4=INT (ATTR (y+1,x)/8)

    ```


    3010 to 3040 are checking all sides for collision with a colour other than black

    if you do not not match the colour it will be Game Over.


    ```

    1180 LET timer=timer-1

    ```


    Using a Timer in your game is a nice easy dynamic and puts the player on alert

    from the start. In this game we deduct the timer only when the player moves,

    so it is not a real time timer. Because our game is a puzzle game we allow the

    player to think about there next move. This could also be employed for a game

    where you needed to reduce a players energy when they move, requiring them

    to eat to get energy back.'
