  md: '![](img/a5b1b953bf13d825daab6d82a3f4e6b5_9_0.png)


    # # Quick Start


    If you want to dive into writing your code now, and you have one of the options
    above ready-to-go, then by all means you can skip this next section and begin
    coding one of the games right now.


    # # Basic Commands


    Some of the most common commands that we will be using PRINT, IF, GOTO, GO SUB,
    DIM and LET. I will only give you an overview of each of these as is a book for
    learning-by-doing and not meant to be used like a manual. Having too much technical
    jargon to get boring after a while. We need to be hitting the fleshy keys of the
    Spectrum 48k or the plastic tricky tones of the Spectrum 128k models or your preferred
    emulator.


    Here is the obligatory “hello world” example that is present in nearly all coding
    books.


    ```

    10 PRINT AT 10,5;“Hello World”

    ```


    Hit Enter at the end of the line to save it in memory, then type RUN and hit enter
    again to see it working.'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'The breakdown of the above example code is...


    ```

    10      = Line numbering (sequence order of the program)

    PRINT   = PRINTing on the screen (easy!)

    ```


    ```

    AT y,x   = Telling the program coordinates to PRINT at

    where y is vertical axis and x is horizontal

    ```


    ```

    ;      = Allows for a new sub function or for the text to print

    ```


    ```

    “Hello World” = Your text contents

    ```


    PRINT will populate text or special characters (i.e. UGs) on the screen at the
    position you specify. The ZX Spectrum workable screen is 32 character columns
    (0 to 31) wide and 22 lines long (0 to 21). The AT (operand) part of command is
    telling the command to place items at Y (line) , X (Column). There are 2 additional
    lines but these are not used with the standard PRINT command.


    The following sub functions will work inline with the PRINT command:


    +   - INK <0-7> Sets the foreground colour for the pen which prints all text and
    graphics

    - PAPER <0-7> Sets the colour for the paper background of the main screen

    - INVERSE <1 or 0> Prints and Inverse of the current INK and PAPER setup

    - OVER <1 or 0> Turns on / off Overprinting on the screen

    - FLASH <1 or 0> Flash with repeatedly alternate between the current and inverse
    colours

    - BRIGHT <1 or 0 or 8> Brighter versions of the colors 1 – 6 (for INK and'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'PAPER) 8 is transparent


    TAB # Moves across horizontally from left to right # spaces


    E.g. PRINT INK 2; AT 10,10;"Test"; TAB 16;PAPER 1;INK 7;1;"Print"


    As you can see you can have almost any combination of those commands on a PRINT
    statement.


    # Line Numbering


    It is good practice to leave adequate gaps in numbering your code lines so you
    can enter additional commands at a later stage. I would suggest for your own programs
    to step in increments of 10 at least. So line 10, then line 20 and so on. Sinclair
    BASIC can have a maximum of 9999 lines but lines can contain multiple statements
    when separated by a colon ":", so commands can run into tens of thousands.


    # 128k Mode and Line Numbers


    The 128k spectrum mode has another feature that is handy for new coders. If your
    program is missing a section and you did not make enough space for the commands,
    you can run RENUMBER and it will re-organise the program line numbers. There are
    limitations to this but we need not be concerned about those at this early stage.


    # UDGs (User Definable Graphics)


    You will learn how to make your own graphics with ease! So you can return to some
    of the programs in this book and add your own graphics to enhance extend them.


    # Machine Code'
