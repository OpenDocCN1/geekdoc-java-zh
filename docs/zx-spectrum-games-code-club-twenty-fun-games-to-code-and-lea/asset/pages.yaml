- img_proc: true
  md: 'For the purposes of this book, machine code would be a little difficult to
    grasp. So we will not be covering it. However, signup for our alerts at Gazzapper.com
    as we may release updated versions of some of the games with small routines of
    machine code included.


    # ## What is a ‘Type-in Listing’?


    In the earlier days of micro computing, magazines would publish ‘listings’ or
    ‘type-in listings’ for young enthusiasts (aka coders / programmers) to sit down
    and type in their keyboards from the comfort of their bedrooms. Some listings
    would be misprinted or would contain bugs causing the user to be frustrated and
    furious with the author. If you couldn’t fix the bugs, you were stuck with code
    that didn’t run spent hours typing them.


    Well I am happy to say I have written and tested all the listings so that they
    work and any issues can worked through the new Facebook group I have setup called
    ZX Spectrum Code Club. Or if you are already a member of a ZX Spectrum group post
    your questions there (if the rules allow).


    The listings were coded in a way to make the most of the speed limitations of
    Sinclair BASIC (within reason) so that the games are playable and hopefully fun
    too. The structure is to be easy to follow and although not perfect, it will allow
    the user to follow what is going inside each game. The structure of the games
    are kept similar so that you become familiar with them and also provides a simple
    template to use for your creations.


    A great feature of Sinclair BASIC is that the ROM validates the majority of the
    code before accepting the statements. In case you missed it earlier, ROM stands
    for Read Only Memory and it contains the operating system and various routines
    required by BASIC.


    Although REM statements are not required for the running of the programs it is
    good practice to provide these, as the more code you add into a program the more
    comments are needed. Especially for the user to refer to whenever editing or extending
    the code at a future date. They can also be useful as visual dividers between
    sections of your program, making it easier to read.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Sinclair BASIC is not the fastest of programming languages but it is one of
    the easiest to learn and it’s great fun. Without going into too much technical
    details a user can speed up any of the Spectrum emulators by increasing the emulator
    speed from the standard 3.54MHz to x2 speed or higher in the options.


    # Emulator keyboard mapping


    When using an emulator over a real Spectrum machine there are a few intricacies
    that should be pointed out in relation to keyboard mappings. Below is a real 48k
    Spectrum keyboard layout.


    ![](img/a5b1b953bf13d825daab6d82a3f4e6b5_13_0.png)


    Selecting symbols such as quotes and * etc might be different on your PC / MAC
    keyboard than that of the emulator. This may be the case for some keyboards and
    emulators. You can see above that certain symbols will be different on your keyboard.


    # Standard Keyboard Equivalents for Sinclair Emulators


    Below is a list of how some of the mappings might differ. Keep in mind that some
    emulators might use Alt instead of Ctrl for some of these mappings.


    +   * (asterisk) = Ctrl and B

    ( = Ctrl and 8

    ) = Ctrl and 9

    “ (quotes) = Ctrl and P'
