    Lines 300 to 400 will run the main Game Loop, which is quite short for the game.


    ```

    300 REM ****** Test Press

    310 PRINT AT 18,1; INK 7; PAPER 6-ply;“PLAYER ;;ply"; Choose Square 1 - 9"

    320 LET i=$INKEY($)

