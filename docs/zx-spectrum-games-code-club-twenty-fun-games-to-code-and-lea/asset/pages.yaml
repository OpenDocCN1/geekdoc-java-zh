  md: '# What’s New?


    So now that you have typed in a Spectrum version of Flappy Bird you can see how
    such a game can be done with simple code. Okay, parts of the code here are a little
    confusing to you but that is probably down to the use of maths. It is quite easy
    once explained, the screen collision detection for pipes were multiplied by 8
    to allow for the pipes to be drawn on the pixel screen grid of 256 (x-axis) by
    192 (y-axis) pixels. But the actual collision detection was based on the character
    printing grid of 32 (x-axis) by 22 (y-axis) character positions. Just so it is
    easier to understand, when comparing character printing locations to pixel locations
    we need to multiply or divide by a factor of 8. For every 8 pixels there is 1
    character position. See the diagram below on how the screen work for pixels and
    characters.


    ![](img/a5b1b953bf13d825daab6d82a3f4e6b5_48_0.png)


    # Hello Colour Clash


    A known limitation of the Sinclair Spectrum is that only two colours can exist
    within each character position on the screen ( 8 x 8 pixels). This adds a bit
    of retro-charm to the games when they clash together. You will notice this feature
    in this game as your Flappy Bird collides with the pipes. There you go, that’s
    colour clash!'
  merge: -1
  pgno: 48
