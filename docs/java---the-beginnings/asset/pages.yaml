  md: '# Section 3 - The printf Method


    The PrintStream class provides the printf method for non object oriented output.
    The syntax is modeled after printf statements in the C programming language. The
    first argument to the printf method is a string containing format specifiers.
    This argument is followed by a list of values. Here are examples of format specifiers:


    +   - %d A whole number

    - %f A floating point number

    - %s A string

    - %c A single character


    Several of the format specifiers can contain width and zero padding instructions.
    Note that printf requires a newline character.


    ```

    // Prints 001

    System.out.printf("%03d\n", 1);


    // Prints 2.755

    System.out.printf("%.3f\n", 2.7548F);


    // Prints Hello

    System.out.printf("%s\n", "Hello");

    ```


    Object oriented output is preferred over non object oriented output.'
