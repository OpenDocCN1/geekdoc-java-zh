  md: "# Section 7 - The this Reference\n\nThe keyword this returns a reference to\
    \ the current object. It can be used to resolve naming conflicts between fields\
    \ and parameters or local variables.\\ When a parameter or local variable is given\
    \ the same name as a field, the parameter or local variable supersedes the field\
    \ within the current scope.\n\n```\npublic Box(int length, int width, int h) {\n\
    \    length = length;\n    width = width;\n    int height;\n    height = height;\n\
    }\n```\n\nIn the above example, parameters length and width supersede fields length\
    \ and width, respectively, within the scope of Box(int, int, int). Therefore,\
    \ the assign statements set parameters length and width to themselves, and fields\
    \ length and width are still zero. Local variable height supersedes field height.\
    \ The assign statement sets local variable height to itself, and field height\
    \ is still zero.\n\nThe ambiguity can be resolved using this reference. In the\
    \ following example, all fields are initialized correctly.\n\n```\npublic Box(int\
    \ length, int width, int h) {\n    this.length = length;\n    this.width = width;\n\
    \    int height;\n    this.height = height;\n}\n```"
