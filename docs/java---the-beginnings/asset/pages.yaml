  md: "# Section 5 - Passing by Value\n\nJava passes all parameters by value. This\
    \ means that since variables are evaluated during method calls and the resulting\
    \ values copied into separate parameter variables, if the method makes a change\
    \ to a parameter it has no effect on the original variable. In the following example,\
    \ variable y is passed into method modifyParam , which increments the parameter,\
    \ then prints it. You may think that when we print variable y, 6 is displayed.\
    \ It prints 5 instead.\n\nHere's what happens: During the call, variable y is\
    \ evaluated and the value 5 is copied into parameter variable x. Variable x is\
    \ then incremented and printed, displaying 6. Since x is a separated memory buffer,\
    \ changing its contents has no effect on variable y. After the return from method\
    \ modifyParam , variable y is printed. Since it still has the value 5, 5 is printed.\n\
    \n```\npublic class ParameterModify {\n    public static void modifyParam(int\
    \ x) {\n        x++;\n        System.out.println(x);\n    }\n    public static\
    \ void main(String[] args) {\n        int y = 5;\n        modifyParam(y);\n  \
    \      System.out.println(y);\n    }\n}\n```\n\n![](img/89593d20c4b70d2c638b3a275d3ccbce_148_0.png)"
