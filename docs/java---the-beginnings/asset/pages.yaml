  md: "# Section 3 - Indentation\n\nIn the HelloWorld program, observe how the beginning\
    \ of the main method definition is indented four spaces from class definition.\
    \ Observe also that printlinn statement is indented an additional four spaces\
    \ from the method definition.\n\n```\npublic class HelloWorld {\n    public static\
    \ void main(String[] args) {\n        System.out.println(\"Hello World\");\n \
    \   }\n    method\n    scope\nglobal scope\nclass HelloWorld scope\n```\n\n# Figure\
    \ 1 - HelloWorld Program where Indentation Matches Scope\n\nWhenever the scope\
    \ of your program changes, the indentation of your source should change. When\
    \ scope becomes more specific, indentation should increase. When scope becomes\
    \ less specific, indentation should decrease.\n\nScope changes are usually indicated\
    \ by curly braces. On line 2 the program enters the scope of class HelloWorld\
    \ , so line 3 is at a higher level of indentation. On line 4 the program enters\
    \ the scope of method main , so line 5 is at a higher level of indentation. After\
    \ line 5, the scope of the main method exits, so line 6 is at the HelloWorld class\
    \ scope level of indentation. After line 6, the scope of class HelloWorld exits,\
    \ so line 7 is at the global scope level of indentation."
  merge: -1
  pgno: 27
- img_proc: true
  md: 'Use a consistent whitespace for each level of indentation. The examples in
