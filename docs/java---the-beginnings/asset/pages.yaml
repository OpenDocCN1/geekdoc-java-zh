  md: 'smallest short value


    | -32,768_{10} | 8000_{16} |


    largest short value


    | 32,767_{10} | 7FFF_{16} |


    # int


    The *int* type can be used to express a number as small as $-2^{31}$ and as large
    as $2^{31}-1$. These correspond to the values -2147483648 and 2147483647. An int
    occupies 32 bits of memory.


    smallest int value


    | -2147483648_{10} | 80000000_{16} |


    largest int value


    | 2147483647_{10} | 7FFFFFFF_{16} |


    # long


    The *long* type can be used to express a number as small as $-2^{63}$ and as large
    as $2^{63}-1$. A long occupies 64 bits of memory.


    # Section 3b - The Floating Point Types


    Decimal numbers (numbers with fractional components) are stored in IEEE floating
    point format (a signed fractional number multiplied by an exponent of the power
    of 2).


    # float


    The *float* type uses 32 bits to express a decimal number in single precision.'
