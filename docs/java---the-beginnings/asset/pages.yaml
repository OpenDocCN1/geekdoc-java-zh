  md: '# Section 1 - Widening Conversions


    For compatible primitive data types, Java will implicitly convert a literal, variable,
    expression, or method return from the smaller type to the larger type. This is
    called a widening conversion , because the new data type is wider than the original
    type, so no information is lost.


    In the example below, the variable b is of primitive type byte which occupies
    one byte of memory. It contains the decimal value 20, which is the value 14 in
    hexadecimal. The byte variable b is assigned to int variable i, Java implicitly
    performs a widening conversion and copies the value of the byte into the lowest
    byte of the memory occupied by int variable i. The upper three bytes of i contain
    zero. When printed, both variables display the value 20.


    ![](img/89593d20c4b70d2c638b3a275d3ccbce_94_0.png)


    ```

    System.out.println(b);   // Prints 20

    System.out.println(i);   // Prints 20

    ```


    All integer and floating point primitive types are compatible. An integer will
    be implicitly converted to a floating point type. When this occurs, the fractional
    component of the floating point number is zero.


    ```

    int i = 20;

    // Implicitly performs widening conversion

    float f = i;

    // Prints 20

    System.out.println(i);

    // Prints 20.0

    System.out.println(f);

    ```'
  merge: -1
