    # Section 3f - Prefix and Postfix Form


    The position of the ++ and -- operators with respect to their operand matters.
    Listing the operator before its operand is called prefix form . Listing the operator
    after its operand is called postfix form .

    The prefix and postfix form of the ++ and -- operators behave differently when
    assigning the results to another variable. In prefix form, the increment or decrement
    is performed before the assignment. In postfix form, the increment or decrement
    is performed after the assignment.


    The operations in both prefix and postfix form of the example below increment
    the first variable. However, in prefix form, the second variable is assigned the
    value after incrementing. In postfix form, the second variable is assigned the
    value before incrementing. Therefore, variables b and d have different values.


    ```

    int a = 3;

    int b = ++a;

    ```


    ```

    // Prints PREFIX FORM: a = 4 , b = 4

    System.out.println("PREFIX FORM: a = " + a + " , b = " + b);

    ```


    ```

    int c = 3;

    int d = c++;

    ```


    ```

    // Prints POSTFIX FORM: c = 4 , d = 3

    System.out.println("POSTFIX FORM: c = " + c + " , d = " + d);

    ```'
