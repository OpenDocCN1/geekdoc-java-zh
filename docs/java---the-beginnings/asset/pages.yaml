  md: "# Section 1 - Defining an Enum Type\n\nAn **enum type** consists of a set of\
    \ given constants. Enum types are defined using the following form:\n\n```\nenum\
    \ EnumName {EnumConstant1, EnumConstant2,\n  ... EnumConstantN}\n```\n\nThe definition\
    \ begins with the keyword enum followed by a comma separated list of values enclosed\
    \ in curly braces. Note that the definition does not end in a semicolon.\n\nSince\
    \ the values defined for an enum type are constants, the are normally written\
    \ in uppercase.\n\nWe can define a type Months as an enum type with twelve constants.\n\
    \n```\nenum Months {JANUARY, FEBRUARY, MARCH, APRIL,\n  MAY, JUNE, JULY, AUGUST,\
    \ SEPTEMBER,\n  OCTOBER, NOVEMBER, DECEMBER }\n```\n\nWe can then replace the\
    \ byte constants from Listing 1 with an enum type. Variable month is not of type\
    \ Months . Note that an attempt to assign an integer value to variable month will\
    \ not compile.\n\n# Listing 2 - MonthsDriver.java (version 2)\n\n```\nenum Months\
    \ {JANUARY, FEBRUARY, MARCH, APRIL, MAY, JUNE,\n  JULY, AUGUST, SEPTEMBER, OCTOBER,\n\
    \  NOVEMBER, DECEMBER }\n```\n\n```\npublic class MonthsDriver {\n  public static\
    \ void main(String[] args) {\n    Months month = Months.MAY;\n\n    // ERROR:\
    \ int and Months are incompatible\n    month = 20;\n  }\n}\n```"
  merge: -1
