  md: "# Section 11 - Enhanced For Loops\n\nThe enhanced for loop is a form of the\
    \ loop that can be used to traverse Java arrays and collections. It is also called\
    \ a for each loop. The enhanced loop has the following form:\n\n```\nfor (type\
    \ identifier : collection)\n```\n\nThe enhanced for loop traverses an array or\
    \ collection by copying each of its elements into a variable of the same type\
    \ as the elements. Following is an example of an enhanced for loop that prints\
    \ out each element of an array of:\n\n```\nint[] myints = {1, 2, 3};\n\n// Prints\
    \ 123\nfor (int x : myints)\n    System.out.print(x);\n    System.out.println();\n\
    ```\n\nAn important difference between conventional loops and enhanced loops is\
    \ that the elements of an array cannot be modified inside an enhanced loop, while\
    \ they can be modified inside a conventional loop. This is because the enhanced\
    \ for loop makes a copy of the element, so you are only modifying the copy.\n\n\
    ```\nint[] myints = {1, 2, 3};\n\n// x is a copy of each element\nfor (int x :\
    \ myints)\n    x++;\n```\n\n```\n// Still 1 2 3\nSystem.out.println(myints[0]\
    \ + \" \" + myints[1] + \"\"+myints[2]);\n```\n\nUsing the same logic in a conventional\
    \ for loop would increment each element in the array.\n\n```\nint[] myints = {1,\
    \ 2, 3};\nfor (int i=0; i<myints.length;\n    ++i)\n    myints[i]++;\n```"
