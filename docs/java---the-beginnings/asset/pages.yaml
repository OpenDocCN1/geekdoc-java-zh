  md: '# Section 7 - Typecasting


    It is possible to force the compiler to convert from one type to another even
    if implicit conversion would result in an error. Information may be lost in the
    conversion. Also, the result may be displayed incorrectly. The compiler needs
    to be explicitly told what the target type should be. This is referred to as typecasting
    . To perform typecasting, place the target type inside parentheses before a literal,
    variable, expression, or method return. Here is the general form:


    ```

    (TargetType) originalType

    ```


    The following typecast forces an int value inside a byte type. The value 50 can
    fit inside a byte, so it is displayed properly.


    ```

    int i = 50;

    byte b = (byte) i;


    // Prints 50

    System.out.println(b);

    ```


    Type casting often has interesting results.


    ![](img/89593d20c4b70d2c638b3a275d3ccbce_101_0.png)


    ```

    System.out.println(b); // Prints -104

    ```


    The example above uses a typecast to explicitly perform a narrowing conversion.
    In the process, the upper three bytes of the integer are thrown away, so 8 * 2^8
    = 2048 is discarded. In addition, the sign bit of the byte type is set, so the
    one''s complement of the value is displayed. Instead of 152, the value -104 is
    printed.'
