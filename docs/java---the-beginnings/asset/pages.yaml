  md: '# Section 6 - Concatenation


    When the + operator is used with a string, concatenation is performed instead
    of addition. Concatenation makes a string longer by adding another string to the
    end of it.


    The following example creates a string containing "Hello" followed by "World"
    and initializes it to String s.


    ```

    String s = "Hello" + " World"

    // Prints Hello World

    System.out.println(s);

    ```


    The following example initializes t to the string "Good". It then creates a new
    string containing "Good" followed by "bye" and assign it to String t.


    ```

    String t = "Good"

    t = t + "bye"

    // Prints Goodbye

    System.out.println(t);

    ```


    If either of the operands of the + operator is a string, the other operand is
    converted to a string, and concatenation is performed.


    ```

    System.out.println("Hello" + 2); // Prints Hello2

    System.out.println("Hello" + 2 + 2); // Prints Hello22

    ```


    ![](img/89593d20c4b70d2c638b3a275d3ccbce_86_0.png)


    Observe how concatenation is performed in both println statements. In the second
    statement, the leftmost + operation (in red) is performed first, and the int literal
    2 is converted to a string which is concatenated with the string "Hello". The
    result becomes the left operand of the rightmost + operation (in blue), where
    string concatenation is performed again, and the result is "Hello22".'
