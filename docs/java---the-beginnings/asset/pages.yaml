  md: "# Section 12 - Comparing two String Objects Lexicographically\n\nThe compareTo\
    \ method compares a String object with its String argument lexicographically ,\
    \ which means character by character in the order defined by the Unicode value\
    \ assigned to characters. For Latin letters, this is alphabetic order.\n\nThe\
    \ compareTo method returns the following:\n\n+   - positive value: The calling\
    \ String follows its argument.\n- negative value: The calling String precedes\
    \ its argument.\n- zero: The calling String and its argument are equal.\n\nIn\
    \ the following example, the strings \"apple\" and \"apparition\" have the same\
    \ three characters, but differ in the fourth characters, where the 'l' in the\
    \ calling String follows 'a' in the argument. Therefore, the compareTo method\
    \ returns a positive value. The calling String \"app\" does not contain a fourth\
    \ character, so the argument's fourth character must follow. Therefore, the compareTo\
    \ method returns a negative value. Case matters in the comparison so the string\
    \ \"ABE\" precedes the string \"abe\", since uppercase Latin letters precede lowercase\
    \ in Unicode.\n\n# Listing 1 - CompareStrings.java\n\n```\npublic class CompareStrings\
    \ {\n    public static void compare(String s1,\n                             \
    \   String s2) {\n        int comparison = s1.compareTo(s2);\n        if (comparison\
    \ > 0)\n            System.out.println(s1\n                + \" follows \" + s2);\n\
    \        else if (comparison < 0)\n            System.out.println(s1\n       \
    \         + \" precedes \" + s2);\n        else\n            System.out.println(s1);\n\
    \    }\n}\n```"
