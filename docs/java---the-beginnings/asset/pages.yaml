  md: "# Section 2 - Enum Types are Classes\n\nAn enum type is a class which defines\
    \ several fields and methods. Each enum constant is an object of the class. A\
    \ variable declared to be of an enumerated type is a reference to any of the enum\
    \ constants defined for the enum type. \n\n![](img/89593d20c4b70d2c638b3a275d3ccbce_442_0.png)\n\
    \nCan reference any of the defined enum constants\n\nSince enum constants are\
    \ defined within the scope of an enum type, it is necessary to prefix an enum\
    \ constant with the name of the enum type followed by a period when assigning\
    \ to a reference variable:\n\n```\nMonth month = Months.MAY;\n```"
