  md: "# Section 5 - The equals Method\n\nEnum types have an equals method which returns\
    \ true if the value of the calling enum constant or variable is equal to its argument's\
    \ value.\n\n```\nMonths month = Months.MAY;\nMonths month2 = Months.JUNE;\n//\
    \ Prints month is MAY\nif (month.equals(Months.MAY))\n    System.out.println(\"\
    month is MAY\");\n```\n\n```\n// Prints month2 is not MAY\nif (!month2.equals(Months.MAY))\n\
    \    System.out.println(\n\"month2 is not MAY\");\n```"
