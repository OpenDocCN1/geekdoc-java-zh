  md: '# Foreword


    JAVA TM - The Beginnings is a text on basic Java programming, organized as a series
    of lessons. It contains many examples and diagrams which reinforce the subject
    matter. It also contains 180 programming exercises. No previous programming experience
    is required, however, basic knowledge of arithmetic is assumed.


    Each lesson is followed by several programming exercises. The short assignments
    review programming syntax, while the longer assignments apply the lesson material
    in solving problems. Many of the lessons begin by presenting a technical challenge,
    then showing how to accomplish it through application of the lesson material.


    Teachers, I have found that short programming exercises are necessary to verify
    syntax, before students attempt to solve the long programming exercises. The short
    problems are also ideal for in-class lab assignments.


    Students, one learns to program by writing programs 😊 Please complete all homework
    assignments. I recommend solving the short problems as you read the lessons.


    I hope you enjoy reading JAVA TM - The Beginnings as much as I have enjoyed writing
    it.


    Ralph Lecessii'
