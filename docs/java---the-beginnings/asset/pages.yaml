  md: "# Section 1 - Encapsulation Defined\n\n**Encapsulation** means hiding the implementation\
    \ details of a class from its users. These details include fields and any methods\
    \ which are not needed externally. Encapsulation is one of the four principles\
    \ of object oriented programming.\n\nJava supports encapsulation by allowing us\
    \ to add the private modifier to fields and methods, making them inaccessible\
    \ to the outside world. A well-encapsulated class has all fields declared private.\n\
    \nWe will encapsulate the Box class by adding the private modifier to each of\
    \ its fields. It then becomes necessary to provide public mutators for the length,\
    \ width, and height fields, so that user classes can initialize them. A mutator\
    \ for the volume field should not be provided. Volume should only be equal to\
    \ the product of the length, width, and height, as is done in the computeVolume\
    \ method.\n\n# Listing 2 - Box.java (version 5)\n\n```\npublic class Box {\n \
    \   private int length;\n    private int width;\n    private int height;\n   \
    \ private int volume;\n\n    public void computeVolume() {\n        volume = length\
    \ * width * height;\n    }\n\n    // Mutators\n    public void setLength(int l)\
    \ {\n        length = l;\n    }\n    public void setWidth(int w) {\n        width\
    \ = w;\n    }\n\n```"
