    \ and goes out of scope when the scope of the clause terminates. In the following\
    \ example, variable y is local to the if clause, and goes out of scope at the\
    \ clause's close brace. The main method then attempts to print variable y when\
    \ it is out of scope, which causes a compilation error.\n\n```\npublic static\
    \ void main(String[] args)\n{\n    int x = 5;\n    if (x > 1)\n    {\n       \
    \ // y is local to if clause\n        int y = x + 2;\n\n        // Prints 7\n\
