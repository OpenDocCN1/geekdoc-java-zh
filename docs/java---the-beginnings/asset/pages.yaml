- img_proc: true
  md: "# Section 4 - Fallthrough in switch Statements\n\nIt is sometimes useful to\
    \ execute consecutive statement blocks for a case. After performing the statement\
    \ block associated with a case, execution \"falls through\" and performs the statement\
    \ block associated with the next case. Fallthrough is accomplished by aligning\
    \ the desired cases in consecutive order, then omitting the break statement between\
    \ them.\n\n```\nint x = 2, y = 7;\n{\n    case 2:\n        // This statement block\
    \ executes\n        y = y + 1;\n    case 9:\n        // This statement block also\
    \ executes\n        y = y + 1;\n        break;\n    default:\n        y = 5;\n\
    }\n// Prints 9\nSystem.out.println(y);\n```\n\nSince the value of variable x is\
    \ 2, the first statement block executes, incrementing y to the value 8. Since\
    \ no break statement is present, execution falls through to case 9, and y is incremented\
    \ to the value 9. A break statement is then encountered, and the switch statement\
    \ exits."
  merge: -1
  pgno: 122
