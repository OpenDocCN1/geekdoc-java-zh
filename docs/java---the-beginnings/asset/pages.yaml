  md: '# Section 1 - Assignment Statements


    An assignment statement changes the value of a previously declared variable. It
    consists of the variable name followed by the equal sign (=) followed by a value.
    Assignment statements look very similar to variable declarations that contain
    initialization. The difference is that assignment statements do not specify a
    type.


    ```

    // Declares variable bird,

    // and initializes it to 5

    int bird = 5;

    ```


    ```

    // Assigns previously declared variable

    bird to 6

    bird = 6;

    ```


    After an assignment statement, the memory location associated with the variable
    contains the value of the literal, expression, variable, or method return specified
    to the right of the equal sign.


    ![](img/89593d20c4b70d2c638b3a275d3ccbce_73_0.png)


    A variable must be declared before it can be assigned. Note that is does not have
    to be previously initialized.


    ```

    // ERROR: variable dog not declared

    dog = 2;

    ```


    ```

    // OK

    int dog;

    dog = 2;

    ```


    The value specified in an assign statement can be a literal, an expression, variable,
    or a method return value.


    ```

    int dog;

    int cat = 3;

    ```'
