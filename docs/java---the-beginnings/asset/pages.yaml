  md: "# Section 8 - Return Statements in void Methods\n\nAlthough methods with void\
    \ return types do not need normally contain return statements, they may be present.\
    \ Void return methods can have return statements with no arguments. If the return\
    \ statement is not the last line of the method, then the method will exit prematurely.\
    \ As with non-void return methods, all statements in the method must be physically\
    \ reachable.\n\n```\npublic static void methodTwo(int i)\n{\n    if (i >= 5) {\n\
    \        return;\n    }\n    // OK: statement is reachable if i < 5\n    System.out.println(i);\n\
    \    // return; not necessary\n}\n```"
