  md: '# Section 6 - Promotion


    If one of the operands participating in an arithmetic operation is floating point,
    any integer operands are promoted to the same floating point type before the operation
    is performed.


    ```

    int i = 2;

    float f = 2.5f;


    // i is promoted to float

    // f2 = 2.5 + 2.0

    float f2 = f + i;


    // Prints 4.5

    System.out.println(f2);

    ```'
