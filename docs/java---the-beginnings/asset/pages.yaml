- img_proc: true
  md: "# Section 2 - Execution Flow in a switch Statement\n\nIf the value of the variable\
    \ matches any of the discrete cases, the statement block that follows the case\
    \ executes. A break statement is normally placed at the end of a statement block\
    \ to exit the switch statement after its execution. A break statement is not needed\
    \ after the last statement block.\n\nWe can rewrite the previous if statement\
    \ using a switch statement.\n\n```\nint x = 9, y = 7;\nswitch (x)\n{\n    case\
    \ 2:\n        y = 4;\n        break;\n    case 9:\n        // This statement block\
    \ executes\n        y = 5;\n        // Leaves switch statement\n        break;\n\
    \    case 5:\n        y = 6;\n}\n// Prints 5\nSystem.out.println(y);\n```\n\n\
    Since the value of variable x is 9, the second statement block executes, and y\
    \ is set to the value 5. A break statement is then encountered, and the switch\
    \ statement exits.\n\nObserve that the first two statement blocks end with break\
    \ statements while the last block does not."
  merge: -1
  pgno: 120
- img_proc: true
  md: "# Section 3 - The Default Case\n\nThe default case in a switch statement handles\
    \ all values that are not listed in the other cases. It begins with the keyword\
    \ default and ends with a colon (the keyword case is not used). Switch statements\
    \ are not required to have a default case.\n\n```\nint x = 4, y = 7;\nswitch (x)\n\
    {\n    case 2:\n    y = 4;\n    break;\n    case 9:\n    y = 5;\n    break;\n\
    \    default:\n// This statement block executes\n    y = 8;\n}\n```\n\n// Prints\
    \ 8\nSystem.out.println(y);\n\nSince the value of variable x is 4, none of the\
    \ discrete cases apply, and the statement block associated with the default case\
    \ executes, setting y to the value 8.\n\nAlthough the default case may occur anywhere\
    \ in the switch statement, it is recommended to place it last for readability."
  merge: -1
