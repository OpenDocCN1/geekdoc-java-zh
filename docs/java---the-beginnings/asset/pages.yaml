  md: '# Section 1 - Arrays Defined


    An array is a construct that stores several values of the same type in contiguous
    memory. An array named A which stores the int values 1, 2, and 3 looks as follows:


    | | | memory address |

    |---|---|---|n| 1st int | 1 | 0x1000 |

    | 2nd int | 2 | 0x1004 |

    | 3rd int | 3 | 0x1008 |


    The three int values in array A occupy contiguous memory locations starting at
    address 0x1000.

    The first int resides at memory location 0x1000. Since an int require four bytes
    of memory, the second int resides at 0x1000 + 4 = 0x1004. The third int resides
    at 0x1000 + 8 = 0x1008.


    Each value stored in an array is called an element.'
