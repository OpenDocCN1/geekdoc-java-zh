  md: '# Section 2 - Narrowing Conversions


    If the target data type is considered smaller than the original data type, or
    there is a chance that information will be lost, the conversion is considered
    a narrowing conversion , and the Java compiler will generate an error when such
    an implicit conversion is requested.


    ```

    int i = 10;


    // ERROR: narrowing conversion

    byte b = i;

    ```


    The example above request a conversion from an int type (four bytes) to a byte
    type (one byte). Even though the value of 10 is small enough to fit into a byte
    type, and no information would have been lost in this case, a compilation error
    is still generated.


    A request for implicit conversion from a floating point type to an integer type
    will always be treated as a narrowing conversion. Even though a long type occupies
    more memory than a float type, a compilation error is generated by the example
    below, since the fractional component (0.51) of the floating point number would
    have been lost.


    ```

    float f = 2.51F;


    // ERROR: narrowing conversion

    long l = f;

    ```'
