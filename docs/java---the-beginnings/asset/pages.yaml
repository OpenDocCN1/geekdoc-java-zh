  md: '# Section 2 - The DecimalFormat Class


    The DecimalFormat class differs from the NumberFormat class in that it provides
    a constructor whose argument specifies the pattern used in formatting. The pattern
    can specify special characters such as the dollar sign or commas. It can also
    specify the minimum and maximum number of digits both before and after the decimal
    point. The DecimalFormat class is also part of the java.text package.


    Zeroes in a pattern specify the minimum amount of digits that will be displayed
    before or after the decimal point. If the minimum digits are not present, the
    result will be padded with leading or trailing zeroes. Since the following example
    specifies a minimum of two digits before the decimal and three digits after the
    decimal, the result is padded with one leading zero and two trailing zeros.


    ```

    float f1 = 2.6F;

    DecimalFormat fmt1 =

    new DecimalFormat("00.000");


    // Prints 02.600

    System.out.println(fmt1.format(f1));

    ```


    Pounds (#) in a pattern specify how a number is to be displayed regard to groupings
    and special characters. The pattern in the following example begins with the dollar
    sign ($) character. The digit 4 is outside the pattern specification, so it is
    displayed without formatting. The remainder of the integer component is formatted
    with the thousands grouping. Since the pattern only specifies two fractional digits,
    the fraction is rounded up to .13.


    ```

    float f2 = 41326.128F;

    DecimalFormat fmt2 =

    new DecimalFormat("$#,###.##");


    // Prints $41,326.13

    System.out.println(fmt1.format(f1));

    ```


    Pounds and zeroes can be combined in a pattern. The zeroes are placed inside the
    pound signs (closer to the decimal point). The pattern in the following example
    specifies a thousands grouping that is not displayed with'
