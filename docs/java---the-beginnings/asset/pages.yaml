    \ no arguments, and a return type which matches the type of the field they return.\
    \ Here is the general form of an accessor:\n\n```\nfieldType getFieldName()\n\
    {\n    return field;\n}\n```\n\nAccessors normally use the public modifier to\
    \ make them usable outside the class.\n\nIt is common practice for the name of\
