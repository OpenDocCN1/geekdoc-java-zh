  md: "# Section 5 - Passing an Array of Object References to a Method\n\nArrays of\
    \ object references can be passed to methods. Any changes made inside the method\
    \ to any of the objects referenced by the array will persist after the method\
    \ returns.\n\nIn the following program, method incrementSSN makes changes to the\
    \ SSN fields of the objects referenced in the array parameter p. When the elements\
    \ of the array are printed by the main method after incrementSSN returns, the\
    \ incremented values of the SSN fields are displayed.\n\n# Listing 7 - ObjectsDriver.java\
    \ (version 5)\n\n```\npublic class ObjectsDriver {\n    public static void incrementSSN(Person[]\
    \ p) {\n        for (int i=0; i < p.length; ++i)\n            p[i].setSSN(p[i].getSSN()\
    \ + 1);\n    }\n    public static void main(String[] args) {\n        final int\
    \ NUM_PERSONS = 2;\n        Person[] people = {\n            new Person(\"George\"\
    , 123456789),\n            new Person(\"Martha\", 987654321)\n        };\n   \
    \     incrementSSN(people);\n        for (int i=0; i < NUM_PERSONS; ++i)\n   \
    \         System.out.println(people[i]);\n    }\n}\n```\n\n# PROGRAM OUTPUT:\n\
    \nname = George ssn = 123456790\nname = Martha ssn = 987654322"
