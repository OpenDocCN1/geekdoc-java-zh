  md: "# Section 4 - Reference Variables\n\nA reference is a variable that contains\
    \ the address of an object in memory. In Java, we cannot directly access the fields\
    \ and methods of an object. Instead, we declare a reference variable that contains\
    \ the address of an object, then access the fields and methods of an object through\
    \ the reference variable. To access the public fields and methods of an object,\
    \ precede them with name of a reference variable followed by a period (\n\n```\n\
    // box1 is a reference variable containing\n// the address of a Box object.\n\
    \  Box box1 = new Box();\n\n// Use box1 to access the length field of\n// its\
    \ Box object.\n  box1.length = 9;\n\n// Use box1 to access the setWidth method\n\
    // of its Box object.\n  box1.setWidth(3);\n```\n\nThe new operator returns the\
    \ address of the object it creates. In order for an object to be accessible, the\
    \ result of the new operator must be assigned to a reference variable.\n\nbox1\
    \ = new Box();\n\n![](img/89593d20c4b70d2c638b3a275d3ccbce_196_0.png)"
