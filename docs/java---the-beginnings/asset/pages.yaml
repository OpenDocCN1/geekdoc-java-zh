  md: '# Section 3 - Array Subscripts


    In Java, the elements of an array are assigned consecutive indices starting at
    zero. The elements can be accessed using a subscript, which is the index of the
    element enclosed in square brackets. Using subscripts, we can assign individual
    array elements and retrieve the values contained within them.


    | | | |

    |---|---||

    | A[0] | 1 | element 0 |

    | A[1] | 2 | element 1 |

    | A[2] | 3 | element 2 |


    The following assignment statements set A elements 0, 1, and 2 to the values 1,
    2, and 3, respectively:


    ```

    A[0] = 1;

    A[1] = 2;

    A[2] = 3;

    ```


    We can also print the values contained in each element using the corresponding
    subscript:


    ```

    // Prints 1

    System.out.println(A[0]);


    // Prints 2

    System.out.println(A[1]);


    // Prints 3

    System.out.println(A[2]);

    ```'
