  md: "# Section 3 - for Loops\n\nfor loops explicitly specify the iterations of the\
    \ loop. The form is as follows:\n\n```\nfor (initializer; exit condition; incrementer)\n\
    {\n    statement1;\n    ..\n    statementN;\n}\n```\n\nThe loop specifier consists\
    \ of the keyword for followed by the initializer, exit condition, and incrementer\
    \ separated by semicolons and enclosed in parentheses.\n\nThe initializer specifies\
    \ the conditions for the first iteration of the loop. The exit condition is a\
    \ boolean expression that terminates the loop if it evaluates to false. The incrementer\
    \ increments or decrements a variable.\n\nSimple loops use a single variable referred\
    \ to as a loop counter. The value of the loop counter for the first iteration\
    \ of the loop is specified in the initializer. It is incremented or decremented\
    \ in the incrementer. The exit condition tests the loop counter and decides when\
    \ to terminate the loop.\n\nThe following loop has a loop counter x. The initializer\
    \ sets x to the value 1 for the first iteration of the loop. The incrementer advances\
    \ x by 1 before each subsequent iteration. The exit condition tests at the beginning\
    \ of each iteration if x is less than 4. True, the for's statements execute and\
    \ x is printed. If false, the loop terminates. This loop produces the same results\
    \ as the examples using and do-while loops.\n\n```\nint x;\nfor (x=1; x < 4; ++x)\n\
    {\n    // Prints 1, 2, and 3 on separate lines\n    System.out.println(x);\n}\n\
    ```\n\n```\n// Prints Done\nSystem.out.println(\"Done\");\n```"
