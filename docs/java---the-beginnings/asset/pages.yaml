  md: '# Section 2 - Types


    A type restricts the possible values that a memory location may contain. Let''s
    say we wish to restrict the values of two memory locations to be whole numbers
    only.


    ![](img/89593d20c4b70d2c638b3a275d3ccbce_32_0.png)


    We can write the value 4 to memory location 1000, since 4 is a whole number. However,
    we are unable to write the value 5.1 to memory location 1004, since 5.1 has a
    fractional component, and does not meet with the restriction of being a whole
    number.


    Java is a strongly typed language, which means that all variables must be given
    a type, and that the type of a particular variable may not change.'
