  md: '# Section 15 - The StringBuilder Class


    The StringBuilder class contains many of the methods found in the String class.
    The main difference between the two classes is that StringBuilder objects are
    mutable while String objects are not. You can change the characters in a StringBuilder
    object without creating a new object.


    Unlike String references, a reference to a StringBuilder object cannot be assigned
    a string literal. A StringBuilder constructor must be explicitly called using
    the new operator. A StringBuilder has a constructor which initializes a StringBuilder
    object using a string.


    ```

    StringBuilder bld

    = new StringBuilder("Hello World");

    ```


    A String can be obtained from a StringBuilder object by calling its toString method.


    ```

    String s=(bld.toString());


    // Prints Hello World

    System.out.println(s);

    ```


    Here is a summary of the methods found in StringBuilder that are not found in
    the String class.


    | StringBuilder Method | Description |

    |---|---|n| append(String s) | Adds s to the end of the StringBuilder . |

    | replace(int startPosition, int endPosition, String replacement) | Replaces the
    characters in the StringBuilder from startPosition to one endPosition with the
    replacement string. | delete(int startPosition) | Deletes the characters in the
    StringBuilder from startPosition to one endPosition. |


    Modifications to a StringBuilder do not require the creation of new objects. Therefore,
    StringBuilder operations are more efficient than the equivalent operations on
    String objects. For example, to concatenate a String object, a new object is created
    containing the concatenation of the two strings.


    ```

    String s1 = "Hello";

    ```'
