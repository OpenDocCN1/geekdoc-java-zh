  md: '# Section 4 - The nextFloat Method


    The nextFloat method returns a value between 0.0 and 1.0. The result can be scaled
    to provide results similar to nextInt .


    The following generates a number from 1 to 10 using nextFloat . When converting
    a float value to int, the fractional component is discarded, so the number is
    rounded down to the nearest int value.


    ```

    // 0 <= f < 10.0

    float f = rand.nextFloat()*10F;


    // 0 <= i <= 9

    int i = (int)f;


    // 1 <= i <= 10

    i++;

