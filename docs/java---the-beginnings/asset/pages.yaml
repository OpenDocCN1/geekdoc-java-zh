  md: '# Section 5 - Autoboxing


    It is not necessary to explicitly call the new operator when creating an object
    of a wrapper class. Java implicitly creates an object when a reference variable
    of a wrapper class type is assigned a literal, expression or variable of the associated
    primitive type. This process is called autoboxing.


    Conceptually, Java automatically places the primitive value in a box, which is
    an object of the wrapper class type.


    ![](img/89593d20c4b70d2c638b3a275d3ccbce_311_0.png)


    If you use the new operator to explicitly create a wrapper object from its primitive,
    the Java compiler warn you you that unnecessary boxing has occurred.


    ```

    // WARNING: unnecessary boxing

    Integer i = new Integer(4);

    ```'
