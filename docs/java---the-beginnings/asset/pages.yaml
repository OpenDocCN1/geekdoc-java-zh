  md: "# Section 3 - Overloading Constructors\n\nIn addition to the constructor with\
    \ three parameters defined above, we can provide additional constructors. Let's\
    \ say we want to provide a constructor that sets the height of a box to zero.\
    \ Then, we would write another constructor with only two parameters.\n\n```\n\
    public Box(int l, int w)\n{\n    length = 1;\n    width = w;\n    height = 0;\n\
    }\n```\n\nNote that our class now has two methods named Box , one with parameters\
    \ (int, int, int) and another with parameters (int, int). In Java, you can define\
    \ two or more methods with the same name, as long as either the number of parameters\
    \ passed to the methods are different, or the types of at least one of the parameters\
    \ are different. Then, the methods are said to have a different signature . Methods\
    \ with different signatures may be overloaded. Overloading occurs when two or\
    \ more methods with the same name and different signatures exist in the same class.\n\
    \nWhen the new operator calls an overloaded constructor, Java uses the number\
    \ and types of the arguments in the call to select the constructor with the matching\
    \ signature.\n\n```\n// Calls Box(int, int, int)\nBox b1 = new Box(1, 2, 3);\n\
    ```\n\n```\n// Calls Box(int, int)\nBox b2 = new Box(4, 5);\n```"
