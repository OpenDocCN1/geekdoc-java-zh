  md: '# Section 1 - Using the final Keyword to Define Constants


    A constant is a memory location whose value does not change. A constant is initialized
    to a value, but cannot be assigned to a different value after initialization.


    In Java, constant are declaring by placing the keyword final at the beginning
    of a variable declaration. The names of constants are usually written in uppercase.


    ```

    // An int constant whose value is 3

    final int PURCHASE_LIMIT = 3;

    ```


    A constant must be initialized during declaration by placing an equal sign followed
    by a value after its name. If a constant declaration does not contain initialization,
    a compilation error occurs.


    ```

    // ERROR: constant not initialized

    final int z;

    ```


    Constants can be assigned to variables, or used to initialize variables. However,
    any attempt to change the value of a constant after initialization will result
    in a compilation error.


    ```

    // An int constant whose value is 3

    final int PURCHASE_LIMIT = 3;

    ```


    ```

    int v;

    // OK: constant assigned to a variable

    v = PURCHASE_LIMIT;

    ```


    ```

    // OK: constant used to initialize

    // a variable

    int w = PURCHASE_LIMIT;

    ```


    ```

    // ERROR: cannot assign a constant

    PURCHASE_LIMIT = 4;

    ```'
