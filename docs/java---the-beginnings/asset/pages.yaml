  md: '# Section 8 - The Character Class


    The Character class wraps a char value. It also provides several useful static
    methods for handling characters. These methods take a parameter of type char,
    which means they work with Unicode''s Basic Multilingual Plane (U+0000 through
    U+FFFF). Several of these methods provide versions that accept int codepoint which
    contains the Unicode value of the character, and can identify characters in the
    Supplemental Multilingual Plane (U+10000 through U+1FFFF) or the Supplemental
    Ideographic Plane (U+20000 through U+2FFFF). Supplemental characters cannot be
    represented by a char value, and are modeled with high and low surrogate values.


    For example, the letter ''A'' is Unicode value U+0041. It can be represented by
    a char which contains the integer 65. The lowercase greek letter beta is Unicode
    value U+03B2. Since it is in the Basic Multilingual Plane, it can be represented
    by a char which contains ''\u03B2''. The Phoenician letter if is Unicode value
    U+10900, which is not in the Basic Multilingual Plane. It takes a high surrogate
    containing value 0xd802 and a low surrogate containing 0xdcd00 to represent this
    character. High surrogates can have values between 0xd800 and 0dbff, while low
    surrogates can have values between 0xdc00 and 0xffff. When a low surrogate attempts
    to go passed 0xdbff, it resets to 0xdc00, and the high surrogate is incremented.


    Here is a summary of the static methods in the Character class:


    +   - boolean isLetter(char c) | Returns true if char c represents a letter.

    - boolean isLetter(int codepoint) | Returns true if the character identified represents
    a letter.

    - boolean isDigit(char c) | Returns true if char c represents a digit.

    - boolean isDigit(int codepoint) | Returns true if the character identified by
    codepoint represents a digit.

    - boolean isLetterOrDigit(char c) | Returns true if char c represents a letter
    or a digit.

    - boolean isLetterOrDigit(int codepoint) | Returns true if the character identified
    by codepoint represents a letter or a digit.

    - boolean isUpperCase(char c) | Returns true if char c represents an uppercase
    letter.'
