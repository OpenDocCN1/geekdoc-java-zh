  md: "# Section 1 - Defining Java-style Comments\n\nJava-style comments begin with\
    \ two consecutive forward slash characters.\nAll characters on the current line\
    \ before the forward slashes are processed by the compiler. All characters on\
    \ the current line that follow the forward slashes are ignored by the compiler.\n\
    \nLet's add a Java-style comment to the class definition.\n\n```\npublic class\
    \ HelloWorld // A comment\n{\n    public static void main(String[] args)\n   \
    \ {\n        System.out.println(\"Hello World\");\n    }\n}\n```\n\nThe characters\
    \ \"public class HelloWorld\" are processed by the compiler, beginning the class\
    \ definition. The forward slashes inform the compiler that all following characters\
    \ are comments, so the characters \"A comment\" are ignored by the compiler.\n\
    \nJava-style comments only affect the current line. The line that follows a Java-style\
    \ comment is processed by the compiler. If the text of a Java-style comment needs\
    \ to extend to the following line, forward slashes must precede the text, creating\
    \ a new Java-style comment.\n\nThe following generates a compilation error:\n\n\
    ```\npublic class HelloWorld // Program prints\n    HelloWorld\n```\n\nThe following\
    \ is OK:\n\n```\npublic class HelloWorld // Program prints\n    // HelloWorld\n\
    ```\n\nJava-style comments can be used to prevent a statement from being processed.\
    \ This is useful for debugging purposes. Simply place two forward slashes at the\
    \ beginning of the line containing a statement so that the compiler will ignore\
    \ it. In the program below the println statement in the main"
  merge: -1
  pgno: 24
- img_proc: true
  md: "method has been commented out. The program runs and produces no output.\n\n\
    ```\npublic class HelloWorld {\n    public static void main(String[] args) {\n\
    \        //\n        System.out.println(\"Hello World\");\n    }\n}\n```"
  merge: -1
  pgno: 25
- img_proc: true
  md: "# Section 2 - Defining C-style Comments\n\nC-style comments begin with the\
    \ forward slash characters followed by an asterisk. They end with an asterisk\
    \ character followed by a forward slash. All characters between the beginning\
    \ and ending of a C-style comment are ignored by the compiler. In the program\
    \ below, lines 3 through 6 are ignored by the compiler.\n\n```\npublic class HelloWorld\n\
    {\n    /*\n    This program\n    prints Hello World\n    */\n    public static\
    \ void main(String[] args) {\n        System.out.println(\"Hello World\");\n \
    \   }\n}\n```\n\nProcessing continues immediately after the asterisk forward slash\
    \ combination. If characters follow the end of a C-style comment on the current\
    \ line, they are processed by the compiler. In the following program, the definition\
    \ of the main method starting on line 6 is processed by the compiler.\n\n```\n\
    public class HelloWorld\n{\n    /*\n    This program\n    */ public static void\
    \ main(\n    String[] args)\n{\n        System.out.println(\n        \"Hello World\"\
    );\n    }\n}\n```\n\nC-style comments are very long, the reader has difficulty\
    \ knowing whether any line is a comment or is processed. This does not happen\
    \ with Java-style comments, since the forward slashes are required on each line.\
    \ For this reason, Java-style comments are preferred."
  merge: -1
  pgno: 26
