  md: "# Section 3 - Variables Local to Loops\n\nA variable can be declared inside\
    \ the scope of a loop. A for counter variable is frequently declared in the for\
    \ loop specification, making it local to the loop. The loop counter retains its\
    \ value after each iteration of the loop, and is incremented for the next iteration.\
    \ It then goes out of scope after the loop completes.\n\n```\nfor (int i = 0;\
    \ i < 4; ++i)\n{\n    // Prints 0123\n    System.out.print(i);\n}\n// ERROR: variable\
    \ i undefined\nSystem.out.print(i);\n```\n\nAdditional variables can be declared\
    \ inside the scope of a loop. Unlike the loop counter, these variables do not\
    \ retain their values between iterations of the loop. At the bottom of the loop,\
    \ they go out of scope, and a new variable with the same identifier is created\
    \ during the next loop iteration.\n\nThe following for loop allocates a new variable\
    \ named j with each iteration of the loop.\n\n```\nfor (int i = 0; i < 4; ++i)\n\
    {\n    int j = i * i;\n    System.out.println(i);\n}\n```"
