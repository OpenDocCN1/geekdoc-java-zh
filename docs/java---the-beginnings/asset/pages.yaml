  md: '# # Terminology


    Let''s define some terms that we will use frequently.


    ![](img/89593d20c4b70d2c638b3a275d3ccbce_16_0.png)


    A computer program is a list of instructions that tell a computer what to do.
    Computer programs are stored in files on a computer''s hard drive.


    A programming language is a set of rules to convert words into computer programs.
    Java is a programming language that has a different set of rules than other programming
    languages.


    A compiler is a computer program which interprets files containing a programming
    language. The Java compiler interprets files containing the Java programming language
    and produces bytecode.


    Bytecode refers to general computer instructions which are not associated with
    any particular computer.


    A microprocessor is hardware inside a computer that executes instructions and
    does all the work of your computer program.'
  merge: -1
  pgno: 16
- img_proc: true
  md: The Java Virtual Machine (JVM) is a program which converts bytecode into instructions
    that the microprocessor can execute.
