    # # Section 1b - The parseUnsignedInt Method


    The static parseUnsignedInt method parses its string argument as an unsigned integer.


    The string "2147483648" cannot be parsed as a signed int, since a 32 bit signed
    integer uses the leftmost bit as the sign bit, and 2147483648 will fit in 31 bits.


    ```

    // ERROR: NumberFormatException

    int i = Integer.parseInt("2147483648");

    ```


    The string "2147483648" can be parsed as an unsigned int, since it fits inside
    32 bits. When encoded as a signed int, this unsigned number is encoded as 80000000
    in hex, which is the largest negative number (MIN_VALUE).


    ```

    int ui = Integer.parseUnsignedInt("2147483648");

    // Prints -2147483648

    System.out.println(ui);


    int ui2 = Integer.parseUnsignedInt("80000000",16);

    // Prints -2147483648

    System.out.println(ui2);

    ```


