  md: "# Section 7 - The values Method\n\nEnum types have a values method which returns\
    \ an array of ints containing the ordinal values of all the constants in the enum\
    \ type.\n\n```\n// Prints There are 12 months.\nSystem.out.println(\"There are\
    \ \"\n+ Months.values().length\n+ \" months.\");\n```\n\n# Listing 3 - java.util.RandomMonth.java\n\
    \n```\nimport java.util.Random;\nenum Months {JANUARY, FEBRUARY, MARCH, APRIL,\n\
    MAY, JUNE, JULY, AUGUST, SEPTEMBER,\nOCTOBER, NOVEMBER, DECEMBER }\npublic class\
    \ RandomMonth\n{\n    public static void main(String[] args)\n{\n        Random\
    \ rand = new Random();\n        // Random number from 0 .. 11\n        int monthIndex\
    \ = rand.nextInt(\n            Months.values().length);\n        Months month\
    \ = Months.values(\n            [monthIndex];\n        System.out.println(month);\n\
    \    }\n}\n```"
