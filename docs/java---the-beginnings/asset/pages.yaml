  md: "# Section 1 - switch Statements\n\nA switch statement is a construct that executes\
    \ different statement blocks based on discrete values of a variable. It is said\
    \ to “switch” on a variable. The format of a switch statement is as follows:\n\
    \n```\nswitch (variable_name)\n{\n    case value1:\n        statement block 1\n\
    \    case value2:\n        statement block 2\n    ...\n}\n```\n\nThe keyword switch\
    \ is followed by a variable enclosed in parentheses. This is followed by the body\
    \ of the switch statement enclosed in curly braces. Inside the switch body, discrete\
    \ variable values are listed as cases (the keyword case followed by a value followed\
    \ by a colon). Statement blocks may follow each case."
  merge: -1
