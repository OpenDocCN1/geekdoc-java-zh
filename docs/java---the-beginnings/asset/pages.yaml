  md: '# Section 6 - String Objects are Immutable


    A String object cannot be modified. This property is called immutability.


    Suppose we assign the string literal "Hello" to reference variables s1 and s2.
    This creates one String object in memory that contains the word "Hello".


    ```

    String s1 = "Hello";

    String s2 = s1;

    ```


    ![](img/89593d20c4b70d2c638b3a275d3ccbce_198_0.png)


    If we concatenate the string literal " World" with s1, the String object is not
    modified. Instead, a new String object containing the concatenation of "Hello"
    and " World" is created, and its address is assigned to s1. The address of the
    original String object still resides in s2.


    ```

    String s1 += " World";

    ```


