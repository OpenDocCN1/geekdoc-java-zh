  md: '# Section 4 - The Bounds of an Array


    An array declaration specifies a fixed number of elements. This means that only
    the specified number of elements are defined in memory. If an attempt is made
    to access an element that is not defined, Java throws the ArrayIndexOutOfBoundsException.
    A negative array subscript will always throw this exception. Also, for an array
    of size N, a statement with array subscript greater than N-1 will throw the exception.


    ```

    int[] A = new int[3];

    // Throws ArrayIndexOutOfBoundsException

    A[-1] = 0;

    // OK

    A[2] = 3;

    // Throws ArrayIndexOutOfBoundsException

    A[3] = 4;

    ```'
