  md: '# Section 6 - The compareTo Method


    Enum types have a compareTo which returns the following:


    +   - a negative int if calling enum is less its the argument

    - zero if the calling enum and its argument are the same

    - a positive int if calling enum is greater than its argument


    ```

    Months month = Months.APRIL;

    // Prints -2

    System.out.println(Months.APRIL.compareTo(

    Months.JUNE));

    // Prints 2

    System.out.println(Months.APRIL.compareTo(

    Months.FEBRUARY));

    // Prints 0

    System.out.println(Months.APRIL.compareTo(

    month));

    ```'
