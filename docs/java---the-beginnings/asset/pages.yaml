  md: "If any of the array elements are changed to point to a different object while\
    \ inside the method, the change will persist after the method returns. Recall\
    \ that an array is itself an object, so that when it is passed as an argument\
    \ to the method, we are really passing a reference to the array. If an element\
    \ of the array is changed, the change persists since a reference to the entire\
    \ array is passed into the parameter variable, not a reference to one of the objects\
    \ referenced by any element.\n\nIn the example below, an array at address 0x1000\
    \ is passed to the parameter reference variable p. A new Person object (\"Abe\"\
    , 111111111) is created and assigned to the second element array. When the elements\
    \ of the array people are printed by the main method after replaceElement returns,\
    \ the object \"Abe\" is displayed instead of \"Martha\".\n\n![](img/89593d20c4b70d2c638b3a275d3ccbce_292_0.png)\n\
    \n# Listing 8 - ObjectsDriver.java (version 5)\n\n```\npublic class ObjectsDriver\
    \ {\n    public static void replaceElement(Person[ ] p, int i, String n, int s)\
    \ {\n        p[i] = new Person(n,s);\n    }\n    public static void main(String[]\
    \ args) {\n        final int NUM_PERSONS = 2;\n        Person[] people = {\n \
    \           new Person(\"George\", 123456789),\n            new Person(\"Martha\"\
    , 987654321)\n        };\n        replaceElement(people,1,\"Abe\", 111111111);\n\
    \    }\\}\n```"
