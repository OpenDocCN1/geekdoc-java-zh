  md: '# Section 4 - The toString and name Methods


    The toString method of enum type returns a string representation of the enum constant
    currently assigned. This method is called whenever enum constant or reference
    variable is passed to a method expecting a String object


    Enum types also provide the name method which also provides a string representation.


    ```

    Months month = Months.NOVEMBER;

    // Prints NOVEMBER

    System.out.println(month);

    // Prints OCTOBER

    System.out.println(Months.OCTOBER.name());

