  md: '# Section 7 - String Equality


    Suppose one String object is initialized to the string "HELLO". Then another String
    object is concatenated such that it also contains the string "HELLO". If we use
    the == operator to test the String objects for equality, the result is false.


    ```

    String a = "HELLO";nString b = "HEL";nb = b +"LO";n

    // Prints false

    System.out.println(a==b);

    ```


    Recall from the Variables lesson that String variables are references to String
    objects that reside elsewhere. Object references a and b point to different memory
    locations (each of which happen to contain the string "HELLO\). Since the memory
    locations are different, the test for equality fails.


    ![](img/89593d20c4b70d2c638b3a275d3ccbce_88_0.png)


    Fortunately, the String class provides an equals method which returns true the
    contents two String objects match.


    ```

    String a = "HELLO";nString b = "HEL";nb = b +"LO";n

    // Prints true

    System.out.println(a.equals(b));

    ```'
