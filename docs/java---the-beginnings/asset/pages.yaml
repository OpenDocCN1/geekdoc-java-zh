  md: '# Section 5 - Bitwise Expressions


    Java provides the &, |, and ~ operators to perform bitwise operations on integer
    operands. The bitwise operators perform logical AND, OR, or NOT operations on
    each bit of their operands.


    ```

    byte x = 8, y = 3, z = 1;

    // 0b1000 OR 0b0011

    // Prints 11

    System.out.println(x | y);


    // 0b0011 AND 0b0001

    // Prints 1

    System.out.println(y & z);


    // Performs NOT(0x08) = 0xF7

    // Prints -9

    System.out.println(-x);

    ```


    # Section 5a - Shifting


    Java provides operators to perform bitwise shifting on integer operands. >> right
    shifts bits in the leftmost operand the number of positions specified by the rightmost
    operand. << left shifts bits in the leftmost operand the number of positions specified
    by the rightmost operand.


    ```

    int x = 17;

    // 8

    int y = x >> 1;

    // 68

    int z = x << 2;

    ```


    The bits in variable x (17 is 10001 in binary) are each shifted one position to
    the right, and the result is stored in variable y. Note that the 1 in bit position
    zero is discarded, resulting in the value 8.'
