  md: "# Section 3 - The ordinal Method\n\nEach enum constant has an underlying integer\
    \ value corresponding to the order in which it was defined. For the Months enum\
    \ type, JANUARY has integer value zero, FEBRUARY has one, and so on.\n\nThe ordinal\
    \ method can be used to obtain the underlying integer of an enum constant or enum\
    \ type variable.\n\n```\nMonths month = Months.JULY;\n\n// Prints 6\n   System.out.println(month.ordinal());\n\
    \n// Prints 5\n   System.out.println(Months.JUNE.ordinal());\n```"
