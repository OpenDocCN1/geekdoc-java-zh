  md: '# Section 5 - Multiple References to the Same Object


    Declaring a reference does not create an object (only the new operator can do
    that).


    The reference variable box1 below is not associated with an object.


    ```

    // A reference without an object

    Box box1;

    ```


    We will use the new operator to create a Box object, then assign its address to
    another reference variable called box2.


    ```

    // An object is created by the new operator

    Box box2 = new Box();

    box2.length = 5;

    box2.width = 4;

    box2.height = 3;

    ```


    When we assign a reference variable to another reference variable, a new object
    is not created. Instead, both reference variables point to the same object.


    ```

    // Two references to the same object

    box1 = box2;

    ```


    Either reference variable can be used to view or modify the Box object. In the
    example below, the box1 reference overwrites the Box object''s length field with
    the value 7. When the box2 reference reads back the length field, 7 is displayed
    instead of 5.


    ```

    box1.length = 7;

    // Prints 7

    System.out.println(box2.length);

    ```


    ![](img/89593d20c4b70d2c638b3a275d3ccbce_197_0.png)'
