  md: "# Section 1 - Declaring an Array of Object References\n\nArrays of object references\
    \ are declared the same as arrays of primitive types. However, declaring an array\
    \ of object references does not create objects. It only defines a set of references\
    \ which are initialized to null. Objects must still be created using the new operator.\n\
    \nLet's create an array of Person object references using the Person class defined\
    \ in Listing 1.\n\n# Listing 1 - Person.java\n\n```\npublic class Person {\n \
    \   private String name;\n    private int ssn;\n    public Person() {\n      \
    \  name = \"\";\n        ssn = 0;\n    }\n    public Person(String n, int ssn)\
    \ {\n        name = n;\n        ssn = s;\n    }\n    public String getName() {\
    \ return name; }\n    public int getSsn() { return ssn; }\n    public String toString()\
    \ {\n        return \"name = \" + name + \" ssn = \" + ssn;\n    }\n}\n```\n\n\
    The program in Listing 2 declares an array of Person object references containing\
    \ two elements. Both elements are initialized to null. The program does not use\
    \ the new operator to create Person objects and assign their addresses to the\
    \ array elements. Therefore, when the println statement attempts to access the\
    \ getName method of the object at element 0, the program throws a NullPointerException."
