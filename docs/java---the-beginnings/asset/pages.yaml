  md: "# Section 1f - The MIN_VALUE and MAX_VALUE Constants\n\nSeveral wrapper classes\
    \ provide the static MIN_VALUE and MAX_VALUE constants. MIN_VALUE defines the\
    \ smallest value possible for its primitive type. MIN_VALUE for the Integer class\
    \ is -2 31 . MAX_VALUE defines the largest value possible for the primitive type\
    \ it wraps. MAX_VALUE for the Integer class is 2 31 -1.\n\nTo find the largest\
    \ value of several numbers, create a variable and initialize it to MIN_VALUE.\
    \ The initial comparison to the variable are guaranteed to be greater than or\
    \ equal, so that the result of all comparisons will be the largest among the numbers.\n\
    \nTo find the smallest value of several numbers, create a variable and initialize\
    \ it to MAX_VALUE. The initial comparison to the variable are guaranteed to be\
    \ less than or equal, so that the result of all comparisons will be the smallest\
    \ value among the numbers.\n\n# Listing 1 - FindMinMax.java\n\n```\npublic class\
    \ FindMinMax {\n    public static Integer largest(\n        Integer[] array) {\n\
    \        Integer max = Integer.MIN_VALUE;\n        for (Integer i : array) {\n\
    \            if (i > max)\n                max = i;\n        }\n        return\
