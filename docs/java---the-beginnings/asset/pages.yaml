  md: "# Section 7 - Premature Returns\n\nThere may be situations where you want a\
    \ method to exit prematurely, before all statements execute. The only restriction\
    \ is that all statements to be physically reachable. If a method with a non-void\
    \ return type has a premature return, it must still have a return as the last\
    \ statement in the method.\n\n```\npublic static int methodPreReturn(int i)\n\
    {\n    return i;\n}\n// ERROR: statement not reachable\nSystem.out.println(i);\n\
    return 0;\n\n```\n\nPhysically reachable means that under some circumstance, the\
    \ statement may be executed. The following version of methodPreReturn will compile\
    \ because the println statement is reachable for all i less than 5:\n\n```\npublic\
    \ static int methodPreReturn(int i)\n{\n    if ( i >= 5) \n        return i;\n\
    }\n// OK: statement reachable if i < 5\nSystem.out.println(i);\nreturn 0;\n\n\
    ```"
  merge: -1
