  md: '# Section 3 - Primitive Types


    Many of the variables we will define in our programs simply hold data and fall
    into the following categories: whole numbers, decimal numbers, characters, and
    true or false. Java has provided primitive types which are built into the language,
    and we can use in our programs.


    # Section 3a - The Integer Types


    The integer types restrict variables to whole numbers of various sizes. All integer
    types are signed, with the leftmost bit of the type containing the sign bit. All
    integer types are stored in 2’s complement form.


    byte


    The byte type can be used to express a number as small as -128 and as large as
    127. A byte occupies 8 bits (one byte) of memory.


    | -128_{10} | 80_{16} |

    |---|---|

    | 127_{10} | 7F_{16} |


    short


    The short type can be used to express a number as small as -32,768 and as large
    as 32,767. A short occupies 16 bits of memory.'
