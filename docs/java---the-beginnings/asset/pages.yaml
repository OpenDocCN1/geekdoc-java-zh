  md: "# Section 10 - The Size of a Java Array is Constant\n\nJava arrays are created\
    \ with a fixed number of elements. Additional elements cannot be added to them\
    \ after creation. However, a new larger array can be created and assigned to the\
    \ reference variable which previously pointed to a smaller array.\n\nIf it is\
    \ determined that an array is too small, a good rule of thumb is to make the new\
    \ array twice as large as the previous one. This will avoid constant copying of\
    \ one array into another.\n\nThe following program keeps track of the number of\
    \ elements used in an array using the elements field. When the array is full (elements\
    \ equal to the length of the array), a temp array is created that is as large\
    \ as the previous array. The elements in the old field are copied to the temp\
    \ array. Then the array reference field is pointed to the temp array.\n\n# Listing\
    \ 7 - ArrayAllocator.java\n\n```\npublic class ArrayAllocator\n{\n    private\
    \ int[] array;\n    private int elements;\n    public ArrayAllocator(int s) {\n\
    \        elements = 0;\n        array = new int[s];\n    }\n    public void add(int\
    \ value) {\n        if (elements == array.length) {\n            int[] tempArray\n\
    \                = new int[array.length*2];\n            for (int i=0; i<array.length;++i)\n\
    \                tempArray[i] = array[i];\n            array = tempArray;\n  \
    \      }\n        array[elements] = value;\n        elements++;\n    }\n    public\
    \ static void main(String[] args)\n```"
