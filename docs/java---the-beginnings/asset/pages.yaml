  md: "# Section 1 - The Random Class\n\nThe Random class generates pseudorandom numbers.\
    \ The numbers are pseudorandom because the series starts at an arbitrary seed\
    \ value. We can call its nextInt method to retrieve a random int value.\n\n```\n\
    Random rand = new Random();\nint x = rand.nextInt();\n```\n\nThe random int generated\
    \ above can have any value in the valid range of int values.\n\nWe can rewrite\
    \ the PrintNumber program to print a random int value as follows:\n\n# Listing\
    \ 2 - PrintNumber.java (version 2)\n\n```\nimport java.util.Random;\npublic class\
    \ PrintNumber\n{\n    public static void main(String[] args)\n    {\n        Random\
    \ rand = new Random();\n        int x = rand.nextInt();\n        System.out.println(x);\n\
    \    }\n}\n```\n\nThe Random class resides in the java.util package, so it must\
    \ be imported that we can refer to the Random class without qualification. Each\
    \ time we run the PrintNumber program, a different number is printed. Note that\
    \ the values generated can be quite large and can also be negative.\n\nExamples\
    \ of PrintNumber output:\n\n96228995\n-1501735014"
