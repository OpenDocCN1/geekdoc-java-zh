  md: '# Section 6 - Unboxing


    The Integer class provides an intValue method which returns the int value, but
    it is not necessary to call this method to assign the int value to an int variable.
    Java will automatically extract the int value from the Integer object if it is
    needed for assignment to an int variable, or use it inside an expression involving
    ints. This process is called unboxing , and it is the opposite of autoboxing.


    ```

    // autoboxed

    Integer i = 5;


    // unboxed during int assignment

    int x = i;


    // Prints 5

    System.out.println(x);


    // unboxed during int expression

    // Prints 10

    System.out.println(5 + i);

    ```


    If you use the intValue method in situations where unboxing would automatically
    occur, the compiler will generate a warning:


    ```

    Integer j = 6;


    // WARNING: unnecessary unboxing

    int x = i.intValue();

    ```'
