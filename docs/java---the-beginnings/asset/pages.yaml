  md: '# # Loops


    Let''s say our program needs to increment and print a variable three times. We
    can write assignment and println statements, then copy and paste them twice.


    ```

    int x = 0;

    x = x + 1;


    // Prints 1

    System.out.println(x);

    x = x + 1;


    // Prints 2

    System.out.println(x);

    x = x + 1;


    // Prints 3

    System.out.println(x);


    // Prints Done

    System.out.println("Done");

    ```


    But what if we make a mistake while copying and pasting?


    ```

    int x = 0;

    x = x + 1;


    // Prints 1

    System.out.println(x);

    x = x + 1;


    // Prints 2

    System.out.println(x);


    // Oops! Prints 1

    System.out.println(x);


    // Prints Done

    System.out.println("Done");

    ```


    And what if we needed to perform these operations 1000 times instead of three?
    It would be unproductive to copy and paste these statements 999 times. Instead,
    we place them inside a loop.'
