- fmt: "\nEven with external dependencies: `private Z_E2F_RS_Result e2fResult; //ingredients\
    \ record` it must be refactored to this: `private Z_E2F_RS_Result ingredients;`\
    \ Imagine that we don't have the `//ingredients` comment in `e2fResult` variable.\
    \ Then, further in any part of our code, when we try to process this variable,\
    \ we have the following sentence: `e2f = e2fResult[idx];` And we don’t know what\
    \ does `e2f` means!. Well, someone suggests asking the person responsible for\
    \ this code. But that guy is not at the office. Well, send it an email, and he\
    \ is on holiday!. But if, instead, we adopt names that reveal intent from the\
    \ beginning, we could avoid these catastrophic scenarios. `ingredient = ingredients[idx];`\
    \ Throughout this book, you will see how important these practices are to write\
    \ efficient and readable algorithms.\n\n# Test-Driven Java Development\n\nTest-Driven\
    \ Development (TDD) is a process, which is based on a procedure called `red-green-refactor`.\
    \ This procedure consist of a few steps that are repeated over and over again:\n\
    \n* Write a test.\n* Run all tests.\n* Write an implementation code.\n* Run all\
    \ tests.\n* Refactor code.\n* Run all tests.\n\nWhile writing tests, we are in\
    \ the red state. When the test implementation is ready, all tests should pass,\
    \ and then we will be in the green state. In Java, we use `JUnit` libraries to\
    \ implement our test cases. Throughout this book, we will omit, in some cases,\
    \ the definition of a Java Test Class and focus only on the methods with `@Test`\
    \ annotations.\n\n```java\npublic class UtilsTest {\n\n  private Utils utils;\n\
    \n  @Before\n  public void setUp() {\n    utils = new Utils();\n  }\n\n  @Test\n\
    \  public void fileExists () throws Exception {\n    String content = utils.loadFile(\"\
    symbols.txt\");\n    assertNotNull(content);\n  }\n}\n```\n\n# Arrays and Strings\n\
    \n## 1.0 Fundamentals\n\n### Arrays\nAn array is an object that stores a fixed\
    \ number of elements of the same data type. Its numerical index accesses each\
    \ element.![](image_rsrc2KD.jpg) Figure 1.0.1 Array\n\nIf you ask the `Array`,\
    \ give me the element at index 4, the computer locates that element's cell in\
    \ a single step. That happens because the computer finds the memory address where\
    \ the array begins - 1000 in the figure above - and adds 4, so the element will\
    \ be located at memory address 1004. Arrays are a linear data structure because\
    \ the elements are arranged sequentially and accessed randomly. One of the limitations\
    \ of the array is that adding or deleting data takes a lot of time. In a one-dimensional\
    \ array, you retrieve a single value when accessing each index.![](image_rsrc2KE.jpg)\n\
    \n```java\n// declares an array of integers\nint[] arrayOfInts;\n// allocates\
    \ memory for 10 integers\narrayOfInts = new int[10];\n// initialize first element\n\
    arrayOfInts[0] = 100;\n// initialize fourth element\narrayOfInts[3] = 200;\n//\
    \ get contents of fourth element\nint temp = arrayOfInts[3];\n```\n\nIn a multidimensional\
    \ array, you retrieve an array when accessing each index. A two-dimensional array\
    \ is known as a matrix. Arrays allow us to have one variable store multiple values.\
    \ For example, we define an array of products 2-D, whose elements per row represents:\
    \ `productId`, price, and grams.\n\n```java\ndouble [][] arrayOfProducts = new\
    \ double[4][3];\narrayOfProducts[2][0] = 2;\narrayOfProducts[2][1] = 1.29;\narrayOfProducts[2][2]\
    \ = 240;\n```\n\nThe following figure shows the representation of this array of\
    \ arrays:![](image_rsrc2KF.jpg) Figure 1.0.2 Multidimensional Array\n\nOnce an\
    \ array is created, it can not change its size. For dynamic arrays, use a `List`.\
    \ An `ArrayList` is a resizable array implementation of the `List` interface.\n\
    \n```java\nList<String> listOfCities = new ArrayList<>();\nlistOfCities.add(\"\
    New York\");\nlistOfCities.add(\"Berlin\");\nlistOfCities.add(\"Paris\");\nlistOfCities.add(\"\
    Berlin\");\n// Traversing list through the for-each loop\nfor(String city : listOfCities)\n\
    \  System.out.println(city);\n```\n\n### Strings\nA sequence of character data\
    \ is called a string and is implemented by the `String` class.\n\n```java\nString\
    \ myString = \"literal of \";\nchar[] arrayOfChars = myString.toCharArray();\n\
    ```\n\nThe java compiler allocates in memory a `String` object when it encounters\
    \ a literal string. `myString + \"chars.\"` The previous concatenation creates\
    \ a third `String` object in memory. That is because `Strings` are immutable,\
    \ they can not change once it is created. Use a mutable `StringBuilder` class\
    \ if you want to manipulate the contents of the string on the fly.\n\n```java\n\
    StringBuilder stringOnTheFly = new StringBuilder();\nstringOnTheFly.append(myString).append(\"\
    chars.\");\n```\n\n## 1.1 Reverse a Text\nGiven a string of characters, reverse\
    \ the order of the characters in an efficient manner.\n\n### Solution\nWe choose\
    \ an array – holds values of a single type - as our data structure because the\
    \ algorithm receives a small amount of data, which is predictable and is read\
    \ it randomly (its numerical index accesses each element). Firstly, convert the\
    \ text to be reversed to a character array. Then, calculate the length of the\
    \ string. Secondly, swap the position of array elements using a loop. Don’t use\
    \ additional memory, which means avoiding unnecessary objects or variables ([space\
    \ complexity](#part0016.xhtml_a2FW)). Swapping does it in place by transposing\
    \ values using a temporary variable. Then, swap the first element with the last,\
    \ the second element with the penultimate, and so on. Moreover, we only need to\
    \ iterate until half of the array. Finally, it returns the new character array\
    \ as a `String`. Listing 1.2 shows the algorithm.\n\n```java\npublic class StringUtils\
    \ {\n\n  public static String reverse(String text) {\n    char[] chars =text.toCharArray();\n\
    \    final int arrayLength =chars.length;\n    char temp;\n    for (int idx =0;\
    \ idx < arrayLength/2; idx++) {\n      temp =chars[idx];\n      chars[idx] =chars[arrayLength\
    \ - 1 - idx];\n      chars[arrayLength - 1 - idx] =temp;\n    }\n    return String.valueOf(chars);\n\
    \  }\n}\n```\n\n**Example:**\nWhen `idx = 0`: `chars = {a, b, c, 2, 1, 3, 2}`,\
    \ `chars[idx] = a`, `chars[arrayLength-1-idx] = 2`\nWhen `idx = 1`: `chars = {2,\
    \ b, c, 2, 1, 3, a}`, `chars[idx] = b`, `chars[arrayLength-1-idx] = 3`\nWhen `idx\
