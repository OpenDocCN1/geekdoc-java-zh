    \ int[]{21, 16, 11, 6, 1}, matrix[0]);\n    assertArrayEquals(new int[]{22, 17,\
    \ 12, 7, 2}, matrix[1]);\n  }\n}\n```\n\n# 链表\n\n## 2.0 基础\n链表是一种表示节点序列的线性数据结构。与数组不同，链表将项存储在计算机内存中的非连续位置。它通过指针连接项。分散在内存中的连接数据被称为“节点”。在链表中，节点嵌入了项。由于列表中有很多相似的节点，使用一个独立的类\
    \ `Node` 是有意义的，它与链表本身是分离。每个 `Node` 对象都包含一个指向下一个节点的引用（通常称为 `next`）。该引用是指向下一个节点内存地址的指针。`Head`\
    \ 是一个特殊的节点，用于表示链表的开头。链表的表示如图所示。\n\n![](img/image_rsrcKJ.jpg)\n图 1.0.1 链表\n\n每个节点由两个内存单元组成。第一个单元存储实际数据，第二个单元存储链接。上图中的“B”是链表的起点。数组在内存中是连续的，而链表在内存中是分布的。链表在插入或删除元素时非常高效，因为不需要移动其他元素。然而，访问链表中的特定元素则较慢，因为必须从头节点开始遍历。链表需要额外的内存来存储指针，而数组不需要。链表在动态调整大小方面非常灵活，而数组通常是固定大小。链表在许多算法中被广泛应用，例如：\n\
    - 栈（Stack）\n- 队列（Queue）\n- 哈希表（Hash Table）中的冲突解决\n- 快速排序（Quick Sort）算法\n- 邻接表（Adjacency\
    \ List）用于图论\n\n链表与数组的对比\n\n| 特性 | 链表 | 数组 |\n| :--- | :--- | :--- |\n| 内存分布 |\
    \ 非连续 | 连续 |\n| 访问速度 | 慢（O(n)） | 快（O(1)） |\n| 插入/删除 | 快（O(1) - 已知位置） | 慢（O(n)）\
    \ |\n| 内存开销 | 高（需要存储指针） | 低 |\n| 灵活性 | 动态大小 | 固定大小或需扩容 |\n\n## 2.1 链表的实现\n链表由一系列节点组成。我们首先定义一个\
    \ `Node` 类：\n\n```java\nclass Node {\n  int data;\n  Node next;\n\n  Node(int\
    \ data) {\n    this.data = data;\n    this.next = null;\n  }\n}\n```\n\n接下来，我们实现\
    \ `LinkedList` 类来管理这些节点：\n\n```java\npublic class LinkedList {\n  Node head;\n\
    \n  public LinkedList() {\n    this.head = null;\n  }\n  // 方法\n```\n\n### 添加元素\n\
    向链表末尾添加新元素：\n\n```java\npublic void add(int data) {\n  Node newNode = new Node(data);\n\
    \  if (head == null) {\n    head = newNode;\n  } else {\n    Node current = head;\n\
    \    while (current.next != null) {\n      current = current.next;\n    }\n  \
    \  current.next = newNode;\n  }\n}\n```\n\n### 遍历链表\n打印链表中的数据：\n\n```java\npublic\
    \ void display() {\n  Node current = head;\n  while (current != null) {\n    System.out.print(current.data\
    \ + \" -> \");\n    current = current.next;\n  }\n  System.out.println(\"null\"\
    );\n}\n```\n\n### 删除元素\n删除指定值的元素：\n\n```java\npublic void delete(int data) {\n\
    \  Node current = head;\n  Node prev = null;\n\n  if (current != null && current.data\
    \ == data) {\n    head = current.next;\n    return;\n  }\n\n  while (current !=\
    \ null && current.data != data) {\n    prev = current;\n    current = current.next;\n\
    \  }\n\n  if (current == null) return;\n\n  prev.next = current.next;\n}\n```\n\
    \n## 2.2 双向链表\n双向链表中的每个节点包含两个指针：一个指向下一个节点，一个指向前一个节点。\n\n```java\nclass DoublyNode\
    \ {\n  int data;\n  DoublyNode next;\n  DoublyNode prev;\n\n  DoublyNode(int data)\
    \ {\n    this.data = data;\n    this.next = null;\n    this.prev = null;\n  }\n\
    }\n\npublic class DoublyLinkedList {\n  DoublyNode head;\n  DoublyNode tail;\n\
    \n  public void add(int data) {\n    DoublyNode newNode = new DoublyNode(data);\n\
    \    if (head == null) {\n      head = tail = newNode;\n    } else {\n      tail.next\
    \ = newNode;\n      newNode.prev = tail;\n      tail = newNode;\n    }\n  }\n\
    \  // 更多方法...\n}\n```\n\n## 2.3 循环链表\n在循环链表中，最后一个节点指向第一个节点。\n\n```java\nclass\
    \ CircularNode {\n  int data;\n  CircularNode next;\n\n  CircularNode(int data)\
    \ {\n    this.data = data;\n    this.next = null;\n  }\n}\n\npublic class CircularLinkedList\
    \ {\n  CircularNode head;\n\n  public void add(int data) {\n    CircularNode newNode\
    \ = new CircularNode(data);\n    if (head == null) {\n      head = newNode;\n\
    \      newNode.next = head;\n    } else {\n      Node temp = head;\n      while\
    \ (temp.next != head) {\n        temp = temp.next;\n      }\n      temp.next =\
    \ newNode;\n      newNode.next = head;\n    }\n  }\n}\n```\n\n"
