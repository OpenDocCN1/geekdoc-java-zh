    ## Preface

    I am a software engineer who faced real interviews. This book includes typical
    questions that you must know and practice. All solved and explained in detail.
    Whether your knowledge of data structures is scarce or buried in memory, this
    book can help you. The more prepared and confident you are, the better the chances
    of negotiating your next salary.


    ## Introduction

    Data structures refer to how data is organized and stored and how fast your program
    runs. An algorithm is a set of instructions well defined for accomplishing a task
    or solve a problem. It is possible to have two different algorithms that solve
    the same problem, but it matters which one is better in terms of performance.


    ## Algorithms and Data structures

    Knowing the appropriate data structures becomes decisive.


    ## Abstract Data Types

    Abstract Data Type (ADT) is a data type, which specifies a set of data and a set
    of operations that can perform with that data. It’s called abstract because only
    its behavior is defined but not its implementation.


    ## How to develop a Usable Algorithm

    * Model the problem, identifying the elements of it.

    * Design a sequence of steps algorithm should do, defining the data structures
    and data types.

    * Is the algorithm fast enough and fit in memory?. Here you must refactor the
    algorithm, possibly changing the data structures and the sequence of steps. Big
    O Notation is your helper in this task.

    * Iterate until you are satisfied.


    ## Clean Code

    Clean code can be read and enhanced by a developer other than its original author.
    If you want to be a better programmer, you must follow these recommendations.


    ### Intention-Revealing names

    Names reveal intent. Someone who reads your code must understand the purpose of
    your variable, function, or Class.


    Real situation:

    `int sId; //supplier Id`

    `int artDelPrice;`


    It must be refactored to this:

    `int supplierId;`

    `int articleDeliveredPrice;`

