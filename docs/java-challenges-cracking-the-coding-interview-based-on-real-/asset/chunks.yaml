    \n# 9.0 Fundamentals\n\nA `Graph` is a non-linear data structure consisting of\
    \ nodes (vertices) and edges. Its shape depends on the physical or abstract problem\
    \ we are trying to solve. For example, if nodes represent cities, the routes which\
    \ connect cities may be defined by non-directed edges. But if nodes represent\
    \ tasks to complete a project, then their edges must be directed to indicate which\
    \ task must be completed before another.\n\n## Terminology\n\nA `Graph` can model\
    \ the `Hyperloop` transport to be installed in Germany.\n\n![](image_rsrc2KZ.jpg)\n\
    Figure 9.0 Graph - terminology\n\nA `Graph` shows only the relationships between\
    \ the `vertices` and the `edges`. The most important here is which edges are connected\
    \ to which vertex. We can also say that a `Graph` model connections between objects.\n\
    \n### Adjacency\nWhen a single edge connects two vertices, then they are adjacent\
    \ or neighbors. In the figure above, the vertices represented by `Berlin` and\
    \ `Leipzig` are adjacent, but the cities `Berlin` and `Dresden` are not.\n\n###\
    \ Path\nA `Path` is a sequence of edges. The figure above shows a path from `Berlin`\
    \ to `München` that passes through cities `Leipzig` and `Nürnberg`. Then the path\
    \ is `Berlin`, `Leipzig`, `Nürnberg`, `München`.\n\n### Connected Graphs\nA `Graph`\
    \ is connected if there is at least one path from every vertex to every other\
    \ vertex. The figure above is connected because all cities are connected.\n\n\
    ### Directed and Weighted Graphs\nA `Graph` is directed when the edges have a\
    \ direction. In the figure above, we have a non-directed graph because the hyperloop\
    \ can usually go either way. From `Berlin` to `Leipzig` is the same as from `Leipzig`\
    \ to `Berlin`.\n\nGraphs are called a weighted graph when edges are given weight,\
    \ e.g., the distance between two cities can be weighted in how fast they are connected.\n\
    \nA graph can answer one of the questions: which cities can be reached from a\
    \ given `City`? We need to implement search algorithms. There are two different\
    \ ways of searching in a graph: `depth-first search (DFS)` and `breadth-first\
    \ search (BFS)`.\n\n# 9.1 Depth-First Search (DFS)\n\nImplement the depth-first\
    \ search algorithm to traverse a graph data structure.\n\n## Solution\n\nDepth-first\
    \ search (`DFS`) is an algorithm for traversing the graph. The algorithm starts\
    \ at the root node (selecting some arbitrary city as the root node) and explores\
    \ as far as possible along each path. Figure 9.1.1 shows a sequence of steps if\
    \ we choose `Berlin` as the root node.\n\n![](image_rsrc2M0.jpg)\nFigure 9.1.1\
    \ Depth-first search - the sequence of the steps\n\n### Implementing the algorithm\n\
    \n### Model the problem\nWe need an Object which supports any data included in\
    \ the `Node`. We called it `Vertex`. We define a Boolean variable to avoid cycles\
    \ in searching cities, so we will mark each node when visiting it. Listing 9.1.1\
    \ shows a `Vertex` Class implementation.\n\nListing 9.1.1 – Vertex Class\n```java\n\
    public class Vertex {\n    private String name;\n    private boolean visited;\n\
    \n    public Vertex(String name) {\n        this.name = name;\n        this.visited\
    \ = false;\n    }\n\n    public String getName() {\n        return name;\n   \
    \ }\n\n    public void setName(String name) {\n        this.name = name;\n   \
    \ }\n\n    public boolean isVisited() {\n        return visited;\n    }\n\n  \
    \  public void setVisited(boolean visited) {\n        this.visited = visited;\n\
    \    }\n}\n```\n\nThen, We will store these vertices in an array called `arrayOfVertex[]`.\
    \ We have two approaches to model how the vertices are connected (edges): the\
    \ `adjacency matrix` and the `adjacency list`. For this algorithm, we are going\
    \ to implement the adjacency matrix.\n\n### The adjacency matrix\nIn a graph of\
    \ `N` vertices, we create a two-dimensional array of `NxN`. An edge between two\
    \ vertices (cities) indicates a connection (two adjacent nodes) represented by\
    \ `1`. No connections are represented by `0`.\n\n![](image_rsrc2M1.jpg)\nTable\
    \ 9.1.1 The adjacency matrix\n\nThe table 9.1.1 says, `Leipzig` is adjacent to\
    \ `Berlin`, `Dresden`, and `Nürnberg`.\n\n### Create and initialize an abstract\
    \ data type\nWe create an abstract data type called `Graph` to define the behavior\
    \ of our data structure. We need a stack so we can remember the visited vertices.\
    \ When we add a new `Vertex` (`City`) stored in our `arrayOfVertex[]`, the `numOfVertices`\
    \ variable indicates the number of Vertexes already added to the `Graph`. Since\
    \ we will pass a `String` argument to our `DFS` algorithm (city name), a `mapOfVertex`\
    \ HashMap is defined to register the key-value: `city-index`. Listing 9.1.2 shows\
    \ a `Graph` Class implementation.\n\nListing 9.1.2 Graph Class\n```java\npublic\
    \ class Graph {\n    private final int MAX_VERTEX = 15;\n    private Vertex arrayOfVertex[];\
    \ //cities\n    private Map<String, Integer> mapOfVertex;\n    private int[][]\
    \ matrixOfVertex;\n    private int numOfVertices;\n    private Stack<Integer>\
    \ stack;\n\n    public Graph() {\n        arrayOfVertex = new Vertex[MAX_VERTEX];\n\
    \        mapOfVertex = new HashMap<>();\n        numOfVertices = 0;\n        matrixOfVertex\
    \ = new int[MAX_VERTEX][MAX_VERTEX];\n        stack = new Stack<>();\n       \
    \ for (int i = 0; i < MAX_VERTEX; i++) {\n            for (int j = 0; j < MAX_VERTEX;\
    \ j++) {\n                matrixOfVertex[i][j] = 0;\n            }\n        }\n\
    \    }\n\n    public void addVertex(Vertex city) {\n        mapOfVertex.put(city.getName(),\
    \ numOfVertices);\n        arrayOfVertex[numOfVertices++] = city;\n    }\n\n \
    \   public void addEdge(String city1, String city2) {\n        int start = mapOfVertex.get(city1);\n\
    \        int end = mapOfVertex.get(city2);\n        matrixOfVertex[start][end]\
    \ = 1;\n        matrixOfVertex[end][start] = 1;\n    }\n}\n```\n"
