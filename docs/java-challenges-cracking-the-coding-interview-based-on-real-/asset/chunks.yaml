  trans: "\n\n# 排序与搜索\n\n## 5.0 基础\n`搜索` 指在集合中查找符合某些特定准则的项。`排序` 指的是将集合中的所有项按升序或降序顺序进行重新排列。\n\
    \n## 5.1 冒泡排序\n`冒泡排序` 是一种排序算法。它使用一个未排序的数组，该数组中至少有两个相邻元素的顺序是错误的。该算法反复遍历数组，交换无序的元素，直到无法找到更多交换位置为止。\n\
    \n### 解决方案\n该算法使用一个 `Boolean` 变量来跟踪在最近一次遍历数组时是否发现了交换；只要该变量为 `True`，算法就会遍历 `Array`，寻找无序的相邻元素对并进行交换。在最坏情况下，其时间复杂度需要\
    \ `O(n2)` 次比较。列表 5.1 显示了该算法。\n\n### 列表 5.1 – 冒泡排序\n```java\npublic class Sorting\
    \ {\n\n    public int[] bubbleSort(int[] numbers) {\n        if (numbers == null)\n\
    \            return numbers;\n        boolean numbersSwapped;\n        do {\n\
    \            numbersSwapped = false;\n            for (int i = 0; i < numbers.length\
    \ - 1; i++) {\n                if (numbers[i] > numbers[i + 1]) {\n          \
    \          int aux = numbers[i + 1];\n                    numbers[i + 1] = numbers[i];\n\
    \                    numbers[i] = aux;\n                    numbersSwapped = true;\n\
    \                }\n            }\n        } while (numbersSwapped);\n       \
    \ return numbers;\n    }\n}\n```\n\n### 示例\n**第一次遍历：**\n- `{6, 4, 9, 5}` -> `{4,\
    \ 6, 9, 5}` 因为 `6 > 4` 发生交换\n- `{4, 6, 9, 5}` -> `{4, 6, 9, 5}`\n- `{4, 6, 9,\
    \ 5}` -> `{4, 6, 5, 9}` 因为 `9 > 5` 发生交换\n`numbersSwapped=true`\n\n**第二次遍历：**\n\
    - `{4, 6, 5, 9}` -> `{4, 6, 5, 9}`\n- `{4, 6, 5, 9}` -> `{4, 5, 6, 9}` 因为 `6 >\
    \ 5` 发生交换\n- `{4, 5, 6, 9}` -> `{4, 5, 6, 9}`\n`numbersSwapped=true`\n\n**第三次遍历：**\n\
    - `{4, 5, 6, 9}` -> `{4, 5, 6, 9}`\n- `{4, 5, 6, 9}` -> `{4, 5, 6, 9}`\n- `{4,\
    \ 5, 6, 9}` -> `{4, 5, 6, 9}`\n`numbersSwapped=false`\n\n### 冒泡排序的效率\n在最坏情况下，即数组是降序排列的，我们每次比较都需要进行交换。在我们的算法中，当我们比较相邻元素对以确定哪一个更大时，就会发生比较。\n\
    \n给定一个数组：`{9, 6, 5, 4}`：\n- 在第一次遍历中，我们需要进行三次比较 -> `{6, 5, 4, 9}`\n- 在第二次遍历中，我们只需要两次比较，因为我们不需要比较最后两个数字\
    \ -> `{5, 4, 6, 9}`\n- 在第三次遍历中，我们只进行了一次比较 -> `{4, 5, 6, 9}`\n\n总结：`3 + 2 + 1 =\
    \ 6` 次比较，或 `(N-1) + (N-2) + (N-3) … + 1` 次比较。\n此外，在这种情况下，我们每次比较都需要一次交换。因此，我们有六次比较和六次交换\
    \ = `12`，这大约是 `42`。随着项目数量 `N` 的增加，步数呈指数级增长，如下表所示。\n\n| N | 步骤数 | N2 |\n| :---\
    \ | :--- | :--- |\n| 4 | 12 | 16 |\n| 5 | 20 | 25 |\n| 10 | 90 | 100 |\n\n因此，在大\
    \ O 表示法中，我们可以说 `冒泡排序` 算法的效率是 `O(N2)`。\n\n### 测试\n```java\npublic class BubbleSortTest\
    \ {\n\n    private Sorting sorting;\n\n    @Before\n    public void Before() {\n\
    \        sorting = new Sorting();\n    }\n\n    @Test\n    public void sortingArrays()\
    \ {\n        final int[] numbers = {6, 4, 9, 5};\n        final int[] expected\
    \ = {4, 5, 6, 9};\n        int[] numbersSorted = sorting.bubbleSort(numbers);\n\
    \        assertArrayEquals(expected, numbersSorted);\n    }\n\n    @Test\n   \
    \ public void sortManyElementArray() {\n        final int[] array = {7, 9, 1,\
    \ 4, 9, 12, 4, 13, 9};\n        final int[] expected = {1, 4, 4, 7, 9, 9, 9, 12,\
    \ 13};\n        sorting.bubbleSort(array);\n        assertArrayEquals(expected,\
    \ array);\n    }\n}\n```\n\n## 5.2 插入排序\n`插入排序` 是一种排序算法，它通过逐个元素来构建最终的排序数组。这类似于我们整理手中扑克牌的方式。\n\
    \n### 解决方案\n遍历所有元素并从索引 `i=1` 开始。\n- 将当前元素 (`key`) 与其之前的所有元素进行比较。\n- 如果 `key` 元素小于其前驱元素，则交换它们。\n\
    - 将比 `key` 大的元素向其当前位置移动一位。\n该算法的运行时间为二次 `O(n2)`。列表 5.2 显示了该算法。\n\n### 列表 5.2 –\
    \ 插入排序\n```java\npublic class Sorting {\n\n    public int[] insertSort(int[] numbers)\
    \ {\n        if (numbers == null)\n            return numbers;\n        for (int\
    \ i=1; i<numbers.length; i++) {\n            int key = numbers[i];\n         \
    \   int j = i-1;\n            while (j>=0 && numbers[j]>key) {\n             \
    \   numbers[j+1] = numbers[j];\n                j = j-1;\n            }\n    \
    \        numbers[j+1] = key;\n        }\n        return numbers;\n    }\n}\n```\n\
    \n### 示例\n`numbers = {13, 12, 14, 6, 7}`\n- 当 `i = 1` 时：由于 `13` 大于 `12`，移动 `13`\
    \ 并 `12` 插入到 `13` 之前：`{12, 13, 14, 6, 7}`\n- 当 `i = 2` 时：`14` 将保持不变。\n- 当 `i =\
    \ 3` 时：`6` 将比它大的元素后移。\n- 当 `i = 4` 时：`7` 将比它大的元素后移。\n\n## 5.3 快速排序\n`快速排序` 是一种分治法算法。它选择一个元素作为基准（pivot），并将数组划分为两个部分，一个包含小于基准元素，另一个包含大于它的元素。\n\
    \n### 解决方案\n给定一个数组，我们执行以下步骤：\n1. 选择最后一个元素作为基准。\n2. 执行分区操作，将小于基准的元素放在前面，大于基准的放在后面。之后基准位于其最终位置。\n\
    3. 对每个子数组递归应用上述步骤。\n\n### 列表 5.3 – 快速排序\n```java\npublic class Sorting {\n   \
    \ public void quickSort(int[] numbers, int lo, int hi) {\n        if (lo < hi)\
    \ {\n            int partition_border = partition(numbers, lo, hi);\n        \
    \    //递归排序\n            quickSort(numbers, lo, partition_border - 1);\n     \
    \       quickSort(numbers, partition_border + 1, hi);\n        }\n    }\n\n  \
    \  private int partition(int[] numbers, int lo, int hi) {\n        //要放置在右位置元素\n\
    \        int pivot = numbers[hi];\n        int i = lo - 1; // 较小元素的索引\n      \
    \  for (int j = lo; j < hi; j++) {\n            //当元素小于基准时交换\n            if (numbers[j]\
    \ < pivot) {\n                i++;\n                int aux = numbers[i];\n  \
    \              numbers[i] = numbers[j];\n                numbers[j] = aux;\n \
    \           }\n        }\n        numbers[hi] = numbers[i + 1];\n        numbers[i\
    \ + 1] = pivot;\n        return i + 1;\n    }\n}\n```\n\n### 测试\n```java\npublic\
    \ class QuickSortTest {\n\n    private Sorting sorting;\n\n    @Before\n    public\
    \ void Before() {\n        sorting = new Sorting();\n    }\n\n    @Test\n    public\
    \ void test_quickSort() {\n        final int[] numbers = {13, 12, 14, 6, 7};\n\
    \        final int[] expected = {6, 7, 12, 13, 14};\n        sorting.quickSort(numbers,\
    \ 0, numbers.length - 1);\n        assertArrayEquals(expected, numbers);\n   \
    \ }\n\n    @Test\n    public void sortingArray() {\n        final int[] numbers\
    \ = {7, 9, 1, 4, 9, 12, 4, 13, -2, 9};\n        final int[] expected = {-2, 1,\
    \ 4, 4, 7, 9, 9, 9, 12, 13};\n        sorting.quickSort(numbers, 0, numbers.length\
    \ - 1);\n        assertArrayEquals(expected, numbers);\n    }\n}\n```\n\n"
