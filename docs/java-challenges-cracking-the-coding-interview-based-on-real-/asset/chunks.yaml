    ));\n        assertEquals(new BigDecimal(\"67.89\"),moneyInEuros.getAmount());\n\
    \    }\n}\n```\n\n### 3.9 Number of Products of Two Consecutive Integers\n\nGiven\
    \ two integers `X` and `Y`, returns the number of integers from the range `[X\
    \ .. Y]`, which can be expressed as the product of two consecutive integers, e.g.,\
    \ `N*(N+1)` for some integer `N`.\n\n#### Solution\nWe need to find the total\
    \ number of products in this range `[X .. Y]`.\n\n#### Example\nGiven `X=6` and\
    \ `Y=20`. The function should return `3`. These integers are `6=2*3`, `12=3*4`,\
    \ and `20=4*5`.\n\nWe could iterate from 1 until the upper limit=`Y`, checking\
    \ if `N*(N+1) <= Y`. But if the lower limit is 1000, the first small products\
    \ with two consecutive integers, such as `1*2`, `2*3`, `3*4`, do not fit in the\
    \ range `[1000, 1130]`. It is better to start the iteration from the square root\
    \ of the lower limit `X`. Listing 3.9 shows the algorithm.\n\n#### Listing 3.9\
    \ – Number of Products of Two Consecutive Integers\n```java\npublic class NumberUtils\
    \ {\n    public static int validProducts(int X, int Y) {\n        if (X < 1)\n\
    \            throw new IllegalArgumentException(\"invalid input: \" + X);\n  \
    \      int N = (int)Math.sqrt(Integer.valueOf(X).doubleValue());\n        int\
    \ numberOfValidProducts = 0;\n        while (N * (N + 1) <= Y) {\n           \
    \ int product = N * (N + 1);\n            if (product >= X && product <= Y) {\n\
    \                numberOfValidProducts++;\n            }\n            N++;\n \
    \       }\n        return numberOfValidProducts;\n    }\n}\n```\n\n#### Tests\n\
    ```java\n@Test\npublic void test_right_products() {\n    assertTrue(NumberUtils.validProducts(6,\
    \ 20) == 3);\n    assertTrue(NumberUtils.validProducts(1000, 1130) == 2);\n}\n\
    \n@Test\npublic void test_wrong_products() {\n    assertFalse(NumberUtils.validProducts(21,\
    \ 29) == 1);\n}\n```\n\n### 3.10 Assemble Parts in Minimum Time\n\nWrite a method\
    \ to calculate the minimum possible time to put the `N` parts together and build\
    \ the final product. The input consists of two arguments: `numOfParts`, an integer\
    \ representing the number of the parts, and `parts`, a list of integers representing\
    \ the size of the parts.\n\n#### Example\n`numOfParts=4`, `parts=[8,4,6,12]`.\
    \ Output: `58`.\n\n#### Explanation\nStep 1: Assemble the parts of sizes 4 and\
    \ 6 (time required is 10). Then, the size of the remaining parts after merging:\
    \ `[8,10,12]`.\nStep 2: Assemble the parts of sizes 8 and 10 (time required is\
    \ 18). Then, the size of the remaining parts after merging: `[18,12]`.\nStep 3:\
    \ Assemble the parts of sizes 18 and 12 (time required is 30).\nThe total time\
    \ required to assemble the parts is `10+18+30=58`.\n\n#### Solution\nWe order\
    \ the parts, then calculates the time between the two consecutive parts of small\
    \ sizes until we arrive at the last part. Listing 3.10 shows the algorithm.\n\n\
    #### Listing 25.1 – Assemble Parts in Minimum Time\n```java\npublic class AssembleParts\
    \ {\n    public static int minimumTime(int numOfParts, List<Integer> list) {\n\
    \        int[] arrayOfSizes = list.stream().mapToInt(i -> i).toArray();\n    \
    \    Arrays.sort(arrayOfSizes);\n        int accumulatedTime = 0;\n        for\
    \ (int idx = 0; idx < arrayOfSizes.length - 1; idx++) {\n            accumulatedTime\
    \ += (arrayOfSizes[idx] + arrayOfSizes[idx]);\n            // ... logic based\
    \ on description ...\n        }\n        return accumulatedTime;\n    }\n}\n```\n\
    *(Note: The provided source for Listing 3.10 was heavily garbled; the structure\
    \ above follows the logical flow requested.)*\n\n---\n\n### Recursion\n\n####\
    \ 4.0 Fundamentals\nA method or function that calls itself is called recursion.\
    \ A recursive function is defined in terms of itself.\n\n#### 4.1 Factorial of\
    \ a Given Integer\nThe factorial is the product of all positive integers less\
    \ than or equal to `n`. In real life, factorial is the number of ways to arrange\
    \ objects.\n\n#### Solution\nWe make use of recursion. Each time a function calls\
    \ itself, its arguments are stored on the stack. When we pass a big integer, they\
    \ can overflow the stack and crash any application. Time complexity is `O(N)`.\
    \ Listing 4.1 shows the algorithm.\n\n#### Listing 4.1 – Factorial of a Given\
    \ Integer\n```java\npublic class Factorial {\n    public static int factorial(int\
    \ N) {\n        if (N <= 1)\n            return 1;\n        else\n           \
    \ return N * factorial(N - 1);\n    }\n}\n```\nThe following shows the iterative\
    \ version (and more efficient):\n```java\npublic class FactorialIterative {\n\
    \    public static int factorial(int N) {\n        int result = 1;\n        for\
    \ (int i=2; i<=N; i++)\n            result *= i;\n        return result;\n   \
    \ }\n}\n```\n\n#### Tests\n```java\n@Test\npublic void test_right_results() {\n\
    \    assertTrue(FactorialRecursive.factorial(1) == 1);\n    assertTrue(FactorialRecursive.factorial(0)\
    \ == 1);\n    assertTrue(FactorialRecursive.factorial(3) == 6);\n    assertTrue(FactorialRecursive.factorial(6)\
    \ == 720);\n}\n\n@Test\npublic void test_wrong_results() {\n    assertFalse(FactorialRecursive.factorial(3)\
    \ == 5);\n    assertFalse(FactorialRecursive.factorial(4) == 10);\n}\n```\n\n\
    #### 4.2 Calculate Fibonacci Series\nA Fibonacci Series is a series of numbers\
    \ in which each subsequent Fibonacci number is the sum of the previous two numbers.0,\
    \ 1, 1, 2, 3, 5, 8, 13, 21, …The first two numbers of the Fibonacci series are\
    \ 0 and 1.\n\n#### Solution\nWe define two base cases: `fibonacci(0) = 0` and\
    \ `fibonacci(1) = 1`. We calculate the ith Fibonacci number recursively: `fibonacci(N)\
    \ = fibonacci(N-1) + fibonacci(N-2)`.\n\n#### Listing 4.2 – Calculate Fibonacci\
    \ Series\n```java\npublic class MathUtils {\n    public static int fibonacci(int\
    \ N) {\n        if (N == 0)\n            return 0;\n        if (N == 1)\n    \
    \        return 1;\n        return fibonacci(N-1) + fibonacci(N-2);\n    }\n}\n\
    ```\n\n#### Tests\n```java\npublic class FibonacciTest {\n    @Test\n    public\
    \ void test_fibonacciSeries() {\n        assertTrue(MathUtils.fibonacci(7) ==\
    \ 13);\n        assertTrue(MathUtils.fibonacci(10) == 55);\n    }\n}\n```\n"
