  trans: "\n\n```java\npublic String getCurrency() {\n    return currency;\n}\n```\n\
    \n`String` 类产生的是不可变对象，因此我们可以信任任何传递其作为参数的客户端。但 `BigDecimal` 并非如此，它可能会被某些不可信的客户端进行扩展和操作，例如扩展它的\
    \ `toString()` 方法。为了保护我们的类免受不可信客户端的侵害，我们可以创建这些参数的副本。以下代码显示修改后的 `multiply` 方法。//货币转换器，更安全\n\
    \n```java\npublic Money multiplysecure(BigDecimal factor) {\n    if (factor.getClass()\
    \ == BigDecimal.class)\n        factor = new BigDecimal(factor.toString());\n\
    \    else {\n        //TODO 抛出异常?\n    }\n    return Money.valueOf(\n        rounded(this.amount.multiply(factor)),\n\
    \        this.currency.equals(DOLAR) ? EURO : DOLAR);\n}\n```\n\n测试：\n```java\n\
    public class MoneyTest {\n    @Test\n    public void convert_EURO_to_DOLLAR()\
    \ {\n        final Money moneyInEuros = Money.valueOf(new BigDecimal(\"67.89\"\
    ), \"EUR\");\n        final Money moneyInDollar = moneyInEuros.multiply(new BigDecimal(\"\
    1.454706142288997\"));\n        assertEquals(new BigDecimal(\"98.76\"),moneyInDollar.getAmount());\n\
    \    }\n\n    @Test\n    public void convert_DOLLAR_to_EURO() {\n        final\
    \ Money moneyInDollar = Money.valueOf(new BigDecimal(\"98.76\"), \"USD\");\n \
    \       final Money moneyInEuros = moneyInDollar.multiply(new BigDecimal(\"0.6874240583232078\"\
    ));\n        assertEquals(new BigDecimal(\"67.89\"),moneyInEuros.getAmount());\n\
    \    }\n}\n```\n\n### 3.9 两个连续整数的积\n\n给定两个整数 `X` 和 `Y`，返回范围 `[X .. Y]` 中可以表示为两个连续整数之积的整数，例如对于某个整数\
    \ `N` 的 `N*(N+1)`。\n\n#### 解决方案\n我们需要找到该范围 `[X .. Y]` 内积的总数。\n\n#### 示例\n给定 `X=6`\
    \ 和 `Y=20`。函数应返回 `3`。这些整数是 `6=2*3`，`12=3*4` 和 `20=4*5`。\n\n我们可以从 1 迭代到上限=`Y`，检查\
    \ `N*(N+1) <= Y`。但如果下限是 1000，那么前几个两个连续整数的小积（例如 `1*2`、`2*3`、`3*4`）并不符合范围 `[1000,\
    \ 1130]`。从下限 `X` 的平方根开始迭代更好。列表 3.9 显示了该算法。\n\n#### 列表 3.9 – 两个连续整数的积\n```java\n\
    public class NumberUtils {\n    public static int validProducts(int X, int Y)\
    \ {\n        if (X < 1)\n            throw new IllegalArgumentException(\"invalid\
    \ input: \" + X);\n        int N = (int)Math.sqrt(Integer.valueOf(X).doubleValue());\n\
    \        int numberOfValidProducts = 0;\n        while (N * (N + 1) <= Y) {\n\
    \            int product = N * (N + 1);\n            if (product >= X && product\
    \ <= Y) {\n                numberOfValidProducts++;\n            }\n         \
    \   N++;\n        }\n        return numberOfValidProducts;\n    }\n}\n```\n\n\
    #### 测试\n```java\n@Test\npublic void test_right_products() {\n    assertTrue(NumberUtils.validProducts(6,\
    \ 20) == 3);\n    assertTrue(NumberUtils.validProducts(1000, 1130) == 2);\n}\n\
    \n@Test\npublic void test_wrong_products() {\n    assertFalse(NumberUtils.validProducts(21,\
    \ 29) == 1);\n}\n```\n\n### 3.10 以最短时间组装零件\n\n编写一个方法来计算将 `N` 个零件组合并构建最终产品的最小可能时间。输入包含两个参数：`numOfParts`（表示零件数量的整数）和\
    \ `parts`（一个表示零件大小的整数列表）。\n\n#### 示例\n`numOfParts=4`，`parts=[8,4,6,12]`。输出：`58`。\n\
    \n#### 解释\n步骤 1：组装大小为 4 和 6 的零件（所需时间为 10）。合并后剩余零件的大小为：`[8,10,12]`。\n步骤 2：组装大小为\
    \ 8 和 10 的零件（所需时间为 18）。合并后剩余零件的大小为：`[18,12]`。\n步骤 3：组装大小为 18 和 12 的零件（所需时间为 30）。\n\
    组装零件的总时间为 `10+18+30=58`。\n\n#### 解决方案\n我们对零件进行排序，然后计算两个连续小零件之间的时间，直到到达最后一个零件。列表\
    \ 3.10 显示了该算法。\n\n#### 列表 25.1 – 以最短时间组装零件\n```java\npublic class AssembleParts\
    \ {\n    public static int minimumTime(int numOfParts, List<Integer> list) {\n\
    \        int[] arrayOfSizes = list.stream().mapToInt(i -> i).toArray();\n    \
    \    Arrays.sort(arrayOfSizes);\n        int accumulatedTime = 0;\n        for\
    \ (int idx = 0; idx < arrayOfSizes.length - 1; idx++) {\n            accumulatedTime\
    \ += (arrayOfSizes[idx] + arrayOfSizes[idx]);\n            // ... 基于描述的逻辑 ...\n\
    \        }\n        return accumulatedTime;\n    }\n}\n```\n（注：列表 3.10 提供的源码严重混乱；上述结构遵循了请求的逻辑流。）\n\
    \n---\n\n### 递归\n\n#### 4.0 基础\n一个调用自身的方法或函数被称为递归。递归函数是根据自身定义的。\n\n#### 4.1 给定整数的阶乘\n\
    阶乘是所有小于或等于 `n` 的正整数的乘积。在生活中，阶乘是排列对象的方法数。\n\n#### 解决方案\n我们利用递归。每当函数调用自身时，其参数都会存储在栈上。当我们传递一个大整数时，它们可能会溢出栈并导致应用程序崩溃。时间复杂度为\
    \ `O(N)`。列表 4.1 显示了该算法。\n\n#### 列表 4.1 – 给定整数的阶乘\n```java\npublic class Factorial\
    \ {\n    public static int factorial(int N) {\n        if (N <= 1)\n         \
    \   return 1;\n        else\n            return N * factorial(N - 1);\n    }\n\
    }\n```\n以下显示了迭代版本（更高效）：\n```java\npublic class FactorialIterative {\n    public\
    \ static int factorial(int N) {\n        int result = 1;\n        for (int i=2;\
    \ i<=N; i++)\n            result *= i;\n        return result;\n    }\n}\n```\n\
    \n#### 测试\n```java\n@Test\npublic void test_right_results() {\n    assertTrue(FactorialRecursive.factorial(1)\
    \ == 1);\n    assertTrue(FactorialRecursive.factorial(0) == 1);\n    assertTrue(FactorialRecursive.factorial(3)\
    \ == 6);\n    assertTrue(FactorialRecursive.factorial(6) == 720);\n}\n\n@Test\n\
    public void test_wrong_results() {\n    assertFalse(FactorialRecursive.factorial(3)\
    \ == 5);\n    assertFalse(FactorialRecursive.factorial(4) == 10);\n}\n```\n\n\
    #### 4.2 计算斐波纳契数列\n斐波纳契数列是一个序列，其中每个后续斐波纳契数都是前两个数字的和。0, 1, 1, 2, 3, 5, 8, 13, 21,\
    \ …斐波纳契数列的前两个数字是 0 和 1。\n\n#### 解决方案\n我们定义两个基础情况：`fibonacci(0) = 0` 和 `fibonacci(1)\
    \ = 1`。我们递归地计算第 个斐波纳契数：`fibonacci(N) = fibonacci(N-1) + fibonacci(N-2)`。\n\n####\
    \ 列表 4.2 – 计算斐波纳契数列\n```java\npublic class MathUtils {\n    public static int\
    \ fibonacci(int N) {\n        if (N == 0)\n            return 0;\n        if (N\
    \ == 1)\n            return 1;\n        return fibonacci(N-1) + fibonacci(N-2);\n\
    \    }\n}\n```\n\n#### 测试\n```java\npublic class FibonacciTest {\n    @Test\n\
    \    public void test_fibonacciSeries() {\n        assertTrue(MathUtils.fibonacci(7)\
    \ == 13);\n        assertTrue(MathUtils.fibonacci(10) == 55);\n    }\n}\n```\n"
- fmt: "\n# Sorting and Searching\n\n## 5.0 Fundamentals\n`Searching` refers to finding\
    \ an item in a collection that meets some specified criterion. `Sorting` refers\
    \ to rearranging all the items in a collection into increasing or decreasing order.\n\
    \n## 5.1 Bubble Sort\n`Bubble Sort` is a sorting algorithm. It uses a not sorted\
    \ array, which contains at least two adjacent elements out of order. The algorithm\
    \ repeatedly passes through the array, swapping elements out of order, and continues\
    \ until it cannot find any more swaps.\n\n### Solution\nThe algorithm uses a `Boolean`\
    \ variable to track whether it has found a swap in its most recent pass through\
    \ the array; as long as the variable is `True`, the algorithm loops through the\
    \ `Array`, looking for adjacent pairs of elements that are out of order and swap\
    \ them. The time complexity, in the worst case it requires `O(n2)` comparisons.\
    \ Listing 5.1 shows the algorithm.\n\n### Listing 5.1 – Bubble Sort\n```java\n\
    public class Sorting {\n\n    public int[] bubbleSort(int[] numbers) {\n     \
    \   if (numbers == null)\n            return numbers;\n        boolean numbersSwapped;\n\
    \        do {\n            numbersSwapped = false;\n            for (int i = 0;\
    \ i < numbers.length - 1; i++) {\n                if (numbers[i] > numbers[i +\
    \ 1]) {\n                    int aux = numbers[i + 1];\n                    numbers[i\
    \ + 1] = numbers[i];\n                    numbers[i] = aux;\n                \
    \    numbersSwapped = true;\n                }\n            }\n        } while\
    \ (numbersSwapped);\n        return numbers;\n    }\n}\n```\n\n### Example\n**First\
    \ pass-through:**\n- `{6, 4, 9, 5}` -> `{4, 6, 9, 5}` swap because of `6 > 4`\n\
    - `{4, 6, 9, 5}` -> `{4, 6, 9, 5}`\n- `{4, 6, 9, 5}` -> `{4, 6, 5, 9}` swap because\
    \ of `9 > 5`\n`numbersSwapped=true`\n\n**Second pass-through:**\n- `{4, 6, 5,\
    \ 9}` -> `{4, 6, 5, 9}`\n- `{4, 6, 5, 9}` -> `{4, 5, 6, 9}` swap because of `6\
    \ > 5`\n- `{4, 5, 6, 9}` -> `{4, 5, 6, 9}`\n`numbersSwapped=true`\n\n**Third pass-through:**\n\
    - `{4, 5, 6, 9}` -> `{4, 5, 6, 9}`\n- `{4, 5, 6, 9}` -> `{4, 5, 6, 9}`\n- `{4,\
    \ 5, 6, 9}` -> `{4, 5, 6, 9}`\n`numbersSwapped=false`\n\n### Efficiency of bubble\
    \ sort\nIn a worst-case scenario, where the array comes in descending order, we\
    \ need a swap for each comparison. In our algorithm, a comparison happens when\
    \ we compare adjacent pairs of elements to determine which one is greater.\n\n\
    Given an array: `{9, 6, 5, 4}`:\n- In the first pass through, we have to make\
    \ three comparisons -> `{6, 5, 4, 9}`\n- In our second passthrough, we have to\
    \ make only two comparisons because we didn’t need to compare the final two numbers\
    \ -> `{5, 4, 6, 9}`\n- In our third pass through, we made just one comparison\
    \ -> `{4, 5, 6, 9}`\n\nIn summarize: `3 + 2 + 1 = 6` comparisons, or `(N-1) +\
    \ (N-2) + (N-3) … + 1` comparisons.\nMoreover, in this scenario, we need a swap\
    \ for each comparison. Therefore, we have six comparisons and six swaps = `12`,\
    \ which is approximately `42`. As the number of items `N` increases, the number\
    \ of steps exponentially grows, as shown in the following table.\n\n| N | # steps\
    \ | N2 |\n| :--- | :--- | :--- |\n| 4 | 12 | 16 |\n| 5 | 20 | 25 |\n| 10 | 90\
    \ | 100 |\n\nTherefore, in Big O Notation, we could say that the `Bubble Sort`\
    \ algorithm has `O(N2)` efficiency.\n\n### Tests\n```java\npublic class BubbleSortTest\
    \ {\n\n    private Sorting sorting;\n\n    @Before\n    public void Before() {\n\
    \        sorting = new Sorting();\n    }\n\n    @Test\n    public void sortingArrays()\
    \ {\n        final int[] numbers = {6, 4, 9, 5};\n        final int[] expected\
    \ = {4, 5, 6, 9};\n        int[] numbersSorted = sorting.bubbleSort(numbers);\n\
    \        assertArrayEquals(expected, numbersSorted);\n    }\n\n    @Test\n   \
    \ public void sortManyElementArray() {\n        final int[] array = {7, 9, 1,\
    \ 4, 9, 12, 4, 13, 9};\n        final int[] expected = {1, 4, 4, 7, 9, 9, 9, 12,\
    \ 13};\n        sorting.bubbleSort(array);\n        assertArrayEquals(expected,\
    \ array);\n    }\n}\n```\n\n## 5.2 Insertion Sort\n`Insertion sort` is a sorting\
    \ algorithm that builds the final sorted array one element at a time. It's similar\
    \ to the way we sort playing cards in our hands.\n\n### Solution\nIterates over\
    \ all the elements and start at index `i=1`.\n- Compare the current element (`key`)\
    \ with all its preceding elements.\n- If the `key` element is smaller than its\
    \ predecessors, swap them.\n- Move elements that are greater than the `key`, one\
    \ position ahead of their current position.\nThis algorithm takes a quadratic\
    \ running time `O(n2)`. Listing 5.2 shows the algorithm.\n\n### Listing 5.2 –\
    \ Insertion Sort\n```java\npublic class Sorting {\n\n    public int[] insertSort(int[]\
    \ numbers) {\n        if (numbers == null)\n            return numbers;\n    \
    \    for (int i=1; i<numbers.length; i++) {\n            int key = numbers[i];\n\
    \            int j = i-1;\n            while (j>=0 && numbers[j]>key) {\n    \
    \            numbers[j+1] = numbers[j];\n                j = j-1;\n          \
    \  }\n            numbers[j+1] = key;\n        }\n        return numbers;\n  \
    \  }\n}\n```\n\n### Example\n`numbers = {13, 12, 14, 6, 7}`\n- When `i = 1`: Since\
    \ `13` is greater than `12`, move `13` and insert `12` before `13`: `{12, 13,\
    \ 14, 6, 7}`\n- When `i = 2`: `14` will remain at its position as all previous\
    \ elements are smaller than `14`: `{12, 13, 14, 6, 7}`\n- When `i = 3`: `6` will\
    \ move to the beginning, and elements from `12` to `14` move one position ahead\
    \ of their current position: `{6, 12, 13, 14, 7}`\n- When `i = 4`: `7` will move\
    \ to the position after `6`, and elements from `12` to `14` move one position\
    \ ahead of their current position: `{6, 7, 12, 13, 14}`\n\n### Tests\n```java\n\
    public class InsertSortTest {\n\n    private Sorting sorting;\n\n    @Before\n\
    \    public void Before() {\n        sorting = new Sorting();\n    }\n\n    @Test\n\
    \    public void insertionSort() {\n        final int[] numbers = {13, 12, 14,\
    \ 6, 7};\n        final int[] expected = {6, 7, 12, 13, 14};\n        sorting.insertSort(numbers);\n\
    \        assertArrayEquals(expected, numbers);\n    }\n\n    @Test\n    public\
    \ void sortingArray() {\n        final int[] numbers = {7, 9, 1, 4, 9, 12, 4,\
    \ 13, 9};\n        final int[] expected = {1, 4, 4, 7, 9, 9, 9, 12, 13};\n   \
    \     sorting.insertSort(numbers);\n        assertArrayEquals(expected, numbers);\n\
    \    }\n}\n```\n\n## 5.3 Quick Sort\n`QuickSort` is a divide and conquer algorithm.\
    \ Given an array, it picks an element as pivot and partitions the array around\
    \ it.\n\n### Solution\nGiven an array, we execute the following steps:\n1. We\
    \ pick the last element as pivot.\n2. We execute a partition operation where we\
    \ put smaller elements before the pivot and greater elements after. After this,\
    \ the pivot is in its final position.\n3. Apply the above steps recursively to\
    \ every sub-array.\n\n### Listing 5.3 – Quick Sort\n```java\npublic class Sorting\
    \ {\n    public void quickSort(int[] numbers, int lo, int hi) {\n        if (lo\
    \ < hi) {\n            int partition_border = partition(numbers, lo, hi);\n  \
    \          //sort recursively\n            quickSort(numbers, lo, partition_border\
    \ - 1);\n            quickSort(numbers, partition_border + 1, hi);\n        }\n\
    \    }\n\n    private int partition(int[] numbers, int lo, int hi) {\n       \
    \ //element to be placed at right position\n        int pivot = numbers[hi];\n\
    \        int i = lo - 1; //index of smaller element\n        for (int j = lo;\
    \ j < hi; j++) {\n            //swap when element smaller than pivot\n       \
    \     if (numbers[j] < pivot) {\n                i++;\n                int aux\
    \ = numbers[i];\n                numbers[i] = numbers[j];\n                numbers[j]\
    \ = aux;\n            }\n        }\n        numbers[hi] = numbers[i + 1];\n  \
    \      numbers[i + 1] = pivot;\n        return i + 1;\n    }\n}\n```\n\n### Tests\n\
    ```java\npublic class QuickSortTest {\n\n    private Sorting sorting;\n\n    @Before\n\
    \    public void Before() {\n        sorting = new Sorting();\n    }\n\n    @Test\n\
    \    public void test_quickSort() {\n        final int[] numbers = {13, 12, 14,\
    \ 6, 7};\n        final int[] expected = {6, 7, 12, 13, 14};\n        sorting.quickSort(numbers,\
    \ 0, numbers.length - 1);\n        assertArrayEquals(expected, numbers);\n   \
    \ }\n\n    @Test\n    public void sortingArray() {\n        final int[] numbers\
    \ = {7, 9, 1, 4, 9, 12, 4, 13, -2, 9};\n        final int[] expected = {-2, 1,\
    \ 4, 4, 7, 9, 9, 9, 12, 13};\n        sorting.quickSort(numbers, 0, numbers.length\
    \ - 1);\n        assertArrayEquals(expected, numbers);\n    }\n}\n```\n"
