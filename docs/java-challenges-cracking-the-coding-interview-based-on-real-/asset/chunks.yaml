    \n# Coding Challenges\n\n## 10.0 Fundamentals\n\nThere are two ways to receive\
    \ a coding challenge from a recruiter. First, you receive a description of the\
    \ coding challenge via email that you need to solve at home. Second, you need\
    \ to solve the coding challenge in front of other developers at the recruiter's\
    \ office. For both ways, keep in mind a few things for making a good impression\
    \ on the recruitment process:\n\n- Host your final code on a website like `GitHub`\
    \ with a clear `README` file and clear commit messages.\n- Include test cases\
    \ for your code. It shows that you care about maintainability.\n- Build a clean\
    \ code structure. Your code must be readable.\n- Apply `SOLID` principles, which\
    \ tell you how to arrange your functions into classes and how those classes should\
    \ be interrelated.\n- Think about possible improvements – not included in the\
    \ challenge specification – because these will be the open questions from recruiters\
    \ when you change your code in front of them.\n\n## 10.1 Optimize Online Purchases\n\
    \nGiven a budget `B` and a 2-D array, which includes `[product-id][price][value]`,\
    \ write an algorithm to optimize a basket with the most valuable products whose\
    \ costs are less or equal than `B`.\n\n### Solution\n\nImagine that we have a\
    \ budget of 4 US$ and we want to buy the most valuable snacks from table 1.1.1.\n\
    \n![](image_rsrc2M3.jpg)\nTable 1.1.1 List of snacks\n\nBut who decides if a product\
    \ is more valuable than another one? Well, this depends on every business. It\
    \ could be an estimation based on quantitative or qualitative analysis. We choose\
    \ a quantitative approach for this solution based on which product gives us more\
    \ grams per dollar invested.\n\nWe use the `Red-Green Refactor` technique to implement\
    \ our algorithm, which is the basis of test-drive-development (`TDD`). In every\
    \ assumption, we will write a test and see if it fails. Then, we write the code\
    \ that implements only that test and sees if it succeeded, then we can refactor\
    \ the code to make it better. Then we continue with another assumption and repeat\
    \ the previous steps until the algorithm is successfully implemented for all tests.\n\
    \nTo generalize the concept of \"the most valuable product,\" we assign a value\
    \ to every product. Our algorithm receives two parameters: an array 2-D, which\
    \ includes `[product-id][price][value]`, and the budget.\n\n### Assumption #1\
    \ - Given an array of products ordered by value, return the most valuable products\n\
    \nWe start defining a `java` test creating a new `BasketOptimized` class.\n\n\
    Listing 1.1.1 – BaskedOptimized Test Case\n```java\npublic class BasketOptimizedTest\
    \ {\n\n  BasketOptimized basketOptimized;\n\n  @Before\n  public void setup()\
    \ {\n    basketOptimized = new BasketOptimized();\n  }\n\n  @Test\n  public void\
    \ productsOrderedByValue () {\n    double[][] myProducts = new double[][] {\n\
    \          {1, 0.98, 230},\n          {2, 0.98, 230},\n          {3, 0.48, 75},\n\
    \          {4, 1.29, 55},\n          {5, 1.29, 47},\n          {6, 4.86, 14},\n\
    \          {7, 1.69, 12},\n    };\n    double[][] mostValueableProducts =\n  \
    \        basketOptimized.fill(myProducts, 4);\n\n    assertEquals(590d,\n    \
    \      Arrays.stream(mostValueableProducts).\n              mapToDouble(arr ->\
    \ arr[2]).sum(),0);\n  }\n}\n```\n\nThe first time, it should fail because the\
    \ `fill` method doesn't exist. Then we need to create an easy implementation to\
    \ pass the test: the sum of the values must be equal to 590 because this represents\
