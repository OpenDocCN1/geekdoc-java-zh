    \ to traverse a graph data structure.\n\n### Solution\nIn the breadth-first search,\
    \ the algorithm stays as close as possible to the starting point. It visits all\
    \ the vertices adjacent to the starting vertex. The algorithm is implemented using\
    \ a `queue`.\n\nFigure 9.2.1 shows a sequence of steps if we choose `Berlin` as\
    \ the root node. The numbers indicate the order in which the vertices are visited.\n\
    \n![](image_rsrc2M2.jpg)\nFigure 9.2.1 Breadth-First Search - the sequence of\
    \ steps\n\nThe breath-first search algorithm first finds all the vertices that\
    \ are one edge away from the starting vertex, then all the vertices that are two\
    \ edges away, three edges away, and so on. It is useful to answer questions like\
    \ what is the shortest path from `Berlin` to another city like `München`?\n\n\
    We traverse cities that are one edge away from `Berlin` (first level): `Rostock`,\
    \ `Magdeburg`, and `Leipzig`. Then we traverse cities that are two edges away\
    \ from `Berlin` (second level): `Hannover`, `Nürnberg`, and `Dresden`. Then we\
    \ traverse cities that are three edges away from `Berlin` (third level): `Bremen`,\
    \ `Dortmund`, and `München`. That's the idea. We already found `München` before\
    \ traversing another possible path: `Berlin`, `Magdeburg`, `Hannover`, `Dortmund`,\
    \ `Frankfurt`, `Stuttgart`, `München`, which corresponds to the sixth level.\n\
    \n### Adding an edge\nWe use a `LinkedList` data structure to build our `Adjacency\
    \ List`. Two cities are adjacent or neighbors when a single edge connects them.\
    \ Listing 9.2.1 shows the `addEdge` method.\n\nListing 9.2.1 - LinkedList, addEdge\
    \ method\n```java\nprivate LinkedList<Integer> adjList[];\npublic void addEdge(String\
    \ city1, String city2) {\n  int start = mapOfVertex.get(city1);\n  int end = mapOfVertex.get(city2);\n\
    \  adjList[start].add(end);\n  adjList[end].add(start);\n}\n```\n\n### The algorithm\n\
    Our `bfs()` method receives the `City` name as its argument. Then we locate the\
    \ index of this city in our `HashMap`, and it is marked as visited, and add it\
    \ onto the `queue`.\n\nWe iterate the queue items until it is empty. And this\
    \ is what we do in every iteration:\n1. We retrieve and remove the `head` of this\
    \ `queue`.\n2. We iterate through all `neighbors` of this `head` until they were\
    \ visited. Every adjacent vertex is marked as visited and added to the `queue`.\n\
    3. When the iteration cannot find more adjacent vertices, we retrieve and remove\
    \ the new `head`.\n\nListing 9.2 – Breadth-first search\n```java\nimport java.util.*;\n\
    import java.util.concurrent.ConcurrentHashMap;\n\npublic class Graph {\n    private\
    \ final int MAX_VERTEX;\n    private Vertex[] arrayOfVertex; // cities\n    private\
    \ Map<String, Integer> mapOfVertex; // Adjacency list:\n    private LinkedList<Integer>[]\
    \ adjList[]; // register the location at arrayOfVertex:\n    private int numOfVertices;\n\
    \    private Queue<Integer> queue;\n\n    public Graph(int vertices) {\n     \
    \   MAX_VERTEX = vertices;\n        arrayOfVertex = new Vertex[MAX_VERTEX];\n\
    \        mapOfVertex = new ConcurrentHashMap<>();\n        numOfVertices = 0;\n\
    \        queue = new LinkedList<>();\n        adjList = new LinkedList[MAX_VERTEX];\n\
    \        for (int i = 0; i < MAX_VERTEX; i++) {\n            adjList[i] = new\
    \ LinkedList();\n        }\n    }\n\n    public void addVertex(Vertex city) {\n\
    \        mapOfVertex.put(city.getName(), numOfVertices);\n        arrayOfVertex[numOfVertices++]\
    \ = city;\n    }\n\n    public void addEdge(String city1, String city2) {\n  \
    \      int start = mapOfVertex.get(city1);\n        int end = mapOfVertex.get(city2);\n\
    \        adjList[start].add(end);\n        adjList[end].add(start);\n    }\n\n\
    \    public void bfs(String city) {\n        int vertex = mapOfVertex.get(city);\n\
    \        arrayOfVertex[vertex].setVisited(true);\n        System.out.print(city\
    \ + \" \");\n        queue.add(vertex);\n\n        // iterate until queue empty\n\
    \        while (!queue.isEmpty()) {\n            int head = queue.remove();\n\
    \            int adjVertex;\n            // iterate until it has unvisited cities\n\
    \            while ((adjVertex = getAdjVertex(head)) != -1) {\n              \
    \  arrayOfVertex[adjVertex].setVisited(true);\n                System.out.print(arrayOfVertex[adjVertex].getName()\
    \ + \" \");\n                queue.add(adjVertex);\n            }\n        }\n\
    \    }\n\n    private int getAdjVertex(int vertex) {\n        LinkedList<Integer>\
    \ linkedList = adjList[vertex];\n        for (int adj = 0; adj < linkedList.size();\
    \ adj++) {\n            if (arrayOfVertex[linkedList.get(adj)].isVisited() ==\
    \ false) {\n                return linkedList.get(adj); //return first adjacent\
    \ vertex\n            }\n        }\n        return -1; //not vertices found\n\
    \    }\n\n    public Map<String, Integer> getMapOfVertex() {\n        return mapOfVertex;\n\
    \    }\n\n    public LinkedList<Integer>[] getAdjList() {\n        return adjList;\n\
    \    }\n}\n```\n\n```java\nclass GraphTest {\n    Graph graph;\n\n    @Before\n\
    \    public void setup() {\n        graph = new Graph(15);\n    }\n\n    @Test\n\
    \    public void test_addVertex() {\n        Vertex city = new Vertex(\"Berlin\"\
    );\n        graph.addVertex(city);\n        assertTrue(graph.getMapOfVertex().size()\
    \ == 1);\n    }\n\n    @Test\n    public void test_addEdge() {\n        String\
