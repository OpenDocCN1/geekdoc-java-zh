    }\n```\n\n# Math and Logic Puzzles\n\n## 3.0 Fundamentals\nPuzzles are usually\
    \ asked to see how you go about solving a tricky problem. You should know basic\
    \ math concepts to excel in coding interviews.\n\n### 3.1 Sum of All Even Numbers\
    \ from 1 to a Given Integer\nGiven an Integer `N`, calculates the sum of all even\
    \ numbers from 1 to `N`.\n\n#### Solution\nIt looks like an easy program, but\
    \ believe me, most experienced programmers during the interview forget to use\
    \ the operator ```, which returns the division remainder. If it is `0`, the number\
    \ is even; otherwise, it is odd. Listing 3.1 shows the algorithm.\n\n#### Listing\
    \ 3.1 – Sum of All Even Numbers from 1 to N\n```java\npublic class NumberUtils\
    \ {\n  public static int sumOfEvenNumbers(int N) {\n    int sum = 0;\n    for\
    \ (int number = 1; number <= N; number++)\n      if ((number % 2) == 0)\n    \
    \    sum = sum + number;\n    return sum;\n  }\n}\n```\nOur code runs properly,\
    \ but as Software Engineers, we need to care about code quality. In concrete:\
    \ code efficiency. The following algorithm runs faster than the previous one because\
    \ it only loops the `N/2` times.\n\n```java\npublic static int sumOfEvenNumbers(int\
    \ N) {\n  int sum = 0;\n  int number = 2;\n  while (number <= N) {\n    sum +=\
    \ number;\n    //increase number by 2, which in definition\n    //is the next\
    \ even number\n    number+=2;\n  }\n  return sum;\n}\n```\n\n#### Tests\n```java\n\
    public class SumOfEvenNumbersTest {\n  @Test\n  public void sumOfEvenNumbers_test()\
    \ {\n    assertEquals(42, NumberUtils.sumOfEvenNumbers(12));\n    assertEquals(110,\
    \ NumberUtils.sumOfEvenNumbers(21));\n  }\n}\n```\n\n### 3.2 Validate a Leap Year\n\
    A leap year is a calendar year containing an additional day. This extra day occurs\
    \ in February. The following rules define a leap year:\n- A year will be a leap\
    \ year if it is divisible by 4, but not by 100\n- or a year will be a leap if\
    \ it is divisible by 400.\n\n#### Solution\nWe use the `%` operator to verify\
    \ if a year is divisible by 4, 100, or 400. Listing 3.2 shows the algorithm.\n\
    \n#### Listing 3.2 – Validate a Leap Year\n```java\npublic class DateUtils {\n\
    \  public static boolean isLeapYear(int year){\n    return (year % 400 == 0) ||\n\
    \             (year % 4 == 0 && year % 100 != 0);\n  }\n}\n```\nThis algorithm\
    \ had a real application in the Y2K problem, where COBOL programs in a Bank used\
    \ to store four-digit years with only the final two digits, so you could not distinguish\
    \ 2000 from 1900. In addition to calculating a leap year:\n- For years represented\
    \ from 50 until 99, add 19 at begin, resulting in 1950 until 1999.\n- For years\
    \ represented from 00 until 49, add 20 at begin, resulting in 2000 until 2049.\n\
    The Bank assumed that before 2049 all systems would be migrated to modern programming\
    \ languages (digital transformation), but that is another story.\n\n#### Tests\n\
    ```java\npublic class IsLeapYearTest {\n  @Test\n  public void isLeapYear() {\n\
    \    assertTrue(DateUtils.isLeapYear(400));\n    assertTrue(DateUtils.isLeapYear(2000));\n\
    \    assertTrue(DateUtils.isLeapYear(2020));\n  }\n  @Test\n  public void is_notLeapYear()\
    \ {\n    assertFalse(DateUtils.isLeapYear(401));\n    assertFalse(DateUtils.isLeapYear(2018));\n\
    \  }\n}\n```\n\n### 3.3 Given an Integer N, Returns the Smallest Number of Digits\n\
    Write a method that, given an original number `N` of `d` digits, returns the smallest\
    \ number with the same number of digits. For example, given `N=4751`, the method\
    \ should return `1000`. Given `N=1`, the method should return `0`.\n\n#### Solution\n\
    Maybe the first idea that comes to our minds could be to iterate from the given\
    \ number and decrease one by one, and in every iteration to check if every new\
    \ number contains one digit less than the previous number. If the answer is True,\
    \ then the previous one is the smallest number with the same number of digits\
    \ as the original number. Listing 3.3 shows the first algorithm.\n\n#### Listing\
    \ 3.3 – Given an Integer N, Returns the Smallest Number of Digits\n```java\npublic\
    \ class NumberUtils {\n  public static int smallest(int N) {\n    int smallestNumber\
    \ = 0;\n    if (N <= 1)\n      return smallestNumber;\n    int numberOfDigitsOriginalN\
    \ = String.valueOf(N).length();\n    while (N > 0) {\n      N--;\n      if (String.valueOf(N).length()\
    \ ==\n          (numberOfDigitsOriginalN -1)) {\n        return ++N;\n      }\n\
    \    }\n    return smallestNumber;\n  }\n}\n```\nBut If we realize, the solution\
    \ follows a particular pattern:\n- `N = 4751` -> smallest number = `1000`\n- `N\
    \ = 189` -> smallest number = `100`\n- `N = 37` -> smallest number = `10`\nThe\
    \ smallest number is a power of 10, where the exponent is digits minus 1.\n\n\
    #### Second solution\n```java\npublic class NumberUtils {\n  public static int\
    \ smallest(int N) {\n    int smallestNumber = 0;\n    if (N <= 1 || String.valueOf(N).length()\
    \ == 1) {\n      return smallestNumber;\n    }\n    int numberOfDigits = String.valueOf(N).length();\n\
    \    return (int) Math.pow(10, numberOfDigits - 1);\n  }\n}\n```\n\n#### Final\
    \ solution, which includes negative numbers\n```java\npublic static int smallest(int\
    \ N) {\n  if (N >= 0) {\n    if (String.valueOf(N).length() == 1) {\n      return\
    \ 0;\n    } else {\n      return (int) Math.pow(10, String.valueOf(N).length()\
    \ - 1);\n    }\n  } else\n  return -(int) Math.pow(10, String.valueOf(Math.abs(N)).length()\
    \ - 1);\n}\n```\nThe main idea in Analysis of Algorithms is always to improve\
    \ the algorithm by reducing the number of steps. The simpler and more intuitive\
    \ an algorithm is, the more useful it will be.\n\n#### Tests\n```java\npublic\
    \ class SmallestNumberTest {\n  @Test\n  public void test_right_values() {\n \
    \   assertTrue(NumberUtils.smallest(4751) == 1000);\n    assertTrue(NumberUtils.smallest(189)\
    \ == 100);\n    assertTrue(NumberUtils.smallest(37) == 10);\n    assertTrue(NumberUtils.smallest(1)\
    \ == 0);\n    assertTrue(NumberUtils.smallest(0) == 0);\n    assertTrue(NumberUtils.smallest(-1)\
    \ == -9);\n    assertTrue(NumberUtils.smallest(-38) == -99);\n  }\n  @Test\n \
    \ public void test_wrong_values() {\n    assertFalse(NumberUtils.smallest(8) ==\
    \ 1);\n    assertFalse(NumberUtils.smallest(289) == 2000);\n  }\n}\n```\n\n###\
    \ 3.4 Fizz-Buzz\nWrite a program that will display all the numbers between 1 and\
