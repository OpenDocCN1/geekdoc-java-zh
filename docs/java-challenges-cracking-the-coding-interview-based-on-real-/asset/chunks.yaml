    ```\n\n## 6.2 通过栈实现队列\n\n仅使用两个内部栈构建一个队列数据结构。\n\n### 解决方案\n\n栈（Stacks）和队列（Queues）在定义上是抽象的。这意味着，例如，在队列的情况下，我们可以使用两个栈来实现它的行为。然后我们创建两个\
    \ `java.util.Stack` 类型的栈，分别命名为 `inbox` 和 `outbox`。`add` 方法将新元素推入 `inbox`。而 `peek`\
    \ 方法将执行以下操作：\n\n* 如果 `outbox` 为空，则通过从 `inbox` 弹出每个元素并推入 `outbox` 来重新填充它。\n* 从\
    \ `outbox` 弹出并返回顶部的元素。\n\n![](img/image_rsrc2KV.jpg)\n图 6.2 通过栈实现队列\n\n列表 6.2\
    \ – 通过栈实现队列\n```java\npublic class QueueViaStacks<T> {\n  Stack<T> inbox;\n  Stack<T>\
    \ outbox;\n\n  public QueueViaStacks() {\n    inbox = new Stack<>();\n    outbox\
    \ = new Stack<>();\n  }\n\n  public void add(T value) {\n    // 此栈始终将最新的元素放在顶部\n\
    \    inbox.push(value);\n  }\n\n  public T peek() {\n    if (outbox.isEmpty())\
    \ {\n      while (!inbox.isEmpty()) {\n        // 按倒序顺序填充\n        outbox.push(inbox.pop());\n\
    \      }\n    }\n    return outbox.pop();\n  }\n}\n```\n\n测试\n```java\npublic\
    \ class QueueViaStacksTest {\n  QueueViaStacks<Integer> queueViaStacks;\n\n  @Before\n\
    \  public void Before() {\n    queueViaStacks = new QueueViaStacks<>();\n  }\n\
    }\n```\n\n## 7.0 哈希表基础\n\n哈希表（Hash Table）是一种插入和查找速度非常快的数据结构。在渐 O 符号中，它的时间复杂度为\
    \ `O(1)`。\n\n计算机通过哈希函数（hashing）将键转换为数字，并直接跳转到该索引以检索值。但有时会出现多个键映射到同一个索引的情况。这种情况被称为冲突（collision）；处理冲突有两种解决方案：\n\
    \n1. **链链法（Chaining）**：数组中的每个条目都指向自己的链表。\n2. **开放寻址法（Open addressing）**：存储在数组中；如果槽位被占用，则搜索另一个空槽位。\n\
    \n例如，下表展示了哈希表：\n\n```java\npublic class HashTable<K,V> {\n  private static final\
    \ int SIZE = 11;\n  private Entry[] entries = new Entry[SIZE];\n\n  private class\
    \ Entry<K,V> {\n    K key;\n    V value;\n    Entry<K,V> next;\n\n    Entry(K\
    \ key, V value) {\n      this.key = key;\n      this.value = value;\n      this.next\
    \ = null;\n    }\n  }\n\n  public int hashTheKey(K key) {\n    int product = 1;\n\
    \    for (char c : ((String)key).toCharArray()) {\n      if (c == 'A') {\n   \
    \     product *= 1;\n      } else if (c == 'B') {\n        product *= 2;\n   \
    \   } else if (c == 'C') {\n        product *= 3;\n      } else if (c == 'D')\
    \ {\n        product *= 4;\n      } else if (c == 'E') {\n        product *= 5;\n\
    \      }\n    }\n    return product % SIZE;\n  }\n\n  public void put(K key, V\
    \ value) {\n    int hash = hashTheKey(key);\n    Entry newEntry = new Entry(key,\
    \ value);\n    if (entries[hash] == null) {\n      entries[hash] = newEntry;\n\
    \    } else { //冲突，链链法\n      Entry currentEntry = entries[hash];\n      while\
    \ (currentEntry.next != null) {\n        currentEntry = currentEntry.next;\n \
    \     }\n      currentEntry.next = newEntry;\n    }\n  }\n}\n```\n\n在实现 `put`\
    \ 和 `get` 方法之前，我们定义了假设。\n\n```java\n@Test\npublic void hashTest() {\n  assertEquals(8,\
    \ hashTable.hashTheKey(\"DAB\"));\n  assertEquals(15, hashTable.hashTheKey(\"\
    ACE\"));\n}\n```\n\n"
