    \n# 9.0 基础知识\n\n`Graph`（图）是一种由节点（顶点）和边组成的非线性数据结构。它的形状取决于我们试图解决的物理或抽象问题。例如，如果节点代表城市，那么连接城市的路线可能由无向边定义。但如果节点代表完成项目的任务，那么它们的边就必须是有向的，以指示哪个任务必须在另一个任务之前完成。\n\
    \n## 术语\n\n`Graph` 可以为拟安装在德国的 `Hyperloop`（超级循环）交通系统建模。\n\n![](img/image_rsrc2KZ.jpg)\n\
    图 9.0 图 - 术语\n\n`Graph` 只显示 `vertices`（顶点）和 `edges`（边）之间的关系。这里最重要的是哪些边连接到哪个顶点。我们也可以说\
    \ `Graph` 模型了对象之间的连接。\n\n### 邻接 (Adjacency)\n当单条边连接两个顶点时，它们是相邻的或邻居。在图中，代表 `Berlin`\
    \ 和 `Leipzig` 的顶点是相邻的，但 `Berlin` 和 `Dresden` 两个城市并不相邻。\n\n### 路径 (Path)\n`Path`\
    \ 是边的序列。上面的图显示了从 `Berlin` 到 `München` 的路径，经过了 `Leipzig` 和 `Nürnberg` 城市。那么路径就是\
    \ `Berlin`、`Leipzig`、`Nürnberg`、`München`。\n\n### 通连图 (Connected Graphs)\n如果每个顶点到每个其他顶点至少有一个路径，则该\
    \ `Graph` 是连通的。上面的图是连通的，因为所有城市都是连接的。\n\n### 有向图和加权图 (Directed and Weighted Graphs)\n\
    当边具有方向时，`Graph` 是有向的。在上面的图中，我们有一个无向图，因为超级循环通常可以双向行驶。从 `Berlin` 到 `Leipzig` 等于从\
    \ `Leipzig` 到 `Berlin`。\n\n当边被赋予权重时，图被称为加权图，例如，两个城市之间的距离可以根据它们连接的速度进行加权。\n\n图可以回答一个问题：从给定的\
    \ `City` 可以到达哪些城市？我们需要实现搜索算法。在图中搜索有两种不同的方法：`depth-first search (DFS)`（深度优先搜索）和\
    \ `breadth-first search (BFS)`（广度优先搜索）。\n\n# 9.1 深度优先搜索 (DFS)\n\n实现深度优先搜索算法以遍历图数据结构。\n\
    \n## 解决方案\n\n深度优先搜索 (`DFS`) 是一种遍历图的算法。算法从根节点开始（选择任意城市作为根节点），沿着每个路径尽可能地探索。图 9.1.1\
    \ 显示了选择 `Berlin` 作为根节点时的步骤序列。\n\n![](img/image_rsrc2M0.jpg)\n图 9.1.1 深度优先搜索 -\
    \ 步骤序列\n\n### 实现算法\n\n### 问题建模\n我们需要一个支持 `Node` 中包含的任何数据的对象。我们称之为 `Vertex`。我们定义了一个布尔变量来避免在搜索城市时出现循环，因此我们会在访问每个节点时标记它。列表\
    \ 9.1.1 显示了 `Vertex` 类实现。\n\n列表 9.1.1 – Vertex 类\n```java\npublic class Vertex\
    \ {\n    private String name;\n    private boolean visited;\n\n    public Vertex(String\
    \ name) {\n        this.name = name;\n        this.visited = false;\n    }\n\n\
    \    public String getName() {\n        return name;\n    }\n\n    public void\
    \ setName(String name) {\n        this.name = name;\n    }\n\n    public boolean\
    \ isVisited() {\n        return visited;\n    }\n\n    public void setVisited(boolean\
    \ visited) {\n        this.visited = visited;\n    }\n}\n```\n\n然后，我们将这些顶点存储在一个名为\
    \ `arrayOfVertex[]` 的数组中。我们有两种方法来建模顶点是如何连接的（边）：`邻接矩阵`（adjacency matrix）和 `邻接表`（adjacency\
    \ list）。对于此算法，我们将实现邻接矩阵。\n\n### 邻接矩阵\n在具有 `N` 个顶点的图中，我们创建一个 `NxN` 的二维数组。两个顶点（城市）之间的边用\
    \ `1` 表示连接（两个相邻节点）。没有连接的用 `0` 表示。\n\n![](img/image_rsrc2M1.jpg)\n表 9.1.1 邻接矩阵\n\
    \n表 9.1.1 表明，`Leipzig` 与 `Berlin`、`Dresden` 和 `Nürnberg` 相邻。\n\n### 创建并初始化抽象数据类型\n\
    我们创建一个名为 `Graph` 的抽象数据类型，以定义我们数据结构的行为。我们需要一个栈（stack）来记住访问过的顶点。当我们向 `arrayOfVertex[]`\
    \ 添加新的 `Vertex`（`City`）时，`numOfVertices` 变量表示已添加到 `Graph` 中的顶点数量。由于我们将为 `DFS`\
    \ 算法传递一个 `String` 参数（城市名），因此定义了一个 `mapOfVertex` HashMap 来注册键-值对：`city-index`。列表\
    \ 9.1.2 显示了 `Graph` 类实现。\n\n列表 9.1.2 Graph 类\n```java\npublic class Graph {\n\
    \    private final int MAX_VERTEX = 15;\n    private Vertex arrayOfVertex[]; //cities\n\
    \    private Map<String, Integer> mapOfVertex;\n    private int[][] matrixOfVertex;\n\
    \    private int numOfVertices;\n    private Stack<Integer> stack;\n\n    public\
    \ Graph() {\n        arrayOfVertex = new Vertex[MAX_VERTEX];\n        mapOfVertex\
    \ = new HashMap<>();\n        numOfVertices = 0;\n        matrixOfVertex = new\
    \ int[MAX_VERTEX][MAX_VERTEX];\n        stack = new Stack<>();\n        for (int\
    \ i = 0; i < MAX_VERTEX; i++) {\n            for (int j = 0; j < MAX_VERTEX; j++)\
    \ {\n                matrixOfVertex[i][j] = 0;\n            }\n        }\n   \
    \ }\n\n    public void addVertex(Vertex city) {\n        mapOfVertex.put(city.getName(),\
    \ numOfVertices);\n        arrayOfVertex[numOfVertices++] = city;\n    }\n\n \
    \   public void addEdge(String city1, String city2) {\n        int start = mapOfVertex.get(city1);\n\
    \        int end = mapOfVertex.get(city2);\n        matrixOfVertex[start][end]\
    \ = 1;\n        matrixOfVertex[end][start] = 1;\n    }\n}\n```\n\n"
