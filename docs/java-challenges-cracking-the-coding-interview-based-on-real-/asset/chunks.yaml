    \n## 3.5 Verify If a Number Is a Valid Power of a Base\n\nIn mathematics, a function\
    \ is an expression that maps an independent variable (domain) to a dependent variable\
    \ (range). Functional programming (FP) emphasizes functions that produce results\
    \ that depend only on their inputs and not on the program state—i.e. pure mathematical\
    \ functions.\n\nOne of Java's approaches to FP is the definition of functional\
    \ interfaces. A functional interface in Java has only one abstract method. We\
    \ can use functional components available in the Java 8 library like the `Java.util.function.BiFunction<T,\
    \ U, R>`, which accepts two arguments and produces one result.\n\n```java\nBiFunction<Integer,\
    \ Integer, Integer> sum = (x1, x2) -> x1 + x2;\nInteger result = sum.apply(2,\
    \ 3);\nSystem.out.println(result); // 5\n```\n\nExponentiation involves two numbers,\
    \ the base `b`, and the exponent or power `n`. Exponentiation corresponds to repeated\
    \ multiplication of the base `n` times. For instance, in the following expression:\
    \ $3^5 = 243$, we say that $243$ is the 5th power of $3$. Therefore, $243$ is\
    \ the correct power of $3$.\n\n### Solution\nWe do the inverse operation to verify\
    \ if a number is a valid power `nth` of another number (base). Divide the given\
    \ number by the base and evaluate if it provides a 0 remainder, then we iterate\
    \ this operation until we find a value of 1. Otherwise, if the rest is not 0,\
    \ then the given number is not a valid power `nth` of the base. Listing 3.5 shows\
    \ a function, which returns true when a given number is the right power of a base.\n\
    \nListing 3.5 – Verify If a Number Is a Valid Power of a Base\n```java\npublic\
    \ class IsNumberAValidPowerOfBase implements BiFunction<Integer, Integer, Boolean>\
    \ {\n  @Override\n  public Boolean apply(Integer number, Integer base) {\n   \
    \ return isNumberAValidPowerOfBase(number, base);\n  }\n\n  static boolean isNumberAValidPowerOfBase(int\
    \ number, int base) {\n      if (number == 0)\n        return true;\n      while\
    \ (number != 1) {\n        if ((number % base) != 0)\n          return false;\n\
    \        number = number / base;\n      }\n      return true;\n    }\n}\n```\n\
    \n```java\npublic class IsNumberAValidPowerOfBaseTest {\n  private IsNumberAValidPowerOfBase\
    \ isNumberAValidPowerOfBase;\n\n  @Before\n  public void before() {\n    isNumberAValidPowerOfBase\
    \ = new IsNumberAValidPowerOfBase();\n  }\n\n  @Test\n  public void testOfWrongReturnValues()\
    \ {\n    assertFalse(isNumberAValidPowerOfBase.apply(6, 2));\n    assertFalse(isNumberAValidPowerOfBase.apply(16,\
    \ 5));\n    assertFalse(isNumberAValidPowerOfBase.apply(14, 7));\n  }\n\n  @Test\n\
    \  public void testOfValidReturnValues() {\n    assertTrue(isNumberAValidPowerOfBase.apply(243,\
    \ 3));\n    assertTrue(isNumberAValidPowerOfBase.apply(16, 4));\n    assertTrue(isNumberAValidPowerOfBase.apply(125,\
    \ 5));\n  }\n}\n```\n\n## 3.6 Validate If a Number Is Prime or Not\n\nA prime\
    \ number is a whole number greater than one, whose only factors are one and itself.\
    \ A factor is a whole number that can be divided evenly into another number. For\
    \ instance: 2, 3, 5, 7, 11 are prime numbers.\n\n### Solution\nA simple solution\
    \ is to iterate decreasingly through all numbers from the half of the given number\
    \ `n`, and for every number, check if it divides `n`. If we find any number that\
    \ divides, then we return false. Otherwise, it returns true. Listing 3.6 shows\
    \ the algorithm.\n\nListing 3.6 – Validate If a Number Is Prime or Not\n```java\n\
    public class MathUtils {\n  public static boolean isPrimeNumber(int number) {\n\
    \    if (number < 2)\n      return false;\n    if (number == 2)\n      return\
    \ true;\n    for (int div = (number / 2) + 1; div > 1; div--) {\n      if (number\
    \ % div == 0) {\n        return false;\n      }\n    }\n    return true;\n  }\n\
    }\n```\n\n```java\npublic class IsPrimeNumberTest {\n  @Test\n  public void notPrimeNumbers()\
    \ {\n    assertFalse(MathUtils.isPrimeNumber(-1));\n    assertFalse(MathUtils.isPrimeNumber(65));\n\
    \    assertFalse(MathUtils.isPrimeNumber(4));\n    assertFalse(MathUtils.isPrimeNumber(100));\n\
    \  }\n\n  @Test\n  public void primeNumbers() {\n    assertTrue(MathUtils.isPrimeNumber(2));\n\
    \    assertTrue(MathUtils.isPrimeNumber(3));\n    assertTrue(MathUtils.isPrimeNumber(5));\n\
    \    assertTrue(MathUtils.isPrimeNumber(7));\n    assertTrue(MathUtils.isPrimeNumber(73));\n\
    \  }\n}\n```\n\n## 3.7 Distance Between Two Points\n\nGiven two points, calculate\
    \ the distance between them.\n\n### Solution\nEach `Point` has coordinates `(x,y)`,\
    \ so we can calculate the distance with the hypotenuse. Listing 3.7 shows the\
    \ algorithm.\n\nFigure 3.7 Distance Between Two Points\nListing 3.7 - Distance\
    \ Two Points\n```java\npublic class Point {\n  final double x;\n  final double\
    \ y;\n\n  Point(double x, double y) {\n    this.x = x;\n    this.y = y;\n  }\n\
    \n  public double distance(Point point) {\n    if (this == null || point == null)\n\
    \      throw new RuntimeException(\"Points are not initialized\");\n    double\
    \ dx = this.x - point.x;\n    double dy = this.y - point.y;\n    return Math.sqrt(dx\
    \ * dx + dy * dy);\n  }\n}\n```\n\n```java\n@Test\npublic void given_twoPoints_return_distance()\
    \ {\n  Point point1 = new Point(2, 3);\n  Point point2 = new Point(5, 7);\n  assertEquals(5,\
    \ point1.distance(point2));\n}\n```\n\nOther useful methods included in the `Math`\
    \ Class:\n- `abs(x)`: Returns the absolute value of `x`. `abs(-1) = 1`\n- `round(x)`:\
    \ Returns the value of `x` rounded to its nearest integer. `round(4.4) = 4`\n\
    - `ceil(x)`: Returns the value of `x` rounded up to its nearest integer. `ceil(4,4)\
    \ = 5.0`\n- `floor(x)`: Returns the value of `x` rounded down to its nearest integer.\
    \ `floor(4.4) = 4.0`\n- `max(x)`: Returns the number with the highest value. `max(6,7)\
    \ = 7`\n- `pow(x,y)`: Returns the value of `x` to the power of `y`. `pow(2,5)\
    \ = 32.0`\n- `random()`: Returns a random number between 0 and 1. `random() =>\
    \ 0.455443449920937`\n\n## 3.8 Write an Immutable Class to convert Currencies\n\
    \nDesign a `Money` Class, which can convert Euros to Dollars and vice versa. As\
    \ examples, write two instances with the following values: 67.89 EUR and 98.76\
    \ USD\n\n### Solution\nAn immutable class is a class whose instances cannot be\
    \ modified. Its information is fixed for the lifetime of the object without changes.\
    \ To make a class immutable, we follow these rules:\n- Don’t include a mutators\
    \ method that could modify the object’s state.\n- Don’t allow to extend the class.\n\
    - Make all class members `final` and `private`\n- Ensure exclusive access to any\
    \ mutable components. Don’t make references to those objects. Make defensive copies.\n\
    \nImmutable objects are thread-safe; they require no synchronization. We use a\
    \ `BigDecimal` data type for our Class because it provides operations on numbers\
    \ for arithmetic, rounding and can handle large floating-point numbers with great\
    \ precision. Listing 3.8 shows an immutable Class.\n\nListing 3.8 - Money Class\n\
    ```java\nimport java.math.BigDecimal;\n\npublic final class Money {\n  private\
    \ static final String DOLAR = \"USD\";\n  private static final String EURO = \"\
    EUR\";\n  private static int ROUNDING_MODE = BigDecimal.ROUND_HALF_EVEN;\n  private\
    \ static int DECIMALS = 2;\n  private BigDecimal amount;\n  private String currency;\n\
    \n  public Money() {}\n\n  public static Money valueOf(\n      BigDecimal amount,\n\
    \      String currency) {\n    return new Money(amount, currency);\n  }\n\n  //Caller\
    \ cannot see this private constructor\n  private Money(\n      BigDecimal amount,\n\
    \      String currency) {\n    this.amount = amount;\n    this.currency = currency;\n\
    \  }\n\n  //Currency converter\n  public Money multiply(BigDecimal factor) {\n\
    \    return Money.valueOf(\n      rounded(this.amount.multiply(factor)),\n   \
    \   this.currency.equals(DOLAR) ? EURO : DOLAR);\n  }\n\n  //round to 2 decimals\n\
    \  private BigDecimal rounded(BigDecimal amount) {\n    return amount.setScale(DECIMALS,\
    \ ROUNDING_MODE);\n  }\n\n  public BigDecimal getAmount() {\n    return amount;\n\
    \  }\n}\n```\n"
