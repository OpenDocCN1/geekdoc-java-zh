    \ `arrayLength/2`\n\n```java\n@Test\npublic void reverseText_useCases() {\n  assertEquals(\"\
    abc2132\", StringUtils.reverse(\"2312cba\"));\n  assertEquals(\"ba\", StringUtils.reverse(\"\
    ab\"));\n}\n```\n\nDuring the interview, it is common to receive additional questions\
    \ about your code. For instance, what happens if we pass a null argument. First,\
    \ we need to define our test case\n\n```java\n@Test(expected = RuntimeException.class)\n\
    public void reverseText_exceptionThrownCase() {\n  assertEquals(\"cda1\", StringUtils.reverse(null));\n\
    }\n```\n\nTo avoid a `NullPointerException`, we need to add the following precondition:\n\
    \n```java\nif (text == null)\nthrow new RuntimeException(\"text is not initialized\"\
    )\n```\n\nMoreover, the interviewer wants our algorithm to reverse only those\
