  trans: "\n\nTDD 让我们能够先设计、构建并测试最小的方法，然后再将它们组合在一起。最重要的是，我们可以在不破坏其他测试用例的情况下对它们进行重构。\n\
    \n### 测试用例 #2：根据有效坐标输入符号\n一旦设置了尺寸，我们需要接受有效的坐标并检查该位置是否可用。\n\n```java\n@Test\npublic\
    \ void whenCoordinatesAreNotBusyThenPutSymbol() throws Exception {\n  board.setSize(3);\n\
    \  board.putSymbol(1, 2, \"X\");\n  board.putSymbol(2, 3, \"O\");\n  assertEquals(\"\
    O\", board.getBoard()[1][2]);\n}\n```\n\n代码列表 10.1.3 显示了 `putSymbol` 方法的实现。\n\n\
    #### 代码列表 10.1.3 – Board 类，putSymbol 方法\n```java\npublic void putSymbol(int x,\
    \ int y, String character) {\n  if (x < 1 || x > this.board.length)\n    throw\
    \ new RuntimeException(\"X coordinate invalid, must be between 1 and \" +this.board.length);\n\
    \  if (y < 1 || y > this.board.length)\n    throw new RuntimeException(\"Y coordinate\
    \ invalid, must be between 1 and \" +this.board.length);\n  if (board[x - 1][y\
    \ - 1] != EMPTY_) throw new RuntimeException(\"Coordinates are busy\");\n  board[x\
    \ - 1][y - 1] = character;\n}\n```\n\n如果我们将尺寸设置为 4，这意味着意味着对于玩家来说，下限是 1，上限是 4。\n\
    \n### 测试用例 #3：每次移动后打印棋盘\n每当玩家输入有效坐标时，`Board` 就会被更新并打印。\n\n```java\n@Test\npublic\
    \ void whenBoardIsNotNullThenPrintIsPossible() {\n  board.setSize(10);\n  board.putSymbol(1,\
    \ 2, \"X\");\n  board.putSymbol(2, 3, \"O\");\n  board.print();\n}\n```\n\n代码列表\
    \ 10.1.4 显示了 `print` 方法的实现。\n\n#### 代码列表 10.1.4 – Board 类，print 方法\n```java\n\
    public void print() {\n  if (board == null)\n    throw new RuntimeException(\"\
    Board is not initialized\");\n  int size = board.length;\n  for (int y = size\
    \ - 1; y >= 0; y--) {\n    for (int x = 0; x < size; x++) {\n        if (x ==\
    \ size - 1) {\n          System.out.print(board[x][y] + \"\");\n        } else\
    \ {\n          System.out.print(board[x][y] + \"|\");\n        }\n      }\n  \
    \    System.out.println(\"\");\n  }\n}\n```\n\n在这里，你甚至可以将 `Board` 的打印委托给另一个组件，例如\
    \ `Console.print`。通过这样，当你想以 XML 或 HTML 格式打印时，`Console` 类将负责实现新方法。一个类发生改变的原因不应超过一个。\n\
    \n### 测试用例 #4：返回胜利者\n一旦我们设置了尺寸，游戏就会接收不同的移动。`Board` 类会在每次移动后检查游戏中是否存在胜利者。代码列表 10.2.5\
    \ 定义了一个测试用例，用来检查整条水平线是否被填充。\n\n#### 代码列表 10.1.5 – Board 类，getWinner 测试用例\n```java\n\
    @Test\npublic void horizontalLineFilledThenWinnerX() {\n  board.setSize(3);\n\
    \  board.putSymbol(1, 1, \"X\");\n  board.putSymbol(1, 2, \"O\");\n  board.putSymbol(2,\
    \ 1, \"X\");\n  board.putSymbol(2, 3, \"O\");\n  board.putSymbol(3, 1, \"X\");\n\
    \  board.print();\n  assertEquals(\"X\", board.getWinner());\n}\n```\n\n然后我们遍历每一条水平线，检查它是否被相同的符号填充。代码列表\
    \ 10.1.6 显示了 `getWinner` 方法的实现。\n\n#### 代码列表 10.1.6 – Board 类，getWinner 方法\n```java\n\
    public String getWinner() {\n  if (board == null)\n    throw new RuntimeException(\"\
    Board is not initialized\");\n  String winner = null;\n  for (int y = 0; y < board.length;\
    \ y++) {\n    String symbol = board[0][y];\n    if (symbol != EMPTY_) {\n    \
    \  int counter = 1;\n      for (int x = 1; x < board.length; x++) {\n        if\
    \ (symbol.equals(board[x][y])) {\n          counter++;\n        }\n      }\n \
    \     if (counter == board.length) {\n        winner = symbol;\n        return\
    \ winner;\n      }\n    }\n  }\n  return winner;\n}\n```\n\n我们需要对所有获胜方式使用相同的逻辑：垂直、对角线，因此我们需要在子方法中抽象每种情况。代码列表\
    \ 10.1.7 显示了重构后的新的 `getWinner` 方法。\n\n#### 代码列表 10.1.7 – Board 类，重构后的 getWinner\
    \ 方法\n```java\npublic String getWinner() {\n  if (board == null)\n    throw new\
    \ RuntimeException(\"Board is not initialized\");\n  String winner = winnerInHorizonzalLine();\n\
    \  if (winner != null) {\n    return winner;\n  } else {\n    winner = winnerInVerticalLine();\n\
    \    if (winner != null) {\n      return winner;\n    } else {\n      winner =\
    \ winnerInBottomLeft();\n      if (winner != null) {\n        return winner;\n\
    \      } else {\n        winner = winnerInTopLeft();\n        if (winner != null)\
    \ {\n          return winner;\n        } else {\n          // 避免每次遍历整个棋盘来寻找平局\n\
    \          if (this.numOfPlays == this.numOfAllowed) {\n            return DRAW_;\n\
    \          } else {\n            return null;\n          }\n        }\n      }\n\
    \    }\n  }\n}\n```\n\n之前的代码展示了我们如何引入三个新变量：一个常量变量 `DRAW_ = \"DRAW!\"`；`numOfPlays`\
    \ 和 `numOfAllowed` 被声明为 `Board` 类的成员变量；`numOfAllowed` 在 `setSize` 方法中初始化：`this.numOfAllowed\
    \ = size * size`；`numOfPlays` 在 `putSymbol` 方法中增加：`this.numOfPlays++`。\n\n这里是其他获胜方式。\n\
    ```java\nprivate String winnerInVerticalLine() {\n  String winner = null;\n  for\
    \ (int x = 0; x < board.length; x++) {\n    String symbol = board[x][0];\n   \
    \ if (symbol != EMPTY_) {\n      int counter = 1;\n      for (int y = 1; y < board.length;\
    \ y++) {\n        if (symbol.equals(board[x][y])) {\n          counter++;\n  \
    \      }\n      }\n      if (counter == board.length) {\n        winner = symbol;\n\
    \        return winner;\n      }\n    }\n  }\n  return winner;\n}\n\nprivate String\
    \ winnerInBottomLeft() {\n  String winner = null;\n  String symbol = board[0][0];\n\
    \  if (symbol != EMPTY_) {\n    int counter = 1;\n    for (int idx = 1; idx <\
    \ board.length; idx++) {\n      if (symbol.equals(board[idx][idx])) {\n      \
    \  counter++;\n      }\n    }\n    if (counter == board.length) {\n      winner\
    \ = symbol;\n      return winner;\n    }\n  }\n  return winner;\n}\n\nprivate\
    \ String winnerInTopLeft() {\n  String winner = null;\n  String symbol = board[0][0];\n\
    \  if (symbol != EMPTY_) {\n    int counter = 1;\n    for (int idx = 1; idx <\
    \ board.length; idx++) {\n      if (symbol.equals(board[idx][idx])) {\n      \
    \  counter++;\n      }\n    }\n    if (counter == board.length) {\n      winner\
    \ = symbol;\n      return winner;\n    }\n  }\n  return winner;\n}\n```\n\n现在让我们看看\
    \ `Utils` 类，它加载符号和 `Board` 的尺寸。\n\n### 测试用例 #5：加载文件\n我们需要一个方法，给定 `Filename`，获取该\
    \ `File` 的内容。代码列表 10.1.8 显示了测试用例。\n\n```java\npublic class UtilsTest {\n  private\
    \ Utils utils;\n  @Before\n  public void setUp() {\n    utils = new Utils();\n\
    \  }\n  @Rule\n  public ExpectedException thrownException = ExpectedException.none();\n\
    \  @Test\n  public void whenFileExistsThenReturnContent() throws Exception {\n\
    \    String content = utils.loadFile(\"board.txt\");\n    assertNotNull(content);\n\
    \  }\n}\n```\n\n假设我们的配置文件位于项目名称下。代码列表 10.1.9 显示了 `loadFile` 的实现。\n\n```java\n\
    public class Utils {\n  public String loadFile(String fileName) throws Exception\
    \ {\n    String content;\n    try {\n      content = new String(Files.readAllBytes(Paths.get(fileName)));\n\
    \    } catch (IOException io) {\n      throw new RuntimeException(\"File \" +\
    \ fileName + \" not found\");\n    }\n    return content;\n  }\n}\n```\n\n###\
    \ 测试用例 #6：获取棋盘尺寸\n一旦加载了 `Board` 文件，我们需要验证它包含有效内容。代码列表 10.1.10 显示了关于验证 `Board`\
    \ 尺寸的假设。根据要求，棋盘尺寸必须在 3 到 9 之间。\n\n```java\n@Test\npublic void whenGetBoardSizeIs4ThenReturnSize()\
    \ throws Exception {\n  String content = utils.loadFile(\"board.txt\");\n  assertEquals(4,\
    \ utils.getBoardSize(content));\n}\n```\n\n"
- fmt: "\nListing `10.1.11` shows the implementation of the `getBoardSize`.\n\n###\
