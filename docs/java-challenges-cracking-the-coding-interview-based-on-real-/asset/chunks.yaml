    The output will look like this:1, 2, Fizz, 4, Buzz, Fizz, 7, 8, Fizz, Buzz, 11,\
    \ Fizz, 13, 14, Fizz-Buzz, 16, 19, … \n\n#### Solution\nIt looks like a simple\
    \ algorithm but is “hard” for some programmers because they try to follow the\
    \ following reasoning:\n```\nif (theNumber is divisible by 3) then\nprint \"Fizz\"\
    \nelse if (theNumber is divisible by 5) then\nprint \"Buzz\"\nelse /* theNumber\
    \ is not divisible by 3 or 5 */\nprint theNumber\n```\nBut where do we print `Fizz-Buzz`\
    \ in this algorithm?. The interviewer expects that you think for yourself and\
    \ made good use of conditional without duplication. Realizing that a number divisible\
    \ by 3 and 5 is also divisible by `3*5` is the key to a FizzBuzz solution. Listing\
    \ 3.4 shows the algorithm.\n\n#### Listing 3.4 – Fizz-Buzz\n```java\npublic class\
    \ NumberUtils {\n  public static void fizzBuzz(int N) {\n    final String BUZZ\
    \ = \"Buzz\";\n    final String FIZZ = \"Fizz\";\n    for (int i = 1; i <= N;\
    \ i++) {\n      if (i % 15 == 0) {\n        System.out.print(FIZZ + \"-\" + BUZZ\
    \ + \", \");\n      } else if (i % 3 == 0) {\n        System.out.print(FIZZ +\
    \ \", \");\n      }\n    }\n  }\n}\n```\n"
