    \ right node. Every node contains two elements: a `key` used to identify the data\
    \ stored by the node and a `value` that is the data collected in the node.\n\n\
    ## 8.1 Binary Search Tree\n\nThe most common type of binary tree is the `Binary\
    \ Search Tree`, which has two main characteristics:\n\n* The value of the left\
