  trans: "\n\n即使有外部依赖：`private Z_E2F_RS_Result e2fResult; //ingredients record`，它也必须重构为：`private\
    \ Z_E2F_RS_Result ingredients;` 假设我们在 `e2fResult` 变量中没有 `//ingredients` 注释。那么，在代码的后续任何部分，当我们尝试处理这个变量时，会遇到这样一语句：`e2f\
    \ = e2fResult[idx];` 而我们并不知道 `e2f` 是什么意思！好吧，有人建议问问负责这段代码的人。但那哥们不在办公室。好吧，发封邮件过去吧，结果他正在休假！但是，如果我们从一开始就采用能够揭示意图的命名，就可以避免这些灾难性的场景。`ingredient\
    \ = ingredients[idx];` 在整本书中，你将看到这些实践对于编写高效且可读的算法有多重要。\n\n# 测试驱动的 Java 开发\n\n\
    测试驱动开发（TDD）是一个过程，基于一种名为`红-绿-重构`（red-green-refactor）的程序。该程序由几个不断重复的步骤组成：\n\n* 编写一个测试。\n\
    * 运行所有测试。\n* 编写实现代码。\n* 运行所有测试。\n* 重构代码。\n* 运行所有测试。\n\n在编写测试时，我们处于红色状态。当测试实现准备完成后，所有测试都应该通过，然后我们进入绿色状态。在\
    \ Java 中，我们使用 `JUnit` 库来实现我们的测试用例。在整本书中，我们在某些情况下会省略 Java 测试类的定义，只关注带有 `@Test`\
    \ 注解的方法。\n\n```java\npublic class UtilsTest {\n\n  private Utils utils;\n\n  @Before\n\
    \  public void setUp() {\n    utils = new Utils();\n  }\n\n  @Test\n  public void\
    \ fileExists () throws Exception {\n    String content = utils.loadFile(\"symbols.txt\"\
    );\n    assertNotNull(content);\n  }\n}\n```\n\n# 数组与字符串\n\n## 1.0 基础\n\n### 数组\n\
    数组是一个存储相同数据类型且固定数量元素的对象。通过其数字索引访问每个元素。![](img/image_rsrc2KD.jpg) 图 1.0.1 数组\n\n\
    如果你询问 `Array`：“给我索引为 4 的元素”，计算机将单步定位该元素的单元格。这发生是因为计算机找到了数组开始的内存地址——在上面的图中为 1000——并加上\
    \ 4，因此元素将位于内存地址 1004。数组是一种线性数据结构，因为元素是按顺序排列并被随机访问的。数组的局限性之一是添加或删除数据需要大量时间。在一维数组中，访问每个索引时你会获取单个值。![](img/image_rsrc2KE.jpg)\n\
    \n```java\n// 声明一个整数数组\nint[] arrayOfInts;\n// 为 10 个整数分配内存\narrayOfInts = new\
    \ int[10];\n// 初始化第一个元素\narrayOfInts[0] = 100;\n// 初始化第四个元素\narrayOfInts[3] =\
    \ 200;\n// 获取第四个元素的内容\nint temp = arrayOfInts[3];\n```\n\n在多维数组中，访问每个索引时你获取的是一个数组。二维数组被称为矩阵。数组允许我们用一个变量存储多个值。例如，我们定义了一个二维产品数组，每行的元素代表：`productId`、价格和重量（克）。\n\
    \n```java\ndouble [][] arrayOfProducts = new double[4][3];\narrayOfProducts[2][0]\
    \ = 2;\narrayOfProducts[2][1] = 1.29;\narrayOfProducts[2][2] = 240;\n```\n\n下图显示了这种数组数组的表示形式：![](img/image_rsrc2KF.jpg)\
    \ 图 1.0.2 多维数组\n\n一旦创建数组，它就不能改变大小。对于动态数组，请使用 `List`。`ArrayList` 是 `List` 接口的可伸缩数组实现。\n\
    \n```java\nList<String> listOfCities = new ArrayList<>();\nlistOfCities.add(\"\
    New York\");\nlistOfCities.add(\"Berlin\");\nlistOfCities.add(\"Paris\");\nlistOfCities.add(\"\
    Berlin\");\n```\n\n### 字符串\n是字符的序列。在 Java 中字符串是不可变的。\n\n```java\nString myString\
    \ = \"hello\";\n```\n\n## 1.1 反转文本\n给定一个字符串，反转它的字符。\n\n### 解决方案\n我们使用字符数组来反转字符串。通过遍历数组数组来交换字符。\n\
    \n```java\npublic class StringUtils {\n\n  public static String reverse(String\
    \ text) {\n    char[] chars = text.toCharArray();\n    final int arrayLength =\
    \ chars.length;\n    char temp;\n    for (int i = 0; i < arrayLength/2; i++) {\n\
    \      temp = chars[i];\n      chars[i] = chars[arrayLength - 1 - i];\n      chars[arrayLength\
    \ - 1 - i] = temp;\n    }\n    return String.valueOf(chars);\n  }\n}\n```\n\n\
    **示例：**\n当 `idx = 0` 时：`chars = {a, b, c, 2, 1, 3, 2}`，`chars[idx] = a`，`chars[arrayLength-1-idx]\
    \ = 2`\n当 `idx = 1` 时：`chars = {2, b, c, 2, 1, 3, a}`，`chars[idx] = b`，`chars[arrayLength-1-idx]\
    \ = 3`\n当 `idx = 2` 时：`chars = {2, 3, c, 2, 1, b, a}`，`chars[idx] = c`，`chars[arrayLength-1-idx]\
    \ = 1`\n当 `idx = 3` 时：`idx` 不小于 `arrayLength/2`\n\n"
- fmt: "\nThe `%` operator is used to detect these locations. Under the loop for sentence,\
    \ we need to add the following conditional sentence:\n```\nif ((idx+1) % 2 !=\
    \ 0) {…}\n```\n\n### What is the performance of the algorithm?\n\nStart to analyze\
    \ the most important sentences:\n- `char[] chars =text.toCharArray();` -> runs\
    \ in only 1 execution: `O(1)`\n- `final int arrayLength =chars.length;` -> runs\
    \ in only 1 execution: `O(1)`\n- `for (int idx=0; idx<arrayLength/2; idx++){`\
    \ -> runs in `O(N)`\n- `return String.valueOf(chars);` -> runs in only 1 execution:\
    \ `O(1)`\n\nTotal time: `O(1) + O(1) + O(N) + O(1) = O(N)`\n\nIn this scenario,\
    \ a constant time `O(1)` is insignificance compared with a linear time `O(N)`.\
    \ In order to know why Big O Notation ignores constants, let's see the following\
    \ example:\n\nWhen `chars.length` is 100, then:\nTotal time: `O(1)+O(1)+O(100/2)+O(1)\
    \ = 1+1+50+1 = 53`\nBut `53 ≈ 50 → (N/2)`\nIf 50 executions depend on `N/2`, and\
    \ `N/2` depend on `N`, then, we can say that 50 executions depend on `N` as well.\n\
    \nWhen `chars.length` is 100000, then:\nTotal time: `O(1)+O(1)+O(100000/2)+O(1)\
    \ = 1+1+50000+1 = 50003`\nBut `50003 ≈ 50000 → (N/2)`\nIf 50000 executions depend\
    \ on `N/2`, and `N/2` depend on `N`, then, we can say that 50000 executions depend\
    \ on `N` as well.\n\nTherefore, we can say that our Reverse Text algorithm runs\
    \ in `O(N)` time.\n\n### 1.2 Validate If a String Has All Unique Characters\n\n\
    Given a string of characters, validate if all of them are unique.\n\n#### Solution\n\
    We assume the charset is `ASCII`, but you should always ask interviewers if you\
    \ are unsure. Originally based on the English alphabet, `ASCII` encodes 128 specified\
    \ characters into seven-bit integers. Ninety-five of the encoded characters are\
    \ printable: these include the digits `0` to `9`, lowercase letters `a` to `z`,\
    \ uppercase letters `A` to `Z`, and punctuation symbols.\n\n1. Firstly, create\
    \ a `Boolean` array to store the occurrence of every character.\n2. Secondly,\
    \ iterate the `String` of characters, use the `charAt` method to return the numerical\
    \ representation for every character. Check this value in the `Boolean` array.\
    \ If it exists, then the string does not has unique values. Otherwise, store this\
    \ value in the `Boolean` array as its first occurrence.\n3. Finally, if all characters\
    \ had only one occurrence in the `Boolean` array, the `String` has all unique\
    \ characters.\n\nListing 1.2 shows the algorithm.\n\n#### Listing 1.2 – Validate\
    \ if a String Has All Unique Characters\n```java\npublic class StringUtils {\n\
    \  public static boolean areUniqueChars(String str) {\n    if (str.length() >\
    \ 128)\n      return false;\n    boolean[] booleans = new boolean[128];\n    for\
    \ (int idx = 0; idx < str.length(); idx++) {\n      int value = str.charAt(idx);\n\
    \      if (booleans[value]) { //is found?\n        return false;\n      }\n  \
    \    booleans[value] = true;\n    }\n    return true;\n  }\n}\n```\n\n#### Tests\n\
    ```java\npublic class AreUniqueCharsTest {\n  @Test\n  public void is_not_UniqueChars()\
    \ {\n    assertFalse(StringUtils.areUniqueChars(\"29s2\"));\n    assertFalse(StringUtils.areUniqueChars(\"\
    1903aio9p\"));\n  }\n  @Test\n  public void is_UniqueChars() {\n    assertTrue(StringUtils.areUniqueChars(\"\
    29s13\"));\n    assertTrue(StringUtils.areUniqueChars(\"2813450769\"));\n  }\n\
    }\n```\n\n### 1.3 Validate If a String Is a Palindrome\n\nA palindrome is a string\
    \ that reads the same forward and backward, for example, `level`, `wow`, and `madam`.\n\
    \n#### Solution\nWe can loop through each character and check it against another\
    \ one on the opposite side. If one of these checks fails, then the text is not\
    \ Palindrome. Listing 1.4 shows the algorithm.\n\n#### Listing 1.4 – Validate\
    \ If a String Is a Palindrome\n```java\npublic class StringUtils {\n  public static\
    \ boolean isPalindrome(String text) {\n    final int length = text.length();\n\
    \    for (int idx = 0; idx < length / 2; idx++) {\n      if (text.charAt(idx)\
    \ != text.charAt(length - 1 - idx))\n        return false;\n    }\n    return\
    \ true;\n  }\n}\n```\n\n#### Tests\n```java\npublic class IsPalindromeTest {\n\
    \  @Test\n  public void is_not_palindrome() {\n    assertFalse(StringUtils.isPalindrome(\"\
    2f1\"));\n    assertFalse(StringUtils.isPalindrome(\"-101\"));\n  }\n  @Test\n\
    \  public void is_palindrome() {\n    assertTrue(StringUtils.isPalindrome(\"2f12\"\
    ));\n    assertTrue(StringUtils.isPalindrome(\"-10-\"));\n    assertTrue(StringUtils.isPalindrome(\"\
    9\"));\n    assertTrue(StringUtils.isPalindrome(\"madam\"));\n  }\n}\n```\n\n\
    ### 1.4 Compare Application Numbers\n\nSemantic versioning is a formal convention\
    \ for specifying compatibility using a three-part version number: `major`, `minor`,\
    \ and `patch`. `Minor` and bug fixes increment the `patch` number, which does\
    \ not change the software's programming interface (`API`). Given `version1` and\
    \ `version2`, returns:\n- `-1` if `version1 < version2`\n- `1` if `version1 >\
    \ version2`\n- `0` if `version1 == version2`\n\n#### Solution\nFirstly, we must\
    \ split the version number into its components. Since the input is in the form\
    \ of strings, there is a need to divide them, given the dot delimiter that separates\
    \ them to convert them to `int` arrays.\nSecondly, we must iterate the arrays\
    \ while it has not achieved at least one of the lengths. Compare each component\
    \ from the left to the right. If one version contains more component than the\
    \ other, check that a value of `0` in that additional component is representative.\n\
    Finally, we return `0` (equals) when versions were not different during the iteration.\
    \ Listing 1.5 shows the algorithm.\n\n#### Listing 1.5 – Compare Application Numbers\n\
    ```java\npublic class VersionNumber {\n  public static int compare(String v1,\
    \ String v2) {\n    int[] a1 = Arrays.stream(v1.split(\"\\\\.\"))\n      .map(String::trim)\n\
    \      .mapToInt(Integer::parseInt).toArray();\n    int[] a2 = Arrays.stream(v2.split(\"\
    \\\\.\"))\n      .map(String::trim)\n      .mapToInt(Integer::parseInt).toArray();\n\
    \    int idx = 0;\n    while (idx < a1.length || idx < a2.length) {\n      if\
    \ (idx < a1.length && idx < a2.length) {\n        if (a1[idx] < a2[idx]) {\n \
    \         return -1;\n        } else if (a1[idx] > a2[idx]) {\n          return\
    \ 1;\n        }\n      } else if (idx < a1.length) {\n        if (a1[idx] != 0)\
    \ {\n          return 1;\n        }\n      } else if (idx < a2.length) {\n   \
    \     if (a2[idx] != 0) {\n          return -1;\n        }\n      }\n      idx++;\n\
    \    }\n    return 0;\n  }\n}\n```\n\n#### Tests\n```java\n@Test\npublic void\
    \ versionNumber_usesCases() {\n  assertEquals(0, VersionNumber.compare(\"15\"\
    , \"15.0\"));\n  assertEquals(0, VersionNumber.compare(\"10.1\", \"10.1.0\"));\n\
    \  assertEquals(-1, VersionNumber.compare(\"10.1\", \"10.1.1\"));\n  assertEquals(1,\
    \ VersionNumber.compare(\"10.1.2\", \"10.1.1\"));\n}\n```\n\n### 1.5 Remove Duplicates\
    \ from a List\n\nWrite a program to check if a list has any duplicates, and if\
    \ it does, it removes them.\n\n#### Solution\nMaybe your first idea is to iterate\
    \ through the list. You compare every item with the other ones. If a duplicate\
    \ is detected, then it is removed. Or maybe you traverse the list and store the\
    \ first occurrence of the item in a new collection and ignore all the next occurrences\
    \ of that item. Those solutions are called brute force algorithms because they\
    \ use straightforward methods of solving a problem, but sometimes what the interviewer\
    \ expects is to reuse the libraries included in the JDK, which improves efficiency.\n\
    \nWe use `Set` from the `Collections` library. By definition, `Set` does not allow\
    \ duplicates. Then, use the `sort` method to order it. `Comparable` interface\
    \ sorts lists of custom objects in natural ordering. `List` of Objects that already\
    \ implement `Comparable` (e.g., `String`) can be sorted automatically by `Collections.sort`.\
    \ `LinkedHashSet` (`Collection list`) is used to initialize a `HashSet` with the\
    \ list items, removing the duplicates. Listing 1.5 shows this implementation.\n\
    \n#### Listing 1.6 – Remove Duplicates from a List\n```java\npublic class ListUtils\
    \ {\n  public static <E extends Comparable<E>>\n  List<E> removeDuplicatesAndOrder(List<E>\
    \ list) {\n    Set<E> set = new LinkedHashSet<>(list);\n    ArrayList<E> arrayList\
    \ = new ArrayList<>(set);\n    Collections.sort(arrayList);\n    return arrayList;\n\
    \  }\n}\n```\n"
