  trans: "\n\n# O(N) – 线性\n如果算法的步数取决于输入中项的数量，则我们的算法运行时间为 `O(N)`。\n\n```java\npublic\
    \ int sum(int[] numbers) {\n  int sum =0;\n  for (int i =0; i<numbers.length;\
    \ i++) {\n    sum+=numbers[i];\n  }\n  return sum;\n}\n\n@Test\npublic void test_linearTime()\
    \ {\n  final int[] numbers = {1, 2, 4, 6, 1, 6};\n  assertTrue(bigONotation.sum(numbers)\
    \ == 20);\n}\n```\n\n# O(N2) – 平方\n当我们在代码中嵌套了两个循环时，我们称其其运行时间是二次方的 `O(N2)`。例如，在井井棋游戏中初始化一个二维矩阵时。\n\
    \n```java\nprivate String [][] board;\npublic void initializeBoard(int size) {\n\
    \  this.board = new String[size][size];\n  for (int x = 0; x < size; x++) {\n\
    \    for (int y = 0; y < size; y++) {\n      board[x][y] = \" \";\n    }\n  }\n\
    }\n\n@Test\npublic void test_quadraticTime() {\n  bigONotation.initializeBoard(3);\n\
    }\n```\n\n# O(N3) - 立方\n当代码中包含最多三个嵌套循环时，我们称我们的算法运行时间为立方的。例如，给定 N 个整数，有多少组三元组之和恰好为零？一种方法（并非最好的）是使用三个嵌套循环。\n\
    \n```java\npublic int countThreeSum(int[] numbers) {\n  int N =numbers.length;\n\
    \  int count =0;\n  for (int i = 0; i<N; i++)\n    for (int j = i+1; j<N; j++)\n\
    \      for (int k = j+1; k<N; k++)\n        if (numbers[i] + numbers[j] + numbers[k]\
    \ == 0)\n          count++;\n  return count;\n}\n\n@Test\npublic void test_countThreeSum()\
    \ {\n  final int[] numbers = {30, -40, -20, -10, 40, 0, 10, 5};\n  assertTrue(bigONotation.countThreeSum(numbers)\
    \ == 4);\n}\n```\n\n# O(LogN) – 对数级\n这类算法产生的增长曲线在开始时达到顶点，并随着输入规模的增加逐渐变得平缓。\n\n\
    `Log28 = 3`\n`Log216 = 4`\n`Log232 = 5`\n\n二分查找 在大小为 `N` 的排序数组中搜索时，最多需要 `LogN`\
    \ 次键比较。8 个元素需要三次比较，16 个元素需要四次比较，32 个元素需要五次，以此此类推。\n\n# 如何寻找算法的时间复杂度\n寻找算法的 Big\
    \ O 复杂度遵循以下规则：\n\n*   忽略低阶项\n*   舍弃领先常数\n\n**示例**：如果一个算法的时间复杂度为 `2n3 + 4n + 3`。其\
    \ Big O 复杂度简化为 `O(n3)`。\n\n**示例**：给定以下算法：\n\n```java\npublic Integer sumEvenNumbers(Integer\
    \ N) {\n  int sum = 0;\n  for (int number = 1; number <= N; number++)\n    if\
    \ ((number % 2) == 0)\n      sum = sum + number;\n  return sum;\n}\n```\n\n首先，我们将代码拆分为单独的操作，然后计算它们执行了多少次，如下表所示。\n\
    \n| 操作 | 执行次数 |\n| :--- | :--- |\n| `int sum = 0;` | 1 |\n| `int number = 1;`\
    \ | 1 |\n| `number <= N;` | N |\n| `number++` | N |\n| `if ((number % 2) == 0)`\
    \ | N |\n| `sum = sum + number;` | N |\n| `return sum;` | 1 |\n\n现在，我们需要相加每个操作执行的次数。\n\
    时间复杂度 = `1 + 1 + N + N + N + N + 1` => `4N + 3`\n\n# 为什么 Big O 表示法忽略常数？\nBig O\
    \ 表示法描述了相对于数据元素数量所需的步数。它作为一种分类算法长期增长率的方法。\n\n例如，`O(N)` 对于所有数据量来说都比 `O(N2)` 快，如图\
    \ A.2 所示![](img/image_rsrc2M7.jpg)\n图 A.2 对于所有数据量，`O(N)` 比 `O(N2)` 快。\n\n现在，如果我们比较\
    \ `O(100N)` 和 `O(N2)`，可以看到对于某些数据量，`O(N2)` 比 `O(100N)` 快，如图 A.3 所示![](img/image_rsrc2M8.jpg)\n\
    图 A.3 对于某些数据量，`O(N2)` 比 `O(100N)` 快。\n\n但在一点之后，`O(100N)` 会变得更快，并且对于之后增加的数据量保持更快。这就是为什么\
    \ Big O 表示法忽略常数的原因。因为如此，`O(100N)` 被写成 `O(N)`。\n\n"
