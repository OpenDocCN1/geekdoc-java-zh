    \ = data;\n  }\n}\n```\n\nListing 8.1.3 shows `TreeP` Class to implement an abstract\
    \ data type called binary search tree, which includes a `root` variable for the\
    \ first element to be inserted. Then, every time a new `GTIN` is inserted, we\
    \ need to implement an `insert` method, which compares the current `GTIN` versus\
    \ the new `GTIN`. Depends on the result, we store the new `GTIN` on the left or\
    \ the right Node.\n\n```java\n// Listing 8.1.3 TreeP and insert method\npublic\
    \ class TreeP {\n  private NodeP root;\n  void insert(String gtin, List<Product>\
    \ data) {\n    NodeP newNode = new NodeP(gtin, data);\n    if (root == null)\n\
    \      root = newNode;\n    else {\n      NodeP current = root;\n      NodeP parent;\n\
    \      while (true) {\n        parent = current;\n        if (gtin.compareTo(current.getGtin())\
    \ < 0) {\n          current = current.getLeft();\n          if (current == null)\
    \ {\n            parent.setLeft(newNode);\n            return;\n          }\n\
    \        } else if (gtin.compareTo(current.getGtin()) > 0) {\n          current\
    \ = current.getRight();\n          if (current == null) {\n            parent.setRight(newNode);\n\
    \            return;\n          }\n        } else\n          return; //already\
