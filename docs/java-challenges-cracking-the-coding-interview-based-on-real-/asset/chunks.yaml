    \    }\n  }\n  return null;\n}\n```\n\n## 7.2 查找数组中出现频率最高的元素\n\n给定一个数组，找到数组中出现频率最高的元素。\n\
    \n### 解决方案\n首先，创建一个哈希表。其次，遍历数组并将元素及其频率作为键值对存储起来。然后，遍历哈希表并按频率倒序排列，最高频率排在前面。最后，遍历之前的哈希表，构建一个最大频率元素的列表。列表\
    \ 7.2 显示了该算法。\n\n### 列表 7.2 – 返回数组中频率最高的元素\n```java\nimport static java.util.stream.Collectors.*;\n\
    \npublic class ArrayUtils {\n\n  public static int[] mostFrecuent(int[] array)\
    \ {\n    Map<Integer, Integer> mapFrecuencyByElement = new HashMap<>();\n\n  \
    \  for (int element : array) {\n      Integer frecuency = mapFrecuencyByElement.get(element);\n\
    \      mapFrecuencyByElement.put(element, frecuency == null ? 1 : frecuency +\
    \ 1);\n    }\n    Map<Integer, Integer> mapOrderedByTopFrecuency= mapFrecuencyByElement\n\
    \          .entrySet()\n          .stream()\n          .sorted(Collections.reverseOrder(Map.Entry.comparingByValue()))\n\
    \          .collect(\n              toMap(Map.Entry::getKey, Map.Entry::getValue,\
    \ (e1, e2) -> e2,\n                  LinkedHashMap::new)\n          );\n    List<Integer>\
    \ result = new ArrayList<>();\n    int idx = 0; //用于遍历结果列表\n\n    for (Map.Entry<Integer,\
    \ Integer> entry :mapOrderedByTopFrecuency.entrySet()) {\n      if (idx > 0) {\n\
    \        // 如果存在相同的频率，则继续添加\n        if (entry.getValue().equals(result.get(idx\
    \ - 1))) {\n          result.add(entry.getKey());\n        } else {\n        \
    \  break;\n        }\n      } else {\n        result.add(entry.getKey());\n  \
    \    }\n      idx++;\n    }\n    int[] mostFrecuent = result.stream().mapToInt(i\
    \ -> i).toArray();\n    return mostFrecuent;\n  }\n}\n```\n\n### 测试\n```java\n\
    @Test\npublic void test_right_values() {\n  assertArrayEquals(new int[]{2, 3},\n\
    \      ArrayUtils.mostFrecuent(new int[]{3, 2, 0, 3, 1, 2}));\n  assertArrayEquals(new\
    \ int[]{5},\n      ArrayUtils.mostFrecuent(new int[]{3, 5, 0, 5, 5, 1, 2}));\n\
    \  assertArrayEquals(new int[]{7},\n      ArrayUtils.mostFrecuent(new int[]{7}));\n\
    }\n```\n\n## 8.0 基础知识\n\n树形结构是非线性的数据结构。它们允许我们实现比使用线性数据结构快得多的算法。二叉树最多有两个孩子：一个左节点和一个右节点。每个节点包含两个元素：用于标识节点所存储数据的\
    \ `key`，以及存储在节点中的收集数据 `value`。\n\n## 8.1 二叉搜索树\n\n最常见的二叉树类型是**二叉搜索树”（`Binary Search\
    \ Tree`），它具有以下两个主要特征：\n\n*   左节点的值小于父节点的值。\n*   右节点的值大于或等于父节点的值。\n\n![](img/image_r2.jpg)\
    \ 图 8.1 二叉搜索树 - 术语\n\n此外，在树中进行搜索可以像数组一样快，也可以像链表一样快速插入和删除项。公司使用全球贸易项目代码（GTIN）来唯一标识不同制造商生产的产品。\n\
    \n**用例：** 商店想要通过二叉搜索算法高效地检索有关 GTIN 的信息。\n\n### 解决方案\n列表 8.1.1 显示了如何创建 `Product`\
    \ 类。\n\n```java\n// 列表 8.1.1 – Product 类\npublic class Product {\n  Integer productId;\n\
    \  String name;\n  Double price;\n  String manufacturer;//省略了 getters 和 setters\n\
    }\n```\n\n列表 8.1.2 显示了如何创建 `NodeP` 类来存储左、右节点。\n\n```java\n// 列表 8.1.2 – NodeP\
    \ 类\npublic class NodeP {\n  String gtin;\n  private List<Product> data;\n  private\
    \ NodeP left;\n  private NodeP right;\n  NodeP(String gtin, List<Product> data)\
    \ {\n    this.gtin = gtin;\n    this.data = data;\n  }\n}\n```\n\n列表 8.1.3 显示了\
    \ `TreeP` 类，它包含一个 `root` 变量用于存储第一个元素。然后，每当插入一个新的 GTIN 时，我们需要实现一个 `insert` 方法，将当前的\
    \ GTIN 与新的 GTIN 进行比较，并将新的 GTIN 存储在左侧或右侧。\n\n```java\n// 列表 8.1.3 TreeP 和 insert\
    \ 方法\npublic class TreeP {\n  private NodeP root;\n  void insert(String gtin,\
    \ List<Product> data) {\n    NodeP newNode = new NodeP(gtin, data);\n    if (root\
    \ == null)\n      root = newNode;\n    else {\n      NodeP current = root;\n \
    \     NodeP parent;\n      while (true) {\n        parent = current;\n       \
    \ if (gtin.compareTo(current.getGtin()) < 0) {\n          current = current.getLeft();\n\
    \          if (current == null) {\n            parent.setLeft(newNode);\n    \
    \        return;\n          }\n        } else if (gtin.compareTo(current.getGtin())\
    \ > 0) {\n          current = current.getRight();\n          if (current == null)\
    \ {\n            parent.setRight(newNode);\n            return;\n          }\n\
    \        } else\n          return; // 已存在\n      }\n    }\n    return;\n  }\n\
    }\n```\n\n列表 8.1.4 显示了一个 `find` 方法，它遍历所有节点直到找到 GTIN。因为二叉搜索树始终有序的，该算法将搜索空间缩小到 `N/2`。\n\
    \n```java\n// 列表 8.1.4 – find 方法\npublic NodeP find(String gtin) {\n  NodeP current\
    \ = root;\n  if (current == null)\n    return null;\n  while (!current.getGtin().equals(gtin))\
    \ {\n    if (gtin.compareTo(current.getGtin()) < 0) {\n      current = current.getLeft();\n\
    \    } else {\n      current = current.getRight();\n    }\n    if (current ==\
    \ null) // 子节点中未找到\n      return null;\n  }\n  return current;\n}\n```\n\n###\
    \ 测试\n```java\n@Test\npublic void test_findNode() {\n  tree.insert(\"04000345706564\"\
    ,new ArrayList<>(Arrays.asList(product1)));\n  tree.insert(\"07611400983416\"\
    ,new ArrayList<>(Arrays.asList(product2)));\n  tree.insert(\"07611400989104\"\
    ,new ArrayList<>(Arrays.asList(product3, product4)));\n  tree.insert(\"07611400989111\"\
    ,new ArrayList<>(Arrays.asList(product5)));\n  tree.insert(\"07611400990292\"\
    ,new ArrayList<>(Arrays.asList(product6, product7, product8)));\n  assertEquals(null,\
    \ tree.find(\"07611400983324\"));\n  tree.insert(\"07611400983324\",new ArrayList<>(Arrays.asList(product9)));\n\
    \  assertTrue(tree.find(\"07611400983324\") != null);\n  assertEquals(\"07611400983324\"\
    ,tree.find(\"07611400983324\").getGtin());\n}\n```\n\n这种二叉搜索树在数据按随机顺序插入时运行良好。但当插入的值已经有序时，二叉树就会变得不平衡。在不平衡的树中，我们无法快速找到数据。\n\
    \n解决不平衡树的方法之一是红黑树技术，这是一种具有独特特征的二叉搜索树。假设我们已经有一棵平衡的树，列表 8.1.5 向我们展示二叉搜索树在比较次数上可以有多快，这取决于元素的数量\
    \ `N`。例如，在 10 亿个产品中通过 GTIN 查找，算法只需要 30 次比较。\n\n"
