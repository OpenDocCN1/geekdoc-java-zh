    ```java\npublic String[] getSymbols(String content) {\n    String[] symbols =\
    \ content.split(\",\");\n    if (symbols.length != 3)\n        throw new RuntimeException(\"\
    Invalid settings for symbols\");\n    return symbols;\n}\n```\n\n### 测试用例 #8：从控制台接收输入\n\
    我们创建了一个辅助类 `Input`来存储玩家输入的坐标。列表 `10.1.14` 显示了我们在测试用例类中的假设。\n```java\npublic class\
    \ Input {\n    private int x;\n    private int y;\n}\n```\n### 列表 10.1.14 – Utils\
    \ 类，`getInput` 测试用例\n```java\n@Test\npublic void inputFromConsoleThenReturnInput()\
    \ throws Exception {\n    Input input = utils.getInputFromConsole(\"2,3\");\n\
    \    assertEquals(2, input.getX());\n    assertEquals(3, input.getY());\n}\n```\n\
    列表 `10.1.15` 显示了 `getInputFromConsole` 方法的实现，其中我们需要接受有效的数字。\n\n### 列表 10.1.15\
    \ – Utils 类，`getInputFromConsole` 方法\n```java\npublic Input getInputFromConsole(String\
    \ inputFromConsole) {\n    if (inputFromConsole == null || inputFromConsole.trim().length()\
    \ <= 0)\n        throw new RuntimeException(\"Invalid input from console\");\n\
    \n    Pattern p = Pattern.compile(\"[0-9]*\\\\.?,[0-9]+\");\n    Matcher matcher\
    \ = p.matcher(inputFromConsole);\n    if (!matcher.find())\n        throw new\
    \ RuntimeException(\"Invalid input from console\");\n\n    String[] inputSplitted\
    \ = inputFromConsole.split(\",\");\n    Input input = new Input();\n    input.setX(Integer.valueOf(inputSplitted[0]).intValue());\n\
    \    input.setY(Integer.valueOf(inputSplitted[1]).intValue());\n    return input;\n\
    }\n```\n\n现在，我们实现 `Player` 类。列表 `10.1.16` 显示了 `Player` 类及其子类的设计。\n\n### 列表 10.1.16\
    \ – Player 类及子类\n```java\npublic class Player {\n    private String symbol;  //省略了\
    \ getters 和 setters\n}\npublic class Human extends Player {}\npublic class IA\
    \ extends Player {}\n```\n\n### 测试用例 #9：实现 IA 如何玩\n为了制作一个简单的井井棋程序，我们将允许 `IA` 玩家填充棋盘上第一个可用坐标。当然，你也可以基于图论编写更复杂的实现，例如为了决定\
    \ `IA` 玩家的最佳走法。列表 `10.1.17` 显示了关于 `IA` 玩家的假设。\n\n### 列表 10.1.17 – Player 类，测试用例\n\
    ```java\npublic class PlayerTest {\n    private Player humanPlayer;\n    private\
    \ IA iaPlayer;\n    private Board board;\n\n    @Before\n    public void setUp()\
    \ {\n        humanPlayer = new Human();\n        iaPlayer = new IA();\n      \
    \  board = new Board();\n        board.setSize(3);\n    }\n\n    @Test\n    public\
    \ void whenSetSymbolThenReturnSameSymbol() throws Exception {\n        humanPlayer.setSymbol(\"\
    A\");\n        assertEquals(\"A\", humanPlayer.getSymbol());\n    }\n\n    @Test\n\
    \    public void whenIAPlaysThenReturnInput() throws Exception {\n        iaPlayer.setSymbol(\"\
    A\");\n        board.putSymbol(1, 1, \"X\");\n        board.putSymbol(2, 2, \"\
    O\");\n        board.print();\n        Input input = iaPlayer.play(board.getBoard());\n\
    \        assertEquals(1, input.getX());\n        assertEquals(2, input.getY());\n\
    \    }\n}\n```\n列表 `10.1.18` 显示了 `play` 方法的实现。\n\n### 列表 10.1.18 – Player 类，`play`\
    \ 方法\n```java\npublic class IA extends Player {\n    private final String EMPTY_\
    \ = \" \";\n\n    public Input play(String[][] board) {\n        Input input =\
    \ new Input();\n        // 找到第一个可用坐标\n        for (int x = 0; x < board.length;\
    \ x++) {\n            for (int y = 0; y < board[x].length; y++) {\n          \
    \      String symbol = board[x][y];\n                if (symbol.equals(EMPTY_))\
    \ {\n                    input.setX(x + 1);\n                    input.setY(y\
    \ + 1);\n                    return input;\n                }\n            }\n\
    \        }\n        return input;\n    }\n}\n```\n"
