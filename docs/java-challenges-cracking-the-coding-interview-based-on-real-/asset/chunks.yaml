    \ Fundamentals Hash Table\n\nA hash table is a data structure that is very fast\
    \ for insertion and searching. In Big O Notation it takes a constant time: `O(1)`.\n\
    \nA hash table is build using an array of paired values. Each pair is comprised\
    \ of a `key` and a `value`. They are paired to indicate some significant association,\
    \ for example:\n`students = { \"1573297\" => \"Jan\",\"8174321\" => \"Brian\"\
    ,\"8119214\" => \"James\" }`\n\nIn this example, the `1573297` is the `key`, and\
    \ `Jan` is the `value`. They indicate that Passport Number `1573297` identify\
    \ to `Jan`.\n\nFor a seven-digit numeric range, we need an array's size of `10,000,000`.\
    \ If we decide to store only a few thousand numbers, most of the array will be\
    \ empty. We need to squeeze our input key into the array range. So to locate `1573297`\
    \ in a fast way, we use a hash function (`hashing`) to convert `1573297` within\
    \ the size of our array. For example, the following shows our hash table:\n\n\
    ![](image_rsrc2KW.jpg)\nFigure 7.0 Hash table\n\nNow, our hash table looks like\
    \ this:\n`students = { \"1573297\" => \"Jan\",\"8174321\" => \"Brian\",\"8119214\"\
    \ => \"James\" }`\n\nThe computer hashes the key, turns it into a number, and\
    \ jumps directly to that index to retrieve the value. But sometimes, there is\
    \ a risk that multiple keys map to the same index. That is called a collision;\
    \ there are two solutions to deal with collisions:\n\n1. **Chaining**: each entry\
    \ in the array points to its own linked list.\n2. **Open addressing**: items are\
    \ stored in the array; if the slot is occupied, search for another empty slot.\n\
    \n```java\npublic class HashTable<K,V> {\n  private static final int SIZE = 11;\n\
    \  private Entry[] entries = new Entry[SIZE];\n\n  private class Entry<K,V> {\n\
