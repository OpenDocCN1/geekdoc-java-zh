    \ Sorted Lists\n\nGiven two sorted lists, merge them in a new sorted list.\n\n\
    ![](image_rsrc2KS.jpg)\nFigure 5.5 Merge Two Sorted Lists\n\n### Solution\nWe\
    \ can join the two lists into a new list and apply a sort algorithm such as bubble\
    \ sort, insertion, or quicksort. What we are going to do is implement a new algorithm\
    \ maintaining the same `NlogN` performance.\n\n- We define a new `List` to add\
    \ all elements from the other two lists in a sorted way.\n- We define two indexes\
    \ that point to every element in every list.\n- We iterate both lists while still\
    \ exist elements in both lists.\n- We compare elements from both lists and add\
    \ the smaller one to the new list in every iteration. Before passing to the next\
    \ iteration, we increment in one the index of the list, which contains the smaller\
    \ element.\n- If there is a list that still contains elements, we add them directly\
