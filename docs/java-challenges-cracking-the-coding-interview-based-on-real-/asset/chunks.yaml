    # 6.0 Stacks and Queues\n\n## Fundamentals\n\n#### Stack\nA `Stack` is an abstract\
    \ data type, which includes a collection of objects that follow the last-in, first-out\
    \ (`LIFO`) principle, i.e., the element inserted at last is the first element\
    \ to come out of the list. A real-world example of a stack is the stack of trays\
    \ at a cafeteria.\n\n- Data are only inserted at the end. This operation is called\
    \ `push`.\n- Data are only deleted from the end. This operation is called `pop`.\n\
    - Only the last element of a stack can be read. This element is called `Top`.\
    \ The `peek` operation returns the value stored at the top without removing it.\n\
    \nYou can implement a `Stack` using an `Array` or `Singly LinkedList`.\n\n![](image_rsrc2KT.jpg)\n\
    Figure 6.0.1 Stack\n\nStacks are useful to handle temporary data as various algorithms,\
    \ for example:\n- Undo mechanism on text editor is based on `Stack`, i.e., cancel\
    \ recent operations. The editor keeps text changes in a stack.\n- Web browsers\
    \ store URLs of visited websites on a stack. When a user visits a new website,\
    \ its URL is \"pushed\" on the stack. When the user presses the \"back\" button,\
    \ the previous URL is \"pop\" from the stack.\n\n#### Queue\nA `Queue` is an abstract\
    \ data type, which includes a collection of objects that follow the first-in,\
    \ first-out (`FIFO`) principle, i.e., the element inserted at first is the first\
