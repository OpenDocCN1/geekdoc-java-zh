    ```\n\n## 6.2 Queue via Stacks\n\nBuild a queue data structure using only two\
    \ internal stacks.\n\n### Solution\n\nStacks` and `Queues` are abstract in their\
    \ definition. That means, for example, in the case of `Queues`, we can implement\
    \ its behavior using two stacks. Then we create two stacks of `java.util.Stack`,\
    \ `inbox`, and `outbox`. The `add` method pushes new elements onto the `inbox`.\
    \ And the `peek` method will do the following:\n\n* If the `outbox` is empty,\
    \ refill it by popping each element from the `inbox` and pushing it onto the `outbox`.\n\
    * Pop and return the top element from the `outbox`.\n\n![](image_rsrc2KV.jpg)\n\
    Figure 6.2 Queue via Stacks\n\nListing 6.2 – Queue via Stacks\n```java\npublic\
    \ class QueueViaStacks<T> {\n  Stack<T> inbox;\n  Stack<T> outbox;\n\n  public\
    \ QueueViaStacks() {\n    inbox = new Stack<>();\n    outbox = new Stack<>();\n\
    \  }\n\n  public void add(T value) {\n    //This stack always has the newest elements\
    \ on top\n    inbox.push(value);\n  }\n\n  public T peek() {\n    if (outbox.isEmpty())\
    \ {\n      while (!inbox.isEmpty()) {\n        //Filled in inverse order\n   \
    \     outbox.push(inbox.pop());\n      }\n    }\n    return outbox.pop();\n  }\n\
    }\n```\n\nTests\n```java\npublic class QueueViaStacksTest {\n  QueueViaStacks<Integer>\
