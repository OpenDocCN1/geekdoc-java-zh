    # 6.0 栈与队列\n\n## 栈（Stacks）\n\n 栈是一种后进先出（LIFO）的数据结构。\n\n### 基础概念\n栈是在在一个末端（称为栈顶）进行插入和删除操作的数据结构。\n\
    \n- **入栈（push）**：向栈顶添加元素。\n- **弹出（pop）**：从栈顶移除元素。\n- **查看（peek）**：查看栈顶元素但不将其移除。\n\
    - **判空（isEmpty）**：检查栈是否为空。\n\n## 队列（Queues）\n\n 队列是一种先进先出（FIFO）的数据结构。\n\n### 基础概念\n\
    队列是在头部插入元素并在末尾删除元素的数据结构。\n\n- **入队（enqueue）**：在队列末尾添加元素。\n- **出队（dequeue）**：从队列头部移除元素。\n\
    - **查看（peek）**：查看头部元素但不将其移除。\n- **判空（isEmpty）**：检查队列是否为空。\n\n### 栈的应用\n栈在许多场景中非常有用，例如：\n\
    - 函数调用栈（Call Stack）\n- 表达式求值\n- 括号匹配算法\n- 深度优先搜索（DFS）\n\n### 队列的应用\n队列在许多场景中非常有用，例如：\n\
    - 广度优先搜索（BFS）\n- 任务调度\n- 打印队列\n- 缓冲池\n\n"
