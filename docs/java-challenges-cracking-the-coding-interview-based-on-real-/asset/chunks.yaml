  trans: "\n\n`double[][] mostValueableProducts = new double[len][3];`..然后我们可以看到我们的前两个测试用例成功了。\n\
    \n### 假设 #3 - 给定一个产品数组，我们需要从所有可能的可能的组合中获取价值最高的产品\n\n想象一下以下场景：\n```java\ndouble[][]\
    \ myProducts = new double[][] {{1, 0.98, 230},{2, 0.51, 30},{3, 0.49, 28},{4,\
    \ 1.29, 55},{5, 0.98, 230},{6, 4.86, 14},{7, 0.48, 75},};\ndouble[][] mostValueableProducts\
    \ = basketOptimized.fill(myProducts, 4);\nassertEquals(590d,Arrays.stream(mostValueableProducts).mapToDouble(arr\
    \ -> arr[2]).sum(),0);\n```\n\n测试期望结果为 590，这对应于 3,73US$ 的最终价格（0.98+0.98+0.48+1.29）。一旦算法按价值对输入数组进行排序，我们得到了下面的新输入数组\
    \ `[1.0, 0.98, 230.0][5.0, 0.98, 230.0][7.0, 0.48, 75.0][4.0, 1.29, 55.0][2.0,\
    \ 0.51, 30.0][3.0, 0.49, 28.0][6.0, 4.86, 14.0]`\n\n但在这里我们发现了另一种能给我们提供最高价值的产品组合：230+230+75+30+28\
    \ = 593，这对应于 3,44US$ 的最终价格。因此，我们需要重构代码来计算所有组合（子集），并在 4 US$ 的预算内返回价值最高的产品。\n\n\
    子集可以用从 0 到 7（数组大小）的二进制选项来表示。位运算符允许我们操作整数内部的位。例如，33 的二进制 `int` 值为 00100001，其中每个位置代表\
    \ 2 的幂，从最右位开始为 `2⁰`。\n\n```java\nint numIterations = (int) Math.pow(2, myProducts.length);\n\
    ```\n\n所以对于七个产品，我们有 128 次迭代。对于每次迭代，我们构建一个内层循环来决定将哪些产品包含在产品子集中。让我们来看一个例子：\n\n```java\n\
    When int idx = 33\n```\n\n我们需要构建一个通过以下标准的的产品子集：\n```java\nif ((idx & (int) Math.pow(2,\
    \ idx2)) == 0) {\n```\n\n下表显示了我们内层循环中的迭代：\n\n| binary(idx) | idx2 | Math.pow(2,idx2)\
    \ | binary(pow(idx2)) |\n| :--- | :--- | :--- | :--- |\n| 00100001 | 0 | 1 | 0001\
    \ |\n| 00100001 | 1 | 2 | 0010 |\n| 00100001 | 2 | 4 | 0100 |\n| 00100001 | 3\
    \ | 8 | 1000 |\n| 00100001 | 4 | 16 | 00010000 |\n| 00100001 | 5 | 32 | 00100000\
    \ |\n| 00100001 | 6 | 64 | 01000000 |\n\n这意味着一个新的子集将包含产品数组中索引为 1, 2, 3, 4 和 6\
    \ 的产品。我们需要询问在有限的预算内是否能买得起这些产品。\n\n```java\nif (subSet.length > 0 && sumPrice <=\
    \ budget) {\n```\n\n下图显示了我们当前迭代的结果：\n![](img/image_rsrc2M4.jpg)\n\n我们构建了一个 `HashMap`\
    \ 来存储所有组合及其值的总和。最后，我们返回按价值排序的 HashMap 的第一个元素。\n\n#### 列表 1.1.3 – BaskedOptimized\
    \ 实现\n\n```java\npublic class BasketOptimized {\n\n    public double[][] fill(double[][]\
    \ myProducts, double budget) {\n        int len = myProducts.length;\n       \
    \ int numIterations = (int) Math.pow(2, myProducts.length);\n        Map<double[][],\
    \ Double> combinations = new HashMap<>();\n        for (int idx = 0; idx < numIterations;\
    \ idx++) {\n            double[][] subSet = new double[len][];\n            double\
    \ sumPrice = 0;\n            double sumValue = 0;\n            int i = 0;\n  \
    \          for (int idx2 = 0; idx2 < len; idx2++) {\n                if ((idx\
    \ & (int) Math.pow(2, idx2)) == 0) {\n                    subSet[i++] = myProducts[idx2];\n\
    \                    sumPrice = sumPrice + myProducts[idx2][1];\n            \
    \        sumValue = sumValue + myProducts[idx2][2];\n                }\n     \
    \       }\n            if (subSet.length > 0 && sumPrice <= budget) {\n      \
    \          //remove nulls\n                subSet = Arrays.stream(subSet)\n  \
    \                  .filter(s -> (s != null && s.length > 0))\n               \
    \     .toArray(double[][]::new);\n                combinations.put(subSet, Double.valueOf(sumValue));\n\
    \            }\n        }\n        LinkedHashMap<double[][], Double> reverseSortedMap\
    \ = new LinkedHashMap<>();\n        combinations.entrySet()\n            .stream()\n\
    \            .sorted(Map.Entry.comparingValue(Comparator.reverseOrder()))\n  \
    \          .forEach(x -> reverseSortedMap.put(x.getKey(), x.getValue()));\n  \
    \      double[][] mostValueableProducts = reverseSortedMap.keySet().iterator().next();\n\
    \        return mostValueableProducts;\n    }\n}\n```\n\n```java\npublic class\
    \ BasketOptimizedTest {\n    BasketOptimized basketOptimized;\n\n    @Before\n\
    \    public void setup() {\n        basketOptimized = new BasketOptimized();\n\
    \    }\n\n    @Test\n    public void productsByValue() {\n        double[][] myProducts\
    \ = new double[][]{\n            {1, 0.98, 230},\n            {2, 0.98, 230},\n\
    \            {3, 0.48, 75},\n            {4, 1.29, 55},\n            {5, 1.29,\
    \ 47},\n            {6, 4.86, 14},\n            {7, 1.69, 12}\n        };\n  \
    \      double[][] mostValueableProducts = basketOptimized.fill(myProducts, 4);\n\
    \        assertEquals(590d, Arrays.stream(mostValueableProducts).mapToDouble(arr\
    \ -> arr[2]).sum(), 0);\n    }\n\n    @Test\n    public void productsNotByValue()\
    \ {\n        double[][] myProducts = new double[][]{\n            {1, 0.98, 230},\n\
    \            {2, 1.29, 47},\n            {3, 1.69, 12},\n            {4, 1.29,\
    \ 55},\n            {5, 0.98, 230},\n            {6, 4.86, 14},\n            {7,\
    \ 0.48, 75}\n        };\n        double[][] mostValueableProducts = basketOptimized.fill(myProducts,\
    \ 4);\n        assertEquals(590d, Arrays.stream(mostValueableProducts).mapToDouble(arr\
    \ -> arr[2]).sum(), 0);\n    }\n}\n```\n\n"
- fmt: "\nTDD allows us to design, build, and test the smallest methods first and\
    \ assemble them later. And the most important is that we can refactor it without\
    \ breaking the rest of the test cases.\n\n### Test case #2: Enter a symbol based\
    \ on valid coordinates\nOnce the size is set up, we need to accept valid coordinates\
    \ and check if that location is still available.\n\n```java\n@Test\npublic void\
    \ whenCoordinatesAreNotBusyThenPutSymbol() throws Exception {\n  board.setSize(3);\n\
    \  board.putSymbol(1, 2, \"X\");\n  board.putSymbol(2, 3, \"O\");\n  assertEquals(\"\
    O\", board.getBoard()[1][2]);\n}\n```\n\nListing 10.1.3 shows the implementation\
    \ of the `putSymbol` method.\n\n#### Listing 10.1.3 – Board Class, putSymbol method\n\
    ```java\npublic void putSymbol(int x, int y, String character) {\n  if (x < 1\
    \ || x > this.board.length)\n    throw new RuntimeException(\"X coordinate invalid,\
    \ must be between 1 and \" +this.board.length);\n  if (y < 1 || y > this.board.length)\n\
    \    throw new RuntimeException(\"Y coordinate invalid, must be between 1 and\
    \ \" +this.board.length);\n  if (board[x - 1][y - 1] != EMPTY_) throw new RuntimeException(\"\
    Coordinates are busy\");\n  board[x - 1][y - 1] = character;\n}\n```\n\nIf we\
    \ set the size to 4, that means that for the player, the lower limit is 1, and\
    \ the upper limit is 4.\n\n### Test case #3: After every move, print the board\n\
    Every time a player enters valid coordinates, then the `Board` is updated and\
    \ printed.\n\n```java\n@Test\npublic void whenBoardIsNotNullThenPrintIsPossible()\
    \ {\n  board.setSize(10);\n  board.putSymbol(1, 2, \"X\");\n  board.putSymbol(2,\
    \ 3, \"O\");\n  board.print();\n}\n```\n\nListing 10.1.4 shows the implementation\
    \ of the `print` method.\n\n#### Listing 10.1.4 – Board Class, print method\n\
    ```java\npublic void print() {\n  if (board == null)\n    throw new RuntimeException(\"\
    Board is not initialized\");\n  int size = board.length;\n  for (int y = size\
    \ - 1; y >= 0; y--) {\n    for (int x = 0; x < size; x++) {\n        if (x ==\
    \ size - 1) {\n          System.out.print(board[x][y] + \"\");\n        } else\
    \ {\n          System.out.print(board[x][y] + \"|\");\n        }\n      }\n  \
    \    System.out.println(\"\");\n  }\n}\n```\n\nHere you can even delegate the\
    \ print of the `Board` to another component, e.g., `Console.print`. In this way,\
    \ when you want to print in XML or HTML format, `Console` Class will be responsible\
    \ for implementing the new methods. There should never be more than one reason\
    \ for a class to change.\n\n### Test Case #4: Returns a winner\nOnce we set the\
    \ size, the game receives different moves. The `Board` Class checks if in the\
    \ game exists a winner after a move. Listing 10.2.5 defines a test case to check\
    \ if a whole horizontal line is filled.\n\n#### Listing 10.1.5 – Board Class,\
    \ getWinner Test Case\n```java\n@Test\npublic void horizontalLineFilledThenWinnerX()\
    \ {\n  board.setSize(3);\n  board.putSymbol(1, 1, \"X\");\n  board.putSymbol(1,\
    \ 2, \"O\");\n  board.putSymbol(2, 1, \"X\");\n  board.putSymbol(2, 3, \"O\");\n\
    \  board.putSymbol(3, 1, \"X\");\n  board.print();\n  assertEquals(\"X\", board.getWinner());\n\
    }\n```\n\nThen we iterate every horizontal line and check if it is filled with\
    \ the same symbol. Listing 10.1.6 shows the implementation of the `getWinner`\
    \ method.\n\n#### Listing 10.1.6 – Board Class, getWinner method\n```java\npublic\
    \ String getWinner() {\n  if (board == null)\n    throw new RuntimeException(\"\
    Board is not initialized\");\n  String winner = null;\n  for (int y = 0; y < board.length;\
    \ y++) {\n    String symbol = board[0][y];\n    if (symbol != EMPTY_) {\n    \
    \  int counter = 1;\n      for (int x = 1; x < board.length; x++) {\n        if\
    \ (symbol.equals(board[x][y])) {\n          counter++;\n        }\n      }\n \
    \     if (counter == board.length) {\n        winner = symbol;\n        return\
    \ winner;\n      }\n    }\n  }\n  return winner;\n}\n```\n\nWe need the same logic\
    \ for all the ways to win: vertical, diagonal, so we need to abstract every case\
    \ in sub methods. Listing 10.1.7 shows the new `getWinner` method after refactoring.\n\
    \n#### Listing 10.1.7 – Board Class, getWinner method refactored\n```java\npublic\
    \ String getWinner() {\n  if (board == null)\n    throw new RuntimeException(\"\
    Board is not initialized\");\n  String winner = winnerInHorizonzalLine();\n  if\
    \ (winner != null) {\n    return winner;\n  } else {\n    winner = winnerInVerticalLine();\n\
    \    if (winner != null) {\n      return winner;\n    } else {\n      winner =\
    \ winnerInBottomLeft();\n      if (winner != null) {\n        return winner;\n\
    \      } else {\n        winner = winnerInTopLeft();\n        if (winner != null)\
    \ {\n          return winner;\n        } else {\n          // avoid iterating\
    \ the whole board every time to look for a draw\n          if (this.numOfPlays\
    \ == this.numOfAllowed) {\n            return DRAW_;\n          } else {\n   \
    \         return null;\n          }\n        }\n      }\n    }\n  }\n}\n```\n\n\
    The previous code shows how we introduce three new variables: A constant variable\
    \ `DRAW_ = \"DRAW!\"`; `numOfPlays` and `numOfAllowed` are declared as member\
    \ variables at `Board` Class; `numOfAllowed` is initialized at the `setSize` method:\
    \ `this.numOfAllowed = size * size`; and `numOfPlays` is incremented at the `putSymbol`\
    \ method: `this.numOfPlays++`.\n\nHere are the other ways to win.\n```java\nprivate\
    \ String winnerInVerticalLine() {\n  String winner = null;\n  for (int x = 0;\
    \ x < board.length; x++) {\n    String symbol = board[x][0];\n    if (symbol !=\
    \ EMPTY_) {\n      int counter = 1;\n      for (int y = 1; y < board.length; y++)\
    \ {\n        if (symbol.equals(board[x][y])) {\n          counter++;\n       \
    \ }\n      }\n      if (counter == board.length) {\n        winner = symbol;\n\
    \        return winner;\n      }\n    }\n  }\n  return winner;\n}\n\nprivate String\
    \ winnerInBottomLeft() {\n  String winner = null;\n  String symbol = board[0][0];\n\
    \  if (symbol != EMPTY_) {\n    int counter = 1;\n    for (int idx = 1; idx <\
    \ board.length; idx++) {\n      if (symbol.equals(board[idx][idx])) {\n      \
    \  counter++;\n      }\n    }\n    if (counter == board.length) {\n      winner\
    \ = symbol;\n      return winner;\n    }\n  }\n  return winner;\n}\n\nprivate\
    \ String winnerInDiagonalTopLeft() {\n  String winner = null;\n  String symbol\
    \ = board[0][board.length - 1];\n  if (symbol != EMPTY_) {\n    int counter =\
    \ 1;\n    for (int idx = 1; idx < board.length; idx++) {\n      if (symbol.equals(board[idx][board.length\
    \ - 1 - idx])) {\n        counter++;\n      }\n    }\n    if (counter == board.length)\
    \ {\n      winner = symbol;\n      return winner;\n    }\n  }\n  return winner;\n\
    }\n```\n\nNow let see the `Utils` Class, which loads the symbols and the size\
    \ of the `Board`.\n\n### Test case #5: Load file\nWe need a method that, given\
    \ a `Filename`, retrieves the content of that `File`. Listing 10.1.8 shows the\
    \ test case.\n\n#### Listing 10.1.8 – Utils Test Class\n```java\npublic class\
    \ UtilsTest {\n  private Utils utils;\n  @Before\n  public void setUp() {\n  \
    \  utils = new Utils();\n  }\n  @Rule\n  public ExpectedException thrownException\
    \ = ExpectedException.none();\n  @Test\n  public void whenFileExistsThenReturnContent()\
    \ throws Exception {\n    String content = utils.loadFile(\"board.txt\");\n  \
    \  assertNotNull(content);\n  }\n}\n```\n\nAssumes that our configuration files\
    \ are located under the project name. Listing 10.1.9 shows a `loadFile` implementation.\n\
    \n#### Listing 10.1.9 – Utils Class, loadFile method\n```java\npublic class Utils\
    \ {\n  public String loadFile(String fileName) throws Exception {\n    String\
    \ content;\n    try {\n      content = new String(Files.readAllBytes(Paths.get(fileName)));\n\
    \    } catch (IOException io) {\n      throw new RuntimeException(\"File \" +\
    \ fileName + \" not found\");\n    }\n    return content;\n  }\n}\n```\n\n###\
    \ Test case #6: Get the board size\nOnce a `Board` File is loaded, we need to\
    \ validate it includes valid content. Listing 10.1.10 shows the assumption about\
    \ how to validate the `Board` size. Based on the requirements, board size must\
    \ be a value between 3 and 9.\n\n#### Listing 10.1.10 – Utils Class, getBoardSize\
    \ Test case\n```java\n@Test\npublic void whenGetBoardSizeIs4ThenReturnSize() throws\
    \ Exception {\n  String content = utils.loadFile(\"board.txt\");\n  assertEquals(4,\
    \ utils.getBoardSize(content));\n}\n```\n"
