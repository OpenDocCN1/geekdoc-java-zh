  trans: "\n\n# 9.2 广度优先搜索 (BFS)\n\n实现广度优先搜索算法以遍历图数据结构。\n\n### 解决方案\n在广度优先搜索中，算法尽可能靠近起点。它访问所有与起始顶点相邻的顶点。算法使用\
    \ `queue`（队列）实现。\n\n图 9.2.1 显示了如果我们选择 `Berlin` 作为根节点时执行的一系列步骤。数字表示访问顶点的顺序。\n\n\
    ![](img/image_rsrc2M2.jpg)\n图 9.2.1 广度优先搜索 - 步骤序列\n\n广度优先搜索算法首先找到所有距离起始顶点一个边边的顶点，然后是所有距离两个边、三条边边的顶点，以此类推。这对于回答诸如从\
    \ `Berlin` 到 `München` 等其他城市的最短路径是什么这类的问题非常有用。\n\n我们遍历与 `Berlin` 距离一个边边的城市（第一层）：`Rostock`、`Magdeburg`\
    \ 和 `Leipzig`。然后我们遍历与 `Berlin` 距离两个边边的城市（第二层）：`Hannover`、`Nürnberg` 和 `Dresden`。接着我们遍历与\
    \ `Berlin` 距离三个边边的城市（第三层）：`Bremen`、`Dortmund` 和 `München`。这就是核心思想。在遍历另一条可能的路径：`Berlin`、`Magdeburg`、`Hannover`、`Dortmund`、`Frankfurt`、`Stuttgart`、`München`（对应于第六层）之前，我们已经找到了\
    \ `München`。\n\n### 添加边\n我们使用 `LinkedList` 数据结构来构建 `Adjacency List`（邻接表）。当单条边连接两个城市时，它们就是相邻或邻居关系。列表\
    \ 9.2.1 显示了 `addEdge` 方法。\n\n列表 9.2.1 - LinkedList, addEdge 方法\n```java\nprivate\
    \ LinkedList<Integer> adjList[];\npublic void addEdge(String city1, String city2)\
    \ {\n  int start = mapOfVertex.get(city1);\n  int end = mapOfVertex.get(city2);\n\
    \  adjList[start].add(end);\n  adjList[end].add(start);\n}\n```\n\n### 算法\n我们的\
    \ `bfs()` 方法接收 `City` 名称作为参数。然后我们在 `HashMap` 中定位该城市的索引，将其标记为已访问，并将其加入 `queue`\
    \ 中。\n\n我们遍历队列项直到其为空。以下是每次迭代中我们执行的操作：\n1. 我们获取并移除该 `queue` 的 `head`（头部）。\n2. 我们遍历该\
    \ `head` 的所有 `neighbors`（邻居），直到它们被访问。每个相邻顶点都被标记为已访问并加入 `queue`。\n3. 当迭代无法找到更多相邻顶点时，我们获取并移除新的\
    \ `head`。\n\n列表 9.2 – 广度优先搜索\n```java\nimport java.util.*;\nimport java.util.concurrent.ConcurrentHashMap;\n\
    \npublic class Graph {\n    private final int MAX_VERTEX;\n    private Vertex[]\
    \ arrayOfVertex; // cities\n    private Map<String, Integer> mapOfVertex; // Adjacency\
    \ list:\n    private LinkedList<Integer>[] adjList[]; // register the location\
    \ at arrayOfVertex:\n    private int numOfVertices;\n    private Queue<Integer>\
    \ queue;\n\n    public Graph(int vertices) {\n        MAX_VERTEX = vertices;\n\
    \        arrayOfVertex = new Vertex[MAX_VERTEX];\n        mapOfVertex = new ConcurrentHashMap<>();\n\
    \        numOfVertices = 0;\n        queue = new LinkedList<>();\n        adjList\
    \ = new LinkedList[MAX_VERTEX];\n        for (int i = 0; i < MAX_VERTEX; i++)\
    \ {\n            adjList[i] = new LinkedList();\n        }\n    }\n\n    public\
    \ void addVertex(Vertex city) {\n        mapOfVertex.put(city.getName(), numOfVertices);\n\
    \        arrayOfVertex[numOfVertices++] = city;\n    }\n\n    public void addEdge(String\
    \ city1, String city2) {\n        int start = mapOfVertex.get(city1);\n      \
    \  int end = mapOfVertex.get(city2);\n        adjList[start].add(end);\n     \
    \   adjList[end].add(start);\n    }\n\n    public void bfs(String city) {\n  \
    \      int vertex = mapOfVertex.get(city);\n        arrayOfVertex[vertex].setVisited(true);\n\
    \        System.out.print(city + \" \");\n        queue.add(vertex);\n\n     \
    \   // iterate until queue empty\n        while (!queue.isEmpty()) {\n       \
    \     int head = queue.remove();\n            int adjVertex;\n            // iterate\
    \ until it has unvisited cities\n            while ((adjVertex = getAdjVertex(head))\
    \ != -1) {\n                arrayOfVertex[adjVertex].setVisited(true);\n     \
    \           System.out.print(arrayOfVertex[adjVertex].getName() + \" \");\n  \
    \              queue.add(adjVertex);\n            }\n        }\n    }\n\n    private\
    \ int getAdjVertex(int vertex) {\n        LinkedList<Integer> linkedList = adjList[vertex];\n\
    \        for (int adj = 0; adj < linkedList.size(); adj++) {\n            if (arrayOfVertex[linkedList.get(adj)].isVisited()\
    \ == false) {\n                return linkedList.get(adj); //return first adjacent\
    \ vertex\n            }\n        }\n        return -1; //not vertices found\n\
    \    }\n\n    public Map<String, Integer> getMapOfVertex() {\n        return mapOfVertex;\n\
    \    }\n\n    public LinkedList<Integer>[] getAdjList() {\n        return adjList;\n\
    \    }\n}\n```\n\n```java\nclass GraphTest {\n    Graph graph;\n\n    @Before\n\
    \    public void setup() {\n        graph = new Graph(15);\n    }\n\n    @Test\n\
    \    public void test_addVertex() {\n        Vertex city = new Vertex(\"Berlin\"\
    );\n        graph.addVertex(city);\n        assertTrue(graph.getMapOfVertex().size()\
    \ == 1);\n    }\n\n    @Test\n    public void test_addEdge() {\n        String\
    \ city1 = \"Berlin\";\n        String city2 = \"Leipzig\";\n        Vertex v1\
    \ = new Vertex(city1);\n        Vertex v2 = new Vertex(city2);\n        graph.addVertex(v1);\
    \ //location 0\n        graph.addVertex(v2); // location 1\n        graph.addEdge(city1,\
    \ city2);\n        assertTrue(graph.getAdjList()[0].get(0) == 1);\n        assertTrue(graph.getAdjList()[1].get(0)\
    \ == 0);\n    }\n\n    @Test\n    public void test_bfs() {\n        String city1\
    \ = \"Berlin\"; String city2 = \"Leipzig\";\n        String city3 = \"Dresden\"\
    ; String city4 = \"Nürnberg\";\n        String city5 = \"Hannover\"; String city6\
    \ = \"Rostock\";\n        String city7 = \"Dortmund\"; String city8 = \"Frankfurt\"\
    ;\n        String city9 = \"Stuttgart\"; String city10 = \"München\";\n    }\n\
    }\n```\n\n"
