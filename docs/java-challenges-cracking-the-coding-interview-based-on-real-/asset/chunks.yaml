    \ O Notation\n\n`Big O Notation` is a mathematical function that helps us analyze\
    \ how complex an algorithm is in time and space. It matters when we build an application\
    \ for millions of users.\n\n## Time and Space Complexity\n`Time complexity` is\
    \ related to how many steps take the algorithm. `Space complexity` is related\
    \ to how efficient the algorithm is using the memory and disk. We can analyze\
    \ the complexity based on three cases:\n\n- Best case or `Ω(n)`: Usually, the\
    \ algorithm executes independently of the input size in one step.\n- Average case\
    \ or `Θ(n)`: When the input size is random.\n- Worst-case `O(n)`: Gives us an\
    \ upper bound on the runtime for any input. It gives us a kind of guarantee that\
    \ the algorithm will never take longer with a new input size.\n\n## Order of Growth\
    \ of Common Algorithms\nThe order of growth is related to how the runtime of an\
    \ algorithm increases when the input size increases without limit and tells us\
    \ how efficient the algorithm is. We can compare the relative performance of alternative\
