    ### 解决方案\n通过不断将搜索范围一分为半来对排序数组进行搜索。如果元素 `X` 小于区间中间的元素，则将范围缩小到下半部分。否则，将范围缩小到上半部分。重复检查，直到找到该值或区间为空。图\
    \ 5.4 显示了搜索 `21` 时的迭代过程。时间复杂度为 `O (log n)`。如果我们传入一个包含 40 亿个元素的数组，最多只需要 32 次比较。列表\
    \ 5.4 显示了该算法。\n\n![](img/image_rsrc2KR.jpg)\n图 5.4 二分查找示例\n\n### 列表 5.4 二分查找\n\
    ```java\npublic class BinarySearch {\n    public static <T extends Comparable<T>>\
    \ boolean search(T target, T[] array) {\n        if (array == null || array.length\
    \ <= 0)\n            return false;\n        int min = 0;\n        int max = array.length\
    \ - 1;\n        while (min <= max) {\n            int mid = (min + max) / 2;\n\
    \            if (target.compareTo(array[mid]) < 0) {\n                max = mid\
    \ - 1;\n            } else if (target.compareTo(array[mid]) > 0) {\n         \
    \       min = mid + 1;\n            } else {\n                return true;\n \
    \           }\n        }\n        return false;\n    }\n}\n```\n\n### 测试\n```java\n\
