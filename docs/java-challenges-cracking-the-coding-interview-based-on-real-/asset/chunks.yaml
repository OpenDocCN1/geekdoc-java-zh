    \n## 3.5 验证一个数字是否是某个基数的有效幂\n\n在数学中，函数是一个将独立变量（定义域）映射到依赖变量（值域）的表达式。函数式编程（FP）强调产生的结果仅取决于其输入而不依赖程序状态的函数——即纯数学函数。\n\
    \nJava 实现函数式编程的方法之一是定义函数式接口。Java 中的函数式接口只有一个抽象方法。我们可以使用 Java 8 库提供的函数式组件，例如 `Java.util.function.BiFunction<T,\
    \ U, R>`，它接受两个参数并产生一个结果。\n\n```java\nBiFunction<Integer, Integer, Integer> sum\
    \ = (x1, x2) -> x1 + x2;\nInteger result = sum.apply(2, 3);\nSystem.out.println(result);\
    \ // 5\n```\n\n幂运算涉及两个数字：基数 `b` 和指数或幂 `n`。幂运算对应于基数的 `n` 次重复乘法。例如，在以下表达式 $3⁵ =\
    \ 243$ 中，我们说 $243$ 是 $3$ 的五次方。因此，$243$ 是 $3$ 的正确幂。\n\n### 解决方案\n我们通过逆运算来验证一个数字是否是另一个数（基数）的有效\
    \ `nth` 次幂。将给定数字除以基数并判断余数是否为 0，然后重复此操作直到找到值为 1。否则，如果剩余不是 0，则给定数字不是基数的有效 `nth`\
    \ 次幂。列表 3.5 显示了一个函数，当给定数字是基数的正确幂时，该函数返回 true。\n\n列表 3.5 – 验证一个数字是否是某个基数的有效幂\n\
    ```java\npublic class IsNumberAValidPowerOfBase implements BiFunction<Integer,\
    \ Integer, Boolean> {\n  @Override\n  public Boolean apply(Integer number, Integer\
    \ base) {\n    return isNumberAValidPowerOfBase(number, base);\n  }\n\n  static\
    \ boolean isNumberAValidPowerOfBase(int number, int base) {\n      if (number\
    \ == 0)\n        return true;\n      while (number != 1) {\n        if ((number\
    \ % base) != 0)\n          return false;\n        number = number / base;\n  \
    \    }\n      return true;\n    }\n}\n```\n\n```java\npublic class IsNumberAValidPowerOfBaseTest\
    \ {\n  private IsNumberAValidPowerOfBase isNumberAValidPowerOfBase;\n\n  @Before\n\
    \  public void before() {\n    isNumberAValidPowerOfBase = new IsNumberAValidPowerOfBase();\n\
    \  }\n\n  @Test\n  public void testOfWrongReturnValues() {\n    assertFalse(isNumberAValidPowerOfBase.apply(6,\
    \ 2));\n    assertFalse(isNumberAValidPowerOfBase.apply(16, 5));\n    assertFalse(isNumberAValidPowerOfBase.apply(14,\
    \ 7));\n  }\n\n  @Test\n  public void testOfValidReturnValues() {\n    assertTrue(isNumberAValidPowerOfBase.apply(243,\
    \ 3));\n    assertTrue(isNumberAValidPowerOfBase.apply(16, 4));\n    assertTrue(isNumberAValidPowerOfBase.apply(125,\
    \ 5));\n  }\n}\n```\n\n## 3.6 验证一个数字是否为质数\n\n质数是一个大于 1 的整数，它的因子只有 1 和它本身。因子是可以被整除另一个数字的整数。例如：2,\
    \ 3, 5, 7, 11 都是质数。\n\n### 解决方案\n简单的解决方案是从给定数字 `n` 的一半开始递减遍历所有数字，对于每个数字，检查它是否能整除\
    \ `n`。如果我们找到任何可以整除的数字，则返回 false。否则，返回 true。列表 3.6 显示了该算法。\n\n列表 3.6 – 验证一个数字是否为质数\n\
    ```java\npublic class MathUtils {\n  public static boolean isPrimeNumber(int number)\
    \ {\n    if (number < 2)\n      return false;\n    if (number == 2)\n      return\
    \ true;\n    for (int div = (number / 2) + 1; div > 1; div--) {\n      if (number\
    \ % div == 0) {\n        return false;\n      }\n    }\n    return true;\n  }\n\
    }\n```\n\n```java\npublic class IsPrimeNumberTest {\n  @Test\n  public void notPrimeNumbers()\
    \ {\n    assertFalse(MathUtils.isPrimeNumber(-1));\n    assertFalse(MathUtils.isPrimeNumber(65));\n\
    \    assertFalse(MathUtils.isPrimeNumber(4));\n    assertFalse(MathUtils.isPrimeNumber(100));\n\
    \  }\n\n  @Test\n  public void primeNumbers() {\n    assertTrue(MathUtils.isPrimeNumber(2));\n\
    \    assertTrue(MathUtils.isPrimeNumber(3));\n    assertTrue(MathUtils.isPrimeNumber(5));\n\
    \    assertTrue(MathUtils.isPrimeNumber(7));\n    assertTrue(MathUtils.isPrimeNumber(11));\n\
    \  }\n}\n```\n\n## 3.7 计算两个点之间的距离\n\n给定两个点，计算它们之间的距离。\n\n### 解决方案\n`Point` 具有坐标。列表\
    \ 3.7 显示了算法。\n\n图 3.7 - 两个点之间的距离\n```java\npublic class Point {\n  final double\
    \ x;\n  final double y;\n\n  Point(double x, double y) {\n    this.x = x;\n  \
    \  this.y = y;\n  }\n\n  public double distance(Point point) {\n    return Math.sqrt(Math.pow(this.x\
    \ - point.x, 2) + Math.pow(this.y - point.y, 2));\n  }\n}\n```\n\n```java\n@Test\n\
    public void given_twoPoints_return_distance() {\n  Point point1 = new Point(0,\
    \ 0);\n  Point point2 = new Point(3, 4);\n  assertEquals(5.0, point1.distance(point2));\n\
    }\n```\n\n## 3.8 编写一个不可变类来转换货币\n\n设计一个 `Money` 类，可以在欧元和美元之间转换。例如，编写具有以下值的实例：67.89\
    \ EUR 和 98.76 USD\n\n### 解决方案\n不可变类的实例不可被修改。其信息在对象的生命周期内是固定的。要使类变为不可变，我们需要遵循以下规则：\n\
    - 不要包含可以修改对象状态的方法。\n- 不要允许扩展类。\n- 将所有类成员标记为 `final` 和 `private`。\n- 确保可变组件的排他访问。对这些对象进行防御拷贝。\n\
    \n不可变对象是线程安全的；不需要同步。我们使用 `BigDecimal` 数据类型来实现类，因为它提供了数值运算、舍入，并可以处理大量的浮点数。列表 3.8\
    \ 显示了一个不可变类。\n\n```java\nimport java.math.BigDecimal;\n\npublic final class Money\
    \ {\n  private static final String DOLAR = \"USD\";\n  private static final String\
    \ EURO = \"EUR\";\n  private static int ROUNDING_MODE = BigDecimal.ROUND_HALF_EVEN;\n\
    \  private static int DECIMALS = 2;\n  private BigDecimal amount;\n  private String\
    \ currency;\n\n  public Money() {}\n\n  public static Money valueOf(\n      BigDecimal\
    \ amount,\n      String currency) {\n    return new Money(amount, currency);\n\
    \  }\n\n  // 调用者看不到此私有构造函数\n  private Money(\n      BigDecimal amount,\n     \
    \ String currency) {\n    this.amount = amount;\n    this.currency = currency;\n\
    \  }\n\n  // 货币转换\n  public Money multiply(BigDecimal factor) {\n    return Money.valueOf(\n\
    \      rounded(this.amount.multiply(factor)),\n      this.currency.equals(DOLAR)\
    \ ? EURO : DOLAR);\n  }\n\n  // 保留两位小数\n  private BigDecimal rounded(BigDecimal\
    \ amount) {\n    return amount.setScale(DECIMALS, ROUNDING_MODE);\n  }\n}\n```\n\
    \n"
- fmt: "\n```java\npublic String getCurrency() {\n    return currency;\n}\n```\n\n\
    The `String` class produces immutable objects, so we can trust any client who\
