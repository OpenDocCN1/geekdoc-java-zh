    \ in an Array\n\nGiven an array, find the most frequent elements in the array.\n\
    \n### Solution\nFirstly, create a hash table. Secondly, iterate the array and\
    \ store elements and their frequency as key-value pairs. Then, traverse the hash\
    \ table and inverse the order with the maximum frequency on top. Finally, traverse\
    \ the previous hash table, and build a list of the elements with maximum frequencies.\
    \ Listing 7.2 shows the algorithm.\n\n### Listing 7.2 – Return the most frequent\
    \ elements of an array\n```java\nimport static java.util.stream.Collectors.*;\n\
    \npublic class ArrayUtils {\n\n  public static int[] mostFrecuent(int[] array)\
    \ {\n    Map<Integer, Integer> mapFrecuencyByElement = new HashMap<>();\n\n  \
    \  for (int element : array) {\n      Integer frecuency = mapFrecuencyByElement.get(element);\n\
    \      mapFrecuencyByElement.put(element, frecuency == null ? 1 : frecuency +\
    \ 1);\n    }\n    Map<Integer, Integer> mapOrderedByTopFrecuency= mapFrecuencyByElement\n\
    \          .entrySet()\n          .stream()\n          .sorted(Collections.reverseOrder(Map.Entry.comparingByValue()))\n\
    \          .collect(\n              toMap(Map.Entry::getKey, Map.Entry::getValue,\
    \ (e1, e2) -> e2,\n                  LinkedHashMap::new)\n          );\n    List<Integer>\
    \ result = new ArrayList<>();\n    int idx = 0; //to iterate the result list\n\
    \n    for (Map.Entry<Integer, Integer> entry :mapOrderedByTopFrecuency.entrySet())\
    \ {\n      if (idx > 0) {\n        //continue if exists same frequencies\n   \
    \     if (entry.getValue().equals(result.get(idx - 1))) {\n          result.add(entry.getKey());\n\
    \        } else {\n          break;\n        }\n      } else {\n        result.add(entry.getKey());\n\
    \      }\n      idx++;\n    }\n    int[] mostFrecuent = result.stream().mapToInt(i\
    \ -> i).toArray();\n    return mostFrecuent;\n  }\n}\n```\n\n### Tests\n```java\n\
