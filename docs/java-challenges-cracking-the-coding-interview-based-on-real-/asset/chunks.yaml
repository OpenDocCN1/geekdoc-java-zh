  trans: "\n# 大 O 表示\n\n`Big O Notation` 是一个数学函数，帮助我们分析算法在时间和空间上的复杂度。当我们为数百万用户构建应用程序时，这一点非常重要。\n\
    \n## 时间和空间复杂度\n`时间复杂度`与算法执行所需的步数有关。`空间复杂度`与算法使用内存和磁盘的效率有关。我们可以根据三种情况分析复杂度：\n\n\
    - 最佳情况或 `Ω(n)`：通常，算法在一步内独立于输入大小执行。\n- 平均情况或 `Θ(n)`：输入大小为随机时。\n- 最坏情况 `O(n)`：为任何输入提供运行时间的上限。它向我们保证算法在新的输入大小下永远不会更长时间。\n\
    \n## 常用算法的增长阶\n增长阶与输入大小无限制增加时算法运行时间的增加情况有关，并告诉我们算法的效率。我们可以比较替代算法的相对性能。\n\n![图\
    \ A.1](img/image_rsrc2M6.jpg)\n*图 A.1 大 O 表示 - 增长阶*\n\n## 大 O 示例\n### `O(1)` -\
    \ 常数时间\n无论输入包含 1000 个还是 100 万个元素，代码始终在一步内执行。\n\n```java\npublic class BigONotation\
    \ {\n  public void constant(List<String> list, String item) {\n    list.add(item);\n\
    \  }\n}\n```\n\n## 单元测试\n\n```java\n  public void whenSizeThenSetupBoardSize()\
    \ throws Exception {\n    board.setSize(10);\n    assertEquals(10, board.getBoard().length);\n\
    \  }\n\n@Test\n  public void whenPutCharacterWrongCoordinateThenThrowError() throws\
    \ Exception {\n    board.setSize(4);\n    thrownException.expect(RuntimeException.class);\n\
    \    board.putSymbol(1, 5, \"X\");\n  }\n\n@Test\n  public void whenCoordinateIsValidThenPutCharacterIsOk()\
    \ throws Exception {\n    board.setSize(3);\n    board.putSymbol(1, 2, \"X\");\n\
    \    assertEquals(\"X\", board.getBoard()[0][1]);\n  }\n\n@Test\n  public void\
    \ whenCoordinatesAreBusyThenPutCharacterThrowError() throws Exception {\n    board.setSize(3);\n\
    \    board.putSymbol(1, 2, \"X\");\n    thrownException.expect(RuntimeException.class);\n\
    \    board.putSymbol(1, 2, \"O\");\n  }\n\n@Test\n  public void whenCoordinatesAreNotBusyThenPutSymbol()\
    \ throws Exception {\n    board.setSize(3);\n    board.putSymbol(1, 2, \"X\");\n\
    \    board.putSymbol(2, 3, \"O\");\n    assertEquals(\"O\", board.getBoard()[1][2]);\n\
    \  }\n\n@Test\n  public void whenBoardIsNullThenPrintThrowsError() {\n    thrownException.expect(RuntimeException.class);\n\
    \    board.print();\n  }\n\n@Test\n  public void whenBoardIsNotNullThenPrintIsPossible()\
    \ {\n    board.setSize(10);\n    board.print();\n  }\n\n@Test\n  public void horizontalLineIsNotSameSymbolThenReturnNull()\
    \ {\n    board.setSize(3);\n    board.putSymbol(2, 2, \"X\");\n    board.putSymbol(1,\
    \ 2, \"O\");\n    board.putSymbol(1, 3, \"X\");\n    board.putSymbol(2, 1, \"\
    O\");\n    board.putSymbol(3, 2, \"X\");\n    board.print();\n    assertEquals(null,\
    \ board.getWinner());\n  }\n\n@Test\n  public void horizontalLineFilledThenWinnerX()\
    \ {\n    board.setSize(3);\n    board.putSymbol(1, 1, \"X\");\n    board.putSymbol(1,\
    \ 2, \"O\");\n    board.putSymbol(2, 1, \"X\");\n    board.putSymbol(2, 3, \"\
    O\");\n    board.putSymbol(3, 1, \"X\");\n    board.print();\n    assertEquals(\"\
    X\", board.getWinner());\n  }\n\n@Test\n  public void horizontalLineFilledThenWinnerO()\
    \ {\n    board.setSize(4);\n    board.putSymbol(1, 1, \"X\");\n    board.putSymbol(1,\
    \ 4, \"O\");\n    board.putSymbol(2, 1, \"X\");\n    board.putSymbol(2, 4, \"\
    O\");\n    board.putSymbol(3, 1, \"X\");\n    board.putSymbol(3, 4, \"O\");\n\
    \    board.putSymbol(3, 3, \"X\");\n    board.putSymbol(4, 4, \"O\");\n    board.print();\n\
    \    assertEquals(\"O\", board.getWinner());\n  }\n\n@Test\n  public void verticalLineIsSameSymbolThenReturnWinnerX()\
    \ {\n    board.setSize(3);\n    board.putSymbol(2, 1, \"X\");\n    board.putSymbol(1,\
    \ 3, \"O\");\n    board.putSymbol(2, 2, \"X\");\n    board.putSymbol(3, 3, \"\
    O\");\n    board.putSymbol(2, 3, \"X\");\n    board.print();\n    assertEquals(\"\
    X\", board.getWinner());\n  }\n\n@Test\n  public void diagonalLineSymbolThenWinnerX()\
    \ {\n    board.setSize(3);\n    board.putSymbol(1, 1, \"X\");\n    board.putSymbol(1,\
    \ 2, \"O\");\n    board.putSymbol(2, 2, \"X\");\n    board.putSymbol(2, 1, \"\
    O\");\n    board.putSymbol(3, 3, \"X\");\n    board.print();\n    assertEquals(\"\
    X\", board.getWinner());\n  }\n\n@Test\n  public void diagonalLineSymbolThenWinnerO()\
    \ {\n    board.setSize(3);\n    board.putSymbol(1, 1, \"X\");\n    board.putSymbol(1,\
    \ 3, \"O\");\n    board.putSymbol(3, 2, \"X\");\n    board.putSymbol(2, 2, \"\
    O\");\n    board.putSymbol(3, 3, \"X\");\n    board.putSymbol(3, 1, \"O\");\n\
    \    board.print();\n    assertEquals(\"O\", board.getWinner());\n  }\n\n@Test\n\
    \  public void diagonalLineSymbolThenWinnerX_2() {\n    board.setSize(5);\n  \
    \  board.putSymbol(1, 1, \"O\");\n    board.putSymbol(1, 5, \"X\");\n    board.putSymbol(3,\
    \ 2, \"O\");\n    board.putSymbol(2, 4, \"X\");\n    board.putSymbol(3, 4, \"\
    O\");\n    board.putSymbol(3, 3, \"X\");\n    board.putSymbol(1, 2, \"O\");\n\
    \    board.putSymbol(4, 2, \"X\");\n    board.putSymbol(5, 3, \"O\");\n    board.putSymbol(5,\
    \ 1, \"X\");\n    board.print();\n    assertEquals(\"X\", board.getWinner());\n\
    \  }\n\n@Test\n  public void whenIsDrawThenTrue() {\n    board.setSize(3);\n \
    \   board.putSymbol(1, 1, \"X\");\n    board.putSymbol(1, 2, \"O\");\n    board.putSymbol(3,\
    \ 2, \"X\");\n    board.putSymbol(2, 2, \"X\");\n    board.putSymbol(3, 3, \"\
    O\");\n    board.putSymbol(2, 1, \"O\");\n    board.putSymbol(1, 3, \"X\");\n\
    \    board.putSymbol(3, 1, \"O\");\n    board.putSymbol(2, 3, \"X\");\n    board.print();\n\
    \    assertEquals(\"DRAW!\", board.getWinner());\n  }\n}\n\npublic class UtilsTest\
    \ {\n  private Utils utils;\n\n  @Before\n  public void setUp() {\n    utils =\
    \ new Utils();\n  }\n\n  @Rule\n  public ExpectedException thrownException = ExpectedException.none();\n\
    \n  @Test\n  public void whenFileNotExistsThenThrowError() throws Exception {\n\
    \    thrownException.expect(RuntimeException.class);\n    utils.loadFile(\"board2.txt\"\
    );\n  }\n\n  @Test\n  public void whenFileExistsThenReturnContent() throws Exception\
    \ {\n    String content = utils.loadFile(\"symbols.txt\");\n    assertNotNull(content);\n\
    \  }\n}\n```\n"
- fmt: "\n# O(N) – Linear\nOur algorithm runs in `O(N)` time if the number of steps\
    \ depends on the number of items included in the input.\n\n```java\npublic int\
    \ sum(int[] numbers) {\n  int sum =0;\n  for (int i =0; i<numbers.length; i++)\
    \ {\n    sum+=numbers[i];\n  }\n  return sum;\n}\n\n@Test\npublic void test_linearTime()\
    \ {\n  final int[] numbers = {1, 2, 4, 6, 1, 6};\n  assertTrue(bigONotation.sum(numbers)\
    \ == 20);\n}\n```\n\n# O(N2) – Quadratic\nWhen we have two loops nested in our\
    \ code, we say it runs in quadratic time `O(N2)`. For example, when a 2D matrix\
    \ is initialized in a tic-tac-toe game. \n\n```java\nprivate String [][] board;\n\
    public void initializeBoard(int size) {\n  this.board = new String[size][size];\n\
    \  for (int x = 0; x < size; x++) {\n    for (int y = 0; y < size; y++) {\n  \
    \    board[x][y] = \" \";\n    }\n  }\n}\n\n@Test\npublic void test_quadraticTime()\
    \ {\n  bigONotation.initializeBoard(3);\n}\n```\n\n# O(N3) - Cubic\nWe say that\
    \ our algorithm runs in Cubic time when the code includes at the most three nested\
    \ loops. For example, given N integers, how many triples sum to precisely zero?\
    \ One approach (not the best) is to use three nested loops.\n\n```java\npublic\
    \ int countThreeSum(int[] numbers) {\n  int N =numbers.length;\n  int count =0;\n\
    \  for (int i = 0; i<N; i++)\n    for (int j = i+1; j<N; j++)\n      for (int\
    \ k = j+1; k<N; k++)\n        if (numbers[i] + numbers[j] + numbers[k] == 0)\n\
    \          count++;\n  return count;\n}\n\n@Test\npublic void test_countThreeSum()\
    \ {\n  final int[] numbers = {30, -40, -20, -10, 40, 0, 10, 5};\n  assertTrue(bigONotation.countThreeSum(numbers)\
    \ == 4);\n}\n```\n\n# O(LogN) – Logarithmic\nThis kind of algorithm produces a\
    \ growth curve that peaks at the beginning and slowly flattens out as the size\
    \ of the input increase.\n\n`Log28 = 3`\n`Log216 = 4`\n`Log232 = 5`\n\nThe `[binary\
    \ search](#part0010.xhtml_a2F6)` uses at most `LogN` key compares to search in\
    \ a sorted array of size `N`. With eight elements, it takes three comparisons,\
    \ with 16 elements takes four comparisons, with 32 elements takes five comparisons,\
    \ and so on.\n\n# How to Find the Time Complexity of an Algorithm\nTo find the\
    \ Big O complexity of an algorithm follows the following rules:\n\n*   Ignore\
    \ the lower order terms\n*   Drop the leading constants\n\n**Example**: If the\
    \ time complexity of an algorithm is `2n3 + 4n + 3`. Its Big O complexity simplifies\
    \ to `O(n3)`.\n\n**Example**: Given the following algorithm:\n\n```java\npublic\
    \ Integer sumEvenNumbers(Integer N) {\n  int sum = 0;\n  for (int number = 1;\
    \ number <= N; number++)\n    if ((number % 2) == 0)\n      sum = sum + number;\n\
    \  return sum;\n}\n```\n\nFirst, we split the code into individual operations\
    \ and then compute how many times it is being executed, as is shown in the following\
    \ table.\n\n| Operation | Number of executions |\n| :--- | :--- |\n| `int sum\
    \ = 0;` | 1 |\n| `int number = 1;` | 1 |\n| `number <= N;` | N |\n| `number++`\
    \ | N |\n| `if ((number % 2) == 0)` | N |\n| `sum = sum + number;` | N |\n| `return\
    \ sum;` | 1 |\n\nNow, we need to sum how many times each operation is executing.\n\
    Time complexity = `1 + 1 + N + N + N + N + 1` => `4N + 3`\n\n# Why Big O Notation\
    \ ignores Constants?\nBig O Notation describes how many steps are required relative\
    \ to the number of data elements. And it serves as a way to classify the long-term\
    \ growth rate of algorithms.\n\nFor instance, `O(N)` will be faster than `O(N2)`\
    \ for all amounts of data, as shown in Figure A.2.![](image_rsrc2M7.jpg)\nFigure\
    \ A.2 `O(N)` is faster than `O(N2)` for all amounts of data.\n\nNow, if we compare\
    \ `O(100N)` with `O(N2)`, we can see that `O(N2)` is faster than `O(100N)` for\
    \ some amounts of data, as shown in Figure A.3.![](image_rsrc2M8.jpg)\nFigure\
    \ A.3 `O(N2)` is faster than `O(100N)` for some amounts of data.\n\nBut after\
    \ a point, `O(100N)` becomes faster and remains faster for all increasing amounts\
    \ of data from that point onward. And that is the reason why Big O Notation ignores\
    \ constants. Because of this, `O(100N)` is written as `O(N)`.\n"
