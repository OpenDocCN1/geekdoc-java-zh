    \ chars.length is 100, then,Total time:O(1)+O(1)+O(100/2)+O(1)= 1+1+50+1 = 53But\
    \ 53 ≈ 50 → (N/2)If 50 executions depend on N/2, and N/2 depend on NThen, we can\
    \ say that 50 executions depend on N as well.When  chars.length is 100000, then,Total\
    \ time:O(1)+O(1)+O(100000/2)+O(1)= 1+1+50000+1 = 50003But 50003 ≈ 50000 → (N/2)If\
    \ 50000 executions depend on N/2, and N/2 depend on NThen, we can say that 50000\
    \ executions depend on N as well.Therefore, we can say that our Reverse Text algorithm\
    \ runs in O(N) time.1.2 Validate If a String Has All Unique CharactersGiven a\
    \ string of characters, validate if all of them are unique.SolutionWe assume the\
    \ charset is ASCII, but you should always ask interviewers if you are unsure.\
    \ Originally based on the English alphabet, ASCII encodes 128 specified characters\
    \ into seven-bit integers. Ninety-five of the encoded characters are printable:\
    \ these include the digits 0 to 9, lowercase letters a to z, uppercase letters\
    \ A to Z, and punctuation symbols.Firstly, create a Boolean array to store the\
    \ occurrence of every characterSecondly, iterate the String of characters, use\
    \ the java charAt method to return the numerical representation for every character.\
    \ Check this value in the Boolean array. If it exists, then the string does not\
    \ has unique values. Otherwise, store this value in the Boolean array as its first\
    \ occurrence.Finally, if all characters had only one occurrence in the Boolean\
    \ array, the String has all unique characters. Listing 1.2 shows the algorithm.Listing\
    \ 1.3 – Validate if a String Has All Unique Characterspublic class StringUtils\
    \ {\n\n  public static boolean areUniqueChars(String str) {\n\n    if (str.length()\
    \ > 128)\n\n      return false;\n\nboolean[] booleans = new boolean[128];\n\n\
        for (int idx = 0; idx < str.length(); idx++) {\n\n      int value = str.charAt(idx);\n\
    \n      if (booleans[value]) { //is found?\n\n        return false;\n\n      }\n\
    \n      booleans[value] = true;\n\n    }\n\n    return true;\n\n  }\n\n}Testspublic\
    \ class AreUniqueCharsTest {\n\n  @Test\n\n  public void is_not_UniqueChars()\
    \ {\n\n    assertFalse(StringUtils.areUniqueChars(\"29s2\"));\n\n    assertFalse(StringUtils.areUniqueChars(\"\
    1903aio9p\"));\n\n  }\n\n  @Test\n\n  public void is_UniqueChars() {\n\n    assertTrue(StringUtils.areUniqueChars(\"\
    29s13\"));\n\n    assertTrue(StringUtils.areUniqueChars(\"2813450769\"));\n\n\
      }\n\n}1.3 Validate If a String Is a PalindromeA palindrome is a string that\
    \ reads the same forward and backward, for example, level, wow, and madam.SolutionWe\
    \ can loop through each character and check it against another one on the opposite\
    \ side. If one of these checks fails, then the text is not Palindrome. Listing\
    \ 1.4 shows the algorithm.Listing 1.4 – Validate If a String Is a Palindromepublic\
    \ class StringUtils {\n\n  public static boolean isPalindrome(String text) {\n\
    \n    final int length = text.length();\n\n    for (int idx = 0; idx < length\
    \ / 2; idx++) {\n\n      if (text.charAt(idx) != text.charAt(length - 1 - idx))\n\
    \n        return false;\n\n    }\n\n    return true;\n\n  }\n\n}Testspublic class\
    \ IsPalindromeTest {\n\n  @Test\n\n  public void is_not_palindrome() {\n\n    assertFalse(StringUtils.isPalindrome(\"\
    2f1\"));\n\n    assertFalse(StringUtils.isPalindrome(\"-101\"));\n\n  }\n\n  @Test\n\
    \n  public void is_palindrome() {\n\n    assertTrue(StringUtils.isPalindrome(\"\
    2f1f2\"));\n\n    assertTrue(StringUtils.isPalindrome(\"-101-\"));\n\n    assertTrue(StringUtils.isPalindrome(\"\
    9\"));\n\n    assertTrue(StringUtils.isPalindrome(\"99\"));\n\n    assertTrue(StringUtils.isPalindrome(\"\
    madam\"));\n\n  }\n\n}1.4 Compare Application Version NumbersSemantic versioning\
    \ is a formal convention for specifying compatibility using a three-part version\
    \ number: major version, minor version, and patch. Minor changes and bug fixes\
    \ increment the patch number, which does not change the software's application\
    \ programming interface (API). Given version1 and version2, returns:* -1 if version1\
    \ < version2*  1 if version1 > version2*  0 if version1 == version2SolutionFirstly,\
    \ we must split the version number into its components. Since the input is in\
    \ the form of strings, there is a need to divide them, given the dot delimiter\
    \ that separates them to convert them to int arrays.Secondly, we must iterate\
    \ the arrays while it has not achieved at least one of the lengths of the arrays.\
    \ Compare each component from the left to the right side. If one version contains\
    \ one more component than the other one, then check that a value of 0 in that\
    \ additional component is not representative.Finally, we return 0 (equals) when\
    \ versions were not different during the iteration. Listing 1.5 shows the algorithm.![](image_rsrc2KG.jpg)Figure\
    \ 1.5 Compare application version numbersListing 1.5 – Compare Application Version\
    \ Numberspublic class VersionNumber {\n\n public static int compare(String v1,\
    \ String v2) {\n\nint[] a1 = Arrays.stream(v1.split(\"\\\\.\"))\n\n      .map(String::trim)\n\
    \n      .mapToInt(Integer::parseInt).toArray();\n\n    int[] a2 = Arrays.stream(v2.split(\"\
    \\\\.\"))\n\n      .map(String::trim)\n\n      .mapToInt(Integer::parseInt).toArray();\n\
    \n    int idx = 0;\n\n    while (idx < a1.length || idx < a2.length) {\n\n      if\
    \ (idx < a1.length && idx < a2.length) {\n\n        if (a1[idx] < a2[idx]) {\n\
    \n          return -1;\n\n        } else if (a1[idx] > a2[idx]) {\n\n          return\
    \ 1;\n\n        }\n\n      } else if (idx < a1.length) {\n\n        if (a1[idx]\
    \ != 0) {\n\n          return 1;\n\n        }\n\n      } else if (idx < a2.length)\
    \ {\n\n        if (a2[idx] != 0) {\n\n          return -1;\n\n        }\n\n      }\n\
    \n      idx++;\n\n    }\n\n    return 0;\n\n  }\n\n}Tests@Test\n\npublic void\
    \ versionNumber_usesCases() {\n\n  assertEquals(0, VersionNumber.compare(\"15\"\
    , \"15.0\"));\n\n  assertEquals(0, VersionNumber.compare(\"10.1\", \"10.1.0\"\
    ));\n\n  assertEquals(-1, VersionNumber.compare(\"10.1\", \"10.1.1\"));\n\n  assertEquals(1,\
    \ VersionNumber.compare(\"10.1.2\", \"10.1.1\"));\n\n}1.5 Remove Duplicates from\
    \ a ListWrite a program to check if a list has any duplicates, and if it does,\
    \ it removes them.SolutionMaybe your first idea is to iterate through the list.\
    \ You compare every item with the other ones. If a duplicate is detected, then\
    \ it is removed. Or maybe you traverse the list and store the first occurrence\
    \ of the item in a new collection and ignore all the next occurrences of that\
    \ item. Those solutions are called brute force algorithms because they use straightforward\
    \ methods of solving a problem, but sometimes what the interviewer expects is\
    \ to reuse the libraries included in the JDK, which improves efficiency.We use\
    \ Set from the Collections library. By definition, Set does not allow duplicates.\
    \ Then, use the sort method to order it.A Comparable interface sorts lists of\
    \ custom objects in natural ordering. List of Objects that already implement Comparable\
    \ (e.g., String) can be sorted automatically by Collections.sort.LinkedHashSet\
    \ (Collection list) is used to initialize a HashSet with the list items, removing\
    \ the duplicates. Listing 1.5 shows this implementation.Listing 1.6 – Remove Duplicates\
    \ from a Listpublic class ListUtils {\n\n  public static <E extends Comparable<E>>\n\
    \n    List<E> removeDuplicatesAndOrder(List<E> list) {\n\n      Set<E> set = new\
    \ LinkedHashSet<>(list);\n\n      ArrayList<E> arrayList = new ArrayList<>(set);\n\
    \n      Collections.sort(arrayList);\n\n      return arrayList;\n\n  }\n\n}Tests@Test"
