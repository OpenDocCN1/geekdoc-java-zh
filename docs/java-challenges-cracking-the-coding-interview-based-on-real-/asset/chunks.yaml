    \ 90 度\n\n给定一个正方矩阵，将其顺时针旋转 90 度。\n\n### 解决方案\n我们构建了两个 `for` 循环，外层循环每次迭代处理矩阵的一层，内层循环处理层内元素的旋转。我们进行\
    \ `n/2` 次循环来旋转元素。在每个正方形循环中，我们使用临时变量将元素与矩阵中对应的单元进行交换。列表 1.7 显示了该算法。\n\n![](img/image_rsrc2KH.jpg)\n\
    图 1.7 矩阵旋转 90 度\n\n### 列表 1.7 – 矩阵旋转 90 度\n```java\npublic class MatrixUtils {\n\
    \  public static void rotate(int[][] matrix) {\n    int n = matrix.length;\n \
    \   if (n <= 1)\n      return;\n    /* 层 */\n    for (int i = 0; i < n / 2; i++)\
    \ {\n      /* 元素 */\n      for (int j = i; j < n - i - 1; j++) {\n        // 顺时针交换元素\n\
    \        //temp = 左上\n        int temp = matrix[i][j];\n        // 左上 <- 左下\n\
    \        matrix[i][j] = matrix[n - 1 - j][i];\n        // 左下 <- 右下\n        matrix[n\
    \ - 1 - j][i] = matrix[n - 1 - i][n - 1 - j];\n        // 右下 <- 右上\n        matrix[n\
    \ - 1 - i][n - 1 - j] = matrix[j][n - 1 - i];\n        // 右上 <- 左上\n        matrix[j][n\
    \ - 1 - i] = temp;\n      }\n    }\n  }\n}\n```\n\n### 测试\n```java\npublic class\
    \ MatrixUtilsTest {\n  @Test\n  public void rotate4x4() {\n    int[][] matrix\
    \ = new int[][]{\n      {9, 10, 11, 12},\n      {16, 17, 18, 19},\n      {23,\
    \ 24, 25, 26},\n      {30, 31, 32, 33}};\n    MatrixUtils.rotate(matrix);\n  \
    \  assertArrayEquals(new int[]{30, 23, 16, 9}, matrix[0]);\n    assertArrayEquals(new\
    \ int[]{33, 26, 19, 12}, matrix[3]);\n  }\n  @Test\n  public void rotate5x5()\
    \ {\n    int[][] matrix = new int[][]{\n      {1, 2, 3, 4, 5},\n      {6, 7, 8,\
