    \ O Notation is a mathematical function that helps us analyze how complex an algorithm\
    \ is in time and space. It matters when we build an application for millions of\
    \ users.We usually implement different algorithms to solve one problem and measure\
    \ how efficient is one respect to the other ones.Time and Space ComplexityTime\
    \ complexity is related to how many steps take the algorithm.Space complexity\
    \ is related to how efficient the algorithm is using the memory and disk.Both\
    \ terms depend on the input size, the number of items in the input. We can analyze\
    \ the complexity based on three cases:\n\n*   Best case or Big Omega Ω(n): Usually,\
    \ the algorithm executes independently of the input size in one step.\n\n*   Average\
    \ case or Big Theta Θ(n): When the input size is random.\n\n*   Worst-case or\
    \ Big O Notation O(n): Gives us an upper bound on the runtime for any input. It\
    \ gives us a kind of guarantee that the algorithm will never take any longer with\
    \ a new input size.\n\nOrder of Growth of Common AlgorithmsThe order of growth\
    \ is related to how the runtime of an algorithm increases when the input size\
    \ increases without limit and tells us how efficient the algorithm is. We can\
    \ compare the relative performance of alternative algorithms. Figure A.1 shows\
    \ Big O Notations of common algorithms.![](image_rsrc2M6.jpg)Figure A.1 Big O\
    \ Notation - Order of GrowthBig O Notations examples:O(1) - ConstantIt does not\
    \ matter if the input contains 1000 or 1 million items. The code always executes\
    \ in one step.public class BigONotation {\n\n  public void constant(List<String>\
    \ list, String item) {\n\n    list.add(item);\n\n  }\n\n}@Test\n\npublic void\
    \ test_constantTime() {\n\n  List<String> list = new ArrayList<>(Arrays.asList(\"\
    one\", \"two\", \"three\"));\n\n  bigONotation.constant(list, \"four\");"
