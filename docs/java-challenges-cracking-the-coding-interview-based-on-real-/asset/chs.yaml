  ## 9.0 基础知识\n\n`Graph`（图）是一种由节点（顶点）和边组成的非线性数据结构。它的形状取决于我们试图解决的物理或抽象问题。例如，如果节点代表城市，那么连接城市的路线可能由无向边定义。但如果节点代表完成项目的任务，那么它们的边就必须是有向的，以指示哪个任务必须在另一个任务之前完成。\n\
  \n## 术语\n\n`Graph` 可以为拟安装在德国的 `Hyperloop`（超级循环）交通系统建模。\n\n![](img/image_rsrc2KZ.jpg)\n\
  图 9.0 图 - 术语\n\n`Graph` 只显示 `vertices`（顶点）和 `edges`（边）之间的关系。这里最重要的是哪些边连接到哪个顶点。我们也可以说\
  \ `Graph` 模型了对象之间的连接。\n\n### 邻接 (Adjacency)\n当单条边连接两个顶点时，它们是相邻的或邻居。在图中，代表 `Berlin`\
  \ 和 `Leipzig` 的顶点是相邻的，但 `Berlin` 和 `Dresden` 两个城市并不相邻。\n\n### 路径 (Path)\n`Path`\
  \ 是边的序列。上面的图显示了从 `Berlin` 到 `München` 的路径，经过了 `Leipzig` 和 `Nürnberg` 城市。那么路径就是 `Berlin`、`Leipzig`、`Nürnberg`、`München`。\n\
  \n### 通连图 (Connected Graphs)\n如果每个顶点到每个其他顶点至少有一个路径，则该 `Graph` 是连通的。上面的图是连通的，因为所有城市都是连接的。\n\
  \n### 有向图和加权图 (Directed and Weighted Graphs)\n当边具有方向时，`Graph` 是有向的。在上面的图中，我们有一个无向图，因为超级循环通常可以双向行驶。从\
  \ `Berlin` 到 `Leipzig` 等于从 `Leipzig` 到 `Berlin`。\n\n当边被赋予权重时，图被称为加权图，例如，两个城市之间的距离可以根据它们连接的速度进行加权。\n\
  \n图可以回答一个问题：从给定的 `City` 可以到达哪些城市？我们需要实现搜索算法。在图中搜索有两种不同的方法：`depth-first search (DFS)`（深度优先搜索）和\
  \ `breadth-first search (BFS)`（广度优先搜索）。\n\n# 9.1 深度优先搜索 (DFS)\n\n实现深度优先搜索算法以遍历图数据结构。\n\
  \n## 解决方案\n\n深度优先搜索 (`DFS`) 是一种遍历图的算法。算法从根节点开始（选择任意城市作为根节点），沿着每个路径尽可能地探索。图 9.1.1\
  \ 显示了选择 `Berlin` 作为根节点时的步骤序列。\n\n![](img/image_rsrc2M0.jpg)\n图 9.1.1 深度优先搜索 - 步骤序列\n\
  \n### 实现算法\n\n### 问题建模\n我们需要一个支持 `Node` 中包含的任何数据的对象。我们称之为 `Vertex`。我们定义了一个布尔变量来避免在搜索城市时出现循环，因此我们会在访问每个节点时标记它。列表\
  \ 9.1.1 显示了 `Vertex` 类实现。\n\n列表 9.1.1 – Vertex 类\n```java\npublic class Vertex {\n\
  \    private String name;\n    private boolean visited;\n\n    public Vertex(String\
  \ name) {\n        this.name = name;\n        this.visited = false;\n    }\n\n \
  \   public String getName() {\n        return name;\n    }\n\n    public void setName(String\
  \ name) {\n        this.name = name;\n    }\n\n    public boolean isVisited() {\n\
  \        return visited;\n    }\n\n    public void setVisited(boolean visited) {\n\
  \        this.visited = visited;\n    }\n}\n```\n\n然后，我们将这些顶点存储在一个名为 `arrayOfVertex[]`\
  \ 的数组中。我们有两种方法来建模顶点是如何连接的（边）：`邻接矩阵`（adjacency matrix）和 `邻接表`（adjacency list）。对于此算法，我们将实现邻接矩阵。\n\
  \n### 邻接矩阵\n在具有 `N` 个顶点的图中，我们创建一个 `NxN` 的二维数组。两个顶点（城市）之间的边用 `1` 表示连接（两个相邻节点）。没有连接的用\
  \ `0` 表示。\n\n![](img/image_rsrc2M1.jpg)\n表 9.1.1 邻接矩阵\n\n表 9.1.1 表明，`Leipzig` 与\
  \ `Berlin`、`Dresden` 和 `Nürnberg` 相邻。\n\n### 创建并初始化抽象数据类型\n我们创建一个名为 `Graph` 的抽象数据类型，以定义我们数据结构的行为。我们需要一个栈（stack）来记住访问过的顶点。当我们向\
  \ `arrayOfVertex[]` 添加新的 `Vertex`（`City`）时，`numOfVertices` 变量表示已添加到 `Graph` 中的顶点数量。由于我们将为\
  \ `DFS` 算法传递一个 `String` 参数（城市名），因此定义了一个 `mapOfVertex` HashMap 来注册键-值对：`city-index`。列表\
  \ 9.1.2 显示了 `Graph` 类实现。\n\n列表 9.1.2 Graph 类\n```java\npublic class Graph {\n  \
  \  private final int MAX_VERTEX = 15;\n    private Vertex arrayOfVertex[]; //cities\n\
  \    private Map<String, Integer> mapOfVertex;\n    private int[][] matrixOfVertex;\n\
  \    private int numOfVertices;\n    private Stack<Integer> stack;\n\n    public\
  \ Graph() {\n        arrayOfVertex = new Vertex[MAX_VERTEX];\n        mapOfVertex\
  \ = new HashMap<>();\n        numOfVertices = 0;\n        matrixOfVertex = new int[MAX_VERTEX][MAX_VERTEX];\n\
  \        stack = new Stack<>();\n        for (int i = 0; i < MAX_VERTEX; i++) {\n\
  \            for (int j = 0; j < MAX_VERTEX; j++) {\n                matrixOfVertex[i][j]\
  \ = 0;\n            }\n        }\n    }\n\n    public void addVertex(Vertex city)\
  \ {\n        mapOfVertex.put(city.getName(), numOfVertices);\n        arrayOfVertex[numOfVertices++]\
  \ = city;\n    }\n\n    public void addEdge(String city1, String city2) {\n    \
  \    int start = mapOfVertex.get(city1);\n        int end = mapOfVertex.get(city2);\n\
  \        matrixOfVertex[start][end] = 1;\n        matrixOfVertex[end][start] = 1;\n\
  \    }\n}\n```\n\n\n\n\n\n# 9.2 广度优先搜索 (BFS)\n\n实现广度优先搜索算法以遍历图数据结构。\n\n### 解决方案\n\
  在广度优先搜索中，算法尽可能靠近起点。它访问所有与起始顶点相邻的顶点。算法使用 `queue`（队列）实现。\n\n图 9.2.1 显示了如果我们选择 `Berlin`\
  \ 作为根节点时执行的一系列步骤。数字表示访问顶点的顺序。\n\n![](img/image_rsrc2M2.jpg)\n图 9.2.1 广度优先搜索 - 步骤序列\n\
  \n广度优先搜索算法首先找到所有距离起始顶点一个边边的顶点，然后是所有距离两个边、三条边边的顶点，以此类推。这对于回答诸如从 `Berlin` 到 `München`\
  \ 等其他城市的最短路径是什么这类的问题非常有用。\n\n我们遍历与 `Berlin` 距离一个边边的城市（第一层）：`Rostock`、`Magdeburg`\
  \ 和 `Leipzig`。然后我们遍历与 `Berlin` 距离两个边边的城市（第二层）：`Hannover`、`Nürnberg` 和 `Dresden`。接着我们遍历与\
  \ `Berlin` 距离三个边边的城市（第三层）：`Bremen`、`Dortmund` 和 `München`。这就是核心思想。在遍历另一条可能的路径：`Berlin`、`Magdeburg`、`Hannover`、`Dortmund`、`Frankfurt`、`Stuttgart`、`München`（对应于第六层）之前，我们已经找到了\
  \ `München`。\n\n### 添加边\n我们使用 `LinkedList` 数据结构来构建 `Adjacency List`（邻接表）。当单条边连接两个城市时，它们就是相邻或邻居关系。列表\
  \ 9.2.1 显示了 `addEdge` 方法。\n\n列表 9.2.1 - LinkedList, addEdge 方法\n```java\nprivate\
  \ LinkedList<Integer> adjList[];\npublic void addEdge(String city1, String city2)\
  \ {\n  int start = mapOfVertex.get(city1);\n  int end = mapOfVertex.get(city2);\n\
  \  adjList[start].add(end);\n  adjList[end].add(start);\n}\n```\n\n### 算法\n我们的 `bfs()`\
  \ 方法接收 `City` 名称作为参数。然后我们在 `HashMap` 中定位该城市的索引，将其标记为已访问，并将其加入 `queue` 中。\n\n我们遍历队列项直到其为空。以下是每次迭代中我们执行的操作：\n\
  1. 我们获取并移除该 `queue` 的 `head`（头部）。\n2. 我们遍历该 `head` 的所有 `neighbors`（邻居），直到它们被访问。每个相邻顶点都被标记为已访问并加入\
  \ `queue`。\n3. 当迭代无法找到更多相邻顶点时，我们获取并移除新的 `head`。\n\n列表 9.2 – 广度优先搜索\n```java\nimport\
  \ java.util.*;\nimport java.util.concurrent.ConcurrentHashMap;\n\npublic class Graph\
  \ {\n    private final int MAX_VERTEX;\n    private Vertex[] arrayOfVertex; // cities\n\
  \    private Map<String, Integer> mapOfVertex; // Adjacency list:\n    private LinkedList<Integer>[]\
  \ adjList[]; // register the location at arrayOfVertex:\n    private int numOfVertices;\n\
  \    private Queue<Integer> queue;\n\n    public Graph(int vertices) {\n       \
  \ MAX_VERTEX = vertices;\n        arrayOfVertex = new Vertex[MAX_VERTEX];\n    \
  \    mapOfVertex = new ConcurrentHashMap<>();\n        numOfVertices = 0;\n    \
  \    queue = new LinkedList<>();\n        adjList = new LinkedList[MAX_VERTEX];\n\
  \        for (int i = 0; i < MAX_VERTEX; i++) {\n            adjList[i] = new LinkedList();\n\
  \        }\n    }\n\n    public void addVertex(Vertex city) {\n        mapOfVertex.put(city.getName(),\
  \ numOfVertices);\n        arrayOfVertex[numOfVertices++] = city;\n    }\n\n   \
  \ public void addEdge(String city1, String city2) {\n        int start = mapOfVertex.get(city1);\n\
  \        int end = mapOfVertex.get(city2);\n        adjList[start].add(end);\n \
  \       adjList[end].add(start);\n    }\n\n    public void bfs(String city) {\n\
  \        int vertex = mapOfVertex.get(city);\n        arrayOfVertex[vertex].setVisited(true);\n\
  \        System.out.print(city + \" \");\n        queue.add(vertex);\n\n       \
  \ // iterate until queue empty\n        while (!queue.isEmpty()) {\n           \
  \ int head = queue.remove();\n            int adjVertex;\n            // iterate\
  \ until it has unvisited cities\n            while ((adjVertex = getAdjVertex(head))\
  \ != -1) {\n                arrayOfVertex[adjVertex].setVisited(true);\n       \
  \         System.out.print(arrayOfVertex[adjVertex].getName() + \" \");\n      \
  \          queue.add(adjVertex);\n            }\n        }\n    }\n\n    private\
  \ int getAdjVertex(int vertex) {\n        LinkedList<Integer> linkedList = adjList[vertex];\n\
  \        for (int adj = 0; adj < linkedList.size(); adj++) {\n            if (arrayOfVertex[linkedList.get(adj)].isVisited()\
  \ == false) {\n                return linkedList.get(adj); //return first adjacent\
  \ vertex\n            }\n        }\n        return -1; //not vertices found\n  \
  \  }\n\n    public Map<String, Integer> getMapOfVertex() {\n        return mapOfVertex;\n\
  \    }\n\n    public LinkedList<Integer>[] getAdjList() {\n        return adjList;\n\
  \    }\n}\n```\n\n```java\nclass GraphTest {\n    Graph graph;\n\n    @Before\n\
  \    public void setup() {\n        graph = new Graph(15);\n    }\n\n    @Test\n\
  \    public void test_addVertex() {\n        Vertex city = new Vertex(\"Berlin\"\
  );\n        graph.addVertex(city);\n        assertTrue(graph.getMapOfVertex().size()\
  \ == 1);\n    }\n\n    @Test\n    public void test_addEdge() {\n        String city1\
  \ = \"Berlin\";\n        String city2 = \"Leipzig\";\n        Vertex v1 = new Vertex(city1);\n\
  \        Vertex v2 = new Vertex(city2);\n        graph.addVertex(v1); //location\
  \ 0\n        graph.addVertex(v2); // location 1\n        graph.addEdge(city1, city2);\n\
  \        assertTrue(graph.getAdjList()[0].get(0) == 1);\n        assertTrue(graph.getAdjList()[1].get(0)\
  \ == 0);\n    }\n\n    @Test\n    public void test_bfs() {\n        String city1\
  \ = \"Berlin\"; String city2 = \"Leipzig\";\n        String city3 = \"Dresden\"\
  ; String city4 = \"Nürnberg\";\n        String city5 = \"Hannover\"; String city6\
  \ = \"Rostock\";\n        String city7 = \"Dortmund\"; String city8 = \"Frankfurt\"\
  ;\n        String city9 = \"Stuttgart\"; String city10 = \"München\";\n    }\n}\n\
  ```\n\n\n\n\n\n```java\nString city11 =\"Magdeburg\";String city12 =\"Bremen\";\n\
  \ngraph.addVertex(new Vertex(city1));\n\ngraph.addVertex(new Vertex(city2));\n\n\
  graph.addVertex(new Vertex(city3));\ngraph.addVertex(new Vertex(city4));\ngraph.addVertex(new\
  \ Vertex(city5));\ngraph.addVertex(new Vertex(city6));\ngraph.addVertex(new Vertex(city7));\n\
  graph.addVertex(new Vertex(city8));\ngraph.addVertex(new Vertex(city9));\ngraph.addVertex(new\
  \ Vertex(city10));\n\ngraph.addVertex(new Vertex(city11));\ngraph.addVertex(new\
  \ Vertex(city12));\ngraph.addEdge(city1, city2);\n\ngraph.addEdge(city2, city3);\n\
  graph.addEdge(city3, city4);\ngraph.addEdge(city4, city10);\ngraph.addEdge(city11,\
  \ city5);\ngraph.addEdge(city5, city7);\ngraph.addEdge(city7, city8);\ngraph.addEdge(city8,\
  \ city9);\ngraph.addEdge(city1, city6);\ngraph.addEdge(city1, city11);\ngraph.addEdge(city5,\
  \ city12);\ngraph.addEdge(city9, city10);\n\ngraph.bfs(city1);\n\n}\n}\n```\n\n\
  输出:Berlin Leipzig Rostock Magdeburg Dresden Hannover Nürnberg Dortmund Bremen München\
  \ Frankfurt Stuttgart\n\n# 编码挑战\n\n## 10.0 基础知识\n\n从招聘人员处接收编码挑战有两种方式。首先，你会通过邮件收到编码挑战的描述，你需要在家中解决。其次，你需要在招聘人员的办公室面对其他开发者来完成编码挑战。对于这两种方式，请记住以下几点，以便在招聘过程中留下良好印象：\n\
  \n- 将你的最终代码托管在 `GitHub` 等网站上，并带有清晰的 `README` 文件和清晰的提交信息。\n- 为你的代码编写测试用例。这表明你关注代码的可维护性。\n\
  - 构建整洁的代码结构。你的代码必须是可读的。\n- 应用 `SOLID` 原则，这些原则会教你如何将函数组织成类，以及这些类之间应该如何关联。\n- 思考可能的改进——未包含在挑战规范中——因为当你在他们面前修改代码时，这些将是招聘人员提出的开放问题。\n\
  \n## 10.1 优化在线购物\n\n给定一个预算 `B` 和一个包含 `[product-id][price][value]` 的二维数组，编写一个算法来优化购物篮，使其包含成本小于或等于\
  \ `B` 且价值最高的产品。\n\n### 解决方案\n\n假设我们有 4 美元的预算，并且想从表 1.1.1 中购买价值最高的零食。\n\n![](img/image_rsrc2M3.jpg)\n\
  表 1.1.1 零食列表\n\n但是由谁决定一个产品是否比另一个产品更有价值呢？这取决于具体的业务。它可能是基于定量或定性分析的估计。对于这个解决方案，我们选择了定量方法，基于哪个产品每投入美元能提供更多的重量。\n\
  \n我们使用“红绿重构”（Red-Green Refactor）技术来实现我们的算法，这是测试驱动开发 (`TDD`) 的基础。对于每一个假设，我们都会编写一个测试并查看它是否失败。然后，我们编写仅实现该测试的代码并查看是否成功，然后就可以重构代码使其变得更好。接着，我们处理另一个假设并重复之前的步骤，直到算法成功通过所有测试。\n\
  \n为了泛化“最有价值的产品”这一概念，我们为每个产品分配一个值。我们的算法接收两个参数：一个包含 `[product-id][price][value]` 的二维数组，以及预算。\n\
  \n### 假设 #1 - 给定一个按价值排序的产品数组，返回最有价值的产品\n\n我们开始定义一个 `java` 测试，创建一个新的 `BasketOptimized`\
  \ 类。\n\n列表 1.1.1 – BasketOptimized 测试用例\n```java\npublic class BasketOptimizedTest\
  \ {\n\n  BasketOptimized basketOptimized;\n\n  @Before\n  public void setup() {\n\
  \    basketOptimized = new BasketOptimized();\n  }\n\n  @Test\n  public void productsOrderedByValue\
  \ () {\n    double[][] myProducts = new double[][] {\n          {1, 0.98, 230},\n\
  \          {2, 0.98, 230},\n          {3, 0.48, 75},\n          {4, 1.29, 55},\n\
  \          {5, 1.29, 47},\n          {6, 4.86, 14},\n          {7, 1.69, 12},\n\
  \    };\n    double[][] mostValueableProducts =\n          basketOptimized.fill(myProducts,\
  \ 4);\n\n    assertEquals(590d,\n          Arrays.stream(mostValueableProducts).\n\
  \              mapToDouble(arr -> arr[2]).sum(),0);\n  }\n}\n```\n\n第一次运行时，它应该失败，因为\
  \ `fill` 方法并不存在。然后我们需要创建一个简单的实现来通过测试：值的总和必须等于 590，因为这代表了所有价格总和小于或等于 4 的被选产品。\n\n\
  现在，我们继续实现 `fill` 方法。\n\n列表 1.1.2 – BasketOptimized fill 方法实现\n```java\npublic class\
  \ BasketOptimized {\n\n  public double[][] fill(double[][] myProducts, double budget)\
  \ {\n    int len = myProducts.length;\n    double[][] mostValueableProducts =  double[len][3];\n\
  \    double sum = 0;\n\n    for (int idx=0; idx < len; idx++) {\n      sum = sum\
  \ + myProducts[idx][1]; //price\n      if (sum <= budget) {\n        mostValueableProducts[idx][0]\
  \ = myProducts[idx][0]; //id\n        mostValueableProducts[idx][1] = myProducts[idx][1];\
  \ //price\n        mostValueableProducts[idx][2] = myProducts[idx][2]; //value\n\
  \      }\n    }\n    return mostValueableProducts;\n  }\n}\n```\n\n### 假设 #2 - 给定一个按价值排序的产品数组，返回最有价值的产品\n\
  \n在这种情况下，我们传递了一个未排序的数组，因此我们可以看到新测试将失败。\n```java\n  @Test\n  public void productsNotByValue\
  \ () {\n    double[][] myProducts = new double[][]{\n      {1, 0.98, 230},\n   \
  \   {2, 1.29, 47},\n      {3, 1.69, 12},\n      {4, 1.29, 55},\n      {5, 0.98,\
  \ 230},\n      {6, 4.86, 14},\n      {7, 0.48, 75}\n    };\n\n    double[][] mostValueableProducts\
  \ = basketOptimized.fill(myProducts, 4);\n    assertEquals(590d, Arrays.stream(mostValueableProducts).mapToDouble(arr\
  \ -> arr[2]).sum(), 0);\n  }\n```\n我们意识到需要按价值对数组进行排序，因为我们需要最有价值的产品，所以是时候重构算法了。我们需要做的是对输入数组进行排序。\n\
  ```java\n  public double[][] fill (double[][] myProducts, double budget) {\n   \
  \ Arrays.sort(myProducts, Collections.reverseOrder(\n      Comparator.comparingDouble(a\
  \ -> a[2])));\n\n    int len = myProducts.length;\n```\n\n\n\n\n\n`double[][] mostValueableProducts\
  \ = new double[len][3];`..然后我们可以看到我们的前两个测试用例成功了。\n\n### 假设 #3 - 给定一个产品数组，我们需要从所有可能的可能的组合中获取价值最高的产品\n\
  \n想象一下以下场景：\n```java\ndouble[][] myProducts = new double[][] {{1, 0.98, 230},{2,\
  \ 0.51, 30},{3, 0.49, 28},{4, 1.29, 55},{5, 0.98, 230},{6, 4.86, 14},{7, 0.48, 75},};\n\
  double[][] mostValueableProducts = basketOptimized.fill(myProducts, 4);\nassertEquals(590d,Arrays.stream(mostValueableProducts).mapToDouble(arr\
  \ -> arr[2]).sum(),0);\n```\n\n测试期望结果为 590，这对应于 3,73US$ 的最终价格（0.98+0.98+0.48+1.29）。一旦算法按价值对输入数组进行排序，我们得到了下面的新输入数组\
  \ `[1.0, 0.98, 230.0][5.0, 0.98, 230.0][7.0, 0.48, 75.0][4.0, 1.29, 55.0][2.0, 0.51,\
  \ 30.0][3.0, 0.49, 28.0][6.0, 4.86, 14.0]`\n\n但在这里我们发现了另一种能给我们提供最高价值的产品组合：230+230+75+30+28\
  \ = 593，这对应于 3,44US$ 的最终价格。因此，我们需要重构代码来计算所有组合（子集），并在 4 US$ 的预算内返回价值最高的产品。\n\n子集可以用从\
  \ 0 到 7（数组大小）的二进制选项来表示。位运算符允许我们操作整数内部的位。例如，33 的二进制 `int` 值为 00100001，其中每个位置代表 2\
  \ 的幂，从最右位开始为 `2⁰`。\n\n```java\nint numIterations = (int) Math.pow(2, myProducts.length);\n\
  ```\n\n所以对于七个产品，我们有 128 次迭代。对于每次迭代，我们构建一个内层循环来决定将哪些产品包含在产品子集中。让我们来看一个例子：\n\n```java\n\
  When int idx = 33\n```\n\n我们需要构建一个通过以下标准的的产品子集：\n```java\nif ((idx & (int) Math.pow(2,\
  \ idx2)) == 0) {\n```\n\n下表显示了我们内层循环中的迭代：\n\n| binary(idx) | idx2 | Math.pow(2,idx2)\
  \ | binary(pow(idx2)) |\n| :--- | :--- | :--- | :--- |\n| 00100001 | 0 | 1 | 0001\
  \ |\n| 00100001 | 1 | 2 | 0010 |\n| 00100001 | 2 | 4 | 0100 |\n| 00100001 | 3 |\
  \ 8 | 1000 |\n| 00100001 | 4 | 16 | 00010000 |\n| 00100001 | 5 | 32 | 00100000 |\n\
  | 00100001 | 6 | 64 | 01000000 |\n\n这意味着一个新的子集将包含产品数组中索引为 1, 2, 3, 4 和 6 的产品。我们需要询问在有限的预算内是否能买得起这些产品。\n\
  \n```java\nif (subSet.length > 0 && sumPrice <= budget) {\n```\n\n下图显示了我们当前迭代的结果：\n\
  ![](img/image_rsrc2M4.jpg)\n\n我们构建了一个 `HashMap` 来存储所有组合及其值的总和。最后，我们返回按价值排序的 HashMap\
  \ 的第一个元素。\n\n#### 列表 1.1.3 – BaskedOptimized 实现\n\n```java\npublic class BasketOptimized\
  \ {\n\n    public double[][] fill(double[][] myProducts, double budget) {\n    \
  \    int len = myProducts.length;\n        int numIterations = (int) Math.pow(2,\
  \ myProducts.length);\n        Map<double[][], Double> combinations = new HashMap<>();\n\
  \        for (int idx = 0; idx < numIterations; idx++) {\n            double[][]\
  \ subSet = new double[len][];\n            double sumPrice = 0;\n            double\
  \ sumValue = 0;\n            int i = 0;\n            for (int idx2 = 0; idx2 < len;\
  \ idx2++) {\n                if ((idx & (int) Math.pow(2, idx2)) == 0) {\n     \
  \               subSet[i++] = myProducts[idx2];\n                    sumPrice =\
  \ sumPrice + myProducts[idx2][1];\n                    sumValue = sumValue + myProducts[idx2][2];\n\
  \                }\n            }\n            if (subSet.length > 0 && sumPrice\
  \ <= budget) {\n                //remove nulls\n                subSet = Arrays.stream(subSet)\n\
  \                    .filter(s -> (s != null && s.length > 0))\n               \
  \     .toArray(double[][]::new);\n                combinations.put(subSet, Double.valueOf(sumValue));\n\
  \            }\n        }\n        LinkedHashMap<double[][], Double> reverseSortedMap\
  \ = new LinkedHashMap<>();\n        combinations.entrySet()\n            .stream()\n\
  \            .sorted(Map.Entry.comparingValue(Comparator.reverseOrder()))\n    \
  \        .forEach(x -> reverseSortedMap.put(x.getKey(), x.getValue()));\n      \
  \  double[][] mostValueableProducts = reverseSortedMap.keySet().iterator().next();\n\
  \        return mostValueableProducts;\n    }\n}\n```\n\n```java\npublic class BasketOptimizedTest\
  \ {\n    BasketOptimized basketOptimized;\n\n    @Before\n    public void setup()\
  \ {\n        basketOptimized = new BasketOptimized();\n    }\n\n    @Test\n    public\
  \ void productsByValue() {\n        double[][] myProducts = new double[][]{\n  \
  \          {1, 0.98, 230},\n            {2, 0.98, 230},\n            {3, 0.48, 75},\n\
  \            {4, 1.29, 55},\n            {5, 1.29, 47},\n            {6, 4.86, 14},\n\
  \            {7, 1.69, 12}\n        };\n        double[][] mostValueableProducts\
  \ = basketOptimized.fill(myProducts, 4);\n        assertEquals(590d, Arrays.stream(mostValueableProducts).mapToDouble(arr\
  \ -> arr[2]).sum(), 0);\n    }\n\n    @Test\n    public void productsNotByValue()\
  \ {\n        double[][] myProducts = new double[][]{\n            {1, 0.98, 230},\n\
  \            {2, 1.29, 47},\n            {3, 1.69, 12},\n            {4, 1.29, 55},\n\
  \            {5, 0.98, 230},\n            {6, 4.86, 14},\n            {7, 0.48,\
  \ 75}\n        };\n        double[][] mostValueableProducts = basketOptimized.fill(myProducts,\
  \ 4);\n        assertEquals(590d, Arrays.stream(mostValueableProducts).mapToDouble(arr\
  \ -> arr[2]).sum(), 0);\n    }\n}\n```\n\n\n\n\n\nTDD 让我们能够先设计、构建并测试最小的方法，然后再将它们组合在一起。最重要的是，我们可以在不破坏其他测试用例的情况下对它们进行重构。\n\
  \n### 测试用例 #2：根据有效坐标输入符号\n一旦设置了尺寸，我们需要接受有效的坐标并检查该位置是否可用。\n\n```java\n@Test\npublic\
  \ void whenCoordinatesAreNotBusyThenPutSymbol() throws Exception {\n  board.setSize(3);\n\
  \  board.putSymbol(1, 2, \"X\");\n  board.putSymbol(2, 3, \"O\");\n  assertEquals(\"\
  O\", board.getBoard()[1][2]);\n}\n```\n\n代码列表 10.1.3 显示了 `putSymbol` 方法的实现。\n\n\
  #### 代码列表 10.1.3 – Board 类，putSymbol 方法\n```java\npublic void putSymbol(int x, int\
  \ y, String character) {\n  if (x < 1 || x > this.board.length)\n    throw new RuntimeException(\"\
  X coordinate invalid, must be between 1 and \" +this.board.length);\n  if (y < 1\
  \ || y > this.board.length)\n    throw new RuntimeException(\"Y coordinate invalid,\
  \ must be between 1 and \" +this.board.length);\n  if (board[x - 1][y - 1] != EMPTY_)\
  \ throw new RuntimeException(\"Coordinates are busy\");\n  board[x - 1][y - 1] =\
  \ character;\n}\n```\n\n如果我们将尺寸设置为 4，这意味着意味着对于玩家来说，下限是 1，上限是 4。\n\n### 测试用例 #3：每次移动后打印棋盘\n\
  每当玩家输入有效坐标时，`Board` 就会被更新并打印。\n\n```java\n@Test\npublic void whenBoardIsNotNullThenPrintIsPossible()\
  \ {\n  board.setSize(10);\n  board.putSymbol(1, 2, \"X\");\n  board.putSymbol(2,\
  \ 3, \"O\");\n  board.print();\n}\n```\n\n代码列表 10.1.4 显示了 `print` 方法的实现。\n\n####\
  \ 代码列表 10.1.4 – Board 类，print 方法\n```java\npublic void print() {\n  if (board ==\
  \ null)\n    throw new RuntimeException(\"Board is not initialized\");\n  int size\
  \ = board.length;\n  for (int y = size - 1; y >= 0; y--) {\n    for (int x = 0;\
  \ x < size; x++) {\n        if (x == size - 1) {\n          System.out.print(board[x][y]\
  \ + \"\");\n        } else {\n          System.out.print(board[x][y] + \"|\");\n\
  \        }\n      }\n      System.out.println(\"\");\n  }\n}\n```\n\n在这里，你甚至可以将\
  \ `Board` 的打印委托给另一个组件，例如 `Console.print`。通过这样，当你想以 XML 或 HTML 格式打印时，`Console` 类将负责实现新方法。一个类发生改变的原因不应超过一个。\n\
  \n### 测试用例 #4：返回胜利者\n一旦我们设置了尺寸，游戏就会接收不同的移动。`Board` 类会在每次移动后检查游戏中是否存在胜利者。代码列表 10.2.5\
  \ 定义了一个测试用例，用来检查整条水平线是否被填充。\n\n#### 代码列表 10.1.5 – Board 类，getWinner 测试用例\n```java\n\
  @Test\npublic void horizontalLineFilledThenWinnerX() {\n  board.setSize(3);\n  board.putSymbol(1,\
