  md: '# # Chapter 9 Lab


    More Classes and Objects


    # ## Objectives


    +   - Be able to write a copy constructor

    - Be able to write equals and toString methods

    - Be able to use objects made up of other objects (Aggregation)

    - Be able to write methods that pass and return objects


    # ## Introduction


    We discussed objects in Chapter 6 and we a television in the Chapter 6 lab. We
    want to build on that lab, and work more with objects. This time, the object that
    we are choosing is more complicated. It is made up of other objects. This is called
    aggregation. A credit card is an object that is very common, but not as simple
    as a television. Attributes of the credit card include information about the owner,
    as well as a balance and credit limit. These things would be instance fields.
    A credit card allows you to make payments and charges. These would be methods.
    As we have seen before, there would also be other methods associated with this
    object in order to construct the object and access its fields.


    Examine the UML diagram follows. Notice that the fields in the CreditCard class
    are other types of objects, a Person or a Money object. We can say that the CreditCard
    has a "Person", which means aggregation, and the Person has a "Address" object
    as one of its instance fields. This aggregation structure can create a very complicated
    object. We will try to keep this lab reasonably simply.


    To start with, we will be editing a partially written class. The constructor that
    you will be writing is a copy constructor. This means it should create a new object,
    but with the same values in the instance variables as the object that is being
    copied.


    Next, we will write equals and toString methods. These are very common methods
    that are needed when you write a class to model an object. You will also see a
    compareTo method that is also a common method for objects.'
  merge: -1
