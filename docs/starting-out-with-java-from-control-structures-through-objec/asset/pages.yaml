  md: '# # Chapter 1 Lab


    Algorithms, Errors, and Testing


    # Objectives


    +   - Be able to write an algorithm

    - Be able to compile a Java program

    - Be able to execute a Java program using the Sun JDK or a Java IDE

    - Be able to test a program

    - Be able to debug a program with syntax and logic errors


    # Introduction


    Your teacher will introduce your computer lab and the environment you will be
    using for programming in Java.

    In chapter 1 of the textbook, we discuss writing your first program. The example
    calculates the user''s gross pay. It calculates the gross pay by multiplying the
    number of hours worked by hourly rate. However, it is not always calculated this
    way. What if you work 45 hours in a week? The hours you worked over 40 hours are
    considered overtime. You will need to be paid time and a half for the overtime
    hours worked.

    In this lab, you are given a program which calculates user''s gross pay with or
    without overtime. To output overtime, you re work backwards this time, and use
    pseudocode to write an algorithm from the Java code. This will give you practice
    with algorithms while allowing to explore and understand a little Java code before
    begin learning the Java programming language.

    You will also need to test this program to ensure the correctness of the algorithm
    and code. You will need to develop test data that will represent all possible
    kinds of data the user may use.

    You will also be debugging a program. There are several types of errors. In this
    lab, you will encounter syntax and logic errors. We will explore runtime errors
    in lab 2.


    +   1. Syntax Errors—the “grammar” of the programming language. These are caught
    by the compiler and listed out with line number and error found. You will learn
    how to understand what they tell you with experience. All syntax errors must be
    corrected before the program runs. If the program runs, this'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'does not mean that it is correct, only that there are no syntax errors. Examples
    of syntax errors are spelling mistakes in variable names, missing semicolon, unpaired
    curly braces, etc.


    +   2. Logic Errors—errors in the logic of the algorithm. These errors emphasize
    the need for a correct algorithm. If the statements are out of order, if there
    are errors in a formula, or if there are missing steps, the program can still
    run and give you output, but it may be the wrong output. There is no list of logic
    errors, you may not realize you have errors unless you check your output. It is
    very important to know what to expect. You should test your programs with different
    inputs, and know what output to expect in each case. For example, if your program
    calculates your pay, you should check three different cases: less than 40 hours,
    40 hours, and more than 40 hours. Calculate each case by hand before running your
    program so that you know what to expect. You may get a correct answer for one
    case, but not for another case. This will help you figure out where your logic
    errors are.


    +   3. Run time errors—errors that do not occur until the program is run, and
    then may only occur with some data. These errors emphasize the need for completely
    testing your program.'
  merge: -1
  pgno: 7
