  md: '# # Chapter 2 Lab

    Java Fundamentals


    # Objectives


    +   - Write arithmetic expressions to accomplish a task

    - Use casting to convert between primitive types

    - Use a value-returning library method and a library constant

    - Use string methods to manipulate string data

    - Communicate with the user using the Scanner class or dialog boxes

    - Create a program by translating a pseudocode algorithm

    - Be able to document a program


    # Introduction


    This lab is designed to give you practice with some of the basics in Java. We
    will continue ideas from lab 1 by correcting logic errors while looking at mathematical
    formulas in Java. We will explore the difference between integer division and
    division on your calculator as well as reviewing the order of operations.


    We will also learn how to use mathematical formulas that are preprogrammed in
    Java. On your calculator there are buttons to do certain operations, such as raising
    a number to a power or use the number pi. Similarly, in Java, we have programs
    that are available for us to do these operations. Mathematical operations that
    can be performed with the tech of a button on a calculator are also available
    in the Math class. We will learn how to use a Math class to cube the radius in
    the formula for finding the volume of a sphere.


    This lab also introduces communicating with user. We have already seen how console
    input and output work in lab 1. We will now need to learn how to program user
    input, by investigating the lines of code that we need to add in order to use
    the Scanner class. We will also learn the method called for output.


    Alternately, you may use dialog boxes for communicating with the user. An introduction
    to graphical user interface (GUI) programming is explored using the JOptionPane
    class.


    The String class is introduced and we will use some of the available methods to
    prepare you for string processing.'
  merge: -1
