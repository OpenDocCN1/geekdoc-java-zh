  md: '# Chapter 6 Lab


    Classes and Objects


    # Objectives


    +   - Be able to declare a new class

    - Be able to write a constructor

    - Be able to write instance methods that return a value

    - Be able to write instance methods that take arguments

    - Be able to instantiate an object

    - Be able to use calls to instance methods to access and change the state of an
    object


    # Introduction


    Everyone is familiar with a television. It is the object we are going to create
    in this lab. First we need a blueprint. All manufacturers have the same basic
    elements in the televisions they produce as well as many options. We are going
    to work with a few basic elements that are common to all televisions. Think about
    a television in general. It has a brand name (it is made by a specific manufacturer).
    The television screen has a specific size. It has some basic controls. There is
    a control to turn the power on and off. There is a control to change the channel.
    There is also a control for the volume. At any point in time, the television''s
    state can be described by how these controls are set.


    We will write the television class. Each object that is created from the television
    class must be an instance of fields. So a television''s state will have the following
    attributes:


    +   - **manufacturer**. The manufacturer attribute will hold the brand name. This
    cannot change once the television is created, so will be a named constant.

    - **screenSize**. The screenSize attribute will hold the size of the television
    screen. This cannot change once the television has been created so will be a named
    constant.

    - **powerOn**. The powerOn attribute will hold the true value if the power is
    on, and false if it is off.

    - **channel**. The channel attribute will hold the value of the station that the
    television is showing.

    - **volume**. The volume attribute will hold a number value representing the loudness
    (0 being no sound).'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# Lab Manual to Accompany Starting Out with Java 5: From Control Structures
    to Objects


    These attributes become fields in our class. The television object will also be
    able to control the state of its attributes. These controls methods in our class.


    +   - **setChannel**: The setChannel method will store the desired state in the
    channel field.

    - **power**: The power method will toggle the power between on and off, changing
    the value stored in powerOn from false to true or from true to false.

    - **increaseVolume**: The increaseVolume method will increase the value stored
    in the volume field by 1.

    - **decreaseVolume**: The decreaseVolume method will decrease the value stored
    in the volume field by 1.

    - **getChannel**: The getChannel method will return the value stored in the channel
    field.

    - **getVolume**: The getVolume method will return the value stored in the volume
    field.

    - **getManufacturer**: The getManufacturer method will return the constant value
    stored in the MANUFACTER field.

    - **getScreenSize**: The getClientSize method will return the constant value stored
    in the SCREEN_SIZE field.


    We will also need a constructor method that will be used to create an instance
    of a Television.

