  md: '# # Chapter 15 Lab

    Recursion


    # ## Objectives


    +   - Be able to trace recursive function calls

    - Be able to write non-recursive and recursive methods to find geometric and harmonic
    progressions


    # ## Introduction


    In this lab we will follow how the computer executes recursive methods, and will
    write our own recursive method, as well as the iterative equivalent. There are
    two common progressions in mathematics, the geometric progression and the harmonic
    progression. The geometric progression is defined as the product of the first
    $n$ integers. The harmonic progression is defined as the product of the inverses
    of the first $n$ integers. Mathematically, the definitions are as follows


    > Geometric $(n) = \prod_{i=1}^{n} i = i \times \prod_{i=1}^{n-1} i$


    > Harmonic $(n) = \prod_{i=1}^{n} \frac{1}{i} = \frac{1}{i} \times \prod_{i=1}^{n-1}
    \frac{1}{i}$


    Let''s look at examples. If we use $n = 4$, the geometric progression would be
    $1 \times 2 \times 3 \times 4 = 24$, and the harmonic progression would be


    > $1 \times \frac{1}{2} \times \frac{1}{3} \times \frac{1}{4} = \frac{1}{24} =
    0.04166...$'
