  md: '# # Chapter 3 Lab

    Selection Control Structures


    # Objectives


    +   * Be able to construct boolean expressions to evaluate a given condition

    * Be able to compare Strings

    * Be able to use a flag

    * Be able to construct if and if-else-if statements to perform a specific task

    * Be able to construct a switch statement

    * Be able to format numbers


    # Introduction


    Up to this point, all the programs you have a sequential control structure. This
    means that all statements are executed in order, one after another. Sometimes
    we need to let the computer make decisions, based on the data. A selection control
    structure allows the computer to select which statement to execute.


    In order to have the computer make a decision, we need to do a comparison. So
    we will work with writing boolean expressions. Boolean use relational operators
    and logical operators to create a condition that can be evaluated as true or false.


    Once we have a condition, we can conditionally execute statements. This means
    that there are statements in the program that may or not be executed, depending
