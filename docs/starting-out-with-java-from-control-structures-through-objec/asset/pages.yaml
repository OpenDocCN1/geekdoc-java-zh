  md: '# Task #1 Average Class


    Create a classed Average according to the UML diagram.


    | Average |

    | --- |

    | -data[] : int |

    | -mean: double |

    | +Average() |

    | +calculateMean(): void |

    | +toString(): String |

    | +selectionSort(): void |


    This class will allow a user to enter 5 scores into an array. It will rearrange
    the data in descending order and calculate the mean for the set.


    +   Attributes:

    - data[]—the array which will contain the scores

    - mean—the arithmetic average of the scores


    +   Methods:

    - **Average**—the constructor. It will allocate memory for the array. Use a for
    loop to repeatedly display for the user which should indicate that user should
    enter score number 1, prompt score number 2, Note: The computer starts counting
    with 0, but people start counting with 1, and your prompt should account for this.
    For example, when the user enters score number 1, it will be stored in indexed
    variable 0. The user will then call the **selectionSort** and the **calculateMean**
    methods.

    - **calculateMean**—this is a method that uses a for loop to access each score
    in the array and add it to a running total. The total divided by the number of
    scores (the length of the array), and the result is stored into mean.

    - **toString**—returns a String containing data in descending order and the mean.

    - **selectionSort**—this method uses the selection sort algorithm to rearrange
    the data from highest to lowest.'
