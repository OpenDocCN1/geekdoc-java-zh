  md: '# Task #1 Creating a Menu with Submenus


    +   1. Copy the file NoteMaker.java (code listing 13.1) from www.aw.com/ as directed
    by your instructor.


    +   2. Compile and run the program. Observe the horizontal menu bar at the top
    which has only one menu choice, Notes. We will be adding an item to this menu
    called Views that has two submenus. One named Look and Feel and one named Scroll
    Bars. The submenu named Look and Feel lets the user change the feel and looks
    for: Metal, Motif, and Windows. The submenu named Scroll Bars offers the user
    three choices: Never, Always, and As Needed. When the user makes a choice, the
    scroll bars are displayed according to the choice.


    +   3. We want to logically break down the problem and make our program easier
    to read and understand. We will separate methods to create each of the vertical
    menus. The three methods that we will be are createScrollBars(), and createAndFeel().
