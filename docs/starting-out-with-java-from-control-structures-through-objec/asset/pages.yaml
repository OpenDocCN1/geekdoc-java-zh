  md: '# Chapter 5 Lab


    Methods


    # Objectives


    +   - Be able to write methods

    - Be able to call methods

    - Be able to write javadoc comments

    - Be able to create HTML documentation for our Java class using javadoc


    # Introduction


    Methods are commonly used to break down a problem into small manageable pieces.
    A large task can be broken down into smaller tasks (methods) that contain the
    details of how to complete that small task. The larger problem is then solved
    by implementing the smaller tasks (calling the methods) in the correct order.


    This also allows for efficiencies, since the method can be called as many times
    as needed without rewriting the code each time.


    Finally, we will use documentation comments for each method, and generate HTML
    documents similar to the Java APIs that we have seen.'
