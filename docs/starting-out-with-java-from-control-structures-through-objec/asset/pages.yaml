    +   4. Let''s start with the createAndFeel() method. This will create the first
    submenu shown in figure 1. There are three items on this menu, Metal, Motif, and
    Windows. We will create this menu by doing the following:

    na) Create a new Menu with the name Look and Feel

    nb) Create a new JMenuItem with the name Metal

    c) Add an action listener to the menu item (the createNotes() method to see how
    this is done).

    nd) Add the menu item to the menu.


    +   5. Similarly, write the createScrollBars() method to create a JMenu that has
    three menu items, Never, Always, and As Needed. See figure 2.


    +   6. Now that we have submenus, these menus will become menu items for the Views.
    The createViews() method will call the vertical menu showing cascading from the
    menu choice Views as shown in figure. We will do this as follows

    a) Create a new JMenu with the name Views.

    b) Call the createAndFeel() method to create the Look and Feel submenu.

    c) Add an action listener to the Look and Feel menu.

    d) Add the look and feel to the Views menu.

    ne) Repeat steps b through d for the Scroll Bars menu item, this time calling
    the createScrollBars() method.


    +   7. Finish creating your menu system by adding the Views to the menu bar in
    the constructor.'
