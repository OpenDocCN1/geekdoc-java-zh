    Lab Manual to Accompany Starting Out with Java 5: From Control Structures to Objects


    The UML diagram for the inheritance relationship is as follows:


    | BankAccount |

    | :--- |

    | -balance:double |

    | -owner:String |

    | -accountNumber:String |

    | #numberOfAccounts:int |

    | +BankAccount() |

    | +BankAccount(name:String,amount:double) |

    | +BankAccount(oldAccount:BankAccount,amount:double) |

    | +deposit(amount:double):void |

    | +withdraw(amount:double):boolean |

    | +getBalance():double |

    | +getOwner():String |

    | +getAccountNumber(double):void |

    | +setBalance(amount:double):void |

    | +setAccountNumber(newAccountNumber:String):void |


    | CheckingAccount | SavingsAccount |

    | :--- | :--- |

    | -FEE:double | -rate:double |

    | +CheckingAccount(name:String,amount:double) | +SavingsAccount(name:String,amount:double)
    |

    | +withdraw(amount:double):boolean | +SavingsAccount(oldAccount:SavingsAccount,amount:double)
    |

    | -savingsNumber:int | +postInterest():void |

    | -accountNumber:String | +getAccountNumber():String |


    ## Task #1 Extending BankAccount


    1. Copy the files AccountDriver.java (code listing 11,1) and BankAccount.java
    (code listing 11,2) from www.aw.com/cssupport or as directed by your instructor.
    Set BankAccount.java is complete and will not need to be modified.


    2. Create a new class called CheckingAccount that extends BankAccount.


    3. It should have a static constant FEE that represents the cost of clearing one
    check. It should be equal to 15 cents.


    4. Write a constructor that takes a name and an initial amount as parameters.
    It should initialize accountNumber to be the current value in accountNumber concatenated
    with -10. All checking accounts are identified by the extension -10. There can
    be only one account for each account number. Remember since accountNumber is a
    private member in BankAccount, it must be changed by a mutator method.


    5. Write a new instance method, withdraw, overrides the withdraw method in the
    superclass. This method should take the amount to withdraw, add it to the fee
    for check clearing, and call the withdraw method from the superclass. Remember
    that to override the method, it must have the same method heading. Notice that
    the withdraw method from the superclass returns true or false depending if it
    was able to complete the withdrawal or not. The method that overrides it must
    also return the same true or false that was returned from the call to the withdraw
    method from the superclass.


    6. Compile and debug this class.


    ## Task #2 Creating a Second Subclass


    1. Create a new class SavingsAccount that extends BankAccount.


    2. It should contain an instance variable rate that represents the annual interest
    rate. Set it to 2.5%.


    3. It should also have an instance variable savingsNumber, initialized to 0. In
    this bank, you have one account number, but can have several savings accounts
    with each number. Each individual savings account is identified by the number
    following a dash. For example, 10001-0 is the first savings account, 10001-1 would
    be another accounts that is still part of your account. This is so that you can
    keep funds separate from the others, like a Christmas club account.


    4. An instance variable accountNumber will hide the accountNumber from the superclass,
    which should also be in this class.


    5. Write a constructor that takes a name and an initial balance as parameters
    and calls the constructor of the superclass. It should initialize accountNumber
    to be the current value in the superclass accountNumber (the hidden instance variable)
    concatenated with a hyphen and then the savingsNumber.


    6. Write a method postInterest that has no parameters and returns no value. This
    method will calculate one month''s interest on the balance and deposit it into
    the account.


    7. Write a method that overrides the getAccountNumber method in the superclass.


    8. Write a copy constructor that creates another savings account for the same
    person. It should take the original savings account and an initial balance as
    parameters. It should call the copy constructor of the superclass, assign the
    savingsNumber to be one more than the savingsNumber of the original savings account.
    It should assign the accountNumber to the accountNumber of the superclass concatenated
    with the hyphen and the savingsNumber of the new account.


    9. Compile and debug this class.


    10. Use the AccountDriver class to test your classes. If you named and created
    your classes and methods correctly, it will not have any difficulties. If you
    have errors, do not edit the AccountDriver class. You must make your classes work
    with this program.


    11. Running the program should give the following output:

    Account Number 10001-10 belonging to Benjamin Franklin

    Initial balance = $1000.00

    After deposit of $500.00, balance = $1500.00

    After withdrawal of $1000.00, balance = $499.85


    Account Number 100002-0 belonging to William Shakespeare


    Initial balance = $400.00


    After deposit of $500.00, balance = $900.00


    Insufficient funds to withdraw $1000.00, balance = $900.00


    After monthly interest has been posted, balance = $901.88


    Account Number 100002-1 belonging to William Shakespeare


    Initial balance = $5.00


    After deposit of $500.00, balance = $505.00


    Insufficient funds to withdraw $1000.00, balance = $505.00


    Account Number 10001-10 belonging to Benjamin Franklin

