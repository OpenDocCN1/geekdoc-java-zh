    # Preface


    ## About this Lab Manual


    This manual accompanies Starting Out With Java: From Control Structures to Objects,
    by Tony Gaddis. Each lab gives students hands on experience with the major topics
    in each chapter. It is designed for closed laboratories—regularly scheduled classes
    supervised by an instructor, with a length of approximately two hours. Lab manuals
    correspond to textbook chapters. Each chapter in the lab manual contains learning
    objectives, one or two with various tasks for the students to complete; and a
    listing of the code provided as the starting basis for each Lab. The are intended
    to be used after reading the corresponding textbook chapter, but before programming
    challenges for each chapter in the textbook.


    Students should copy the partially written code (available at www.aw.com/support)
    and use the instructions provided in each task to complete the code so that it
    is operational. Instructions will guide them through each lab having add code
    at locations in the partially written program. Students will gain experience in
    writing code, compiling and debugging, testing plans, and finally executing and
    testing their programs.


    > Note: Labs 7 and 12 are written entirely by the student using the instructions
    in the various tasks, so there is no code provided as a starting basis.


    ## What You''ll Find in this Lab Manual


    The Lab Manual contains 15 labs that help students learn how to apply introductory
    programming concepts:


    - Chapter 1 Lab

