    \ 500 和高度 300 的常量。\n4. 编写一个默认构造函数，执行以下操作：\n   a) 将窗口标题设置为 Color Factory。\n   b)\
    \ 使用常量设置窗口大小。\n   c) 指定点击关闭按钮时发生的情况。\n   d) 获取 `JFrame` 的内容面板并将布局管理器设置为边界布局（border\
    \ layout）。\n   e) 调用构建顶部面板的方法（按照下方说明编写）。\n   f) 将面板添加到内容面板的北部（north）。\n   g) 调用构建底部面板的方法（按照下方说明编写）。\n\
    \   h) 将此面板添加到内容面板的南部（south）。\n   i) 创建一个包含消息“顶部按钮更改面板颜色，底部单选按钮更改文本颜色。”的标签。\n\
    \   j) 将此标签添加到内容面板的居中心区域（center）。\n\n# 任务 #2 编写私有方法\n\n- 1. 编写一个私有方法，如下构建顶部面板：\n\
    \   a) 创建一个包含红色、橙色和黄色按钮的面板。\n   b) 为面板使用流式布局（flow layout）并将背景设置为白色。\n   c) 按钮应以颜色名称标记并同样显示。\n\
    \   d) 设置按钮的命令为颜色名称。\n   e) 添加一个用于按钮的监听器。\n2. 以相同的方式创建一个底部面板，但使用绿色、蓝色和青色的单选按钮。\n\
    \n# 任务 #3 编写内部类\n\n- 1. 编写实现 `ActionListener` 的内部类 `ButtonListener`。它包含一个 `actionPerformed`\
    \ 方法来处理事件。\n2. 编写另一个类似于 `ButtonListener` 的内部类 `RadioButtonListener`。它将处理单选按钮事件。\n\
    \n# 任务 #4 运行 GUI\n\n- 1. 编写一个 `main` 方法，声明并创建一个 `ColorFactory` 实例，然后使用 `setVisible`\
    \ 方法显示它。\n\n# 第 8 章 实验 数组\n\n## 目标\n\n- 能够声明和实例化数组\n- 能够使用 for 循环填充数组\n- 能够访问并处理数组中的数据\n\
    - 能够编写排序方法\n- 能够使用对象数组\n\n## 引言\n\n每个人熟悉列表。我们制作购物列表、待办列表、作业列表、生日列表等。注意尽管列表中有很多项目，但我们通过名称调用列表。在本实验中，我们将以数组的形式处理列表。\n\
    \n我们将从数字列表开始。我们将学习如何处理数组。我们还将探索排序算法，使用选择排序。我们将转向复杂的数组，即包含对象的数组。\n\n# 任务 #1 Average\
    \ 类\n\n根据 UML 图创建一个 `Average` 类。\n\n| Average |\n| --- |\n| -data[] : int |\n\
    | -mean: double |\n| +Average() |\n| +calculateMean(): void |\n| +toString():\
    \ String |\n| +selectionSort(): void |\n\n此类允许用户向数组输入 5 个分数。它将数据按降序排列并计算平均值。\n\
    \n- data[]——包含分数的数组\n- mean——分数的算术平均值\n\n- **Average**——构造函数。它为数组分配内存。使用 for 循环反复显示，指示用户应输入分数\
    \ 1，提示分数 2，注意：计算机从 0 开始计数，但人们从 1 开始计数，你的提示应该考虑到这一点。例如，当用户输入分数 1 时，它将存储在索引 0 中。用户将调用\
    \ **selectionSort** 和 **calculateMean** 方法。\n- **calculateMean**——该方法使用 for 循环访问数组中的每个分数并将其加到运行总中。总和除以分数数量（数组长度），结果存储在\
    \ mean 中。\n- **toString**——返回一个包含降序数据和平均值的字符串。\n- **selectionSort**——该方法使用选择排序算法将数据从高到低重新排列。\n\
    \n"
