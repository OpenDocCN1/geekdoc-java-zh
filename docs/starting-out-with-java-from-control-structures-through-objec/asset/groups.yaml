    # # Chapter 8 Lab


    Arrays


    # Objectives


    +   - Be able to declare and instantiate arrays

    - Be able to fill an array using a for loop

    - Be able to access and process data in an array

    - Be able to write a sorting method

    - Be able to use an array of objects


    # Introduction


    Everyone is familiar with a list. We make shopping lists, to-do lists, assignment
    lists, birthday lists, etc. Notice that though there may be many items on the
    list, we call the list by one name. Notice that the idea of the array, one name
    for a list of related items. In this lab, we will work with lists in the form
    of an array.


    It will start out with a list of numbers. We will learn how to process the contents
    of an array. We will also explore sorting algorithms, using the selection sort.
    We will then move onto more complicated arrays, arrays that contain objects.'
