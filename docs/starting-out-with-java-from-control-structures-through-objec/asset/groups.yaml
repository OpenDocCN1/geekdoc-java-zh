    These attributes become fields in our class. The television object will also be
    able to control the state of its attributes. These controls methods in our class.


    +   - **setChannel**: The setChannel method will store the desired state in the
    channel field.

    - **power**: The power method will toggle the power between on and off, changing
    the value stored in powerOn from false to true or from true to false.

    - **increaseVolume**: The increaseVolume method will increase the value stored
    in the volume field by 1.

    - **decreaseVolume**: The decreaseVolume method will decrease the value stored
    in the volume field by 1.

    - **getChannel**: The getChannel method will return the value stored in the channel
    field.

    - **getVolume**: The getVolume method will return the value stored in the volume
    field.

    - **getManufacturer**: The getManufacturer method will return the constant value
    stored in the MANUFACTER field.

    - **getScreenSize**: The getClientSize method will return the constant value stored
    in the SCREEN_SIZE field.


    We will also need a constructor method that will be used to create an instance
    of a Television.

