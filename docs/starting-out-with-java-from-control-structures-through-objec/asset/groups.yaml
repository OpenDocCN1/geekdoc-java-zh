  mdcn: "\n\n# 第 10 章实验\n\n文本处理与包装类\n\n# 目标\n\n- 使用 `Character` 类和 `String` 类的方法来处理文本\n\
    - 能够使用 `StringTokenizer` 和 `StringBuilder` 类\n\n# 引言\n\n在本次实验中，我们要求用户输入军事时间（24\
    \ 小时制）。如果输入的是有效的军事时间，程序将将其转换并显示相应的常规时间（12 小时制，带有 AM 或 PM）。如果输入的不是有效的军事时间，则会在控制台上打印一条错误信息。\n\
    \n思考一下你将如何将军事时间 00:00 到 23:59 转换为常规时间。同时也要考虑哪些军事时间是有效的。要成为有效数据，数据必须具有特定的格式。首先，它必须恰好有\
    \ 5 个字符。其次，第一个和最后两个位置只允许数字，且中间位置始终使用冒号。接着，我们需要确保小时数不会超过 23，分钟不会超过 59。这要求我们分离出包含小时和分钟的子字符串。在将军事时间转换为常规时间时，我们不需要担心小时大于\
    \ 12 的情况，完全不需要对数字做任何处理。为了进行转换，我们需要减去 12，将其与冒号和分钟重新组合，并指示为 PM。请记住，军事时间的 00:00 是\
    \ 12:00 AM（午夜），军事时间的 12:00 是 12:00 PM（正午）。\n\n我们需要使用多种 `Character` 类和 `String`\
    \ 方法来验证数据并将其分离以便进行处理。我们还将使用一个 `Character` 类方法允许用户在需要时继续程序。\n\n`StringTokenizer`\
    \ 类将允许我们处理文本文件以解码秘密消息。我们将使用从文件中读取的每 5 个标记的第一个字母来显示秘密消息。\n\n# 任务 #1 Character 和\
    \ String 类方法\n\n- 1. 从 www.awave.com/cssupport 或按照教师指示复制文件 `Time.java`（代码列表 10.1）和\
    \ `TimeDemo.java`（代码列表 10.2）。\n\n- 2. 在 `Time.java` 文件中，为决策结构添加验证数据的条件。需要这些条件来：\n\
    \  a) 检查字符串的长度\n  b) 检查冒号的位置\n  c) 检查所有其他字符均为数字\n\n- 3. 添加行将字符串分离为两个包含小时和分钟的子字符串。将这些子字符串转换为整数并保存到实例变量中。\n\
    \n- 4. 在 `TimeDemo` 类中，为循环添加一个条件，在检查用户答案之前将其转换为大写字母。\n\n- 5. 编译、调试并运行。使用以下有效输入测试你的程序：00:00,\
