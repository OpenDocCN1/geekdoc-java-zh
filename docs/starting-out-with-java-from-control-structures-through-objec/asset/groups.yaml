    \n## 第 5 章 实验：方法\n\n### 目标\n- 能够编写方法\n- 能够调用方法\n- 能够编写 javadoc 注释\n- 能够使用 javadoc\
    \ 为 Java 类创建 HTML 文档\n\n### 简介\n方法通常用于将问题分解为小的、易于管理的单元。一个大任务可以分解为较小的任务（方法），这些任务包含了如何完成该小任务的细节。然后通过按顺序实现较小的任务（调用方法）来解决大问题。\n\
    \n这也为了提高效率，因为方法可以根据需要多次调用，而无需每次都重新编写代码。\n\n最后，我们将为每个方法使用文档注释，并生成与我们过的 Java API\
    \ 类似的 HTML 文档。\n\n## 任务 #1 void 方法\n\n1. 复制 `Geometry.java` 文件（代码列表 5.1）。按照老师的要求完成该文件。该程序可以编译，但在运行时，它似乎什么都不做。在\
    \ `main` 方法上方，为 `Geometry` 类创建一个名为 `printMenu` 的静态方法，它没有参数且没有返回值。该方法将向用户显示如下菜单：\n\
    ```\n这是一个几何计算器\n1. 圆形的面积\n2. 矩形的面积\n3. 三角形的面积\n4. 圆形的周长\n5. 矩形的周长\n6. 三角形的周长\n\
    你的选择：\n```\n2. 在 `main` 方法中添加代码来调用 `printMenu` 方法。使用 `do-while` 循环允许用户选择任何选项。\n\
    3. 编译、调试并运行程序。\n\n## 任务 #2 返回值的方法\n\n1. 编写一个名为 `circleArea` 的静态方法，接收半径并返回 $r^2$。\n\
    2. 编写一个名为 `rectangleArea` 的静态方法，接收长度和宽度并返回 $lw$。\n3. 编写一个名为 `triangleArea` 的静态方法，接收底和高并返回\
    \ $\\frac{1}{2}bh$。\n4. 编写一个名为 `circleCircumference` 的静态方法，接收半径并返回 $2\\pi r$。\n\
