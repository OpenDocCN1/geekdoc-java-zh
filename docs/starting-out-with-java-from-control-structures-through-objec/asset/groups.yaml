    \ 能够编写带有参数的实例方法\n- 能够实例化对象\n- 能够使用调用实例方法来访问和更改对象的状态\n\n## 引言\n\n每个人对电视机都很熟悉。这就是我们将在本实验中创建的对象。首先，我们需要一个蓝图。所有制造商在生产的电视中都有相同的基本元素，也有许多选项。我们将处理所有电视共有的几个基本元素。想一下一台普通的电视。它有一个品牌名称（由特定制造商制造）。电视屏幕有特定的尺寸。它有一些基础控制按钮。有一个开关电源的控制按钮。有一个切换频道的控制按钮。还有一个音量控制按钮。在任何时刻，电视的状态都可以通过这些控制按钮的设置来描述。\n\
    \n我们将编写 `Television` 类。从 `Television` 类创建的每个对象都必须字段的实例。因此，电视的状态将具有以下属性：\n\n- **manufacturer**（制造商）。manufacturer\
    \ 属性将持有品牌名称。电视创建后，该属性无法更改，因此它是一个命名常量。\n- **screenSize**（屏幕尺寸）。screenSize 属性将持有电视屏幕的大小。电视创建后，该属性无法更改，因此它是一个命名常量。\n\
    - **powerOn**（电源状态）。如果电源开启，该属性持有 true 值；如果关闭，则持有 false。\n- **channel**（频道）。channel\
    \ 属性将持有电视正在显示的电台频道值。\n- **volume**（音量）。volume 属性将持有一个代表响度的数值值（0 表示无声）。\n\n# 《Starting\
    \ Out with Java 5: From Control Structures to Objects》配套手册\n\n这些属性成为我们类中的字段。电视对象还能控制其属性的状态。这些控制功能是的方法类中的方法。\n\
    \n- **setChannel**：setChannel 方法将所需的状态存储在 channel 字段中。\n- **power**：power 方法将在开启和关闭之间切换电源，将存储在\
    \ powerOn 中的值从 false 更改为 true 或从 true 更改为 false。\n- **increaseVolume**：increaseVolume\
    \ 方法将 volume 字段中存储的值加 1。\n- **decreaseVolume**：decreaseVolume 方法将 volume 字段中存储的值减\
