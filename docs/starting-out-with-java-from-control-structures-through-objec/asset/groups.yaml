    ## 任务 #1 扩展 BankAccount


    1. 从 www.aw.com/cssupport 或按照老师指示复制文件 AccountDriver.java (代码列表 11,1) 和 BankAccount.java
    (代码列表 11,2)。BankAccount.java 已完成，不需要修改。


    2. 创建一个名为 `CheckingAccount` 的新类，它继承自 `BankAccount`。


    3. 它应该有一个静态常量 `FEE`，代表处理一张支票的费用。它的值应等于 15 分。


    4. 编写一个接受名称和初始金额作为参数的构造函数。它应该将 `accountNumber` 初始化为当前 `accountNumber` 值拼接 `-10`。所有的支票账户通过扩展
    `-10` 来标识。每个账号只能有一个账户。记住，由于 `accountNumber` 是 `BankAccount` 中的私有成员，必须通过变器方法（mutator
    method）进行更改。


    5. 编写一个新的实例方法 `withdraw`，重写父类中的 `withdraw` 方法。该方法应该接收要提取的金额，将其加上支票处理费，并调用父类的 `withdraw`
    方法。记住，要重写该方法，必须具有相同的方法头。注意父类中的 `withdraw` 方法根据是否能够完成提取返回 `true` 或 `false`。重写的方法也必须返回调用父类
    `withdraw` 方法后相同的 `true` 或 `false`。


    6. 编译并调试此类。


    ## 任务 #2 创建第二个子类


    1. 创建一个名为 `SavingsAccount` 的新类，它继承自 `BankAccount`。


    2. 它应该包含一个实例变量 `rate`，代表年利率。将其设置为 2.5%。


    3. 它还应该有一个实例变量 `savingsNumber`，初始化为 0。在该银行中，你有一个账号，但每个账号下可以有多个储蓄账户。每个单独的储蓄账户通过连字符
    `-` 之后的数字来标识。例如，10001-0 是第一个储蓄账户，10001-1 是另一个属于你账户的账户。这样你就可以将资金与其他资金分开，就像圣诞储蓄账户一样。


    4. 实例变量 `accountNumber` 将隐藏父类中的 `accountNumber`，该变量也应该在此类中。


    5. 编写一个接受名称和初始余额作为参数的构造函数，并调用父类的构造函数。它应该将 `accountNumber` 初始化为父类 `accountNumber`（隐藏的实例变量）的值拼接一个连字符，然后
    `savingsNumber`。


    6. 编写一个没有参数且没有返回值的方法 `postInterest`。该方法将计算一个月的利息并存入账户。


    7. 编写一个重写父类中 `getAccountNumber` 方法。


    8. 编写一个拷贝构造函数，为同一个人创建另一个储蓄账户。它应该接受原始储蓄账户和初始余额作为参数。它应该调用父类的拷贝构造函数，将 `savingsNumber`
    设置为原始储蓄账户 `savingsNumber` 加一。它应该将 `accountNumber` 设置为父类的 `accountNumber` 拼接连字符以及新账户的
    `savingsNumber`。


    9. 编译并调试此类。


    10. 使用 `AccountDriver` 类测试你的类。如果你正确命名并创建了类和方法，不会遇到任何困难。如果你有错误，请勿编辑 `AccountDriver`
    类。你必须使你的类与此程序配合。


    11. 运行程序应得到以下输出：

