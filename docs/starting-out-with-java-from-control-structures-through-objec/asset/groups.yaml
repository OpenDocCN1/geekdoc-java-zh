  mdcn: "\n\n## 第 3 章 实验\n选择控制结构\n\n## 目标\n\n- 能够构建布尔表达式来评估给定的条件\n- 能够比较字符串（Strings）\n\
    - 能够使用标记（flag）\n- 能够构建 if 和 if-else-if 语句来执行特定任务\n- 能够构建 switch 语句\n- 能够对数字进行格式化\n\
    \n## 引言\n\n到目前为止，你编写的所有程序都具有顺序控制结构。这意味着所有语句都按顺序一个接一个地执行。有时，我们需要让计算机根据数据做出决策。选择控制结构允许计算机选择执行哪条语句。\n\
    \n为了让计算机做出决策，我们需要进行比较。因此，我们将学习编写布尔表达式。布尔表达式使用关系运算符和逻辑运算符来创建一个可以评估为真或假的条件。\n\n\
    一旦我们有了条件，就可以根据条件选择性执行语句。这意味着程序中的某些语句可能会执行，也可能不执行，取决于条件。\n\n我们还可以将条件语句链在一起，允许计算机从几种方案中进行选择。我们将通过嵌套的\
    \ if-else 语句以及 switch 语句来探索这一点。\n\n在实验中，我们将修改一个披萨订单程序。该程序根据用户所需的规格创建一个披萨对象。它会引导用户点餐，提供用户选择，程序然后根据这些选择来决定如何制作披萨以及披萨的成本。如果用户的名字是\
    \ Mike 或 Diane，他们还将获得 $2.00 的折扣。\n\n## 任务 #1 if 语句、字符串比较和标记\n\n- 1. 从 www.aw.com/support\
    \ 或按照教师的指示复制 `PizzaOrder.java` 文件（参见代码列表 3.1）。\n- 2. 编译并运行 `PizzaOrder.java`。你将能够进行选择，但此时，无论你选择什么，都将获得一个基础价格为\
    \ $12.99 的手拍披萨。你可以选择配料，这些配料应该被正确地添加到价格中。你还会注意到输出格式看起来并不漂亮。因此，我们需要编辑 `PizzaOrder.java`\
    \ 来完成程序，使其正常工作。\n- 3. 构建一个简单的语句。该条件将用户输入的第一个名字字符串与所有者 Mike 和 Diane 的名字进行比较。请确保比较是不区分大小写的。\n\
    - 4. 如果用户拥有其中一个名字，则将折扣标记设置为 `true`。这在此时不会影响价格。\n\n## 任务 #2 if-else-if 语句\n\n-\
    \ 1. 编写一个 if-else-if 语句，根据用户输入的尺寸（10, 12, 14 或 16）让计算机选择执行哪条语句。对于每个选项，都需要将成本设置为相应的金额。\n\
    - 2. 上述 if-else 语句的默认 `else` 应该打印一条语句，说明用户输入的选项之一，因此将制作 12 英寸的披萨。它还应该将尺寸设置为 12，成本设置为\
    \ 12.99。\n- 3. 编译、调试并运行。你现在应该能够获得尺寸和价格的正确输出（它仍然是手拍饼底，输出看起来不像金钱，而且尚未应用折扣）。多次运行你的程序，分别订购\
    \ 10、12、14、16 和 17 英寸的披萨（注：17 英寸将用于测试 else 逻辑）。\n\n## 任务 #3 switch 语句\n\n- 1.\
    \ 编写一个 switch 语句，将用户的选择与相应的字符进行比较（确保大写字母和小写字母都可以用）。\n- 2. 每个 `case` 将指示饼底类型的相应字符串赋值给\
    \ `crust` 变量。\n- 3. `default` 情况将打印一条语句，说明用户输入的不是选项之一，因此将制作手拍饼底。\n- 4. 编译、调试并运行。你现在应该能够获得手拍以外的饼底类型。多次运行你的程序，以确保\
    \ switch 语句的所有情况运行正常。\n\n## 任务 #4 使用标记作为条件\n\n- 1. 编写一个使用标记作为条件的 if 语句。记住标记是一个布尔变量，因此为\
    \ `true` 或 `false`。它不需要与任何内容进行比较。\n- 2. if 语句体应包含两个语句：\n    a) 打印消息的语句，表明用户有资格获得\
    \ $2.00 的折扣。\n    b) 将变量成本减少 2 的语句。\n- 3. 编译、调试并运行。使用所有者的名字（包括大写和非大写）以及不同的名字来测试你的程序。此时折扣应该是正确的。\n\
    \n## 任务 #5 数字格式化\n\n- 1. 在类声明上方添加 import 语句以使用 `DecimalFormat` 类。\n- 2. 创建一个始终显示\
    \ 2 位小数的 `DecimalFormat` 对象。\n- 3. 编辑 main 方法中的相应行，使任何货币输出都保留 2 位小数。\n- 4. 编译、调试并运行。此时你的输出应该是完全正确的，数字输出应该看起来像金钱。\n\
    \n## 代码列表 3.1 (PizzaOrder.java)\n\n```java\nimport java.util.Scanner;\nimport\
    \ java.text.DecimalFormat;\n/**\n * 此程序允许用户订购披萨。\n */\npublic class PizzaOrder\
    \ {\n    public static void main (String args) {\n        Scanner keyboard = new\
    \ Scanner (System.in);\n        String firstName;\n        boolean discount =\
    \ false;\n        int inches;\n        char crustType;\n        String toppings\
    \ = \"\";\n        int numberOfToppings = 0;\n        double cost = 12.99;\n \
    \       final double TAX_RATE = .08;\n        double tax;\n        DecimalFormat\
    \ df = new DecimalFormat(\"$0.00\");\n\n        System.out.println(\"Welcome to\
    \ Mike and Diane's Pizza\");\n        System.out.print(\"Enter first name: \"\
    );\n// ... 省略部分代码逻辑\n```\n\n"
