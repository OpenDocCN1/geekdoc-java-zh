    ## 第1章实验


    ### 算法、错误与测试


    ### 目标


    - 能够编写算法

    - 能够编译 Java 程序

    - 能够使用 Java 执行程序

    - 能够测试程序

    - 能够调试带有语法和逻辑错误的程序


    ### 引言


    你的老师将介绍 Java 的编程环境。在教材的第一章中，我们讨论了编写你的第一个程序。它通过工作时间乘以时薪来计算总工资。然而，并不总是这样计算的。如果你工作了45
    小时呢？加班时间需要支付1倍。在本实验中，你将获得一个计算包含或不包含加班费的程序。为了输出结果，我们将使用伪代码来编写算法。这将使你在学习 Java 语言的同时练习算法。


    你还需要测试此程序以确保算法的正确性。你需要开发代表用户可能使用的所有类型的数据。你也将调试程序。错误有几种。在本实验中，你将遇到语法错误和逻辑错误。我们将在实验2中探索运行时错误。


    1. 语法错误——编程语言的“语法”。这些错误由编译器捕捉并列出行号和错误。你将通过经验理解它们告诉你的。所有的语法错误必须在程序运行之前修正。如果程序运行，并不意味着它是正确的，只意味着没有语法错误。错误的示例是变量名拼写错误、缺少分号、括号不匹配等。


    2. 逻辑错误——算法逻辑中的错误。这些错误强调了对正确算法的需求。如果语句顺序错误、公式有错误或缺少步骤，程序仍然可以运行并输出，但输出可能是错误的。逻辑错误没有列表，除非检查输出，否则你可能意识意识到自己有错误。知道预期的结果非常重要。你应该用不同的输入来测试程序，并知道每种情况下预期的输出。例如，如果你的程序计算工资，你应该检查三种不同的情况：少于40小时、40小时和超过40小时。在运行程序之前，手动计算每种情况，以便知道预期的结果。你可能会在一种情况下得到正确答案，但在另一种情况下却不会。这将帮助你找出逻辑错误在哪里。


