    # # Chapter 4 Lab


    Loops and Files


    # Objectives


    +   - Be able to convert an algorithm using control structures into Java

    - Be able to write a while loop

    - Be able to do an do-while loop

    - Be able to write a for loop

    - Be able to use the Random class to generate random numbers

    - Be able to use file streams for end of file

    - Be able to write a loop that reads until end of file

    - Be able to implement an accumulator and a counter


    # Introduction


    This is a simulation of rolling dice. Actual results approach theory only when
    the sample size is large. So we will need to repeat rolling the dice a large number
    of times (we will use 10,000). The theoretical probability of rolling doubles
    of a specific number is 1 out of 36 or approximately 278 out of 10,000 times that
    you roll the pair of dice. Since this is a simulation, the numbers will vary a
    little each time you run it.


    Check out how to use the random number generator (introduced in section 4.11 of
    the text) to get a number between 1 and 6 to create the simulation.


    We will continue to use control structures that we have already learned, while
    exploring control structures for repetition. We shall also continue our work with
    algorithms, translating a given algorithm to Java in order to complete our program.
    We will start with a while loop, then use the same program, changing the loop
    to a do-while loop, and then a for loop.


    We will be introduced to file input and output. We will read a file, line by line,
    converting each line into a number. We will then use the numbers to calculate
    the mean and standard deviation.


    First we will learn how to use file output to get results in a file. Next we will
    use file input to read the numbers from a file and calculate the mean. Finally,
    we will see that when the file is closed, and then reopened, we will start reading
    from the top of the file again so that we can calculate the standard deviation.'
