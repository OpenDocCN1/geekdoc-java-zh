  md: '# Mediator Pattern Principle


    Mediator Pattern : Defines simplified communication between classes. Define an
    object that encapsulates how a set of objects interact. Mediator promotes loose
    coupling by keeping objects from referring to each other explicitly, and it lets
    you vary their interaction independently.


    +   1. Mediator plays a regulatory role in gaming systems, explosion systems,
    and media systems


