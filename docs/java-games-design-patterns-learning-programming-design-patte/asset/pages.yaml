  md: "# Iterator:\n\n```\nboolean hasNext(): It returns true if Iterator has more\
    \ element\nObject next(): It returns the next element in the list.\n```\n\nIterator.java\
    \ a in package com.iterator.principle;\n\n```\npublic interface Iterator {\n \
    \   public boolean hasNext();\n    public Object next();\n}\n```\n\nIteratorImpl.java\
    \ a in package com.iterator.principle;\n\n```\npublic class IteratorImpl implements\
    \ Iterator {\n    private int index ;\n    private List list;\n\n    public IteratorImpl(List\
    \ list) {\n        this.list = list;\n    }\n\n    public boolean hasNext() {\n\
    \        return index < list.size();\n    }\n\n    public Object next() {\n  \
    \      Object element = null;\n        if (index < list.size()) {\n          \
    \  element = list.get(index);\n            index++;\n        }\n        return\
    \ element;\n    }\n}\n```"
