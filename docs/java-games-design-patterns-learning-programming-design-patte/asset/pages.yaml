    \ Map<String,String> cacheMap : Store data as key-value pairs\n2. static void\
    \ put(String key, String image): store data\n3. static String get(String key):\
    \ get value by key\n\nImageCache.java in package com.flyweight.principle;\n\n\
    ```\nimport java.util.*;\npublic class ImageCache {\n    private static Map<String,String>\
    \ cacheMap=new HashMap<String,String>();\n    private ImageCache(){\\}\n    public\
    \ static void put(String key, String image){\n        cacheMap.put(key, image);\n\
    \    }\n```"
