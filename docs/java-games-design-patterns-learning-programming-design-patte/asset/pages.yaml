  md: '# Template Pattern Principle


    Template Pattern : Defer the exact steps of an algorithm to a subclass. Define
    the skeleton of an algorithm in an operation, deferring some steps to subclasses.
    Template Method lets subclasses redefine certain steps of an algorithm without
    changing the algorithm''s structure.


    +   1. BluePlane inherit from Sprite Template for reuse.


    | Sprite |

    | --- |

    | int x |

    | int y |

    | String name |

    | Sprite(String name, int x, int y) |

    | draw() |

    | move(int distanceX, int distanceY) |


    ![](img/1a3fab3d51f12ead42a519c23c1a64ba_5_0.png)


    # Sprite:


    +   1. x: x coordinate of Canvas

    2. y: y coordinate of Canvas

    3. Sprite(String name, int x, int y): constructor method

    4. draw(): draw sprite on canvas

    5. move( int distanceX, int distanceY): sprite move on canvas'
