    \ in package com.singleton.principle;\n\n```java\npublic class RedPlane extends\
    \ Sprite{\n    public RedPlane(String bufferedImage, int x, int y) {\n       \
    \ super (bufferedImage, x, y);\n    }\n}\n```\n\n# ImageUtil:\n\n1. `private ImageUtil()`:\
    \ Not allow to create multiple instances\n2. `static String loadImage(String imagePath)`:\
    \ load image\n\nImageUtil.java in package com.singleton.principle;\n\n```java\n\
