    # TiledLayer:


    A TiledLayer is a visual element composed of a grid of cells that can be filled
    with a set of tile images. This class allows large virtual layers to be created
    without the need for an extremely large Image. This technique is commonly used
    in 2D gaming platforms to create very large scrolling backgrounds


    # Tiles:


    The tiles used to fill the TiledLayer''s cells are provided in a single Image
    object. The Image is broken up into a series of equally-sized tiles; the tile
    size is specified along with the Image. As shown in the figure below, the same
    tile set can be stored in several different arrangements depending on what is
    the most convenient for the game developer.


    ![](img/1a3fab3d51f12ead42a519c23c1a64ba_240_0.png)


    Each tile is assigned a unique index number. The tile located in the upper-left
    corner of the Image is assigned an index of 1. The remaining tiles are then numbered
    consecutively in row-major order (indices are assigned across the first row, then
    the second row, and so on).'
