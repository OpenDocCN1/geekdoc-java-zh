    \ a global point of access to it.\n\n- **BluePlane** and **RedPlane** load image\
    \ by **ImageUtil** Singleton instance.\n\nImageUtil:\n\n1. `private ImageUtil()`:\
    \ Not allow to create multiple instances\n2. `static String loadImage(String imagePath)`:\
    \ load image\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_16_0.png)\n\n# Sprite.java\
    \ in package com.singleton.principle;\n\n```java\nclass Sprite {\n    protected\
    \ int x; // x coordinate of Canvas\n    protected int y; // y coordinate of BufferedImage\n\
    \    protected String bufferedImage;\n\n    public Sprite(BufferedImage bufferedImage,\
    \ int x, int y) {\n        this.bufferedImage = bufferedImage;\n        this.x\
    \ = x;\n        this.y = y;\n    }\n\n    public void draw() {\n        String\
    \ text = this.bufferedImage + \" draw on (\" + this.x + \",\" + this.y + \")\"\
    ;\n        System.out.println(text);\n    }\n\n    public void move(int distanceX,\
    \ int distanceY) {\n        String text = this.bufferedImage + \" move distance\
    \ (\" + distanceX + \",\" + distanceY + \")\";\n        System.out.println(text);\n\
    \    }\n}\n```\n\n# BluePlane.java in package com.singleton.principle;\n\n```java\n\
    public class BluePlane extends Sprite {\n    public BluePlane(BufferedImage bufferedImage,\
