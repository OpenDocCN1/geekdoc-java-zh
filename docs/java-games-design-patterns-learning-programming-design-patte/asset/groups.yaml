- md: "\n## Java Games Design Patterns\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_0_0.png)\n\
    \nLearning Programming design patterns through games\n\n## Java Games Design Patterns\n\
    \n![](img/1a3fab3d51f12ead42a519c23c1a64ba_1_0.png)\n\nLearning Programming design\
    \ patterns through games\n\n# Java Games Design Patterns\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_2_0.png)\n\
    \n# YANG HU\n\nSimple is the beginning of wisdom. This book briefly explain the\
    \ concept and real practice examples in games, you will learn easy and fun.\n\n\
    http://en.verejava.com\n\nCopyright © 2020 Yang Hu\nAll rights reserved.\nISBN\
    \ : 979864812538 4\n\n# CONTENTS\n\n- 1. Template Pattern Principle\n- 2. Template\
    \ Pattern Game\n- 3. Singleton Pattern Principle\n- 4. Singleton Pattern Game\n\
    - 5. Flyweight Pattern Principle\n- 6. Flyweight Pattern Game\n- 7. Builder Pattern\
    \ Principle\n- 8. Builder Pattern Game\n- 9. Command Pattern Principle\n- 10.\
    \ Command Pattern Game\n- 11. Factory Pattern Principle\n- 12. Factory Pattern\
    \ Game\n- 13. Strategy Pattern Principle\n- 14. Strategy Pattern Game\n- 15. Bridge\
    \ Pattern Principle\n- 16. Bridge Pattern Game\n- 17. Iterator Pattern Principle\n\
    - 18. Iterator Pattern Game\n- 19. Decorator Pattern Principle\n- 20. Decorator\
    \ Pattern Game\n- 21. Composite Pattern Principle\n- 22. Composite Pattern Game\n\
    - 23. Chain Pattern Game\n- 24. Observer Pattern Game\n- 25. Mediator Pattern\
    \ Principle\n- 26. Mediator Pattern Game\n- 27. State Pattern Game\n\nIf you want\
    \ to learn this book, you must have basic knowledge of Java, you can learn our\
    \ course << Easy Learning Java (3 Editionon)>>\nhttp://en.verejava.com\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_4_0.png)\n\
    \nIf you already have basic knowledge of Java skip it, start an exciting journey\n\
    \nDownload GameDesignPatternImages.zip all images for this book.\nhttp://en.verejava.com/download.jsp?id=1\n\
    \n# Template Pattern Principle\n\nTemplate Pattern : Defer the exact steps of\
    \ an algorithm to a subclass. Define the skeleton of an algorithm in an operation,\
    \ deferring some steps to subclasses. Template Method lets subclasses redefine\
    \ certain steps of an algorithm without changing the algorithm's structure.\n\n\
    - 1. BluePlane inherit from Sprite Template for reuse.\n\n| Sprite |\n| --- |\n\
    | int x |\n| int y |\n| String name |\n| Sprite(String name, int x, int y) |\n\
    | draw() |\n| move(int distanceX, int distanceY) |\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_5_0.png)\n\
    \n# Sprite:\n\n- 1. x: x coordinate of Canvas\n- 2. y: y coordinate of Canvas\n\
    - 3. Sprite(String name, int x, int y): constructor method\n- 4. draw(): draw\
    \ sprite on canvas\n- 5. move( int distanceX, int distanceY): sprite move on canvas\n\
    \n![](img/1a3fab3d51f12ead42a519c23c1a64ba_6_0.png)\n\n# Sprite.java in package\
    \ com.template.principle;\n\n```java\nclass Sprite {\n    protected int x; //\
    \ x coordinate of Canvas\n    protected int y; // y coordinate of Canvas\n   \
    \ protected String name ;\n\n    public Sprite(String name, int x, int y) {\n\
    \        this.name = name;\n        this.x = x;\n        this.y = y;\n    }\n\n\
    \    public void draw() {\n        String text = this.name + \" draw on (\" +\
    \ this.x + \", \" + this.y + \")\";\n        System.out.println(text);\n    }\n\
    \n    // distance: moved in the x-axis\n    // distance: moved in the y-axis\n\
    \    public void move(int distanceX, int distanceY) {\n        String text = this.name\
    \ + \" move distance (\" + distanceX + \", \" + distanceY + \")\";\n        System.out.println(text);\n\
    \    }\n}\n```\n\nBluePlane.java in package com.template.principle;\n\n```java\n\
    public class BluePlane extends Sprite{\n    public BluePlane(String name, int\
    \ x, int y) {\n        super (name, x, y);\n    }\n}\n```\n\n2. Create a Test\
    \ class : TestTemplate.java in package com.template.principle;\n\n```java\npublic\
    \ class TestTemplate {\n    public static void main(String[] args) {\n       \
    \ BluePlane bluePlane = new BluePlane(\"BluePlane\", 50,150);\n        bluePlane.draw();\n\
    \        bluePlane.move(5, 5);\n    }\n}\n```\n\n# Result:\n\nBluePlane draw on\
    \ (50 , 150)\nBluePlane move distance (5 , 5)\n\n# Template Pattern Game\n\n1.\
    \ BluePlane draw on canvas, Press the keyboard to move up, down, left, right.\n\
    \n```java\npublic void keyPressed(KeyEvent e) {\n    int keyCode = e.getKeyCode();\n\
    \    if(keyCode == KeyEvent.VK_UP){\n        bluePlane.move(0,-6);\n    } else\
    \ if(keyCode == KeyEvent.VK_DOWN){\n        bluePlane.move(0,6);\n    } else if(keyCode\
    \ == KeyEvent.VK_RIGHT){\n        bluePlane.move(6,0);\n    } else if(keyCode\
    \ == KeyEvent.VK_LEFT){\n        bluePlane.move(-6,0);\n    }\n    Canvas.this.repaint();\n\
    }\n```\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_9_0.png)\n\n# 2. UML Diagram\
    \ BluePlane inherit from Sprite Template for reuse.\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_10_0.png)\n\
    \n# Sprite:\n\n- 1. x: x coordinate of Canvas\n- 2. y: y coordinate of Canvas\n\
    - 3. BufferedImage image : the image of BluePlane (blue_plane.png )\n- 4. Sprite(int\
    \ x, int y, BufferedImage image): constructor method\n- 5. draw(Graphics g): draw\
    \ sprite on canvas\n- 6. move(int distanceX, int distanceY): sprite move on canvas\n\
    \n# Sprite.java in package com.template.game;\n\n```java\nimport java.awt.Graphics;\n\
    import java.awt.image.BufferedImage;\n\nclass Sprite {\n    protected int x; //\
    \ x coordinate of Canvas\n    protected int y; // y coordinate of Canvas\n   \
    \ protected BufferedImage image;\n\n    public Sprite(int x, int y, BufferedImage\
    \ image){\n        this.x = x;\n        this.y = y;\n        this.image = image;\n\
    \    }\n\n    public void draw(Graphics g){\n        g.drawImage(image, this .x,\
    \ this .y, null);\n    }\n\n    public void move(int distanceX, int distanceY){\n\
    \        this.x = this .x + distanceX;\n        this.y = this .y + distanceY;\n\
    \    }\n}\n```\n\n# BluePlane.java in package com.template.game;\n\n```java\n\
    import java.awt.image.BufferedImage;\npublic class BluePlane extends Sprite{\n\
    \    public BluePlane(int x, int y, BufferedImage image) {\n        super(x, y,\
    \ image);\n    }\n}\n```\n\n# Sprite:\n\n- 1. x: x coordinate of Canvas\n- 2.\
    \ y: y coordinate of Canvas\n- 3. BufferedImage image : the image of BluePlane\n\
    - 4. draw(Graphics g): can draw sprite on canvas and can also be called explicitly\
    \ by the repaint() method.\n\n# Canvas.java in package com.template.game;\n\n\
    ```java\nimport java.awt.*;\nimport java.awt.event.*;\nimport java.awt.image.BufferedImage;\n\
    import java.io.*;\nimport javax.imageio.ImageIO;\nimport javax.swing.*;\n\npublic\
    \ class Canvas extends JPanel {\n    private BufferedImage blueimage;\n    private\
    \ Sprite bluePlane;\n\n    public Canvas() {\n        this.setLayout(null);\n\
    \        this.setBackground(Color.WHITE);\n        blueimage=loadImage(\"images/blue_plane.png\"\
    );\n        bluePlane = new BluePlane(120, 250, blueimage);\n    }\n\n    this.addKeyListener(new\
    \ KeyAdapter() {\n        public void keyPressed(KeyEvent e) {\n            int\
    \ keyCode = e.getKeyCode();\n            if(keyCode == KeyEvent.VK_UP){\n    \
    \            bluePlane.move(0,-6);\n            } else if(keyCode == KeyEvent.VK_DOWN){\n\
    \                bluePlane.move(0,6);\n            } else if(keyCode == KeyEvent.VK_RIGHT){\n\
    \                bluePlane.move(6,0);\n            } else if(keyCode == KeyEvent.VK_LEFT){\n\
    \                bluePlane.move(-6,0);\n            }\n            Canvas.this.repaint();\n\
    \        }\n    });\n\n    protected void paintComponent(Graphics g) {\n     \
    \   super.paintComponent(g);\n        bluePlane.draw(g);\n    }\n\n    public\
    \ BufferedImage loadImage(String imagePath) {\n        File file = new File(imagePath);\n\
    \        BufferedImage bufferedImage = null;\n        try {\n            bufferedImage\
    \ = ImageIO.read(file);\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n        return bufferedImage;\n    }\n}\n```\n\n3. Create a Test class\
    \ : TestTemplate.java in package com.template.game;\n\n```java\nimport java.awt.BorderLayout;\n\
    import javax.swing.JFrame;\npublic class TestTemplate {\n    public static void\
    \ main(String[] args) {\n        JFrame frame = new JFrame(\"Design Pattern Template\"\
    );\n        Canvas canvas = new Canvas();\n        frame.add(canvas, BorderLayout.CENTER\
    \ );\n        frame.setSize(300, 350);\n        canvas.setFocusable(true);\n \
    \       frame.setVisible(true);\n        canvas.requestFocus();\n    }\n}\n```\n"
  mdcn: "\n\n## Java 游戏设计模式\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_0_0.png)\n\
    \n通过游戏学习编程设计模式\n\n## Java 游戏设计模式\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_1_0.png)\n\
    \n通过游戏学习编程设计模式\n\n# Java 游戏设计模式\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_2_0.png)\n\
    \n# 杨华 (Y HU)\n\n简单是智慧的开始。本书简要介绍了游戏中的概念和实战案例，你将在轻松且有趣的过程中学习。\n\nhttp://en.verejava.com\n\
    \nCopyright © 2020 杨华\n保留所有权利。\nISBN : 979864812538 4\n\n# 目录\n\n- 1. 模板方法模式原理\n\
    - 2. 模板方法模式游戏\n- 3. 单例模式原理\n- 4. 单例模式游戏\n- 5. 重量地模式原理\n- 6. 重量地模式游戏\n- 7. 建造者模式原理\n\
    - 8. 建造者模式游戏\n- 9. 命令模式原理\n- 10. 命令模式游戏\n- 11. 工厂模式原理\n- 12. 工厂模式游戏\n- 13. 策略模式原理\n\
    - 14. 策略模式游戏\n- 15. 桥接模式原理\n- 16. 桥接模式游戏\n- 17. 迭代器模式原理\n- 18. 迭代器模式游戏\n- 19.\
    \ 装饰器模式原理\n- 20. 装饰器模式游戏\n- 21. 组合模式原理\n- 22. 组合模式游戏\n- 23. 责任链游戏\n- 24. 观察者模式游戏\n\
    - 25. 中介模式原理\n- 26. 中介模式游戏\n- 27. 状态模式游戏\n\n如果你想学习这本书，必须具备 Java 基础知识，你可以学习我们的课程\
    \ << Java学 Java（第三版）>>\nhttp://en.verejava.com\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_4_0.png)\n\
    \n如果你已经具备 Java 基础知识，请跳过此处，开始这段令人兴奋的旅程\n\n下载 GameDesignPatternImages.zip 获取书中的所有图片。\n\
    http://en.verejava.com/download.jsp?id=1\n\n# 模板方法模式原理\n\n模板方法：将算法的精确步骤推给子类。在操作中定义算法的骨架，并将某些步骤推给子类。模板方法允许子类在不改变算法结构的情况下重新定义算法的某些步骤。\n\
    \n- 1. BluePlane 继承自 Sprite 模板以实现复用。\n\n| Sprite |\n| --- |\n| int x |\n| int\
    \ y |\n| String name |\n| Sprite(String name, int x, int y) |\n| draw() |\n| move(int\
    \ distanceX, int distanceY) |\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_5_0.png)\n\
    \n# Sprite:\n\n- 1. x: 画布的 x 坐标\n- 2. y: 画布的 y 坐标\n- 3. Sprite(String name, int\
    \ x, int y): 构造方法\n- 4. draw(): 在画布上绘制 sprite\n- 5. move( int distanceX, int distanceY):\
    \ sprite 在画布上移动\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_6_0.png)\n\n# com.template.principle\
    \ 包下的 Sprite.java\n\n```java\nclass Sprite {\n    protected int x; // 画布的 x 坐标\n\
    \    protected int y; // 画布的 y 坐标\n    protected String name ;\n\n    public Sprite(String\
    \ name, int x, int y) {\n        this.name = name;\n        this.x = x;\n    \
    \    this.y = y;\n    }\n\n    public void draw() {\n        String text = this.name\
    \ + \" draw on (\" + this.x + \", \" + this.y + \")\";\n        System.out.println(text);\n\
    \    }\n\n    // distance: 在 x 轴上移动\n    // distance: 在 y 轴上移动\n    public void\
    \ move(int distanceX, int distanceY) {\n        String text = this.name + \" move\
    \ distance (\" + distanceX + \", \" + distanceY + \")\";\n        System.out.println(text);\n\
    \    }\n}\n```\n\ncom.template.principle 包下的 BluePlane.java\n\n```java\npublic\
    \ class BluePlane extends Sprite{\n    public BluePlane(String name, int x, int\
    \ y) {\n        super (name, x, y);\n    }\n}\n```\n\n2. 创建测试类：com.template.principle\
    \ 包下的 TestTemplate.java\n\n```java\npublic class TestTemplate {\n    public static\
    \ void main(String[] args) {\n        BluePlane bluePlane = new BluePlane(\"BluePlane\"\
    , 50,150);\n        bluePlane.draw();\n        bluePlane.move(5, 5);\n    }\n\
    }\n```\n\n# 结果:\n\nBluePlane draw on (50 , 150)\nBluePlane move distance (5 ,\
    \ 5)\n\n# 模板方法模式游戏\n\n1. BluePlane 在画布上，通过键盘移动上、下、左、右。\n\n```java\npublic void\
    \ keyPressed(KeyEvent e) {\n    int keyCode = e.getKeyCode();\n    if(keyCode\
    \ == KeyEvent.VK_UP){\n        bluePlane.move(0,-6);\n    } else if(keyCode ==\
    \ KeyEvent.VK_DOWN){\n        bluePlane.move(0,6);\n    } else if(keyCode == KeyEvent.VK_RIGHT){\n\
    \        bluePlane.move(6,0);\n    } else if(keyCode == KeyEvent.VK_LEFT){\n \
    \       bluePlane.move(-6,0);\n    }\n    Canvas.this.repaint();\n}\n```\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_9.png)\n\
    \n# 2. UML 图继承 Sprite 模板以实现复用。\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_10_0.png)\n\
    \n# Sprite:\n\n- 1. x: 画布的 x 坐标\n- 2. y: 画布的 y 坐标\n- 3. Sprite(String name, int\
    \ x, int y): 构造方法\n- 4. draw(): 在画布上绘制 sprite\n- 5. move( int distanceX, int distanceY):\
    \ sprite 在画布上移动\n\n# Canvas.java 在 com.template.game 包\n\n```java\nimport java.awt.*;\n\
    import java.awt.event.*;\nimport java.awt.image.BufferedImage;\nimport java.io.*;\n\
    import javax.imageio.ImageIO;\nimport javax.swing.*;\n\npublic class Canvas extends\
    \ JPanel {\n    private BufferedImage blueimage;\n    private Sprite bluePlane;\n\
    \n    public Canvas() {\n        this.setLayout(null);\n        this.setBackground(Color.WHITE);\n\
    \        blueimage=loadImage(\"images/blue_plane.png\");\n        bluePlane =\
    \ new BluePlane(120, 250, blueimage);\n    }\n\n    this.addKeyListener(new KeyAdapter()\
    \ {\n        public void keyPressed(KeyEvent e) {\n            int keyCode = e.getKeyCode();\n\
    \            if(keyCode == KeyEvent.VK_UP){\n                bluePlane.move(0,-6);\n\
    \            } else if(keyCode == KeyEvent.VK_DOWN){\n                bluePlane.move(0,6);\n\
    \            } else if(keyCode == KeyEvent.VK_RIGHT){\n                bluePlane.move(6,0);\n\
    \            } else if(keyCode == KeyEvent.VK_LEFT){\n                bluePlane.move(-6,0);\n\
    \            }\n            Canvas.this.repaint();\n        }\n    });\n\n   \
    \ protected void paintComponent(Graphics g) {\n        super.paintComponent(g);\n\
    \        bluePlane.draw(g);\n    }\n\n    public BufferedImage loadImage(String\
    \ imagePath) {\n        File file = new File(imagePath);\n        BufferedImage\
    \ bufferedImage = null;\n        try {\n            bufferedImage = ImageIO.read(file);\n\
    \        } catch (IOException e) {\n            e.printStackTrace();\n       \
    \ }\n        return bufferedImage;\n    }\n}\n```\n\n# BluePlane.java 在 com.template.game\n\
    \n```java\nimport java.awt.*;\nimport java.awt.image.BufferedImage;\n\npublic\
    \ class BluePlane extends Sprite {\n    public BluePlane(int x, int y, BufferedImage\
    \ image) {\n        super(x, y, image);\n    }\n}\n```\n\n# Sprite.java 在 com.template.game\n\
    \n```java\nimport java.awt.*;\nimport java.awt.image.BufferedImage;\n\nclass Sprite\
    \ {\n    protected int x;\n    protected int y;\n    protected BufferedImage image;\n\
    \n    public Sprite(int x, int y, BufferedImage image) {\n        this.x = x;\n\
    \        this.y = y;\n        this.image = image;\n    }\n\n    public void draw(Graphics\
    \ g) {\n        g.drawImage(image, x, y, null);\n    }\n\n    public void move(int\
    \ distanceX, int distanceY) {\n        this.x += distanceX;\n        this.y +=\
    \ distanceY;\n    }\n}\n```\n\n# TestTemplate.java 在 com.template.game\n\n```java\n\
    import java.awt.BorderLayout;\nimport javax.swing.JFrame;\n\npublic class TestTemplate\
    \ {\n    public static void main(String[] args) {\n        JFrame frame = new\
    \ JFrame(\"Design Pattern Template\");\n        Canvas canvas = new Canvas();\n\
    \        frame.add(canvas, BorderLayout.CENTER );\n        frame.setSize(300,\
    \ 350);\n        canvas.setFocusable(true);\n        frame.setVisible(true);\n\
    \        canvas.requestFocus();\n    }\n}\n```\n\n"
