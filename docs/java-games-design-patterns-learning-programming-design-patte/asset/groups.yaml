- md: "\n## Flyweight Pattern Principle\n\nFlyweight Pattern: A fine-grained instance\
    \ used for efficient sharing. Using sharing to support large numbers of fine-grained\
    \ objects efficiently. A flyweight is a shared object that can be used in multiple\
    \ contexts simultaneously. The flyweight acts as an independent object in each\
    \ context — it's indistinguishable from instance of the object's not shared.\n\
    \n- 1. ImageCache store game images like (Plane, EnemyPlane, Bullet).\n\n| ImageCache\
    \ |\n| :--- |\n| Map<String,String> cacheMap |\n| ImageCache() |\n| static void\
    \ put(String key, String image) |\n| static String get(String key) |\n\n**ImageCache:**\n\
    \n1. `Map<String,String> cacheMap`: Store data as key-value pairs\n2. `static\
    \ void put(String key, String image)`: store data\n3. `static String get(String\
    \ key)`: get value by key\n\n**ImageCache.java in package com.flyweight.principle;**\n\
    \n```java\nimport java.util.*;\n\npublic class ImageCache {\n    private static\
    \ Map<String,String> cacheMap = new HashMap<String,String>();\n\n    private ImageCache()\
    \ {}\n\n    public static void put(String key, String image) {\n        cacheMap.put(key,\
    \ image);\n    }\n\n    public static String get(String key) {\n        return\
    \ cacheMap.get(key);\n    }\n}\n```\n\n## 2. Create a Test class : TestCache.java\
    \ in package com.flyweight.principle;\n\n```java\nimport java.awt.Border;\nimport\
    \ javax.swing.JFrame;\n\npublic class TestCache {\n    public static void main(String[]\
    \ args) {\n        ImageCache.put(\"redBulletImage\", \"images/red_bullet.png\"\
    );\n        ImageCache.put(\"enemyPlaneImage\", \"images/enemy_plane.png\");\n\
    \        ImageCache.put(\"bluePlaneImage\", \"images/blue_plane.png\");\n\n  \
    \      System.out.println(ImageCache.get(\"redBulletImage\"));\n        System.out.println(ImageCache.get(\"\
    enemyPlaneImage\"));\n        System.out.println(ImageCache.get(\"bluePlaneImage\"\
    ));\n    }\n}\n```\n\n**Result:**\n```\nimages/red_bullet.png\nimages/enemy_plane.png\n\
    images/blue_plane.png\n```\n\n## Flyweight Pattern Game\n\n- 1. ImageCache preload\
    \ BluePlane and RedBullet image in Canvas.\n2. Create BluePlane and RedBullet.\n\
    3. BluePlane load RedBullet.\n4. Press the up, down, left, right key to move the\
    \ BluePlane.\n5. Press the enter key to move RedBullet and then RedBullet move\
    \ from the top of the plane.\n\n```java\nstatic {\n    ImageCache.put(\"redBullet\"\
    , ImageUtil.loadImage(\"images/red_bullet.png\"));\n    ImageCache.put(\"bluePlane\"\
    , ImageUtil.loadImage(\"images/blue_plane.png\"));\n}\n```\n\n```java\npublic\
    \ void keyPressed(KeyEvent e) {\n    int keyCode = e.getKeyCode();\n    if(keyCode\
    \ == KeyEvent.VK_UP) {\n        bluePlane.move(0,-6);\n    } else if(keyCode ==\
    \ KeyEvent.VK_DOWN) {\n        bluePlane.move(0,6);\n    } else if(keyCode ==\
    \ KeyEvent.VK_RIGHT) {\n        bluePlane.move(6,0);\n    } else if(keyCode ==\
    \ KeyEvent.VK_LEFT) {\n        bluePlane.move(-6,0);\n    } else if(keyCode ==\
    \ KeyEvent.VK_ENTER) {\n        bluePlane.fireBullet();\n    }\n}\n```\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_33_0.png)\n\
    \n```java\npublic void fireBullet() {\n    if(!bullet.isVisible()) {\n       \
    \ int x = this.x+this.bullet.width/2-bullet.getWidth()/2;\n        int y = this.y-bullet.getHeight();\n\
    \        bullet.setX(x);\n        bullet.setY(y);\n        bullet.setVisible(true);\n\
    \    }\n}\n```\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_34_0.png)\n\n## Sprite:\n\
    \n- 1. **boolean visible**: If sprite visible=true draw and move on the canvas,\
    \ otherwise disappear.\n\n**Sprite.java in package com.flyweight.game;**\n\n```java\n\
    import java.awt.Graphics;\nimport java.awt.image.BufferedImage;\n\nabstract class\
    \ Sprite {\n    protected int x; // x coordinate of Canvas\n    protected int\
    \ y; // y coordinate of Canvas\n    protected int width;\n    protected int height;\n\
    \    protected BufferedImage image;\n    protected boolean visible;\n\n    public\
    \ Sprite(int x, int y, BufferedImage image) {\n        this.x = x;\n        this.y\
    \ = y;\n        this.image = image;\n        this.width = this.image.getWidth();\n\
    \        this.height = this.image.getHeight();\n    }\n\n    public void draw(Graphics\
    \ g) {\n        if (this.isVisible()){\n            g.drawImage(image, this.x,\
    \ this.y, null);\n        }\n    }\n\n    public void move(int distanceX, int\
    \ distanceY) {\n        this.x = this.x + distanceX;\n        this.y = this.y\
    \ + distanceY;\n    }\n\n    public int getWidth() {\n        return width;\n\
    \    }\n\n    public int getHeight() {\n        return height;\n    }\n\n    public\
    \ int getX() {\n        return x;\n    }\n\n    public void setX(int x) {\n  \
    \      this.x = x;\n    }\n\n    public int getY() {\n        return y;\n    }\n\
    \n    public void setY(int y) {\n        this.y = y;\n    }\n\n    public boolean\
    \ isVisible() {\n        return visible;\n    }\n\n    public void setVisible(boolean\
    \ visible) {\n        this.visible = visible;\n    }\n\n    public BufferedImage\
    \ getImage() {\n        return image;\n    }\n}\n```\n\n## ImageCache:\n\n- 1.\
    \ `static Map<String,BufferedImage> cacheMap`: Store image as key-value pairs\n\
    2. `static void put(String key, BufferedImage image)`: store image\n3. `static\
    \ BufferedImage get(String key)`: get image by key\n\n**ImageCache.java in package\
    \ com.flyweight.game;**\n\n```java\nimport java.awt.image.BufferedImage;\nimport\
    \ java.util.*;\n\npublic class ImageCache {\n    private static Map<String,BufferedImage>\
    \ cacheMap = new HashMap<String,BufferedImage>();\n\n    private ImageCache()\
    \ {}\n\n    public static void put(String key, BufferedImage image) {\n      \
    \  cacheMap.put(key, image);\n    }\n\n    public static BufferedImage get(String\
    \ key) {\n        return cacheMap.get(key);\n    }\n}\n```\n\n**RedBullet.java\
    \ in package com.flyweight.game;**\n\n```java\nimport java.awt.Graphics;\nimport\
    \ java.awt.image.BufferedImage;\n\npublic class RedBullet extends Sprite {\n \
    \   public RedBullet(int x, int y) {\n        super(x, y, ImageCache.get(\"redBulletImage\"\
    ));\n    }\n\n    public void move(int distanceX, int distanceY) {\n        this.x\
    \ = this.x + distanceX;\n        this.y = this.y + distanceY;\n        if (this.y\
    \ + this.height <= 0) {\n            this.setVisible(false);\n        }\n    }\n\
    }\n```\n\n**ImageUtil.java in package com.singleton.game;**\n\n**BluePlane.java\
    \ in package com.flyweight.game;**\n\n```java\nimport java.awt.*;\nimport java.awt.image.BufferedImage;\n\
    \npublic class BluePlane extends Sprite {\n    protected RedBullet bullet;\n\n\
    \    public BluePlane(int x, int y) {\n        super(x, y, ImageCache.get(\"bluePlaneImage\"\
    ));\n    }\n\n    public void loadBullet(RedBullet bullet) {\n        this.bullet\
    \ = bullet;\n    }\n\n    public void fireBullet() {\n        // Implementation\
    \ for firing bullet\n    }\n\n    public RedBullet getBullet() {\n        return\
    \ bullet;\n    }\n}\n```\n\n**Canvas.java in package com.flyweight.game;**\n\n\
    ```java\nimport java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.JPanel;\n\
    \npublic class Canvas extends JPanel implements Runnable {\n    private boolean\
    \ isRun = true;\n    private BluePlane bluePlane;\n    private int canvasWidth;\n\
    \    private int canvasHeight;\n\n    static {\n        ImageCache.put(\"redBullet\"\
    , ImageUtil.loadImage(\"images/red_bullet.png\"));\n        ImageCache.put(\"\
    bluePlane\", ImageUtil.loadImage(\"images/blue_plane.png\"));\n    }\n\n    public\
    \ Canvas() {\n        this.setLayout(null);\n        this.setBackground(Color.WHITE);\n\
    \n        bluePlane = new BluePlane(120, 250);\n        bluePlane.loadBullet(new\
    \ RedBullet(-100,-100));\n        bluePlane.setVisible(true);\n\n        new Thread(this).start();\n\
    \        this.addKeyListener(new KeyAdapter() {\n            public void keyPressed(KeyEvent\
    \ e) {\n                int keyCode = e.getKeyCode();\n                if (keyCode\
    \ == KeyEvent.VK_UP) {\n                    bluePlane.move(0,-6);\n          \
    \      } else if (keyCode == KeyEvent.VK_DOWN) {\n                    bluePlane.move(0,6);\n\
    \                } else if (keyCode == KeyEvent.VK_RIGHT) {\n                \
    \    bluePlane.move(6,0);\n                } else if (keyCode == KeyEvent.VK_LEFT)\
    \ {\n                    bluePlane.move(-6,0);\n                } else if (keyCode\
    \ == KeyEvent.VK_ENTER) {\n                    bluePlane.fireBullet();\n     \
    \           }\n            }\n        });\n    }\n\n    @Override\n    protected\
    \ void paintComponent(Graphics g) {\n        this.canvasWidth = this.getWidth();\n\
    \        this.canvasHeight = this.getHeight();\n        super.paintComponent(g);\n\
    \        bluePlane.draw(g);\n        bluePlane.getBullet().draw(g);\n    }\n\n\
    \    @Override\n    public void run() {\n        while (isRun) {\n           \
    \ try {\n                // Game loop logic here\n                Thread.sleep(50);\n\
    \                Canvas.this.repaint();\n            } catch (InterruptedException\
    \ e) {\n                e.printStackTrace();\n            }\n        }\n    }\n\
    }\n```\n"
  mdcn: "\n\n## 享用模式原理\n\n享用模式：一种用于高效共享的细粒度实例。通过使用共享来高效地支持大量的细粒度对象。享用对象是一个共享对象，可以同时在多个上下文中使用。享用对象在每个上下文中都作为一个独立对象存在——它与未共享的对象实例没有二致。\n\
    \n- 1. ImageCache 存储游戏图像，如（飞机、敌机、子弹）。\n\n| ImageCache |\n| :--- |\n| Map<String,String>\
    \ cacheMap |\n| ImageCache() |\n| static void put(String key, String image) |\n\
    | static String get(String key) |\n\n**ImageCache:**\n\n1. `Map<String,String>\
    \ cacheMap`: 以键值对形式存储数据\n2. `static void put(String key, String image)`: 存储数据\n\
    3. `static String get(String key)`: 通过键获取值\n\n**包 com.flyweight.principle 下的 ImageCache.java**\n\
    \n```java\nimport java.util.*;\n\npublic class ImageCache {\n    private static\
    \ Map<String,String> cacheMap = new HashMap<String,String>();\n\n    private ImageCache()\
    \ {}\n\n    public static void put(String key, String image) {\n        cacheMap.put(key,\
    \ image);\n    }\n\n    public static String get(String key) {\n        return\
    \ cacheMap.get(key);\n    }\n}\n```\n\n## 2. 在包 com.flyweight.principle 下创建一个测试类：TestCache.java\n\
    \n```java\nimport java.awt.Border;\nimport javax.swing.JFrame;\n\npublic class\
    \ TestCache {\n    public static void main(String[] args) {\n        ImageCache.put(\"\
    redBulletImage\", \"images/red_bullet.png\");\n        ImageCache.put(\"enemyPlaneImage\"\
    , \"images/enemy_plane.png\");\n        ImageCache.put(\"bluePlaneImage\", \"\
    images/blue_plane.png\");\n\n        System.out.println(ImageCache.get(\"redBulletImage\"\
    ));\n        System.out.println(ImageCache.get(\"enemyPlaneImage\"));\n      \
    \  System.out.println(ImageCache.get(\"bluePlaneImage\"));\n    }\n}\n```\n\n\
    **结果：**\n```\nimages/red_bullet.png\nimages/enemy_plane.png\nimages/blue_plane.png\n\
    ```\n\n## 享用模式游戏\n\n- 1. ImageCache 在 Canvas 中预加载蓝色飞机（BluePlane）和红色子弹（RedBullet）图像。\n\
    2. 创建蓝色飞机和红色子弹。\n3. 蓝色飞机装载红色子弹。\n4. 按上、下、左、右方向键移动蓝色飞机。\n5. 按回车键移动红色子弹，然后红色子弹从飞机的上方移动。\n\
    \n```java\nstatic {\n    ImageCache.put(\"redBullet\", ImageUtil.loadImage(\"\
    images/red_bullet.png\"));\n    ImageCache.put(\"bluePlane\", ImageUtil.loadImage(\"\
    images/blue_plane.png\"));\n}\n```\n\n```java\npublic void keyPressed(KeyEvent\
    \ e) {\n    int keyCode = e.getKeyCode();\n    if(keyCode == KeyEvent.VK_UP) {\n\
    \        bluePlane.move(0,-6);\n    } else if(keyCode == KeyEvent.VK_DOWN) {\n\
    \        bluePlane.move(0,6);\n    } else if(keyCode == KeyEvent.VK_RIGHT) {\n\
    \        bluePlane.move(6,0);\n    } else if(keyCode == KeyEvent.VK_LEFT) {\n\
    \        bluePlane.move(-6,0);\n    } else if(keyCode == KeyEvent.VK_ENTER) {\n\
    \        bluePlane.fireBullet();\n    }\n}\n```\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_33_0.png)\n\
    \n```java\npublic void fireBullet() {\n    if(!bullet.isVisible()) {\n       \
    \ int x = this.x+this.bullet.width/2-bullet.getWidth()/2;\n        int y = this.y-bullet.getHeight();\n\
    \        bullet.setX(x);\n        bullet.setY(y);\n        bullet.setVisible(true);\n\
    \    }\n}\n```\n\n![](img/1a3fab3d51f12ead42a519c23c1a64ba_34_0.png)\n\n## Sprite（精灵类）：\n\
    \n- 1. **boolean visible**: 如果精灵可见=true，则在画布上绘制并移动，否则消失。\n\n**包 com.flyweight.game\
    \ 下的 Sprite.java**\n\n```java\nimport java.awt.Graphics;\nimport java.awt.image.BufferedImage;\n\
    \nabstract class Sprite {\n    protected int x; // Canvas 的 x 坐标\n    protected\
    \ int y; // Canvas 的 y 坐标\n    protected int width;\n    protected int height;\n\
    \    protected BufferedImage image;\n    protected boolean visible;\n\n    public\
    \ Sprite(int x, int y, BufferedImage image) {\n        this.x = x;\n        this.y\
    \ = y;\n        this.image = image;\n    }\n\n    public void draw(Graphics g)\
