  md: '# # Introduction


    # ## Ten Theses on Climate Change


    London, Palace of Whitehall, February 1662. King Charles II of England has summoned
    his closest advisors. A man comes before him, bows, and swears allegiance. He
    carries an enormous weight on his shoulders: his whole world is at stake in this
    royal audience. John Winthrop is governor of the colony of Connecticut: the title
    is impressive, but who does he speak for? Several thousand men, women, and children.
    A people without rights, for, in the absence of a royal charter, they have no
    legal existence. Winthrop has come in search of such recognition.


    For his part, the king has plans for America. He wants to get to it better and
    administer the lands on the edge of his kingdom more efficiently. Robert Boyle
    backs him in this task. He is one of the great scientists of his time: the father
    of experimental physics. He wants to enlist the new sciences in the service of
    England and Empire. He is present at the scene in 1662.


    Charles II listens to Winthrop and then questions him in turn: he inquires about
    the prevailing temperature in the colonies. As recounted by Boyle, Winthrop seizes
    the opportunity and announces that it has changed; that the cold has receded with
    colonization. Before his king, he makes three inseparable claims: that England
    is sovereign over these lands; that the colonists, who are virtuous and persevering,
    have set nature to work; and'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'that divine Providence has hallowed the imperial enterprise. Here, climate
    change is a form of optimism.


    Connecticut would have its charter. Winthrop became a member of the Royal Society
    – the holy of holies of modern science whose architect was Boyle. It witnessed
    debates over the New World, the nature of matter, the globe, the animal world,
    empire, profit and reason. But anxiety was already casting a shadow over hopes
    of conquest. From Barbados, a traveller warned the scientists in London: if we
    cut down trees, colonization, rather than making the climate milder, dry it to
    the point of desertification. England was not similarly threatened. Holistic thinking
    made such concerns meaningful. In the great providential water cycle, trees interceded
    between clouds, rivers, and oceans: their loss might betoken a hopelessly dry
    sea. Conqu Earth by losing the key: the transformation of nature acquired an aftertaste
    of anxiety.


    This book''s first thesis possesses a kind of self-evidence: European societies
    did not experience centuries of dramatic fluctuations in climate, or live through
    the Little Ice Age,¹ without caring about the development of the climate. On the
    contrary, a shadow of the modern age to the twentieth century, a ghost of scientists,
    statesmen, colonists, historians, agronomists, and engineers debated climate change
    endlessly, both rejoicing at it and being worried by it. While they rarely used
    the word ‘climate’.² they all referred to phenomena that would today be characterized
    as climate: rains that had dried up, winds that had changed, hitherto unknown
    cold or warm weather. They asked themselves: are these changes spontaneous or
    – as they often thought – the effects of human activity?


    For our second thesis: belief in the climate impact of human action has profoundly
    marked European societies over the long term. Our ancestors thought they could
    change the rains, the temperature and the winds. But this had nothing to do with
    contemporary global warming. nor the greenhouse effect. Instead they thought that
    clearing forests, transforming the planet''s soil and plant cover, would alter
    the water cycle and hence the climate.


    Countless historical documents speak to us of this power, its promises and its
    dangers. It is invoked whenever history takes great strides forward: by the first
    conquistadors, by nineteenth-century imperialists, by the French or American revolutionaries
    of the late eighteenth century.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'We have sought to attend to these voices full of hope and anxiety. Not in order
    to seek in them the ‘origin’ of our present-day climate concerns,³ but in order
    to write the history of a ‘reflexivity’ – a way of thinking about our relationship
    to the environment – that profoundly marked European societies for more than four
    centuries.⁴


    This profound imprint is commensurate with what climate represented at the time.
    Its importance was crucial for the agrarian societies of the past. Firstly, the
    threat of a bad season loomed over harvests and human beings’ ability to feed
    themselves. The spectre of famine and riot made the incendiary political issue,
    which destabilized – and sometimes overthrew – political regimes. Secondly, because
    the climate was not merely a matter of grain, but was long regarded as the fundamental
    matrix of nature, as moulded all living beings, humans included, determining their
    form, health and characters.⁵ Acting on the climate, therefore, held out the dizzying
    prospect of creating new types of human being.


    Above all, this action took the form of altering forest cover. Forests obviously
    played a key role in past societies. Wood was the primary source of energy and
    an irreplaceable material for shipping, transport, building, tools, and many other
    things besides. Forests represented immense capital, as well as being habitats
    and means of subsistence; they occupied a central place in imaginaries and sensibilities.
    Trees imbued climate change with an enormous political change.


    The book’s third thesis is that anthropogenic climate change was, over the long
    term, an intellectual and practical framework in the service of European imperial
    expansion. With the ‘discovery’ of America, the idea took root that colonization
    was also a climatic normalization, a way of improving the continent’s climate
    by clearing and cultivating land. It was a promise to the colonists and a discourse
    of domination: a way of saying that native peoples had never owned the New World.
    In the eighteenth century, acting on the climate to rank societies and their historical
    trajectories hierarchically: Amerindian peoples still in the infancy of a savage
    climate; European peoples creating the mild climate of their continent; Oriental
    peoples destroying theirs. The Maghreb, India and, later, Black Africa: in the
    nineteenth and twentieth centuries, the French and British empires were built
    on accusing Blacks and Arabs, Islam, nomadism,'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'and the ‘primitive’ mentality of wrecking the climate⁶ Colonization was conceived
    and presented as an attempt to restore Nature. The white man must mend the rains,
    make the seasons milder, push back the desert – and to that end command the natives.
    Discarded in the late nineteenth century the thesis of anthropogenic climate change
    held sway for longer in those empires where, four centuries earlier, had taken
    root.


    Our fourth thesis is that science long ago seized the issue of climate changes.
    From the time of Boyle and Winthrop, meteorological instruments began to be used
    to track potential anthropogenic climate change. The physiology of plants was
    invented with the issue of disruptions to the water cycle. The study of climate
    change was systematized at the end of the eighteenth century: scientists analysed
    the old meteorological records, consulted historical sources, studied the evolution
    of rivers, vegetation and glaciers. In short, they laid the foundations of contemporary
    climatology. these bodies of knowledge became full-fledged political weapons.
    The authorities deployed to reassure people pray to the torments of cold and hunger:
    the bad season was only temporary and local shortages would disappear by themselves
    if the market was aided by. The political order could be guaranteed because nature
    was fundamentally stable. At the same time, the science of the climatic played
    a key role in intense struggles over forests, property, and the regulation of
    nature. In France, climatology was invoked in Parliament and the press; the state
    mobilized its whole apparatus to understand the climatic trajectory of its territory.
    Meteorology, botany, agronomy, geology, medicine, physics, history, Oriental studies:
    this unearths a whole hidden side of the history of knowledge, dealing with shifts
    in climate and human responsibility for the changes in it.


    Changes, but on what scale? The contemporary age – fifth thesis – does not enjoy
    a monopoly on the global. The issue of climate change was broached on a planetary
    and continental scale since the inception of the modern age. In the eighteenth
    century, Buffon, one of the most famous scientists of his time, described an Earth
    growing and piling up ice at the poles. Scientists and travellers did not hesitate
    to link the signs of cooling observed on five continents to the destiny of the
    planet. In the theory of the water cycle, too, the Earth was already conceived
    as a unified whole, a system of material flows connecting soil, ocean, atmosphere
    and vegetation. For its part, experimental science attempted via small-scale'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'experiments to grasp the dynamics of the planet and climate. In the nineteenth
    century, theories of climatic deterioration described the mechanisms which, from
    the mountains to the poles, heralded global disasters. In this period, chemists
    and geologists identified the main self-regulating mechanisms conducive to the
    stability of the atmosphere’s composition. Such visions were not exclusive to
    scientists: when questioned, French Restoration elites spoke of climatic influences
    on a French, European and world scale. The commonplace idea that global change
    and the contemporary sciences of the ‘Earth system’ constitute an ontological
    revolution, a radical transformation in our relationship to the planet, stems
    from neglect of this history.7


    Our sixth thesis has a more historiographical tonality. Recent research remains
    marked by the problem of the origin of ‘environmental awareness’. In a highly
    influential book, the historian Richard Grove identified his point of emergence
    in the climatic anxieties of eighteenth-century colonial administrators.9 Upon
    extending the inquiry over four centuries, however, it turns out that ‘awareness’
    is not the appropriate one: it generates teleological narratives, reaches ever
    further back into the past, and imprisons us in an intellectual genealogy. What
    we document is different: not an origin, but the rise, with old conceptions of
    the climate making optimism and pessimism, of an image of collapse that gained
    the upper hand as a result of the French Revolution. Neither discovery nor invention,
    then, but a process of politicization and dramatization in a specific space and
    time: the France of 1789 and the troubled decades of the nineteenth century. This
    image of climate collapse would subsequently circulate on a world scale throughout
    Europe, America, and the empires.


    As we see, France occupies a very special place in the global and long-term history
    of climate change. This is our seventh thesis. In no other national context do
    we find so many debates, anxieties and reflections prompted by a possible deterioration
    in climates caused by man. Elsewhere, the effects of climate action were far from
    being dreaded – when indeed they were not regarded as a blessing. This is not
    to invoke a cultural peculiarity or a discovery attributable to French science.
    France’s uniqueness emerged from neither the literary sphere nor the scientist’s
    study. It was the result of merciless struggles between factions of the Revolution,
    the Restoration, moderate monarchy, and economic liberalism.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'In this book, climatic deterioration does not – or, at least, does not only
    – appear in scholarly discourse or inspired prose, but through the voices of mayors,
    property-owners, deputies, engineers, pharmacists, doctors and journalists, administrators
    and foresters. It is not an intellectual game; it is a country crippled by anxiety.


    Eighth thesis: the idea of climate collapse became a tool for controlling ordinary
    people''s uses of nature. It formed the centerpiece of a discourse on the natural
    order that served to discipline these uses using the end of feudalism. The peasants
    of Year II accused: in not respecting private property, they had destroyed the
    forests and hence the climate. They had to learn not to misunderstand the true
    meaning of the French Revolution. It is no accident that the idea of climate collapse
    and Malthus''s theory was contemporaneous. In both cases nature was enlisted into
    a project for governing the masses – their fertility in England, and their appetite
    for land and wood across the Channel. Thus, anthropogenic degradation was soon
    branded by a forestry technology endowed with immense power in the nineteenth
    century. It was the strong arm of the state in the countryside, regulating access
    to a vital resource. In France, rural populations were singled out for their archaic
    practices, destructive of forests and hence of the climate. In Algeria and Maghreb,
    foresters were to the fore in accusing the ‘Arabe’ of being ‘ennemi de l’arbre’.
    In the name of climate and forest conservation, they waged a crusade for ‘modernizing’
    the uses of nature that targeted the ways of life and, sometimes, the very existence
    of communities.


    Debates on the climatic threat are also ninth intimately bound up with the expansion
    of liberal capitalism in nineteenth-century France. The problem of climate change,
    as we have seen, constantly interfered with forestry policy. By the same token
    it became bound up with basic political and economic questions. When was the enormous
    capital represented by forests to be managed? Should it be increased and put to
    profitable use to boost the public finances, to serve as security for loans, or
    to stimulate trade? And how to do this without compromising the climate, and this
    country’s prosperity and political stability? Zealots for the market and absolute
    property rights fought to free ownership from any restrictions. But if trees regulate
    the climate, should not the state regulate, prohibit, constrain; protect and conserve
    the vast forests under its control? These questions gave rise to intense struggles
    in parliamentary'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'arenas, the media, and the corridors of ministries. At stake was the compatibility
    between market society and the integrity of ecological balances: could the management
    of nature be left to the goodwill of property-owners? Did not the fundamental
    arbitration between forest and cultivation, and hence between energy and grain,
    belong to the nation as a whole? The issue of temporality was also central: for
    the pro-regulation camp, only the state was capable of long-term thinking and
    hence of conserving. Supporters of an outright return to monarchy were similarly
    obsessed. But they believed it was the vocation of the king, the nobles and the
    clergy to as guarantors of nature’s longevity. At the very moment when modern
    institutions of political representation were being invented, they were the site
    of debates about natural cycles and the need to consider all the possible long-term
    repercussions of our actions on climate and the environment.


    Our tenth and last thesis is that, from the late nineteenth century onwards, European
    wealthy societies gradually became oblivious to the threat of anthropogenic climate
    change. First, because they grew much more resilient in the face of the vagaries
    of the heavens. Thanks to railways and agricultural globalization, foodstuffs
    circulated, breaking the secular cycle of poor harvest, scarcity, and social disturbance.
    At the same time the forest lost its centrality in the major debates over property,
    the role of the state, and the overall balance of the economy. Consequently, changes
    in climate lost their charge of anxiety, their political intensity. Scientific
    theorizing about climate action gradually tapered off. Human history and climate
    had been considered in tandem since the modern age; but the second was no more
    than the oftentimes variable setting in which the first was played out. This mutation
    occurred later in the empires, where the thesis of climate action fed into relations
    of domination for a few decades more. This resilience, this veritable sky, lasted
    for a brief period of time — scarcely few few — during which the climate could
    seem irrelevant to human life. At the end of our inquiry we have discovered not
    the ‘origin’ of ecological ‘awareness’, but the opposite: the industrial and scientific
    engineering of a form of apathy in the face of anthropogenic climate change; the
    genesis of societies that liked to think they had finally averted this threat.'
