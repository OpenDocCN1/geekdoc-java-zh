    # Precursors of Their Time


    This book has described the political, theological, imperial, and scientific contexts
    within which climate change has been perceived, thought, anticipated, feared,
    and endured, but also celebrated, since the sixteenth century. And yet a different
    narrative is possible, one detaching from the maelstrom of nineteenth-century
    theories – about heat, the physics of the globe, ice ages, or gas spectrometry
    – the scientific advances that have led to the contemporary diagnosis of global
    warming. This history is infinitely clearer and shorter, but also more reassuring.
    The relevant knowledge has been validated by contemporary physics; doubt has been
    banished from it, along with politics, conquests, forests, bad harvests, the people,
    hunger, and revolts.


