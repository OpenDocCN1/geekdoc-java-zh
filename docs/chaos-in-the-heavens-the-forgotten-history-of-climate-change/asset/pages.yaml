    The Climate of Revolution


    The French Revolution was also a climate revolution. During the revolutionary
    events, and as a result of them, climate warnings were issued by naturalist circles
    and became a political issue, dealt with in arenas of power, the National Assembly
    and ministerial offices. Scientists who occupied the summits of power, deputies,
    landowners, prestigious agronomists, and ministers were convinced of the reality
    of the threat.


    How do we explain the fact that climate change was at the heart of political concerns?
    Circumstances certainly played a role: the terrible weather of 1788 and 1794 caused
    grain shortages and food riots. The increase in the price of wood and the needs
    of a war economy reinforced fears of a depletion of French forests. But this experience
    of natural limits, typical for a natural economy, was shared by many other regions
    in Western Europe. It is not enough to justify the particularities of the French
    climate debate.


    Three major revolutionary challenges account for the precocious, radical politicization
    of the climate in France. First: how was a soil and a nation degraded by feudalism
    to be regenerated? And – what would the Revolution’s consequence be for the nature
    of France? Second: what was to be done with the immense forestry domain inherited
    from Church property? How should this gigantic capital be used to strengthen the
    state’s credit, stabilize the *assignat* and finance'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'wars? Finally, and especially: how were the revolutionary rural masses to be
    governed? How to inculcate respect for forests, but also for property and order,
    in a population of peasants who had become citizens?


    # ‘Repairing the Climate''


    ‘Is there a way of repairing a country, a climate?''1 This question raised in
    1790 illustrates the way that revolutionary discourse seized on the climate: at
    once as a means of regeneration and reparation following damage, as an indictment
    of the past. The originality of the French climate debate resides in its link
    with political confrontation. From 1789 to the 1820s, every regime claimed to
    clear up the climatic mess created by the negligence of its predecessors. At the
    start of the Revolution, climatic discourse served to denounce the environmental
    effects of despotism and feudalism. According to the Jacobi deputy Jacques-Michel
    Coupé, climatic imbalance was attributable to ‘the prolonged negligence [that]
    reigned over French territory. . . There is a great deal to repair on its surface.''2


