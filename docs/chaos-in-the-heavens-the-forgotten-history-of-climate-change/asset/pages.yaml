    Should the National Forests Be Sold?


    If it was in France, under the Restoration, that the issue of climate change became
    an affair of state, this was because the effects of Waterloo and Tambora, the
    price of defeat and the food shortages of 1816, all intersected there. In the
    chilly years following the fall of the Empire, Restoration governments proposed
    to sell the national forests in order to bolster the state’s credit and meet the
    victors’ financial demands. The climate issue became entangled with fundamental
    objectives: to pay war reparations as quickly as possible in order to secure the
    departure of the occupying troops; to reassure annuity holders and thus rally
    them to the new regime; mollify foreign powers and, implicitly, to ensure their
    support for the Bourbons in the event of new revolutionary disorders.


