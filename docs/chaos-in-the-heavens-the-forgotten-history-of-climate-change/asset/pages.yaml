    Improving the World?


    What was to be done with America? In the seventeenth century this was a formidable
    challenge, posed in this instance to the political, scientific and economic elites
    of France and England. How were its soil, resources and environments to be exploited?
    Which subjects and workers should these distant lands be populated with? And how
    was sovereignty over immense, largely unknown territories to be displayed? America
    seemed itself as a continent predating civilization, a past from which to set
    out to map a new path. But which one?


    There were plenty of answers. People sought signs. They sought to read into the
    development of the climate a sanctification of empire. They dreamt of improving
    Creation by clearing and cultivating the land, by civilizing nature in the New
    World. Thinking about climate would be all of these once: justifying conquest,
    claiming to restore Adam’s empire, posing as the sculptor of nature to be fashioned
    by reason, force, and the quest for profit. But a shadow of anxiety soon hung
    over this will to power.


