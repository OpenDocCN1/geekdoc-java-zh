    food shortages, unrest, and violence was broken. I winters, dry springs and rotten
    summers were no longer synonymous with market chaos, panic and wait.


    The French diet improved spectacularly. The basic staples, consisting of cereals,
    became more abundant (+40 per cent for wheat between1852 and 1881).³⁹ At the same
    time, meats diversified: over potatoes (+40 per cent), more meat (ditto), butter
    and eggs. Some products became more widespread: sugar, coffee, pasta, olive oil.
    Obviously, these developments differed between town and countryside, depending
    on regions and social classes. Still, they were widespread and in the second half
    of the century.


    Food improved in quantity and quality, but also in terms of security of access.
    Historians date the last significant crises of subsistence in France to the middle
    of the century. In 1845-47 a mediocre harvest, followed by a rainy summer and
    then a dry spring, led to serious supply problems and social unrest throughout
    the country.⁴⁰ In 1853-57, the north of France suffered a deficit of cereal production
    that forced the state to assume supervision of the Paris market.⁴¹ These convulsions
    were the last. Naturally, neither high prices, nor poverty, nor economic slumps
