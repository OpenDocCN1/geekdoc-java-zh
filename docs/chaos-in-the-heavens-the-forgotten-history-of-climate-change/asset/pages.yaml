    # Forests, Debt and Climate


    When, in the spring of 1814, Louis XVIII returned from exile, the kingdom’s financial
    situation was fragile. Baron Louis, the finance minister, assessed the debt at
    759 million francs. That is why the new government’s first finance law, voted
    on 23 September 1814, provided for the sale of 300,000 hectares of natural forests
    (out of the 1.2 million owned by the state). These sales did not affect woods
    belonging to nobles who emigrated after the Revolution, which were in the process
    of being returned to their owners. In the main, involved woods of ecclesiastical
    origin (dissolved orders, abbeys, chapters), or that belonged to foreign nobles
    prior to the Revolution. The yield of this property sale was to serve as security
    for a loan. Alienation was ‘the security required for confidence’.²


    Opposition to the law came chiefly from ultra-royalists, who were surprised and
    disappointed to see the monarchy borrowing Bonaparte’s debts. Were the ecclesiastical
    woods usurped by the Revolution really going to be used to reimburse suppliers
