    # The New Climate Sciences


    Scientific approaches to the atmosphere underwent an overhaul after 1850. State
    meteorological bodies were created in most Western countries: Austria-Hungary
    (1851), Holland (1854), England (1854), Sweden (1859), Spain (1860), Italy (1863)
    United States (1870), France (1878). This wave of institutionalization often answered
    to the need to organize an operational weather forecasting service.^25 But these
    bodies also maintained climatological divisions, and observation networks often
    organized in tandem with the army, navy, and scientific establishments, technical
    administrations, and agricultural stations. The data generated was analysed and
    put into maps in order to characterize climatic regions and climate types.^26
    The climatology that emerged in the second half of the nineteenth century had
    no monopoly on climate discourse – it was equally a matter for geographers, naturalists
    or foresters, each with their own methods and research agendas. But its institutional
    power and epistemic legitimacy made it a major protagonist from the 1860s and
    70s.


