    # The Climate of History


    For the people living through it, the eighteenth century was an anthropocene:
    for them, the temporalities of the Earth and of society one and the same. Human
    climate action was a modality of this intersection, an index of this temporal
    concordance.


    The naturalist Buffon, one of the most famous scientists of the age, was the herald
    of a history of the Earth that cast humanity as a planetary force. His vision
    also projected a gauge of moulding climates: peoples could be hierarchically ranked,
    he suggested, according to their active impact on the climate, deliberate or involuntary,
    beneficial or deleterious. Thus, a new divide between ‘them’ and ‘us’ emerged
    at the dawn of climate change.


    Buffon''s voice was not an isolated one. Throughout eighteenth-century Europe,
    historiography was inseparably bound with climate theories, some of which were
    organized around an anthropogenic change in climates. In this way, people sought
    to explain the ebb and flow of artistic greatness; to shed light on the origin
    and history of European nations and monarchies. And, at a time when the history
    of ‘peoples’ (Romans, Celts, Germans, etc.) was beginning to be written, the air
    was full of questions about the interconnected trajectories of populations and
    climates, which mutually and continuously shaped one another.'
