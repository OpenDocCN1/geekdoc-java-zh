    loans, land taxes, indirect royalties, or customs tariffs) existed and were applied.
    By dint of its solemn, character, the sale of the national forests had the advantage
    of reassuring capitalists and the buyers of national assets. It was a ‘security’,
    a ‘mortgage’, a ‘shield’ to protect rentiers from the woes of the public treasury.
    A political pact was sealed over the fate of the national forests, linking the
