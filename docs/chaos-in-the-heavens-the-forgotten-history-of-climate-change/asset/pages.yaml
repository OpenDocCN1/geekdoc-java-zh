  md: '# 1 Christopher Columbus’s True Discovery


    By 1492, it was nearly a century since the Spanish and Portuguese had embarked
    on their enterprise of conquest in the Atlantic. From the pens of its first chroniclers,
    the ‘discovery of America’ appears not as the dawn of a new age, but as an additional
    stage in a process of expansion initiated by the conquest of the Canaries, Madeira,
    and Porto Santo. These islands off the coast of Africa have their rightful place
    in the history of the New World: more than a prelude, they were the laboratory
    for colonization of the Caribbean, the model for a colonization based on sugar,
    deforestation, forced labor of the indigenous population, and the importation
    of African slaves.^1


    Reflections on climate change emerged as colonization of the Canaries and Madeira
    was nearing completion and that of the Caribbean was beginning; when, on contact
    with a ‘new world’, explorers cast a retrospective glance at what had already
    been accomplished by their predecessors further east. They interpreted colonization
    as a profound transformation of Creation, completely altering the climates of
    the islands they seized, making them dryer and more temperate. This project of
    climate improvement was advanced by the original conquistadors and, in the first
    instance, by the most illustrious of them all: Christopher Columbus.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# ''The Trees Produce Clouds and Rain''


    July 1494: Columbus’s expedition is navigating the coast of Jamaica under a clear
    blue sky. Suddenly, it clouds over and torrents fall on the ships. The expedition
    is in danger: water gets into the holds, corrupts the provisions, and the stifling
    heat makes it impossible to conserve food. On several occasions, the fleet had
    to restock from local tribes. In this critical situation, according to his Ferdinand,
    Christopher Columbus made the following observation: ‘The sky, the disposition
    of the air and the weather in these places are the same as the environs’ – that
    is, ‘every day, at the hour of Vespers, a cloud appears with rain lasting an hour,
    sometimes more, sometimes less.’ The cause of this strange phenomenon, according
    to him, lay in ‘the country’s big trees’. The hypothesis of a link between forest
    cover and precipitation was presented as personal. *per experienza*, Columbus
    knew ‘from experience’ Ferdinand tells us, that things had once been the same
    in the Canaries, in Madeira and in the Azores’. But ever since the trees ‘which
    encompassed [ingombravano]* had been cut down, the same quantity of clouds and
    rain was no longer generated.’² The testimony is indirect but may be taken seriously.
    Ferdinand Columbus was a great man of letters, founder of the Columbine library
    of Seville. He was also the first biographer of his father, whom he accompanied
    on his fourth and last voyage. He claimed to have been a direct witness of the
    phenomenon, extraordinary in time, of tropical rains, daily deluges as regular
    as clockwork.³ Above all, Christopher Columbus’s reasoning made profound sense:
    it was a question of reassuring his patrons Ferdinand and Isabella about the habitability
    of lands situated in the ‘toxic zone’ – supposedly empty of human beings – of
    ancient geography.


    In 1492, cosmology had only been taught in universities for a few decades. Ptolemy’s
    *Geography* had just been rediscovered, as had the classical works of Strabo and
    Sacobroscos. These authors popularized two notions: ‘climate’ and ‘zone’. The
    first pertains to fixism: here climate is a purely geodesic notion, without meteorological
    content, a simple space of land between two parallels.


    The notion of zone is even more problematic: while predominantly defined by latitude,
    it nevertheless connects to the physical features of the place. Zones are characterized
    by their degree of habitability, which depends on'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'the prevailing heat, cold and humidity there. In the ancient cosmology adopted
    by Arab scholars and doctors, and then by humanists, three of the five zones were
    deemed uninhabitable: the Arctic and the Antarctic, on account of the cold, and
    the ‘inflamed’ zone⁴ lying between the tropics of Cancer and Capricorn. This torrid
    zone was not only deemed uninhabitable, but also, by Aristotle’s authority, regarded
    as impassable, separating the two temperate zones to the north and the south.
    In sum, the ecumene – the known world – formed a narrow strip relative to the
    size of the globe, comprising Europe, North Africa and a very shrunken Asia⁵


    The second half of the fifteenth century was marked by a progressive recasting
    of geographical knowledge, which now envisaged an ecumene encompassing the whole
    planet. The stakes were scientific, commercial, and theological: the complete
    opening of the world to Christian maritime technology made it possible to envisage
    humanity’s universal redemption. Even before the New World introduced into European
    cosmology, the torrid zone’s habitability had become a humanist emblem of the
    supersession of antiquity’s stock of knowledge. Columbus was a contemporary of
    this first cosmological revolution. Around 1482, he voyaged as far as São Jorge
    de Mina, a Portuguese fortress on the coast of Guinea, Akan territory, below the
    Tropic of Cancer and in the heart of the torrid zone. After this voyage, in the
    margin of a cosmological treatise, he noted: ‘the torrid zone is not uninhabitable;
    the Portuguese are sailing it today. It is even highly populated. The fort of
    the mine we stands on the line of the equator’.⁶


    Still, despite the Portuguese trading posts in Africa, the habitability of the
    torrid zone remained questionable for late-fifteenth-century intellectuals. For
    example, 1507 Martin Waldsemüller’s famous map of the world indicated in a side
    bar that ‘the torrid zone is not desolate’ but only ‘habitable with difficulty’.
    Columbus therefore needed to demonstrate not only the habitability of the tropics,
    but also their hospitality. And that is why he noted in his diary a whole host
    of observations on the enchanting climate of the places he discovered. The temperature
    in Cuba was described as a ‘May night in Andalusia’: ‘I certify to Your Highnesses
    [Ferdinand and Isabella of Spain] that does not exist under the Sun [a place]
    superior in fertility and the moderation of'
  merge: -1
  pgno: 21
