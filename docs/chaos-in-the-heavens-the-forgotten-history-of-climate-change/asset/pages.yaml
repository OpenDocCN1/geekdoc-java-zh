  md: '# Conclusion


    If global warming came as a shock to most, and remains one, it is because since
    the beginning of the twentieth century, industrial civilization and science have
    instilled in us two convenient, but false, ideas. On the one hand, that human
    action cannot disrupt the climate; on the other, that wealthy societies no longer
    have very much to fear from its fluctuations. Our stupepefaction when faced with
    the existential crisis of global warming largely stems from the reassuring illusions
    of a climate at once unshakable and harmless. Such is the grim epilogue to the
    history retraced in this book.


    At the end of the nineteenth century, Europe’s climatic horizon brightest. The
    triumph of the train and the steam ship made people less vulnerable to the vagaries
    of the sky. The expansion of agricultural production and the globalization of
    supply broke the recurrent linkage between meteorological events, poor harvests,
    panics, food shortages and famine. Richer countries were protected from the whims
    of a sun that always shone somewhere when it came to harvests. Climate changes—
    whether feared or desired lost their political centrality as a result. At the
    same time, forests were no longer a bone of contention hotly disputed by the assemblies
    of the past century. With coal and steel, trees no longer seemed to determine
    the fate of nations, armies, fleets, industry, and the public finances. The causes
    of droughts and floods were certainly considered and debated, but the impact of
    human activity on the climate was ever more seldom blamed for such disasters.


    The debates that raged throughout the nineteenth century on the reality and causes
    of climate changes, on a scale of centuries or decades, had run'
  merge: -1
  pgno: 275
- img_proc: true
  md: 'out of steam. No side had won the battle: no decisive experiment, no irrefutable
    evidence, had demonstrated the stability of climates or their transformation,
    whether caused by man or not. Official climatological science often promoted descriptive
    approaches that repudiated the hypothesis of anthropogenic action or set it to
    one side. The threat had also been overplayed: instrumentalized in political fights
    to cast opprobrium on opponents, abused by administrators and foresters who had
    made it a tool of their power. All the knowledge of the Earth''s history progressed:
    yes, the climate had changed, enormously even, but on the scale of geological
    time. Our planet had been torrid in the distant past and had experienced ice ages.
    Humanity now lived in the marsh of a period tailor-made for telling its epic story:
    the Holocene. Climate developments over thousands of years were discussed, as
    were the shorter cycles that punctuated human history. But the hand of the legislator,
    of the ruler, of the engine no longer trembled the thought of the climatic consequences
    of their actions.


    The idea remained influential for longer in the empires, serving to indict the
    natives and their destructive ways of life. Colonization promised protection and
    reparation: reason, force, planning, and the white man''s strict paternal yoke
    the guarantors of the existence of rain itself. The threat of anthropogenic climate
    change finally disappeared at the same time as the European empires of Africa
    and Asia. The new global imperium – that of US power – had its own obsession:
    the destruction of soils, already experienced on a large scale in the 1930s with
    the Dust Bowl. Many empires had collapsed because they had exploited the land
    to excess: might the same happen to the United States? After 1945 these fears
    were transferred to the Third World, where a desert of agricultural soil was feared.
    This fostered the rise of environmentalism and developmental policies.


    The evanescence of the vision of a fragile climate took nearly a century, from
    the train making its way through the European countryside to the missions of UN
    experts in the arid regions of the Third World. Thus ended four centuries of an
    initially optimistic, then anxious, Anthropocene. For a brief moment, man ceased
    to discern in the mirror of the sky and climate a nature ready to rebel. This
    was an interlude: the loosening of the often oppressive ties which, since the
    dawn of the modern age, had bound European societies and their empires to the
    destinies of a fragile climate.'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'The loosening was twofold: not only were human societies no longer thought
    to act on the climate, but the latter was itself losing its powers of agency.
    In the late nineteenth century, new fields of knowledge emerged that saw life
    in terms of non-climatic causalities. Microbiology, for example, provided doctors
    with precise culprits and invalidated the direct links between environment and
    health. Likewise, with advances in genetics, heredity was severed from environment
    and its mechanisms withdrew to the heart of the cell and later into DNA. The climate
    was no longer the matrix of all life that had transfixed scientists for so long.
    The social sciences underwent similar changes. Sociology, then in its infancy,
    was constructed – especially in France – against naturalistic explanations. In
    economics, the ‘neo-classical’ current, later dominant, focused on the notion
    of utility and on mathematical methods, excluding natural determinants. In short,
    just as Western societies were becoming less vulnerable, new explanatory orders
    short-circuited the climate issue and reinforced the comfortable, fleeting sense
    of detachment sometimes called modernity.


    Our amazement at global warming and our procrastination over the painful measures
    it requires stem in part from this dual heritage. During a brief interlude combining
    technical breakthroughs, scientific uncertainty, ice ages, globalization, microbes
    and social science, the climate was dislodged from our consciousness. We are still
    living in that epilogue, even though we no longer have the luxury of taking the
    climate for granted.'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Afterword


    This book arose from a find and a surprise: nearly 200 years ago, the French government
    launched a major inquiry into climate change and the human responsibility for
    this baleful process. Studying in detail the responses dug up from the archives,
    it gradually emerged that the climate anxiety of which they were actually not
    prophetic, nor even strange for the period.


    The idea of the impact of human action on the climate was very widespread at that
    time among the French elite. It was also heir to a long history going back to
    the European colonization of the American continent. The Revolution and the political
    struggles of the nineteenth century had imparted to it a different, almost apocalyptic
    sense. While it was not a matter of CO2 or the greenhouse effect, it addressed
    problems that were fundamental the same: forest management, disruptions of the
    water cycle, the fate of the mountains, the menace of flooding, the spectre of
    agricultural failure and political rebellion. The 1821 inquiry was a tiny part
    of the vast ensemble of reflections, debates and scholarship on climate that had
    permeated Europe, North America and the colonial empires, from India to the Sahel,
    for five centuries.


    The subject is gigantic, and it has taken many years to get on top of it, accruing
    multiple debts along the way. The first is to the French public service and to
    our institution, the Centre national de la recherche scientifique (CNRS) which,
    despite the serious threats facing both today, made it possible for this book
    to exist. A long-haul undertaking like this one, with its patient effort of documentary
    collection and analysis,'
  merge: -1
  pgno: 278
- img_proc: true
  md: 'needs time. Our permanent status as civil servants and researchers, and the
    autonomy it affords us, have allowed us this time.


    Our gratitude also goes to the people with whom we have had the opportunity to
    exchange views over the years and who have nurtured our thinking. To Dominique
    Pestre, first of all, who trained most of us in the history of the sciences. This
    book bears his unmistakeable imprint – the mark of a type of historiography that
    takes bodies of knowledge, their construction and materiality, seriously; that
    that refuses to resuate them in the political and social contexts of their time.
    Thanks also to Fredrik Albritton Josephson, Monette Berthomer, Christophe Bonneuil,
    Samir Boumediedeme, Deborah Coen, Amy Dahan, Diana K. Davis, Michael and Josette
    Fressoz, Jérôme Gaillardard, Jean-François Gauvin, François Jarrige, Claude and
    Chantal Locher, Sara Miglietti, Sévrine Nickel, Nicole Perrin, Caroline Pichon,
    Grégory Quenet, Marion Rampal and Martin Sarrazac, Simon Schaffer, Archie Shepp,
    Julien Vincent, Jean-Paul Zuniga, and our editor, Patrick Boucher, for their advice,
    criticisms and encouragement. This book owes a great deal to all of them. And
    thanks to the Huntington Library for its grant.


    Our intellectual universe has changed considerably over the last ten years: trained
    as historians of the sciences, we have been protagonists in the emergence of France
    in the field of environmental history. The mounting ecological stakes in our societies,
    and the radical changes these entail for social-scientific investigation, have
    marked our lives as researchers and the pages of this book. Our thanks also go
    to our comrades in the Environmental History research group at the École des hautes
    études en sciences sociales (EHESS), with whom we have shared this experience
    of an emergent intellectual domain, still rich in themes to be explored.


    We made the final corrections to this book during the lockdown of Spring 2020,
    in troubled times, marked by the return of certain figures familiar to the historian
    of past centuries: the epidemic as a reflection of our social and environmental
    anxieties; the forest as a bastion, a chance for salvation; and the fear of collapse,
    again and as ever, a frightening horizon. Nature changes quickly, but our ways
    of thinking about that change draw on a long path made of discord and learning,
    part of whose history is told in this book.'
