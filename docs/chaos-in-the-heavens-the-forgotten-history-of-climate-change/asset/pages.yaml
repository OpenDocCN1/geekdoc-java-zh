    seventh age is an Anthropocene, where human action and natural processes intermingle
    to create a new nature on a planetary scale. Two processes, above all, underpinned
    this view: the domestication, acclimatization and selection of animal species,
    on the one hand, and human transformation of the climate, on the other. Armed
    with evidence of the warming of America and Europe, Buffon became the champion
    of a veritable climate utopia: were they to give up tearing another part, civilized
    nations could rationally transform the Planet. For in planting and feeling trees
    judiciously, man could ‘alter the influences of the climate he inhabits and fix,
    as is, the temperature at the point that suits him.’33 And because, for Buffon,
    terrestrial temperatures were what determined the ever over time of living species,³4
    this engineering led to the birth of a new vegetable and animal world fashioned
    by man.


    Buffon’s language had a moral, optimistic tonality: it was humanity’s duty to
    assist, embellish and fertilize Nature.³35 But this humanity was split. Arrayed
    against the European nations were the ‘savage little nations of America’ and the
    semi-civilized ones of Africa. ‘You can easily judge’, said Buffon, ‘the minimal
