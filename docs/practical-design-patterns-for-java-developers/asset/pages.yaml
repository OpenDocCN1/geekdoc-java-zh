  md: '# 7 Understanding Common Anti-Patterns


    Throughout the previous chapters, we have explored the green working paths of
    imaginary related applications. In this chapter, the abstraction of the vehicle
    will remain a supporting element, because one may imagine a vehicle-inspired application
    more easily than other abstractions. A vehicle, along with all of its parts, is
    an idea that''s easy to grasp.


    Let''s quickly recap the impact of design patterns and how they contribute to
    the success of an organization''s success.


    Melvin E. Conway said that the design and implementation of an application strongly
    reflect an organization''s internal communication. This statement is no less relevant
    today, especially now that many projects use agile approaches. Automated builds,
    continuous integration or testing, and subsequent automated deployment play a
    key role in delivering applications to production. Any overlooked or unexpected
    limitation can limit or damage an application''s main objective.


    In this chapter, we will review some important areas for identifying signs of
    deviation from the main goal so that you can have functional, maintainable, and
    transparent applications. Not having those qualities could negatively affect application
    functionality on multiple levels. Runtime could be damaged, which might result
    in unpredictable costs. Faults could be hidden in application architecture, disabling
    extensibility and maintainability. Such issues could also recur and require specialized
    attention in each case.


    We will concentrate on the following areas:


    +   - What anti-patterns are and how to identify them

    - Examining typical software anti-patterns

    - Understanding software architecture anti-patterns


    By the end of this chapter, you will be able to identify and understand some of
    the signs of anti-patterns that should be looked out for.'
