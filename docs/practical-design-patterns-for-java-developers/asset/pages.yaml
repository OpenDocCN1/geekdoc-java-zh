    # Conclusion


    The memento pattern introduces the ability to isolate complex communication between
    different objects. The participating objects may vary at runtime. The pattern
    provides an encapsulated and decoupled way to allow all clients to communicate
    with each other.


    Communication can bring about various states. In the next section, we''ll explore
    how to remember and restore them.


    # Restoring the desired state with the memento pattern


    Sometimes, it may be useful to consider keeping minimal information about the
    state of an object in order to continue or restore it. The memento pattern provides
    this functionality and was described in the GoF''s book.


    # Motivation


    Without breaking encapsulation, the internal state of an object, a memento, needs
    to be captured and externalized so that the object later be restored to that state.
    The memento pattern provides a client function to restore the desired state of
    an object, a memento, on demand.


    # Finding it in the JDK


    The Date class comes with the java.base module and its java.util package is a
    nice implementation of the memento pattern. An instance of a class represents
    a specific point on a timeline, and the date can be restored to that timeline
    referring to the calendar or zone used.'
