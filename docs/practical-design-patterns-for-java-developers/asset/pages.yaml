  md: "# Motivation\n\nThis pattern can be implemented in several ways depending on\
    \ the application requirements. The module pattern concentrates or encapsulates\
    \ the composition of an application's functionality into precisely identified\
    \ modules. The Java platform has already implemented basic support for the module\
    \ concept through Jigsaw project, available since the release of JDK 9, but it\
    \ is possible to try to create it programmatically in a similar way, although\
    \ not entirely in isolation, as the source code can influence its modularization\
    \ approach.\n\n# Finding it in the JDK\n\nThe best example can be found in the\
    \ JDK of the module pattern is the Java platform modules. This concept was discussed\
    \ in great detail in Chapter 2, Discovering the Java Platform for Design Patterns,\
    \ and in the Getting to grips with the Java Module System section.\n\n# Sample\
    \ code\n\nLet us imagine a vehicle that need to have isolated brakes and engine\
    \ systems. This is pretty much according to a real-world scenario. Each module\
    \ will operate independently, and only one provider is present at runtime. Before\
    \ the vehicle can be used, both modules need to be activated (Example 4.20):\n\
    \n```\nclass ModuleMain {\n  ...\n  private static void void initModules() {\n\
    \    brakesModule = BrakesModule.getInstance();\n    engineModule = EngineModule.getInstance();\n\
