  md: "# Technical requirements\n\nYou can find the code files for this chapter on\
    \ GitHub at https://github.com/PacktPublishing/Practical-Design-Patterns-for-Java-Developers/tree/main/Chapter04.\n\
    \n# Incompatible object collaboration with the adapter pattern\n\nThe main goal\
    \ of the adapter pattern is to connect the source interface to another interface\
    \ that clients expect. The adapter pattern allows classes to work together that\
    \ otherwise couldn't due to an incompatible abstraction or implementation. It\
    \ is considered one of the most common patterns and is one of the Gang of Four\
    \ (GoF) design patterns.\n\n# Motivation\n\nThe adapter pattern is also known\
    \ as wrapper. An adapter wraps the behavior of the adaptee (connected class) and\
    \ allows access to the adaptee without modification using an already existing\
    \ interface. Commonly, an adapter uses an incompatible interface, and an adapter\
    \ consolidates such behavior and transparently provides access to the required\
    \ functionality.\n\n# Finding it in the JDK\n\nThe java.base module provides multiple\
    \ implementations of the adapter pattern. The Collections utility class from the\
    \ java.util package provides a list method, which accepts an Enumeration interface\
    \ and the result into an ArrayList.\n\n# Sample code\n\nThe adapter pattern can\
    \ be implemented in several ways. One of them is considered in the example of\
