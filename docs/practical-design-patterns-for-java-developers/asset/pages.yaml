  md: "# Getting into Software Design Patterns\n\nSome of you with a keen eye will\
    \ already notice that such a software design direction negatively involves software\
    \ flexibility through unnecessary actions that need to be considered (such as\
    \ exceptions). The remedy is by compliance with ISP in a very transparent way.\
    \ Consider two additional interfaces, HasEngine and HasPedals, with their respective\
    \ functions (see Example 1.9). This step forces the printMoving method to overload.\
    \ The entire code becomes transparent to the client and does not require any special\
    \ treatment to ensure code stability, with exceptions as an example (see Example\
    \ 1.8):\n\n```\npublic interface Vehicle {\n    void move(boolean moving);\n}\n\
    public interface HasEngine {\n    boolean engineOn();\n}\npublic interface HasPedals\
    \ {\n    boolean pedalsMove();\n}\npublic class Bike implements HasPedals, Vehicle\
    \ {...}\npublic class Car implements HasEngine, Vehicle {...}\n    -- usage\n\
    private static void printIsMoving(Vehicle v) {\n    // no access to internal state\n\
    }\nprivate static void printMoving(Car c) {\n    System.out.println(c.engineOn());\n\
    }\nprivate static void printMoving(Bike b) {\n    System.out.println(b.pedalsMove());\n\
    }\n```\n\n**Example 1.9 – The functionality split into smaller units (interfaces)\
    \ based on the purpose**\n\nTwo interfaces, HasEngine and HasPedals, are introduced,\
    \ which enforce method code overload and transparency.\n\n# The dependency inversion\
    \ principle (DIP)\n\nEvery programmer, or rather software designer, will face\
    \ the challenge of hierarchical class composition throughout their careers. The\
    \ following DIP is a remarkably simple guide on how to approach it."
