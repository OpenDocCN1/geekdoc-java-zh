- pgno: 82
  md: '# Discovering the Java Platform for Design Patterns


    Business requirements, along with community expectations, have created a platform
    for reactive programming and the ability to perform multiple asynchronous payback
    tasks. As of Java SE 5, the platform provides a Callable interface. The Callable
    interface is considered a functional interface. It contains one abstract method
    with a required return type of <T>. Because the computation is uncertain, it can
    cause an exception that be handled correctly. The Callable implementation can
    be sent to the executor and the started calculation is packed into a future.


    The Future instance is the computational work that the base system performs in
    the background. The interface provides a get method (Example 2.30) that can be
    used to retrieve the result. Using this method pauses the current thread and waits
    until a result is available. Due to the current thread suspension, this method
    should be used wisely, and it can cause performance penalties:


    **Example 2.30** – Different approaches to provide a Callable instance to the
    executor as a realization or an anonymous class


    This contrasts with the Runnable interface because the Callable interface provides
    a Future instance as a temporary result. The Callable exception handling request
    is also relevant because it can cause logic to be executed or the worker thread
    to be interrupted. In this case, it is necessary to transfer this to the interim
    result returned by the Future interface.


    # Summary


    In this chapter, we have built a good knowledge base for understanding the internal
    Java platform. We learned the differences between statically allocated arrays
    or methods compared to object instances. We learned the need for proper data synchronization
    and how Java memory management works and what guarantees the platform provides.
    We now understand the importance of heap memory, segmentation, and maintenance.
    We have already discovered a few frequently used design patterns, which means
    when we start implementing any design pattern or collection, we will be aware
    of the following:


    +   - How fields or variables are handled by the platform'
