  md: "# Motivation\n\nAsynchronous method invocation patterns introduce the ability\
    \ to receive a result by a callback from an asynchronously running task without\
    \ blocking the main process thread. The pattern presents the threading model and\
    \ level of parallelism for processing the required task types. The task results\
    \ are processed by dedicated callback handlers and provided to the main process\
    \ regardless of the task's execution time. These handlers may already belong to\
    \ the main process.\n\n# Sample code\n\nLet us look at a trivial scenario of several\
    \ vehicle temperature sensors required to provide results to the driver, which\
    \ is the case (Example 6.4):\n\n```\npublic static void main(String[] args) throws\
    \ Exception {\n    System.out.println(\"Async method invocation Pattern,\\n  \
    \  moving vehicle\");\n    var sensorTaskExecutor = new\n    TempSensorExecutor<Integer>();\n\
    \    var tempSensorCallback = new TempSensorCallback();\n\n    var tasksNumber\
    \ = 5;\n    var measurements = new ArrayList<SensorResult\n    <Integer>>();\n\
    \    System.out.printf(\"AsyncMethodMain, tasksNumber:'%d' %n\",\n    tasksNumber);\n\
    \    for (int i=0; i<tasksNumber; i++) {\n        var sensorResult = sensorTaskExecutor.measure(new\n\
    \        TempSensorTask(), tempSensorCallback);\n        measurements.add(sensorResult);\n\
    \    }\n    sensorTaskExecutor.start();\n    AsyncMethodUtils.delayMillis(10);\n\
    \    for (int i=0; i<tasksNumber; i++) {\n        var temp = sensorTaskExecutor.stopMeasurement\n\
    \        (measurements.get(i));\n    }\n    System.out.printf(\"\"\n    AsyncMethodMain,\
    \ sensor:'%d'\");\n```"
