    # The JRE


    The JRE is part of the JDK, or it can be distributed as a standalone program for
    the target operating system. To run a file with a .class extension or a Java Archive
    (JAR) file, the target system is required to contain the appropriate version of
    the JRE. Unlike the JDK, the JRE only contains a minimal collection of components
    needed to run the program, as the following:


    +   * Core libraries and property files: for example, rt.jar and charset.jar

    * Java extension files: Additional libraries that may reside in the lib folder

    * Security-related files: Certificates, policies, and so on

    * Font files

    * Operating system-specific tools


    The JRE includes a JVM and precisely two compilers of:


    +   * Client Compiler: Fast loading without optimization. It is designed to run
    the instructions to obtain a result very quickly. Commonly used for standalone
    programs.

    * Server Compiler: Loaded code goes through additional checks to ensure code stability.
    There is also an effort to produce highly optimized machine code to deliver better
    performance. It supports better statistics in order to run machine code optimization
    executed by the Just-in-Time (JIT) compiler (Figure 2.2).


    # The JVM


    Both the JDK and the JRE contain the JVM (Reference 6). The JVM is platform-dependent.
    This means that every system platform requires the use of a dedicated version.
    Fine, but what does the JVM really do, and how?


    Although there are multiple versions of the JVM, from multiple vendors, the JVM
    itself is defined by a specification that must be followed. The reference implementation
    is represented by OpenJDK. In fact, OpenJDK is a collection of several smaller
    open source projects that may have different development dynamics, but the OpenJDK
    release contains planned versions of each.'
  merge: -1
  img_proc: true
