    # Conclusion


    A factory method has its limitations. The most important one is that it can only
    be used for a specific family of objects. This means that all classes must maintain
    similar properties or common ground. Deviation from the base class of a class
    can introduce a drastic strong coupling between the code and the application.


    The point to consider may be related to the method itself, as it may be static
    or belong to the instances (as covered in the previous chapter under The Stack
    area and The Heap area sections, respectively). This depends on the software designer''s
    decision.


    The object of the one family is created. Let us investigate how to deal with factory
    families that share a common property.


    # Creating objects from different families using the abstract factory pattern


    This pattern introduces a factory abstraction without the requirement to define
    specific classes (or classes that should be instantiated). The client requests
    a proper factory that instantiates the object instead of creating it. The abstract
    factory pattern was mentioned in the GoF''s book.


    # Motivation


    Modularizing applications can become a challenge. Software designers can avoid
    adding code to classes to preserve encapsulation. The motivation is to separate
    the factory logic from the application code so that it can supply the appropriate
    factory to produce the required objects. An abstract factory provides a standardized
    way to create an instance of the desired factory and deliver that to the client
    for use. The client uses the resulting factory to instantiate the object. Abstract
    factory provides an interface for creating both factories and objects without
    specifying their classes. The pattern implicitly supports SOLID principles and
    maintainability by isolating the logic of participants and insiders. The application
    is independent of how its products are created, composed, and represented.'
