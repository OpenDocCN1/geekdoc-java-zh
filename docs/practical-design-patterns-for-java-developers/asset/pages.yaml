    # # Conclusion


    The strength of the iterator pattern is that it can be implemented in a very general
    way – no need to understand the element types being considered. The iterator loops
    through them all without touching their internal representation at runtime. Along
    with another pattern, it can change strategies on the fly or only consider specific
    object types.


    The next section explores runtime communication between specific object types
    – let’s rock it.


    # # Utilizing the mediator pattern for information exchange


    A common situation across different types of applications is the requirement to
    manage communication between clients that require the exchange of information
    in order to maintain a process. This pattern was identified early and is one of
    the core patterns of the GoF’s book.


    # # Motivation


    The mediator pattern represents an object, a man in the middle, that defines the
    way that a group of objects interacts within the group. The mediator establishes
    a free connection for client communication. Clients can refer to each other explicitly
    through an intermediary. In this way, communication can be moderated.'
