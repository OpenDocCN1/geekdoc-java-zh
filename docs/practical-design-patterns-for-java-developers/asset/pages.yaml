  md: '# Java Virtual Machine (JVM)


    ![](img/238a8977164dbaa45c168c37286f3169_52_0.png)


    Figure 2.2 – Key parts of the JVM


    The OpenJDK JVM implementation (Figure 2.2) includes a JIT compiler called **HotSpot**
    (Reference 7). HotSpot is part of the JVM and its responsibility is runtime compilation.
    In other words, the JIT compiler translates or compiles the provided bytecode
    into a native instruction at runtime. This process is sometimes called **dynamic
    translation**. Due to these JVM dynamic translation capabilities, Java applications
    are sometimes referred to as system platform-independent and the WORA acronym
    is used. This statement needs to be abstracted slightly because a JVM system implementation
    is required to translate the bytecode into a native instruction.'
