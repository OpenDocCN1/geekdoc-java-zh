    # Conclusion


    The builder pattern helps enforce the single responsibility principle by separating
    complex creation from business logic. It also improves code readability and the
    DRY principle, as the instantiation is extensible and user-understandable. The
    builder pattern is a commonly used design pattern because it reduces "code smell"
    and constructor pollution. It improves testability. The code base helps avoid
    multiple with different representations, some of which have never been used.


    Another good point to consider when implementing a pattern is to use the JVM''s
    heap or stack - more specifically, to create a statically or dynamically allocated
    representation of the pattern. This decision is commonly answered by the software
    designers themselves.


    It is not always necessary to reveal the construction process. The next section
    presents the simplicity of object cloning.


    # Cloning objects with the prototype pattern


    The prototype pattern solves the difficulty of creating new instances of an object
    with complicated instantiation process, which is too cumbersome and undesirable
    because it can lead to unnecessary subclassing. The prototype is a very common
    design pattern and was described in the GoF''s book.


    # Motivation


    The prototype design becomes very useful when heavy objects need to be created
    and factories are an unwanted approach. The newly created instance is cloned from
    its parent because the parent acts as a prototype. Instances are independent of
    each other and can be customized. Instance logic is not exposed to, and cannot
    be contributed to by, the client.


    # Finding it in the JDK


    There are many examples of using prototype patterns across JDK packages. The Collection
    framework members implement the clone method required by the inherited Cloneable
    interface. For example, an ArrayList.clone() method execution creates a shallow
    List copy of entities, by field by.'
