  md: '# Summary


    This chapter demonstrated some of the most commonly used approaches to solving
    concurrent problems. It also showed the importance of previously acquired knowledge,
    concurrent application development requires more precision and discipline to achieve
    the desired result, similar to the knowledge of Java platform internals discussed
    in Chapter 2, Discovering the Java Platform for Design Patterns.


    Each explicitly adopted pattern forces the creation of a sustainable, clean application
    code base. Many of them clearly follow and use development approaches such as
    APIE or SOLID.


    The evolution of the Java platform tends to simplify how to apply the platform''s
    concurrency capabilities. One could have already been mentioned in some of the
    sections in this chapter. Features such as CompletableFuture or Executors utils
    have been around for a while, but upcoming ones might be worth considering. The
    tentative goal with virtual threads is to increase application throughput while
    making proper use of the underlying resources and still maintaining threading
    conveniences as debugging and providing relevant stack frames. Structure concurrency,
    on the other hand, attempt to provide a framework for simply designing callbacks
    while using an imperative code style. In addition to upcoming features that to
    improve application throughput or simplify the usage of the concurrency framework,
    we should not forget about the immutability of the instances served by the record
    type. The record type provides a strong state contract due to equality. Instance
    immutability can play a critical role in thread interactions.


    The entire application development can sometimes deviate from the desired goal.
    Some common symptoms have already been identified in this kind of situation. These
    signals could signal our attention to reconsider the direction of development.


