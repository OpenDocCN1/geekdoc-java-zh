- pgno: 48
  md: '# Discovering the Java Platform for Design Patterns


    By the end of the chapter, you will have a good understanding of memory allocation
    on the Java platform, platform guarantees, core APIs, and more. Together with
    the content of the previous chapter, these topics will form a well-prepared foundation
    so that you can start with design patterns with full awareness of their benefits.


    # Technical requirements


    The code files for this chapter are available on GitHub at https://github.com/PacktPublishing/Practical-Design-Patterns-for-Java-Developers//main/Chapter02.


    # Knocking on Java’s door


    In the early 1990s, a small team at Microsystems was formed in order to discover
    new horizons. The team started with the consideration of extending the C++ features
    available in those days. One of the goals was to introduce a new generation of
    software for a small device. The introduction of software reusability was a part
    of this. Small smart devices as set-top boxes did not have much memory and had
    to use their resources wisely. The memory, among other things, such as its complexity,
    error-prone programs, and probably James Gosling''s language extension attempt,
    later led to the rejection of the C++ idea. Instead of struggling with C++, a
    new language called Oak was created in lieu. Due to the trademark issue, the newly
    created language was renamed Java.


    The first public Java version 1.0.2, together with HotJava Browser, was announced
    at the SunWorld conference in 1995 by John Gage, the director of science at Microsystems.
    He was involved in re-directing the Java language from a language for small hardware
    devices to being a platform for WWW applications. In these early days, Java was
    used as part of a website using a technology known as applet. Java applets were
    small sandboxes, defined by the frame with limited access and the capability to
    execute Java bytecode on the local Java Virtual Machine (JVM). Applets resided
    on a web browser or as a standalone application; they were a very powerful tool
    that supported one of the basic Java principles, Write Once, Run Anywhere (WORA).
    However, due to many issues (such as security and stability), the applet technology
    was marked for removal (Java SE 17).'
