    knowledge applicable the future. This can soon be considered a missing business
    opportunity due to the inability to supply business elements or only parts of
    them.


    In addition to the degradation of the learning curve, other symptoms can be identified.
    This can be described as an inability to test a business function. Project code
    is proving sticky, dependencies are out of control, which can also harm code readability,
    testability, and, of course, programmer discipline. The daily goal of the software
    designer can be reduced to closing a ticket.


    To avoid getting to this state, this book will provide some guidelines for solving
    the most common problems in the following chapters by introducing and questioning
    different types of design patterns. The design patterns are in line with the aforementioned
    basic pillars of OOP and APIE and promote the principles of SOLID.'
