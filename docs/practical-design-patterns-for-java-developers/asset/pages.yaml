  md: 'The vehicle abstraction does not have any engine implementation details, which
    may vary even in the class hierarchy. The vehicle only needs to rely on the provided
    interface.


    # Conclusion


    The bridge pattern is a good idea to consider when the application source code
    requires reducing bindings to specific implementation, the decision about a specific
    implementation can be deferred until runtime. The bridge pattern helps to encourage
    SOLID principles through responsibility separation and encapsulation. The implementation
    can be freely tested and shared as required through the application source code.
    It is required to keep in mind not to add unwanted responsibilities to the bridge
    implementation and consider alternative approaches in terms of design patterns
    when such a situation takes a place.


    The bridge pattern can open the door to better composition of implementation specifics,
    as we''ll explore in the next pattern.


    # Treating objects the same way using the composite pattern


    The composite pattern is a remarkable solution for handling objects uniformly
    when arranging them in a tree structure, which simplifies access to instances.
    The demand for it naturally came from industry, and the pattern was so identified
    and described by the GoF.


    # Motivation


    Grouping objects around the underlying business logic is a powerful approach.
    A composite design outlines a way to achieve such a state. Since each member of
    the group is treated uniformly, it is possible to create hierarchical tree structures
    and part-whole hierarchies. It helps to establish the logical relationships of
    the application and the composition of the desired objects.


    # Finding it in the JDK


    In the JDK, the composite pattern can be found in the java.base module, the java.util
    package, and the Properties class. The Properties class implements the Map interface
    through its Hashtable implementation, and also contains a ConcurrentHashMap instance
    to store the property values internally. Although the Properties class''s put
    operation remains synchronized due to the Hashtable implementation, the get operation
    does not, as it is simple to read into the concurrent map.'
