    # Standardizing processes with the template pattern


    The template method pattern unifies the generalization of intensive actions with
    a templating approach. The template pattern was recognized early and considered
    as part of the GoF''s.


    # Motivation


    The template method pattern is based on identifying similarly used steps. These
    steps define the skeleton of an algorithm. Each operation can defer its steps
    to specific subclasses. The template method introduces subclasses to redefine
    certain parts of an algorithm without changing its structure. A template can be
    used to execute the internal methods in the desired order.'
