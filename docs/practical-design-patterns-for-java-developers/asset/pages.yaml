    The values of the SCRUM methodology can be simplified to courage, concentration,
    determination, respect, and openness. These values are not specific to the SCRUM
    framework. Because the team''s motivation is to deliver the product, they will
    all sound very and formal.


    We will now refresh our memory of the state the team has achieved. A state where
