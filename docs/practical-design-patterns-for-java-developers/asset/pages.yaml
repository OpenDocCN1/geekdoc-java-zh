  md: "# Finding it in the JDK\n\nA clearer example of the marker interface in the\
    \ JDK can be found in the java.base module. The java.io package defines the Serializable\
    \ interface and the java.lang package provides the Cloneable interface. Both do\
    \ implement any method, and both are used to inform the runtime about special\
    \ handling. The Serializable interface is important during serialization and deserialization\
    \ processes (the writeObject and readObject methods), where each nested field\
    \ requires an implementation to clone the state of the instance while traversing\
    \ the object graph. In a simple way, the Cloneable interface informs the JVM that\
    \ the Object.clone() method is being used and it can create a field-to-field copy\
    \ of the object. It is good to be aware of the field differences. The primitive\
    \ types provide values but object-only references. It means that objects require\
    \ an implementation of the Cloneable interface to provide a copy.\n\n# Sample\
    \ code\n\nLet us draw a simple real-world example where a vehicle contains multiple\
    \ sensors (Figure 4.9):\n\n![](img/238a8977164dbaa45c168c37286f3169_149_0.png)\n\
    \nFigure 4.9 – UML class diagram of certified sensor tags (CertifiedSensor and\
    \ CertifiedAnnotation) using the marker interface pattern\n\nThe vehicle controller\
    \ needs to identify special groups of the sensors that are certified for delivering\
    \ specific information (Example 4.17):\n\n```\npublic static void main(String[]\
    \ args) {\n    System.out.println(\"Pattern Marker, sensor\nidentification\");\n\
    }\n```"
