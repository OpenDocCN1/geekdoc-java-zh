    # Conclusion


    The big advantage of the flyweight pattern is the ability to administrate a large
    number of requests for the required objects. It instances on demand and allows
    you to control over the present instances. The application does not need to depend
    on the identity (hashCode equals) of the object. The flyweight pattern provides
    a transparent way to obtain access to the object and its implementation enforces
    the SOLID design concept and DRY approach.


    The next section describes how to consolidate incoming requests in a controlled
    manner.


    # Handling requests with the front-controller pattern


    The goal of the pattern is to create a common service for most of the client requirements.
    The pattern defines a procedure that allows common functions such as authentication,
    security, custom manipulation, and logging to be encapsulated at a single location.


    # Motivation


    This pattern is commonly seen within web applications. It implements and defines
    the standard handler used by the controller. It is the handler''s responsibility
    to evaluate the validity of all incoming requests, although the handler itself
    may be available in many incarnations at runtime. The code is encapsulated in
    one place and referenced by the clients.'
