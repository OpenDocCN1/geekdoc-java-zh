- pgno: 17
  md: '# Preface


    The Java language is a tool for communicating with a very rich platform that provides
    many features ready to serve for application development. This book explores the
    latest developments in improving language syntax with examples of the most useful
    design patterns. The book reveals the relationship between features, patterns,
    and platform efficiency through example implementations. The book explores how
    theoretical foundations help improve the maintainability, efficiency, and testability
    of source code. The content helps the reader solve different tasks and provides
    guidance on how to approach challenges using a variety of sustainable and transparent
    approaches.


    # Who this book is for


    This book is dedicated to all "hungry" engineers who want to improve their software
    design skills with new language enhancements and a closer look at the Java platform.


    # What this book covers


    +   Chapter 1, Getting into Software Design Patterns, introduces us to the initial
    foundations of source code structure and outlines the principles that should be
    followed to achieve maintainability and readability.


    +   Chapter 2, Discovering the Java Platform for Design Patterns, discusses the
    Java platform, which is a very broad and powerful tool. This chapter exposes the
    features, functions, and design of the Java platform in detail to continue building
    the foundation needed to understand the purpose and value of using design patterns.


    +   Chapter 3, Working with Creational Design Patterns, explores object instantiation,
    which is a key of any application. This chapter describes how to approach this
    challenge while keeping the requirements in.


    +   Chapter 4, Applying Structural Design Patterns, shows how to create source
    code that allows for clarity of relationships between required objects.


    +   Chapter 5, Behavioral Design Patterns, explores how to create source code
    that allows objects to communicate and exchange information while maintaining
    a transparent form.


    +   Chapter 6, Concurrency Design Patterns, discusses the Java platform and how
    it is a concurrent environment by nature. It shows how to harness its power for
    the designed application''s purposes.'
  merge: -1
  img_proc: true
