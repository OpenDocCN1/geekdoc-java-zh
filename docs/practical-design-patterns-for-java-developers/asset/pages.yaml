  md: "# Using conditions to select desired objects with the filter pattern\n\nThe\
    \ filter pattern - sometimes called the criteria pattern - is a design pattern\
    \ that allows clients to filter a set of objects using different criteria, or\
    \ rules, and chain them separately using logical operations.\n\n# Motivation\n\
    \nThe filter pattern helps simplify the code base to work like container objects\
    \ that use subtyping instead of parameterization (generics) for an extensible\
    \ class structure. It allows the client to easily extend and enhance the filtering\
    \ capability of container-like objects. Different filters can be dynamically added\
    \ or removed without modifying the client.\n\n# Finding it in the JDK\n\nLet us\
    \ consider a filter as an interface with a single function and a logical Boolean\
    \ result. A nice example of the filter pattern is the Predicate class, found in\
    \ the java.base module and the java.util function package. Predicate represents\
    \ a Boolean function and is intended for use in the Java Stream API (discussed\
    \ earlier, in Chapter 2, Discovering the Java Platform for Design Patterns), more\
    \ specifically in the filter method, which accepts a predicate and returns a true\
    \ or false primitive.\n\n# Sample code\n\nA example of using the filter pattern\
    \ would be an application that requires the selection of desired sensors in a\
    \ vehicle. Every vehicle these contains a huge number of sensors, so it can be\
    \ difficult for a client to research each individually (Example 4.11):\n\n```\n\
    private static final List<Sensor> vehicleSensors = new\nArrayList<>();\nstatic\
