  md: "Providing a placeholder for an object using the proxy pattern 133\n\n# Motivation\n\
    \nIn its most general form, a proxy is a class acting as an interface to the client.\
    \ A proxy is considered a wrapper or agent object that is used by a client. The\
    \ client accesses the actual object through the same interface and the actual\
    \ implementation stays hidden from the client in the background. Communication\
    \ between the client and the implementation remains transparent, thanks to the\
    \ proxy pattern.\n\nBy using a proxy, the client can access the actual object,\
    \ or it can provide additional logic.\n\n# Finding it in the JDK\n\nThe proxy\
    \ design pattern also has a place in the JDK. The most well-known one is the public\
    \ Proxy class, which you can find in the java.reflect package of the java.base\
    \ module. The Proxy class provides several static methods for creating objects\
    \ by method invocation.\n\n# Sample code\n\nThe given example can be considered\
    \ as the remote control of a vehicle. A controller, represented by a proxy design\
    \ pattern, provides exactly the same functionality as a real vehicle, also managing\
    \ the connection between the real instance (Example 4.22):\n\n```\npublic static\
    \ void main(String[] args) {\n    System.out.println(\"Pattern Proxy, remote vehicle\
    \ controller\");\n    Vehicle vehicle = new VehicleProxy();\n    vehicle.move();\n\
    \    vehicle.move();\n}\n```\n\nHere's the output:\n\n```\nPattern Proxy, remote\
    \ vehicle controller\nVehicleProxy, real vehicle connected\nVehicleReal, move\n\
    VehicleReal, move\n```\n\nExample 4.22 – The VehicleProxy instance works like\
    \ a real vehicle\n\nThe real vehicle implementation is defined by the generic\
    \ abstraction provided by the Vehicle interfaces (Figure 4.11):"
