    # # Conclusion


    Being able to identify and describe some of the most common deviations from well-known
    principles and approaches bring value to any project. In this subsection, we have
    examined anti-patterns and proposed solutions to keep your code base maintainable
    and readable. The last point we want to make in this section is about the proper
    naming of methods, fields, and classes, which can significantly improve readability
    and maintainability and limit the misunderstanding of API use. Proper naming is
    also important as it allows a good understanding of UML diagrams. The next section
    takes us more into source architecture.


    # # Understanding software architecture anti-patterns


    A clear understanding of classes, packages, and module composition can be seen
    as essential not only to the application itself, but as we learned in Chapter
    2, Discovering the Java Platform for Design Patterns, as well. Thanks to the dynamic
    translation of the bytecode by the JIT compiler processes, the Java platform collects
    essential information about its optimization. Poor code quality and software architecture
    can cause latency, improper memory usage, or crashes. Let’s consider the possible
    obstacles.


    # # Golden hammer


    One approach approved over a period of time without exploration of alternatives
    can easily turn into legacy code. The fact that it is difficult to accept other
    proposals or migration may be due to a particular set of approaches, otherwise
    known as the golden hammer anti-pattern, where developers believe that there is
    no need to investigate whether something would be beneficial when it has been
    working fine for several years. A great example would be a vendor-specific database
    or tool, and the problem arises when the application needs to migrate to microservices
    or more distributed design.


    Scalability is penalized not only by the CAP theorem, as mentioned earlier, but
    may suffer due to almost unusable usage across designed modules or application
    parts.


    Using a particular vendor’s product in your architecture is not necessarily an
    issue. The challenge is that the development of the application relies entirely
    on the capabilities and functions provided by the vendor without evaluating its
    capabilities.


    A possible solution could be to re-evaluate current development approaches and
    allow for improvement through effective research of solutions.'
