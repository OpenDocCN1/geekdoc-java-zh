    # # Conclusion


    A well-developed active object pattern reflects the SOLID design approaches because
    it encapsulates the critical parts and only exposes the control interface required.
    The instance does not interfere with the application and the whole approach can
    be generalized to the desired level. An active object can be a good candidate
    for introducing a concurrency model into an application, but there are a few challenges
    to keep in mind. One of these challenges is the number of possible application
    threads, where a high number can make the application fragile or lead to instability
    as it depends on available resources.


    Let''s explore the asynchronous nature of events in the next section.


    # # Non-blocking tasks using async method invocation pattern


    The asynchronous method invocation pattern is a way to solve the challenge of
    not penalizing the main process thread with possibly time-consuming tasks.'
