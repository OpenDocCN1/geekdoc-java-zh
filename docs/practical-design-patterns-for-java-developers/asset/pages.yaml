- pgno: 143
  md: "# Finding it in the JDK\n\nThe flyweight pattern can easily be found in the\
    \ JDK. It may not be obvious to many. For example, in the implementation of primitive\
    \ wrapper types, the java.base module and the java.lang package use this pattern\
    \ to reduce memory overhead. A pattern is particularly useful when an application\
    \ needs to handle many repeated values. Classes such as Integer, Byte, and Character\
    \ provide a valueOf method, and its implementation uses an internal cache to store\
    \ repeated elements.\n\n# Sample code\n\nLet us examine an example case where\
    \ a garage continually hires out specific vehicle types. The garage contains some\
