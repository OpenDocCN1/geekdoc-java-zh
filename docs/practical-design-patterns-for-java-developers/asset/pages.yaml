  md: '# Summary


    In this chapter, we learned about the importance of the runtime environment and
    the dynamic nature of program execution. Behavioral design patterns can improve
    a program''s interaction with the internal parts of the Java platform. The JIT
    compiler can handle bytecode translation at runtime better, or a garbage collector
    can perform more efficient memory reclamation.


    Most of these design patterns comply with SOLID principles – only the visitor
    pattern has some room for thought. However, recently added improvements to the
    Java platform can help overcome this. Whether sealed classes, switch statements,
    pattern-matching enhancements, or records, the platform provides a solid foundation
    for strengthening the program''s immutability and code stability and simplifying
    the use of design patterns. Some of them may out of the box, such as a factory
    method and switch-case statement enhancements.


    In this chapter, we learned how to solve challenges at runtime examples. We explored
    how to process a chained task and command the actors. The formula interpreter
    translates the text into objects and viewed how to iterate over them. The mediator
    pattern centralizes complex communication between objects. We learned how to avoid
    a null-pointer exception and given an undefined object type using the null pattern.


    The pipeline formula processes a collection of clients sequentially. We explored
    how to change the state of particular actors and reviewed how to monitor these
    changes with the observer pattern. The last pattern we learned was the visitor
    pattern, which showed us how to perform a specific operation based on the object
    type.


    With the knowledge gained from behavioral patterns, we have added the missing
    piece to the complete lifecycle of a single-thread program. This includes the
    creation of objects, the programming structure for working with these objects,
    and the dynamic behavior and communication between these objects at runtime.


    Although the intended program starts from the main thread and may be single-threaded
    as required, neither the Java platform nor most business requirements are singlethreaded.
    The shared nature of tasks lends itself to multi-threaded communication. This
    can be done using various frameworks. As we will see in the next chapter, we can
    explore some common concurrency patterns to solve the most common challenges in
    this regard. Let''s shake it up!


    # Questions


    +   - What principle is broken by the standard visitor pattern?

    - Which pattern helps us traverse over elements in a collection without knowing
    the type?

    - Is there a pattern that allows us to change an instance''s behavior at runtime?

    - Which pattern helps the runtime transparently identify an undefined state?

    - What are the most used patterns by the Java Stream API?'
