  md: '# Getting into Software Design Patterns


    Classes can be instantiated so that an instance becomes an object. The object
    must fit into free memory. We say that the object allocates memory space. When
    Java is considered, allocated memory is virtual space inside the physical system''s
    memory.


    Just a small note – we previously discussed the existence of the JVM, an interpreter
    of compiled bytecode for the required platform (see Figure 1.3). We mentioned
    other JVM features, one of which is management. In other words, the JVM assumes
    responsibility for allocating virtual memory space. This virtual memory space
    can be used to allocate an instance of a class. This virtual memory and its fragmentation
    are taken care of by the JVM and an unused object cleans the selected garbage
    collection algorithm, but this is beyond the scope of this book and would be the
    subject of further study (see Reference 1).


    Every programmer, although it may not be obvious at first glance, plays the role
    of a software designer. The programmer creates the code by writing it. The code
    carries an idea that is semantically transformed into action depending on the
    text entered.


    Over time, software development goes through many phases and many articles have
    been written and published on software maintenance and reusability. One of the
    milestones in software development may be considered the year 2000 when Robert
    C. Martin published his paper on Design Principles and Design Patterns (see Reference
    2). The paper reviews and examines techniques in the design and implementation
    of software development. These techniques were later simplified in 2004 into the
    mnemonic acronym SOLID.


    The goal of the SOLID principles is to help software designers make software and
    its structure more sustainable, reusable, and extensible. In the following sections,
    we will examine each of the individual terms hidden after the initial letter in
    the abbreviation SOLID.


    # The single-responsibility principle (SRP) – the engine is just an engine


    The first principle is a well-defined class goal. We can say that each class should
    have only one reason to exist. In as, it is the intention and responsibility for
    only one part of the functionality. The class should encapsulate this part of
    the program. Let’s put this in the context of an example. Imagine the previous
    example of a vehicle and its abstraction. We are now extending this class with
    the Engine and VehicleComputer classes, as:'
