    \ or advanced logic, such as RuleAnd, with respect to other rules in the decision\
    \ process**\n\nThe sample application can be easily extended with any additional,\
    \ more complex rule through a transparently defined interface.\n\n# # Conclusion\n\
    \nFiltering or better selection of the correct instances may be required in places\
    \ such as joining different request types or database results in the Java heap.\
    \ The filter pattern has shown its flexibility and that each rule can be developed\
    \ independently, that is, optimized without the involvement of others, which makes\
    \ it a suitable candidate when a client needs to work with container structures.\n\
    \nThe next pattern represents a possible way to reduce the memory footprint by\
    \ sharing instances.\n\n# # Sharing objects across an application with the flyweight\
    \ pattern\n\nThe flyweight pattern is used to minimize memory usage or computational\
    \ cost by sharing as much as possible with similar objects. The flyweight pattern\
    \ was described by the GoF author group.\n\n# # Motivation\n\nWhen a newly developed\
    \ application uses many objects that are not required by the client. Memory maintenance\
    \ costs can be high not only because of the large number of instances but also\
    \ of the creation of a new object. In many cases, groups of objects can be successfully\
    \ replaced by a relatively small number of instances. These instances can be transparently\
    \ shared between the desired clients. This will reduce the pressure on the garbage\
    \ collection algorithm. In addition, an application can reduce the number of open\
    \ sockets when instances use such communication types."
