- pgno: 42
  md: '# Getting into Software Design Patterns


    Although the SOLID and APIE concepts suggest general principles, they do not guarantee
    that the project code base will start to rot. Adherence to these principles makes
    it difficult, but there is still room because not all concepts provide the required
    framework for dealing with rot.


    There be long stories of how software can rot over time, but one fact that remains
    is there is a cure for avoiding or letting it go. The cure is covered by an idea
    **design patterns**. The idea of a design pattern not only covers the readability
    of the code base and its purpose but also advances the ability to verify required
    business hypotheses.


    What are the ideas defining it to get more clarity? The design pattern can be
    described as a set of reusable approaches that solve the most common problems
    encountered during application development. These approaches are in line with
    the previously mentioned APIE or SOLID concepts and have an incredibly positive
    impact bringing transparency, readability, and testability to the development
    path. Simply put, the idea of design patterns provides a framework for accessing
    common challenges in software design.


    # Review what challenges design patterns solve


    Take a deep breath and think about the motivation for writing the program. The
    program is written in a programming language, in our case, Java, and a human-readable
    form to address a specific challenge. Let''s look at it from a different perspective.


    We state that writing a program is considered a goal. The goal has its reason
    defined by known requirements or needs in most cases. Expectations and limitations
    are defined. When the goal is known, each action is chosen with the aim of achieving
    it. The goal is evaluated, and placed in the context of the destination, where
    the destination means a work program addressing the required challenge. Imagine
    all the difficulties mentioned in the previous sections.


    Day after day, a solution is posed, instead of a transparent solution. Every day,
    another success keeps the project afloat, despite everything looking good on the
    surface.


    Currently, most teams follow the SCR framework. Imagine a situation where the
    team follows the SCR framework (*Reference 4*) and application development begins
    to deviate from the goal. Daily meetings run smoothly from time to time: it is
    mentioned that a fundamental error has been found. After a few days, the bug is
    successfully fixed with great applause. Interestingly, the frequency of such notifications
    is growing – more corrections, more applause. But does this really mean that the
    project is moving towards its goal? Does this mean the application works? Let''s
    look at the answer.


    There is a darker side – the backlog is growing with features and technical debt.
    Technical debt is not necessarily a terrible thing. Technical debt can stimulate
    the project and can be especially useful in the concept validation phase. The
    problem with technical debt occurs when it is not recognized, ignored, and poorly
    evaluated – even worse when technical debt starts being labeled as new features.'
