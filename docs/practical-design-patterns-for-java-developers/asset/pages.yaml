- pgno: 116
  md: '# Reducing class dependencies with the dependency injection pattern


    This separates the initialization of the class (that acts as a service) from the
    client (that uses the service).


    # Motivation


    The dependency injection pattern is widely used where there is a need to separate
    the implementation of a particular object (service) from the target object (client)
    that uses its exposed services, methods, and the like. Services are available
    when a client instance is to be created. The pattern allows you to eliminate any
    hardcoded dependencies. These services are instantiated outside of the client
    creation process. This means the two are loosely connected, and SOLID principles
    can be enforced. There are three ways that dependency injection can be implemented:


    +   * **Constructor dependency injection:** Intended services are made available
    to the client through the initialization of the constructor.


    +   * **Injection method:** The client exposes the method normally through an
    interface. Such a method supplies dependencies to the client. The supplier object
    uses a method to inject the service(s) to the client.


    +   * **Field dependency injection:** This type of injection is done using a setup-like
    method. These setters refer to the respective field by the client. The client
    can also expose the field as a public property.


    # Finding it in the JDK


    A good example of using the dependency injection pattern is the `ServiceLoader`
    utility class. It can be found in the `java.base` module and its `java.util` package.
    The `ServiceLoader` instance to find services during the application startup at
    runtime. A service considered to be represented by a well-specified interface
    that is implemented by the relevant service provider or providers. The application
    code is able to distinguish the desired provider at runtime. It is good to note
    that `ServiceLoader` works with the classic classpath configuration or can be
    used seamlessly with the Java Platform Module System (discussed in *Chapter 2,
    Discovering the Java Platform Design Patterns*)


    In the past, dependency injection was part of Java EE, not the classic JDK. This
    means that that feature was available on the Java platform. Due to the evolution
    of the JDK, the dependency injection features were moved to the **Jakarta Dependency
    Injection** project. A newly created project follows its own release and development
    cycle without dependency on the JDK. Nevertheless, the dependency injection is
    well known to the usage of `@Inject`, `@Named`, `@Scope`, or `@Qualifier`'
