- pgno: 134
  md: '# Motivation


    With the decorator pattern, you can dynamically attach additional responsibilities
    to an object. A decorator provides a flexible alternative to subclasses to extend
    the functionality of a class. The decorator can be added statically or dynamically
    without altering the current behavior of an object.


    # Finding it in the JDK


    Uses of the decorator pattern can be found in the Java collections framework,
    the java.util package. The Collection class contains different ways to use the
    decorator pattern. For example, the unmodifiableCollection method wraps the requested
    collection into an unmodifiable collection represented by an UnmodifiableCollection
    instance acts as a decorator for the provided collection type, similar to other
    methods starting with unmodifiable... words. Another example is methods starting
    with the word synchronized... of the Collections utility class.


    # Sample code


    When you think about the previous examples of vehicles, the decorator pattern
    can be considered a tuned vehicle. The standard SportVehicle class is like this.
    It implements the Vehicle interface to fulfill standard functions. The application
    designer later decides to improve the current state and creates a TunedVehicleDecorator
    class that wraps the standard vehicle, without having to change previous functions
    (Figure 4.4):


    ![](img/238a8977164dbaa45c168c37286f3169_134_0.png)


    Figure 4.4 – The UML class diagram highlights the relationship between SportVehicle
    and TunedVehicleDecorator types'
