  md: "# Getting to grips with the Java Module System\n\nThe JMPS provides a strong\
    \ encapsulation concept that defines application interactions at the package level\
    \ (Example 2.16). The application can be divided into modules that can only detect\
    \ APIs or services. The JMPS supports package-level dependency building and increases\
    \ the maintainability, reliability, and security of the application being developed:\n\
    \n```\nModule java.logging {\n    exports java.util.logging;\n    provides jdk.internal.logger.DefaultLoggerFinder\
    \ with\n        sun.logging.internal.LoggingProviderImpl;\n}\n```\n\nExample 2.16\
    \ – Example of the module-info.class exposing a package for external usage\n\n\
    The use of the JMPS is not mandatory. The platform uses the JMPS, but if the application\
    \ is not ready, unnamed modules can be used. In this case, all packages or classes\
    \ belong to this kind of unnamed module. In principle, an unnamed module reads\
    \ readable module or class from the class path without any package-level restrictions\
    \ enforced by the JMPS. In this way, compatibility with previously developed applications\
    \ is achieved and the software designer has no doubts about the maintenance of\
    \ the code base – that is, the JMPS is disabled.\n\nAlthough the JMPS has incredible\
    \ potential for application sustainability, security, and reusability; it is often\
    \ not used because it creates indirect pressure to properly configure the underlying\
    \ JMPS and use a design pattern that enforces SOLID principles.\n\nWhen using\
    \ the JMPS, the platform ensures that the developed application does not contain\
    \ any cyclic dependencies. Behind the scenes, the JMPS creates an acyclic module\
    \ graph (not a class path).\n\nBy creating a module descriptor file, the platform\
    \ provides a set of directives that can be used to expose certain parts of the\
    \ module to the outside world.\n\nLet’s create a simple example of a module to\
    \ remove any doubt about the use of the JMPS (Example 2.17). Our discussion so\
    \ far can overcome the initial difficulties:\n\n```\nmodule-example\n├── example\n\
    |   └── ExampleMain.java\n└── module-info.java\n```\n\nExample 2.17 – Folder structure\
    \ of module example developed with OpenJDK 17"
