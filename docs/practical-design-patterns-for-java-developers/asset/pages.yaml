    \ cadence to 6 months. This fact can contribute to the engine of an anti-pattern,\
    \ where refactoring is required, on the other hand, it has a great effect on removing\
    \ shortcomings.\n\nThe continuous obsolescence anti-pattern can be easily identified\
    \ by an inability to move a project to the next phase using continuous integration\
    \ and delivery (Example 7.5):\n\n```\ninterface VehicleCO {\n    void checkEngine();\n\
    \    void initSystem();\n    void initRadio(); /* never used */\n    void initCassettePlayer();\
    \ /* never used */\n    void initMediaSystem(); /* actual logic */\n}\n```\n\n\
    **Example 7.5 - The VehicleCO abstraction contains outdated methods that still\
    \ need to be tested**\n\nOf course, the concepts of continuous delivery and integration\
    \ do not give any guarantee of code base clarity as they need to be followed by\
    \ development discipline. Continuous clean-code-focused reviews, object-oriented\
    \ principles, and patterns can drastically reduce the incidence of continuous\
    \ obsolescence and have a major impact on the entire application architecture.\n\
    \n# Input kludge\n\nIt may not be obvious at first glance, the input kludge anti-pattern\
    \ is quite common. A good example would be several services that were tested until\
    \ one began to deviate from its functionality. A quick hoc solution has more side\
    \ effects that are recognized with a long delay due to disabled tests. Various\
    \ services already had more patches applied than others, so even more tests were\
    \ disabled. The fact remains that those disabled tests were critical to maintaining\
    \ application integrity.\n\nThe solution might be to maintain discipline in testing\
    \ and ensure that test inputs and outputs are valid and updated, rather than turning\
    \ off essential."
