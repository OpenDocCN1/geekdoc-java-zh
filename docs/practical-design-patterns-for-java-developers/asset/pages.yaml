    as a string. The string is immutable in Java. This means that any operation, such
    as concatenation, on its will create a new string. More precisely, it is not possible
    to change its current value. A string is the base class of the Java platform.


    A common way to store a string value is to use a String Pool. The String Pool
    only stores intrinsic values (Figure 2.11). This means that it is only possible
    to have one different constant value present. This approach makes the pool more
    efficient in terms of memory, including time-consuming string operations.


