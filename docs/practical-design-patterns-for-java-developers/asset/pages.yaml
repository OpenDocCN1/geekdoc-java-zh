    Let us examine how to customize an object creation process in the next section.


    # Instantiating complex objects with the builder pattern


    The builder pattern helps separate the construction of a complex object from its
    code representation so that the same composition process can be reused to create
    different configurations of an object type. The builder design pattern was identified
    early and is the part of GoF''s book.


    # Motivation


    The builder pattern is a commonly used pattern to construct complex instances
    without polluting the constructor. It helps to separate or even break the creation
    process into specific steps. The composition of objects is transparent to the
    client and allows the creation of different configurations of the same type. The
    builder is represented by a separate class. It can help to encapsulate and enforce
    the clarity of the instantiation process with respect to the previously discussed
    SOLID design principles.


    # Finding it in the JDK


    The builder pattern is a commonly used pattern inside the JDK. A great example
    is creating sequences of characters that represent a string. For example, StringBuilder
    and StringBuffer in the java.lang package of the java.base module, which is visible
    by default to every java application. The string builder provides multiple overloaded
    concatenation methods that accept different types of input. This input is concatenated
    with an already-created array. Another example can be found in the java.net.http
    package represented by the HttpRequest.Builder interface and its implementation
    the Stream.Builder found in the java.util.stream package. As mentioned earlier,
    the builder pattern is very often used. Not with Locale, Builder and Calendar.Builder,
    which use the setter methods to store values of the final product. Both can be
    found in the java.util package of the java.base module.


    # Sample code


