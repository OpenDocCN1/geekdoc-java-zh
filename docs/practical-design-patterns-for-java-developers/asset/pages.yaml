    object is separate from the logic and may contain additional valuable information.
    A command has its own lifecycle and makes it easy to implement callback functions
    that can trigger another event.


    Representing these commands textually can be tricky. The following section shows
    how the client can understand them.


    # Giving meaning to the context using the interpreter pattern


    The interpreter pattern interprets sequences of characters into desired actions.
    It was identified early due to its use in SQL statement translation and described
    in more detail in the GoF book.


    # Motivation


    The interpreter pattern defines two types of objects that refer to specific sequences
    of characters. They are terminal and non-terminal actions or operations that can
    be performed on the sequence of characters under consideration. These operations
    represent the computer language that is used and have their own semantics. The
    syntactic tree of a given sentence – a sequence of characters – is instance of
    a compound pattern and is used to evaluate and interpret meaning for the client
    program.'
