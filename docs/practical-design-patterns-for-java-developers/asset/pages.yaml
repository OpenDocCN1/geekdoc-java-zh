    \ Sensor(\"fuel\", false));\n    vehicleSensors.add(new Sensor(\"speed\", false));\n\
    \    vehicleSensors.add(new Sensor(\"speed\", true));\n}\npublic static void main(String[]\
    \ args) {\n    ...\n    Rule analog = new RuleAnalog();\n    Rule speedSensor\
    \ = new RuleType(\"speed\");\n```"
