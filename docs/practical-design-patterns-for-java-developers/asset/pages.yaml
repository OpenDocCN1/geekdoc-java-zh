    each other. We can see that the entropy of the software has increased because
    the coherence is not maintained. The project is beginning to rot and convergence
    to the inevitable wasted time increases.


    Let us take another breath and think about how to prevent such a situation. It
    may be possible to identify these tendencies. Usually, each team has some community:
    the team is not always homogeneous in knowledge, but this should not prevent us
    from identifying the degradation of the learning curve.


    The project learning curve can help identify a rotting project. Instead of gradual
    improvements towards the goal, the team experiences locals full of technical repairs
    and solutions. Such successes do not even correspond to the values of SCRUM and
    gradual improvement seems unlikely. The solution may not be considered an improvement
    because it is specific to a particular movement and may violate the specifications
