- pgno: 58
  md: '# Discovering the Java Platform for Design Patterns


    To address these challenges, let''s analyze a real access to variables. What is
    already known is that each variable is located within the allocated RAM heaps.
    It seems obvious that updating the status of each variable may cause some penalties,
    as each instruction has to take a whole journey (Figure 2.5). In most cases, this
    is also not necessary. A good example is the implementation of an isolated method
    (Example 2.2). However, there are cases where the actual value of a variable is
    required from memory, for which Java has implemented the volatile keyword. Using
    the volatile keyword before a variable gives the variable a guarantee that when
    another thread requests a value, it checks its current value in memory. This means
