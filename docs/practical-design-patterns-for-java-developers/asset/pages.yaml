  md: "# Technical requirements\n\nYou can find the code files for this chapter on\
    \ GitHub at https://github.com/PacktPublishing/Practical-Design-Patterns-for-Java-Developers/tree/main/Chapter06.\n\
    \n# Decoupling a method execution with an active object pattern\n\nThe active\
    \ object design pattern separates and defers method execution from method invocation\
    \ by running its own control thread.\n\n# Motivation\n\nThe active object pattern\
    \ introduces a transparently concurrent model to the application. It creates and\
    \ starts an initial thread that executes the required logical, critical section.\
    \ An active object instance exposes a public interface that a client can use to\
    \ run an encapsulated critical section. An external, client-initiated event is\
    \ queued and ready to execute. The execution is performed by the internal scheduler.\
    \ The result can be passed to the appropriate handler in a callback style.\n\n\
    # Sample code\n\nLet us introduce an example of a moving vehicle with a radio\
    \ system (Example 6.1):\n\n```\npublic static void main(String[] args) throws\
    \ Exception {\n    System.out.println(\"Active Object Pattern, moving vehicle\"\
    );\n    var sportVehicle = new SportVehicle(\"super_sport\");\n    sportVehicle.move();\n\
    \    sportVehicle.turnOnRadio();\n    sportVehicle.turnOffRadio();\n    sportVehicle.turnOnRadio();\n\
    \    sportVehicle.stopVehicle();\n    sportVehicle.turnOffRadio();\n    TimeUnit.MILLISECONDS.sleep(400);\n\
    \    System.out.println(\"ActiveObjectName, sportVehicle moving:\" + sportVehicle.isMoving());\n\
    }\n```"
