  md: '# Exploring the model and functionality of the Java platform 31


    In addition to the JVM JIT compiler, it includes a garbage collector with various
    algorithms, a class loader, a Java memory implementation model, and a Java Native
    Interface (JNI) with libraries (as shown in Figure 2.2).


    Every JVM provider must follow the specifications. This guarantees that the bytecode
    will not only be created correctly but also executed and correctly converted into
    machine instructions. This means that different vendors may provide different
    JVM implementations with slightly different metrics or optimizations, such as
    garbage collector dynamics. These vendors include IBM, Azul, Oracle, and so on.
    The diversity of vendors can be considered one of the main moving factors for
