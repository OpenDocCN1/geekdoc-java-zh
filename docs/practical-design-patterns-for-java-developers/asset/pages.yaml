- pgno: 201
  md: '# 6 Concurrency Design Patterns


    Previous chapters on creational, structural, and behavioral patterns proposed
    a design that concerns the base code. Their main focus was on the maintainable
    base code that operates in the main application thread. In other words, the generated
    byte code is executed in a defined sequence to achieve the desired results.


    Nowadays, business requirements have shifted the application expectations described
    by the GoF book over the years more and more within a concurrent and parallel
    world. This has been succeeded by a massive improvement in hardware.


    The Java platform provides concurrency functionality under the hood from the very
    beginning. The Flight Recorder tool of Mission Control set helps collect data
    points about thread behavior and displays them visually, improving our awareness
    of application dynamics. In this chapter, we are going to examine some of the
    most common scenarios in the information technology industry:


    +   - Decoupling a method execution with an active object

    - Non-blocking tasks using an async method invocation pattern

    - Delaying execution until the previous task has been completed with the balking
    pattern

    - Providing a unique object instance with a double-checked locking pattern

    - Using purposeful thread blocking via a read-write lock pattern

    - Decoupling the execution logic with the producer-consumer pattern

    - Executing isolated tasks with the scheduler pattern

    - Effective thread utilization with the thread-pool pattern


    By the end of this chapter, we will have built a solid foundation for understanding
    the concurrency possibilities of the Java platform and starting to apply them
    effectively.'
  merge: -1
  img_proc: true
