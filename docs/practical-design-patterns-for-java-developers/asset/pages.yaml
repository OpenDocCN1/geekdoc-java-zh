  md: 'The pattern is often used in the early stages of an application because it
    is simple to refactor and provides a high level of clarity.


    Although this can introduce a bit of complexity, the pattern is easy to follow.


    # Finding it in the JDK


    The factory method pattern is often utilized in the Java Collection framework
    to construct the desired type. The framework implementations reside in the java.util.base
    module. This package contains different implementations of Set, List, and Map.
    Each implementation of the Map type is a valid member of the Java Collection framework,
    it does not inherit the Collection interface as it implements Map. Entry to store
    element tuples, keys, and values. Each implementation of Set, List, and Map provides
    overloaded of factory method to create an instance.


    The Collections class is a utility class. It contains several factory methods
    for creating specific collections, such as a list of individual items, a map,
    or a set. Another useful example of the factory method pattern usage is the Executors
    class, which can be found in the java.util.concurrent package of the java.base
    module. The Executors class defines static methods such as newFixedThreadPool.


