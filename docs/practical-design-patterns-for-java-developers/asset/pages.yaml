  md: "We intend to create a child class, Car, with a similar method named move. The\
    \ child provides slightly different functions because the Car instance moves faster\
    \ than the parent instance, Vehicle:\n\n```\npublic class Vehicle {\n    public\
    \ void move() {\n        System.out.println(\"moving...\");\n    }\n}\npublic\
    \ class Car extends Vehicle {\n    @Override\n    public void move() {\n     \
    \   System.out.println(\"moving faster.\");\n    }\n}\n```\n\nVehicle vehicle\
    \ = new Car();\nvehicle.move();\noutput: moving faster...\n\n**Example 1.2 – The\
    \ Vehicle variable holds the reference to the Car instance and the appropriate\
    \ method is executed at runtime (see Figure 1.6)\n\nWe will touch on this topic\
    \ in more detail in Chapter 3, Working with Creational Design Patterns.\n\n# Standard\
    \ features – abstraction\n\nThe last letter to cover in the abbreviation APIE\
    \ leads to the hitherto unspecified pillar of abstraction. The key to this concept\
    \ is the constant reveal of specifics or individual details to achieve the generalization\
    \ of the purpose of the object.\n\nTo get the best experience with this, let us\
    \ get into the context with the vehicle example. We do not intend to describe\
    \ a specific class model that belongs to a group of vehicles. Our goal is to find\
    \ a common functionality all types of vehicles under consideration can include\
    \ in the context of our efforts. With such knowledge, we create a suitable abstraction,\
    \ abstract class that can be inherited later when constructing a particular model\
    \ class (see Example 1.3).\n\nThis approach allows us to focus our efforts on\
    \ generalizing anding vehicle characteristics. This can have a positive impact\
    \ on code reduction and reusability."
