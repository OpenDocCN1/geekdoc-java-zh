    # GC and automatic memory management


    Although the Java platform may give the impression that the underlying memory
    is unlimited, this is not true and we examine it. So far, we have looked at how
    visibility works across multiple threads and how variables are referenced in physical
    memory. The JMM is just one part of the whole story – let''s continue the investigation.


