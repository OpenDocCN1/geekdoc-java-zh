- pgno: 55
  md: '# Exploring the model and functionality of the Java platform


    Class loaders work in sequence. The sequence is represented by a hierarchy. This
    means that every child must refer to its parents. This automatically defines the
    search order of the binary classes.


    When a class is present in RAM, the Java platform takes action to make the class
    available to the runtime environment. The Java platform runs several processes
    before the scenes to move relevant class data to other areas, such as the stack,
    heap, and so on. Let''s look at the stack area.


    # The stack area


    The stack area (Figure 2.2) is reserved for each runtime. This is a small area
    for storing method references. When a thread executes a method, one entry for
    that method is created and moved to the top of the stack. This kind of item is
    called a stack frame, which has a reference to a field of local variables, a stack
    of operands, and a constant pool to identify the operate method. The stack frame
    is removed when the method is executed normally - that is, without causing any
    exceptions. This means that primitive variables such as boolean, byte, short,
    char, int, float, and double are also stored there, so they are not visible to
    the second thread. Each thread can pass a copy, but does not share the origin.


    # The heap area


    The heap is the allocated memory where all instances of the class and array are
    located. The heap is allocated at startup and is shared among all JVM-initiated
    threads. Allocated memory is automatically recovered by the automated management
    system process, also known as Garbage Collection (GC). A local variable can contain
    a reference to objects. The referenced object is located in a heap.


    # The method area


    The method area is shared across all JVM-initiated threads. The area is allocated
    during the JVM startup. It contains runtime data for each class, such as a constant
    pool, field and method data, the code for constructors, and methods. Probably
    the most unfamiliar term mentioned is the constant pool. The constant pool is
    created during the process of loading the class into the method area. It contains
    the initial values of string and primitive constants, the names of the reference
    classes and other data needed to properly execute the loaded class, the constants
    at compile time, and field references that must be resolved at runtime.


    # Program Counter


    The Program Counter (PC) register is another important reserved area in memory.
    It contains a list of created program counters. A PC record is created at the
    beginning of each thread and contains the address of the currently executed instruction
    by a specific thread. The address points back to the method area. The only exception
    is the native method, which leaves the address undefined.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Discovering the Java Platform for Design Patterns


    # The native method stack


    A native method record is initiated for each individual thread. Its function is
    to provide access to native methods through the JNI. The JNI operates with the
    underlying system resources. Improper usage may turn into two exceptional states:


    +   - The first exception appears when a thread requires more stack space. In
    this case, a StackOverflowError is thrown and the program crashes, with a state
    higher than 1.

    - The second case represents an attempt to add more entries to the stack. The
    program results in an OutOfError error. It is caused by an attempt to dynamically
    expand already fully allocated memory. The memory is insufficient and it is not
    possible to allocate a new stack for the newly intended thread.


    We have examined all the areas required to load and execute a program and we will
    get acquainted with the areas where the data is located and how they are interconnected.
    It is slowly becoming clear that order to achieve stability and maintainability
    of the program at runtime, it is necessary to design the software in a way that
    reflects the potential limitations, as the areas correspond to the individual
    areas.


    Let''s take a look at how the Java platform provides available memory space for
    each newly created object.


    # Reviewing GC and the Java memory model


    We mentioned the JIT compiler of the JVM earlier (Figure 2.2). Just to refresh
    on the JIT compiler, it is responsible for translating the bytecode into system-specific
    native instructions. These instructions deal with the basic memory and I/O resources
    available to the program. To properly organize these instructions, the Java platform
    requires a set of rules that guarantee the program, called bytecode, must be translated
    by the JIT compiler at runtime to the same end. Because the Java platform does
    not use physical memory directly, but rather virtual and cached views, it is very
    important that the memory management is transparent. The model must provide the
    required guarantees and is known as the Java Memory Model (JMM).


    # The JMM


    The JMM describes how threads interact with each other through access to allocated
    memory – the heap (Figure 2.2), The execution of a single-threaded program may
    seem obvious because the instructions are processed in certain order without external
    influence and the thread is in isolation. In the case of a single thread (the
    main method in Example 2.2 and the main thread in Figure 2.4), the run areas are
    modified each time the instruction is executed, there is no surprise. The changes
    when the program starts multiple threads. The JMM enforces its guarantees of reliable
    Java execution. The JMM defines a set of rules for possible instruction order
    changes and execution restrictions'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Reviewing GC and the Java memory model


    caused by sharing objects in memory between different threads. The fact that the
    JMM strictly follows these rules JIT optimization without fear of code instability
    (maintaining a consistent state).


    The rules can easily reformulated and each action can be changed as long as the
    execution of the thread does not violate the program order. Basically, this means
    that the program remains in a consistent state.


    Object locks or releases are governed by the order of the program and each thread
    shares a corresponding memory view of the modified data. The memory view represents
    the portion of allocated physical memory represented by the heap because each
    object created is located inside the heap.


    One of the important guarantees of the JMM is happens-before. It states that one
    action always happens before another in order to maintain the order of program.
    To understand this rule, it is necessary to describe how system memory works and
    briefly introduce the general types of memory and how the CPU fits into the process
    of reading values and executing instructions.


    Let us start with the CPU. Each CPU contains its own instruction register. The
    machine code compiled by the JIT compiler has a reference to an available set
    of instructions. The CPU contains an internal cache to store data from the main
    RAM. The CPU communicates with the reserved RAM. One CPU can run multiple platform
    threads (depending on the type of CPU) at the same time. The result of this embodiment
    models the state of the RAM in the thread stack or heap. The dedicated RAM for
    the running Java application is copied to the CPU cache and used by the CPU registry
    (Figure 2.5).


    ![](img/238a8977164dbaa45c168c37286f3169_57_0.png)


    Figure 2.5 – CPU and memory interaction


    Those who are attentive may have already noticed that due memory differentiation,
    the program can face unpredictable difficulties by looking at the program’s memory.
    When multiple threads try to update or read specific values of variables without
    careful handling, this can result in one of the following problems:


    +   - A racing condition: This occurs when two threads attempt to access the same
    value in an unsynchronized manner.


    +   - Value update visibility: A variable that is shared between multiple threads
    has not been propagated to the main memory, so other threads get the old value.'
  merge: -1
