  md: '# 5 Behavioral Design Patterns


    Code maintainability plays a key role in applications across the spectrum of the
    industry, but it’s not fair to stop there and look no further. This means skipping
    over code behavior at runtime, which has an impact on physical and virtual memory
    usage. The primary motivation for using behavior patterns is transparent communication
    between objects, or in other words, the efficient usage of memory allocation for
    this communication. Utilizing behavioral patterns improves the flexibility of
    communication and helps complete a task with a single object or multiple objects
    exchanging information with each other. Structural design patterns can sometimes
    seem close to behavioral ones, but as we will see in each case, the purpose is
    slightly different. Let us dive deeper and learn about the following:


    +   • Limiting expensive initialization using the caching pattern

    • Handling events using the chain of responsibility pattern

    • Turning information into action with the command pattern

    • Giving meaning to the context using an interpreter pattern

    • Checking all the elements with the iterator pattern

    • Utilizing the mediator pattern for information exchange

    • Restoring the desired state with the memento pattern

    • Avoiding a null pointer exception state with the null object pattern

    • Keeping all interested parties informed by the observer pattern

    • Dealing with instance stages by the pipeline pattern

    • Changing object behavior with the state pattern

    • Using the strategy pattern to change object behavior

    • Standardizing processes with the template pattern

    • Executing code based on the object type using the visitor pattern'
