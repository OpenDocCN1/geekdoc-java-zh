  md: "# Simplifying communication with the facade pattern\n\nThe facade pattern provides\
    \ a unified interface to a set of underlying subsystems. In other words, a facade\
    \ pattern defines a higher-level interface that facilitates it. The facade pattern\
    \ was defined by GoF:\n\n# Motivation\n\nAs subsystems evolve, they often become\
    \ more complex. Most patterns, when used in smaller classes, making the subsystem\
    \ more reusable and easier to customize, but also making it difficult for all\
    \ clients to work with. The facade pattern provides a simple default view of the\
    \ subsystem that is good for most clients. Only clients who need more customizations\
    \ will need to look beyond the facade pattern.\n\n# Finding it in the JDK\n\n\
    The Java collections framework resides in the java.base module and java.util has\
    \ already been mentioned several times. It is a widely used part of the JDK, especially\
    \ for internal logic implementation. Interfaces as List, Set, Queue, Map, and\
    \ Enumeration can be considered facades of a particular implementation. We list\
    \ the List interface in more detail. It is implemented by the commonly used ArrayList\
    \ or LinkedList classes and others. Implementation specifics vary in detail, some\
    \ of which were mentioned in Chapter 2, Discovering the Java Platform for Design\
    \ Patterns (Tables 2.3, 2.4, and 2.5).\n\n# Sample code\n\nThe facade pattern\
    \ is a frequently used design pattern in software engineering and is easily presented.\
    \ Consider a case where a driver obtains their driving license for a vehicle.\
    \ The driver's license entitles them to drive both gasoline and diesel cars, and\
    \ of course, to refuel them. The driver gets both types as a reward (Example 4.10):\n\
    \n```\npublic static void main(String[] args) {\n    System.out.println(\"Pattern\
    \ Facade, vehicle types\");\n    List<Vehicle> vehicles = Arrays.asList(\n   \
    \     DieselVehicle(), new PetrolVehicle());\n    for (var vehicle: vehicles){\n\
    \        vehicle.start();\n        vehicle.refuel();\n    }\n}\n```"
