- pgno: 246
  md: '# Working in a minefield


    Gone are the days of completely monolithic applications. The current distributed
    nature of applications creates an expectation for application testing to achieve
    continuous delivery and refactoring. Although an application might contain tests
    for known issues, full integrity can be ensured. What happens if some enhancements
    are made to an application but they aren''t tested? Even a very small contribution
    to the code base can turn into a nightmare – working with such code bases can
    feel like being in a minefield. The solution to the problem is obvious: refactoring
    is required. The affected part with simplified tests to gain stability, apply
    all the knowledge learned, and slowly continue expanding the test base.


    # Ambiguous viewpoint


    In the era of microservices and distributed system design approaches, this anti-pattern
    can significantly damage the final result. The continued presence of this anti-pattern
    can result in an onion architecture approach where the separation of concerns
    and other SOLID principles become theory rather than practice. One of this anti-pattern
    would be the creation of unclear services followed by entities passing redundant
    information between layers, making the architecture unclear. It can be recognized
    in its early stages that the presented design models do not support any principles
    of SOLID application design due to incomplete information or overlapping perspectives
    in the model and potential software design. The solution may be effectively executed
    by the use of a modeling technique, with UML, to ensure visual clarity and source
    transparency.


    # Poltergeist


    This anti-pattern cannot be fully ignored. It can be recognized if you can spot
    features that are not expected but suddenly appear and disappear. This anti-pattern
    is the result of very complex abstractions and the implementation of unnecessary
    classes. There are a couple of frameworks on the Java platform that can provide
    useless functionality. We can consider Aspect and AOP as good examples as their
    usage may be directly responsible for mysterious side effects. The solution is
    to revisit and understand the class hierarchy and life cycles.


    # Dead end


    The growth of the IT industry seems to be unstoppable, as more and more approaches
    and procedures for technical improvements emerge. As such, dependencies on non-updated
    components that were previously built into a system''s architecture can be detrimental
    and be more difficult to remove than you might expect. Take, for example, Java
    version migrations, where staying with the old version is penalized not only by
    losing support but also by increasing maintenance costs. Trying to scale an application
    can also result in many challenges to do with application testability.


    Even though this dead end anti-pattern can be turned into an accepted software
    design, it is recommended to consider alternatives, because doing so may come
    with significant costs.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Conclusion


    Not all of the anti-patterns listed are completely bad (see the golden hammer
    or dead end, for example), but generally, any anti-pattern should be re-evaluated
    before it is accepted and documented.


    Java is a very powerful language and platform, not only because it allows instance
    mutation, but because it enables entities to hold their state and remain immutable.
    Special attention should be paid to the cost of the code base in the case of occurrence
    anti-patterns, because such applications must be transparent not only to software
    engineers but also to the Java platform, as we learned in Chapter 2, Discovering
    the Java Platform for Design Patterns. A concurrent environment brings many possibilities
    and performance improvements on the one hand, but on the other hand, it can cause
    the misuse of certain design patterns, such as the double-checked locking pattern,
    thanks to a poor understanding of the platform (rather than the framework that
    uses it).


    A lack of test coverage, code discipline, information, or capability can also
    contribute significantly to the occurrence of anti-patterns. From a code base
    architecture perspective, verifying a correctly implemented function can become
    an impossible task or cause additional complications for mocking or debugging.
    Generally, a transparent code architecture is one of the keys to a successful
    application. Let''s recap what we''ve learned.


    # Summary


    Knowing about anti-patterns and their identification can have a big impact on
    the viability of an application, especially when it comes to distributed systems.
    This chapter has shown that not knowing the Java platform and its tools well can
    lead to unexpected results, such as pressure on garbage collection algorithms
    running on side threads and missing out on optimization opportunities. Realizing
    the multi-threaded nature of the Java platform can lead to better code composition,
    but also proper use of immutability to enable continuous application development,
    that is, refactoring.


    Since most anti-patterns have a lack of testing as of their root causes, a test
    environment might be the best starting point to determine the occurrence of anti-patterns
    or the need for refactoring. Compiled test code does not reside in deployed code,
    which makes test code the best to start for future exploration and understanding
    your application''s behavior.


    The Java platform and other libraries change rapidly, and one of the keys to maintaining
    an application code base is the use of the open-close principle. It enables continuous
    refactoring, which is essential for the evolution of a healthy code base.


    Anti-patterns are part of the application life cycle. They are present and can
    remain in various forms for the sake of progress. It may not be worth the effort
    to remove them entirely; perhaps a better approach would be to understand them
    and get the code base to the desired state with known limitations addressed on
    an ongoing basis. Improvements will be made throughout the entire development
    cycle of the application, and writing code will be a pleasant experience with
    many challenges solved.'
  merge: -1
