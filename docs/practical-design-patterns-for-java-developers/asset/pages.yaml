- pgno: 41
  md: "The principle suggests that a low-level class should not know about high-level\
    \ classes. In the opposite direction, this means that the high-level classes,\
    \ the classes that are above, should have no information about the basic classes\
    \ at lower levels (see Example 1.10, with the SportCar class):\n\n```\npublic\
    \ interface Vehicle {}\npublic class Car implements Vehicle{}\npublic class SportCar\
    \ extends Car {}\npublic class Truck implements Vehicle {}\npublic class Bus implements\
    \ Vehicle {}\npublic class Garage {\n    private List<Vehicle> parkingSpots =\
    \ new ArrayList<>();\n    public void park(Vehicle vehicle) {\n        parkingSpots.add(vehicle);\n\
    \    }\n}\n```\n\nExample 1.10 - The garage implementation depends on vehicle\
    \ abstraction, not concrete classes in a hierarchy\n\nIt also means that the implementation\
    \ of a particular functionality should not depend on specific classes, but rather\
    \ on their abstractions (see Example 1.10, with the Garage class).\n\n# Significance\
    \ of design patterns\n\nThe previous sections introduced two complementary approaches\
    \ to software design – APIE and SOLID concepts. It can be helpful to crystallize\
    \ that having code in a transparent form can be beneficial for a variety of reasons,\
    \ because every programmer often, if not always, faces the challenge of designing\
    \ a piece of code that extends or modifies existing ones.\n\n> One man once said,\
    \ \"The way to Hell is the path of continual technical debt ignorance...\" Anything\
    \ that slows down or prevents the development of applications can be considered\
    \ a technical debt. Translated into a programming language, this would mean that\
    \ even a small part matters, if not now, later. It also follows that code readability\
    \ and purpose are crucial to application logic, as it is possible to verify various\
    \ hypotheses (for example, application operation).\n\nThe inability to perform\
