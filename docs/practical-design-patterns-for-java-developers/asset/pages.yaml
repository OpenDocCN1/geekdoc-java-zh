  md: '# Method overloading


    This type is known as static polymorphism. This means that the correct method
    is resolved during program compilation - so, at compile time. Java provides two
    types of method overloads:


    +   - Changing the input type:


    ![](img/238a8977164dbaa45c168c37286f3169_30_0.png)


    Figure 1.4 – Overloading the method of the Vehicle class by changing the input
    types


    +   - Changing the number of method arguments:


    ![](img/238a8977164dbaa45c168c37286f3169_30_1.png)


    Figure 1.5 – Overloading the method of the Vehicle class by changing the number
    of arguments


    Now, let''s look at the second type of polymorphism.


    # Method overriding


    This is sometimes called dynamic polymorphism. This means that the method performed
    is known at runtime. The overridden method is called through reference to the
    object instance of belongingness. Let us examine a simple example to illustrate
    this. Consider the Vehicle class a parent class (see Figure 1.6 and Example 1.2)
    with a method called move:


    ![](img/238a8977164dbaa45c168c37286f3169_30_2.png)


    Figure 1.6 – The relation between the overridden move methods for the parent and
    child classes'
