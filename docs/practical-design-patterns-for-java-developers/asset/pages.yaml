    For this book, installation of Java Development Kit 17+ is required. To verify
    if it is available on your system, execute the following commands:


    +   - Windows Command Prompt: java -version

    - Linux or macOS system command line: java -version


    Expected output:


    ```

    openjdk version "17" 2021-09-14

    OpenJDK Runtime Environment (build 17+35-2724)

    OpenJDK 64-Bit Server VM (build 17+35-2724, mixed mode,

    sharing)

    ```


    If you don''t have the JDK installed on your local machine, search for the appropriate
    instructions for your platform at https://dev.java/learn/getting-started-with-java/
    and finding the JDK version at https://jdk.java.net/archive/.


    To download and install Visual Studio Code, visit https://code.visualstudio.com/download.


    The following page describes and guides the use of the VSCode terminal: https://code.visualstudio.com/docs/terminal/basics.


    # Download the example code files


    You can download the example code files for this book from GitHub at https://github.com/PacktPublish/Practical-Design-Patterns-for-Java-Developers.
    If there''s an update to the code, it will be updated in the GitHub repository.'
