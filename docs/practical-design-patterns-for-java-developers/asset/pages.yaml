- pgno: 89
  md: '# Creating objects based on input with the factory method pattern


    Moore''s law stated that each year, the number of components per integrated circuit
    doubles. The law was revised in 1975 to state that the number of components doubles
    every two years. Although the debate over the law''s validity may turn controversial,
    current trends (the speed with which upgrades are needed) show that the time for
    another review is coming. It may not be necessary to speed up the hardware upgrade
    (already so fast) because it may not have any effect on the speed of processing
    information. This observation addresses the feature requirements of a software
    application, focusing on the quality and complexity of the implemented algorithms.


    It may be possible to constantly increase the rate at which an object is instantiated
    due to physical limits, such as information being physically stored in memory.
    It means that in the coming decades, we can expect an increase in pressure to
    improve the efficiency of software and design. To gain clarity of the application
    logic, it needs to be clear how the application works, and moreover, how the application
    feeds the key JVM areas, the method stack and head followed by the thread utilization
    through the stack (as shown in Figure 2.2).


    Due to current applications trends focused on mapping, transforming, managing
    a large amount of data, creational design patterns are worthy to study, understand,
    and learn how to deal with common scenarios. Although the time of the Gang of
    Four (GoF) book has passed, evolution is inevitable and the challenges remain.
    In many cases, with proper abstraction, the initial creational design patterns
    are applicable. Creating objects and class instances, and filling out the intended
    parts of the JVM, drastically influence the computation and performance costs,
    as well as enforce business logic.


    In the next section, we discuss different possibilities for object creation. We
    will also consider the recently added Java syntactic features and possibilities,
    which would reduce the source code''s verbosity. Let us start with one of the
    most common patterns.


    # Creating objects based on input with the factory method pattern


    The primary purpose of this pattern is to centralize the class''s instantiation
    of a specific type. The pattern allows the decision to create the exact class
    type to the client at runtime. The factory method design pattern was described
    in the GoF''s book.


    # Motivation


    The factory method pattern performs the separation of code and its responsibility
    for creating new instances of the class, that is, such method provides the expected
    result. The factory hides an application class hierarchy based on generics abstraction
    and introduces a common interface. Transparently separates the instantiation logic
    from the rest of the code. By introducing the common interface, the client gains
    the freedom to decide on a particular class instance at runtime.'
