  md: '# Selecting the right tool


    The next example may seem, at first glance, far from being a code smell. The Java
    platform contains very useful tools that can serve an application well if they
    are properly selected and used. A good example of the importance of careful selection
    is presented by the collection framework. Chapter 2, Discovering the Java Platform
    for Design Patterns, reviewed different aspects of commonly used collection types.
    This led us to see how a wrong selection may result in a bottleneck due to the
    consumption of underlying resources. This kind of issue may not be obvious with
    a small data amount but emerges under bigger loads and hits very specific parts
    of an application. This phenomenon can be called the busy method, or hot method
    (Figure 7:3).


