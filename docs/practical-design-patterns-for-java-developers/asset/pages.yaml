  md: "# From a basic thread to executors\n\nThe basic build element of the platform\
    \ is the thread. A thread is represented by an instance of the Thread class. The\
    \ object initiated by the new keyword still does not create a platform thread.\
    \ The object provides a method named start that requires explicit use (Example\
    \ 2.28):\n\n```\npublic class Multithreaded Program {\n    public static void\
    \ main(String[] args) {\n        var t = new Thread(() -> {\n            while(true){System.out.println(\"\
    Welcome Thread!\");}\n        });\n        t.setDaemon(true);\n        t.start();\n\
    \    }\n}\n```\n\nExample 2.28 – A simple program with a daemon thread that ends\
    \ immediately after the JVM stops\n\nAlthough it may appear that the platform\
    \ can create an unrestricted Thread instance, this kind of statement is not valid.\
    \ Each newly created thread not only takes up heap space or allocates a stack\
    \ but is also connected to system threads (processing cycles) through Java runtime\
    \ partitions (Figure 2.2). This means that uncontrolled thread startup can cause\
    \ a system error due to unavailable resources, insufficient memory, and so on.\n\
    \nThe maximum number of threads created by the Java platform may vary, as it depends\
    \ on the hardware as well as the JVM configuration. The Java Thread class must\
    \ consider a wrapper for the Runnable interface, and the thread accepts its implementation.\
    \ The Runnable interface is another functional interface and requires the implementation\
    \ of a run method. With the Java SE 8 Runnable interface, the instance can be\
    \ passed to the executor service as an anonymous function.\n\nThe Java platform\
    \ allows you to run a thread that can even survive the termination of the main\
    \ program, which in many cases, is a reluctant condition and should be considered\
    \ wisely, as it may block core resources or stay running.\n\nIt is important to\
    \ remember that the JVM only terminates when running threads are daemon ones (Example\
    \ 2.28).\n\nBecause each thread newly created by the main program is non-daemon,\
    \ by default, the sample program is run without an explicit daemon flag, the JVM\
    \ remains an active process until the base system destroys it."
