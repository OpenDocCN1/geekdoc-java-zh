    Java has been using the concept of class paths for many years. The class path
    is a special place where the Class Loader identifies its classes. The loaded classes
    are then used at runtime (denoted the Class Loaders Subsystem in Figure 2.2).


    However, this concept does not provide any guarantee for the stored package or
    class. This concept has been bad, fragile, and error-prone for many years. A good
    example is trying to package a JAR executable that contains different versions
    of libraries with similar package structures and class names. The class path does
    not differ and the class can be overwritten by different versions.


    The breakthrough with the release of Java SE 9. JSR-376, formerly the core of
    the jigsaw project (Reference 3), became a common part of the platform. JSR-376
    implements the Java Platform Module (JPMS) (Example 2.14):


    ```

    $ java -list-modules

    java.base@17

    java.compiler@17

    java.datatransfer@17

    <>

    ```


