  md: "# Delay execution until the previous task is completed with the balking pattern\n\
    \nSometimes it is required to consider the task state changes to properly execute\
    \ next task and fulfill the goal.\n\n# Motivation\n\nAlthough the instance mutability\
    \ is not a desirable state, especially not in the concurrency field the ability\
    \ to depend on the object state may come handy. The case where multiple threads\
    \ try to acquire an object to execute its critical sections can be limited by\
    \ the object state. The state can decide whether the processing time will be used\
    \ or not in order to coordinate the resources available. For example, a vehicle\
    \ cannot stop without being in motion.\n\n# Sample code\n\nConsider the example\
    \ of one Vehicle instance sharing two groups of drivers. Although there are multiple\
    \ groups, only one vehicle can operate at a time (Example 6.6):\n\n```\npublic\
    \ static void main(String[] args) throws Exception {\n    System.out.println(\"\
    Balking pattern, vehicle move\");\n\n    var vehicle = new Vehicle();\n    var\
    \ numberOfDrivers = 5;\n    var executors = Executors.newFixedThreadPool(2);\n\
    \    for (int i = 0; i < numberOfDrivers; i++) {\n        executors.submit(vehicle::drive);\n\
    \    }\n    TimeUnit.MILLISECONDS.sleep(1000);\n    executors.shutdown();\n  \
    \  System.out.println(\"Done\");\n}\n```\n\nBalking pattern, vehicle move\nVehicle\
    \ state='MOVING', moving, mills:'75'\nthread='Thread[pool-1-thread-2,5,main]'"
