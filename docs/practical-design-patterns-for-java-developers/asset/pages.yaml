- pgno: 87
  md: '# 3

    Working with Creational Design Patterns


    In recent decades, the IT community has experienced a dramatic shift from previously
    isolated systems to distributed or hybrid solutions. These approaches bring to
    light new possibilities for software development.


    Distribution solutions may appear to meet the needs of legacy systems, but the
    reality may prove otherwise. The required refactoring can cause additional problems
    due to the division of responsibilities or refactoring of tightly coupled logic
    and business rules and many unknown, hidden logics that are discovered too late
    to react.


    In this chapter, we will explore creational design patterns. These patterns play
    a vital role in the software composition. Creational design patterns are very
    useful for achieving maintainability or readability of the code base. Creational
    design patterns attempt to follow all the previously noted principles or the **don''t
    repeat yourself (DRY)** approach. Let''s dive deeper into specific patterns in
    the following:


    +   * Applying the factory method pattern

    * Instantiating additional factories in encapsulation with the abstract factory
    pattern

    * Creating a different configuration of object instances with the builder pattern

    * Avoiding a repeatedly complex configuration with the prototype pattern

    * Examining only one instance presence with the singleton pattern

    * Speedup runtime with prepared objects by using the object pool pattern

    * Controlling instances on demand with the lazy initialization pattern

    * Reducing the object instances with the dependency injection pattern


    By the end of this chapter, you will have built up a solid understanding of how
    to write maintainable code to create objects that can reside on the JVM''s heap
    or stack.'
