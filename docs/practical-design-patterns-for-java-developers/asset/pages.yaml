- pgno: 4
  md: '# Foreword


    It was November 2021. In a conversation about his developer career, a senior Java
    developer told me: "I''ve been a senior engineer for almost 20 years. I don''t
    know what to do to get beyond that level."


    That is a typical statement. The length of time varies, but far too many developers
    and engineers feel stuck in a senior position.


    Don''t get wrong, it''s not bad to be a senior!


    You may be working on great projects and using cool technologies. You are probably
    involved in solving sophisticated problems and facing deep technical challenges.


    But there may come a day that you, as the aforementioned developer, feel like
    you could be doing more in your career, have more influence in the direction of
    projects, and have independence and autonomy in your work, or you may feel more
    fulfilled by inspiring and mentoring other developers.


    Although this is something I have heard many times before, that particular instance
    got me thinking. You see, earlier that same day, I was looking at the results
    of the Java Community Process (JCP) election. Miroslav Wenger, my friend Miro,
    had just been elected to the Executive Committee of the premiere standard body
    of Java technology.


    It was impossible not to think about the parallels...


    I met Miro when we worked together on the NetBeans team at Sun Microsystems, the
    company that created Java. Like the aforementioned developer, Miro had also worked
    with Java for many years. By the time I had a long conversation with him about
    his developer career, Miro too had been a senior engineer for a number of years.
    But he didn''t stop there. Now, just a few years later, Miro has gone beyond senior:
    freelancer, speaker, open source developer, committer of the Java Mission Control
    project at OpenJDK, Java Champion, and JCP Member, and who not a book author!


    Like you don''t have to be stuck at the senior level. You can build your technical
    reputation, grow beyond senior positions, and have a larger impact on your project,
    company, and even the world.


    All this leads us to is that Miro''s book is the importance of design patterns
    in achieving this goal: growing beyond the senior level. Whether you want to become
    a manager, continue your technical career as a staff-plus engineer, or even if
    you prefer to be more independent as a freelancer or entrepreneur, you will need
    to take on more responsibilities and go beyond the code.'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'Although design patterns are directly connected to code, they are also separate
    and independent. They encapsulate proven solutions to the common challenges of
    designing quality software. Design patterns hover above a specific piece of code
    or even a specific project, and create a common vocabulary for explaining problems
    and solutions. Anyone in the business of building software should master this
    vocabulary to understand, communicate, and participate in discussions. After all,
    growing beyond senior is taking responsibility for your career. You start as senior
    in your project, and then you expand your influence by getting involved with more
    impactful techniques.


    When you master the vocabulary of design patterns, you are more equipped to go
    beyond your immediate project and get involved in other projects across your company
    and the industry. You''ll maybe even get to the point of helping define the directions
    of technology through open source projects and foundations or standards organizations,
    like Miro is doing inside the JCP.


    This book will help you do exactly that. With a broad view of design patterns
    applied to the Java ecosystem, you will see not only the concepts and the vocabulary,
    but also the real implementation and impact of design patterns in software that
    you use daily.


    One of the things always impresses me is Miro''s ability to connect software with
    real things. His open source project, RoboJ, which even won a Duke''s Choice Award,
    helps you turn your Java code into robots and drones capable of navigating the
    real world. I was delighted to see Miro making the same approach to design patterns.
    The examples in this book, using multiple vehicles and their parts, are written
    using the latest Java 17+ features, bringing the designs to life and connecting
    them to real, concrete problems.


    So, get started on your journey of building your reputation, growing your career,
    and reaching beyond the senior level. Knowing design patterns will help you fit
    in, speak the language, and participate in the most important decisions. Let the
    amazing Miro be your guide, and feel free to reach out to me if you would like
    (as Miro once did) to talk about the next steps in your career.


    Bruno Souza


    Principal Consultant, Java Champion, JCP Executive Committee Member


    @brjavaman


    https://java.mn'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# Contributors


    # About the author


    Miroslav Wengner is an engineer with a passion for resilient distributed systems
    and product quality. He is a co-author and contributor to the Robo4J project (a
    reactive soft real-time framework for robotics/IoT). Miro contributes to OpenJDK
    and participates in other open source technologies. He uses his passion for helping
    build resilient and scalable solutions.


    Miro was selected for the Java Champions Program, recognized as a JavaOne Rockstar,
    and elected to the Java Community Process (JCP) as an executive committee member.


    In addition to his day-to-day duties as a principal engineer at OpenValue, he
    shares his knowledge at conferences (JavaOne, Devoxx, and so on) and in blogs.
    Miro believes in the Java ecosystem and helps move it forward!'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# About the reviewer


    Werner Keil works in areas such as Agile, BDD, Cloud-native DevOps, Java, Java
    EE/Jakarta EE, IoT, security, and microservices, helping Global 500 clients across
    various industries and IT vendors. Having worked for over 30 years as PM, coach,
    software architect, and consultant for different sectors, Werner is an Eclipse
    and Apache Committer and a JCP member in JSRs. Werner has multiple JCP awards,
    including Member of the Year and Outstanding Spec Lead, and was recognized as
    Speaker of All Times by Java2Days, a large Java conference held in eastern Europe.
    He is an Eclipse Babel Language Champion, a project lead of Eclipse UOMo, and
    a committer member in the Jakarta EE Specification Committee.'
