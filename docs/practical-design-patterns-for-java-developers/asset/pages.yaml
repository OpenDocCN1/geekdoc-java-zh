  md: 'Although the developer does not have to bother with memory reclamation, it
    can be very useful to understand the underlying process to avoid unexpected application
    failures because system memory is limited in one way or another. The reason remains
    that even if the GC is in place, it is possible to create code that never loads
    the object, which means the application may crash with an OutOfMemory error.


    The goal of the GC process is to keep the heap nice and shiny, ready to allocate
    a new object. The heap area is divided into smaller segments as shown in Figure
    2.6:


    ![](img/238a8977164dbaa45c168c37286f3169_59_0.png)


    Figure 2.6 – Simplified heap structure divided into promotion segments


    It is a known fact that most objects will be allocated and placed in Eden''s memory
    and will not survive the second round of cleanup. After performing Minor GC, all
    surviving objects are moved to the surviving spaces (denoted by S0 and S1). The
    GC also checks the S0 and S1 fields and spreads them among the others when one
    of the survival sites may be empty. The object survived; many GCs have been moved
    to the Old generation. The heap also contains a permanent section. The permanent
    section contains the metadata required by the JVM to describe classes, static
    methods, and private variables, and is populated at runtime. This area was formerly
    known as the Permanent generation (Permgen). It was separated from the main heap
    memory, was not loaded, and had to be configured. This disadvantage led to application
    instability due to insufficient memory requirements. Java SE 8 introduced MetSpace,
    which replaced the Permgen concept. MetSpace solved the problem of space configuration
    because it can grow automatically and in addition, garbage can be collected.


    GC works in two steps, described as Minor GC and Major GC. These steps are a proposal
    for building on the basis of durability – that is, long-term references:


    +   - **Minor GC**: This happens when there is no reference to the object, the
    object is marked as unreachable, the young generation is reclaimed, and the memory
    can be kept.

    - **Major/Full GC**: An object that has survived Minor GCs and Major GCs have
    been moved to an Old generation heap. After a long time, does not refer to any
    other object, no other object refers to it, and it is ready to be deleted. Full
    GC is less common than Minor GC and there is a long pause (stop-the-world).'
