    \ explore command responses in more detail.\n\n# Turning information into action\
    \ with the command pattern\n\nThe command pattern is sometimes known as action.\
    \ The command pattern encapsulates the triggered event as an object that allows\
    \ the client to act. This pattern was early identified and described in the GoF's\
    \ book.\n\n# Motivation\n\nThe command pattern dictates that instances of the\
    \ command interface perform which actions on the receiver client. A command object\
    \ can be parameterized to define an action in greater detail. The commands can\
    \ include a callback function to notify others of the occurrence of an event.\
    \ Sometimes, commands can be thought of as object-oriented replacements for callback\
    \ functions. A newly created command object can have different dynamics depending\
    \ on the event that initiated it. The client can react to it using an already\
    \ scheduled scenario.\n\n# Finding it in the JDK\n\nNice examples are provided\
    \ in the JDK by the Callable and Runnable interfaces from the java.base module\
    \ and the java.util.concurrent package. The implementation of each interface is\
    \ scheduled for execution based on a known scenario.\n\nOther uses of the command\
    \ pattern can be found in the java.desktop module in the javax.swing package and\
    \ a class implementing the Action interface.\n\n# Sample code\n\nThe following\
