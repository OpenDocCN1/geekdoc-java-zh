  md: "# Conclusion\n\nThe proxy design pattern brings many advantages to the source\
    \ code, for example, the implementation can be replaced at runtime. In addition\
    \ to being used to fully control access to the actual instance, it can be used\
    \ for lazy initialization, as we saw in Example 4.23. The proxy has its legitimate\
    \ place in driver implementation or network connections as it naturally enforces\
    \ only logging possibilities but also code separation through the segregation\
    \ of the interfaces and other SOLID principles. It is quite useful to consider\
    \ when an application requires I/O operations.\n\nJava as a language does not\
    \ support multiple inheritance, but it is still possible to achieve. Let us examine\
    \ how in the next section.\n\n# Discovering multiple inheritance in Java with\
    \ the twin\n\nThis pattern allows you to combine functions of objects that tend\
    \ to be used together, which is a common paradigm used by languages without multiple\
    \ inheritance support.\n\n# Motivation\n\nThe twin pattern presents the possibility\
    \ to implement multiple inheritance in Java. Multiple inheritance is not a supported\
    \ concept as it may lead to compiler inconsistency, known as the diamond problem.\
    \ The diamond problem defines a state through class abstraction where the compiler\
    \ may turn out to be inconsistent. This state is due to the lack of information\
    \ due to multiple abstract classes. The compiler does not have enough information\
    \ about which methods execute.\n\n# Sample code\n\nThis pattern is not supported\
    \ by the platform and is rarely required for development. For these reasons, the\
    \ pattern likely does not exist inside the JDK, as described. However, let us\
    \ examine a possible example to better understand the pattern. Imagine the vehicle\
    \ inheritance sequence. During initiation, the engine and brake need to be initiated.\
    \ In other words, when the engine is initiated, the brakes must be initiated too,\
    \ and the other way around (Example 4.24):\n\n```\npublic static void main(String[]\
    \ args) {\n    System.out.println(\"Pattern Twin, vehicle initiation sequence\"\
    );\n\n    var vehicleBrakes1 = new VehicleBrakes();\n    var vehicleEnginel1 =\
    \ new VehicleEngine();\n    vehicleBrakes1.setEngine(vehicleEngine1);\nn}\n```"
