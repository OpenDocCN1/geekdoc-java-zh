    | java.util.Arrays.copyOfOf(Object[], int) | 181 |

    | java.lang.Integer.valueOf(int) | 100 |


    Figure 7.3 – The computation is limited by busy method execution


    Here the work of the application is centralized with one extremely busy method
    execution.

    Java Flight Recorder (JFR) has highlighted the issue. The fix became trivial because
    it rethought the use of the collection type. More specifically, it took the approach
    of accessing stored elements and replacing the O (n) time complexity for ArrayList
    with the O (1) time complexity for HashMap instances (Figure 7:4).


