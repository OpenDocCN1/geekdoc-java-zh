  md: "# Motivation\n\nThe read-write locking pattern introduces natural exclusivity\
    \ for lock acquisition. This context is used to differentiate the whether the\
    \ critical section can be executed. In other words, the write action takes precedence\
    \ by nature reading, as the goal of any reader is to get the most accurate and\
    \ up-to-date value possible. Under the hood, this means that all readers are blocked\
    \ when the writer thread is modifying data and unblocked when the writer completes\
    \ its task.\n\n# Sample code\n\nSuppose multiple sensors inside a vehicle require\
    \ accurate information about the temperature value, but there is only one temperature\
    \ device capable of updating the temperature value (Example 6.10):\n\n```\npublic\
    \ static void main(String[] args) throws Exception {\n    System.out.println(\"\
    Read-Write Lock pattern, writing and reading sensor values\");\n    ReentrantReadWriteLock\
    \ readWriteLock = new\n        ReentrantReadWriteLock();\n    var sensor = new\
    \ Sensor(readWriteLock.readLock(),\n        readWriteLock.writeLock());\n    var\
    \ sensorWriter = new SensorWriter(\"writer-1\",\n        sensor);\n    var writerThread\
    \ = getWriterThread(sensorWriter);\n\n    ExecutorService executor = Executors.newFixedThreadPool(\n\
    \        (NUMBER_READERS);\n    var readers = IntStream.range(0, NUMBER_READERS)\n\
    \        .map(i -> new Sensor(\"reader-\"\n        + i, sensor, CYCLES_READERS)).toList();\n\
    \    readers.forEach(executor::submit);\n    writerThread.start();\n    executor.shutdown();\n\
    }\n```\n\nHere's the output:\n\n> Read-Write Lock pattern, writing and reading\
    \ sensor values\nSensorRead read, type:'reader-2', value:'50',\nthread:'pool-1-thread-3'"
