    Technical debt is an interesting concept because it requires the context of the
    software application and its goal in order to understand it. Technical debt contains
    some properties that may not be obvious at first glance, but may lead to a serious
    application bottleneck. Let''s imagine a vehicle production line as a collection
    of multiple processes running under varying dynamics in parallel. The production
    line should deliver the expected result in the form of a vehicle. If there were
    an accumulation of bottlenecks, the result would not be achieved. This abstraction
    of a vehicle'
