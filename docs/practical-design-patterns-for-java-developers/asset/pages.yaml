- pgno: 28
  md: "# Examining OOP and APIE\n\nIn the previous section, we learned how a program\
    \ written in one of the high-level languages is converted into machine instructions\
    \ that are processed by the CPU. The high-level language provides a framework\
    \ for expressing the desired ideas by following the details of the language implementation.\
    \ Such languages commonly provide many neat constructions or statements that do\
    \ not limit the imagination. In object-oriented programming (OOP) language, the\
    \ representation of the core carrier is presented by the concept of the object.\
    \ This book focuses on the Java language. Java is a fully object-oriented language\
    \ with additional features. What does object-oriented language mean exactly? In\
    \ computer science, this means that the program focuses on the concept of classes,\
    \ where instances of these classes represent an object. Next, we will repeat the\
    \ importance of the OOP paradigm and with some basic concepts.\n\nThese terms\
    \ can be expressed by the abbreviation of abstraction, polymorphism, inheritance,\
    \ and encapsulation (APIE). The terms APIE indicate the four pillars of OOP languages.\
    \ Let's examine each word in reverse order – so, EIPA. The motivation is to bring\
    \ more clarity to our understanding of the concept of OOP.\n\n# Only exposing\
    \ what's required – encapsulation\n\nThe first reverse order is encapsulation\
    \ – let's start with it. OOP languages, including Java, work with the concept\
    \ of classes. Imagine that class is a vehicle. The class provides all the fields\
    \ that can be statically typed or object-specific – that is, initiated after an\
    \ object is instantiated in the allocated memory. The concept is similar with\
    \ respect to class or object methods. The method may belong to a class or its\
    \ instance – in the considered example, to a vehicle. Any method can work over\
    \ an object or class field and change the internal state of the vehicle or the\
    \ field values (see Example 1.1):\n\n```\npublic class Vehicle {\n    private\
    \ boolean moving;\n    public void move() {\n        this.moving = true;\n   \
    \     System.out.println(\"moving...\");\n    }\n\n    public void stop() {\n\
    \        this.moving = false;\n        System.out.println(\"stopped...\");\n \
    \   }\nn\n```\n\nExample 1.1 – The Vehicle class hides an internal state (moving)"
  merge: -1
  img_proc: true
- pgno: 29
  md: 'We can apply encapsulation to the example of a vehicle. We imagine a real vehicle
    – only one. In such an imaginary vehicle, all internal elements and internal functions
    remain hidden from the driver. It only exposes the functionality it serves, such
    as the steering wheel, which the driver can control. It is the general principle
    of encapsulation. The state of an instance can be created or updated through exposed
    methods or fields; everything else is hidden from the outside world. It is a good
    practice to use methods to modify the inner array or arrays of an instance. But
    we will repeat that later in this book. So far, it''s just a good thing.


    # Inevitable evolution – inheritance


    In the previous section, an instance of an imaginary vehicle class was created.
    We encapsulated all the functions that should not be exposed to the driver. This
    means the driver may not know the engine works, how to use it.


    This section is devoted to the property of inheritance, which we will demonstrate
    in the following example. Assume that the vehicle''s engine is broken. How can
    we replace it? The goal is to replace the current one with a functional one. An
    engine that works this way may not necessarily be the same, especially if the
    vehicle model has old parts that are not available on the market.


    What do we derive from all the attributes and functions needed to create a new
    engine. Concerning the class, the new replacement module will be a child in the
    class hierarchy.


    Although the engine will not be a perfect replica and does not have the same object
    identifier, it will match all the parent properties.


    With that, we have described the second pillar of inheritance in OOP – the ability
    to create a new class above the existing subclass. However, software designers
    should be wary of the fourth pillar, encapsulation, and any violations caused
    by a subclass depending on the implementation details of its superclass.


    # Behavior on demand – polymorphism


    The third concept is polymorphism. With a little imagination, this can be understood
    as "many forms.\ So, what does that mean?


    Given the vehicle described previously, it could be defined as the ability to
    perform a particular action in many ways. This would mean, in the context of a
    vehicle, that the movement of the other method, move, could happen differently
    based on the inputs or the state of the instance.


    Java allows for two types of polymorphism, both of which differ in their runtime
    behavior. We will discuss both in detail.'
  merge: -1
  img_proc: true
