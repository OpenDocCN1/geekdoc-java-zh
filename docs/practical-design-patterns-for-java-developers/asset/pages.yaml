  md: '# Conclusion


    The prototype pattern is useful for dynamic loading or to avoid increasing the
    complexity of the code by introducing unnecessary abstractions, known as subclassing.
    This does not mean that clones do not need to implement the interface, but cloning
    can reduce exposure requirements or make the instantiation process too complicated.
    A prototype properly encapsulates the complicated logic of an instance that is
    not meant to be turned or modified. Software designers should be aware of the
    possibility that such a base can easily change to legacy code. On the other hand,
    a pattern can defer and support iterative changes to the code base.


    Multiple instances of an object are not always desirable and are sometimes undesirable.
    In the next section, we''ll learn how to guarantee the presence of only one unique
    class instance at runtime.


    # Ensuring only one instance with the singleton pattern


    A singleton object provides transparent and global access to its instances and
    ensures that only one instance is present. The singleton pattern was identified
    very early by industry requirements and is mentioned in the GoF''s book.


    # Motivation


    A client or application wants to ensure that only one instance is present at runtime.
    An application may require multiple object instances that all use one unique resource.
    This fact introduces instability because any of these objects can access such
    a resource. A singleton guarantees only one instance that provides a global access
    point to all clients within the desired scope of the JVM.


    # Finding it in the JDK


    The best example of a singleton is a running Java application, or more precisely,
    the runtime. It is found in the Runtime class and its method, getRuntime, resides
    in the java.lang package of the java.base module. The method returns an object
    associated with the current Java application. The runtime instance allows the
    client to add, for example, shutdown hooks to the running application.


    # Sample code


    The following example suggests an application that only runs one car with its
    engine (Figure 3.6):'
