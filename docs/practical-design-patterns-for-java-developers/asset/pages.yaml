  md: '# Applying Structural Design Patterns


    pattern. To simplify communication between objects was presented by the facade
    pattern, followed by the filter pattern, which allows us to select only the instances
    we want. We learned how the flyweight design pattern allows us to re-use already
    created runtime instances, and the approach of processing the information was
    presented by the front-controller pattern, that the client can only respond to
    valid requests. We discovered the marker pattern allows a client to handle a specific
    group of objects in a unique way. We explored the possibility of modularizing
    the code base by implementing the module pattern. We saw how to use the proxy
    pattern to let a client indirectly gain control of an object without being aware
    of its implementation details, and saw how to use the twin pattern to implement
    multiple inheritance in Java even though the language does not support it.


    With the knowledge gained creatational and structural design patterns, the underlying
    source code structure is well organized and open to continuous application development.
    The next chapter examines the behavioral design patterns that help organize communication
    and responsibilities between targeted instances.


