  md: "# Understanding Java concurrency\n\nIt allows you to manage uncontrolled thread\
    \ creation and gives the software designer control over the program's resources\
    \ and behavior. Java SE 5 introduced the ExecutorService and ThreadFactory interfaces,\
    \ where multiple implementations show using a similarly named cre pattern factory.\
    \ The ThreadFactory interface contains only one newThread method, which returns\
    \ a Thread instance. This method logic can accommodate the creation of a new thread\
    \ and set the group, priority, and daemon flag. It also eliminates the number\
    \ of new threads created. ThreadFactory can be served by ExecutorService (Example\
    \ 2.30).\n\nSome of the most used executor static methods are as follows:\n\n\
    +   * newSingleThreadExecutor()\n* newSingleThreadExecutor(ThreadFactory threadFactory)\n\
    * newCachedThreadPool()\n* newCachedThreadPool(ThreadFactory threadFactory)\n\n\
    Java SE 5 came up with a concept for the thread, a Future interface with a generic\
    \ type of <T>. The Future interface can be considered an asynchronous calculation\
    \ that provides a result.\n\nThe Java platform provides two different interfaces\
    \ that can carry thread logic.\n\n# Executing tasks\n\nThe Java platform provides\
    \ a thread concept from the beginning represented by the Runnable interface and\
    \ the Thread class (Example 2.29):\n\n```\nExecutorService executorService =\n\
    Executors.newSingleThreadExecutor();\nvar runnable = new Runnable() {\n    @Override\n\
    \    public void run() {\n        System.out.println(\"Welcome Runnable\");\n\
    \    }\n};\nexecutorService.execute(runnable);\nexecutorService.execute(() ->\
    \ System.out.println(\"Welcome Runnable\")););\n```\n\nExample 2.29 – Different\
    \ approaches to providing the Runnable interface implementation to the executor\
    \ service, implementation, and anonymous class"
