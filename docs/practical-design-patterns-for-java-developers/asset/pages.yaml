  md: '# 2

    Discovering the Java Platform for Design Patterns


    Many years ago, motivated by the lack of a suitable Application Programming Interface
    (API) design, something extraordinary began to happen. In the early days of using
    the World Wide Web (WWW), the direction of application development was a bit shrouded
    in fog. In one direction, there was a strong need in the industry to process a
    large number of database transactions or develop specific proprietary hardware
    and software. On the other hand, it was not clear what kind of applications might
    be needed to move the demand forward and how such an application should be maintained.


    In this chapter, we will prepare the ground for understanding the value of design
    patterns from a memory utilization perspective. We will do so by covering the
    following topics:


    +   * The Rise of Java and brief historical facts

    * How the Java platform works under the hood

    * Exploring Java memory area allocation and management

    * How allocated heap is maintained with garbage collection

    * Running the first program on the platform

    * The threading nature of the Java platform

    * Examining the core Java APIs and their values for software design

    * Exploring the importance of the Java Platform Module System

    * Discovering new helpful platform enhancements

    * Introducing Java concurrency'
