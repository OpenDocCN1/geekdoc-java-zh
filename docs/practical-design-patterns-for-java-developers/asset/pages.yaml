- pgno: 26
  md: '# Code – symbols to program


    Human speech is fruitful, rich, colorful, and way beyond the words themselves
    may express. Nouns, verbs, and adjectives for precisely expressing a moment or
    action can be used. In contrast, machines do not understand the complex constructions
    or expressions that humans are able to create.


    Machine language is limited, well-defined, extremely specific, and simplified.
    Its goal is to provide the precise expression of intent for which it is designed.
    This contrasts with human language whose purpose is just communication and not
    necessarily with specifics.


    A machine’s intent can be expressed as a defined instruction or a set of them.
    This means that machines understand the instructions. These instructions must
    be available to the machine in some form at the time of execution. Each machine
    normally has a set of instructions. Based on this kind of instruction set, machines
    can perform the required instructions, as shown here:


    ![](img/238a8977164dbaa45c168c37286f3169_26_0.png)


    Figure 1.1 – A simplified instruction cycle inside the CPU (instruction is taken
    from memory and the result is stored)


    Let explore one individual instruction. The instruction can be understood as a
    command given to the processor. The processor is the heart of the machine, or
    the center of the ordering and executing of processes. A machine may contain one
    or more of them. It depends on its design, but in any case, there is always one
    that takes the lead. For further simplification, we will consider only one – that
    is, a system that has one central processing unit (CPU) dedicated to executing
    a program.


    A CPU is a device that executes instructions using a computer program. The CPU
    must contain such an instruction, as shown in the previous diagram, to process
    the requested action.


    Because instructions can take different forms depending on the CPU, there is no
    defined standard. This promotes different CPU platforms, which is not necessarily
    a bad thing and contributes to evolution. However, the fact remains that the instructions
    are not easy for people to read.


    We have stated that machines can perform instruction collection, ideally as a
    continuous flow. The flow of instructions can be simplified as a queue in memory,
    where one instruction goes in and the other leaves. The CPU plays the role of
    an interpreter who works with this memory cyclically (as we saw in Figure 1.1).
    Okay, so the CPU interprets, but as instructions are added to the memory, where
    do they come from, and how can such a stream be created?'
