- pgno: 27
  md: '# Code – from symbols to program


    Let us gather some thoughts. Machine instructions, in most cases, originate from
    a compiler.


    What is a compiler? The compiler can be viewed as a CPU or a platform-specific
    program that translates text into target actions. The text we use to call the
    program and the result could be named machine code. The following diagram illustrates
    this:


    ![](img/238a8977164dbaa45c168c37286f3169_27_0.png)


    Figure 1.2 – A simplified platform-specific flow from the source code through
    the compiler program to its resultant action


    Machine code is a low-level language that the machine understands and consists
    of language instructions that are processed sequentially (see Figure 1.1); the
    program was compiled, executed, and run.


    In the case of Java, there is no machine code:


    ![](img/238a8977164dbaa45c168c37286f3169_27_1.png)


    Figure 1.3 – A simplified flow for the Java program through the compiler to its
    platform execution


    The source code is compiled by the Java compiler into bytecode. The bytecode is
    running a Java virtual machine (JVM) (see Figure 1.3). In this situation, the
    JVM plays the role of the interface between the bytecode and the actual instructions
    that are executed on the CPU. The JVM emulates bytecode instruction. It does this
    using the just-in-time (JIT) compiler that is part of the JVM. The JIT compiler
    translates bytecode into native processor instructions. The JVM is a platform-specific
    interpreter, analogous to directly compiled code (see Figure 1.2). The JVM also
    provides features such as memory management and garbage collection, which makes
    the Java platform so powerful. All these features allow developers to write code,
    compile it into bytecode, and run a supported platform – known as write once,
    run anywhere (WORA).


    In the context of the previous explanation, Java is a high-level language that
    is translated to a low level. Java provides a strong abstraction from the details
    of computer functionality. It allows programmers to create simpler programs for
    complex challenges.


    At this point, we begin our journey of jointly exploring standardized solutions.
    Later in the book, we will review how to create code that is maintainable and
    extensible with fewer memory requirements. Together, we will discuss different
    types of design patterns that can help us to make our daily work understandable,
    transparent, and more fun.'
