  md: "This means that classes of a similar type can act analogously and replace the\
    \ original class. This statement was first mentioned during a keynote address\
    \ by Barbara Liskov in 1988 (see Reference 3). The conference focused on data\
    \ abstraction and hierarchy. The statement was based on the idea of substitutability\
    \ of classes and interface segregation. Let's look at interface segregation next.\n\
    \n# The interface segregation principle (ISP)\n\nThis principle states that no\
    \ instance of a class should be forced to depend on methods that are not used\
    \ or in their abstractions. It also provides instructions on how to structure\
    \ interfaces or abstract classes. In other words, how to divide the intended methods\
    \ into smaller, more specific entities. The client could use these entities transparently.\
    \ To point out a malicious implementation, consider Car and Bike of the Vehicle\
    \ interface, which shares all the abstract methods (see Example 1.8):\n\n```\n\
    public interface Vehicle {\n    void setMove(boolean moving);\n    boolean engineOn();\n\
    \    boolean pedalsMove();\n}\n\npublic class Bike implements Vehicle {\n    ...\n\
    \    public boolean engineOn() {\n        throw new IllegalStateException(\"not\
    \ supported\");\n    }\n    ...\n    public class Car implements Vehicle {\n \
    \   ...\n    public boolean pedalsMove() {\n        throw new IllegalStateException(\"\
    not supported\");\n    }\n}\n-- usage ---\nprivate static void printIsMoving(Vehicle\
    \ v) {\n    if (v instanceof Car) {\n        System.out.println(v.engineOn());\n\
    \    }\n    if (v instanceof Bike) {\n        System.out.println(v.pedalsMove());\n\
    \    }\n}\n```\n\n**Example 1.8** – Various implementations of inherited method\
    \ abstraction"
