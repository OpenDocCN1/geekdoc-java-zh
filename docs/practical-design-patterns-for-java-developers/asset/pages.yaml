    # What anti-patterns are and how to identify them


    One might define an anti-pattern as the exact opposite of a good design pattern
    or good practice. Though that might seem like the bottom line, it ignores the
    context and sequence of actions that led to a software practice called an anti-pattern.
    In other words, it does not explain why an anti-pattern is a collection of highly
    risky, ineffective, and counterproductive steps. It is important to understand
    these steps as allow creating a repeatable process to obtain a similar result,
    just to verify the ambiguity. The bottom line is that these steps may limit the
    ability to proactively address the issues. Let us dive a bit deeper into the theory.


    # Theoretical principles challenges


    Anti-patterns can naturally appear during software development due to multiple
    reasons. They may be due to a shift in business logic, technology migration, or
    missing information. The fact remains that anti-patterns do occur and, simply,
    put be part of the development process due to team size, communication issues,
    and more.


    The key is how to identify them. In Chapter 1, Getting into Software Design Patterns,
    we touched the negative impact of violating the API and SOLID design principles;
    this can be a symptom that be a signal to consider a source code refactoring response.
    Another phenomenon would be not respecting the CAP theorem (Consistency, Availability,
    and Partition tolerance). Development time may have been invested in trying to
    achieve all properties at the same time, which is impossible. Such attempts could
    be a strong signal to rethink the development strategies.


    Although principles of APIE and SOLID tend to be considered common knowledge,
    the truth is different, especially in the area of creating agile practices and
    completing tasks. Development can tend to create continuous technical debt. The
    word continuous is important because the accumulation of such debt may lead to
    very unpleasant consequences.


