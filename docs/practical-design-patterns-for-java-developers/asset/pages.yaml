    # Lava flow


    Clean code is sometimes used as a deep term. Nowadays, it is becoming a common
    practice to push a proof-of-concept application directly into production without
    further thought. This anti-pattern arises when incompatibility or extensibility
    problems come to part. The fact that a proof of concept verified a possible solution
    does not guarantee that it was prepared for production according to development
    principles and techniques. This anti-pattern can be identified by the occurrences
    of long implementation classes whose purpose have been lost over time, yet everyone
    is afraid to remove them because it might affect the system. This anti-pattern
    was named after lava, a hot liquid that flows down a volcano until it catches
    fire. In the era of microservices, distributed systems, and cloud solutions, an
    example of shared functionalities, such as libraries or solutions, can be considered.
    When such a pattern emerges in the development process, it may a good time to
    re-evaluate the design of the code base, perhaps draw diagrams, and apply conclusions
    to mitigate the possibility of a fire.


    # Functional decomposition


    The functional decomposition anti-pattern may seem outdated due to the use of
    modern frameworks and the fact that the anti-pattern is better known in the field
    of procedural languages. The reality may be slightly different, many legacy systems
    were migrated without sufficient understanding of the code base and business logic.
    Identifying the anti-pattern is trivial, as it''s impossible to notice a code
    base containing many classes with a single responsibility, a lack of abstraction,
    and big cohesion. The root cause of this anti-pattern may be a lack of understanding
    of the basic principles of object-oriented programming or a misunderstanding of
    the application''s goal. The solution is to refactor the code base according to
    the required abstraction level while keeping in mind programming principles.


    # Boat anchor


    Sometimes an application or a newly developed piece of software may inherit an
    outdated abstraction that becomes unnecessary. This abstraction can turn into
    a bottleneck not only because it requires maintenance but also because it can
    be easily replicated across a code base. The worst'
