    # Conclusion


    The example (from Figure 5.1) showed that implementing caching is simple. It may
    be a good idea to consider when clients require repeated access to the same set
    of elements. This can have a positive impact on performance.


    Some of these elements may be responsible for the program''s runtime behavior.
    Let''s dive deeper into this in the next section.


    # Handling events using the chain of responsibility pattern


    The chain of responsibility pattern helps avoid tiring the handler logic to the
    sensor that fired the event. This pattern was identified by the GoF''s book.


    # Motivation


    The program receives an initial triggered event. Each chained handler decides
    whether to process the request or it on to the next handler without responding.
    A pattern can consist of command objects that are produced by a series of handler
    objects. Some handlers can act as dispatchers, capable of sending commands in
    different directions to form a responsibility tree.


    The chain of responsibility pattern allows you to build a chain of implementations
    in which a certain action is performed before or after calling the next handler
    in the chain.


    # Finding it in the JDK


    The java.logging module includes the java.util.logging package, which contains
    a Logger class, intended for recording application message messages. Loggers can
    be chained and the logged message is only processed by the Logger instances.


    Another example provided in the JDK is the DirectoryStream class, which works
    with the java.base module and is located in the java.nio package. This class is
    responsible for iterating over entire directories and contains a nested filter
    interface. The interface provides an accept method. The actual representation
    of the chained filter differentiates depending on whether the directory is to
    be processed or excluded.'
