    With a general idea of the flow, let''s start loading classes into memory.


    # The class-loader loader area


    The class loader subsystem is located in Random-Access Memory (RAM) and is responsible
    for loading classes into memory. The load step consists of the sub-line steps
    and the first run of the class at runtime. Linking is the process of preparing
    a class or interface for a runtime environment, which may include internal dependencies,
    etc. The platform provides internal functions or customized ones; to manage all
    capabilities, the platform provides dedicated class loaders:


    +   - **Bootstrap loader**: Responsible for loading the default platform classes.
    It is provided by JVM and loads classes from the BOOTPATH (property).

    - **Extension class loader**: Loads additional libraries from the lib/ext directory,
    which is part of the JRE installation.

    - **System class loader**: The default application class loader that refers to
    the main method and runs the classes from the served class or module path.

    - **User-defined class loaders**: These are instances of ClassLoader and may be
    used to define custom classes dynamically loading processes to the JVM. It is
    possible to use a user-defined class destination. Classes can reside on the network,
    encrypted inside files, or be downloaded across the network and generated on the
    fly.'
