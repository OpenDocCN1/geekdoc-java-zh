    # Avoiding a null pointer exception state with the null object pattern


    The null object pattern provides a way to gracefully deal with an unidentified
    object and not cause unexpected or undefined program behavior.


    # Motivation


    Instead of using the Java construct to indicate the absence of an object, consider
    introducing the Null object pattern. A null object is considered to belong to
    a specific family of objects. The object implements the expected interface, but
    implementing its methods does not cause any actions.'
  merge: -1
  img_proc: true
