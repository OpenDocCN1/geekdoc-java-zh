  md: "# Conclusion\n\nThe talking pattern is easy to implement in the Java platform.\
    \ It is important to keep the Java memory model in mind to properly handle object\
    \ state volatility. It may be particularly useful to consider using atomic types\
    \ (AtomicInteger and AtomicBoolean, for example), which automatically comes with\
    \ a happens-before guarantee. This guarantee is part of the Java memory model\
    \ to maintain memory consistency across the interacting threads, as we learned\
    \ in Chapter 2, Discovering the Java Platform for Design Patterns. Another option\
    \ to consider is the volatile keyword, which comes with a guarantee of equal-visibility\
    \ across threads.\n\nThe next section examines guaranteed instance uniqueness\
    \ – let’s roll.\n\n# Providing a unique object instance with a double-checked\
    \ locking pattern\n\nThe double-checked locking pattern solves the problem of\
    \ an application requiring only one instance of a particular class at runtime.\n\
    \n# Motivation\n\nThe Java platform is multi-threaded by default, as we learned\
    \ in Chapter 2, Discovering the Java Platform for Design Patterns. It’s not just\
    \ the garbage collection threads that take care of the main program lifecycle.\
    \ Different frameworks introduce additional thread models, which may have an unintended\
    \ impact on a class institution’s process. A double-checked locking pattern ensures\
    \ that only one instance of a class is present at runtime. This state can be challenging\
    \ in a multi-threaded environment, as may depend on its implementation.\n\n# Sample\
    \ code\n\nLet’s use a simple Vehicle instance to demonstrate the importance of\
    \ a double-checked locking pattern in a multithreaded environment. The example\
    \ presents two different implementations of the singleton pattern. VehicleSingleton\
    \ is expected to keep its promise to multiple threads accessing the GetInstance\
    \ method (Example 6.8):\n\n```\npublic static void main(String[] args) {\n   \
    \ System.out.println(\"Double checked locking pattern,\n        only one vehicle\"\
    );\n\n    var amount = 5;\n    ExecutorService executor = Executors\n        .newFixedThreadPool(amount);\n\
    \    System.out.println(\"Number of executors:\" + amount);\n}\n```"
