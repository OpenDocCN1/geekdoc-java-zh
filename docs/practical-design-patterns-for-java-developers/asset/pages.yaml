    # Conclusion


    A thread-pool pattern can provide another acceptable way to introduce concurrency
    into an application. It not only supports the execution of class types that inherit
    the Runnable interface but also the Callable interface. Using a Callable interface
    allows you to create a result through a Future interface. The result of executing
    a Callable instance into an instance of the Future type is that the execution
    of the critical section is done asynchronously by the controlling thread. In other
    words, the time required to produce a result is not known.


    The thread-pool pattern is also another SOLID approach to properly structuring
    your code base to ensure maintainability and resource utilization.


    Let us briefly summarize the lessons learned in this chapter.'
