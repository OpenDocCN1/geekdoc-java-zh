  md: '# Summary


    Creational design patterns play a very important role in software application
    design. They help in transparently object instantiation logic with respect to
    basic object-oriented principles. The examples showed that each pattern may have
    multiple implementations. This is because the implementation decision may depend
    on other software architecture factors. These factors take into account JVM heap
    stack usage, application runtime, and business logic encapsulation.


    Using design patterns implicitly for promoting a DRY approach, which has a positive
    impact on development and reduces code base pollution. The application becomes
    testable and software architects have a framework to confirm the presence of expected
    objects inside the JVM. This becomes particularly important when a code issue
    is identified, which could be an exception or unexpected results. A well-created
    code base helps to get into the root cause fast, maybe even without the necessity
    to debug.


    In this chapter, we have learned how to create an object of a particular family
    using the transparent factory pattern method. The abstract factory pattern showed
    the encapsulated way of creating different factories. Not all the required information
    is always present at one moment, and the builder pattern introduced a way to deal
    with a challenge of composing complex objects. The prototype pattern showed the
    approach of not exposing the logic to the client, the singleton pattern ensured
    the presence of a single instance at runtime. The object pool design revealed
    how to improve memory usage at runtime, while the lazy instantiation pattern showed
    how to defer an object until it is needed. The dependency injection pattern demonstrated
    the reusability of instances when creating new objects.


    Creational design patterns not only bring clarity to the creation of new instances
    but, in many cases, they can also contribute to the decision about the correct
    structure of the code (a code structure that reflects the required business logic).
    The last three mentioned patterns not only the issue of creating objects but also
    their reusability for efficient memory usage. The examples we showed how creational
    patterns can be implemented and we learned about the differences and purposes
    of each of them.


    The next chapter will discuss the structure design pattern. This pattern will
    help us organize our code based on the most common scenarios. Let''s move on.


    # Questions


    +   1. What challenges do the creational design patterns solve?

    2. Which patterns may be helpful to reduce object initiation costs?

    3. What is the key reason to utilize the singleton design pattern?

    4. Which pattern helps to reduce constructor pollution?

    5. How do you hide complex instantiation logic from the client?'
