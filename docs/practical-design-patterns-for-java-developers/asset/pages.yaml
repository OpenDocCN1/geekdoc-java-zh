  md: '# Technical requirements


    You can find the code files for this chapter on GitHub at https://github.com/PacktPublishing/Practical-Design-Patterns-for-Java-Developers/tree/main/Chapter03.


    # It all starts with a class that becomes an object


    In Java, every object must first be described by a class. Let us briefly introduce
    a common theoretical scenario of a software application. Such scenarios are often
    divided into the following parts:


    ![](img/238a8977164dbaa45c168c37286f3169_88_0.png)


    Figure 3.1 – Common application data process from a big picture


    The incoming data stream (that is, the information flow) has been accepted by
    an application. The application processes the input and creates the result. The
    result is stored and subjected to the required targeting by a system.


    Such a system has the capacity to satisfy several processes under various conditions.
    The results are stored in several ways, such as a database or a file, or possibly
    embedded into an intended output stream, such as a web page, to display information
    to the user.


    The system acts as a reservoir of the incoming information flow, processes and
    stores it in the database, and provides the result. Most of the time, everything
    is coupled and interconnected.


    Coupling has been happening on different levels, without the software designer
    noticing. The tight coherence between classes, objects, or even packages. In many
    ways, it was possible to correct the application performance weaknesses with the
    more powerful hardware. The system’s evolution progressed more or less as a statistical
    observation of Moore’s law, which was published in 1965.'
