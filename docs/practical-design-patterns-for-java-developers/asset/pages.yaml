  md: '# Initiating objects on demand with the lazy initialization pattern


    This pattern''s purpose is to defer an instance of the desired class instance
    until the client actually requests it.


    # Motivation


    Although operational memory has grown drastically over the years, we learned in
    the previous chapter that the JVM allocated a defined, specific size of memory
    reserved for the heap. When the heap is exhausted and the JVM is unable to allocate
    any new object, it causes an out positive impact on this heap pollution. It is
    sometimes called asynchronous loading because of the delayed instance. The pattern
    has quite a nice use in a web application where the web page is generated on demand
    rather than during the application initialization process. It also has its place
    in application, where the cost of operating the relevant object is high.


    # Finding it in the JDK


    Lazy initialization can be demonstrated using the example of dynamic loading by
    ClassLoader of classes that were not linked at runtime when the application started.
    Classes can be loaded eagerly or deferred by the class policy. Certain classes,
    such as ClassNotFoundException, are loaded implicitly through the java.base module.
    They support the class implementation located in the java.lang package and its
    forName method. The implementation of the method is provided by an internal API.
    A lazy initiated class may be the reason the application requires a warm-up time.
    For example, Enum classes are a special type of static final classes that act
    as constants and are loaded eagerly.


    +   - refers to loading steps into the class loader and filling out the appropriate
    method area, as learned in the previous chapter.


    # Sample code


    The basic idea of the lazy initialization example is that the created vehicle
    is initialized on demand, when already created, a reference is provided to the
    client (Figure 3.8):'
