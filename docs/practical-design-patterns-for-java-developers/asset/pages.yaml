  md: 'With a fresh awareness of the tasks of the JMM and GC, there is another important
    concept related to both. The concept of reference types is a way to tell the platform
    how to handle a allocated part of the heap space – more specifically, how to help
    the platform''s internal analytical processes. Reference types have been added
    to GC to evaluate the purpose of variables. This means speedy the decision of
    whether to collect the variable or not. The concept of a reference type is a tool,
    with a design pattern, and previously removed themes make even more sense. The
    goal of every program is to run as fast as possible. This means even the waste
    collection process causes, so it must be as fast as possible. So, regardless of
    the GC algorithm used, when the dataset is small, the process will be much faster.
    There is also a place for reference types to help keep the memory fresh and clean.
    The platform offers the following types, sorted by their resilience to GC:


    +   * Strong references: The most common type of reference – not required to be
    specified.

    * Weak references: Reference references need to be specified manually – var obj
    = new WeakReference<Object>(); ; and it''s a signal to the GC algorithm to reclaim
    memory during the next GC. This is mostly used during a program initiation or
    caching.

    * Soft references: These are reclaimed only when the application is running out
    of memory. As long as there is no critical need for space, the object stays. The
    Java platform guarantees that all references are cleared before the OutOfMemoryError.

    * Phantom reference: This represents the weakest type of reference. This team
    is collected as soon as possible, when there is no further analysis or promotion
    to another level. A variable of this type is reclaimed immediately when the GC
    runs.


    Before embarking on the Java API journey, let''s quickly summarize our newly acquired
    knowledge.

    References play an important role in the GC process. They garb garbage collectors
    to handle a particular variable. The Java memory model provides the required guarantees
    as how the value of a variable is read, updated, or deleted. We examine how values
    are stored in allocated memory, memory segmentation, and their relationship to
    the underlying system. All this new information helps us with better software
    design and API usage.


