  md: '# Motivation


    Instead of constantly creating new object instances over the code base, the object
    pool provides an encapsulated solution for managing application or client performance
    by serving an already initialized object ready for use. The pattern separates
    the build logic from the business code and helps manage the resource and performance
    aspects of the application. It may not only help with an object''s life cycle
    but also with validation when it is created or destroyed.


    # Finding it in the JDK


    A nice example of the object pool pattern is the ExecutorService interface found
    in the java.util.concurrent package and the implementation provided by the Executors
    class of the util factory that handles the appropriate executor instances, for
    example, the newScheduledThreadPool method.


