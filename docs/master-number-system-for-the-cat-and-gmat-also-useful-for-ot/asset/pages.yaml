    **Strategy** While solving any question related to numbers, you must check your
    answer by assuming different types of numbers, like natural numbers, negative
    integers, and fractions.


    # Solved Example 4


    **Is $y > x^2$?**


    Statement 1: $x^2 > y^2$

    Statement 2: $x^3 > y^3$


    +   (a) Statement (1) alone is sufficient, but statement (2) alone is NOT sufficient.

    (b) Statement (2) alone is sufficient, but statement (1) alone is NOT sufficient.

    (c) Both the statements together are sufficient, but neither alone is sufficient.

    (d) Each statement is alone sufficient.

    (e) Statement (1) and (2) together are NOT sufficient.


    **Solution:** Using statement 1, assuming some of the values of $x$ and $y$ can
    tell us in some cases $x > y$ and in some of the cases $y > x$.


    | X | Y | Remarks |

    |---|---|---|n| 5 | 4 | x > y |

    | -5 | -4 | y > x |


    While assuming the values, we can take only those values of $x$ and $y$ that satisfy
    the statement given.


    Using statement (2),

    $x^3 > y^3$

    $\Rightarrow x > y$


    It can be concluded that $y$ is not greater than $x$.

    So, statement (2) alone is sufficient to answer the question.


    Hence, option (b) is the answer.


    **Strategy** While solving any question related to numbers, you must check your
    answer by assuming different types of numbers, like natural numbers, negative
    integers, and fractions.'
