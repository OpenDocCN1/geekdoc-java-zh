  md: "# Chapter 4\n\nWe have reached now a stage to solve the elementary questions\
    \ based upon base conversion. Let us start with Worked-out Example 3 again, that\
    \ we have done earlier.\n\n# Solved Example 5\n\nGiven is $4_N \times 5_N = 20_N$\
    \ where $N$ is number of digits in that system of writing. For how many values\
    \ of $N$ is the given digit calculation?\n\nSolution Standard process of solving\
    \ these questions involve writing both the right-hand-side and left-hand-side\
    \ on one common base—preferably on base 10.\n\n```\n$4_N = 4_{10}$, and $5_N =\
    \ 5_{10}$\nHence, LHS = $4_N \times 5_N = 4_{10} \times 5_{10} = 20_{10}$\nNow,\
    \ convert RHS to base 10. $20_N = 2 \times N + 0 \times N^0 = 2N$\nLHS = RHS $\\\
    Rightarrow$ $2N = 10$. And this is the only value of $N$.\n```\n\n# Solved Example\
    \ 6\n\nGiven is $4_N \times 5_N = 21_N$ where $N$ is number of digits in that\
    \ system of writing. For how many values of $N$ is the given digit calculation?\n\
    \nSolution Going by the above solution, LHS = 20\n\n```\nRHS = $2 \times N + 1\
    \ \times N^0 = 2N + 1$\nLHS = RHS $\\Rightarrow 2N+1 = 20$\n```\n\nThis does not\
    \ give the natural value of $N$. Hence, this calculation is not possible on any\
    \ base.\n\n# Solved Example 7\n\nGiven $(12N)_4 = (124)_N$ [In LHS, $N$ is the\
    \ unit digit and in RHS, $N$ is the base]. How many values of $N$ are isolate\
    \ possible?\n\nSolution Let us convert each of LHS and RHS on base 10.\n\n```\n\
    $(12N)_4 = 1 \times 4^2 + 2 \times 4^1 + N \times 4^0 = 24 + N$\n$(124)_N = 1\
    \ \times N^2 + 2 \times N + 4 \times N^0 = N^2 + 2N + 4$\nLHS = RHS $\\Rightarrow\
    \ N^2 + 2N + 4 = 24 + N \\Rightarrow N^2 + N - 20 = 0$\nRightarrow (N+5)(N-4)\
    \ = 0 \\Rightarrow N=4$, or $-5$\n```\n\nObviously, $N=-5$ cannot be the solution.\
    \ Here, $N=4$ is the only solution?\n\nIs it possible to have $N=4$ in this case?\
    \ If $N<4$, then no digit of LHS and RHS will be possible because base on 4 cannot\
    \ be a digit '4' [largest digit on base 4 is 3].\n\nNow, we conclude that $N$\
    \ cannot take any value. So, number of values of $N$ possible = 0. Alternatively,\
    \ this question can be logically raised.\n\n```\nLHS = $(12N)_4 \\Rightarrow$\
    \ base 4, largest digit possible = 3. So, the largest possible value of $N$ is\
    \ 3.\nRHS = $(124)_N \\Rightarrow$ presence of digit '4' is possible only for\
    \ $N\\ge5$. So, the minimum possible value of $N=5$.\n```"
