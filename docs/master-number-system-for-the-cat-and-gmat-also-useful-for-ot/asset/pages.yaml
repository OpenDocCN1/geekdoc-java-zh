  md: '# REMAINDER 3


    # Learning Objectives


    After completion of this chapter, you should have a thorough understanding of
    the following:


    +   - What is remainder?

    - Properties of remainder

    - Methods of finding out remainder

    - Theorems related to remainder—CRT, Fermat''s etc.

    - Types of questions asked from this chapter in CAT and GMAT®


    # WHAT IS REMAINDER?


    A number is said to be divisible by another number if the quotient is an integer
    and remainder obtained is zero. This statement provides two necessary conditions
    for a number to be divisible by any number:


    +   1. Quotient obtained should be an integer. This can be a +ve integer, or a
    -ve integer or zero.

    2. Remainder should be equal to zero.


    So when I distribute 30 apples among 6 children, as the children get equal integral
    number of apples (5 in this case—this is known as remainder). Going through the
    same logic, if I distribute zero apple among 6 children, the children still get
    equal integral number of apples (0 in this case) and I am left with zero apple
    (this is known as remainder). And so we say that 0 = 0.


    Consider another case: I have 33 apples, and I want to distribute these apples
    among 6 kids. I may divide it in two ways:


    +   1. First, I distribute 5 apples each, and then distribute the remaining 3
    apples by cutting into halves. So quotient obtained = 5.5.

    2. If I distribute 5 apples to each of the kids, I am left with 3 apples. This
    is the case when we obtain remainder. Quotient = 5, remainder = 3.'
