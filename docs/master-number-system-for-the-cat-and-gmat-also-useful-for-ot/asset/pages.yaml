  md: '# How to Identify if Data is Sufficient for Solving a Data Sufficiency question—Dos
    and Don''ts


    You must have realized now that to correctly solve a Data Sufficiency question,
    ability to eliminate the options is equally important as knowing the concept.
    As you move towards the questions of 700+ range, you will observe identifying
    the sufficiency of data to solve a particular question has become more difficult.


    In this section, you will learn the various dos and don''ts of Data Sufficiency.
    Before we go for that, go through the following ‘Sufficiency Drill’ that will
    tell you the most frequently committed mistakes by GMAT® candidates. In these
    ‘Sufficiency Drills’, you are supposed to answer the statements identified to
    each other.


    # Sufficiency Drill 1


    Question: Is x a natural number?


    +   (a) x² - 5x + 6 = 0

    (b) x² + x - 6 = 0

    (c) 5² is an integer.

    (d) x is a prime number.


    Solution


    +   (a) Data is sufficient. x² - 5x + 6 = 0 can be factored as (x - 2)(x - 3)
    = 0 ⇒ x = 2 or 3. In either case, x is a natural number.

    (b) Data is insufficient. x² + x - 6 = 0 can be factored as (x - 2)(x + 3) = 0
    ⇒ x = 2, -3. x=2 interprets that x is a natural number, whereas x=-3 interprets
    that x is not a natural number. Since you are getting contradictory answer, data
    is insufficient.

    (c) Data is insufficient. In this case, x could be either 0 or natural numbers.
    Since 0 is not a natural number, data is insufficient.

    (d) Data is sufficient. All the prime numbers are positive integers. In other
    words, all the prime numbers are natural numbers.


    # Sufficiency Drill 2


    Question: Given that x = 5. What is the value of (y - z)?


    +   (a) x, y and z are in A.P. in the same order with common difference = 2.

    (b) xy - xz = 20

    (d) x + y = y + z


    +   (a) Data is sufficient. x, y and z are in A.P. in the same order with common
    difference = 2 ⇒ z-y=2, or y-z=-2.

    (b) Data is insufficient. x is the average of x, y and z ⇒ x+y+z=15. It gives
    y+z=15-x=15-5=10. But it does not give the value of (y-z) or the values of y and
    z individually. Hence, data is insufficient.


    ![](img/87d1e54eb537564d4ee127eb0f506473_238_0.png)'
