  md: '# Euler’s Theorem of Remainder


    Let $f(n)$ be the number of integers less than $n$ and co-prime with $n$, then
    the remainder obtained when $m^{f(n)}$ is divided by $n=1$, where $m$ and $n$
    are co-prime to each other.


    Consider the following example:


    $f(8) =$ Number of integers less than 8 and co-prime with $8 = 4$ (namely 1, 3,
    5, 7).


    [To obtain the value of ‘Number of integers less than $n$ and co-prime with $n''$
    directly, we use Euler’ Totient Function—‘Factor’ chapter to know more about this]


    So, Remainder obtained when $5^{7/(8)} =$ Remainder obtained when $5^{4/8} = 1$.


    Or, Remainder obtained when $7^{7/(8)} =$ Remainder obtained when $7^{4/8} = 1$.


    Or, Remainder obtained when $9^{9/(8)} =$ Remainder obtained when $9^{4/8} = 1$.


    Or, Remainder obtained when $11^{11/(8)} =$ Remainder obtained when $11^{4/8}
    = 1$.


    Or, Remainder obtained when $13^{13/(8)} =$ Remainder obtained when $13^{4/8}
    = 1$.


    Euler’ theorem can be used to find the length of cycle in finding remainder using
    ‘pattern method.’


    # When a Digit Repeats It $n$ Times


    These questions will involve one or more than digit being repeated $n$ times,
    and question will seek the remainder obtained when this is divided by any number.


    Some facts:


    +   1. Any digit written three times by side by will be divisible by 3 and 37.

    For example: 888 is divisible by 3 and 37.

    Obviously, from here we can conclude that a digit written six times, or 9 times
    $n$ will also be divisible by 3 and 37.

    For example: 888888 is divisible by 3 and 37.

    2. Any number of the format ‘abcabc’ will be divisible by 7, 11 and 13.

    3. If $P$ is a prime number $> 5$, then any digit written $(N - 1)$ times will
    be divisible by $P$, where $N$ is the recurring decimal of $P$. [Recurring decimal
    is the number of times which the digits get repeated after decimal. For example,
    to calculate recurring decimal of 7, we write $\frac{1}{7} = 0.142857142857 \dots$
    (repeats after 6 digits.)]

    For example: 888888 (written 8 times) is divisible by 7.

    Or, 222222222222 (2 written 12 times) is divisible by 13.'
