    So, unit digit of $7^4 = 7^8 = 7^{12} = 7^{4n}$


    Unit digit of $7^1 = 7^5 = 7^9 = 7^{13} = 7^{4n+1}$


    Unit digit of $7^2 = 7^6 = 7^{10} = 7^{14} = 7^{4n+2}$


