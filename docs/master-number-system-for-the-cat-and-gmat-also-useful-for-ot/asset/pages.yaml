    \ when $P+2$ is divided by 7, remainder obtained will be 2 or $-3$. And so on.\n\
    \n# Remainders are Multiplicative\n\nIt means that remainder can be obtained by\
    \ breaking down a number in two or more parts, and then finally calculating the\
    \ resultant.\n\n# Solved Example 2\n\nWhat is the remainder obtained when $(10\
    \ \\times 20)$ is divided by 7?\n\nSolution Going by Actual method of finding\
    \ remainder, remainder obtained = $\frac{200}{7} = 4$\n\nSince remainders are\
    \ multiplicative, we can find out the individual remainder, and then multiply\
    \ these to obtain final remainder.\n\nRemainder obtained when 10 is divided by\
    \ $7 = 3$.\nRemainder obtained when 20 is divided by $7 = 6$.\n\nRemainder obtained\
    \ $\frac{10 \\times 20}{7}$ = Remainder obtained $\frac{3 \\times 6}{7}$ = Remainder\
    \ obtained $\frac{18}{7} = 4$.\n\nLet us understand why this happens:\n$10=7p+R$,\
    \ and $20=7q+R_s$, where $R$ and $R_s$ are the respective remainder obtained when\
    \ 10 and 20 are divided by 7. $p$ and $q$ are respective quotients.\n\n> $10 \\\
    times 20 = (7p+R)(7q+R_s) = (7p \\times 7q) + (7p \\times R_s) + (R \\times 7q)\
    \ + (R \\times R_s)$ (1)\n\nWhen (1) is divided by 7, each of the terms $(7p \\\
    times 7q)$ and $(7p \\times R_s)$ and $(7q \\times R)$ is divisible by 7. So the\
    \ remainder is obtained from the last term $(R \\times R_s)$. This is exactly\
    \ what we get in the last example.\n\n# Solved Example 3\n\nWhat is the remainder\
    \ when $(1421 \\times 1423 \\times 1425)$ is divided by 12? {Based on CAT 2000}\n\
    \nSolution Remainder of $\frac{1421}{12} = 5$\n\nRemainder of $\frac{1423}{12}\
    \ = 7$\n\nRemainder of $\frac{1425}{12} = 9$\n\nRemainder of $\frac{(1421 \\times\
    \ 1423 \\times 1425)}{12}$ = Remainder of $\frac{(5 \\times 7 \\times 9)}{12}$\
    \ = Remainder of $\frac{(5 \\times 63)}{12}$ =\n\nRemainder of $\frac{(5 \\times\
    \ 3)}{12} = 3$."
