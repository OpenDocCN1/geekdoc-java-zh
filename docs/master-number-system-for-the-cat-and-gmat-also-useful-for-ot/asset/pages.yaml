    # Relationship between Remainder and Factors in General


    Statement


    +   1. If N is divisible by Q, then the multiples of N will be divisible by Q
    and so remainder obtained in each of the cases = 0.

    Example—Remainder obtained when 70 is divided by 35 = 0. Hence, remainder obtained
    when any multiple of 70 (140, 210, etc.) is divided by 35 = 0.


    +   2. If N is divisible by Q, then all the factors of Q will also divide N and
    so remainder obtained in each of the cases = 0. However, when multiples of Q are
    dividing N, we may not get the exact remainder, rather we get a range of remainders.


    Example


    | Remainder obtained when | N = 70 | N = 70 x 2 = 140 | N = 70 x 3 = 210 | N =
    70 x 4 = 280 |

    |---|---|---|---|--|

    | Remainder obtained | 30 | 100 | 100 | 100 |


    Remainders obtained = 30 and 100.


