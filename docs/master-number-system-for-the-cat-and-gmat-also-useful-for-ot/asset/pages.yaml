    # Solved Example 38


    What is the remainder when 7 + 77 + 777 + 7777 + ... (till 100 terms) is divided
    by 8?


    Solution You might have seen this expression 7 + 77 + 777 + 7777 + ... (till 100
    terms) in algebra, where we first find out the sum till n terms, and proceed to
    solve whatever is asked.


    However, we are not required to solve this question. Ideally in these scenarios
    one is required to obtain a pattern of remainders.


