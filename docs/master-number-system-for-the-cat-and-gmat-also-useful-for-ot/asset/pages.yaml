    Hence, unit digit of $7^{470}$ = unit digit of $7^2$ = 9.


    # Method 2 Using Generalization


    Maximum cyclicity of unit digit of any number = 4. This can be seen through the
    table (p. 8.2).


    We can also see that cyclicity of:


    | Digits | Cycle length |

    | --- | --- |

    | 0, 1, 5, 6 | 1 |

    | 4, 9 | 2 |

    | 2, 3, 7, 8 | 4 |


    The result can be generalized in the following way:


    +   (i) Any digit$^{4n+1}$ = Same digit will be obtained.

    Example: Unit digit of $8^{53} = 8$, or unit digit of $7^{53} = 7$, or unit digit
    of $4^n = 4$.

    (ii) Any odd digit$^{4n}$ – unit digit obtained = 1, where $n$ is any natural
    number.

    Exception: if the odd digit = 5, then the unit digit obtained for $5^{any number}$
    = 5.

    (iii) Any even digit$^{4n}$ – unit digit obtained = 6, where $n$ is any natural
    number.

    Understand that all the above points (i), (ii) and (iii) are only necessary conditions,
    and not sufficient conditions.


    It means, if power is $4n$, odd digit (except 5) will give 1 to the units place.
    If power is $4n$, even digit will give 6 at the units place, and 0 will give 0
    at the unit place. However, if the unit digit of (odd number)$=1$, we cannot say
    the power has to be $4n$ (n being a natural number). We will discuss it further
    with the help of following questions.


