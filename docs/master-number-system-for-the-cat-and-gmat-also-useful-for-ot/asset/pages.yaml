    # Finding Total Number of Factors of a Number


    We understand that if natural N is divisible by natural number Q, then Q is a
    factor of N. We go a step ahead and say that if Q is not a factor of N, then N
    will not be divisible by Q.


    Let us understand this with the help of example:


    Assume, N = 150


    Prime factorization of N = 150 = 2¹ × 3¹ × 5²


    We can conclude the following:


    +   1. 150 is divisible by three prime numbers = 2, 3, 5. It also means that 150
    will not be divisible by any of the other prime numbers, 7, 11, 13, etc.

    2. Since largest power of 2 is contained in 150, largest power of 2 will divide
    150 = 1 ⇒ So any number of the order 2² or 2³ will not divide 150.

    3. Since largest power of 3 is contained in 150, largest power of 3 will divide
    150 = 1 ⇒ So any number of the order 3³ or 3⁴ will not divide 150.

    4. Since largest power of 5² is contained in 150, largest power of 5 will divide
    150 = 2 ⇒ So any number of the order 5³ or 5⁴ will not divide 150.

    5. Even with the combination of two or more than 2'', 3'', 5² are possible.


    All these can be understood as follows:


    ```

    (2¹ × 3¹ × 5²)


    ```'
