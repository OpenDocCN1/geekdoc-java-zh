  md: '# Chapter 5


    # SURDS


    Discussion on surds has been occurring for a long time, to be more precise, since
    the development of the Pythagorean Theorem. Look at the right-angled triangle
    with perpendicular base = 1.


    ![](img/87d1e54eb537564d4ee127eb0f506473_152_0.png)


    Using Pythagorean theorem, $x^2 = 1 + 1 = 2 \Rightarrow x = \sqrt{2}$


    We have already seen that,


    +   - A number that can be expressed as a fraction of integers (denominator $x
    \neq 0$) is called a **rational number**. Examples of rational numbers are $\frac{5}{7},
    \frac{3}{4}$.

    - A number which cannot be expressed as a fraction of two integers is called an
    **irrational number**. Examples of irrational numbers are $\pi, \sqrt{2}, \sqrt{11}$
    etc.


    Now we define **surd**.


    An irrational number involving a root is called a surd. Examples of surds are
    $4\sqrt{5}, \sqrt{3}$.


    # Rules of Surds


    +   1. $a^{\sqrt{b}} = \sqrt{a}$


    +   2. Two basic laws of surds are, for all positive real numbers $a$ and $b$:


    $$\sqrt{a} \cdot \sqrt{b} = \sqrt{ab}$$


    $$$\sqrt{\frac{a}{b}} = \frac{\sqrt{a}}{\sqrt{b}}$


    +   3. Conjugate surds are specially related surds, such as, $\sqrt{a}+\sqrt{b},
    \sqrt{a}-\sqrt{b}$.


    Their product is a rational number, as,

    $$$(\sqrt{a}-\sqrt{b})(\sqrt{a}+\sqrt{b}) = (\sqrt{a})^2 - (\sqrt{b})^2 = a -
    b$


    This idea of conjugate surds is used for rationalizing the denominator.


    +   4. Surds are further categorized as Pure Surds or Mixed Surds. A pure surd
    is a number without any visible natural number component added to it. For example,
    $\sqrt{48}$ is a pure surd. A mixed surd is a number which has a visible natural
    number component attached to it. For example, $2\sqrt{3}$ is a mixed surd.


    # Rationalizing the Denominator


    Rationalization of the denominator is done in a fraction that there will be no
    surds in the denominator. This is done by multiplying the numerator and denominator
    by the conjugate surd of the denominator.'
