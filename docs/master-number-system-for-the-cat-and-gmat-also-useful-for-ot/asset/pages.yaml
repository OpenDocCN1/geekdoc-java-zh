  md: '# Exponents


    So, we will apply the same formula of finding out the exponents for any prime
    number in both of these cases individually, and minimum of those two will be the
    answer.


    ```

    $$\frac{100}{5^x} = \left[frac{100}{5} + \frac{100}{5^2}\right] = 20 + 4 = 24$

    ```


    ```

    $$\frac{100}{3^x} = \left[frac{100}{3} + \frac{100}{3^2} + \frac{100}{3^3} + \frac{100}{3^4}\right]
    = 33 + 11 + 3 + 1 = 48$

    ```


    Now, we say that 100 is divisible by $5^2$ and 100 is divisible by $3^4$. To answer
    the question that 100 is divisible by power of 15, we need to make sets of one
    5 and one 3. Obviously, number of 5 and 3 = Minimum of (exponents of 5, exponents
    of 3) = Minimum of (24, 48) = 24.


    Hence 100 is divisible by $15^2$.


    > Note We can note a fact here that we are not required to calculate for each
    of the prime factors—3 and 5 as in this case. Knowing the fact that exponent of
    5 will be less than the exponent of 3, only calculating the exponent of 5 will
    do. Similarly, if we have to find out the exponent of 7 in 50! is going to be
    equal to the exponent of 7 in 50! (Because the exponent of 7 is less than the
    exponent of 5 in 50!).


    # Solved Example 9


    Let us find the exponent of 25 in 100!


    Solution $25 = 5^2$


    In this case, we will first find out the exponents of 5 and then divide it by
    2 (actually the power) to find out the exponents of 25.


    ```

    $$\frac{100}{5^x} = \left[frac{100}{5} + \frac{100}{5^2}\right] = 20 + 4 = 24$

    ```


    So, the largest power of 25 that will divide 100 = largest power of $5^2$ that
    will divide 24.


    # Solved Example 10


    Let us find out the exponent of $3^2$ and $5^1$ in 100! one by one.


    Solution $45 = 3^2 \times 5^1$. We will find out the exponent of $3^2$ and $5^1$
    in 100!.


    ```

    $$\frac{100}{5^x} = \left[frac{100}{5} + \frac{100}{5^2}\right] = 20 + 4 = 24$

    ```


    To find out the exponent of $3^2$ in 100!, we will first find out the exponent
    of $3^1$ in 100! and divide that by 2 (i.e., the power of 3).


    ```

    $$\frac{100}{3^x} = \left[frac{100}{3} + \frac{100}{3^2} + \frac{100}{3^3} + \frac{100}{3^4}\right]
    = 33 + 11 + 3 + 1 = 48$

    ```


    So exponent of $3^2$ in 100! = 24.'
