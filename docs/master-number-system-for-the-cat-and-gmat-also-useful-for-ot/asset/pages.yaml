  md: '# Chapter I


    Odd Integers Any integer that can be written in the format of 2N + 1 is an odd
    integer, where N is an integer. For example, 1, 5, 101, -23 are odd integers.


    +   Odd ± Odd = Even

    Even ± Even = Even

    Odd ± Even = Odd

    Even ± Odd = Odd

    (Odd)^Even = Odd

    (Even)^Odd = Even

    Odd × Even = Even

    Odd × Odd = Odd

    Even × Even = Even


    The idea is not asking you to mug it up. Rather, develop an understanding and
    when-ever, you should be able to verify it on your own.


    # Solved Example 4


    Let x, y and z be distinct integers, x and y are odd positive, and z is even positive.
    Which one of the following statements cannot be true? (CAT 2001)


    +   (a) y(x - z)^2 is even

    (b) y''(x - z) is odd

    (c) y(x - z) is odd

    (d) z(x - y)^2 is even


    Solution Answer be verified by assuming the values x = 1, y = 3, z = 2. Let us
    verify options:


    +   (a) (x - z) = Odd. y(x - z)^2 is also odd. Hence option a is not true.

    (b) Since y and (x - z) are both odd, hence, y''(x - z) is odd. Hence option b
    is true.

    (c) Since y and (x - z) are both odd, hence, y(x - z) is odd. Hence option c is
    true.

    (d) Since z and (x - y) are both odd, hence, z(x - y)^2 is even. Hence option
    d is true.

    Answer: option a.


    # Solved Example 5


    100 natural numbers are written on a black board. Two persons A and B are playing
    a game of putting ''+'' and ''-'' sign one by one between two consecutive integers
    out of these 100 natural numbers. Both A and B are free to put any sign (+ or
    -) anywhere, pro-vide there is no sign already placed between the two natural
    numbers. At the end, when signs were put between all such consecutive natural
    numbers, result is calcu-lated. If the result is even, then A wins 50 and if the
    result is odd, then B wins.


    Solution It can be seen that there are 50 odd and 50 even numbers.


    So, 100 consecutive natural numbers = set of 50 odd and 50 even numbers.'
