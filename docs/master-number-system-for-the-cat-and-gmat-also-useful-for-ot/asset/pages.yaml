  md: '# Preface


    **Master Number System for CAT and GMAT®** now in its third edition, provides
    an array of comprehensive and class-tested material which will help the students
    to understand the basic concepts of number system as well as how to apply that
    knowledge to an ever-expanding set of numerical applications/questions. As students
    progress in this book, they will learn to apply different strategies and will
    also be developing critical-thinking skill. This new edition offers fully-updated
    material to capture the recent changes in the CAT and GMAT papers.


    It has been observed that every year approximately 20% of QA paper in CAT and
    other competitive examinations are based on number system questions.


    This book is designed keeping in mind the requirement of students who might not
    have been in touch with their studies or the fundamentals to understand the questions
    in the number system. In addition to this, while writing this book, special emphasis
    has also been laid on:


    +   * How to build an approach to solve a question—so even if one has never seen
    a/her life, one should be able to solve under testing conditions.

    * Concepts have been dealt in an easy way to enable application under different
    contexts—to stimulate your thoughts of ‘Why I never thought like this?’


    Every chapter includes variety of solved examples tagged with important concepts
    and the theory. There are three levels (simple to moderate to complex) of practice
    exercises provided at the end of every chapter, along with previous years’ questions.
    Five factual sections have been included at the end of the book for self-assessment—understanding
    basic concepts, critical-thinking skills, and time management techniques for the
    examination.


    New to this:


    +   (a) GMAT coverage

    (i) A new chapter on Data Sufficiency has been added that deals with ‘What’ and
    ‘How’ of data suffisante for GMAT including one fully solved practice exercise.
    Since data sufficiency questions are asked in CAT and other Indian B-School examinations
    too, this chapter will provide a shot in the students’ preparation.

    (ii) Data Sufficiency questions with explanations have also been added.


    +   (b) Looking at the relative importance and number of questions asked at different
    examinations in recent years and extrapolating the same, some of the chapters/concepts
    have been re-written as per the recent trends for effective preparation.


    +   (c) Solutions and explanations to more than 90% of the questions have been
    provided now.


    Many students reported about how this book has helped them master Number System
    in a systematic way. Some of the mails also suggested that this book can be made
    more useful for'
