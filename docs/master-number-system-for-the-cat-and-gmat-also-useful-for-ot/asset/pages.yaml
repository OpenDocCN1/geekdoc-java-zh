  md: "# Application of LCM/HCF\n\nCase 1—Time and work\n\nIn the questions involving\
    \ individual efficiency, we use the concept of LCM to assume the total units of\
    \ work instead of going through the actual method of solving the question.\n\n\
    # Solved Example 10\n\nTatto can do a work in 10 days, and Tappo can do same work\
    \ in 12 days. How many days will it take if both of them starting working together?\n\
    \n# Solution\n\nNormal Method:\n\nWork done by Tatto in one day = $\frac{1}{10}$\
    \ of the total work.\n\nWork done by Tatto in one day = $\frac{1}{12}$ of the\
    \ total work.\n\nTotal work done by Tatto and Tappo in one day = $\frac{1}{10}\
    \ + \frac{1}{12} = \frac{11}{60}$ of the work.\n\nHence, total time taken by Tatto\
    \ and Tappo to finish the work = $\frac{60}{11} = 5\frac{5}{11}$ days\n\nLCM Method:\n\
    \nLet us assume work = LCM of (10, 12) units = 60 units. Since 60 units of work\
    \ is being done by Tatto in 10 days, so Tatto is doing 6 units of work per day\
    \ and similarly, Tappo is doing 5 units of work per day. Here, they are 11 units\
    \ of work in one day.\n\nSo, time taken to finish the work by Tatto and Tappo\
    \ = $\frac{\text{Total work}}{\text{Work done in one day}} = \frac{60}{11} = 5\f\
