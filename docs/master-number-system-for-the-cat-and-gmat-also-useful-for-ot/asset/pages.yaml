    | Remainder obtained divided by 8 | 7 | 5 | 1 | 1 | 1 | 1 |


    So, except for the first two terms, all the other terms will give remainder =
    1.

    Hence, remainder obtained = (7 + 5 + 1 × 98) is divided by 8 = Remainder (7 +
    5 + 1 × 98) is divided by 8 = 6.


    # Concept of Successive Division


    Suppose that N is any number which is divided successively by 3 and 5, then what
    we mean to say is—At first, we divide N by 3 and then the quotient obtained from
    this division is divided by 5.


    Example Let us see the case when 50 is divided by 5 and 3 successively.

    50 divided by 5 gives 10 as the quotient. Now, we will divide 10 by 3. It gives
    a quotient of 3 and remainder of 1. So, we say that 50 is divided by 5 and 3 successively,
    remainders obtained are 0 and 1 respectively.


    # Solved Example 39


    When a number N is divided successively by 3 and 5, remainder obtained are 1 and
    2 respectively. What is the remainder when N is divided by 15?


    Solution It can be seen that we are required to calculate it from back-end.

    Family of numbers when divided by 5 gives remainder 2 = 5P + 2.

    So, N = 3(5P + 2) + 1 = 15P + 7.

    Now, when N is divided by 15, remainder = 7.'
