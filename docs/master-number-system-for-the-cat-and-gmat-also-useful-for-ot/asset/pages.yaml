  md: '# DATA

    SUFFICIENCY 9


    # Learning Objectives


    After completion of this chapter, you should have a thorough understanding of
    the following:


    +   - Know the structure of questions in Data Sufficiency

    - Understand the strategies involved in solving any question

    - Understand the options given

    - Identify the sufficiency of data


    Data Sufficiency (DS) questions account for almost half of the total questions
    in Quantitative Section of GMAT®. In IIM CAT examination, Data Sufficiency questions
    are often asked.

    Most of the Data Sufficiency-related questions, it can be observed that the questions
    are based upon quantitative concepts. However, it is noteworthy that only knowing
    the quantitative concepts is ''not'' sufficient to ace the Data Sufficiency-related
    questions. It is important to understand the instances where it can be concluded
    that the data given is sufficient.

    to understand the level of difficulty of the questions asked in Data Sufficiency,
    let me take you through Bloom''s taxonomy. It is an established and accepted form
    of learning hierarchy.

    Following is the presentation of Bloom''s taxonomy:

    At the base of Bloom''s taxonomy are the basics of learning. These are: (1) Remembering
    and (b) Understanding. All the levels above this are: (1) Applying, (2) Analyzing,
    and (3) Evaluating and Creating. These are considered as higher-order thinking.
    To solve these questions, one need to have a sound thought process and strong
    logical abilities.

    Let''s face it – GMAT® or CAT of IIMS is a test of higher-order thinking. To achieve
    a high score, it is important to understand the relative importance of different
    layers of learning (as given above). While you will not get any question at the
    ''Creating Level'', you may get a maximum of 10% of the total Data Sufficiency
    question at first level in GMAT®. These questions may be done by simply going
    through the formula. To be able to solve the remaining questions, you need to
    move up the hierarchy.

    Before moving on to learn the strategies to solve Data Sufficiency questions,
    it is imperative to know the basics related to Data Sufficiency.'
