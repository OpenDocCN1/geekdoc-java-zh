    # Solved Example 5


    LCM of two natural numbers = 200. How many set of values of two natural numbers
    are possible?


    # Solution 200 = 2³ × 5²


    Let us assume natural numbers = A and B.

    We understand that the only prime numbers present in each of A and B can be 2
    or 5 only. It also means that each of A and B cannot contain any prime number
    other than 2 or 5.


    Since there are two prime numbers, there are two cases—either both the prime numbers
    are coming from the same number or else is coming from A and the one is coming
    from B.

    Let us list the cases:


    +   A B

    2³ × 5² 2⁻³ × 5⁻²


    Since B can take 4 × 3 = 12 different values for value of A, there are 12 different
    sets possible.

    Next, let us assume that 2³ is coming out of A, and 5² is coming out of B.


    +   A B

    2³ 5²


    Further, A can have 5⁰ or 5¹ beside 2³. Similarly, B can have 2⁰, 2¹, beside 5².

    Hence, A can have either 2³ × 5⁰ or 2³ × 5¹; B either 2⁰ × 5² or 2¹ × 5².

    So, A have 2 values, and B have 3 values. total number of sets = 2 × 3 = 6.

    In general, for N = Pᵃ × Qᵇ (where P and Q are prime numbers and N is a natural
    number), total sets of two natural numbers whose LCM is N = [(x+1)(y+1) + xy].
    Understand that this would give us un-ordered pairs of sets.


    In this formula, (x + 1)(y + 1) is same as the number of factors of a natural
    number. It is all because, if one number A is taken as LCM, then other number
    B can be any factor of A, such that their LCM will be equal to the number A.'
