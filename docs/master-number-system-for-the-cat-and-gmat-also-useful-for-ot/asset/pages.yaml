    # # Solved Example


    How many of the following numbers will be divisible by 6?


    +   (a) 45794 (b) 326804 (c) 378927 (d) 46924


    # # Solution


    +   (a) Sum of digits of 45794 = 4 + 5 + 7 + 4 (neglect 9, since 9 is divisible
    by 3) = 20 => Sum of digits is not divisible by 3, so the number is not divisible
    by 6.


    +   (b) Sum of digits of 326804 = 2 + 8 + 0 + 4 (neglect 3 and 6) = 14 => Sum
    of digits is not divisible by 3, so the number is not divisible by 6.


    +   (c) We will not check the sum of digits of 378927, as this number is not divisible
    by 2.


    +   (d) Sum of digits of 46924 = 4 + 6 + 2 + 4 (neglect 6 and 9) = 10 => Sum of
    digits is not divisible by 3, and the number is even. So, the number is not divisible
    by 6.


    For 7 The integer is divisible by 7, if and only if the difference of the number
    of its thousands and the remainder of its divisible by 1000 is divisible by 7.


    > ''Or''


    If the difference between the number of tens in number and twice the unit digits
    is divisible by 7, then the given number is divisible by 7.


    For example: we take the number 795. When units is doubled, we get 10. The remaining
    part of the number (i.e., the tens) is 79. If 10 is subtracted from 79, we get
    69. This result is not divisible by 7. The original number 695 is not divisible
    by 7.


    For 8 If last 3 digits of a number is divisible by 8, then the number itself is
    divisible by 8.


    For example: 128, 34568, 76232, etc.


    For 9 If sum of digits of the number is divisible by 9, then the number will be
    divisible by 9. For example, let us check it for 129835782. Sum of digits of 129835782
    = 1 + 2 + 8 + 3 + 5 + 7 + 8 + 2 = 36 (neglect 9). Since 36 is divisible by 9,
    so number will be divisible by 9.


