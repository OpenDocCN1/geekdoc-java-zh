    # Solved Example 16


    Product of two natural numbers = 144, and their HCF = 18. What is their LCM?


    Solution We know, LCM × HCF = Product of two numbers

    ⇒ LCM × 18 = 144 ⇒ LCM = 8

    Think—Is this possible?

    As we discussed here, LCM cannot be less than HCF. Hence, we conclude that if
    product of two natural numbers = 144, and their HCF cannot be equal to 18, and
    in turn, the LCM cannot be equal to 8.


    Reason out it:


    Understand that if 18 is the HCF of the two natural numbers, then each of the
    two numbers are divisible by 18 (or 18 is factor of each of the numbers). So,
    the format of the numbers are 18a, 18b. So, the product of two numbers = 18 ×
    18 = 324 ⇒ this number is to be larger than equal to 324 (since, a and b will
    be natural numbers). But, the product given = 144. Hence we conclude that HCF
    = 18 is not possible.


    # Maxima and Minima in Case of LCM/HCF


    If product of two numbers is given, and one of LCM or HCF is given, then this
    gives rise to the case of maxima and minima.


    Primarily, the formula that we are going to use is—LCM × HCF = Product of two
    numbers. Although, this formula only provides the basic framework, and to solve
    these questions would require us to visualize the situation.


    Going by the formula LCM × HCF = Product of two numbers, we can say that, RHS
    is constant, LHS will be inversely proportional to HCF (subject to the values
    being natural numbers).


    | Maximum of LCM (and vice versa) | Minimum of HCF |

    | Minimum of LCM (and vice versa) | Maximum of HCF |


    # Solved Example 17


    Product of two natural numbers = 144. What is the: (a) largest possible, (b) smallest
    possible HCF of these two natural numbers?


    Solution Let first factorize 144 = 12 × 12 = (2² × 3) × (2² × 3).


    Largest possible HCF occurs when LCM = HCF ⇒ when LCM = HCF, numbers are equal.'
