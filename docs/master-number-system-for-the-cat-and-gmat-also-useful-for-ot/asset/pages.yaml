    # Addition


    Process of addition on any base system is exactly the same as that on decimal
    system.


    Consider the addition on binary system:


    $0 + 0 = 0$ with carry forward 0.


    $0 + 1 = 1$ with carry forward 0.


    $1 + 1 = 0$ with carry forward 1, and so on.


    Let us understand more of addition through some simple examples:


    | $527_{10}$ |

    +$436_{10}$ |

    =$963_{10}$ |


    On base 10


    First, we add 7 and $6 = 13. 3$ is written as unit digit 1 and 1 carries forward
    to the tens places. Next is $2 + 3 = 5$ and 1 is added to it carried forward from
    unit place $= 5 + 1 = 6$. Finally, $5 + 4 = 9$.


    Hence, summation $9 = 9 3$.


    Let us do the same summation on base 9:


    | $527_{9}$ |

    +$436_{9}$ |

    1064 |


    **Method 1** Convert all the numbers on decimal system, do the subtraction and
    convert the result back to the asked base.


