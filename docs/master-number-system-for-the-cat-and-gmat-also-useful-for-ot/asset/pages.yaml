    \ between any two consecutive natural number = 1, we say that 10th natural number\
    \ from starting = 10, or 22nd natural number from starting = 22 and so on.\n\n\
    Equation format of natural number $a_n = a_{n-1} + 1$, where $a_i = 1$ and $a_i$\
    \ is the lowest natural number.\n\nFunction format of natural number $\rightarrow\
    \ f(n) = f(n-1) + 1$, where $f(1) = 1$ and $f(1)$ is the lowest natural number.\n\
    \nNatural numbers, further, can be categorized as either prime or composite number\
