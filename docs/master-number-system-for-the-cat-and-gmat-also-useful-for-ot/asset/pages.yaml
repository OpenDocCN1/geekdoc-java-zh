  md: '# Chapter 2


    Some numbers that are less than 100 and divisible by 10, 20 and 25 are = 0, ~100,
    ~200, etc.

    Despite these numbers being lower than 100, why these numbers are not the LCM
    of the taken numbers?


    Reason:-0 is not a multiple of 10 or 20 or 25. At the same time, ~100 or ~200
    are also not the multiples of 10 or 20 or 25. Since these are not the multiples,
    hence not the LCM.


    # Solved Example 2


    LCM of 10, -20 and -25.

    LCM is defined only for positive numbers. In other words, LCM is defined only
    for positive fractions and natural numbers—positive numbers.

    In other words, LCM for negative numbers as well as zero is not defined. Hence,
    no LCM of 10, -20 and -25 is possible.


    Process to Find LCM


    +   (a) The standard method of finding LCM is through factorization of numbers.
    Let us understand this 3-step process:


    +   * Step 1 Factorize the numbers.

    * Step 2 Collect all the distinct factors.

    * Step 3 Raise each factor to its maximum available power and multiply by these.

    Finding LCM of 10, 20 and 25.

    * Step 1 10 = 2¹ × 5¹

    20 = 2² × 5¹

    25 = 5²

    * Step 2 Distinct factors = 2, 5

    * Step 3 Highest power of 2 = 2²

    Highest power of 5 = 5²

    Hence, LCM = 2² × 5² = 100


    +   (b) Straight Line method—The Straight Line of finding LCM involves taking
    numbers in succession one-by-one, and observing which factors are to be multiplied.

    Let us understand this with the help of an example:


    # Solved Example 3


    Find the LCM of 24, 30, 52, 76.


    Solution Let us start with one number, and slowly keep moving to the next numbers.

    Here, we are beginning starting with 24.

    Take the next number 30, and think what number should be multiplied to 24, so
    that 30 divides 24 × N (where N is the number multiplied to 24). Obviously, it
    is going to be the'
