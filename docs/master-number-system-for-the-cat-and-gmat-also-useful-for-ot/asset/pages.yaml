    Chinese Remainder Theorem

    Around 100 AD, Chinese mathematician Sun-Tsu solved the following problem:


    # Solved Example 36


    There is a positive number that gives remainder 2 when divided by 3, remainder
    3 when divided by 5, and remainder 2 when divided by 7. Which is the lowest such
    number?


    Mathematically this is written as:


    ```

    x = 2 (mod 3)

    x = 3 (mod 5)

    x = 2 (mod 7)

    ```


    A number when divided by 3 gives remainder 2 is of the format N = 3K + 2.

    Now, we will try to find out the lowest value of K that N gives remainder 3 when
    divided by 5=2. Hence, the lowest such natural number =8 will be obtained when
    we add 15 (= LCM (3, 5)] to 8.


    And hence, the family of numbers satisfying x=2 (mod 3) and x=3 (mod 5) => N =
    15P + 8.

    Now, we are required to find a value of P such that 15P + 8 gives remainder 2
    when divided by 7.


    Let check it for various values of P:


    | p | P=1 | P=2 | P=3 | P=4 | P=5 | P=6 | P=7 |

    |---|---|---|---|---|---|---||}{

    | Remainder obtained when divided by 7 | 2 | 3 | 4 | 5 | 6 | 0 | 1 |


    Obviously for P =1, all the three conditions are satisfied. Hence, the lowest
    number =23.


    Next number will be obtained when we add LCM (3, 5, 7) to 23. So, next number
    is 23 + 105 = 128 of numbers satisfying following conditions = 105K + 23:


    # Finding Unit or Tens Digit


    Remainder obtained when a number is divided by 10 = Unit digit of the number.
    For example, when we divide 156 by 10, remainder obtained = 6, which is the unit
    digit of 156.


    Remainder obtained when a number is divided by 100 = Last two digits of the number.
    For example, when we divide 1564 by 100, remainder obtained = 64, which are the
    last two digits of 1564.


    Remainder obtained when a number is divided by 1000 = Last three digits of the
    number. For example, when we divide 15643 by 1000, remainder obtained = 643, which
    are the last three digits of 643.


    We will discuss more of unit digit/tens digit in the chapter cyclicity.'
