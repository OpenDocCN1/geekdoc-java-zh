    $2^0$ or $2^1$, $3^0$ or $3^1$, $5^0$ or $5^1$ or $5^2 \\Rightarrow 2$ can be\
    \ taken in 2 ways, 3 can be taken in 2 ways, and 5 can\ntaken in 3 ways.\n\nFormat\
    \ of $Q = (\text{factor}) = 2^{0-1} \times 3^{0-1} \times 5^{0-2}$\n\nSo, total\
    \ number of natural factors = $2 \times 2 \times 3 = 12$\n\nIn general, total\
    \ number of natural number factors of $N = p^r \times q^s \times r^t \\dots =\
    \ (x+1)(y+1)$\n\nSimilarly, total number of natural number factors of $N = p^r\
    \ \times q^s \times r^t = (x+1)(y+1)(z+1)$\n\nIt can be understood that while\
    \ calculating the factors, we are adding 1 to the power of prime\nnumber before\
    \ the usage of 'power 0'.\n\nEvery natural number (>1) can be factored into the\
    \ product of prime numbers. There is only\none way to do it for every such number.\
    \ For instance, $120 = 2^3 \times 3^1 \times 5^1$, and this is only one\nway to\
    \ factor 120 into prime numbers. This property is known as 'Fundamental Theory\
    \ of\nArithmetic'; Since, there is just one way of factorizing any natural numbers,\
    \ have unique\nt factors can be obtained.\n\n# Solved Example 2\n\nHow many natural\
    \ factors of N = 720?\n\nSolution $720 = 2^4 \times 3^2 \times 5^1$\n\nHence,\
    \ number of factors = $(4+1)(2+1)(1+1) = 5 \times 3 \times 2 = 30$.\n\n# Finding\
    \ the Even/Odd Number Factors of a Natural Number\n\nWe have already discussed\
    \ to calculate the number of factors of a number, we need to\ntake care of the\
    \ different powers that a prime number can take.\n\nFor example: let us consider\
