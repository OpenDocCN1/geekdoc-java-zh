  md: '# # DIVISIBILITY 7


    **Learning Objectives**


    After completion of this chapter, you should have a thorough understanding of
    the following:


    +   - Divisibility rules of numbers

    - Seed number method—Method to obtain the divisibility rule

    - Divisibility rules of the number on other base than base 10

    - Types of questions asked from this chapter in the CAT and GMAT®


    Essence of divisibility rules lies with the fact that with the help of these rules,
    we can find out if a number is divisible by other number or not without going
    through actual division.


    Divisibility rules of numbers are specific to that particular number only. It
    simply means that divisibility rules of different numbers will be different. We
    shall now see a list of divisibility rules for some of the natural numbers.


    # DIVISIBILITY RULES


    **For 2** If unit digit of any number is 0, 2, 4, 6 or 8, then the number will
    be divisible by 2.

    For example: 120, 152, 188, etc.


    **For 3** If sum of digits of any number is divisible by 3, then the number will
    be divisible by 3.

    For example: 123, 456.


    # **Solved Example I**


    How many values of N are possible if 34586N is divisible by 3, where N is the
    unit digit of the number?


    **Solution** Sum total of the number = 26 + N.'
