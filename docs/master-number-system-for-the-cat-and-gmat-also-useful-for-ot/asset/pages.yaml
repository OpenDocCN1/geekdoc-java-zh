  md: '# Solved Example I4


    What is the number of natural numbers n in the range of $2 < n < 20$ such that
    $(n-1)$ is not divisible by n?


    Solution Take some initial values of $n$ and try to find a pattern.

    N=3 \Rightarrow (n-1) = 2!$ Which is not divisible by 3.

    N=4 \Rightarrow (n-1) = 3!$ Which is not divisible by 4.

    N=5 \Rightarrow (n-1) = 4!$ Which is not divisible by 5.

    N=6 \Rightarrow (n-1) = 5!$ Which is divisible by 6.

    N=7 \Rightarrow (n-1) = 6!$ Which is not divisible by 7.

    Now we can generalize for N= Prime numbers, $(n-1)$ is not divisible by n.

    Hence, values of $n$ (greater than 6) for which $(n-1)!$ is not divisible by $n=$
    Prime numbers of $n=7, 11, 13, 17, 19$.

    Total values = $3, 4, 5, 7, 11, 13, 17, 19 = 8$ numbers.


