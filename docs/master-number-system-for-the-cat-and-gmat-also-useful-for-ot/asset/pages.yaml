  md: '# Examination Pattern and Trends


    How to Prepare for Common Admission Test (CAT): Story of Moves


    Let me start with the famous story ''Garry Kasparov vs IBM''s Deep Blue computer'':

    During 1996–1997, Deep Blue developed by IBM played two series of matches with
    the then world chess champion Garry Kasparov. While the first series of six matches
    played in 1996 won by Garry Kasparov (Wins–3, Draws–2, Loss–1), disproving the
    IBM’s supremacy claim of machine over man, the second series played in May 1997
    was won by IBM’s machines. After this loss, Kasparov said that he sometimes saw
    deep intelligence and creativity in the machine’s moves, suggesting that during
    the second game, human chess players, in violation of the rules, intervened. As
    expected, IBM vehemently denied that it cheated, saying that the only human intervention
    occurred between games and not during the games. The rules allowed the developers
    to modify the program between games, an opportunity IBM it used to shore up weaknesses
    in the computer’s playing prowess that were revealed during the course of the
    match.


    What are the typical responses/reactions when we see a question? Some of those
    frequently occurring are listed below:


    | Responses/Reactions |

    |---|

    | 1. Solution is clear to end end |

    | 2. Solution is somewhat clear |

    | 3. Not at all having any idea of the solution |


    **Response/Reaction 1** I know how to start and how to reach to the final solution.
    So, it is just a matter of few seconds/minutes that I will have the solution.


    **Response/Reaction 2** Solution is somewhat clear—knowing how to start, but not
    absolutely sure if it will lead to the end.


    **Response/Reaction 3** Not at all having any idea of the solution—How to approach
    or proceed is not clear?


    You may wonder why I started with Kasparov vs IBM story and why it is linked to
    the CAT preparation and the possible answers. To answer this, I raise another
    question—Human beings having the thinking capabilities, and so s/he can decide
    on the basis of the changing situations and so s/he plays chess. How does a computer
    actually play chess?


    If we go through the Kasparov vs Deep Blue story flashback, we were some chess
    grandmasters who were the part of IBM Deep Blue manufacturing team and supplying
    the most crucial information—the database of moves played across thousands of
    games. While these moves created a repository of information inside the ‘brain’
    of computer, a complex modelling was done to decide which counter move is best
    for'
