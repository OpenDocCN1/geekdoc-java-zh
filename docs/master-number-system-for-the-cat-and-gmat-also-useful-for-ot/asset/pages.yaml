  md: '# Chapter 9


    Solution: Using statement (1): Since x is divisible by 100 ⇒ x will be divisible
    by all the factors of 100. Since 50 is a factor of 100, x will be divisible by
    50.


    Using statement (2): If x is divisible by 10, then x will be divisible by all
    the factors of 10, that is, 1, 2, 5, 10.


    X may or may not be divisible by the multiples of 50 (which is a multiple of 10).
    So, statement (1) alone is sufficient to solve the questions, but statement (2)
    alone is not sufficient to solve the questions.


    Hence, option (a) is the correct answer.


    # Solved Example 2


    Is x a negative number?


    Statement 1: x > -5.

    Statement 2: x > 5


    +   (a) Statement (1) alone is sufficient, but statement (2) alone is NOT sufficient.

    (b) Statement (2) alone is sufficient, but statement (1) alone is NOT sufficient.

    (c) Both the statements together are sufficient, but neither alone is sufficient.

    (d) Each statement alone is sufficient.

    (e) Statement (1) and (2) together are NOT sufficient.


    Solution: Using statement (1): If x is greater than -5 (minus 5), it can be positive
    as well as negative or zero. Hence, statement (1) does not provide a unique answer.


    Using statement (2): If x is greater than 5, it has to be positive. The answer
    to the question ''Is x a negative number is NO.''

    So, statement (2) alone is sufficient to solve the question, but statement (1)
    alone is not sufficient to solve the question.


    Hence, option (b) is the correct answer.


    Note In case of Data Sufficiency questions, answer to a question may be simply
    a YES or NO (as given in Worked-out Example 2 and Worked-out Example 4).


    # Solved Example 3


    Is x an even number?


    Statement 1: 4x is an even number.

    Statement 2: 3x is an even number.


    +   (a) Statement (1) alone is sufficient, but statement (2) alone is NOT sufficient.

    (b) Statement (2) alone is sufficient, but statement (1) alone is NOT sufficient.

    (c) Both the statements together are sufficient, but neither alone is sufficient.

    (d) Each statement alone is sufficient.

    (e) Statement (1) and (2) together are NOT sufficient.'
