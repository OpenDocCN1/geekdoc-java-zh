  md: "# Cyclicity 8.11\n\nLet us find the tens place digit of each of the parts individually,\
    \ and then we will multiply to find the final tens place digit.\n\nLast two digits\
    \ of $21^{1000}$ = Last two digits of $21^{5N} = 01$.\n\nLast two digits of $4^{1000}\
    \ = 76$.\n\nHence, final two digits of $78^{400} = 76 \times 01 = 76 \\Rightarrow$\
    \ tens place digit = 7\n\nAlternatively, as we have seen, (any even number)$2^{20N}$\
    \ will give 76 as the last two digits.\n\n# Solved Example 15\n\nFind the tens\
    \ place digit of $2^{663}$.\n\n**Solution** Last two digits of $2^{663}$ = Last\
    \ two digits of $2^{660} \\times$ Last two digits of $2^3 = 76 \\times 08 = 08$\
    \ (for this multiplication, look at point 6 above).\n\nHence, tens place digit\
    \ = 0.\n\n# Solved Example 16\n\nFind the tens place digit of $58^{1536}$.\n\n\
    **Solution** Tens place digit of $58^{1536}$ = tens place digit of $86^{1536}$.\n\
    \nTens place digit of $86^{1536}$ = tens place digit of $86^{520} \\times$ tens\
    \ place digit of $86^{16} = \\dots 76 \\times$ tens place digit of $86^{16}$.\n\
    \nNow, we will find out the tens place digit of $86^{16}$ separately.\n\nWe have\
    \ already seen that the last two digits of $(M6)^{5N}$, where M is any digit at\
    \ the tens place = 76.\n\nHence, the last two digits of $86^{1536} = 76$.\n\n\
    So, the last two digits of $86^{1536}$ = tens place digit of $86^{1520} \\times$\
    \ tens place digit of $86^{15} \\times$ tens place digit of $86^1 = 76 \\times\
    \ 76 \\times 86 = 36$.\n\nHence, tens place digit = 3.\n\n# SUMMARY\n\nNow, we\
    \ will summarize the whole discussion that we had in Method 2 and define a general\
    \ approach to find out the tens place digit:\n\n+   Step 1 First, see if the number\
    \ is even or odd.\nStep 2 Take only the last two digits of the number. If it is\
    \ an even number\nStep 3 If it is an odd number, let it be. If it is an even number\
    \ write it in two parts: (1) purely even part and (2) purely odd part.\nStep 4\
    \ Write the power in the form of $20N+K$, where N and K are natural numbers.\n\
    \nLast two digits of (odd number ending with 1, 3, 7, 9)$2^{20N} = 01$.\n\nLast\
    \ two digits of (odd number ending with 5)$2^{20N} = 25$.\n\nLast two digits of\
    \ (even number ending with 2, 4, 6, 8)$2^{20N} = 76$."
