    Number of powers of 5 used = 1

    Hence, total number of factors of N = 720 that are cubes = 1 × 1 × 1 = 1.


    # Finding Factors Which are Co-prime to Each Other


    Two numbers are said to be co-prime to each other if their HCF = 1. This can happen
    only if none of the factors of first number (other than 1) is present in the second
    number.


    # Solved Example 6


    How many sets of two factors of N = 72 will be co-prime to each other?


    Solution N = 72 = 2³ × 3² Let us assume that a and b are two factors of 72 in
    such a way that HCF (a, b) = 1. Now making the following combinations:


    Case 1 If HCF of two numbers = 1, then one of the numbers can be taken as 1. The
    value of the other number can be taken as any factor of 72. Example: (1, 1), (1,
    2), (1, 3), ..., (1, 72) = 12 sets.


    Case 2 One number comprises powers of 2 only, and other number comprises powers
    of 3 only.


    | A | B |

    |---|--|

    | 2⁰ | 3¹ |

    | 2² | 3² |

    | 2³ | |'
