    # FACTORS AND MULTIPLES


    If one integer can be divided by another integer for an exact number of times,
    then the first number is said to be a multiple of the second, and the second number
    is said to be a factor of the first.


    For example: 48 is a multiple of 6, because 6 goes into 48 an exact number of
    times (i.e., 8 times in this case). Similarly, 6 is a factor of 48. On the other
    hand, 48 is not a multiple of 5, because 5 does not go into 48 an exact number
    of times. So, 5 is not a factor of 48.


    In other words, remainder obtained when one number A is divisible by B, then B
    is said to be a factor of A. We also understand that:


    +   1. A divides B, quotient obtained Q (or, AQ = B) implies that the quotient
    obtained in this case Q will also divide B, and the quotient in this case = A.


    For example: when 20 is divided by 4, quotient obtained = 5. The essence of the
    whole discussion is the fact that factors will occur in pair.


    Pairs of factors of 20 = (1, 20), (2, 10), (4, 5) = 3 pairs of distinct factors
    ⇒ Total Number of factors = An Even number.


    However, the above information is valid for perfect squares. Let us understand
    it with the help of a perfect square.


    Pair of factors of 36 = (1, 36), (2, 18), (3, 12), (4, 9), (6, 6)


    We can see that the first four pairs of factors are distinct, but (6, 6) is having
    only one distinct factor. Hence, number of factors of 36 = Odd number'
