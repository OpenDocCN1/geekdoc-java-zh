  md: "# # EXPONENTS 5\n\n# ## Learning Objectives\n\nAfter completion of this chapter,\
    \ you should have a thorough understanding of the following:\n\n+   - Indices/exponents\
    \ and its rules\n- Surds and its rules\n- Exponents and methods to find out exponent\
    \ of one number into another\n- Types of questions asked from this chapter in\
    \ CAT and GMAT®\n\n# ## EXPONENTS\n\nExponents or power is a way to show how many\
    \ times a number is multiplied to itself. For example, when we write $y^2$, we\
    \ mean to say that $y$ is multiplied to itself.\n\n$y^3 = y$ is multiplied to\
    \ itself twice more, or a total of three times = $y \times y \times y$.\nIn the\
    \ example above, $y$ is known as base, and 3 is known as exponent or power.\n\n\
    # ## Rules of Exponents\n\n+   1. $a^m \times a^n = a^{m+n}$\n2. $\\frac{a^m}{a^n}\
    \ = a^{m-n}$\n3. $(a^m)^n = a^{mn}$\n4. $a^m \\cdot b^m = (ab)^m$\n5. $\\left(\\\
    frac{a}{b}\right)^m$\n6. $a^0 = 1$\n7. $a^{-b} = \\frac{1}{a^b}$\n8. $an = \\\
    sqrt[n]{a^m}$\n9. $a^{|b|} = |a^b|$\n\nFor example: $2^{3^2}=2^8$ (and not $2^{12}$).\n\
    By convention, we always calculate powers from 'top to bottom'. So if we are given\
    \ with $2^{5^3}$, we first calculate $4^5 (=1024)$, then $3^{1024}$ and finally\
    \ $2^{3^{1024}}$.\n\n10. $a^x = a^y \\Rightarrow x = y [$a$ is not equal to -1\
    \ or 0 or 1]."
