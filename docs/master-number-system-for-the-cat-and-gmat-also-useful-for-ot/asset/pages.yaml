  md: '# Chapter 6


    +   1. On the basis of number of factors, natural number line can be categorized
    into three parts: (a) 1, (b) Prime Number, and (c) Composite Factors


    +   2. Lowest composite number = 4.


    Essence of the whole discussion lies in the fact that total number of factors
    of any natural number = 1 (number 1 is a factor of all the natural numbers) +
    prime factors + composite factors.


    So, once we have done the prime factorization, to find out the number of prime
    factors, we just need to count the number of prime factors present. To calculate
    the number of composite factors, we will subtract the number of prime factors
    and 1 from the total number of factors.


    # Solved Example 4


    Find the number of prime factors and composite factors of N = 720.


    Solution 420 = 2² × 3¹ × 5¹


    Number of prime factors = 4 (namely, 2, 3, 5, 7).


    Total number of factors = (2+1)(1+1)(1+1) = 3 × 2 × 2 × 2 = 24

    So, composite number of factors = Total number of factors – Prime factors – 1
    = 24 – 4 – 19


    # Finding Factors which are Perfect Squares or Cubes or Higher Power


    A number becomes perfect square only when the prime factors of that number have
    even powers. So, a number of the format 2ˣ will be a perfect square only when
    x = 0, 2, 4, 6, 8, etc. Similarly, a number will be a perfect cube when all the
    prime factors of this number have powers divisible by 3. So, a number of the format
    2ˣ will be a cube, only if x = 0, 3, 6, 9 etc.


    # Solved Example 5


    How many factors of the number N = 720 will be: (a) perfect square, (b) cube,
    and (c) perfect square and also a cube?


    Solution N = 720 = 2² × 3³ × 5¹


    (a) For a factor of N = 720 to be a perfect square, it should have only the following
    powers of its prime factors:


    | Powers of 2 | Powers of 3 | Powers of 5 |

    |---|---|---|n| 2⁰ | 3⁰ | 5⁰ |

    | 2² | 3² | |

    | 2⁴ | | |


    Number of powers of 2 used = 3

    Number of powers of 3 used = 2

    Number of powers of 5 used = 1

    Hence, total number of factors of N = 720 that are perfect square = 3 × 2 × 1
    = 6.'
