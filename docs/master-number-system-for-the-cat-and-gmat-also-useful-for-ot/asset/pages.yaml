  md: "# Factors\n\nIn general, if N is any number which can be factorized $N=a^b\
    \ \times b^c \times c^d \times \\dots$, where $a$, $b$ and $c$ are prime numbers.\n\
    \nSum of factors = $\\frac{(a^{b+1}-1)(b^{c+1}-1)(c^{d+1}-1)}{(a-1)(b-1)(c-1)}$\n\
    \nThis formula can be extended for any number of prime numbers. Understand that\
    \ this formula is the sum of $n$ terms of a GP.\n\n# Solved Example 9\n\nFind\
    \ the sum of: (a) prime factors, (b) composite factors, (c) even factors, and\
    \ (d) odd factors of $N=720$.\n\nSolution $N=720 = 2^4 \times 3^2 \times 5^1$\n\
    \n+   (a) For prime factors:\nThere are only 3 prime numbers, 2, 3, and 5; sum\
    \ = 10.\n(b) For composite factors:\nWe have already calculated the sum of all\
    \ the factors = 2418 (in Worked-out Example 8). Composite factors are all the\
    \ factors other than prime factors and 1. So, sum of composite factors = sum of\
    \ all factors - (sum of prime factors) - 1 = $2418 - 10 - 1 = 2407$.\n(c) For\
    \ even factors:\n\n| Powers of 2 | Powers of 3 | Powers of 5 |\n|---|---|---|n|\
    \ $2^1$ | $3^0$ | $5^0$ |\n| $2^2$ | $3^1$ | $5^1$ |\n| $2^3$ | $3^2$ | |\n| $2^4$\
    \ | | |\n\nSo, sum of even factors = $\\frac{2(4-1)}{2-1} \times \\frac{3^3-1}{3-1}\
    \ \times \\frac{5^2-1}{5-1} = 15 \times 13 \times 6 = 2340$.\n\n(d) For odd factors:\n\
    \n| Powers of 2 | Powers of 3 | Powers of 5 |\n|---|---|---|n| $2^0$ | $3^0$ |\
    \ $5^0$ |\n| | $3^1$ | $5^1$ |\n| | $3^2$ | |\n\nSum of odd factors = $(2^0)(3^0+3^1+3^2)(5^0+5^1)$\n\
    \nSo, sum of odd factors = $2^0 \times \\frac{3^3-1}{3-1} \times \\frac{5^2-1}{5-1}\
    \ = 1 \times 13 \times 6 = 78$.\n\nAlternatively, summation of odd factors could\
    \ have been calculated by actually finding the factors too: 1, 3, 5, 9, 15, 45\
    \ = 78.\n\nNote Summation of GP series: $a, ar, ar^2, ar^3, \\dots n$ terms $\t\
    imes a \times \\frac{r^n-1}{r-1}$"
