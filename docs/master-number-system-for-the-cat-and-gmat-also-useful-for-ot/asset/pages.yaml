    move—something on the lines of decision tree analysis through probabilistic calculations.
    And here was the need for faster calculation. So, for ''X'' move placed by Kasparov,
    computer used to analyse how many times this move has been put and respective
    countermoves are having what probability of winning position.


    This might have answered the most universal query of the students—why are we able
    to solve a particular question and not able to solve another question? Its just
    about the moves-solution to every question involves some moves (loosely speaking,
    steps are having the same connotation as moves). If we have the moves ready with
    us from the starting to the end of the solution, we have first response/reaction.
    And so on, third or third response how many moves we have.


    Summarizing, we can solve a question if we have the moves already inside our brain,
    or else we would be required to generate it out at that very moment inside the
    examination hall. Probably this is the single most important reason that a question
    from ''Function Chapter'' seems comparatively easier to a student who has gone
    through maths in 10+2 with respect to a student who has gone through maths in
    his/her 10+2.


    So, how can a student who has not gone through maths can come at par with a student
    who is a maths graduate?


    ![](img/87d1e54eb537564d4ee127eb0f506473_12_0.png)


    And how moves will be generated (the base of this triad)—By going through the
    concepts, and solving not just quantity of questions, but quality of questions
    too.


    Looking upon the pattern of CAT QA for the past years, one can be reasonably sure
    that fetching 40% marks in QA is sufficient to get approximate 97–98 percentile.
    This translates into approx 10 questions. The idea is—if we can have the moves
    ready for 6 questions, for an example, then we would be required to generate moves
