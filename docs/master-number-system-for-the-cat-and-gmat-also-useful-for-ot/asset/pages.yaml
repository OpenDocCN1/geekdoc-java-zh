    # Solved Example I


    A prison has 100 cells inside it. The cells are numbered from 1 to 100 and every
    cell is occupied by one prisoner. One day the jailer decided to release some of
    the prisoners. For this to happen, he defined an algorithm of 100 steps which
    follows:


    +   Step 1 Reverse the position of all the cells which are divisible by 1.

    Step 2 Reverse the position of all the cells which are divisible by 2.

    Step 3 Reverse the position of all the cells which are divisible by 3.


    ......

    Step 99 Reverse the position of all the cells which are divisible by 99.

    Step 100 Reverse the position of all the cells which are divisible by 100.


    Reversing the position of all the cells means that if the cell is closed, open
    and vice versa. Initially, all the cells are closed. After exercising these steps,
    prisoners of all the cells which remain open were released.


    How many prisoners are released?


    +   1. 25 2. 10 3. 5 4. 50 5. 75


    Solution Let us discuss the fate of any particular cell number as per the algorithm:

    Cell Number 45

    Initially closed


    | After Step | After Step | After Step | After Step | After Step | After Step
    |

    |---|---|---|---|---|--|

    | 1 | 2 | 3 | 4 | 5 | 6 |

    | Open | Open | Close | Close | Open | Open |

    | After Step | After Step | After Step | After Step | After Step | After Step
    |

    | 7 | 8 | 9 | 15 | 16 | 45 |

    | Open | Open | Close | Open | Open | Close |'
