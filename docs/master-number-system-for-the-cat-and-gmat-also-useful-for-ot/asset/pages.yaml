  md: '# Factor Theorem


    If g(x) divides f(x), we say that f(x) is divisible by g(x) or g(x) is a factor
    of f(x).


    Factor theorem gives us a method to determine whether a polynomial g(x) is a factor
    of a polynomial f(x) or not without actual division.


    Let f(x) be a polynomial of degree greater than equal to 1 and ''a'' be a real
    number such that f(a)=0, then (x - a) is a factor of f(x), Conversely, if (x -
    a) is a factor of f(x), then f(x)=0.


    Note


    +   1. (x + a) is a factor of a polynomial f(x) if f-a=0.

    2. (ax - b) is a factor of a polynomial f(x) if f-b/a=0.

    3. ax + b is a factor of a polynomial f(x) if f-b/a=0.

    4. (x - a) - (x - b) is a factor of a polynomial f(x) if f(a)=0 and f(b)=0.


