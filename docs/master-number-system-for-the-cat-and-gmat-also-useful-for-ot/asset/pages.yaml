    | 11 | 99 | 10 | 11 | -1 |

    | 13 | 39 | 4 | 91 | -9 |

    | 17 | 119 | 12 | 51 | -5 |

    | 19 | 19 | 2 | 171 | -17 |

    | 23 | 69 | 7 | 161 | -16 |

    | 29 | 29 | 3 | 261 | -26 |'
