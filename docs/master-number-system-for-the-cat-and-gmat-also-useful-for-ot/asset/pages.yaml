  md: '# All About Numbers


    Now we will see the types of natural numbers:


    All the natural numbers greater than 1 has at least two factors—and on the basis
    of factors we can categorize natural numbers greater than 1 either as prime number
    or composite number.


    # Prime Numbers


    Any number that has exactly two distinct factors is known as prime number. In
    other words, any number which is divisible by 1 and itself is only a prime number.
    For example, 2 is a prime number, because 2 is divisible by 1 and 2 only (two
    distinct factors). Similarly, 103 is a prime number because it is divisible by
    1 and 103 only. 2 is the only even prime number, and all the prime numbers are
    odd.


    In that way prime numbers are building blocks of numbers, i.e., prime numbers
    are used to build the other numbers—known as composite numbers.


    # Solved Example II


    A, B, C, D and E are prime numbers, not necessarily consecutive. Sum of these
    five prime numbers = 264. It is also known that A < B < C < D < E. What is the
    value of $A^5?


    Solution You should not try to solve this by trying to find the actual values
    of prime numbers, rather think of the logic behind the question.


    Summation of five prime numbers = 264 = Even number.


    We know that 2, all the other prime numbers are odd. Since summation of five prime
    numbers is even, hence, four of these prime numbers are odd and one is even.


    Since A is the lowest prime number, hence A = Even prime number = 2.


    So, $A^5 = 2^5 = 32$.


    # Properties of Prime Numbers


    +   1. There are infinite prime numbers.

    2. There are infinite set of prime numbers such that, difference between them
    = 2 (represented as N and N + 2, where N is a prime number). For example, 3, 5,
    and 7, 11 and etc. Set of these two prime numbers are known as ''Twin Prime''.

    3. There is exactly one set of prime number triplet, i.e., N, N + 2, N + 4, where
    N is a prime.

    4. All the natural numbers greater than 1 has at least one prime factor.

    5. If a number P has a prime number < P, then it has another prime divisor M ≤
    P.

    6. All the prime numbers greater than 3 are of the form 6n ± 1. It means that
    the prime numbers will give either a remainder of +1 or -1 when divided by 6.
    Understand that this is only a sufficient condition and not necessary one. In
    other words, if a number is a prime number, it will be of the form 6n ± 1, then
    its going to be a prime number. For example, 25 = 6n + 1, but 25 is not a prime
    number.'
