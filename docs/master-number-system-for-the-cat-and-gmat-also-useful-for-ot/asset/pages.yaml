  md: '# Chapter 2


    3. If K = HCF (a, b) then HCF (a/k, b/k) = 1 (where all the digits are non-zero).

    4. If a > b > 0, and a = b + r, then HCF (a, b) = HCF (b, r).

    Let understand this with the help of an example:


    Compute HCF

    HCF (803, 154) = HCF (154, 33) since 803 = 154 · 5 + 33

    HCF (154, 33) = HCF (33, 22) since 154 = 33 · 4 + 22

    HCF (33, 22) = HCF (22, 11) since 33 = 22 · 1 + 11

    HCF (22, 11) = 11 = 11 · 2 + 0

    Hence, HCF (803, 154).


    This is also known as Euclidean Algorithm for finding HCF.

    5. If HCF (a, b) = N (where a and b are natural numbers with a > b), then HCF
    of [b, a + b] = HCF of [b, (a - b)] = N


    For example: HCF of (28, 20) = 4

    Hence, HCF of [20, (28 + 20)] = HCF of [20, (28 - 20)] = 4

    6. For all a, b, n (non-zero values), HCF (na, nb) = n HCF (a, b). Same rule is
    applicable for LCM too.


    LCM (na, nb) = n LCM (a, b)

    For example: HCF (15, 25) = 5, hence HCF (15 × 5, 25 × 5) = 5 × 10 = 50

    Similarly, LCM (15, 25) = 25 × 3, hence LCM (15 × 10, 25 × 3) = 25 × 30 = 750


