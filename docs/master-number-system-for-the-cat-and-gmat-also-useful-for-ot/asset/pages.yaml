  md: "# Solved Example 4\n\nWhat is the remainder when $4^{100}$ is divided by 7?\n\
    \nSolution Remainder obtained from $\\frac{4^{100}}{7}\\frac{16^{50}}{7} =$ Remainder\
    \ obtained from $\\frac{2^{50}}{7}\\frac{32^{10}}{7} =$ Remainder obtained.\n\n\
    Ideally, we are using this method to find out the remainder, we should be constantly\
    \ lookout for an expression giving us remainder either +1 or -1. Although it is\
    \ not essential that we always get remainder +1 or -1 for every expression. We\
    \ will discuss this again while discussing the pattern method of finding remainder.\
    \ Let us see that the same question becomes quite easier now:\n\nRemainder obtained\
    \ from $\\frac{4^{100}}{7} =$ Remainder obtained from $\\frac{[4^3]^{33} \times\
    \ 4^1}{7} =$ Remainder obtained from = $\\frac{1^{33} \times 4}{7} =$ Remainder\
    \ obtained from $\\frac{4}{7} = 4$.\n\nIts wrong to calculate the remainder by\
    \ reducing the fraction to its lower terms. For example, look at the following\
    \ fractions:\n\n+   - (a) $\\frac{1}{2}$ (b) $\\frac{10}{20}$ (c) $\\frac{100}{200}$\n\
    \nDespite the fact that all the fractions taken here are same, remainder obtained\
    \ in the cases are going to be different,\n\nRemainder obtained in (a) $\\frac{1}{2}\
    \ = 1$.\n\nRemainder obtained in (b) $\\frac{10}{20} = 10$.\n\nRemainder obtained\
    \ in (c) $\\frac{100}{200} = 100$.\n\n# Solved Example 5\n\n$1! + 2! + 3! + 4!\
    \ + 5! + \\dots + 1000!$\n\n```\n$2^3 \times 5^2$\n```\n\n+   (a) 3 (b) 1 (c)\
    \ 5 (d) 4 (e) None of these\n\nSolution Denominator = $2^3 \times 3^1 \times 5^1\
    \ = 120 = 5!$.\n\nSo the remainder will come only from $1! + 2! + 3! + 4!$. Hence,\
    \ not remainder $1! + 2! + 3! + 4! = 33$ (since numerator is less than denominator,\
    \ numerator itself will be the remainder).\n\nSummarizing the discussion regarding\
    \ the property of remainder: Let remainder obtained when 'a' is divided by $n=b$\
    \ and remainder obtained when 'c' is divided by $n=d$."
