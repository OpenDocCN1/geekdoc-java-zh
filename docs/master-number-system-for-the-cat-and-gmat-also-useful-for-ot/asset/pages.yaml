    \ and $s$ are odd prime numbers.\n\nTo have the lowest possible value of $N$,\
    \ we should take the lowest possible value of $p, q$, $r$ and $s$.\n\nLowest prime\
    \ numbers are $3, 5, 7, 11$\n\nSo, $N=11^3 \times 7^5 \times 5^7$\n\nNow the trade-off\
    \ that we can do is possible by increasing the power of 3 and eliminating 11.\n\
    \nNow we would go for $3^5$\n\nTherefore, $M=7^1 \times 5^2 \times 3^5 \\Rightarrow$\
    \ we are multiplying by $3 \times 5$ after removing 11, so this number is going\
    \ to be greater than $N$.\n\nTherefore, lowest value $=11^1 \times 7^1 \times\
    \ 5^3 \times 3^2 = 3465$\n\n# Solved Example 19\n\nNumber $A$ has 24 factors and\
    \ number $A \times B$ has 105 factors. What is the least possible number of factors\
    \ that $B$ can have?\n\nSolution For least number of factors of $B$, we should\
    \ try to common factors in each of $A$ and $B$ as much as possible.\n\nWe need\
    \ to decide two things:\n\n+   1 How many prime factors are there in $A$ and $B$\
    \ individually\n2 What are the powers of those prime factors.\n\nLet us start\
    \ with there is only one prime factor, then $A$ has to be of form $P^{23}\\Rightarrow$\
    \ total number of factors of $A \times B$ would be divisible by 24, which is not\
    \ the case. So, we can conclude that $A$ does not have one prime factor.\n\nIf\
    \ there are two prime factors $P$ and $Q$, then $A$ may have different formats:\
    \ $P^1 \times Q^7$ or $P^3 \times Q^5$ (or interchangeably $P^5 \times Q^3$)\n\
    \nWe will now verify this one by one for the factors of $A \times B$:\n\n$A=P^1\
    \ \times Q^7$\n\n$A \times B=P^1 \times Q^{14} \\Rightarrow$ Total number of factors\
    \ = 105. $B=P^0 \times Q^7 \\Rightarrow$ Total number of factors = 24..\n\nLet\
    \ us check for $A=P^3 \times Q^5$\n\n$A \times B=P^4 \times Q^{14} \\Rightarrow\
    \ B=P^3 \times Q^9 \\Rightarrow$ total number of factors of $B=4 \times 10 = 40$.\n\
    \n$A \times B$ can also be written as $P^4 \times Q^6 \times R^2 \\Rightarrow$\
    \ total number of factors of $A \times B=5 \times 7 \times 3 = 105$. Thus, $B=P\
    \ \times Q \times R^2 \\Rightarrow$ Total number of factors of $B=2 \times 2 \t\
    imes 3 = 12$.\n\nThus, the minimum number of factors of $B$ is 12."
