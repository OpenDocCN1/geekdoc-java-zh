  md: '# All About Numbers


    Whatever sign we put between two odd numbers, resultant of 50 odd numbers = Even,
    and similarly, sign we put between two even numbers, resultant of 50 even numbers
    = Even.


    Hence the next result is Even + Even or Even – Even. In any case, net result =
    Even.


    Hence A will win.


    We can also see here that ‘+’ sign or ‘-'' sign does not matter here. Irrespective
    of the signs put by A or B, A is always going to win.


    # Solved Example 6


    When 98 is added to a perfect square, another perfect square is obtained. How
    many such pairs of perfect squares exist?


    # Solution


    $A² = B² + 98$

    $\Rightarrow A² - B² = 98$

    $\Rightarrow (A - B) (A + B) = 98$


    Different possibilities for A and B are:


    | A | B |

    | Even | Even |

    | Odd | Odd |

    | Even | Even |

    | Odd | Even |


    Consequently, different possibilities for A² and B² are:


    | A | B | A² - B² | Remarks |

    | Even | Even | Even | May be possible |

    | Odd | Odd | Even | May be possible |

    | Even | Odd | Odd | Not possible (the difference = 98) |

    | Odd | Even | Odd | Not possible (the difference = 98) |


    If both A and B are even, then A² and B² are going to be multiples of 4 (even²).
    Hence, A² – B² = 4k ≠ 98 ⇒ So, A = Even and B = Even are not possible.


    Last possibility for this calculation to be true, A and B both are odd. Let us
    verify that: If A and B are odd, then (A – B) and (A + B) will be even. product
    of (A – B) (A + B) = Even × Even = 4K ≠ 98 ⇒ So, A = Odd and B = Odd are not possible.
    Hence, we can conclude that no such case exists.


