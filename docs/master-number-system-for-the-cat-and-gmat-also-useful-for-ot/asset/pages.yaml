  md: "# Chapter 7\n\n# # Divisibility Rule of the Numbers on Base Other Than 10\n\
    \nThe rules that we have discussed till now valid only for the numbers on base\
    \ 10. If we take any other base, divisibility rule of the number might change.\
    \ For example, divisibility rule of $9_{10}$ is not same as the divisibility rule\
    \ of $9_{12}$. Similarly, divisibility rule of $5_{10}$ is not same as the divisibility\
    \ rule of $5_c$.\n\nAlthough, seed number method exists for base other than 10.\
    \ Only difference that occurs in the fact that now we will find out the multiple\
    \ $KN+1$, where K is the new base, instead of finding $10N \\pm 1$. For example\
    \ on base 7, we will not find out the multiples of $7N \\pm 1$.\n\n[I am getting\
    \ into too much details of divisibility rule of the numbers on the base other\
    \ than 10, because I do not see CAT and B School examinations moving in that direction.]\n\
    \n# # Some of the Generalizations\n\n+   - Divisibility rule of $9_{10}$ = Sum\
    \ of the digits should be divisible by 9.\n\nThis rule is applicable for $N_n$\
    \ (For N on base $N+1$).\n\nSo, divisibility rule of $8_9$ = Sum of the digits\
    \ of the number written on base 9 should be divisible by 8.\n\nDivisibility rule\
    \ of $7_8$ = Sum of the digits of the number written on base 8 should be divisible\
    \ by 7.\n\nDivisibility rule of $2_3$ = Sum of the digits of the number written\
    \ on base 3 should be divisible by 2.\n\n# # Solved Example 6\n\nThe following\
    \ numbers are written on base 6. Which of the following numbers are divisible\
    \ by 5?,\n\n+   (a) $1234_6$ (b) $2153_6$\n\nSolution Divisibility rule of $5_6$\
    \ = Sum of the digits of the number written on base 6 should be divisible by 5.\n\
    \nLet us verify the numbers one by one.\n\n+   (a) $1234_6 = 1 + 2 + 3 + 4 = 10$\
    \ which is divisible by 5 (we are not required to convert to base 10). Hence,\
    \ becomes divisible by 5.\n\nAlternatively, we can convert the number to base\
    \ 10. $1234_6 = 1 \times 6^3 + 2 \times 6^2 + 3 \times 6^1 + 4 \times 6^0 = 310$\
    \ = Divisible by 5.\n\n+   (b) $21534_6$ Sum of digits = $2 + 1 + 5 + 3 + 4 =\
    \ 15$ which is divisible by 5. Hence, the number is divisible by 5.\n\n+   (c)\
    \ $315_6$ Sum of digits = $3 + 1 + 5 = 9$ which is not divisible by 5. Hence,\
    \ the number is divisible by 5."
