    +   - Unit digit—Methods to find out the unit digit

    - Tens digit—Methods to find out the tens digit

    - Cyclicity of digits/numbers

    - Process to find out hundred digits and beyond

    - Types of questions asked from this chapter in the CAT and GMAT®


    In this chapter, we are going to learn the methods to find out the digit/tens
    digit/hundreds digit and beyond. Before we move ahead, let us understand some
    of the basics:


    +   1. Place value of a number—Consider the number 5201862:


    | Digit | 5 | 2 | 0 | 1 | 8 | 6 | 2 |

    | Place Value | Ten lacs/Million | Lacs | Ten Thousand | Thousand | Hundred |
    Tens | Unit |


    +   2. In multiplication and addition, to calculate the unit digit, we should
    focus only upon unit digit. It also means that we should not focus upon the tens
    digits and other digits on the left hand side.


    For example: Unit digit of AB2 × CDE4 = 8. It is independent of the values of
    A, B, C, D and E.


    Unit digit of AB2 + CDE4 = 6. It is independent of the values of A, B, C, D and
    E.

    Similarly, while calculating tens digit, we should focus only upon the tens place
    and unit digit, and not on any digit to the left-hand side of tens digit.'
