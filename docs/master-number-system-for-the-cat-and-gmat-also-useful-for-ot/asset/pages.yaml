  md: "# Basic Framework of Remainder: Different Cases\n\n+   1. When $N$ is a number\
    \ divisible by 7, it can be written as, $7K=N$, where $K$ is the quotient.\n2.\
    \ When $N$ is divided by 7, remainder obtained is $3 \\Rightarrow$ it can be written\
    \ as, $7K+3=N$, where $K$ is the quotient.\n3. When $N$ is divided by 7, remainder\
    \ obtained is $3$, is equivalent of saying remainder obtained is $(-4)$, divided\
    \ by 7. It can be understood that $N$ is divided by 7, remainder obtained is $3\
    \ \\Rightarrow N$ is 3 more than a multiple of $7 \\Rightarrow$ So $N$ is 4 short\
    \ of multiple of 7. So remainder obtained = $-4$.\n4. When divided by 8, different\
    \ remainders can be obtained = $0, 1, 2, 3, 4, 5, 6, 7$ (8 different remainders).\n\
    \nSimilarly, when divided by 5, different remainders can be obtained = $0, 1,\
    \ 2, 3, 4$ (5 different remainders).\n\n# Properties of Remainder\n\nIt means\
    \ that remainder can be obtained by breaking down a number in two or more than\
    \ parts, and then calculating the resultant.\n\n# Solved Example I\n\nWhat is\
    \ the remainder when 40 is divided by 7?\n\nSolution\n$40 = 5 \times 7 + 5 [Dividend\
    \ = \text{Quotient} \times \text{Divisor} + \text{Remainder}]$\n\nUsing the property\
    \ of remainder being additive, we can break down 40 in two or more than parts,\
    \ find the individual remainder and finally add up those individual remainders\
    \ to get the final remainder.\n\n$\\frac{40}{7} = \\frac{35}{7} + \\frac{3+4}{7}\
    \ + \\frac{30+10}{7} + \\frac{20+8}{7}$\n\nIt can be seen in the above example\
    \ that in each of the cases remainder obtained is going to be same.\n\n$\\frac{35}{7}\
    \ = \\frac{35}{7} + \\frac{5}{7} (\text{Remainder obtained individually} = 0 +\
    \ 5 = 5)$.\n\nWe could have even written 40 as one number being subtracted from\
    \ another too.\n\n$\\frac{40}{7} = \\frac{50-10}{7} - \\frac{10}{7}$\n\nRemainder\
    \ obtained from $\\frac{50-10}{7} = \\frac{40}{7}$\n\nRemainder obtained from\
    \ $\\frac{50}{7} = 1$ and remainder obtained from $\\frac{10}{7} = 3$\n\nSo net\
    \ remainder = $1 - 3 = -2$."
