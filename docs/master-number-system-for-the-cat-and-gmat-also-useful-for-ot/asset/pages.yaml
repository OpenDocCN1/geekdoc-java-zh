    # Real Number Line


    Real number line (in short also known as number line) consists of the union of
    the rational and irrational numbers.


    Every real number can be associated with a single point on the real number line.


    ![](img/87d1e54eb537564d4ee127eb0f506473_23_0.png)


    +   It extends from infinity (-) on the left side to infinity (+) on the right
    side.


    +   Numbers on the right side are always larger than the numbers on the left side.


    +   When we add operation, we move to the right hand side of number lines.

    For example: when we add 4 units to 3 (3 + 4), we are required to move 4 units
    right side to 3, and landing up at 7.


    +   When we do subtraction operation, we move to the left hand side of number
    lines.

    For example: when we subtract 3 units from 4 (4 – 3), we are required to move
    3 units left hand side to 4, and landing up at 1.'
