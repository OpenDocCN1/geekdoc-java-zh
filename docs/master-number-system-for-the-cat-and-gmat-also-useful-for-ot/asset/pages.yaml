  md: '# Factors 6.5


    To construct the even factors (factors that are even numbers), we cannot use 2⁰
    (2⁰ = 1 = odd number), so to construct even number, total different powers of
    2 = 4, total different powers of 3 = 3, and total different powers of 5 = 2.


    Hence, total number of even factors = $4 \times 3 \times 2 = 24$


    To construct the odd factors (i.e., factors that are odd numbers), the only power
    of 2 that can be used = $2⁰$, total different powers of 2 = 4, total different
    powers of 3 = 3, and total different powers of 5 = 2.


    Hence, total number of odd factors = $1 \times 3 \times 2 = 6$


    Alternatively, once either of odd factors or even factors has been calculated,
    the other one can be calculated by subtracting it from total number of factors.


    Alternatively, it can also be seen that there are five powers of 2 to be used
    to construct the total number of factors $\Rightarrow$ each of the powers from
    $2⁰$ to $2⁴$ will be used for exactly same time. Hence, $2⁰$ will occur in $\frac{30}{5}
    = 6$ factors (total factors = 30/different powers of 2 to be used).


    Similarly, $2¹$ will also occur in $\frac{30}{5} = 6$ factors = 2¹ will also occur
    in $\frac{30}{5} = 6$ factors, and so on ...


    By generalizing the above discussion:

    If, $N = 2^x \times p^y \times r^z$

    Total number of even factors = $(x)(y+1)(z+1)$

    Total number of odd factors = $(1)(y+1)(z+1)$


