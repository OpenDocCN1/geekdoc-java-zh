  md: 'format of 10N + 1 or 10N – 1 and N is known as the seed of prime number. Seed
    numbers are not negative in the case of +1 and positive in the case of –1. For
    example, in case of 13, multiples of the format 10N ± 1 = 39, 91.

    39 = 4 × 10 – 1 ⇒ Seed Number = 4

    91 = 9 × 10 + 1 ⇒ Seed Number = -9

    So, the seed number of 13 is 4 and (-9).


    # How to Use Seed Number to Test Divisibility?


    If the seed number is N, the divisibility rule is A + NB, and if the seed number
    = (−N), then the divisibility rule is A – NB.


    # Solved Example 5


    Check if the number 24635 is divisible by 19.


    Solution Seed number of 19 is 2 – 17. So, the divisibility rules for 19 are: A
    + 2B and A – 17B. We can use either of these to check the divisibility.

    Unit digit the given number is B, and all the remaining digits = A.

    So, in the case of 24635, B = 5, and A = 2463, and we are using A + 2B divisibility
    rule.

    The rule says if 24635 is divisible by 19, then A + 2B = 2463 + 2 × 5 = 2473 will
    also be divisible by 19 and vice versa. That is, if A + 2B = 2463 + 2 × 5 = 2473
    is divisible by 19, original number 24635 will also be divisible by 19. If A +
    2B = 2463 + 2 × 5 = 2473 is not divisible by 19, then 2473 is not divisible by
    19 ⇒ 2463 will not be divisible by 19.

    We can go a stage further. Instead of dividing 2473 by 19, we can take 247 = A,
    and 3 = B.

    So, A + 2B = 247 + 6 = 253. We can see that 253 is not divisible by 19 ⇒ 2473
    is not divisible by 19.

    Instead of A + 2B, we could have used A – 17B as the divisibility rule. Although
    it can be seen that it would lead to slightly different calculation than the current
    one.

    Seed number of the prime numbers:


