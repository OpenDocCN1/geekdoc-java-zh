    # Solved Example 7


    How many different HCF islare possible for the numbers N and N + 10 (N is a natural
    number)?


    Solution Assuming different values of N here may not serve the purpose, as it
    will keep on giving different values of HCFs.


    For example: if we take N = 1, then the HCF (1, 11) = 1.


    Similarly, if we take N = 10, then the HCF (10, 20) = 20.


    Similarly, if we take N = 12, then the HCF (12, 22) = 2.


    So, the point is that we do not get exact number of different HCF by assuming
    values. Despite we might get some of the HCFs repeating after taking different
    values of N, its difficult to ensure that we get only those values of HCF.


    Hence, by summing the values, probably it is difficult to count exact number different
    HCF. So, instead of going through the method of plugging in the values, we will
    go through the process that can be scaled up by any.


    Let us difference method of finding HCF.


    We say that the HCF of N and (N + 10) = HCF of N and (N + 10 − N) = HCF of N and
    10. Now, it can be seen that possible values of HCF can be the factors of 10.


    So, total number of HCF = Factor of numbers 10 = 4 (Namely, 1, 2, 5, 10)


