  md: '# Chapter 4


    To generate the counting numbers now, we begin writing the numbers from 0, then
    1, 2, 3, 4, 5, 6, 7. Once we have written down 7, we do not have any single digit
    to take count forward. So, to form a number larger than 7, we are required to
    resort to two digit numbers here only. And what is the lowest two digit natural
    number? Obviously, it is 10. Then, we move it forward to 11, 12, 13, 14, 15, 16,
    17. We do not have ''18'' or ''19'' in this system, since we do not have digits
    8 and 9, or 8 and 9 are not allowed to be used. So, from 17, we will directly
    jump to 20, 21, 22, 23, 24, 25, 26, 27, 30, ..., 50, 60, 70, 71, 72, 73, 74, 75,
    76, 77. Obviously, we do not have any 78 or 79 or 80, etc., in this system, as
    reasoned above. To make a number larger than 77, we now move on to 3-digits number
    beginning with 100.


    Similarly, had there been only 6-digits (0-5) to write down the numbers, numbers
    would have formed like: 0, 1, 2, 3, 4, 5, 10, 11, 12, 13, 14, 15, 20, 21, 22,
    23, 24, 25, 30, ..., 54, 55, 100, 101, ..., 554, 555, 1000, and so on.


    Alternatively, process of number generation can also be observed with the help
    of the example of speedometer attached to vehicles.


    Initially, when the vehicle has been rolled out, speedometer shows = 0000. First
    of all, the rightmost digit place from 0 to 9, and once this becomes 9, the second
    rightmost digit becomes 1 and the rightmost digit shows = 0. Similarly, the rightmost
    digit keeps on moving from 0 to 9, and for every rotation, the second rightmost
    digit keeps moving on one unit ahead.


    So, beginning from 000, it moves on 010, then 020, then 090, then 099, then 100,
    and so on.


    Now consider a different case—there is another vehicle B having speedometer with
    only 7 digits from 0 to 6, vehicle A having speedometer with 0 to 9 digits, and
    vehicle C with only 4 digits from 0 to 3.


    Actual distance covered and data shown by both the speedometers is tabulated below:


