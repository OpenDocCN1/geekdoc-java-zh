    List of 1st few composite numbers:


    | Number | 4 | 6 | 8 | 9 | 10 | 12 | 14 | 15 |

    | --- |---|---|---|---|---|---|---||}{

    | Prime factorization | $2^2$ | $2! \times 3!$ | $2^3$ | $3^2$ | $2! \times 5!$
    | $2^2 \times 3!$ | $2! \times 7!$ | $3^3 \times 5^1$ |

    | Number of factors | 3 | 4 | 4 | 3 | 4 | 6 | 4 | 4 |


