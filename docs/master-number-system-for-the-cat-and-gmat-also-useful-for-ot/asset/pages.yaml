  md: '# Data Sufficiency


    # Understanding the options:


    +   (a) Statement (1) alone is sufficient, but statement (2) alone is NOT sufficient.

    (b) Statement (2) alone is sufficient, but statement (1) alone is NOT sufficient.

    (c) Both the statements together are sufficient, but neither alone is sufficient.

    (d) Each statement alone is sufficient.

    (e) Statement (1) and (2) are NOT sufficient.


    Option (a): You should choose option (a) as the answer if question can be answered
    by using statement (1) (without statement 2), but cannot be answered by using
    statement (2) alone.


    Option (b): You should choose option (b) as the answer if question can be answered
    by using statement (2) alone (without statement 1), but cannot be answered by
    using statement (1) alone (without statement 2).


    Option (c): You should choose option (c) as the answer if the question cannot
    be answered by any of the statements, but can be answered only by using both the
    statements together.


    Option (d): You should choose option (d) as the answer if question can be answered
    by statement (1) (without statement 2) as well as can be answered by using statement
    (2) alone (without statement 1).


    Option (e): You should choose option (e) as the answer if the question cannot
    be answered by any statement alone or even by using both the statements.


    # APPROACHING A DATA SUFFICIENCY QUESTION


    There are two words involved in Data Sufficiency. These are, ‘data’ and ‘sufficiency’.
    In every question of Data Sufficiency, you are going to get a question followed
    by two statements (or data). Using the two statements (or data) given in the question,
    you will be required to find out if the data given is sufficient or not to solve
    the question.


    Let us understand this with the help of the following examples.


    # Solved Example I


    Is x divisible by 50?


    Statement 1: x is divisible by 100.

    Statement 2: x is divisible by 10.


    +   (a) Statement (1) alone is sufficient, but statement (2) alone is NOT sufficient.

    (b) Statement (2) alone is sufficient, but statement (1) alone is NOT sufficient.

    (c) Both the statements together are sufficient, but neither alone is sufficient.

    (d) Each statement alone is sufficient.

    (e) Statement (1) and (2) together are NOT sufficient.'
