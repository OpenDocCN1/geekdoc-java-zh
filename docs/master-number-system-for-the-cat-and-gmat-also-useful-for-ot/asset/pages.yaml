  md: '# Chapter 5


    25 = 5^2; 30 = 5^1 \times K (we are interested in counting only the number of
    5s, and it does notnmatter that it is multiplied to which number. So we write
    K instead of 6); 35 = 5^1 \times L;

    40 = 5^2 \times M; 42 = 5^0 \times N; 45 = 5^1 \times P$.


    Hence, total number of 5''s present in 25 \times 30 \times 35 \times 40 \times
    42 \times 45 = 5^2 \times 5^1 \times 5^1 \times 5^0 \times Q = 5^5 \times Q.


    So, the maximum power of 5 that will divide (25 \times 30 \times 35 \times 40
    \times 42 \times 45) = 6.


    # Solved Example 2


    What is the maximum power of 10 that will divide (25 \times 30 \times 35 \times
    40 \times 42 \times 45)?


    Solution 10 = 2^1 \times 5^1. To answer this question, we are required to count
    the number of sets (2''s and 5''s) present in 25 \times 30 \times 35 \times 40
    \times 42.


    We have already counted that there are five 5''s present. We are required to find
    out the number of 2''s in (25 \times 30 \times 35 \times 40 \times 42).

    25, 35 and 45 do not contain any 2.


    30 = 2^1 \times K\n40 = 2^2 \times M\n42 = 2^1 \times N


    So, (25 \times 30 \times 35 \times 40 \times 42 \times 45) = 2^1 \times 2^2 \times
    M \times 2^1 \times 2^5 \times Q

    Number of times (25 \times 30 \times 35 \times 40 \times 42 \times 45) is divisible
    by 10 = Number of times (35 \times 35 \times 40 \times 42 \times 45) is divisible
    by 2^1 (or in other way, number of sets of one 2 and 5 can be made).


    Number of sets of 2 and 5 can be made = minimum of power of 2 or 5 = min (5, 6)
    = 5

    Why do we take the minimum of exponent of 2 and 5 while making sets of 2 and 5?
    It can be understood in the following way—Let you have 5 left feet, and 6 right
    feet. Number of people who can wear these shoes = 5 people.


    # Solved Example 3


    What is the maximum power of 10 that will divide (25^{70} \times 30^{120} \times
    35 \times 40 \times 42 \times 45)?


    Solution 10 = 2^1 \times 5^1. To answer this question, we are required to count
    the number of sets (2''s and 5''s) present in (25^{70} \times 30^{120} \times
    35 \times 40 \times 42).


    Total number of 5''s in 25^{70} = 70 \times 140

    Total number of 5''s in 30^{120} = 120

    Total number of 5''s in 35 = 35 = Total number of 5''s in 40 = Total number of
    5''s in 45 = 1

    Total number of 5''s in 42 = 0


    Total number of 5''s in 25^{70} \times 30^{120} \times 35 \times 40 \times 42
    = 140 + 120 + 3 + 0 = 263

    Now we will count the number of 2''s.


    Total number of 2''s in 25^{70} = Total number of 2''s in 35 = Total number of
    2''s in 45 = 0

    Total number of 2''s in 30^{120} = 120

    Total number of 2''s in 42 = 1'
