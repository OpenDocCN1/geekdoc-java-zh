    # Irrational Numbers


    Any real number that is not rational is irrational. An irrational number is a
    number that cannot be expressed as a fraction $\frac{p}{q}$ for any integer $p$
    and $q$. Irrational numbers have decimal expansions that neither terminate nor
    periodic.


    The most famous irrational number is $\sqrt{2}$, also known as Pythagoras’s constant.
    Real numbers are also defined as the set of rational and irrational numbers.


    # Solved Example 3


    Identify which of the following are rational numbers?


    +   (a) $\frac{5}{9}$

    (b) 0.33333 (3 is repeating till infinity)

    (c) $\sqrt{2}$

    (d) $\frac{22}{7}$

    (e) $\pi$

    (f) 0.573573573 (573 is repeating till infinity)

    (g) 5.63796246067726496783465211 (till infinity)

    (h) $(\sqrt{5})^{100}$

    (i) $(\sqrt{5})^{100} + \frac{1}{(\sqrt{5})^{100}}$


    # Solution


    +   (b) 0.3333333333333 (3 is repeating till infinity) = $\frac{3}{9}$ = Rational
    number.

    (c) $\sqrt{2}$ cannot be written in the form of $\frac{p}{q}$, where $p$ and $q$
    are integers ($q \neq 0$). Hence, irrational number.

    (d) $\frac{22}{7}$ is in the form of $\frac{p}{q}$. Hence, rational number.

    (e) Irrational number $\pi(\frac{22}{7})$ is only an approximate value, and not
    the exact value. Hence, No.'
