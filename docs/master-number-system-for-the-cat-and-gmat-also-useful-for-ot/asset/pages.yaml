    +   1. What is the HCF of two natural numbers x and y?

    Statement 1: LCM of (x, y) = 73

    Statement 2: x ≠ y.

    (a) Statement (1) alone is sufficient, but statement (2) alone is NOT sufficient.

    (b) Statement (2) alone is sufficient, but statement (1) alone is NOT sufficient.

    (c) Both the statements together are sufficient, but neither alone is sufficient.

    (d) Each statement alone is sufficient.

    (e) Statement (1) and (2) together are NOT sufficient.


    +   2. What is the HCF of two natural numbers x and y?

    Statement 1: LCM of (x, y) = 72

    Statement 2: x ≠ y.

    (a) Statement (1) alone is sufficient, but statement (2) alone is NOT sufficient.

    (b) Statement (2) alone is sufficient, but statement (1) alone is NOT sufficient.

    (c) Both the statements together are sufficient, but neither alone is sufficient.

    (d) Each statement alone is sufficient.

    (e) Statement (1) and (2) together are NOT sufficient.


    +   3. Product of two natural numbers x and y is 36. What is the value of LCM
    (x, y)?


