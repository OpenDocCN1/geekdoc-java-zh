    \ we need to identify which prime number is coming up with what power? At the\
    \ onset, it can be seen that there are going to be few zeroes. So, at first we\
    \ will calculate the number of zeroes, and then the first digit coming after the\
    \ zeroes (at the end) will be the last non-zero digit.\n\n$28! = 2^{25} \times\
    \ 3^{13} \times 5^6 \times 7^4 \times 11 \times 13 \times 17 \times 19 \times\
    \ 23$.\n\nSince there are 6 sets of 5 and 2, this number will have 6 zeroes at\
    \ the end. So, we would remove these six zeroes from the end of 28! And whatever\
    \ digit is obtained at the end will be the last non-zero digit. So, we would remove\
    \ 6 2's and 6 5's from the prime factorization of the number."
