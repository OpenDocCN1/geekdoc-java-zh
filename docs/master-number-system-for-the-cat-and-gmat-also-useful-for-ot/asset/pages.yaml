    \ Remainder Method\n\nWhen we divide a number by 1000, remainder obtained is going\
    \ to be the last three digits of that number.\n\nFor example:\n\n+   (i) Last\
    \ three digits of 53458 = 458 = Remainder obtained when 53458 is divided by 1000.\n\
    \n+   (ii) Last three digits of 5621 × 1047 × 218 = Last three digits of 621 ×\
    \ 47 × 218 = Remainder obtained when $\\frac{621 \times 47 \times 218}{1000} =\
    \ 766$\n\nSo, unit digit of 5621 × 1047 × 218 = 6.\n\nTens digit of 5621 × 1047\
    \ × 218 = 6.\n\nHundreds digit of 5621 × 1047 × 218 = 7.\n\n# Solved Example 19\n\
    \nFind hundreds digit of 1! × 2! × 3! × ... × 10!\n\nSolution We can see that\
