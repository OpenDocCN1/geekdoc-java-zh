    \ of (M6)$^{SN}$, where M is any digit at the tens place = 76.\n3. If it is the\
    \ unit place of any number, For example 24, 44, etc., then this number raised\
    \ to every power that is a multiple of 5, but not a multiple of 10 (in other words,\
    \ odd multiples of 5) will give 24 as the last two digits. Last two digits of\
    \ (M4)$^{N}$, where M is any digit at the tens place = 24. It can also be concluded\
    \ from here that (M4)$^{10}$ will give 76 as the last two digits. For example,\
    \ last two digits of $38^{3} =$ last two digits of $38^{15} = 24$.\n4. Last two\
    \ digits of $76^N$, where N is any natural number = 76.\n5. Last two digits of\
    \ $24^{2N}$, where N is any natural number = 76 (N = 1, 2, 3, $\\dots$).\n6. Last\
    \ two digits of $24^N$, where N is any odd number = 24 (N = 1, 3, 5, $\\dots$).\n\
    7. Last two digits of $26^{N+1}$, where N is any natural number = 76.\n8. Last\
    \ two digits of $76 \times 2^{N+1}$, where N is any natural number = Last two\
    \ digits of $2^{N+1}$. For example, last two digits of $76 \times 04 = 04$, last\
    \ two digits of $76 \times 32 = 32$, last two digits of $76 \times 16 = 16$.\n\
    \n# Solved Example 14\n\nFind the tens place digit of $784^{1080}$.\n\nSolution\
    \ Tens place digit of $784^{1000} =$ Tens place digit of $84^{1000} =$ Tens place\
    \ digit of $4^{1000} \times 21^{1080}$."
