  \ 以 `Class` 对象的形式返回此类的父类。\n\n## 5.3 型数组列表\n\n在某些编程语言中——特别是 C 和 C++ 中——你必须在编译时固定所有数组的大小。程序员讨厌这一点，因为这迫使他们做出不舒服的权衡。一个部门有多少员工？肯定不超过\
  \ 10 个吧？如果有一个有 150 个员工的巨型部门呢？我们想为每个只有 10 个员工的部门浪费 90 个条目吗？\n\n在 Java 中，情况好一些。你可以在运行时设置数组的大小。\n\
  \n点击此处查看代码图像\n\n```\nint actualSize = . . .;\nvar staff = new Employee[actualSize];\n\
  ```\n\n\n\n当然，这段代码并没有完全解决在运行时动态修改数组的问题。一旦设置了数组的大小，你就无法轻松更改它。相反，在 Java 中，你可以使用另一个名为\
  \ `ArrayList` 的 Java 类来处理这种常见情况。`ArrayList` 类与数组类似，但在你添加或删除元素时，它会自动调整容量，而不需要任何额外的代码。\n\
  \n`ArrayList` 是一个带有`类型参数`的`泛型类`（generic class）。要指定数组列表所持元素对象的类型，你需要在后面加上括在尖括号中的类名，例如\
  \ `ArrayList<Employee>`。你将在第 8 章中看到如何定义自己的泛型类，但使用 `ArrayList` 类型时不需要了解任何这些技术细节。\n\
  \n接下来的章节将向你如何使用数组列表。\n\n### 5.3.1 声明数组列表\n\n以下是声明并构造一个持有 `Employee` 对象的数组列表的方法：\n\
  \n点击查看代码图像\n\n```\nArrayList<Employee> staff = new ArrayList<Employee>();\n```\n\
  \n从 Java 10 开始，使用 `var` 关键字来避免重复类名是一个好习惯：\n\n点击查看代码图像\n\n```\nvar staff = new ArrayList<Employee>();\n\
  ```\n\n如果你不使用 `var` 关键字，可以省略右侧的类型参数：\n\n点击查看代码图像\n\n```\nArrayList<Employee> staff\
  \ = new ArrayList<>();\n```\n\n这被称为“菱形”语法，因为空括号 `<>` 看起来像菱形。将菱形语法与 `new` 操作符结合使用。编译器会检查新值发生的情况。如果它被赋值给变量、传递给方法或从方法返回，那么编译器就会检查变量、参数或方法的泛型类型。然后它会将该类型放入\
  \ `<>` 中。在我们的示例中，`new ArrayList<>()` 被赋值给类型为 `ArrayList<Employee>` 的变量。因此，泛型类型是\
  \ `Employee`。\n\n![图像](img/caution.jpg) 注意\n\n如果你用 `var` 声明 `ArrayList`，*不要*使用菱形语法。如下声明：\n\
  \n点击查看代码图像\n\n```\nvar elements = new ArrayList<>();\n```\n\n将产生一个 `ArrayList<Object>`。\n\
  \n![图像](img/note.jpg) 注意\n\n在 Java 5 之前，没有泛型类。相反，只有一个 `ArrayList` 类，即一个持有 `Object`\
  \ 类型元素的通用集合。你仍然可以在不带 `<. . .>` 后缀的情况下使用 `ArrayList`。它被视为“原始”类型，类型参数被擦除了。\n\n![图像](img/note.jpg)\
  \ 注意\n\n在更老的 Java 版本中，程序员使用 `Vector` 类来处理动态数组。然而，`ArrayList` 类更高效，已经没有好的理由使用 `Vector`\
  \ 类了。\n\n使用 `add` 方法向数组列表添加新元素。例如，这里是如何用 `Employee` 对象填充数组列表的方法：\n\n点击查看代码图像\n\n\
  ```\nstaff.add(new Employee(\"Harry Hacker\", . . .));\nstaff.add(new Employee(\"\
  Tony Tester\", . . .));\n```\n\n数组列表管理一个内部的对象引用的数组。最终，该数组将用尽空间。这就是数组列表发挥魔法的地方：如果你调用\
  \ `add` 且内部数组已满，数组列表会自动创建一个更大的数组，并将所有对象从较小的数组复制到较大的数组中。\n\n如果你已经知道或推测你想存储多少个元素，可以在填充数组列表之前调用\
