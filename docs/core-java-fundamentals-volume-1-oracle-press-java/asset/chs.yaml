  ### 5.10 继承的设计提示\n\n我想用一些我在使用继承时发现建议来结束本章。\n\n1. **将公共操作和字段放在父类中。**\n   这就是为什么我们将\
  \ `name` 字段放入 `Person` 类，而不是在 `Student` 中重复它。\n\n2. **不要使用 `protected` 字段。**\n \
  \  `protected` 字段有两个问题。首先，子类集合是无界的——任何人都可以创建子类。其次，在 Java 中，相同包中的所有类都可以访问 `protected`。然而，`protected`\
  \ 方法可以在子类中重写。\n\n3. **使用继承来建模“是一个”（is-a）关系。**\n   继承是一个方便的工具，但有时人们会过度使用。例如，假设我们需要\
  \ `Contractor` 类。承包工有姓名和入职日期，但没有工资。相反，他们按小时计费，留存时间不足以加薪。人们很容易从 `Employee` 派生 `Contractor`\
  \ 子类并添加 `hourlyWage` 字段。\n\n   ```java\n   public class Contractor extends Employee\n\
  \   {\n      private double hourlyWage;\n      ...\n   }\n   ```\n\n   然而这不是一个好主意，因为现在每个承包工对象都有工资和时薪字段。在实现工资单或税务表的方法时，这会给你带来无穷麻烦。如果你从初不继承，要写的代码反而更少。\n\
  \n   承包工与员工的关系通过了“is-a”测试。承包工不是员工的特殊情况。\n\n4. **只有当所有继承的方法都有意义时，才使用继承。**\n   假设我们想写一个\
  \ `Holiday` 类。显然每个节日都是一天，而一天可以用 `GregorianCalendar` 类的实例来表示，因此可以使用继承。\n\n   ```java\n\
  \   class Holiday extends GregorianCalendar { ... }\n   ```\n\n   遗憾的是，节日集合在继承的操作下并不是*封闭*的。`GregorianCalendar`\
  \ 的公共方法之一是 `add`。而 `add` 可以将节日变成非节日。\n\n   ```java\n   Holiday christmas;\n   christmas.add(Calendar.DAY_OF_MONTH,\
  \ 12);\n   ```\n\n   因此，在例例中使用继承是不合适的。\n\n\n\n\n\n请注意，如果你扩展的是不可变类，那么这个问题就不会出现。假设你有一个不可变的日期类，类似于\
  \ `LocalDate` 但不是 `final` 的。如果你形成了一个 `Holiday` 子类，那么没有任何方法可以将假期转换为非假期。\n\n### 5.\
  \ 在重写方法时，不要改变预期的行为。\n\n替换原则不仅适用于语法，更重要的是，它也适用于行为。当你重写一个方法时，你不应该无理地改变它的行为。编译器无法帮助你——它无法检查你的重新定义是否有意义。例如，你可以通过重新定义\
  \ `add` 方法来“修复” `Holiday` 类中 `add` 方法的问题，也许可以让它什么都不做，或者抛出一个异常，或者跳转到下一个假期。\n\n然而，这种修复违反了替换原则。以下语句序列\n\
  \n点击此处查看代码图片\n\n```\nint d1 = x.get(Calendar.DAY_OF_MONTH);\nx.add(Calendar.DAY_OF_MONTH,\
  \ 1);\nint d2 = x.get(Calendar.DAY_OF_MONTH);\nSystem.out.println(d2 - d1);\n```\n\
  \n无论 `x` 的类型是 `GregorianCalendar` 还是 `Holiday`，都应该具有*预期的行为*。\n\n当然，问题就在于此。合理和不合理的人可以就什么是预期行为进行长篇大论的争。例如，某些作者认为替换原则要求\
  \ `Manager.equals` 忽略 `bonus` 字段，因为 `Employee.equals` 忽略了它。如果这些讨论在真空中发生，它们是毫无意义的。最终，重要的是当你在子类中重写方法时，不要绕过原始设计的意图。\n\
  \n### 6. 使用多态，而不是使用类型信息。\n\n每当你发现形式如下的代码时：\n\n```\nif (x is of type 1)\n   action1(x);\n\
  else if (x is of type 2)\n   action2(x);\n```\n\n请考虑多态。\n\n`action[1]` 和 `action[2]`\
  \ 代表一个共同的概念吗？如果是，请将该概念变为这两个类型的共同超父类或接口的方法。那么，你就可以简单地调用\n\n```\nx.action();\n```\n\
  \n并让多态固有的动态分发机制启动正确的动作。\n\n使用多态方法或接口实现的代码比使用多个类型测试的代码更易于维护和扩展。\n\n### 7. 不要过度使用反射。\n\
  \n反射机制允许你通过运行时检测字段和方法来编写出具有惊人通用性的程序。这种能力对于系统编程可能非常有用，但在应用程序中通常是不合适的。反射是脆弱的——有了它，编译器无法帮助你发现编程错误。任何错误都会在运行时发现并导致异常。\n\
  \n# 第 6 章\n\n## 接口、Lambda 表达式和内部类\n\n### 本章内容\n\n* 6.1 接口\n* 6.2 Lambda 表达式\n* 6.3\
  \ 内部类\n* 6.4 服务加载器\n* 6.5 代理\n\n你现在学习了类和继承，这些是 Java 面向对象编程的核心概念。本章向你展示了几个常用的高级技术。尽管它们的性质并不那么明显，但你将需要掌握它们来完善你的\
  \ Java 工具箱。\n\n第一种技术称为*接口*，它是一种描述类应该*做什么*的方法，而不指定它们应该*如何*做。一个类可以*实现*一个或多个接口。然后，每当需要符合接口时，你可以使用这些实现类的对象。在讨论接口之后，我们转向*Lambda\
  \ 表达式*，这是一种可以在以后某个时间执行的代码块的简洁创建。使用 Lambda 表达式，你可以用优雅且简洁的方式表达使用回调或变量行为的代码。\n\n然后我们讨论了*内部类*的机制。内部类在技术上有些复杂——它们被定义在其他类内部，它们的方法可以访问外部类的字段。当你设计协作类的的集合时，内部类是有用的。\n\
  \n本章以对*代理*的讨论作结，代理是实现任意接口的对象。代理是一种非常特殊的构造，适用于构建系统级工具。第一次阅读你可以安全地跳过该部分。\n\n## 6.1\
  \ 接口\n\n在接下来的节中，你将学习 Java 接口是什么以及如何使用它们。你还将发现接口在最近的 Java 版本中变得更加强大。\n\n#### 6.1.1\
  \ 接口概念\n\n在 Java 编程语言中，接口不是类，而是对想要符合接口的类的一组*要求*。\n\n通常，某些服务的提供者会声明：“如果你的类符合某个特定的接口，那么我就执行该服务。”让我们来看一个具体的例子。`Arrays`\
  \ 类的 `sort` 方法承诺对对象数组进行排序，但有一个条件：这些对象必须属于实现了 `Comparable` 接口的类。\n\n以下是 `Comparable`\
  \ 接口的样子：\n\n点击此处查看代码图片\n\n```\npublic interface Comparable\n{\n   int compareTo(Object\
  \ other);\n}\n```\n\n在接口中，`compareTo` 方法是*抽象的*——它没有实现。实现 `Comparable` 接口的类需要一个 `compareTo`\
  \ 方法，并且必须接受一个 `Object` 参数并返回一个整数。否则，类也是抽象的——也就是说无法构造任何对象。\n\n![Images](img/note.jpg)\
  \ 注意\n\n从 Java 5 开始，`Comparable` 接口被增强为泛型。\n\n点击此处查看代码图片\n\n```\npublic interface\
  \ Comparable<T>\n{\n   int compareTo(T other); // 参数类型为 T\n```\n\n例如，实现 `Comparable<Employee>`\
  \ 的类必须提供一个方法\n\n```\nint compareTo(Employee other)\n```\n\n你仍然可以使用没有类型参数的 `Comparable`\
  \ 类型。这时 `compareTo` 方法的参数是 `Object`，你必须手动将该参数转换为所需的类型。我会这样做以便让你不需要同时担心两个新概念。\n\n\
  接口的所有方法自动都是 `public` 的。因此，在接口中声明方法时没有必要提供 `public` 关键字。\n\n当然，还有一个接口无法规定的额外要求：当调用\
  \ `x.compareTo(y)` 时，`compareTo` 方法必须能够*比较*这两个对象并返回 `x` 或 `y` 较大的指示。该方法在 `x` 小于\
  \ `y` 时返回负数，当它们相等时返回零，否则返回正数。\n\n这个特定的接口只有一个方法。某些接口有多个方法。正如你以后将看到的，接口还可以定义常量。然而，更重要的是接口*不能*提供的。接口永远没有实例字段。在\
  \ Java 8 之前，接口中的所有方法都是抽象的。正如你将在第 6.1.4 节（ch06.xhtml_lev6_1_4）“静态和私有方法”（第 322 页，ch06.xhtml_page_322）以及第\
  \ 6.1.5 节（ch06.xhtml_lev6_1_5）“默认方法”（第 323 页，ch06.xhtml_page_323）中所看到的，现在现在可以在接口中拥有其他方法了。当然，这些方法不能引用实例字段——接口没有任何实例字段。\n\
  \n\n\n\n\n现在，假设我们要使用 `Arrays` 类的 `sort` 方法对 `Employee` 对象的数组进行排序。那么 `Employee` 类必须实现\
  \ `Comparable` 接口。\n\n要让一个类实现接口，你需要执行两个步骤：\n\n1. 你声明你的类意图实现给定的接口。\n2. 你为接口中的所有方法提供定义。\n\
  \n要声明一个类实现接口，请使用 `implements` 关键字：\n\n点击此处查看代码图片\n\n```\nclass Employee implements\
  \ Comparable\n```\n\n当然，现在 `Employee` 类需要提供 `compareTo` 方法。假设我们想根据工资来比较员工。以下是 `compareTo`\
  \ 方法的实现：\n\n点击此处查看代码图片\n\n```\npublic int compareTo(Object otherObject)\n{\n   Employee\
  \ other = (Employee) otherObject;\n   return Double.compare(salary, other.salary);\n\
  }\n```\n\n在这里，我们使用了静态的 `Double.compare` 方法，如果第一个参数小于第二个参数，它返回负数；如果它们相等，返回 `0`；否则返回正数。\n\
  \n![Images](img/caution.jpg) 注意\n\n在接口声明中，`compareTo` 方法没有声明为 `public`，因为接口中的所有方法自动都是公共的。然而，在实现接口时，你必须将方法声明为\
  \ `public`。否则，编译器会认为该方法具有包访问权限——这是类的默认权限。编译器会报错，说你正试图提供一个更严格的访问权限。\n\n我们可以通过为泛型\
  \ `Comparable` 接口提供类型参数来做得更好：\n\n点击此处查看代码图片\n\n```\nclass Employee implements Comparable<Employee>\n\
  {\n   public int compareTo(Employee other)\n   {\n      return Double.compare(salary,\
  \ other.salary);\n   }\n   . . .\n}\n```\n\n注意，对 `Object` 参数的那种难看的强制转换消失了。\n\n![Images](img/tip.jpg)\
  \ 提示\n\n`Comparable` 接口的 `compareTo` 方法返回一个整数。如果对象不相等，返回什么负值或正值并不紧要。当你比较整数字段时，这种灵活性非常有用。例如，假设每个员工都有唯一的整数\
  \ `id`，并且你想根据员工 ID 排序。那么你只需要返回 `id - other.id` 即可。如果第一个 ID 小于另一个，该值将是负值；如果 ID 相同，则为\
  \ `0`；否则为某个正值。但是，有一个注意事项：整数的范围必须足够小，以免减法发生溢出。如果你知道 ID 不是负数，或者它们的绝对值最多为 `(Integer.MAX_VALUE\
  \ - 1) / 2`，那么就是安全的。否则，请调用静态 `Integer.compare` 方法。\n\n当然，减法技巧不适用于浮点数。如果工资接近但不相同，差异\
  \ `salary - other.salary` 可能会舍入为 `0`。`Double.compare(x, y)` 调用仅在 `x < y` 时返回 `-1`，或在\
  \ `x > y` 时返回 `1`。\n\n![Images](img/note.jpg) 注意\n\n`Comparable` 接口的文档建议 `compareTo`\
  \ 方法应该与 `equals` 方法兼容。也就是说，恰恰当 `x.equals(y)` 时，`x.compareTo(y)` 应该为零。Java API 中实现\
  \ `Comparable` 的大多数类都遵循这一建议。一个著名的例外是 `BigDecimal`。考虑 `x = new BigDecimal(\"1.0\"\
  )` 和 `y = new BigDecimal(\"1.00\")`。此时 `x.equals(y)` 为 `false`，因为数字的精度不同。但 `x.compareTo(y)`\
  \ 为零。理想情况下，它不应该是这样的，但并没有明显的方法来决定哪一个应该在前。\n\n现在你看到了一个类为了利用排序服务必须做什么——它必须实现一个 `compareTo`\
  \ 方法。这非常合理。`sort` 方法需要某种方式来比较对象。但为什么 `Employee` 类不能在不实现 `Comparable` 接口的情况下直接提供一个\
  \ `compareTo` 方法呢？\n\n接口之所以是因为 Java 编程语言是强类型的。在进行方法调用时，编译器需要能够检查该方法是否存在。在 `sort`\
  \ 方法的某处会有这样的语句：\n\n```\nif (a[i].compareTo(a[j]) > 0)\n{\n   // 重新排列 a[i] 和 a[j]\n\
  \   . . .\n}\n```\n\n编译器必须知道 `a[i]` 实际上有一个 `compareTo` 方法。如果 `a` 是 `Comparable`\
  \ 对象的数组，那么该方法的存在是有保证的，因为每个实现 `Comparable` 接口的类都提供该方法。\n\n![Images](img/note.jpg)\
  \ 注意\n\n你可能认为 `Arrays` 类中的 `sort` 方法定义为接收 `Comparable[]` 数组，这样如果用元素类型未实现 `Comparable`\
  \ 接口的数组调用 `sort`，编译器就可以报错。遗憾的是，事实并非如此。相反，`sort` 方法接受一个 `Object[]` 数组并使用笨拙的转换：\n\n\
  点击此处查看代码图片\n\n```\nif (a[i].compareTo(a[j]) > 0)\n{\n   // 重新排列 a[i] 和 a[j]\n  \
  \ . . .\n}\n```\n\n如果 `a[i]` 不属于实现 `Comparable` 接口的类，虚拟机将抛出异常。\n\n**Listing 6.1**\
  \ `EmployeeTest.java`\n\n**Listing 6.2** `Employee.java`\n\n\n\n\n\n# `java.lang.Integer`\
  \ 1.0\n\n*   `static int compare(int x, int y)` 7\n    如果 `x < y` 则返回负整数，如果 `x`\
  \ 和 `y` 相等返回 0，否则返回正整数。\n\n# `java.lang.Double` 1.0\n\n*   `static int compare(double\
  \ x, double y)` 1.4\n    如果 `x < y` 则返回负整数，如果 `x` 和 `y` 相等返回 0，否则返回正整数。\n\n![Images](img/note.jpg)\
  \ 备注\n\n根据语言标准：“实现者必须确保对于所有的 `x` 和 `y`，`sgn(x.compareTo(y)) = -sgn(y.compareTo(x))`。（这意味着如果\
  \ `y.compareTo(x)` 抛出异常，则 `x.compareTo(y)` 必须抛出异常。）”在这里，`sgn` 是数字的*符号*：如果 `n` 为负数则\
  \ `sgn(n)` 为 -1，如果 `n` 等于 0 则为 0，如果 `n` 为正数则为 1。通俗地说，如果你翻转了 `compareTo` 的参数，结果的符号（但不一定是实际值）也必须发生翻转。\n\
  \n与 `equals` 方法一样，当涉及到继承时可能会出现问题。\n\n由于 `Manager` 继承自 `Employee`，它实现的是 `Comparable<Employee>`\
  \ 而不是 `Comparable<Manager>`。如果 `Manager` 选择重写 `compareTo`，它必须准备好将经理与员工进行比较。它不能简单地将一个员工强制转换为经理：\n\
  \n点击此处查看代码图片\n\n```\nclass Manager extends Employee\n{\n   public int compareTo(Employee\
  \ other)\n   {\n      Manager otherManager = (Manager) other; // 不能\n      . . .\n\
  \   }\n   . . .\n}\n```\n\n这违反了“反对对称性”规则。如果 `x` 是一个 `Employee` 且 `y` 是一个 `Manager`，那么调用\
  \ `x.compareTo(y)` 不会抛出异常——它仅仅将 `x` 和 `y` 作为员工进行比较。但反过来，`y.compareTo(x)` 却抛出了 `ClassCastException`。\n\
  \n这与第 5 章中讨论的 `equals` 方法的情况相同，解决方法也相同。有两种不同的场景。\n\n如果子类对比较有不同的理解，那么你应该禁止对不同类的对象进行比较。每个\
  \ `compareTo` 方法应该从以下测试开始：\n\n点击此处查看代码图片\n\n```\nif (getClass() != other.getClass())\
  \ throw new ClassCastException();\n```\n\n如果有一个比较子类对象的通用算法，只需在父类中提供单一的 `compareTo`\
  \ 方法并将其声明为 `final` 即可。\n\n例如，假设你想让经理无论薪水如何都高于普通员工。其他子类（如 `Executive` 和 `Secretary`）怎么办？如果你需要建立一个等级，请在\
  \ `Employee` 类中提供一个如 `rank` 的方法。让每个子类重写 `rank`，并实现一个考虑到 `rank` 值的单一 `compareTo`\
  \ 方法。\n\n## 6.1.2 接口属性\n\n接口不是类。特别是，你永远不能使用 `new` 运算符来实例化接口：\n\n点击此处查看代码图片\n\n```\n\
  x = new Comparable(. . .); // 错误\n```\n\n然而，尽管你无法构造接口对象，你仍然可以接口变量。\n\n```\nComparable\
  \ x; // 可以\n```\n\n接口变量必须引用实现该接口的类的对象：\n\n点击此处查看代码图片\n\n```\nx = new Employee(.\
  \ . .); // 只要 Employee 实现了 Comparable 即可\n```\n\n接下来，就像你使用 `instanceof` 来检查对象是否属于特定类一样，你也可以使用\
  \ `instanceof` 来检查对象是否实现了某个接口：\n\n点击此处查看代码图片\n\n```\nif (anObject instanceof Comparable)\
  \ { . . . }\n```\n\n就像你可以构建类的层次结构一样，你也可以扩展接口。这允许存在从更高通用性到更高特化程度的多个接口链。例如，假设你有一个名为\
  \ `Moveable` 的接口。\n\n点击此处查看代码图片\n\n```\npublic interface Moveable\n{\n   void move(double\
  \ x, double y);\n}\n```\n\n那么，你可以想象有一个名为 `Powered` 的接口扩展了它：\n\n点击此处查看代码图片\n\n```\n\
  public interface Powered extends Moveable\n{\n   double milesPerGallon();\n}\n```\n\
  \n虽然你不能在接口中放置实例字段，但你可以在其中提供常量。例如：\n\n点击此处查看代码图片\n\n```\npublic interface Powered\
  \ extends Moveable\n{\n   double milesPerGallon();\n   double SPEED_LIMIT = 95;\
  \ // 一个 public static final 常量\n}\n```\n\n就像接口中的方法自动是 `public` 的一样，字段始终是 `public\
  \ static final`。\n\n![Images](img/graphics.note.jpg) 备注\n\n接口中的方法自动是 `public`，字段始终是\
  \ `public static final`。\n\n![Images](img/graphics.note.jpg) 备注\n\n虽然每个类只有一个父类，但类可以实现*多个*接口。这为你定义类时提供了最大的灵活性。例如，Java\
  \ 语言内置了一个重要的接口：`Cloneable`。该接口在 6.1.9 节中详细讨论。如果你的类实现了 `Cloneable`，`Object` 类将创建你类的精确副本。如果你同时需要克隆和比较性，只需用逗号分隔你想实现的接口：\n\
  \n点击此处查看代码图片\n\n```\nclass Employee implements Cloneable, Comparable\n```\n\n![Images](img/graphics.note.jpg)\
  \ 备注\n\n记录类和枚举类不能扩展其他类（因为它们分别扩展了 `Record` 和 `Enum` 类）。但它们可以实现接口。\n\n![Images](img/graphics.note.jpg)\
  \ 备注\n\n接口可以是密封的。与密封类一样，直接子类型（类或接口）必须在 `permits` 子句中声明，或者位于同一个源文件中。\n\n## 6.1.3\
  \ 接口与抽象类\n\n如果你读过第 5 章中关于抽象类的章节，可能会疑惑 Java 语言设计者为什么要引入接口的概念。为什么 `Comparable` 不能简单地是一个抽象类：\n\
  \n点击此处查看代码图片\n\n```\nabstract class Comparable // 为什么不能？\n{\n   public abstract\
  \ int compareTo(Object other);\n}\n```\n\n`Employee` 类只需扩展这个抽象类并提供\n\n点击此处查看代码图片\n\
  \n```\nclass Employee extends Comparable // 为什么不能？\n{\n   public int compareTo(Object\
  \ other) { . . . }\n}\n```\n\n遗憾的是，使用抽象基类表示通用属性有一个主要问题。类只能扩展一个类。假设 `Employee` 类已经扩展了另一个类，比如\
  \ `Person`。那么它就不能扩展第二个类。\n\n点击此处查看代码图片\n\n```\nclass Employee extends Person, Comparable\
  \ // 错误\n```\n\n但每个类可以实现任意多个接口：\n\n点击此处查看代码图片\n\n```\nclass Employee extends Person\
  \ implements Comparable // 可以\n```\n\n其他编程语言，特别是 C++，允许一个类拥有多个父类。这种特性被称为*多重继承*。Java\
  \ 的设计者选择不支持多重继承，因为这会让语言变得非常复杂（如 C++ 中所示）或者效率较低（如 Eiffel 中所示）。\n\n\n\n\n相反，接口提供了多重继承的大多数优势，同时避免了复杂性和低效。\n\
  \n![Images](img/cnote.jpg) C++ Note\n\nC++ 拥有多重继承以及随之产生的所有问题，例如虚基类、支配规则和横向指针转换。很少有\
  \ C++ 程序员使用多重继承，有人认为永远不应该使用。其他程序员建议仅对“混入”（mix-in）风格的继承使用多重继承。在混入风格，主基类描述父对象，而额外的基类（所谓的混入类）可以提供辅助特性。这种风格类似于具有单个父类和额外接口的\
  \ Java 类。\n\n![Images](img/tip.jpg) 提示\n\n你已经在第 3 章 中见过过 `CharSequence` 接口。`String`\
  \ 和 `StringBuilder`（以及其他几个更冷门的类字符串类）都实现了这个接口。该接口包含了所有管理字符序列的类通用的方法。通用接口鼓励程序员编写使用\
  \ `CharSequence` 接口的方法。这些方法可以在 `String`、`StringBuilder` 以及其他类字符串类的实例上运行。\n\n遗憾的是，`CharSequence`\
  \ 接口相当贫乏。你可以获取长度、遍历代码点或代码单元、提取子序列，并按字典顺序比较两个序列。Java 17 增加了一个 `isEmpty` 方法。\n\n如果你需要处理字符串，且这些操作足以完成你的任务，请直接接受\
  \ `CharSequence` 实例而不是字符串。\n\n### 6.1.4 静态和私有方法\n\n从 Java 8 开始，你被允许向接口中添加静态方法。从技术角度来说，没有任何理由禁止这样做。它只是违背了接口作为抽象规范的初衷。\n\
  \n直到现在，将静态方法放在伴侣类中是常见做法。在标准库中，你会发现接口和工具类的成对，例如 `Collection`/`Collections` 或 `Path`/`Paths`。\n\
  \n你可以从 URI 或从一序列字符串（例如 `Paths.get(\"jdk-17\", \"conf\", \"security\")`）构建通向文件或目录的路径。在\
  \ Java 11 中，`Path` 接口中提供了等效的方法：\n\n点击此处查看代码图片\n\n```\npublic interface Path\n{\n\
  \   public static Path of(URI uri) { . . . }\n   public static Path of(String first,\
  \ String... more) { . . . }\n   . . .\n}\n```\n\n那么 `Paths` 类就不再需要了。\n\n同样，当你实现自己的接口时，不再有理由为工具方法提供单独的伴侣类。\n\
  \n从 Java 9 开始，接口中的方法可以是是 `private`（私有的）。`private` 方法可以是 `static` 的，也可以是实例方法。由于私有方法只能在接口自身的方法中使用，因此它们的使用仅限于作为接口其他方法的辅助方法。\n\
  \n### 6.1.5 默认方法\n\n你可以为任何接口方法提供 `default` 默认实现。你必须使用 `default` 修饰符来标记此类方法。\n\n\
  点击此处查看代码图片\n\n```java\npublic interface Comparable<T>\n{\n   default int compareTo(T\
  \ other) { return 0; }\n      // 默认情况下，所有元素都是相同的\n}\n```\n\n当然，这并没有什么用，因为 `Comparable`\
  \ 的任何实际实现都会重写这个方法。但在其他情况下，默认方法是有有用的。例如，在第 9 章中，你会看到一个用于访问数据结构中元素的 `Iterator` 接口。它声明了一个\
  \ `remove` 方法，如下：\n\n点击此处查看代码图片\n\n```java\npublic interface Iterator<E>\n{\n  \
  \ boolean hasNext();\n   E next();\n   default void remove() { throw new UnsupportedOperationException(\"\
  remove\"); }\n   . . .\n}\n```\n\n如果你实现一个迭代器，你需要提供 `hasNext` 和 `next` 方法。这些方法没有默认实现——它们依赖于你正在遍历的数据结构。但如果你的迭代器是只读的，你就不需要担心\
  \ `remove` 方法。\n\n默认方法可以调用其他方法。例如，`Collection` 接口可以定义一个便利方法\n\n点击此处查看代码图片\n\n```java\n\
  public interface Collection\n{\n   int size(); // 一个抽象方法\n   default boolean isEmpty()\
  \ { return size() == 0; }\n   . . .\n}\n```\n\n那么，实现 `Collection` 的程序员就不必担心实现 `isEmpty`\
  \ 方法了。\n\n![Images](img/note.jpg) 注意\n\nJava API 中的 `Collection` 接口实际上并没有这样做。相反，有一个类\
  \ `AbstractCollection` 实现 `Collection` 并根据 `size` 定义了 `isEmpty`。建议集合的实现者扩展 `AbstractCollection`。那种技术已经过时了。只需实现接口中的方法即可。\n\
  \n默认方法的一个重要用途是*接口演进*（interface evolution）。考虑例如在 Java 中存在多年的 `Collection` 接口。假设很久以前，你提供了一个类\n\
  \n点击此处查看代码图片\n\n```java\npublic class Bag implements Collection\n```\n\n后来，在 Java\
  \ 8 中，接口中添加了 `stream` 方法。\n\n假设 `stream` 方法不是默认方法。那么 `Bag` 类将无法编译，因为它没有实现该方法。向接口添加非默认方法不是源码兼容的。\n\
  \n但假设你不重新编译该类，直接使用包含旧方法的 JAR 包。类仍然可以加载，即使缺少该方法。（向接口添加方法是二进制兼容的，binary compatible。）然而，如果程序在\
  \ `Bag` 实例上调用 `stream` 方法，会发生 `AbstractMethodError`。\n\n将方法变为 `default` 方法解决了这两个问题。`Bag`\
  \ 类将再次编译。即使类没有重新编译并在 `Bag` 实例上调用 `stream` 方法，调用的也是 `Collection` 方法。\n\n### 6.1.6\
  \ 解析默认方法冲突\n\n如果完全相同的方法在一个接口中定义为默认方法，而在父类或另一个接口中再次定义，会发生？Scala 和 C++ 等语言有解决此类冲突的复杂规则。幸运的是，Java\
  \ 的规则简单得多。如下：\n\n1.  父类胜出。如果父类提供了具体方法，同名同参数的默认方法将被忽略。\n2.  接口冲突。如果一个接口提供了默认方法，而另一个接口包含同名同参数的方法（无论是否默认），你必须通过重写该方法来解决冲突。\n\
  \n让我们看看第二个规则。考虑两个具有 `getName` 方法的接口：\n\n点击此处查看代码图片\n\n```java\ninterface Person\n\
  {\n   default String getName() { return \"\"; };\n}\n\ninterface Named\n{\n   default\
  \ String getName() { return getClass().getName() + \"_\" + hashCode(); }\n}\n```\n\
  \n如果你形成一个实现了这两个类的类会怎样？\n\n点击此处查看代码图片\n\n```java\nclass Student implements Person,\
  \ Named { . . . }\n```\n\n该类继承了由 `Person` 和 `Named` 接口提供的不一致的 `getName` 方法。Java\
  \ 编译器不会从中选择一个，而是报告错误，并将歧义留给程序员。只需在 `Student` 类中提供一个 `getName` 方法。在该方法中，你可以选择冲突方法中的一个，如下所示：\n\
  \n点击此处查看代码图片\n\n```java\nclass Student implements Person, Named\n{\n   public String\
  \ getName() { return Person.super.getName(); }\n   . . .\n}\n```\n\n\n\n现在假设 `Named`\
  \ 接口没有为 `getName` 提供默认实现：\n\n```java\ninterface Named\n{\n   String getName();\n\
  }\n```\n\n`Student` 类可以继承来自 `Person` 接口的默认方法吗？这也许是合理的，但 Java 设计者为了统一性决定不这样做。两个接口之间如何冲突并不重要。只要至少有一个接口提供了实现，编译器就会报告错误，程序员必须解决这种歧义。\n\
  \n![Images](img/note.jpg) 笔记\n\n当然，如果两个接口都没有为共享方法提供默认实现，那么我们处于 Java 8 之前的状态，此时没有冲突。实现类类有两个选择：实现该方法，或者留空不实现。在后一种情况下，该类本身是抽象类。\n\
  \n我们刚刚讨论了两个接口之间的命名冲突。现在考虑一个继承父类并实现接口的类，它从两者都继承了相同的方法。例如，假设 `Person` 是一个类，而 `Student`\
  \ 定义如下：\n\n点击此处查看代码图像\n\n```\nclass Student extends Person implements Named { .\
  \ . . }\n```\n\n在这种情况下，只有父类方法有效，接口中的任何默认方法都将被简单忽略。在我们的示例中，`Student` 从 `Person` 继承了\
  \ `getName` 方法，无论 `Named` 接口是否为 `getName` 提供默认实现都没有区别。这就是“类胜出”规则。\n\n“类胜出”规则确保了与\
  \ Java 7 的兼容性。如果你向接口添加默认方法，它对在默认方法出现之前运行的代码没有影响。\n\n![Images](img/caution.jpg) 警告\n\
  \n你永远无法创建一个重定义 `Object` 类中某个方法的默认方法。例如，你不能为 `toString` 或 `equals` 定义默认方法，尽管这对于 `List`\
  \ 等接口可能很有吸引力。由于“类胜出”规则，此类方法永远无法胜过 `Object.toString` 或 `Object.equals`。\n\n### 6.1.7\
  \ 接口与回调\n\n编程中的常见模式是 `callback`（回调）模式。在这种模式中，你指定了当特定事件发生时应该执行的操作。例如，你可能希望在点击按钮或选择菜单项时执行特定操作。然而，由于你还没有看到如何实现用户界面，我们将考虑一个类似但简单的场景。\n\
  \n`javax.swing` 包包含一个 `Timer` 类，如果你想在时间间隔结束时收到通知，这个类非常有用。例如，如果你的程序部分包含一个时钟，你可以要求每秒通知一次，以便更新时钟界面。\n\
  \n当你构造定时器时，你设置时间间隔并告诉它在每次时间间隔结束时应该做什么。\n\n你如何告诉定时器它应该做什么呢？在许多编程语言中，你提供定时器应该周期调用的函数名。然而，Java\
  \ 标准库中的类采用了面向对象的方法。你传递某个类的对象。定时器随后调用该对象上的一个方法。传递对象比传递函数更灵活，因为对象可以携带额外信息。\n\n当然，定时器需要知道调用哪个方法。定时器要求你指定一个实现了\
  \ `java.awt.event` 包中 `ActionListener` 接口的类对象。这是该接口：\n\n点击此处查看代码图像\n\n```java\n\
  public interface ActionListener\n{\n   void actionPerformed(ActionEvent event);\n\
  }\n```\n\n当时间间隔过期时，定时器会调用 `actionPerformed` 方法。\n\n假设你想每秒打印一次消息“调声响后，时间是 . . .”，随后是一声哔哔声。你会定义一个实现\
  \ `ActionListener` 接口的类。然后你会在 `actionPerformed` 方法内部放置任何想要执行的语句。\n\n点击此处查看代码图像\n\
  \n```java\nclass TimePrinter implements ActionListener\n{\n   public void actionPerformed(ActionEvent\
  \ event)\n   {\n      System.out.println(\"At the tone, the time is \"\n       \
  \  + Instant.ofEpochMilli(event.getWhen()));\n      Toolkit.getDefaultToolkit().beep();\n\
  \   }\n}\n```\n\n注意 `actionPerformed` 方法的 `ActionEvent` 参数。该参数提供了有关事件的信息，例如事件发生的时间。调用\
  \ `event.getWhen()` 返回事件时间，单位为自“元 Epoch”（1970 年 1 月 1 日）以来的毫秒数。通过将其传递给静态方法 `Instant.ofEpochMilli`，我们得到了更具可读性的描述。\n\
  \n接下来，构造该类的对象并将其传递给 `Timer` 构造函数。\n\n点击此处查看代码图像\n\n```java\nvar listener = new TimePrinter();\n\
  Timer t = new Timer(1000, listener);\n```\n\n`Timer` 构造函数的第一个参数是两次通知之间必须经过间隔，单位为毫秒。我们希望每秒收到一次。第二个参数是监听器对象。\n\
  \n最后，启动定时器。\n\n```java\nt.start();\n```\n\n每秒都会显示如下消息：\n\n点击此处查看代码图像\n\n```\nAt\
  \ the tone, the time is 2017\n```\n\n随后是一声哔哔声。\n\n**列表 6.3** `timer/TimerTest.java`\n\
  \n```java\npackage timer;\n\n/**\n * @version 1.0\n * @author Cay Horstmann\n */\n\
  import java.awt.*;\nimport java.awt.event.*;\nimport java.time.*;\nimport javax.swing.*;\n\
  \npublic class TimerTest\n{\n   public static void main(String[] args)\n   {\n \
  \     var listener = new TimePrinter();\n      // 构建一个每秒调用一次监听器的定时器\n      var timer\
  \ = new Timer(1000, listener);\n      timer.start();\n\n      // 保持程序运行，直到用户选择“确定”\n\
  \      JOptionPane.showMessageDialog(null, \"Quit?\");\n      System.exit(0);\n\
  \   }\n}\n\nclass TimePrinter implements ActionListener\n{\n   public void actionPerformed(ActionEvent\
  \ event)\n   {\n      System.out.println(\"At the tone, the time is \" + Instant.ofEpochMilli(event.getWhen()));\n\
  \      Toolkit.getDefaultToolkit().beep();\n   }\n}\n```\n\n### 6.1.8 `Comparator`\
  \ 接口\n\n\n\n\n\n在第 6.1.1 节“接口概念](#ch06.xhtml_lev6_1_1)”中（第 312 页），你见过如何对对象数组进行排序，只要这些对象实现了\
  \ `Comparable` 接口的类的实例。例如，你可以排序字符串数组，因为 `String` 类实现了 `Comparable<String>`，并且 `String.compareTo`\
  \ 方法按字典顺序比较字符串。\n\n现在假设我们想按长度升序对字符串进行排序，而不是按字典顺序。我们无法让 `String` 类以两种方式实现 `compareTo`\
  \ 方法——而且无论如何，我们也无法修改 `String` 类。\n\n为了处理这种情况，`Arrays.sort` 方法有第二个版本，它的参数是一个数组和一个\
  \ `comparator`（比较器）——实现 `Comparator` 接口的类的实例。\n\n点击此处查看代码图片\n\n```\npublic interface\
  \ Comparator<T>\n{\n   int compare(T first, T second);\n}\n```\n\n要按长度比较字符串，定义一个实现\
  \ `Comparator<String>` 的类：\n\n点击此处查看代码图片\n\n```\nclass LengthComparator implements\
  \ Comparator<String>\n{\n   public int compare(String first, String second)\n  \
  \ {\n      return first.length() - second.length();\n   }\n}\n```\n\n要实际执行比较，你需要创建一个实例：\n\
  \n点击此处查看代码图片\n\n```\nvar comp = new LengthComparator();\nif (comp.compare(words[i],\
  \ words[j]) > 0) . . .\n```\n\n将此调用与 `words[i].compareTo(words[j])` 进行对比。`compare`\
  \ 方法是在比较器对象上调用的，而不是在字符串本身上。\n\n![Images](img/note.jpg) 笔记\n\n即使 `LengthComparator`\
  \ 对象没有状态，你仍然需要创建它的实例。你需要该实例来调用 `compare` 方法——它不是一个静态方法。\n\n要对数组进行排序，将 `LengthComparator`\
  \ 对象传递给 `Arrays.sort` 方法：\n\n点击此处查看代码图片\n\n```\nString[] friends = { \"Peter\",\
  \ \"Paul\", \"Mary\" };\nArrays.sort(friends, new LengthComparator());\n```\n\n\
  现在数组是 `[\"Paul\", \"Mary\", \"Peter\"]` 或 `[\"Mary\", \"Paul\", \"Peter\"]`。\n\n\
  你将在第 6.2 节“Lambda 表达式](#ch06.xhtml_lev6_2)”（第 338 页）看到如何使用 Lambda 表达式更轻松地使用 `Comparator`。\n\
  \n### 6.1.9 对象克隆\n\n在本节中，我们将讨论 `Cloneable` 接口，该接口表示一个类提供了一个安全的 `clone` 方法。由于克隆并不常见，而且细节非常技术化，你可能只想在需要它之前扫一眼这些材料。\n\
  \n要理解克隆的含义，回想当你复制一个持有对象引用的变量时会发生什么。原始对象和副本都是指向同一个对象的引用（参见图 6.1）。这意味着对任何一个变量的更改也会影响另一个。\n\
  \n点击此处查看代码图片\n\n```\nvar original = new Employee(\"John Public\", 50000);\nEmployee\
  \ copy = original;\ncopy.raiseSalary(10); // 哦--也改变了原始对象\n```\n\n![Images](img/06fig01.jpg)\n\
  \n**图 6.1** 复制与克隆\n\n如果你希望 `copy` 是一个新对象，其起始状态与 `original` 相同，但其状态随时间推移而不同，请使用 `clone`\
  \ 方法。\n\n点击此处查看代码图片\n\n```\nEmployee copy = original.clone();\ncopy.raiseSalary(10);\
  \ // OK--原始对象未改变\n```\n\n但这并不简单。`clone` 方法是 `Object` 的一个 `protected` 方法，这意味着你的代码不能直接调用它。只有\
  \ `Employee` 类可以克隆 `Employee` 对象。这种限制是有原因的。考虑 `Object` 类是如何实现 `clone` 的。它对对象一无所知，因此它只能逐字段地进行复制。如果对象中的所有实例字段都是数字或其他基本类型，那么复制字段就没问题。但如果对象包含指向子对象的引用，那么复制字段将给你另一个指向该相同子对象的引用，因此原始对象和克隆对象仍然共享某些信息。\n\
  \n为了直观化这一点，考虑在第 4 章中引入的 `Employee` 类。图 6.2 显示了当使用 `Object` 类的 `clone` 方法克隆此类 `Employee`\
  \ 对象时会发生什么。正如你所看到的，默认的克隆操作是“浅拷贝”的——它不克隆引用的对象。你可以看到，默认的克隆操作是浅的。（本示例使用了 `Date` 类型来表示\
  \ `Employee` 类内部。）\n\n![Images](img/06fig02.jpg)\n\n**图 6.2** 浅拷贝\n\n浅拷贝是否重要？这取决于。如果子对象是不可变的，那么共享就是安全的。这确实发生在子对象属于不可变类时，例如\
  \ `String`。然而，很多时候子对象是可变的，你必须重写 `clone` 方法以进行深拷贝。（本示例使用了可变的 `Date` 类型。）\n\n对于每个类，你需要决定：\n\
  \n1. 默认的 `clone` 方法足够了；\n2. 需要通过克隆子对象来修复默认的 `clone` 方法；或者 3. 不应尝试克隆\n\n第三种选项实际上是默认选项。要选择第一或第二种选项，类必须：\n\
  \n1. 实现 `Cloneable` 接口；以及\n2. 使用 `public` 修饰符重写 `clone` 方法。\n\n![Images](img/note.jpg)\
  \ 笔记\n\n`clone` 方法在 `Object` 中声明为 `protected`，这意味着你的代码不能简单地调用它。但保护方法不是在任何子类中都是可的吗？而且每个类不都是\
  \ `Object` 的子类吗？幸运的是，保护访问的规则更为微妙（参见第 5 章）。子类只能调用受保护的 `clone` 方法来克隆*自己的*对象。你必须将 `clone`\
  \ 重新定义为公共，以允许任何方法进行克隆。\n\n在这种情况下，`Cloneable` 接口的出现与接口的通常用法无关。（有些程序员将它们称为标记接口 *marker\
  \ interfaces*。）回想，像 `Comparable` 这样的接口的通常用途是确保类实现特定的方法或一组方法。标记接口没有方法；它的唯一目的是允许在类型查询中使用\
  \ `instanceof`：\n\n```java\nif (obj instanceof Cloneable) . . .\n```\n\n我建议不要在你自己的程序中使用标记接口。\n\
  \n\n\n\n\n即使 `clone` 的默认（浅拷贝）实现已经足够，你仍然需要实现 `Cloneable` 接口，将 `clone` 重新定义为 `public`，并调用\
  \ `super.clone()`。这是一个示例：\n\n点击此处查看代码图像\n\n```java\nclass Employee implements Cloneable\n\
  {\n   // 公有访问，更改返回类型\n   public Employee clone() throws CloneNotSupportedException\n\
  \   {\n      return (Employee) super.clone();\n   }\n   . . .\n}\n```\n\n![Images](img/note.jpg)\
  \ 注意\n\n在 Java 1.4 之前，`clone` 方法的返回类型总是 `Object`。现在，你可以为你的 `clone` 方法指定正确的返回类型。这是一个协变返回类型的示例（参见第\
  \ 5 章）。\n\n你刚刚看到的这个 `clone` 方法并没有为 `Object.clone()` 提供的浅拷贝添加任何功能。它仅仅是让该方法变成了公有。要实现深拷贝，你必须付出更多努力并克隆可变的实例字段。\n\
  \n这是一个创建深拷贝的 `clone` 方法示例：\n\n点击此处查看代码图像\n\n```java\nclass Employee implements Cloneable\n\
  {\n   . . .\n   public Employee clone() throws CloneNotSupportedException\n   {\n\
  \      // 调用 Object.clone()\n      Employee cloned = (Employee) super.clone();\n\
  \n      // 克隆可变字段\n      cloned.hireDay = (Date) hireDay.clone();\n      return\
  \ cloned;\n   }\n}\n```\n\n`Object` 类的 `clone` 方法可能会抛出 `CloneNotSupportedException`——每当对未实现\
  \ `Cloneable` 接口的对象调用 `clone` 时，它就会抛出异常。当然，`Employee` 和 `Date` 类实现了 `Cloneable`\
  \ 接口，因此不会抛出异常。然而，编译器并不知道。因此，我们声明了该异常：\n\n点击此处查看代码图像\n\n```java\npublic Employee\
  \ clone() throws CloneNotSupportedException\n```\n\n![Images](img/note.jpg) 注意\n\
  \n捕获异常是否会更好？（参见第 7 章 关于捕获异常的细节。）\n\n点击此处查看代码图像\n\n```java\npublic Employee clone()\n\
  {\n   try\n   {\n      Employee cloned = (Employee) super.clone();\n      . . .\n\
  \   }\n   catch (CloneNotSupportedException e) { return null; }\n   // 这不会发生，因为我们实现了\
  \ Cloneable\n}\n```\n\n这对于 `final` 类是合适的。否则，保留 `throws` 饰符会更好。这样子类在无法支持克隆时，就有了抛出\
  \ `CloneNotSupportedException` 的选择。\n\n你必须对子类的克隆保持小心。例如，一旦你为 `Employee` 类定义了 `clone`\
  \ 方法，任何人都可以使用它来克隆 `Manager` 对象。`Employee` 的 `clone` 方法能胜任吗？这取决于 `Manager` 类的字段。在我们的案例中，没有问题，因为\
  \ `bonus` 字段是基本类型。但 `Manager` 可能拥有需要深拷贝或不可克隆的字段。无法保证子类的实现者已经修复了 `clone` 以执行正确的操作。出于这个原因，`clone`\
  \ 方法在 `Object` 类中被声明为 `protected`。但如果你希望你类的用户能够调用 `clone`，你就没有这种奢侈待遇了。\n\n你应该在自己的类中实现\
  \ `clone` 吗？如果你的客户端需要进行深拷贝，那么你可能应该这样做。一些作者认为，你应该完全避免使用 `clone`，转而实现另一个方法来实现相同的目的。我同意\
  \ `clone` 相当笨拙，但如果你将责任转移到另一个方法，你仍然会相同的问题。无论如何，克隆并没有你想象的那么常见。标准库中只有百分之五不到的类实现了 `clone`。\n\
  \n列表 6.4 中的程序克隆了 `Employee` 类的实例（列表 6.5），然后调用了两个修改器方法。`raiseSalary` 方法更改了 `salary`\
  \ 字段的值，而 `setHireDay` 方法更改了 `hireDay` 字段的状态。任何修改都不会影响原始对象，因为 `clone` 被定义为执行深拷贝。\n\
  \n![Images](img/note.jpg) 注意\n\n所有的数组类型都有一个 `public` 的 `clone` 方法，而不是 `protected`。你可以使用它来创建一个包含所有元素拷贝的新数组。例如：\n\
  \n点击此处查看代码图像\n\n```java\nint[] luckyNumbers = { 2, 3, 5, 7, 11, 13 };\nint[] cloned\
  \ = luckyNumbers.clone();\ncloned[5] = 12; // 不改变 luckyNumbers[5]\n```\n\n![Images](img/note.jpg)\
  \ 注意\n\n第二卷的第 2 章 展示了克隆对象的另一种机制，即使用对象序列化。\n\n列表 6.4\n\n列表 6.5\n\n## 6.2 Lambda 表达式\n\
  \n在接下来的章节中，你将学习如何使用 Lambda 表达式用简洁的语法定义代码块，以及如何编写使用 Lambda 表达式的代码。\n\n#### 6.2.1\
  \ 为什么需要 Lambda？\n\nLambda 表达式是一个代码块，你可以将其传递以便稍后执行，执行一次或多次。在进入语法细节（甚至是那个奇怪的名字）之前，让我们回顾一下在\
  \ Java 中哪里使用过此类代码块。\n\n\n\n\n\n```java\nclass Worker implements ActionListener\n\
  {\n   public void actionPerformed(ActionEvent event)\n   {\n      // do some work\n\
  \   }\n}\n```\n\n然后，当你想要重复执行这段代码时，你构造一个 `Worker` 类的实例。接着你将该实例提交给 `Timer` 对象。\n\n\
  关键点在于 `actionPerformed` 方法包含了你想要稍后执行的代码。\n\n或者考虑使用自定义比较器进行排序。如果你想按长度而不是默认的字典顺序对字符串进行排序，可以将一个\
  \ `Comparator` 对象传递给 `sort` 方法：\n\n点击此处查看代码图片\n\n```java\nclass LengthComparator\
  \ implements Comparator<String>\n{\n   public int compare(String first, String second)\n\
  \   {\n      return first.length() - second.length();\n   }\n}\n. . .\nArrays.sort(strings,\
  \ new LengthComparator());\n```\n\n`compare` 方法不会被立即调用。相反，`sort` 方法会不断调用 `compare`\
  \ 方法，在元素顺序不对时重新排列它们，直到数组排序完成。你为 `sort` 方法提供了一段比较元素所需的代码，而这段代码被集成到其余的排序逻辑中，而你可能并不想重新实现那些逻辑。\n\
  \n这两个示例有一个共同点：一段代码块被传递给了某人——计时器或 `sort` 方法。这段代码块在之后的某个时间被调用。\n\n到目前为止，在 Java 中向某人提供代码块并不容易。你不能直接传递代码块。Java\
  \ 是一门面向对象的语言，因此你必须构造一个拥有所需代码方法的类对象。\n\n在其他语言中，直接处理代码块是可能的。Java 的设计者长期以来抵制添加这一功能。毕竟，Java\
  \ 的一大优势之一是它的简单和一致。如果一个语言包含了每一个能让代码略微简洁的特性，它可能会变成一个不可维护的混乱体。然而，在那些其他语言中，不仅是启动线程或注册按钮点击处理器更简单；它们的\
  \ API 大部分内容都更简单、更一致且更强大。在 Java 中，可以使用实现特定接口的类对象来编写类似的 API，但这样的 API 使用起来会非常糟糕。\n\n\
  一段时间以来，问题不是要不要增强 Java 以支持函数式编程，而是如何做。经过几年的实验，才出现了一个适合 Java 的设计。在下一节中，你将看到如何在 Java\
  \ 中处理代码块。\n\n### 6.2.2 Lambda 表达式的语法\n\n再次考虑前一节中的排序示例。我们传递了一段检查一个字符串是否比另一个短的代码。我们计算出：\n\
  \n点击此处查看代码图片\n\n```java\nfirst.length() - second.length()\n```\n\n`first` 和 `second`\
  \ 是什么？它们都是字符串。Java 是一门强类型语言，我们必须同样指定这一点：\n\n点击此处查看代码图片\n\n```java\n(String first,\
  \ String second) ->\n   first.length() - second.length()\n```\n\n你刚刚看到了你的第一个 `lambda\
  \ 表达式`。这样的表达式仅仅是一个代码块，加上任何必须传递给代码的变量说明。\n\n为什么叫这个名字？很多年前，在计算机出现之前，逻辑学家阿隆佐·丘奇（Alonzo\
  \ Church）想要形式化数学函数是有效可计算的含义。（有趣的是，已知某些函数存在，但没人知道如何计算它们的值。）他使用希腊字母 lambda（`λ`）来标记参数。如果他知道\
  \ Java API，他会写成：\n\n点击此处查看代码图片\n\n```\nλfirst.λsecond.first.length() - second.length()\n\
  ```\n\n![Images](img/note.jpg) 注意\n\n为什么用字母 `λ`？是因为丘奇用完字母表上的其他字母了吗？实际上，古老的《数学原理》（*Principia\
  \ Mathematica*）使用 `^` 变音符号表示自由变量，这启发了丘奇使用大写 lambda `Λ` 作为参数。但最后，他切换到了小写版本。从那时起，带有参数变量表达式被称为\
  \ lambda 表达式。\n\n你刚刚看到的是 Java 中 lambda 表达式的一种简单形式：参数、`->` 箭头和一个表达式。如果代码执行的计算不适合放在单个表达式中，就按照你编写方法的方式来编写它：包括在\
  \ `{}` 中，并附有显式的 `return` 语句。例如：\n\n点击此处查看代码图片\n\n```java\n(String first, String\
  \ second) ->\n   {\n      if (first.length() < second.length()) return -1;\n   \
  \   else if (first.length() > second.length()) return 1;\n      else return 0;\n\
  \   }\n```\n\n如果 lambda 表达式没有参数，你仍然需要提供空括号，就像无参数方法一样：\n\n点击此处查看代码图片\n\n```java\n\
  () -> { for (int i = 100; i >= 0; i--) System.out.println(i); }\n```\n\n如果 lambda\
  \ 表达式的参数类型可以推断，你就可以省略它们。例如：\n\n点击此处查看代码图片\n\n```java\nComparator<String> comp =\n\
  \   (first, second) // 等同于 (String first, String second) ->\n      first.length()\
  \ - second.length();\n```\n\n在这里，编译器可以推断 `first` 和 `second` 必须是字符串，因为 lambda 表达式被赋值给一个字符串比较器。（我们将在下一节中详细讨论赋值。）\n\
  \n如果方法只有一个类型可推的参数，你甚至可以省略括号：\n\n点击此处查看代码图片\n\n```java\nActionListener listener =\
  \ event ->\n   System.out.println(\"The time is \"\n      + Instant.ofEpochMilli(event.getWhen()));\n\
  \      // 代替 (event) -> . . . 或 (ActionEvent event) -> . . .\n```\n\n你永远不需要指定 lambda\
  \ 表达式的结果类型。它总是从上下文中推断出来的。例如，表达式\n\n...\n\n```java\n(String first, String second)\
  \ -> first.length() - second.length()\n```\n\n可以使用在期望 `int` 类型结果的上下文。\n\n最后，你可以使用\
  \ `var` 表示推断类型。这并不常见。这种语法是为了附加注解的（参见第二卷的第 8 章）：\n\n点击此处查看代码图片\n\n```java\n(@NonNull\
  \ var first, @NonNull var second) -> first.length() - second.length()\n```\n\n如果\
  \ lambda 表达式在某些分支中返回值而在另一些分支中不返回是不合法的。例如，`(int x) -> { if (x >= 0) return 1; }`\
  \ 是无效的。\n\n列表 6.6 中的程序展示了如何为比较器和监听器使用 lambda 表达式。\n\n**列表 6.6** `lambda/LambdaTest.java`\n\
  \n点击此处查看代码图片\n\n\n\n\n\n```java\npackage lambda;\n\nimport java.util.*;\nimport\
  \ javax.swing.*;\nimport javax.swing.Timer;\n\n/**\n * 此程序演示了 lambda 表达式的使用。\n *\
  \ @version 1.0 2015-05-12\n * @author Cay Horst\n */\npublic class LambdaTest\n\
  {\n    public static void main(String[] args)\n    {\n        var planets = new\
  \ String[] { \"Mercury\", \"Venus\", \"Earth\", \"Mars\",\n           \"Jupiter\"\
  , \"Saturn\", \"Uranus\", \"Neptune\" };\n        System.out.println(Arrays.toString(planets));\n\
  \        System.out.println(\"Sorted in dictionary order:\");\n        Arrays.sort(planets);\n\
  \        System.out.println(Arrays.toString(planets));\n        System.out.println(\"\
  Sorted by length:\");\n        Arrays.sort(planets, (first, second) -> first.length()\
  \ - second.length());\n        System.out.println(Arrays.toString(planets));\n\n\
  \        var timer = new Timer(1000, event ->\n           System.out.println(\"\
  The time is \" + new Date()));\n        timer.start();\n\n        // Keep 程序运行直到用户选择\
  \ \"OK\"\n        JOptionPane.showMessageDialog(null, \"Quit program?\");\n    \
  \    System.exit(0);\n    }\n}\n```\n\n#### 6.2.3 函数式接口 (Functional Interfaces)\n\
  \n正如我们所讨论的，Java 中有很多现有接口封装了代码块，例如 `ActionListener` 或 `Comparator`。Lambda 与这些接口是兼容的。\n\
  \n当需要一个具有单一抽象方法的接口对象时，你可以提供一个 lambda 表达式。这种接口被称为 `functional interface`（函数式接口）。\n\
  \n![Images](img/note.jpg) 注意\n\n你可能会疑惑为什么函数式接口必须有一个单一的 `abstract` 方法。接口中的方法不都是抽象的吗？实际上，接口一直可以重新声明来自\
  \ `Object` 类的方法（如 `toString` 或 `clone`），而这些声明并不会使方法变为抽象方法。（Java API 中的某些接口重新声明 `Object`\
  \ 方法是为了附加 javadoc 注释。可以查看 `Comparator` API 作为一个示例。）更重要的是，正如你在第 6.1.5 节 中看到的，第 323\
  \ 页 上的“默认方法”接口可以声明非抽象方法。\n\n为了演示向函数式接口的转换，考虑 `Arrays.sort` 方法。它的第二个参数需要 `Comparator`\
  \ 实例，这是一个具有单一方法的接口。只需提供一个 lambda 即可：\n\n点击此处查看代码图像\n\n```java\nArrays.sort(words,\n\
  \   (first, second) -> first.length() - second.length());\n```\n\n在底层，`Arrays.sort`\
  \ 方法接收一个实现了 `Comparator<String>` 的某个类的对象。在该对象上调用 `compare` 方法会执行 lambda 表达式的体。这些对象和类的管理完全取决于实现，并且它比使用传统的内部类要高效得多。最好将\
  \ lambda 表达式看作一个函数而不是一个对象，并接受它可以被传递给函数式接口。\n\n这种向接口的转换正是 lambda 表达式如此迷人的原因。语法短又简单。这是另一个示例：\n\
  \n点击此处查看代码图像\n\n```java\nvar timer = new Timer(1000, event ->\n   {\n      System.out.println(\"\
  At the tone, the time is \"\n         + Instant.ofEpochMilli(event.getWhen()));\n\
  \      Toolkit.getDefaultToolkit().beep();\n   });\n```\n\n这比实现 `ActionListener`\
  \ 接口的类方案要易读得多。\n\n事实上，向函数式接口的转换是你在 Java 中对 lambda 表达式能做的`唯一`事情。在其他支持函数字面量的编程语言中，你可以声明如\
  \ `(String, String) -> int` 的函数类型，声明这些类型的变量，并使用这些变量来保存函数表达式。然而，Java 设计者决定坚持熟悉的接口概念，而不是向语言中添加函数类型。\n\
  \n![Images](img/note.jpg) 注意\n\n你甚至不能将 lambda 表达式赋值给 `Object` 类型的变量——`Object` 不是一个函数式接口。\n\
  \nJava API 在 `java.util.function` 包中定义了许多非常通用的函数式接口。其中一个接口 `BiFunction<T, U, R>`\
  \ 描述了参数类型为 `T` 和 `U` 且类型为 `R` 的函数。你可以将你的字符串比较 lambda 保存在该类型的变量中：\n\n点击此处查看代码图像\n\
  \n```java\nBiFunction<String, String, Integer> comp =\n   (first, second) -> first.length()\
  \ - second.length();\n```\n\n然而，这对你的排序没有帮助。没有 `Arrays.sort` 方法。`Arrays.sort` 方法想要一个\
  \ `BiFunction`。如果你以前用过函数式编程，可能会觉得这很奇怪。但对于 Java 程序员来说，这是很自然的。`java.util.function`\
  \ 包中一个特别有接口是 `Predicate`：\n\n点击此处查看代码图像\n\n```java\npublic interface Predicate<T>\n\
  {\n   boolean test(T t);\n}\n```\n\n`ArrayList` 类有一个 `removeIf` 方法。例如，以下语句从列表中移除所有\
  \ `null` 值：\n\n```java\nlist.removeIf(e -> e == null);\n```\n\n另一个有用的接口是 `Supplier<T>`：\n\
  \n```java\npublic interface Supplier<T>\n{\n   T get();\n}\n```\n\nSupplier 没有参数并在调用时产生\
  \ `T` 类型的值。Supplier 被用于`延迟求值`（lazy evaluation）。例如，考虑调用\n\n点击此处查看代码图像\n\n```java\n\
  LocalDate hireDay = Objects.requireNonNullElse(day,\n   LocalDate.of(1970, 1, 1));\n\
  ```\n\n这不是最优的。我们预计 `day` 很少为 `null`，所以只想在需要时构造 `LocalDate`。通过使用 supplier，我们可以延迟计算：\n\
  \n点击此处查看代码图像\n\n```java\nLocalDate hireDay = Objects.requireNonNullGet(day,\n  \
  \ () -> LocalDate.of(1970, 1, 1));\n```\n\n`requireNonNullGet` 方法只在需要时调用 supplier。\n\
  \n#### 6.2.4 方法引用 (Method References)\n\n有时，lambda 表达式涉及单个方法。例如，假设你只想在定时器事件发生时打印事件对象。当然，你可以调用\n\
  \n点击此处查看代码图像 \n\n```java\nvar timer = new Timer(1000, event -> System.out.println(event));\n\
  ```\n\n如果可以直接将 `println` 方法传递给 `Timer` 构造函数会更好。这是这样做的：\n\n点击此处查看代码图像\n\n```java\n\
  var timer = new Timer(1000, System.out::println);\n```\n\n表达式 `System.out::println`\
  \ 是一个`方法引用`。它指示编译器产生函数式接口的实例，覆盖接口的单一抽象方法以调用给的方法。在这个示例中，产生了一个 `ActionListener`，其\
  \ `actionPerformed(ActionEvent e)` 方法调用 `System.out.println(e)`。\n\n![Images](img/note.jpg)\
  \ 注意\n\n就像 lambda 表达式一样，方法引用并不是一个对象。它在赋值给类型为函数式接口的变量时才会产生一个对象。\n\n\n\n\n\n在 `PrintStream`\
  \ 类中有十个重载的 `println` 方法（其中 `System.out` 就是它的一个实例）。编译器需要根据上下文确定使用哪一个。在我们的示例中，方法引用\
  \ `System.out::println` 必须转换为一个具有如下方法的 `ActionListener` 实例：\n\n```\nvoid actionPerformed(ActionEvent\
  \ e)\n```\n\n从十个重载的 `println` 方法中选择了 `println(Object x)` 方法，因为 `Object` 是 `ActionEvent`\
  \ 的最佳匹配项。当调用 `actionPerformed` 方法时，事件对象就会被打印。\n\n现在，假设我们将同一个方法引用赋值给一个不同的函数式接口：\n\
  \n```\nRunnable task = System.out::println;\n```\n\n`Runnable` 函数式接口有一个不带参数的单抽象方法：\n\
  \n```\nvoid run()\n```\n\n在这种情况下，选择了无带参数的 `println()` 方法。调用 `task.run()` 会向 `System.out`\
  \ 打印一个空行。\n\n另一个例子，假设你想在忽略字母大小的情况下对字符串进行排序。你可以传递此方法表达式：\n\n点击此处查看代码图片\n\n```\nArrays.sort(strings,\
  \ String::compareToIgnoreCase)\n```\n\n从这些示例中可以可以看出，`::` 运算符将方法名与对象或类的名分开。共有三种变体：\n\
  \n1. `object`::`instanceMethod`\n2. `Class`::`instanceMethod`\n3. `Class`::`staticMethod`\n\
  \n在第一种变体中，方法引用等于一个 lambda 表达式，其参数被传递给方法。在 `System.out::println` 的情况下，对象是 `System.out`，方法表达式等于\
  \ `x -> System.out.println(x)`。\n\n在第二种变体内，第一个参数变为方法的隐式参数。例如，`String::compareToIgnoreCase`\
  \ 等于 `(x, y) -> x.compareToIgnoreCase(y)`。\n\n在第三种变体中，所有参数都传递给静态方法：`Math::pow` 等于\
  \ `(x, y) -> Math.pow(x, y)`。\n\n表 6.1 将带你了解更多示例。\n\n### 表 6.1 方法引用示例\n\n| 方法引用\
  \ | 等于 Lambda 表达式 | 备注 |\n| --- | --- | --- |\n| `separator::equals` | `x -> separator.equals(x)`\
  \ | 这是一个带有 `object` 和实例方法的方法表达式。lambda 参数作为方法的显式参数传递。 |\n| `String::trim` | `x ->\
  \ x.strip()` | 这是一个带有 `class` 和实例方法的方法表达式。lambda 参数变为隐式参数。 |\n| `String::concat`\
  \ | `(x, y) -> x.concat(y)` | 再次我们有一个实例方法，但这次带有显式参数。和之前一样，*第一个* lambda 参数变为隐式参数，其余参数被传递给方法。\
  \ |\n| `Integer.valueOf` | `x -> Integer.valueOf(x)` | 这是一个带有 `static` 方法的方法表达式。lambda\
  \ 参数被传递给静态方法。 |\n| `Integer.sum` | `(x, y) -> Integer.sum(x, y)` | 这是另一个静态方法，但这次有两个参数。两个\
  \ lambda 参数都传递给静态方法。`Integer.sum` 方法专门为了用作方法引用而创建的。作为 lambda，你可以直接写 `(x, y) -> x\
  \ + y`。 |\n| `String::new` | `x -> new String(x)` | 这是一个构造器引用——参见第 6.2.5 节。lambda\
  \ 参数传递给构造器。 |\n| `String[]::new` | `n -> new String[n]` | 这是一个数组构造器引用——参见第 6.2 节。lambda\
  \ 参数是数组长度。 |\n\n注意，只有当 lambda 表达式体调用单个方法且不做任何其他操作时，lambda 表达式才能重写为方法引用。考虑此 lambda\
  \ 表达式：\n\n```\ns -> s.length() == 0\n```\n\n只有一个方法调用。但还有一个比较，所以这里不能使用方法引用。\n\n![图片](img/note.jpg)\
  \ 注意\n\n当存在多个同名的重载方法时，编译器将尝试根据上下文查找指的是哪一个。例如，`Math.max` 方法有两个版本，一个针对整数，一个针对 `double`\
  \ 值。选取哪一个取决于 `Math::max` 转换到的函数式接口的方法参数。就像 lambda 表达式一样，方法引用并不孤立。它们总是被转换为函数式接口的实例。\n\
  \n![图片](img/note.jpg) 注意\n\n有时 API 包含专门设计用作方法引用的方法。例如，`Objects` 类有一个方法 `isNull`\
  \ 用于测试对象引用是否为 `null`。乍一看，这似乎并不有用，因为测试 `obj == null` 比 `Objects.isNull(obj)` 更易读。但你可以将方法引用传递给任何带有\
  \ `Predicate` 参数的方法。例如，要从列表中删除所有 `null` 引用，你可以调用：\n\n点击此处查看代码图片\n\n```\nlist.removeIf(Objects::isNull);\
  \ // 比 list.removeIf(e -> e == null) 更易读\n```\n\n\n\n数组构造器引用对于克服 Java 的一个局限性非常有用。正如你在第\
  \ 8 章中所看到的，无法构造泛型类型 `T` 的数组。（表达式 `new T[n]` 是一个错误，因为它会被“擦除”为 `new Object[n]`）。这对于库的作者来说是一个问题。例如，假设我们想要有一个\
  \ `Person` 对象的数组。`Stream` 接口有一个 `toArray` 方法，它返回一个 `Object` 数组：\n\n点击此处查看代码图片\n\n\
  ```\nObject[] people = stream.toArray();\n```\n\n但这并不如人意。用户想要的是一个包含 `Person` 引用的数组，而不是\
  \ `Object` 引用的数组。流式库通过构造器引用解决了这个问题。将 `Person[]::new` 传递给 `toArray` 方法：\n\n点击此处查看代码图片\n\
  \n```\nPerson[] people = stream.toArray(Person[]::new);\n```\n\n`toArray` 方法调用此构造器以获取正确类型的数组。然后它填充并返回该数组。\n\
  \n#### 6.2.6 变量作用域\n\n通常，你希望能够在 lambda 表达式中访问闭包方法或类的变量。考虑这个示例：\n\n点击此处查看代码图片\n\n\
  ```\npublic static void repeatMessage(String text, int delay)\n{\n   ActionListener\
  \ listener = event ->\n      {\n         System.out.println(text);\n         Toolkit.getDefaultToolkit().beep();\n\
  \      };\n   new Timer(delay, listener).start();\n}\n```\n\n考虑一个调用：\n\n点击此处查看代码图片\n\
  \n```\nrepeatMessage(\"Hello\", 1000); // 每隔 1000 毫秒打印一次 Hello\n```\n\n现在看 lambda\
  \ 表达式内部的变量 `text`。注意，这个变量*并不是*在 lambda 表达式中定义的。相反，它是 `repeatMessage` 方法的参数变量。\n\n\
  如果你仔细考虑，这里发生着一些显而易见的事情。lambda 表达式的代码可能在 `repeatMessage` 调用返回且参数变量消失后很久才运行。`text`\
  \ 变量是如何留存的？\n\n为了理解发生了什么，我们需要完善对 lambda 表达式的理解。一个 lambda 表达式包含三个要素：\n\n1. 一个代码块\n\
  2. 参数\n3. *自由*变量（free variables）的值——即既不是参数也不是在代码内部定义的变量\n\n在我们的示例中，lambda 表达式有一个自由变量\
  \ `text`。表示 lambda 表达式的数据结构必须存储自由变量的值——在我们的案例中，即字符串 `\"Hello\"`。我们称这些值被 lambda 表达式*捕获*（captured）了。（至于具体如何实现是其实现细节。例如，可以将\
  \ lambda 表达式转换为一个带有单个方法的对象，这样自由变量的值就会复制到该对象的实例变量中。）\n\n![图像](img/note.jpg) 注意\n\n\
  将代码块与自由变量的值结合在一起的专业术语是*闭包*（closure）。如果有人炫耀他们的语言拥有闭包，请放心，Java 也有。在 Java 中，lambda\
  \ 表达式就是闭包。\n\n正如你所看到的，lambda 表达式可以捕获外层作用域中变量的值。在 Java 中，为了确保捕获的值是有良好定义的，有一项重要的限制。在\
  \ lambda 表达式中，你只能引用值不会改变的变量。例如，以下代码是非法的：\n\n点击此处查看代码图片\n\n```\npublic static void\
  \ countDown(int start, int delay)\n{\n   ActionListener listener = event ->\n  \
  \    {\n         start--; // 错误不能修改捕获的变量\n         System.out.println(start);\n\
  \      };\n   new Timer(delay, listener).start();\n}\n```\n\n这种限制是有原因的。当多个动作并发执行时，在\
  \ lambda 表达式中修改变量是不安全的。对于我们目前看到的这类动作不会发生这种情况，但通常来说，这是一个严重的问题。关于这个重要问题的更多信息，请参见第\
  \ 12 章。\n\n在 lambda 表达式中引用在外部被修改的变量也是非法的。例如，以下代码是非法的：\n\n点击此处查看代码图片\n\n```\npublic\
  \ static void repeat(String text, int count)\n{\n   for (int i = 1; i <= count;\
  \ i++)\n   {\n      ActionListener listener = event ->\n         {\n           \
  \ System.out.println(i + \": \" + text);\n               // 错误不能引用发生变化的 i\n    \
  \     };\n      new Timer(1000, listener).start();\n   }\n}\n```\n\n规则是 lambda 表达式中的任何捕获变量必须是*有效最终的*（effectively\
  \ final）。有效最终变量是在初始化后从未被赋值过新值的变量。在我们的案例中，`text` 始终指向同一个 `String` 对象，捕获它是可以的。然而，`i`\
  \ 的值被修改了，因此 `i` 不能被捕获。\n\nlambda 表达式体与嵌套块的作用域相同。遮蔽规则同样适用。禁止在 lambda 中声明与捕获变量同名的局部变量。\n\
  \n当你在 lambda 表达式中使用 `this` 关键字时，你指的是方法的 `this` 参数。在 lambda 表达式中使用 `this` 没有什么特别的。例如，考虑\n\
  \n点击此处查看代码图片\n\n```\npublic class Application\n{\n   public void init()\n   {\n\
  \      ActionListener listener = event ->\n         {\n            System.out.println(this.toString());\n\
  \            . . .\n         }\n      . . .\n   }\n}\n```\n\n`this.toString()` 调用的是\
  \ `Application` 对象的 `toString` 方法，而不是 `ActionListener` 实例。lambda 的作用域在 `init` 方法内部。\n\
  \n#### 6.2.7 处理 lambda 表达式\n\n到目前，你已经看到了如何产生 lambda 表达式并将其传递给期望函数接口的方法。现在让我们编写消耗\
  \ lambda 表达式的方法。\n\n使用 lambda 的目的是延迟执行。毕竟如果你想立即执行代码，直接这样做即可，不需要将其封装在 lambda 中。延迟执行的原因有很多：\n\
  \n* 在单独线程中执行代码\n* 多次执行代码\n* 在算法的正确位置执行代码（例如排序中的比较操作）\n* 当发生发生时执行代码（按钮点击、数据到达等）\n\
  * 需要时才执行代码\n\n来看一个简单的例子。假设你想重复执行动作 `n`。动作和计数被传递给 `repeat` 方法：\n\n点击此处查看代码图片\n\n\
  ```\nrepeat(10, () -> System.out.println(\"Hello, World!\"));\n```\n\n为了接受 lambda，我们需要选择（在极少数情况下提供）一个函数接口。表\
  \ 6.2 列出了 Java API 提供的最重要的函数接口。在例例中，我们可以使用 `Runnable` 接口：\n\n点击此处查看代码图片\n\n```\n\
  public static void repeat(int n, Runnable action)\n{\n   for (int i = 0; i < n;\
  \ i++) action.run();\n}\n```\n\n**表 6.2** 常见函数接口\n\n\n\n\n| 功能式接口 | 参数类型 | 返回类型\
  \ | 抽象方法名 | 说明 | 其他方法 |\n| --- | --- | --- | --- | --- | --- |\n| `Runnable` | 无\
  \ | `void` | `run` | 执行无参数无返回值的动作 | |\n| `Supplier<T>` | 无 | `T` | `get` | 提供一个类型为\
  \ `T` 的值 | |\n| `Consumer<T>` | `T` | `void` | `accept` | 消费一个类型为 `T` 的值 | `andThen`\
  \ |\n| `BiConsumer<T, U>` | `T`, `U` | `void` | `accept` | 消费类型为 `T` 和 `U` 的值 |\
  \ `andThen` |\n| `Function<T, R>` | `T` | `R` | `apply` | 参数类型为 `T` 的函数 | `compose`,\
  \ `andThen`, `identity` |\n| `BiFunction<T, U, R>` | `T`, `U` | `R` | `apply` |\
  \ 参数类型为 `T` 和 `U` 的函数 | `andThen` |\n| `UnaryOperator<T>` | `T` | `T` | `apply`\
  \ | 类型为 `T` 的一元运算符 | `compose`, `andThen`, `identity` |\n| `BinaryOperator<T>` |\
  \ `T`, `T` | `T` | `apply` | 类型为 `T` 的二元运算符 | `andThen`, `maxBy`, `minBy` |\n| `Predicate<T>`\
  \ | `T` | `boolean` | `test` | 返回 `boolean` 值的函数 | `and`, `or`, `negate`, `isEqual`,\
  \ `not` |\n| `BiPredicate<T, U>` | `T`, `U` | `boolean` | `test` |get 两个参数并返回 `boolean`\
  \ 值的函数 | `and`, `or`, `negate` |\n\n注意当调用 `action.run()` 时会执行 lambda 表达式的体。\n\n\
  现在让这个例子变得稍微复杂一点。我们想告知动作发生在哪一次迭代。为了这一点，我们需要选择一个具有 `int` 参数和 `void` 返回值方法的功能式接口。处理\
  \ `int` 值的标准接口是：\n\n```\npublic interface IntConsumer\n{\n   void accept(int value);\n\
  }\n```\n\n这里是 `repeat` 方法的改进版本：\n\n点击此处查看代码图像\n\n```java\npublic static void repeat(int\
  \ n, IntConsumer action)\n{\n   for (int i = 0; i < n; i++) action.accept(i);\n\
  }\n```\n\n以下是调用方式：\n\n点击此处查看代码图像\n\n```java\nrepeat(10, i -> System.out.println(\"\
  Countdown: \" + (9 - i)));\n```\n\n表 6.3 列出了针对基本数据类型 `int`、`long` 和 `double` 的 34\
  \ 个可用特化版本。如你在第 8 章 中所示，使用这些特化版本比使用通用接口更高效。出于这个原因，在上节的示例中，我使用了 `IntConsumer` 而不是\
  \ `Consumer<Integer>`。\n\n**表 6.3** 针对基本数据类型的功能式接口 **p*, *q* 是 `int`, `long`, `double`；*P*,\
  \ *Q* 是 `Int`, `Long`, `Double`*\n\n| 功能式接口 | 参数类型 | 返回类型 | 抽象方法名 |\n| --- | ---\
  \ | --- | --- |\n| `BooleanSupplier` | 无 | `boolean` | `getAsBoolean` |\n| `PSupplier`\
  \ | 无 | `p` | `getAs` |\n| `PConsumer` | `p` | `void` | `accept` |\n| `ObjPConsumer<T>`\
  \ | `T`, `p` | `void` | `accept` |\n| `PFunction<T>` | `p` | `T` | `apply` |\n|\
  \ `PTQFunction` | `p` | `q` | `applyAsQ` |\n| `TPFunction<T>` | `T` | `p` | `applyAsP`\
  \ |\n| `TPBiFunction<T, U>` | `T`, `U` | `p` | `applyAsP` |\n| `PUnaryOperator`\
  \ | `p` | `p` | `applyAsP` |\n| `PBinaryOperator` | `p`, `p` | `p` | `applyAsP`\
  \ |\n| `PPredicate` | `p` | `boolean` | `test` |\n\n![Images](img/tip.jpg) 提示\n\n\
  使用来自表 6.2 或 6 的接口是一个好主意。（注意：此处提供的此处包含重复/乱码字符串，但保留了核心结构）。\n\n\n\n\n\n```java\nArrays.sort(people,\
  \ Comparator.comparing(Person::getName,\n   (s, t) -> Integer.compare(s.length(),\
  \ t.length())));\n```\n\n此外，`comparing` 和 `thenComparing` 方法都有可以避免 `int`、`long`\
  \ 或 `double` 值装箱的变体。产生上述操作的一种简单方法是：\n\n点击此处查看代码图像\n\n```java\nArrays.sort(people,\
  \ Comparator.comparingInt(p -> p.getName().length()));\n```\n\n如果你的键函数可以返回 `null`，那么你会喜欢\
  \ `nullsFirst` 和 `nullsLast` 适配器。这些静态方法接收一个现有的比较器并对其进行修改，使其在遇到 `null` 值时不会向抛出异常，而是将其排为比普通值小或大。例如，假设\
  \ `getMiddleName` 在人没有中间名时返回 `null`。那么你可以使用 `Comparator.comparing(Person::getMiddleName,\
  \ Comparator.nullsFirst(. . .))`。\n\n`nullsFirst` 方法需要一个比较器——在这种情况下，是一个比较两个字符串的比较器。`naturalOrder`\
  \ 方法为任何实现 `Comparable` 的类创建一个比较器。我们需要的是 `Comparator.<String>naturalOrder()`。这里是按可能为为空的中间名进行排序的完整调用。我使用了\
  \ `java.util.Comparator.*` 的静态导入，以使表达式更具可读性。注意 `naturalOrder` 的类型是推断的。\n\n点击此处查看代码图像\n\
  \n```java\nArrays.sort(people, comparing(Person::getMiddleName, nullsFirst(naturalOrder())));\n\
  ```\n\n静态的 `reverseOrder` 方法提供自然顺序的反序。要反转任何比较器，请使用 `reversed` 实例方法。例如，`naturalOrder().reversed()`\
  \ 等同于 `reverseOrder()`。\n\n## 6.3 内部类\n\n*内部类*是定义在另一个类内部的类。为什么要这样做呢？有两个原因：\n\n*\
  \ 内部类可以对同一个包中的其他类隐藏。\n* 内部类方法可以访问其所在作用域的数据——包括那些在其他情况下是私有的数据。\n\n内部类曾对于简洁地实现回调函数非常重要，但现在\
  \ lambda 表达式做得好得多。尽管如此，内部类对于结构化代码仍然非常有用。接下来的章节将带你了解所有细节。\n\n![Images](img/cnote.jpg)\
  \ C++ 笔记\n\nC++ 有*嵌套类*。嵌套类包含在外部类的作用域内。这是一个典型的例子：一个链表类定义了一个用于持有链结的类，以及一个用于定义迭代器位置的类。\n\
  \n点击此处查看代码图像\n\n```cpp\nclass LinkedList\n{\npublic:\n   class Iterator // 嵌套类\n\
  \   {\n   public:\n      void insert(int x);\n      int erase();\n      . . .\n\
  \   private:\n      Link* current;\n      LinkedList* owner;\n   };\n   . . .\n\
  private:\n   Link* head;\n   Link* tail;\n};\n```\n\n嵌套类与 Java 的内部类相似。然而，Java 内部类还有一个额外功能，使得它们比\
  \ C++ 的嵌套类更丰富、更有用。来自内部类的对象有一个对实例化它的外部对象的隐式引用。通过这个指针，它获得了访问外部对象整体的状态。例如，在 Java 中，`Iterator`\
  \ 类不需要指向它所指向的 `LinkedList` 的显式指针。\n\n在 Java 中，`static` 内部类没有这个额外的指针。它们是 C++ 嵌套类的\
  \ Java 对应物。\n\n### 6.3.1 使用内部类访问对象状态\n\n内部类的语法相当复杂。因此，我提供了一个简单但有些人为构造的示例来演示内部类的用法。让我们重构\
  \ `TimerTest` 示例并提取出一个 `TalkingClock` 类。会报钟由两个参数构造：公告之间的间隔以及一个开启或关闭哔声的标志。\n\n点击此处查看代码图像\n\
  \n```java\npublic class TalkingClock\n{\n   private int interval;\n   private boolean\
  \ beep;\n\n   public TalkingClock(int interval, boolean beep) { . . . }\n   public\
  \ void start() { . . . }\n\n   public class TimePrinter implements ActionListener\n\
  \      // 内部类\n   {\n      . . .\n   }\n}\n```\n\n注意 `TimePrinter` 类现在位于 `TalkingClock`\
  \ 类内部。这*并不意味着*每个 `TalkingClock` 都有一个 `TimePrinter` 实例字段。正如你将看到的，`TimePrinter` 对象是通过\
  \ `TalkingClock` 类的方法构造的。\n\n这里是更详细的 `TimePrinter` 类。注意 `actionPerformed` 方法在发出哔声之前会检查\
  \ `beep` 标志。\n\n点击此处查看代码图像\n\n```java\npublic class TimePrinter implements ActionListener\n\
  {\n   public void actionPerformed(ActionEvent event)\n   {\n      System.out.println(\"\
  At the tone, the time is \"\n         + Instant.ofEpochMilli(event.getWhen()));\n\
  \      if (beep) Toolkit.getDefaultToolkit().beep();\n   }\n}\n```\n\n发生发生一些令人惊讶的事情。`TimePrinter`\
  \ 类没有实例字段 `beep`。相反，`beep` 指向创建它的 `TalkingClock` 对象的字段。`TimePrinter` 类现在位于 `TalkingClock`\
  \ 类内部。这*并不意味着*每个 `TalkingClock` 都有一个 `TimePrinter` 实例字段。指向创建它的对象的引用。\n\n再次，请注意 *outer*\
  \ 并不是 Java 关键字。我们只是用它来说说明内部类涉及的机制。为了使此正常工作，内部类总是会获得外部对象的引用（参见图 6.3）。\n\n![Images](img/06fig03.jpg)\n\
  \n**图 6.3** 内部类对象有一个外部对象的引用\n\n这个引用在内部类的定义中是不可见的。然而，为了阐明这个概念，我们将指向外部对象的引用命名为 `outer`。那么\
  \ `actionPerformed` 方法等同于以下内容：\n\n点击此处查看代码图像\n\n```java\npublic void actionPerformed(ActionEvent\
  \ event)\n{\n   System.out.println(\"At the tone, the time is \"\n      + Instant.ofEpochMilli(event.getWhen()));\n\
  \   if (outer.beep) 引用在构造函数中设置。编译器修改所有内部类构造函数，添加一个外部类引用的参数。`TimePrinter` 类没有定义构造函数；因此，编译器合成了一个无参数构造函数，生成的代码如下：\n\
  \n点击此处查看代码图像\n\n```java\npublic TimePrinter(TalkingClock clock) // 自动生成的代码\n{\n\
  \   outer = clock;\n}\n```\n\n当在 `start` 方法中构造 `TimePrinter` 对象时，编译器将当前时钟的 `this`\
  \ 传递到构造函数：\n\n点击此处查看代码图像\n\n```java\nvar listener = new TimePrinter(this); // 参数自动添加\n\
  ```\n\n列表 6.7 显示了测试内部类的完整程序。再次查看访问控制。如果 `TimePrinter` 类是一个普通类，它将需要通过 `TalkingClock`\
  \ 类的公共方法访问 `beep` 标志。使用内部类是一种改进。没有提供仅对另一个类感兴趣的访问器。\n\n![Images](img/note.jpg) 笔记\n\
  \n我们可以将 `TimePrinter` 类声明为 `private`。这样只有 `TalkingClock` 方法才能构造 `TimePrinter` 对象。只有内部类可以是私有的。普通类总是具有包级或公共访问权限。\n\
  \n\n\n\n\n```java\npackage innerClass;\n\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import java.time.*;\n\nimport javax.swing.*;\n\n/**\n * 此程序演示了内部类的用法。\n * @version\
  \ 1.11 2017-12-14\n * @author Cay Horstmann\n */\npublic class InnerClassTest\n\
  {\n    public static void main(String[] args)\n    {\n       var clock = new TalkingClock(1000,\
  \ true);\n       clock.start();\n\n       // 保持程序运行直到用户选择“确定”\n       JOptionPane.showMessageDialog(null,\
  \ \"Quit program?\");\n       System.exit(0);\n    }\n}\n\n/**\n * 一个按固定间隔打印时间的闹钟。\n\
  \ */\nclass TalkingClock\n{\n    private int interval;\n    private boolean beep;\n\
  \n    /**\n     * 构造一个报时钟\n     * @param interval 消息之间的间隔（毫秒）\n     * @param beep\
  \ 如果闹钟应该鸣响，则为 true\n     */\n    public TalkingClock(int interval, boolean beep)\n\
  \    {\n       this.interval = interval;\n       this.beep = beep;\n    }\n\n  \
  \  /**\n     * 启动闹钟。\n     */\n    public void start()\n    {\n       var listener\
  \ = new TimePrinter();\n       var timer = new Timer(interval, listener);\n    \
  \   timer.start();\n    }\n\n    public class TimePrinter implements ActionListener\n\
  \    {\n        public void actionPerformed(ActionEvent event)\n        {\n    \
  \       System.out.println(\"At the tone, the time is \"\n              + Instant.ofEpochMilli(event.getWhen()));\n\
  \           if (beep) Toolkit.getDefaultToolkit().beep();\n        }\n    }\n}\n\
  ```\n\n### 6.3.2 内部类的特殊语法规则\n\n在前面的节中，我们通过将内部类的外部类引用称为 `outer`。实际上实际上，外部引用的正确语法稍微复杂一些。表达式\n\
  \n```\nOuterClass.this\n```\n\n表示外部类引用。例如，你可以这样写 `TimePrinter` 内部类的 `actionPerformed`\
  \ 方法：\n\n```java\npublic void actionPerformed(ActionEvent event)\n{\n   . . .\n\
  \   if (TalkingClock.this.beep) Toolkit.getDefaultToolkit().beep();\n}\n```\n\n\
  相反，你可以使用以下语法更显式地编写内部对象构造函数：\n\n```\nouterObject.new InnerClass(construction parameters)\n\
  ```\n\n例如：\n\n```java\nActionListener listener = this.new TimePrinter();\n```\n\n\
  在这里，新构造的 `TimePrinter` 对象的外部类引用被设置为创建内部类对象的方法的 `this` 引用。这是最常见的情况。像既往一样，`this.`\
  \ 修符是多余的。然而，也可以通过显式命名将外部类引用设置为另一个对象。例如，由于 `TimePrinter` 是一个公共内部类，你可以为任何报时闹钟构造一个\
  \ `TimePrinter`：\n\n```java\nvar jabberer = new TalkingClock(1000, true);\nTalkingClock.TimePrinter\
  \ listener = jabberer.new TimePrinter();\n```\n\n注意，当内部类出现在外部类的作用域之外，你将其引用为\n\n\
  ```\nOuterClass.InnerClass\n```\n\n![Images](img/note.jpg) 注意\n\n在内部类中声明的任何静态字段必须是\
  \ `final` 的并用编译时常量初始化。如果该字段不是常量，它可能不是唯一的。\n\n内部类不能有 `static` 方法。Java 语言规范没有给出这种限制的理由。理论上可以允许仅访问封装类中静态字段和方法的静态方法。显然，语言设计者认为复杂性大于其带来的收益。\n\
  \n### 6.3.3 内部类有用吗？真的必要吗？安全吗？\n\n当内部类在 Java 1.1 中添加到 Java 语言时，许多程序员认为它们是一项重大的新特性，这与\
  \ Java 比 C++ 更简单的哲学格格不入。内部类的语法不可否认地是复杂的（在我们在本节后面学习匿名内部类时，它会变得更加复杂）。还不清楚内部类如何与语言的其他特性（如访问控制和安全）交互。\n\
  \n内部类被翻译成普通的类文件，并用 `$`（美元符号）分隔外部类和内部类名。例如，`TalkingClock` 类内部的 `TimePrinter` 类被翻译为文件\
  \ `TalkingClock$TimePrinter.class`。\n\n\n\n\n注意编译器为外部类添加的静态 `access$0` 方法。它返回作为参数传递的对象的\
  \ `beep` 字段。（根据编译器的不同，方法名可能会略有不同，例如 `access$000`。）这是一个潜在的安全风险，并且让分析类文件的工具变得变得复杂。从\
  \ Java 11 开始，虚拟机能够理解类与之间的嵌套关系，因此不再生成这些访问方法。\n\n### 6.3.4 局部内部类\n\n如果你仔细查看 `TalkingClock`\
  \ 示例的代码，你会发现你只需要一次使用 `TimePrinter` 类型的名称：即在 `start` 方法中创建该类型的对象时。\n\n在这样的情况下，你可以将类*`定义在单个方法内部`*。\n\
  \n点击此处查看代码图像\n\n```java\npublic void start()\n{\n   class TimePrinter implements\
  \ ActionListener\n   {\n      public void actionPerformed(ActionEvent event)\n \
  \     {\n         System.out.println(\"At the tone, the time is \"\n           \
  \ + Instant.ofEpochMilli(event.getWhen()));\n         if (beep) Toolkit.getDefaultToolkit().beep();\n\
  \      }\n   }\n\n   var listener = new TimePrinter();\n   var timer = new Timer(interval,\
  \ listener);\n   timer.start();\n}\n```\n\n局部类从不声明访问修饰符（即 `public` 或 `private`）。它们的作用域始终限制在声明它们所在的块中。\n\
  \n局部类有一个巨大的优势：它们对外部世界完全隐藏——即使是 `TalkingClock` 类中的其他代码也无法访问它们。除了 `start` 方法外，没有任何方法知道\
  \ `TimePrinter` 类的信息。\n\n### 6.3.5 从外部方法访问变量\n\n局部类相对于其他内部类还有另一个优势。它们不仅可以访问外部类的字段；甚至可以访问局部变量！然而，这些局部变量必须是*事实上的*`final`（effectively\
  \ `final`）。这意味着它们一旦被赋值，就永远不会改变。\n\n这是一个典型的例子。让我们将 `interval` 和 `beep` 参数从 `TalkingClock`\
  \ 的构造函数移动到 `start` 方法。\n\n点击此处查看代码图像\n\n```java\npublic void start(int interval,\
  \ boolean beep)\n{\n   class TimePrinter implements ActionListener\n   {\n     \
  \ public void actionPerformed(ActionEvent event)\n      {\n         System.out.println(\"\
  At the tone, the time is \"\n            + Instant.ofEpochMilli(event.getWhen()));\n\
  \         if (beep) Toolkit.getDefaultToolkit().beep();\n      }\n   }\n\n   var\
  \ listener = new TimePrinter();\n   var timer = new Timer(interval, listener);\n\
  \   timer.start();\n}\n```\n\n注意，`TalkingClock` 类不再需要存储 `beep` 实例。它只是引用了 `start`\
  \ 方法的 `beep` 参数。\n\n也许这并不令人意外。毕竟 `if (beep) . . .` 这一行最终位于 `start` 方法内部，那么它为什么它不能访问\
  \ `beep` 变量的值呢？\n\n为了看到为什么存在这个微妙的问题，让我们仔细观察控制流：\n\n1. 调用 `start` 方法。\n2. 通过调用内部类\
  \ `TimePrinter` 的构造函数来初始化对象 `listener`。\n3. 将 `listener` 引用传递给 `Timer` 构造函数，启动定时器，`start`\
  \ 方法退出。此时，`start` 方法的 `beep` 参数已不再存在。\n4. 一秒后，`actionPerformed` 方法执行 `if (beep)\
  \ . . .`\n\n为了让 `actionPerformed` 方法中的代码正常工作，`TimePrinter` 类必须在 `beep` 参数消失之前，将\
  \ `beep` 字段作为 `start` 方法的局部变量进行了复制。这确实发生了。在我们的示例中，编译器为内部类合成了名称 `TalkingClock$1TimePrinter`。如果你使用\
  \ `ReflectionTest` 程序或 `javap` 工具来监视 `TalkingClock$1TimePrinter` 类，你将得到以下输出：\n\n\
  点击此处查看代码图像\n\n```\nclass TalkingClock$1TimePrinter\n{\n   TalkingClock$1TimePrinter();\n\
  \n   public void actionPerformed(java.awt.event.ActionEvent);\n\n   final boolean\
  \ val$beep;\n   final TalkingClock$0;\n}\n```\n\n当创建对象时，`beep` 变量的当前值存储在 `val$beep`\
  \ 字段中。从 Java 11 开始，这是通过“嵌套”（nest）访问实现的。在此之前，内部类构造函数有一个额外的参数来设置字段。无论何种方式，即使局部变量超出作用域，内部类的字段依然存在。\n\
  \n### 6.3.6 匿名内部类\n\n在使用局部类时，你通常可以更进一步。如果你只想创建该类的单个对象，你甚至不需要给类命名。这样的类被称为*`匿名内部类`*。\n\
  \n点击此处查看代码图像\n\n```java\npublic void start(int interval, boolean beep)\n{\n   var\
  \ listener = new ActionListener()\n      {\n         public void actionPerformed(ActionEvent\
  \ event)\n         {\n            System.out.println(\"At the tone, the time is\
  \ \"\n               + Instant.ofEpochMilli(event.getWhen()));\n            if (beep)\
  \ Toolkit.getDefaultToolkit().beep();\n         }\n      };\n\n   var timer = new\
  \ Timer(interval, listener);\n   timer.start();\n}\n```\n\n这种语法非常晦懂。它的意思是：在大括号 `{\
  \ }` 内部定义 `actionPerformed` 方法，创建一个实现 `ActionListener` 接口的对象。\n\n通常情况下，语法如下：\n\n\
  点击此处查看代码图像\n\n```\nnew SuperType(参数)\n   {\n      数据\n}\n```\n\n在这里，`SuperType`\
  \ 可以是一个接口，那么内部类实现该接口。`SuperType` 也可以是一个类，那么内部类继承该类。\n\n匿名内部类没有构造函数，因为构造函数的名称必须与类相同，而该类没有名称。相反，构造参数被传递给了父类构造函数。特别是每当内部类实现接口时，它没有构造参数。尽管如此，你必须提供一组括号，如下：\n\
  \n```\nnew InterfaceType()\n   {\n      数据\n}\n```\n\n你必须仔细观察构造类和构造匿名内部类对象之间的区别。\n\
  \n点击此处查看代码图像\n\n```java\nvar queen = new Person(\"Mary\");\n// 一个 Person 对象\nvar\
  \ count = new Person(\"Dracula\") { . . . };\n// 一个继承 Person 的内部类对象\n```\n\n如果构造参数列表的右括号紧跟着一个左大括号，那么正在定义一个匿名内部类。\n\
  \n![Images](img/note.jpg) 注意\n\n尽管匿名类没有构造函数，但你可以提供对象初始化块：\n\n点击此处查看代码图像\n\n```java\n\
  var count = new Person(\"Dracula\")\n   {\n      { 初始化 }\n      . . .\n   };\n```\n\
  \n列表 6.8 包含了带有匿名内部类的时钟程序的完整源代码。如果你将此程序与列表 6.7 进行比较，你会发现在这种情况下，使用匿名内部类的解决方案要短得多，而且如果经过练习，可能更容易理解。\n\
  \n多年来，Java 程序员经常使用匿名内部类作为事件监听器和其他回调。现在，使用 Lambda 表达式会更好。例如，本节开头的 `start` 方法可以使用\
  \ Lambda 表达式写得更加简洁，如下：\n\n\n\n\n\n点击此处查看代码图像\n\n```\npublic void start(int interval,\
  \ boolean beep)\n{\n   var timer = new Timer(interval, event ->\n      {\n     \
  \    System.out.println(\n            \"At the tone, the time is \" + Instant.ofEpochMilli(event.getWhen()));\n\
  \         if (beep) Toolkit.getDefaultToolkit().beep();\n      });\n   timer.start();\n\
  }\n```\n\n![Images](img/note.jpg) 备注\n\n如果你在用 `var` 定义的变量中存储一个匿名类实例，该变量将感知到添加的方法或字段：\n\
  \n点击此处查看代码图像\n\n```\nvar bob = new Object() { String name = \"Bob\"; }\nSystem.out.println(bob.name);\n\
  ```\n\n如果你将 `bob` 声明为 `Object` 类型，那么 `bob.name` 将无法通过编译。\n\n通过 `new Object() { String\
  \ name = \"Bob\"; }` 构建的对象类型为“带有 `String name` 字段的 `Object`”。这是一个不可表示的（nondenotable）类型——即你无法用\
  \ Java 语法表达的类型。尽管如此，编译器理解该类型，并可以设置为 `bob` 变量的类型。\n\n![Images](img/note.jpg) 备注\n\
  \n下面这种被称为“双大括号初始化”（double brace initialization）的技巧利用了内部类语法。假设你想构造一个列表并将其传递给方法：\n\
  \n点击此处查看代码图像\n\n```\nvar friends = new ArrayList<String>();\nfriends.add(\"Harry\"\
  );\nfriends.add(\"Tony\");\ninvite(friends);\n```\n\n如果你不再需要这个数组列表，那么将其匿名化会很不错。但这时你该如何添加元素呢？方法如下：\n\
  \n点击此处查看代码图像\n\n```\ninvite(new ArrayList<String>() {{ add(\"Harry\"); add(\"Tony\"\
  ); }});\n```\n\n注意双层大括号。外层大括号创建了 `ArrayList` 的匿名子类。内层大括号是一个对象初始化块（参见第 4 章）。\n\n\
  在实践中，这种技巧很少用。更有可能的是 `invite` 方法愿意接受任何 `List<String>`，你只需简单传递 `List.of(\"Harry\"\
  , \"Tony\")` 即可。\n\n![Images](img/caution.jpg) 注意\n\n创建一个与其父类几乎相同但不完全相同的匿名子类通常很方便。但你需要小心\
  \ `equals` 方法。在第 5 章中，我建议你的 `equals` 方法使用如下测试：\n\n点击此处查看代码图像\n\n```\nif (getClass()\
  \ != other.getClass()) return false;\n```\n\n匿名子类将通过这项测试。\n\n![Images](img/tip.jpg)\
  \ 提示\n\n当你生成日志或调试信息时，通常可能包含包含当前类的名称，例如：\n\n点击此处查看代码图像\n\n```\nSystem.err.println(\"\
  Something awful happened in \" + getClass());\n```\n\n但这在静态方法中会失败。毕竟，对 `getClass`\
  \ 的调用调用的是 `this.getClass()`，而静态方法没有 `this`。请使用以下表达式：\n\n点击此处查看代码图像\n\n```\nnew Object(){}.getClass().getEnclosingClass()\
  \ // 获取静态方法的类\n```\n\n在这里，`new Object(){}` 创建了一个 `Object` 匿名子类的匿名对象，而 `getEnclosingClass`\
  \ 获取它的闭合类——即包含该静态方法的类。\n\n**列表 6.8** `anonymousInnerClass/AnonymousInnerClassTest.java`\n\
  \n点击此处查看代码图像\n\n```\n 1 package anonymousInnerClass;\n 2\n 3 import java.awt.*;\n\
  \ 4 import java.awt.event.*;\n 5 import java.time.*;\n 6\n 7 import javax.swing.*;\n\
  \ 8\n 9 /**\n10  * 此程序演示了匿名内部类。\n11  * @version 1.12 2017-12-14\n12  * @author Cay\
  \ Horstmann\n13  */\n14 public class AnonymousInnerClassTest\n15 {\n16    public\
  \ static void main(String[] args)\n17    {\n18       var clock = new TalkingClock();\n\
  19       clock.start(1000, true);\n20\n21       // 保持程序运行，直到用户选择 \"OK\"\n22    \
  \   JOptionPane.showMessageDialog(null, \"Quit program?\");\n23       System.exit(0);\n\
  24    }\n25 }\n26\n27 /**\n28  * 一个按固定间隔打印时间的钟。\n29  */\n30 class TalkingClock\n\
  31 {\n32    /**\n33     * 启动闹钟。\n34     * @param interval 消息之间的间隔（毫秒）\n35     *\
  \ @param beep 如果闹钟应该响则为 true\n36     */\n37    public void start(int interval, boolean\
  \ beep)\n38    {\n39       var listener = new ActionListener()\n40          {\n\
  41              public void actionPerformed(ActionEvent event)\n42             \
  \ {\n43                 System.out.println(\"At the tone, the time is \"\n44   \
  \                 + Instant.ofEpochMilli(event.getWhen()));\n45                \
  \ if (beep) Toolkit.getDefaultToolkit().beep();\n46              }\n47         \
  \ };\n48       var timer = new Timer(interval, listener);\n49       timer.start();\n\
  50    }\n51 }\n```\n\n### 6.3.7 静态内部类\n\n偶尔，你可能只想使用内部类来将一个类隐藏在另一个类内部——但你不需要内部类持有外部类对象的引用。你可以通过将内部类声明为\
  \ `static` 来抑制该引用的生成。\n\n这里有一个你想要这样做的典型示例。考虑计算数组中最小值和最大值的任务。当然，你写了一个方法来计算最小值和最大值。当你同时调用这两个方法时，数组会被遍历两次。更有效率的方法是只遍历一次数组同时计算最小值和最大值。\n\
  \n点击此处查看代码图像\n\n```java\ndouble min = Double.POSITIVE_INFINITY;\ndouble max = Double.NEGATIVE_INFINITY;\n\
  for (double v : values)\n{\n   if (v < min) min = v;\n   if (v > max) max = v;\n\
  }\n```\n\n然而，`minmax` 方法必须返回两个数字。我们可以通过定义一个持有两个数值的 `Pair` 类来实现：\n\n点击此处查看代码图像\n\n\
  ```java\nclass Pair\n{\n   private double first;\n   private double second;\n\n\
  \   public Pair(double f, double s)\n   {\n      first = f;\n      second = s;\n\
  \   }\n   public double getFirst() { return first; }\n   public double getSecond()\
  \ { return second; }\n}\n```\n\n`minmax` 方法就可以返回一个 `Pair` 类型的对象。\n\n点击此处查看代码图像\n\
  \n```java\nclass ArrayAlg\n{\n   public static Pair minmax(double[] values)\n  \
  \ {\n      . . .\n      return new Pair(min, max);\n   }\n}\n```\n\n当然，`Pair` 是一个极其常见的名称，在大型项目中，很有可能其他程序员也有同样的构思——但创建了一个包含两个字符串的\
  \ `Pair` 类。我们可以通过将 `Pair` 变为 `ArrayAlg` 内部的公共类来解决这个潜在的命名冲突。这样该类对公开为 `ArrayAlg.Pair`：\n\
  \n点击此处查看代码图像\n\n```java\nArrayAlg.Pair p = ArrayAlg.minmax(d);\n```\n\n然而，与之前示例中的内部类不同，我们不想让\
  \ `Pair` 对象内部持有其他对象的引用。这种引用可以通过将内部类声明为 `static` 来抑制：\n\n```java\nclass ArrayAlg\n\
  {\n   public static class Pair\n   {\n      . . .\n   }\n   . . .\n}\n```\n\n当然，只有内部类可以为静态。静态内部类与任何其他内部类完全一样，静态静态内部类对象持有生成它的外部类对象的引用。在我们示例中，我们必须使用静态内部类，因为内部类对象是在静态方法内部构造的。\n\
  \n\n\n\n\n```java\npublic static Pair minmax(double[] d)\n{\n   . . .\n   return\
  \ new Pair(min, max);\n}\n```\n\n如果 `Pair` 类没有被声明为 `static`，编译器将报错，提示没有可用的 `ArrayAlg`\
  \ 类型隐式对象来初始化内部类对象。\n\n![Images](img/note.jpg) 提示\n\n当内部类不需要访问外部类对象时，请始终使用静态内部类。有些程序员使用\
  \ `nested class`（嵌套类）一术来描述静态内部类。\n\n![Images](img/note.jpg) 提示\n\n与普通内部类不同，静态内部类可以拥有静态字段和方法。\n\
  \n![Images](img/note.jpg) 提示\n\n在接口内部定义的类自动是 `static` 且 `public` 的。\n\n![Images](img/note.jpg)\
  \ 提示\n\n在类内部声明的接口、record 和枚举自动是 `static` 的。\n\nListing 6.9 包含了 `ArrayAlg` 类和嵌套 `Pair`\
  \ 类的完整源代码。\n\n**Listing 6.9** `staticInnerClass/StaticInnerClass.java`\n\n点击此处查看代码图片\n\
  \n```\n 1 package staticInnerClass;\n 2\n 3 /**\n 4  * 此程序演示了静态内部类的用法。\n 5  * @version\
  \ 1.02 2015-05-12\n 6  * @author Cay Horstmann\n 7  */\n 8 public class StaticInnerClassTest\n\
  \ 9\n{\n10    public static void main(String[] args)\n11    {\n12       var values\
  \ = new double[20];\n13       for (int i = 0; i < values.length; i++)\n14      \
  \    values[i] = 100 * Math.random();\n15       ArrayAlg.Pair p = ArrayAlg.minmax(values);\n\
  16       System.out.println(\"min = \" + p.getFirst());\n17       System.out.println(\"\
  max = \" + p.getSecond());\n18    }\n19 }\n20\n21 class ArrayAlg\n22\n{\n23    /**\n\
  24     * 一对浮点数\n25     */\n26    public static class Pair\n27\n    {\n28       private\
  \ double first;\n29       private double second;\n30\n31     /**\n32      * 从两个浮点数构造一个对数对象\n\
  33      * @param f 第一个数字\n34      * @param s 第二个数字\n35      */\n36     public Pair(double\
  \ f, double s)\n37     {\n38        first = f;\n39        second = s;\n40     }\n\
  41\n42     /**\n43      * 返回对数中的第一个数字\n44      * @return 第一个数字\n45      */\n46 \
  \    public double getFirst()\n47     {\n48        return first;\n49     }\n50\n\
  51     /**\n52      * 返回对数中的第二个数字\n53      * @return 第二个数字\n54      */\n55     public\
  \ double getSecond()\n56\n     {\n57        return second;\n58     }\n59   }\n60\n\
  61   /**\n62    * 计算数组的最小值和最大值\n63    * @param values 浮点数数组\n64    * @return 一个对数对象，其第一个元素是最小值，第二个元素\n\
  65    * 是最大值\n66    */\n67   public static Pair minmax(double[] values)\n68   {\n\
  69      double min = Double.POSITIVE_INFINITY;\n70      double max = Double.NEGATIVE_INFINITY;\n\
  71      for (double v : values)\n72      {\n73         if (min > v) min = v;\n74\
  \         if (max < v) max = v;\n75      }\n76      return new Pair(min, max);\n\
  77   }\n78 }\n```\n\n### 6.4 服务加载器 (Service Loaders)\n\n有时，你会开发一个具有服务架构的应用程序。有一些平台鼓励这种方法，例如\
  \ OSGi（[`http://osgi.org`](http://osgi.org)），它们被用于开发环境、应用服务器和其他复杂的应用程序。此类平台远远超出了本书的范畴，但\
  \ JDK 也提供了一种简单的加载服务机制，在此处描述。该机制得到了 Java 模块系统的良好支持——请参见第二卷的第 9 章。\n\n通常，在提供服务时，程序希望赋予服务设计者在实现服务功能方面的某些自由度。拥有多个实现方案供选择也是可能理想的。`ServiceLoader`\
  \ 类可以方便地加载符合通用接口的服务。\n\n定义一个接口（或者，如果你愿意，定义一个超类），其中包含每个服务实例都应该提供的方法。例如，假设你的服务提供加密。\n\
  \n点击此处查看代码图片\n\n```java\npackage serviceLoader;\n\npublic interface Cipher\n{\n\
  \   byte[] encrypt(byte[] source, byte[] key);\n   byte[] decrypt(byte[] source,\
  \ byte[] key);\n}\n```\n\n\n\n查找第一个可的服务提供者，如果有。\n\n`java.util.ServiceLoader.Provider<S>`\
  \ **9**\n\n*   `Class<? extends S> type()`\n    获取此提供者的类型。\n\n*   `S get()`\n  \
  \  获取此提供者的实例。\n\n## 6.5 代理（Proxies）\n\n在本章的最后一节中，我们将讨论*代理*。你可以使用代理在运行时创建新的类，这些类实现一组给定的接口。只有当你会在编译时还不知道需要实现哪些接口时，代理才是必要的。对于应用程序开发人员来说，这并不是常见的情况，所以如果你对高阶魔法不感兴趣，可以随意跳过这一节。然而，对于某些系统编程应用程序，代理提供的灵活性非常重要。\n\
  \n### 6.5.1 何时使用代理\n\n假设你想构造一个实现一个或多个接口的类对象，而你可能在编译时不知道这些接口的准确性质。这是一个困难的问题。要构造一个具体的类，你可以简单使用\
  \ `newInstance` 方法或使用反射查找构造函数。但你不能实例化接口。你需要在运行程序中定义一个新类。\n\n为了解决这个问题，某些程序会生成代码，将其放入文件，调用编译器，然后加载生成的类文件。自然地，这种方法很慢，而且还需要将编译器与程序一起部署。*代理*机制是一个更好的解决方案。代理类可以在运行时创建全新的类。此类代理类实现了你指定的接口。特别地，代理类具有以下方法：\n\
  \n*   指定接口要求的所有方法；以及\n*   `Object` 类中定义的所有方法（`toString`、`equals` 等）。\n\n然而，你不能在运行时为这些方法定义新代码。相反，你必须提供一个*调用处理器*（invocation\
  \ handler）。调用处理器是任何实现 `InvocationHandler` 接口的类的对象。该接口只有一个方法：\n\n点击此处查看代码图片\n\n```\n\
  Object invoke(Object proxy, Method method, Object[] args)\n```\n\n每当在代理对象上调用方法时，调用处理器的\
  \ `invoke` 方法就会被调用，并传入原始调用的 `Method` 对象和参数。调用处理器必须想办法如何处理该调用。\n\n### 6.5.2 创建代理对象\n\
  \n要创建代理对象，请使用 `Proxy` 类的 `newProxyInstance` 方法。该方法有三个参数：\n\n*   一个*类加载器*（class loader）。作为\
  \ Java 安全模型的一部分，不同的类加载器可以用于平台和应用程序类、从互联网下载的类等。我们将在第二卷的第 9 章中讨论类加载器。在示例中，我们指定了加载平台和应用程序类的“系统类加载器”。\n\
  *   一个 `Class` 对象数组，每个对象对应一个接口。\n*   一个调用处理器。\n\n还剩下两个问题。我们如何定义处理器？我们能对生成的代理对象做什么？当然，答案取决于我们想要通过代理机制解决的问题。代理可以用于许多目的，例如：\n\
  \n*   将方法调用路由到远程服务器\n*   将用户界面事件与运行程序中的操作关联\n*   为了调试目的跟踪方法调用\n\n在示例程序中，我们使用代理和调用处理器来跟踪方法调用。我们定义了一个\
  \ `TraceHandler` 包装类，它存储了一个被包装的对象。它的 `invoke` 方法只需打印要调用的方法名和参数，然后使用包装的对象作为隐式参数调用该方法。\n\
  \n点击此处查看代码图片\n\n```java\nclass TraceHandler implements InvocationHandler\n{\n  \
  \ private Object target;\n\n   public TraceHandler(Object t)\n   {\n      target\
  \ = t;\n   }\n\n   public Object invoke(Object proxy, Method m, Object[] args)\n\
  \         throws Throwable\n   {\n      //打印方法名和参数\n      . . .\n      // 调用实际方法\n\
  \      return m.invoke(target, args);\n   }\n}\n```\n\n以下是构造一个代理对象的方法，当它的任何方法被调用时，都会触发跟踪行为：\n\
  \n点击此处查看代码图片\n\n```java\nObject value = . . .;\n// 构造包装器\nvar handler = new TraceHandler(value);\n\
  // 为一个或多个接口构造代理\nvar interfaces = new Class[] { Comparable.class};\nObject proxy\
  \ = Proxy.newProxyInstance(\n   ClassLoader.getSystemClassLoader(),\n   new Class[]\
  \ { Comparable.class } , handler);\n```\n\n现在，每当在 `proxy` 上调用其中一个接口的方法时，方法名和参数就会被打印出来，然后在\
  \ `value` 上调用该方法。\n\n在列表 6.10 所示的程序中，我们使用代理对象来跟踪二分查找。我们用整数 `1 . . . 1000` 的代理填充数组。然后我们调用\
  \ `Arrays` 类的 `binarySearch` 方法在数组中搜索随机整数。最后，打印匹配的元素。\n\n点击此处查看代码图片\n\n```java\n\
  var elements = new Object[1000];\n// 填充元素\nfor (int i = 0; i < 1000; i++)\n{\n \
  \  elements[i] = Proxy.newProxyInstance(\n      ClassLoader.getSystemClassLoader(),\n\
  \      new Class[] { Comparable.class },\n      new TraceHandler(new Integer(i)));\n\
  }\n\n// 构造一个随机整数\nInteger key = (int) (Math.random() * elements.length) + 1;\n//\
  \ 搜索 key\nint result = Arrays.binarySearch(elements, key);\n\n// 如果找到，则打印\nif (result\
  \ >= 0) System.out.println(elements[result]);\n```\n\n\n\n\n```java\npackage proxy;\n\
  \nimport java.lang.reflect.*;\nimport java.util.*;\n\n/**\n * 此程序演示了代理的使用。\n * @version\
  \ 1.02 2021-06-16\n * @author Cay Horstmann\n */\npublic class ProxyTest\n{\n  \
  \  public static void main(String[] args)\n    {\n       var elements = new Object[1000];\n\
  \n       // 用整数 1 . . . 1000 的代理填充 elements 数组\n       for (int i = 0; i < elements.length;\
  \ i++)\n       {\n          Integer value = i + 1;\n          var handler = new\
  \ TraceHandler(value);\n          Object proxy = Proxy.newProxyInstance(\n     \
  \        ClassLoader.getSystemClassLoader(),\n             new Class[] { Comparable.class\
  \ }, handler);\n          elements[i] = proxy;\n       }\n\n       // 构建一个随机整数\n\
  \       Integer key = (int) (Math.random() * elements.length) + 1;\n\n       //\
  \ 搜索该键\n       int result = Arrays.binarySearch(elements, key);\n\n       // 如果找到则打印结果\n\
  \       if (result >= 0) System.out.println(elements[result]);\n    }\n}\n\n/**\n\
  \ * 一个调用处理器，它会打印方法名和参数，然后\n * 调用原始方法\n */\nclass TraceHandler implements InvocationHandler\n\
  {\n    private Object target;\n\n    /**\n     * 构建一个 TraceHandler\n     * @param\
  \ t 方法调用的隐式参数\n     */\n    public TraceHandler(Object t)\n    {\n       target\
  \ = t;\n    }\n\n    public Object invoke(Object proxy, Method m, Object[] args)\
  \ throws Throwable\n    {\n       // 打印隐式参数\n       System.out.print(target);\n\
  \       // 打印方法名\n       System.out.print(\".\" + m.getName() + \"(\");\n      \
  \ // 打印显式参数\n       if (args != null)\n       {\n          for (int i = 0; i < args.length;\
  \ i++)\n          {\n             System.out.print(args[i]);\n             if (i\
  \ < args.length - 1) System.out.print(\", \");\n          }\n       }\n       System.out.println(\"\
  )\");\n\n       // 调用实际方法\n       return m.invoke(target, args);\n    }\n}\n```\n\
  \n### 6.5.3 代理类的属性\n\n现在你已经看到了代理类的实际运行情况，让我们回顾一下它们的一些属性。请记住，代理类是在运行程序中动态创建的。然而，一旦创建完成，它们就是普通的类，就像虚拟机中的任何其他类一样。\n\
  \n所有的代理类都扩展了 `Proxy` 类。代理类只有一个实例字段——调用处理器（invocation handler），它定义在 `Proxy` 超类中。执行代理对象任务所需的任何额外数据都必须存储在调用处理器中。例如，当我们对列表\
  \ 6.10 所示程序中的 `Comparable` 对象进行代理时，`TraceHandler` 包装了实际对象。\n\n所有的代理类都重写了 `Object`\
  \ 类的 `toString`、`equals` 和 `hashCode` 方法。与其他代理方法一样，这些方法简单地调用调用处理器上的 `invoke`。`Object`\
  \ 类的其他方法（如 `clone` 和 `getClass`）没有被重定义。\n\n代理类的名称是没有定义的。Oracle 虚拟机中的 `Proxy` 类生成的类名以字符串\
  \ `$Proxy` 开头。\n\n对于特定的类加载器和有序的接口集合，只有一个代理类。也就是说，如果你使用相同的类加载器和接口数组调用两次 `newProxyInstance`\
  \ 方法，你会得到两个相同类的对象。你也可以通过 `getProxyClass` 方法获取该类：\n\n点击此处查看代码\n\n```java\nClass proxyClass\
  \ = Proxy.getProxyClass(null, interfaces);\n```\n\n代理类总是 `public` 且 `final` 的。如果代理类实现的所有接口都是\
  \ `public`，则代理类属于任何特定的包。否则，所有非 `public` 接口必须属于同一个包，且代理类也将属于该包。\n\n你可以通过调用 `Proxy`\
  \ 类的 `isProxyClass` 方法来测试特定的 `Class` 对象是否代表代理类。\n\n![Images](img/note.jpg) 注意\n\n\
  调用代理的默认方法会触发调用处理器。要实际调用方法，请使用 `InvocationHandler` 接口的静态方法 `invokeDefault`。例如，这里有一个调用默认方法并将抽象方法传递给另一个目标的调用处理器：\n\
  \n点击此处查看代码\n\n```java\nInvocationHandler handler = (proxy, method, args) -> {\n\
  \   if (method.isDefault())\n      return InvocationHandler.invokeDefault(proxy,\
  \ method, args);\n   else\n      return method.invoke(target, args);\n};\n```\n\n\
  \n\n\n在测试期间，你需要运行许多检查以确保你的程序运行正常。但在测试完成之后，这些检查可能是非常耗时且没有必要的。你可以直接删除这些检查，并在需要额外测试时再将它们加回来——但这太麻烦了。本章的第二部分将向你展示如何使用断言（assertion）机制来选择性地激活检查。\n\
  \n当你的程序运行错误时，你并不总是能够与用户通信或终止程序。相反，你可能希望记录问题以备日后分析。本章的第三部分将讨论标准的 Java 日志框架。\n\n##\
  \ 7.1 处理错误\n\n假设一个 Java 程序在运行时发生了错误。该错误可能是由包含错误信息的文件、不稳定的网络连接，或者（我不想提它）使用无效的数组索引或尚未赋值给对象的引用引起的。用户期望程序在发生错误时能表现得理智。如果某个操作由于错误而无法完成，程序应该：\n\
  \n* 回到安全状态并允许用户执行其他命令；或者\n* 允许用户保存所有工作并优雅地退出程序。\n\n这可能并不容易，因为检测（甚至引起）错误条件的代码，通常与可以将数据回滚到安全状态或保存用户工作并愉快退出的代码相去远。异常处理的任务是将控制权从错误发生的地方转移到可以处理该情况的错误处理器。为了处理你程序中的异常情况，你必须考虑到可能发生的错误和问题。你需要考虑哪些类型的问题？\n\
  \n* **用户输入错误。** 除了不可避免的拼写错误外，有些用户喜欢自辟蹊径而不是不遵循指示。例如，假设用户请求连接到一个语法错误的 URL。你的代码应该检查语法，但假设它没有检查到。那么网络层就会报错。\n\
  * **设备错误。** 硬件并不总是按照你所意愿的方式运行。打印机可能被关闭了。某个网页可能暂时不可用。设备经常会在任务中途失败。例如，打印机可能在打印过程中用完纸张。\n\
  * **物理限制。** 磁盘可能会满；你可能会耗尽可用内存。\n* **代码错误。** 方法可能可能执行不正确。例如，它可能会提供错误的答案或错误地使用其他方法。计算无效的数组索引、尝试在哈希表中查找不存在的条目或尝试从空栈中弹出元素都是代码错误的示例。\n\
  \n对方法中错误的传统反应是返回一个特殊的错误代码，由调用该的方法进行分析。例如，从文件读取信息的方法通常返回一个 `-1` 文件结束值标记，而不是标准字符。这可能是处理许多异常条件的一种有效方法。另一个用于表示错误条件的常见返回值是\
  \ `null` 引用。\n\n遗憾的是，并不总是可以返回错误代码。可能没有明显的方法来区分有效数据和无效数据。一个返回整数的方法不能简单地返回 `-1` 来表示错误；值\
  \ `-1` 可能是一个完全有效的结果。\n\n相反，正如我在第 5 章中提到的，如果方法无法以正常方式完成其任务，Java 允许每个方法拥有一个备选的退出路径。在这种情况下，方法不返回值。相反，它*抛出*（throws）一个封装了错误信息的对象。注意，方法会立即退出；它不会返回其正常（或任何）值。此外，执行不会在调用方法的代码处继续；相反，异常处理机制开始寻找可以处理此特定错误条件的*异常处理器*（exception\
  \ handler）。\n\n异常有自己的语法，并且是特殊继承层次结构的一部分。我将首先介绍语法，然后提供一些如何有效使用这一语言特性的提示。\n\n### 7.1.1\
  \ 异常的分类\n\n在 Java 编程语言中，异常对象总是派自 `Throwable` 类的实例。正如你很快看到的，如果 Java 内置的类不符合你的需求，你可以创建自己的异常类。\n\
  \n图 7.1 是 Java 异常层次结构的简化示意图。\n\n![Images](img/07fig01.jpg)\n\n**图 7.1** Java 中的异常层次结构\n\
  \n注意，所有异常都继承自 `Throwable`，但层次结构立即分为两个分支：`Error` 和 `Exception`。\n\n`Error` 层次结构描述了\
  \ Java 运行时系统内部的错误和资源耗尽的情况。你不应该抛这种类型的对象。如果发生了此类内部错误，除了通知用户并尝试优雅地退出程序外，你无能为。这些情况非常罕见。\n\
  \n在进行 Java 编程时，请关注 `Exception` 层次结构。`Exception` 层次结构也分为两个分支：派自 `RuntimeException`\
  \ 的异常和派派它的异常。通用规则是：`RuntimeException` 的发生是因为你犯了编程错误。任何其他异常的发生是因为某些坏事（如 I/O 错误）发生在你原本运行良好的程序上。\n\
  \n继承自 `RuntimeException` 的异常包括此类问题：\n\n* 强制转换错误\n* 越界数组访问\n* 空指针访问\n\n不继承自 `RuntimeException`\
  \ 的异常包括\n\n* 尝试读取文件末尾之后的内容\n* 尝试打开不存在的文件\n* 尝试为一个不表示现有类的字符串查找 `Class` 对象\n\n“如果它是\
  \ `RuntimeException`，那就是你的错”这个规则相当有效。你可以通过测试数组索引相对于边界来避免那个 `ArrayIndexOutOfBoundsException`。如果你在使用变量之前检查了它是否为\
  \ `null`，`NullPointerException` 就不会发生。\n\n不存在的文件怎么办？你不能先检查文件是否存在，然后打开它吗？嗯，文件可能在你检查其存在之后就被删除了。因此，“存在”的概念取决于环境，而不仅仅取决于代码。\n\
  \nJava 语言规范将任何派自 `Error` 类或 `RuntimeException` 异常称为*未检查异常*（unchecked exception）。所有其他异常都称为*检查异常*（checked\
  \ exception）。编译器会检查你是否为所有检查异常提供了异常处理器。这是一个非常有用的术语，我在书中也采用了。\n\n![Images](img/note.jpg)\
  \ 注意\n\n`RuntimeException` 这个名字有点让人困惑。当然，我们讨论的所有错误都是运行时发生的。这个名字起源于史前时代，当时 Java 的前身\
  \ Oak 的“运行时”产生越界异常和空指针异常。可能 I/O 异常是由其他组件产生的。\n\n![Images](img/cnote.jpg) C++ 注意\n\
  \n如果你熟悉标准 C++ 库的（要局得多的）异常层次结构，你现在可能会感到非常困惑。C++ 有两个基础异常类：`runtime_error` 和 `logic_error`。`logic_error`\
  \ 类等同于 Java 的 `RuntimeException`，也表示程序中的逻辑错误。`runtime_error` 类是由不可预测问题引起的异常的基类。它等同于\
  \ Java 中那些不是 `RuntimeException` 类型的异常。\n\n### 7.1.2 声明检查异常\n\n\n\n\n\nJava 方法在遇到它无法处理的情况时，可以抛出异常。这个想法非常简单：方法不仅会告诉\
  \ Java 编译器它可以返回什么值，还会告诉编译器可能会发生什么错误。\n\n例如，尝试从文件中读取的代码知道文件可能不存在，或者可能为空。因此，尝试处理文件中信息的代码需要通知编译器，它可能会抛出某种\
  \ `IOException`。\n\n你声明你的方法可以抛出异常的地方是方法的头部（header）；该头部会随之变化，以反映该方法可能抛出的受检异常（checked\
  \ exceptions）。例如，这里是标准库中 `FileInputStream` 类的一个构造函数的声明。（有关输入和输出的更多信息，请参阅第卷二的第 1\
  \ 章。）\n\n点击此处查看代码图像\n\n```\npublic FileInputStream(String name) throws FileNotFoundException\n\
  ```\n\n该声明表示此构造函数根据 `String` 参数产生一个 `FileInputStream` 对象，但它也可能以一种特殊的方式出错——即抛出一个\
  \ `FileNotFoundException`。如果发生了这种不幸的情况，构造函数的调用将不会初始化一个新的 `FileInputStream` 对象，而是抛出一个\
  \ `FileNotFoundException` 类的对象。如果是这样，运行时系统将开始寻找知道如何处理 `FileNotFoundException` 对象的异常处理器。\n\
  \n当你编写自己的方法时，不需要声明你的方法实际上可能抛出的每一个可能的待抛出（throwable）对象。要理解何时（以及什么）你需要在你写的方法的 `throws`\
  \ 子句中声明内容，请记住在以下四种情况之一会抛出异常：\n\n*   你调用了一个抛出受检异常的方法——例如，`FileInputStream` 构造函数。\n\
  *   你检测到一个错误并使用 `throw` 语句抛出一个受检异常（`throw` 语句将在下一节中介绍）。\n*   你犯了编程错误，例如 `a[-1] =\
  \ 0` 导致了非受检异常（unchecked exception，在这种情况下是 `ArrayIndexOutOfBoundsException`）。\n*\
  \   虚拟机或运行时库中发生了内部错误。\n\n如果发生了前两种情况的任何一种，你必须告诉使用你方法的程序员关于异常的可能。为什么呢？任何抛出异常的方法都是一个潜在的死亡陷阱。如果没有处理器捕获该异常，当前执行线程将终止。\n\
  \n与属于提供的类中的 Java 方法一样，你通过方法头部的*异常规格*（exception specification）声明你的方法可能抛出异常。\n\n点击此处查看代码图像\n\
  \n```\nclass MyAnimation\n{\n   . . .\n   public Image loadImage(String s) throws\
  \ FileNotFoundException, EOFException\n   {\n      . . .\n   }\n}\n```\n\n如果一个方法可能抛出多种一种受检异常类型，你必须在头部列出所有异常类。用逗号将它们分隔，如下例：\n\
  \n点击此处查看代码图像\n\n```\nclass MyAnimation\n{\n   . . .\n   public Image loadImage(String\
  \ s) throws FileNotFoundException, EOFException\n   {\n      . . .\n   }\n}\n```\n\
  \n然而，你不需要声明 Java 内部错误——即继承自 `Error` 的异常。任何代码都可能抛出这些异常，而且它们完全超出你的控制范围。\n\n同样，你不应该声明继承自\
  \ `RuntimeException` 的非受检异常。\n\n点击此处查看代码图像\n\n```\nclass MyAnimation\n{\n   . .\
  \ .\n   void drawImage(int i) throws ArrayIndexOutOfBoundsException // 坏风格\n   {\n\
  \      . . .\n   }\n}\n```\n\n这些运行时错误完全在你的控制之下。如果你如此担心数组索引错误，你应该花时间修复它们，而不是声明它们可能发生的可能性。\n\
  \n总结，方法必须声明它可能抛出的所有*受检*（checked）异常。非受检异常要么超出你的控制（`Error`），要么是由于你本不应该允许的情况导致的（`RuntimeException`）。如果你的方法未能忠实地声明所有受检异常，编译器将发出错误信息。\n\
  \n当然，正如你已经在许多示例中看到的那样，与其声明异常，你也可以捕获它。那么这样异常就不会被抛出方法，也不需要 `throws` 规格。你将在本章的后半部分看到如何决定是捕获异常还是让别人捕获它。\n\
  \n![图像](img/caution.jpg) 注意\n\n如果你重写了父类中的方法，子类方法声明的受检异常不能比父类方法的声明更通用。（在子类方法中抛出更具体的异常或不抛出任何异常都是可以的。）特别是，如果父类方法完全没有抛出任何受检异常，子类也不能抛出。例如，如果你重写了\
  \ `JComponent.paintComponent`，你的 `paintComponent` 方法不能抛出任何受检异常，因为父类方法没有抛出任何。\n\n\
  当类中的方法声明它抛出一个是特定类实例的异常时，它可能会抛出该类的异常或其任何子类的异常。例如，`FileInputStream` 构造函数可以声明它抛出一个\
  \ `IOException`。在这种情况下，你将不知道它是哪种 `IOException`；它可能是普通的 `IOException` 或其子类之一。\n\n\
  ![图像](img/cnote.jpg) 注意\n\n`throws` 规格与 C++ 的 `throw` 规格相同，有一个重要的区别。在 C++ 中，`throw`\
  \ 规格是在运行时强制的，而不是在编译时。也就是说，C++ 编译器不检查异常规格。但是如果在不在 `throw` 列表中函数抛出了异常，将调用 `unexpected`\
  \ 函数，默认情况下程序将终止。\n\n同样，在 Java 中，没有 `throws` 规格的方法可能不会抛出任何受检异常。\n\n现在，假设你的代码发生了某些糟糕的事情。你有一个方法\
  \ `readData` 正在读取一个头部承诺\n\n```\nContent-length: 1024\n```\n\n但你在 733 个字符后遇到了文件结束。你可能认为这种情况非常异常，想要抛出一个异常。\n\
  \n你需要决定抛出什么类型的异常。某种 `IOException` 会是一个不错的选择。浏览 Java API 文档，你发现了一个 `EOFException`，描述为“在输入过程中到达文件结束”。完美。这就是你抛出它的方式：\n\
  \n```\nthrow new EOFException();\n```\n\n或者，如果你愿意：\n\n```\nvar e = new EOFException();\n\
  throw e;\n```\n\n这是这一切是如何结合的：\n\n点击此处查看代码图像\n\n```\nString readData(Scanner in)\
  \ throws EOFException\n{\n   . . .\n   while (...)\n   {\n      if (!in.hasNext())\
  \ // 遇到 EOF\n      {\n         if (n < len)\n            throw new EOFException();\n\
  \      }\n      . . .\n   }\n   return s;\n}\n```\n\n`EOFException` 还有一个第二个接收字符串参数的构造函数。你可以利用它来更仔细地描述异常情况。\n\
  \n点击此处查看代码图像\n\n```\nString gripe = \"Content-length: \" + len + \", Received: \"\
  \ + n;\nthrow new EOFException(gripe);\n```\n\n正如你所见，如果现有的异常类适用于你，抛出异常是非常简单的。在这种情况下：\n\
  \n1.  找到一个合适的异常类。\n2.  创建一个该类的对象。\n\n\n\n\n\n# 3. 抛出异常。\n\n一旦方法抛出异常，它就不会再返回给调用者。这意味着你不需要担心去构造一个默认返回值或错误代码。\n\
  \n![Images](img/cnote.jpg) C++ 笔记\n\n在 C++ 和 Java 中，抛出异常是相同的，但有一个小区别。在 Java 中，你只能抛出\
  \ `Throwable` 的子类的对象。而在 C++ 中，你可以抛出任何类型的值。\n\n### 7.1.4 创建异常类\n\n你的代码可能会遇到任何标准异常类都无法充分描述的问题。在这种情况下，创建自己的异常类是非常容易的。只需要继承自\
  \ `Exception`，或者继承自 `Exception` 的子类（如 `IOException`）。按照惯例，应该提供一个默认构造函数和一个包含详细信息的构造函数。（`Throwable`\
  \ 超类的 `toString` 方法会返回一个包含该详尽信息的字符串，这对于调试非常有帮助。）\n\n点击此此处查看代码图片\n\n```\nclass FileFormatException\
  \ extends IOException\n{\n   public FileFormatException() {}\n   public FileFormatException(String\
  \ gripe)\n   {\n      super(gripe);\n   }\n}\n```\n\n现在你已经准备好抛出你自己的异常类型了。\n\n点击此此处查看代码图片\n\
  \n```\nString readData(Scanner in) throws FileFormatException\n{\n   . . .\n   while\
  \ (. . .)\n   {\n      if (ch == -1) // 遇到 EOF\n      {\n         if (n < len)\n\
  \            throw new FileFormatException();\n      }\n      . . .\n   }\n   return\
  \ s;\n}\n```\n\n`java.lang.Throwable` 1.0\n\n*   `Throwable()`\n    构造一个新的没有详细信息的\
  \ `Throwable` 对象。\n\n*   `Throwable(String message)`\n    构造一个新的带有指定详尽信息的 `Throwable`\
  \ 对象。按照惯例，所有派生的异常类都支持默认构造函数和带有详细信息的构造函数。\n\n*   `String getMessage()`\n    获取 `Throwable`\
  \ 对象的详细信息。\n\n## 7.2 捕获异常\n\n你现在已经知道如何抛出异常。这非常简单：你抛出它，然后忘记它。当然，有些代码必须捕获异常。捕获异常需要更多的规划。接下来的章节将介绍这些。\n\
  \n### 7.2.1 捕获异常\n\n如果发生的异常未在任何地方捕获，程序将终止并在控制台上打印消息，给出异常的类型和堆栈跟踪。然而，GUI 程序可以捕获异常、打印堆栈跟踪消息，然后返回用户界面处理循环。（在调试\
  \ GUI 程序时，最好保持控制台显示在屏幕上而不是最小化。）\n\n要捕获异常，请设置一个 `try/catch` 块。`try` 块的最简单形式如下：\n\n\
  ```\ntry\n{\n   代码\n   更多代码\n   更多代码\n}\ncatch (ExceptionType e)\n{\n   该类型的处理程序\n\
  }\n```\n\n如果 `try` 块内部的任何代码抛出了 `catch` 子句中指定的类的异常，那么：\n\n1. 程序将跳过 `try` 块中剩余的代码。\n\
  2. 程序将执行 `catch` 子句内部的处理器代码。\n\n如果 `try` 块内部没有代码抛出异常，则程序将跳过 `catch` 子句。\n\n如果方法中的任何代码抛出了与\
  \ `catch` 子句中指定的类型不同的异常，则该方法将立即退出。（希望它的调用者之一已经为该类型提供了一个 `catch` 子句。）\n\n为了展示这一工作，这里有一段读取数据的相当典型的代码：\n\
  \n点击此此处查看代码图片\n\n```\npublic void read(String filename)\n{\n   try\n   {\n     \
  \ var in = new FileInputStream(filename);\n      int b;\n      while ((b = in.read())\
  \ != -1)\n      {\n         处理输入\n      }\n   }\n   catch (IOException exception)\n\
  \   {\n      exception.printStackTrace();\n   }\n}\n```\n\n注意，`try` 子句中的大部分代码都是直观的：它读取并处理字节，直到遇到文件末尾。正如通过查看\
  \ Java API 所示，`read` 方法可能会抛出 `IOException`。在这种情况下，我们跳出整个 `while` 循环，进入 `catch` 子句并生成堆栈跟踪。对于一个演示程序来说，这似乎是处理此异常的一种合理方法。你还有其他选择吗？\n\
  \n通常，最好的选择是什么都不做，直接将异常传递给调用者。如果 `read` 方法中发生错误，让 `read` 方法的调用者去担心吧！如果我们采取那种方法，就必须声明该方法可能会抛出\
  \ `IOException`。\n\n点击此此处查看代码图片\n\n```\npublic void read(String filename) throws\
  \ IOException\n{\n   var in = new FileInputStream(filename);\n   int b;\n   while\
  \ ((b = in.read()) != -1)\n   {\n      处理输入\n   }\n}\n```\n\n### 7.2.2 捕获多个异常\n\n\
  你可以在 `try` 块中捕获多种异常类型，并不同地处理每个类型。为每个类型使用单独的 `catch` 子句，如下例所示：\n\n点击此此处查看代码图片\n\n\
  ```\ntry\n{\n   可能抛出异常的代码\n}\ncatch (FileNotFoundException e)\n{\n   针对缺失文件的处理措施\n\
  }\ncatch (UnknownHostException e)\n{\n   针对未知主机的处理措施\n}\ncatch (IOException e)\n\
  {\n   针对所有其他 I/O 问题的处理措施\n}\n```\n\n异常对象可能包含有关异常性质的信息。要了解更多关于对象的信息，可以尝试\n\n```\n\
  e.getMessage()\n```\n\n获取详细错误消息（如果有），或者\n\n```\ne.getClass().getName()\n```\n\n\
  获取异常对象的实际类型。\n\n从 Java 7 开始，你可以在同一个 `catch` 子句中捕获多种异常类型。例如，假设处理缺失文件和未知主机的方法是相同的。那么你可以合并\
  \ `catch` 子句：\n\n点击此此处查看代码图片\n\n```\ntry\n{\n   可能抛出异常的代码\n}\ncatch (FileNotFoundException\
  \ | UnknownHostException e)\n{\n   针对缺失文件和未知主机的处理措施\n}\ncatch (IOException e)\n\
  {\n   针对所有其他 I/O 问题的处理措施\n}\n```\n\n此功能仅在捕获互不为子类的异常类型时才需要。\n\n\n\n\n当你捕获多个异常时，异常变量是隐式的\
  \ `final`。例如，你不能在 `catch` 句体中为 `e` 分配不同的值。\n\n点击此处查看代码图像\n\n```java\ncatch (FileNotFoundException\
  \ | UnknownHostException e) { . . . }\n```\n\n![Images](img/note.jpg) 注意\n\n捕获多个异常不仅让你的代码看起来更简单，而且更高效。生成的字节码包含一个用于共享\
  \ `catch` 句的单个块。\n\n### 7.2.3 重新抛出和链式异常\n\n你可以在 `catch` 句中抛出异常。通常，当你想要更改异常类型时会这样做。如果你正在构建一个供其他程序员使用的子系统，那么使用一个指示子系统失败的异常类型是有意义的。这种异常类型的示例是\
  \ `ServletException`。执行 servlet 的代码可能不想知道出错的细微细节，但它确实想知道是 servlet 出了问题。\n\n以下是你可以如何捕获异常并重新抛出它的方法：\n\
  \n点击此处查看代码图像\n\n```java\ntry\n{\n   access the database\n}\ncatch (SQLException\
  \ e)\n{\n   throw new ServletException(\"database error: \" + e.getMessage());\n\
  }\n```\n\n在这里，`ServletException` 是使用异常的器文本构造的。\n\n然而，更好的做法是将原始异常设置为新异常的“原因”（cause）：\n\
  \n点击此处查看代码图像\n\n```java\ntry\n{\n   access the database\n}\ncatch (SQLException\
  \ original)\n{\n   var e = new ServletException(\"database error\");\n   e.initCause(original);\n\
  \   throw e;\n}\n```\n\n当异常被捕获时，可以检索到原始异常：\n\n点击此处查看代码图像\n\n```java\nThrowable original\
  \ = caughtException.getCause();\n```\n\n这种包装技术是高度推荐的。它允许你在子系统中抛出高层级异常，而不会丢失原始失败的细节。\n\
  \n![Images](img/tip.jpg) 提示\n\n如果在一个不允许抛出检查异常（checked exception）的方法中发生了检查异常，包装技术也有用。你可以捕获检查异常并将其封装为运行时异常。\n\
  \n有时，你只想记录异常并重新抛出它，而不做任何更改：\n\n点击此处查看代码图像\n\n```java\ntry\n{\n   access the database\n\
  }\ncatch (Exception e)\n{\n   logger.log(level, message, e);\n   throw e;\n}\n```\n\
  \n在 Java 7 之前，这种方法存在问题。假设代码在一个方法内部：\n\n点击此处查看代码图像\n\n```java\npublic void updateRecord()\
  \ throws SQLException\n```\n\nJava 编译器查看 `catch` 块内部的 `throw` 语句，然后查看 `e` 的类型，并抱怨该方法可能会抛出任何\
  \ `Exception`，而不仅仅 `SQLException`。这现在得到了改进。编译器现在会跟踪 `e` 源自 `try` 块的事实。只要该块中唯一的检查异常是\
  \ `SQLException` 实例，并且 `e` 在 `catch` 块中没有被更改，将外层方法声明为 `throws SQLException` 就是有效的。\n\
  \n### 7.2.4 `finally` 句\n\n当你的代码抛出异常时，它会停止处理方法中的剩余代码并退出方法。如果该方法获取了某些只有该方法才知道本地资源，且该资源必须被清理，就会就会问题。一种解决方案是捕获所有异常，执行清理并重新抛出异常。但这种解决方案是繁琐的，因为你需要在两个地方清理资源分配——普通代码中和异常代码中。`finally`\
  \ 句可以解决这个问题。\n\n![Images](img/note.jpg) 注意\n\n从 Java 7 开始，有一个更优雅的解决方案，即 `try`-with-resources`\
  \ 语句，你将在下一节中看到。我们详细讨论 `finally` 机制是因为它是概念性的基础。但在实践中，你使用 `try`-with-resources` 语句的频率可能高于\
  \ `finally` 句。\n\n`finally` 句中的代码无论是否捕获到异常都会执行。在下面的示例中，程序将在*任何情况下*都会关闭输入流：\n\n点击此处查看代码图像\n\
  \n```java\nvar in = new FileInputStream(. . .);\ntry\n{\n   // 1\n   code that might\
  \ throw exceptions\n   // 2\n}\ncatch (IOException e)\n{\n   // 3\n   show error\
  \ message\n   // 4\n}\nfinally\n{\n   // 5\n   in.close();\n}\n// 6\n```\n\n让我们来看程序将执行\
  \ `finally` 句的三种可能情况。\n\n1. 代码没有抛出任何异常。在这种情况下，程序首先执行 `try` 块中的所有代码。然后，执行 `finally`\
  \ 句中的代码。之后，从 `finally` 句后的第一个语句继续执行。换句话说，执行通过了点 1。\n\n2. 代码抛出了在 `catch` 句中捕获的异常——在本例中为\
  \ `IOException`。在这种情况下，程序执行 `try` 块直到抛出异常。`try` 块的剩余代码被跳过。然后程序执行 `catch` 句。如果 `catch`\
  \ 句没有抛出异常，则会执行 `finally` 句。在这种情况下，执行通过了点 1、2、3、4、5。\n\n3. 代码抛出了未在任何 `catch` 句中捕获的异常。在这种情况下，程序执行\
  \ `try` 块直到抛出异常。`try` 块的剩余代码被跳过。然后执行 `finally` 句，并将异常抛回给方法的调用者。执行通过了点 1 和 5。\n\n\
  你可以在没有 `catch` 句的情况下使用 `finally` 句。例如，考虑以下 `try` 语句：\n\n点击此处查看代码图像\n\n```java\n\
  var in = new FileInputStream(. . .);\ntry\n{\n   code that might throw exceptions\n\
  }\nfinally\n{\n   in.close();\n}\n```\n\n无论 `try` 块是否遇到异常，`finally` 句中的 `in.close()`\
  \ 语句都会执行。当然，如果遇到异常，它会被重新抛出并在另一个 `catch` 句中捕获。\n\n点击此处查看代码图像\n\n```java\nvar in =\
  \ new FileInputStream(. . .);\ntry\n{\n   try\n   {\n      code that might throw\
  \ exceptions\n   }\n   finally\n   {\n      in.close();\n   }\n}\ncatch (IOException\
  \ e)\n{\n   show error message\n}\n```\n\n内部 `try` 块的作用是确保输入流被关闭。外部 `try` 块的作用是确保错误被报告。这种解决方案不仅看起来更清晰，而且更有功能：`finally`\
  \ 句中的错误会被报告。\n\n![Images](img/caution.jpg) 警告\n\n当 `finally` 句包含 `return` 语句时，可能会产生意外的结果。假设你通过\
  \ `return` 语句退出 `try` 块。在方法返回之前，会执行 `finally` 句。如果 `finally` 句也包含 `return` 语句，那么它将掩盖原始的返回值。考虑这个例子：\n\
  \n点击此处查看代码图像\n\n```java\npublic static int parseInt(String s)\n{\n   try\n   {\n\
  \      return Integer.parseInt(s);\n   }\n   finally\n   {\n      return 0; // ERROR\n\
  \   }\n}\n```\n\n\n\n\n看起来在调用 `parseInt(\"42\")` 时，`try` 块体返回了整数 `42`。然而，`finally`\
  \ 子句在方法实际返回之前被执行，导致方法返回了 `0`，忽略了原始的返回值。\n\n情况更糟的是。考虑调用 `parseInt(\"zero\")`。`Integer.parseInt`\
  \ 方法抛出了 `NumberFormatException`。然后执行了 `finally` 子句，而 `return` 语句吞掉了该异常！\n\n`finally`\
  \ 块体用于清理资源。不要在 `finally` 子句中放置改变控制流的语句（`return`、`throw`、`break`、`continue`）。\n\n\
  ### 7.2.5 `try`-with-Resources 语句\n\n从 Java 7 开始，对于这种代码模式有一个实用的快捷方式：\n\n```\nopen\
  \ a resource\ntry\n{\n   work with the resource\n}\nfinally\n{\n   close the resource\n\
  }\n```\n\n前提是该资源属于实现 `AutoCloseable` 接口的类。该接口有一个方法\n\n```\nvoid close() throws Exception\n\
  ```\n\n![Images](img/note.jpg) Note\n\n还有一个 `Closeable` 接口。它是 `AutoCloseable` 的子接口，同样带有一个\
  \ `close` 方法。然而，该方法被声明为抛出 `IOException`。\n\n在最简单的变中，`try`-with-resources 语句的形式如下：\n\
  \n```\ntry (Resource res = . . .)\n{\n   work with res\n}\n```\n\n当 `try` 块退出时，会自动调用\
  \ `res.close()`。这里是一个典型的示例——读取文件中所有的单词：\n\n点击此处查看代码图片\n\n```\ntry (var in = new\
  \ Scanner(Path.of(\"in.txt\"), StandardCharsets.UTF_8))\n{\n   while (in.hasNext())\n\
  \      System.out.println(in.next());\n}\n```\n\n当块正常退出或发生异常时，都会调用 `in.close()`\
  \ 方法，正好比你使用了 `finally` 块一样。\n\n你可以指定多个资源。例如：\n\n点击此处查看代码图片\n\n```\ntry (var in =\
  \ new Scanner(Path.of(\"in.txt\"), StandardCharsets.UTF_8);\n      var out = new\
  \ PrintWriter(\"out.txt\", StandardCharsets.UTF_8))\n{\n   while (in.hasNext())\n\
  \      out.println(in.next().toUpperCase());\n}\n```\n\n无论块如何退出，`in` 和 `out` 被关闭。如果你手动编写这些代码，你需要两个嵌套的\
  \ `try`/`finally` 语句。\n\n从 Java 9 开始，你可以在 `try` 头部中提供之前声明的有效 final 变量：\n\n点击此处查看代码图片\n\
  \n```\npublic static void printAll(String[] lines, PrintWriter out)\n{\n   try (out)\n\
  \   { // effectively final variable\n      for (String line : lines)\n         out.println(line);\n\
  \   } // out.close() 在此处调用\n}\n```\n\n当 `try` 块抛出异常且 `close` 方法也抛出异常时，就会出现困难。`try`-with-resources\
  \ 语句非常优雅地处理了这种情况。原始异常会被重新抛出，而由 `close` 方法抛出的任何异常都被视为“被抑制的”（suppressed）。它们会被自动捕获并通过\
  \ `addSuppressed` 方法添加到原始异常中。如果你对这些异常感兴趣，可以调用 `getSuppressed` 方法，它会返回一个来自 `close`\
  \ 方法的抑制表达式数组。\n\n你不想手动编写这些代码。每你需要关闭资源时，请使用 `try`-with-resources 语句。\n\n![Images](img/note.jpg)\
  \ Note\n\n`try`-with-resources 语句本身可以拥有 `catch` 子句甚至 `finally` 子句。这些子句会在关闭资源后执行。\n\
  \n### 7.2.6 分析堆栈跟踪元素\n\n*堆栈跟踪*（stack trace）是程序执行过程中特定一点所有待处理方法调用的列表。你几乎肯定见过堆栈跟踪列表——每当\
  \ Java 程序因未捕获的异常终止时，就会显示堆栈跟踪。\n\n你可以通过调用 `Throwable` 类的 `printStackTrace` 方法来获取堆栈跟踪的文本描述。\n\
  \n点击此处查看代码图片\n\n```\nvar t = new Throwable();\n```\n\n更灵活的方法是 `StackWalker` 类，它产生一个\
  \ `StackFrame` 实例流，每个实例描述一个帧。你可以通过以下方式迭代这些帧：\n\n点击此处查看代码图片\n\n```\nvar walker =\
  \ StackWalker.getInstance();\nwalker.forEach(System.out::println);\n```\n\n如果你想惰性地处理\
  \ `Stream<StackFrame>`，请调用：\n\n点击此处查看代码图片\n\n```\nwalker.walk(frame -> process)\n\
  ```\n\n处理过程将在第二章详细描述。在 Java 9 之前，`Throwable.printStackTrace` 方法产生一个 `StackTraceElement[]`\
  \ 数组，包含与 `StackWalker` 流类似的信息。然而，它的效率较低，因为即使调用者可能只需要几个帧，它也会捕获整个堆栈。\n\n![Images](img/note.jpg)\
  \ Note\n\n`toString` 方法提供了执行行的文件名和行号，以及类名和方法名。`toString` 方法产生一个包含所有这些信息的格式化字符串。\n\
  \n\n\n\n\n获取此对象构造时的调用堆栈轨迹。\n\n*   `void addSuppressed(Throwable t)` **7** 向此异常添加一个“被抑制”（suppressed）的异常。这发生在\
  \ `try`-with-resources 语句中，其中 `t` 是由 `close` 方法抛出的异常。\n*   `Throwable[] getSuppressed()`\
  \ **7** 获取此异常的所有“被抑制”异常。通常，这些异常是由于 `try`-with-resources 语句中的 `close` 方法抛出的异常。\n\n\
  ## `java.lang.Exception` **1.0**\n\n*   `Exception(Throwable cause)` **1.4**\n*\
  \   `Exception(String message, Throwable cause)`\n    根据给定的原因构造一个 `Exception`。\n\
  \n## `java.lang.RuntimeException` **1.0**\n\n*   `RuntimeException(Throwable cause)`\
  \ **1.4**\n*   `RuntimeException(String message, Throwable cause)` **1.4**\n   \
  \ 根据给定的原因构造一个 `RuntimeException`。\n\n## `java.lang.StackWalker` **9**\n\n*   `static\
  \ StackWalker getInstance()`\n*   `static StackWalker getInstance(StackWalker.Option\
  \ option)`\n*   `static StackWalker getInstance(Set<StackWalker.Option> options)`\n\
  \    获取一个 `StackWalker` 实例。选项包括来自 `StackWalker.Option` 枚举的 `RETAIN_CLASS_REFERENCE`、`SHOW_HIDDEN_FRAMES`\
  \ 和 `SHOW_REFLECT_FRAMES`。\n*   `forEach(Consumer<? super StackWalker.StackFrame>\
  \ action)`\n    对每个堆栈帧执行给定的操作，从最近调的方法开始。\n*   `walk(Function<? super Stream<StackWalker.StackFrame>,?\
  \ extends T> function)`\n    将给定的函数应用于堆栈帧流并返回函数的结果。\n\n## `java.lang.StackWalker.StackFrame`\
  \ **9**\n\n*   `String getFileName()`\n    获取包含该元素执行点的源文件名称，如果信息不可用则返回 `null`。\n\
  *   `int getLineNumber()`\n    获取包含该元素执行点的源文件行号，如果信息不可用则返回 `-1`。\n*   `String getClassName()`\n\
  \    获取包含该元素执行点的类的全限定名。\n*   `String getDeclaringClass()`\n    获取包含该元素执行点的方法的 `Class`\
  \ 对象。如果构造栈 walker 时没有使用 `RETAIN_CLASS_REFERENCE` 选项，则抛出异常。\n*   `String getMethodName()`\n\
  \    获取包含该元素执行点的方法的名称。构造函数的名称为 `<init>`。静态初始化器的名称为 `<clinit>`。你无法区分具有相同名的重载方法。\n\
  *   `boolean isNativeMethod()`\n    如果该元素的执行点在原生方法内部，则返回 `true`。\n*   `String toString()`\n\
  \    返回一个格式化的字符串，包含类名、方法名以及文件名和行号（如果可用）。\n\n## `java.lang.StackTraceElement` **1.4**\n\
  \n*   `String getFileName()`\n    获取包含该元素执行点的源文件名称，如果信息不可用则返回 `null`。\n*   `int\
  \ getLineNumber()`\n    获取包含该元素执行点的源文件行号，如果信息不可用则返回 `-1`。\n*   `String getClassName()`\n\
  \    获取包含该元素执行点的类的全限定名。\n*   `String getMethodName()`\n    获取包含该元素执行点的方法的名称。构造函数的名称为\
  \ `<init>`。静态初始化器的名称为 `<clinit>`。你无法区分具有相同名的重载方法。\n*   `boolean isNativeMethod()`\n\
  \    如果该元素的执行点在原生方法内部，则返回 `true`。\n*   `String toString()`\n    返回一个格式化的字符串，包含类名、方法名以及文件名和行号（如果可用）。\n\
  \n## 7.3 异常使用的技巧\n\n关于异常的正确用法存在相当的争议。一些程序员认为所有检查异常（checked exceptions）都是麻烦，而另一些人似乎认为抛得还不够。我认为异常（即使是检查异常）也有其用之地，因此我提供了这些关于正确使用它们的技巧。\n\
  \n1. **异常处理不应该取代简单的测试。**\n   作为此示例，下面的代码尝试 10,000,000 次从空栈中弹出元素。它首先通过检查堆栈是否为空来实现。\n\
  \n   ```\n   if (!s.empty()) s.pop();\n   ```\n\n   接下来，我们强制无论如何都弹出栈，并捕获 `EmptyStackException`，该异常告诉我们不应该那样做。\n\
  \n   ```\n   try\n   {\n      s.pop();\n   }\n   catch (EmptyStackException e)\n\
  \   {\n   }\n   ```\n\n   在我的测试机器上，调用 `isEmpty`的版本运行了 646 毫秒。捕获 `EmptyStackException`的版本运行了\
  \ 21,739 毫秒。\n   如你所见，捕获异常比执行简单的测试耗时得多。教训是：仅对异常情况使用异常。\n\n2. **不要对异常进行微观管理。**\n\
  \   一些程序员将每个语句封装在单独 `try` 块中。\n\n   点击此处查看图像\n   ```\n   PrintStream out;\n   Stack\
  \ s;\n\n   for (i = 0; i < 100; i++)\n   {\n      try\n      {\n         n = s.pop();\n\
  \      }\n      catch (EmptyStackException e)\n      {\n         // 堆栈为空\n     \
  \ }\n      try\n      {\n         out.writeInt(n);\n      }\n      catch (IOException\
  \ e)\n      {\n         // 写入文件错误\n      }\n   }\n   ```\n\n   这种方法会弄乱你的代码。考虑一下你想完成的任务。在这里，我们要从栈中弹出\
  \ 100 个数字并将它们保存到文件中。（忽略为什么——这只是一个示例。）如果堆栈为空，它就不会被占用。如果文件包含错误，错误不会自动消失。因此，将*整个任务*封装在一个\
  \ `try` 块中是有意义的。如果任何操作失败，你就可以放弃任务。\n\n   ```\n   try\n   {\n      for (i = 0; i\
  \ < 100; i++)\n      {\n         n = s.pop();\n         out.writeInt(n);\n     \
  \ }\n   }\n   catch (IOException e)\n   {\n      // 写入文件错误\n   }\n   catch (EmptyStackException\
  \ e)\n   {\n      // 堆栈为空\n   }\n   ```\n\n   这段代码看起来清晰得多。它实现了异常处理的承诺之一：将正常处理与错误处理分离。\n\
  \n3. **良好利用异常层次结构。**\n   - 不要只抛出 `RuntimeException`。找到一个合适的子类或创建自己的。\n   - 不要只捕获\
  \ `Throwable`。这会让你的代码难以阅读和维护。\n   - 尊重检查异常和未检查异常之间的区别。检查异常本质上是有负担的——不要为逻辑错误抛出它们。（例如，反射库在这一点做得错了。调用者经常需要捕获可能永远不会异常。）\n\
  \   - 不要犹豫将异常转换为更合适的异常。例如，当你在解析整数时，捕获 `NumberFormatException` 并将其转换为 `IOException`\
  \ 或 `MySubsystemException` 的子类。\n\n4. **不要压制异常。**\n   在 Java 中，抑制异常的诱惑很大。如果你正在编写一个可能每百年抛出一次异常的方法，编译器会抱怨，因为你没有在方法的\
  \ `throws` 列表中声明该异常。你不想把它放在 `throws` 列表中，因为那样编译器会对所有调用你方法的都会产生抱怨。所以你直接把它压制了：\n\n\
  \   点击此处查看代码图像\n\n\n\n\n\n```java\npublic Image loadImage(String s)\n{\n   try\n\
  \   {\n      // 可能抛出受检异常的代码\n   }\n   catch (Exception e)\n   {} // 就这样了\n}\n```\n\
  \n现在，你的代码可以毫无障碍地通过编译。它将运行良好，除非发生异常。发生时，异常将被静默地忽略。如果你认为异常非常重要，就应该花精力正确地处理它们。\n\n\
  ### 5. *当你检测到错误时，“严厉的爱”比纵容更有效。*\n\n有些程序员担心在检测到错误时抛出异常。也许当使用无效参数调用方法时，返回一个占位符值比抛出异常更好？例如，当栈（stack）为空时，`Stack.pop`\
  \ 应该返回 `null` 还是抛出异常？我认为，在故障发生点抛出 `EmptyStackException` 比在稍后的某个时间才发生 `NullPointerException`\
  \ 要好。\n\n### 6. *传播异常并不是耻辱的表现。*\n\n有些程序员觉得他们必须捕获所有抛出的异常。如果他们调用一个会抛出异常的方法（例如 `FileInputStream`\
  \ 构造函数或 `readLine` 方法），他们会本能地捕获可能生成的异常。在许多情况下，实际上*传播*异常比捕获它更好：\n\n点击此处查看代码图片\n\n\
  ```java\npublic void readStuff(String filename) throws IOException // 这不是耻辱的表现！\n\
  {\n   var in = new FileInputStream(filename, StandardCharsets.UTF_8);\n   . . .\n\
  }\n```\n\n高层的方法通常具备更好的能力来向用户报告错误，或放弃失败的命令。\n\n### 7. *使用标准方法来报告空指针和越界异常。*\n\n`Objects`\
  \ 类拥有以下方法：\n\n```\nrequireNonNull\ncheckIndex\ncheckFromToIndex\ncheckFromIndexSize\n\
  ```\n\n用于这些常见的检查。使用它们来验证参数验证：\n\n点击此处查看代码图片\n\n```java\npublic void putData(int\
  \ position, Object newValue)\n{\n   Objects.checkIndex(position, data.length);\n\
  \   Objects.requireNonNull(newValue);\n   . . .\n}\n```\n\n如果使用无效索引或空参数调用方法，将会抛出一个异常，并使用\
  \ Java 库使用的熟悉的消息。\n\n### 8. *不要向终端用户显示堆栈跟踪。*\n\n如果你的程序遇到意外之外的异常，显示堆栈跟踪似乎是一个好主意，这样用户就可以报告它，让你更容易精位问题。然而，堆栈跟踪可能包含你不希望向潜在攻击者暴露的实现细节，例如你正在使用的库版本。\n\
  \n记录堆栈跟踪以便你可以检索，但只向用户显示摘要消息。\n\n![Images](img/note.jpg) Note\n\n规则 5 和 6 可以总结为“早抛出，晚捕获”。\n\
  \n## 7.4 使用断言 (Assertions)\n\n断言（Assertions）是防御性编程中一种常用的惯用法。在接下来的章节中，你将学习如何有效地使用它们。\n\
  \n#### 7.4.1 断言的概念\n\n假设你确定某个特定属性已满足，并且你在代码中依赖该属性。例如，你可能正在计算：\n\n```java\ndouble\
  \ y = Math.sqrt(x);\n```\n\n你确定 `x` 不是负数。也许它是另一个不会产生负结果的计算结果，或者它是某个方法的参数，该方法要求调用者仅提供正输入。尽管如此，你想要再次检查，而不是让混乱的“非数字”（NaN）浮点值渗入你的计算中。当然，你可以抛出一个异常：\n\
  \n点击此处查看代码图片\n\n```java\nif (x < 0) throw new IllegalArgumentException(\"x < 0\"\
  );\n```\n\n但这段代码在测试完成后仍然留在程序中。如果你有大量此类检查，程序的运行速度可能会比应该有的要慢得多。\n\n断言机制允许你在测试期间插入检查，并在生产代码中自动移除它们。\n\
  \nJava 语言有一个关键字 `assert`。它有两种形式：\n\n```java\nassert condition;\n```\n\n以及\n\n点击此处查看代码图片\n\
  \n```java\nassert condition : expression;\n```\n\n这两条语句都会求值条件，如果条件为 `false`，则抛出\
  \ `AssertionError`。在第二条语句中，表达式被传递给 `AssertionError` 对象的构造函数并转换为消息字符串。\n\n![Images](img/note.jpg)\
  \ Note\n\n*表达式* 部分的唯一目的是产生一个消息字符串。`AssertionError` 对象并不存储实际的表达式值，因此你以后无法对其进行查询。正如\
  \ JDK 文档所述，这样做“会鼓励程序员尝试从断言失败中恢复，这违背了该机制的目的”。\n\n要断言 `x` 为非负数，你可以简单使用语句：\n\n```java\n\
  assert x >= 0;\n```\n\n或者你可以将 `x` 的实际值传递给 `AssertionError` 对象，以便稍后显示。\n\n```java\n\
  assert x >= 0 : x;\n```\n\n![Images](img/cnote.jpg) Note\n\nC 语言的 `assert` 宏会将断言条件转换为在断言失败时打印的字符串。例如，如果\
  \ `assert(x >= 0)` 失败，它打印 `\"x >= 0\"`。在 Java 中，它不是自动错误报告的一部分。如果你想看到它，必须将其作为字符串传递给\
  \ `AssertionError`：`assert x >= 0 : \"x >= 0\"`。\n\n### 7.4.2 断言的启用与禁用\n\n默认情况下，断言是禁用的。通过使用\
  \ `-enableassertions` 或 `-ea` 运行程序来启用它们：\n\n```\n\n注意你不需要重新编译程序来启用或禁用断言。启用或禁用断言是类加载器的功能。当禁用断言时，类加载器会剥离断言代码以免影响执行。\n\
  \n你甚至可以特定的类或整个包开启断言。例如：\n\n点击此处查看代码图片\n\n```bash\njava -ea:MyClass -ea:company.mylib\n\
  ```\n\n此命令开启了 `MyClass` 类以及 `company.mylib` 包及其子包的断言。选项 `-ea...` 开启未命名包中所有类的断言。\n\
  \n你也可以通过 `-disableassertions` 或 `-da` 禁用某些类和包的断言：\n\n点击此处查看代码图片\n\n```bash\njava\
  \ -ea:... -da:MyClass\n```\n\n某些类不是由类加载器加载的，而是由虚拟机直接加载的。你可以使用这些开关来选择性地启用或禁用这些类的断言。\n\
  \n然而，启用或禁用所有断言的 `-ea` 和 `-da` 不适用于没有加载器的“系统类”。使用 `-enablesystemassertions/-esa`\
  \ 开关启用系统类的断言。\n\n还可以通过编程控制类加载器的断言状态。参见本节末尾的 API 注释。\n\n![Images](img/note.jpg) Note\n\
  \nJava 库的源码中有四百多个被注释的断言。有些程序员在测试后会注释掉断言，否则它们会在类文件中占用空间。如果你担心这一点，可以按如下方式条件包含它们：\n\
  \n```java\npublic static final boolean asserts = true; // 生产环境重新编译时为 false\n. .\
  \ .\nif (asserts) assert x >= 0;\n```\n\n### 7.4.3 使用断言进行参数检查\n\nJava 语言提供了三种处理系统故障的机制：\n\
  \n*   抛出异常\n\n\n\n\n\n# 日志\n\n## 使用断言 (assertions)\n\n何时应该选择断言？请记住以下几点：\n\n- 断言失败旨在导致致命的、不可恢复的错误。\n\
  - 断言检查仅在开发和测试期间开启。（（这有时被戏称为地描述为“在岸边时穿上救生衣，一旦进入大海中心就把它扔入海”。）\n\n因此，你不应该使用断言来向程序的其他部分发送可恢复的条件，也不用于向程序用户通信问题。断言应该仅用于测试期间定位程序的内部错误。\n\
  \n让我们来看一个常见的场景——方法参数的检查。你是否应该使用断言来检查非法索引值或 `null` 引用？要回答这个问题，你必须查看方法的文档。假设你实现了一个排序方法。\n\
  \n点击此处查看代码图像\n\n```\n/**\n   以数字升序对指定数组的指定范围进行排序。\n   排序范围从 fromIndex（包含）延伸到 toIndex（不包含）。\n\
  \   @param a 要排序的数组。\n   @param fromIndex 要排序的第一个元素（包含）的索引。\n   @param toIndex 要排序的最后一个元素（不包含）的索引。\n\
  \   @throws IllegalArgumentException 如果 fromIndex > toIndex\n   @throws ArrayIndexOutOfBoundsException\
  \ 如果 fromIndex < 0 或 toIndex > a.length\n*/\nstatic void sort(int[] a, int fromIndex,\
  \ int toIndex)\n```\n\n文档说明如果索引值不正确，方法将抛出异常。这种行为是方法与其调用者之间合约的一部分。如果你实现了该方法，你就必须遵守该合约并抛出指定的异常。此时使用断言是不恰当的。\n\
  \n你应该断言 `a` 不为 `null` 吗？这也不恰当。方法文档对于 `a` 为 `null` 时的方法行为没有说明。调用者有权假设在这种情况下方法将成功返回，而不会抛出断言错误。\n\
  \n然而，假设方法的合约略有不同：\n\n点击此处查看代码图像\n\n```\n@param a 要排序的数组（不能为 null）。\n```\n\n现在，方法的调用者已经收到通知，使用\
  \ `null` 数组调用该方法是非合法的。那么方法可以从断言开始：\n\n```\nassert a != null;\n```\n\n计算机科学家将这种合约称为`前置条件`\
  \ (`precondition`)。原始方法对其参数没有前置条件——它承诺在所有情况下都有定义良好的行为。修改后的方法有一个前置条件：`a` 不为 `null`。如果调用者未能满足前置条件，那么一切规则都将失效，该方法可以执行它想做的任何操作。事实上，在有了断言的情况下，该方法在被非法调用时其行为是相当不可预测的。取决于其类加载器如何配置，它有时会抛出断言错误，有时会抛出空指针异常。\n\
  \n### 7.4.4 使用断言来记录假设\n\n通常，程序员使用注释来记录他们的底层假设。考虑下面这个来自 [`http://docs.oracle.com/javase/8/docs/technotes/guides/language/assert.html`](http://docs.oracle.com/javase/8/docs/technotes/guides/language/assert.html)\
  \ 的示例：\n\n```\nif (i % 3 == 0)\n   . . .\nelse if (i % 3 == 1)\n   . . .\nelse //\
  \ (i % 3 == 2)\n   . . .\n```\n\n在这种情况下，使用断言反而要有意义得多。\n\n```\nif (i % 3 == 0)\n\
  \   . . .\nelse if (i % 3 == 1)\n   . . .\nelse\n{\n   assert i % 3 == 2;\n   .\
  \ . .\n}\n```\n\n当然，彻彻地思考这个问题会更有意义。`i % 3` 的可能值有哪些？如果 `i` 是正数，余数必须是 `0`、`1` 或 `2`。如果\
  \ `i` 是负数，那么余数可以是 `-1` 或 `-2`。因此，真正的假设是 `i` 不是负数。一个更好的断言应该是：\n\n```\nassert i >=\
  \ 0;\n```\n\n在 `if` 语句之前。\n\n无论如何，这个示例展示了将断言作为程序员自检的良好用法。正如你所见，断言是测试和调试的战术工具。相比之下，日志是程序整个生命周期的战略工具。我们将在下一节中检查日志。\n\
  \n#### `java.lang.ClassLoader` 1.0\n\n- `void setDefaultAssertionStatus(boolean\
  \ b)` 1.4\n  启用或禁用由此类加载器加载的所有没有显式类或包断言状态的类的断言。\n- `void setClassAssertionStatus(String\
  \ className, boolean b)` 1.4\n  启用或禁用给定类及其内部类的断言。\n- `void setPackageAssertionStatus(String\
  \ packageName, boolean b)` 1.4\n  启用或禁用给定包及其子包中所有类的的断言。\n- `void clearAssertionStatus()`\
  \ 1.4\n  移除所有显式的类和包断言状态设置，并禁用由此类加载器加载的所有类的断言。\n\n## 7.5 日志\n\n每个 Java 程序员都熟悉在代码中插入\
  \ `System.out.println` 调用的过程，以获取程序行为的洞察。当然，一旦你发现了问题，就可以移除它们。日志 API 是为了解决这些问题设计的。以下是\
  \ API 的主要优势：\n\n- 可以轻松禁用所有日志记录或仅禁用某些级别的记录，并且同样容易重新开启。\n- 日志非常廉价，因此在代码中留下日志的代价很小。\n\
  - 日志记录可以定向到不同的处理器——例如显示在控制台、写入文件等。\n- 日志器和处理器都可以过滤记录。过滤器可以使用实现者提供的任何标准丢弃记录。\n- 日志记录可以以不同的方式格式化——例如纯文本或\
  \ XML。\n- 应用程序可以使用多个日志器，使用类似于包名的 `com.mycompany.myapp`。\n- 日志配置由配置文件控制。\n\n![Images](img/note.jpg)\
  \ 注意\n\n许多应用程序使用其他的日志框架，例如 Log4J 2 (`https://logging.apache.org/log4j/2.x`](https://logging.apache.org/log4j/2.x))\
  \ 和 Logback (`https://logback.qos.ch`](https://logback.qos.ch))，它们的性能高于标准的 Java\
  \ 日志框架。这些框架有稍微不同的 API。日志层如 SLF4J (`https://www.slf4j.org`](https://www.slf4j.org))\
  \ 和 Commons Logging (`https://commons.apache.org/proper/commons-logging`](https://commons.apache.org/proper/commons-logging))\
  \ 提供了一个统一的 API，以便你可以在不重写应用程序的情况下更换日志框架。让事情更复杂的是，Log4J 2 也可以作为使用 SLF4J 组件的层。在本书中，我涵盖了标准的\
  \ Java 日志框架。它对于许多目的已经足够，学习它的 API 将有助于你理解替代方案。\n\n![Images](img/note.jpg) 注意\n\n\
  从 Java 9 开始，Java 平台有一个独立的轻量级日志系统，它不依赖 java.logging-模块（包含标准的 Java 日志框架）。该系统仅供 Java\
  \ API 使用。如果存在 `java.logging` 模块，日志消息会自动转发到它。第三方日志框架可以提供适配器来接收平台日志消息。我不涵盖平台日志，因为它不是设计给应用程序程序员使用的。\n\
  \n### 7.5.1 基础日志\n\n对于简单的日志，使用全局日志器并调用其 `info` 方法：\n\n点击此处查看代码图像\n\n\n\n\n\n```\n\
  Logger.getGlobal().info(\"File->Open menu item selected\");\n```\n\n默认情况下，记录的打印格式如下：\n\
  \n点击此处查看代码图片\n\n```\nMay 10, 2013 10:12:15 PM LoggingImageViewer fileOpen\nINFO:\
  \ File->Open menu item selected\n```\n\n但如果你在调用\n\n点击此处查看代码图片\n\n```\nLogger.getGlobal().setLevel(Level.OFF);\n\
  ```\n\n在适当的位置（例如 `main` 方法的开头），所有的日志都会被抑制了。\n\n### 7.5.2 高级日志\n\n现在你已经了解了“入门级日志记录”，让我们进入工业级日志记录。在专业应用程序中，你不会希望将所有记录都记录到一个全局日志记录器中。相反，你可以定义自己的日志记录器。\n\
  \n调用 `getLogger` 方法来创建或检索日志记录器：\n\n点击此处查看代码图片\n\n```\nprivate static final Logger\
  \ myLogger = Logger.getLogger(\"com.mycompany.myapp\");\n```\n\n![Images](img/tip.jpg)\
  \ 提示\n\n没有任何任何变量引用的日志记录器可以被垃圾回收。为了防止这种情况，请使用静态变量保存日志记录器的引用，如上例所示。\n\n与包名类似，日志记录器名称是层次级结构。事实上，它们的层次性比包*更强*。包和它的父包之间没有语义关系，但日志记录器的父子节点共享某些属性。例如，如果你在日志记录器\
  \ `\"com.mycompany\"` 上设置了日志级别，那么子日志记录器将继承该级别。\n\n共有七种日志级别：\n\n* `SEVERE`\n* `WARNING`\n\
  * `INFO`\n* `CONFIG`\n* `FINE`\n* `FINER`\n* `FINEST`\n\n默认情况下，实际上前三个级别会被记录。你可以设置一个不同的级别——例如，\n\
  \n```\nlogger.setLevel(Level.FINE);\n```\n\n现在，`FINE` 及其以上的所有级别都都会被记录。\n\n你还可以使用\
  \ `Level.ALL` 开启所有级别的日志记录，或使用 `Level.OFF` 关闭所有日志记录。\n\n所有级别都有对应的日志方法，例如\n\n```\n\
  logger.warning(message);\nlogger.fine(message);\n```\n\n此类此类。或者，你可以使用 `log` 方法并提供级别，例如\n\
  \n点击此处查看代码图片\n\n```\nlogger.log(Level.FINE, message);\n```\n\n![Images](img/tip.jpg)\
  \ 提示\n\n默认的日志配置记录了所有级别为 `INFO` 或更高的记录。因此，你应该使用 `CONFIG`、`FINE`、`FINER` 和 `FINEST`\
  \ 级别来记录对诊断有用但对用户无意义的调试消息。\n\n![Images](img/caution.jpg) 注意\n\n如果你将日志级别设置为比 `INFO`\
  \ 更精细的值，你还需要更改日志处理器的配置。默认的日志处理器会抑制 `INFO` 以下的消息。详情请见下一节。\n\n默认的日志记录会显示包含日志调用的类和方法名称，这是从调用堆栈推断出来的。然而，如果虚拟机优化了执行，可能无法获得准确的调用信息。你可以使用\
  \ `logp` 方法来提供调用类和方法的精确位置。该方法的签名如下\n\n点击此处查看代码图片\n\n```\nvoid logp(Level l, String\
  \ className, String methodName, String message)\n```\n\n还有一些用于追踪执行流的便利方法：\n\n点击此处查看代码图片\n\
  \n```\nvoid entering(String className, String methodName)\nvoid entering(String\
  \ className, String methodName, Object param)\nvoid entering(String className, String\
  \ methodName, Object[] params)\nvoid exiting(String className, String methodName)\n\
  void exiting(String className, String methodName, Object result)\n```\n\n例如：\n\n\
  点击此处查看代码图片\n\n```\nint read(String file, String pattern)\n{\n   logger.entering(\"\
  com.mycompany.mylib.Reader\", \"read\",\n      new Object[] { file, pattern });\n\
  \   . . .\n   logger.exiting(\"com.mycompany.mylib.Reader\", \"read\", count);\n\
  \   return count;\n}\n```\n\n这些调用生成的级别为 `FINER` 的日志记录将以字符串 `ENTRY` 和 `RETURN` 开头。\n\
  \n![Images](img/note.jpg) 笔记\n\n在未来的某个时刻，带有 `Object[]` 参数的日志方法将被重写以支持可变参数列表（varargs）。到那时，你就可以进行如\
  \ `logger.entering(\"com.mycompany.mylib.Reader\", \"read\", file, pattern)` 的调用。\n\
  \n日志的一个常见是记录意外异常。有两个便利方法可以在日志记录中包含异常的描述。\n\n点击此处查看代码图片\n\n```\nvoid throwing(String\
  \ className, String methodName, Throwable t)\nvoid log(Level l, String message,\
  \ Throwable t)\n```\n\n典型用法如下\n\n点击此处查看代码图片\n\n```\n if (. . .)\n  {\n     var e\
  \ = new IOException(\". . .\");\n     logger.throwing(\"com.mycompany.mylib.Reader\"\
  , \"read\", e);\n     throw e;\n  }\n```\n\n以及\n\n点击此处查看代码图片\n\n```\n try\n  {\n\
  \     . . .\n  }\n  catch (IOException e)\n  {\n     Logger.getLogger(\"com.mycompany.myapp\"\
  ).log(Level.WARNING, \"Reading image\", e);\n  }\n```\n\n`throwing` 调用会记录一条级别为 `FINER`\
  \ 的记录，其消息以 `THROW` 开头。\n\n### 7.5.3 更改日志管理器配置\n\n你可以通过编辑配置文件来更改日志系统的各种属性。默认配置文件位于\
  \ `jdk`/conf/logging.properties`（在 Java 9 之前位于 `jre`/lib/logging.properties`）。\n\
  \n要使用另一个文件，可以通过在启动应用程序时将 `java.util.config.file` 属性设置为文件位置\n\n点击此处查看代码图片\n\n```\n\
  java -Djava.util.logging.file=configFile MainClass\n```\n\n要更改默认日志级别，请编辑配置文件并修改该行\n\
  \n```\n.level=INFO\n```\n\n你可以通过添加如下行来指定你自己的日志记录器的日志级别：\n\n点击此处查看代码图片\n\n```\ncom.mycompany.myapp.level=FINE\n\
  ```\n\n即在日志记录器名称后附加 `.level` 后缀。\n\n正如你在本节稍后将看到的，日志记录器实际上并没有将消息发送到控制台——那是处理器（handlers）的工作。处理器也有级别。为了在控制台上看到\
  \ `FINE` 消息，你还需要设置\n\n点击此处查看代码图片\n\n```\njava.util.logging.ConsoleHandler.level=FINE\n\
  ```\n\n![Images](img/caution.jpg) 注意\n\n日志管理器配置中的设置*不是*系统属性。使用 `-Dcom.mycompany.myapp.level=FINE`\
  \ 启动对日志记录器没有任何影响。\n\n日志管理器在虚拟机启动期间初始化，在 `main` 方法执行之前。如果你想自定义日志属性但没有在启动应用程序时使用 `-Djava.util.logging.config.file`\
  \ 命令行选项，请在程序调用 `System.setProperty(\"java.util.logging.config.file\", file)`。但你随后必须调用\
  \ `LogManager.getLogManager().readConfiguration()` 来重新初始化日志管理器。\n\n从 Java 9 开始，你可以通过调用以下方法更新日志配置\n\
  \n点击此处查看代码图片\n\n```\nLogManager.getLogManager().updateConfiguration(mapper);\n```\n\
  \n从系统属性 `java.util.logging.config.file` 指定的位置读取新配置。然后应用映射来解析旧或新配置中所有键的值。映射 是一个 `Function<String,BiFunction<String,String,String>>`。它将现有配置中的键映射到替换函数。每个替换函数接收与键关联的旧新值（如果没有关联值则为\
  \ `null`），并产生一个替换值，或者返回 `null` 则在更新时丢弃该键。\n\n\n\n\n\n这听起来相当复杂，所以让我们来看几个例子。一个有效的映射方案是合并旧配置和新配置，当键在旧新配置中都存在时，优先使用新值。此时\
  \ `mapper` 如下：\n\n点击此处查看代码图片\n\n```\nkey -> ((oldValue, newValue) -> newValue ==\
  \ null ? oldValue : newValue)\n```\n\n或者，你可能只想更新以 `com.mycompany` 开头的键，而保持其他键不变：\n\
  \n点击此处查看代码图片\n\n```\nkey -> key.startsWith(\"com.mycompany\")\n   ? ((oldValue,\
  \ newValue) -> newValue)\n   : ((oldValue, newValue) -> oldValue)\n```\n\n还可以使用\
  \ `jconsole` 程序在运行中的程序中更改日志级别。详情请参阅 [`www.oracle.com/technetwork/articles/java/jconsole-1564139.html`](http://www.oracle.com/technetwork/articles/java/jconsole-1564139.html)\
  \ `#LoggingControl`。\n\n![图片](img/note.jpg) 注意\n\n日志属性文件由 `java.util.logging.LogManager`\
  \ 类处理。可以通过将系统属性 `java.util.logging.manager` 设置为某个子类的名称，来指定不同的日志管理器。或者，你可以保留标准的日志管理器，但仍然跳过来自日志属性文件的初始化。将\
  \ `java.util.logging.config.class` 系统属性设置为以其他某种方式设置日志管理器属性的类名。更多信息请参阅 `LogManager`\
  \ 类的 API 文档。\n\n### 7.5.4 本地化\n\n你可能希望对日志消息进行本地化，以便国际用户能够阅读。应用程序的国际化是第二卷第 7 章 的的话题。简而言之，在本地化日志消息时需要注意以下几点。\n\
  \n本地化的应用程序在资源包（resource bundles）中包含特定特定区域的信息。资源包由一组针对各种语言区域（如美国或德国）的映射组成。例如，一个资源包可以将字符串\
  \ `\"readingFile\"` 映射为英语字符串 `\"Reading file\"` 或德语字符串 `\"Achtung! Datei wird eingelesen\"\
  `。\n\n程序可能包含多个资源包——例如，一个用于菜单，另一个用于日志消息。每个资源包都有一个名称（例如 `\"com.mycompany.logmessages\"\
  `）。要向资源包中添加映射，请为每个语言区域提供一个文件。英语消息映射位于 `com/mycompany/logmessages_en.properties`\
  \ 文件中，德语消息映射位于 `com/mycompany/logmessages_de.properties` 文件中（`en` 和 `de` 是语言代码）。你将这些文件与应用程序的类文件放在一起，这样\
  \ `ResourceBundle` 类就会自动定位它们。这些文件是纯文本文件，由如下条目组成：\n\n点击此处查看代码图片\n\n```\nreadingFile=Achtung!\
  \ Datei wird eingelesen\nrenamingFile=Datei wird umbenannt\n. . .\n```\n\n在请求记录器时，你可以指定一个资源包：\n\
  \n点击此处查看代码图片\n\n```\nLogger logger = Logger.getLogger(loggerName, \"com.mycompany.logmessages\"\
  );\n```\n\n然后为日志消息指定资源包键，而不是实际的消息字符串：\n\n```\nlogger.info(\"readingFile\");\n```\n\
  \n你通常需要将参数包含在本地化消息中。消息中可能包含占位符：`{0}`、`{1}` 等。例如，要在日志消息中包含文件名，可以这样使用占位符：\n\n点击此处查看代码图片\n\
  \n```\nReading file {0}.\nAchtung! Datei {0} wird eingelesen.\n```\n\n然后，要将值传递给占位符，请调用以下方法之一：\n\
  \n点击此处查看代码图片\n\n```\nlogger.log(Level.INFO, \"readingFile\", fileName);\nlogger.log(Level.INFO,\
  \ \"renamingFile\", new Object[] { oldName, newName });\n```\n\n或者，从 Java 9 开始，你可以在\
  \ `logrb` 方法中指定资源包对象（而不是名称）：\n\n点击此处查看代码图片\n\n```\nlogger.logrb(Level.INFO, bundle,\
  \ \"renamingFile\", oldName, newName);\n```\n\n![图片](img/note.jpg) 注意\n\n这是唯一使用可变参数作为消息参数的日志方法。\n\
  \n### 7.5.5 处理器 (Handlers)\n\n默认情况下，记录器将记录发送到 `ConsoleHandler`，将其打印到 `System.err`\
  \ 流。具体而言，记录器将记录发送给父级处理器，而最终祖先（名称为 `\"\"`）拥有一个 `ConsoleHandler`。\n\n和记录器一样，处理器也有日志级别。要使某条记录被记录，其日志级别必须高于记录器和处理器的阈值。日志管理器配置文件设置默认控制台处理器的日志级别为：\n\
  \n点击此处查看代码图片\n\n```\njava.util.logging.ConsoleHandler.level=INFO\n```\n\n为了记录 `FINE`\
  \ 级别的记录，必须同时更改记录器和处理器的级别。我们不想两次看到这些记录，因此将 `useHandlers` 属性设置为 `false`。\n\n为了将记录发送到其他地方，添加另一个处理器。日志\
  \ API 提供了实用的处理器：`FileHandler` 和 `SocketHandler`。`SocketHandler` 将记录发送到指定的主机和端口。更有趣的是\
  \ `FileHandler`，它将记录收集在文件中。你可以简单地将记录发送到默认处理器，如下：\n\n点击此处查看代码图片\n\n```\nvar handler\
  \ = new FileHandler();\nlogger.addHandler(handler);\n```\n\n记录被发送到用户目录下的 `java*n*.log`，其中\
  \ *n* 是一个唯一的数字。如果系统没有用户目录的概念（例如在 Windows 中），则文件存储在默认位置，如 `C:\\Windows`。默认情况下，记录以\
  \ XML 格式化。典型的日志记录形式如下：\n\n点击此处查看代码图片\n\n```\n<record>\n  <date>2002-02-04T07:45:15</date>\n\
  \  <millis>101283715710</millis>\n  <sequence>1</sequence>\n  <logger>com.mycompany.myapp</logger>\n\
  \  <level>INFO</level>\n  <class>com.mycompany.mylib.Reader</class>\n  <method>read</method>\n\
  \  <thread>10</thread>\n  <message>Reading file core.gif</message>\n</record>\n\
  ```\n\n你可以通过在日志管理器配置中设置各种参数（见 表 7.1）或使用另一个构造函数（见本节末的 API 注释）来修改文件处理器的默认行为。\n\n**表\
  \ 7.1 文件处理器配置参数\n\n| 配置属性 | 描述 | 默认值 |\n| --- | --- | --- |\n| `java.util.logging.FileHandler.level`\
  \ | 处理器级别 | `Level.ALL` |\n| `java.util.logging.FileHandler.append` | 控制处理器是追加到现有文件还是每次程序运行时打开新文件\
  \ | `false` |\n| `java.util.logging.FileHandler.limit` | 在打开另一个文件之前写入文件的近似最大字节数（`0`\
  \ = 无限制） | `FileHandler` 类中为 `0`（无限制），默认日志管理器配置中为 `50000` |\n\n\n\n\n\n| `java.util.logging.FileHandler.pattern`\
  \ | 日志文件名的模式。模式变量请参见表 7.2。 | `%h/java%u.log` |\n| `java.util.logging.FileHandler.count`\
  \ | 轮转序列中的日志数量 | `1`（不进行轮转） |\n| `java.util.logging.FileHandler.filter` | 使用的过滤器类\
  \ | 不进行过滤 |\n| `java.util.logging.FileHandler.encoding` | 使用的字符编码 | 平台默认编码 |\n|\
  \ `java.util.logging.FileHandler.formatter` | 记录格式化器 | `java.util.logging.XMLFormatter`\
  \ |\n\n你可能不想使用默认的日志文件名。因此，你应该使用另一个模式，例如 `%h/myapp.log.`。（请参见表 7.2 获取关于模式变量的说明。）\n\
  \n### 表 7.2 日志文件模式变量\n\n| 变量 | 描述 |\n| --- | --- |\n| `%h` | `user.home` 系统属性的值\
  \ |\n| `%t` | 系统临时目录 |\n| `%u` | 用于解决冲突的唯一数字 |\n| `%g` | 轮转日志的代数（如果指定了轮转且模式中不包含\
  \ `%g`，则使用 `.%g` 后缀） |\n| `%%` | `%` 字符 |\n\n如果多个应用程序（或同一个应用程序的多个副本）使用同一个日志文件，你应该开启\
  \ `append` 标记。或者，在文件名模式中使用 `%u`，以便每个应用程序都创建一个唯一的日志副本。\n\n开启文件轮转也是一个好主意。日志文件保留在轮转序列中，例如\
  \ `myapp.log.0`、`myapp.log.1`、`myapp.log.2` 等。每当文件超过大小限制时，最旧的日志将被删除，其他文件被重命名，并创建一个生成代号为\
  \ `0` 的新文件。\n\n![Images](img/tip.jpg) 提示\n\n某些程序员将日志作为技术支持人员的辅助。如果程序在运行环境中表现异常，用户可以发回日志文件进行检查。在这种情况下，你应该开启\
  \ `append` 标记、使用轮转日志或两者兼顾。\n\n你还可以通过扩展 `Handler` 或 `StreamHandler` 类来定义自己的处理器。我们在本节末尾的示例程序中定义了这样一个处理器。该处理器在窗口中显示记录（参见图\
  \ 7.2）。\n\n![Images](img/07fig02.jpg)\n\n### 图 7.2 在窗口中显示记录的日志处理器\n\n该处理器扩展了 `StreamHandler`\
  \ 类并安装了一个流，其 `write` 方法在文本区域中显示流输出。\n\n点击此处查看代码图像\n\n```\nclass WindowHandler extends\
  \ StreamHandler\n{\n   public WindowHandler()\n   {\n      . . .\n      var output\
  \ = new JTextArea();\n      setOutputStream(new\n         OutputStream()\n     \
  \    {\n            public void write(int b) {} // 不被调用\n            public void\
  \ write(byte[] b, int off, int len)\n            {\n               output.append(new\
  \ String(b, off, len));\n            }\n         });\n   }\n   . . .\n}\n```\n\n\
  这种方法只有一个问题——处理器缓存了记录，仅在缓冲区满时才将它们写入流。因此，我们重写了 `publish` 方法在处理每条记录后刷新缓冲区：\n\n点击此处查看代码图像\n\
  \n```\nclass WindowHandler extends StreamHandler\n{\n   . . .\n   public void publish(LogRecord\
  \ record)\n   {\n      super.publish(record);\n      flush();\n   }\n}\n```\n\n\
  如果你想编写更奇奇异的流处理器，请扩展 `Handler` 类并定义 `publish`、`flush` 和 `close` 方法。\n\n#### 7.5.6\
  \ 过滤器\n\n默认情况下，记录根据其日志级别进行过滤。每个日志记录器和处理器都可以有一个可选的过滤器来执行额外的过滤。要定义一个过滤器，请实现 `Filter`\
  \ 接口并定义方法：\n\n点击此处查看代码图像\n\n```\nboolean isLoggable(LogRecord record)\n```\n\n使用你所需的任何标准分析日志记录，并对于应该包含在日志中的记录返回\
  \ `true`。例如，特定的过滤器可能只对 `entering` 和 `exiting` 方法生成的消息感兴趣。过滤器应调用 `record.getMessage()`\
  \ 并检查它是否以 `ENTRY` 或 `RETURN` 开头。\n\n要将过滤器安装到日志记录器或处理器中，只需调用 `setFilter` 方法。注意，你一次最多只能有一个过滤器。\n\
  \n#### 7.5.7 格式化器\n\n`ConsoleHandler` 和 `FileHandler` 类以文本和 XML 格式输出日志记录。然而，你也可以定义自己的格式。你需要扩展\
  \ `Formatter` 类并重写该方法：\n\n点击此处查看代码图像\n\n```\nString format(LogRecord record)\n```\n\
  \n以你喜欢的任何方式格式化记录中的信息并返回字符串。在你的 `format` 方法中，你可能想要调用：\n\n点击此处查看代码图像\n\n```\nString\
  \ format(LogRecord record)\n```\n\n该方法格式化记录中的消息部分。许多格式（如 XML）需要头部和结尾。为了实现这一点，你需要调用：\n\
  \n```\nString getHead(Handler h)\nString getTail(Handler h)\n```\n\n最后，调用 `setFormatter`\
  \ 将处理器。\n\n#### 7.5.8 日志配方\n\n日志选项有很多，很容易丢失基本知识。以下配方总结了最常用的操作。\n\n1. 对于简单的应用程序，选择一个日志记录器。一个好主意是将日志记录器的命名与你的主包相同，例如\
  \ `com.company.prog`。你可以通过调用获取日志记录器：\n\n点击此处查看代码图像\n\n```\nLogger logger = Logger.getLogger(\"\
  com.company.prog\");\n```\n\n对于日志活动大量的类，你可能希望添加静态字段：\n\n点击此处查看代码图像\n\n```\nprivate\
  \ static final Logger logger = Logger.getLogger(\"com.company.prog\");\n```\n\n\
  2. 默认配置会将 `INFO` 及以上的消息输出到控制台。用户可以覆盖默认配置，但正如你所见，这个过程有点复杂。因此，在你的应用程序中安装更合理的默认设置。以下代码确保所有消息都记录到特定的文件中。将这些代码放在应用程序的\
  \ `main` 方法中：\n\n点击此处查看代码图像\n\n```\nif (System.getProperty(\"java.util.logging.config.class\"\
  ) == null\n      && System.getProperty(\"java.util.logging.config.file\") == null)\n\
  {\n   try\n      {\n      Logger.getLogger(\"\").setLevel(Level.ALL);\n      final\
  \ int LOG_ROTATION_COUNT = 10;\n      var handler = new FileHandler(\"%h/myapp.log\"\
  , 0, LOG_ROTATION_COUNT);\n      Logger.getLogger(\"\").addHandler(handler);\n \
  \     }\n   catch (IOException e)\n      {\n      logger.log(Level.SEVERE, \"无法创建日志文件处理器\"\
  , e);\n      }\n}\n```\n\n3. 现在你可以尽情记录日志了。记住，所有级别为 `INFO`、`WARNING` 和 `SEVERE` 的消息都会显示在控制台上。因此，将这些级别留给对程序用户有意义的消息。`FINE`\
  \ 级别是记录面向程序员消息的良好选择。\n\n\n\n\n\n```java\ntry\n{\n   . . .\n}\ncatch (SomeException\
  \ e)\n{\n   logger.log(Level.FINE, \"explanation\", e);\n}\n```\n\n列表 7.2 以增加了一个新技巧的方式使用了了此配方：日志消息也会显示在日志窗口中。\n\
