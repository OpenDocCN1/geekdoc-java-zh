  \n### 9.6.3 二分查找\n\n要在数组中找到一个对象，通常需要遍历所有元素，直到找到匹配项。然而，如果数组是排序过的，你可以查看中间元素并检查它是否大于你正在尝试查找的元素。如果是，继续在数组的前半部分查找；否则，在后半部分查找。这会将问题减半，你以相同的方式继续下去。例如，如果数组有\
  \ 1024 个元素，你将在 10 步后定位匹配项（或确认不存在），而线性搜索在元素存在时平均需要 512 步，而确认其不存在则需要 1024 步。\n\n`Collections`\
  \ 类的 `binarySearch` 实现了这种算法。请注意，集合必须已经是已排序的，否则算法将返回错误答案。要查找一个元素，请提供集合（必须实现 `List`\
  \ 接口——更多信息请见下文注释）和要查找的元素。如果集合不是通过 `Comparable` 接口的 `compareTo` 元素排序的，请也提供一个比较器对象。\n\
  \n点击此处查看代码图片\n\n```\ni = Collections.binarySearch(c, element);\ni = Collections.binarySearch(c,\
  \ element, comparator);\n```\n\n`binarySearch` 方法返回的非负值表示匹配对象的索引。也就是说，在比较顺序下，`c.get(i)`\
  \ 等于 `element`。如果值为负数，则表示没有匹配的元素。然而，你可以使用该返回值来计算你*应该*将 `element` 插入到集合中的哪个位置，以保持其排序。插入位置是：\n\
  \n```\ninsertionPoint = -i - 1;\n```\n\n它并不是简单的 `-i`，因为那样值 `0` 就会产生歧义。换句话说，该操作\n\
  \n```\nif (i < 0)\n   c.add(-i - 1, element);\n```\n\n将元素添加到正确的位置。\n\n为了有价值，二分查找需要随机访问。如果你必须逐个遍历链表的半部分来找到中间元素，你已经失去了二分查找的所有优势。因此，如果你给它链表，`binarySearch`\
  \ 算法将退化为线性搜索。\n\n### `java.util.Collections` 1.2\n\n*   `static <T extends Comparable<?\
