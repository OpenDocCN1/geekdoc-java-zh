  \n上一章的内容主要是为了向你展示如何在 Java 中使用事件模型。在这个过程中，你已经在学习如何构建图形化用户界面（GUI）迈出了第一步。本章将向你展示构建更功能全\
  \ GUI 所需的最重要工具。\n\n我们首先将介绍 `Swing` 的架构基础。了解“底层”发生了什么，对于理解如何有效地使用某些高级组件至关重要。随后，我将向你展示\
  \ `Swing` 中最常用的用户界面组件，如文本字段、单选按钮和菜单。接下来，你将学习如何使用布局管理器（layout managers）来安排这些组件。最后，你将看到如何在\
  \ `Swing` 中实现对话框。\n\n本章涵盖了基础的 `Swing` 组件，如文本组件、按钮和滑块。这些是你最频繁需要的本质用户界面组件。我们将在第二卷中介绍高级的\
  \ `Swing` 组件。\n\n### 11.1 Swing 与模型-视图-控制器设计模式\n\n让我们停下来思考一下构成一个用户界面组件（如按钮、复选框、文本字段或复杂的树形控件）的各个。每个组件都有三个特征：\n\
  \n* 它的 `content`（内容），例如按钮的状态（是否按下）或文本字段中的文字\n* 它的 `visual appearance`（视觉外观，颜色、大小等）\n\
  * 它的 `behavior`（行为，对事件的反应）\n\n即使是像按钮这样看似简单的组件，在这些特征之间也表现出某种中等复杂的交互。显然，按钮的视觉外观取决于“外观与感觉”（look-and-feel）。Metal\
  \ 按钮看起来与 Windows 按钮或 Motif 按钮不同。此外，外观还取决于按钮的状态；当按钮被按下时，它需要重绘以显示不同的外观。状态则取决于按钮接收到的事件。当用户在按钮内部按下鼠标时，按钮就处于被按下状态。\n\
  \n当然，当你程序中使用按钮时，你只是简单地将其视为一个 `button`；你不需要过多考虑它的内部工作机制和特征。毕竟，那是实现按钮的程序员要做的工作。然而，实现按钮及所有其他用户界面组件的程序员有动力对它们进行更深层次的思考，以便无论当前在使用何种外观与感觉，它们都能良好运行。\n\
  \n为了做到这一点，`Swing` 的设计者们转向了一种著名的设计模式：`model-view-controller`（MVC）模式。这种设计模式告诉我们提供提供三个独立的对象：\n\
  \n* `model`（模型），存储内容\n* `view`（视图），显示内容\n* `controller`（控制器），处理用户输入\n\n该模式精确地规定了这三个对象如何交互。模型存储内容且“`no\
  \ user interface`”。对于按钮来说，内容非常简单——只需一组小小的标志位，用于指示按钮当前是按下还是抬起、是激活还是未激活等。对于文本字段，内容则稍微有趣一些。它是一个持有当前文本的字符串对象。这与内容的视图\
  \ `not the same`（并不相同）——如果内容大于文本字段，用户只能看到显示的部分文本（参见图 11.1）。\n\n![Images](img/011fig01.jpg)\n\
  \n**图 11.1** 文本字段的模型和视图\n\n模型必须实现更改内容以及发现内容是什么的方法。例如，文本模型具有在当前文本中添加或删除字符的方法，以及可以将当前文本作为字符串返回的方法。再次，请记住，模型是完全非视觉的。绘制模型中存储的数据是视图的任务。\n\
  \n![Images](img/note.jpg) 注意事项\n\n“model（模型）”一词可能不太理想，因为我们经常把模型想成抽象概念的表示。汽车和飞机设计师建立模型来模拟真实的汽车和飞机。但在思考模型-视图-控制器模式时，这种类比真的会误导你。在这种设计模式中，模型存储完整内容，而视图提供内容的（完整或不完全的）视觉表示。一个更好的类比可能是为艺术家摆姿的模特。观察模特并创建视图取决于艺术家。根据艺术家的不同，该视图可能是一个正式的肖像、一幅印象派绘画，或者是一幅肢体奇异扭曲的立方派画。\n\
  \n模型-视图-控制器模式的优势之一是一个模型可以拥有多个视图，每个视图显示完整内容的不同部分或方面。例如，HTML 编辑器可以为同一内容同时提供两个视图：一个所见即所得（WYSIWYG）视图和一个“原始标签”视图（参见图\
  \ 11.2）。当模型通过其中一个视图的控制器进行更新时，它会通知所有关联的视图发生了变化。当视图收到通知时，它们会自动刷新。当然，对于像按钮这样简单的用户界面组件，你不会拥有同一个模型的多个视图。\n\
  \n![Images](img/011fig02.jpg)\n\n**图 11.2** 同一模型的两个独立视图\n\n控制器处理用户输入事件，如鼠标点击和按键。它随后决定是否将这些事件翻译为模型或视图的变化。例如，如果用户在文本框中按下字符键，控制器会调用模型的“插入字符”命令。然后模型告诉视图更新自身。视图永远不知道文本为何发生变化。但如果用户按下光标键，控制器可能会告诉视图滚动。滚动视图对模型没有影响，因此模型不知道该事件的发生。\n\
  \n图 11.3 展示了模型、视图和控制器之间的交互。\n\n![Images](img/011fig03.jpg)\n\n**图 11.3** 模型、视图之间的交互\n\
  \n对于大多数 `Swing` 组件，模型类实现一个以 `Model` 结尾的接口；在这种情况下，该接口被称为 `ButtonModel`。实现该接口的类定义了各种按钮。实际上，按钮并不复杂，`Swing`\
  \ 库包含一个名为 `DefaultButtonModel` 的类来实现该接口。\n\n你可以通过查看 `ButtonModel` 接口的属性来了解按钮模型维护的数据类型——参见表\
  \ 11.1。\n\n**表 11.1** `ButtonModel` 接口\n\n| 属性名 | 值 |\n| --- | --- |\n| `actionCommand`\
  \ | 与此按钮关联的操作字符串 |\n| `mnemonic` | 此按钮的键盘快捷键 |\n| `armed` | `true` 表示按钮被按下且鼠标仍在按钮上\
  \ |\n| `enabled` | `true` 表示按钮可选 |\n| `pressed` | `true` 表示按钮已被按下但鼠标按键尚未释放 |\n|\
  \ `rollover` | `true` 表示鼠标在按钮上 |\n| `selected` | `true` 表示按钮已开启（用于复选框和单选按钮） |\n\n\
  每个 `JButton` 对象存储一个按钮模型对象，你可以获取它。\n\n点击此处查看代码图像\n\n```java\nvar button = new JButton(\"\
  Blue\");\nButtonModel model = button.getModel();\n```\n\n在实践中，你不会关心——按钮状态的细微细节只对绘制它的视图感兴趣。所有重要信息（例如按钮是否启用）都可以从\
  \ `JButton` 类获取。（当然，`JButton` 随后会询问其模型以检索这些信息。）\n\n\n\n\n再次查看 `ButtonModel` 接口，看看它缺少了什么。模型并不存储按钮标签或图标。仅仅通过查看模型，无法知道按钮表面上显示的是什么。（实际上，正如你在\
  \ 第 11.4.2 节 中看到的，在第 670 页的“单选按钮”节中提到，这种设计的纯洁性给程序员带来了一些苦恼。）\n\n值得注意的是，相同的模型（即 `DefaultButtonModel`）被用于推按钮、单选按钮、复选框甚至菜单项。当然，每种类型的按钮都有不同的视图和控制器。在使用\
  \ Metal 看起来和界面时，`JButton` 使用一个名为 `BasicButtonUI` 的类作为视图，并使用名为 `ButtonUIListener`\
  \ 的类作为控制器。通常，每个 Swing 组件都有一个以 `UI` 结尾的关联视图对象。但并不是所有的 Swing 组件都有专用的控制器对象。\n\n因此，在阅读了关于\
  \ `JButton` 内部工作机制的简短介绍后，你可能会在想：`JButton` 到底是什么？它仅仅是一个继承自 `JComponent` 的包装类，持有 `DefaultButtonModel`\
  \ 对象、一些视图数据（如按钮标签和图标）以及一个负责按钮视图的 `BasicButtonUI` 对象。\n\n## 11.2 布局管理简介\n\n在我们讨论具体的\
  \ Swing 组件（如文本字段和单选按钮）之前，让我们简要介绍一下如何在框架内安排这些组件。\n\n当然，Java 开发环境拥有拖放式 GUI 构建器。尽管如此，确切知道“内部”发生了什么是非常重要的，因为即使是这些工具通常也需要手动微调。\n\
  \n### 11.2.1 布局管理器\n\n让我们从回顾列表 10.4 中的程序开始，该程序使用按钮更改框架的背景颜色。\n\n按钮包含在 `JPanel` 对象中，并由流式布局管理器（flow\
  \ layout manager）管理，这是面板的默认布局管理器。图 11.4 显示了向面板添加更多按钮时发生的情况。正如你所看到的，当没有更多空间时，会开启新行。\n\
  \n![Images](img/011fig04.jpg)\n\n**图 11.4** 由流式布局管理的带有六个按钮的面板\n\n此外，即使用户调整框架的大小，按钮仍然保持在面板的中心位置（参见图\
  \ 11.5）。\n\n![Images](img/011fig05.jpg)\n\n**图 11.5** 更改面板大小会自动重新排列按钮。\n\n通常，组件被放置在容器内部，布局管理器决定容器内组件的位置和大小。\n\
  \n按钮、文本字段和其他用户界面元素继承自 `Component` 类。组件可以放在容器（如面板）中。容器本身可以放在其他容器中，因此 `Container`\
  \ 类继承自 `Component`。图 11.6 显示了 `Component` 的继承层次结构。\n\n![Images](img/011fig06.jpg)\n\
  \n**图 11.6** `Component` 类的继承层次结构\n\n![Images](img/note.jpg) 备注\n\n遗憾的是，继承层次结构在两个方面并不完美。首先，顶层窗口（如\
  \ `JFrame`）是 `Container` 的子类，因此也是 `Component` 的子类，但它们不能被放在其他容器内部。此外，`JComponent`\
  \ 是 `Container` 的子类而不是 `Component`。因此你可以向 `JButton` 添加其他组件。（但这些组件将不会显示。）\n\n每个容器都有一个默认布局管理器，但你可以随时设置自己的。例如，语句\n\
  \n点击此处查看代码\n\n```\npanel.setLayout(new GridLayout(4, 4));\n```\n\n使用 `GridLayout`\
  \ 类将组件布局为四行四列。当你向容器添加组件时，容器的 `add` 方法会将组件和任何位置传递给布局管理器。\n\n**`java.awt.Container`**\
  \ **1.0**\n\n*   `void setLayout(LayoutManager m)`\n    设置此容器的布局管理器。\n\n*   `Component\
  \ add(Component c)`\n*   `Component add(Component c, Object constraints)` **1.1**\n\
  \    向此容器添加组件并返回组件引用。\n\n**`java.awt.FlowLayout`** **1.0**\n\n*   `FlowLayout()`\n\
  *   `FlowLayout(int align)`\n*   `FlowLayout(int align, int hgap, int vgap)`\n \
  \   构造一个新的 `FlowLayout`。`align` 参数是 `LEFT`、`CENTER` 或 `RIGHT` 之一。\n\n### 11.2.2\
  \ 边界布局\n\n边界布局管理器（border layout manager）是每个 `JFrame` 内容面板的默认布局管理器。与完全控制每个组件位置的流布局管理器不同，边界布局管理器允许你选择放置每个组件的位置。你可以选择将组件放置在中心、北、南、东。\n\
  \n![Images](img/011fig04.jpg)\n\n**图 11.4** 由流式布局管理的带有六个按钮的面板\n\n此外，即使用户调整框架的大小，按钮仍然保持在面板的中心位置（参见图\
  \ 11.5）。\n\n![Images](img/011fig05.jpg)\n\n**图 11.5** 更改面板大小会自动重新排列按钮。\n\n*(注：用户提供的输入文本包含大量重复，我已根据规则格式化了唯一的的内容。）)*\n\
  \n\n\n\n### 11.2.3 网格布局 (Grid Layout)\n\n网格布局像电子表格一样按行和列排列所有组件。所有组件都具有相同的尺寸。图 11.10\
  \ 中的计算器程序使用网格布局来排列计算器按钮。当你调整窗口大时，按钮会增大或缩小，但所有按钮的大小都是完全相同的。\n\n![Images](img/011fig10.jpg)\n\
  \n**图 11.10** 一台计算器\n\n在网格布局对象的构造函数中，指定你需要多少行和多少列。\n\n点击此处查看代码图片\n\n```\npanel.setLayout(new\
  \ GridLayout(4, 4));\n```\n\n添加组件，从第一行的第一个条目开始，然后是第一行的第二个条目，依此类推。\n\n```\npanel.add(new\
  \ JButton(\"1\"));\npanel.add(new JButton(\"2\"));\n```\n\n当然，很少应用程序的布局像计算器面板那样固定。在实践中，较小的网格（通常只有一行或一列）可以用于组织窗口的部分区域。例如，如果你想有一行大小相同的按钮，可以将按钮放在一个由单行网格布局控制的面板（panel）中。\n\
  \n`java.awt.GridLayout` 1.0\n\n*   `GridLayout(int rows, int columns)`\n*   `GridLayout(int\
  \ rows, int columns, int hgap, int vgap)`\n构造一个新的 `GridLayout`。`rows` 和 `columns`\
  \ 中的其中一个（但不是两个）可以为零，表示每行或每列的组件数量任意的。\n\n## 11.3 文本输入 (Text Input)\n\n我们终于准备好引入 Swing\
  \ 用户界面组件了。让我们从允许用户输入和编辑文本的组件开始。你可以使用 `JTextField` 和 `JTextArea` 组件进行文本输入。文本字段只能接受一行文本；文本区域可以接受多行文本。`JPasswordField`\
  \ 接受一行文本但不显示内容。\n\n这三个类都继承自一个名为 `JTextComponent` 的类。你无法自己构造一个 `JTextComponent`，因为它是一个抽象类。另一方面，正如\
  \ Java 中常见的情况，当你查阅 API 文档时，可能会发现你寻找的方法实际上在父类 `JTextComponent` 中而不是派生类中。例如，获取或设置文本字段或文本区域文本实际上在\
  \ `JTextComponent` 中。\n\n`javax.swing.text.JTextComponent` 1.2\n\n*   `String getText()`\n\
  *   `void setText(String text)`\n    获取或设置此文本组件的文本。\n*   `boolean isEditable()`\n\
  *   `void setEditable(boolean b)`\n    获取或设置 `editable` 属性，该属性决定用户是否可以编辑此文本组件的内容。\n\
  \n### 11.3.1 文本字段 (Text Fields)\n\n将文本字段添加到窗口的常用方法是将其添加到面板或其他容器中——就像添加按钮一样：\n\n\
  点击此处查看代码图片\n\n```\nvar panel = new JPanel();\nvar textField = new JTextField(\"\
  Default input\", 20);\npanel.add(textField);\n```\n\n这段代码添加了一个文本字段，并通过在内部放置字符串 `\"\
  Default input\"` 来初始化它。该构造函数的第二个参数设置宽度。在这种情况下，宽度为 20“列”。遗憾的是，列是一个相当不精确的测量单位。一列是你用于文本的字体中一个字符的预期宽度。其想法是，如果你预计输入为\
  \ *n* 个字符或更少，你应该指定 *n* 为列宽。在实践中，这种测量效果并不理想，为了安全起见，你应该在最大输入长度上增加 1 或 2。此外，请记住，列数只是给\
  \ AWT 的一个提示，用于提供*首选*尺寸。如果布局管理器需要增大或缩小文本字段，它可以调整其尺寸。你在 `JTextField` 构造函数中设置的列宽并不是用户可以输入的字符数量的上限。用户仍然可以输入更长的字符串，但当文本超过字段长度时，输入会滚动。用户往往会认为滚动文本字段很烦恼，所以你应该给字段留出更大慨的空间。如果你需要在运行时重置列数，可以使用\
  \ `setColumns` 方法实现。\n\n![Images](img/tip.jpg) 提示\n\n使用 `setColumns` 方法更改文本框的大小后，调用周围容器的\
  \ `revalidate` 方法。\n\n```\ntextField.setColumns(10);\npanel.revalidate();\n```\n\
  \n`revalidate` 方法重新计算容器中所有组件的尺寸和布局。在使用 `revalidate` 方法后，布局管理器会调整容器的大小，文本字段改变后的尺寸将变得可见。\n\
  \n`revalidate` 方法属于 `JComponent` 类。它不会立即调整组件的大小，而仅仅将其标记为需要调整大小。如果多个组件请求调整大小，这种方法避免了重复计算。然而，如果你想重新计算\
  \ `JFrame` 内部的所有组件，必须调用 `validate` 方法——`JFrame` 并没有扩展 `JComponent`。\n\n通常情况下，用户在文本字段中添加文本（或编辑现有文本）。这些字段通常是空白的。创建一个空白文本字段，只需省略\
  \ `JTextField` 构造函数的字符串参数：\n\n点击此处查看代码图片\n\n```\nvar textField = new JTextField(20);\n\
  ```\n\n你可以随时使用上节提到的 `JTextComponent` 类的 `setText` 方法更改文本字段的内容。例如：\n\n```\ntextField.setText(\"\
  Hello!\");\n```\n\n正如上节提到的，通过调用 `getText` 方法可以找出用户输入了什么。该方法返回用户输入的精确文本。要去除文本字段数据中的首尾空格，对\
  \ `getText` 的返回值应用 `strip` 方法：\n\n点击此处查看代码图片\n\n```\nString text = textField.getText().strip();\n\
  ```\n\n要更改用户文本显示的字体，使用 `setFont` 方法。\n\n`javax.swing.JTextField` 1.2\n\n*   `JTextField(int\
  \ cols)`\n    构造一个指定列数的空 `JTextField`。\n*   `JTextField(String text, int cols)`\n\
  \    构造具有初始字符串和指定列数的 `JTextField`。\n*   `int getColumns()`\n*   `void setColumns(int\
  \ cols)`\n    获取或设置此文本字段使用的列数。\n\n`javax.swing.JComponent` 1.2\n\n*   `void revalidate()`\n\
  \    重新计算组件的位置和尺寸。\n*   `void setFont(Font f)`\n    设置此组件的字体。\n\n`java.awt.Component`\
  \ 1.0\n\n*   `void validate()`\n    重新计算组件的位置和尺寸。如果组件是容器，其组件的位置和尺寸也将重新计算。\n*   `Font\
  \ getFont()`\n    获取此组件的字体。\n\n### 11.3.2 标签与组件标记\n\n标签是持有文本的组件。它们没有装饰（例如，没有边界）。它们也不会对用户输入做出反应。可以使用标签来标识组件。例如，与按钮不同，文本字段没有标识符。为自身没有标识符的组件标记：\n\
  \n1. 构造一个带有正确文本的 `JLabel` 组件。\n2. 将其放置在你想要标识的组件足够近的地方，以便可以使用该标签标识的是正确的组件。\n\n\n\n\
  \n`JLabel` 的构造函数允许你指定初始文本或图标，并可选指定内容的对齐方式。使用 `SwingConstants` 接口中的常量来指定对齐。该接口定义了许多实用的常量，如\
  \ `LEFT`、`RIGHT`、`CENTER`、`NORTH`、`EAST` 等。`JLabel` 类是实现此接口的 Swing 类之一。因此，你可以通过以下方式指定右对齐的标签：\n\
  \n点击此处查看代码图像\n\n```\nvar label = new JLabel(\"User name: \", SwingConstants.RIGHT);\n\
  ```\n\n或者\n\n点击此处查看代码图像\n\n```\nvar label = new JLabel(\"User name: \", JLabel.RIGHT);\n\
  ```\n\n`setText()` 和 `setIcon()` 方法允许你在运行时设置标签的文本和图标。\n\n![Images](img/tip.jpg)\
  \ 提示\n\n你可以在按钮、标签和菜单项中使用纯文本和 HTML 文本。我不建议在按钮中使用 HTML——因为它会干扰外观效果。但在标签中使用 HTML 可以非常有效。只需用\
  \ `<html>. . .</html>` 标签字符串，如下：\n\n点击此处查看代码图像\n\n```\nlabel = new JLabel(\"<html><b>Required</b>\
  \ entry:</html>\");\n```\n\n注意，第一个带有 HTML 标签的组件可能需要一些时间显示，因为必须加载相当复杂的 HTML 渲染代码。\n\
  \n标签可以像其他组件一样放在容器内部。这意味着你可以使用之前见过的技术将标签放置在你需要的地方。\n\n### `javax.swing.JLabel` 1.2\n\
  \n*   `JLabel(String text)`\n*   `JLabel(Icon icon)`\n*   `JLabel(String text, int\
  \ align)`\n*   `JLabel(String text, Icon icon, int align)`\n    构造一个标签。`align` 参数是\
  \ `SwingConstants` 常量 `LEFT`（默认值）、`CENTER` 或 `RIGHT` 之一。\n\n*   `String getText()`\n\
  *   `void setText(String text)`\n    获取或设置此标签的文本。\n\n*   `Icon getIcon()`\n*   `void\
  \ setIcon(Icon icon)`\n    获取或设置此标签的图标。\n\n### 11.3.3 密码字段\n\n密码字段是一种特殊的文本字段。为了防止好奇的旁观者看到你的密码，用户输入的字符实际上不会显示。相反，每个输入的字符都由一个回显字符表示，例如项目符号（·`）。Swing\
  \ 提供了一个实现此类文本字段的 `JPasswordField` 类。\n\n密码字段是模型-视图-控制器模式强大的另一个例子。密码字段使用与普通文本字段相同的模型来存储数据，但它的视图已被更改，将所有字符显示为回显字符。\n\
  \n### `javax.swing.JPasswordField` 1.2\n\n*   `JPasswordField(String text, int columns)`\n\
  \    构造一个新的密码字段。\n\n*   `void setEchoChar(char echo)`\n    设置此密码字段的回显字符。这是一个建议性的设置；特定的外观可能会坚持使用自己选择的回显字符。值\
  \ `0` 可将回显字符重置为默认值。\n\n*   `char[] getPassword()`\n    返回此密码字段包含的文本。为了更强的安全性，你应该在使用后覆盖返回的数组的内容。（密码不会以\
  \ `String` 类型返回，因为字符串将一直留在虚拟机中直到被垃圾回收。）\n\n### 11.3.4 文本区域\n\n有时，你需要收集超过一行的用户输入。如前所述，你可以使用\
  \ `JTextArea` 组件来实现。当你程序中放置文本区域组件时，用户可以输入任意行的文本，并使用 Enter 键将它们分隔。每行都以 `'\\n'` 结束。图\
  \ 11.11 显示了工作中的文本区域。\n\n在 `JTextArea` 组件的构造函数中，指定文本区域的行数和列数。例如\n\n点击此处查看代码图像\n\n\
  ```\ntextArea = new JTextArea(8, 40); // 8 行，每行 40 列\n```\n\n![Images](img/011fig11.jpg)\n\
  \n**图 11.11** 文本组件\n\n其中 `columns` 参数的作用与以前相同——为了安全起见，你仍然需要额外几列。此外，像以前一样，用户不受行数和列数的限制；当用户输入过多时，文本会自动滚动。你还可以使用\
  \ `setColumns()` 方法更改列数，使用 `setRows()` 方法更改行数。这些数字仅表示建议尺寸——布局管理器仍然可以放大或缩小文本区域。\n\
  \n如果文本多于文本区域显示范围，剩余文本将被裁剪。你可以通过开启自动换行来避免长行被裁剪：\n\n点击此处查看代码图像\n\n```\ntextArea.setLineWrap(true);\
  \ // 长行将换行\n```\n\n这种换行只是视觉效果；文档中的文本不会改变——不会向文本中自动插入 `'\\n'` 字符。\n\n### 11.3.5 滚动面板\n\
  \n在 Swing 中，文本区域没有滚动条。如果你需要滚动条，必须将文本区域放置在滚动面板内部。\n\n点击此处查看代码图像\n\n```\ntextArea\
  \ = new JTextArea(8, 40);\nvar scrollPane = new JScrollPane(textArea);\n```\n\n\
  现在滚动面板管理文本区域的视图。如果文本多于文本区域范围，滚动条会自动出现；如果删除了文本且剩余文本适合区域，滚动条将再次消失。滚动由滚动面板在内部处理——你的程序不需要处理滚动事件。\n\
  \n这是一个适用于任何组件的通用机制，而不是文本区域。要为组件添加滚动条，请将其放入滚动面板中。\n\n列表 11.1 展示了各种文本组件。该程序显示了一个文本字段、一个密码字段和一个带有滚动条的文本区域。文本字段和密码字段都有标签。点击“插入”将字段内容插入到文本区域中。\n\
  \n![Images](img/note.jpg) 注意\n\n`JTextArea` 组件仅显示纯文本，没有特殊字体或格式。要显示格式化文本（如 HTML），你可以使用第二卷中讨论的\
  \ `JEditorPane` 类。\n\n**列表 11.1** `text/TextComponentFrame.java`\n\n点击此处查看代码图像\n\
  \n\n\n\n\n```\n 1  package text;\n 2\n 3  import java.awt.BorderLayout;\n 4  import\
