  \ 竞态条件\n\n这种损坏发生的概率是多少？在具有多核心的现代处理器上，风险很高。我通过将打印语句与更新余额的语句交替，增加了在单核处理器上观察问题的概率。\n\
  \n如果你省略打印语句，风险会降低，因为每个线程在休眠之前的工作很少，调度程序不太可能中断它。然而，风险并没有完全消失。如果你在负载严重的机器上运行大量线程，程序仍然会失败。故障可能在几分钟、几小时或几天后发生。坦率地说，对于程序员来说，没有比不规则出现的错误更糟糕的事情了。\n\
  \n问题在于这些操作不是*原子*的。假设两个线程同时执行指令\n\n```\naccounts[to] += amount;\n```\n\n1. 将 `accounts[to]`\
  \ 加载到寄存器。\n2. 加上 `amount`。\n3. 将结果移回 `accounts[to]`。\n\n现在，假设第一个线程执行了第 1 和 2 步，然后被抢占。假设第二个线程觉醒并更新了同一个项。然后，第一个线程觉醒并完成了它的第\
  \ 3 步。该操作抹掉了另一个线程的修改。\n\n你实际上可以查看执行每个语句的虚拟机字节码。运行命令\n\n```\njavap -c -v Bank\n```\n\
  \n来反编译 `Bank.class` 文件。例如，行\n\n```\naccounts[to] += amount;\n```\n\n被翻译成以下字节码：\n\
  \n点击此处查看代码图片\n\n```\naload_0\ngetfield #2; //Field accounts:[D\niload_2\ndup2\n\
  daload\ndload_3\ndadd\ndastore\n```\n\n这些代码意味着什么并不重要。关键在于增加命令是由多条指令组成的，执行它们的线程可以在任何指令处被中断。\n\
  \n\n\n\n\n有两种机制可以保护代码块免受并发访问。Java 语言提供了 `synchronized` 关键字来实现这一目的，而 Java 5 引入了 `ReentrantLock`\
  \ 类。`synchronized` 关键字会自动提供锁以及一个关联的“条件（condition）”，这使得它对于大多数需要显式锁的场景来说既强大又方便。然而，我相信在你们单独查看了锁和条件之后，再来看\
  \ `synchronized` 关键字会更容易理解。`java.util.concurrent` 框架为这些基础机制提供了独立的类，我将在这里以及在第 12.4.4\
  \ 节中的“**条件对象**”（位于第 772 页）对其进行解释。一旦你理解了这些构建模块，我将在第 12.4.5 节中的“**`synchronized` 关键字**”（位于第\
  \ 778 页）介绍 `synchronized` 关键字。\n\n使用 `ReentrantLock` 保护代码块的基本框架如下：\n\n点击此处查看代码图\n\
  \n```\nmyLock.lock(); // a ReentrantLock object\ntry\n{\n   critical section\n}\n\
  finally\n{\n   myLock.unlock(); // 即使发生异常也能释放锁\n}\n```\n\n这种结构保证了一次只有一个线程可以进入临界区域。一旦一个线程锁定了锁对象，其他线程就无法通过\
  \ `lock` 语句。当其他线程调用 `lock` 时，它们会被去激活状态，直到第一个线程释放锁对象。\n\n![Images](img/caution.jpg)\
  \ 警告\n\n将 `unlock` 操作封装在 `finally` 子句中至关重要。如果临界区域中的代码抛出异常，必须释放锁。否则，其他线程将永久阻塞。\n\n\
  ![Images](img/note.jpg) 笔记\n\n当你使用锁时，无法使用 `try`-with-resources 语句。首先，`unlock` 方法并不叫\
  \ `close`。但即使它被重命名，`try`-with-resources 语句也无法工作。它的头部期望声明一个新变量。但当你使用锁时，你想继续使用在线程间共享的同一个变量。\n\
  \n让我们使用锁来保护 `Bank` 类的 `transfer` 方法。\n\n点击此处查看代码图\n\n```\npublic class Bank\n{\n\
  \   private Lock bankLock = new ReentrantLock();\n   . . .\n   public void transfer(int\
  \ from, int to, int amount)\n   {\n      bankLock.lock();\n      try\n      {\n\
  \         System.out.print(Thread.currentThread());\n         accounts[from] -=\
  \ amount;\n         System.out.printf(\" %10.2f from %d to %d\", amount, from, to);\n\
  \         accounts[to] += amount;\n         System.out.printf(\" Total Balance:\
  \ %10.2f%n\", getTotalBalance());\n      }\n      finally\n      {\n         bankLock.unlock();\n\
  \      }\n   }\n}\n```\n\n假设一个线程调用 `transfer` 后在完成之前被抢占了执行。假设第二个线程也调用了 `transfer`。第二个线程无法获取锁并在调用\
  \ `lock` 方法时被阻塞。它处于去激活状态，必须等待第一个线程执行完 `transfer` 方法。当第一个线程释放锁时，第二个线程就可以继续执行（参见图\
  \ 12.3）。\n\n![Images](img/12fig03.jpg)\n\n**图 12.3** 未同步与同步线程的对比\n\n尝试一下。在 `transfer`\
  \ 方法中添加锁代码并重新运行程序。你可以一直运行它，银行余额不会被损坏。\n\n请注意，每个 `Bank` 对象都有自己的 `ReentrantLock` 对象。如果两个线程尝试访问同一个\
  \ `Bank` 对象，那么锁将起到访问序列化（串行）的作用。然而，如果两个线程访问不同的 `Bank` 对象，每个线程都会获取不同的锁，两个线程都不会被阻塞。这是正确的，因为线程在操作不同的\
  \ `Bank` 实例时彼此不会相互干扰。\n\n这种锁被称为*重入的（reentrant）*，因为线程可以重复获取它已经拥有的锁。锁具有一个*持有计数（hold\
  \ count）*，用于跟踪对 `lock` 方法的嵌套调用。线程必须对每次调用 `lock` 调用一次 `unlock` 才能释放锁。由于这一特性，受锁保护的代码可以调用另一个使用相同锁的方法。\n\
  \n例如，`transfer` 方法调用了 `getTotalBalance` 方法，该方法也锁定了 `bankLock` 对象，此时该锁的持有计数变为 `2`。当\
  \ `getTotalBalance` 方法退出时，持有计数回到 `1`。当 `transfer` 方法退出时，持有计数变为 `0`，线程释放锁。\n\n通常情况下，你会希望保护更新或检查共享对象的代码块，以便你可以确保这些操作在另一个线程使用相同对象之前运行完成。\n\
  \n![Images](img/caution.jpg) 警告\n\n小心确保临界区域不会被异常跳过。如果抛出异常，`finally` 子句将释放锁，但对象可能处于损坏状态。\n\
  \n`java.util.concurrent.locks.Lock`\n*   `void lock()`：获取此锁；如果锁被另一个线程持有，则阻塞。\n*\
  \   `void unlock()`：释放此锁。\n\n`java.util.concurrent.locks.ReentrantLock`\n*   `ReentrantLock()`：构造一个用于保护临界区域的重入锁。\n\
  *   `ReentrantLock(boolean fair)`：根据给定的公平策略构造锁。公平锁倾向于等待时间最长的线程。然而，这种公平性保证会对性能产生巨大影响。因此，默认情况下，锁是不公平的。\n\
  \n#### 12.4.4 条件对象\n\n通常，线程进入临界区域后发现自己在条件满足之前无法继续执行。使用*条件对象（condition object）*来管理已获取锁但无法进行工作的线程。在本节中，我将介绍\
  \ Java 库中条件对象的实现。（出于历史原因，条件对象通常被称为*条件变量*。）\n\n让我们完善我们的银行模拟程序。我们不想从没有资金支付转账的账户中转账。注意我们不能使用如下代码：\n\
  \n点击此处查看代码图\n\n```\nif (bank.getBalance(from) >= amount)\n   bank.transfer(from,\
  \ to, amount);\n```\n\n完全有可能当前线程在测试成功和调用 `transfer` 之间被去激活。\n\n点击此处查看代码图\n\n```\n\
  if (bank.getBalance(from) >= amount)\n      // 线程在此处可能会被去激活\n   bank.transfer(from,\
  \ to, amount);\n```\n\n当线程再次运行时，账户余额可能已经低于提取金额。你必须确保在测试和转账操作之间没有其他线程可以修改余额。你通过用锁保护测试和转账操作来实现这一点：\n\
  \n点击此处查看代码图\n\n\n\n\n\n```java\npublic void transfer(int from, int to, int amount)\n\
  {\n   bankLock.lock();\n   try\n   {\n      while (accounts[from] < amount)\n  \
  \    {\n         // wait\n         . . .\n      }\n      // transfer funds\n   \
  \   . . .\n   }\n   finally\n   {\n      bankLock.unlock();\n   }\n}\n```\n\n现在，当账户中的资金不足时，我们该怎么办？我们等待直到其他线程增加了资金。但此线程刚刚获得了\
  \ `bankLock` 的独占访问权限，因此没有其他线程有机会进行存款。这就是条件对象（condition objects）用用场的地方。一个锁对象可以关联一个或多个条件对象。你通过\
  \ `newCondition()` 方法获取条件对象。习惯上为每个条件对象命名一个能够唤起其所代表条件的名称。例如，在这里我们设置了一个条件对象来代表“资金充足”条件。\n\
  \n点击此处查看代码图片\n\n```java\nclass Bank\n{\n   private Condition sufficientFunds;\n\
  \   . . .\n   public Bank()\n   {\n      . . .\n      sufficientFunds = bankLock.newCondition();\n\
  \   }\n}\n```\n\n如果 `transfer` 方法发现资金不足，它会调用：\n\n```java\nsufficientFunds.await();\n\
  ```\n\n当前线程现在变为非激活状态并放弃锁。这让另一个线程能够进入，我们希望它可以增加账户余额。\n\n等待获取锁的线程与调用了 `await` 的线程之间存在本质区别。一旦线程调用了\
  \ `await()` 方法，它就会进入该条件的*等待集*（wait set）。该线程在锁可用时*不会变为可运行状态*。相反，它一直保持非激活状态，直到另一个线程在同一个条件上调用了\
  \ `signalAll()` 方法。\n\n当另一个线程转账后，它应该调用：\n\n```java\nsufficientFunds.signalAll();\n\
  ```\n\n此调用会激活所有等待该条件的线程。当线程从等待集中被移除时，它们再次变为可运行状态，调度程序最终会再次激活它们。届时，它们将尝试重新进入对象。一旦锁可用，其中一个线程将获得锁并*从上次停止的地方继续执行*，从\
  \ `await()` 调用中返回。\n\n此时，线程应该再次测试该条件。无法保证该条件现在已经满足——`signalAll()` 方法仅仅向等待的线程发出信号，表明此时*可能*已经满足，并且值得再次检查该条件。\n\
  \n![Images](img/note.jpg) 注意\n\n通常情况下，对 `await()` 的调用应该位于如下形式循环内部：\n\n```java\n\
  while (!(OK to proceed))\n   condition.await();\n```\n\n至关重要的是*某些*其他线程最终会调用 `signalAll()`\
  \ 方法。当线程调用 `await()` 时，它没有办法重新激活自己。它寄希望于其他线程。如果其中没有一个线程去激活等待的线程，它将永远不会再次运行。这可能导致不愉的*死锁*局面。如果所有其他线程都被阻塞，而最后一个活跃的线程调用了\
  \ `await()` 而没有解锁其中任何一个线程，它也会被阻塞。没有剩余线程可以解锁其他线程，程序就会挂起。\n\n你应该何时调用 `signalAll()`？经验法是，每当对象的状态发生可能对等待线程有利的变化时，就调用\
  \ `signalAll()`。例如，每当账户余额发生变化时，都应该给等待线程另一个检查余额的机会。在我们的示例中，当我们完成资金转账时，调用 `signalAll()`。\n\
  \n点击此处查看代码图片\n\n```java\npublic void transfer(int from, int to, int amount)\n{\n\
  \   bankLock.lock();\n   try\n   {\n      while (accounts[from] < amount)\n    \
  \     sufficientFunds.await();\n      // transfer funds\n      . . .\n      sufficientFunds.signalAll();\n\
  \   }\n   finally\n   {\n      bankLock.unlock();\n   }\n}\n```\n\n注意，调用 `signalAll()`\
  \ 并不会立即激活等待的线程。它只是解除等待线程的阻塞，以便它们在当前线程释放锁后竞争进入对象。\n\n另一个方法 `signal()` 只会从等待集中随机选择一个线程并解除阻塞。这比解锁所有线程效率更高，但存在危险。如果随机选中的线程发现它仍然无法继续，它将再次被阻塞。如果没有其他线程再次调用\
  \ `signal()`，系统就会死锁。\n\n![Images](img/caution.jpg) 警告\n\n线程只有在拥有该条件的锁时，才能对该条件调用\
  \ `await()`、`signalAll()` 或 `signal()`。\n\n如果你运行列表 12.4 中的示例程序，你会发现没有任何错误发生。总余额永远保持在\
  \ $100,000。没有任何账户出现过负余额。（再次按 Ctrl+C 终止程序。）你可能还会注意到程序运行慢一点——这是你为同步机制涉及的额外记录工作而付出的代价。\n\
  \n在实践中，正确使用条件可能非常挑战。在你开始实现自己的条件对象之前，你应该考虑使用第 12.5 节 中“线程安全”中描述的结构之一。\n\n\n\n\n唤醒此条件等待集中的所有线程。\n\
  \n*   `void signal()`\n\n唤醒此条件等待集中被随机选择的一个线程。\n\n### 12.4.5 `synchronized` 关键字\n\
  \n在前面的节中，你已经学习了如何使用 `Lock` 和 `Condition` 对象。在继续之前，让我们总结一下关于锁（locks）和条件（conditions）的关键点：\n\
  \n*   `lock` 保护代码段，允许只有一个线程同时执行代码。\n*   `lock` 管理尝试进入受保护代码段的线程。\n*   一个 `lock` 可以拥有一个或多个关联的\
  \ `condition` 对象。\n*   每个 `condition` 对象管理已进入受保护代码段但无法继续执行的线程。\n\n`Lock` 和 `Condition`\
  \ 接口为程序员提供了对锁的高粒度控制能力。然而，在大多数情况下，你并不需要这种控制——你可以使用 Java 语言内置的机制。从 1.0 版本开始，Java 中的每个对象都拥有一个内建锁（intrinsic\
  \ lock）。如果一个方法声明了 `synchronized` 关键字，那么该对象的锁就会保护整个方法。也就是说，要调用该方法，线程必须获取该对象的内建锁。\n\
  \n换句话说，\n\n```\npublic synchronized void method()\n{\n   method body\n}\n```\n\n\
  等同于：\n\n```java\npublic void method()\n{\n   this.intrinsicLock.lock();\n   try\n\
  \   {\n      method body\n   }\n   finally\n   {\n      this.intrinsicLock.unlock();\n\
  \   }\n}\n```\n\n例如，与其使用显式锁，我们可以简单地将 `Bank` 类的 `transfer` 方法声明为 `synchronized`。\n\
  \n内建对象锁只有一个关联条件。`wait` 方法将线程添加到等待集中，而 `notifyAll`/`notify` 方法则唤醒等待的线程。换句话说，调用 `wait`\
  \ 或 `notifyAll` 等同于：\n\n```java\nintrinsicCondition.await();\nintrinsicCondition.signalAll();\n\
  ```\n\n`wait`、`notifyAll` 和 `notify` 方法是 `Object` 类的 `final` 方法。`Condition` 方法必须命名为\
  \ `await`、`signalAll` 和 `signal`，以避免与这些方法冲突。\n\n例如，你可以像这样在 Java 中实现 `Bank` 类：\n\n\
  ```java\nclass Bank\n{\n   private double[] accounts;\n\n   public synchronized\
  \ void transfer(int from, int to, int amount)\n         throws InterruptedException\n\
  \   {\n      while (accounts[from] < amount)\n         wait(); // 等待内建对象锁的单一条件\n\
  \      accounts[from] -= amount;\n      accounts[to] += amount;\n      notifyAll();\
  \ // 通知所有等待该条件的线程\n   }\n\n   public synchronized double getTotalBalance()\n   {\n\
  \      . . .\n   }\n}\n```\n\n如你所见，使用 `synchronized` 关键字产生的代码简洁得多。当然，要理解这段代码，你必须知道每个对象都有一个内建锁，并且该锁有一个内建条件。锁管理尝试进入\
  \ `synchronized` 方法的线程；条件管理调用了 `wait` 的线程。\n\n同步方法相对直接。然而，初学者往往在条件上感到困惑。在运行 `wait/notifyAll`\
  \ 之前，你应该考虑使用在第 12.5 节（第 797 页）“[线程安全的集合”中描述的构造之一。\n\n将静态方法声明为 `synchronized` 也是合法的。如果调用了此类方法，它将获取关联类对象的内建锁。例如，如果\
  \ `Bank` 类有一个静态同步方法，那么当调用它时，`Bank.class` 对象的锁会被锁定。结果是其他线程无法调用该类的此方法或任何其他同步静态方法。\n\
  \n内建锁和条件有一些局限性。其中：\n\n*   你无法中断正在尝试获取锁的线程。\n*   在尝试获取锁时无法指定超时时间。\n*   每个锁只有一个条件可能是低效的。\n\
  \n在代码中应该用什么——`Lock` 和 `Condition` 对象还是同步方法？以下是我的建议：\n\n*   最好既不使用 `Lock`/`Condition`\
  \ 也使用 `synchronized` 关键字。在许多情况下，你可以使用 `java.util.concurrent` 包中的机制，它们会为你完成所有的锁定工作。例如，在第\
  \ 12.5.1 节（第 797 页）阻塞队列”中，你将看到如何使用阻塞队列来同步处理共同任务的线程。你还应该探索并行流——见第 12 章。\n*   如果 `synchronized`\
  \ 关键字适用于你的情况，请尽管使用它。这样你写的代码更少，出错机会也小。\n*   当你确实需要这些构造结构提供的额外功能时，再使用 `Lock`/`Condition`。\n\
  \n\n\n导致线程等待，直到它被通知为止。此方法只能在 `synchronized` 方法或块内部调用。如果当前线程不是对象锁的所有者，将抛出 `IllegalMonitorStateException`。\n\
  \n* `void wait(long millis)`\n* `void wait(long millis, int nanos)`\n\n导致线程等待，直到它被通知或指定的时长通过为止。这些方法只能在\
  \ `synchronized` 方法或块内部调用。如果当前线程不是对象锁的所有者，将抛出 `IllegalMonitorStateException`。纳秒数可能不超过\
  \ 1,000,000。\n\n### 12.4.6 同步块 (Synchronized Blocks)\n\n正如我们刚刚讨论的，每个 Java 对象都有一个锁。线程可以通过调用\
  \ `synchronized` 方法来获取锁。获取锁的第二种机制是进入 `synchronized block`。当一个线程进入如下形式的块时\n\n点击查看代码图片\n\
  \n```\nsynchronized (obj) // 这是同步块的语法\n{\n   critical section\n}\n```\n\n它就获取了 `obj`\
  \ 的锁。\n\n你有时会发现“临时（ad hoc）”锁，例如\n\n\n\n点击查看代码图片\n\n```\npublic class Bank\n{\n \
  \  private double[] accounts;\n   private Lock lock = new Object();\n   . . .\n\
  \   public void transfer(int from, int to, int amount)\n   {\n      synchronized\
  \ (lock) // 一个临时锁\n      {\n         accounts[from] -= amount;\n         accounts[to]\
  \ += amount;\n      }\n      System.out.println(. . .);\n   }\n}\n```\n\n在这里，`lock`\
  \ 对象的创建仅是为了使用每个 Java 对象都拥有的锁。\n\n![Images](img/caution.jpg) 注意\n\n使用同步块时，要小心锁对象。例如，这种做法将无效：\n\
  \n点击查看代码图片\n\n```\nprivate final String lock = \"LOCK\";\n. . .\nsynchronized (lock)\
  \ { . . . } // 不要对字符串字面量加锁！\n```\n\n如果这在同一个程序中发生两次，由于字符串字面量是共享的，锁将是同一个对象。这可能导致死锁。\n\
  \n此外，要避免使用基本类型包装类作为锁：\n\n点击查看代码图片\n\n```\nprivate final Integer lock = new Integer(42);\
  \ // 不要对包装类加锁\n```\n\n构造函数调用 `new Integer(0)` 已经过时，而且你不希望维护人员将调用更改为 `Integer.valueOf(42)`。如果使用相同的魔数执行两次，锁会被意外共享。\n\
  \n如果你需要修改静态字段，请对特定的类加锁，而不是对 `getClass()` 返回的值加锁：\n\n点击查看代码图片\n\n```\nsynchronized\
  \ (MyClass.class) { staticCounter++; } // OK\nsynchronized (getClass()) { staticCounter++;\
  \ } // 不要这样做\n```\n\n如果包含此代码的方法是从子类调用的，那么 `getClass()` 将返回一个不同的 `Class` 对象！你将不再能保证互斥性！\n\
  \n通常情况下，如果你必须使用 `synchronized` 块，请**了解你的锁对象（know your lock object）**！你必须对所有保护的访问路径使用同一个锁，并且没有其他人使用你的锁。\n\
  \n有时，程序员使用对象的锁来实现额外的原子操作——这种做法被称为客户端锁定（client-side locking）。例如，考虑 `Vector` 类，它是一个方法都经过同步的列表。现在假设我们在\
  \ `Vector<Double>` 中存储银行余额。以下是 `transfer` 方法的一个朴素实现：\n\n点击查看代码图片\n\n```\npublic\
  \ void transfer(Vector<Double> accounts, int from, int to, int amount) // 错误\n{\n\
  \   accounts.set(from, accounts.get(from) - amount);\n   accounts.set(to, accounts.get(to)\
  \ + amount);\n   System.out.println(. . .);\n}\n```\n\n`Vector` 类的 `get` 和 `set`\
  \ 方法是同步的，但这对我们没有帮助。线程完全可能在 `transfer` 方法中完成第一次 `get` 调用后后被抢占。另一个线程随后可能会在相同的位置存储一个不同的值。然而，我们可以劫持锁：\n\
  \n点击查看代码图片\n\n```\npublic void transfer(Vector<Double> accounts, int from, int to,\
  \ int amount)\n{\n   synchronized (accounts)\n   {\n      accounts.set(from, accounts.get(from)\
  \ - amount);\n      accounts.set(to, accounts.get(to) + amount);\n   }\n   System.out.println(.\
  \ . .);\n}\n```\n\n这种方法有效，但它完全依赖于 `Vector` 类对其所有修改器方法都使用内生锁。然而，这真的是事实吗？`Vector`\
  \ 类的文档并没有这样的承诺。你必须仔细研究源代码。\n\n![Images](img/note.jpg) 注意\n\n虚拟机对同步方法有内置支持。然而，同步块被编译成一系列字节码以管理内生锁。\n\
  \n#### 12.4.7 监控概念 (The Monitor Concept)\n\n锁和条件是线程同步的强大工具，但它们不是面向对象的。多年来，研究人员一直在寻找让多线程变得安全的方法而无需强制程序员考虑显式锁。最成功的解决方案之一是由\
  \ Brinch Hansen 和 Tony Hoare 在 70 年代开创的监控（monitor）概念。在 Java 术语中，监控器具有以下属性：\n\n*\
  \ 监控器只有一个私有字段的类。\n* 该类的每个对象都有一个关联的锁。\n* 所有方法都由该锁锁定。也就是说，如果客户端调用 `obj.method()`，则\
  \ `obj` 的锁会在方法开始时自动获取，并在方法返回时释放。由于所有字段都是私有的，这种安排确保了当一个线程操作字段时，另一个线程无法访问它们。\n* 锁可以有任意数量的关联条件。\n\
  \n早期版本的监控器只有一个条件，语法非常优雅。你只需调用 `await accounts[from] >= amount` 而无需使用显式的条件变量。然而，研究表明，盲目地重新测试条件效率很低。这个问题通过显式的条件变量得到了解决，每个条件变量管理一组线程。\n\
  \nJava 设计者松地借鉴了监控器概念。Java 中的每个对象都有一个内生锁和一个内生条件。如果一个方法声明为 `synchronized` 关键字，它就像一个监控方法。通过调用\
  \ `wait`/`notifyAll`/`notify` 访问条件变量。\n\n然而，Java 对象与监控器有三个重要的区别，这损害了线程安全：\n\n* 字段不强制为为\
  \ `private`。\n* 方法不强制为 `synchronized`。\n* 内生锁对客户端可见。\n\n这种对安全的无视让 Per Brinch Hansen\
  \ 非常愤怒。在对 Java 多线程原语的严厉评论中，他写道：“令我惊讶的是，在监控器和并发 Pascal 发明四世纪后，Java 的不安全并行竟然被编程社区认真对待。它毫无价值”（Java’s\
  \ Insecure Parallelism, ACM SIGPLAN Notices 34:38–45, 1999 年 4 月）。\n\n\n\n\n\n-\
  \   编译器可以重新排序指令以实现最大吞吐量。编译器不会选择改变代码含义的排序，但它们假设只有在代码中存在显指令时，内存值才会发生变化。然而，内存值可能会被另一个线程更改！\n\
  \n如果你使用锁（locks）来保护被多个线程访问的代码，你就不会遇到这些问题。编译器被要求在需要时刷新本地缓存并且不恰当地重排指令，以尊重锁。细节在 JSR\
  \ `133` 开发的《Java 内存模型》和《线程规范》中进行了解释（参见 [`www.jcp.org/en/jsr/detail?id=133`](http://www.jcp.org/en/jsr/detail?id=133)）。该规范的大部分内容非常复杂且具有技术性，但该文档也包含许多解释清晰的示例。Brian\
  \ Goetz 编写的一篇更易于理解的概述文章可以在 [`www.ibm.com/developerworks/library/j-jtp02244`](http://www.ibm.com/developerworks/library/j-jtp02244)\
  \ 中找到。\n\n![Images](img/note.jpg) 注意\n\nBrian Goetz 创造了以下“同步格言”：“如果你写入的变量接下来可能被另一个线程读取，或者你读取的变量可能最近被另一个线程写入过，那么你必须使用同步。”\n\
  \n`volatile` 关键字为同步实例字段的访问提供了一种无锁机制。如果你将字段声明为 `volatile`，那么编译器和虚拟机就会考虑到该字段可能会被另一个线程并发更新。\n\
  \n例如，假设一个对象有一个 `boolean` 标志 `done`，它由一个线程设置并由另一个线程查询。正如我们讨论过的，你可以使用锁：\n\n点击此处查看代码图像\n\
  \n```\nprivate boolean done;\npublic synchronized boolean isDone() { return done;\
  \ }\npublic synchronized void setDone() { done = true; }\n```\n\n使用对象内置锁（intrinsic\
  \ object lock）可能不是一个好主意。如果另一个线程锁定了对象，`isDone` 和 `setDone` 方法可能会被阻塞。如果担心这个问题，可以使用专门针对该变量的独立锁。但这会变得非常麻烦。\n\
  \n在这种情况下，将字段声明为 `volatile` 是理性的：\n\n点击此处查看代码图像\n\n```\nprivate volatile boolean\
  \ done;\npublic boolean isDone() { return done; }\npublic void setDone() { done\
  \ = true; }\n```\n\n编译器将插入适当的代码，以确保一个线程中 `done` 变量的更改对于读取该变量的任何其他线程都是可见的。\n\n![Images](img/caution.jpg)\
  \ 注意\n\nVolatile 变量不提供任何原子性。例如，该方法\n\n点击此处查看代码图像\n\n```\npublic void flipDone()\
  \ { done = !done; } // 不是原子的\n```\n\n该方法不能保证能翻转字段的值。无法保证读取、翻转和写入的过程是不中断的。\n\n###\
  \ 12.4.9 Final 变量\n\n正如你在上一节中看到的，除非使用锁或 `volatile` 修饰符，否则你无法从多个线程中安全地读取字段。\n\n访问共享字段还有另一种安全情况——当它被声明为\
  \ `final` 时。考虑\n\n点击此处查看代码图像\n\n```\nfinal var accounts = new HashMap<String, Double>();\n\
  ```\n\n其他线程在构造函数完成后可以看到 `accounts` 变量。\n\n如果不使用 `final`，无法保证其他线程能看到 `accounts` 的更新后的值——它们可能都只看到\
  \ `null`，而不是构造好的 `HashMap`。\n\n当然，在 map 上的操作不是线程安全的。如果多个线程变异并读取 map，你仍然需要同步。\n\n\
  ### 12.4.10 原子类 (Atomics)\n\n只要你只执行赋值以外的操作，你就可以将共享变量声明为 `volatile`。\n\n`java.util.concurrent.atomic`\
  \ 包中有一许多类，它们使用高效的机器级指令来保证其他操作的原子性，而无需使用锁。例如，`AtomicInteger` 类具有 `incrementAndGet`\
  \ 和 `decrementAndGet` 方法，可以以原子方式增加或减少一个整数。例如，你可以安全地生成如下所示的数字序列：\n\n点击此处查看代码图像\n\n\
  ```\npublic static AtomicLong nextNumber = new AtomicLong();\n// 在某些线程中 . . .\n\
  long id = nextNumber.incrementAndGet();\n```\n\n`incrementAndGet` 方法原子地增加 `AtomicLong`\
  \ 并返回自增后的值。也就是说，获取值、加 1、设置值和产生新值的操作是无法中断的。即使多个线程并发访问同一个实例，也能保证计算并返回正确的值。\n\n虽然有方法可以原子性地设置、增加和减去值，但如果你想进行更更复杂的更新，就必须使用\
  \ `compareAndSet` 方法。例如，假设你想跟踪不同线程观察到的最大值。以下代码将不起作用：\n\n点击此处查看代码图像\n\n```\npublic\
  \ static AtomicLong largest = new AtomicLong();\n// 在某些线程中 . . .\nlargest.set(Math.max(largest.get(),\
  \ observed)); // 错误--竞态条件！\n```\n\n这种更新不是原子的。相反，请提供一个 lambda 表达式来更新变量，更新将由为你完成。在我们的示例中，我们可以调用\n\
  \n点击此处查看代码图像\n\n```\nlargest.updateAndGet(x -> Math.max(x, observed));\n```\n\n\
  或者\n\n点击此处查看代码图像\n\n```\nlargest.accumulateAndGet(observed, Math::max);\n```\n\n\
  `accumulateAndGet` 方法接收一个二元运算符，用于结合原子值和提供的参数。\n\n还有返回旧值的 `getAndUpdate` 和 `getAndAccumulate`\
  \ 方法。\n\n![Images](img/note.jpg) 注意\n\n这些方法也提供了 `AtomicInteger`、`AtomicIntegerArray`、`AtomicIntegerFieldUpdater`、`AtomicLongArray`、`AtomicLongFieldUpdater`、`AtomicReference`、`AtomicReferenceArray`\
  \ 以及 `AtomicReferenceFieldUpdater` 类。当大量的线程访问同一个原子值时，性能会下降，因为乐观更新需要太多的重试。`LongAdder`\
  \ 和 `LongAccumulator` 类解决了这个问题。`LongAdder` 由多个变量组成，其总和为当前值。多个线程可以更新不同的分量，当线程数量增加时会自动提供新的分量。在所有工作完成后才需要总值的常见情况下，这是非常高效的。性能提升可能是巨大的。\n\
  \n如果你预见到高竞争，应该直接使用 `LongAdder` 而不是 `AtomicLong`。方法名称略有不同。调用 `increment` 增加计数器或调用\
  \ `add` 增加数量，并调用 `sum` 获取总和。\n\n点击此处查看代码图像\n\n```\nvar adder = new LongAdder();\n\
  for (. . .)\n   pool.submit(() ->\n      {\n         while (. . .)\n         {\n\
  \            . . .\n            if (. . .) adder.increment();\n         }\n    \
  \  });\n. . .\nlong total = adder.sum();\n```\n\n![Images](img/note.jpg) 注意\n\n\
  当然，`increment` 方法*不*返回旧值。这样做会消除将总和拆分为多个分量带来的效率收益。\n\n`LongAccumulator` 将此想法推广到任意的累加操作。在构造函数中，你提供该操作以及它的中元元素。要合并新值，调用\
  \ `accumulate`。调用 `get` 获取当前值。以下代码与 `LongAdder` 效果相同：\n\n\n\n\n\n```\nvar adder\
  \ = new LongAccumulator(Long::sum, 0);\n// 在某个线程中 . . .\nadder.accumulate(value);\n\
  ```\n\n内部，累加器拥有变量 `a[1]`、`a[2]`、. . . `a[n]`。每个变量都初始化为中性元素（在示例中为 `0`）。\n\n当调用 `accumulate`\
  \ 并传入值 `v` 时，其中一个变量会被原子地更新为 `a[i] = a[i] op v`，其中 `op` 是以后缀形式表示的累加操作。在我们的示例中，调用\
  \ `accumulate` 会对某个 `i` 计算 `a[i] = a[i] + v`。\n\n`get` 的结果是 `a[1] op a[2] op` .\
  \ . . `op a[n]`。在我们的示例中，这就是累加器的总和，`a[1] + a[2] + . . . + a[n]`。\n\n如果你选择不同的操作，可以计算最大值或最小值。通常情况下，操作必须满足结合律和交换律。这意味着最终结果必须与中间值组合的顺序无关。\n\
  \n还有 `DoubleAdder` 和 `DoubleAccumulator`，它们的工作方式相同，只是处理 `double` 类型的值。\n\n### 12.4.11\
  \ 死锁\n\n锁和条件无法解决多线程中可能出现的所有问题。考虑以下情况：\n\n1. 账户 1：$200\n2. 账户 2：$300\n3. 线程 1：从账户\
  \ 1 向账户 2 转账 $300\n4. 线程 2：从账户 2 向账户 1 转账 $400\n\n如图 12.4 所示，线程 1 和 2 显然被阻塞了。它们都无法继续，因为账户\
  \ 1 和账户 2 的余额不足。\n\n![Images](img/12fig04.jpg)\n\n**图 12.4** 死锁状况\n\n所有线程都可能被阻塞，因为每个线程都在等待更多的钱。这种情况被称为`deadlock`。\n\
  \n在我们的程序中，由于一个简单的原因不会发生死锁。每个转账金额最多为 $1,000。由于有 100 个账户且总金额为 $100,000，任何时候至少有一个账户拥有至少\
  \ $1,000。因此，从该账户取出资金的线程可以继续执行。\n\n但如果你修改线程的 `run` 方法以移除 $1,000 的转账限制，死锁会很快发生。尝试一下：将\
  \ `NACCOUNTS` 设置为 `10`。构造每个转账可执行对象，其 `max` 值为 `2 * INITIAL_BALANCE` 并运行程序。程序将运行一段时间，然后挂起。\n\
  \n![Images](img/tip.jpg) 提示\n\n当程序挂起时，按下 Ctrl+\\。你将得到一个列出所有线程的线程转储。每个线程都有堆栈跟踪，告诉你它目前阻塞在何处。或者，可以如第\
  \ 7 章 所示运行 `jconsole`，并查看 Threads 面板（参见图 12.5）。\n\n![Images](img/12fig05.jpg)\n\n\
  **图 12.5** jconsole 中的 Threads 面板\n\n创建死角的另一种方法是让第 `i` 个线程负责向第 `i` 个账户存款，而不是从第 `i`\
  \ 个账户取款。在这种情况下，所有线程可能会围攻同一个账户，每个线程都试图取出超过其余额的钱。尝试一下：在 `SynchBankTest` 程序中，找到 `TransferRunnable`\
  \ 类的 `run` 方法。在调用 `transfer` 时，交换 `fromAccount` 和 `toAccount`。运行程序观察它是如何立即死锁的。\n\
  \n另一个容易发生死锁的情况是：在 `SynchBankTest` 程序中将 `signalAll` 方法改为 `signal`。你会发现程序最终会挂起。（再次将\
  \ `NACCOUNTS` 设置为 `10` 以更快地观察到效果。）与 `signalAll` 通知所有等待资金增加的线程不同，`signal` 方法只解除一个线程。如果该线程无法继续，所有线程都可能被阻塞。考虑以下正在形成死锁的示例场景：\n\
  \n1. 账户 1：$1,990\n2. 所有其他账户：每个 $990\n3. 线程 1：从账户 1 向账户 2 转账 $995\n4. 所有其他线程：从它们的账户向另一个账户转账\
  \ $995\n\n显然，除线程 1 以外的所有线程都被阻塞了，因为它们的账户余额不足。\n\n线程 1 继续执行。之后，我们处于以下情况：\n\n1. 账户\
  \ 1：$995\n2. 账户 2：$1,985\n3. 所有其他账户：每个 $990\n\n然后，线程 1 调用 `signal`。`signal` 方法随机选择一个线程解除阻塞。假设它选择了线程\
  \ 3。该线程被唤醒，发现账户中资金不足，再次调用 `await`。但线程 1 仍在运行。产生了一个新的随机交易，例如线程 1：从账户 1 向 2 转账 $997。现在，线程\
  \ 1 调用 `await`，所有线程都被阻塞了。这里的罪祸首是对 `signal` 的调用。\n\n### 12.4.12 为什么 stop 和 suspend\
  \ 方法被弃\n\n先来看 `stop` 方法。它会终止所有方法，包括 `run` 方法。当线程被停止时，它会立即释放持有的锁。这可能导致对象处于不一致状态。例如，假设\
  \ `TransferRunnable` 在从一个账户移动资金到另一个账户的取款后存款之前被停止了。现在银行对象损坏了。由于锁已被释放，其他线程可以观察到这种损坏。\n\
  \n当一个线程想要停止另一个线程时，它不知道 `stop` 方法何时安全，何时会导致损坏。因此，该方法被弃用。当你想要停止一个线程时，应该中断它。被中断的线程可以在安全时停止。\n\
  \n![Images](img/note.jpg) 注意\n\n接下来来看看 `suspend` 方法的问题在哪里。与 `stop` 不同，`suspend`\
  \ 不损坏对象。但是，如果你挂起了一个拥有锁的线程，那么在 true 线程恢复之前，该锁是不可用的。如果调用 `suspend` 方法的线程尝试获取同一个锁，程序就会死锁：这种情况在图形用户界面中非常常见。假设我们有一个银行的图形模拟。标记为“暂停”的按钮挂起转账线程，标记为“恢复”的按钮恢复它们。\n\
  \n点击此处查看代码图像\n\n```\npauseButton.addActionListener(event ->\n   {\n      for (int\
  \ i = 0; i < threads.length; i++)\n         threads[i].suspend(); // 不要这样做\n   });\n\
  \nresumeButton.addActionListener(event ->\n   {\n      for (int i = 0; i < threads.length;\
  \ i++)\n         threads[i].resume();\n   });\n```\n\n\n\n\n\n假设一个 `paintComponent`\
  \ 方法绘制每个账户的图表，并调用 `getBalances` 方法来获取余额数组。\n\n正如你在第 12.7.3 节以及第 839 页 看到的“用户界面回调中的长时间任务”所示，按钮操作和重绘都发生在同一个线程中，即事件分发线程。考虑以下场景：\n\
  \n1. 其中一个传输线程获取了 `bank` 对象的锁。\n2. 用户点击暂停按钮。\n3. 所有传输线程都被挂起；其中一个线程仍然持有 `bank` 对象的锁。\n\
  4. 出某些原因，账户图表需要重绘。\n5. `paintComponent` 方法调用 `getBalances` 方法。\n6. 该方法尝试获取 `bank`\
  \ 对象的锁。\n\n现在程序冻结了。\n\n事件分发线程无法继续，因为锁被其中一个挂起的线程占用。因此，用户无法点击恢复按钮，线程也永远不会恢复。\n\n如果你想安全地挂起线程，可以引入一个变量\
  \ `suspendRequested` 并在 `run` 方法的安全位置对其进行测试——在一个线程没有锁定其他线程所需的对象的地方。当你的线程发现 `suspendRequested`\
  \ 变量被设置时，它应该一直等待，直到它再次可用。\n\n#### 12.4.13 需需初始化\n\n有时，你有一个数据结构只想在第一次需要它时才进行初始化。并且你想确保初始化只发生一次。与其设计自己的机制，不如利用虚拟机在类第一次被使用时恰好执行一次静态初始化器的特性。虚拟机通过锁来确保这一点，所以你不需要编写自己的锁。\n\
  \n点击此处查看代码图像\n\n```\npublic class OnDemandData\n{\n   // 私有构造函数以确保只构造一个对象\n   private\
  \ OnDemandData()\n   {\n      . . .\n   }\n\n   public static OnDemandData getInstance()\n\
  \   {\n      return Holder.INSTANCE;\n   }\n\n   // 仅在第一次使用时初始化，即在第一次调用 getInstance\
  \ 时\n   private static Holder\n   {\n      // VM 保证此最多发生一次\n      static final OnDemandData\
  \ INSTANCE = new OnDemandData();\n   }\n}\n```\n\n![Images](img/caution.jpg) 注意\n\
  \n要使用这种写法，你必须确保构造函数不会抛出任何异常。虚拟机不会再次尝试初始化内部类。\n\n### 12.4.14 线程局部变量\n\n在前面的章节中，我们讨论了线程之间共享变量的风险。有时，你可以通过\
  \ `ThreadLocal` 辅助类为每个线程提供自己的实例来避免共享。例如，`SimpleDateFormat` 类不是线程安全的。假设我们有一个静态变量\n\
  \n点击此处查看代码图像\n\n```\npublic static final SimpleDateFormat dateFormat = new SimpleDateFormat(\"\
  yyyy-MM-dd\");\n```\n\n如果两个线程执行如如下的操作：\n\n点击此处查看代码图像\n\n```\nString dateStamp =\
  \ dateFormat.format(new Date());\n```\n\n那么结果可能是错的，因为 `dateFormat` 使用的内部数据结构可能会被并发访问所损坏。你可以使用开销较大的同步机制，或者在需要时构造一个本地的\
  \ `SimpleDateFormat` 对象，但那样也是浪费。\n\n要每个线程构造一个实例，请使用以下代码：\n\n点击此处查看代码图像\n\n```\n\
  public static final ThreadLocal<SimpleDateFormat> dateFormat =\n   ThreadLocal.withInitial(()\
  \ -> new SimpleDateFormat(\"yyyy-MM-dd\"));\n```\n\n要访问实际的格式化器，调用\n\n点击此处查看代码图像\n\
  \n```\nString dateStamp = dateFormat.get().format(new Date());\n```\n\n在给定线程中第一次调用\
  \ `get` 时，会调用构造函数中的 lambda。从那时起，`get` 方法返回属于当前线程的实例。\n\n一个类似的问题是在多线程中生成随机数。`java.util.Random`\
  \ 类是线程安全的。但如果多个线程需要等待单个共享生成器，它的效率仍然很低。\n\n你可以使用 `ThreadLocal` 辅助类为每个线程提供单独的生成器，但\
  \ Java 7 为你提供了一个方便类。只需进行如下调用：\n\n点击此处查看代码图像\n\n```\nint random = ThreadLocalRandom.current().nextInt(upperBound);\n\
  ```\n\n调用 `ThreadLocalRandom.current()` 返回一个对当前线程唯一的随机数生成器实例。\n\n线程局部变量有时也用于让所有协作任务的方法可以使用对象，而无需将对象从一个调用者传递给另一个调用者。例如，假设你想共享数据库连接。声明一个变量\n\
  \n点击此处查看代码图像\n\n```\npublic static final ThreadLocal<Connection> connection =\n\
  \   ThreadLocal.withInitial(() -> null);\n```\n\n当任务开始时，初始化连接：\n\n点击此处查看代码图像\n\n\
  ```\nconnection.set(connect(url, password));\n```\n\n任务调用某些方法，所有调用都在同一个线程内，最终其中一个方法需要：\n\
  \n点击此处查看代码图像\n\n```\nvar result = connection.get().executeQuery(query);\n```\n\n\
  注意，相同的调用可能会在多个线程上发生。每个线程都会获得自己的对象。\n\n![Images](img/caution.jpg) 注意\n\n在前面的示例中，任务使用线程是至关重要的。当在线程池中执行任务时，你不希望将数据库连接对共享同一线程的其他任务可用。\n\
  \n\n\n\n\n许多线程问题可以通过使用一个或多个队列来优雅且安全地建模。生产者线程将项插入队列，消费者线程从队列中检索它们。队列允许你安全地将数据从一个线程传递给另一个线程。例如，考虑我们的银行转账程序。转账线程不再直接访问银行对象，而是将转账指令对象插入队列。另一个线程从队列中取出指令并执行转账。只有该线程可以访问银行对象的内部结构。这不需要任何同步。（当然，线程安全队列类的实现者必须担心锁和条件，但那是他们的问题，不是你的问题。）\n\
  \n`blocking queue`（阻塞队列）当你尝试在队列满时添加元素元素，或在队列为空时尝试移除元素时，会导致线程阻塞。阻塞队列是协调多个线程工作的有用工具。工作线程可以定期将中间结果存入阻塞队列。其他工作线程移除这些中间结果并对其进行进一步修改。队列会自动平衡工作负载。如果第一组线程的运行速度比第二组慢，第二组将阻塞等待结果；如果第一组线程的运行速度快，队列将一直填满，直到第二组追上来。表\
  \ 12.1 显示了阻塞队列的方法。\n\n### 表 12.1 阻塞队列方法\n\n| 方法 | 正常操作 | 特殊情况下的操作 |\n| --- | ---\
  \ | --- |\n| `add` | 添加元素 | 如果队列满了则抛出 `IllegalStateException` |\n| `element` | 返回头部元素\
  \ | 如果队列为空则抛出 `NoSuchElementException` |\n| `offer` | 添加元素并返回 `true` | 如果队列满了则返回\
  \ `false` |\n| `peek` | 返回头部元素 | 如果队列为空则返回 `null` |\n| `poll` | 移除并返回头部元素 | 如果队列为空则返回\
  \ `null` |\n| `put` | 添加元素 | 如果队列满了则阻塞 |\n| `remove` | 移除并返回头部元素 | 如果队列为空则抛出 `NoSuchElementException`\
  \ |\n| `take` | 移除并返回头部元素 | 如果队列为空则阻塞 |\n\n阻塞队列方法可以分为三类，其区别在于当队列满或空时所执行的操作。如果你将队列作为线程管理工具，请使用\
  \ `put` 和 `take` 方法。当你尝试向满队列添加元素或获取空队列的头部时，`add`、`remove` 和 `element` 操作会抛出异常。当然，在多线程程序中，队列可能随时变满或变空，因此你可能更想使用\
  \ `offer`、`poll` 和 `peek` 方法。这些方法在无法执行任务时会直接返回一个失败指示，而不是抛出异常。\n\n![Images](img/note.jpg)\
  \ 注意\n\n`poll` 和 `peek` 方法返回 `null` 来表示失败。因此，向这些队列中插入 `null` 值是非允许的。\n\n还有带有超时 `offer`\
  \ 和 `poll` 方法变体。例如，以下调用\n\n点击此处查看代码图像\n\n```\nboolean success = q.offer(x, 100,\
  \ TimeUnit.MILLISECONDS);\n```\n\n该调用尝试在 100 毫秒内向队列尾插入一个元素。如果成功，它返回 `true`；否则，在超时后返回\
  \ `false`。同样，以下调用\n\n点击此处查看代码图像\n\n```\nObject head = q.poll(100, TimeUnit.MILLISECONDS);\n\
  ```\n\n该调用尝试在 100 毫秒内移除队列头部。如果成功，它返回头部元素；否则，在超时后返回 `null`。\n\n`put` 方法在队列满时阻塞，而\
  \ `take` 方法在队列为空时阻塞。这些是不带超时的 `offer` 和 `poll` 的等效操作。\n\n`java.util.concurrent` 包提供了多种阻塞队列的变体。默认情况下，`LinkedBlockingQueue`\
  \ 的容量没有上限，但可以可选指定最大容量。`LinkedBlockingDeque` 是双端版本的。`ArrayBlockingQueue` 使用给定的容量和一个可选的公平性参数进行构造。如果指定了公平性，则等待最长的线程将获得优先对待。一如既往，公平性会带来巨大的性能代价，只有当你的问题特别需要时才使用它。\n\
  \n`PriorityBlockingQueue` 是优先级队列，而不是先进先出队列。元素按照优先级顺序移除。队列具有无界容量，但如果队列为空，检索将阻塞。（有关优先级队列的更多信息，请参阅第\
  \ 9 章。）\n\n`DelayQueue` 包含实现了 `Delayed` 接口的对象：\n\n点击此处查看代码图像\n\n```\ninterface Delayed\
  \ extends Comparable<Delayed>\n{\n   long getDelay(TimeUnit unit);\n}\n```\n\n`getDelay`\
  \ 方法返回对象的剩余延迟。负值表示延迟已过期。只有当元素的延迟过期后，才能从 `DelayQueue` 中移除。你还需要实现 `compareTo` 方法。`DelayQueue`\
  \ 使用该方法对条目进行排序。\n\nJava 7 添加了 `TransferQueue` 接口，允许生产者线程等待直到消费者准备好获取一个项。当生产者调用\n\
  \n```\nq.transfer(item);\n```\n\n该调用会阻塞，直到另一个线程将其移除。`LinkedTransferQueue` 类实现了此接口。\n\
  \nListing 12.6 中的程序展示了如何使用阻塞队列来控制一组线程。程序遍历目录及其子目录中的所有文件，打印包含给定关键字的行。\n\n生产者线程枚举所有子目录中的所有文件并将它们放入阻塞队列中。此操作非常快，如果队列没有边界，它将迅速填满。\n\
  \n我们还启动大量的搜索线程。每个搜索线程从队列中获取一个文件，打开它，打印包含关键字的所有行，然后获取下一个文件。我们使用了一种技巧在不再需要进一步工作时终止应用程序。为了信号完成，枚举线程向队列中放入一个虚拟对象。（这类似于行李提取带上贴有“最后一件行李”标签的虚拟箱。）当搜索线程取出虚拟对象时，它将其放回并终止。\n\
  \n注意，不需要显式的线程同步。在该应用程序中，我们使用队列数据结构作为同步机制。\n\n\n\n\n\n```java\n 1  package blockingQueue;\n\
  \ 2\n 3  import java.io.*;\n 4  import java.nio.charset.*;\n 5  import java.nio.file.*;\n\
  \ 6  import java.util.*;\n 7  import java.util.concurrent.*;\n 8  import java.util.stream.*;\n\
  \ 9\n10  /**\n11   * @version 1.03 2018-03-17\n12   * @author Cay Horstmann\n13\
  \   */\n14  public class BlockingQueueTest\n15  {\n16     private static final int\
  \ FILE_QUEUE_SIZE = 10;\n17     private static final int SEARCH_THREADS = 100;\n\
  18     private static final Path DUMMY = Path.of(\"\");\n19     private static BlockingQueue<Path>\
  \ queue = new ArrayBlockingQueue<>(FILE_QUEUE_SIZE);\n20\n21     public static void\
  \ main(String[] args)\n22     {\n23           try (var in = new Scanner(System.in))\n\
  24        {\n25           System.out.print(\"Enter base directory (e.g. /opt/jdk-11-src):\
  \ \");\n26           String directory = in.nextLine();\n27           System.out.print(\"\
  Enter keyword (e.g. volatile): \");\n28           String keyword = in.nextLine();\n\
  29\n30           Runnable enumerator = () ->\n31              {\n32            \
  \     try\n33                 {\n34                    enumerate(Path.of(directory));\n\
  35                    queue.put(DUMMY);\n36                 }\n37              \
  \   catch (IOException e)\n38                 {\n39                    e.printStackTrace();\n\
  40                 }\n41                 catch (InterruptedException e)\n42    \
  \             {\n43                 }\n44              };\n45\n46           new\
  \ Thread(enumerator).start();\n47           for (int i = 1; i <= SEARCH_THREADS;\
  \ i++)\n48           {\n49              Runnable searcher = () ->\n50          \
  \       {\n51                    try\n52                    {\n53              \
  \         boolean done = false;\n54                       while (!done)\n55    \
  \                   {\n56                          Path file = queue.take();\n57\
  \                          if (file == DUMMY)\n58                       {\n59  \
