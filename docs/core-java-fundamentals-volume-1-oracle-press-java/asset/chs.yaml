  \ 的有限精度（6-7 位有效数字）在许多情况下是不够的。只有当你使用的库需要它们时，或者当你需要存储大量的此类数字时，才使用 `float` 值。\n`float`\
  \ 类型的数字有后缀 `F` 或 `f`（例如，`3.14F`）。不带 `F` 后缀的浮点数（如 `3.14`）始终被视为 `double` 类型。你可以选择性地提供\
  \ `D` 或 `d` 后缀（例如，`3.14D`）。\n`E` 或 `e` 表示十进制指数。例如，`1.729E3` 等于 `1729`。\n![Images](img/note.jpg)\
  \ 注意\n你可以用十六进制指定浮点字面量。例如，0.125 = 2^(–3) 可以写为 `0x1.0p-3`。在十六进制表示中，你使用 `p` 而不是 `e`\
