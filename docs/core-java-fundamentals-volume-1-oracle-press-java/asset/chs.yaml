  \n使用线程的原因之一是为了让程序具有响应性。这在带有用户界面的应用程序中尤为重要。当程序需要执行耗时操作时，你不能在用户界面线程中执行它，否则用户界面将会冻结。相反，你应该启动另一个线程。例如，如果你想在用户点击按钮时读取文件，请不要这样做：\n\
  \n点击此处查看代码图片\n\n```\nvar open = new JButton(\"Open\");\nopen.addActionListener(event\
  \ ->\n   { // BAD--耗时操作在 UI 线程上执行\n      var in = new Scanner(file);\n      while\
  \ (in.hasNextLine())\n      {\n         String line = in.nextLine();\n         .\
  \ . .\n      }\n   });\n```\n\n相反，在单独线程中执行工作。\n\n点击此处查看代码图片\n\n```\nopen.addActionListener(event\
  \ ->\n   { // GOOD--耗时操作在单独线程中\n      Runnable task = () ->\n         {\n      \
  \      var in = new Scanner(file);\n            while (in.hasNextLine())\n     \
  \       {\n               String line = in.nextLine();\n               . . .\n \
  \           }\n         };\n      executor.execute(task);\n   });\n```\n\n然而，你不能从执行耗时任务的线程线程直接更新用户界面。Swing、JavaFX\
  \ 或 Android 等用户界面不是线程安全的。你不能从多个线程中操作用户界面元素，否则它们面临损坏的风险。事实上，JavaFX 和 Android 会检查这一点，如果你从\
  \ UI 线程以外的线程访问用户界面，它们会抛出异常。\n\n因此，你需要将任何 UI 更新调度在 UI 线程上执行。每个用户界面库都提供某种机制来将 `Runnable`\
  \ 调度到 UI 线程上执行。例如，在 Swing 中，你调用\n\n\n\n点击此处查看代码图像\n\n```\nEventQueue.invokeLater(()\
  \ -> label.setText(percentage + \"% complete\"));\n```\n\n在工作线程中实现用户反馈是非常繁琐的，因此每个用户界面库都提供了某种辅助类来管理这些细节，例如\
  \ Swing 中的 `SwingWorker`、JavaFX 中的 `Task`以及 Android 中的 `AsyncTask`。你为长耗时任务（在单独线程上运行）指定操作，并为进度更新和最终处理（在\
  \ UI 线程上运行）指定操作。\n\n列表 12.11）。每读完一行，状态栏中的行计数器就会更新一次。读取过程完成后，“打开”菜单项重新启用，“取消”项被禁用，状态行文本设置为“完成”（Done）。\n\
  \n![Images](img/12fig06.jpg)\n\n**图 12.6** 在单独线程中加载文件\n\n此示例展示了后台任务的典型 UI 活动：\n\n\
  *   在每个工作单元之后，更新 UI 以显示进度。\n*   在工作完成后，对 UI 进行最终更改。\n\n`SwingWorker` 类使得实现此类任务变得简单而许多。重写\
  \ `doInBackground` 方法来执行耗时工作，并偶尔调用 `publish` 来通信工作进度。该方法在工作线程中执行。`publish` 方法会导致在事件分发线程中执行\
  \ `process` 方法以处理进度数据。工作完成后，事件分发线程会调用 `done` 方法，以便你可以完成对 UI 的更新。\n\n每当你想在工作线程中执行某些工作时，都构造一个新的工作实例。（每个工作对象旨在只使用一次。）然后调用\
  \ `execute` 方法。你通常会在事件分发线程上调用 `execute`，但这不是强制要求的。\n\n假设工作线程会产生某种结果；因此，`SwingWorker<T,\
  \ V>` 实现了 `Future<T>`。此结果可以通过 `Future` 接口的 `get` 方法获取。由于 `get` 方法会阻塞直到结果可用，因此你不希望在调用\
  \ `execute` 之后立即调用它。只有在你知道工作已完成时才调用它是一个好主意。通常，你在 `done` 方法中调用 `get`。（并没有要求调用 `get`。有时，处理进度数据就是你需要的。）\n\
  \n中间进度数据和最终结果都可以是任意类型。`SwingWorker` 类将这些类型作为类型参数。`SwingWorker<T, V>` 类型为 `T` 的结果和类型为\
  \ `V` 的进度数据。\n\n要取消正在进行的工作，使用 `Future` 接口的 `cancel` 方法。当工作被取消时，`get` 方法会抛出 `CancellationException`。\n\
  \n如所述，工作线程对 `publish` 的调用会导致在事件分发线程上对 `process` 的调用。为了效率，多次调用 `publish` 的结果可能会合并在单次\
  \ `process` 调用中。`process` 方法接收一个包含所有中间结果的 `List<V>`。\n\n让我们利用此机制来读取文本文件。事实证明，`JTextArea`\
  \ 是相当慢的。从长文本文件（例如*基督山伯爵*的所有行）中追加行需要大量时间。\n\n为了向用户显示正在处理进度，我们希望在状态行中显示已读取的行数。因此，进度数据由当前行号和当前行文本组成。我们将这些封装进一个简单的内部类中：\n\
  \n```\nprivate class ProgressData\n{\n   public int number;\n   public String line;\n\
  }\n```\n\n最终结果是读取到 `StringBuilder` 中的文本。因此，我们需要一个 `SwingWorker<StringBuilder, ProgressData>`。\n\
  \n在 `doInBackground` 方法中，我们逐行读取文件。每读完一行，我们都调用 `publish` 来发布行号和当前行的文本。\n\n点击此处查看代码图像\n\
  \n```java\n@Override public StringBuilder doInBackground() throws IOException, InterruptedException\n\
  {\n   int lineNumber = 0;\n   var in = new Scanner(new FileInputStream(file), StandardCharsets.UTF_8);\n\
  \   while (in.hasNextLine())\n   {\n      String line = in.nextLine();\n      lineNumber++;\n\
  \      text.append(line).append(\"\\n\");\n      var data = new ProgressData();\n\
  \      data.number = lineNumber;\n      data.line = line;\n      publish(data);\n\
  \      Thread.sleep(1); // 为了测试取消；在你的程序中不需要这样做\n   }\n   return text;\n}\n```\n\n\
  我们每每行后还会睡眠一毫秒，以便你可以在不感到压力的情况下测试取消，但你不会希望通过睡眠来减慢自己的程序。如果你注释掉这一行，你会发现*基督山伯爵*加载得非常快，只有几次批处理的用户界面更新。\n\
  \n在 `process` 方法中，我们忽略除最后一行之外的所有行号，并合并所有行以对文本区域进行单更新。\n\n点击此处查看代码图像\n\n```java\n\
  @Override public void process(List<ProgressData> data)\n{\n   if (isCancelled())\
  \ return;\n   var b = new StringBuilder();\n   statusLine.setText(\"\" + data.get(data.size()\
  \ - 1).number);\n   for (ProgressData d : data) b.append(d.line).append(\"\\n\"\
  );\n   textArea.append(b.toString());\n}\n```\n\n在 `done` 方法中，文本区域使用完整文本进行更新，并禁用“取消”菜单项。\n\
  \n注意在“打开”菜单项的事件监听器中是如何启动工作的。\n\n这种简单的技术允许你在执行耗时任务的同时保持用户界面的响应性。\n\n**列表 12.11**\
