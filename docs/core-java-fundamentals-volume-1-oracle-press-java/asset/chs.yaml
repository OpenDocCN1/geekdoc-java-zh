  \n**图 11.22** 工具栏\n\n工具栏特殊之处在于你可以将其移动到其他地方。你可以将工具栏拖到框架的四个边界之一（见图 11.23）。当你松开鼠标按钮时，工具栏会落在新位置（见图\
  \ 11.24）。\n\n![Images](img/011fig23.jpg)\n\n**图 11.23** 拖动工具栏\n\n![Images](img/011fig24.jpg)\n\
  \n**图 11.24** 工具栏已拖到另一个边界\n\n![Images](img/note.jpg) 注意\n\n如果工具栏位于具有边界布局（border\
  \ layout）的容器中，或者任何支持 `North`、`East`、`South` 和 `West` 约束的布局管理器中，拖动功能都是有效的。\n\n工具栏甚至可以从框架中完全分离。分离的工具栏包含在自己的框架中（见图\
  \ 11.25）。当你关闭分离工具栏的框架时，它会回到原始框架。\n\n![Images](img/011fig25.jpg)\n\n**图 11.25** 分离工具栏\n\
  \n工具栏的编程非常简单。将组件添加到工具栏中：\n\n```\nvar toolbar = new JToolBar();\ntoolbar.add(blueButton);\n\
  ```\n\n\n\n\n`JToolBar` 类还具有一个添加 `Action` 对象的方法。只需向工具栏中填充 `Action` 对象即可，如下所示：\n\n\
  ```\ntoolbar.add(blueAction);\n```\n\n动作的小型图标会显示在工具栏中。你可以使用分隔符来区分按钮组：\n\n```\ntoolbar.addSeparator();\n\
  ```\n\n例如，图 11.22 中的工具栏在第三个和第四个按钮之间有一个分隔符。\n\n然后，将工具栏添加到框架中：\n\n点击此处查看代码图像\n\n```\n\
  add(toolbar, BorderLayout.NORTH);\n```\n\n你还可以为工具栏指定标题，当工具栏被停靠（undocked）时该标题会出现：\n\
  \n点击此处查看代码图像\n\n```\ntoolbar = new JToolBar(titleString);\n```\n\n默认情况下，工具栏初始为水平方向。若要让工具栏初始为垂直排列，请使用\n\
  \n点击此处查看代码图像\n\n```\ntoolbar = new JToolBar(SwingConstants.VERTICAL)\n```\n\n或\n\
  \n点击此处查看代码图像\n\n```\ntoolbar = new JToolBar(titleString, SwingConstants.VERTICAL)\n\
  ```\n\n按钮是工具栏内部常见的组件。但对于可以添加到工具栏的组件并没有限制。例如，你可以向工具栏添加一个组合框。\n\n### 11.5.8 提示框 (Tooltips)\n\
  \n工具栏的一个缺点是，用户往往对工具栏中微图标的含义感到困惑。为了解决这个问题，用户界面设计师发明了工具提示。当光标悬留在按钮上片刻时，就会激活工具提示。提示文本显示在颜色的矩形内。当用户移动鼠标时，工具提示就会消失。（参见图\
  \ 11.26）。\n\n![Images](img/011fig26.jpg)\n\n**图 11.26** 工具提示\n\n在 Swing 中，你只需通过调用\
  \ `setToolTipText` 方法即可为任何 `JComponent` 添加工具提示：\n\n点击此处查看代码图像\n\n```\nexitButton.setToolTipText(\"\
  Exit\");\n```\n\n或者，如果你使用 `Action` 对象，则可以将工具提示与 `SHORT_DESCRIPTION` 键关联：\n\n点击此处查看代码图像\n\
  \n```\nexitAction.putValue(Action.SHORT_DESCRIPTION, \"Exit\");\n```\n\n#### `javax.swing.JToolBar`\
  \ 1.2\n\n*   `JToolBar()`\n*   `JToolBar(String titleString)`\n*   `JToolBar(int\
  \ orientation)`\n*   `JToolBar(String titleString, int orientation)`\n    使用给定的标题字符串和方向创建一个工具栏。`orientation`\
  \ 是 `SwingConstants.HORIZONTAL`（默认值）或 `SwingConstants.VERTICAL` 之一。\n*   `JButton\
  \ add(Action a)`\n    根据给定的 action 在工具栏内部构建一个具有名称、图标、短描述和动作回调的新按钮，并将该按钮添加到工具栏末尾。\n\
  *   `void addSeparator()`\n    在工具栏末尾添加分隔符。\n\n#### `javax.swing.JComponent` 1.2\n\
  \n*   `void setToolTipText(String text)`\n    设置鼠标悬停在组件上时应作为工具提示显示的文本。\n\n### 11.6\
  \ 复杂的布局管理\n\n到目前为止，我们在示例应用程序的用户界面中仅使用了边界布局（border layout）、流布局（flow layout）和网格布局（grid\
  \ layout）。对于更复杂的任务，这些是不够的。\n\n自 Java 1.0 以来，AWT 就包含了网格布局（grid bag layout），它在行和列中布局组件。行和列的大小是灵活的，组件可以跨越多行多列。这种布局管理器非常灵活，但也非常复杂。仅仅是“grid\
  \ bag layout”这几个词就让许多 Java 程序员感到恐惧。\n\n在尝试设计一种能让程序员从网格布局暴政中解出来的布局管理器的失败尝试中，Swing\
  \ 设计者提出了框布局（box layout）。根据 `BoxLayout` 类的 JDK 文档：“嵌套多个具有不同水平和垂直组合的面板可以产生类似于 `GridBagLayout`\
  \ 的效果，而没有复杂性。”然而，由于每个框都是独立布局的，你无法使用框布局同时在水平和垂直方向上排列相邻组件。\n\nJava 1.4 出现了另一种设计网格布局替代品的尝试——弹簧布局（spring\
  \ layout），你使用虚拟的弹簧来连接容器中的组件。随着容器调整大小，弹簧会拉伸或收缩，从而调整组件的位置。这听起来既乏味又混乱，事实也如此。弹簧布局很快消失在人们视野中。\n\
  \nNetBeans IDE 结合了布局工具（称为“Matisse”）和布局管理器。用户界面设计师使用该工具将组件拖入容器，并指示哪些组件应该对齐。该工具将设计师的意图翻译成组布局管理器（group\
  \ layout manager）指令。这比手动编写布局管理代码要方便得多。\n\n在接下来的章节中，我将介绍网格布局。\n\n#### 11.6.1 网格布局\
  \ (Grid Bag Layout)\n\n网格布局是所有布局管理器的母体。你可以将网格布局想象成没有限制的网格。你可以从网格开始并根据需要合并单元格。考虑字体选择器，它包含：\n\
  \n*   用于指定字体脸和大小的组合框\n*   这两个组合框的标签\n*   选择加粗和斜体的复选框\n*   用于字符串的文本区域\n\n![Images](img/011fig27.jpg)\n\
  \n**图 11.27** 字体选择器\n\n现在，将容器划分为网格，如图 11.28\n\n**图 11.28** 设计使用的对话框\n\n按照以下步骤描述网格布局：\n\
  \n1. 创建 `GridBagLayout` 对象。你不需要告诉它网格有多少行列。相反，布局管理器将根据你之后提供的信息进行判断。\n2. 将此 `GridBagLayout`\
  \ 对象设置为组件的布局管理器。\n3. 对于每个组件，创建一个 `GridBagConstraints` 对象。设置 `GridBagConstraints`\
  \ 对象的字段值，以指定组件在网格中的布局方式。\n4. 最后，使用调用 `add(component, constraints)` 带上约束添加每个组件。\n\
  \n这是所需的代码示例。（我们将在后续章节中更详细介绍各种约束——所以如果你不知道某些约束的作用，请不要担心。）\n\n点击此处查看代码图像\n\n```\n\
  var layout = new GridBagLayout();\npanel.setLayout(layout);\nvar constraints = new\
  \ GridBagConstraints();\nconstraints.weightx = 100;\nconstraints.weighty = 100;\n\
  constraints.gridx = 0;\nconstraints.gridy = 2;\nconstraints.gridwidth = 2;\nconstraints.gridheight\
  \ = 1;\npanel.add(component, constraints);\n```\n\n技巧在于知道如何设置 `GridBagConstraints`\
  \ 对象的状态。我们将在后续章节中讨论该对象。\n\n##### 11.6.1.1 `gridx`, `gridy`, `gridwidth` 和 `gridheight`\
  \ 参数\n\n\n\n\n\n `gridx`, `gridy`, `gridwidth` 和 `gridheight` 约束定义了组件在网格中的位置。`gridx`\
  \ 和 `gridy` 值指定了要添加组件的左上角的列和行位置。`gridwidth` 和 `gridheight` 值决定了组件占据的列数和行数。\n\n网格坐标从\
  \ `0` 开始。特别是，`gridx = 0` 和 `gridy = 0` 表示左上角。我们示例中的文本区域具有 `gridx = 2`, `gridy =\
  \ 0`，因为它从第 `0` 行的第 `2` 列（即第三列）开始。它的 `gridwidth = 1` 且 `gridheight = 4`，因为它跨越了一列和四行。\n\
  \n### 11.6.1.2 权重字段 (Weight Fields)\n\n在 grid bag 布局中，你始终需要为每个区域设置 `weight` 字段（`weightx`\
  \ 和 `weighty`）。如果你将设置为 `0`，则该区域在相应方向上永远不会超出初始大小进行增长或缩小。在图 11.27 的 grid bag 布局中，我们将标签的\
  \ `weightx` 字段设置为 `0`。这允许标签在调整窗口大时保持恒定的宽度。另一方面，如果你将所有区域的权重都设置为 `0`，容器将聚集在分配区域的中心，而不是拉伸以填充该区域。\n\
  \n从概念上讲，权重参数的问题在于权重是行和列的属性，而不是单个单元格的属性。但你需要为单元格指定它们，因为 grid bag 布局并没有暴露行和列。行和列权重是通过每行或每列中单元格权重的最大值计算得。因此，如果你想让一行或一列保持固定大小，则需要将其中所有组件的权重设置为零。\n\
  \n注意，权重实际上并没有给出列的相对大小。它们告诉的是，如果容器超过了其首选大小，应该将多少比例的“空闲”空间分配给每个区域。这并不特别直观。我建议你将所有权重设置为\
  \ `100`。然后运行程序并查看布局外观。调整对话框以查看行和列如何调整。如果你发现某一行或某列不应该增长，则将其中所有组件的权重设置为零。你可以尝试其他权重值，但通常不值得费此精力。\n\
  \n### 11.6.1.3 `fill` 和 `anchor` 参数\n\n如果你不希望组件拉伸并填充整个区域，请设置 `fill` 约束。该参数有四种可能：有效值为\
  \ `GridBagConstraints.NONE`、`GridBagConstraints.HORIZONTAL`、`GridBagConstraints.VERTICAL`\
  \ 和 `GridBagConstraints.BOTH`。\n\n如果组件没有填充整个区域，你可以通过设置 `anchor` 字段来指定你希望它位于该区域的哪个位置。有效值为\
  \ `GridBagConstraints.CENTER`（默认值）、`GridBagConstraints.NORTH`、`GridBagConstraints.NORTHEAST`、`GridBagConstraints.EAST`\
  \ 等。\n\n### 11.6.1.4 填充内边距 (Padding)\n\n你可以通过设置 `GridBagConstraints` 的 `insets`\
  \ 字段在组件周围留出额外的空白空间。将 `Insets` 对象的 `left`、`top`、`right` 和 `bottom` 值设置为你想要在组件周围保留的空间量。这被称为*外部内边距*（external\
  \ padding）。\n\n`ipadx` 和 `ipady` 值设置内部内边距。这些值会被加到组件的最小宽度和高度上。这确保了组件不会缩小到最小尺寸。\n\n\
  ### 11.6.1.5 指定 `gridx`, `gridy`, `gridwidth`, 和 `gridheight` 参数的备用方法\n\nAWT 文档建议，不要将\
  \ `gridx` 和 `gridy` 值设置为绝对位置，而是将它们设置为常量 `GridBagConstraints.RELATIVE`。然后，按照标准顺序将组件添加到\
  \ grid bag 布局中，即第一行从左到右，然后移动到下一行，依此类推。\n\n你仍然可以通过提供相应的 `gridheight` 和 `gridwidth`\
  \ 字段来指定跨越的行和列数。然而，如果组件延伸到最后一行或最后一列，你不需要指定实际数字，而是使用常量 `GridBagConstraints.REMAINDER`。这告诉布局管理器该组件是该行中的最后一个。\n\
  \n这种方案似乎有效。但将实际的放置信息从布局管理器中隐藏起来并希望它能重新发现它，听起来真的很愚蠢。\n\n### 11.6.1.6 Grid Bag 布局配方\
  \ (Recipe)\n\n在实践中，以下配方可以让 grid bag 布局变得相对轻松：\n\n1. 在纸上画出组件布局。\n2. 找到一个网格，使得小型组件各包含在一个单元格中，而较大的组件跨越多个单元格。\n\
  3. 用 `0`, `1`, `2`, `3`, ... 为你的网格的行和列标记。现在你可以读出 `gridx`, `gridy`, `gridwidth` 和\
  \ `gridheight` 值了。\n4. 对于每个组件，问自己它是否需要水平或垂直填充其单元格。如果不需要，你希望它如何对齐？这决定了 `fill` 和 `anchor`\
  \ 参数。\n5. 将所有权重设置为 `100`。然而，如果你想让一行或一列保持固定大小，则将其中所有组件的权重设置为零。\n6. 编译、运行并享受。\n\n\
  ### 11.6.1.7 用于驯服 Grid Bag 约束的布局配方\n\ngrid bag 布局中最枯燥的是编写代码。我为字体示例提供了这样一个辅助类。该类具有以下功能：\n\
  \n* 它继承自 `GridBagConstraints`。\n* 它的名字很短，你可以用 `GBC` 代替 `GridBagConstraints`。\n*\
  \ 字段 `weightx`, `weighty`, `width`, `height` 有方便的 setter，它们以 `x`/`y` 对的形式出现。\n*\
  \ setter 方法返回 `this`，因此你可以对其进行链式调用。\n* `setInsets` 方法为你构造 `Insets` 对象。要获得一像素的内边距，只需调用\
  \ `1`。\n\nListing 11.7 显示了字体对话框的帧类。`GBC` 辅助类位于 Listing 11.8 中。以下是将组件添加到 grid bag\
  \ 的代码：\n\n```\nadd(faceLabel, new GBC(0, 0).setAnchor(GridBagConstraints.EAST));\n\
  add(face, new GBC(1, 0).setFill(GridBagConstraints.HORIZONTAL).setWeight(100, 0).setInsets(1));\n\
  add(sizeLabel, new GBC(0, 1).setAnchor(GridBagConstraints.EAST));\nadd(size, new\
  \ GBC(1, 1).setFill(GridBagConstraints.HORIZONTAL).setWeight(100, 0).setInsets(1));\n\
  add(bold, new GBC(0, 2, 2, 1).setAnchor(GridBagConstraints.CENTER).setWeight(100,\
  \ 100));\nadd(italic, new GBC(0, 3, 2, 1).setAnchor(GridBagConstraints.CENTER).setWeight(100,\
  \ 100));\nadd(sample, new GBC(2, 0, 1, 4).setFill(GridBagConstraints.BOTH).setWeight(100,\
  \ 100));\n```\n\n一旦你理解了 grid bag 约束，这类代码相当容易阅读和调试。\n\n**Listing 11.8** `gridbag/GBC.java`\n\
