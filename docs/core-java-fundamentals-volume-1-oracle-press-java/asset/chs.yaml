  \ @return 包含对象类名以及所有字段名和值的字符串\n17     */\n18    public String toString(Object obj)\n\
  19          throws ReflectiveOperationException\n20    {\n21       if (obj == null)\
  \ return \"null\";\n22       if (visited.contains(obj)) return \"...\";\n23    \
  \   visited.add(obj);\n24       Class cl = obj.getClass();\n25       if (cl == String.class)\
  \ return (String) obj;\n26       if (cl.isArray())\n27       {\n28         String\
  \ r = cl.getComponentType() + \"[]{\";\n29         for (int i = 0; i < Array.getLength(obj);\
  \ i++)\n30         {\n31            if (i > 0) r += \",\";\n32            Object\
  \ val = Array.get(obj, i);\n33            if (cl.getComponentType().isPrimitive())\
  \ r += val;\n34            else r += toString(val);\n35         }\n36         return\
  \ r + \"}\";\n37    }\n38\n39    String r = cl.getName();\n40    // 检查此类及所有父类的字段\n\
  41    do\n42    {\n43       r += \"[\";\n44       Field[] fields = cl.getDeclaredFields();\n\
  45       AccessibleObject.setAccessible(fields, true);\n46       // 获取所有字段的名字和值\n\
  47       for (Field f : fields)\n48       {\n49            if (!Modifier.isStatic(f.getModifiers()))\n\
  50            {\n51              if (!r.endsWith(\"[\")) r += \",\";\n52       \
  \       r += f.getName() + \"=\";\n53              Class t = f.getType();\n54  \
  \            Object val = f.get(obj);\n55              if (t.isPrimitive()) r +=\
  \ val;\n56              else r += toString(val);\n57            }\n58       }\n\
  59       r += \"]\";\n60       cl = cl.getSuperclass();\n61    }\n62    while (cl\
  \ != null);\n63\n64    return r;\n65   }\n66 }\n```\n\n### `java.lang.reflect.AccessibleObject`\
  \ **1.2**\n\n*   `void setAccessible(boolean flag)`\n    设置或清除此可访问对象的访问权限标志标记，如果访问被拒绝，则抛出\
