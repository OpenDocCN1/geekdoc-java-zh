  \ O(*n*) 时间内运行，其中 *n* 是列表的长度。\n\n* `static int frequency(Collection<?> c, Object\
  \ o)` **5**\n\n    返回 `c` 中等于对象 `o` 的元素计数。\n\n* `boolean disjoint(Collection<?>\
  \ c1, Collection<?> c2)` **5**\n\n    如果两个集合没有共同的元素，则返回 `true`。\n\n### `java.util.Collection<T>`\
  \ **1.2**\n\n* `default boolean removeIf(Predicate<? super E> filter)` **8**\n\n\
  \    删除所有匹配的元素。\n\n### `java.util.List<E>` **1.2**\n\n* `default void replaceAll(UnaryOperator<E>\
  \ op)` **8**\n\n    将操作应用到此列表的所有元素上。\n\n### 9.6.5 批量操作\n\n有几种操作可以“批量”复制或删除元素。调用\n\
  \n```\ncoll1.removeAll(coll2);\n```\n\n会从 `coll1` 中删除所有存在于 `coll2` 中的元素。相反，\n\n\
  ```\ncoll1.retainAll(coll2);\n```\n\n会从 `coll1` 中删除所有*不在* `coll2` 中的元素。这里有一个典型的应用场景。\n\
  \n假设你想找到两个集合的*交集*——即两个集合共有的元素。首先，创建一个新集合来存放结果。\n\n点击此处查看代码图片\n\n```\nvar result\
  \ = new HashSet<String>(firstSet);\n```\n\n在这里，我们利用了这样一个事实：每个集合都有构造函数，其参数是另一个持有初始化值的集合。\n\
  \n现在，使用 `retainAll` 方法：\n\n点击此处查看代码图片\n\n```\nresult.retainAll(secondSet);\n```\n\
  \n它保留了两个集合中都出现的所有元素。你无需编写循环就形成了交集。\n\n你可以进一步扩展这一想法，并将批量操作应用到*视图*（view）。例如，假设你有一个将员工\
  \ ID 映射到员工对象的 map，并且有一组所有要终止的员工 ID 集合。\n\n点击此处查看代码图片\n\n```\nMap<String, Employee>\
  \ staffMap = . . .;\nSet<String> terminatedIDs = . . .;\n```\n\n只需形成键集并删除所有已终止员工的\
  \ ID 即可。\n\n点击此处查看代码图片\n\n```\nstaffMap.keySet().removeAll(terminatedIDs);\n```\n\
  \n由于键集是映射的一个视图，键和关联员工名称会自动从映射中删除。\n\n通过使用子范围视图，你可以将批量操作限制在子列表和子集中。例如，假设你想将列表的前十个元素添加到另一个容器中。形成一个子列表来选出前十个：\n\
  \n点击此处查看代码图片\n\n```\nrelocated.addAll(staff.subList(0, 10));\n```\n\n子范围也可以作为修改操作的目标。\n\
  \n```\nstaff.subList(0, 10).clear();\n```\n\n#### 9.6.6 集合与数组之间的转换\n\nJava 平台 API\
  \ 的大部分内容是在集合框架创建之前就设计的。因此，你可能需要在传统数组和更现代的集合之间进行转换。\n\n如果你有一个需要转换为集合的数组，`List.of`\
  \ 方法可以胜任此任务。例如：\n\n点击此处查看代码图片\n\n```\nString[] names = . . .;\nList<String> staff\
  \ = List.of(names);\n```\n\n从集合获取数组要稍微复杂一点。你可以使用 `toArray` 方法：\n\n点击此处查看代码图片\n\n\
  ```\nObject[] names = staff.toArray();\n```\n\n但结果是一个*对象*（objects）数组。即使你知道你的集合包含特定类型的对象，你无法直接进行类型转换：\n\
  \n点击此处查看代码图片\n\n```\nString[] names = (String[]) staff.toArray(); // \n```\n\n`toArray`\
  \ 方法返回的数组是作为 `Object[]` 数组创建的，你无法更改其类型。相反，将数组构造表达式传递给 `toArray` 方法。返回的数组将按照*正确的数组类型*创建：\n\
  \n点击此处查看代码图片\n\n```\nString[] values = staff.toArray(String[]::new);\n```\n\n![Images](img/note.jpg)\
  \ 提示\n\n在 JDK 11 之前，你必须使用 `toArray` 方法的另一种形式，传递一个正确类型的数组：\n\n点击此处查看代码图片\n\n```\n\
  String[] values = staff.toArray(new String[0]);\n```\n\n在这种情况下，如果数组长度足够，它可以被重用：\n\
  \n点击此处查看代码图片\n\n```\nString[] values = staff.toArray(new String[staff.size()]);\n\
  ```\n\n#### 7 编写算法\n\n如果你编写自己的算法（实际上是任何以集合作为参数的方法），你应该尽可能与*接口*工作，而不是具体的实现。例如，假设你想处理项。你关心顺序吗？那么你应该接受\
  \ `List`。`Iterable` 接口有一个抽象方法 `iterator`，增强型 `for` 循环在背后使用它。`Collection` 接口继承自 `Iterable`。\n\
  \n相反，如果你的方法返回多个元素，你不希望限制自己未来的改进。例如，考虑\n\n点击此处查看代码图片\n\n```java\npublic ArrayList<Item>\
  \ lookupItems(. . .)\n{\n   var result = new ArrayList<Item>();\n   . . .\n   return\
  \ result;\n}\n```\n\n该方法返回 `ArrayList`，尽管调用者几乎不在乎它是哪种列表。如果改为返回 `List`，你可以随时通过调用\
  \ `List.of` 添加一个空列表或单例列表。\n\n![Images](img/tip.jpg) 提示\n\n在这种情况下，接受 `Iterable<Item>`\
  \ 会更好。现在，任何人都可以用 `ArrayList` 或 `LinkedList` 调用此方法，甚至可以用封装在 `List.of` 调用中的数组调用。\n\
  \n点击此处查看代码图片\n\n```java\npublic void processItems(Collection<Item> items)\n{\n \
  \  for (Item item : items)\n      do something with item\n}\n```\n\n然而，你现在限制了调用者——调用者必须提供\
  \ `ArrayList`。如果项恰好在另一个集合中，它们首先需要重新包装。接受一个可以执行工作的通用接口要好得多：你可以接受任何集合。\n\n## 9.7 遗留集合\n\
  \n在 Java 的第一个版本中，集合框架出现之前就已经存在“遗留”容器类。\n\n它们已经集成到了集合框架中——参见图 9.12。\n\n![Images](img/09fig12.jpg)\n\
  \n**图 9.12** 集合框架中的遗留类\n\n我将在接下来的章节简要介绍它们。\n\n#### 9.7.1 `Hashtable` 类\n\n\n\n\n\
  \n经典的 `Hashtable` 类与 `HashMap` 类的作用相同，并且本质上具有相同的接口。就像 `Vector` 类的方法一样，`Hashtable`\
  \ 的方法是同步的。如果你不需要与旧留代码兼容，应该使用 `HashMap`。如果你需要并发访问，请使用 `ConcurrentHashMap`——请参阅第 12\
  \ 章。\n\n### 9.7.2 枚举\n\n旧版集合使用 `Enumeration` 接口来遍历元素序列。`Enumeration` 接口有两个方法：`hasMoreElements`\
  \ 和 `nextElement`。这些与 `Iterator` 接口的 `hasNext` 和 `next` 方法完全对应。\n\n如果你在旧版类中发现此接口，可以使用\
  \ `Collections.list` 将元素收集到 `ArrayList` 中。例如，`LogManager` 类只愿意以 `Enumeration` 的形式暴露记录器名称。以下是获取所有名称的方法：\n\
  \n点击此处查看代码图像\n\n```\nArrayList<String> loggerNames = Collections.list(LogManager.getLoggerNames());\n\
  ```\n\n或者，从 Java 9 开始，你可以将枚举转换为迭代器：\n\n点击此处查看代码图像\n\n```\nLogManager.getLoggerNames().asIterator().forEachRemaining(n\
  \ -> { . . . });\n```\n\n你偶尔会遇到需要枚举参数的旧版方法。静态方法 `Collections.enumeration` 产生一个枚举对象，用于枚举集合中的元素。例如：\n\
  \n点击此处查看代码图像\n\n```\nList<InputStream> streams = . . .;\nvar in = new SequenceInputStream(Collections.enumeration(streams));\n\
  \   // SequenceInputStream 构造函数期望一个枚举\n```\n\n![Images](img/note.jpg) 笔记\n\n在 C++\
  \ 中，将迭代器作为参数是非常常见的。幸运的是，在 Java 平台上，很少有程序员使用这种惯用法。传递集合本身比传递迭代器要明得多。集合对象更有用。接收者在需要时可以随时从集合获取迭代器，而且他们可以使用所有的集合方法。然而，你会在某些旧代码中发现枚举，因为在\
  \ Java 1.2 集合框架出现之前，它们是通用集合唯一的可用机制。\n\n`java.util.Enumeration<E>` 1.0\n\n* `boolean\
  \ hasMoreElements()`\n\n    如果还有更多待检查的元素，则返回 `true`。\n\n* `E nextElement()`\n\n\
  \    返回下一个待检查的元素。如果 `hasMoreElements()` 返回 `false`，则不要调用此方法。\n\n* `default Iterator<E>\
  \ asIterator()` 9\n\n    产生一个用于遍历枚举元素的迭代器。\n\n`java.util.Collections` 1.2\n\n* `static\
  \ <T> Enumeration<T> enumeration(Collection<T> c)`\n\n    返回一个枚举 `c` 中元素的枚举对象。\n\
  \n* `public static <T> ArrayList<T> list(Enumeration<T> e)`\n\n    返回一个包含由 `e` 枚举元素的列表。\n\
  \n### 9.7.3 属性映射\n\n*属性映射*（property map）是一种特殊类型的映射结构。它有三个显著特征：\n\n*   键和值都是字符串。\n\
  \n*   映射可以很容易地保存到文件并从文件中加载。\n\n*   有一个用于默认值的次级表。\n\n实现属性映射的 Java 类称为 `Properties`。属性映射对于指定程序的配置选项非常有用。例如：\n\
  \n点击此处查看代码图像\n\n```\nvar settings = new Properties();\nsettings.setProperty(\"width\"\
  , \"600.0\");\nsettings.setProperty(\"filename\", \"/home/cay/books/cj12/code/v1ch09/raven.html\"\
  );\n```\n\n使用 `store` 方法将属性列表保存到文件。在这里，我们将属性映射保存到 `program.properties` 文件。第二个参数是包含在文件中注释。\n\
  \n点击此处查看代码图像\n\n```\nvar out = new FileWriter(\"program.properties\", StandardCharsets.UTF_8);\n\
  settings.store(out, \"Program Properties\");\n```\n\n示例给出了输出：\n\n点击此处查看代码图像\n\n\
  ```\n#Program Properties\n#Sun Dec 31 12:54:19 PST 2017\ntop=227.0\nleft=1286.0\n\
  width=423.0\nheight=547.0\nfilename=/home/cay/books/cj12/code/v1ch09/raven.html\n\
  ```\n\n要从文件加载属性，使用\n\n点击此处查看代码图像\n\n```\nvar in = new FileReader(\"program.properties\"\
  , StandardCharsets.UTF_8);\nsettings.load(in);\n```\n\n![Images](img/caution.jpg)\
  \ 警告\n\n如果你配合输入/输出流使用 `load` 和 `store` 方法，将使用过时的 ISO 编码，且 Unicode 字符将保存为转义字符。对于\
  \ UTF-8，请如上例所示配合 `InputStream` 和 `OutputStream` 使用 `load` 和 `store` 方法。\n\n\n\n\n\
  Properties 是没有层级结构的简单表格。通常会使用如 `window.main.color`、`window.main.title` 等键名来引入一种伪层级结构。但\
  \ `Properties` 类没有可以帮助组织此类层级的方法。如果你需要存储复杂的配置信息，应该使用 `Preferences` 类——请参阅第 10 章。\n\
  \n### `java.util.Properties` 1.0\n\n*   `Properties()`\n    创建一个空的属性映射。\n*   `Properties(Properties\
  \ defaults)`\n    创建一个带有默认值映射的空属性映射。\n*   `String getProperty(String key)`\n   \
  \ 获取一个属性。返回与键关联的字符串；如果该键不在表中，则返回默认表中与键关联的字符串；如果该键在默认表中也不存在，则返回 `null`。\n*   `String\
  \ getProperty(String key, String defaultValue)`\n    获取属性，如果未找到键，则返回默认值。返回与键关联的字符串；如果该键不在表中，则返回默认字符串。\n\
  *   `Object setProperty(String key, String value)`\n    设置一个属性。返回给定键之前设置的值。\n* \
  \  `Set<String> stringPropertyNames()` 6\n    返回所有键的集合，包括默认映射中的键。\n*   `void load(Reader\
  \ in) throws IOException` 6\n    从读取器加载属性映射。\n*   `void store(Writer out, String\
  \ header)` 6\n    将属性映射保存到写入器。头部信息位于存储文件的第一行。\n\n### `java.lang.System` 1.0\n\n\
  *   `Properties getProperties()`\n    检索所有系统属性。应用程序必须具有检索所有属性的权限，否则将抛出安全异常。\n* \
  \  `String getProperty(String key)`\n    根据给定的键名检索系统属性。应用程序必须具有检索属性的权限，否则将抛出安全异常。以下属性可以始终被检索：\n\
  \n    点击此处查看代码图像\n\n```\njava.version\njava.vendor\njava.vendor.url\njava.home\n\
  java.class.path\njava.library.path\njava.class.version\nos.name\nos.version\nos.arch\n\
  file.separator\npath.separator\nline.separator\njava.io.tempdir\nuser.name\nuser.home\n\
  user.dir\njava.compiler\njava.specification.version\njava.specification.vendor\n\
  java.specification.name\njava.vm.specification.version\njava.vm.specification.vendor\n\
  java.vm.specification.name\njava.vm.version\njava.vm.vendor\njava.vm.name\n```\n\
  \n### 9.7.4 栈 (Stacks)\n\n从 1.0 版本开始，标准库就有一个带有熟悉的 `push` 和 `pop` 方法的 `Stack` 类。然而，`Stack`\
  \ 类继承了 `Vector` 类，从理论角度来看这并不理想——你可以应用如 `insert` 和 `remove` 等非栈操作，在栈的任何位置插入和删除值，而不仅仅是栈顶。\n\
  \n### `java.util.Stack<E>` 1.0\n\n*   `E push(E item)`\n    将 `item` 推入栈中并返回 `item`。\n\
  *   `E pop()`\n    弹出并返回栈顶元素。如果栈为空，请勿调用此方法。\n*   `E peek()`\n    返回栈顶元素但不弹出。如果栈为空，请勿调用此方法。\n\
  \n### 9.7.5 比位集 (Bit Sets)\n\nJava 平台的 `BitSet` 类存储一个比特位序列。（它在数学意义上并不是一个集合——位向量或位数组是更准确的术语。）如果你高效地存储一个比特位序列（例如标志位），请使用位集。位集将比特位压缩到字节中，因此使用位集比使用\
  \ `Boolean` 对象的 `ArrayList` 要高效得多。\n\n`BitSet` 类为你提供了一个用于读取、设置和重置单个比特位的方便接口。使用此接口可以避免在\
  \ `int` 或 `long` 变量中存储比特位时所需的掩码和其他位运算操作。\n\n例如，对于一个名为 `bucketOfBits` 的 `BitSet`，\n\
  \n```\nbucketOfBits.get(i)\n```\n\n如果第 `i` 位为开启，则返回 `true`，否则返回 `false`。同样，\n\n\
  ```\nbucketOfBits.set(i)\n```\n\n将第 `i` 位开启。最后，\n\n```\nbucketOfBits.clear(i)\n\
  ```\n\n将第 `i` 位关闭。\n\n![Images](img/cnote.jpg) C++ 注意\n\nC++ 的 `bitset` 模板与 Java\
  \ 平台的 `BitSet` 相同的功能。\n\n### `java.util.BitSet` 1.0\n\n*   `BitSet(int initialCapacity)`\n\
  \    构造位集。\n*   `int cardinality()` 1.4\n    返回设置的比特数量；或者当视为整数集合时，返回元素的数量。\n*  \
  \ `int length()` 1.2\n    返回最高设置位的索引加一。\n*   `int size()`\n    返回数据结构中当前可用的比特数。\n\
  *   `boolean get(int bit)`\n    获取一个位。\n*   `void set(int bit)`\n    设置一个位。\n* \
  \  `void clear(int bit)`\n    清除一个位。\n*   `void and(BitSet set)`\n    将此集合与另一个集合进行逻辑与运算。\n\
  *   `void or(BitSet set)`\n    将此集合与另一个集合进行逻辑或运算。\n*   `void xor(BitSet set)`\n\
  \    将此集合与另一个集合进行逻辑异或运算。\n*   `void andNot(BitSet set)`\n    清除此集合中所有在另一个集合中设置的位。\n\
  *   `IntStream stream()` 8\n    产生包含设置位索引值的流。\n\n\n\n\n\n```java\npackage sieve;\n\
  \nimport java.util.*;\n\n/**\n * 此程序运行埃拉托尼筛法基准测试。它计算了所有\n * 到 2,000,000 的质数。\n *\
  \ @version 1.22 2021-06-17\n * @author Cay Horstmann\n */\npublic class Sieve\n\
  {\n    public static void main(String[] s)\n   {\n      int n = 2000000;\n     \
  \ long start = System.currentTimeMillis();\n      var bitSet = new BitSet(n + 1);\n\
  \      int i;\n      for (i = 2; i <= n; i++)\n          bitSet.set(i);\n      i\
  \ = 2;\n      while (i * i <= n)\n      {\n          if (bitSet.get(i))\n      \
  \    {\n             int k = i * i;\n             while (k <= n)\n             {\n\
  \                bitSet.clear(k);\n                k += i;\n             }\n   \
  \       }\n          i++;\n      }\n      long end = System.currentTimeMillis();\n\
  \      System.out.println(bitSet.cardinality() + \" primes\");\n      System.out.println((end\
  \ - start) + \" milliseconds\");\n   }\n}\n```\n\n列表 9.9 `sieve/sieve.cpp`\n\n点击此处查看代码图像\n\
  \n```cpp\n/**\n * @version 1.22 2021-06-17\n * @author Cay Horstmann\n */\n\n#include\
  \ <bitset>\n#include <iostream>\n#include <ctime>\n\nusing namespace std;\n\nint\
  \ main()\n{\n    const int N = 2000000;\n    clock_t cstart = clock();\n\n    bitset<N\
  \ + 1> b;\n    int i;\n    for (i = 2; i <= N; i++)\n       b.set(i);\n    i = 2;\n\
  \    while (i * i <= N)\n    {\n       if (b.test(i))\n       {\n          int k\
  \ = i * i;\n          while (k <= N)\n          {\n             b.reset(k);\n  \
  \           k += i;\n          }\n       }\n       i++;\n    }\n\n    clock_t cend\
  \ = clock();\n    double millis = 1000.0 * (cend - cstart) / CLOCKS_PER_SEC;\n \
  \   cout << b.count() << \" primes\\n\" << millis << \" milliseconds\\n\";\n   \
  \ return 0;\n}\n```\n\n这完成了我们对 Java 集合的介绍。正如你所看到的，Java 库提供了广泛的类来满足你的编程需求。在下一章中，你将学习如何编写图形界面。\n\
  \n# 第 10 章：图形界面编程\n\n在本章中\n\n* 10.1 用户界面历史\n* 10.2 显示帧\n* 10.3 在组件中显示信息\n* 10.4\
  \ 事件处理\n* 10.5 选项 API\n\nJava 诞生时，大多数用户都在与具有图形用户界面（GUI）的桌面应用程序进行交互。如今，基于浏览器的和移动应用程序更为常见，但有时提供桌面应用程序仍然很有用。此外，许多教师和学生喜欢通过\
  \ GUI 应用学习 Java。在本章及随后的章节中，我将讨论使用 Swing 进行用户界面编程的基础知识。相反，如果你对编写 GUI 程序感兴趣，可以安全地跳过这些章节。\n\
  \n## 10.1 用户界面工具包的历史\n\n当 Java 1.0 引入时，它包含一个名为抽象窗口工具包（Abstract Window Toolkit `AWT`）的类库。基础库通过将用户界面元素的创建和行为委托给每个平台（Windows、Linux\
  \ 等）的原生工具包来处理用户界面元素。例如，如果你使用原始的 `AWT` 在 Java 窗口上放置一个文本框，底层的“对等”（peer）将处理文本输入。理论上，生成的程序可以在任何一个平台上运行，并具有目标平台的“外观和感觉”。\n\
  \n这种基于对等的方法适用于简单应用程序，但很快就会发现，要依赖原生用户界面元素来编写高质量的可移植图形界面是极其困难的。菜单、滚动条和文本字段等用户界面元素在不同平台上的行为可能存在细微差异。因此，很难通过这种方法为用户提供一致且可预测的体验。此外，某些图形环境（如\
  \ X11/Motif）所拥有的用户界面组件集合并不像 Windows 或 Macintosh 那样丰富。这进一步限制了基于“最小公约数”方法的移植库。结果是，用\
  \ `AWT` 构建的 GUI 应用看起来并不如原生的 Windows 或 Macintosh 那样漂亮，也不具备这些平台用户一直以来期待的功能。更令人沮丧的是，不同平台上的\
  \ `AWT` 存在 Bug。开发者抱怨他们必须在每个平台上测试自己的程序——这种做法被讽刺地称为“一次编写，随处调试”。\n\n1996 年，Netscape\
  \ 创建了一个他们称为互联网基础类（Internet Foundation Classes `IFC`）的 GUI 库，它使用了完全不同的方法。用户界面元素（如按钮、菜单等）被绘制在窗口上。无论程序运行在哪个平台上，`IFC`\
  \ 看起来和表现都一样。Sun Microsystems 与 Netscape 合作完善了这一点，创建了代号为 `Swing` 的库。`Swing` 作为 Java\
  \ 1.1 的扩展可用，并在 1.2 中成为标准库的一部分。现在 `Swing` 是非对等工具包的官方名称。**注意**：`Swing` 并不是 `AWT` 的完全替代品——它是构建在\
  \ `AWT` 架构之上的。`Swing` 提供了更强大的用户界面组件。当你编写 `Swing` 程序时，我说 `Swing` 指用户界面类，而说 `AWT`\
  \ 指底层机制，特别是事件处理。\n\n`Swing` 需要努力绘制用户界面的每一个像素。当 `Swing` 最初发布时，用户抱怨它很慢。（如果你在树莓派等硬件上运行\
  \ `Swing` 你仍然能感受到这个问题。）后来，电脑变快了，用户抱怨 `Swing` 很丑——事实上，它已经落后于那些带有动画和特效的原生控件。更糟糕的是，Adobe\
  \ Flash 越来越多地用于创建更加炫酷且未使用原生控件的用户界面。\n\n2007 年，Sun Microsystems 引入了一个完全不同的用户界面工具包，称为\
  \ `JavaFX`，作为 Flash 的竞争品。它在 Java VM 上运行，但有自己的编程语言，称为 Java Script。该语言针对编程动画和特效进行了优化。程序员抱怨需要学习新语言，他们避而远之。2011\
  \ 年，Oracle 发布了新版本 `JavaFX 2.0`，它拥有 Java API 且不再需要独立的编程语言。从 Java 7 更新 6 开始，`JavaFX`\
  \ 一直包含在 `JDK` 和 `JRE` 中。然而，在我们编写这本书时，Oracle 已经宣布从版本 11 开始，`JavaFX` 将不再与 Java 捆绑。\n\
  \n### 10.2 显示帧\n\n顶层窗口（即不包含在另一个窗口中的窗口）在 Java 中被称为帧（frame）。`AWT` 库有一个名为 `Frame` 的类用于这种顶层。Swing\
  \ 版本的该类被称为 `JFrame` 并继承自 `Frame` 类。`JFrame` 是 Swing 组件中少数不在画布上绘制的组件之一。因此，装饰（按钮、标题栏、图标等）是由用户的窗口系统绘制的，而不是由\
  \ Swing 绘制。\n\n\n\n![Images](img/caution.jpg) 注意事项\n\n大多数 Swing 组件类都以“J”开头：`JButton`、`JFrame`\
  \ 等。虽然也有如 `Button` 和 `Frame` 等类，但它们是 AWT 组件。如果你不小心漏掉了“J”，你的程序可能仍然编译并运行，但 Swing 和\
  \ AWT 组件的混合会导致视觉和行为上的不一致。\n\n## 10.2.1 创建帧（Frame）\n\n在本节中，我们将介绍操作 Swing `JFrame`\
  \ 的最常用方法。代码列表 10.1\n\n**图 10.1** 最简单的可见帧\n\n**代码列表 10.1** `simpleFrame/SimpleFrameTest.java`\n\
  \n点击此处查看代码图像\n\n```\n 1 package simpleFrame;\n 2\n 3 import java.awt.*;\n 4 import\
  \ javax.swing.*;\n 5\n 6 /**\n 7  * @version 1.34 2018-04-10\n 8  * @author Cay\
  \ Horstmann\n 9  */\n10 public class SimpleFrameTest\n11 {\n12    public static\
  \ void main(String[] args)\n13    {\n14       EventQueue.invokeLater(() ->\n15 \
  \         {\n16             var frame = new SimpleFrame();\n17             frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  18             frame.setVisible(true);\n19          });\n20    }\n21 }\n22\n23 class\
  \ SimpleFrame extends JFrame\n24 {\n25    private static final int DEFAULT_WIDTH\
  \ = 300;\n26    private static final int DEFAULT_HEIGHT = 200;\n27\n28    public\
  \ SimpleFrame()\n29    {\n30       setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n31 \
  \   }\n32 }\n```\n\n让我们逐行分析这个程序。\n\nSwing 类位于 `javax.swing` 包中。包名 `java.x` 表示这是一个\
  \ Java 扩展包，而不是核心包。由于历史原因，Swing 被认为是一种扩展。然而，自 1.2 版本以来，它存在于每个 Java 实现中。\n\n默认情况下，帧的大小为\
  \ 0×0 像素，这非常没有意义。我们定义了一个子类 `SimpleFrame`，其构造函数将大小设置为 300×200 像素。这是 `SimpleFrame`\
  \ 和 `JFrame` 之间唯一的区别。\n\n在 `SimpleFrameTest` 类的 `main` 方法中，我们构造了一个 `SimpleFrame`\
  \ 对象并使其可见。\n\n在每个 Swing 程序中，我们需要处理两个技术问题。\n\n首先，所有的 Swing 组件都必须在*事件分发线程*（event dispatch\
  \ thread）中配置，该线程是负责鼠标点击和按键等事件传递给用户界面组件的控制线程。以下代码片段用于在事件分发线程中执行语句：\n\n```\nEventQueue.invokeLater(()\
  \ ->\n   {\n      statements\n   });\n```\n\n![Images](img/note.jpg) 注意\n\n你将看到许多\
  \ Swing 程序并没有在事件分发线程中初始化用户界面。以前在主线程中进行初始化是完全可以的。遗憾的是，随着 Swing 组件变得越来越复杂，JDK 开发者已经无法保证这种方法的安全性。虽然错误的概率极低，但你可能不想成为那少数遇到间歇性问题的倒霉蛋之一。做正确的事情更好，即使代码看起来相当神秘。\n\
  \n接下来，我们定义当用户关闭应用程序的帧时应该发生什么。对于这个特定的程序，我们希望程序退出。为了选择这种行为，我们使用语句：\n\n点击此处查看代码图像\n\
  \n```\nframe.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n```\n\n在其他具有多个帧的程序中，你不希望程序仅仅用户关闭了其中一个帧就退出。默认情况下，用户关闭帧时，帧会被隐藏，但程序不会终止。（如果程序在*最后一个*帧变为不可见时自动终止就好了，但这不是\
  \ Swing 的工作方式。）\n\n仅仅构造帧并不会自动显示它。帧在生命周期开始是不可见的。这让程序员有机会在第一次显示帧之前向帧中添加组件。要显示帧，`main`\
  \ 方法调用了帧的 `setVisible` 方法。\n\n在调度了初始化语句后，`main` 方法退出。注意，退出 `main` 并不意味着程序终止——只是主线程终止。事件分发线程会保持程序运行，直到通过关闭帧或调用\
  \ `System.exit` 方法将其终止。\n\n运行中的程序如图 10.1](#ch10.xhtml_ch10fig01）所示——它是一个真正无聊的顶层窗口。如图所示，标题栏和周围的装饰（如缩放角）是由操作系统绘制的，而不是\
  \ Swing 库。Swing 库绘制帧内部的所有内容。在这个程序中，它只是用默认背景颜色填充了帧。\n\n## 10.2.2 帧属性\n\n`JFrame`\
  \ 类本身只有几个方法可以更改帧的外观。当然，通过继承，大多数用于处理帧大小和位置的方法都来自 `JFrame`。以下是一些重要的方法：\n\n*   `setLocation`\
  \ 和 `setBounds` 方法，用于设置帧的位置\n*   `setIconImage` 方法，用于在标题栏任务切换器中显示图标\n*   `setTitle`\
  \ 方法，用于更改标题栏的文本\n*   `setResizable` 方法，接收一个 `boolean` 来决定帧是否可以调整大小\n\n图 10.2](#ch10.xhtml_ch10fig02）展示了\
  \ `JFrame` 类的继承层次。\n\n![Images](img/10fig02.jpg)\n\n**图 10.2** AWT 和 Swing 中类的继承层次\n\
  \n正如 API 说明所示，`Component` 类（GUI 对象的祖先）和 `Window` 类（`Frame` 类的父类）是你查找调整和形状方法的地方。例如，`Component`\
  \ 类中的 `setLocation` 方法是重新定位组件的一种方式。如果你调用\n\n```\nsetLocation(x, y)\n```\n\n横向 x\
  \ 像素，向下 y 像素，其中 (0,0) 是屏幕的左上角。同样，`Component` 中的 `setBounds` 方法允许在一步内调整大小并移动组件（特别是\
  \ `JFrame`），如下：\n\n点击此处查看代码图像\n\n```\nsetBounds(x, y, width, height)\n```\n\n许多类方法以\
  \ getter/setter 对的形式出现，例如 `Frame` 类的以下方法：\n\n点击此处查看代码图像\n\n```\npublic String getTitle()\n\
  public void setTitle(String title)\n```\n\n这样的 getter/setter 对被称为*属性*（property）。属性具有名称和类型。名称通过将\
  \ `get` 或 `set` 之后的第一个字母转换为小写来获得。例如，`Frame` 类有一个名称为 `title`、类型为 `String` 的属性。\n\n\
  从概念上说，`title` 是帧的一个属性。当我们设置该属性时，我们期望屏幕上的标题会发生变化。当我们获取属性时，我们期望得到我们之前设置的值。\n\n`get`/`set`\
  \ 约定中有一个例外：对于 `boolean` 类型的属性，getter 以 `is` 开头。例如，以下两个方法定义了 `resizable` 属性：\n\n\
  点击此处查看代码图像\n\n```\npublic boolean isResizable()\npublic void setResizable(boolean\
  \ resizable)\n```\n\n\n\n\n\n要确定合适的帧尺寸，首先要获取屏幕尺寸。调用 `Toolkit` 类的静态方法 `getDefaultToolkit`来获取\
  \ `Toolkit` 对象。（`Toolkit` 类是各种与原生窗口系统接口的方法的汇集地。）然后调用 `getScreenSize` 方法，该方法以 `Dimension`\
  \ 对象的形式返回屏幕尺寸。`Dimension` 对象在公有的 (!) 实例变量 `width` 和 `height` 中同时存储了宽度和高度。然后你就可以使用屏幕尺寸的适当百分比来设置帧的大小。以下是代码：\n\
  \n点击此处查看代码图片\n\n```\nToolkit kit = Toolkit.getDefaultToolkit();\nDimension screenSize\
  \ = kit.getScreenSize();\nint screenWidth = screenSize.width;\nint screenHeight\
  \ = screenSize.height;\nsetSize(screenWidth / 2, screenHeight / 2);\n```\n\n你还可以提供帧的图标：\n\
  \n点击此处查看代码图片\n\n```\nImage img = new ImageIcon(\"icon.gif\").getImage();\nsetIconImage(img);\n\
  ```\n\n### `java.awt.Component` 1.0\n\n*   `boolean isVisible()`\n*   `void setVisible(boolean\
  \ b)`\n    获取或设置 `visible` 属性。组件初始是可见的，但 `JFrame` 等顶层组件除外。\n*   `void setSize(int\
  \ width, int height)` 1.1\n    将组件调整为指定的宽度和高度。\n*   `void setLocation(int x, int\
  \ y)` 1.1\n    将组件移动到新位置。如果组件不是顶层组件，则 `x` 和 `y` 坐标使用容器的坐标；如果组件是顶层组件（例如 `JFrame`），则使用屏幕坐标。\n\
  *   `void setBounds(int x, int y, int width, int height)` 1.1\n    移动并调整此组件。\n*\
  \   `Dimension getSize()` 1.1\n*   `void setSize(Dimension d)` 1.1\n    获取或设置此组件的\
  \ `size` 属性。\n\n### `java.awt.Window` 1.0\n\n*   `boolean isLocationByPlatform()`\
  \ 5\n*   `void setLocationByPlatform(boolean b)` 5\n    获取或设置 `locationByPlatform`\
  \ 属性。当在该窗口之前之前设置该属性，平台将选择一个合适的位置。\n\n### `java.awt.Frame` 1.0\n\n*   `boolean isResizable()`\n\
  *   `void setResizable(boolean b)`\n    获取或设置 `resizable` 属性。设置该属性后，用户可以调整帧的大小。\n\
  *   `String getTitle()`\n*   `void setTitle(String s)`\n    获取或设置 `title` 属性，该属性决定帧标题栏中的文本。\n\
  *   `Image getIconImage()`\n*   `void setIconImage(Image image)`\n    获取或设置 `iconImage`\
  \ 属性，该属性决定帧的图标。窗口系统可能会将图标作为帧装饰的一部分或其他位置显示。\n\n### `java.awt.Toolkit` 1.0\n\n*  \
  \ `static Toolkit getDefaultToolkit()`\n    返回默认的工具包。\n*   `Dimension getScreenSize()`\n\
  \    获取用户屏幕的尺寸。\n\n### `javax.swing.ImageIcon` 1.2\n\n*   `ImageIcon(String filename)`\n\
  \    构造一个图像存储在文件中的图标。\n*   `Image getImage()`\n    获取此图标的图像。\n\n### 10.3 在组件中显示信息\n\
  \n在本节中，我将向你展示如何在帧内部显示信息（图 10.3）。\n\n![Images](img/10fig03.jpg)\n\n**图 10.3** 显示信息的帧\n\
  \n你可以将消息字符串绘制到帧上，但这并不被认为是良好的编程实践。在 Java 中，帧实际上被设计为组件的容器，例如菜单栏和其他用户界面元素。你通常在添加到帧的另一个组件上进行绘图。\n\
  \n`JFrame` 的结构复杂得惊人。看图 10.4，它展示了 `JFrame` 的组成。如你所见，`JFrame` 中层叠了四个面板。根面板（root pane）、分层面板（layered\
  \ pane）和玻璃面板（glass pane）对我们来说没有意义；它们是组织菜单栏和内容面板以及实现外观效果（look-and-feel）所必需的。Swing\
  \ 程序员最关注的部分是*内容面板*（content pane）。你添加到帧的任何组件都会自动放置在内容面板中：\n\n![Images](img/10fig04.jpg)\n\
  \n**图 10.4** JFrame 的内部结构\n\n点击此处查看代码图片\n\n```\nComponent c = . . .;\nframe.add(c);\
  \ // 添加到内容面板\n```\n\n在我们的情况下，我们想向帧添加一个单个组件，并在上面绘制我们的消息。要在组件上绘图，你需要定义一个扩展 `JComponent`\
  \ 的类，并在类中重写 `paintComponent` 方法。\n\n`paintComponent` 方法接收一个 `Graphics` 类型的参数。`Graphics`\
  \ 对象记录了绘制图像和文本的一系列设置，例如你设置的字体或当前颜色。Java 中的所有绘图都必须通过 `Graphics` 对象进行。它具有绘制图案、图像和文本的方法。\n\
  \n以下是创建一个可以对其进行绘图的组件的方法：\n\n点击此处查看代码图片\n\n```\nclass MyComponent extends JComponent\n\
  {\n   public void paintComponent(Graphics g)\n   {\n      // 绘图代码\n   }\n}\n```\n\
  \n每当窗口需要重绘时，无论原因如何，事件处理器都会通知组件。这会导致所有组件的 `paintComponent` 方法被执行。\n\n永远不要自己调用 `paintComponent`\
  \ 方法。当你的应用程序部分部分需要重绘时，它会被自动调用，你不应该干预这个自动过程。\n\n什么样的操作会触发这种自动响应？例如，当用户增大窗口大小，或最小化后恢复窗口时，就会发生绘图。如果用户弹出另一个窗口覆盖了现有窗口，然后让该窗口消失，那么被覆盖的窗口现在损坏了，需要重绘。\n\
  \n![Images](img/tip.jpg) 提示\n\n如果你需要强制重绘屏幕，请调用 `repaint` 方法而不是 `paintComponent`。`repaint`\
  \ 方法会导致所有组件调用 `paintComponent`，并带上配置良好的 `Graphics` 对象。\n\n正如代码片段所示，`paintComponent`\
  \ 方法接收一个 `Graphics` 类型的参数。在 `Graphics` 对象上的测量是以像素为单位的。(0, 0) 坐标表示你正在绘图的组件的左上角。\n\
  \n`Graphics` 类有各种绘制方法，显示文本被视为一种特殊的绘图。我们的 `paintComponent` 方法如下：\n\n点击此处查看代码图片\n\n\
  ```\npublic class NotHelloWorldComponent extends JComponent\n{\n   public static\
  \ final int MESSAGE_X = 75;\n   public static final int MESSAGE_Y = 100;\n\n   public\
  \ void paintComponent(Graphics g)\n   {\n      g.drawString(\"Not a Hello, World\
  \ program\", MESSAGE_X, MESSAGE_Y);\n   }\n   . . .\n}\n```\n\n最后，组件应该告诉用户它有多大。重写\
  \ `getPreferredSize` 方法并返回一个包含首选宽度高度的 `Dimension` 对象：\n\n点击此处查看代码图片\n\n```\npublic\
  \ class NotHelloWorldComponent extends JComponent\n{\n   private static final int\
  \ DEFAULT_WIDTH = 300;\n   private static final int DEFAULT_HEIGHT = 200;\n   .\
  \ . .\n   public Dimension getPreferredSize()\n   {\n      return new Dimension(DEFAULT_WIDTH,\
  \ DEFAULT_HEIGHT);\n   }\n}\n```\n\n当你用一个或多个组件填充帧，并且仅仅地想使用它们的首选尺寸时，请调用 `pack` 方法而不是\
  \ `setSize` 方法：\n\n点击此处查看代码图片\n\n\n\n\n```java\nclass NotHelloWorldFrame extends\
  \ JFrame\n{\n   public NotHelloWorldFrame()\n   {\n      add(new NotHelloWorldComponent());\n\
  \      pack();\n   }\n}\n```\n\nListing 10.2 显示完整的代码。\n\n`Listing 10.2` `notHelloWorld/NotHelloWorld.java`\n\
  \n点击此处查看代码图像\n\n```java\n 1 package notHelloWorld;\n 2\n 3 import javax.swing.*;\n\
  \ 4 import java.awt.*;\n 5\n 6 /**\n 7  * @version 1.34 2018-04-10\n 8  * @author\
  \ Cay Horstmann\n 9  */\n10 public class NotHelloWorld\n11 {\n12    public static\
  \ void main(String[] args)\n13    {\n14       EventQueue.invokeLater(() ->\n15 \
  \          {\n16              var frame = new NotHelloWorldFrame();\n17        \
  \      frame.setTitle(\"NotHelloWorld\");\n18              frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  19              frame.setVisible(true);\n20           });\n21    }\n22 }\n23\n24\
  \ /**\n25  * 一个包含消息面板的帧。\n26  */\n27 class NotHelloWorldFrame extends JFrame\n28\
  \ {\n29    public NotHelloWorldFrame()\n30    {\n31       add(new NotHelloWorldComponent());\n\
  32       pack();\n33    }\n34 }\n35\n36 /**\n37  * 一个显示消息的组件。\n38  */\n39 class\
  \ NotHelloWorldComponent extends JComponent\n40 {\n41    public static final int\
  \ MESSAGE_X = 75;\n42    public static final int MESSAGE_Y = 100;\n43\n44    private\
  \ static final int DEFAULT_WIDTH = 300;\n45    private static final int DEFAULT_HEIGHT\
  \ = 200;\n46\n47    public void paintComponent(Graphics g)\n48    {\n49       g.drawString(\"\
  Not a Hello, World program\", MESSAGE_X, MESSAGE_Y);\n50    }\n51\n52    public\
  \ Dimension getPreferredSize()\n53    {\n54       return new Dimension(DEFAULT_WIDTH,\
