  \ `true`。\n*   `boolean endsWith(String suffix)`\n*   `int indexOf(String str)`\n\
  *   `int indexOf(int cp)`\n    返回从索引 `0` 或 `fromIndex` 开始的第一个等于字符串 `str` 或代码点 `cp`\
  \ 的子字符串的起始位置；如果 `str` 或 `cp` 不在此字符串中出现，则返回 -1。\n*   `int lastIndexOf(String str,\
  \ int fromIndex)`\n*   `int lastindexOf(int cp, int fromIndex)`\n*   `int length()`\n\
  *   `int codePointCount(int startIndex, int endIndex)` **5**\n*   `String replace(CharSequence\
  \ oldString, CharSequence newString)`\n*   `String substring(int beginIndex)`\n\
  \    返回一个新字符串，包含从 `beginIndex` 到字符串末尾或到 `endIndex - 1` 的所有代码单元。\n*   `String toUpperCase()`\n\
  *   `String strip()` **11**\n*   `String stripTrailing()` **11**\n*   `String join(CharSequence\
  \ delimiter, CharSequence... elements)` **8**\n*   `String repeat(int count)` **11**\n\
  \n\n\n\n\n\n\n完成字符串构建后，调用 `toString` 方法。你将得到一个包含构建器中字符序列的 `String` 对象。\n\n点击此处查看代码图像\n\
  \n```\nString completedString = builder.toString();\n```\n\n![Images](img/note.jpg)\
  \ 注意事项\n\n`StringBuffer` 类的效率比 `StringBuilder` 低，但它允许多个线程添加或删除字符。如果所有的字符串编辑都在单线程中进行（这通常是如此），你应该使用\
  \ `StringBuilder`。这两个类的 API 是完全相同的。\n\n以下 API 备注包含了 `StringBuilder` 类最重要的方法。\n\n\
  ### `java.lang.StringBuilder` 5\n\n*   `StringBuilder()`\n    构造一个空的字符串构建器。\n* \
  \  `int length()`\n    返回构建器或缓冲区中代码单元的数量。\n*   `StringBuilder append(String str)`\n\
  \    追加一个字符串并返回 `this`。\n*   `StringBuilder append(char c)`\n    追加一个代码单元并返回 `this`。\n\
  *   `StringBuilder appendCodePoint(int cp)`\n    追加一个代码点，将其转换为一个或两个代码单元，并返回 `this`。\n\
  *   `void setCharAt(int i, char c)`\n    将第 `i` 个代码单元设置为 `c`。\n*   `StringBuilder\
  \ insert(int offset, String str)`\n    在位置 `offset` 处插入一个字符串并返回 `this`。\n*   `StringBuilder\
  \ insert(int offset, char c)`\n    在位置 `offset` 处插入一个代码单元并返回 `this`。\n*   `StringBuilder\
  \ delete(int startIndex, int endIndex)`\n    删除从 `startIndex` 到 `endIndex - 1` 的代码单元并返回\
  \ `this`。\n*   `String toString()`\n    返回一个与构建器或缓冲区内容相同的数据字符串。\n\n#### 3.6.10 文本块\
  \ (Text Blocks)\n\nJava 15 添加的文本块功能使得提供跨行的字符串字面量变得简单。文本块以 `\"\"\"` 开始，后跟一个换行符。块以另一个\
  \ `\"\"\"` 结束：\n\n```\nString greeting = \"\"\"\nHello\nWorld\"\"\";\n```\n\n与等效的字符串字面量相比，文本块更容易读和写：\n\
  \n```\n\"Hello\\nWorld\\n\"\n```\n\n此字符串包含两个 `\\n`：一个在 `Hello` 之后，一个在 `World` 之后。起始\
  \ `\"\"\"` 之后的换行符不包含在字符串字面量中。\n\n如果你不想在最后一行之后有换行符，将结束的 `\"\"\"` 直接放在最后一个字符之后：\n\n\
  ```\nString prompt = \"\"\"\nHello, my name is Hal.\nPlease enter your name: \"\"\
  \";\n```\n\n文本块特别适合包含其他语言的代码，如 SQL 或 HTML。你可以直接粘贴：\n\n点击此处查看代码图像\n\n```\nString\
  \ html = \"\"\"\n<div class=\"Warning\">\n   Beware of those who say \"Hello\" to\
  \ the world\n</div>\n\"\"\";\n```\n\n注意，你不需要转义引号。只有两种情况需要转义它们：\n\n*   如果文本块以引号结束\n\
  *   如果文本块包含三个或更多引号的序列\n\n不幸的是，你仍然需要转义所有的反斜杠。\n\n普通字符串中的所有转义序列在文本块中的工作方式都是相同的。有一种转义序列只在文本块中有效。行尾直接\
  \ `\\` 会将此行和下一行连接。例如，\n\n```\n\"\"\"\nHello, my name is Hal. \\\nPlease enter your\
  \ name: \"\"\";\n```\n\n等同于\n\n点击此处查看代码图像\n\n```\n\"Hello, my name is Hal. Please\
  \ enter your name: \"\n```\n\n行结束符通过移除末尾空格并将 Windows 行结束符（`\\r\\n`）转换为简单的换行符（`\\\
  n`）来归一化。在极罕需要保留末尾空格的情况下，将最后一个空格转换为 `\\s` 转义字符。\n\n前导空格的情况更为复杂。考虑一个从左边距缩进的典型变量声明。你也可以对文本块进行缩进：\n\
  \n点击此处查看代码图像\n\n```\nString html = \"\"\"\n   <div class=\"Warning\">\n     Beware\
  \ of those who say \"Hello\" to the world\n   </div>\n   \"\"\";\n```\n\n文本块中所有行的公共缩进会被减去。实际字符串是：\n\
  \n点击此处查看代码图像\n\n```\n\"<div class=\\\"Warning\\\">\\n Beware of those who say \\\
  \"Hello\\\" to the world\\n</div>\\n\"\n```\n\n注意，第一行和第三行没有缩进。你的 IDE 可能会愉快地建议缩进所有文本块，仅使用\
  \ Tab、仅使用空格或恰当的混合。Java 并明智地没有规定 Tab 的宽度。文本块中所有行的空白前缀必须*完全*匹配。\n\n完全空白的行不包含在缩进移除过程中。然而，结束的\
  \ `\"\"\"` 之前的空白是有重要意义的。请确保缩进到你想要剥离的空白末尾。\n\n![Images](img/caution.jpg) 注意\n\n注意缩进文本块的公共前缀中混合使用\
  \ Tab 和空格。一个被忽略的空格很容易导致结果。\n\n![Images](img/tip.jpg) 提示\n\n为了让示例更有趣，我们希望接受输入并正确地格式化输出。\n\
  \n## 3.7 输入与输出\n\n为了让示例更有趣，我们希望接受输入并正确地格式化输出。当然，现代程序使用 GUI 来收集输入。\n\n### 3.7.1 读取输入\n\
  \n你看到向“标准输出流”（即控制台）输出只需调用 `System.out.println`。从“标准输入流” `System.in` 读取并不那么简单。为了读取输入，你首先构造连接\
  \ `System.in` 的 `Scanner`：\n\n点击此处查看代码图像\n\n```\nScanner in = new Scanner(System.in);\n\
  ```\n\n（构造函数和 `new` 运算符将在第 4 章](#ch4.ch4）中详细讨论。）\n\n现在你可以使用 `Scanner` 类的各种方法读取输入。例如，`nextLine`\
  \ 方法读取一行输入。\n\n点击此处查看代码图像\n\n```\nSystem.out.print(\"What is your name? \");\nString\
  \ name = in.nextLine();\n```\n\n在这里使用 `nextLine` 方法是因为输入可能包含空格。要读取单个单词（由空白分隔），调用\n\
  \n```java\nString firstName = in.next();\n```\n\n要读取整数，使用 `nextInt` 方法。\n\n点击此处查看代码图像\n\
  \n```\nSystem.out.print(\"How old are you? \");\nint age = in.nextInt();\n```\n\n\
  同样，`nextDouble` 方法读取下一个浮点数。\n\n列表 3.2 中的程序询问用户的姓名和年龄，然后打印如下消息：\n\n点击此处查看代码图像\n\n\
  ```\nHello, Cay. Next year, you'll be 57\n```\n\n最后，注意程序开头的行\n\n```java\nimport\
  \ java.util.*;\n```\n\n`Scanner` 类定义在 `java.util` 包中。每当你使用不在基础 `java.lang` 包中定义的类时，你都需要使用\
  \ `import` 指令。\n\n\n\n\n\n```\nimport java.util.*;\n\n/**\n * This program demonstrates\
  \ console input.\n * @version 1.10 2004-02-10\n * @author Cay Horstmann\n */\npublic\
  \ class InputTest\n{\n   public static void main(String[] args)\n   {\n       Scanner\
  \ in = new Scanner(System.in);\n\n       // get first input\n       System.out.print(\"\
  What is your name? \");\n       String name = in.nextLine();\n\n       // get second\
  \ input\n       System.out.print(\"How old are you? \");\n       int age = in.nextInt();\n\
  \n       // display output on console\n       System.out.println(\"Hello, \" + name\
  \ + \". Next year, you'll be \" + (age + 1));\n    }\n}\n```\n\n![Images](img/note.jpg)\
  \ 注意\n\n`Scanner` 类不适合从控制台读取密码，因为输入内容对任何人都是可见。请为此目的使用 `Console` 类。若要读取密码，请使用以下代码：\n\
  \n点击此处查看代码图像\n\n```\nConsole cons = System.console();\nString username = cons.readLine(\"\
  User name: \");\nchar[] passwd = cons.readPassword(\"Password: \");\n```\n\n出于安全考虑，密码以字符数组的形式返回而非字符串。在你处理完密码后，应该立即用填充值覆盖数组元素。（数组处理请参见第\
  \ 3.10 节 中的“数组”，位于第 109 页 页。）\n\n使用 `Console` 对象进行输入处理没有使用 `Scanner` 那么方便。你必须一次读取一行输入。没有读取单个单词或数字的方法。\n\
  \n### `java.util.Scanner` 5\n\n*   `Scanner(InputStream in)`: 从给定的输入流构造一个 `Scanner`\
  \ 对象。\n*   `String nextLine()`: 读取下一行输入。\n*   `String next()`: 读取下一个输入单词（由空白分隔）。\n\
  *   `int nextInt()`\n*   `double nextDouble()`: 读取并转换下一个表示整数或浮点数的字符序列。\n*   `boolean\
  \ hasNext()`: 测试输入中是否还有另一个单词。\n*   `boolean hasNextInt()`\n*   `boolean hasNextDouble()`:\
  \ 测试下一个字符序列是否表示整数或浮点数。\n\n### `java.lang.System` 1.0\n\n*   `static Console console()`\
  \ 6: 如果可以通过控制台窗口与用户交互，则返回一个 `Console` 对象，否则返回 `null`。对于任何在控制台窗口中启动的程序，都可以使用 `Console`\
  \ 对象。否则，其可用性取决于系统。\n\n### `java.io.Console` 6\n\n*   `static char[] readPassword(String\
  \ prompt, Object... args)`\n*   `static String readLine(String prompt, Object...\
  \ args)`: 显示提示并读取用户输入，直到输入行结束。可选的 `args` 参数用于提供格式化参数，见下一节。\n\n### 3.7.2 格式化输出\n\n\
  你可以使用 `System.out.print(x)` 语句向控制台打印数字 `x`。该命令将打印具有该类型最大非零数字数量的 `x`。例如，\n\n```\n\
  double x = 1000.0 / 3.0;\nSystem.out.print(x);\n```\n\n打印\n\n```\n3333.3333333333335\n\
  ```\n\n如果你想显示美元和分，这就会是一个问题。\n\n解决方法是使用 `printf` 方法，它遵循 C 语言库悠久的传统。例如，调用\n\n```\n\
  System.out.printf(\"%8.2f\", x);\n```\n\n将打印`字段宽度`为 8 个字符、`精度`为 2 个字符的 `x`。这意味着打印输出包含一个前导空格和七个字符：\n\
  \n```\n3333.33\n```\n\n你可以为 `printf` 提供多个参数。例如：\n\n点击此处查看代码图像\n\n```\nSystem.out.printf(\"\
  Hello, %s. Next year, you'll be %d\", name, age);\n```\n\n每个以 `%` 字符开头的`格式化符` 被替换为相应的参数。格式化符结尾的`转换字符`指示要格式化的值的类型：`f`\
  \ 是浮点数，`s` 是字符串，`d` 是十进制整数。表 3.5 显示了所有转换字符。\n\n大写变体产生大写字母。例如，`\"%8.2E\"` 将 3333.33\
  \ 格式化为 `3.33E+03`。\n\n| 转换字符 | 类型 | 示例 |\n| :--- | :--- | :--- |\n| `d` | 十进制整数\
  \ | `15` |\n| `x` | 十六进制 | `f` |\n| `o` | 八进制 | `37` |\n| `f` | 定点法 | `9` |\n| `e`\
  \ | 指数法 | `4` |\n| `g` | 通用 | `5` |\n| `s` | 字符串 | `abc` |\n| `c` | 字符 | `a` |\n\
  | `n` | 平台相关 | |\n\n\n\n\n格式化是`特定区域的`。例如，在德国，分组分隔符是点，而不是逗号。第二卷的第 7 章展示了如何控制应用程序的国际化行为。\n\
  \n### 3.7.3 文件输入与输出\n\n要从文件中读取内容，请按如下方式构造 `Scanner` 对象：\n\n点击此处查看代码图像\n\n```\nScanner\
  \ in = new Scanner(Path.of(\"myfile.txt\"), StandardCharsets.UTF_8);\n```\n\n如果文件名包含反斜杠，请记住使用额外的反斜杠对每个反斜杠进行转义：`\"\
  c:\\\\mydirectory\\\\myfile.txt\"`。\n\n现在你可以使用已经遇到过的任何 `Scanner` 方法从文件中读取内容了。\n\n\
  ![Images](img/note.jpg) Note\n\n在这里，我们指定了 UTF-8 字符编码，这是互联网文件的常用（但非通用）编码。在读取文本文件时你需要知道字符编码（更多信息请参阅第二卷第\
  \ 2 章）。如果你省略了字符编码，将使用运行 Java 程序的计算机的“默认编码”。这不是一个好主意——程序的行为可能会根据其运行的位置而不同。\n\n![Images](img/caution.jpg)\
  \ Caution\n\n你可以使用字符串参数来构造 `Scanner`，但扫描器会将该字符串解释为数据，而不是文件名。例如，如果你调用\n\n点击此处查看代码图像\n\
  \n```\nScanner in = new Scanner(\"myfile.txt\"); // ERROR?\n```\n\n那么扫描器将看到十个字符数据：`'m'`、`'y'`、`'f'`\
  \ 等。这可能不是这种这种情况下的意图。\n\n要写入文件，请构造一个 `PrintWriter` 对象。在构造函数中，提供文件名和字符编码：\n\n点击此处查看代码图像\n\
  \n```\nPrintWriter out = new PrintWriter(\"myfile.txt\", StandardCharsets.UTF_8);\n\
  ```\n\n如果文件不存在，则会创建它。你可以像打印到 `System.out` 一样使用 `print`、`println` 和 `printf` 命令。\n\
  \n![Images](img/note.jpg) Note\n\n当你指定相对文件名时，例如 `\"myfile.txt\"`、`\"mydirectory/myfile.txt\"\
  ` 或 `\"../myfile.txt\"`，文件将相对于 Java 虚拟机启动时的目录进行定位。如果你从命令 shell 启动程序，通过执行\n\n```\n\
  java MyProg\n```\n\n那么起始目录就是该命令 shell 的当前目录。然而，如果你使用集成开发环境，则由它来控制起始目录。你可以通过此调用找到目录位置：\n\
  \n点击此处查看代码图像\n\n```\nString dir = System.getProperty(\"user.dir\");\n```\n\n如果你在定位文件时遇到困难，请考虑使用绝对路径名，例如\
  \ `\"c:\\\\mydirectory\\\\myfile.txt\"` 或 `\"/home/me/mydirectory/myfile.txt\"`。正如你所看到的，访问文件就像访问\
  \ `System.in` 和 `System.out` 一样简单。只有一个陷阱：如果你使用一个不存在的文件构造 `Scanner`，或使用无法创建的文件名构造\
  \ `PrintWriter`，就会发生异常。Java 编译器认为这些异常比“除以零”异常更严重。在第 7 章中，你将学习处理异常的各种方法。现在，你只需要告诉编译器你意识到可能出现“输入/输出”异常。你通过在\
  \ `main` 方法上标记 `throws` 子句来实现，如下所示：\n\n点击此处查看代码图像\n\n```\npublic static void main(String[]\
  \ args) throws IOException\n{\n   Scanner in = new Scanner(Path.of(\"myfile.txt\"\
  ), StandardCharsets.UTF_8);\n   . . .\n}\n```\n\n你现在已经了解了如何读写包含文本数据的文件。对于高级主题，例如处理字符编码、处理二进制数据、读取目录和写入\
  \ zip 文件，请参阅第二卷的第 2 章。\n\n![Images](img/note.jpg) Note\n\n当你从命令 shell 启动程序时，可以使用你的\
  \ shell 的重定向语法并将任何文件附加到 `System.in` 和 `System.out`：\n\n点击此处查看代码图像\n\n```\njava MyProg\
  \ < myfile.txt > output.txt\n```\n\n那么你不必担心处理 `IOException` 了。\n\n`java.util.Scanner`\n\
  - `Scanner(Path p, String encoding)` 构造一个使用给定编码从给定路径读取数据的 `Scanner`。\n- `Scanner(String\
  \ data)` 构造一个从给定字符串读取数据的 `Scanner`。\n\n`java.io.PrintWriter`\n- `PrintWriter(String\
  \ fileName)` 构造一个向指定名称文件写入数据的 `PrintWriter`。\n\n`java.nio.file.Path`\n- `static\
  \ Path of(String pathname)` 从给定的路径名构造 `Path`。\n\n## 3.8 控制流\n\nJava 像任何编程语言一样，支持条件语句和循环来决定控制流。从条件语句开始，以\
  \ `switch` 语句结束，用于测试许多值。\n\n![Images](img/note.jpg) Note\n\nJava 的控制结构与 C 和 C++\
  \ 相同，但有一些例外。没有 `goto`，但有一个 `break` 的变体，用于跳出循环（在 C 中可能使用了 `goto`）。最后，有一个 `for` 的变体，类似于\
  \ C# 中的 `foreach` 循环。\n\n#### 3.8.1 块\n\n在学习控制结构之前，你需要更多地了解块。块（或复合语句）由一对大括号组成。块定义了变量的作用域。块可以嵌套在另一个块内部。这里是一个嵌套在\
  \ `main` 方法块中的块：\n\n点击此处查看代码图像\n\n```\npublic static void main(String[] args)\n\
  {\n   int n;\n   . . .\n   {\n     int k;\n     . . .\n   } // k 只定义到这里\n}\n```\n\
  \n你可以在嵌套块中声明同名的局部变量。例如，以下是一个错误且无法编译：\n\n点击此处查看代码图像\n\n```\npublic static void main(String[]\
  \ args)\n{\n   int n;\n   . . .\n   {\n      int k;\n      int n; // 错误--在内部块中重复声明\
  \ n\n      . . .\n   }\n}\n```\n\n![Images](img/note.jpg) Note\n\n在 C++ 中，可以在嵌套块内部重新定义变量。此时内部定义会遮蔽外部定义。这可能是编程错误的来源；因此，Java\
  \ 不允许。\n\n### 3.8.2 条件语句\n\nJava 中的条件语句形式为：\n\n```\nif (condition) statement\n```\n\
  \n条件必须由括号包围。\n\n在 Java 中，就像大多数编程语言一样，你通常希望在单个条件为真时执行多个语句。在这种情况下，使用形式如下的块语句：\n\n\
  ```\n{\n  statement1\n  statement2\n  . . .\n}\n```\n\n例如：\n\n点击此处查看代码图像\n\n```\n\
  if (yourSales >= target)\n{\n   performance = \"Satisfactory\";\n   bonus = 100;\n\
  }\n```\n\n在这段代码中，当 `yourSales` 大于或等于 `target` 时，大括号周围的所有语句都将被执行（参见图 3.7）。\n\n![Images](img/note.jpg)\
  \ Note\n\n块（有时称为复合语句）允许你在任何原本允许单个（简单）语句的 Java 编程结构中使用多个（简单）语句。\n\nJava 更通用的条件形式所示（参见图\
  \ 3.8）：\n\n```\nif (condition) statement1 else statement2\n```\n\n\n\n\n点击此处查看代码图像\n\
  \n```\nif (yourSales >= target)\n{\n   performance = \"Satisfactory\";\n   bonus\
  \ = 100 + 0.01 * (yourSales - target);\n}\n```\n\n![Images](img/03fig07.jpg)\n\n\
  **图 3.7** `if` 语句的流程图\n\n点击此处查看代码图像\n\n```\nelse\n{\n   performance = \"Unsatisfactory\"\
  ;\n   bonus = 0;\n}\n```\n\n`else` 部分总是可选的。`else` 会与离它最近的 `if` 组合。因此，在语句中\n\n点击此处查看代码图像\n\
  \n```\nif (x <= 0) if (x == 0) sign = 0; else sign = -1;\n```\n\n该 `else` 属于第二个\
  \ `if`。当然，使用大括号来明确这段代码是一个好主意：\n\n点击此处查看代码图像\n\n```\nif (x <= 0) { if (x == 0) sign\
  \ = 0; else sign = -1; }\n```\n\n重复的 `if . . . else if . . .` 备选项是常见的（参见图 3.9）。例如：\n\
  \n![Images](img/03fig08.jpg)\n\n**图 3.8** `if/else` 语句的流程图\n\n点击此处查看代码图像\n\n```\n\
  if (yourSales >= 2 * target)\n{\n   performance = \"Excellent\";\n   bonus = 1000;\n\
  }\nelse if (yourSales >= 1.5 * target)\n{\n   performance = \"Fine\";\n   bonus\
  \ = 500;\n}\nelse if (yourSales >= target)\n{\n   performance = \"Satisfactory\"\
  ;\n   bonus = 100;\n}\nelse\n{\n   System.out.println(\"You're fired\");\n}\n```\n\
  \n![Images](img/03fig09.jpg)\n\n**图 3.9** `if/else if`（多分支）的流程图\n\n### 3.8.3 循环\n\
  \n`while` 循环在条件为 `true` 时执行语句（该语句可能是一个块语句）。其通用形式为\n\n```\nwhile (condition) statement\n\
  ```\n\n如果条件在开始时为 `false`，则 `while` 循环将永远不会执行（参见图 3.10）。\n\n![Images](img/03fig10.jpg)\n\
  \n**图 3.10** `while` 语句的流程图\n\n代码列表 3.3 中的程序确定了为为你辛苦得来的退休生活储蓄特定金额需要多久，假设你每年存入相同的金额，并且资金按指定的利率产生。\n\
  \n在示例中，我们在循环体中增加计数器并更新当前积累的金额，直到总额超过目标金额。\n\n点击此处查看代码图像\n\n```\nwhile (balance <\
  \ goal)\n{\n   balance += payment;\n   double interest = balance * interestRate\
  \ / 100;\n   balance += interest;\n   years++;\n}\nSystem.out.println(years + \"\
  \ years.\");\n```\n\n（不要依赖这个程序来规划你的退休生活。它缺少一些细节，例如通货膨胀和预期寿命。）\n\n`while` 循环在顶部进行测试。因此，块中的代码可能永远不会被执行。如果你想确保某个块至少执行一次，你需要将测试移动到底部，使用\
  \ `do/while` 循环。它的语法如下：\n\n点击此处查看代码图像\n\n```\ndo statement while (condition);\n\
  ```\n\n该循环执行语句（通常是一个块），然后才测试条件。如果为 `true`，它会重复该语句并重新测试条件，依此类推。代码列表 3.4 中的代码计算你退休账户中的新余额，然后询问你是否准备好退休：\n\
  \n点击此处查看代码图像\n\n```\ndo\n{\n   balance += payment;\n   double interest = balance\
  \ * interestRate / 100;\n   balance += interest;\n   years++;\n   // print current\
  \ balance\n   . . .\n   // ask if ready to retire and get input\n   . . .\n}\nwhile\
  \ (input.equals(\"N\"));\n```\n\n只要用户回答 \"N\"，循环就会重复（参见图 3.11）。这个程序是一个需要至少进入一次的循环的良好示例，因为用户在决定余额是否足够退休之前，需要看到余额。\n\
