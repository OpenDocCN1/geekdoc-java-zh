  \ pack();\n    }\n\n    /**\n     * 向框架中添加滑动块\n     * @param slider 滑动块\n     *\
  \ @param description 描述\n     */\n    public void addSlider(JSlider slider, String\
  \ description)\n    {\n        sliderPanel.add(slider);\n        sliderPanel.add(new\
  \ JLabel(description));\n    }\n}\n```\n\n\n\n\n\n```\nActionListener listener =\
  \ . . .;\npasteItem.addActionListener(listener);\n```\n\n`JMenu.add(String s)` 方法可以方便地将菜单项添加到菜单的末尾。例如：\n\
  \n```\neditMenu.add(\"Paste\");\n```\n\n`add` 方法返回新创建的菜单项，因此你可以捕获它并添加监听器，如下：\n\n\
  点击此处查看代码图片\n\n```\nJMenuItem pasteItem = editMenu.add(\"Paste\");\npasteItem.addActionListener(listener);\n\
  ```\n\n菜单项经常会触发命令，这些命令也可以通过其他用户界面元素（如工具栏按钮）来激活。在第 10.4.5 节第 623 页的“**Actions”中，你已经学习了如何通过\
  \ `Action` 对象来指定命令。你定义一个实现 `Action` 接口的类（通常通过扩展便利类 `AbstractAction`），在 `AbstractAction`\
  \ 对象的构造函数中指定菜单项标签，并重写 `actionPerformed` 方法来持有菜单动作处理器。例如：\n\n点击此处查看代码图片\n\n```\n\
  var exitAction = new AbstractAction(\"Exit\") // 菜单项文本在此处\n   {\n      public void\
  \ actionPerformed(ActionEvent event)\n      {\n         //动作代码在此处\n         System.exit(0);\n\
  \      }\n   };\n```\n\n然后你可以将该 action 添加到菜单中：\n\n点击此处查看代码图片\n\n```\nJMenuItem exitItem\
  \ = fileMenu.add(exitAction);\n```\n\n此命令使用 action 名称为菜单添加一个菜单项。该 action 对象成为它的监听器。这仅仅是以下操作的一种方便快捷方式：\n\
  \n点击此处查看代码图片\n\n```\nvar exitItem = new JMenuItem(exitAction);\nfileMenu.add(exitItem);\n\
  ```\n\n### `javax.swing.JMenu` 1.2\n\n*   `JMenu(String label)`\n    使用给标签构造菜单。\n\
  *   `JMenuItem add(JMenuItem item)`\n    添加一个菜单项（或一个菜单）。\n*   `JMenuItem add(String\
  \ label)`\n    向此菜单添加一个带有给定标签的菜单项并返回该项。\n*   `JMenuItem add(Action a)`\n    向此菜单添加一个带有给定\
  \ action 的菜单项并返回该项。\n*   `void addSeparator()`\n    在菜单中添加一条分割线。\n*   `JMenuItem\
  \ insert(JMenuItem menu, int index)`\n    在指定的索引处向菜单添加一个新菜单项（或子菜单）。\n*   `JMenuItem\
  \ insert(Action a, int index)`\n    在指定的索引处添加一个带有给定 action 的新菜单项。\n*   `void insertSeparator(int\
  \ index)`\n    在菜单中添加一个分隔符。\n*   `void remove(int index)`\n*   `void remove(JMenuItem\
  \ item)`\n    从菜单中移除特定项。\n\n### `javax.swing.JMenuItem` 1.2\n\n*   `JMenuItem(String\
  \ label)`\n    使用给定标签构造菜单项。\n*   `JMenuItem(Action a)` 1.3\n    为给 action 构造菜单项。\n\
  \n### `javax.swing.AbstractButton` 1.2\n\n*   `void setAction(Action a)` 1.3\n \
  \   为此按钮或菜单项设置 action。\n\n### `javax.swing.JFrame` 1.2\n\n*   `void setJMenuBar(JMenuBar\
  \ menubar)`\n    为此框架设置菜单栏。\n\n### 11.5.2 菜单项中的图标\n\n菜单项与按钮非常相似。事实上，`JMenuItem`\
  \ 类扩展了 `AbstractButton` 类。就像按钮一样，菜单可以只有一个文本标签、仅有一个图标，或者两者兼有。你可以通过 `JMenuItem(String,\
  \ Icon)` 或 `JMenuItem(Icon)` 构造函数指定图标，也可以使用 `JMenuItem` 类继承自 `AbstractButton` 类的\
  \ `setIcon` 方法来设置它。这里是一个示例：\n\n点击此处查看代码图片\n\n```\nvar cutItem = new JMenuItem(\"\
  Cut\", new ImageIcon(\"cut.gif\"));\n```\n\n在图 11.17 中，你可以看到几个菜单项旁边的图标。默认情况下，菜单项文本位于图标的右侧。如果你希望文本置在左侧，请调用\
  \ `JMenuItem` 类继承自 `AbstractButton` 类的 `setHorizontalTextPosition` 方法。例如，调用：\n\n\
  点击此处查看代码图片\n\n```\ncutItem.setHorizontalTextPosition(SwingConstants.LEFT);\n```\n\
  \n会将菜单项文本移动到图标的左侧。\n\n你也可以给 action 添加图标：\n\n点击此处查看代码图片\n\n```\ncutAction.putValue(Action.SMALL_ICON,\
  \ new ImageIcon(\"cut.gif\"));\n```\n\n每当你从 action 构造一个菜单项时，`Action.NAME` 值将成为菜单项的文本，`Action.SMALL_ICON`\
  \ 值将成为图标。\n\n或者，你可以在 `AbstractAction` 构造函数中设置图标：\n\n点击此处查看代码图片\n\n```\ncutAction\
  \ = new\n   AbstractAction(\"Cut\", new ImageIcon(\"cut.gif\"))\n      {\n     \
  \    public void actionPerformed(ActionEvent event)\n         {\n            . .\
  \ .\n         }\n      };\n```\n\n### `javax.swing.JMenuItem` 1.2\n\n*   `JMenuItem(String\
  \ label, Icon icon)`\n    使用给定的标签和图标构造菜单项。\n\n### `javax.swing.AbstractButton` 1.2\n\
  \n*   `void setHorizontalTextPosition(int pos)`\n    设置文本相对于图标的水平位置。`pos` 参数为 `SwingConstants.RIGHT`（文本在图标右侧）或\
  \ `SwingConstants.LEFT`。\n\n### `javax.swing.AbstractAction` 1.2\n\n*   `AbstractAction(String\
  \ name, Icon smallIcon)`\n    使用给定的名称和小型图标构造 action。\n\n### 11.5.3 复选框与单选按钮\n\n\
  *复选框*和*单选按钮*菜单项在名称旁边显示复选框或单选按钮（参见图 11.17）。当用户选择菜单项时，该项会在选中和未选中状态之间切换。\n\n除了按钮装饰外，像处理其他项一样处理这些菜单项。例如，这里是创建一个复选项的方法：\n\
  \n点击此处查看代码图片\n\n```\nvar readonlyItem = new JMenuItem(\"Read-only\");\noptionsMenu.add(readonlyItem);\n\
  ```\n\n单选菜单项的工作与普通按钮类似。你必须将它们添加到按钮组中。当组中的一个按钮被选中时，其他将取消选择。\n\n点击此处查看代码图片\n\n```\n\
  var group = new ButtonGroup();\nvar insertItem = new JMenuItem(\"Insert\");\ninsertItem.setSelected(true);\n\
  var overtypeItem = new JMenuItem(\"Overtype\");\ngroup.add(insertItem);\ngroup.add(overtypeItem);\n\
  optionsMenu.add(insertItem);\noptionsMenu.add(overtypeItem);\n```\n\n对于这些菜单项，你并不一定在用户选择项时接收通知。相反，你可以简单地使用\
  \ `isSelected` 方法来测试菜单项的状态。（当然，这意味着你应该将菜单项引用存储在实例字段中。）使用 `setSelected` 方法设置状态。\n\
  \n### `javax.swing.JCheckBoxMenuItem` 1.2\n\n*   `JCheckBoxMenuItem(String label)`\n\
  \    使用给定标签构造复选框菜单项。\n*   `JCheckBoxMenuItem(String label, boolean state)`\n   \
  \ 使用给定的标签和初始状态构造复选框菜单项（`true` 为选中）。\n\n### `javax.swing.JRadioButtonMenuItem` 1.2\n\
  \n*   `JRadioButtonMenuItem(String label)`\n    使用给定标签构造单选按钮菜单项。\n*   `JRadioButtonMenuItem(String\
  \ label, boolean state)`\n    使用给定的标签和初始状态构造单选按钮菜单项（`true` 为选中）。\n\n### `javax.swing.AbstractButton`\
  \ 1.2\n\n*   `boolean isSelected()`\n*   `void setSelected(boolean state)`\n   \
  \ 获取或设置此项的选中状态（`true` 为选中）。\n\n### 11.5.4 弹出菜单\n\n*弹出菜单*（pop-up menu）是一种没有附加到菜单栏上而是浮动在某处的菜单（参见图\
  \ 11.18）。\n\n![Images](img/011fig18.jpg)\n\n**图 11.18** 一个弹出菜单\n\n\n\n\n创建一个像创建普通菜单一样的弹出菜单，只不过弹出菜单没有标题。\n\
  \n```\nvar popup = new JPopupMenu();\n```\n\n然后，像通常一样添加你的菜单项：\n\n点击此处查看代码图片\n\n\
  ```\nvar item = new JMenuItem(\"Cut\");\nitem.addActionListener(listener);\npopup.add(item);\n\
  ```\n\n与始终显示在框架顶部的普通菜单栏不同，你必须使用 `show` 方法显式地显示弹出菜单。使用父组件的坐标系指定父组件和弹出菜单的位置。例如：\n\n\
  ```\npopup.show(panel, x, y);\n```\n\n通常情况下，你希望在用户点击特定的鼠标按钮时弹出菜单——这就是所谓的 `pop-up\
  \ trigger`（弹出触发器）。在 Windows 和 Linux 中，弹出触发器是非主鼠标按钮（通常是鼠标右键）。若想在用户使用弹出触发器点击组件时弹出菜单，只需调用方法\
  \ `setComponentPopupMenu` 即可：\n\n点击此处查看代码图片\n\n```\ncomponent.setComponentPopupMenu(popup);\n\
  ```\n\n极少数情况下，你可能会将一个组件放在另一个带有弹出菜单的组件内部。子组件可以通过调用以下方法继承父组件的弹出菜单：\n\n点击此处查看代码图片\n\
  \n```\nchild.setInheritsPopupMenu(true);\n```\n\n### `javax.swing.JPopupMenu` 1.2\n\
  \n*   `void show(Component c, int x, int y)`\n    在组件 `c` 之上显示弹出菜单，左上角位于 `(x, y)`（在\
  \ `c` 的坐标空间内）。\n*   `boolean isPopupTrigger(MouseEvent event)` 1.3\n    如果鼠标事件是弹出菜单的触发器，则返回\
  \ `true`。\n\n### `java.awt.event.MouseEvent` 1.1\n\n*   `boolean isPopupTrigger()`\n\
  \    如果此鼠标事件是弹出菜单的触发器，则返回 `true`。\n\n### `javax.swing.JComponent` 1.2\n\n*   `JPopupMenu\
  \ getComponentPopupMenu()` 5\n*   `void setComponentPopupMenu(JPopupMenu popup)`\
  \ 5\n    获取或设置此组件的弹出菜单。\n*   `boolean getInheritsPopupMenu()` 5\n*   `void setInheritsPopupMenu(boolean\
  \ b)` 5\n    获取或设置 `inheritsPopupMenu` 属性。如果该属性被设置且此组件的弹出菜单为 `null`，它将使用父组件的弹出菜单。\n\
  \n#### 11.5.5 键盘助记（Mnemonics）与加速键\n\n对于经验丰富的用户来说，通过 `keyboard mnemonics`（键盘助记）选择菜单项是非常方便的。你可以通过在菜单项构造函数中指定助记字母，为菜单项创建一个键盘助记：\n\
  \n点击此处查看代码图片\n\n```\nvar aboutItem = new JMenuItem(\"About\", 'A');\n```\n\n键盘助记会自动显示在菜单中，且助记字母带有下划线（参见图\
  \ 11.19）。例如，在上一个示例定义的项中，标签将显示为带有下划线字母 ‘A’ 的 “About”。当菜单显示时，用户只需按下 A 键，该菜单项就会被选中。（如果助记字母不是菜单字符串的一部分，输入它仍然可以选中该项，但助记不会显示在菜单中。自然地，这种不可见的助记其用性存疑。）\n\
  \n![Images](img/011fig19.jpg)\n\n**图 11.19** 键盘助记\n\n有时，你并不想为匹配助记的菜单项的第一个字母加上下划线。例如，如果你为“Save\
  \ As”菜单项设置了助记 ‘A’，那么给第二个 ‘A’（Save As）加上下划线更合理。你可以通过调用 `setDisplayedMnemonicIndex`\
  \ 方法来指定你想要加下划线的字符。\n\n如果你有一个 `Action` 对象，可以把助记作为 `Action.MNEMONIC_KEY` 键的值添加，如下：\n\
  \n点击此处查看代码图片\n\n```\naboutAction.putValue(Action.MNEMONIC_KEY, Integer.valueOf('A'));\n\
  ```\n\n你只能在菜单项的构造函数中提供助记字母，而不能在菜单的构造函数中提供。要为菜单附加助记，调用 `setMnemonic` 方法：\n\n点击此处查看代码图片\n\
  \n```\nvar helpMenu = new JMenu(\"Help\");\nhelpMenu.setMnemonic('H');\n```\n\n\
  要从菜单栏选择顶级菜单，请同时按下 Alt 键和助记字母。例如，按下 Alt+H 从菜单栏选择 Help 菜单。\n\n键盘助记允许你从当前打开的菜单中选择子菜单或菜单项。相比之下，`accelerators`（加速键）是快捷键，让你无需打开菜单即可选择菜单项。例如，许多程序将加速键\
  \ Ctrl+O 和 Ctrl+S 绑定到文件菜单中的“打开”和“保存”项。使用 `setAccelerator` 方法为菜单项附加加速键。该方法接受一个 `Keystroke`\
  \ 类型的对象。例如，将 Ctrl+O 附加到 `openItem`：\n\n```\nopenItem.setAccelerator(KeyStroke.getKeyStroke(\"\
  Ctrl O\")); \n```\n\n输入加速组合会自动选择菜单选项并触发动作事件，就像用户手动选择了它一样。加速键只能附加到菜单项，而不能附加到菜单。加速键实际上不会打开菜单。当加速键附加到菜单项时，键组合会自动显示在菜单中（参见图\
  \ 11.20）。\n\n![Images](img/note.jpg) 注意\n\n在 Windows 下，Alt+F4 关闭窗口。这不是需要编程的加速键。它是操作系统定义的快捷键。无论菜单是否有\
  \ Close 项，此键组合都会触发 `WindowClosing` 事件。\n\n![Images](img/011fig20.jpg)\n\n**图 11.20**\
  \ 加速键\n\n#### 11.5.6 启用与禁用菜单项\n\n有时，特定的菜单项只在某些上下文可以使用。例如，当文档以只读模式打开时，“保存”菜单项没有意义。当然，我们可以使用\
  \ `JMenu.remove` 方法从菜单中移除它，但用户会对内容不断变化的菜单感到意外。相反，更好的做法是禁用指向暂时不命令的菜单项。禁用的菜单项显示为灰色且无法选择（参见图\
  \ 11.21）。\n\n要启用或禁用菜单项，使用 `setEnabled` 方法：\n\n```\nsaveItem.setEnabled(false);\n\
  ```\n\n\n\n启用和禁用菜单项有两种策略。每当情况变化时，你都可以对相关的菜单项或操作（action）调用 `setEnabled`。例如，一旦文档被设置为只读模式，你就可以找到“保存”和“另存为”菜单项并禁用它们。或者，你也可以在显示菜单之前禁用这些项。要做到这一点，你必须为“菜单选中”事件注册一个监听器。`javax.swing.event`\
  \ 包定义了一个 `MenuListener` 接口，其中包含三个方法：\n\n点击此处查看代码图像\n\n```\nvoid menuSelected(MenuEvent\
  \ event)\nvoid menuDeselected(MenuEvent event)\nvoid menuCanceled(MenuEvent event)\n\
  ```\n\n`menuSelected` 方法在菜单显示*之前*被调用。因此，它可以被用于禁用或启用菜单项。以下代码显示了当选中“只读”复选框菜单项时，如何禁用“保存”和“另存为”操作：\n\
  \n点击此处查看代码图像\n\n```\npublic void menuSelected(MenuEvent event)\n{\n   saveAction.setEnabled(!readonlyItem.isSelected());\n\
  \   saveAsAction.setEnabled(!readonlyItem.isSelected());\n}\n```\n\n![Images](img/caution.jpg)\
  \ 注意\n\n在显示菜单正之前禁用菜单项是一个聪明的主意，但它对于带有快捷键的菜单项是无效的。因为当按下快捷键时，菜单永远不会打开，因此操作不会被禁用，仍然会通过快捷键触发。\n\
  \n### `javax.swing.JMenuItem` 1.2\n\n*   `void setEnabled(boolean b)`\n    启用或禁用菜单项。\n\
  \n### `javax.swing.event.MenuListener` 1.2\n\n*   `void menuSelected(MenuEvent e)`\n\
  \    在菜单被选中后调用，在菜单打开之前调用。\n\n*   `void menuDeselected(MenuEvent e)`\n    在菜单被取消选中后调用，在菜单关闭后调用。\n\
  \n*   `void menuCanceled(MenuEvent e)`\n    在菜单被取消时调用，例如用户点击了菜单外部。\n\nListing 11.6\
