  \n原因是 `ArrayList` 类并不是 Java 语言的一部分；它只是标准库中提供的一个工具类。\n\n与其使用舒适的 `[]` 语法来访问或更改数组元素，不如使用\
  \ `get` 和 `set` 方法。\n\n例如，设置第 `i` 个元素，使用：\n\n```\nstaff.set(i, harry);\n```\n\n\
  这对于数组 `a` 等同于\n\n```\na[i] = harry;\n```\n\n（和数组一样，索引值从 0 开始。）\n\n![图像](img/caution.jpg)\
  \ 注意\n\n在数组列表的大小大于 `i` 之前，不要调用 `list.set(i, x)`。例如，以下代码是错误的：\n\n点击查看代码图像\n\n```\n\
  var list = new ArrayList<Employee>(100); // 容量为 100，大小为 0\nlist.set(0, x); // 还没有元素\
  \ 0\n```\n\n\n\n使用 `add` 方法而不是 `set` 方法来填充数组，仅使用 `set` 来替换之前添加的元素。\n\n要获取数组列表元素，请使用\n\
  \n```\nEmployee e = staff.get(i);\n```\n\n这等同于\n\n```\nEmployee e = a[i];\n```\n\
  \n![Images](img/note.jpg) 注释\n\n在过去没有泛型类的时代，原始类型 `ArrayList` 类的 `get` 方法只能返回一个 `Object`。因此，`get`\
  \ 的调用者必须将返回的值强制转换为所需的类型：\n\n点击此处查看代码图片\n\n```\nEmployee e = (Employee) staff.get(i);\n\
  ```\n\n原始类型 `ArrayList` 也有点危险性。它的 `add` 和 `set` 方法接受任何类型的对象。调用\n\n```\nstaff.set(i,\
  \ \"Harry Hacker\");\n```\n\n代码在编译时甚至不会发出警告就能通过，只有当你取出该对象并尝试对其进行强制转换时，才会遇到麻烦。如果你改用\
  \ `ArrayList<Employee>`，编译器将检测到这个错误。\n\n通过以下技巧，你有时可以兼顾两者的优点——灵活的增长和方便的元素访问。首先，创建一个数组列表并添加所有元素：\n\
  \n点击此处查看代码图片\n\n```\nvar list = new ArrayList<X>();\nwhile (. . .)\n{\n   x = .\
  \ . .;\n   list.add(x);\n}\n```\n\n完成后，使用 `toArray` 方法将元素复制到数组中：\n\n```\nvar a =\
  \ new X[list.size()];\nlist.toArray(a);\n```\n\n有时，你需要在数组列表的中间添加元素。使用带有索引参数的 `add`\
  \ 方法：\n\n```\nint n = staff.size() / 2;\nstaff.add(n, e);\n```\n\n位置 `n` 及以上的元素将向上移动，以为新条目留出空间。如果插入后数组列表的新大小超过了容量，则数组列表会重新分配其存储数组。\n\
  \n同样，你也可以从数组列表的中间删除一个元素：\n\n```\nEmployee e = staff.remove(n);\n```\n\n位于其上方的元素将向下复制，数组的大小将减一。\n\
  \n插入和删除元素的效率并不高。对于小型数组列表来说，这可能不需要担心。但如果你存储了许多元素并频繁在集合中间插入和删除，请考虑使用链表（linked list）。我在第\
  \ 9 章中解释了如何使用链表编程。\n\n你可以使用“for each”循环来遍历数组列表的内容：\n\n```\nfor (Employee e : staff)\n\
  \   对 e 执行某些操作\n```\n\n该循环的效果与以下\n\n点击此处查看代码图片相同\n\n```\nfor (int i = 0; i < staff.size();\
  \ i++)\n{\n   Employee e = staff.get(i);\n   对 e 执行某些操作\n}\n```\n\n列表 5.7 是对第 4\
  \ 章中 `EmployeeTest` 程序的修改。`Employee[]` 数组被 `ArrayList<Employee>` 取代。请注意以下变化：\n\n\
  * 你不需要指定数组的大小。\n* 你使用 `add` 来添加任意数量的元素。\n* 你使用 `size()` 代替 `length` 来统计元素个数。\n*\
  \ 你使用 `a.get(i)` 代替 `a[i]` 来访问元素。\n\n**列表 5.7** `arrayList/ArrayListTest.java`\n\
  \n点击此处查看代码图片\n\n```\n 1 package arrayList;\n 2\n 3 import java.util.*;\n 4\n 5 /**\n\
  \ 6  * 此程序演示了 ArrayList 类。\n 7  * @version 1.11 2012-01-26\n 8  * @author Cay Horstmann\n\
  \ 9  */\n10 public class ArrayListTest\n11 {\n12    public static void main(String[]\
  \ args)\n13    {\n14       // 用三个 Employee 对象填充 staff 数组列表\n15       var staff =\
  \ new ArrayList<Employee>();\n16\n17       staff.add(new Employee(\"Carl Cracker\"\
  , 75000, 1987, 12, 15));\n18       staff.add(new Employee(\"Harry Hacker\", 50000,\
  \ 1989, 10, 1));\n19       staff.add(new Employee(\"Tony Tester\", 40000, 1990,\
  \ 3, 15));\n20\n21       // 将每个人的薪水增加 5%\n22       for (Employee e : staff)\n23\
  \          e.raiseSalary(5);\n24\n25       // 打印所有 Employee 对象的信息\n26       for\
  \ (Employee e : staff)\n27          System.out.println(\"name=\" + e.getName() +\
  \ \",salary=\" + e.getSalary() + \",hireDay=\"\n28             + e.getDay());\n\
  29    }\n30 }\n```\n\n### 5.3 类型列表与原始列表的兼容性\n\n在本节中，你将看到如何与不使用泛型的代码进行交互。假设你有以下类：\n\
  \n点击此处查看代码图片\n\n```\npublic class EmployeeDB\n{\n   public void update(ArrayList\
  \ list) { . . }\n   public ArrayList find(String query) { . . }\n}\n```\n\n你可以无需转换就将类型列表传递给\
  \ `update` 方法。\n\n点击此处查看代码图片\n\n```\nArrayList<Employee> staff = . . .;\nemployeeDB.update(staff);\n\
  ```\n\n![Images](img/caution) 注意\n\n即使编译器没有产生错误或警告，`update` 方法可能会向数组列表添加非 `Employee`\
  \ 的元素。当你取出这些元素时，就会发生异常。这听起来很可怕，但如果你仔细考虑，这种行为在泛型引入之前如此。\n\n相反，当你将原始 `ArrayList` 赋值给类型列表时，你会得到一个警告。\n\
  \n点击此处查看代码图片\n\n```\nArrayList<Employee> result = employeeDB.find(query); //产生警告\n\
  ```\n\n![Images](img/note.jpg) 注释\n\n要查看警告的文本，请在编译时使用选项 `-Xlint:unchecked`。\n\n\
  强制转换并让警告消失。\n\n点击此处查看代码图片\n\n```\nArrayList<Employee> result = (ArrayList<Employee>)\
  \ employeeDB.find(query);\n   //产生另一个警告\n```\n\n相反，你会得到另一个警告，提示该强制转换具有误导性。\n\n这是\
  \ Java 泛型类型的一个相当遗憾的局限性。为了兼容性，编译器在检查未违反类型规则后，会将类型数组列表转换为原始 `ArrayList` 对象。在程序运行时，所有的数组列表都是相同的——虚拟机中没有类型参数。因此，强制转换\
  \ `(ArrayList)` 和 `(ArrayList<Employee>)` 执行的是相同的运行时检查。\n\n当你满意后，可以为接收转换的变量标记 `@SuppressWarnings(\"\
  unchecked\")` 注解，如下所示：\n\n点击此处查看代码图片\n\n```\n@SuppressWarnings(\"unchecked\") ArrayList<Employee>\
  \ result\n      = (ArrayList<Employee>) employeeDB.find(query);\n```\n\n## 5.4 包装类与自动装箱\n\
  \n\n\n偶尔，你可能将 `int` 等原始类型转换为对象。所有原始类型都有对应的类。例如，`Integer` 类对应于原始类型 `int`。这些类通常被称为*包装类*（wrappers）。包装类的名字很明确：`Integer`、`Long`、`Float`、`Double`、`Short`、`Byte`、`Character`（前六者都继承自父类\
  \ `Number`）。包装类是不可变的——一旦构造就无法更改其值。它们也是 `final` 的，因此不能被子类。\n\n假设我们想要一个整数数组。遗憾的是，方括号内的类型不能是原始类型，例如\
  \ `ArrayList<int>`。在这里，`Integer` 包装类出现了。点击此处查看代码图像\n\n```\nvar list = new ArrayList<Integer>();\n\
  ```\n\n![Images](img/caution.jpg) 注意\n\n`ArrayList<Integer>` 的效率远低于 `int[]`，因为每个值都被单独包装在对象中。只有当程序员的便利性比效率更重要时，你才会使用这种结构。\n\
  \n幸运的是，有一个用的特性可以方便地向 `ArrayList<Integer>` 添加 `int` 类型的元素。调用\n\n```\nlist.add(3);\n\
  ```\n\n会自动翻译为\n\n```\nlist.add(Integer.valueOf(3));\n```\n\n这种转换被称为*自动装箱*（autoboxing）。\n\
  \n![Images](img/note.jpg) 注意\n\n你可能认为*自动拆箱*会更一致，但“装箱”这一比喻源自 C#。相反，当你将 `Integer`\
  \ 对象赋值给 `int` 值时，它会自动拆箱。也就是说，编译器会将：\n\n```\nint n = list.get(i);\n```\n\n点击此处查看代码图像\n\
  \n```\nint n = list.get(i).intValue();\n```\n\n自动装箱和拆箱甚至适用于算术表达式。例如，你可以对引用使用增加运算符：\n\
  \n```\nInteger n = 3;\nn++;\n```\n\n编译器会自动插入指令拆箱对象、增加值，然后将其装箱。\n\n在大多数情况下，你会认为原始类型和它们的包装类是同一的。它们仅在一点上存在显著差异：标识性（identity）。如你所知，应用于对象的\
  \ `==` 运算符测试的是对象是否具有相同的内存位置。因此，以下比较可能会失败：\n\n```\nInteger a = 1000;\nInteger b =\
  \ 1000;\nif (a == b) . .\n```\n\n然而，Java 实现*可能会*将经常出现的值包装成相同的对象，从而使比较成功。这种歧义不是你想要的。比较包装对象时，解决方法是调用\
  \ `equals` 方法。\n\n![Images](img/note.jpg) 注意\n\n自动装箱规范要求 `boolean`、`byte`、`char`、`short`\
  \ 以及在 `-128` 到 `127` 之间的 `int` 被包装成固定对象。例如，如果在前一个示例中 `a` 和 `b` 初始化为 `100`，那么比较将会成功。\n\
  \n![Images](img/tip.jpg) 提示\n\n永远不要包装对象的标识性。不要用 `==` 比较它们，也不将它们用作锁（见第 14 章）。\n\n\
  不要使用包装类的构造函数。它们已过用并计划移除。例如，使用 `Integer.valueOf(1000)`，永远不要 `new Integer(1000)`。或者，简单依赖自动装箱：`Integer\
  \ a = 1000`。\n\n关于自动装箱还有一些细节。首先，由于包装类引用可以为 `null`，自动拆箱可能会抛出 `NullPointerException`：\n\
  \n点击此处查看代码图像\n\n```\nInteger n = null;\nSystem.out.println(2 * n); // 抛出 NullPointerException\n\
  ```\n\n此外，如果在条件表达式中混合使用 `Integer` 和 `Double` 类型，则 `Integer` 值会被拆箱、提升为 `double` 并装箱为\
  \ `Double`：\n\n点击此处查看代码图像\n\n```\nInteger n = 1;\nDouble x = 2.0;\nSystem.out.println(true\
  \ ? n : x); // 输出 1.0\n```\n\n最后，让我们强调装箱和拆箱是*编译器*提供的便利，而不是虚拟机。编译器在生成类的字节码时会插入必要的调用。虚拟机只需执行这些字节码。\n\
  \n![Images](img/note.jpg) 注意\n\n未来的 Java 版本将允许类似于原始类型的用户定义类型——值不存储在对象内部。例如，一个具有\
  \ `double` 字段 `x` 和 `y` 的原始类型 `Point` 值只是内存中一个 16 字节块，包含两个相邻的 `double` 值。你可以复制它，但无法引用它。\n\
  \n如果你需要引用，请使用 `Integer` 类。在某个时刻，原始类将与这些类统一。Java 的设计者找到了放置 `Integer` 类的方便位置。要将字符串转换为整数，使用以下语句：\n\
  \n```\nint x = Integer.parseInt(s);\n```\n\n偶尔，你需要将 `int` 等原始类型转换为对象。所有原始类型都有对应的类。例如，`Integer`\
  \ 类对应于原始类型 `int`。这些类通常被称为*包装类*（wrappers）。\n\n\n\n\n## 5.5 变数量参数方法\n\n可以提供可以使用变数量参数调用的方法。（这些有时被称为“可变参数”（varargs）方法。）\n\
  \n你已经见过这样的方法了：`printf`。例如，以下调用\n\n```\nSystem.out.printf(\"%d\", n);\n```\n\n和\n\
  \n点击此处查看代码图像\n\n```\nSystem.out.printf(\"%d %s\", n, \"widgets\");\n```\n\n这两个调用都指向了同一个方法，尽管一个调用有两个参数，而另一个调用有三个。\n\
  \n`printf` 方法的定义如下：\n\n点击此处查看代码图像\n\n```\npublic class PrintStream\n{\n   public\
  \ PrintStream printf(String fmt, Object... args)\n   {\n      return format(fmt,\
  \ args);\n   }\n}\n```\n\n在这里，省略号 `...` 是 Java 代码的一部分。它表示该方法可以接收任意数量的对象（除 `fmt`\
  \ 参数外）。\n\n`printf` 方法实际上接收两个参数：格式字符串和一个持有所有其他参数的 `Object[]` 数组。（如果调用者提供整数或其他基本类型值，自动装箱会将它们转换为对象。）它现在面临着一项艰巨的任务：扫描\
  \ `fmt` 字符串并将第 `i` 个格式说明符与值 `args[i]` 相匹配。\n\n换句话，对于 `printf` 的实现者来说，`Object...`\
  \ 参数类型与 `Object[]` 完全相同。\n\n编译器需要转换每个对 `printf` 的调用，将参数封装成数组并在必要时进行自动装箱：\n\n点击此处查看代码图像\n\
  \n```\nSystem.out.printf(\"%d %s\", new Object[] { Integer.valueOf(n), \"widgets\"\
  \ } );\n```\n\n你可以定义自己的带有变数量参数的方法，并且可以为参数指定任何类型，即使是基本类型。这里有一个简单的示例：一个计算变数量数值最大值的函数。\n\
  \n点击此处查看代码图像\n\n```\npublic static double max(double... values)\n{\n   double largest\
  \ = Double.NEGATIVE_INFINITY;\n   for (double v : values) if (v > largest) largest\
  \ = v;\n   return largest;\n}\n```\n\n只需像这样调用函数即可：\n\n点击此处查看代码图像\n\n```\ndouble\
  \ m = max(3.1, 40.4, -5);\n```\n\n编译器向 `max` 函数传递了一个 `new double[] { 3.1, 40.4,\
  \ -5 }`。\n\n![图像](img/note.jpg) 提示\n\n将数组作为带有变数量参数方法的最后一个参数传递是合法的。例如：\n\n点击此处查看代码图像\n\
  \n```\nSystem.out.printf(\"%d %s\", new Object[] { Integer.valueOf(1), \"widgets\"\
  \ } );\n```\n\n因此，你可以重新定义一个最后一个参数为数组的现有函数，将其定义为带有变数量参数的方法，而不会破坏任何现有代码。例如，`MessageFormat.format`\
  \ 在 Java 5 中通过这种方式得到了增强。如果你愿意，甚至可以将 `main` 方法声明为：\n\n点击此处查看代码图像\n\n```\npublic static\
  \ void main(String... args)\n```\n\n## 5.6 抽象类\n\n随着你在继承层次结构中移动，类变得越来越通用，并且可能更加抽象。在某个时刻，祖先类变得如此通用，以至于你认为它更多是其他类的基类，而不是你想要使用的具有特定实例的类。例如，考虑我们\
  \ `Employee` 类层次结构的扩展。员工是人，学生也是人。让我们扩展类层次结构以包含 `Person` 和 `Student` 类。图 5.2 显示了这些类之间的继承关系。\n\
  \n![图像](img/05fig02.jpg)\n\n**图 5.2** `Person` 及其子类的继承图\n\n为什么要费力进行如此高层次的抽象呢？有些属性对每个人来说都有意义，例如名字。学生和员工都有名字，引入一个共同的超类让我们可以将\
  \ `getName` 方法提取到继承层次结构中的更高层次。\n\n现在让我们添加另一个方法 `getDescription`，其目的是返回该人的简要描述，例如：\n\
  \n点击此处查看代码图像\n\n```\n一个工资为 $50,000.00 的员工\n一个主修计算机专业的学生\n```\n\n为 `Employee` 和 `Student`\
  \ 类实现这个方法很容易。但你可以在 `Person` 类中提供什么信息呢？`Person` 类除了名字之外对这个人一无所知。当然，你可以实现 `Person.getDescription()`\
  \ 返回一个空字符串。但有更好的方法。如果你使用 `abstract` 关键字，你完全不需要实现该方法。\n\n点击此处查看代码图像\n\n```\npublic\
  \ abstract String getDescription();\n   // 不需要实现\n```\n\n为了更加清晰起见，包含一个或多个抽象方法的类本身必须声明为抽象类。\n\
  \n点击此处查看代码图像\n\n```\npublic abstract class Person\n{\n   . . .\n   public abstract\
  \ String getDescription();\n}\n```\n\n除了抽象方法，抽象类还可以有字段和具体方法。例如，`Person` 类存储了人的名字，并有一个返回它的具体方法。\n\
  \n点击此处查看代码图像\n\n```\npublic abstract class Person\n{\n   private String name;\n\n\
  \   public Person(String name)\n   {\n      this.name = name;\n   }\n\n   public\
  \ abstract String getDescription();\n\n   public String getName()\n   {\n      return\
  \ name;\n   }\n}\n```\n\n![图像](img/tip.jpg) 提示\n\n有些程序员没有意识到抽象类可以拥有具体方法。你应该始终将公共字段和方法（无论是否抽象）移动到父类（无论是否抽象）。\n\
  \n抽象方法是子类中实现方法的占位符。当你扩展一个抽象类时，你有两种选择。你可以留下部分或全部抽象方法；那么子类也必须标记为抽象。或者你可以定义所有方法，这样子类就不再是抽象的。\n\
  \n例如，我们定义了一个扩展抽象类 `Person` 的 `Student` 类。`Student` 类中没有方法都是抽象的，因此不需要声明为抽象类。\n\n\
  抽象类不能实例化。也就是说，如果一个类被声明为 `abstract`，则无法创建该类的对象。例如，表达式\n\n```\nnew Person(\"Vince\
  \ Vu\")\n```\n\n是一个错误。然而，你可以创建具体类的对象。\n\n注意你你仍然创建抽象类的变量，但这样的变量必须指向非抽象子类的对象。例如：\n\
  \n```\nPerson p = new Student(\"Vince Vu\", \"Economics\");\n```\n\n在这里 `p` 是抽象类型\
  \ `Person` 的变量，指向非抽象子类 `Student` 的实例。\n\n![图像](img/cnote.jpg) C++ 提示\n\n在 C++ 中，抽象方法被称为纯虚函数，并在结尾带有\
  \ `= 0`，例如：\n\n点击此处查看代码图像\n\n```\nclass Person // C++\n{\npublic:\n   virtual string\
  \ getDescription() = 0;\n   . . .\n};\n```\n\n如果 C++ 类至少有一个纯虚函数，它就是抽象的。在 C++ 中没有特殊的关键字来表示抽象类。\n\
  \n让我们定义扩展抽象类 `Person` 的具体子类 `Student`：\n\n点击此处查看代码图像\n\n```\npublic class Student\
  \ extends Person\n{\n   private String major;\n\n   public Student(String name,\
  \ String major)\n   {\n      super(name);\n      this.major = major;\n   }\n\n \
  \  public String getDescription()\n   {\n      return \"a student majoring in \"\
  \ + major;\n   }\n}\n```\n\n\n\n\n\n`Student` 类定义了 `getDescription` 方法。因此，`Student`\
  \ 类中的所有方法都是具体的，该类不再是一个抽象类。\n\n如列表 5.8 所示的程序定义了抽象父类 `Person`（列表 5.9）以及两个具体的子类 `Employee`（列表\
  \ 5.10）和 `Student`（列表 5.11）。我们用一个 `Person` 引用用的数组填充了员工和学生对象：\n\n点击此处查看代码图片\n\n```\n\
  var people = new Person[2];\npeople[0] = new Employee(. . .);\npeople[1] = new Student(.\
  \ . .);\n```\n\n然后我们打印了这些对象的名称和描述：\n\n点击此处查看代码图片\n\n```\nfor (Person p : people)\n\
  \   System.out.println(p.getName() + \", \" + p.getDescription());\n```\n\n有些人对以下调用感到困惑：\n\
  \n```\np.getDescription()\n```\n\n这难道不是调用了一个未定义的方法吗？请记住，变量 `p` 永远不会引用一个 `Person`\
  \ 对象，因为无法构造抽象类 `Person` 的对象。变量 `p` 始终引用如 `Employee` 或 `Student` 等具体子类的对象。对于这些对象，`getDescription`\
  \ 方法是已经定义过的。\n\n你是否可以完全从 `Person` 父类中省略该抽象方法，而仅在 `Employee` 和 `Student` 子类中定义 `getDescription`\
  \ 方法呢？如果你这样做，你将无法在变量 `p` 上调用 `getDescription` 方法。编译器会确保你只调用在类中声明的方法。\n\n抽象方法是 Java\
  \ 编程语言中的一个重要概念。你最可能会*接口*（interfaces）内部遇到它们。关于接口的更多信息，请参阅第 6 章。\n\n**列表 5.8** `abstractClasses/PersonTest.java`\n\
  \n点击此处查看代码图片\n\n```\n 1 package abstractClasses;\n 2\n 3 /**\n 4  * 此程序演示了抽象类。\n\
  \ 5  * @version 1.01 2004-02-21\n 6  * @author Cay Horstmann\n 7  */\n 8 public\
  \ class PersonTest\n 9 {\n10    public static void main(String[] args)\n11    {\n\
  12       var people = new Person[2];\n13\n14       // 用 Student 和 Employee 对象填充\
  \ people 数组\n15       people[0] = new Employee(\"Harry Hacker\", 50000, 1989, 10,\
  \ 1);\n16       people[1] = new Student(\"Maria Morris\", \"computer science\");\n\
  17\n18      // 输出所有 Person 对象的名称和描述\n19      for (Person p : people)\n20       \
  \  System.out.println(p.getName() + \", \" + p.getDescription());\n21    }\n22 }\n\
  ```\n\n**列表 5.9** `abstractClasses/Person.java`\n\n点击此处查看代码图片\n\n```\n 1 package\
  \ abstractClasses;\n 2\n 3 public abstract class Person\n 4 {\n 5    public abstract\
  \ String getDescription();\n 6    private String name;\n 7\n 8    public Person(String\
  \ name)\n 9    {\n10       this.name = name;\n11    }\n12\n13    public String getName()\n\
  14    {\n15       return name;\n16    }\n17 }\n```\n\n**列表 5.10** `abstractClasses/Employee.java`\n\
  \n点击此处查看代码图片\n\n```\n 1 package abstractClasses;\n 2\n 3 import java.time.*;\n 4\n\
  \ 5 public class Employee extends Person\n 6 {\n 7    private double salary;\n 8\
  \    private LocalDate hireDay;\n 9\n10    public Employee(String name, double salary,\
  \ int year, int month, int day)\n11    {\n12       super(name);\n13       this.salary\
  \ = salary;\n14       hireDay = LocalDate.of(year, month, day);\n15    }\n16\n17\
  \    public double getSalary()\n18    {\n19       return salary;\n20    }\n21\n\
  22    public LocalDate getHireDay()\n23    {\n24       return hireDay;\n25    }\n\
  26\n27    public String getDescription()\n28    {\n29       return \"an employee\
  \ with a salary of $%.2f\".formatted(salary);\n30    }\n31\n32    public void raiseSalary(double\
  \ byPercent)\n33    {\n34       double raise = salary * byPercent / 100;\n35   \
  \    salary += raise;\n36    }\n37}\n```\n\n**列表 5.11** `abstractClasses/Student.java`\n\
  \n点击此处查看代码图片\n\n```\n 1 package abstractClasses;\n 2\n 3 public class Student extends\
  \ Person\n 4 {\n 5    private String major;\n 6\n 7    public Student(String name,\
  \ String major)\n 8\n    {\n9       super(name);\n10      this.major = major;\n\
  11   }\n12\n13   public String getDescription()\n14   {\n15      return \"a student\
  \ majoring in \" + major;\n16   }\n17 }\n```\n\n## 5.7 枚举类 (Enumeration Classes)\n\
  \n你在第 3 章中已经见过如何定义枚举类型。这里有一个典型的示例：\n\n点击此处查看代码图片\n\n```\npublic enum Size { SMALL,\
  \ MEDIUM }\n```\n\n此声明定义的类型实际上是一个类。无法构造新对象。因此，你永远不需要使用 `equals` 来比较值。直接使用 `==` 即可。\n\
  \n如果你愿意，可以为枚举类型添加构造函数、方法和字段。当然，构造函数只在构造枚举常量时被调用。这里有一个示例：\n\n点击此处查看代码图片\n\n```\n\
  public enum Size\n{\n   SMALL(\"S\"), MEDIUM(\"M\"), LARGE(\"L\"), EXTRA_LARGE(\"\
  XL\");\n\n   private String abbreviation;\n\n   Size(String abbreviation) { this.abbreviation\
  \ = abbreviation; }\n\n   public String getAbbreviation() { return abbreviation;\
  \ }\n}\n```\n\n所有枚举类型都是抽象类 `Enum` 的子类。它们从该类继承了许多方法。最有用的是 `toString`，它返回枚举量的名称。例如，`Size.SMALL.toString()`\
  \ 返回字符串 `\"SMALL\"`。\n\n`toString` 的反操作是静态方法 `valueOf`。例如，语句\n\n点击此处查看代码图片\n\n```java\n\
  Size s = Enum.valueOf(Size.class, \"SMALL\");\n```\n\n将 `s` 设置为 `Size.SMALL`。\n\n\
  每个枚举类型都有一个静态方法 `values`，返回该枚举的所有值数组。例如，调用\n\n```java\nSize[] values = Size.values();\n\
  ```\n\n返回包含 `Size.SMALL`、`Size.MEDIUM`、`Size.LARGE` 和 `Size.EXTRA_LARGE` 元素的数组。\n\
  \n`ordinal` 方法产生枚举常量在声明中的位置，从零开始计数。例如，`Size.MEDIUM.ordinal()` 返回 `1`。\n\n列表 5.12\
  \ 中的短程序演示了如何处理枚举类型。\n\n![Images](img/note.jpg) 注意\n\n`Enum` 类有一个类型参数，为了简单起见忽略了它。例如，枚举类型\
  \ `Size` 实际上扩展了 `Enum<Size>`。该类型参数用于 `compareTo` 方法。（我在第 6 章中讨论了 `compareTo` 方法并在第\
  \ 8 章中讨论了类型参数。）\n\n\n\n\n\n```\npackage enums;\n\nimport java.util.*;\n\n/**\n *\
  \ 此程序演示了枚举类型。\n * @version 1.0 2004-05-24\n * @author Cay Horstmann\n */\npublic\
  \ class EnumTest\n{\n    public static void main(String[] args)\n    {\n       var\
  \ in = new Scanner(System.in);\n       System.out.print(\"Enter a size: (SMALL,\
  \ MEDIUM, LARGE, EXTRA_LARGE) \");\n       String input = in.next().toUpperCase();\n\
  \       Size size = Enum.valueOf(Size.class, input);\n       System.out.println(\"\
  size=\" + size);\n       System.out.println(\"abbreviation=\" + size.getAbbreviation());\n\
  \       if (size == Size.EXTRA_LARGE)\n          System.out.println(\"Good job--you\
  \ paid attention to the _.\");\n    }\n}\n\nenum Size\n{\n   SMALL(\"S\"), MEDIUM(\"\
  M\"), LARGE(\"L\"), EXTRA_LARGE(\"XL\");\n\n    private Size(String abbreviation)\
  \ { this.abbreviation = abbreviation; }\n    public String getAbbreviation() { return\
  \ abbreviation; }\n\n    private String abbreviation;\n}\n```\n\n`java.lang.Enum<E>`\
  \ 5\n\n*   `static Enum valueOf(Class enumClass, String name)`\n    返回给定类中给定名称的枚举常量。\n\
  \n*   `String toString()`\n    返回此枚举常量的名称。\n\n*   `int ordinal()`\n    返回此枚举常量在\
  \ `enum` 声明中从 0 开始的位置。\n\n*   `int compareTo(E other)`\n    如果此枚举常量在 `other` 之前，返回负整数；如果\
  \ `this == other`，返回零；否则返回正整数。常量的顺序由 `enum` 声明决定。\n\n## 5.8 密封类 (Sealed Classes)\n\
  \n除非一个类被声明为 `final`，否则任何人都可以创建它的子类。如果你想有更多的控制权呢？例如，假设你需要编写自己的 JSON 库，因为现有的任何库都不能完全符合你的需求。\n\
  \nJSON 标准规定 JSON 值可以是数组、数字、字符串、布尔值、对象或空。一种显而见的方法是使用 `JSONArray`、`JSONNumber` 等类来建模，这些类继承自抽象类\
  \ `JSONValue`：\n\n点击此处查看代码图片\n\n```\npublic abstract class JSONValue\n{\n   // 适用于所有\
  \ JSON 值的方法\n}\n\npublic final class JSONArray extends JSONValue\n{\n   . . .\n\
  }\n\npublic final class JSONNumber extends JSONValue\n{\n   . . .\n}\n```\n\n通过将\
  \ `JSONArray`、`JSONNumber` 等类声明为 `final`，我们可以确保没有人能创建子类。但我们无法阻止任何人创建 `JSONValue`\
  \ 的另一个子类。\n\n我们为什么可能需要这种控制权？考虑这段代码：\n\n点击此处查看代码图片\n\n```\nJSONValue v = . . .;\n\
  if (v instanceof JSONArray a) . . .\nelse if (v instanceof JSONNumber n) . . .\n\
  else if (v instanceof JSONString s) . . .\nelse if (v instanceof JSOBoolean b) .\
  \ . .\nelse if (v instanceof JSONObject o) . . .\nelse . . . // 必须是 JSONNull\n```\n\
  \n在这里，控制流意味着我们知道 `JSONValue` 的所有直接子类。这不是一个开放的层级结构。JSON 标准不会改变；如果改变了，我们作为库实现者会添加第七个子类。我们不希望其他人在外面干扰这个类层次结构。\n\
  \n在 Java 中，*密封*（sealed）类控制了哪些类可以继承自它。密封类在 Java 15 中作为预览功能引入，并在 Java 17 中最终定型。\n\n\
  以下是如何将 `JSONValue` 类声明为密封类的：\n\n点击此处查看代码图片\n\n```\npublic abstract sealed class\
  \ JSONValue\n   permits JSONArray, JSONNumber, JSONString, JSONBoolean, JSONObject,\
  \ JSONNull\n{\n   . . .\n}\n```\n\n定义一个未被许可的子类是一个错误：\n\n点击此处查看代码图片\n\n```\npublic\
  \ class JSONComment extends JSONValue { . . . } // 错误\n```\n\n这样也很好，因为 JSON 不允许注释。因此，密封类允许对领域约束进行精确建模。\n\
  \n密封类的许可子类必须是可访问的。它们不能是嵌套在另一个类中的私有类，也不能是另一个包的包可见类。\n\n对于公共的许可子类，规则更加严格。它们必须与密封类处于同一个包中。然而，如果你使用了模块（参见卷二的第\
  \ 9 章），它们必须位于同一个模块。\n\n![Images](img/note.jpg) 注意\n\n密封类可以在不带 `permits` 子句的情况下声明。那么它的所有直接子类都必须在同一个文件中声明。没有访问该文件的程序员无法创建子类。\n\
  \n一个文件最多有一个 `public` 类，因此这种安排似乎只有在子类不供公众使用时才有用。\n\n然而，正如你将在下一章中看到的，你可以使用内部类作为公共子类。\n\
  \n密封类的一个重要动机是编译时检查。考虑 `JSONValue` 类的这个方法，它使用了带有模式匹配的 `switch` 表达式（Java 17 预览功能）：\n\
  \n点击此处查看代码图片\n\n```\npublic String type()\n{\n   return switch (this)\n   {\n  \
  \    case JSONArray j -> \"array\";\n      case JSONNumber j -> \"number\";\n  \
  \    case JSONString j -> \"string\";\n      case JSONBoolean j -> \"boolean\";\n\
  \      case JSONObject j -> \"object\";\n      case JSONNull j -> \"null\";\n  \
  \    // 不需要 default\n   };\n}\n```\n\n这里的控制流意味着我们知道 `JSONValue` 的所有直接子类。这不是一个开放的层级结构。JSON\
  \ 标准不会改变；如果改变了，我们作为库实现者会添加第七个子类。我们不希望其他人在外面干扰这个类层次结构。\n\n在 Java 中，*密封*类控制了哪些类可以继承自它。密封类在\
