  ```\n\n**列表 5.5** `equals/Employee.java`\n\n点击此处查看代码图像\n\n```\n 1 package equals;\n\
  \ 2\n 3 import java.time.*;\n 4 import java.util.Objects;\n 5\n 6 public class Employee\n\
