  \n#### 11.6.2 自定义布局管理器\n\n你可以设计自己的 `LayoutManager` 类来以特殊的方式管理组件。作为一个趣味的例子，让我们把容器中的所有组件排列成一个圆圈（参见\
  \ 图 11.29）。\n\n![Images](img/011fig29.jpg)\n\n**图 11.29** 圆形布局\n\n你自定义的布局管理器必须实现\
  \ `LayoutManager` 接口。你需要重写以下五个方法：\n\n点击此处查看代码图片\n\n```\nvoid addLayoutComponent(String\
  \ s, Component c)\nvoid removeLayoutComponent(Component c)\nDimension preferredLayoutSize(Container\
  \ parent)\nDimension minimumLayoutSize(Container parent)\nvoid layoutContainer(Container\
  \ parent)\n```\n\n前两个方法在组件被添加或移除时调用。如果你没有保留关于组件的任何额外信息，可以这些它们什么都不做。接下来两个方法计算组件的最小布局和首选布局所需的空间。这些通常是相同的数值。第五个方法执行实际工作，并对所有组件调用\
  \ `setBounds`。\n\n![Images](img/note.jpg) 注意\n\nAWT 有第二个接口称为 `LayoutManager2`，需要实现十个方法而不是五个。`LayoutManager2`\
  \ 接口的主要目的是允许你带有约束使用 `add` 方法。例如，`BorderLayout` 和 `GridBagLayout` 实现了 `LayoutManager2`\
  \ 接口。\n\n列表 11.9 显示了 `CircleLayout` 管理器的代码，遗憾的是，它仅仅是让组件沿容器内部的圆周进行布局。示例程序的框架类位于 列表\
  \ 11.10。\n\n**列表 11.9** `circleLayout/CircleLayout.java`\n\n点击此处查看代码图片\n\n```\n\
  \ 1  package circleLayout;\n 2\n 3  import java.awt.*;\n 4\n 5  /**\n 6   * 一种沿圆周排列组件的布局管理器。\n\
  \ 7   */\n 8  public class CircleLayout implements LayoutManager\n 9  {\n10    \
  \ private int minWidth = 0;\n11     private int minHeight = 0;\n12     private int\
  \ preferredWidth = 0;\n13     private int preferredHeight = 0;\n14     private boolean\
  \ sizesSet = false;\n15     private int maxComponentWidth = 0;\n16     private int\
  \ maxComponentHeight = 0;\n17\n18     public void addLayoutComponent(String name,\
  \ Component comp)\n19     {\n20     }\n21     public void removeLayoutComponent(Component\
  \ comp)\n22     {\n23     }\n24\n25     public void setSizes(Container parent)\n\
  26     {\n27        if (sizesSet) return;\n28        int n = parent.getComponentCount();\n\
  29\n30        preferredWidth = 0;\n31        preferredHeight = 0;\n32        minWidth\
  \ = 0;\n33        minHeight = 0;\n34        maxComponentWidth = 0;\n35        maxComponentHeight\
  \ = 0;\n36\n37        // 计算最大宽度和高度\n38        //并将首选尺寸设置为组件尺寸之和\n39        for (int\
  \ i = 0; i < n; i++)\n40           Component c = parent.getComponent(i);\n41   \
  \       if (c.isVisible())\n42             {\n43              Dimension d = c.getPreferredSize();\n\
  44              maxComponentWidth = Math.max(maxComponentWidth, d.width);\n45  \
  \            maxComponentHeight = Math.max(maxComponentHeight, d.height);\n46  \
  \            preferredWidth += d.width;\n47              preferredHeight += d.height;\n\
  48             }\n49        minWidth = preferredWidth / 2;\n50        minHeight\
  \ = preferredHeight / 2;\n51        sizesSet = true;\n52     }\n53\n54     public\
  \ Dimension preferredLayoutSize(Container parent)\n55     {\n56        setSizes(parent);\n\
  57        Insets insets = parent.getInsets();\n58        int width = preferredWidth\
  \ + insets.left + insets.right;\n59        int height = preferredHeight + insets.top\
  \ + insets.bottom;\n60        return new Dimension(width, height);\n61     }\n62\n\
  63     public Dimension minimumLayoutSize(Container parent)\n64     {\n65      \
  \  setSizes(parent);\n66        Insets insets = parent.getInsets();\n67        int\
  \ width = minWidth + insets.left + insets.right;\n68        int height = minHeight\
  \ + insets.top + insets.bottom;\n69        return new Dimension(width, height);\n\
  70     }\n71\n72     public void layoutContainer(Container parent)\n73     {\n74\
  \        setSizes(parent);\n75        Insets insets = parent.getInsets();\n76  \
  \      int width = preferredWidth + insets.left + insets.right;\n77        int height\
  \ = preferredHeight + insets.top + insets.bottom;\n78\n79        // 计算圆周中心\n80 \
  \       int xcenter = insets.left + width / 2;\n81        int ycenter = insets.top\
  \ + height / 2;\n82\n83        // 计算半径\n84        int xradius = (width - maxComponentWidth)\
  \ / 2;\n85        int yradius = (height - maxComponentHeight) / 2;\n86        int\
  \ radius = Math.min(xradius, yradius);\n87\n88        // 沿圆周排列组件\n89        int\
  \ n = parent.getComponentCount();\n90        for (int i = 0; i < n; i++)\n91   \
  \        Component c = parent.getComponent(i);\n92          if (c.isVisible())\n\
  93             {\n94               // 计算角度\n95               double angle = 2 *\
  \ Math.PI * i / n;\n96\n97               // 组件中心点\n98               int x = xcenter\
  \ + (int) (Math.cos(angle) * radius);\n99               int y = ycenter + (int)\
  \ (Math.sin(angle) * radius);\n100\n101              // 移动组件使其中心位于 (x, y)\n102 \
  \             // 尺寸为首选尺寸\n103              Dimension d = c.getPreferredSize();\n\
  104              c.setBounds(x - d.width / 2, y - d.height / 2, d.width, d.height);\n\
  105             }\n106       }\n107     }\n108 }\n```\n\n**列表 11.10** `circleLayout/CircleLayoutFrame.java`\n\
