  \ HTMLDivElement extends Element\n{\n   . . .\n}\n```\n\n在本节中，你学习了`sealed classes`。在下一章中，你将学习`interfaces`，它是抽象类的泛化。Java\
  \ 接口也可以拥有子类型。密封接口的工作方式与密封类完全相同，它们控制控制直接子类型。\n\n下面的示例程序充实了 JSON 层次结构。`JSONObject`\
  \ 的实现使用了 `HashMap`，这将在第 9 章 中介绍。在示例中，我们使用接口而不是抽象类，这样 `JSONNumber` 和 `JSONString`\
  \ 就可以记录（records），而 `JSONBoolean` 和 `JSONNull` 类可以作为枚举（enumerations）。记录和枚举可以实现接口，但不能扩展类。\n\
  \n**列表 5.13** `sealed/SealedTest.java`\n\n点击此处查看代码图像\n\n```\n 1 package sealed;\n\
  \ 2\n 3 import java.util.*;\n 4\n 5 sealed interface JSONValue permits JSONArray,\
  \ JSONObject, JSONPrimitive\n 6 {\n 7    public default String type()\n 8    {\n\
