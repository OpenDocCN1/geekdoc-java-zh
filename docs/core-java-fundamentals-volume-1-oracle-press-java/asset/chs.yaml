  \ processIn = p.getOutputStream();\nInputStream processOut = p.getInputStream();\n\
  InputStream processErr = p.getErrorStream();\n```\n\n注意，进程的输入流在 JVM 中是一个输出流！你向该流写入数据，你写入的任何内容将成为进程的输入。相反，你从进程写入输出流和错误流的内容的内容。对你来说，它们是输入流。\n\
  \n你可以指定新进程的输入、输出和错误流与 JVM 相同。如果用户在控制台中运行 JVM，任何用户输入都将被转发到进程，而进程的输出将显示在控制台中。调用\n\n\
  ```\nbuilder.inheritIO()\n```\n\n为这三个流都进行此设置。如果你只想继承某些流，请传递值\n\n点击此处查看代码图片\n\n```\n\
  ProcessBuilder.Redirect.INHERIT\n```\n\n传递给 `redirectInput`、`redirectOutput` 或 `redirectError`\
  \ 方法。例如，\n\n点击此处查看代码图片\n\n```\nbuilder.redirectOutput(ProcessBuilder.Redirect.INHERIT);\n\
  ```\n\n你可以通过提供 `File` 对象将进程流重定向到文件：\n\n点击此处查看代码图片\n\n```\nbuilder.redirectInput(inputFile)\n\
  \   .redirectOutput(outputFile)\n   .redirectError(errorFile)\n```\n\n输出和错误文件在进程启动时被创建或截断。若要追加到现有文件，请使用\n\
  \n点击此处查看代码图片\n\n```\nbuilder.redirectOutput(ProcessBuilder.Redirect.appendTo(outputFile));\n\
  ```\n\n合并输出流和错误流通常是很有用的，这样你就能按照进程生成信息的顺序看到输出和错误消息。调用\n\n点击此处查看代码图片\n\n```\nbuilder.redirectErrorStream(true)\n\
  ```\n\n来激活合并。如果你这样做了，就不能再在 `ProcessBuilder` 上调用 `redirectError` 或在 `Process` 上调用\
  \ `getErrorStream` 了。\n\n你可能还想修改进程的环境变量。在这里，构建器链语法被拆解了。你需要获取构建器的环境（它由运行 JVM 的进程的环境变量初始化），然后插入或移除项。\n\
  \n点击此处查看代码图片\n\n```\nMap<String, String> env = builder.environment();\nenv.put(\"\
  LANG\", \"fr_FR\");\nenv.remove(\"JAVA_HOME\");\nProcess p = builder.start();\n\
  ```\n\n如果你想将一个进程的输出管道到另一个进程的输入中（就像 shell 中的 `|` 运算符一样），Java 9 提供了 `startPipeline`\
  \ 方法。传递一个 `ProcessBuilder` 列表并从最后一个进程读取结果。这里有一个示例，列出目录树中唯一的扩展名：\n\n点击此处查看代码图片\n\n\
  ```\nList<Process> processes = ProcessBuilder.startPipeline(List.of(\n   new ProcessBuilder(\"\
  find\", \"/opt/jdk-17\"),\n   new ProcessBuilder(\"grep\", \"-o\", \"\\\\.[^./]*$\"\
  ),\n   new ProcessBuilder(\"sort\"),\n   new ProcessBuilder(\"uniq\")\n));\nProcess\
  \ last = processes.get(processes.size() - 1);\nvar result = new String(last.getInputStream().readAllBytes());\n\
  ```\n\n当然，这个特定任务通过在 Java 中进行目录遍历比运行四个进程更高效。第二卷的第 2 章 将向你展示如何这样做。\n\n### 12.8.2 运行进程\n\
  \n在配置好构建器后，调用它的 `start()` 方法启动进程。如果你将输入、输出和错误流配置为管道，你现在可以向输入流写入内容并读取输出和错误流了。例如，\n\
  \n点击此处查看代码图片\n\n```\nProcess process = new ProcessBuilder(\"/bin/ls\", \"-l\")\n\
  \   .directory(Path.of(\"/tmp\").toFile())\n   .start();\ntry (var in = new Scanner(process.getInputStream()))\n\
  {\n   while (in.hasNextLine())\n      System.out.println(in.nextLine());\n}\n```\n\
  \n![Images](img/caution.jpg) 注意\n\n进程流的缓冲区空间有限。你不应该让输入溢出，并且你应该及时读取输出。如果有大量的输入和输出，你可能需要在单独的线程中产生并消费它们。\n\
  \n要等待进程完成，请调用\n\n点击此处查看代码图片\n\n```\nint result = process.waitFor();\n```\n\n或者，如果你不想无限等待，\n\
  \n点击此处查看代码图片\n\n```\nlong delay = . . .;\nif (process.waitFor(delay, TimeUnit.SECONDS))\n\
  {\n   int result = process.exitValue();\n   . . .\n}\nelse\n{\n   process.destroy();\n\
  }\n```\n\n第一次调用 `waitFor()` 返回退出码。第二次调用 `waitFor(delay, TimeUnit.SECONDS)` 返回 `true`\
  \ 如果进程已完成。然后你可以通过 `exitValue()` 获取退出值。而不是等待进程，你可以只需调用 `isAlive()` 查看是否仍然存活。要杀死进程，调用\
  \ `destroy()` 或 `destroyForcibly()`。在 UNIX 上，前者以 `SIGTERM` 终止，后者以 `SIGKILL` 终止。`supportsNormalTermination()`\
  \ 返回 `true` 如果进程可以正常终止。最后，你可以接收进程完成的异步通知。使用 `onExit()` 来调度任何操作。\n\n点击此处查看代码图片\n\n\
  ```\nprocess.onExit().thenAccept(\n   p -> System.out.println(\"Exit value: \" +\
  \ p.exitValue()));\n```\n\n### 12.8.3 句柄\n\n要获取有关你启动的进程或其他正在运行的进程的更多信息，使用 `ProcessHandle`\
  \ 接口。你可以通过四种方式获取 `ProcessHandle`：\n\n1. 给 `Process` 对象 `p`。\n2. 给定一个 `long` 操作系统进程\
  \ ID，`ProcessHandle.of(id)`。\n3. `ProcessHandle.current()` 是运行此虚拟机的句柄。\n4. `ProcessHandle.allProcesses()`\
  \ 返回所有操作系统进程的 `Stream<ProcessHandle>`。\n\n给定一个进程句柄，可以获取其进程 ID、父进程、子进程和后代：\n\n点击此处查看代码图片\n\
  \n```\nlong pid = handle.pid();\nOptional<ProcessHandle> parent = handle.parent();\n\
  Stream<ProcessHandle> children = handle.children();\nStream<ProcessHandle> descendants\
  \ = handle.descendants();\n```\n\n![Images](img/note.jpg) 注意\n\n`allProcesses`、`children`\
  \ 和 `descendants` 方法返回的 `Stream<ProcessHandle>` 实例只是时间快照。当你处理它们时，流中的任何进程可能已经终止，并且可能启动了其他不在流中的进程。\n\
  \n`info()` 方法产生一个 `ProcessHandle.Info` 对象，其中包含获取进程信息的方法。\n\n点击此处查看代码图片\n\n```\n\
  Optional<String[]> arguments()\nOptional<String> command()\nOptional<String> commandLine()\n\
  Optional<String> startInstant()\nOptional<String> totalCpuDuration()\nOptional<String>\
  \ user()\n```\n\n所有这些方法都返回 `Optional` 值，因为特定的操作系统可能无法报告这些信息。对于监控或强制终止进程，`ProcessHandle`\
  \ 接口与 `Process` 类具有相同的 `isAlive`、`supportsNormalTermination`、`destroy`、`destroyForcibly`\
  \ 和 `onExit` 方法。然而，没有等价于 `waitFor` 方法。\n\n\n\n\n\n*   `ProcessBuilder(List<String>\
  \ command)`\n  使用给定的命令和参数构建进程构建器（process builder）。\n\n*   `ProcessBuilder directory(File\
  \ directory)`\n  设置进程的工作目录。\n\n*   `ProcessBuilder inheritIO()` **9**\n  使进程使用虚拟机的标准输入、输出和错误流。\n\
  \n*   `ProcessBuilder redirectErrorStream(boolean redirectErrorStream)`\n  如果 `redirectErrorStream`\
  \ 为 `true`，则进程的标准错误合并到标准输出中。\n\n*   `ProcessBuilder redirectInput(File file)` **7**\n\
  \n*   `ProcessBuilder redirectOutput(File file)` **7**\n\n*   `ProcessBuilder redirectError(File\
  \ file)` **7**\n  将进程的标准输入、输出或错误重定向到指定的文件。\n\n*   `ProcessBuilder redirectInput(ProcessBuilder.Redirect\
  \ source)` **7**\n\n*   `ProcessBuilder redirectOutput(ProcessBuilder.Redirect destination)`\
  \ **7**\n\n*   `ProcessBuilder redirectError(ProcessBuilder.Redirect destination)`\
  \ **7**\n  重定向进程的标准输入、输出或错误，其中 `destination` 是以下之一：\n  *   `Redirect.PIPE`——默认行为，通过\
  \ `Process` 对象访问\n  *   `Redirect.INHERIT`——来自虚拟机的流\n  *   `Redirect.DISCARD`\n\
  \  *   `Redirect.from(file)`\n  *   `Redirect.to(file)`\n  *   `Redirect.appendTo(file)`\n\
  \n*   `Map<String,String> environment()`\n  产生一个用于设置进程环境变量的可变映射表。\n\n*   `Process\
  \ start()`\n  启动进程并返回其 `Process` 对象。\n\n*   `static List<Process> startPipeline(List<ProcessBuilder>\
  \ builders)` **9**\n  启动进程流水线，将每个进程的标准输出连接到下一个进程的标准输入。\n\n### `java.lang.Process`\
  \ 1.0\n\n*   `abstract OutputStream getOutputStream()`\n  获取一个用于向进程输入流写入数据的流。\n\n\
  *   `abstract InputStream getgetInputStream()`\n\n*   `abstract InputStream getErrorStream()`\n\
  \  获取一个用于读取进程输出流或错误流的输入流。\n\n*   `abstract int waitFor()`\n  等待进程结束并返回退出值。\n\n*\
  \   `boolean waitFor(long timeout, TimeUnit unit)` **8**\n  等待进程结束，但最不超过给定的超时时间。如果进程退出，则返回\
  \ `true`。\n\n*   `abstract int exitValue()`\n  返回进程的退出值。按照约定，非零退出值表示错误。\n\n*   `boolean\
  \ isAlive()` **8**\n  检查此进程是否仍然存活。\n\n*   `abstract void destroy()`\n\n*   `Process\
  \ destroyForcibly()` **8**\n  终止此进程，可以是正常或强制的。\n\n*   `boolean supportsNormalTermination()`\
  \ **9**\n  检查此进程是否可以正常终止或必须强制销。\n\n*   `ProcessHandle toHandle()` **9**\n  返回描述此进程的\
  \ `ProcessHandle`。\n\n*   `CompletableFuture<Process> onExit()` **9**\n  返回一个进程退出时执行的\
  \ `CompletableFuture`。\n\n### `java.lang.ProcessHandle` 9\n\n*   `static Optional<ProcessHandle>\
  \ of(long pid)`\n\n*   `static Stream<ProcessHandle> allProcesses()`\n\n*   `static\
  \ ProcessHandle current()`\n  返回具有给定 PID 的进程句柄、所有进程的句柄，或虚拟机的句柄。\n\n*   `Stream<ProcessHandle>\
  \ children()`\n\n*   `Stream<ProcessHandle> descendants()`\n  返回此进程的子进程或后代进程的句柄。\n\
  \n*   `long pid()`\n  返回此进程的 PID。\n\n*   `ProcessHandle.Info info()`\n  返回此进程的详细信息。\n\
