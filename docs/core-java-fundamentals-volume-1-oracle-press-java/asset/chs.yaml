  本章向你介绍了异常处理和日志记录。你还看到了关于测试和调试的有用提示。接下来的两个章节将介绍泛型编程及其最重要的应用：Java 集合框架。\n\n# 第 8 章\n\
  \n## 泛型编程\n\n### 本章\n\n* 8.1 为什么需要泛型编程？\n* 8.2 定义一个简单的泛型类\n* 8.3 泛型方法\n* 8.4 类型变量的边界\n\
  * 8.5 泛型代码与虚拟机\n* 8.6 限制与局限性\n* 8.7 泛型类型的继承规则\n* 8.8 通配符类型\n* 8.9 反射与泛型\n\n泛型类和方法拥有类型参数。这使得它们能够精确地描述当用特定类型实例化时应该发生什么。在泛型类出现之前，程序员必须使用\
  \ `Object` 来编写可以与多种类型工作的代码。这既繁琐又不安全。\n\n随着泛型的引入，Java 拥有了富有表现力的类型系统，允许设计者详细描述变量和方法的类型应该如何变化。在简单直接的情况下，你会发现实现泛型代码非常简单。在更高级的情况下，对于实现者来说，它可能会变得非常复杂。目标是提供其他程序员可以使用而不会产生意外的类和方法。\n\
  \nJava 5 泛型的引入构成了 Java 编程语言自发布发布以来最重的变化。一个主要的设计目标是与早期版本兼容。因此，Java 泛型具有一些不方便的局限性。你将在本章中学习泛型编程的益处和挑战。\n\
  \n### 8.1 为什么需要泛型编程？\n\n泛型编程意味着编写可以用于许多不同类型对象的复用代码。例如，你不想编写单独的类来收集 `String` 和 `File`\
  \ 对象。而且你不需要那样做——单个 `ArrayList` 类就可以收集任何类的类对象。这就是泛型编程的一个例子。\n\n实际上，Java 在拥有泛型类之前就已经有一个\
  \ `ArrayList` 类了。让我们研究一下泛型编程机制是如何演变的，以及这对于用户和实现者意味着什么。\n\n#### 8.1.1 类型参数的优势\n\n\
  在泛型类添加到 Java 之前，泛型编程是通过继承实现的。`ArrayList` 类简单地维护了一个 `Object` 引用数组：\n\n点击此处查看代码图片\n\
  \n```\npublic class ArrayList // 泛型类之前\n{\n   private Object[] elementData;\n  \
  \ . . .\n   public Object get(int i) { . . . }\n   public void add(Object o) { .\
  \ . . }\n}\n```\n\n这种方法有两个问题。每当你检索一个值时，都需要进行强制转换：\n\n点击此处查看代码图片\n\n```\nArrayList\
  \ files = new ArrayList();\n. . .\nString filename = (String) files.get(0);\n```\n\
  \n此外，没有错误检查。你可以添加任何类的值：\n\n```\nfiles.add(new File(\". . .\"));\n```\n\n此调用可以通过编译并运行而不会报错。在其他地方，将\
  \ `get` 的结果强制转换为 `String` 将导致错误。\n\n泛型提供了一个更好的解决方案：类型参数。`ArrayList` 类现在有一个类型参数来指示元素类型：\n\
  \n点击此处查看代码图片\n\n```\nvar files = new ArrayList<String>();\n```\n\n这使得你的代码更易于阅读。你可以立即看出这个特定的列表包含\
  \ `String` 对象。\n\n![Images](img/note.jpg) Note\n\n如果你使用显式类型而不是 `var` 声明变量，可以使用“菱”语法在构造函数中省略类型参数：\n\
  \n点击此处查看代码图片\n\n```\nArrayList<String> files = new ArrayList<>();\n```\n\n省略的类型是从变量的类型推断出来的。\n\
  \nJava 9 将菱形语法的使用扩展到了以前不被接受的情况。例如，你现在可以在匿名子类中使用菱形了：\n\n点击此处查看代码图片\n\n```\nArrayList<String>\
  \ passwords = new ArrayList<>() // Java 9 中允许使用菱形\n   {\n      public String get(int\
  \ n) { return super.get(n).replaceAll(\".\", \"*\"); }\n   };\n```\n\n编译器可以很好地利用类型信息。调用\
  \ `get` 不需要强制转换。编译器知道返回类型是 `String`：点击此处查看代码图片\n\n```\nString filename = files.get(0);\n\
  ```\n\n编译器还知道 `ArrayList<String>` 的 `add` 方法参数是 `String`。现在编译器可以检查你是否插入了错误的类型。例如，语句点击此处查看代码图片\n\
  \n```\nfiles.add(new File(\". . .\")); // 只能向 ArrayList<String> 添加 String\n```\n\
  \n将编译。这比类型转换异常好得多。\n\n#### 8.1.2 谁想成为泛型编程专家？\n\n使用像 `ArrayList` 这样的泛型类很容易。大多数 Java\
  \ 程序员会像使用 `String[]` 数组一样直接使用 `ArrayList<String>`。（当然，列表比数组更好，因为它们可以自动扩展。）\n\n然而，实现一个泛型类并不容易。使用你代码的程序员想要为你的类型参数接入各种类。他们期望在没有苛刻限制和困惑错误信息的情况下一切运行。因此，作为泛型编程专家，你的工作是预测该类的所有潜在用途。\n\
  \n这有多难？这里有一个类库设计者必须解决的典型问题。`ArrayList` 类有一个 `addAll` 方法用于添加另一个集合的所有元素。程序员可能想将 `ArrayList<Manager>`\
  \ 的所有元素添加到 `ArrayList<Employee>` 中。但当然，反过来操作是不合法的。你如何允许一种调用而禁止另一种？Java 语言设计者发明了一种巧妙的新概念——通配符类型，来解决这个问题。通配符类型相当抽象，但它们允许库构建者使方法尽可能灵活。\n\
  \n泛型编程分为三个技能水平。在基础水平，你只是使用泛型类——通常是如 `ArrayList` 等集合——而不思考它们是如何以及为什么工作的。大多数应用程序程序员会一直在这个水平，直到出现问题。但是，在混合不同的泛型类或与不知道类型参数的遗留代码交互时，你可能会遇到困惑的错误信息；到那时，你需要学习足够的\
  \ Java 泛型知识，以系统的方法解决问题，而不是通过随机尝试。最后，当然，你可能想实现自己的泛型类和方法。\n\n\n\n\n应用程序开发人员可能不会编写大量的泛型代码。JDK\
  \ 开发者已经完成了最繁重的工作，并为所有集合类提供了了类型参数。按照常理，只有那些传统上涉及大量从非常通用类型（如 `Object` 或 `Comparable`\
  \ 接口）进行类型转换的代码，才能从使用类型参数中获益。\n\n在本章中，我将向你展示实现自己的泛型代码所需的所有知识。然而，我预计大多数读者使用这些知识的主要目的是为了帮助排除故障，并满足对参数化集合类内部工作机制的好奇。\n\
  \n### 8.2 定义一个简单的泛型类\n\n`泛型类`是一个有一个或多个类型变量的类。在本章中，使用一个简单的 `Pair` 类作为示例。这个类允许我们专注于泛型，而不会被数据存储细节分散。以下是泛型\
  \ `Pair` 类的代码：\n\n点击此处查看代码图片\n\n```\npublic class Pair<T>\n{\n   private T first;\n\
  \   private T second;\n\n   public Pair() { first = null; second = null; }\n   public\
  \ Pair(T first, T second) { this.first = first; this.second = second; }\n\n   public\
  \ T getFirst() { return first; }\n   public T getSecond() { return second; }\n\n\
  \   public void setFirst(T newValue) { first = newValue; }\n   public void setSecond(T\
  \ newValue) { second = newValue; }\n}\n```\n\n`Pair` 类在类名后引入了一个括在角括号 `< >` 中的类型变量\
  \ `T`。泛型类可以有多个类型变量。例如，我们可以为第一个和第二个字段使用不同的类型来定义 `Pair` 类：\n\n点击此处查看代码图片\n\n```\n\
  public class Pair<T, U> { . . . }\n```\n\n类型变量贯穿于整个类定义中，用于指定方法的返回类型以及字段和局部变量的类型。例如：\n\
  \n点击此处查看代码图片\n\n```\nprivate T first; // 使用了类型变量\n```\n\n![Images](img/note.jpg)\
  \ 注意\n\n使用大写字母作为类型变量并保持简短是常见做法。Java 库使用变量 `E` 表示集合的元素类型，`K` 和 `V` 表示表格的键和值类型，`T`（如有必要还有相邻的字母\
  \ `U` 和 `S`）表示“任何类型”。\n\n你通过为类型变量替换具体的类型来 `实例化` 泛型类型，例如：\n\n```\nPair<String>\n\
  ```\n\n你可以将结果认为是一个具有构造函数的普通类：\n\n```\nPair<String>()\nPair<String>(String, String)\n\
  ```\n\n以及方法\n\n```\nString getFirst()\nString getSecond()\nvoid setFirst(String)\n\
  void setSecond(String)\n```\n\n换句话说，泛型类充当了普通类的工厂。\n\nListing 8.1 中的程序让 `Pair` 类运行了起来。静态方法\
  \ `minmax` 遍历数组并同时计算最小值和最大值。它使用 `Pair` 对象来返回这两个结果。回想 `compareTo` 方法比较两个字符串，如果字符串相同则返回\
  \ `0`；如果第一个字符串在字典顺序上于第二个字符串之前，则返回负整数；否则返回正整数。\n\n![Images](img/cnote.jpg) C++ 注意\n\
  \n表面上看，Java 中的泛型类与 C++ 中的模板类相似。唯一的明显区别是 Java 没有特殊的 `template` 关键字。然而，正如你将在整个章节中看到的，这两种机制之间存在显著差异。\n\
  \n**Listing 8.1** `pair1/PairTest1.java`\n\n点击此处查看代码图片\n\n```\n 1 package pair1;\n\
  \ 2\n 3 /**\n 4  * @version 1.01 2012-01-26\n 5  * @author Cay Horstmann\n 6  */\n\
  \ 7 public class PairTest1\n 8 {\n 9    public static void main(String[] args)\n\
  10    {\n11       String[] words = { \"Mary\", \"had\", \"a\", \"little\", \"lamb\"\
  \ };\n12       Pair<String> mm = ArrayAlg.minmax(words);\n13       System.out.println(\"\
  min = \" + mm.getFirst());\n14       System.out.println(\"max = \" + mm.getSecond());\n\
  15    }\n16 }\n17\n18 class ArrayAlg\n19 {\n20    /**\n21     * 获取字符串数组的最小值和最大值。\n\
  22     * @param a 一个字符串数组\n23     * @return 一个包含最小和最大值的对，如果 a 为空或长度为空则返回 null\n\
  24     */\n25    public static Pair<String> minmax(String[] a)\n26    {\n27    \
  \   if (a == null || a.length == 0) return null;\n28       String min = a[0];\n\
  29       String max = a[0];\n30       for (int i = 1; i < a.length; i++)\n31   \
  \       if (a[i].compareTo(min) < 0) min = a[i];\n32          if (a[i].compareTo(max)\
  \ > 0) max = a[i];\n33      }\n34       return new Pair<>(min, max);\n35    }\n\
  36 ```\n\n## 8.3 泛型方法\n\n在上一节中，你已经看到了如何定义一个泛型类。你也可以定义带有类型参数的方法。当你调用泛型方法时，可以将实际类型（括在角括号中）放在方法名之前：点击此处查看代码图片\n\
  \n```java\nArrayAlg.<String>minmax(words);\n```\n\n在大多数情况下，你可以从方法调用中省略 `<String>`。编译器有足够的信息来推断你需要的类型。\n\
  \n```\nString mm = ArrayAlg.minmax(words);\n```\n\n在几乎所有情况下，泛型方法的类型推断都运行良好。偶尔，编译器会出错，你需要解读错误报告。考虑这个例子：点击此处查看代码图片\n\
  \n```\ndouble middle = ArrayAlg.minmax(3.14, 1729, 0);\n```\n\n错误信息会以随编译器版本而异的晦涩术语抱怨，这段代码有两种解释方式，且都是有效的。简而言之，编译器将参数装箱为\
  \ `Double` 和两个 `Integer` 对象，然后尝试找到它们的共同父类型。它实际上找到了两个：`Number` 和 `Comparable` 接口，后者本身就是一个泛型类型。在这种情况下，补救措施是将所有参数写成\
  \ `double` 值。\n\nPeter von Ahé 建议如果你想查看编译器为泛型调用推断出什么类型，可以使用这个技巧：故意引入一个错误并研究生成的错误信息。例如，考虑调用\
  \ `ArrayAlg.minmax(\"Hello\", 0, null)`。将结果赋值给 `JButton`，这显然是不。你会得到错误报告：点击此处查看代码图片\n\
  \n```\nfound:\njava.lang.Object&java.io.Serializable&java.lang.Comparable<? extends\n\
  java.lang.Object&java.io.Serializable&java.lang.Comparable<?>>\n```\n\n用通俗的话说，可以将结果赋值给\
  \ `Object`、`Serializable` 或 `Comparable`。\n\n在 C++ 中，你将类型参数放在方法名之后。这可能会导致糟糕的解析歧义。例如，`g(f<a,b>(c))`\
  \ 可以表示“调用 `g` 并传入 `f<a,b>(c)` 的结果”，也可以表示“调用 `g` 并传入两个布尔值 `f<a` 和 `b>(c)`”。\n\n\n\
  \n\n有时，类或方法需要对类型变量进行限制。这是一个典型的例子。我们想要计算数组中的最小元素：\n\n点击此处查看代码图片\n\n```\nclass ArrayAlg\n\
  {\n   public static <T> T min(T[] a) // 几乎正确\n   {\n      if (a == null || a.length\
  \ == 0) return null;\n      T smallest = a[0];\n      for (int i = 1; i < a.length;\
  \ i++)\n         if (smallest.compareTo(a[i]) > 0) smallest = a[i];\n      return\
  \ smallest;\n   }\n}\n```\n\n但存在一个问题。观察 `min` 方法内部的代码。变量 `smallest` 的类型为 `T`，这意味着它可以可以是任意类的对象。我们如何知道\
  \ `T` 所属的类具有 `compareTo` 方法呢？\n\n解决方案是将 `T` 限制为一个实现了 `Comparable` 接口的类——这是一个包含单个方法\
  \ `compareTo` 的标准接口。你可以通过为类型变量 `T` 设定一个*边界*（bound）来实现这一点：\n\n点击此处查看代码图片\n\n```\n\
  public static <T extends Comparable> T min(T[] a) . . .\n```\n\n实际上，`Comparable`\
  \ 接口本身就是一个泛型类型。目前，请忽略该复杂性以及编译器生成的警告。第 475 页的第 8.8 节“通配符类型”讨论了如何正确配合 `Comparable`\
  \ 接口使用类型参数。\n\n现在，泛型 `min` 方法只能用于实现了 `Comparable` 接口的类的数组，例如 `String`、`LocalDate`\
  \ 等。使用 `Rectangle` 数组调用 `min` 将导致编译时错误，因为 `Rectangle` 类没有实现 `Comparable`。\n\n![Images](img/cnote.jpg)\
  \ C++ 注意\n\n在 C++ 中，你无法限制模板参数的类型。如果程序员用不适当的类型实例化模板，模板代码内部会报告一个（通常是晦涩的）错误信息。\n\n\
  你可能会好奇为什么在这种情况下我使用 `extends` 关键字而不是 `implements` 关键字——毕竟，`Comparable` 是一个接口。这种表示法：\n\
  \n```\n<T extends BoundingType>\n```\n\n表示 `T` 应该是边界类型的*子类型*。`T` 和边界类型都可以是类，也可以是接口。选择\
  \ `extends` 关键字是因为它是子类型概念的合理近似，而且 Java 的设计者不想向语言中添加新的新关键字（如 `sub`）。\n\n类型变量或通配符可以有多个边界。例如：\n\
  \n点击此处查看代码图片\n\n```\nT extends Comparable & Serializable\n```\n\n边界类型之间用和符号（`&`）分隔，因为逗号被用于分隔类型变量。\n\
  \n与 Java 继承一样，你可以拥有任意数量的接口父类型，但边界中最多只能有一个是类。如果你有一个类作为边界，它必须是边界列表中的第一个。\n\n在下一个示例程序（Listing\
  \ 8.2）中，我们重写了 `minmax` 方法使其变为泛型。该方法计算泛型数组的最小和值，返回一个 `Pair<T>`。\n\n**Listing 8.2**\
  \ `pair2/PairTest2.java`\n\n点击此处查看代码图片\n\n```\n 1 package pair2;\n 2\n 3 import\
  \ java.time.*;\n 4\n 5 /**\n 6  * @version 1.02 2015-06-21\n 7  * @author Cay Horstmann\n\
  \ 8  */\n 9 public class PairTest2\n10 {\n11    public static void main(String[]\
  \ args)\n12    {\n13       LocalDate[] birthdays =\n14          {\n15          \
  \   LocalDate.of(1906, 12, 9), // G. Hopper\n16             LocalDate.of(1815, 12,\
  \ 10), // A. Lovelace\n17             LocalDate.of(1903, 12, 3), // J. von Neumann\n\
  18             LocalDate.of(1910, 6, 22), // K. Zuse\n19          };\n20       Pair<LocalDate>\
  \ mm = ArrayAlg.minmax(birthdays);\n21       System.out.println(\"min = \" + mm.getFirst());\n\
  22       System.out.println(\"max = \" + mm.getSecond());\n23    }\n24 }\n25\n26\
  \ class ArrayAlg\n27 {\n28    /**\n29      获取类型为 T 的对象数组的最小值和值。\n30      @param\
  \ a 类型为 T 的对象数组\n31      @return 包含最小和最大值的对，如果 a 为空或为空则返回 null\n32    */\n33   \
  \ public static <T extends Comparable> Pair<T> minmax(T[] a)\n34    {\n35      \
  \ if (a == null || a.length == 0) return null;\n36       T smallest = a[0];\n37\
  \       for (int i = 1; i < a.length; i++)\n38          if (smallest.compareTo(a[i])\
  \ > 0) smallest = a[i];\n39       return smallest;\n40    }\n41 }\n```\n\n## 8.5\
  \ 泛型代码与虚拟机\n\n#### 8.5.1 类型擦除\n\n每当你定义一个泛型类型，就会有一个对应的原始类型。在接下来的章节中，我们将看到编译器如何擦除类型参数以及该过程。\n\
  \n由于 `T` 是一个无边界类型变量，它被简单替换为 `Object`。例如，`Pair<T>` 的原始类型如下：\n\n点击此处查看代码图片\n\n```\n\
  public class Pair\n{\n   private Object first;\n   private Object second;\n\n  \
  \ public Pair(Object first, Object second)\n   {\n      this.first = first;\n  \
  \    this.second = second;\n   }\n\n   public Object getFirst() { return first;\
  \ }\n   public Object getSecond() { return second; }\n\n   public void setFirst(Object\
  \ first) { first = first; }\n   public void setSecond(Object second) { second =\
  \ second; }\n}\n```\n\n你的程序可能包含不同类型的 `Pair`，如 `Pair<String>` 或 `Pair<LocalDate>`，但擦除将它们都转换为原始\
  \ `Pair` 类型。在这一点上，Java 泛型与 C++ 模板大不同。C++ 为每个模板实例化产生不同的类型——这种现象被称为“模板膨胀”。Java 不受此问题影响。\n\
  \n原始类型将类型变量替换为第一个边界，如果没有给出边界则替换为 `Object`。假设我们声明一个略有不同的类型：\n\n点击此处查看代码图片\n\n```\n\
  public class Interval<T extends Comparable & Serializable> implements Serializable\n\
  {\n   private T lower;\n   private T upper;\n   . . .\n   public Interval(T first,\
  \ T second)\n   {\n      if (first.compareTo(second) <= 0) { lower = first; upper\
  \ = second; }\n      else { lower = second; upper = first; }\n   }\n}\n```\n\n原始类型\
  \ `Interval` 看起来是：\n\n```\npublic class Interval implements Serializable\n{\n  \
  \ private Comparable lower;\n   private Comparable upper;\n   . . .\n   public Interval(Comparable\
  \ first, Comparable second) { . . . }\n}\n```\n\n![Images](img/note.jpg) 注意\n\n\
  你可能会好奇如果交换边界会发生什么：`class Interval<T extends Serializable & Comparable>`。在这种情况下，原始类型将\
  \ `T` 替换为 `Serializable`，编译器会在需要时插入到 `Comparable` 的强制转换。为了效率考虑，你应该将标记接口（即不包含方法的接口）放在边界列表的末尾。\n\
  \n#### 8.5.2 翻译泛型表达式\n\n\n\n\n当你编写对泛型方法的调用时，如果返回类型被擦除了，编译器会插入类型转换。例如，考虑以下语句序列：\n\
  \n点击此处查看代码图片\n\n```\nPair<Employee> buddies = . . .;\nEmployee buddy = buddies.getFirst();\n\
  ```\n\n`getFirst` 擦除后的返回类型为 `Object`。编译器会自动插入到 `Employee` 的类型转换。也就是说，编译器将方法调用转换为两条虚拟机指令：\n\
  \n*   调用原始方法 `Pair.getFirst`\n*   将返回的 `Object` 强制转换为类型 `Employee`\n\n当你访问泛型字段时，也会插入类型转换。假设\
  \ `Pair` 类的 `first` 和 `second` 字段是公有的（也许这并不是一种良好的编程风格，但在 Java 中是合法的）。那么表达式：\n\n\
  点击此处查看代码图片\n\n```\nEmployee buddy = buddies.first;\n```\n\n在生成的字节码中也同样插入了类型转换。\n\
  \n### 8.5.3 泛型方法的翻译\n\n类型擦除也发生在泛型方法中。程序员通常将如下的泛型方法：\n\n点击此处查看代码图片\n\n```\npublic\
  \ static <T extends Comparable> T min(T[] a)\n```\n\n视为一组方法，但在擦除后，只剩下一个方法了：\n\n\
  点击此处查看代码图片\n\n```\npublic static Comparable min(Comparable[] a)\n```\n\n注意，类型参数\
  \ `T` 已经被擦除，只留下了它的边界类型 `Comparable`。\n\n方法的擦除带来了一些复杂性。考虑这个例子：\n\n点击此处查看代码图片\n\n\
  ```\nclass DateInterval extends Pair<LocalDate>\n{\n   public void setSecond(LocalDate\
  \ second)\n   {\n      if (second.compareTo(getFirst()) >= 0)\n         super.setSecond(second);\n\
  \   }\n   . . .\n}\n```\n\n日期间隔（DateInterval）是一对 `LocalDate` 对象，我们希望重写方法以确保第二个值永远不会小于第一个。该类被擦除为：\n\
  \n点击此处查看代码图片\n\n```\nclass DateInterval extends Pair // 擦除后\n{\n   public void setSecond(LocalDate\
  \ second) { . . . }\n   . . .\n}\n```\n\n令人惊讶的是，还有一个继承自 `Pair` 的 `setSecond` 方法，即：\n\
  \n点击此处查看代码图片\n\n```\npublic void setSecond(Object second)\n```\n\n这显然是不同的方法，因为它具有不同类型的参数——类型是\
  \ `Object` 而不是 `LocalDate`。但它*不应该*是不同的。考虑以下语句序列：\n\n点击此处查看代码图片\n\n```\nvar interval\
  \ = new DateInterval(. . .);\nPair<LocalDate> pair = interval; // OK--赋值给父类\npair.setSecond(aDate);\n\
  ```\n\n我们的期望是对 `setSecond` 的调用是多态的，并调用相应的方法。由于 `pair` 指向一个 `DateInterval` 对象，那应该是\
  \ `DateInterval.setSecond`。问题在于类型擦除干扰了多态性。为了解决这个问题，编译器在 `DateInterval` 类中生成了一个*桥接方法*（bridge\
  \ method）：\n\n点击此处查看代码图片\n\n```\npublic void setSecond(Object second) { setSecond((LocalDate)\
  \ second); }\n```\n\n为了理解为什么这样做有效，让我们仔细跟踪语句的执行：\n\n```\npair.setSecond(aDate)\n\
  ```\n\n变量 `pair` 的声明类型为 `Pair<LocalDate>`，该类型只有一个名为 `setSecond` 的方法，即 `setSecond(Object)`。虚拟机在\
  \ `pair` 所引的对象上调用该方法。该对象的类型是 `DateInterval`。因此，被调用的是方法 `DateInterval.setSecond(Object)`。该方法就是合成的桥接方法。它调用了\
  \ `DateInterval.setSecond(LocalDate)`，这正是我们想要的。\n\n桥接方法可能会变得更加奇怪。假设 `DateInterval`\
  \ 类还重写了 `getSecond` 方法：\n\n点击此处查看代码图片\n\n```\nclass DateInterval extends Pair<LocalDate>\n\
  {\n   public LocalDate getSecond() { return (LocalDate) super.getSecond(); }\n \
  \  . . .\n}\n```\n\n在 `DateInterval` 类中，有两个 `getSecond` 方法：\n\n点击此处查看代码图片\n\n```\n\
  LocalDate getSecond() // 定义在 DateInterval 中\nObject getSecond() // 重写了 Pair 中定义的方法以调用第一个方法\n\
  ```\n\n你不能写这样的 Java 代码；拥有两个相同参数类型的方法是非合法的——这里没有任何参数。然而，在虚拟机中，参数类型*和返回类型*指定了一个方法。因此，编译器可以产生字节码。\n\
  \n\n\n现在考虑相反的情况，即你从一个旧类获取了一个原始类型（raw type）的对象。你可以将其赋值给一个使用泛型的类型的变量，但通常你会收到一个警告。例如：\n\
  \n点击此处查看代码图像\n\n```\nDictionary<Integer, Components> labelTable = slider.getLabelTable();\
  \ // warning\n```\n\n这没关系——检查一下警告，并确保标签表确实包含 `Integer` 和 `Component` 对象。当然，这永远没有绝对的保证。一个恶意的代码编写者可能在\
  \ `slider` 中安装了不同的 `Dictionary`。但再次强调，这种情况并不比没有泛型之前的情况更糟糕。在最坏的情况下，你的程序将抛出一个异常。\n\
  \n在你思索完这个警告后，你可以使用一个 `annotation`（注解）来让它消失。你可以对局部变量进行注解：\n\n点击此处查看代码图像\n\n```\n\
  @SuppressWarnings(\"unchecked\")\nDictionary<Integer, Components> labelTable = slider.getLabelTable();\
  \ // no warning\n```\n\n或者你可以对整个方法进行注解，如下所示：\n\n点击此处查看代码图像\n\n```\n@SuppressWarnings(\"\
  unchecked\")\npublic void configureSlider() { . . . }\n```\n\n这个 `annotation` 关闭了对方法内部所有代码的检查。\n\
  \n### 8.6 限制与局限性\n\n在接下来的章节中，我将讨论在处理 Java 泛型时需要考虑的若干限制。这些限制中的大部分是类型擦除（type erasure）的结果。\n\
  \n### 8.6.1 类型参数不能用基本类型实例化\n\n你不能用基本类型来替换类型参数。因此，没有 `Pair<double>`，只有 `Pair<Double>`。其原因当然是类型擦除。擦除后，`Pair`\
  \ 类具有类型为 `Object` 的字段，而你不能用它们来存储 `double` 值。\n\n这确实是一个困扰，但它与 Java 语言中基本类型的独立地位是一致的。这并不是一个致命缺陷——只有八种基本类型，当包装类型不是可以接受的替代品时，你始终可以使用单独的类和方法来处理它们。\n\
  \n### 8.6.2 运行时类型查询仅对原始类型有效\n\n虚拟机中的对象始终有一个特定的非泛型类型。因此，所有的类型查询只产生原始类型。例如，\n\n点击此处查看代码图像\n\
  \n```\nif (a instanceof Pair<String>) // ERROR\n```\n\n这只能测试 `a` 是否是任何类型的 `Pair`。对于以下测试也是如此：\n\
  \n点击此处查看代码图像\n\n```\nif (a instanceof Pair<T>) // ERROR\n```\n\n或者类型转换：\n\n点击此处查看代码图像\n\
  \n```\nPair<String> p = (Pair<String>) a; // warning--can only test that a is a\
  \ Pair\n```\n\n为了提醒你这种风险，当你尝试查询一个对象是否属于某个泛型类型时，你将得到编译器错误（使用 `instanceof`）或警告（使用强制类型转换）。\n\
  \n同样的，`getClass` 方法总是返回原始类型。例如：\n\n点击此处查看代码图像\n\n```\nPair<String> stringPair =\
  \ . . .;\nPair<Employee> employeePair = . . .;\nif (stringPair.getClass() == employeePair.getClass())\
  \ // they are equal\n```\n\n比较的结果为 `true`，因为两次对 `getClass` 调用都返回 `Pair.class`。\n\
  \n### 8.6.3 你不能创建参数化类型的数组\n\n你不能实例化参数化类型的数组，例如：\n\n点击此处查看代码图像\n\n```\nvar table\
  \ = new Pair<String>[10]; // ERROR\n```\n\n这有什么问题？擦除后，`table` 的类型是 `Pair[]`。你可以将其转换为\
  \ `Object[]`：\n\n```\nObject[] objarray = table;\n```\n\n数组会记住它的组件类型，如果你尝试存储错误类型的元素，它会抛出\
  \ `ArrayStoreException`：\n\n点击此处查看代码图像\n\n```\nobjarray[0] = \"Hello\"; // ERROR--component\
  \ type is Pair\n```\n\n但擦除使得这种机制对泛型类型失效。赋值操作：\n\n点击此处查看代码图像\n\n```\nobjarray[0]\
  \ = new Pair<Employee>();\n```\n\n将通过数组存储检查，但仍会导致类型错误。由于这个原因，参数化类型的数组是被禁止的。\n\n\
  注意，只有创建这些数组是被禁止的。你可以声明一个类型为 `Pair<String>[]` 的变量。但你不能用 `new Pair<String>[10]` 初始化它。\n\
  \n![Images](img/note.jpg) 提示\n\n你可以声明通配符类型的数组然后对它们进行转换：\n\n点击此处查看代码图像\n\n```\nvar\
  \ table = (Pair<String>[]) new Pair<String>[10];\n```\n\n使用通配符类型的数组是不安全的。如果你需要泛型类型，请使用\
  \ `ArrayList`：\n\n![Images](img/tip) 提示\n\n### 8.6.4 可变参数 (Varargs)\n\n在上一节中，你看到\
  \ Java 不支持泛型数组。在本节中，我将讨论一个相关问题：向方法传递泛型类型。\n\n考虑这个带有可变参数的方法：\n\n点击此处查看代码图像\n\n```\n\
  public void addAll(Collection<T> coll, T... ts)\n   for (T t : ts) { }\n```\n\n\
  请记住 `ts` 实际上是一个数组。现在考虑这个调用：\n\n点击此处查看代码图像\n\n```\nPair<String> pair1 = . . .;\n\
  Pair<String> pair2 = . . .;\naddAll(pair1, pair2);\n```\n\n为了调用此方法，虚拟机必须创建一个 `Pair<String>`\
  \ 数组，这是违反规则的。然而，在这种情况下规则被放宽了，你会得到一个警告。\n\n你可以通过两种方式消除警告：在调用 `addAll` 时使用 `@SuppressWarnings(\"\
  unchecked\")`。或者，从 Java 7 开始，你可以对 `addAll` 方法本身使用 `@SafeVarargs`：\n\n点击此处查看代码图像\n\
  \n```\n@SafeVarargs\npublic void addAll(Collection<T> coll, T... ts)\n```\n\n该方法现在可以被泛型类型调用。对于仅仅读取参数数组元素的方法，这种注解是安全的。\n\
  \n`SafeVarargs` 只能用于 `static`、`final` 或（在 Java 9 中）`private` 构造函数和方法。任何其他方法都可能重写，导致注解毫无意义。\n\
  \n![Images](img/note.jpg) 提示\n\n你可以使用 `@SafeVarargs` 注解来绕过泛型数组的限制，使用这个方法：\n\n点击此处查看代码图像\n\
  \n```\n@SafeVarargs\nstatic <E> E[] array(E... array) { return array; }\n```\n\n\
  现在你可以调用：\n\n点击此处查看代码图像\n\n```\nPair<String>[] table = array(pair1, pair2);\n```\n\
  \n这看起来很方便，但存在一个隐藏的危险。代码：\n\n```\nObject[] objarray = table;\nobjarray[0] = new Pair<Employee>();\n\
  ```\n\n将不会产生 `ArrayStoreException`（因为数组存储只检查擦除后的类型），但之后你在处理 `table[0]` 时会得到异常。\n\
  \n### 8.6.5 你不能实例化类型变量\n\n你不能在 `new T(. . .)` 等表达式中使用类型变量。例如，以下 `Pair<T>` 构造函数是非法的：\n\
  \n点击此处查看代码图像\n\n```\npublic Pair() { first = new T(); second = new T(); } // ERROR\n\
  ```\n\n\n\n类型擦除会将 `T` 变为 `Object`，而你显然不想调用 `new Object()`。\n\n最好的变通方法（自 Java 8 起可用）是让调用者提供一个构造器表达式。例如：\n\
  \n点击此处查看代码图片\n\n```\nPair<String> p = Pair.makePair(String::new);\n```\n\n`makePair`\
  \ 方法接收一个 `Supplier<T>`，这是一个用于无参数且返回类型为 `T` 结果函数式接口：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ static <T> Pair<T> makePair(Supplier<T> constr)\n{\n   return new Pair<>(constr.get(),\
  \ constr.get());\n}\n```\n\n另一种更传统的变通方法是通过反射调用 `Constructor.newInstance` 方法来构造泛型对象。\n\
  \n遗憾的是，这些细节有点复杂。你不能调用：\n\n点击此处查看代码图片\n\n```java\nfirst = T.class.getConstructor().newInstance();\
  \ // 错误\n```\n\n表达式 `T.class` 是非法的，因为它会被擦除为 `Object.class`。相反，你必须设计 API 使得接收到一个\
  \ `Class` 对象，如下所示：\n\n点击此处查看代码图片\n\n```java\npublic static <T> Pair<T> makePair(Class<T>\
  \ cl)\n{\n   try\n   {\n      return new Pair<>(cl.getConstructor().newInstance(),\n\
  \         cl.getConstructor().newInstance());\n   }\n   catch (Exception e) { return\
  \ null; }\n}\n```\n\n该方法可以如下所示调用：\n\n点击此处查看代码图片\n\n```java\nPair<String> p = Pair.makePair(String.class);\n\
  ```\n\n注意，`Class` 类本身是泛型的。例如，`String.class` 是 `Class<String>` 的实例（实际上是唯一的实例）。因此，`makePair`\
  \ 方法可以推断出它正在创建的 pair 的类型。\n\n### 8.6.6 你不能构造泛型数组\n\n正如你不能实例化单个泛型实例一样，你不能实例化数组。原因是不同的——毕竟，数组是用\
  \ `null` 值填充的，这看起来构造起来是安全的。但数组还携带一个类型，该类型用于在虚拟机中监控数组存储操作。该类型会被擦除。例如，考虑：\n\n点击此处查看代码图片\n\
  \n```java\npublic static <T extends Comparable> T[] minmax(T... a)\n{\n   T[] mm\
  \ = new T[2]; // 错误\n   . . .\n}\n```\n\n类型擦除会导致此方法始终构造一个 `Comparable[2]` 数组。\n\n\
  如果数组仅作为类的私有实例字段使用，你可以将数组的元素类型声明为擦除类型并使用强制转换。例如，`ArrayList` 类可以这样实现：\n\n点击此处查看代码图片\n\
  \n```java\npublic class ArrayList<E>\n{\n   private Object[] elements;\n   . . .\n\
  \   @SuppressWarnings(\"unchecked\") public E get(int n) { return (E) elements[n];\
  \ }\n   public void set(int n, E e) { elements[n] = e; } // 不需要强制转换\n}\n```\n\n\
  实际实现并没有那么干净：\n\n点击此处查看代码图片\n\n```java\npublic class ArrayList<E>\n{\n   private\
  \ E[] elements;\n   . . .\n   public ArrayList() { elements = (E[]) new Object[10];\
  \ }\n}\n```\n\n在这里，强制转换 `E[]` 是一个彻裸裸的谎言，但类型擦除使其无法被检测。\n\n这种技术对于我们的 `minmax` 方法不起，因为我们返回的是\
  \ `T[]` 数组，如果对其类型撒了谎，就会会导致运行时错误。假设我们实现：\n\n点击此处查看代码图片\n\n```java\npublic static\
  \ <T extends Comparable> T[] minmax(T... a)\n{\n   var result = new Comparable[2];\
  \ // 擦除类型的数组\n   . . .\n   return (T[]) result; // 带有警告编译\n}\n```\n\n调用：\n\n点击此处查看代码图片\n\
  \n```java\nString[] names = ArrayAlg.minmax(\"Tom\", \"Dick\", \"Harry\");\n```\n\
  \n在没有任何警告的情况下编译。当方法返回后，将 `Comparable[]` 引用转换为 `String[]` 时，会发生 `ClassCastException`。\n\
  \n在这种情况下，最好让用户提供一个数组构造器表达式：\n\n点击此处查看代码图片\n\n```java\nString[] names = ArrayAlg.minmax(String[]::new,\
  \ \"Tom\", \"Dick\", \"Harry\");\n```\n\n构造器表达式 `String[]::new` 表示一个函数，它根据给定长度的情况下构造一个数组。（此处省略了原文中大量重复的句子，已按要求去重）\n\
  \n\n\n\n```java\nTask.<RuntimeException>throwAs(e);\n```\n\n然后编译器就会认为 `e` 变成了一个未检查异常。以下代码将所有异常都转换为编译器认为未检查的异常：\n\
  \n点击此处查看代码图片\n\n```java\ntry\n{\n   do work\n}\ncatch (Throwable t)\n{\n   Task.<RuntimeException>throwAs(t);\n\
  }\n```\n\n让我们用这个来解决一个棘手的问题。要在线程中运行代码，你必须将其放入实现 `Runnable` 接口的类的 `run` 方法中。但该方法不允许抛出受检查异常。我们将提供一个从\
  \ `Task` 到 `Runnable` 的适配器，`Task` 的 `run` 方法被允许抛出任意异常：\n\n点击此处查看代码图片\n\n```java\n\
  interface Task\n{\n   void run() throws Exception;\n\n   @SuppressWarnings(\"unchecked\"\
  )\n   static <T extends Throwable> void throwAs(Throwable t) throws T\n   {\n  \
  \    throw (T) t;\n   }\n\n   static Runnable asRunnable(Task task)\n   {\n    \
  \  return () ->\n         {\n            try\n            {\n               task.run();\n\
  \            }\n            catch (Exception e)\n            {\n               Task.<RuntimeException>throwAs(e);\n\
  \            }\n         };\n   }\n}\n```\n\n例如，这个程序运行了一个会抛出受检查异常的线程：\n\n点击此处查看代码图片\n\
  \n```java\npublic class Test\n{\n   public static void main(String[] args)\n   {\n\
  \      var thread = new Thread(Task.asRunnable(() ->\n         {\n            Thread.sleep(1000);\n\
  \            System.out.println(\"Hello, World!\");\n            throw new Exception(\"\
  Check this out!\");\n         }));\n      thread.start();\n   }\n}\n```\n\n`Thread.sleep`\
  \ 方法声明抛出 `InterruptedException`，我们不再需要捕获它了。由于我们没有中断线程，该异常不会被抛出。然而，程序确实抛出了受检查异常。当你运行程序时，你会得到堆栈跟踪信息。\n\
  \n这有什么了的？通常，你必须在 `Runnable` 的 `run` 方法内部捕获所有的受检查异常，并将它们*封装*成未检查异常——`run` 方法被声明为不抛任何受检查异常。\n\
  \n但在这里，我们没有封装。我们简单地抛出异常，欺骗编译器让它认为这不是受检查异常。\n\n通过泛型类、擦除和 `@SuppressWarnings` 注解，我们能够击败\
  \ Java 类型系统的一个核心部分。\n\n### 8.6.10 警惕擦除后的冲突\n\n创建在泛型类型擦除时导致冲突的条件是非法的。这里有一个例子。假设我们为\
  \ `Pair` 类添加了如下所示的 `equals` 方法：\n\n点击此处查看代码图片\n\n```java\npublic class Pair<T>\n\
  {\n   public boolean equals(T value) { return first.equals(value) && second.equals(value);\
  \ }\n   . . .\n}\n```\n\n考虑一个 `Pair<String>`。从概念上，它有两个 `equals` 方法：\n\n点击此处查看代码图片\n\
  \n```java\nboolean equals(String) // 定义在 Pair<T> 中\nboolean equals(Object) // 继承自\
  \ Object\n```\n\n但直觉误导了我们。方法的擦除\n\n```java\nboolean equals(T)\n```\n\n结果是\n\n```java\n\
  boolean equals(Object)\n```\n\n这与 `Object.equals` 方法冲突了。\n\n解决办法当然是重命名引起冲突的方法。\n\
  \n泛型规范引用了另一个规则：“为了支持通过擦除进行转换，我们实施了限制：类或类型变量不能同时是同一接口的不同参数化的两个接口类型的子类型。”例如，以下代码是非法的：\n\
  \n点击此处查看代码图片\n\n```java\nclass Employee implements Comparable<Employee> { . . .\
  \ }\nclass Manager extends Employee implements Comparable<Manager> { . . . } //\
  \ 错误\n```\n\n`Manager` 将同时实现 `Comparable<Employee>` 和 `Comparable<Manager>`，它们是同一个接口的不同参数化。\n\
  \n目前还不清楚这个限制与类型擦除之间有什么关系。毕竟，非泛型的版本\n\n点击此处查看代码图片\n\n```java\nclass Employee implements\
  \ Comparable { . . . }\nclass Manager extends Employee implements Comparable { .\
  \ . . }\n```\n\n是合法的。原因要微妙得多。这将与合成的桥接方法（bridge methods）产生冲突。实现 `Comparable<X>` 的类会获得一个桥接方法\n\
  \n点击此处查看代码图片\n\n```java\npublic int compareTo(Object other) { return compareTo((X)\
  \ other); }\n```\n\n不能为不同的类型 `X` 两个这样的方法。\n\n## 8.7 泛型的继承规则\n\n当你处理泛型类时，需要学习一些关于继承和子类型的规则。让我们从一个许多程序员感到反直觉的情况开始。考虑一个类及其子类，例如\
  \ `Employee` 和 `Manager`。`Pair<Manager>` 是 `Pair<Employee>` 的子类型吗？令人惊讶的是答案是“不是”。例如，以下代码无法编译：\n\
  \n点击此处查看代码图片\n\n```java\nPair<Employee> buddies = new Pair<Manager>(ceo, cfo); //\
  \ 错误\n```\n\n通常，`Pair<S>` 和 `Pair<T>` 之间*没有*关系，无论 `S` 和 `T` 如何相关（参见图 8.1](#ch08.xhtml_ch08fig01)）。\n\
  \n![Images](img/08fig01.jpg)\n\n8.1 Pair 类之间没有继承关系\n\n这看起来像是一个残酷的限制，但为了类型安全是必要的。假设我们允许将\
  \ `Pair<Manager>` 转换为 `Pair<Employee>`。考虑以下代码：\n\n点击此处查看代码图片\n\n```java\nvar managerBuddies\
  \ = new Pair<Manager>(ceo, cfo);\nPair<Employee> employeeBuddies = managerBuddies;\
  \ // 非法，但假设允许\nemployeeBuddies.setFirst(lowlyEmployee);\n```\n\n显然，最后语句是合法的。但 `employeeBuddies`\
  \ 和 `managerBuddies` 指向*同一个对象*。我们现在成功地将 CFO 与普通员工配对，这对于 `Pair<Manager>` 来说是不可能的。\n\
  \n![Images](img/note.jpg) 注意\n\n你刚刚看到了泛型类型与数组之间的重要区别。你可以将 `Manager[]` 数组赋值给 `Employee[]`\
  \ 类型的变量：\n\n点击此处查看代码图片\n\n```java\nManager[] managerBuddies = { ceo, cfo };\nEmployee[]\
  \ employeeBuddies = managerBuddies; // OK\n```\n\n然而，数组带有特殊的保护。如果你尝试将一个普通员工存入 `employeeBuddies[0]`，虚拟机会抛出\
  \ `ArrayStoreException`。\n\n始终可以将参数化类型转换为原始类型。例如，`Pair<Employee>` 是原始类型 `Pair` 的子类型。这种转换对于与旧代码交互是必要的。\n\
  \n你可以转换为原始类型并导致类型错误吗？遗憾的是可以。考虑这个例子：\n\n点击此处查看代码图片\n\n```java\nvar managerBuddies\
  \ = new Pair<Manager>(ceo, cfo);\nPair rawBuddies = managerBuddies; // OK\nrawBuddies.setFirst(new\
  \ File(\". . .\")); // 仅有编译警告\n```\n\n这听起来很可怕。然而，请记住，你的处境并不比旧 Java 版本糟糕。虚拟机的安全性并没有受到威胁。当异质对象通过\
  \ `getFirst` 获取并赋值给 `Manager` 变量时，会抛出 `ClassCastException`，就像过去一样。你只是失去了泛型编程通常提供的额外安全性。\n\
  \n\n\n\n最后，泛型类可以继承或实现其他泛型类。在这方面，它们与普通类没有区别。例如`ArrayList<T>` 类实现了 `List<T>` 接口。这意味着\
  \ `ArrayList<Manager>` 可以转换为 `List<Manager>`。然而，正如你刚刚看到的，一个 `ArrayList<Manager>`\
  \ 并不是 `ArrayList<Employee>` 或 `List<Employee>`。图 8.2 显示了这些关系。\n\n![Images](img/08fig02.jpg)\n\
  \n**图 8.2** 泛型列表类型之间的子类型关系\n\n## 8.8 通配符类型\n\n类型系统研究人员早些时候就知道僵化的泛型系统用起来非常不方便。Java\
  \ 的设计者发明了一种巧妙（尽管依然安全）“逃生口”：通配符类型（wildcard type）。接下来的章节将向你展示如何使用通配符。\n\n#### 8.8.1\
  \ 通配符概念\n\n在通配符类型中，类型参数允许变化。例如，通配符类型\n\n```\nPair<? extends Employee>\n```\n\n表示任何泛型\
  \ `Pair` 类型，其类型参数是 `Employee` 的子类，例如 `Pair<Manager>`，但不是 `Pair<String>`。\n\n假设你想写一个方法来打印员工对，如下所示：\n\
  \n点击此处查看代码图片\n\n```\npublic static void printBuddies(Pair<Employee> p)\n{\n   Employee\
  \ first = p.getFirst();\n   Employee second = p.getSecond();\n   System.out.println(first.getName()\
  \ + \" and \" + second.getName() + \" are buddies.\");\n}\n```\n\n正如你在上一节中看到的，你不能将\
  \ `Pair<Manager>` 传递给该方法，这相当局限性。但解决方案很简单——使用通配符类型：\n\n点击此处查看代码图片\n\n```\npublic\
  \ static void printBuddies(Pair<? extends Employee> p)\n```\n\n`Pair<Manager>` 类型是\
  \ `Pair<? extends Employee>` 的子类型（参见图 8.3）。\n\n![Images](img/08fig03.jpg)\n\n**图\
  \ 8.3** 带通配符的子类型关系\n\n我们可以通过 `Pair<? extends Employee>` 引用来破坏 `Pair<Manager>` 吗？\n\
  \n点击此处查看代码图片\n\n```\nvar managerBuddies = new Pair<Manager>(ceo, cfo);\nPair<? extends\
  \ Employee> wildcardBuddies = managerBuddies; // OK\nwildcardBuddies.setFirst(lowlyEmployee);\
  \ // 编译错误\n```\n\n无法发生任何破坏。对 `setFirst` 的调用是一个类型错误。为了了解为什么，让我们仔细观察 `Pair<? extends\
  \ Employee>` 类型。它的方法看起来是这样的：\n\n点击此处查看代码图片\n\n```\n? extends Employee getFirst()\n\
  void setFirst(? extends Employee)\n```\n\n无法调用 `setFirst` 方法！考虑调用 `wildcardBuddies.setFirst(lowlyEmployee)`。编译器知道\
  \ `setFirst` 的参数具有某种特定类型，该类型扩展了 `Employee`。这个特定类型是 `Employee` 吗？是 `Manager` 还是其他子类？编译器无办法知道。因此，编译器无法接受\
  \ `lowlyEmployee`。出于相同的原因，调用 `wildcardBuddies.setFirst(cio)`（`cio` 是一个 `Manager`\
  \ 实例）也会失败。编译器必须拒绝除 `null` 之外的所有 `setFirst` 参数。\n\n`getFirst` 方法可以继续工作。`getFirst`\
  \ 的返回值是某个特定类型的实例，该类型是 `Employee` 的子类型。编译器不知道那个特定类型是什么，但它可以保证对 `Employee` 引用的赋值是安全的。\n\
  \n这就是界限通配符（bounded wildcards）的核心思想。我们现在有一种方法来区分安全的访问方法和不修改方法。\n\n#### 8.8.2 通配符的上类型边界\n\
  \n通配符边界与类型变量边界相似，但它们增加了一个功能——你可以像这样指定一个 `supertype bound`（上类型边界）：\n\n```\n? super\
  \ Manager\n```\n\n此通配符被限制为 `Manager` 的所有上类型。（幸运的是，现有的 `super` 关键字如此准确地描述了这种关系。）\n\
  \n你为什么要这样做呢？带有上类型边界的通配符提供的行为与第 8.8 节 第 [475] 页的“ 通配符类型 ”中描述的通配符行为相反。你可以为方法提供参数，但不能使用返回值。例如，`Pair<?\
  \ super Manager>` 的方法可以描述如下：\n\n点击此处查看代码图片\n\n```\nvoid setFirst(? super Manager)\n\
  ? super Manager getFirst()\n```\n\n这不是实际的 Java 语法，但它展示了编译器知道的内容。`setFirst` 的参数类型表示为\
  \ `? super Manager` 是 `T`，其中 `Manager` 是 `T` 的子类型。直观上来说，带有上类型边界的通配符允许写入泛型对象，而带有子类型边界的通配符允许从泛型对象读取。\n\
  \n上类型边界的另一个用法。`Comparable` 接口本身是一个泛型类型。它的定义如下：\n\n点击此处查看代码图片\n\n```\npublic interface\
  \ Comparable<T>\n{\n   public int compareTo(T other);\n}\n```\n\n在这里，类型变量指示了 `other`\
  \ 参数的类型。例如，`String` 类实现了 `Comparable<String>`，它的 `compareTo` 方法定义为：\n\n点击此处查看代码图片\n\
  \n```\npublic int compareTo(String other)\n```\n\n这很好——式参数具有正确的类型。在接口泛型之前，`other`\
  \ 是 `Object`，在方法的实现中需要进行强制转换。\n\n现在 `Comparable` 是泛型类型了，也许我们应该对 `ArrayAlg` 类的 `minmax`\
  \ 方法做得更好？我们可以将其定义为：\n\n点击此处查看代码图片\n\n```\npublic static <T extends Comparable<T>>\
  \ Pair<T> minmax(T[] a)\n```\n\n这看起来比仅仅使用 `T extends Comparable` 更详尽，并且对许多类都有效。例如，如果你计算字符串数组的最小值，那么\
  \ `T` 是类型 `String`，而 `String` 是 `Comparable<String>` 的子类型。但我们在处理 `LocalDate` 对象数组时会遇到问题。事实是\
  \ `LocalDate` 实现了 `ChronoLocalDate`，而 `ChronoLocalDate` 扩展了 `Comparable<ChronoLocalDate>`。因此，`LocalDate`\
  \ 实现了 `Comparable<ChronoLocalDate>` 但*不是* `Comparable<LocalDate>`。\n\n\n\n\n在这种情况下，上类型（supertypes）派上了用场：\n\
  \n点击此处查看代码图像\n\n```\npublic static <T extends Comparable<? super T>> Pair<T> minmax(T[]\
  \ a)\n```\n\n现在 `compareTo` 方法的形式如下：\n\n```\nint compareTo(? super T)\n```\n\n它可能被声明为接收类型为\
  \ `T` 的对象，或者（例如，当 `T` 是 `LocalDate` 时）`T` 的上类型。无论如何，将类型为 `T` 的对象传递给 `compareTo`\
  \ 方法是安全的。\n\n对于初学者来说，像 `<T` `extends Comparable<? super T>` `>` 这样的声明注定会令人生畏。这很遗憾的，因为该声明的意图是通过消除对调用参数的非必要限制来帮助应用程序程序员。对泛型不感兴趣的应用程序程序员可能会很快学会忽略这些声明，并理所当然地认为库程序员会做正确的事情。如果你是一个库程序员，你将习惯通配符（wildcards），否则你的用户会诅咒你，并在代码中随机进行强制转换，直到其通过编译。\n\
  \n![图像](img/note.jpg) 注意\n\n上类型边界的另一个常见用途是函数接口的参数类型。例如，`Collection` 接口有一个方法：\n\n\
  点击此处查看代码图像\n\n```\ndefault boolean removeIf(Predicate<? super E> filter)\n```\n\n\
  该方法移除所有符合给定谓词（predicate）的元素。例如，如果你讨厌哈希码为奇数的员工，你可以像这样移除掉他们：\n\n点击此处查看代码图像\n\n```\n\
  ArrayList<Employee> staff = . . .;\nPredicate<Object> oddHashCode = obj -> obj.hashCode()\
  \ %2 != 0;\nstaff.removeIf(oddHashCode);\n```\n\n你希望能够传递一个 `Predicate<Object>`，而不仅仅是\
  \ `Predicate<Employee>`。`super` 通配符使这成为可能。\n\n#### 8.8.3 无界通配符\n\n你甚至可以使用没有任何边界的通配符——例如，`Pair<?>`。乍一看，这看起来与原始\
  \ `Pair` 类型完全相同。实际上，这些类型是完全不同的。`Pair<?>` 类型拥有如下方法：\n\n```\n? getFirst()\nvoid setFirst(?)\n\
  ```\n\n`getFirst` 的返回值只能赋值给 `Object`。`setFirst` 方法永远无法被调用，即使使用 `Object` 也不行。这就是\
  \ `Pair<?>` 和 `Pair` 之间的本质区别：你可以用任何 `Object` 调用原始 `Pair` 类的 `setFirst` 方法。\n\n![图像](img/note.jpg)\
  \ 注意\n\n你可以调用 `setFirst(null)`。\n\n你为什么需要这样一个弱小的类型呢？它对于非常简单的操作很有用。例如，以下方法测试配对是否包含\
  \ `null` 引用。它永远不需要实际类型。\n\n点击此处查看代码图像\n\n```\npublic static boolean hasNulls(Pair<?>\
  \ p)\n{\n   return p.getFirst() == null || p.getSecond() == null;\n}\n```\n\n你可以通过将\
  \ `hasNulls` 转换为泛型方法来避免使用通配符类型：\n\n点击此处查看代码图像\n\n```\npublic static <T> boolean\
  \ hasNulls(Pair<T> p)\n```\n\n然而，带有通配符类型的版本似乎更易读。\n\n### 8.8.4 通配符捕获\n\n让我们写一个交换配对元素的方法：\n\
  \n点击此处查看代码图像\n\n```\npublic static void swap(Pair<?> p)\n```\n\n通配符不是类型变量，因此我们不能编写使用\
  \ `?` 作为类型的代码。换句话说，以下代码是非法的：\n\n```\n? t = p.getFirst(); // 错误\np.setFirst(p.getSecond());\n\
  p.setSecond(t);\n```\n\n这是一个问题，因为我们在进行交换时需要临时持有第一个元素。幸运的是，这个问题有一个有趣的解决方案。我们可以像这样写一个辅助方法\
  \ `swapHelper`：\n\n点击此处查看代码图像\n\n```\npublic static <T> void swapHelper(Pair<T>\
  \ p)\n{\n   T t = p.getFirst();\n   p.setFirst(p.getSecond());\n   p.setSecond(t);\n\
  }\n```\n\n注意 `swapHelper` 是一个泛型方法，而 `swap` 不是——它有一个类型为 `Pair<?>` 的固定参数。\n\n现在我们可以从\
  \ `swap` 中调用 `swapHelper`：\n\n点击此处查看代码图像\n\n```\npublic static void swap(Pair<?>\
  \ p) { swapHelper(p); }\n```\n\n在这种情况下，`swapHelper` 方法的参数 `T` 捕获了通配符。虽然不知道通配符代表什么类型，但它是一个确定的类型，当\
  \ `T` 表示该类型时，`<T>swapHelper` 的定义就完全合理。\n\n当然，在这种情况下，我们并没有被强制使用通配符。我们可以直接实现一个没有通配符的泛型方法\
  \ `<T> void swap(Pair<T> p)`。但是，考虑这个例子，通配符类型自然出现在计算的中间：\n\n点击此处查看代码图像\n\n```\npublic\
  \ static void maxBonus(Manager[] a, Pair<? super Manager> result)\n{\n   minmax(a,\
  \ result);\n   PairAlg.swapHelper(result); // OK--swapHelper 捕获了类型\n}\n```\n\n在这里，通配符捕获机制是无法避免的。通配符捕获只在非常有限的情况下合法。编译器必须能够保证通配符代表一个单一、确定的类型。例如，`ArrayList<Pair<T>>`\
  \ 中的 `T` 无法捕获 `ArrayList<Pair<?>>` 中的通配符。列表可能持有两个 `Pair<?>`，每个的 `?` 都有不同的类型。\n\n\
