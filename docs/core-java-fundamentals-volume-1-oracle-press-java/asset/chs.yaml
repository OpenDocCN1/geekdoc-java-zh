  \  }\n49  }\n```\n\n### 3.8.4 确定循环\n\n`for` 循环是一种由计数器或每次迭代更新的变量控制迭代的通用结构。如图 3.12\
  \ 所示，以下循环在屏幕上打印从 1 到 10 的数字：\n\n```\nfor (int i = 1; i <= 10; i++)\n   System.out.println(i);\n\
  ```\n\n`for` 语句的第一个槽通常持有计数器初始化。第二个槽给出了每次新循环之前测试的条件，第三个槽指定了如何更新计数器。\n\n虽然 Java 和\
  \ C++ 允许在 `for` 循环的各个槽中使用几乎任何表达式，但良好趣味的一个不成文规则是，这三个槽应该初始化、测试并更新同一个计数器变量。忽略这一规则可以编写非常晦涩的循环。\n\
  \n即使在良好趣味的范围内，也有许多可能。例如，你可以拥有倒计数的循环：\n\n点击此处查看代码图像\n\n```\nfor (int i = 10; i >\
  \ 0; i--)\n   System.out.println(\"Counting down . . . \" + i);\nSystem.out.println(\"\
  Blastoff!\");\n```\n\n![Images](img/caution.jpg) 注意\n\n在循环中测试浮点数的等等性时要小心。像这样的 `for`\
  \ 循环\n\n\n\n\n\n点击此处查看代码图像\n\n```\nfor (double x = 0; x != 10; x += 0.1) . . .\n\
  ```\n\n可能永远不会结束。由于舍入误差，最终值可能无法精确到达。在这个示例中，`x` 从 `9.99999999999998` 跳跃到 `10.09999999999998`，因为\
  \ `0.1` 没有精确的二进制表示。\n\n当你在 `for` 语句的第一槽中声明变量时，该变量的作用范围将持续到 `for` 循环体的结束。\n\n```\n\
  for (int i = 1; i <= 10; i++)\n{\n  . . .\n}\n// i 在此处不再定义\n```\n\n\n\n特别地，如果你在\
  \ `for` 语句内部定义变量，则无法在循环外部使用它的值。因此，如果你想在 `for` 循环外部使用循环计数器的最终值，请确保在循环头之外声明它。\n\n\
  ```\nint i;\nfor (i = 1; i <= 10; i++)\n{\n   . . .\n}\n// i 在此处仍然被定义\n```\n\n相反，你可以在不同的\
  \ `for` 循环中定义相同名的变量：\n\n点击此处查看代码图像\n\n```\nfor (int i = 1; i <= 10; i++)\n{\n  \
  \ . . .\n}\n. . .\nfor (int i = 11; i <= 20; i++) // 定义另一个名为 i 的变量是允许\n{\n   . .\
  \ .\n}\n```\n\n`for` 循环仅仅是 `while` 循环的一种方便快捷方式。例如，\n\n点击此处查看代码图像\n\n```\nfor (int\
  \ i = 10; i > 0; i--)\n   System.out.println(\"Counting down . . . \" + i);\n```\n\
  \n可以重写为\n\n点击此处查看代码图像\n\n```\nint i = 10;\nwhile (i > 0)\n{\n   System.out.println(\"\
  Counting down . . . \" + i);\n   i--;\n}\n```\n\n列表 3.5 展示了一个典型的 `for` 循环示例。\n\n\
  该程序计算彩票中奖概率。例如，如果你必须从 1 到 50 的数字中选择六个数字来中奖，那么就有 (50 × 49 × 48 × 47 × 46 × 45)/(1\
  \ × 2 × 3 × 4 × 5 × 6) 种可能的结果，因此你的几是 15,890,700 分之一。祝你好运！\n\n通常情况下，如果你从 `n` 个数字中挑选\
  \ `k` 个数字，就有\n\n![图像](img/097equ01.jpg)\n\n可能的结果。以下 `for` 循环计算该值：\n\n点击此处查看代码图像\n\
  \n```\nint lotteryOdds = 1;\nfor (int i = 1; i <= k; i++)\n   lotteryOdds = lotteryOdds\
  \ * (n - i + 1) / i;\n```\n\n![图像](img/note.jpg) 注意\n\n第 3.10.3 节，“‘for each’ 循环](#ch03.xhtml_lev3_10_3)”，位于第\
  \ 112 页，描述了“通用 `for` 循环”（也称为“for each”循环），它使得访问数组或集合的所有元素变得非常方便。\n\n**列表 3.5** `LotteryOdds/LotteryOdds.java`\n\
  \n点击此处查看代码图像\n\n```\n 1 import java.util.*;\n 2\n 3 /**\n 4  * 此程序演示了一个 `for` 循环。\n\
  \ 5  * @version 1.20 2004-02-10\n 6  * @author Cay Horstmann\n 7  */\n 8 public\
  \ class LotteryOdds\n 9 {\n10    public static void main(String[] args)\n11    {\n\
  12        Scanner in = new Scanner(System.in);\n13\n14        System.out.print(\"\
  How many numbers do you need to draw? \");\n15        int k = in.nextInt();\n16\n\
  17        System.out.print(\"What is the highest number you can draw? \");\n18 \
  \       int n = in.nextInt();\n19\n20        /*\n21         * 计算二项系数 n*(n-1)*(n-2)*...*(n-k+1)/(1*2*3*...*k)\n\
  22         */\n23\n24        int lotteryOdds = 1;\n25        for (int i = 1; i <=\
  \ k; i++)\n26           lotteryOdds = lotteryOdds * (n - i + 1) / i;\n27\n28   \
  \     System.out.println(\"Your odds are 1 in \" + lotteryOdds + \". Good luck!\"\
  );\n29    }\n30```\n\n#### 3.8.5 使用 `switch` 进行多重选择\n\n`if/else` 结构在处理多个备选项时非常繁琐。`switch`\
  \ 语句使得情况变得更容易，特别是当你有多个相同的表达式时。点击此处查看代码图像\n\n```\nScanner in = new Scanner(System.in);\n\
  System.out.print(\"Select an option (1, 2, 3, 4): \");\nint choice = in.nextInt();\n\
  switch (choice)\n{\n   case 1:\n      . . .\n   case 2:\n      . . .\n   case 3:\n\
  \      . . .\n   case 4:\n      . . .\n   default:\n      System.out.println(\"\
  Bad input\");\n}\n```\n\n![图像](img/03fig.jpg) **图 13** `switch` 流程图\n\n通常情况下，一个\
  \ `switch` 语句会一直穿执行多个分支。在 Java 14 引入的 `switch` 表达式中，如果你忘记在分支末尾添加 `break`，执行将穿透到下一个分支！这种行为是非常危险的。\n\
  \n为了检测此类问题，使用 `-Xlint:fallthrough` 选项编译代码：\n\n点击此处查看代码图像\n\n```\njavac -Xlint:fallthrough\
  \ Test.java\n```\n\n此时编译器会对没有以 `break` 结尾的分支发出警告。如果你确实想使用穿透行为，请为周围的方法标记 `@SuppressWarnings(\"\
  fallthrough\")` 注解。这样就不会生成警告。（注释是一种向编译器或工具提供信息的机制。卷 II 将对注解进行深入介绍。）\n\n这两种 `switch`\
  \ 形式都是语句。在 3.5.9 节，“切换表达式](#ch03.xhtml_lev3_5_9)”，你看到了一个 `switch` *表达式*，它产生产生值。它没有穿透行为。\n\
  \n为了对称性，Java 14 也引入了具有穿透行为的 `switch` 表达式，总共有四种 `switch` 形式。表格 3.7 展示了它们。\n\n在穿透变体中，每个\
  \ `case` 都以冒号结尾。如果分支以箭头 `->` 结尾，则没有穿透。你不能在单个 `switch` 语句中混合使用冒号和箭头。\n\n注意 `switch`\
  \ 表达式中的 `yield` 关键字。它像 `break` 一样终止执行。与 `break` 不同，它还产生一个值——表达式的值。\n\n为了在不穿透的 `switch`\
  \ 表达式的分支中使用语句，你必须使用大括号和 `yield`，正如表中向某个分支添加了日志语句的示例所示：\n\n```\ncase \"Spring\" ->\n\
  \   {\n     System.out.println(\"spring time!\");\n     yield 6;\n   }\n```\n\n\
  `switch` 表达式的每个分支必须产生一个值。最常见的是，每个值都位于 `->` 箭头后面：\n\n```\ncase \"Summer\", \"Winter\"\
  \ -> 6;\n```\n\n\n\n\n\n```java\nint numLetters = switch (seasonName)\n   {\n  \
  \    case \"Spring\" ->\n         {\n            System.out.println(\n         \
  \      \"spring time!\");\n            yield 6;\n         }\n      case \"Summer\"\
  , \"Winter\" -> 6;\n      case \"Fall\" -> 4;\n      default -> -1;\n   };\n```\n\
  \n```java\nswitch (seasonName)\n{\n   case \"Spring\" ->\n      {\n        System.out.println(\n\
  \           \"spring time!\");\n        numLetters = 6;\n      }\n   case \"Summer\"\
  , \"Winter\" ->\n      numLetters = 6;\n   case \"Fall\" ->\n      numLetters =\
  \ 4;\n   default ->\n      numLetters = -1;\n}\n```\n\n### 穿穿 点击此处查看代码图片\n\n```java\n\
  int numLetters = switch (seasonName)\n   {\n      case \"Spring\":\n         System.out.println(\n\
  \            \"spring time!\");\n      case \"Summer\", \"Winter\":\n         yield\
  \ 6;\n      case \"Fall\":\n         yield 4;\n      default:\n         yield -1;\n\
  \   };\n```\n\n```java\nswitch (seasonName)\n{\n   case \"Spring\":\n      System.out.println(\n\
  \         \"spring time!\");\n   case \"Summer\", \"Winter\":\n      numLetters\
  \ = 6;\n      break;\n   case \"Fall\":\n      numLetters = 4;\n      break;\n \
  \  default:\n      numLetters = -1;\n}\n```\n\n**表 3.7** `switch` 的四种形式\n\n![Images](img/note.jpg)\
  \ 注意\n\n在 `switch` 表达式的分支中抛出异常是合法的。例如：\n\n点击此处查看代码图片\n\n```java\ndefault -> throw\
  \ new IllegalArgumentException(\"Not a valid season\");\n```\n\n异常将在 第 7 章 中详细介绍。\n\
  \n![Images](img/caution.jpg) 注意事项\n\n`switch` 表达式的目的是产生一个值（或通过异常失败）。你不允许“跳出”：\n\n\
  点击此处查看代码图片\n\n```java\ndefault -> { return -1; } // 错误\n```\n\n具体而言，你不能在 switch\
  \ 表达式中使用 `return`、`break` 或 `continue` 语句。（后两者请参见 第 3.8.6 节 “中断控制流的语句”，见第 103 页。）\n\
  \n对于有如此多的 `switch` 变体，你应该选择哪一个呢？\n\n优先使用 `switch` 表达式而不是 `switch` 语句。如果每个分支都在变量赋值或方法调用计算值，请用表达式\
  \ yield 该值，然后使用它。例如：\n\n点击此处查看代码图片\n\n```java\nnumLetters = switch (seasonName)\n\
  \   {\n      case \"Spring\", \"Summer\", \"Winter\" -> 6\n      case \"Fall\" ->\
  \ 4\n      default -> -1\n   };\n```\n\n优于\n\n点击此处查看代码图片\n\n```java\nswitch (seasonName)\n\
  {\n   case \"Spring\", \"Summer\", \"Winter\" ->\n      numLetters = 6;\n   case\
  \ \"Fall\" ->\n      numLetters = 4;\n   default ->\n      numLetters = -1;\n}\n\
  ```\n\n只有当你实际上需要“穿透”（fallthrough），或者你必须向 `switch` 表达式中添加语句时，才只使用 `break` 或 `yield`。这些情况极其罕见。\n\
  \n#### 3.8.6 中断控制流的语句\n\n尽管 Java 的设计者保留了 `goto` 作为保留字，但他们决定不将其包含在语言中。通常，`goto` 语句被认为是不良风格。有些程序员认为反\
  \ `goto` 的力量走得太远（例如，参考 Donald Knuth 著名的文章《带有 goto 语句的结构化编程》）。他们认为，无限制地使用 `goto`\
  \ 容易出错，但偶尔*跳出循环*是有益的。Java 的设计者同意了这一点，甚至增加了一个新语句——带标签的 `break`，以支持这种编程风格。\n\n让我们先看看无标签的\
  \ `break` 语句。你用于退出 `switch` 语句的同一个 `break` 语句也可以用于跳出循环。例如：\n\n点击此处查看代码图片\n\n```java\n\
  while (years <= 100)\n{\n    balance += payment;\n    double interest = balance\
  \ * interestRate / 100;\n    balance += interest;\n    if (balance >= goal) break;\n\
  \    years++;\n}\n```\n\n现在，如果在循环顶部出现 `years > 100` 或者在循环中间出现 `balance >= goal`，循环就会退出。当然，你可以在不使用\
  \ `break` 的情况下为 `years` 计算相同的值，如下所示：\n\n点击此处查看代码图片\n\n```java\nwhile (years <= 100)\n\
  {\n    balance += payment;\n    double interest = balance * interestRate / 100;\n\
  \    balance += interest;\n    if (balance >= goal) break;\n    years++;\n}\n```\n\
  \n实际上，如果不使用 `break`，你可以为 `years` 计算相同的值，如下：\n\n点击此处查看代码图片\n\n```java\nwhile (years\
  \ <= 100)\n{\n    balance += payment;\n    double interest = balance * interestRate\
