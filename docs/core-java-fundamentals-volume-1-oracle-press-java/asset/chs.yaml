  \ | 11300.00 | 11400.00 | 11500.00 |\n| 12100.00 | 12321.00 | 12544.00 | 12769.00\
  \ | 12996.00 | 13225.00 |\n| 13310.00 | 13676.31 | 14049.28 | 14428.97 | 14815.44\
  \ | 15208.75 |\n| 14641.00 | 15180.70 | 15735.19 | 16304.74 | 16889.60 | 17490.06\
  \ |\n| 16105.10 | 16850.58 | 17623.42 | 18424.35 | 19254.15 | 20113.57 |\n| 17715.61\
  \ | 18704.15 | 19738.23 | 20819.52 | 21949.73 | 23130.61 |\n| 19487.17 | 20761.60\
  \ | 22106.81 | 23526.05 | 25022.69 | 26600.20 |\n| 21435.89 | 23045.38 | 24759.63\
