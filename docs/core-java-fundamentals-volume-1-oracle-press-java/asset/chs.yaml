  \ stealing`工作窃取）的有效启发式策略来在可用线程之间平衡负载。每个工作线程都有一个用于任务的 deque（双端队列）。工作线程将子任务推送到其自己的队列的头部。（只有一个线程访问头部，因此不需要锁。）。当一个工作线程空闲时，它会从另一个队列的尾部“窃取”一个任务。由于较大的子任务位于尾部，这种窃取非常罕见。\n\
  \n![Images](img/caution.jpg) 警告\n\nFork-join 池针对非阻塞工作负载进行了优化。如果你向 fork-join 池中添加了许多阻塞任务，可能会导致它饥饿。可以通过让任务实现\
  \ `ForkJoinPool.ManagedBlocker` 接口来克服这一点，但这是一种我们不会讨论的高级技术。\n\n**Listing 12.9** `forkJoin/ForkJoinTest.java`\n\
  \n点击此处查看代码\n\n```\n 1  package forkJoin;\n 2\n 3  import java.util.concurrent.*;\n\
