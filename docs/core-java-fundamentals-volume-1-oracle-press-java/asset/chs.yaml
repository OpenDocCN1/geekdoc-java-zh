  \    public static void search(Path file, String keyword) throws IOException\n103\
  \    {\n104       try (var in = new Scanner(file, StandardCharsets.UTF_8))\n105\
  \       {\n106          int lineNumber = 0;\n107          while (in.hasNextLine())\n\
  108          {\n109             lineNumber++;\n110             String line = in.nextLine();\n\
