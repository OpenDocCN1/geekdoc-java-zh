  \n使用 `newCachedThreadPool` 当你有很多长时间阻塞的线程时。为了最佳速度，并发线程数是处理器核心数。在这种情况下，你应该使用一个固定线程池来限制并发线程数。\n\
  \n![图片](img/note.jpg) 注意\n\nJava EE 提供了 `ManagedExecutorService` 子类，适用于 Java EE\
  \ 环境下的并发任务。同样，Play 等 Web 框架为框架设计的执行器。\n\n你可以将 `Runnable` 或 `Callable` 提交给具有以下方法的的\
  \ `ExecutorService`：\n\n点击此处查看代码图片\n\n```\nFuture<T> submit(Callable<T> task)\n\
  Future<?> submit(Runnable task)\nFuture<T> submit(Runnable task, T result)\n```\n\
  \n池将在方便时运行提交的任务。当你调用 `submit` 时，你会得到一个 `Future` 对象，你可以用它获取结果或取消任务。\n\n第二个 `submit`\
  \ 方法返回一个奇怪的 `Future<?>`。你可以使用此类对象调用 `isDone`、`cancel` 或 `isCancelled`，但其 `get` 方法在完成后简单地返回\
  \ `null`。\n\n第三种 `submit` 产生一个 `Future`，其 `get` 方法在完成后会返回指定的 `result` 对象。\n\n当你不再线程池时，调用\
  \ `shutdown`。该方法会启动池的关闭程序。关闭的执行器不再接受新任务。当所有任务完成后，池中的线程就会死亡。或者，你可以调用 `shutdownNow`。池随后会取消所有尚未开始的任务。\n\
  \n以下是使用线程池的操作总结：\n\n1.  调用 `Executors` 类的静态 `newCachedThreadPool` 或 `newFixedThreadPool`\
  \ 方法。\n2.  调用 `submit` 提交 `Callable` 或 `Runnable` 对象。\n3.  保留返回的 `Future` 对象，以便获取结果或取消任务。\n\
  4.  当你不再提交任何任务时，调用 `shutdown`。\n\n\n\n\n\n`ScheduledExecutorService` 接口具有用于调度或重复执行任务的方法。它是\
  \ `java.util.Timer` 的泛化，允许使用线程池。`Executors` 类的 `newScheduledThreadPool` 和 `newSingleThreadScheduledExecutor`\
  \ 方法返回实现 `ScheduledExecutorService` 接口的对象。\n\n你可以调度一个 `Runnable` 或 `Callable` 在初始延迟后运行一次。你也可以调度一个\
  \ `Runnable` 定期运行。详细信息请参见 API 注释。\n\n### `java.util.concurrent.Executors` 5\n\n\
  * `ExecutorService newCachedThreadPool()`\n  返回一个缓存线程池，该线程池根据需要创建线程并终止空闲 60 秒的线程。\n\
  * `ExecutorService newFixedThreadPool(int threads)`\n  返回一个使用给定数量线程执行任务的线程池。\n*\
  \ `ExecutorService newSingleThreadExecutor()`\n  返回一个在单线程中按顺序执行任务的执行器。\n* `ScheduledExecutorService\
  \ newScheduledThreadPool(int threads)`\n  返回一个使用给定数量线程来调度任务的线程池。\n* `ScheduledExecutorService\
  \ newSingleThreadScheduledExecutor()`\n  返回一个在单线程中调度任务的执行器。\n\n### `java.util.concurrent.ExecutorService`\
  \ 5\n\n* `Future<T> submit(Callable<T> task)`\n* `Future<T> submit(Runnable task,\
  \ T result)`\n* `Future<?> submit(Runnable task)`\n  提交给定任务以执行。\n* `void shutdown()`\n\
  \  关闭服务，完成已提交的任务，但不再接受新的提交。\n\n### `java.util.concurrent.ThreadPoolExecutor` 5\n\
  \n* `int getLargestPoolSize()`\n  返回此执行器在生命周期内线程池的最大尺寸。\n\n### `java.util.concurrent.ScheduledExecutorService`\
  \ 5\n\n* `ScheduledFuture<V> schedule(Callable<V> task, long time, TimeUnit unit)`\n\
  * `ScheduledFuture<?> schedule(Runnable task, long time, TimeUnit unit)`\n  在给定时间通过后调度给定任务。\n\
  * `ScheduledFuture<?> scheduleAtFixedRate(Runnable task, long initialDelay, long\
  \ period, TimeUnit unit)`\n  调度给定任务在初始延迟通过后，每隔 `period` 单位定期运行。\n* `ScheduledFuture<?>\
  \ scheduleWithFixedDelay(Runnable task, long initialDelay, long delay, TimeUnit\
  \ unit)`\n  调度给定任务在初始延迟通过后，在一次调用完成与下一次开始之间间隔 `delay` 单位进行定期运行。\n\n## 12.6.3 控制任务组\n\
  \n你已经看到过如何使用执行器服务作为线程池来提高任务执行的效率。有时，使用执行器是为了更具策略性的原因——仅仅是为了控制一组相关的任务。例如，你可以使用 `shutdownNow`\
  \ 方法取消执行器中的所有任务。\n\n`invokeAny` 方法提交 `Callable` 集合中的所有对象，并返回已完成任务的结果。你不知道是哪一个任务——推测，它是完成最快的那一个。对于你愿意接受任何解决方案的搜索问题，请使用此方法。例如，假设你需要对一个大整数进行因数分解——这是破解\
  \ RSA 密文所需的计算。你可以提交多个任务，每个任务尝试对不同范围内的数字进行因数分解。只要其中一个任务得有了答案，你的计算就可以停止。\n\n`invokeAll`\
  \ 方法提交 `Callable` 集合中的所有对象，阻塞直到所有任务都完成，并返回一个表示所有任务解决方案的 `Future` 对象列表。当计算结果可用时，你可以这样处理它们：\n\
  \n```\nList<Callable<T>> tasks = . . .;\nList<Future<T>> results = executor.invokeAll(tasks);\n\
  for (Future<T> result : results)\n   processFurther(result.get());\n```\n\n在 `for`\
  \ 循环中，第一次调用 `result.get()` 会阻塞直到第一个结果可用。如果所有任务都在大约相同的时间完成，这就不是问题。然而，按照结果可用的顺序获取结果可能是值得的。这可以通过\
  \ `ExecutorCompletionService` 来安排。\n\n从通常方式获取的执行器开始。然后构造一个 `ExecutorCompletionService`。将任务提交到完成服务中。该服务管理一个\
  \ `Future` 对象的阻塞队列，当提交的任务的结果可用时将其包含其中。因此，对于上述计算，更高效的组织方式如下：\n\n```\nvar service\
  \ = new ExecutorCompletionService<T>(executor);\nfor (Callable<T> task : tasks)\
  \ service.submit(task);\nfor (int i = 0; i < tasks.size(); i++)\n   processFurther(service.take().get());\n\
  ```\n\nListing 12.8 中的程序显示了如何使用 callables 和执行器。在第一次计算中，我们统计目录树中有多少个文件包含给定的单词。我们为每个文件创建一个一个单独的任务：\n\
  \n```\nSet<Path> files = descendants(Path.of(start));\nvar tasks = new ArrayList<Callable<Long>>();\n\
  for (Path file : files)\n{\n   Callable<Long> task = () -> occurrences(word, file);\n\
  \   tasks.add(task);\n}\n```\n\n然后我们将任务提交给执行器服务：\n\n```\nExecutorService executor\
  \ = Executors.newCachedThreadPool();\nList<Future<Long>> results = executor.invokeAll(tasks);\n\
  ```\n\n为了获得合并计数，我们相加所有结果，并阻塞直到它们可用：\n\n```\nlong total = 0;\nfor (Future<Long> result\
  \ : results)\n{\n   total += result.get();\n```\n\n在程序的后部分，我们搜索第一个包含给定单词的文件。我们使用\
  \ `invokeAny` 来并行化搜索。在这里，我们必须更仔细地构建任务。`invokeAny` 方法在任何任务返回时就会终止。因此，我们不能让搜索任务返回一个表示成功或失败的\
  \ `boolean`。我们不希望在任务失败时停止搜索。相反，失败的任务会抛出 `NoSuchElementException`。此外，当一个任务成功时，其他任务会被取消。因此，我们监控中断状态。如果底层线程被中断，搜索任务会在终止前打印一条消息，以便你可以看到取消是有效的。\n\
  \n```\npublic static Callable<Path> searchForTask(String word, Path path)\n{\n \
  \  return () ->\n      {\n         try (var in = new Scanner(path))\n         {\n\
  \            while (in.hasNext())\n            {\n               if (in.next().equals(word))\
  \ return path;\n               if (Thread.currentThread().isInterrupted())\n   \
  \            {\n                  System.out.println(\"Search in \" + path + \"\
  \ canceled.\");\n                  return null;\n               }\n            }\n\
  \            throw new NoSuchElementException();\n         }\n      };\n}\n```\n\
  \n（此处翻译结束）\n\n\n\n\n\n## 列表 12.8 `executors/ExecutorDemo.java`\n\n点击此处查看代码图片\n\n\
