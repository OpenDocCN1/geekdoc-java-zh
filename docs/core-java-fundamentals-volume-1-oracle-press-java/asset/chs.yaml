  \ `break` 或 `continue`。\n\n## 3.9 大数\n\n如果基本整数和浮点数类型的精度不够，你可以转向 `java.math` 包中的几个简用类：`BigInteger`\
  \ 和 `BigDecimal`。这些类用于处理具有任意长度数字序列的数字。`BigInteger` 类实现了任意精度的整数算术，而 `BigDecimal`\
  \ 对浮点数执行相同的操作。\n\n使用静态的 `valueOf` 方法将普通数字转换为大数：\n\n点击此处查看代码图片\n\n```\nBigInteger\
  \ a = BigInteger.valueOf(100);\n```\n\n对于更长的数字，请使用带有字符串参数的构造函数：\n\n点击此处查看代码图片\n\n\
  ```\nBigInteger reallyBig\n   = new BigInteger(\"222232244629420445529739893461909967206666939096499764990979600\"\
  );\n```\n\n此外还有常量 `BigInteger.ZERO`、`BigInteger.ONE`、`BigInteger.TEN`，以及从 Java 9\
  \ 开始的 `BigInteger.TWO`。\n\n![Images](img/caution.jpg) 警告\n\n使用 `BigDecimal` 类时，你应该始终使用带有字符串参数的构造函数。有一个构造函数是\
  \ `BigDecimal(double)`，它本质上容易产生舍入误差：`new BigDecimal(0.1)` 产生的数字\n\n点击此处查看代码图片\n\n\
  ```\n0.1000000000000000055511151231257827021181583404541015625\n```\n\n遗憾的是，你不能使用熟悉的数学运算符（如\
  \ `+` 和 `*`）来组合大数。相反，你必须使用大数类中的 `add` 和 `multiply` 等方法。\n\n点击此处查看代码图片\n\n```\nBigInteger\
  \ c = a.add(b); // c = a + b\nBigInteger d = c.multiply(b.add(BigInteger.valueOf(2)));\
  \ // d = c * (b + 2)\n```\n\n![Images](img/cnote.jpg) C++ 注意\n\n与 C++ 不同，Java 没有可编程的运算符重载。`BigInteger`\
  \ 类的程序员无法重新定义 `+` 和 `*` 运算符，以为 `BigInteger` 类提供 `add` 和 `multiply` 操作。语言设计者确实重载了\
  \ `+` 运算符来表示字符串拼接。他们选择不重载其他运算符，也没有给 Java 程序员在他们自己的类中重载运算符的机会。\n\n列表 3.6 显示了对 列表\
