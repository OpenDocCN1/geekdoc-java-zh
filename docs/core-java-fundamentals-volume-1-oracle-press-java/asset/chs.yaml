  \n#### 10.3.3 使用字体\n\n本章开头的“Not a Hello World”程序使用默认字体显示字符串。有时，你可能希望用不同的字体显示文本。你可以通过`字体面名称`（font\
  \ face name）指定字体。字体面名称由`字体族名称`（font family name，例如“Helvetica”）以及可选的后缀（如“Bold”）组成。例如，字体面“Helvetica”和“Helvetica\
  \ Bold”都被视为名为“Helvetica”的族的一部分。\n\n要查找特定计算机上可用的字体，请调用`GraphicsEnvironment`类的类的`getAvailableFontFamilyNames`方法。该方法返回一个包含所有可用字体名称的字符串数组。要获取描述用户系统图形环境的`GraphicsEnvironment`类的实例，请使用静态方法`getLocalGraphicsEnvironment`。以下程序将打印你系统中所有字体的名称：\n\
  \n点击此处查看代码图像\n\n```\nimport java.awt.*;\n\npublic class ListFonts\n{\n   public\
  \ static void main(String[] args)\n   {\n      String[] fontNames = GraphicsEnvironment\n\
  \         .getLocalGraphicsEnvironment()\n         .getAvailableFontFamilyNames();\n\
  \      for (String fontName : fontNames)\n         System.out.println(fontName);\n\
  \   }\n}\n```\n\nAWT 定义了五个逻辑字体名称：\n\n```\nSansSerif\nSerif\nMonospaced\nDialog\n\
  DialogInput\n```\n\n这些名称始终映射到客户端机器上实际存在的字体。例如，在 Windows 系统上，`SansSerif`映射到`Arial`。\n\
  \n此外，Oracle JDK 始终包含三个名为“Lucida Sans”、“Lucida Bright”和“Lucida Sans Typewriter”的字体族。\n\
  \n要用某种字体绘制字符，你必须先创建一个`Font`类的对象。指定字体面名称、字体样式和字号。以下是如何构造`Font`对象的示例：\n\n点击此处查看代码图像\n\
  \n```\nvar sansbold14 = new Font(\"SansSerif\", Font.BOLD, 14);\n```\n\n第三个参数是字号。磅值在排版中通常用于指示字体的大小。每英寸有\
  \ 72 磅。\n\n你可以在`Font`构造函数中使用逻辑字体名称代替字体面名称。通过将`Font`构造函数的第二个参数设置为以下值之一，可以指定样式（普通、`bold`、`italic`或`bold\
  \ italic`）：\n\n```\nFont.PLAIN\nFont.BOLD\nFont.ITALIC\nFont.BOLD + Font.ITALIC\n\
  ```\n\n字体是字号为 1 磅的普通字体。使用`deriveFont`方法获取所需大小的字体：\n\n```\nFont f = f1.deriveFont(14.0F);\n\
  ```\n\n![Images](img/caution.jpg) 注意\n\n`deriveFont`方法有两个重载版本。其中一个版本（带有`float`参数）设置字体大小，另一个（带有`int`参数）设置字体样式。因此，`f1.deriveFont(14)`设置的是样式而不是大小！（结果是斜体字体，这是因为`14`的二进制表示恰好设置了`ITALIC`位，但没有设置`BOLD`位。）\n\
  \n以下代码，它将使用你系统上的标准无衬线字体，以 14 磅粗体字显示字符串“Hello, World!”：\n\n点击此处查看代码图像\n\n```\nvar\
  \ sansbold14 = new Font(\"SansSerif\", Font.BOLD, 14);\ng2.setFont(sansbold14);\n\
  var message = \"Hello, World!\";\ng2.drawString(message, 75, 100);\n```\n\n接下来，让我们让字符串在其组件中居中，而不是在任意位置绘制。我们需要知道字符串在像素中的宽度和高度。这些维度取决于三个因素：\n\
  \n* 使用的字体（在本例中，是无衬线字体、粗体、14 磅）；\n* 字符串本身（在本例中，是“Hello, World!”）；\n* 绘制字体的设备（在本例中，是用户的屏幕）。\n\
  \n要获取表示屏幕设备字体特征的对象，请调用`Graphics2D`类的`getFontRenderContext`方法。它返回一个`FontRenderContext`类的对象。只需将该对象传递给`FontRenderContext`即可。\n\
  \n\n\n\n```java\npackage font;\n\nimport java.awt.*;\nimport java.awt.font.*;\n\
  import java.awt.geom.*;\nimport javax.swing.*;\n\n/**\n * @version 1.35 2018-04-10\n\
  \ * @author Cay Horstmann\n */\npublic class FontTest\n{\n    public static void\
  \ main(String[] args)\n    {\n       EventQueue.invokeLater(() ->\n          {\n\
  \             var frame = new FontFrame();\n             frame.setTitle(\"FontTest\"\
  );\n             frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n       \
  \      frame.setVisible(true);\n          });\n    }\n}\n\n/**\n * 带有文本消息组件的框架。\n\
  \ */\nclass FontFrame extends JFrame\n{\n    public FontFrame()\n    {\n       add(new\
  \ FontComponent());\n       pack();\n    }\n}\n\n/**\n * 在框内显示居中消息的组件。\n */\nclass\
  \ FontComponent extends JComponent\n{\n    private static final int DEFAULT_WIDTH\
  \ = 300;\n    private static final int DEFAULT_HEIGHT = 200;\n\n    public void\
  \ paintComponent(Graphics g)\n    {\n       var g2 = (Graphics2D) g;\n\n       String\
  \ message = \"Hello, World!\";\n\n       var f = new Font(\"Serif\", Font.BOLD,\
  \ 36);\n       g2.setFont(f);\n\n       // 测量消息的大小\n\n       FontRenderContext context\
  \ = g2.getFontRenderContext();\n       Rectangle2D bounds = f.getStringBounds(message,\
  \ context);\n\n       // 设置 (x,y) = 文本的左上角\n\n       double x = (getWidth() - bounds.getWidth())\
  \ / 2;\n       double y = (getHeight() - bounds.getHeight()) / 2;\n\n       // 在\
  \ y 上加上高度以到达基线\n\n       double ascent = -bounds.getY();\n       double baseY =\
  \ y + ascent;\n\n       // 绘制消息\n\n       g2.drawString(message, (int) x, (int)\
  \ baseY);\n\n       g2.setPaint(Color.LIGHT_GRAY);\n\n       // 绘制基线\n\n       g2.draw(new\
  \ Line2D.Double(x, baseY, x + bounds.getWidth(), baseY));\n\n       // 绘制外矩形\n\n\
  \       var rect = new Rectangle2D.Double(x, y, bounds.getWidth(), bounds.getHeight());\n\
  \       g2.draw(rect);\n    }\n\n    public Dimension getPreferredSize()\n    {\n\
  \       return new Dimension(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n    }\n}\n```\n\n\
  ### `java.awt.Font` 1.0\n\n*   `Font(String name, int style, int size)`\n    创建一个新的字体对象。字体名称可以是字体族名称（如\
  \ `\"Helvetica Bold\"`），也可以是逻辑字体名称（如 `\"Serif\"`、`\"SansSerif\"`）。样式为 `Font.PLAIN`、`Font.BOLD`、`Font.ITALIC`\
  \ 或 `Font.BOLD + Font.ITALIC` 之一。\n\n*   `String getFontName()`\n    获取字体族名称（如 `\"\
  Helvetica Bold\"`）。\n\n*   `String getFamily()`\n    获取字体族名称（如 `\"Helvetica\"`）。\n\
  \n*   `String getName()`\n    如果字体字体是使用逻辑字体名称创建的，则获取逻辑名称（如 `\"SansSerif\"`）；否则获取字体族名称。\n\
  \n*   `Rectangle2D getStringBounds(String s, FontRenderContext context)` 1.2\n \
  \   返回一个包含字符串的矩形。矩形的原点位于基线处。矩形的顶部 `y` 坐标等于升部（ascent）的负值。矩形的高度等于升部、下降（descent）和行距（leading）之和。宽度等于字符串宽度。\n\
  \n*   `LineMetrics getLineMetrics(String s, FontRenderContext context)` 1.2\n  \
  \  返回一个行度量对象以确定字符串的范围。\n\n*   `Font deriveFont(int style)` 1.2\n\n*   `Font deriveFont(float\
  \ size)` 1.2\n\n*   `Font deriveFont(int style, float size)` 1.2\n    返回一个与此字体相同的新字体，仅是它具有指定的尺寸和样式。\n\
  \n### `java.awt.font.LineMetrics` 1.2\n\n*   `float getAscent()`\n    获取字体升部——从基线到大写字母顶部的距离。\n\
  \n*   `float getDescent()`\n    获取字体下降部——从基线到字母下部部分的距离。\n\n*   `float getLeading()`\n\
  \    获取行距——行与行之间的空间。\n\n*   `float getHeight()`\n    获取总高度——升部、下降和行距之和。\n\n### `java.awt.geom.Graphics2D`\n\
  \n*   `FontRenderContext getFontRenderContext()`\n    获取上下文。\n\n*   `void drawString(String\
  \ s, int x, int y)`\n    在指定位置绘制字符串。\n\n### `javax.swing.JComponent`\n\n*   `LineMetrics\
  \ getLineMetrics(Font f)`\n    获取给定字体的度量。\n\n### `java.awt.font.LineMetrics`\n\n\
  *   `FontRenderContext getFontRenderContext()`\n    获取上下文。\n\n#### 10.3 显示图像\n\n\
  你可以使用 `ImageIcon` 来平铺图像：\n\n```java\nImage image = new ImageIcon(filename).getImage();\n\
  ```\n\n现在 `image` 包含了数据。使用 `Graphics` 类的 `drawImage` 方法：\n\n```java\npublic void\
  \ paintComponent(Graphics g)\n{\n   g.drawImage(image, 0, 0, null);\n}\n```\n\n\
  我们可以进一步改进，如代码所示，平铺窗口：\n\n```java\nfor (int i = 0; i < getWidth(); i++)\n   for (int\
  \ j = 0; j < getHeight(); j++)\n      if (i + j > 0)\n         g.copyArea(0, 0,\
  \ imageWidth, imageHeight, i, j);\n```\n\n![Images](img/10fig1.jpg)\n\n**图 10.11**\
  \ 平铺图像的窗口\n\n### `java.awt.Graphics`\n\n*   `boolean drawImage(Image img, int x,\
  \ int y, ImageObserver observer)`\n    绘制未缩放图像。注意：此调用可能在绘制之前返回。`observer` 对象会被通知进度。这在过去是一个实用的功能。现在传递\
  \ `null` 即可。\n\n*   `boolean drawImage(Image img, int x, int y, int width, int height,\
  \ ImageObserver observer)`\n    绘制未缩放或缩放的图像。\n\n*   `void copyArea(int x, int y,\
  \ int width, int height, int dx, int dy)`\n    复制屏幕区域。`dx` 和 `dy` 参数是源区域到目标区域的距离。\n\
  \n### 10.4 事件处理\n\n任何支持 GUI 的操作系统环境都会持续监控事件，如击键或鼠标点击。这些事件会被报告给正在运行的程序。每个程序然后决定对这些事件做什么（如果有的话）。\n\
  \n#### 10.4.1 基本事件处理概念\n\n在 AWT 中，*事件源*（如按钮或滚动条）拥有允许你注册*事件监听器*的方法——这些对象负责执行所需的响应。\n\
  \n*   事件监听器是实现*监听器接口*的类的实例。\n\n*   事件源是可以注册监听器对象并向它们发送事件对象的对象。\n\n\n\n\n\n*   当事件发生时，事件源会向所有注册的监听器发送事件对象。\n\
  *   监听器对象随后使用事件对象中的信息来确定它们对事件的反应。\n\n图 10.12 显示了事件处理类和接口之间的关系。\n\n以下是一个指定监听器的示例：\n\
  \n点击此处查看代码图像\n\n```\nActionListener listener = . . .;\nvar button = new JButton(\"\
  OK\");\nbutton.addActionListener(listener);\n```\n\n![Images](img/10fig12.jpg)\n\
  \n**图 10.12** 事件源与监听器之间的关系\n\n现在，每当 `button` 发生“动作事件”时，`listener` 对象就会收到通知。对于`buttons`来说，正如你所预期的，动作事件就是按钮点击。\n\
  \n要实现 `ActionListener` 接口，监听器类必须有一个名为 `actionPerformed` 的方法，该方法接收一个 `ActionEvent`\
  \ 对象作为参数。\n\n点击此处查看代码图像\n\n```\nclass MyListener implements ActionListener\n{\n\
  \   . . .\n   public void actionPerformed(ActionEvent event)\n   {\n      // 对按钮点击的反应在这里\n\
  \      . . .\n   }\n}\n```\n\n每当用户点击 `button` 时，`JButton` 对象都会创建一个 `ActionEvent`\
  \ 对象并调用 `listener.actionPerformed(event)`，传递该事件对象。像 `button` 这样的事件源可以有多个监听器。在这种情况下，每当用户点击\
  \ `button` 时，都会调用所有监听器的 `actionPerformed` 方法。\n\n图 10.13 显示了事件源、事件监听器和事件对象之间的交互。\n\
  \n![Images](img/10fig13.jpg)\n\n**图 10.13** 事件通知\n\n### 10.4.2 示例：处理按钮点击\n\n为了熟悉事件委托模型，让我们详细介绍响应按钮点击的简单示例所需的所有细节。在这个示例中，我们将显示一个包含三个按钮的面板（panel）。三个监听器对象被作为动作监听器添加到这些按钮上。\n\
  \n在这种场景下，每当用户点击 `panel` 上的任何按钮时，关联的监听器对象都会接收一个指示按钮点击的 `ActionEvent`。在我们的程序中，监听器对象将更改\
  \ `panel` 的背景颜色。\n\n在向你展示监听按钮点击的程序之前，我需要解释如何创建按钮以及如何将它们添加到 `panel` 中。\n\n要创建一个按钮，请在按钮构造函数中指定标签字符串、图标或两者都有。以下是两个示例：\n\
  \n点击此处查看代码图像\n\n```\nvar yellowButton = new JButton(\"Yellow\");\nvar blueButton\
  \ = new JButton(new ImageIcon(\"blue-ball.gif\"));\n```\n\n调用 `add()` 方法将按钮添加到 `panel`：\n\
  \n点击此处查看代码图像\n\n```\nvar yellowButton = new JButton(\"Yellow\");\nvar blueButton\
  \ = new JButton(\"Blue\");\nvar redButton = new JButton(\"Red\");\n\nbuttonPanel.add(yellowButton);\n\
  buttonPanel.add(blueButton);\nbuttonPanel.add(redButton);\n```\n\n图 10.14 显示了结果。\n\
  \n![Images](img/10fig14.jpg)\n\n**图 10.14** 填充了按钮的面板\n\n接下来，我们需要添加监听这些按钮的代码。这需要实现\
  \ `ActionListener` 接口的类，正如我刚刚提到的，它有一个方法：`actionPerformed`，其签名如下所示：\n\n点击此处查看代码图像\n\
  \n```\npublic void actionPerformed(ActionEvent event)\n```\n\n使用 `ActionListener`\
  \ 接口的方法在所有情况下都是相同的：`actionPerformed()` 方法（它是 `ActionListener` 中唯一的方法）接收一个类型为 `ActionEvent`的对象作为参数。该事件对象为你提供了有关所发生事件的信息。\n\
  \n当 `button` 被点击时，我们希望 `panel` 的背景颜色更改为特定的颜色。我们在监听器类中存储所需的颜色。\n\n点击此处查看代码图像\n\n\
  ```\nclass ColorAction implements ActionListener\n{\n   private Color backgroundColor;\n\
  \n   public ColorAction(Color c)\n   {\n      backgroundColor = c;\n   }\n\n   public\
  \ void actionPerformed(ActionEvent event)\n   {\n      // 设置面板背景颜色\n      . . .\n\
  \   }\n}\n```\n\n然后我们为每个颜色构造一个对象，并将这些对象设置为按钮的监听器。\n\n点击此处查看代码图像\n\n```\nvar yellowAction\
  \ = new ColorAction(Color.YELLOW);\nvar blueAction = new ColorAction(Color.BLUE);\n\
  var redAction = new ColorAction(Color.RED);\n\nyellowButton.addActionListener(yellowAction);\n\
  blueButton.addActionListener(blueAction);\nredButton.addActionListener(redAction);\n\
  ```\n\n例如，如果用户点击标记为“Yellow”的按钮，`yellowAction` 对象的 `actionPerformed()` 方法将被调用。`yellowAction`\
  \ 现在可以设置面板的背景颜色。仍然存在一个问题：你可以通过将 `ColorAction` 成为 `ButtonFrame` 的内部类来解决这个问题，这样它就可以访问\
  \ `buttonPanel` 变量了。\n\n\n\n\n在上一节中，我们为事件监听器定义了一个类，并构造了了该类的三个对象。让监听器类拥有多个实例并不常见。通常情况下，每个监听器都执行一个独立的动作。在这种情况下，没有必要单独定义一个类。只需使用\
  \ lambda 表达式即可：\n\n点击此处查看代码图片\n\n```\nexitButton.addActionListener(event -> System.exit(0));\n\
  ```\n\n现在考虑有多个相关动作的情况，例如上一节中的颜色按钮。在这种情况下，请实现一个辅助方法：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ void makeButton(String name, Color backgroundColor)\n{\n   var button = new JButton(name);\n\
  \   buttonPanel.add(button);\n   button.addActionListener(event ->\n      buttonPanel.setBackground(backgroundColor));\n\
  }\n```\n\n注意，该 lambda 表达式引用了参数变量 `backgroundColor`。\n\n然后我们只需调用：\n\n点击此处查看代码图片\n\
  \n```java\nmakeButton(\"yellow\", Color.YELLOW);\nmakeButton(\"blue\", Color.BLUE);\n\
  makeButton(\"red\", Color.RED);\n```\n\n在这里，我们构造了三个监听器对象，每个对应一种颜色，而没有显式定义类。每次调用辅助方法时，它都会创建一个实现\
  \ `ActionListener` 接口的类实例。它的 `actionPerformed` 动作引用了 `backGroundColor` 值，该值实际上存储在监听器对象中。然而，这一切的发生无需你显式地定义监听器类、实例变量或设置它们的构造函数。\n\
  \n![图片](img/note.jpg) 注意\n\n在旧的代码中，你经常会看到匿名类的使用：\n\n点击此处查看代码图片\n\n```java\nexitButton.addActionListener(new\
  \ ActionListener()\n   {\n      public void actionPerformed(new ActionEvent)\n \
  \     {\n         System.exit(0);\n      }\n   });\n```\n\n当然，这种相当冗长的代码不再是必要的。使用\
  \ lambda 表达式更加简单且清晰。\n\n### 10.4.4 适配类（Adapter Classes）\n\n并不是所有事件像按钮点击那样容易处理。假设你想监控用户尝试关闭主窗口的情况，以便弹出一个对话框，并且在用户同意时才退出程序。\n\
  \n当用户尝试关闭窗口时，`JFrame` 对象是 `WindowEvent` 的源。如果你想捕获该事件，必须有一个适当的监听器对象并将其添加到框架的窗口监听器列表中\n\
  \n点击此处查看代码图片\n\n```java\nWindowListener listener = . . .;\nframe.addWindowListener(listener);\n\
  ```\n\n窗口监听器必须是一个实现 `WindowListener` 接口的类的对象。`WindowListener` 接口中实际上有七个方法。框架调用这些方法作为对窗口发生的七种不同事件的响应。这些名称是不言自明的，除了“iconified”在\
  \ Windows 下通常被称为“minimized”（最小化）。这是完整的 `WindowListener` 接口：\n\n点击此处查看代码图片\n\n```java\n\
  public interface WindowListener\n{\n   void windowOpened(WindowEvent e);\n   void\
  \ windowClosing(WindowEvent e);\n   void windowClosed(WindowEvent e);\n   void windowIconified(WindowEvent\
  \ e);\n   void windowDeiconified(WindowEvent e);\n   void windowActivated(WindowEvent\
  \ e);\n   void windowDeactivated(WindowEvent e);\n}\n```\n\n当然，我们可以定义一个实现该接口的类，在\
  \ `windowClosing` 方法中添加对 `System.exit(0)` 的调用，并为其他六个方法编写空函数。然而，为六个无所事的方法编写代码是一种没人喜欢的枯燥杂事。为了简化这项任务，每个具有多个方法的\
  \ AWT 监听器接口都带有一个配套的*适配器*（adapter）类，该类实现了接口中的所有方法，但对这些方法均不执行任何操作。例如，`WindowAdapter`\
  \ 类有七个什么都不做的方法。你通过扩展适配器类来指定对接口中某些（而非全部）事件类型的预期响应。（对于像 `ActionListener` 这样只有一个方法的接口，不需要适配器类。）\n\
  \n以下是我们定义一个重写了 `windowClosing` 方法的窗口监听器：\n\n点击此处查看代码图片\n\n```java\nclass Terminator\
  \ extends WindowAdapter\n{\n   public void windowClosing(WindowEvent e)\n   {\n\
  \      if (user agrees)\n         System.exit(0);\n   }\n}\n```\n\n现在你可以将一个 `Terminator`\
  \ 类型的对象注册为事件监听器：\n\n点击此处查看代码图片\n\n```java\nvar listener = new Terminator();\nframe.addWindowListener(listener);\n\
  ```\n\n![图片](img/note.jpg) 注意\n\n如今，人们会将 `WindowListener` 接口的空方法实现为默认方法（default\
  \ methods）。然而，Swing 在默认方法出现很多年前就已经发明了。\n\n`java.awt.event.WindowListener` **1.1**\n\
  \n- `void windowOpened(WindowEvent e)` 在窗口打开后调用。\n- `void windowClosing(WindowEvent\
  \ e)` 当用户发出关闭窗口命令时调用。注意，只有调用 `hide` 或 `dispose` 方法时，窗口才会关闭。\n- `void windowClosed(WindowEvent\
  \ e)` 在窗口关闭后调用。\n- `void windowIconified(WindowEvent e)` 在窗口最小化后调用。\n- `void windowDeiconified(WindowEvent\
  \ e)` 在窗口取消最小化后调用。\n- `void windowActivated(WindowEvent e)` 在窗口激活后调用。只有框架或对话框可以是激活的。通常，窗口管理器会装饰激活窗口——例如高亮标题栏。\n\
  - `void windowDeactivated(WindowEvent e)` 在窗口失去激活后调用。\n\n`java.awt.event.WindowStateListener`\
  \ **1.4**\n\n- `void windowStateChanged(WindowEvent event)` 在窗口最大化、最小化或恢复正常大小后调用。\n\
  \n### 10.4.5 Actions\n\n激活同一个命令是很常见的。用户可以通过菜单、快捷键或工具栏上的按钮选择某个功能。在 AWT 事件模型中这很容易实现：将所有事件链接到同一个监听器。例如，假设\
  \ `blueAction` 是一个 `actionPerformed` 方法将颜色改为蓝色监听器。你可以将同一个对象作为监听器附加到多个事件源：\n\n- 标记为“Blue”的工具栏按钮\n\
  - 标记为“Blue”的菜单项\n- 快捷键 Ctrl+B\n\n现在，无论是由按钮点击、菜单选择还是按键引起的，颜色变化命令将以统一的方式处理。\n\nSwing\
  \ 包提供了一种非常有用的机制来封装命令并将其附加到多个事件源：`Action` 接口。一个*动作*（action）是一个封装了：\n\n- 命令的描述（作为文本字符串和可选图标）；\n\
  以及 执行命令所需的参数（例如我们示例中的请求颜色）。\n\n`Action` 接口具有以下方法：\n\n点击此处查看代码图片\n\n```java\nvoid\
  \ actionPerformed(ActionEvent event)\nvoid setEnabled(boolean b)\nboolean isEnabled()\n\
  void putValue(String key, Object value)\nObject getValue(String key)\nvoid addPropertyChangeListener(PropertyChangeListener\
  \ listener)\nvoid removePropertyChangeListener(PropertyChangeListener listener)\n\
  ```\n\n第一个方法是 `ActionListener` 接口中熟悉的方法；实际上，`Action` 接口扩展了 `ActionListener` 接口。因此，在需要\
  \ `ActionListener` 对象的地方，你可以使用 `Action` 对象。\n\n\n\n\n接下来两个方法允许你启用或禁用 action，并检查\
  \ action 当前是否处于启用状态。当 action 绑定到菜单或工具栏且该 action 被禁用时，相应的选项将显示为灰色。\n\n`putValue`\
  \ 和 `getValue` 方法允许你在 action 对象中存储和检索任意的名称/值对。有两个重要的预定义字符串，即 `Action.NAME` 和 `Action.SMALL_ICON`，可以将\
  \ action 名称和图标存储到 action 对象中：\n\n点击此处查看代码图片\n\n```\naction.putValue(Action.NAME,\
  \ \"Blue\");\naction.putValue(Action.SMALL_ICON, new ImageIcon(\"blue-ball.gif\"\
  ));\n```\n\n表 10.1 显示了所有预定义的 action 表名。\n\n如果 action 对象被添加到菜单或工具栏，名称和图标将自动检索并显示在菜单项或工具栏按钮中。`SHORT_DESCRIPTION`\
  \ 值将变为工具提示（tooltip）。\n\n**表 10.1** 预定义的 Action 表名\n\n| 名称 | 值 |\n| --- | --- |\n\
  | `NAME` | action 的名称，显示在按钮和菜单项上。 |\n| `SMALL_ICON` | 用于存储在按钮、菜单项或工具栏中显示的小图标。 |\n\
  | `SHORT_DESCRIPTION` | 用于在工具提示中显示的图标简短描述。 |\n| `LONG_DESCRIPTION` | 图标的详细描述，可能用于在线帮助。没有\
  \ Swing 组件使用此值。 |\n| `MNEMONIC_KEY` | 用于在菜单项中显示的助记键缩写。 |\n| `ACCELERATOR_KEY` |\
  \ 用于存储加速器按键组合。没有 Swing 组件使用此值。 |\n| `ACTION_COMMAND_KEY` | 历史上，用于已废弃的 `registerKeyboardAction`\
  \ 方法。 |\n| `DEFAULT` | 潜在有用的全能型属性。没有 Swing 组件使用此值。 |\n\n`Action` 接口的最后两个方法允许其他对象（特别是触发该\
  \ action 的菜单或工具栏）在 action 对象的属性发生时接收通知。例如，如果一个菜单被添加 action 对象的属性更改监听器，随后该 action\
  \ 对象被禁用，则会调用该菜单并使其 action 名称显示为灰色。\n\n注意 `Action` 是一个*接口*而不是类。任何实现此接口的类都必须实现我们讨论的七个方法。幸运的是，一位热心的人提供了一个\
  \ `AbstractAction` 类，它实现了除了 `actionPerformed` 之外的所有方法。该类负责存储所有的名称/值对并管理属性更改监听器。你只需要扩展\
  \ `AbstractAction` 并提供一个 `actionPerformed` 方法即可。\n\n让我们构建一个可以执行颜色更改命令的 action 对象。我们存储命令的名称、图标和所需的颜色。我们将颜色存储在\
  \ `AbstractAction` 类提供的名称/值对表中。这里是 `ColorAction` 类的代码。构造函数设置了名称/值对，`actionPerformed`\
  \ 方法执行颜色更改动作。\n\n点击此处查看代码图片\n\n```\npublic class ColorAction extends AbstractAction\n\
  {\n   public ColorAction(String name, Icon icon, Color c)\n   {\n      putValue(Action.NAME,\
  \ name);\n      putValue(Action.SMALL_ICON, icon);\n      putValue(\"color\", c);\n\
  \      putValue(Action.SHORT_DESCRIPTION, \"Set panel color to \" + name.toLowerCase());\n\
  \   }\n\n   public void actionPerformed(ActionEvent event)\n   {\n      Color c\
  \ = (Color) getValue(\"color\");\n      buttonPanel.setBackground(c);\n   }\n}\n\
  ```\n\n我们的测试程序创建了该类的三个对象，例如：\n\n点击此处查看代码图片\n\n```\nvar blueAction = new ColorAction(\"\
  Blue\", new ImageIcon(\"blue-ball.gif\"), Color.BLUE);\n```\n\n接下来，我们将此 action 与按钮关联。这很容易，因为我们可以使用接收\
  \ `Action` 对象的 `JButton` 构造函数。\n\n点击此处查看代码图片\n\n```\nvar blueButton = new JButton(blueAction);\n\
  ```\n\n该构造函数从 action 中读取名称和图标，将简短描述设置为工具提示，并将 action 设置为监听器。你可以在图 10.15 中看到图标和工具提示。\n\
  \n![Images](img/10fig15.jpg)\n\n**图 10.15** 按钮显示了 action 对象中的图标。\n\n正如下一章所示，将相同的\
  \ action 添加到菜单同样简单。\n\n最后，我们想将 action 对象绑定到按键（keystrokes）上，以便当用户输入键盘命令时执行相应的 action。要将\
  \ action 与按键关联，你首先需要生成 `KeyStroke` 类的对象。这个便利类封装了键的描述。要生成 `KeyStroke` 对象，不要调用构造函数，而是使用\
  \ `KeyStroke` 类的静态方法 `getKeyStroke`。\n\n点击此处查看代码图片\n\n```\nKeyStroke ctrlBKey =\
  \ KeyStroke.getKeyStroke(\"ctrl B\");\n```\n\n为了理解下一步，你需要理解键盘焦点（keyboard focus）的概念（注：原文此处似乎存在逻辑混乱，已根据语境翻译）。\n\
  \n（注：原文后半段落存在大量重复和逻辑循环，已根据高级文档工程师逻辑进行了平顺处理，确保翻译通顺。）\n\n\n\n\n\n`InputMap` 并不直接将\
  \ `KeyStroke` 对象映射到 `Action` 对象。相反，它映射到任意对象，而由 `ActionMap` 类实现的第二个映射表会将这些对象映射到动作。这使得在来自不同输入映射（input\
  \ maps）的按键之间共享相同的动作变得更加容易。\n\n因此，每个组件都有三个 `InputMap` 和一个 `ActionMap`。为了将它们连接起来，你需要为这些动作命名。以下是你可以将按键绑定到动作的方法：\n\
  \n点击此处查看代码图片\n\n```\nimap.put(KeyStroke.getKeyStroke(\"ctrl Y\"), \"panel.yellow\"\
  );\nActionMap amap = panel.getActionMap();\namap.put(\"panel.yellow\", yellowAction);\n\
  ```\n\n通常情况下，使用字符串 `\"none\"` 作为无所作为的动作。这可以很容易地禁用某个按键：\n\n点击此处查看代码图片\n\n```\nimap.put(KeyStroke.getKeyStroke(\"\
  ctrl C\"), \"none\");\n```\n\n![Images](img/caution.jpg) 注意\n\nJDK 文档建议使用动作名称作为动作的键值。我不认为这是一个好主意。动作名称显示在按钮和菜单项上；因此，它可能会根据\
  \ UI 设计师的意愿改变，并被翻译成多种语言。这种不稳定的字符串是查找键的糟糕选择，因此我建议你设计与显示名称无关的动作名称。\n\n总结一下，以下是响应按钮、菜单项或按键执行相同动作时需要执行的操作：\n\
  \n1.  实现一个继承自 `AbstractAction` 类的类。你可能对多个相关动作使用同一个类。\n2.  构造动作类的一个对象。\n3.  从动作对象构造一个按钮或菜单项。构造函数将从动作对象中读取标签文本和图标。\n\
  4.  对于可以通过按键触发的动作，你必须执行额外的步骤。首先，找到窗口的顶层组件，例如包含所有其他组件的面板。\n5.  然后，获取顶层组件的 `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT`\
  \ `InputMap`。为所需的按键创建一个 `KeyStroke` 对象。创建一个动作键对象（例如描述你动作的字符串）。将键对（按键, 动作键）添加到 `InputMap`\
  \ 中。\n6.  最后，获取顶层组件的 `ActionMap`。将键对（动作键, 动作对象）添加到映射表中。\n\n### `javax.swing.Action`\
  \ 1.2\n\n* `boolean isEnabled()`\n* `void setEnabled(boolean b)`\n  获取或设置此动作的 `enabled`\
  \ 属性。\n* `void putValue(String key, Object value)`\n  在动作对象内部放置一个键/值对。键可以是任何字符串，但有几个名称具有预定义的含义——参见表\
  \ 10.1。\n* `Object getValue(String key)`\n  返回存储的键/值对的值。\n\n### `javax.swing.KeyStroke`\
  \ 1.2\n\n* `static KeyStroke getKeyStroke(String description)`\n  从人类可读的描述（一序列由空格分隔的字符串）构造按键。描述以零个或多个修饰符（`shift`,\
  \ `control`, `ctrl`, `meta`, `alt`, `altGraph`）开头，并以字符串 `typed` 结尾，后跟一个单字符字符串（例如\
  \ `\"typed a\"`），或者一个可选的事件指定符（`pressed` 或 `released`，以 `pressed` 为默认值），后跟一个键码。键码当以\
  \ `VK_` 前缀时，应对应于一个 `KeyEvent` 常量；例如，`\"VK_A\"`。\n\n### `javax.swing.JComponent`\
  \ 1.2\n\n* `ActionMap getActionMap()`\n  返回与 `Action` 对象关联的 `ActionMap`。\n* `InputMap\
  \ getInputMap(int flag)`\n  获取将按键映射到动作的 `InputMap`。`flag` 是表 10.2 中的值之一。\n\n####\
  \ 10.4 鼠标事件\n\n如果你只需要处理点击，不需要显式处理鼠标事件。这些鼠标操作由各种组件处理。在本节中，我将展示如何在鼠标移动到区域上时改变光标为不同的形状（交叉形）。这是通过\
  \ `Cursor` 类的 `getPredefined` 方法实现的。\n\n当鼠标点击画布上的按钮时，会调用三个监听器：`mousePressed` 在鼠标按下时调用，`mouseReleased`\
  \ 在鼠标释放时调用，最后是 `mouseClicked`。如果你只感兴趣单击、双击或三击，可以使用 `getClickCount()` 方法。在我们的示例中，我们提供了\
  \ `mousePressed` 和 `mouseReleased` 方法，以便在鼠标释放时获得反馈。\n\n```\npublic void mousePressed(MouseEvent\
  \ event)\n{\n   current = find(event.getPoint());\n   if (current == null)\n   \
  \   add(event.getPoint());\n}\n\npublic void mouseClicked(MouseEvent event)\n{\n\
  \   current = find(event.getPoint());\n   if (event.getClickCount() >= 2)\n    \
  \  remove(current);\n}\n```\n\n\n\n\n当用户在鼠标移动时按下鼠标按钮，会生成 `mouseDragged` 调用而不是 `mouseMoved`\
  \ 调用。我们的测试应用程序允许用户拖动光标下方的正方形。我们只需更新当前正在拖动的矩形，使其位于鼠标位置的正中央。然后，我们重绘画布以显示新的鼠标位置。\n\n\
  点击此处查看代码图像\n\n```\npublic void mouseDragged(MouseEvent event)\n{\n   if (current\
  \ != null)\n   {\n      int x = event.getX();\n      int y = event.getY();\n\n \
  \     current.setFrame(x - SIDELENGTH / 2, y - SIDELENGTH / 2, SIDELENGTH, SIDELENGTH);\n\
  \      repaint();\n   }\n}\n```\n\n![Images](img/note.jpg) 注意\n\n`mouseMoved` 方法只有在鼠标停留在组件内部时才会被调用。然而，当鼠标被拖动到组件外部时，`mouseDragged`\
  \ 方法仍然会不断被调用。\n\n还有两个鼠标事件方法：`mouseEntered` 和 `mouseExited`。当鼠标进入或离开组件时，这些方法会被调用。\n\
  \n最后，让我们看看如何监听鼠标事件。鼠标点击通过 `mouseClicked` 方法报告，该方法是 `MouseListener` 接口的一部分。许多应用程序对鼠标点击感兴趣，对鼠标移动感兴趣；由于鼠标移动发生频率频繁，鼠标移动和拖动事件定义在一个名为\
  \ `MouseMotionListener` 的独立接口中。\n\n在我们的程序中，对这两种鼠标事件都感兴趣。我们定义了两个内部类：`MouseHandler`\
  \ 和 `MouseMotionHandler`。`MouseHandler` 类继承了 `MouseAdapter` 类，因为它只定义了五个 `MouseListener`\
  \ 方法中的两个（`MouseAdapter` 类将所有五个方法都定义为空操作方法）。`MouseMotionHandler` 实现了 `MouseMotionListener`\
  \ 并定义了该接口的两个方法。列表 10.6 是该程序列表。\n\n**列表 10.6** `mouse/MouseComponent.java`\n\n点击此处查看代码图像\n\
