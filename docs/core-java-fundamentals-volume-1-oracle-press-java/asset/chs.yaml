  \  salary = s;\n72    }\n73\n74    public String getName()\n75    {\n76       return\
  \ name;\n77    }\n78\n79    public double getSalary()\n80    {\n81       return\
  \ salary;\n82    }\n83\n84    public void raiseSalary(double byPercent)\n85    {\n\
  86       double raise = salary * byPercent / 100;\n87       salary += raise;\n88\
  \    }\n89 }\n```\n\n### 4.6 对象构造\n\n你已经看到过如何编写简单的构造函数来定义对象的初始状态。然而，由于对象构造非常重要，Java\
  \ 提供了多种编写构造函数的机制。我们将在后面的章节中详细介绍这些机制。\n\n### 4.6.1 重载\n\n某些类具有多个构造函数。例如，你可以这样构造一个空的\
  \ `StringBuilder` 对象：\n\n点击查看代码图像\n\n```\nvar messages = new StringBuilder();\n\
  ```\n\n或者，你可以指定一个初始字符串：\n\n点击查看代码图像\n\n```\nvar todoList = new StringBuilder(\"\
  To do:\\n\");\n```\n\n这种能力被称为`重载`（overloading）。如果多个方法具有相同的名称（在这种情况下为 `StringBuilder`\
  \ 构造方法）但参数不同，就会发生重载。编译器会识别正确的方法。\n\n#### 4.6.2 字段默认初始化\n\n如果你不在构造函数中显式地设置字段，它会被自动赋予默认值：数字为\
  \ `0`，`boolean` 值为 `false`，对象引用为 `null`。有些人认为依赖默认值是不良的做法。\n\n![Images](img/note.jpg)\
  \ Note\n\n这是字段与局部变量之间的重要区别。你必须在方法中显式初始化局部变量。但在类中，如果你不初始化字段，它会自动初始化为默认值。\n\n### 4.6.3\
  \ 无参数构造函数\n\n许多类包含一个无参数的构造函数，用于创建一个状态被设置为适当默认值的对象。例如，这里是 `Employee` 类的无参数构造函数：\n\
  \n```java\npublic Employee()\n{\n   name = \"\";\n   salary = 0;\n   hireDay = LocalDate.now();\n\
  }\n```\n\n\n\n\n如果一个类提供了一个至少构造函数，但没有提供无参构造函数，那么在不提供参数的情况下构造对象是不合法的。例如，我们在 Listing\
  \ 4.2 中原始的 `Employee` 类提供了一个单一构造函数：\n\n点击此处查看代码图像\n\n```\npublic Employee(String\
  \ n, double s, int year, int month, day)\n```\n\n使用该类时，构造默认员工是不合法的。也就是说，调用\n\n```\n\
  e = new Employee();\n```\n\n将会是一个错误。\n\n![Images](img/caution.jpg) 注意事项\n\n请记住，只有当你的类没有其他构造函数时，你才会获得一个免费的无参构造函数。如果你为类编写了哪怕一个构造函数，并且希望该类的用户能够通过调用\n\
  \n```\nnew ClassName()\n```\n\n来创建实例，那么你必须提供一个无参构造函数。当然，如果你对所有字段的默认值满意，你可以简单地提供\n\
  \n```\npublic ClassName()\n{\n}\n```\n\n![Images](img/cnote.jpg) C++ 注意\n\nC++ 拥有一种特殊的初始化列表语法来构造字段，例如：\n\
  \n点击此处查看代码图像\n\n```\nEmployee::Employee(String n, double s, int y, int m, int d)\
  \ // C++\n: name(n),\n  salary(s),\n  hireDay(y, m, d)\n{\n}\n```\n\nC++ 使用这种特殊语法来避免对无参构造函数的必要的调用。在\
  \ Java 中，没有需要，因为对象没有子对象，只有对其他对象的引用。\n\n### 4.6.4 显式字段初始化\n\n通过重载类中的构造器方法，你可以构建许多方法来设置类中实例字段的初始状态。无论调用哪个构造函数，确保每个实例字段都被设置为有意义的值这始终是一个好主意。\n\
  \n你可以简单地为类定义中的任何字段赋值。例如：\n\n```\nclass Employee\n{   private String name = \"\"\
  ;\n   . . .\n}\n```\n\n此赋值在构造函数执行之前完成。如果一个类的所有构造函数都需要将特定的实例字段设置为相同的值，那么这种语法就特别有用。\n\
  \n初始化值不一定是一个常量。这里有一个使用方法调用初始化字段的示例。考虑 `Employee` 类，其中每个员工都有一个 `id` 字段。你可以这样初始化它：\n\
  \n点击此处查看代码图像\n\n```\nclass Employee\n{\n   private static int nextId;\n   private\
  \ int id = advanceId();\n   . . .\n   private static int advanceId()\n   {\n   \
  \   int r = nextId;\n      nextId++;\n      return r;\n\n   }\n   . . .\n}\n```\n\
  \n### 4.6.5 参数命名\n\n当你编写非常平凡的构造器时（你会写很多这种构造器），构思出参数名称可能会让人有些沮丧。\n\n我们通常选择单字母参数名：\n\
  \n点击此处查看代码图像\n\n```\npublic Employee(String n, double s)\n{\n   name = n;\n   salary\
  \ = s;\n}\n```\n\n然而，缺点是你需要阅读代码才能知道 `n` 和 `s` 参数的含义。\n\n有些程序员会在每个参数前加前缀 `a`：\n\n\
  点击此处查看代码图像\n\n```\npublic Employee(String aName, double aSalary)\n{\n   name = aName;\n\
  \   salary = aSalary;\n}\n```\n\n这样好一些。任何读者都能立即明白参数的含义。\n\n另一个常用的技巧依赖于参数变量会“遮蔽”（shadow）同名的实例字段这一事实。例如，如果你将参数命名为\
  \ `salary`，那么 `salary` 指的是参数，而不是实例字段。但你仍然可以通过 `this.salary` 访问实例字段。记住 `this` 表示隐式参数——即正在被构造的对象。这里有一个示例：\n\
  \n点击此处查看代码图像\n\n```\npublic Employee(String name, double salary)\n{\n   this.name\
  \ = name;\n   this.salary = salary;\n}\n```\n\n![Images](img/cnote.jpg) C++ 注意\n\
  \n在 C++ 中，在实例字段前加下划线或固定字母是常见的（字母 `m` 和 `x` 是常用的选择）。例如，salary 字段可能被称为 `_salary`、`mSalary`\
  \ 或 `xSalary`。Java 程序员通常不做。\n\n### 4.6.6 调用另一个构造器\n\n关键字 `this` 指方法的隐式参数。然而，这个关键字有第二个含义。\n\
  \n如果构造器的第一语句的形式为 `this(. . .)`，那么构造器会调用同一类的另一个构造器。这里有一个典型的示例：\n\n点击此处查看代码图像\n\n\
  ```\npublic Employee(double s)\n{\n   // 调用 Employee(String, double)\n   this(\"\
  Employee\", s);\n   nextId++;\n}\n```\n\n当你调用 `new Employee(60000)` 时，`Employee(double)`\
  \ 构造器调用 `Employee(String, double)`。这种方式使用 `this` 关键字很有用——你只需要编写一次代码。\n\n![Images](img/cnote.jpg)\
  \ C++ 注意\n\n### 4.6.7 初始化块\n\n你已经看到了两种初始化实例字段的方法：\n\n*   在构造器中设置\n*   在声明中赋值\n\n\
  Java 中还有第三种机制，称为初始化块（initialization block）。类声明可以包含任意的代码块。这些块在构造该类的对象时都会执行。例如：\n\n\
  点击此处查看代码图像\n\n```\nclass Employee\n{\n   private static int nextId;\n   private\
  \ int id;\n   private String name;\n   private double salary;\n\n   // 初始化块\n  \
  \ {\n      id = nextId;\n      nextId++;\n   }\n\n   public Employee(String n, double\
  \ s)\n   {\n      name = n;\n      salary = s;\n   }\n\n   public Employee()\n \
  \  {\n      name = \"\";\n      salary = 0;\n   }\n   . . .\n}\n```\n\n在这个示例中，无论使用哪个构造器来构造对象，`id`\
  \ 字段都在初始化块中初始化。初始化块首先运行，然后执行构造器的体。\n\n这种机制并非必要，也不常见。通常将初始化代码放在构造器内部更为直接。\n\n![Images](img/note.jpg)\
  \ 注意\n\n即使字段在类中后定义，在初始化块中设置它们也是合法的。然而，为了避免循环定义，读取后初始化的字段是非法的。具体的规则在 Java 语言规范第 8.3.3\
  \ 节中详细说明（[`docs.oracle.com/javase/specs`](http://docs.oracle.com/javase/specs)）。这些规则复杂到让编译器实现者感到困惑。因此，你应该始终将初始化块放在字段定义之后。\n\
  \n\n\n\n自然然，组织初始化代码始终是一个好主意，这样其他程序员就可以轻松理解它，而无需成为“语言法律专家”。例如，如果一个类的构造函数依赖于实例字段声明的顺序，这将会非常奇怪且容易出错。\n\
  \n要初始化一个静态字段，可以提供一个初始值，或者使用静态初始化块。你已经看到了第一种机制：\n\n```\nprivate static int nextId\
  \ = 1;\n```\n\n如果你的类的静态字段需要复杂的初始化代码，请使用静态初始化块。\n\n将代码放在一个块中并用 `static` 关键字进行标记。这里有一个示例。我们希望员工\
  \ ID 从一个小于 10,000 的随机整数开始。\n\n点击此处查看代码图像\n\n```\nprivate static Random generator\
  \ = new Random();\n//静态初始化块\nstatic\n{\n   nextId = generator.nextInt(10000);\n\
  }\n```\n\n静态初始化发生在类第一次被加载时。与实例字段一样，除非你显式地将其设置为另一个值，否则静态字段的值为 `0`、`false` 或 `null`。所有静态字段初始化器和静态初始化块都按照它们在类声明中出现的顺序执行。\n\
  \n![图像](img/note.jpg) 注意事项\n\n令人惊讶的是，在 JDK 6 之前，在 Java 中可以在完全不编写 `main` 方法的情况下编写一个“Hello,\
  \ World”程序。\n\n点击此处查看代码图像\n\n```\npublic class Hello\n{\n   static\n   {\n     \
  \ System.out.println(\"Hello, World\");\n   }\n}\n```\n\n当你用 `java Hello` 调用该类时，类被加载，静态初始化块打印出“Hello,\
  \ World”，随后才会显示 `main` 未定义的错误消息。从 Java 7 开始，`java` 程序会首先检查是否存在 `main` 方法。\n\n此示例使用\
  \ `Random` 类来生成随机数。从 JDK 17 开始，`java.util.random` 包提供了具有各种权衡的强类型算法的实现。阅读 `java.util.random`\
  \ 包的 API 文档，以获取关于选择何种算法的建议。然后通过提供类似下面的算法名称来获取实例：\n\n点击此处查看代码图像\n\n```\nRandomGenerator\
  \ generator = RandomGenerator.of(\"L64X128MixRandom\");\n```\n\n通过调用 `generator.nextInt(n)`\
  \ 或其他 `RandomGenerator` 方法生成随机数。（`RandomGenerator` 是一个*接口*，是在第 6 章中引入的概念。你可以对 `Random`\
  \ 类的对象使用所有 `RandomGenerator` 方法。）\n\n列表 4.5 中的程序展示了本节讨论的许多特性：\n\n*   重载的构造函数\n*\
  \   使用 `this(. . .)` 调用另一个构造函数\n*   无参数构造函数\n*   对象初始化块\n*   静态初始化块\n*   实例字段初始化\n\
  \n**列表 4.5** `ConstructorTest/ConstructorTest.java`\n\n点击此处查看代码图像\n\n```\n 1  import\
  \ java.util.*;\n 2\n 3 /**\n 4  * 此程序演示了对象的构造。\n 5  * @version 1.02 2018-04-10\n\
  \ 6  * @author Cay Horstmann\n 7  */\n 8 public class ConstructorTest\n 9 {\n10\
  \    public static void main(String[] args)\n11    {\n12       // 向 staff 数组中填充三个\
  \ Employee 对象\n13       var staff = new Employee[3];\n14\n15       staff[0] = new\
  \ Employee(\"Harry\", 40000);\n16       staff[1] = new Employee(60000);\n17    \
  \   staff[2] = new Employee();\n18\n19       // 打印所有 Employee 对象的信息\n20       for\
  \ (Employee e : staff)\n21          System.out.println(\"name=\" + e.getName() +\
  \ \",id=\" + e.getId() + \",salary=\"\n22             + e.getSalary());\n23    }\n\
  24 }\n25\n26 class Employee\n27 {\n28    private static int nextId;\n29\n30    private\
  \ int id;\n31    private String name = \"\"; // 实例字段初始化\n32    private double salary;\n\
  33\n34    private static Random generator = new Random();\n35\n36    // 静态初始化块\n\
  37    static\n38    {\n39       // 将 nextId 设置为 0 到 9999 之间的随机数\n40       nextId\
  \ = generator.nextInt(10000);\n41    }\n42\n43    // 对象初始化块\n44    {\n45       id\
  \ = nextId;\n46       nextId++;\n47    }\n48\n49    // 三个重载的构造函数\n50    public Employee(String\
  \ n, double s)\n51    {\n52       name = n;\n53       salary = s;\n54    }\n55\n\
  56    public Employee(double s)\n57    {\n58       salary = s;\n59    }\n60\n61\
  \    public Employee()\n62    {\n63       id = nextId;\n64       nextId++;\n65 \
  \   }\n66\n67    public String getName()\n68    {\n69       return name;\n70   \
  \ }\n71\n72    public int getId()\n73    {\n74       return id;\n75    }\n76\n77\
  \    public double getSalary()\n78    {\n79       return salary;\n80    }\n81 }\n\
  ```\n\n#### 4.6.8 对象销毁与 finalize 方法\n\n某些面向对象的语言语言（特别是 C++）拥有显式的析构方法（destructor\
  \ methods），用于处理对象不再被使用时可能需要的任何清理代码。析构函数中最常见的活动是回收内存。由于 Java 采用自动收集，因此不需要手动回收内存，所以\
  \ Java 不支持析构函数。\n\n当然，某些对象使用了内存以外的资源，例如文件或另一个对象的句柄。在这种情况下，当资源不再需要时对其进行回收和循环利用是非常重要的。如果资源在使用后需要立即关闭，请提供一个执行清理工作的\
  \ `close` 方法。你可以在完成使用后调用该 `close` 方法。在第 7 章中，你将看到如何确保该方法的调用。\n\n如果你可以等到虚拟机退出再处理，可以使用\
  \ `Runtime.addShutdownHook` 方法添加“停机钩子”（shutdown hook）。从 Java 9 开始，你可以使用 `Cleaner`\
  \ 类注册一个在对象不再可达（清理器之外）时执行的操作。这些情况在实践中并不常见。详情见这两种方法的 API 文档。\n\n![图像](img/caution.jpg)\
  \ 注意不要使用 `finalize` 方法进行清理。该方法旨在垃圾回收回收对象之前调用。然而，你无法确定该方法何时会被调用，而且它现在已经被弃用。\n\n##\
  \ 4.7 记录 (Records)\n\n有时，数据就是数据，面向对象编程的数据隐藏机制反而成了阻碍。考虑一个描述平面上点的 `Point` 类，具有 *x-*\
  \ 和 *y-* 坐标。\n\n当然，你可以创建一个类：\n\n点击此处查看代码图像\n\n```\nclass Point\n{\n   private final\
  \ double x;\n   private final double y;\n   public Point(double x, double y) { this.x\
  \ = x; this.y = y; }\n   public getX() { return x; }\n   public getY() { return\
  \ y; }\n   public String toString() { return \"Point[x=%d, y=%d]\".formatted(x,\
  \ y); }\n   // 更多方法 . . .\n}\n```\n\n但是，通过隐藏 `x` 和 `y` 然后通过 getter 方法公开这些值真的能为我们带来什么好处吗？\n\
  \n\n\n我们是否曾经想要更改 `Point` 的实现方式？当然，有极坐标系，但你不会在图形界面 API 中使用它们。在实践中，平面上的一个点完全由它的 `x`\
  \ 和 `y` 坐标来描述。\n\n为了更简洁地定义此类类，JDK 14 引入了“记录”（records）作为一项预览性功能。正式版本在 JDK 16 中发布。\n\
  \n### 4.7.1 记录（Record）的概念\n\n记录是类的一种特殊形式，其状态是不可变的，并且可以被公共（public）读取。以下是是将 `Point`\
  \ 定义为记录的方式：\n\n点击此此处查看代码图片\n\n```\nrecord Point(double x, double y) { }\n```\n\n\
  结果是一个具有实例字段的类：\n\n```\nprivate final double x;\nprivate final double y;\n```\n\n\
  在 Java 语言规范中，记录的实例字段被称为它的 `components`（组件）。\n\n该类有一个构造函数\n\n```\nPoint(double x,\
  \ double y)\n```\n\n以及访问器方法\n\n```java\npublic double x()\npublic double y()\n```\n\
  \n注意，访问器被称为 `x` 和 `y`，而不是 `getX` 和 `getY`。（在 Java 中，拥有与实例字段同名的方法是合法的。）\n\n点击此此处查看代码图片\n\
  \n```java\nvar p = new Point(3, 4);\nSystem.out.println(p.x() + \" \" + p.y());\n\
  ```\n\n![Images](img/note.jpg) 注意\n\nJava 没有遵循 `get` 命名规范，因为这有点混乱。对于 `boolean` 字段，通常使用\
  \ `is` 而不是 `get`。而且，首字母的大写可能会产生问题。如果一个类拥有字段 `x` 和 `X`，会发生什么？有些程序员感到不悦，因为他们的遗留类无法简单地变成记录。但在实践中，许多遗留类是可变的，因此不是转换为记录的候选者。\n\
  \n除了字段访问方法外，每个记录都自动定义三个方法：`toString`、`equals` 和 `hashCode`。你将在下一章学习更多关于这些方法的内容。\n\
  \n![Images](img/caution.jpg) 注意\n\n你可以定义自动提供方法的自定义版本，只要它们的参数和返回类型相同。例如，这种定义是合法的：\n\
  \n点击此此处查看代码图片\n\n```java\nrecord Point(double x, double y)\n{\n   public double\
  \ x() { return y; } // 糟糕的做法\n}\n```\n\n但这显然不是一个好主意。\n\n你可以为记录添加你自己的方法：\n\n点击此此处查看代码图片\n\
  \n```java\nrecord Point(double x, double y)\n{\n   public double distanceFromOrigin()\
  \ { return Math.hypot(x, y); }\n}\n```\n\n记录像任何类一样，都可以拥有静态字段和方法：\n\n点击此此处查看代码图片\n\
  \n```java\nrecord Point(double x, double y)\n{\n   public static Point ORIGIN =\
  \ new Point(0, 0);\n   public static double distance(Point p, Point q)\n   {\n \
  \     return Math.hypot(p.x - q.x, p.y - q.y);\n   }\n   . . .\n}\n```\n\n然而，你不能向记录添加*实例*\
  \ 字段。\n\n点击此此处查看代码图片\n\n```java\nrecord Point(double x, double y)\n{\n   private\
  \ double r; // 错误\n   . . .\n}\n```\n\n![Images](img/caution.jpg) 注意\n\n记录的实例字段自动是\
  \ `final` 的。然而，它们可能是指向可变对象的引用：\n\n点击此此处查看代码图片\n\n```java\nrecord PointInTime(double\
  \ x, double y, Date when) { }\n```\n\n那么记录实例就是可变的：\n\n点击此此处查看代码图片\n\n```java\nvar\
  \ pt = new PointInTime(0, 0, new Date());\npt.when().setTime(0);\n```\n\n如果你打算记录实例是不可变的，请不要对字段使用可变类型。\n\
  \n![Images](img/tip.jpg) 提示\n\n对于由一组变量完全表示不可变数据，请使用记录而不是类。如果数据是可变的，或者表示可能随时间进化，请使用类。记录更易读、更高效，在并发程序中更安全。\n\
  \n### 4.7.2 构造函数：规范、自定义和紧凑\n\n自动定义所有实例字段的构造函数被称为 `canonical constructor`（规范构造函数）。\n\
  \n你可以定义额外的*自定义构造函数*。此类构造函数的第一条语句必须调用另一个构造函数，以便最终调用规范构造函数。这是一个示例：\n\n```java\nrecord\
  \ Point(double x, double y)\n{\n   public Point() { this(0, 0); }\n}\n```\n\n此记录有两个构造函数：规范构造函数和一个产生原点的无参数构造函数。\n\
  \n如果规范构造函数需要执行额外工作，你可以提供自己的实现：\n\n点击此此处查看代码图片\n\n```java\nrecord Range(int from,\
  \ int to)\n{\n   public Range(int from, int to)\n   {\n      if (from > to)\n  \
  \    {\n         int temp = from;\n         from = to;\n         to = temp;\n  \
  \    }\n   }\n}\n```\n\n然而，建议在实现规范构造函数时使用*紧凑*（compact）形式。你不需要指定参数列表：\n\n紧凑形式是规范构造函数的“前言”。它仅仅在赋值给实例字段\
  \ `this.from` 和 `this.to` 之前修改变量 `from` 和 `to`。\n\n**Listing 4.6** `RecordTest.java`\n\
  \n点击此此处查看代码图片\n\n```java\n1  import java.util.*;\n2\n3 /**\n4  * 此程序演示了记录。\n5  *\
  \ @version 2021-05-13\n6  * @author Cay Horstmann\n7  */\n8 public class RecordTest\n\
  9 {\n10    public static void main(String[] args)\n11    {\n12       var p = new\
  \ Point(3, 4);\n13       System.out.println(\"Coordinates of p: \" + p.x() + \"\
  \ \" + p.y());\n14       System.out.println(\"Distance from origin: \" + p.distanceOrigin());\n\
  15       // 静态字段和方法\n16       System.out.println(\"Distance from origin: \" + Point.distance(Point.ORIGIN,\
  \ p));\n17\n18       // 可变记录\n19       var pt = new PointInTime(0, 0, new Date());\n\
  20       System.out.println(\"Before: \" + pt);\n21       pt.when().setTime(0);\n\
  22       System.out.println(\"After: \" + pt);\n23\n24       // 调用紧凑构造函数\n25\n26\
  \       var r = new Range(4, 3);\n27       System.out.println(\"r: \" + r);\n28\
  \    }\n29 }\n30\n31 record Point(double x, double y)\n32 {\n33    // 自定义构造函数\n\
  34    public Point() { this(0, 0); }\n35    // 方法\n36    public double distanceFromOrigin()\n\
  37    {\n38       return Math.hypot(x, y);\n39    }\n40    // 静态字段和方法\n41    public\
  \ static Point ORIGIN = new Point();\n42    public static double distance(Point\
  \ p, Point q)\n43    {\n44       return Math.hypot(p.x - q.x, p.y - q.y);\n45  \
  \  }\n46 }\n47\n48 record PointInTime(double x, double y, Date when) { }\n49\n50\
  \ record Range(int from, int to)\n51 {\n52    // 紧凑构造函数\n53    public Range\n54\
  \    {\n55       if (from > to) // 交换边界\n56       {\n57          int temp = from;\n\
  58          from = to;\n59          to = temp;\n60       }\n61    }\n62 }\n```\n\
  \nJava 允许将类分组在一个称为*package*（包）的集合中。包有助于组织你的工作并将你的工作与他人提供的代码库分开。在接下来的章节中，你将学习如何使用和创建包。\n\
  \n#### 4.8.1 包名\n\n\n使用包的主要目的是为了保证类名的唯一性。假设两个程序员想出了一个绝妙的主意，都要提供一个 `Employee` 类。只要他们都将自己的类放在不同的包中，就不会发生冲突。事实上，为了绝对保证包名的唯一性，可以使用反过来书写的\
  \ Internet 域名（这被证明是唯一的）。然后你可以使用子包来区分不同的项目。例如，考虑 `horstmann.com` 域名。当反过来书写时，它变成了包名\
  \ `com.horstmann`。你可以在此基础上添加项目名称，例如 `com.horstmann.corejava`。如果你随后将 `Employee` 类放入该包中，那么它的“完全限定名”就变成了\
  \ `com.horstmann.corejava.Employee`。\n\n![Images](img/note.jpg) 提示/注意\n\n从编译器的角度来看，嵌套包之间完全没有关系。例如，`java.util`\
  \ 和 `java.util.jar` 两个包之间相互独立。它们都是各自独立的类集合。\n\n### 4.8.2 类的导入\n\n一个类可以使用其所在包中的所有类，以及来自其他包的所有\
  \ `public` 类。\n\n你有两种方法访问另一个包中的公共类。第一种是直接使用“完全限定名”；即包名后跟类名。例如：\n\n点击此处查看代码图像\n\n\
  ```\njava.time.LocalDate today = java.time.LocalDate.now();\n```\n\n这显然太繁琐了。一种简单且常用的方法是使用\
  \ `import` 语句。`import` 语句的作用是提供一个简写，用来引用包中的类。一旦你添加了 `import`，就不再需要为这些类提供全名了。\n\n\
  你可以导入一个特定的类，也可以导入整个包。你将 `import` 语句放在源文件的顶部（但在任何 `package` 语句之后）。例如，你可以使用语句导入 `java.time`\
  \ 包中的所有类：\n\n```\nimport java.time.*;\n```\n\n然后你就可以使用\n\n点击此处查看代码图像\n\n```\nLocalDate\
  \ today = LocalDate.now();\n```\n\n而无需包名前缀。你也可以导入包内的某个特定类：\n\n```\nimport java.time.LocalDate;\n\
  ```\n\n`java.time.*` 语法不那么繁琐。它对代码大小没有负面影响。然而，如果你显式地导入类，代码的读者就能确切知道你使用了哪些类。\n\n![Images](img/tip.jpg)\
  \ 提示\n\n在 Eclipse 中，你可以选择菜单选项 Source → Organize Imports（源→组织导入）。像 `import java.util.*;`\
  \ 这样的包语句会自动展开为特定的导入列表，例如：\n\n```\nimport java.util.ArrayList;\nimport java.util.Date;\n\
  ```\n\n这是一个非常方便的功能。\n\n然而，请注意，你只能使用 `*` 符号来导入单个包。你不能使用 `import java.*` 或 `import\
  \ java.*.*` 来导入所有以 `java` 为前缀的包。\n\n大多数情况下你只需要导入需要的包，而不需要过度担心它们。只有在发生名称冲突时，你才需要注意包。例如`java.util`\
  \ 和 `java.sql` 包都包含一个 `Date` 类。假设你写了一个同时导入这两个包的程序。\n\n```\nimport java.util.*;\n\
  import java.sql.*;\n```\n\n如果你现在使用 `Date` 类，就会得到编译时错误：\n\n点击此处查看代码图像\n\n```\nDate\
  \ today; // --java.util.Date 或 java.sql.Date?\n```\n\n编译器无法确定你想用哪一个 `Date` 类。你可以通过添加特定的\
  \ `import` 语句来解决这个问题：\n\n```\nimport java.util.*;\nimport java.sql.*;\nimport java.util.Date;\n\
  ```\n\n如果你确实都需要两个 `Date` 类怎么办？那么在每个类名上都使用全包名：\n\n点击此处查看代码图像\n\n```\nvar startTime\
  \ = new java.util.Date();\nvar today = new java.sql.Date(. . .);\n```\n\n在包中定位类是\
  \ `编译器` 的一项活动。类文件中的字节码始终使用完全包名来引用其他类。\n\n![Images](img/cnote.jpg) C++ 注意\n\nC++\
  \ 程序员有时会将 `import` 与 `#include` 混淆。两者之间没有共同点。在 C++ 中，你必须使用 `#include` 来包含外部特性的声明，因为\
  \ C++ 编译器不会查看正在编译的文件及其显式包含的头文件以外的任何文件。只要你告诉 Java 编译器去哪里，它乐意查看其他文件。\n\n在 Java 中，你可以通过显式命名所有类（如\
  \ `java.util.Date`）来完全避免 `import` 机制。在 C++ 中，你无法避免 `#include` 指令。\n\n`import` 语句的唯一好处是方便。你可以用比完全包名短的名字来引用类。例如，在\
  \ `import java.util.*`（或 `import java.util.Date`）语句之后，你可以简单地用 `Date` 来引用 `java.util.Date`\
  \ 类。\n\n在 C++ 中，类似于包机制的构造是命名空间（namespace）。将 Java 中的 `package` 和 `import` 语句视为 C++\
  \ 中 `namespace` 和 `using` 指令的对应物。\n\n### 4.8.3 静态导入\n\n`import` 语句的一种允许导入静态方法和字段，而不仅仅是类。\n\
  \n例如，如果你在源文件顶部添加指令\n\n点击此处查看代码图像\n\n```\nimport static java.lang.System.*;\n```\n\
  \n那么你就可以在没有类名前缀的情况下使用 `System` 类的静态方法和字段：\n\n点击此处查看代码图像\n\n```\nout.println(\"Goodbye,\
  \ World!\"); // 即 System.out\nexit(0); // 即 System.exit\n```\n\n你也可以导入特定的方法或字段：\n\
  \n点击此处查看代码图像\n\n```\nimport static java.lang.System.out;\n```\n\n在实践中，很难确定许多程序员是否想要缩写\
  \ `System.out` 或 `System.exit`。这种代码看起来不清晰。相反，\n\n```\nsqrt(x, 2) + pow(y, 2))\n\
  ```\n\n要清晰得多。\n\n### 4.8.4 将类添加到包中\n\n要将类放入包中，请在源文件的顶部显包包名，位于定义类的代码*之前*。例如，Listing\
  \ 4.8 中的 `Employee.java` 如下：\n\n点击此处查看代码图像\n\n```\npackage com.horstmann.corejava;\n\
  \npublic class Employee\n{\n   . . .\n}\n```\n\n如果你不在源文件中放入 `package` 语句，那么该源文件中的类属于`匿名包`。匿名包没有包名。到目前为止，我们示例类都位于匿名包中。\n\
  \n将源文件放在与完全包名匹配的目录中。例如，`com.horstmann.corejava` 包中的所有源文件应该位于 `com/horstmann/corejava`（Windows\
  \ 上为 `com\\horstmann\\corejava`）。编译器会将类放在相同的目录结构中。\n\nListing 4.7 和 4.8 中的程序分布在两个包中：`PackageTest`\
  \ 类属于匿名包，而 `Employee` 类属于 `com.horstmann.corejava` 包。因此，`Employee.java` 文件必须位于 `com/horstmann/corejava`。换句话之，目录结构如下：\n\
  \n![Images](img/190pro02.jpg)\n\n要编译此程序，只需切换到基础目录并运行命令\n\n```\njavac PackageTest.java\n\
  ```\n\n编译器会自动找到并编译 `com/horstmann/corejava/Employee.java`。\n\n\n\n\n让我们来看一个更实际的例子，在这个例子中我们没有使用未命名包，而是将类分布在多个包中（`com.horstmann.corejava`\
  \ 和 `com.mycompany`）。\n\n![Images](img/191pro01.jpg)\n\n在这种情况下，你仍然必须从*基*目录编译并运行类——即包含\
  \ `com` 目录的目录：\n\n点击此处代码图片\n\n```\njavac com/mycompany/PayrollApp.java\njava com.mycompany.App\n\
  ```\n\n再次注意，编译器操作的是*文件*（带有文件分隔符和扩展名 `.java`），而 Java 解释器加载的是*类*（使用点分隔符）。\n\n![Images](img/tip.jpg)\
  \ 提示\n\n从下一章开始，我们将在源代码中使用包。这样，你就可以为每一章创建一个 IDE 项目，而不是为每个小节。\n\n![Images](img/caution.jpg)\
  \ 注意\n\n编译器在编译源文件时*不会*检查目录结构。例如，假设你有一个以以下指令开头的源文件：\n\n```\npackage com.mycompany;\n\
  ```\n\n即使该文件没有放在 `com/mycompany` 子目录中，你也可以编译它。*如果*该源文件不依赖其他包，它将无错误地编译。然而，除非你先将所有类文件移动到正确的位置，否则生成的程序将无法运行。如果包与目录不匹配，*虚拟机*将找不到这些类。\n\
  \n**列表 4.7** `PackageTest/PackageTest.java`\n\n点击此处代码图片\n\n```\n 1  import com.horstmann.corejava.*;\n\
  \ 2  // Employee 类定义在那个包中\n 3\n 4  import static java.lang.System.*;\n 5\n 6 /**\n\
  \ 7  * 此程序演示了包的使用。\n 8  * @version 1.11 2004-02-19\n 9  * @author Cay Horstmann\n\
  10  */\n11 public class PackageTest\n12 {\n13    public static void main(String[]\
  \ args)\n14    {\n15       // 因为有 import 语句，我们在这里不需要\n16       // com.horstmann.corejava.Employee\n\
  17       var harry = new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\n18\n19\
  \       harry.raiseSalary(5);\n20\n21       // 因为有 static import 语句，我们在这里不需要 System.out\n\
  22       out.println(\"name=\" + harry.getName() + \",salary=\" + harry.getSalary());\n\
  23    }\n24 }\n```\n\n**列表 4.8** `PackageTest/com/horstmann/corejava/Employee.java`\n\
  \n点击此处代码图片\n\n```\n 1 package com.horstmann.corejava;\n 2\n 3 // 此文件中的类是该包的一部分\n\
  \ 4\n 5 import java.time.*;\n 6\n 7 // import 语句位于 package 语句之后\n 8\n 9 /**\n10\
  \  * @version 1.11 2015-05-08\n11  * @author Cay Horstmann\n12  */\n13 public class\
  \ Employee\n14 {\n15    private String name;\n16    private double salary;\n17 \
  \   private LocalDate hireDay;\n18\n19    public Employee(String name, double salary,\
  \ int year, int month, int day)\n20    {\n21       this.name = name;\n22       this.salary\
  \ = salary;\n23       hireDay = LocalDate.of(year, month, day);\n24    }\n25\n26\
  \    public String getName()\n27    {\n28       return name;\n29    }\n30\n31  \
  \  public double getSalary()\n32    {\n33       return salary;\n34    }\n35\n36\
  \    public LocalDate getHireDay()\n37    {\n38       return hireDay;\n39    }\n\
  40\n41    public void raiseSalary(double byPercent)\n42    {\n43       double raise\
  \ = salary * byPercent / 100;\n44       salary += raise;\n45    }\n46 }\n```\n\n\
  #### 4.8.5 包访问权限\n\n你已经遇到过访问修饰符 `public` 和 `private`。标记为 `public` 的特征可以被任何类使用。私有特征只能由定义它的类使用。如果你没有指定\
  \ `public` 或 `private`，则该特征（即类、方法或变量）可以被同一个*包*中的所有方法访问。\n\n考虑列表 4.2 中的程序。`Employee`\
  \ 类没有定义为公共类。因此，只有同一个包中的其他类（例如 `EmployeeTest`，在此例中是未命名包）可以访问它。对于类来说，这是一个合理的默认值。但对于变量来说，这是一个遗憾的选择。变量必须显式标记为\
  \ `private`。\n\n#### 4.8.6 类路径\n\n正如你所看到的，类存储在文件系统的子目录。类的路径必须与包名匹配。\n\n类文件也可以存储在\
  \ JAR（Java 存档）文件中。JAR 文件包含以压缩格式的多个类文件和子目录，可以节省空间并提高性能。当你在程序中使用第三方库时，通常会给你一个或多个需要包含的\
  \ JAR 文件。你将在第 11 章中看到如何创建自己的 JAR 文件。\n\n\n\n\n```\n/home/user/classdir:.:/home/user/archives/archive.jar\n\
  ```\n\n在 Windows 中，它们用分号分隔：\n\n点击此处查看代码图像\n\n```\nc:\\classdir;.;c:\\archives\\\
  archive.jar\n```\n\n在两种情况下，句号 `.` 都表示当前目录。\n\n该类路径（class path）包含：\n\n*   基础目录 `/home/user/classdir`\
  \ 或 `c:\\classdir`；\n*   当前目录（`.`)以及\n*   JAR 文件 `/home/user/archives/archive.jar`\
  \ 或 `c:\\archives\\archive.jar`。\n\n从 Java 6 开始，你可以为 JAR 文件目录指定通配符，如下：\n\n点击此处查看代码图像\n\
  \n```\n/home/user/classdir:.:/home/user/archives/'*'\n```\n\n或者\n\n```\nc:\\classdir;.;c:\\\
  archives\\*\n```\n\n在 UNIX 中，`*` 必须经过转义以防止 shell 扩展。\n\n`archives` 目录下的所有 JAR 文件（但不包括\
  \ `.class` 文件）都在此类路径中。Java API 总是会被搜索类；不要显式将其包含在类路径中。\n\n![图像](img/caution.jpg)\
  \ 注意\n\n`javac` 编译器始终会在当前目录查找文件，但 `java` 虚拟机启动器只有在 `.` 目录位于类路径上时才会查找当前目录。如果你没有设置类路径，这并不是一个问题——默认的类路径由\
  \ `.` 目录组成。但如果你设置了类路径却忘记包含 `.` 目录，你的程序将编译通过而不报错，但无法运行。\n\n类路径列出了所有作为查找类*起点*的目录和存档文件。让我们考虑我们的示例类路径：\n\
  \n点击此处查看代码图像\n\n```\n/home/user/classdir:.:/home/user/archives/archive.jar\n```\n\
  \n假设虚拟机搜索 `com.horstmann.corejava.Employee` 类的类文件。它首先在 Java API 类中查找。它在那里找不到该类文件，因此转到类路径。它接着查找以下文件：\n\
  \n*   `/home/user/classdir/com/horstmann/corejava/Employee.class`\n*   从当前目录开始的\
  \ `com/horstmann/corejava/Employee.class`\n*   位于 `/home/user/archives/archive.jar`\
  \ 内部的 `com/horstmann/corejava/Employee.class`\n\n编译器定位文件比虚拟机困难。如果你在没有指定包的情况下引用了一个类，编译器首先需要找到包含该类的包。它会咨询所有的\
  \ `import` 指令作为类的可能的来源。例如，假设源文件包含以下指令：\n\n点击此处查看代码图像\n\n```\nimport java.util.*;\n\
  import com.horstmann.corejava.*;\n```\n\n并且源代码引用了类 `Employee`。编译器随后尝试寻找 `java.lang.Employee`（因为\
  \ `java.lang` 包默认总是导入）、`java.util.Employee`、`com.horstmann.corejava.Employee` 以及当前包中的\
  \ `Employee`。它会在类路径的所有位置搜索这些*每一个*类。如果发现多个类，则会发生编译错误。（完全限定类名必须是唯一的，因此 `import` 语句的顺序并不重要。）\n\
  \n编译器更进了一步。它查看*源文件*以检查源是否比类文件新。如果是，源文件将自动重新编译。记住，你只能从其他包导入公共类（public classes）。一个源文件只能包含一个公共类，且文件名与公共类的名称必须匹配。因此，编译器可以轻松地定位公共类的源文件。然而，你可以从当前包导入非公共类。这些类可能定义在不同名称的源文件中。如果你从当前包导入类，编译器会搜索当前包的*所有*源文件以查看是哪一个定义了该类。\n\
  \n### 4.8.7 设置类路径\n\n最好使用选项 `-classpath`（或 `-cp`，或者从 Java 9 开始的 `--class-path`）来指定类路径：\n\
  \n点击此处查看代码图像\n\n```\njava -classpath /home/user/classdir:.:/home/user/archives/archive.jar\
  \ MyProg\n```\n\n或者\n\n点击此处查看代码图像\n\n```\njava -classpath c:\\classdir;.;c:\\archives\\\
  archive.jar MyProg\n```\n\n整个命令必须在一行内输入。将这样长的命令行放入 shell 脚本或批处理文件中是一个好主意。\n\n使用\
  \ `-classpath` 选项是设置类路径的首选方法。另一种方法是使用 `CLASSPATH` 环境变量。具体取决于你的 shell。对于 bash shell，使用命令：\n\
  \n点击此处查看代码图像\n\n```\nexport CLASSPATH=/home/user/classdir:.:/home/user/archives/archive.jar\n\
  ```\n\n在 Windows shell 中，使用：\n\n点击此处查看代码图像\n\n```\nset CLSPATH=c:\\classdir;.;c:\\\
  archives\\archive.jar\n```\n\n类路径将一直有效 shell 退出。\n\n![图像](img/caution.jpg) 注意\n\n\
  有些人建议永久设置 `CLASSPATH` 环境变量。这通常是一个坏主意。人们会忘记全局设置，并在类未被加载时感到惊讶。\n\n![图像](img/caution.jpg)\
  \ 注意\n\n过去，曾建议通过将所有 JAR 文件放入 `jre/lib/ext` 目录来绕过类路径。这种机制在 Java 9 中已过。\n\n## 4.9\
  \ JAR 文件\n\n当你打包应用程序时，你希望给用户一个文件，而不是一个充满类文件的目录。JAR 文件为此设计的。JAR 文件可以包含类文件和其他文件类型，如图像和声音。此外，JAR\
  \ 文件使用了熟悉的 ZIP 格式进行压缩。\n\n#### 4.9.1 创建 JAR\n\n使用 `jar` 工具制作 JAR 文件。（在默认 JDK 安装中，它位于\
  \ `bin` 目录下。）创建新 JAR 文件的常用命令使用以下语法：\n\n点击此处查看代码图像\n\n```\njar cvfjarFileName file1\
  \ file2 .\n```\n\n例如：\n\n点击此处查看代码图像\n\n```\njar cvf CalculatorClasses.jar *.class\
  \ icon.gif\n```\n\n通常情况下，`jar` 命令具有以下格式：\n\n```\njar options file1 file2 .\n```\n\
  \n表 4.2 列出了 `jar` 程序的所有选项。它们与 UNIX `tar` 命令的选项相似。\n\n你可以将应用程序和代码库打包成 JAR 文件。例如，如果你在\
  \ Java 程序中发送邮件，你需要使用封装在 `javax.mail.jar` 文件中的库。\n\n\n\n\n\n| `f` | 将第二个命令行参数指定为\
  \ JAR 文件名。如果缺少此参数，`jar` 将将结果写入到标准输出（在创建 JAR 文件时）或从标准输入读取（在提取或列出 JAR 文件时）。 |\n| `i`\
  \ | 创建索引文件（用于加速大型归档中的查找）。 |\n| `m` | 向 JAR 文件中添加 `manifest`（清单）。清单是归档内容和源的描述文件。每个归档都有一个默认的清单，但如果你想验证归档内容，可以提供自己的清单。\
  \ |\n| `M` | 不为条目创建清单文件。 |\n| `t` | 显示目录表。 |\n| `u` | 更新现有的 JAR 文件。 |\n| `v` | 生成详细输出。\
  \ |\n| `x` | 提取文件。如果你提供了一个或多个文件名，则只提取这些文件。否则，将提取所有文件。 |\n| `0` | 存储时不进行 ZIP 压缩。\
  \ |\n\n**表 4.2** `jar` 程序选项\n\n### 4.9.2 清单文件 (The Manifest)\n\n除了类文件、图像和其他资源外，每个\
  \ JAR 文件都包含一个 `manifest` 文件，用于描述归档的特殊特性。\n\n清单文件名为 `MANIFEST.MF`，位于 JAR 文件中特殊的 `META-INF`\
  \ 子目录下。最少的合法清单非常无趣——仅仅是\n\n```\nManifest-Version: 1.0\n```\n\n复杂的清单可以包含更多的条目。清单条目被分为若干部分。清单中的第一个部分称为\
  \ `main section`（主部分）。它适用于整个 JAR 文件。随后的条目可以指定命名实体（如单个文件、包或 URL）的属性。这些条目必须以一个 `Name`\
  \ 条目开头。各个部分之间用空行分隔。例如：\n\n```\nManifest-Version: 1.0\n描述此归档的行\n\nName: Woozle.class\n\
  描述此文件的行\nName: com/mycompany/mypkg/\n描述此包的行\n```\n\n要编辑清单，请将你想要添加到清单中的行存放在一个文本文件中。然后运行\n\
  \n点击此处查看代码图像\n\n```\njar cfm jarFileName manifestFileName . . .\n```\n\n例如，要创建一个带有清单的新\
  \ JAR 文件，请运行\n\n点击此处查看代码图像\n\n```\njar cfm MyArchive.jar manifest.mf com/mycompany/mypkg/*.class\n\
  ```\n\n要更新现有 JAR 文件的清单，请将新增内容放入文本文件中，并使用如下命令\n\n点击此处查看代码图像\n\n```\njar ufm MyArchive.jar\
  \ manifest-additions.mf\n```\n\n![Images](img/note.jpg) 提示\n\n关于 JAR 和清单文件格式的更多信息，请参阅\
  \ [`https://docs.oracle.com/javase/10/docs/specs/jar/jar.html`](https://docs.oracle.com/javase/10/docs/specs/jar/jar.html)。\n\
  \n### 4.9.3 可执行 JAR 文件\n\n你可以使用 `jar` 命令的 `e` 选项来指定程序的 `entry point`（入口点）——即你通常调用\
  \ `java` 程序启动器时指定的那个类：\n\n点击此处查看代码图像\n\n```\njar cvfe MyProgram.jar com.mycompany.mypkg.MainAppClass\
  \ files to add\n```\n\n或者，你可以在清单中指定程序的 `main class`（主类），包括格式如下的语句\n\n点击此处查看代码图像\n\
  \n```\nMain-Class: com.mycompany.mypkg.MainAppClass\n```\n\n不要为主类名添加 `.class` 扩展名。\n\
  \n![Images](img/caution.jpg) 注意\n\n清单的最后一行必须以换行符结束。否则，清单将无法被正确读取。常见的错误是生成了一个只包含\
  \ `Main-Class` 行但没有行终止符的文本文件。\n\n使用哪种方法，用户都可以简单地启动程序：\n\n```\njava -jar MyProgram.jar\n\
  ```\n\n根据操作系统的配置，用户甚至可能通过双击 JAR 文件图标来启动应用程序。以下是各种操作系统的行为：\n\n* 在 Windows 上，Java\
  \ 运行时安装程序会为 `.jar` 扩展名创建文件关联，使用 `javaw -jar` 命令启动文件。（与 `java` 命令不同，`javaw` 命令不会打开命令行窗口。）\n\
  \n* 在 Mac OS X 上，操作系统能够识别 `.jar` 文件扩展名，并在双击 JAR 文件时执行 Java 程序。\n\n然而，JAR 文件中的 Java\
  \ 程序并没有像原生应用程序那样的感觉。在 Windows 上，你可以使用第三方封装工具（wrapper utilities）将 JAR 文件转换为 Windows\
  \ 可执行文件。封装器（wrapper）是一个具有熟悉的 `.exe` 扩展名的 Windows 程序，它用于查找并启动 Java 虚拟机 (JVM)，或者在未找到\
  \ JVM 时告诉用户如何操作。有许多商业和开源产品，例如 Launch4J ([`launch4j.sourceforge.net``](http://launch4j.sourceforge.net))\
  \ 和 IzPack ([`izpack.org``](http://izpack.org))。\n\n### 4.9.4 多版本 JAR 文件\n\n随着模块的引入和对包的强封装，某些以前可以访问的内部\
  \ API 不再可用。这可能需要库提供者为不同的 Java 版本分发不同的代码。Java 9 引入了 `multi-release JAR`（多版本 JAR）来实现此目的。\n\
  \n为了后兼容，特定版本的类文件被放置在 `META-INF/versions` 目录下：\n\n![Images](img/201pro01.jpg)\n\n\
  假设 `Application` 类使用了 `CssParser` 类。那么旧的 `Application.class` 文件可以编译为使用 `com.sun.javafx.css.CssParser`，而\
  \ Java 9 版本则使用 `javafx.css.CssParser`。\n\nJava 8 对 `META-INF/versions` 目录一所不知，只会加载旧类。当\
  \ Java 9 读取 JAR 文件时，将使用新版本。\n\n要添加带版本的类文件，请使用 `--release` 标志：\n\n点击此处查看代码图像\n\n\
  ```\njar uf MyProgram.jar --release 9 Application.class\n```\n\n要从头构建多版本 JAR 文件，请使用\
  \ `-C` 选项切换到不同的版本目录：\n\n点击此处查看代码图像\n\n```\njar cf MyProgram.jar -C bin/8 . --release\
  \ 9 -C bin/9 Application.class\n```\n\n在编译不同版本时，使用 `--release` 标志和 `-d` 标志指定输出目录：\n\
  \n点击此处查看代码图像\n\n```\njavac -d bin/8 --release 8 .\n```\n\n从 Java 9 开始，如果目录不存在，`-d`\
  \ 选项会自动创建。\n\n`--release` 标志也是 Java 9 新引入。在旧版本中，你需要使用 `-source`、`-target` 和 `-bootclasspath`\
  \ 标志。JDK 现在提供了两个旧版本的符号文件。在 Java 9 中，你可以将 `--release` 设置为 `9`、`8` 或 `7`。\n\n多版本 JAR\
  \ 不是用于不同的程序或库。所有类的公共 API 应该是相同的。多版本 JAR 的唯一目的是让特定版本的程序或库适用于多个 JDK 版本。如果你增加了功能或更改了\
  \ API，你应该提供一个新版本的 JAR。\n\n![Images](img/note.jpg) 提示\n\n如 `javap` 等工具尚未重构以处理多版本\
  \ JAR 文件。如果你调用\n\n点击此处查看代码图像\n\n```\njavap -classpath MyProgram.jar Application.class\n\
  ```\n\n你得到的是类的基础版本（毕竟它应该与新版本具有相同的公共 API）。如果你必须查看新版本，请调用\n\n点击此处查看代码图像\n\n```\njavap\
  \ -classpath MyProgram.jar!/META-INF/versions/9/Application.class\n```\n\n### 4.9.5\
  \ 关于命令行选项的说明\n\nJava 开发工具包中命令的选项传统上使用单连杠跟随多个字母的选项名称，例如\n\n点击此处查看代码图像\n\n\n\n\n\n\
  ```\njava -jar . . .\njavac -Xlint:unchecked -classpath . . .\n```\n\n例外是 `jar`\
  \ 命令，它遵循了 `tar` 命令的经典选项格式，且不带横杠：\n\n```\njar cvf . . .\n```\n\n从 Java 9 开始，Java\
  \ 工具正在转向一种更通用的选项格式，在该格式中，多字母选项名称以双横杠开头，而常用选项则有单字母快捷方式。例如，Linux 的 `ls` 命令可以使用“人类可读”选项调用：\n\
  \n```\nls --human-readable\n```\n\n或者\n\n```\nls -h\n```\n\n从 Java 9 开始，你可以使用 `--version`\
  \ 代替 `-version`，并使用 `--class-path` 代替 `-classpath`。正如你在第二卷第 9 章 中看到的，`--module-path`\
  \ 选项有一个快捷方式 `-p`。\n\n你可以在 JEP 293 增强请求中找到详细信息，[`http://openjdk.java.net/jeps/293`](http://openjdk.java.net/jeps/293)。作为此次清理工作的一部分，作者还建议标准化选项参数。带有\
  \ `--` 和多个字母的选项的参数可以通过空格或 `=` 符号分隔：\n\n点击此处查看代码图像\n\n```\njavac --class-path /home/user/classdir\
  \ . . .\n```\n\n或者\n\n点击此处查看代码图像\n\n```\njavac --class-path=/home/user/classdir\
  \ . . .\n```\n\n单字母选项的参数可以使用空格分隔，也可以直接紧跟在选项后面：\n\n```\njavac -p moduledir . . .\n\
  ```\n\n或者\n\n```\njavac -pmoduledir . . .\n```\n\n![Images](img/caution.jpg) 注意\n\
  \n后者目前不起作用，而且通常来说这似乎是个坏主意。如果模块目录恰好是 `arameters` 或 `rocessor`，为什么要招引入与旧选项的冲突呢？\n\n\
  没有参数的单字母选项可以组合在一起：\n\n点击此处查看代码图像\n\n```\njar -cvf MyProgram.jar -e mypackage.MyProgram\
  \ */*.class\n```\n\n![Images](img/caution.jpg) 注意\n\n这目前不起作用，而且注定会导致混乱。假设 `javac`\
  \ 获得了一个 `-c` 选项。那么 `javac -cp` 是指 `javac -c -p`，还是旧的 `-cp` 优先？\n\n这造成了一个混乱局面，希望随着时间的推移得到清理。尽管我很想摆弃过时的\
  \ `jar` 选项，但似乎等尘埃落定之后是最好的。但如果你想完全彻底现代化，可以安全地使用 `jar` 命令的长格式选项：\n\n点击此处查看代码图像\n\n\
  ```\njar --create --verbose --file jarFileName file1 file2 . . .\n```\n\n如果你不对单字母选项进行分组，它们同样有效：\n\
  \n点击此处查看代码图像\n\n```\njar -c -v -f jarFileName file1 file2 . . .\n```\n\n## 4.10\
  \ 文档注释\n\nJDK 包含一个名为 `javadoc` 的实用工具，它可以从你的源文件生成 HTML 文档。事实上，第 3 章 中描述的在线 API 文档仅仅是在标准\
  \ Java 库源码上运行 `javadoc` 的结果。\n\n如果你在源代码中添加以特殊分隔符 `/**` 开头的注释，也可以生成专业的文档。这是一个非常好的方法，因为它让你将代码和文档放在同一个地方。如果你将文档放在单独的文件，正如你可能知道的，代码和注释往往随着时间的推移而分离。当文档注释与源代码位于同一个文件中时，更新两者并再次运行\
  \ `javadoc` 就是很容易的事。\n\n#### 4.10.1 注释插入\n\n`javadoc` 工具提取以下项目的信息：\n\n* 模块 (Modules)\n\
  * 包 (Packages)\n* 公有类和接口\n* 公有和受保护字段\n* 公有和受保护的构造函数和方法\n\n受保护特性在第二卷的第 5 章 中引入，接口在第\
  \ 6 章，模块在第 9 章。\n\n你可以（也应该）为这些特性中的每一个项提供注释。每个注释都放置在其描述的特性的*上方*。注释以 `/**` 开始，以 `*/`\
  \ 结束。\n\n每个 `/** . . . */` 文档注释包含*自由格式文本*，后面紧跟*标签*。标签以 `@` 开头，例如 `@since` 或 `@param`。\n\
  \n自由格式文本的*第一句*应该是一个*摘要语句*。`javadoc` 工具会自动生成提取这些句子的摘要页。\n\n在自由格式文本中，你可以使用 HTML 修饰符，如\
  \ `<em>. . .</em>` 用于强调，`<strong>. . .</strong>` 用于强强调，`<ul>`/`<li>` 用于项目列表，以及 `<img\
  \ . . ./>` 用于包含图像。\n\n\n\n\n以下标签可用于类文档注释中：\n\n*   `@author` `name`\n\n    此标签创建一个“作者”（author）条目。你可以有多个\
  \ `@author` 标签，每个作者对应一个。不必强迫使用此标签——你的版本控制系统在跟踪作者归属方面比它做得更详尽。\n\n*   `@version` `text`\n\
  \n    此标签创建一个“版本”（version）条目。`text` 可以是对当前版本的任何描述。\n\n你可以使用 `@see` 和 `@link` 标签使用指向\
  \ `javadoc` 文档其他相关部分或外部文档的超链接。\n\n标签 `@see` `reference` 会会在“另参见”（see also）部分添加一个超链接。它可以同时用于类和方法。在这里，`reference`\
  \ 可以是以下内容之一：\n\n```\npackage.class#feature label\n<a href=\". . .\">label</a>\n\"\
  text\"\n```\n\n第一种情况是最用的。你提供类、方法或变量名，`javadoc` 会插入一个指向该文档的超链接。例如：\n\n点击此处查看代码图像\n\
  \n```\n@see com.horstmann.corejava.Employee#raiseSalary(double)\n```\n\n这将创建一个指向\
  \ `com.horstmann.corejava.Employee` 类中 `raiseSalary(double)` 方法的链接。你可以省略包名，或者省略包名和类名。这时，该特性将在当前包或类中查找。\n\
  \n注意，你必须使用 `#` 而不是点来分隔类与方法或变量名。Java 编译器本身非常擅长确定点号作为包、子包、类、内部类以及方法和变量之间分隔符的各种含义。但\
  \ `javadoc` 工具并没有那么聪明，所以你得帮助它。\n\n如果 `@see` 标签后跟着 `<` 字符，则你需要指定一个超链接。你可以链接到任何你喜欢的\
  \ URL。例如：\n\n点击此处查看代码图像\n\n```\n@see <a href=\"www.horstmann.com/corejava.html\"\
  >The Core Java home page</a>\n```\n\n在这些每情况下，你都可以指定一个可选的 `label` 作为链接锚点。如果你省略了 label，用户将看到目标代码名或\
  \ URL 作为锚点。\n\n如果 `@see` 标签后跟着 `\"` 字符，则会在“另参见”部分显示该文本。例如：\n\n```\n@see \"Core Java\
  \ 2 volume 2\"\n```\n\n你可以为一个特性添加多个 `@see` 标签，但必须将它们全部放在在一起。\n\n如果你愿意，可以在任何文档注释的任何位置放置指向其他类或方法的超链接。在注释的任何位置插入格式如下特殊标签：\n\
  \n点击此处查看代码图像\n\n```\n{@link package.class#feature label}\n```\n\n特性的描述遵循与 `@see`\
  \ 标签相同的规则。\n\n最后，从 Java 9 开始，你可以使用 `{@index` `entry`}` 标签向搜索框添加条目。\n\n### 4.10.6\
  \ 包注释\n\n将类、方法和变量的注释直接放在 Java 源文件中，并用 `/** . . . */` 文档注释隔开。然而，要生成*包*（package）注释，你需要在每个包目录下添加一个单独的文件。你有两个选择：\n\
  \n1.  提供一个名为 `package-info.java` 的 Java 文件。该文件必须包含一个初始 Javadoc 注释（用 `/**` 和 `*/`\
  \ 分隔），后跟一个 `package` 语句。它不应包含进一步的代码或注释。\n2.  提供一个名为 `package.html` 的 HTML 文件。所有位于\
  \ `<<body> . . .</</body>>` 之间的文本都会被提取。\n\n### 4.10.7 注释提取\n\n在这里，`docDirectory`\
  \ 是你希望存放 HTML 文件的目录名称。按照以下步骤操作：\n\n1.  切换到包含你要文档的源文件的目录。如果你有嵌套的包需要文档，例如 `com.horstmann.corejava`，你必须在包含子目录\
  \ `com` 的目录中运行（如果你提供了 `overview.html` 文件，这就是包含该文件的目录）。\n2.  运行命令\n\n    点击此处查看代码图像\n\
  \n    ```\n    javadoc -d docDirectory nameOfPackage\n    ```\n\n    针对单个包运行。或者，运行\n\
  \n    点击此处查看代码图像\n\n    ```\n    javadoc -d docDirectory nameOfPackage1 nameOfPackage2\\\
  . . .\n    ```\n\n    来文档多个包。如果你的文件在未命包中，请改运行\n\n    ```\n    javadoc -d docDirectory\
  \ *.java\n    ```\n\n如果你省略了 `-d docDirectory` 选项，HTML 文件将提取到当前目录。那可能会变得很乱，我不建议这样做。\n\
  \n可以通过许多命令行选项微调 `javadoc` 程序。例如，你可以使用 `-author` 和 `-version` 选项（默认情况下，它们会被省略）。另一个有用的选项是\
  \ `-link`，用于包含指向标准类的超链接。例如，如果你使用命令-line\n\n    点击此处查看代码图像\n\n    ```\n    javadoc\
  \ -link http://docs.oracle.com/javase/9/api\n    ```\n\n    所有标准库类将链接到该网站。如果你使用\
  \ `-linksource` 选项，每个源文件将转换为 HTML（没有颜色标记，但有行号），并且每个类和方法名将变成指向源的链接。\n\n你还可以为所有源文件提供一个概述。将其放在\
  \ `overview.html` 文件中并运行 `javadoc -overview filename`。用户从导航栏选择“Overview”时将显示内容。\n\
  \n有关其他选项，请参阅 [`docs.oracle.com/javase/9/javadoc/javadoc.htm`](https://docs.oracle.com/javase/9/javadoc/javadoc.htm)。\n\
  \n### 4.11 设计提示\n\n不需要试图详尽或冗长，我想在本章结束时提供一些让你的类更符合规范的提示。\n\n1.  *始终保持数据私有*。这是首要的；任何其他操作都违反了封装。你可能需要编写访问器或修改器方法，但保持实例字段私有仍然更好。经验表明表示可能会改变，但使用数据的方式变化频率。当数据私有时，表示的变化不会影响类的用户，错误更容易检测。\n\
  2.  *始终初始化数据*。Java 不会为你初始化局部变量，但会初始化对象的实例字段。不要依赖默认值，要显式地初始化所有变量，通过提供默认值或在所有构造函数中设置默认值。\n\
  3.  *不要在类中使用过多的基本类型*。其主意是用其他类替换多个*相关的*基本类型的使用。这使得你的类更容易被理解和更改。例如，替换 `Customer` 类中的以下实例字段：\n\
  \n    ```\n    private String street;\n    private String city;\n    private String\
  \ state;\n    private int zip;\n    ```\n\n    使用名为 `Address` 的新类。这样，你就可以轻松地应对地址的变化，例如处理国际地址的需求。\n\
  4.  *并不是所有字段都需要单独的字段访问器和修改器*。你可能需要获取和设置员工的薪水。一旦对象构建，你不需要更改入职日期。而且，对象经常拥有你不希望其他人获取或设置的实例字段，例如\
  \ `Address` 类中的州缩写数组。\n5.  *拆分职责过多的类*。\n\n\n\n\n这个提示显然是模糊的：“太多”显然是因人而异的。然而，如果有一种明显的方法可以将一个复杂的类拆分为两个概念上更简单的类，那么请抓住这个机会。（另一方面，不要做得过头；十个每个只有一个一个方法的类，通常是设计过度了。）\n\
  \n这里有一个糟糕设计的示例：\n\n点击此处查看代码图片\n\n```\npublic class CardDeck // 糟糕的设计\n{\n   private\
  \ int[] value;\n   private int[] suit;\n\n   public CardDeck() { . . . }\n   public\
  \ void shuffle() { . . . }\n   public int getTopValue() { . . . }\n   public int\
  \ getTopSuit() { . . . }\n   public void draw() { . . . }\n}\n```\n\n这个类实际上实现了两个独立的概念：一个*牌组*（deck\
  \ of cards），拥有 `shuffle` 和 `draw` 方法；以及一张*卡牌*（card），拥有检查其值和花色的方法。引入一个代表单张卡牌的 `Card`\
  \ 类是有意义的。现在你有两个类，每个类都有自己的职责：\n\n点击此处查看代码图片\n\n```\npublic class CardDeck\n{\n  \
  \ private Card[] cards;\n   public CardDeck() { . . . }\n   public void shuffle()\
  \ { . . . }\n   public Card getTop() { . . . }\n   public void draw() { . . . }\n\
  }\n\npublic class Card\n{\n   private int value;\n   private int suit;\n\n   public\
  \ Card(int aValue, int aSuit) { . . . }\n   public int getValue() { . . . }\n  \
  \ public int getSuit() { . . . }\n}\n```\n\n### 6. 让你的类和方法的名称反映它们的职责。\n\n正如变量应该具有反映其代表含义的有意义名称一样，类也是如此。（标准库确实包含一些令人疑疑的例子，例如描述时间的\
  \ `Date` 类。）\n\n一个良好的约定是，类名应该是名词（`Order`），或者由形容词修饰的名词（`RushOrder`）或动名词（以“-ing”结尾的词，如\
  \ `BillingAddress`）。对于方法，遵循标准约定：访问器方法（accessor methods）以小写的 `get` 开头（`getSalary`），修改器方法（mutator\
  \ methods）使用小写的 `set`（`setSalary`）。\n\n### 7. 优先使用不可变类。\n\n`LocalDate` 类以及 `java.time`\
  \ 包中的其他类是不变的——没有方法可以修改对象的状态。与其修改对象，像 `plusDays` 这样的方法会返回带有修改后状态的新对象。\n\n变异的问题在于，当多个线程尝试同时更新对象时，它可能会并发发生。结果是不可预测的。当类是不可变的时，在多个线程之间共享它们的对象是安全的。\n\
  \n因此，在可能的情况下让类变为不可变是一个好主意。对于表示值的类（例如字符串或时间点），这为容易。计算可以简单地产生新值，而不是更新现有值。\n\n当然，并不是所有类都应该是不可变的。当员工加薪时，让\
  \ `raiseSalary` 方法返回一个新的 `Employee` 对象将很奇怪。\n\n在本章中，我们涵盖了对象和类的基础知识，这些知识使 Java 成为一种“基于对象”的语言。为了真正实现面向对象，编程语言还必须支持继承和多态。Java\
  \ 对这些特性的支持是下一章的主题。\n\n# 第 5 章\n\n## 继承\n\n### 本章\n\n* 5.1 类、超类和子类\n* 5.2 `Object`:\
  \ 宇宙超类\n* 5.3 通用数组列表\n* 5.4 包装类与自动装箱\n* 5.5 变长参数方法\n* 5.6 抽象类\n* 5.7 枚举类\n* 5.8\
  \ 密封类\n* 5.9 反射\n* 5.10 继承的设计提示\n\n第 4 章 介绍了类和对象。在本章中，你将学习*继承*，这是面向对象编程的另一个基本概念。继承的思想是你可以创建构建在现有类之上的类。当你从现有类继承时，你会重用（或继承）它的方法，并可以添加新的方法和字段以使你的新类适应新的情况。这种技术在\
  \ Java 编程中至关重要。\n\n本章还涵盖了*反射*，即在运行程序中发现更多关于类及其属性的能力。反射是一个强大的特性，但不可否认它复杂。由于反射对工具构建者比对应用程序程序员更感兴趣，你可能第一次阅读时可以略过该章的这部分，然后再回来。\n\
  \n## 5.1 类、超类和子类\n\n让我们回到上一章讨论的 `Employee` 类。假设你在一家公司工作，那里对经理的对待方式不同。经理当然也是员工。然而，经理有薪水，他们还有奖金。这种情况非常需要继承。为什么呢？因为你需要定义一个新类\
  \ `Manager` 并添加功能。但你可以保留 `Employee` 类中已经编写的内容。更抽象地说，`Manager` 和 `Employee` 之间存在“是一个”（is-a）的关系。每个经理都是员工：这种“是一个”的关系是继承的标志。\n\
  \n![Images](img/note.jpg) 注意\n\n### 5.1.1 定义子类\n\n这是定义一个继承自 `Employee` 类的 `Manager`\
  \ 类。使用 Java 关键字 `extends` 表示继承。\n\n点击此处查看代码图片\n\n```\npublic class Manager extends\
  \ Employee\n{\n   added methods and fields\n}\n```\n\n![Images](img/cnote.jpg) C++\
  \ 注意\n\nJava 和 C++ 中的继承是相似的。Java 使用 `extends` 关键字而不是 `:` 符号。Java 中的继承都是公共继承；没有类似于\
  \ C++ 私有和保护继承的对应物。\n\n`extends` 关键字表示你正在创建一个派自现有类的新类。现有类被称为*超类*（superclass）、*基类*（base\
  \ class）或*父类*（parent class）。新类被称为*子类*（subclass）、*派生类*（derived class）或*子类*（child\
  \ class）。超类和子类是 Java 程序员最常用的术语，尽管某些程序员更喜欢父子类类比，这与“继承”主题也契合得很好。\n\n`Employee` 类是一个超类，但并不是因为它优于其子类或包含更多功能。*事实上，事实恰恰相反：*子类比超类具有*更多*的功能。例如，当我们查看\
  \ `Manager` 类的其余代码时，你会发现 `Manager` 类比其超类 `Employee` 封装了更多的数据并拥有更多功能。\n\n\n\n\n`super`\
  \ 和 `sub` 前缀来自于理论计算机科学和数学中的集合论语言。所有员工的集合包含了所有经理的集合，因此被认为是经理集合的 `superset`（超集）。或者换句话说，所有经理的集合是所有员工集合的\
  \ `subset`（子集）。\n\n我们的 `Manager` 类有一个新字段来存储奖金，并有一个新方法来设置它：\n\n点击此处查看代码图像\n\n```\n\
  public class Manager extends Employee\n{\n   private double bonus;\n   . . .\n \
  \  public void setBonus(double bonus)\n   {\n      this.bonus = bonus;\n   }\n}\n\
  ```\n\n这些方法和字段并没有特殊之处。如果你有一个 `Manager` 对象，你可以可以直接调用 `setBonus` 方法。\n\n```\nManager\
  \ boss = . . .;\nboss.setBonus(5000);\n```\n\n当然，如果你有一个 `Employee` 对象，你就无法调用 `setBonus`\
  \ 方法——因为它没有在 `Employee` 类定义的方法中。\n\n然而，你*可以*对 `Manager` 对象使用 `getName` 和 `getHireDay`\
  \ 等方法。尽管这些方法没有在 `Manager` 类中显式定义，但它们自动从 `Employee` 超类继承了。\n\n每个 `Manager` 对象都有四个字段：`name`、`salary`、`hireDay`\
  \ 和 `bonus`。字段 `name`、`salary` 和 `hireDay` 是取自父类。\n\n![Images](img/note.jpg) 笔记\n\
  \nJava 语言规范规定：“类中声明为私有的成员不会被该类的子类继承。”多年来，这一直让我的读者感到困惑。规范对“继承”一词的定义非常狭窄。它认为私有字段是未继承的，因为\
  \ `Manager` 类无法直接访问它们。因此，每个 `Manager` 对象拥有三个来自父类的字段，但 `Manager` 类并没有“继承”它们。\n\n\
  在通过扩展父类来定义子类时，你只需要指示子类和父类之间的差异。在设计类时，你将最通用的方法放在父类中，将更专门的方法放在其子类中。通过将公共功能移动到父类来提取这些功能，是面向对象编程中的常规操作。\n\
  \n![Images](img/note.jpg) 笔记\n\n在第 4 章 中，你学习了记录（records）：状态完全由构造器参数定义的类。你不能扩展记录，记录也不能扩展另一个类。\n\
  \n### 5.1.2 重写方法\n\n某些父类方法并不适用于 `Manager` 子类。特别是 `getSalary` 方法应该返回基本工资和奖金之和。你需要提供一个新的方法来重写（override）父类方法：\n\
  \n点击此处查看代码图像\n\n```\npublic class Manager extends Employee\n{\n   . . .\n   public\
  \ double getSalary()\n   {\n      . . .\n   }\n   . . .\n}\n```\n\n你如何实现这个方法呢？乍一看，它似乎很简单——只需返回\
  \ `salary` 和 `bonus` 字段之和即可：\n\n点击此处查看代码图像\n\n```\npublic double getSalary()\n{\n\
  \   return salary + bonus; // 不行\n}\n```\n\n然而，那是行不通的。记住，只有 `Employee` 方法可以直接访问\
  \ `Employee` 类的私有字段。这意味着 `Manager` 类的 `getSalary` 方法无法直接访问 `salary` 字段。如果 `Manager`\
  \ 方法想要访问这些私有字段，必须像其他所有方法做的那样——使用公共接口，在这种情况下是 `Employee` 类的公共 `getSalary` 方法。\n\n\
  所以，让我们再次尝试。你需要调用 `getSalary` 而不是简单的访问 `salary` 字段：\n\n点击此处查看代码图像\n\n```\npublic\
  \ double getSalary()\n{\n   double baseSalary = getSalary(); // 还是不行\n   return\
  \ baseSalary + bonus;\n}\n```\n\n现在，问题在于对 `getSalary` 的调用仅仅是调用了它自己，因为 `Manager`\
  \ 类有一个 `getSalary` 方法（即我们正在尝试实现的方法）。结果是导致同一个方法的无限调用链，导致程序崩溃。\n\n我们需要指示要调用的是 `Employee`\
  \ 超类的 `getSalary` 方法，而不是当前类。使用特殊关键字 `super` 来实现此目的。该调用\n\n```\nsuper.getSalary()\n\
  ```\n\n调用的是 `Employee` 类的 `getSalary` 方法。这里是 `Manager` 类 `getSalary` 方法的正确版本：\n\n\
  点击此处查看代码图像\n\n```\npublic double getSalary()\n{\n   double baseSalary = super.getSalary();\n\
  \   return baseSalary + bonus;\n}\n```\n\n![Images](img/note.jpg) 笔记\n\n有些人认为 `super`\
  \ 类似于 `this` 引用。然而，这种类比并不完全准确：`super` 不是一个引用；`super` 是一个用于访问父类成员的关键字。例如，`super.getSalary()`\
  \ 调用了 `Employee` 类的 `getSalary` 方法。\n\n### 5.1.3 子类构造器\n\n为了完成我们的示例，让我们提供一个构造器。\n\
  \n点击此处查看代码图像\n\n```\npublic Manager(String name, double salary, int year, int month,\
  \ int day)\n{\n   super(name, salary, year, month, day);\n   bonus = 0;\n}\n```\n\
  \n在这里，关键字 `super` 有不同的含义。指令 `super(name, salary, year, month, day);` 是“使用参数 `name`、`salary`、`year`、`month`\
  \ 和 `day` 调用父类构造器”的简写。\n\n由于 `Manager` 构造器无法访问 `Employee` 的私有字段，它必须通过构造器初始化它们。使用\
  \ `super` 的调用必须是构造器的第一语句。\n\n当子类对象如果没有显式调用父类构造器，父类必须有一个无参数构造器。该构造器会在子类构造之前被调用。\n\
  \n\n\n\n\n```\nManager boss = new Manager(\"Carl Cracker\", 80000, 1987, 12, 15);\n\
  boss.setBonus(5000);\n```\n\n我们创建了一个包含三个员工的数组：\n\n```\nvar staff = new Employee[3];\n\
  ```\n\n我们用经理和员工混合填充了数组：\n\n点击此处查看代码图片\n\n```\nstaff[0] = boss;\nstaff[1] = new Employee(\"\
  Harry Hacker\", 50000, 1989, 10, 1);\nstaff[2] = new Employee(\"Tony Tester\", 40000,\
  \ 1990, 3, 15);\n```\n\n我们打印出每个人的薪水：\n\n点击此处查看代码图片\n\n```\nfor (Employee e : staff)\n\
  \   System.out.println(e.getName() + \" \" + e.getSalary());\n```\n\n这个循环循环了以下数据：\n\
  \n```\nCarl Cracker 85000.0\nHarry Hacker 50000.0\nTommy Tester 40000.0\n```\n\n\
  现在，`staff[1]` 和 `staff[2]` 分别打印它们的基本薪水，因为它们是 `Employee` 对象。然而，`staff[0]` 是一个 `Manager`\
  \ 对象，其 `getSalary` 方法在基本薪水的基础上加上了奖金。\n\n非常注意的是，调用\n\n```\ne.getSalary()\n```\n\n\
  选出了*正确的* `getSalary` 方法。请注意，`e` 的*声明*类型是 `Employee`，但 `e` 所引用的对象的*实际*类型可以是 `Employee`\
  \ 也可以是 `Manager`。\n\n当 `e` 指向一个 `Employee` 对象时，调用 `e.getSalary()` 调用的是 `Employee`\
  \ 类的 `getSalary` 方法。然而，当 `e` 指向一个 `Manager` 对象时，调用的是 `Manager` 类的 `getSalary` 方法。虚拟机知道\
  \ `e` 所引用对象的实际类型，因此可以调用正确的方法。\n\n对象变量（例如变量 `e`）可以引用多个实际类型的这一被称为*多态性*。在运行时自动选择合适的方法被称为*动态绑定*。我将在本章更详细地讨论这两个主题。\n\
  \n![Images](img/cnote.jpg) C++ 备注\n\n在 C++ 中，如果你想实现动态绑定，需要将成员函数声明为 `virtual`。在 Java\
  \ 中，动态绑定是默认行为；如果你*不希望*某个方法是虚拟的，可以将其标记为 `final`。（我将在本章稍后后的部分讨论 `final` 关键字。）\n\n\
  列表 5.1 包含一个程序，展示了 `Employee`（列表 5.2）和 `Manager`（列表 5.3）对象的薪水计算差异。\n\n**列表 5.1**\
  \ `inheritance/ManagerTest.java`\n\n点击此处查看代码图片\n\n```\n 1 package inheritance;\n\
  \ 2\n 3 /**\n 4  * 此程序演示了继承。\n 5  * @version 1.21 2004-02-21\n 6  * @author Cay\
  \ Horstmann\n 7  */\n 8 public class ManagerTest\n 9 {\n10    public static void\
  \ main(String[] args)\n11    {\n12       // 构建一个 Manager 对象\n13       var boss =\
  \ new Manager(\"Carl Cracker\", 80000, 1987, 12, 15);\n14       boss.setBonus(5000);\n\
  15\n16       var staff = new Employee[3];\n17\n18       // 用 Manager 和 Employee\
  \ 对象填充 staff 数组\n19\n20       staff[0] = boss;\n21       staff[1] = new Employee(\"\
  Harry Hacker\", 50000, 1989, 10, 1);\n22       staff[2] = new Employee(\"Tommy Tester\"\
  , 40000, 1990, 3, 15);\n23\n24       // 打印所有 Employee 对象的信息\n25       for (Employee\
  \ e : staff)\n26          System.out.println(\"name=\" + e.getName() + \",salary=\"\
  \ + e.getSalary());\n27   }\n28 }\n```\n\n**列表 5.2** `inheritance/Employee.java`\n\
  \n点击此处查看代码图片\n\n```\n 1 package inheritance;\n 2\n 3 import java.time.*;\n 4\n 5\
  \ public class Employee\n 6 {\n 7    private String name;\n 8    private double\
  \ salary;\n 9    private LocalDate hireDay;\n10\n11    public Employee(String name,\
  \ double salary, int year, int month, int day)\n12    {\n13       this.name = name;\n\
  14       this.salary = salary;\n15       hireDay = LocalDate.of(year, month, day);\n\
  16    }\n17\n18    public String getName()\n19    {\n20       return name;\n20 \
