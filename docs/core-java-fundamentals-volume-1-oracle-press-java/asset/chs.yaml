  Listing 8.3 程序收集了前面章节中的各种方法，以便你看到它们的上下文。\n\n\n\n反射允许你在运行时分析任意对象。如果对象是泛型类的实例，你无法获得关于泛型类型参数的很多，因为它们已经被擦除。在接下来的章节中，你将学习尽管如此可以通过反射发现关于泛型类的信息。\n\
  \n### 8.9.1 泛型 `Class` 类\n\n`Class` 类现在是泛型的。例如，`String.class` 实际上是 `Class<String>`\
  \ 类的一个对象（事实上，它是唯一的对象）。\n\n该类型参数非常有用，因为它允许 `Class<T>` 的方法对其返回类型变得更具体。`Class<T>` 的以下方法利用了类型参数：\n\
  \n点击此处查看代码图片\n\n```\nT newInstance()\nT cast(Object obj)\nT[] getEnumConstants()\n\
  Class<? super T> getSuperclass()\nConstructor<T> getConstructor(Class... parameterTypes)\n\
  Constructor<T> getDeclaredConstructor(Class... parameterTypes)\n```\n\n`newInstance`\
  \ 方法返回一个从无参数构造函数获取的类实例。它的返回类型现在可以声明为 `T`，与由 `Class<T>` 描述的类类型相同。这节省了一次强制转换。\n\n\
  `cast` 方法返回给的对象，如果其类型确实是 `T` 的子类型，则现在声明为类型 `T`。否则，它会抛出 `BadCastException`。\n\n`getEnumConstants`\
  \ 方法如果该类不是 `enum` 类或已知类型为 `T` 的枚举值数组，则返回 `null`。\n\n最后，`getConstructor` 和 `getDeclaredConstructor`\
  \ 方法返回一个 `Constructor<T>` 对象。`Constructor` 类也已改为泛型，以便其 `newInstance` 方法具有正确的返回类型。\n\
  \n`java.lang.Class<T>` **1.0**\n\n*   `T newInstance()`\n    返回一个使用无参数构造函数构建的新实例。\n\
  *   `T cast(Object obj)`\n    如果 `obj` 为 `null` 或可以转换为类型 `T`，则返回 `obj`；否则抛出 `BadCastException`。\n\
  *   `T[] getEnumConstants()` **5**\n    如果 `T` 是枚举类型，则返回所有值的数组，否则返回 `null`。\n* \
  \  `Class<? super T> getSuperclass()`\n    返回此类的父类，如果 `T` 不是一个类或 `Object` 类，则返回\
  \ `null`。\n*   `Constructor<T> getConstructor(Class... parameterTypes)` **1.1**\n\
  *   `Constructor<T> getDeclaredConstructor(Class... parameterTypes)` **1.1**\n \
  \   获取公共构造函数，或具有给定参数类型的构造函数。\n\n`java.lang.reflect.Constructor<T>` **1.1**\n\n*\
  \   `T newInstance(Object... parameters)`\n    返回一个使用给定参数构建的新实例。\n\n### 8.9.2 使用\
  \ `Class<T>` 参数进行类型匹配\n\n在泛型方法中，匹配 `Class<T>` 参数的类型变量有时是有用的。这里有一个标准示例：\n\n点击此处查看代码图片\n\
  \n```\npublic static <T> Pair<T> makePair(Class<T> c) throws InstantiationException,\n\
  \      IllegalAccessException\n{\n   return new Pair<>(c.newInstance(), c.newInstance());\n\
  }\n```\n\n```\nmakePair(Employee.class)\n```\n\n那么 `Employee.class` 是类型 `Class<Employee>`\
  \ 的对象。`makePair` 方法的类型参数 `T` 匹配 `Employee`，编译器可以推断出方法返回一个 `Pair<Employee>`。\n\n\
  ### 8.9.3 虚拟机中的泛型类型信息\n\nJava 泛型的显著特征之一是虚拟机中泛型类型的擦除。令人惊讶的是，被擦除的类仍然保留了关于其泛型源的一些微弱记忆。例如，原始的\
  \ `Pair` 类知道它源自泛型类 `Pair<T>`，尽管类型为 `Pair` 的对象无法判断它是作为 `Pair<String>` 还是 `Pair<Employee>`\
  \ 构建的。\n\n同样，考虑一个方法：\n\n点击此处查看代码图片\n\n```\npublic static Comparable min(Comparable[]\
  \ a)\n```\n\n它是泛型方法的擦除形式：\n\n点击此处查看代码图片\n\n```\npublic static <T extends Comparable<?\
  \ super T>> T min(T[] a)\n```\n\n你可以使用反射 API 来确定：\n\n*   该泛型方法有一个名为 `T` 的类型参数；\n\
  *   该类型参数有一个子类型边界，其本身是一个泛型类型；\n*   边界类型有一个通配符参数；\n*   通配符参数有一个上类型边界；\n*   该泛型方法有一个泛型数组参数。\n\
  \n换句话说，你可以重构实现者声明的关于泛型类和方法的所有信息。然而，你不知道类型参数是如何针对特定对象或方法调。\n\n为了表示泛型类型声明，使用 `java.lang.reflect`\
  \ 包中的 `Type` 接口。该接口有以下子类型：\n\n*   `Class` 类，描述具体类型\n*   `TypeVariable` 接口，描述类型变量（如\
  \ `T extends Comparable<? super T>`）\n*   `WildcardType` 接口，描述通配符（如 `? super T`）\n\
  *   `ParameterizedType` 接口，描述泛型类或接口类型（如 `Comparable<? super T>`）\n*   `GenericArrayType`\
  \ 接口，描述泛型数组（如 `T[]`）\n\n图 8.5 显示了继承层次。注意最后四个子类型是接口——虚拟机实例化实现了这些接口的类。\n\n![Images](img/08fig05.jpg)\n\
  \n**图 8.5** `Type` 接口及其后代\n\n\n\n\n```java\npackage genericReflection;\n\nimport\
  \ java.lang.reflect.*;\nimport java.util.*;\n\n/**\n * @version 1.12 2021-05-30\n\
  \ * @author Cay Horstmann\n */\npublic class GenericReflectionTest\n{\n    public\
  \ static void main(String[] args)\n    {\n       // 从命令行参数或用户输入读取类名\n       String\
  \ name;\n       if (args.length > 0) name = args[0];\n       else\n       {\n  \
  \        try (var in = new Scanner(System.in))\n          {\n             System.out.println(\"\
  Enter class name (e.g., java.util.Collections): \");\n             name = in.next();\n\
  \          }\n       }\n\n       try\n       {\n          // 打印类和公共方法的泛型信息\n   \
  \       Class<?> cl = Class.forName(name);\n          printClass(cl);\n        \
  \  for (Method m : cl.getDeclaredMethods())\n             printMethod(m);\n    \
  \   }\n       catch (ClassNotFoundException e)\n       {\n          e.printStackTrace();\n\
  \       }\n    }\n\n    public static void printClass(Class<?> cl)\n    {\n    \
  \   System.out.print(cl);\n       printTypes(cl.getTypeParameters(), \"<\", \",\
  \ \", \">\", true);\n       Type sc = cl.getGenericSuperclass();\n       if (sc\
  \ != null)\n       {\n          System.out.print(\" extends \");\n          printType(sc,\
  \ false);\n       }\n       printTypes(cl.getGenericInterfaces(), \" implements\
  \ \", \", \", \"\", false);\n       System.out.println();\n    }\n\n    public static\
  \ void printMethod(Method m)\n    {\n       String name = m.getName();\n       System.out.print(Modifier.toString(m.getModifiers()));\n\
  \       System.out.print(\" \");\n       printTypes(m.getTypeParameters(), \"<\"\
  , \", \", \"> \", true);\n\n       printType(m.getGenericReturnType(), false);\n\
  \       System.out.print(\" \");\n       System.out.print(name);\n       System.out.print(\"\
  (\");\n       printTypes(m.getGenericParameterTypes(), \"\", \", \", \"\", false);\n\
  \       System.out.println(\")\");\n    }\n\n    public static void printTypes(Type[]\
  \ types, String pre, String sep, String suf,\n          boolean isDefinition)\n\
  \    {\n       if (pre.equals(\" extends \") && Arrays.equals(types, new Type[]\
  \ { Object.class }))\n          return;\n       if (types.length > 0) System.out.print(pre);\n\
  \       for (int i = 0; i < types.length; i++)\n       {\n          if (i > 0) System.out.print(sep);\n\
  \          printType(types[i], isDefinition);\n       }\n       if (types.length\
  \ > 0) System.out.print(suf);\n    }\n\n    public static void printType(Type type,\
  \ boolean isDefinition)\n    {\n       if (type instanceof Class t)\n       {\n\
  \          System.out.print(t.getName());\n       }\n       else if (type instanceof\
  \ TypeVariable t)\n       {\n          System.out.print(t.getName());\n        \
  \  if (isDefinition)\n             printTypes(t.getBounds(), \" extends \", \" &\
  \ \", \"\", false);\n       }\n       else if (type instanceof WildcardType t)\n\
  \       {\n          System.out.print(\"?\");\n          printTypes(t.getUpperBounds(),\
  \ \" extends \", \" & \", \"\", false);\n          printTypes(t.getLowerBounds(),\
  \ \" super \", \" & \", \"\", false);\n       }\n       else if (type instanceof\
  \ ParameterizedType t)\n       {\n         Type owner = t.getOwnerType();\n    \
  \     if (owner != null)\n         {\n            printType(owner, false);\n   \
  \         System.out.print(\".\");\n         }\n         printType(t.getRawType(),\
  \ false);\n         printTypes(t.getActualTypeArguments(), \"<\", \", \", \">\"\
  , false);\n       }\n       else if (type instanceof GenericArrayType t)\n     \
  \  {\n         System.out.print(\"\");\n         printType(t.getGenericComponentType(),\
  \ isDefinition);\n         System.out.print(\"[]\");\n      }\n   }\n}\n```\n\n\
  #### 8.9.4 类型字面量（Type Literals）\n\n有时，你希望根据值的类型来驱动程序的行为。例如，在持久化机制中，你可能希望用户指定保存对象的方式。这通常通过将\
  \ `Class` 对象与操作关联来实现。\n\n然而，对于泛型类，类型擦除（erasure）带来了问题。当 `ArrayList<Integer>` 和 `ArrayList<String>`\
  \ 都被擦除为相同的 `ArrayList` 类型时，你如何为它们提供不同的操作呢？\n\n有一种技巧可以在某些情况下缓解这个问题。你可以捕获在前节中遇到的 `Type`\
  \ 接口的实例。构造这样一个匿名子类：\n\n```java\nvar type = new TypeLiteral<ArrayList<Integer>>(){}\
  \ // 注意这里的 {}\n```\n\n`TypeLiteral` 构造函数捕获了泛型超类：\n\n```java\nclass TypeLiteral\n\
  {\n   public TypeLiteral()\n   {\n      Type parentType = getClass().getGenericSuperclass();\n\
  \      if (parentType instanceof ParameterizedType paramType)\n         type = paramType.getActualTypeArguments()[0];\n\
  \      else\n         throw new UnsupportedOperationException(\n            \"Construct\
  \ as new TypeLiteral<. . .>(){}\");\n   }\n   ...\n}\n```\n\n如果我们在运行时有一个可用的泛型，可以将其与\
  \ `TypeLiteral` 进行匹配。我们无法从对象获取泛型类型——它被擦除了。但正如你在前节中所看到的，字段和方法参数的泛型类型在虚拟机中得以保留。\n\n\
  如 CDI 和 Guice 等注入框架使用类型字面量来控制泛型类型的注入。书中配套代码中的示例程序展示了一个更简单的例子：给定一个对象，我们枚举其泛型类型可用的字段，并查找关联的格式化操作。\n\
  \n通过空格分隔值来格式化 `ArrayList<Integer>`，通过 `ArrayList<Character>` 则将字符连接成字符串。任何其他数组列表都通过\
  \ `ArrayList.toString()` 进行格式化。\n\n\n\n\n\n```java\npackage genericReflection;\n\
  \n/**\n *   @version 1.02 2021-05-30\n *   @author Cay Horstmann\n */\n\nimport\
  \ java.lang.reflect.*;\nimport java.util.*;\nimport java.util.function.*;\n\n/**\n\
  \ * 类型字面量（type literal）描述了一个可以是泛型的类型，例如\n * ArrayList<String>\n */\nclass TypeLiteral<T>\n\
  {\n    private Type type;\n\n    /**\n     * 此构造函数必须通过匿名子类调用，\n     * 如 new TypeLiteral<.\
  \ . .>(){}\n     */\n    public TypeLiteral()\n    {\n       Type parentType = getClass().getGenericSuperclass();\n\
  \       if (parentType instanceof ParameterizedType paramType)\n          type =\
  \ paramType.getActualTypeArguments()[0];\n       else\n          throw new UnsupportedOperationException(\n\
  \             \"请通过 new TypeLiteral<. . .>(){} 的方式构造\");\n    }\n\n    private TypeLiteral(Type\
  \ type)\n    {\n       this.type = type;\n    }\n\n    /**\n     * 返回一个描述给定类型的类型字面量。\n\
  \     */\n    public static TypeLiteral<?> of(Type type)\n    {\n       return new\
  \ TypeLiteral<Object>(type);\n    }\n\n    public String toString()\n    {\n   \
  \    if (type instanceof Class clazz) return clazz.getName();\n       else return\
  \ type.toString();\n    }\n\n    public boolean equals(Object otherObject)\n   \
  \ {\n       return otherObject instanceof TypeLiteral otherLiteral\n          &&\
  \ type.equals(otherLiteral.type);\n    }\n\n    public int hashCode()\n    {\n \
  \      return type.hashCode();\n    }\n}\n\n/**\n * 使用将类型与格式化函数关联的规则对对象进行格式化。\n\
  \ */\nclass Formatter\n{\n    private Map<TypeLiteral<?>, Function<?, String>> rules\
  \ = new HashMap<>();\n\n    /**\n     * 向此格式化器添加规则。\n     * @param type 规则应用的类型\n\
  \     * @param formatterForType 用于格式化该类型的函数\n     */\n    public <T> void forType(TypeLiteral<T>\
  \ type, Function<T, String> formatterForType)\n    {\n       rules.put(type, formatterForType);\n\
  \    }\n\n    /**\n     * 使用此格式化器的规则对对象的所有字段进行格式化。\n     * @param obj 对象\n     *\
  \ @return 包含所有字段名和格式化值的字符串\n     */\n    public String formatFields(Object obj)\n\
  \          throws IllegalArgumentException, IllegalAccessException\n    {\n    \
  \   var result = new StringBuilder();\n       for (Field f : obj.getClass().getDeclaredFields())\n\
  \       {\n          result.append(f.getName());\n          result.append(\"=\"\
  );\n          f.setAccessible(true);\n          Function<?, String> formatterForType\
  \ = rules.get(TypeLiteral.of(f.getGenericType()));\n          if (formatterForType\
  \ != null)\n          {\n             // formatterForType 的参数类型为 ?。无法向其 apply 方法传递参数。\n\
  \             // 强制转换将参数类型转换为 Object，以便我们可以调用。\n            @SuppressWarnings(\"\
  unchecked\")\n            Function<Object, String> objectFormatter\n           \
  \    = (Function<Object, String>) formatterForType;\n            result.append(objectFormatter.apply(f.get(obj)));\n\
  \         }\n         else\n            result.append(f.get(obj).toString());\n\
  \         result.append(\"\\n\");\n      }\n      return result.toString();\n  \
  \  }\n}\n\npublic class TypeLiterals\n{\n    public static class Sample\n    {\n\
  \       ArrayList<Integer> nums;\n       ArrayList<Character> chars;\n       ArrayList<String>\
  \ strings;\n       public Sample()\n       {\n          nums = new ArrayList<>();\n\
  \          nums.add(42); nums.add(1729);\n          chars = new ArrayList<>();\n\
  \          chars.add('H'); chars.add('i');\n          strings = new ArrayList<>();\n\
  \          strings.add(\"Hello\"); strings.add(\"World\");\n       }\n    }\n\n\
  \    private static <T> String join(String separator, ArrayList<T> elements)\n \
  \   {\n       var result = new StringBuilder();\n       for (T e : elements)\n \
  \      {\n          result.append(separator);\n          result.append(e);\n   \
  \    }\n       return result.toString();\n    }\n\n    public static void main(String[]\
  \ args) throws Exception\n    {\n       Sample s = new Sample();\n       System.out.println(join(\"\
  , \", s.nums));\n       System.out.println(join(\", \", s.chars));\n       System.out.println(join(\"\
  , \", s.strings));\n\n       TypeLiteral<ArrayList<Integer>> listType = new TypeLiteral<ArrayList<Integer>>(){};\n\
  \       System.out.println(listType.toString());\n       \n       TypeLiteral<ArrayList<Character>>\
  \ charType = new TypeLiteral<ArrayList<Character>>(){};\n       System.out.println(charType.toString());\n\
  \    }\n}\n```\n\n\n\n当你尝试以自然风格实现方法或关注性能时，你选择的数据结构会产生巨大影响。你是否需要对成千上万（甚至数百万）个排序后的项进行快速搜索？你是否需要在有序序列的中间快速插入和删除元素？你是否需要在键和值之间建立关联？\n\
  \n本章将展示 Java 库如何帮助你完成正式编程所需的传统数据结构。在大学的计算机科学课程中，一门名为 `Data Structures` 的课程通常需要一个学期才能完成，有很多书籍致力于这个重要主题。我们的涵盖与大学课程不同；我们将跳过理论，直接介绍如何使用标准库中的集合类。\n\
  \n## 9.1 Java 集合框架\n\nJava 的最初版本只为最常用的数据结构提供了一小部分类：`Vector`、`Stack`、`Hashtable`、`BitSet`\
  \ 以及 `Enumeration` 接口（后者提供了一种访问任意容器中元素的抽象机制）。这无疑是一个明智的选择——设计出一套全面的集合类库需要时间和和技巧。\n\
  \n随着 Java 1.2 的出现，设计者们认为是时候推出一套完整的数据结构了。他们面临着许多相互冲突的设计挑战。他们希望库既小又易于学习。他们不想要 C++\
  \ 标准模板库（或 `STL`）的复杂性，但他们想要 `STL` 所开创的“泛型算法”带来的益处。他们希望旧类能够适应新框架。正如所有集合库的设计者所做，他们必须做出一些艰难的抉，并在过程中产生了一许多独特的设计决策。在本节中，我们将探索\
  \ Java 集合框架的基本设计，演示如何使用它，并解释一些更具争议的功能背后的原理。\n\n### 9.1.1 分离集合接口与实现\n\n与现代数据结构库一样，Java\
  \ 集合库将 `interfaces`（接口）和 `implementations`（实现）分离。让我们通过熟悉的数据结构 `queue` 来观察这种分离。\n\
  \n`queue` 接口规定你可以在队列末尾添加元素，从头部删除元素，并查找队列中有多少元素。当你需要收集对象并按“先进先出”的方式检索它们时，就会使用 `queue`（参见图\
  \ 9.1）。\n\n![Images](img/09fig01.jpg)\n\n**图 9.1** 队列\n\n一个最小形式的 `queue` 接口可能如下：\n\
  \n点击此处查看代码图片\n\n```\npublic interface Queue<E> // 标准库中接口的简化形式\n{\n   void add(E\
  \ element);\n   E remove();\n   int size();\n}\n```\n\n该接口没有告诉你任何关于队列是如何实现的任何信息。在队列的两种常见实现中，一个使用“循环数组”，另一个使用链表（参见图\
  \ 9.2）。\n\n![Images](img/09fig02.jpg)\n\n**图 9.2** 队列的实现\n\n每个实现都可以由实现 `Queue` 接口的类来表示。\n\
  \n点击此处查看代码图片\n\n```\npublic class CircularArrayQueue<E> implements Queue<E> // 不是实际的库类\n\
  {\n   private int head;\n   private int tail;\n\n   CircularArrayQueue(int capacity)\
  \ { . . . }\n   public void add(E element) { . . . }\n   public E remove() { . .\
  \ . }\n   public int size() { . . . }\n   private E[] elements;\n}\npublic class\
  \ LinkedListQueue<E> implements Queue<E> // 不是实际的库类\n{\n   private Link head;\n\
  \   private Link tail;\n\n   LinkedListQueue() { . . . }\n   public void add(E element)\
  \ { . . . }\n   public E remove() { . . . }\n   public int size() { . . . }\n}\n\
  ```\n\n![Images](img/note.jpg) 备注\n\nJava 库实际上并没有名为 `CircularArrayQueue` 和 `LinkedListQueue`\
  \ 的类。我使用这些类作为示例来解释集合接口与实现之间概念上的区别。如果你需要循环数组队列，请使用 `ArrayDeque` 类。对于链表队列，只需使用 `LinkedList`\
  \ 类即可——它实现了 `Queue` 接口。\n\n当你在程序中使用队列时，一旦集合构建完成，你就不需要知道实际上使用的是哪种实现。因此，在构造集合对象时*仅*使用具体类是合理的。使用*接口类型*来持有集合引用。\n\
  \n点击此处查看代码图片\n\n```\nQueue<Customer> expressLane = new CircularArrayQueue<>(100);\n\
  expressLane.add(new Customer(\"Harry\"));\n```\n\n通过这种方法，如果你改变了主意，可以轻松地使用不同的实现。你只需要更改程序中的一处——构造函数调用处。如果你最终决定\
  \ `LinkedListQueue` 是更好的选择，你的代码变为：\n\n点击此处查看代码图片\n\n```\nQueue<Customer> expressLane\
  \ = new LinkedListQueue<>();\nexpressLane.add(new Customer(\"Harry\"));\n```\n\n\
  你为什么选择一种实现而不是另一种？接口对实现的效率一无未。。循环数组比链表稍微高效一些，因此通常是首选。然而，一如往常，这是有代价的。循环数组是*有界的*集合——它有有限的容量。如果你对程序将收集的对象数量没有上限，那么链表可能更好。当你学习\
  \ API 时，你会发现另一组以 `Abstract` 开头的类，例如 `AbstractQueue`。这些类是为库的实现者设计的。在（可能不太）你想实现自己的队列的情况下，扩展\
  \ `AbstractQueue` 比实现 `Queue` 接口的所有方法要容易得多。\n\n### 9.1.2 集合接口\n\nJava 库中集合类的基础接口是\
  \ `Collection` 接口。该接口有两个基本方法：\n\n点击此处查看代码图片\n\n```\npublic interface Collection<E>\n\
  {\n   boolean add(E element);\n   Iterator<E> iterator();\n   . . .\n}\n```\n\n\
  除了这两个之外还有几个方法；我们稍后会讨论它们。\n\n`add` 方法将元素添加到集合中。如果添加元素实际上更改了集合，`add` 方法返回 `true`；如果集合未更改，则返回\
  \ `false`。例如，如果你尝试向集合添加一个对象而该对象已经存在，则 `add` 请求将不起影响，因为集合拒绝重复。\n\n`iterator` 方法返回一个实现\
  \ `Iterator` 接口的对象。你可以使用迭代器对象逐个访问集合中的元素。我们将在下一节中讨论迭代器。\n\n### 9.1.3 迭代器\n\n`Iterator`\
  \ 接口有四个方法：\n\n点击此处查看代码图片\n\n```\npublic interface Iterator<E>\n{\n   E next();\n\
  \   boolean hasNext();\n   void remove();\n   default void forEachRemaining(Consumer<?\
  \ super E> action);\n}\n```\n\n通过反复调用 `next` 方法，你可以逐个访问集合中的元素。然而，当你到达集合末尾时，`next`\
  \ 方法会抛出 `NoSuchElementException`。因此，在调用 `next` 之前需要调用 `hasNext` 方法。如果迭代器对象还有更多元素待访问，该方法返回\
  \ `true`。如果你想检查集合中的所有元素，请求一个迭代器，并在 `hasNext` 返回 `true` 时继续调用 `next` 方法。例如：\n\n\n\
  \n\n\n点击此处查看代码图片\n\n```\nCollection<String> c = . . .;\nIterator<String> iter =\
  \ c.iterator();\nwhile (iter.hasNext())\n{\n   String element = iter.next();\n \
  \  do something with element\n}\n```\n\n你可以用“增强 for 循环”（for each loop）更简洁的方式编写这种循环：\n\
  \n点击此处查看代码图片\n\n```java\nfor (String element : c)\n{\n   do something with element\n\
  }\n```\n\n编译器会简单地将“增强 for 循环”翻译为带有迭代器的循环。\n\n“增强 for 循环”适用于实现了 `Iterable` 接口的对象，该接口包含一个抽象方法：\n\
  \n点击此处查看代码图片\n\n```java\npublic interface Iterable<E>\n{\n   Iterator<E> iterator();\n\
  \   . . .\n}\n```\n\n`Collection` 接口继承了 `Iterable` 接口。因此，你可以在标准库中的任何集合上使用“增强 for\
  \ 循环”。\n\n与其编写循环，不如调用 `forEachRemaining` 方法并传入一个消耗元素的 lambda 表达式。lambda 表达式会在迭代器的每个元素上被调用，直到没有剩余元素为止。\n\
  \n点击此处查看代码图片\n\n```java\niterator.forEachRemaining(element -> do something with\
  \ element);\n```\n\n元素的访问顺序取决于集合的类型。如果你遍历一个 `ArrayList`，迭代器从索引 `0` 开始，并在每一步中增加索引。然而，如果你访问\
  \ `HashSet` 中的元素，获取到的元素顺序本质上是随机的。你可以保证在迭代过程中会遇到集合中的所有元素，但你无法对它们的顺序做任何假设。这通常不是一个问题，因为对于计算总和或统计匹配数等计算来说，顺序并不重要。\n\
  \n![图片](img/note.jpg) 注意\n\n老手会注意到，`Iterator` 接口的 `next` 和 `hasNext` 方法的作用与 `Enumeration`\
  \ 接口的 `nextElement` 和 `hasMoreElements` 方法相同。Java 集合库的设计者本可以选择使用 `Enumeration` 接口。但他们不喜欢冗长的方法名，而是引入了一个具有更短方法名的新接口。\n\
  \nJava 集合库中的迭代器与其他库中的迭代器之间存在着重要的概念区别。在传统的集合库（如 C++ 的标准模板库）中，迭代器是模仿数组索引建模的。给定 true\
  \ 一个迭代器，你可以查找存储在该位置的元素，就像如果你有数组索引 `i`，就可以查找数组元素 `a[i]` 一样。无论查找结果，你都可以将迭代器移动到下一个位置。这与通过调用\
  \ `i++` 移动数组索引的操作相同，而不需要执行查找。然而，Java 迭代器并不是这样工作的的。查找和位置变化是紧密耦合的。查找元素的唯一方法是调用 `next`，而这种查找会移动位置。\n\
  \n相反，请将 Java 迭代器想象为位于*元素之间*。当你调用 `next` 时，迭代器会*跳过*下一个元素，并返回它刚刚经过的元素的引用（请参见图 9.3）。\n\
  \n![图片](img/note.jpg) 注意\n\n这里有另一个有用的类比。你可以将 `Iterator.next` 等同于 `InputStream.read`。从流中读取一个字节会自动“消耗”该字节。下一次调用\
  \ `read` 会消耗并返回输入流中的下一个字节。同样，重复调用 `next` 允许你读取集合中的所有元素。\n\n![图片](img/09fig03.jpg)\n\
  \n**图 9.3** 推进迭代器\n\n`Iterator` 接口的 `remove` 方法会移除由上一次 `next` 调用返回的元素。在很多情况下，这是合理的——你必须先看到元素，才能判断它是否是应该被移除的那个一个。但如果你想移除特定位置的元素，你仍然需要跳过该元素。例如，这里是移除字符串集合中第一个元素的方法：\n\
  \n点击此处查看代码图片\n\n```java\nIterator<String> it = c.iterator();\nit.next(); // 跳过第一个元素\n\
  it.remove(); // 现在移除它\n```\n\n更重要的是，`next` 方法和 `remove` 方法的调用之间存在依赖关系。如果在没有先调用 `next`\
  \ 的情况下调用 `remove` 是非法的。如果你尝试这样做，将抛出 `IllegalStateException`。\n\n如果你想移除两个相邻的元素，不能简单地调用：\n\
  \n```java\nit.remove();\nit.remove(); // 错误\n```\n\n相反，你必须首先调用 `next` 跳过要移除的元素。\n\
  \n```java\nit.remove();\nit.next();\nit.remove(); // OK\n```\n\n#### 9.1.4 泛型实用方法\n\
  \n`Collection` 和 `Iterator` 接口是泛型的，这意味着你可以编写操作任何类型集合的实用方法。例如，这里有一个泛型方法，用于测试任意集合是否包含给定元素：\n\
  \n点击此处查看代码图片\n\n```java\npublic static <E> boolean contains(Collection<E> c, Object\
  \ obj)\n{\n   for (E element : c)\n      if (element.equals(obj))\n            return\
  \ true;\n   return false;\n}\n```\n\nJava 库的设计者认为某些实用方法非常有用，以至于库应该提供它们。这样库用户就不需要重复发明轮子。`contains`\
  \ 方法就是其中一个方法。\n\n事实上，`Collection` 接口声明了一些实现类必须提供的方法。它们包括：\n\n点击此处查看代码图片\n\n```java\n\
  int size()\nboolean isEmpty()\nboolean contains(Object obj)\nboolean containsAll(Collection<?>\
  \ c)\nboolean equals(Object other)\nboolean addAll(Collection<? extends E> from)\n\
  boolean remove(Object obj)\nboolean removeAll(Collection<?> c)\nvoid clear()\nboolean\
  \ retainAll(Collection<?> c)\nObject[] toArray()\n```\n\n这些方法中的许多是自而易见的，可以在节最后的\
  \ API Notes 找到完整文档。\n\n当然，如果每个实现 `Collection` 接口的类都要提供这么多常规方法就很麻烦。为了方便实现者，库提供了一个\
  \ `AbstractCollection` 类，它将基础方法 `size` 和 `iterator` 设为抽象，但实现了这些常规方法。例如：\n\n点击此处查看代码图片\n\
  \n```java\npublic abstract class AbstractCollection<E>\n      implements Collection<E>\n\
  {\n   . . .\n   public abstract Iterator<E> iterator();\n\n   public boolean contains(Object\
  \ obj)\n   {\n      for (E element : this) // 调用 iterator()\n         if (element.equals(obj))\n\
  \            return true;\n      return false;\n   }\n   . . .\n}\n```\n\n具体的集合类现在可以继承\
  \ `AbstractCollection` 类。具体集合类负责提供 `iterator` 方法，但 `contains` 方法已经由父类 `AbstractCollection`\
  \ 处理。然而，如果子类有更高效的方法来实现 `contains`，它可以自由这样做。\n\n这种方法有点过时了。如果这些方法是 `Collection` 接口的默认方法会更好。这种情况还没有发生。但是，已经添加了几个默认方法。它们大多数与流有关（在第二卷中讨论）。此外，还有一个非常实用的方法\n\
  \n点击此处查看代码图片\n\n```java\ndefault boolean removeIf(Predicate<? super E> filter)\n\
  ```\n\n用于移除满足条件的元素。\n\n***java.util.Collection<E>*** 1.2\n\n*   `Iterator<E> iterator()`\n\
  \n    返回一个用于访问集合中元素的迭代器。\n\n*   `int size()`\n\n\n\n\n\n返回当前集合中存储的元素数量。\n\n* `boolean\
  \ isEmpty()`\n  如果此集合不包含任何元素，返回 `true`。\n\n* `boolean contains(Object obj)`\n  如果此集合包含与\
  \ `obj` 相等的对象，返回 `true`。\n\n* `boolean containsAll(Collection<?> other)`\n  如果此集合包含另一个集合中的所有元素，返回\
  \ `true`。\n\n* `boolean add(E element)`\n  向集合中添加一个元素。如果因为此调用导致集合发生了变化，则返回 `true`。\n\
  \n* `boolean addAll(Collection<? extends E> other)`\n  将另一个集合中的所有元素添加到此集合中。如果因为此调用导致集合发生了变化，返回\
  \ `true`。\n\n* `boolean remove(Object obj)`\n  从此集合中移除与 `obj` 相等的对象。如果删除了匹配的对象，则返回\
  \ `true`。\n\n* `boolean removeAll(Collection<?> other)`\n  从此集合中移除另一个集合中的所有元素。如果因为此调用导致集合发生了变化，返回\
  \ `true`。\n\n* `default boolean removeIf(Predicate<? super E> filter)` 8\n  移除所有\
  \ `filter` 返回 `true` 的元素。如果因为此调用导致集合发生了变化，返回 `true`。\n\n* `void clear()`\n  移除此集合中的所有元素。\n\
  \n* `boolean retainAll(Collection<?> other)`\n  移除此集合中不等于另一个集合中任何一个元素的元素。如果因为此调用导致集合发生了变化，返回\
  \ `true`。\n\n* `Object[] toArray()`\n  返回一个包含集合中对象的数组。\n\n* `<T> T[] toArray(IntFunction<T[]>\
  \ generator)` 11\n  返回一个包含集合中对象的数组。数组通过 `generator` 构建，该生成器通常是一个构造器表达式 `T[]::new`。\n\
  \n### java.util.Iterator<E> 1.2\n\n* `boolean hasNext()`\n  如果还有元素待访问，则返回 `true`。\n\
  \n* `E next()`\n  返回下一个要访问的对象。如果到达集合末尾，则抛出 `NoSuchElementException`。\n\n* `void\
  \ remove()`\n  移除上一次访问的对象。此方法必须紧跟在元素访问之后。如果集合自上一次元素访问以来被修改过，此方法将抛出 `IllegalStateException`。\n\
  \n* `default void forEachRemaining(Consumer<? super E> action)` 8\n  访问元素并将它们传递给指定的\
  \ action，直到没有剩余元素或 action 抛出异常。\n\n## 9.2 集合框架中的接口\n\nJava 集合框架为不同类型的集合定义了许多接口，见图\
  \ 9.4。\n\n![Images](img/09fig04.jpg)\n\n**图 9.4** 集合框架的接口\n\n集合有两个基本接口：`Collection`\
  \ 和 `Map`。正如你所所的，你使用一个方法向集合中插入元素：\n\n```\nboolean add(E element)\n```\n\n然而，map\
  \ 存储的是键值对，你使用 `put` 方法来插入它们：\n\n```\nV put(K key, V value)\n```\n\n要从集合中读取元素，请使用迭代器访问它们。然而，你可以使用\
  \ `get` 方法从 map 中读取值：\n\n```\nV get(K key)\n```\n\n`List` 是一个*有序集合*。元素被添加到容器的特定位置。元素可以通过两种方式访问：通过迭代器或通过整数索引。后者被称为*随机访问*，因为元素可以按任何顺序被访问。相比之下，使用迭代器时，必须按顺序访问它们。\n\
  \n`List` 接口定义了几个用于随机访问的方法：\n\n点击此处查看代码图片\n\n```\nvoid add(int index, E element)\n\
  void remove(int index)\nE get(int index)\nE set(int index, E element)\n```\n\n`ListIterator`\
  \ 接口是 `Iterator` 的子接口。它定义了一个在迭代器位置之前添加元素的方法：\n\n```\nvoid add(E element)\n```\n\n\
  坦率地说，集合框架的这方面设计设计得很糟糕。在实践中，有两种类型的有序集合，它们的性能权衡非常不同。由数组支持的有序集合具有快速随机访问的能力，使用整数索引的\
  \ `List` 方法是有意义的。相比之下，链表虽然也是有序的，但随机访问速度很慢，最好使用迭代器进行遍历。提供两个接口本是一件容易的事。\n\n![Images](img/note.jpg)\
  \ 注意\n\n为了避免对链表执行随机访问操作，Java 1.4 引入了一个标记接口 `RandomAccess`。该接口没有方法，但你可以用它来测试特定集合是否支持高效随机访问：\n\
  \n点击此处查看代码图片\n\n```\nif (c instanceof RandomAccess)\n{\n   使用随机访问算法\n}\nelse\n{\n\
  \   使用顺序访问算法\n}\n```\n\n`Set` 接口与 `Collection` 接口相同，但方法的行为定义得更紧密。集合的 `add` 方法应该拒绝重复项。集合的\
  \ `equals` 方法应该定义为：如果两个集合具有相同的元素，则它们是相同的，但顺序不一定相同。`hashCode` 方法应该定义为：使得两个具有相同元素的集合产生相同的哈希值。\n\
  \n如果方法签名相同，为什么要单独定义一个接口呢？从概念上讲，并不是所有集合都是集合。`Set` 接口允许程序员编写只接受集合的代码。\n\n`SortedSet`\
  \ 和 `SortedMap` 接口暴露了用于排序的比较器对象，并定义了获取集合子集的方法。我们在第 9.5 节 中讨论这些。\n\n最后，Java 6 引入了\
  \ `NavigableSet` 和 `NavigableMap` 接口，包含了用于排序集合和 map 的额外方法。（这些方法本应该包含在 `SortedSet`\
  \ 和 `SortedMap` 接口中。）`TreeSet` 和 `TreeMap` 类实现了这些接口。\n\n## 9.3 具体集合\n\n表 9.1 显示了\
  \ Java 库中的集合，并简要描述了每个集合类。（为了简单起见，我省略了将在第 12 章 中讨论的线程安全集合。）\n\n**表 9.1** Java 库中的具体集合\n\
  \n| 集合类型 |  | 章节 |\n| --- | --- | --- |\n| `ArrayList` | 动态伸缩的索引序列 | 523 |\n| `LinkedList`\
  \ | 允许在任何位置高效插入和删除的有序序列 | 512 |\n| `ArrayDeque` | 实现为循环数组的双端队列 | 532 |\n| `HashSet`\
  \ | 拒绝重复的无序集合 | 523 |\n| `TreeSet` | 有序集合 | 527 |\n| `EnumSet` | 枚举类型值的集合 | 545\
  \ |\n| `LinkedHashSet` | 记住元素插入顺序的集合 | 543 |\n| `PriorityQueue` | 允许高效移除最小元素的集合\
  \ | 533 |\n| `HashMap` | 存储键值关联的数据结构 | 542 |\n| `TreeMap` | 键排序的 map | 535 |\n|\
  \ `EnumMap` | 键属于枚举类型的 map | 545 |\n| `LinkedHashMap` | 记住条目添加顺序的 map | 543 |\n\
  | `WeakHashMap` | 值在其他地方没有使用时可以被垃圾回收回收的 map | 542 |\n| `IdentityHashMap` | 键通过 `=`\
  \ 比较的 map | 545 |\n\n\n\n\n\n表 9.1 中的所有类都实现了 `Collection` 接口，但以 `Map` 结尾的类除外。这些类实现的是\
  \ `Map` 接口。我们将在第 535 页的第 9.4 节“Maps”讨论映射。\n\n图 9.5 展示了这些类之间的关系。\n\n![Images](img/09fig05.jpg)\n\
  \n**图 9.5** 集合框架中的类\n\n### 9.3.1 链表\n\n我们在书中许多示例中已经使用了数组以及它们的动态亲戚 `ArrayList` 类。然而，数组和数组列表有一个主要的缺点。从数组中间删除元素是非常开销的，因为被删除元素之后的所有数组元素都必须向数组开头移动（参见图\
  \ 9.6）。在数组中间插入元素也是如此。\n\n![Images](img/09fig06.jpg)\n\n**图 9.6** 从数组中删除元素\n\n另一种著名数据结构——链表解决了这个问题。数组在连续的内存位置中存储对象引用，而链表将每个对象存储在独立的节点（link）中。每个节点还存储了指向序列中下一个节点的引用。在\
  \ Java 编程语言中，所有的链表实际上都是双向链表；也就是说，每个节点还存储了指向其前驱节点的引用（参见图 9.7）。\n\n![Images](img/09fig07.jpg)\n\
  \n**图 9.7** 双向链表\n\n从链表中间删除元素是一个低开销的操作——只需要更新被删除元素周围的节点即可（参见图 9.8）。\n\n![Images](img/09fig08.jpg)\n\
  \n**图 9.8** 从链表中删除元素\n\n也许你曾经上过数据结构课程，并在课程中学习了如何实现链表。你可能对在链表中添加或删除元素时理错复杂的节点关系有糟糕的回忆。如果是这样，你会高兴地发现，Java\
  \ 集合库提供了一个供你使用的 `LinkedList` 类。\n\n下面的代码示例添加了三个元素，然后删除了第二个：\n\n点击此处查看代码图像\n\n```\n\
  var staff = new LinkedList<String>();\nstaff.add(\"Amy\");\nstaff.add(\"Bob\");\n\
  staff.add(\"Carl\");\nIterator<String> iter = staff.iterator();\nString first =\
  \ iter.next(); // 访问第一个元素\nString second = iter.next(); // 访问第二个元素\niter.remove();\
  \ // 删除最后访问的元素\n```\n\n然而，链表和通用集合之间存在一个重要的区别。链表是一个有序集合，其中对象的位置很重要。`LinkedList.add`\
  \ 方法将对象添加到列表末尾。但你通常想在列表中间某处添加对象。这种依赖位置的 `add` 方法是由迭代器负责的，因为迭代器描述了集合中的位置。使用迭代器添加元素仅对于具有自然顺序的集合才有意义。例如，我们在下一节中讨论的集合（set）数据类型对其元素不进行排序。因此，`Iterator`\
  \ 接口中没有 `add` 方法。相反，集合库提供了一个子接口 `ListIterator`，它包含一个 `add` 方法：\n\n点击此处查看代码图像\n\n\
  ```\ninterface ListIterator<E> extends Iterator<E>\n{\n   void add(E element);\n\
  \   . . .\n}\n```\n\n与 `Collection.add` 不同，此方法不返回 `boolean`——假设 `add` 操作总是修改列表。\n\
  \n此外，`ListIterator` 接口有两个方法可以用于反向遍历列表。\n\n点击此处查看代码图像\n\n```\nE previous()\nboolean\
  \ hasPrevious()\n```\n\n与 `next` 方法一样，`previous` 方法返回它跳过的对象。\n\n`LinkedList` 类的\
  \ `listIterator` 方法返回一个实现 `ListIterator` 接口的迭代器对象。\n\n点击此处查看代码图像\n\n```\nListIterator<String>\
  \ iter = staff.listIterator();\n```\n\n`add` 方法在迭代器位置之前添加新元素。例如，下面的代码跳过了链表中的第一个元素，并在第二个元素之前添加\
  \ `\"Juliet\"`（参见图 9.9）：\n\n点击此处查看代码图像\n\n```\nvar staff = new LinkedList<String>();\n\
  staff.add(\"Amy\");\nstaff.add(\"Bob\");\nstaff.add(\"Carl\");\nListIterator<String>\
  \ iter = staff.listIterator();\niter.next(); // 跳过第一个元素\niter.add(\"Juliet\");\n\
  ```\n\n![Images](img/09fig09.jpg)\n\n**图 9.9** 向链表中添加元素\n\n\n\n\n并发修改检测是通过一种简单的方式实现的。集合会记录变异操作（如添加和删除元素）的数量。每个迭代器都会单独记录由该\
  \ `it` 负责的变异操作数量。在每个迭代器方法的开始处，迭代器简单地检查自身的变异计数是否与集合的计数相等。如果不相等，它将抛出一个 `ConcurrentModificationException`。\n\
  \n![Images](img/note.jpg) 备注\n\n然而，并发修改检测中有一个奇特的异常。链表只跟踪列表的`结构性`修改，例如添加和删除链接。`set`\
  \ 方法**不**被视为结构性修改。你可以为链表附加多个迭代器，并且所有这些迭代器都可以通过调用 `set` 方法来更改现有链接的内容。这种能力对于我们在本章稍后将讨论的\
  \ `Collections` 类中的许多算法是必不可少的。\n\n现在，你已经了解了 `LinkedList` 类的基本方法。使用 `ListIterator`\
  \ 可以双向遍历链链表的元素，并进行添加和删除操作。\n\n正如你在第 9.2 节中所示，第 508 页 的“集合框架中的接口”，许多其他操作链表的有用方法已在\
  \ `Collection` 接口中声明。这些方法大部分在 `LinkedList` 类的父类 `AbstractCollection` 中实现。例如，`toString`\
  \ 方法会调用所有元素的 `toString` 并生成一个格式为 `[A, B, C]` 的长字符串。这对于调试非常有用。使用 `contains` 方法可以检查元素是否存在于链表中。例如，如果调用\
  \ `staff.contains(\"Harry\")` 且链表已经包含一个与字符串 `\"Harry\"` 相等的字符串，则返回 `true`。\n\n该库还提供了一些从理论角度来看有些可疑的方法。链表不支持快速的随机访问。如果你想查看链表的第\
  \ `n` 个元素，你必须从开始处并跳过前 `n - 1` 个元素。没有捷径。由于这个原因，程序员通常不会在需要通过整数索引访问元素的情况下使用链表。\n\n\
  尽管如此，`LinkedList` 类仍提供了一个 `get` 方法，让你能够访问特定元素：\n\n点击此处查看代码图像\n\n```\nLinkedList<String>\
  \ list = . . .;\nString obj = list.get(n);\n```\n\n当然，这个方法并不高效。如果你发现自己在使用它，那么你可能为你的问题使用了错误的数据结构。\n\
  \n你**永远不要**使用这种幻幻的随机访问方法来遍历链表。以下代码\n\n点击此处查看代码图像\n\n```\nfor (int i = 0; i < list.size();\
  \ i++)\n   do something with list.get(i);\n```\n\n效率低得惊人。每当你查找另一个元素时，搜索都会从列表开始重新开始。`LinkedList`\
  \ 对象并没有尝试缓存位置信息。\n\n![Images](img/note.jpg) 备注\n\n`get` 方法有一个微小的优化：如果索引至少为 `size()\
  \ / 2`，则元素的搜索将从列表末尾开始。\n\n列表迭代器接口还有一个方法可以告诉你当前位置的索引。事实上，由于 Java 迭代器在概念上指向元素之间，因此它有两个这样的方法：`nextIndex`\
  \ 方法返回下一次调用 `next` 将返回元素的整数索引；`previousIndex` 方法返回下一次调用 `previous` 将返回元素的索引。当然，它仅仅比\
  \ `nextIndex` 小 1。这些方法非常高效——迭代器会维护其当前位置的计数。最后，如果你有一个整数索引 `n`，那么 `list.listIterator(n)`\
  \ 返回一个指向索引为 `n` 的元素之前的迭代器。也就是说，调用 `next` 产生的元素与 `list.get(n)` 相同；但获取该迭代器本身是低效的。\n\
  \n如果你有一个链表只有几个元素，你就不必过度担心 `get` 和 `set` 方法的代价。但既然如此，起初为什么要用链表呢？使用链表的唯一理由是最小化在列表中间插入和删除的代价。如果你只有几个元素，可以使用\
  \ `ArrayList`。\n\n我建议你直接避开所有使用整数索引来表示链表中位置的方法。如果你想对集合进行随机访问，请使用数组或 `ArrayList`，而不是链表。\n\
  \n代码列表 9.1 中的程序让链表发挥了作用。它只是创建了两个列表并将它们合并，然后从第二个列表中删除每第二个元素，最后测试了 `removeAll` 方法。我建议你跟踪程序流并特别关注迭代器。你可能会发现绘制迭代器位置的图很有帮助，如下：\n\
  \n```\n|ACE  |BDFG\nA|CE  |BDFG\nAB|CE B|DFG\n. . .\n```\n\n注意，调用\n\n```\nSystem.out.println(a);\n\
  ```\n\n通过调用 `toString` 打印链表 `a` 中的所有元素。\n\n**9.1** `LinkedListTest.java`\n\n点击此处查看代码图像\n\
  \n```java\npackage linkedList;\n\nimport java.util.*;\n\n/**\n * 此程序演示了链表的操作。\n\
  \ * @version 1\n * @author Cay\n */\npublic class LinkedListTest {\n    public static\
  \ void main(String[] args)\n    {\n        var a = new LinkedList<String>();\n \
  \       a.add(\"Amy\");\n        a.add(\"Carl\");\n        a.add(\"Frances\");\n\
  \n        var b = new LinkedList<String>();\n        b.add(\"Doug\");\n        b.add(\"\
  Gloria\");\n\n        // 将 b 中的单词合并到 a\n        ListIterator<String> aIter = a.listIterator();\n\
  \        Iterator<String> bIter = b.iterator();\n        while (bIter.hasNext())\n\
  \        {\n            if (aIter.hasNext()) aIter.next();\n            aIter.add(bIter.next());\n\
  \        }\n        System.out.println(a);\n\n        // 从 b 中删除每第二个单词\n       \
  \ bIter = b.iterator();\n        while (bIter.hasNext())\n        {\n          \
  \  bIter.next(); // 跳过一个元素\n            if (bIter.hasNext())\n            {\n  \
  \              bIter.next(); // 跳过下一个元素\n                bIter.remove(); // 删除该元素\n\
  \            }\n        }\n        System.out.println(b);\n\n        // 批量操作：从 a\
  \ 中移除 b 的所有单词\n        a.removeAll(b);\n        System.out.println(a);\n    }\n\
  }\n```\n\n**1.2** ***java.util.List<E>***\n\n*   `ListIterator<E> listIterator()`\n\
  \n    返回一个访问列表元素的迭代器。\n\n*   `ListIterator<E> listIterator(int index)`\n\n    返回一个访问列表元素的迭代器，其首次调用\
  \ `next` 将返回指定索引的元素。\n\n*   `void add(int i, E element)`\n\n    在指定位置添加元素。\n\n*\
  \   `void addAll(int i, Collection<? extends E> elements)`\n\n    在指定位置添加集合中的所有元素。\n\
  \n*   `E remove(int i)`\n\n    移除并返回指定位置的元素。\n\n*   `E get(int i)`\n\n    获取指定位置的元素。\n\
  \n*   `E set(int i, E element)`\n\n    用新元素替换指定位置的元素并返回旧元素。\n\n*   `int indexOf(Object\
  \ element)`\n\n    返回与指定元素相等的第一次出现的位置，如果没有找到匹配的元素则返回 -1。\n\n*   `int lastIndexOf(Object\
  \ element)`\n\n\n\n返回与指定元素相同的最后一个元素的位置，如果没有找到匹配的元素，则返回 `-1`。\n\n### `java.util.ListIterator<E>`\
  \ 1.2\n\n* `void add(E newElement)`\n    在当前位置之前添加一个元素。\n* `void set(E newElement)`\n\
