  44\n45        var southPanel = new JPanel();\n46\n47        var insertButton = new\
  \ JButton(\"Insert\");\n48        southPanel.add(insertButton);\n49        insertButton.addActionListener(event\
  \ ->\n50           textArea.append(\"User name: \" + textField.getText() + \" Password:\
