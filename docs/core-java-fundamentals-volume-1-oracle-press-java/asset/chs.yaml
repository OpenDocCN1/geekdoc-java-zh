  \ 使用反射编写泛型数组代码\n\n`java.lang.reflect` 包中的 `Array` 类允许你动态创建数组。这被用于例如 `Arrays` 类中\
  \ `copyOf` 方法的实现。回想一下该方法如何用于扩展一个已满的数组。\n\n点击此处查看代码图像\n\n`java.lang.reflect` 包中的\
  \ `Array` 类允许你动态创建数组。这被用于例如 `Arrays` 类中 `copyOf` 方法的实现。回想一下该方法如何用于扩展一个已满的数组。\n\n\
  点击此处查看代码图像\n\n```java\nObject newArray = Array.newInstance(componentType, newLength);\n\
  ```\n\n\n\n为了实际执行操作，我们需要获取新数组的长度和组件类型。\n\n我们通过调用 `Array.getLength(a)` 获取长度。要获取新数组的类型：\n\
  \n1.  首先，获取 `a` 的类对象。\n2.  确认它确实是一个数组。\n3.  使用 `Class` 类的 `getComponentType` 方法（该方法仅对表示数组的类对象定义）来找到数组的类型。\n\
  4.  相反，对于任何表示类 *C* 的 `Class` 对象，`arrayType` 方法会产生表示 *C*`[]` 的 `Class` 对象。\n\n为什么\
  \ `getLength` 是 `Array` 的方法而 `getComponentType` 是 `Class` 的方法？我不知道——反射方法的分布有时显得有些随意。\n\
  \n这里是代码：\n\n点击此处查看代码图像\n\n\n\n\n```\npublic static Object goodCopyOf(Object a, int\
  \ newLength)\n{\n   Class cl = a.getClass();\n   if (!cl.isArray()) return null;\n\
  \   Class componentType = cl.getComponentType();\n   int length = Array.getLength(a);\n\
  \   Object newArray = Array.newInstance(componentType, newLength);\n   System.arraycopy(a,\
  \ 0, newArray, 0, Math.min(length, newLength));\n   return newArray;\n}\n```\n\n\
  注意，这个 `copyOf` 方法可以用于扩展任何类型的数组，而不仅仅是对象数组。\n\n点击此处查看代码图像\n\n```java\nint[] a = {\
  \ 1, 2, 3, 4, 5 };\na = (int[]) goodCopyOf(a, 10);\n```\n\n为了实现这一点，`goodCopyOf`\
  \ 的参数被声明为 `Object` 类型，*而不是对象数组*（`Object[]`）。整数数组类型 `int[]` 可以转换为 `Object`，但不能转换为对象数组！\n\
