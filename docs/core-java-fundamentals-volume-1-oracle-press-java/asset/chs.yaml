  \nAWT 在 `low-level`（低级）和 `semantic`（语义）事件之间做了非常有用的区分。语义事件表达的是用户正在做什么，例如“点击那个按钮”；`ActionEvent`\
  \ 就是一个语义事件。低级事件是实现这些操作的事件。在点击按钮的情况下，这包括鼠标按下、一系列鼠标移动和鼠标抬起（但仅当鼠标抬起在按钮区域内时有效）。或者它也可能是按键触发，当用户使用\
  \ `Tab` 键选中按钮然后用空格键激活它时，就会发生这种情况。同样，调整滚动条是一个语义事件，但拖动鼠标是一个低级事件。\n\n以下是 `java.awt.event`\
  \ 包中通常用的语义事件类：\n\n*   `ActionEvent`（用于按钮点击、菜单选择、选择列表项，或在文本字段中输入回车键）\n*   `AdjustmentEvent`（用户调整了滚动条）\n\
  *   `ItemEvent`（用户从一组复选框或列表项中进行了选择）\n\n常用的还有以下五种低级事件类：\n\n*   `KeyEvent`（按键按下或释放）\n\
  *   `MouseEvent`（鼠标按钮按下、释放、移动或拖动）\n*   `MouseWheelEvent`（鼠标滚轮旋转）\n*   `FocusEvent`（组件获得焦点或失去焦点）\n\
  *   `WindowEvent`（窗口状态发生变化）\n\n表 10.4 显示了最重要的 AWT 监听接口、事件和事件源。\n\n#### 表 10.4 事件处理总结\n\
  \n| 接口 | 方法 | 参数/访问器 | 事件产生事件 |\n| --- | --- | --- | --- |\n| `ActionListener` |\
  \ `actionPerformed` | `ActionEvent`<br>``getActionCommand`<br>``getModifiers` |\
  \ `AbstractButton`, `JComboBox`, `JTextField`, `Timer` |\n| `AdjustmentListener`\
  \ | `adjustmentValueChanged` | `AdjustmentEvent`<br>``getAdjustable`<br>``getAdjustmentType`<br>``getValue`\
  \ | `JScrollbar` |\n| `ItemListener` | `itemStateChanged` | `ItemEvent`<br>``getItem`<br>``getItemSelectable`<br>``getStateChange`\
  \ | `AbstractButton`, `JComboBox` |\n| `FocusListener` | `focusGained`, `focusLost`\
  \ | `FocusEvent`<br>``isTemporary` | `Component` |\n| `KeyListener` | `keyPressed`,\
  \ `keyReleased`, `keyTyped` | `KeyEvent`<br>``getKeyChar`<br>``getKeyCode`<br>``getKeyModifiersText`<br>``getKeyText`<br>``isActionKey`\
  \ | `Component` |\n| `MouseListener` | `mousePressed`, `mouseReleased`, `mouseEntered`,\
  \ `mouseExited`, `mouseClicked` | `MouseEvent`<br>``getClickCount`<br>``getX`<br>``getY`<br>``getPoint`<br>``translatePoint`\
  \ | `Component` |\n| `MouseMotionListener` | `mouseDragged`, `mouseMoved` | `MouseEvent`\
  \ | `Component` |\n| `MouseWheelListener` | `mouseWheelMoved` | `MouseWheelEvent`<br>``getWheelRotation`<br>``getScrollAmount`\
  \ | `Component` |\n| `WindowListener` | `windowClosing`, `windowOpened`, `windowIconified`,\
  \ `windowDeiconified`, `windowClosed`, `windowActivated`, `windowDeactivated` |\
  \ `WindowEvent`<br>``getWindow` | `Window` |\n| `WindowFocusListener` | `windowGainedFocus`,\
  \ `windowLostFocus` | `WindowEvent`<br>``getOppositeWindow` | `Window` |\n| `WindowStateListener`\
  \ | `windowStateChanged` | `WindowEvent`<br>``getOldState`<br>``getNewState` | `Window`\
  \ |\n\n### 10.5 Preferences API\n\n我将通过对 `java.util.prefs` API 的讨论来结束本章。在桌面程序中，你通常希望存储用户偏好，例如用户最后处理的文件、上一个窗口位置等。\n\
  \n正如你在第 9 章 中所示的，`Properties` 类使得加载和保存程序的配置信息变得简单。然而，使用属性文件有以下缺点：\n\n*   某些操作系统没有主目录的概念，这使得很难为配置文件找到一个统一的位置。\n\
  *   配置文件的命名没有标准规范，增加了用户安装多个 Java 应用时发生名称冲突的概率。\n\n某些操作系统拥有配置信息的中央存储库。最广为人知的例子是 Microsoft\
  \ Windows 中的注册表。`Preferences` 类以跨平台的方式提供了这样一个中央存储库。在 Windows 中，`Preferences` 类使用注册表进行存储；而在\
  \ Linux 上，信息存储在本地文件系统中。当然，对于使用 `Preferences` 类的程序员来说，存储库的实现是透明的。\n\n`Preferences`\
  \ 存储库具有树结构，节点路径名称类似于 `/com/mycompany/myapp.`。与包名一样，只要程序员以反转的域名开头路径，就可以避免名称冲突。事实上，该\
  \ API 的设计者建议配置节点路径与你程序中的包名保持匹配。\n\n存储库中的每个节点都有一个独立的键/值对表，你可以用它来存储数字、字符串或字节数组。该 API\
  \ 未提供存储序列化对象的机制。API 设计者认为，序列化格式对于长期存储来说太脆弱了。\n\n\n\n\n`Preferences` 类为第二个问题提供了解决方案。你可以通过调用以下方法导出子树（或较少见的单个节点）的偏好：\n\
  \n点击此处查看代码图片\n\n```\nvoid exportSubtree(OutputStream out)\nvoid exportNode(OutputStream\
  \ out)\n```\n\n数据以 XML 格式保存。你可以通过调用以下方法将其导入到另一个仓库：\n\n点击此处查看代码图片\n\n```\nvoid importPreferences(InputStream\
  \ in)\n```\n\n这是一个示例文件：\n\n点击此处查看代码图片\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE preferences SYSTEM \"http://java.sun.com/dtd/preferences.dtd\"\
  >\n<preferences EXTERNAL_XML_VERSION=\"1.0\">\n   <root type=\"user\">\n      <map/>\n\
  \      <node name=\"com\">\n         <map/>\n         <node name=\"horstmann\">\n\
  \            <map/>\n            <node name=\"corejava\">\n               <map>\n\
  \            <entry key=\"height\" value=\"200.0\"/>\n            <entry key=\"\
  left\" value=\"1027.0\"/>\n            <entry key=\"filename\" value=\"/home/cay/books/cj11/code/v1ch11/raven.html\"\
  />\n            <entry key=\"top\" value=\"380.0\"/>\n            <entry key=\"\
