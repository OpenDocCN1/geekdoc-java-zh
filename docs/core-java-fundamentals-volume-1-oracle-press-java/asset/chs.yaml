  \n* `void addLayoutComponent(String name, Component comp)` 将组件添加到布局中。\n* `void removeLayoutComponent(Component\
  \ comp)` 从布局中移除组件。\n* `Dimension preferredLayoutSize(Container cont)` 返回该布局下容器的首选尺寸。\n\
  * `Dimension minimumLayoutSize(Container cont)` 返回该布局下容器的最小尺寸。\n* `void layoutContainer(Container\
  \ cont)` 布局容器中的组件。\n\n### 11.7 对话框\n\n在 GUI 中，我们通常希望弹出独立的对话框来向用户提供信息或从用户处获取信息。\n\
  \n\n\n\n\n与大多数窗口系统一样，AWT 区分了模态（`modal`）和非模态（`modeless`）对话框。模态对话框在用户处理之前不允许与应用程序的其余窗口进行交互。在继续执行之前需要用户信息时，请使用模态对话框。例如，当用户想要读取文件时，会弹出一个模态文件对话框。用户在程序开始读取操作之前必须指定文件名。只有用户关闭模态对话框后，应用程序才能继续。\n\
  \n非模态对话框允许用户在对话框和应用程序的其他部分输入信息。非模态对话框的一个例子是工具栏。工具栏可以一直留在那里，用户可以与应用程序窗口和工具栏进行交互。\n\
  \n让我们从简单的对话框开始本节——仅带有单个信息的模态对话框。Swing 有一个方便的 `JOptionPane` 类，让你无需编写任何特殊的对话框代码即可弹出简单的对话框。接下来，你将看到如何通过实现自己的对话窗口来编写更复杂的对话框。最后，你将看到如何将数据从应用程序传输到对话框并返回。\n\
  \n我们将通过查看 Swing 的 `JFileChooser` 来结束对对话框的讨论。\n\n### 11.7.1 选项对话框\n\nSwing 拥有一组现成的简单对话框，足以向用户询问单条信息。`JOptionPane`\
  \ 有四个静态方法来显示这些简单的对话框：\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `showMessageDialog` | 显示消息并等待用户点击\
  \ OK |\n| `showConfirmDialog` | 显示消息并获取确认（如 OK/Cancel） |\n| `showOptionDialog` |\
  \ 显示消息并从一组选项中获取用户选项 |\n| `showInputDialog` | 显示消息并获取一行用户输入 |\n\n图 11.30 显示了一个典型的对话框。如你所见，该对话框具有以下组件：\n\
  \n* 一个图标\n* 一条消息\n* 一个或多个选项按钮\n\n![Images](img/011fig30.jpg)\n\n**图 11.30** 选项对话框\n\
  \n输入对话框包含了一个用于用户输入的额外组件。这可以是一个用户可以在其中输入任意字符串的文本字段，也可以是一个用户可以从中选择一个项目的组合框。\n\n这些对话框的准确布局以及标准消息类型图标的选择取决于可插的外观（look-and-feel）。\n\
  \n左侧的图标取决于五种“消息类型”（`message types`）之一：\n\n```\nERROR_MESSAGE\nINFORMATION_MESSAGE\n\
  WARNING_MESSAGE\nQUESTION_MESSAGE\nPLAIN_MESSAGE\n```\n\n`PLAIN_MESSAGE` 类型没有图标。每种对话框类型都有一个方法让你提供自己的图标。\n\
  \n对于每种对话框类型，你可以指定消息。此消息可以是字符串、图标、用户界面组件或任何对象。以下是消息对象的显示方式：\n\n| 类型 | 显示 |\n| :---\
  \ | :--- |\n| `String` | 绘制字符串 |\n| `Icon` | 显示图标 |\n| `Component` | 显示组件 |\n| `Object[]`\
  \ | 显示数组中的所有对象，堆叠在一起 |\n| 任何其他对象 | 应用 `toString` 并显示生成的字符串 |\n\n当然，提供消息字符串是最常见的情况。提供\
  \ `Component` 赋予了你极大的灵活性，因为你可以让 `paintComponent` 方法绘制你想要的任何内容。\n\n底部的按钮取决于对话框类型和“选项类型”（`option\
  \ type`）。当调用 `showMessageDialog` 和 `showInputDialog` 时，你只会得到一组标准按钮（它们是 OK 和 OK/Cancel）。当调用\
  \ `showConfirmDialog` 时，你可以在四种选项类型中选择：\n\n```\nDEFAULT_OPTION\nYES_NO_OPTION\nYES_NO_CANCEL_OPTION\n\
  OK_CANCEL_OPTION\n```\n\n使用 `showOptionDialog` 可以指定任意选项集。你为选项提供一个对象数组。每个数组元素的渲染方式如下：\n\
  \n| 类型 | 渲染 |\n| :--- | :--- |\n| `String` | 创建以字符串为标签的按钮 |\n| `Icon` | 创建以图标为标签的按钮\
  \ |\n| `Component` | 显示组件 |\n| 任何其他对象 | 应用 `toString` 并创建一个以生成的字符串为标签的按钮 |\n\n这些函数的返回值如下：\n\
  \n| 方法 | 返回值 |\n| :--- | :--- |\n| `showMessageDialog` | 无 |\n| `showConfirmDialog`\
  \ | 代表所选选项的整数 |\n| `showOptionDialog` | 代表所选选项的整数 |\n| `showInputDialog` | 用户提供或选择的字符串\
  \ |\n\n`showConfirmDialog` 和 `showOptionDialog` 返回整数以指示用户选择了哪个按钮。对于选项对话框，这仅仅是所选选项的索引，如果用户关闭了对话框而不是选择选项，则返回\
  \ `CLOSED_OPTION`。对于确认对话框，返回值可以是以下内容之一：\n\n```\nOK_OPTION\nCANCEL_OPTION\nYES_OPTION\n\
  NO_OPTION\nCLOSED_OPTION\n```\n\n这听起来像是一组令人混乱的选择，但实践中非常简单。遵循以下步骤：\n\n1. 选择对话框类型（消息、确认、选项或输入）。\n\
  2. 选择图标（错误、信息、警告、问题、无或自定义）。\n3. 选择消息（字符串、图标、自定义组件或它们的堆叠）。\n4. 对于确认对话框，选择选项类型（默认、是/否、是/否/取消或确定/取消）。\n\
  5. 对于选项对话框，选择选项（字符串、图标、自定义组件）和默认值。\n6. 对于输入对话框，在文本字段和组合框之间选择。\n7. 在 `JOptionPane`\
  \ 中定位要调用的方法。\n\n\n\n\n\n*   `static int showInternalConfirmDialog(Component parent,\
  \ Object message, String title, int optionType)`\n*   `static int showInternalConfirmDialog(Component\
  \ parent, Object message)`\n    显示一个确认对话框或内部确认对话框。（内部对话框完全在所有所有者的框架内渲染）。返回用户选择的选项（`OK_OPTION`、`CANCEL_OPTION`、`YES_OPTION`、`NO_OPTION`\
  \ 之一），如果用户关闭了对话框则返回 `CLOSED_OPTION`。父组件可以为 `null`。显示在对话框上的消息可以是字符串、图标、组件或它们的数组。`messageType`\
  \ 参数为 `ERROR_MESSAGE`、`INFORMATION_MESSAGE`、`WARNING_MESSAGE`、`QUESTION_MESSAGE`、`PLAIN_MESSAGE`\
  \ 之一，`optionType` 为 `DEFAULT_OPTION`、`YES_NO_OPTION`、`YES_NO_CANCEL_OPTION`、`OK_CANCEL_OPTION`\
  \ 之一。\n\n*   `static int showOptionDialog(Component parent, Object message, String\
  \ title, int optionType, int messageType, Icon icon, Object[] options, Object default)`\n\
  *   `static int showInternalOptionDialog(Component parent, Object message, String\
  \ title, int optionType, messageType, Icon icon, Object[] options, Object default)`\n\
  \    显示一个选项对话框或内部选项对话框。（内部对话框完全在所有所有者的框架内渲染）。返回用户选择的选项索引，如果用户取消了对话框则返回 `CLOSED_OPTION`。父组件可以为\
  \ `null`。显示在对话框上的消息可以是字符串、图标、组件或它们的数组。`messageType` 参数为 `ERROR_MESSAGE`、`INFORMATION_MESSAGE`、`WARNING_MESSAGE`、`QUESTION_MESSAGE`、`PLAIN_MESSAGE`\
  \ 之一，`optionType` 为 `DEFAULT_OPTION`、`YES_NO_OPTION`、`YES_NO_CANCEL_OPTION`、`OK_CANCEL_OPTION`\
  \ 之一。`options` 参数是字符串、图标或组件的数组。\n\n*   `static Object showInputDialog(Component\
  \ parent, Object message, String title, int messageType, Icon icon, Object[] values,\
  \ Object default)`\n*   `static String showInputDialog(Component parent, Object\
  \ message, String title, int messageType)`\n*   `static String showInputDialog(Component\
  \ parent, Object message)`\n*   `static String showInputDialog(Object message)`\n\
  *   `static String showInputDialog(Component parent, Object message, Object default)`\
  \ 1.4\n*   `static String showInputDialog(Object message, Object default)` 1.4\n\
  *   `static Object showInternalInputDialog(Component parent, Object message, String\
  \ title, int messageType, Icon icon, Object[] values, Object default)`\n*   `static\
  \ String showInternalInputDialog(Component parent, Object message, String title,\
  \ int messageType)`\n*   `static String showInternalInputDialog(Component parent,\
  \ Object message)`\n    显示一个输入对话框或内部输入对话框。（内部对话框完全在所有所有者的框架内渲染）。返回用户输入的字符串，如果用户取消了对话框则返回\
  \ `null`。父组件可以为 `null`。显示在对话框上的消息可以是字符串、图标、组件或它们的数组。`messageType` 参数为 `ERROR_MESSAGE`、`INFORMATION_MESSAGE`、`WARNING_MESSAGE`、`QUESTION_MESSAGE`、`PLAIN_MESSAGE`\
  \ 之一。\n\n### 11.7.2 创建对话框\n\n在上一节中，你看到了如何使用 `JOptionPane` 类来显示简单的对话框。在本节中，你将看到如何手动创建这样一个对话框。\n\
  \n图 11.31 显示了一个典型的模态对话框——一个当用户点击“关于”（About）按钮时显示的程序信息框。\n\n![Images](img/011fig31.jpg)\n\
  \n**图 11.31** 一个“关于”对话框\n\n要实现一个对话框，你需要扩展 `JDialog` 类。这与为应用程序的主窗口扩展 `JFrame` 的过程本质相同。具体来说：\n\
  \n1.  在你的对话框构造函数中，调用父类 `JDialog` 的构造函数。\n2.  添加对话框的用户界面组件。\n3.  添加事件处理器。\n4.  设置对话框的大小。\n\
  \n当你调用父类构造函数时，你需要提供*所有者框架**owner frame*）、对话框标题和*模态性**modality*）。\n\n所有者框架控制对话框显示的位置。你可以提供\
  \ `null` 作为所有者；此时对话框将由隐藏的框架所有。\n\n模态性指定了对话框显示时应用程序的哪些其他窗口被阻塞。非模态对话框（modeless）不阻塞其他窗口。模态对话框（modal）阻塞应用程序的所有其他窗口（对话框的子窗口除外）。对于用户可以随时访问的工具箱可以使用非模态对话框。而如果你想强制用户在继续之前提供必需的信息，可以使用模态对话框。\n\
  \n这里是对话框的代码：\n\n点击此处查看代码图像\n\n```java\npublic AboutDialog extends JDialog\n{\n \
  \  public AboutDialog(JFrame owner)\n   {\n      super(owner, \"About DialogTest\"\
  , true);\n      add(new JLabel(\n         \"<html><h1><i>Core Java</i></h1><hr>By\
  \ Cay Horstmann</html>\"),\n         BorderLayout.CENTER);\n      var panel = new\
  \ JPanel();\n      var ok = new JButton(\"OK\");\n\n      ok.addActionListener(event\
  \ -> setVisible(false));\n      panel.add(ok);\n      add(panel, BorderLayout.SOUTH);\n\
  \      setSize(250, 150);\n   }\n}\n```\n\n如你所示，构造函数添加了用户界面元素——在本例中是标签和按钮。它为按钮添加了处理器并设置了对话框的大小。\n\
  \n要显示对话框，创建一个对话框对象并使其可见：\n\n点击此处查看代码图像\n\n```java\nvar dialog = new AboutDialog(this);\n\
  dialog.setVisible(true);\n```\n\n实际上，在下面的示例代码中，我们只创建一次对话框，每次用户点击“关于”按钮时都可以使用它。\n\
  \n点击此处查看代码图像\n\n```java\nif (dialog == null) // 首次\n   dialog = new AboutDialog(this);\n\
  dialog.setVisible(true);\n```\n\n当用户点击 OK 按钮时，对话框应该关闭。这在 OK 按钮的事件处理器中处理：\n\n点击此处查看代码图像\n\
  \n```java\nok.addActionListener(event -> setVisible(false));\n```\n\n当用户通过点击关闭关闭对话框时，对话框也会被隐藏。就像\
  \ `JFrame` 一样，你可以通过 `setDefaultCloseOperation` 方法覆盖此行为。\n\n列表 11.11 是测试程序的框架类的代码。列表\
  \ 11.12 显示了对话框类。\n\n**列表 11.11** `dialog/DialogFrame.java`\n\n点击此处查看代码图像\n\n\n\n\
  \n\n```java\npackage dialog;\n\nimport javax.swing.JFrame;\nimport javax.swing.JMenu;\n\
  import javax.swing.JMenuBar;\nimport javax.swing.JMenuItem;\n\n/**\n * 一个带有菜单的框架，其\
  \ File->About 操作会显示对话框。\n */\npublic class DialogFrame extends JFrame\n{\n    private\
  \ static final int DEFAULT_WIDTH = 300;\n    private static final int DEFAULT_HEIGHT\
  \ = 200;\n    private AboutDialog dialog;\n\n    public DialogFrame()\n    {\n \
  \       setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n        // 构建一个 File 菜单\n\n \
  \       var menuBar = new JMenuBar();\n        setJMenuBar(menuBar);\n        var\
  \ fileMenu = new JMenu(\"File\");\n        menuBar.add(fileMenu);\n\n        //\
  \ 添加 About 和 Exit 菜单项\n\n        // About 项显示 About 对话框\n\n        var aboutItem\
  \ = new JMenuItem(\"About\");\n        aboutItem.addActionListener(event ->\n  \
  \         {\n              if (dialog == null) // 第一次\n                 dialog =\
  \ new AboutDialog(DialogFrame.this);\n              dialog.setVisible(true); //\
  \ 弹出对话框\n           });\n        fileMenu.add(aboutItem);\n\n        // Exit 项退出程序\n\
  \n        var exitItem = new JMenuItem(\"Exit\");\n        exitItem.addActionListener(event\
  \ -> System.exit(0));\n        fileMenu.add(exitItem);\n    }\n}\n```\n\n**Listing\
  \ 11.12** `dialog/AboutDialog.java`\n\n点击此处查看代码图片\n\n```java\npackage dialog;\n\n\
  import java.awt.BorderLayout;\n\nimport javax.swing.JButton;\nimport javax.swing.JDialog;\n\
  import javax.swing.JFrame;\nimport javax.swing.JLabel;\nimport javax.swing.JPanel;\n\
  \n/**\n * 示例模态对话框，用于显示一条消息并等待用户点击 OK 按钮。\n */\npublic class AboutDialog extends\
  \ JDialog\n{\n    public AboutDialog(JFrame owner)\n    {\n        super(owner,\
  \ \"About DialogTest\", true);\n\n        // 添加 HTML 标签并居中\n\n        add(\n   \
  \        new JLabel(\n              \"<html><h1><i>Core Java</i></h1><hr>By Cay\
  \ Horstmann</html>\"),\n           BorderLayout.CENTER);\n\n        // OK 按钮关闭对话框\n\
  \n        var ok = new JButton(\"OK\");\n        ok.addActionListener(event -> setVisible(false));\n\
  \n        // 将 OK 按钮添加到南部\n\n        var panel = new JPanel();\n        panel.add(ok);\n\
  \        add(panel, BorderLayout.SOUTH);\n\n        pack();\n    }\n}\n```\n\n**`javax.swing.JDialog`**\
  \ **1.2**\n\n*   `public JDialog(Frame parent, String title, boolean modal)`\n\n\
  \    构造一个对话框。在显式显示之前，该对话框是不可见的。\n\n### 11.7.3 数据交换\n\n弹出对话框最常见的原因是从用户处获取信息。你已经看到创建一个对话框对象是多么简单了：\n\
  \n给它初始数据并调用 `setVisible(true)` 来在屏幕上显示对话框。现在，让我们看看如何在对话框中进出数据。\n\n考虑图 11.32 中的对话框，它可以用于获取用户名和密码以连接到某些在线服务。\n\
  \n![Images](img/011fig32.jpg)\n\n**图 11.32** 密码对话框\n\n你的对话框应该提供设置默认数据的方法。例如，示例程序中的\
  \ `PasswordChooser` 类有一个方法 `setUser`，用于将默认值置入后续字段：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ void setUser(User u)\n{\n   username.setText(u.getName());\n}\n```\n\n一旦你设置了默认值（如果需要），通过调用\
  \ `setVisible(true)` 显示对话框。此时对话框将显示出来。\n\n随后用户填写信息并点击 OK 或 Cancel 按钮。这两个按钮的事件处理程序都会调用\
  \ `setVisible(false)`，这会终止对 `setVisible(true)` 的调用。或者，用户也可以关闭对话框。如果你没有为对话框安装窗口监听器，则会应用默认的窗口关闭操作：对话框变为不可见，这也会终止对\
  \ `setVisible(true)` 的调用。\n\n重要的问题是，对 `setVisible(true)` 的调用会阻塞，直到用户关闭了对话框。\n\n\n\
  \n\n\n```java\npackage dataExchange;\n\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import javax.swing.*;\n\n/**\n * 一个带有菜单的框架，其 File->Connect 动作会显示密码对话框。\n */\npublic\
  \ class DataExchangeFrame extends JFrame\n{\n    public static final int TEXT_ROWS\
  \ = 20;\n    public static final int TEXT_COLUMNS = 40;\n    private PasswordChooser\
  \ dialog = null;\n    private JTextArea textArea;\n\n    public DataExchangeFrame()\n\
  \    {\n        // 构建一个 File 菜单\n        var mbar = new JMenuBar();\n        setJMenuBar(mbar);\n\
  \        var fileMenu = new JMenu(\"File\");\n        mbar.add(fileMenu);\n\n  \
  \      // 添加 Connect 和 Exit 菜单项\n        var connectItem = new JMenuItem(\"Connect\"\
  );\n        connectItem.addActionListener(new ConnectAction());\n        fileMenu.add(connectItem);\n\
  \n        // Exit 项会退出程序\n        var exitItem = new JMenuItem(\"Exit\");\n    \
  \    exitItem.addActionListener(event -> System.exit(0));\n        fileMenu.add(exitItem);\n\
  \n        textArea = new JTextArea(TEXT_ROWS, TEXT_COLUMNS);\n        add(new JScrollPane(textArea),\
  \ BorderLayout.CENTER);\n        pack();\n    }\n\n    /**\n     * Connect 动作弹出密码对话框。\n\
  \     */\n    private class ConnectAction implements ActionListener\n    {\n   \
  \     public void actionPerformed(ActionEvent event)\n        {\n            //\
  \ 如果是第一次，构建对话框\n            if (dialog == null) dialog = new PasswordChooser();\n\
  \n            // 设置默认值\n            dialog.setUser(new User(\"yourname\", null));\n\
  \n            // 弹出对话框\n            if (dialog.showDialog(DataExchangeFrame.this,\
  \ \"Connect\"))\n            {\n                // 如果接受，获取用户输入\n               \
  \ User u = dialog.getUser();\n                textArea.append(\"user name = \" +\
  \ u.getName() + \", password = \"\n                + (new String(u.getPassword()))\
  \ + \"\\n\");\n            }\n        }\n    }\n}\n```\n\n**列表 11.14** `dataExchange/PasswordChooser.java`\n\
  \n点击此处查看代码图片\n\n```java\npackage dataExchange;\n\nimport java.awt.BorderLayout;\n\
  import java.awt.Component;\nimport java.awt.Frame;\nimport java.awt.GridLayout;\n\
  \nimport javax.swing.JButton;\nimport javax.swing.JDialog;\nimport javax.swing.JLabel;\n\
  import javax.swing.JPanel;\nimport javax.swing.JPasswordField;\nimport javax.swing.JTextField;\n\
  import javax.swing.SwingUtilities;\n\n/**\n * 一个在对话框内部显示的选择器。\n */\npublic class\
  \ PasswordChooser extends JPanel\n{\n    private JTextField username;\n    private\
  \ JPasswordField password;\n    private JButton okButton;\n    private boolean ok;\n\
  \    private JDialog dialog;\n\n    public PasswordChooser()\n    {\n        setLayout(new\
  \ BorderLayout());\n\n        // 构建一个包含用户名和密码字段的面板\n        var panel = new JPanel();\n\
  \        panel.setLayout(new GridLayout(2, 2));\n        panel.add(new JLabel(\"\
  User name:\"));\n        panel.add(username = new JTextField());\n        panel.add(new\
  \ JLabel(\"Password:\"));\n        panel.add(password = new JPasswordField());\n\
  \        add(panel, BorderLayout.CENTER);\n\n        // 创建用于退出的 Ok 和 Cancel 按钮\n\
  \        okButton = new JButton(\"Ok\");\n        okButton.addActionListener(event\
  \ ->\n        {\n            ok = true;\n            dialog.setVisible(false);\n\
  \        });\n\n        var cancelButton = new JButton(\"Cancel\");\n        cancelButton.addActionListener(event\
  \ -> dialog.setVisible(false));\n\n        // 将按钮添加到南部边界\n        var buttonPanel\
  \ = new JPanel();\n        buttonPanel.add(okButton);\n        buttonPanel.add(cancelButton);\n\
  \        add(buttonPanel, BorderLayout.SOUTH);\n    }\n\n    /**\n     * 设置对话框默认值。\n\
  \     * @param u 默认用户信息\n     */\n    public void setUser(User u)\n    {\n     \
  \   username.setText(u.getName());\n    }\n\n    /**\n     * 获取对话框条目。\n     * @return\
  \ 一个状态代表对话框条目的 User 对象\n     */\n    public User getUser()\n    {\n        return\
  \ new User(username.getText(), password.getPassword());\n    }\n\n    /**\n    \
  \ * 在对话框中显示选择器面板\n     * @param parent 所有者框架中的组件或 null\n     * @param title 对话框窗口\n\
  \     */\n    public boolean showDialog(Component parent, String title)\n    {\n\
  \        ok = false;\n\n        // 定位所有者框架\n        Frame owner = null;\n      \
  \  if (parent instanceof Frame)\n            owner = (Frame) parent;\n        else\n\
  \            owner = (Frame) SwingUtilities.getAncestorOfClass(Frame.class, parent);\n\
  \n        // 如果是第一次，或者所有者已更改，则创建新对话框\n        if (dialog == null || dialog.getOwner()\
  \ != owner)\n        {\n            dialog = new JDialog(owner, true);\n       \
  \     dialog.add(this);\n            dialog.getRootPane().setDefaultButton(okButton);\n\
  \            dialog.pack();\n        }\n\n        // 设置标题并显示对话框\n        dialog.setTitle(title);\n\
  \        dialog.setVisible(true);\n        return ok;\n    }\n}\n```\n\n`javax.swing.SwingUtilities`\
  \ 1.2\n- `Container getAncestorOfClass(Class c, Component comp)` 返回属于给定类或其子类的内层父容器。\n\
  \n`javax.swing.JComponent` 1.2\n- `RootPane getRootPane()` 获取封装此组件的根面板，如果组件没有根面板则返回\
  \ `null`。\n\n`javax.swing.JRootPane` 1.2\n- `void setDefaultButton(JButton button)`\
  \ 设置根面板的默认按钮。要禁用默认按钮，可以使用 `null` 参数调用此方法。\n\n`javax.swing.JButton` 1.2\n- `boolean\
  \ isDefaultButton()` 如果此按钮是根面板的默认按钮则返回 `true`。\n\n#### 11.7.4 文件对话框\n\n在应用程序中，你通常希望能够打开和保存文件。显示文件并允许用户浏览系统的良好的对话框很难编写，你绝对不想重复造轮子。幸运的是，Swing\
  \ 提供了一个 `JFileChooser` 类，允许你显示与原生应用程序类似的文件对话框。`JFileChooser` 对话框总是模态的。注意 `JFileChooser`\
  \ 类并不是 `JDialog` 的子类。与其调用 `setVisible(true)`，不如调用 `showOpenDialog` 显示打开文件的对话框，或者调用\
  \ `showSaveDialog` 显示保存文件的对话框。接受文件的按钮将分别标记为“Open”或“Save”。你也可以通过 `showDialog` 方法提供自己的按钮标签。图\
  \ 11.33 显示了选择器对话框的示例。\n\n**图 11.33** 文件选择器对话框\n\n以下是弹出文件对话框并获取用户选择步骤：\n\n1.  创建一个\
  \ `JFileChooser` 对象。与 `JDialog` 类的构造函数不同，你不需要父组件。这允许你在多个框架之间复用文件选择器对话框。\n\n    例如：\n\
  \n    点击此处查看代码图片\n\n    ```\n    var chooser = new JFileChooser();\n    ```\n\n\
  \    提示 复用文件选择器对象是一个好主意，因为其构造函数可能非常慢，特别是当 Windows 用户拥有许多映射的网络驱动器时。\n\n2.  通过调用 `setCurrentDirectory`\
  \ 方法设置目录。\n\n    例如，使用当前工作目录\n\n\n\n\n\n点击此处查看代码图片\n\n```\nchooser.setCurrentDirectory(new\
  \ File(\".\"));\n```\n\n你需要提供一个 `File` 对象。`File` 对象在第二卷的第 2 章 中有详细解释。你现在只需要知道，构造函数\
  \ `File(String filename)` 会将文件名或目录名转换为 `File` 对象。\n\n3. 如果你有一个期望用户选择的默认文件名，请使用 `setSelectedFile`\
  \ 方法提供它：\n\n点击此处查看代码图片\n\n```\nchooser.setSelectedFile(new File(filename));\n```\n\
  \n4.  要让使用户能够在对话框中选择多个文件，请调用 `setMultiSelectionEnabled` 方法。当然，这完全是可选的，而且并不常见。\n\n\
  点击此处查看代码图片\n\n```\nchooser.setMultiSelectionEnabled(true);\n```\n\n5.  如果你想限制对话框中显示的文件类型为特定类型（例如，所有扩展名为\
  \ `.gif` 的文件），你需要设置一个`file filter`。我们将在本节稍后的部分讨论文件过滤器。\n\n6.  默认情况下，用户使用文件选择器只能选择文件。如果你想让用户选择目录，请使用\
  \ `setFileSelectionMode` 方法。调用时可以传入 `JFileChooser.FILES_ONLY`（默认值）、`JFileChooser.DIRECTORIES_ONLY`\
  \ 或 `JFileChooser.FILES_AND_DIRECTORIES`。\n\n7.  通过调用 `showOpenDialog` 或 `showSaveDialog`\
  \ 方法显示对话框。在这些调用中，你必须提供父组件：\n\n点击此处查看代码图片\n\n```\nint result = chooser.showOpenDialog(parent);\n\
  ```\n\n或者\n\n点击此处查看代码图片\n\n```\nint result = chooser.showSaveDialog(parent);\n```\n\
  \n这些调用之间唯一区别是“确认按钮”的标签——即用户点击以完成文件选择的按钮。你也可以调用 `showDialog` 方法并为确认按钮传递显式的文本：\n\n\
  点击此处查看代码图片\n\n```\nint result = chooser.showDialog(parent, \"Select\");\n```\n\n\
  只有当用户确认、取消或关闭文件对话框后，这些调用才会返回。返回值为 `JFileChooser.APPROVE_OPTION`、`JFileChooser.CANCEL_OPTION`\
  \ 或 `JFileChooser.ERROR_OPTION`。\n\n8.  使用 `getSelectedFile()` 或 `getSelectedFiles()`\
  \ 方法获取选定的文件或多个文件。这些方法返回单个 `File` 对象或一个 `File` 对象的数组。如果你只需要文件对象的名称，请调用它的 `getPath`\
  \ 方法。例如：\n\n点击此处查看代码图片\n\n```\nString filename = chooser.getSelectedFile().getPath();\n\
  ```\n\n在大多数情况下，这些步骤都是简单的。使用文件对话框的主要困难在于指定用户应该从中选择的文件子集。例如，假设用户应该选择一个 GIF 图像文件。那么，文件选择器应该只显示扩展名为\
  \ `.gif` 的文件。它还应该给用户某种反馈，说明显示的文件属于特定类别，例如“GIF Images”。但情况可能会更复杂。如果用户应该选择一个 JPEG\
  \ 图像文件，扩展名可以是 `.jpg` 或 `.jpeg`。为了不通过编码来处理这些复杂性，文件选择器的设计者提供了一种更优雅的机制：要限制显示的文件，请提供一个扩展抽象类\
  \ `javax.swing.filechooser.FileFilter` 的对象。文件选择器将每个文件传递给文件过滤器，并只显示过滤器接受的文件。\n\n\
  在编写本文时，提供了两个这样的子类：接受所有文件的默认过滤器，以及一个接受具有给定扩展名的所有文件的过滤器。然而，编写临时（ad-hoc）文件过滤器非常简单。只需实现\
  \ `FileFilter` 父类的两个抽象方法即可：\n\n点击此处查看代码图片\n\n```\npublic boolean accept(File f);\n\
  public String getDescription();\n```\n\n第一个方法测试文件是否应该被接受。第二个方法返回文件类型的描述，该描述可以显示在文件选择器对话框中。\n\
  \n![Images](img/note.jpg) 注意\n\n`java.io` 包中有一个无关的 `FileFilter` 接口，它有一个方法 `boolean\
  \ accept(File f)`。它被用于 `File` 类的 `listFiles` 方法，以列出目录中的文件。我不知道为什么 Swing 的设计者没有扩展这个接口——也许\
  \ Java 类库现在已经变得如此复杂，以至于 Sun 的程序员也不再了解所有的标准类和接口了。\n\n如果你同时导入了 `java.io` 和 `javax.swing.filechooser`\
  \ 包，你需要解决这两个同名类型之间的命名冲突。最简单的解决办法是导入 `javax.swing.filechooser.FileFilter`，而不是 `javax.swing.filechooser.*`。\n\
  \n一旦你有了文件过滤器对象，请使用 `JFileChooser` 类的 `setFileFilter` 方法将其安装到文件选择器对象中：\n\n点击此处查看代码图片\n\
  \n```\nchooser.setFileFilter(new FileNameExtensionFilter(\"Image files\", \"gif\"\
  , \"jpg\"));\n```\n\n你可以通过调用方法为文件选择器安装多个过滤器：\n\n点击此处查看代码图片\n\n```\nchooser.addChoosableFileFilter(filter1);\n\
  chooser.addChoosableFileFilter(filter2);\n. . .\n```\n\n用户从文件对话框底部的组合框中选择过滤器。默认情况下，“所有文件”过滤器始终出现在组合框中。这是一个好主意——以防你的程序用户需要选择具有非标准扩展名的文件。然而，如果你想抑制“所有文件”过滤器，请调用：\n\
  \n点击此处查看代码图片\n\n```\nchooser.setAllFilterUsed(false)\n```\n\n![Images](img/caution.jpg)\
  \ 注意\n\n如果你复用同一个文件选择器来加载和保存文件类型，请调用：\n\n点击此处查看代码图片\n\n```\nchooser.resetChoosableFilters()\n\
  ```\n\n在添加新过滤器之前清除旧过滤器。\n\n最后，你可以通过为文件选择器显示的每个文件提供特殊图标和文件描述来自定义文件选择器。通过提供一个扩展 `javax.swing.filechooser`\
  \ 包中 `FileView` 类的对象来实现。这绝对是一项高级技术。通常情况下，你不需要提供文件视图——可插件外观（pluggable look-and-feel）会为你提供。但如果你想为特殊文件类型显示不同的图标，你可以安装自己的文件视图。你需要扩展\
  \ `FileView` 类并实现五个方法：\n\n```\nIcon getIcon(File f)\nString getName(File f)\nString\
  \ getDescription(File f)\nString getTypeDescription(File f)\nBoolean isTraversable(File\
  \ f)\n```\n\n然后，使用 `setFileView` 方法将文件视图安装到文件选择器中。\n\n文件选择器会对其想要显示的每个文件或目录调用你的方法。如果你的方法在图标、名称或描述上返回\
  \ `null`，则文件选择器会查询外观的默认文件视图。这是好事，因为你只需要处理你想要做不同处理的文件类型即可。\n\n\n\n\n\n文件选择器通过调用 `isTraversable`\
  \ 方法来决定在用户点击目录时是否打开它。请注意，此方法返回的是一个 `Boolean` 对象，而不是 `boolean` 值！这看起来很诡异，但实际上非常方便——如果你不打算偏离默认的文件视图，只需返回\
  \ `null` 即可。此时文件选择器会咨询默认的文件视图。换句话说，该方法返回一个 `Boolean` 让你在三个选项之间进行选择：`true` (`Boolean.TRUE`)、`false`\
  \ (`Boolean.FALSE`) 或不关心（`null`）。\n\n示例程序包含一个简单的文件视图类。每当文件匹配文件过滤器时，该类就会显示特定的图标。我们使用它为所有图像文件显示调色板图标。\n\
  \n点击此处查看代码图片\n\n```java\nclass FileIconView extends FileView\n{\n   private FileFilter\
  \ filter;\n   private Icon icon;\n\n   public FileIconView(FileFilter aFilter, Icon\
  \ anIcon)\n   {\n      filter = aFilter;\n      icon = anIcon;\n   }\n\n   public\
  \ Icon getIcon(File f)\n   {\n      if (!f.isDirectory() && filter.accept(f))\n\
  \         return icon;\n      else return null;\n   }\n}\n```\n\n使用 `setFileView`\
  \ 方法将此文件视图安装到你的文件选择器中：\n\n点击此处查看代码图片\n\n```java\nchooser.setFileView(new FileIconView(filter,\n\
  \   new ImageIcon(\"palette.gif\")));\n```\n\n文件选择器随后将在所有通过 `filter` 的文件旁边显示调色板图标，并使用默认文件视图显示所有其他文件。当然，我们使用了与在文件选择器中设置相同的过滤器。\n\
  \n最后，你可以通过添加一个*附件*（accessory）组件来自定义文件对话框。例如，图 11.34 显示了文件列表旁预览附件。该附件显示当前所选文件的缩略视图。\n\
  \n![Images](img/011fig34.jpg)\n\n**图 11.34** 带有预览附件的文件对话框\n\n附件可以是任何 Swing 组件。在我们的案例中，我们扩展了\
  \ `JLabel` 类并将其图标设置为图形图像的缩放副本：\n\n点击此处查看代码图片\n\n```java\nclass ImagePreviewer extends\
  \ JLabel\n{\n   public ImagePreviewer(JFileChooser chooser)\n   {\n      setPreferredSize(new\
  \ Dimension(100, 100));\n      setBorder(BorderFactory.createEtchedBorder());\n\
  \   }\n\n   public void loadImage(File f)\n   {\n      var icon = new ImageIcon(f.getPath());\n\
  \      if(icon.getIconWidth() > getWidth())\n         icon = new ImageIcon(icon.getImage().getScaledInstance(\n\
  \            getWidth(), -1, Image.SCALE_DEFAULT));\n      setIcon(icon);\n    \
  \  repaint();\n   }\n}\n```\n\n这里只有一个挑战。我们希望在用户每次选择不同的文件时更新预览图像。文件选择器使用“JavaBeans”机制，在其任何一个属性发生变化时通知感兴趣的监听器。选中的文件是一个属性，你可以通过安装\
  \ `PropertyChangeListener` 来监控它。以下是拦截通知所需的代码：\n\n点击此处查看代码图片\n\n```java\nchooser.addPropertyChangeListener(event\
  \ ->\n   {\n      if (event.getPropertyName() == JFileChooser.SELECTED_FILE_CHANGED_PROPERTY)\n\
  \      {\n         var newFile = (File) event.getNewValue();\n         // update\
  \ 附件\n         . . .\n      }\n   });\n```\n\n### `javax.swing.JFileChooser` 1.2\n\
  \n*   `JFileChooser()`\n    创建一个可以用于多个帧的文件选择器对话框。\n\n*   `void setCurrentDirectory(File\
  \ dir)`\n    设置文件对话框的初始目录。\n\n*   `void setSelectedFile(File file)`\n\n*   `void\
  \ setSelectedFiles(File[] file)`\n    设置文件对话框的默认选择。\n\n*   `void setMultiSelectionEnabled(boolean\
  \ b)`\n    设置或清除多选模式。\n\n*   `void setFileSelectionMode(int mode)`\n    允许用户仅选择文件（默认）、仅选择目录或同时选择文件和目录。`mode`\
  \ 参数是 `JFileChooser.FILES_ONLY`、`JFileChooser.DIRECTORIES_ONLY` 和 `JFileChooser.FILES_AND_DIRECTORIES`\
  \ 其中之一。\n\n*   `int showOpenDialog(Component parent)`\n\n*   `int showSaveDialog(Component\
  \ parent)`\n\n*   `int showDialog(Component parent, String approveButtonText)`\n\
  \    显示对话框，其中确认按钮标记为“打开”、“保存”或 `approveButtonText` 字符串。返回 `APPROVE_OPTION`、`CANCEL_OPTION`（如果用户选择了取消按钮或关闭了对话框）或\
