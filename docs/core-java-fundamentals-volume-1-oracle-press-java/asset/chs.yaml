  \n*   `void setFileView(FileView view)`\n    设置用于提供文件选择器信息的视图。\n\n*   `void setAccessory(JComponent\
  \ component)`\n    设置附件组件。\n\n### `javax.swing.filechooser.FileFilter` 1.2\n\n*\
  \   `boolean accept(File f)`\n    如果文件选择器应显示此文件则返回 `true`。\n\n*   `String getDescription()`\n\
  \    返回过滤器的描述——例如 `(*.gif,*jpeg)`。\n\n### `javax.swing.filechooser.FileNameFilter`\
  \ 6\n\n*   `FileNameFilter(String description, String... extensions)`\n    根据描述构造文件过滤器，接受所有以点加扩展名字符串结尾的文件。\n\
  \n### `javax.swing.filechooser.FileView` 1.2\n\n*   `String getName(File f)`\n \
  \   返回文件 `f` 的名称，或 `null`。通常情况下，此方法返回 `f.getName()`。\n\n*   `String getDescription(File\
  \ f)`\n    返回文件 `f` 的可读描述，或 `null`。例如，如果 `f` 是 HTML 文档，此方法可能会返回其标题。\n\n*   `String\
  \ getTypeDescription(File f)`\n    返回文件 `f` 类型的可读描述，或 `null`。例如，如果 `f` 是 HTML 文档，此方法可能会返回\
  \ `Hypertext document`。\n\n*   `Icon getIcon(File f)`\n    返回文件 `f` 的图标，或 `null`。例如，如果\
  \ `f` 是 JPEG 文件，此方法可能会返回缩略图。\n\n*   `Boolean isTraversable(File f)`\n    如果 `f`\
  \ 是用户可以打开的目录则返回 `Boolean.TRUE`。如果目录在概念上是复合文档，此方法可能会返回 `Boolean.FALSE`。\n\n\n\n\n\
  你可能熟悉 `multitasking`（多任务处理）——即操作系统允许多个程序似乎在同一时间运行的能力。例如，你可以在编辑或下载电子邮件的同时进行打印。如今，你可能拥有一台带有多个\
  \ CPU 的计算机，但并发执行的进程数量并不限于 CPU 的数量。操作系统为每个进程分配 CPU 时间片，从而产生并行活动的错觉。\n\n多线程程序通过将这一思想进一步下沉扩展了多任务概念：单个程序似乎可以同时执行多个任务。每个任务都在一个\
  \ `thread`（线程）中执行，它是控制线程（thread of control）的缩写。能够同时运行多个线程的程序被称为 `multithreaded`（多线程）。\n\
  \n那么，多个 `processes`（进程）和多个 `threads`（线程）的区别是什么？本质区别在于每个进程都有自己的一套完整变量，而线程则共享相同的数据。这听起来有些危险，而且确实如此，正如你将在在本章稍后部分看到的。然而，共享变量使得线程之间的通信比进程间通信更高效、更容易编程。此外，在某些操作系统上，线程比进程更“轻量级”——创建和销毁单个线程的开销比启动新进程要小。\n\
  \n多线程在实践中极其有用。例如，浏览器应该能够同时下载多图像。Web 服务器需要能够处理并发请求。图形用户界面（GUI）程序有一个单独的线程从宿主机操作系统环境中收集用户界面事件。本章将向你展示如何为\
  \ Java 程序添加多线程能力。\n\n预警：并发编程可能会变得非常复杂。在本章中，我涵盖了应用程序程序员可能需要的所有工具。然而，对于更复杂的系统级编程，我建议你查阅更高级的参考，例如\
  \ Brian Goetz 等人编写的 `Java Concurrency in Practice`（Addison-Wesley Professional,\
  \ 2006）。\n\n## 12.1 什么是线程？\n\n让我们从一个使用两个线程的简单程序开始。这个程序在银行账户之间转移资金。我们使用了一个 `Bank`\
  \ 类，它存储指定数量账户的余额。`transfer` 方法将金额从一个账户转移到另一个账户。实现细节请参阅 Listing 12.2。\n\n在第一个线程中，我们将资金从账户\
  \ 0 转移到账户 1。第二个线程将资金从账户 2 转移到账户 3。\n\n以下是在单独线程中运行任务的简单步骤：\n\n1.  将任务代码放入实现 `Runnable`\
  \ 接口的类的 `run` 方法中。该接口非常简单，仅有一个方法：\n\n```\npublic interface Runnable\n{\n   void\
  \ run();\n}\n```\n\n由于 `Runnable` 是一个函数式接口，你可以使用 lambda 表达式创建一个实例：\n\n```\nRunnable\
  \ r = () ->\n   {\n      task code\n   };\n```\n\n2.  从 `Runnable` 构造一个 `Thread`\
  \ 对象：\n\n```\nvar t = new Thread(r);\n```\n\n3.  启动线程：\n\n```\nt.start();\n```\n\
