  67 {\n68    public static void main(String[] args)\n69    {\n70       JSONObject\
  \ obj = new JSONObject();\n71       obj.put(\"name\", new JSONString(\"Harry\"));\n\
  72       obj.put(\"salary\", new JSONNumber(90000));\n73       obj.put(\"married\"\
  , JSONBoolean.FALSE);\n74       JSONArray arr = new JSONArray();\n75       arr.add(new\
  \ JSONNumber(13));\n76       arr.add(JSONNull.INSTANCE);\n77\n78       obj.put(\"\
  luckyNumbers\", arr);\n79       System.out.println(obj);\n80       System.out.println(obj.type());\n\
  81    }\n82 }\n```\n\n## 5.9 反射\n\n`reflection library` 为你提供非常丰富且精密的工具集，用于编写动态操作\
  \ Java 代码的程序。通过反射，Java 可以支持用户界面生成器、对象关系映射器以及许多其他动态查询类能力的开发工具。\n\n能够分析类能力的程序被称为 `reflective`（反射的）。反射机制非常强大。正如后续章节所示，你可以用它来：\n\
  \n* 在运行时分析类的能力\n* 在运行时检查对象——例如，编写一个适用于所有类的单一 `toString` 方法\n* 实现泛型数组操作代码\n* 利用像\
  \ C++ 等语言中的函数指针一样可以工作的 `Method` 对象\n\n反射是一个强大且复杂的机制；然而，它主要对工具构建者感兴趣，而不是应用程序程序员。如果你对编写应用程序感兴趣，而不是为其他\
  \ Java 程序员编写工具的工具，你可以安全地跳过本章的剩余部分，稍后再回来。\n\n### 5.9.1 `Class` 类\n\n在程序运行期间，Java\
  \ 运行时系统始终对所有对象维护所谓的`运行时类型识别`（runtime type identification）。这些信息跟踪了每个对象所属的类。运行时类型信息被虚拟机用于选择执行正确的方法。\n\
  \n然而，你也可以通过操作一个特殊的 Java 类来访问这些信息。持有这些信息的类有点误导地命名为 `Class`。`Object` 类中的 `getClass()`\
  \ 方法返回一个 `Class` 类型的实例。\n\n```\nEmployee e;\n. . .\nClass cl = e.getClass();\n```\n\
  \n就像 `Employee` 对象描述特定员工的属性一样，`Class` 对象描述特定类的属性。`Class` 最常用的方法可能可能是 `getName`。它返回类的名称。例如，该语句\n\
  \n点击此处查看代码图像\n\n```\nSystem.out.println(e.getClass().getName() + \" \" + e.getName());\n\
  ```\n\n将打印：\n\n```\nEmployee Harry Hacker\n```\n\n如果 `e` 是一个员工，或者打印：\n\n```\nManager\
  \ Harry Hacker\n```\n\n如果 `e` 是一个经理。\n\n如果类在包中，则包名是类名的一部分：\n\n点击此处查看代码图像\n\n```\n\
  var generator = new Random();\nClass cl = generator.getClass();\nString name = cl.getName();\
  \ // name 被 设置为 \"java.util.Random\"\n```\n\n你可以通过静态方法 `forName` 获取与类名对应的 `Class`\
  \ 对象。\n\n点击此处查看代码图像\n\n```\nString className = \"java.util.Random\";\nClass cl =\
  \ Class.forName(className);\n```\n\n如果类名存储在运行时变化的字符串中，请使用此方法。如果 `className` 是类或接口名，则此方法有效。否则，`forName`\
  \ 方法会抛出检查异常（checked exception）。参见第 5.9.2 节“异常声明初原理”，位于第 283 页，了解每当你使用此方法时如何提供*异常处理器*（exception\
  \ handler）。\n\n获取 `Class` 类型对象的第三种方法是一种方便的简写。如果 `T` 是任何 Java 类型（或 `void` 关键字），那么\
  \ `T.class` 就是匹配的类对象。例如：\n\n点击此处查看代码图像\n\n```\nClass cl1 = Random.class; // 如果导入了\
  \ java.util.*;\nClass cl2 = int.class;\nClass cl3 = Double[].class;\n```\n\n注意，`Class`\
  \ 对象实际上描述的是一个 `type`（类型），它可能是类也可能不是类。例如，`int` 不是一个类，但 `int.class` 尽管是一个 `Class`\
  \ 类型的对象。\n\n![Images](img/note.jpg) 注意\n\n`Class` 类实际上是一个泛型类。例如，`Employee.class`\
  \ 的类型是 `Class<Employee>`。我没有纠结这个问题，因为这会使一个已经抽象的概念更加复杂。对于大多数实际用途，你可以忽略类型参数并处理原始 `Class`\
  \ 类型。有关此问题的更多信息请参见第 8 章。\n\n![Images](img/caution.jpg) 警告\n\n由于历史原因，`getName` 方法为数组类型返回一些奇奇怪的名字：\n\
  \n\n\n\n\n* `Double[].class.getName()` 返回 `\"[Ljava.lang.Double;\"`。\n* `int[].class.getName()`\
  \ 返回 `\"I\"`。\n\n虚拟机为每种类型管理一个唯一的 `Class` 对象。因此，你可以使用 `==` 运算符来比较类对象。例如：\n\n[点击此处查看代码图片\n\
  \n```\nif (e.getClass() == Employee.class) . . .\n```\n\n如果 `e` 是 `Employee` 的实例，则该测试通过。与条件\
  \ `e instanceof Employee` 不同的是，如果 `e` 是子类（如 `Manager`）的实例，则该测试将失败。\n\n如果你有一个 `Class`\
  \ 类型的对象，可以使用它来构造该类的实例。调用 `getConstructor` 方法获取一个 `Constructor` 类型的对象，然后使用 `newInstance`\
  \ 方法构造一个实例。例如：\n\n点击此处查看代码图片\n\n```\nvar className = \"java.util.Random\"; // 或任何其他带有\n\
  \                                    // 无参数构造函数的类名\nClass cl = Class.forName(className);\n\
  Object obj = cl.getConstructor().newInstance();\n```\n\n如果该类没有无参数构造函数，`getConstructor`\
  \ 方法将抛出异常。你将在第 5.9.7 节“调用任意方法和构造函数”的第 304 页看到如何调用其他构造函数。\n\n![Images](img/note.jpg)\
  \ 注意\n\n有一个已弃用的 `Class.toInstance` 方法，它同样无参数构造函数构造实例。然而，如果构造函数抛出了受检异常，该异常将在不经过检查的情况下重新抛出。这违反了异常的编译时检查。相比之下，`Constructor.newInstance`\
  \ 将任何构造器异常封装在 `InvocationTargetException` 中。\n\n![Images](img/cnote.jpg) C++ 注意\n\
  \n`newInstance` 方法对应于 C++ 中的*虚构造函数*（virtual constructor）惯用法。然而，C++ 中的虚构造函数并不是语言特性，而是一种需要由特殊库支持的惯用法。`Class`\
  \ 类类似于 C++ 中的 `type_info` 类，而 `getClass` 方法等同于 `typeid` 运算符。不过，Java 的 `Class` 比\
  \ `type_info` 要通用得多。C++ 的 `type_info` 只能显示类型名称的字符串，无法创建该类型的新对象。\n\n### `java.lang.Class`\
  \ 1.0\n\n* `static Class forName(String className)`\n  返回代表名为 `className` 的类的 `Class`\
  \ 对象。\n* `Constructor getConstructor(Class... parameterTypes)` 1.1\n  产生一个描述给定参数类型的构造器的对象。有关如何提供参数类型，请参阅第\
  \ 5.9.7 节“调用任意方法和构造函数”的第 304 页。\n\n### `java.lang.reflect.Constructor` 1.1\n\n*\
  \ `Object newInstance(Object... params)`\n  构造构造器声明类的的新实例，并将 `params` 传递给构造器。有关如何提供参数，请参阅第\
  \ 5.9.7 节“调用任意方法和构造函数”的第 304 页。\n\n### `java.lang.Throwable` 1.0\n\n* `void printStackTrace()`\n\
  \  将 `Throwable` 对象和堆栈轨迹打印到标准错误流。\n\n### 5.9.2 异常声明入门\n\n我将在第 7 章 中详细介绍异常处理，但在此期间，你偶尔会遇到可能会抛出异常的方法。\n\
  \n当运行时发生错误时，程序可以“抛出异常”。抛出异常比终止程序更灵活，因为你可以提供一个*处理器*（handler）来“捕获”异常并处理它。\n\n如果你不提供处理器，程序将终止并在控制台上打印一条消息，给出异常的类型。你可能在不小心使用\
  \ `null` 引用或越数组边界时已经见过异常报告了。\n\n异常有两种类型：*未检异常*（unchecked exceptions）和*受检异常*（checked\
  \ exceptions）。对于受检异常，编译器会检查你（程序员）是否意识到了该异常并准备好处理后果。然而，许多常见异常（例如边界错误或访问 `null` 引用）是未检的。编译器并不期望你提供处理器——毕竟，你应该将精力花在避免这些错误上，而不是为它们编写处理器。\n\
  \n但并非所有错误都是可以避免的。如果尽管你尽了努力仍可能发生异常，那么大多数 Java API 将抛出受检异常。一个例子是 `Class.forName` 方法。你无法确保给定名称的类存在。在第\
  \ 7 章中，你将看到如何捕获异常。\n\n```java\npublic static void doSomething(String name) throws\
  \ ReflectiveException\n{\n   Class cl = Class.forName(name); // 可能抛出异常\n   do something\
  \ with cl\n}\n```\n\n### 5.9.3 资源\n\n类通常关联数据文件，例如：\n* 图像声音文件\n* 包含消息字符串和按钮标签的文件\n\
  \n在 Java 中，这样的关联文件被称为*资源*（resource）。\n\n例如，考虑一个显示如图 5.4 所示消息的对话框。\n\n![Images](img/05fig04.jpg)\n\
  **图 5.4** 显示图像和文本资源\n\n当然，面板中的书和版权年份将会更改。为了方便跟踪更改，我们将文本放在文件中，而不是将其硬编码为字符串。\n\n但你应该将\
  \ `about.txt` 等文件放在哪里呢？当然，将其放在 JAR 文件中与其他程序文件一起会很方便。\n\n`Class` 类提供了定位资源文件的有用服务。以下是必要的步骤：\n\
  \n1. 获取拥有资源的类的 `Class` 对象——例如 `ResourceTest.class`。\n2. 某些方法（例如 `ImageIcon` 类的 `getImage`\
  \ 方法）接受描述资源位置的 URL。然后调用\n\n点击此处查看代码图片\n\n```\nURL url = cl.getResource(\"about.gif\"\
  );\n```\n3. 否则，使用 `getResourceAsStream` 方法获取读取文件的输入流。\n\n关键在于，Java 虚拟机知道如何定位类，因此它随后可以在*相同位置*搜索关联资源。例如，假设\
  \ `ResourceTest` 类位于 `resources` 包中。那么 `ResourceTest.class` 文件位于 `resources` 目录，你也将图标文件放在同一个目录下。\n\
  \n与其将资源文件放在与类文件相同的目录下，你可以提供相对路径或绝对路径，例如\n\n```\ndata/about.txt\n/corejava/title.txt\n\
  ```\n\n\n\n\n自动加载文件就是资源加载功能所做的。并没有标准的方法来解释资源文件的内容。每个程序必须有自己的方式来解释其资源文件。\n\n资源的另一个常见应用是程序的国际化。依赖于语言的字符串（例如消息和用户界面标签）存储在资源文件中，每种语言一个文件。第二卷第\
  \ 7 章 讨论的 `internationalization API` 提供了一种用于组织和访问这些本地化文件的标准方法。\n\nListing 5.13 是一个演示资源加载的程序。（不用担心读取文本和显示对话框的代码——我们稍后会介绍这些细节。）编译、构建\
  \ JAR 文件并执行它：\n\n点击此处查看代码图像\n\n```\njavac resource/ResourceTest.java\njar cvfe ResourceTest.jar\
  \ resources.ResourceTest \\\n   resources/*.class resources/*.gif resources/data/*.txt\
  \ corejava/*.txt\njava -jar ResourceTest.jar\n```\n\n将 JAR 文件移动到不同的目录并再次运行，以检查程序是否是从\
  \ JAR 文件而不是从当前目录读取资源文件的。\n\n**代码列表 5.14** `resources/ResourceTest.java`\n\n点击此处查看代码图像\n\
  \n```\n 1 package resources;\n 2\n 3 import java.io.*;\n 4 import java.net.*;\n\
  \ 5 import java.nio.charset.*;\n 6 import javax.swing.*;\n 7\n 8 /**\n 9  * @version\
  \ 1.5 2018-03-15\n10  * @author Cay Horstmann\n11  */\n12 public class ResourceTest\n\
  13 {\n14    public static void main(String[] args) throws IOException\n15    {\n\
  16       Class cl = ResourceTest.class;\n17       URL aboutURL = cl.getResource(\"\
  about.gif\");\n18       var icon = new ImageIcon(aboutURL);\n19\n20       InputStream\
  \ stream = cl.getResourceAsStream(\"data/about.txt\");\n21       var about = new\
  \ String(stream.readAllBytes(), \"UTF-8\");\n22\n23       InputStream stream2 =\
  \ cl.getResourceAsStream(\"/corejava/title.txt\");\n24       var title = new String(stream2.readAllBytes(),\
  \ StandardCharsets.UTF_8).strip();\n25\n26       JOptionPane.showMessageDialog(\n\
  27          null, about, title, JOptionPane.INFORMATION_MESSAGE, icon);\n28    }\n\
  29 }\n```\n\n`java.lang.Class` 1.0\n\n*   `URL getResource(String name)` 1.1\n*\
  \   `InputStream getResourceAsStream(String name)` 1.1\n\n    在与类相同的位置查找资源，然后返回一个可以用于加载资源的\
  \ URL 或输入流。如果未找到资源，则返回 `null`，因此不会为 I/O 错误抛出异常。\n\n### 5.9.4 使用反射分析类的\n\n以下是反射机制中最重要部分的简要概述，它允许你检查类的结构。\n\
  \n`java.lang.reflect` 包中的三个类 `Field`、`Method` 和 `Constructor` 分别描述类的字段、方法和构造函数。这三个类都有一个名为\
  \ `getName` 的方法，用于返回项目的名称。`Field` 类有一个方法 `getType`，它返回一个对象（同样是 `Class` 类型），描述字段类型。`Method`\
  \ 和 `Constructor` 类有方法来报告参数类型，`Method` 类还报告返回类型。这三个类还有一个名为 `getModifiers` 的方法，它返回一个整数，其中各种位位被开启或关闭，用于描述使用的修饰符，例如\
  \ `public` 和 `static`。然后你可以使用 `java.lang.reflect` 包中 `Modifier` 类的静态方法来分析 `getModifiers`\
  \ 返回的整数。使用 `Modifier` 类中的 `isPublic`、`isPrivate` 或 `isFinal` 等方法来判断方法或构造函数是 `public`、`private`\
  \ 还是 `final`。你只需要让 `Modifier` 类中相应的方法作用于 `getModifiers` 返回的整数 即可。你也可以使用 `Modifier.toString`\
  \ 方法来打印修饰符。\n\n`Class` 类的 `getFields`、`getMethods` 和 `getConstructors` 方法返回该类支持的*公共*\
  \ 字段、方法和构造函数的数组。这包括父类的公共成员。`Class` 类的 `getDeclaredFields`、`getDeclaredMethods` 和\
  \ `getDeclaredConstructors` 方法返回由在该类中声明的所有字段、方法和构造函数组成的数组。这包括私有的、包级和保护的成员，以及具有包访问权限的成员，但不包括父类的成员。\n\
  \nListing 5.15 展示了如何打印关于类的所有信息。程序会提示你输入类名，并输出所有方法和构造函数的签名以及该类所有实例字段的名称。例如，如果你输入\n\
  \n```\njava.lang.Double\n```\n\n程序将打印\n\n点击此处查看代码图像\n\n```\npublic final class java.lang.Double\
  \ extends java.lang.Number\n{\n   public java.lang.Double(double);\n   public java.lang.Double(java.lang.String);\n\
  \n   public boolean equals(java.lang.Object);\n   public static java.lang.String\
  \ toString(double);\n   public java.lang.String toString();\n   public static int\
  \ hashCode(double);\n   public int hashCode();\n   public static double doubleToRawLongBits(double);\n\
  \   public static long doubleToLongBits(double);\n   public static double longToDouble(long);\n\
  \   public int compareTo(java.lang.Double);\n   public int compareTo(java.lang.Object);\n\
  \   public static int compare(double, double);\n   public byte byteValue();\n  \
  \ public short shortValue();\n   public int intValue();\n   public long longValue();\n\
  \   public float floatValue();\n   public double doubleValue();\n   public static\
  \ java.lang.Double valueOf(java.lang.String);\n   public static java.lang.Double\
  \ valueOf(double);\n   public static java.lang.String toHexString(double);\n   public\
  \ volatile java.lang.Object resolveConstantDesc(\n      java.lang.invoke.MethodHandles$Lookup);\n\
  \   public java.lang.Double resolveConstantDesc(java.lang.invoke.MethodHandles$Lookup);\n\
  \   public java.util.Optional describeConstable();\n   public boolean isNaN();\n\
  \   public static boolean isNaN(double);\n   public static double sum(double, double);\n\
  \   public boolean isInfinite();\n   public static boolean isInfinite(double);\n\
  \   public static boolean isFinite(double);\n   public static java.lang.Double parseDouble(java.lang.String);\n\
  \n   public static final double POSITIVE_INFINITY;\n   public static final double\
  \ NEGATIVE_INFINITY;\n   public static final double NaN;\n   public static final\
  \ double MAX_VALUE;\n   public static final double MIN_NORMAL;\n   public static\
  \ final double MIN_VALUE;\n   public static final int MAX_EXPONENT;\n   public static\
  \ final int MIN_EXPONENT;\n   public static final int SIZE;\n   public static final\
  \ int BYTES;\n   public static final java.lang.Class TYPE;\n   private final double\
  \ value;\n   private static final long serialVersionUID;\n}\n```\n\n这个程序的奇之处在于，它可以分析\
  \ Java 解释器可以加载的任何类，而不仅仅是编译时可用的类。我们将在下一章中使用这个程序来窥探 Java 编译器自动生成的内部类。\n\n**代码列表 5.15**\
  \ `reflection/ReflectionTest.java`\n\n点击此处查看代码图像\n\n\n\n\n\n```java\npackage reflection;\n\
  \nimport java.util.*;\nimport java.lang.reflect.*;\n/**\n * 此程序使用反射来打印类的所有特征。\n\
  \ * @version 1.12 2021-06-15\n * @author Cay Horstmann\n */\npublic class ReflectionTest\n\
  {\n    public static void main(String[] args)\n          throws ReflectiveOperationException\n\
  \    {\n       // 从命令行参数或用户输入读取类名\n       String name;\n       if (args.length >\
  \ 0) name = args[0];\n       else\n       {\n          var in = new Scanner(System.in);\n\
  \          System.out.println(\"Enter class name (e.g. java.util.Date): \");\n \
  \         name = in.next();\n       }\n\n       // 打印类的修饰符、名称和父类（如果不是 Object）\n\
  \       Class cl = Class.forName(name);\n       String modifiers = Modifier.toString(cl.getModifiers());\n\
  \       if (modifiers.length() > 0) System.out.print(modifiers + \" \");\n     \
  \  if (cl.isSealed())\n          System.out.print(\"sealed \");\n       if (cl.isEnum())\n\
  \          System.out.print(\"enum \" + name);\n       else if (cl.isRecord())\n\
  \          System.out.print(\"record \" + name);\n       else if (cl.isInterface())\n\
  \          System.out.print(\"interface \" + name);\n       else\n          System.out.print(\"\
  class \" + name);\n       Class supercl = cl.getSuperclass();\n       if (supercl\
  \ != null && supercl != Object.class) System.out.print(\" extends \"\n         \
  \    + supercl.getName());\n\n       printInterfaces(cl);\n       printPermittedSubclasses(cl);\n\
  \n       System.out.print(\"\\n{\\n\");\n       printConstructors(cl);\n       System.out.println();\n\
  \       printMethods(cl);\n       System.out.println();\n       printFields(cl);\n\
  \       System.out.println(\"}\");\n    }\n\n   /**\n    * 打印类的所有构造函数\n    * @param\
  \ cl 一个类\n   */\n  public static void printConstructors(Class cl)\n  {\n     Constructor[]\
  \ constructors = cl.getDeclaredConstructors();\n\n     for (Constructor c : constructors)\n\
  \     {\n        String name = c.getName();\n        System.out.print(\" \");\n\
  \        String modifiers = Modifier.toString(c.getModifiers());\n        if (modifiers.length()\
  \ > 0) System.out.print(modifiers + \" \");\n        System.out.print(name + \"\
  (\");\n\n        // 打印参数类型\n        Class[] paramTypes = c.getParameterTypes();\n\
  \        for (int j = 0; j < paramTypes.length; j++)\n        {\n           if (j\
  \ > 0) System.out.print(\", \");\n           System.out.print(paramTypes[j].getName());\n\
  \        }\n        System.out.println(\");\");\n     }\n  }\n\n  /**\n   * 打印类的所有方法\n\
  \   * @param cl 一个类\n   */\n  public static void printMethods(Class cl)\n  {\n \
  \    Method[] methods = cl.getDeclaredMethods();\n\n     for (Method m : methods)\n\
  \     {\n        Class retType = m.getReturnType();\n        String name = m.getName();\n\
  \n        System.out.print(\" \");\n           // 打印修饰符、返回类型和方法名\n           String\
  \ modifiers = Modifier.toString(m.getModifiers());\n           if (modifiers.length()\
  \ > 0) System.out.print(modifiers + \" \");\n           System.out.print(retType.getName()\
  \ + \" \" + name + \"(\");\n\n          // 打印参数类型\n          Class[] paramTypes\
  \ = m.getParameterTypes();\n          for (int j = 0; j < paramTypes.length; j++)\n\
  \          {\n             if (j > 0) System.out.print(\", \");\n             System.out.print(paramTypes[j].getName());\n\
  \          }\n          System.out.println(\");\");\n      }\n   }\n\n   /**\n \
  \   * 打印类的所有字段\n    * @param cl 一个类\n   */\n  public static void printFields(Class\
  \ cl)\n  {\n      Field[] fields = cl.getDeclaredFields();\n\n      for (Field f\
  \ : fields)\n      {\n          Class type = f.getType();\n          String name\
  \ = f.getName();\n          System.out.print(\" \");\n          String modifiers\
  \ = Modifier.toString(f.getModifiers());\n          if (modifiers.length() > 0)\
  \ System.out.print(modifiers + \" \");\n          System.out.println(type.getName()\
  \ + \" \" + name);\n      }\n  }\n  /**\n   * 打印类的所有允许子类\n   * @param cl 一个类\n \
  \  */\n  public static void printPermittedSubclasses(Class cl)\n  {\n     if (cl.isSealed())\n\
  \     {\n        Class[] permittedSubclasses = cl.getPermittedSubclasses();\n  \
  \      for (int i = 0; i < permittedSubclasses.length; i++)\n        {\n       \
  \   System.out.println(permittedSubclasses[i].getName());\n        }\n     }\n \
  \ }\n\n  /**\n   * 打印类的所有实现的接口\n   * @param cl 一个类\n   */\n  public static void\
  \ printInterfaces(Class cl)\n  {\n     Class<?> interfaces = cl.getInterfaces();\n\
  \     for (int i = 0; i < interfaces.length; i++)\n     {\n        System.out.println(interfaces[i].getName());\n\
  \     }\n  }\n}\n```\n\n### ReflectionTest\n此程序使用反射来打印类的所有特征。\n\n#### `public static\
  \ void main(String[] args)`\n从命令行 `args` 或用户输入读取类名。然后打印类的修饰符、名称和父类名称（如果不是 `Object`）。随后调用辅助方法来打印接口、允许的子类、构造函数、方法和字段。\n\
  \n#### 辅助方法\n- `printConstructors(Class cl)`: 打印类的所有构造函数，包括修饰符和参数类型。\n- `printMethods(Class\
  \ cl)`: 打印类的所有声明方法，包括修饰符、返回类型、名称和参数类型。\n- `printFields(Class cl)`: 打印类的所有声明字段。\n\
  - `printPermittedSubclasses(Class cl)`: 打印密封类（sealed class）的所有允许子类。\n- `printInterfaces(Class\
  \ cl)`: 打印类的所有实现的接口。\n\n---\n\n### `java.lang.reflect.Field`\n- `getDeclaringClass()`:\
  \ 返回定义该字段的 `Class` 对象。\n- `getModifiers()`: 返回描述字段修饰符的整数。\n- `getName()`: 返回字段的名称。\n\
  - `getType()`: 返回表示字段类型的 `Class`。\n\n---\n\n### `java.lang.reflect.Method`\n- `getDeclaringClass()`:\
  \ 返回定义该方法的 `Class` 对象。\n- `getExceptionTypes()`: 返回方法抛出的异常类型 `Class` 数组。\n- `getModifiers()`:\
  \ 返回描述方法修饰符的整数。\n- `getName()`: 返回方法的名称。\n- `getParameterTypes()`: 返回参数类型的 `Class`\
  \ 数组。\n- `getReturnType()`: 返回方法的返回类型。\n\n---\n\n### `java.lang.reflect.Constructor`\n\
  - `getDeclaringClass()`: 返回定义该构造函数的 `Class` 对象。\n- `getExceptionTypes()`: 返回构造函数抛出的异常类型\
  \ `Class` 数组。\n- `getModifiers()`: 返回描述构造函数修饰符的整数。\n- `getName()`: 返回构造函数的名称。\n\
  - `getParameterTypes()`: 返回参数类型的 `Class` 数组。\n\n---\n\n### `java.lang.Class`\n-\
  \ `forName(String name)`: 返回与指定的类名对应的 `Class` 对象。\n- `getModifiers()`: 返回类修饰符的整数。\n\
  - `isSealed()`: 如果该类是密封的，则返回 `true`。\n- `isEnum()`: 如果该类是枚举，则返回 `true`。\n- `isRecord()`:\
  \ 如果该类是记录，则返回 `true`。\n- `isInterface()`: 如果该类是接口，则返回 `true`。\n- `getSuperclass()`:\
  \ 返回此类的父类。\n- `getName()`: 返回类的名称。\n- `getDeclaredConstructors()`: 返回 `Constructor`\
  \ 对象数组。\n- `getDeclaredMethods()`: 返回声明的 `Method` 对象数组。\n- `getDeclaredFields()`:\
  \ 返回声明的 `Field` 对象数组。\n- `getPermittedSubclasses()`: 返回允许子类的数组。\n- `getInterfaces()`:\
