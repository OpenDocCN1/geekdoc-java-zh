  ```\n\n这样也很好，因为 JSON 不允许注释。因此，密封类允许对领域约束进行精确建模。\n\n密封类的许可子类必须是可访问的。它们不能是嵌套在另一个类中的私有类，也不能是另一个包的包可见类。\n\
