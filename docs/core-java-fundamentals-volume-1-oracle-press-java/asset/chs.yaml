  \ {}\n```\n\n注意，长度为 0 的数组不等同于 `null`。\n\n### 3.10.2 访问数组元素\n\n数组元素*从 0 开始编号*。最后一个有效索引是长度减\
  \ 1。在下面的示例中，索引值范围从 0 到 99。一旦创建了数组，你就可以填充数组中的元素，例如使用循环：\n\n点击此处查看代码图像\n\n```java\n\
  int[] a = new int[100];\nfor (int i = 0; i < 100; i++)\n   a[i] = i; // 用数字 0 到\
  \ 99 填充数组\n```\n\n当你创建一个数字数组时，所有元素都被初始化为零。`boolean` 类型的数组初始化为 `false`。对象数组初始化为特殊值\
  \ `null`，这表示它们（尚未）持有任何对象。这可能会让初学者感到惊讶。例如，\n\n点击此处查看代码图像\n\n```java\nString[] names\
  \ = new String[10];\n```\n\n这段代码创建了一个包含十个字符串的数组，所有元素都是 `null`。如果你想让数组持有空字符串，你必须提供它们：\n\
  \n点击此处查看代码图像\n\n```java\nfor (int i = 0; i < 10; i++) names[i] = \"\";\n```\n\n\
  ![Images](img/caution.jpg) 注意\n\n如果你构造了一个包含 100 个元素的数组，然后尝试访问元素 `a[100]`（或 0 到 99\
  \ 范围之外的任何索引），将发生“数组下标越界”（array index out of bounds）异常。\n\n要找到数组元素的数量，使用 `array.length`。例如：\n\
  \n点击此处查看代码图像\n\n```java\nfor (int i = 0; i < a.length; i++)\n   System.out.println(a[i]);\n\
  ```\n\n### 3.10.3 “for each”循环\n\nJava 有一种强大的循环结构，允许你遍历数组（或任何元素集合）中的每个元素，而无需处理索引值。\n\
  \n增强型 `for` 循环\n\n点击此处查看代码图像\n\n```java\nfor (variable : collection) statement\n\
  ```\n\n它将给定的设置为集合中的每个元素，然后执行语句（当然，这可能是一个代码块）。`collection` 表达式必须是一个数组或实现了 `Iterable`\
  \ 接口的类对象，例如 `ArrayList`。数组在第 5 章中介绍，`Iterable` 接口在第 9 章中介绍。\n\n例如，\n\n点击此处查看代码图像\n\
  \n```java\nfor (int element : a)\n   System.out.println(element);\n```\n\n将数组 `a`\
  \ 的每个元素打印在单独一行。\n\n你应该将此循环读作“对于 `a` 中的每个 `element`”。\n\nJava 的设计者考虑过使用如 `foreach`\
  \ 之类的关键字，但这是语言后期添加的。\n\n或者，你也可以使用 `for` 循环实现相同的效果：\n\n点击此处查看代码图像\n\n```java\nfor\
  \ (int i = 0; i < a.length; i++)\n   System.out.println(a[i]);\n```\n\n“for each”循环更加简洁，且不容易出错。\n\
  \n### 3.10.4 复制\n\n你可以将一个数组复制到另一个数组，但两个变量都指向同一个数组：\n\n点击此处查看代码图像\n\n```java\nint[]\
  \ luckyNumbers = smallPrimes;\nluckyNumbers[5] = 12; // 现在 smallPrimes[5] 也是 12\n\
  ```\n\n图 3.14 显示了结果。\n\n如果你实际上想将一个数组的所有值复制到新数组中，请使用 `Arrays` 类中的 `copyOf` 方法：\n\n\
  点击此处查看代码图像\n\n```java\nint[] copiedLuckyNumbers = Arrays.copyOf(luckyNumbers, luckyNumbers.length);\n\
  ```\n\n第二个参数是新数组的长度。该方法的一个常见用法增加数组的长度：\n\n点击此处查看代码图像\n\n```java\nluckyNumbers =\
  \ Arrays.copyOf(luckyNumbers, 2 * luckyNumbers.length);\n```\n\n如果数组包含数字，额外的元素将填充为\
  \ `0`；如果数组包含 `boolean` 值，则填充为 `false`。相反，如果长度小于原始数组的长度，则只复制初始值。\n\nJava 数组与 C++\
  \ 栈数组不同。然而，它本质上与堆上分配的指针相同。也就是说，\n\n点击此处查看代码图像\n\n```java\nint[] a = new int[100];\
  \ // Java\n```\n\n不等同于\n\n```cpp\nint a[100]; // C++\n```\n\n而是\n\n```cpp\nint*\
  \ a = new int[100]; // C++\n```\n\n在 Java 中，`[]` 运算符预定义了*边界检查*。此外，没有指针算术——你无法通过增加\
  \ `a` 来指向数组中的下一个元素。\n\n### 3.10.5 命令行参数\n\n你已经看到过一个重复出现的 Java 数组示例。每个 Java 程序都有一个\
  \ `main` 方法，并带有 `String[] args` 参数。该参数表示 `main` 方法接收一个字符串数组——即在命令行上指定的参数。例如，考虑这个程序：\n\
  \n点击此处查看代码图像\n\n\n\n\n\n```\npublic class Message\n{\n   public static void main(String[]\
  \ args)\n   {\n      if (args.length == 0 || args[0].equals(\"-h\"))\n         System.out.print(\"\
  Hello,\");\n      else if (args[0].equals(\"-g\"))\n         System.out.print(\"\
  Goodbye,\");\n      // print the other command-line arguments\n      for (int i\
  \ = 1; i < args.length; i++)\n         System.out.print(\" \" + args[i]);\n    \
  \  System.out.println(\"!\");\n   }\n}\n```\n\n如果程序如下所示调用：\n\n```\njava Message\
  \ -g cruel world\n```\n\n那么 `args` 数组包含以下内容：\n\n```\nargs[0]: \"-g\"\nargs[1]: \"\
  cruel\"\nargs[2]: \"world\"\n```\n\n程序打印消息：\n\n```\nGoodbye, cruel world!\n```\n\
  \n![Images](img/cnote.jpg) C++ 笔记\n\n在 Java 程序的 `main` 方法中，程序的名称并不存储在 `args` 数组中。例如，当你从命令行启动程序时：\n\
  \n```\njava Message -h world\n```\n\n那么 `args[0]` 将是 `\"-h\"` 而不是 `\"Message\"`\
  \ 或 `\"java\"`。\n\n### 3.10.6 数组排序\n\n要对数字数组排序，你可以使用 `Arrays` 类中的 `sort` 方法之一：\n\
  \n```\nint[] a = new int[10000];\n. . .\nArrays.sort(a)\n```\n\n该方法使用了经过调优的 `QuickSort`\
  \ 算法，该算法在大多数数据集上都非常高效。`Arrays` 类还为数组提供了其他便利方法，这些方法包含在本节末尾的 API 说明中。\n\nListing 3.7\
  \ 中的程序演示了数组的应用。该程序为彩票游戏绘制随机数字组合。例如，如果你玩“从 49 个中选 6 个”的彩票，程序可能会输出如下：\n\n点击此处查看代码图片\n\
  \n```\nBet the following combination. It'll make you rich!\n   4\n   7\n   8\n \
  \  19\n   30\n   44\n```\n\n要选择这样一个随机数字集，首先用值 `1`, `2`, . . . , `n` 填充数组 `numbers`：\n\
  \n点击此处查看代码图片\n\n```\nint[] numbers = new int[n];\nfor (int i = 0; i < numbers.length;\
  \ i++)\n   numbers[i] = i + 1;\n```\n\n第二个数组存储要抽取的数字：\n\n```\nint[] result = new\
  \ int[k];\n```\n\n现在抽取 `k` 个数字。`Math.random` 方法返回一个 `0`（包含）到 `1`（不包含）之间的随机浮点数。将结果乘以\
  \ `n` 即可得到一个 `0` 到 `n - 1` 之间的随机数。\n\n点击此处查看代码图片\n\n```\nint r = (int) (Math.random()\
  \ * n);\n```\n\n将第 `i` 个结果设置为该索引处的数字。最初，它只是 `r` + 1，但正如你现在将看到的，每次抽取后 `numbers` 数组的内容都会改变。\n\
  \n```\nresult[i] = numbers[r];\n```\n\n现在，你必须确保不再再次抽取那个数字——所有彩票数字必须是不同的。因此，用数组中的最后一个数字覆盖\
  \ `numbers[r]`，并将 `n` 减 1。\n\n```\nnumbers[r] = numbers[n - 1];\nn--;\n```\n\n关键在于，我们每次抽取选择的是索引，而不是实际值。索引指向一个数组，该数组包含了尚未被抽取的值。\n\
  \n抽取 `k` 个彩票数字后，对 `result` 数组进行排序以获得更整的输出：\n\n```\nArrays.sort(result);\nfor (int\
  \ r : result)\n   System.out.println(r);\n```\n\n**Listing 3.7** `LotteryDrawing/LotteryDrawing.java`\n\
