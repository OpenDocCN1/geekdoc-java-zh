  \    从列表中删除所有项。\n*   `Object getSelectedItem()`\n    返回当前选中的项。\n\n### 11.4.5 滑动块\n\
  \n组合框允许用户从离散集中选择。滑动块提供了连续值的选择——例如，1 到 100 之间的任何数字。\n\n构造滑动块最常用的方式如下：\n\n点击此处查看代码图片\n\
  \n```java\nSlider(min, max, initialValue);\n```\n\n如果你省略了最小值、最大值和初始值，它们将分别初始化为 `0`、`100`\
  \ 和 `50`。\n\n或者如果你想让滑动块变为垂直的，请使用以下构造函数调用：\n\n点击此处查看代码图片\n\n```java\nSlider(SwingConstants.VERTICAL,\
  \ min, max, initialValue);\n```\n\n这些构造函数创建一个基础滑动块，如图 11.16 所示。你稍将看到如何为滑动块添加装饰。\n\
  \n![Images](img/011fig16.jpg)\n\n**图 11.16** 滑动块\n\n当用户滑动滑动条时，滑动块的值会在最小值和最大值之间移动。当值变化时，会向所有更改监听器发送\
  \ `ChangeEvent`。为了感知更改，调用 `addChangeListener` 方法并安装实现 `ChangeListener` 接口的对象。在回调中，获取滑动块的值：\n\
  \n点击此处查看代码图片\n\n```java\nChangeListener listener = event ->\n   {\n      JSlider\
  \ slider = (JSlider) event.getSource();\n      int value = slider.getValue();\n\
  \      . . .\n   };\n```\n\n你可以通过显示刻度来装饰滑动块。例如，在示例程序中，第二个滑动块使用了以下设置：\n\n点击此处查看代码图片\n\
  \n```java\nslider.setMajorTickSpacing(20);\nslider.setMinorTickSpacing(5);\n```\n\
  \n滑动块被每 20 个单位一个大刻度、每 5 个单位一个小刻度所装饰。这些单位指的是滑动块的值，而不是像素。\n\n这些指令仅设置了刻度的单位。为了让刻度真正出现，请调用\n\
  \n```java\nslider.paintTicks(true);\n```\n\n\n\n\n\n```java\npackage slider;\n\n\
  import java.awt.*;\nimport java.util.*;\nimport javax.swing.*;\nimport javax.swing.event.*;\n\
  \n/**\n * 一个包含多个滑动块和一个用于显示滑动块数值的文本框框架。\n */\npublic class SliderFrame extends JFrame\n\
