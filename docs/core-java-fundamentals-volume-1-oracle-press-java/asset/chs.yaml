  \    }\n27\n28    public LocalDate hireDay()\n29    {\n30       return hireDay;\n\
  31    }\n32\n33    public void raise(double percent)\n34    {\n35       salary +=\
  \ salary * percent;\n36    }\n37 }\n```\n\n**列表 5.3** `inheritance/Manager.java`\n\
  \n点击此处查看代码图片\n\n```\n 1 package inheritance;\n 2\n 3 public class Manager extends\
  \ Employee\n 4 {\n 5    private double bonus;\n 6\n 7    /**\n 8      * @param name\n\
  \ 9      * @param salary\n10      * @param year\n11      * @param month\n12    \
  \  * @param day\n13      */\n14    public Manager(String name, double salary, int\
  \ year, int month, int day)\n15    {\n16       super(name, year, month, day);\n\
  17    }\n18\n19    /**\n20      * @param bonus\n21      */\n22    public void setBonus(double\
  \ bonus)\n23    {\n24       this.bonus = bonus;\n25    }\n26\n27    /**\n28    \
  \  * @return bonus\n29      */\n30    public double getBonus()\n31    {\n32    \
  \   return bonus;\n33    }\n34\n35    @Override\n36    public double getSalary()\n\
  37    {\n38       return super.getSalary() + bonus;\n39    }\n40 }\n```\n\n### 5.1.4\
  \ 层次结构\n\n继承并不只停于一层。一个类可以有多个子类。例如，`Manager` 和 `Secretary` 都继承 `Employee`。所有扩展父类的集合被称为*继承*，如图\
  \ 5.1](#ch05.xhtml_ch05fig1) 所示。\n\n![Images](img/05fig1.jpg) Employee 层次结构\n\n\
  在 C++ 中，一个类可以有多个父类。Java 不支持多重继承。有关恢复大部分继承的方法，请参见第 6.1 节](#ch6.xhtml_6_1)。\n\n###\
  \ 5.1.5 多态\n\n一个简单的规则可以帮助你判断继承是否适用于你的数据。“是”规则规定子类的对象都是父类的对象。例如，每个经理都是员工。自然，相反的情况并非如此——每个员工都是经理。\n\
  \n“是”规则的另一种制定方式是*替换原则*。该原则规定程序需要父类对象时可以使用子类对象。\n\n例如，你可以将子类对象赋值给父类变量。点击此处查看代码图片\n\
  \n```\nEmployee e;\ne = new Employee(); // 需要 Employee\ne = new Manager(); // OK，可以使用\
  \ Manager\n```\n\n在 Java 编程语言中，对象变量是*多态的*。`Employee` 类型变量可以引用 `Employee` 类型的对象，也可以引用\
  \ `Employee` 类任何子类的类型对象（如 `Manager`、`Executive`、`Secretary` 等）。\n\n我们在列表 5.1](#ch05.xhtml_ch05list01)\
  \ 中利用了这个原则：\n\n点击此处查看代码图片\n\n```\nManager boss = new Manager();\nEmployee[] staff\
  \ = new Employee[3];\nstaff[0] = boss;\n```\n\n在这种情况下，变量 `staff[0]` 和 `boss` 指向同一个对象。然而，编译器认为\
  \ `staff[0]` 仅仅是一个 `Employee` 对象。\n\n这意味着你可以调用\n\n```\nboss.setBonus(5000); // OK\n\
  ```\n\n但你不能调用\n\n```\nstaff[0].setBonus(5000); // 错误\n```\n\n`staff[0]` 的声明类型是 `Employee`，而\
  \ `setBonus` 方法并不是 `Employee` 类的方法。\n\n\n\n\n然而，你不能将父类引用赋值给子类变量。例如，进行如下赋值是不合法的：\n\
  \n点击此处查看代码图片\n\n```\nManager m = staff[i]; // ERROR\n```\n\n原因显而易见：并不是所有员工都是经理。如果此赋值成功，并且\
  \ `m` 指向一个不是经理的 `Employee` 对象，那么之后就可能调用 `m.setBonus(. . .)`，并导致运行时错误。\n\n![Images](img/caution.jpg)\
  \ 注意\n\n在 Java 中，子类引用的数组可以在不需要强制转换的情况下转换为父类引用的数组。例如，考虑这个经理数组：\n\n点击此处查看代码图片\n\n\
  ```\nManager[] managers = new Manager[10];\n```\n\n将此数组转换为 `Employee[]` 数组是合法的：\n\
  \n点击此处查看代码图片\n\n```\nEmployee[] staff = managers; // OK\n```\n\n当然，你可能会想，为什么不可呢？毕竟，如果\
  \ `managers[i]` 是一个 `Manager`，它也是一个 `Employee`。但实际上，发生了一些令人惊讶的事情。请记住，`managers`\
  \ 和 `staff` 是同一个数组的引用。现在考虑以下语句：\n\n点击此处查看代码图片\n\n```\nstaff[0] = new Employee(\"\
  Harry Hacker\", . . .);\n```\n\n编译器会乐然地允许这次赋值。但 `staff[0]` 和 `managers[0]` 是同一个引用，因此看起来我们成功地将一个普通的员工“偷入”了管理层。这将非常糟糕——调用\
  \ `managers[0].setBonus(1000)` 将尝试访问一个不存在的实例字段，并损坏相邻的内存。\n\n为了确保不会发生此类损坏，所有数组都会记录其创建时的元素类型，并监控只允许将兼容的引用存储在其中。例如，通过\
  \ `new Manager[10]` 创建的数组会记住它是一个经理数组。尝试存储 `Employee` 引用将抛出 `ArrayStoreException`。\n\
  \n### 5.1.6 理解方法调用\n\n确切理解方法调用是如何应用到对象的是非常重要的。假设我们调用 `x.f(args)`，并且隐式参数 `x` 被声明为类\
  \ `C` 的对象。以下是发生的情况：\n\n1. 编译器查看对象的声明类型和方法名。注意，可能存在多个同名为 `f` 的方法，但参数类型不同。例如，可能存在一个方法\
  \ `f(int)` 和一个方法 `f(String)`。编译器会列出类 `C` 中所有名为 `f` 的方法，以及 `C` 的父类中所有可访问的名为 `f` 的方法。（父类的私有方法是不可访问的。）\n\
  \n   现在，编译器知道了要调用的所有候选方法。\n\n2. 接下来，编译器确定方法调用中提供的参数的类型。如果在所有名为 `f` 的方法中，有一个方法的参数类型与提供的参数最匹配的（best\
  \ match），则选择该方法进行调用。这个过程被称为*重载解析*（*overloading resolution*）。例如，在调用 `x.f(\"Hello\"\
  )` 时，编译器选择了 `f(String)` 而不是 `f(int)`。由于类型转换（从 `int` 到 `double`，从 `Manager` 到 `Employee`\
  \ 等），情况可能会变得复杂。如果编译器找不到任何参数类型匹配的方法，或者在应用转换后有多个方法都匹配，编译器将报告错误。\n\n   现在，编译器知道了需要调用的方法名和参数类型。\n\
  \n   ![Images](img/note.jpg) 注意\n\n   回想方法的名称和参数类型列表被称为方法的*签名*（*signature*）。例如，`f(int)`\
  \ 和 `f(String)` 是两个同名但签名不同的方法。如果你在子类中定义了一个与父类方法签名相同的方法，那么你就重写（*overridden*）了该父类方法。\n\
  \n   返回类型不是签名的一部分。然而，当你重写一个方法时，你需要保持返回类型是兼容的。子类可以将返回类型更改为原始类型的子类型。例如，假设 `Employee`\
  \ 类有一个方法：\n\n   点击此处查看代码图片\n\n   ```\n   public Employee getBuddy() { . . . }\n\
  \   ```\n\n   经理绝不会希望有一个低级的员工作为伙伴。为了反映这一事实，`Manager` 子类可以这样重写该方法：\n\n   点击此处查看代码图片\n\
  \n   ```\n   public Manager getBuddy() { . . . } // 修改返回类型是合法的\n   ```\n\n   我们说这两个\
  \ `getBuddy` 方法具有*协变*返回类型（*covariant* return types）。\n\n3. 如果方法是 `private`、`static`、`final`\
  \ 或构造函数，那么编译器确切知道要调用哪一个方法。（`final` 修饰符将在下一节中解释）。这被称为*静态绑定*（*static binding*）。否则，要调用的方法取决于隐式参数的实际类型，必须在运行时使用动态绑定。在我们的示例中，编译器将生成一条使用动态绑定调用\
  \ `f(String)` 的指令。\n\n4. 当程序运行并使用动态绑定调用一个方法时，虚拟机必须根据隐式参数 `x` 的实际类型来调用。在我们的示例中，编译器会生成一条使用动态绑定调用\
  \ `f(String)` 的指令。假设实际类型是 `D`，它是 `C` 的子类。如果 `D` 类定义了方法 `f(String)`，则调用该方法；如果没有，则在\
  \ `D` 的父类中查找 `f(String)`。\n\n   如果每次调用方法时都进行这种搜索将耗时。相反，虚拟机在加载类时为每个类预计算一个方法表。方法表列出了该类及其父类中的所有方法签名。\n\
  \n   当实际调用方法时，虚拟机只需进行表查询。在示例中，虚拟机查询类 `D` 的方法表以查找 `f(String)`。该方法可能是 `D.f(String)`\
  \ 或 `X.f(String)`，其中 `X` 是某个父类。\n\n   这种场景有一个转折：如果调用的是 `super.f()`，那么虚拟机将查询父类的方法表。\n\
  \n   让我们在列表 5.1 中详细查看 `e.getSalary()` 的过程。`e` 的声明类型是 `Employee`。`Employee` 类只有一个方法\
  \ `getSalary`，且没有参数。因此，在这种情况下，我们不需要担心重载解析。\n\n   `getSalary` 方法不是 `private`、`static`\
  \ 或 `final`，因此它是动态绑定的。虚拟机为 `Employee` 和 `Manager` 类生成方法表。`Employee` 表显示所有方法都定义在\
  \ `Employee` 类中：\n\n   点击此处查看代码图片\n\n   ```\n   Employee:\n      getName() -> Employee.getName()\n\
  \      getSalary() -> Employee.getSalary()\n      getHireDay() -> Employee.getHireDay()\n\
  \      raiseSalary(double) -> Employee.raiseSalary(double)\n   ```\n\n   实际上这并不是全部——正如你在本章后面将看到的，`Employee`\
  \ 类有一个父类 `Object`，从那里继承了许多方法。我们现在忽略 `Object` 方法。\n\n   `Manager` 方法表略有不同。继承了三个方法，重新定义了一个种方法，并增加了一个方法。\n\
  \n   点击此处查看代码图片\n\n   ```\n   Manager:\n      getName() -> Employee.getName()\n\
  \      getSalary() -> Manager.getSalary()\n      getHireDay() -> Employee.getHireDay()\n\
  \      raiseSalary(double) -> Employee.raiseSalary(double)\n      setBonus(double)\
  \ -> Manager.setBonus(double)\n   ```\n\n   在运行时，`e.getSalary()` 的解析如下：\n\n\n\n\n\
  1. 首先，虚拟机获取 `e` 的实际类型的方法表。这可能是对应 `Employee`、`Manager` 或 `Employee` 的另一个子类的表。\n\n\
  2. 接着，虚拟机查找 `getSalary()` 签名的定义类。现在它知道要调用哪一个方法了。\n\n3. 最后，虚拟机调用该方法。\n\n动态绑定有一个非常重要的特性：它使程序具有*可扩展性*，而无需修改现有代码。假设添加了一个新类\
  \ `Executive`，并且变量 `e` 可能指向该类的对象。包含调用 `e.getSalary()`get 不需要重新编译。如果 `e` 恰好指向类型为\
  \ `Executive` 的对象，则会自动调用 `Executive.getSalary()` 方法。\n\n![Images](img/caution.jpg)\
  \ 注意\n\n当你重写（override）一个方法时，子类方法的可见性*至少要与父类方法的可见性相同*。特别地，如果父类方法是 `public`，则子类方法也必须声明为\
  \ `public`。无意中漏掉子类方法的 `public` 修符是一个常见错误。此时编译器会报错，提示你尝试提供更严格的访问权限。\n\n### 5.1.7\
  \ 防止继承：final 类和方法\n\n有时，你想要防止他人创建你某个类的子类。不能被扩展的类被称为*final* 类，你可以在类定义中使用 `final`\
  \ 修饰符来指示这一点。例如，假设我们想防止他人对 `Executive` 类进行子类。只需使用 `final` 修饰符声明类即可：\n\n点击此处查看代码图像\n\
  \n```\npublic final class Executive extends Manager\n{\n   . . .\n}\n```\n\n你也可以将类中的某个特定方法设为\
  \ `final`。如果你这样做，任何子类都不能重写该方法。（`final` 类中的所有方法都自动是 `final` 的。）例如：\n\n点击此处查看代码图像\n\
  \n```\npublic class Employee\n{\n   . . .\n   public final String getName()\n  \
  \ {\n      return name;\n   }\n   . . .\n}\n```\n\n![Images](img/note.jpg) 注意\n\n\
  记住，字段也可以被声明为 `final`。 字段在对象构造后无法被更改。然而，如果一个类被声明为 `final`，只有方法会自动变为 `final`，而字段不是。\n\
  \n将方法或类设为 `final` 的唯一理由是：确保其语义在子类中不会被改变。例如，`Calendar` 类的 `getTime` 和 `setTime` 方法是\
  \ `final` 的。这表明 `Calendar` 类的设计者承担了 `Date` 类与日历状态之间转换的责任。不应允许子类破坏这种安排。同样，`String`\
  \ 类也是一个 `final` 类。这意味着没有人可以定义 `String` 的子类。换句话说，如果你有一个 `String` 引用，你就知道它指向的且仅是一个字符串。\n\
  \n有些程序员认为，除非你有理由，否则应该将所有方法都声明为 `final`。\n\n（注：提供的源文本在后半部分包含大量重复/乱码内容。我已根据可读部分清理了结构，以保持关于类型转换和\
  \ final 修饰符的核心技术解释。）\n\n\n\n\n最后，如果转换没有成功的可能，编译器将不允许你进行类型转换。例如，以下转换\n\n```\nString\
  \ c = (String) staff[i];\n```\n\n是一个编译时错误，因为 `String` 并不是 `Employee` 的子类。\n\n总结一下：\n\
  \n*   你只能在继承体系内进行类型转换。\n*   在从父类向子类进行转换之前，使用 `instanceof` 进行检查。\n\n![Images](img/note.jpg)\
  \ 事项\n\n以下测试\n\n```\nx instanceof C\n```\n\n如果 `x` 是 `null`，它不会产生异常。它只是返回 `false`。这很合理：`null`\
  \ 指的是没有对象，所以它显然没有指向一个类型为 `C` 的对象。\n\n实际上，通过类型转换转换对象的类型通常不是一个好主意。在我们的示例中，对于大多数用途，你不需要将\
  \ `Employee` 对象转换为 `Manager` 对象。`getSalary` 方法在这两个类的两个对象上都能正常工作。使多态生效的动态绑定会自动定位到正确的方法。\n\
  \n进行类型转换的唯一目的是使用管理器特有的方法，例如 `setBonus`。如果出于某种原因，你发现想在 `Employee` 对象上调用 `setBonus`，请问自己这是否暗示了父类的设计缺陷。重新设计父类并添加\
  \ `setBonus` 方法可能是有意义的。记住，只需要一个未捕获的 `ClassCastException` 就会终止你的程序。通常情况下，最好尽量减少类型转换和\
  \ `instanceof` 运算符的使用。\n\n![Images](img/cnote.jpg) C++ 注意\n\nJava 使用了 C 语言“过去时代”的类型转换语法，但它的工作方式类似于\
  \ C++ 中安全的 `dynamic_cast` 操作。例如，\n\n点击此处查看代码图像\n\n```\nManager boss = (Manager)\
  \ staff[i]; // Java\n```\n\n等同于\n\n点击此处查看代码图像\n\n```\nManager* boss = dynamic_cast<Manager*>(staff[i]);\
  \ // C++\n```\n\n但有一个重要的区别。如果转换失败，它不会产生一个空对象，而是抛出一个异常。从这个意义上说，它类似于 C++ 中对*引用*的转换。这非常让人头疼。在\
  \ C++ 中，你可以在一次操作中完成类型测试和类型转换。\n\n点击此处查看代码图像\n\n```\nManager* boss = dynamic_cast<Manager*>(staff[i]);\
  \ // C++\nif (boss != NULL) . . .\n```\n\n在 Java 中，你需要结合使用 `instanceof` 运算符和类型转换。\n\
  \n点击此处查看代码图像\n\n```\nif (staff[i] instanceof Manager)\n{\n   Manager boss = (Manager)\
  \ staff[i];\n   . . .\n}\n```\n\n### 5.1.9 `instanceof` 的模式匹配\n\n这段代码\n\n点击此处查看代码图像\n\
  \n```\nif (staff[i] instanceof Manager)\n{\n   Manager boss = (Manager) staff[i];\n\
  \   boss.setBonus(5000);\n}\n```\n\n相当冗嗦的。我们真的需要提到子类 `Manager` 三次吗？\n\n从 Java 16\
  \ 开始，有一种更简单的方法。你可以直接在 `instanceof` 测试中声明子类变量：\n\n点击此处查看代码图像\n\n```\nif (staff[i]\
  \ instanceof Manager boss)\n{\n   boss.setBonus(5000);\n}\n```\n\n如果 `staff[i]`\
  \ 是 `Manager` 类的实例，那么变量 `boss` 将被设置为 `staff[i]`，你可以像使用 `Manager` 一样使用它。你跳过了类型转换。\n\
  \n如果 `staff[i]` 不指向 `Manager`，`boss` 不会被赋值，且 `instanceof` 运算符返回值 `false`。`if` 语句体会被跳过。\n\
  \n![Images](img/tip.jpg) 提示\n\n在大多数使用 `instanceof` 的情况下，你需要应用一个子类方法。这时请使用这种“模式匹配”形式的\
  \ `instanceof` 来代替类型转换。\n\n无用的 `instanceof` 模式是一个错误：\n\n点击此处查看代码图像\n\n```\nManager\
  \ boss = . . .;\nif (boss instanceof Employee e) . . . // 错误：它当然是 Employee\n```\n\
  \n![Images](img/note.jpg) 事项\n\n同样无用的\n\n点击此处查看代码图像\n\n```\nif (boss instanceof\
  \ Employee) . . .\n```\n\n是被允许的，为了与 Java 1.0 向后兼容。\n\n当 `instanceof` 模式引入变量时，你可以立即在同一个表达式中使用它：\n\
  \n点击此处查看代码图像\n\n```\nEmployee e;\nif (e instanceof Manager m && m.getBonus() > 10000)\
  \ . . .\n```\n\n这之所以有效，是因为 `&&` 表达式的右侧只有在左侧为 `true` 时才会被求值。如果求值右侧，则 `m` 已经绑定到了 `Manager`\
  \ 实例。\n\n然而，以下代码是编译时错误：\n\n点击此处查看代码图像\n\n```\nif (e instanceof Manager m || m.getBonus()\
  \ > 10000) . . . // 错误\n```\n\n`||` 的右侧在左侧为 `false` 时执行，此时没有没有绑定到变量 `m`。\n\n这里是另一个使用条件运算符的示例：\n\
  \n点击此处查看代码图像\n\n```\ndouble bonus = e instanceof Manager m ? m.getBonus() : 0;\n\
  ```\n\n变量 `m` 定义在 `?` 之后的子表达式中，但没有定义在 `:` 之后的子表达式中。\n\n![Images](img/note.jpg) 事项\
  \ \n\n这种声明变量的 `instanceof` 形式被称为“模式匹配”，因为它类似于 `switch` 中的类型模式，这是 Java 17 的一项“预览”特性。我不会详细讨论预览特性，但这里有一个示例：\n\
  \n点击此处查看代码图像\n\n```\nString description = switch (e)\n{\n   case exec -> \"An executive\
  \ with a fancy title of \" + exec.getTitle();\n   case Manager m -> \"A manager\
  \ with a bonus of \" + m.getBonus();\n   default -> \"A lowly employee with a salary\
  \ of \" + e.getSalary();\n}\n```\n\n与 `instanceof` 模式一样，每个类型模式都会声明一个变量。\n\n![Images](img/caution)\
  \ 注意\n\n与局部变量一样，`instanceof` 模式定义的局部变量可能会遮蔽字段。例如：\n\n点击此处查看代码图像\n\n```\nclass Value\n\
  {\n...\n```\n\n### 5.1.10 保护\n\n正如你所知，类的字段最好标记为 `private`，方法通常标记为 `public`。任何为 `private`\
  \ 的特性在其他类中都是不可访问的。在本章开头解释过的，子类也是如此：子类无法访问父类的私有字段。\n\n然而，有时你想限制方法仅供子类使用，或者较少地允许子类方法访问父类字段。在这种情况下，你将类特性声明为\
  \ `protected`。例如，如果父类 `Employee` 将 `hireDay` 字段声明为 `protected` 而不是 `private`，那么\
  \ `Manager` 方法就可以直接访问它。\n\n在 Java 中，`protected` 字段对相同包中的任何类都是可见的。现在考虑不同包的 `Administrator`\
  \ 子类。`Administrator` 类的方法只能查看 `Administrator` 对象的 `hireDay` 字段，不能查看其他 `Employee`\
  \ 对象。这种限制是为了防止你通过创建子类来滥用 `protected` 机制。\n\n在实践中，请谨慎使用 `protected` 字段。假设你的类被其他程序员使用，并且你在设计时使用了保护字段。在你不知道的情况下，其他程序员可能会从你的类派生并开始访问你的保护字段。在这种情况下，你无法在不扰扰那些程序员的情况下更改类的实现。这违背了面向对象编程（OOP）的精神，OOP\
  \ 鼓励数据封装。\n\n\n\n受保护方法更有意义。如果一个方法使用起来很复杂，类可以将其声明为 `protected`。这意味着子类（推测它们很了解自己的祖类）可以被信赖并正确地使用该方法，而其他类则不能。\n\
  \n这种方法的一个很好的例子是 `Object` 类的 `clone` 方法——更多细节请参阅第 6 章。\n\n![Images](img/cnote.jpg)\
  \ C++ 笔记\n\n正如前面提到的，Java 中的受保护特性对所有子类可见，同时也对同一个包中的所有其他类可见。这与 C++ 中 `protected` 的含义略有不同，它使得\
  \ Java 中 `protected` 的概念比 C++ 更不安全。\n\n以下是 Java 四种访问控制修饰符的总结：\n\n1.  仅类内可见（`private`）。\n\
  2.  对所有人可见（`public`）。\n3.  包内及所有子类可见（`protected`）。\n4.  包内可见——（不幸的）默认值。不需要修饰符。\n\
  \n## 5.2 Object：宇宙超类\n\n`Object` 类是终祖先——Java 中的每一个类都继承自 `Object`。然而，你永远不需要写出\n\n\
  点击此处查看代码图像\n\n```\npublic class Employee extends Object\n```\n\n如果没有显式提到超类，终极超类\
  \ `Object` 是被视为所当然的。由于 Java 中的*每一个*类都继承自 `Object`，因此熟悉 `Object` 类提供的服务是非常重要的。我在本章中将介绍基础方法；对于未涵盖的内容请查阅后面的章节或查看在线文档。（`Object`\
  \ 的某些方法仅在处理并发时才会出现——参见第 12 章）。\n\n### 5.2.1 `Object` 类型的变量\n\n你可以使用 `Object` 类型的变量来引用任何类型的对象：\n\
  \n点击此处查看代码图像\n\n```\nObject obj = new Employee(\"Harry Hacker\", 35000);\n```\n\n\
  当然，`Object` 类型的变量只有作为任意值的通用容器时才有用。要对该值进行任何特定操作，你需要对原始类型有一定的了解并应用强制类型转换：\n\n```\n\
  Employee e = (Employee) obj;\n```\n\n在 Java 中，只有*基本类型*（数字、字符和 `boolean` 值）的值不是对象。\n\
  \n所有的数组类型，无论是对象数组还是基本类型数组，都是继承自 `Object` 类的类型。\n\n点击此处查看代码图像\n\n```\nEmployee[]\
  \ staff = new Employee[10];\nobj = staff; // OK\nobj = new int[10]; // OK\n```\n\
  \n![Images](img/cnote.jpg) C++ 笔记\n\n在 C++ 中，没有宇宙根类。然而，每个指针都可以转换为 `void*` 指针。\n\n\
  ### 5.2.2 `equals` 方法\n\n`Object` 类中的 `equals` 方法测试一个对象是否被认为与另一个相等。在 `Object` 类中实现的\
  \ `equals` 方法判断两个对象引用是否相同。这是一个非常合理的默认值——如果两个对象是相同的，它们理应该是相等的。对于许多类来说，不需要其他操作。例如，比较两个\
  \ `PrintStream` 对象是否相等几乎没有意义。然而，你通常会实现基于状态的等性测试，即当两个对象具有相同状态时，它们被认为是相等的。\n\n例如，假设如果两个员工具有相同的姓名、薪水和入职日期，他们就是相等的。（在实际的员工数据库中，比较\
  \ ID 会更合理。我使用这个例子来演示实现 `equals` 方法的机制。）\n\n点击此处查看代码图像\n\n```\npublic class Employee\n\
  {\n   . . .\n   public boolean equals(Object otherObject)\n   {\n      // 快速测试对象是否相同\n\
  \      if (this == otherObject) return true;\n\n      // 如果显式参数为 null，必须返回 false\n\
  \      if (otherObject == null) return false;\n\n      // 如果类不匹配，它们就不相等\n      if\
  \ (getClass() != otherObject.getClass())\n         return false;\n\n      // 现在我们知道\
  \ otherObject 是一个非空的 Employee\n      Employee other = (Employee) otherObject;\n\n\
  \      // 测试字段是否具有相同的值\n      return name.equals(other.name)\n         && salary\
  \ == other.salary\n         && hireDay.equals(other.hireDay);\n   }\n}\n```\n\n\
  `getClass` 方法返回对象的类——我们将在本章稍些之后详细讨论此方法。在我们的测试中，两个对象只有在属于同一个类时才相等。\n\n![Images](img/tip.jpg)\
  \ 提示\n\n为了防止 `name` 或 `hireDay` 为 `null` 的可能，请使用 `Objects.equals` 方法。`Objects.equals(a,\
  \ b)` 在两个参数都为 `null` 时返回 `true`，如果只有一个为 `null` 则返回 `false`，否则调用 `a.equals(b)`。使用该方法，`Employee.equals`\
  \ 方法的最后一条语句变为\n\n点击此处查看代码图像\n\n```\nreturn Objects.equals(name, other.name)\n  \
  \ && salary == other.salary\n   && Objects.equals(hireDay, other.hireDay);\n```\n\
  \n当你为子类定义 `equals` 方法时，首先调用超类的 `equals`。如果该测试没有通过，那么对象就不可能相等。点击此处查看代码图像\n\n```\n\
  public class Employee\n{\n   . . .\n   public boolean equals(Object otherObject)\n\
  \   {\n      if (!super.equals(otherObject)) return false;\n      // super.equals\
  \ 检查了 this 和 otherObject 是否属于同一类\n      Employee other = (Employee) otherObject;\n\
  \      // ...\n   }\n}\n```\n\n![Images](img/note.jpg) 注意\n\n回想第 4 章中记录（record）是一种完全由字段定义的特殊形式类。记录自动定义了\
  \ `equals` 方法，当相应字段相等时相等。\n\n### 5.2.3 等性测试与继承\n\n当隐含和显式参数不属于同一个类时，`equals` 方法应该如何表现？这一直是一个争议领域。在前面的示例中，如果类不匹配，`equals`\
  \ 返回 `false`。但许多程序员使用 `instanceof` 测试：\n\n点击此处查看代码图像\n\n```java\nif (!(otherObject\
  \ instanceof Employee)) return false;\n```\n\n这留下了 `otherObject` 可能属于子类的可能性。然而，这种方法会带来麻烦。原因如下。Java\
  \ 语言规范要求 `equals` 方法具有以下属性：\n\n1.  自反性（reflexive）：对于任何非空引用 `x`，`x.equals(x)` 应该返回\
  \ `true`。\n2.  对称性（symmetric）：对于任何引用 `x` 和 `y`，当 `x.equals(y)` 返回 `true` 且仅当 `y.equals(x)`\
  \ 返回 `true` 时相等。\n3.  传递性（transitive）：对于任何引用 `x`、`y` 和 `z`，如果 `x.equals(y)` 返回 `true`\
  \ 且 `y.equals(z)` 返回 `true`，则 `x.equals(z)` 应该返回 `true`。\n4.  一致性（consistent）：如果\
  \ `x` 和 `y` 引用的对象没有发生变化，则重复调用 `x.equals(y)` 返回相同的值。\n5.  对于任何非空引用 `x`，`x.equals(null)`\
  \ 应该返回 `false`。\n\n这些规则无疑是合理的。你不希望库实现者在数据结构中查找元素时，苦恼是调用 `x.equals(y)` 还是 `y.equals(x)`。\n\
  \n然而，对称规则在参数属于不同类时会有微妙的后果。考虑如下调用\n\n```\ne.equals(m)\n```\n\n\n\n其中 `e` 是一个 `Employee`\
  \ 对象，而 `m` 是一个 `Manager` 对象，两者恰好具有相同的姓名、工资和入职日期。如果 `Employee.equals` 使用了 `instanceof`\
  \ 测试，则调用返回 `true`。但这意味着反向调用\n\n```\nm.equals(e)\n```\n\n也需要返回 `true`——对称性规则不允许它返回\
  \ `false` 或抛出异常。\n\n这让 `Manager` 类陷入了困境。它的 `equals` 方法必须愿意与任何 `Employee` 进行比较，而又不考虑\
  \ `Manager` 特有的信息！突然之间，`instanceof` 测试看起来没没以前那么有吸引力了。\n\n一些作者公开记录表示，`getClass()`\
  \ 测试是错误的，因为它违背了替换原则。一个被经常引用的例子是 `AbstractSet` 类中的 `equals` 方法，它用于测试两个集合是否具有相同的元素。`AbstractSet`\
  \ 类有两个具体的子类：`TreeSet` 和 `HashSet`，它们使用不同的算法来定位集合元素。你确实希望能够比较任何两个集合，无论它们是如何实现的。\n\
  \n然而，集合的例子相当特殊。将 `AbstractSet.equals` 声明为 `final` 是有意义的，因为不应该允许重新定义集合等性的语义。（该方法实际上并不是\
  \ `final`。这允许子类为等性测试实现更高效的算法。）\n\n在我看来，存在两种截然不同的场景：\n\n*   如果子类可以有自己的等性概念，那么对称性要求就会迫使你使用\
  \ `getClass()` 测试。\n*   如果等性概念在父类中是固定的，那么你可以使用 `instanceof` 测试，并允许不同子类的对象相互相等。\n\
  \n在员工和经理的示例中，当两个对象的字段匹配时，我们认为它们是相等的。如果我们有两个 `Manager` 对象，具有相同的姓名、工资和入职日期，但奖金不同，我们希望它们是不同的。因此，我们使用\
  \ `getClass()` 测试。\n\n但假设我们使用员工 ID 进行等性测试。这种等性概念对所有子类都是意义的。那么我们就可以使用 `instanceof`\
  \ 测试，并且我们应该将 `Employee.equals` 声明为 `final`。\n\n![Images](img/note.jpg) 注意\n\n标准\
  \ Java 库包含了 150 多个 `equals` 方法的实现，混合了使用 `instanceof`、调用 `getClass()`、捕获 `ClassCastException`\
  \ 或什么都不做的方法。查看 `java.sql.Timestamp` 类的 API 文档，实现者在其中尴尬地注释道，他们让自己陷入了困境。`Timestamp`\
  \ 类继承自 `java.util.Date`，后者的 `equals` 方法使用了 `instanceof` 测试，而无法重写 `equals` 使其既满足对称性又准确。\n\
  \n这里是编写完美的 `equals` 方法的配方：\n\n1.  将显式参数命名为 `otherObject`——稍后，你需要将其强制转换为另一个变量，并将其命名为\
  \ `other`。\n2.  测试 `this` 是否与 `otherObject` 相同：\n\n    点击此处查看代码图像\n\n    ```\n \
  \   if (this == otherObject) return true;\n    ```\n\n    这条语句仅仅是一种优化。在实践中，这是一种常见情况。检查身份比比较字段要便宜得多。\n\
  3.  测试 `otherObject` 是否为 `null`，如果是，则返回 `false`。此测试是必须的。\n\n    点击此处查看代码图像\n\n \
  \   ```\n    if (otherObject == null) return false;\n    ```\n\n4.  比较 `this` 和\
  \ `otherObject` 的类。如果 `equals` 的语义可以在子类中发生变化，请使用 `getClass()` 测试：\n\n    点击此处查看代码图像\n\
  \n    ```\n    if (getClass() != otherObject.getClass()) return false;\n    ClassName\
  \ other = (ClassName) otherObject;\n    ```\n\n    如果*所有*子类都保持相同的语义，你可以使用 `instanceof`\
  \ 测试：\n\n    点击此处查看代码图像\n\n    ```\n    if (!(otherObject instanceof ClassName other))\
  \ return false;\n    ```\n\n    注意，如果 `instanceof` 测试成功，它会将 `other` 设置为 `otherObject`。不需要强制转换。\n\
  5.  现在根据你的等性概念比较字段。对于原始类型字段使用 `==`，对于对象字段使用 `Objects.equals`。如果所有字段匹配，则返回 `true`，否则返回\
  \ `false`。\n\n    点击此处查看代码图像\n\n    ```\n    return field1 == other.field1\n   \
  \    && Objects.equals(field2, other.field2)\n       && . . .;\n    ```\n\n    如果你在子类中重写\
  \ `equals`，请包含对 `super.equals(other)` 的调用。\n\n![Images](img/tip.jpg) 提示\n\n如果你有数组类型的字段，可以使用静态方法\
  \ `Arrays.equals` 来检查相应的数组元素是否相等。对于多维数组，使用 `Arrays.deepEquals` 方法。\n\n![Images](img/caution.jpg)\
  \ 注意\n\n这是实现 `equals` 方法时的一个常见错误。你能发现问题所在？\n\n```\npublic class Employee\n{\n  \
  \ public boolean equals(Object other)\n   {\n      if (this == other) return true;\n\
  \      if (other == null) return false;\n      if (getClass() != other.getClass())\
  \ return false;\n      Employee other = (Employee) other;\n      return name.equals(other.name)\n\
  \         && Objects.equals(salary, other.salary)\n         && Objects.equals(hireDate,\
  \ other.hireDate);\n   }\n}\n```\n\n如果你在 `Employee` 类中添加以下内容，编译器会报告错误：\n\n```java\n\
  public class Employee\n{\n   @Override\n   public boolean equals(Manager other)\n\
  \   {\n      if (this == other) return true;\n      if (other == null) return false;\n\
  \      if (getClass() != other.getClass()) return false;\n      // ...\n   }\n}\n\
  ```\n\n你可以通过对打算重写的方法标记 `@Override` 来保护自己不受此类错误：\n\n```java\npublic class Employee\n\
  {\n   @Override\n   public boolean equals(Object other)\n   {\n      if (this ==\
  \ other) return true;\n      if (other == null) return false;\n      if (getClass()\
  \ != other.getClass()) return false;\n      Employee other = (Employee) other;\n\
  \      return name.equals(other.name)\n         && Objects.equals(salary, other.salary)\n\
  \         && Objects.equals(hireDate, other.hireDate);\n   }\n}\n```\n\n### 5.2.4\
  \ `hashCode` 方法\n\n哈希值是从对象产生的整数。哈希值应该是随机的——如果 `x` 和 `y` 是两个不同的对象，那么 `x.hashCode()`\
  \ 和 `y.hashCode()` 不同的概率很大。表 5.1 列出了 `String` 类 `hashCode` 方法产生的几个哈希值示例。\n\n`String`\
  \ 类使用以下算法计算哈希值：\n\n```java\nint hash = 0;\nfor (int i = 0; i < length(); i++)\n\
  \   hash = 31 * hash + charAt(i);\n```\n\n|  | 哈希值 |\n| --- | --- |\n| `Hello` |\
  \ 69609650 |\n| `Harry` | 69496448 |\n| `Hacker` | -2141031506 |\n\n**表 5.1** `hashCode`\
  \ 方法生成的哈希值\n\n`hashCode` 方法定义在 `Object` 类中。因此，每个对象都有默认的哈希值。该哈希值是从对象的内存地址产生的。考虑这个示例：\n\
  \n点击此处查看代码图像\n\n\n\n\n\n```\nvar s = \"Ok\";\nvar sb = new StringBuilder(s);\nSystem.out.println(s.hashCode()\
  \ + \" \" + sb.hashCode());\nvar t = new String(\"Ok\");\nvar tb = new StringBuilder(t);\n\
  System.out.println(t.hashCode() + \" \" + tb.hashCode());\n```\n\n表 5.2 显示了结果。\n\
  \n| 对象 | Hash Code | 对象 | Hash Code |\n| --- | --- | --- | --- |\n| `s` | `2556`\
  \ | `t` | `2556` |\n| `sb` | `20526976` | `tb` | `20527144` |\n\n**表 5.2** String\
  \ 和 StringBuilder 的哈希码\n\n注意，字符串 `s` 和 `t` 具有相同的哈希码，因为对于字符串来说，哈希码是根据其 `contents`\
  \ 产生的。StringBuilder `sb` 和 `tb` 有不同的哈希码，因为 `StringBuilder` 类没有定义 `hashCode` 方法，而\
  \ `Object` 类中的默认 `hashCode` 方法是根据对象的内存地址产生哈希码的。\n\n如果你重新定义了 `equals` 方法，你还需要为可能插入到哈希表的对象重新定义\
  \ `hashCode` 方法。（我在第 9 章中讨论了哈希表。）\n\n`hashCode` 方法应该返回一个整数（可以是负数）。只需将实例字段的哈希码结合起来，使得不同对象的哈希码可能广泛地分布。\n\
  \n例如，这里是 `Employee` 类的 `hashCode` 方法：\n\n点击此处查看代码图像\n\n```java\npublic class Employee\n\
  {\n   public int hashCode()\n   {\n      return 7 * name.hashCode()\n         +\
  \ 11 * Double.valueOf(salary).hashCode()\n         + 13 * hireDay.hashCode();\n\
  \   }\n   . . .\n}\n```\n\n但是，你可以做得更好。首先，使用空安全的方法 `Objects.hashCode`。如果其参数为 `null`，它返回\
  \ `0`；否则返回对参数调用 `hashCode` 的结果。此外，使用静态方法 `Double.hashCode` 来避免创建 `Double` 对象：\n\n\
  点击此处查看代码图像\n\n```java\npublic int hashCode()\n{\n   return 7 * Objects.hashCode(name)\n\
  \      + 11 * Double.hashCode(salary)\n      + 13 * Objects.hashCode(hireDay);\n\
  }\n```\n\n更好的是，当你需要结合多个哈希值时，调用 `Objects.hash` 并传入所有值。它会为每个参数调用 `Objects.hashCode`\
  \ 并结合这些值。那么 `Employee.hashCode` 方法简单来说：\n\n点击此处查看代码图像\n\n```java\npublic int hashCode()\n\
  {\n   return Objects.hash(name, salary, hireDay);\n}\n```\n\n你对 `equals` 和 `hashCode`\
  \ 的定义必须是兼容的：如果 `x.equals(y)` 为 `true`，那么 `x.hashCode()` 返回的值必须与 `y.hashCode()` 相同。例如，如果你定义\
  \ `Employee.equals` 来比较员工 ID，那么 `hashCode` 方法就需要对 ID 进行哈希，而不是姓名或内存地址。\n\n![图像](img/tip.jpg)\
  \ 提示\n\n如果你有数组类型的字段，可以使用静态方法 `Arrays.hashCode` 来计算一个由数组元素哈希码组成的哈希码。\n\n![图像](img/note.jpg)\
  \ 备注\n\n`record` 类型自动提供一个 `hashCode` 方法，该方法根据字段值的哈希码推导出哈希码。\n\n![图像](img/caution.jpg)\
  \ 注意\n\n如果实例变量的可能取值范围很小，你需要尽可能获得不同的哈希码。考虑日期的哈希。计算 `7 * year + 11 * month + 13 *\
  \ day` 会产生很多冲突。相比之下，`31 * 12 * year + 31 * month + day` 是一个“完美哈希函数”。假设在一个合理的范围内，没有两个日期具有相同的哈希码。（`LocalDate`\
  \ 类的实际 `hashCode` 方法支持 ±999,999,999 年的范围，要复杂得多。）\n\n**`java.lang.Object`** **1.0**\n\
  \n*   `int hashCode()`\n    返回此对象的哈希码。哈希码可以是任何整数，正数或负数。相等的对象需要返回相同的哈希码。\n\n**`java.util.Objects`**\
  \ **7**\n\n*   `static int hash(Object... objects)`\n    返回一个由所有提供的对象的哈希码结合而成的哈希码。\n\
  \n*   `static int hashCode(Object a)`\n    如果 `a` 为 `null` 则返回 `0`，否则返回 `a.hashCode()`。\n\
  \n**`java.lang.` (`Integer`|`Long`|`Short`|`Byte`|`Double`|`Float`|`Character`|`Boolean`)**\
  \ **1.0**\n\n*   `static int hashCode(xxx value)` **8**\n    返回给定值的哈希码。这里 `xxx`\
  \ 是与给定的包装类型对应的基本类型。\n\n**`java.util.Arrays`** **1**\n\n*   `static int hashCode(xxx\
  \ a)`\n    计算数组元素哈希码的哈希码。\n\n### 5.2 `toString` 方法\n\n`toString` 方法是无处不在的：当对象通过“+”运算符与字符串连接时，Java\
  \ 编译器会自动调用 `toString` 方法以获取对象的字符串表示。例如：\n\n```java\nvar p = new Point(10, 20);\n\
  String message = \"当前位置是 \" + p;\n// 自动调用 p.toString()\n```\n\n`Object` 类定义 `toString`\
  \ 方法来打印对象的类名和哈希码。例如，调用\n\n```java\nSystem.out.println(System.out)\n```\n\n产生的输出看起来如下：\n\
  \n```\njava.io.PrintStream@2f6684\n```\n\n原因是 `PrintStream` 类的实现者没有去重写 `toString`\
  \ 方法。\n\n大多数（但不是所有）`toString` 方法遵循这种格式：这里是 `Employee` 类的 `toString` 方法：\n\n```java\n\
  public String toString()\n{\n   return \"Employee[\" + name\n         + \",salary=\"\
  \ + salary\n         + \",hireDay=\" + hireDay + \"]\";\n```\n\n实际上，你可以做得更好。首先，使用空安全的方法\
  \ `Objects.hashCode`。如果其参数为 `null`，它返回 `0`；否则返回对参数调用 `hashCode` 的结果。此外，使用静态 `Double.hashCode`\
  \ 方法来避免创建 `Double` 对象：\n\n```java\npublic int hashCode()\n{\n   return 7 * Objects.hashCode(name)\n\
  \      + 11 * Double.hashCode(salary)\n      + 13 * Objects.hashCode(hireDay);\n\
  }\n```\n\n这种对于子类也是有效的。当然，子类程序员应该定义自己的 `toString` 方法并添加子类字段。例如，这里是 `Manager` 类的 `toString`\
  \ 方法：\n\n```java\npublic class Manager extends Employee\n{\n   . . .\n   public\
  \ String toString()\n   {\n      return super.toString()\n         + \"[bonus=\"\
  \ + bonus + \"]\";\n   }\n}\n```\n\n现在一个 `Manager` 对象被打印为：\n\n```\nManager[name=.,salary=.,hireDay=][bonus=.]\n\
  ```\n\n\n\n\n\n点击此处查看代码图像\n\n```\nint[] luckyNumbers = { 2, 3, 5, 7, 11, 13 };\n\
  String s = \"\" + luckyNumbers;\n```\n\n产生了字符串 `\"I@1a46e30\"`。（前缀 `[I` 表示这是一个整数数组）。解决办法是调用静态的\
  \ `Arrays.toString` 方法。该代码：\n\n[点击此处查看代码图像\n\n```\nString s = Arrays.toString(luckyNumbers);\n\
  ```\n\n产生了字符串 `\"[2, 3, 5, 7, 11, 13]\"`。\n\n要正确打印多维数组（即数组的数组），请使用 `Arrays.deepToString`。\n\
  \n`toString` 方法是日志记录的极佳工具。标准类库中的许多类都定义了 `toString` 方法，以便你可以获取关于对象状态的有用信息。这在记录如下所示日志消息时特别有用：\n\
  \n点击此处查看代码图像\n\n```\nSystem.out.println(\"Current position = \" + position);\n```\n\
  \n正如第 7 章所解释的，更好的解决方案是使用 `Logger` 类的对象并调用\n\n点击此处查看代码图像\n\n```\nLogger.global.info(\"\
  Current position = \" + position);\n```\n\n![Images](img/tip.jpg) 提示\n\n我强烈建议你为你编写的每个类添加一个\
  \ `toString` 方法。你以及其他使用你类的程序员都会对这种日志支持表示感激的。\n\n然而，对于 `record` 类型，已经提供了一个 `toString`\
  \ 方法。它简单地列出了类名以及字段名及其字符串化后的值。\n\n列表 5.4 中的程序测试了 `Employee` 类（列表 5.5）和 `Manager`\
  \ 类（列表 5.6）的 `equals`、`hashCode` 和 `toString` 方法。\n\n**列表 5.4** `equals/EqualsTest.java`\n\
  \n点击此处查看代码图像\n\n```\n 1 package equals;\n 2\n 3 /**\n 4  * 此程序演示了 equals 方法。\n 5\
  \  * @version 1.12 2012-01-26\n 6  * @author Cay Horstmann\n 7  */\n 8 public class\
