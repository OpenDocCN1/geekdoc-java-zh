  \    调整此窗口的大小，考虑到其组件的首选尺寸。\n\n#### 10.3.1 使用 2D 形状操作\n\n从 Java 1.0 开始，`Graphics`\
  \ 类拥有绘制直线、矩形、椭圆等的方法。但那些绘制操作非常有限。我们将改用 `Java 2D` 库中的形状类。\n\n要使用此库，你需要获取一个 `Graphics2D`\
  \ 类的对象。该类是 `Graphics` 类的子类。从 Java 1.2 开始，像 `paintComponent` 这样的方法会自动接收 `Graphics2D`\
  \ 类的对象。只需使用类型转换，如下：\n\n点击此处查看代码图像\n\n```java\npublic void paintComponent(Graphics\
  \ g)\n{\n   Graphics2D g2 = (Graphics2D) g;\n   . . .\n}\n```\n\nJava 2D 库以面向对象的方式组织几何形状。特别是，有专门用于表示直线、矩形和椭圆的类：\n\
  \n```\nLine2D\nRectangle2D\nEllipse2D\n```\n\n这些类都实现了 `Shape` 接口。Java 2D 库支持更复杂的形状——弧、二次和三次曲线以及通用路径——这些我们在本章中不会进行讨论。\n\
  \n要绘制一个形状，你首先创建一个实现了 `Shape` 接口类的对象，然后调用 `Graphics2D` 类的 `draw` 方法。例如：\n\n```java\n\
  Rectangle2D rect = . . .;\ng2.draw(rect);\n```\n\nJava 2D 库使用浮点坐标而不是整数来表示像素。内部计算使用单精度\
  \ `float` 数量进行。单精度已经足够了——毕竟，几何计算的最终目的是在屏幕或打印机上设置像素。只要任何舍入误差保持在一个像素以内，视觉结果就不会受到影响。\n\
  \n然而，对于程序员来说，操作 `float` 值有时是不方便的，因为 Java 坚决地要求在将 `double` 值转换为 `float` 值时必须进行类型转换。例如，考虑以下语句：\n\
  \n点击此处查看代码图像\n\n```java\nfloat f = (float) 1.2;\n```\n\n\n\n最后，来自 Java 1.0 的几个遗留类被整合到了形状类层次结构中。`Rectangle`\
  \ 和 `Point` 类存储具有整数坐标的矩形和点，它们继承了 `Rectangle2D` 和 `Point2D` 类。\n\n图 10.7 显示了形状类之间的关系。然而，省略了\
  \ `Double` 和 `Float` 子类。遗留类用灰色填充标记。\n\n![Images](img/10fig07.jpg)\n\n**图 10.7**\
  \ 形状类之间的关系\n\n`Rectangle2D` 和 `Ellipse2D` 对象的构造非常简单。你只需要指定：\n\n- 左上角的 `x` 和 `y`\
  \ 坐标；以及\n- 宽度和高度。\n\n对于椭圆，这些值指的是它的外接矩形。例如，\n\n点击此处查看代码图像\n\n```\nvar e = new Ellipse2D.Double(150,\
  \ 200, 100, 50);\n```\n\n构造了一个由矩形边界的椭圆，该矩形的左上角位于 (150, 200)，宽度为 100，高度为 50。\n\n\
  在构造椭圆时，你通常知道中心点、宽度和高度，但不知道外接矩形的顶点（这些顶点甚至不在椭圆上）。`setFrameFromCenter` 方法使用中心点，但它仍然需要四个顶点之一。因此，你通常会按如下方式构造椭圆：\n\
  \n点击此处查看代码图像\n\n```\nvar ellipse =\n   new Ellipse2D.Double(centerX - width / 2,\
  \ centerY - height / 2, width, height);\n```\n\n要构造一条线，你需要提供起点和终点，可以作为 `Point2D`\
  \ 对象或数字对提供：\n\n点击此处查看代码图像\n\n```\nvar line = new Line2D.Double(start, end);\n```\n\
  \n或者\n\n点击此处查看代码图像\n\n```\nvar line = new Line2D.Double(startX, startY, endX, endY);\n\
  ```\n\n代码列表 10.3 中的程序绘制了一个矩形、一个包含在矩形内的椭圆、矩形的对角线以及一个与矩形中心相同的圆。图 10.8 显示了结果。\n\n![Images](img/10fig08.jpg)\n\
