  ```\n\n`java.lang.Thread`\n* `Thread(Runnable target)`: 构造一个新线程并调用指定目标的 `run()`\
  \ 方法。\n* `void start()`: 启动此线程，导致 `run()` 方法被调用。此方法会立即返回。新线程并发运行。\n* `void run()`:\
  \ 调用关联 `Runnable` 的 `run` 方法。\n* `static void sleep(long millis)`: 睡眠指定的毫秒数。\n\n\
  `java.lang.Runnable`\n* `void run()`: 必须被重写，并为你想要执行的任务提供指令。\n\n### 12.2 线程状态\n\n\
  线程可以处于六种状态之一：\n\n* 新生 (New)\n* 可运行 (Runnable)\n* 阻塞 (Blocked)\n* 等待 (Waiting)\n\
  * 定时等待 (Timed waiting)\n* 终止 (Terminated)\n\n接下来的章节将解释这些状态中的每一种。要确定线程的当前状态，只需调用\
  \ `getState` 方法即可。\n\n#### 12.2.1 新生线程\n\n当你使用 `new` 算符创建线程时——例如 `new Thread(r)`——线程尚未运行。这意味着它处于\
  \ `new` 状态。当线程处于新生状态时，程序尚未开始在其内部执行。在线程运行之前，需要完成一些簿记工作。\n\n#### 12.2.2 可运行线程\n\n\
  一旦你调用 `start` 方法，线程就处于 `runnable` 状态。一个可运行线程可能正在运行，也可能没有。取决于操作系统是否给予线程运行时间。（不过，Java\
  \ 规范并没有将其称为一个独立的状态。运行中的线程仍然处于 `runnable` 状态。）\n\n线程一旦运行，并不一定持续运行下去。事实上，让运行中的线程偶尔暂停以便其他线程有机会运行是有利的。线程调度的细节取决于操作系统提供的服务。抢占式调度系统为每个可运行线程分配时间片来执行其任务。当时间片耗尽时，操作系统会抢占该线程并给另一个线程工作的机会（请参见图\
  \ 12.2）。在选择下一个线程时，操作系统会考虑线程优先级——更多信息请参阅第 763 页第 12.3.5 节节“线程优先级”。\n\n所有现代桌面和服务器操作系统都使用抢占式调度。然而，手机等小型设备可能使用协作式调度。在这样的设备中，线程只有在调用\
  \ `yield` 方法或被阻塞或等待时才会失去控制。\n\n在具有多个处理器的机器上，每个处理器都可以运行一个线程，你可以让多个线程并行运行。当然，如果线程多于处理器，调度器仍然必须进行时间分片。\n\
  \n始终记住，可运行线程在任何给定时间可能正在运行也可能没有运行。（这就是为什么该状态被称为“runnable”而不是“running”。）\n\n`java.lang.Thread`\n\
  * `static void yield()`: 导致当前执行的线程让位于另一个线程。注意这是一个静态方法。\n\n#### 12.2.3 阻塞和等待线程\n\n\
  当线程被阻塞或等待时，它是暂时不活跃的。它不执行任何代码并消耗极少的资源。激活它取决于线程调度器。细节取决于如何进入不活跃状态。\n\n* 当线程尝试获取一个由其他线程持有的内部对象锁（而不是\
  \ `java.util.concurrent` 库中的 `Lock`）时，它变为 `blocked`。（我们在第 12.4.3 节中讨论 `java.util.concurrent`\
  \ 锁，请参阅第 769 页的“锁对象”；在第 12.4.5 节中讨论内部对象锁，请参阅第 778 页的“synchronized 关键字”。）当所有其他线程都释放锁且线程调度器允许该线程持有锁时，线程将解除阻塞。\n\
  \n* 当线程等待另一个线程调度器某个条件时，它进入 `waiting` 状态。我们在第 12.4.4 节中讨论条件——请参阅第 772 页的“条件对象”。这通过调用\
  \ `Object.wait` 或 `Thread.join` 方法，或者等待 `java.util.concurrent` 库中的 `Lock` 或 `Condition`\
  \ 来实现。在实践中，阻塞状态和等待状态之间的差异并不显著。\n\n\n\n\n\n*   若干方法具有超时参数。调用这些方法会导致线程进入*计时等待*（timed\
  \ waiting）状态。该状态一直持续直到超时过期或收到适当的通知。带有超时方法的包括 `Thread.sleep` 以及 `Object.wait`、`Thread.join`、`Lock.tryLock`\
  \ 和 `Condition.await` 的超时版本。\n\n图 12.1 显示了线程可以处于的状态以及从一个状态到另一个状态的可能转换。当线程阻塞或等待时（当然，当它终止时），另一个线程会被调度运行。当线程被重新激活时（例如，因为超时过期或成功获取了锁），调度器会检查其优先级是否高于当前运行的线程。如果是，它将抢占其中一个当前线程，并选择一个新线程运行。\n\
  \n![Images](img/12fig01.jpg)\n\n**图 12.1** 线程状态\n\n### 12.2.4 终止的线程\n\n线程的终止有两个原因：\n\
  \n*   由于 `run` 方法正常退出，它自然死亡。\n*   由于未捕获的异常终止了 `run` 方法，它异常死亡。\n\n特别，你可以通过调用其 `stop`\
  \ 方法来杀死线程。该方法会抛出一个 `ThreadDeath` 错误对象并杀死该线程。然而，`stop` 方法已被废弃，你不应该在自己的代码中调用它。\n\n\
  #### `java.lang.Thread` **1.0**\n\n*   `void join()`\n    等待指定的线程终止。\n*   `void\
  \ join(long millis)`\n    等待指定的线程死亡或通过指定的毫秒数。\n*   `Thread.State getState()` **5**\n\
  \    获取此线程的状态：`NEW`、`RUNNABLE`、`BLOCKED`、`WAITING`、`TIMED_WAITING` 或 `TERMINATED`\
  \ 之一。\n*   `void stop()`\n    停止线程。该方法已被废弃。\n*   `void suspend()`\n    挂起此线程的执行。该方法已被标记为即将移除。\n\
  *   `void resume()`\n    恢复此线程的执行。该方法仅在调用 `suspend()` 后才有效。该方法已被标记为即将移除。\n\n###\
  \ 12.3 线程属性\n\n在接下来的章节中，我们将讨论线程的各种属性：中断状态、守护线程、未捕获异常的处理器，以及一些你不应该使用的旧版功能。\n\n####\
  \ 12.3.1 中断线程\n\n线程在其 `run` 方法返回时终止——通过执行 `return` 语句、在执行完方法体中的最后语句后，或者如果发生了方法中未被捕获的异常。在\
  \ Java 的初始版本中，还有一个 `stop` 方法，另一个线程可以调用它来终止线程。然而，该方法现在已由于废弃。我们将在第 12.4.12 节 节的“为什么\
  \ `stop` 和 `suspend` 方法被废弃”中讨论其原因，位于第 793 页。\n\n除了废弃的 `stop` 方法外，没有其他强制终止线程的方法。然而，可以使用\
  \ `interrupt` 方法来*请求*终止线程。\n\n当在线程上调用 `interrupt` 方法时，该线程的*中断状态*会被设置。这是一个存在于每个线程中的\
  \ `boolean` 标志位。每个线程都应该偶尔检查自己是否被中断。\n\n要检查中断状态是否被设置，首先调用静态方法 `Thread.currentThread`\
  \ 来获取当前线程，然后调用 `isInterrupted` 方法：\n\n点击此处查看代码图像\n\n```\nwhile (!Thread.currentThread().isInterrupted()\
  \ && more work to do)\n{\n   do more work\n}\n```\n\n然而，如果线程处于阻塞状态，它无法检查中断状态。这就是\
  \ `InterruptedException` 出现的地方。当在一个在 `sleep` 或 `wait` 等调用上阻塞的线程上调用 `interrupt` 方法时，阻塞调用将被\
  \ `InterruptedException` 终止。（某些阻塞的 I/O 调用是无法被中断的；你应该考虑可中断的替代方案。详情请参见第二卷的第 2 章和第\
  \ 4 章。）\n\n语言并没有要求被中断的线程必须终止。中断线程仅仅是引起它的注意。被中断的线程可以决定如何对中断做出反应。某些线程非常重要，它们应该处理异常并继续执行。但通常情况下，线程会简单地将中断解释为终止请求。此类线程的\
  \ `run` 方法具有如下形式：\n\n点击此处查看代码图像\n\n```\nRunnable r = () ->\n   {\n      try\n  \
  \    {\n         . . .\n         while (!Thread.currentThread().isInterrupted()\
  \ && more work to do)\n         {\n            do more work\n         }\n      }\n\
  \      catch(InterruptedException e)\n      {\n         // 线程在 sleep 或 wait 期间被中断\n\
  \      }\n      finally\n      {\n         如果需要，进行清理\n      }\n      }\n```\n\n\n\
  \n\n\n*   `static boolean interrupted()`\n\n    测试*当前*线程（即正在执行此指令的线程）是否被中断。请注意，这是一个静态方法。该调用具有副作用——它会将当前线程的中断状态重置为\
  \ `false`。\n\n*   `boolean isInterrupted()`\n\n    测试某个线程是否被中断。与 `static interrupted`\
  \ 方法不同，此调用不会改变线程的中断状态。\n\n*   `static Thread currentThread()`\n\n    返回代表当前执行的线程的\
  \ `Thread` 对象。\n\n#### 12.3.2 守护线程\n\n你可以通过调用以下方法将线程转变为*守护线程*：\n\n```java\nt.setDaemon(true);\n\
  ```\n\n这种线程并没有什么“恶魔”的特性。守护线程仅仅是一个除了服务他人之外没有其他角色的线程。例如，向其他线程发送定期“定时器滴答”的定时器线程，或者清理过期缓存条目的线程。当只剩下守护线程时，虚拟机就会退出。如果所有剩余线程都是守护线程，那么让程序继续运行就没有意义。\n\
  \n**`java.lang.Thread`** **1.0**\n\n*   `void setDaemon(boolean isDaemon)`\n\n \
  \   将此线程标记为守护线程或用户线程。此方法必须在线程启动之前调用。\n\n#### 12.3.3 线程名称\n\n默认情况下，线程具有易于记忆的名字，如\
  \ `Thread-2`。你可以使用 `setName` 方法设置任何名称：\n\n```java\nvar t = new Thread(runnable);\n\
  t.setName(\"Web crawler\");\n```\n\n这在线程转储（thread dumps）中非常有用。\n\n#### 12.3.4 未捕获异常的处理器\n\
  \n线程的 `run` 方法不能抛出任何检查异常（checked exceptions），但它可以被未检查异常所终止。在这种情况下，线程会死亡。\n\n然而，没有\
  \ `catch` 句可以传播异常。相反，在线程死亡之前，异常会被传递给未捕获异常的处理器。\n\n该处理器必须属于实现로 `Thread.UncaughtExceptionHandler`\
  \ 接口的类。该接口有一个方法：\n\n点击查看代码图片\n\n```java\nvoid uncaughtException(Thread t, Throwable\
  \ e)\n```\n\n你可以使用 `setUncaughtExceptionHandler` 方法为任何线程安装处理器。你也可以使用 `Thread` 类的静态方法\
  \ `setDefaultUncaughtExceptionHandler` 为所有线程安装默认处理器。替换的处理器可以使用日志 API 将未捕获异常的报告发送到日志文件中。\n\
  \n如果你没有安装默认处理器，则默认处理器即为 `null`。但是，如果你没有为单个线程安装处理器，则处理器是该线程的 `ThreadGroup` 对象。\n\n\
  ![图像](img/note.jpg) 注意\n\n线程组（thread group）是一组可以共同管理的线程集合。默认情况下，你创建的所有线程都属于同一个线程组，但也可以建立其他的分组。由于现在有了更好的功能来操作线程集合，我建议不要在程序中使用线程组。\n\
  \n`ThreadGroup` 类实现了 `Thread.UncaughtExceptionHandler` 接口。它的 `uncaughtException`\
  \ 方法会执行以下操作：\n\n1.  如果线程组有父线程组，则调用父线程组的 `uncaughtException` 方法。\n2.  否则，如果 `Thread.getDefaultUncaughtExceptionHandler`\
  \ 方法返回一个非 `null` 处理器，则调用它。\n3.  否则，如果 `Throwable` 是 `ThreadDeath` 的实例，则什么都不会发生。\n\
  4.  否则，将线程名称和 `Throwable` 的堆栈轨迹打印在 `System.err` 上。\n\n这就是你已经在程序中无疑见过很多次的堆栈轨迹。\n\n\
  **`java.lang.Thread`** **1.0**\n\n*   `static void setDefaultUncaughtExceptionHandler(Thread.UncaughtExceptionHandler\
  \ handler)` **5**\n\n*   `static Thread.UncaughtExceptionHandler getDefaultUncaughtExceptionHandler()`\
  \ **5**\n\n    设置或获取未捕获异常的默认处理器。\n\n*   `void setUncaughtExceptionHandler(Thread.UncaughtExceptionHandler\
  \ handler)` **5**\n\n*   `Thread.UncaughtExceptionHandler getUncaughtExceptionHandler()`\
  \ **5**\n\n    设置或获取未捕获异常的处理器。如果没有安装处理器，则线程组对象即为处理器。\n\n**`java.lang.Thread.UncaughtExceptionHandler`**\
  \ **5**\n\n*   `void uncaughtException(Thread t, Throwable e)`\n\n    定义用于在线程因未捕获异常终止时记录自定义报告。\n\
  \n**`java.lang.ThreadGroup`** **1.0**\n\n*   `void uncaughtException(Thread t, Throwable\
  \ e)`\n\n    如果有父线程组，则调用父线程组的此方法；如果有默认处理器，则调用 `Thread` 类的默认处理器；否则将堆栈轨迹打印到标准错误流。（然而，如果\
  \ `e` 是 `ThreadDeath` 对象，则会抑制堆栈轨迹。`ThreadDeath` 对象是由已废弃的 `stop` 方法生成的。）\n\n####\
  \ 12.3.5 线程优先级\n\n在 Java 编程语言中，每个线程都有一个*优先级*。默认情况下，线程继承构造它的线程的优先级。你可以使用 `setPriority`\
  \ 方法增加或减少任何线程的优先级。你可以将优先级设置为 `MIN_PRIORITY`（在 `Thread` 类中定义为 `1`）和 `MAX_PRIORITY`（定义为\
  \ `10`）之间的任何值。`NORM_PRIORITY` 定义为 `5`。\n\n## 12.4 同步\n\n在大多数实际线程应用程序，两个或多个线程需要共享访问相同的数据。如果两个线程访问同一个对象，并且都调用修改对象状态的方法会发生什么？正如你想象的，线程可能会互相干扰。这种情况通常被称为*竞态条件*（race\
  \ condition）。\n\n#### 12.4.1 竞态条件的示例\n\n为了避免多个线程对共享数据的损坏，你必须学会如何*同步访问*。在本节中，你将看到如果不同步会发生什么。在下一节中，你将看到如何同步数据访问。\n\
  \n在下一个测试程序中，我们继续使用我们的模拟银行。与第 12.1 节“什么是线程”第 748 页中的示例不同，我们随机选择转账的源和目的地。由于这会导致问题，让我们仔细查看\
  \ `Bank` 类中 `transfer` 方法的代码。\n\n点击查看代码图片\n\n\n\n\n\n```java\npublic void transfer(int\
  \ from, int to, double amount)\n   // 警告：从多线程调用时是不不安全的\n{\n   System.out.print(Thread.currentThread());\n\
  \   accounts[from] -= amount;\n   System.out.printf(\" %10.2f from %d to %d\", amount,\
  \ from, to);\n   accounts[to] += amount;\n   System.out.printf(\" Total Balance:\
  \ %10.2f%n\", getTotalBalance());\n}\n```\n\n这里是 `Runnable` 实例的代码。`run` 方法不断地从指定的银行账户中取出资金。在每次迭代中，`run`\
  \ 方法会随机选择一个目标账户和随机金额，调用银行对象的对象的 `transfer` 方法，然后休眠。\n\n点击此处查看代码图片\n\n```java\nRunnable\
