  \ 应插入的位置。\n- `static void fill([] a, v)` 将数组的所有元素设置为 `v`。\n- `static boolean equals([]\
  \ a, [] b)` 如果数组长度相同且对应元素匹配则返回 `true`。\n\n### 3.10.7 多维数组\n\n多维数组使用多个索引来访问元素。它们用于表格和其他复杂的布局。在需要这种存储机制之前，你可以安全地跳过本节。\n\
