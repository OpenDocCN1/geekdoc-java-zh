  11  import javax.swing.JScrollPane;\n12  import javax.swing.JTextArea;\n13  import\
  \ javax.swing.JTextField;\n14  import javax.swing.SwingConstants;\n15\n16  /**\n\
  17   * 一个包含示例文本组件的框架。\n18   */\n19  public class TextComponentFrame extends JFrame\n\
