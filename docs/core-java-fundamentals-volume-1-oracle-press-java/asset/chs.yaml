  26        var textField = new JTextField();\n27        var passwordField = new JPasswordField();\n\
  28\n29        var northPanel = new JPanel();\n30        northPanel.setLayout(new\
  \ GridLayout(2, 2));\n31        northPanel.add(new JLabel(\"User name: \", SwingConstants.RIGHT));\n\
