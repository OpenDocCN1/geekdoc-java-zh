  \ `true`。\n* `E previous()`\n    返回上一个对象。如果已到达列表开头，则抛出 `NoSuchElementException`。\n\
  * `int nextIndex()`\n    返回下次调用 `next()` 将返回的元素索引。\n* `int previousIndex()`\n  \
  \  返回下次调用 `previous()` 将返回的元素索引。\n\n### `java.util.LinkedList<E>` 1.2\n\n* `LinkedList()`\n\
  \    构造一个空链表。\n* `LinkedList(Collection<? extends E> elements)`\n    构造一个链表并添加集合中的所有元素。\n\
  * `void addFirst(E element)`\n* `void addLast(E element)`\n    在列表的开头或结尾添加一个元素。\n\
  * `E getFirst()`\n* `E getLast()`\n    返回列表开头或结尾的元素。\n* `E removeFirst()`\n* `E\
  \ removeLast()`\n    删除并返回列表开头或结尾的元素。\n\n#### 9.3.2 Array Lists\n\n在前面的章节中，你看到了\
  \ `List` 接口和实现它的的 `LinkedList` 类。`List` 接口描述了一个有序集合，其中元素的位置非常重要。访问元素有两种协议：通过迭代器以及通过\
  \ `get()` 和 `set()` 方法进行随机访问。后者并不适用于链表，但对于数组来说，`get()` 和 `set()` 是非常有意义的。集合库提供了熟悉的\
  \ `ArrayList` 类，它也实现了 `List` 接口。`ArrayList` 封装了一个动态重新分配内存的对象数组。\n\n![Images](img/note.jpg)\
  \ 备注\n\n如果你是一位资深 Java 程序员，在需要动态数组时可能一直使用 `Vector` 类。为什么要使用 `ArrayList` 而不是 `Vector`\
  \ 呢？原因非常简单：`Vector` 类的所有方法都是*同步的*。从两个线程访问 `Vector` 对象是安全的。但如果你只从单个线程访问向量——这在目前是常见得多的情况——你的代码会在同步操作上浪费大量时间。相比之下，`ArrayList`\
  \ 的方法不是同步的。我建议在不需要同步的情况下，尽可能使用 `ArrayList` 而不是 `Vector`。\n\n#### 9.3.3 Hash Sets\n\
  \n链表和数组允许你指定想要排列元素的顺序。然而，如果你在寻找某个特定元素且不记得它的位置，你就需要访问所有元素直到找到匹配项为止。如果集合包含许多元素，这可能会非常耗时。如果你不在乎元素的顺序，则有一些数据结构可以让你更快地找到元素。缺点是，这些数据结构无法对元素出现的顺序进行任何控制。这些数据结构按照方便自身用途的顺序来组织元素。\n\
  \n快速查找对象的已知数据结构是*哈希表*（hash table）。哈表为每个对象计算一个称为*哈希码*（hash code）的整数。哈希码以某种方式从对象的实例字段派生，最好是使得不同数据的对象产生不同的代码。表\
  \ 9.2 列出了 `String` 类 `hashCode()` 方法产生的一些哈希码示例。\n\n**表 9.2** 由 `hashCode` 方法产生的哈希码\n\
  \n| String | Hash Code |\n| --- | --- |\n| `\"Lee\"` | `76268` |\n| `\"lee\"` |\
  \ `107020` |\n| `\"eel\"` | `100300` |\n\n如果你定义了自己的类，则你需要负责实现你自己的 `hashCode()` 方法——更多信息请参阅第\
  \ 5 章。你的实现需要与 `equals()` 方法兼容：如果 `a.equals(b)`，那么 `a` 和 `b` 必须具有相同的哈希码。\n\n现在重要的是，哈希码可以被快速计算，且该计算仅取决于需要哈希处理的对象的状态，而不依赖于哈希表中的其他对象。\n\
  \n在 Java 中，哈希表被实现为链表的数组。每个列表被称为一个*桶*（bucket）（参见图 9.10）。要找到对象在表中的位置，计算它的哈希码并对桶的总数取模。得到的数字就是存放该元素的桶的索引。例如，如果一个对象的哈希码为\
  \ 76268 且有 128 个桶，那么该对象被放置在 108 号桶中（因为余数 `76268 % 128` 是 108）。也许你很幸运，该桶中没有其他元素。那么你只需插入该元素即可。\n\
  \n\n\n\n\nJava 集合库提供了一个 `HashSet` 类，它实现了一个基于哈希表的集合。你使用 `add` 方法添加元素。`contains` 方法被重写，以便快速查找以判断某个元素是否已存在于集合中。它只检查单个桶（bucket）中的元素，而不是集合中的所有元素。\n\
  \n哈希集合迭代器会依次访问所有的桶。由于哈希处理会将元素散布在表中，因此它们被访问的顺序看起来是随机的。如果你不在乎集合中元素的顺序，你就可以使用 `HashSet`。\n\
  \n本节末尾的示例程序（Listing 9.2）从 `System.in` 读取单词，将其添加到集合中，并最后打印集合中的前二十个单词。例如，你可以通过命令行终端启动程序，并将来自*爱丽丝仙境游记*的文本输入给程序（你可以从[`www.gutenberg.org`](http://www.gutenberg.org)\
  \ 获取）：\n\n```\njava SetTest < alice30.txt\n```\n\n程序读取输入中的所有单词并将其添加到哈希集合中。然后，它遍历集合中的唯一单词并最后打印出一个计数。（*爱丽丝仙境游记*有\
  \ 5,909 个唯一单词，包括开头的版权声明。）这些单词以随机顺序出现。\n\n![Images](img/caution.jpg) 注意\n\n在变异集合元素时要小心。如果元素的哈希值发生变化，该元素将不再处于数据结构的正确位置。\n\
  \n**Listing 9.2** `set/SetTest.java`\n\n点击此处查看代码图片\n\n```\n 1 package set;\n 2\n\
  \ 3 import java.util.*;\n 4\n 5 /**\n 6  * 此程序使用集合打印 System.in 中所有的唯一单词。\n 7  *\
  \ @version 1.12 2015-06-21\n 8  * @author Cay Horstmann\n 9  */\n10 public class\
  \ SetTest\n11 {\n12    public static void main(String[] args)\n13    {\n14     \
  \  var words = new HashSet<String>();\n15       long totalTime = 0;\n16\n17    \
  \   try (var in = new Scanner(System.in))\n18       {\n19          while (in.hasNext())\n\
  20          {\n21             String word = in.next();\n22             long callTime\
  \ = System.currentTimeMillis();\n23             words.add(word);\n24           \
  \  callTime = System.currentTimeMillis() - callTime;\n25             totalTime +=\
  \ callTime;\n26          }\n27       }\n28\n29       Iterator<String> iter = words.iterator();\n\
  30       for (int i = 1; i <= 20 && iter.hasNext(); i++)\n31          System.out.println(iter.next());\n\
  32       System.out.println(\". . .\");\n33       System.out.println(words.size()\
  \ + \" distinct words. \" + totalTime + \" milliseconds.\");\n34   }\n35 }\n```\n\
  \n**`java.util.HashSet<E>`** **1.2**\n\n*   `HashSet()`\n\n    构造一个空的哈希集合。\n\n*\
  \   `HashSet(Collection<? extends E> elements)`\n\n    构造一个哈希集合并添加集合中的所有元素。\n\n\
  *   `HashSet(int initialCapacity)`\n\n    构造一个具有指定容量（桶的数量）的空哈希集合。\n\n*   `HashSet(int\
  \ initialCapacity, float loadFactor)`\n\n    构造一个具有指定容量和负载因子的空哈希集合。如果大小/容量超过负载因子，哈希表将重新哈希到一个更大的表中。\n\
  \n**`java.lang.Object`** **1.0**\n\n*   `int hashCode()`\n\n    返回此对象的哈希值。哈希值可以是任意整数，正负均可。`equals`\
  \ 和 `hashCode` 的定义必须兼容：如果 `x.equals(y)` 为 `true`，那么 `x.hashCode()` 的值必须与 `y.hashCode()`\
  \ 相同。\n\n#### 9.3.4 Tree Sets\n\n`TreeSet` 类与哈希集合类似，但增加了一项改进。树集合是一个*有序集合*。你可以以任何顺序将元素插入集合中。当你遍历集合时，值将按排序顺序自动呈现。例如，假设你插入了三个字符串，然后访问你添加的所有元素。\n\
  \n点击此处查看代码图片\n\n```\nvar sorter = new TreeSet<String>();\nsorter.add(\"Bob\");\n\
  sorter.add(\"Amy\");\nsorter.add(\"Carl\");\nfor (String s : sorter) System.out.println(s);\n\
  ```\n\n然后，值按排序顺序打印：`Amy Bob Carl`。正如类名所示，排序是通过树形数据结构实现的。（当前的实现使用了*红黑树*。关于红黑树的详细描述，请参见例如\
  \ Thomas Cormen、Charles Leiserson、Ronald Rivest 和 Clifford Stein 所出的 *Introduction\
  \ to Algorithms*, The MIT Press, 2009。）每当元素被添加到树中时，它都会被放置在正确的排序位置。因此，迭代器始终按排序顺序访问元素。\n\
  \n向树中添加元素比向哈希表中添加元素慢——比较请参见表 9.3。但它仍然比在数组或链链表中检查重复项要快得多。如果树包含 *n* 个元素，则平均需要 log[2]\
  \ **n* 次比较来为新元素找到正确位置。例如，如果树已经包含 1,000 个元素，添加新元素大约需要 10 次比较。\n\n![Images](img/note.jpg)\
  \ 注意\n\n为了使用树集合，你必须能够比较元素。元素必须实现 `Comparable` 接口，或者你需要在构造集合时提供一个 `Comparator`。（`Comparable`\
  \ 和 `Comparator` 接口在第 6 章中引入。）\n\n**表 9.3** 向哈希和树集合添加元素\n\n| 文档 | 单词总数 | 唯一单词数 |\
  \ HashSet | TreeSet |\n\n| --- | --- | --- | --- | --- |\n| *爱丽丝仙境游记* | 28,195 |\
  \ 5,909 | 5 秒 | 7 秒 |\n| *基督山伯爵* | 46,300 | 37,545 | 75 秒 | 98 秒 |\n\n如果你回顾表 9.3，你可能会很好奇自己是否应该始终使用树集合而不是哈希集合。毕竟，添加元素似乎并没有慢多少，而且元素是自动排序的。答案取决于你正在收集的数据。如果你不需要数据排序，就没有理由为排序开销买单。更重要的是，对于某些数据，制定排序顺序比制定哈希函数困难得多。哈希函数只需要对对象进行相当不错的打乱，而比较函数必须能够精确地区分对象。\n\
  \n为了使这种区别更具体，考虑收集一组矩形的任务。如果你使用 `TreeSet`，你需要提供一个 `Comparator<Rectangle>`。你如何比较两个矩形？按面积？这不可通。你可以拥有坐标不同但面积相同的矩形。树的排序必须是*全序*。任何两个元素都必须是比较的，且只有在元素相等时比较结果才为零。矩形确实有这样的排序顺序（其坐标的字典序），但计算起来不自然且复杂。相比之下，`Rectangle`\
  \ 类已经定义了哈希函数。它只需哈希坐标。\n\n从 Java 6 开始，`TreeSet` 类实现了 `NavigableSet` 接口。该接口为定位元素和反向遍历提供了几种方便的方法。详情请参见\
  \ API 注释。\n\nListing 9.3 中的程序构建了两个 `Item` 对象的树集合。第一个按零件号排序，这是 `Item` 对象的默认排序顺序。第二个集合按描述排序，使用自定义的比较器。\n\
  \n\n\n\n\n```java\npackage treeSet;\n\nimport java.util.*;\n\n/**\n * 此程序通过比较描述对一组\
  \ Item 对象进行排序。\n * @version 1.13 2018-04-10\n * @author Cay Horstmann\n */\npublic\
  \ class TreeSetTest\n{\n    public static void main(String[] args)\n    {\n    \
  \   var parts = new TreeSet<Item>();\n       parts.add(new Item(\"Toaster\", 1234));\n\
  \       parts.add(new Item(\"Widget\", 4562));\n       parts.add(new Item(\"Modem\"\
  , 9912));\n       System.out.println(parts);\n\n       var sortByDescription = new\
  \ TreeSet<Item>(Comparator.comparing(Item::getDescription));\n\n       sortByDescription.addAll(parts);\n\
  \       System.out.println(sortByDescription);\n    }\n}\n```\n\n**列表 9.4** `treeSet/Item.java`\n\
  \n点击此此处查看代码图像\n\n```java\npackage treeSet;\n\nimport java.util.*;\n\n/**\n * 具有描述和零件号的项目。\n\
  \ */\npublic class Item implements Comparable<Item>\n{\n  private String description;\n\
  \  private int partNumber;\n\n  /**\n   * 构造项目。\n   * @param aDescription 项目的描述\n\
  \   * @param aPartNumber 项目的零件号\n   */\n  public Item(String aDescription, int aPartNumber)\n\
  \  {\n     description = aDescription;\n     partNumber = aPartNumber;\n  }\n\n\
  \  /**\n   * 获取此项目的描述。\n   * @return 描述信息\n   */\n  public String getDescription()\n\
  \  {\n    return description;\n  }\n\n  public String toString()\n  {\n    return\
  \ \"[description=\" + description + \", partNumber=\" + partNumber + \"]\";\n  }\n\
  \n  public boolean equals(Object otherObject)\n  {\n    if (this == otherObject)\
  \ return true;\n    if (otherObject == null) return false;\n    if (getClass() !=\
  \ otherObject.getClass()) return false;\n    var other = (Item) otherObject;\n \
  \   return Objects.equals(description, other.description) && partNumber == other.partNumber;\n\
  \  }\n\n  public int hashCode()\n  {\n    return Objects.hash(description, partNumber);\n\
  \  }\n\n  public int compareTo(Item other)\n  {\n    int diff = Integer.compare(partNumber,\
  \ other.partNumber);\n    return diff != 0 ? diff : description.compareTo(other.description);\n\
  \  }\n}\n```\n\n### `java.util.TreeSet<E>` 1.2\n\n* `TreeSet()`\n* `TreeSet(Comparator<?\
  \ super E> comparator)` 构建一个空的树集合。\n* `TreeSet(Collection<? extends E> elements)`\n\
  * `TreeSet(SortedSet<E> s)` 构造一个树集合并添加集合或排序集合中的所有元素（对于后者，使用相同的排序）。\n\n### `java.util.SortedSet<E>`\
  \ 1.2\n\n* `Comparator<? super E> comparator()` 返回用于排序元素的比较器；如果元素是通过 `Comparable`\
  \ 接口的 `compareTo` 方法进行比较的，则返回 `null`。\n* `E first()`\n* `E last()` 返回排序集合中最小或最大的元素。\n\
  \n### `java.util.NavigableSet<E>` 6\n\n* `E higher(E value)`\n* `E lower(E value)`\
  \ 返回大于 `value` 的最小元素或小于 `value` 的最大元素；如果没有这样的元素则返回 `null`。\n* `E ceiling(E value)`\n\
  * `E floor(E value)` 返回大于等于 `value` 的最小元素或小于等于 `value` 的最大元素；如果没有这样的元素则返回 `null`。\n\
  * `E pollFirst()`\n* `E pollLast()` 移除并返回集合中最小或最大的元素；如果集合为空则返回 `null`。\n* `Iterator<E>\
  \ descendingIterator()` 返回一个按降序遍历此集合的迭代器。\n\n#### 9.3.5 队列和双端队列\n\n正如我们已经讨论过的，队列（queue）允许你高效地在尾部添加元素并从头部移除元素。双端队列（`deque`）允许高效地在头部和尾部添加或移除元素。不支持在中间添加元素。Java\
  \ 6 引入了 `Deque` 接口。它由 `ArrayDeque` 和 `LinkedList` 类实现，这两个类都提供了大小随需要增长的双端队列。在第 12\
  \ 章中，你将看到边界队列和双端队列。\n\n### `java.util.Queue<E>` 5\n\n* `boolean add(E element)`\n\
  * `boolean offer(E element)` 将给定元素添加到此队列的尾部，如果队列未满则返回 `true`。如果队列已满，第一个方法抛出 `IllegalStateException`，而第二个方法返回\
  \ `false`。\n* `E remove()`\n* `E poll()` 如果队列不为空，则移除并返回队列头部的元素；如果队列为空，第一个方法抛出 `NoSuchElementException`，而第二个方法返回\
  \ `null`。\n* `E element()`\n* `E peek()` 如果队列不为空，则返回队列头部的元素而不移除它；如果队列为空，第一个方法抛出\
  \ `NoSuchElementException`，而第二个方法返回 `null`。\n\n### `java.util.Deque<E>` 6\n\n* `void\
  \ addFirst(E element)`\n* `void addLast(E element)`\n* `boolean offerFirst(E element)`\n\
  * `boolean offerLast(E element)` 将给定元素添加到此队列的头部或尾部。如果队列已满，前两个方法抛出 `IllegalStateException`，而后两个方法返回\
  \ `false`。\n* `E removeFirst()`\n* `E removeLast()`\n* `E pollFirst()`\n* `E pollLast()`\
  \ 如果队列不为空，则移除并返回头部或尾部的元素；如果队列为空，前两个方法抛出 `NoSuchElementException`，而后两个方法返回 `null`。\n\
  * `E getFirst()`\n* `E getLast()`\n* `E peekFirst()`\n* `E peekLast()` 如果队列不为空，则返回头部或尾部的元素而不移除它；如果队列为空，前两个方法抛出\
  \ `NoSuchElementException`，而后两个方法返回 `null`。\n\n### `java.util.ArrayDeque<E>` 6\n\
  \n* `ArrayDeque()`\n* `ArrayDeque(int initialCapacity)` 构建一个初始容量为 16 或给定容量的无界双端队列。\n\
  \n### 9.3.6 优先级队列\n\n优先级队列（priority queue）在任意顺序插入后按排序顺序检索元素。也就是说，每当你调用 `remove`\
  \ 方法时，你都会得到当前队列中最小的元素。然而，优先级队列并没有对所有元素进行排序。如果你遍历元素，它们并不一定是有序的。优先级队列利用了一种名为堆（heap）的优雅且高效的数据结构。堆是一种自组织的二叉树，其中\
  \ `add` 和 `remove` 操作会使最小元素向根节点移动，而无需花费时间排序所有元素。\n\n优先级队列的一个典型用途是任务调度。每个任务都有一个优先级。任务按随机顺序添加。当有新任务可以启动时，从队列中移除优先级最高的任务。（由于传统上优先级\
  \ 1 是“最高”优先级，因此 `remove` 操作产生最小元素。）\n\n列表 9.5 展示了优先级队列的运行。与 `TreeSet` 的迭代不同，这里的迭代并不按顺序访问元素。然而，移除操作总是返回剩余的最小元素。\n\
  \n\n\n\n\n```java\npackage priorityQueue;\n\nimport java.util.*;\nimport java.time.*;\n\
  \n/**\n * 此程序演示了优先级队列的使用。\n * @version 1.02 2015-06-20\n * @author Cay Horstmann\n\
  \ */\npublic class PriorityQueueTest\n{\n    public static void main(String[] args)\n\
  \    {\n       var pq = new PriorityQueue<LocalDate>();\n       pq.add(LocalDate.of(1906,\
  \ 12, 9)); // G. Hopper\n       pq.add(LocalDate.of(1815, 12, 10)); // A. Lovelace\n\
  \       pq.add(LocalDate.of(1903, 12, 3)); // J. von Neumann\n       pq.add(LocalDate.of(1910,\
  \ 6, 22)); // K. Zuse\n\n       System.out.println(\"Iterating over elements . .\
  \ .\");\n       for (LocalDate date : pq)\n          System.out.println(date);\n\
  \       System.out.println(\"Removing elements . . .\");\n       while (!pq.isEmpty())\n\
  \          System.out.println(pq.remove());\n    }\n}\n```\n\n`java.util.PriorityQueue`\
  \ 5\n\n*   `PriorityQueue()`\n*   `PriorityQueue(int initialCapacity)`\n    构造一个用于存储\
  \ `Comparable` 对象的优先级队列。\n*   `PriorityQueue(int initialCapacity, Comparator<? super\
  \ E> c)`\n    构造一个优先级队列并使用指定的比较器对它的元素进行排序。\n\n## 9.4 Maps（映射）\n\n集合（Set）是一个允许你快速查找现有元素的集合。然而，要查找一个元素，你需要拥有该元素的精确副本才能找到。这并不是常见的查找方式——通常，你拥有某些键信息，并想要查找关联的元素。`map`\
  \ 数据结构正是为此设计的。map 存储键/值对。如果你提供键，就可以找到对应的值（value）。例如，你可能会存储一个员工记录表，其中键是员工 ID，值是 `Employee`\
  \ 对象。在接下来的章节中，你将学习如何操作 map。\n\n### 9.4.1 基础 Map 操作\n\nJava 库提供了两个通用的 map 实现：`HashMap`\
  \ 和 `TreeMap`。这两个类都实现了 `Map` 接口。\n\nhash map 对键进行哈希处理，而 tree map 则使用键的排序来将它们组织在搜索树中。哈希函数或比较函数*仅应用于键*。与键关联的值不会被进行哈希处理或比较。\n\
  \n你应该选择 hash map 还是 tree map 呢？和集合一样，哈希处理通常要快一点，如果你不需要按照排序顺序访问键，那么它是首选方案。\n\n以下是如何设置一个用于存储员工的\
  \ hash map 的：\n\n点击此处查看代码图片\n\n```java\nvar staff = new HashMap<String, Employee>();\n\
  var harry = new Employee(\"Harry\");\nstaff.put(\"987-9996\", harry);\n. .\n```\n\
  \n每当你向 map 中添加一个对象时，都必须提供一个键（key）。在我们的案例中，键是一个字符串，对应值是一个 `Employee` 对象。要检索对象，你必须使用（并记住）该键。\n\
  \n点击此处查看代码图片\n\n```java\nvar id = \"987-9996\";\nEmployee e = staff.get(id); //\
  \ gets harry\n```\n\n如果 map 中没有存储特定键的信息，`get` 返回 `null`。`null` 返回值可能会带来不便。有时，你有一个很好的默认值，可以用于\
  \ map 中不存在的键。这种情况下请使用 `getOrDefault` 方法。\n\n点击此处查看代码图片\n\n```java\nMap<String, Integer>\
  \ scores = . .\nint score = scores.getOrDefault(id, 0); // gets 0 if not present\n\
  ```\n\n键必须是唯一的。你不能使用相同的键存储两个值。如果你用相同的键调用两次 `put` 方法，第二个值将替换第一个值。事实上，`put` 返回与其键关联的旧值。`remove`\
  \ 方法从 map 中删除具有给定键的元素。`size` 方法返回 map 中条目的数量。遍历 map 的键和值最简单的方法是 `forEach` 方法。提供一个接收键和值的\
  \ Lambda 表达式。该表达式会依次为 map 中的每个条目被调用。\n\n点击此处查看代码图片\n\n```java\nscores.forEach((k,\
  \ v) ->\n   System.out.println(\"key=\" + k + \", value=\" + v));\n```\n\n列表 9.6\
  \ 展示了 map 的工作原理。我们首先向 map 添加键/值对。然后，我们从 map 中删除一个键，这也会删除其关联的值。接下来，我们更改与键关联的值，并调用\
  \ `get` 方法来查找值。最后，我们遍历条目集（entrySet）。\n\n**列表 9.6** `map/MapTest.java`\n\n点击此处查看代码图片\n\
  \n```java\npackage map;\n\nimport java.util.*;\n\n/**\n * 此程序演示了键类型为 String、值类型为\
  \ Employee 的 map 使用。\n * @version 1.12 2015-06-21\n * @author Cay Horstmann\n */\n\
  public class MapTest\n{\n    public static void main(String[] args)\n    {\n   \
  \    var staff = new HashMap<String, Employee>();\n       staff.put(\"144-25-5464\"\
  , new Employee(\"Amy Lee\"));\n       staff.put(\"567-24-2546\", new Employee(\"\
  Harry Hacker\"));\n       staff.put(\"157-62-7935\", new Employee(\"Gary Cooper\"\
  ));\n       staff.put(\"456-62-5527\", new Employee(\"Francesca Cruz\"));\n\n  \
  \     // print all entries\n       System.out.println(staff);\n\n       // remove\
  \ an entry\n       staff.remove(\"567-24-2546\");\n\n       // replace an entry\n\
  \       staff.put(\"456-62-5527\", new Employee(\"Francesca Miller\"));\n\n    \
  \   // look up a value\n       System.out.println(staff.get(\"157-62-7935\"));\n\
  \n       // iterate through all entries\n       staff.forEach((k, v) ->\n      \
  \    System.out.println(\"key=\" + k + \", value=\" + v));\n    }\n}\n```\n\n`java.util.Map<K,\
  \ V>` 1.2\n\n*   `V get(Object key)`\n    获取与键关联的值；如果 map 中未找到该键，则返回 `null`。\n*\
  \   `default V getOrDefault(Object key, V defaultValue)`\n    获取与键关联的值；如果 map 中未找到该键，则返回\
  \ `defaultValue`。\n*   `V put(K key, V value)`\n    将键值关联放入 map 中。如果键已存在，新对象将替换之前与键关联的对象。此方法返回键的旧值，如果之前不存在，则返回\
  \ `null`。实现类可能不允许 `null` 键或值。\n*   `void putAll(Map<? extends K, ? extends V> entries)`\n\
  \    将指定 map 的所有条目添加到此 中。\n*   `boolean containsKey(Object key)`\n    如果 map 中存在该键，则返回\
  \ `true`。\n*   `boolean containsValue(Object value)`\n    如果 map 中存在该值，则返回 `true`。\n\
  *   `default void forEach(BiConsumer<? super K,? super V> action)` 8\n    对 map\
  \ 中的所有键/值对应用操作。\n\n`java.util.HashMap<K, V>` 1.2\n\n*   `HashMap()`\n*   `HashMap(int\
  \ initialCapacity)`\n*   `HashMap(int initialCapacity, float loadFactor)`\n    构造一个具有指定容量和负载因子的空\
  \ hash map（0.0 到 1.0 之间的数字，决定了哈希表在达到多少百分比填充率时重新哈希为更大的表）。默认负载因子为 `0.75`。\n\n`java.util.TreeMap<K,V>`\
  \ 1.2\n\n*   `TreeMap()`\n    构造一个实现 `Comparable` 接口的空 tree map。\n*   `TreeMap(Comparator<?\
  \ super K> c)`\n    构造一个 tree map 并使用指定的比较器对键进行排序。\n*   `TreeMap(Map<? extends K,\
  \ ? extends V> entries)`\n    构造一个 tree map 并添加 map 的所有条目。\n*   `TreeMap(SortedMap<?\
  \ extends K, ? extends V> entries)`\n    构造一个 tree map，添加排序 map 的所有条目，并使用与给定排序 map\
  \ 相同的元素比较器。\n\n\n\n\n\n# `java.util.SortedMap<K, V>` 1.2\n\n*   `Comparator<? super\
  \ K> comparator()`\n    返回用于排序键的比较器；如果键是通过 `Comparable` 接口的 `compareTo` 方法进行比较的，则返回\
  \ `null`\n\n*   `K firstKey()`\n\n*   `K lastKey()`\n    返回 map 中最小或最大的键。\n\n###\
  \ 9.4.2 更新 Map 条目\n\n处理 map 时一个棘手的部分是更新条目。通常，你获取与键关联的旧值，更新它，然后将更新后的值放回去。但你必须考虑键第一次出现的特殊情况。考虑使用\
  \ map 来统计一个单词在文件中出现的次数。当我们看到一个单词时，想要像这样增加计数器：\n\n点击此处查看代码图片\n\n```\ncounts.put(word,\
  \ counts.get(word) + 1);\n```\n\n这种方法可以工作，但在 `word` 第一次遇到时除外。此时 `get` 返回 `null`，并抛出\
  \ `NullPointerException`。\n\n简单的补救方法是使用 `getOrDefault` 方法：\n\n点击此处查看代码图片\n\n```\n\
  counts.put(word, counts.getOrDefault(word, 0) + 1);\n```\n\n另一种方法是先调用 `putIfAbsent`\
  \ 方法。它只有在键之前不存在（或映射到 `null`）时才会放入一个值。\n\n点击此处查看代码图片\n\n```\ncounts.putIfAbsent(word,\
  \ 0);\ncounts.put(word, counts.get(word) + 1); // 现在我们知道 get 将成功了\n```\n\n但你可以做得更好。`merge`\
  \ 方法简化了这种常用操作。调用\n\n点击此处查看代码图片\n\n```\ncounts.merge(word, 1, Integer::sum);\n```\n\
  \n如果该键之前不存在，则将 `word` 与 `1` 关联；否则，则使用 `Integer::sum` 函数将旧值和 `1` 合并。\n\nAPI 备注描述了其他不常用的更新\
  \ map 条目的的方法。\n\n## `java.util.Map<K, V>` 1.2\n\n*   `default V merge(K key, V value,\
  \ BiFunction<? super V,? super V,? extends V> remappingFunction)` `8`\n    如果 `key`\
  \ 关联一个非-`null` 值 `v`，则将函数应用于 `v` 和 `value`，并将 `key` 与结果关联，或者如果结果为 `null`，则移除该键。否则，将\
  \ `key` 与 `value` 关联。返回 `get(key)`。\n\n*   `default V compute(K key, BiFunction<?\
  \ super K,? super V,? extends V> remappingFunction)` 8\n    将函数应用于 `key` 和 `get(key)`。或将\
  \ `key` 与结果关联，或者如果结果为 `null`，则移除该键。返回 `get(key)`。\n\n*   `default V computeIfPresent(K\
  \ key, BiFunction<? super K,? super V,? extends V> remappingFunction)` 8\n    如果\
  \ `key` 关联一个非-`null` 值 `v`，则将函数应用于 `key` 和 `v`，并将 `key` 与结果关联，或者如果结果为 `null`，则移除该键。返回\
  \ `get(key)`。\n\n*   `default V computeIfAbsent(K key, Function<? super K,? extends\
  \ V> mappingFunction)` 8\n    除非 `key` 关联一个非-`null` 值，否则将函数应用于 `key`。或将 `key` 与结果关联，或者如果结果为\
  \ `null`，则移除该键。返回 `get(key)`。\n\n*   `default void replaceAll(BiFunction<? super\
  \ K,? super V,? extends V> function)` 8\n    对所有条目调用该函数。将键与非-`null` 结果关联，并移除结果为\
  \ `null` 的键。\n\n*   `default V putIfAbsent(K key, V value)` 8\n    如果 `key` 不存在或关联到\
  \ `null`，则将其与 `value` 关联并返回 `null`。否则返回关联的值。\n\n## 9.4.3 Map 视图\n\n集合框架并不将 map 本身视为集合。（其他数据结构框架将\
  \ map 视为键/值对的集合，或视为由键索引的值集合。）然而，你可以获取 map 的*视图*——即实现了 `Collection` 接口或其子接口之一的对象。\n\
  \n有三种视图：键的集合、值的集合（它不是集合）以及键/值对的集合。键和键/值对形成了一个集合，因为 map 中只能有一个键的副本。以下方法\n\n点击此处查看代码图片\n\
  \n```\nSet<K> keySet()\nCollection<V> values()\nSet<Map.Entry<K, V>> entrySet()\n\
  ```\n\n返回这三种视图。（entry set 的元素是实现 `Map.Entry` 接口的类的对象。）\n\n注意 `keySet` 并不是 `HashSet`\
  \ 或 `TreeSet`，而是实现 `Collection` 接口的对象。`keySet` 扩展了 `Collection` 接口。例如，你可以枚举所有的键：\n\
  \n点击此处查看代码图片\n\n```\nSet<String> keys = map.keySet();\nfor (String key : keys)\n\
  {\n   do something\n}\n```\n\n如果你想同时看到键和值，可以通过 `var` 避免使用 `Map.Entry`：\n\n点击此处查看代码图片\n\
  \n```\nfor (Map.Entry<String, String> entry : map.entrySet())\n{\n   String k =\
  \ entry.getKey();\n   String v = entry.getValue();\n   do something\n}\n```\n\n\
  或者简单使用 `forEach` 方法：\n\n点击此处查看代码图片\n\n```\nmap.forEach((k, v) ->\n   do something\n\
  \   );\n```\n\n如果你调用键集迭代器的 `remove` 方法，你实际上移除了键及其关联的值。然而，你不能向键集*添加*元素。在不添加值的情况下添加键是没有意义的。如果你尝试调用\
  \ `add` 方法，将抛出 `UnsupportedException`。\n\n## 9.4.4 弱哈希 Map\n\n集合类库有一些针对特殊需求的 map\
  \ 类，我们将在本节及后续章节中简要讨论。\n\n`WeakHashMap` 类设计用于解决一个有趣的问题。当一个键不再被程序的任何地方使用时，其值会发生什么？假设指向键的最后一个引用已经消失。那么，再没有方法可以引用该值对象了。但由于程序的任何部分都不持有该键，因此键/值对无法从\
  \ map 中移除。为什么垃圾回收器不能移除它？移除未使用的对象不是垃圾回收器的工作吗？\n\n\n\n\n遗憾的是，事情并没有那么简单。垃圾回收器会追踪 `live`（活跃）对象。只要\
  \ map 对象是活跃的，它其中的 `all`（所有）桶都是活跃的，不会被回收。因此，你的程序应该注意从长寿命 map 中移除未使用的值。或者，你可以使用 `WeakHashMap`。这种数据结构与垃圾回收器配合工作，当键的唯一引用是哈希表条目的引用时，就会移除键值对。\n\
  \n这里是该机制的内部原理。`WeakHashMap` 使用 `weak references`（弱引用）来持有键。`WeakReference` 对象持有对另一个对象的引用——在我们的例子中，是一个哈希表的键。这种类型的对象会被垃圾回收器以特殊方式处理。通常情况下，如果垃圾回收器发现某个对象没有指向它的引用，它会直接回收该对象。然而，如果该对象\
  \ `only` 通过一个 `WeakReference` 可访问，垃圾回收器仍然回收该对象，但会将指向它的弱引用放入队列中。`WeakHashMap` 的操作会定期检查该队列，看是否有新到达的弱引用。队列中出现弱引用意味着该键不再被任何人使用并已被收集。`WeakHashMap`\
  \ 随后移除关联条目。\n\n### 9.4.5 链接哈希集和映射\n\n`LinkedHashSet` 和 `LinkedHashMap` 类会记住你插入项的顺序。这样，你就可以避免哈希表中项看似随机的顺序。当条目被插入到表中时，它们会被连接进一个双向链表中（参见图\
  \ 9.11）。\n\n![Images](img/09fig11.jpg)\n\n**图 9.11** 链接哈希表\n\n### 9.4.5 链接哈希集和映射（继续）\n\
  \n例如，考虑来自列表 9.6 的以下 map 插入操作：\n\n点击此处查看代码图像\n\n```java\nvar staff = new LinkedHashMap<String,\
  \ Employee>();\nstaff.put(\"144-25-5464\", new Employee(\"Amy Lee\"));\nstaff.put(\"\
  567-24-2546\", new Employee(\"Harry Hacker\"));\nstaff.put(\"157-62-7935\", new\
  \ Employee(\"Gary Cooper\"));\nstaff.put(\"456-62-5527\", new Employee(\"Francesca\
  \ Cruz\"));\n```\n\n然后，`staff.keySet().iterator()` 按照此顺序枚举键：\n\n```\n144-25-5464\n\
  567-24-2546\n157-62-7935\n456-62-5527\n```\n\n而 `staff.values().iterator()` 按照此顺序枚举值：\n\
  \n```\nAmy Lee\nHarry Hacker\nGary Cooper\nFrancesca Cruz\n```\n\n链接哈希 map 也可以使用\
  \ `access order`（访问顺序）而非插入顺序来遍历 map 条目。每当你调用 `get` 或 `put` 时，受影响的条目会被从其当前位置移除并置于条目链表的\
  \ `end`（末尾）。（只有条目链表中的位置受影响，而不影响哈希表桶。条目始终留在与键的哈希码对应的桶中。）要构建这样的哈希 map，调用：\n\n点击此处查看代码图像\n\
  \n```java\nLinkedHashMap<K, V>(initialCapacity, loadFactor, true)\n```\n\n访问顺序常用于实现缓存的“最久未使用”策略。例如，你可能希望将频繁访问的条目保留在内存中，而从数据库读取较不频繁访问的对象。当不在表中找到条目且表已经相当满时，你可以获取表的迭代器，并移除它枚举的前几个元素。那些条目就是最久未被使用的项。\n\
  \n你甚至可以自动化该过程。创建一个 `LinkedHashMap` 的子类并重写该方法：\n\n点击此处查看代码图像\n\n```java\nprotected\
  \ boolean removeEldestEntry(Map.Entry<K, V> eldest)\n```\n\n此时，每当你的方法返回 `true` 时，添加新条目就会导致\
  \ `eldest` 条目被移除。例如，以下缓存的大小保持在最多 100 个元素以内：\n\n点击此处查看代码图像\n\n```java\nvar cache\
  \ = new LinkedHashMap<K, V>(128, 0.75F, true)\n   {\n      protected boolean removeEldestEntry(Map.Entry<K,\
  \ V> eldest)\n      {\n         return size() > 100;\n      }\n   };\n```\n\n或者，你可以考虑根据\
  \ `eldest` 条目来决定是否移除它。例如，你可能想要检查与条目一起存储的时间戳。\n\n### 9.4.6 集合和映射\n\n`EnumSet` 是一种高效的集合实现，其元素属于一个枚举类型。由于枚举类型的实例数量是有限的，`EnumSet`\
  \ 在内部被简单地实现为位位序列。如果对应的值于集合中，则该对应的位被开启。\n\n`EnumSet` 类没有公共的构造函数。使用静态工厂方法来构造集合：\n\n\
  点击此处查看代码图像\n\n```java\nenum MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY,\
  \ SUNDAY {} Day\nEnumSet<Day> days = EnumSet.of(MONDAY, TUESDAY);\nEnumSet<Day>\
  \ allDays = EnumSet.range(MONDAY, SUNDAY);\nEnumSet<Day> noDays = EnumSet.noneOf(Day.class);\n\
  EnumSet<Day> copyDays = EnumSet.copyOf(days);\n```\n\n`EnumMap` 是一个键为枚举类型的 map。它在内部被简单地实现为数组。\n\
  \n```java\nenum MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY {}\
  \ Day\nMap<Day, String> map = new EnumMap<>(Day.class);\nmap.put(MONDAY, \"Mon\"\
  );\nmap.put(TUESDAY, \"Tue\");\nmap.put(WEDNESDAY, \"Wed\");\nmap.put(THURSDAY,\
  \ \"Thu\");\nmap.put(FRIDAY, \"Fri\");\nmap.put(SATURDAY, \"Sat\");\nmap.put(SUNDAY,\
  \ \"Sun\");\n```\n\n`EnumMap` 提供了公共构造函数。使用枚举的类来构造 map。\n\n```java\nenum MONDAY,\
  \ TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY {} Day\nMap<Day, String>\
  \ map = new EnumMap<>(Day);\n```\n\n在 `EnumSet` 的 API 文档中，你会看到形式如 `E extends Enum<E>`\
  \ 的奇怪类型参数。这仅仅意味着“`E` 是枚举类型”。\n\n![Images](img/note.jpg) 注意\n\n### 9.4.7 标识哈希映射\n\
  \n`IdentityHashMap` 有非常特殊的用途。在这里，键的哈希值不通过 `hashCode` 方法计算，而是通过 `System.identityHashCode`\
  \ 方法计算。这是 `Object.hashCode` 使用从内存地址计算哈希的方法。此外，在比较对象时，`IdentityHashMap` 使用 `==` 而不是\
  \ `equals`。\n\n句话之，即使对象内容相同，它们也被视为不同的。该类用于实现对象遍历算法，例如对象序列化，在其中你希望跟踪哪些对象已经被遍历过。\n\
  \n\n\n\n* `static <E extends Enum<E>> EnumSet<E> allOf(Class<E> enumType)`\n  返回一个包含给定枚举类型所有值的可变集合。\n\
  \n* `static <E extends Enum<E>> EnumSet<E> noneOf(Class<E> enumType)`\n  返回一个初始为空的可变集合。\n\
  \n* `static <E extends Enum<E>> EnumSet<E> range(E from, E to)`\n  返回一个包含 `from`\
  \ 和 `to` 之间所有值（包含两者）的可变集合。\n\n* `static <E extends Enum<E>> EnumSet<E> of(E e) .\
  \ . .`\n\n* `static <E extends Enum<E>> EnumSet<E> of(E e1, E e2, E e3, E e4, E\
  \ e5)`\n\n* `static <E extends Enum<E>> EnumSet<E> of(E first, E... rest)`\n  返回一个包含给定元素的可变集合，这些元素不能为\
  \ `null`。\n\n* `public static <E extends Enum<E>> EnumSet<E> copyOf(EnumSet<E> s)`\n\
  \n* `public static <E extends Enum<E>> EnumSet<E> copyOf(Collection<E> c)`\n  创建一个初始包含给定元素的可变集合。在第二种方法中，`c`\
  \ 必须是 `EnumSet` 或者非空（以便确定元素类型）。\n\n### `java.util.EnumMap<K extends Enum<K>, V>`\
  \ 5\n\n* `EnumMap(Class<K> keyType)`\n  构造一个空的可变映射，其键具有给定类型。\n\n### `java.util.IdentityHashMap<K,\
  \ V>` 1.4\n\n* `IdentityHashMap()`\n\n* `IdentityHashMap(int expectedMaxSize)`\n\
  \  构造一个空的恒等哈希映射，其容量是超过 1.5 × `expectedMaxSize` 的最小 2 的幂次。（`expectedMaxSize` 的默认值为\
  \ `21`。）\n\n### `java.lang.System` 1.0\n\n* `static int identityHashCode(Object\
  \ obj)` 1.1\n  返回与 `Object.hashCode` 计算相同的哈希码（源自对象的内存地址），即使 `obj` 所属的类重新定义了 `hashCode`\
  \ 方法。\n\n### 9.5 拷贝与视图（Copies and Views）\n\n如果你查看图 9.4 和图 9.5，你可能会认为为了大量的接口和抽象类来实现极少量的具体集合类是多此一举。然而，这些图并没有说明全貌。通过使用*视图\
  \ (views)*，你可以获得实现 `Collection` 或 `Map` 接口的其他对象。你已经在映射类的 `keySet` 方法中看到过这方面的例子。乍一看，该方法似乎创建了一个新集合，填充了映射中所有的键并返回它。但事实并非如此。相反，`keySet`\
  \ 方法返回一个实现 `Set` 接口的类对象，其方法操作的是原始映射。这样的集合被称为*视图*。\n\n视图技术在集合框架中有许多实用的应用。我们将在接下来的章节中讨论这些应用。\n\
  \n#### 9.5.1 小型集合（Small Collections）\n\nJava 9 引入了静态方法，用于产生带有给定元素的集合或列表，以及带有给定键值对的映射。\n\
  \n例如，\n\n点击此处查看代码图片\n\n```\nList<String> names = List.of(\"Peter\", \"Paul\", \"\
  Mary\");\nSet<Integer> numbers = Set.of(2, 3, 5);\n```\n\n这产生了一个包含三个元素的列表和一个集合。对于映射，你可以像这样指定键和值：\n\
  \n点击此处查看代码图片\n\n```\nMap<String, Integer> scores = Map.of(\"Peter\", 2, \"Paul\"\
  , 3, \"Mary\", 5);\n```\n\n元素、键或值不能为 `null`。集合和映射的键不能重复：\n\n点击此处查看代码图片\n\n```\n\
  numbers = Set.of(13, null); // 错误--null 元素\nscores = Map.of(\"Peter\", 4, \"Peter\"\
  , 2); // 错误--重复键\n```\n\n![图片](img/caution.jpg) 注意\n\n这些集合和映射的迭代顺序不作任何保证。事实上，该顺序是故意打乱的，并使用的种子在每次虚拟机启动时都是随机的。查看这两个\
  \ `jshell` 运行结果：\n\n点击此处查看代码图片\n\n```\n$ jshell -q\njshell> Set.of(\"Peter\", \"\
  Paul\", \"Mary\")\n$1 ==> [Peter, Mary, Paul]\njshell> /exit\n$ jshell -q\njshell>\
  \ Set.of(\"Peter\", \"Paul\", \"Mary\")\n$1 ==> [Paul, Mary, Peter]\n```\n\n一些 Java\
  \ 程序员编写程序时，其正确性依赖于“实现细节永远不会改变”这一假设。这使得库的实现者很难做出有用的实现更改。在这种情况下，信息非常明确——不要编写假设元素顺序的程序。\n\
  \n`List` 和 `Set` 接口有 11 个 `of` 方法，参数个数从 0 到 10 不等。（*注：原文后续内容存在乱码，此处已根据技术语境截断处理*）\n\
  \n\n\n\n\n`Collections` 类提供了可以生成集合的**不可修改视图**（unmodifiable views）的方法。这些视图在现有集合上添加了运行时检查。如果检测到尝试修改不可修改集合的尝试，将抛出异常。\n\
  \n然而，如果原始集合发生了变化，视图会反映这些变化。这正是视图（views）与拷贝（copies）的区别。\n\n你可以通过八种方法获取不可修改视图：\n\n\
  点击此处查看代码图片\n\n```\nCollections.unmodifiableCollection\nCollections.unmodifiableList\n\
  Collections.unmodifiableSet\nCollections.unmodifiableSortedSet\nCollections.unmodifiableNavigableSet\n\
  Collections.unmodifiableMap\nCollections.unmodifiableSortedMap\nCollections.unmodifiableNavigableMap\n\
  ```\n\n每个方法都定义为基于接口工作。例如，`Collections.unmodifiableList` 作用于 `ArrayList`、`LinkedList`\
  \ 或任何实现 `List` 接口的类。\n\n例如，假设你想让代码的某部分查看但不要修改集合的内容。你可以这样做：\n\n点击此处查看代码图片\n\n```\n\
  var staff = new LinkedList<String>();\n. . .\nlookAt(Collections.unmodifiableList(staff));\n\
  ```\n\n`Collections.unmodifiableList` 方法返回一个实现 `List` 接口类的对象。它的访问方法从 `staff` 集合中检索值。当然，`lookAt`\
  \ 方法可以调用 `List` 接口的所有方法，而不仅仅是访问器。但所有的修改器方法（如 `add`）都已重新定义，其变为抛出 `UnsupportedOperationException`，而不是将调用转发给底层集合。\n\
  \n不可修改视图并不会让集合本身变为不可变的。你仍然可以通过原始引用（在本例中为 `staff`）来修改集合。你仍然可以对集合中的元素调用修改器方法。\n\n\
  视图包装的是接口（interface）而不是实际的集合对象，因此你只能访问接口中定义的方法。例如，`LinkedList` 类具有便利方法 `addFirst`\
  \ 和 `addLast`，它们并不属于 `List` 接口的一部分。这些方法无法通过不可修改视图访问。\n\n![图像](img/caution.jpg) 注意\n\
  \n`unmodifiableCollection` 方法（以及本节稍后讨论的 `synchronizedCollection` 和 `checkedCollection`\
  \ 方法）返回一个集合，其 `equals` 方法*不会*调用底层集合的 `equals` 方法。相反，它继承了 `Object` 类的 `equals` 方法，该方法仅测试对象是否相同。如果你将一个集合或列表转换为普通集合，你无法再测试内容是否相等。视图以这种方式运行，是因为在层次结构的这个级别上，相等性测试没有良好的定义。视图处理\
  \ `hashCode` 方法的方式相同。\n\n然而，`unmodifiableSet` 和 `unmodifiableList` 方法使用了底层集合的 `equals`\
  \ 和 `hashCode` 方法。\n\n### 9.5.3 子范围 (Subranges)\n\n你可以为许多集合创建子范围视图。例如，假设你有一个列表 `staff`，并想提取索引\
  \ 10 到 19 的元素。使用 `subList` 方法获取该列表子范围的视图：\n\n点击此处查看代码图片\n\n```\nList<Employee> group2\
  \ = staff.subList(10, 20);\n```\n\n第一个索引是包含的，第二个索引是不包含的——这与 `String` 类中 `substring`\
  \ 操作的参数一致。\n\n你可以对子范围应用任何操作，这些操作会自动反映到整个列表中。例如，你可以删除整个子范围：\n\n点击此处查看代码图片\n\n```\n\
  group2.clear(); // staff 缩减\n```\n\n元素会自动从 `staff` 列表中清除，且 `group2` 变为空。\n\n对于排序集合和映射，你使用排序顺序而不是元素位置来形成子范围。`SortedSet`\
  \ 接口声明了三个方法：\n\n点击此处查看代码图片\n\n```\nSortedSet<E> subSet(E from, E to)\nSortedSet<E>\
  \ headSet(E to)\nSortedSet<E> tailSet(E from)\n```\n\n这些方法返回所有大于或等于 `from` 且严格小于\
  \ `to` 的元素的子集。对于排序映射，类似的方法\n\n点击此处查看代码图片\n\n```\nSortedMap<K, V> subMap(K from,\
  \ K to)\nSortedMap<K, V> headMap(K to)\nSortedMap<K, V> tailMap(K from)\n```\n\n\
  返回映射视图，其中所有 `keys` 落在指定范围内的条目。\n\nJava 6 引入的 `NavigableSet` 接口对这些子范围操作提供了更多控制。你可以指定是否包含边界：\n\
  \n点击此处查看代码图片\n\n```\nNavigableSet<E> subSet(E from, boolean fromInclusive, E to,\
  \ boolean toInclusive)\nNavigableSet<E> headSet(E to, boolean toInclusive)\nNavigableSet<E>\
  \ tailSet(E from, boolean fromInclusive)\n```\n\n### 9.5.4 检查视图 (Checked Views)\n\
  \n检查视图旨在解决在使用泛型时可能出现的问题。正如第 8 章](#ch08.xhtml_ch8) 所解释的，实际上可以将错误类型的元素混入泛型集合。例如：\n\
  \n点击此处查看代码图片\n\n```\nvar strings = new ArrayList<String>();\nArrayList rawList =\
  \ strings; // 只有警告，不是错误\nrawList.add(new Date()); // 现在 strings 包含了 Date!\n```\n\
  \n错误的 `add` 命令在运行时不会被检测。相反，当代码的其他部分调用 `get` 并将其转换为 `String` 时，会发生类型转换异常。\n\n检查视图可以检测到这一点。如下定义安全列表：\n\
  \n点击此处查看代码图片\n\n```\nList<String> safeStrings = Collections.checkedList(strings,\
  \ String.class);\n```\n\n视图的 `add` 方法会检查插入的对象是否属于指定的类，如果不符合则立即抛出 `ClassCastException`。这样做的好处是错误出现在正确的位置：\n\
  \n点击此处查看代码图片\n\n```\nArrayList rawList = safeStrings;\nrawList.add(new Date());\
  \ // 检查列表抛出 ClassCastException\n```\n\n检查视图限于虚拟机可以执行的检查。例如，如果你有一个 `ArrayList<Pair<String>>`，你无法防止它插入\
  \ `Pair<Date>`，因为虚拟机只有一个“原始”`Pair` 类。\n\n### 9.5.5 同步视图 (Synchronized Views)\n\n\
  如果你从多个线程访问集合，你需要确保集合不会被意外损坏。例如，当一个线程尝试重新哈希元素时，另一个线程尝试添加元素，将是灾难性的。\n\n库设计师没有实现线程安全的集合类，而是使用视图机制来使普通集合安全。例如，`Collections`\
  \ 类中的静态 `synchronizedMap` 方法可以将任何映射转换为具有同步方法的 `Map`：\n\n点击此处查看代码图片\n\n```\nvar map\
  \ = Collections.synchronizedMap(new HashMap<String, Employee>());\n```\n\n现在你可以从多个线程访问\
  \ `map` 对象。`get` 和 `put` 等方法是同步的——每个方法调用完成后，另一个线程才能调用其他方法。我们在第 12 章](#ch12.xhtml_ch12)\
  \ 中更详细地讨论了数据结构同步访问的问题。\n\n### 9.5.6 关于可选操作的说明\n\n\n\n\n\n视图（view）通常具有某些限制——它可能是只读的，可能无法更改大小，或者支持删除不支持插入（例如\
  \ map 的键视图）。如果你尝试执行不适当的操作，受限的视图将抛出 `UnsupportedOperationException`。\n\n在集合（collection）和迭代器（iterator）接口的\
  \ API 文档中，许多方法被描述为“可选操作”。这似乎与接口的理念相冲突。根结底，接口的目的不就是定义类*必须*实现的方法吗？诚然，从理论角度来看，这种安排是不如意的。一个更好的解决方案可能是为只读视图和无法更改集合大小的视图设计独立的接口。然而，这将使接口数量增加三倍，库的设计者认为这是不可接受的。\n\
  \n你是否应该将这种“可选”方法的技术扩展到你自己的设计中？我不认为应该。尽管集合被频繁使用，但实现它们的编码风格在其他问题领域并不典型。集合类库的设计者必须解决一组特别严苛的冲突需求。用户希望库易于学习、方便使用、完全通用、防呆，并且同时像手编写的算法一样高效。要同时实现所有这些目标是不可能的，即使是接近也难。但在你自己的编程问题中，你很少遇到这样极端的约束。你应该能够找到不依赖于“可选”接口操作这种极端措施的解决方案。\n\
  \n### `java.util.List` 1.2\n\n* `static <E> List<E> of()` **9**\n* `static <E> List<E>\
