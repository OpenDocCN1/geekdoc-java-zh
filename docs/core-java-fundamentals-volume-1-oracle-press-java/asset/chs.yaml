  \     /**\n79      * 递归地枚举给定目录及其子目录中的所有文件。\n80      * 关于流和文件操作，请参见卷二的第 1 章和第 2 章。\n\
  81      * @param directory 统计开始枚举的目录\n82      */\n83     public static void enumerate(Path\
  \ directory) throws IOException, InterruptedException\n84     {\n85        try (Stream<Path>\
  \ children = Files.list(directory))\n86        {\n87           for (Path child :\
  \ children.toList())\n88           {\n89              if (Files.isDirectory(child))\n\
