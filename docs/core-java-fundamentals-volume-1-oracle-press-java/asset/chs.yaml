  * 1.4 Java 简史\n\n\n\n\n\n\n\n\n\n\n2. 对象化（Object-Oriented）\n4. 健壮（Robust）\n6. 架构中立（Architecture-Neutral）\n\
  8. 解释执行型（Interpreted）\n10. 多线程（Multithreaded）\n\n\n\n\n\n\n\n\n\n\n\n\n简单来说，面向对象设计是一种关注数据“对象”以及指向这些对象的接口的编程技术。用木工工作来类比，一个“面向对象”的木工主要关注他正在制作的椅子，其次才是制作椅子时使用的工具；而一个“非面向对象”的木工则首要考虑他的工具。Java\
  \ 的面向对象功能本质上与 C++ 是类似的。\n在开发 Java 时，面向对象方法已经非常成熟。Java 的面向对象特性与 C++ 相当。Java 和 C++\
  \ 之间的主要区别在于多继承，Java 用一个更简单的接口概念取代了多继承。与 C++ 相比，Java 的运行时检查能力（在第 5 章 中讨论）更为丰富。\n\
  ### 1.2.3 分布式\nJava 拥有丰富的例程库来处理 HTTP 和 FTP 等 TCP/IP 协议。Java 应用程序可以通过 URL 在网络上打开并访问对象，就像访问本地文件系统一样简单。\n\
  在如今，这被认为是理所当然的——但在 1995 年，从 C++ 或 Visual Basic 程序连接到 Web 服务器是一项巨大的工程。\n### 1.2.4\
  \ 健壮\nJava 旨在编写在各种方面都必须可靠的程序。Java 非常强调早期检查可能的问题、后期的动态（运行时）检查，以及消除易错的情况。……Java 和\
  \ C/C++ 之间最大的区别是 Java 拥有一种指针模型，它消除了覆盖内存和损坏数据的可能性。\nJava 编译器可以检测出许多在其他语言中只会在运行时出现的问题。至于第二点，任何花费数小时去追踪由指针\
  \ bug 引起的内存损坏的人都会对 Java 的这一方面感到非常满意。\n### 1.2.5 安全\nJava 旨在用于网络化/分布式环境。为了这一目标，安全性被了高度关注。Java\
  \ 能够构建无病毒、防篡改的系统。\n从一开始开始，Java 的设计就使得某些攻击变得不可能，其中包括：\n*   溢出运行时栈——蠕虫和病毒常见的攻击手段\n\
  *   在没有权限的情况下读写文件\n最初，Java 对下载代码的态度是“放尽管来吧！”。不可信的代码在沙箱环境中执行，那里不会影响宿主系统。用户可以放心，不会发生任何坏事，因为\
  \ Java 代码无论来自何处，永远无法逃离沙箱。\n然而，Java 的安全模型是复杂的。在第一个 Java 开发包发布后不久，普林斯大学的一组安全专家发现了允许不可信代码攻击宿主系统的细微\
  \ bug。\n最初，安全漏洞被很快修复。遗憾的是，随着时间的推移，黑客变得越来越擅长发现安全架构实现中的细微缺陷。Sun 以及后的 Oracle 在跟进漏洞修复方面面临很大压力。\n\
  在经历了多次引起关注的攻击后，浏览器厂商和 Oracle 变得越来越谨慎。一段时间内，远程代码必须经过数字签名。如今，通过浏览器交付 Java 应用程序已成为遥远记忆。\n\
  ![图像](img/note.jpg) 注意\n尽管从回想来看，Java 的安全模型并没有最初预想的那么成功，但 Java 远于时代。微软的一种竞争性代码交付机制\
  \ ActiveX 仅依赖数字签名来确保安全。显然这是不够的：正如任何微软产品的用户都可以证实的那，来自知名供应商的程序也会崩溃并造成损害。\n### 1.2.6\
  \ 架构中立\n编译器生成一种与架构无关的对象文件格式。只要存在 Java 运行时系统，编译后的代码就可以许多处理器上执行。Java 编译器通过生成字节码指令来实现这一点，这些指令与特定的计算机架构无关。相反，它们的设计目标是既易于在任何机器上解释，又易于即时翻译成原生机器代码。\n\
  为“虚拟机”生成代码在当时并不是一个新主意。Lisp、Smalltalk 和 Pascal 等编程语言已经使用了这种技术多年。\n当然，解释虚拟机指令的速度比全速运行机器指令要慢。然而，虚拟机可以选择将执行频繁的字节码序列翻译成机器代码——这个过程称为及时编译（just-in-time\
  \ compilation）。\nJava 虚拟机还有另一个优势。它增加了安全性，因为它可以检查指令序列的行为。\n### 1.2.7 可移植性\n与 C 和\
  \ C++ 不同，规范中没有“依赖于实现”的方面。基本数据类型的大小是有规定的，对它们进行算术运算的行为也是有规定的。\n例如，Java 中的 `int` 始终是\
  \ 32 位整数。在 C/C++ 中，`int` 可以意味着 16 位整数、32 位整数或编译器厂商喜欢的任何尺寸。唯一的限制是 `int` 类型的字节数至少要与\
  \ `short int` 一样，且不能比 `long int` 多。数值类型具有固定尺寸消除了一个大的移植头恼。二进制数据以固定格式存储和传输，消除了对字节顺序的困惑。字符串以标准的\
  \ Unicode 格式保存。\n作为系统一部分库定义了可移植的接口。例如，有一个抽象的 `Window` 类以及其针对 UNIX、Windows 和 Macintosh\
  \ 的实现。\n`Window` 类的例子可能选得并不好。正如任何尝试过的人所知，要实现一个在 Windows、Macintosh 和十种版本的 UNIX 上看起来良好的用户界面，是一项英雄级规模的努力。Java\
  \ 1.0 付出了这种英雄式的努力，提供了一个简单的工具包，在多个平台上提供了用户界面元素。遗憾的是，结果是导致该库在经过大量工作后，在不同系统上只能产生勉强可接受的结果。那个最初的用户界面工具包自那时被替换、再次被替换，跨平台的可移植性仍然是一个问题。\n\
  然而，对于所有与用户界面无关的领域，Java 库在让你以独立平台的方式工作方面做得非常好。你可以处理文件、正则表达式、XML、日期和时间、数据库、网络连接、线程等，而无需担心底层的操作系统。不仅你的程序是可移植的，Java\
  \ API 的质量通常比原生的 API 高。\n### 1.2.8 解释型\nJava 解释器可以在任何已移植了解释器的机器上直接执行 Java 字节码。由于链接是一个更增量且轻量的过程，开发过程可以更加快速且具有探索性。\n\
  这确实是一个突破。任何用过 Lisp、Smalltalk、Visual Basic、Python、R 或 Scala 的人都知道什么是“快速且探索性”的开发过程。你尝试某些东西，并立即看到结果。在\
  \ Java 存在的前 20 年里，开发环境并没有关注这种体验。直到 Java 9，`jshell` 工具才支持快速和探索性的编程。\n### 1.2.9 高性能\n\
  虽然解释型字节码的性能通常足够，但在某些情况下需要更高的性能。字节码可以即时（在运行时）翻译成运行应用程序的特定 CPU 的机器代码。\n\n\n\n\n\n\n\
