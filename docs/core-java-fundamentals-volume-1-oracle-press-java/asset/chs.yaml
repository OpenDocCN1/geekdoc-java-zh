  54    {\n55       return hireDay;\n56    }\n57\n58    public void raiseSalary(double\
  \ byPercent)\n59    {\n60       double raise = salary * byPercent / 100;\n61   \
  \    salary += raise;\n62    }\n63 }\n```\n\n#### 4.3.2 多个源文件使用\n\n如果你喜欢这种安排，你有两种方法来编译该程序。你可以使用通配符调用\
  \ Java 编译器：\n\n```\njavac Employee*.java\n``````\n\n\n\n\n随后，所有匹配通配符的源文件将被编译成类文件。或者，你可以简单地输入\n\
  \n```\njavac EmployeeTest.java\n```\n\n你可能会感到惊讶，尽管从未显式地编译 `Employee.java` 文件，但第二种选择仍然有效。然而，当\
  \ Java 编译器看到在 `EmployeeTest.java` 内部使用了 `Employee` 类时，它会寻找一个名为 `Employee.class`\
  \ 的文件。如果找不到该文件，它会自动搜索 `Employee.java` 并对其编译。此外，如果它找到的 `Employee.java` 版本的时间戳比现有的\
  \ `Employee.class` 文件新，Java 编译器将*自动*重新编译该文件。\n\n![Images](img/note.jpg) 备注\n\n如果你熟悉\
  \ UNIX 的 `make` 工具（或其 Windows 上的兄弟版本，如 `nmake`），你可以将 Java 编译器想为已经内置了 `make` 功能。\n\
  \n### 4.3.3 剖析 `Employee` 类\n\n在接下来的章节中，我们将详细剖析 `Employee` 类。让我们从该类中的方法开始。通过检查源代码，你可以看到该类有一个构造函数和四个方法：\n\
  \n点击此处查看代码图像\n\n```\npublic Employee(String n, double s, int year, int month, day)\n\
  public String getName()\npublic double getSalary()\npublic LocalDate getHireDay()\n\
  public void raiseSalary(double byPercent)\n```\n\n该类的所有方法都被标记为 `public`。`public`\
  \ 关键字意味着任何类中的任何方法都可以调用该方法。（四种可能的访问级别将在在本章和下一章中介绍。）\n\n接下来，注意这三个实例字段，它们将存储在 `Employee`\
  \ 类实例内部进行操作的数据。\n\n```\nprivate String name;\nprivate double salary;\nprivate LocalDate\
  \ hireDay;\n```\n\n`private` 关键字确保了*只有*能够访问这些实例字段的方法是 `Employee` 类本身的方法。任何外部方法无法读取或写入这些字段。\n\
  \n![Images](img/note.jpg) 备注\n\n你可以在实例字段上使用 `public` 关键字，但这是一个非常糟糕的主意。拥有 `public`\
  \ 实例字段将允许程序的任何部分读取和修改这些字段，从而完全破坏封装性。任何类的类的方法都可以修改公共字段——而且根据我的经验，在你最意想不到的时候，某些代码*会*利用这种访问权限。我强烈建议将所有实例字段设为\
  \ `private`。\n\n最后，注意两个实例字段本身就是对象：`name` 和 `hireDay` 字段是指向 `String` 和 `LocalDate`\
  \ 对象的引用。这非常常见：类通常会包含类类型的实例字段。\n\n### 4.3.4 构造函数的初步\n\n让我们看看 `Employee` 类中列出的构造函数。\n\
  \n点击此处查看代码图像\n\n```\npublic Employee(String n, double s, int year, int month, day)\n\
  {\n   name = n;\n   salary = s;\n   hireDay = LocalDate.of(year, month, day);\n\
  }\n```\n\n如你所见，构造函数的名称与类名相同。当你构造 `Employee` 类对象时，会运行此构造函数——为实例字段赋予所需的初始状态。\n\n例如，当你使用如下代码创建\
  \ `Employee` 类的实例时：\n\n点击此处查看代码图像\n\n```\nnew Employee(\"James Bond\", 100000, 1950,\
  \ 1, 1)\n```\n\n你对实例字段设置如下：\n\n点击此处查看代码图像\n\n```\nname = \"James Bond\";\nsalary\
  \ = 100000;\nhireDay = LocalDate.of(1950, 1, 1); // 1950 年 1 月 1 日\n```\n\n构造函数与其他方法之间存在着重要的区别。构造函数只能配合\
  \ `new` 运算符一起调用。你不能将构造函数应用于现有对象以重置实例字段。例如，\n\n点击此处查看代码图像\n\n```\njames.Employee(\"\
  James Bond\", 250000, 1950, 1, 1) // 错误\n```\n\n这是一个编译时错误。\n\n我们将在本章的稍后部分对构造函数进行更多说明。现在，请记住以下几点：\n\
  \n*   构造函数的名称与类名相同。\n*   一个类可以有多个构造函数。\n*   构造函数可以接受零、一个或多个参数。\n*   构造函数没有返回值。\n\
  *   构造函数始终通过 `new` 运算符调用。\n\n![Images](img/cnote.jpg) C++ 备注\n\n构造函数在 Java 中的工作方式与在\
  \ C++ 中相同。然而，请记住，所有的 Java 对象都在堆上构造的，且构造函数必须与 `new` 结合。C++ 程序员的一个常见错误是忘记 `new` 运算符：\n\
  \n点击此处查看代码图像\n\n```\nEmployee(\"James Bond\", 100000, 1950, 1, 1); // 正确\nEmployee(\"\
  James Bond\", 100000, 1950, 1, 1); // 错误\n```\n\n### 4.3.5 使用 var 声明局部变量\n\n从 Java\
  \ 10 开始，你可以使用 `var` 声明局部变量而不是指定其类型，前提是其类型可以从右侧推断出来。例如，与其使用点击此处查看代码图像\n\n```\nEmployee\
  \ harry = new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\n```\n\n你只需要写\n\n\
  点击此处查看代码图像\n\n```\nvar harry = new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\n\
  ```\n\n这很不错，因为它避免了 `Employee` 类型的重复。\n\n从现在开始，在类型从右侧显而易见的情况下，我会使用 `var` 写法。但我不会对数字类型（如\
  \ `int`、`long` 或 `double`），这样你就不需要留意 `0`、`0L` 和 `0.0` 之间的区别。注意 `var` 关键字只能用于方法内部的*局部*变量。你必须为参数和字段声明类型。\n\
  \n### 4.3.6 处理 `null` 引用\n\n在第 4.2.1 节“对象与对象变量”，位于第 132 页，你已经看到对象变量持有对象的引用，或者持有特殊值\
  \ `null` 以表示对象的缺失。\n\n这似乎是处理特殊情况（例如未知的姓名或入职日期）的方便机制。但你需要非常小心处理 `null` 值。\n\n如果你对\
  \ `null` 值应用方法，将会发生 `NullPointerException`。\n\n点击此处查看代码图像\n\n```\nLocalDate rightNow\
  \ = null;\nString s = rightNow.toString(); // NullPointerException\n```\n\n\n\n\n\
  这是一个严重的错误，类似于“索引越界”异常。如果你的程序没有“捕获”（catch）异常，它就会终止。通常情况下，程序不会捕获这类异常，而是依赖程序员从源上不产生它们。\n\
  \n![Images](img/tip.jpg) 提示\n\n当你的程序因 `NullPointerException`（空指针异常）而终止时，堆栈跟踪会显示问题发生在代码的哪一行。从\
  \ Java 17 开始，错误信息包含了带有 `null` 值的变量或方法名。例如，在如下调用中\n\n点击此处查看代码图片\n\n```\nString s\
  \ = e.getHireDay().toString();\n```\n\n错误信息会告诉你 `e` 是 `null` 还是 `getHireDay` 返回了\
  \ `null`。\n\n当你定义一个类时，明确哪些字段可以为 `null` 是个好主意。在示例中，我们不希望 `name` 或 `hireDay` 字段为 `null`。（我们不需要担心\
  \ `salary` 字段。它是基本类型，永远不可能是 `null`。）\n\n`hireDay` 字段保证不为 `null`，因为它用一个新的 `LocalDate`\
  \ 对象进行了初始化。但如果调用构造函数时传入 `null` 作为 `n` 的参数，那么 `name` 将是 `null`。\n\n有两种解决方案。“宽容”方法是将\
  \ `null` 参数转换为适当的非空值：\n\n[点击此处查看代码图片\n\n```\nif (n == null) name = \"unknown\";\
  \ else name = n;\n```\n\n`Objects` 类提供了一个用于此目的的方便方法：\n\n点击此处查看代码图片\n\n```\npublic\
  \ Employee(String n, double s, int year, int month, int day)\n{\n   name = Objects.requireNonNullElse(n,\
  \ \"unknown\");\n   . . .\n}\n```\n\n“严厉爱”的方法是拒绝 `null` 参数：\n\n点击此处查看代码图片\n\n```\n\
  public Employee(String n, double s, int year, int month, int day)\n{\n   name =\
  \ Objects.requireNonNull(n, \"The name cannot be null\");\n   . . .\n}\n```\n\n\
  如果有人用 `null` 构造一个 `Employee` 对象，就会发生 `NullPointerException`。乍一看，这似乎不是一个实用的补救措施。但它有两个优势：\n\
  \n1. 异常报告包含了对问题的描述。\n2. 异常报告指出了问题的位置。否则，`NullPointerException` 可能会发生在其他地方，且没有简单的方法追溯回有错误的构造函数参数。\n\
  \n![Images](img/note.jpg) 注意\n\n每当你接受一个对象引用作为构造参数时，问问自己你是否真的想要建模可能存在也可能不存在的值。如果不是，则优选“严厉爱”方法。\n\
  \n### 4.3.7 隐式参数和显式参数\n\n方法对对象的操作并访问其实例字段。例如，该方法\n\n点击此处查看代码图片\n\n```\npublic void\
  \ raiseSalary(double byPercent)\n{\n   double raise = salary * byPercent / 100;\n\
  \   salary += raise;\n}\n```\n\n为调用该方法的对象的中的 `salary` 实例字段设置了一个新值。考虑如下调用\n\n```\n\
  number007.raiseSalary(5);\n```\n\n其效果是将 `number007.salary` 字段的值增加了 5%。更具体地说，该调用执行了以下指令：\n\
  \n点击此处查看代码图片\n\n```\ndouble raise = number007.salary * 5 / 100;\nnumber007.salary\
  \ += raise;\n```\n\n`raiseSalary` 方法有两个参数。第一个参数被称为*隐式*参数，是出现在方法名之前的 `Employee` 类型对象。第二个参数（即方法名后括号内的数字）是*显式*参数。（有些人人将隐式参数称为方法调用的*目标*或*接收者*。）\n\
  \n如你所见，显式参数在方法声明中显式地列出——例如，`double byPercent`。隐式参数没有出现在方法声明中。在每个方法中，关键字 `this` 都指代隐式参数。如果你愿意，可以这样写\
  \ `raiseSalary` 方法：\n\n点击此处查看代码图片\n\n```\npublic void raiseSalary(double byPercent)\n\
  {\n   double raise = this.salary * byPercent / 100;\n   this.salary += raise;\n\
  }\n```\n\n一些程序员更喜欢那种风格，因为它清晰地区分了实例字段和局部变量。\n\n![Images](img/cnote.jpg) C++ 注意\n\n\
  在 C++ 中，你通常在类外定义方法：\n\n点击此处查看代码图片\n\n```\nvoid Employee::raiseSalary(double byPercent)\
  \ // C++, not Java\n{\n   . . .\n}\n```\n\n如果你在类内部定义方法，那么它就是内联的。点击此处查看代码图片\n\n```\n\
  class Employee\n{\n   . . .\n   int getName() { return name; } // C++\n}\n```\n\n\
  在 Java 中，所有方法都定义在类内部。寻找内联机会是 Java 虚机的工作。\n\n### 4.3.8 封装的好处\n\n最后，让我们仔细观察一下简单的 `getName`、`getSalary`\
  \ 和 `getHireDay` 方法。\n\n```\npublic String getName()\n{\n   return name;\n}\n\n\
  public double getSalary()\n{\n   return salary;\n}\n\npublic LocalDate getHireDay()\n\
  {\n   return hireDay;\n}\n```\n\n这些是明显的访问器方法。由于它们只是返回字段的值，有时被称为*字段访问器*。\n\n让 `name`、`salary`\
  \ 和 `hireDay` 字段公开会更容易吗？然而，`name` 字段是只读的。一旦在构造函数中设置了它，就没有方法可以更改它。因此，我们保证 `name`\
  \ 字段永远不会损坏。\n\n`salary` 字段不是只读的，但可以通过 `raiseSalary` 方法更改。特别是，如果值出现错误，只需要调试该方法。如果\
  \ `salary` 字段是公开的，搞乱值的祸首可能在任何地方。\n\n有时，你想获取并设置实例字段的值。这时你需要提供三项内容：\n\n* 一个私有实例字段；\n\
  * 一个公共字段访问器方法；\n* 一个公共字段变器方法。\n\n这比提供单个实例字段要繁琐得多，但有显著的好处。首先，你可以在不影响类以外代码的情况下更改内部实现。例如，如果将名称存储更改为\n\
  \n```\nString firstName;\nString lastName;\n```\n\n那么 `getName` 方法可以更改为返回\n\n```\n\
  firstName + \" \" + lastName\n```\n\n这种更改对程序的其余部分是完全透明的。\n\n当然，访问器和变器方法可能需要在旧新数据表示之间进行大量工作。这引出了我们的第二个优势：变器方法可以执行错误检查，而简单赋值字段的代码可能不会进行这些检查。例如，`setSalary`\
  \ 方法可能会检查工资是否小于 0。\n\n![Images](img/caution.jpg) 注意\n\n小心编写返回可变对象引用的访问器方法。在本书的之前的版本中，我在\
  \ `Employee` 类中违反了这一规则，`getHireDay` 方法返回了 `Date` 类的对象：\n\n```\nclass Employee\n\
  {\n   private Date hireDay;\n   . . .\n   public Date getHireDay()\n   {\n     \
  \ return hireDay; // BAD\n   }\n   . . .\n}\n```\n\n与没有变器方法的 `LocalDate` 类不同，`Date`\
  \ 类有一个变器方法 `setTime`，你可以用它设置毫秒数。\n\n\n\n\n`Date` 对象是可变的这一事实破坏了封装性！考虑以下异常代码：\n\n\
  点击此处查看代码图片\n\n```\nEmployee harry = . . .\nDate d = harry.getHireDay();\ndouble\
  \ tenYearsInMilliseconds = 10 * 365.25 * 24 * 60 * 60 * 1000;\nd.setTime(d.getTime()\
  \ - (long) tenYearsInMilliseconds);\n// 给 Harry 增加十年的工龄\n```\n\n其原因是微妙的。`d` 和 `harry.hireDay`\
  \ 指向同一个对象（参见图 4.5）。对 `d` 应用变异器方法会自动改变 `Employee` 对象的私有状态！\n\n如果你需要返回一个可变对象的引用，应该先对其进行\
  \ `clone`。克隆是存储在内存新位置对象的精确副本。克隆将在第 6 章中进行详细讨论。以下是修正后的代码：\n\n![Images](img/04fig05.jpg)\n\
  \n**图 4.5** 返回一个可变实例字段的引用\n\n点击此处查看代码图片\n\n```\nclass Employee\n{\n   . . .\n  \
  \ public Date getHireDay()\n   {\n      return (Date) hireDay.clone(); // OK\n \
  \  }\n   . . .\n}\n```\n\n根据经验法则，每当你需要返回可变字段的副本时，请始终使用 `clone`。\n\n### 4.3.9 基于类的访问权限\n\
  \n你已经知道方法可以访问其调用所在对象的私有数据。人们经常感到惊讶的是，方法可以访问*该类中所有对象*的私有数据。例如，考虑一个比较两个员工的 `equals`\
  \ 方法。\n\n点击此处查看代码图片\n\n```\nclass Employee\n{\n   . . .\n   public boolean equals(Employee\
  \ other)\n   {\n      return name.equals(other.name);\n   }\n}\n```\n\n一个典型的调用是：\n\
  \n```\nif (harry.equals(boss)) . . .\n```\n\n该方法访问了 `harry` 的私有字段，这并不奇怪。它也访问了 `boss`\
  \ 的私有字段。这是合法的，因为 `boss` 是 `Employee` 类型的对象，而 `Employee` 类的方法允许访问*任何* `Employee`\
  \ 类型对象的私有字段。\n\n![Images](img/cnote.jpg) C++ Note\n\nC++ 拥有相同的规则。方法可以访问其类中任何对象的私有特性，而不仅仅是隐式参数。\n\
  \n### 4.3.10 私有方法\n\n在实现类时，我们将所有实例字段设为私有，因为公共数据是危险的。但方法呢？虽然大多数方法是公共的，但在某些情况下，私有方法是有用的。有时，你可能希望将计算代码拆分为单独辅助方法。通常，这些辅助方法不应该是公共接口的一部分——它们可能与当前实现过于接近，或者需要特殊的协议或调用顺序。此类方法最好实现为私有。\n\
  \n在 Java 中实现私有方法，只需将 `public` 关键字改为 `private` 即可。\n\n通过将方法设为私有，当你在更改实现时，并没有义务保留它的可用性。如果数据表示发生变化，该方法的实现可能会变得*更困难*或*不再必要*；这无关紧。要点是，只要方法是私有的，类的设计者就可以确保它没有在其他地方使用，因此他们可以简单地将其删除。如果方法是公共的，你就不能简单地删除它，因为其他代码可能依赖它。\n\
  \n### 4.3.11 final 实例字段\n\n你可以将实例字段定义为 `final`。此类字段在对象构造时初始化。也就是说，你必须保证在每个构造函数结束后字段值已设置。此后，该字段可能再被修改。例如，`Employee`\
  \ 类的 `name` 字段可以声明为 `final`，因为它在对象构造后永远不会改变——因为没有 `setName` 方法。\n\n```\nclass Employee\n\
  {\n   private final String name;\n   . . .\n}\n```\n\n`final` 修饰符对于类型为基本类型或*不可变类*的字段特别有用。（如果一个类中没有任何方法会改变其对象的状态，则该类是不可变的。例如，`String`\
  \ 类就是不可变的。）\n\n对于可变类，`final` 修饰符可能会引起困惑。例如，考虑一个字段\n\n点击此处查看代码图片\n\n```\nprivate\
  \ final StringBuilder evaluations;\n```\n\n它在 `Employee` 构造函数中初始化为：\n\n点击此处查看代码图片\n\
  \n```\nevaluations = new StringBuilder();\n```\n\n`final` 关键字仅意味着存储在 `evaluations`\
  \ 变量中的对象引用将不再再次指向不同的 `StringBuilder` 对象。但对象本身是可以变变的：\n\n点击此处查看代码图片\n\n```\npublic\
  \ void giveGoldStar()\n{\n   evaluations.append(LocalDate.now() + \": Gold star\"\
  );\n}\n```\n\n### 4.4 静态字段和方法\n\n在某些面向对象的语言中，静态字段被称为*类字段*。“static”一词是来自 C++ 的历史遗留。\n\
  \n#### 4.4.1 静态字段\n\n如果你将一个字段定义为 `static`，那么它是该类所有实例共享的。它属于类，而不是对象。例如，让我们为每个 `employee`\
  \ 分配唯一的标识：\n\n```\nclass Employee\n{\n   . . .\n   private static int nextId = 1;\n\
  \n   int id;\n}\n```\n\n假设我们构造了 `harry`。那么 `harry` 的 `id` 字段被设置为静态字段的当前值，并递增：\n\n\
  ```\nharry.id = Employee.nextId;\nEmployee.nextId++;\n```\n\n### 4.4.2 静态常量\n\n\
  静态变量很少见。然而，静态常量更为常见。例如，`Math` 类定义了一个静态常量：\n\n点击此处查看代码图片\n\n```\npublic class Math\n\
  {\n   . . .\n   public static final double PI = 3.14159265358979323846;\n   . .\
  \ .\n}\n```你可以在程序中使用 `Math.PI` 访问此常量。\n\n如果省略了 `static` 关键字，那么 `PI` 将成为 `Math` 类的实例字段。也就是说，你需要该类的对象来访问\
  \ `PI`，并且每个 `Math` 对象都有自己的 `PI` 副本。\n\n另一个你使用很多次的静态常量是 `System.out`。它在 `System`\
  \ 类中的声明如下：\n\n点击此处查看代码图片\n\n```\npublic class System\n{\n   . . .\n   public static\
  \ final PrintStream out = . . .\n   . . .\n}\n```\n\n正如多次提到的，拥有公共字段永远不是好主意，因为每个人都可以修改它们。然而，公共常量（即\
  \ `final` 字段）是可以的。由于 `out` 已经被声明为 `final`，你不能再重新分配另一个打印流给它：\n\n点击此处查看代码图片\n\n```\n\
  System.out = new PrintStream(. . .); // ERROR--out is final\n```\n\n\n\n\n如果你查看\
  \ `System` 类，你会注意到有一个名为 `setOut` 的方法，它能将 `System.out` 设置为不同的流。你可能会好奇该方法是如何改变一个 `final`\
  \ 变量的值。然而，`setOut` 方法是一个 `native`（原生）方法，并不是用 Java 语言实现的。原生方法可以绕过 Java 语言的访问控制机制。这是一种非常不寻常的解决方法，你不应该在自己的程序中模仿它。\n\
  \n### 4.4.3 静态方法\n\n静态方法是不操作于对象的方法。例如，`Math` 类的 `pow` 方法就是一个静态方法。该表达式\n\n```\nMath.pow(x,\
  \ a)\n```\n\n计算 `x`^a 的幂方。它没有使用任何 `Math` 对象来完成任务。换句话说，它没有隐式参数。\n\n你可以将静态方法看作没有 `this`\
  \ 参数的方法。（在非静态方法中，`this` 参数指向方法的隐式参数——参见第 4.3.7 节 中的“隐式参数和显式参数”，位于第 150 页。）\n\n`Employee`\
  \ 类的静态方法无法访问 `id` 实例字段，因为它不操作于任何对象。然而，静态方法可以访问静态字段。这里是这样一个静态方法的示例：\n\n点击此处查看代码图片\n\
  \n```\npublic static int advanceId()\n{\n   int r = nextId; // 获取下一个可用 id\n   nextId++;\n\
  \   return r;\n}\n```\n\n要调用此方法，你需要提供类名：\n\n```\nint n = Employee.advanceId();\n\
  ```\n\n你可以在这个方法中省略 `static` 关键字吗？可以，但那样你就需要一个类型为 `Employee` 的对象引用来调用该方法。\n\n![Images](img/note.jpg)\
  \ 提示\n\n使用对象来调用静态方法是合法的。例如，如果 `harry` 是一个 `Employee` 对象，那么你可以调用 `harry.advanceId()`\
  \ 而不是 `Employee.advanceId()`。然而，我发现这种写法很令人困惑。`advanceId` 方法在计算结果时根本没有看 `harry`。我建议你使用类名而不是对象来调用静态方法。\n\
  \n在两种情况下使用静态方法：\n\n*   当方法不需要访问对象状态时，因为所有需要的参数都是作为显式参数提供的（例如：`Math.pow`）\n*   当方法只需要访问类的静态字段时（例如：`Employee.advanceId`）\n\
  \n![Images](img/cnote.jpg) C++ 提示\n\n静态字段和方法在 Java 和 C++ 中具有相同的功能。然而，它们的语法略有不同。在\
  \ C++ 中，你使用 `::` 运算符在作用域之外访问静态字段或方法，例如 `Math::PI`。\n\n“static”一词有一个奇特的历史。起初，`static`\
  \ 关键字被引入 C 语言，用于表示在退出块后不会消失的局部变量。在这种语境下，“static”一词是有意义的：变量一直保留，并且当再次进入该块时它仍然在那里。然后\
  \ `static` 在 C 中有了第二个含义，用于表示无法从其他文件访问的全局变量和函数。`static` 关键字只是被简单地复用，以避免引入新关键字。最后，C++\
  \ 复用了该关键字的第三种无关的解释——表示属于某个类但不属于该类任何特定对象的变量和函数。这与该关键字在 Java 中的含义相同。\n\n### 4.4.4\
  \ 工厂方法\n\n这是静态方法的另一个常见用途。像 `LocalDate` 和 `NumberFormat` 这样的类使用了静态方法。你已经看到过静态工厂方法\
  \ `now` 和 `of`。这里是工厂方法的示例：\n\n点击此处查看代码图片\n\n```\nNumberFormat currencyFormatter\
  \ = NumberFormat.getCurrencyInstance();\nNumberFormat percentFormatter = NumberFormat.getPercentInstance();\n\
  double x = .1\nSystem.out.println(currencyFormatter.format(x)); // 输出 $0.1\nSystem.out.println(percentFormatter.format(x));\
  \ // 输出 10%\n```\n\n为什么 `NumberFormat` 不使用构造函数？有两个原因：\n\n*   静态方法可以返回不同类型的子类实例。\n\
  *   静态方法可以继承 `NumberFormat`。更多信息请参见第 5 节](#ch5)。\n\n### 4.4.5 `main` 方法\n\n注意，你不需要任何对象就可以调用静态方法。事实上，当程序启动时，还没有任何对象。静态\
  \ `main` 方法执行并构造了程序所需的对象。\n\n点击此处查看代码图片\n\n```\npublic class Application\n{\n  \
  \ public static void main(String[] args)\n   {\n      //构造对象\n      . . .\n   }\n\
  }\n```\n\n`main` 方法不操作于任何对象。`main` 方法是静态的。\n\n![Images](img/tip.jpg) 提示\n\n类可以拥有\
  \ `main` 方法。这是一个为类添加演示代码的方便技巧。例如，你可以为 `Employee` 类添加 `main` 方法：\n\n点击此处查看代码图片\n\n\
  ```java\nclass Employee\n{\n   public Employee(String n, double s, int year, int\
  \ month, int day)\n   {\n      name = n;\n      salary = s;\n      hireDay = LocalDate.of(year,\
  \ month, day);\n   }\n   . . .\n   public static void main(String[] args) // 测试\n\
  \   {\n      var e = new Employee(\"Romeo\", 50000, 2003, 3, 31);\n      e.raiseSalary(10);\n\
  \      System.out.println(e.getName() + \" \" + e.getSalary());\n   }\n   . . .\n\
  }\n```\n\n\n\n\n```java\n /**\n * This program demonstrates static methods.\n *\
  \ @version 1.02 2008-04-10\n * @author Cay Horstmann\n */\npublic class StaticTest\n\
  {\n   public static void main(String[] args)\n   {\n      // fill the staff array\
  \ with three Employee objects\n      var staff = new Employee[3];\n\n      staff[0]\
  \ = new Employee(\"Tom\", 40000);\n      staff[1] = new Employee(\"Dick\", 60000);\n\
  \      staff[2] = new Employee(\"Harry\", 65000);\n\n      // print out information\
  \ about all Employee objects\n      for (Employee e : staff)\n      {\n        \
  \  System.out.println(\"name=\" + e.getName() + \",id=\" + e.getId() + \",salary=\"\
  \n             + e.getSalary());\n   }\n\n      int n = Employee.getNextId(); //\
  \ calls static method\n      System.out.println(\"Next available id=\" + n);\n \
  \  }\n}\n\nclass Employee\n{\n   private static int nextId = 1;\n\n   private String\
  \ name;\n   private double salary;\n   private int id;\n\n   public Employee(String\
  \ n, double s)\n   {\n      name = n;\n      salary = s;\n      id = advanceId();\n\
  \   }\n\n   public String getName()\n   {\n      return name;\n   }\n\n   public\
  \ double getSalary()\n   {\n      return salary;\n   }\n\n   public int getId()\n\
  \   {\n      return id;\n   }\n\n   public static int advanceId()\n   {\n      int\
  \ r = nextId; // obtain next available id\n      nextId++;\n      return r;\n  \
  \ }\n\n   public static void main(String[] args) // unit test\n   {\n      var e\
  \ = new Employee(\"Harry\", 50000);\n      System.out.println(e.getName() + \" \"\
  \ + e.getSalary());\n   }\n}\n```\n\n`java.util.Objects` 7\n\n*   `static <T> void\
  \ requireNonNull(T obj)`\n*   `static <T> void requireNonNull(T obj, String message)`\n\
  *   `static <T> void requireNonNull(T obj, Supplier<String> messageSupplier)`\n\n\
  \    如果 `obj` 为 `null`，这些方法将抛出一个没有消息或给定消息的 `NullPointerException`。（第 6 章 解释了如何使用\
  \ supplier 延迟地获取值。第 8 章 解释了 `<T>` 语法。）\n*   `static <T> T requireNonNullElse(T obj,\
  \ T defaultObj)`\n*   `static <T> T requireNonNullElseGet(T obj, Supplier<T> defaultSupplier)`\n\
  \n    如果 `obj` 不为 `null`则返回 `obj`；如果 `obj` 为 `null`则返回默认对象。\n\n## 4.5 方法参数\n\n让我们回顾描述参数如何传递给编程语言方法（或函数）的计算机科学术语。*值传递*（call\
  \ by value）意味着方法仅获取调用者提供的值。相比之下，*引用传递*（call by reference）意味着方法获取调用者提供的变量*位置*。因此，方法可以*修改*通过引用传递的变量中存储的值，但不能修改通过值传递的变量。这些“按……传递”术语是描述各种编程语言中方法参数行为的标准计算机科学术语，而不是\
  \ Java。（还有一种*按名传递*（call by name），主要具有历史意义，用于 Algol 编程语言，这是最古的高级语言之一。）\n\nJava 编程语言*始终*使用值传递。这意味着方法获取所有参数值的副本。特别是，方法无法修改传递给它的任何参数变量的内容。\n\
  \n例如，考虑以下调用：\n\n```\ndouble percent = 10;\nharry.raiseSalary(percent);\n```\n\n\
  无论方法如何实现，我们知道在方法调用后，`percent` 的值仍然是 `10`。\n\n让我们更仔细观察这种情况。假设一个方法尝试将方法参数的值三倍：\n\n\
  点击此处查看代码图像\n\n```java\npublic static void tripleValue(double x) // 不起\n{\n   x =\
  \ 3 * x;\n}\n```\n\n让我们调用这个方法：\n\n```\ndouble percent = 10;\ntripleValue(percent);\n\
  ```\n\n然而，这不起作用。方法调用后，`percent` 的值仍然是 `10`。发生的情况如下：\n\n1. `x` 用 `percent` 值的副本（即\
  \ `10`）初始化。\n2. `x` 增加了三倍——它现在是 `30`。但 `percent` 仍然是 `10`（见图 4.6）。\n3. 方法结束，参数变量\
  \ `x` 不再使用。\n\n然而，方法参数有两种：\n\n*   基本类型（数字、`boolean` 值）\n*   对象引用\n\n你已经看到方法无法更改基本类型参数。对于对象参数的情况则不同。你可以轻松实现一个使员工薪水三倍的方法：\n\
  \n点击此处查看代码图像\n\n```java\npublic static void tripleSalary(Employee x) // 起作用\n{\n\
  \   x.raiseSalary(200);\n}\n```\n\n当你调用时：\n\n```\nharry = new Employee(. . .);\n\
  tripleSalary(harry);\n```\n\n然后发生了以下情况：\n\n![Images](img/04fig06.jpg)\n\n**图 4.6**\
  \ 修改对象参数具有持久影响\n\n1. `x` 用 `percent` 值的副本（即 `10`）初始化。\n2. `x` 增加了三倍——它现在是 `30`。但\
  \ `percent` 仍然是 `10`（见图 4.6）。\n3. 方法结束，参数变量 `x` 不再使用。\n\n\n\nListing 4.4 中的程序演示了这些事实。程序首先尝试将数值参数的值三倍，但失败了：\n\
  \n```\nTesting tripleValue:\nBefore: percent=10.0\nEnd of method: x=30.0\nAfter:\
  \ percent=10.0\n```\n\n随后它成功地将员工的薪水增加了三倍：\n\n点击查看代码图像\n\n```\nTesting tripleSalary:\n\
  Before: salary=50000.0\nEnd of method: salary=150000.0\nAfter: salary=150000.0\n\
  ```\n\n方法执行后，`harry` 所引用对象的状态发生了变化。这是可能的，因为该方法通过对象引用的副本修改了状态。\n\n最后，程序演示了 `swap`\
  \ 方法的失败：\n\n```\nTesting swap:\nBefore: a=Alice\nBefore: b=Bob\nEnd of method: x=Bob\n\
  End of method: y=Alice\nAfter: a=Alice\nAfter: b=Bob\n```\n\n如你所见，参数变量 `x` 和 `y`\
  \ 被交换了，但变量 `a` 和 `b` 没有受到影响。\n\n![Images](img/cnote.jpg) C++ Note\n\nC++ 既有值传递也有引用传递。你用\
  \ `&` 标记引用参数。例如，你可以轻轻松地实现 `void tripleValue(double& x)` 或 `void swap(Employee& x,\
  \ Employee& y)` 方法来修改它们的引用参数。\n\n**Listing 4.4** `ParamTest/ParamTest.java`\n\n\
  点击查看代码图像\n\n```\n 1 /**\n 2  * 此程序演示了 Java 中的参数传递。\n 3  * @version 1.01 2018-04-10\n\
  \ 4  * @author Cay Horstmann\n 5  */\n 6 public class ParamTest\n 7 {\n 8    public\
  \ static void main(String[] args)\n 9    {\n10       /*\n11        * Test 1: 方法不能修改数值\
  \ own\n12        */\n13       System.out.println(\"Testing tripleValue:\");\n14\
  \       double percent = 10;\n15       System.out.println(\"Before: percent=\" +\
  \ percent);\n16       tripleValue(percent);\n17       System.out.println(\"After:\
  \ percent=\" + percent);\n18\n19       /*\n20        * Test 2: 方法可以改变对象参数的状态\n21\
  \       */\n22       System.out.println(\"\\nTesting tripleSalary:\");\n23     \
  \  var harry = new Employee(\"Harry\", 50000);\n24       System.out.println(\"Before:\
  \ salary=\" + harry.getSalary());\n25       tripleSalary(harry);\n26       System.out.println(\"\
  After: salary=\" + harry.getSalary());\n27\n28       /*\n29        * Test 3: 方法不能为对象参数挂载新对象\n\
  30        */\n31       System.out.println(\"\\nTesting swap:\");\n32       var a\
  \ = new Employee(\"Alice\", 70000);\n33       var b = new Employee(\"Bob\", 60000);\n\
  34       System.out.println(\"Before: a=\" + a.getName());\n35       System.out.println(\"\
  Before: b=\" + b.getName());\n36       swap(a, b);\n37       System.out.println(\"\
