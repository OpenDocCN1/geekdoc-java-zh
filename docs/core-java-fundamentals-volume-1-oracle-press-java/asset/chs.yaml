  \  }\n```\n```\n\n### `javax.swing.JTextArea` `1.2`\n\n*   `JTextArea()`\n*   `JTextArea(int\
  \ rows, int cols)`\n*   `JTextArea(String text, int rows, int cols)`\n    创建一个新的文本区域。\n\
  \n*   `void setColumns(int cols)`\n    告诉文本区域它应该使用的优先列数。\n\n*   `void setRows(int\
  \ rows)`\n    告诉文本区域它应该使用的优先行数。\n\n*   `void append(String newText)`\n    将给定的文本追加到文本区域现有文本的末尾。\n\
  \n*   `void setLineWrap(boolean wrap)`\n    开启或关闭换行。\n\n*   `void setWrapStyleWord(boolean\
  \ word)`\n    如果 `word` 为 `true`，长行将在单词边界处换行。如果为 `false`，长行将在不考虑单词边界的情况下断开。\n\n\
  *   `void setTabSize(int c)`\n    每 `c` 列设置一个制表停止位。注意，制表符不会转换为空格，而是与下一个制表停止位对齐。\n\
  \n*   `JScrollPane(Component c)`\n    创建一个显示指定组件内容的滚动面板。当组件大于视口时，会提供滚动条。\n\n## 11.4\
  \ 选择组件\n\n你现在已经知道如何从用户那里收集文本输入，但在许多情况下，你可能倾向于给用户提供一组有限的选择，而不是让他们在文本组件中输入数据。使用一组按钮或项目列表可以告诉用户他们有哪些选择。（这还为你节省了进行错误检查的麻烦。）在这一节中，你将学习如何编写复选框、单选按钮、选择列表和滑动条。\n\
  \n图 11.12 显示了一个包含两个复选框的简单程序，一个用于开启或关闭字体*斜体*属性，另一个用于粗体。注意第二个复选框获得了焦点，如标签周围的矩形所示。每当用户点击其中一个复选框时，屏幕都会使用新的字体属性进行刷新。\n\
  \n![Images](img/011fig12.jpg)\n\n**图 11.12** 复选框\n\n复选框旁边需要一个标签来标识其用途。在构造函数中提供标签文本：\n\
  \n```\nbold = new JCheckBox(\"Bold\");\n```\n\n使用 `setSelected` 方法来开启或关闭复选框。例如：\n\
  \n```\nbold.setSelected(true);\n```\n\n`isSelected` 方法可以获取每个复选框的当前状态。如果未选中则为 `false`，如果已选中则为\
  \ `true`。\n\n当用户点击其中一个复选框时，屏幕都会使用新的字体属性进行刷新。`isSelected` 方法可以获取每个复选框的当前状态。如果未选中则为\
  \ `false`，如果已选中则为 `true`。\n\n**列表 11.2** `checkBox/CheckBoxFrame.java`\n\n### 11.4.2\
  \ 单选按钮\n\n\n\n\n在在上一个示例中，用户可以选中两个复选框中的一个、两个或两个都不选。在许多情况下，我们希望用户只选择几个框框中的其中一个。当另一个框框被选中时，之前的框框会自动取消选中。这样一组框框通常被称为\
  \ `radio button group`（单选组），因为这些按钮的作用就像收音机上的电台选择按钮一样。当你按下一个按钮时，之前按下的按钮会弹出。图 11.13\
  \ 显示了一个典型的示例。我们允许用户从小、中、大或特大等选项中选择字体大小——但当然，我们允许每次只选择一种大小。\n\n![Images](img/011fig13.jpg)\n\
  \n**图 11.13** 单选按钮组\n\n在 Swing 中实现单选组非常简单。你为每组按钮构造一个 `ButtonGroup` 类型的对象。然后，将 `JRadioButton`\
  \ 类型的对象添加到按钮组中。按钮组对象负责在点击新按钮时关闭之前设置的按钮。\n\n点击此处查看代码图片\n\n```\nvar group = new ButtonGroup();\n\
  \nvar smallButton = new JRadioButton(\"Small\", false);\ngroup.add(smallButton);\n\
  \nvar mediumButton = new JRadioButton(\"Medium\", true);\ngroup.add(mediumButton);\n\
  . . .\n```\n\n构造函数的第二个参数对于初始应被选中的按钮设为 `true`，对所有其他按钮设为 `false`。请注意，按钮组只控制按钮的*行为*；如果你是为了布局目的而对按钮进行分组，你还需要将它们添加到如\
  \ `JPanel` 之容器中。\n\n如果你再次查看图 11.12 和 11.13，你会注意到单选按钮的外观与复选框不同。复选框是正方形的，选中时包含一个选框标记。单选按钮是圆形的，选中时包含一个点。\n\
  \n单选按钮的事件通知机制与其他任何按钮相同。当用户勾选单选按钮时，该按钮会产生一个动作事件。在我们的示例程序中，我们定义了一个动作监听器，将字体大小设置为特定值：\n\
  \n点击此处查看代码图片\n\n```\nActionListener listener = event ->\n   label.setFont(new Font(\"\
  Serif\", Font.PLAIN, size));\n```\n\n将此监听器设置与复选框示例进行比较。每个单选按钮都有一个不同的监听器对象。每个监听器对象确切知道需要做什么——将字体设置为特定值。对于复选框，我们使用了不同的方法：两个复选框使用同一个动作监听器，该监听器调用一个方法查看两个复选框当前的状态。\n\
  \n我们可以采用同样的方法吗？我们可以使用单个监听器按如下计算大小：\n\n点击此处查看代码图片\n\n```\nif (smallButton.isSelected())\
  \ size = 8;\nelse if (mediumButton.isSelected()) size = 12;\n. . .\n```\n\n然而，我们更倾向于使用单独的动作监听器对象，因为它们大小值与按钮结合得更紧密。\n\
  \n![Images](img/note.jpg) 注意\n\n如果你有一组单选按钮，你知道其中只有一个被选中了。如果能够快速找到是哪一个，而不需要查询组中的所有按钮，那就太好了。`ButtonGroup`\
  \ 对象控制所有按钮，因此如果这个对象能为我们被选中按钮的引用，将非常方便。事实上，`ButtonGroup` 类有一个 `getSelection` 方法，但该方法返回的并不是选中的单选按钮。相反，它返回一个指向附加到按钮上的\
  \ `ButtonModel` 引用。遗憾的是，没有哪个 `ButtonModel` 方法是特别有用的。`ButtonModel` 接口继承了来自 `ItemSelectable`\
  \ 接口的方法 `getSelectedObjects`，但该方法毫无用处地返回 `null`。`getActionCommand` 方法看起来很有前景，因为单选按钮的“动作命令”是它的文本标签。但其模型的动作命令是\
  \ `null`。只有当你使用 `setActionCommand` 方法显式设置所有单选按钮的动作命令时，模型的动作命令值才会被设置。然后你就可以通过 `buttonGroup.getSelection().getActionCommand()`\
  \ 获取当前选中按钮的动作命令了。\n\n列表 11.3 是让一组单选按钮工作的字体大小选择完整程序。\n\n**列表 11.3** `radioButton/RadioButtonFrame.java`\n\
  \n点击此处查看代码图片\n\n```\n 1  package radioButton;\n 2\n 3  import java.awt.*;\n 4  import\
  \ java.awt.event.*;\n 5  import javax.swing.*;\n 6\n 7  /**\n 8   * 一个带有示例文本标签和用于选择字体大小的单选按钮的框架。\n\
  \ 9   */\n10  public class RadioButtonFrame extends JFrame\n11  {\n12     private\
  \ JPanel buttonPanel;\n13     private ButtonGroup group;\n14     private JLabel\
  \ label;\n15     private static final int DEFAULT_SIZE = 36;\n16\n17     public\
  \ RadioButtonFrame()\n18     {\n19        label = new JLabel(\"The brown fox jumps\
  \ over the lazy dog.\");\n20        add(label, BorderLayout.CENTER);\n21       \
  \ buttonPanel = new JPanel();\n22        group = new ButtonGroup();\n23\n24    \
  \    addRadioButton(\"Small\", 8);\n25        addRadioButton(\"Medium\", 12);\n\
  26        addRadioButton(\"Large\", 18);\n27        addRadioButton(\"Extra large\"\
  , 36);\n28\n29        add(buttonPanel, BorderLayout.SOUTH);\n30        pack();\n\
  31     }\n32\n33     /**\n34      * 添加一个设置字体大小的单选按钮。\n35      * @param name 显示在按钮上的字符串\n\
  36      * @param size 设置的字体大小\n37      */\n38     public void addRadioButton(String\
  \ name, int size)\n39     {\n40        boolean selected = size == DEFAULT_SIZE;\n\
  41        var button = new JRadioButton(name, selected);\n42        group.add(button);\n\
  43        buttonPanel.add(button);\n44\n45        ActionListener listener = event\
  \ ->\n46            label.setFont(new Font(\"Serif\", Font.PLAIN, size));\n47\n\
  48        button.addActionListener(listener);\n49     }\n50  }\n```\n\n#### 1.4.3\
  \ 边界\n\n如果你在窗口中有多个单选按钮组，你会在视觉上指示哪些按钮是一组的。Swing 提供了一组非常有用的*边界*（borders）来实现这一目的。你可以将边界应用于任何扩展\
  \ `JComponent` 的组件。常见的用法是在面板周围放置边界，并在填充填充用户界面元素。\n\n1.  调用 `BorderFactory` 的静态方法创建一个边界。你可以从以下样式中选择（参见图\
  \ 11.14）：\n\n    *   凹槽斜边（Lowered bevel）\n    *   凸斜边（Raised bevel）\n    *   刻蚀（Etched）\n\
  \    *   线条（Line）\n    *   哑光（Matte）\n    *   空边界（Empty，仅在组件周围创建一些空白区域）\n\n    \
  \    ![Images](img/011fig14.jpg)\n\n    **图 11.14** 测试边界类型\n\n\n\n\n2. 如果你喜欢，可以通过将边框传递给\
  \ `BorderFactory.createTitledBorder` 来为你的边框添加标题。\n\n3. 如果你真的想尽全力，可以通过调用 `BorderFactory.createCompoundBorder`\
  \ 将多个边框组合在一起。\n\n4. 通过调用 `JComponent` 类的 `setBorder` 方法将生成的边框添加到你的组件中。\n\n例如，以下是如何向面板（panel）添加带有标题的刻蚀边框的方法：\n\
  \n点击此处查看代码图像\n\n```\nBorder etched = BorderFactory.createEtchedBorder();\nBorder\
  \ titled = BorderFactory.createTitledBorder(etched, \"A Title\");\npanel.setBorder(titled);\n\
  ```\n\n不同的边框具有不同的边框宽度和颜色设置选项；详情请参见 API 说明。真正的边框爱好者会发现，还有一个 `SoftBevelBorder` 类用于具有软圆角的斜角边框，并且\
  \ `LineBorder` 也可以具有圆角。你只能通过使用其中一个类的构造函数来构建这些边框——它们没有对应的 `BorderFactory` 方法。\n\n\
  ### `javax.swing.BorderFactory` 1.2\n\n* `static Border createLineBorder(Color color)`\n\
  * `static Border createLineBorder(Color color, int thickness)`\n  创建一个简单的线条边框。\n\
  * `static MatteBorder createMatteBorder(int top, int left, int bottom, int right,\
  \ Color color)`\n* `static MatteBorder createMatteBorder(int top, int left, int\
  \ bottom, int right, Icon tileIcon)`\n  创建一个填充了颜色或重复图标的厚边框。\n* `static Border createEmptyBorder()`\n\
  * `static Border createEmptyBorder(int top, int left, int bottom, int right)`\n\
  \  创建一个空边框。\n* `static Border createEtchedBorder()`\n* `static Border createEtchedBorder(Color\
  \ highlight, Color shadow)`\n* `static Border createEtchedBorder(int type)`\n* `static\
  \ Border createEtchedBorder(int type, Color highlight, Color shadow)`\n  创建一个具有\
  \ 3D 效果的线条边框。`type` 参数是 `EtchedBorder.RAISED` 或 `EtchedBorder.LOWERED` 之一。\n* `static\
  \ Border createBevelBorder(int type)`\n* `static Border createBevelBorder(int type,\
  \ Color highlight, Color shadow)`\n* `static Border createLoweredBevelBorder()`\n\
  * `static Border createRaisedBevelBorder()`\n  创建一个具有凹陷或凸起表面效果的边框。`type` 参数是 `BevelBorder.RAISED`\
  \ 或 `BevelBorder.LOWERED` 之一。\n* `static TitledBorder createTitledBorder(String\
  \ title)`\n* `static TitledBorder createTitledBorder(Border border)`\n* `static\
  \ TitledBorder createTitledBorder(Border border, String title)`\n* `static TitledBorder\
  \ createTitledBorder(Border border, String title, int justification, int position)`\n\
  * `static TitledBorder createTitledBorder(Border border, String title, int justification,\
  \ int position, Font font)`\n* `static TitledBorder createTitledBorder(Border border,\
  \ String title, int justification, int position, Font font, Color color)`\n  创建一个带有指定属性的标题边框。`justification`\
  \ 参数是 `TitledBorder` 常量 `LEFT`、`CENTER`、`RIGHT`、`LEADING`、`TRAILING` 或 `DEFAULT_JUSTIFICATION`（左）之一，而\
  \ `position` 是 `ABOVE_TOP`、`TOP`、`BELOW_TOP`、`ABOVE_BOTTOM`、`BOTTOM`、`BELOW_BOTTOM`\
  \ 或 `DEFAULT_POSITION`（顶）之一。\n* `static CompoundBorder createCompoundBorder(Border\
  \ outsideBorder, Border insideBorder)`\n  将两个边框组合为一个边框。\n\n### `javax.swing.border.SoftBevelBorder`\
  \ 1.2\n\n* `SoftBevelBorder(int type)`\n* `SoftBevelBorder(int type, Color highlight,\
  \ Color shadow)`\n  创建一个具有软圆角的斜角边框。`type` 参数是 `SoftBevelBorder.RAISED` 或 `SoftBevelBorder.LOWERED`\
  \ 之一。\n\n### `javax.swing.border.LineBorder` 1.2\n\n* `public LineBorder(Color color,\
  \ int thickness, boolean roundedCorners)`\n  创建一个给定颜色和厚度的线条边框。如果 `roundedCorners`\
  \ 为 `true`，则边框具有圆角。\n\n### `javax.swing.JComponent` 1.2\n\n* `void setBorder(Border\
  \ border)`\n  设置此组件的边框。\n\n### 11.4.4 组合框\n\n如果你有很多备选项，单选按钮不是一个好选择，因为它们占据了太屏幕空间。相反，你可以使用组合框（combo\
  \ box）。当用户点击此组件时，会弹出一个选项列表，用户随后可以选择其中一个（参见图 11.15）。\n\n![Images](img/011fig15.jpg)\n\
  \n**图 11.15** 组合框\n\n如果下拉列表框设置为 `editable`，你可以像编辑文本字段一样编辑当前选择项。正因如此，此组件被称为 `combo\
  \ box`——它结合了文本字段的灵活性和一组预定义的选项。\n\n\n\n\n\n点击此处查看代码图片\n\n```java\n 1  package comboBox;\n\
  \ 2\n 3  import java.awt.BorderLayout;\n 4  import java.awt.Font;\n 5\n 6  import\
  \ javax.swing.JComboBox;\n 7  import javax.swing.JFrame;\n 8  import javax.swing.JLabel;\n\
  \ 9  import javax.swing.JPanel;\n10\n11  /**\n12   * 一个带有示例文本标签和用于选择字体字体的组合框的框架。\n\
  13   */\n14  public class ComboBoxFrame extends JFrame\n15  {\n16     JComboBox<String>\
  \ faceCombo;\n17     private JLabel label;\n18     private static final DEFAULT_SIZE\
  \ = 24;\n19 \n20     public ComboBoxFrame()\n21     {\n22        // 添加示例文本标签\n23\
  \        label = new JLabel(\"The quick brown fox jumps over the lazy dog.\");\n\
  24        // 创建组合框\n25        faceCombo = new JComboBox<>();\n26        // 添加字体\n\
  27        faceCombo.addItem(\"Serif\");\n28        faceCombo.addItem(\"SansSerif\"\
  );\n29        faceCombo.addItem(\"Monospaced\");\n30        faceCombo.addItem(\"\
