  * `static Object newInstance(Class componentType, int newLength)`：创建一个指定类型的新数组。\n\
  \n#### 5.9 调用任意方法\n\n在 C++ 中没有方法指针——Lambda 表达式（后续章节讨论）是更好的解决方案。然而，反射机制允许你调用方法。记住\
  \ `Class` 类的 `invoke` 方法返回给定索引。如果返回类型是基本类型，它将返回包装类型，你需要对其进行强制转换。例如，假设 `m1` 代表 `getName`\
  \ 方法，以下代码显示了如何调用：\n\n点击此处查看代码图像\n\n```java\nString n = (String) m1.invoke(harry);\n\
  ```\n\n如果返回类型是基本类型，它将返回包装类型，你需要对其进行强制转换。例如，假设 `m2` 代表 `raiseSalary` 方法，以下代码显示了如何调用：\n\
  \n点击此处查看代码图像\n\n```java\ndouble s = (Double) m2.invoke(harry);\n```\n\n如何获取 `Method`\
  \ 对象？你当然可以调用 `getDeclaredMethods` 并遍历返回的 `Method` 数组，直到找到你想要的方法。或者，你可以调用 `Class`\
  \ 类的 `getMethod` 方法。这与获取一个字段名称字符串并返回 `Field` 对象的 `getField` 方法相似。然而，可能存在多个同名的方法，因此你需要确保获取的是正确的。因此，你还必须提供所需方法的参数类型。`getMethod`\
  \ 的签名如下：\n\n点击此处查看代码图像\n\n```java\nMethod getMethod(String name, Class... parameterTypes)\n\
  ```\n\n例如，这里是你可以获取 `Employee` 类中 `getName` 和 `raiseSalary` 方法指针的方法：\n\n点击此处查看代码图像\n\
  \n```java\nMethod m1 = Employee.class.getMethod(\"getName\");\nMethod m2 = Employee.class.getMethod(\"\
  raiseSalary\", double.class);\n```\n\n使用类似的方法来调用任意构造函数。将构造函数的参数类型传递给 `Class.getConstructor`\
  \ 方法，并将参数值传递给 `Constructor.newInstance` 方法：\n\n点击此处查看代码图像\n\n```java\nClass cl =\
  \ Random.class; // 或者任何带有 long 参数构造函数的类\nConstructor cons = cl.getConstructor(long.class);\n\
  Object obj = cons.newInstance(42L);\n```\n\n\n\n\n\n`Method` 和 `Constructor` 类继承了\
  \ `Executable` 类。从 Java 17 开始，`Executable` 类被密封类（sealed class），它只允许 `Method` 和 `Constructor`\
  \ 作为其子类。\n\n现在你已经了解了使用 `Method` 对象的规则，让我们大显用场吧。列表 5.19 是一个程序，它可以打印数学函数（如 `Math.sqrt`\
  \ 或 `Math.sin`）的数值表格。输出结果如下：\n\n点击此处查看代码图像\n\n```\npublic static native double java.lang.Math.sqrt(double)\n\
  \      1.0000 |      1.0000\n      2.0000 |      1.4142\n      3.0000 |      1.7321\n\
  \      4.0000 |      2.0000\n      5.0000 |      2.2361\n      6.0000 |      2.4495\n\
  \      7.0000 |      2.6458\n      8.0000 |      2.8284\n      9.0000 |      3.0000\n\
  \     10.0000 |      3.1623\n```\n\n当然，打印表格的代码与实际列出的表格函数无关的。\n\n点击此处查看代码图像\n\n```\n\
  double dx = (to - from) / (n - 1);\nfor (double x = from; x <= to; x += dx)\n{\n\
  \   double y = (Double) f.invoke(null, x);\n   System.out.printf(\"%10.4f | %10.4f%n\"\
  , x, y);\n}\n```\n\n在这里，`f` 是一个 `Method` 类型的对象。`invoke` 的第一个参数是 `null`，因为我们调用的是静态方法。\n\
  \n为了为 `Math.sqrt` 函数制作表格，我们将 `f` 设置为：\n\n点击此处查看代码图像\n\n```\nMath.class.getMethod(\"\
