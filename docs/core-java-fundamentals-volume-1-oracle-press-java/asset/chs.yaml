  60        }\n61     }\n62 }\n```\n\n## 12.7 异步计算\n\n到目前为止，我们处理并发计算的方法是分解任务，然后等待所有部分都完成。但等待并不总是一个好主意。在接下来的章节中，你将看到如何实现无等待（或`asynchronous`）计算。\n\
  \n#### 12.7.1 Completable Futures\n\n当你有一个 `Future` 对象时，你需要调用 `get` 来获取值，阻塞直到该值可用。`CompletableFuture`\
  \ 类实现了 `Future` 接口，并提供了另一种获取结果的机制。你注册一个 `callback`，一旦结果可用，该回调将在（某个线程）被调用并传入结果。\n\
  \n点击此处查看代码\n\n```\nCompletableFuture<String> f = . . .;\nf.thenAccept(s -> Process\
  \ the result string s);\n```\n\n通过这种方式，你可以在结果可用后无需阻塞地处理结果。\n\n有几个返回 `CompletableFuture`\
  \ 对象的 API 方法。例如，你可以使用在第二卷第 4 章中遇到的 `HttpClient` 类异步获取网页：\n\n点击此处查看代码\n\n```\nHttpClient\
  \ client = HttpClient.newHttpClient();\nHttpRequest request = HttpRequest.newBuilder(URI.create(urlString)).GET().build();\n\
  CompletableFuture<HttpResponse<String>> f = client.sendAsync(\n   request, BodyHandlers.ofString());\n\
  ```\n\n如果有一个方法可以直接产生现成的 `CompletableFuture` 就好了，但大多数时候，你需要自己创建。要异步运行任务并获取 `CompletableFuture`，你不需要直接将其提交给执行器。相反，你调用静态方法\
  \ `CompletableFuture.supplyAsync`。以下是在不借助 `HttpClient` 类帮助的情况下读取网页的方法：\n\n点击此处查看代码\n\
  \n```\npublic CompletableFuture<String> readPage(URL url)\n{\n   return CompletableFuture.supplyAsync(()\
  \ ->\n      {\n         try\n         {\n            return new String(url.openStream().readAllBytes(),\
  \ \"UTF-8\");\n         }\n         catch (IOException e)\n         {\n        \
  \    throw new UncheckedIOException(e);\n         }\n      }, executor);\n}\n```\n\
  \n如果你省略了执行器，任务将在默认执行器上（即由 `ForkJoinPool.commonPool()` 返回的执行器）上运行。你通常不想这样做。\n\n![Images](img/caution.jpg)\
  \ 警告\n\n注意 `supplyAsync` 的第一个参数是 `Supplier<T>`，而不是 `Callable<T>`。这两个接口描述的没有参数且返回\
  \ `T` 的函数，但 `Supplier` 函数不能抛出检查异常。如上面的代码所示，那并不是一个明智的选择。\n\n`CompletableFuture` 可以通过两种方式完成：通过结果，或者通过异常。为了处理这两种情况，请使用\
  \ `whenComplete` 方法。提供的函数将接收结果（如果没有则为 null）和异常（如果没有则为 null）。\n\n点击此处查看代码\n\n```\n\
  f.whenComplete((s, t) ->\n   {\n      if (t == null)\n      {\n         Process\
  \ the result s;\n      }\n      else\n      {\n         Process the Throwable t;\n\
  \      }\n   });\n```\n\n`CompletableFuture` 可完成是因为你可以手动设置完成值。（在其他并发库中，这种对象被称为 `promise`。）当然，当你使用\
  \ `supplyAsync` 创建 `CompletableFuture` 时，完成值会在任务完成后自动设置。但显式设置结果为你提供了额外的灵活性。例如，两个任务可以同时计算答案：\n\
  \n点击此处查看代码\n\n```\nvar f = new CompletableFuture<Integer>();\nexecutor.execute(()\
  \ ->\n   {\n      int n = workHard(arg);\n      f.complete(n);\n   });\nexecutor.execute(()\
  \ ->\n   {\n      int n = workSmart(arg);\n      f.complete(n);\n   });\n```\n\n\
  若要用异常完成 future，请调用\n\n```\nThrowable t = . . .;\nf.completeExceptionally(t);\n```\n\
  \n![Images](img/note.jpg) 注意\n\n在多个线程中对同一个 future 调用 `complete` 或 `completeExceptionally`\
  \ 是安全的。如果 future 已经完成，这些调用不会产生任何影响。\n\n`isDone` 方法告诉你 `Future` 对象是否已完成（正常完成或通过异常完成）。在之前的示例中，`workHard`\
  \ 和 `workSmart` 方法可以使用该信息，在结果被另一个方法确定后停止工作。\n\n\n\n\n\n与普通的 `Future` 不同，当你调用其 `cancel`\
  \ 方法时，`CompletableFuture` 的计算并不会中断。取消操作仅仅是将 `Future` 对象设置为以异常方式完成的，并抛出一个 `CancellationException`。通常情况下，这是合理的，因为\
  \ `CompletableFuture` 可能没有一个单一的线程来负责它的完成。然而，这一限制也适用于由 `supplyAsync` 等方法返回的 `CompletableFuture`\
  \ 实例，而这些实例在原则上是可以被中断的。\n\n## 12.7.2 组合 Completable Futures\n\n非阻塞调用是通过回调实现的。程序员为任务完成后可能要执行的操作注册一个回调。当然，如果下一个动作也是异步的，那么该动作之后的动作将位于另一个回调中。尽管程序员在思考时构想的是“先执行步骤\
  \ 1，然后是步骤 2，最后是步骤 3”，但程序逻辑可能会分散在“回调地狱”中。当必须添加错误处理时，情况变得更加糟糕。假设步骤 2 是“用户登录”。由于用户可能会输入错误的密码，你可能需要重复该步骤。在一组回调中实现这种控制流，或者在实现后理解它，都可能是非常有挑战性的。\n\
  \n`CompletableFuture` 类通过提供一种将异步任务*组合*成处理流水线的机制，解决了这个问题。\n\n例如，假设我们想从一个网页中提取所有图像。假设我们有一个方法：\n\
  \n```\npublic CompletableFuture<String> readPage(URL url)\n```\n\n它在网页内容可用时产生网页的文本。如果该方法\n\
  \n```\npublic List<URL> getImageURLs(String page)\n```\n\n产生产生 HTML 页面中图像的 URL，你可以安排在页面可用时调用该方法：\n\
  \n```\nCompletableFuture<String> contents = readPage(url);\nCompletableFuture<List<URL>>\
  \ imageURLs = contents.thenApply(this::getLinks);\n```\n\n`thenApply` 方法也不会阻塞。它返回另一个\
  \ future。当第一个 future 完成时，它的结果会被传递到 `getImageURLs` 方法中，而该方法的返回值将成为最终结果。\n\n使用可完成的\
  \ future，你只需要指定想要执行的操作以及这些操作的顺序。当然，所有这些操作并不会立即发生，但重要的是所有代码都集中在一个地方。\n\n从概念上来说，`CompletableFuture`\
  \ 是一个简单的 API，但用于组合 completable futures 的方法有很多变体。让我们先看看处理单个 future 的方法（参见表 12.3）。在表格中，我为冗长的函数接口使用了简记符号，用\
  \ `T -> U` 代替 `Function<? super T, U>`。当然，这些并不是实际的 Java 类型。\n\n**表 12.3** 为 `CompletableFuture<T>`\
  \ 对象添加操作\n\n| 方法 | 参数 | 描述 |\n| --- | --- | --- |\n| `thenApply` | `T -> U` | 对结果应用一个函数。\
  \ |\n| `thenAccept` | `T -> void` | 类似于 `thenApply`，但结果为 `void`。 |\n| `thenCompose`\
  \ | `T -> CompletableFuture<U>` | 在结果上调用函数并执行返回的 future。 |\n| `thenRun` | `Runnable`\
  \ | 执行结果为 `void` 的 `Runnable`。 |\n| `handle` | `(T, Throwable) -> U` | 处理结果或错误并产生新结果。\
  \ |\n| `whenComplete` | `(T, Throwable) -> void` | 类似于 `handle`，但结果为 `void`。 |\n\
  | `exceptionally` | `Throwable -> U` | 从错误计算一个结果。 |\n| `exceptionallyCompose` |\
  \ `Throwable -> CompletableFuture<U>` | 在异常上调用函数并执行返回的 future。 |\n| `completeOnTimeout`\
  \ | `T`, `long`, `TimeUnit` | 如果超时，返回给定值作为结果。 |\n| `orTimeout` | `long`, `TimeUnit`\
  \ | 如果超时，产生一个 `TimeoutException`。 |\n\n对于显示的每个方法，还有两个我没有显示的 `Async` 变体。其中一个使用通用的\
  \ `ForkJoinPool`，另一个则有一个 `Executor` 参数。\n\n你已经见过了 `thenApply` 方法。假设 `f` 是一个接收 `T`\
  \ 类型值并返回 `U` 类型值的函数。以下调用：\n\n```\nCompletableFuture<U> future.thenApply(f);\nCompletableFuture<U>\
  \ future.thenApplyAsync(f, executor);\n```\n\n返回一个 future，当 `future` 的结果可用时，对其应用函数\
  \ `f`。第二次调用使用另一个执行器运行 `f`。\n\n`thenCompose` 方法不是接收从类型 `T` 到类型 `U` 的映射，而是接收一个从 `T`\
  \ 映射到 `CompletableFuture<U>` 的函数。这听起来相当抽象，但它可以非常自然。考虑从给定的 URL 读取网页的操作。与其提供一个方法：\n\
  \n```\nCompletableFuture<String> contents = readPage(url);\nCompletableFuture<List<URL>>\
  \ imageURLs = contents.thenApply(this::getLinks);\n```\n\n不如让方法返回一个 future 更优雅：\n\
  \n```\nCompletableFuture<String> contents = readPage(url);\nCompletableFuture<List<URL>>\
  \ imageURLs = contents.thenApply(this::getLinks);\n```\n\n现在，假设我们有另一个方法获取输入，可能来自对话框。\n\
  \n```\nCompletableFuture<URL> getInput(String prompt)\n```\n\n这里有两个 `CompletableFuture<T>`\
  \ 和 `CompletableFuture<U>`。它们组合成函数 `T -> CompletableFuture<U>` 和 `U -> CompletableFuture<V>`，如果第一个完成的话。\n\
  \n```\nCompletableFuture<String> contents = readPage(url);\nCompletableFuture<List<URL>>\
  \ imageURLs = contents.thenApply(this::getLinks);\n```\n\n在上一节中，你看到了处理异常的 `whenComplete`\
  \ 方法。还有一个 `handle` 方法需要结果或异常。\n\n```\nCompletableFuture<String> contents = readPage(url);\n\
  CompletableFuture<List<URL>> imageURLs = contents.thenApply(this::getLinks);\n```\n\
  \n你可以以相同的方式处理超时：\n\n```\nCompletableFuture<String> contents = readPage(url);\nCompletableFuture<List<URL>>\
  \ imageURLs = contents.thenApply(this::getLinks);\n```\n\n或者，你可以在超时时抛出异常：\n\n```\n\
  CompletableFuture<String> contents = readPage(url).orTimeout(30, TimeUnit.SECONDS);\n\
  ```\n\n表 12.3 中结果为 `void`的方法通常用于处理流水线的结尾。\n\n现在让我们转向组合多个 future 的方法（参见表 12.4）。\n\
  \n**表 12.4** 组合多个组合对象\n\n| 方法 | 参数 | 描述 |\n| --- | --- | --- |\n| `thenCombine`\
  \ | `CompletableFuture<U>`, `(T, U) -> V` | 执行两者并用给定函数合并结果。 |\n| `thenAcceptBoth`\
  \ | `CompletableFuture<U>`, `(T, U) -> void` | 类似于 `thenCombine`，但结果为 `void`。 |\n\
  | `runAfterBoth` | `CompletableFuture<?>`, `Runnable` | 在两者完成后执行 runnable。 |\n|\
  \ `applyToEither` | `CompletableFuture<T>`, `T -> V` | 当其中一个或另一个的结果可用时，将其传递给给定函数。\
  \ |\n| `acceptEither` | `CompletableFuture<T>`, `T -> void` | 类似于 `applyToEither`，但结果为\
  \ `void`。 |\n| `runAfterEither` | `CompletableFuture<?>`, `Runnable` | 在其中一个完成后执行\
  \ runnable。 |\n| `static allOf` | `CompletableFuture<?>...` | 在所有给定的 future 完成后以\
  \ `void` 结果完成。 |\n\n\n\n\n\n| `static anyOf` | `CompletableFuture<?>...` | 在给定的\
  \ futures 中任意一个完成后完成后完成，并返回其结果。 |\n\n前三个方法并发运行一个 `CompletableFuture<T>` 和一个 `CompletableFuture<U>`\
  \ 动作并合并结果。\n\n接下来的三个方法并发运行两个 `CompletableFuture<T>` 动作。一旦其中一个完成，它的结果就会传递下去，另一个结果将被忽略。\n\
  \n最后，静态的 `allOf` 和 `anyOf` 方法接受任意数量的可完成 future（completable futures），并返回一个 `CompletableFuture<Void>`，该\
  \ future 在所有这些 future 都完成或其中任何一个 future 完成时完成。`allOf` 方法不产生结果。`anyOf` 方法*不会*终止剩余的任务。\n\
  \n![Images](img/note.jpg) 注意\n\n从技术上讲说，本节中的方法接受类型为 `CompletionStage` 的参数，而不是 `CompletableFuture`。`CompletionStage`\
  \ 接口描述了如何组合异步计算，而 `Future` 接口则关注计算的结果。`CompletableFuture` 既是 `CompletionStage` 也是\
  \ `Future`。\n\n`Listing 12.10` 显示了一个完整的程序，它读取一个网页、扫描其中的图像、加载图像并将它们保存到本地。注意所有耗时方法将如何返回一个\
  \ `CompletableFuture`。为了启动异步计算，我们使用了一个小技巧。我们没有直接调用 `readPage` 方法，而是使用 `URL` 参数创建一个已完成的\
  \ future，然后用 `this::readPage` 将该 future 组合起来。这样，流水线的外观变得非常统一：\n\n点击此处查看代码图片\n\n\
  ```\nCompletableFuture.completedFuture(url)\n   .thenComposeAsync(this::readPage,\
  \ executor)\n   .thenApply(this::getImageURLs)\n   .thenCompose(this::getImages)\n\
  \   .thenAccept(this::saveImages);\n```\n\n**Listing 12.10** `completableFutures/CompletableFutureDemo.java`\n\
  \n点击此处查看代码图片\n\n```\n 1  package completableFutures;\n 2\n 3  import java.awt.image.*;\n\
  \ 4  import java.io.*;\n 5  import java.net.*;\n 6  import java.nio.charset.*;\n\
