  \n### `java.util.logging.Logger` **1.4**\n\n- `getLogger(String loggerName)`\n-\
  \ `getLogger(String loggerName, String bundleName)`\n  获取指定名称的记录器。如果不存在则创建它。本地化消息位于名为\
  \ `bundleName` 的资源包中。\n- `severe(String message)`\n- `warning(String message)`\n\
  - `info(String message)`\n- `config(String message)`\n- `fine(String message)`\n\
  - `finer(String message)`\n- `finest(String message)`\n  根据方法名和给定的消息记录。\n- `entering(String\
  \ className, String methodName)`\n- `entering(String className, String methodName,\
  \ Object param)`\n- `entering(String className, String methodName, Object[] param)`\n\
  - `exiting(String className, String methodName)`\n- `exiting(String className, String\
  \ methodName, Object result)`\n  记录进入或退出方法，并带有指定的参数或返回值。\n- `throwing(String className,\
  \ String methodName, Throwable t)`\n  记录抛出指定的异常对象。\n- `log(Level level, String message)`\n\
  - `log(Level level, String message, Object obj)`\n- `log(Level level, String message,\
  \ Object[] objs)`\n- `log(Level level, String message, Throwable t)`\n  使用指定的级别和消息记录记录，可选包含对象或异常。要包含对象，消息必须包含格式位符（`{0}`、`{1}`\
  \ 等）。\n- `logp(Level level, String className, String methodName, String message)`\n\
  - `logp(Level level, String className, String methodName, String message, Object\
  \ obj)`\n- `logp(Level level, String className, String methodName, String message,\
  \ Object[] objs)`\n- `logp(Level level, String className, String methodName, String\
  \ message, Throwable t)`\n  使用指定的级别、精确的调用者信息和消息记录，可选包含对象或异常。\n\n\n\n\n\n*   `void\
  \ logrb(Level level, String className, String methodName, ResourceBundle bundle,\
  \ String message, Object... params)` 9\n*   `void logrb(Level level, String className,\
  \ String methodName, ResourceBundle bundle, String message, Throwable thrown)` 9\n\
  \    使用给定的级别、精确的调用者信息、资源包和消息记录一条记录，随后跟上对象或一个 throwable。\n\n*   `Level getLevel()`\n\
  *   `void setLevel(Level l)`\n    获取和设置此日志器的级别。\n\n*   `Logger getParent()`\n* \
  \  `void setParent(Logger l)`\n    获取和设置此日志器的父级日志器。\n\n*   `Handler[] getHandlers()`\n\
  \    获取此日志器所有的处理器。\n\n*   `void addHandler(Handler h)`\n*   `void removeHandler(Handler\
  \ h)`\n    为此日志器添加或移除一个处理器。\n\n*   `boolean getUseParentHandlers()`\n*   `void setUseParentHandlers(boolean\
  \ b)`\n    获取和设置“使用父级处理器”属性。如果该属性为 `true`，则日志器将所有日志记录转发给其父级器的处理器。\n\n*   `Filter\
  \ getFilter()`\n*   `void setFilter(Filter f)`\n    获取和设置此日志器的过滤器。\n\n### `java.util.logging.Handler`\
  \ 1.4\n*   `abstract void publish(LogRecord record)`\n    将记录发送到目标地。\n*   `abstract\
  \ void flush()`\n    刷新任何缓冲区数据。\n*   `abstract void close()`\n    刷新任何缓冲区数据并释放所有关联的资源。\n\
  *   `Filter getFilter()`\n*   `void setFilter(Filter f)`\n    获取和设置此处理器的过滤器。\n*\
  \   `Formatter getFormatter()`\n*   `void setFormatter(Formatter f)`\n    获取和设置此处理器的格式化器。\n\
  *   `Level getLevel()`\n*   `void setLevel(Level l)`\n    获取和设置此处理器的级别。\n\n### `java.util.logging.ConsoleHandler`\
  \ 1.4\n*   `ConsoleHandler()`\n    构造一个新的控制台处理器。\n\n### `java.util.logging.FileHandler`\
  \ 1.4\n*   `FileHandler(String pattern)`\n*   `FileHandler(String pattern, boolean\
  \ append)`\n*   `FileHandler(String pattern, int limit, int count)`\n*   `FileHandler(String\
  \ pattern, int limit, int count, boolean append)`\n*   `FileHandler(String pattern,\
  \ long limit, int count, boolean append)` 9\n    构造一个文件处理器。模式格式请参见 表 7.2。`limit`\
  \ 是打开新日志文件之前近似的最大字节数。`count` 是轮换序列中的文件数量。如果 `append` 为 `true`，则记录应追加到现有的日志文件中。\n\
  \n### `java.util.logging.LogRecord` 1.4\n*   `Level getLevel()`\n    获取此记录的日志级别。\n\
  *   `String getLoggerName()`\n    获取记录此记录的日志器名称。\n*   `ResourceBundle getResourceBundle()`\n\
  *   `String getResourceBundleName()`\n    获取用于消息本地化的资源包或其名称，如果未提供则返回 `null`。\n*\
  \   `String getMessage()`\n    获取本地化或格式化之前的“原始”消息。\n*   `Object[] getParameters()`\n\
  \    获取参数对象，如果未提供则返回 `null`。\n*   `Throwable getThrown()`\n    获取抛出的对象，如果未提供则返回\
  \ `null`。\n*   `String getSourceClassName()`\n*   `String getSourceMethodName()`\n\
  \    获取记录此记录的代码位置。此信息可能由日志代码提供，也可以从运行时堆栈自动推断。如果日志代码提供了错误的值或运行代码经过优化导致无法推断精确位置，则可能是不准确的。\n\
  *   `long getMillis()`\n    获取创建时间，自 1970 年以来来的毫秒数。\n*   `Instant getInstant()`\
  \ 9\n    作为 `java.time.Instant` 获取创建时间（参见卷二的第 6 章）。\n*   `long getSequenceNumber()`\n\
  \    获取此记录的唯一序列号。\n*   `long getLongThreadID()` 16\n    获取创建此记录的线程的唯一 ID。这些 ID 由\
  \ `LogRecord` 类分配，与其他线程 ID 无关系。`getThreadID` 方法返回 `int` 类型的 ID。现在已弃用，因为长时间运行的可能会生成超过\
  \ `Integer.MAX_VALUE` 个日志记录。\n\n### `java.util.logging.LogManager` 1.4\n*   `static\
  \ LogManager getLogManager()`\n    获取全局 `LogManager` 实例。\n*   `void readConfiguration()`\n\
  *   `void readConfiguration(InputStream in)`\n    从系统属性 `java.util.logging.config.file`\
  \ 指定的文件或给定的输入流读取日志配置。\n*   `void updateConfiguration(InputStream in, Function<String,BiFunction<String,String,String>>\
  \ mapper)` 9\n*   `void updateConfiguration(Function<String,BiFunction<String,String,String>>\
  \ mapper)` 9\n    使用映射器合并日志配置。\n\n### `java.util.logging.Filter` 1.4\n*   `boolean\
  \ isLoggable(LogRecord record)`\n    如果给定的日志记录应该被记录，则返回 `true`。\n\n### `java.util.logging.Formatter`\
  \ 1.4\n*   `abstract String format(LogRecord record)`\n    返回格式化日志记录后生成的字符串。\n*\
  \   `String getHead(Handler h)`\n*   `String getTail(Handler h)`\n    返回应出现在包含日志记录文档头部和尾部的字符串。`Formatter`\
  \ 父类定义了这些方法并返回空字符串；如有必要请重写它们。\n*   `String formatMessage(LogRecord record)`\n  \
  \  返回日志记录中本地化并格式化的消息部分。\n\n\n\n\n创建几个对象，调用所有方法，并检查每一个是否都按预期工作。你可以保留所有的 `main` 方法，并分别在每个文件上启动\
  \ Java 虚拟机来运行测试。当你运行一个小程序（applet）时，这些 `main` 方法永远不会被调用。当你运行一个应用程序时，Java 虚拟机只会调用启动类的\
  \ `main` 方法。\n\n3. 如果你喜欢上面的提示，应该检查一下来自 [`http://junit.org`](http://junit.org) 的\
  \ JUnit。JUnit 是一个非常流行的单元测试框架，可以让你轻松地组织测试用例集。每当你修改类时都运行测试，每当你发现 bug 时就添加另一个测试用例。\n\
  \n4. `日志代理`（logging proxy）是子类的一个对象，它会拦截方法调用、对其进行记录，然后调用父类。例如，如果你在 `Random` 类的 `nextDouble`\
  \ 方法上遇到问题，可以创建一个匿名子类的实例作为代理对象：\n\n点击此处查看代码图像\n\n```\nvar generator = new Random()\n\
  \   {\n      public double nextDouble()\n      {\n         double result = super.nextDouble();\n\
  \         Logger.getGlobal().info(\"nextDouble: \" + result);\n         return result;\n\
  \      }\n   };\n```\n\n每当 `nextDouble` 方法被调用时，就会生成一条日志消息。\n\n要找出是谁调用了该方法，请生成堆栈跟踪（stack\
  \ trace）。\n\n5. 你可以通过 `Throwable` 类中的 `printStackTrace` 方法从任何异常对象获取堆栈跟踪。以下代码捕获任何异常，打印异常对象和堆栈跟踪，并重新抛出异常以便其找到预期的处理器。\n\
  \n```\ntry\n{\n   . . .\n}\ncatch (Throwable t)\n{\n   t.printStackTrace();\n  \
  \ throw t;\n}\n```\n\n你甚至不需要捕获异常即可生成堆栈跟踪。只需在代码任何地方插入语句\n\n```\nThread.dumpStack();\n\
  ```\n\n即可获取堆栈跟踪。\n\n6. 通常，堆栈跟踪显示在 `System.err.` 上。如果你想记录或显示堆栈跟踪，可以这样将其捕获字符串中：\n\n\
  点击此处查看代码图像\n\n```\nvar out = new StringWriter();\nnew Throwable().printStackTrace(new\
  \ PrintWriter(out));\nString description = out.toString();\n```\n\n7. 将程序错误记录到文件中通常很有用。然而，错误被发送到\
  \ `System.err` 而不是 `System.out`。因此，你不能简单地通过运行来捕获它们\n\n```\njava MyProgram > errors.txt\n\
  ```\n\n相反，应将错误流捕获为：\n\n```\njava MyProgram 2> errors.txt\n```\n\n要在同一个文件中捕获 `System.err`\
  \ 和 `System.out`，请使用\n\n点击此处查看代码图像\n\n```\njava MyProgram 1> errors.txt 2>&1\n```\n\
  \n这在 `bash` 和 Windows 命令行均有效。\n\n8. 让未捕获异常的堆栈跟踪出现在 `System.err` 中并不是理想的。如果用户看到这些消息，会感到困惑，而且在你需要进行诊断时这些信息并可用。更好的方法是将它们记录到文件中。你可以通过\
  \ `Thread.setDefaultUncaughtHandler` 方法更改未捕获异常的处理器：\n\n点击此处查看代码图像\n\n```\nThread.setDefaultUncaughtHandler(new\
  \ Thread.UncaughtHandler()\n   {\n      public void uncaughtException(Thread t,\
