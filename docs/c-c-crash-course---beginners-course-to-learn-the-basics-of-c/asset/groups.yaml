    \n在 C# 中，你只能在循环体内部使用此运算符。这意味着 “break” 仅在循环运行时才有效。\n\n## Do-While 循环 (The Do-While\
    \ Loop)\n\n`do-while` 循环与 `while` 循环几乎相同。这些循环之间的唯一区别在于，前者在运行循环体后分析布尔值。因此，你可以放心，即使布尔表达式为假，你的代码也会至少运行一次。这里是\
    \ `do-while` 循环的语法：\n\n```cs\ndo {\n  statements;\n} while (Boolean expression);\n\
    ```\n\n`do-while` 循环按照此模式工作：\n\n![](img/e2e831cc76860601d1e5511399855ee6_43_0.png)\n\
    \n程序将执行循环体内所有的语句。然后，它将检查条件（即布尔表达式）。如果条件评估为 `true`，程序将再次执行循环体并执行“值检查”。这个过程将持续进行直到条件变为\
    \ `false`。因此，如果你分配的条件始终评估为 `true`，你的代码可能会无限运行。\n\n## For 循环 (The For Loop)\n\n\
    通常情况下，“for”循环比 `do-while` 和 `while` 循环更复杂。然而，循环可以帮助你用更少的 C# 代码完成困难的任务。“for” 循环的语法为：\n\
    \n```cs\nfor (initializer; Boolean_expression; update)\n{\n  the_loop’s_body;\n\
    }\n```\n\n一个 “for”循环包含一个初始化器（即计数器的初始值）、一个布尔表达式、一个更新计数器的 C# 语句以及循环体。\n\n“计数器”（即分配给循环的初始值）是\
    \ “for”循环最显著的特征。在大多数情况下，计数器的值会一直增加，直到达到最终值（例如从 1 到 10）。此外，程序员通常知道 “for”循环将迭代多少次。\n\
    \n你可以在 “for”循环中包含一个或多个变量。这些变量可以按降序或升序顺序移动。在编写程序时，你可以在单个 “for”循环中组合升序和降序变量。此外，升序变量可以从\
    \ 1 变到 1024，因为 “for”循环支持算术运算（例如加法、乘法等）。\n\n重要提示：“for”循环的所有部分都是可选的。你可以通过在语法中留出空白来创建一个无限的\
    \ “for”循环。这是一个示例：\n\n```cs\nfor ( ; )\n{\n  // Loop body\n}\n```\n\n此时，你已经准备好学习更多关于\
    \ “for”循环的不同部分了。\n\n## 初始化 (The Initialization)\n\n“for”循环可以拥有一个初始化片段：\n\n```cs\n\
    for (double sample = 1; ...; ...)\n{\n  // You can use the “sample” variable\n\
    }\n```\n\n你可以使用 “sample”变量。C# 程序在运行循环体之前执行初始化片段。通常，程序员使用初始化片段来创建变量。这里包含一个更新计数器的\
    \ C# 语句以及循环体。C# 允许在循环体内使用赋值值。\n\n## 条件 (The Condition)\n\n显然，“for”循环需要一个布尔表达式。示例如下：\n\
    \n```cs\nfor (double sample = 1; sample < 5; sample++)\n{\n  // Loop body\n}\n\
    ```\n\n## 更新 (The Update)\n\n在某些情况下，“for”循环的一部分。更新语句会更新计数器。在这种情况下，使用以下代码：\n\n\
    ```cs\nfor (double sample = 1; sample < 10; sample++)\n{\n  // Loop body\n}\n\
    ```\n\n## 循环体 (The Loop’s Body)\n\n这是 “for”循环的一部分。可以使用以下代码：\n\n```cs\nfor (double\
    \ sample = 10; sample > 1; sample--)\n{\n    Console.WriteLine(sample);\n}\n```\n\
    \n## Continue 运算符 (The Continue Operator)\n\n当你想停止当前的迭代时，可以使用此运算符。示例如下：\n\n```cs\n\
    int n = int.Parse(Console.ReadLine());\nint sum = 0;\nfor (int i = 1; i <= n;\
    \ i++)\n{\n    if (i % 2 == 0)\n    {\n        continue;\n    }\n    sum += i;\n\
    }\nConsole.WriteLine(\"sum = \" + sum);\n```\n\n## Foreach 循环 (The Foreach Loop)\n\
    \n最近，C# 引入了 “foreach”循环。这种循环适用于列表、数组或其他数据组。在编写这种循环时，使用以下语法：\n\n```cs\nforeach\
    \ (variable in group)\n{\n    statements\n}\n```\n\n## 嵌套 For 循环 (Nested For Loop)\n\
    \nC# 允许你将一个 “for”循环放在另一个 “for”循环内部。最内层的循环执行次数最多，最外层的执行次数最少。使用以下语法：\n\n```cs\n\
    for (initializer; condition; update)\n{\n    for (initializer; condition; update)\n\
    \    {\n        statements\n    }\n}\n```\n"
