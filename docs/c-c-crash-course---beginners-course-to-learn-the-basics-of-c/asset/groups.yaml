    \ optional. You can create an infinite “for” loop by leaving blank spaces on the\
    \ syntax. Here’s an example:\n\n```\nfor ( ; )\n{\n  // Loop body\n}\n```\n\n\
    At this point, you’re ready to learn more about the different sections of the\
    \ “for” loop.\n\n# The Initialization\n\nA “for” loop can possess an initializing\
    \ fragment:\n\n```\nfor (double sample = 1; ...; ...)\n{\n  // You can use the\
    \ “sample” variable here.\n}\n// You can’t use the variable here.\n```"
  - "[PAGE 45]\n\nC# programs execute this fragment once, right before running the\
    \ “for” loop. Often, programmers use an initializing fragment to create a counter\
    \ (also known as “loop variable”) and assign its initial value. This counter is\
    \ available and usable when inside the loop’s body. C# allows you to declare multiple\
    \ variables using a single initializing fragment.\n\n# The Condition\n\nObviously,\
    \ a “for” loop needs a conditional expression. Here’s a sample:\n\n```\nfor (double\
    \ sample = 1; sample < 5;)\n{\n  // This is the loop’s body.\n}\n```\n\nComputer\
    \ programs evaluate the conditional expression before running the loop’s body.\
    \ If the result is “true”, the body of the loop will run; otherwise, the involved\
    \ program will jump to the statements written after the current loop.\n\n# The\
    \ Update Statement\n\nThis is the final part of a “for” loop. Basically, an update\
    \ statement updates the loop’s counter. Let’s use the code snippet given above:\n\
    \n```\nfor (double sample = 10; sample > 1; sample—)\n{\n  // This is the loop’s\
    \ body.\n}\n```\n\nThe program executes this part after running the loop’s body.\
    \ Keep in mind that this statement updates the counter’s value.\n\n# The Loop’s\
    \ Body"
  - "[PAGE 46]\n\nThis part consists of C# statements. It can utilize the variables\
    \ declared in the loop\ninitializing fragment. Check the example below:\n\n```\n\
    for (double sample = 10; sample > 1; sample—)\n{\n    System.Console.WriteLine(sample);\n\
    }\n```\n\n# The Continue Operator\n\nIn some cases, you need to stop the active\
    \ iteration without ending the loop itself. You can accomplish this task using\
    \ the C# operator called “continue”. The example given below will illustrate how\
    \ this works:\n\n```\nint n = int.Parse(Console.ReadLine());\nint sum = 0;\nfor\
    \ (int i = 1; i <= n; i += 2)\n{\n    if (i % 7 == 0)\n{\n        continue;\n\
    \    }\n    sum += i;\n}\nConsole.WriteLine(\"sum = \" + sum);\n```\n\nThis code\
    \ computes the total of all the odd numbers within the range (1 to n), which produce\
    \ remainders when divided by 7.\n\n# The “Foreach” Loop\n\nJust recently, C# introduced\
    \ the concept of “foreach” loops (i.e. extended “for” loops). This loop is also\
    \ available in other programming languages such as C, VB, C++, PHP, etc. With\
    \ this programming tool, you can run all of the elements of a list, array, or\
    \ other groups of values. A “foreach” loop takes all of the existing elements\
    \ even in non-indexed data groups.\n\nWhen writing this kind of loop, use the\
    \ following syntax:"
  - "[PAGE 47]\n\n```\nforeach (type name_of_variable in name_of_group)\n{\n    the_statements;\n\
    }\n```\n\nAs you can see, this loop is much simpler than a typical “for” loop.\
    \ A “foreach” loop can help you scan all of the objects inside a collection quickly.\
    \ It’s no surprise that countless programmers use this loop in writing their codes.\n\
    \n# The Nested For Loop\n\nC# allows you to place a “for” loop inside another\
    \ “for” loop. The loop at the innermost part of the code runs the most number\
    \ of times. The one at the outermost section, on the other hand, gets the least\
    \ number of repetitions. You should use the following syntax when “nesting” for\
    \ loops:\n\n```\nfor (initializing_fragment, condition, update_statement)\n{\n\
    \    for (initializing_fragment, condition, update_statement)\n    {\n       \
    \ statements\n    }\n}\n```\n\nHere, the program runs the initial “for” loop,\
    \ executes its body, and triggers the nested loop. The program will check the\
    \ second loop’s condition and execute the codes inside it until the evaluation\
    \ becomes false. Then, the program will make the necessary adjustments on the\
    \ loops’ counters. The program will repeat the entire process until all of the\
    \ conditions evaluate to false."
  - '[PAGE 48]


    # Chapter 8: The Methods of the C# Language


    This chapter will focus on the C# methods. Here, you''ll learn how to declare
    and utilize methods in your own programs. You need to memorize the lessons contained
    in this chapter if you want to be an effective C# programmer in just 7 days.


    # Methods – The Basics'
  - '[PAGE 49]


    For most programmers, methods are core aspects of any program. Methods can solve
    problems, accept user inputs (known as parameters), and produce results.


    Methods complete their tasks by representing the data conversions done by the
    program. Additionally, methods are the areas where the actual processes are completed.
    This is the main reason why C# programmers consider methods as the basic units
    of any program.


    # The Benefits Offered by Methods


    In this section, you''ll discover the major benefits offered by C# methods. After
    reading this material, you''ll know why you should use these tools in writing
    your programs.


    # Better Structure and Code Readability


    Programming experts claim that you should use methods while writing computer programs.
    Methods, even the simplest ones, can improve the structure and readability of
    your C# codes.


    Here’s an important fact that you need to know: programmers spend 20% of their
    time on writing and checking their computer program. The remaining 80% is spent
    on maintaining and improving the software. Obviously, you’ll have an easy time
    working on your program if your codes are readable and well-structured.


    # Prevention of Redundant Codes


    Methods can help you avoid redundant codes in your programs. Redundant or duplicated
    codes often produce undesirable results in computer applications.


    # Better Code Repetition


    This benefit is closely related to the previous one. If your program needs to
    use a certain code fragment multiple times, it’s an excellent idea to transfer
    the said fragment into a C# method. You can invoke methods multiple times, which
    means you can repeat important codes without retyping them.'
- md: "\n# Declaring, Implementing, and Invoking C# Methods\n\nAt this point, you\
    \ need to know the processes that you can perform on an existing method.\nThese\
    \ processes are:\n\n- Declaration – In this process, you will link a method to\
    \ a program. This process allows you to call the method in any part of your program.\n\
    \n- Implementation – This process involves entering codes to complete a certain\
    \ task. The codes involved here exist inside the method you’re using.\n\n- Invocation\
    \ – This is the process of calling a declared method. Here, you’ll use the method\
    \ to solve a problem or perform an action.\n\n## Method Declarations\n\nIn C#,\
    \ you need to declare methods inside a class. Additionally, you’re not allowed\
    \ to “nest” methods (i.e. write a method inside the body of another method). The\
    \ perfect example for this is Main(), the method you’ve used multiple times. The\
    \ code given below will illustrate this:\n\n```csharp\nclass DeclaringMethods\n\
    {\n    static void Main()\n    {\n        System.Console.WriteLine(\"Hi C#!\"\
    );\n    }\n}\n```\n\n### The Syntax\n\nUse the following syntax when declaring\
    \ a method:\n\n```\nstatic data_type_of_the_result name_of_method(list_of_parameters)\n\
    ```\n\nLet’s analyze this syntax using the Main() method (i.e. static void Main()).\
    \ Main() uses “void” as its return type since it doesn’t generate any result.\
    \ The word “Main” serves as name. The parentheses, on the other hand, act as containers\
    \ for the parameters that the programmer will provide.\n\nImportant Note: You\
    \ have to follow this syntax when writing a C# program. Don’t change the placement\
    \ of the method’s parts.\n\nC# doesn’t require you to include parameters in your\
    \ declarations. That means you can leave the parentheses empty (e.g. Main()).\n\
    \n## The Method’s Name\n\nYou need to indicate the method’s name during declarations,\
    \ invocations, or implementations. Here are the rules that you need to remember\
    \ when naming your methods:\n\n- Make sure that the initial letter is in uppercase.\n\
    \n- Begin each word with an uppercase letter (e.g. SampleMethod, NewMethod, MainLine,\
    \ etc.).\n\n- Use verbs and nouns as names of your methods.\n\nImportant Note:\
    \ The rules discussed above are completely optional. Follow these rules you want\
    \ to have excellent structure and readability in your C# codes.\n\n## Method Implementations\n\
    \nDeclaring a method isn’t enough. You also need to implement your methods if\
    \ you want them to run inside your programs. Programmers use the term “body” when\
    \ referring to the implementation of a method.\n\n## The Body\n\nYou'll find the\
    \ method’s body inside a pair of curly braces. This body consists of commands,\
    \ expressions, and statements that you want to execute. Thus, the body is an important\
    \ part of any method.\n\nImportant Note: Keep in mind that you cannot nest methods\
    \ in C#. Don’t write methods inside other methods.\n\n## Method Invocations\n\n\
    Basically, this is the process of running the statements within the method’s body.\
    \ Invoking a method is easy and simple: you just have to indicate its name, add\
    \ a pair of curly braces, and terminate the line using a semicolon. Here’s the\
    \ syntax that you should use:\n\n```\nname_of_method();\n```\n\nThe sample code\
    \ given below will show you how to invoke a method:\n\n```csharp\nclass Animals\
    \ {\n    static void Main()\n    {\n        Console.WriteLine(\"I love dogs.\"\
    );\n    }\n}\n```\n\nIf you’ll compile and execute that code, your command prompt\
    \ will print the following message:\n\nI love dogs.\n\n## The Places Where You\
    \ Can Invoke a Method\n\nC# allows you invoke methods in the following areas:\n\
    \n- Inside the program’s main method (i.e. Main()).\n- Inside another method.\n\
    - Inside the method’s own body. This technique is called “recursion”.\n\n## Conclusion\n\
    \nThank you again for downloading this book!\nI hope this book was able to help\
    \ you become a skilled C# programmer in just a few days.\nThe next step is to\
    \ continue writing your own programs using C#.\n\nFinally, if you enjoyed this\
    \ book, then I’d like to ask you for a favor, would you be kind enough to leave\
    \ a review for this book on Amazon? I’d be greatly appreciated!\nThank you and\
    \ good luck!\n"
  mdcn: "\n\n# C# 方法的声明、实现与调用\n\n此时，你需要了解对现有方法可以执行的操作流程。\n这些过程包括：\n\n- 声明（Declaration）——\
    \ 在此过程中，你将一个方法链接到程序中。此过程允许你在程序的任何部分调用该方法。\n\n- 实现（Implementation）—— 此过程涉及输入代码以完成某个特定任务。这里涉及的代码存在于你正在使用的方法内部。\n\
    \n- 调用（Invocation）—— 这是调用已声明方法的过程。在这里，你将使用该方法来解决问题或执行操作。\n\n## 方法声明\n\n在 C# 中，你需要在类内部声明方法。此外，你不允许“嵌套”方法（即在另一个方法的体内部编写方法）。最完美的例子就是\
    \ `Main()`，这个你已经使用过多次的方法。下面的代码将说明这一点：\n\n```csharp\nclass DeclaringMethods\n{\n\
    \    static void Main()\n    {\n        System.Console.WriteLine(\"Hi C#!\");\n\
    \    }\n}\n```\n\n### 语法\n\n声明方法时，请使用以下语法：\n\n```\nstatic data_type_of_the_result\
    \ name_of_method(list_of_parameters)\n```\n\n让我们使用 `Main()` 方法来分析这一语法（即 `static\
    \ void Main()`）。`Main()` 使用 “void” 作为其返回类型，因为它不产生任何结果。“Main” 单词作为名称。另一方面，括号充当程序员将提供的参数的容器。\n\
    \n**重要说明**：在编写 C# 程序时，你必须遵循此语法。不要更改方法各个部分的排列顺序。\n\nC# 并不要求在声明中包含参数。这意味着你可以让括号保持为空（例如\
    \ `Main()`）。\n\n## 方法名称\n\n在声明、调用或实现期间，你需要指定方法的名称。以下是你为方法命名时需要记住的规则：\n\n- 确保首字母大写写。\n\
    \n- 每个单词的起始字母都用大写字母开头（例如 `SampleMethod`、`NewMethod`、`MainLine` 等）。\n\n- 使用动词和名词作为方法的名称。\n\
    \n**重要说明**：上述讨论的规则完全可选可选。如果你希望你的 C# 代码具有良好的结构和可读性，请遵循这些规则。\n\n## 方法实现\n\n仅声明方法是不够的。如果你想让方法在程序中运行，你还需要实现你的方法。程序员在提到方法的实现时会使用“体（body）”一词。\n\
    \n## 方法体\n\n你会在一对大括号内找到方法的。这个体由你想要执行的命令、表达式和语句组成。因此，体是任何方法的重要部分。\n\n**重要说明**：请记住，在\
    \ C# 中你不能嵌套方法。不要在其他方法内部编写方法。\n\n## 方法调用\n\n基本上，这是运行方法体内语句的过程。调用方法既简单又容易：你只需要指定它的名称，添加一对大括号，并使用分号结束行。以下是你应该使用的语法：\n\
    \n```\nname_of_method();\n```\n\n下面提供的示例代码将向你展示如何调用方法：\n\n```csharp\nclass Animals\
    \ {\n    static void Main()\n    {\n        Console.WriteLine(\"I love dogs.\"\
    );\n    }\n}\n```\n\n如果你编译并执行该代码，你的命令行提示符将打印以下消息：\n\nI love dogs.\n\n## 可以调用方法的地方\n\
    \nC# 允许你在以下区域调用方法：\n\n- 在程序的主方法内部（即 `Main()`）。\n- 在另一个方法内部。\n- 在方法自身的体内部。这种技术被称为“递归”。\n\
    \n## 结论\n\n再次感谢你下载这本书！\n希望这本书能够帮助你在短短几天内成为一名熟练的 C# 程序员。\n下一步将是继续使用 C# 编写你自己的程序。\n\
    \n最后，如果你喜欢这本书，我想请你帮个忙，你是否愿意在 Amazon 上为这本书留留一个评价？我将不胜感激！\n感谢并祝你好运！\n\n"
