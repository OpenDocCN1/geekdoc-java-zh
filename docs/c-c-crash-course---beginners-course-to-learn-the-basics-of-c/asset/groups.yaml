    \ familiar with the syntax and structures of this language.\n\n# Your First Program\n\
    \nHere's the code that you need to type:\n\n```\nclass HelloCSharp\n{\n    static\
    \ void Main(string[] args)\n    {\n        System.Console.WriteLine(\"Hello C#\"\
    );\n    }\n}\n```\n\nThis program prints \"Hello, C#\" onto your computer's default\
    \ output device. It's still a \"raw\" program so you can't run it yet. For now,\
    \ let's just analyze its structure. The next section will teach you how compile\
