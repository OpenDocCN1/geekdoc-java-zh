    # Chapter 7: The Loop Statements


    This chapter will teach you how to use loop statements. As a programmer, you’ll
    use a loop statement to run certain code blocks repeatedly. Loops play an important
    part in C# programming. Hence, you should study this material carefully as well
    as if you want to master this language in 7 days.


    Loops – The Basics


    While creating programs, you often need to execute code sequences multiple times.
    Typing the same blocks of code several times can be extremely boring. Thus, you
    need to find a quick and simple way to repeat codes. Fortunately, the C# language
    supports statements.


    A loop is a tool that runs code fragments repeatedly. You can use it to run codes
    for a certain number of times or as long as a given condition is fulfilled. C#
    offers different types of loop statements. Let’s analyze each type in detail:'
  - "[PAGE 41]\n\n# The While Loop\n\nThis is the simplest loop statement in C#. Its\
    \ syntax is:\n\n```\nwhile (the_assigned_condition)\n{\n  the_loop's_body;\n}\n\
    ```\n\nIn this syntax, \"the_assigned_condition\" is an expression that produces\
    \ a Boolean value. This condition dictates how many times the \"body\" will run.\
    \ The \"body\", on the other hand, is the statement (or group of statements) that\
    \ you want to execute.\n\nThe diagram given below will illustrate how while loops\
    \ work:\n\n![](img/e2e831cc76860601d1e5511399855ee6_41_0.png)\n\nWhen working\
    \ on a “while” loop, a C# program checks the value of the Boolean expression.\
    \ If the value is “true\", the program will run all of the statements within the\
    \ loop’s body. Then, the program will check the Boolean expression to see its\
    \ value. If the value is still true, the program will rerun the loop’s body and\
    \ go back to the first step (i.e. check the expression’s value). This process\
    \ will go on until the Boolean expression evaluates to false. Once this happens,\
    \ the program will process the code blocks right after the loop.\n\nImportant\
    \ Note: Your C# program won’t run the loop’s body if the Boolean expression is\
    \ false. Thus, if the B00 value is false when you launched the program, your in-loop\
    \ statements will never be executed."
- md: "\nThe following example will illustrate how while loops work:\n\n```cs\nint\
    \ timer = 10;\nwhile (timer >= 0)\n{\n    System.Console.WriteLine(\"Time remaining:\
    \ \" + timer);\n    timer--;\n}\n```\n\nIf you will compile and execute this code,\
    \ your command prompt will print this data:\n\n```\nTime remaining: 10\nTime remaining:\
    \ 9\nTime remaining: 8\nTime remaining: 7\nTime remaining: 6\nTime remaining:\
    \ 5\nTime remaining: 4\nTime remaining: 3\nTime remaining: 2\nTime remaining:\
    \ 1\nTime remaining: 0\n```\n\n## The Break Operator\n\nYou can use \"break\"\
    \ (a C# operator) to exit a loop prematurely. Programmers use this operator if\
    \ they don't want to wait for the loop’s natural termination. Basically, a loop\
    \ will end once it encounters a break operator. This situation forces the program\
    \ to jump to the code fragments right after the loop.\n\nIn C#, you can only use\
    \ this operator inside the loop’s body. That means “break” will only work while\
    \ the loop is running.\n\n## The Do-While Loop\n\nA do-while loop is almost identical\
    \ to a while loop. The only difference between these loops is that the former\
    \ analyzes the Boolean value after running the loop’s body. Thus, you can rest\
    \ assured that your codes will run at least once even if the Boolean expression\
    \ is false. Here is the syntax of the do-while loop:\n\n```cs\ndo {\n  statements;\n\
    } while (Boolean expression);\n```\n\nDo-while loops work according to this pattern:\n\
    \n![](img/e2e831cc76860601d1e5511399855ee6_43_0.png)\n\nThe program will execute\
    \ all of the statements within the loop’s body. Then, it will check the condition\
    \ (i.e. the Boolean expression). If the condition evaluates to true, the program\
    \ will execute the loop’s body again and perform the “value inspection”. This\
    \ process will go on until the condition becomes false. Thus, your codes might\
    \ run forever if your assigned condition always evaluates to true.\n\n## The For\
    \ Loop\n\nIn general, “for” loops are more complex than do-while and while loops.\
    \ However, loops can help you perform difficult tasks using fewer C# codes. The\
    \ syntax of a “for” loop is:\n\n```cs\nfor (initializer; Boolean_expression; update)\n\
    {\n  the_loop’s_body;\n}\n```\n\nA “for” loop has an initializer (i.e. the initial\
    \ value of the counter), a Boolean expression, a C# statement that updates the\
    \ counter, and the loop’s body.\n\nThe “counter” (i.e. the initial value assigned\
    \ to the loop) serves as a “for” loop’s most distinctive feature. In most cases,\
    \ the counter’s value increases until it reaches the final value (e.g. 1 to 10).\
    \ Also, programmers usually know how many times the “for” loop will iterate.\n\
    \nYou may include one or more variables in your “for” loops. These variables may\
    \ move in descending or ascending order. When writing programs, you may combine\
    \ ascending and descending variables in a single “for” loop. In addition, an ascending\
    \ variable can go from 1 to 1024 because “for” loops support arithmetic operations\
    \ (e.g. addition, multiplication, etc.).\n\nImportant Note: All of the parts of\
    \ a “for” loop are optional. You can create an infinite “for” loop by leaving\
    \ blank spaces on the syntax. Here’s an example:\n\n```cs\nfor ( ; )\n{\n  //\
    \ Loop body\n}\n```\n\nAt this point, you’re ready to learn more about the different\
    \ sections of the “for” loop.\n\n## The Initialization\n\nA “for” loop can possess\
    \ an initializing fragment:\n\n```cs\nfor (double sample = 1; ...; ...)\n{\n \
    \ // You can use the “sample” variable here.\n}\n// You can’t use the variable\
    \ here.\n```\n\nC# programs execute this fragment once, right before running the\
    \ “for” loop. Often, programmers use an initializing fragment to create a counter\
    \ (also known as “loop variable”) and assign its initial value. This counter is\
    \ available and usable when inside the loop’s body. C# allows you to declare multiple\
    \ variables using a single initializing fragment.\n\n## The Condition\n\nObviously,\
    \ a “for” loop needs a conditional expression. Here’s a sample:\n\n```cs\nfor\
    \ (double sample = 1; sample < 5;)\n{\n  // This is the loop’s body.\n}\n```\n\
    \nComputer programs evaluate the conditional expression before running the loop’s\
    \ body. If the result is “true”, the body of the loop will run; otherwise, the\
    \ involved program will jump to the statements written after the current loop.\n\
    \n## The Update Statement\n\nThis is the final part of a “for” loop. Basically,\
    \ an update statement updates the loop’s counter. Let’s use the code snippet given\
    \ above:\n\n```cs\nfor (double sample = 10; sample > 1; sample--)\n{\n  // This\
    \ is the loop’s body.\n}\n```\n\nThe program executes this part after running\
    \ the loop’s body. Keep in mind that this statement updates the counter’s value.\n\
    \n## The Loop’s Body\n\nThis part consists of C# statements. It can utilize the\
    \ variables declared in the loop initializing fragment. Check the example below:\n\
    \n```cs\nfor (double sample = 10; sample > 1; sample--)\n{\n    System.Console.WriteLine(sample);\n\
    }\n```\n\n## The Continue Operator\n\nIn some cases, you need to stop the active\
    \ iteration without ending the loop itself. You can accomplish this task using\
    \ the C# operator called “continue”. The example given below will illustrate how\
    \ this works:\n\n```cs\nint n = int.Parse(Console.ReadLine());\nint sum = 0;\n\
    for (int i = 1; i <= n; i += 2)\n{\n    if (i % 7 == 0)\n    {\n        continue;\n\
    \    }\n    sum += i;\n}\nConsole.WriteLine(\"sum = \" + sum);\n```\n\nThis code\
    \ computes the total of all the odd numbers within the range (1 to n), which produce\
    \ remainders when divided by 7.\n\n## The “Foreach” Loop\n\nJust recently, C#\
    \ introduced the concept of “foreach” loops (i.e. extended “for” loops). This\
    \ loop is also available in other programming languages such as C, VB, C++, PHP,\
    \ etc. With this programming tool, you can run all of the elements of a list,\
    \ array, or other groups of values. A “foreach” loop takes all of the existing\
    \ elements even in non-indexed data groups.\n\nWhen writing this kind of loop,\
    \ use the following syntax:\n\n```cs\nforeach (variable in group)\n{\n    statements;\n\
    }\n```\n\n## The Nested For Loop\n\nC# allows you to place a “for” loop inside\
    \ another “for” loop. The loop at the innermost part runs the most times. The\
    \ one at the outermost section, on the other hand, gets the least number of repetitions.\
    \ You should use the following syntax:\n\n```cs\nfor (initializer; condition;\
    \ update)\n{\n    for (initializer; condition; update)\n    {\n        statements\n\
    \    }\n}\n```\n\n## The Methods of the Language\n\nThis chapter will focus on\
    \ C# methods. Here, you'll learn how to declare and utilize methods in your own\
    \ programs. You need to memorize the lessons contained in this chapter if you\
    \ want to be an effective C# programmer in 7 days.\n\n### Methods – The Basics\n\
    \nFor most programmers, methods are core aspects of any program. Methods can solve\
    \ problems, accept user inputs (known as parameters), and produce results.\n\n\
    Methods complete their tasks by representing data conversions done by the program.\
    \ Additionally, methods are the areas where the actual processes are completed.\
    \ This is the main reason why C# programmers consider methods as the basic units\
    \ of any program.\n\n### The Benefits Offered by Methods\n\nIn this section, you'll\
    \ discover the major benefits offered by C# methods. After reading this material,\
    \ you'll know why you should use these tools in writing your programs.\n\n###\
    \ Better Structure and Code Readability\n\nProgramming experts claim that you\
    \ should use methods while writing computer programs. Methods, even the simplest\
    \ ones, can improve the structure and readability of your C# codes.\n\nHere’s\
    \ an important fact that you need to know: programmers spend 20% of their time\
    \ on writing and checking their computer program. The remaining 80% is spent on\
    \ maintaining and improving the software. Obviously, you’ll have an easy time\
    \ working on your program if your codes are readable and well-structured.\n\n\
    ### Prevention of Redundant Codes\n\nMethods can help you avoid redundant codes\
    \ in your programs. Redundant or duplicated codes often produce undesirable results\
    \ in computer applications.\n\n### Better Code Repetition\n\nThis benefit is closely\
    \ related to the previous one. If your program needs to use a certain code fragment\
    \ multiple times, it’s an excellent idea to transfer the said fragment into a\
    \ C# method. You can invoke methods multiple times, which means you can repeat\
    \ important codes without retyping them.\n"
