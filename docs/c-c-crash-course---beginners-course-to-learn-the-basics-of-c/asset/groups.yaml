    \ 方法\n\n该方法为想要从控制台读取数据的人提供了简单性和便利性。当你调用此方法时，你的程序将停止并等待用户的输入。然后，用户可能会输入一个字符或字符串并按下“回车键”。通过按下回车键，用户通知程序他们已输入所需的输入。`Console.ReadLine`\
