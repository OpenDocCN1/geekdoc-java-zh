    \            }\n        } while (codeRead != 10);\n    }\n}\n```\n\n## 如何读取数字\n\
    \nC# 程序不直接读取数字。它们需要将输入视为字符串（即通过 `Console.ReadLine` 方法）并将它们转换为数字。将字符串转换为其他数据类型的过程被称为解析（parsing）。C#\
    \ 语言中的所有原始数据类型都支持这一过程。\n\n## 控制台输出\n\n本书的这部分将关注两个方法：`Console.WriteLine` 和 `Console.Write`。这两个方法都可以打印\
    \ C# 语言中的所有数据类型。这意味着你可以使用它们在用户的控制台上显示消息。\n\n以下代码段将将教你这些方法是如何工作的：\n\n```cs\nConsole.WriteLine(\"\
    I want to learn the C# programming language.\");\n// 这一行将打印括号内的字符串。\n```\n\n```cs\n\
    Console.WriteLine(100);\n// 这一行将在用户的命令行提示符上显示 \"100\"。\n```\n\n```cs\nConsole.WriteLine(3.14);\n\
    // 这一行将在用户的控制台上打印 double 类型的值 3.14。\n```\n\n你可以使用 `Console.WriteLine` 方法在用户的屏幕上显示不同类型的数据。这是因为\
    \ Console 类具有每种数据类型的内置版本。\n\n`Console.WriteLine` 和 `Console.Write` 之间的唯一区别是，前者打印括号内的值并在控制台上添加一个换行符，而后者仅显示括号内的信息。因此，在你的代码中使用\
    \ `Console.WriteLine` 相当于在显示消息后按了“回车键”（即光标将移动到下一行）。\n\n## 字符串拼接\n\nC# 语言阻止程序员在字符串值上使用运算符。显然，你不能对实际的单词进行算术操作（例如\
    \ fish – dog、power * humans、land / people 等）。但是，C# 允许你拼接（即组合）多个字符串对象以生成新字符串。你可以通过在字符串上使用“+符号来实现。下面的示例将阐明这一思想。\n\
    \n```cs\nstring gadget = \"smartphone\";\nstring example = \"I use my \" + gadget\
    \ + \"to access \" + \"the internet.\";\nConsole.WriteLine(example);\n```\n\n\
    如果你执行该代码，控制台将显示：\n\n> I use my smartphone to access the internet.\n\n## 第 6 章：C#\
    \ 的条件语句\n\n本章将教你如何在 C# 代码中使用条件语句。基本上，条件语句是一个代码块，允许你根据分配的条件执行各种操作。请仔细阅读这些材料，因为它包含了可以帮助你在\
    \ 7 天内精通 C# 的价值信息。\n\n## 运算符\n\n在此部分，你将学习更多关于 C# 比较运算符的信息。这些运算符非常重要：它们可以帮助你设置条件语句的条件。\n\
    \n## 比较运算符\n\nC# 具有不同的运算符，可以用它们比较相同类型的值。这些运算符是：\n\n- <\n- >\n- <=\n- >=\n- !=\n\
    - ==\n\n你可以使用上述运算符来比较 C# 表达式（例如，两个整数、变量、两个常量等）。在使用这些运算符任何一个时，结果将始终是一个布尔值（Boolean）。分析以下示例：\n\
    \n```cs\nint height = 170;\nConsole.WriteLine(height < 180); // 这将给你 \"true\"\
    ;\n\nstring gender = \"Male\";\nConsole.WriteLine(gender == \"Female\"); // 这将给你\
    \ \"false\";\n\ndouble valueofPi = 3.14;\nConsole.WriteLine(valueofPi > 100);\
    \ // 这将给你 \"true\";\n```\n\n## 逻辑运算符\n\nC# 还支持一些逻辑运算符。程序员使用这些运算符来创建布尔（Boolean）语句。让我们详细讨论每个逻辑运算符：\n\
    \n## AND 和 OR 运算符\n\n你可以将逻辑与运算符（即 `&&`）和逻辑或运算符（即 `||`）用于涉及布尔值的表达式上。逻辑与运算符在两个操作数都为真时将给你“true”。例如：\n\
    \n```cs\nbool sample = (1 < 2) && (10 == 10);\n```\n\n由于 1 小于 2 且 10 等于 10，表达式将给你真。由于与运算符可以在不进行不必要的分析的情况下提供结果，程序员被称为“短路运算符”。它首先检查语句的左侧。如果评估结果为“false”，操作将立即停止。表达式不再为真。\n\
    \n逻辑或运算符（即 `||`）在至少有一个操作数为为真时将给你真。例如：\n\n```cs\nbool sample = (1 < 2) || (10 >\
    \ 100);\n```\n\n这个示例将给你真，因为左侧的操作数为真。逻辑或运算符也是一种“短路运算符”，因为它即使不检查整个 语句也可以给出结果。在当前示例中，逻辑或运算符不再分析第二个操作数，因为第一个已经是真实的了。因此，条件已经满足。\n\
    \n## 异或和取反运算符\n\n异或运算符（即 `^`）是一个全路运算符，因为它需要在给出结果之前检查两个操作数。只有当一个操作数为真时，它才会给你真。检查下面的示例：\n\
    \n```cs\nbool sample = (1 < 2) ^ (2 == 2);\n```\n\n由于两个表达式都是真，异或将给你假。\n\n取反运算符（即\
    \ `!`）则只是简单地反转它所附加的布尔值。例如：\n\n```cs\nbool sample = !(1 < 2);\n```\n\n1 小于 2。但是由于“!”附加在布尔表达式上，结果将被反转。这意味着该表达式的值为“false”。\n\
    \n"
