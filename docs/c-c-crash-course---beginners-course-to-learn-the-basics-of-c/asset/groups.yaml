    \n以下是你需要的操作：\n\n- 1. 访问电脑的控制面板并点击“系统”。\n- 2. 你将看到一个新窗口。搜索“高级系统设置”并点击它。\n- 3. 点击“环境变量”，并寻找名为“Path”的变量。\n\
