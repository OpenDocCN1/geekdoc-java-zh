    ## 变量


    你可以使用变量来存储、检索和修改可变数据。作为一名程序员，你需要在存储和处理信息时使用变量。


    ## 变量的特征


    变量具有以下特征：


    - 名称（也称为“标识符”）

    - 数据类型

    - 值（即你想要存储的信息）


    变量是具有名称的计算机内存区域。它们存储值并允许计算机访问其内容。你可以将变量放在栈中（stack，即你计算机程序的运行内存）或程序的动态内存中。


    字符（Character）、布尔值（Boolean）和整数（Integer）被称为**值类型**（value types），因为它们将数据保留在程序的栈中。相反，字符串、数组和对象被称为**引用类型**（reference
    types），因为它们内部并不直接持有值。相反，它们充当标记，指向存储数据的计算机内存部分。


    ## 如何命名变量


    在使用变量之前，你为为它们命名。变量名充当标识符的作用：它可以帮助程序定位和指定变量。C# 允许你自由选择变量名。然而，与任何其他语言一样，C# 对变量名有规定。这些规则如下：


    - 你可以使用下划线（即 `_`）和数字来创建变量名。

    - 你不能用数字开头命名。因此，`FirstSample` 是有效的，而 `1Sample` 则不是。

    - 在命名变量时不能使用 C# 关键字。这条简单的规则可以防止程序中出现编译错误和运行时错误。如果你真的想为变量使用关键字，可以使用“@”符号开头命名（例如
    `@bool`、`@int`、`@char` 等）。


    ## 如何声明变量


    你应该在使用变量之前对其进行声明。在声明变量时，你需要完成以下操作：


    - 指定变量的数据类型（例如 `char`）

    - 指定变量的名称（例如 `sample`）

    - 设置变量的初始值。这一步完全可选可选。


    变量声明的格式为：


    ```

    data_type name = initial_value;

    ```


    以下是一些有效变量声明的示例：


    ```

    int year = 2000;

    ```


    ```

    string yearname = "";

    ```


    ```

    char test = ''t'';

    ```


    重要提示：你需要使用分号结束每个 C# 语句。如果你忘记添加哪怕一个分号，你的程序都会产生不理想和/或意外的结果。


    ## 如何赋值


    与其他计算机语言一样，C# 允许你为变量赋值。这个过程被称为“值赋值”，它需要你使用等号。程序员将此符号称为“赋值运算符”。在运算符左侧编写变量名，在右侧指定你想要赋值的值。查看以下示例：


    ```

    test = x;

    ```


    ```

    yearname = "John Doe";

    ```


    ## 如何初始化变量


    在编程中，“初始化”是给新变量赋值的过程。因此，你在声明变量时会设置这个“初始值”。


    ## 变量的默认值


    如果你没有为变量分配任何值，C# 将执行自动初始化（即它将为空变量分配一个值）。下表将显示每个数据类型的默认值：


    | 数据类型 | 默认值 | 数据类型 | 默认值 |

    |---|---|---|---|

    | sbyte | 0 | float | 0.0f |

    | byte | 0 | double | 0.0d |

    | short | 0 | decimal | 0.0m |

    | ushort | 0 | bool | false |

    | int | 0 | char | ''\u0000'' |

    | uint | 0u | string | null |

    | long | 0l | object | null |

    | ulong | 0u | | |


    下面的代码将向你展示如何声明变量和赋值。


    ```

    // This is an example

    ```


    ```

    byte years = 10;

    ```


    ```

    short days = 31;

    decimal pi = 3.14;

    bool isattasty = true;

    char sample = ''x'';

    string animal = "dog";

    ```


    重要提示：以两个正斜杠开头（即 `//`）的行是“注释”。在编程中，注释是添加到代码中的描述性文本，用以提高其可读性。语言编译器会忽略这些行。因此，注释不会影响你计算机程序的功能。


    ## 值与引用


    C 程序员将数据类型分为两类：值类型和引用类型。

    值类型存在于程序的执行栈中。此外，它持有程序员存储的值。值类型类别包括布尔值、字符和整数。分配给这些数据类型的内一旦程序完成代码执行，就会释放。例如，一旦程序关闭，你程序中
    `Main()` 方法内的变量将会被清空。


    另一方面，引用类型在程序的栈中存储一个地址（即引用）。该地址指向所需值的位置。基本上，引用类型在声明期间会分配动态内存。每当程序不再需要它时，它也会释放一些内存。


    ## 字面量


    字面量是源代码的一部分的固定值。例如，100 是一个字面量，"Hello" 是一个字面量。字面量用于初始化变量。


    字面量分为几类：


    - 实数

    - 整数

    - 字符串

    - 字符

    - 布尔值


    ## 实数


    实数字面量具有符号（即 `+`/`-`）、后缀、前缀和小数点。你应该将其用于 double、float。C# 允许指数形式的实数。以下是其后缀：


    - F 表示 float。

    - D 表示 double。

    - M 表示 decimal。

    - E 表示指数。


    ## 整数


    整数字面量由前缀、后缀、符号（即 `+`/`-`）和一组数字组成。你可以使用十六进制。以下是前缀和后缀：


    - 0X 表示十六进制值。

    - U 表示无符号 int (uint) 或无符号长 (long)。

    - L 表示长值。


    重要提示：如果不使用任何后缀，C# 将整数字面量标记为“int”。此外，字面量（即 L、U 和 X）不区分大小。


    ## 字符串


    使用此字面量表示字符串值。基本上，字符串字面量是放置在双引号内的字符集（例如 `"sample"`）。


    重要提示：在 C# 语言中，你可以使用“@”符号创建引用（或逐字）字符串。程序员使用这些字符串命名文件路径。


    ## 字符


    字符字面量是单引号包围的单个字符（例如 `''z''`）。使用字符字面量设置属于“char”类型的值。此外，你可以将字符字面量写为：


    - 单个字符

    - 特殊字符的代码

    - 转义代码（见下文）


    ## 转义代码


    这些是向你的源代码添加字符的特殊字符序列。（等待下方列表）


    ## 布尔值


    布尔字面量只有两种类型：true 和 false。在处理“bool”（即布尔值）变量时，你只能分配这些值之一。下面的代码片段将向你展示如何声明一个布尔字面量：


    ```

    bool answer = false;

    ```


