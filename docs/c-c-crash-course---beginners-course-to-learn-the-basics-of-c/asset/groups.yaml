    This variable holds a positive number.\");\n```\n\n## The If-Else Statement\n\n\
    Just like other programming languages, C# supports \"if-else\" conditional statements.\
    \ When writing an if-else statement, you should use the following syntax:\n\n\
    ```\nif (the Boolean variable or expression)\n{\n    The conditional statement's\
    \ body;\n}\nelse\n{\n    The else statement's body;\n}\n```\n\nThe syntax given\
    \ above consists of the following parts:\n\n- • “if” clause – This part begins\
    \ the conditional statement.\n- • The Boolean expression or variable – The value\
    \ of this expression determines the codes that the program will use.\n- • The\
