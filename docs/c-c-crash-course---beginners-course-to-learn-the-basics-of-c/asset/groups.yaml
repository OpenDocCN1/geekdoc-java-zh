    class HelloCSharp\n{\n    static void Main()\n    {\n        System.Console.WriteLine(\"\
    Hello C!\");\n    }\n}\n```\n\n## Writing a C# Program Using the Command Prompt\n\
    \nFirst, you need to launch the “Command Prompt” (also known as “Command Console”).\
    \ If you are using Windows 7 or Windows 8, you can click on the Start button and\
    \ run a search for \"cmd\". Check the search results and look for the program\
    \ named “Command Prompt\". Right-click on the program and choose “Run as administrator”\
    \ from the menu.\nHere's a screenshot:\n\n![](img/e2e831cc76860601d1e5511399855ee6_9_0.png)\n\
    \nImportant Note: If you launch the Command Prompt by double-clicking on it, some\
    \ of its important features might be unavailable.\n\nNext, you need to generate\
    \ a file directory so you can store the resulting program. Type \"md\" by the\
    \ directory's name. Then, enter \"cd\" to get inside the new directory. Here’s\
    \ a screenshot:\n\n```\nC:\\Windows\\system32>md CHPrograms\nC:\\Windows\\system32>cd\
    \ CHPrograms\nC:\\Windows\\System32\\CHPrograms>_\n```\n\nFor this example, the\
    \ name of the directory is \"C#Programs\". The \"cd\" command changed the active\
    \ directory to \"C:\\Windows\\System32\\C#Programs\". Now, you’re ready to create\
    \ the .cs file. Go back to the Command Prompt and issue the following command:\n\
    \n```bash\nnotepad HelloCsharp.cs\n```\n\nAfter running that command, your screen\
    \ will show you:\n\n![](img/e2e831cc76860601d1e5511399855ee6_9_1.png)\n\nYour\
    \ computer will tell you that HelloCsharp.cs doesn’t exist. Also, it will ask\
    \ you whether you like to create a new file. Click on the \"Yes\" button and copy\
    \ the program’s code onto the Notepad application. The screenshot below will help\
    \ you with this step:\n\n## HelloCSharp. - Notepad\n\n```csharp\nclass HelloCSharp\n\
    {\n    static void Main()\n    {\n        System.Console.WriteLine(\"Hello C!\"\
    );\n    }\n}\n```\n\nPress CTRL+S to save the file. Then close the text editor\
    \ by hitting the red X or pressing ALT+F4. Now, you'll see your program's code\
    \ inside the \"C# Programs\" directory.\n\n## Compiling the Code\n\nAt this point,\
    \ you can compile the source code using \"csc\" (i.e. the built-in compiler of\
