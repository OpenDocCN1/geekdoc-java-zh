    # # Chapter 2: The Data Types, Variables, and Literals of C#


    This chapter will focus on the data types and variables used in the C# language.
    By reading this material, you’ll know what these objects are and how you can use
    them in writing your own programs.


    Variables – An Introduction


    Typical programs utilize different values during their execution. For instance,
    you can develop a program that solves mathematical problems. Obviously, you need
    to enter different values while using this kind of program. Simply put, programmers
    don’t know which values will be entered by the user. Thus, they need to make sure
    that the resulting programs will accept any value that the user may provide.


    When the user gives a value, you may temporarily store it in the machine’s RAM
    (i.e. random access memory). All of the values inside this memory may change.
    Because of this, programmers refer to such values as “variables”.


    The Data Types'
