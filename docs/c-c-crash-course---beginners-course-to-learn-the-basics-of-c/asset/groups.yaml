    \ a practiced individual in the profession should be ordered.\n\n- From a Declaration\
    \ of Principles which was accepted and approved equally by a Committee of the\
    \ American Bar Association and a Committee of Publishers and Associations.\n\n\
    In no way is it legal to reproduce, duplicate, or transmit any part of this document\
    \ in either electronic means or in printed format. Recording of this publication\
    \ is strictly prohibited and any storage of this document is not allowed unless\
    \ written permission from the publisher. All rights reserved.\n\nThe information\
    \ provided herein is stated to be truthful and consistent, in that any liability,\
    \ in terms of inattention or otherwise, by any usage or abuse of any policies,\
    \ processes, or directions contained within the is the solitary and utter responsibility\
    \ of the recipient reader. Under no circumstances will any any legal responsibility\
    \ or blame be held against the publisher for any reparation, damages, or monetary\
    \ loss due to the information herein, either directly or indirectly.\n\nRespective\
    \ authors own all copyrights not held by the publisher.\n\nThe information herein\
    \ is offered for informational purposes solely, and is universal as so. The presentation\
    \ of the information is without contract or any type of guarantee assurance.\n\
    \nThe trademarks that are used without any consent, and the publication of the\
    \ trademark is without permission or backing by the trademark owner. All trademarks\
    \ and brands within this book are for clarifying purposes only and are owned by\
    \ the owners themselves, not affiliated with this document.\n\n# # Table of Contents\n\
    \n- Introduction\n- Chapter 1: The Core Concepts of C#\n- Chapter 2: The Data\
    \ Types, Variables, and Literals of C#\n- Chapter 3: The Operators of the C# Language\n\
    - Chapter 4: Data Type Conversion\n- Chapter 5: The Console\n- Chapter 6: The\
    \ Conditional Statements of C#\n- Chapter 7: The Loop Statements\n- Chapter 8:\
    \ The Methods of the C# Language\n- Conclusion\n\n# Chapter 1: The Core Concepts\
    \ of C#\n\nAccording to computer experts, the best way to learn a programming\
    \ language is by writing and analyzing codes. Thus, you'll write an actual computer\
    \ program before studying the language itself. This approach will help you to\
    \ understand how C# works. Also, you'll become familiar with the syntax and structures\
    \ of this language.\n\n# Your First Program\n\nHere's the code that you need to\
    \ type:\n\n```c\nclass HelloCSharp\n{\n    static void Main(string[] args)\n \
    \   {\n        System.Console.WriteLine(\"Hello C#\");\n    }\n}\n```\n\nThis\
    \ program prints \"Hello, C#\" onto your computer's default output device. It's\
    \ still a \"raw\" program so you can't run it yet. For now, let's just analyze\
    \ its structure. The next section will teach you how compile and run programs\
    \ using a command prompt and a programming environment.\n\n## How Does It Work?\n\
    \nThis sample program consists of three parts:\n\n1. The class definition;\n2.\
    \ The method definition; and\n3. The method's contents.\n\nLet's discuss each\
    \ part in detail:\n\nThe Class Definition – The initial line of the program defines\
    \ a class named HelloCSharp. The most basic class definition has two sections:\
    \ (1) the word \"class\" and (2) the name of the new class. In this example, HelloCSharp\
    \ serves as the class's name. You'll find the contents of this class inside the\
    \ pair of braces (i.e. { }).\n\nThe Method Definition – This part is located at\
    \ the third line of the program. Here, you defined a method known as Main(). All\
    \ C programs use the main() method as their starting point. Here's the syntax\
    \ that you need to use:\n\n```c\nstatic void Main(string[] args)\n```\n\nAs you\
    \ can see, Main() needs to be void and static. The arguments (i.e. the part inside\
    \ the parentheses) are completely optional. That means you can simplify the Main()\
    \ function into:\n\n```c\nstatic void Main()\n```\n\nImportant Note: Your program\
    \ won't run if you enter the Main() method incorrectly.\n\nThe Method’s Contents\
    \ – You’ll find the contents of any method after its name. In general, a pair\
    \ of braces encloses those contents. The fifth line of the sample program uses\
    \ an object (i.e. System.Console) and a method (i.e. WriteLine()) to display a\
    \ message on your computer’s console. As mentioned earlier, the message is \"\
    Hello, C#\"\n\nImportant Note: When working on Main(), you may arrange C# expressions\
    \ and statements according to your preferences. You won't get any error message\
    \ if you arrange those expressions and/or statements randomly. However, your completed\
    \ program will run those entries according to their position inside the method’s.\n\
    \n# The Rules You Need to Remove When Writing Codes\n\n# C# – A Case-Sensitive\
    \ Computer Language\n\nThis language is case-sensitive. That means you need to\
    \ be careful with capitalization when typing C# codes. Basically, C# treats \"\
    power\", \"Power\", and POWER as three different objects.\n\nImportant Note: You\
    \ need to remember this rule. It applies to all of the elements of any C# program\
    \ (e.g. variables, classes, etc.).\n\n# Use the Proper Format\n\nYou need to add\
    \ tabs, spaces, and newline characters to your code to improve its readability.\
    \ These characters, which are ignored by the C# compiler, give an excellent structure\
    \ to your source codes.\n\nFor instance, you may remove the newline characters\
    \ from the HelloSharp code:\n\n```c\nclass HelloSharp{static void Main() {System.Console.WriteLine(\"\
    Hello C#!\");}}\n```\n\nAs an alternative, you may remove the tab characters from\
    \ it:\n\n```c\nclass HelloSharp\n{\n  static void Main()\n{\n    System.Console.WriteLine(\"\
    Hello C#!\");\n  }\n}\n```\n\nThe last two examples work in terms of compilation\
    \ and program execution. However, they are difficult to analyze, modify, understand,\
    \ and maintain.\n\nImportant Note: Make sure that all of your programs have formatted\
    \ codes. This way, you can guarantee the readability of your codes.\n\n# How to\
    \ Format Codes Properly\n\nHere are the rules that you need to follow when formatting\
    \ your codes:\n\n- You may indent methods within the class definition. C# allows\
    \ you to use any number of tab characters (i.e. the character you’ll get after\
    \ hitting the Tab key of your keyboard) when formatting source codes.\n- You should\
    \ indent the method's contents within its own definition.\n- Place the opening\
    \ brace (i.e. {) right under the class or method to which it belongs. Also, it\
    \ would be best if it will be the only character on its line.\n- Make sure the\
    \ closing brace (i.e. } ) is vertically aligned with the opening brace.\n- The\
    \ names of your class should begin with an uppercase letter.\n- The names of your\
    \ variables should start with a lowercase letter.\n- The names of your methods\
    \ should begin with an uppercase letter.\n- Indent codes that are written inside\
    \ another code.\n\n# Class Names\n\nIn C#, each program has one or more class\
    \ definitions. Programmers often store each class definition inside a separate\
    \ file that corresponds to the class's name. also the extension of these files\
    \ be “.cs”. You can compile different classes into a single file without experiencing\
    \ any problems. However, you’ll have a hard time navigating your codes.\n\n# More\
    \ Information about C#\n\nThe C# language is advanced, modern, multipurpose, and\
    \ object-oriented. It has some similarities with other languages such as C++,\
    \ and Java. The main difference is that C# offers easier programming and simplified\
    \ syntaxes.\n\nA C# program has one or more .cs files, which hold data types and\
    \ class definitions. You need to compile those .cs files to get executables (i.e.\
    \ files that end with .dll or .exe). For instance, if you compile the HelloCSharp\
    \ program, you’ll get an executable file named “HelloCSharp.exe”.\n\n# The Things\
    \ You Need to Create C# Programs\n\nBefore you can write programs using C#, you\
    \ need two important things—a text editor (e.g. Notepad) and the .NET framework.\
    \ The text editor will help you in writing and editing codes. The .NET framework,\
    \ on the other hand, will help you in compiling and executing your programs.\n\
    \n# What is .NET?\n\nBasically, .NET is a framework designed for the development\
    \ and execution of computer programs. Most of the modern Windows systems have\
    \ .NET as a built-in framework. Thus, you won’t have to install any software onto\
    \ your computer if you are using Microsoft’s modern operating systems.\n\nIf you\
    \ are using an old Windows OS, you need to download the .NET framework first.\
    \ You may go to this site and get the most recent version of .NET.\n"
