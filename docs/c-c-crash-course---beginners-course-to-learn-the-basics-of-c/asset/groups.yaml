  - '[PAGE 22]


    “&” – This is called “Binary AND”. It indicates the position/s where both of the
    operands have “1”.


    “^” – Programmers refer to this operator as “Binary Exclusive OR”. It will place
    “1” in each position where the values are different.


    “|” – This is the “Binary OR” operator. It indicates the position/s where any
    of the operands have “1”.


    “~” – This is the negation operator for binary values. Just like “!”, it reverses
    the current value of a variable.


    “<<” – This is the “Binary Left Shift” operator. It moves the bits of a binary
    number to the left. This movement depends on the value that you’ll assign (e.g.
    4 << 1, 4 << 3, 4 << 2, etc.).


    # Comparison Operators


    These operators allow you to compare the values inside two operands. Each of these
    operands gives a Boolean value as the final output. Here are the comparison operators
    of the C# language:


    +   == – This is the Equality operator. It checks whether the two operands are
    equal (e.g. x == y).


    +   >” – This operator checks whether the left-hand operand’s value is greater
    than that of the right-hand operand (e.g. x > y).


    +   <<” – This operator compares the values of the two operands. It will give
    you “true” if the left-hand operand’s value is less than that of the right-hand
    operand (e.g. y < x).


    +   >=” – With this operator, you can determine whether the value of the left-hand
    operand is greater or equal to that of the right-hand operand.


    +   <= – This operator will give you true if the left-hand operand is less or
    equal to that of the right-hand operand.


    +   != – Use this operator to check the equality of two operands. It will give
    you true if they are not equal (e.g. x != y).


    # Conditional Operator


    C# users refer to "?" as the conditional operator. Basically, this operator uses
    the result of a Boolean expression to determine which statement should be processed.
    This is called “ternary operator” because it works on three operands. Here, the
    first value should be Boolean, while the remaining values need to belong to the
    same data type (e.g. characters, strings, numbers, etc.).


    The syntax of this operator is:


    ```

    first_operand ? second_operand : third_operand;

    ```'
