    number of tab characters (i.e. the character you’ll get after hitting the Tab
    key of your keyboard) when formatting source codes.


    +   - You should indent the method''s contents within its own definition.


    +   - Place the opening brace (i.e. {) right under the class or method to which
    it belongs. Also, it would be best if it will be the only character on its line.


    +   - Make sure the closing brace (i.e. } ) is vertically aligned with the opening
    brace.


    +   - The names of your class should begin with an uppercase letter.


    +   - The names of your variables should start with a lowercase letter.


    +   - The names of your methods should begin with an uppercase letter.


    +   - Indent codes that are written inside another code.


    # Class Names


    In C#, each program has one or more class definitions. Programmers often store
    each class definition inside a separate file that corresponds to the class''s
    name. also the extension of these files be “.cs”. You can compile different classes
    into a single file without experiencing any problems. However, you’ll have a hard
    time navigating your codes.


    # More Information about C#


    The C# programming language is advanced, modern, multipurpose, and object-oriented.
    It has some similarities with other languages such as C,++, and Java. The main
    difference is that C# offers easier programming and simplified syntaxes.


    A C# program has one or more .cs files, which hold data types and class definitions.
    You need to compile those .cs files to get executables (i.e. files that end with
    .dll or .exe). For instance, if you compile the HelloCSharp program, you’ll get
    an executable file named “HelloCSharp.exe”.


    # The Things You Need to Create C# Programs


    Before you can write programs using C#, you need two important things—a text editor
    (e.g. Notepad) and the .NET framework. The text editor will help you in writing
    and editing codes. The .NET framework, on the other hand, will help you in compiling
    and executing your programs.


    # What is .NET?


    Basically, .NET is a framework designed for the development and execution of computer
    programs. Most of the modern Windows systems have .NET as a built-in framework.
    Thus, you won’t have to install any software onto your computer if you are using
    Microsoft’s modern operating systems.


    If you are using an old Windows OS, you need to download the .NET framework first.
    You may go to this site and get the most recent version of .NET.'
- md: "\nImportant Note: Make sure that your computer has .NET before reading the\
    \ rest of this book. Otherwise, you'll have problems compiling and executing the\
    \ sample programs that you'll see later.\n\n## Text Editors\n\nYou should use\
    \ a text editor to write, edit, and save source codes. You can use any text editor\
    \ installed on your computer. If you don't want to download additional programs,\
    \ you may simply use \"Notepad\" (i.e. the pre-installed text editor of Windows\
    \ computers).\n\n## Compiling and Executing Programs\n\nNow, it's time to compile\
    \ and run the HelloCSharp program you've seen earlier. Here are the things you\
    \ need to do:\n\n- 1. Generate a “.cs” file and name it “HelloCSharp”.\n- 2. Write\
    \ the source code inside that .cs file.\n- 3. Compile the code to get a .exe file.\n\
    - 4. Run the resulting program.\n\nTurn on your computer and let's start writing\
    \ some codes.\nImportant Note: This eBook assumes that you are using a Windows\
