    \ of curly braces.\n- • The “else” keyword – This is a C# keyword that triggers\
    \ the “else” clause.\n- • The else clause’s body – This is identical to the conditional\
    \ statement’s body (above).\n\nWhen working on an if-else statement, if a computer\
    \ program analyzes the value within the parentheses. The value needs to be Boolean\
    \ (i.e. either true or false). If the value “true”, the program will execute the\
    \ conditional statement’s body and ignore the “else” clause. If the value is false,\
    \ the program will run the else statement’s body. Analyze the following example:\n\
    \n```c\nint a = 100;\nif (a != 50)\n{\n    Console.WriteLine(\"The variable is\
    \ not equal to 50\");\n}\nelse\n{\n    Console.WriteLine(\"The variable is equal\
    \ to 50\");\n}\n```\n\nYou can interpret this code as: if a != 50, the console\
    \ will print: “The variable is not equal to 50”. On the other hand, if a = 50,\
    \ the console will show: “The variable is equal to 50”. Since the variable named\
    \ a holds 100, your command prompt will give you this:\n\nThe variable is not\
    \ equal to 50\n\n## Nested Statements\n\nIn some cases, you need to write an “if”\
    \ statement inside another “if” statement. Programmers refer to this process as\
    \ “nesting”. That means you are “nesting” a conditional statement if you are writing\
    \ it inside another conditional statement.\n\n**Important Note:** C# allows you\
    \ to nest if-else statements. In this situation, each “else” clause points to\
    \ the “if” clause that comes before it. This simple rule can help you analyze\
    \ nested conditional statements, which can be extremely complex.\n\nAccording\
    \ to expert programmers, you should not create more than three levels of nested\
    \ statements. If you really need to use four or more conditional structures, export\
    \ them to a different method (You’ll learn about methods later).\n\n```c\nint\
    \ a = 10;\nint b = 20;\n\nif (a > b)\n{\n    Console.WriteLine(\"a is greater\
    \ than b\");\n}\nelse\n{\n    if (a < b)\n    {\n        Console.WriteLine(\"\
    a is less than b\");\n    }\n    else\n    {\n        Console.WriteLine(\"a is\
    \ equal to b\");\n    }\n}\n```\n\n## The Switch-Case Statement\n\nProgrammers\
    \ use a switch-case statement in situations where the possible answers are numerous.\
    \ Here’s the syntax of a switch-case statement:\n\n```\nswitch (selector)\n{\n\
    \    case first_integer:\n        statements;\n        break;\n    case second_integer:\n\
    \        statements;\n        break;\n    default:\n        statements;\n    \
    \    break;\n}\n```\n\nBasically, selectors are expressions that return usable\
    \ values (i.e. values that you can compare or process). The “switch” keyword compares\
    \ the selector’s value against the “cases”. If the value of the selector matches\
    \ that of a case, the statements assigned to that case will run. If there’s no\
    \ match, however, the program will execute the default statement/s (if any). That\
    \ means the program will analyze the selector first before running any statement.\n\
    \n**Important Note:** Make sure that the cases have unique values. If two or more\
    \ cases have the same value, your program will produce undesirable results.\n\n\
    As you can see, each case has a “break” clause. The “break” clause terminates\
    \ the body of the case to which it belongs. C# requires you to add this clause\
    \ to all of your switch statements.\n\nYou don’t have to place the “default” part\
    \ at the end of your switch-case statement. However, this position is recommended\
    \ if you want to keep your codes readable.\n\n# Chapter 7: The Loop Statements\n\
    \nThis chapter will teach you how to use loop statements. As a programmer, you’ll\
    \ use a loop statement to run certain code blocks repeatedly. Loops play an important\
    \ part in C# programming. Hence, you should study this material carefully as well\
    \ as if you want to master this language in 7 days.\n\n### Loops – The Basics\n\
    \nWhile creating programs, you often need to execute code sequences multiple times.\
    \ Typing the same blocks of code several times can be extremely boring. Thus,\
    \ you need to find a quick and simple way to repeat codes. Fortunately, the C#\
    \ language supports statements.\n\nA loop is a tool that runs code fragments repeatedly.\
    \ You can use it to run codes for a certain number of times or as long as a given\
    \ condition is fulfilled. C# offers different types of loop statements. Let’s\
    \ analyze each type in detail:\n\n## The While Loop\n\nThis is the simplest loop\
    \ statement in C#. Its syntax is:\n\n```\nwhile (the_assigned_condition)\n{\n\
    \  the_loop's_body;\n}\n```\n\nIn this syntax, \"the_assigned_condition\" is an\
    \ expression that produces a Boolean value. This condition dictates how many times\
    \ the \"body\" will run. The \"body\", on the other hand, is the statement (or\
    \ group of statements) that you want to execute.\n\nThe diagram given below will\
    \ illustrate how while loops work:\n\n![](img/e2e831cc76860601d1e5511399855ee6_41_0.png)\n\
    \nWhen working on a “while” loop, a C# program checks the value of the Boolean\
    \ expression. If the value is “true\", the program will run all of the statements\
    \ within the loop’s body. Then, the program will check the Boolean expression\
    \ to see its value. If the value is still true, the program will rerun the loop’s\
    \ body and go back to the first step (i.e. check the expression’s value). This\
    \ process will go on until the Boolean expression evaluates to false. Once this\
    \ happens, the program will process the code blocks right after the loop.\n\n\
    **Important Note:** Your C# program won’t run the loop’s body if the Boolean expression\
    \ is false. Thus, if the B00 value is false when you launched the program, your\
    \ in-loop statements will never be executed.\n"
