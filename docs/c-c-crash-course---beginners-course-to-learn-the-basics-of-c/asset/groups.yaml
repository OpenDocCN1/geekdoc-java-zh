    \ words (e.g. fish – dog, power * humans, land / people, etc.). However, C# allows\
    \ you to concatenate (i.e. combine) multiple string objects to generate a new\
    \ one. You can do this by using the “+ symbol on your strings. The example given\
    \ below will illustrate this idea.\n\n```cs\nstring gadget = \"smartphone\";\n\
    string example = \"I use my \" + gadget + \"to access \" + \"the internet.\";\n\
    Console.WriteLine(example);\n```\n\nIf you’ll execute that code, the console will\
    \ display:\n\n> I use my smartphone to access the internet.\n\n## Chapter 6: The\
    \ Conditional Statements of C#\n\nThis chapter will teach you how to use conditional\
    \ statements in your C# codes. Basically, a conditional statement is a code block\
    \ that allows you to perform various actions based on the assigned condition/s.\
    \ Read this material carefully as it contains valuable information that can help\
    \ you master C# in just 7 days.\n\n## The Operators\n\nIn this section, you'll\
    \ learn more information about the comparison operators of C#. These operators\
    \ are extremely important: they can help you in setting the conditions for your\
    \ own conditional statements.\n\n## The Comparison Operators\n\nC# has different\
