    System\".\n- 2. You'll see a new window. Search for \"Advanced System Settings\"\
    \ and click on it.\n- 3. Click on \"Environment Variables\" and look for a variable\
    \ named \"Path\".\n- 4. Click on the \"Edit...\" button and specify the compiler's\
    \ directory. Again, that is: C:\\Windows\\Microsoft.NET\\Framework\\v4.0.30319\n\
    - 5. Hit “OK” to save the changes.\n- 6. Now, close the current Command Prompt\
    \ and launch a new one. Then, enter “csc”.\n- 7. The screen should give you the\
    \ following error:\n\n```\nfatal error CS2008: No inputs specified\n```\n- 8.\
    \ That means your computer can automatically trigger the compiler. Once you specify\
    \ a source code, your computer will generate .exe files for you.\n\n## Chapter\
    \ 2: The Data Types, Variables, and Literals of C#\n\nThis chapter will focus\
    \ on the data types and variables used in the C# language. By reading this material,\
    \ you’ll know what these objects are and how you can use them in writing your\
    \ own programs.\n\n### Variables – An Introduction\n\nTypical programs utilize\
    \ different values during their execution. For instance, you can develop a program\
    \ that solves mathematical problems. Obviously, you need to enter different values\
    \ while using this kind of program. Simply put, programmers don’t know which values\
    \ will be entered by the user. Thus, they need to make sure that the resulting\
    \ programs will accept any value that the user may provide.\n\nWhen the user gives\
    \ a value, you may temporarily store it in the machine’s RAM (i.e. random access\
    \ memory). All of the values inside this memory may change. Because of this, programmers\
    \ refer to such values as “variables”.\n\n### The Data Types\n\nA data type is\
    \ a set (or range) of values that share similar attributes. For example, the “byte”\
    \ data type refers to the values within the “0 to 255” number range.\n\n### Attributes\n\
    \nData types have the following attributes:\n\n- Name (e.g. int, char, bool, etc.)\n\
    - Size (e.g. 1 byte)\n- Default Value (e.g. 1, 2, 3, etc.)\n\n## The Different\
    \ Types of Data in C#\n\nC# supports the following data types:\n\n- Boolean\n\
    - Characters\n- Objects\n- Floating-Point\n- Decimals\n- Integers\n- Strings\n\
    \nSince these data types are pre-installed into the C# language, programmers refer\
    \ to them as “primitive types”. Let’s discuss each data type in detail:\n\n###\
    \ Boolean\n\nYou need to use “bool” (i.e, a C# keyword) to declare this data type.\
    \ Boolean values can only be “true” or “false”.\n\n### Characters\n\nThis data\
    \ type is used to store single characters. You need to use “char” to declare this\
    \ type.\n\n### Objects\n\nThis data type is used to store objects. You need to\
    \ use “object” for its declaration.\n\n### Floating-Point\n\nThis data type is\
    \ used to represent numbers with fractional parts. C# supports two types:\n\n\
    - 1. Float: Programmers use \"float\" for this type. Its default value is 0.0F\
    \ (the \"f\" at the end is necessary).\n- 2. Double: Programmers use \"double\"\
    \ for this type. Its default value is 0.0D (the \"d\" at the end is necessary).\n\
    \n### Decimals\n\nThis data type is used to represent numbers with high precision.\
    \ C# uses \"decimal\" data type for financial computations. The main advantage\
    \ of this approach is that it preserves accuracy regardless of the values it works\
    \ on.\n\n### Integers\n\nThis data type consists of several subtypes:\n\n- SBYTE:\
    \ A signed integer that is 8 bits long.\n- BYTE: An unsigned integer that is 8\
    \ bits long.\n- SHORT: Signed integers that are 16-bits long.\n- USORT: Unsigned\
    \ integers whose length is 16 bits.\n- INT: A signed integer whose length is 32\
    \ bits.\n- UINT: An unsigned 32-bit integer.\n- LONG: Signed integers that are\
    \ 64 bits long.\n- ULONG: Unsigned 64-bit integers.\n\n### Strings\n\nA string\
    \ is a set or sequence of characters. C# requires you to use \"string\" when declaring\
    \ values that belong to this data type. You have to write each string between\
    \ a pair of quotation marks. This language allows you to perform various operations\
    \ on\n"
  mdcn: "\n\n重要提示：在阅读本书其余部分之前，请确保你的电脑已安装了 .NET。否则，你在编译和执行稍后看到的示例程序将会遇到问题。\n\n## 文本编辑器\n\
