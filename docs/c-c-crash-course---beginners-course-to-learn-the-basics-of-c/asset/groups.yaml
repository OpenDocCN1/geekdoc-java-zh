    \nLet's discuss each part in detail:\n\nThe Class Definition – The initial line\
    \ of the program defines a class named HelloCSharp. The most basic class definition\
    \ has two sections: (1) the word \"class\" and (2) the name of the new class.\
    \ In this example, HelloCSharp serves as the class's name. You'll find the contents\
    \ of this class inside the pair of braces (i.e. { }).\n\nThe Method Definition\
    \ – This part is located at the third line of the program. Here, you defined a\
