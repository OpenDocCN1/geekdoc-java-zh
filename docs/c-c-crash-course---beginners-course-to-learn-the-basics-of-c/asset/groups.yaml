    \n### 浮点数\n\n此数据类型用于表示带有小数部分的数字。C# 支持两种：\n\n- 1. Float：程序员使用“float”这种类型。其默认值为\
    \ 0.0F（末尾的“f”是必要的）。\n- 2. Double：程序员使用“double”这种类型。其默认值为 0.0D（末尾的“d”是必要的）。\n\n\
    ### 进制\n\n此数据类型用于表示高精度的数字。C# 使用“decimal”数据类型进行财务计算。这种方法的这种优势是，无论处理什么值，都能保持准确性。\n\
    \n### 整数\n\n此数据类型由几个子类型组成：\n\n- SBYTE：8 位有符号整数。\n- BYTE：8 位无符号整数。\n- SHORT：16\
