    \ 语言支持循环。\n\n循环是一个重复运行代码片段的工具。你可以用它运行指定次数的代码，或者只要给定条件一直一直运行。C# 提供了不同类型的循环语句。让我们详细分析每个类型：\n\
    \n## While 循环\n\n这是 C# 中最简单的循环语句。它的语法如下：\n\n```\nwhile (the_assigned_condition)\n\
    {\n  the_loop's_body;\n}\n```\n\n在此语法中，“the_assigned_condition”是一个产生布尔值的表达式。该条件决定了“body”运行的次数。另一方面，“body”是你想要执行的语句（或语句组）。\n\
    \n下面的图表将说明 while 循环是如何工作的：\n\n![](img/e2e831cc76860601d1e5511399855ee6_41_0.png)\n\
    \n在处理“while”循环时，C# 程序检查布尔表达式的值。如果该值为“true”，程序将运行循环体内的所有语句。然后，程序将检查布尔表达式以查看其值。如果值仍然为真，程序将重新运行循环体并返回第一步（即检查表达式的值）。这个过程将一直持续，直到布尔表达式求值为为假（false）。一旦发生这种情况，程序将处理循环正后的代码块。\n\
    \n**重要说明：** 如果布尔表达式为假，你的 C# 程序将不会运行循环体。因此，如果你在启动程序时 B00 的值为假，你的循环内语句将永远不会执行。\n\
    \n"
