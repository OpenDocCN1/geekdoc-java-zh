    Console.WriteLine(valueofPi > 100); // This will give you \"true\";\n```\n\n##\
    \ The Logical Operators\n\nC# also supports some logical operators. Programmers\
    \ use these operators to create Boolean (also called “logical”) statements. Let’s\
    \ discuss each logical operator in detail:\n\n## The AND and OR Operators\n\n\
    You can use only the logical AND (i.e. &&) and logical OR (i.e. ||) operators\
    \ on expressions that involve Boolean values. The logical AND operator will give\
    \ you “true” if both of the operands are true. For example:\n\n```cs\nbool sample\
    \ = (1 < 2) && (10 == 10);\n```\n\nSince 1 is less than 2 and 10 is equal to 10,\
    \ the expression will give you true. Since the AND operator provides quick results\
    \ without performing unnecessary analyses, programmers refer to as a “short-circuit\
    \ operator”. It checks the left section of the statement first. If the evaluation\
    \ is “false”, the operation will immediately stop. The expression can no longer\
    \ be true since one of the operands is false.\n\nThe logical OR (i.e. ||) operator,\
    \ on the other hand, will give you true if at least one of your operands evaluates\
    \ to true. For instance:\n\n```cs\nbool sample = (1 < 2) || (10 > 100);\n```\n\
    \nThis example will give you true since the left-hand operand is true. The logical\
    \ OR operator is also a “short-circuit operator”, since it can give a result even\
    \ without checking the entire CS statement. In the current example, logical OR\
    \ will no longer analyze the second operand since the first one is already true.\
    \ Thus, the condition has already been met.\n\n## The Exclusive OR and Neg Operators\n\
    \nThe exclusive OR (i.e. ^) is a full-circuit operator since it needs to check\
    \ both operands before giving the result. It will give you true ONLY IF one of\
    \ the operands evaluates to true. Thus, you’ll get false if both of the operands\
    \ are true. Check the following example:\n\n```cs\nbool sample = (1 < 2) ^ (2\
    \ == 2);\n```\n\nSince the two expressions are true, exclusive OR will give you\
    \ false.\n\nThe negation operator (i.e. !), however, simply reverses the Boolean\
    \ value to which it is attached. For instance:\n\n```cs\nbool sample = !(1 < 2);\n\
    ```\n\nOne is less than two. However, since “!” is attached to the Boolean expression,\
    \ the result will be reversed. That means this expression evaluates to “false”.\n"
