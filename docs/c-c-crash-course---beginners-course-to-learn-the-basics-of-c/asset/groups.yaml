    \ 位有符号整数。\n- ULONG：64 位无符号整数。\n\n### 字符串\n\n字符串是字符的集合或序列。C# 要求在声明属于此数据类型的值时使用“string”。你必须将每个字符串写在引号之间。这种语言允许你对各种\n\
