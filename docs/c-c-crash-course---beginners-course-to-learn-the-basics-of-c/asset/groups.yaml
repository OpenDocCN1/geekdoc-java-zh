    \ recognized as an internal or external command,\noperable program or batch file.\n\
    ```\n\nTo solve this problem, you just need to specify the location of the C#\
    \ compiler. Here's the required directory for Windows 7 computers:\n\nImportant:\
    \ The numbers at the end of the directory might change depending on your OS version.\n\
    \nThus, you should issue the following command:\n\n```bash\nC:\\Microsoft.NET\\\
    Framework\\v4.0.30319\\csc HelloCSharp\n```\n\nThe C# compiler will convert your\
    \ .cs file into an executable program. To execute your first program, enter its\
    \ name into the Command Prompt. You will get the following message:\n\n```\nHello\
    \ C!\n```\n\n## How to Change the System Path of a Windows Computer\n\nSurely\
    \ you don't want to type the compiler's complete directory each time you create\
