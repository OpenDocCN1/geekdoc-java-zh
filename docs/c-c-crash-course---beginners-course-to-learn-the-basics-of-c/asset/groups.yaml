    \n![](img/e2e831cc76860601d1e5511399855ee6_29_0.png)\n\n## Console.Read 方法\n\n\
    Console.Read 和 Console.ReadLine 之间存在显著差异。首先，`Console.Read` 只读取单个字符，而 `Console.ReadLine`\
    \ 读取整个表达式。其次，`Console.Read` 返回代码而不是接收到的输入。如果你想将输出作为普通字符使用，你应该执行以下操作之一：\n\n- 将输出转换为字符\n\
    - 在结果上使用 `Convert.ToChar` 方法\n\n重要提示：只有当用户按下“回车键”时，`Console.Read` 才会读取字符。当用户按下此键时，程序会将输入传输到标准字符串缓冲区并调用\
