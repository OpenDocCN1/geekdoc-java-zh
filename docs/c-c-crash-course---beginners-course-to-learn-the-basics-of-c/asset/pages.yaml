  md: 'A data type is a set (or range) of values that share similar attributes. For
    example, the “byte” data type refers to the values within the “0 to 255” number
    range.


    # Attributes


    Data types have the following attributes:


    +   - Name (e.g. int, char, bool, etc.)

    - Size (e.g. 1 byte)

    - Default Value (e.g. 1, 2, 3, etc.)


    # The Different Types of Data in C#


    C# supports the following data types:


    +   - Boolean

    - Characters

    - Objects

    - Floating-Point

    - Decimals

    - Integers

    - Strings


    Since these data types are pre-installed into the C# language, programmers refer
    to them as “primitive types”. Let’s discuss each data type in detail:


    # Boolean


    You need to use “bool” (i.e, a C# keyword) to declare this data type. Boolean
    values can only be “true” or “false”. In the C# programming language, Boolean
    values are automatically set as “false”.mers use this data type to store the result/s
    of logical statements.


    # Characters


    This data type can store single characters. You need to use “char” (i.e. another
    C# keyword) to declare this data type. Write your “char” values within a pair
    of apostrophes (e.g. “I”).


    # Objects


    Programmers regard objects as the most special type of data in the C# language.
    Basically, objects serve as the parent of other data types within .NET. This data
    type, which requires the “object” keyword during its declaration, may accept any
    value from other data types. You may think of objects as addresses that point
    to certain parts of your computer’s memory.


    # Real Type – Floating Points'
