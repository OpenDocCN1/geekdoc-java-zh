  \ whenever some action is taken\n   *  such as: Clear All, Save FXML\n   */\n  void\
  \ cleanUnfinished() {\n    ShapeDrawer tool = drawPane.getDrawer();\n    if (tool\
  \ != null && tool.getShape() != null) {\n      if (drawPane.isDragged()) {\n   \
