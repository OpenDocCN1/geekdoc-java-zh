  \ resource\n```\n\n## 1.4 总结\n\n本介绍了 JavaFX 库的以下关键方面，按照它们在章节中出现的顺序列出：\n\n*   `SwingFXUtils`\
  \ 类位于 `javafx.embed.swing` 包，并提供了在 JavaFX `Image` 和 Swing/AWT `Image` 之间进行类型转换的方法：\n\
  \    `static BufferedImage fromFXImage(Image img, BufferedImage bimg)`\n    `static\
  \ WritableImage toFXImage(BufferedImage bimg, WritableImage wimg)`\n    (参见章节 实现\
  \ `writeImageView` 方法)\n\n*   `Image` 类继承自 `java.lang.Object` 并位于 `javafx.scene.image`\
  \ 包，用于加载图像。可以通过向构造函数传递字符串 `url` 或 `InputStream` 来构造 `Image`。使用 `ImageView` 对象来显示\
  \ `Image`。\n    (参见章节 实现 `writeImageView` 方法)\n\n*   `WritableImage snapshot(SnapshotParameters\
  \ params, WritableImage image)` 方法定义在 `Node` 类中，用于对节点（无论是否是场景的一部分）进行快照。它返回一个 `WritableImage`，它是\
  \ `javafx.scene.image.Image` 的直接子类。\n    (参见章节 实现 `writeImageView` 方法)\n\n*   `ImageView`\
  \ 类继承自 `javafx.scene.Node` 并位于 `javafx.scene.image` 包，用于显示图像。可以通过向构造函数传递 String\
  \ 类型的 `url` 或一个 `Image` 来构造 `Image`。\n    (参见章节 实现 `writeImageView` 方法)\n\n*   `SnapshotParameters`\
  \ 类继承自 `java.lang.Object` 并位于 `javafx.scene` 包；它提供了用于为 `javafx.scene.Node` 设置快照参数的工具类，例如：\n\
  \    `setFill(Paint fill)`\n    `setViewport(Rectangle2D viewport)`\n    (参见 `writeImageView`\
  \ 方法的完整源代码)\n\n*   `Bounds` 是一个抽象类，位于 `javafx.geometry` 包，定义了操作矩形区域、测量坐标和尺寸的工具：`minX`,\
  \ `minY`, `maxX`, `maxY`, `width`, `height`。\n    (参见章节：利用 `boundsInLocal` 和 `boundsInParent`,\
  \ 利用 `layoutBounds`)\n\n*   `boundsInLocal` 是类型为 `ReadOnlyObjectProperty<Bounds>`\
  \ 的属性，定义在 `Node` 类中，指定一个 `Bounds` 对象，表示 `Node` 的矩形边界区域，而不考虑应用在其上的任何变换。\n    (参见章节：利用\
  \ `boundsInLocal` 和 `boundsInParent`, 利用 `layoutBounds`)\n\n*   `boundsInParent`\
  \ 是类型为 `ReadOnlyObjectProperty<Bounds>` 的属性，定义在 `Node` 类中，指定一个 `Bounds` 对象，表示 `Node`\
  \ 的矩形边界区域，并了应用在其上的所有变换，如 `translate`、`scale`、`rotate` 等。\n    (参见章节：利用 `boundsInLocal`\
  \ 和 `boundsInParent`, 利用 `layoutBounds`)\n\n*   `layoutBounds` 是定义在 `Node` 类中的类型为\
  \ `ReadOnlyObjectProperty<Bounds>` 的属性，它指定的 `Bounds` 对象不考虑这些属性：`effect`, `clip`,\
  \ `scaleX`, `scaleY`, `rotate`, `translateX`, `translateY`, `layoutX`, `layoutY`；它还排除了任何应用到\
  \ `Node` 的 `Transform` 对象。\n    (参见章节 利用 `layoutBounds`)\n\n*   `RadialGradient`\
  \ 类位于 `javafx.scene.paint` 包，是 `Paint` 的直接子类。\n\n*   `LinearGradient` 类位于 `javafx.scene.paint`\
  \ 包，是 `Paint` 的直接子类。\n\n*   `CycleMethod` 类是一个枚举类型，位于 `javafx.scene.paint` 包，与 `LinearGradient`\
  \ 和 `RadialGradient` 配合使用。它定义了 `CycleMethod.NO_CYCLE`, `CycleMethod.REFLECT`, 和\
  \ `CycleMethod.REPEAT`。\n\n*   `Stop` 类位于 `javafx.scene.paint` 包，与 `LinearGradient`\
  \ 和 `RadialGradient` 配合使用。创建一个 `Stop` 实例需要两个参数：`offset` 和 `color`。\n\n# 第 2 章 增强\
  \ Draw Tool\n\n## 开发 Drawing Tools V1.4 (部分 2)\n\n### 前言\n\n在本章中，我们将介绍位于 `javafx.io`\
  \ 的 `DrawLoader` 类，用于将 FXML 文件和图像加载到画布中。通过 `Drawing Tools V1.4 (部分 2)` 的详细描述和示例代码，你将熟悉\
  \ JavaFX 库在总结 部分的功能。\n\n`Drawing Tools V1.4 (部分 2)` 的完整开发过程包含以下步骤：\n\n*   2.1 创建\
  \ `DrawLoader` 类\n    *   2.1.1 实现 `loadFXML` 方法\n    *   2.1.2 实现 `loadImage` 方法\n\
  *   2.2 `DrawLoader` 类的完整代码\n*   2.3 总结\n\n## 2.1 创建 `DrawLoader` 类\n\n`DrawLoader`\
  \ 类位于 `drawtool.io` 包，并提供了直观的高级 API 来加载 FXML 文件和图像。源是一个 `File` 实例。如果是图像文件，将创建一个\
  \ `ImageView` 对象，并将加载的图像设置到 `image` 属性。如果是 FXML 文件，无论是手动编码的还是通过 `DrawWriter` 类提供的\
  \ API 程序生成的（参见前一章节），那么从文件中加载的根节点将被添加到给定的绘图面板 中。\n\n### 2.1.1 实现 `loadFXML` 方法\n\n\
  `DrawLoader` 类提供了两个 `loadFXML` 方法：\n\n```\n public ObservableList<Node> loadFXML(File\
  \ file, Pane pane)\n  public ObservableList<Node> loadFXML(File file)\n```\n\n1.\
  \  `public ObservableList<Node> loadFXML(File file, Pane pane)`\n\n\n\n\n### 描述\n\
  加载 FXML 文件并将根节点的后代（或根节点本身）添加到指定 `pane` 的子节点列表中。如果从指定文件加载的根节点是一个 `Pane` 且拥有一个属性映射（可以通过\
  \ `Node` 类中定义的 `getProperties()` 方法获取），则该映射条目集中的元素将被添加到所给 `pane` 的属性映射中。\n\n###\
  \ 1. `public ObservableList<Node> loadFXML(File file)`\n\n加载给定的 FXML 文件并以列表形式返回根节点的后代节点或根节点本身。\n\
  \n请注意，我们会检查存储在 FXML 文件中的场景图的根节点是否属于以下类型：\n\n1. `Pane`\n2. `Group`\n\n如果不是这些类型，则将根节点本身而不是其后代节点作为列表返回给调用者。\n\
  \n`FXMLLoader` 类自 `java.lang.Object` 并位于 `javafx.fxml` 包，提供了加载 FXML 文档的功能。以下是 `FXMLLoader`\
  \ 类中定义的用于我们 `loadFXML` 方法的静态方法：\n\n```\npublic static <T> T load(URL location)\n\
  \                 throws IOException \n```\n\n以下是我们 `loadFXML` 方法的完整源代码：\n\n导入语句：\n\
  \n```\nimport java.io.File;\nimport java.io.IOException;\nimport java.net.MalformedURLException;\n\
  import java.net.URL;\nimport java.util.*;\nimport javafx.collections.*;\nimport\
  \ javafx.fxml.FXMLLoader;\nimport javafx.scene.Group;\nimport javafx.scene.Node;\n\
  import javafx.scene.layout.Pane;\n```\n\nListing 2-1. 定义 `loadFXML` 方法：\n\n```java\n\
  \ /**\n   * 加载 FXML 文件以获取场景图的根节点\n   * 如果根节点是 Pane 或 Group，\n   * 将其后代添加到给定 pane\
  \ 的子节点列表中 \n   * 如果它不是 Pane 或 Group，\n   * 将根节点本身添加到给定 pane 的子节点列表中 \n   * 并且如果根节点是一个\
  \ pane，\n   * 我们也将它的属性（一个映射）添加到给 pane 中\n   */\n  public ObservableList<Node> loadFXML(File\
  \ file, Pane pane) {\n    try {\n      // 从 File 获取 URL\n      URL url = file.toURI().toURL();\n\
  \      Node root = FXMLLoader.load(url);\n\n      ObservableList<Node> nodeList\
  \ = getRootDescendant(root);\n      pane.getChildren().addAll(nodeList);\n\n   \
  \   ObservableMap<Object, Object> map = root.getProperties();\n      // 如果根是 pane，则将属性（一个映射）添加到\
  \ pane\n      if (root instanceof Pane) {\n        Iterator<Map.Entry<Object, Object>>\
  \ it = map.entrySet().iterator();\n        while (it.hasNext()) {\n          Map.Entry<Object,\
  \ Object> e = it.next();\n          pane.getProperties().put(e.getKey(), e.getValue());\n\
  \        }\n      }      \n      return nodeList;\n    } catch(MalformedURLException\
  \ e) {\n      System.out.println(e);\n    } catch(IOException e) {\n      System.out.println(e);\n\
  \    }     \n    // 返回空列表\n    return FXCollections.observableArrayList();     \n\
  \  }\n\n  /**\n   * 加载 FXML 文件以获取场景图的根节点\n   * 如果根节点是 Pane 或 Group，\n   * 返回根节点的子节点列表\n\
  \   * 如果根节点不是 Pane 或 Group \n   * 返回一个包含根节点的列表\n   */\n  public ObservableList<Node>\
  \ loadFXML(File file) {\n    try {\n      // 从 File 获取 URL\n      URL url = file.toURI().toURL();\n\
  \      Node root = FXMLLoader.load(url);\n      return getRootDescendant(root);\n\
  \    } catch(MalformedURLException e) {\n      System.out.println(e);\n    } catch(IOException\
  \ e) {\n      System.out.println(e);\n    }     \n    // 返回空列表\n    return FXCollections.observableArrayList();\
  \     \n  }\n\n  ObservableList<Node> getRootDescendant(Node root) {\n    if (root\
  \ instanceof Pane) \n      return ((Pane)root).getChildren();\n    if (root instanceof\
  \ Group) \n      return ((Group)root).getChildren();\n\n    // 返回一个包含根节点的列表\n  \
  \  return FXCollections.observableArrayList(root);     \n  }\n```\n\n### 2.1.2 实现\
  \ `loadImage` 方法\n\n除了加载 FXML 文件外，`DrawLoader` 类还提供了一个 `loadImage` 方法：\n\n```java\n\
  public ImageView loadImage(File file, double maxWidth, double maxHeight)\n```\n\n\
  `loadImage` 方法从指定的文件加载图像并返回一个 `ImageView` 对象用于查看。最大视图尺寸在参数中指定：`maxWidth` 和 `maxHeight`。\n\
  \n以下是 `loadImage` 方法的完整源代码：\n\n导入语句：\n\n```java\nimport java.io.File;\nimport javafx.scene.image.Image;\n\
  import javafx.scene.image.ImageView;\n```\n\nListing 2-2. 定义 `loadImage` 方法加载图像文件并返回一个\
  \ `ImageView` 对象以查看加载的图像：\n\n```java\n /**\n   * 返回一个 ImageView，url 以字符串形式存放在 ImageView\
  \ 的属性中\n   */\n  public ImageView loadImage(File file, double maxWidth, double maxHeight)\
  \ {\n    String url = file.toURI().toString();\n    Image image = new Image(url);\n\
  \    ImageView imageView = new ImageView();\n    imageView.setPreserveRatio(true);\
  \  \n    // 如果图像大于 maxWidth/maxHeight，\n    // 初始化 imageView 以适应 maxWidth/maxHeight\n\
  \    if (image.getWidth() > maxWidth) {\n      imageView.setFitWidth(maxWidth);\n\
  \    } else if (image.getHeight() > maxHeight) {\n      imageView.setFitHeight(maxHeight);\n\
  \    }\n    imageView.setImage(image);\n    // 将 url 放入属性（一个映射）\n    imageView.getProperties().put(\"\
  imageURL\", url);\n    return imageView;\n  }\n```\n\n## 2.2 `DrawLoader` 类的完整源代码\n\
