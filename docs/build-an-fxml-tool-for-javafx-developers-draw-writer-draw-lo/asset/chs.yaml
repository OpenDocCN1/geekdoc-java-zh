  \ `Add books` 功能将本电子书的 `.mobi` 文件添加到 `Calibre` 中。\n3. 使用 `Calibre` 中的 `Convert books`\
  \ 功能，选择 `HTMLZ` 为输出格式，点击 `OK` 按钮进行转换。\n4. 转换完成后，您将得到一个扩展名为 `.htmlz` 的输出文件。将扩展名重命名为\
