  \ Java `import` 语句的处理指令后手动添加了换行符。\n\n### 1.1.4 实现 `writeImageView` 方法\n\n除了用于写入\
  \ `ImageView` 的工具外，`DrawWriter` 类还提供了一个将 `ImageView` 快照为 `png` 或 `gif` 格式的实用方法：\n\
  \n```java\npublic void writeImageView(ImageView iv, File file)\n```\n\n在写入 `ImageView`\
  \ 时，`DrawWriter` 类需要快照 `ImageView`，因为对 `ImageView` 进行的任何变换（如 `rotate`、`scale` 等都不会改变其\
  \ `image` 属性。我们应用 `Node` 类中定义的 `snapshot` 方法来获取新图像：\n\n```java\npublic WritableImage\
  \ snapshot(SnapshotParameters params, WritableImage image)\n```\n\n`ImageIO.write`\
  \ 方法支持两种图像类型 `png` 和 `gif`：\n\n```java\nstatic boolean write(RenderedImage im, String\
  \ formatName, OutputStream output)\n```\n\n要将 JavaFX `Image` 转换为 `BufferedImage`，我们使用\
  \ `javafx.embed.swing.SwingUtils` 提供的工具：\n\n```java\nstatic BufferedImage fromFXImage(Image\
  \ img)\n```\n\n`BufferedImage` 类继承自 `java.awt.Image` 并实现了 `WritableRenderImage`。\n\
  \n### 1.1.4.2 利用 `boundsInLocal` 和 `boundsInParent`\n\n在 `writeImageView` 方法内部，为了快照\
  \ `ImageView`，需要在类型为 `SnapshotParameters` 的参数中指定合适的视口。这里是获取 `Node` 边界矩形作为快照视口的方法：\n\
  \n`public final Bounds getBoundsInParent()`\n\n返回类型 `Bounds` 是 `javafx.geometry`\
  \ 包中的抽象类，定义了操作矩形区域的工具，用于测量其坐标和维度：`minX`、`minY`、`maxX`、`maxY`、`width`、`height`。我们需要理解\
  \ `Node` 类中定义的以下两个属性之间的差异：\n\n`boundsInLocal`：类型为 `ReadOnlyObjectProperty<Bounds>`\
  \ 的属性指定 `Node` 的 `Bounds` 对象，不考虑应用于它的任何变换。\n\n`boundsInParent`：类型为 `ReadOnlyObjectProperty<Bounds>`\
  \ 的属性指定 `Node` 的 `Bounds` 对象，考虑了应用于它的所有变换，如 `translate`、`scale`、`rotate` 等。\n\n\
  让我们使用下面的 `ImageView` 对象来说明 `boundsInLocal` 和 `boundsInParent`：\n\n图 1-2。显示 `ImageView`\
  \ 对象的初始边界矩形。\n\n![](img/00008.jpeg \"HeronBounds.png\")\n\n\n\n\n\n最初，`ImageView`\
  \ 对象显示在位置 [100, 80]，宽度为 347，高度为 411（即图像的大小），且尚未对其应用任何变换；因此，`boundsInLocal` 中的 `Bounds`\
  \ 和 `boundsInParent` 中的 `Bounds` 都指定了相同的值：\n\n### `ImageView` 的初始 `Bounds`\n\n|\
  \   | minX | minY | maxX | maxY | width | height |\n| --- | --- | --- | --- | ---\
  \ | --- | --- |\n| `boundsInLocal` | 100 | 80 | 447 | 491 | 347 | 411 |\n| `boundsInParent`\
  \ | 100 | 80 | 447 | 491 | 347 | 411 |\n\n现在，对 `ImageView` 应用了一个变换；它被缩放为原始尺寸的一半，并以初始边界矩形的中心为缩放原点。图\
  \ 1-3 显示了变换后的 `ImageView` 及其 `Bounds`。较小的矩形区域表示 `boundsInParent`，较大的矩形区域是保持不变的 `boundsInLocal`。\n\
  \n图 1-3. 显示 `ImageView` 缩放为原始尺寸一半后的边界矩形。\n\n![](img/00009.jpeg \"HeronBoundsScale.png\"\
  )\n\n缩放后，`boundsInLocal` 保持原始值，而 `boundsInParent` 中的坐标和维度发生了变化。下表显示了我们将 `ImageView`\
  \ 缩放为原始尺寸一半后的差异：\n\n### 缩放后 `ImageView` 的 `Bounds`\n\n|    | minX | minY | maxX\
  \ | maxY | width | height |\n| --- | --- | --- | --- | --- | --- | --- |\n| `boundsInLocal`\
  \ | 100 | 80 | 447 | 491 | 347 | 411 |\n| `boundsInParent` | 186.8 | 182.8 | 360.3\
  \ | 388.3 | 173.5 | 205.5 |\n\n现在，我们将对图 1-3 中已缩放为原始尺寸一半的 `ImageView` 应用额外的变换。首先，顺时针旋转\
  \ 90°，然后平移 [-32, 66]。让我们查看图 1-4 中边界矩形的最终结果：\n\n图 1-4. 显示经过这些变换后 `ImageView` 的边界矩形：缩放\
  \ 50%、顺时针旋转 90°、平移 [-32, 66]。\n\n![](img/00010.jpeg \"HeronBoundsScaleRotateTranslate.png\"\
  )\n\n在图 1-4 中，较小的矩形区域表示变换后的 `boundsInParent`。而 `boundsInLocal`（即较大的矩形区域）保持不变。\n\n\
  总结一下，下表显示了应用到 `ImageView` 的所有变换：\n\n字体 应用到 `ImageView` 的变换\n\n| scaleX | scaleY\
  \ | rotate | translateX | translateY |\n| --- | --- | --- | --- | --- |\n| 0.5 |\
  \ 0.5 | 90.0 | -32 | 66 |\n\n下表显示了变换后（缩小 50%、顺时针旋转 90°、平移 [-32, 66]）`boundsInLocal`\
  \ 和 `boundsInParent` 中的值：\n\n### 变换后 `ImageView` 的 `Bounds`\n\n|    | minX | minY\
  \ | maxX | maxY | width | height |\n| --- | --- | --- | --- | --- | --- | --- |\n\
  | `boundsInLocal` | 100 | 80 | 447 | 491 | 347 | 411 |\n| `boundsInParent` | 138.8\
  \ | 264.8 | 344.3 | 438.3 | 205.5 | 173.5 |\n\n显而易见，无论对节点应用了多少变换，它的 `boundsInLocal`\
  \ 始终保持原始值。此外，请注意为 `layoutX` 或 `layoutY` 属性赋值也不会影响 `boundsInLocal`。\n\n上述示例得出结论：在节点经过变换的情况下，`boundsInParent`\
  \ 中指定的矩形区域是快照（snapshot）的正确视口。\n\n### 1.1.4.3 利用 `layoutBounds`\n\n`layoutBounds`\
  \ 是 `Node` 类中定义的类型为 `ReadOnlyObjectProperty<Bounds>` 的属性，它指定一个 `Bounds` 对象，且不考虑以下属性：`effect`、`clip`、`scaleX`、`scaleY`、`rotate`、`translateX`、`translateY`、`layoutX`、`layoutY`；它还排除了应用于\
