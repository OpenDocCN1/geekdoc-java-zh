  \n## 本书所需的准备\n如果你想编译并运行书中的应用程序，你需要下载并安装 JDK。以下是下载 JDK 8 的网站：[`www.oracle.com/technetwork/java/javase/downloads/index.html`](http://www.oracle.com/technetwork/java/javase/downloads/index.html)。\n\
