  这里是 `writeImageView` 方法的完整源代码：\n\n导入语句：\n\n```java\nimport javafx.embed.swing.SwingFXUtils;\n\
  import javafx.geometry.Bounds;\nimport javafx.geometry.Rectangle2D;\nimport javafx.scene.image.Image;\n\
  import javafx.scene.image.ImageView;\nimport javafx.scene.paint.Color;\nimport javafx.scene.SnapshotParameters;\n\
  import javax.imageio.ImageIO;\n```\n\n列表 1-14. 定义 `writeImageView` 方法将 `ImageView`\
  \ 写入图像文件：\n\n\n\n\n\n## 1.2 使用 FXML 在场景图中创建 JavaFX 节点\n\n我们将详细阐述 `draw.io` 包中提供的\
  \ API 的用法，该包包含了 `draw` 类，当 `File` 是时。\n\n在本节中，我们将介绍如何在 JavaFX 中创建 `Line`、`Polyline`、`Path`\
  \ 等。我们还展示了如何在 `第 2 节` 中使用 `ImageView` 来显示图像。\n\n### 1.2.1 将 `ImageView` 写入文件\n\n\
  将 `ImageView` 的图像写入图像文件。我们不使用 `image` 属性中指定的图像，而是应用 `snapshot` 方法来获取图像，这样做是为了让图像符合变换效果。\n\
  \n`ImageView` 的 `image` 属性中指定的仍然是原始图像，并未与已应用的变换同步。对 `ImageView` 进行 `Snapshot` 会得到一个符合变换的图像，然后调用\
  \ `writeImage` 将图像保存为支持的图像格式的文件。\n\n重要说明：如果 `ImageView` 在其 `clip` 属性中指定了 `clip`，该方法同样运行良好。\n\
  \n```java\npublic void writeImageView(ImageView iv, File file) {\n  Bounds bP =\
  \ iv.getBoundsInParent();\n  Double minX = bP.getMinX();\n  Double minY = bP.getMinY();\n\
  \  Double w = bP.getWidth();\n  double h = bP.getHeight();\n  Rectangle2D vp = new\
  \ Rectangle2D(minX, minY, w, h);\n  SnapshotParameters parameters = new SnapshotParameters();\n\
  \  parameters.setViewport(vp);\n  parameters.setFill(Color.TRANSPARENT);\n  Image\
  \ image = iv.snapshot(parameters, null);\n  writeImage(image, file);\n}\n```\n\n\
  此方法从 `writeImageView` 调用，将 `ImageView` 的图像保存到图像文件中。应用 `ImageIO.write` 方法将 JavaFX\
  \ `Image` 写入文件。经过测试，`ImageIO.write` 仅适用于 `png` 和 `gif` 格式。`ImageIO.write` 不支持这些格式：`jpg`、`jpeg`、`bmp`。\n\
  \n该方法首先检查给定文件的扩展名是否匹配目标格式（`png|gif`），如果不匹配，则拼接默认格式（`.png`）。\n\n```java\npublic File\
  \ writeImage(Image img, File file) {\n  // check if the given file extension matches\
  \ preferred\n  // image format string : (png|gif)\n  String formatName = getFormatName(file);\n\
  \  if (formatName == null) {\n    // the given file does not ends with preferred\
  \ image format\n    // use \"png\" as format\n    formatName = \"png\"; // default\
  \ format name\n    file = getImageFile(file, formatName);\n  }\n  writeFXImage(img,\
  \ formatName, file);\n  return file;\n}\n```\n\n应用 `ImageIO.write` 方法将 JavaFX `Image`\
  \ 写入文件。注意：`ImageIO.write` 无法保存 `jpg`、`jpeg`、`bmp`。\n\n```java\nvoid writeFXImage(Image\
  \ img, String formatName, File imgFile) {\n  try {\n    boolean succeed = ImageIO.write(\n\
  \       SwingFXUtils.fromFXImage(img, null), formatName, imgFile);\n    if (!succeed)\n\
  \        System.out.println(\"ImageIO.write failed\");\n  } catch (IOException e)\
  \ {\n    System.out.println(e.getMessage());\n  }\n}\n```\n\n针对 Java 8+ 的说明：测试 `jpg`、`jpeg`、`bmp`\
  \ 是否。此方法检查文件是否具有目标扩展名：`png` 或 `gif`，如果扩展不是目标图像格式，则返回 `null`，否则返回图像格式。\n\n```java\n\
  String getFormatName(File f) {\n  String formatName = null; // Initialize to null\n\
  \  // supported image format in regular expression\n  //String reg = \"(png|gif|jpg|jpeg|bmp)\"\
  ;\n  // It would be nice to support jpg format\n  // however,\n  // jpg, jpeg and\
  \ bmp not supported in \n  //IO.write\n  String reg = \"(png|gif)\";\n  String s\
  \ = f.getName();\n  int i = s.lastIndexOf('.');\n\n  if (i > 0 && i < s.length())\
  \ {\n    String ext = s.substring(i + 1).toLowerCase();\n    if (ext.matches(reg))\
  \ {\n        formatName = ext;\n    }\n  }\n  return formatName;\n}\n```\n\n此方法从\
  \ `writeImageView` 调用，将 `ImageView` 的图像保存到图像文件中。目标格式。如果文件没有扩展名。\n\n```java\nFile\
  \ getImageFile(File file, String formatName) {\n  String s = file.getName();\n \
  \ int i = s.lastIndexOf('.');\n  if (i > 0 && i < s.length()) {\n    // replace\
  \ whatever\n    s = s.substring(0, i);\n    File p = new File(file.getParent(),\
  \ s + \".\" + formatName);\n    return p;\n  } else {\n    // file exist\n    return\
  \ new File(file.getParent(), s + \".\" + formatName);\n  }\n}\n```\n\n\n\n\n\n![](img/00016.jpeg\
