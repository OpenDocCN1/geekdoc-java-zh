  \ 3.8 `JFXDrawTools` 类的完整源代码\n## 3.9 总结\n\n## 为什么选择这本书\n本书面向兴趣使用 JavaFX 库开发富客户端应用程序并构建\
  \ GUI 的软件开发人员。JavaFX 中的重要功能通过逐步开发真实的 Java 应用程序得到了展示。书中使用了说明性图表帮助读者掌握抽象概念。每章中使用的所有图表都是使用本系列书籍开发的图形工具创建的。\n\
  \n如果你符合以下情况，系列书籍将适合你：\n- 一位初接触 JavaFX 的 Java GUI 程序员（无论是新手还是专业人士）。\n- 一位具有 JavaFX\
