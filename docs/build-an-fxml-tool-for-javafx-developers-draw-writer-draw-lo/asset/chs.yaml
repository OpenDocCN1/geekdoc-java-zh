  \ 菜单将添加更多操作。以下是实现这些功能的源代码：\n\n### 列表 3-8. 创建带有“Clear All”菜单项的 `Action` 菜单：\n\n```\n\
  MenuBar createMenuBar(Stage stage) {\n    MenuBar menuBar = new MenuBar();\n   \
