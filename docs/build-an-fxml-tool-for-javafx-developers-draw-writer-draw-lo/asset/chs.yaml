  \ jfxdrawtools.JFXDrawTools\n```\n\n## 3.9 总结\n\n本章介绍了 JavaFX 库的以下关键方面，按照它们在章节中出现的顺序列出：\n\
  \n\n\n\n\n* `MenuBar`, `Menu` 和 `MenuItem` 是基础的 JavaFX UI 组件，位于 `javafx.scene.control`\
  \ 包中，用于使用更少空间设计紧凑外观的图形化用户界面。\n  (参见章节：向菜单栏中添加 `File` 菜单, 向 `File` 菜单中添加 `Save FXML`\
  \ 子菜单, 向 `File` 菜单中添加 `Open` 子菜单, 向菜单栏中添加 `Action` 菜单)\n\n* `EventHandler<T extends\
  \ Event>` 是一个扩展自 `java.util.EventListener` 的接口，定义了一个 `handle(T event)` 方法，在指定的事件发生时被调用。\n\
  \  (参见此处, 此处, 此处 以及 此处)\n\n* `void setOnAction(EventHandler<ActionEvent> value)`\
  \ 方法由 `MenuItem` 类提供，用于注册一个 `EventHandler` 以在 `ActionEvent` 发生时接收通知。\n  (参见此处, 此处,\
  \ 此处, 以及 此处)\n\n* `accelerator` 属性定义在 `MenuItem` 类中，指定一个 `KeyCombination` 来触发 `MenuItem`\
  \ 的 `ActionEvent`。\n  (参见此处)\n\n* `KeyCombination` 是一个位于 `javafx.scene.input` 包的抽象类，定义了\
  \ `KeyCombination.Modifier` 类型的静态字段，例如 `CONTROL_DOWN`、`META_DOWN`、`SHIFT_DOWN` 等，这些对于构建\
  \ `KeyCharacterCombination` 实例有用。\n  (参见此处)\n\n* `KeyCharacterCombination` 位于 `javafx.scene.input`\
  \ 包，是 `javafx.scene.input.KeyCombination` 的直接子类，用于创建触发 `ActionEvent` 的快捷键。\n  (参见此处)\n\
  \n* `FileChooser` 类继承自 `java.lang.Object` 并位于 `javafx.stage` 包；它提供了方便的方法来打开/保存文件：\n\
  \n```java\npublic java.io.File showOpenDialog(Window ownerWindow)\n```\n显示文件打开对话框，用于浏览本地文件系统以选择要打开的文件。\n\
  \n```java\npublic java.io.File showSaveDialog(Window ownerWindow)\n```\n显示文件保存对话框，用于浏览本地文件系统以选择要保存的文件。\n\
  \n```java\npublic ObservableList<FileChooser.ExtensionFilter> getExtensionFilters()\n\
  ```\n获取此 `FileChooser` 的 `ExtensionFilter` 列表，并允许用户添加首选的文件扩展名过滤器，例如 `*.fxml`、`*.jpg`\
  \ 等。\n  (参见章节：向 `File` 菜单中添加 `Save FXML` 子菜单, 向 `File` 菜单中添加 `Open` 子菜单)\n\n* `FileChooser.ExtensionFilter`\
  \ 类定义在 `javafx.stage.FileChooser` 类，为 `FileChooser` 的对话框指定文件扩展名过滤器。\n  (参见此处, 以及\
  \ 此处)\n\n* 来自 `javafx.beans.property` 包的类：\n\n```java\nObjectProperty<T>\n```\n\
  一个抽象类，派自 `javafx.beans.binding.ObjectExpression<T>` 类，实现了 `Property<T>` 和 `WritableObjectValue<T>`。\n\
  \n```java\nSimpleObjectProperty<T>\n```\n一个派自 `ObjectProperty<T>` 类的类。\n  (参见章节：向\
  \ `File` 菜单中添加 `Save FXML` 子菜单, 为显示 FXML 文件名绑定阶段标题)\n\n* `Property<T>` 接口位于 `javafx.beans.property`\
  \ 包，定义了所有属性共有的方法，如：\n\n```java\nvoid bind(ObservableValue<? extends T> observable)\n\
  ```\n将此属性单向绑定到给定的 `ObservableValue`。\n\n```java\nvoid unbind()\n```\n取消此属性的绑定。\n\
  \  (参见为显示 FXML 文件名绑定阶段标题)\n\n* `StringBinding` 是扩展 `StringExpression` 类的抽象类，位于 `javafx.beans.binding`\
  \ 包。为了创建 `StringBinding` 的实例，需要实现抽象方法 `String computeValue()`。\n  (参见为显示 FXML 文件名绑定阶段标题)\n\
  \n# 结语\n\n作者正在编写该系列书籍的其他卷，更多针对 JavaFX 开发者的便利工具将陆续发布。让我们在序言部分披露的其他功能之外，预预览一下即将推出的特性：\n\
  \n* 调色板工具\n* 图像编辑工具\n* 更多交互式绘图工具：手绘绘制、橡皮带绘制、文本写入、颜色渐变生成、弧形绘制、光标键移动等。\n* 路径过渡动画器\n\
  * 动态上下文菜单控制器\n* 方便的形状库\n* 以及更多……\n\n祝您猴年快乐、健康、如意。\n\n"
