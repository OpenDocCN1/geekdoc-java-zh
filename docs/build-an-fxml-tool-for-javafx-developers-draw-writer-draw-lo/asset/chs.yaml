  \ 类的完整源代码\n- 1.4 总结\n\n## 1.1 创建 `DrawWriter` 类\n\nFXML 是一种符合 XML（可扩展标记语言）语法的标记语言，用于在不编写\
  \ Java 代码的情况下构建 JavaFX 应用程序的 GUI；更多信息，请参考本书“引言”部分中的使用 FXML 创建用户界面。\n\n`DrawWriter`\
  \ 类位于 `drawtool.io` 包中，提供了创新的 API，将在画板上动态绘制的草图写入 FXML 格式的文件。通常情况下，它们是基于这些 Java 包中的工具类的高级\
  \ API：\n\n```\njavax.xml.parsers\njavax.xml.transform\njavax.xml.transform.dom\n\
  javax.xml.transform.stream\norg.w3c.dom \n```\n\n除了 FXML 文件外，`DrawWriter` 还可以将图像写入\
  \ png 或 gif 格式的文件。\n\n最初，在我们的 `drawtool.io` 包中提供了两个工具类：\n\n`writeFXML`\n\n将 `Pane`\
  \ 或 JavaFX `Node` 对象列表写入 FXML 格式的文件中。\n\n`writeImageView`\n\n应用 `javax.imageio.ImageIO.write`\
  \ 方法将 `ImageView` 对象的图像写入 png 或 gif 格式的图像文件，该方法会考虑在 `ImageView` 对象中指定的视图属性，包括应用在其上的变换。\n\
  \n在本节中，我们将详细描述在 `DrawWriter` 类中定义的特色方法的实现：\n\n1. `public void writeFXML(Pane pane,\
  \ File file)`\n2. `public void writeFXML(List<? extends javafx.scene.Node> list,\
  \ File file)`\n3. `public void writeImageView(ImageView iv, File file)`\n\n在开始编码过程之前，让我们先预览一下由\
  \ `writeFXML` 工具类生成的 FXML 文件：\n\n列表 1-1. 使用 `writeFXML` 工具类的程序生成的 FXML 文件的内容：\n\n\
  ```\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<?import java.lang.*?>\n\
  <?import java.util.*?>\n<?import javafx.animation.*?>\n<?import javafx.animation.PathTransition.*?>\n\
  <?import javafx.geometry.*?>\n<?import javafx.scene.Group?>\n<?import javafx.scene.control.*?>\n\
  <?import javafx.scene.effect.*?>\n<?import javafx.scene.image.*?>\n<?import javafx.scene.layout.*?>\n\
  <?import javafx.scene.paint.*?>\n<?import javafx.scene.shape.*?>\n<?import javafx.scene.text.*?>\n\
  <?import javafx.scene.transform.*?>\n<?import javafx.util.*?>\n<Pane xmlns:fx=\"\
  http://javafx.com/fxml\">\n  <children>\n    <Ellipse centerX=\"280.0\" centerY=\"\
  80.0\" fill=\"#00000000\" fx:id=\"Ellipse_349826\"\n      radiusX=\"20.0\" radiusY=\"\
  6.0\" stroke=\"#006400\" translateX=\"-73.0\" translateY=\"-20.0\"/>\n    <Ellipse\
  \ centerX=\"280.0\" centerY=\"200.0\" fill=\"#00000000\" fx:id=\"Ellipse_10fd2df\"\
  \n      radiusX=\"40.0\" radiusY=\"12.0\" stroke=\"#006400\" translateX=\"-73.0\"\
  \ translateY=\"-20.0\"/>\n    <Path fx:id=\"Path_1b6f0eb\" stroke=\"#1E90FF\" translateX=\"\
  -73.0\" translateY=\"-20.0\">\n      <elements>\n        <MoveTo x=\"300.0\" y=\"\
  80.0\"/>\n        <LineTo x=\"320.0\" y=\"200.0\"/>\n        <MoveTo x=\"260.0\"\
  \ y=\"80.0\"/>\n        <LineTo x=\"240.0\" y=\"200.0\"/>\n      </elements>\n \
  \   </Path>\n    <Ellipse centerX=\"400.0\" centerY=\"120.0\" fill=\"#00000000\"\
  \ fx:id=\"Ellipse_192cf37\"\n      radiusX=\"30.0\" radiusY=\"10.0\" stroke=\"#006400\"\
  \ translateX=\"-82.0\" translateY=\"-15.0\"/>\n    <Path fx:id=\"Path_dcbc7b\" stroke=\"\
  #1E90FF\" translateX=\"-82.0\" translateY=\"-20.0\">\n      <elements>\n       \
  \ <MoveTo x=\"300.0\" y=\"80.0\"/>\n        <LineTo x=\"320.0\" y=\"200.0\"/>\n\
  \        <MoveTo x=\"260.0\" y=\"80.0\"/>\n        <LineTo x=\"240.0\" y=\"200.0\"\
  />\n      </elements>\n    </Path>\n  </children>\n</Pane>\n```\n\n\n\n\n`Element\
  \ createElement(String tagName) throws DOMException`\n\n在 XML 文档中创建一个元素。\n\n`ProcessingInstruction\
  \ createProcessingInstruction(String target, String data) throws DOMException`\n\
  \n创建一个处理指令，例如 `import` 语句。\n\n我们还使用了继承自 `org.w3c.dom.Node` 的 `appendChild(Node newChild)`\
  \ 方法，向此节点添加一个子节点。\n\n### 1.1.2 `DOMSource` 和 `StreamResult`\n\n`DOMSource` 类继承自\
  \ `java.lang.Object`，位于 `javax.xml.transform.dom` 包中。`StreamResult` 类继承自 `java.lang.Object`，位于\
  \ `javax.xml.transform.stream` 包中。\n\n当一个 DOM `Document` 准备好写入物理文件时，我们通过向其构造函数传递一个\
  \ DOM `Document` 来创建一个 `DOMSource` 对象，并通过向其构造函数传递一个 `File` 来创建一个 `StreamResult`\
  \ 对象。然后，使用 `Transformer` 将源（即 `Document`）转换为目标（即 `File`）。以下是实现这些操作的源代码：\n\n列表 1-3.\
  \ 定义 `writeMyFXMLDocument` 方法将 `Document` 写入 `File`：\n\n```\n void writeMyFXMLDocument()\
  \ {\n    try {\n      DOMSource source = new DOMSource(document);\n      StreamResult\
  \ result = new StreamResult(fxmlFile);\n      transformer.transform(source, result);\n\
  \    } catch (TransformerException e) {\n      System.out.println(e.getMessage());\n\
  \    }\n  }\n```\n\n### 1.1.3 实现 `writeFXML` 方法\n\n`DrawWriter` 类提供了两个 `writeFXML`\
  \ 方法用于将 JavaFX 节点写入 FXML 文件，其中一个接受 `Node` 列表，另一个接受一个 `Pane`：\n\n1. `public void\
  \ writeFXML(Pane pane, File file)`\n\n   递归地将 `pane` 的子节点写入 FXML 格式的文件，并以 `<Pane>`\
  \ 元素作为 `Document` 的根节点。\n\n2. `public void writeFXML(List<? extends javafx.scene.Node>\
  \ list, File file)`\n\n   将 JavaFX `Node` 列表写入 FXML 格式的文件，并以 `<Pane>` 元素作为 `Document`\
  \ 的根节点。\n\n在此阶段，我们重点关注这些类型的节点——`Shape`、`ImageView`——以满足形状构建器 JFXDrawTools V1.2 应用的需求，该将在将在后续章节中讨论。然而结构是可扩展的，允许你轻松地量添加代码以支持其他类型的节点。\n\
  \n以下是定义 `writeFXML` 方法的代码片段\n\n列表 1-4. 在 `DrawWriter` 类中定义 `writeFXML` 方法，向其传递一个\
  \ `Pane` 和一个 `File`：\n\n```\n public void writeFXML(Pane pane, File file) {\n  \
  \  // 如果 pane 没有子节点，\n    // 仍然会创建一个包含 <pane> 节点的 FXML 文件，\n    // 内部没有子节点\n   \
  \ initMyFXMLDocument(file);\n    writeFXMLHeader();\n    writeFXMLRootPane(pane,\
  \ pane.getChildren());\n    writeMyFXMLDocument();\n  }\n```\n\n列表 1-5. 在 `DrawWriter`\
  \ 类中定义 `writeFXML` 方法，向其传递一个 `List` 和一个 `File`：\n\n```\n public void writeFXML(List<?\
  \ extends javafx.scene.Node> list, File file)  {\n    // 如果 list 为空或为空，\n    //\
  \ 仍然会创建一个包含 <pane> 节点的 FXML 文件，\n    // 内部没有子节点\n    initMyFXMLDocument(file);\n\
  \    writeFXMLHeader();\n    writeFXMLRootPane(null, list);\n    writeMyFXMLDocument();\n\
  \  }\n```\n\n#### 1.1.3.1 组合 DOM 文档的内容\n\n我们已经描述了如何创建 DOM `Document`、如何将其写入物理文件，以及如何访问\
  \ DOM `Document` 内部的信息。现在让我们探索符合 FXML 格式的组合 DOM `Document` 内容的过程。\n\n在写入根节点之前，我们需要使用\
  \ `createProcessingInstruction` 方法为 Java `import` 语句写入处理指令。\n\n列表 1-6. 定义 `writeFXMLHeader`\
  \ 方法以为 Java `import` 语句写入处理指令：\n\n```\n void writeFXMLHeader() {    \n    document.appendChild(importInstruction(\"\
  java.lang.*\"));\n    document.appendChild(importInstruction(\"java.util.*\"));\n\
  \    document.appendChild(importInstruction(\"javafx.animation.*\"));\n    document.appendChild(importInstruction(\"\
  javafx.animation.PathTransition.*\"));\n    document.appendChild(importInstruction(\"\
  javafx.geometry.*\"));\n    document.appendChild(importInstruction(\"javafx.scene.Group\"\
  ));\n    document.appendChild(importInstruction(\"javafx.scene.control.*\"));\n\
  \    document.appendChild(importInstruction(\"javafx.scene.effect.*\"));\n    document.appendChild(importInstruction(\"\
  javafx.scene.image.*\"));\n    document.appendChild(importInstruction(\"javafx.scene.layout.*\"\
  ));\n    document.appendChild(importInstruction(\"javafx.scene.paint.*\"));\n  \
  \  document.appendChild(importInstruction(\"javafx.scene.shape.*\"));\n    document.appendChild(importInstruction(\"\
  javafx.scene.text.*\"));\n    document.appendChild(importInstruction(\"javafx.scene.transform.*\"\
  ));\n    document.appendChild(importInstruction(\"javafx.util.*\"));\n  }\n\n  ProcessingInstruction\
  \ importInstruction(String data) {\n    return document.createProcessingInstruction(\"\
  import\", data);\n  }\n```\n\n生成的文档头将如下所示：\n\n列表 1-7. 文档头部：\n\n```\n<?xml version=\"\
