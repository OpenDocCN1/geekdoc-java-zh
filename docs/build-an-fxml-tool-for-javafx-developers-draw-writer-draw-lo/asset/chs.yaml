  \ Java 文件中。\n\n# 引言\n本系列书籍是一份教程，旨在帮助软件开发人员使用 JavaFX 8 构建 Java 应用程序的 GUI，JavaFX 8\
  \ 已成为 Java™ SE 开发工具包 8 (`JDK 8`) 的一部分。\n\n该系列书籍的主要目标是提供一份全面的手册。JavaFX 的集成带来了极大的便利。JavaFX\
  \ 中的重要功能通过逐步开发真实的 Java 应用程序得到了展示。要编译并运行书中的应用程序，你需要下载并安装 JDK。以下是下载 JDK 8 的网站：[`www.oracle.com/technetwork/java/javase/downloads/index.html`](http://www.oracle.com/technetwork/java/javase/downloads/index.html)。\n\
  \n## JavaFX 历史\n现在让我们回顾一下 JavaFX 的时间线：\n- 2005 年 9 月：太阳系统公司（Sun Microsystems）开发了一种名为\
  \ JavaFX 的语言。\n- 2007 年 5 月：JavaFX 改名为为 JavaFX。\n- 2008 年 12 月：JavaFX 1.0 发布。\n\
  - 2010 年 1 月：甲骨文（Oracle）完成了对太阳系统公司的收购。\n- 2010 年 10 月：甲骨文宣布将停止 JavaFX。\n- 2011 年\
  \ 10 月：JavaFX 2.0 发布。\n- 2013 年 2 月：JavaFX 2.2 发布。\n- 2014 年 3 月 18 日：JavaFX 8 作为\
  \ Java™ SE 开发工具包 8 (`JDK 8`) 的发布。\n- 2015 年 10 月：JDK 8u66 发布。\n- 2016 年 1 月：JDK\
  \ 8u72 发布。\n- 2017 年 3 月 23 日：JDK 9 正式可用 (GA)。\n\n\n\n\n\n以下示例旨在为 JavaFX 初学者提供帮助，能够快速预览如何创建一个\
  \ JavaFX 应用程序。\n\n要开始学习，你需要创建一个继承 `javafx.application.Application` 的类，它是 JavaFX\
  \ 程序的入口，并重写必须被覆盖的抽象 `start` 方法。以下是一个典型的 `start` 方法示例：\n\n```\n package imageviewer;\n\
  \nimport javafx.application.Application;\nimport javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\n\
  import javafx.scene.layout.StackPane;\nimport javafx.stage.Stage;\n\n/**\n * File\
  \ Name: ImageViewer.java\n *\n * @author Shufen Kuo\n */\n\npublic class ImageViewer\
  \ extends Application {\n\n  @Override\n  public void start(Stage stage) {\n   \
  \ BorderPane rootPane = new BorderPane();\n    StackPane imageArea = new StackPane();\n\
  \    rootPane.getChildren().add(imageArea);\n\n    Scene scene = new Scene(rootPane,\
  \ 600, 400); \n    stage.setTitle(\"ImageViewer V1.0\");\n    stage.setScene(scene);\n\
  \    stage.show();\n  }\n\n  public static void main(String[] args) {\n    launch(args);\n\
  \  }\n}\n```\n\n### Scene 和 Stage\n\n在 `start` 方法中出现了两个重要的类：`Scene` 和 `Stage`。通常，主要任务是创建图形用户界面（GUI），这些界面在名为场景图（scene\
  \ graph）的分层树形结构中管理。将场景图的根节点与 `Scene` 对象关联，然后将场景放在 `Stage` 对象上。`Stage` 代表 JavaFX\
  \ 应用程序的顶层容器，作为场景图的窗口与应用程序用户进行交互。\n\n接下来的快照让你对我们将构建的 JavaFX 应用程序的 GUI 有一个初步概念：\n\n\
  图 1. JavaFX 应用程序快照。\n\n![](img/00006.jpeg \"javafx_app_guis.jpg\")\n\n### Nodes\n\
  \nJavaFX 引入了一个基础类 `javafx.scene.Node`，它继承自 `java.lang.Object`，并为所有可用用户界面提供了常用的属性和方法。我们经常使用“节点”（nodes）一词来指代\
  \ GUI。\n\n场景图可能包含各种类型的节点。节点要么是父节点（拥有子节点的节点），要么是叶节点（没有子节点的节点）；每个节点只能有一个父节点，而根节点没有父节点。场景图中的所有节点都派自\
  \ `javafx.scene.Node` 类。\n\n为了快速掌握场景图中节点类型的要点，我们将根据它们是否能够添加子节点来对其进行区分：\n\n*   你可以向这些节点添加子节点：\n\
  \    以下类被频繁地用作父节点：`Group`、`Pane` 以及内置布局面板（它们是 `Pane` 的直接子类）。通常，你调用 `getChildren()`\
  \ 方法来获取类型为 `ObservableList<Node>` 的列表（它是 `java.util.List` 的子接口），然后使用 Java 开发者熟悉的\
  \ `Collection` 接口中定义的实用工具来操作列表内容。\n\n*   你不能向这些节点添加子节点：\n    以下类始终被用作叶节点：`Canvas`、`ImageView`、`MediaView`\
  \ 以及 `Shape` 的所有直接子类，例如 `Rectangle`、`Circle`、`Ellipse` 等。\n\n## JavaFX 和 Swing\n\
  \n现在，有一个有趣的问题。多年来，Java 开发者一直使用 Swing API（Java 基础类 JFC 的 GUI 组件）来构建 Java 应用程序的 GUI，为什么我们在\
  \ Swing 之外还需要 JavaFX 呢？\n\n如果你有大量用 Swing 编写的遗留代码并希望将 JavaFX 特性整合到 Swing 代码中，JDK\
  \ 8 提供了机制；反之，你也可以将 Swing 组件包含在 JavaFX 应用程序中。\n\n本书丛未涵盖 JavaFX-Swing 互操作性的话题。如果你对此主题感兴趣，请在此访问\
  \ Oracle 在线文档“JavaFX: Interoperability -- JavaFX-Swing Interoperability”：\n\n[`docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm`](http://docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm)\n\
  \nJavaFX 是下一代 Java GUI。为了说明使用 JavaFX 能力的优势，除了 JavaFX 和 Swing 之间的互操作性外，我们在下面的章节中介绍了\
  \ JavaFX 的重要特性。\n\n## JavaFX 的精髓\n\nJavaFX 不仅允许你快速创建带有视觉用户界面的应用程序，还包含引人且独特的能力。它们列举如下：\n\
  \n### 内置布局面板\n\nJavaFX 的布局面板是容器，它们会自动对节点执行各种类型的放置。你可以在布局面板中放置任意数量的节点，布局面板本身也是一个节点，因此也可以嵌套在另一个布局面板中。使用布局面板的主要优势是避免手动指定每个节点的大小和位置的繁琐。由于场景图中的这些节点是在树形结构中管理的，布局算法会根据其布局类型和指定的布局属性递归地计算每个节点的大小和位置，并在窗口发生大小调整调整事件时动态触发重新计算。\n\
  \n共有 8 种内置布局面板，位于 `javafx.scene.layout` 包中：\n\n*   `BorderPane`\n    `BorderPane`\
  \ 将节点分别放置在五个位置，以创建主窗口的经典视觉效果：通常顶部区域用于菜单栏或工具栏，底部区域用于状态栏，左侧和右侧区域用于面板，中心区域用于工作区。\n\
  *   `HBox`\n    `HBox` 在行内水平排列节点。\n*   `VBox`\n    `VBox` 在列内垂直排列节点。\n*   `GridPane`\n\
  \    `GridPane` 在多行多列的网格中放置节点。对于显示一系列键值对属性的情况，这是一个实用的用户界面。\n*   `StackPane`\n  \
  \  `StackPane` 将所有节点堆叠在中心（默认对齐方式），后创建的节点位于先创建节点之上。但你可以使用静态方法 `StackPane.setAlignment(Node`\
  \ child`, Pos` value)` 和 `StackPane.setMargin(Node` child`, Insets` value)` 来调整每个节点的位置。\n\
  *   `FlowPane`\n    你可以指定 `FlowPane` 的方向。对于水平 `FlowPane`，节点从左到右排列，在容器边界处换行。对于垂直\
  \ `FlowPane`，节点从上到下排列，在容器边界处换列。\n*   `TilePane`\n    `TilePane` 类似于 `FlowPane`，不同之处在于\
  \ `TilePane` 网格中的每个单元的大小相同。\n*   `AnchorPane`\n    `AnchorPane` 相对于其指定的锚点放置节点，共有四个锚点：`topAnchor`、`rightAnchor`、`bottomAnchor`\
  \ 和 `leftAnchor`。\n\n#### 参考 Oracle 在线文档“JavaFX 中的布局工作”：\n\n[`docs.oracle.com/javase/8/javafx/layout-tutorial/index.html`](http://docs.oracle.com/javase/8/javafx/layout-tutorial/index.html)\n\
  \n### 使用 CSS 进行自定义\n\nJavaFX 允许使用 CSS（层叠样式表）来描述应用程序用户界面的样式。使用 CSS 定义显示属性（如颜色、字体、边距、内边距、宽度、高度、线条、背景图像等）与应用程序源码分离，在许多方面显示了巨大的便利性：\n\
  \n*   软件提供者的自定义：\n    从同一组源码编译的应用程序可以具有多种样式，每种样式满足不同客户的需求。\n*   应用程序用户的自定义：\n  \
  \  即使在软件发布后，如果应用程序用户对 GUI 的外观有偏好，在客户现场修改 CSS 文件中定义的显示属性也是可。\n*   样式设计者的益处：\n\n\n\
  \n\n将应用程序源代码与表现样式定义分离，可以提高代码的可读性，并通过让图形设计师专注于处理 CSS，从而简化他们的工作任务。\n\n## 对软件开发者的益处：\n\
  \n在测试过程中，开发者可能会频繁更改 CSS 文件中定义的样式属性，以评估 GUI 的各种外观效果。如果每次更改都必须退出并重启应用程序，那将是一项非常乏味的任务。为了方便这一评估过程，最佳策略是设计一个临时的`Load`按钮，每当任何样式属性发生变化时，只需点击该按钮重新加载\
  \ CSS，无需退出并重启应用程序，从而节省了大量的测试时间。\n\n## JavaFX CSS 与 HTML 中 CSS 的相似性：\n\nJavaFX 中\
  \ CSS 的语法与 HTML 中的 CSS 相同，因此任何具有浏览器 CSS 经验的设计师都可以花费少量学习成本为 JavaFX 应用程序的 UI 设计样式。\n\
  \n### 参考 Oracle 在线文档“使用 CSS 制作 JavaFX 应用”：\n\n[`docs.oracle.com/javase/8/javafx/user-interface-tutorial/css_tutorial.htm`](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/css_tutorial.htm)\n\
  \n## 使用 FXML 创建用户界面\n\nFXML 是一种符合 XML（可扩展标记语言）语法的标记语言，并带有额外的规则，用于创建 JavaFX 应用程序的用户界面。考虑到通过手动编码\
  \ FXML 容易出错，一种可行的方法是通过 GUI 构建器生成 FXML 代码。\n\n在本系列书籍中，我们介绍了一个实用的应用程序 `JFXDrawTools`，它是一种专门用于创建派自\
  \ `Shape` 的子类实例的 GUI 构建器。用户可以交互式地创建一个草图（无论是 `Shape` 还是 `ImageView`），操纵其属性并将编辑结果保存为\
  \ FXML 格式的文件，这些文件稍后可以重新加载以继续编辑过程，或者被其他 JavaFX 应用程序动态加载。\n\n将应用程序的 GUI（视图 View）与其业务逻辑（模型\
  \ Model）分离被认为良好的编程实践。FXML 文件表示视图，而控制器（controller）是一个在视图和模型之间传递信息的 Java 类。使用 FXML\
  \ 构建 GUI 使得应用程序开发者能够有效地采用 MVC（模型-视图-控制器）架构。\n\n### 参考 Oracle 在线文档“JavaFX：精通 FXML”：\n\
  \n\n\n[`docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html`](http://docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html)\n\
  \n## 属性与绑定的强大能力\n\nJavaFX 特有的属性（Properties）概念遵循了 JavaBeans 组件中引入的设计规范，它通常与绑定（Binding）机制结合使用，为各种编程需求提供了强大而又简洁的解决方案。\n\
  \n在本系列书籍介绍的 `JFXDrawTools` 应用程序中，我们大量演示了属性和绑定的用法。在属性窗口（Properties Window）的实现中，使用了合适的\
  \ UI 控件（如文本字段、选择框、组合框等）来查看相关对象的属性。采用绑定机制将 UI 控件与其对应对象的相应属性进行双向链接，这种关系在属性窗口即将显示时就会建立。当用户更改\
  \ UI 控件中显示的数据时，更改会立即反映到相关对象的相应上。\n\n### 参考 Oracle 在线文档“JavaFX：属性与绑定教程”：\n\n[`docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html`](http://docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html)\n\
  \n## 变换与过渡的高级机制\n\nJavaFX 内置的节点变换（transformations）能力对于开发图形编辑器、绘图工具、图像查看器、GUI 构建器等图形软件包非常方便。\n\
  \n以下是处理变换的类：`Translate`、`Rotate`、`Scale` 和 `Shear`。它们都派自 `Transform` 类，并位于 `javafx.scene.transform`\
  \ 包中。\n\nJavaFX 过渡（transitions）为创建动画提供了简洁的方法。许多应用程序都需要动画功能，这里是一些用例：在警告情况下引起注意、在删除操作期间将对象移入垃圾箱、在数据加载期间指示中间状态等等\n\
  \n在本系列书籍介绍的 `ImageViewer` 应用程序中，我们在幻灯片功能对图像对象应用了 `FadeTransition` 和 `ParallelTransition`，使新图像淡入旧图像淡出。\n\
  \n以下是处理过渡的类：`FadeTransition`、`RotateTransition`、`ScaleTransition`、`TranslateTransition`、`FillTransition`、`StrokeTransition`、`PathTransition`、`ParallelTransition`、`SequentialTransition`、`PauseTransition`。它们都派自\
  \ `Transition` 类（该抽象类定义了动画的基本功能），并位于 `javafx.animation` 包中。\n\n### 参考 Oracle 在线文档“JavaFX：变换、动画和视觉效果”：\n\
  \n[`docs.oracle.com/javase/8/javafx/visual-effects-tutorial/index.html`](http://docs.oracle.com/javase/8/javafx/visual-effects-tutorial/index.html)\n\
  \n## 2D 几何原语和文本都是 JavaFX 节点\n\nJavaFX 提供了一个 `Shape` 类，它扩展自 `javafx.scene.Node` 类，是\
  \ 2D 几何基本形式的超类。应用于几何原语的面对象概念促进了图形应用程序的。\n\n以下是派自 `Shape` 类的类：`Arc`、`Circle`、`CubicCurve`、`Ellipse`、`Line`、`Path`、`Polygon`、`Polyline`、`QuadCurve`、`Rectangle`、`SVGPath`、`Text`。除了\
  \ `Text` 类外，其他都位于 `javafx.scene.shape` 包中。\n\n请注意，位于 `javafx.scene.text` 包的 `Text`\
  \ 类也被视为形状，它为文本绘图工具的发展提供了支持。所有 JavaFX 节点的特性都可以应用于文本对象。你可以像处理任何几何形状一样处理它。文本对象可以放置在布局面板中利用自动布局能力、应用变换和过渡，以及使用\
  \ CSS 自定义样式等。\n\n### 参考 Oracle 在线文档“在 JavaFX 中使用文本”：\n\n[`docs.oracle.com/javase/8/javafx/user-interface-tutorial/text-settings.htm`](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/text-settings.htm)\n\
  \n\n\n\n\n# JavaFX Web Engine 组件\n\nJavaFX 架构中嵌入了一个 引擎组件，它位于 `javafx.scene.web`\
  \ 包中，提供了一系列 API，用于开发具有网页浏览器功能的应用程序。\n\n要查看网页，首先需要创建一个 `WebView` 对象（该对象继承自 `javafx.scene.Parent`\
  \ 并继承了节点的所有特性），然后获取与之关联的 `WebEngine`。`WebEngine` 提供了与操作网页相关的方法，例如：加载/显示网页（通过给定的\
  \ URL 或页面内容）、访问由 `WebEngine` 为已加载的网页创建的文档对象模型 (DOM)、处理从 JavaScript 触发的各种事件等。\n\n\
  ## 引用 Oracle 在线文档“JavaFX: Adding HTML Content to JavaFX Applications”\n\n[http://docs.oracle.com/javase/8/javafx/embedded-browser-tutorial/index.html]\n\
  \n## HTML 编辑能力\n\n### 用于编辑 HTML 页面的 HTMLEditor 类\n\n对 HTML 编辑能力的完整支持来自 `HTMLEditor`\
  \ 类，该类继承自 `javafx.scene.control.Control` 并位于 `javafx.scene.web` 包中。要在 JavaFX 应用程序中嵌入\
  \ HTML 编辑器，你只需创建 `HTMLEditor` 的实例，将其添加到场景图中，然后它就可以与用户进行交互了。\n\n以下两个方法用于获取和设置编辑器的\
  \ HTML 内容：`getHtmlText()` 和 `setHtmlText(java.lang.String htmlText)`。\n\n与处理多行纯文本的类似控件\
  \ `TextArea` 不同，`HTMLEditor` 格式化的是符合 HTML 语法的文本。\n\nHTML 编辑器的用法在各个软件领域被广泛需要，例如：\n\
  - 博客作者撰写发布（内容管理系统）\n- 邮件系统用户编写消息（消息系统）\n- 在线卖家为上架准备产品描述（电子商务管理系统）\n\n## 引用 Oracle\
  \ 在线文档“JavaFX: Working with JavaFX UI Components -- HTML Editor”\n\n[http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm]\n\
  \n## 用于渲染数据的图表组件\n\n以下类位于 `javafx.scene.chart` 包中，用于绘制各种类型的图表：\n- `AreaChart`, `StackedAreaChart`\n\
  - `BarChart`, `StackedBarChart`\n- `BubbleChart`\n- `LineChart`\n- `PieChart`\n\
  - `ScatterChart`\n\n`Chart` 类是所有图表组件的基类，它继承自 `javafx.scene.layout.Region` 类，因此继承了\
  \ `javafx.scene.Node` 类的所有适用特性。\n\n## 引用 Oracle 在线文档“JavaFX: Working with JavaFX\
  \ UI Components -- Working with JavaFX Charts”\n\n[http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm]\n\
  \n## 用于播放媒体的 MediaView 类\n\n`MediaView` 类继承自 `javafx.scene.Node`，与 `MediaPlayer`\
  \ 和 `Media` 类一起使用，在 JavaFX 应用程序中播放媒体。所有与媒体相关的类都位于 `javafx.scene.media` 包中。\n\n##\
