  \ != null) {\n          file = getPrefFileExtension(file, \"fxml\");\n         \
  \ curFXMLFile.set(file);\n          // 在执行动作之前，有必要清理未完成的绘制\n          cleanUnfinished();\n\
  \          drawWriter.writeFXML(drawPane, file);\n        }\n      }\n    });\n\n\
  \    return menuSave;\n  }\n\n  /**\n   * 检查文件是否以指定的优先扩展名结尾，\n   * 如果不是，则返回一个带有指定优先扩展名的新文件\n\
  \   * 对未来版本的说明：检查新文件名是否存在，\n   * 如果存在，则提示警告消息（替换或取消）\n   *\n   * @param f\n   *\
  \ @param ext\n   * @return\n   */\n  File getPrefFileExtension(File f, String ext)\
  \ {\n    String s = f.getName();\n    if (s.endsWith(\".\" + ext)) {\n      return\
  \ f;\n    }\n    return new File(f.getPath() + \".\" + ext);\n  }\n```\n\n## 3.4\
