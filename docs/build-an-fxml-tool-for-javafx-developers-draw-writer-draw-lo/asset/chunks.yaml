  trans: "\n我们将图像 `/resource/MyLogoIcon_1_2.png` 设置为应用程序窗口最小化时的图标。该图标也是窗口装饰的一部分。以下是来自上述列表的代码片段：\n\
    \n### 列表 3-10. 设置应用程序窗口的最小化图标：\n\n```java\n String iconName = \"/resource/MyLogoIcon_1_2.png\"\
    ;\n    Image iconImage = new Image(getClass().getResourceAsStream(\n        iconName));\n\
    \    stage.getIcons().add(iconImage);\n```\n\n这里是该图像：\n\n### 图 3-8. 作为应用程序窗口最小化图标使用的图像。\n\
    \n![](img/00036.jpeg \"MyLogoIcon_1_2.png\")\n\n如果你是一个有兴趣成功编译此程序的开发者，既可以将图标图像替换为您喜欢的图像，也可以从本电子书的\
    \ HTML 文件中提取图像文件 `MyLogoIcon_1_2.png` 并放入名为 `resource` 的目录中。`resource` 目录应该位于您放置\
    \ `drawtool` 包的目录内。\n\n关于将电子书的 `.mobi` 格式转换为 HTML，有以下建议：\n\n1. 在您的电脑上安装 `Calibre`（一款免费开源的电子书管理软件）。\n\
    2. 使用 `Calibre` 中的 `Add books` 功能将本电子书的 `.mobi` 文件添加到 `Calibre` 中。\n3. 使用 `Calibre`\
    \ 中的 `Convert books` 功能，选择 `HTMLZ` 为输出格式，点击 `OK` 按钮进行转换。\n4. 转换完成后，您将得到一个扩展名为\
    \ `.htmlz` 的输出文件。将扩展名重命名为 `.zip` 并解压文件，您将获得一个大的 HTML 文件和一个名为 `images` 的目录，其中包含\
    \ HTML 文件内容引用的所有图像文件。\n\n   如果你正在使用 Windows 8，`.htmlz` 输出文件存储在此目录的子目录中：\n\n  \
    \ ```\nC:\\Users\\<User Name>\\Documents\\Calibre Library\n```\n\n以下是 `JFXDrawTools\
    \ V1.2` 应用程序的截图，该程序可以在图像上绘制形状，然后将它们保存到 FXML 文件 MySketch.fxml 中，目录位于：\n\n`JFXDrawTools1.2/src/example1/myfxml/`\n\
    \n### 图 3-9. 加载图像作为背景，绘制一些形状，并使用 `JFXDrawTools V1.2` 应用程序全部保存到名为 MySketch.fxml\
    \ 的 FXML 文件。\n\n![](img/00037.jpeg \"my_sketch.jpg\")\n\n### 图 3-10. 使用 `JFXDrawTools\
    \ V1.2` 应用程序打开之前保存的 FXML 文件 MySketch.fxml 并继续编辑。\n\n![](img/00038.jpeg \"my_sketch_house.jpg\"\
    )\n\n以下是为图 3-10 保存的 FXML 文件 `MySketch.fxml` 的内容。\n\n### 列表 3-11. 图 3-10 所保存的 MySketch.fxml\
    \ 文件内容：\n\n"
