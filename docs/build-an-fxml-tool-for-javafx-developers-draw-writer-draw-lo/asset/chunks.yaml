    DrawWriter V1.4 does not write attributes for %s yet%n\", figure.getClass().getSimpleName());\n\
    \    }\n    // 在写入 属性后写入属性（一个 map）\n    writeProperties(figure, shapeElm);\n \
    \ }\n\n  /**\n   * 调用者确保 figure 有 getChildren 方法\n   */\n  List<javafx.scene.Node>\
    \ getNodeChildren(javafx.scene.Node figure) {\n    List<javafx.scene.Node> nodeList\
    \ = new ArrayList<>();\n    try {\n      List list = (List)invokeMethod(figure,\
    \ \"getChildren\");\n      for (Object obj : list) {\n        nodeList.add((javafx.scene.Node)obj);\n\
    \      }\n    } catch (Exception e) {\n      System.out.format(\"exception=%s\"\
    , e);\n    }\n    return nodeList;\n  }\n\n  /**\n   * 使用 Java 反射调用方法\n   */\n\
    \  Object invokeMethod(Object obj, String methodName, Object... args) throws Exception\
    \ {\n    Method method = obj.getClass().getMethod(methodName);\n    method.setAccessible(true);\n\
    \    return method.invoke(obj, args);\n  }\n\n  void writeTransforms(ObservableList\
