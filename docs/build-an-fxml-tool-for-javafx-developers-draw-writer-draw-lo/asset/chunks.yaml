    \ showing all transformations applied to the `ImageView`:\n\n### Transformations\
    \ applied to `ImageView`\n\n| scaleX | scaleY | rotate | translateX | translateY\
    \ |\n| --- | --- | --- | --- | --- |\n| 0.5 | 0.5 | 90.0 | -32 | 66 |\n\nAnd here's\
    \ the table showing values in `boundsInLocal` and `boundsInParent` after transformations:\
    \ scale down 50%, rotate 90° clockwise, translate [-32, 66]:\n\n### `Bounds` of\
