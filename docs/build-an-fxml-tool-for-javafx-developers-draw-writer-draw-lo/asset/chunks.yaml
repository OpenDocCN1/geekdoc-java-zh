  trans: "\n\n# 第 3 章：JFXDrawTools\n\n## 3.1 前言\n\n### `DrawLoader.java` 实现\n\n```java\n\
    package drawtool.io;\n\nimport java.io.File;\nimport java.io.IOException;\nimport\
    \ java.net.MalformedURLException;\nimport java.net.URL;\nimport java.util.*;\n\
    import javafx.collections.*;\nimport javafx.fxml.FXMLLoader;\nimport javafx.scene.Group;\n\
    import javafx.scene.Node;\nimport javafx.scene.image.Image;\nimport javafx.scene.image.ImageView;\n\
    import javafx.scene.layout.Pane;\n\n/**\n * 文件名: DrawLoader.java\n * (位于目录: DrawTool1.4/src/example1/drawtool/io)\n\
    \ * 此类处理 FXML 文件加载和图像文件加载\n * 源是 File 的实例。\n *\n * @author Shufen Kuo\n */\n\n\
    public class DrawLoader {\n\n  /**\n   * 返回一个 ImageView，并将 url 以字符串形式放入 ImageView\
    \ 的属性中\n   */\n  public ImageView loadImage(File file, double maxWidth, double\
    \ maxHeight) {\n    String url = file.toURI().toString();\n    Image image = new\
    \ Image(url);\n    ImageView imageView = new ImageView();\n    imageView.setPreserveRatio(true);\
    \  \n    // 如果图像大于 maxWidth/maxHeight，\n    // 初始化 imageView 以适应 maxWidth/maxHeight\n\
    \    if (image.getWidth() > maxWidth) {\n      imageView.setFitWidth(maxWidth);\n\
    \    } else if (image.getHeight() > maxHeight) {\n      imageView.setFitHeight(maxHeight);\n\
    \    }\n    imageView.setImage(image);\n    // 将 url 放入属性（一个 map）\n    imageView.getProperties().put(\"\
    imageURL\", url);\n    return imageView;\n  }\n\n  /**\n   * 加载 FXML 文件以获取场景图的根节点\n\
    \   * 如果根节点是 Pane 或 Group，\n   * 将其后代添加到给定 pane 的子列表中\n   * 如果它不是 Pane 或 Group，\n\
    \   * 将根节点本身添加到给定 pane 的子列表中\n   * 并且根节点是 pane，\n   * 我们也将将其属性（一个 map）添加到给定的 pane\
    \ 中\n   */\n  public ObservableList<Node> loadFXML(File file, Pane pane) {\n \
    \   try {\n      // 从 File 获取 URL\n      URL url = file.toURI().toURL();\n   \
    \   Node root = FXMLLoader.load(url);\n\n      ObservableList<Node> nodeList =\
    \ getRootDescendant(root);\n      pane.getChildren().addAll(nodeList);\n\n   \
    \   ObservableMap<Object, Object> map = root.getProperties();\n      // 如果根节点是\
    \ pane，则将属性（一个 map）添加到 pane\n      if (root instanceof Pane) {\n        Iterator<Map.Entry<Object,\
    \ Object>> it = map.entrySet().iterator();\n        while (it.hasNext()) {\n \
    \         Map.Entry<Object, Object> e = it.next();\n          //System.out.format(\"\
    %s %s%n\", e.getKey().toString(), e.getValue().toString());\n          pane.getProperties().put(e.getKey(),\
    \ e.getValue());\n        }\n      }      \n      return nodeList;\n    } catch(MalformedURLException\
    \ e) {\n      System.out.println(e);\n    } catch(IOException e) {\n      System.out.println(e);\n\
    \    }     \n    // 返回一个空列表\n    return FXCollections.observableArrayList(); \
    \    \n  }\n\n  /**\n   * 加载 FXML 文件以获取场景图的根节点\n   * 如果根节点是 Pane 或 Group，\n  \
    \ * 返回根节点的子节点列表\n   * 如果根节点不是 Pane 或 Group \n   * 在列表中返回根节点\n   */\n  public ObservableList<Node>\
    \ loadFXML(File file) {\n    try {\n      // 从 File 获取 URL\n      URL url = file.toURI().toURL();\n\
    \      Node root = FXMLLoader.load(url);\n      return getRootDescendant(root);\n\
    \    } catch(MalformedURLException e) {\n      System.out.println(e);\n    } catch(IOException\
    \ e) {\n      System.out.println(e);\n    }     \n    // 返回一个空列表\n    return FXCollections.observableArrayList();\
    \     \n  }\n\n  ObservableList<Node> getRootDescendant(Node root) {\n    if (root\
    \ instanceof Pane) \n      return ((Pane)root).getChildren();\n    if (root instanceof\
    \ Group) \n      return ((Group)root).getChildren();\n\n    // 返回一个包含根节点的列表\n\
    \    return FXCollections.observableArrayList(root);     \n  }\n\n}\n```\n\n###\
    \ 在命令行中编译 `drawtool` 库\n\n```bash\n Microsoft Windows [Version 6.3.9600]\n(c)\
    \ 2013 Microsoft Corporation. All rights reserved.\n\nF:\\My Documents\\DocRoot\\\
    SHUFEN_JAVA\\MyBookJFX\\VolumeFour\\DrawTool1.4\\src\\example1>\njavac -encoding\
    \ utf-8 -Xlint:unchecked drawtool\\*.java\n\njavac -encoding utf-8 -Xlint:unchecked\
    \ drawtool\\io\\*.java\n\njavac -encoding utf-8 -Xlint:unchecked drawtool\\shape\\\
    *.java\n\njavac -encoding utf-8 -Xlint:unchecked -cp . drawtool\\drawer\\*.java\n\
    \njar cf drawtool.jar drawtool resource\n```\n\n当我们在本章节的 `JFXDrawTools` 中实现 `File`\
    \ 功能时，我们将详细阐述 `DrawLoader` 类内部定义的 API 的用法。\n\n"
- fmt: "\n## 3.1 Add `File` Menu to Menu Bar\n\nIn this section, we'll create a `File`\
    \ menu and add to menu bar. Initially, `File` menu contains menu item `Exit`.\
    \ Here's the source code to create a `File` menu:\n\nListing 3-1. Create `File`\
    \ menu with menu item `Exit`:\n\n```\n MenuBar createMenuBar(Stage stage) {\n\
    \    MenuBar menuBar = new MenuBar();\n    Menu menuFile = createMenuFile(stage);\n\
    \    Menu menuTools = createMenuTools();\n    Menu menuPref = createMenuPreference();\n\
    \    menuBar.getMenus().addAll(menuFile, menuTools, menuPref);\n\n    return menuBar;\n\
    \  }\n\n  Menu createMenuFile(final Stage stage) {\n    Menu menuFile = new Menu(\"\
    File\");\n    MenuItem exit = new MenuItem(\"Exit\");\n    menuFile.getItems().add(exit);\n\
    \n    // Add action for exit menu item\n    exit.setOnAction(new EventHandler<ActionEvent>()\
    \ {\n      @Override\n      public void handle(ActionEvent e) {\n        Platform.exit();\n\
    \      }\n    });\n    return menuFile;\n  }\n```\n\n## 3.2 Generate FXML Files\
    \ for Drawings Using `DrawWriter` Class\n\nIn this section, we'll demonstrate\
    \ how to use APIs defined in `DrawWriter` class, referring to [Chapter 1](#part0007_split_000.html_6LJU0-6cbc394105fd4c6ab27dd0d32efbcd86)\
    \ of this book, to generate FXML files, in which drawings created interactively\
    \ on a drawing board are saved. The following method will be used:\n\n```\n public\
    \ void writeFXML(Pane pane, File file)\n```\n\nPlease notice that, in the following\
    \ example, we create an instance of `DrawPane`, placed at the center of a `BorderPane`\
    \ as our drawing board. The `DrawPane`, a direct subclass of `Pane` class, registers\
    \ event handlers to handle events which are significant to draw shapes interactively\
    \ on the pane itself. These events include mouse pressed, mouse dragged, mouse\
    \ released, key pressed, etc. For detailed description and complete source code\
    \ of `DrawPane` class, refer to VOLUME Ⅱ: DEVELOPING INTERACTIVE SHAPE DRAWING\
    \ TOOLS Chapter 6 Basic Draw Tool Section 6.2 Create `DrawPane` Class, and Chapter\
    \ 7 Enhanced Draw Tool with Predefined Drawers Section 7.3 Enhance `DrawPane`\
    \ Class.\n\nThe following snippets of code save sketching from a drawing board\
    \ to an FXML file using `DrawWriter` class, in which the `writeFXML` method is\
    \ defined:\n\nImport Statements:\n\n```\nimport java.io.File;\nimport javafx.application.Application;\n\
    import javafx.event.ActionEvent;\nimport javafx.event.EventHandler;\nimport javafx.scene.control.MenuItem;\n\
    import javafx.scene.layout.BorderPane;\nimport javafx.stage.FileChooser;\nimport\
    \ javafx.stage.Stage;\n\nimport drawtool.DrawPane;\nimport drawtool.io.DrawWriter;\n\
    ```\n\nListing 3-2. Write drawings from a drawing board to an FXML file using\
    \ `DrawWriter` class:\n\n```\npublic class JFXDrawTools extends Application {\n\
    \  // The drawing board to draw/move shapes dynamically \n  DrawPane drawPane\
    \ = new DrawPane();\n\n  // Create a DrawWriter to save shapes/images \n  DrawWriter\
    \ drawWriter = new DrawWriter();\n\n  @Override\n  public void start(final Stage\
    \ stage) {\n    BorderPane rootPane = new BorderPane();\n    rootPane.setCenter(drawPane);\n\
    \n        ...\n\n    // Create a file chooser for saveAllAs\n    final FileChooser\
    \ fileChooser = new FileChooser();\n    fileChooser.getExtensionFilters().addAll(\n\
    \        new FileChooser.ExtensionFilter(\"FXML\", \"*.fxml\"),\n        new FileChooser.ExtensionFilter(\"\
    All Files\", \"*.*\"));\n\n        ...\n\n    MenuItem saveAllAs = new MenuItem(\"\
    Save All As...\");\n\n    // Add action for saveAllAs menu item\n    // Open FileChooser\
    \ to select a file\n    saveAllAs.setOnAction(new EventHandler<ActionEvent>()\
    \ {\n      @Override\n      public void handle(ActionEvent e) {\n        // Open\
    \ FileChooser dialog\n        fileChooser.setTitle(\"Save All As FXML File\");\n\
    \        File file = fileChooser.showSaveDialog(stage);\n        if (file != null)\
    \ {\n          drawWriter.writeFXML(drawPane, file);\n        }\n      }\n   \
    \ }); \n\n    ... \n```\n\n## 3.3 Add `Save FXML` Submenu to `File` Menu\n\nHere,\
    \ let's explore the details of implementation of `Save FXML` submenu. First, create\
    \ a `Save FXML` submenu, and add to the `File` menu of menu bar. The `Save FXML`\
    \ submenu has two menu items: \"Save All\", and \"Save All As...\". The action\
    \ of \"Save All\" saves all objects on a drawing board to the current loaded/saved\
    \ FXML file. If it is the first time on action, a default FXML file named \"JFXDrawTools.fxml\"\
    \ is used. In the action of \"Save All...\" pops up a Save Dialog of `FileChooser`\
    \ to save all objects to a file selected from the Save Dialog.\n\nA class field,\
    \ `curFXMLFile`, is defined; it is a property of type `ObjectProperty<File>` to\
    \ specify the current file. Its value is updated when an FXML file is saved or\
    \ loaded.\n\nListing 3-3. Create `Save FXML` menu with `Save All` menu item and\
    \ `Save All As...` menu item:\n"
