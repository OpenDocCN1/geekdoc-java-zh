    \n*   `Image` class extends `java.lang.Object` and resides in `javafx.scene.image`\
    \ package, for loading images. An `Image` can be constructed by passing a string\
    \ url or an `InputStream` to its constructor. Use an `ImageView` object to display\
    \ an `Image`.\n\n    (See section [Implement `loadImage` Method](#part0008_split_001.html_implement-load-image))\n\
    \n*   `ImageView` class extends `javafx.scene.Node` and resides in `javafx.scene.image`\
    \ package, for displaying images. An `Image` can be constructed by passing a url\
    \ of `String` type or an `Image` to its constructor.\n\n    (See section [Implement\
    \ `loadImage` Method](#part0008_split_001.html_implement-load-image))\n\n# Chapter\
    \ 3\n\nEnhanced JFXDrawTools with Draw Writer and Draw Loader Capacities\n\n--Developing\
    \ JFXDrawTools V1.2\n\n## Preface\n\nIn VOLUME Ⅱ: DEVELOPING INTERACTIVE SHAPE\
    \ DRAWING TOOLS Chapter 8 Initial JFXDrawTools Application, and in VOLUME Ⅲ: DEVELOPING\
    \ INTERACTIVE REGULAR POLYGON DRAWING TOOLS Chapter 3 Enhanced JFXDrawTools with\
    \ Regular Polygon Drawer Capacity, we have demonstrated how to utilize APIs provided\
    \ in `drawtool` package, `drawtool.drawer` package, and `drawtool.shape` package\
    \ to develop a drawing application, `JFXDrawTools` , `V1.0` and `V1.1`. It has\
    \ capabilities to interactively draw and move these shapes: Line, Polyline, Polygon,\
    \ Path, QuadCurve (quadratic Bézier Curve), Rectangle, Circle, Ellipse and Regular\
    \ Polygon. Here are snapshots for `JFXDrawTools V1.0` and `JFXDrawTools V1.1`:\n\
    \nFigure 3-1. Snapshot of the JFXDrawTools V1.0 application.\n\n![](images/00029.jpeg\
    \ \"jfx_draw_tools_1_0.jpg\")\n\nFigure 3-2. Snapshot of the JFXDrawTools V1.1\
    \ application.\n\n![](images/00030.jpeg \"jfx_draw_tools_1_1.jpg\")\n\nIn this\
    \ chapter, we will integrate sketch saving and loading capabilities developed\
    \ in previous chapters into `JFXDrawTools V1.1`, and upgrade the version number\
    \ to V1.2.\n\nFrom detailed descriptions and well-documented example code excerpted\
    \ from developments of `JFXDrawTools V1.2`, you will become familiar with fundamental\
    \ capabilities of JavaFX library recounted in the [Summary](#part0009_split_009.html_summary)\
    \ section.\n\nThe complete development process of `JFXDrawTools V1.2` is characterized\
    \ by the following steps:\n\n*   [3.1 Add `File` Menu to Menu Bar](#part0009_split_001.html_add-file-menu)\n\
    \n*   [3.2 Generate FXML Files for Drawings Using `DrawWriter` Class](#part0009_split_002.html_generate-fxml)\n\
    \n*   [3.3 Add `Save FXML` Submenu to `File` Menu](#part0009_split_003.html_add-save-fxml-sub-menu)\n\
    \n*   [3.4 Load Drawings from FXML Files Using `DrawLoader` Class](#part0009_split_004.html_load-drawing)\n\
    \n    *   [3.4.1 Load FXML Files](#part0009_split_004.html_load-fxml-files)\n\n\
    \    *   [3.4.2 Load Image Files](#part0009_split_004.html_load-image-files)\n\
    \n*   [3.5 Add `Open` Submenu to `File` Menu](#part0009_split_005.html_add-open-sub-menu)\n\
    \n*   [3.6 Bind Stage Title for Displaying FXML File Name](#part0009_split_006.html_bind-stage-title)\n\
    \n*   [3.7 Add `Action` Menu to Menu Bar](#part0009_split_007.html_add-action-menu)\n\
    \n*   [3.8 Complete Source Code of `JFXDrawTools` Class](#part0009_split_008.html_complete-source-codes-jfx-draw-tools)\n\
    \n*   [3.9 Summary](#part0009_split_009.html_summary)"
