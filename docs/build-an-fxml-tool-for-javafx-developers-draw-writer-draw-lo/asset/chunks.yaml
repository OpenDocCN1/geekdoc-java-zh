- fmt: "\n* `MenuBar`, `Menu`, and `MenuItem` are among fundamental JavaFX UI components,\
    \ resided in `javafx.scene.control` package, for designing compact look-and-feel\
    \ graphical user interfaces using less space.\n  (See sections: [Add `File` Menu\
    \ to Menu Bar](#part0009_split_001.html_add-file-menu), [Add `Save FXML` Submenu\
    \ to `File` Menu](#part0009_split_003.html_add-save-fxml-sub-menu), [Add `Open`\
    \ Submenu to `File` Menu](#part0009_split_005.html_add-open-sub-menu), [Add `Action`\
    \ Menu to Menu Bar](#part0009_split_007.html_add-action-menu))\n\n* `EventHandler<T\
    \ extends Event>`, an interface which extends `java.util.EventListener`, defines\
    \ a `handle(T` event) method to be invoked when the specified event happens.\n\
    \  (See [here](#part0009_split_001.html_create-file-menu-codes), [here](#part0009_split_003.html_save-all-set-on-action-codes),\
    \ [here](#part0009_split_005.html_load-fxml-set-on-action-codes), and [here](#part0009_split_007.html_create-menu-action-codes))\n\
    \n* `void setOnAction(EventHandler<ActionEvent> value)` method, provided in `MenuItem`\
    \ class, registers an `EventHandler` to be notified when `ActionEvent` occurs.\n\
    \  (See [here](#part0009_split_001.html_create-file-menu-codes), [here](#part0009_split_003.html_save-all-set-on-action-codes),\
    \ [here](#part0009_split_005.html_load-fxml-set-on-action-codes), and [here](#part0009_split_007.html_create-menu-action-codes))\n\
    \n* `accelerator` property, defined in `MenuItem` class, specifies a `KeyCombination`\
    \ to trigger an `ActionEvent` of a `MenuItem`.\n  (See [here](#part0009_split_003.html_create-menu-save-fxml-codes))\n\
    \n* `KeyCombination`, an abstract class resides in `javafx.scene.input` package,\
    \ defines static fields of type `KeyCombination.Modifier`, such as `CONTROL_DOWN`,\
    \ `META_DOWN`, `SHIFT_DOWN`, etc. which are useful in construction of `KeyCharacterCombination`\
    \ instances.\n  (See [here](#part0009_split_003.html_create-menu-save-fxml-codes))\n\
    \n* `KeyCharacterCombination`, resides in `javafx.scene.input` package, a direct\
    \ subclass of `javafx.scene.input.KeyCombination` for creating shortcuts to trigger\
    \ an `ActionEvent`.\n  (See [here](#part0009_split_003.html_create-menu-save-fxml-codes))\n\
    \n* `FileChooser` class extends `java.lang.Object` and resides in `javafx.stage`\
    \ package; it provides convenient methods to open/save files:\n\n```java\npublic\
    \ java.io.File showOpenDialog(Window ownerWindow)\n```\nShow a file open dialog\
    \ for navigating the local file system to select a file to open.\n\n```java\n\
    public java.io.File showSaveDialog(Window ownerWindow)\n```\nShow a file save\
    \ dialog for navigating the local file system to select a file to save.\n\n```java\n\
    public ObservableList<FileChooser.ExtensionFilter> getExtensionFilters()\n```\n\
    Get a list of `ExtensionFilter` for this `FileChooser`, and allow users to add\
    \ preferred filters for file extensions, such as `*.fxml`, `*.jpg`, etc.\n  (See\
    \ sections: [Add `Save FXML` Submenu to `File` Menu](#part0009_split_003.html_add-save-fxml-sub-menu),\
    \ [Add `Open` Submenu to `File` Menu](#part0009_split_005.html_add-open-sub-menu))\n\
    \n* `FileChooser.ExtensionFilter` class, defined in `javafx.stage.FileChooser`\
    \ class, specifies filters of file extensions for file dialogs of `FileChooser`.\n\
    \  (See [here](#part0009_split_003.html_create-menu-save-fxml-codes), and [here](#part0009_split_005.html_create-menu-load-codes))\n\
    \n* Classes from `javafx.beans.property` package:\n\n```java\nObjectProperty<T>\n\
    ```\nAn abstract class, which is derived from `javafx.beans.binding.ObjectExpression<T>`\
    \ class, implements `Property<T>` and `WritableObjectValue<T>`.\n\n```java\nSimpleObjectProperty<T>\n\
    ```\nA class derived from `ObjectProperty<T>` class.\n  (See sections: [Add `Save\
    \ FXML` Submenu to `File` Menu](#part0009_split_003.html_add-save-fxml-sub-menu),\
    \ [Bind Stage Title for Displaying FXML File Name](#part0009_split_006.html_bind-stage-title))\n\
    \n* `Property<T>` interface resides in `javafx.beans.property` package, and defines\
    \ methods common to all properties such as:\n\n```java\nvoid bind(ObservableValue<?\
    \ extends T> observable)\n```\nBind this property unidirectional to the given\
    \ `ObservableValue`.\n\n```java\nvoid unbind()\n```\nUnbind for this property.\n\
    \  (See section [Bind Stage Title for Displaying FXML File Name](#part0009_split_006.html_bind-stage-title))\n\
    \n* `StringBinding`, an abstract class that extends `StringExpression` class,\
    \ resides in `javafx.beans.binding` package. The abstract method, `String computeValue()`,\
    \ need be implemented in order to create an instance of `StringBinding`.\n  (See\
    \ section [Bind Stage Title for Displaying FXML File Name](#part0009_split_006.html_bind-stage-title))\n\
    \n# EPILOGUE\n\nThe authors are working on the rest of volumes of this book series,\
    \ and additional favorable tools for JavaFX developers are to be released one\
    \ by one soon. Let's have a sneak peek of coming features besides others revealed\
    \ in the PREFACE section:\n\n* Color palette tools\n* Image editing tools\n* More\
    \ interactive sketching tools: Free Hand Drawer, Rubber Band Drawer, Text Writer,\
    \ Color Gradienter, Arc Drawer, Cursor Key Mover, etc.\n* Path transition animater\n\
    * Dynamic context menu controller\n* Convenient shapes library\n* And more...\n\
    \nWish you a happy, healthy, and prosperous year of the Monkey.\n"
