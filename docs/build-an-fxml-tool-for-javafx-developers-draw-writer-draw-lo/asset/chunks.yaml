    ## Why Choose This Book

    This book is for software developers who are interested in developing GUIs using
    JavaFX library for rich client applications. Important features in JavaFX are
    illustrated by step-by-step development of real world Java applications. Instructive
    diagrams are used to help readers capture abstract concepts. All diagrams used
    in each chapter are created using the graphics tools developed in this book series.


    The book series is for you if you are:

    - A Java GUI programmer, novice or professional, who is new to JavaFX.

    - A Java programmer who has preliminary knowledge of JavaFX and would like to
    learn how to develop interactive sketch drawing tools.

    - A professional software engineer who is interested in the development of object
    oriented JavaFX graphics tools and practical applications, along with complete
    and well-documented source code.


    ## What You Need for This Book

    If you want to compile and run applications included in this book, you need to
    download and install JDK. Here''s the website to download JDK 8: [http://www.oracle.com/technetwork/java/javase/downloads/index.html](http://www.oracle.com/technetwork/java/javase/downloads/index.html).


    To copy the complete source code from this kindle e-Book suggestion:

    1. Install `Calibre`, a free and open source E book Management software, to your
    PC.

    2. Use `Add books` function in `Calibre` to add the `.mobi` file of the e-Book
    to `Calibre` library.

    3. Open the book from `Calibre` and copy the source code to Java files.


    # INTRODUCTION

    This book series is a tutorial for software developers to build GUIs of Java applications
    using JavaFX 8 which has become a part of Java™ SE Development Kit 8 (`JDK 8`).


    The primary objective of the book series is to provide a comprehensive handbook.
    The integration of JavaFX results in great convenience. Important features in
    JavaFX are illustrated by step-by-step development of real world Java applications.
    To compile and run applications included in this book, you need to download and
    install JDK. Here''s the website to download JDK 8: [http://www.oracle.com/technetwork/java/javase/downloads/index.html](http://www.oracle.com/technetwork/java/javase/downloads/index.html).


    ## JavaFX History

    Now let us glance through the timeline of JavaFX:

    - September 2005: Sun Microsystems developed a language called JavaFX.

    - May 2007: JavaFX renamed to JavaFX.

    - December 2008: JavaFX 1.0 released.

    - January 2010: Oracle completed the acquisition of Sun Microsystems.

    - October 2010: Oracle announced JavaFX would be discontinued.

    - October 2011: JavaFX 2.0 released.

    - February 2013: JavaFX 2.2 released.

    - March 18, 2014: JavaFX 8 released as part of Java™ SE Development Kit 8 (`JDK
    8`).

    - October 2015: JDK 8u66 released.

    - January 2016: JDK 8u72 released.

    - March 23, 2017: General availability (GA) for JDK 9.

