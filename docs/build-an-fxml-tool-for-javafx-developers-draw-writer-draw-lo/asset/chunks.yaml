    \ importInstruction(String data) {\n    return document.createProcessingInstruction(\"\
    import\", data);\n  }\n\n  /**\n   * 创建 Pane 作为场景图的根\n   * 将节点列表作为 Pane 的子节点\n\
    \   * 在初始化完成之前调用此方法\n   * 首先写入节点列表\n   * 写入 pane 的属性\n   * JFXDrawTools 使用（一个\
    \ map）存储应用程序数据，\n   * 如动态创建的 Animation 对象\n   */\n  void writeFXMLRootPane(Pane\
    \ root, List<? extends javafx.scene.Node> list) {\n    Element rootElm = document.createElement(\"\
    Pane\");\n    document.appendChild(rootElm);\n    // 写入属性：xmlns:fx=\"http://javafx.com/fxml\"\
    \n    rootElm.setAttribute(\"xmlns:fx\", \"http://javafx.com/fxml\");\n    //\
    \ 逐个写入列表中的节点\n    writeFXMLFigures(list, rootElm);\n    if (root != null) {\n\
    \      writeProperties(root, rootElm);\n    }\n  }\n\n  /**\n   * 遍历节点列表\n   */\n\
    \  void writeFXMLFigures(List<? extends javafx.scene.Node> list, Element rootElm)\
