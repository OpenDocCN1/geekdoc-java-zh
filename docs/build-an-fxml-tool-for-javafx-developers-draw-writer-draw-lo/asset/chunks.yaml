    \ Class\n\nFXML is a markup language which complies with the XML (Extensible Markup\
    \ Language) syntax, to construct GUIs of JavaFX applications without coding in\
    \ Java; for more information, refer to [Creating User Interfaces using FXML](#part0006_split_005.html_creating-ui-using-FXML)\
    \ in INTRODUCTION of this book.\n\nThe `DrawWriter` class, resided in `drawtool.io`\
    \ package, provides innovated APIs to write sketch, drawn dynamically on a drawing\
    \ board, to files in FXML format. In general, they are higher level APIs based\
    \ on utilities from these Java packages:\n\n```\njavax.xml.parsers\njavax.xml.transform\n\
    javax.xml.transform.dom\njavax.xml.transform.stream\norg.w3c.dom \n```\n\nIn addition\
    \ to FXML files, `DrawWriter` also writes images to files in png or gif format.\n\
    \nInitially, two utilities are provided in our `drawtool.io` package:\n\n`writeFXML`\n\
    \nWrite a `Pane` or a list of JavaFX `Node` objects to a file in FXML format.\n\
    \n`writeImageView`\n\nApply the `javax.imageio.ImageIO.write` method to write\
    \ the image of an `ImageView` object to an image file in png or gif format, taking\
    \ into account the viewing properties specified in the `ImageView` object, including\
    \ the transformations applied to.\n\nWithin this section, we'll describe in detail\
    \ the implementations of featured methods, defined in `DrawWriter` class:\n\n\
    1.  `public void writeFXML(Pane` pane`, File` file`)`\n\n2.  `public void writeFXML(List<?\
    \ extends javafx.scene.Node>` list`, File` file`)`\n\n3.  `public void writeImageView(ImageView`\
    \ iv`, File` file`)`\n\nBefore we engage in the coding process, let's have a sneak\
    \ peek of an FXML file generated by `writeFXML` utility:\n\nListing 1-1. Contents\
    \ of an FXML file generated from a program that employs `writeFXML` utility:\n\
