    />\n      </image>\n      <properties imageURL=\"file:/F:/My%20Documents/DocRoot/SHUFEN_JAVA/MyBook/JFXDrawTools1.2/src/example1/myfxml/TeaTree.jpg\"\
    />\n    </ImageView>\n  </children>\n</Pane>\n```\n\n编译并运行该应用程序。尝试以下步骤进行测试：\n\n\
    1.  点击 `Tools` 菜单，逐个选择菜单项，在绘板上执行 `MOUSE_PRESSED`-`MOUSE_DRAGGED`-`MOUSE_RELEASED`\
    \ 事件以绘制不同类型的形状。\n2.  点击 `File` 菜单项，点击 `Save FXML` 子菜单，并选择“Save All”菜单项，将绘板上渲染的草图保存为名为\
    \ `JFXDrawTools.fxml` 的默认文件。\n3.  点击 `File` 菜单项，点击 `Save FXML` 子菜单，并选择“Save All\
    \ As...”菜单项，从 `FileChooser` 中选择首选的文件名将绘板上渲染的草图保存。\n4.  从另一个命令行窗口重启 `JFXDrawTools\
    \ V1.2` 应用程序。\n5.  点击 `File` 菜单项，点击 `Open` 子菜单，并选择“Open Image...”菜单项以加载图像。\n6.\
    \  点击 `File` 菜单项，点击 `Open` 子菜单，并选择“Open FXML...”菜单项以加载之前保存的 FXML 文件。\n7.  使用任何绘制工具绘制更多节点，例如\
    \ `CIRCLE DRAWER`、`BEIER CURVE DRAWER` 等，然后保存为另一个 FXML 文件。\n8.  点击 `Action` 菜单项并选择“Clear\
    \ All”菜单项以清除绘板上的所有节点，然后将之前保存的 FXML 文件加载回绘板。\n\n在命令行编译并运行 `example1` 程序的程序的输出如下：\n\
