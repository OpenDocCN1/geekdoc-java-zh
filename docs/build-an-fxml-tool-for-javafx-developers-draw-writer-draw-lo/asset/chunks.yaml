  trans: "\n\n以下示例旨在为 JavaFX 初学者提供帮助，能够快速预览如何创建一个 JavaFX 应用程序。\n\n要开始学习，你需要创建一个继承\
    \ `javafx.application.Application` 的类，它是 JavaFX 程序的入口，并重写必须被覆盖的抽象 `start` 方法。以下是一个典型的\
    \ `start` 方法示例：\n\n```\n package imageviewer;\n\nimport javafx.application.Application;\n\
    import javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.StackPane;\n\
    import javafx.stage.Stage;\n\n/**\n * File Name: ImageViewer.java\n *\n * @author\
    \ Shufen Kuo\n */\n\npublic class ImageViewer extends Application {\n\n  @Override\n\
    \  public void start(Stage stage) {\n    BorderPane rootPane = new BorderPane();\n\
    \    StackPane imageArea = new StackPane();\n    rootPane.getChildren().add(imageArea);\n\
    \n    Scene scene = new Scene(rootPane, 600, 400); \n    stage.setTitle(\"ImageViewer\
    \ V1.0\");\n    stage.setScene(scene);\n    stage.show();\n  }\n\n  public static\
    \ void main(String[] args) {\n    launch(args);\n  }\n}\n```\n\n### Scene 和 Stage\n\
    \n在 `start` 方法中出现了两个重要的类：`Scene` 和 `Stage`。通常，主要任务是创建图形用户界面（GUI），这些界面在名为场景图（scene\
    \ graph）的分层树形结构中管理。将场景图的根节点与 `Scene` 对象关联，然后将场景放在 `Stage` 对象上。`Stage` 代表 JavaFX\
    \ 应用程序的顶层容器，作为场景图的窗口与应用程序用户进行交互。\n\n接下来的快照让你对我们将构建的 JavaFX 应用程序的 GUI 有一个初步概念：\n\
    \n图 1. JavaFX 应用程序快照。\n\n![](img/00006.jpeg \"javafx_app_guis.jpg\")\n\n### Nodes\n\
    \nJavaFX 引入了一个基础类 `javafx.scene.Node`，它继承自 `java.lang.Object`，并为所有可用用户界面提供了常用的属性和方法。我们经常使用“节点”（nodes）一词来指代\
    \ GUI。\n\n场景图可能包含各种类型的节点。节点要么是父节点（拥有子节点的节点），要么是叶节点（没有子节点的节点）；每个节点只能有一个父节点，而根节点没有父节点。场景图中的所有节点都派自\
    \ `javafx.scene.Node` 类。\n\n为了快速掌握场景图中节点类型的要点，我们将根据它们是否能够添加子节点来对其进行区分：\n\n*  \
    \ 你可以向这些节点添加子节点：\n    以下类被频繁地用作父节点：`Group`、`Pane` 以及内置布局面板（它们是 `Pane` 的直接子类）。通常，你调用\
    \ `getChildren()` 方法来获取类型为 `ObservableList<Node>` 的列表（它是 `java.util.List` 的子接口），然后使用\
    \ Java 开发者熟悉的 `Collection` 接口中定义的实用工具来操作列表内容。\n\n*   你不能向这些节点添加子节点：\n    以下类始终被用作叶节点：`Canvas`、`ImageView`、`MediaView`\
    \ 以及 `Shape` 的所有直接子类，例如 `Rectangle`、`Circle`、`Ellipse` 等。\n\n## JavaFX 和 Swing\n\
    \n现在，有一个有趣的问题。多年来，Java 开发者一直使用 Swing API（Java 基础类 JFC 的 GUI 组件）来构建 Java 应用程序的\
    \ GUI，为什么我们在 Swing 之外还需要 JavaFX 呢？\n\n如果你有大量用 Swing 编写的遗留代码并希望将 JavaFX 特性整合到 Swing\
    \ 代码中，JDK 8 提供了机制；反之，你也可以将 Swing 组件包含在 JavaFX 应用程序中。\n\n本书丛未涵盖 JavaFX-Swing 互操作性的话题。如果你对此主题感兴趣，请在此访问\
    \ Oracle 在线文档“JavaFX: Interoperability -- JavaFX-Swing Interoperability”：\n\n\
    [`docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm`](http://docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm)\n\
    \nJavaFX 是下一代 Java GUI。为了说明使用 JavaFX 能力的优势，除了 JavaFX 和 Swing 之间的互操作性外，我们在下面的章节中介绍了\
    \ JavaFX 的重要特性。\n\n## JavaFX 的精髓\n\nJavaFX 不仅允许你快速创建带有视觉用户界面的应用程序，还包含引人且独特的能力。它们列举如下：\n\
    \n### 内置布局面板\n\nJavaFX 的布局面板是容器，它们会自动对节点执行各种类型的放置。你可以在布局面板中放置任意数量的节点，布局面板本身也是一个节点，因此也可以嵌套在另一个布局面板中。使用布局面板的主要优势是避免手动指定每个节点的大小和位置的繁琐。由于场景图中的这些节点是在树形结构中管理的，布局算法会根据其布局类型和指定的布局属性递归地计算每个节点的大小和位置，并在窗口发生大小调整调整事件时动态触发重新计算。\n\
    \n共有 8 种内置布局面板，位于 `javafx.scene.layout` 包中：\n\n*   `BorderPane`\n    `BorderPane`\
    \ 将节点分别放置在五个位置，以创建主窗口的经典视觉效果：通常顶部区域用于菜单栏或工具栏，底部区域用于状态栏，左侧和右侧区域用于面板，中心区域用于工作区。\n\
    *   `HBox`\n    `HBox` 在行内水平排列节点。\n*   `VBox`\n    `VBox` 在列内垂直排列节点。\n*   `GridPane`\n\
    \    `GridPane` 在多行多列的网格中放置节点。对于显示一系列键值对属性的情况，这是一个实用的用户界面。\n*   `StackPane`\n\
    \    `StackPane` 将所有节点堆叠在中心（默认对齐方式），后创建的节点位于先创建节点之上。但你可以使用静态方法 `StackPane.setAlignment(Node`\
    \ child`, Pos` value)` 和 `StackPane.setMargin(Node` child`, Insets` value)` 来调整每个节点的位置。\n\
    *   `FlowPane`\n    你可以指定 `FlowPane` 的方向。对于水平 `FlowPane`，节点从左到右排列，在容器边界处换行。对于垂直\
    \ `FlowPane`，节点从上到下排列，在容器边界处换列。\n*   `TilePane`\n    `TilePane` 类似于 `FlowPane`，不同之处在于\
    \ `TilePane` 网格中的每个单元的大小相同。\n*   `AnchorPane`\n    `AnchorPane` 相对于其指定的锚点放置节点，共有四个锚点：`topAnchor`、`rightAnchor`、`bottomAnchor`\
    \ 和 `leftAnchor`。\n\n#### 参考 Oracle 在线文档“JavaFX 中的布局工作”：\n\n[`docs.oracle.com/javase/8/javafx/layout-tutorial/index.html`](http://docs.oracle.com/javase/8/javafx/layout-tutorial/index.html)\n\
    \n### 使用 CSS 进行自定义\n\nJavaFX 允许使用 CSS（层叠样式表）来描述应用程序用户界面的样式。使用 CSS 定义显示属性（如颜色、字体、边距、内边距、宽度、高度、线条、背景图像等）与应用程序源码分离，在许多方面显示了巨大的便利性：\n\
    \n*   软件提供者的自定义：\n    从同一组源码编译的应用程序可以具有多种样式，每种样式满足不同客户的需求。\n*   应用程序用户的自定义：\n\
    \    即使在软件发布后，如果应用程序用户对 GUI 的外观有偏好，在客户现场修改 CSS 文件中定义的显示属性也是可。\n*   样式设计者的益处：\n\
    \n"
- fmt: '

    The separation of application source code from definitions of presentation styles
    improves readability of code and simplifies the tasks for graphics designers by
    focusing on dealing with CSS only.


    ## Benefits for software developers:


    During the course of testing, developers may frequently change style attributes
    defined in CSS file in order to evaluate the variety looks of GUIs. If the application
    has to quit and restart again for each change, it is a very tiresome task. To
    facilitate this evaluation process, the best strategy is to design a makeshift
    `Load` button, and whenever any style attribute is changed, simply click on the
    button to re-load the CSS, there is no need to quit the application and restart
    it, thus saving tremendous time spending on testing.


    ## Similarity between CSS in JavaFX and CSS in HTML:


    The syntax of CSS in JavaFX is same as that of CSS in HTML, thus any designer
    has experience on CSS for browsers can do the styling for JavaFX application''s
    UIs with little learning effort.


    ### Reference to Oracle Online Documentation "Skinning JavaFX Applications with
    CSS":


    [http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/css_tutorial.htm](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/css_tutorial.htm)


    ## Creating User Interfaces using FXML


    FXML is a markup language which complies with the XML (Extensible Markup Language)
    syntax, with additional rules, for creating user interfaces of JavaFX applications.
    Considering hand coding FXML is error prone, a feasible approach is to generate
    FXML code by means of GUI builders.


    In this book series, we present a useful application `JFXDrawTools`, it''s sort
    of a GUI builder specifically for creating instances of subclasses derived from
    `Shape`. Users can interactively create a sketch, either a `Shape` or an `ImageView`,
    manipulate its properties and save the editing results to files in FXML format,
    the files can later be loaded back to continue the editing process, or be loaded
    by other JavaFX applications dynamically.


    It is considered a good programming practice to separate application''s GUIs (the
    View) from its business logic (the Model). The FXML file represents the view,
    while controller is a java class which passes information between view and model.
    Constructing GUIs using FXML enables application developers to adopt the MVC (Model-View-Controller)
    architecture effectively.


    ### Reference to Oracle Online Documentation "JavaFX: Mastering FXML":


    [http://docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html](http://docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html)


    ## Appealing Capacities of Properties and Binding


    The concept of Properties featured in JavaFX follows the design conventions introduced
    in the JavaBeans component, it usually works in connection with Binding mechanism,
    as a whole providing powerful yet sleek and succinct solutions to a variety of
    programming needs.


    In the `JFXDrawTools` application presented in this book series, we demonstrate
    the usage of Properties and Binding considerably. In the implementation of Properties
    Window, suitable UI controls, such as text field, choice box, combo box, etc.,
    are used for viewing the properties of a concerned object. Binding mechanism is
    employed to bi-directionally link the UI controls to their respective properties
    of the object, the relationship is set up as the Properties Window is about to
    show. When users changed data displayed in UI controls, the changes instantly
    reflect to the corresponding properties of the related object.


    ### Reference to Oracle Online Documentation "JavaFX: Properties and Binding Tutorial":


    [http://docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html](http://docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html)


    ## Sophisticated Mechanism of Transformations and Transitions


    The JavaFX build-in capacity of transformations for nodes are so convenient for
    developing graphics packages such as graphics editors, drawing tools, image viewing
    applications, GUI builders, etc.


    Here are the classes that have dealings with transformations: `Translate`, `Rotate`,
    `Scale` and `Shear`. They are all derived from `Transform` class and located in
    `javafx.scene.transform` package.


    The JavaFX transitions provide concise approaches for creating animations. There
    are a host of applications in need of animation features, here are some cases:
    to draw attention in an alert situation, to throw objects into recycle bin during
    the removing operation, to indicate intermediate state during a data loading,...


    In the `ImageViewer` application presented in this book series, we apply `FadeTransition`
    and `ParallelTransition` onto image objects in a slideshow function to fade in
    the new image and fade out the old image simultaneously.


    Here are the classes that have dealings with transitions: `FadeTransition`, `RotateTransition`,
    `ScaleTransition`, `TranslateTransition`, `FillTransition`, `StrokeTransition`,
    `PathTransition`, `ParallelTransition`, `SequentialTransition`, `PauseTransition`.
    They are all derived from `Transition` class, an abstract class defines basic
    functionality of animations, and located in `javafx.animation` package.


    ### Reference to Oracle Online Documentation "JavaFX: Transformations, Animations,
    and Visual Effects":


    [http://docs.oracle.com/javase/8/javafx/visual-effects-tutorial/index.html](http://docs.oracle.com/javase/8/javafx/visual-effects-tutorial/index.html)


    ## 2D Geometric Primitives and Text Are JavaFX Nodes


    JavaFX provides a `Shape` class which extends `javafx.scene.Node` class and is
    the superclass of basic forms of 2D geometry. The object-oriented concept imposed
    on the geometric primitives facilitates the development of graphics applications.


    Here are classes derived from `Shape` class: `Arc`, `Circle`, `CubicCurve`, `Ellipse`,
    `Line`, `Path`, `Polygon`, `Polyline`, `QuadCurve`, `Rectangle`, `SVGPath`, `Text`.
    Except the `Text` class, all the others are located in `javafx.scene.shape` package.


    Please note that `Text` class, located in `javafx.scene.text` package, considered
    a shape as well, powers the development of text drawing tools. All features common
    to JavaFX nodes can be applied to text objects. You handle it just like any geometric
    form. Text objects can be placed in a layout pane to utilize the automatic placement
    abilities, applying transformations and transitions, as well as customizing the
    presentation style using CSS, etc.


    ### Reference to Oracle Online Documentation "Using Text in JavaFX":


    [http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/text-settings.htm](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/text-settings.htm)


    ## Other Prominent Capabilities That Carry Out Many Complex Issues to Shorten
    Development Time


    * `ImageView` Class for Loading and Displaying Images


    The `ImageView` class which extends `javafx.scene.Node` is used along with `Image`
    class to load and display images. JavaFX also provides APIs for performing operations
    over bitmap images, `PixelReader` is the interface defines methods to read pixels
    from an `Image` object, while `PixelWriter` defines methods to write pixels to
    an `Image` object. All of these are located in `javafx.scene.image` package.


    ### Reference to Oracle Online Documentation "Using the Image Ops API":


    [http://docs.oracle.com/javase/8/javafx/graphics-tutorial/image_ops.htm](http://docs.oracle.com/javase/8/javafx/graphics-tutorial/image_ops.htm)


    * `WebView` Class for Managing Web Pages

    '
