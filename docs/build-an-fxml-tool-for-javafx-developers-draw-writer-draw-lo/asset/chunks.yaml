    \n### 1.1.1 `Document` and `Transformer`\n\nTo generate an FXML file from a program,\
    \ first we need prepare a DOM `Document`, and then use a `Transformer` to write\
    \ the `Document` to a physical file.\n\nWe need create a `DocumentBuilder` to\
    \ instantiate a `Document`, and a `TransformerFactory` to instantiate a `Transformer`.\n\
    \nThe `initMyFXMLDocument` method is defined to create a `Document` and a `Transformer`:\n\
    \nListing 1-2. Define `initMyFXMLDocument` method to create a `Document` and a\
    \ `Transformer`:\n\n```\npackage drawtool.io;\n\nimport javax.imageio.ImageIO;\n\
    import javax.xml.parsers.*;\nimport javax.xml.transform.*;\nimport javax.xml.transform.dom.*;\n\
    import javax.xml.transform.stream.*;\nimport org.w3c.dom.*;\n\npublic class DrawWriter\
    \ {\n  DocumentBuilderFactory documentBuilderFactory;\n  DocumentBuilder documentBuilder;\n\
    \  TransformerFactory transformerFactory;\n  Transformer transformer;\n  Document\
    \ document;\n  File fxmlFile;\n\n  void initMyFXMLDocument(File file) {\n    try\
    \ {\n      // only create once\n      if (documentBuilderFactory == null) {\n\
    \        documentBuilderFactory = DocumentBuilderFactory.newInstance();\n    \
    \    documentBuilder = documentBuilderFactory.newDocumentBuilder();\n        transformerFactory\
    \ = TransformerFactory.newInstance();\n        transformer = transformerFactory.newTransformer();\n\
    \        transformer.setOutputProperty(OutputKeys.METHOD, \"xml\");\n        transformer.setOutputProperty(OutputKeys.INDENT,\
    \ \"yes\");\n        transformer.setOutputProperty(\n            \"{http://xml.apache.org/xslt}indent-amount\"\
    , \"2\");\n      }\n      this.fxmlFile = file;\n      document = documentBuilder.newDocument();\
    \ // always create new doc\n    } catch (ParserConfigurationException e) {\n \
    \     System.out.println(e.getMessage());\n    } catch (TransformerConfigurationException\
    \ e) {\n      System.out.println(e.getMessage());\n    } \n  }\n\n  ...\n\n}\n\
    ```\n\n`DocumentBuilderFactory` and `DocumentBuilder` both reside in `javax.xml.parsers`\
    \ package. And a DOM `Document` object can be created using the `newDocument()`\
    \ method defined in `DocumentBuilder` class. Necessary methods for accessing information\
    \ inside a DOM document are defined in `org.w3c.dom.Document`, an interface that\
    \ extends `org.w3c.dom.Node`. To avoid confusing Java compiler, it's important\
    \ to differentiate `javafx.scene.Node` from `org.w3c.dom.Node` in your code.\n\
    \nHere are some methods, defined in `org.w3c.dom.Document`, utilized by our `DrawWriter`\
    \ class:"
