    import javafx.scene.image.ImageView;\nimport javafx.scene.paint.Color;\nimport\
    \ javafx.scene.SnapshotParameters;\nimport javax.imageio.ImageIO;\n```\n\n列表 1-14.\
    \ 定义 `writeImageView` 方法将 `ImageView` 写入图像文件：\n\n"
- fmt: "\n## 1.2 Create JavaFX Nodes in a Scene Graph using FXML\n\nWe will elaborate\
    \ on the usage of APIs provided in `draw.io` in `draw.io` package, which contains\
    \ `draw` class, when `File` is.\n\nIn this section, we'll introduce how to create\
    \ `Line`, `Polyline`, `Path`, etc. in JavaFX. We'll also show how to use `ImageView`\
    \ to display images in ` Chapter 2.\n\n### 1.2.1 Write an `ImageView` to a file\n\
    \nWrite the image of a `ImageView` to an image file. Instead of using image specified\
    \ in `image` property, we apply `snapshot` method to obtain an image, this is\
    \ to have image conform to transformation.\n\nThe image specified in `image` property\
    \ of `ImageView` is still the original image, not synchronized with transformation\
    \ applied. `Snapshot` the `ImageView` comes out an image conformed to transformation,\
    \ then, call `writeImage` to save the image to a file in supported image format.\n\
    \nImportant notes: this method also works fine if the `ImageView` comes with a\
    \ `clip` specified in its `clip` property.\n\n```java\npublic void writeImageView(ImageView\
    \ iv, File file) {\n  Bounds bP = iv.getBoundsInParent();\n  Double minX = bP.getMinX();\n\
    \  Double minY = bP.getMinY();\n  Double w = bP.getWidth();\n  double h = bP.getHeight();\n\
    \  Rectangle2D vp = new Rectangle2D(minX, minY, w, h);\n  SnapshotParameters parameters\
    \ = new SnapshotParameters();\n  parameters.setViewport(vp);\n  parameters.setFill(Color.TRANSPARENT);\n\
    \  Image image = iv.snapshot(parameters, null);\n  writeImage(image, file);\n\
    }\n```\n\nThis method is called from `writeImageView` to save image of `ImageView`\
    \ to an image file. Apply `ImageIO.write` method to write an JavaFX `Image` to\
    \ file. After testing, `ImageIO.write` only works for `png` and `gif` formats.\
    \ `ImageIO.write` does not work for these formats: `jpg`, `jpeg`, `bmp`.\n\nThis\
    \ method first check if the given file has extension matching preferred formats\
    \ (`png|gif`), if it doesn't match, concate default format (`.png`).\n\n```java\n\
    public File writeImage(Image img, File file) {\n  // check if the given file extension\
    \ matches preferred\n  // image format string : (png|gif)\n  String formatName\
    \ = getFormatName(file);\n  if (formatName == null) {\n    // the given file does\
    \ not ends with preferred image format\n    // use \"png\" as format\n    formatName\
    \ = \"png\"; // default format name\n    file = getImageFile(file, formatName);\n\
    \  }\n  writeFXImage(img, formatName, file);\n  return file;\n}\n```\n\nApply\
    \ `ImageIO.write` method to write an JavaFX `Image` to file. Note: `ImageIO.write`\
    \ cannot save `jpg`, `jpeg`, `bmp`.\n\n```java\nvoid writeFXImage(Image img, String\
    \ formatName, File imgFile) {\n  try {\n    boolean succeed = ImageIO.write(\n\
    \       SwingFXUtils.fromFXImage(img, null), formatName, imgFile);\n    if (!succeed)\n\
    \        System.out.println(\"ImageIO.write failed\");\n  } catch (IOException\
    \ e) {\n    System.out.println(e.getMessage());\n  }\n}\n```\n\nNote for Java\
    \ 8+, test if `jpg`,`jpeg`,`bmp` works. This method checks if file has preferred\
    \ extension: `png` or `gif`, if extension is not a preferred image format, return\
    \ `null`, otherwise return image format.\n\n```java\nString getFormatName(File\
    \ f) {\n  String formatName = null; // Initialize to null\n  // supported image\
    \ format in regular expression\n  //String reg = \"(png|gif|jpg|jpeg|bmp)\";\n\
    \  // It would be nice to support jpg format\n  // however,\n  // jpg, jpeg and\
    \ bmp not supported in ImagdIO.write\n  // bmp do nothing, jpg,jpeg wrong image\
    \ \n  String reg = \"(png|gif)\";\n  String s = f.getName();\n  int i = s.lastIndexOf('.');\n\
    \n  if (i > 0 && i < s.length() - 1) {\n    String ext = s.substring(i + 1).toLowerCase();\n\
    \      if (ext.matches(reg)) {\n        formatName = ext;\n    }\n  }\n  return\
    \ formatName;\n}\n```\n\nThis method is called from `writeImageView` method to\
    \ save the image of an `ImageView` to image file in preferred format. Replacing\
    \ file extension with given image format. If given file doesn't have any extension,\
    \ concat `.` and format name.\n\n```java\nFile getImageFile(File file, String\
    \ formatName) {\n  String s = file.getName();\n  int i = s.lastIndexOf('.');\n\
    \  if (i > 0 && i < s.length() - 1) {\n    // replace whatever extension the given\
    \ file has with .png\n    s = s.substring(0, i);\n    File p = file.getParentFile();\n\
    \    String c = s + \".\" + formatName;\n    return new File(p, c);\n  } else\
    \ {\n    // file extension not exist, concat one\n    return new File(file.getPath()\
    \ + \".\" + formatName);\n  }\n}\n```\n\n### 1.2.2 Create JavaFX Nodes in a Scene\
    \ Graph using FXML\n\nWe will elaborate on the usage of APIs provided in `draw.io`\
    \ in `draw.io` package, which contains `draw` class, when `File` is.\n\nIn this\
    \ section, we'll introduce how to create `Line`, `Polyline`, `Path`, etc. in JavaFX.\
    \ We'll also show how to use `ImageView` to display images in ` Chapter 2.\n\n\
    #### 1.2.2.1 Set `strokeDashArray` in FXML\n\nThe `strokeDashArray` property of\
    \ apply `snapshot` method to obtain an image, this is to have image conform to\
    \ transformation.\n\nThe image specified in `image` property of `ImageView` is\
    \ still the original image, not synchronized with transformation applied.\n\n\
    Important notes: this method also works fine if the `ImageView` comes with a `clip`\
    \ specified in its `clip` property.\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<Pane xmlns:fx=\"http://javafx.com/fxml\">\n  <children>\n    <Line\
    \ x1=\"120.0\" y1=\"120.0\" x2=\"360.0\" y2=\"360.0\">\n      <strokeDashArray>\n\
    \        <Double>16.0</Double>\n        <Double>8.0</Double>\n      </strokeDashArray>\n\
    \    </Line>\n  </children>\n</Pane>\n```\n\nA `Line` from above FXML is rendered\
    \ as below:\n\nFigure 1-9. Show dash line from above FXML.\n\n![](images/0015.jpg)\n\
    \n#### 1.2.2.2 Create `Polyline` for a Scene Graph\n\nThe following FXML markup\
    \ creates a `Pane` as root node of scene graph, and `Polyline` composed of 5 line\
    \ segments, given 6 points: (50.0, 20.0), (220.0, 170.0), (50.0, 320.0), (50.0,\
    \ 250.0), (140.0, 170.0), (50.0, 90.0).\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<Pane xmlns:fx=\"http://javafx.com/fxml\">\n  <children>\n    <Polyline>\n\
    \      <points>\n        <Double>50.0</Double>\n        <Double>20.0</Double>\n\
    \        <Double>220.0</Double>\n        <Double>170.0</Double>\n        <Double>50.0</Double>\n\
    \        <Double>320.0</Double>\n        <Double>50.0</Double>\n        <Double>250.0</Double>\n\
    \        <Double>140.0</Double>\n        <Double>170.0</Double>\n        <Double>50.0</Double>\n\
    \        <Double>90.0</Double>\n      </points>\n    </Polyline>\n  </children>\n\
    </Pane>\n```\n\nA `Polyline` from above FXML is rendered as below:\n\nFigure 1-10.\
    \ Show a polyline from above FXML markup.\n"
