    \ <LineTo x=\"158.0\" y=\"170.0\"/>\n        <LineTo x=\"180.0\" y=\"170.0\"/>\n\
    \        <LineTo x=\"190.0\" y=\"148.0\"/>\n        <LineTo x=\"212.0\" y=\"148.0\"\
    />\n        <LineTo x=\"223.0\" y=\"171.0\"/>\n        <LineTo x=\"242.0\" y=\"\
