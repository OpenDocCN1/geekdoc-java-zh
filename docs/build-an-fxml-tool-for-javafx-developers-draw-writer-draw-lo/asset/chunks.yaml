  trans: "\n\n`Element createElement(String tagName) throws DOMException`\n\n在 XML\
    \ 文档中创建一个元素。\n\n`ProcessingInstruction createProcessingInstruction(String target,\
    \ String data) throws DOMException`\n\n创建一个处理指令，例如 `import` 语句。\n\n我们还使用了继承自 `org.w3c.dom.Node`\
    \ 的 `appendChild(Node newChild)` 方法，向此节点添加一个子节点。\n\n### 1.1.2 `DOMSource` 和 `StreamResult`\n\
    \n`DOMSource` 类继承自 `java.lang.Object`，位于 `javax.xml.transform.dom` 包中。`StreamResult`\
    \ 类继承自 `java.lang.Object`，位于 `javax.xml.transform.stream` 包中。\n\n当一个 DOM `Document`\
    \ 准备好写入物理文件时，我们通过向其构造函数传递一个 DOM `Document` 来创建一个 `DOMSource` 对象，并通过向其构造函数传递一个\
    \ `File` 来创建一个 `StreamResult` 对象。然后，使用 `Transformer` 将源（即 `Document`）转换为目标（即 `File`）。以下是实现这些操作的源代码：\n\
    \n列表 1-3. 定义 `writeMyFXMLDocument` 方法将 `Document` 写入 `File`：\n\n```\n void writeMyFXMLDocument()\
    \ {\n    try {\n      DOMSource source = new DOMSource(document);\n      StreamResult\
    \ result = new StreamResult(fxmlFile);\n      transformer.transform(source, result);\n\
    \    } catch (TransformerException e) {\n      System.out.println(e.getMessage());\n\
    \    }\n  }\n```\n\n### 1.1.3 实现 `writeFXML` 方法\n\n`DrawWriter` 类提供了两个 `writeFXML`\
    \ 方法用于将 JavaFX 节点写入 FXML 文件，其中一个接受 `Node` 列表，另一个接受一个 `Pane`：\n\n1. `public void\
    \ writeFXML(Pane pane, File file)`\n\n   递归地将 `pane` 的子节点写入 FXML 格式的文件，并以 `<Pane>`\
    \ 元素作为 `Document` 的根节点。\n\n2. `public void writeFXML(List<? extends javafx.scene.Node>\
    \ list, File file)`\n\n   将 JavaFX `Node` 列表写入 FXML 格式的文件，并以 `<Pane>` 元素作为 `Document`\
    \ 的根节点。\n\n在此阶段，我们重点关注这些类型的节点——`Shape`、`ImageView`——以满足形状构建器 JFXDrawTools V1.2\
    \ 应用的需求，该将在将在后续章节中讨论。然而结构是可扩展的，允许你轻松地量添加代码以支持其他类型的节点。\n\n以下是定义 `writeFXML` 方法的代码片段\n\
    \n列表 1-4. 在 `DrawWriter` 类中定义 `writeFXML` 方法，向其传递一个 `Pane` 和一个 `File`：\n\n```\n\
    \ public void writeFXML(Pane pane, File file) {\n    // 如果 pane 没有子节点，\n    //\
    \ 仍然会创建一个包含 <pane> 节点的 FXML 文件，\n    // 内部没有子节点\n    initMyFXMLDocument(file);\n\
    \    writeFXMLHeader();\n    writeFXMLRootPane(pane, pane.getChildren());\n  \
    \  writeMyFXMLDocument();\n  }\n```\n\n列表 1-5. 在 `DrawWriter` 类中定义 `writeFXML`\
    \ 方法，向其传递一个 `List` 和一个 `File`：\n\n```\n public void writeFXML(List<? extends javafx.scene.Node>\
    \ list, File file)  {\n    // 如果 list 为空或为空，\n    // 仍然会创建一个包含 <pane> 节点的 FXML\
    \ 文件，\n    // 内部没有子节点\n    initMyFXMLDocument(file);\n    writeFXMLHeader();\n\
    \    writeFXMLRootPane(null, list);\n    writeMyFXMLDocument();\n  }\n```\n\n\
    #### 1.1.3.1 组合 DOM 文档的内容\n\n我们已经描述了如何创建 DOM `Document`、如何将其写入物理文件，以及如何访问 DOM\
    \ `Document` 内部的信息。现在让我们探索符合 FXML 格式的组合 DOM `Document` 内容的过程。\n\n在写入根节点之前，我们需要使用\
    \ `createProcessingInstruction` 方法为 Java `import` 语句写入处理指令。\n\n列表 1-6. 定义 `writeFXMLHeader`\
    \ 方法以为 Java `import` 语句写入处理指令：\n\n```\n void writeFXMLHeader() {    \n    document.appendChild(importInstruction(\"\
    java.lang.*\"));\n    document.appendChild(importInstruction(\"java.util.*\"));\n\
    \    document.appendChild(importInstruction(\"javafx.animation.*\"));\n    document.appendChild(importInstruction(\"\
    javafx.animation.PathTransition.*\"));\n    document.appendChild(importInstruction(\"\
    javafx.geometry.*\"));\n    document.appendChild(importInstruction(\"javafx.scene.Group\"\
    ));\n    document.appendChild(importInstruction(\"javafx.scene.control.*\"));\n\
    \    document.appendChild(importInstruction(\"javafx.scene.effect.*\"));\n   \
    \ document.appendChild(importInstruction(\"javafx.scene.image.*\"));\n    document.appendChild(importInstruction(\"\
    javafx.scene.layout.*\"));\n    document.appendChild(importInstruction(\"javafx.scene.paint.*\"\
    ));\n    document.appendChild(importInstruction(\"javafx.scene.shape.*\"));\n\
    \    document.appendChild(importInstruction(\"javafx.scene.text.*\"));\n    document.appendChild(importInstruction(\"\
    javafx.scene.transform.*\"));\n    document.appendChild(importInstruction(\"javafx.util.*\"\
    ));\n  }\n\n  ProcessingInstruction importInstruction(String data) {\n    return\
    \ document.createProcessingInstruction(\"import\", data);\n  }\n```\n\n生成的文档头将如下所示：\n\
    \n列表 1-7. 文档头部：\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"\
    no\"?>\n<?import java.lang.*?>\n<?import java.util.*?>\n<?import javafx.animation.*?>\n\
    <?import javafx.animation.PathTransition.*?>\n<?import javafx.geometry.*?>\n<?import\
    \ javafx.scene.Group?>\n<?import javafx.scene.control.*?>\n<?import javafx.scene.effect.*?>\n\
    <?import javafx.scene.image.*?>\n<?import javafx.scene.layout.*?>\n<?import javafx.scene.paint.*?>\n\
    <?import javafx.scene.shape.*?>\n<?import javafx.scene.text.*?>\n<?import javafx.scene.transform.*?>\n\
    <?import javafx.util.*?>\n```\n\n请注意，处理指令存在一个问题。在实际文件中，每个指令后没有换行，因此你会看到所有处理指令都在同一行，最后附加根节点\
    \ `<Pane>`。\n\n在添加处理指令后，执行以下操作：\n\n1. 创建 `<Pane>` 元素，作为根节点添加到文档。\n\n2. 创建 `<children>`\
    \ 元素，添加到 `<Pane>` 元素。\n\n3. 根据 `javafx.scene.Node` 列表中的顺序，为 `Pane` 的子节点创建元素，并逐个添加到\
    \ `<children>` 元素。\n\n`writeFXMLRootPane` 方法用于完成这些任务：\n\n列表 1-8. 定义 `writeFXMLRootPane`\
    \ 方法逐个写入节点，作为根节点 `<Pane>` 的后代添加：\n\n```\n void writeFXMLRootPane(Pane root, List<?\
    \ extends javafx.scene.Node> list) {\n    Element rootElm = document.createElement(\"\
