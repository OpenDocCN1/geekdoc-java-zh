    \ of `javafx.scene.Node`, append one by one to element `<children>`.\n\nThe `writeFXMLRootPane`\
    \ method is defined to accomplish these tasks:\n\nListing 1-8. Define `writeFXMLRootPane`\
    \ method to write nodes one by one, append as descendant of root node `<Pane>`:\n\
    \n```\n void writeFXMLRootPane(Pane root, List<? extends javafx.scene.Node> list)\
    \ {\n    Element rootElm = document.createElement(\"Pane\");\n    document.appendChild(rootElm);\n\
    \    // Write attribute:\n    //   xmlns:fx=\"http://javafx.com/fxml\"\n    rootElm.setAttribute(\"\
    xmlns:fx\", \"http://javafx.com/fxml\");\n    // Write nodes in list one by one\n\
    \    writeFXMLFigures(list, rootElm);\n    if (root != null) {\n      writeProperties(root,\
    \ rootElm);\n    }\n  }\n```\n\nThe above method, first create an element `<Pane>`\
    \ as the root node of a document, then call the `writeFXMLFigures` method, a recursive\
    \ function, to create elements for JavaFX nodes as descendant of element `<Pane>`.\n\
    \nListing 1-9. Define `writeFXMLFigures` method to create an element `<children>`,\
    \ append to element `<pane>`, root node of document, and append nodes one by one\
    \ to element `<children>`:\n"
