  trans: "\n\n- 1.2.3 在 FXML 中创建箭头形状的 `Polygon`\n- 1.2.4 在 FXML 中创建汉字形状的 `Path`\n\
    - 1.2.5 在 FXML 中根据 `M`, `H`, `Q`, `L` 指令创建 `SVGPath`\n- 1.2.6 在 FXML 中创建由 `RadialGradient`\
    \ 填充的 `Rectangle`\n- 1.2.7 在 FXML 中创建由 `LinearGradient` 填充的 `Circle`\n- 1.2.8\
    \ 在 FXML 中创建带有 `Transform` 和 `Effect` 的 `Ellipse`\n- 1.2.9 在 FXML 中创建绘制如彩虹的 `Arc`\n\
    - 1.2.10 在 FXML 中创建带有视觉效果和倾切变换的 `Text`\n- 1.2.11 从形状生成器生成 FXML 文件\n- 1.3 `DrawWriter`\
    \ 类的完整源代码\n- 1.4 总结\n\n## 1.1 创建 `DrawWriter` 类\n\nFXML 是一种符合 XML（可扩展标记语言）语法的标记语言，用于在不编写\
    \ Java 代码的情况下构建 JavaFX 应用程序的 GUI；更多信息，请参考本书“引言”部分中的使用 FXML 创建用户界面。\n\n`DrawWriter`\
    \ 类位于 `drawtool.io` 包中，提供了创新的 API，将在画板上动态绘制的草图写入 FXML 格式的文件。通常情况下，它们是基于这些 Java\
    \ 包中的工具类的高级 API：\n\n```\njavax.xml.parsers\njavax.xml.transform\njavax.xml.transform.dom\n\
    javax.xml.transform.stream\norg.w3c.dom \n```\n\n除了 FXML 文件外，`DrawWriter` 还可以将图像写入\
    \ png 或 gif 格式的文件。\n\n最初，在我们的 `drawtool.io` 包中提供了两个工具类：\n\n`writeFXML`\n\n将 `Pane`\
    \ 或 JavaFX `Node` 对象列表写入 FXML 格式的文件中。\n\n`writeImageView`\n\n应用 `javax.imageio.ImageIO.write`\
    \ 方法将 `ImageView` 对象的图像写入 png 或 gif 格式的图像文件，该方法会考虑在 `ImageView` 对象中指定的视图属性，包括应用在其上的变换。\n\
    \n在本节中，我们将详细描述在 `DrawWriter` 类中定义的特色方法的实现：\n\n1. `public void writeFXML(Pane pane,\
    \ File file)`\n2. `public void writeFXML(List<? extends javafx.scene.Node> list,\
    \ File file)`\n3. `public void writeImageView(ImageView iv, File file)`\n\n在开始编码过程之前，让我们先预览一下由\
    \ `writeFXML` 工具类生成的 FXML 文件：\n\n列表 1-1. 使用 `writeFXML` 工具类的程序生成的 FXML 文件的内容：\n\
    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<?import\
    \ java.lang.*?>\n<?import java.util.*?>\n<?import javafx.animation.*?>\n<?import\
    \ javafx.animation.PathTransition.*?>\n<?import javafx.geometry.*?>\n<?import\
    \ javafx.scene.Group?>\n<?import javafx.scene.control.*?>\n<?import javafx.scene.effect.*?>\n\
    <?import javafx.scene.image.*?>\n<?import javafx.scene.layout.*?>\n<?import javafx.scene.paint.*?>\n\
    <?import javafx.scene.shape.*?>\n<?import javafx.scene.text.*?>\n<?import javafx.scene.transform.*?>\n\
    <?import javafx.util.*?>\n<Pane xmlns:fx=\"http://javafx.com/fxml\">\n  <children>\n\
    \    <Ellipse centerX=\"280.0\" centerY=\"80.0\" fill=\"#00000000\" fx:id=\"Ellipse_349826\"\
    \n      radiusX=\"20.0\" radiusY=\"6.0\" stroke=\"#006400\" translateX=\"-73.0\"\
    \ translateY=\"-20.0\"/>\n    <Ellipse centerX=\"280.0\" centerY=\"200.0\" fill=\"\
    #00000000\" fx:id=\"Ellipse_10fd2df\"\n      radiusX=\"40.0\" radiusY=\"12.0\"\
    \ stroke=\"#006400\" translateX=\"-73.0\" translateY=\"-20.0\"/>\n    <Path fx:id=\"\
    Path_1b6f0eb\" stroke=\"#1E90FF\" translateX=\"-73.0\" translateY=\"-20.0\">\n\
    \      <elements>\n        <MoveTo x=\"300.0\" y=\"80.0\"/>\n        <LineTo x=\"\
