- fmt: "\nWe set an image, `/resource/MyLogoIcon_1_2.png`, as the minimized icon of\
    \ application's window. The icon is also a part of window decorations. Here's\
    \ a snippet of code from above listing:\n\n### Listing 3-10. Set minimized icon\
    \ of application's window:\n\n```java\n String iconName = \"/resource/MyLogoIcon_1_2.png\"\
    ;\n    Image iconImage = new Image(getClass().getResourceAsStream(\n        iconName));\n\
    \    stage.getIcons().add(iconImage);\n```\n\nHere's the image:\n\n### Figure\
    \ 3-8. The Image used as minimized icon of application's window.\n\n![](images/00036.jpeg\
    \ \"MyLogoIcon_1_2.png\")\n\nIf you are a developer interested in compiling this\
    \ program successfully, you can either replace the icon image with the one you\
    \ prefer, or extract the image file, `MyLogoIcon_1_2.png`, from HTML files of\
    \ this e-Book to a directory named `resource`. The `resource` directory should\
    \ be inside the directory where you put the `drawtool` package.\n\nHere's a suggestion\
    \ regarding converting `.mobi` format of an e-Book to HTML:\n\n1. Install `Calibre`,\
    \ a free and open source E book Management software, to your PC.\n2. Use `Add\
    \ books` function in `Calibre` to add the `.mobi` file of this e-Book to `Calibre`\
    \ Library.\n3. Use `Convert books` function in `Calibre`, select `HTMLZ` as output\
    \ format, click `OK` button to proceed to the conversion.\n4. When the conversion\
    \ completes, you'll get an output file with extension `.htmlz`. Rename the extension\
    \ to be `.zip` and unzip the file, you'll get one large HTML file with a directory\
    \ named `images` containing all image files that are linked within contents of\
    \ the HTML file.\n\n   If you are using Windows 8, the `.htmlz` output file is\
    \ stored in a sub directory of this directory:\n\n   ```\nC:\\Users\\<User Name>\\\
    Documents\\Calibre Library\n```\n\nFollowings are snapshots of `JFXDrawTools V1.2`\
    \ application which draws shapes on top of an image, and then save them to an\
    \ FXML file, [MySketch.fxml](#part0009_split_008.html_my-sketch-fxml), in directory:\n\
    \n`JFXDrawTools1.2/src/example1/myfxml/`\n\n### Figure 3-9. Load an image as background,\
    \ draw some shapes, and save all to an FXML file named MySketch.fxml, using `JFXDrawTools\
    \ V1.2` application.\n\n![](images/00037.jpeg \"my_sketch.jpg\")\n\n### Figure\
    \ 3-10. Open an FXML file MySketch.fxml previously saved, and continue editing,\
    \ using `JFXDrawTools V1.2` application.\n\n![](images/00038.jpeg \"my_sketch_house.jpg\"\
    )\n\nHere are the contents of FXML file, `MySketch.fxml`, saved for Figure 3-10.\n\
    \n### Listing 3-11. Contents of MySketch.fxml file saved for Figure 3-10:\n"
