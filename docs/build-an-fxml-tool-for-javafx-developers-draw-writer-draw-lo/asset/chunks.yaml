  trans: "\n\n![](img/00016.jpeg \"example_polyline.jpg\")\n\n### 1.2.3 在 FXML 中创建箭头形状的\
    \ `Polygon`\n\n下面的列表显示了 FXML 标记，它创建一个 `Pane` 作为场景图的根节点，以及一个由 6 个线段组成的 `Polygon`，给定了\
    \ 6 个点：(50.0, 20.0), (220.0, 170.0), (50.0, 320.0), (50.0, 250.0), (140.0, 170.0),\
    \ (50.0, 90.0)。\n\n列表 1-17. 给定 6 个点创建一个由 6 个线段组成的 `Polygon`：\n\n```xml\n<?xml\
    \ version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<?import java.lang.*?>\n\
    <?import javafx.scene.layout.*?>\n<?import javafx.scene.shape.*?>\n<Pane xmlns:fx=\"\
    http://javafx.com/fxml\">\n  <children>\n        <Polygon fill=\"#B3E6E6\" stroke=\"\
    #000000\">\n          <points>\n            <Double fx:value=\"50.0\"/>\n    \
    \        <Double fx:value=\"20.0\"/>\n            <Double fx:value=\"220.0\"/>\n\
    \            <Double fx:value=\"170.0\"/>\n            <Double fx:value=\"50.0\"\
    />\n            <Double fx:value=\"320.0\"/>\n            <Double fx:value=\"\
    50.0\"/>\n            <Double fx:value=\"250.0\"/>\n            <Double fx:value=\"\
    140.0\"/>\n            <Double fx:value=\"170.0\"/>\n            <Double fx:value=\"\
    50.0\"/>\n            <Double fx:value=\"90.0\"/>\n          </points>\n     \
    \   </Polygon>\n      </children>\n</Pane>\n```\n\n来自上述 FXML 标记的 `Polygon` 渲染结果如下：\n\
    \n图 1-11. 显示上述 FXML 标记中箭头形状的多边形。\n\n![](img/00017.jpeg \"example_polygon.jpg\"\
    )\n\n### 1.2.4 在 FXML 中创建形成汉字的 `Path`\n\n下面的列表显示了 FXML 标记，它创建一个 `Pane` 作为场景图的根节点，以及一个由\
    \ `MoveTo`、`HLineTo`、`QuadCurveTo` 和 `LineTo` 组成的 `Path`。绘制该路径需要 3 笔画，其中第一笔画的终点是第二笔画的起点，第二笔画的终点是第三笔画的起点。\n\
    \n列表 1-18. 创建一个由 4 个 `PathElement` 组成的 `Path`（总共 3 笔画）：\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<?import javafx.scene.layout.*?>\n\
    <?import javafx.scene.shape.*?>\n<Pane xmlns:fx=\"http://javafx.com/fxml\">\n\
    \  <children>\n        <Path stroke=\"#A0522D\" strokeLineCap=\"ROUND\" strokeLineJoin=\"\
    BEVEL\"\n              strokeWidth=\"8.0\">\n          <elements>\n          \
    \  <MoveTo x=\"120.0\" y=\"87.0\"/>\n            <HLineTo x=\"195.0\"/>\n    \
    \        <QuadCurveTo controlX=\"36.0\" controlY=\"201.0\" x=\"205.0\" y=\"170.0\"\
    />\n            <LineTo x=\"209.0\" y=\"149.0\"/>\n          </elements>\n   \
    \     </Path>\n      </children>\n</Pane>\n```\n\n来自上述 FXML 标记的 `Path` 渲染结果如下：\n\
    \n图 1-12. 显示上述 FXML 标记中的路径；它是一个由 3 笔画组成的汉字“乙”。\n\n![](img/00018.jpeg \"example_path_2.jpg\"\
    )\n\n请注意，`<path>` 元素内呈现的四个属性会在路径上产生不同的视觉效果：\n\n`stroke`\n\n指定一种颜色来绘制形状的边界。对于路径来说，默认值为\
    \ `Color.BLACK`。\n\n`strokeWidth`\n\n指定描边宽度。\n\n`strokeLineCap`\n\n指定线的末端帽样式，其有效值之一为：`BUTT`、`ROUND`\
    \ 和 `SQUARE`。默认值为 `SQUARE`。\n\n`strokeLineJoin`\n\n指定线之间的连接样式，其有效值之一为：`BEVEL`、`MITER`\
    \ 和 `ROUND`。默认值为 `MITER`。\n\n下面的图说明了 `strokeLineCap` 和 `strokeLineJoin` 如何影响线的视觉渲染：\n\
    \n图 1-13. 分在 `strokeLineCap` 和 `strokeLineJoin` 上设置了不同属性的 3 个 `Path` 对象。\n\n![](img/00019.jpeg\
    \ \"path_3_text.jpg\")\n\n这里是创建上述渲染的 3 个 `Path` 对象的 FXML 标记。\n\n列表 1-19. 创建一个由\
    \ 4 个 `PathElement` 组成的 `Path`（总共 3 笔画）：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\" standalone=\"no\"?>\n<?import javafx.scene.layout.*?>\n<?import javafx.scene.shape.*?>\n\
    <Pane xmlns:fx=\"http://javafx.com/fxml\">\n  <children>\n        <Path stroke=\"\
    #A0522D\" strokeLineCap=\"ROUND\" strokeLineJoin=\"BEVEL\"\n              strokeWidth=\"\
    8.0\">\n          <elements>\n            <MoveTo x=\"120.0\" y=\"87.0\"/>\n \
    \           <HLineTo x=\"195.0\"/>\n            <QuadCurveTo controlX=\"36.0\"\
    \ controlY=\"201.0\" x=\"205.0\" y=\"170.0\"/>\n            <LineTo x=\"209.0\"\
    \ y=\"149.0\"/>\n          </elements>\n        </Path>\n      </children>\n</Pane>\n\
    ```\n\n### 1.2.5 使用 `M`、`H`、`Q`、`L` 指令创建 `SVGPath`\n\n现在，我们将使用列表 1-18 中相同的示例来演示\
    \ `SVGPath`。这里的 FXML 标记使用 `SVGPath` 创建了与图 1-12 所示相同的形状。\n\n列表 1-20. 创建 `SVGPath`\
    \ 以产生与图 1-12 相同的形状：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"\
    no\"?>\n<?import javafx.scene.layout.*?>\n<?import javafx.scene.shape.*?>\n<Pane\
    \ xmlns:fx=\"http://javafx.com/fxml\">\n  <children>\n        <SVGPath content=\"\
    M 120 87 H 195 Q 36 201 205 170 L 209 149\"\n          fill=\"#00000000\" stroke=\"\
    #A0522D\"\n          strokeLineCap=\"ROUND\" strokeLineJoin=\"BEVEL\" strokeWidth=\"\
    8.0\">\n        </SVGPath>\n      </children>\n</Pane>\n```\n\n`<SVGPath>` 元素内的\
    \ `content` 属性以 `String` 形式指定路径数据。在我们的示例中，使用了以下指令：`M`（移动）、`H`（水平线到）、`Q`（二次贝塞尔曲线到）、`L`（线到）。\n\
    \n### 1.2.6 在 FXML 中创建填充径向渐变的 `Rectangle`\n\n下面的列表显示了 FXML 标记，它创建了一个 `Pane` 作为场景图的根节点，并创建了一个\
    \ `Rectangle` 作为其子节点。`arcWidth` 和 `arcHeight` 属性指定了圆角矩形四个角圆弧的尺寸。并创建了一个 `RadialGradient`\
    \ 实例来填充矩形的内部。\n\n"
- fmt: "\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<?import\
    \ javafx.scene.layout.*?>\n<?import javafx.scene.paint.RadialGradient?>\n<?import\
    \ javafx.scene.paint.Stop?>\n<?import javafx.scene.shape.*?>\n<Pane xmlns:fx=\"\
    http://javafx.com/fxml\">\n  <children>\n    <Rectangle x=\"88.0\" y=\"66.0\"\
    \ width=\"268.0\" height=\"148.0\" stroke=\"#0000ff\"\n         arcWidth=\"67\"\
    \ arcHeight=\"62\" strokeWidth=\"1.0\">\n      <fill>\n        <RadialGradient\
