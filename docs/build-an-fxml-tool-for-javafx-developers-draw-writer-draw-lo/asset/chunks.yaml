    # JavaFX Web Engine 组件


    JavaFX 架构中嵌入了一个 引擎组件，它位于 `javafx.scene.web` 包中，提供了一系列 API，用于开发具有网页浏览器功能的应用程序。


    要查看网页，首先需要创建一个 `WebView` 对象（该对象继承自 `javafx.scene.Parent` 并继承了节点的所有特性），然后获取与之关联的
    `WebEngine`。`WebEngine` 提供了与操作网页相关的方法，例如：加载/显示网页（通过给定的 URL 或页面内容）、访问由 `WebEngine`
    为已加载的网页创建的文档对象模型 (DOM)、处理从 JavaScript 触发的各种事件等。


    ## 引用 Oracle 在线文档“JavaFX: Adding HTML Content to JavaFX Applications”


    [http://docs.oracle.com/javase/8/javafx/embedded-browser-tutorial/index.html]


    ## HTML 编辑能力


    ### 用于编辑 HTML 页面的 HTMLEditor 类


    对 HTML 编辑能力的完整支持来自 `HTMLEditor` 类，该类继承自 `javafx.scene.control.Control` 并位于 `javafx.scene.web`
    包中。要在 JavaFX 应用程序中嵌入 HTML 编辑器，你只需创建 `HTMLEditor` 的实例，将其添加到场景图中，然后它就可以与用户进行交互了。


    以下两个方法用于获取和设置编辑器的 HTML 内容：`getHtmlText()` 和 `setHtmlText(java.lang.String htmlText)`。


    与处理多行纯文本的类似控件 `TextArea` 不同，`HTMLEditor` 格式化的是符合 HTML 语法的文本。


    HTML 编辑器的用法在各个软件领域被广泛需要，例如：

    - 博客作者撰写发布（内容管理系统）

    - 邮件系统用户编写消息（消息系统）

    - 在线卖家为上架准备产品描述（电子商务管理系统）


    ## 引用 Oracle 在线文档“JavaFX: Working with JavaFX UI Components -- HTML Editor”


    [http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm]


    ## 用于渲染数据的图表组件


    以下类位于 `javafx.scene.chart` 包中，用于绘制各种类型的图表：

    - `AreaChart`, `StackedAreaChart`

    - `BarChart`, `StackedBarChart`

    - `BubbleChart`

    - `LineChart`

    - `PieChart`

    - `ScatterChart`


    `Chart` 类是所有图表组件的基类，它继承自 `javafx.scene.layout.Region` 类，因此继承了 `javafx.scene.Node`
    类的所有适用特性。


    ## 引用 Oracle 在线文档“JavaFX: Working with JavaFX UI Components -- Working with JavaFX
    Charts”


    [http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm]


    ## 用于播放媒体的 MediaView 类


    `MediaView` 类继承自 `javafx.scene.Node`，与 `MediaPlayer` 和 `Media` 类一起使用，在 JavaFX
    应用程序中播放媒体。所有与媒体相关的类都位于 `javafx.scene.media` 包中。


    ## 引用 Oracle 在线文档“JavaFX: Incorporating Media Assets Into JavaFX Applications”


    [http://docs.oracle.com/javase/8/javafx/media-tutorial/]


    # JavaFX 基础 UI 组件


    除了上述的 JavaFX 核心外，JavaFX 还提供了位于 `javafx.scene.control` 包中的基础 UI 组件。这些组件派生自 `javafx.scene.control.Control`
    类，通常称为 UI 控件。


    以下是可用的 UI 控件（未标记星号 `*` 的控件在 Swing 中有对应的控件）：

    - `Label`, `Button`, `RadioButton`, `ToggleButton`

    - `CheckBox`, `ChoiceBox`

    - `ComboBox`, `ListView`, `TableView`

    - `TextField`, `TextArea`, `PasswordField`, `HTMLEditor`

    - `ScrollBar`, `ScrollPane`, `Slider`, `ProgressBar`, `ProgressIndicator`, `ToolBar`

    - `MenuBar`, `MenuButton`, `SplitMenuButton`

    - `ColorPicker`, `DatePicker`, `Separator`, `Pagination`, `SplitPane`, `TitledPane`,
    `Accordion`, `TreeView`, `TreeTableView`, `Hyperlink`


    以下 UI 组件通常与上述 UI 控件处于同一类：

    - `Tooltip`：位于 `javafx.scene.control` 包，但派生自 `javafx.scene.control.PopupControl`
    类。

    - `MenuItem`, `Menu`, `CheckMenuItem`, `RadioMenuItem`：位于 `javafx.scene.control`
    包。继承自 `java.lang.Object` 的 `MenuItem` 是另外三个类的基类。

    - `FileChooser`：位于 `javafx.stage` 包并继承自 `java.lang.Object`。


    ## 引用 Oracle 在线文档“JavaFX: Working with JavaFX UI Components”


    [http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/ui.htm]


