    \  } catch (ParserConfigurationException e) {\n      System.out.println(e.getMessage());\n\
    \    } catch (TransformerConfigurationException e) {\n      System.out.println(e.getMessage());\n\
    \    }\n  }\n\n  void writeMyFXMLDocument() {\n    try {\n      DOMSource source\
