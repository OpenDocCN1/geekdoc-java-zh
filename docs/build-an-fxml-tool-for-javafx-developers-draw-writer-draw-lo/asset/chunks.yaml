    \nimages/00013.jpg\n\n现在，让我们来说明设置 `Path` 为 clip 的 `ImageView` 边界矩形：\n\n图 8. 显示设置\
    \ clip 的 `ImageView` 及其边界矩形。\n\n这里是 `ImageView` 裁剪后的 `layoutBounds`、`boundsInLocal`\
    \ 和 `boundsInParent` 表格：\n\n`ImageView` 裁剪后的 `Bounds`\n\n| | minX | minY | maxX\
    \ | maxY | width | height |\n| --- | --- | --- | --- | --- | --- | --- |\n| `layoutBounds`\
    \ | 100 | 80 | 463 | 383 | 363 | 303 |\n| `boundsInLocal` | 122.5 | 141 | 394.5\
    \ | 370 | 272 | 229 |\n| `boundsInParent` | 122.5 | 141 | 394.5 | 370 | 272 |\
    \ 229 |\n\n总结一下：\n\n`layoutBounds` 不受以下属性影响：`effect`、`clip`、`scaleX`、`scaleY`、`rotate`、`translateX`、`translateY`、`layoutX`、`layoutY`。\n\
    \n上述所有属性都会影响 `boundsInParent`。\n\n在上述属性中，只有这些属性影响 `boundsInLocal`：`effect`、`clip`。\n\
    \n任何添加到 `Transform` 的 `ObservableList` 并应用到 `Node` 的 `Transform` 对象只会影响 `boundsInParent`；不会影响\
    \ `layoutBounds` 和 `boundsInLocal`。\n\n#### 1.1.4.4 `writeImageView` 方法的完整源代码\n\
    \n这里是 `writeImageView` 方法的完整源代码：\n\n导入语句：\n\n```java\nimport javafx.embed.swing.SwingFXUtils;\n\
