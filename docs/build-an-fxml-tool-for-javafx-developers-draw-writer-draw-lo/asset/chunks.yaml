    \ | 438.3 | 205.5 | 173.5 |\n\nIt's obvious that, no matter how many transformations\
    \ applied to a node, its `boundsInLocal` always keeps the original values. Besides,\
    \ take notes that set value for `layoutX` or `layoutY` property doesn't affect\
    \ the `boundsInLocal` either.\n\nThe above examples conclude that the rectangular\
