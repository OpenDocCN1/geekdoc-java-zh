    \n## 1.4 Summary\n\nThis chapter features the following key aspects of JavaFX\
    \ library, listing in the order of their appearance in the chapter:\n\n*   `SwingFXUtils`\
    \ class resides in `javafx.embed.swing` package, and provides methods to convert\
    \ types between JavaFX `Image` and Swing/AWT `Image`:\n    `static BufferedImage\
    \ fromFXImage(Image img, BufferedImage bimg)`\n    `static WritableImage toFXImage(BufferedImage\
    \ bimg, WritableImage wimg)`\n    (See section [Implement `writeImageView` Method](#part0007_split_001.html_implement-write-image-view))\n\
    \n*   `Image` class extends `java.lang.Object` and resides in `javafx.scene.image`\
    \ package, for loading images. An `Image` can be constructed by passing a string\
    \ `url` or an `InputStream` to its constructor. Use an `ImageView` object to display\
    \ an `Image`.\n    (See section [Implement `writeImageView` Method](#part0007_split_001.html_implement-write-image-view))\n\
    \n*   `WritableImage snapshot(SnapshotParameters params, WritableImage image)`\
    \ method, is defined in `Node` class, for taking a snapshot on a node whether\
    \ it is part of a scene or not. It returns a `WritableImage`, a direct subclass\
    \ of `javafx.scene.image.Image`.\n    (See section [Implement `writeImageView`\
    \ Method](#part0007_split_001.html_implement-write-image-view))\n\n*   `ImageView`\
    \ class extends `javafx.scene.Node` and resides in `javafx.scene.image` package,\
    \ for displaying images. An `Image` can be constructed by passing a `url` of `String`\
    \ type or an `Image` to its constructor.\n    (See section [Implement `writeImageView`\
    \ Method](#part0007_split_001.html_implement-write-image-view))\n\n*   `SnapshotParameters`\
    \ class extends `java.lang.Object` and resides in `javafx.scene` package; it provides\
    \ utilities to set parameters for taking a snapshot on a `javafx.scene.Node`,\
    \ such as:\n    `setFill(Paint fill)`\n    `setViewport(Rectangle2D viewport)`\n\
    \    (See [Complete Source Code of `writeImageView` Method](#part0007_split_001.html_write-image-view-codes))\n\
    \n*   `Bounds`, an abstract class, resides in `javafx.geometry` package, and defines\
    \ utilities to manipulate a rectangular region, measuring its coordinates and\
    \ dimensions: `minX`, `minY`, `maxX`, `maxY`, `width`, `height`.\n    (See sections:\
    \ [Exploit `boundsInLocal` and `boundsInParent`](#part0007_split_001.html_exploit-bounds),\
    \ [Exploit `layoutBounds`](#part0007_split_001.html_learn-layout-bounds))\n\n\
    *   `boundsInLocal`, a property of type `ReadOnlyObjectProperty<Bounds>`, defined\
    \ in the `Node` class, specifies a `Bounds` object which indicates a rectangular\
    \ bounding region of a `Node`, without taking into account any transformation\
    \ applied onto it.\n    (See sections: [Exploit `boundsInLocal` and `boundsInParent`](#part0007_split_001.html_exploit-bounds),\
    \ [Exploit `layoutBounds`](#part0007_split_001.html_learn-layout-bounds))\n\n\
    *   `boundsInParent`, a property of type `ReadOnlyObjectProperty<Bounds>`, defined\
    \ in the `Node` class, specifies a `Bounds` object which indicates a rectangular\
    \ bounding region of a `Node`, taking into account all transformations, such as\
    \ `translate`, `scale`, `rotate`, etc., applied onto it.\n    (See sections: [Exploit\
    \ `boundsInLocal` and `boundsInParent`](#part0007_split_001.html_exploit-bounds),\
    \ [Exploit `layoutBounds`](#part0007_split_001.html_learn-layout-bounds))\n\n\
    *   `layoutBounds`, a property of type `ReadOnlyObjectProperty<Bounds>` defined\
    \ in `Node` class, specifying a `Bounds` object, does not take into account these\
    \ properties: `effect`, `clip`, `scaleX`, `scaleY`, `rotate`, `translateX`, `translateY`,\
    \ `layoutX`, `layoutY`; and it also excludes any `Transform` object applied to\
    \ a `Node`.\n    (See section [Exploit `layoutBounds`](#part0007_split_001.html_learn-layout-bounds))\n\
    \n*   `RadialGradient` class, resided in `javafx.scene.paint` package, is a direct\
    \ subclass of `Paint`.\n\n*   `LinearGradient` class, resided in `javafx.scene.paint`\
    \ package, is a direct subclass of `Paint`.\n\n*   `CycleMethod` class, an enumerated\
    \ type, resided in `javafx.scene.paint` package, is used along with `LinearGradient`\
    \ and `RadialGradient`. It defines `CycleMethod.NO_CYCLE`, `CycleMethod.REFLECT`,\
    \ and `CycleMethod.REPEAT`.\n\n*   `Stop` class, resided in `javafx.scene.paint`\
    \ package, is used along with `LinearGradient` and `RadialGradient`. To create\
    \ an instance of `Stop` requires two parameters: `offset` and `color`.\n\n# Chapter\
    \ 2 Enhanced Draw Tool with Draw Capacity\n\n## Developing Drawing Tools V1.4\
    \ (Part 2)\n\n### Preface\n\nIn this chapter, we'll introduce `DrawLoader` class,\
    \ resides in `javafx.io`, to load FXML files as well as image files to a drawing\
    \ board.\n\nFrom detailed descriptions and well-documented example code excerpted\
    \ from developments of `Shape Drawing Tools V1.4 (Part 2)`, you will become familiar\
    \ with fundamental capabilities of JavaFX library recounted in the [Summary](#part0008_split_003.html_summary)\
    \ section.\n\nThe complete development process of `Shape Drawing Tools V1.4 (Part\
    \ 2)` is characterized by the following steps:\n\n*   [2.1 Create `DrawLoader`\
    \ Class](#part0008_split_001.html_create-draw-loader)\n    *   [2.1.1 Implement\
    \ `loadFXML` Methods](#part0008_split_001.html_implement-fxml)\n    *   [2.1.2\
    \ Implement `loadImage` Method](#part0008_split_001.html_implement-image)\n* \
    \  [2.2 Complete Source Code of `DrawLoader` Class](#part0008_split_002.html_complete-source-codes-draw-loader)\n\
    *   [2.3 Summary](#part0008_split_003.html_summary)\n\n## 2.1 Create `DrawLoader`\
    \ Class\n\nThe `DrawLoader` class resides in `drawtool.io` package, and provides\
    \ intuitive, higher level APIs to load FXML files as well as image files. The\
    \ source is an instance of `File`. If it is an image file, an `ImageView` object\
    \ is created, with the loaded image set to its `image` property. If it is an FXML\
    \ file, either hand coded or previously generated by a program that employs APIs\
    \ provided in `DrawWriter` class, referring to prior chapter, then descendants\
    \ of the root node loaded from the file are added to the given drawing pane.\n\
    \n### 2.1.1 Implement `loadFXML` Methods\n\nThe `DrawLoader` class provides two\
    \ `loadFXML` methods:\n\n```\n public ObservableList<Node> loadFXML(File file,\
