    \ following classes are frequently employed as parent nodes: `Group`, `Pane`,\
    \ and build-in layout panes (they are direct subclasses of `Pane`). Typically,\
    \ you call the `getChildren()` method to obtain a list of type `ObservableList<Node>`\
    \ (it is a subinterface of `java.util.List`), then you use the basic utilities,\
    \ defined in `Collection` interface, which java developers are familiar with,\
    \ to manipulate the content of the list.\n\n*   You may not add children to these\
    \ nodes:\n\n    The following classes are always employed as leaf nodes: `Canvas`,\
    \ `ImageView`, `MediaView`, and all direct subclasses of `Shape` such as `Rectangle`,\
    \ `Circle`, `Ellipse`, etc.\n\n## JavaFX and Swing\n\nNow, here is an intriguing\
    \ issue. For years Java developers have been building GUIs of Java applications\
    \ using Swing APIs, the GUI Components of Java Foundation Classes (JFC), why do\
    \ we need JavaFX in addition to Swing?\n\nIf you possess multitudes of legacy\
    \ code written in Swing and would like to incorporate JavaFX features into Swing\
    \ code, JDK 8 provides mechanism to do so, and vice versa, you can include Swing\
    \ components in JavaFX applications.\n\nThe topic of JavaFX-Swing Interoperability\
    \ is not covered in the book series. If you are interested in this topic, visit\
    \ Oracle Online Documentation \"JavaFX: Interoperability -- JavaFX-Swing Interoperability\"\
    \ at here:\n\n[http://docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm](http://docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm)\n\
    \nJavaFX is the next generation of Java GUIs. To account for the benefits of employing\
    \ JavaFX capabilities, besides the Interoperability between JavaFX and Swing,\
    \ we present the significant features of JavaFX in the section below.\n\n## Essence\
    \ of JavaFX\n\nJavaFX not only allows you to create applications with visual user\
    \ interfaces rapidly, but also contains enticing and distinctive abilities. They\
    \ are enumerated as follows:\n\n### Build-in Layout Panes\n\nJavaFX's layout panes\
    \ are containers that automatically perform various types of placement on nodes.\
    \ You can place any number of nodes in a layout pane, which is a node itself and\
    \ thus can be nested in another layout pane as well. The major advantage of using\
    \ layout panes is to avoid the tediousness of manually specifying size and location\
    \ of each node. As these nodes in a scene graph are managed in a tree structure,\
    \ the layout algorithm recursively computes size and location of each node based\
    \ on its layout type and specified layout properties, and the re-calculation is\
    \ set off dynamically as the window's resize event happens.\n\nThere are 8 types\
    \ of built-in layout panes, located in `javafx.scene.layout` package:\n\n`BorderPane`\n\
    \nA `BorderPane` places nodes in five locations respectively to create a classic\
    \ look-and-feel of main windows, typically the top region for a menu bar or a\
    \ tool bar, the bottom region for a status bar, left and right regions for navigation\
    \ panels, and the center region for a working area.\n\n`HBox`\n\nAn `HBox` places\
    \ nodes in one row (horizontally).\n\n`VBox`\n\nA `VBox` places nodes in one column\
    \ (vertically).\n\n`GridPane`\n\nA `GridPane` places nodes in a grid with multiple\
    \ rows and columns. This is a handy user interface for displaying a series of\
    \ name-value pair properties.\n\n`StackPane`\n\nA `StackPane` places all nodes\
    \ in a stack with center as default alignment. All children overlap each other\
    \ in the center of the container, with the later created node placed on the top\
    \ of previous ones. But you can use static methods, `StackPane.setAlignment(Node`\
    \ child`, Pos` value`)` and `StackPane.setMargin(Node` child`, Insets` value`)`,\
    \ to adjust the mandatory position of each node.\n\n`FlowPane`\n\nYou can specify\
    \ orientation property of a `FlowPane`. For a horizontal `FlowPane`, nodes are\
    \ placed in rows, from left to right, wrapping at the boundary of its container's\
    \ width. For a vertical `FlowPane`, nodes are placed in columns, from top to bottom,\
    \ wrapping at the boundary of its container's height.\n\n`TilePane`\n\nA `TilePane`\
    \ is similar to a `FlowPane` except each cell in the grid of a `TilePane` has\
    \ the same size.\n\n`AnchorPane`\n\nAn `AnchorPane` places nodes relative to their\
    \ specified anchor points, there are four of them: `topAnchor`, `rightAnchor`,\
    \ `bottomAnchor` and `leftAnchor`.\n\n#### Reference to Oracle Online Documentation\
    \ \"Working with Layouts in JavaFX\":\n\n[http://docs.oracle.com/javase/8/javafx/layout-tutorial/index.html](http://docs.oracle.com/javase/8/javafx/layout-tutorial/index.html)\n\
    \n### Customization using CSS\n\nJavaFX allows the usage of CSS (Cascading Style\
    \ Sheet) to describe the presentation styles of application's user interfaces.\
    \ Defining the presentation attributes--such as color, font, margins, padding,\
    \ width, height, lines, background images, etc., using CSS, separated from application\
    \ source code, reveals significant conveniency in many ways:\n\n*   Customization\
    \ from software provider's side:\n\n    Applications compiled from the same set\
    \ of source code can bear a variety of presentation styles, each of them complying\
    \ with different customer's requirements.\n\n*   Customization from application\
    \ user's side:\n\n    Even after the software has been released, in case application\
    \ users have preferences for the look of UIs, it is also applicable to modify\
    \ the presentation attributes, defined in CSS files, at customer site.\n\n*  \
    \ Benefits for designers of presentation styles:"
