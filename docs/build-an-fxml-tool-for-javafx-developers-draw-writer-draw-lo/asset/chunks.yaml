  trans: "\n\n最初，`ImageView` 对象显示在位置 [100, 80]，宽度为 347，高度为 411（即图像的大小），且尚未对其应用任何变换；因此，`boundsInLocal`\
    \ 中的 `Bounds` 和 `boundsInParent` 中的 `Bounds` 都指定了相同的值：\n\n### `ImageView` 的初始\
    \ `Bounds`\n\n|   | minX | minY | maxX | maxY | width | height |\n| --- | ---\
    \ | --- | --- | --- | --- | --- |\n| `boundsInLocal` | 100 | 80 | 447 | 491 |\
    \ 347 | 411 |\n| `boundsInParent` | 100 | 80 | 447 | 491 | 347 | 411 |\n\n现在，对\
    \ `ImageView` 应用了一个变换；它被缩放为原始尺寸的一半，并以初始边界矩形的中心为缩放原点。图 1-3 显示了变换后的 `ImageView`\
    \ 及其 `Bounds`。较小的矩形区域表示 `boundsInParent`，较大的矩形区域是保持不变的 `boundsInLocal`。\n\n图 1-3.\
    \ 显示 `ImageView` 缩放为原始尺寸一半后的边界矩形。\n\n![](img/00009.jpeg \"HeronBoundsScale.png\"\
    )\n\n缩放后，`boundsInLocal` 保持原始值，而 `boundsInParent` 中的坐标和维度发生了变化。下表显示了我们将 `ImageView`\
    \ 缩放为原始尺寸一半后的差异：\n\n### 缩放后 `ImageView` 的 `Bounds`\n\n|    | minX | minY | maxX\
    \ | maxY | width | height |\n| --- | --- | --- | --- | --- | --- | --- |\n| `boundsInLocal`\
    \ | 100 | 80 | 447 | 491 | 347 | 411 |\n| `boundsInParent` | 186.8 | 182.8 | 360.3\
    \ | 388.3 | 173.5 | 205.5 |\n\n现在，我们将对图 1-3 中已缩放为原始尺寸一半的 `ImageView` 应用额外的变换。首先，顺时针旋转\
    \ 90°，然后平移 [-32, 66]。让我们查看图 1-4 中边界矩形的最终结果：\n\n图 1-4. 显示经过这些变换后 `ImageView` 的边界矩形：缩放\
    \ 50%、顺时针旋转 90°、平移 [-32, 66]。\n\n![](img/00010.jpeg \"HeronBoundsScaleRotateTranslate.png\"\
    )\n\n在图 1-4 中，较小的矩形区域表示变换后的 `boundsInParent`。而 `boundsInLocal`（即较大的矩形区域）保持不变。\n\
    \n总结一下，下表显示了应用到 `ImageView` 的所有变换：\n\n字体 应用到 `ImageView` 的变换\n\n| scaleX | scaleY\
    \ | rotate | translateX | translateY |\n| --- | --- | --- | --- | --- |\n| 0.5\
    \ | 0.5 | 90.0 | -32 | 66 |\n\n下表显示了变换后（缩小 50%、顺时针旋转 90°、平移 [-32, 66]）`boundsInLocal`\
    \ 和 `boundsInParent` 中的值：\n\n### 变换后 `ImageView` 的 `Bounds`\n\n|    | minX | minY\
    \ | maxX | maxY | width | height |\n| --- | --- | --- | --- | --- | --- | ---\
    \ |\n| `boundsInLocal` | 100 | 80 | 447 | 491 | 347 | 411 |\n| `boundsInParent`\
    \ | 138.8 | 264.8 | 344.3 | 438.3 | 205.5 | 173.5 |\n\n显而易见，无论对节点应用了多少变换，它的 `boundsInLocal`\
    \ 始终保持原始值。此外，请注意为 `layoutX` 或 `layoutY` 属性赋值也不会影响 `boundsInLocal`。\n\n上述示例得出结论：在节点经过变换的情况下，`boundsInParent`\
    \ 中指定的矩形区域是快照（snapshot）的正确视口。\n\n### 1.1.4.3 利用 `layoutBounds`\n\n`layoutBounds`\
    \ 是 `Node` 类中定义的类型为 `ReadOnlyObjectProperty<Bounds>` 的属性，它指定一个 `Bounds` 对象，且不考虑以下属性：`effect`、`clip`、`scaleX`、`scaleY`、`rotate`、`translateX`、`translateY`、`layoutX`、`layoutY`；它还排除了应用于\
    \ `Node` 的任何 `Transform` 对象。\n\n在澄清 `boundsInLocal` 和 `boundsInParent` 之间的差异之后，本节介绍了\
    \ `layoutBounds`，并与 `boundsInLocal` 和 `boundsInParent` 进行比较。\n\n同样，我们使用下面的 `ImageView`\
    \ 对象显示图像 Egret_1.png，以说明 `layoutBounds`、`boundsInLocal` 和 `boundsInParent` 之间的差异：\n\
    \n图 1-5. 显示 `ImageView` 对象的初始边界矩形。\n\n![](img/00011.jpeg \"EgretBounds.png\")\n\
    \n最初，`ImageView` 对象显示在位置 [100, 80]，宽度为 363，高度为 303（即图像的大小），且尚未对其应用任何 `effect`、`clip`\
    \ 或变换；因此，所有三个 `Bounds` 都指定了相同的值：\n\n`ImageView` 的初始 `Bounds`\n\n|    | minX |\
    \ minY | maxX | maxY | width | height |\n| --- | --- | --- | --- | --- | --- |\
    \ --- |\n| `layoutBounds` | 100 | 80 | 463 | 383 | 363 | 303 |\n| `boundsInLocal`\
    \ | 100 | 80 | 447 | 491 | 347 | 411 |\n| `boundsInParent` | 100 | 80 | 463 |\
    \ 383 | 363 | 303 |\n\n这里也花时间熟悉 FXML 的语法。以下显示了一个 FXML 文件的内容，它创建了一个以 `Pane` 为根节点的场景图，`ImageView`\
    \ 为 `Pane` 的唯一子：\n\n列表 1-11. 使用 FXML 在场景图中创建 `ImageView` 节点\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<?import javafx.scene.image.*?>\n\
    <?import javafx.scene.layout.*?>\n<Pane xmlns:fx=\"http://javafx.com/fxml\">\n\
    \  <children>\n    <ImageView fx:id=\"ImageView_173b35c\" preserveRatio=\"true\"\
    \ x=\"100.0\" y=\"80.0\">\n      <image>\n        <Image preserveRatio=\"false\"\
    \ smooth=\"false\" url=\"@Egret_1.png\"/>\n      </image>\n    </ImageView>\n\
    \  </children>\n</Pane>\n```\n\n现在，我们将如下所示的 `Path` 对象：\n\n图 1-6. 显示内部绿色颜料填充的 `Path`\
    \ 对象及其边界矩形。\n\n![](img/00012.jpeg \"EgretMaskBounds.png\")\n\n这里是创建图 1-6 中 `Path`\
    \ 对象的 FXML 文件：\n\n列表 1-12. 使用 FXML 在场景图中创建 `Path` 节点\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<?import javafx.scene.shape.*?>\n\
    <?import javafx.scene.layout.*?>\n<Pane xmlns:fx=\"http://javafx.com/fxml\">\n\
    \  <children>\n    <Path fill=\"green\">\n      <Path data=\"M100,80 L463,80 L463,383\
    \ L100,383 Z\"/>\n    </Path>\n  </children>\n</Pane>\n```\n"
