    \ purpose.\n\n### 1.1.4 Implement `writeImageView` Method\n\nIn addition to utilities\
    \ for writing JavaFX shapes to FXML files, the `DrawWriter` class provides a practical\
    \ method to write an `ImageView` object to an image file in png or gif format:\n\
    \n```\n public void writeImageView(ImageView iv, File file)\n```\n\nAn `ImageView`\
    \ object, rendering on a drawing board, maybe comes from a graphics editing function,\
    \ such as image clipping or screen snapshot. Or, it may originally come from an\
    \ FXML file, and be transformed by rotate, scale, translate, etc. In either case,\
    \ we need a utility to save the edited image.\n\nIn this edition, we only support\
    \ two image types, png and gif, because of the following write utility, defined\
    \ in `javax.imageio.ImageIO` class, which writes an image to a file:\n\n```\n\
    \ static boolean write(RenderedImage im, String formatName, OutputStream output)\n\
    ```\n\nTesting result is that, not all formats work in the `ImageIO.write` method,\
    \ only gif and png come out as expected.\n\nThe `ImageIO.write` method accepts\
    \ an image of type `RenderedImage`, an interface resides in `java.awt.image` package.\n\
    \nWe use utility provided in `javafx.embed.swing.SwingFXUtils` class, to convert\
    \ a JavaFX `Image` to a `BufferedImage`:\n\n```\n static BufferedImage fromFXImage(Image\
    \ img,\n                                   BufferedImage bimg)\n```\n\nThe `BufferedImage`\
    \ class extends `java.awt.Image` and implements `WritableRenderedImage`, a subinterface\
    \ of `RenderedImage`.\n\n#### 1.1.4.1 Snapshot an Image\n\nNow we'll describe\
    \ how to obtain a feasible JavaFX `Image` from the `ImageView` object, and to\
    \ convert and then save to a file. Instead of getting the image specified in `image`\
    \ property, we apply the `snapshot` method, defined in `Node` class, to acquire\
    \ a new image:\n\n```\npublic WritableImage snapshot(SnapshotParameters params,\n\
    \                              WritableImage image)\n```\n\nThe reason why we\
    \ snapshot the `ImageView` is because the image specified in its `image` property\
    \ is not synchronized with transformations applied onto it; any transformation,\
    \ such as rotate, scale, shear, etc., performed on the `ImageView` doesn't alter\
    \ its `image` property. And taking a snapshot of the `ImageView` comes out a new\
    \ image, type of `WritableImage`, which is a direct subclass of `javafx.scene.image.Image`,\
    \ conforms to all the transformations.\n\n#### 1.1.4.2 Exploit `boundsInLocal`\
    \ and `boundsInParent`\n\nInside the `writeImageView` Method, to snapshot an `ImageView`,\
    \ need specify a proper viewport in a parameter, type of `SnapshotParameters`.\
    \ Here's the method to obtain a bounding rectangle of a `Node` as viewport of\
    \ snapshot:\n\n`public final Bounds getBoundsInParent()`\n\nThe returned type,\
    \ `Bounds`, an abstract class resided in `javafx.geometry` package, defines utilities\
    \ to manipulate a rectangular region, measuring its coordinates and dimensions:\
    \ minX, minY, maxX, maxY, width, height. To exploit the bounding rectangle of\
    \ a `Node`, at first we need apprehend the differences between the following two\
    \ properties defined in the `Node` class:\n\n`boundsInLocal`\n\nA property of\
    \ type `ReadOnlyObjectProperty<Bounds>` specifies a `Bounds` object for a `Node`,\
    \ without taking into account any transformation applied onto it.\n\n`boundsInParent`\n\
    \nA property of type `ReadOnlyObjectProperty<Bounds>` specifies a `Bounds` object\
    \ for a `Node`, taking into account all transformations, such as translate, scale,\
    \ rotate, etc., applied onto it.\n\nLet's use an `ImageView` object as below to\
    \ illustrate `boundsInLocal` and `boundsInParent`:\n\nFigure 1-2. Show initial\
    \ bounding rectangle of `ImageView` object.\n\n![](images/00008.jpeg \"HeronBounds.png\"\
    )"
