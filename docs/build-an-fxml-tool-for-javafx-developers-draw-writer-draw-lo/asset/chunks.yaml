    # 前言\n\n## 本书结构\n\n本书是 `Coding in JavaFX Step by Step Graphics Toolkit` 系列的第Ⅳ卷。由于内容丰富，无法挤在一书中，因此章节按卷组织：\n\
    \n1.  **第Ⅰ卷：开发视图组件**\n    *   **第 1 章**：基础查看器\n    *   **第 2 章**：具有浏览功能的增强型查看器\n\
