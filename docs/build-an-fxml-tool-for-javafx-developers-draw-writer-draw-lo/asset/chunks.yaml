  trans: "\n\n![](img/00039.jpeg)\n\n# 提供可复用类与图形应用程序\n包含完整源代码\n\n# 为 JavaFX 开发者构建\n\
    FXML 工具\n\n## DRAW 写入器与 DRAW 加载器\n基于 Java 8\n\n## 在 JavaFX 中编程\n循序渐进构建图形工具包\n\n\
    # 第 Ⅳ 卷\n\n###郭淑芬 (Shufen Kuo)\n黄超 (Bing-Chao Huang)\n\nCopyright© 2016 Shufen\
    \ Kuo & Bing-Chao Huang.\n版权所有。\n未经作者（郭淑芬 & 黄超）事先书面许可，不得以任何形式或手段复制或发本书，或存储在数据库或检索系统中；但书中附带的代码可以为了学习目的在计算机系统中输入和执行，但未经作者事先书面许可，不得为了出版或商业用途进行复制或修改。\n\
    \n## 目录\n\n* 关于作者\n* 致谢\n* 前言\n    * 本书的结构\n    * 为什么选择这本书\n    * 学习本书需要的准备\n\
    * 引言\n* 第 Ⅳ 卷：开发草图保存与加载 API\n    * 第 1 章：具有 DrawWriter 能力的增强绘制工具\n        介绍 `DrawWriter`\
    \ 类，该类位于 `drawtool.io` 包中，用于为绘制板（一个 `Pane` 对象）上交互创建的草图生成 FXML 文件。草图可以是 `Shape`\
    \ 对象或 `ImageView` 对象。除了 FXML 格式外，它还提供了将 `ImageView` 对象的图像保存为图像文件的 API。\n     \
    \   * 1.1 创建 DrawWriter 类\n            * 1.1.1 文档与转换器\n            * 1.1.2 DOMSource\
    \ 和 StreamResult\n            * 1.1.3 实现 writeFXML 方法\n                * 1.1.3.1\
    \ 组合 DOM 文档的内容\n            * 1.1.4 实现 writeImageView 方法\n                * 1.1.4.1\
    \ 图像快照\n                * 1.1.4.2 利用 boundsInLocal 和 boundsInParent\n        \
    \        * 1.1.4.3 利用 layoutBounds\n                * 1.1.4.4 writeImageView 方法的完整源代码\n\
    \        * 1.2 使用 FXML 在场景图中创建 JavaFX 节点\n            * 1.2.1 在 FXML 中创建指定 strokeDashArray\
    \ 的 Line\n            * 1.2.2 在 FXML 中为场景图创建 Polyline\n            * 1.2.3 在 FXML\
    \ 中创建箭头形状的 Polygon\n            * 1.2.4 在 FXML 中创建形成汉字形状的 Path\n            *\
    \ 1.2.5 在 FXML 中根据 M, Q, L 创建 SVGPath\n            * 1.2.6 在 FXML 中创建填充径向渐变的 Rectangle\n\
    \            * 1.2.7 在 FXML 中创建填充线性渐变的 Circle\n            * 1.2.8 在 FXML 中创建带有效果的\
    \ Ellipse\n            * 1.2.9 在 FXML 中创建彩虹虹色的 Arc\n            * 1.2.10 在 FXML\
    \ 中创建带有视觉效果和倾斜变换的 Text\n            * 1.2.11 从 Shape 生成 FXML 文件\n        * 1.3\
    \ DrawWriter 类的完整源代码\n        * 1.4 总结\n    * 第 2 章：具有 DrawLoader 能力的增强绘制工具\n\
    \        介绍 `DrawLoader` 类，位于 `drawtool.io` 包，用于将 FXML 文件以及图像文件加载到绘制板。\n     \
    \   * 2.1 创建 DrawLoader 类\n            * 2.1.1 实现 loadFXML 方法\n            * 2.1.2\
    \ 实现 loadImage 方法\n        * 2.2 DrawLoader 类的完整源代码\n        * 2.3 总结\n    * 第\
    \ 3 章：具有 Draw Writer 和 Draw Loader 能力的增强 JFXDrawTools\n        将草图保存和加载功能集成到 `JFXDrawTools`\
    \ 应用中。\n        * 3.1 在菜单栏添加文件菜单\n        * 3.2 使用 DrawWriter 类为草图生成 FXML 文件\n\
    \        * 3.3 在文件菜单中添加 FXML 子菜单\n        * 3.4 使用 DrawLoader 类从 FXML 文件加载草图\n\
    \            * 3.4.1 加载 FXML 文件\n            * 3.4.2 加载图像文件\n        * 3.5 在文件菜单中添加打开子菜单\n\
    \        * 3.6 绑定阶段标题以显示 FXML 文件文件名\n        * 3.7 在菜单栏添加操作菜单\n        * 3.8 JFXDrawTools\
    \ 类的完整源代码\n        * 3.9 总结\n* 结语\n\n# 关于作者\n\n### 郭淑芬 (Shufen Kuo)\n\n郭淑芬于 1988\
    \ 年夏天搬往旧金湾地区，之后一直担任软件工程师。她在各种平台上丰富的实践经验，从 PC DOS 到许多 Unix/Linux 工作站，从 PC Linux\
    \ 到 PC Windows。\n\n她从 2001 年开始编写 Java 程序。她一直使用抽象窗口工具包（AWT）和 Swing（Java 基础类 JFC\
    \ 的 GUI 组件）来设计和开发面向对象的图形工具。自 2012 年以来，她沉浸在 JavaFX 之中；对其本质的探索激励她编写书籍来宣传 JavaFX\
    \ 的优势。\n\n在开发 Java 应用程序之前，她在运行 X Window 系统的 UNIX/Linux/Solaris 上开发 C/C++应用程序方面拥有\
