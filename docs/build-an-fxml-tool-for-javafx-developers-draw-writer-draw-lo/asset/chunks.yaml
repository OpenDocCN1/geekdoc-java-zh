    \n## JavaFX Fundamental UI Components\n\nIn addition to the Essence of JavaFx\
    \ described above, JavaFX provides fundamental UI components, reside in `javafx.scene.control`\
    \ package, and are derived from `javafx.scene.control.Control` class; they are\
    \ called UI controls often.\n\nHere are available UI controls, the ones that are\
    \ not marked with asterisk (*) have their resemblant counterparts in Swing:\n\n\
    *   `Label`, `Button`, `RadioButton`, `ToggleButton`,\n\n*   `CheckBox`, `ChoiceBox`,\n\
    \n*   `ComboBox`, `ListView`, `TableView`,\n\n*   `TextField`, `TextArea`, `PasswordField`,\
    \ `HTMLEditor`(*)\n\n*   `ScrollBar`, `ScrollPane`, `Slider`, `ProgressBar`, `ProgressIndicator`(*),\
    \ `ToolBar`,\n\n*   `MenuBar`, `MenuButton`, `SplitMenuButton`(*),\n\n*   `ColorPicker`,\
    \ `DatePicker`(*), `Separator`, `Pagination`(*), `SplitPane`, `TabPane`, `TitledPane`(*),\
