    \ `java.lang.Object` and resides in `javax.xml.transform.stream` package.\n\n\
    When a DOM `Document` is ready to write to a physical file, we create a `DOMSource`\
    \ object by passing a DOM `Document` to its constructor, and create a `StreamResult`\
    \ object by passing a `File` to its constructor. Then, use a `Transformer` to\
    \ transform source, the `Document`, to destination, the `File`. Here's the source\
    \ code to do these:\n\nListing 1-3. Define `writeMyFXMLDocument` method to write\
    \ a `Document` to a `File`:\n\n```\n void writeMyFXMLDocument() {\n    try {\n\
    \      DOMSource source = new DOMSource(document);\n      StreamResult result\
    \ = new StreamResult(fxmlFile);\n      transformer.transform(source, result);\n\
    \    } catch (TransformerException e) {\n      System.out.println(e.getMessage());\n\
    \    }\n  }\n```\n\n### 1.1.3 Implement `writeFXML` Method\n\nThe `DrawWriter`\
    \ Class provides two `writeFXML` methods to write JavaFX nodes to FXML files,\
    \ one accepts a list of `Node`, and the other accepts a `Pane`:\n\n1. `public\
    \ void writeFXML(Pane pane, File file)`\n\n   Recursively write children of a\
    \ pane to a file in FXML format, with `<Pane>` element as root node of a `Document`.\n\
    \n2. `public void writeFXML(List<? extends javafx.scene.Node> list, File file)`\n\
    \n   Write a list of JavaFX `Node` to a file in FXML format, with `<Pane>` element\
    \ as root node of a `Document`.\n\nAt this stage, we emphasize on nodes of these\
    \ types -- `Shape`, `ImageView` -- to fulfill the shape builder, JFXDrawTools\
    \ V1.2 application, to be discussed in later chapter of this book. However the\
    \ structure is expandable, it allows you to incrementally add code with ease to\
    \ support nodes of other types.\n\nHere are snippets of code to define `writeFXML`\
    \ methods\n\nListing 1-4. Define `writeFXML` method in `DrawWriter` class, passing\
    \ a `Pane` and a `File` to it:\n\n```\n public void writeFXML(Pane pane, File\
    \ file) {\n    // if pane has no children, \n    // still create an FXML file\
