  trans: "\n\n## 3.1 向菜单栏添加 `File` 菜单\n\n在本节中，我们将创建一个 `File` 菜单并将其添加到菜单栏中。初始情况下，`File`\
    \ 菜单包含一个菜单项 `Exit`。以下是创建 `File` 菜单的源代码：\n\n列表 3-1. 创建带有 `Exit` 菜单项的 `File` 菜单：\n\
    \n```\n MenuBar createMenuBar(Stage stage) {\n    MenuBar menuBar = new MenuBar();\n\
    \    Menu menuFile = createMenuFile(stage);\n    Menu menuTools = createMenuTools();\n\
    \    Menu menuPref = createMenuPreference();\n    menuBar.getMenus().addAll(menuFile,\
    \ menuTools, menuPref);\n\n    return menuBar;\n  }\n\n  Menu createMenuFile(final\
    \ Stage stage) {\n    Menu menuFile = new Menu(\"File\");\n    MenuItem exit =\
    \ new MenuItem(\"Exit\");\n    menuFile.getItems().add(exit);\n\n    // Add action\
    \ for exit menu item\n    exit.setOnAction(new EventHandler<ActionEvent>() {\n\
    \      @Override\n      public void handle(ActionEvent e) {\n        Platform.exit();\n\
    \      }\n    });\n    return menuFile;\n  }\n```\n\n## 3.2 使用 `DrawWriter` 类为绘图生成\
    \ FXML 文件\n\n在本节中，我们将参考本书的第 1 章，使用 `DrawWriter` 类定义的 API 来生成 FXML 文件，该文件将保存在绘板上交互式创建的绘图。我们将使用以下方法：\n\
    \n```\n public void writeFXML(Pane pane, File file)\n```\n\n请注意，在接下来的示例中，我们创建了一个\
    \ `DrawPane` 实例并将其放在 `BorderPane` 的中心作为我们的绘板。`DrawPane` 是 `Pane` 类的直接子类，它注册了事件处理器来处理对于在面板本身交互式绘制形状至重要的事件。这些事件包括鼠标按下、鼠标拖拽、鼠标释放、按键按下等。有关\
    \ `DrawPane` 类的详细描述和完整源代码，请参阅 VOLUME Ⅱ: DEVELOPING INTERACTIVE SHAPE DRAWING TOOLS\
    \ 第 6 章 Basic Draw Tool Section 6.2 Create `DrawPane` Class，以及第 7 章 Enhanced Draw\
    \ Tool with Predefined Drawers Section 7.3 Enhance `DrawPane` Class。\n\n以下代码段使用\
    \ `DrawWriter` 类将绘板上的草图保存到 FXML 文件中，其中定义了 `writeFXML` 方法：\n\n导入语句：\n\n```\nimport\
    \ java.io.File;\nimport javafx.application.Application;\nimport javafx.event.ActionEvent;\n\
    import javafx.event.EventHandler;\nimport javafx.scene.control.MenuItem;\nimport\
    \ javafx.scene.layout.BorderPane;\nimport javafx.stage.FileChooser;\nimport javafx.stage.Stage;\n\
    \nimport drawtool.DrawPane;\nimport drawtool.io.DrawWriter;\n```\n\n列表 3-2. 使用\
    \ `DrawWriter` 类将绘板上的绘图写入 FXML 文件：\n\n```\npublic class JFXDrawTools extends Application\
    \ {\n  // The drawing board to draw/move shapes dynamically \n  DrawPane drawPane\
    \ = new DrawPane();\n\n  // Create a DrawWriter to save shapes/images \n  DrawWriter\
    \ drawWriter = new DrawWriter();\n\n  @Override\n  public void start(final Stage\
    \ stage) {\n    BorderPane rootPane = new BorderPane();\n    rootPane.setCenter(drawPane);\n\
    \n        ...\n\n    // Create a file chooser for saveAllAs\n    final FileChooser\
    \ fileChooser = new FileChooser();\n    fileChooser.getExtensionFilters().addAll(\n\
    \        new FileChooser.ExtensionFilter(\"FXML\", \"*.fxml\"),\n        new FileChooser.ExtensionFilter(\"\
    All Files\", \"*.*\"));\n\n        ...\n\n    MenuItem saveAllAs = new MenuItem(\"\
    Save All As...\");\n\n    // Add action for saveAllAs menu item\n    // Open FileChooser\
    \ to select a file\n    saveAllAs.setOnAction(new EventHandler<ActionEvent>()\
    \ {\n      @Override\n      public void handle(ActionEvent e) {\n        // Open\
    \ FileChooser dialog\n        fileChooser.setTitle(\"Save All As FXML File\");\n\
    \        File file = fileChooser.showSaveDialog(stage);\n        if (file != null)\
    \ {\n          drawWriter.writeFXML(drawPane, file);\n        }\n      }\n   \
    \ }); \n\n    ... \n```\n\n## 3.3 向 `File` 菜单添加 `Save FXML` 子菜单\n\n在这里，让我们探索 `Save\
