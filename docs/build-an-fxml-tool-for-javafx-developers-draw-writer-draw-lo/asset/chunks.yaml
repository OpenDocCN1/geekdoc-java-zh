  trans: "\n\n### 描述\n加载 FXML 文件并将根节点的后代（或根节点本身）添加到指定 `pane` 的子节点列表中。如果从指定文件加载的根节点是一个\
    \ `Pane` 且拥有一个属性映射（可以通过 `Node` 类中定义的 `getProperties()` 方法获取），则该映射条目集中的元素将被添加到所给\
    \ `pane` 的属性映射中。\n\n### 1. `public ObservableList<Node> loadFXML(File file)`\n\
    \n加载给定的 FXML 文件并以列表形式返回根节点的后代节点或根节点本身。\n\n请注意，我们会检查存储在 FXML 文件中的场景图的根节点是否属于以下类型：\n\
    \n1. `Pane`\n2. `Group`\n\n如果不是这些类型，则将根节点本身而不是其后代节点作为列表返回给调用者。\n\n`FXMLLoader`\
    \ 类自 `java.lang.Object` 并位于 `javafx.fxml` 包，提供了加载 FXML 文档的功能。以下是 `FXMLLoader`\
    \ 类中定义的用于我们 `loadFXML` 方法的静态方法：\n\n```\npublic static <T> T load(URL location)\n\
    \                 throws IOException \n```\n\n以下是我们 `loadFXML` 方法的完整源代码：\n\n导入语句：\n\
    \n```\nimport java.io.File;\nimport java.io.IOException;\nimport java.net.MalformedURLException;\n\
    import java.net.URL;\nimport java.util.*;\nimport javafx.collections.*;\nimport\
    \ javafx.fxml.FXMLLoader;\nimport javafx.scene.Group;\nimport javafx.scene.Node;\n\
    import javafx.scene.layout.Pane;\n```\n\nListing 2-1. 定义 `loadFXML` 方法：\n\n```java\n\
    \ /**\n   * 加载 FXML 文件以获取场景图的根节点\n   * 如果根节点是 Pane 或 Group，\n   * 将其后代添加到给定 pane\
    \ 的子节点列表中 \n   * 如果它不是 Pane 或 Group，\n   * 将根节点本身添加到给定 pane 的子节点列表中 \n   * 并且如果根节点是一个\
    \ pane，\n   * 我们也将它的属性（一个映射）添加到给 pane 中\n   */\n  public ObservableList<Node>\
    \ loadFXML(File file, Pane pane) {\n    try {\n      // 从 File 获取 URL\n      URL\
    \ url = file.toURI().toURL();\n      Node root = FXMLLoader.load(url);\n\n   \
    \   ObservableList<Node> nodeList = getRootDescendant(root);\n      pane.getChildren().addAll(nodeList);\n\
    \n      ObservableMap<Object, Object> map = root.getProperties();\n      // 如果根是\
    \ pane，则将属性（一个映射）添加到 pane\n      if (root instanceof Pane) {\n        Iterator<Map.Entry<Object,\
    \ Object>> it = map.entrySet().iterator();\n        while (it.hasNext()) {\n \
    \         Map.Entry<Object, Object> e = it.next();\n          pane.getProperties().put(e.getKey(),\
    \ e.getValue());\n        }\n      }      \n      return nodeList;\n    } catch(MalformedURLException\
    \ e) {\n      System.out.println(e);\n    } catch(IOException e) {\n      System.out.println(e);\n\
    \    }     \n    // 返回空列表\n    return FXCollections.observableArrayList();   \
    \  \n  }\n\n  /**\n   * 加载 FXML 文件以获取场景图的根节点\n   * 如果根节点是 Pane 或 Group，\n   *\
    \ 返回根节点的子节点列表\n   * 如果根节点不是 Pane 或 Group \n   * 返回一个包含根节点的列表\n   */\n  public\
    \ ObservableList<Node> loadFXML(File file) {\n    try {\n      // 从 File 获取 URL\n\
    \      URL url = file.toURI().toURL();\n      Node root = FXMLLoader.load(url);\n\
    \      return getRootDescendant(root);\n    } catch(MalformedURLException e) {\n\
    \      System.out.println(e);\n    } catch(IOException e) {\n      System.out.println(e);\n\
    \    }     \n    // 返回空列表\n    return FXCollections.observableArrayList();   \
    \  \n  }\n\n  ObservableList<Node> getRootDescendant(Node root) {\n    if (root\
    \ instanceof Pane) \n      return ((Pane)root).getChildren();\n    if (root instanceof\
    \ Group) \n      return ((Group)root).getChildren();\n\n    // 返回一个包含根节点的列表\n\
    \    return FXCollections.observableArrayList(root);     \n  }\n```\n\n### 2.1.2\
    \ 实现 `loadImage` 方法\n\n除了加载 FXML 文件外，`DrawLoader` 类还提供了一个 `loadImage` 方法：\n\n\
    ```java\npublic ImageView loadImage(File file, double maxWidth, double maxHeight)\n\
    ```\n\n`loadImage` 方法从指定的文件加载图像并返回一个 `ImageView` 对象用于查看。最大视图尺寸在参数中指定：`maxWidth`\
    \ 和 `maxHeight`。\n\n以下是 `loadImage` 方法的完整源代码：\n\n导入语句：\n\n```java\nimport java.io.File;\n\
    import javafx.scene.image.Image;\nimport javafx.scene.image.ImageView;\n```\n\n\
    Listing 2-2. 定义 `loadImage` 方法加载图像文件并返回一个 `ImageView` 对象以查看加载的图像：\n\n```java\n\
    \ /**\n   * 返回一个 ImageView，url 以字符串形式存放在 ImageView 的属性中\n   */\n  public ImageView\
    \ loadImage(File file, double maxWidth, double maxHeight) {\n    String url =\
    \ file.toURI().toString();\n    Image image = new Image(url);\n    ImageView imageView\
    \ = new ImageView();\n    imageView.setPreserveRatio(true);  \n    // 如果图像大于 maxWidth/maxHeight，\n\
    \    // 初始化 imageView 以适应 maxWidth/maxHeight\n    if (image.getWidth() > maxWidth)\
    \ {\n      imageView.setFitWidth(maxWidth);\n    } else if (image.getHeight()\
    \ > maxHeight) {\n      imageView.setFitHeight(maxHeight);\n    }\n    imageView.setImage(image);\n\
    \    // 将 url 放入属性（一个映射）\n    imageView.getProperties().put(\"imageURL\", url);\n\
    \    return imageView;\n  }\n```\n\n### 2.2 `DrawLoader` 类的完整源代码\n\nListing 2-3.\
    \ `DrawLoader` 类的完整源代码：\n\n"
