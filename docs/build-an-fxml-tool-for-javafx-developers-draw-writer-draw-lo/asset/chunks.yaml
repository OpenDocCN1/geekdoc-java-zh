  raw: "    Introduce `DrawWriter` class, resides in `drawtool.io` package, to generate\
    \ FXML files for sketch created interactively on a drawing board. A sketch can\
    \ be either a `Shape` object or an `ImageView` object. Besides FXML format, it\
    \ also provides API to save the image of an `ImageView` object to an image file.\n\
    \n    *   [1.1 Create `DrawWriter` Class](#part0007_split_001.html_create-draw-writer)\n\
    \n    *   [1.2 Create JavaFX Nodes in a Scene Graph using FXML](#part0007_split_002.html_create-node-fxml)\n\
    \n    *   [1.3 Complete Source Code of `DrawWriter` Class](#part0007_split_003.html_complete-source-codes-draw-writer)\n\
    \n    *   [1.4 Summary](#part0007_split_004.html_summary)\n\n*   [**Chapter 2**:\
    \ Enhanced Draw Tool with `Draw Loader` Capacity](#part0008_split_000.html_7K4G0-6cbc394105fd4c6ab27dd0d32efbcd86)\n\
    \n    Introduce `DrawLoader` class, resides in `drawtool.io` package, to load\
    \ FXML files as well as image files to a drawing board.\n\n    *   [2.1 Create\
    \ `DrawLoader` Class](#part0008_split_001.html_create-draw-loader)\n\n    *  \
    \ [2.2 Complete Source Code of `DrawLoader` Class](#part0008_split_002.html_complete-source-codes-draw-loader)\n\
    \n    *   [2.3 Summary](#part0008_split_003.html_summary)\n\n*   [**Chapter 3**:\
    \ Enhanced `JFXDrawTools` with `Draw Writer` and `Draw Loader` Capacities](#part0009_split_000.html_8IL20-6cbc394105fd4c6ab27dd0d32efbcd86)\n\
    \n    Integrate sketch saving and loading capabilities into `JFXDrawTools` application.\n\
    \n    *   [3.1 Add `File` Menu to Menu Bar](#part0009_split_001.html_add-file-menu)\n\
    \n    *   [3.2 Generate FXML Files for Drawings Using `DrawWriter` Class](#part0009_split_002.html_generate-fxml)\n\
    \n    *   [3.3 Add `Save FXML` Submenu to `File` Menu](#part0009_split_003.html_add-save-fxml-sub-menu)\n\
    \n    *   [3.4 Load Drawings from FXML Files Using `DrawLoader` Class](#part0009_split_004.html_load-drawing)\n\
    \n    *   [3.5 Add `Open` Submenu to `File` Menu](#part0009_split_005.html_add-open-sub-menu)\n\
    \n    *   [3.6 Bind Stage Title for Displaying FXML File Name](#part0009_split_006.html_bind-stage-title)\n\
    \n    *   [3.7 Add `Action` Menu to Menu Bar](#part0009_split_007.html_add-action-menu)\n\
    \n    *   [3.8 Complete Source Code of `JFXDrawTools` Class](#part0009_split_008.html_complete-source-codes-jfx-draw-tools)\n\
    \n    *   [3.9 Summary](#part0009_split_009.html_summary)\n\n## Why Choose This\
    \ Book\n\nThis book is for software developers who are interested in developing\
    \ GUIs using JavaFX library for rich client applications.\n\nImportant features\
    \ in JavaFX are illustrated by step-by-step development of real world Java applications.\n\
    \nInstructive diagrams are used to help readers capture abstract concepts instantly.\
    \ And all diagrams used in each chapter are created using the graphics tools developed\
    \ in this book series.\n\nThe book series is for you if you are:\n\n*   A Java\
    \ GUI programmer, novice or professional, who is new to JavaFX.\n\n*   A Java\
    \ programmer who has preliminary knowledge of JavaFX and would like to learn how\
    \ to develop interactive sketch drawing tools.\n\n*   A professional software\
    \ engineer who is interested in the development of object oriented JavaFX graphics\
    \ tools and practical applications, along with complete and well-documented source\
    \ code.\n\n## What You Need for This Book\n\nIf you want to compile and run applications\
    \ included in this book, you need to download and install JDK. Here's the website\
    \ to download JDK 8, [http://www.oracle.com/technetwork/java/javase/downloads/index.html](http://www.oracle.com/technetwork/java/javase/downloads/index.html).\n\
    \nTo copy the complete source code from this kindle e-Book, Here's a suggestion:\n\
    \n1.  Install `Calibre`, a free and open source E book Management software, to\
    \ your PC.\n\n2.  Use `Add books` function in `Calibre` to add the .mobi file\
    \ of the e-Book to `Calibre` library.\n\n3.  Open the book from `Calibre` and\
    \ copy the source code to Java files.\n\n#   INTRODUCTION\n\nThis book series\
    \ is a tutorial for software developers to build GUIs of Java applications using\
    \ JavaFX 8 which has become a part of Java™ SE Development Kit 8 (JDK 8).\n\n\
    The primary objective of the book series is to provide a comprehensive handbook,\
    \ which brings forward the frequently used features and the essence of JavaFX.\
    \ The usages of APIs provided in JavaFX packages are illustrated through the step-by-step\
    \ development of a sophisticated graphics toolkit.\n\nComplete source code of\
    \ the graphics toolkit, a set of packages with reusable classes as well as embeddable\
    \ JavaFX applications, is included in the book series. Download and install JDK\
    \ 8 before you compile and run these applications. Here's the website to download\
    \ the latest version of JDK, [http://www.oracle.com/technetwork/java/javase/downloads/index.html](http://www.oracle.com/technetwork/java/javase/downloads/index.html).\n\
    \n## JavaFX History\n\nNow let us glance through the timeline of JavaFX evolving\
    \ history and obtain glimpses of the predecessor of JavaFX:\n\nChris Oliver of\
    \ SeeBeyond Technology Corporation developed a script language called F3, the\
    \ acronym for Form Follows Function; it allows developers accessing Swing classes\
    \ and creating graphics user interfaces (GUIs) for rapid development of rich internet\
    \ applications.\n\nSun Microsystems acquired SeeBeyond in September 2005, F3 renamed\
    \ to JavaFX Script in May 2007.\n\nIn December 2008, JavaFX 1.0 released, developers\
    \ had relied on JavaFX Script to develop JavaFX applications until three years\
    \ later when JavaFX 2.0 released.\n\nIn January 2010, Oracle completed the acquisition\
    \ of Sun Microsystems, and continued maintaining JavaFX.\n\nIn September 2010\
    \ JavaOne conference, Oracle announced JavaFX Script would be discontinued.\n\n\
    In October 2011, JavaFX 2.0 released, developers began to engage in standard Java\
    \ language, instead of JavaFX Script, to access APIs of JavaFX library. However,\
    \ JavaFX SDK and JavaFX Runtime, in addition to Java SE JDK and JRE, must be installed\
    \ for developing and executing applications compiled with JavaFX 2.0.\n\nIn February\
    \ 2013, JavaFX 2.2.7 released, JavaFX SDK and JavaFX Runtime are included within\
    \ JDK/JRE 7\\. The integration of JavaFX and JDK results in great conveniency\
    \ for JavaFX developers. No additional installations are needed for JavaFX applications\
    \ compiled with JDK 7 and later releases.\n\nOn March 18, 2014, JavaFX 8 released\
    \ as part of Java™ SE Development Kit 8 (JDK 8), a major feature release.\n\n\
    As of the publishing of first volume of the book series on March, 2016, the latest\
    \ JDK releases are:\n\nJDK 8u66 on October 20, 2015, and JDK 8u72 on January 2016.\n\
    \nThe schedule of general availability (GA) for JDK 9 is March 23rd, 2017.\n\n\
    ## Prerequisite\n\nJavaFX applications presented in the book series using APIs\
    \ provided in JavaFX packages to build GUIs. Knowledge of Swing packages is not\
    \ a must, however, readers must be familiar with the basics of Java programming\
    \ language. If you are new to Java, visit this website,\n\n[http://docs.oracle.com/javase/tutorial/index.html](http://docs.oracle.com/javase/tutorial/index.html),\
    \ to obtain preliminary knowledge of Java technologies. Read Oracle Java online\
    \ documentation in this order:\n\n1.  Getting Started with Simple Java Application\
    \ \"Hello World!\" and Installations:\n\n    Visit [http://docs.oracle.com/javase/tutorial/getStarted/index.html](http://docs.oracle.com/javase/tutorial/getStarted/index.html)\n\
    \n2.  Concepts and features of the Java Programming Language:\n\n    Visit [http://docs.oracle.com/javase/tutorial/java/index.html](http://docs.oracle.com/javase/tutorial/java/index.html)\n\
    \n3.  Java Collections Framework:\n\n    Visit [http://docs.oracle.com/javase/tutorial/collections/index.html](http://docs.oracle.com/javase/tutorial/collections/index.html)\n\
    \n4.  Essential Java Classes:\n\n    Visit [http://docs.oracle.com/javase/tutorial/essential/index.html](http://docs.oracle.com/javase/tutorial/essential/index.html)\n\
    \n## A Glimpse of JavaFX Applications"
