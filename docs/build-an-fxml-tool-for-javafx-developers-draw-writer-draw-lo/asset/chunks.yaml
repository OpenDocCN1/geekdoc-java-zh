    \n# ABOUT THE AUTHORS\n\n### Shufen Kuo\n\nShufen Kuo relocated to San Francisco\
    \ Bay Area in summer of 1988, and has been a software engineer ever since. She\
    \ has extensive hands-on experience with various platforms, from PC DOS to numerous\
    \ Unix/Linux workstations, and from PC Linux to PC Windows.\n\nShe started writing\
    \ Java programs in 2001. She has been using Abstract Windowing Toolkit (AWT) and\
    \ Swing, the GUI Components of Java Foundation Classes (JFC), to design and develop\
    \ object oriented graphics tools. And since 2012, she has immersed herself in\
    \ JavaFX; exploring its essence inspires her to write books publicizing the strength\
    \ of JavaFX.\n\nBefore developing Java applications, she had more than 12 years\
    \ experience in the development of C/C++ applications on UNIX/Linux/Solaris running\
    \ X Window system.\n\nShufen Kuo got her M.S. in Computer Science from Washington\
    \ State University in 1987.\n\nHer publications include:\n\n\"A Two-Step String\
    \ Matching Procedure,\" Pattern Recognition, 24(7), 711-716, 1991.\n"
