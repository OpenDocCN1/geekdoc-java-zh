- fmt: "\n# JavaFX Web Engine Component\n\nThere is a web engine component embedded\
    \ in JavaFX architecture and providing a set of APIs, located in the `javafx.scene.web`\
    \ package, for developing applications with functionality of a web browser. \n\
    \nTo view a web page, first you create a `WebView` object which extends `javafx.scene.Parent`\
    \ and inherits all the features of a node, then obtain the `WebEngine` that associates\
    \ with it. The `WebEngine` provides methods relevant to manipulating a web page,\
    \ such as: loading/displaying the web page (either by a given url or content of\
    \ the page), accessing the Document Object Model (DOM) created by `WebEngine`\
    \ for the loaded web page, handling a variety of events initiated from JavaScript,\
    \ etc.\n\n## Reference to Oracle Online Documentation \"JavaFX: Adding HTML Content\
    \ to JavaFX Applications\"\n\n[http://docs.oracle.com/javase/8/javafx/embedded-browser-tutorial/index.html]\n\
    \n## HTML Editing Capabilities\n\n### HTMLEditor Class for Editing HTML Pages\n\
    \nThe full support of HTML editing ability comes from the `HTMLEditor` class,\
    \ which extends `javafx.scene.control.Control` and resides in the `javafx.scene.web`\
    \ package. To embed an HTML editor into your JavaFX application, you simply create\
    \ an instance of `HTMLEditor`, add it to a scene graph, then it is ready to interact\
    \ with users. \n\nThe following two methods are useful to get and set the HTML\
    \ content of the editor: `getHtmlText()` and `setHtmlText(java.lang.String htmlText)`.\n\
    \nUnlike the similar control `TextArea` that handles multiple lines of plain text,\
    \ the `HTMLEditor` formats text that complies with HTML syntax.\n\nThe usage of\
    \ the HTML editor is widely required in various fields of software, for example:\n\
    - Bloggers writing articles to post (content management system)\n- Users of an\
    \ Email System composing messages (messaging system)\n- Online sellers preparing\
    \ product descriptions for listing (e-commence management system)\n\n## Reference\
    \ to Oracle Online Documentation \"JavaFX: Working with JavaFX UI Components --\
    \ HTML Editor\"\n\n[http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm]\n\
    \n## Chart Components for Rendering Data\n\nThe following classes are located\
    \ in `javafx.scene.chart` packages for drawing various types of charts:\n- `AreaChart`,\
    \ `StackedAreaChart`\n- `BarChart`, `StackedBarChart`\n- `BubbleChart`\n- `LineChart`\n\
    - `PieChart`\n- `ScatterChart`\n\nThe `Chart` class, the base class for all chart\
    \ components, extends the `javafx.scene.layout.Region` class, and thus inherits\
    \ all applicable features from the `javafx.scene.Node` class.\n\n## Reference\
    \ to Oracle Online Documentation \"JavaFX: Working with JavaFX UI Components --\
    \ Working with JavaFX Charts\"\n\n[http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm]\n\
    \n## MediaView Class for Playing Media\n\nThe `MediaView` class, which extends\
    \ `javafx.scene.Node`, is used along with `MediaPlayer` and `Media` classes to\
    \ play media in your JavaFX applications. All media related classes reside in\
    \ the `javafx.scene.media` package.\n\n## Reference to Oracle Online Documentation\
    \ \"JavaFX: Incorporating Media Assets Into JavaFX Applications\"\n\n[http://docs.oracle.com/javase/8/javafx/media-tutorial/]\n\
    \n# JavaFX Fundamental UI Components\n\nIn addition to the Essence of JavaFX described\
    \ above, JavaFX provides fundamental UI components residing in the `javafx.scene.control`\
    \ package. These are derived from the `javafx.scene.control.Control` class and\
    \ are often called UI controls.\n\nHere are available UI controls (the ones not\
    \ marked with an asterisk `*` have their resemblant counterparts in Swing):\n\
    - `Label`, `Button`, `RadioButton`, `ToggleButton`\n- `CheckBox`, `ChoiceBox`\n\
    - `ComboBox`, `ListView`, `TableView`\n- `TextField`, `TextArea`, `PasswordField`,\
    \ `HTMLEditor`\n- `ScrollBar`, `ScrollPane`, `Slider`, `ProgressBar`, `ProgressIndicator`,\
    \ `ToolBar`\n- `MenuBar`, `MenuButton`, `SplitMenuButton`\n- `ColorPicker`, `DatePicker`,\
    \ `Separator`, `Pagination`, `SplitPane`, `TitledPane`, `Accordion`, `TreeView`,\
    \ `TreeTableView`, `Hyperlink`\n\nThe following UI components are usually described\
    \ in the same category with the above UI controls:\n- `Tooltip`: Resides in the\
    \ `javafx.scene.control` package, but is derived from the `javafx.scene.control.PopupControl`\
    \ class.\n- `MenuItem`, `Menu`, `CheckMenuItem`, `RadioMenuItem`: Reside in the\
    \ `javafx.scene.control` package. The `MenuItem` which extends `java.lang.Object`\
    \ is the base class of the rest three.\n- `FileChooser`: Resides in the `javafx.stage`\
    \ package and extends `java.lang.Object`.\n\n## Reference to Oracle Online Documentation\
    \ \"JavaFX: Working with JavaFX UI Components\"\n\n[http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/ui.htm]\n"
