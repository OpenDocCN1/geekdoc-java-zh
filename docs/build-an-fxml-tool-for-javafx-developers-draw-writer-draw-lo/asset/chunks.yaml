  trans: "\n\n## 1.2 使用 FXML 在场景图中创建 JavaFX 节点\n\n我们将详细阐述 `draw.io` 包中提供的 API 的用法，该包包含了\
    \ `draw` 类，当 `File` 是时。\n\n在本节中，我们将介绍如何在 JavaFX 中创建 `Line`、`Polyline`、`Path` 等。我们还展示了如何在\
    \ `第 2 节` 中使用 `ImageView` 来显示图像。\n\n### 1.2.1 将 `ImageView` 写入文件\n\n将 `ImageView`\
    \ 的图像写入图像文件。我们不使用 `image` 属性中指定的图像，而是应用 `snapshot` 方法来获取图像，这样做是为了让图像符合变换效果。\n\n\
    `ImageView` 的 `image` 属性中指定的仍然是原始图像，并未与已应用的变换同步。对 `ImageView` 进行 `Snapshot` 会得到一个符合变换的图像，然后调用\
    \ `writeImage` 将图像保存为支持的图像格式的文件。\n\n重要说明：如果 `ImageView` 在其 `clip` 属性中指定了 `clip`，该方法同样运行良好。\n\
    \n```java\npublic void writeImageView(ImageView iv, File file) {\n  Bounds bP\
    \ = iv.getBoundsInParent();\n  Double minX = bP.getMinX();\n  Double minY = bP.getMinY();\n\
    \  Double w = bP.getWidth();\n  double h = bP.getHeight();\n  Rectangle2D vp =\
    \ new Rectangle2D(minX, minY, w, h);\n  SnapshotParameters parameters = new SnapshotParameters();\n\
    \  parameters.setViewport(vp);\n  parameters.setFill(Color.TRANSPARENT);\n  Image\
    \ image = iv.snapshot(parameters, null);\n  writeImage(image, file);\n}\n```\n\
    \n此方法从 `writeImageView` 调用，将 `ImageView` 的图像保存到图像文件中。应用 `ImageIO.write` 方法将 JavaFX\
    \ `Image` 写入文件。经过测试，`ImageIO.write` 仅适用于 `png` 和 `gif` 格式。`ImageIO.write` 不支持这些格式：`jpg`、`jpeg`、`bmp`。\n\
    \n该方法首先检查给定文件的扩展名是否匹配目标格式（`png|gif`），如果不匹配，则拼接默认格式（`.png`）。\n\n```java\npublic\
    \ File writeImage(Image img, File file) {\n  // check if the given file extension\
    \ matches preferred\n  // image format string : (png|gif)\n  String formatName\
    \ = getFormatName(file);\n  if (formatName == null) {\n    // the given file does\
    \ not ends with preferred image format\n    // use \"png\" as format\n    formatName\
    \ = \"png\"; // default format name\n    file = getImageFile(file, formatName);\n\
    \  }\n  writeFXImage(img, formatName, file);\n  return file;\n}\n```\n\n应用 `ImageIO.write`\
    \ 方法将 JavaFX `Image` 写入文件。注意：`ImageIO.write` 无法保存 `jpg`、`jpeg`、`bmp`。\n\n```java\n\
    void writeFXImage(Image img, String formatName, File imgFile) {\n  try {\n   \
    \ boolean succeed = ImageIO.write(\n       SwingFXUtils.fromFXImage(img, null),\
    \ formatName, imgFile);\n    if (!succeed)\n        System.out.println(\"ImageIO.write\
    \ failed\");\n  } catch (IOException e) {\n    System.out.println(e.getMessage());\n\
    \  }\n}\n```\n\n针对 Java 8+ 的说明：测试 `jpg`、`jpeg`、`bmp` 是否。此方法检查文件是否具有目标扩展名：`png`\
    \ 或 `gif`，如果扩展不是目标图像格式，则返回 `null`，否则返回图像格式。\n\n```java\nString getFormatName(File\
    \ f) {\n  String formatName = null; // Initialize to null\n  // supported image\
    \ format in regular expression\n  //String reg = \"(png|gif|jpg|jpeg|bmp)\";\n\
    \  // It would be nice to support jpg format\n  // however,\n  // jpg, jpeg and\
    \ bmp not supported in \n  //IO.write\n  String reg = \"(png|gif)\";\n  String\
    \ s = f.getName();\n  int i = s.lastIndexOf('.');\n\n  if (i > 0 && i < s.length())\
    \ {\n    String ext = s.substring(i + 1).toLowerCase();\n    if (ext.matches(reg))\
    \ {\n        formatName = ext;\n    }\n  }\n  return formatName;\n}\n```\n\n此方法从\
    \ `writeImageView` 调用，将 `ImageView` 的图像保存到图像文件中。目标格式。如果文件没有扩展名。\n\n```java\nFile\
    \ getImageFile(File file, String formatName) {\n  String s = file.getName();\n\
    \  int i = s.lastIndexOf('.');\n  if (i > 0 && i < s.length()) {\n    // replace\
    \ whatever\n    s = s.substring(0, i);\n    File p = new File(file.getParent(),\
    \ s + \".\" + formatName);\n    return p;\n  } else {\n    // file exist\n   \
    \ return new File(file.getParent(), s + \".\" + formatName);\n  }\n}\n```\n\n"
- fmt: "\n![](images/00016.jpeg \"example_polyline.jpg\")\n\n### 1.2.3 Create `Polygon`\
    \ Shaped like Arrow in FXML\n\nThe following listing shows FXML markup which creates\
    \ a `Pane` as root node of a scene graph, and a `Polygon` composed of 6 line segments,\
    \ given 6 points: (50.0, 20.0), (220.0, 170.0), (50.0, 320.0), (50.0, 250.0),\
    \ (140.0, 170.0), (50.0, 90.0).\n\nListing 1-17. Create a `Polygon` composed of\
    \ 6 line segments, given 6 points:\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\" standalone=\"no\"?>\n<?import java.lang.*?>\n<?import javafx.scene.layout.*?>\n\
    <?import javafx.scene.shape.*?>\n<Pane xmlns:fx=\"http://javafx.com/fxml\">\n\
    \  <children>\n        <Polygon fill=\"#B3E6E6\" stroke=\"#000000\">\n       \
    \   <points>\n            <Double fx:value=\"50.0\"/>\n            <Double fx:value=\"\
    20.0\"/>\n            <Double fx:value=\"220.0\"/>\n            <Double fx:value=\"\
    170.0\"/>\n            <Double fx:value=\"50.0\"/>\n            <Double fx:value=\"\
    320.0\"/>\n            <Double fx:value=\"50.0\"/>\n            <Double fx:value=\"\
    250.0\"/>\n            <Double fx:value=\"140.0\"/>\n            <Double fx:value=\"\
    170.0\"/>\n            <Double fx:value=\"50.0\"/>\n            <Double fx:value=\"\
    90.0\"/>\n          </points>\n        </Polygon>\n      </children>\n</Pane>\n\
    ```\n\nA `Polygon` from above FXML markup is rendered as below:\n\nFigure 1-11.\
    \ Show a polygon in arrow shape from above FXML markup.\n\n![](images/00017.jpeg\
    \ \"example_polygon.jpg\")\n\n### 1.2.4 Create `Path` Formed a Chinese Character\
    \ in FXML\n\nThe following listing shows FXML markup which creates a `Pane` as\
    \ root node of a scene graph, and a `Path` composed of a `MoveTo`, a `HLineTo`,\
    \ a `QuadCurveTo`, and a `LineTo`. It takes 3 strokes to draw the path, in which\
    \ the end point of first stroke is the start point of second stroke, and the end\
    \ point of second stroke is the start point of third stroke.\n\nListing 1-18.\
    \ Create a `Path` composed of 4 `PathElement`s (3 strokes in total):\n\n```xml\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<?import javafx.scene.layout.*?>\n\
    <?import javafx.scene.shape.*?>\n<Pane xmlns:fx=\"http://javafx.com/fxml\">\n\
    \  <children>\n        <Path stroke=\"#A0522D\" strokeLineCap=\"ROUND\" strokeLineJoin=\"\
    BEVEL\"\n              strokeWidth=\"8.0\">\n          <elements>\n          \
    \  <MoveTo x=\"120.0\" y=\"87.0\"/>\n            <HLineTo x=\"195.0\"/>\n    \
    \        <QuadCurveTo controlX=\"36.0\" controlY=\"201.0\" x=\"205.0\" y=\"170.0\"\
    />\n            <LineTo x=\"209.0\" y=\"149.0\"/>\n          </elements>\n   \
    \     </Path>\n      </children>\n</Pane>\n```\n\nA `Path` from above FXML markup\
    \ is rendered as below:\n\nFigure 1-12. Show a path from above FXML markup; it's\
    \ a Chinese character 乙 composed of 3 strokes.\n\n![](images/00018.jpeg \"example_path_2.jpg\"\
    )\n\nPlease notice that four attributes presented within the `<path>` element\
    \ produce distinct visual outcome on the path:\n\n`stroke`\n\nSpecify a color\
    \ to paint the border of a shape. Default value is `Color.BLACK` for a path.\n\
    \n`strokeWidth`\n\nSpecify the width of stroke.\n\n`strokeLineCap`\n\nSpecify\
    \ end cap style of a line, with one of these valid values: `BUTT`, `ROUND`, and\
    \ `SQUARE`. Default value is `SQUARE`.\n\n`strokeLineJoin`\n\nSpecify join style\
    \ between lines, with one of these valid values: `BEVEL`, `MITER`, and `ROUND`.\
    \ Default value is `MITER`.\n\nThe following illustrates how `strokeLineCap` and\
    \ `strokeLineJoin` affect the visual rendering of lines:\n\nFigure 1-13. Show\
    \ 3 `Path` objects with different attributes set on `strokeLineCap` and `strokeLineJoin`\
    \ respectively.\n\n![](images/00019.jpeg \"path_3_text.jpg\")\n\nHere's FXML markup\
    \ which creates 3 `Path` objects rendered as above.\n\nListing 1-19. Create a\
    \ `Path` composed of 4 `PathElement`s (3 strokes in total):\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<?import javafx.scene.layout.*?>\n\
    <?import javafx.scene.shape.*?>\n<Pane xmlns:fx=\"http://javafx.com/fxml\">\n\
    \  <children>\n        <Path stroke=\"#A0522D\" strokeLineCap=\"ROUND\" strokeLineJoin=\"\
    BEVEL\"\n              strokeWidth=\"8.0\">\n          <elements>\n          \
    \  <MoveTo x=\"120.0\" y=\"87.0\"/>\n            <HLineTo x=\"195.0\"/>\n    \
    \        <QuadCurveTo controlX=\"36.0\" controlY=\"201.0\" x=\"205.0\" y=\"170.0\"\
    />\n            <LineTo x=\"209.0\" y=\"149.0\"/>\n          </elements>\n   \
    \     </Path>\n      </children>\n</Pane>\n```\n\n### 1.2.5 Create `SVGPath` in\
    \ Terms of `M`, `H`, `Q`, `L` Instructions\n\nNow, we'll use the same example,\
    \ presented in [Listing 1-18](#part007_split_002.html-create-path), to illustrate\
    \ `SVGPath`. Here's FXML markup which creates the same shape shown in [Figure\
    \ 1-12](#part007_split_002.html-figure-char) using `SVGPath`.\n\nListing 1-20.\
    \ Create `SVGPath` produces the same shape shown in [Figure 1-12](#part007_split_002.html-figure-char):\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<?import\
    \ javafx.scene.layout.*?>\n<?import javafx.scene.shape.*?>\n<Pane xmlns:fx=\"\
    http://javafx.com/fxml\">\n  <children>\n        <SVGPath content=\"M 120 87 H\
    \ 195 Q 36 201 205 170 L 209 149\"\n          fill=\"#00000000\" stroke=\"#A0522D\"\
    \n          strokeLineCap=\"ROUND\" strokeLineJoin=\"BEVEL\" strokeWidth=\"8.0\"\
    >\n        </SVGPath>\n      </children>\n</Pane>\n```\n\nThe `content` attribute\
    \ inside the `<SVGPath>` element specifies path data in a `String`. In our example,\
    \ the following instructions are used: `M` (moveto), `H` (horizontal `lineto`),\
    \ `Q` (quadratic Bézier `curveto`), `L` (`lineto`).\n\n### 1.2.6 Create `Rectangle`\
    \ Filled with `RadialGradient` in FXML\n\nThe following listing shows FXML markup\
    \ which creates a `Pane` as root node of a scene graph, and a `Rectangle` as its\
    \ child node. `arcWidth` and `arcHeight` are attributes specifies dimensions of\
    \ arcs at the four corner of a rounded rectangle. And a `RadialGradient` instance\
    \ is created to fill the interior of the rectangle.\n"
  raw: "    ![](images/00016.jpeg \"example_polyline.jpg\")\n\n    ### 1.2.3 Create\
    \ `Polygon` Shaped like Arrow in FXML\n\n    The following listing shows FXML\
    \ markup which creates a `Pane` as root node of a scene graph, and a `Polygon`\
    \ composed of 6 line segments, given 6 points: (50.0, 20.0), (220.0, 170.0), (50.0,\
    \ 320.0), (50.0, 250.0), (140.0, 170.0), (50.0, 90.0).\n\n    Listing 1-17. Create\
    \ a `Polygon` composed of 6 line segments, given 6 points:\n\n    ```\n    <?xml\
    \ version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n    <?import java.lang.*?>\n\
    \    <?import javafx.scene.layout.*?>\n    <?import javafx.scene.shape.*?>\n \
    \   <Pane xmlns:fx=\"http://javafx.com/fxml\">\n      <children>\n        <Polygon\
    \ fill=\"#B3E6E6\" stroke=\"#000000\">\n          <points>\n            <Double\
    \ fx:value=\"50.0\"/>\n            <Double fx:value=\"20.0\"/>\n            <Double\
    \ fx:value=\"220.0\"/>\n            <Double fx:value=\"170.0\"/>\n           \
    \ <Double fx:value=\"50.0\"/>\n            <Double fx:value=\"320.0\"/>\n    \
    \        <Double fx:value=\"50.0\"/>\n            <Double fx:value=\"250.0\"/>\n\
    \            <Double fx:value=\"140.0\"/>\n            <Double fx:value=\"170.0\"\
    />\n            <Double fx:value=\"50.0\"/>\n            <Double fx:value=\"90.0\"\
    />\n          </points>\n        </Polygon>\n      </children>\n    </Pane>\n\
    \    ```\n\n    A `Polygon` from above FXML markup is rendered as below:\n\n \
    \   Figure 1-11. Show a polygon in arrow shape from above FXML markup.\n\n   \
    \ ![](images/00017.jpeg \"example_polygon.jpg\")\n\n    ### 1.2.4 Create `Path`\
    \ Formed a Chinese Character in FXML\n\n    The following listing shows FXML markup\
    \ which creates a `Pane` as root node of a scene graph, and a `Path` composed\
    \ of a `MoveTo`, a `HLineTo`, a `QuadCurveTo`, and a `LineTo`. It takes 3 strokes\
    \ to draw the path, in which the end point of first stroke is the start point\
    \ of second stroke, and the end point of second stroke is the start point of third\
    \ stroke.\n\n    Listing 1-18. Create a `Path` composed of 4 `PathElement`s (3\
    \ strokes in total):\n\n    ```\n    <?xml version=\"1.0\" encoding=\"UTF-8\"\
    \ standalone=\"no\"?>\n    <?import javafx.scene.layout.*?>\n    <?import javafx.scene.shape.*?>\n\
    \    <Pane xmlns:fx=\"http://javafx.com/fxml\">\n      <children>\n        <Path\
    \ stroke=\"#A0522D\" strokeLineCap=\"ROUND\" strokeLineJoin=\"BEVEL\"\n      \
    \        strokeWidth=\"8.0\">\n          <elements>\n            <MoveTo x=\"\
    120.0\" y=\"87.0\"/>\n            <HLineTo x=\"195.0\"/>\n            <QuadCurveTo\
    \ controlX=\"36.0\" controlY=\"201.0\" x=\"205.0\" y=\"170.0\"/>\n           \
    \ <LineTo x=\"209.0\" y=\"149.0\"/>\n          </elements>\n        </Path>\n\
    \      </children>\n    </Pane>\n    ```\n\n    A `Path` from above FXML markup\
    \ is rendered as below:\n\n    Figure 1-12. Show a path from above FXML markup;\
    \ it's a Chinese character 乙 composed of 3 strokes.\n\n    ![](images/00018.jpeg\
    \ \"example_path_2.jpg\")\n\n    Please notice that four attributes presented\
    \ within the `<path>` element produce distinct visual outcome on the path:\n\n\
    \    `stroke`\n\n    Specify a color to paint the border of a shape. Default value\
    \ is `Color.BLACK` for a path.\n\n    `strokeWidth`\n\n    Specify the width of\
    \ stroke.\n\n    `strokeLineCap`\n\n    Specify end cap style of a line, with\
    \ one of these valid values: `BUTT`, `ROUND`, and `SQUARE`. Default value is `SQUARE`.\n\
    \n    `strokeLineJoin`\n\n    Specify join style between lines, with one of these\
    \ valid values: `BEVEL`, `MITER`, and `ROUND`. Default value is `MITER`.\n\n \
    \   The following illustrates how `strokeLineCap` and `strokeLineJoin` affect\
    \ the visual rendering of lines:\n\n    Figure 1-13. Show 3 `Path` objects with\
    \ different attributes set on `strokeLineCap` and `strokeLineJoin` respectively.\n\
    \n    ![](images/00019.jpeg \"path_3_text.jpg\")\n\n    Here's FXML markup which\
    \ creates 3 `Path` objects rendered as above.\n\n    Listing 1-19. Create a `Path`\
    \ composed of 4 `PathElement`s (3 strokes in total):\n\n    ```\n    <?xml version=\"\
    1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n    <?import javafx.scene.layout.*?>\n\
    \    <?import javafx.scene.shape.*?>\n    <Pane xmlns:fx=\"http://javafx.com/fxml\"\
    >\n      <children>\n        <Path stroke=\"#A0522D\" strokeLineCap=\"ROUND\"\
    \ strokeLineJoin=\"BEVEL\"\n          strokeWidth=\"8.0\">\n          <elements>\n\
    \            <MoveTo x=\"120.0\" y=\"87.0\"/>\n            <HLineTo x=\"195.0\"\
    />\n            <QuadCurveTo controlX=\"36.0\" controlY=\"201.0\" x=\"205.0\"\
    \ y=\"170.0\"/>\n            <LineTo x=\"209.0\" y=\"149.0\"/>\n          </elements>\n\
    \        </Path>\n        <Path stroke=\"#A0522D\" strokeLineCap=\"BUTT\" strokeLineJoin=\"\
    ROUND\"\n          strokeWidth=\"8.0\" translateX=\"143.0\">\n          <elements>\n\
    \            <MoveTo x=\"120.0\" y=\"87.0\"/>\n            <HLineTo x=\"195.0\"\
    />\n            <QuadCurveTo controlX=\"36.0\" controlY=\"201.0\" x=\"205.0\"\
    \ y=\"170.0\"/>\n            <LineTo x=\"209.0\" y=\"149.0\"/>\n          </elements>\n\
    \        </Path>\n        <Path stroke=\"#A0522D\" strokeLineCap=\"SQUARE\" strokeLineJoin=\"\
    MITER\"\n          strokeWidth=\"8.0\" translateX=\"286.0\">\n          <elements>\n\
    \            <MoveTo x=\"120.0\" y=\"87.0\"/>\n            <HLineTo x=\"195.0\"\
    />\n            <QuadCurveTo controlX=\"36.0\" controlY=\"201.0\" x=\"205.0\"\
    \ y=\"170.0\"/>\n            <LineTo x=\"209.0\" y=\"149.0\"/>\n          </elements>\n\
    \        </Path>\n      </children>\n    </Pane>\n    ```\n\n    ### 1.2.5 Create\
    \ `SVGPath` in Terms of `M`, `H`, `Q`, `L` Instructions in FXML\n\n    Now, we'll\
    \ use the same example, presented in [Listing 1-18](#part0007_split_002.html_listing-path-chinese-char)\
    \ from Section [1.2.4 Create `Path` Formed a Chinese Character in FXML](#part0007_split_002.html_create-path),\
    \ to illustrate a `SVGPath`. Here's FXML markup which creates the same shape shown\
    \ in [Figure 1-12](#part0007_split_002.html_figure-chinese-char) using `SVGPath`.\n\
    \n    Listing 1-20. Create a `SVGPath` produces the same shape shown in [Figure\
    \ 1-12](#part0007_split_002.html_figure-chinese-char):\n\n    ```\n    <?xml version=\"\
    1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n    <?import javafx.scene.layout.*?>\n\
    \    <?import javafx.scene.shape.*?>\n    <Pane xmlns:fx=\"http://javafx.com/fxml\"\
    >\n      <children>\n        <SVGPath content=\"M 120 87 H 195 Q 36 201 205 170\
    \ L 209 149\"\n          fill=\"#00000000\" stroke=\"#A0522D\"\n          strokeLineCap=\"\
    ROUND\" strokeLineJoin=\"BEVEL\" strokeWidth=\"8.0\">\n        </SVGPath>\n  \
    \    </children>\n    </Pane>\n    ```\n\n    The `content` attribute inside the\
    \ `<SVGPath>` element specifies path data in a `String`. In our example, the following\
    \ instructions are used: `M` (`moveto`), `H` (horizontal `lineto`), `Q` (quadratic\
    \ Bézier `curveto`), `L` (`lineto`). To learn details about syntax of path data,\
    \ read online documentation at here: [http://www.w3.org/TR/SVG/paths.html](http://www.w3.org/TR/SVG/paths.html)\n\
    \n    And for specification about the features and syntax for Scalable Vector\
    \ Graphics (SVG) visit here: [http://www.w3.org/TR/SVG](http://www.w3.org/TR/SVG)\n\
    \n    ### 1.2.6 Create `Rectangle` Filled with `RadialGradient` in FXML\n\n  \
    \  The following listing shows FXML markup which creates a `Pane` as root node\
    \ of a scene graph, and a `Rectangle` as its child node. `arcWidth` and `arcHeight`\
    \ are attributes specifies dimensions of arcs at the four corner of a rounded\
    \ rectangle. And a `RadialGradient` instance is created to fill the interior of\
    \ the rectangle.\n\n    Listing 1-21. Create a rounded `Rectangle` filled with\
    \ `RadialGradient`:"
