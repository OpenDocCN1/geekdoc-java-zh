  trans: "\n在命令行编译 `drawtool` 库：\n\n```\nMicrosoft Windows [Version 6.3.9600]\n(c)\
    \ 2013 Microsoft Corporation. All rights reserved.\n\nF:\\My Documents\\DocRoot\\\
    SHUFEN_JAVA\\MyBookJFX\\VolumeFour\\DrawTool1.4\\src\\example1>\njavac  -encoding\
    \ utf-8 -Xlint:unchecked drawtool\\*.java\n\njavac  -encoding utf-8 -Xlint:unchecked\
    \ drawtool\\io\\*.java\n\njavac  -encoding utf-8 -Xlint:unchecked drawtool\\shape\\\
    *.java\n\njavac  -encoding utf-8 -Xlint:unchecked -cp . drawtool\\drawer\\*.java\n\
    \njar cf drawtool.jar drawtool resource\n```\n\n## 1.4 总结\n\n本介绍了 JavaFX 库的以下关键方面，按照它们在章节中出现的顺序列出：\n\
    \n*   `SwingFXUtils` 类位于 `javafx.embed.swing` 包，并提供了在 JavaFX `Image` 和 Swing/AWT\
    \ `Image` 之间进行类型转换的方法：\n    `static BufferedImage fromFXImage(Image img, BufferedImage\
    \ bimg)`\n    `static WritableImage toFXImage(BufferedImage bimg, WritableImage\
    \ wimg)`\n    (参见章节 实现 `writeImageView` 方法)\n\n*   `Image` 类继承自 `java.lang.Object`\
    \ 并位于 `javafx.scene.image` 包，用于加载图像。可以通过向构造函数传递字符串 `url` 或 `InputStream` 来构造 `Image`。使用\
    \ `ImageView` 对象来显示 `Image`。\n    (参见章节 实现 `writeImageView` 方法)\n\n*   `WritableImage\
    \ snapshot(SnapshotParameters params, WritableImage image)` 方法定义在 `Node` 类中，用于对节点（无论是否是场景的一部分）进行快照。它返回一个\
    \ `WritableImage`，它是 `javafx.scene.image.Image` 的直接子类。\n    (参见章节 实现 `writeImageView`\
    \ 方法)\n\n*   `ImageView` 类继承自 `javafx.scene.Node` 并位于 `javafx.scene.image` 包，用于显示图像。可以通过向构造函数传递\
    \ String 类型的 `url` 或一个 `Image` 来构造 `Image`。\n    (参见章节 实现 `writeImageView` 方法)\n\
    \n*   `SnapshotParameters` 类继承自 `java.lang.Object` 并位于 `javafx.scene` 包；它提供了用于为\
    \ `javafx.scene.Node` 设置快照参数的工具类，例如：\n    `setFill(Paint fill)`\n    `setViewport(Rectangle2D\
    \ viewport)`\n    (参见 `writeImageView` 方法的完整源代码)\n\n*   `Bounds` 是一个抽象类，位于 `javafx.geometry`\
    \ 包，定义了操作矩形区域、测量坐标和尺寸的工具：`minX`, `minY`, `maxX`, `maxY`, `width`, `height`。\n\
    \    (参见章节：利用 `boundsInLocal` 和 `boundsInParent`, 利用 `layoutBounds`)\n\n*   `boundsInLocal`\
    \ 是类型为 `ReadOnlyObjectProperty<Bounds>` 的属性，定义在 `Node` 类中，指定一个 `Bounds` 对象，表示\
    \ `Node` 的矩形边界区域，而不考虑应用在其上的任何变换。\n    (参见章节：利用 `boundsInLocal` 和 `boundsInParent`,\
    \ 利用 `layoutBounds`)\n\n*   `boundsInParent` 是类型为 `ReadOnlyObjectProperty<Bounds>`\
    \ 的属性，定义在 `Node` 类中，指定一个 `Bounds` 对象，表示 `Node` 的矩形边界区域，并了应用在其上的所有变换，如 `translate`、`scale`、`rotate`\
    \ 等。\n    (参见章节：利用 `boundsInLocal` 和 `boundsInParent`, 利用 `layoutBounds`)\n\n\
    *   `layoutBounds` 是定义在 `Node` 类中的类型为 `ReadOnlyObjectProperty<Bounds>` 的属性，它指定的\
    \ `Bounds` 对象不考虑这些属性：`effect`, `clip`, `scaleX`, `scaleY`, `rotate`, `translateX`,\
    \ `translateY`, `layoutX`, `layoutY`；它还排除了任何应用到 `Node` 的 `Transform` 对象。\n   \
    \ (参见章节 利用 `layoutBounds`)\n\n*   `RadialGradient` 类位于 `javafx.scene.paint` 包，是\
    \ `Paint` 的直接子类。\n\n*   `LinearGradient` 类位于 `javafx.scene.paint` 包，是 `Paint`\
    \ 的直接子类。\n\n*   `CycleMethod` 类是一个枚举类型，位于 `javafx.scene.paint` 包，与 `LinearGradient`\
    \ 和 `RadialGradient` 配合使用。它定义了 `CycleMethod.NO_CYCLE`, `CycleMethod.REFLECT`,\
    \ 和 `CycleMethod.REPEAT`。\n\n*   `Stop` 类位于 `javafx.scene.paint` 包，与 `LinearGradient`\
    \ 和 `RadialGradient` 配合使用。创建一个 `Stop` 实例需要两个参数：`offset` 和 `color`。\n\n# 第 2 章\
    \ 增强 Draw Tool\n\n## 开发 Drawing Tools V1.4 (部分 2)\n\n### 前言\n\n在本章中，我们将介绍位于 `javafx.io`\
    \ 的 `DrawLoader` 类，用于将 FXML 文件和图像加载到画布中。通过 `Drawing Tools V1.4 (部分 2)` 的详细描述和示例代码，你将熟悉\
    \ JavaFX 库在总结 部分的功能。\n\n`Drawing Tools V1.4 (部分 2)` 的完整开发过程包含以下步骤：\n\n*   2.1\
    \ 创建 `DrawLoader` 类\n    *   2.1.1 实现 `loadFXML` 方法\n    *   2.1.2 实现 `loadImage`\
    \ 方法\n*   2.2 `DrawLoader` 类的完整代码\n*   2.3 总结\n\n## 2.1 创建 `DrawLoader` 类\n\n\
    `DrawLoader` 类位于 `drawtool.io` 包，并提供了直观的高级 API 来加载 FXML 文件和图像。源是一个 `File` 实例。如果是图像文件，将创建一个\
    \ `ImageView` 对象，并将加载的图像设置到 `image` 属性。如果是 FXML 文件，无论是手动编码的还是通过 `DrawWriter` 类提供的\
    \ API 程序生成的（参见前一章节），那么从文件中加载的根节点将被添加到给定的绘图面板 中。\n\n### 2.1.1 实现 `loadFXML` 方法\n\
    \n`DrawLoader` 类提供了两个 `loadFXML` 方法：\n\n```\n public ObservableList<Node> loadFXML(File\
    \ file, Pane pane)\n  public ObservableList<Node> loadFXML(File file)\n```\n\n\
    1.  `public ObservableList<Node> loadFXML(File file, Pane pane)`\n"
- fmt: "\n### Description\nLoad an FXML file and add descendants of the root node,\
    \ or root node itself, to the children list of the specified pane. And if the\
    \ root node loaded from the specified file is a `Pane` possessing a map of properties,\
    \ retrievable using the `getProperties()` method defined in `Node` class, elements\
    \ in entry set of the map are added to the map of properties of the given pane.\n\
    \n### 1. `public ObservableList<Node> loadFXML(File file)`\n\nLoad the given FXML\
    \ file and return descendants of the root node, or root node itself, in a list.\n\
    \nPlease notice that, we check whether the root node of a scene graph stored in\
    \ an FXML file belongs to these types:\n\n1. `Pane`\n2. `Group`\n\nIf it is not,\
    \ then the root node itself, instead of its descendants, is returned to the caller\
    \ in a list.\n\nThe `FXMLLoader` class extends `java.lang.Object` and resides\
    \ in `javafx.fxml` package, providing functionality to load FXML documents. Here's\
    \ the static method, defined in `FXMLLoader` class, used inside our `loadFXML`\
    \ methods:\n\n```\npublic static <T> T load(URL location)\n                 throws\
    \ IOException \n```\n\nHere's complete source code of our `loadFXML` methods:\n\
    \nImport Statements:\n\n```\nimport java.io.File;\nimport java.io.IOException;\n\
    import java.net.MalformedURLException;\nimport java.net.URL;\nimport java.util.*;\n\
    import javafx.collections.*;\nimport javafx.fxml.FXMLLoader;\nimport javafx.scene.Group;\n\
    import javafx.scene.Node;\nimport javafx.scene.layout.Pane;\n```\n\nListing 2-1.\
    \ Define `loadFXML` methods:\n\n```java\n /**\n   * Load FXML file to obtain root\
    \ node of a scene graph\n   * If root node is a Pane or a Group,\n   * add its\
    \ descendants to children list of the given pane \n   * If it is not a Pane or\
    \ a Group,\n   * add root node itself to the children list of the given pane \n\
    \   * And if root node is a pane,\n   * we add its properties (a map) to the given\
    \ pane as well\n   */\n  public ObservableList<Node> loadFXML(File file, Pane\
    \ pane) {\n    try {\n      // get URL from File\n      URL url = file.toURI().toURL();\n\
    \      Node root = FXMLLoader.load(url);\n\n      ObservableList<Node> nodeList\
    \ = getRootDescendant(root);\n      pane.getChildren().addAll(nodeList);\n\n \
    \     ObservableMap<Object, Object> map = root.getProperties();\n      // add\
    \ properties (a map) to pane if root is a pane\n      if (root instanceof Pane)\
    \ {\n        Iterator<Map.Entry<Object, Object>> it = map.entrySet().iterator();\n\
    \        while (it.hasNext()) {\n          Map.Entry<Object, Object> e = it.next();\n\
    \          pane.getProperties().put(e.getKey(), e.getValue());\n        }\n  \
    \    }      \n      return nodeList;\n    } catch(MalformedURLException e) {\n\
    \      System.out.println(e);\n    } catch(IOException e) {\n      System.out.println(e);\n\
    \    }     \n    // return an empty list\n    return FXCollections.observableArrayList();\
    \     \n  }\n\n  /**\n   * Load FXML file to obtain root node of a scene graph\n\
    \   * If root node is a Pane or a Group,\n   * return children list of root node\n\
    \   * If root node is not a Pane or a Group \n   * return root node in a list\n\
    \   */\n  public ObservableList<Node> loadFXML(File file) {\n    try {\n     \
    \ // get URL from File\n      URL url = file.toURI().toURL();\n      Node root\
    \ = FXMLLoader.load(url);\n      return getRootDescendant(root);\n    } catch(MalformedURLException\
    \ e) {\n      System.out.println(e);\n    } catch(IOException e) {\n      System.out.println(e);\n\
    \    }     \n    // return an empty list\n    return FXCollections.observableArrayList();\
    \     \n  }\n\n  ObservableList<Node> getRootDescendant(Node root) {\n    if (root\
    \ instanceof Pane) \n      return ((Pane)root).getChildren();\n    if (root instanceof\
    \ Group) \n      return ((Group)root).getChildren();\n\n    // return a list with\
    \ root node added to it\n    return FXCollections.observableArrayList(root); \
    \    \n  }\n```\n\n### 2.1.2 Implement `loadImage` Method\n\nIn addition to load\
    \ FXML files, the `DrawLoader` class provides a `loadImage` method:\n\n```java\n\
    public ImageView loadImage(File file, double maxWidth, double maxHeight)\n```\n\
    \nThe `loadImage` method loads an image from the specified file and returns an\
    \ `ImageView` object for viewing. The maximum viewing size is specified in arguments:\
    \ `maxWidth` and `maxHeight`.\n\nHere's complete source code of the `loadImage`\
    \ method:\n\nImport Statements:\n\n```java\nimport java.io.File;\nimport javafx.scene.image.Image;\n\
    import javafx.scene.image.ImageView;\n```\n\nListing 2-2. Define `loadImage` method\
    \ to load image file and return an `ImageView` object to view the loaded image:\n\
    \n```java\n /**\n   *  Return an ImageView, url as string is put in properties\
    \ of ImageView\n   */\n  public ImageView loadImage(File file, double maxWidth,\
    \ double maxHeight) {\n    String url = file.toURI().toString();\n    Image image\
    \ = new Image(url);\n    ImageView imageView = new ImageView();\n    imageView.setPreserveRatio(true);\
    \  \n    // If image is larger than maxWidth/maxHeight,\n    // initialize imageView\
    \ to fit maxWidth/maxHeight\n    if (image.getWidth() > maxWidth) {\n      imageView.setFitWidth(maxWidth);\n\
    \    } else if (image.getHeight() > maxHeight) {\n      imageView.setFitHeight(maxHeight);\n\
    \    }\n    imageView.setImage(image);\n    // put url in properties (a map)\n\
    \    imageView.getProperties().put(\"imageURL\", url);\n    return imageView;\n\
    \  }\n```\n\n### 2.2 Complete Source Code of `DrawLoader` Class\n\nListing 2-3.\
    \ Complete source code of `DrawLoader` class:\n"
