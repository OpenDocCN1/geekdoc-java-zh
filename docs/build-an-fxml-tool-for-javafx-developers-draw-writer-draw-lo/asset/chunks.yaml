    \ with transitions: `FadeTransition`, `RotateTransition`, `ScaleTransition`, `TranslateTransition`,\
    \ `FillTransition`, `StrokeTransition`, `PathTransition`, `ParallelTransition`,\
    \ `SequentialTransition`, `PauseTransition`. They are all derived from `Transition`\
    \ class, an abstract class defines basic functionality of animations, and located\
    \ in `javafx.animation` package.\n\n#### Reference to Oracle Online Documentation\
    \ \"JavaFX: Transformations, Animations, and Visual Effects\":\n\n[http://docs.oracle.com/javase/8/javafx/visual-effects-tutorial/index.html](http://docs.oracle.com/javase/8/javafx/visual-effects-tutorial/index.html)\n\
    \n### 2D Geometric Primitives and Text Are JavaFX Nodes\n\nJavaFX provides a `Shape`\
    \ class which extends `javafx.scene.Node` class and is the superclass of basic\
    \ forms of 2D geometry. The object-oriented concept imposed on the geometric primitives\
    \ facilitates the development of graphics applications.\n\nHere are classes derived\
    \ from `Shape` class: `Arc`, `Circle`, `CubicCurve`, `Ellipse`, `Line`, `Path`,\
    \ `Polygon`, `Polyline`, `QuadCurve`, `Rectangle`, `SVGPath`, `Text`. Except the\
    \ `Text` class, all the others are located in `javafx.scene.shape` package.\n\n\
    Please note that `Text` class, located in `javafx.scene.text` package, considered\
    \ a shape as well, powers the development of text drawing tools. All features\
    \ common to JavaFX nodes can be applied to text objects. You handle it just like\
    \ any geometric form. Text objects can be placed in a layout pane to utilize the\
    \ automatic placement abilities, applying transformations and transitions, as\
    \ well as customizing the presentation style using CSS, etc.\n\n#### Reference\
    \ to Oracle Online Documentation \"Using Text in JavaFX\":\n\n[http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/text-settings.htm](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/text-settings.htm)\n\
    \n### Other Prominent Capabilities That Carry Out Many Complex Issues to Shorten\
    \ Development Time\n\n*   `ImageView` Class for Loading and Displaying Images\n\
    \n    The `ImageView` class which extends `javafx.scene.Node` is used along with\
    \ `Image` class to load and display images. JavaFX also provides APIs for performing\
    \ operations over bitmap images, `PixelReader` is the interface defines methods\
    \ to read pixels from an `Image` object, while `PixelWriter` defines methods to\
    \ write pixels to an `Image` object. All of these are located in `javafx.scene.image`\
    \ package.\n\n    #### Reference to Oracle Online Documentation \"Using the Image\
    \ Ops API\":\n\n    [http://docs.oracle.com/javase/8/javafx/graphics-tutorial/image_ops.htm](http://docs.oracle.com/javase/8/javafx/graphics-tutorial/image_ops.htm)\n\
    \n*   `WebView` Class for Managing Web Pages"
