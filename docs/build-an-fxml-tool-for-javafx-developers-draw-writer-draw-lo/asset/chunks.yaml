    \    // and no children nodes inside it\n    initMyFXMLDocument(file);\n    writeFXMLHeader();\n\
    \    writeFXMLRootPane(null, list);\n    writeMyFXMLDocument();\n  }\n```\n\n\
    #### 1.1.3.1 Composing Contents of A DOM Document\n\nWe have described how to\
    \ create a DOM `Document`, how to write it to a physical file, and how to access\
    \ information inside a DOM `Document`. Now let's explore the process of composing\
    \ contents of a DOM `Document` complying with FXML format.\n\nBefore writing the\
    \ root node, we need to write the processing instruction for Java `import` statements,\
    \ using the `createProcessingInstruction` method.\n\nListing 1-6. Define `writeFXMLHeader`\
    \ method to write processing instructions for Java `import` statements:\n\n```\n\
    \ void writeFXMLHeader() {    \n    document.appendChild(importInstruction(\"\
    java.lang.*\"));\n    document.appendChild(importInstruction(\"java.util.*\"));\n\
    \    document.appendChild(importInstruction(\"javafx.animation.*\"));\n    document.appendChild(importInstruction(\"\
    javafx.animation.PathTransition.*\"));\n    document.appendChild(importInstruction(\"\
    javafx.geometry.*\"));\n    document.appendChild(importInstruction(\"javafx.scene.Group\"\
