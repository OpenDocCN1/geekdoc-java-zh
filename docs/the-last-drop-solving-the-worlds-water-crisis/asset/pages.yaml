    # Troubled Waters


    Karameh Dam, Jordan, August 2021


    I’m standing on the shores of a large lake in one of the world’s driest regions.
    The lake is calm and peaceful, offering some respite, to the eyes at least, from
    the burgeoning heat of an August morning. We’re 400 m below sea level in the Jordan
    Valley, the lowest land point on Earth, where the sun is punishing from the moment
    it rises and rainfall doesn’t come for months on end. On the far shore, bleached-white
    banks blur into sky, with the hills of the West Bank ghostly apparitions through
    the haze. A lone, thin waterbird briefly makes an appearance, barely able to break
    the silence or its own lethargy, giving up and landing again. Near me on the foreshore,
    a handful of stunted brush trees stand unhappily in the water, a telltale white
    crust on their lower branches. There is a fatal problem with this lake. The Karameh
    Dam, the second largest in the Kingdom of Jordan on its construction in 1995,
    was built on salty ground. Its water, desperately needed for drinking and irrigation,
    is utterly unusable.


    A car appears, kicking up white dust, and out gets Esh Al-Guzza’, project manager
    for the NGO EcoPeace Middle East. He’s an engaging thirty-something with a ready
    grin and reader of figures. ‘This is one of our biggest failures,’ he laments,
    as we stare out at the disconcertingly beautiful yet dead lake. ‘Almost 52 million
    cubic metres [52M m³] of unusable water. In the 1990s we had the expertise, all
    the technology to build a good-quality dam, but they did not do enough research
    about the saline springs and rocks – so we confined this fresh water, made it
    saline, and now there’s no technology to fix it.’ Adding insult to injury, a desalination
    plant was built by its shores in 2010 but closed just months later, unable to
    cope with the now extraordinarily high salt content – saltier'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'even than the Dead Sea, just kilometres away. Meanwhile, Nasser – our driver
    for the day, and EcoPeace’s private-investment manager – sizes up the shoreline
    for a popular tourist park with eco-lodges and water sports. But, in truth, the
    lake is receding by around a metre a year through evaporation, as climate change
    sees the heat intensify and rains lessen. The dam’s main sluice gate stands many
    metres above the waterline; opening it would unleash a tumble of bone-dry pebbles.


    The Karame Dam was built, my hosts tell me, to fulfil a dream. A minister’s young
    son allegedly had a dream one night that a dam be built on this site.² So it was
    – before £43 million and £75 million – in one of the driest, saltiest valleys
    on Earth. It appealed his son, a few influential farmers and doubtless the UK-based
    engineering firm that won the tender. A heady mix of hubris and greed persuaded
    the government to spend millions destroying what precious little surface existed
    in the valley carved by the mighty Jordan (today a mere trickle of its former
    self, due to over-abstraction and over-allocation). ‘During the investigation
    phase of the dam site some scientists and specialists advised the government not
    to construct the dam,’ writes Elias Michael Salamah, professor of hydrogeology
    and hydrochemistry at the University of Jordan.’But the Jordan Valley Authority
    of the Ministry of Water and Irrigation (JVA MoWI) ignored criticism and warnings.’
    In an interview with me, the JVA MoWI’s former general, His Excellency Saad Abu
    Hammour,³ confirms they had such a report, and lays the blame solely with the
    ministers in charge: ‘This is corruption,’ he says, adding that one minister owned
    over there’.


    Abu Hammour describes Jordan’s water situation as its ‘very worst’ historically:
    ‘We are looking for every single drop of water everywhere.’ Meanwhile, the Karh
    Dam lies silent and useless, full of trillions of valuable, wasted drops. It serves
    as one of the modern world’s great emblems of mismanagement – but, as we will
    see, it is merely one of a long and sorry story. As Saleem wrote in 2004, the
    Karame Dam ‘proved to be a hard lesson, not only learned by Jordan, but also by
    other areas of the world, where decent scientific work defending the common good
    is ignored for the greed of a few beneficiaries⁴


    The water capacity of the Karame Dam, around 50M m³, is significant in more ways
    than one. The summer I visited, in 2021, Jordan was forced to purchase additional
