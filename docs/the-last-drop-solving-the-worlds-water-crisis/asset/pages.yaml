  md: 'world, we are now using more water than we can sustainably supply. As surface-water
    and groundwater levels dwindle year by year, a crisis awaits. It''s simple maths.
    Here, too, demand is outstripping supply.


    The UK''s average annual rainfall is around 1,200mm, compared to less than 400mm
    in Afghanistan or double figures in Egypt.8 However, despite our winter storms,
    significant parts of the UK are starving the barrel of empty water butts. But
    most of that four-figure rainfall average is propped up by the rainy highlands
    of Scotland, Wales and northern England. In east England, where I live, the average
    rainfall lingers around 600 mm – comparable to Lebanon and Kenya, and far drier
    than Sydney, Australia.9 This also happens to be the UK''s most populated area,
    with 18 million inhabitants packed into just 19,000km², including London. And
    it''s drying up, fast. The government''s Water Abstraction Plan shows that, in
    England, 28 per cent of groundwater aquifers and up to 18 per cent of rivers and
    reservoirs are unsustainably abstracted, with more taken out than put back in.*
    Not single one of England''s rivers are classified as being in ecological health
    – this includes streams, a delicate habitat entirely unique to England. However,
    much of the public remains oblivious to a problem that we all, in part, responsible
    for causing. Over half of the water abstracted in the UK is for household use.
    The average Brit employs 153 L of water per day, through showers, toilets, dishwashers,
    washing machines and garden hoses. Yet climate-change projections show that dry
    summers in England are set to increase by up to 50 per cent, with the amount of
    water available reduced by at least 10–15 per cent by 2050.


    Freshwater scarcity, once considered a local issue, is increasingly a global risk.
    In all ten annual risk reports since 2012, the World Economic Forum (WEF) has
    identified water crisis as one of the top-five risks to the global economy. Half
    of the global population – almost 4 billion people – lives in areas with severe
    water scarcity for at least one month of the year, while half a billion people
    face water scarcity all year. Global water demand has increased by 600 per cent
    over the past hundred years, while available fresh water has fallen by 22 per
    cent over the last twenty.10 Something has clearly got to.


    Given that 70 per cent of our blue planet''s surface is water, such a problem
    problem seems impossible. However, 97.5 per cent of that is sea or salt water,
    unfit for human consumption. The remaining 2.5 per cent is fresh'
