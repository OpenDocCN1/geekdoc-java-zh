    Thames Water press office, so I get out of England manages to too. I''m here to
    see Farmoor Reservoir, South Oxfordshire, one of Thames Water''s largest: 8 km
    in circumference and holding some 14,000M L of water (14M m³). This is where the
    tap water in my house, 42 km away, comes from. I want to understand how water
    gets from source to tap, and back again via the sewage system. And, in doing so,
    tell the story of England''s water problems. Because, oddly, little old England
    manages to encompass many global water problems – scarcity, over-abstraction,
    pollution, underinvestment, government and regulatory failings, environmental
    degradation and corporate misconduct – all within the confines of one small country
    in the west of Europe, where I happen to live.


