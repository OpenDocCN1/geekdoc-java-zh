    typically flies 300,000-plus kilometres a year to visit water projects, but in
    2020 grounded the rest of us. For the 2.3 billion people in the world without
    safe water and sanitation at home,12 ‘if your daily routine is walking to increase
    your handwashing by five times without making more trips or paying more money
    to water vendors... It is not like COVID woke us up to the need for water for
    hygiene; we already knew that. But I certainly think we hadn’t seen the lack of
    access to water and sanitation as a global crisis before. When somebody [unable
    to] wash their hands in one country becomes the critical link to the spread of
    disease, suddenly water and hygiene becomes a global risk.’ The pandemic widened
    the cracks already  throughout the global water system. In June 2021, Mari Mizutori,
    the UN secretary-general’s special representative, added: ‘Drought is on the verge
    of becoming the next pandemic and there is no vaccine to cure it.’13


    Much of this book was written – and the research trips took place – across 2021
    and early 2022. This preceded major climate events, from the catastrophic flooding
    in Eastern Australia and Pakistan to the European drought that saw the Rhine no
    longer carry cargo barges to power stations, and the Yangtze in China all but
    drying up14 But research researchtold their grim inevitability. As June follows
    May, so every year will now see new climate disasters that outstrip those that
    came before. The purpose of this book is not to catalogue climate shocks or as
    a snapshot in time. Rather it’s to tell the stories with universal relevance,
    which can equally influence individuals and decision makers now and in decades
    to come. It is also to offer help. The good and bad news is that, as I saw on
