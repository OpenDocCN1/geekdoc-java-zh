    One lake alone – Baikal, in Russia – holds 20 per cent of the world’s drinking
    water (and even that is being polluted by tourism). As the charity WaterAid puts
    it, ‘If a bucket contained all the world’s water, one teacup of that would be
    fresh water, and just one teaspoon of that would be available for us to use.’
    Rising demand and climate change are putting that teaspoonful of fresh water into
    shaky hands.


    There''s only ever the same, finite amount of water churning around in our water
    cycle. Every drop of water on Earth has been here since the beginning of time,
    constantly recycled again and again. Up to 60 per cent of the adult human body
    is water (even bone is a surprisingly splashy 31 per cent). When you die and are
    cremated or buried, that water will be released again, to the atmosphere or the
    earth, and those water molecules eventually be reunited with old friends back
    in the clouds. We are intimately connected to the water cycle as rivers and lakes
    are. Yet, from the Yellow River in China to the Colorado River in the United States,
    many rivers no longer reach the sea. Often artificially straightened and dammed,
    water is sucked out and channelled to supply farms, industries and households.
    Great lakes, from the Aral Sea in Central Asia to Lake Urmia in Iran, have Ogalla
    and Central Valley in the US to India and Pakistan’s Upper Ganges and Lower Indus,
    are being depleted faster than they can refill. The remaining fresh water is increasingly
    polluted with fertilizers and pesticides causing algal blooms that smother and
    choke ecosystems. Streams in Pakistan and Bangladesh run coloured, dyed by the
    apparel industry that carries to Western fashion-trends. In Europe, three quarters
    of Spain is at risk of desertification, as are parts of Portugal, southern Italy
    and Cyprus, while centuries-old olive trees wither away.¹


    ‘Climate change is water change; the climate crisis is water crisis,’ Torgny Holmgren,
