    chief executive of the Environment Agency, had heavily altered the pre-prepared
    speech he''d been given. An expected welcome address became known as the ‘Jaws
    of Death’ speech. As his audience shifted uncomfortably in their seats and a handful
    of trade journalists suddenly woke up, he said, ‘The Jaws of death is the point
    at which, unless we take action to change things, we will not have enough water
    to supply our needs . . many parts of our country will face significant water
    deficits by 2050, particularly in the south-east, where much of the UK population
    lives.’ The water-abstraction system his agency oversees ‘designed more than fifty
    years ago, for a world with less environmental protection, less demand for water
    and no awareness of climate change.’ Just as important as new infrastructure was
    changing human behaviour: ‘We need water wastage to be socially unacceptable as
    blowing smoke in the face of the baby.’ The industry didn’t know whether to whoop
    or weep.


    On 9 July 2020, the Public Accounts Committee said that all the bodies responsible
    for the UK’s water supply – the Department for Environment, Food and Rural Affairs
    (Defra), the Water Services Regulation Authority (Ofwat) and Bevan’s Environment
    Agency (EA) – had ‘taken their eye off the ball’ and must take urgent action to
    ensure a reliable water supply. The committee’s chair, Meg Hill MP, ‘It is very
    hard to imagine, in this country, turning on the tap and not having enough clean,
    drinkable water come out – . . Defra has failed to deliver and water companies
    have failed to act.’


