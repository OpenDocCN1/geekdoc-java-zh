  md: 'The Dead Sea, the saltwater body shared between Israel and Jordan, has shrunk
    by a third since the 1960s. Slow-motion environmental decline like this suffers
    from generational memory. With each new generation, we reset as we look out at
    nature: what we are seeing all we''ve ever known, and so a new, lower bar is set
    for what we deem acceptable. This came up later, too, when I visited the River
    Windrush in England, excited to see a hatch of twenty or thirtyflies. One landed
    on my shoulder. When I later told Ash Smith, a local campaigner, he looked at
    me incredulously: a mayfly hatch should be a significant annual event, he told
    me; there were stories in the nineteenth century of the air being so thick with
    them could barely see – from a distance, the river would appear as if covered
    in a fog of them. This still happens in more remote parts of rural France. A hatch
    of twenty or thirty, which I had taken as a sign of nature ticking nearly, would
    have horrified my great-grandparents'' generation.


    On the banks of the Dead Sea, as the water declines each year, the tourist hotels
    unwittingly offering a visual reference to what has been lost. Each year, they
    must build more steps for their guests to get down to the water. Most, when built,
    would be level with the lake. There are hundreds of steps to get down. Some have
    filled their swimming pools with Dead Sea water, to save the walk (the same feeling
    of opulence, but protected from the reality). At the southern end of the sea,
    where the water is harvested in evaporation beds for potash and minerals,** the
    banks are dotted with sinkholes. On the Israeli side, sections of road have disappeared
    and whole villages have been abandoned. As the Dead Sea recedes, the previously
    inundated lands dry out, including a thick layer of underground salt. When rain
    falls in winter, the fresh water seeps in and dissolves the salt, causing the
    ground to collapse inward. Over 7,000 such sinkholes have been recorded, several
    meters deep.*23


    The lake is reducing by a metre every year. The River Jordan used to refill, but
    now arrives with a whimpering, over-allocated by each state taking their pre-agreed
    share of a rain-fed river that effectively no exists. The rainfall of the 1960s
    and 1990s was plentiful and predictable comparable to the climate-changed 2020s.
    The flow of the Jordan fifty years ago was 1 km³, all received by the Dead Sea;
    now, it''s lucky to get that tenth of them.*24


