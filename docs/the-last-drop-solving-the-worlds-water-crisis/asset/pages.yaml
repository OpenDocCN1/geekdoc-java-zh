    # Oxfordshire, southern England, midsummer 2022


    In the summer months in the Oxfordshire town where I live, I go swimming in the
    local 50 m lido. With my inelegantly slow breaststroke, from time to time an accidental
    gulp of the pool’s opulent, chlorine-clean 5.9M L (5,900 m³),⁰ of water. Sometimes
    I swim while it’s raining, when fewer people brave it, alone in my lane with the
    strangely comforting feeling of water both above and below me. I stand a bottle
    of water at the end of the day, to drink from halfway through my swim. I normally
    have a shower afterwards, even if I’ve showered that morning. I live a wet, drenched,
    existence. But, as I discovered when researching this book, this won’t last. I
    am living on borrowed time and borrowed water. Water stolen from nature, drained
    from rivers and lakes and returned polluted, allows me to live this way. It will
    have to stop – not through some altruistic hand-wringing desire to do better,
    because even in England this amount of water will soon be unavailable. Like many
