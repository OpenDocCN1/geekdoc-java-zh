    provided the measurement. This wasn''t a purely environmental mission. If you’re
    going to run a space programme, says Jay, ‘You need to understand the gravity
    field to get precision orbits and know where a rocket’s going to re-enter the
    atmosphere.’


    GRACE works, Jay simplifies like a ‘scale in the sky.’ As the satellite passes
    the Earth’s land surface, its equipment is pulled ever so slightly by the stronger
    gravitational pull caused by underground water. The data produced has helped to
    build a highly accurate global map of groundwater and – over time, as GRACE fed
    back data from 2002 to 2017 – of groundwater depletion. The 2015 paper, ‘Quantifying
