    # Fossil hunters


    Dr Jennifer McIntosh, professor of hydrology and atmospheric sciences at the University
    of Arizona, is an internationally renowned groundwater expert, best known for
    her work on ‘fossil water’ – groundwater that remains from different geological
    eras, unconnected to the current water cycle. There are numerous methods for dating
    water. Any groundwater younger than the 1950s is easy to tell through the presence
    of tritium. ‘Nuclear-weapons testing post-1950 released tritium . . . [which]
    got into rainwater and then precipitated all over the globe.’ Similar modern tracers
    leave dateable fingerprints, such as CFCs. For older water, ‘the most common technique
    is radiocarbon, carbon-14. That’s the same way you date ancient bones, or material
    in archaeology.’ That works for anything up to around 50,000 years old. Older
    than that, and you measure the radioactivity from rocks that release helium-4
    into the groundwater. The oldest water that has ever been discovered is around
    a billion years old, McIntosh tells me. Typically, such ancient water is highly
    saline – because salt rocks have dissolved in it or the water came from earlier
    oceans – highly mineralized, and quite likely radioactive; you wouldn’t'
