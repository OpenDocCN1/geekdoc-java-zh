    # Joe Poland’s pole


    In talks and lectures, Jay Famiglietti likes to show a slide titled ‘Cumulative
    Groundwater Depletion in California’s Central Valley from 1962 to 2014’. It shows
    a constant downhill trajectory. There are upticks in wet periods, such as 1978–85,
    and 1993–8, but they’re never as high as where the previous downtick started.
    From 1962 to 2014 there was a cumulative loss of 90 km³ (73M af) of groundwater
    in California. The 2011–15 ‘drought’ wasn’t an anomaly. It was part of a century-long
    trend.'
