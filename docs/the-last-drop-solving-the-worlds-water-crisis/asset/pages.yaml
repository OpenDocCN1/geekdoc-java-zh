    # Lead Mead, USA, December 2021


    Minutes after leaving the National Parks Service (NPS) HQ in Boulder City, Nevada,
    I crest the hill, and I gasp – the ‘bathtub ring’ that encircles Lake Mead is
    revealed in its bleached-white ignominy, a forlorn witness to water lost. I read
    that the lake had dropped by 43 m in twenty years of drought – but seeing it in
    person brings home the scale. The Statue of Liberty is only slightly taller, at
    46 m. If Lady Liberty’s feet touched the current water level, only her touch would
    rise above the original line showing when the lake was full. The whiteness of
    the ‘bathtub ring’ is caused by calcium carbonate in the water attaching to the
    red sandstone: as the lake level descends, tidemarks form on the rock like suds
    on emptying tub. From a distance, distinguishing the relatively good years from
    the relatively bad. Looking down from a viewing platform near the Hoover Dam,
    however, Justin Pattison, acting deputy superintendent of the NPS, points out
    the ring showing his past year of service, closest to the water level. It’s a
    wide one, marking a drop of perhaps 3.7 m. The four intake or ‘penstock’ towers
    for the hydroelectricity rise out of the lake skyscrapers, at least 61 m tall.
    They skinny and exposed, showing their freely underwear – the metal grills that
    would prevent underwater debris being sucked into the turbines, were they actually
    under water. Now they stand embarrassed before a photo-taking public. The intake
    towers, perhaps even more than the bathtub ring, the water level comes too low
    to run through the dam – than it is to ever being full again. I took some buried
    selfies, feeling like a disaster tourist. On the other side of the dam, a little
    launch jetty for observatory boats hangs uselessly from the rock, high above water
    it would have floated on just a year before.


    As we drive around the lake, the scale of America’s largest reservoir dawns on
    me, too – even this one small corner is vast, reaching to the Red Mountains on
    the horizon. How much water it should be, is made'
