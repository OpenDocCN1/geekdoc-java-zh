    showed that, by 2050, water availability in England could be reduced by 10–15
    per cent, leaving rivers with 50–80 per cent less water during the summer, and
    ‘unable to meet the demands of people, industry and agriculture.’ By 2050, an
    extra 4B of water per day will be needed for England, up from a current demand
