    # Akosombo Dam, Ghana, October 2021


    I visited a third great reservoir in 2021. The greatest, in fact: Lake Volta,
    Ghana, is the world’s biggest man-made reservoir by surface area. It takes a whole-day
    trip from the capital, Accra, as we set out early. Emmanuel, our driver, puts
    on a CD of early 2000s R&B – Craig David, Usher, and the jarringly exepletive-filled
    (in a devout Christian country) ‘F**k It (I Don’t Want You Back)’ by Eamon. After
    its fourth rotation, and still struggling through the Greater Accra traffic, I
    politely request a change. When we’re finally released from the grinding cogs
    of the city we reach the Ghanaian countryside: flat green vistas postmarked by
    steep, tree-covered hills that rise jaggedly from the ground and as sharply disappear.
    Near the Shia Hills, baboons sit on the roadside, accepting snacks from passing
    vehicles.


    At midday, we reach the town of Akosombo, to the start of the lake and the source
    of the country’s (and much of its neighbours’) hydroelectricity: The Akosombo
    Dam. Our request for an official site tour with the Volta River Authority (VRA)
    remains stuck in bureaucratic purgatory – a paper-in-tray on a desk in the VRA’s
    Accra checkpoint doesn’t let us through, citing ‘national security’ and heightened
    tensions with Togo over a disputed electricity-supply deal.


    Defeated, we go to the nearby Volta Hotel Akosombo, where Emmanuel knows of a
    glass-panelled restaurant with an excellent view over the dam. Inside, we take
    some unsatisfactory photos. It was a long drive for a selfie behind glass. On
    my phone, I spot a public road that passes beyond the dam and touches the shore
