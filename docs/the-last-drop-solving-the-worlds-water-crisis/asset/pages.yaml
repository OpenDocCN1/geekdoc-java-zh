    years since its construction in 1976 have softened it, with now-mature trees at
    its edges. The reservoir''s intake is direct from the adjacent River Thames, but
    were that to dry up (it never has) Farmoor''s 14,000M L is the equivalent of three
    weeks'' supply. That is both a lot, and rather precarious.


