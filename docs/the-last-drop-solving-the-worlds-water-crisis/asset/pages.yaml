    geophysicists worked out that vast accumulations of underground water could affect
    the gravitational pull in parts of the Earth.’ They knew that the movement of
    water underground impacted the gravity field, but back then they had no way of
    measuring it,’ says Jay, from his makeshift home office – they have recently moved,
    and behind him a whiteboard with mathematical equations (his wife’s) and a guitar
