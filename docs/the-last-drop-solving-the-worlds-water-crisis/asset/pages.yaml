  md: '# CHAPTER 1


    # Approaching Day Zero


    Driving from Amman to the Jordan Valley, we descend 1,400 m in a matter of minutes.
    To my surprise, maybe because I only associate it with aeroplanes, my ears pop.
    Once down at the valley floor, we pass farmland with after row of bare metal hoops
    – the ribs for plastic polytunnels. The soil is full of scraps of black plastic,
    remnants of sheets laid to retain moisture during growing season and simply pl
    back in afterwards. Nasser slows down to point out his favourite date farm. I
    wonder whether I''ve met anyone before who has a favourite date farm. We spend
    a lot of the time lost. Nowhere in Jordan has a precise address, and there''s
    no formal postal service. The valley is Jordan''s Wild West; rural communities
    cluster around a single main road that cuts north to south, eking a living out
    of agriculture, shops and services. Streets bustle with more energy than seems
    in the heat. The drive is punctuated by long expanses of irrigated agriculture,
    street sellers, fig plantations, the occasional shepherd corralling sheep, boys
    sharing donkey rides, perched desert and, and so often, the King Abdullah Canal.


    The King Abdullah Canal is equivalent to Israel''s National Water Carrier; both
    built in the early 1960s to divert the water of the Yarmouk River and Jordan River
    to the respective country’s major cities. The 1994 Israel–Jordan peace treaty
    gives Jordan an annual supply of 50M³ of water, including 75 per cent of the water
    from the Yarmouk River, a transboundary river it shares with Syria, plus 20M³
    transferred by pipe from Lake Tiberias (Sea of Galilee), all of which goes into
    the King Abdullah Canal. As the country’s main water source, from the roadside
    looks decidedly modest – as if the entire North of England relied on the Leeds–Liverpool
    Canal for all its water supply.'
