    Much of our knowledge of algal blooms comes from the research of one woman: Professor
    Nancy Rablais. In the early 1980s, she was the only scientist working at the newly
    founded Louisiana Universities Marine Consortium (LUMCON) alongside its director,
    Don Boesch. There, she began her research on the growing ‘dead zone’ of hypoxic,
    oxygen-free water in the Gulf of Mexico. Given a team of two researchers and a
    small grant from the National Oceanic and Atmospheric Administration, she began
    to map oxygen levels in the Gulf. Taking monthly samples in a small boat, they
    did a mapping course in the summer of 1985 to determine the area and conditions.
    They found a large and continuous area of low oxygen miles wide. The next year,
    they found two distinct areas of hypoxia in the waterways flowing from the Mississippi
    River into the Gulf. In 1993, the size of the Gulf’s hypoxic ‘dead zone’ had doubled.
    And by the 2010s, few pleasure creatures would dock at the red, dead stretch of
    Louisiana coastline.


    As volumes of fresh water from the Mississippi meet the sea, nutrients from agricultural
    run-off in the river feed giant algal blooms that turn the water. Dead algae pile
    up at the bottom and are broken down by bacteria, consuming all the oxygen. This
    dead zone of oxygen-free water has been measured by Rablais and her team, who
    found it reaches over 20,000 km² (the Dead Sea in Jordan, by way of contrast,
    is just 605 km²). This is not, however, a natural phenomenon. The nutrients feeding
    the algal blooms are caused by nitrogen and phosphorus pollution from agricultural
    fertilizer and animal manure.'
