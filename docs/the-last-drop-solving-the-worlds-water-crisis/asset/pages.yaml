    Chalk exists elsewhere in the world, but nowhere is there such a mass of it –
    from the famous White Cliffs of Dover to the Needles of the Isle of White, and
    hundreds of kilometres of underground aquifer in between – in south-east England.
    A softer, white form of limestone, chalk is made up of billions of tiny marine
    fossils that settled on the Cretaceous period. Water percolates easily through
    chalk, with organic matter filtered out of the way, leaving crystal-clear, almost
    immediately drinkable spring water. Chalk streams are nearly filled by these springs,
    with beds of glimmering golden gravel and fish and invertebrates. Botanically,
    they are the most diverse of all England''s rivers. The estimated 246 chalk streams
