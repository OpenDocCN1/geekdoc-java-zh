    Thames Water estimates that, by 2045, it will need to find an extra 350M L of
    water supply per day. The ''bank'' that they''ve wanted for twenty years is the
    long-planned but never-built Abington Reservoir. First proposed by Thames Water
    in 2006, it would be the first reservoir built in the south of England since Farmoor
    in 1976, and capable of supplying their entire shortfall with one big project.
    The problem is, as Andrew Tucker identified, the region has no valleys to flood.
    The site near Abington, Oxfordshire, is perfectly flat, fertile. The only way
    to build is upwards – what’s known as a ''bunded reservoir'' – and Thames Water
    wants 150M m³ capacity (twelve times larger than Farmoor), which would take nine
    years to build, covering more than 6 km² of land, with bunded walls 30 m high
    – making it the largest reservoir in the world. This wouldn’t just be a blot on
    the landscape, it would be the landscape. Local villagers don’t want it. A campaign
    group promptly sprang up: the Group Against Reservoir Development (GARD). In 2010,
    Brigadier Nick Thompson, chairman of GARD, said, ‘The noise, pollution and disruption
    of the project would destroy the quality of life for many people . . Together,
    we can defeat Thames Water’s proposals.¹⁰ And they did. A public inquiry in 2010
    produced a 329-page report concluding that the Abington Reservoir proposal did
    not meet the statutory requirements and that a reservoir of that size was not
    justified by the evidence. It didn’t stop Thames Water from putting it – with
    minor tweaks and changes – into every five-year management plan since. Now rebranded
    the ‘South East Strategic Reservoir’, as a joint proposal between Thames Water
