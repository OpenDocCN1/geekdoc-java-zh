  - A.17 – 文中所有的递归示例都涉及直接递归，即谓词调用自身。在这次练习中，你被要求两个相互调用的谓词，使得每个谓词不是直接而是间接。具体来说，编写 `evenlength`
    和 `oddlength` 谓词，通过相互调用越来越短的列表判断列表长度是偶数还是奇数——每次短 1。结果间接递归在最终调用空列表终止，对于 `evenlength`
    成功（因为 0 是偶数），但对于 `oddlength` 则不。提示：使用 `evenlength([])` 作为基本情况。
