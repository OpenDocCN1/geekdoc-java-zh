  md: '# Preface to the Second Edition


    In addition to hundreds of small changes the major change has been to introduce
    nondeterminism in a more coherent way. After first discussing deterministic finite
    state automata, the nondeterministic formulations of regular languages, such as
    grammars, regular expressions and nondeterministic machines are grouped together.
    This has led to fewer and shorter proofs. It also has some unexpected benefits.
    For example, we now no longer need to explain/allow empty-string transitions since
    they are now unnecessary, except briefly in one proof.


    We deal with context-free languages in a more rigorous way. Unlike the first edition
    we no longer quote theorems without proof. We feel the proofs are more natural
    and shorter if we have pushdown automata that use acceptance by empty stack (instead
    of with accepting states). We also do not need empty-string transitions for these
    automata. All this requires introducing normal forms for context-free grammars;
    the proofs are provided but can be skipped.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Preface to the Third Edition


    Again many changes have been incorporated, including simplifying some discussions
    of context free languages. New problems and answers have been added.


    The main changes have been to chapters eight and nine. We discovered that we were
    working too hard, by following the lead of nearly all other texts: by having the
    finite automata be the first and primary focus. Now we begin the discussion of
    regular languages by discussing generative models first. These models are nondeterministic
    and are shown to be equivalent. We show how to convert a regular grammar into
    a deterministic grammar. Therefore in chapter nine, where we introduce machine-based
    recognition models, all the proofs are straightforward. In summary, we again have
    reduced the number of theorems and simplified the proofs.'
  merge: -1
