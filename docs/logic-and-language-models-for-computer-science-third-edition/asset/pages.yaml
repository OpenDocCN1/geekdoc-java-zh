  md: 'where we established it was a non regular language However, except for giving
    some examples, we have never really said what strings of balanced parentheses
    are. Since there are infinitely many of them, a recursive definition is appropriate.


    # Definition 10.4


    Strings of balanced parentheses

    If $B$ is the language of strings of balanced parentheses, then,


    +   1. $\Lambda \in B$.

    2. If $s_1 \in B$ and $s_2 \in B$, then $s_1s_2 \in B$.

    3. If $s \in B$, then $( s ) \in B$.

    4. Nothing else is in.


    Of course, when parentheses appear in ordinary mathematical expressions, there
    are other things mixed in with the parentheses, both within and between balanced
    pairs, as well as before and after, but here we are ignoring everything else.


    # Example 10.3


    The language of balanced parentheses, $B$, is generated by the grammar $G_3$,
    with the following productions:


    ```

    $S \to \Lambda \quad \ S \to SS \quad \ S \to (S)$

    ```


    In other words, we claim that $B = \mathcal{L}(G_3)$ is the language of balanced
    parentheses. The following derivation shows that the string $(())$ is in $\mathcal{L}(G_3)$.
    The symbol which is replaced next is underlined.


    ```

    $S \Rightarrow (S) \Rightarrow (\overline{S}) \Rightarrow ((\overline{S})(\overline{S}))
    \Rightarrow ((())(\overline{S})) \Rightarrow ((())(()))$

    ```


    The proof that $\mathcal{L}(G_3)$ is the language of balanced parentheses is straightforward,
    using mathematical induction and drawing on the similarity of the three productions
    of $G_3$ to, respectively, lines 1, 2 and 3 of Definition 10.4. Line 4 of that
    definition corresponds to the parenthesized comment "and and only" in Definition
    10.2, for the language of any CFG.'
