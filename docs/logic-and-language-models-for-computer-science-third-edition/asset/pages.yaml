  md: 'But they are quite different computationally. An automaton for $L_2$ work harder
    than one for $L_1$, and a grammar for $L_1$ is easy but it is not even clear how
    to produce one for $L_2$.


    One of the great achievements in the theory of formal languages, was the discovery
    that we can clearly state how and why some languages are more complex than that
    and leads to the definition of a language class. We will impose some strong restrictions
    on how an automaton can be built — if we were still speaking in terms of computer
    programs those restrictions might be on the number and types of variables allowed.
    There will be some languages that can be recognized by these restricted machines,
    and other languages that are so complex that no such automaton exists which can
    recognize them. Therefore a language class is a set of languages, each of which
    can be recognized by some automaton that abides by the restrictions. In other
    words, a language class corresponds to a type of restriction on how an automaton
    can be built!


    In parallel to this, we will put restrictions on how grammars can be specified.
    We can define a language class in terms of the type of restriction on the form
    of the grammar — it of the restricted type. What is surprising is that we will
    find that exactly the same language classes can be defined in terms of automata
    and in terms of grammars!


    We will encounter two major language classes: regular languages and context-free
    languages. This figure shows what is known about these classes. (Recall that a
    “class” is just a set so we can talk about one language class being contained
    in another language class.) It indicates that every regular language is also a
    context-free language, but not vice versa. Also there are languages that are not
    context-free; these languages are more complex, in some sense, than context-free
    languages. We will demonstrate these relationships in the following chapters.'
