    \ from the beginning of the tape past 5 0s brings the tape head to the second\
    \ transition rule.\n\nSince an encoding scheme makes a string out of each TM,\
    \ the set of TM encodings is a language. Now consider a TM encoding, followed\
    \ by a extra 0 symbol, followed by an input string that TM accepts. This too is\
    \ a string and the set of all these strings is a language. We will denote this\
