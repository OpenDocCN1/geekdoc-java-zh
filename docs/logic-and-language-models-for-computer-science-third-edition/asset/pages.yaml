  md: '# Chapter 3


    # Proofs by Deduction


    In this chapter we present the notion of a proof by rules of inference. The proofs
    are formal, since not only are they expressed in terms of symbols, but in addition
    each step is justified in terms of explicit rules for manipulating the symbols.
    The rules-of-inference approach to proving things turns out to apply much more
    broadly than the methods of Chapter 2. Truth tables — though essential as the
    foundation of other methods — in this chapter, enriched with predicates (Chapter
    5), applies throughout mathematics and, as we will see in Chapter 6, to computer
    science.'
