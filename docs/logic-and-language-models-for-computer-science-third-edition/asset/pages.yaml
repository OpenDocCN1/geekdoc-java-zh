  md: '# 12.7 Church-Turing Thesis


    Alonzo Church and Alan Turing simultaneously defined models of computation. Church''s
    model, called the $\lambda$-calculus, was later found to be equivalent to TMs.
    Both researchers contended that their models were truly universal models of computation.
    In other words, they were sure that any other model, including specifications
    for real computers, would not be any more powerful than theirs, with respect to
    the question of which computations succeed. This was a bold and unprovable thesis,
    since it makes a statement about any model of computation that will ever be devised
    in the future. The Church-Turing Thesis can be paraphrased as: any computational
    task can be accomplished by a Turing Machine.


    In order to appreciate this claim we need to expend slightly our notion of what
    a TM does; so far a TM can be thought of computing a function $f$, where if $x$
    is the input whatever is on the tape when the machine halts is $f(x)$. The Church-Turing
    Thesis has been verified to the extent that there is no known function $f$ that
    can be computed by some other model, but not by a TM. This has remained true since
    the 1930s, despite the fact that many alternate models have been proposed, often
    with the intent of falsifying the thesis.


    Will the thesis continue to hold? Perhaps not, if we are willing to push the limits
    of the notion of “computation.” For example, people have seriously investigated
    to what extent brain functions are not computable by a TM. Alternatively, researchers
    in so-called quantum computers, that make use of the uncertainties ofAtomic reactions,
    raise important questions (even though so-called “quantum TMs” can be simulated
    by normal TMs). These ideas are very speculative. For all practical purposes we
    can rely on the thesis.


    It is because of the general support for the Church-Turing Thesis that the TM
    has a central role in theoretical Computer Science. Another entire textbook could
    be written to explore what is known about TMs. We mention one such topic in the
    next section.'
