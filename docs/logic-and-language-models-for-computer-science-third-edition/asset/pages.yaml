  md: '**Theorem 9.3** – $L = \mathcal{L}(M_1)$ for some DFA $M_1$ iff $L = \mathcal{L}(M_2)$
    for some NFA $M_2$.


    **Proof.**: This is immediate since $L$ is regular, regardless of the machine
    model. But we can give more constructive details.


    If we start with $M_1$ we observe it is already an NFA; an NFA with singleton
    sets for all values of the transition function, corresponding to the single values
    of the DFA’s transition function. If we start with the NFA $M_2$ we can convert
    it into a regular grammar, the regular grammar can be converted into a deterministic
    regular grammar, and that can be converted into a DFA. □


    It is instructive to recall that converting a regular grammar into a deterministic
    can result in an exponential blow-up in the number of reachable variables. (Only
    reachable variables need to be used in the construction of the DFA.) Hence the
    number of states resulting from the method given in the proof can be exponentially
    larger than the number in the original NFA. It can be shown, by example, that
    sometimes a corresponding DFA must be exponentially larger; see exercise 9.26.'
