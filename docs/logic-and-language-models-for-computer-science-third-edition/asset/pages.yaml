  md: '# 1.8 Graphs and Trees


    Graphs are an important mathematical concept to model relationships within a set.
    Formally a graph G is a pair of sets, G = (V, E), where V is a set of elements
    called vertices and E, the set of edges, is a relation on V, so that E ⊆ V × V.
    If (x, y) ∈ E we say that there is an edge from vertex x to vertex y, pictorially
    such edge is drawn as an arrow from a point labeled x to another point labeled
    y.


    As defined in the preceding paragraph, a graph is sometimes specifically called
    a directed graph, or just a digraph, to distinguish it from the related concept
    of an undirected graph. An undirected graph is a graph in which an edge does imply
    any directionality. If (x, y) ∈ E we not say that there is an edge from “x to
    y”, we instead say x and y are “adjacent.” Such an undirected edge is depicted
    as a line (with no arrowhead). (For an undirected graph, by convention, if (x,y)
    ∈ E then (y,x)∈ E, since the (x,y) notation is not meant to imply an ordered pair).


    A directed path of length k from x to vertex y is a sequence of vertices


    ```

    x = x0, x1, x2, ..., xk = y

    ```


    An undirected graph is a tree if it is connected and acyclic. A directed acyclic
    graph is often called a dag, in view of its initials. A graph is a rooted tree
    if it has a distinguished vertex, called the root, and a unique path from the
    root to every other vertex. Rooted trees, in contrast to real trees that grow
    in the ground, are usually drawn with the root at the top and all the edges pointing
    downward. When this is done consistently we omit the arrowheads in the drawings.
    Each edge points a a parent vertex to a child vertex. A vertex with no outward
    arrows (that is, no children) is called a leaf. Sometimes the order of the children
    of a parent vertex is significant, so it is natural to speak of the “ leftmost
