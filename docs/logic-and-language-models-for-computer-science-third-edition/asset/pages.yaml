  md: '# 2.1 Propositions


    Propositional logic is about true and false statements, which we call propositions.
    Often propositions appear in the notation of arithmetic, set theory or some other
    formalism, but they may also be expressed as ordinary sentences in English or
    some other natural language. Here are a few examples:


    ```

    5 > 3

    FISH MAMMALS

    It is raining.

    ```


    The first of these is clearly true. The second is clearly false. The third is
    a bit problematic, but if we imagine that it is spoken to you as you are reading
    this, then it is reasonable to say that it is true or it is false. Besides allowing
    ourselves this explanation about the time and place of the rain, we will also
    conveniently ignore borderline misty conditions. To deal with these additional
    factors would require a more complex system of representation. When we come to
    predict logic, we will regard “5 > 3” as an operator with two operands. In this
    chapter we regard it as an invisible statement that is true or false.


    Because its focus is on true and false assertions, the formal study of propositional
    logic begins with the logical constants. Some people refer to them as the Boolean
    constants in honor of George Boole, the founder of modern symbolic logic. Calling
    these constants transforms logical variables, which are to be introduced here.
    Yet another term for them is the truth values, which emphasizes their similarity
    to numerical values in arithmetic. Just as we combine numerical values, like 2
    and 3, using arithmetic operators, like plus, to get a resulting value, so here
    we combine the truth values TRUE and FALSE, using logical operators, to get resulting
    values.


    A logical variable (or Boolean variable) is a variable that can take on only the
    value TRUE or FALSE. For example, with the variable $p$ understood to represent
    the idea that 5 exceeds 3, we can write $p = TRUE$. A proposition can be a logical
    constant or a logical variable or it may be a more complex expression built out
    of logical variables and logical constants (either or both of them) along with
    operators corresponding to “and”, “or” and “not”. In particular, if we $p$ be
    the proposition that it is raining and let $q$ be the proposition that $5 > 3$,
