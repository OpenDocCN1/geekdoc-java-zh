  md: '# 4.3 Quantifiers


    So far we have used predicates to make assertions about only one thing at a time.
    **Quantifiers** give us a compact, precise, formal way to make assertions about
    a whole set of objects at once. The situation is somewhat analogous to loops in
    programming languages, which let us carry out the same operation on a whole set
    of entities. (In fact, it turns out that one of the quantifiers is used to describe
    the consequences of a loop in proofs of program correctness; see Chapter 6.) The
    examples in the rest of this chapter make frequent reference to the following
    sets:


    +   * $\mathcal{U}$: an arbitrary set.

    * $\mathcal{I}$: the integers

    * $\mathcal{N}$: the nonnegative integers (including zero)

    * $\mathcal{R}$: the real numbers

    * $\mathcal{P}$: the set of living people

    * $\mathcal{Q}$: the set of all people, living or not


    The **universal** quantifier means “every” or “for all” and is denoted with the
    symbol $\forall$. It says that every element of some set has a certain property,
    so to use it we need to specify the set and the property we have in mind. Properties
    are expressed by 1-argument predicates, so $\forall x \in \mathcal{U} : p(x)$
    can be read “For all members $x$ of the set $\mathcal{U}$, $p(x)$ is true” or
    more simply “Every member of $\mathcal{U}$ satisfies $p.$” The set ($\mathcal{U}$
    here) is called the **domain** of the quantification.


    # Example 4.5


    Express the statement “Every integer has a square that is greater than or equal
    to 0” using $\forall$.


    Here is one way of expressing it:


    ```

    $\forall x \in \mathcal{I} : (x^2 \geq 0)$.

    ```'
