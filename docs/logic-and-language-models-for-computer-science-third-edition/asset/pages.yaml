  md: '# 12.2 The Turing Machine Model


    Alan Turing in the 1930s devised a model of computation, now called a Turing Machine
    (TM), in order to explore questions about the limits of computability. Remarkably,
    his investigations predate the design of the first modern digital computers (which
    later Turing was to help design). Because it is a model of what must be of any
    computational device, the TM is far simpler (less efficient) than our current
    notion of what a computer is. Moreover, for proving things, it helps to make the
    model as simple as possible. Despite its simplicity, however, the TM model has
    been shown to be as powerful — in terms of what TMs can ultimately compute — as
    any realistic model of a computer that has been proposed to date.


    A Turing Machine shares characteristics of FAs and PDAs. It has a finite control
    unit with finite number of internal states. The distinction between the models
    is in the amount of memory and how it can be accessed. For an FA input is considered
    to be in readily memory that can only be processed left-to-right; the only other
    “memory” is the implicit knowledge of each state encodes for the past. For a PDA
    the input is still found in read-only memory, processed left-to-right, but there
    is an additional read-write memory, of unbounded size, that is constrained to
    behave like a stack. A TM also allows an unbounded amount of read-write memory,
    without the stack constraint on its use. Further, to simplify the model, the input
    is assumed to be found in the same read-write memory that is used for the rest
    of the computation.


    The memory of a TM consists of a set of consecutive cells. At each step the machine
    looks at the symbol in a cell. On the basis of what it sees, with its internal
    state, the TM writes a symbol in the cell, makes a transition to a state and moves
    to another cell. This access mechanism has suggested to some that we call the
    memory a tape; tape is a read-write storage mechanism accessed by a tape head
    that can move and forth on the tape. The cells are not given addresses, so there
    is no notion of random access. To get the TM to access a distant cell you have
    to arrange for it to move one cell at a time.


    More formally, a TM consists of a finite control with a tape that is unbounded
    in one direction; that is, it has a first cell and a second so on, indefinitely.
    Initially the TM is in a designated initial state and the'
