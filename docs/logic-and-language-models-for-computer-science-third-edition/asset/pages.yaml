  md: '# 9.3 Formal Notation for Finite Automata


    The diagrams that we have been using up to this point have the advantage of being
    easy to understand at a glance, but expressing precise ideas about them in ordinary
    English can lead to clumsy discussions. To remedy these shortcomings we turn to
    formal notation. We observe that a state-transition diagram is composed of (i)
    states and (ii) symbols, along with information about (iii) starting the recognition
    process, (iv) continuing it, and (v) accepting or not, when done. Formally, a
    deterministic finite automaton (DFA) is a model of these five things, so we say
    it is quintuple (or 5-tuple). We typically call it M, for "machine."


    # Definition 9.1


    Deterministic finite automaton

    A DFA M is a quintuple, M = (Q, Σ, q₀, δ, A), where


    +   - Q is a finite set of states,

    - Σ is a finite set of symbols,

    - q₀ ∈ Q, where q₀ is the start state,

    - A ⊆ Q, where A is the set of accepting states,

    - δ: Q × Σ → Q.


    The last line states that δ is a function from Q × Σ to Q. Recall Q × Σ is the
    set of all ordered pairs (q, σ), such that q ∈ Q and σ ∈ Σ. One writes δ(q, σ)
    to express the result of applying δ to these arguments. The function δ is understood
    to be the transition of the DFA, specifying the transitions in the corresponding
    state-transition diagram. That is, if the current state of the DFA is q and the
    current input is σ, then the DFA''s next state is the value of δ(q, σ).


    Recall for deterministic automaton, the choice of state is uniquely determined
    at each step; there is never more than one possibility. Moreover, there is never
    less than one possibility; that is, δ is a total function, with δ(q, σ) defined
    for all q and σ. While a trap state is omitted from diagrams, it is included in
    Q and used in to ensure δ is total.'
