  md: '# Preface


    So, you are a computer science (CS) major and you are sitting down to see what
    this book is about. It has been assigned, the course is required, and you have
    no choice. Still, you chose your institution, your major.


    Or you are teaching a course that might use this book, maybe in discrete math,
    maybe including logics or formal language or. If you want your CS students to
    see the applicability of mathematical reasoning to their own field or your math
    students to see the usefulness of their field outside itself, it is your students
    that we have in mind.


    If you are a CS major, you have already noticed that this course is different
    from the others you have taken so far. It is not an Introduction to Computing,
    or to programming, problem-solving or data structures. No, this book is about
    something called “models” — models of language and knowledge. It is also about
    formal methods.


    You know something about models if you have built or seen a model airplane. In
    Kitty Hawk, North Carolina, you can see the wind tunnel that the Wright brothers
    built to test the lift capabilities of various wing shapes. A model can help simplify
    and think more clearly a complex problem (powered flight) by selecting a part
    (the wing) and focusing on some aspect of it (its aerodynamics). The other, temporarily
    ignored parts and aspects must ultimately be addressed, of course, if the original
    problem is to be solved.


    The models in this book are simplifications too, but not of material objects like
    airplanes. For computer scientists, the objects of study lie mainly in the world
    of symbols. In this book it will be computer software and especially the programming
    languages in which software is written from which we draw our models and to which
    we apply.


    A model, then, is a collection of precisely stated interacting ideas that focus
    on a particular aspect or part of our subject matter. A good model can simplify
    a topic to its essence, stripping away the details, to that we'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'can understand the topic better and reason precisely about it. The model keeps
    only those parts and processes that are of interest.


    We will reason formally and informally. Informal methods draw on analogies to
    your knowledge of other things in the world in general and your common sense,
    typically expressed in a human language like English and perhaps a diagram. Formal
    methods use abstract symbols — like the famous "x" of high school algebra — and
    clearly stated about how to manipulate them. A formal method based on a simple
    but precise model of a situation can enable us to prove that we have got things
    right, at least as reflected in the model.


    If this concern with precision and proof makes you think this is a theory book,
    you are partly right. If you think that means it is not of practical value, we
    ask you to think again. It is often said that experience is the best teacher.
    But learning from experience means transferring ideas across situations, by seeing
    the essential similarities in non-identical situations. This abstracted essence,
    which we learn from history or from our mistakes, is an informal model. Formalizing
    the model and reasoning carefully about it — that is, theory — is the scientist''s
    and engineer''s path to knowledge and action in the real world.


    So will we theorize? We have chosen to focus on language, the crucial link between
    hardware and software. Programming languages permit software to be written and
    language processors — compilers, interpreters and assemblers — permit hardware
    to run that. Sometimes a model proves to be so interesting and widely applicable
    that it becomes an object of study in its own right. That is the case with the
    logic and language models in this book.


    Two key aspects of language are structure and meaning. We will study models of
    each. The structure of language has to do with the arrangement of symbols into
    permitted sequences, called "sentences" in human language and "statements" in
    programming languages. This topic is usually called Formal Models of Language.
    It underlies key aspects of compilers, the study of what computers can do efficiently
    and the processing of human language for translation and easy interaction with
    people and computers.


    Symbol arrangements are of interest not only in their own right but also because
    they express ideas about meaning and computation. Expressing meaning can be done
    in various ways, including logic. Of the many logics, the simplest is propositional
    logic. It finds application in the tiny hardware'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'components called "logic gates," in the conditions for branching and loops
    in high-level programming languages and in mathematical rules of proof that can
    be applied via software throughout engineering and science. Predicate logic builds
    on propositional logic to permit knowledge representation in database systems,
    artificial intelligence and in work on program correctness in software engineering.


    Computer students may notice that several phrases in the above paragraphs are
    the names of upper division courses in computer science. To further emphasize
    the practical value of the two major topics of this book, we introduce an important
    programming language whose core is based on each in the appendices. Prolog, a
    programming language whose core is based on predicate logic, supports rapid prototyping
    of intelligent systems. AWK is a well-known tool based on material on regular
    languages.


    Formalisms for language and logic have ancient roots, in India for language and
    in Greece for logic. Each field has enjoyed renewed attention in more recent times,
    starting in the 19th century for logic and early in the 20th for language. These
    latter thrusts are more formal yet still independent of computing. The venerable
    histories of logic and linguistics suggest the inherent fascination that each
    has held for human minds. Building on that motivation, this book stresses the
    relationship of each to computer science. The two fields are also related to each
    other in various ways that emerge in this text. Watch for these important links
    among logic, formal language and computing.'
  merge: -1
  pgno: 12
