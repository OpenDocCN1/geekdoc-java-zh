    is no ambiguity as to whether string $x$ is in $L_D$ or not. $\{M_j\} = bin(i)$,
    a string $x \in L_D$ iff the machine encoding is $x$ does not accept $x$. This
    is the sense in which this is a “diagonalization” argument.


