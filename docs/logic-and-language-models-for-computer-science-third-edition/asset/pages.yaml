    Ex: 12.3 We only explain the design; it can be built with 15 states. First we
    find the center of the input. We bounce and forth changing as to As and bs to
    Bs starting from each end working towards the middle. (If the string is of odd
    length it should eventually fail to find a matching lower-case symbol and halt
    without accepting.) This first phase should end with the tape head positioned
    over the first symbol of the second half of the input, and the input shifted into
    upper-case symbols but otherwise unchanged.


    We are now going to match symbols in the second half with the first half; matched
    symbols will become Xs. The second phase has a series of subphases, each consisting
    of a back and forth pass. To begin a subphase we change the symbol scanned into
    an X while “remembering” if it was an A or a B (going into a set of states corresponding
    to A or to B) and then go back to the first unmatched symbol of the input looking
    for a match. It should find an A if it is remembering an A or a B if it is remembering
    a B; if the matching symbol is found it is replaced by X and we continue, otherwise
    we halt without accepting. We continue scanning back to the first unmatched symbol
    in the second half (that is, after the middle X, or Xs) and begin another subphase.
    We halt and accept the input when all the input has been changed into Xs.'
