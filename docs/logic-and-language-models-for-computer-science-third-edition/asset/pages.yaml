    where the number represents the payment to named individual, but the payments
    to an individual are not necessarily consecutive. Note that the name may compose
    of two or three fields; we assume that names are consistent through the file.


    Consider this code:


    ```

    NF==3 {print $2 $1, $0}

    NF==4 {print $1 $2, $0}

    ```


    This produces a file with a new field, a “key,” at the beginning of each line:


    SmithJim Jim Smith 23.34

    JohnsonBobG. Bob G. Johnson 122.56

    SmithJim Jim Smith 5.21


    This output file can be sorted with the effect that the various records of each
    person will become contiguous. Assume that this new file has been sorted. Now
    we want to use the new file as input to a second awk program:


    ```

    NR==1 || $1==prevkey {total = total + $NF}

    NR>1 && $1==prevkey {print prevname, total = $NF}

    {prevkey = $1; $NF = ""; prevname = $0}

    END {prevname, total}

    ```


    Assuming the data and the two programs are in the files data, prog1, and prog2,
    respectively, then this


    ```

    awk -f prog1 data | sort | awk -f prog2 > outfile

    ```


    produces the output file:'
