    that will guarantee truth (is a tautology). Recall, such a rule is said to be
    sound. Clearly we only want sound rules. It may also appear that we are evaluating
    a rule positively when we make favorable comments about how reasonable it seems.
    For example, we observed that rules like case analysis seem to make good common
    sense. Reasonableness is nice, but for formal proofs, soundness is essential.


