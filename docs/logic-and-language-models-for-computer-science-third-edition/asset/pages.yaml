- img_proc: true
  md: '# B.2 Writing Expressions


    There are predefined variables that can be used in AWK code. The variable NR is
    equal to the number of the current record (that is, the most recently read record).
    The variable NF is equal to the number of fields of the current record. The string
    variables s1, s2, s3, ... are the strings corresponding to each consecutive field
    of the current record. The variable $ corresponds to the entire record, and NF
    is the string corresponding to the last field.


    User-defined variables are not declared. The type of such a variable is inferred
    by how it is used. Type conversion occurs as needed by the various operators.
    Numeric variables are automatically initialized to 0 and string variables are
    initialized to the empty string.


    The operators are the standard operators of most languages. The assignment operator
    is = but variables like +=. Arithmetic operators are normal and the relational
    operators are <, <=, =, >, .. The string concatenation operator is just a blank.
    The logical operators are || (or), && (and), and (not). There are several predefined
    functions; only three of them are mentioned here. First is the length function:
    length(string) takes a string as its argument and returns its length. By convention
    it can be written with no argument at all, length, in which case it is the same
    as length($). The function substr(string, start, length) returns the substring
    of string length characters, starting in position start. Third, rand() returns
    a random floating point number, such that 0 ≤ rand() < 1.


    The matching operators are new and crucial to most AWK programs. The operators,
    and ~, separate a string from a regular expression. Regular expressions are explained
    in the next section. An example is string~/abc/, where /abc/ is the simple regular
    expression representing the string “abc” and the matching operator returns true
    if the string “abc” appears in the string stringa. A very common special case
    is when the string operand is $, the entire record; by convention $~/abc/ can
    be written simply as /abc/.'
  merge: -1
  pgno: 401
- img_proc: true
  md: '# B.3 Writing Regular Expressions


    A regular expression RE is enclosed in slashes. What comes between the slashes
    is a normal RE, but with several syntactic conventions that are explained below.
    This notation extends REs by permitting some useful operations that are not part
    of the core definition of REs. Yet this notation is only an extension and not
    a whole new kind of representational system inasmuch as practically any example
    can be rewritten as a normal RE. Still, in many cases of interest the use of the
    extra operators will allow a more compact expression than the corresponding RE.


    See Figure B.1. While regular expressions are normally delimited by slashes, there
    are optional ways of designating a regular expression. For example, instead of
    s2 ~`/x[a-z]*f/` we could use double quotes: s2 ~"x[a-z]*f*". Also we could set
    the variable var to the string x[a-z]*f and write s2 ~`var`.'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# B.4 Writing Patterns


    A pattern is essentially a boolean expression, using variables that refer to the
    current record. If the expression evaluates to true the corresponding actions
    is invoked. There are two special patterns, that must be used alone, BEGIN and
    END. BEGIN evaluates as true only once, before the first record is read. END evaluates
    as true only once, after the last record is read. Using the details above we can
    now write examples of interesting patterns.'
  merge: -1
  pgno: 403
- img_proc: true
  md: 'Concatenation is the same as in REs.


    | The vertical bar separates alternatives instead of the plus sign used in ordinary
    REs.


    +   ( Parentheses are used in the ordinary way; for grouping. They do not add
    any meaning.


    +   * Star stands for zero or more occurrences of its operand, just as it does
    in REs.


    +   + Plus means one or more occurrences of whatever it is applied to. That role
    is taken by the vertical bar.


    +   ? A question mark after choice sign, so ?(b+A). This operator has the high
    precedence as star and plus. For example, the expression ab?cd=e can match with
    acde, abcde, abcdde, abcdde.... Another example is -(01)+ which will match non-empty
    sequences of integers, or without a preceding unary newline.


    +   \ Backslash before an operator makes it behave like an ordinary character.
    For example, \+ matches an input sign and \. matches a period or decimal point.
    However, by convention, \ stands for the tab and \n means newline. Since regular
    expressions are delimited by slashes, if a slash appears in the regular expression
    it should be escaped as \/


    +   [ Bracket define some characters, as [aeiou] denotes any vowel, just like
    [aeiou]. Inside brackets, most of the symbols lose their special properties; for
    example, [/] represents a choice between star and slash, [.] denotes a choice
    among sentence-ending punctuation marks, and [ ] denotes a choice among comma
    or blank. You should precede it with a backslash. This [\t] matches whitespace
    within a line. See the next two.


    +   - Characters with consecutive ASCII codes can be expressed with a hyphen within
    brackets; for example, [a-z] is for any lower-case letter, and [a-zA-Z] for any
    letter. However, a bracketed choice at the beginning or end of RE [-+] stands
    for an optional sign character.


    +   - When caret appears at the start of a bracketed pattern, it negates the remaining
    characters. Thus [^aeiou]+ matches a sequence of one or more consonants. A further,
    use of caret is when it appears at the beginning of a pattern: it matches no character
    but matches the beginning of the string.


    +   $ When $ appears at the end of a pattern; it matches no character but does
    match the end of the string.


    +   - A period matches any single character except newline. The pattern "b..b"
    matches any sequence of four characters starting and ending with a "b".


    # Figure B.1: AWK regular expression notation


    *'
