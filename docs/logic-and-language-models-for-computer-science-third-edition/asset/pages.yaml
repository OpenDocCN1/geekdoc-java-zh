  md: '# 1.1 Sets and Sequences


    A set is an unordered collection of distinct elements. The elements are typically
    thought of as objects such as integers, people, books, or classrooms, and are
    written within braces, like this: {Friday, Saturday, Sunday}. When working with
    sets, it can be important to specify $U$, the universe of elements (e.g., the
    set of days of the week) from which the elements of particular sets are drawn.
    Note that the universe itself is a set: the set of all elements of a given type.


    Sometimes the universe is only implicitly specified, when the reader can easily
    figure out what it is. The elements are said to be in the set and called it its
    members.


    Sets can be presented in two forms. The extensional form enumerates the elements
    of the set, while the intensional form specifies the properties of the elements.
    For example:


    ```

    $S = \{11, 12, 13, 14\}$

    ```


    ```

    $S = \{x \mid x \text{ is an integer, and } 10 < x < 15\}$

    ```


    are extensional and intensional forms of the same set. The second of these is
    read "those $x$ such that $x$ is an integer and ..." Note that the universe, the
    set of integers, is implicit in the first example and only informally specified
    in the second. The empty set is a set with no element and is denoted $\emptyset$.


    Because the elements of a set are distinct, one would write sets with no repetition.
    For example, suppose a database includes countries of origin and it shows the
    participants in a seminar as being from China, France, China, Egypt and France.
    Then the set of countries represented in this class is {China, France, Egypt}.
    There is no concept of ordering within a set; there is no "first" element, For
    example, the sets {4, 2, 3} are the same set.


    If ordering is important one speaks of a sequence of elements. In the extensional
    form of a sequence the elements appear in order, in parentheses, not braces. For
    example, the sequence (4, 2, 3) is different from (2, 3, 4). Further, sequences
    need not have distinct elements, so the sequence (2, 3, 3, 4) is different from
    (2, 3, 4). A sequence of length 2 is'
  merge: -1
  pgno: 16
- img_proc: true
  md: "called an ordered pair. A sequence of length 3, 4 or 5 is called a triple,\
    \ quadruple or quintuple respectively; in the general case of length n, the word\
    \ is n-tuple. Sequences are often implemented as one-dimensional arrays or linked\
    \ lists. This leads to an intensional form for sequences, where we use subscripts,\
    \ so the extensional notation, like $(x_1, x_2, x_3)$, can replaced with a direct\
    \ definition of $x_i$, for each $i$.\n\nThe cross-product of $S_1$ and $S_2$,\
    \ denoted $S_1 \times S_2$, is the set of ordered pairs of elements whose first\
    \ is in $S_1$ and the second is in $S_2$.\n\nFormally,\n\n$S_1 \\times S_2 = \\\
    {(x, y) \\mid x \\in S_1 \\text{ and } y \\in S_2\\}$.\n\nFor example, $\\{a,\
    \ b\\} \\times \\{c, d, e\\} = \\{(a, c), (a, d), (a, e), (b, c), (b, d), (b,\
    \ e)\\}$. Just as the elements of $S_1 \\times S_2$ are ordered pairs, the elements\
    \ of $S_1 \\times S_3$ are triples, and so on.\n\nSet operators are discussed\
    \ later, but we start with two basic ideas, the notions of membership and comparison.\
    \ The notation $x \\in S$ means that $x$ is an element of $S$. $x \\notin S$ means\
    \ that $x$ is not in $S$. When $S = \\{11, 12, 13, 14\\}$, $12 \\in S$ and $16\
    \ \\notin S$. We say that $S_1$ is a *subset* of $S_2$, written $S_1 \\subseteq\
    \ S_2$, if each element of $S_1$ is also an element of $S_2$. For example, $\\\
    {12, 14\\} \\subseteq \\mathbb{C}=\\{11, 12, 13, 14\\}$. Note that $S \\subseteq\
    \ S$. Now consider subset $T$, that is not equal to $S$, because it is missing\
    \ one or more elements of $S$. While it is correct to write $T \\subseteq S$ we\
    \ may choose to write $T \\subsetneq S$, which states that $T$ is a *proper subset*\
    \ of $S$. The empty set is a subset of any set, so we can write $\\emptyset \\\
    subseteq S$, for any set $S$."
