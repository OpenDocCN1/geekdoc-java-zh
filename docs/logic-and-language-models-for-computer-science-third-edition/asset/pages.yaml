  md: '# 8.6 Grammars: The General Idea


    The primary approach to language generation is to use grammars. Special generative
    techniques like REs, while useful, will not generalize in later chapters. A grammar
    is basically a set of rules, grammatical rules, that specify how to build up longer
    and longer strings in the language. These rules for specifying what is and is
    not in a language are more precise than the statements in traditional grammars
    of English and other “natural languages.\ However the basic ideas of natural language
    grammars inspired some of the formalisms.


    A grammar begins with an enriched alphabet, which we call Φ. All the symbols of
    the alphabet that we use to form strings, Σ Φ. But we also include “metasymbols”
    that are not found in strings, but serve during the building process to represent
    categories of strings. These metasymbols will be called variables. During the
    building process we will use strings over the alphabet Φ, so they will contain
    a mixture of variables and symbols from Σ.


    A grammar will also have a set of substitution rules, called productions. A production
    specifies two strings, α and β, over Φ and is written α → β. We require α ≠ Λ.
    The intent of the rule is to specify how to transform a string γ₁ over Φ that
    contains α as a substring into a new string γ₂. When such a transformation occurs
    we call it a derivation step and it is denoted γ₁ → γ₂. The definition is:


    > (γ₁ → γ₂) if (γ₁ = μ₁αμ₂ and γ₂ = μ₁βμ₂)


    relative to a production α → β. We also define the closure of the derivation step:


    > (γ → μ) if (γ = μ or γ = μ₁ ⇒ μ₂ ... ⇒ μₖ = μ, for some k > 1).


