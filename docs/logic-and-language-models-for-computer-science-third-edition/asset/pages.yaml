    **Proof:** Let G = (V, Σ, S, P). We define G'' = (V'', Σ, S'', P'') as:


    +   V'' = {V♭ | B ∈ 2V}

    S'' = {S♭ | S ∈ V}

    P'' = {VA → aB | B = ₐA Z<a>,A for all a ∈ Σ,A ∈ V and A ≠ ∅} ∪ {VA → Λ | there
    exists an A ∈ A where A → Λ ∈ P}


    where


    Za,A = {Y | A → aY ∈ P} for every a ∈ Σ and A ∈ V.


    Note that the elements of V are subscribed with s of elements from V. (So V''
    can be exponentially larger than V.) Clearly G'' is a deterministic regular grammar,
    by construction. What remains to be shown that it generates the same language.
    The key idea is that any derivations with G and G'' are closely linked, as demonstrated
    by this claim.


    **Claim:** For any x ∈ Σ* and A ∈ V, S → xA with G if S'' → xA with G'' where
    A ∈ A.


    **Proof:** This is proved by induction on k, the length of the derivation. It
    is true for k = 0 because of the definition of S''. Assume it is true for all
    derivations of length k, k ≥ 0. Suppose that using G step k + 1 used A → bC, so
    S → xA = xbC. By the inductive hypothesis we can say using G'' has S → xVA, with
    A ∈ A. Since C ∈ Zb,A, we know that the deterministic next step xVA = xbB we know
    C ∈ B. For the second half of the proof (the “if” part), suppose that using G''
