  md: '# 4.2 Predicates, English, and Sets


    Human languages express the idea of predicates in many ways. For example, in the
    preceding section we borrowed the word “mother” from English for our logic predicate
    MOTHER, as in MOTHER(x, y), meaning that x is the mother of y. Human language
    is not always precise and unambiguous, and even a simple word “mother” can be
    used differently, say in a metaphor like “necessity is the mother of invention.”
    Still, we will assume that such examples are clear enough. Let us look at more
    examples of how predicates are expressed in English. Of course, every other human
    language expresses ideas similar to those discussed.


    Nouns like “aunt,” “brother” and the words for other family relations translate
    readily to two-argument predicates, just like “mother.” Adjectives of nationality,
    “French,” can be used as one-argument predicates, as in BELGIAN(Poriot). Notice,
    though, that there is nothing about the idea or the definitions of predicate logic
    to stop us from writing this as a two-argument predicate like CITIZENSHIP(Poriot,
    Belgian), and that may be more convenient from a computational viewpoint. It is
    up to us to use the framework that logic provides. Names are a matter of choice.
    Thus although we meant Poirot here fictional detective Hercule Poirot, the constant
    Poirot stand for someone (or something) else, so long as we are consistent.


    Adjectives for color can be expressed with one argument, as in BROWN(Desk-1),
    but here again, as in the case of citizenship, it is often useful to use the general
    idea — in this case, color as the predicate. Doing so again leads to two arguments:
    COLOR(Desk-1, Brown). Other adjectives, those for size, express a property that
    really applies not to a single object but the object in relation to its class.
    For example, a big ant is nowhere as big as a small elephant. So a big ant is
    big with respect to ants only, not with respect to animals or things in general.
    To capture this idea in predicate logic, we may wish to write BIG(Ant-3, Ant),
    meaning that Ant-3 is big for ant. Taking the more general notion of size as the
    predicate would lead to having three arguments: SIZE(Ant-3, Ants, Big).


    # Example 4.2'
