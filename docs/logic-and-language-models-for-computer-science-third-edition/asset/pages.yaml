    the proof of Theorem 10.3 shows that there is an effective procedure to convert
    it into that form. We will also assume that all derivations are leftmost and therefore
    each derivation is of the form indicated by Lemma 10.4. So $G=\{V, \Sigma, S,
    P\}$, where each production in P is of the form $A \rightarrow ba$, where we define
    the NPDA $M=(\{q_0\}, \Sigma, V_{q_0}, S, \delta)$, where the stack alphabet is
    the same as the set of variables in $G$. Further the start symbol is the same
    as the grammar''s start symbol. Notice that $M$ has only one state! The transition
    function is defined by:


    > $\delta(q_0, b, A) = \{(q_0, \alpha) \mid A \rightarrow b\alpha \in P\}$


    The key idea is that derivations of $G$ and computations are closely linked, as
    detailed by this claim.


    Claim: For every $x \in \Sigma^*$ and $\beta \in \Sigma^*$, $S \xrightarrow{x}
    x\beta$ iff $(q_0, S) \xrightarrow[x]_* (q_0, \beta)$.


