  md: '# 8.9 Deterministic Regular Grammars


    To motivate this discussion consider this example.


    # Example 8.24


    Using the grammar from the previous example, generate x = aabaabb and y = aabaab.
    Recall


    $P = \{S \rightarrow aA, A \rightarrow aB, A \rightarrow bA, A \rightarrow bB,
    B \rightarrow aS, B \rightarrow bB, B \rightarrow \Lambda\}$.


    Starting off, reading the target string from left to right, we see the first symbol
    must be an $a$ and must be derived from the start symbol, so the first derivation
    step must be $S \Rightarrow aA$. Now the A must produce the next $a$ and so the
    next step must be $aA \Rightarrow aaB$. Continuing in this way the derivation
    of either $x$ or $y$ is forced to start


    > $S \Rightarrow aA \Rightarrow aaB \Rightarrow aabaS \Rightarrow aaaAA$.


    Now there is a problem. For both $x$ and $y$ we need to generate a $b$ but there
    are two productions to choose from: $A \rightarrow bA$ and $A \rightarrow bB$.
    Since there is a choice, nondeterminism suddenly arises. For $x$ we must choose
    the first production and for $y$ we must choose the second one.


    Clearly by “looking ahead” in such examples we can see which choice is the right
    one. However we can construct examples where looking ahead becomes more and more
    complex. In this section we show that instead we can always change the grammar
    so that you can derive any given string in the language without ever making a
    choice, and so no look-ahead needed.


    # Definition 8.11


    # A deterministic regular grammars


    A deterministic regular grammar G is a regular grammar but it is not allowed to
    have two productions $A \rightarrow aB$ and $A \rightarrow aC$, where $B \neq
    C$, for any $a \notin \Sigma$ and any $A, B, C \in V$.'
  merge: -1
