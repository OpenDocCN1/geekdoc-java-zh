  md: 'We have to be very careful. Suppose that we have just processed 6 input characters:
    ababab. Should we be in state $q_2$ (because the last two characters were ab)
    or to state $q_4$ (because the last four characters were ab). Clearly we need
    to be in state $q_4$, otherwise if the next input character was a $b$ and we were
    in state $q_2$ we would not realize we had just encountered the fifth character
    of $P$. In general, you would never be in state $q_i$ if you could be in state
    $q_j$, where $j > i$.


    If you were in state $q_4$ and you encountered an a in the input. It follows that
    the last five characters of the input were $ababa$. We appear to have a choice
    between $q_1$ and $q_3$, but using the observation above we see that we must make
    a transition to state $q_3$. This sort of example can be generalized into a single
    rule: if we are in state $q_i$ and the input is $\sigma$ then we must make a transition
    to state $q_j$


    ```

    $j = \max\{k \mid (k=0) \vee (1 \le k \le m \wedge p_1 p_2 \dots p_k = p_{i-k+2}
    \dots p_i \sigma)\}$.

    ```


    We know that we have just encountered all the characters leading up to the ith
    character of $P$, and we try use as many of them as possible in choosing $j$.
    It is important when interpreting this rule to realize there are two degeneracies,
    when $j=1$ and $j=0$. When $j=1$, none of the prior characters match up but we
    do keep track of the fact that the new input $a$ matches up with the first character
    of $P$. When $j=0$ we go to the state $q_0$ which means we have made no progress
    at all towards finding $P$.


    We are now ready to build an FA using only the states $Q=\{q_0, q_1, \dots, q_m\}$.
    We will make $q_m$ an accepting state, for the same reason we did in the NFA.
    Using the rule above we can generate all the other transitions we need. For $P=ababb$,
    we get this machine:


    ![](img/e49d977e0cc4db78b7174ba16fc32998_251_0.png)


    This gives a general technique for building FAs to solve the pattern matching
    problem. It is rare that we are able to find such a general technique; most FAs
    are found less systematically.'
