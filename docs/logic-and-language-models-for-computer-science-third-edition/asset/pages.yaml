  md: '# 2.6 Normal Forms


    For computational purposes, it simplifies various algorithms to convert logical
    expressions to a normal (or standard) form. The first of the “normal” forms we
    will introduce here is used in artificial intelligence, the second in hardware
    design.3


    # Example 2.7


    Using the laws just introduced we replace the biconditional operator in p q to
    obtain an equivalent expression only using the operators ∧ and


    ```

    p ↔ q ≡ (p → q) ∧ (q → p)

    ≡ (¬p∨ q) ∧ (¬q∨ p)

    ```


    Define a literal to be either Boolean variable or its negation, e.g. p or ¬q.
    Define a conjunct as one or more literals “or”ed together, e.g. ¬q∨ R ∨ ¬p. Next
    define an expression to be in conjunctive normal form (CNF) if it is one or more
    conjuncts “and”ed together. The previous example resolved to CNF.


    The second normal form starts with the same definition of literal. Next we define
    a disjunct as one or more literals “and”ed together, e.g. ¬s∧ p∧ ¬q. Finally define
    an expression to be in disjunctive normal form (DNF) if it is one or more disjuncts
    “or”ed together; see the next example.


    # Example 2.8


    As a further exercise, we will continue to manipulate the previous example. Continuing
    from above, using the distributive law twice


    ```

    ≡ (¬p∧¬ q) ∨ (¬p∧p) ∨ (q∧¬ q) ∨ (q∧p)

    ≡ (¬p∧¬ q) ∨ FALSE ∨ FALSE ∨ (q∧p)

    ≡ (¬p∧¬ q) ∨ (q∧p)

    ```'
