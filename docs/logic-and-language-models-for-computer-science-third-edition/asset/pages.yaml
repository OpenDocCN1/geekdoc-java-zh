  md: '# 12.5 Limits on Turing Machines


    The Turing Machine has been presented as the most powerful model of computation,
    a point to which we return in Section 12.7. Still, there are limits to what this
    class of machines can do. For some languages there is no TM at all; such a language
    is not recursively enumerable. Other languages, though they are recursively enumerable,
    are not recursive; for these there is no TM that reliably halts.


    **Theorem 12.3** – There exists a language that is not recursively enumerable.


    Proof: Theorem 12.1 states that the number of languages is uncountable. On the
    other hand we showed in Section 12.4 that each TM can be encoded as an integer,
    so it immediately follows that the set of all TMs is only countably infinite.
    Thus there are “more” languages than TMs, so after you map TMs to the languages
    they accept, there must be languages left over that do not correspond to any TM.


    This proof is not very satisfying. It shows that such a language must exist without
    exhibiting it. We can get a specific language that is not recursively enumerable
    by applying the diagonalization technique used Section 12.3 directly to TMs. Recall
    that $M_i$ is the $i$-th TM, as defined in Section 12.4.


    ```

    $L_D = \{bin(i) \mid i \in \mathcal{N} \text{ and } M_i \text{ does not accept
    } bin(i)\}$

