  md: "# 3.5 Assumptions\n\nAssumptions play an important role in proofs; in fact,\
    \ at least one of them will appear in almost every proof from this point on. An\
    \ assumption is unlike an axiom in that it is only introduced tentatively. We\
    \ don't claim to know that the assumption is true and it is essential to indicate\
    \ that lack of commitment. To motivate we will incorporate assumptions consider\
    \ a proof of the sequent $\\alpha \\vdash \beta$:\n\n+   1. $\\alpha$ given\n\
    2. $\\alpha_1$ inferred\n3. $\\alpha_2$ inferred\n4. ...\n5. $\beta$ inferred\n\
    \nNow consider the relation of the sequent $\\alpha \\vdash \beta$ to the proposition\
    \ $\\alpha \rightarrow \beta$. If the sequent was valid the proof exists. It was\
    \ constructed with agreement with the reader that $\\alpha$ is true. Now how would\
    \ we prove the proposition to. To believe, all we have to do is prove that we\
    \ are in one of three states: either $\\alpha=$ FALSE, or both $\\alpha=$ TRUE\
    \ and $\beta=$ TRUE. The reader does *not* necessarily know or even have an opinion\
    \ about the true value of $\\alpha$. All the reader wants to be of that we are\
    \ not in the state where $\\alpha=$ TRUE and $\beta=$ FALSE! One way to do that\
    \ is to show that if $\\alpha=$ TRUE then $\beta=$ TRUE (and not FALSE). However\
    \ that is exactly what a proof of the sequent $\\alpha \\vdash \beta$ does.\n\n\
    Here nesta a strong relationship between proofs of sequents and proofs of implications,\
    \ even though the reader believes it is different. We need this important distinction\
    \ to manifest itself in our formal presentation. There are two parts to the notation\
    \ for an assumption. First, we put the assumed statement in brackets, e.g., $[\\\
    alpha]$. Second, we indent the statement and *everything proved from it*, so that\
    \ we do not confuse what is really known and what is only on our tentative assumption.\
    \ We sometimes say that the indented expressions are only true “relative to the\
    \ assumption.” This use of indentation is analogous to the use of stylistic indentation\
    \ for readable structured programs in, say, Java or C++. The indentation makes\
    \ explicit the “scope” of the assumption. The scope of an assumption is called\n\
    \n**subproof.**\nSo the proof of the above sequent justifies the indented subproof\
    \ below:"
  merge: -1
