    | with 1 or 2 premises: | $\\alpha_2$ |\n| $\beta$ | $\beta$ |\n\nInference rules\
    \ have a dual nature that we mention now and return to later. First and foremost\
    \ inference rules are given, they are not part of the proof. We do not need to\
    \ justify them, we simply use them. They allow the theorem prover to introduce\
    \ new propositions given the acceptance of other propositions. We must remember\
    \ that a proposition in a formal proof is an symbolic expression — a string or\
    \ perhaps an expression. For example, when applying modus ponens if the expression\
    \ $(\neg p) \\rightarrow (q \\vee r)$ has appeared in a proof (i.e. the reader\
    \ has agreed it is true) and if the expression $\neg p$ has also appeared then\
    \ we can confidently add the expression $(q \\vee r)$. We do not need to “understand”\
    \ any of these expressions. The inference rule treats these expressions as strings.\
    \ A rule is carte blanche for the theorem prover, who uses it without knowing\
    \ why it works.\n\nThe second aspect of the dual nature of inference rules seeks\
    \ to explain why they were given to the theorem prover in the first place. We\
    \ could give the theorem prover inference rules that seem arbitrary. But we don't.\
    \ Why? Because the reader would lose interest. What makes the whole approach interesting\
    \ is that we only choose rules that are “sound”. To justify an inference rule\
