    with the $\delta$ used for NFAs: $\delta$ is a set-valued function. The key difference
    is that each transition in the state is an ordered pair, specifying the new state
    and the stack action. Here, $\delta$ will have three arguments: a state and an
    input symbol, and also a stack symbol, which will be the top symbol. The output
    of $\delta$ will be a set of ordered pairs. For example if


