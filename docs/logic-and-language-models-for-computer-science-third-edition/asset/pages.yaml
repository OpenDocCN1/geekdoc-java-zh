  md: '# 7.2 Formal Languages


    Models ignore details to allow a clear focus on particular aspects of interest.
    The field of formal language models makes a startling choice: it focuses on the
    statements themselves — the sequencing of their basic symbols — while it ignores
    the meaning, except in the most simplistic way. There is no attempt to specify
    or characterize the meaning of a sentence or a programming statement.(The study
    of formal languages can be extended, in several ways, to incorporate the meaning,
    or semantics, of sentences; discussions of formal semantics are beyond the scope
    of this book.)


    As just noted, the field of formal models of language focuses on sequences of
    symbols. These will be called strings, a term that is neutral between the statements
    of programming languages and the sentences of human languages, and that may also
    serve to remind us that meaning has been stripped away. Recall in Chapter 1 we
    gave several definitions strings, which we repeat here to keep this chapter self-contained.


    The specification of any particular language begins with an alphabet which is
    defined to be a finite set of symbols, for which we adopt the name Σ. A string
    is defined to be a finite sequence of symbols from an alphabet; we say it is a
    string "over the alphabet." A formal language — called just a language thereafter
    — defined simply as a set of strings. One can also say that a language is a subset
    of all the possible strings that can be formed using its alphabet. A key question
    will be, for any particular language or class of languages that interests us,
    how can we specify precisely which strings are to be included?


    According to these definitions, everything is built up from symbols in some alphabet
    Σ. What is a symbol? For composing the strings (sentences) of English, Σ might
    be the words of a huge set. For a programming language, Σ might be the keywords
    and variables. While this might seem natural we adopt a far simpler view. English
    words have meaning... instead we regard a symbol to be an atomic (i.e. indivisible)
    unit. We will only be interested in the structure of the strings, in other words,
    the pattern of symbols.


    # Example 7.1'
