  md: '# Chapter 8


    # Generative Models of Regular Languages


    We argued in the early chapters that recursively defined expressions had a dual
    nature. The definition indicates that membership in the set is certified by recursively
    decomposing expressions into simpler subexpressions, until reaching some base
    cases. But computer scientists and most people have the more commonplace view
    of building an expression up from smaller ones. This building process need not
    be guided by some previous decomposition; anything that can be built up by the
    rules is an expression. In this chapter we explore this in more detail.


    We will present two generative definitions of languages classes and show that
    they are the same class. We will call this class the class of regular languages.
    We will show they are equivalent by showing each is contained in the other. In
    the process we will need to introduce the concept of nondeterminism because of
    its close relationship to generative methods.'
