  md: '# 8.8 Unifying the Approaches


    To prove the next theorem we introduce the concept of a generalized regular grammar
    that is forgotten as soon as the proof ends.


    # Definition 8.10


    A generalized regular grammar G extends the definition of regular grammar so that
    each production is of the form $A \rightarrow A$ or $A \rightarrow rB$ where $r$
    is a regular expression over $\Sigma$. The latter is interpreted to mean that
    the variable $A$ can be replaced by the string $xB$ for any $x \in \mathcal{L}(r)$.
    A unit production indicates $x$ is the empty string; we might write $A \rightarrow
    B$ as $A \rightarrow \Lambda$ to emphasize this.


    Note that normal regular grammar is, without change, already a simple generalized
    regular grammar.


    **Theorem 8.2** – If $L = \mathcal{L}(G)$ for any regular grammar $G$ then there
    exists a regular expression $r$ such that $L = \mathcal{L}(r)$.


    **Proof:** The proof follows from the correctness of Algorithm 8.3 which itself
    follows from this loop invariant claim. The second **for** loop is used to simplify
    the later “each triple” test, since $r_2$ exists for every variable $B$. For that
    triple test we assume $A \neq B$ and $B \neq C$.


    # Algorithm 8.3


    **Constructing an RE from a regular grammar**

    Input: A regular grammar $G = (V, \Sigma, S, P)$.

    Output: A regular expression $r$ over $\Sigma$, such that $\mathcal{L}(r) = \mathcal{L}(G)$.'
