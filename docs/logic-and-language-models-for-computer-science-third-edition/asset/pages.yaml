  md: '# Chapter 9


    # Finite Automata and Regular Languages


    In Chapter 7 we stated that a fundamental computational problem for formal languages
    was recognition. The goal is to design mechanisms that can answer questions of
    the form: for a given language L and string x, is it true or false that x ∈ L?
    We will approach the problem by designing special-purpose “hardware” for each
    language, with no operating systems and no software. Each language L is to have
    its own machine whose only task is to take arbitrary input strings over the alphabet
    of L and for each string cinder decide whether or not it is a member of L. We
    call such a machine design an automaton (plural: automata). Therefore, each language
    that has an automaton has a complete computational model of a recognition process
    for that language.


    In this chapter we introduce a simple way to specify a category of automata and
    determine what class of languages such automata can recognize. In fact, it will
    be the class of regular languages. In later chapters these automata will be enhanced
    by extra mechanisms, to get more complex categories of automata that recognize
    broader — and equally important classes of languages. One interesting and important
    aspect of this machine-design approach is that it allows us to compare the complexity
    (or simplicity) of language classes by comparing the complexity of the corresponding
    classes of automata. Even though we speak only in terms of design and not about
    actual machines, these designs could readily be implemented as real circuitry.
    Electrical engineers routinely begin the design of hardware with the specification
    of an automaton. A computer scientist, in contrast, is more likely to translate
    an automaton into a computer program, which simulates its behavior. In fact, some
    theories of software engineering, specify a program’s actions with an automaton.
    In either case, this formal theory is crucial in understanding the computational
    aspects of languages.'
  merge: -1
