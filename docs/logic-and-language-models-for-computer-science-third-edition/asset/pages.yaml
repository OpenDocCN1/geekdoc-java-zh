  md: '# 7.5 The Questions of Formal Language Theory


    It is easy to define a language to be a “set of strings,” but that seems to be
    too general to be useful. How does a Computer Scientist use this theory? What
    sort of questions are we going to ask? Answering this will help us understand
    how we are going to proceed in the next few chapters and will motivate the choice
    of topics.


    How is a language specified? The discussion of Example 7.5 emphasizes that languages
    are set and can therefore be presented in extensional or intensional formats.
    The extensional form, which explicitly enumerates the elements, can only be used
    for small finite languages (though one may sometimes successfully communicate
    a simple infinite language to another person informally using a few sample strings
    and ‘…’. The intensional format uses a specification of the properties of the
    strings it contains. That statement may be informal or formal; here is an example
    of each.


    ```

    $L = \{x \mid x \text{ contains an number of } as \text{ and } bs\}$

    ```


    ```

    $L = \{x \mid x \in \{a,b\}^* \wedge \mathcal{N}_a(x) = \mathcal{N}_b(x)\}$

    ```


    $\mathcal{N}_a(x)$ denoting the number of occurrences of the symbol $a$ in the
    string $x$, the informal and the formal versions specify the same language here.
    Note that the informal definition only indirectly implies a two-letter alphabet.
    Thus for each them $abababba \in L$ and $aabaab \notin L$. Formal intensional
    specifications enable us to prove things about a language, and in way can be more
    helpful than informal descriptions and partial listings of strings. However, none
    of these kinds of representation is suitable for answering the computational questions
    about language. In subsequent chapters we will therefore be introducing a variety
    of formal representations specifically devised for language, that enable us to
    deal with such questions.


    What are the key computational questions about language?


    Arguably the central questions are how to generate the strings and how to recognize
    them.


    Generation: How can we generate the strings of a language?


    The interesting and useful languages are usually of unlimited size, in other words,
    infinite. Therefore we cannot define them extensionally, simply by listing their
    strings. Rather, we need a finite — indeed compact — way to'
