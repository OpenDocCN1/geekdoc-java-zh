  md: '# 6.7 The Debate About Formal Verification


    For at least forty years the value of formal proofs of the correctness of programs
    has been appreciated. Much research has been done on designing languages and systems
    that facilitate such proofs, and on the underlying mathematical logic. There has
    also been much effort to teach programmers to incorporate these techniques as
    they build software.


    Work on correctness proofs has had only limited success. No large or even moderate-sized
    software projects have been formally proven to be correct. Additional reasons
    have been put forward for not using these techniques.


    +   - they are too sophisticated for most programmers.


    +   - they lead to straightforward algorithms and code reuse, stifling creativity.


    +   - they assume the specifications are correct when, in fact, the major source
    of real-life errors is in the specifications.


    +   - they prove the underlying algorithm is correctly implemented but the program
    runs on a complicated collection of hardware and software components which may
    or may not be correct.


    The hope is that the process can be automated, however the construction of the
    various preconditions, postconditions, and loop invariants seems to involve the
    programmer to some degree.


    The good news is that a knowledge of formal verification techniques helps inform*
    even when only informal verification is being practiced. We already mentioned
    that structured programming principles derive from the desire to create code that
    is easily (either formally or informally) proven correct. Similarly all good programmers
    will document their subroutines with the preconditions and postconditions for
    that code (that is, what is known about the parameters and what about the subroutine
    returns). And, in general, a good programmer will always know and document at
    key points the state of the program, that is, the things that must be true about
    the values of important variables.


    Finally, a note about partial correctness versus correctness. It is usually not
    difficult to argue that a program, or a section of code, will terminate. For'
