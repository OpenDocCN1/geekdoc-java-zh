  md: '# 11.5 Parsing


    In Section 7.5 we discussed using CFG models to define languages by giving mechanisms
    for deciding if a string x was in language L. In other words the machine gives
    “Yes”/No” answers. What if we want more information? It turns out to be fairly
    common when the answer is “Yes” to ask for a proof of the answer.


    When a string x is generated by a CFG G we now know how to build a PDA when a
    string x is accepted by PDA it is because x ∈ L(G), so if asked to prove that
    it was correct to accept x all we need to do is exhibit a derivation of x using
    the actual derivation of a given string x called parsing.


    In some sense this is a problem we have already solved. The machine produced by
    the constructive proof of Theorem 11.1 makes a series of transitions on input
    x that mirror the corresponding derivation of x. Therefore by simply outputting
    the successive configurations of that PDA we recover the derivation.


