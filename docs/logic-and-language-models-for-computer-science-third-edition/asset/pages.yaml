    data objects — BSTs and sorted arrays — “recursive.” Hence a recursive algorithm
    suggests itself, and since it is tail-recursive it can be interpreted as iterative
    code. In Computer Science most objects are hierarchical, if not recursive, leading
    to clean code with natural proofs of correctness.'
