  md: '# 7.1 Programming Languages and Computer Science


    Programming languages are central to computing. They lie between software and
    hardware, and connect the two of them. Software (a program) is written in a high-level
    language that people can understand. It is translated (compiled) into a machine
    language that some hardware understands. More precisely, the program is translated
    into a structured collection of commands that a particular kind of computer has
    been built to be responsive. Just as it is important to understand general principles
    of hardware (architecture in general, as well as the design of individual machines)
    and general principles of software (software engineering, as well as particular
    applications), so too it is important to understand not just individual languages
    but ideas of language in general. For this purpose, we study models of language.


    Why do programming languages take the forms they do and how does a computer process
    the programs you write? To gain insight into questions like these, we model not
    only language but also mechanisms for processing it. The language-processing models
    that one uses are simple, formal machines called automata and the field of study
    that seeks understanding of both language structure and processing is often called
    “Formal Languages and Automata.” This field occupies Part II of this book.


    The study of language models begins with the observation that the key aspects
    of language are structure and meaning. As noted in the Preface, a good model strips
    away details of a topic, to simplify it, as an aid to understanding. In the case
    of formal models of language, which is the study of language structure, we make
    a gross oversimplification: we begin by throwing out language meaning! Of course,
    meanings have to be addressed, but not right now, that is, while we are in the
    midst of looking at structure. Expressing meaning can be done in various ways,
    many of them relate to predicate logic, a topic introduced in Part I.


    Practical treatment of the questions and issues raised in the study of Formal
    Languages and Automata takes place in courses on Programming Languages and Compiler
    Design. The modeling approach used here is good preparation for these practical
    topics. Books on compilers typically begin with several chapters on formal languages,
    and compiler tools are based directly on them.'
