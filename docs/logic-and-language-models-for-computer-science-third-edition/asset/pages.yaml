  md: "# 4.1 Predicates and Functions\n\nIn contrast to propositional logic’s atomistic,\
    \ true-false view of propositions, predicate logic breaks them apart to take a\
    \ more detailed look. You may recall from Chapter 2 that our first example of\
    \ a proposition was $5 > 3$. Looking now inside that proposition, we focus on\
    \ the operator, “$>$” — which is our first predicate — can be regarded as a function\
    \ of two numerical arguments. To make the connection to names clearer, we give\
    \ this operator ($$>$) a name that looks more like the name of a function and\
    \ write its name first, like this: GreaterThan(5, 3). Thus GreaterThan is a function\
    \ defined on pairs of numbers, from the set of reals $R$. In the terminology of\
    \ Section 1.2, the domain of GreaterThan is thus $R \times R$. The codomain of\
    \ this function — that is, the set to which things are mapped — is $\\mathcal{B}\
    \ = \\{TRUE, FALSE\\}$. To summarize, GreaterThan: $R \times R \to \\mathcal{B}$.\
    \ We are now ready to define predicates and relate them to propositions.\n\n#\
    \ Predicates\n\nA predicate is a function whose codomain is $\\mathcal{B} = \\\
    {TRUE, FALSE\\}$.\n\nThus GreaterThan is a predicate. It also follows from the\
    \ definition that a predicate with fixed arguments is a member of $\\mathcal{B}$\
    \ and so is a proposition. For example, GreaterThan(5, 3) is a proposition, one\
    \ whose value happens to be TRUE. Although the codomain of every predicate is\
    \ $\\mathcal{B}$, the domain is much more flexible. We used pairs of reals as\
    \ the domain in this introductory example, but later examples will use predicates\
    \ with domains of people, symbols and other numerical sets. Indeed the domain\
    \ of a predicate can be any set whatsoever.\n\nPredicate logic and variations\
    \ of it are knowledge representation system. The language of predicate logic gives\
    \ us the means to express things, but it is largely up to what to express and\
    \ how to express it. As an example of this freedom, consider a new predicate GreaterThanThree,\
    \ which takes one argument and yields TRUE for values greater than 3. Then the\
    \ values of x give GreaterThan(x, 3) = TRUE also give GreaterThanThree(x) = TRUE.\
    \ Despite this freedom, certain sensible and conventional ways of doing things\
    \ should be heeded, for example, no one has succeeded in getting a special operator\
    \ symbol for"
