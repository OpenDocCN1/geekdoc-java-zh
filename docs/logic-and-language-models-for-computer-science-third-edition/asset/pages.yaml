  md: 'The above example demonstrates typical behavior for a TM: running up and down
    the tape looking for symbol patterns to initiate certain activities. As a result,
    TMs have a reputation for being tediously slow. (Actually, while slow, they are
    not too slow, but that is beyond the scope of this discussion.) What is important
    to us is: *can a TM recognize some language L?*


    The above TM is *deterministic* inasuch as $M$ never had a choice of two transitions.
    We can define *nondeterministic* TMs by augmenting $\delta$ to allow choices.
    However it can be shown — like FAs and unlike PDAs — that the power of nondeterminism
    does not permit TMs to solve any more difficult problems.'
