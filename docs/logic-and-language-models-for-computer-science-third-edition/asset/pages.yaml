  md: 'rigorous proofs about how the reasoning works. There are important representation
    and reasoning systems (not treated here) that build on predicate logic, extending
    it to deal with time, uncertainty, approximation and other important aspects of
    knowledge.


    Propositional logic is presented in Chapter 2. It serves, in Chapter 3, as the
    basis of a discussion of proof techniques that are widely used in both mathematics
    and computer science. Building on this foundation, we move on to predicate calculus
    and additional proof methods that it supports, Chapters 4 and 5, respectively.
    This material in turn is the basis for two very different parts of computer science.
    Verification, the topic of Chapter 6, is concerned with proving programs correct,
    as opposed to just testing them on some inputs. Finally, Chapter A shows that
    predicate logic can even form the basis of programming itself, by presenting the
    rudiments of Prolog, a logic programming language.'
