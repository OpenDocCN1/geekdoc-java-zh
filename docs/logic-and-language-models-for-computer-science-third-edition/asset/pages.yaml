  md: '# ## 6.4 Loop Invariants


    The inference rule for the rule is the iteration statement is shown below. The
    condition p in the rule is called the loop invariant. It is an invariant condition
    for the loop body S because S is allowed to execute — that is, when B is true
    — p is both a precondition and postcondition for S.


    ```

    While:

    $(p\wedge B) \{S} p$

    $p \{while B do S\} (p\wedge \neg B)$

    ```


    The correctness of this inference rule relies on a proof by mathematical induction.
    To see this, imagine that we are trying to prove the following theorem: “The Assertion
    p is true after n iterations of the While loop, for every $n \ge 0$. An induction
    proof has a basis, for $n=0$, which is trivially true since this rule can only
    be invoked when p is true initially. The inductive step of induction would try
    to show that if p is true after $n$ iterations, then it is also true after $n+1$
    iterations. It is essentially what it means for p to be an invariant condition
    for S. Note, that we have shown p is an invariant condition for S as long as B
    remains true, but if there is an $n+1$ iteration then B must have been true before
    it.


    It is important to remember that if a proposition is proposed as the loop invariant
    it First it must already be true when the loop is encountered. Otherwise the inference
    can not be used in a valid proof. Second it must satisfy the Hoare triple above
    the line in the inference rule.


    Notice the occurrence of $

    eg B$ in the postcondition of the While rule. The inference rule does not address
    why B must become false. We know that $

    eg B$ holds at this point which terminates the loop is a violation of B. Since
    we are only doing partial correctness we can assume that the loop does halt after
    $n$ iterations, for some integer $n$, without proof.


