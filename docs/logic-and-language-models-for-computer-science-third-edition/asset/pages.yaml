  md: "# 11.6 Deterministic Pushdown Automata and Parsing\n\nWith FAs we began by\
    \ discussing deterministic machines because they were simple and realistic. Moreover\
    \ it turned out that NFAs were no more powerful than DFAs in terms of the class\
    \ of languages recognized. In contrast, for PDAs we began with the nondeterministic\
    \ ones principally because they are more powerful, and we need power to recognize\
    \ all context-free languages. We will show that there are context-free languages\
    \ that cannot be recognized by any deterministic PDA. The proof is deferred until\
    \ the Section 11.8.\n\n# Definition 11.3\n\nDeterministic Pushdown Automata (DPDA)\n\
    A DPDA is a sextuple (6-tuple), $M = (Q, \\Sigma, \\Gamma, q_0, S, \\delta)$,\
    \ where the parts are the same as in Definition 11.1 except that the $\\delta$\
    \ function does not provide any choices.\n\n$\\delta: Q \times \\Sigma \times\
    \ \\Gamma \rightarrow Q \times \\Gamma^*$,\n\nso that the codomain of $\\delta$\
    \ is ordered pairs, not sets of ordered pairs.\n\nThe challenge now is to parse\
    \ deterministically. The approach for parsing with NPDAs was to simulate a leftmost\
    \ derivation for the grammar. When there was a choice, because the grammar allowed\
    \ more than one production to be invoked, the NPDA sidestepped the issue by nondeterministically\
    \ choosing between those possibilities. DPAs confront when they try to deterministically\
    \ simulate a derivation process that is inherently nondeterministic. A DPDA has\
    \ to get the right answer every time. Two aspects to the solving this problem.\n\
    \nFirst a context-free language might be generated by many different CFGs and\
    \ some are easier to work with than others. To get the choices deterministically\
    \ correct we have DPAs use input symbols as a guide. The resulting look-ahead\
    \ pays attention to the next symbol in the current input and let influence the\
    \ choice of which right-hand side to use, when more than one is available. When\
    \ the grammar is in a form, Greibach normal form, this is simpler for the PDA\
    \ trying to guess the next production of the derivation. This is because the next\
    \ input symbol"
