  md: 'Proof: We will show that $\mathcal{W}$ is uncountable by contradiction. We
    assume $\Sigma$ is the binary alphabet; other alphabets are analogous. Assume
    $\mathcal{W}$ is countably infinite set, so that its elements can be put in one-to-one
    correspondence with $\mathcal{N}$. This is equivalent to saying that we can make
    a numbered list of all the elements of $\mathcal{W}$. Once the correspondence
    is chosen we can unambiguously talk about the $ith$ element of $\mathcal{W}$.
    By hypothesis this list contains every possible binary $\omega$-string, but we
    will show that there must be an $\omega$-string that cannot be on the list. Define
    the $\omega$-string $v$ as follows: the $ith$ bit of $v$ is 0 if the $ith$ bit
    of the $ith$ string in $\mathcal{W}$ is 1, and vice versa. (We are using a 0-based
    indexing.) An illustration of this construction is


    ```

    $\nu = 1 1 0 1 ...$

    \n0th 0 1 1 0 0 1 ...$

    1st 0 0 1 0 1 1 ...$

    2nd 1 1 1 1 0 1 ...

    3rd 1 0 1 0 0 1 ...

    :

    ```


    The key observation is that $v$ is an $\omega$-string and hence should be on the
    list of all $\omega$-strings. On the other hand, for any $v$ the construction
    $v$ from being the $ith$ string on the list, since it differs from that string
    in the $ith$ bit. Hence a contradiction. $\square$


    This proof is an example of the technique called diagonalization and is well-known
    in the history of set theory. We will use it again soon. (It is worth noting that
    the above argument is almost identical to the proof that the number of real numbers
    between 0 and 1 is uncountably large. To see the relationship, note that any such
    real can be represented in binary notation as a $\omega$-string preceded by a
    "binary point". There are some additional technical details since some reals have
    more than one representation.)'
