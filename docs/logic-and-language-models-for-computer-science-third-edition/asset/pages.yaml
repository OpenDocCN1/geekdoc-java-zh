    # Example A.7


    Can I ask who is a grandparent, without asking for a grandchild?


    Yes, you can. Prolog has anonymous variables, whose value is not reported. Anonymous
    variables have names that begin with the underscore character, "-", and need not
    have any characters. Thus the query grandparent(P,_) asks if any object P is a
    grandparent of any object "-" reports the value of P. Since grandparent (like
    mother) is a predicate for which no facts have been asserted, Prolog invokes the
    grandparent rule in order to get started. Ultimately it finds the correct answer,
    but prints a value for the named variable, not the anonymous one. In English,
    this reads,"Who is a grandparent?"


    ```

    |?- grandparent(P,_)

    P = ann

    yes

    ```


    We have now seen that the Prolog processor responds to queries in the form of
    predicates with three different kinds of arguments: constants like "mary," ordinary
