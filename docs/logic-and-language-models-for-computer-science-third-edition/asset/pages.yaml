  md: 'input string x is found next to the start of the tape, beginning in the second
    cell. The first cell is “blank.” The blank symbol, denoted Δ, is the distinguished
    element of the tape alphabet. Infinitely many cells beyond the input string are
    also blank (contain Δ) at the outset. The Δ symbol is not part of the input alphabet.
    Because As surround, the input string begins and ends. The TM can detect the empty
    string, in which case the second cell is a blank. Initially the tape head is at
    the first cell. The machine makes a sequence of transitions.


    Since the input is already loaded into memory TMs have a different mechanism for
    accepting a string that FAS and PDAs. When a TM has decided to accept or reject
    an input it halts and announces its answer. It halts by making a transition to
    one of two states, the halt states, $q_a$ and $q_r$. If the machine halts in state
    $q_a$ it accepts the input, if it halts in state $q_r$ it rejects the input. Unfortunately
    a TM may never reach a halt state, going into an infinite loop.


    Like FAS, TMs have transitions that depend on a state and a symbol. Here the symbol
    is the one in the tape cell that the tape head is currently positioned at. Based
    on these values the TM decides three things:


    +   1. what state to be in next (possibly unchanged; possibly a halt state)

    2. what symbol to write in the current tape cell (possibly the same symbol), and

    3. where to go (move one cell left or right)


    We express TMs with transition diagrams that are similar to those for FAS and
    PDAs, with information corresponding to what happens during a transition. Suppose
    there is a transition from state $p$ to state $q$ (which may be the same, in the
    case of a self-loop), with the label “X/$Y, \mu$”, where $X$ and $Y$ are tape
    symbols and $\mu$ (“mu”) is the move, which can be $L = $ left, or $R = $ right.
    This transition can be used when the machine is in state $p$ and the current tape
    cell contains the symbol $X$. As a result the machine enters state $q$, and after
    overwriting the $\overline{X}$ with $Y$, it makes the move that $\mu$ specifies.
    Since a transition to $q_r$ is functionally equivalent to a transition to a trap
    state, we adopt the same convention as we used with FAS: transitions missing from
    a diagram are considered to be transitions to $q_r$


    # Definition 12.1'
