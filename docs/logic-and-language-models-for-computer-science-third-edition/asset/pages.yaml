  md: '# 11.10 Notes on Memory


    The stack provides memory, but it is not the only kind of memory we have seen.
    Recall that an FA has memory too: “remembers” of which its states it is in. Although
    many FA examples use only a few states, real devices — even relatively simple
    ones have huge numbers of states. A 16-bit register, for example, has $2^{16}
    = 65536$ states, while for a single 32-bit register there are over 4 billion states.
    Strictly speaking, a modern computer with large but fixed memory could be regarded
    as an FA with an astronomical number of states. Given that it is easy to have
    an incredibly large number of states in a real FA, what is the point of introducing
    the extra memory that the stack provides?


    One answer is that PDA memory is not finite, but infinite. In the world of mathematics,
    the difference between finite and infinite is clear and crucial. We have seen
    that an unlimited supply of memory is important, since we have proved that without
    it, FA cannot recognize important context-free languages. But what about in the
    world of real computers? As a practical matter, computers of modest size by current
    standards can — despite their finiteness — carry out the recognition of long strings
    from useful CFGs. Do not let the large size of real machines blind you to the
    conceptual significance of the distinction between the finite and the infinite.
    Of course, as in this chapter, we never use an infinite amount of memory; instead
    we require an unbounded amount of memory. Alternatively, we insist that all requests
    for memory will be filled, which can not be true if we start with some finite
    amount of memory.


    Further, while the PDA has extra memory beyond that of FAs, it is constrained
    to behave like a stack. Such last-in-first-out storage allows the automaton to
    consult only the most recently added symbol (but not the ones below it on the
    stack). With such a constraint on how it can access its memory, we should not
    be too surprised to find that there are automata more powerful than PDAs. That
    turns out to be true, as we will see in the next chapter on Turing Machines.'
