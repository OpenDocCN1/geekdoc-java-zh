  md: 'The key reasons for our interest in the language B is not just that it is non-regular.
    The language serves as a model of how parentheses, and delimiters in general,
    behave. Recall that models simplify yet retain essential features. In this case,
    the simplification is to remove all other material, while the essential feature
    that is retained is described in line 3 of Definition 10.4 and echoed in the third
    production of G_3 in Example 10.3: parentheses surround expressions. There are
    theoretical characterizations of CFLs, that are beyond the scope of this book,
    that point out that the nested balance of parentheses, is found in all non-regular
    CFLs.


    # Definition 10.5


    Context-free languages


    The class of context-free languages contains exactly those languages for which
    a context-free grammar exists generates it.


    The CFGs are more powerful than the various models of regular languages, in the
    sense that the CFGs can represent all of the regular languages and also some non-regular
    languages. We have demonstrated the second part by example. The first part is
    easily proved.


    Theorem 10.1 – Every regular language is a context-free language.


    Proof: This follows immediately since every regular language is generated by a
    regular grammar and every regular grammar, by definition, is a context-free grammar.'
