  md: 'Recall that a derivation is leftmost if at every step the variable that is
    replaced by a production is the leftmost variable in the string derived up to
    that point.


    # Definition 10.8


    Ambiguity

    An ambiguous string with respect to a CFG is one that the grammar can generate
    with at least two different derivation trees. An ambiguous grammar is one that
    generates at least one ambiguous string.


    # Example 10.7


    Draw derivation trees that shows the ambiguity G₅.

    See Figure 10.3. Repeated use of the production E → E + E occurs in each, and
    further repetition would yield larger trees and longer strings, as needed, without
    limit. Since there are two trees for the string a + b + c, that string is ambiguous
    and so is the grammar, G₅, that generated them.(Recall that associative operators
    should associate left-to-right.)


