- img_proc: true
  md: '# 6.1 The Idea of Verification


    When the program compiles successfully, the compiler has, in effect, certified
    that the program is syntactically correct. But this means only that it consists
    of permitted symbols in recognized categories that have been strung together in
    ways that the programming language allows. As an example for English “Fast trees”
    is syntactically correct in that an adjective, “fast,” precedes with a noun, “trees,”
    to make a plural subject for the verb “see.” However, this is a very weak notion
    of correctness, having nothing to do with whether the sentence means anything.
    Since trees have neither speed nor sight, the words do not combine in a meaningful
    way. The sentence is semantically unacceptable.


    Semantics is the formal study of meaning. The idea is to introduce notation for
    the semantics of each kind of programming statement and to have these combine
    the semantics of whole programs. We will take the semantics of a programming statement
    to be its effect on the values of variables and on the properties of those values,
    such as being an odd integer, a positive real or less than another number. We
    will use new inference rules to describe these effects. These rules are language
    dependent, that be different from those for Perl. However, the rules introduced
    here are for central concepts, shared by many programming languages.


    Our intent is to prove, for a given program, that it accomplishes its goal. We
    begin by specifying that goal — what the program is supposed to compute — in the
    form of a logical assertion. We also describe in logic the initial state of the
    program. The process of program verification then consists of repeatedly applying
    our new inference rules (for the statement types in our programming language)
    to successive statements in the program until, finally, the inference rule for
    the last statement allows us to infer the logical assertion which was originally
    given as the goal of the program. In other words we are proving a theorem of the
    form “executing the code S when p is known to be true will result in q being true"


    This process has actually been automated and used to verify the correctness of
    relatively small programs, but we are far from achieving that for large real-life
    programs. The last section of this chapter is a consideration of some of the difficulties
    in program verification. But now'
