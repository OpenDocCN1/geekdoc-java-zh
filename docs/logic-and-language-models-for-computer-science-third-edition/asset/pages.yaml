  md: '# 2.5 Two Important Operators


    We now have a new way to prove things besides truth tables: algebraic substitution,
    that is, the replacement of an expression by another one that has been shown to
    be equivalent to it. A third approach to proving things — besides truth tables
    and replacing them by their equivalents — is to make rules of inference. This
    technique, which is the topic of Section 3.2, involves an especially important
    operator that we now introduce. give it a strange name, $\Delta$, so we can talk
    about it without prejudging what the expression $p \Delta q$ might mean. The new
    operator has the following truth table:


    | | T | F |

    |---|---|---|

    | p | T | F |

    | q | T | |


    What does this truth table tell us? First, notice that it has only three T''s.
    Therefore to assert $p \Delta q$ is a weak claim, that it narrows the possible
    states from four to three. By contrast, asserting $p \wedge q$ is a strong claim
    that narrows the possible states to just one, thereby telling us what $p$ must
    be (TRUE) and also what $q$ must be (TRUE).


    Suppose you were somehow assured that proposition $p \Delta q$ was TRUE. Then,
    consulting the truth table would tell you that you were in one of the three states
    other than the upper right. That is, you could conclude the state $p =$ TRUE and
    $q = $ FALSE was not the current state. Now suppose you also learned that $p =
    $ TRUE. What can the truth of $p$ tell you in the presence of the truth of $p
    \Delta q$? whenever $p = $ TRUE, we are in the top half of the truth table, but
    whenever $p \Delta q = $ TRUE, we are not in the upper right. That leaves the
    upper left, where both $p$ and $q$ are true. We conclude that both $p$ and $q$
    are true.


    To summarize, $p \Delta q =$ TRUE lets us use the information that $p =$ TRUE
    to establish that, in addition, $p = $ TRUE. In other words, it tells us that
    (the truth of) $p$ leads to (the truth of) $q$. So we will henceforth pronounce
    $\Delta$ as “leads to” or “implies” and write it as $\to$. This arrow shows the
    direction of our reasoning. The operator it represents, is called either the'
