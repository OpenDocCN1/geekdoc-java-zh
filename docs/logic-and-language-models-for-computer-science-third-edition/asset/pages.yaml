    \ and $q \\in Q$ do\n    $(p^{k \\pm 1} q) \\iff ((p^k = q) \\wedge (forall a\
    \ \\in \\Sigma^* : \\delta(p,a) \\doteq \\delta(q,a)))\n  $k \\leftarrow k+1$\n\
    until $\\Pi_k = \\Pi_{k-1}$\n```\n\nWhen the algorithm halts $M' = (Q', \\Sigma',\
    \ q'_0, \\delta', A')$ as follows. Let $[q]$ be the block that $q$ ended up in.\
    \ $Q' = \\{[q] | q \\in Q\\}$, so each state of $M'$ is a block produced from\
    \ $M$. Let $q'_0 = [q_0]$ and $A' = \\{[q] | q \\in A\\}$. Finally, $\\delta'([q])\
    \ = \\delta(q, a)$ for all $q$ and $a$. We leave it as exercise to prove $\\mathcal{L}(M)\
    \ = \\mathcal{L}(M')$.\n\nIt follows that $M'$ has the minimum number, $m$, of\
    \ states for any DFA that accepts $L = \\mathcal{L}(M)$. To see this, find one\
    \ string that reaches each state of $M'$ and construct the set $S$ of these $m$\
    \ strings. Suppose two strings $x$ and $y$ in this $S$ are indistinguishable with\
    \ respect to $L$, they must be indistinguishable with respect to $M$. But they\
    \ are distinguishable by a string $z$ at some point the algorithm puts $\\delta^*(q_0,\
    \ y)$ and $\\delta^*(q_0, x)$ into separate blocks. Therefore Myhill-Nerode theorem\
    \ implies that $M$ states are also required.\n\nThis algorithm can be presented\
    \ in many ways using a variety of notations. Some presentations emphasize how\
    \ to translate it into code. We only mention that the partitions can be represented\
    \ by $m \\times m$ matrices."
