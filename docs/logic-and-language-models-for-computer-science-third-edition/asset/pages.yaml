  md: '# 9.6 Properties of Regular Languages


    Recall that at this point a language is known to be regular it follows that it
    can be generated by a RE, a regular grammar and a deterministic regular grammar,
    and it can be recognized by a DFA and NFA. Further we have algorithmic techniques
    to translate from one format to any other. In this section we will use these representations
    to explore closure properties of the class of regular grammars.


    An language operator is said to be closed for a language class if applying it
    to languages in that class produces a language in the same class. For example,
    we take any regular languages $L_1$ and $L_2$ their intersection $L_1 \cap L_2$
    is also a regular language, as shown below. Example 9.12 indicates the potential
    applicability of the closure properties.


    # Example 9.12


    We want to design FA for the following language over $\Sigma = \{a, b\}$:


    ```

    L = \{x \| x \text{ is an a followed by zero or more bs } \wedge x \text{ is a
    b preceded by zero or more as}\}

    ```


    It is easy to see that $L = L_1 \cap L_2$ where


    ```

    $L_1 = \{x \| x \text{ is an a followed by zero or more bs}\}$

    ```


    ```

    $L_2 = \{x \| x \text{ is a b preceded by zero or more as}\}$

    ```


    Perhaps if we can design FAs for $L_1$ and $L_2$ we can use those to design one
    for $L$.


