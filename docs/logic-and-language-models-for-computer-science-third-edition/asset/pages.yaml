  md: '# Chapter 6


    # Program Verification


    Often we write computer programs that we believe to be correct. Still, it would
    be desirable, especially for important programs, to know that they are correct,
    by proving it. But how would you prove a program correct? This question defines
    the challenge of program verification, a subfield of software engineering. This
    chapter lays out a predicate logic approach to verification, incorporating special
    new rules of inference to express our background knowledge of computer programming.
    The material can thus sharpen your predicate logic skill while demonstrating their
    relevance.'
  merge: -1
