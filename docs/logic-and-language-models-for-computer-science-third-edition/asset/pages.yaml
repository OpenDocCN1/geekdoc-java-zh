  md: '# ## 10.6 Beyond Context-Free Languages


    Canonical examples of context-free languages, such as the set of strings of balanced
    parentheses, exhibit two-way balance — a later symbol (or symbols) being paired
    up with an earlier symbol (or symbols). However, if the notion of structure in
    the language is more complex than two-way balance we might find that context-free
    grammars are not powerful enough.


    Consider the language $L$ which has three-way balance:


    ```

    $L = \{a^n b^n c^n \mid n > 0\}$

    ```


    To appreciate why there is no context-free grammar for $L$, you might pause and
    try to devise one. We know that a language (which is $\Lambda$-free) is context-free
    iff there exists a CFG for it in Chomsky normal form (CNF). We begin by establishing
    simple properties of CFGs.


    **Lemma 10.5** – For any infinite context-free language $L$, if a CFG G in CNF
    generates $L$, there is no bound on the height of the derivation trees required
    of G by strings of $L$.


    **Proof:** Note that derivation trees for CNF are binary trees, with single edges
    reaching the leaves. Consequently, a derivation tree of height $h$ can generate
    a string of length at most $2^{h-1}$. Therefore $L$, being an infinite language,
    has strings longer than any bounded size can accommodate.


    **Lemma 10.6** – For any infinite context-free language $L$, if G is a CFG in
    CNF that generates $L$ then some derivation tree that G has a path from the root
    to a leaf with two occurrences of the same nonterminal symbol.


    **Proof:** Since $L$ is an infinite language, by Lemma 10.5, there are derivation
    trees of unbounded height corresponding to $G$. In particular, we must have derivation
    trees for some strings in $L$ that have heights exceeding $n=|V|$, the number
    of nonterminals in $G$. By the pigeonhole principle tree must have the same nonterminal
    appearing twice. (The left side of Figure 10.8 depicts the situation, with a path
    running down from S through two occurrences of A.)'
