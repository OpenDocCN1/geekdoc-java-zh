  md: "# 3.8 Soundness and Completeness\n\nOur presentation in these two chapters\
    \ has tried to emphasize the utility of propositional logic. We did this by talking\
    \ about two threads at the same time, which we will now tease apart.\n\nInitially\
    \ there is the idea that a proposition is primarily defined lexically. We began\
    \ by defining it as a Boolean expression which is nothing more than a string of\
    \ symbols (or equivalently as an expression tree). We also said that propositions\
    \ are truth-valued statements. But how do you assign such values to a string?\
    \ In each chapter we gave a different answer.\n\nFirst we gave a semantic interpretation\
    \ to the string, stating that the symbols mean. Formally this is called a semantic\
    \ model. The model was in terms of constants, variables and operators. This allowed\
    \ us to evaluate expressions given information about the variables, their state.\
    \ In a more formal presentation we would use this notation (called semantic entailment):\n\
    \n$\\alpha \\models \\beta$\n\nto indicate that for every state when $\\alpha$\
    \ evaluates to TRUE it is also the case that $\beta$ evaluates to TRUE; when is\
    \ actually the case we say “$\\alpha \\models \\beta$ holds.” (For example $q\
    \ \\models p \\rightarrow q$ holds.) We are primarily interested in those propositions\
    \ $y$ such that $\\models y$ holds. This is defined to indicate that $y$ is a\
    \ tautology, since it is always true, not just when some $\\alpha$ is true. Note\
    \ that $\\alpha \\models \\beta$ holds if and only if $\\models(\\alpha \\rightarrow\
    \ \\beta)$ holds.\n\nSecond we gave a mechanical interpretation to the string\
    \ by saying it is a theorem if by following a series of steps it can be proven.\
    \ Recall that we used this notation $\\alpha \\vdash \\beta$ to indicate that\
    \ $\beta$ can be proven given $\\alpha$; we say “$\\alpha \\vdash \\beta$ is valid”\
    \ when such a proof exists. A *theorem* $a$ is formally defined as a proposition\
    \ for $\\vdash a$ is valid. Also we argued that $\\alpha \\vdash \\beta$ is valid\
    \ if and only if $\\alpha \\vdash \\rightarrow \\beta$ is valid.\n\nThe grand\
    \ *unifying observation* for these two interpretations of propositions is:\n\n\
    **Theorem 3.1** $\\alpha$ is valid if and only if $\\models \\alpha$ holds, for\
    \ every proposition $\\alpha$."
