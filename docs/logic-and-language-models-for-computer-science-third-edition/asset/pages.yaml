    # Example 5.2


    Prove that every perfect square is either a multiple of 3 or one greater than
    a multiple of 3.


    This proof is informal, but we will point out its use of some formal rules of
    inference, specifically case analysis and V introduction. The basic idea of the
    proof is when examining numbers in the context of multiples of 3, each integer
    falls into one of three categories, depending on its value modulo 3. That is,
    for every n, one of the following holds:


    ```

    n = 3m, for some m, or

    n = 3m + 1, for some m, or

    n = 3m + 2, for some m.,

    ```


    The disjunctive form of this statement (its use of "or") suggests a proof by case
    analysis, with three cases; see Exercise 3.10. To complete the proof, we show
    that each case leads to the result. A perfect square is the square of an integer
    n, the square, n^2, is one of these:


    ```

    n^2 = (3m)^2 = 3(3m^2) or

    n^2 = (3m + 1)^2 = 3(3m^2 + 2m) + 1 or

    n^2 = (3m + 2)^2 = 3(3m^2 + 4m + 1) + 1.

    ```


