  md: '# 5.2 Proof Strategies with Predicates


    The foregoing rules of inference, like the ones for propositions, allow us to
    prove many important results. Here are a few common types of theorems and proof
    strategies for each.


    +   Theorems of the form “$\exists x\in \mathcal{U} : p(x)$"


    Theorems like this can be proven using $\exists$ introduction simply by exhibiting
    a specific $x\in \mathcal{U}$ and showing that it is the case that $p(x)$ is true.
    (It is a common mistake to use this proof technique when a universal quantification
    is to be proved; in that case “proof by example” is inadequate and is not a proof.)
    Sometimes, rather than explicitly showing such an $x$, we can give a technique
    for finding such an $x$ (and argue the technique cannot fail); this is called
    an algorithmic proof.


    +   Theorems of the form “$\forall x\in \mathcal{U} : p(x)$"


    This kind of theorem clearly requires $\forall$ introduction. As noted above,
    though, the theorem really says that $(\mathcal{U} \to p(x))$ is a true proposition.
    So the proof, using the introduction rule, assumes $x\in \mathcal{U}$ and shows
