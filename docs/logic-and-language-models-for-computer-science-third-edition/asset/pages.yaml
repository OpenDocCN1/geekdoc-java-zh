    \ subset with $|S'|=m+1$. Obviously the strings in $S'$ are pairwise distinguishable.\
    \ But Theorem 9.9 guarantees that $M$ does not have enough states to do the job.\n\
    \nA simple example of an aspect of computer languages that is beyond the representational\
    \ capacity of parentheses, as used in algebra, logical expressions and programming\
    \ languages. We get a simple *model* of parentheses by taking the language formed\
    \ by ignoring these in expressions. Then for the expression $\\log(a+c)(d+e)$,\
    \ we are left with the string “(( ) ))”. The alphabet for this language is $\\\
    {(, )\\}$. Another string of balanced parentheses is “(( ) ( ))”. We define balanced\
    \ parentheses more precisely in Chapter 10. However the following example simplifies\
    \ this motivation further and substitutes $a$ for “” and $b$ for “”.\n\n# Example\
    \ 9.13\n\nWe show $L = \\{a^nb^n \\mid n \\leq n\\}$ is not regular. Strings in\
