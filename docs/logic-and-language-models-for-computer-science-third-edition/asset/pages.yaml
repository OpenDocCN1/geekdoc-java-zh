  md: "useless. Clearly derivation of a string of terminals will ever include any\
    \ useless variables.\n\n**Lemma 10.1** – For any CFG $G$ there exists a CFG $G'$\
    \ such that $G'$ contains no useless variables and $\\mathcal{L}(G) = \\mathcal{L}(G')$.\n\
    \n**Proof:** First it is trivial that such a $G'$ exists. Since no useless variable\
    \ can be used in derivation of any $x \\in \\mathcal{L}(G)$ we can construct $G'$\
    \ by simply removing every useless production from $G$. We will go a little further\
    \ and explain how to distinguish the useless variables in practice.\n\nWe give\
    \ an algorithm to compute $\\mathcal{A}$, the set of useful variables, which is\
    \ enough to compute $\\mathcal{A}$. Algorithm 10.1 computes $\\mathcal{A}$ using\
    \ this function:\n\n```\n$useful(A) = \\{A \\rightarrow \\alpha \\mid \\text{every\
    \ variable in } \\alpha \\text{ is in } \\mathcal{A}\\}$\n```\n\nThe correctness\
    \ of the algorithm is strong induction on the length needed to justify the inclusion\
    \ of a variable in $\\mathcal{A}$. The initialization provides the basis of the\
    \ proof; one-step derivations. If an $A$ needs $k$ steps then for some $A \\rightarrow\
    \ \\alpha$ every variable in $\\alpha$ requires $k-1$ or fewer steps.\n\n# Definition\
    \ 10.12\n\n# Erasable variables\n\nA variable $A \\in V$ is *erasable* if $A \\\
    xrightarrow{\\Rightarrow} \\mathcal{A}$.\n\n# Algorithm 10.1\n\n**Computing the\
    \ set of useful variables in a CFG**\nInput: A context-free grammar $G \\in (V,\
    \ \\Sigma, S, P)$ \nOutput: The set of useful variables $\\mathcal{A}$\n\n```\n\
    $\\mathcal{A} \\triangleq \\{A \\mid A \\rightarrow a \\in P\\}\\nwhile $A \\\
    notin \\mathcal{A} \\wedge$ $|useful(A)| > 0$ do\\n\\quad$add $A$ to $\\mathcal{A}$\\\
    nreturn $\\mathcal{A}$\n```"
