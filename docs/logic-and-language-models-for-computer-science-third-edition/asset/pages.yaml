    ```

    p\wedge (q\V r) \equiv (p\wedge q) \V (p\wedge r)

    ```


    There is another important kind of result, besides equivalences, that truth tables
    can prove. A Tautology is a proposition that is equivalent to TRUE. (In other
    contexts such a proposition is said to be valid.) In other words, it has the value
    TRUE regardless of the state of its variables, so in the truth table there will
    be a column for that that is all TRUEs. Find that column in each of the following
    truth tables. The first involves a single variable and proves that p \V not p
    is a tautology. A tautology involving two variables is (p \wedge q) \neg p \neg
    q, as is proved in the second truth table.'
