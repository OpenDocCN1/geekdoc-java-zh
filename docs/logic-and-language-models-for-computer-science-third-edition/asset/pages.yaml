    # Definition 10.3


    # Conventions


    +   1. A capital roman letter will denote a variable from V.

    2. A lower-case roman letter from the beginning of the alphabet will denote a
    terminal from $\Sigma$.

    3. A lower-case roman letter from the end of the alphabet will denote a terminal
    from $\Sigma^*$.

    4. A lower-case Greek letter will denote a string from $(V \cup \Sigma)^*$.


    Combined with the convention of using $S$ as a start symbol allow us to specify
    a CFG by only presenting $P$, the set of productions. These are the same conventions
    as earlier, but we state them here for ease of reference.


    # Example 10.2


    What language is generated by the following grammar?


    $G_2 = \{{S\}, \{(,\)}\}, S, S \to (S), S \to \Lambda$


    It is important to note that "“ and ''”" are just ordinary terminal symbols. Since
    this grammar is just $G_1$ except for replacing $a$ and $b$ by left and right
    parentheses, the same is true of the resulting language: $\mathcal{L}(G_2)$, is
    the language $L_2 = \{(^)^n \mid n \geq 0\}$


    Next we will look for a CFG for all strings of balanced parentheses, not just
    those of $L_2$. Recall that we discussed this language in Section 9.7'
