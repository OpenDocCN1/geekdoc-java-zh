  md: '# 10.4 Chomsky Normal Form


    In a CFG any production $\rightarrow \alpha$, where $\alpha \in (V \cup \Sigma)^*$,
    is allowed. However we can put severe restrictions on $\alpha$ without limiting
    the expressive power of CFGs. Such restrictions force the grammar into "normal
    forms." We will see one in this section and another later.


    # Definition 10.9


    Chomsky normal form

    A CFG in which every production is of the form $A \rightarrow BC$ or $A \rightarrow
    a$ is in Chomsky normal form (CNF), where $A, B, C \in V$ and $a \in \Sigma$.In
    particular A $A \rightarrow \Lambda$ is not allowed.


    # Definition 10.10


    $\Lambda$-free language

    A language does not happen to contain $\Lambda$ is said to be $\Lambda$-free.


    If a language $L$ is generated by a grammar in Chomsky normal form then clearly
    $L$ is $\Lambda$-free. This is because every derivation starts with one symbol
    (the start symbol) and no production will ever reduce the number of symbols derived;
    we cannot derive zero symbols.


    This theorem shows that constraining ourselves to CNF does not restrict what we
    can express.


    > **Theorem 10.2** – For any $\Lambda$-free context-free language $L$ there exists
    a $CFG G$ in Chomsky normal form, where $L = \mathcal{L}(G)$.


    Before proving this we state various lemmas that allow us to "clean up" our grammars.


    # Definition 10.11


    Useless variables

    A variable $A \in V$ is $useful$ if $A \xrightarrow{\text{*}} x$, for some $x
    \in \Sigma^*$; otherwise the variable is $useless$. A production is $useless$
    if any of its variables are'
