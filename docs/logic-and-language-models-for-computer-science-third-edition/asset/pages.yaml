  md: '# 6.5 Proofs with Procedures


    We will consider how to prove the correctness of code that calls procedures (or
    any similar mechanism for encapsulating code). A fuller treatment, that included
    function calls, is beyond the scope of this short introduction. The technique
    is general, even though our example happens to be recursive.


    Every procedure will have a precondition that states what is true when code commences;
    in particular, what is known about it parameters. postcondition states what is
    true when code terminates; again what is true of it returning parameters. (Our
    examples will not access global variables, or have any other kind of side-effects,
    which simplifies the technique.) We need to prove that the postcondition does
    indeed follow from the precondition and the execution of the body of the procedure.


    Further, whenever this procedure is invoked we must show that the precondition
    does hold for the parameters at the time of the call. If so we will be able to
    assert the postcondition holds for the parameters immediately after returning
    from the procedure. The beauty of this is that we do the exact same thing when
    the invocation is within the procedure, that is when it is recursive.


    # Example 6.10


    Consider a procedure for computing binomial coefficients $C(m, n) = \binom{m}{n}$
    $0 \le n \le m$, using the standard recursive definition: $C(m, n) = 1$ if $n=0$
    or $m=m$, and $C(m, n) = C(m-1, n) + C(m-1, n-1)$ otherwise. The procedure $Binom(m,
    n, b)$ has the pre-condition $0 \le n \le m$ and has the post-condition $b = C(m,
    n)$.


    The code is annotated with assertions and these are justified using the If-Then-Else
    rule.'
