  md: "# 12.6 Undecidability\n\nIn this chapter we have been concerned with question\
    \ of testing whether we can find a machine that will recognize a given language.\
    \ This is an example of a decision problem. Informally a decision problem is a\
    \ problem for which we need to compute “yes/no” answers. This decision problem\
    \ has been discussed at length:\n\n+   - Is string $x$ in language $L$?\n\nHowever\
    \ we could add many others to such a list:\n\n+   - Does a given string contain\
    \ an even number of symbols?\n- Is a given number prime?\n- Does TM $M$ halt on\
    \ input $x$?\n- For a given context-free grammar $G$, is $\\mathcal{L}(G)$ regular?\n\
    \nThey seem different in character, but it is important to realize that these,\
    \ and all other decision problems, are special cases of the first example “Is\
    \ string $x$ in language $L$?”\n\nWe need to recast each decision problem as a\
    \ language recognition problem. For each problem we specify how instances of the\
    \ problem can be regarded as strings and then define the set of strings which\
    \ correspond to instances for which the answer is “yes.” This set of strings is\
    \ a language and testing membership in that language is tantamount to answering\
    \ the decision problem. For example, the examples above can be recast as:\n\n\
    +   - $L_1 = \\{x \\mid x \text{ is of even length}\\}$\n- $L_2 = \\{bin(i) \\\
    mid i \text{ is prime}\\}$\n- $L_3 = \\{\\langle M x \rangle \\mid \\langle M\
    \ \rangle \text{ is an encoding of a TM } M \text{ and halts on } x\\}$\n- $L_4\
    \ = \\{\\langle G \rangle \\mid \\langle G \rangle \text{ is an encoding of a\
    \ CFG } G \text{ and } \\mathcal{L}(\\langle G \rangle) \text{ is regular}\\}$\n\
    \nwhere $\\langle G \rangle$ is some encoding of the grammar $G$ into a (binary)\
    \ string; by analogy with $\\langle M \rangle$, we can concatenate together encodings\
    \ of each of the productions of $G$."
