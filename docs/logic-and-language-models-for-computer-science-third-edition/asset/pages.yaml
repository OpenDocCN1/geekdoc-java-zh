  md: '# Chapter 2


    # Propositional Logic


    Logic is a useful framework for models of knowledge. Logical models simplify the
    world in order to focus on key ideas. The focus in propositional logic is on statements
    that are simply *true* or *false* and on the ways in which such statements can
    be combined and manipulated. Requiring statements to be true or false means that
    we never say something is likely or unlikely: there is never a 70% chance of rain
    in propositional logic. Nor do we ever say that a statement is close to the truth
    or far from it, and the statements themselves are never vague or approximate.
    These restrictions allow us to focus on essential ideas about precise reasoning
    and, in Chapter 3, to uncover a remarkable array of useful ways to prove important
    results.'
