    Nondeterministic finite automata (NFAs) share several aspects and properties of
    the DFAs formally defined in Section 9.3. Despite substantial similarity in the
    definitions, NFAs differ from DFAs in one crucial way: they can have more than
    one transition for a single symbol out of a state. By contrast, in a DFA, the
    transitions leaving a state must all be labeled with different symbols. Thus the
    diagram below must be for an NFA, since it has two transitions labeled a leaving
    the start state. We may now wonder what this automaton goes when the input begins
    with a. We will come back to that question, but for the moment, just remember
    (from Section 8.2) that nondeterministic processes do not directly model real-life
    processes.


    ![](img/e49d977e0cc4db78b7174ba16fc32998_237_0.png)


    This NFA is a natural, straightforward representation of the language L = {ab,
    ac}. However this automaton presents the dilemma by having two transitions with
    the same label departing from some state. To have a chance of acceptance by this
    machine, of course, a string must begin with a. After the processing of the a,
    there, momentarily, two possible current states. The next symbol then forms a
    resolution between them, assuming that it is b or c. Of course the string aa is
    rejected. The crucial idea here is that we introduced a choice of transitions.


    We need to introduce formal definitions to state clearly how an NFA works. The
    only difference between the two kinds of automata involves the transition function,
    δ. For DFAs, the (output) value of δ was an element of the set Q, that is, it
    to be exactly one state. For NFAs, however, the value of δ can be any subset of
    the states. For a particular state and input symbol, the number of possible next
    states may be zero, one, or more.


    To be more precise about this difference between DFAs and NFAs, we can say that
    the difference concerns the codomain of δ. The codomain of any function is the
    set from which its outputs are chosen. Thus for DFAs we'
