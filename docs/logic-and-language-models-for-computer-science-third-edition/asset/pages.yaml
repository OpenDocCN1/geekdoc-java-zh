  md: '# Chapter 11


    # Pushdown Automata and Parsing


    In earlier chapters you learned about an important class of languages — the regular
    languages — and about a class of automata, the finite automata, that can recognize
    all of those languages and no others. You might therefore wonder whether there
    is some category of automata that is precisely suited to recognize the broader
    class of languages introduced in Chapter 10, those that can be generated by context-free
    grammars (CFGs). There is indeed a type of automaton for this task, the nondeterministic
    pushdown automaton (NPDA). NPDAs, along with their cousins the deterministic PDAs
    (DPAs), are the topic of this chapter. We will write “PDA” when determinism or
    its absence is not the focus of discussion.


    NPDAs are of interest for computer science mainly because of their relationship
    to CFGs: for every CFG, G, there is an NPDA that recognizes L(G). In the course
    of demonstrating a simple way to find such an NPDA, we will see where the nondeterminism
    comes from. We will find that nondeterminism is not only convenient but necessary.
    That is, for some CFGs and their languages, there is no DPDA that recognizes them.
    It follows that the class of NPDAs is larger than the class of DPAs, which are
    equivalent with respect to the class of languages they accept.


    We already know — from several suggestive examples in Chapter 10 — that CFGs play
    a key role in specifying programming languages. If G is a CFG specifying the grammar
    of some programming language, then L(G) is programming language, from the formal
    language viewpoint. In other words, each correct computer program in language
    is a string in L(G), typically a very long one. Now, that is not the whole story,
    since the strings of a programming language have meanings. However, it also turns
    out — as you will see in detail if you take a compiler course — that grammars
    can also provide a structural basis for meanings in programming languages; recall
    Section 10.3.'
