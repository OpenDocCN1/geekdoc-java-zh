  md: '# 6.3 Inference Rules


    The simplest inference rules are for the elementary statements, like the assignment
    statement. We will use “←” as the assignment operator, rather than the “=” of
    C and C++, to emphasize that our reasoning is language-independent. With this
    notation, the general form of an assignment statement is v ⇐ e, where v is a variable
    and e is an expression like 3 or x+1 or 2*(theta). The assignment statement has
    the following semantics (meaning): Evaluate e and assign the resulting value to
    v. The rule of inference for assignment statements is that the following Hoare
    triple is a tautology:


    Assignment: p{v ⇐ e} p(v)


    The idea here is that if the value v satisfies some predicate p before the statement
    is executed, then the value of v will satisfy that same predicate afterwards.
    Of course, this assumes that all variables other than v will retain their values,
    i.e., our pseudocode does not allow “side-effects.”


    # Example 6.1


    Let p be the predicate ODD, which is true when its argument is odd, permits the
    following Hoare triples:


    ```

    ODD(3){y ⇐ 3} ODD(y)

    ODD(y){x ⇐ y + 2} ODD(x)

    ODD(x){x ⇐ x + 1} EVEN(x)

    ```


    In the first triple, the precondition, ODD(3), is true from arithmetic and does
    not really need to be written. Arithmetic steps are often omitted for correctness
    proofs. Thus the second triple uses the fact that the sum of 2 and an odd number
    is odd (i.e., y + 2 is odd), without mentioning it. In the third triple, it is
    important to distinguish two different meanings of x. The value of x is odd in
    the precondition, before execution so x + 1 is even, and x inherits that'
