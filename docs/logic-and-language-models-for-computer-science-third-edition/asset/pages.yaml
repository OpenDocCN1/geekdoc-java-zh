- img_proc: true
  md: '# B.5 Writing Actions


    Actions are written in a simple syntax, very similar to C, C++, Java and related
    procedural languages. An action is zero or more statements. The statements are
    separated by either a semicolon (;) or the end of the line. (Statements can be
    extended to multiple lines by ending lines with a backslash.) Some basic statements,
    among others, are:


    ```

    print expression-list

    if ( expression ) statement

    if ( expression ) statement else statement

    while ( expression ) statement

    for ( expression ; expression ; expression ) statement

    assignment statements, function calls, etc.

    ```


    The print outputs a string terminated by a newline. The string can be built from
    several string expressions separated by commas. The commas introduce blanks as
    separators. For example, if $2 is “Bob” and $1 is “Alice” then print $2, $4 prints
    the line “Bob Alice”. Note that print $2 $4 prints the line “BobAlice” since there
    is only a single string expression, the concatenation of the strings $2 and $4.
    By convention, print by itself is the same as print $. (There is a printf command
    available to do formatted output.)'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# B.6 Using Arrays


    AWK uses associative arrays, arrays in which the subscripts are strings. The arrays
    are one-dimensional and brackets are used to delimit subscripts. The arrays elements
    can be strings and/or numbers. For example, suppose our input file have state
    abbreviations as the third field of each record. We have an expression such as
    table[$3] > table("VA"). Note, because of type conversion, item["4"] can be written
    more naturally as item[4].


    Through usage the program learns the set of subscripts that correspond to entries.
    There is a form of the statement for array processing:


    ```

    for ( variable in array ) statement

    ```


    where the loop executes statement with variable in turn to each different subscript
    in the array (in no particular order). Further, in is also a boolean operator,
    where (variable in array) is true if variable has been used subscripts for an
    array with the function delete array[subscript]. (A subscript can be removed from
    the set of valid subscripts for an array with the function delete array[subscript]).


    Any string can be regard as a “record” that is itself composed of consecutive
    fields. The function split(string, array, separator) breaks up string into fields,
    separated by the string separator, and stores the fields in the array array. For
    example, split("12/4/2003", date, "/") stores 12 in date[1], 4 in date[2], and
    2003 in date[3].


    Multidimensional arrays are not supported but they appear to be. This is because
    if you write matrix[i, jj] it converts “i,j” into a single string and treats matrix
    as a one-dimensional array. In words, in this context, the comma is an enhanced
    concatenation operator.'
  merge: -1
  pgno: 407
