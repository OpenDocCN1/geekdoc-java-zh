  md: 'successor of 3" or that "0 is the smallest element of $\mathcal{N}$ (where
    $\mathcal{N}$ is the set of non-negative integers). Furthermore, even when something
    is mentioned, a lot of "background knowledge" underlying it may be left tacit.
    Such facts are rigorous because they have been proven, by others in the past,
    i.e., our background knowledge includes inference rules about specific domains
    (or subject matter) that have also been proven by others. For example, continuing
    in the domain of non-negative integers, if $a < b$ and $b < c$, we can infer that
    $a < c$. This inference rule, known as the transparency of less-than, is so common
    that it is often left unstated without confusing anyone.


    In this chapter we avoid possible confusion by unstated background knowledge.
    We begin with proofs solely on propositions. The axioms and theorems will be propositions
    and the rules of inference will also be based on propositional logic. In later
    chapters we will include predicate logic for these rules. Ultimately we will apply
    logic-based inference to prove properties of numbers and computer programs; at
    that point we assume no background knowledge.


    In the last chapter we used two methods to establish that certain propositions
    are true in every state by considering every state separately; we called this
    proof by exhaustive case analysis. It is fairly useless for a large number of
    variables and, worse, it gives the reader insight into why it is true; if human
    error introduced an incorrect entry in the table we would notice. Second we used
    laws that allowed algebraic substitutions/manipulations to transform the given
    proposition into some equivalent form. When the new form is the constant TRUE
    we have established the given proposition as tautology. A proof that proceeds
    entirely in this way is sometimes called an "algebraic proof". This method can
    have intractable detail and also does not give much insight.


    In contrast, in this chapter we use a style of proof that is often called "natural
    deduction." This is based on a formalization of the rigorous underp of "common
    sense" arguments. The details of the presentation of the method differ from book
    to book.$1$ A proof that proceeds entirely by rules of inference — without reliance
    on algebraic manipulations — will be called a "natural deduction," or a "rules
    of inference proof." In Section 3.8 we formally tie together the proofs of tautologies
    and the deduction proofs of theorems.


    In the next section we will see such inference rules, but first consider a more
    general setting. Suppose that in a step-by-step proof that it has been'
