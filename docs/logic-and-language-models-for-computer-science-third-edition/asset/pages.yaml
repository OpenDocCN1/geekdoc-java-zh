  md: 'It is the ability to cast diverse problems as language tasks that gives the
    study of formal languages its crucial role in computation theory. Many of the
    languages in this text may seem artificial, but that is only because we need to
    start with simple examples. In fact, the power of languages is in their ability
    to capture the essence of “natural” problems.


    Some decision problems are fairly straightforward. The decision problem corresponding
    to $L_1$ can be solved by a simple FA; it can therefore be proved by a TM that
    always halts. It is also possible to give a TM that accepts $L_2$, which always
    halts. However $L_3$, which corresponds to the decision problem known as the **Halting
    Problem** is more difficult. In Section 12.5 after we proved that $L_U$ is not
    recursive we gave an argument showing that $L_3$ is also not recursive. (If it
    were recursive,)


    A decision problem is said to be **undecidable** if the corresponding language
    is *not recursive* (even if it is recursively enumerable). We can say the “Halting
    Problem is undecidable.” (Sometimes we say the “language $L$ is undecidable” but
    properly we should refer to the decision problem.) Note that undecidability refers
    to our inability to design a single computer (Turing Machine) that will correctly
    solve the problem for all inputs. In other words, you might be able to build a
    TM that almost always gets the right answer, but if the problem is undecidable
    then your TM must give the wrong answer for at least one input!


    Some undecidable problem are artificial but many, such as the Halting Problem,
    have direct impact on computer scientists. If someone tells you they have a program
    that can do a complete analysis of, say, C++ code then you should doubt it. After
    all, their program can never decide if some given C++ code ever halts, so how
    can they decide if it works. (This is the reason we stressed the notion of proofs
    “partial correctness”) in Chapter 6.) Sometimes the most impossible problems turn
    out to be undecidable. For example, the problem of determining if a CFG corresponds
    to a regular language $L_4$ above — is undecidable! Unfortunately the proof is
    too complicated to give here.'
