  md: '# 12.3 Infinite Sets


    Turing machines are studied for two complementary reasons. First, they allow us
    to describe succinctly what any computer *can* do; we return to this topic in
    Section 12.7. Second, they allow us to explore what a computer *can not*. The
    idea of a computational task that no computer can perform may seem counter-intuitive
    and the work of proving that such tasks exist seem daunting. Indeed it must be
    admitted that the proofs are indirect and somewhat complicated when treated formally.
    To get a handle on them, we need to begin with a better understanding of infinite
    sets. (This material could have been in the first chapter, but it is better to
    present/review this context.)


    Recall that a finite set is a set with a cardinality that is an integer. So $\{a,
    b, c\}$ is a finite set since its cardinality is 3. Also recall that two sets
    have the same cardinality if and only if there is a one-to-one correspondence
    between them. So $\{a, b, c\}$ and $\{1, 2, 3\}$ have the same cardinality because
    of this mapping:


    ```

    $$\begin{matrix} 1 & 2 & 3 \ \ddagger & \ddagger & \ddagger \ a & b & c \end{matrix}$

    ```


    This use of mappings to determine that two sets have the same cardinality carries
    over to infinite sets. The most important infinite set is the set of non-negative
    integers, $\mathcal{N} = \{0, 1, 2, 3, 4, ...\}$. We can define $\mathcal{N}$
    formally, but that would take us beyond the scope of this book. $\mathcal{N}$
    is defined by starting with 0 and using the rule that if $i$ is in $\mathcal{N}$
    then $i+1$ is also in $\mathcal{N}$; clearly there is no largest element of $\mathcal{N}$.
    Consider the following one-to-one correspondence between $\mathcal{N}$ and $\mathcal{E}$,
    where $\mathcal{E}$ is the set of even non-negative integers:


    ```

    $$\begin{matrix} 0 & 1 & 2 & 3 & 4 & ... \ \ddagger & \ddagger & \ddagger & \ddagger
    & \ddagger & \ 0 & 2 & 4 & 6 & 8 & ... \end{matrix}$

    ```


    This mapping shows that the two infinite sets can have the same cardinality, even
    though one is a proper subset of the other! This is just one of many counter-intuitive
    properties of $\mathcal{N}$. We must be careful using the word "infinite," as
    will become clear soon. A set with the same cardinality as $\mathcal{E}$, is said
    to be countably infinite.$4$ This makes sense'
