  md: '# 7.4 Two Views of Alphabets and Language


    For both human languages and programming languages, matters are complicated by
    the fact that we use symbols to represent two different kinds of things. For a
    human language, we might take the symbols to be the individual words. In that
    case we often call the symbol set vocabulary (rather than “alphabet”) and the
    strings of the language are its sentences, regarded as sequences of words. However,
    at a finer-grained level of detail, it is also true that each word can be regarded
    as a string composed of letters. (At least this is true in many human languages,
    though by no means of them.) When we work at this lower level of analysis, the
    letters become the members of the symbol set, which is now more appropriately
    called alphabet.


    The situation is similar for programming languages, where symbols standing for
    two different kinds of things also prove useful for different purposes. Strings
    of (ASCII) characters make what we are called the tokens of a programming language.
    Tokens correspond to words of human languages and can serve as symbols. Some examples
    of multi-character tokens in C++ are for, <= and cout. The tokens in turn combine
    to form statements. But a token that is, say, a decimal integer is itself using
    the alphabet of decimal digits.


    This dual nature can be confusing, but we never operate at two levels at the same
    time. To make this consider how a compiler processes, say, a C++ statement. It
    first reads it as a sequences of individual ASCII characters finding the strings
    that are the tokens and replaces each such string with a single newly-minted symbol.
    (This is called “lexical analysis” or “tokenization.”) The second disjoint action
    is to process the statement as whole with the tokens serving as single symbols.


    Hereafter we will be working in more abstract domains so this dual nature will
    not arise.'
