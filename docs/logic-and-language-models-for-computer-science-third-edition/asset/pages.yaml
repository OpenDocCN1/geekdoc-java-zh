  md: '# 1.2 Relations and Functions


    A binary relation is a set of ordered pairs. More formally, a $R$ from the set
    $S_1$ to the set $S_2$ is a subset of the cross-product of those sets, $R \subseteq
    S_1 \times S_2$. For example, if $E$ is a set of employees and $P$ is a set of
    projects, we can specify a relation $R$ between $E$ and $P$ that indicates which
    employees are assigned to which projects. In this case each element of $R$ has
    to be an ordered pair $(x, y)$ with $x \in E$ and $y \in P$. More specifically,
    if $E = \{e_1, e_2, e_3\}$ is the set of employees and $P = \{p_1, p_2, p_3, p_4\}$
    is the set of projects, we might have $R = \{(e_1, p_2), (e_1, p_3), (e_3, p_2)\}$,
    indicating that employee $e_1$ is assigned to $p_2$ and $p_3$, while $e_3$ is
    assigned only to $p_2$ and $e_2$ is unassigned.


    It is possible to have a relation from a set to itself. In this case we say we
    have a relation on that one set. More formally, a $R$ is on the set $S$ if $R
    \subseteq S \times S$. For example the set $S = \{George VI, Elizabeth II, Prince
    Charles\}$ and the relation $P$ that relates a child to the parent. Then $P =
    \{(Prince Charles, Elizabeth II), (Elizabeth II, George VI)\}$.


    Some relations are explicitly constrained to have just one ordered pair for each
    first element; such a relation is a *function*. In the example above, if each
    employee had been assigned to one project then the relation would be a function.
    In that case we would want to use the more familiar function notation, $R(x)=y$,
    rather than the relation notation, $(x, y) \in R$. Since a function can be regarded
    as a *mapping* from one set to another, it is usually described with the notation


    $R : E \rightarrow P$


    which indicates that $R$ is a function that maps elements of $E$ to (unique) elements
    of $P$. $E$ is the *domain* of $R$ and $P$ is the *codomain* of $R$. Such a function
    is a *one-to-one correspondence* between $E$ and $P$ if every element of $E$ is
    mapped to an element of $P$ and every element of $P$ has exactly one element $E$
    mapped to it.(Such a function is also called a *bijection*, and in some texts
    the function is said to be "one-to-one onto.") It follows that if there is a one-to-one
    correspondence between $E$ and $P$ then those two sets have the same number of
    elements.


    Analogous to binary relations there are also ternary (3-ary) and $n$-ary relations.
    A ternary relation is a set of triples and an $n$-ary one is a set of n-'
  merge: -1
  pgno: 18
