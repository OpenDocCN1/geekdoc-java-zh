  md: 'The rule of inference for the sequencing of statements is:


    # Sequence:


    ```

    $p{S_1\} q\nq{S_2\} r\n\np{S_1;S_2\} r$$

    ```


    This inference rule is applicable when we have analyzed two successive statements,
    $S_1$ and $S_2$, and have established $q$, the *pre* condition of the second,
    is also the *post* condition of the first. Thus $S_1$ establishes what $S_2$ requires.
    In such a case, it is correct to conclude that we know the precondition and postcondition
    for the two-statement sequence as a whole. Note that a sequence is itself a kind
    of statement, a compound statement. Therefore repeated use of this rule on longer
    and longer compound statements allows us handle programs of any size.


    # Example 6.2


    Suppose it is known that $x$ must be 1 on entry to the code


    ```

    $y \Leftarrow 3; z \Leftarrow x + y.$

