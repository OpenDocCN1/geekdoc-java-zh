    12, 20\}$ and $t = 31$ For this problem, the code would tentatively choose a first
    number from the $j$ possibilities, say 7. Then, in recording that it picks a second
    number, say 7; so now it is looking for sums starting with $7 + 7$. It then tries
    third numbers. But since $7 + 7$, $7 + 12$ and $7 + 20$ are not 31 it realizes
    it must abandon the first two choices The algorithm now backtracks one step: it
    gives up on its most recent choice and makes a new choice at point. If all choices
    of that point are used, it backtracks further. In the current context this means
    it gives up on the 7 in second position (but at least for now keeps the 7 in first
    position) and tries a different number 12 Now it again tries different numbers
    — getting $7 + 12 + 7, 7 + 12 + 12$ is tried it is found to be $t$ and the procedure
    succeeds. If there were no such three summands then the procedure would eventually
    fail, after an exhaustive search, that is, after trying all possibilities.


    Both the parallel and backtracking approaches succeed when it to to to do so and
    fail otherwise. They differ greatly in details but they share the same nondeterministic
    characterization. The nondeterministic specification is thus a model of solution
    in that it provides a relatively simple and succinct description of what is to
    be done, while ignoring aspects of the implementation that do not currently interest
    us.


    A “computation of code $S$” will mean any one of the many possible computational
    paths that $S$ can follow by exercising its choices. We say the code $S$ is successful
    if there exists a computation of $S$ that halts with a succeed, otherwise the
    computation of $S$ fails, either with a fail or by being unable to succeed. The
    code $S$ is unable to succeed if it goes into an infinite loop, or if it is asked
    to choose from $A$ and $A = \emptyset$.


