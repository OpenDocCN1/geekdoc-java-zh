  md: '# ∀X : ∀Y : (∃Z : PARENT(X,Z) ∧ PARENT(Z,Y))

    → GRANDPARENT(X,Y)


    A good way to read the Prolog version of this rule is as follows: To prove that
    X is the grandparent of Y, one proves that X is a parent of some Z and also that
    Z is a parent of Y. Notice that the parameters of the rule are universally quantified;
    it is rule for all possible arguments. But notice the variable Z which is introduced
    on the right-hand side is understood to be existentially quantified.


    Having examined assertions—both facts and rules—it is time to turn to the question-answer
    part of Prolog. The assertions in Example A.1 enable the Prolog inferencer to
    answer quite a variety of questions. For example, just the fact parent(mary, john)
    by itself lets us get answers not only to “Is Mary parent of?”, “Who is parent
    of John?”, “Who is Mary parent of?”, “Is Mary parent?” and more. Using the rules
    of Example A.1, Prolog can also give the correct answer to the likes of “Who is
    the mother of John” and “Is anyone a grandparent?” We will soon see what such
