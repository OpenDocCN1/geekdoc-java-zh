  md: "Conditional law:\n$\\alpha \rightarrow \beta \\equiv \neg \\alpha \\vee \b\
    eta$\n\nBiconditional law:\n$\\alpha \\leftrightarrow \beta \\equiv (\\alpha \r\
    ightarrow \beta) \\wedge (\beta \rightarrow \\alpha)$\n\nContrapositive law:\n\
    $\\alpha \rightarrow \beta \\equiv \neg \beta \rightarrow \neg \\alpha$\n\n# Figure\
    \ 2.3: Equivalences with the Conditional\n\nWe read $p \\leftrightarrow q$ as\
    \ “p if and only if q” or more succinctly, “p iff q”. It may also help to say\
    \ it less succinctly as “p if $q$, and also $p$ only if $q$”. We can rephrase\
    \ the “p if $q$” part as “if $q$, then $p$” which is the same as $q \rightarrow\
    \ p$. As for the “$p$ only only if $q$” part, it indicates that when $q$ is false,\
    \ so is $p$; that is, $\neg q \rightarrow \neg p$. This in turn gives $p \rightarrow\
    \ q$, by the contrapositive law; see the next paragraph.\n\nThere are three additional\
    \ laws that involve our new operators and each is, of course, proven by truth\
    \ tables. The conditional law appears in Figure 2.3; note that it quite accurately\
    \ says that if you are in a state that makes $p \rightarrow q$ true then you are\
    \ either in the first column $(q)$ or the second row $(\neg p)$. The biconditional\
    \ law conditionals $p \\leftrightarrow q \\equiv (p \rightarrow q) \\wedge (q\
    \ \rightarrow p)$ certainly motivates the use of a double arrow and the phrase\
    \ “if and only if.” The contrapositive law is also shown."
