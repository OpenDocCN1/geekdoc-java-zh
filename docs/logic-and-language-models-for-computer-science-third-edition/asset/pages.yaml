  md: '# 1.3 Operators and their Algebraic Properties


    Operators are crucial to all of mathematics, starting with the first one learn
    in childhood, the addition operator of ordinary arithmetic. The input to an operator
    are its *operands*. Each operand of an operator must come from a specified set.
    For present purposes, we will say that both operands of addition are from the
    domain of real numbers, which includes things like -273, $\pi$, .406 and the $\sqrt{5}$.
    The real numbers are said to be "closed under addition," since the result of adding
    two of them is also a real number; that is, *closed* means staying within a domain.
    The codomain of the operator is the same as the domain of all its operands.


    In case of addition, the order of the operands does not affect the result. For
    example, 2+3 and 3+2 both are 5. More generally, $x+y=y+x$ for any x and y. Since
    that is the case, the operator is *commutative*. Multiplication is also commutative,
    but subtraction and division are not. The property of commutativity, is one of
    several properties of operators that will be of interest to us.


    Such a property is called an *algebraic law*. A law is a strong statement. It
    states a property holds for all operands, not sometimes. In other words addition
    is said to be commutative because it obeys the commutative law (i.e., $x+y=y+x$
    for any x and y. Another algebraic law of addition is the *associative* law —
    which it is — is the same as saying that $(x+y)+z=x+(y+z)$ for all x, y and z.


    The identity element for addition is 0 (zero), since never is one of the operands,
    the result is the other operand: $x+0=x$, for any x. Every real number x has an
    *inverse*, -x, that the two of them add up to the identity: $x+(-x)=0$.


    Multiplication of reals is commutative and associative. It has an identity element,
    1, and for each element x except 0 there is an inverse, 1/x. The multiplication
    operator is often unwritten, and by simply writing the operands next to each other.


    A property of the interaction of addition and multiplication is *distributivity*,
    the fact that multiplication distributes over addition. $x(y+z)=xy+xz$, for all
    x, y and z. (However, addition does not distribute over multiplication, since
    it is not *true* that $x+yz=(x+y)(z)$,)'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'for any x, y and z.)


    An operator is really just a specific type of function$^1$. For example the addition
    operation for two real operands can be expressed


    # $Add: \mathcal{R} \times \mathcal{R} \rightarrow \mathcal{R},$


    where $\mathcal{R}$ is the set of real numbers. So Add(5.2, 3.1) maps to 8.3.
    It is common to write such binary operators using *infix* notation, where the
    name of the function comes between the operands so that parentheses are needed.
    However writing Add(5.2, 3.1) as 5.2 Add 3.1 is hard to read, so we use symbolic
    designations for the operators, i.e. $5.2 + 3.1$. Such a symbolic operator is
    still a function:


    # $+: \mathcal{R} \times \mathcal{R} \rightarrow \mathcal{R}$.


    Similarly unary operators, which have one operand, are written *prefix* notation,
    where the operand appears before the operator; for example—x.


    Some operators have a codomain that is {TRUE, FALSE}. Such a binary operator is
    known as a *relational* operator. Equality, less-than($“<$”) and greater-than($“>$$”)
    are common examples. The pairwise combinations of them are also relational operators:
    less-than-or-equal($$\le$”), greater-than-equal($$\ge$”), and inequality (“$

    eq$”; i.e., greater-than or less-than). An important algebraic property of all
    these operators except “$

    eq$ is *transitivity*. if $x < y$ and $y < z$ are both true, then $x < z$ must
    be true, for all x, y and z.


    Operators apply not only to numbers but to other domains as well. An excellent
    example occurs in the next section, where set operators are introduced. We will
    find that not only are the key operators, union and intersection, both commutative
