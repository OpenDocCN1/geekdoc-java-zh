  md: '# 2.3 Propositions as Functions


    Consider a proposition α = ¬((p ∧ q) ∨ r). We see it as a string of symbols and
    we understand the symbols as Boolean variables and operators and we also understand
    the structure — through parentheses or with an expression tree — well enough to
    be clear on what the arguments for these Boolean operators are. It is just one
    step further to regard α itself as a Boolean function.


    A proposition must be a truth-valued statement, but our α is not clearly true
    or false. In fact it is one or the other, but that depends on the state truth
    assignment — of its variables. While α is a string of symbols, it also be regarded
    as a truth-valued/Boolean function α(p, q, r).


    # Example 2.2


    Again, consider the proposition α = ¬((p ∧ q) ∨ r). If the variables have the
    truth assignment p = TRUE, q = FALSE, r = FALSE we can see how evaluate the proposition
    “bottom-up.” This is shown in the diagram. First p ∧ q = FALSE, by the definition
    of ∧. Next we see that (p ∧ q) ∨ r is FALSE by appealing to the definition of
    ∨. Finally ¬((p ∧ q) ∨ r) is evaluated to TRUE.


    ![](img/e49d977e0cc4db78b7174ba16fc32998_44_0.png)


    This can be captured in tabular form. Note that each node of the expression tree
    is the root of a subtree that corresponds to a subexpression and we indicate that
    the bottom-up evaluation is for each subexpression. For brevity, of course, we
    use T and F of TRUE and FALSE.


    | p | q | r | p ∧ q | (p ∧ q) ∨ r | ¬((p ∧ q) ∨ r) |

    |---|---|---|---|---|---|

    | T | F | F | F | F | T |'
