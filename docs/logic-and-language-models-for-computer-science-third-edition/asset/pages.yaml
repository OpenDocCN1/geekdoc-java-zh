    In reasoning about predicates it is important to understand their relationship
    to propositions. It is reasonable to think of a predicate as a kind of shorthand
    for a family of propositions, for each element in the domain. For example, suppose
    that p represents the predicate we have been calling GreaterThanThree. p(-2) is
    a proposition whose value is FALSE and p(7) is a proposition with the value TRUE.
    Carrying over our understanding of the A operator to expressions that include
    predicates, we have propositions like p(-2) ∧ p(7). This proposition happens to
    be false, since p(-2) ∧ p(7) = FALSE ∧ TRUE = FALSE.


    # Example 4.1


    Let q be the predicate that means its argument is 7. Using q along the predicate
    p above, what does r(x) = p(x) ∧ q(x) mean?


    Here r is a predicate that is true in both p and q are true. In other words, r
    is the property of being between 3 and 7. We can also write


    ```

    r(x) = p(x) ∧ q(x) = (x > 3) ∧ (x < 7).

    ```


    so, for instance, r(6.8) = p(6.8) ∧ q(6.8) = TRUE ∧ TRUE = TRUE, but r(-16.5)
    = FALSE. Although r is more complicated than p and q it is like them that each
    takes only a single argument. Thus r takes one real to a logical constant, and
    we can write r : R → B.


    Non-numerical arguments are also of great interest. For example, let P be the
    set of persons. Then we can define Mother to be a predicate such that for two
    members, x and y, of the set P, Mother(x,y) is true and only if x is the mother
    of y. So Mother(Hillary, Chelsea) = TRUE, for example. In this case, Mother: P
    × P → B.


    It is often assumed that there is some obvious domain or universe of objects (reals,
    persons, etc.) that serve as possible values for a variable. Sometimes when speaking
    in general terms, with no particular universe in mind, we may just call the universe
    U.'
