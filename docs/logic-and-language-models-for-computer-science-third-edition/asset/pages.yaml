  md: 'represent infinite languages. Then, once we have such a representation, the
    generation question arises: how can we use that representation to generate or
    display an unlimited number of strings of the infinite language in a way that
    any particular string would ultimately be generated? This is a computational question.
    To answer it, we will need to specify our languages in a way that enables us produce,
    step-by-step, strings of the language. The formal rules for the steps needed to
    produce strings of a language are often presented as a grammar for that language.


    Recognition: How can we recognize the strings of a language? The recognition problem
    is as follows: Given a language L and any string x over the alphabet of L, can
    we always determine whether or not x ∈ L? This is a decision problem, where the
    output is “yes” or “no.” For a particular language L, it may seem reasonable to
    think in terms of a computer program that can take any string as input and tell
    it it is in L. Such a program is said to recognize the language L. However we
    will not describe recognition in terms of a computer program but rather in terms
    of a simple computing machine, or automaton, which is built specifically for L.
    This allows us to calibrate how “power” is needed for L.


    What is a language class? If Σ contains every single symbol, then Σ contains an
    infinite number of strings, and so are there an infinite number of different languages
    over Σ. Some of these are “complex” than others. Consider, for example,


    ```

    L₁ = {x|x ∈{a*} and x contains an even number of symbols}

    L₂ = {x|x ∈{a*} and x contains a prime number of symbols}

    ```


    so that aaaaa ∈ L₂ but aaaaa ∈ L₁. These look equally complex to the mathematician,
    since evenness and primality are just properties of integers.'
