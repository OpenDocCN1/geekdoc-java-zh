  md: '# 6.2 Definitions


    Typically the proof that a program is correct is divided into two subproofs. First,
    one shows the program’s partial correctness: if the program terminates then it
    indeed computes what it should. Second, one shows that, in fact, the program terminates.
    This chapter treats only the first part, proofs of partial correctness, since
    proofs of termination can be very subtle and problematic.


    In order to keep our discussion largely language independent we will will constrain
    our attention to just a few types of statements common to most procedural languages.
    In particular, in addition to some elementary statements, such as assignment statements,
    we will use the three standard mechanisms for generating structured code out of
    elementary statements: sequencing of statements (“$S_1; S_2$”) for $S_1$ followed
    by $S_2$), conditional statements (“if $B$ then $S_1$ else $S_2$”) and iteration
    statements (“while $B$ do $S$”). It is worth noting that these last kinds of statements
    are the core of Structured Programming and that they are also the easiest to prove
    assertions about. This notion that programmers who use Structured Programming
    will write code that is most readily correct, however informal that proof might
    be.


    We choose to writing programming statements not in any real language but in “pseudocode”
    that captures key ideas, keeps us from appearing to rely on the peculiarities
    of any particular real language. This approach lets us promote clarity. It also
    avoids using C’s and C++’s use of the equals sign for assignment statements, so
    that the mathematical equals signs in the proofs will be unambiguous. Users of
    C++ will find it enough to read “while $B$ do $S$”, for example, as “while $(B)$
    $S$”. We use newline breaks and indentation where possible to indicate program
    structure (avoiding begin/end bracketing, etc.). Recall, as is typical in any
    discussion of Structured Programming, a “statement” $S$ can be a compound statement,
    which is an arbitrarily large block of code.


    We specify what a program is proposed to compute by giving two propositions. First
    we give the initial assertion which indicates the initial state of the computation.
    This will be a conjunction of propositions about the initial values of the variables
    used by the program. Second we give the final assertion which specifies the final
    state of the computation. This too is a conjunction of propositions, in this case
    about the final values of the'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'variables and/or the output of the program. Notice that the specification says
    nothing about the method used to compute the desired final state; any number of
    programs based on different methods could all be correct.


    The notation that is typically used in program verification is called the **Hoare
    triple**: $p \{S\} q$. This notation is equivalent to this assertion: If the proposition
    $p$ is true for the initial state of the code S and, further, S terminates then
    $q$ is true for the final state. Recall that S need be a single statement; it
    can be any block of code, including the entire program. We call $p$ the precondition
    and $q$ the postcondition. When S is the entire program then the precondition
    is the initial assertion and the postcondition is the final assertion.'
