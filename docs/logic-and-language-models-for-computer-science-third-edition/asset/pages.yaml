  md: "# 10.3 Structure, Meaning and Ambiguity\n\nWe will model the structure of the\
    \ derivation of a string and show how that structure can have an effect on the\
    \ meanings of the string. In this section we introduce various concepts by using\
    \ a continuing example: the design of a grammar for simple algebraic expressions.\n\
    \n![](img/e49d977e0cc4db78b7174ba16fc32998_266_0.png)\n\nFigure 10.1: A derivation\
    \ tree using the productions: $A \rightarrow BC, B \rightarrow DE$, and $C \r\
    ightarrow F$.\n\n**A derivation tree** is a diagram of a derivation. For example,\
    \ the left side of Figure 10.1 shows the derivation tree for a one-step derivation\
    \ using the production $A \rightarrow BC$. We say in such a case that we have\
    \ *expanded* the node. The derivation tree in the right side of the figure starts\
    \ the same way and then expands $B$ and $C$, using the two additional productions\
    \ $B \rightarrow DE$ and $C \rightarrow F$. In general, a parent in the tree must\
    \ be labeled by the left side of some production and its children be labeled by,\
    \ in order, the symbols on the right side of the same production.\n\nThe second\
    \ tree in Figure 10.1 can be regarded as a non-linear model of the linear derivation\n\
    \n```\n$A \\Rightarrow BC \\Rightarrow DEC \\Rightarrow DEF$,\n```\n\nin the sense\
    \ that it focuses on only certain aspects of it. In particular, the tree does\
    \ not specify in what order $B$ and $C$ are expanded, and often we will not care.\n\
    \nThe derivation tree is a model of structure in the sense that it emphasizes\
    \ certain structural relationships. For example, the lines in the derivation tree\
    \ that descend from $B$ to its children $D$ and $E$ show that $B$ is composed\
    \ of $D$ and $E$. This information is in the linear derivation, but one has to\
    \ infer it by looking at what has changed from before the arrow to after it, in\
    \ the derivation step $BC \\Rightarrow DEC$."
