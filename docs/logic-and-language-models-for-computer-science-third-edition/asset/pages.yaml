  md: 'determinism appears to be very helpful in allowing unrealistically fast implementations.
    A NTM can guide the computation by making shrewd guesses, whenever it has a choice
    of transitions, and so avoid having to search for evidence that a string should
    be accepted. It is obvious that


    # $\mathcal{P} \subseteq \mathcal{NP}$


    since the power of nondeterminism can only improve the time needed to accept a
    language. In fact it seems plausible that there would be problems solvable in
    polynomial nondeterministically, that can not be solved by any polynomial time
    DTM. Any such problem is, of course, intractable.


    In fact, $\mathcal{NP}$ is of great indirect practical significance, by the class
    of $\mathcal{NP}$-complete languages. The definition of $\mathcal{NP}$-complete
    languages is too technical to give here, but the upshot is that these are the
    languages in $\mathcal{NP}$ that are the hardest to solve. In particular, if any
    language in $\mathcal{NP}$ is intractable every $\mathcal{NP}$-complete language
    is intractable.


    The class of $\mathcal{NP}$-complete problems is quite unusual, considering its
    very abstract definition. This class contains thousands of decision problems that
    people have actually needed to solve in real life. A few examples of $\mathcal{NP}$-complete
    decision problems are:


    +   * **Partition** – Given a sum of integers, can it be partitioned into two
    disjoint sets, such that the sum of the elements in each set is the same?


    +   * **Hamiltonian Cycle** – Given a graph, is there a subset of the edges that
    forms a cycle that goes through every vertex exactly once? (The related traveling
    salesperson problem, uses an edge-weighted graph and asks for the hamiltonian
    cycle of least weight)


    +   * **Scheduling** – Given a set of tasks, with their durations and deadlines,
    is there a schedule for two (or more) processors that will complete all the tasks
    by their deadlines?


    +   * **Satisfiability** – Given a boolean formula, is there a truth assignment
    to the boolean variables such that the formula is true?


    This short list begins to illustrate the fact that the class of $\mathcal{NP}$-complete
    problems is diverse and of practical interest. It is worth pointing out (given
    the emphasis on logic in this text) that satisfiability problem is the problem
    on which all of the theory is based! Why is satisfiability so important? Briefly,
    it is because boolean expressions “express” that certain problems are as hard
    as some other problems.'
  merge: -1
  pgno: 344
- img_proc: true
  md: 'The thousands of NP-complete problems have an interesting property in common.
    While they have attracted much attention by people trying to devise efficient
    algorithms (because of their real life importance) no researcher has ever devised
    a polynomial time implementation that solves any problem! And as we said, if any
    NP-complete problem can be solved in polynomial time, then every NP-complete problem
    can be solved in polynomial time. These observations provide strong circumstantial
    evidence that none of the NP-complete problems have polynomial time solutions.


    In summary:


    +   - If any problem in NP is intractable (not in P) then every NP-complete problem
    is intractable. Alternatively, if any NP-complete problem is tractable (in P)
    then every problem in NP is tractable.

    - Every NP-complete problem appears to be intractable because the combined efforts
    of thousands of researchers has failed to show even one such problem is in P.


    Taken together these strong observations lead people to expect these problems,
    like the satisfiability and the partition problem, will have no polynomial time
    algorithms that solve them. However there is no proof of this conclusion.'
