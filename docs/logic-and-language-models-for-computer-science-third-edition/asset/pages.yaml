  md: "# 5.3 Applying Logic to Mathematics\n\nLogic has been playing a double role\
    \ in many of our examples. Its rules of inference have been our principal source\
    \ of reasoning techniques and it has also served as the domain of application.\
    \ We have applied logic to logic. However, the power and significance of logic\
    \ are clearer than its proofs are put to use outside of logic. The most important\
    \ applications of logic lie within mathematics and computer science, because,\
    \ like logic itself, they are expressed in general terms and so broadly applicable.\
    \ Chapter 6 applies logic to computer science, specifically to the challenge of\
    \ proving the correctness of programs. This section and the next one pave the\
    \ way, by applying logic to arithmetic, or more precisely to number. In this domain,\
    \ the claims are easy to understand but not trivial to prove, so it is a good\
    \ place to start.\n\nFor any new application domain, it is necessary to develop\
    \ new predicates and sometimes even inference rules specific to that domain. Sometimes\
    \ the special predicates and inference rules for a particular topic are given\
    \ explicitly, but usually they are tacit or touched as definitions. Part of the\
    \ difficulty of understanding and writing proofs is to recognize these components\
    \ of our background knowledge. For example, below are four items of background\
    \ knowledge for numbers and sets. The task of casting them into the inference\
    \ rule format of Chapter 3 is left as an exercise.\n\n+   - Subset rule:\n  $A\
    \ \\subseteq B$ follows from the assertion $\forall x \\in A : (x \\in B)$.\n\
    - Set equality rule:\n  $A = B$ follows from $A \\subseteq B$ and $B \\subseteq\
    \ A$.\n- Transitivity of <:\n  This inference rule states that $a < c$ follows\
    \ from the combination of $a < b$ and $b < c$. We saw in Chapter 3 that the conditional\
    \ operator, $\rightarrow$, is also transitive. Several other operators and relations,\
    \ including equality, equivalence and subset are transitive as well."
