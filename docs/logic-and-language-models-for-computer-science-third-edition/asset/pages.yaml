  md: '# Chapter 5


    # Proving with Predicates


    Predicates and quantification when combined with the earlier apparatus of propositional
    logic provide a much broader foundation for proving important results. We will
    prove results within logic itself — as we did in Chapter 3 — but now we can prove
    theorems in other areas of mathematics and computer science. With a view to achieving
    these results, the first two sections develop new inference rules and strategies
    for using them within the same natural deduction framework we have been using.
