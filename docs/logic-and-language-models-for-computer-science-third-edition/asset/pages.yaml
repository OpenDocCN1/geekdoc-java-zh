  md: '# A.2 Getting Started Using Prolog


    Using Prolog is easy. As mentioned above, an important aspect of Prolog is that
    it is typically used interactively, with an interpreter rather than a compiler.
    This section is intended to give you a sense of what a Prolog session is like.
    In a typical Unix system, you can enter Prolog by typing “prolog”, but before
    you start anything, be sure you know how to stop! In many implementations, you
    can stop by using the input “halt.”—without quotes but you do need to include
    the period and the return. (or enter).


    # Example A.2


    If the system prompt is “=>” and the Prolog prompt is “?-?” then the shortest
    possible session looks like this.


    ```

    => prolog

    [startup message from the software company]

    ?- halt.

    =>

    ```


    Before starting the Prolog interpreter, as above, you should prepare a file containing
    some facts and rules, using your favorite editor. Then, once you have started,
    you can get those facts and rules into the session by means of the built-in predicate
    consult which takes a file name as its argument. This predicate is understood
    as a query over whether the file is loadable and also as a request to load it.
    The Prolog response is “yes” and the loading of the file takes place, as a side-effect.
    It is also possible to make assertions during a session, using the special predicate,
    assert, but this is not recommended in general. If the file named awhile contains
    parent(mary,john), the following have the same effect.


    ```

    | consult(myfile).

    ?- assert(parent(mary,john)).

    ```


    So let us say you have created a file called family containing the three facts
    and two rules in Example A.1. You have started a Prolog session and loaded the
    file. You are ready—and—to enter queries and receive answers based on the facts
    and rules you have loaded.'
