  md: 'stack: the stack is a string $\mathcal{S}$. For example if stack has three
    elements — an a on top of $b$ on top of a $c$ — then it will be represented by
    the string $\mathcal{S} = abc$. In particular the stack “read from top to bottom”
    is the same as the string version read from left to right. Note that the stack
    top symbol will be the first symbol of the string. The stack is empty if $\mathcal{S}
    = \Lambda$. To PUSH a symbol on the stack is to append it to the beginning of
    $\mathcal{S}$ and to POP it is to remove the first symbol.


    The fourth decision is the most unexpected. We will not use PUSH and POP operations.
    In an effort to simplify PDAs researchers have discovered that it is best to use
    only “stack action”, rather than two operators. This decision will simplify everything
    that follows, though you might not be able to see that now.


    What is our single stack action? It is to specify a string $\alpha$ of stack symbols
    and ask for the first symbol of $\mathcal{S}$ to be replaced by $\alpha$. Suppose,
    again, that $\mathcal{S} = abc$ and we wish to PUSH(d); we will do this by specifying
    $\alpha = da$ so that the $a$ at the beginning of $\mathcal{S}$ is replaced resulting
    in $\mathcal{S} = dabc$. Suppose instead we wanted to POP the stack top off of
    $\mathcal{S}=abc$; we will do this by making $\alpha = \Lambda$ which result in
    $\mathcal{S} = bc$. Therefore the two stack operations are subsumed by one stack
    action. However this stack action is actually even more flexible since there is
    no restriction on $\alpha$. In general, if $\alpha$ has length $k$ then a single
    stack is the same as a POP followed by $k$ PUSHes.'
