  md: '# 3.7 Types of Theorems and Proof Strategies


    The foregoing examples give the flavor of how formal proofs proceed. They were
    of the form “if α then β” and “α if and only if β”. These are two very common
    types of theorems. We give a few hints about how to approach these kinds of theorems.


    A theorem is read from the top down. Each line is annotated with the reason why
    it should follow from the lines above it. However a theorem is written predominantly
    bottom up. The last line is the starting point; it is the initial goal. By looking
    at a goal and consulting the list of inference rules prover can choose a strategy
    to achieve the goal. This means that new goals are, higher up in the proof, that
    would justify the first goal. Sometimes when we work down, especially when we
    unbundle compound statements with rules like Λ elimination.


    # Example 3.12


    We will begin to sketch a proof of the transitivity of the conditional operator.
    In symbolic form, the theorem is ((α → β) ∧ (β → γ)) → (α → γ). Since the connects
    major parenthesized subexpressions, our strategy will be to use → introduction.
    The first thing is to write the theorem itself as the last line of proof, preceded
    by the material needed to justify it, as shown in the following sketch of a plan
    for the proof.


    | (α → β) ∧ (β → γ) | assumption |

    |---|---|

    | : α → γ | new goal to be shown |

    | (α → β) ∧ (β → γ) → (α → γ) | → introduction |


    The right-hand column are annotations. For α → γ, the justification is “new goal
    to be shown”. We want to prove it, but not not know how we do so. This is just
    a plan, not the finished proof. Next, planning to prove α → y is handled similarly:
    we again use → introduction, to plan for a (sub)proof. This leads to the following
    more detailed proof outline. We should try to complete it, using Λ elimination
    and modus ponens as needed; it is left as an exercise.'
