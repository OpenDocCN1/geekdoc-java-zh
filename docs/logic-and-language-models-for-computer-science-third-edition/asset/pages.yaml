  md: '# $\exists$ Elimination:

    $\exists x \in \mathcal{U} : p(x)\n\overline{new y \in \mathcal{U} \wedge p(y)}$


    This $y$ is a new variable. It is not created by an assumption. The variable $y$
    must *not* be assumed to be some particular member of $\mathcal{U}$; all we know
    about $y$ is that $y \in \mathcal{U}$ and it possesses property $p$. Since it
    is new it must not be known at this point in the proof.


    # Example 5.1


    These rules are nested of course. Consider a proof of the formula $\forall x \in
    \mathcal{N} : \forall y \in \mathcal{N} : p(x, y)$. The framework would be:


    ```

    $[x \in \mathcal{N}]

    [y \in \mathcal{N}]

    :

    p(x, y)

    \forall b \in \mathcal{N} : p(x, y)\n\forall a \in \mathcal{N} : \forall b \in
    \mathcal{N} : p(x, y)$

    ```


    However recall that when two of the same quantifier are consecutive it does not
    matter what the order is. In other words $\forall x \in \mathcal{N} : \forall
    y \in \mathcal{N} : p(x, y)$ is the same as $\forall(x, y) \in \mathcal{N} \times
    \mathcal{N} : p(x, y)$. So it can be more natural to use a framework like:


    ```

    $[x \in \mathcal{N} \wedge y \in \mathcal{N}]

    :

    p(x, y)

    \forall a \in \mathcal{N} : \forall b \in \mathcal{N} : p(x, y)$

    ```'
