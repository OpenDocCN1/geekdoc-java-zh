  md: '# Example 12.3


    Show that $L = \{a^nb^nc^n \mid n \geq 0\}$ is recursive; that is, give a TM $M$
    that always halts and for which $\mathcal{L}(M) = L$.


    The state transition diagram for such a $M$ is given in Figure 12.1. The accepting
    halt state is shown, the rejecting halt state is omitted. The machine is supposed
    to verify that the input $x$ is in $L$. In particular, $M$ enters $q_a$ in those
    cases (and no others) when the tape started out with “$\Delta a^nb^nc\Delta$”
    as the symbols in the first $3n+2$ cells, for some $n \geq 0$. $M$ does its work
    by making repeated passes over the input. Passing left-to-right it changes one
    $a$, one $b$ and one $c$, each under the symbol $X$. The pass ends when it encounters
    a blank, at which point it turns and faces left, so to speak. Passing right-to-left
    it searches for the $\Delta$ at the very beginning, and then turns around start
    the next left-to-right pass. A rightward pass skips over any $Xs$ from earlier
    passes. If a rightward pass encounters only $Xs$ before encountering the trailing
    $\Delta$ then it accepts the input.


    ![](img/e49d977e0cc4db78b7174ba16fc32998_326_0.png)


    > Figure 12.1: A Turing Machine for $L=\{a^nb^nc \mid n \geq 0 \}$.


    What if this $M$ finds itself unable to make a transition found in the diagram?
    Suppose we halt in the third state. In that case we have already encountered an
    $a$ on a rightward pass, and after possibly skipping some $Xs$, we expect to find
    a $b$ to pair up with the $a$ we have already seen. If we encounter, say, a $c$
    instead there is no indicated transition since the input is ill-formed and so
    not in $L$. As indicated above, what actually happens is a transition to the rejecting
    halt state $q_r$.'
