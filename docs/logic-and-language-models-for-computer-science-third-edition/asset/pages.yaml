  md: '# 1.7 Growth Rates of Functions


    A numeric function, $f(n)$, maps numbers to numbers, either integers or reals.
    Sometimes we wish to discuss the growth rate of a numeric function in rough terms.
    For example, for the functions $3n^2 + 12n$ and $10n^2$ it may be useful to emphasize
    that they are both quadratic functions, rather than to point out their differences.
    The “big-O” notation was devised to characterize the growth of functions, while
    ignoring the constant coefficients and the lower order terms (such as $12n$ above)
    that have negligible impact on the growth rate for large $n$.


    In particular, we say a numeric function “$f(n)$ is $O(g(n))$” if


    ```

    $c(n) = \frac{f(n)}{g(n)}, \quad{ and } \lim_{n\to\infty} c(n) = c$

    ```


    for some constant $c$. For example, $n^2 + 12n$ is $O(n^2)$. There are other ways
    to bound the growth of functions. These are typically discussed more fully in
    a text on algorithms, proving bounds on the execution times of algorithms. We
    use this notation sparingly, so we will not go into further details.'
  merge: -1
