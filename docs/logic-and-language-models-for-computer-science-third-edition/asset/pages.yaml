  md: 'As in the previous example, an input string is in the language L if and only
    if the last input character had just been read when the stack becomes empty. Why
    use the power of nondeterminism? It is because the input is stream input and cannot
    be rewound; as we go forward, if we want to use the stack as described, we then
    need to act when we reach the middle of the input. Since there is nothing really
    the middle of a long string to give us a clue, we guess nondeterministically.


    These two examples will guide and motivate decisions as we give a formal definition
    of a PDA. First is the decision to start with nondeterminism as part of the model.
    The first example was deterministic but the palindrome example used choices in
    a very natural way. We will discover there are languages for which there is no
    deterministic PDA but simple nondeterministic PDAs do exist. The palindrome language
    is such a language. Notice that this is fundamentally different from the situation
    with finite automata, where nondeterminism did not confer expressive power.


    Second is the observation that strings can be recognized as being in a language
    by virtue of the fact that the stack is empty when the last symbol of the input
    is read. This is called “acceptance by empty stack”. We will define PDAs to accept
    in this way. This is also at variance with the way finite automata accept input,
    which is by arrival at an accepting state. It turns out PDAs can be defined, instead,
    to recognize input using accepting states; we will discuss the two approaches
    in Section 11.7.


    Next we will decide to have every transition depend on the stack top value. The
    alternative is that sometimes we will use it and sometimes we will ignore it and
    that will make our model unnecessarily complicated. A consequence of this decision
    is that we will insist that when we return to a PDA, on its initial state we will
    start with an empty stack; otherwise we will not be able to make a first transition.
    This will start with exactly one stack and we know what this symbol is. This symbol
    allows us to do several things; we can use it to test if the stack has only one
    symbol on it (almost empty) and we can use to initiate (if it is immediately replaced).
    Another consequence of this decision is the fact that we will not allow the empty
    string to be accepted by a PDA; since we accept empty stack and the stack starts
    non-empty.


    We pause to consider how the stack will be regarded. It might be regarded as a
    special-purpose memory in hardware or it might be regarded as a data structure
    in software. Instead we will steer to a more formal notion of a'
