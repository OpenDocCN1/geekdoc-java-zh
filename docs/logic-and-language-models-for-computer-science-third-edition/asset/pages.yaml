  md: '# A.9 Finite Automata in Prolog


    This section should only be read after the chapter on finite automata (FA).


    Implementing FAs in Prolog brings together key techniques from both halves of
    this book and is surprisingly easy to do. The idea is to get Prolog to carry out
    the acceptance of exactly the strings that are in a particular FA''s language.
    We will do this in two ways. The first method straightforward converts the specification
    for a particular machine directly to a Prolog predicate. The second approach is
    a more general one involving a rule that is useful for any FA. In this method,
    Prolog facts express the structure of a particular machine, an organization that
    we will argue makes sense.


    To write a Prolog program for machine M by the first method, we create just one
    predicate, which we will call accept, to suggest that it will accept strings.
    We want it to succeed (that is, be true, and give a yes answer) given a string
    that M accepts; it should fail on all other strings. We will assume that input
    strings are converted to lists; for example, the string abc becomes [a, b, c].
    Conversion facilities from strings to lists and vice-versa are available in implementations
    of Prolog.


    The predicate accept will have two arguments that together express the current
    situation: the current state and what remains of the input string. We want to
    be able to see if a string is accepted, by entering a query with that string form
    as the second argument to accept, and with the start state, q₀, as first argument.


    # Example A.31


    Consider the FA,


    M = ({q0, q1, q2}, {a, b, c, d}, q0, δ, {q2})


    where δ(q0, a) = q1, δ(q1, b) = q1, δ(q1, c) = q2 and δ(q2, d) = q0


    To test a string, say a66cdac, one would enter the query, accept(q0, [a, b, b,
    c, d, a, c]). In this case, the answer should be yes, since the string is in the
    language of the automaton. Here is a multi-clause rule for accept:'
  merge: -1
  pgno: 387
- img_proc: true
  md: '```

    accept(q0, [aTail]) :- accept(q1,Tail).

    accept(q1, [bTail]) :- accept(q1,Tail).

    accept(q1, [cTail]) :- accept(q2,Tail).

    accept(q2, [dTail]) :- accept(q0,Tail).

    accept(q2, [ ]).

    ```


    Look at the program in Example A.31 and by noticing that the first argument to
    the predicate accept is always a state of FA and the second is always a list.
    In each clause, the list on the right side is shorter by one input symbol, exactly
    the one that causes the transition from the state on the right to the state on
    the left. In addition, the predicate accept succeeds when its first argument is
    $q_2$ and its second argument is the empty list. You can see this from the last
    line. This implements the fact that $q_2$ is a final state. It follows that with
    $q_0$ as first argument the program succeeds for any string in $\mathcal{L}(M)$,
    the language of the FA, and for any other string.


    Now consider a more general approach to FAs in prolog. Although the Prolog rule
    in Example A.31 correctly implements the machine for which it was created, it
    does not give us any help with other FAs. We therefore put the accept predicate
    into a form that is more abstract and therefore is also of more general use. In
    Example A.32, accept expresses the workings of FAs in general, so its rule can
    be used, unchanged, in any FA program.


    The strategy is to express Prolog facts the information about the transition function
    of a particular FA, while the rule is reserved for what is true of all FAs. It
    is appropriate to use delta as the name of the new predicate for fact. The first
    and second arguments of delta are therefore the current state and input, while
    the third argument is the resulting state, which is the value (output) of $\delta$.
    (The technique of converting a function to a predicate with an extra argument
    for the result is a common one. You have seen it with append, a 3-argument predicate
    that corresponds to the 2-argument function of list concatenation.)


    # Example A.32


