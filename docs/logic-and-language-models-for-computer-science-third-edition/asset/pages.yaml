  md: 'The previous example illustrates a general result: a string is ambiguous for
    a grammar if and only if that string has two distinct leftmost derivations. We
    leave it as an exercise to show the equivalence.


    # Example 10.8


    Can we produce another grammar for $L$ that is not ambiguous?

    The ambiguity of $G_5$ arises from having two $Es$ on the right side of the recursive
    productions. (Using one repeatedly causes the tree to lean to the left or the
    right.) So we will use productions with no more than one $E$ on the right, as
    shown below. The production set for $G_6$, shown next, does indeed give us an
    unambiguous grammar. The production $E \rightarrow T$ is necessary to have a non-recursive
    production.


    ```

    productions for $G_6$:nE \rightarrow E + T

    E \rightarrow E \times T

    E \rightarrow T

    T \rightarrow a|b|c.

    ```


    Why is $G_6$ unambiguous? All the branching in the derivation trees of $G_6$ is
    to the left, as shown in each of the trees in Figure 10.4. For strings of a given
    length, there is only one tree shape, or branching pattern. This makes ambiguity
    impossible.


    ![](img/e49d977e0cc4db78b7174ba16fc32998_270_0.png)


    Figure 10.4: Trees for Example 10.8.'
