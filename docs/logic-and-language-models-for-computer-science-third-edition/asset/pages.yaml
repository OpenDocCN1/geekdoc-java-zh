  md: '# 5.4 Mathematical Induction


    This section introduces a technique called mathematical induction that is used
    to prove things about infinite sets. In particular it is used prove things about
    integer variables, variables that can take on an unbounded number of values. Computer
    scientists need to know things about infinite sets, for example, they need to
    be proficient in reasoning about the set of integers. Consider a while loop and
    a predicate $p$, where each $p(i)$ for $i=0, 1, 2, \dots$ asserts something that
    is supposed to be true after i iterations of the loop. How would we prove it?
    We want to prove $p(i)$ is true for every $i \in \mathcal{N}$. Now $\mathcal{N}$
    is an infinite set, but every member of it is a finite integer. Would it be easy
    to avoid any mention of infinite sets; after everything in the real world is finite.
    Actually it is more complicated and less useful. Suppose we did limit a loop to
    say, 10,000 iterations. Proving 1000 propositions one by one is ludicrous, and
    it does not inform us about more iterations. In contrast, many proofs for infinite
    sets are not very difficult.


    In Chapter 6 we consider proofs about the behavior of loops, but here we will
    use easy examples about integers, so we can focus our attention on the methods
    of proof. You have already seen one proof of an infinite set of propositions.
    This was the proof that the product of any two odd numbers is odd. The proof was
    done rather formally, concluding using the rule of inference known as $\forall$
    introduction. This sort of direct proof, is usually avoided, because our new technique
    is simple.


    Mathematical induction (MI) is used solely for theorems of form $\forall n \in
    \mathcal{N} : p(n)$. However such theorems are extremely common, especially for
    computer scientists, since integers are the archetypal discrete mathematical object.
    Suppose we are trying to prove $p(n)$ for an arbitrary natural number $n$. This
    may be hard. The key idea of MI is that when trying to prove $p(n)$ it may be
    much easier if we assume that the truth of $p(n-1)$ has already been established.
    To simplify our presentation we will instead assuming $p(n)$ makes it easier to
    prove $p(n+1)$. This assumption is called the inductive hypothesis.


    This assumption can be helpful, as we will see, but is it justified? To see that
    it is, let us be a little more precise. First, it is important to realize that
    proof by MI has two parts, proof of a base case and proof of the so called inductive
    step. Typically, the base case (or basis) is $p(0)$. Typically the inductive step
    is to prove $p(n) \to p(n+1)$. If this step is carried out'
