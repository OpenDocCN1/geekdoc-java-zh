  md: '# 3.2 Natural Deduction Proofs


    A **proof** is a sequence of assertions meant to convince the reader of the truth
    of some particular statement. The proved statement is called a **theorem**. A
    theorem should always be a tautology; see Section 3.8. Usually a theorem is not
    obvious at the outset, but the proof is intended to inspire confidence that it
    is actually true. A theorem should also hold some interest, possibly because it
    is useful in applications or it may be of indirect use because it helps in proving
    other important results.


    The actual presentation of the proof depends greatly on the (assumed) sophistication
    of the reader and the rigor of the given statement. Here will begin with a rough
    formal view of proofs, rather than rough sketches of proofs, for two reasons.
    First, it is hard to make sense of a rough sketch of something you have never
    seen; in order to recognize the structure of a sketch of a formal proof we need
    to know the components of a formal proof. Second, formal proofs arise in several
    computer application areas, such as “inference engines” and “mechanical theorem
    provers”.


    Proofs succeed in convincing people by (i) starting from agreed truths and (ii)
    continuing by agreed methods. Some of these and methods may seem simple that it
    is hardly stating them, but that''s just what we want! The starting point of a
    proof consists of assertions chosen from among a collection of **axioms**. These
    simple statements are widely accepted as being clearly true. The methods for moving
    onward from the axioms are called **inference rules**.


    In addition, we sometimes introduce an assertion tentatively, as though we do
    not know whether it is true or not, just to explore its consequences. A formal
    proof is a sequence of assertions, ending with the statement that is being proved,
    in which each assertion is either an axiom or an assumption or follows an inference
    earlier in the sequence. It is crucial to keep track of which assertions depend
    on which assumptions, and to achieve the final result in such a way that it does
    not depend on any of the assumptions.


    Proofs in real-life (in journals and books) are usually very rigorous but rarely
    “formal.” In a rigorous proof, an axiom may be considered so common and well accepted
    that it is not mentioned. In arithmetic, for example, we typically do not bother
    to state explicitly that “4 is the'
