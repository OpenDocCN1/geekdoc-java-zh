    $$(x = 1) \quad {y \Leftarrow 3\}\n(x = 1) \wedge (y = 3) \quad {z \Leftarrow
    x + y\}\n(x = 1) \wedge (y = 3)\n(z = 4)$$

    ```


    ```

    $$(y \Leftarrow 3; z \Leftarrow x + y) \quad (z = 4)$$

    ```


