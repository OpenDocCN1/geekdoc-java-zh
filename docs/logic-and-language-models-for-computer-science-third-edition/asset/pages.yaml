  md: '# Chapter 10


    # Context-Free Grammars


    Context-free grammars can express important languages including many that are
    non-regular and they can assign a useful structure to individual strings. These
    two important capacities combine to give CFGs a central role in language and the
    practical modeling of computer languages.


    With the class of regular languages we began with a definition of the class relative
    to a machine model. After that we showed its equivalence to classes defined by
    nondeterministic models, specifically generative models such as grammatical models.
    In this chapter we will define a new class of languages and we will start with
    a nondeter-minist grammatical model. In the next chapter we will establish its
    equivalence to a machine model (push-down automata).


    The motivation for introducing a new class of language models was given in Section
    9.7, where we showed the models we have seen so far are inadequate. We exhibited
    languages that they are non-regular for which there can be no finite automaton
    that accepts the language. Nor can these languages be represented by regular grammars.
    (Regular expressions are also inadequate but the generative model exemplified
    by REs will not be extended.)


    Besides specifying the strings for a wide range of languages, context-free languages
    also provide an account of the structure of each string in their languages. These
    structures are the focus of Section 10.3, where we show how they can play a role
    in extracting the meanings of statements in programming languages. Some grammars
    provide more than one structure for some strings. This somewhat awkward result
    is known as structural ambiguity and although it turns frequently in human languages,
    it is usually regarded as something that can and should be avoided when designing
    programming languages.'
