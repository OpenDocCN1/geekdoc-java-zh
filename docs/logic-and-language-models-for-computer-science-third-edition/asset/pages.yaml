  md: 'formal basis of $\mathcal{N}$ the set of natural numbers. The history of logic
    is intertwined with developments in Set Theory and this set in particular. The
    most influential definition is called “Peano’s axioms,” which we paraphrase:


    # Definition 5.1


    # Peano’s definition of $\mathcal{N}$:


    +   - $0 \in \mathcal{N}$

    - If $n \in \mathcal{N}$ then $n+1 \in \mathcal{N}$

    - If $n \in \mathcal{N}$ then $n+1 \neq 0$\n- If $n, m \in \mathcal{N}$ and $n+1
    = m+1$ then $n = m$\n- If $p(n) \rightarrow p(n+1)$ when $n \in \mathcal{N}$ and
    $p(0)$ is true then $p(n)$ is true for

    all $n \in \mathcal{N}$


    We use the notation $n + 1$ for what is formally called the “successor” of $n$.


    You will recognize the last axiom as MI. Even though motivated MI by a discussion
    involving modus ponens, etc., in fact MI was already agreed to as soon as we started
    using $\mathcal{N}$. In other words, we were really operating with an informal
    commonplace definition of the natural numbers. This is always pedagogically difficult
    to begin with these axioms, though.


    A *system* of logic is informally defined as a set of axioms and a finite set

    of rules of inference. (The axioms may be infinite but there is a

    finite description of them, they are “effectively generated.”) A system is

    consistent** if it is impossible to prove any expression to be both true and

    false. A system that makes it possible to have a proof for everything is said

    to be **complete**; in particular, in the system every (well-formed) expression

    is provably true or possibly false. Everyone wants a system that is

    complete and consistent. Unfortunately logic is not always clean and

    intitive.


    It turns out that we look at systems of logic, our expectations can not

    always be met. This was first discovered by Gödel in the 1931 and in

    revolutionized mathematics. He considered a minimal system for proving

    statements about number theory (such as the statements in Section 5.3

    above). He was able to show that if the system was consistent then it must'
