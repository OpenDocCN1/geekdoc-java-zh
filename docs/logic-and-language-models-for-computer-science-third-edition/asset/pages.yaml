  md: '# 11.8 Limitations on Deterministic Pushdown Automata


    We will now show that deterministic PDAs are less powerful than nondeterministic
    PDAs. This might not seem surprising, except that there was no such distinction
    for FAs. The proof will exhibit a particular CFG language for which there *not*
    be a DPDA. The existence of such a language is all we need, since for *any* CFG
    we know how to construct a corresponding nondeterministic PDA.


    **Theorem 11.3** – There exists a context-free language that is not recognized
    by any DPDA.


    **Proof:** This will follow from the fact that a DPDA accepts by empty stack.
    A PDA with an empty stack must halt since the transition function $\delta$ requires
    a stack top variable as an argument to compute the next state and stack action.
    So if a language contains two distinct strings $x$ and $y$ and $x$ is prefix of
    $y$ (i.e. $y = xz$) then a deterministic PDA for that language must have an empty
    stack after reading $y$ and halt; it cannot continue reading input to accept $y$.
    Many context-free languages have such an $x$ and $y$, like the language of balanced
    parentheses.\square


    This proof is somewhat unsatisfying. There is a suspicion that our PDA was not
