  md: '# Chapter 4


    # Predicate Logic


    Our study of propositions has led to some important results and has provided a
    relatively simple environment in which to examine three styles of proof. Unfortunately,
    when it comes to representing knowledge, the simplicity of propositions is a significant
    weakness. Recall that propositions reflect only whether a sentence is true or
    false, without looking at the complex conceptual structure within the sentence
    — at the things, properties, actions and relationships it talks about.


    Predicates do look at those kinds of things, and in that way they are a big step
    up with respect to this issue of representing knowledge. With predicates, we retain
    the use of the logical constants, TRUE and FALSE, as the only possible values
    of logical expressions, so that like propositions they ignore all forms of vagueness
    and uncertainty. The representational power of predicate logic — sometimes called
    predicate calculus — is its greatest asset.'
  merge: -1
