  md: '# $\delta^*(q,x\sigma) = \bigcup_{p\in\delta^*(q,x)} \delta(p,\sigma)$


    Part (i) of Definition 9.5 is straightforward. In part (ii), the left side, $\delta^*(q\sigma)$,
    means the set of all states you can reach from state $q$ by processing $x\sigma$,
    while the right side spells out how to find all states: first find what $x$ can
    take you to (subscript on the union operator) and then, continuing from each of
    them, find the union of the states that you can get to in one more step with $\sigma$.
    For the case in which $q$ is the initial state and $\delta^*(q,x)$ includes some
    accepting state, the machine accepts the string $x$. This leads to the definition
    of the language recognized by an NFA.


    # Definition 9.6


    The language $\mathcal{L}(M)$ recognized by an NFA $M = (Q, \Sigma, q_0, \delta,
    A)$ is the set of all strings $x \in \Sigma^*$ such that $\delta^*(q_0,x) \cap
    A \neq \emptyset$. One says that $M$ accepts the strings of $\mathcal{L}(M)$ and
    that it rejects those of its complement, $\Sigma^* \setminus \mathcal{L}(M)$.


