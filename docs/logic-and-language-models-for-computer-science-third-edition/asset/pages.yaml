  md: '# 12.4 Universal Turing Machines


    We have promised that the Turing machine is a general model of computation (Section
    12.2). The prospects for such a claim seem dubious so far, though since a general-purpose
    computer can run all kinds of software, while the TM in Example 12.3 — the only
    TM we have seen — can only one thing: determine whether each input string is in
    the language L. The goal of this section is to dispel this appearance of TM rigidity
    by presenting a design strategy for a TM that can accept input as a description
    of any other TM — much as a real computer accepts software and then carry out
    the behavior of that TM on whatever data is provided as a second input. Such a
    TM is called a Universal Turing Machine (UTM).


    If one TM is to be put into another (the UTM), then the first TM goes to have
    be expressed in terms of symbols that are allowed to appear on the tape of the
    second. In particular, if the TM uses Σ = {0, 1}, there has to be an encoding
    scheme that will represent every TM M in 0s and 1s. The encoding of a machine
    M will be denoted ⟨M. It needs to be emphasized that there is no single correct
    encoding scheme. Various schemes could be used in spirit but differ in details.
    To get a clearer understanding of encoding schemes, it''s best to look at one.


    # Example 12.4


    Give an encoding scheme for converting a given TM M = (Q, Σ, Γ, q₀, δ) into a
    binary string, ⟨M.


    The encoding of each TM element will be a string of 1s (possibly empty), with
    each string separated by a single 0. First we represent the states Q = (q₀, q₁,
    ..., qₙ) by the strings (Λ, 1, 11, 111, ..., 1ⁿ), where qᵢ corresponds to 1¹.
    Similarly we represent the symbols in the alphabet Γ = (x₀, x₁, ..., xₘ) by the
    strings (Λ, 1, 11, 111, ..., 1^ᵐ), where xᵢ corresponds to 1¹. This takes care
    of Σ, since Σ ⊆ Γ. If we Δ = x₀ then the blank symbol will be Λ = 1⁰. Finally,
    for the tape head movements {R, L} = {μ₀ μ₁} represent the move μᵢ by the string
    1¹.'
