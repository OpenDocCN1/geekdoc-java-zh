  md: '# Chapter 1


    # Mathematical Preliminaries


    This text is concerned with formal models that are important to the field of computer
    science. Because the models are formal, we will make substantial use of mathematical
    ideas. In many ways the topics in this book — logic, languages and automata —
    are a natural extension of a Discrete Mathematics course, which is generally required
    for Computer Science majors. This text steers clear of excessive mathematical
    notation, focusing instead on fundamental ideas and their application. However
    it is impossible to appreciate the power that comes from the rigorous methods
    and models in this book without a background in Discrete Mathematics. This chapter
    is a brief overview of the needed mathematical background and may be useful for
    self-evaluation, review and reference.'
  merge: -1
