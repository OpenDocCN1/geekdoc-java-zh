  md: '**Lemma 10.2** – For any CFG $G$ if $\mathcal{L}(G)$ is $\Lambda$-free there
    exists a CFG $G''$ such that $G''$ contains no erasable variables and $\mathcal{L}(G)
    = \mathcal{L}(G'')$.


    **Proof:** We give an algorithm which first computes $\mathcal{B}$, the set of
    erasable variables. Algorithm 10.2 computes $\mathcal{B}$ using this function:


    ```

    erasing(B) = {B \rightarrow \alpha \| every symbol in $\alpha$ is in $\mathcal{B}$.

    ```


    The correctness of the computation of $\mathcal{B}$ follows since any derivation
    $A \xrightarrow{*}{\Lambda}$ cannot contain a single terminal or non-erasable
    variable.


    The remainder of the computation, of $P''$, creates productions that obviate the
    need for a variable that will later be erased. It creates parallel productions
    where such variables do not appear. Note that if some production has several erasable
    variables on it is right-hand then several iterations of the second while will
    produce productions that remove these erasable variables in various combinations.
    Since $P''$ can more directly derive any string $x$ that was previously derived
    by the introduction of variable that generated no terminal symbols, the erasing
    productions are no longer needed. If there are no erasing productions there are
    no erasable variables.


    # Algorithm 10.2


    **Computing a CFG with no erasable variables**

    Input: A context-free grammar $G=(V, \Sigma, S, P)$

    Output: A CFG $G''=(V, \Sigma, S, P'')$, with no erasable variables and $\mathcal{L}(G)
    = \mathcal{L}(G'')$


    ```

    $\mathcal{B} \equiv \{B \mid B \rightarrow \Lambda \in P\}$

    while $\mathcal{B} \notin \mathcal{B} \\wedge \ |erasing(B)| > 0$ $do$

    \quad$add $B \rightarrow B$ to $\mathcal{B}$

    $P'' \leftarrow P$

    while $(B \rightarrow \alpha\beta \in P'') \\wedge \ (A \in \mathcal{B}) \\wedge
    \ (B \rightarrow \alpha\beta \notin P'')$ $do$

    \quad$add $B \rightarrow \alpha\beta$ to $P''$

    for each $B \rightarrow \Lambda \in P''$ $do$

    \quad$remove $B \rightarrow \Lambda$ from $P''$

    return $(V, \Sigma, S, P'')$

    ```'
