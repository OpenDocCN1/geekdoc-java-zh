  md: '#  8.10 Summary


    The theorems in this chapter, taken together, prove that the following statements
    are true:


    $L$ is regular iff there exists a regular expression $r$ such that $L = \mathcal{L}(r)$.


    $L$ is regular iff there exists a regular grammar $G$ such that $L = \mathcal{L}(G)$.


    $L$ is regular iff there exists a deterministic regular grammar $G$ such that
    $L = \mathcal{L}(G)$.


    The first is true since the definitions are the same, just using different notation.
    The second follows from first and Theorems 8.1 and 8.2. The third follows from
    the second and Lemma 8.4 and the deterministic regular grammar is still a regular
    grammar.


    The proofs in this chapter have a common character, which we chose to emphasize
    with the last two proofs. The theorems are all of the type “If a language exists
    relative to model A then the language also relative to model B.” Such theorems
    are usually paraphrased as “model B is as powerful as an instance of model A,
    actually showing, given an instance of model A, we can construct an equally expressive
    instance of model B. Such newly constructed instances are said to “simulate” the
    instance of model A.


    The notion of simulation is made explicit when we can prove a claim of the type
    that shows exactly how the second instance is keeping track of the behavior of
    the first instance. In the last two proofs these claims are explicit. In the earlier
    proofs we used a series of piecewise claims. This technique is well-known in the
    theory of computation and will be revisited in later chapters.'
  merge: -1
