  md: '# 9.9 Designing Finite Automata


    If the problem is given to build a FA for the language of all strings having a
    certain property, then no general technique can be expected. Occasionally, as
    in the pattern matching section, if the property is quite specific and simple
    then a special-purpose technique may be possible. However, there are several general
    observations we want to make in this section.


    First, a property is simply a logical predicate $p(x)$ of a string x; it is true
    or false that $x$ belongs to the language defined by that property. Suppose $p(x)$
    is complex but can be decomposed as $p(x) = q(x) \lor r(x)$, then the language
    is the union of the two languages corresponding to the predicates $q(x)$ and $r(x)$.
    The constructive proof of the closure property of union allows you to build the
    desired machine mechanically from two simpler machine. Similar remarks hold for
    intersection, complementation and other operators with closure properties.


    Second, implicit in the proof in Section 9.7 is the following principle: You need
    one state for each memory you need to encode the alphabet. Recall since we do
    not rewind our input that *everything* is remembered about the portion of the
    string that has been processed is remembered solely by virtue of being in one
    state, rather than another. Turning around, when building an FA you should create
    each new state only when you can specify what memory of the past does arrival
    at that state


    Third, there is more than one FA for any language. There is an urge to find the
    FA that has the fewest state. If you followed the advice in the preceding paragraph
    you will probably not generate excess states. But what if you do? In this textbook
    the focus is entirely on correctness and extra states are a minor issue. However
    in some applications there is an economic incentive to have no extra states. In
    those cases you could use the state minimization algorithm, given at the end Section
    9.7, that will transform a machine with extra states into an equivalent machine
    with the minimum number of states.


    Finally, a powerful design technique is to begin your building process with a
    nondeterministic formulation and convert it into a deterministic FA.'
