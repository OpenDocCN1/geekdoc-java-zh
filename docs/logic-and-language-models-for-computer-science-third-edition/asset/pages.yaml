  md: '# 1.5 Strings and String Operators


    It is commonplace in discussions of computer programming to say that “HELLO” is
    a “string” or a “string of 5 characters.” Formally we would say it is a sequence
    of characters, of length 5, and would denote it as a 5-tuple: (H,E,L,L,O). Since
    such sequences are used so extensively in computer science, we adopt a more concise
    and natural approach.


    A string is a finite sequence of elements. The elements are typically called symbols
    (or characters) and the set of all symbols under consideration in any example
    or situation is denoted Σ. The set Σ is usually called an alphabet, especially
    when each symbol is a single letter (even but in other cases). Just as the empty
    set is a set with no elements, it is convenient to define the empty string to
    be a string with no characters; we call it Λ. Thus if the alphabet is Σ = {a,
    b, c} the following are examples of “strings over the alphabet Σ”:


    Λ, ab, bbc, abacab


    The principal operator for strings is concatenation. The concatenation of strings
    x and y, simply denoted xy, is a string comprised of the characters of x followed
    by abcab. Each x or y could be the empty string; if x = ab and y = bca then xy
    = abca and then xy = ab. In general, concatenation is not a commutative operation,
    so we cannot expect xy = yx. However, concatenation is an associative operation
    so when we extend concatenations to three or more strings we can write the expression
    without parentheses: (xy)z = x(yz). A prefix consists of consecutive characters
    at the beginning of a string, so ab is a prefix of abcbb and x is always a prefix
    of xy.


    The length of the string x, the number of characters in it, is denoted |x| (the
    same notation used for the cardinality of a set). For example, |ab| = 2 and |abc|
    = 6. The empty string has zero length, so |Λ| = 0. Recall that by definition a
    string is finite so |x| is always an integer. Finally, note that |xy| = |x| +
    |y|.


    Sets of strings are studied extensively in this text. We use the language to refer
    to a set of strings. For example, L = {ab, bbc, abcab} is a language of three
    strings, |L| = 3. It is important to remember, that a language may contain an
    infinite number of strings, each string in the language is finite.'
