  md: 'This was first proved by Kurt Gödel in 1929. This theorem is paraphrased as
    saying the system of propositional logic in these chapters is “sound and complete.”
    We say the system is *sound* because $\vdash \alpha \implies \alpha$; if you can
    prove something it must be true. We say the system is *complete* because $\alpha
    \alpha \ \alpha$; if something is true then it can be proven using natural deduction.
    The proof relies heavily on the fact that our rules of inference are themselves
    sound. Natural deduction, as a system, does not care that the rules are sound.
    However, by choosing only sound rules, we enabled Theorem 3.1 to be proven.


    We Relied on the natural deduction system of proof. It is fair game to ask whether
    there are yet other proof methods? Indeed there are others but they are equally
    powerful with respect to soundness and completeness. Another approach, which we
    will not discuss further, is the method of semantic tableaux, which focuses on
    whether an expression is satisfiable (see Section 2.3). It is used to prove that
    the negation of some expression of interest *must* be FALSE, that is, that it
    is *unsatisfiable*. The method has the effect of putting an expression into disjunctive
    normal form (see Section 2.5). Then one looks at each of the disjuncts to see
    if it includes a pair of mutually contradictory literals, such as $p$ and $

    eg p$. The expression is unsatisfiable if and only if every of the disjuncts does
    include such a pair.'
