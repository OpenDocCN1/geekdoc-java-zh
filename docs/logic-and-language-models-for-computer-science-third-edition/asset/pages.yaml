  md: 'There is one infinite language that we repeatedly. For a given Σ there is an
    infinite language, Σ*, associated with it:


    Σ* is the language consisting of all possible strings over the symbol set Σ.


    For example, {a, b}* represents all strings over the specific symbol set Σ = {a,
    b}. There is a list of them in order of increasing length.


    {a, b}* = {Λ, a, b, aa, ab, ba, aaa, aab, abb, baa, ... }


    Any language over {a, b} is a subset of {a, b}*. We will typically use letters
    near the end of the alphabet, like x and y, to stand for strings. We might have,
    for example, x = abba, in which case x ∈ {a, b}*. It is now possible to restate
    the contents of Example 7.3 using set notation as follows.


    # Example 7.5


    {Λ, a, b, aa, ab, ba, bb} = {x | x ∈ {a, b}* ∧ |x| ≤ 2}.


    Since a language is a set of strings, like any set, we can represent it using
    extensional or intensional formats. Consider the language in Example 7.5; call
    it L. At this point, we have seen three different ways to represent L, written
    below as (i)-(iii). The first is an explicit list of elements, the extensional
    format. This format can only be used for small finite sets, otherwise we must
    use an ellipsis and sacrifice a rigorous definition. By contrast, (ii) and (iii)
    are intensional specifications of the same language. The first, (ii), is a loose
    description in English, while the other, (iii), uses standard terminology of formal
    languages, sets, logic and arithmetic. Increasingly, we will be using this last
    kind of specification, because it is compact, precise and versatile.


    +   (i) L = {Λ, a, b, aa, ab, ba, bb}.

    (ii) L = the set of strings over {a, b}, of length no more than two.

    (iii) L = {x | x ∈ {a, b}* ∧ |x| ≤ 2}'
