  md: "# 3.4 Proof by Rules\n\nThe simplest proof is nothing more than a list of assertions\
    \ each of which the reader agrees is true. The last assertion on the list being\
    \ the theorem that is being proven. Each assertion can be annotated with the reason\
    \ the reader has agreed to it; typically because of an inference rule.\n\nIf the\
    \ reader agrees to a and from which $\beta$ can be proven using rules of inference\
    \ then we write:\n\n```\n$\\alpha \\vdash \\beta$\n```\n\nwhich is called a sequent.\
    \ A statement that a proof exists in which the first line is $\\alpha$ and the\
    \ last line is $\beta$. If the proof actually exists we say the sequent is valid.\
    \ Since the reader agrees to allow $a$ as the first line, it is axiomatic — taken\
    \ as without proof.^3$\n\n# Example 3.3\n\nThis is inspired by the subsumption\
