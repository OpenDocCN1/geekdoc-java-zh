    \ subset of their cross-product, $R \\subseteq S_1 \times S_2 \times S_3$, and\
    \ similarly for $n$-ary relations.\n\nThe above statement that a function maps\
    \ one to another, $R: E \rightarrow P$, is more flexible than it may seem. That\
    \ is because the set $E$ (or $P$ for that matter) may be a cross-product set.\
    \ For example, consider a chart, $G$, of gross national product with countries\
    \ and years as the rows and columns. With $C$ as the set of countries and $N$\
    \ as the set of integers (for years and dollars) we can write:\n\n$G: C \times\
    \ N \rightarrow N$$\n\nwhere $G$ is a function that maps countries and years into\
    \ dollars. We use the familiar binary function notation $R(x, y)$ when the domain\
    \ is a cross-product. Similarly $n$-ary functions have a domain of $n$-tuples."
