    \ expression $\beta$ below it, we need only prove $\\alpha \\rightarrow \\beta$\
    \ is a tautology. Similarly if $\\alpha_1 \\wedge \\alpha_2 \\rightarrow \\beta$\
    \ is a tautology we justify the inference rule with $\\alpha_1$ and $\\alpha_2$\
    \ above the bar and $\beta$ below. In general, there can be any number $n$ of\
    \ items above the bar, provided that we can prove the proposition $\\alpha_1 \\\
    wedge \\alpha_2 \\dots \\wedge \\alpha_n \\rightarrow \\beta$ is a tautology.\
    \ The corresponding proposition is a tautology we say the rule is *sound*. If\
