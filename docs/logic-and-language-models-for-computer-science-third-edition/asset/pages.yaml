    $p(0)\np(0) \rightarrow p(1)\np(1) \rightarrow p(2)\np(2) \rightarrow p(3)\n\:\np(n)
    \rightarrow p(n+1)\n\:$

    ```


    From the first two lines, modus ponens allows us to infer $p(1)$. From $p(1)$
    and the third line, modus ponens lets us infer $p(2)$. Then we can infer $p(3)$,
    and so on, to any $p(n)$. Thus, starting with the base case, repeated appeals
    to the inductive step with modus ponens justifies all these arrows, for any positive
    integer $n$.


    ```

    $p(0) \rightarrow p(1) \rightarrow p(2) \rightarrow p(3) \\cdots \rightarrow p(n)$

    ```


    Having introduced the general idea of mathematical induction, we now move on to
    showing how it can be used. You will notice that nothing we have said tells you
    *what* to prove, how to choose $p$. MI is only a method of proof. Such theorems,
    we will see, involve loops in programs, recursive functions in programs, recursive
    definitions, universal quantification $(\forall)$, summations $(\Sigma)$ and products
    $(n)$. MI is useful even when $\mathcal{N}$ is not explicitly mentioned, it is
    often tacit in the statement of theorems.


    # Example 5.4


    Show that, for any nonnegative integer $n$, the sum of the first $n$ integers
    is $n(n+1)/2$. That is, prove the propositions $p(n)$ is true for all $n \geq
    0$, where $p(n)$ is the following statement:


    ```

    $$\sum_{i=1}^{n} i = \frac{n(n+1)}{2}$

    ```'
