    for each successive $0$ in the input. The pseudocode pushes $0$s on stack instead
    of $X$. Since symbols from $\Sigma$ can also be in $\Gamma$ our PDA could do.
    We have elected to push $X$s just to emphasize that $\Gamma$ allows us to use
    new, possibly more general symbols.


    When the first 1 arrives we transition to the rightmost state while popping off
    one $X$ symbol. Thereafter $M$ pushes $X$s for each 1 on the input. If the last
    input input symbol results in an empty stack then the input is accepted. Note
    that the machine has no way of detecting that the input is exhausted, nor does
    it detect an empty stack.


    It is easy to see even though we are using the stack memory to serve as a counter,
    we continue to use the states as a memory mechanism just as any FA. With the states
    we insure the input is of the form $0^*1^j$, and with the stack we insure $i =
    j$.


