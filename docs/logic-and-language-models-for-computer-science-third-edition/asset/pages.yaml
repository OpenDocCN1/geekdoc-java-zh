  md: '# 9.8 Pattern Matching


    Pattern matching is an important application. Web searching is just one example
    of the need for techniques for finding occurrences of patterns in text. Pattern
    matching algorithms are a well-studied topic. What is interesting is that some
    of the best known algorithms are based on finite automata! The whole story is
    beyond the scope of this book, but we will introduce the connection. This will
    also give us some practice designing FAs.


    The standard pattern matching problem begins with two strings: the pattern $P
    = p_1p_2 \dots p_m$ and the text $T = t_1t_2 \dots t_n$. The simplest goal is
    to find an occurrence of $P$ in $T$, typically the first occurrence. For example,
    if $P = aaba$ and $T = baababab$ then first (and only) occurrence of $P$ in $T$
    at the 6th character of $T$, $P = t_6t_7t_8t_9$.


    What is the connection with FAs? Suppose we designed an FA $M$ to accept the language


    > $L(P) = \{x \mid x \text{ contains the string } P\}$


    When processing the input we know that $M$ must enter an accepting state when
    it has just finished the first occurrence of $P$ and thereafter it must remaining
    in some accepting state or other. In other words $M$ essentially solves the pattern
    matching problem when given $T$ as input. Further $M$ provides an efficient way
    to search for $P$; it processes the characters of $T$ very quickly. The main problem
    is how we get the FA $M?


    We will use the example of $P = ababb$ to motivate an approach. An FA looking
    for $P$ does not know, when it sees an $a$ in an input, if that $a$ is the beginning
    of an occurrence of $P$ or not. So when it (first) encounters an $a$ it must go
    to a state that corresponds to the fact that has seen the first character of $P$.
    Now if we are in this new state and encounter a $b$ we can go to another state
    that corresponds to the fact we have just encountered the first two characters
    of $P$. Continuing in this fashion we can motivate the set of states $\{q_0, q_1,
    \dots, q_m\}$, where reaching $q_i$ corresponds to the fact that we have just
    encountered the first $i$ characters of $P$. We introduce the state $q_0$ to correspond
    to the fact that no progress towards forming $P$ has been made up to this point.'
