  md: 'because the mapping explicitly shows how we “count” the elements; every element
    is eventually reached and counted. Are sets with so many elements that they have
    more elements than $\mathcal{N}$? The answer is “yes.” Moreover — and equally
    important here — the set of all languages over an alphabet is uncountable.


    First consider the idea of an infinite string. Recall that by definition a “string”
    is composed of a finite number of symbols, so let us define a new term $\omega$-string
    for strings with a countably infinite number of symbols. The occurrences of symbols
    of an $\omega$-string can be put in one-to-one correspondence with the elements
    of $\mathcal{N}$; we can speak of the $ith$ symbol in an $\omega$-string. An example
    of an $\omega$-string is the decimal representation of an irrational real number,
    such as $\pi = 3.1415926535899...$


    Recall that in an infinite language, even though there is no limit on how long
    a string can be, each string must be finite. So no language we have so far — even
    most of them have been infinite — has contained an $\omega$-string. So not to
    disturb this terminology, we will say “sets of $\omega$-strings” when that is
    what we mean, and not call them languages. In particular, $\mathcal{W}$ is the
    set of all $\omega$-strings over the alphabet $\{0, 1\}$. Although the remainder
    of this section uses only this alphabet, the results can be generalized to any
    alphabet with more than one symbol.


    A finite binary string can be regarded as the binary representation of an integer;
    in this sense every language we have discussed is and therefore a subset of $\mathcal{N}$
    (ignoring the empty string for the present argument). As with $\mathcal{E}$ above,
    every infinite subset of $\mathcal{N}$ is countable, so it follows that every
    infinite language is composed of a countably infinite number of (finite) strings.


    We will want to build an $\omega$-string $v_L$ from a given language $L$. Let
    the $ith$ symbol of $v_L$ be 1 if the string corresponds to the integer $i$ is
    in $L$; otherwise the $ith$ symbol is a 0. Each $v_L \in \mathcal{W}$. Also every
    element of $\mathcal{W}$ is some $L$; if $L$ is finite then there will only be
    a finite number of 1 symbols in $v_L$. It is immediately apparent that there is
    a one-to-one correspondence between languages over the binary alphabet and $\mathcal{W}$.


    **Theorem 12.1** – If $|Sigma| \ge 2$, the set of all languages over $\Sigma$
    is uncountable.'
