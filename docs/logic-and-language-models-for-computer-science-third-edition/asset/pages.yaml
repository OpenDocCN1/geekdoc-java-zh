  md: "# 8.2 Nondeterminism: The General Idea\n\nThe good news about nondeterminism\
    \ is that it is a powerful concept that enables us to simplify the way we represent\
    \ some computations. The not-good news is that the idea itself can be a bit puzzling.\
    \ In this section we introduce the notion of nondeterminism using further examples\
    \ of pseudo-code. We use pseudo-code to ease into the topic; the pseudo-code will\
    \ soon be replaced with other models.\n\n# Example 8.4\n\nLet us start with a\
    \ deterministic solution to a simple problem. Let J be a finite set of integers\
    \ and let t be a “target” integer. This pseudocode decides if exactly 3 integers\
    \ drawn from J add up to t. The summands not be distinct.\n\n```\nfor each a ∈\
    \ J do\n  for each b ∈ J do\n    for each c ∈ J do\n      if a + b + c = t then\
    \ succeed\nfail\n```\n\nThis code is simple and exhaustive.\n\nWe explicitly introduce\
    \ the radical idea of an algorithm making choices. We do this by allowing this\
    \ type of statement:\n\n```\nchoose x ∈ S.\n```\n\nThis next example shows that\
    \ this type of statement does not make choices deterministically.\n\n# Example\
    \ 8.5\n\nWe revisit the previous example. Here is a nondeterministic solution\
    \ to the problem:"
