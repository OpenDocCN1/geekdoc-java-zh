  md: '# 11.7 A Variation of the Pushdown Automata Model


    A principal variation in the definition of PDAs in the literature is between the
    PDAs we have defined, which “recognize by empty stack, ” and PDA models that “recognize
    by accepting states.” After all FAs use accepting states. Indeed we can define
    a PDA model that uses accepting states. Regardless of how recognition is decided,
    the models remain fundamentally nondeterministic, with determinism as the exception.
    In this section only we call the old and new models PDA-E and PDA-A respectively.


    We will not give a formal definition of the PDA-A model, since it is completely
    analogous with how NFAs recognize inputs with accepting states. There is an interesting
    consequence of this change. The PDA-E machines could only be used for $\Lambda$-free
    languages. However a PDA-A machine will not require the languages to be $\Lambda$-free.
    This is a small change theoretically but for somebody building a PDA it makes
    things more natural, since the empty string is often the expected base case in
    a recursive definition.


    The reason we chose to use the PDA-E model is because our focus is on theoretical
    issues. The proofs we have given are much simpler than the corresponding proofs
    with the PDA-A model. There is an ineffable sense in which the ideas behind the
    proofs are tied to the PDA-E model.'
