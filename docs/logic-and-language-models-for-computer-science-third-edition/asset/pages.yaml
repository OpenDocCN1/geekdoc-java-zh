  md: '# 9.1 Finite Automata: The General Idea


    An automaton is a specification for a symbol processing machine. It differs from
    the real-life machines in at least three important ways. First, it is only a specification,
    something we design but do not expect to build. Second, it operates on symbols,
    mathematical objects with no properties. Finally, it has a relatively simple internal
    structure allowing us to prove statements. In later chapters we will see more
    powerful formulations but in this chapter we will focus on the simplest finite
    automaton.


    Informally, we can think of an automaton for any language L as a “black box.”
    As input, such a box can be given any string x over the alphabet of its language.
    The input will be processed every symbol by one, from left to right, with no ability
    to return to earlier symbols; i.e., streaming input. For output purposes it has
    something like a green light that is on or off only when the portion of the string
    processed so far is a string in L. Consequently, the light may go on and off whenever
    the x user understands that it recognizes (the strings of) L, even though the
    automaton itself is unaware of the string ends. The mechanism of a black box can
    be quite complicated but for finite automata the internal mechanism is remarkably
    simple.


    As an automaton executes, various changes occur in its internal configuration.
    Each possible internal configuration is called a state. We do not ask about the
    details of the internal machinery that make state give names (like A, B, ... or
    q₀, q₁, ... ) to the different states. The states can be regarded as a kind of
    internal memory for an automaton, inasmuch as it knows what state it is. A finite
    automaton (FA) has a number of states and moreover has no other form of memory.
    Hence an FA can only remember a finite number of things and this finiteness places
    some limits on what it can do. (In later chapters, we will look at two other kinds
    of automata automata and Turing Machines — that have state memory along with additional
    forms of memory.)


    We begin by illustrating the operation of a finite automaton with a simple diagram,
    called a state transition diagram. Then the formal notation of finite automata
    is introduced to provide a rigorous way of talking about diagrams. With this notation
    in hand, it is easy to write a short'
