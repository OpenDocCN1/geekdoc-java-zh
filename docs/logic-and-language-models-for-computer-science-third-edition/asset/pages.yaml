  md: '# Appendix A


    # Logic Programming


    A good way to appreciate the precision and power of predicate calculus as a system
    for representing ideas is to watch it in action as the basis of a **logic programming
    language**, such as Prolog. This appendix focuses on parts of Prolog inspired
    by logic, but also touches on some other capabilities, like data structures, arithmetic
    and input/output, that are needed for practical programming.


    Prolog lets you make assertions in predicate logic. These can be particular facts
    about individual objects, or general statements about relationships among concepts.
    Then you can pose questions to the Prolog processor and it will provide answers
    on the basis of what it can figure out or infer from what you have asserted. It
    does so by a **deductive inference** procedure consistent with what you have learned
    about predicate calculus. We will touch lightly on how this process is carried
    out.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# A.1 The Essence of Prolog and its Relation to Logic


    Three unusual and significant characteristics of Prolog are its relationship to
    logic, its **interactive style** and its **declarative nature**. Though distinct,
    the three properties are related in a way that makes Prolog a powerful tool for
    rapid prototyping. That is, they can help a Prolog programmer to get a working
    initial version of a program that represents concepts.


    A Prolog interaction begins with a question—called a **query**—typed in the user.
    This might be an end-user but we envision a developer testing a piece of a new
    program. Then Prolog (strictly speaking, the Prolog interpreter) provides an answer
    to the query on the basis of some code that has been loaded for testing. This
    is a particularly convenient approach to informal testing.


    Moreover, the code itself is simple in appearance because of its logical and declarative
    nature. Prolog is a declarative language in that you just state—or **assert**—what
    you know, in a form equivalent to expressions of predicate logic. In the old imperative
    languages like Fortran and C, it is necessary to write many procedures to get
    things done. This is true even for languages like C++ that support some object-oriented
    techniques. In contrast, a Prolog program does not need to specify the procedure
    that puts its facts and rules to use. Instead, the Prolog processor supplies an
    **inferencer**, that is, for carrying out logical inference.(The programmer does
    exert some control over procedure by specifying rule ordering and by some advanced
    techniques.) The programmer, relieved of the need to write a procedure, can then
    focus on the concepts in the subject matter of the application.


    Now let''s have a look at the language itself. The assertions you can make in
    Prolog are of two varieties, **facts** and **rules**. Facts describe the properties
    of particular objects—which may be things, people, institutions, etc.—and the
    relationships between/among those objects. Rules apply more broadly and are used
    to infer new information. Consider an example with both facts and rules.


    # Example A.1


    Here are three facts about specific individuals and two rules about family'
  merge: -1
