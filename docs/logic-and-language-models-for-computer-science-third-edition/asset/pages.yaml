    E ⇒ E + E ⇒ E + E ⇒ E ⇒ a + E + E ⇒ a + b + c

    and the right tree corresponds to this leftmost derivation of the same string:


    E ⇒ E + E ⇒ a + E ⇒ a + E + E ⇒ a + b + c


