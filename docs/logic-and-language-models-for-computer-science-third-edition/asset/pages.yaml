  md: '# 7.3 Language Operators


    As noted, languages can be specified extensionally, intentionally and by description.
    It is also possible, and indeed useful, to be able to build up new languages in
    terms of existing ones by making use of various operations on languages. First,
    because languages are sets (of strings), they can undergo all of the usual set
    operations. Given two languages, $L_1$ and $L_2$, one can form their intersection
    $(L_1 \cap L_2)$, union $(L_1 \cup L_2)$, and set difference $(L_1 \setminus L_2)$.
    Each language $L$ has a complement $\overline{L} = \Sigma^* \setminus L$ with
    respect to the universe of all possible strings over its alphabet. Speaking of
    sets, not just as there is an empty set, the empty set, written $\emptyset$ as
    usual. It is important to distinguish between the empty language, $\emptyset$
    and the empty string, $\Lambda$.


    # Example 7.6


    $\emptyset$ is the empty language. It has no strings. The language $\{\Lambda\}$
    has one string, though that string is the empty string, having length 0. The language
    $\{\Lambda, a, aa\}$ has three strings, of lengths 0, 1 and 2.


    Another operation on languages, besides the set operations, is concatenation of
    languages, which is based on concatenation of strings, introduced in Section 1.5.
    Remember that, for example, the concatenation of $a$ and $b$ is $ab$; the concatenation
    of $ab$ and $edc$ is $abdec$. The order in which strings are concatenated can
    be (and usually is) significant, and concatenation is not commutative.


    # Definition 7.1


    Concatenation of strings.


    If $x$ and $y$ are strings, $xy$ is the concatenation of $x$ and $y$. Occasionally
    we will need a symbol for concatenation. We will use $\cdot$, so $x \cdot y$ is
    the same as $xy$. For any string $x$, we have $x\Lambda = x = \Lambda x$; the
    empty string is the identity element for concatenation. The concatenation of $x$
    with $x$ is $xx$, denoted as $x^2$, and concatenating $x$ with $x^k$ gives $x^{k+1}$.
    Also, $x^0 = \Lambda$ for any $x$.'
