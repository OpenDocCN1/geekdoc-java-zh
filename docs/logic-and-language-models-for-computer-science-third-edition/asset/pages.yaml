  md: 'You should observe that input seen so far concatenated with the current stack
    is exactly the currently derived string. This follows directly from the Claim
    in the proof of Theorem 11.1. Therefore we can say that as the PDA accepts any
    x it exhibits the derivation of x.


    However this is very unsatisfying since the parsing is done by a nondeterministic
    machine. While this is theoretically interesting the problem of parsing is a very
    practical problem. Parsing is the basic process in any approach to exploring the
    *semantics* of the strings generated by a grammar. Why do we parse English sentences
    in high school? Because that is how we analyze the structure and meaning (i.e.
    the relationship of the constituent parts) of a sentence. (Natural language grammars
    have inspired context-free grammars, but do not be misled; natural language grammars
    are far more subtle than the grammars in this chapter.)


    There are many applications familiar to computer scientists that involving parsing.
    especially computer programming languages — that are typically defined with context-free
    grammars. The prototypical application is the design of compilers for artificial
    languages. The material in this chapter is a preamble to the PDA-based parsing
    techniques discussed in every textbook for compiler theory.


    If the parsing is so important how can we tolerate nondeterministic solutions?
    Surely there are deterministic solutions! Unfortunately the situation is: yes
    and no. There are context-free languages for which we will escape the NPDA approach.
    However there will be context-free languages for which deterministic parsing with
    a PDA is impossible. These are the subjects of the next three sections.'
