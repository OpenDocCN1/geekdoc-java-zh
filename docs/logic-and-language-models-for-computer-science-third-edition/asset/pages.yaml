- img_proc: true
  md: 'relationships in general.


    ```

    parent(mary, john).

    parent(ann, mary).

    female(mary).

    mother(X,Y) :- parent(X,Y), female(X).

    grandparent(X,Z) :- parent(X,Y), parent(Y,Z).

    ```


    The first fact is intended to mean that someone named Mary is a parent of someone
    named John, and the third that Mary is female. These two facts together with the
    rule for mother will allow Prolog to tell us — when we ask it — that Mary is the
    mother of John. Of course, as in other programming languages, the use of English
    words to name the symbols has no significance in Prolog, though it may be helpful
    to human beings who read your program. Thus the constant symbol mary an represent
    someone named Ma Ry, or for matter, John. When typing Prolog facts and rules,
    be sure to avoid blanks between the predicate and the left parenthesis; blanks
    are ok elsewhere.


    Each fact in Example A.1 consists of a predicate with suitable arguments. This
    notation is like that predicate logic except there must be a period (“.”) at the
    end. Prolog rules are also directly related to predicate logic, but the notation
    disguises relationship a bit more than in the case of facts. First, variables
    like x, y and z here are, capital letters (or begin with a capital), predicates,
    like parent, and constants, like mary, begin with lower case letters. Prolog’s
    operator symbols differ considerably from those in logic. The symbol “:-” means
    implication, from right to left, opposite to the direction for predicate logic.
    You might think of it as a backward implication with a “-” symbol. Also, you can
    read “:-” as the English word “if.” Each of the above rules has two propositions
    to the right of the “:-”, separated in each case by a comma. The comma can be
    read as “and” and it corresponds to “∧” in logic. Later we will use a semi-colon—read
    as “or”—to correspond to “∨” (in a restricted way).


    Another way in which Prolog concepts resemble those of predicate logic but differ
    in notation is that each rule in Prolog is understood to begin with universal
    quantifiers on all of its parameters. Using the second rule in Example A.1 above
    as an example, we can reverse the implication and put in the quantifiers and ∧
    sign to get the corresponding statement in predicate logic:'
