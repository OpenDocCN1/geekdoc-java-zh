  md: '# 8.5 Regular Expressions and Nondeterminism


    Regular expressions are, by definition, a notation for defining sets of strings,
    that is languages. But as we discussed in Section 8.1 these recursive definitions
    can be turned around and be regarded as building processes. In fact we want to
    present the idea that an an RE is nondeterministic “code” for generating strings!
    This section can be skipped. It is meant only to broaden your scope, to see something
    in a different way.


    To “execute” the code r we have to return to the recursive definition. Here we
    do not allow the RE to include a r^2 Any r is either a base case or is built from
    smaller REs. If r is a base case we define the execution(s) this way:


    ```

    if r = a this means print a

    execute r

    if r = A this means print A

    ```


    For the more general cases we have recursive executions of subexpressions


    ```

    if r = r1 + r2 this means choose i ∈ {1, 2}

    execute r_i

    ```


    ```

    if r = r1r2 this means execute r_1

    execute r\execute r_2

    ```


    ```

    if r = r* this means choose k ∈ N

    repeat k times do execute r

    ```


    It is assumed that the symbols “printed” will be concatenated to the end of a
    single output string, which is initially Λ. If nothing is printed then the resulting
    string will be Λ. If a Λ is printed it will be undetectable, since it does not
    alter the output.


    The main point of this section is that if we regard an RE as code for generating
    strings then it is nondeterministic code. Our comments about nondeterminism still
    apply here. In particular, regardless of what choices are made, the code r will
    always generate an x that x ∈ L(r). Furthermore, for any x ∈ L(r), r can make
    choices so that it will generate x.'
