    # Example 8.11


    Find an RE that is simpler than (a*b*)* but represents the same language.


    Example 8.9 shows that L(a*b*) is a superset of L(a + b). Taking the closure of
    each, it follows that L((a*b*)*) must surely contain everything in L((a + b)*).
    It can not contain more, since L((a*b*)*) contains everything over the two letter
    alphabet. So L((a*b*)*) = L(a + b)*. Getting back to the original question: to
    simplify (a*b*)*, write (a + b)*.


