    continuation of the derivation:


    ```

    WAABBCCZ ⇒ aABB ⇒ aaWBBCCZ ⇒ aabXBCCZ

    ⇒ aabbXCCZ ⇒ aabbYCZ ⇒ aabbccYZ ⇒ aabbcc

    ```


    This illustrates how the grammar dictates the behavior of the derivation. In particular,
    the W symbol sweeps across the As (and only As) leaving as behind. When the W
    reaches a B it changes to an X which then sweeps across Bs (and only Bs) leaving
    bs in its wake. Finally, the X becomes a Y which changes the Cs it encounters
    into cs. In other words, in order for a Y the grammar forces any valid derivation
    to begin with the sorting process. In this way the grammar forces any string derived
    with G is in L.




    The above example illustrates how much more powerful an unrestricted grammar is
    than a context-free grammar. The grammar above has a distinct algorithmic flavor.
    It forces three phases: a building phase, a sorting phase, and then a checking
    phase. There are mechanisms which can force certain productions to be applied
    before others. Although checking can begin before sorting is completed (or building
    is completed for that matter), no part of a string can be checked until it is
    sorted.


    Given the above grammar, with its algorithmic flavor, it is perhaps not surprising
    that we will next propose a machine model with mechanisms that allow local changes
    in a string and the ability to sweep back and forth across a string.'
