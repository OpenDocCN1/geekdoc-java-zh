    we can say using G we have S → xA, for any A ∈ A. Since for every C ∈ VB we know
    A → bC for some A ∈ A we know that G the next step xA = xbC is valid for any C
    ∈ B. The claim follows.


    The claim shows that derivations with the two grammars are synchronized as long
    as there are no erasing productions used. To complete the proof of the theorem
    we observe the second half of the definition of P'' ensures that derivation with
