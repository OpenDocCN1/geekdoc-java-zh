    and biconditional operators. Hardware designers use others with names: XOR, NAND,
    and NOR.) Each symbol in Figure 2.4 is a standard representation of a subcircuit
    that computes a Boolean operator. How those individual subcircuits are built is
    technology-dependent, but the symbols remain the same. The subcircuits are called
    "gates".


    The understanding is that for, an OR-gate that two boolean inputs enter from the
    left, $p$ and $q$, and the outputs on the right being equal to $p \vee q$. Similarly
    for AND-gates and NOT-gates. A proposition is implemented by cascading the inputs
    through a series of gates — the output of one gate being the input to the next
    gate — until the value of the proposition spills out on the right as the "output."


