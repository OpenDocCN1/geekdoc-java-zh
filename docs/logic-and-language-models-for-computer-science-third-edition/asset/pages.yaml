    But how do you choose each summand? And if you choose the wrong ones? While these
    seem like reasonable questions we will not answer them. Instead we will say that
    there is no “how” behind the choice. And there is no “wrong” choice, in the sense
    of a mistake. We merely assert that there are three integers then this will succeed
    and it will only fail if three such integers cannot be found. In other words,
    if the three numbers can be chosen then we assume they will be chosen and it will
    succeed. If there is more than one way to three such integers any of those would
    lead to success and there is no way to tell which one.


    Notice, the process described by the pseudocode has the somewhat mystical ability
    to make choices that will turn out, in combination, to give a correct answer if
    it is at all possible to do so. This is the key idea of nondeterminism. Since
    it seems completely unrealistic, what, you may ask, is the value of discussing
    it?


    A nondeterministic approach should be regarded as a bare-bones description of
    what is being accomplished, but omits details of how it is carried out. In fact,
    the nondeterministic approach can actually be implemented in totally realistic
    ways, but since they lack the magic described above — they are more complex and
    require more resources. We will describe two implementations in the context of
    our numerical problem: parallel computation and backtracking.


    The parallel computation approach assumes that as many parallel processors (multiple
    CPUs) as we need. Let j = |J|. One processor is responsible for exploring each
    first number in a word, j processors in all. Each of these processors will use
    j additional processors to explore the various second sections. And each of these
    will use j processors to try out different letters, for a total of j + j² + j³
    processors! If any of the third tier processors finds a sum of t then the entire
    computational effort stops successfully (even if other ways could also be found
    — it does not matter who wins such ties); if no sum is found by any processor
    the entire computational effort fails.


