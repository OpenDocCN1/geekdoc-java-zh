  md: '# Appendix B


    # The AWK Language


    Having learned something about regular expressions, you are ready for AWK. AWK
    is a powerful software tool that uses regular expressions to simplify programming
    for some applications. The language was name for its inventors Aho, Weinberger,
    and Kernighan. It is the precursor to Perl, but where Perl has become large (due
    to “feature creep”), AWK has remained small. Its relative simplicity is what makes
    it suitable for us. We will study AWK because of its use of regular expressions
    to ease the programmer’s job for certain problems.


    AWK is a data-driven language in that the actions that are taken, over time, depend
    on the input stream; actions are selected by the input. However, the actions themselves
    are implemented in a familiar procedural style. (AWK is arguably the first scripting
    language, a language that can be used to program the flow of control of several
    tasks. However in this chapter we will not explore the advanced features that
    allows AWK to write scripts.)


    This is not a complete discussion of AWK’s features, but it is self-contained.'
  merge: -1
  pgno: 398
- img_proc: true
  md: '# B.1 Overview of AWK


    AWK is a Unix tool and as is standard for such tools, it reads from standard input
    and writes to standard output. If a file name is given on the command line then
    the input is read from that file instead. A file consists of consecutive records
    and awk operates on one record at a time. A record consists of consecutive fields,
    separated by field separators. By default a field separator is “white space”,
    a sequence of spaces and/or tabs (though a field separator can be redefined to
    be other characters, such as colons):


    An awk program is a sequence of rules. Each rule is


    ```

    pattern {action}

    ```


    and rules appear on separate lines. The braces are part of the syntax. While pattern
    is the standard term, “selector” might be more descriptive. The pattern is used
    to select records from the input file and then apply the corresponding action
    to each record. It is possible to omit the pattern or the action (along with braces),
    but not both. If there is no pattern given then every record will be selected.
    If there is no action given the default action of printing the current record
    will be performed.


    A pattern is often a regular expression. A regular expression corresponds to a
    set of strings and such a pattern is said to match a record if any in that set
    of strings appears within the record. However “pattern” can contain other tests
    for selecting a record, or boolean expressions involving numerical operators and
    string expressions.


    An action is a sequence of statements. The syntax of the statements is described
    below. It is a very simple syntax similar to C, C++, Java and related languages.
    Comments are indicated by a # and the comment continues to the end of the line.
    (A # in a regular expression does not start a comment.)


    The basic idea of awk code is simple. The file is read one record at a time. For
    each record every rule is invoked by a rule’s pattern the corresponding action
    is performed using the current record. The same record can be selected by several
    rules; their corresponding actions will be done in the order they appear in the
    program.'
  merge: -1
  pgno: 399
- img_proc: true
  md: An `awk` program is often very short. Indeed many useful programs can be written
    in one line. We can always enter our `awk` programs as a text file. However, when
    the program is short, and when it is only going to be used once, `awk` allows
    the user to type the program directly into the command line! The latter option
    is called a “one-shot” program, and will be illustrated below.
