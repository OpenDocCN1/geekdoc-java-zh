  md: '# 10.1 Introduction to Context-Free Grammars


    Context-free grammars (CFGs) are an important formalism for representing both
    programming languages and human languages. Since we have been introduced to the
    general idea of grammars when we introduced regular grammars this new type of
    grammar is easily defined.


    # Definition 10.1


    Context-free grammar $G$ is a quadruple, $(V, \Sigma, S, P)$, where


    +   V a finite set of nonterminal symbols (also called variables);

    $\Sigma$ a finite alphabet of terminal symbols

    S the start symbol, $S \in V$; and

    P a finite set of productions, each of the form $A \rightarrow \alpha$, where
    $A \in V$ and $\alpha \in (V \cup \Sigma)^*$. That is, the left side of a production
    is a nonterminal and the right side is any sequence of terminals and/or nonterminals.


    # Definition 10.2


    The language generated by a context-free grammar


    A string $x$ belongs to $\mathcal{L}(G)$ — the language that $G$ $generates$ —
    if and only if there exists a derivation of $x$ from the start symbol and $x$
    is composed entirely of terminal symbols.


    > $\mathcal{L}(G) = \{x \mid S \Rightarrow^* x \text{ and } x \in \Sigma^*\}$.


    This is defined the same as for regular grammars; we repeat it for completeness.


    # Example 10.1


    Consider the $G_1 = (\{S\}, \{a, b\}, S, (S \rightarrow a S b \rightarrow S \rightarrow
    \Lambda))$. Here is a derivation of $aaabbb$ from $S$, the start symbol of $G_1$.'
