  md: '# Introduction to Part I:

    Logic for Computer Science


    Logic has many uses for computer scientists. Perhaps the best known is the role
    of propositional logic in the design and analysis of the digital circuits from
    which computers are built. A richer form of commons known as predicate logic underlies
    work in a much broader range of computer science topics, including artificial
    intelligence, databases and software engineering. There are even programming languages
    based on predicate logic.


    But logic is not only a source of applications. It is also an aid to careful thought
    about precisely defined subject matter such as that of mathematics and computer
    science. We will see so-called rules of inference can be used to establish confidence
    in the truth of each assertion in a sequence of assertions, culminating in proofs
    of important results. In fact, we will not only prove proofs, but also discuss
    proofs as problem-solving activities and stress the relationship between inference
    rules and everyday reasoning.


    Computer science has long been concerned with the manipulation of data. Increasingly
    these days, it also deals with the manipulation of knowledge. This shift, which
    underlies important applications like expert systems and intelligent databases,
    has been made possible by finding ways to write down what we know about real-world
    subject matter in a form that is sufficiently precise that a computer can do useful
    things with it.


    Because logic is a way to express knowledge, various forms of logic have played
    important roles in these endeavors. Here we will introduce propositional logic
    and predicate logic (also called predicate calculus), which are formal systems
    for expressing knowledge and reasoning about it to get new results. Both of these
    approaches to knowledge representation and reasoning ignore some aspects of knowledge.
    This simplification helps both the beginner and the field as a whole, by permitting
    clarity and'
