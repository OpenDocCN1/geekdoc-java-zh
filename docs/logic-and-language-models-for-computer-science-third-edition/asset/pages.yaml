  md: '# 12.1 Unrestricted Grammars


    The unrestricted grammar (UG) class gets its name from the fact that the constraints
    on productions are relaxed.$1$ In particular, we drop the CFG constraint of using
    a single symbol on the left-hand side of rules. This modification yields a significant
    gain in the power to generate languages. The definition of a UG looks familiar;
    it is a quadruple $G = (V, \Sigma, S, P)$, where $P$ is finite and each production
    in $P$ is of the form


    ```

    $\alpha \rightarrow \beta$, $\alpha, \beta \in (V \cup \Sigma)^*$.

    ```


    The four parts correspond directly to those of CFGs, and derivation steps are
    defined the same way (with any production $\alpha \rightarrow \beta$ permitting
    the derivation step $\Phi\psi \Rightarrow \Phi\psi$). The difference is where
    CFGs allowed just a single nonterminal on the left, UGs allow any sequence of
    terminals and nonterminals. (Note that we essentially return to the original presentation
    of grammars in Section 8.6.)


    Theorem $10.4$ made clear the need for a formulation of grammars more powerful
    than CFGs if we are going to generate $L = \{a^n b^n c^n \mid n \ge 0\}$. View
    of CFG shortcuts is that the left-hand side of the production $A \rightarrow \alpha$
    can be applied any time $A$ appears during a derivation. To control of the use
    of a replacement — so that it can occur in some contexts but not others — is something
    context-free productions can not do.$2$


    # Example 12.1


    The UG production $aAb \rightarrow aCb$ permits an $A$ to be replaced by a $C$,
    but only when, at some point in a derivation, it has the surrounding context $a\b$.
    So a possible derivation would be $abaAbAc \Rightarrow abaCbAc$, replacing the
    first $A$. The string $abaAbCc$ could not be derived instead because the second
    $A$ does not have the required context.


    # Example 12.2


    Show that the unrestricted grammar $G$ with productions shown here generates exactly
    the strings of the language $L = \{a^n b^n c^n \mid n \ge 0\}$, which'
