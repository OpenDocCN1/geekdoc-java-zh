  md: 'Since the two recursive definitions are essentially the same, it is natural
    to think of an “expression” to be a single abstraction that has two representations,
    as a string and a tree. The fully parenthesized string version of an expression
    can be reconstructed from the expression tree version, simply because the recursive
    building processes are analogous. Similarly a fully parenthesized string version
    of an expression can be used to construct the expression tree version.


    Expression trees have certain advantages. First they are free of the issues concerning
    parentheses mentioned above. Without conventions (such as precedence and left-to-right
    associativity) expressions represented as strings with parentheses not shown,
    might correspond to more than one tree. In this text, even when we are discussing
    other types of expressions, we will always assume that no ambiguity exists (i.e.,
    that conventions exist so that only one tree is possible). Second, expression
    trees make the evaluation of an expression very clear. To evaluate an expression
    you must first know the (numeric) values of the variables; given those you can
    assign values to the leaves of the trees. Thereafter you can evaluate the value
    of each internal node of the tree, “bottom-up”, using the operators’ definitions.


