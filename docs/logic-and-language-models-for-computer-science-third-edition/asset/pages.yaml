  md: "# 2.4 Laws of Propositional Logic\n\nThis section lists some short, useful\
    \ equivalences that are often called **laws of propositional logic**. You already\
    \ know one of them, shown next, since it was proved in the preceding section.\
    \ Below it, for comparison, is the familiar distributive law for numbers.\n\n\
    ```\n$p \\wedge (q \\vee r) \\equiv (p \\wedge q) \\vee (p \\wedge r)\\nx \\times\
    \ (y + z) \\equiv (x \\times y) + (x \\times z)$\n```\n\nIn arithmetic, multiplication\
    \ distributes over addition. The logical equivalence here is similar to the arithmetic\
    \ one and by analogy also called a distributive law. It says that conjunction\
    \ $(\\wedge)$ distributes over disjunction $(\\vee)$. Propositional logic, unlike\
    \ arithmetic, has not just one but *two* distributive laws: each operator $(\\\
    wedge)$ and $(\\vee)$ distributes over the other. Just as we can use the distributive\
    \ law of arithmetic to transform one (arithmetic) expression into another, so\
    \ too we can use this propositional equivalence to transform one (propositional)\
    \ expression into another. Just as in arithmetic, manipulating expressions is\
    \ an important technique to generate new but equivalent expressions. Each equivalence\
    \ can easily be established by truth tables, that is by exhaustive case analysis.\
    \ Note that the laws are for general propositions like $\\alpha$ and $\beta$ rather\
    \ than variables $p$ and $q$. However since — like Boolean variables — propositions\
    \ are truth-valued, we speak of the current state of, say, $\\alpha$ and $\\beta$\
    \ and construct truth tables exactly the same way. Additional propositional equivalences\
    \ will be given in the next section.\n\nThe lists in Figure 2.1 and Figure 2.2\
    \ give some of the most important equivalences which we will use for manipulating\
    \ logical expressions."
