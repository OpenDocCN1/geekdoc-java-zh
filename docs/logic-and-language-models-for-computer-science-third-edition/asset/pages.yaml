    # Example 11.6


    A PDA for the language of balanced parentheses can be based on the recursive definitions
    used for the grammar in Example 10.3. Instead we will give a design based on Exercise
    10.8, which uses a counter-based approach. A stack can use pushes and pops to
    simulate increment and decrements of a counter.


    Unfortunately testing for zero is problematic if zero corresponds to an empty
    stack, since a PDA with an empty stack cannot make a transition. For this language
    consider when a right parenthesis is read and the counter goes to zero. If that
    was the final input character the stack could go empty leading to acceptance.
    However there is another character — necessarily a left parenthesis — the PDA
    should have an S on the stack, because in a strong sense the PDA is starting all
    over afresh. However the S will only be on the stack if the PDA nond nondeterministically
    guessed there would be more input when the counter went to zero and pushed an
    S when the counter was last zero in anticipation of the need to continue. On the
    other hand if there was no input the PDA would have guessed that and not pushed
    an S, hence allowing the PDA to accept when the stack next went empty. This is
    summarized in Figure 11.3, where the only state is $p$.'
