  md: '# 11.2 Standard Notation for PDAs


    This section describes our model for PDAs. We will begin with the formal model
    and then describe PDAs with state-transition diagrams. The motivations which we
    discussed in the previous section are found here.


    The general definition of NPDAs involves six items. Four of these are the ones
    in the quintples (5-tuples) used in Chapter 9 to represent FAs. Surprisingly,
    NPDAs require additional items involving the stack, specifically, a set of stack
    symbols and the special stack symbol, S. Because we are adopting acceptance by
    empty stack there is no set of accepting states.


