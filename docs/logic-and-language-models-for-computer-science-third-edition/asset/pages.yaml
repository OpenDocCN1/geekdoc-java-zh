  md: 'The foregoing definitions — of an automaton, the transition function, $\delta$,
    and its closure, $\delta^*$ — now make it easy to define the language recognized
    by a DFA as the set of strings that take the DFA from its start state to an accepting
    state using $\delta^*$.


    # Definition 9.3


    The language $\mathcal{L}(M)$ recognized by a DFA $M = (Q, \Sigma, q_0, A)$ is
    the set of all strings $x \in \Sigma^*$ such that $\delta^*(q_0, x) \in A$. One
    says that $M$ *accepts* the strings of $\mathcal{L}(M)$ and that it *rejects*
    those of its complement, $\Sigma^* \setminus \mathcal{L}(M)$.


    # Algorithm 9.1


    **Recognizing the language of a finite automaton.**nConsider a DFA $M$ processing
    an input string. The function *read* gets the next symbol from the input. This
    recognition algorithm returns *succeeds* for acceptance and *fails* for rejection.
    Note it correctly handles an empty input.


    ```

    $q \Leftarrow q_0$\nwhile more input do\nread($\sigma$)\nq \Leftarrow \delta(q,
    \sigma)\nif ($q \notin A$) then fail\nsnsucceed

    ```


    Writing a recognition algorithm is now remarkably simple if we allow ourselves
    to use the generalized transition function $\delta^*$. Following [Definition 9.3],
    to determine whether or not the input string $x$ is accepted, one would compute
    $\delta^*(q_0, x)$ and check whether or not it is a member of A. This approach
    assumes that we can implement $\delta^*$. Although [Definition 9.2] tells us exactly
    how to write a recursive function for $\delta^*$, we will instead use the simple
    iterative [Algorithm 9.1].'
