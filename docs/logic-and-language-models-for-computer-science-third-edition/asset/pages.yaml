    # Example A.9


    The first part of this ancestor rule says that anyone who is your parent is one
    of your ancestors. The second says that your ancestors also include the parents
    of your ancestors. Each part of the rule ends with a period and is called a clause.
    So ancestor is a two-clause rule, in contrast to the one-clause rules for mother
    and grandparent. Note that the rule also is accompanied by bits of explanation,
    each beginning with the Prolog symbol, "%".


    ```

    ancestor(X,Y) :- % First clause: X is an ancestor of Y

    parent(X,Y). % X is a parent of Y.

    ancestor(X,Y) :- % Second clause:X is an ancestor of Y

    parent(X,Z), % X is a parent of someone (Z)

    ancestor(Z,Y). % who is an ancestor of Y.

    ```


    In general, a Prolog rule is a set of Prolog clauses, perhaps none or just one,
    sometimes as in this case, and possibly more. Each clause has the form of a backwards
    implication with exactly one proposition on the left side of the ":-" symbol.
    The right side, however, is more flexible: it may have any number of (0, 1, 2,
    3, ...). For example, each of the earlier rules—mother and grandparent—is a single
    clause with two propositions on the right side, while one of the ancestor clauses
    has just one proposition on the right. But later on, we will see that one of the
    clauses for the different rule has no propositions on the right. Here is the general
    form of a Prolog clause:


    ```

    P :- Q1, Q2, ..., Qn.

    ```


