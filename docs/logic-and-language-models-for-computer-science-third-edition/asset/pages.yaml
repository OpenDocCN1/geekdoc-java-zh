  md: '# 9.2 Diagrams and Recognition


    We approach the study of DFAs by introducing the idea of a simple processing diagram
    called a state transition diagram. When DFAs are defined formally later, it will
    be clear that every DFA can be expressed as one of these diagrams. Moreover, the
    diagram has all the information needed to get back to a complete formal specification
    of its DFA. Therefore the two representations, one visual and the other formal,
    are completely equivalent.


    A state transition diagram specifies a process that receives a string as its input
    and accepts it or not. The set of strings that a diagram accepts is considered
    to be its language. Consider the state transition diagram used as the figure for
    Example 9.1. This diagram accepts precisely the two strings a and bc, as we shall
    prove below, but for now have a look at its general appearance. The name “state
    transition diagram” comes from the circles in the diagram called states and the
    labeled arrows called


    The rules for using these diagrams for recognition are similar to the King of
    Heart’s reading instructions to the White Rabbit: “Begin at the beginning, and
    go on till to the end: then stop.” The beginning point in a state transition diagram
    is the start state. There is always just one of these, indicated by a short arrow
    pointing to it, not coming from any other state. The first symbol of the input
    is initially the “current” symbol.


    At each step of the process, follow a labeled arrow, called a transition, that
    leads out of the current state, which is labeled with the current input symbol.
    The new current state is the one to which the arrow points, possibly the same
    as before if the arrow curves back to the state it comes from. Carrying out this
    step moves the current symbol of input, making the next one state. The process
    repeats. A double circle signifies an accepting state. A state that leads from
    the start state to such a state is accepted by the diagram. When the machine is
    in an accepting state then, as described in the previous section, we can regard
    a green light as being illuminated. That is, if the end of input and an accepting
    state are reached simultaneously, the string is in the language corresponding
    to the state transition diagram. Unless this occurs, the string is not in the
    language.


    These processing instructions, like the King of Heart’s, go to the end of input
    and stop there. Where in the diagram one stops, however, is less easy'
