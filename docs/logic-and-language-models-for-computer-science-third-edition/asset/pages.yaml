  md: 'implication or the conditional $p \rightarrow q$.


    We also read the expression $p \rightarrow q$ as “if p then q”. This English-language
    phrasing can be just as confusing as “or” (inclusive versus exclusive) unless
    we are careful to remember that with the other operators, the definition is the
    truth table, not the English phrase. Even though in English “if p then q” does
    not seem to mean much when $p$ is false, we have seen that it''s useful to have
    this operator, which is defined to give TRUE in both of the states where $p$ is
    FALSE. The important point is that the truth of both $p$ and $(p \rightarrow q)$,
    together, ensures the truth of $q$, and that we can prove it with the truth table!²


    Another important operator has the truth table shown. Once again, we use a strange
    name for it, first this time $\diamond$, to avoid any preconceptions. You can
    see from the truth table, the expression $p \diamond q$ is true in those (two)
    states for which $p$ and $q$ have the same truth value: either TRUE or both FALSE.


    | $p$ | $q$ | $p \diamond q$ |

    |---|---|---|

    | T | T | T |

    | T | F | F |

    | F | T | F |

    | F | F | T |


    The same kind of reasoning used for the conditional works here too. Suppose we
    know that $p \diamond q$ is true (putting us in either the upper left or lower
    right of the truth table) and then we learn that $p$ is true (putting us in the
    top row). The only possible state is therefore the upper left, where $p$ and $q$
    are true. From the truth of both $p$ and $p \diamond q$, we can conclude that
    $q =$ TRUE too.


    So far, this reasoning is just like for the conditional. But now notice what happens
    if we assume the truth of $q$ (instead of $p$ before) along with the truth of
    $p \diamond q$. The truth of $p \diamond q$ requires our state to lie in the left
    column. This along with the truth of $p \diamond q$ (upper left or lower right)
    again puts us in the upper left, where $p =$ TRUE. In sum, when $p \diamond q
    =$ TRUE, we can reason either from $p$ to $q$ or from $q$ to $p$. Because each
    leads to the other we use a two-way arrow for this operator, writing $p \leftrightarrow
    q$. The operator is sometimes called the biconditional.**'
