- img_proc: true
  md: '# B.8 Using AWK in Unix


    What do you have to do to actually use awk? First, of course, you have to gain
    access to it, but that is easy because it is widely available. In particular it
    is on nearly all computers that run some version of the Unix operating system.
    Since it is a Unix command, there is an entry for it in the online manual. You
    can get documentation by typing “man awk” at the operating system prompt. Note
    the correct spelling is with lower-case letters, “awk”, just like other Unix commands.


    Note that there are many versions of awk. On some systems you may get, GAWK if
    you enter the command awk. However, there is little dependence on the version.


    At the Unix prompt you will type:


    ```

    awk -f source1 input2 ...

    ```


    where source is file with your awk program, and the other files are the input
    files. Typically there is only one input file; if there are more they are concatenated
    into one input stream. All files are text files. If there is no input file specified
    then the input comes from standard input. Of course awk code can be piped with
    other Unix tools and filters.


    An unusual and attractive variant syntax of the command line is permitted:


    ```

    awk ''program'' input1 input2 ...

    ```


    where program is the entire text of the awk program given right in the command
    line! This is called a one-shot program, since you need to retype it each time.
    An example given earlier could be invoked with:


    ```

    awk ''$2 /xyz/ {print $3}'' data

    ```


    where data is the input file. (Multiple rules can be used in one-shot programs,
    but are not discussed here.)'
  merge: -1
  pgno: 410
