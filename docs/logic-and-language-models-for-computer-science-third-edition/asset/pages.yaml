  md: '# Definition 7.2


    Concatenation of languages

    The concatenation of two languages $L_1$ and $L_2$ is written $L_1L_2$ (or $L_1
    \cdot L_2$).nIt contains every string that is the concatenation of a member of
    $L_1$ with a member of $L_2$. That is,


    ```

    $L_1L_2 = \{xy \mid x \in L_1 \wedge y \in L_2\}$

    ```


    Superscripts for languages behave analogously to those for strings. That is, for
    any language $L, L^0 = \{\Lambda\}$ and for any integer $k, L^{k+1} = LL^k$. It
    follows that $L^1 = L, L^2 = LL, L^3 = LLL$, and so on.


    Since the concatenation of individual strings is not commutative, neither is the
    concatenation of languages. That is, $L_1L_2$ can — and usually differs from $L_2L_1$.


    # Example 7.7


    Let $L_1 = \{a, aa\}$ and $L_2 = \{b, bb, bbb\}$. Then the concatenations $L_1L_2$
    and $L_2L_1$ are as follows:


    ```

    $L_1L_2 = \{ab, abb, abbb, aab, aabb, aaabb\}$$\n$L_2L_1 = \{ba, bba, bbba, baa,
    bbaa, bbbaa\}$

    ```


    Notice that there are 6 (the product of 2 and 3) possible ways to select strings
    to concatenate for $L_1L_2$ in Example 7.7, and all 6 results differ from each
    other. However, although the language $L_2$ has 9 $(3 \times 3)$ ways to select
    strings, the resulting overlap leads to $L_2^2$ having only 5 members: $L_2^2
    = \{bb, bbb, bbbb, bbbbb\}$.


    # Definition 7.3


    Closure for languages


    The *closure* of $L$ is $L^*$, where $L^* = L^0 \cup L^1 \cup L^2 \cup L^3 \dots$;
