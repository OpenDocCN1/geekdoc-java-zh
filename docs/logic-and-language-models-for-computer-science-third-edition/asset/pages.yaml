  md: '# 10.2 An Example


    A palindrome is a string that reads the same forwards and backwards; it is the
    reverse of itself. The empty string and all strings of length one are palindromes.
    A string of length two is a palindrome if and only if its two symbols are the
    same. Among the words of English, some palindromes are “a”, “gag”, “eke”, “deed”,
    “noon”, “level”, “tenet”, “redder” and “reviver”. Here is a more precise definition
    of palindromes:


    # Definition 10.6


    # Palindromes over Σ


    +   * Σ is a palindrome.

    * For any $a \in \Sigma$, $a$ is a palindrome.

    * If $x$ is a palindrome and $a \in \Sigma$, then $axa$ is a palindrome.

    * No other strings are palindromes.


    Notice a new palindrome axa is longer than 2 than x, so A in the first line of
    the definition gets us started only on the even-length palindromes. We also need
    all the $a \in \Sigma$ (all the strings of length 1) in the second line to get
    started on the odd-length palindromes. We focus on the even-length palindromes,
