  md: '# Chapter 12


    # Turing Machines


    When we discovered that there are non-regular languages, this led to the discussion
    of context-free grammars and their languages. Similarly, the fact that there are
    languages beyond the representational power of CFGs, leads us to consider a more
    powerful formulation of grammars. On the machine model side we will need a more
    powerful automaton than pushdown automata.


    Specifically we will introduce unrestricted grammars and the Turing Machine (TM)
    model. These are advanced topics, so we confine our attention to a few key ideas,
    illustrated by a continuing example. By skipping directly to TMs we come to end
    of the storyline of Automata Theory since they are the most powerful. Paradoxically,
    since they were formulated in 1936, TMs were the beginning of the story historically.
    Since then the landscape has become complicated with hundreds of languages classes
    based on as many models. Some are well-known, like context-sensitive languages,
    which we briefly mention.


    Turing Machines are the most versatile category of automata. The most important
    thing about this category is the following assertion: For every possible algorithm,
    no matter how complex, there is a Turing Machine that implements it. Although
    this assertion is not provable, no counter-example has been found, as is discussed
    in Section 12.7. For this and other reasons, the assertion is widely believed.
    In fact, the TM model is used as a definition of computability. The determination
    of what is computable and what is not in the realm of theoretical computer science,
    but the practical value of knowing that something is impossible — that for some
    problem there is no algorithm that always solves it — should not be underestimated.
    It tells us that we must reformulate the problem, perhaps restricting the scope
    of what we hope to accomplish.'
