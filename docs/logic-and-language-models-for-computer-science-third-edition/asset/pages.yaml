    # Definition 9.4


    # Nondeterministic finite automata


    A nondeterministic finite automaton, $M$, is a quintuple $(Q, \Sigma, q_0, \delta,
    A)$, where $Q, \Sigma, q_0$ and $A$ are just as for DFAs, that is, $Q$ is a finite
    set of states, $\Sigma$ is a finite alphabet, $q_0$ is the start state and $A$
    is the set of accepting states, where


    ```

    $\delta : Q \times \Sigma \rightarrow 2^Q$.

    ```


    For various values of $q \in Q$ and $\sigma \in \Sigma$, the value of $\delta(q,
    \sigma)$ may be a set of zero, one, or more states. Cases of $\delta(q, \sigma)$
    containing more than one state present a choice of what the next state will be.
    There will be at least one case in each of the NFAs we present, to make the machine
    genuinely nondeterministic. However, a machine for which each of the $\delta(q,
    o)$ contains zero or one state never has any real choices to make. Although such
    a machine can formally satisfy the definition of an NFA, it has a decidedly Deterministic
    flavor and is readily rewritten as a deterministic automaton; see Exercise 9.1.


    What strings are accepted by an NFA? Informally, a string $x$ is accepted if there
    exists some choice of transitions, while reading the symbols of $x$ left-to-right,
    that will take us from the start state to an accepting state. To make this formal
    we need to adapt the definition of $\delta^*$ to the case of an NFA.


    # Definition 9.5


    # $\delta^*$, the generalized transition function extended to NFAs


    For NFA $M = (Q, \Sigma, q_0, \delta, A)$, is a function that takes a state and
    a string as input and produces a resulting set of states. That is, $\delta^* :
    Q \times \Sigma^* \rightarrow 2^Q$, such that:


    +   (i) For any $q \in Q, \delta^* (q, \mathbf{\Lambda}) = \{q\}$ and


    +   (ii) For any $q \in Q$, any $\sigma \in \Sigma$ and any $x \in \Sigma^*$,'
