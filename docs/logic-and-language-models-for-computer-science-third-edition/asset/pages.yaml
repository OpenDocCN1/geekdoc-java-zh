  md: 'Proof: We show, by MI, that $\forall n \in \mathcal{N}: p(n)$. The base case,
    $p(0)$, the proposition that the sum of no (zero) numbers is $0(0+1)/2$ or $0^2$,
    which is clearly true. To establish $p(n)$ we proceed as follows:


    ```

    $$\sum_{i=1}^{n+1} i = (n+1) + \sum_{i=1}^{n} i=(n+1) + \frac{n(n+1)}{2} = \frac{2(n+1)+n(n+1)}{2}
    = (n+1)(n+2)/2$

    ```


    Note that we appealed to the inductive hypothesis, $p(n)$, when we went to the
    second line.


    The above discussion and example are motivation for our formal statement. Mathematical
    induction can be expressed as a *rule of inference*. Above the bar, as usual,
    the things that must be proved before invoking the rule. So for MI, we must prove
    the base case, which is the first line, as well as the inductive step, the second
    line. The final line is the result that is being proved by MI.


    Mathematical Induction: $p(0)\n\forall n \in \mathcal{N}: p(n) \rightarrow p(n+1)\n\forall
    n \in \mathcal{N}: p(n)$


    Notice that the second line, the inductive step, is expressed in terms of $\forall$
    (universal quantification) and $\rightarrow$ (conditional). We will need to get
    results in a form that includes these symbols in order to make use of this rule
    of inference, so we should expect to use $\forall$ introduction and $\rightarrow$
    introduction along the way. For $\forall$ induction, recall that proving something
    of all positive integers can be achieved by proving that it is true of $n$, where
    we make no assumptions about $n$ except that it is a positive integer. For $\rightarrow$
    introduction, we assume the left-hand side and, using that assumption, proceed
    to prove the right-hand side. Notice that in the context of MI, assuming the left-hand
    side is called the inductive hypothesis. Taken together, this give the general
    framework for proofs by mathematical induction. The framework can serve to guide
    the proof in Example 5.5.'
