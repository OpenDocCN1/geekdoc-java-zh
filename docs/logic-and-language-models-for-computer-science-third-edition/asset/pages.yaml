  md: "# 6.6 Loop Invariants and Tail Recursion\n\nThere is a simpler type of recursion\
    \ that is common. Tail recursion describes a recursive procedure where there is\
    \ only one recursive call and it is always last, that is no further statements\
    \ are executed after the call returns. In this section we illustrate how to rewrite\
    \ code for While-loops as tail recursion procedures. It also true that we can\
    \ readily convert tail recursion into non-recursive looping code, but we do not\
    \ illustrate it. What is relevant in this section is the relationship between\
    \ loop invariants and the pre- and postcondition in such examples.\n\nExample\
    \ 6.11\n\nConsider this recursive version of the BST search algorithm. It is annotated\
    \ with relevant propositions. Very little has to be said since these propositions\
    \ are virtually the same as those for the iterative code. Again, the first and\
    \ last assertions are the given pre- and postconditions for the procedure. This\
    \ procedure must be initially invoked using the root of the tree, BSTSearch(T,\
    \ K).\n\n```\nBSTSearch(t, K)\n// K ∉ T V K e t\nif t ≠ nil ∧ K ≠ key(t) then\n\
    \  if K < key(t) then\n    // t ≠ nil ∧ (K ∉ T V K ∈ L(t))\n    t = L(t)\n   \
    \ // K ∉ T V K e t\n    BSTSearch(t, K)\n    // (K ∉ T ∧ t = nil) ∨ K = key(t)\n\
    else\n  // t ≠ nil ∧ (K ∉ T V K ∈ R(t))\n  t = R(t)\n  // K ∉ T V K e t\n  BSTSearch(t,\
    \ K)\n  // (K ∉ T ∧ t = nil) ∨ K = key(t)\n// (K ∉ T ∧ t = nil) ∨ K = key(t)\n\
    ```"
