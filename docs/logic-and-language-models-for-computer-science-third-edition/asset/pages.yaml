    \ of states\n-$\\Sigma$ is a finite input alphabet, where $\\Delta \notin \\Sigma$\n\
    -$\\Gamma$ is a finite tape alphabet, where $\\Sigma \\subseteq \\Gamma$ and $\\\
    Delta \\in \\Gamma$\n-$q_0 \\in Q$ is the initial state,\n-$q_a \\in Q$ is the\
    \ accepting halt state,\n-$q_r \\in Q$ is the rejecting halt state,\n-$\\delta$\
    \ is the transition function,\n\n$\\delta : Q \\setminus \\{q_a, q_r\\} \\to Q\
    \ \\times \\Gamma \\times \\{L, R\\}$.\n\nNote that the two halt states can only\
    \ be the possible *result* of 5 and they cannot be used as inputs. This is because\
    \ a halt state can have no outbound transitions. The set $\\{L, R\\}$ in the definition\
    \ corresponds to the two possible tape head movements: Left or Right. Also note\
    \ that the TM is a *deterministic* model. The transition described above, from\
    \ $p$ to $q$ with label “X/Y, $\\mu'$” is denoted $\\delta(p, X) = (q, Y, \\mu)$.\n\
    \nThe language accepted by a *Turing Machine* $M$, $\\mathcal{L}(M)$, is the set\
    \ of all input strings that cause the TM to halt in state $q_a$. This creates\
    \ an unanticipated asymmetry because an input string can be rejected in two ways:\
    \ it can be rejected by entering state $q_r$, or it can be rejected by going into\
    \ an infinite loop (and hence not accepted!). We would prefer it if every TM always\
    \ halted, whatever its input. Unfortunately, as we show below, there are languages\
