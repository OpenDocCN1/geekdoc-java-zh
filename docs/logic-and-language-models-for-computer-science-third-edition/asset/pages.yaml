  md: '# Introduction to Part II:

    Language Models for Computer Science


    Language models are related to programming languages, which are central to practical
    computing. The study of language models addresses concepts and issues that are
    relevant to all programming languages. The field thereby seeks a better understanding
    of language in general, as opposed to a single language. In moving to this more
    general level, we follow our modeling strategy focusing on a relatively small
    number of widely applicable concepts. The resulting language models clarify issues
    about compilers, the software that translates your programs into executable form.
    The study of language models can also help you learn and even design new languages.


    Language models have another abstract function. We use them to define problems
    formally. We will turn to this aspect when we have discussed more background.


    In addition to modeling language, we will also be modeling computing machinery,
    by introducing simple abstract machines called automata. We will see some surprisingly
    close relationships between automata and language models. The study of automata
    also leads to the Theory of Computation. A category of automata known as Turing
    Machines provides a simple but apparently universal way to model what it means
    to compute. Then, given a model of what computation is, it becomes possible to
    talk about incomputability. That is, one can actually prove that for some computational
    problems there cannot be a general solution. From a practical standpoint, this
    work helps us to formulate real problems in ways that are computable.'
