  md: 'These results ultimately inform us about the relative difficulty of the various
    decision problems.


    The best known area of complexity theory concerns the two complexity classes $P$
    and $NP$:


    $P = \{L \mid L \text{ is accepted by a DTM in polynomial time }}$


    $NP = \{L \mid L \text{ is accepted by a NTM in polynomial time }\}$


    which can define more formally as


    ![](img/e49d977e0cc4db78b7174ba16fc32998_343_0.png)


    ![](img/e49d977e0cc4db78b7174ba16fc32998_343_1.png)


    Even though, these are defined in terms of language recognition we will continue
    to interpret them as pertaining to decision problems. A decision problem is in
    $P$ if it can be solved deterministically in $O(n^k)$ time, for some integer $k$.


    When $k$ is small, say $k=2$, then we have a runtime of a reasonably efficient
    machine, but if $k=1, 000, 000$ then such an implementation is incredibly impractical.
    So why is polynomial time central to these definitions? There are three reasons.
    First, even if membership in $P$ does not guarantee a practical implementation,
    it is certainly true that not belonging to $P$ means that the decision problem
    has no practical solution, for large $n$. We label a decision problem intractable
    if it is not in $P$. Second, even that a DTM seems tediously slow, it is known
    that a DTM can simulate a single step of a normal random-access computer in polynomial
    time. (In fact there is whole literature on the complexity of various simulations).
    Third, polynomials have simplifying closure properties; for example, a polynomial
    number of steps, taking each polynomial time to execute/simulate, takes a cumulative
    time that is also polynomial. (Experience tells that for natural problems when
    a polynomial time algorithm exists that the value of $k$ is small. However we
    can easily invent decision problems that require larger values of $k$).


    Membership in $NP$ is of no direct practical significance. In fact non-'
