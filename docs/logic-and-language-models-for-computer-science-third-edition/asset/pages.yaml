    The symbol "+" corresponds directly to the union of sets. Historically it is used
    since ∪ is not on the keyboard. It is often called the alternation operator, since
    it provides for alternatives. For example, a + b is the RE for {a} ∪ {b}, that
    is, the language {a, b}. Unlike concatenation, alternation is commutative; for
