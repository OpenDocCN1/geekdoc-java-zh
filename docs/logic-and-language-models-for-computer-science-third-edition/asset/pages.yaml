  md: '# 9.7 Limitations of Regular Languages


    In this section we show that the class of regular languages does not contain all
    languages. We will give a technique to show some languages are non-regular. The
    technique will also lead to a method for reducing the complexity of DFAs. The
    starting point for both is this definition.


    # Distinguishability 9.7


    Let $L$ be a language over $\Sigma$ and $x, y \in \Sigma^*$. Then $x$ and $y$
    are *distinguishable with respect to $L$* if for some $z \in \Sigma^*$ one of
    the strings $xz$ and $yz$ is in $L$ but the other is not in L. Otherwise $x$ and
    $y$ are *indistinguishable*. A set $S$ of strings is pairwise distinguishable
    with respect to $L$, if any two distinct strings drawn from $S$ are distinguishable.


    The next theorem has a long history and is part of the Myhill-Nerode theorem.


    > **Theorem 9.9** – Let $L$ be a language over $\Sigma$. If there exists a finite
    set $S$ of strings that are pairwise distinguishable with respect to $L$, then
    if a DFA recognizes $L$ then it must contain at least $|S|$ states.


    **Proof:** $|S|=n$. Suppose, to the contrary, that some DFA, $M$, accepts the
    language $L$ but $M$ has $m < n$ states. We invoke the pigeonhole principle: to
    fit $k+1$ pigeons into $k$ pigeonholes, some pair must share a pigeonhole. As
    pigeons we take the $m$ states of $M$. As pigeons, for each of the strings of
    $S = \{x_i \mid 1 \le i \le n\}$, we take the state, $p_i = \delta^*(q_0, x_i)$,
    to which $x_i$ leads, from the start state. By the pigeonhole principle, two of
    the latter states must be the same state; in particular $p_i = p_j$, where $i
    \neq j$. This is impossible, since from that, for any input $z$, a fixed path
    will be taken. Hence the two strings $x_i$ and $x_j$ cannot be distinguished.


    With this theorem we can prove certain languages require a certain number of states.
    In this sense it is possible to show that some regular languages are more complex
    than others. However we will use this theorem in a more dramatic way, to show
    some language is too complex for any DFA to accept it.'
