  md: '# 12.8 Computational Complexity


    So far in the second part of this book we have dealt exclusively with questions
    of what can or can not be done. For example, $L = \{a^nb^n \mid n > 0\}$ is a
    language for which we can give a regular grammar, but we can give a context-free
    grammar. In practice, computer scientists wish to go beyond what they can solve
    a problem, to how hard it is to solve the problem. By sorting problems into language
    classes, we can gauge how hard a problem is solved with an FA and another TM there
    is a sense in which the first problem is easier. However, if a regular language
    requires an FA with a number of states exponentially larger than a TM would require
    to recognize the same language, then the simplicity of the FA is moot.


    In computer science we have traditionally evaluated the difficulty of a problem
    by how much resources are consumed by the (optimal) computer program that solves
    that problem. Typically the resource that is studied most is execution time, but
    memory usage is also important. In Algorithms course, these issues are studied
    extensively. However, there are important issues about efficiency that can be
    studied theoretically with Turing Machines.


    We will continue our attention to decision problems in this section, which is
    equivalent to concentrating on language recognition tasks. In Chapter 7 we discussed
    sorting languages into “language classes,” as dictated by various models of computation,
    grammars, etc. Now, instead, we wish to sort languages into complexity classes
    according to how much resources a TM must use in order to recognize that language,
    as defined below. This leads to a whole field of study known as computational
    complexity, which would require a semester to survey. In this section we indicate
    some directions that can be pursued in that field.


    # Example 12.5


    What resources — that is, how much time and space — are required by the TM in
    Example 12.3, when it begins with the input $a^nb^nc^d$?


    The TM repeatedly scans the tape, back and forth, until it eventually halts. In
    particular it will scan all $3n$ symbols plus the two bracketing'
  merge: -1
  pgno: 341
- img_proc: true
  md: '($\Delta$), $n$ times left-to-right and $n$ times right-to-left, a final left-to-right
    pass. Careful counting show that it takes the TM $(2n+1)(3n+1)$ steps to accept
    $x$; generally we are looser and state that the number of steps it takes is a
    quadratic function, $O(n^2)$. It can also be seen that it could take a quadratic
    number of steps to reject an input of $n$ symbols. The TM does not use any additional
    tape cells beyond the $3n+2$ already mentioned; we says it a linear amount of
    space.


    We need more formal definitions. Recall that the $O(\cdot)$ notation was defined
    in Section 1.7. We say a TM $M$ “accepts a language $L$ in time $T(n)$” if for
    every $x \in L$, of length $n$, $M$ accepts $x$ in $O(T(n))$ steps. Further, we
    say a TM $M$ “accepts a language $L$ in space $S(n)$” if for every $x \in L$,
    of length $n$, $M$ accepts using $O(S(n))$ tape cells.


    We have stated (without proof) that nondeterminism does not allow a TM to accept
    a language that is not accepted by any deterministic TM. However nondeterminism
    may allow a TM to accept the strings of a given language, using fewer resources
    than any deterministic TM. Of course, this sort of speed-up is of theoretical
    interest since only deterministic machines exist. Surprisingly, the theory of
    nondism turns out to lead to some practical insights. DTM stand for deterministic
    TM and let NTM stand for a nondeterministic TM. Here are two types of time complexity
    classes:


    $DTIME(T(n)) = \{L | L \text{ is accepted by a DTM in time } T(n)\}$


    and


    $NTIME(T(n)) = \{L | L \text{ is accepted by a NTM in time } T(n)\}$


    Note that a complexity class is a set of languages, that share the property of
    being equally difficult to recognize, in some sense. The space complexity classes
    $DSPACE(S(n))$ and $NSPACE(S(n))$ are defined analogously.


    There are literally thousands of theorems known about various complexity classes,
    most depending on the growth rates of $T(n)$ and $S(n)$. A simple example of such
    a theorem is


    $DTIME(f(n)) \subseteq DSPACE(f(n))$.


    To prove this you need only observe that if a DTM uses $f(n)$ steps it will use
    at most $f(n)$ cells, but a DTM using $f(n)$ cells could use far more time.'
