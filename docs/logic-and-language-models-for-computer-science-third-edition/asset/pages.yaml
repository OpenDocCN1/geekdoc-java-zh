    Find an RE for all strings of bs with at least two bs.


    Since a string here can have any length 0 or 1, the language is infinite, which
    suggests the use of closure. To get lengths of “at least 2” we start with lengths
    of “at least 0,” for which we use b*, and then increase all lengths by 2, by adding
    bb. That, b*bb is an RE for the strings of at least two bs. The extra bs could
    be added anywhere: bbb* = bb*b = b*bb are all correct answers. Note that “* applies
