  md: '# 11.9 More on Parsing


    The goal of parsing is to find a derivation of a string in a language. Since the
    derivation can be exhibited as derivation tree, some people say that the goal
    is to provide the derivation tree, which is called a parse tree in this context.
    The parsing technique we presented earlier is called top-down parsing because,
    to the external observer, the tree is built by first expanding the root, then
    a child of the root, etc. This is straightforward theoretically, but this is not
    how practical parsers are built.


    The stack-based method used by compiler builders is called bottom-up parsing.
    This method has both deterministic and nondeterministic versions; we will focus
    on the deterministic version often called "shift-reduce parsing.\ This method
    reads forward in the input stream pushing the input on a stack. When it has read
    enough to just seen the right-hand side of some production, it pauses and removes
    the right-hand side from the stack and replaces it on the stack with the variable
    on the left-hand side of production. (If the right-hand side had k characters,
    the top k stack elements would spell out the right-hand side; there would be k
    "pops" and one "push.\ Then it goes back to reading input and pushing it onto
    the stack. Moving input onto the stack is a "shift" step and removing a right-hand
    side from the stack is a "reduce" step. We will not describe the method further
    but the next example hints at the generality of the scheme.


    # Example 11.12


    Use the bottom-up parsing method on strings of L(G), where G = ({S}, (a, b, f
    (, ), ), S)) and P contains the rules


    ```

    S → f ( S , S ) | a | b .

    ```


    Note the use of the comma (",") here as one of the terminal symbols of G. It is
    printed in boldface to make it look slightly different from the ordinary commas.
    Strings in L(G) includes b, f (a, b), f (b, f (a, a)).


    We will show how the stack changes as this method processes the input f(f(b, a),
    b). It is clearer in this context to show the stack as a string with bottom on
    the left and the top on the right.'
