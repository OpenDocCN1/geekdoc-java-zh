  md: '# 5.1 Inference Rules with Predicates


    As we begin to prove things about subject matter expressed with predicates, it
    is important to remember that propositions are still part of the picture, because,
    as noted, a formula in predicate logic with no free variables, is a proposition.
    Our propositional rules of inference will still be used as before; they still
    provide the structure of all our proofs. Moreover, many inference rules for propositions
    have analogous versions for predicates. For these reasons, proofs by rules of
    inference with predicates may have a reassuringly familiar look. Here is the predicate
    version of → introduction. We use the same name as before, but it will be clear
    from context which one is meant.


    → Introduction:


    $$p(x)

    q(x)$$


    $$p(x) \rightarrow q(x)$$


    To realize that the preceding rule is not new, remember that p(x) is a proposition:
    that x satisfies the predicate p. The variable x above and below the line is the
    same variable. When a variable is first used it is a blank slate, though it is
    assumed to be from some domain; as a computer scientist would say, the variable
    is typed (integer, real, etc.). This is generally done by asserting this as an
    assumption; this will start a new subproof which is the scope of the variable
    since it is unknown outside of this. (Of the introduction of variables is so common
    that this is implicit in all but the most formal proofs.) So in the above inference
    rule the antecedents and the conclusion are all within the scope of x. The  Elimination
    rule below is an exception to this.


    Of course, some inference rules with predicates go beyond just restating propositional
    rules. We begin the ∀ Introduction rule. This rule is based on the following insight:
    ∀x∈ S : p(x) and (x∈ S) → p(x) are the same proposition. In both cases we are
    saying “when x∈ S then p(x) will evaluate to true; it is silent on whether p(x)
    is true for other values x may be allowed to take on. So the next rule, below,
    is just a restatement of the → Introduction inference rule for propositions.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# ∀ Introduction:


    ```

    $\text{[new } x \in \mathcal{U}]}

    q(x)\nforall y \in \mathcal{U} : q(y)$

    ```


    Note that x is assumed to be a new variable and all we know about it is that it
    belongs to some set, $\mathcal{U}$. Thus x is a completely *arbitrary* element
    of $\mathcal{U}$. The second line says that this (weak) assumption has led to
    the truth of $q(x)$. The predicate $q$ must hold for every member of $\mathcal{U}$,
    as concluded below the line. The variable x is unknown outside the subproof; we
    could have used x instead of y below the line, but it would have been a new x.
    (The bound variables of any formula are always new variables, known only within
    that formula.)


    The next rule is often called instantiation, but we call it ∀ Elimination to emphasize
    that it generalizes the propositional rule, $\Lambda$ Elimination. In fact, with
    a domain of just two elements, this rule is identical to $\Lambda$ elimination.
    It states that if the predicate $p$ is true for all possible arguments it must
    be true for any particular one.


    # ∀ Elimination:


    ```

    $\forall x \in \mathcal{U} : p(x)\np(y) \forall y \in \mathcal{U}$

    ```


    Note that y is not regarded as a new variable, even though might happen to be
    free of prior properties.


    We now turn to the existential quantifier. When a variable in a proof has been
    proven to be simultaneously in a domain and to have property associated with predicate
    $p$ then this rule is clearly sound.


    # ∃ Introduction:


    ```

    $\exists x \in \mathcal{U} \wedge p(x)\nexists y \in \mathcal{U} : p(y)$

    ```


    The variable y is a bound variable within the quantified Boolean expression.


    Finally, consider how to make use of the knowledge that *some member of $\mathcal{U}$
    satisfies $p$. In this event we proceed to name that thing “y”.*'
