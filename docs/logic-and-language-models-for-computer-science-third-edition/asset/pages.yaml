    # Definition 2.2


    **Equivalence of Propositions**

    Two propositions α and β that evaluate to the same value for each and every state
    are equivalent. This is written α ≡ β. This is the same as saying that when regarded
    as functions they are the same; they map inputs to outputs identically. Note that
    ≡ is not an operator; it is a notation used to indicate a fact.


    Therefore the equivalence of the two expressions in Example 2.3 is written like
    this:


    > ¬(p∧q) ≡ ¬p∨q.


    In general how do you show α ≡β? The table is a systematic and visually clear
    way to present an exhaustive consideration of all possible states. The table is
    thus a summary of a proof by exhaustive case analysis. The important concept of
    case analysis (not always exhaustive) arises again in Chapter 3, where it serves
    as the basis of an inference rule and is used in a proof.


    Why use three bars (“≡”) for equivalence instead of just the two in an ordinary
    equals sign (“=”)? The difference between an equation and an equivalence is that
    an equivalence is always true (in all states). An equation does not make such
    a claim. For example, 3x² = 12 is not a claim that 3x² must be 12, no matter what
    value x has. Although an equation may hold for all values of its variables, more
    often the variables must have'
