  md: '# 2.7 Logic Circuits


    A primary area of computer science that makes use of propositional logic is the
    design of computer hardware. It is widely known that computers utilize binary
    values and circuitry to compute things. Unfortunately the design of hardware has
    a host of real-life concerns that complicate what is really a simple point. That
    is, nearly all circuitry is a realization of propositional formulas. In this section
    we merely make this point.


    The binary values conceptually are TRUE and FALSE. These are often referred to
    as 1 and 0. In fact they are just disjoint ranges of voltages on wires. Each such
    value is a bit. But what is important is that they are understood and manipulated
    as if they were actually Boolean values. The entire computer age was ushered in
    by Claude Shannon''s 1937 Master''s Thesis in which he showed that circuitry could
    implement propositional logic. It is important to remember that what is meant
    by "circuitry" has changed many times but the observations made in 1937 are unchanged
    today; they are all digital circuits.


    A typical computer has a clock and between each tick of the clock values runs
    from inputs to outputs. The inputs can be from an external source or from an internal
    memory location. Let us confines our attention to internal memory locations that
    holds one bit, called "flip-flops." The outputs can be to an external source or
    to an internal memory location. The basic principle is: each output value is computed
    to be the value of a proposition where the variables are a subset of the inputs.


    ![](img/e49d977e0cc4db78b7174ba16fc32998_58_0.png)


    Figure 2.4: Elementary logical gates.


    We have focused on the three logical operators: AND, OR and NOT. We'
