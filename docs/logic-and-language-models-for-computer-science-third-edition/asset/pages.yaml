  md: '# Example 7.8


    Let $L = \{a, b\}$. Then $L^0 = \{\Lambda\}$, which is true for any language.
    Also,


    ```

    $L^1 = L = \{a, b\}$,

    $L^2 = LL = \{aa, abb, bba, bbbb\}$,

    $L^3 = LL^2 = \{aaa, aabb, abba, abbbb, bbaa, bbabb, bbbba, bbbbbbb\}$,

    $L^* = \{\Lambda, a, b, aa, abb, bba, bbbb, aaa, aabb, abba, abbbb, aaa...\}$

    ```


    The “*” closure operator in Definition 7.3 is also sometimes called the (Kleene)
    operator. The use of this symbol is consistent with the definition of $\Sigma^*$
    earlier. In each case, the operator produces a set of strings formed by concatenating
    any number (zero or more) of instances of its operand. If we regard $a$ and $b$
    as strings of length 1 (as opposed to just symbols), then $\{a, b\}$ is a language,
    since it is a set of 2 strings, each of length 1. In that case the two definitions
    are in agreement $\{a, b\}^*$ is the set of all strings over $\{a, b\}$. Definition
    7.3 implies that “*” is a unary operator on languages; that, operates on one language
    to produce another. For practically any language $L$ (any except $\emptyset$ or
    $\{\Lambda\}$, to be precise) the language $L^*$ has infinitely many strings.


    We will assume precedence rules if parentheses are omitted in language operators.
    In particular closure will have the highest precedence, followed by concatenation,
    followed by ordinary set operators. So $L_1 \cup L_2L_3^* = (L_1 \cup L_2(L^*))$.'
