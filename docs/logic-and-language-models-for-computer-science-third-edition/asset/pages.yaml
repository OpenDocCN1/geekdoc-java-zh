  md: 'The kind of structural information that is present in derivation trees plays
    a crucial role in figuring out the semantics (roughly speaking, the meanings)
    of strings in useful CFGs. To understand an expression like $a + b \times c$ one
    must least know that “+" calls for adding, “×” calls for multiplying and that
    the multiplication is be done first. This last point, the issue of which operator
    to apply first, is what concerns us here. More generally, we want the derivation
    trees in our grammar for algebraic expressions — which we will be designing below
    — to provide an answer to the question: When an expression has two or more operators,
    in what order should they be executed? You know the answer, but the question has
    to be answered by compiler software.


    ![](img/e49d977e0cc4db78b7174ba16fc32998_267_0.png)


    Figure 10.2: Expression tree structures that indicate order of the applications
    of operators.


    So, we seek a grammar whose derivation trees always suggest the correct order
    for applying operators. We will do this for a simplified language of algebraic
    expressions, using just the two operators “+" and “×”, parentheses and a few variables.
    Informally


    ```

    $L = \{x \in \{a, b, c, +, *\} | x$ represents a simple arithmetic expression

    ```


    Examples of such expressions $a + b + c$ and $a \times b + c$. Our example will
    illustrate the ideas are broadly applicable to algebraic expressions for programming
    languages with numbers, variables, parentheses, functions, arrays and a wide range
    of other operators. Our goal will be a grammar for which the derivation trees
    always imply the correct order of application for the operators, taking into account
    four concepts: recursion, ambiguity, precedence and parentheses.


    The expressions and tree structures in Figure 10.2. These trees are not derivation
    trees; they are the expression trees from Chapter 1. Each branching in these trees
    associates an operator with its two operands. In the case of $a + b \times c$,
    For example, in the last the lower three-way branching groups “×” with $b$ and
    $c$ to form $b \times c$. Then the upper branching groups “+" with this result
    and $a$. The tree as a whole correctly reflects'
  merge: -1
