  md: 'be incomplete! After Gödel, people have replicated this paradoxical situation
    with many other systems. It is known that if a system is sufficiently complex,
    in a very technical sense, it cannot be both consistent and complete — there will
    always be a true but unprovable expression!


    It is beyond the scope of this book to even sketch the rationale behind these
    results. The minimal system alluded to above, that Gödel used, combined Peano’s
    axioms with other axioms that effectively defined the operations of addition and
    multiplication. (Curiously, addition without multiplication does not cause the
    same problems; that is an indication of how subtle the result is). Gödel also
    proved that these systems cannot prove their own consistency. There are several
    books in the bibliography that do explain, in popular language, how Gödel proved
    it, but many chapters are required.'
