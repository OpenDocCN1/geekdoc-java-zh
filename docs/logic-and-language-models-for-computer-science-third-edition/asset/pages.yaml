  md: "# 3.3 Rules of Inference\n\nA straightforward and exceedingly useful rule of\
    \ inference is the one called modus ponens (the method of affirming). It states\
    \ that if we know (the truth of) both $(\\alpha \rightarrow \beta)$ and $\\alpha$\
    \ then we can infer (the truth of) $\beta$. This inference rule follows directly\
    \ from our earlier discussion of the tautology $((\\alpha \rightarrow \beta) \\\
    wedge \\alpha) \rightarrow \beta$. However it is not presented here as a tautology.\
    \ Instead it is written this way since it is suggestive of how it will be:\n\n\
    Modus ponens:\n\n```\n$\\alpha \\rightarrow \\beta$\\n$\\alpha$\\n$\\rule$\\n$\\\
    beta$\n```\n\nIt is suggestive since if the reader has convinced that $\\alpha\
    \ \rightarrow \beta$ is true and the reader is also convinced that $\\alpha$ is\
    \ true the reader must accept that $\beta$ is true. It does not matter what order\
    \ these first two lines appeared in proof, but we are now permitted to add the\
    \ third. Notice that we indicate general propositions like $\\alpha$; the inference\
    \ rule can be applied for any propositions, whether they are simple variables\
    \ or complex examples.\n\nAnother rule of inference, called modus tollens (the\
    \ method of denying), states that if we know both $(\\alpha \rightarrow \beta)$\
    \ and $\neg \beta$ then we can infer $\neg \\alpha$. Notice that here we are concluding\
    \ the truth of a negation, $\neg \\alpha$. This rule can be justified if we argue\
    \ that if $\\alpha$ were true it would lead to a contradiction. Alternatively\
    \ we can justify it by proving it is a tautology. These two approaches can be\
    \ used for all the inference rules in this chapter.\n\nModus tollens:\n\n```\n\
    $\\alpha \\rightarrow \\beta$\\n$\\neg \\beta$\\n$\\rule$\\n$\\neg \\alpha$\n\
    ```\n\nSeveral important inference rules, including modus ponens and modus tollens,\
    \ appear below in this format Figure 3.1. First, note that each rule has a horizontal\
    \ bar with an assertion below it and some number of assertions above it. The material\
    \ above the bar, known as the premises (or antecedents) must be sufficient to\
    \ justify the conclusion (or consequent), written below the bar. Let $\beta$ be\
    \ the propositional expression that appears below the bar. Above the bar we will\
    \ use $\\alpha$ for a single expression, $\\alpha_1$ and"
