- img_proc: true
  md: '# 3.1 Reasons for Wanting to Prove Things


    Proving things has several benefits to people in general, to technical specialists
    and specifically computer scientists. A correct proof shows you that the particular
    thing proved is true, given that it starts from assumptions. It also shows you
    why it is true, helping you to understand the subject matter more deeply. More
    generally, proofs give good practice in careful thinking.


    Turning to computing, you know that computer programs need to be correct in general
    for all possible data. It is not enough for just to work on a few arbitrary sets
    of data. There are many disaster stories in the real world that turn on software
    error. There are several approaches to software reliability, one of which is actually
    prove that a program is correct. This is discussed in Chapter 6.


    The proving process itself can be automated. In fact, logic programming languages,
    like Prolog, actually work by proving things, as discussed in Appendix A. In other
    programming languages (whether logic-based or not), it is possible to write a
    theorem proof. Another application area for automated reasoning is expert systems.
    These systems apply human-like reasoning to aspects of medicine, science, engineering,
    law, business and education.


    In common reasoning and in ordinary discussion, frequent informal is made of many
    strategies given here, as counter-examples and case analysis. Thus formal proofs
    do not differ from ordinary reasoning so much in what is an acceptable step in
    an argument, but rather in using symbols for precision and in proving quite subtle
    results by long chains of reasoning, involving many different strategies within
    a single proof.'
