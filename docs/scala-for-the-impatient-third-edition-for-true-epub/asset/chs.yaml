  \ | `List` |\n| `asJava/Scala` | `mutable.Set` | `Set` |\n| `asJava/Scala` | `mutable.Map`\
  \ | `Map` |\n| `asJavaDictionary/Scala` | `Map` | `Dictionary` |\n| `asJava/Scala`\
  \ | `concurrent.Map` | `ConcurrentMap` |\n\n注意，这些转换产生的包装器让你可以使用目标接口。例如，如果你使用\n\n\
  点击此处查看代码图片\n\n```\nval props = System.getProperties.asScala\n```\n\n那么 `props` 是一个包装器，其方法调用底层对象。如果你调用\n\
  \n点击此处查看代码图片\n\n```\nprops(\"horstmann.scala\") = \"impatient\"\n```\n\n则包装器会在底层\
  \ `Properties` 对象上调用 `put(\"horstmann.scala\", \"impatient\")`。\n\n要将 Scala 集合转换为\
  \ Java 流（顺序或并行），从语句开始\n\n```\nimport scala.StreamConverters\n```\n\n如果元素类型是基本类型，则生成的\
  \ Java 流是 `DoubleStream`、`IntStream` 或 `LongStream`。\n\n要将 Java 流转换为 Scala 集合，使用\
  \ `toScala` 方法并传递集合类型。\n\n点击此处查看代码图片\n\n```\nval lineBuffer = Files.lines(Path.of(filename)).toScala(Buffer)\n\
