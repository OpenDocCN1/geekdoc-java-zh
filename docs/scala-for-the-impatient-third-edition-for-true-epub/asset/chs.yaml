  \n## 3.7 多维数组\n\n与 Java、JavaScript 或 Python 一样，多维数组被实现为数组的数组。例如，一个 `Double` 值的二维数组的类型为\
  \ `Array[Array[Double]]`。要构造这样一个数组，请使用 `ofDim` 方法：\n\n点击此处查看代码图片\n\n```\nval matrix\
  \ = Array.ofDimDouble // 三行四列\n```\n\n要访问元素，请使用两对括号：\n\n```\nmatrix(row)(column)\
  \ = 42\n```\n\n你可以创建锯齿数组（ragged arrays），其行长度各异：\n\n点击此处查看代码图片\n\n```\nval triangle\
  \ = Array.ofDim[Array[Int]](10)\nfor i <- triangle.indices do\n  triangle(i) = Array.ofDimInt\n\
  ```\n\n## 3.8 与 Java 互操作\n\n由于 Scala 数组被实现为 Java 数组，你可以在 Java 和 Scala 之间来传递它们。\n\
  \n这在几乎所有情况下都有效，除非数组元素类型不是完全匹配。在 Java 中，给定类型的数组会自动转换为其父类型的数组。例如，一个 Java `String[]`\
  \ 数组可以传递给期望 Java `Object[]` 数组的方法。Scala 不允许这种自动转换，因为它是是不安全的。（详细解释请参阅 第 17 章。）\n\n\
  假设你想调用一个带有 `Object[]` 参数的 Java 方法，例如 `java.util.Arrays.binarySearch(Object[] a,\
  \ Object key)`：\n\n点击此处查看代码图片\n\n```\nval a = Array(\"Mary\", \"a\", \"had\", \"\
  lamb\", \"little\")\njava.util.Arrays.binarySearch(a, \"beef\") // 无法工作\n```\n\n\
  这不起作用，是因为 Scala 不会将 `Array[String]` 转换为 `Array[Object]`。你可以这样强制转换：\n\n点击此处查看代码图片\n\
  \n```\njava.util.Arrays.binarySearch(a.asInstanceOf[Array[Object]], \"beef\")\n\
  ```\n\n![图片](img/note.jpg) 笔记\n\n这只是一个示例，展示了如何克服元素差异。如果你想在 Scala 中执行二分查找，请这样做这样做：\n\
  \n点击此处查看代码图片\n\n```\nimport scala.collection.Searching.*\nval result = a.search(\"\
  beef\")\n```\n\n如果元素在位置 `n` 找到，结果为 `Found(n)`；如果元素未找到但应该插入到位置 `n` 之前，则为 `InsertionPoint(n)`。如果你调用一个接收或返回\
  \ `java.util.List` 的 Java 方法，你当然可以在代码中使用 Java 的 `ArrayList`——但这并不美观。相反，请在 `scala.jdk.CollectionConverters`\
  \ 中导入转换方法。然后你可以调用 `asJava` 方法将任何序列（例如 Scala buffer）转换为 Java 列表。例如，`java.lang.ProcessBuilder`\
  \ 类有一个带有 `List<String>` 参数的构造函数。以下是你可以从 Scala 调用它的方法：\n\n点击此处查看代码图片\n\n```\nimport\
  \ scala.jdk.CollectionConverters.*\nimport scala.collection.mutable.ArrayBuffer\n\
  val command = ArrayBuffer(\"ls\", \"-al\", \"/bin\")\nval pb = ProcessBuilder(command.asJava)\
  \ // Scala 到 Java\n```\n\nScala buffer 被封装成一个实现了 `java.util.List` 接口的 Java 对象。相反，当\
  \ Java 方法返回 `java.util.List` 时，你可以将其转换为 `Buffer`：\n\n点击此处查看代码图片\n\n```\nimport scala.jdk.CollectionConverters.*\n\
  import scala.collection.mutable.Buffer\nval cmd: Buffer[String] = pb.command().asScala\
  \ // Java 到 Scala\n// 你不能使用 ArrayBuffer——被封装的对象只保证是 Buffer\n// 在我们的示例中，`cmd == command`。\n\
  \n## 练习题\n\n1. 编写一段代码片段，将 `a` 设置为包含从 `0`（包含）到 `n`（不包含）的 `n` 个整数的数组。\n2. 编写一个循环，交换整数数组中相邻元素。例如，`Array(1,\
  \ 2, 3, 4, 5)` 变为 `Array(2, 1, 4, 3, 5)`。\n\n\n\n\nMap 是键值对的集合。Scala 有一个通用的元组（tuple）概念——即\
  \ `n` 个对象的聚合，这些对象的类型不一定相同。对（pair）简单来说 `n` = 2 的元组。当你需要将两个或多个值聚合在一起时，元组非常有用。\n\n\
  本章的亮点包括：\n\n*   Scala 提供了用于创建、查询和遍历 map 的良好语法。\n*   你需要在可变和不可变 map 之间进行选择。\n*  \
  \ 默认情况下，你得到的是哈希表（hash map），你也可以获取树（tree map）。\n*   你可以轻松地在 Scala 和 Java map 之间转换。\n\
  *   对于可能存在也可能不存在的值使用 `Option` 类型——它比使用 `null` 更安全。\n*   元组对于聚合值有用。\n\n## 4.1 构建\
  \ Map\n\n你可以如下构建一个 map：\n\n点击此处查看代码图像\n\n```\nval scores = Map(\"Alice\" -> 10,\
  \ \"Bob\" -> 3, \"Cindy\" -> 8)\n```\n\n这构建了一个不可变的 `Map[String, Int]`，其内容无法更改。可变\
  \ map 请参阅下一节。\n\n如果你想从一个空 map 开始，你必须提供类型参数：\n\n点击此处查看代码图像\n\n```\nval scores = scala.collection.mutable.Map[String,\
  \ Int]()\n```\n\n在 Scala 中，map 是 `pairs` 的集合。对简单来说是两个值的分组，类型不一定相同，例如 `(\"Alice\"\
  , 10)`。\n\n`->` 运算符创建一个对。以下内容的值：\n\n```\n\"Alice\" -> 10\n```\n\n是\n\n```\n(\"Alice\"\
  , 10)\n```\n\n你完全可以这样定义 map：\n\n点击此处查看代码图像\n\n```\nMap((\"Alice\", 10), (\"Bob\"\
  \ -> 3), (\"Cindy\" -> 8))\n```\n\n`->` 运算符比括号更易于阅读。它还支持这样一种直觉：即 map 数据结构是一种将键映射到值的函数。区别在于函数计算值，而\
  \ map 只是在查找值。\n\n## 4.2 访问 Map 值\n\n在 Scala 中，函数和 map 之间的类比非常接近，因为你使用 `()` 符号来查找键值。\n\
  \n点击此处查看代码图像\n\n```\nscores(\"Bob\")\n  // 类似于 Java 中的 scores.get(\"Bob\") 或 JavaScript、Python\
  \ 或 C++ 中的 scores[\"Bob\"]\n```\n\n如果 map 不包含所请求的键的值，则会抛出异常。\n\n要检查是否存在具有给定值的键，请调用\
  \ `contains` 方法：\n\n点击此处查看代码图像\n\n```\nif scores.contains(\"Donald\") then scores(\"\
  Donald\") else 0\n```\n\n由于这种调用组合非常常见，因此有一个快捷方法：\n\n点击此处查看代码图像\n\n```\nscores.getOrElse(\"\
  Donald\", 0)\n  // 如果 map 包含键 \"Bob\"，则返回该值；否则返回 0。\n```\n\n最后，调用 `map.get(key)`\
  \ 返回一个 `Option` 对象，其值为 `Some(value for key)` 或 `None`。我们在第 56 页 的 4.7 节 “Option\
  \ 类型”中讨论 `Option` 类。\n\n![图像](img/note.jpg) 注意\n\n对于不可变 map，你可以将其转换为一个对不存在键具有固定默认值的\
  \ map，或者计算此类值的函数。\n\n点击此处查看代码图像\n\n```\nval scores2 = scores.withDefaultValue(0)\n\
  scores2(\"Zelda\")\n  // 输出 0，因为 \"Zelda\" 不存在\nval scores3 = scores.withDefault(_.length)\n\
  scores3(\"Zelda\")\n  // 输出 5，对不存在的键应用了长度函数\n```\n\n## 4.3 更新 Map 值\n\n在本节中，我们将讨论可变\
  \ map。以下是构建它的方法：\n\n点击此处查看代码图像\n\n```\nval scores = scala.collection.mutable.Map(\"\
  Alice\" -> 10, \"Bob\" -> 3, \"Cindy\" -> 8)\n```\n\n在可变 map 中，你可以通过在 `=` 左侧使用 `()`\
  \ 来更新 map 值或添加新值：\n\n点击此处查看代码图像\n\n```\nscores(\"Bob\") = 10\n  // 更新键 \"Bob\" 的现有值（假设\
  \ scores 是可变的）\nscores(\"Fred\") = 7\n  // 向 scores 添加新的键/值对（假设它是可变的）\n```\n\n或者，你可以使用\
  \ `++=` 运算符来添加多个：\n\n点击此处查看代码图像\n\n```\nscores ++= Map(\"Fred\" -> 7)\n```\n\n要从\
  \ map 中删除一个键，请使用 `-` 运算符：\n\n点击此处查看代码图像\n\n```\nscores - \"Alice\"\n```\n\n或者，你也可以使用\
  \ `++=` 运算符添加多个关联：\n\n点击此处查看代码图像\n\n```\nscores ++= Map(\"Alice\" -> 10, \"Bob\"\
  \ -> 3)\n```\n\n要从 map 中删除一个键，请使用 `-` 运算符：\n\n点击此处查看代码图像\n\n```\nscores - \"Alice\"\
  \n```\n\n## 4.4 遍历 Map\n\n以下循环遍历键值对：\n\n点击此处查看代码图像\n\n```\nfor (k, v) <- map do\
  \ process(k, v)\n```\n\n如果由于某种原因只想访问键，请使用 `keySet`。`keySet` 方法返回包含元素的集合。\n\n如果你只想访问值，请使用\
  \ `values`。`values` 方法返回一个可以在 `for` 循环使用的 `Iterable`。\n\n点击此处查看代码图像\n\n```\nval\
  \ scores = Map(\"Alice\" -> 10, \"Bob\" -> 7, \"Cindy\" -> 8)\nscores.keySet //\
  \ 输出一个包含 \"Alice\", \"Bob\", \"Cindy\" 的集合\nfor v <- scores.values do println(v)\
  \ //  10 7\n```\n\n\n\n\n如果你想按插入顺序访问键，请使用 `LinkedHashMap`：\n\n点击此处查看代码图片\n\n```\n\
  scala.collection.mutable.LinkedHashMap(\"Fred\" -> 1, \"Alice\" -> 2, \"Bob\" ->\
  \ 3)\n  // 输出为 LinkedHashMap(Fred -> 1, Alice -> 2, Bob -> 3)\n```\n\n如果你想按排序顺序访问键，请使用\
  \ `SortedMap`。\n\n点击此处查看代码图片\n\n```\nscala.collection.SortedMap(\"Fred\" -> 1, \"\
  Alice\" -> 2, \"Bob\" -> 3)\nscala.collection.mutable.SortedMap(\"Fred\" -> 1, \"\
  Alice\" -> 2, \"Bob\" -> 3)\n  // 输出为 TreeMap(Alice -> 2, Bob -> 3, Fred -> 1)\n\
  ```\n\n## 4.6 与 Java 互操作\n\n如果你通过调用 Java 方法获取了 Java Java map，你可能想将其转换为 Scala map，以便使用易用的\
  \ Scala map API。\n\n只需添加一个 `import` 语句即可：\n\n点击此处查看代码图片\n\n```\nimport scala.jdk.CollectionConverters.*\n\
  ```\n\n然后使用 `asScala` 方法将 Java map 转换为 Scala map：\n\n点击此处查看代码图片\n\n```\nval ids\
  \ = java.time.ZoneId.SHORT_IDS.asScala\n  // 生成一个 scala.collection.mutable.Map[String,\
  \ String]\n```\n\n此外，你还可以获得从 `java.util.Properties` 到 `Map[String, String]` 的转换：\n\
  \n点击此处查看代码图片\n\n```\nval props = System.getProperties.asScala\n  // 生成一个 Map[String,\
  \ String]，而不是 Map[Object, Object]\n```\n\n相反，若要将 Scala map 传递给期望 Java map 的方法，请提供相反的转换。例如：\n\
  \n点击此处查看代码图片\n\n```\nimport java.awt.font.TextAttribute.* // 为下面的 map 导入键\nval attrs\
  \ = Map(FAMILY -> \"Serif\", SIZE -> 12) // 一个 Scala map\nval font = java.awt.Font(attrs.asJava)\
  \ // 期望一个 Java map\n```\n\n## 4.7 `Option` 类型\n\n标准库中的 `Option` 类表示可能存在也可能不存在的值。子类\
  \ `Some` 封装了一个值。对象 `None` 则表示没有值。\n\n点击此处查看代码图片\n\n```\nvar friend: Option[String]\
  \ = Some(\"Fred\")\nfriend = None // 没有朋友\n```\n\n这比使用空字符串更具去歧性，且比使用 `null` 表示缺失值更安全。\n\
  \n`Option` 是一个泛型。例如，`Some(\"Fred\")` 是一个 `Option[String]`。\n\n`Map` 类的 `get` 方法返回一个\
  \ `Option`。如果给定的键没有值，`get` 返回 `None`。否则，它会将该值封装在 `Some` 中。\n\n点击此处查看代码图片\n\n```\n\
  val scores = Map(\"Alice\" -> 10, \"Bob\" -> 7, \"Cindy\" -> 8)\nval alicesScore\
  \ = scores.get(\"Alice\") // Some(10)\nval dansScore = scores.get(\"Dan\") // None\n\
  ```\n\n若要找到 `Option` 实例内部的内容，你可以使用 `isEmpty` 和 `get` 方法：\n\n```\nif alicesScore.isEmpty\n\
  \  then println(\"No score\")\n  else println(alicesScore.get)\n```\n\n不过，这样做很繁琐。最好使用\
  \ `getOrElse` 方法：\n\n点击此处查看代码图片\n\n```\nprintln(alicesScore.getOrElse(\"No score\"\
  ))\n```\n\n如果 `alicesScore` 为 `None`，则 `getOrElse` 返回 `\"No score\"`。\n\n![图片](img/note.jpg)\
  \ 注意\n\n`getOrElse` 方法的参数是*惰性*执行的。例如，在以下调用中：\n\n点击此处查看代码图片\n\n```\nalicesScore.getOrElse(System.getProperty(\"\
  DEFAULT_SCORE\"))\n```\n\n只有当 `alicesScore` 为空时，对 `System.getProperty` 才会发生。\n\n\
  这种延迟评估是通过“按名”（by name）参数实现的。详情请参见第 12 章。\n\n处理 option 的更强大方法是将它们考虑为具有零或一个元素的集合。你可以使用\
  \ `for` 循环访问元素：\n\n点击此处查看代码图片\n\n```\nfor score <- alicesScore do println(score)\n\
  ```\n\n如果 `alicesScore` 为 `None`，则什么也不会发生。如果它是 `Some`，则执行循环。\n\n## 4.9 压缩合并 (Zipping)\n\
  \n使用元组的原因之一是将值组合在一起，以便一起进行处理。这通常通过 `zip` 方法实现。例如，以下代码：\n\n点击此处查看代码图片\n\n\n\n\n\n\
  ```\nval symbols = Array(\"<\", \"-\", \">\")\nval counts = Array(2, 10, 2)\nval\
  \ pairs = symbols.zip(counts)\n```\n\n产生一个对的数组\n\n点击此处查看代码图片\n\n```\nArray((\"<\"\
