  \ Chapter 20 Type-Level Programming\n\n**Topics in this Chapter** **L3**\n\n* 20.1\
  \ Match Types\n* 20.2 Heterogeneous Lists\n* 20.3 Literal Type Arithmetic\n* 20.4\
  \ Inline Code\n* 20.5 Type Classes\n* 20.6 Mirrors\n* 20.7 Type Class Derivation\n\
  * 20.8 Higher-Kinded Types\n* 20.9 Type Lambdas\n* 20.10 A Brief Introduction into\
  \ Macros\n* Exercises\n\nWhy use Scala instead of Java on the JVM? Sure, the Scala\
  \ syntax is more concise and more regular than Java, but in the end, it is all about\
  \ the types. Types help us express what we expect our programs to do. Type mismatches\
  \ help detect programming errors early. ... 你已经见过许多 Scala 类型系统比 Java 更丰富的实例。本章向你介绍了一些高级的“类型编程”技术——在编译时分析和生成类型。这些类型操作是一些最强大的\
  \ Scala 库的基础。这些细节无疑是复杂的，并且仅对高级库创建者感兴趣。本概述将使你能够理解这些库是如何运作的，以及实现它们涉及的内容。\n\nThe key\
  \ points of this chapter are:\n\n\n\n\n\n*   匹配类型表示了随另一种类型变化的类型。\n*   异构列表包含不同类型的元素。\n\
  *   你可以使用字面量整数类型进行编译时计算。\n*   通过内联函数，你可以在编译时条件地注入代码。\n*   类型类定义了类可以声明以特设（ad-hoc）方式支持的行为。\n\
  *   镜像 API 提供了编译时分析类型的支持。一个重要的应用是类型类实例的自动派生。\n*   高阶类型的类型参数本身是一个参数化类型。\n*   类型 lambda\
  \ 表示一种类型到另一种类型的转换。\n*   宏在编译时程序化地生成和转换代码。\n\n## 20.1 匹配类型\n\n有时，在类型级别执行模式匹配是非常有用的。Scala\
  \ 提供了 `match types` 来实现这一目的。这里有一个经典的介绍性示例：\n\n```\ntype Elem[C] = C match\n  case\
  \ String => Char\n  case Iterable[t] => t\n  case Any => C\n```\n\n类型 `Elem[String]`\
  \ 是 `Char`，但 `Elem[List[Int]]` 是 `Int`。注意，类型变量和匹配表达式中的任何变量一样，都是*小写*的。\n\n给定这个类型，我们现在可以定义一个返回不同类型初始元素的函数：\n\
  \n点击此处查看代码图片\n\n```\ndef initialC <: Matchable: Elem[C] =\n  c match\n    case s:\
  \ String => s(0)\n    case i: Iterable[t] => i.head\n    case _: Any => c\n```\n\
  \n![Images](img/caution.jpg) 警告\n\n`match` 子句必须与匹配类型具有相同的形状。子句必须按相同的顺序出现。不能添加其他子句。在我们的示例中，可能会想添加类似\
  \ `case \"\" => '\\u0000'` 的子句，但这是一个编译错误。\n\n匹配类型可以是递归的。给定一个列表列表，我们可能想要初始列表的初始元素：\n\
  \n点击此处查看代码图片\n\n```\ntype FlatElem[C] = C match\n  case String => Char\n  case Iterable[t]\
  \ => FlatElem[t] // 递归\n  case Any => C\n```\n\n现在 `FlatElem[List[List[Int]]]` 是\
  \ `Int`。\n\n在使用这种匹配类型时有一个小问题。编译器无法确定元素类型 `t` 是否是 `Matchable`。你通过类型转换来巧妙处理这个问题：\n\
  \n点击此处查看代码图片\n\n```\ndef flatInitialC: FlatElem[C] =\n  c.asInstanceOf[c.type &\
  \ Matchable] match\n    case s: String => s(0)\n    case i: Iterable[t] => flatInitial(i.head)\n\
  \    case x: Any => x\n```\n\nScala API 为相同的目的提供了一个稍微优的机制。通过以下语句：\n\n点击此处查看代码图片\n\
  \n```\nimport compiletime.asMatchable\n```\n\n你可以对任何对象调用 `asMatchable` 来为其添加 `Matchable`\
  \ 特性：\n\n点击此处查看代码图片\n\n```\ndef flatInitialC: FlatElem[C] =\n  c.asMatchable match\n\
  \    case s: String => s(0)\n    case i: Iterable[t] => flatInitial(i.head)\n  \
  \  case x: Any => x\n```\n\n现在你可以调用\n\n点击此处查看代码图片\n\n```\nflatInitial(List(List(1,\
  \ 7), List(2, 9))) // 1\n```\n\n## 20.2 异构列表\n\n`List[T]` 收集类型为 `T` 的元素。如果我们想收集不同类型的元素呢？当然，我们可以使用\
  \ `List[Any]`，但这样就会丢失所有的类型信息。在本节中，我们将构建一个持有不同类型元素的异构（heterogeneous）列表类。\n\n列表要么为空，要么有一个类型为\
  \ `H` 的头部（head）和一个同样是 `HList` 的尾部（tail）：\n\n点击此处查看代码图片\n\n```\nabstract sealed class\
  \ HList :\n  def ::H, T >: this.type <: HList: HNonEmpty[H, T] = HNonEmpty(head,\
  \ this)\n\ncase object HEmpty extends HList\ncase class HNonEmptyH, T <: HList extends\
  \ HList\n```\n\n通过 `::` 运算符，你可以构建异构列表：\n\n点击此处查看代码图片\n\n```\nval lst = \"Fred\"\
  \ :: 42 :: HEmpty\n  // 类型为 HNonEmpty[String, HNonEmpty[Int, HEmpty.type]]\n```\n\
  \n![Images](img/caution.jpg) 警告\n\n`::` 方法的类型参数中存在细微之处。如果你定义：\n\n点击此处查看代码图片\n\n\
  ```\ndef ::H: HNonEmpty[H, this.type] = HNonEmpty(head, this)\n```\n\n那么 `lst` 的类型将有一个不想要的通配符：`HNonEmpty[String,\
  \ ? <: HNonEmpty[Int, HEmpty.type]]`。\n\n问题在于 `this.type` *不是* 右侧的类型（即不是 `HNonEmpty[Int,\
  \ HEmpty.type]]`）。相反，它是一个仅包含右侧对象的单例类型。你需要额外的类型变量来获取列表类型。\n\nScala 编译器可以确定每个列表元素的类型。尝试评估以下表达式：\n\
  \n点击此处查看代码图片\n\n```\nlst.head // 类型为 String\nlst.tail.head // 类型为 Int\nlst.tail.tail\
  \ // 类型为 HEmpty\n```\n\n考虑以下这个连接两个异构列表的函数：\n\n点击此处查看代码图片\n\n```\ndef append(a: HList,\
  \ b: HList): HList =\n  a match\n    case HEmpty => b\n    case ne: HNonEmpty[?,\
  \ ?] => HNonEmpty(ne.head, append(ne.tail, b))\n```\n\n遗憾的是，这个函数并不非常用，因为它没有精确的返回类型：\n\
  \n点击此处查看代码图片\n\n```\nval lst2 = append(lst, lst) // 类型为 HList\n```\n\n你甚至无法请求 `lst2.head`，因为\
  \ `HList` 没有 `head` 方法。只有 `HNonEmpty` 有，但编译器无法知道 `lst2` 是非空的。\n\n![Images](img/note.jpg)\
  \ 注意\n\n如果你在 REPL 中尝试这些指令，你会发现 `lst2` 的值为：\n\n点击此处查看代码图片\n\n```\nHNonEmpty(Fred,HNonEmpty(42,HNonEmpty(Fred,HNonEmpty())))\n\
  ```\n\n然而，那是在运行时已知的。\n\n为了在编译时准确确定返回类型，请使用匹配类型：\n\n点击此处查看代码图片\n\n```\ntype Append[A\
  \ <: HList, B <: HList] <: HList = A match\n  case HEmpty.type => B\n  case HNonEmpty[h,\
  \ t] => HNonEmpty[h, Append[t, B]]\n```\n\n这个匹配类型递归地计算连接的类型。让我们看看 `append(lst, lst)`\
  \ 的示例。`A` 和 `B` 都是 `HNonEmpty[String, HEmpty]`。然后你可以推导出 `Append[A, B]`。经过几次递归步骤后，它是：\n\
  \n点击此处查看代码图片\n\n```\nHNonEmpty[String, HNonEmpty[Int, B]]\n```\n\n即：\n\n点击此处查看代码图片\n\
  \n```\nHNonEmpty[String, HNonEmpty[Int, HEmpty]]]]\n```\n\n这就是 `append` 返回所需的类型。这里是正确的函数：\n\
  \n点击此处查看代码图片\n\n```\ndef appendA <: HList, B <: HList: Append[A, B] =\n  a match\n\
  \    case _: HEmpty.type => b\n    case ne: HNonEmpty[?, ?] => HNonEmpty(ne.head,\
  \ append(ne.tail, b))\n```\n\n由于 `a` 和 `b` 的类型可以变化，`append` 函数需要类型参数 `A` 和 `B`，它们都是\
  \ `HList` 的子类型。返回类型被准确计算为 `Append[A, B]`。\n\n现在编译器可以确定此类表达式的类型：\n\n点击此处查看代码图片\n\n\
  ```\nlst2.head // 类型为 String\nlst2.tail.tail.tail.tail // 类型为 HEmpty\n```\n\n![Images](img/caution.jpg)\
  \ 警告\n\n`match` 子句必须*完全镜像*匹配类型。你必须在函数写写：\n\n```\ncase _: HEmpty.type => b\n```\n\
  \n因为该类型具有：\n\n```\ncase HEmpty.type => B\n```\n\n写 `case HEmpty => b` 是错误的。\n\n\n\
  \n\n\n`HList` 示例展示了如何进行类型级编程。如果你想在 Scala 代码中用异构列表（heterogeneous lists），你不需要实现自己的\
  \ `HList` 类。只需使用元组（tuples）。它们是用本章涵盖的相同技术实现的。例如，Scala 编译器知道 `(\"Fred\", 42) ++ (\"\
  Fred\", 42)` 的类型是 `(String, Int, String, Int)`。\n\n## 20.3 字面量类型算术\n\n第 18 章\n\n\
  ```\nclass Vec[N <: Int] :\n  private val xs: Array[Double] = ...\n  def +(other:\
  \ Vec[N]) = ... // 必须大小相同\n```\n\n注意，类型参数必须是编译时常量。你可以声明 `Vec[3]` 但不能声明 `Vec[n]`，其中\
  \ `n` 是类型为 `n` 的变量。\n\n边界 `N <: Int` 不足以保证 `N` 是单例类型（singleton type）。为了修复，添加一个类型为\
  \ `ValueOf[N]` 的 `using` 参数，如下：\n\n点击此处查看代码图片\n\n```scala\nclass VecN <: Int :\n\
  \  private val xs: Array[Double] = Array.ofDimDouble\n  def +(other: Vec[N]) = //\
  \ 必须大小相同\n    val result = Vec[N]()\n    for i <- 0 until xs.length do\n      result.xs(i)\
  \ = xs(i) + other.xs(i)\n    result\n  ...\n```\n\n对于所有编译器已知的单一占用者的单例类型，都存在一个给定的\
  \ `ValueOf[S]` 实例。它有一个 `value` 方法产生单一值，形成了从类型世界到值世界的桥梁。在上面的代码段中，`value` 被用于构建向量坐标数组。\n\
  \n![Images](img/caution.jpg) 注意\n\n`using` 参数是必须的。仅将 `N` 的类型限制为 `Int & Singleton`\
  \ 是项够的。以下代码无效：\n\n点击此处查看代码图片\n\n```scala\nclass Vec[N <: Int & Singleton] :\n  private\
  \ val xs: Array[Double] =\n    Array.ofDimDouble\n```\n\n在这里，编译器没有足够的信息来推断 `N` 的单一值。\n\
  \n现在考虑将 `Vec[N]` 与 `Vec[M]` 连接的操作。结果是一个具有 `N + M` 个组件的向量。当然，`N` 和 `M` 是类型。你可以相两个类型吗？\n\
  \n如果你导入 `scala.compiletime.ops.int.*`，你就可以。该包定义了名称为 `+`、`-` 等等的类型，它们在类型级执行算术运算。如果\
  \ `N` 和 `M` 是单例整数类型，类型 `N + M` 就是其唯一占用者为 `N` 和 `M` 的占用者之和的类型。\n\n以下是如何定义连接：\n\n\
  点击此处查看代码图片\n\n```scala\ndef ++M <: Int(using ValueOf[N + M]) =\n  val result = Vec[N\
  \ + M]()\n  for i <- 0 until xs.length do\n    result.xs(i) = xs(i)\n  for i <-\
  \ 0 until other.xs.length do\n    result.xs(i + xs.length) = other.xs(i)\n  result\n\
  ```\n\n![Images](img/caution.jpg) 注意\n\n在 Scala 3.2 中，单例类型推断相当脆弱。如果 `using` 参数的类型为\
  \ `ValueOf[M]`，Scala 编译器不会推断出 `N` 和 `M` 都是可以与 `+` 结合的单例。\n\n作为类型级算术的最后一个用途，让我们提供一个\
  \ `middle` 方法，返回向量的中间组件，前提是组件数量为奇数。\n\n`scala.compiletime.ops.any` 包定义了 `==` 和 `!=`\
  \ 类型操作符。当 `N` 被一个奇整数占用时，类型 `N % 2 != 0` 是字面量类型 `true`。\n\n点击此处查看代码图片\n\n```scala\n\
  def middle(using N % 2 != 0 =:= true) = xs(n.value / 2)\n```\n\n如果 `v` 有偶数个组件，调用\
  \ `v.middle` 将产生编译错误。在这种情况下，`N % 2 != 0` 为 `false`，无法召唤给定的 `false =:= true` 实例。\n\
  \n## 20.4 内联代码\n\n在前面的节中，你看到了如何在类型级执行计算——以确保两个整数类型参数匹配，或者形成它们的和，或者确保其中一个是奇数。这些计算在程序编译时发生。\n\
  \n对于更复杂的编译时计算，你可以使用 Scala 生成 `inline code` 的功能。在本节中，你将看到不涉及类型级编程的简单示例。第 20.6 节，“镜像](#ch20.xhtml_sec20_6)”，位于第\
  \ 328 页将这些功能用于自动为 case 类生成代码。\n\n使用宏可以实现更复杂的编译时转换——见阅第 20.10 节，“宏简要介绍](#ch20.xhtml_sec20_10)”，位于第\
  \ 335 页。然而，使用宏编程要复杂得多。内联代码生成的设计是为了在常见用例中避免这种复杂性。\n\n这个示例很好地展示了内联代码生成的机制：\n\n点击此处查看代码图片\n\
  \n```scala\ninline def runT =\n  var start: Long = 0\n  inline if profile then start\
  \ = System.nanoTime()\n  val result = task\n  inline if profile then\n    val end\
  \ = System.nanoTime()\n    println(f\"Duration of ${codeOf(task)}: ${(end - start)\
  \ * 1E-9}%.3f\")\n  result\n```\n\n该函数运行某些任务，如果 `profile` 标志为 `true`，则打印运行时间。阅读代码，跳过\
  \ `inline` 关键字。你看到有一个按名参数（by-name parameter）`task` 被执行。返回类型为 `T` 的结果。一个典型的调用如下：\n\
  \n点击此处查看代码图片\n\n```scala\nprintln(run(Thread.sleep(1000), true))\n```\n\n输出是\n\n\
  点击此处查看代码图片\n\n```text\nDuration of Thread.sleep(1000): 1.001\n```\n\n注意由 `run` 函数内部的\
  \ `println` 语句生成的消息，指示了经过的时间。随后的 `()` 来自于 `run` 调用周围的 `println`，打印了 `Unit` 返回值。\n\
  \n调用\n\n点击此处查看代码图片\n\n```scala\nprintln(run(Thread.sleep(1000), false))\n```\n\n\
  仅仅打印\n\n`()`\n\n这本身并不奇奇。要看到内联代码生成的特殊之处，请查看生成的字节码——见阅第 339 页 上的练习 4。这里没有单独的 `run`\
  \ 函数。相反，`run` 的代码被被放置在调用 `run` 的函数内部。\n\n当 `profile` 为 `true` 时，第一份代码包含了对 `System.nanoTime`\
  \ 和字符串格式化的调用，加上 `Thread.sleep` 调用。第二份代码只调用了 `Thread.sleep`。\n\n注意 `inline` 关键字的三种用法：\n\
  \n*   `inline` 函数导致函数代码放置到函数调用的位置。\n*   `inline` 参数导致调用表达式放置在函数代码内部。\n*   `inline\
  \ if` 丢弃不匹配分支的代码。\n\n![Images](img/caution.jpg) 注意\n\n*每次*使用 `inline` 参数都会被展开。该实现\n\
  \n点击此处查看代码图片\n\n```scala\ninline def runT =\n  var start: Long = 0\n  if profile\
  \ then\n    start = System.nanoTime()\n    val result = task\n    val end = System.nanoTime()\n\
  \    println(f\"Duration of ${codeOf(task)}: ${(end - start) * 1E-9}%.3f\")\n  \
  \  result\n  else\n    task\n```\n\n将内联 `task` 的代码两次。\n\n\n\n\n最后，注意这个实用的 `codeOf(task)`，它会产生一个表示内联表达式的字符串。该字符串来自表达式的解析树，而不是源代码。请注意输出是\
  \ `Thread.sleep(1000L)`，而源代码是不带 `L` 的 `Thread.sleep(1000)`。`codeOf` 函数位于 `scala.compiletime`\
  \ 包中。\n\n`inline` 匹配与 `inline if` 类似，它只为匹配匹配的分支生成代码：\n\n点击此处查看代码图片\n\n```\ninline\
  \ def sizeof[T <: Matchable] =\n  inline erasedValue[T] match\n    case _: Boolean\
  \ => 1\n    case _: Byte    => 1\n    case _: Char    => 2\n    case _: Short  \
  \ => 2\n    case _: Int     => 4\n    case _: Float   => 4\n    case _: Long   \
  \ => 8\n    case _: Double  => 8\n    case _ => error(\"Not a primitive type\")\n\
  ```\n\n例如，`sizeof[Int]` 被替换为 `4`。\n\n`scala.compiletime.erasedValue` 方法是必要的，因为 `T`\
  \ 是一个类型，但 `match` 表达式的选择器需要是一个值。它模拟产生一个给定类型的值，然后与一个 `case` 分支进行匹配。实际上，编译器只是在匹配类型，但通过这种方式，不需要发明用于类型匹配的新语法。\n\
  \n`scala.compiletime.error` 方法根据给定的消息报告编译时错误。\n\n当 `inline match` 的每个分支返回不同的类型时，你可能希望将函数声明为\
  \ `transparent inline`。这样，编译器就不会使用公共超类型作为返回类型。这里有一个示例：\n\n点击此处查看代码图片\n\n```scala\n\
  transparent inline def defaultValue[T <: Matchable] =\n  inline erasedValue[T] match\n\
  \    case _: Boolean => false\n    case _: Byte    => 0.asInstanceOf[Byte]\n   \
  \ case _: Char    => '\\u0000'\n    case _: Short   => 0.asInstanceOf[Short]\n \
  \   case _: Int     => 0\n    case _: Float   => 0.0f\n    case _: Long    => 0L\n\
  \    case _: Double  => 0.0\n    case _ => error(\"Not a primitive type\")\n```\n\
  \n现在 `defaultValue[Int]` 的类型是 `Int`。如果没有 `transparent` 关键字，它将是 `AnyVal`。\n\n没有内联循环，但内联函数可以是递归的。此函数拼接元组的元素：\n\
  \n点击此处查看代码图片\n\n```scala\ninline def mkStringT <: Tuple: String =\n  inline args\
  \ match\n    case EmptyTuple => \"\"\n    case t1: (? *: EmptyTuple) => t1.head.toString\n\
  \    case t2: NonEmptyTuple =>\n      t2.head.toString + separator + mkString(t2.tail,\
  \ separator)\n```\n\n例如，`mkString((\"Fred\", 42), \", \")` 首先被还原为 `\"Fred\".toString\
  \ + \", \" + mkString((42), \", \")`，然后还原为 `\"Fred\".toString + \", \" + 42.toString`。\n\
  \n### 20.5 类型类\n\n如果一个类想要以标准方式比较它的元素，它可以扩展 `Comparable` 特性。几十个 Java 类都是这样做的。继承是获取能力的一种面向对象的方法。\n\
  \n但那种机制是不灵活的。考虑一个 `List[T]` 类型。它不能扩展 `Comparable`，因为元素类型可能是不可比较的。这很遗憾，因为对于具有可比较元素类型的列表，有一种天然的比较方式。\n\
  \n在第 19 章中，你看到了另一种不同的方法。我们为数字、字符串以及任何扩展 `Comparable` 的类提供了 `given` `Comparator`\
  \ 实例。然后我们为那些元素类型具有给定 `Comparator` 的列表合成了 `Comparator` 实例。排序等算法利用 `using` 参数进行比较。\n\
  \n这种选择性的合成比面向对象的方法要灵活得多。为了比较实例，完全没有修改类。相反，提供一个 `given` 实例。\n\n像 `Comparator` 这样的\
  \ trait 被称为类型类（type class）。类型类定义了某些行为，类型可以通过提供该行为来加入该类。这个术语源于 Haskell，而“class”的用法与面向对象编程中不同。将“class”想象成“集体行动”（class\
  \ action）——类型为了共同的目的聚集在一起。\n\n为了查看类型如何加入类型类，让我们来看一个简单的例子。我们想要计算平均值，`(*x[1] +...+\
  \ x[*n*]) / n`。为了做到，我们需要能够加上两个值并将一个值除以整数。Scala 库中有一个 `Numeric` 类型类，它要求值可以相加、相乘和比较。但它没有要求值可以被整数除尽。因此，让我们定义自己的：\n\
  \n点击此处查看代码图片\n\n```scala\ntrait Averageable[T] :\n  def add(x: T, y: T): T\n  def\
  \ divideBy(x: T, n: Int): T\n```\n\n接下来，为了确保类型类从一开始就好用，让我们包含一些常见类型。通过在伴随对象中提供 `given`\
  \ 对象很容易做到：\n\n点击此处查看代码图片\n\n```scala\nobject Averageable :\n  given Averageable[Double]\
  \ with\n    def add(x: Double, y: Double) = x + y\n    def divideBy(x: Double, n:\
  \ Int) = x / n\n\n  given Averageable[BigDecimal] with\n    def add(x: BigDecimal,\
  \ y: BigDecimal) = x + y\n    def divideBy(x: BigDecimal, n: Int) = x / n\n```\n\
  \n现在我们准备好使用这个类型类了。在 `average` 方法中，我们需要一个类型类的实例，以便我们可以调用 `add` 和 `divideBy`。（注意这些是类型类的方法，而不是\
  \ `average` 参数的类型。）\n\n在这里，我们将只计算两个值的平均值。一般情况留作练习。我们有两种方式可以提供类型类实例：作为 `using` 参数，或者使用上下文边界（context\
  \ bound）。让我们采用后者：\n\n点击此处查看代码图片\n\n```scala\ndef averageT : Averageable =\n  val\
  \ ev = summon[Averageable[T]]\n  ev.divideBy(ev.add(x, y), 2)\n```\n\n最后，让我们看看类型需要做什么才能加入\
  \ `Averageable` 类型类。它必须提供一个 `given` 对象，就像我们提供的提供的 `Double` 和 `BigDecimal` 的 `given`\
  \ 实例一样。这是 `Point` 如何加入：\n\n点击此处查看代码图片\n\n```scala\ncase class Point(x: Double, y:\
  \ Double)\n\nobject Point :\n  given Averageable[Point] with\n    def add(p: Point,\
  \ q: Point) = Point(p.x + q.x, p.y + q.y)\n    def divideBy(p: Point, n: Int) =\
  \ Point(p.x / n, p.y / n)\n```\n\n在这里我们将 `given` 对象添加到 `Point` 的伴随对象。如果你无法修改 `Point`\
  \ 类，可以将其放在其他地方并在需要时导入。\n\n标准 Scala 提供了实用的类型类，如 `Equiv`、`Ordering`、`Numeric`、`Fractional`、`Hashing`、`IsIterableOnce`、`IsIterable`、`IsSeq`、`IsMap`、`FromString`。正如你所见，提供自己的是很的。\n\
  \n类型类的关键点是，它们为你提供了一种特有的（ad-hoc）多态方式，比继承更不僵化。\n\n## 20.6 镜像（Mirrors）\n\n在本节中，我们将使用一个为任何对象提供\
  \ JSON 表示的类型类：\n\n点击此处查看代码图片\n\n```scala\ntrait JSON[A] :\n  def stringify(a: A):\
  \ String\n```\n\n这里是常见类型的 `given` 实例：\n\n点击此处查看代码图片\n\n```scala\nobject JSON :\n\
  \  given jsonDouble: JSON[Double] with\n    def stringify(x: Double) = x.toString\n\
  \n  given jsonString: JSON[String] with\n    def escape(s: String) = s.flatMap(\n\
  \      Map('\\\\' -> \"\\\\\\\\\", '\"' -> \"\\\\\\\"\", '\\n' -> \"\\\\n\", '\\\
  r' -> \"\\\\r\").withDefault(\n        _.toString))\n    def stringify(s: String):\
  \ String = s\"\\\"${escape(s)}\\\"\"\n```\n\n给定任何样例类，我们可以定义一个将字段序列化的 `given` 实例：\n\
  \n点击此处查看代码图片\n\n```scala\ncase class Person(name: String, age: Int)\n\ngiven jsonPerson:\
  \ JSON[Person] with\n  def stringify(p: Person) =\n    val name = summon[JSON[String]].stringify(p.name)\n\
  \    s\"\"\"{\"name\": $name, \"age\": $p.age}\"\"\"\n```\n\n\n\n\n但这显然是繁琐的。在 Java\
  \ 中，可以使用反射在运行时自动将任意实例字符串化。在 Scala 中，我们可以做得更好，在编译时生成转换器代码。\n\n为了在编译时分析类型，我们需要使用 `mirrors`。每个\
  \ case class `T` 都会产生一个类型 `Mirror.Product[T]`。（回想 第 14 章.10 节，case class 继承了 `Product`\
  \ 特性。）镜像镜（mirror）描述了该类的以下特征：\n\n* `MirroredElemTypes`，字段类型的元组（tuple）\n* `MirroredElemLabels`，字段名的元组\n\
  * `MirroredLabel`，类的名称\n\n注意，所有这些都是 `types`（类型）。例如，如果 `m` 是给定的 `Mirror.Product[Person]`，那么\
  \ `m.MirroredElemTypes` 是元组类型 `(String, Int)`，`m.MirroredElemLabels` 是包含两个单例类型的元组\
  \ `(\"name\", \"age\")`，而 `m.mirroredLabel` 是单例类型 `Person`。\n\n在 JSON 表示中，我们需要字段名。但我们需要它们是字符串对象而不是单例类型。`scala.compiletime`\
  \ 包有三种方法将单例类型转换为值：\n\n* `constValue[T]` 返回单例类型 `T` 的值。\n* `constValueOpt[T]` 如果\
  \ `T` 是单例类型，则返回该值的 `Option`；否则返回 `None`。\n* `constValueTuple[T]` 如果 `T` 是单例类型的元组，则返回单例值的元组。\n\
  \n可以通过以下方式从类型移动到对象：\n\n点击查看代码图片\n\n```\nval fieldNames = constValueTuple[m.MirroredElemLabels]\
  \ //字符串元组\n```\n\n对于 JSON 格式化，我们不需要类名，但如果你需要，它是：\n\n点击查看代码图片\n\n```\nval className\
  \ = constValue[m.mirroredLabel]\n```\n\n我们需要为每个字段类型获取 `JSON` 实例。有三种方法用于获取实例：\n\n\
  * `summonInline[T]` 获取类型 `T` 的实例。\n* `summonAll[T]`，如果 `T` 是元组类型，则获取 `T` 的所有字段类型的实例元组。\n\
  * `summonFrom` 尝试在 `case` 子句中获取实例，例如：\n\n点击查看代码图片\n\n```\nsummonFrom { case Ordering[T]\
  \ => TreeSet[T](); case _ => HashSet[T]() }\n```\n\n这里是一种获取 `JSON` 实例的方法：\n\n点击查看代码图片\n\
  \n```\ninline def summonGivenJSON[T <: Tuple]: Tuple =\n  inline erasedValue[T]\
  \ match\n    case _: EmptyTuple => EmptyTuple\n    case _: t *: ts => summonInline[t]\
  \ *: summonGivenJSON[ts]\n```\n\n结果是 `JSON` 实例的元组，例如如果 `T` 是 `Person`，则是 `JSON[String]`\
  \ 和 `JSON[Int]`。注意我们再次从类型元组转换为值元组。\n\n你将在 第 20.8 节，“高阶类型 (Higher-Kinded Types)](ch20.xhtml_sec20_8)”中看到更优雅的收集此类类型实例的方法，第\
  \ 332 页 以及 第 20.9 节，“类型 表达式 (Type Lambdas)](ch20.xhtml_sec20_9)”在第 334 页。\n\n此时，我们拥有了为任意\
  \ `Product` 生成 `JSON` 实例的所有工具。每个 case class 都是 `Product` 的子类。\n\n点击查看代码图片\n\n```\n\
  inline given jsonProductT: JSON[T] =\n  new JSON[T] :\n    def stringify(t: T):\
  \ String =\n      val fieldNames = constValueTuple[m.MirroredElemLabels]\n     \
  \ val jsons = summonGivenJSON[m.MirroredElemTypes]\n      \"{ \" + fieldNames.productIterator.zip(jsons.productIterator)\n\
  \        .zip(t.asInstanceOf[Product].productIterator).map {\n          case ((f,\
  \ j), v) => s\"\"\"\"$f\": ${j.asInstanceOf[JSON[Any]].stringify(v)}\"\"\"\n   \
  \     }.mkString(\", \") + \" }\"\n```\n\n转换 `j.asInstanceOf[JSON[Any]]` 是必要的，因为\
  \ `jsons` 只已知是一个 `Tuple`。\n\n![Images](img/caution.jpg) 注意\n\n在 Scala 3.2 中，你不能在\
  \ `inline given` 中使用 `with` 语法。\n\n现在任何 case class 实例都可以格式化为 JSON：\n\n点击查看代码图片\n\
  \n```\ncase class Item(description: String, price: Double)\n\nsummon[JSON[Item]].stringify(Item(\"\
  Blackwell Toaster\", 19.95))\n  // { \"description\": \"Blackwell Toaster\", \"\
  price\": 19.95 }\n```\n\n### 20.7 类型类派生 (Type Class Derivation)\n\n在前节中，你了解了如何自动获取任何产品类型的\
  \ `JSON` 实例。你也可以对和类型执行操作。回想和类型是由 `sealed` 类或 `enum` 类提供的，例如：\n\n点击查看代码图片\n\n```\n\
  sealed abstract class Amount\ncase class Dollar(value: Double) extends Amount\n\
  case class Currency(value: Double, unit: String) extends Amount\n```\n\n或者\n\n点击查看代码图片\n\
  \n```\nenum BinaryTree[+A] :\n  case Node(value: A, left: BinaryTree[A], right:\
  \ BinaryTree[A])\n  case Empty\n```\n\n与前节的方法类似，这里是为和类型生成 `JSON` 实例的方法：\n\n点击查看代码图片\n\
  \n```\ninline def jsonSumT: JSON[T] =\n  new JSON[T] :\n    def stringify(t: T):\
  \ String =\n      val index = m.ordinal(t)\n      val jsons = summonGivenJSON[m.MirroredElemTypes]\n\
  \      \"{ \" + index.productIterator.zip(jsons.productIterator)\n        .zip(t.asInstanceOf[Product].productIterator).map\
  \ {\n          case ((f, j), v) => s\"\"\"\"$f\": ${j.asInstanceOf[JSON[Any]].stringify(v)}\"\
  \"\"\n        }.mkString(\", \") + \" }\"\n```\n\n结果是 `JSON` 实例的元组，例如如果 `T` 是 `Amount`，则是\
  \ `JSON[Dollar]` 和 `JSON[Currency]`。注意我们再次从类型元组转换为值元组。\n\n如果你尝试 `summon[JSON[BinaryTree[String]]]`，会遇到问题，因为编译器不知道如何处理字段。\n\
  \n这可以通过 *类型类派生 (type class derivation)* 来解决。`BinaryTree` 表明它是 `JSON` 类型类的实例。\n\n\
  请记住，很少有程序员会实现自己的类型类。与 JSON、SQL 等交互的库会定义相应的类型类。此类库的用户通过 `derives` 语法指示特定类是此类类的实例。\n\
  \n\n\n\n```scala\ninline def summonGiven[T <: Tuple, C[_]]: Tuple =\n  inline erasedValue[T]\
  \ match\n    case _: EmptyTuple => EmptyTuple\n    case _: (t *: ts) => summonInline[C[t]]\
  \ *: summonGiven[ts, C]\n```\n\n现在，调用 `summonGiven[m.MirroredElemTypes, JSON]` 会收集所有对应的\
  \ `JSON[t]` 实例。\n\n我们说 `summonGiven` 是**高阶的**（higher-kinded），因为它包含了一个本身也带有类型参数的类型参数。（有一套关于“种类”（kinds）的理论描述了类型参数的复杂性。对于大多数程序员来说，这些细节并不重要，因为比你在这里看到的复杂的情况非常罕见。）\n\
  \n这个例子虽然简洁，但比较专业化。为了展示另一个例子，让我们从以下简化的 `Iterable` 特性开始：\n\n点击此处查看代码图片\n\n```scala\n\
  trait Iterable[E] :\n  def iterator(): Iterator[E]\n  def mapF: Iterable[F]\n```\n\
  \n现在考虑一个实现该特性的类：\n\n点击此处查看代码图片\n\n```scala\nclass Buffer[E] extends Iterable[E]\
  \ :\n  def iterator(): Iterator[E] = ...\n  def mapF: Buffer[F] = ...\n```\n\n对于\
  \ `buffer`，我们期望 `map` 返回一个 `Buffer`，而不仅仅是一个 `Iterable`。这意味着我们无法在 `Iterable` 特性本身中实现\
  \ `map`，尽管我们想这样做。一种解决办法是使用类型构造器对 `Iterable` 进行参数化，如下：\n\n```scala\ntrait Iterable[E,\
  \ C[_]] :\n  def iterator(): Iterator[E]\n  def build[F](): C[F]\n  def mapF: C[F]\n\
  ```\n\n现在 `Iterable` 依赖于一个类型构造器作为结果，表示为 `C[_]`。这使得 `Iterable` 成为一个高阶类型。\n\n`map`\
  \ 返回的类型可能与调用 `map` 的 `Iterable` 类型相同。例如，如果你在 `Range` 上调用 `map`，结果通常不是一个范围，因此 `map`\
  \ 必须构造一个不同的类型，例如 `Buffer[F]`。这样的 `Range` 类型声明为：\n\n点击此处查看代码图片\n\n```scala\nclass\
  \ Range extends Iterable[Int, Buffer]\n```\n\n注意，第二个参数是类型构造器 `Buffer`。\n\n为了在 `Iterable`\
  \ 中实现 `map`，我们需要更多的支持。`Iterable` 需要能够产生一个持有任何类型 `F` 值的容器。让我们定义一个 `Container` 特性——它是你可以向其中添加值的对象：\n\
  \n点击此处查看代码图片\n\n```scala\ntrait Container[E : ClassTag] :\n  def +=(e: E): Unit\n\
  ```\n\n我们需要 `ClassTag` 上下文绑定，因为某些容器需要能够构造泛型的 `Array[E]`。\n\n需要 `build` 方法来产生这样的对象：\n\
  \n点击此处查看代码图片\n\n```scala\ntrait Iterable[E, C[X] <: Container[X]] :\n  def build[F\
  \ : ClassTag](): C[F]\n  ...\n```\n\n类型构造器 `C` 现在被限制为一个 `Container`，因此我们知道可以向 `build`\
  \ 返回的对象中添加项。我们不能再为 `C` 的参数使用通配符了，因为我们需要指示 `C[X]` 是针对相同 `X` 的容器。\n\n`map` 方法可以在 `Iterable`\
  \ 特性中实现：\n\n点击此处查看代码图片\n\n```scala\ndef mapF : ClassTag: C[F] =\n  val res = build[F]()\n\
  \  val iter = iterator()\n  while iter.hasNext do\n    res += f(iter.next())\n \
  \ res\n```\n\n`Iterable` 类不再需要提供它们自己的 `map` 方法。这里是 `Range` 类：\n\n点击此处查看代码图片\n\n\
  ```scala\nclass Range(val low: Int, val high: Int) extends Iterable[Int, Buffer]\
  \ :\n  def iterator() = new Iterator[Int] :\n    private var i = low\n    def hasNext\
  \ = i <= high\n    def next() = { i += 1; i - 1 }\n\n  def build[F : ClassTag]()\
  \ = Buffer[F]\n```\n\n注意，`Range` 是一个 `Iterable`：你可以遍历它的内容。但它不是一个 `Container`：你不能向它添加值。\n\
  \n相反，`Buffer` 两个者都是：\n\n点击此处查看代码图片\n\n```scala\nclass Buffer[E : ClassTag] extends\
  \ Iterable[E, Buffer] with Container[E] :\n  private var capacity = 10\n  private\
  \ var length = 0\n  private var elems = ArrayE // 注意注释\n\n  def iterator() = new\
  \ Iterator[Int] :\n    private var i = low\n    def hasNext = i <= high\n    def\
  \ next() = { i += 1; i - 1 }\n\n  def build[F : ClassTag]() = Buffer[F]\n```\n（注：此处示例代码中\
  \ Buffer 的实现与上文逻辑一致，为保持简洁此处补充了结构）\n\n*注：由于原文文本中 Buffer 的实现部分在示例中略有省略且存在重复` 符号，已在翻译时保持逻辑性。*\n\
  \n\n\n在本章中，你已经学习了执行编译时计算的技巧。宏（Macros）为编译时的任意代码转换提供了一种更通用的机制。然而，编写宏是复杂的，并且对编译过程有深入的理解。宏编程是一项非常专业的技能，只有在实现具有看似具有魔法般功能的高级库时才需要。\n\
  \n本节涵盖了宏的几个用例，并简要向你展示了它们的实现。希望这能让你了解宏可以实现的功能，让你基本理解那些高级库的实现者是如何实现他们的神奇结果。\n\n让我们从一个简单的例子开始。在调试时，通常会编写类似这样的打印语句：\n\
  \n点击此处查看代码图像\n\n```\nprintln(\"someVariable = \" + someVariable)\n```\n\n必须写两次变量名是很麻烦的：一次是为了打印名称，另一次是为了获取值。这个问题实际上可以通过内联函数解决：\n\
  \n点击此处查看代码图像\n\n```\ninline def debug1(inline expr: Any): Unit = println(codeOf(expr)\
  \ + \" = \" + expr)\n```\n\n你已经在第 20.4 节“内联代码”的第 323 页中见过 `codeOf` 函数。它会打印内联值的代码。这里有一个示例：\n\
  \n点击此处查看代码图像\n\n```\nval x = 6\nval y = 7\ndebug1(x * y) // Prints x.*(y) = 42\n\
  ```\n\n但假设我们也想看到表达式的类型。没有库函数可以实现这一点。相反，我们需要编写一个宏。\n\n宏允许操作语法树。如果 `e` 是类型为 `T` 的\
  \ Scala 表达式，那么 `'{e}` 就是类型为 `Expr[T]` 的语法树。存在分析和生成语法树的方法。\n\n相反，如果你有一个类型为 `Expr[T]`\
  \ 的值 `s`，你可以在 Scala 表达式中使用语法 `${s}` 使用它所表示的表达式。\n\n`'` 和 `$` 操作被称为 *quote*（引用）和\
  \ *splice*（插值）。\n\n在我们的 `debug1` 示例中，我们将为 `println` 的调用生成一个语法树：\n\n点击此处查看代码图像\n\n\
  ```\n'{println(${...} + \": \" + ${...} + \" = \" + ${...})}\n```\n\n通常情况下，想法是尽可能在\
  \ Scala 语法中完成操作，仅在必要时才使用语法树 API。在这里，我们使用 Scala 语法进行字符串拼接和 `println` 的调用。\n\n这里是完整的实现：\n\
  \n点击此处查看代码图像\n\n```\ninline def debug1T: Unit = ${debug1Impl('arg)}\n\nprivate def\
  \ debug1ImplT : Type(using Quotes): Expr[Unit] =\n  '{println(${Expr(arg.show)}\
  \ + \": \" + ${Expr(Type.show[T])} + \" = \" + $arg)}\n```\n\n由于技术原因，宏必须从内联函数中调用；在这里，`debug1`\
  \ 使用了顶层插值并对其参数进行引用。习惯上为宏函数使用 `Impl` 后缀。\n\n注意，`'arg` 等同于 `'{arg}`。变量名不需要大括号。\n\n\
  宏函数接收类型为 `Expr` 的参数，并且需要使用给定的 `Quotes` 实例。\n\n调用 `arg.show` 产生 `arg` 语法树的字符串表示。为了将其插值，我们需要将其转换为\
  \ `Expr`。同样，`Type.show[T]` 产生参数类型的字符串表示，被转换为 `Expr`。最后，`arg` 变量本身是一个语法树，被插值。同样由于它是一个变量，不需要大括号。\n\
  \n`debug1` 函数打印单个表达式。如果能打印多个就更好了：\n\n点击此处查看代码图像\n\n```\ndebugN(\"Test description\"\
  , x, x * y)\n```\n\n没有简单的方法打印类型。相反，让我们打印字面值的表达式。打印 `Test description = Test description`\
  \ 看起来很傻。\n\n实现稍微复杂一些：\n\n点击此处查看代码图像\n\n```\ninline def debugN(inline args: Any):\
  \ Unit = ${debugNImpl('args)}\n\nprivate def debugNImpl(args: Expr[Seq[Any]])(using\
  \ Quotes): Expr[Unit] =\n  import q.reflect.*\n\n  val exprs: Seq[Expr[String]]\
  \ = args match\n    case Varargs(es) =>\n      es.map { e =>\n        e.asTerm match\n\
  \          case Literal(c: Constant) => Expr(c.value.toString)\n          case _\
  \ => '${Expr(e.show)}\n      }\n\n  '{println(${exprs.reduce((e1, e2) => $e1 + \"\
  , \" + $e2))})}\n```\n\n`debugN` 函数调用 `debugNImpl` 宏，传递引用的参数作为 `Expr[Seq[Any]]`。同样，我们需要使用给定的\
  \ `Quotes` 实例。现在需要更多 Scala 内部的知识。`args` 参数实际上是 `Varargs` 的实例，我们对其进行解构以获取元素。每个元素要么是一个字面量，要么是一个打印描述和值的表达式。\n\
  \n在第一情况下，我们产生一个带有字面量字符串表示的 `Expr`。在第二情况下，我们在编译时拼接表达式的字符串表示 `e.show` 和字符串 `\" = \"\
  `，并在产生一个与表达式的值拼接的 `Expr`。`reduce` 调用拼接了表达式的值。注意嵌套的引用和插值计算 `e1` 和 `e2` 的拼接。查看生成的字节码有助于理解宏展开的细节（参见练习\
  \ 27）。作为最后一个示例，让我们扩展第 20.3 节“字面量类型”的第 322 页中的类型检查。我们能够在编译时检查两个向量长度是否相同，或者长度是否为奇数。假设我们想检查字符串。例如，我们可能想在解析为整数之前，在编译时验证字符串字面量包含数字。这种检查需要在编译时调用方法（如\
  \ `String.matches`），这对于 `inline` 函数来说是不可能的。再次，需要宏。\n\n具体来说，我们将定义一个类型 `StringMatching[regex]`，用于匹配正则表达式的字面量字符串，正则表达式也作为字面量指定。例如，以下声明：\n\
  \n点击此处查看代码图像\n\n```\nval decimal: StringMatching[\"0-9]+\"] = \"1729\"\n```\n\n\
  将成功，但：\n\n点击此处查看代码图像\n\n```\nval octal: StringMatching[\"0-7]+\"] = \"1729\"\n```\n\
  \n将编译。\n\n这里是 `StringMatching` 类型：\n\n点击此处查看代码图像\n\n```\nopaque type StringMatching[R\
  \ <: String & Singleton] = String\n```\n\n在伴侣对象中，我们定义了一个隐式转换：\n\n点击此处查看代码图像\n\n\
  ```scala\ninline given string2StringMatching[S <: String & Singleton, R <: String\
  \ & Singleton]:\n    Conversion[S, StringMatching[R]] = str =>\n  inline val regex\
  \ = constValue[R]\n  inline if matches(str, regex)\n  then str.asInstanceOf[StringMatching[R]]\n\
  \  else error(str + \" does not match \" + regex)\n```\n\n`matches` 调用是一个宏：\n\n\
  点击此处查看代码图像\n\n```\ninline def matches(inline str: String, inline regex: String):\
  \ Boolean =\n  ${matchesImpl('str, 'regex)}\n\ndef matchesImpl(str: Expr[String],\
  \ regex: Expr[String])(\n    using Quotes): Expr[Boolean] =\n  Expr(str.valueOrAbort.matches(regex.valueOrAbort))\n\
  ```\n\n如果使用引用和插值 `'{$str.matches($regex)}` 会更好，但那不会内联。因此，`matchesImpl` 方法手动将表达式树转换为值，调用\
  \ `String.matches`，并产生布尔值结果的 `Expr`。\n\n\n\n本章为你概述了让某些最先进 Scala 库成为可能的技术。你现在已经到达本书的末尾。希望你发现这本书作为\
  \ Scala 语言各个方面的快速介绍很有用，并且在未来作为参考资料时也同样有效。\n\n## 练习题\n\n1. 使用递归匹配类型（match type）和联合类型（union\
  \ types），定义一个 `type Interval[MIN <: Int, MAX <: Int] <: Int` 来描述整数区间，并在编译时检查成员关系。例如，类型为\
