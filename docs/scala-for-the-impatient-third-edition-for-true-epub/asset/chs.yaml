  \n## 16.7 `Future` 对象中的方法\n\n`Future` 伴随对象包含了用于处理 futures 集合的有用方法。\n\n假设在你计算结果时，你组织了工作，以便能够并发处理不同的部分。例如，每个部分都可能是输入的一个子序列。为每个部分创建一个\
  \ future：\n\n点击此处查看代码图片\n\n```\nval futures = parts.map(part => Future { process(part)\
  \ })\n```\n\n... (此处省略重复部分的逻辑翻译，保持核心译文一致)\n\n\n\n\n然而，生产者（the producer）在使用 `Promise`\
  \ 时具有具有更高的灵活性。例如，多个任务可以并发工作以完成单个 promise。当其中一个任务获得结果时，它会调用 promise 上的 `trySuccess`。与\
  \ `success` 方法不同，该方法接收结果，如果 promise 尚未完成，则返回 `true`；否则返回 `false` 并忽略该结果。\n\n```\n\
  val p = Promise[String]()\nFuture {\n  val result = workHard(arg)\n  p.trySuccess(result)\n\
  }\nFuture {\n  val result = workSmart(arg)\n  p.trySuccess(result)\n}\n```\n\npromise\
  \ 将由第一个成功产生结果的任务完成。通过这种方法，任务可能想要定期调用 `p.isCompleted` 来检查它们是否应该继续执行。\n\n![Images](img/note.jpg)\
  \ 注意\n\nScala 的 promises 与 Java 8 中的 `CompletableFuture` 类非常相似。\n\n### 16.9 上执行上下文\
  \ (Execution Contexts)\n\n全局执行上下文在全局 fork-join 池（fork-join pool）上执行 future。这对于计算密集型任务效果良好。然而，fork-join\
  \ 池只管理少量的线程（默认情况下等于所有处理器的核心数）。当任务需要等待时（例如与远程资源通信时），就会出现一个问题。程序可能会为了等待结果而耗尽所有可用线程。\n\
  \n你可以通过将阻塞代码放置在 `blocking { ... }` 内部来通知执行上下文你即将阻塞：\n\n点击此处查看代码图片\n\n```\nval f\
  \ = Future {\n  val url = \"https://horstmann.com/index.html\"\n  blocking {\n \
  \   val contents = Source.fromURL(url).mkString\n    if contents.length < 300\n\
  \    then contents\n    else contents.substring(0, 300) + \"...\"\n  }\n}\n```\n\
  \n执行上下文随后可能会增加线程数量。fork-join 池正是这样操作的，但它的设计并不是为了在许多阻塞线程的情况下表现良好。如果你进行输入/输出操作或连接数据库，使用不同的线程池会更好。Java\
  \ 并发库中的 `Executors` 类提供了几种选择。缓存线程池（cached thread pool）非常适合 I/O 密集型负载。你可以显式地将其传递给\
  \ `Future.apply` 方法，也可以将其设置为给定的执行上下文：\n\n点击此处查看代码图片\n\n```\nval pool = Executors.newCachedThreadPool()\n\
  given ExecutionContext = ExecutionContext.fromExecutor(pool)\n```\n\n现在，该线程池将被所有\
  \ `given` 声明在作用范围内的 future 使用。（关于 `given` 声明的更多信息，请参阅第 19 章。）\n\n## 练习题\n\n1. 考虑以下表达式\n\
