  \ || \"JVM\" | \"JVM, .NET\"\n```\n\n应该产生：\n\n点击此处查看代码图片\n\n```\n<table><tr><td>Java</td><td>Scala</td></tr><tr><td>Gosling...\n\
  ```\n\n6. 实现一个 `ASCIIArt` 类，其对象包含如下图形：\n\n```\n /\\_/\\\n( ' ' )\n(  -  )\n | |\
  \ |\n(__|__)\n```\n\n提供用于水平组合两个 `ASCIIArt` 图形的运算符：\n\n点击此处查看代码图片\n\n```\n /\\_/\\\
  \n( ' ' )\n(  -  )\n | | |\n(__|__)\n```\n\n\n\n\n\n# 本章主题 L1\n\n* 12.1 函数作为值\n\
  * 12.2 匿名函数\n* 12.3 作为函数的参数\n* 12.4 参数推断\n* 12.5 易用的高阶函数\n* 12.6 闭包\n* 12.7 与 Lambda\
  \ 表达式的互操作性\n* 12.8 柯里化\n* 12.9 组合、柯里化和元组化的方法\n* 12.10 控制抽象\n* 12.11 `return` 表达式\n\
  * 练习题\n\nScala 将面向对象与函数式特性结合在一起。在函数式编程语言中，函数是一等公民，可以像其他数据类型一样被传递和操作。当你想要向算法传递某些操作细节时，这非常有用。在函数式语言中，你只需要将这些细节封装进函数并作为参数传递。在本章中，你将看到如何高效使用使用或返回函数的。\n\
  \n本章的亮点包括：\n\n* 函数是 Scala 中的“一等公民”，就像数字一样。\n* 你可以创建匿名函数，通常是为了将它们传递给其他函数。\n* 作为函数的参数指定了稍后执行的行为。\n\
  * 许多集合方法接受函数参数，将函数应用于集合的值上。\n* 有些语法快捷方式，允许你以短且易读的方式表示函数参数。\n* 你可以创建在代码块上操作的函数，看起来与内置控制语句非常相似。\n\
  \n### 12.1 函数作为值\n\n在 Scala 中，函数是一等公民，就像数字一样。你可以将函数存储在变量中：\n\n```\nimport scala.math.*\n\
  val num = 3.14\nval fun = ceil\n```\n\n这段代码将 `num` 设置为 `3.14`，将 `fun` 设置为 `ceil`\
  \ 函数。\n\n当你在 REPL 中尝试这段代码时，意料之中，`num` 的类型是 `Double`。`fun` 的类型报告为 `Double => Double`——即一个接收并返回\
  \ `Double` 的函数。\n\n你可以对函数做什么呢？做两件事：\n\n* 调用它。\n* 传递它，通过将其存储在变量中或作为参数传递给函数。\n\n以下是调用存储在\
  \ `fun` 中的函数的方法：\n\n```\nfun(num) // 4.0\n```\n\n你可以看到，使用的是普通的函数调用语法。唯一的区别是 `fun`\
  \ 是一个包含函数的变量，而不是一个固定的函数。\n\n以下是如何将 `fun` 传递给另一个函数：\n\n```\nArray(3.14, 1.42, 2.0).map(fun)\
  \ // Array(4.0, 2.0, 2.0)\n```\n\n`map` 方法接受一个函数，将其应用于数组中的所有值，并返回一个带有函数值的数组。在本章中，你将看到许多其他接受函数作为参数的方法。\n\
  \n## 12.2 匿名函数\n\n在 Scala 中，你不需要给每个函数命名，就像你不需要给每个数字命名一样。这里有一个匿名函数：\n\n```\n(x: Double)\
  \ => 3 * x\n```\n\n这个函数将它的参数乘以 3。\n\n当然，你可以将此函数存储在变量中：\n\n```\nval triple = (x:\
  \ Double) => 3 * x\n```\n\n这就好像你使用了 `def` 一样：\n\n```\ndef triple(x: Double) = 3\
  \ * x\n```\n\n但你不需要给函数命名。你只需要将它传递给另一个函数：\n\n```\nArray(3.14, 1.42, 2.0).map((x:\
  \ Double) => 3 * x)\n  // Array(9.42, 4.26, 6.0)\n```\n\n在这里，我们告诉 `map` 方法：“将每个元素乘以\
  \ 3。”\n\n如果你愿意，可以使用大括号而不是括号来包裹函数参数，例如：\n\n```\nArray(3.14, 1.42, 2.0).map{(x: Double)\
  \ => 3 * x}\n```\n\n### 12.3 作为函数的参数\n\n高阶函数是指接受另一个函数作为参数或返回一个函数。这里有一个接收另一个函数的示例：\n\
  \n```scala\ndef apply(x: Int, f: Int => Int): Int = f(x)\napply(5, n => n * 2) //\
  \ 10\n```\n\n这里是一个返回另一个函数的示例：\n\n```scala\ndef multiplier(x: Int): Int => Int =\
  \ y => x * y\nval triple3 = multiplier(3)\ntriple3(10) // 30\n```\n\n### 12.4 参数推断\n\
  \n当你将匿名函数传递给另一个函数或方法时，Scala 会尽可能通过推断类型来帮助你。例如，你不需要写：\n\n```\nvalueAtQuarter((x:\
  \ Double) => 3 * x) // 0.75\n```\n\n由于 `valueAtQuarter` 方法知道你将传递一个 `(Double) =>\
  \ Double` 函数，你只需要写：\n\n```\nvalueAtQuarter((x) => 3 * x)\n```\n\n作为特别奖励，对于只有一个参数的函数，你可以省略参数周围的\
  \ `()`：\n\n```\nvalueAtQuarter(x => 3 * x)\n```\n\n\n\n\n更棒了。如果一个参数在 `=>` 的右侧只出现一次，你可以用下划线\
  \ `_` 来替换它：\n\n```\nvalueAtOneQuarter(3 * _)\n```\n\n这是极致的舒适体验，而且非常易读：一个将某个值乘以 3\
  \ 的函数。\n\n请记住，这些快捷方法只在参数类型已知时才有效。\n\n点击此处查看代码图片\n\n```\nval fun = 3 * _ // Error:\
  \ 无法推断类型\n```\n\n你可以为匿名参数或变量指定一个类型：\n\n点击此处查看代码图片\n\n```\n3 * (_: Double) // OK\n\
  val fun: (Double) => Double = 3 * _ // OK，因为我们为 fun 指定了类型\n```\n\n当然，最后一种定义是刻意的。但它展示了当函数传递给参数（该参数恰好具有该类型）时会发生什么。\n\
  \n![Images](img/tip.jpg) 提示\n\n指定 `_` 的类型对于将方法转换为函数非常有用。例如，`(_: String).length`\
  \ 是一个 `String => Int` 的函数，而 `(_: String).substring(_:Int, _: Int)` 是一个 `(String,\
  \ Int, Int) => String` 的函数。\n\n## 12.5 有用的高阶函数\n\n熟悉高阶函数的好方法是练习 Scala 集合库中一些常见的（显然是有用的）方法，这些方法接受函数参数。\n\
  \n你已经见过了 `map`，它将函数应用于集合的所有元素并返回结果。这里提供了一种生成包含 `0.1`、`0.2`……`0.9` 集合的快速方法：\n\n```\n\
  (1 to 9).map(0.1 * _)\n```\n\n![Images](img/note.jpg) 注意\n\n这里有一个通用的原理。如果你想要一个值的序列，看看是否可以从一个更简单的序列转换过来。\n\
  \n尝试这样做打印一个三角形：\n\n点击此处查看代码图片\n\n```\n(1 to 9).map(\"*\" * _).foreach(println _)\n\
  ```\n\n结果是\n\n```\n*\n**\n***\n****\n*****\n******\n*******\n********\n*********\n\
  ```\n\n在这里，我们也使用了 `foreach`，它和 `map` 的区别在于它的函数不返回任何值。`foreach` 方法简单地将函数应用于每个参数上。\n\
  \n`filter` 方法产生所有符合特定条件的元素。例如，这里是获取序列中偶数的方法：\n\n点击此处查看代码图片\n\n```\n(1 to 9).filter(_\
  \ % 2 == 0) // 2, 4, 6, 8\n```\n\n当然，这并不是获取此结果 ![Images](img/common.jpg) 最有效的方法。\n\
  \n`reduceLeft` 方法接受一个二元函数——即具有两个参数的函数——并从左到右将其应用于序列的所有元素。例如，\n\n```\n(1 to 9).reduceLeft(_\
  \ * _)\n```\n\n等同于\n\n点击此处查看代码图片\n\n```\n1 * 2 * 3 * 4 * 5 * 6 * 7 * 8 * 9\n```\n\
  \n或者，严格来说，\n\n```\n(...((1 * 2) * 3) * ... * 9)\n```\n\n注意这个乘法函数的紧凑形式：`_ * _`。每个下划线表示一个独立的参数。\n\
  \n你还需要一个二元函数来进行排序。例如，\n\n点击此处查看代码图片\n\n```\n\"Mary had a little lamb\".split(\"\
  \ \").sortWith(_.length < _.length)\n```\n\n产生一个按长度增加排序的数组：`Array(\"a\", \"had\"\
  , \"Mary\", \"lamb\", \"little\")`。\n\n## 12.6 闭包\n\n在 Scala 中，你可以在任何作用范围内定义函数：在包内、类内，甚至在另一个函数或方法内部。在函数体内，你可以访问封闭作用域内的任何变量。这听起来可能并不神奇，但请注意，你的函数可能在变量不再作用域内时被调用。\n\
  \n这里有一个例子：来自第 12.3 节“函数的参数”、第 171 页的 `mulBy` 函数。\n\n点击此处查看代码图片\n\n```\ndef mulBy(factor\
  \ : Double) = (x : Double) => factor * x\n```\n\n考虑这些调用：\n\n点击此处查看代码图片\n\n```\n\
  val triple = mulBy(3)\nval half = mulBy(0.5)\nprintln(s\"${triple(14)} ${half(14)}\"\
  ) // 打印 42.0 7.0\n```\n\n让我们慢动作观察它们。\n\n1. 第一次调用 `mulBy` 将 `factor` 设置为 `3`。\n2.\
  \ 接下来，`mulBy(0.5)` 将 `factor` 设置为 `0.5`。`mulBy(0.5)` 的结果是 `(x) => 0.5 * x`。当它被传入\
  \ `14` 时，返回 `7.0`。\n3. 第一次调用 `mulBy(3)` 将 `factor` 设置为 `3`。`mulBy(3)` 的结果是 `(x)\
  \ => 3 * x`。当它被传入 `14` 时，返回 `42.0`。\n\n闭包是携带了定义时作用域内变量的对象。即使这些变量不再在作用域内，闭包也能访问它们。\n\
  \n指定 `_` 的类型对于将方法转换为函数有用。例如，`(_: String).length` 是一个 `String => Int` 的函数，而 `(_:\
  \ String).substring(_:Int, _: Int)` 是一个 `(String, Int, Int) => String` 的函数。\n\n\
  ![Images](img/note.jpg) 注意\n\n闭包并不困难或意外。JavaScript、Ruby 和 Python 等现代语言都支持闭包。\n\n\
  ## 12.7 与 Lambda 表达式的互操作\n\n在 Scala 中，当你想要将函数作为参数传递时，可以使用 Lambda 表达式。在 Java 中，从\
  \ 8 版本开始也使用 Lambda 表达式。\n\n为了将函数传递给 Java 接口，必须是一个函数接口——即只有一个抽象方法的接口。这里有一个例子：\n\n\
  点击此处查看代码图片\n\n```\nvar button = JButton(\"Increment\")\n```\n\n注意，从 Scala 函数到 Java\
  \ 接口的转换适用于*字面量*，但不适用于变量。以下代码无效：\n\n点击此处查看代码图片\n\n```\nval listener = (event: ActionEvent)\
  \ => println(counter)\nbutton.addActionListener(listener)\n```\n\n最简单的解决方法是将持有函数的变量声明为函数接口：\n\
  \n点击此处查看代码图片\n\n```\nval listener: ActionListener = event => println(counter)\n\
  ```\n\n或者，你可以将函数变量转换为字面量：\n\n点击此处查看代码图片\n\n```\nval exit = (event: ActionEvent)\
  \ => if counter > 9 then System.exit(0)\nbutton.addActionListener(exit(_))\n```\n\
  \n## 12.8 柯里化 (Currying)\n\n柯里化（以逻辑学家 Haskell Brooks Curry 命名）是将一个具有两个参数的函数转换为具有一个参数的函数的过程。该函数返回另一个接受第二个参数的函数。\n\
  \n哈？让我们看一个例子。这个函数具有两个参数：\n\n点击此处查看代码图片\n\n```\nval mul = (x: Int, y: Int) => x *\
  \ y\n```\n\n这个函数有一个参数，产生一个带一个参数的函数：\n\n点击此处查看代码图片\n\n```\nval mulOneAtATime = (x:\
  \ Int) => ((y: Int) => x * y)\n```\n\n要相乘两个数，你调用\n\n```\nmulOneAtATime(6)(7)\n```\n\
  \n严格来说，`mulOneAtATime(6)` 的结果是 `(y: Int) => 6 * y`。该函数被应用于 `7`，产生 `42`。\n\n当你使用\
  \ `def` 时，Scala 中提供了一种定义此类柯里化方法的快捷方法：\n\n\n\n\n点击此处查看代码图像\n\n```scala\ndef divOneAtATime(x:\
  \ Int)(y: Int) = x / y\n```\n\n如你所见，多个参数仅仅是一种装饰，而不是编程语言的本质特征。这是一个有趣的理论见，但它在 Scala\
  \ 中有一个实际用途。有时，你可以对方法参数使用**柯里化**（currying），以便类型推断器拥有更多信息。\n\n这是一个典型的例子。`corresponds`\
  \ 方法可以根据某些比较标准比较两个序列是否相同。例如，\n\n点击此处查看代码图像\n\n```scala\nval a = Array(\"Mary\",\
  \ \"had\", \"a\", \"little\", \"lamb\")\nval b = Array(4, 3, 1, 6, 5)\na.corresponds(b)(_.length\
  \ == _)\n```\n\n注意，函数 `_.length == _` 是作为一个柯里化参数传递的，位于一组独立的 `(...)` 中。当你查看 Scaladoc\
  \ 时，你会发现 `corresponds` 声明为：\n\n点击此处查看代码图像\n\n```scala\ndef correspondsB(p: (A, B)\
  \ => Boolean): Boolean\n```\n\n`that` 序列和谓词函数 `p` 是独立的柯里化参数。类型推断器可以根据 `that` 的类型判断出\
  \ `B` 是什么，然后在分析传递给 `p` 的函数时使用该信息。\n\n在我们的示例中，`that` 是一个 `Int` 序列。因此，预期谓词类型为 `(String,\
  \ Int) => Boolean`。有了这些信息，编译器可以接受 `_.length == _` 作为 `(a: String, b: Int) => a.length\
  \ == b` 的简写。\n\n### 12.9 用于组合、柯里化和元组的方法\n\n单元函数是指只有一个参数的函数。所有单元函数都是 `Function1`\
  \ 特性的实例。该特性定义了一个组合两个单元函数的方法——即执行一个，然后将结果传递给另一个。\n\n假设我们想确保不计算负值的平方根。那么我们可以将平方根函数与绝对值函数组合：\n\
  \n点击此处查看代码图像\n\n```scala\nval sqrt = scala.math.sqrt\nval fabs: Double => Double\
  \ = scala.math.abs\n  // 需要类型是因为 abs 是重载的\nval f = sqrt compose fabs // 中置符号；也可以写成\
  \ sqrt.compose(fabs)\nf(-9) // 产生 sqrt(fabs(-9)) 或 3\n```\n\n注意第二个函数是先执行的，因为函数是从右向左应用的。如果你觉得这不自然，请改使用\
  \ `andThen` 方法：\n\n点击此处查看代码图像\n\n```scala\nval g = fabs andThen sqrt // 与 sqrt compose\
  \ fabs 相同\n```\n\n具有多个参数的函数有一个 `curried` 方法，用于产生函数的柯里化版本。\n\n点击此处查看代码图像\n\n```scala\n\
  val fmax : (Double, Double) => Double = scala.math.max\n  // 需要类型是因为 max 是重载的\n\
  fmax.curried // 类型为 Double => Double => Double\nval h = fmax.curried(0)\n```\n\n\
  函数 `h` 有一个参数，且 `h(x) = fmax.curried(0)(x) = fmax(0, x)`。返回正参数，负参数则产生零。\n\n`tupled`\
  \ 方法将具有多个参数的函数转换为接收元组的单元函数。\n\n点击此处查看代码图像\n\n```scala\nval k = mul.tupled // 类型为\
  \ ((Int, Int)) => Int\n```\n\n调用 `k` 时，你提供一个元组，其组件会被传递给 `mul`。例如，`k((6, 7))` 的结果是\
  \ `42`。\n\n这听起来很抽象，但有一个实际用途。假设你有两个数组，分别持有第一个和第二个参数。\n\n点击此处查看代码图像\n\n```scala\n\
  val xs = Array(1, 7, 2, 9)\nval ys = Array(1000, 100, 10, 1)\n```\n\n现在我们要将对应的元素传递给像\
  \ `mul` 这样的二元函数。一个优雅的解决方案是对数组进行压缩（zip），然后将 `tupled` 函数应用到元组上：\n\n点击此处查看代码图像\n\n\
  ```scala\nxs.zip(ys).map(mul.tupled) // 产生 Array(1000, 700, 20, 9)\n```\n\n![图像](img/note.jpg)\
  \ 注意\n\n如果你传递一个函数字面量，则不需要调用 `tupled`。压缩数组的元素会被解元组，其组件将传递给函数：\n\n点击此处查看代码图像\n\n##\
  \ 12.10 控制抽象\n\n在 Scala 中，你可以构建看起来类似于关键字的控制抽象。例如，我们可以实现 `until`，它的工作原理类似于 `while`，但有所不同：\n\
  \n点击此处查看代码图像\n\n```scala\ndef until(condition: => Boolean)(block: => Unit): Unit\
  \ =\n  if condition then\n    block\n```\n\n这是如何使用 `until` 的：\n\n```scala\nvar x\
  \ = 10\nuntil (x == 0) {\n  x -= 1\n  println(x)\n}\n```\n\n这种参数的专业术语是按名引用（call-by-name）。与普通的传值（call-by-value）参数不同，表达式在调用函数时不会求值。我们不希望\
  \ `x == 0` 在调用 `until` 时变为 `false`。相反，表达式变成了无参数函数的体。\n\n### 12.11 非局部返回\n\n在 Scala\
