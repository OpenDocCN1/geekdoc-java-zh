  \n    *   如果 *n* 是偶数且为正，则 *x*^(*n*) = *y* ‧ *y*，其中 *y* = *x*^(*n*/2)。\n\n\n\n\n\n\
  *   如果 `n` 是正奇数，则 `x^(n) = x ‧ x^(n − 1)`。\n*   `x⁰ = 1`。\n*   如果 `n` 是负数，则 `x^(n)\
  \ = 1/x^(−n)`。\n\n12. 定义一个字符串插值器日期，根据给定的整数表达式（如 `date\"$year-$month-$day\"`）、字符串（如\
  \ `date\"2099-12-31\"`）或混合体（如 `date\"$year-12-31\"`）产生一个 `java.time.LocalDate` 实例。你需要定义一个“扩展方法”，如下例所示：\n\
  \n点击此处查看代码图片\n\n```\nextension (sc: StringContext)\n  def date(args: Any*): LocalDate\
  \ = ...\n```\n\n`args(i).asInstanceOf[Int]` 是第 `i` 个插值表达式的整数值。在表达式之间的字符串可以通过 `sc.parts`\
  \ 获取。通过破划线分割并调用 `toInt` 将字符串转换为整数。然后调用 `LocalDate.of` 方法。\n\n13. 要将命令行参数解析为任意类型，你需要提供一个“给定实例（given\
