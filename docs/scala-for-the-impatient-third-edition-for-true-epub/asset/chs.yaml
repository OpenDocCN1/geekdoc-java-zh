  \n8. 以下代码的效果是什么：\n\n```\nimport java.*\nimport javax.*\n```\n\n这是一个好主意吗？\n\n9. 编写一个程序，导入\
  \ `java.lang.System` 类，从 `user.name` 系统属性中读取用户名，从 `StdIn` 对象读取密码，如果密码不是 `\"secret\"\
  `，则向标准错误流打印消息。否则，向标准输出流打印问候语。不要使用任何其他导入，也不要使用任何限定名（带点的名称）。\n\n10. 在上一个练习中，将所有导入移动到可能的内部作用域。\n\
  \n\n\n\n\n你可以将类声明为 `final`，这样它无法被扩展。你也可以将单个方法或字段声明为 `final`，以便它们无法被重写。（参阅第 8.8 节\
  \ 中的“重写字段”，位于第 102 页。）请注意，这与 Java 不同，在 Java 中 `final` 字段是不可变的，类似于 Scala 中的 `val`。\n\
  \n## 8.2 重写方法\n\n在 Scala 中，当你重写一个非抽象方法时*必须*使用 `override` 修饰符。（参阅第 8.6 节 中的“抽象类”，位于第\
  \ 101 页）。例如，\n\n点击此处查看代码图片\n\n```\nclass Person :\n  ...\n  override def toString\
  \ = s\"${getClass.getName}[name=$name]\"\n```\n\n`override` 修饰符可以在许多常见情况下提供有用的错误信息，例如：\n\
  \n* 当你拼错了正在重写的方法名称时\n\n* 当你在重写方法中无意提供了错误的参数类型时\n\n* 当你在父类中引入了一个与子类方法冲突的新方法时\n\n\
  ![图片](img/note.jpg) 注意\n\n最后一种情况是*脆弱基类问题*的实例，在这种情况下，如果不查看所有子类，就无法验证父类中的更改。假设程序员\
  \ Alice 定义了一个 `Person` 类，而在 Alice 不知情的情况下，程序员 Bob 定义了一个子类 `Student`，并包含一个返回学生 ID\
  \ 的方法 `id`。后来，Alice 也定义了一个方法 `id` 用来持有该人的国家身份证号。当 Bob 采用了了这一变化时，Bob 的程序可能会出现问题（但在\
  \ Alice 的测试用例中不会），因为 `Student` 对象现在返回了意料之外的 ID。\n\n在 Java 中，人们通常被建议通过将所有方法声明为 `final`\
  \ 来“解决”这个问题，除非它们被显式地设计为可重写。这在理论上听起来很好，但程序员们讨厌无法对方法进行即使是微微不足道的更改（例如添加一个日志记录调用）。这就是为什么\
  \ Java 最终引入了可选的 `@Overrides` 注解。\n\n在 Scala 中调用父类方法，请使用关键字 `super`：\n\n点击此处查看代码图片\n\
  \n```\nclass Employee extends Person :\n  ...\n  override def toString = s\"${super.toString}[salary=$salary]\"\
  \n```\n\n调用 `super.toString` 会调用父类的 `toString` 方法——即 `Person.toString` 方法。\n\n##\
  \ 8.3 类型检查与强制转换\n\n要测试一个对象是否属于给定的类，请使用 `isInstanceOf` 方法。如果测试通过，你可以使用 `asInstanceOf`\
  \ 方法将引用转换为子类引用：\n\n点击此处查看代码图片\n\n```\nif p.isInstanceOf[Employee] then\n  val s\
  \ = p.asInstanceOf[Employee] // s 的类型为 Employee\n  ...\n```\n\n如果 `p` 指向类 `Employee`\
  \ 或其子类（如 `Manager`）的对象，则 `p.isInstanceOf[Employee]` 测试通过。\n\n如果 `p` 为 `null`，则 `p.isInstanceOf[Employee]`\
  \ 返回 `false`，`p.asInstanceOf[Employee]` 返回 `null`。\n\n如果 `p` 不是 `Employee`，则 `p.asInstanceOf[Employee]`\
  \ 会抛出异常。\n\n如果你想测试 `p` 指向的是 `Employee` 对象而不是子类，请使用\n\n点击此处查看代码图片\n\n```\nif p.getClass\
  \ == classOf[Employee]\n```\n\n`classOf` 方法定义在 `scala.Predef` 对象中，它是总是被导入的。\n\n\
  表 8–1 显示了 Scala 和 Java 类型检查与强制转换的对应关系。\n\n| Scala | Java |\n| --- | --- |\n| `obj.isInstanceOf[Cl]`\
  \ | `obj instanceof Cl` |\n| `obj.asInstanceOf[Cl]` | `(Cl) obj` |\n| `classOf[Cl]`\
  \ | `Cl.class` |\n\n**表 8–1** Scala 和 Java 中的类型检查与转换\n\n然而，模式匹配通常是使用类型检查和转换的更好替代方案。例如，\n\
  \n点击此处查看代码图片\n\n```\np match\n  case s: Employee => ... // 将 s 作为 Employee 处理\n\
  \  case _ => ... // p 不是 Employee\n```\n\n更多信息请阅第 14 章。\n\n## 8.4 父类构造\n\n回顾第 5\
  \ 章，类有一个主构造函数和任意数量的辅助构造函数，并且所有的辅助构造必须从调用先前的辅助构造或主构造开始。\n\n结果是，辅助构造函数*永远无法*直接调用父类的构造。\n\
  \n子类的辅助构造最终会调用子类的主构造。只有主构造函数可以调用父类的构造。\n\n## 8.5 匿名子类\n\n你可以通过提供构造参数和一个包含重写的块来构造*匿名*子类的实例。例如，假设我们有以下父类：\n\
  \n点击此处查看代码图片\n\n```\nclass Person(val name: String) :\n  def greeting = s\"Hello,\
  \ my name is $name\"\n```\n\n在这里，我们构造了一个属于 `Person` 的匿名子类的对象，重写了 `greeting` 方法：\n\
  \n点击此处查看代码图片\n\n```\nval alien = new Person(\"Tweel\") :\n  override def greeting\
  \ = \"Greetings, Earthling!\"\n```\n\n## 8.6 抽象类\n\n声明为 `abstract` 的类无法实例化。这通常是因为它的一个或多个方法没有定义。例如，\n\
  \n点击此处查看代码图片\n\n```\nabstract class Person(val name: String) :\n  def id: Int //\
  \ 没有方法体——这是一个抽象方法\n```\n\n\n\n\n在子类中，当你定义一个在父类中为抽象的方法时，不需要使用`override`关键字。\n\n点击此处查看代码图片\n\
  \n```\nclass Employee(name: String) extends Person(name) :\n  def id = name.hashCode\
  \ // 不需要 override 关键字\n```\n\n## 8.7 抽象字段\n\n除了抽象方法外，类还可以拥有抽象字段。抽象字段简单来说就是没有初始值的字段。例如，\n\
  \n点击此处查看代码图片\n\n```\nabstract class Person :\n  val id: Int\n    // 没有初始化器——这是一个带有抽象\
  \ getter getter 方法的抽象字段\n  var name: String\n    // 另一个抽象字段，带有抽象的 getter 和 setter\
  \ 方法\n```\n\n该类为 `id` 和 `name` 字段定义了抽象 getter 方法，并为 `name` 字段定义了抽象 setter 方法。生成的\
  \ Java 类`没有任何字段`。\n\n具体的子类必须提供具体的字段，例如：\n\n点击此处查看代码图片\n\n```\nclass Employee(val\
  \ id: Int) extends Person : // 子类拥有具体的 id 属性\n  var name = \"\" // 以及具体的 name 属性\n\
  ```\n\n与方法一样，当你在子类中定义一个在父类中为抽象的字段时，不需要`override`关键字。\n\n你始终可以使用匿名类型来自定义抽象字段：\n\n\
  ```\nval fred = new Person() {\n  val id = 1729\n  var name = \"Fred\"\n}\n```\n\
  \n## 8.8 重写字段\n\n回想一下第 5 章，Scala 中的字段由一个私有字段`和`访问器/修改器方法组成。你可以用另一个同名的 `val` 字段来重写\
  \ `val`（或无参数的 `def`）。子类拥有一个私有字段和一个公共 getter，而该 getter 重写了父类的 getter（或方法）。\n\n例如，\n\
  \n点击此处查看代码图片\n\n```\nclass Person(val name: String) :\n  override def toString =\
  \ s\"${getClass.getName}[name=$name]\"\n\nclass SecretAgent(codename: String) extends\
  \ Person(codename) :\n  override val name = \"secret\" // 不想暴露名字...\n  override\
  \ val toString = \"secret\" // ...或者类名\n```\n\n这个示例展示了其机制，但它显得有些生硬。更常见的情况是用 `val`\
  \ 重写抽象的 `def`，如下所示：\n\n点击此处查看代码图片\n\n```\nabstract class User :\n  def id: Int //\
  \ 每个用户都有一个以某种方式计算的 ID\n\nclass Student(override val id: Int) extends User\n  //\
  \ 学生 ID 直接在构造函数中提供\n```\n\n请注意以下限制（另见表 8–2）：\n\n*   `def` 只能重写另一个 `def`。\n*   `val`\
  \ 只能重写另一个 `val` 或无参数的 `def`。\n*   `var` 只能重写抽象的 `var`。\n\n|  | 使用 `val` | 使用 `def`\
  \ | 使用 `var` |\n| --- | --- | --- | --- |\n| 重写 `val` | 子类拥有一个私有字段（与父类字段同名——这是可以）。<br>Getter\
  \ 重写了父类的 getter。 | 错误。 | 错误。 |\n| 重写 `def` | 子类拥有一个私有字段。<br>Getter 重写了父类方法。 | 与\
  \ Java 类似。 | `var` 可以重写 getter/setter 对。只重写 getter 是错误。 |\n| 重写 `var` | 错误。 | 错误。\
  \ | 仅当父类的 `var` 是抽象时可以。 |\n\n**表 8–2** 重写 `val`、`def` 和 `var`\n\n![Images](img/caution.jpg)\
  \ **注意**\n\n在第 5 章中，我提到过使用 `var` 是可以的，因为你随时可以改变主意将其重新实现为 getter/setter 对。然而，扩展你类的程序的程序员并没有这个选择。他们不能用\
  \ getter/setter 对来重写 `var`。换句话说，如果你提供了一个 `var`，所有的子类都受限于它。\n\n## 8.9 Open 类和 Sealed\
  \ 类\n\n继承是一项强大的特性——它可能被滥用。有时，程序员扩展一个类仅仅是因为获取某些方法很方便。第 7 章讨论了 `exports`特性，它有助于 Scala\
  \ 程序员通过方便地使用组合和委托而不是继承来避免这种陷阱。\n\n然而，许多类是专门为继承设计的。在 Scala 中，使用 `open` 关键字来标记这些类：\n\
  \n```\nopen class Person :\n  ...\n```\n\n从 Scala 3.1 开始，如果你在声明它的源文件之外扩展非`open`\
  \ 类，将会警告。要避免该警告，包含扩展类的文件必须包含以下导入语句：\n\n点击此处查看代码图片\n\n``` evenimport scala.language\n\
  ```\n\n在另一个文件中尝试扩展非`open` 类是一个错误，而不是警告。\n\n密封类（Sealed classes）用于模式匹配。如果编译器知道某个类的所有子类，就可以验证匹配的完备性。详情见第\
  \ 14 章。\n\n### 8.10 保护字段和方法像 Java 或 C++ 一样，你可以将字段或方法声明为 `protected`。此类成员可以在任何子类中访问。\n\
  \n点击此处查看代码图片\n\n```\nclass Employee(name: String, age: Int, protected var salary:\
  \ Double) :\n  ...\n\nclass Manager(name: String, age: Int, salary: Double)\n  \
  \  extends Employee(name, age, salary) :\n  def setSalary(newSalary: Double) = //经理的薪水永远不会减少\n\
  \    if newSalary > salary then salary = newSalary\n\n  def outranks(other: Manager)\
  \ =\n    salary > other.salary\n```\n\n注意，Manager 方法可以访问任何 Manager 对象的 salary 字段。\n\
  \n与 Java 不同，保护成员包并不可见。（如果你想要这种可见性，可以使用包修饰符——参见第 7 章](#ch07.xhtml_ch07)。）\n\n## 8.11\
  \ 构造顺序\n\n当你在子类中重写 `val` 并在父类构造函数中使用该值时，结果是不可直觉的。\n\n这里有一个例子。生物可以感知环境的一个局部。为了简单起见，我们假设生物生活在一个维世界中，感应数据用整数表示。默认生物可以看到十个单位。\n\
  \n点击此处查看代码图片\n\n```\nclass Creature :\n  val range: Int = 10\n  val env: Array[Int]\
  \ = Array.ofDimInt\n```\n\n然而，蚂蚁是近视的：\n\n```\nclass Ant extends Creature :\n  override\
  \ val range = 2\n```\n\n不幸的是，我们现在遇到了问题。`range` 值在父类构造函数中被，而父类构造函数在子类构造函数之前运行。具体来说，发生如下：\n\
  \n1.  Ant 构造函数在执行自己的构造之前调用了 Creature 构造函数。\n\n\n\n2. `Creature` 构造函数将其 `range` 字段设置为\
  \ `10`。\n\n3. `Creature` 构造函数为了初始化 `env` 数组，调用了 `range()` getter 方法。\n\n4. 该方法被重写，以产生\
  \ `Ant` 类中（尚未初始化的）`range` 字段。\n\n5. `range` 方法返回 `0`。（这是在分配对象时所有整型字段的初始值。）\n\n6.\
  \ `env` 被设置为一个长度为 `0` 的数组。\n\n7. `Ant` 构造函数继续执行，将其 `range` 字段设置为 `2`。\n\n尽管 `range`\
  \ 似乎是 `10` 或是 `2`，但 `env` 已经被设置为一个长度为 `0` 的数组。这里面的教训是，你不应该依赖构造函数体中 `val` 的值。\n\n\
  作为一种解决方法，你可以将 `range` 变为一个 `lazy val`（参见第 2 章）。\n\n![Images](img/note.jpg) Note\n\
  \n构造顺序问题的根在于 Java 语言的一个设计决策——即允许在父类构造函数调用子类方法。在 C++ 中，当父类构造函数执行时，对象的虚函数表指针被设置为父类的表。之后，指针被设置为子类表。因此，在\
  \ C++ 中，无法通过重写来修改构造函数的行为。Java 设计者认为这种细微差别是没有必要的，且 Java 虚拟机在构造过程中调整虚函数表。\n\n![Images](img/tip.jpg)\
  \ Tip\n\n你可以通过实验性的 `-Ysafe-init` 标志进行编译，让编译器检查初始化错误（例如本节中的错误）。\n\n## 8.12 Scala\
  \ 继承层次结构\n\n图 8–1 显示了 Scala 类的继承层次结构。对应 Java 虚拟机中原始类型的类以及 `Unit` 类型继承了 `AnyVal`。你也可以定义自己的值类——参见第\
  \ 8.15 节 第 111 页上的“值类”。\n\n所有其他类都是 `AnyRef` 类的子类。当编译到 Java 虚拟机时，它等同于 `java.lang.Object`\
  \ 类。\n\n![Images](img/08fig01.jpg)\n\n**图 8–1** Scala 类的继承层次结构\n\n`AnyVal` 和 `AnyRef`\
  \ 都继承了层次结构的根类 `Any`。\n\n`Any` 类定义了 `isInstanceOf`、`asInstanceOf()` 以及用于相等性和哈希码的方法，我们将在第\
  \ 8.13 节 第 109 页上的“对象相等性”中查看这些方法。\n\n`AnyVal` 没有添加任何方法。它仅仅是值类型的标记。\n\n`AnyRef` 类增加了来自\
  \ `Object` 类的监器方法 `wait` 和 `notify`/`notifyAll`。它还提供了一个带有函数参数的 `synchronized` 方法。该方法等同于\
  \ Java 中的 `synchronized` 块。例如，\n\n点击此处查看代码图像\n\n```\naccount.synchronized { account.balance\
  \ += amount }\n```\n\n![Images](img/note.jpg) Note\n\n就像在 Java 中一样，除非你有充分理由使用它们而不是高级别的并发结构，否则我建议远离\
  \ `wait`、`notify` 和 `synchronized`。\n\n在层次结构的另一端是 `Nothing` 和 `Null` 类型。\n\n`Null`\
  \ 是一个唯一实例值为 `null` 的类型。你可以将 `null` 赋值给任何引用，但不能赋值给值类型之一。例如，将 `Int` 设置为 `null` 是不可能的。这比\
  \ Java 好，在 Java 中可以将 `Integer` 包装类设置为 `null`。\n\n![Images](img/note.jpg) Note\n\n\
  通过实验性的“显式空”功能，类型层次结构发生了变化，`Null` 不再是扩展 `AnyRef` 的类型的子类型。引用不能为 `Null`。如果你需要可空值，需要声明联合类型\
  \ `T | Null`。要启用此功能，请使用 `-Yexplicit-nulls` 标志进行编译。\n\n`Nothing` 类型没有实例。它有时对泛型结构很有用。例如，空列表\
  \ `Nil` 的类型为 `List[Nothing]`，它是任何 `T` 的 `List[T]` 的子类型。\n\n`???` 方法的返回类型声明为 `Nothing`。它从不返回，而是在调用时抛出\
  \ `NotImplementedError`。你可以将其用于仍需要实现的方法：\n\n点击此处查看代码图像\n\n```\nclass Person(val\
  \ name: String) :\n  def description: String = ???\n```\n\n`Person` 类可以通过编译，因为 `Nothing`\
  \ 是所有类型的子类型。只要你不调用 `description` 方法，就可以开始使用该类。\n\n\n\n\n\n点击此处查看代码图片\n\n```scala\n\
  final def ==(other: Item) = // 不要用 == 代替 equals！\n  description == other.description\
  \ && price == other.price\n```\n\n当你使用 `==` 比较两个 `Item` 对象时，将调用此方法。但其他类（例如 `scala.collection.mutable.HashSet`）使用\
  \ `equals` 来比较元素，以便与 Java 对象保持兼容。此时，你的 `==` 方法将不会被调用！\n\n![图片](img/tip.jpg) 提示\n\
  \n你并不强制要求重写 `equals` 和 `hashCode`。对于许多类来说，认为不同的对象是不相等的是合理的。例如，如果你有两个不同的输入流或单选按钮，你永远不会认为它们是相等的。\n\
  \n与 Java 不同，不要直接调用 `equals` 方法。仅需使用 `==` 运算符即可。对于引用类型，它会在对 `null` 操作数进行适当检查后调用 `equals`。\n\
  \n## 8.14 通用相等性 (L2)\n\n在 Java 中，`equals` 方法是**通用的**的。它可以被调用来比较任何类的对象。\n\n这听起来很好，但它限制了编译器发现错误的能力。在\
  \ Scala 中，当参数可能不可比较时，`==` 运算符可以被设置为编译时失败。\n\n有两种机制可以启用这种通用相等性。\n\n如果你想所有的相等性检查都使用通用相等性，请添加导入：\n\
  \n点击此处查看代码图片\n\n```scala\nimport scala.language.strictEquality\n```\n\n或者，你可以选择性地激活通用相等性。类可以声明它不允许与其他类的实例进行比较：\n\
  \n点击此处查看代码图片\n\n```scala\nclass Item(val description: String, val price: Double)\
  \ derives CanEqual :\n  ...\n```\n\n`derives` 关键字是一种通用机制，你将在第 20 章看到。现在，无法将 `Item`\
  \ 实例与无关的对象进行比较：\n\n点击此处查看代码图片\n\n```scala\nItem(\"Blackwell toaster\", 29.95) ==\
  \ Product(\"Blackwell toaster\") // 编译错误\n```\n\n即使具有通用相等性，你也可以实现不同类之间的相等性检查。这通常不是你应该尝试做的，但在\
  \ Scala 库的许多类中，你可以检查两个序列（`scala.collection.Seq` 和 `scala.collection.Set` 的子类型）之间的相等性，只要元素类型也是相等的。为了向后兼容，当操作数未启用通用相等性时，仍然允许引用类型与\
  \ `null` 进行比较。\n\n## 8.15 值类 (Value Classes, L2)\n\n有些类只有一个字段，例如用于原始类型的包装类，以及 Scala\
  \ 用于为现有类型添加方法的“rich”或“ops”包装类。创建一个仅持有一个值的对象是低效的。**值类**允许你定义内联的类，从而直接使用该字段。\n\n值类具有以下属性：\n\
  \n1. 该类扩展了 `AnyVal`。\n2. 它的主构造函数只有一个 `val` 参数，且没有体。\n3. 该类没有其他字段或构造函数。\n4. 自动提供的\
  \ `equals` 和 `hashCode` 方法比较并哈希底层值。\n\n作为一个示例，让我们定义一个包装“军事时间”值的值类：\n\n点击此处查看代码图片\n\
  \n```scala\nclass MilTime(val time: Int) extends AnyVal :\n  def minutes = time\
  \ % 100\n  def hours = time / 100\n  override def toString = f\"$time%04d\"\n```\n\
  \n当你构建 `MilTime(1230)` 时，编译器不会分配新对象。相反，它使用底层值整数 `1230`。你可以对该值调用 `minutes` 和 `hours`\
  \ 方法：\n\n```scala\nval lunch = MilTime(1230)\nprintln(lunch.hours) // OK\n```\n\n\
  同样重要的是，你不能调用 `Int` 方法：\n\n```scala\nprintln(lunch * 2) // 错误\n```\n\n为了确保初始化，将主构造函数设为私有，并在伴侣对象提供一个工厂方法：\n\
  \n点击此处查看代码图片\n\n```scala\nclass MilTime private(val time: Int) extends AnyVal :\n\
  \  ...\nobject MilTime :\n  def apply(t: Int) =\n    if 0 <= t && t < 2400 && t\
  \ % 100 < 60 then MilTime(t)\n    else throw IllegalArgumentException()\n```\n\n\
  ![图片](img/caution.jpg) 注意\n\n在某些编程语言中，值类型是任何分配在运行时栈上的类型，包括包含多个字段的结构化类型。在 Scala 中，值类只能有一个字段。\n\
  \n![图片](img/note.jpg) 注意\n\n如果你希望值类实现一个 trait（参见第 10 章），该 trait 必须式扩展 `Any` 并且不能有字段。此类\
  \ trait 被**通用 trait**。**不透明类型**是值类的替代方案。不透明类型别名允许你为现有类型命名，从而使原始类型无法被使用。例如，`MilTime`\
  \ 可以是 `Int` 的不透明类型别名。在第 18 章，你将看到如何声明不透明类型并用“扩展方法”定义它们的行为。\n\n在不远的将来，Java 虚拟机将支持具有多个字段的原生值类型。预计\
  \ Scala 将演进以与 JVM 类型保持。\n\n## 练习\n\n1. 将以下 `BankAccount` 类扩展为 `CheckingAccount`\
  \ 类，每笔存款和取款收取 1 美元费用：\n\n点击此处查看代码图片\n\n```scala\nclass BankAccount(initialBalance:\
  \ Double) :\n  private var balance = initialBalance\n  def currentBalance = balance\n\
  \  def deposit(amount: Double) = { balance += amount; balance }\n  def withdraw(amount:\
