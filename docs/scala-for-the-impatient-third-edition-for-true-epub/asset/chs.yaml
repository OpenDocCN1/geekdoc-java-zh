  \ move 5 and show\n```\n\n### 9. 完成第 18.6 节 中的“单例类型操作符”，位于第 284 页的流式接口，以便人们可以调用\n\
  \n点击此处查看代码图片\n\n```\nbook set Title to \"Scala for the Impatient\" set Author to\
  \ \"Cay Horstmann\"\n```\n\n### 10. 类型转换 `v.asInstanceOf[v.type & Matchable]` 看起来有点不好看。定义一个泛型方法\
  \ `as`，以便可以通过 `asMatchable` 为值添加任意 trait。\n\n### 11. 尝试定义一个 `ButtonListener`，其 `occurred`\
  \ 方法接受 `ButtonEvent` 以外的事件。尝试向 `Button` 添加一个除 `ButtonListener` 以外的监听器。每情况下会发生什么？\n\
  \n### 12. 使用参数化类型（parameterized types）代替抽象类型重写 `EventSource` 类。是否仍然保证 `ButtonListener`\
  \ 只接受 `ButtonEvent` 值，且你只能向 `Button` 添加 `ButtonListener`？\n\n### 13. 给定如下 trait-it\n\
  \n点击此处查看代码图片\n\n```scala\ntrait UnitFactory :\n  type U <: Unit\n  def create(x:\
  \ Double): U\n  trait Unit :\n    val value: Double\n    def name: String\n    override\
  \ def toString = s\"$value $name\"\n    def + (that: U): U =\n      of(this.value\
  \ + that.value)\n```\n\n创建对象\n\n点击此处查看代码图片\n\n```scala\nobject MeterFactory extends\
  \ UnitFactory\n```\n\n以及\n\n点击此处查看代码图片\n\n```scala\nobject LiterFactory extends\
  \ UnitFactory\n```\n\n它们的 `create` 方法产生类 `Meter` 和 `Liter` 的实例。证明你只能添加相同类型的单位。\n\
