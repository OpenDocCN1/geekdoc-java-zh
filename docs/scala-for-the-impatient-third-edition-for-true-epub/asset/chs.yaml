  \ `cos(x) == x` 的值。\n\n生成一个迭代函数应用的惰性列表，并搜索连续的相同值。提示：`sliding(2)`。\n\n## 第 14 章 模式匹配\n\
  \n**本章主题 **A2****\n\n* 14.1 更好的 Switch\n* 14.2 守卫\n* 14.3 模式中的变量\n* 14.4 类型模式\n\
  * 14.5 `Matchable` 特性\n* 14.6 匹配数组、列表和元组\n* 14.7 提取器\n* 14.8 变量声明中的模式\n* 14.9 `for`\
  \ 表达式中的模式\n* 14.10 密封类\n* 14.11 样例类\n* 14.12 嵌套结构\n* 14.13 参数化样例类\n* 14.14 部分函数\n\
  * 14.15 Case 表达式\n* 14.16 练习\n\n模式匹配的关键点是：\n\n* 通用匹配符是 `_`。\n* 如果没有模式匹配，将抛出 `MatchError`。\n\
  * 与 `switch` 语句不同，Scala 模式匹配没有“贯穿”问题。（在 C 及其衍生语言中，你必须在每个分支末尾使用 `break` 语句，否则会贯穿到下一个。）\n\
  * 与 `if` 类似，`match` 是一个表达式，而不是语句。\n\n## 14.1 更好的 Switch\n\n这是 C 风格 `switch` 的等效实现：\n\
  \n```\nvar sign = 0\nch match\n  case '+' => 1\n  case '-' => -1\n  case _ => 0\n\
  ```\n\n`default` 的等效写法是全局 `_`。之前的代码可以简化为：\n\n```\nval sign = ch match\n  case '+'\
  \ => 1\n  case '-' => -1\n  case _ => 0\n```\n\n使用 `|` 分隔多个备方案：\n\n```scala\nprefix\
  \ match\n  case \"0x\" | \"0X\" => 16\n  case \"0\" => 8\n  case _ => 10\n```\n\n\
  你可以对任何类型使用 `match` 语句。例如：\n\n```\ncolor match\n  case Color.RED => 0xff0000\n  case\
  \ Color.GREEN => 0xff00\n  case Color.BLUE => 0xff\n```\n\n\n\n\n点击此处查看代码图片\n\n\
  ```\nstr(i) match\n  case '+' => sign = 1\n  case '-' => sign = -1\n  case d =>\
  \ number = number * 10 + Character.digit(d, 10)\n```\n\n你可以将 `case _` 视为该特性的一个特殊情况，其中变量名为\
  \ `_`。\n\n你可以在守卫语句（guard）中使用变量名：\n\n点击此处查看代码图片\n\n```\nstr(i) match\n  case '+'\
  \ => sign = 1\n  case '-' => sign = -1\n  case d if Character.isDigit(d) => number\
  \ = 10 * number + Character.digit(d, 10)\n```\n\n![Images](img/caution.jpg) 注意\n\
  \n遗憾的是，变量模式可能会与常量冲突，例如：\n\n点击此处查看代码图片\n\n```\nimport scala.math.*\n4 * a / (c *\
  \ c) match\n  case Pi => \"a circle\" // Pi equals 4 * a / (c * c)\n  case q =>\
  \ f\"not a circle, quotient $q%f\" // q set to 4 * a / (c * c)\n```\n\nScala 如何知道\
  \ `Pi` 是一个常量而不是变量呢？规则是：变量必须以小写字母开头。\n\n要匹配以小写字母开头的名称，请将其包含在反引号中：\n\n点击此处查看代码图片\n\
  \n```\nimport java.io.File.* // Imports java.io.File.separatorChar\nch match\n \
  \ case `separatorChar` => '\\\\' // ch equals java.io.File.separatorChar\n  case\
  \ _ => ch\n```\n\n## 14.4 类型模式（Type Patterns）\n\n你可以对表达式类型进行匹配，例如：\n\n点击此处查看代码图片\n\
  \n```\nobj match\n  case x: Int => x\n  case s: String => Integer.parseInt(s)\n\
  \  case _: BigInt => Int.MaxValue\n  case _ => 0\n```\n\n在 Scala 中，这种形式优于使用 `isInstanceOf`\
  \ 运算符。\n\n注意模式中的变量名。在第一个模式中，匹配结果被绑定为 `Int` 类型的 `x`；在第二个模式中，被绑定为 `String` 类型的 `s`。不需要\
  \ `asInstanceOf` 强制转换！\n\n![Images](img/caution.jpg) 注意\n\n当你针对类型进行匹配时，必须提供一个变量名。否则，你匹配的是对象本身：\n\
  \n点击此处查看代码图片\n\n```\nobj match\n  case _: BigInt => Int.MaxValue // 匹配任何 BigInt\
  \ 类型的对象\n  case BigInt => -1 // 匹配类型为 Class 的 BigInt 对象\n```\n\n按照 `case` 子句的顺序尝试匹配。当编译器检测到子句不可达时，将产生编译错误：\n\
  \n点击此处查看代码图片\n\n```\nex match\n  case _: RuntimeException => \"RTE\"\n  case _:\
  \ NullPointerException => \"NPE\" // Error：不可达 case\n  case _: IOException => \"\
  IOE\"\n  case _: Throwable => \"\"\n```\n\n在这里，第二个 `case` 子句被第一个子句屏蔽了，因为 `NullPointerException`\
  \ 是 `RuntimeException` 的子类型。\n\n同样，以下代码也是错误的：\n\n点击此处查看代码图片\n\n```\nobj match\n\
  \  case s: String => Double.parseDouble(s)\n  case null => Double.NaN\n```\n\n`null`\
  \ 将匹配第一个分支。\n\n在两个示例中，解决办法都是重新排列 case，并将更具体的 case 放在前面。\n\n![Images](img/caution.jpg)\
  \ 注意\n\n匹配发生在运行时，且泛型类型在 Java 虚拟机中会被擦除。因此，你无法针对特定的 `Map` 类型进行类型匹配。\n\n点击此处查看代码图片\n\
  \n```\ncase m: Map[String, Int] => ... // 不要这样做\n```\n\n你可以匹配一个泛型 map：\n\n点击此处查看代码图片\n\
  \n```\ncase m: Map[_, _] => ... // 可以\n```\n\n然而，数组是不会被擦除的。你可以匹配 `Array[Int]`。\n\
  \n## 14.5 `Matchable` 特性\n\n某些类型是不可匹配的。例如，Scala 库中有一个用于不可变数组的类型 `IArray`：\n\n点击此处查看代码图片\n\
  \n```\nval smallPrimes = IArray(2, 3, 5, 7, 11, 13, 17, 19)\n```\n\n其底层类型是 Java\
  \ 虚拟机数组，因此如果允许，以下匹配将在运行时成功，并允许发生变异：\n\n点击此处查看代码图片\n\n```\nsmallPrimes match\n  case\
  \ a: Array[Int] => a(1) = 4\n```\n\n\n\n与第 14.3 节中的“模式中的变量”的警告相同，该警告位于第 211 页。你在模式中使用的变量名必须以`lowercase`（小写字母）字母开头。在对\
  \ `case Array(X, Y)` 的匹配中，`X` 和 `Y` 被视为常量而非变量。\n\n![Images](img/note.jpg) 注意\n\n\
  模式可以有备选方案：\n\n点击此处查看代码图像\n\n```\npair match\n  case (_, 0) | (0, _) => ... // OK，如果一个组件为零则匹配\n\
  ```\n\n然而，你不能使用下划线以外的变量：\n\n点击此处查看代码图像\n\n```\npair match\n  case (x, 0) | (0, x)\
  \ => ... // 错误——无法在备选方案中绑定\n```\n\n## 14.7 提取器\n\n在前面的节中，你已经看到模式如何匹配数组、列表和元组。这些能力由`提取器`（extractors）提供——提取器是具有\
  \ `unapply` 或 `unapplySeq` 方法的对象，它们可以从正在匹配的值中提取值。这些方法的实现在第 11 章中介绍。`unapply` 方法提取固定数量的值，而\
  \ `unapplySeq` 则提取长度可以变化的序列。\n\n例如，考虑以下表达式：\n\n点击此处查看代码图像\n\n```\narr match\n  case\
  \ Array(x, 0) => x\n  case Array(_, rest*) => rest.min\n  ...\n```\n\n`Array` 伴随对象是一个提取器——它定义了一个\
  \ `unapplySeq` 方法。该方法的调用时传入的是*正在匹配的表达式*，而不是模式中看起来像参数的内容。`Array.unapplySeq(arr)`\
  \ 调用产生一个值序列，即数组中的值。在第一种情况下，如果数组长度为 2 且第二个元素为 0，则匹配成功。在这种情况下，初始数组元素被赋值给 `x`。永远不会发生\
  \ `Array(x, 0)` 这样的调用。\n\n正则表达式提供了提取器更有趣的用法。当正则表达式包含组时，你可以用提取器模式来匹配每个组。例如：\n\n点击此处查看代码图像\n\
  \n```\nval pattern = \"([0-9]+) ([a-z]+)\".r\n\"99 bottles\" match\n  case pattern(quantity,\
  \ item) => s\"{ quantity: $quantity, item: $item }\"\n    // 将 quantity 设为 \"99\"\
  , item 设为 \"bottles\"\n```\n\n`pattern.unapplySeq(\"99 bottles\")` 调用产生一个与组匹配的字符串序列。这些值被赋值给变量\
  \ `quantity` 和 `item`。\n\n注意这里的提取器不是伴随对象，而是一个正则表达式对象。\n\n通用语法为：\n\n点击此处查看代码图像\n\n\
  ```\nvalue match\n  case extractor(pattern1, ..., patternn) => ...\n```\n\n为了检查\
  \ case 是否匹配，会执行以下调用之一：\n\n```\nextractor.unapply(value)\n```\n\n或者\n\n```\nextractor.unapplySeq(value)\n\
  ```\n\n如果调用指示失败，则匹配失败。\n\n否则，调用将产生提取出的值，并与模式进行匹配。如果值不足以匹配模式，则匹配失败。如果模式是常量，它必须匹配对应的值，否则匹配失败。如果模式是变量，则该变量将被赋予对应的值。\n\
  \n允许的返回类型规则有点复杂——详情请参见第 11 章。在指示成功与失败以及产生提取出的值方面，存在一定的灵活性。这些细节仅与提取器的实现者相关。\n\n##\
  \ 14.8 变量声明中的模式\n\n在前面的几节中，你在 `match` 表达式中使用了模式。你也可以将模式用于变量声明。例如：\n\n```\nval (a,\
  \ b) = (1, 2)\n```\n\n这会同时定义 `a` 为 `1` 且 `b` 为 `2`。这对于返回元组的函数非常有用，例如：\n\n```\nval\
  \ (q, r) = BigInt(10) /% 3\n```\n\n`/%` 方法返回一个包含商和余数的元组，这些值被捕获在变量 `q` 和 `r` 中。\n\
  \n相同的语法适用于提取器模式。例如：\n\n点击此处查看代码图像\n\n```\nval Array(0, second, rest*) = arr\n```\n\
  \n如果 `arr` 的元素少于两个或 `arr(0)` 不零，则抛出 `MatchError`。否则，`second` 变为 `a(1)`，`rest` 设置为剩余元素的\
  \ `Seq`。\n\n![Images](img/caution.jpg) 注意\n\n与第 14.3 节中的“模式中的变量”的警告相同，该警告位于第 211\
  \ 页。你在模式中使用的变量名必须以`lowercase`（小写字母）字母开头。在对 `case Array(X, Y)` 的匹配中，`X` 和 `Y` 被视为常量。\n\
  \n![Images](img/note.jpg) 注意\n\n模式可以有备选方案：\n\n点击此处查看代码图像\n\n```\npair match\n  case\
  \ (_, 0) | (0, _) => ... // OK，如果一个组件为零则匹配\n```\n\n然而，你不能使用下划线以外的变量：\n\n点击此处查看代码图像\n\
  \n```\npair match\n  case (x, 0) | (0, x) => ... // 错误——无法在备选方案中绑定\n```\n\n## 14.7\
