  \ scala.util.*\ngiven CommandLineParser.FromString[LocalDate] with\n  def fromString(s:\
  \ String) = LocalDate.parse(s)\n```\n\n编写一个 Scala 程序，在命令行上接收两个日期并打印它们之间的天数。你的主函数应该有两个类型为\
  \ `LocalDate` 的参数。\n\n## 第 3 章：数组数组操作\n\n**本章主题 A1**\n\n*   3.1 固定长度数组\n*   3.2\
  \ 变长数组：数组缓冲区\n*   3.3 遍历数组和缓冲区\n*   3.4 转换数组\n*   3.5 常用算法\n*   3.6 解读 Scaladoc\n\
  *   3.7 多维数组\n*   3.8 与 Java 互操作\n*   练习题\n\n在本章中，你将学习如何在 Scala 中操作数组。Java、JavaScript、Python\
  \ 和 C++ 程序员在需要收集元素时，通常会选择数组或其紧密相关（如列表或向量）。在 Scala 中，还有其他选择（参见第 13 章），但目前我假设你迫不及待，只想开始使用数组。\n\
  \n本章的要点包括：\n\n*   如果长度固定，使用 `Array`；如果长度可以变化，使用 `ArrayBuffer`。\n*   使用 `()` 访问元素。\n\
  *   使用 `for elem <- arr do ...` 遍历元素。\n*   使用 `for elem <- arr yield ...` 转换为新数组。\n\
  *   Scala 和 Java 数组是可以互操作的；对于 `ArrayBuffer`，使用 `scala.jdk.CollectionConverters`。\n\
  \n## 3.1 固定长度数组\n\n如果你需要一个长度不变的数组，请使用 Scala 中的 `Array` 类型。例如，\n\n点击此处查看代码图片\n\n\
  ```\nval strings = Array(\"Hello\", \"World\")\n  // 一个长度为 2 的 Array[String]——类型是推断的\n\
  val moreStrings = Array.ofDimString\n  // 有五个元素的字符串数组，全部初始化为 null\nval nums = Array.ofDimInt\n\
  \  // 有十个整数的数组，全部初始化为零\n```\n\n![Images](img/note.jpg) 注意\n\n在 Java 中，数组是使用 `new`\
  \ 运算符创建的。但在 Scala 3 中，不建议使用 `new` 运算符，正如你在第 5 章 中看到的。虽然调用 `new ArrayInt` 来创建一个包含十个整数的数组是可能的，但也有点困惑，因为\
  \ `ArrayInt`（不带 `new`）是一个长度为 1 包含整数 10 的数组。\n\n使用 `()` 运算符来访问或修改数组的元素：\n\n点击此处查看代码图片\n\
  \n```\nstrings(0) = \"Goodbye\"\n  // strings 现在是 Array(\"Goodbye\", \"World\")\n\
  ```\n\n为什么不像 Java、JavaScript、C++ 或 Python 那样使用 `[]` 呢？Scala 的观点是数组类似于将索引值映射到元素的函数。\n\
  \n在 JVM 内部，Scala 的 `Array` 实现为 Java 数组。上述示例中的数组在 JVM 内部的类型为 `java.lang.String[]`。\n\
  \n## 3.2 变长数组：数组缓冲区\n\n在 Java 中，数组是固定大小的。如果你需要可以增长的数组，请使用来自 `scala.util.collection.mutable`\
  \ 包的 `ArrayBuffer`。在本章中，我们关注 `Array` 和 `ArrayBuffer`。\n\n要创建一个 `ArrayBuffer`，请使用以下代码：\n\
  \n```scala\nval buf = ArrayBuffer(1, 2, 3)\nbuf += 4\n  // buf 现在是 ArrayBuffer(1,\
  \ 2, 3, 4)\n```\n\n## 3.3 遍历数组和缓冲区\n\n在 Java 和 C++ 中，数组和向量之间存在若干语法上的差异。Scala 要更加统一。大多数情况下，你可以对两者使用相同的代码。\n\
  \n以下是遍历数组或缓冲区的方法：\n\n```scala\nfor i <- 0 until a.length do\n  println(a(i))\n```\n\
  \n`until` 方法与 `to` 方法类似，不同在于排除了最后一个值。因此，变量 `i` 的范围从 `0` 到 `a.length - 1`。\n\n##\
  \ 3.4 转换数组\n\n在前面的节中，你已经看到了如何像在其他编程语言一样操作数组。但在 Scala 中，你可以更进一步。很容易地获取一个数组（或数组缓冲区）并进行某种转换。\n\
  \n使用如下的 `for` 导式：\n\n```scala\nval a = Array(2, 3, 5, 7, 11)\nval result = for elem\
  \ <- a yield 2 * elem\n  // result is Array(4, 6, 10, 14, 22)\n```\n\n\n\n\n\n#\
  \ 循环\n\n`for`/`yield` 循环会创建一个与原始集合类型相同的新集合。如果你从数组（array）开始，就会得到另一个数组。如果你从一个数组缓冲区（array\
  \ buffer）开始，通过 `for`/`yield` 得到的也是它。\n\n结果包含 `yield` 之后的表达式，循环的每次迭代对应一个表达式。\n\n\
  通常，在遍历集合时，你只想处理符合特定条件的元素。这可以通过在 `for` 内部使用 `guard:`（守卫）或 `if` 来实现在这里，我们将每个偶数元素翻倍，并丢弃奇数：\n\
  \n点击此处查看代码图片\n\n```\nfor elem <- a if elem % 2 == 0 yield elem / 2\n```\n\n请记住，结果是一个新集合——原始集合不受影响。\n\
  \n![Images](img/note.jpg) 注意\n\n一些具有函数式编程经验的程序员倾向于使用 `map` 和 `filter` 而不是 `for`/`yield`\
  \ 和守卫：\n\n点击此处查看代码图片\n\n```\na.filter(_ % 2 == 0).map(_ / 2)\n```\n\n这只是风格问题——`for`/`yield`\
  \ 循环执行的是完全相同的工作。使用你认为更简单的方法即可。\n\n假设我们想从一个整数数组缓冲区移除所有负数元素。传统的顺序解决方案可能会遍历数组缓冲区，并在遇到不需要的元素时将其删除。\n\
  \n```\nvar n = b.length\nvar i = 0\nwhile i < n do\n  if b(i) >= 0 then i += 1\n\
  \  else\n    b.remove(i)\n    n -= 1\n```\n\n这有点麻烦——你必须记住在删除元素时*不要*递增 `i`，而是要递减\
  \ `n`。从数组缓冲区的中间删除元素也是高效的。这个循环不必要地移动了之后会被删除的元素。\n\n在 Scala 中，显而易见的解决方案是使用 `for`/`yield`\
  \ 循环并保留所有非负元素：\n\n点击此处查看代码图片\n\n```\nval nonNegative = for elem <- b if elem >=\
  \ 0 yield elem\n```\n\n结果是一个新的数组缓冲区。假设我们改为修改原始数组缓冲区，移除不需要的元素。那么我们可以收集它们的位置：\n\n\
  点击此处查看代码图片\n\n```\nval positionsToRemove = for i <- b.indices if b(i) < 0 yield\
  \ i\n```\n\n现在从后往前移除这些位置上的元素：\n\n点击此处查看代码图片\n\n```\nfor i <- positionsToRemove.reverse\
  \ do b.remove(i)\n```\n\n或者，记住要保留的位置，将它们复制过去，然后缩短缓冲区：\n\n点击此处查看代码图片\n\n```\nval\
  \ positionsToKeep = for i <- b.indices if b(i) >= 0 yield i\nfor j <- positionsToKeep.indices\
  \ do b(j) = b(positionsToKeep(j))\nb.dropRightInPlace(b.length - positionsToKeep.length)\n\
  ```\n\n关键观察是，将*所有索引值放在一起*比一个接一个看到它们更好。\n\n## 3.5 常用算法\n\n人们常说，业务计算中大部分无非是在求和和排序。幸运的是，Scala\
  \ 提供了用于这些任务的内置函数。\n\n```\nArray(1, 7, 2, 9).sum\n  // 19\n  // 也适用于 ArrayBuffer\n\
  ```\n\n为了使用 `sum` 方法，元素类型必须是数值类型：整数类型或浮点类型，或者 `BigInteger`/`BigDecimal`。\n\n同样，`min`\
  \ 和 `max` 方法产生数组或数组缓冲区中最小和最大的元素。\n\n点击此处查看代码图片\n\n```\nArrayBuffer(\"Mary\", \"\
  had\", \"a\", \"little\", \"lamb\").max\n  // \"little\"\n```\n\n`sorted` 方法对数组或数组缓冲区进行排序并返回排序后的数组或数组缓冲区，而不修改原始对象：\n\
  \n点击此处查看代码图片\n\n```\nval b = ArrayBuffer(1, 7, 2, 9)\nval bSorted = b.sorted\n \
  \ // b 未改变；bSorted 是 ArrayBuffer(1, 2, 7, 9)\n```\n\n你也可以提供一个比较函数，但那时你应该使用 `sortWith`\
  \ 方法：\n\n点击此处查看代码图片\n\n```\nval bDescending = b.sortWith(_ > _) // ArrayBuffer(9,\
  \ 7, 2, 1)\n```\n\n函数语法请参阅第 12 章。\n\n你可以直接对数组或数组缓冲区进行原地排序：\n\n```\nval a = Array(1,\
  \ 7, 2, 9)\na.sortInPlace()\n  // a 现在是 Array(1, 2, 7, 9)\n```\n\n对于 `min`、`max`\
  \ 和 `sortInPlace` 方法，元素类型必须是数值类型：整数或浮点类型，或者 `BigInteger`/`BigDecimal`。\n\n最后，如果你想显示数组或数组缓冲区的内容，`mkString`\
  \ 方法允许你指定分隔符。例如：\n\n```\na.mkString(\",\")\n  // \"1, 2, 7, 9\"\n```\n\n## 3.6 解读\
  \ Scala\n\n由于 Scala 拥有丰富的类型系统，你可能会遇到一些奇怪的语法。看到这些内容时，只需将其视为“任何集合”。\n\n| Scaladoc\
  \ | 解释 |\n| :--- | :--- |\n| `count(p: (A) => Boolean): Int` | 此方法接收一个谓词，即一个从 `A`\
  \ 到 `Boolean` 的函数。它统计有多少个 `true`。例如，`a.count(_ > 0)` 统计 `a` 中有多少个正数。 |\n| `insert(@deprecatedName(\"\
  n\", \"2.13.0\")) index: Int, elem: A): Unit` | 忽略 `@deprecatedName` 注解。曾经 `index`\
  \ 参数被称为 `n`。 |\n| `appendAll(xs: IterableOnce[A]): Unit` | `xs` 参数可以是任何具有 `IterableOnce`\
  \ 特性的集合，它是类型层次结构中的一个 trait。其他你常见的 trait 有 `Iterable` 和 `Seq`。所有 Scala 集合都实现了这些 trait，对于库用户来说它们之间的区别是学术性的。\
  \ |\n| `combinations(n: Int): Iterator[ArrayBuffer[A]]` | 此方法计算一个可能巨大的结果，因此以迭代器而不是集合返回，这样你可以逐个访问元素，而不是将它们放在集合中。现在只需对它调用\
  \ `toArray` 或 `toBuffer`。 |\n| `copyToArrayB >: A: Unit` | 注意，该函数将 `ArrayBuffer[A]`\
  \ 复制到 `Array[B]`。这里 `B` 允许是 `A` 的超类。例如，你可以从 `ArrayBuffer[Int]` 拷贝到 `Array[Any]`。初读时，只需忽略\
  \ `[B >: A]` 脑中将 `B` 替换为 `A`。 |\n| `sortedB >: A: ArrayBuffer[A]` | 元素类型 `A` 必须有一个超类\
  \ `B`，该类存在一个类型为 `Ordering[B]` 的隐式或“给定”对象。数字、字符串以及实现 Java `Comparable` 接口的类都有这样的排序。我们将在第\
  \ 19 章中详细讨论这一机制。 |\n| `sum(implicit num: Numeric[B]): B` | 对于其他隐式类型，如 `sumB >: A`\
  \ 中的 `Numeric`，遵循你的直觉即可。要形成和，必须某种相加值的方法。 |\n\n\n\n\n\n| `def ++B >: A(implicit evidence$23:\
  \ ClassTag[B]): Array[B]` | 此方法拼接两个数组。第二个数组可以是第一个数组的子类型。类型 `ClassTag` 的“implicit”（隐式）是为了在\
  \ JVM 中构造结果数组所必需的正式要求。你可以安全地忽略任何此类 `ClassTag` 参数。 |\n\n| `def stepper[S <: Stepper[_]](implicit\
  \ shape: StepperShape[A, S]): S with EfficientSplit` | 在这里，你只能承认失败。该方法的存在是因为一个技术原因，该原因只对\
  \ Scala 库的实现者感兴趣。 |\n\n**表 3–1** Scaladoc 解码环\n\n## 3.7 多维数组\n\n与 Java、JavaScript\
  \ 或 Python 一样，多维数组被实现为数组的数组。例如，一个 `Double` 值的二维数组的类型为 `Array[Array[Double]]`。要构造这样一个数组，请使用\
  \ `ofDim` 方法：\n\n点击此处查看代码图片\n\n```\nval matrix = Array.ofDimDouble // 三行四列\n```\n\
  \n要访问元素，请使用两对括号：\n\n```\nmatrix(row)(column) = 42\n```\n\n你可以创建锯齿数组（ragged arrays），其行长度各异：\n\
  \n点击此处查看代码图片\n\n```\nval triangle = Array.ofDim[Array[Int]](10)\nfor i <- triangle.indices\
  \ do\n  triangle(i) = Array.ofDimInt\n```\n\n## 3.8 与 Java 互操作\n\n由于 Scala 数组被实现为\
  \ Java 数组，你可以在 Java 和 Scala 之间来传递它们。\n\n这在几乎所有情况下都有效，除非数组元素类型不是完全匹配。在 Java 中，给定类型的数组会自动转换为其父类型的数组。例如，一个\
  \ Java `String[]` 数组可以传递给期望 Java `Object[]` 数组的方法。Scala 不允许这种自动转换，因为它是是不安全的。（详细解释请参阅\
  \ 第 17 章。）\n\n假设你想调用一个带有 `Object[]` 参数的 Java 方法，例如 `java.util.Arrays.binarySearch(Object[]\
  \ a, Object key)`：\n\n点击此处查看代码图片\n\n```\nval a = Array(\"Mary\", \"a\", \"had\"\
  , \"lamb\", \"little\")\njava.util.Arrays.binarySearch(a, \"beef\") // 无法工作\n```\n\
  \n这不起作用，是因为 Scala 不会将 `Array[String]` 转换为 `Array[Object]`。你可以这样强制转换：\n\n点击此处查看代码图片\n\
  \n```\njava.util.Arrays.binarySearch(a.asInstanceOf[Array[Object]], \"beef\")\n\
  ```\n\n![图片](img/note.jpg) 笔记\n\n这只是一个示例，展示了如何克服元素差异。如果你想在 Scala 中执行二分查找，请这样做这样做：\n\
  \n点击此处查看代码图片\n\n```\nimport scala.collection.Searching.*\nval result = a.search(\"\
  beef\")\n```\n\n如果元素在位置 `n` 找到，结果为 `Found(n)`；如果元素未找到但应该插入到位置 `n` 之前，则为 `InsertionPoint(n)`。如果你调用一个接收或返回\
  \ `java.util.List` 的 Java 方法，你当然可以在代码中使用 Java 的 `ArrayList`——但这并不美观。相反，请在 `scala.jdk.CollectionConverters`\
  \ 中导入转换方法。然后你可以调用 `asJava` 方法将任何序列（例如 Scala buffer）转换为 Java 列表。例如，`java.lang.ProcessBuilder`\
  \ 类有一个带有 `List<String>` 参数的构造函数。以下是你可以从 Scala 调用它的方法：\n\n点击此处查看代码图片\n\n```\nimport\
  \ scala.jdk.CollectionConverters.*\nimport scala.collection.mutable.ArrayBuffer\n\
  val command = ArrayBuffer(\"ls\", \"-al\", \"/bin\")\nval pb = ProcessBuilder(command.asJava)\
  \ // Scala 到 Java\n```\n\nScala buffer 被封装成一个实现了 `java.util.List` 接口的 Java 对象。相反，当\
  \ Java 方法返回 `java.util.List` 时，你可以将其转换为 `Buffer`：\n\n点击此处查看代码图片\n\n```\nimport scala.jdk.CollectionConverters.*\n\
  import scala.collection.mutable.Buffer\nval cmd: Buffer[String] = pb.command().asScala\
  \ // Java 到 Scala\n// 你不能使用 ArrayBuffer——被封装的对象只保证是 Buffer\n// 在我们的示例中，`cmd == command`。\n\
  \n## 练习题\n\n1. 编写一段代码片段，将 `a` 设置为包含从 `0`（包含）到 `n`（不包含）的 `n` 个整数的数组。\n2. 编写一个循环，交换整数数组中相邻元素。例如，`Array(1,\
  \ 2, 3, 4, 5)` 变为 `Array(2, 1, 4, 3, 5)`。\n3. 编写一个循环，交换整数数组中相邻元素。例如，`Array(1, 2,\
  \ 3, 4, 5)` 变为 `Array(2, 1, 4, 3, 5)`。\n4. 编写一个循环，交换整数数组中相邻元素。例如，`Array(1, 2, 3,\
