  .zip(\"World\")` 会发生什么？想出一个使用场景。\n\n# 第 5 章 类\n\n## 本章主题\n\n* 5.1 简单类与无参数方法](#ch05.xhtml_sec1)\n\
  * 5.2 带有 Getter 和 Setter 的属性](#ch05.xhtml_sec2)\n* 5.3 仅带有 Getter 的属性](#ch05.xhtml_sec3)\n\
  * 5.4 私有字段](#ch05.xhtml_sec4)\n* 5.5 辅助构造函数](#ch05.xhtml_sec5)\n* 5.6 主构造函数](#ch05.xhtml_sec6)\n\
  * 5.7 嵌套类](#ch05.xhtml_sec7)\n* 练习题\n\n在本章中，你将学习如何在 Scala 中实现类。如果你熟悉 Java、Python\
  \ 或 C++ 中的类，就不会觉得这很难，并且你会喜欢 Scala 更简洁的表示法。本章的关键点是：\n\n* 无参数的访问方法不需要括号。\n* 类中的字段自动带有\
  \ getter 和 setter。\n* 你可以用自定义的 getter/setter 替换字段，而无需更改类的调用者——这就是“统一访问原则”。\n* 每个类都有一个主构造函数，主构造函数与类定义交织在一起。它的参数变成了类的字段。\n\
  * 辅助构造函数是可选的。它们被称为 `this`。\n* 类可以嵌套。每个外部类都有其自己的内部类版本。\n\n## 5.1 简单类与无参数方法\n\n在 Scala\
  \ 中，最简单的形式看起来非常像 Java 或 C++：\n\n点击此处查看代码图片\n\n```\nval symbols = Array(\"<\", \"\
  -\", \">\")\nval counts = Array(2, 10, 2)\nval pairs = symbols.zip(counts)\n```\n\
  \n产生一个对的数组\n\n点击此处查看代码图片\n\n```\nArray((\"<\", 2), (\"-\", 10), (\">\", 2))\n```\n\
  \n然后统一处理：\n\n```\n\nfor (s, n) <- pairs do print(s * n) // 输出 <<---------->>\n```\n\
  \n![Images](img/tip.jpg) 提示\n\n`toMap` 方法将对的集合转换为映射。\n\n如果你有一个键的集合和一个平行的值集合，将它们\
  \ zip 起来并转换为如下的映射：\n\n```\nkeys.zip(values).toMap\n```\n\n## 5.2 带有 Getter 和 Setter\
  \ 的属性\n\n在编写 Java 类时，我们不使用公共字段：\n\n点击此处查看代码图片\n\n```\npublic class Person { // 这是\
  \ Java\n  public int age;\n}\n```\n\n有了公共字段，任何人都可以写入 `fred.age`，让 Fred 变年轻或变老。这就是为什么我们倾向于使用\
  \ getter 和 setter 方法：\n\n点击此处查看代码图片\n\n```\npublic class Person { // 这是 Java\n \
  \ private int age;\n  public int getAge() { return age; }\n  public void setAge(int\
  \ age) { this.age = age; }\n}\n```\n\n这样的 getter/setter 对通常被称为一个*属性*（property）。我们说\
  \ `Person` 类有一个 `age` 属性。\n\n\n\n\n这样做有什么好处呢？就其本身而言，并没有什么。任何人都可以调用 `fred.setAge(21)`，让他永远留在\
  \ 21 岁。\n\n但如果变成了一个问题，我们可以对其防御：\n\n点击此处查看代码图像\n\n```java\npublic void setAge(int\
  \ newValue) { // 这是 Java\n  if (newValue > age) age = newValue;\n  // 无法变年轻\n}\n\
  ```\n\ngetter（访问器）和 setter（存值器）比公共字段更好，因为它们允许你从简单的 get/set 语义开始，并根据需要进行演进。\n\n![Images](img/note.jpg)\
  \ 笔记\n\n仅仅因为 getter 和 setter 比公共字段好，并不意味着它们总是好的。通常，如果每个客户端都可以获取或设置对象状态的碎片，将是很糟糕的。在本节中，我将向你展示如何在\
  \ Scala 中实现属性（properties）。可读/可写属性是否是合适的设计，取决于你自己的明智选择。\n\nScala 为每个公共字段提供了 getter\
  \ 和 setter 方法。考虑这个示例：\n\n```scala\nclass Person :\n  var age = 0\n```\n\nScala 为\
  \ JVM 生成了一个类，其中包含一个 `private` 的 `age` 字段以及 getter 和公共 setter 方法。\n\n在 Scala 中，getter\
  \ 和 setter 方法被称为 `age` 和 `age_`。例如，\n\n点击此处查看代码图像\n\n```scala\nval fred = Person()\n\
  fred.age = 21 // 调用 fred.age_=(21)\nprintln(fred.age) // 调用方法 fred.age()\n```\n\n\
  在 Scala 中，getter 和 setter 的命名不是 `getXxx` 和 `setXxx`，但它们实现了相同的目的。如果你为了与 Java 交互需要\
  \ `getXxx` 和 `setXxx` 方法，请使用 `@BeanProperty` 注解。详情请参见第 15 章。\n\n![Images](img/note.jpg)\
  \ 笔记\n\n为了亲眼看到这些方法，请编译包含 `Person` 类的文件，然后使用 `javap` 查看字节码：\n\n点击此处查看代码图像\n\n```bash\n\
  $ scala3-compiler Person.scala\n$ javap -private Person\nCompiled from \"Person.scala\"\
  \npublic class Person {\n  private int age;\n  public Person();\n  public int age();\n\
  \  public void age_$eq(int);\n}\n```\n\n如你所示，编译器创建了方法 `age` 和 `age_$eq`。（=` 符号被转换为\
  \ `$eq` 是因为 JVM 不允许方法名中使用 `=`。）\n\n你可以重新定义 getter 和 setter 方法。例如，\n\n点击此处查看代码图像\n\
  \n```scala\nclass Person :\n  private var privateAge = 0 // 设置为私有并重命名\n\n  def age\
  \ = privateAge\n  def age_=(newValue: Int) =\n    if newValue > privateAge then\
  \ privateAge = newValue // 无法变年轻\n```\n\n类的用户仍然访问 `fred.age`，但现在 Fred 无法变年轻了：\n\n\
  点击此处查看代码图像\n\n```scala\nval fred = Person()\nfred.age = 30\nfred.age = 21\nprintln(fred.age)\
  \ // 输出 30\n```\n\n![Images](img/note.jpg) 笔记\n\n影响深远的 Eiffel 语言的发明者 Bertrand Meyer\
  \ 提出了*统一访问原则*（Uniform Access Principle），该原则规定：“模块提供的所有服务都应该通过统一的表示法可用，这种表示法不会泄露它们是通过存储还是通过计算实现的。”在\
  \ Scala 中，`fred.age` 的调用者不知道 `age` 是通过字段还是通过方法实现的。（当然，在 JVM 中，服务始终通过方法实现，无论是合成的还是程序员提供的。）\n\
  \n## 5.3 只有 Getter 的属性\n\n有时，你想要一个只有 getter 而没有 setter 的*只读属性*（read-only property）。如果属性的值在对象构造后永远不会改变，请使用\
  \ `val` 字段：\n\n点击此处查看代码图像\n\n```scala\nclass Message :\n  val timeStamp = java.time.Instant.now\n\
  \  ... 自己的代码\n```\n\nScala 编译器会生成一个带有私有 `final` 字段和公共 getter 方法的 Java 类，但没有 setter。\n\
  \n然而，有时你想要一个客户端不能随意设置、但通过其他方式发生变的属性。来自第 5.1 节“简单类与无参数方法”的第 63 页 `Counter` 类就是一个很好的例子。从概念上讲，计数器有一个\
  \ `current` 属性，在调用 `increment` 方法时会更新，但该属性没有 setter。\n\n你不能用 `val` 实现这样的属性——`val`\
  \ 永远不会改变。相反，提供一个私有字段和一个属性 getter。这就是你在 `Counter` 示例中看到的：\n\n点击此处查看代码图像\n\n```scala\n\
  class Counter :\n  private var value = 0\n  def increment() = value += 1\n  def\
  \ current = value // 没有 setter\n```\n\n你不能用 `val` 实现这样的属性——`val` 永远不会改变。相反，提供一个私有字段和一个属性\
  \ getter。这就是你在 `Counter` 示例中看到的：\n\n点击此处查看代码图像\n\n```scala\nclass Counter :\n  private\
  \ var value = 0\n  def increment() = value += 1\n  def current = value // 没有 setter\n\
  ```\n\n你不能用 `val` 实现这样的属性——`val` 永远不会改变。相反，提供一个私有字段和一个属性 getter。这就是你在 `Counter`\
