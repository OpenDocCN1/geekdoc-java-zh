  \ `Point(3, 4)` 构造 `Point` 实例，而无需使用 `new`。\n\n5. 使用 `App` trait 写一个 Scala 应用，反序打印其命令行参数并用空格分隔。例如，`scala\
  \ Reverse Hello World` 应该打印 `World Hello`。\n\n6. 写一个描述四种扑牌花色的枚举，使得 `toString` 方法返回\
  \ ![Images](img/c0083-01.jpg) 或 ![Images](img/c0083-02.jpg)。\n\n7. 实现一个函数，检查上一个练习中的花色颜色值是否为红色。\n\
  \n8. 写一个描述 RGB 色彩体八个顶角的枚举。使用颜色值作为 ID（例如，`Red` 使用 `0xff0000`）。\n\n# 第 7 章 包、导入与导出\n\
  \n**本章主题** **A1**\n\n* 7.1 包\n* 7.2 包的作用域嵌套\n* 7.3 链式包语句\n* 7.4 文件顶部符号\n* 7.5 包级函数和变量\n\
  * 7.6 包可见性\n* 7.7 导入\n* 7.8 导入可以位于任何地方\n* 7.9 重命名与隐藏成员\n* 7.10 隐式导入\n* 7.11 导出\n\
  * 练习\n\n一个包包含具有共同目的的功能。大型程序和库通常被组织在许多包中。\n\n包名是唯一的但很长。通过使用 import 语句，你可以用较短的名字访问包的功能。\n\
  \n本章以讨论 `export` 语法的结束，它在语法上与 import 语句相似，但用于委托。\n\n本章的要点是：\n\n* 包的嵌套就像内部类一样。\n\
  * 包的路径不是绝对的。\n* 包语句中的链式 `x.y.z` 会导致中间包 `x` 和 `x.y` 不可见。\n* 文件顶部不带大括号的包语句扩展到整个文件。\n\
  * 包可以包含函数和变量。\n* import 语句可以导入包、类和对象。\n* import 语句可以位于任何地方。\n* import 语句可以重命名和隐藏成员。\n\
  * `java.lang`、`scala` 和 `Predef` 总是被导入的。\n* export 语句提供了一种委托机制。\n\n## 7.1 包\n\n\
  Scala 中的包的作用与 Java 中的包、Python 中的模块或 C++ 中的命名空间（namespaces）相同。为了管理命名，可以使用 `package`\
  \ 语句，例如 `package com.horstmann.people`。\n\n包与源文件之间没有强制的联系。你不需要将 `Employee.scala`\
  \ 和 `Manager.scala` 放入 `com/horstmann/people` 目录。\n\n相反，一个文件可以属于多个包。`People.scala`\
  \ 文件可能包含\n\n点击此处查看代码图像\n\n```\npackage com :\n  package horstmann :\n    package\
  \ people :\n      class Person(name: String) :\n        ...\n\n    package users\
  \ :\n      class User(username: String, password: String) :\n        ...\n```\n\n\
  ## 7.2 包的作用域嵌套\n\nScala 包与其他所有作用域一样嵌套。你可以访问封装作用域中的名称。例如：\n\n点击此处查看代码图像\n\n```\n\
  package com :\n  package horstmann :\n    package people :\n      class Employee(name:\
  \ String, var salary: Double) :\n        ...\n        def giveRaise(rate: Double)\
  \ =\n          salary += Math.percentOf(salary, rate)\n    object Math :\n     \
  \ def percentOf(value: Double, rate: Double) = value * 100\n      ...\n```\n\n注意\
  \ `Math.percentOf` 限定符。`Math` 类定义在父包中。父包中的所有内容都在作用域内，没有必要使用 `com.horstmann.Math.percentOf。（但如果你愿意，也可以——毕竟\
  \ `com` 也在作用域内。）\n\n这比 Java 更规则，Java 的包不能嵌套。\n\n然而，有一个缺陷。某些程序员喜欢利用 `scala` 包总是被导入的这一事实（参见第\
  \ 7.10 节，“位于第 92 页”）。因此，可以使用 `collection` 代替 `scala.collection`：\n\n点击此处查看代码图像\n\
  \n```\npackage com :\n  package horstmann :\n    package people :\n      class Manager(name:\
  \ String) :\n        val subordinates = collection.mutable.ArrayBuffer[Employee]()\n\
  \        ...\n```\n\n但是，假设有人引入了 `com.horstmann.collection` 包——也许在以后，在不同的文件中。\n\n\
  \n\n\n随后 `Manager` 类不再通过编译。它在 `com.horstmann.collection` 包中查找一个 `mutable` 成员，但没有找到它。`Manager`\
  \ 类意图是使用顶层 `scala` 包下的 `collection` 包，而不是恰好位于某个可访问作用域内的任何 `collection` 子包。\n\n在\
  \ Java 中，这个问题不会发生，因为包名始终是*绝对的*（absolute*它们从包层次结构的根节点开始。但在 Scala 中，包名是相对的，就像内部类名一样。对于内部类，通常不会遇到问题，因为所有代码都在一个文件中，并受该文件的所有者控制。但包是开放的。任何人都可以通过添加具有相同\
  \ `package` 声明的新文件来向某个包做出贡献。\n\n最安全的解决方案是使用绝对包名。它们必须以特殊标识符 `_root_` 开头，例如：\n\n点击此处查看代码图像\n\
  \n```\nval subordinates = _root_.scala.collection.mutable.ArrayBuffer[Employee]()\n\
  ```\n\n![Images](img/tip.jpg) 提示\n\n大多数 Scala 程序员对包名使用完整路径，而不带 `_root_` 前缀。只要大家在嵌套包中避免使用\
  \ `scala`、`java`、`javax` 以及顶级域名（`com`、`net` 等）作为名称，这样做就是安全的。\n\n## 7.3 链式包语句\n\n\
  包语句可以包含一个“链”或路径段，例如：\n\n点击此处查看代码图像\n\n```\npackage com :\n  package horstmann.people\
  \ :\n    // com.horstmann 的成员在这里是不可见的\n    class Executive :\n      val subordinates\
  \ = collection.mutable.ArrayBuffer[Manager]()\n```\n\n这样的子句限制了可见的成员。现在，`com.horstmann.collection`\
  \ 包不再可以通过 `collection` 访问。\n\n## 7.4 文件顶部表示法\n\n你可以不用目前为止使用的嵌套表示法，可以在文件顶部使用一个 `package`\
  \ 子句，而不需要冒号或大括号。例如：\n\n点击此处查看代码图像\n\n```\npackage com.horstmann.collection // 无冒号\n\
  \nclass Group :\n  ...\n```\n\n此文件中的所有内容都在 `com.horstmann.collection` 包中。这与 Java\
  \ 的 `package` 语句完全等。\n\n![Images](img/tip.jpg) 提示\n\n当文件中的所有代码属于同一个包时，通常使用文件顶部表示法。它可以避免对包内容进行缩进。\n\
  \n## 7.5 包级函数和变量\n\n你已经看到包可以包含类。包也可以包含其他类型声明，如特质（traits）、枚举（enumerations）和对象（objects）。例如，以下是有效的：\n\
  \n点击此处查看代码图像\n\n```\npackage com.horstmann.people\n\nval defaultName = \"John Q.\
  \ Public\"\ndef employ(p: Person) = Employee(p.name, 0)\n```\n\n在后台，包对象会被编译成 Java\
  \ 虚拟机类，其中带有静态方法和字段，位于给定的包内部，名为 `filename$package.class`。如果示例代码存储在 `People.scala`\
  \ 中，那么它将是类 `com.horstmann.people.People$package`。\n\n通常情况下，Scala 源文件的名称对编译器生成的类文件没有影响。每个类、枚举、对象或特质都会编译成具有给定包名和类名的\
  \ Java 类文件。可能会有辅助类（例如伴侣对象的类），但它们的名称源自主功能的名称。\n\n但在包级函数和变量的情况下，Scala 编译器必须构建一个 Java\
  \ 类来存放它们。同一个包可以有多个带有顶层定义的文件，将它们全部合并到一个单个类文件中将太复杂了。因此，每个源文件都会产生一个单独的类文件。而这些类文件包含了源文件名。\n\
  \n如果你重命名了源文件，存放包级定义的类文件名称就会发生变化，你必须重新编译所有依赖于这些文件。\n\n因此，将一个包的所有顶层定义保留在一个固定命名的单文件中是一个好主意。传统的选择是\
  \ `package.scala`，放置与包名匹配的子目录中，例如 `com/horstmann/people/package.scala`。\n\n## 7.6\
  \ 包可见性\n\n在 Java 中，未声明为 `public`、`private` 或 `protected` 的类成员在包含该类的包中可见的。在 Scala\
  \ 中，你可以使用封装在括号内的限定符来实现相同的效果。以下方法在自己的包中可见的：\n\n点击此处查看代码图像\n\n```\npackage com.horstmann.users\n\
  \nclass User(username: String, password: String) :\n  private[users] def longDescription\
  \ =\n    s\"A user with name $username and password $password\"\n  ...\n```\n\n\
  你可以将可见性扩展到外层包：\n\n点击此处查看代码图像\n\n```\nprivate[horstmann] def safeDescription =\n\
  \  s\"A user with name $username and password ${\"*\" * password}\"\n```\n\n在 `com.horstmann`\
  \ 中，第一个方法是可以访问的。\n\n## 7.7 导入\n\n导入允许你使用短名称而不是长名称。在 `com.horstmann` 中，你可以写 `Color`\
  \ 而不是 `java.awt.Color`。\n\n这是导入的唯一目的。如果你讨厌长名称，你永远不需要它们。\n\n你可以导入包的所有成员：\n\n```\n\
  import java.awt.*\n```\n\n![Images](img/tip.jpg) 提示\n\n在 Scala 中，`*` 是一个有效的标识符。如果其他人这样做，使用\
  \ `*` 来导入它。\n\n你也可以导入类或对象的所有成员。\n\n点击此处查看代码图像\n\n```\nimport java.util.HashMap as\
  \ JavaHashMap\nimport scala.collection.mutable.*\n```\n\n现在 `JavaHashMap` 是 `java.util.HashMap`，而普通的\
  \ `HashMap` 是 `scala.collection.mutable.HashMap`。\n\n这类似于 Java 的 `import static`。\n\
  \n一旦导入了一个包，就可以用更短的名称访问其子包。例如：\n\n点击此处查看代码图像\n\n```\nimport java.awt.*\n\nval transform\
  \ = geom.AffineTransform.getScaleInstance(0.5, 0.5)\n```\n\n`geom` 包是 `java.awt`\
  \ 的成员，导入将其引入了作用域。\n\n## 7.8 导入可以随处可见\n\n在 Scala 中，`import` 语句可以出现在任何地方，而不是在文件顶部。`import`\
  \ 语句的作用域持续到所在块的结束。例如，\n\n点击此处查看代码图像\n\n```\nclass Group :\n  // 限制在此类内的导入\n  import\
  \ scala.collection.mutable.*\n  import com.horstmann.users.*\n  val members = ArrayBuffer[User]()\n\
  \  ...\n```\n\n限制范围的导入非常有用，特别是配合通配符导入。从不同的源导入大量名称总是令人担忧。事实上，有些程序员非常讨厌通配符导入，以至于从不使用它们，而是让\
  \ IDE 生成长的类列表。\n\n通过将导入限制在需要的作用域内，你可以极大减少潜在冲突。\n\n## 7.9 重命名和隐藏成员\n\n如果你想从一个包中导入多个成员，可以使用如下选择器语法：\n\
  \n```scala\nimport java.awt.{Color, Font}\n```\n\n使用 `as` 关键字重命名成员：\n\n```scala\n\
  import java.util.HashMap as JavaHashMap\nimport scala.collection.mutable.*\n```\n\
  \n现在 `JavaHashMap` 是 `java.util.HashMap`，而 `HashMap` 是 `scala.collection.mutable.HashMap`。\n\
  \n`HashMap as _` 语法是隐藏一个成员而不是重命名它。当你导入了其他相同名称的成员时，这非常有用。\n\n\n\n\n点击此处查看代码图像\n\n\
  ```java\nimport java.util.{HashMap as _, *}\nimport scala.collection.mutable.*\n\
  ```\n\n现在 `HashMap` 明确地指向 `scala.collection.mutable.HashMap`，因为 `java.util.HashMap`\
  \ 被隐藏了。\n\n## 7.10 隐式导入\n\n每个 Scala 程序隐式地开始于：\n\n```\nimport java.lang.*\nimport\
  \ scala.*\nimport Predef.*\n```\n\n`java.lang` 包总是会被导入。接下来，`scala` 包被导入，但方式很特殊。与所有其他导入不同，这种导入允许覆盖之前的导入。例如，`scala.StringBuilder`\
  \ 覆盖了 `java.lang.StringBuilder` 而不是与它冲突。\n\n最后，`Predef` 对象被导入。它包含了常用的类型、隐式转换和实用方法。（这些方法完全可以被放在\
  \ `scala` 包中，但在 Scala 引入包级函数很久以前，`Predef` 就被引入了。）\n\n由于 `scala` 包是默认导入的，你永远不需要编写以\
  \ `scala` 开头的包名。例如：\n\n```\ncollection.mutable.HashMap\n```\n\n效果等同于：\n\n点击此处查看代码图像\n\
  \n```\nscala.collection.mutable.HashMap\n```\n\n## 7.11 导出\n\n本章以 `export` 语句结束，它与\
  \ `import` 某些相似，为某些功能提供了别名。然而，`import` 可以与包、类或对象一起，而 `export` 仅用于对象。\n\n这里有一个具体的示例。`ColoredPoint`\
  \ 拥有一个颜色和一个点。现在我们想要获取颜色分量和点的坐标。当然，我们可以委托给颜色方法和点字段：\n\n点击此处查看代码图像\n\n```scala\nimport\
  \ java.awt.*\nclass ColoredPoint(val color: Color, val point: Point) :\n  def red\
  \ = color.getRed()\n  def green = color.getRed()\n  def blue = color.getBlue()\n\
  \  val x = point.x\n  val y = point.y\n```\n\n这种委托可能会变得繁琐，而且它有时会鼓励程序员使用继承。那么你就会自动继承一切，而不需要实现委托了。\n\
  \n然而，继承可能并不合适。`ColoredPoint` 是一个特殊的 `Color` 吗？一个特殊的 `Point` 吗？由于哲学和实践层面的原因，答案可能是“不是”的。\n\
  \n一个通用的软件工程原则是优选组合而非继承。在这里，`export` 功能可以提供帮助。与其手动委托功能，不如声明你想要的功能：\n\n点击此处查看代码图像\n\
  \n```scala\nclass ColoredPoint(val color: Color, val point: Point) :\n  export color.{getRed\
  \ as red, getGreen as green, getBlue as blue}\n  export point.{x, y}\n```\n\n该语法与\
  \ `import` 语句一样。将选定的功能括在大括号中，并使用箭头进行重命名。\n\n与导入一样，你可以导出除子集以外的所有功能：\n\n点击此处查看代码图像\n\
  \n```scala\nexport point.{\n  setLocation as _, translate as _, toString as _,\n\
  \  hashCode as _, equals as _, clone as _, *}\n```\n\n## 练习\n\n1. 编写一个示例程序来证明\n\n\
  点击此处查看代码图像\n\n```\npackage com.horstmann.impatient\n```\n\n并不等同于\n\n```scala\npackage\
  \ com\npackage horstmann\npackage impatient\n```\n\n2. 编写一个让你的 Scala 朋友困惑的难题，使用一个不在顶层的包\
  \ `com`。\n\n3. 编写一个包 `random`，包含函数 `nextInt(): Int`、`nextDouble(): Double` 和 `setSeed(seed:\
  \ Int): Unit`。生成随机数使用线性同余生成器：\n\n```\nnext = (previous × a + b) mod 2n,\n```\n\n\
  其中 `a` = `1664525`，`b` = `1013904223`，`n` = `32`，`previous` 的初始值为 `seed`。\n\n4.\
  \ 创建两个源文件，每个文件为给定的包贡献两个类和一个顶层函数。生成了哪些类文件？在哪些目录？如果将源文件移动到不同的目录会怎样？如果重命名源文件会怎样？\n\n\
  5. `private[com] def giveRaise(rate: Double)` 的意义是什么？它有用吗？\n\n6. 编写一个程序将 Java hash\
  \ map 中的所有元素复制到 Scala hash map 中。使用导入来重命名这两个类。\n\n7. 在上一个练习中，将所有导入移动到可能的内部作用域。\n\
  \n8. 以下代码的效果是什么：\n\n```\nimport java.*\nimport javax.*\n```\n\n这是一个好主意吗？\n\n9. 编写一个程序，导入\
  \ `java.lang.System` 类，从 `user.name` 系统属性中读取用户名，从 `StdIn` 对象读取密码，如果密码不是 `\"secret\"\
  `，则向标准错误流打印消息。否则，向标准输出流打印问候语。不要使用任何其他导入，也不要使用任何限定名（带点的名称）。\n\n10. 在上一个练习中，将所有导入移动到可能的内部作用域。\n\
