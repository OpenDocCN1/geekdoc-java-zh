  \n# 第 19 章 上下文抽象\n\n**本章主题**\n\n* 19.1 上下文参数\n* 19.2 更多关于上下文参数\n* 19.3 声明 Given\
  \ 实例\n* 19.4 `for` 和 `match` 表达式中的 Givens\n* 19.5 导入 Givens\n* 19.6 扩展方法\n* 19.7\
  \ 上下文方法的位置\n* 19.8 隐式转换\n* 19.9 隐式转换规则\n* 19.10 导入隐式转换\n* 19.11 上下文函数\n* 19.12 证据\n\
  * 19.13 @implicit 注解\n* 19.14 练习\n\n通常，系统需要某些设置——例如数据库连接、日志记录或区域设置。将这些设置作为参数传递是不切行的。Scala\
  \ 有一种强大的机制可以在不显式传递的情况下让这些值可用——通过*上下文参数*。在本章中，你将学习如何为类添加扩展方法、如何富化类以及如何处理隐式转换。让我们首先了解函数如何接收这些参数。\n\
  \n函数或方法可以有一个或多个标记有 `using` 关键字的参数列表。对于这些参数，编译器将寻找合适的值来提供（我们稍后会学习）。这里有一个简单的示例：\n\n\
  点击此处查看代码图片\n\n```scala\ncase class QuoteDelimiters(left: String, right: String)\n\
  \ndef quote(what: String)(using delims: QuoteDelimiters) =\n  delims.left + what\
  \ + delims.right\n```\n\n你可以通过显式的 `QuoteDelimiters` 对象调用 `quote` 方法，如下：\n\n点击此处查看代码图片\n\
  \n```scala\nquote(\"Bonjour le monde\")(using QuoteDelimiters(\"«\", \"»\"))\n//\
  \ 返回 «Bonjour le monde»\n```\n\n注意这里有两个参数列表。该函数是柯里化的——参见第 12 章。\n\n然而，上下文参数的意义在于你不想显式地提供\
  \ `using` 参数。你只想调用：\n\n```scala\nquote(\"Bonjour le monde\")\n```\n\n现在编译器将寻找类型为\
  \ `QuoteDelimiters` 的合适值。这必须是一个声明为 `given` 的值：\n\n点击此处查看代码图片\n\n```scala\ngiven\
  \ englishQuoteDelims: QuoteDelimiters = QuoteDelimiters(\"“\", \"”\")\n```\n\n###\
  \ 19.1 上下文参数\n\n通常，系统某些函数需要某些设置——例如数据库连接、日志记录或区域设置。将这些设置作为参数传递是不切行的，因为每个函数都需要将它们传递给它调用的函数。你可以使用全局可见的对象，但这并不灵活。Scala\
  \ 有一种强大的机制可以在不显式传递的情况下让值可用——通过上下文参数。让我们首先了解函数如何接收这些参数。\n\n函数或方法可以有一个多个标记有 `using`\
  \ 关键字的参数列表。对于这些参数，编译器将在调用函数时寻找合适的值，这是一个我们稍后会研究的机制。上下文函数类型描述了一个带有上下文参数的函数。\n\n\n\n\
  \n\n现在分隔符被隐式地传递给 `quote` 函数。\n\n![Images](img/note.jpg) 备注\n\n你很快就会看到，有更紧凑的方式来声明\
  \ `given` 值。目前，我使用的是一种易于理解的形式。\n\n然而，你通常不想声明全局的 `given` 值。为了在上下文之间切换，你可以声明如下对象对象：\n\
  \n点击此处查看代码图像\n\n```\nobject French :\n  given quoteDelims: QuoteDelimiters = QuoteDelimiters(\"\
  «\", \"»\")\n  ...\n\nobject German :\n  given quoteDelims: QuoteDelimiters = QuoteDelimiters(\"\
  „\", \"“\")\n  ...\n```\n\n然后使用以下语法从其中一个对象中导入 `given` 值：\n\n```\nimport German.given\n\
  ```\n\n![Images](img/note.jpg) 备注\n\n对于每个类型，只能有一个 `given` 值。因此，对常用类型使用 `using` 参数并不是一个好主意。例如，\n\
  \n点击此处查看代码图像\n\n```\ndef quote(what: String)(using left: String, right: String)\
  \ // 不！\n```\n\n这将无法工作——因为可能有两个不同 `String` 类型 `given` 值。\n\n你现在已经看到了上下文参数的本质。在接下来的三个章节中，你将学习\
  \ `using` 子句的细节、`given` 声明以及导入它们的方法。\n\n## 19.2 关于上下文参数\n\n在前节中，你看到了一个带有 `using`\
  \ 参数的函数：\n\n点击此处查看代码图像\n\n```\ndef quote(what: String)(using delims: QuoteDelimiters)\
  \ = ...\n```\n\n如果函数体没有引用 `using` 参数，则不需要给它命名：\n\n点击此处查看代码图像\n\n```\ndef attributedQuote(who:\
  \ String, what: String)(using QuoteDelimiters) =\n  s\"$who said: ${quote(what)}\"\
  \n```\n\n`using` 参数仍然传递给需要它的函数——在这种情况下是 `quote` 函数。\n\n你可以始终通过调用 `summon` 获取 `given`\
  \ 值：\n\n点击此处查看代码图像\n\n```\ndef quote(what: String)(using QuoteDelimiters) =\n  summon[QuoteDelimiters].left\
  \ + what + summon[QuoteDelimiters].right\n```\n\n这里是 `summon` 的定义：\n\n点击此处查看代码图像\n\
  \n```\ndef summonT: x\n```\n\n![Images](img/note.jpg) 备注\n\n正如莎士比亚的世界充满了任何人都可以召唤的灵魂，Scala\
  \ 世界被 `given` 对象填充，每个类型最多一个。任何程序员都可以召唤它们。它们会产生吗？这取决于编译器是否能找到唯一的 `given` 对象。\n\n\
  函数可以有多个 `using` 参数。例如，我们可能想在引号之外还本地化消息。每种语言映射到 `MessageFormat` 模板：\n\n点击此处查看代码图像\n\
  \n```\ncase class Messages(templates: Map[String, String])\n\nobject French :\n\
  \  ...\n  given msgs: Messages =\n    Messages(\"greeting\" -> \"Bonjour {0}!\"\
  ,\n      \"attributedQuote\" -> \"{0} dit {1}{2}\")\n```\n\n此方法通过 `using` 参数接收引号分隔符和消息映射：\n\
  \n点击此处查看代码图像\n\n```\ndef attributedQuote(who: String, what: String)(\n  using delims:\
  \ QuoteDelimiters, msgs: Messages) =\n    MessageFormat.format(msgs.templates(\"\
  attributedQuote\"),\n      who, delims.left, what, delims.right)\n```\n\n你可以对 `using`\
  \ 参数进行柯里化：\n\n点击此处查看代码图像\n\n```\ndef attributedQuote(who: String, what: String)(\n\
  \  using delims: QuoteDelimiters)(using msgs: Messages) = ...\n```\n\n在这个示例中，不需要使用柯里化。但存在柯里化有助于类型推断的情况。\n\
  \n主构造函数可以拥有上下文参数：\n\n点击此处查看代码图像\n\n```\nclass Quoter(using delims: QuoteDelimiters)\
  \ :\n  def quote(what: String) = ...\n  def attributedQuote(who: String, what: String)\
  \ = ...\n  ...\n```\n\n`delims` 变量在对象构造时从上下文参数初始化。之后，它没有特殊之处。它的值在所有方法中都是可用的。\n\n\
  `using` 参数可以通过命名（`using ev: => T`）来延迟其产生。如果 `given` 值的产生代价很高，或者为了打破循环，这非常有用。这并不常见。\n\
  \n## 19.3 声明 given 实例\n\n在本节中，我们将介绍声明 `given` 实例的各种。你已经看到了带有名称、类型和值的显式形式。\n\n点击此处查看代码图像\n\
  \n```\ngiven englishQuoteDelims: QuoteDelimiters = QuoteDelimiters(\"“\", \"”\"\
  )\n```\n\n右侧不必是构造函数——可以是任何 `QuoteDelimiters` 类型的表达式。\n\n![Images](img/caution.jpg)\
  \ 注意\n\n`given` 实例没有类型推断。以下是一个错误：\n\n点击此处查看代码图像\n\n```\ngiven englishQuoteDelims\
  \ = QuoteDelimiters(\"“\", \"”\")\n  // 错误—没有类型推断\n```\n\n如果你使用构造函数，可以省略类型和 `=`\
  \ 运算符：\n\n点击此处查看代码图像\n\n```\ngiven englishQuoteDelims: QuoteDelimiters(\"“\", \"\
  ”\")\n```\n\n你也可以省略名称，因为你通常不需要：\n\n点击此处查看代码图像\n\n```\ngiven QuoteDelims(\"“\", \"\
  ”\")\n```\n\n在抽象类或 trait 中，你可以定义 *given*，带有名称和类型但没有值。声明 `given` 实例是常见的。例如，当你声明类型\
  \ `Comparator[Int]` 的 `given` 实例时，必须提供 `compare` 方法的实现：\n\n点击此处查看代码图像\n\n```\ngiven\
  \ intComp: Comparator[Int] =\n  new Comparator[Int]() :\n    def compare(x: Int,\
  \ y: Int) = Integer.compare(x, y)\n```\n\n这种常见情况有一个方便的快捷方式：\n\n点击此处查看代码图像\n\n```\n\
  given intComp: Comparator[Int] with\n  def compare(x: Int, y: Int) = Integer.compare(x,\
  \ y)\n```\n\n选择 `with` 关键字是为了避免连续两个冒号。名称是可选的：\n\n点击此处查看代码图像\n\n```\ngiven Comparator[Int]\
  \ with\n  def compare(x: Int, y: Int) = Integer.compare(x, y)\n```\n\n你可以创建参数化的\
  \ `given` 实例。例如：\n\n点击此处查看代码图像\n\n```\ngiven comparableComp[T <: Comparable[T]]:\
  \ Comparator[T] with\n    def compare(x: T, y: T) = x.compareTo(y)\n```\n\n实例名称是可选的，但实例类型前的冒号是必须的。让我们用这个示例引入另一个概念：带有\
  \ `using` 参数的 `given` 实例。考虑两个 `List[T]` 的比较。如果两者都不为空，我们比较它们的头部。\n\n我们如何做呢？我们需要知道类型\
  \ `T` 的值是可以比较的。也就是说，我们需要类型为 `Comparator[T]` 的 `given`。一样，这种需求可以通过 `using` 子句来表达：\n\
  \n点击此处查看代码图像\n\n```\ngiven listCompT: Comparator[List[T]] =\n  new Comparator[List[T]]()\
  \ :\n    def compare(xs: List[T], ys: List[T]) =\n      if xs.isEmpty && ys.isEmpty\
  \ then 0\n      else if xs.isEmpty then -1\n      else if ys.isEmpty then 1\n  \
  \    else\n        val diff = tcomp.compare(xs.head, ys.head)\n        if diff !=\
  \ 0 then diff\n        else compare(xs.tail, ys.tail)\n```\n\n像之前，你可以省略名称并利用 `with`\
  \ 语法。\n\n\n\n\n\n```\ngiven T: Comparator[List[T]] with\n  def compare(xs: List[T],\
  \ ys: List[T]) =\n    ...\n```\n\n![Images](img/note.jpg) 注意\n\n与其使用显式的 `using`\
  \ 参数，你你可以为类型参数使用*上下文边界*（context bound）：\n\n点击此处查看代码图片\n\n```\ngiven [T : Comparator]\
  \ : Comparator[List[T]] with ...\n```\n\n正如你在第 17 章中看到的，必须有一个 `given` 的 `Comparator[T]`\
  \ 实例。这等同于一个 `using` 子句。但有一点不同：你没有为 `given` 实例提供参数。相反，你从“冥界世界”中召唤它：\n\n点击此处查看代码图片\n\
  \n```\nval ev = summon[Comparator[T]]\nval diff = ev.compare(xs.head, ys.head)\n\
  ```\n\n通常对这类被召唤的对象使用变量名 `ev`。它是“evidence”（证据）的缩写。`given` 值可以被召唤这一事实，本身就是它们存在的证据。\n\
  \n让我们反思一下该示例背后的策略。我们为 `Comparator[Int]`、`Comparator[Double]` 等声明了特殊的（ad-hoc）`given`\
  \ 实例。通过参数化规则，我们为所有扩展 `Comparable[T]` 的类型 `T` 获取 `Comparator[T]`。这包含了 `String` 以及大量的\
  \ Java 类型，如 `LocalDate` 或 `Path`。接下来，我们为任何本身拥有 `Comparator[T]` 实例的类型 `T` 获取了 `Comparator[List[T]]`\
  \ 实例。该过程可以适用于其他集合，在更多的技术努力下，还可以适用于元组（tuples）和样例类（case classes）。注意，这一切是在没有各个类配合的情况下完成。例如，我们没有以任何方式修改\
  \ `List` 类。\n\n这种努力的好处是什么？它允许我们编写需要排序的泛函数。这些函数适用于所有具有给定 `Comparator[T]` 实例的类型 `T`。这里有一个典型的示例：\n\
  \n点击此处查看代码图片\n\n```\ndef maxT(using comp: Comparator[T]) =\n  if a.length == 0 then\
  \ None\n  else\n    var m = a(0)\n    for i <- 1 until a.length do\n      if comp.compare(a(i),\
  \ m) > 0 then m = a(i)\n    Some(m)\n```\n\nScala 标准库正是这样做的，只是使用的是扩展了 `Comparator`\
  \ 的 `Ordering` trait。\n\n### 19.4 `for` 和 `match` 表达式中的 Given\n\n你可以在 `for` 循环中声明一个\
  \ `given`：\n\n点击此处查看代码图片\n\n```\nval delims = List(QuoteDelimiters(\"“\", \"”\"\
  ), QuoteDelimiters(\"«\", \"»\"),\n  QuoteDelimiters(\"“\", \"“\"))\nfor given QuoteDelimiters\
  \ <- delims yield\n  quote(text)\n```\n\n在循环的每次迭代中，`given` `QuoteDelimiters` 实例都会变化，`quote`\
  \ 函数使用不同的分隔符。\n\n通常情况下，`for` 循环 `for x <- a yield f(x)` 等同于 `a.map(f)`，其中 `a` 的值成为\
  \ `f` 的参数。在 `given` 形式 `for given T <- a yield f` 中，`a` 的值成为 `f` 的 `using` 参数。\n\
  \n`match` 表达式可以声明为 `given`：\n\n点击此处查看代码图片\n\n```\nval p = (text, QuoteDelimiters(\"\
  «\", \"»\"))\np match\n  case (t, given QuoteDelimiters) => quote(t)\n```\n\n`given`\
  \ 值在匹配到的 case 的右侧引入。注意，在上述两种情况下，你指定的都是 `given` 值的类型，而不是名称。如果你需要一个名称，请使用 `@` 语法：\n\
  \n点击此处查看代码图片\n\n```\nfor d @ given QuoteDelimiters <- delims yield\n  quote(d.left\
  \ + d.right)\n\np match\n  case (t, d @ given QuoteDelimiters) => quote(d.left +\
  \ d.right)\n```\n\n### 19.5 导入 Givens\n\n通常，你在一个对象中定义 `given` 值：\n\n点击此处查看代码图片\n\
  \n```\nobject French :\n  given quoteDelims = QuoteDelimiters(\"«\", \"»\")\n  given\
  \ NumberFormat = NumberFormat.getNumberInstance(Locale.FRANCE)\n```\n\n你根据需要导入它们，可以按名称或按类型导入：\n\
  \n点击此处查看代码图片\n\n```\nimport French.quoteDelims // 按名称导入\nimport French.NumberFormat\
  \ // 按类型导入\n```\n\n你可以导入多个 `given` 值。按名称导入的在按类型导入之前。\n\n点击此处查看代码图片\n\n```\nimport\
  \ French.{quoteDelims, NumberFormat}\n```\n\n你可以按类型导入多个 `given` 值。如果 `given` 类型是参数化的，你可以使用通配符导入：\n\
  \n点击此处查看代码图片\n\n```\nimport French.*\n```\n\n通配符会导入所有 `given` 实例。例如：\n\n点击此处查看代码图片\n\
  \n```\nimport French.*\n```\n\n通配符会导入所有 `given` 实例：\n\n点击此处查看代码图片\n\n```\nimport\
  \ French.*\n```\n\n注意，通配符会导入所有 `given`：\n\n```\nimport Comparators.*\n```\n\n按名称可以导入所有\
  \ `given` 实例：\n\n点击此处查看代码图片\n\n```\nimport French.quoteDelims\n```\n\n按名称可以导入所有\
  \ `given` 实例：\n\n点击此处查看代码图片\n\n```\nimport French.NumberFormat\n```\n\n按名称可以导入所有\
  \ `given` 实例：\n\n点击此处查看代码图片\n\n```\nimport French.{quoteDelims, NumberFormat}\n\
  ```\n\n按名称可以导入所有 `given` 实例：\n\n点击此处查看代码图片\n\n```\nimport Comparators.*\n```\n\n\
  按名称可以导入所有 `given` 实例：\n\n点击此处查看代码图片\n\n```\nimport Comparators.*\n```\n\n按名称可以导入所有\
  \ `given` 实例：\n\n```\nimport Comparators.*\n```\n\n通配符会导入所有 `given` 实例：\n\n```\n\
  import Comparators.*\n```\n\n通配符会导入所有 `given` 实例：\n\n```\nimport Comparators.*\n\
  ```\n\n通配符会导入所有 `given` 实例：\n\n```\nimport Comparators.*\n```\n\n通配符会导入所有 `given`\
  \ 实例：\n\n```\nimport Comparators.*\n```\n\n通配符会导入所有 `given` 实例：\n\n```\nimport Comparators.*\n\
  ```\n\n通配符会导入所有 `given` 实例：\n\n```\nimport Comparators.*\n```\n\n通配符会导入所有 `given`\
  \ 实例：\n\n```\nimport Comparators.*\n```\n\n通配符会导入所有 `given` 实例：\n\n```\nimport Comparators.*\n\
  ```\n\n通配符会导入所有 `given` 实例：\n\n```\nimport Comparators.*\n```\n\n通配符会导入所有 `given`\
  \ 实例：\n\n```\nimport Comparators.*\n```\n\n通配符会导入所有 `given` 实例：\n\n```\nimport Comparators.*\n\
  ```\n\n```\nimport Comparators.*\n```\n\n```\n\nimport\nators.*\n```\n```\n\n##\
  \ 19.6 扩展方法\n\n你是否曾希望某个类有一个方法？作为一名 Java 程序员，你唯一的途径是向 Oracle 申请该方法。祝你好运！\n\n在 Scala\
  \ 中，你可以定义一个*扩展方法*来提供你想要：\n\n```\nval contents = File(\"\").read\n```\n\n现在你可以对 `File`\
  \ 对象调用 `read` 了。\n\n扩展方法可以是一个运算符：\n\n```\nextension (s: String)\n  def -(t: String)\
  \ = s.replace(t, \"\")\n```\n\n现在你可以减去字符串：\n\n```\n\"units\" - \"u\"\n```\n\n扩展方法可以是参数化的：\n\
  \n```\nextension [T <: Comparable[T]](x: T)\n  def <(y: T) = x.compareTo(y)\n```\n\
  \n注意这个扩展是*选择性的*：它只为扩展 `Comparable` 的类型添加 `<` 方法。\n\n你可以为同一个类型添加多个扩展方法：\n\n```\n\
  extension (f: File)\n  def read = Files.readString(f.toPath)\n  def write(contents:\
  \ String) = Files.writeString(f.toPath, contents)\n```\n\n`export` 子句可以添加多个方法：\n\
  \n```\nextension (f: File)\n  def path = f.toPath\n  export path.*\n```\n\n现在所有\
  \ `Path` 方法都适用于 `File` 对象：\n\n```\nval home = File(\"\")\nhome.toAbsolutePath()\
  \ // 在我的电脑上，那是 Path(\"/home\")\n```\n\n### 19.7 扩展方法的查找位置\n\n考虑方法调用\n\n```\nobj.m(args)\n\
  ```\n\n其中 `m` 在 `obj` 中没有定义。那么 Scala 编译器需要查找一个可以应用于 `obj` 的扩展方法 `m`。\n\n编译器在四个地方查找扩展方法：\n\
  \n1.  调用作用域内——即在闭包块和类型、超类型以及导入中。\n\n2.  在构成 `obj` 类型 `T` 的所有类型的伴侣对象中。由于历史原因，这被称为类型\
  \ `T` 的“隐式作用域”。例如，`Pair[Person]` 的隐式作用域由 `Pair` 和 `Person` 对象的成员组成。\n\n3.  调用点的所有\
  \ `given` 实例。\n\n4.  `obj` 类型隐式作用域中的所有 `given` 实例。\n\n\n\n\n\n让我们来看看这些情况的示例。\n\n\
  你可以将扩展方法放在对象或包中，然后对其进行导入：\n\n点击此处查看代码图像\n\n```\nobject FileOps : // or package\n\
  \  extension(f: File)\n    def read = Files.readString(f.toPath)\n\nimport FileOps.*\
  \ // or import FileOps.read\nFile(\"/usr/share/dict/words\").read\n```\n\n你可以将扩展方法放在特征（trait）或类（class）中并进行扩展：\n\
  \n点击此处查看代码图像\n\n```\ntrait FileOps :\n  extension(f: File)\n    def read = Files.readString(f.toPath)\n\
  \nclass Task extends FileOps :\n  def call() =\n    File(\"/usr/share/dict/words\"\
  ).read\n```\n\n这是一个伴侣对象（companion object）中使用扩展方法的示例：\n\n点击此处查看代码图像\n\n```\ncase\
  \ class PairT\n\nobject Pair :\n  extension T\n    def zip = Pair(Pair(pp.first.first,\
  \ pp.second.first),\n      Pair(pp.first.second, pp.second.second))\n\nval obj =\
  \ Pair(Pair(1, 2), Pair(3, 4))\nobj.zip // Pair(Pair(1, 3), Pair(2, 4))\n```\n\n\
  `zip` 方法不能是 `Pair` 类的一个方法。它不适用于任意对，而只适用于“对的对”。由于 `zip` 方法是在 `Pair[Pair[Int]]` 的实例上调用的，因此会在\
  \ `Pair` 和 `Int` 的伴侣对象中搜索该扩展方法。\n\n现在让我们来看看给定值中的扩展方法。考虑一个 `stringify` 方法，它使用 JSON\
  \ 格式化数字、字符串、数组和对象。它必须是一个扩展方法，因为目前数字、字符串、元组或数组还没有这样的方法。\n\n此外，我们需要一种方式来表达“元组或数组的元素可以被格式化”这一要求。正如\
  \ 第 19.3 节 中的 `Comparator` 示例一样，在第 299 页 的“声明给定实例”，我们将使用上下文边界（context bound）。\n\n\
  以下 `JSON` 特征要求 `stringify` 作为扩展方法存在。伴侣对象声明了给定的值 `JSON[Double]` 和 `JSON[String]`：\n\
  \n点击此处查看代码图像\n\n```\ntrait JSON[T] :\n  extension (t: T) def stringify: String\n\
  \nobject JSON :\n  given JSON[Double] with\n    extension (x: Double)\n      def\
  \ stringify = x.toString\n  def escape(s: String) = s.flatMap(\n    Map('\\\\' ->\
  \ \"\\\\\\\\\", '\"' -> \"\\\\\\\"\", '\\n' -> \"\\\\n\", '\\r' -> \"\\\\r\").withDefault(\n\
  \      _.toString))\n  given JSON[String] with\n    extension (s: String)\n    \
  \  def stringify = s\"\"\"\"${escape(s)}\"\"\"\"\n```\n\n现在我们为 `Pair[T]` 定义一个合适的扩展方法，前提是\
  \ `T` 可以被格式化：\n\n点击此处查看代码图像\n\n```\nobject Pair :\n  given [T : JSON]: JSON[Pair[T]]\
  \ with\n    extension (p: Pair[T])\n      def stringify: String =\n        s\"\"\
  \"{\"first\": ${p.first.stringify}, \"second\": ${p.second.stringify}}\"\"\"\n```\n\
  \n仔细观察表达式 `p.first.stringify`。编译器如何知道 `p.first` 有一个 `stringify` 方法呢？`p.first` 的类型是\
  \ `T`。由于上下文边界的存在，存在类型为 `JSON[T]` 的给定对象。该给定对象为类型 `T` 定义了一个名为 `stringify` 的扩展方法。你刚刚看到了定位扩展方法的规则\
  \ #3 的示例。\n\n最后，对于规则 #4，考虑调用 `Pair(1.7, 2.9).stringify`。该扩展方法没有声明在 `Pair` 伴侣对象中，而是在\
  \ `Pair` 中声明的一个给定值里。\n\n## 19.8 隐式转换\n\n*隐式转换*（implicit conversion）是一个带有单个参数的函数，该参数是\
  \ `Conversion[S, T]` 的给定实例（其扩展自类型 `S => T`）。顾名思，此类函数会自动应用于将值从源类型 `S` 转换为目标类型 `T`。\n\
  \n考虑来自第 11 章的 `Fraction` 类。我们想将整数 `n` 转换为分数 `n` / 1。\n\n点击此处查看代码图像\n\n```\ngiven\
  \ int2Fraction: Conversion[Int, Fraction] = n => Fraction(n, 1)\n```\n\n现在我们可以求值\n\
  \n点击此处查看代码图像\n\n```\nval result = 3 * Fraction(4, 5) // 调用 int2Fraction(3)\n```\n\
  \n隐式转换将整数 `3` 转换为一个 `Fraction` 对象。然后该对象乘以 `Fraction(4, 5)`。\n\n你可以为转换函数起任何名称，或者完全不命名。由于你没有显式调用它，你可能想省略掉名称。但正如你在第\
  \ 19.10 节中看到的，“导入隐式转换](#ch19.xhtml_sec19_10)”，在第 308 页，有时导入转换函数是有用的。我建议你坚持 `source\
  \ target` 的命名约定。\n\nScala 不是第一个允许程序员提供自动转换的语言。然而，Scala 为程序员对何时应用这些转换提供了极大的控制。在接下来的章节中，我们将详细讨论转换何时发生，以及你如何微调这一过程。\n\
  \n![Images](img/note.jpg) 注意\n\n尽管 Scala 为你提供了微调的工具，但语言设计者意识到隐式转换存在潜在问题。为了避免警告，请添加语句\
  \ `import language.implicit` 或编译器选项 `-language:implicit`。\n\n### 19.9 隐式转换规则\n\n\
  隐式转换在两种不同的情况下被考虑。\n\n1. 如果参数的类型与预期类型不同时：\n\n点击此处查看代码图像\n\n```\nFraction(3, 4) //\
  \ 调用 int2Fraction(3)\n```\n\n `Int` 类没有 `*` 成员，但 `Fraction` 类有。\n\n2. 如果对象访问不存在的成员时：\n\
  \n点击此处查看代码图像\n\n```\n3 * Fraction(4, 5) // 调用 int2Fraction(3)\n```\n\n `*` 方法接受\
  \ `Fraction`。\n\n另一方面，在某些情况下*不会*尝试隐式转换。\n\n1. 如果代码在没有隐式转换的情况下通过编译，则不使用隐式转换。例如，如果\
  \ `a * b` 通过，编译器就不会尝试 `a * convert(b)` 或 `convert(a) * b`。\n\n2. 编译器永远不会尝试多次转换，例如\
  \ `convert1(convert2(a))`。\n\n3. 义转换是错误。例如，如果 `convert1(a) * b` 和 `convert2(a) *\
  \ b` 均有效，编译器将报告错误。\n\n![Images](img/caution.jpg) 注意\n\n假设我们还有如下转换\n\n点击此处查看代码图像\n\
  \n```\ngiven fraction2Double: Conversion[Fraction, Double] =\n  f => f.num * 1.0\
  \ / f.den\n```\n\n```\n3 * Fraction(4, 5)\n```\n*不是*歧义的可以是\n\n点击此处查看代码图像\n\n```\n\
  3 * fraction2Double(Fraction(4, 5))\n```\n\n或者\n\n点击此处查看代码图像\n\n```\nint2Fraction(3)\
  \ * Fraction(4, 5)\n```\n\n第一个转换胜过第二个转换，因为它不需要修改应用于 `*` 方法的对象。\n\n![Images](img/tip.jpg)\
  \ 提示\n\n如果你想知道编译器使用了哪些 `using` 参数、扩展方法和隐式转换，请按如下方式编译你的程序：\n\n```\nscalac -Xprint:typer\
  \ MyProg.scala\n```\n\n你将看到在这些上下文机制添加后的源码。\n\n\n\n\nScala 将考虑以下隐式转换函数：\n\n1. 源类型或目标类型的伴随对象中的隐式函数或类\n\
  2. 在作用域内的隐式函数或类\n\n例如，考虑 `int2Fraction` 和 `fraction2Double` 转换。我们可以将它们放入 `Fraction`\
  \ 伴随对象，它们将适用于涉及分数的转换。\n\n另一种，假设我们将这些转换放在一个 `FractionConversions` 对象中，这是我们在 `com.horstmann.impatient`\
  \ 包中定义的它。如果你想使用这些转换，可以如下所示导入 `FractionConversions` 对象：\n\n点击此处查看代码图片\n\n```\nimport\
  \ com.horstmann.impatient.FractionConversions.given\n```\n\n你可以将导入局部化，以减少意外的转换。例如，\n\
  \n点击此处查看代码图片\n\n```\n@main def demo =\n    import com.horstmann.impatient.FractionConversions.given\n\
  \  val result = 3 * Fraction(4, 5) // 使用了导入的转换 fraction2Double\n  println(result)\n\
  ```\n\n你甚至可以选择你需要的特定转换。如果你更喜欢 `int2Fraction` 而不是 `fraction2Double`，可以专门导入它：\n\n\
  点击此处查看代码图片\n\n```\n import com.horstmann.impatient.FractionConversions.int2Fraction\n\
  val result = 3 * Fraction(4, 5) // 结果为 Fraction(12, 5)\n```\n\n如果某个特定转换给你带来麻烦，你也可以排除它：\n\
  \n点击此处查看代码图片\n\n```\nimport com.horstmann.impatient.FractionConversions.{fraction2Double\
  \ as _, given}\n  // 导入除 fraction2Double 外的所有内容\n```\n\n![Images](img/tip.jpg) 提示\n\
  \n如果你想知道为什么编译器*没有*使用你认为它应该使用的隐式转换，尝试显式地添加它，例如通过调用 `fraction2Double(3) * Fraction(4,\
  \ 5)`。你可能会收到显示该问题的错误消息。\n\n## 19.11 上文函数\n\n考虑我们第一个带有上下文参数的示例：\n\n点击此处查看代码图片\n\n\
  ```\ndef quote(what: String)(using delims: QuoteDelimiters) =\n  delims.left + what\
  \ + delims.right\n```\n\n`quote` 的类型是什么？它不可能是\n\n```\nString => String\n```\n\n\
  因为有第二个参数列表。但显然它也不不是\n\n点击此处查看代码图片\n\n```\nString => QuoteDelimiters => String\n\
  ```\n\n因为那样我们的调用方式应该是\n\n点击此处查看代码图片\n\n```\nquote(text)(englishQuoteDelims)\n```\n\
  \n而不是\n\n点击此处查看代码图片\n\n```\nquote(text)(using englishQuoteDelims)\n```\n\n必须有某种编写该类型的方法，这就是\
  \ Scala 设计者们想出的方案：\n\n点击此处查看代码图片\n\n```\nString => QuoteDelimiters ?=> String\n\
  ```\n\n![Images](img/note.jpg) 注意\n\n也许你对 `?` 出现在第二个箭头处感到惊讶。记得柯里化函数类型 `T => S =>\
  \ R` 实际上是 `T => (S => R)`。当你固定第一个参数时，你会得到一个函数 `S => R`。在我们案例中，将 `text` 固定为特定值，我们得到了一个有一个\
  \ `using` 参数的函数，其类型表示为 `QuoteDelimiters ?=> String`。\n\n![Images](img/note.jpg)\
  \ 注意\n\n如果一个方法只接收 `using` 参数，例如\n\n点击此处查看代码图片\n\n```\ndef randomQuote(using delims:\
  \ QuoteDelimiters) = delims.left\n  + scala.io.Source.fromURL(\n      \"https://horstmann.com/random/quote\"\
  ).mkString.split(\" - \")(0)\n  + delims.right\n```\n\n那么它的类型形式为 `QuoteDelims ?=>\
  \ String`\n\n让我们把这种奇特的语法应用于实际。假设你正在开发一个处理 `Future` trait 的库。在第 16 章中，我们使用了全局的 `ExecutionContext`，但在实践中，你需要为你所有方法标记上\
  \ `(using ExecutionContext)`：\n\n点击此处查看代码图片\n\n```\ndef GET(String url)(using ExecutionContext):\
  \ Future[String] =\n  Future {\n    blocking {\n      Source.fromURL(url).mkString\n\
  \    }\n  }\n```\n\n你可以通过定义类型别名来做得更好：\n\n点击此处查看代码图片\n\n```\ntype ContextualFuture[T]\
  \ = (using ExecutionContext) => Future[T]\n```\n\n然后你就可以在方法签名中使用 `ContextualFuture`：\n\
  \n```scala\ndef GET(String url): ContextualFuture[String] =\n  Future {\n    blocking\
  \ {\n      Source.fromURL(url).mkString\n    }\n  }\n```\n\n\n\n在这里，证据对象是恒等函数。为了看看为什么需要恒等函数，请仔细查看\n\
  \n点击此处查看代码图像\n\n```\ndef firstLastA, C(using ev: C <:< Iterable[A]): (A, A) =\n\
  \  (it.head, it.last)\n```\n\n编译器实际上并不知道 `C` 是一个 `Iterable[A]`——记住 `<:<` 并不是语言的特性，而仅仅是一个类。因此，`it.head`\
  \ 和 `it.last` 的调用是无效。但 `ev` 是一个 `Conversion[C, Iterable[A]]`，因此编译器应用了它，计算出 `ev(it).head`\
  \ 和 `ev(it).last`。\n\n![Images](img/tip.jpg) 提示\n\n要测试给定的证据对象是否存在，你可以在 REPL 中调用\
  \ `summon` 函数。例如，在 REPL 中输入 `summon[Range <:< Iterable[Int]]`，你会得到一个结果（你现在知道它是一个函数）。但\
  \ `summon[Iterable[Int] <:< Range]` 会失败并显示错误信息。\n\n![Images](img/note.jpg) 注意\n\n\
  如果你需要检查一个给定的值*不*是否存在，请使用 `scala.util.NotGiven` 类型：\n\n点击此处查看代码图像\n\n```\ngiven tsT:\
  \ java.util.Set[T] =\n  java.util.TreeSet[T]()\ngiven hsT: java.util.Set[T] =\n\
  \  java.util.HashSet[T]()\n```\n\n### 19.13 `@implicitNotFound` 注解\n\n`@implicitNotFound`\
  \ 注解会在编译器无法构造标记类型的值时抛出错误信息。其意图是为程序员提供有用的错误信息。例如，`<:<` 类被标记为：\n\n点击此处查看代码图像\n\n```\n\
  @implicitNotFound(msg = \"Cannot prove that ${From} <:< ${To}.\")\nabstract class\
  \ <:<[-From, +To] extends Function1[From, To]\n```\n\n例如，如果你调用：\n\n点击此处查看代码图像\n\n\
  ```\nfirstLast[String, List[Int]](List(1, 2, 3))\n```\n\n那么错误信息是：\n\n点击此处查看代码图像\n\
  \n```\nCannot prove that List[Int] <:< Iterable[String]\n```\n\n这比默认的更有可能给程序员提供提示：\n\
  \n点击此处查看代码图像\n\n```\nCould not find implicit value for parameter ev: <:<[List[Int],Iterable[String]]\n\
  ```\n\n注意，错误信息中的 `${From}` 和 `${To}` 被替换为标记类的类型参数 `From` 和 `To`。\n\n## 练习题\n\n1.\
