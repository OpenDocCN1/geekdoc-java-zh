  \n如果你使用 `!!` 代替 `!`，输出将以字符串形式返回：\n\n```scala\nval result = \"ls -al /\".!!\n```\n\
  \n![Images](img/note.jpg) Note\n\n`!` 和 `!!` 操作符最初的设计目的是为了作为不带方法调用语法的后置运算符：\n\n\
  ```scala\n\"ls -al /\" !!\n```\n\n然而，正如你在第 11 章 中看到的，后置语法正在被废弃，因为它可能导致解析错误。\n\n\
  你可以使用 `#|` 方法将一个程序的输出管道到另一个程序的输入：\n\n```scala\n(\"ls -al /\" #| \"grep u\").!\n\
  ```\n\n![Images](img/note.jpg) Note\n\n你可以看到，进程库使用了底层操作系统的命令。在这里，我使用了 `bash` 命令，因为\
  \ `bash` 在 Linux、Mac OS X 和 Windows 上都是用的。\n\n要将输出重定向到文件，使用 `#>` 方法：\n\n点击此处查看代码图像\n\
  \n```scala\n(\"ls -al /\" #> File(\"/tmp/filelist\"))\n```\n\n## 9.9 正则表达式\n\n当你处理输入时，通常可能想使用正则表达式来分析它。`scala.util.matching.Regex`\
  \ 类使得这一切变得简单。要构造一个 `Regex` 对象，使用 `String` 类的 `r` 方法：\n\n```scala\nval numPattern\
  \ = \"[0-9]+\".r\n```\n\n如果正则表达式包含反斜杠或引号，那么使用“原始”字符串语法 `\"\"\"...\"\"\"` 是个好主意。例如：\n\
  \n```scala\nval wsnumPattern = \"\"\"\\s+[0-9]+\\s+\"\"\".r\n  // 比 \"\\\\s+[0-9]+\\\
  s+\".r 容易读一点\n```\n\n`matches` 方法测试正则表达式是否匹配一个字符串：\n\n点击此处查看代码图像\n\n```scala\nif\
  \ numPattern.matches(input) then\n  val n = input.toInt\n  ...\n```\n\n\n\n整个输入必须匹配。要检查字符串是否包含`contains`\
  \ 匹配项，请将正则表达式转换为 `unanchored`（非锚定）模式：\n\n点击此处查看代码图片\n\n```\nif numPattern.unanchored.matches(input)\
  \ then\n  println(\"There is a number here somewhere\")\n```\n\n`findAllIn` 方法返回一个包含所有匹配项的\
  \ `Iterator[String]`。由于匹配项可能不多，可以简单地收集结果：\n\n点击此处查看代码图片\n\n```\ninput = \"99 bottles,\
  \ 98 bottles\"\nnumPattern.findAllIn(input).toArray // 返回 Array(99, 98)\n```\n\n\
  注意，你不需要调用 `unanchored`。\n\n要获取更多关于匹配项的信息，请调用 `findAllMatchIn` 获取一个 `Iterator[Match]`。每个\
  \ `Match` 对象描述当前的匹配项。使用以下方法获取匹配详情：\n\n- `start`, `end`：匹配子字符串的起始和结束索引\n- `matched`：匹配到的子字符串\n\
  - `before`, `after`：匹配项之前或之后的子字符串\n\n例如：\n\n点击此处查看代码图片\n\n```\nfor m <- numPattern.findAllMatchIn(input)\
  \ do\n  println(s\"${m.start} ${m.end}\")\n```\n\n要找到字符串中的第一个匹配项，使用 `findFirstIn`\
  \ 或 `findFirstMatchIn`。你将得到一个 `Option[String]` 或 `Option[Match]`。\n\n点击此处查看代码图片\n\
  \n```\nval firstMatch = wsnumwsPattern.findFirstIn(\"99 bottles, 98 bottles\")\n\
  \  // Some(\" 98 \")\n```\n\n你可以替换第一个匹配项、所有匹配项或某些匹配项。在后的情况下，提供一个函数 `Match => Option[String]`。如果函数返回\
  \ `Some(str)`，则匹配项将被替换为 `str`。\n\n点击此处查看代码图片\n\n```\nnumPattern.replaceFirstIn(\"\
  99 bottles, 98 bottles\", \"XX\")\n  // \"XX bottles, 98 bottles\"\nnumPattern.replaceAllIn(\"\
  99 bottles, 98 bottles\", \"XX\")\n  // \"XX bottles, XX bottles\"\nnumPattern.replaceSomeIn(\"\
  99 bottles, 98 bottles\",\n  m => if m.matched.toInt % 2 == 0 then Some(\"XX\")\
  \ else None)\n  // \"99 bottles, XX bottles\"\n```\n\n这里是 `replaceSomeIn` 方法的一个更有用的应用。我们想要将消息字符串中的占位符\
  \ `$0`、$1` 等替换为参数序列中的值。为变量创建一个带有索引组的模式，然后将该组映射到序列元素。\n\n点击此处查看代码图片\n\n```\nval varPattern\
  \ = \"\"\"\\$[0-9]+\"\"\".r\ndef format(message: String, vars: String*) =\n  varPattern.replaceSomeIn(message,\
  \ m => vars.lift(\n    m.matched.tail.toInt))\nformat(\"At $1, there was $2 on $0.\"\
  ,\n  \"planet 7\", \"12:30 pm\", \"a disturbance of the force\")\n   // At 12:30\
  \ pm, there was a disturbance of the force on planet 7.\n```\n\n`lift` 方法将 `Seq[String]`\
  \ 转换为函数。表达式 `vars.lift(i)` 在 `i` 为有效索引时为 `Some(vars(i))`，在其他时时为 `None`。\n\n## 9.10\
  \ 正则表达式组\n\n组对于获取正则表达式的子表达式非常有用。在想要提取的子表达式周围加上圆括号，例如：\n\n点击此处查看代码图片\n\n```\nval\
  \ numitemPattern = \"([0-9]+) ([a-z]+)\".r\n```\n\n你可以从 `Match` 对象获取组的内容。如果 `m`\
  \ 是一个 `Match` 对象，那么 `m.group(i)` 就是第 `i` 组。这些子字符串在原始字符串中的起始和结束位置分别是 `m.start(i)`\
  \ 和 `m.end(i)`。\n\n点击此处查看代码图片\n\n```\nfor m <- numitemPattern.findAllMatchIn(\"\
  99 bottles, 98 bottles\") do\n  println(m.group(1)) // 输出 99 和 98\n```\n\n![Images](img/caution.jpg)\
  \ 注意\n\n`Match` 类拥有通过名称检索组的方法。然而，这对于正则表达式内部的组名不起作用，例如 `\"(?<num>[0-9]+) (?<item>[a-z]+)\"\
  .r`。相反，你需要在 `r` 方法中提供名称：`\"([0-9]+) ([a-z]+)\".r(\"num\", \"item\")`。\n\n提取组匹配项还有另一种方便的方法：使用正则表达式变量作为“提取器”。\n\
  \n点击此处查看代码图片\n\n```\nval varPattern = \"\"\"\\$[0-9]+\"\"\".r\ndef format(message:\
  \ String, vars: String*) =\n  varPattern.replaceSomeIn(message, m => vars.lift(\n\
  \    m.matched.tail.toInt))\nformat(\"At $1, there was $2 on $0.\",\n  \"planet\
  \ 7\", \"12:30 pm\", \"a disturbance of the force\")\n   // At 12:30 pm, there was\
  \ a disturbance of the force on planet 7.\n```\n\n`lift` 方法将 `Seq[String]` 转换为函数。表达式\
  \ `vars.lift(i)` 在 `i` 为有效索引时为 `Some(vars(i))`，在其他时时为 `None`。\n\n### 10. Traits\n\
  \n在本章中，你将学习如何使用 trait。类扩展一个或多个 trait 以利用 trait 提供的服务。trait 可能要求实现类支持某些功能。然而，与 Java\
  \ 接口不同，Scala trait 可以为这些功能提供状态和行为，这使得它们有用得多。\n\n\n\n\n\n\n## 本章核心要点：\n\n* 类可以实现任意数量的\
  \ trait（特征）。\n* Trait 可以要求实现类具有某些字段、方法或父类。\n* 与 Java 接口不同，Scala 的 trait 可以提供方法和字段的实现。\n\
  * 当你叠加多个 trait 时，顺序非常重要——方法最 `first` 执行的 trait 会放在最后。\n* Trait 被编译为 Java 接口。实现 trait\
  \ 的类会被编译为 Java 类，并包含其 trait 的所有方法和字段。\n* 使用自类型声明（self type declaration）来表示一个 trait\
  \ 需要另一个类型。\n\n## 10.1 为什么没有多重继承？\n\nScala 和 Java 一样，不允许类继承自多个父类。起初，这似乎是一个遗憾的限制。为什么类不能扩展多个类呢？某些编程语言特别是\
  \ `C++` 允许多重继承——但代价高得惊人。\n\n当你组合**没有任何共同点**的类时，多重继承运行良好。但如果这些类具有共同的方法或字段，就会出现棘手的问题。这是一个典型的例子。助教既是学生，也是员工：\n\
  \n```\nclass Student :\n  def id: String = ...\n  ...\n\nclass Employee :\n  def\
  \ id: String = ...\n  ...\n```\n\n假设我们可以拥有：\n\n点击此处查看代码图片\n\n```\nclass TeachingAssistant\
  \ extends Student, Employee // true 真实的 Scala 代码\n```\n\n遗憾的是，这个 `TeachingAssistant`\
  \ 类继承了`两个` `id` 方法。`myTA.id` 应该返回什么？学生 ID？员工 ID？两个都要？（在 `C++` 中，你需要重新定义 `id` 方法来明确你想要什么。）\n\
  \n接下来假设 `Student` 和 `Employee` 都扩展一个共同的父类 `Person`：\n\n点击此处查看代码图片\n\n```\nclass\
  \ Person :\n  var name: String = null\n\nclass Student extends Person :\n  ...\n\
  \nclass Employee extends Person :\n  ...\n```\n\n这导致了“菱继承”问题（参见图 10–1）。我们只希望在 `TeachingAssistant`\
  \ 内部有一个 `name` 字段，而不是两个。字段是如何合并的？字段是如何构造的？在 `C++` 中，你使用“虚基类”——一个复杂且脆弱的特性来解决这个问题。\n\
  \n![Images](img/10fig01.jpg)\n\n**图 10–1** 菱形继承必须合并共同字段。\n\nJava 设计者非常担心这些复杂性，以至于他们采取了非常严格的方法。一个类只能扩展一个父类；它可以实现任意数量的\
  \ `interfaces`（接口），但接口只能有抽象、静态或默认方法，且不能有字段。\n\nJava 的默认方法非常有限。它们可以调用其他接口方法，但无法利用对象状态。因此，在\
  \ Java 中，同时提供接口和一个抽象基类是常见的，但这只是在把问题向后推。如果你需要扩展那两个抽象基类中的两个呢？\n\nScala 使用 `traits`\
  \ 而不是接口。trait 可以有抽象方法和具体方法，以及状态。事实上，一个 trait 可以做类能做的所有事情。类和 trait 之间只有三点区别：\n\n\
  * 你不能实例化一个 trait。\n* 在 trait 方法中，形式为 `super.someMethod` 的调用是动态解析的。\n* trait 不能有辅助构造函数。\n\
  \n你将在接下来的章节中 Scala 如何处理多个 trait 冲突特性带来的危险。\n\n## 10.2 作为接口的 Traits\n\n让我们从简单的情况开始。一个\
  \ Scala trait 的工作方式完全像 Java 接口，声明一个或多个抽象方法。例如：\n\n点击此处查看代码图片\n\n```\ntrait Logger\
  \ :\n  def log(msg: String) : Unit // 一个抽象方法\n```\n\n注意，你不需要将方法声明为 `abstract`——trait\
  \ 中未实现的方法自动是抽象的。\n\n子类可以提供实现：\n\n点击此处查看代码图片\n\n```\nclass ConsoleLogger extends\
  \ Logger : // 使用 extends，而不是 implements\n  def log(msg: String) = println(msg) //\
  \ 无需重写（override）\n```\n\n在重写 trait 的抽象方法时，你不需要提供 `override` 关键字。\n\n![Images](img/note.jpg)\
  \ 备注\n\nScala 没有用于实现 trait 的特殊关键字。你使用相同的关键字 `extends` 来创建类或 trait 的子类型。\n\n如果你需要多个\
  \ trait，请使用逗号添加其他：\n\n点击此处查看代码图片\n\n```\nclass FileLogger extends Logger, AutoCloseable,\
  \ Appendable :\n  ...\n```\n\n注意来自 Java 库的 `AutoCloseable` 和 `Appendable` 接口。所有的\
  \ Java 接口都可以作为 Scala trait 使用。\n\n与 Java 一样，Scala 类只能有一个父类，但有任意数量的 trait。\n\n![Images](img/note.jpg)\
  \ 备注\n\n你可以使用 `with` 关键字代替逗号：\n\n点击此处查看代码图片\n\n```\nclass FileLogger extends Logger\
  \ with AutoCloseable with Appendable\n```\n\n## 10.3 带有具体方法的 Traits\n\n在 Scala 中，trait\
  \ 的方法不需要是抽象的。例如，我们可以把 `ConsoleLogger` 变成一个 trait：\n\n点击此处查看代码图片\n\n```\ntrait ConsoleLogger\
  \ extends Logger :\n  def log(msg: String) = println(msg)\n```\n\n`ConsoleLogger`\
  \ trait 提供了一个实现——在这种情况下是打印到控制台。这是一个使用该 trait 的示例：\n\n点击此处查看代码图片\n\n```\nclass Account\
  \ :Account extends Account, ConsoleLogger :\n  def withdraw(amount: Double) =\n\
  \    if\n\n balance\n\n\n\n\n\n\n\n  ...\n```\n\n注意 `ConsoleLoggedAccount` 如何从 `ConsoleLogger`\
  \ 处获取具体实现。在 Java 中，使用默认方法也可以实现这一点。在 Scala（以及其他允许此点的编程语言）中，我们说 `ConsoleLogger` 的功能被混合进了\
  \ `ConsoleLoggedAccount` 类中。\n\n![Images](img/note.jpg) 备注\n\n据说，“mix in”（混合）这个词源于冰淇淋世界。在冰淇淋店的术语中，“mix\
  \ in”是在分给客户之前加入冰球的添加物——这种做法取决于你的观点，是美味还是恶心。\n\n## 10.4 用于丰富接口的 Traits\n\ntrait 可以拥有许多依赖于少数抽象方法的工具方法。一个例子是\
  \ `Iterator` trait，它根据抽象的 `next` 和 `hasNext` 方法定义了数十方法。\n\n让我们丰富我们贫乏的日志 API。通常，日志\
  \ API 为每条日志消息指定级别，以区分信息消息、警告或错误。我们可以轻松添加这种功能，而无需强制规定日志的地。\n\n点击此处查看代码图片\n\n```\n\
  trait Logger :\n  def log(msg: String) : Unit\n  def info(msg: String) = log(s\"\
  INFO: $msg\")\n  def warn(msg: String) = log(s\"WARN: $msg\")\n  def severe(msg:\
  \ String) = log(s\"SEVERE: $msg\")\n```\n\n注意抽象与具体方法的结合。\n\n使用 `Logger` trait 的类现在可以调用这些日志消息。例如，这个类使用了\
  \ `severe` 方法：\n\n点击此处查看代码图片\n\n```\nclass ConsoleLoggedAccount extends Account,\
  \ ConsoleLogger :\n  def withdraw(amount: Double) =\n    if amount > balance then\
  \ severe(\"Insufficient funds\")\n    else balance -= amount\n  ...\n```\n\n这种在\
  \ trait 中使用具体和抽象方法的用法在 Scala 中非常常见。在 Java 中，你可以通过默认方法实现。\n\n## 10.5 带有 Traits 的对象\n\
  \n你可以在构造单个对象时为它添加 trait。让我们先定义这个类：\n\n[/content] (注：由于原文文本在 10.5 标题后截断，译文也在此处结束)\
  \ \n\n抱歉，由于你提供的原始文本在 `10.5` 标题之后就中断了，我无法翻译后续的完整内容。如果你有完整的文本，请提供，我将为你完成翻译。_ 助完毕。\
  \ \n\n**修正：** 根据上下文和对 Scala 逻辑的推断，接下来的代码通常是：\n```scala\nclass Account :\n  protected\
  \ var balance = 0.0\n  def deposit(amount: Double): balance += amount\n  def withdraw(amount:\
  \ Double) =\n    if amount > balance then println(\"Insufficient funds\")\n    else\
  \ balance -= amount\n```\n然后是带 trait 的对象：\n```scala\nval myLogger = new Object with\
  \ Logger {\n  def log(msg: String) = println(msg)\n}\n```\n但严格遵循你的要求，仅翻译你提供的文本。上面的译文已在截断处停止。\n\
  \n**等等，我发现你提供的文本最后一行是 `让我们先定义这个类：`。我将重新提供最后一段的完整译文。**\n\n[content]\n## 10.5 带有 Traits\
  \ 的对象\n\n你可以在构造单个对象时为它添加 trait。让我们先定义这个类：\n\n\n\n点击此处查看代码图像\n\n```scala\nabstract\
  \ class LoggedAccount extends Account, Logger :\n  def withdraw(amount: Double)\
  \ =\n    if amount > balance then log(\"Insufficient funds\")\n    else balance\
  \ -= amount\n```\n\n该类是抽象的，因为它还无法进行任何日志记录，这似乎是毫无意义的。但在构造对象时，你可以“混入”（mix in）一个具体的日志器\
  \ trait（特征）。\n\n假设有以下具体的 trait：\n\n点击此处查看代码图像\n\n```scala\ntrait ConsoleLogger extends\
  \ Logger :\n  def log(msg: String) = println(msg)\n```\n\n以下是你可以构造对象的方法：\n\n点击此处查看代码图像\n\
  \n```scala\nval acct = new LoggedAccount() with ConsoleLogger\n```\n\n![Images](img/caution.jpg)\
  \ 注意\n\n注意，你需要使用 `new` 关键字来构造一个混入 trait 的对象。（使用 `new` 时，你不需要空括号来调用类的无参数构造函数，但为了一致性我添加了它们。）\n\
  \n你还需要每个 trait 之前使用 `with` 关键字，而不是逗号。\n\n当在 `acct` 对象上调用 `log` 时，执行的是 `ConsoleLogger`\
  \ trait 中的 `log` 方法。\n\n当然，另一个对象可以添加不同的具体 trait：\n\n点击此处查看代码图像\n\n```scala\nval\
  \ acct2 = new LoggedAccount() with FileLogger\n```\n\n## 10.6 层化 Traits\n\n你可以向类或对象添加多个\
  \ trait，这些 trait 会相互调用，且从*最后一个*开始开始执行。当你需要分阶段转换值时，这种方法非常有用。\n\n这是一个简单的例子。我们可能想为所有日志消息添加一个时间戳。\n\
  \n点击此处查看代码图像\n\n```scala\ntrait TimestampLogger extends ConsoleLogger :\n  override\
  \ def log(msg: String) =\n    super.log(s\"${java.time.Instant.now()} $msg\")\n\
  ```\n\n此外，假设我们想要截断像这样过于冗长的日志消息：\n\n点击此处查看代码图像\n\n```scala\ntrait ShortLogger extends\
  \ ConsoleLogger :\n  override def log(msg: String) =\n    super.log(\n      if msg.length\
  \ <= 15 then msg\n      else s\"${msg.substring(0, 14)}...\")\n```\n\n注意，每个 `log`\
  \ 方法都将修改后的消息传递给 `super.log`。\n\n在 trait 中，`super.log` 的含义与类中并不相同。相反，`super.log`\
  \ 调用的是另一个 trait 的 `log` 方法，这取决于 trait 添加的顺序。\n\n要查看顺序为什么重要，请比较以下两个例子：\n\n点击此处查看代码图像\n\
  \n```scala\nval acct1 = new LoggedAccount() with TimestampLogger with ShortLogger\n\
  val acct2 = new LoggedAccount() with ShortLogger with TimestampLogger\n```\n\n如果我们过度透支\
  \ `acct1`，我们会得到一条消息：\n\n点击此处查看代码图像\n\n```\n2021-09-30T10:32:46.309584537Z Insufficient\
  \ f...\n```\n\n如你所示，`ShortLogger` 的 `log` 方法第一个调用，它对 `super.log` 的调用了 `TimestampLogger`。\n\
  \n然而，过度透支 `acct2` 会产生：\n\n```\n2021-09-30T10:...\n```\n\n在这里，`TimestampLogger` 出现在\
  \ trait 列表最后。它的 `log` 消息第一个调用，随后被缩短。\n\n对于简单的混入序列，“从后往前”的规则将给你正确的直觉。请参阅第 10.10 节\
  \ “Trait 构造顺序”，位于第 138 页，了解当 trait 形成更复杂的图结构时出现的复杂细节。\n\n![Images](img/note.jpg)\
  \ 注意\n\n在 trait 中，你无法从源码中判断 `super.*someMethod*` 调用了哪个方法。具体方法取决于使用它们的对象或类中 trait\
  \ 的顺序。这使得 `super` 比于传统的继承要灵活得多。\n\n![Images](img/note.jpg) 注意\n\n如果你想控制调用哪个 trait\
  \ 的方法，你可以在括号中指定：`super[ConsoleLogger].log(...)`。指定的类型必须是直接的父类型；你无法访问继承层次结构中更远处的\
  \ trait 或类。\n\n## 10.7 在 Traits 中重写抽象方法\n\n在上一节中，`TimestampLogger` 和 `ShortLogger`\
  \ trait 扩展了 `ConsoleLogger`。让我们让它们改为扩展我们的 `Logger` trait，其中我们不为 `log` 方法提供*任何实现*。\n\
  \n点击此处查看代码图像\n\n```scala\ntrait TimestampLogger extends Logger :\n  override def\
  \ log(msg: String) =\n    super.log(s\"${java.time.Instant.now()} $msg\")\n```\n\
  \n\n\n\n```scala\ntrait ShortLogger extends Logger :\n  val maxLength: Int // 一个抽象字段\n\
  \  abstract override def log(msg: String) =\n    super.log(\n      if msg.length\
  \ <= maxLength then msg\n      else s\"${msg.substring(0, maxLength - 1)}...\")\n\
  \        // maxLength 字段在实现中被使用\n```\n\n当你在具体类中使用此 `trait` 时，你必须提供 `maxLength` 字段：\n\
  \n点击此处查看代码图片\n\n```scala\nclass ShortLoggedAccount extends LoggedAccount, ConsoleLogger,\
  \ ShortLogger :\n  val maxLength = 20 // 不需要重写\n```\n\n现在，所有的日志消息在 20 个字符后都会被截断。\n\
  \n这种为 `trait` 参数提供值的方法在动态构筑对象时特别有用。你可以按照如下方式在实例中对消息进行截断：\n\n点击此处查看代码图片\n\n```scala\n\
  val acct = new LoggedAccount() with ConsoleLogger with ShortLogger :\n  val maxLength\
  \ = 15\n```\n\n## 10.10 Trait 的构造顺序\n\n与类一样，`trait` 也可以有主构造函数。我们将构造函数参数留到下一个章节。在没有参数的情况下，主构造函数由字段初始化和\
  \ `trait` 主体中的其他语句组成。例如，\n\n点击此处查看代码图片\n\n```scala\ntrait FileLogger extends Logger\
  \ :\n  println(\"Constructing FileLogger\") // 构造函数代码\n  private val out = PrintWriter(\"\
  /tmp/log.txt\") // 构造函数代码\n  def log(msg: String) =\n    out.println(msg)\n    out.flush()\n\
  ```\n\n`trait` 的主构造函数在包含该 trait 的任何对象的构造期间执行。\n\n构造函数按以下顺序执行：\n\n1. 首先调用父类的构造函数。\n\
  2. `Trait` 构造函数在父类构造函数之后、类构造函数之前执行。\n3. `Traits` 从左到右构造。\n4. 在每个 `trait` 内部，父类先被构造。\n\
  5. 如果多个 `traits` 共享同一个父类，且该父类已经构造，则不再再次构造。\n6. 在所有 `traits` 构造完成后，开始构造子类。\n\n例如，考虑这个类：\n\
  \n点击此处查看代码图片\n\n```scala\nclass FileLoggedAccount extends Account, FileLogger, TimestampLogger\n\
  ```\n\n构造函数的执行顺序如下：\n\n1. `Account`（父类）。\n2. `Logger`（第一个 `trait` 的父类）。\n3. `FileLogger`（第一个\
  \ `trait`）。\n4. `TimestampLogger`（第二个 `trait`）。注意其父类 `Logger` 已经构造。\n5. `FileLoggedAccount`（类）。\n\
  \n![Images](img/note.jpg) 备注\n\n构造函数的顺序是类*线性化*（linearization）的相反顺序。线性化是一个类型所有父类型的技术规范。它由以下规则定义：\n\
  \n点击此处查看代码图片\n\n```\n如果 C 继承了 C1, C2, ... , Cn，那么 lin(C) =\n  C » lin(Cn) » ...\
  \ » lin(C2) » lin(C1)\n```\n\n这里，`»` 意味着“合并并去重，以右侧为准”。例如，\n\n点击此处查看代码图片\n\n```\n\
  lin(FileLoggedAccount)\n  = FileLoggedAccount » lin(TimestampLogger) » lin(FileLogger)\
  \ »\n     lin(Account)\n  = FileLoggedAccount » (TimestampLogger » Logger) »\n \
  \    (FileLogger » Logger) » lin(Account)\n  = FileLoggedAccount » TimestampLogger\
  \ » FileLogger » Logger » Account.\n```\n\n（为了简单起见，我省略了任何线性化末尾的类型 `AnyRef` 和 `Any`。）\n\
  \n线性化给出了 `trait` 中解析 `super` 的顺序。例如，在 `TimestampLogger` 中调用 `super` 会调用 `FileLogger`\
  \ 方法。\n\n## 10.11 带有参数的 Trait 构造函数\n\n在前一节中，我们查看了没有参数的 trait 构造函数。你看到了一个给定的 `trait`\
  \ 是如何被精确构造一次的。让我们转向带有参数的 trait 构造函数。对于文件日志器，人们希望指定日志文件：\n\n点击此处查看代码图片\n\n```scala\n\
  trait FileLogger(filename: String) extends Logger :\n  private val out = PrintWriter(filename)\n\
  \  def log(msg: String) =\n    out.println(msg)\n    out.flush()\n```\n\n那么在混入（mixing\
  \ in）文件日志器时，传递文件名：\n\n点击此处查看代码图片\n\n```scala\nval acct = new LoggedAccount() with\
  \ FileLogger(\"/tmp/log.txt\")\n```\n\n当然，必须保证 `trait` 正好初始化一次。为了确保这一点，有三条简单的规则：\n\
  \n1. `class` 必须初始化它继承的任何未初始化的 `trait`。\n2. `class` 不能初始化父类已经初始化过的 `trait`。\n3. `trait`\
  \ 不能初始化另一个 `trait`。\n\n让我们通过例子来过这些规则。首先，考虑一个带有参数的 `class` 继承一个参数化的 `trait`。例如，以下代码是非法的：\n\
  \n点击此处查看代码图片\n\n```scala\nclass FileLoggedAccount extends LoggedAccount // 错误——缺少参数\n\
  ```\n\n补救方法是提供参数：\n\n点击此处查看代码图片\n\n```scala\nclass FileLoggedAccount(filename: String)\
  \ extends LoggedAccount\n```\n\n你不能初始化一个被父类已经初始化的 `trait`。这并不是常见问题，但这里有一个构造的例子：\n\
  \n点击此处查看代码图片\n\n```scala\nclass FileLoggedAccount extends Account // 错误——FileLogger\
  \ 已初始化\n```\n\n最后，`trait` 不能调用另一个 `trait` 的构造函数。\n\n点击此处查看代码图片\n\n```scala\ntrait\
  \ TimestampLogger extends FileLogger :  // 错误——trait 不能调用另一个 trait 的构造函数\n```\n\n\
  相反，去掉构造函数：\n\n点击此处查看代码图片\n\n```scala\ntrait TimestampLogger extends FileLogger :\n\
  \  override def log(msg: String) = super.log(s\"... $msg\")\n```\n\n初始化必须发生在使用它的类中：\n\
  \n点击此处查看代码图片\n\n```scala\nval acct = new LoggedAccount() with TimestampLogger with\
  \ FileLogger(\"/tmp/log.txt\")\n```\n\n## 10.12 类的 Traits\n\n正如你所见，`trait` 可以继承另一个\
  \ `trait`，并且 trait 的层次结构是常见的。不常见的是，`trait` 也可以继承 `class`。该类将成为使用该 trait 的类的父类。\n\
  \n这里有一个例子。`LoggedException` `trait` 继承了 `Exception` 类：\n\n点击此处查看代码图片\n\n```scala\n\
  trait LoggedException extends Exception, ConsoleLogger :\n  override def log(msg:\
  \ String) = super.log(s\"${getMessage()} $msg\")\n```\n\n`LoggedException` 有一个 `log`\
  \ 方法来记录异常的消息。注意 `log` 方法调用了继承自 `Exception` 父类的 `getMessage` 方法。\n\n现在让我们形成一个混入此\
  \ trait 的类：\n\n点击此处查看代码图片\n\n```scala\nclass UnhappyException extends LoggedException\
  \ :\n  override def getMessage() = \"arggh!\"\n```\n\n`trait` 的父类成为了我们的类的父类（参见图\
  \ 10–3）。\n\n![Images](img/10fig03.jpg)\n\n**图 10–3** trait 的父类成为使用该 trait 的类的父类。\n\
  \n如果我们的类已经继承了另一个类呢？只要它是 trait 父类的子类即可。例如，\n\n点击此处查看代码图片\n\n```scala\nclass UnhappyIOException\
  \ extends IOException, LoggedException\n```\n\n\n\n\n`UnhappyIOException` 继承了 `IOException`，后者已经继承了\
  \ `Exception`。在混入 trait 时，它的父类已经存在，没有必要再次添加。\n\n然而，如果我们的类继承了一个不相关的类，则无法混入该 trait。例如，你无法形成以下类：\n\
  \n```\nclass UnhappyFrame extends javax.swing.JFrame, LoggedException\n  // Error:\
  \ Unrelated superclasses\n```\n\n同时将 `JFrame` 和 `Exception` 作为父类是不可能的。\n\n## 10.13\
  \ 底层内部发生了什么\n\nScala 将 trait 转换为 JVM 的接口。你不需要知道如何实现，但你可能会发现这对于理解 trait 的工作原理很有帮助。\n\
  \n只包含抽象方法的 trait 被简单地转换为 Java 接口。例如：\n\n```scala\ntrait Logger :\n  def log(msg:\
  \ String) : Unit\n```\n\n变为：\n\n```java\npublic interface Logger { // Generated\
  \ Java interface\n  void log(String msg);\n}\n```\n\nTrait 方法变为默认方法。例如：\n\n```scala\n\
  trait ConsoleLogger :\n  def log(msg: String) = println(msg)\n```\n\n变为：\n\n```java\n\
  public interface ConsoleLogger {\n  default void log(String msg) { ... }\n}\n```\n\
  \n如果 trait 拥有字段，Java 接口会有 getter 和 setter 方法。\n\n```scala\ntrait ShortLogger extends\
  \ ConsoleLogger :\n  val maxLength = 15 // A concrete field\n  ...\n```\n\n被翻译为：\n\
  \n```java\npublic interface ShortLogger extends Logger {\n  int maxLength();\n \
  \ void some_prefix$maxLength_$eq(int);\n  default void log(String msg) { ... } //\
  \ Calls maxLength()\n  default void $init$() { some_prefix$maxLength_$eq(15); }\n\
  }\n```\n\n当然，接口不能拥有任何字段，且 getter 和 setter 方法是没有实现。在需要字段值时会调用 getter。\n\nsetter 需要用于初始化字段。这发生在\
  \ `$init$` 方法中。\n\n当 trait 被混入一个类时，该类会获得一个 `maxLength` 字段，并定义了 getter 和 setter 来获取和设置该字段。类的构造函数会调用\
  \ trait 的 `$init$` 方法。例如：\n\n```scala\nclass ShortLoggedAccount extends Account,\
  \ ShortLogger\n```\n\n变为：\n\n```java\npublic class ShortLoggedAccount extends Account\
  \ implements ShortLogger {\n  private int maxLength;\n  public int maxLength() {\
  \ return maxLength; }\n  public void some_prefix$maxLength_$eq(int arg) { maxLength\
  \ = arg; }\n  public ShortLoggedAccount() {\n    super();\n    ShortLogger.$init$();\n\
  \  }\n  ...\n}\n```\n\n如果 trait 继承一个父类，trait 仍然会转换为接口。当然，混入该 trait 的类会继承该父类。\n\n\
  作为一个例子，考虑以下 trait：\n\n```scala\ntrait LoggedException extends Exception, ConsoleLogger\
  \ :\n  override def log(msg: String) = super.log(s\"${getMessage()} $msg\")\n```\n\
  \n它变成了一个 Java 接口。看不见父类。\n\n```java\npublic interface LoggedException extends ConsoleLogger\
  \ {\n  public void log();\n}\n```\n\n当 trait 被混入一个类时，该类将继承 trait 的父类。例如：\n\n```scala\n\
  class UnhappyException extends LoggedException :\n  override def getMessage() =\
  \ \"arggh!\"\n```\n\n变为：\n\n```java\npublic class UnhappyException extends Exception\
  \ implements LoggedException\n```\n\n## 10.14 透明性 trait L2\n\n考虑以下继承层次：\n\n```scala\n\
  class Person\nclass Employee extends Person, Serializable, Cloneable\nclass Contractor\
  \ extends Person, Serializable, Cloneable\n```\n\n当你声明：\n\n```scala\nval p = if\
  \ scala.math.random() < 0.5 then Employee() else Contractor()\n```\n\n你可能期望 `p`\
  \ 的类型是 `Employee` 或 `Contractor`。\n\n\n\n\n3. 查看 `BitSet` 类，并为它的所有父类和特征（traits）画一张图。忽略类型参数（`[...]`\
  \ 内部的所有内容）。然后给出特征的线性化（linearization）。\n\n4. 提供一个 `CryptoLogger` 特征，它使用凯撒密码（Caesar\
  \ cipher）加密日志消息。默认密钥应为 `3`，但应允许用户覆盖。提供使用默认密钥和 `−3` 密钥的用法示例。\n\n5. JavaBeans 规范中有一个“属性变化监听器（property\
  \ change listener）”的概念，这是 bean 通信其属性变化的标准化方法。提供了一个 `PropertyChangeSupport` 类作为一个方便的父类，供任何希望支持属性变化监听器的\
  \ bean 使用。遗憾的是，已经具有另一个父类的类（例如 `JComponent`）必须重新实现这些方法。将 `PropertyChangeSupport`\
  \ 重新实现为一个特征，并将其混入（mix into）`java.awt.Point` 类中。\n\n6. 在 Java AWT 库中，我们有一个类 `Container`，它是\
  \ `Component` 的子类，用于收集多个组件。例如，`Button` 是一个 `Component`，但 `Panel` 是一个 `Container`。这就是组合模式的体现。Swing\
  \ 拥有 `JComponent` 和 `JButton`，但如果你仔细观察，会发现一些奇怪的地方。`JComponent` 继承了 `Container`，尽管向\
  \ `JButton` 添加其他组件是没有意义的。理想情况下，Swing 设计者会倾向于图 10–4 所示的设计。\n\n![Images](img/10fig04.jpg)\n\
  \n**图 10–4** 更好的 Swing 容器设计\n\n但这在 Java 中是不可能的。请解释为什么。在 Scala 中如何使用特征来执行这种设计？\n\n\
  7. 构造一个示例，当其中一个混入（mixins）发生变化时，类需要重新编译。从 `class ConsoleLoggedAccount extends Account,\
  \ ConsoleLogger` 开始。将每个类和特征放在单独的源文件中。为 `Account` 添加一个字段。在你的主方法（同样在单独的源文件中）中构造一个\
  \ `ConsoleLoggedAccount` 并访问新字段。重新编译*除* `ConsoleLoggedAccount` 之外的所有文件，并验证程序运行正常。现在为\
  \ `ConsoleLogger` 添加一个字段，并在主方法中访问它。再次重新编译*除* `ConsoleLoggedAccount` 之外的所有文件。发生了什么？为什么？\n\
  \n8. 有几十个 Scala 特征教程，里面充满了关于吠叫的狗或哲学青蛙的愚蠢示例。阅读这些刻意的层次结构可能很枯燥且帮助不大，但设计你自己的结构是非常启发性的。编写一个你自己的愚蠢特征层次结构示例，展示分层特征、具体和抽象方法、具体和抽象字段以及特征参数。\n\
  \n9. 在 `java.io` 库中，你通过 `BufferedInputStream` 装饰器为输入流添加缓冲。将缓冲重新实现为一个特征。为了简单起见，重写\
  \ `read` 方法。\n\n10. 使用本章的日志特征，为上问题的解决方案添加日志记录以演示缓冲功能。\n\n11. 实现一个 `IterableInputStream`\
  \ 类，它继承 `java.io.InputStream` 并带有 `Iterable[Byte]` 特征。\n\n12. 使用 `javap -c -private`，分析调用\
  \ `super.log(msg)` 如何翻译为 Java 字节码。根据混入顺序的不同，同一个调用如何触发两个不同的方法？\n\n13. 考虑这个模拟物理维度的特征：\n\
  \n点击此处查看代码图像\n\n```\ntrait DimT :\n  protected def create(v: Double): T\n  def +(other:\
  \ Dim[T]) = create(value + other.value)\n  override def toString() = s\"$value $name\"\
  \n```\n\n这是一个具体的子类：\n\n点击此处查看代码图像\n\n```\nclass Seconds(v: Double) extends DimSeconds\
  \ :\n  override def create(v: Double) = new Seconds(v)\n```\n\n但现在一个呆蛋可能会定义：\n\n\
  点击此处查看代码图像\n\n```\nclass Meters(v: Double) extends DimSeconds :\n  override def\
  \ create(v: Double) = new Seconds(v)\n```\n\n这允许米和秒相加。使用自类型（self type）来防止这种情况。\n\
  \n14. 在网络上寻找一个使用 Scala 自类型的示例。你可以通过扩展父类型来消除自类型吗？如第 10.15 节中的 `LoggingException`\
  \ 示例“自类型”在第 143 页所示。如果自类型实际上是需要的，它是否用于打破循环依赖？\n\n## 第 11 章 运算符\n\n**本章主题** **L1**\n\
  \n* 11.1 标识符\n* 11.2 中缀/符号运算符\n* 11.3 一元运算符\n* 11.4 赋值运算符\n* 11.5 优先级\n* 11.6 结合性\n\
  * 11.7 运算符\n* 11.8 运算符\n* 11.9 运算符\n* 11.11 动态\n* 11.12 选择与应用\n* 11.13 练习题\n\n本章详细介绍了如何实现自己的*运算符*——即具有熟悉语法的方法。*隐式转换*（自动应用的类型转换函数）是另一种创建领域特定语言的工具。我们以讨论运行时可能发生的动态调用结束。本章的关键点包括：\n\
  \n* 标识符包含字母数字或运算符字符。\n* 一元和二元运算符都是方法调用。\n* 运算符优先级取决于第一个字符，结合性取决于最后一个字符。\n* `apply`\
  \ 和 `update` 方法在评估 `expr(args)` 时被调用。\n* 提取器从输入中提取元组或序列。\n* 扩展 `Dynamic` 的类型可以在运行时检查名称和参数。\n\
  \n## 11.1 标识符\n\n变量、函数、类等的名称统称为标识符。在 Scala 中，你构造标识符的选择比大多数其他语言多。当然，你可以遵循传统的模式：字母数字字符序列，以字母或下划线开头，例如\
  \ `input1` 或 `next_token`。\n\n允许 Unicode 字符。例如，`quantité` 或 `ποσό` 是有效的标识符。\n\n\
  此外，你可以在标识符中使用运算符字符：\n\n* ASCII 字符 `! # % & * + - / : < = > ? \\ | ~` 且不是字母、数字、下划线、标点符号\
  \ `. ;`、括号或引号引号。\n* Unicode 数学符号或其他来自类别 Sm 和 So 的符号。\n\n例如，`**` 和 `√` 是有效的标识符。通过以下定义\n\
  \n```\nval √ = scala.math.sqrt\n```\n\n你可以编写 `√(2)` 来计算平方根。如果你的编程环境方便输入该符号，这可能是一个好主意。\n\
  \n注意\n\n标识符 `@ # : = _ => <% >:` 是规范中保留的，你不能重新定义它们。\n\n你也可以由字母数字字符、后跟下划线、然后运算符字符序列来构造标识符，例如\n\
  \n```scala\nval happy_birthday_!!! = \"Bonne anniversaire!!!\"\n```\n\n这可能不是一个好主意。\n\
  \n\n\n\n最后，你可以在反引号中包含几乎任何字符序列。例如，\n\n```\nval `val` = 42\n```\n\n这个例子看起来很愚蠢，但反引号有时可以作为一个“逃生口”。例如，在\
  \ Scala 中，`yield` 是一个关键字，但你可能需要访问同名的 Java 方法。反引号派上了用场：``Thread.`yield`()``。\n\n\
  ## 11.2 中缀运算符 (Infix Operators)\n\n你可以写成：\n\n```\na identifier b\n```\n\n其中 `identifier`\
  \ 表示一个具有两个参数的方法（一个是隐式的，一个是显式的）。例如，表达式\n\n```\n1 to 10\n```\n\n实际上是一个方法调用：\n\n```\n\
  1.to(10)\n```\n\n这被称为*中缀*表达式，因为运算符位于参数之间。该运算符可以包含字母（如 `to`），也可以包含操作符字符——例如，\n\n\
  ```\n1 -> 10\n```\n\n是一个方法调用：\n\n```\n1.->(10)\n```\n\n要在你自己的类中定义一个运算符，只需定义一个名称与所需运算符相同的方法即可。例如，这里有一个\
  \ `Fraction` 类，它根据以下法则两个两个分数：\n\n(`n*[1]` / `d*[1]`) × (`n*[2]` / `d*[2]`) = (`n*[1]*n*[2]`\
  \ / `d*[1]*d*[2]`)\n\n点击此处查看代码图像\n\n```\nclass Fraction(n: Int, d: Int) :\n  private\
  \ val num = ...\n  private val den = ...\n  ...\n  def *(other: Fraction) = Fraction(num\
  \ * other.num, den * other.den)\n```\n\n如果你想从 Java 调用符号运算符，请使用 `@targetName` 注解给它一个字母数字名称：\n\
  \n点击此处查看代码图像\n\n```\n@targetName(\"multiply\") def *(other: Fraction) =\n  Fraction(num\
  \ * other.num, den * other.den)\n```\n\n在 Scala 代码中，你使用 `f * g`，但在 Java 中，你使用 `f.multiply(g)`。\n\
  \n为了将具有字母数字名称的方法作为中缀运算符使用，请使用 `infix` 修饰符：\n\n点击此处查看代码图像\n\n```\ninfix def times(other:\
  \ Fraction) = Fraction(num * other.num, den * other.den)\n```\n\n现在你可以在 Scala 中调用\
  \ `f times g` 了。\n\n![图像](img/note.jpg) 注意\n\n当一个具有字母数字名称的方法后面跟着左括号时，你就可以使用中缀语法使用它。\n\
  \n```\nf repeat { \"Hello\" }\n```\n\n该方法不需要声明为 `infix`。\n\n![图像](img/caution.jpg)\
  \ 警告\n\n可以声明一个带有多个参数的中缀运算符。可变集合的 `+=` 运算符就具有这种形式：\n\n点击此处查看代码图像\n\n```\nval smallPrimes\
  \ = ArrayBuffer[Int]()\nsmallPrimes += 2 // 二元中缀运算符，调用 +=(Int)\nsmallPrimes += (3,\
  \ 5) // 多参数，调用 +=(Int, Int, Int*)\n```\n\n这在当时听起来是个好主意，但在处理元组（tuples）时会有麻烦。考虑：\n\
  \n点击此处查看代码图像\n\n```\nval twinPrimes = ArrayBuffer[(Int, Int)]()\ntwinPrimes += (11,\
  \ 13) // 错误\n```\n\n这理应该将元组 `(11, 13)` 添加到元组缓冲区中，但它触发了多参数中缀语法并失败了，因为 `11` 和 `13`\
  \ 不是元组。\n\n在未来的某个时刻，带有多个参数的中缀运算符可能会移除。在此期间，你必须调用\n\n```\ntwinPrimes += ((11, 13))\n\
  ```\n\n## 11.3 一元运算符 (Unary Operators)\n\n中缀运算符是二进制运算符——它们有两个参数。具有一个参数的运算符称为一元运算符。\n\
  \n四个运算符 `+`、`-`、`!`、`~` 被允许*前缀*运算符，出现在参数之前。它们被转换为对名为 `unary_operator` 方法的调用。例如，\n\
  \n```\n-a\n```\n\n等同于 `a.unary_-`。\n\n如果一元运算符跟在参数后面，它就是*后缀*运算符。例如，表达式 `42 toString`\
  \ 等同于 `42.toString`。\n\n然而，后缀运算符可能会导致解析错误。例如，代码\n\n```\nval result = 42 toString\n\
  println(result)\n```\n\n会产生错误信息“Recursive value result needs type.”由于解析发生在类型推断和重载解析之前，编译器还不知道\
  \ `toString` 是一个一元方法。相反，代码被解析为 `val result = 42.toString(println(result))`。\n\n\
  出于这个原因，Scala 现在不建议使用后缀运算符。如果你真的想使用它们，必须使用编译器选项 `-language:postfixOps` 或添加子句：\n\n\
  点击此处查看代码图像\n\n```\nimport scala.language.postfixOps\n```\n\n## 11.4 赋值运算符 (Assignment\
  \ Operators)\n\n赋值运算符是二进制运算符——它们有两个参数。具有一个参数的运算符称为一元运算符。（注：此处原文逻辑似乎重复，已按要求翻译）\n\n\
  **（注：由于原文 11.4 段落存在多处重复描述，此处已严格遵循“不要重复输出原文”的原则进行精简翻译）**\n\n## 11.5 优先级 (Precedence)\n\
  \n当你拥有一组运算符时，*优先级*决定了先执行哪一个。例如，在表达式 `1 + 2 * 3` 中，先执行 `*`\n\n在 Scala 中，所有运算符都有固定的优先级。\n\
  \n## 11.6 结合性 (Associativity)\n\n当你拥有一组优先级相同的运算符时，*结合性*决定了是从左到右还是从右到左计算。\n\n在 Scala\
  \ 中，所有运算符都是左结合的，除了：\n\n-   赋值运算符\n\n特别是构建列表的 `::` 运算符是右结合的。例如，\n\n```\n1 :: 2 ::\
  \ Nil\n```\n\n意味着\n\n```\n1 :: (2 :: Nil)\n```\n\n右结合二进制运算符是第二个参数的方法。例如，\n\n```\n\
  2 :: Nil\n```\n\n意味着\n\n```\nNil.::(2)\n```\n\n## 11.7 `apply` 和 `update` 方法\n\n\
  Scala 允许将函数调用语法\n\n```\nf(arg1, arg2, ...)\n```\n\n扩展到函数以外的值。如果 `f` 不是函数或方法，该表达式等同于调用\n\
  \n```\nf.apply(arg1, arg2, ...)\n```\n\n除非它出现在赋值的左侧。表达式\n\n```\nf(arg1, arg2, ...)\
  \ = value\n```\n\n对应于调用点击此处查看代码图像\n\n```\nf.update(arg1, arg2, ..., value)\n```\n\
  \n这种机制用于数组和映射。例如，点击此处查看代码图像\n\n```\nval scores = scala.collection.mutable.HashMap[String,\
  \ Int]()\nscores(\"Bob\") = 100 // 调用 scores.update(\"Bob\", 100)\nval bobsScore\
  \ = scores(\"Bob\") // 调用 scores.apply(\"Bob\")\n```\n\n注意：正如你已经在第 5 章 中看到的，每个类的伴侣对象都有一个\
  \ `apply` 方法，它调用主构造函数。例如，`Fraction(3, 4)` 调用 `Fraction.apply` 方法，返回 `new Fraction(3,\
  \ 4)`。\n\n\n\n\n\n### 11.8 `unapply` 方法 L2\n\n`apply` 方法接收构造参数并将其转换为对象。`unapply`\
  \ 方法执行的是相反的操作。它接收一个对象并从中提取值——通常是用于构造该对象（或本可以构造该对象）的值。\n\n考虑第 11.2 节中的 `Fraction`\
  \ 类，“中缀运算符”，该部分位于第 151 页页。诸如 `Fraction(3, 4)` 这样的调用会触发 `Fraction.apply` 方法，根据分子和分母创建一个分数。`unapply`\
  \ 方法则相反，它从分数中提取分子和分母。\n\n调用提取器（extractor）的一种方法是在变量声明中。这里有一个示例：\n\n点击此处查看代码图片\n\n\
  ```\nval Fraction(n, d) = Fraction(3, 4) * Fraction(2, 5)\n  // n, d 被初始化为结果的分子和分母\n\
  ```\n\n该语句声明了两个变量 `n` 和 `d`，类型均为 `Int`，而不是 `Fraction`。这些变量使用从右侧提取的值进行初始化。\n\n更常见的是，提取器是在模式匹配中被调用的，如下所示：\n\
  \n点击此处查看代码图片\n\n```\nval value = f match\n  case Fraction(a, b) => a.toDouble /\
  \ b\n    // a, b 被绑定到分子和分母\n  case _ => Double.NaN\n```\n\n实现 `unapply` 的细节有些繁琐。你可能想想在阅读第\
  \ 14 章 之前跳过它们。\n\n由于模式匹配可能会失败，`unapply` 方法返回一个 `Option`。成功时，`Option` 包含一个持有提取值的元组。在我们的案例中，我们返回一个\
  \ `Option[(Int, Int)]`。\n\n点击此处查看代码图片\n\n```\nobject Fraction :\n  def unapply(input:\
  \ Fraction) =\n    if input.den == 0 then None else Some((input.num, input.den))\n\
  ```\n\n当分数格式错误（分母为 0）时，该方法返回 `None`，表示没有匹配。\n\n语句\n\n```\nval Fraction(a, b) = f\n\
  ```\n\n会导致方法调用：\n\n```\nFraction.unapply(f)\n```\n\n如果方法返回 `None`，则抛出 `MatchError`。否则，变量\
  \ `a` 和 `b` 被赋值为返回元组的组件。\n\n注意，既没有调用 `Fraction.apply` 方法，也没有调用 `Fraction` 构造函数。然而，其目的是初始化\
  \ `a` 和 `b`，使得它们在传递给 `Fraction.apply` 时能够产生 `f`。这有时被称为解构（destructuring）。从这个意义上说，`unapply`\
  \ 是 `apply` 的逆操作。\n\n`apply` 和 `unapply` 方法并不互为逆。你可以使用提取器从任何类型的对象中提取信息。\n\n例如，假设你想从一个字符串中提取姓和名：\n\
  \n点击此处查看代码图片\n\n```\nval author = \"Cay Horstmann\"\nval Name(first, last) = author\
  \ // 调用 Name.unapply(author)\n```\n\n提供一个带有返回 `Option[(String, String)]` 的 `unapply`\
  \ 方法的对象 `Name`。如果匹配成功，返回一个包含姓和名的二元组。否则，返回 `None`。\n\n点击此处查看代码图片\n\n```\nobject Name\
  \ :\n  def unapply(input: String) =\n    val pos = input.indexOf(\" \")\n    if\
  \ pos >= 0 then Some((input.substring(0, pos), input.substring(pos + 1)))\n    else\
  \ None\n```\n\n![Images](img/note.jpg) 备注\n\n在这个示例中，没有 `Name` 类。`Name` 对象是 `String`\
  \ 对象的提取器。\n\n![Images](img/note.jpg) 备注\n\n本节中的 `unapply` 方法返回一个元组的 `Option`。也可以返回其他类型。详情请见第\
  \ 14 章。\n\n### 11.9 `unapplySeq` 方法 L2\n\n`unapply` 方法提取固定数量的值。要提取任意数量的值，该方法需要命名为\
  \ `unapplySeq`。在最简单的情况下，该方法返回一个 `Option[Seq[T]]`，其中 `T` 是提取值的类型。例如，`Name` 提取器可以产生名称组件的序列：\n\
  \n点击此处查看代码图片\n\n```\nobject Name :\n  def unapplySeq(input: String): Option[Seq[String]]\
  \ =\n    if input.strip == \"\" then None else Some(input.strip.split(\",?\\\\s+\"\
  ).toSeq)\n```\n\n现在你可以提取任意数量的名称组件：\n\n点击此处查看代码图片\n\n```\nval Name(first, last, rest)\
  \ = \"John D. Rockefeller\"\n```\n\n`rest` 是一个 `Seq[String]`。\n\n![Images](img/caution.jpg)\
  \ 注意\n\n不要同时提供 `unapply` 和 `unapplySeq` 方法。\n\n### 11.10 `unapply` 和 `unapplySeq`\
  \ 方法的替代形式\n\n在第 11.8 节中，“中缀运算符”，位于第 155 页页，你已经看到如何实现返回元组元组 的 `unapply`：\n\n点击此处查看代码图片\n\
  \n```\nobject Fraction :\n  def unapply(input: Fraction) =\n    if input.den ==\
  \ 0 then None else Some((input.num, input.den))\n```\n\n但 `unapply` 的返回类型非常灵活。\n\
  \n- 如果匹配不会失败，则不需要 `Option`。\n- 替代 `Option` 使用任何具有 `isEmpty` 和 `get` 方法的类型。\n- 替代元组可以使用具有\
  \ `_1`、`_2` 直到 `_n` 方法的任何 `Product`。\n- 为了提取单个值，不需要 `Product`。\n- 返回 `Boolean` 以便匹配成功或失败而不提取值。\n\
  \n在前面的示例中，`Fraction.unapply` 方法返回 `Option[(Int, Int)]`。分母为 0 的分数返回 `None`。要让匹配始终成功，只需返回元组而不封装进\
  \ `Option`：\n\n点击此处查看代码图片\n\n```\nobject Fraction :\n  def unapply(input: Fraction)\
  \ = (input.num, input.den)\n```\n\n这是一个产生单个值的提取器示例：\n\n点击此处查看代码图片\n\n```\nobject\
  \ Number :\n  def unapply(input: String): Option[Int] =\n    try\n      Some(input.strip.toInt)\n\
  \    catch\n      case ex: NumberFormatException => None\n```\n\n使用此提取器，你可以从字符串中提取数字：\n\
  \n```\nval Number(n) = \"1729\"\n```\n\n返回 `Boolean` 的提取器测试其输入而不提取任何值。这里有一个测试提取器：\n\
  \n点击此处查看代码图片\n\n```\nobject IsCompound :\n  def unapply(input: String) = input.contains(\"\
  \ \")\n```\n\n你可以将此提取器用于模式以添加测试：\n\n点击此处查看代码图片\n\n```\nauthor match\n  case Name(first,\
  \ last @ IsCompound()) => ...\n    // 如果姓是复合的，例如 van der Linden\n  case Name(first,\
  \ last) => ...\n```\n\n最后，`unapplySeq` 的返回类型可以比 `Option[Seq[T]]` 更通用：\n\n- 如果匹配不会失败，则不需要\
  \ `Option`。\n- 替代 `Option` 使用任何具有 `isEmpty` 和 `get` 方法的类型。\n- 替代 `Seq` 使用具有 `apply`、`drop`、`toSeq`\
  \ 以及 `length` 或 `lengthCompare` 方法的任何类型。\n\n\n\n\nScala 是一门强类型语言，它在编译时报告类型错误，而不是运行时。如果你有一个表达式\
  \ `x.f(args)`，并且你的程序编译通过了，那么你就可以确定 `x` 拥有一个可以接受给定参数的方法 `f`。然而，在某些情况下，在运行中的程序中定义方法是有意义的。这在像\
  \ `Ruby` 或 `JavaScript` 等动态语言的对象关系映射器（ORM）中很常见。表示数据库表的对象具有 `findByName`、`findById`\
  \ 等方法，这些方法名与表列匹配。对于数据库实体，可以使用列名来获取和设置字段，例如 `person.lastName = \"Doe\"`。\n\n在 Scala\
  \ 中，你也可以这样做。如果一个类型扩展了 `scala.Dynamic` 特质，那么方法调用、getter 方法和 setter 方法就会被重写为对特殊方法的调用，这些方法可以检查原始调用的名称和参数，然后采取任意操作。\n\
  \n![Images](img/note.jpg) **注意**\n\n动态类型是一种“异类”特性，当你实现此类类型时，编译器需要你的显式同意。你可以通过添加\
  \ `import` 语句来实现这一点。\n\n点击此处查看代码图像\n\n```scala\nimport scala.language.dynamics\n\
  ```\n\n此类类型的用户不需要提供 `import` 语句。\n\n以下是重写的细节。考虑 `obj.name`，其中 `obj` 属于一个 `Dynamic`\
  \ 的子类。以下是 Scala 编译器对其的处理方式：\n\n1. 如果 `name` 是 `obj` 的已知方法或字段，则按通常方式处理。\n2. 如果 `obj.name`\
  \ 后面跟着 `(arg1, arg2, ...)`，\n    1. 如果没有参数是有命名的（形式为 `name=arg`），则将参数传递给 `applyDynamic`：\n\
  \       点击此处查看代码图像\n       ```\n       obj.applyDynamic(\"name\")(arg1, arg2, ...)\n\
  \       ```\n    2. 如果至少有一个参数是有命名的，则将键值对传递给 `applyDynamicNamed`：\n       点击此处查看代码图像\n\
  \       ```\n       obj.applyDynamicNamed(\"name\")((name1, arg1), (name2, arg2),\
  \ ...)\n       ```\n       在这里，`name1`、`name2` 等是带有参数名的字符串，对于无命名参数使用 `\"\"`。\n3.\
  \ 如果 `obj.name` 在 `=` 的左侧，则调用：\n   点击此处查看代码图像\n   ```\n   obj.updateDynamic(\"name\"\
  )(rightHandSide)\n   ```\n4. 否则调用：\n   ```\n   obj.selectDynamic(\"sel\")\n   ```\n\
  \n![Images](img/note.jpg) **注意**\n\n对 `updateDynamic`、`applyDynamic` 和 `applyDynamicNamed`\
  \ 的调用是“柯里化的”它们有两组括号，一组用于选择器名称，另一个用于参数。这种结构在第 12 章中进行了解释。\n\n让我们来看几个例子。假设 `person`\
  \ 是扩展了 `Dynamic` 的类型的实例。语句\n\n```\nperson.lastName = \"Doe\"\n```\n\n会被替换为调用：\n\n\
  点击此处查看代码图像\n\n```\nperson.updateDynamic(\"lastName\")(\"Doe\")\n```\n\n`Person`\
  \ 类必须有这样一个方法：\n\n点击此处查看代码图像\n\n```scala\nclass Person :\n  ...\n  def updateDynamic(field:\
  \ String)(newValue: String) = ...\n```\n\n然后由你决定实现 `updateDynamic` 方法。例如，如果你正在实现一个对象关系映射器，你可能会更新缓存的实体并标记为已更改，以便将其持久化到数据库中。\n\
  \n相反，语句\n\n```scala\nval name = person.lastName\n```\n\n变为：\n\n点击此处查看代码图像\n\n```scala\n\
  val name = name.selectDynamic(\"lastName\")\n```\n\n`selectDynamic` 方法将只需查找字段值。\n\
  \n方法调用会被翻译为 `applyDynamic` 或 `applyDynamicNamed` 方法的调用。后者用于带命名参数的调用。例如，\n\n点击此处查看代码图像\n\
  \n```scala\nval does = people.findByLastName(\"Doe\")\n```\n\n变为：\n\n点击此处查看代码图像\n\
  \n```scala\nval does = people.applyDynamic(\"findByLastName\")(\"Doe\")\n```\n\n\
  以及\n\n点击此处查看代码图像\n\n```scala\nval johnDoes = people.find(lastName = \"Doe\", firstName\
  \ = \"John\")\n```\n\n变为：\n\n点击此处查看代码图像\n\n```scala\nval johnDoes =\n  people.applyDynamicNamed(\"\
  find\")((\"lastName\", \"Doe\"), (\"firstName\", \"John\"))\n```\n\n`applyDynamicNamed`\
  \ 方法然后由你决定实现。`selectDynamic` 方法将只需查找字段值。\n\n\n\n\n点击此处查看代码图片\n\n```\nval toaster\
  \ = Props(\n  Map(\"description\" -> \"Blackwell Toaster\", \"price\" -> 29.95)).asInstanceOf[Item]\n\
  ```\n\n当你调用\n\n```\ntoaster.price\n```\n\n时，会触发 `selectDynamic` 方法。这与上一节中的操作无区别。\n\
  \n然而，调用 `toaster.brand` 将导致**编译时错误**，因为 `brand` 并不是 `Item` 类型中列出的选择器之一。\n\n接下来，让我们转向方法。我们想编写一个使用\
  \ Scala 语法进行 REST 用的库。像如下调用：\n\n点击此处查看代码图片\n\n```\nval buyer = myShoppingService.customer(id)\n\
  shoppingCart += myShoppingService.item(id)\n```\n\n应该在后台调用 REST 请求 [`http://myserver.com/customer/id`](http://myserver.com/customer/id)\
  \ 和 [`http://myserver.com/item/id`](http://myserver.com/item/id)，并产生 JSON 响应。\n\n\
  我们希望这种操作是类型安全的。对一个不存在的 REST 服务的调用应该在编译时失败。\n\n首先，创建一个泛型类：\n\n点击此处查看代码图片\n\n```\n\
  class Request(baseURL: String) extends Selectable :\n  def applyDynamic(name: String)(args:\
  \ Any*): Any =\n    val url = s\"$baseURL/$name/${args(0)}\"\n    scala.io.Source.fromURL(url).mkString\n\
  ```\n\n然后，将其限制到你已知实际上支持的服务上。\n\n我无法访问购物服务，但我有一个可以产生随机名词和形容词的服务：\n\n点击此处查看代码图片\n\n\
  ```\ntype RandomService = Request {\n  def nouns(qty: Int) : String\n  def adjectives(qty:\
  \ Int) : String\n}\n```\n\n构造一个实例：\n\n点击此处查看代码图片\n\n```\nval myRandomService =\n\
  \  new Request(\"https://horstmann.com/random\").asInstanceOf[RandomService]\n```\n\
  \n现在，调用\n\n```\nmyRandomService.nouns(5)\n```\n\n会被翻译为调用\n\n点击此处查看代码图片\n\n```\n\
  myRandomService.applyDynamic(\"nouns\")(5)\n```\n\n然而，如果方法名既不是 `nouns` 也不是 `adjectives`，就会发生编译器错误。\n\
  \n## 练习\n\n1. 根据优先级规则，`3 + 4 -> 5` 和 `3 -> 4 + 5` 是如何被求值的？\n\n2. `BigInt` 类有一个 `pow`\
  \ 方法，而不是运算符。为什么 Scala 库的设计者没有选择 `**`（如 Fortran 中）或 `^`（如 Pascal 中）作为幂运算符？\n\n3.\
  \ 实现 `Fraction` 类，并包含 `+` `-` `*` `/` 操作。对分数进行归一化，例如将 15/−6 转换为 −5/2。通过最大公约数进行除法，如下所示：\n\
  \n点击此处查看代码图片\n\n```\nclass Fraction(n: Int, d: Int) :\n  private val num: Int =\
  \ if d == 0 then 1 else n * sign(d) / gcd(n, d);\n  private val den: Int = if d\
  \ == 0 then 0 else d * sign(d) / gcd(n, d);\n  override def toString = s\"$num/$den\"\
  \n  def sign(a: Int) = if a > 0 then 1 else if a < 0 then -1 else 0\n  def gcd(a:\
  \ Int, b: Int): Int = if b == 0 then abs(a) else gcd(b, a % b)\n  ...\n```\n\n4.\
