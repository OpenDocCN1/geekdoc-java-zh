  \n\n\n\n\n\n块缩进在分支和循环中很常见：\n\n```\nif n % 2 == 0 then\n  a = a * a\n  n = n / 2\n\
  else\n  r = r * a\n  n -= 1\n```\n\n你可以使用大括号，但在 Scala 3 中，更倾向于使用“安静”缩进风格。Python\
  \ 程序员将为此感到欣喜。\n\n\n\n\n在这个示例中，实际上不需要使用索引。你可以直接遍历字符：\n\n点击此处查看代码图片\n\n```\nsum =\
  \ 0\nfor ch <- \"Hello\" do sum += ch\n```\n\n在 Scala 中，循环的使用不像在其他语言那样频繁。正如你将在第\
  \ 12 章中看到的，你通常可以通过对序列中的所有值应用一个函数来处理它们，这可以通过单个方法调用完成。\n\n![Images](img/note.jpg)\
  \ 注意事项\n\nScala 没有用于跳出循环的 `break` 或 `continue` 语句。如果需要 `break` 该怎么办？\n\n你始终可以使用额外的布尔控制变量来替换\
  \ `break` 语句。或者，你可以使用 `Breaks` 对象中的 `break` 方法：\n\n点击此处查看代码图片\n\n```\nimport scala.util.control.Breaks.*\n\
  breakable {\n   for c <- \"Hello, World!\" do\n      if c == ',' then break // 退出\
  \ breakable 块\n      else println(c)\n}\n```\n\n在这里，控制转移是通过抛出和捕获异常实现的，因此在时间紧迫的情况下应避免这种机制。\n\
  \n![Images](img/note.jpg) 注意事项\n\n在 Java 中，你不能拥有两个同名且作用重叠的局部变量。在 Scala 中，没有这种限制，而是适用于标准的遮蔽规则。例如，下面的代码是完全合法的：\n\
  \n点击此处查看代码图片\n\n```\nval k = 42\nfor k <- 1 to 10 do\n  println(k) // 这里 k 指的是循环变量\n\
  ```\n\n## 2.6 关于 `for` 循环的更多内容\n\n在上一节中，你已经了 `for` 循环的基本形式。然而，这种结构在 Scala 中比 Java、JavaScript\
  \ 或 C++ 要丰富得多。本节将介绍高级特性。\n\n你可以拥有多个形式为*变量* `<-` *表达式* 的*生成器*。例如，\n\n点击此处查看代码图片\n\
  \n```\nfor\n  i <- 1 to 3\n  j <- 1 to 3\ndo\n  print(f\"${10 * i + j}%3d\")\n \
  \ // 打印 11 12 13 21 22 23 31 32 33\n```\n\n*守卫语句*（guard）是 `if` 前的布尔条件：\n\n```\n\
  for\n  i <- 1 to 3\n  j <- 1 to 3\n  if i != j\ndo\n  print(f\"${10 * i + j}%3d\"\
  )\n  // 打印 12 13 21 23 31 32\n```\n\n你可以拥有任意数量的*定义*，引入可以在循环内部使用的变量：\n\n```\nfor\n\
  \  i <- 1 to 3\n  from = 4 - i\n  j <- from to 3\ndo\n  print(f\"${10 * i + j}%3d\"\
  )\n  // 打印 13 22 23 31 32 33\n```\n\n![Images](img/note.jpg) 注意事项\n\n如果你喜欢，可以使用分号代替换行来分隔\
  \ `for` 循环的生成器和定义。`if` 守卫语句前的分号是可选的。\n\n点击此处查看代码图片\n\n```\nfor i <- 1 to 3; from\
  \ = 4 - i; j <- from to 3 if i != j\n  do println(i * 10 + j)\n```\n\n经典语法使用括号代替\
  \ `do` 关键字：\n\n点击此处查看代码图片\n\n```\nfor (i <- 1 to 3; from = 4 - i; j <- from to 3\
  \ if i != j)\n  println(i * 10 + j)\n```\n\n使用大括号也可以的：\n\n点击此处查看代码图片\n\n```\nfor\
  \ { i <- 1 to 3; from = 4 - i; j <- from to 3 if i != j }\n  println(i * 10 + j)\n\
  ```\n\n当 `for` 循环的主体以 `yield` 开始时，循环会构建一个值集合，每次迭代产生一个值：\n\n点击此处查看代码图片\n\n```\nval\
  \ result = for i <- 1 to 10 yield i % 3\n  // 生成 Vector(1, 2, 0, 1, 2, 0, 1, 2,\
  \ 0, 1)\n```\n\n这种类型的循环被称为 `for` *推导式*（comprehension）。\n\n生成的集合与生成器兼容。\n\n点击此处查看代码图片\n\
  \n```\nfor c <- \"Hello\" yield (c + 1).toChar\n  // 生成字符串 \"Ifmmp\"\n```\n\n##\
  \ 2.7 函数\n\nScala 拥有函数。要定义一个函数，指定其名称、参数和体。然而，只要函数体不是递归的，就不需要指定类型。Scala 编译器会从函数体推断类型。\n\
  \n对于递归函数，你必须指定返回类型。例如，\n\n点击此处查看代码图片\n\n```\ndef fac(n: Int): Int = if n <= 0 then\
  \ 1 else n * fac(n - 1)\n```\n\n如果没有返回类型，Scala 编译器无法验证 `n * fac(n - 1)` 的类型为 `Int`。\n\
  \n![Images](img/note.jpg) 注意事项\n\n某些编程语言（如 ML 和 Haskell）*可以*使用 Hindley-Milner 算法推断递归函数的类型。但这在面向对象的语言中效果并不良好。扩展\
  \ Hindley-Milner 算法以处理子类型仍然是一个研究问题。\n\n函数可以返回任何值。考虑这个示例：\n\n点击此处查看代码图片\n\n```\n\
  def log(sb: StringBuilder, message: String) =\n  sb.append(java.time.Instant.now())\n\
  \  sb.append(\": \")\n  sb.append(message)\n  sb.append(\"\\n\")\n```\n\n该函数追加了一个带有时间戳的消息。\n\
  \n从技术上讲，函数返回了一个值，即最后一次调用 `append` 返回的值。我们对那个值感兴趣，无论它是什么。为了明确该函数仅是为了副作用而调用的，请声明返回类型为\
  \ `Unit`：\n\n点击此处查看代码图片\n\n\n\n\n\n```scala\ndef log(sb: StringBuilder, message:\
  \ String) : Unit = ...\n```\n\n## 2.8 默认参数与命名参数 L1\n\n函数可以提供默认参数，当调用时没有提供显式值时就会使用这些参数。例如，\n\
  \n点击此处查看代码图像\n\n```scala\ndef decorate(str: String, left: String = \"[\", right:\
  \ String = \"]\") =\n  left + str + right\n```\n\n此函数有两个参数，`left` 和 `right`，默认参数分别为\
  \ `\"[\"` 和 `\"]\"`。\n\n如果你调用 `decorate(\"Hello\")`，你会得到 `\"[Hello]\"`。如果你不喜欢默认值，可以提供自己的值：`decorate(\"\
  Hello\", \"<<<\", \">>>\")`。\n\n如果你提供的参数少于参数个数，默认参数将从后开始应用。例如，`decorate(\"Hello\"\
  , \">>>[\")` 使用了 `right` 参数的默认值，产生 `\">>>[Hello]\"`。\n\n你可以在提供参数时也指定参数名。例如，\n\n\
  点击此处查看代码图像\n\n```scala\ndecorate(left = \"<<<\", str = \"Hello\", right = \">>>\"\
  )\n```\n\n结果是 `\"<<<Hello>>>\"`。注意，命名参数不需要与参数的顺序相同。\n\n命名参数可以使函数调用更具可读性。如果函数有许多带有默认参数的参数，它们也非常有用。\n\
  \n你可以混合使用非命名参数和命名参数，只要非命名参数在前即可：\n\n点击此处查看代码图像\n\n```scala\ndecorate(\"Hello\",\
  \ right = \"]<<<\") // 调用 decorate(\"Hello\", \"[\", \"]<<<\")\n```\n\n## 2.9 可变参数\
  \ L1\n\n有时，实现一个可以接受任意数量参数的函数是非常方便的。下面的示例展示了语法：\n\n点击此处查看代码图像\n\n```scala\ndef sum(args:\
  \ Int*) =\n  var result = 0\n  for arg <- args do result += arg\n  result\n```\n\
  \n你可以根据需要提供任意数量的参数来调用此函数。\n\n```scala\nsum(1, 4, 9, 16, 25)\n```\n\n该函数接收类型为 `Seq`\
  \ 的单个参数，我们将在第 13 章中讨论它。现在，你只需要知道可以使用 `for` 循环来访问每个元素。\n\n如果你已经有一个值序列，不能直接将其传递给此类函数。例如，以下代码是不正确的：\n\
  \n```scala\nsum(1 to 5) // 错误\n```\n\n如果调用 `sum` 函数时只传入一个参数，它必须是一个单整数，而不是整数范围。解决办法是告诉编译器你希望该参数被视为序列。使用后置的\
  \ `*`，如下：\n\n点击此处查看代码图像\n\n```scala\nsum((1 to 5)*) // 将 1 to 5 视为参数序列\n```\n\n\
  这种调用语法在递归定义中是必要的：\n\n点击此处查看代码图像\n\n```scala\ndef recursiveSum(args: Int*) : Int\
  \ =\n  if args.length == 0 then 0\n  else args.head + recursiveSum(args.tail*)\n\
  ```\n\n在这里，序列的 `head` 是它的初始元素，`tail` 是包含所有其他元素的序列。那又是一个 `Seq` 对象，我们必须使用后置的 `*` 将其转换为参数序列。\n\
  \n## 2.10 Main 函数\n\n每个程序必须从某处开始。当运行编译后的可执行文件时，入口是使用 `@main` 注解定义的函数：\n\n```scala\n\
  @main def hello() =\n  println(\"Hello, World!\")\n```\n\n主函数叫什么并不重要。\n\n要处理命令行参数，请提供一个类型为\
  \ `String*` 的参数：\n\n点击此处查看代码图像\n\n```scala\n@main def hello2(args: String*) =\n\
  \  println(s\"Hello, ${args(1)}!\")\n```\n\n你也可以为命令行参数指定类型：\n\n点击此处查看代码图像\n\n```scala\n\
  @main def hello3(repetition: Int, name: String) =\n  println(\"Hello \" * repetition\
  \ + name)\n```\n\n那么第一个命令行参数必须是一个整数（或者更准确地说，是一个包含整数的字符串）。\n\n提供了 `Boolean`、`Byte`、`Short`、`Int`、`Long`、`Float`\
  \ 和 `Double` 解析器。你可以解析其他类型——参见第 37 页[练习 13]。\n\n![图像](img/note.jpg) 注意\n\n在编译带有\
  \ `@main` 注解函数的程序时，编译器会生成一个类文件，其名称为该函数的名称，*而不是*源文件的名称。例如，如果 `hello` 函数在 `Main.scala`\
  \ 文件中。\n\n## 2.11 无参数函数\n\n你可以不带任何参数地声明函数：\n\n点击此处查看代码图像\n\n```scala\ndef words\
  \ = scala.Source.fromFile(\"/usr/share/dict/words\").mkString\n```\n\n带括号调用它。相反，如果你带括号定义了函数：\n\
  \n点击此处查看代码图像\n\n```scala\ndef words() = scala.Source.fromFile(\"/usr/share/dict/words\"\
  ).mkString\n```\n\n你必须带括号调用该函数。在 Scala 中，如果该函数是“幂等”的——即它总是返回相同的值。例如，如果文件 `/usr/share/dict/words`\
  \ 的内容不会改变，那么不带括号是正确的选择。Scala 3 对括号的使用比之前的版本更严格。如果你带括号定义函数，就必须带括号调用。反之，不带括号定义的函数必须不带括号调用。为了兼容，此规则不适用于旧函数。`scala.math.random`\
  \ 函数绝对不是幂等的。期望每次调用 `scala.math.random()` 得到不同的值。尽管如此，它也可以带括号调用。\n\n## 2.12 惰性值 L1\n\
  \n当 `val` 被声明为 `lazy` 时，它的初始化会被延迟到第一次被访问。例如，\n\n点击此处查看代码图像\n\n```scala\nlazy val\
  \ words = scala.Source.fromFile(\"/usr/share/dict/words\").mkString\n```\n\n（我们将在第\
  \ 9 章中讨论文件操作。现在，只需假设该调用从文件中读取所有字符到字符串。）\n\n如果程序从未访问 `words`，文件就不会被打开。为了验证这一点，请在\
  \ REPL 中尝试，但写错文件名。执行初始化语句时不会报错。然而，当你访问 `words` 时，你会得到找不到文件的错误。\n\n惰性值对于延迟昂贵的初始化语句非常有用。它们还可以处理其他初始化问题，例如循环依赖。此外，它们对于开发惰性数据结构至关重要——参见第\
  \ 13 章。\n\n你可以将惰性值视为 `val` 和 `def` 之间的中间物。比较\n\n\n\n\n\n```\nval words1 =\n  println(\"\
  words1: Reading file\")\n  scala.io.Source.fromFile(\"/usr/share/dict/words\").mkString\n\
  \  // 在定义 words1 时立即进行求值\nlazy val words2 =\n  println(\"words2: Reading file\"\
  )\n  scala.io.Source.fromFile(\"/usr/share/dict/words\").mkString\n  // 在第一次使用 words2\
  \ 时求值\ndef words3 =\n  println(\"words3: Reading file\")\n  scala.io.Source.fromFile(\"\
  /usr/share/dict/words\").mkString\n  // 每次使用 words3 时都会求值\n```\n\n![Images](img/note.jpg)\
  \ 注意\n\n惰性不是免费的。每当访问一个惰性值时，都会调用一个方法以线程安全的方式检查该值是否已经初始化。\n\n## 2.13 异常\n\nScala 异常的工作原理与\
  \ Java、JavaScript、C++ 或 Python 相同。当你抛出一个异常时，例如：\n\n点击此处查看代码图片\n\n```\nthrow IllegalArgumentException(\"\
  x should not be negative\")\n```\n\n当前计算会被中断，运行时系统会寻找可以接受 `IllegalArgumentException`\
  \ 的异常处理器。控制将从最内层的此类处理器处恢复。如果不存在这样的处理器，程序将终止。\n\n与 Java 类似，你抛出的对象需要属于 `java.lang.Throwable`\
  \ 的子类。然而，与 Java 不同的是，Scala 没有“检查型异常”（checked exceptions）——你永远不需要声明某个函数或方法可能会抛出异常。\n\
  \n![Images](img/note.jpg) 注意\n\n在 Java 中，“检查型”异常是在编译时检查的。如果你的方法可能会抛出 `IOException`，你必须声明它。这迫使程序员思考在何处处理这些异常，这是一个值得赞的目标。不幸的是，它也可能导致巨大的方法签名，例如\
  \ `void doSomething() throws IOException, InterruptedException, ClassNotFoundException`。许多\
  \ Java 程序员讨厌这个特性，并最终通过过早捕获异常或使用过度通用的异常类来使其适得其反。Scala 的设计者决定不使用检查型异常，他们意识到彻底的编译时检查并不总是件好事。\n\
  \n`throw` 表达式具有特殊类型 `Nothing`。这在 `if`/`else` 表达式非常有用。如果一个分支的类型为 `Nothing`，则 `if`/else`\
  \ 表达式的类型就是另一个分支的类型。例如，考虑：\n\n点击此处查看代码图片\n\n```\nif x >= 0 then scala.math.sqrt(x)\n\
  else throw IllegalArgumentException(\"x should not be negative\")\n```\n\n第一个分支类型为\
  \ `Double`，第二个类型为 `Nothing`。因此，`if`/else` 表达式的类型也是 `Double`。\n\n捕获异常的语法模仿了模式匹配语法（参见第\
  \ 14 章）。\n\n点击此处查看代码图片\n\n```\nval url = URL(\"http://horstmann.com/fred.gif\")\n\
  try\n  process(url)\ncatch\n  case _: MalformedURLException => println(s\"Bad URL:\
  \ $url\")\n  case ex: IOException => println(ex)\n```\n\n更通用的异常类型必须放在更具体的类型之后。\n\
  \n注意，如果你不需要变量名，可以使用 `_`。\n\n`try`/`finally` 语句允许你无论是否发生异常都释放资源。例如：\n\n点击此处查看代码图片\n\
  \n```\nval in = URL(\"http://horstmann.com/cay-tiny.gif\").openStream()\ntry\n \
  \ process(in)\nfinally\n  println(\"Closing input stream\")\n  in.close()\n```\n\
  \n无论 `process` 函数是否抛出异常，`finally` 子句都会执行。输入流总是会被关闭的。\n\n这段代码有点微妙，并引发了几个问题：\n\n*\
  \   如果 `URL` 构造函数或 `openStream` 方法抛出异常怎么办？那么 `try` 块将不会进入，`finally` 子句也不会进入。这倒也好——`in`\
  \ 从未被初始化，所以对它调用 `close` 没有任何意义。\n*   为什么 `val in = URL(...).openStream()` 不放在 `try`\
  \ 块内部？那样 `in` 的作用范围将无法扩展到 `finally` 子句。\n*   如果 `in.close()` 抛出异常怎么办？那么该异常将抛出语句，取代任何早先的异常。（这与\
  \ Java 一样，并且并不友好。理想情况下，旧异常应该附加在新异常上。）\n\n注意 `try`/`catch` 和 `try`/`finally` 有互补的目标。`try`/catch`\
  \ 语句处理异常，而 `try`/`finally` 语句在异常未被处理时执行某些操作（通常是清理）。你可以将它们合并为单一 `try/catch/finally`\
  \ 语句：\n\n```\ntry\n  ...\ncatch\n  ...\nfinally\n  ...\n```\n\n这等同于：\n\n```\ntry\n\
  \  try\n    ...\n  catch\n    ...\nfinally\n  ...\n```\n\n在实践中，这种组合并不经常使用，因为异常通常在远离抛出点的地方捕获，而清理工作需要在抛出的附近进行。\n\
  \n`Try` 类设计用于处理可能失败的计算。我们将在第 16 章中详细查看它。例如：\n\n```scala\nimport scala.util.*\nval\
  \ result =\n  for\n    a <- Try { StdIn.readLine(\"a: \").toInt }\n    b <- Try\
  \ { StdIn.readLine(\"b: \").toInt }\n  yield a / b\n```\n\n如果在任何一个 `toInt` 调用中发生异常，或者因为除以零发生，`result`\
  \ 将是一个 `Failure` 对象，包含导致失败的异常。否则，`result` 是一个持有计算结果的 `Success` 对象。\n\n`Try` 类设计用于处理可能失败的计算。\n\
  \nScala 没有类似于 Java 的 `try-with-resources` 语句。在 Java 中，你可以使用 `try` 处理通常在远离抛出点的地方捕获的异常，而清理工作需要在抛出的附近进行。\n\
  \n![Images](img/note.jpg) 注意\n\n在 Scala 中，`Using` 助手处理了这种情况：\n\n```\nimport scala.util.*\n\
  Using.Manager { use =>\n  val in = use(openReader(inPath))\n  val out = use(openWriter(outPath))\n\
  \  // 从 in 读取，写入 out\n  process(in, out)\n} // 读取器写入器被关闭\n```\n\n## 练习题\n\n1. `println(println(\"\
  Hello\"))` 输出什么，为什么？\n2. 空块 `{}` 的值是什么？它的类型是什么？\n3. 想出一个在 Scala 中赋值语句 `x = y = 1`\
