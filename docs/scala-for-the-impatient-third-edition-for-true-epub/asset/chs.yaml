  ```\n\n如果调用指示失败，则匹配失败。\n\n否则，调用将产生提取出的值，并与模式进行匹配。如果值不足以匹配模式，则匹配失败。如果模式是常量，它必须匹配对应的值，否则匹配失败。如果模式是变量，则该变量将被赋予对应的值。\n\
  \n允许的返回类型规则有点复杂——详情请参见第 11 章。在指示成功与失败以及产生提取出的值方面，存在一定的灵活性。这些细节仅与提取器的实现者相关。\n\n##\
  \ 14.8 变量声明中的模式\n\n在前面的几节中，你在 `match` 表达式中使用了模式。你也可以将模式用于变量声明。例如：\n\n```\nval (a,\
  \ b) = (1, 2)\n```\n\n这会同时定义 `a` 为 `1` 且 `b` 为 `2`。这对于返回元组的函数非常有用，例如：\n\n```\nval\
  \ (q, r) = BigInt(10) /% 3\n```\n\n`/%` 方法返回一个包含商和余数的元组，这些值被捕获在变量 `q` 和 `r` 中。\n\
  \n相同的语法适用于提取器模式。例如：\n\n点击此处查看代码图像\n\n```\nval Array(0, second, rest*) = arr\n```\n\
  \n如果 `arr` 的元素少于两个或 `arr(0)` 不零，则抛出 `MatchError`。否则，`second` 变为 `a(1)`，`rest` 设置为剩余元素的\
  \ `Seq`。\n\n![Images](img/caution.jpg) 注意\n\n与第 14.3 节中的“模式中的变量”的警告相同，该警告位于第 211\
  \ 页。你在模式中使用的变量名必须以`lowercase`（小写字母）字母开头。在对 `case Array(X, Y)` 的匹配中，`X` 和 `Y` 被视为常量。\n\
  \n![Images](img/note.jpg) 注意\n\n模式可以有备选方案：\n\n点击此处查看代码图像\n\n```\npair match\n  case\
  \ (_, 0) | (0, _) => ... // OK，如果一个组件为零则匹配\n```\n\n然而，你不能使用下划线以外的变量：\n\n点击此处查看代码图像\n\
  \n```\npair match\n  case (x, 0) | (0, x) => ... // 错误——无法在备选方案中绑定\n```\n\n### 14.9\
  \ for 表达式中的模式\n\n在前面的几节中，你在 `match` 表达式中使用了模式。你也可以将模式用于变量声明。例如：\n\n```\nval (a,\
  \ b) = (1, 2)\n```\n\n这会同时定义 `a` 为 `1` 且 `b` 为 `2`。这对于返回元组的函数非常有用，例如：\n\n```\nval\
  \ (q, r) = BigInt(10) /% 3\n```\n\n`/%` 方法返回一个包含商和余数的元组，这些值被捕获在变量 `q` 和 `r` 中。\n\
  \n相同的语法适用于提取器模式。例如：\n\n点击此处查看代码图像\n\n```\nval Array(0, second, rest*) = arr\n```\n\
  \n如果 `arr` 的元素少于两个或 `arr(0)` 不零，则抛出 `MatchError`。否则，`second` 变为 `a(1)`，`rest` 设置为剩余元素的\
  \ `Seq`。\n\n### 14.10 类类 (Case Classes)\n\n类类是一种专为模式匹配优化的特殊类。在本例中，我们有两个扩展自普通（非类）的类类：\n\
  \n点击此处查看代码图像\n\n```\nabstract class Amount\ncase class Dollar(value: Double) extends\
  \ Amount\ncase class Currency(value: Double, unit: String) extends Amount\n```\n\
  \n你也可以拥有单例的类对象（case objects）：\n\n点击此处查看代码图像\n\n```\ncase object Nothing extends\
  \ Amount\n```\n\n当我们有一个 `Amount` 类型的对象时，可以使用模式匹配来匹配金额类型并将属性值绑定到变量上：\n\n点击此处查看代码图像\n\
  \n```\namt match\n  case Dollar(v) => s\"$$$v\"\n  case Currency(_, u) => s\"Oh\
  \ noes, I got $u\"\n  case Nothing => \"\"\n```\n\n\n\n\n![Images](img/note.jpg)\
  \ Note\n\n`Option` 类型有子类型 `Some` 和 `None`，它们分别是一个例类（case class）和一个例例对象（case object）。你可以使用模式匹配来分析\
  \ `Option` 值：\n\n点击此处代码图片\n\n```\nscores.get(\"Alice\") match\n  case Some(score)\
  \ => println(score)\n  case None => println(\"No score\")\n```\n\n当你声明一个例类时，会自动发生几件事：\n\
  \n* 每个构造器参数都会变成一个 `val`，除非显式声明为 `var`（不建议这样做）。\n* 伴侣对象会提供一个 `apply` 方法，允许你无需使用 `new`\
  \ 来构造对象，例如 `Dollar(29.95)` 或 `Currency(29.95, \"EUR\")`。\n* 提供一个 `unapply` 方法，使模式匹配生效。\n\
  * 除非你提供了它们，否则会自动生成 `toString`、`equals`、`hashCode` 和 `copy` 方法。\n\n否则，例类就像任何其他类一样。你可以向它们添加方法和字段，扩展它们等。\n\
  \n![Images](img/caution.jpg) CAUTION\n\n例类不能继承另一个例类。如果你需要多层继承来提炼例类的公共行为，请仅将继承树的叶子节点\
  \ 写为例类。\n\n例类的 `copy` 方法会创建一个与现有对象具有相同值的新对象。例如：\n\n点击此处代码图片\n\n```\nval price =\
  \ Currency(29.95, \"EUR\")\nvar discounted = price.copy()\n```\n\n单就本身而言，这并没有什么用——毕竟\
  \ `Currency` 对象是不可变的，人们可以直接共享对象引用。但是，你可以使用命名参数来修改某些属性：\n\n点击此处代码图片\n\n```\ndiscounted\
  \ = price.copy(value = 19.95) // Currency(19.95, \"EUR\")\n```\n\n或者\n\n点击此处代码图片\n\
  \n```\ndiscounted = price.copy(unit = \"CHF\") // Currency(29.95, \"CHF\")\n```\n\
  \n![Images](img/note.jpg) Note\n\n在类型理论中，例类被称为*积类型*（product type），因为它的值集是各个组成类型值集的“笛卡尔积”。如果值集是有限的，例类可以取值的可能值数量确实是组成类型大小的乘积。考虑例如：\n\
  \n点击此处代码图片\n\n```\nenum Rank { case ACE, TWO, THREE, FOUR, FIVE, SIX, SEVEN,\n \
  \ EIGHT, NINE, TEN, JACK, QUEEN, KING } // 13 个值\nenum Suit { case DIAMONDS, HEARTS,\
  \ SPADES, CLUBS } // 4 个值\ncase class Card(r: Rank, s: Suit) // 13 × 4 = 52 个值\n\
  ```\n\n每个例类都继承 `Product` 特质，并拥有方法 `_1`、`_2` 等来访问元素：\n\n点击此处代码图片\n\n```\nval price\
  \ = Currency(100, \"CHF\")\nprice._1 // 100\nprice._2 // \"CHF\"\n```\n\n![Images](img/note.jpg)\
  \ Note\n\n例类的 `unapply` 方法非常简单——它只是简单返回参数：\n\n点击此处代码图片\n\n```\nCurrency.unapply(price)\
  \ == price\n```\n\n要了解为什么这有效，请仔细研究第 11 章中 `unapply` 方法的高级规则。如果提取总是成功，`unapply` 方法并不非返回\
  \ `Option`，它可以返回任何 `Product` 实例。值通过 `_1`、`_2` 等方法进行提取。\n\n### 14.11 匹配嵌套结构\n\n例类经常用于嵌套结构。例如，考虑商店出售的商品。有时我们将商品组合在一起以提供折扣。\n\
  \n点击此处代码图片\n\n```\nabstract class Item\ncase class Article(description: String,\
  \ price: Double) extends Item\ncase class Bundle(description: String, discount:\
  \ Double, items: Item*) extends Item\n```\n\n当然，你可以指定嵌套对象：\n\n点击此处代码图片\n\n```\n\
  val wish = Bundle(\"Father’s day special\", 20.0,\n  Article(\"Scala for the Impatient\"\
  , 39.95),\n  Bundle(\"Anchor Distillery Sampler\", 10.0,\n    Article(\"Old Potrero\
  \ Straight Rye Whiskey\", 79.95),\n    Article(\"Junípero Gin\", 32.95)))\n```\n\
  \n模式可以匹配特定的嵌套，例如\n\n点击此处代码图片\n\n```\ncase Bundle(_, discount, Article(desc, price))\
  \ => ...\n```\n*(由于原文代码块在此处中断，已根据上下文逻辑补全)*\n\n## 14.12 密封类 (Sealed Classes)\n\n\
  当你对例类使用模式匹配时，你希望编译器检查你是否穷尽了所有情况。为了实现这一点，将父类声明为 `sealed`：\n\n点击此处代码图片\n\n```\nsealed\
  \ class Amount\ncase class Dollar(value: Double) extends Amount\ncase class Currency(value:\
  \ Double, unit: String) extends Amount\n```\n\n密封类的所有子类必须定义在与类相同的文件中。例如，如果有人想添加另一个类，他们必须在定义\
  \ `Amount` 的文件中进行。\n\n当一个类是密封的，它的所有子类在编译时都是已知的，使得编译器可以检查模式的完整性。\n\n![Images](img/note.jpg)\
  \ Note\n\n`Option` 类是一个密封类，有两个子类型：例类 `Some` 和例例对象 `None`。在密封层级中，编译器可以检查匹配是否完整：\n\
  \n点击此处代码\n\n```\nscores.get(\"Alice\") match\n  case Some(score) => println(score)\n\
  \  case None => println(\"No score\")\n```\n\n如果你掉了第二个分支，编译器会警告你。你可以使用 `@unchecked`\
  \ 注解来抑制警告：\n\n点击此处代码图片\n\n```\n(scores.get(\"Alice\")): @unchecked) match\n  case\
  \ Some(score) => println(score)\n```\n\n### 14.13 参数化枚举 (Parameterized Enumerations)\n\
  \n作为密封类层级的替代方案，你可以使用*参数化枚举*：\n\n点击此处代码图片\n\n```\nenum Amount :\n  case Dollar(value:\
  \ Double)\n  case Currency(value: Double, unit: String)\n  case Nothing\n```\n\n\
  这与你在第 6 章中看到的枚举相似。然而，`Dollar` 和 `Currency` 情况带有参数。它们被翻译成例类。第三种分支变成一个例例对象。\n\n注意，例类嵌套在枚举类型内部。用户通过\
  \ `Amount.Dollar`、`Amount.Currency` 和 `Amount.None` 访问它们。\n\n\n\n\n与所有的枚举类一样，你可以向抽象的\
  \ `enum` 类添加方法，但不能向其子类添加方法。你也可以向伴侣对象（companion object）添加方法：\n\n点击此处查看代码图像\n\n```\n\
  object Amount :\n  def euros(value: Double) = if value == 0 then Nothing else Currency(value,\
  \ \"EUR\")\n```\n\n枚举可以有类型参数。例如，`Option` 可以被定义为一个枚举：\n\n点击此处查看代码图像\n\n```scala\n\
  enum Option[+T] :\n  case Some(value: T)\n  case None\n\n  def get = this match\n\
  \    case Some(v) => v\n    case None => throw NoSuchElementException()\n```\n\n\
  类型参数会自动应用于每个 case class。\n\n![Images](img/note.jpg) 别记\n\n在类型参数变异性（variances）不适用于所有\
  \ case class 的罕见情况下，case class 可以声明自己的变异性：\n\n点击此处查看代码图像\n\n```scala\nenum Producer[-T]\
  \ :\n  case ConstantU extends Producer[U]\n  case GeneratorU => U) extends Producer[U]\n\
  ```\n\n![Images](img/note.jpg) 别记\n\n在类型论中，`Amount` 类型被认为是三种替代方案 `Currency`、`Dollar`\
  \ 和 `Nothing` 的和（sum）。其中每一个都是积类型（product type），而 `Amount` 作为积的和被称为代数数据类型（algebraic\
  \ data type）。\n\n在处理 case class 层级结构时，你通常不需要了解这些术语。但是，在第 20 章中，你将看到分析和积类型的工具。\n\n\
  ### 14.14 部分函数 (A3)\n\n一组 `case` 子句可以转换为部分函数（partial function）——一个可能对所有输入都没有定义的函数。它是\
  \ `PartialFunction[P, R]` 类的实例（`P` 是参数类型，`R` 是返回类型）。该类有两个方法：`apply`，它根据匹配的模式计算函数值；以及\
  \ `isDefinedAt`，如果输入匹配至少一个模式，则返回 `true`。\n\n例如，\n\n点击此处查看代码图像\n\n```scala\nval f:\
  \ PartialFunction[Char, Int] =\n  case '+' => 1\n  case '-' => -1\nf('-') // 调用\
  \ f.apply('-'), 返回 -1\nf.isDefinedAt('0') // false\nf('0') // 抛出 MatchError\n```\n\
  \n`IterableOps` 特性的 `collect` 方法将部分函数应用到所有已定义的元素，并返回一个结果的序列。\n\n点击此处查看代码图像\n\n```scala\n\
  \"-3+4\".collect({ case '+' => 1 ; case '-' => -1 }) // Vector(-1, 1)\n```\n\n`case`\
  \ 序列必须处于编译器可以推断返回类型的上下文中。这发生于将其赋值给有类型变量或将其作为参数传递时。\n\n![Images](img/note.jpg) 别记\n\
  \n你还可以将 `case` 序列转换为 `Function[P, R]`。然而，函数缺乏 `isDefinedAt` 方法，因此用户不知道何时调用是安全的。如果\
  \ `case` 子句是穷尽的，那么就不是一个问题。这里，一个 `Function[Char, Int]` 被传递给 `map` 方法：\n\n点击此处查看代码图像\n\
  \n```scala\n\"-3+4\".map({ case '+' => 1 ; case '-' => -1; case _ => 0 })\n  //\
  \ Vector(-1, 0, 1, 0)\n```\n\n`Seq[A]` 是一个 `PartialFunction[Int, A]`，而 `Map[K, V]`\
  \ 是一个 `PartialFunction[K, V]`。例如，你可以将 map 传递给 `collect`：\n\n点击此处查看代码图像\n\n```scala\n\
  val names = Array(\"Alice\", \"Bob\", \"Carmen\")\nval scores = Map(\"Alice\" ->\
  \ 10, \"Carmen\" -> 7)\nnames.collect(scores) // 生成 Array(10, 7)\n```\n\n`lift`\
  \ 方法将 `PartialFunction[T, R]` 转换为返回类型为 `Option[R]` 的普通函数。\n\n点击此处查看代码图像\n\n```scala\n\
  val f: PartialFunction[Char, Int] = { case '+' => 1 ; case '-' => -1 }\nval g =\
  \ f.lift // 类型为 Char => Option[Int] 的函数\ng('-') // Some(-1)\ng('*') // None\n```\n\
  \n在第 9 章中，你看到过 `Regex.replaceSomeIn` 方法需要一个 `String => Option[String]` 函数来进行替换。如果你有一个\
  \ map（或其他部分函数），你可以使用 `lift` 来产生这样的函数：\n\n点击此处查看代码图像\n\n```scala\nval varPattern\
  \ = \"\"\"([0-9]+\"\"\"\nval message = \"At {0}, {1}\"\nval vars = Map(\"{0}\" ->\
  \ \"planet\", \"{1}\" -> \"force\")\nval result = varPattern.replaceSomeIn(message)\
  \ { m =>\n  val (planet, force) = varPattern.findFirstIn(m).get\n  Some(m.replace(\"\
  {0}\", planet).replace(\"{1}\", force))\n}\n```\n\n### 14.15 case 子句中的中表达式表示\n\n\
  当中表达式提取器以冒号结尾时，它从右到左关联。例如，\n\n```scala\ncase first :: second\n```\n\n意味着\n\n点击此处查看代码图像\n\
  \n```scala\ncase first :: rest\n```\n\n每个 `List` 伴侣对象自动有一个 `unapply` 方法。由于有两个参数，你可以使用：\n\
  \n点击此处查看代码图像\n\n```scala\ncase first :: rest\n```\n\n`::` 伴侣对象有一个 `unapply` 方法。这里有一个例子：\n\
  \n```scala\ncase first :: rest\n```\n\n意味着\n\n点击此处查看代码图像\n\n```scala\ncase (first,\
  \ rest)\n```\n\n作为另一个例子，假设你想从 `Fraction` 对象中提取和分，使用 `case n / d`。这很容易实现。只需定义一个命名为\
  \ `/` 的对象，并包含一个 `unapply` 方法：\n\n```scala\nobject Fraction :\n  object / :\n   \
  \ def unapply(input: Fraction) = (input.num, input.den)\n```\n\n`/` 对象必须放在 `Fraction`\
  \ 伴侣对象内部以便访问 `num` 和 `den` 实例变量。现在你可以写：\n\n点击此处查看代码图像\n\n```scala\nFraction(3, 4)\
  \ * Fraction(5, 6) match\n  case n / d => n * 1.0 / d\n```\n\n在这里，第一个 `/` 是 `Fraction./`\
  \ 对象。第二个 `/` 是除法运算符。\n\n注意此示例不涉及 case class。对于中表达式提取，两个模式之间的符号可以是任何具有 `unapply`\
  \ 方法的对象。\n\n## 练习题\n\n1\\. 你的 Java 开发工具包发行版包含了 JDK 大部分的源代码，位于 `src.zip` 文件中。解压并搜索\
  \ case 标签（正则表达式 `case [^:]:`）。然后查找以 `//` 开头并包含 `[Ff]alls? thr` 的注释，以捕获如 `// Falls\
  \ through` 或 `// just fall thru`。假设 JDK 程序员遵循 Java 代码规范（需要此类注释），有多少比例的 case 穿透？\n\
  \n2\\. 使用模式匹配编写一个 `swap` 函数，它接收一个整数对并返回交换了组件的对。\n\n3\\. 使用模式匹配编写一个 `swap` 函数，在数组长度至少为二时，交换数组的前两个元素。\n\
  \n\n\n4. 添加一个名为类 `Multiple` 类，它是 `Item` 类的子类。例如，`Multiple(10, Article(\"Blackwell\
  \ Toaster\", 29.95))` 表示十台烤面包机。当然，你应该能够在第二个参数中处理任何项目，例如捆绑或倍数。扩展 `price` 函数以处理这种新情况。\n\
  \n5. `List[T]` 要么是 `Empty`，要么是 `NonEmpty`，其头部（head）类型为 `T`，尾部（tail）也是 `List[T]`。\n\
  \n分别用样例类（case classes）和 `enum` 实现这样的列表。在（两种情况下，都添加一个 `::` 运算符以及 `length`、`append`\
  \ 和 `map` 方法。\n\n6. 人可以使用列表来建模仅在叶子节点存储值的树。例如，列表 `((3 8) 2 (5))` 描述了如下树：\n\n```\n\
  \ •\n    /|\\\n  •  2  •\n / \\    |\n3   8   5\n```\n\n然而，列表元素中的一些是数字，另一些是列表。在\
  \ Scala 中，你不能拥有异质列表，因此你必须使用 `List[Any]`。编写一个 `leafSum` 函数来计算所有叶子节点元素的和，并使用模式匹配来区分数字和列表。\n\
  \n7. 建模此类树更好的方法是使用样例类。让我们从二叉树开始。\n\n点击此处查看代码图片\n\n```\nsealed abstract class BinaryTree\n\
  case class Leaf(value: Int) extends BinaryTree\ncase class Node(left: BinaryTree,\
  \ right: BinaryTree) extends BinaryTree\n```\n\n编写一个函数计算所有叶子节点元素的和。\n\n8. 扩展上一个练习中的树，使得每个节点可以有任意数量的节点，并重新实现\
  \ `leafSum` 函数。练习 6 中的树应该能够表示为：\n\n点击此处查看代码图片\n\n```\nNode(Node(Leaf(3), Leaf(8)),\
  \ Leaf(2), Node(Leaf(5)))\n```\n\n9. 扩展上一个练习中的树，使得每个非叶子节点除了子节点外还存储一个运算符。然后写一个 `eval`\
  \ 函数来计算值。例如，该树：\n\n```\n +\n    /|\\\n  *  2  -\n / \\    |\n3   8   5\n```\n\n\
  值为 (3 × 8) + 2 + (−) = 21。\n\n注意一元减号。\n\n10. 完成第 6.6 节，“枚举](#ch06.xhtml_sec6_6)”第\
  \ 81 页 中的 `Producer` 类。添加一个 `get` 方法产生另一个元素——常量值或调用生成器函数的结果。编写一个演示常量和随机数生成器的程序。包含一个示例显示\
  \ `Producer` 是逆变的（contravariant）。如果你简单声明以下内容会发生什么？为什么？\n\n点击此处查看代码图片\n\n```\nenum\
  \ Producer[-T] :\n  case Constant(value: T)\n  case Generator(next: () => T)\n```\n\
  \n## 第 15 章 注解\n\n**本章主题 A2**\n\n* 15.1 什么是注解？\n* 15.2 注解的位置\n* 15.3 注解参数\n* 15.4\
  \ 针对 Java 特性的注解\n* 15.5 针对优化的注解\n* 15.6 针对错误和警告的注解\n* 15.7 注解声明\n* 练习\n\n注解允许你向程序项中添加信息。这些信息可以由编译器或外部工具处理。在本章中，你将学习如何与\
  \ Java 注解交互，以及如何使用 Scala 特有的注解。\n\n本章的要点是：\n\n* 你可以对类、方法、字段、局部变量、参数、表达式、类型参数和类型进行注解。\n\
  * 对于表达式和类型，注解位于被注解项之后。\n* 注解的形式为 `@Annotation`、`@Annotation(value)` 或 `@Annotation(name1\
  \ = value1, ...)`。\n* 你可以在 Scala 代码中使用 Java 注解。它们会被保留在类文件中。\n* `@volatile`、`@transient`\
  \ 和 `@native` 生成等效的 Java 修饰符。\n* 使用 `@throws` 生成兼容 Java 的 `throws` 规范。\n* 使用 `@BeanProperty`\
  \ 注解生成 JavaBeans 的 `get*Xxx*/`set*`Xxx`*` 方法。\n* `@tailrec` 注解允许你验证递归函数使用了尾调用优化。\n\
  * 使用 `@deprecated` 注解标记已弃用的特性。\n\n## 15.1 什么是注解？\n\n注解是插入到源代码中的标记，以便某些工具可以处理它们。注解以\
  \ `@` 开头，例如：\n\n点击此处查看代码图片\n\n```\ncase class Person(\n  @JsonbProperty name: String,\n\
  \  @JsonbProperty age: Int\n)\n```\n\n在 Scala 中，你可以在类、方法、字段、局部变量、参数和类型参数之前放置注解。Java\
  \ 注解不影响编译器；它们只是向字节码添加数据。在 Scala 中，注解可以影响编译。例如，`@main` 注解会生成 `public static void\
  \ main(String[] args)` 方法。\n\n\n\n大多数注解参数都有默认值。例如，`@JsonbProperty` 注解的 `nillable`\
  \ 参数默认值为 `false`，而 `value` 属性的默认值是 `\"\"`。\n\n当你只提供名为 `value` 的参数时，`value=` 是可选的。例如：\n\
  \n点击此处查看代码图片\n\n```\n@JsonbProperty(\"p_age\") var age : Int = 0\n  // The value\
  \ argument is \"p_age\"\n```\n\n如果注解没有参数，可以省略括号：\n\n点击此处查看代码图片\n\n```\n@JsonbTransient\
  \ val nice: Boolean = true\n```\n\nJava 注解的参数被限制在以下类型：\n\n*   数值或布尔字面量\n*   字符串\n\
  *   类字面量\n*   Java 枚举\n*   其他注解\n*   上述这些的数组（但不是数组的数组）\n\nScala 注解的参数可以是任意类型。\n\n\
  ## 15.4 针对 Java 特性的注解\n\nScala 库提供了与 Java 互操作的注解。它们在以下章节中介绍。\n\n#### 15.4.1 Bean\
  \ 属性\n\n当你在类中声明公共字段时，Scala 会提供一个 getter 方法和（对于 `var`）一个 setter 方法。然而，这些方法的名称并不是\
  \ Java 工具所期望的。JavaBeans 规范([www.oracle.com/technetwork/articles/javaee/spec-136004.html](http://www.oracle.com/technetwork/articles/javaee/spec-136004.html)）将\
  \ Java 属性定义为一对 `getFoo`/`setFoo` 方法（或对于只读属性只需一个 `getFoo` 方法）。许多 Java 工具依赖于这种命名约定。\n\
  \n当你用 `@BeanProperty` 注解一个 Scala 字段时，就会自动生成此类方法。例如：\n\n点击此处查看代码图片\n\n```\nimport\
  \ scala.beans.BeanProperty\n\nclass Person :\n  @BeanProperty var name = \"\"\n\
  ```\n\n会生成四个方法：\n\n1. `name: String`\n2. `name_=(newValue: String): Unit`\n3. `getName():\
  \ String`\n4. `setName(newValue: String): Unit`\n\n然而，`getName` 和 `setName` 方法仅是为了\
  \ Java 的便利。Scala 编译器会拒绝调用它们。在 Scala 中，直接读写 `name` 属性即可。\n\n`@BooleanBeanProperty`\
  \ 注解会为 Boolean 方法生成一个带有 `is` 前缀的 getter。\n\n![Images](img/note.jpg) 注意\n\n如果你将一个字段定义为主构造函数参数，并且想要\
  \ JavaBeans getter 和 setter，可以这样注解构造函数参数：\n\n点击此处查看代码图片\n\n```\nclass Person(@BeanProperty\
  \ var name: String)\n```\n\n#### 15.4.2 序列化\n\n对于可序列化的类，你可以使用 `@SerialVersionUID`\
  \ 注解来指定序列版本：\n\n点击此处查看代码图片\n\n```\n@SerialVersionUID(6157032470129070425L)\nclass\
  \ Employee extends Person, Serializable :\n```\n\n`@transient` 注解将字段标记为瞬态：\n\n点击此处查看代码图片\n\
  \n```\n@transient var lastLogin: ZonedDateTime = null\n  // Becomes a transient\
  \ field in the JVM\n```\n\n瞬态字段不会被序列化。\n\n![Images](img/note.jpg) 注意\n\n关于 volatile\
  \ 字段或序列化等 Java 概念更多信息，请参见 C. Horstmann 的 *Core Java, Twelfth Edition* (Prentice\
  \ Hall, 2022)。\n\n#### 15.4.3 检异常\n\n与 Scala 不同，Java 编译器会跟踪检异常。如果你从 Java 代码调用 Scala\
  \ 方法，其方法签名应该包含可能抛出的检异常。使用 `@throws` 注解来生成正确的签名。例如：\n\n点击此处查看代码图片\n\n```\n@throws(classOf[IOException])\
  \ def save(filename: String) = ...\n```\n\nJava 签名如下：\n\n点击此处查看代码图片\n\n```\nvoid\
  \ save(String filename) throws IOException\n```\n\n如果没有 `@throws` 注解，Java 代码将无法捕获异常。\n\
  \n点击此处查看代码图片\n\n```\ntry { // This is Java\n  fred.save(\"/etc/fred.ser\");\n} catch\
  \ (IOException ex) {\n  System.out.println(\"Error saving: \" + ex.getMessage());\n\
  }\n```\n\nJava 编译器需要知道 `save` 方法可能会抛出 `IOException`，否则它将拒绝捕获。\n\n#### 15.4.4 变长参数\n\
  \n`@varargs` 注解允许从 Java 调用 Scala 变长参数方法。默认情况下，如果你提供这样的方法：\n\n点击此处查看代码图片\n\n```\n\
  def process(args: Any*) = ...\n```\n\nScala 编译器会将 `args` 参数转换为数组：\n\n点击此处查看代码图片\n\
  \n```\ndef process(args: Array[Any]) = ...\n```\n\n如果你添加 `@varargs`，其签名如下：\n\n点击此处查看代码图片\n\
  \n```\n@varargs def process(args: Any*)\n\n#### 15.4.5 修饰符\n\nScala 使用注解代替关键字来实现某些不常用的\
  \ Java 特性。\n\n`@volatile` 注解将字段标记为 volatile：\n\n点击此处查看代码图片\n\n```\n@volatile var\
  \ done: Boolean = false\n```\n\n`@native` 注解标记用 C 实现的方法：\n\n点击此处查看代码图片\n\n```\n\
  @native def method()\n```\n\n## 15.5 优化注解\n\nScala 库中的几个注解允许你控制编译器优化。它们将在后续章节中讨论。\n\
  \n#### 15.5.1 尾递归\n\n递归调用有时可以转换为循环，从而节省栈空间。这在经常编写递归方法的函数式编程中非常重要。\n\n考虑这个使用递归计算序列和的方法：\n\
  \n```\nobject Util :\n  def sum(xs: Seq[Int]): BigInt =\n    if xs.isEmpty then\
  \ BigInt(0) else xs.head + sum(xs.tail)\n  ...\n```\n\n该方法无法优化，因为计算的最后一步是加法而不是递归调用。但一个小小的变换是可以优化的：\n\
  \n```scala\ndef sum2(xs: Seq[Int], partial: BigInt): BigInt =\n  if xs.isEmpty then\
  \ partial else sum2(xs.tail, xs.head + partial)\n```\n\n部分和作为参数传递；调用此方法的方式 `sum2(xs,\
  \ 0)`。由于最后一步是对相同方法的递归调用，它可以转换为方法头部循环。Scala 编译器会自动对第二个方法应用“尾递归”优化。如果你尝试\n\n```\n\
  Util.sum(1 to 1000000)\n```\n\n你会得到栈溢出错误（至少在 JVM 默认栈大小时），但\n\n```\nUtil.sum2(1 to\
  \ 1000000, 0)\n```\n\n会返回和 `500000500000`。\n\n尽管 Scala 编译器会尝试使用尾递归优化，但有时会因为非明显的原因被阻止。如果你依赖编译器移除递归，你应该为方法添加\
  \ `@tailrec` 注解。这样，如果编译器无法应用优化，它将报告错误。\n\n例如，假设方法在类中而不是对象中：\n\n```\nclass Util :\n\
  \  @tailrec def sum3(xs: Seq[Int], partial: BigInt): BigInt =\n    if xs.isEmpty\
  \ then partial else sum3(xs.tail, xs.head + partial)\n  ...\n```\n\n\n\n现在程序运行失败并显示错误信息`\"\
  could not optimize @tailrec annotated method sum2: it is neither private nor final\
  \ so can be overridden\"`。在这种情况下，你可以将方法移动到对象中，或者将其声明为 `private` 或 `final`。\n\n![Images](img/note.jpg)\
  \ 备注\n\n一种更通用的递归消除机制是“蹦床（trampolining）”。蹦床的实现是运行一个不断调用函数的循环。每个函数都返回下一个要调用的函数。尾递归是一种特殊情况，其中每个函数都返回自身。这种更通用的机制允许互调用——参见接文的示例。\n\
  \nScala 有一个名为 `TailCalls` 的工具对象，它可以轻松地实现蹦床。互递归函数的返回类型为 `TailRec[A]`，并返回 `done(result)`\
  \ 或 `tailcall(expr)`，其中 `expr` 是下一个要评估的表达式。该表达式返回一个 `TailRec[A]`。这是一个简单的示例：\n\n\
  点击此处查看代码图片\n\n```\nimport scala.util.control.TailCalls.*\ndef evenLength(xs: Seq[Int]):\
  \ TailRec[Boolean] =\n  if xs.isEmpty then done(true) else tailcall(oddLength(xs.tail))\n\
  def oddLength(xs: Seq[Int]): TailRec[Boolean] =\n  if xs.isEmpty then done(false)\
  \ else tailcall(evenLength(xs.tail))\n```\n\n要从 `TailRec` 对象获取最终结果，请使用 `result`\
  \ 方法：\n\n点击此处查看代码图片\n\n```\nevenLength(1 to 1000000).result\n```\n\n#### 15.5.2\
  \ 惰性值\n\n惰值在第一次被访问时初始化：\n\n点击此处查看代码图片\n\n```\nlazy val words =\n  scala.io.Source.fromFile(\"\
  /usr/share/dict/words\").mkString.split(\"\\n\")\n```\n\n如果你从未使用过 `words`，文件根本不会被读取。如果你多次使用，文件只会在第一次使用时被读取。\n\
  \n由于第一次使用可能在多个线程中并发发生，因此对 `lazy val` 的每次访问都会调用一个获取锁的方法。\n\n如果你知道永远不会有并发访问，可以使用 `@threadUnsafe`\
  \ 注解来避免锁定：\n\n点击此处查看代码图片\n\n```\n@threadUnsafe lazy val words =\n  scala.io.Source.fromFile(\"\
  /usr/share/dict/words\").mkString.split(\"\\n\")\n```\n\n## 15.6 针对错误和警告的注解\n\n\
  如果你用 `@deprecated` 注解标记一个特性，编译器会在每次使用该特性时都会生成一个警告。该注解有两个可选参数：`message` 和 `since`。\n\
  \n点击此处查看代码图片\n\n```\n@deprecated(message = \"Use factorial(n: BigInt) instead\"\
  )\ndef factorial(n: Int): Int = ...\n```\n\n`@deprecatedName` 应用于参数，并指定该参数以前的名称。\n\
  \n点击此处查看代码图片\n\n```\ndef display(message: String, @deprecatedName(\"sz\") size:\
  \ Int,\n  font: String = \"Sans\") = ...\n```\n\n你仍然可以调用 `draw(sz = 12)`，但你会收到弃用警告。\n\
  \n`@deprecatedInheritance` 和 `@deprecatedOverriding` 注解会生成警告，表示继承类或覆盖方法现在已弃用。\n\n\
  某些 Scala 特性被认为是实验性的。要访问它们，你需要通过 `@experimental` 注解进入“实验性范围”：\n\n点击此处查看代码图片\n\n```\n\
  @experimental @newMain def main(name: String, age: Int) =\n  println(s\"Hello $name,\
  \ next year you’ll be ${age + 1}\")\n```\n\n`@unchecked` 注解会抑制匹配不完全的警告。例如，假设我们知道一个列表永远不会为空：\n\
  \n```\n(lst: @unchecked) match\n  case head :: tail => ...\n```\n\n编译器不会由于缺少 `Nil`\
  \ 情况而抱怨。当然，如果 `lst` 是 `Nil`，则会在运行时抛出异常。\n\n`@uncheckedVariance` 注解会抑制变性错误信息。例如，`java.util.Comparator`\
  \ 逆变是有意义的。如果 `Student` 是 `Person` 的子类型，那么在需要 `Comparator[Student]` 的地方可以使用 `Comparator[Person]`。然而，Java\
  \ 泛型没有变性。我们可以用 `@uncheckedVariance` 注解修复这个问题：\n\n点击此处查看代码图片\n\n```\ntrait Comparator[-T]\
  \ extends\n  java.util.Comparator[T @uncheckedVariance]\n```\n\n最后，你可以用 `@nowarn`\
  \ 注解选择性地隐藏警告。例如，Java `Thread` 类的 `stop` 方法已弃用。当你调用时：\n\n```\nmyThread.stop()\n```\n\
  \n编译器会生成一个弃用警告。你可以这样关闭它：\n\n```\nmyThread.stop() @nowarn\n```\n\n或\n\n点击此处查看代码图片\n\
  \n```\nmyThread.stop() @nowarn\n```\n\n## 15.7 注解\n\n我不认为本书的读者会有冲动来实现自己的 Scala 注解。注解必须扩展\
  \ `Annotation` 特性。例如，`unchecked` 注解定义为：\n\n```\nfinal class unchecked extends scala.Annotation\n\
  ```\n\n扩展 `StaticAnnotation` 的注解保留在类文件中：\n\n点击此处查看代码图片\n\n```\nclass deprecatedName(name:\
  \ String, since: String) extends StaticAnnotation\n```\n\n`ConstantAnnotation` 只能通过数字、布尔值、字符串、枚举、类字面量及其数组构造。这是一个示例：\n\
  \n点击此处查看代码图片\n\n```\nclass SerialVersionUID(value: Long) extends ConstantAnnotation\n\
  ```\n![Images](img/caution) 注意\n\nScala 在类文件中放置注解格式与 Java 注解不同，无法被 Java 虚拟机读取。如果你想实现新的\
  \ Java 注解，需要在 Java 中编写。\n\n通常，注解属于它所应用的表达式、变量、字段、方法、类或类型。例如，注解\n\n```\n\n应用于一个元素：\n\
  \n```\ndef display(@nowarn message: String) = \"\"\n```\n\n```仅应用于参数变量 `message`。\n\
  \n然而，Scala 中的字段定义可以在 Java 中产生多个特性，所有这些特性都可能被注解。例如，考虑\n\n点击此处查看代码图片\n\n```\nclass\
  \ Person(@JsonbProperty @BeanProperty var name: String)\n```\n\n在这里，有六个项目可以作为 `@JsonbProperty`\
  \ 注解的目标：\n\n*   构造函数参数\n*   私有实例字段\n*   访问方法 `name`\n*   修改方法 `name_=`\n*   Bean\
  \ 访问 `getName`\n*   Bean 修改 `setName`\n\n默认情况下，构造函数参数注解仅应用于参数本身，字段注解仅应用于字段。元注解 `@param`、`@field`、`@getter`、`@setter`、`@beanGetter`\
  \ 和 `@beanSetter` 会导致注解附加到其他处。例如，`@deprecated` 注解定义为：\n\n```\n@getter @setter @beanGetter\
  \ @beanSetter\nclass deprecated(message: String = \"\", since: String = \"\")\n\
  \  extends ConstantAnnotation\n```\n\n\n\n你也可以以即时的方式应用这些注解：\n\n点击此处查看代码图片\n\n```\n\
  @(JsonbProperty @beanGetter @beanSetter) @BeanProperty var name: String = null\n\
  ```\n\n在这种情况下，`@JsonbProperty` 注解被应用于 Java 的 `getName` 方法上。\n\n## 练习题\n\n1. 使用 Java\
  \ JUnit 库在 Scala 中编写一个带有测试用例的类。使用 `@Test` 注解以及你选择的其他几个注解。\n2. 编写一个示例类，展示注解的所有可能位置。使用\
  \ `@deprecated` 作为你的示例注解。\n3. Scala 库中哪些注解使用了元注解 `@param`、`@field`、`@getter`、`@setter`、`@beanGetter`\
  \ 或 `@beanSetter`？\n4. 编写一个接收可变整数参数并返回其和的 Scala 方法 `sum`。从 Java 中调用它。\n5. 编写一个 Scala\
  \ 方法返回包含文件所有行的字符串。从 Java 中调用它。\n6. 编写一个带有 `volatile` `Boolean` 字段的 Scala 对象。让一个线程睡眠一段时间，然后将字段设置为\
  \ `true`，打印消息并退出。另一个线程将持续检查该字段是否为 `true`。如果是，则打印消息并退出；如果不是，则睡眠一小会儿并重试。如果变量不是 `volatile`\
  \ 的会发生什么？\n7. 创建一个类 `Student`，具有读写 JavaBeans 属性 `name`（类型为 `String`）和 `id`（类型为 `Long`）。生成了哪些方法？（使用\
  \ `javap` 进行检查。）可以在 Scala 中调用 JavaBeans 的 getters 和 setters 吗？应该这样做吗？\n8. 考虑这些递归函数，它们反复将一个函数应用于初始值，直到找到固定点（即满足\
  \ `f(x) == x` 的值 `x`）。\n\n点击此处查看代码图片\n\n```scala\ndef fix(f: Double => Double)(x:\
  \ Double): Double =\n  val y = f(x)\n  if x == y then x\n  else fix(f)(y)\n\ndef\
  \ fixpath(f: Double => Double)(x: Double): List[Double] =\n  val y = f(x)\n  if\
  \ x == y then List()\n  else y :: fixpath(f)(y)\n```\n\n第一个函数产生固定点，第二个函数产生所有中间值的序列。例如，尝试：\n\
  \n```\nfix(Math.cos)(0)\nfixpath(Math.cos)(0)\n```\n\n哪一个是是尾递归的？如果不是，你能提供一个尾递归的实现吗？\n\
  \n9. 给出一个示例，说明当方法可以被重写时，尾递归优化是无效。\n10. 尝试在你的 Scala 版本中寻找一个实验性特性，并使用 `@experimental`\
  \ 注解使用它。\n11. 在 Scala 3.2 中，`@newMain` 实验性功能大幅改进了其前辈 `@main` 的命令行解析。也许当你读到这里时它已经不再是实验性的了，希望它有一个更好的名字。使用它来编写一个类似\
  \ `grep` 的应用程序，该程序在命令行接受用于搜索的正则表达式、文件名以及大小敏感和反转匹配的标志（即只打印不匹配的行）。\n12. 尝试 `@nowarn`\
  \ 注解和过滤器语法。编写一些会产生警告的代码，然后使用 `@nowarn` 和适当的过滤器关闭它们。如果你向一个不产生警告的表达式添加 `@nowarn` 并使用\
  \ `-Wunused:nowarn` 标志，会发生什么？你可以用另一个 `@nowarn` 关闭那个警告吗？\n\n你可以将 `@nowarn` 应用于表达式以外的内容上吗？\n\
  \n## 第 16 章.Futures\n\n**本章主题：A2**\n\n* 16.1 在 Future 中运行任务\n* 16.2 等待结果\n* 16.3\
  \ `Try` 类\n* 16.4 回调\n* 16.5 组合 Future 任务\n* 16.6 其他 `Future` 变换\n* 16.7 `Future`\
  \ 对象中的方法\n* 16.8 Promises\n* 16.9 Execution Contexts\n* 练习题\n\n编写工作正常且高性能的并发应用程序是极具挑战性的。传统方法中并发任务具有修改共享数据的副作用，这种方法是枯燥且容易出错的。Scala\
  \ 鼓励你以函数的方式思考计算。计算产生一个值，通常在未来的某个时候。只要计算没有副作用，你就可以让它们并发运行并在结果可用时组合它们。在本章中，你将看到如何使用\
  \ `Future` 和 `Promise` 特性来组织此类计算。\n\n本章的要点是：\n\n* 封装在 `Future { ... }` 中的代码块会并发执行。\n\
  * 一个 future 会成功或失败。\n* 你可以等待 future 完成。\n* 使用诸如 `map`、`flatMap` 等方法来组合 future。\n\
  * 一个 promise 设置后会有值。\n* 选择适合工作负载的执行上下文（Execution Context）。\n\n### 16.1 在 Future\
  \ 中运行任务\n\n封装在 `Future { ... }` 中的代码块会并发执行。`Future` 对象可以在“未来”执行代码。\n\n点击此处查看代码图片\n\
  \n```scala\nimport java.time.*\nimport scala.concurrent.*\ngiven ExecutionContext\
  \ = ExecutionContext.global\n\nFuture {\n  Thread.sleep(10000)\n  println(s\"This\
  \ is the future at ${LocalTime.now()}\")\n}\nprintln(s\"This is present at ${LocalTime.now()}\"\
  )\n```\n\n在 REPL 中运行这段代码，会出现类似下面的行：\n\n点击此处查看代码图片\n\n```\nThis is present at 13:01\n\
  ```\n\n十秒后，出现了第二行：\n\n点击此处查看代码图片\n\n```\nThis is the future at 13:01:29\n```\n\n\
  每个 `Future` 必须通过 `ExecutionContext` 的引用来构造。最简单的方法是使用此语句（参见第 19 章）：\n\n点击此处查看代码图片\n\
  \n```scala\ngiven ExecutionContext = ExecutionContext.global\n```\n\n全局执行上下文在守护线程上运行。Java\
  \ 虚拟机在只有守护线程运行时会终止。在演示代码中，简单地在 `main` 方法末尾添加 `Thread.sleep` 以保持程序运行，直到所有任务完成。\n\n\
  ![Images](img/caution.jpg) 注意\n\n全局执行上下文对于演示是可以的，但在实际程序中，如果你的任务是阻塞的，你应该选择其他方案。参见\
  \ 16.9 节 “执行上下文”，第 258 页 获取更多信息。\n\n当你构造多个 future 时，它们可以并发执行。例如，尝试运行：\n\n点击此处查看代码图片\n\
  \n```scala\nFuture { for i <- 1 to 100 do { print(\"A\"); Thread.sleep(10) } }\n\
  Future { for i <- 1 to 100 do { print(\"B\"); Thread.sleep(10) } }\n```\n\n你会得到类似下面的输出：\n\
  \n点击此处查看代码图片\n\n```\nABABABABABABABABABABABA...AABABABABABABBBBBBBBBBBBBBB\n```\n\
  \n一个 future 可以（且通常）有一个结果：\n\n```scala\nval f = Future {\n  Thread.sleep(10000)\n\
  \  42\n}\n```\n\n当你在定义后立即在 REPL 中评估 `f`，你会得到这个输出：\n\n\n\n\n\n点击此处查看代码图片\n\n```\n\
  res12: scala.concurrent.Future[Int] = Future(<not completed>)\n```\n\n等待十秒并再次评估\
  \ `f`：\n\n点击此处查看代码图片\n\n```\nres13: scala.concurrent.Future[Int] = Future(Success(42))\n\
  ```\n\n或者，未来可能会发生糟糕的情况：\n\n点击此处查看代码图片\n\n```scala\nval f2 = Future {\n  if LocalTime.now.getMinute\
  \ != 42 then\n    throw Exception(\"not a good time\")\n  42\n}\n```\n\n除非分钟数恰好是\
  \ 42，否则任务将因异常终止。在 REPL 中，你将看到\n\n点击此处查看代码图片\n\n```\nres14: scala.concurrent.Future[Int]\
  \ =\n  Future(Failure(java.lang.Exception: not a good time))\n```\n\n现在你知道 `Future`\
  \ 是什么了。它是一个在未来某个时刻给你提供结果（或失败）的对象。在下一节中，你将看到获取 `Future` 结果的一种。\n\n![Images](img/caution.jpg)\
  \ 注意\n\n不要字面地理解 `Future(Success(42))` 和 `Future(Failure(...))` 输出。这些只是 `toString`\
  \ 方法对已完成 future 的格式化。如果你在 REPL 中输入 `Future(Success(42)`，你会得到一个 `Future[Success[Int]]`\
  \ 实例，它在完成后会被打印为 `Future(Success(Success(42)))`。\n\n![Images](img/note.jpg) 注意\n\n\
  `java.util.concurrent` 包包含一个 `Future` 接口，它的功能比 Scala 的 `Future` 特性要限得多。Scala 的 future\
  \ 等同于 Java 中的 `CompletionStage` 接口。\n\n![Images](img/tip.jpg) 提示\n\nScala 语言对你在并发任务中可以的操作没有限制。然而，你应该避免带有副作用的计算。最好的方法是不去增加共享计数器——即使是原子计数器。不要填充共享\
  \ map——即使是线程安全的。相反，让每个 future 计算一个值。然后在所有贡献结果的 future 完成后，你可以将这些计算出的值结合起来。这样，每个值在同一时间只被一个任务所有，并且很容易推断计算的正确性。\n\
  \n## 16.2 等待结果\n\n当你有一个 `Future` 时，可以使用 `isCompleted` 方法检查它是否已完成。但当然，你并不不想在循环中等待完成。\n\
  \n你可以通过一个阻塞调用来等待结果。\n\n点击此处查看代码图片\n\n```scala\nimport scala.concurrent.duration.*\n\
  val f = Future { Thread.sleep(10000); 42 }\nval result = Await.result(f, 10.seconds)\n\
  ```\n\n对 `Await.result` 的调用会阻塞十秒，然后产出 future 的结果。\n\n`Await.result` 方法的第二个参数类型为\
  \ `Duration`。导入 `scala.concurrent.duration.*` 可以启用从整数到 `Duration` 对象的转换方法，称为 `seconds`、`millis`\
  \ 等。\n\n如果任务在规定的时间内未就绪，`Await.ready` 方法将抛出 `TimeoutException`。\n\n如果任务抛出异常，该异常会在\
  \ `Await.result` 调用中重新抛出。为了避免异常，你可以调用 `Await.ready` 然后获取结果。\n\n点击此处查看代码图片\n\n```scala\n\
  val f2 = Future {\n  Thread.sleep((10000 * scala.math.random()).toLong)\n  if scala.math.random()\
  \ < 0.5 then throw Exception(\"Not your lucky day\")\n  42\n}\nval result2 = Await.ready(f,\
  \ 5.seconds).value\n```\n\n`Await.ready` 方法产生其第一个参数，而 `Future` 类的 `value` 方法返回一个\
  \ `Option[Try[T]]`。当 future 未完成时它为 `None`，当完成时则为 `Some(t)`。在这里，`t` 是 `Try` 类的对象，它持有结果或导致任务失败的异常。你将在下一节中看到如何查看其内部内容。\n\
  \n![Images](img/note.jpg) 注意\n\n在实践中，你不会频繁使用 `Await.result` 或 `Await.ready` 方法。当任务耗时很长且你的程序可以做比等待结果更有用的事情时，你会并发运行任务。第\
  \ 16.4 节，“回调](#ch16.xhtml_sec16_4)”位于第 250 页，向你展示如何在不阻塞的情况下获取结果。\n\n![Images](img/caution.jpg)\
