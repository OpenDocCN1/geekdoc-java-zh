  \n# 第 9 章：文件与正则表达式\n\n**本章主题 A1**\n\n* 9.1 读取行\n* 9.2 读取字符\n* 9.3 读取标记和数字\n* 9.4\
  \ 从 URL 及其他源读取\n* 9.5 写文件\n* 9.6 访问目录\n* 9.7 序列化\n* 9.8 进程控制 A2\n* 9.9 正则表达式\n*\
  \ 9.10 正则表达式组\n* 练习题\n\n本章中断了对 Scala 语言的介绍，提供一些 Scala 库。你将学习如何执行常见的文件处理任务，例如从文件中读取所有行或单词，以及如何使用正则表达式。\n\
  \n这段插曲对于你根据目前的 Scala 知识开展的项目提供了有用信息。当然，如果你愿意，可以跳过本章直到你需要它，再继续学习关于 Scala 语言的更多信息。\n\
  \n章节亮点：\n\n* `Source.fromFile(...).getLines.toArray` 生成文件的所有行。\n* `Source.fromFile(...).mkString`\
  \ 将文件内容生成字符串。\n* 要将字符串转换为数字，使用 `toInt` 或 `toDouble` 方法。\n* 使用 Java 的 `PrintWriter`\
  \ 写入文本文件。\n* `\"regex\".r` 是一个 `Regex` 对象。\n* 如果你的正则表达式包含反斜杠或引号，请使用 `\"\"\"...\"\
  \"\"`。\n* 如果正则表达式模式具有组，你可以使用语法 `for regex(`var[1]`, ..., `var[n]`) <- string` 来提取它们的内容。\n\
  \n## 9.1 读取行\n\n要从文件中读取所有行，请在 `scala.io.Source` 对象上调用 `getLines` 方法：\n\n点击此处查看代码图像\n\
  \n```\nimport scala.io.Source\nval filename = \"/usr/share/dict/words\"\nvar source\
  \ = Source.fromFile(filename, \"UTF-8\")\n  // 如果你知道文件使用的是默认平台编码，\n  // 你可以省略编码\n\
  var lineIterator = source.getLines\n```\n\n结果是一个迭代器（参见第 13 章）。你可以用它逐行处理行：\n\n```\n\
  for l <- lineIterator do\n  process(l)\n```\n\n或者你可以通过对迭代器应用 `toArray` 或 `toBuffer`\
  \ 方法，将行放入数组或数组缓冲区：\n\n点击此处查看代码图像\n\n```\nval lines = source.getLines.toArray\n```\n\
  \n有时，你只想将整个文件读取到字符串中。那更简单：\n\n点击此处查看代码图像\n\n```\nvar contents = source.mkString\n\
  ```\n\n![图像](img/caution.jpg) 注意\n\n完成 `Source` 对象的使用后，请调用 `close`。\n\n在创建 `Source`\
  \ 类时，Java 的文件处理 API 非常有限。Java 已经跟上了进度，你可能想要使用 `java.nio.file.Files` 类而不是它：\n\n点击此处查看代码图像\n\
  \n```\nimport java.nio.file.Files\nimport java.nio.charset.StandardCharsets\nimport\
  \ scala.jdk.CollectionConverters.*\n\nval lineIterator = Files.lines(Path.of(filename),\
  \ StandardCharsets.UTF_8).toScala\n```\n\n## 9.2 读取字符\n\n要从文件中读取单个字符，可以使用 `Source`\
  \ 对象：\n\n```scala\nfor c <- source do\n  process(c)\n```\n\n如果你想在不消耗它的情况下查看下一个字符，使用\
  \ `peek` 方法：\n\n```\nval c = source.peek\n```\n\n要读取特定数量的字符，使用 `read` 方法：\n\n```\n\
  val s = source.read(5)\n```\n\n## 9.3 读取标记和数字\n\n这里有一种快速读取所有由空格分隔的标记的方法：\n\n```\n\
  val tokens = source.mkString.split(\"\\\\s+\")\n```\n\n如果你有一个包含浮点数的文件，可以将它们全部读取到数组中：\n\
  \n```\nval numbers = for w <- tokens yield w.toDouble\n```\n\n对于包含混合文本和数字的文件，可以使用\
  \ `java.util.Scanner`：\n\n```\nval sc = new Scanner(source)\nwhile (sc.hasNext)\n\
  \  val n = sc.nextInt()\n```\n\n最后，注意 `scala.io.StdIn` 可以从标准输入读取数字：\n\n```\nprint(\"\
  你多大了？\")\nval age = StdIn.readInt()\n// 或者使用 readDouble 或 readLong\n```\n\n## 9.4\
  \ 从 URL 及其他源读取\n\n`Source` 对象具有从文件其他源读取的方法：\n\n```\nval source1 = Source.fromURL(\"\
  https://horstmann.com/index.html\", \"UTF-8\")\nval source2 = Source.fromString(\"\
  Hello, World!\")\n  // 调试非常用\nval source3 = Source.stdin\n  // 从标准输入\n```\n\n![图像](img/caution.jpg)\
  \ 注意\n\n当你从 URL 读取时，你需要提前知道字符集，可以通过 HTTP 头或内容的前 1024 字节获取。更多信息请参见 [`www.w3.org/International/questions/qa-html-encoding-declarations`](http://www.w3.org/International/questions/qa-html-encoding-declarations)。\n\
  \nScala 没有读取二进制文件的规定。你需要使用 Java 库。以下是将文件读取到字节数组的方法：\n\n```\nval bytes = Files.readAllBytes(Path.of(filename));\
  \ // 一个 Array[Byte]\n```\n\n## 9.5 写文件\n\nScala 没有内置写文件的支持。要写入文本文件，请使用 `java.io.PrintWriter`，例如：\n\
  \n```\nval out = PrintWriter(filename)\nfor i <- 1 to 100 do out.println(i)\n```\n\
  \n\n\n\n你也可以编写格式化输出：\n\n点击此处查看代码图像\n\n```scala\nval quantity = 10\nval price = 29.95\n\
  out.printf(\"%6d %10.2f%n\", quantity, price)\n```\n\n记得关闭写入器：\n\n```scala\nout.close()\n\
  ```\n\n## 9.6 访问目录\n\nScala 并没有“官方”类用于访问目录中的所有文件，或用于递归遍历目录。\n\n最简单的方法是使用 `java.nio.file`\
  \ 包中的 `Files.list` 和 `Files.walk` 方法。`list` 方法仅访问目录的子级，而 `walk` 方法访问所有后代节点。这些方法产生\
  \ `Path` 对象的 Java 流。你可以按照如下方式访问它们：\n\n点击此处查看代码图像\n\n```scala\nimport java.nio.file.*\n\
  import scala.jdk.StreamConverters.*\nval dirname = \"/home\"\nval entries = Files.list(Paths.get(dirname))\
  \ // or Files.walk\ntry\n  for p <- entries.toScala(Iterator) do\n    process(p)\n\
  finally\n  entries.close()\n```\n\n## 9.7 序列化\n\n在 Java 中，序列化用于将对象传输到其他虚拟机或进行短期存储。（对于长期存储，序列化可能会很笨拙——随着类随时间的演进，处理不同的对象版本会非常琐碎。）\n\
  \n以下是在 Java 和 Scala 中声明可序列化类的方法。\n\nJava:\n\n点击此处查看代码图像\n\n```java\npublic class\
  \ Person implements java.io.Serializable { // 这是 Java\n  private static final long\
  \ serialVersionUID = 42L;\n  private String name;\n  ...\n}\n```\n\nScala:\n\n点击此处查看代码图像\n\
  \n```scala\n@SerialVersionUID(42L) class Person(val name: String) extends Serializable\n\
  ```\n\n`Serializable` 特性定义在 `scala` 包中，不需要导入。\n\n![Images](img/note.jpg) Note\n\n\
  如果你接受默认 ID，可以省略 `@SerialVersionUID` 注解。\n\n按照通常的方式序列化和反序列化对象：\n\n点击此处查看代码图像\n\n\
  ```scala\nval fred = Person(\"Fred\")\nval out = ObjectOutputStream(FileOutputStream(\"\
  /tmp/test.ser\"))\nout.writeObject(fred)\nout.close()\nval in = ObjectInputStream(FileInputStream(\"\
  /tmp/test.ser\"))\nval savedFred = in.readObject().asInstanceOf[Person]\n```\n\n\
  Scala 集合是序列化的，因此你可以将它们作为可序列化类的成员：\n\n点击此处查看代码图像\n\n```scala\nclass Person extends\
  \ Serializable :\n  private val friends = ArrayBuffer[Person]() // OK—ArrayBuffer\
  \ 是可序列化的\n  ...\n```\n\n## 9.8 进程控制 A2\n\n传统上，程序员使用 shell 脚本来执行日常处理任务，例如将文件从一个地方移动到另一个地方，或合并一组文件。shell\
  \ 语言很容易指定文件的子集，并将一个程序的输出通过管道传递到另一个程序的输入。然而，作为编程语言，大多数 shell 语言并不如人意。\n\nScala 的设计目标是从谦微的脚本任务扩展到大型程序。`scala.sys.process`\
  \ 包提供了与 shell 程序交互的实用程序。你可以用 Scala 编写 shell 脚本，并利用 Scala 语言为你提供的所有功能。\n\n这是一个简单的示例：\n\
  \n```scala\nimport scala.sys.process.*\n\"ls -al ..\".!\n```\n\n结果是执行了 `ls -al ..`\
  \ 命令，显示了父目录中的所有文件。结果打印到标准输出。\n\n`scala.sys.process` 包包含从字符串到 `ProcessBuilder` 对象的隐式转换。`!`\
  \ 方法执行 `ProcessBuilder` 对象。\n\n`!` 方法的结果是被执行程序的退出代码：如果程序执行成功，则为 `0`；否则返回一个非零的失败指示。\n\
  \n如果你使用 `!!` 代替 `!`，输出将以字符串形式返回：\n\n```scala\nval result = \"ls -al /\".!!\n```\n\
  \n![Images](img/note.jpg) Note\n\n`!` 和 `!!` 操作符最初的设计目的是为了作为不带方法调用语法的后置运算符：\n\n\
  ```scala\n\"ls -al /\" !!\n```\n\n然而，正如你在第 11 章 中看到的，后置语法正在被废弃，因为它可能导致解析错误。\n\n\
  你可以使用 `#|` 方法将一个程序的输出管道到另一个程序的输入：\n\n```scala\n(\"ls -al /\" #| \"grep u\").!\n\
  ```\n\n![Images](img/note.jpg) Note\n\n你可以看到，进程库使用了底层操作系统的命令。在这里，我使用了 `bash` 命令，因为\
  \ `bash` 在 Linux、Mac OS X 和 Windows 上都是用的。\n\n要将输出重定向到文件，使用 `#>` 方法：\n\n点击此处查看代码图像\n\
  \n```scala\n(\"ls -al /\" #> File(\"/tmp/filelist\"))\n```\n\n将输出重定向到文件，使用 `#>`\
  \ 方法：\n\n```scala\n(\"ls -al /\" #> File(\"/tmp/filelist\"))\n```\n\n将输出重定向到文件，使用\
  \ `#>` 方法：\n\n```scala\n(\"ls -al /\" #> File(\"/tmp/filelist\"))\n```\n\n## 9.6\
  \ 访问目录\n\n最简单的方法是使用 `java.nio.file` 包中的 `Files.list` 和 `Files.walk` 方法。`list` 方法仅访问目录的子级，而\
  \ `walk` 方法访问所有后代节点。这些方法产生 `Path` 对象的 Java 流。你可以按照如下方式访问它们：\n\n点击此处查看代码图像\n\n```scala\n\
  import java.nio.file.*\nimport scala.jdk.StreamConverters.*\nval dirname = \"/home\"\
  \nval entries = Files.list(Paths.get(dirname)) // or Files.walk\ntry\n  for p <-\
  \ entries.toScala(Iterator) do\n    process(p)\nfinally\n  entries.close()\n```\n\
