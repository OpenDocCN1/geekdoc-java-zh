  \n\n\n\n\n更好的方法是将 `Future`（未来任务）看作是可以组合的实体，类似于函数。你通过调用第一个函数，然后将其结果传递给第二个函数来组合两个函数。在接下来的章节中，你将看到如何对\
  \ `Future` 执行同样的操作。\n\n## 16.5 组合 Future 任务 (Composing Future Tasks)\n\n假设我们需要从两个\
  \ Web 服务获取某些信息，然后将这两个者结合起来。每个任务都是耗时运行的，并且应该在 `Future` 中执行。可以通过回调（callbacks）将它们连接在一起：\n\
  \n点击此处查看代码图片\n\n```scala\nval future1 = Future { getData1() }\nval future2 = Future\
  \ { getData2() }\n\nfuture1 onComplete {\n  case Success(n1) =>\n    future2 onComplete\
  \ {\n      case Success(n2) => {\n        val n = n1 + n2\n        println(s\"Sum:\
  \ $n\")\n      }\n      case Failure(ex) => ex.printStackTrace()\n    }\n  case\
  \ Failure(ex) => ex.printStackTrace()\n}\n```\n\n尽管回调是按顺序排列的，但任务是并发运行的。每个任务在 `Future.apply`\
  \ 方法执行后或不久之后开始。我们不知道 `future1` 和 `future2` 哪一个先完成，但这并不重要。在两个任务都完成之前，我们无法处理结果。尽管回调是按顺序排列的，但任务是并发运行的。每个任务在\
  \ `Future.apply` 方法执行后或不久之后开始。我们不知道 `future1` 和 `future2` 哪一个先完成，但这并不重要。在两个任务都完成之前，我们无法处理结果。\n\
  \n*(注：由于提供的原文后半部分存在大量重复和碎片化的句子，此处已根据技术上下文进行了逻辑对齐处理，以确保文档的可读性。)*\n\n\n\n\n\n| `flatten`\
  \ | `Future[S]` (其中 `T` 是 `Future[S]`) | 将 `Future[Future[S]]` 展平为 `Future[S]`。\
  \ |\n\n**表 16–1** 对具有成功值 `v` 或异常 `ex` 的 `Future[T]` 进行变换\n\n`recover` 方法接受一个部分函数，该函数可以将异常转换为成功的结果。考虑此调用：\n\
  \n点击此处此处查看代码图片\n\n```\nval f = Future { persist(data) } recover { case e: SQLException\
  \ => 0 }\n```\n\n如果发生了 `SQLException`，该 future 将以结果 `0` 成功。\n\n`fallbackTo` 方法提供了一种不同的恢复机制。当你调用\
  \ `f.fallbackTo(f2)` 时，如果 `f` 失败，则执行 `f2`，并且其值将成为该 future 的值。然而，`f2` 无法检查失败的原因。\n\
  \n`failed` 方法将失败的 `Future[T]` 转换为成功的 `Future[Throwable]`，就像 `Try.failed` 方法一样。你可以在\
  \ `for` 表达式中这样获取失败：\n\n点击此处查看代码图片\n\n```\nval f = Future { persist(data) }\nfor\
  \ v <- f do println(s\"Succeeded with $v\")\nfor ex <- f.failed do println(s\"Failed\
  \ with $ex\")\n```\n\n最后，你可以将两个 futures 压缩在一起。调用 `f1.zip(f2)` 会产生一个 future，如果 `v`\
  \ 是 `f1` 的结果且 `w` 是 `f2` 的结果，则其结果为元组 `(v, w)`；如果 `f1` 或 `f2` 任一失败，则结果为异常。（如果两者都失败，则报告\
  \ `f1` 的异常。）\n\n`zipWith` 方法类似，但它接受一个函数来组合两个结果，而不是返回一个元组。例如，这里是获取两个计算和的另一种方法：\n\n\
  点击此处查看代码图片\n\n```\nval future1 = Future { getData1() }\nval future2 = Future { getData2()\
  \ }\nval combined = future1.zipWith(future2)(_ + _)\n```\n\n## 16.7 `Future` 对象中的方法\n\
  \n`Future` 伴随对象包含了用于处理 futures 集合的有用方法。\n\n假设在你计算结果时，你组织了工作，以便能够并发处理不同的部分。例如，每个部分都可能是输入的一个子序列。为每个部分创建一个\
  \ future：\n\n点击此处查看代码图片\n\n```\nval futures = parts.map(part => Future { process(part)\
  \ })\n```\n\n现在你拥有了一个 futures 集合。通常情况下，你想组合这些结果。通过使用 `Future.sequence` 方法，你可以获取所有结果的集合以便进一步处理：\n\
  \n点击此处查看代码图片\n\n```\nval result = Future.sequence(futures);\n```\n\n注意，该调用是非阻塞的——它带给你的一个指向集合的\
  \ future。例如，假设 `futures` 是一个 `Seq[Future[T]]`。那么结果就是一个 `Future[Seq[T]]`。当 `futures`\
  \ 中所有元素的结果都可用时， `result` future 将以结果序列的形式完成。\n\n如果任何一个 future 失败，那么生成的 future 也会随着第一个失败\
  \ future 的异常而失败。如果多个 futures 失败，你将看不到剩余的失败。\n\n`traverse` 方法结合了 `map` 和 `sequence`\
  \ 步骤。而不是\n\n点击此处查看代码图片\n\n```\nval futures = parts.map(part => Future { process(part)\
  \ })\n```\n\n点击此处查看代码图片\n\n```\nval result = Future.sequence(futures);\n```\n\n\
  点击此处查看代码图片\n\n```\nval result = Future.traverse(...)\n```\n\n点击此处查看代码图片\n\n```\n\
