- - '##'
  - 第 19 章，构建基于 API 的 Java 生成式 AI 应用——能够理解文本、代码、图像、语音和视频输入，并生成文本、代码、图像、语音和视频的多模态 genAI。使用
    OpenAI API 创建用于总结文本、分析文本情感、创建图像的可访问描述、检测文本语言并在语言之间翻译文本、生成 Java 代码、对文本进行命名实体识别并获取结构化
    JSON 输出、将语音转换为文本、从文本合成语音、为视频生成字幕等的应用。21 个 genAI 提示练习和 73 个基于 API 的编程项目。
- - '##'
  - 第 20 章，使用 JDBC 和 SQLite 访问数据库——在数据库中存储持久化数据。SQLite 数据库管理系统。结构化查询语言 (SQL) CRUD（创建、读取、更新、删除）操作。JDBC
    API。连接数据库。从数据库检索数据。JavaFX TableView。JDBC PreparedStatement。19 个 genAI 提示练习。
- - '##'
  - 第 21 章，Java 模块系统——创建自定义包和模块。声明模块依赖。指定模块导出包。定义模块提供或消耗的服务。反射和启用反射访问。使用模块封装资源。**31
    个 genAI 提示练习。**
- - '##'
  - 第 22 章，递归与大 O——递归和迭代阶乘计算。递归斐波那契数列创建“羽毛分形”。基于文本的算法可视化。丰富的递归练习。**11 个 genAI 提示练习。**
    [可以在第 4 部分：数据结构的末尾涵盖。]
