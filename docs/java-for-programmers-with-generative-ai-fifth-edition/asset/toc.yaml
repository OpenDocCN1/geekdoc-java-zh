- - '#'
  - 第 11 章文件、I/O 流、JSON 序列化与 CSV 文件演示了如何使用文件进行数据持久化，这是本书的一个重大更新。我们首先从 Java 程序化处理文件的架构开始，讨论了文本文件和二进制文件之间的区别。我们演示了如何使用
    NIO 类和接口来获取文件和目录的信息。然后，我们使用 `Formatter` 对象写入顺序文本文件并使用 `Scanner` 对象读取，从而创建并操作这些文件。
- - '#'
  - 第 4 部分：数据结构、泛型集合、Lambda 和 Stream
- - '#'
  - 第 14 章，使用 Lambda & Stream 的函数式编程引入了函数式编程。我们使用 Lambda 和 Stream 来编写某些类型的程序，比以前的技术更快、更简单、更简洁，并希望
    Bug 更少。我们将本章设计为一系列易于包含或跳过的章节，并与书中之前的章节和内容相对应。在第 14 章之后，我们将 Lambda 和 Stream 集成到几个关键示例中，因为它们的功能是如此方便且引人注目。本章的许多章节的设计可以在书中早期涵盖。我们建议学生在第
    6 章后从 14.1–14.7 节开始，专业人士在第 4 章后从 14.1–14.5 节开始。我们演示了实现早期章节编程任务的新方法。阅读第 14 章后，你将能够巧妙地重新实现书中的许多示例。在第
    18 章“并发：平台线程到虚拟线程”中，你将并行执行流操作（即同时执行多个操作），以便利用多核心架构增强性能——这是 Lambda 和 Stream 的主要目标。在第
    18 章中，你还会学到，如果任务修改了程序的状态（即变量的值），那么创建正确运行的并行任务是非常的。因此，你在第 14 章中学到的技术重点是不可变性——不修改正在处理的数据源或任何其他程序状态。包含
    37 个 genAI 提示词练习。**
