  \n![](img/Figure_10.7.png)\n\n图 10.7：显示消息简单 Applet 程序\n\n### 事件处理\n\n事件是指对象的状态发生了变化。考虑点击按钮、拖拽鼠标等。执行事件处理需要以下步骤：\n\
