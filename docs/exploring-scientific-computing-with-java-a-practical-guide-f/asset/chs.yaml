  \ one dimensional，此处应为二维）\n\n输出在图 4.7 中提供：\n\n![](img/Figure_4.7.png)\n\n图 4.7:\
  \ 一维数组的输出\n\n### 数组的优缺点](#contents.xhtml_sc4_113a)\n\n**优点：**\n- 使用索引，你可以随机访问任何元素。\n\
  - 大数据集处理简单。\n\n**缺点：**\n- 一旦定义，大小无法扩展。\n- Java 只支持基本类型。\n\n### 将数组传递给方法](#contents.xhtml_sc4_114a)\n\
