  ### 字节流\n字节流的目标是通用输入和输出。原始字节或简单数据类型可用于数据。\n\n## InputStream\n所有从文件、内存或终端读取字节的基础类被称为\
  \ `InputStream`。由于输入流是一个抽象类，我们无法实例化它；尽管，我们可以使用其子类从输入流读取字节。\n\n## 流的类型\n在之前的图 9.3\
  \ 中展示了 `InputStream` 的不同类型。现在，下表 9.1 给出了 `InputStream` 类中可用方法及其描述：\n\n| 方法 | 描述\
  \ |\n| :--- | :--- |\n| `available()` 提供可以从此输入流读取（或跳过）的字节数估计值，以便后续对该输入流方法的调用不会阻塞。\
  \ |\n| `close()` 释放此输入流连接的系统资源并关闭它。 |\n| `mark(int readlimit)` 指明你当前在此输入流中的位置。 |\n\
  | `markSupported()` 检查此输入流是否支持 mark 和 reset 方法。 |\n| `read()` 从输入流中读取每一个后续字节。 |\n\
  \n\n\n\n\n### InputStream 类方法\n\n| 方法 | 说明 |\n| --- | --- |\n| `read(byte[] b)`\
  \ | 从输入流中读取一定数量的字节并放入缓冲区数组 `b` 中。 |\n| `read(byte[] b, int off, int len)` | 从输入流中读取最多\
  \ `len` 个字节的数据到字节数组中。 |\n| `reset()` | 将此流重新定位到该输入流 `mark` 方法最后一次调用点。 |\n| `skip(long\
  \ n)` | 从此输入流中跳过并丢弃 `n` 个字节的数据。 |\n\n**表 9.1: InputStream 类的方法**\n\n---\n\n### 字节流\
  \ (`FileInputStream` 和 `OutputStream`)\n\n#### FileInputStream\n\n通过 `FileInputStream`\
  \ 从文件系统中的文件读取字节字节。它依赖于主机环境中哪些文件可用。`FileInputStream` 设计用于读取原始字节流，例如图片文件中看到的字节流。考虑使用\
  \ `FileReader` 来读取字符流。\n\n#### OutputStream\n\n所有用于向文件、内存或终端写入字节的类的基类统称为 `OutputStream`。由于\
  \ `OutputStream` 是一个抽象类，我们无法创建其实例；尽管如此，我们可以使用其子类向输出流写入字节。\n\n![](img/Figure_9.4.png)\n\
  \n**图 9.4: Java 中 OutputStream 的分类**\n\n在前面的图 9.4 中，描述了不同类型的 `OutputStream`。现在下面的表\
  \ 9.2 给出了 `OutputStream` 类下可用方法及其描述：\n\n| 方法 | 说明 |\n| --- | --- |\n| `close()`\
  \ | 与此输出流连接的系统资源并关闭它。 |\n| `flush()` | 刷新此输出流并强制将任何缓冲输出字节写入。 |\n| `write(byte[]\
  \ b)` | 从指定的字节数组向此输出流写入 `b.length` 个字节。 |\n| `write(byte[] b, int off, int len)`\
  \ | 从偏移量 `off` 开始，从指定的字节数组向此输出流写入 `len` 个字节。 |\n| `write(int b)` | 将指定的字节写入此输出流。\
  \ |\n\n**表 9.2: OutputStream 类的方法**\n\nJava 程序利用字节流进行 8 位字节的输入输出。所有其他字节流类都派生自 `InputStream`\
  \ 和 `OutputStream`。有许多字节流类。为了演示字节流如何工作，我们将关注文件 I/O 字节流：`FileInputStream` 和 `FileOutputStream`。其他类型的字节流使用方式几乎相同；它们主要区别在于构造方式。通过\
  \ `FileInputStream` 从文件系统中的文件读取字节。它依赖于主机环境中哪些文件可用。`FileInputStream` 设计用于读取原始字节流，例如图片文件中看到的字节流。考虑使用\
  \ `FileReader` 来读取字符流。\n\n#### FileOutputStream\n\n通过文件输出流向文件或 `File Descriptor`（文件描述符）写入数据。文件的可用性或生成能力取决于其底层平台。特别是某些平台一次只允许一个\
  \ `FileOutputStream`（或等效的文件写入对象）打开文件进行写入。在这些情况下，如果相关文件已打开，此类中的构造函数将失败。`FileOutputStream`\
  \ 设计用于输出原始字节流，例如数据文件中看到的字节流。如果您想连续地写入字符，请使用 `FileWriter`。在下一节中，将详细阐述面向字符的流。\n\n\
  ---\n\n### 面向字符的流\n\n这种流设计用于存储字符数据。数据从程序内部使用的 16 位 Java `char` 格式转换为外部使用的 `UTF`\
  \ 格式。基于 Java 的平台使用 Unicode 标准来存储字符值。这种内部格式通过字符流 I/O 自动在本地字符集之间转换。西方地区的本地字符集通常是 ASCII\
  \ 的 8 位超集。对于大多数应用程序，字符流的 I/O 没有字节流的 I/O 复杂。使用流类进行输入输出会导致本地字符集之间的自动转换。程序员不需要进行额外工作，使用字符流代替字节流的程序会立即适应本地字符集，并为国际化做好准备。\n\
  \n---\n\n### Reader 类\n\nReader 流类用于从文件中读取字符。在许多方面，它们与 `InputStream` 类相同。\n\n现在，下面的表\
  \ 9.3 给出了 `Reader` 类下的可用类及其描述：\n\n| 类 |  |\n| --- | --- |\n| `BufferedReader` |\
  \ 从字符输入流中获取文本，同时缓冲字符以使读取行、数组和字符更高效。 |\n| `CharArrayReader` | 此类实现了一个可以作为字符输入流使用的字符缓冲区。\
  \ |\n| `InputStreamReader` | 字节流和字符流之间的桥梁：输入流读取器：使用给定的 `charset` 读取字节并解码为字符。 |\n\
  | `PipedReader` | 管道字符输入流。 |\n| `FilterReader` | 用于读取过滤字符流的抽象类。 |\n| `PushbackReader`\
  \ | 允许将字符推回流的字符流读取器。 |\n| `StringReader` | 源自字符串的字符流。 |\n| `LineNumberReader` |\
  \ 跟踪行号的缓冲字符输入流。 |\n| `FileReader` | 用于读取字符文件的便利类。 |\n\n**表 9.3: Reader 类**\n\n下面的表\
  \ 9.4 给出了 `Reader` 类下的方法及其描述：\n\n| 方法 | 说明 |\n| --- | --- |\n| `close()` | 终止流并释放所有系统资源。\
  \ |\n| `mark(int readAheadLimit)` | 指明支持 mark 操作。 |\n| `markSupported()` | 指明是否支持\
  \ mark 操作。 |\n| `read()` | 读取单个字符。 |\n| `read(char[] cbuf)` | 读取字符到数组中。 |\n| `read(char[]\
  \ cbuf, int off, int len)` | 将字符插入数组的特定区域。 |\n| `read(CharBuffer target)` | 尝试读取字符到指定的缓冲区。\
  \ |\n| `ready()` | 指明流是否准备好读取。 |\n| `reset()` | 重置流。 |\n\n**表 9.4: Reader 类的方法**\n\
  \n---\n\n### Writer 类\n\n下面的表 9.5 给出了 `Writer` 类下的类及其描述：\n\n| 类 | 说明 |\n| --- |\
  \ --- |\n| `BufferedWriter` | 向字符输出流写入文本，缓冲字符以便高效写入单个字符、数组和字符串。 |\n| `CharArrayWriter`\
  \ | 此类实现了一个可以作为 Writer 使用字符缓冲区。 |\n| `PipedWriter` | 管道字符输出流。 |\n| `StringWriter`\
  \ 将其输出收集在字符串缓冲区中的字符流，随后它可以来构造字符串。 |\n| `FileWriter` | 用于写入字符文件的便利类。 |\n| `FilterWriter`\
  \ | 用于写入过滤字符流的抽象类。 |\n| `PrintWriter` | 向文本输出流打印对象的格式化表示。 |\n\n**表 9.5: Writer 类**\n\
