  \n![](img/fm1.png)\n\n# 第 11 章 使用 Java 的杂项程序\n\n## 引言\n在本章中，我们首先提供了两个最重要的数据结构 `Stack`\
  \ 和 `Queue` 的源代码。然后，使用 Java 程序演示了井井棋游戏。随后，使用 Java 编程实现了两个重要的对称密钥和非对称密钥算法 `AES` 和\
  \ `RSA` 用于加密和解密。最后，以两个程序之间消息传递的形式添加了 socket 编程，包括聊天应用程序以及客户端与服务器之间的文件发送。\n\n## 结构\n\
  在本章中，我们将涵盖以下主题：\n* `Stack` 类的 Java 程序\n* `queue` 的 Java 程序\n* 使用 Java 编写的井井棋程序\n\
  * `AES` 加密与解密\n* `RSA` 加密与解密\n* 使用 socket 发送消息\n* 使用 socket 在线\n* 使用 socket 发送\n\
  \n## 目标\n在本章中，读者将对对称和非对称密钥加密进行实操练习。这将有助于理解聊天应用程序。此外将通过 Socket 展示文件发送。\n\n### Stack\
