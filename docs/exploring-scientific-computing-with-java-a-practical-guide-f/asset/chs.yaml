  \ | 它支持多继承。 |\n\n表 5.2：抽象类和接口的区别\n\n让我们在下一节中讨论 Java 中的访问修饰符。\n\n### 访问修饰符](#contents.xhtml_sc2_166a)\n\
  \n访问级别修饰符决定了其他类是否可以使用特定的字段或调用特定的方法。访问控制有两个级别：\n\n* 在顶层级别：`public` 或包私有（无显式修饰符）。\n\
  * 在成员级别：`public`、`private`、`protected` 或包私有（无显式修饰符）。\n\n类可以使用 `public` 修饰符声明，在这种情况下，该类对所有地方的所有类可见。如果一个类没有修饰符（默认值，也称为包私有），则它仅在自己的包内可见（你将在稍后的课程中学习它们）。\n\
  \n在成员级别，你也可以 `public` 修饰符或无修饰符（包私有），与顶层类相同。对于成员，两个额外的访问修饰符：`private` 和 `protected`。`private`\
  \ 修饰符规定成员只能在类内部被访问。`protected` 修饰符规定成员可以在自己的包内（如包私有）被访问，此外还可以被另一个包中的子类访问。表 5.3 将根据包结构提供访问修饰符的细节。\n\
  \n| | PUBLIC | PROTECTED | DEFAULT | PRIVATE |\n| :--- | :--- | :--- | :--- |\n\
  | 同一个类 | 是 | 是 | 是 | 是 |\n| 同包内的子类 | 是 | 是 | 是 | 否 |\n| 同包内的其他类 | 是 | 是 | 是 | 否\
  \ |\n| 另一个包中的子类 | 是 | 是 | 否 | 否 |\n| 另一个包中的非子类 | 是 | 否 | 否 | 否 |\n\n表 5.3：访问修饰符类型\n\
