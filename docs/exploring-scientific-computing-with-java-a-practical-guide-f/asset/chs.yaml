  \n# 第 4 章：Java 中的数组、字符串和向量](#contents.xhtml_ch4a)\n\n## 引言\n\n在本章中，我们将讨论数组、字符串和向量。在具备足够的类、方法和构造函数知识后，我们将介绍这些重要的概念。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   Java 数组\n*   Java 字符串\n*   Java 向量\n*   `StringTokenizer`\
  \ 类\n*   包装类\n*   自动装箱与自动拆箱\n\n### Java 中的数组\n\n数组是一种承载预定义数量单一类型的容器对象。在构造数组时，其长度是预定义的。图\
  \ 4.1 展示了内存中的数组、索引和元素。\n\n数组索引从 0 开始。数组的每个组件被称为元素，每个元素可以通过其唯一的整数索引进行检索，如图所示。作为一个示例，索引\
  \ 3 将用于检索第二个元素。\n\n### 在 Java 中创建数组\n\n在 Java 程序中创建数组涉及以下三个不同的步骤：\n\n1.  声明数组名称。\n\
  2.  创建数组。\n3.  初始化数组值。\n\n当引用数组元素时，我们在数组名后包含索引。例如，在图 4.2 中，代码 `a[i]` 指定数组元素 `i`。例如，以下代码创建一个包含\
  \ `n` 个双精度浮点数的数组，并将全部设置为 0.0。\n\n```java\ndouble[] a = new double[n];\nfor (int\
  \ i = 0; i < n; i++) {\n    a[i] = 0.0;\n}\n```\n\n\n\n\n\n存储在相邻内存地址的相同类型元素集合在 Java\
  \ 中称为一维数组。索引从零开始。要创建一个整数数组，你可以写道：\n\n数组的类型写为 `type[]`（`int[]`），其中 `type` 是数据类型；括号\
  \ `[]` 表示这是一个数组。在图 4.3 中，给出了所有可能的有效语法：\n\n![](img/Figure_4.3.png)\n\n图 4.3: 整数数组的有效语法\n\
  \n## 一维数组\n\n在前面的示例中，`int` 是一个类型。`[]` 表示数组，`myNum` 是整数类型数组变量。前面的示例将创建一个一维数组，如表 4.1\
