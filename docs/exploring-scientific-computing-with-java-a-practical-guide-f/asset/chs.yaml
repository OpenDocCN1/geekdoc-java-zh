  \ 然后开始向其中添加元素。每个元素之后，`vector` 的大小都会增加一。现在，如果大小超过了容量，即如果我们想向 `vector` 添加第六个元素，这与数组是不可能的。在数组中，如果定义了大小，之后的元素将不再被插入。然而，如果我们添加第六个元素，`vector`\
  \ 的容量将翻倍，即 10。在接下来的示例 图 4.22 中，该数组被称为增长数组：\n\n![](img/Figure_4.22.png)\n\n图 4.22：尺寸增加且容量翻倍的\
