  \ 类的方法。\n\n现在，在对流进行了详细学习之后，我们将讨论如何使用它们执行不同的 I/O 操作。\n\n### 字符流与字节流的区别\n\n字符流和字节流之间的差异在图\
  \ 9.5 所示：\n\n![](img/Figure_9.5.png)\n\n图 9.5：字符流与字节流的区别\n\n### 作为预定义流的标准输入、输出和错误流\n\
  \n如你所知，所有的 Java 程序都会自动导入 `java.lang` 包。该包中定义了一个名为 `System` 的类，包含许多运行时环境组件。它的内容包括三个预设流变量：`err`、`out`\
  \ 和 `in`。系统将这些字段标记为 `final`、`public` 和 `static`。这意味着使用它们不需要特殊的系统对象，并且可以被软件的任何其他部分利用。\n\
  \n标准输出流由 `System.out` 表示。默认情况下，它被称为 `Console`（控制台）。标准输入默认是键盘，被称为 `system.in`。`System.err`\
  \ 是标准错误流的缩写，默认也是控制台。\n\n### 读取数据的过程\n\n有四个类用于从键盘读取数据，它们列举如下：\n\n*   `InputStreamReader`\n\
  *   `Console`\n*   `Scanner`\n*   `DataInputStream`\n\n让我们来讨论每个类以及每个类的效用：\n\n* \
  \  `InputStreamReader` 类：可以使用 `InputStreamReader` 类从键盘读取数据。它负责连接到键盘的输入流，并将字节面向的流转换为字符面向的流等。\n\
  \n    字节流和字符流之间的桥梁是输入流读取器。使用给定的 `charset`（字符集），它读取字节并将其解码为字符。\n\n*   `BufferedReader`\
  \ 类：可以使用 `BufferedReader` 类的 `readLine()` 函数逐行读取数据。该函数从字符输入流中读取文本，同时对字符进行缓冲，以提高字符、数组和行的读取效率。通过缓冲输入，它增强了性能。\n\
  \n*   `DataInputStream`：它用于从底层输入流中以机器无关的方式读取 Java 原始数据类型。数据输入流可以读取应用程序通过数据输出流写入的。。对\
  \ `DataInputStream` 的多线程访问并不总是安全的。\n\n*   `Scanner` 类：一种基础的文本扫描器，使用正则表达式来解析字符串和原始类型。使用默认检测空格的分隔符模式，扫描器将其输入划分为标记（tokens）。之后，可以通过利用不同的后续技术将这些标记转换为不同的值。\n\
  \n    例如，以下代码允许用户从 `system.in` 读取一个数字：\n\n    ```\n    Scanner sc = new Scanner(System.in);\n\
  \    int k = sc.nextInt(); // 将输入的下一个标记扫描为 int 类型。\n    ```\n\n    `java.util` 包有一个名为\
  \ `Scanner` 的类，用于获取字符串以及 `int`、`double` 等原始类型的输入。它是向 Java 程序中读取输入的最简单方法。通常，在创建 `Scanner`\
  \ 类对象时，会给出预定义对象 `System.in`——代表标准输入流。要读取字符串，我们使用 `nextLine()`。\n\n###不同的 BufferedReader\
  \ 类方法\n\n`BufferedReader` 类下的不同方法及其描述在下面的表 9.7 中：\n\n| 方法 | 说明 |\n| :--- | :---\
  \ |\n| `close()` | 终止流并释放所有相关的系统资源。 |\n| `lines()` | 它交付一个流，其中从此 `BufferedReader`\
  \ 读取的行作为其组成部分。 |\n| `mark(int readAheadLimit)` | 标记流中的当前位置。 |\n| `markSupported()`\
  \ | 告知此流是否支持 `mark()` 操作，该流支持。 |\n| `read()` | 读取单个字符。 |\n| `read(char[] cbuf, int\
  \ off, int len)` | 将字符读取到数组的某部分。 |\n| `readLine()` | 读取一行文本。 |\n| `ready()` | 表示流是否可以进行读取。\
  \ |\n| `reset()` | 将流重置到最近的标记。 |\n| `skip(long n)` | 跳过字符。 |\n\n表 9.7：`BufferedReader`\
  \ 类的方法。\n\n### 不同的 scanner 类方法\n\n`scanner` 类的方法及其描述描在下面的表 9.8 中：\n\n| 方法 | 说明 |\n\
  | :--- | :--- |\n| `nextChar()` | 为了读取一个字符，我们使用 `next().charAt(0)`。`next()` 函数将输入中的下一个标记/单词作为字符串返回，`charAt(0)`\
  \ 函数返回该字符串中的第一个字符。 |\n| `nextInt()` | 用于从键盘读取整数值。 |\n| `nextFloat()` | 用于从键盘读取浮点值。\
  \ |\n| `nextLong()` | 用于从键盘读取长型值。 |\n| `hasNext()` | 如果扫描器的输入中还有标记，则返回 true。在等待输入扫描时，此过程可能会阻塞。\
  \ |\n| `next()` | 它定位并返回此扫描器的后续完整标记。分隔符输入出现在完整标记之前或之后。 |\n\n表 9.8：`scanner` 类的方法。\n\
