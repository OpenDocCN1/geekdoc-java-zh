  ```\nimages/Figure11.4\n```\n`Queue` 的输出\n\n### 使用 Java 的井井棋程序\n现在，我们将演示使用 Java\
  \ 的井井棋程序。该程序被分为三个部分，如下：\n```\nimages/Figure11.5\n```\n`Tic-tac-toe` 的第一部分\n\n前一个程序的第二部分为：\n\
