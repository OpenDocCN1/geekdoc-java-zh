  \n\n\n\n\nApplet 的目的是被嵌入另一个应用程序中，而不是独立运行。任何包含在网页中或被 Java Applet Viewer 使用的 applet\
  \ 必须以 `Applet` 类作为其超类。在 applet 及其运行环境之间，`Applet` 类提供了一个标准接口。Java applet 是一种特殊的 Java\
  \ 程序，可以由支持 Java 技术的浏览器从互联网下载并执行。applet 通常在浏览上下文中运行，并嵌入到网页中。applet 需要一个 `java.applet.Applet`\
  \ 类的子类。applet 与浏览器环境之间的标准接口由 `Applet` 类提供。`java.applet` 包包含了 `Applet` 类。applet 中的几个方法允许你精粒度地控制你的\
  \ applet 的执行方式。所有的 applet 都属于 applet 范畴。因此，所有 applet 都需要导入 `java.applet`。此外，applet\
  \ 必须导入 `java.awt`。AWT 的缩写代表 Abstract Window Toolkit（抽象窗口工具包）。由于每个 applet 都运行在窗口中，因此需要导入\
  \ `java.awt` 包来为该窗口添加功能。控制台的 Java 运行时解释器不运行 applet。相反，它们要么由 applet viewer 运行，要么由网络浏览器运行。applet\
  \ 不会在 `main()` 处运行。`System.out.println()` 不会在你的 applet 窗口产生输出。相反，使用其他的 AWT 方法来处理，例如\
  \ `drawString()`，它根据给定的 `X,Y` 位置产生一个字符串。输入的处理方式也与应用程序不同。`Applet` 标签包含了 applet 的\
  \ `width`、`height`、`codebase`、`archive`、`name` 以及其他影响 applet 在浏览器中出现位置的属性。你可以使用\
  \ `code` 属性指定必须从服务器加载的 applet 类名。applet 实例在浏览器中的尺寸由其 `width` 和 `height` 规定。\n\n\
  ## Applet 的优点\n\napplet 有许多优点。它们如下所示：\n\n*   由于它在客户端运行，因此响应时间较短。\n*   各种操作系统（如 Linux、Windows、Mac\
  \ OS 等）上的浏览器可以使用它。\n*   通常情况下，applet 能够建立回到其源主机的网络连接。\n*   在网络浏览器中运行的 applet 可以轻松地展示\
  \ HTML 页面。\n*   在同一个页面上，applet 可以调用其他 applet 的公共方法。\n*   通过网络加载的 applet 没有任何限制；相反，从本地文件系统中用户\
  \ `CLASSPATH` 中的位置加载它们时，它们是不受限制的。\n*   当你离开它们的页面时，applet 不必停止工作，尽管大多数 applet 都会这样做。\n\
  \n## Applet 的缺点\n\nJava 中的 applet 具有某些局限性，它们如下：\n\n*   要运行 applet，客户端浏览器必须安装插件。\n\
  *   applet 无法定义本地方法或加载库。\n*   通常情况下，它无法在所运行的主机上读取或写入文件。\n*   它只能与与其来源的主机建立连接。\n\
  *   它无法在所运行的主机上启动任何软件。\n*   它无法读取某些系统属性。\n*   applet 弹出的窗口外观与程序弹出的窗口有所不同。\n\n##\
  \ Applet 类的层次结构\n\n为每个 applet 创建一个 `Applet` 类的子类以实现它的功能。`Applet` 类的继承层次结构如图所示。图\
  \ 10.1 展示了 `Applet` 类如何扩展 `Panel`。`Panel` 是 `Container` 的扩展，是 `Component` 的子类型。\n\
  \n![](img/Figure_10.1.png)\n\n图 10.1：Applet 类层次结构的表示\n\n## Applet 生命周期\n\napplet\
  \ 类的 `init()` 方法有一个空实现，但任何初始化都可以通过 applet 子类重写它来完成。浏览器会跟踪 applet 实例是否处于激活状态。当包含它的网页当前显示时，applet\
  \ 实例处于激活状态。然后，浏览器将使用 `start()` 函数将 applet 设置为激活状态。如果 applet 因为不在活动页面上而变为非激活，浏览器将在该实例上调用\
  \ `stop()` 方法并将其置非激活状态。因此，取决于用户的操作，浏览器可能会多次调用 `start` 和 `stop` 方法。最后，浏览器显示消息“包含\
  \ applet 的网页正在销毁”。随后，浏览器将在 applet 实例上使用 `destory()` 函数，通知 applet 它即将被销毁。applet 的生命如图\
  \ 10.2 所示：\n\n![](img/Figure_10.2.png)\n\n图 10.2：Applet 生命周期的表示\n\n## Applet 类方法\n\
  \n在本节中，我们将介绍 applet 类的基本方法及其描述，如下所示：\n\n*   `init()`：此 applet 已被浏览器或 applet viewer\
  \ 通知其已加载到系统中。在首次调用 `start` 方法之前，它总是被调用的。\n*   `start()`：被浏览器或 applet viewer 调用以指示此\
  \ applet 开始运行。每当在网页上查看 applet 时，它都会在 `init` 方法之后被调用。它在 applet 启动时自动调用。\n*   `stop()`：被浏览器或\
  \ applet viewer 调用以指示此 applet 停止运行。它在 applet 将被删除之前以及包含它的网页被替换为另一个之后被调用。当浏览器使用 `start()`\
  \ 时，applet 会重新启动。\n*   `destroy()`：由浏览器或 applet viewer 触发，通知 applet 其分配的所有资源都应被销毁。在销毁之前始终调用\
  \ `stop` 方法。\n*   `getAppletContext()`：为此 applet 提供上下文，使其与其运行环境进行交互并从中学习。\n*   `getAppletInfo()`：返回有关此\
  \ applet 的详细信息。\n*   `getAudioClip(URL)`：返回作为 `URL` 参数发送的 `AudioClip` 对象。\n*   `getAudioClip(URL,\
  \ String)`：返回由 `URL` 和名称参数指定的 `AudioClip` 对象。\n*   `getCodeBase()`：获取基础 URL。\n*\
  \   `getDocumentBase()`：获取文档 URL。\n*   `getImage(URL)`：返回可以在屏幕上绘制的 `Image` 对象。\n\
  *   `getImage(URL, String)`：返回可以在屏幕上绘制的 `Image` 对象。\n*   `getLocale()`：获取 applet\
  \ 的 `Locale`，如果它已设置。\n*   `getParameter(String)`：返回 HTML 标签中命名参数的值。\n*   `getParameterInfo()`：返回此\
  \ applet 理解的参数信息。\n*   `isActive()`：测试此 applet 是否处于激活状态。\n*   `play(URL)`：播放指定绝对\
  \ URL 的音频片段。\n*   `play(URL, String)`：根据给定的 URL 和相对指定符播放音频片段。\n*   `resize(Dimension)`：请求调整此\
  \ applet 的尺寸。\n*   `resize(int, int)`：请求调整此 applet 的尺寸。\n*   `setStub(AppletStub)`：此\
  \ applet 的存根已设置。\n*   `showStatus(String)`：请求在状态窗口中显示参数字符串。\n\n## Applet 语法\n\n\n\
  \n\n\n`java.awt` 和 `java.applet` 是任何 Applet 程序必须导入的两个包。抽象窗口工具包（AWT）的类通过 `java.awt.*`\
  \ 导入。通过 AWT，applet 与用户进行通信。`java.applet.*` 从 `applet` 包中导入 `Applet` 类。`import java.awt.*;`\
  \ 语句告诉编译器包含 `java.awt` 包中包含的所有类。每个 `Applet` 程序都必须声明一个 `paint()` 函数。AWT 类定义了该方法，applet\
  \ 必须对其进行重写。applet 每次想要 `redisplay`（重新显示）其输出时，都会调用 `paint()` 函数。Java 的坐标系从左上角 `(x,y)=(0,0)`\
  \ 开始。对于所有的绘制方法，我们都必须指定 `x` 和 `y` 坐标系。要使用 applet 程序绘制文本，我们必须在 `paint()` 方法内部使用 `drawString()`，语法如\
  \ `gaphicsObj.drawString(String,x-coordinate,y-coordiante)`。在我们的程序中，`Graphics g`\
  \ 表示 `g` 是 `Graphics` 类的一个对象。语句 `g.drawString(\"Hello java\",100,100);` 用于在我们 `x`\
  \ 和 `y` 坐标系的位置 `(100,100)` 处绘制文本 `Hello java`。在接下来的图 10.3 中，展示了坐标系：\n\n![](img/Figure_10.3.png)\n\
  \n图 10.3：坐标表示\n\n让我们写一个简单的 Java Applet 程序并演示代码的输出。在我们的程序中，`Hellojava` 是类名，带有公共访问修饰符，以便可以直接运行程序。为了指定我们的类是一个\
  \ `Applet`，我们使用 `extends Applet` 来继承 `Applet` 类的属性。\n\n一个简单 Applet 程序的创建如下：\n\n\
  ```java\nimport java.applet.*;\nimport java.awt.*;\n\npublic class Hellojava extends\
  \ Applet{\n    public void paint(Graphics g){\n        g.drawString(“A simple Applet\
  \ program\", 10, 100);\n    }\n}\n```\n\n示例 HTML 代码如下：\n\n```html\n<html>\n<body>\n\
  \    <applet code= Hellojava.class width=400 height=400> </applet>\n</body>\n</html>\n\
