  \n# 第 8 章 Java 中的包创建](#contents.xhtml_ch08a)\n\n## 介绍](#contents.xhtml_sc2_234a)\n\
  \n包是 Java 中的一个基本概念。Java 使用包来消除名称冲突，并管理对类、接口和枚举的访问。Java 平台拥有丰富的类库（包的集合），这些类可以在你的应用程序中使用。该库被称为应用程序编程接口（API）。它的包涵盖了与通用编程相关的最典型任务。例如，一个\
  \ `String` 对象包含字符字符串的状态和行为；一个 `File` 对象允许程序员轻松地在文件系统上创建、删除、检查、比较或修改文件；一个 `Socket`\
  \ 对象允许网络套接字的创建和使用；各种 GUI 对象则控制按钮、复选框和其他图形用户界面的其他方面。有成百上千的课程可供选择。这使你作为程序员能够专注于你特定应用程序的设计，而不是为了实现它而所需的基础设施。\n\
  \n## 结构](#contents.xhtml_sc2_235a)\n\n在本章中，我们将涵盖以下主题：\n\n* 包的定义\n* 包的重要性\n* 包的特性\n\
  * 包的类型\n* Java 包的关键考虑因素\n* 使用包的计算器程序\n\n## 目标](#contents.xhtml_sc2_236a)\n\n本章讨论了包设计的的基本思想、包创建的规则、包特性、Java\
  \ 编程中使用的包类型（内置包和自定义包）、使用 `-d` 选项的编译过程以及一个使用包的计算器应用程序。此外，学习者将通过使用借助包设计的计算器程序来获得实践经验。现在，为了开始讨论，我们在下一段中选择了包的定义。\n\
  \n## 包的定义](#contents.xhtml_sc2_237a)\n\n\n\n\n\n包（Package）是一组链接类型的集合，提供了命名空间管理和访问控制。请记住，“类型”一术语包含了类、接口、枚举和注解类型。在\
  \ Java 中，相似的类被分组在包中。这让你联想到文件系统目录中的文件夹。通过使用包，我们可以减少命名冲突并创建更可靠的代码。\n\n## 创建包的规则\n\n\
  创建包的规则如下：\n\n* 为了防止与类或接口名称发生冲突，包名由全小写字母组成。\n* 公司利用其反转的 Internet 域名作为包名的开头，例如由 abc.com\
  \ 的程序员编写的名为 `mypack` 的包，命名为 `com.abc.mypack`。\n* 组织内部的命名冲突必须通过内部约定管理，例如在公司名称后添加地区或项目名称（例如\
  \ `com.abc.reg.mypack`）。\n* Java 程序中的包必须以 `java` 或 `javax` 开头。\n* 在某些情况下，互联网域名的域名可能不作为可接受的包名。如果域名包含连字符或其他特殊字符，就会发生这种情况。如果包名以数字或其他禁止作为\
  \ Java 名称首字符的字符开头，或者如果包名包含 Java 保留关键字（如 `int`）。在这种情况下，建议的规范是使用下划线。下表所示：\n\n| 域名名称\
  \ | 包名前缀 |\n| :--- | :--- |\n| `abc-name.example.org` | `org.example.abc_name` |\n\
  | `abc.int` | `int_.abc` |\n| `123name.abc.com` | `com.abc._123name` |\n\n表 8.1：包名的表示\n\
  \n现在，我们将讨论包的特性及其对应用开发有用的原因。\n\n## 包的重要性\n\n在 Java 中使用包的益处如下：\n\n* 包将类组组织成单一的 API\
  \ 单元。\n* 它将控制命名冲突。\n* 访问保护将变得更容易。`protected` 和 `default` 是对包的访问级别控制。\n* 易于定位相关类。\n\
  * 重用包中的现有类。\n\n## 包的特性\n\n以下是包的特性：\n\n* 每一个类都是某个包的一部分。\n* 一个文件中的所有类都属于同一个包。\n* 你可以使用包声明来指定包。\n\
  * 包名作为文件中的第一行（非注释行）。\n* 多个文件可以指定同一个包名。\n* 如果未指定包，文件中的类将进入一个特殊的未命名包（所有文件共用同一个未命名包）。\n\
  * 如果指定了包名，文件必须位于名为 `name` 的子目录中（即目录名必须与包名匹配）。\n* 你可以使用以下方式访问另一个（具名的）包中的公共类：\n  下文给示例：\n\
  \n  `package-name.class-name`\n\n  * 你可以使用以下方式访问此类类的公有字段和方法：\n    `package-name.class-name.field-or-method-name`\n\
  \  * 你可以使用以下方式避免包含包名：\n    `import package-name.*;`\n    或者\n    `import package-name.class-name;`\n\
  \  在文件的开头（包声明之后）。前者导入包中的所有类，后者只导入指定的类。你仍然必须使用 `class-name` 来访问包中的类，并使用 `class-name.field`\
  \ 或 `method-name` 来访问类的字段和方法；唯一可以省略的是包名。\n\n在下一节中，将通过适当的示例讨论不同类型的包。\n\n## 包的类型\n\
  \n包分为两类，列如下：\n\n* 内置包（来自 Java API 的包）\n* 用户定义包（创建你自己的包）\n\n让我们继续学习 Java 语言提供的内置包的基本概念。\n\
  \n## 内置包\n\n内置包来自 Java API。Java API 是 Java 开发环境中可用的预定义类库。一些常用的内置包如下：\n\n* `java.lang`：封装了基础类\n\
  * `java.io`：输入输出函数类的集合\n* `java.awt`：抽象窗口工具包类的集合\n* `java.swing`：窗口应用程序 GUI 工具包类的集合\n\
  * `java.net`：网络基础设施类的集合\n* `java.util`：集合框架类的集合\n* `java.applet`：创建 applet 类的集合\n\
  * `java.sql`：相关数据处理类的集合\n\n## 导入内置包\n\n要导入内置包，你应该编写语句 `import java.util.Scanner;`。\n\
  \n这里给出了上述语句的组成部分：\n\n* `Java` 是顶层包\n* `Util` 是子包\n* `Scanner` 是存在于子包 `util` 中的一个类\n\
  \n一个简单的程序包示例所示：\n\n```java\nimport java.util.Scanner; // 导入 Scanner 类\n\nclass tstPDPack\
  \ {\n    public static void main(String[] args) {\n        Scanner mobj = new Scanner(System.in);\
  \ // 创建对象\n        System.out.println(\"Enter the name\");\n        String urName\
  \ = mobj.nextLine(); // 读取用户输入\n        System.out.println(\"My name is: \" + urName);\
  \ // 输出输入\n    }\n}\n```\n\n文件名应为 `tstPDPack.java`。`Scanner` 类是 `java.util` 的，用于捕获用户输入。在示例中使用了\
  \ `nextLine()`，它可以读取字符串。图 8.1 展示了这一点。\n\n## 用户定义包\n\n用户定义包是开发者为了避免命名冲突而构建或生成的包。它们与\
  \ Java 提供的内置包非常相似。\n\n## 创建和导入用户定义包\n\n要创建包定义，你应该首先在 `.java` 文件中编写包名、类和方法定义。假设 `pack1`\
  \ 是我们创建的包名。你在 `tstpck.java` 文件中插入 `package pack1;`。然后，你应该编写类体并保存文件，如下所示：\n\n```java\n\
  package pack1;\n\npublic class tstpck {\n    public static void disp() {\n     \
  \   System.out.println(\"Package created\");\n    }\n}\n```\n\n上述程序的输出如下：\n\n创建包的步骤如下：\n\
  \n* 以 `.java` 扩展保存文件（test 文件夹）\n* 使用命令 `javac -d . filename.java` 编译文件（`.java`）\n\
  \n如果 `tstpck.java` 文件的这两个语句执行成功，将在目录下创建一个名为 `pack1` 的文件夹，并在其中创建一个名为 `tstpck.class`\
  \ 的 `.class` 文件，它包含方法定义。图 8.3 展示了目录结构。\n\n导入包的步骤编写如下：\n\n1. 创建新文件（`pckTest.java`）并导入包\
  \ `pack1`。\n2. 导入包 `pack1` 以及所需的类 `tstpck`。\n3. 根据需要创建一个新类 `pckTest`。\n4. 将其保存为\
  \ `pckTest.java` 并位于 test 文件夹，如下所示：\n\n```java\nimport pack1.tstpck;\n\npublic class\
  \ pckTest {\n}\n```\n\n\n\n\n\n```java\npublic static void main(String s[])\n{\n\
  \    tstpck p=new tstpck();\n    p.disp();\n}\n}\n```\n\n5. 编译文件 (`pckTest.java`)。\
  \ \n\n前一个程序的输出如下：\n\n![](img/Figure_8.4.png)\n\n图 8.4：导入用户自定义包后的输出\n\n从前面的图 8.4，可以得出语句\
  \ `import pack1.tstpck;` 已成功执行，并输出了结果 `Package created`。\n\n下面的图 8.5 展示了导入新创建的包时的目录结构：\n\
  \n![](img/Figure_8.5.png)\n\n图 8.5：导入新创建的包\n\n### 使用 –d 选项的编译过程\n\n参数 `-d` 编译器将编译后的代码（`.class`\
  \ 文件）放入具有正确包结构的类目录中。\n\n![](img/Figure_8.6.png)\n\n图 8.6：导入新创建的包\n\n选项 `d` 指定了目录。设置类文件的目标目录。目标目录必须已经存在；`javac`\
  \ 不会创建它。如果一个类是一个包的一部分，`javac` 会将类文件置于与包同名的子文件夹下，根据需要生成目录。例如，如果你指定 `-d project/class/A`\
  \ 且类名为 `project.class.A.Tstpck`，那么类文件名为 `/project/class/A/Tstpck.class`。从前面的图 8.6，可以非常清楚地理解该目录结构。\n\
  \n如果未指定 `-d`，`javac` 将将类文件放在与源文件相同的目录中。\n\n### Java 包的关键考虑因素\n\n以下是 Java 包的关键考虑因素：\n\
  \n*   未放置在命名包中的类类属于与当前目录相关的（匿名）默认包。在编写小型程序时，为了简单起见，我们通常只将所有内容留存在默认包中。然而，包的作用是帮助我们在编写中大型程序时保持逻辑清晰，我们应该充分利用它们。\n\
  *   给定包中具有 `protected` 修饰符的类成员在同一包内的任何地方可用，也可以在另一个包中给定包内类的任何子类中使用。\n*   给定包中具有默认访问权限（无特定访问修饰符）的类成员仅在给定包内可用。\n\
  *   语句 `import java.awt.*;` 并不意味着你同时也获得了通过使用该语句 `import java.awt.event.*;` 所能获得的库的特定部分。\n\
  \n注意：包实际上并不真的包含其他包，尽管分层命名方案可能暗示它们是包含。例如，使用 `import` 语句\n\n如果你花时间思考包名与用于存储包文件的目录结构之间的关系，这一点应该是显而易见的，但当包名关系紧密时，很容易对包之间的关系做出错误的假设。\n\
  \n### 使用包的计算器程序\n\n在本节中，我们正尝试演示如何在 Java 中借助用户自定义包来创建一个简单的计算器。为了实现这一点，我们创建了五个包含包定义的不同\
  \ `.java` 文件。创建了包 `cal` 用于定义五个类，即 `add`、`sub`、`mul`、`div` 和 `fact`。源代码如下。我们还必须使用\
  \ `javac` 命令单独编译这些包定义。\n\n```java\npackage cal;\n\npublic class add{\npublic static\
  \ float operation(float a,float b)\n{\nreturn a+b;\n}\n\n}\n```\n\n要编译前面的源代码，输入\
  \ `javac add.java`：\n\n```java\npackage cal;\n\npublic class sub{\npublic static\
  \ float operation(float a,float b)\n{\nreturn a-b;\n}\n}\n```\n\n要编译前面的源代码，输入 `javac\
  \ sub.java`，如下：\n\n```java\npackage cal;\n\npublic class mul{\npublic static float\
  \ operation(float a, float b)\n{\nreturn a*b;\n}\n}\n```\n\n要编译前面的源代码，输入 `javac\
  \ mul.java`：\n\n```java\npackage cal;\n\npublic class div{\npublic static float\
  \ operation(float a, float b){\nif(b!=0)\nreturn a/b;\nreturn -999;\n}\n}\n```\n\
  \n要编译前面的源代码，输入 `javac div.java`：\n\n```java\npackage cal;\n\npublic class fact\n\
  {\npublic static float operation(int a)\n{\nfloat mul=1;\nfor(int i=1;i<=a;i++)\n\
  mul*=i;\nreturn mul;\n}\n}\n```\n\n要编译前面的源代码，输入 `javac fact.java`。完整的代码如下：\n\n```java\n\
  import cal.*;\n\nimport java.util.*;\n\npublic class calculate{\npublic static void\
  \ main(String args[]){\nint ch=0;\nScanner in=new Scanner(System.in);\nSystem.out.println(\"\
  Enter,\\n 1 for addition\\n2 for subtraction\\n3 for multiplication\\n4 for division\\\
  n5 for Factorial\");\nch=in.nextInt();\nfloat a,b;\nint c;\nswitch(ch){\ncase 1:\n\
  System.out.println(\"Result is: \"+add(a,b));\ncase 2:\nSystem.out.println(\"Result\
  \ is: \"+sub(a,b));\ncase 3:\nSystem.out.println(\"Result is: \"+mul(a,b));\ncase\
  \ 4:\nSystem.out.println(\"Result is: \"+div(a,b));\ncase 5:\nSystem.out.println(\"\
  Result is: \"+fact(c));\ndefault:\nSystem.out.println(\"INVALID OPTION\");\n}\n\
  }\n```\n*(注：原文文本在 switch 语句中缺少函数调用，此处根据提供的类定义进行了重构)*\n\n在前面的程序中，我们通过 `import cal.*`\
  \ 使用了包 `cal`。然后通过一个菜单驱动程序引入了加、减、乘、除和阶乘五个选项。当用户选择一个特定选项时，会调用相应的计算器函数。输出见图 8.7：\n\n\
  ![](img/Figure_8.7.png)\n\n图 8.7：使用自定义包的计算器程序\n\n### 总结\n\n本章探讨了包的基本原理、结构、指南、特性以及各种类型的包（如内置包和自定义包）。在此背景下，详细说明了如何实现\
  \ Java 编程。还通过图示展示了使用 `-d` 选项的编译过程。演示了一个基于包的计算器应用，以简化包的概念和用法。\n\n### 示例问题\n\n1. 结合示例定义包的类型（Bloom's\
  \ Level-1）\n2. 对比预定义包和自定义包（Bloom's Level-2）\n3. 画出自定义包的目录层级结构（Bloom's Level-3）\n\
  4. 实例阐述包的概念。（Bloom's Level-4）\n5. 创建一个自定义包来实现 Java 编程中关于栈和队列的不同操作（Bloom's Level-5）\n\
  \n### 单选题\n\n1. Java 中用以下哪个关键字来定义包？\n   - `Pkg`\n   - `package`\n   - `pkg`\n  \
  \ - `Package`\n\n2. 导入整个包 `pkg` 的正确方式是哪一个？\n   - `import pkg.`\n   - `Import pkg.`\n\
  \   - `import pkg.*;`\n   - 以上均不是\n\n\n\n\n\n### 3. 下面哪个包包含了所有的标准 Java 类？\n\n1.\
  \ `lang`\n2. `java.io`\n3. `util`\n4. `java`\n\n### 4. 可能存在多少种类型的 Java 包？\n\n1.\
  \ `1`\n2. `2`\n3. `3`\n4. `4`\n\n### 5. `java.awt` 包包含 ____。\n\n1. 你将得到编译错误\n2.\
  \ 网络基础设施类的集合\n3. 创建小应用程序（applet）类的集合\n4. 封装了基础类\n\n### 6. 语句 `package name;` 规定了\n\
  \n1. 你可以调用用户定义的\n2. 你可以使用包声明删除该包\n3. 你可以使用包声明指定该包\n4. 无\n\n### 7. 包可以是 ________。\n\
