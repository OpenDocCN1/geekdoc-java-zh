  \n![](img/fm1.png)\n\n---\n\n# [第 2 章 Java 基础构建模块]\n\n## 引言\n\n本章介绍了 Java 数据类型、Java\
  \ 运算符、Java 表达式、条件语句和循环概念。让我们先讨论强类型语言的概念。Java 是静态类型语言，也是强类型语言，因为在 Java 中，每种数据类型（如整数、字符、十六进制、压缩小数等）都是作为编程语言的一部分被预定义的。\n\
  \n## 结构\n\n本章解释了以下概念：\n\n*   作为强类型语言的 Java\n*   Java 标记\n*   数据类型层次\n*   非基本数据类型或引用类型\n\
  *   Java 运算符\n*   条件语句\n*   Java 循环\n\n## 目标\n\n本章旨在提供标记、数据类型和变量的基本细节，并介绍强类型语言的概念。数据类型的层次结构和变量类型是本章学习和广泛测试的重要主题。后续章节将探讨基本类型和非基本类型的概念。\n\
  \n### 作为强类型语言的 Java\n\nJava 是静态类型语言，也是强类型语言，因为在 Java 中，每种数据类型（如整数、字符、十六进制、压缩小数等）都是作为编程语言的一部分被预定义的。\n\
  \n在 Java 中，每种数据类型在使用之前必须声明。声明指定了类型。\n\n### Java 标记\n\n最小的编程构建单元被称为标记。Java 中有五种标记：关键字、字面量、标识符、分隔符和运算符。\n\
  \n### 关键字\n\n关键字在编译器中具有特定的含义。以下任何项不能作为标识符：\n\n| | continue | for | new | switch\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| assert | default | goto | package |\
  \ synchronized |\n| boolean | do | if | private | this |\n| break | double | else\
  \ | protected | throw |\n| case | enum | implements | public | throws |\n| char\
  \ | extends | instance of | return | transient |\n| class | finally | interface\
  \ | static | void |\n| catch | final | long | strictfp | volatile |\n| const | float\
  \ | native | super | while |\n\n表 2.1 Java 关键字（注：原文无标题，补全）\n\n根据前表提供的详细信息，我们使用 #\
  \ 符号的次方来表示关键字在 Java 新版本（JDK 版本）中的添加情况。单个 `#` 表示未使用。双符号 `##` 表示关键字添加到 1.2 版本。三连 `###`\
  \ 表示关键字添加到 1.4 版本。四个 `####` 表示关键字添加到 5.0 版本。\n\n### Java 字面量\n\n每个可以通过变量授权的恒定评估值被称为字面量。例如：\n\
  \n```java\nint age=23;\n```\n\n在示例中，`age` 是整数字面量。我们可以这样写字符串字面量：\n\n```java\nString\
  \ m=\"Hello\";\n```\n\n### Java 标识符\n\n标识符是变量、类、方法、包和接口的名称。标识符是程序员在程序使用的单词。除了程序员指定的，大多数标识符没有预定义的含义。创建标识符的规则如下所示：\n\
  \n| 规则编号 | 规则 |\n| :--- | :--- |\n| 1 | 标识符由字母、数字、下划线字符 (_) 和美元符号 ($) 组成 |\n| 2\
  \ | 第出现的字符必须是 Unicode 标准中的非数字字符。 |\n\n表 2.2 创建标识符的规则\n\n\n\n\n\n| 3 | 根据此规则，后续字符可以取数字。\
  \ |\n| 4 | 不允许使用下划线 `_` 和符号 `$` 作为第一个字符。 |\n| 5 | 从本质上说，Java 语言是区分大小大小的。因此，`Sum`\
  \ 和 `sum` 被视为不同的标识符。 |\n\n表 2.2: Java 标识符的规则\n\n### Java 中的分隔符\n\n分隔符被称为标点符号。有一些基础分隔符，在表\
  \ 2.3 中以表格形式列出并附有说明：\n\n| 符号 | 含义 |\n| :--- | :--- |\n| `()` | 指定参数列表、表达式以及表达式中的优先级，并用于类型转换。\
  \ |\n| `[]` | 表示索引值 |\n| `{}` | 用于类定义，表示代码块、字符串和数组对象的初始化。 |\n| `;` | 用于每个语句后的终止符号\
  \ |\n| `,` | 用于参数列表分离、变量分离、for 循环中表达式的分 |\n| `.` | 用于通过对象调用方法、使用对象进行数据成员初始化以及维护包层次结构。\
  \ |\n\n表 2.3: Java 分隔符列表\n\n### Java 中的运算符\n\n运算符是告诉计算机执行某些数学或逻辑操作的符号。运算符在程序中处理数据和变量。Java\
  \ 具有算术运算符（`+`、`-`、`*`、`/`）、赋值运算符 `=`、比较运算符（`<=`、`>=`、`==`）、逻辑运算符（`&&`、`||`）和位运算符（`&`、`|`）。它们将在本章后面讨论。在令牌之后，将在下一节介绍\
  \ Java 数据类型的层次结构。\n\n### 数据类型的层次结构\n\n数据类型指定了变量中可以存储的不同大小和值。Java 中有两种类型的数据类型（图 2.1）：\n\
  \n- **基本数据类型**：基本数据类型包括 `Boolean`、`char`、`byte`、`short`、`int`、`long`、`float` 和 `double`。Java\
  \ 语言预定义并由关键字命名的类型称为 Java 中的基本数据类型。\n- **非基本数据类型**：非基本数据类型包括类、接口和数组。\n\n![](img/Figure_2.1.png)\n\
  \n图 2.1: 数据类型的层次结构\n\n### 基本数据类型\n\n基本数据类型有几种类型。它们在图 2.2 中列出及其大小：\n\n![](img/Figure_2.2.png)\n\
  \n图 2.2: 基本数据类型的示例\n\n让我们详细讨论不同的基本数据类型：\n\n- **Boolean 数据类型**：`Boolean` 数据类型只有两个可能的值\
  \ `true` 和 `false`，用于表示逻辑。使用此数据类型管理简单的 `true/false` 标志。虽然 `Boolean` 数据类型可能只指定一条信息，但无法确定其精确大小。\n\
  \  示例：`Boolean one = false`\n\n- **Byte 数据类型**：`Byte` 是最基本的整数类型。作为基本数据类型的示例，考虑 `byte`，它是一个具有补码形式和\
  \ 8 位有符号大小的整数。它的值范围从 `(-2^(8-1))` `-128` 到 `(-2^(8-1) - 1)` `127`（包含）。该变量的值范围为 `-128`\
  \ 到 `127`。默认情况下，它的值为 `0`。在最需要节省内存的大数组中，应用 `byte` 类型以节省内存。一个 `byte` 占据的空间比整数少四倍。因此，它节省了空间。此外，你可以用它代替\
  \ `int` 数据类型。\n  示例：`byte bt=127;`\n\n- **char 数据类型**：`char` 类型表示单个 16 位的 Unicode\
  \ 字符。它的取值范围在 `u0000`（或 `0`）到 `\\uffff`（或 `65,535`）之间。字符存储在 `char` 数据类型中。\n  示例：`char\
  \ letter A = 'A'`\n\n- **short 数据类型**：`short` 类型是补码的有符号 16 位整数。它的取值范围为 `-32,768`\
  \ 到 `32,767`（包含）。它的范围分别包括 `-32,768` 和 `32,767`。它的初始值为 `0`。类似于 `byte` 数据类型可以被用来节省内存，`short`\
  \ 类型也可以同样这样做。整数的大小是 `short` 大小的两倍。\n  示例：`short s = 10000, short r = -5000`\n\n\
  - **int 数据类型**：`int` 类型是补码的有符号 32 位。它的取值范围在 `-2,147,483,648`（`-2³¹`）和 `2,147,483,647`（`2³¹\
  \ -1`）之间（包含）。数字范围在 `-2,147,483,648` 和 `2,147,483,647` 之间。除非指定，否则编译器会为这些字段分配一个默认值，通常是\
  \ `0`。\n  示例：`int a = 10000, int b = 20000`\n\n- **long 数据类型**：`long` 类型是 64 位整数。它的范围是\
  \ `-9,223,372,036,854,775,808`（`-2⁶³`）到 `9,223,372,036,854,775,807`（`2⁶³ -1`）（包含）。它的初始值为\
  \ `0`。\n  示例：`long a = 10000L, long b = 20000L`\n\n- **float 数据类型**：单精度 32 位 IEEE\
  \ 754 浮点表示 `float` 类型。它用于小数。\n  示例：`float f1 = 12.3f`\n\n- **double 数据类型**：双精度 64\
  \ 位 IEEE 754 浮点表示 `double` 类型。它用于小数。\n  示例：`double d1 = 12.3`\n\n### 数据类型的默认值\n\n\
  在指定字段时并不总是需要赋值。如果定义了，编译器将为它们分配相应的默认值。根据数据类型，这通常等于零或空。然而，依赖这种默认值通常被认为是不良的做法。\n\n\
  | 数据类型 | 默认值 |\n| :--- | :--- |\n| byte | 0 |\n| short | 0 |\n| int | 0 |\n| long\
  \ | 0L |\n| float | 0.0f |\n| double | 0.0 |\n| char | \\u0000 |\n| string | null\
  \ |\n| boolean | false |\n\n表 2.4: 基本类型的默认值\n\n### Java 中的变量类型\n\n让我们讨论 Java 程序中可能的各种变量类型：\n\
  \n- **实例变量（非静态字段）**：从技术角度（面向对象编程），对象的 own 存储在非静态字段中，即没有指定 `static` 关键字的字段。它们被认为是实例变量，因为它们的值对于类的每个实例都是唯一的。\n\
  \  ```\n  class test {\n    int var;\n  }\n  ```\n  这种类型的变量被称为实例变量。如果我们创建了 `test`\
  \ 类的多个对象，每个对象将获得自己的拷贝。假设我们使用以下语法创建了三个对象 `t1`、`t2` 和 `t3`。\n  ```\n  test t1=new\
  \ test();\n  test t2=new test();\n  test t3=new test();\n  ```\n\n- **类变量（静态字段）**：我们可以说类变量是任何前面带有有\
  \ `static` 修饰符的字段。此外，无论创建了多少个类对象，该变量只有一个副本可用，也就是说，无论该类被实例化多少次。\n  ```\n  class test\
  \ {\n    static int var;\n  }\n  ```\n\n\n\n\n\n```java\n}\n\ntest t1=new test();\n\
  \ntest t2=new test();\n\ntest t3=new test();\n```\n\n静态变量（只创建一份副本）被所有创建的对象共享，其概念见图\
  \ 2.4：\n\n![](img/Figure_2.4.png)\n\n图 2.4: 静态变量\n\n### 局部变量\n* **局部变量**：由于对象在字段中存储其状态，因此局部变量被方法用于来存储其临时状态。局部变量的一个示例是\
  \ `void disp(int cnt)`。\n\n```java\nclass test\n{\n    void get_value(int x, int\
  \ y)\n    {\n}\n}\n```\n\n在前面的代码中，变量 `x` 和 `y` 被称为局部变量。局部变量仅对声明它们的方法可见；它们无法从类的其他部分访问。创建适当变量名的规则列在表\
  \ 2.5 中：\n\n| 规则编号 | 含义 |\n| --- | --- |\n| 1 | 变量名本质上是区分大小写的。 |\n| 2 | 任何以字母、美元符号\
  \ `$` 或下划线字符 `_` 开头的有效标识符都可以作为变量名。此外，它具有无限长度并由 Unicode 字母和数字组成。 |\n| 3 | 虽然使用字母而不是\
  \ `$` 或 `_` 开始变量名是标准做法，但并非总是如此。此外，按照习惯，永远不使用美元符号。 |\n| 4 | 美元符号可能偶然出现在自动生成的名称中，但绝不应该出现在变量名中。类似的规则也适用于下划线字符；虽然在理论上用\
  \ `_` 开头变量名是允许的，但不建议这样做。不能有空格。 |\n| 5 | 字母、数字、美元符号和下划线字符都可以作为额外的字符。此规则也取决于惯例和常识。\
  \ |\n\n表 2.5: 变量命名规则\n\n在为变量命名时，不要使用容易混淆的缩写，而要使用完整的单词。这样做你的代码将更更容易阅读和理解。在许多情况下，这还让你的源代码具有自文档化特征；例如，字段名为\
  \ `name`、`age` 和 `roll number` 会比使用 `nm`、`ae` 和 `rl` 等缩写要逻辑得多。你选择名称也不能是关键字或受限词。\n\
  \n如果你选择的名称只有一个单词，请将该单词全部小小写。如果它是由多个单词组成的，请将每个后续单词的首字母大写。根据规范，名称 `savings account`\
  \ 和 `current account` 是最好的示例。如果你的变量中存储了一个常量值，例如 `static final int VALUE_PI = 3.142`，惯例略有不同，即每个字母都大写，并在后续单词之间放置下划线字符\
  \ `_`。但在任何地方都不鼓励使用下划线字符 `_`。\n\n在接下来的段落中，下方提供了关于数据类型层次的详细讨论及图。在下一节中，将通过示例描述类型转换和强制转换的概念。在下一节中，我们将通过示例讨论类型转换和强制转换的概念。\n\
  \n### 强制转换和类型转换\n\n强制转换（cast）是一种告知编译器将进行转换且可能发生数据丢失的方法。如果两个类型是兼容的，Java 将自动执行转换。例如，始终可以将一个\
  \ `int` 值赋值给 `long` 变量。然而，没有定义从 `double` 到 `byte` 的自动转换。要做到这一点，你必须显式地转换数据类型。\n\n\
  自动类型转换需要满足两个条件：\n* 两个类型是兼容，\n* 目标类型大于源类型。\n\n如果满足这两个条件，就会发生宽转换操作。顺序是：\n\n`Byte`\
  \ | `short` | `int` | `long` | `float` | `double`，因此我们可以将 `int`（4 字节）变量转换为 `long`（8\
  \ 字节）类型变量。此外，数据类型 `float` 也可以轻松转换为 `double` 类型变量。\n\n如果你想将一个 `int`（4 字节）值赋值给 `byte`（1\
  \ 字节）变量，这种转换被称为窄转换，因为 `byte` 比 `int` 小。要在不兼容的类型之间创建转换，你必须按照以下方式使用强制转换：\n\n`(target_type)\
  \ value`\n\n示例：\n\n```java\npublic class typecn\n{\n    public static void main(String\
  \ s[])\n    {\n        int num=65;\n        double dnum=(double)num;\n        System.out.println(\"\
  \ int type is converted into double type \"+\" \"+dnum);\n    }\n}\n```\n\n在前面的代码中，整数类型的变量\
  \ `num` 被转换为 `double` 并保存到 `dnum`，`dnum` 是一个 `double` 变量。所以这是一个从数据类型 `int` 到 `double`\
  \ 类型转换的简单示例。\n\n### 非基本数据类型或引用类型](#contents.xhtml_sc2_46a)\n\n让我们对 Java 中提供的不同非基本数据类型给出简单定义：\n\
  * **String**：字符串序列的概念在 Java 编程中被广泛使用。字符串被视为对象。示例：`String msg = \"A simple program\"\
  ;`\n* **Array**：数组在声明为实例变量或局部变量但未初始化时，会被赋值默认值。示例：`int num_langs[];`\n  `num_langs=new\
  \ int[10];`\n* **Class**：类是可以创建对象的自定义数据类型。它模拟现实世界中的某些事物，由一组数据和一组操作数据的方法组成。示例：\n\
  ```java\nclass Point\n{\n    int x;\n    int y;\n    void getCoordinate();\n}\n\
  ```\n* **Object**：对象是类的实例。其数据类型是类。在初始化之前，它指向 `null`。示例：`Point p1=new Point();`\n\
  * **Annotation**：允许将元数据（关于数据的数据）链接到程序组件。\n  * 在最简单的形式下，注解表示为 `@Entity`\n  * `@`\
  \ 符号指示编译器后面是注解。在下面的示例中，注解名称为 `Override`：\n    ```java\n    @Override\n    void mySupMethod()\
  \ { }\n    ```\n  * 注解可以包含元素，这些元素可以是命名的或未命名的，并且有值：\n    ```java\n    @Author(\n\
  \        name = \"Subhajit Adhikari\",\n        date = \"29/07/2023\"\n    )\n \
  \   ```\n  * 注解可以应用于声明：类、字段、方法和其他程序元素。按照习惯，每个注解单独占一行。\n* **Enumeration**：对一组呈现相关备选项的对象的引用。\n\
  \  ```java\n  public enum Stream {\n    CSE, IT, ME, EE, ECE, CE\n  }\n  ```\n*\
  \ **Interface**：它提供了由 Java 类实现的公共 API。\n  ```java\n  interface Operatable {\n  \
  \  Boolean startTV( );\n    void stopTV( );\n    int volumeChange(int increment,\
  \ int decrement);\n    int channelChange(int nextCh);\n  }\n  ```\n\n### Java 中的运算符](#contents.xhtml_sc2_47a)\n\
  \n算术运算符、关系运算符、位运算符、逻辑运算符、赋值运算符和短路运算符以表格形式结合示例进行讨论。\n\n### 算术运算符\n\n假设两个变量 `S` 和\
  \ `T` 分别被赋值为 7 和 5。让我们看下方的表 2.6 以理解运算符、运算符的含义以及带有输出的代码示例：\n\n| 运算符 | 运算符的含义 | 代码示例\
  \ | 输出 |\n| --- | --- | --- | --- |\n\n\n\n\n\n| `+` (加法) | 将运算符两侧的值相 | `S+T` |\
  \ 12 |\n| `-` (减法) | 从左侧操作数减去右侧操作数 | `S-T` | 2 |\n| `*` (乘法) | 将运算符两侧的值相乘 | `S*T`\
  \ | 35 |\n| `/` (除法) | 用左侧操作数除以右侧操作数 | `S/T` | 1 |\n| `%` (取模) | 左侧操作数除以右侧操作数并返回余\
  \ | `S%T` | 2 |\n| `++` (自增) | 将操作数的值加 1 | `S++` | 8 |\n| `--` (自减) | 将操作数的值减 1\
  \ | `--T` | 4 |\n\n表 2.6: 算术运算符示例\n\n## 关系运算符](#contents.xhtml_sc3_49a)\n\n假设变量\
  \ `S` 存储数字 7，变量 `T` 存储数字 5。不同的关系运算符已在下方的表 2.7 中通过示例进行了解释：\n\n| 运算符 | 运算符含义 | 代码示例\
  \ | 输出 |\n| --- | --- | --- | --- |\n| `==` (等于) | 检查两个操作数的值是否相等。如果是，则条件为真。 | `(S==T)`\
  \ | false (not true) |\n| `!=` (不等于) | 检查两个操作数的值是否相等。如果值不等，则条件为真。 | `(S!=T)` | true\
  \ (true) |\n| `>` (大于) | 检查左侧操作数的值是否大于右侧操作数的值。如果是，则条件为真。 | `(S>T)` | true (true)\
  \ |\n| `<` (小于) | 检查左侧操作数的值是否小于右侧操作数的值。如果是，则条件为真。 | `(S<T)` | false (false) |\n\
  | `>=` (大于等于) | 检查左侧操作数的值是否大于等于右侧操作数的值。如果是，则条件为真。 | `(S>=T)` | false (false) |\n\
  | `<=` (小于等于) | 检查左侧操作数的值是否小于等于右侧操作数的值。如果是，则条件为真。 | `(S<=T)` | true (true) |\n\n\
  表 2.7: 关系运算符示例\n\n## 位运算运算符](#contents.xhtml_sc3_50a)\n\n如果 `a = 60` 且 `b = 13`，现在在二进制格式下，它们将如下：\n\
  \n`a = 0011 1100`,\n`b = 0000 1101`,\n`a&b = 0000 1100`,\n`a|b = 0011 1101`,\n`a^b\
  \ = 0011 0001=49` (十进制)\n\n在表 2.8 中，已经详细讨论了所有的位运算运算符：\n\n| 运算符 | 运算符含义 | 代码示例 |\
  \ 输出 |\n| --- | --- | --- | --- |\n| `&` (位与) | 二进制与运算符，如果位在两个操作数中都存在，则复制到结果中 |\
  \ `a&b` | 12 |\n| `|` (位或) | 二进制或运算符，如果位在两个操作数中都存在，则将其复制 | `a|b` | 61 |\n| `^` (位异或)\
  \ | 二进制异或运算符，如果位在两个操作数中都被设置，则将其复制 | `a^b` | 49 |\n| `~` (位取反) | 二进制按取反运算符是一元运算符，其作用是翻转位\
  \ | `~a` | -61 |\n| `<<` (左移) | 二进制左移运算符。左侧操作数的值根据右操作数指定的位数向左移动 | `a<<1` | 120 |\n\
  | `>>` (右移) | 二进制右移运算符。左侧操作数的值根据右操作数指定的位数向右移动 | `b>>1` | 6 |\n| `>>>` (零填充右移) |\
  \ 右移零填充运算符。左侧操作数的值根据右操作数指定的位数向右移动，移出的位用零填充 | `b>>>1` | 6 |\n\n表 2.8: 位运算运算符示例\n\n\
  ## 逻辑运算符](#contents.xhtml_sc3_51a)\n\n下表列出了逻辑运算符。假设布尔变量 `A` 为真，变量 `B` 为假，那么 `A &&\
  \ B` 为假。\n\n| 运算符 | 描述 | 示例 |\n| --- | --- | --- |\n| `&&` (逻辑与) | 如果两个语句都为真，则返回真\
  \ | `(A && B)` 为假 |\n| `||` (逻辑或) | 如果其中一个语句为真，则返回真 | `(A || B)` 为假 |\n| `!` (逻辑非)\
  \ | 反转结果，如果结果为真，则返回假 | `!(A && B)` 为真 |\n\n表 2.9: 逻辑运算符示例\n\n## 赋值运算符](#contents.xhtml_sc3_52a)\n\
  \n假设我们有三个变量：`A=10`，`B=20`，`C=0`。让我们在表 2.10 中讨论赋值运算符及其工作方式：\n\n| 运算符 | 描述 | 示例 |\n\
  | --- | --- | --- |\n| `=` | 赋值 | `C=A` |\n| `+=` | 加法赋值 | `C+=B` |\n| `-=` | 减法赋值\
  \ | `C-=B` |\n| `*=` | 乘法赋值 | `C*=B` |\n| `/=` | 除法赋值 | `C/=B` |\n| `%=` | 取模赋值\
  \ | `C%=B` |\n| `&=` | 位与赋值 | `C&=B` |\n| `|=` | 位或赋值 | `C|=B` |\n| `^=` | 位异或赋值\
  \ | `C^=B` |\n| `~=` | 位取反赋值 | `C~=B` |\n| `<<=` | 左移赋值 | `C<<=B` |\n| `>>=` | 右移赋值\
  \ | `C>>=B` |\n| `>>>=` | 零填充右移赋值 | `C>>>=B` |\n| `&&=` | 逻辑与赋值 | `C&&=B` |\n| `||=`\
  \ | 逻辑或赋值 | `C||=B` |\n| `!==` | 不等于赋值 | `C!==B` |\n\n表 2.10: 赋值运算符示例\n\n## 短路运算符](#contents.xhtml_sc3_53a)\n\
  \n逻辑与`&&`）和逻辑或`||`）是短路运算符。短路运算符是指不一定评估所有操作数的运算符。\n\n### 示例 1\n假设你有两个操作数 `x` 和 `y`，那么\
  \ `x && y` 在 `x` 为真时才会评估 `y`（如果 `x` 为假）。\n\n让我们考虑以下代码片段：\n\n```\nif (4==5 && 5==10)\
  \ {\n    System.out.println(\"这一行不会被打印\");\n}\n```\n解释：表达式 `4==5 && 5==10` 从左到右评估。评估\
  \ `4==5`，发现 `4==5` 为假。\n\n### 示例 2\n假设你有两个操作数 `x` 和 `y`，那么 `x || y` 在 `x` 为假时才会评估\
  \ `y`（如果 `x` 为真）。\n\n让我们考虑以下代码片段：\n\n```\nif (4==4 || 5==6) {\n    System.out.println(\"\
  这一行会被打印\");\n}\n```\n解释：当运算符的左侧的值为真时。评估 `4==4`，发现 `4==4` 为真。\n\n注意：当 Java 发现 `&&`\
  \ 运算符的左侧值为假时，Java 就会放弃并声明整个表达式为假。这被称为短路表达式评估。\n\n## Java 运算符优先级](#contents.xhtml_sc4_54a)\n\
  \n在讨论了 Java 运算符之后，我们将在下一节中简要讨论 Java 中的运算符优先级。\n\n\n\n\n\n不同的运算符按优先级列在表 2.11 中。最顶部的运算符优先级最高，其次次之，以此类推。优先级较高的运算符会在优先级较低的运算符之前被检查。表格中同一单元格内的运算符被认为具有相同的优先级。当同一个表达式中出现相同优先级的运算符时，必须遵循特定规则。\n\
  \n所有二元运算符都从左到右求值。只有赋值运算符按照从右到左的规则求值。详情见图 2.5。\n\n![](img/Figure_2.5.png)\n\n图 2.5:\
  \ 运算符优先级\n\n## 条件语句语句](#contents.xhtml_sc2_55a)\n\n在我们目前为止检查的程序中，每条语句都按照给定的顺序执行一次。大多数程序要复杂得多，因为语句的顺序和每个语句执行的次数可能会变化。我们使用“控制流”一词来指代程序中的语句排序。\n\
  \n### If 条件语句](#contents.xhtml_sc3_56a)\n\n条件语句是所有控制流语句中最基础的一种。它指令程序只有在特定测试返回真（true）时才执行特定的代码块。如果该测试返回假（false），控制将移动到\
  \ if-then 表达式的结论。在图 2.6 中，给出了带有示例的 if 语句流程图：\n\n![](img/Figure_2.6.png)\n\n图 2.6:\
  \ If 语句示例流程图\n\n语法：\n\n```\nif (condition) {\n    // 如果条件为真则执行代码块\n}\n```\n\n注意\
  \ `if` 是小写字母。大写字母（`If` 或 `IF`）将产生错误。\n\n在下面的示例中，我们测试两个值来判断 20 是否大于 18。如果条件为真，则打印某些文本：\n\
  \n示例\n\n```\nif (20 > 18) {\n    System.out.println(\"20 is greater than 18\");\n\
  }\n```\n\n### If else 条件](#contents.xhtml_sc3_57a)\n\n当 if 子句求值为假时，if-then-else\
  \ 语句提供了另一种执行路径。在图 2.7 中，给出了带有示例的 if-else 语句流程图：\n\n![](img/Figure_2.7.png)\n\n图\
  \ 2.7: If-Else 语句示例流程图\n\n使用 `else` 语句来指定条件为假时要执行的代码块。\n\n语法\n\n```\nif (condition)\
  \ {\n    // 如果条件为真则执行代码块\n} else {\n    // 如果条件为假则执行代码块\n}\n```\n\n示例\n\n```java\n\
  int time = 20;\nif (time < 18) {\n    System.out.println(\"Good day.\");\n} else\
  \ {\n    System.out.println(\"Good evening.\");\n}\n// 输出 \"Good evening.\"\n```\n\
  \n### 嵌套 if 条件](#contents.xhtml_sc3_58a)\n\n当一个 if 语句被放在另一个 if 语句内部，它被称为嵌套 if 结构。在图\
  \ 2.8 中，给出了带有示例的嵌套 if 语句流程图：\n\n![](img/Figure_2.8.png)\n\n图 2.8: 嵌套 If 语句示例流程图\n\
  \n语法：\n\n```\nif(expression_1) {\n    // 当 expression_1 为真时执行\n    if(expression_2)\
  \ {\n        // 当 expression_2 为真时执行\n    }\n}\n```\n\n示例\n\n```java\npublic class\
  \ Test {\n    public static void main(String args[]) {\n        int x = 30;\n  \
  \      int y = 10;\n        if( x == 30 ) {\n            System.out.print(\"X =\
  \ 30\");\n            if( y == 10 ) {\n                System.out.print(\"X = 30\
  \ and Y = 10\");\n            }\n        }\n        System.out.print(\"Outside the\
  \ nested if \");\n    }\n}\n```\n\n### 嵌套 if else 语句](#contents.xhtml_sc3_59a)\n\
  \nif-else 梯形语句是基于嵌套 if 条件的一组条件。if-else 梯形条件从上到下执行表达式。一旦条件为真，就会执行对应的语句，并跳过剩余的梯形规则。在图\
  \ 2.9 和图 2.10 中，给出了带有示例的嵌套 if-else 语句流程图：\n\n![](img/Figure_2.9.png)\n\n图 2.9: 嵌套\
  \ If-else 语句流程图\n\n![](img/Figure_2.10.png)\n\n图 2.10: 嵌套 If-else 语句示例\n\n语法：\n\n\
  ```\nif (condition1) {\n    // 如果 condition1 为真则执行代码块\n} else if (condition2) {\n\
  \    // 如果 condition1 为假且 condition2 为真则执行代码块\n} else {\n    // 如果 condition1 为假且\
  \ condition2 为假则执行代码块\n}\n```\n\n示例：\n\n```java\nint time = 22;\nif (time < 10)\
  \ {\n    System.out.println(\"Good morning.\");\n} else if (time < 18) {\n    System.out.println(\"\
  Good day.\");\n} else {\n    System.out.println(\"Good evening.\");\n}\n// 输出 \"\
  Good evening.\"\n```\n\n## Java 中的循环](#contents.xhtml_sc2_60a)\n\n我们已经介绍了 Java 中条件语句的概念及其工作原理。现在，在下一节中将给出不同循环的工作程序。我们将讨论\
  \ for、while 和 do-while 循环这三种基本循环。循环的概念用于在代码块层面上重复执行相同的工作，直到指定的条件为假。\n\n### For 循环](#contents.xhtml_sc3_61a)\n\
  \n当你确切知道想要循环执行代码块的次数时，请使用 for 循环而不是 while 循环。for 语句使得高效地对值范围进行迭代成为可能。由于循环持续持续直到满足某个条件，程序员经常称之为\
  \ for 循环。在图 2.11 中，给出了带有示例的 for 循环流程图：\n\n![](img/Figure_2.11.png)\n\n图 2.11: for\
  \ 循环示例流程图\n\n语法：\n\n```\nfor (statement 1; statement 2; statement 3) {\n    // 要执行的代码\n\
  }\n```\n\nfor 循环解释：\n1. `statement 1`: 循环开始时执行初始化语句。\n2. `statement 2`: 在循环期间检查条件。如果为真，则执行循环体。\n\
  3. `statement 3`: 迭代语句并返回步骤 2。\n\n### 标签 for 循环](#contents.xhtml_sc4_62a)\n\n指示执行控制循环的有效变量名称称为标签。Java\
  \ 中带标签 for 的示例：\n\n```java\npublic class lb_loop {\n    public static void main(String\
  \ args[]) {\n        m:\n        for(int i=0;i<5;i++) {\n            n:\n      \
  \      for(int j=0;j<5;j++) {\n                if(j==2) {\n                    System.out.println(\"\
  Exit from the loop\");\n                    break m;\n                }\n      \
  \      }\n        }\n    }\n}\n```\n\n### While 循环](#contents.xhtml_sc3_63a)\n\n\
  while 循环评估表达式，该表达式必须产生一个布尔值。如果表达式为真，while 循环执行 while 块中的语句。while 语句继续测试表达式并执行其，直到表达式返回假。在图\
  \ 2.12 中，给出了带有示例的 while 循环流程图：\n\n![](img/Figure_2.12.png)\n\n图 2.12: While 循环示例流程图\n\
  \n语法：\n\n```\nwhile (condition) {\n    // 要执行的代码块\n}\n```\n\n在下面的示例中，只要变量 `i` 小于\
  \ 5，循环中的代码就会反复运行：\n\n示例：\n\n```java\nint i = 0;\nwhile (i < 5) {\n    System.out.println(i);\n\
  \    i++;\n}\n```\n\n### Do while 循环](#contents.xhtml_sc3_64a)\n\ndo-while 循环是 while\
  \ 循环的一种变体。该循环在检查条件是否为真之前执行一次代码块，只要条件为真，就会重复循环。在图 2.13 中，给出了带有示例的 do-while 循环流程图：\n\
  \n![](img/Figure_2.13.png)\n\n图 2.13: Do-While 循环示例流程图\n\n语法：\n\n```\ndo {\n   \
  \ // 要执行的代码块\n} while (condition);\n```\n\n下面的示例使用了 do…while 循环。即使条件为假，循环至少至少执行一次，因为代码块在测试条件之前执行：\n\
  \n示例：\n\n```java\nint i = 0;\ndo {\n    System.out.println(i);\n    i++;\n} while\
  \ (i < 5);\n```\n\n\n\n\n\n# for, while 和 do-while 循环的比较\n\n在上一节中，我们已经通过流程图详细学习了\
  \ `for`、`while` 和 `do-while` 循环的语法和代码示例。现在，表 2.11 展示了三种基本循环 `for`、`while` 和 `do-while`\
  \ 之间的比较：\n\n| For 循环 | While 循环 | Do-While 循环 |\n| :--- | :--- | :--- |\n| 用于迭代次数已知的情况。\
  \ | 用于迭代次数未知的情况。 | 用于次数未知的情况。 |\n| 如果条件为假，则不执行循环体。 | 如果条件为假，则不执行循环体。 | 即使条件为假，循环体也会执行一次。\
  \ |\n| 处理集合元素（如数组等数据结构）时，它是更好的选择。 | 用于从命令行获取输入或从方法调用获取特定值。 | 用于获取用户输入，然后检查条件的真假。\
  \ |\n| 在没有条件的情况下，循环将无限重复。 | 在没有条件的情况下，将显示错误。 | 在没有条件的情况下，将显示错误。 |\n| 初始化可以在循环内，也可以在循环外。\
  \ | 初始化始终在循环外。 | 初始化始终在循环外。 |\n| 被称为预测试循环。 | 被称为预测试循环。 | 被称为后测试循环。 |\n\n表 2.11：For、While\
  \ 和 Do-while 循环的比较\n\n## 结论\n\n在本章中，我们涵盖了标记（tokens）、数据类型、类型转换、运算符、条件语句和循环等基础知识，并结合了流程图和代码示例。这些编程结构有助于读者增强从零开始编写\
