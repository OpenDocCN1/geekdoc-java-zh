  | FocusEvent | FocusListener |\n\n### 示例程序\n\n首先，使用 applet 继承类并实现监听器。制作按钮和文本框组件。按钮已注册事件。使用监听器显示消息的代码在接下来的图\
  \ 10.8 中：\n\n![](img/Figure_10.8.png)\n\n图 10.8：显示消息代码\n\n### 总结\n\n本章首先涵盖了 Applet\
