  在本章中，我们试图通过各种示例和图表涵盖 OOP 的许多重要概念，如继承、方法重写、动态方法分发、`super` 关键字、`final` 关键字、抽象类、`interface`\
  \ 以及访问修饰符。本章将让读者了解继承属性的必要性。此外，如果需要使用 `final` 关键字，用户可以限制该属性的使用。抽象等重要概念可以通过详细分析，使用\
  \ `abstract class` 和 `interface` 来理解。OOP 中最重要的概念——访问修饰符以及不同访问修饰符的实际含义已通过表格呈现。最后，通过图表重新定义了访问修饰符的概念，以便读者更好地理解及其应用。\n\
  \n在下一章中，将演示多线程的概念。线程的创建方式也将在下一章中讨论。\n\n## 习题\n\n1. 定义 Java 继承中使用的术语（Bloom 等级-1）\n\
