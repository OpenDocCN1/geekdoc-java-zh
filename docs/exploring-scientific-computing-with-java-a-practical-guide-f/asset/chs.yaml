  \ (images/fm1.png)\n\n## 引言](#contents.xhtml_sc2)\n\n每个人每天都会遇到问题。错误可能会导致错误的输出或终止执行。错误被分为两类。\n\
  \n## 结构](#contents.xhtml_sc2)\n\n在本章中我们将涵盖\n* 错误\n* 异常\n* `try-catch-finally` 块\n\
  * 异常的优势\n* 分组与区分\n\n## 目标](#contents.xhtml_sc2)\n\n`public` 访问修饰符用于：基类可以被同一包中的子类和非子类访问；基类可以被其他包中的子类访问；基类可以被其他包中的非子类访问；以上所有。Java\
  \ 语法对标点的要求非常。\n\n## 错误](#contents.xhtml_sc2)\n\n所有的语法错误都会被 Java 编译器检测并显示。这些错误被称为编译时错误。每当编译器显示错误，它就不会创建\
  \ `.class` 文件。因此，在成功编译和运行程序之前，我们需要修复所有错误。大多数编译时错误是由拼写错误引起的。常见问题：\n\n## 编译错误](#contents.xhtml_sc3)\n\
  \n`... expected`：Java 语法对标点的要求严格。这种错误发生在你忘记在语句结尾加上分号或未平衡括号时。\n\n```java\nclass TstErr1{\n\
  \    public static void main(String s[]){\n        System.out.println(\"Hello\"\
  ) // 错误，缺少分号\n    }\n}\n```\n\n`unclosed string literal`：字符串字面量必须包含在引号内。这种错误在你未能用引号结束字面量时就会发生。\n\
  \n```java\nclass TstErr3{\n    public static void main(String s[]){\n        String\
  \ st=\"Hii;\n        System.out.println(st);\n    }\n}\n```\n\n`illegal start of\
  \ expression`：这种错误发生在预期有表达式但没有找到时：\n* 在 `if` 条件后多了一个右括号：\n  ```java\n  if (a > b)\
  \ ) // 错误，多了一个右括号\n  ```\n* 赋值语句没有提供右侧：\n  ```java\n  mx = ; // 错误，缺少右侧\n  ```\n\
  \n`not a statement`：当语法正确的语句没有出现在要求的位置时，可以指出特定的错误类型：\n* 写了没有赋值运算符的赋值语句：\n  ```java\n\
  \  a ; // 错误，缺少 =\n  ```\n* 拼写 `else` 错误：\n  ```java\n  if (a > b)\n  temp = a;\n\
  \  else ; // 错误，else 拼写错误\n  ```\n\n\n\n\n你没有收到预期的 `else`，因为你不需要创建 `else` 备选项，因此这看起来似乎不是一个好的语句。\n\
  \n## 关于标识符的错误\n不同类型的解释如下：\n\n*   “无法找到符号”（cannot find symbol）错误：这最可能是编译时最常见的错误类型。`Java`\
  \ 中的所有标识符在在使用之前必须先定义，标识符的声明和使用之间的不一致将导致此错误。请仔细检查标识符的拼写。用小写字母代替大写字母，或将字母 `O` 和 `l`\
  \ 与数字 `0` 和 `1` 混淆是非常容易的：\n\n    *   “. . . 已在 . . . 中定义”(already defined in . .\
  \ .)错误：标识符在同一个作用域内只能声明一次，所示：\n        ```java\n        int sum = 0;\n        double\
  \ sum = 0.0; // 错误，sum 已定义\n        ```\n\n    *   “需要数组但发现了 . . ${(array required\
  \ but . . . found）错误：此错误是由尝试对非数组变量进行索引操作引起的，所示：\n        ```java\n        int max(int\
  \ a, int b) {\n            if (a > b) return a;\n            else return b[i]; //\
  \ 错误，b 不是一个数组\n        }\n        ```\n\n### 关于计算的错误\n这些类型的错误结果是由语法上正确但违反了 Java\
  \ 编程语言语义的代码生成的，具体到类型检查规则方面，所述如下：\n\n*   “变量 . . . 可能未初始化”（variable . . . might not\
  \ have been initialized）错误：类中指定的实例变量会被分配一个默认初始值。相反，方法内部创建的局部变量没有，因此在使用之前必须对其进行初始化，无论是在声明中还是在赋值语句中，所示：\n\
  \        ```java\n        void disp(int v) {\n            int d, e;\n          \
  \  d = 2;\n            int h = 1;\n            if(d == v) // 正确\n            h =\
  \ e; // 发现错误，e 未初始化\n            else\n            t = h;\n        }\n        ```\n\
  \n*   “. . . 在 . . . 中无法应用于 . . ${(in . . . cannot be applied to . . .）错误：这种错误信息非常常见，由于方法调用与特定方法声明之间的不一致引起，所示：\n\
  \        ```java\n        void test(int k) { ... }\n        m(15.15); // 错误，字面量类型为\
  \ double，而不是 int\n        ```\n\n*   “运算符 . . . 无法应用于 . . . ,. ${(operator . . .\
  \ cannot be applied to . . .）错误：虽然某些数值类型之间允许隐式类型转换，但运算符仅针对特定类型，所示：\n        ```java\n\
  \        int tm = 5;\n        boolean tn = true;\n        int ts = tm + tn; // 发现错误，不能相加布尔值\n\
  \        double tm= tm + 1.4; // 正确，int 被隐式转换为 double\n        ```\n\n*   “可能丢失精度”（possible\
  \ loss of precision）错误：当尝试在使用显式类型转换的情况下将高精度值赋值给低精度变量时，发生此错误。有趣的是，浮点类型的字面量类型是 `double`，尝试将其赋值给\
  \ `float` 类型的变量会导致此警告，所示：\n        ```java\n        float sm = 0.0; // 发现错误，字面量不是\
  \ float 类型\n        ```\n        正确的做法是使用 `float` 类型的字面量或显式类型转换，所示：\n        ```java\n\
  \        float fsum = 0.0f;\n        float fsum = (float) 0.0;\n        ```\n\n\
  *   “类型不兼容”（incompatible types）错误：Java 会检查表达式的类型与代码语句中赋值操作使用的变量类型是否兼容，如果它们不兼容，就会发生错误，所示：\n\
  \        ```java\n        Boolean bl = true;\n        int at = bt; // 发现错误，不能将布尔赋值给\
  \ int\n        ```\n\n*   “不可转换的类型”（inconvertible types）错误：在此类错误中，并非所有的类型转换都是合法的。示例如下：\n\
  \        ```java\n        boolean bt = true;\n        int tx = (int) bt; // 发现错误，不能将布尔转换为\
  \ int\n        ```\n\n## 关于返回语句的错误\n这些类型的错误与方法的结构及其返回语句有关；通常情况下，它们很容易修复，所述如下：\n\n\
  *   “缺少返回语句”（Missing return statement）错误：当方法返回非 void 类型时，离开每条路径都必须有一个返回语句，尽管该路径可能无法执行，所示：\n\
  \        ```java\n        int max(int it, int jt) {\n            if (it> jt) return\
  \ it;\n            else if (it<= jt) return jt;\n            // 发现错误：当 i>j 和 i<=j\
  \ 均为假时的路径该怎么办？!!\n        }\n        ```\n\n*   “缺少返回值”（Missing return value）错误：返回类型的方法必须包含一个正确类型表达式的返回语句，所示：\n\
  \        ```java\n        int fmax(int at, int bt) {\n            return; // 发现错误，缺少\
  \ int 表达式\n        }\n        ```\n\n*   “无法从结果类型为 void 的方法返回值”（cannot return a\
  \ value from method whose result type is void）错误：相反，void 方法中的 return 语句不能包含表达式，如下命令所示：\n\
  \        ```java\n        void Ftest(int ta, int tb) {\n            return ta +\
  \ tb; // 错误，方法声明为 void\n        }\n        ```\n\n*   “无效的方法声明；需要返回类型”（invalid method\
  \ declaration; return type required）错误：除了构造函数外，每个方法都必须返回类型；如果不是，将出现此错误：\n      \
  \  ```java\n        fmax(int i, int j) {\n        ```\n\n*   “不可到达的语句”（unreachable\
  \ statement）错误：如果你在返回语句后编写语句，将发生以下错误：\n        ```java\n        void test(int Tj)\
  \ {\n            System.out.println(\"Value is \" + Tj);\n            return;\n\
  \            Tj++;\n        }\n\n## 关于访问静态实体\n`static` 修饰符意味着变量或方法与类关联，而不是与单个对象关联。通常，静态实体在\
  \ `Java` 中很少使用（常量声明除外），原因是编写为类的程序必须实例化至少一个对象。\n\n*   “静态变量 . . . 无法从静态上下文引用 cannot\
  \ be referenced from a static context）错误：由于 `main` 方法（是）静态的，因此类中引用的每个变量必须是静态的。未指定修饰符会导致编译错误，所示：\n\
  \        ```java\n        class MyTest {\n            int tm;\n            public\
  \ static void main(String[] args) {\n                System.out.println(tm); //\
  \ 发现错误\n            }\n        }\n        ```\n\n*   “静态方法 . . . 无法从静态上下文引用 non-static\
  \ method . . . cannot be referenced from a static context）错误：类似地，非静态性质的方法无法从像 `main`\
  \ 这样的静态方法调用；原理稍显复杂。在不存在对象的情况下，从静态方法调用（非静态性质）的方法，所示：\n        ```java\n        class\
  \ MyTest {\n            void m(int n) {}\n            public static void main(String[]\
  \ args) {\n                m(50);\n            }\n        }\n        ```\n\n在对不同类型的编译错误进行详细讨论之后，是介绍\
  \ Java 编程语言中可能的各种运行时错误的最佳时机。\n\n### 运行时错误\n在解释期间，`Java` 检测到运行时错误。然后，它抛出一个异常并输出堆栈跟踪，该跟踪显示了从主程序到产生异常的行的整个调用堆栈。以下代码尝试除以零。如果你执行图\
  \ 7.1 中的代码，`Java` 将抛出异常。\n\n```java\npublic class Main {\n    public static void\
  \ main(String[] args) {\n        int a = 10;\n        int b = 0;\n        int c\
  \ = a / b;\n    }\n}\n```\n\n\n\n\n从之前的输出中，我们可以获得异常的详细信息，例如类名（`TstExp`）、方法名（`main`）、文件名（`TstExp.java`）、行号（`8`）以及异常原因（`/\
  \ by zero`）。\n\n以下是不同类型的错误：\n\n### 关于越界的错误\n大多数此类异常发生在尝试访问索引范围外的数组或字符串时，具体如下：\n\n\
  *   `ArrayIndexOutOfRange` 错误：当尝试对数组 `a[i]` 进行索引，但索引 `i` 不在 `0` 到 `a.length`（包含边界）的范围内，就会抛出此异常，如下命令所示：\n\
  ```java\nint arr[] = { 10, 20, 30, 40, 50 };\nfor (inti = 0; i<= arr.length; i++)\n\
  System.out.println(arr[i]);\n```\n*   `StringIndexOutOfRange` 错误：当 `String` 类的许多方法中，如果索引值不在\
  \ `0` 到 `s.length()`（包含边界）的范围内时，会抛出此异常，如下所示：\n    注意：`s.length()` 是有效的，它表示字符串中最后一个字符之后的位置。\n\
  ```java\nString str = \"JAVAPROGRAM\";\nSystem.out.println(str.charAt(30));\n```\n\
  *   空引用（Dereferencing null）：当你声明一个引用类型的变量时，你只获得一个可以存储类对象引用的变量。此时，尝试访问类的字段或方法将导致引发\
  \ `NullPointerException` 异常。\n\n### 关于计算的错误\n当你尝试将字符串转换为数字，且字符串格式与数字不匹配时（例如 `12a3`），会发生以下三种异常：\n\
  \n*   `InputMismatchException` 错误：此异常由 `Scanner` 类抛出，该类是 Java 编程语言第 5 版本引入的，用于使程序的面向字符输入变得简单。\n\
  *   `IllegalFormatException` 错误：此异常由 `String` 类中的 `format` 函数抛出，该函数允许使用类似于 C 语言的格式说明进行输出。\n\
  *   `NumberFormatException` 错误：此异常由 `Integer` 和 `Double` 等数值包装类中声明的方法抛出，特别是用于将字符串转换为原始数值类型的\
  \ `parseInt` 和 `parseDouble` 方法。\n*   `ArithmeticException` 错误：当你尝试除以零时，会引发此类型的异常。\n\
  \n### 关于内存不足的错误\n现代计算机的内存非常大，因此在常规编程中不太遇到这种情况。尽管如此，它们可能作为其他错误的副作用。某些包括：\n\n*   `outOfMemoryError`\
  \ 错误：如果内存耗尽，可能会抛出此异常：\n*   `StackOverFlowArea` 错误：栈用于存储每个被调用方法的激活记录；它包含了参数、局部变量以及返回地址等其他信息。无限递归会导致\
  \ Java 虚拟机耗尽栈空间。\n\n### 关于程序执行的错误\n要从环境内部或通过命令行执行解释器来解释 Java 程序，你必须编写：`java Test`，其中\
  \ `Test` 是包含 `main` 方法的类名。\n\n注意：在大多数类中定义 `main` 方法是有帮助的，并利用它们独立地测试每个类。当类被组合成一个程序后，你只需要确保对带有真实\
  \ `main` 方法的类调用解释器。如果解释器未能发现并运行程序，可能会导致两种运行时错误。\n\n*   `NoClassDefFoundError` 错误：解释器必须能够找到包含\
  \ `main` 方法类的文件，例如 `Test.class`。如果没有使用包，它们必须放置在执行解释器的目录下。检查类名是否与不带扩展名的文件名匹配。大小写至关重要。首先你编译程序：`javac\
  \ MyClass.java`，然后回溯该行并删除 `javac` 中的 `c` 以获取解释器的命令，如下所示：\n```bash\njava MyClass.java\n\
  ```\n然而，`MyClass.java` 并不是类名，因此你将收到此异常。要使用解释器，你必须移除 `.java` 扩展名，如下：\n```bash\njava\
  \ MyClass\n```\n*   `NoSuchMethodFoundError` 错误 `main`：如果类中没有 `main` 方法，或者声明不完全正确，就会发生此错误：即\
  \ `static` 修饰符、返回值类型 `void`、小写的方法名 `main` 以及一个 `String[]` 类型的参数。在忘记 `public` 修饰符的情况下，会出现此信息\
  \ `Main method not public`。\n\n让我们一个接一个详细阐述 `Exception`（异常）的概念、异常层次结构、异常类型、异常处理操作以及\
  \ `try-catch-finally` 块的示例。\n\nexception（异常）一词是 exceptional event（异常事件）的缩写。异常是执行过程中破坏正常指令流的场景。当方法遇到错误时，该方法会产生一个对象并传递给运行时系统。该对象被称为异常对象，包含了有关错误的信息，例如错误的类型以及错误发生时的程序状态。抛出异常（Throw）是指创建异常对象并将其传递给运行时系统的行为。当方法抛出异常时，Java\
  \ 运行时系统尝试寻找处理它的方法。处理异常可用集合是到达错误发生方法的调用方法有序列表。调用栈就是方法列表。\n\n![](img/Figure_7.3)\n\
  \n\n\n\n\n# 检查异常\n\n除运行时异常（Runtime Exceptions）之外的所有异常类型被称为检查异常。编译器在编译时会检查，以确定程序员是否采取了必要的机制来处理这些异常。如果程序中没有处理或声明这些异常，将会发生编译错误。Java\
  \ 中存在一些检查异常，如 `ClassNotFoundException`、`IOException`、`EOFException`、`FileNotFoundException`\
  \ 和 `NoSuchMethodException`。图 7.6 展示了该示例：\n\n![](img/Figure_7.6.png)\n\n图 7.6: 检查异常示例\n\
  \n上述代码的输出如下：\n\n![](img/Figure_7.7.png)\n\n图 7.7: 检查异常的输出\n\n在前面的示例中，我们可以看到 `FileNotFoundException`\
  \ 在编译时发生了，因为指定位置不存在 `abc2.txt` 文件，并且这是一个检查异常。\n\n# 未检查异常\n\n运行时异常的一种类型也称为未检查异常。它们在编译时时不进行检查，因此由程序员负责采取必要步骤处理此类异常并实现安全退出。以下列了一些未检查异常：\n\
  \n*   `ArithmeticException`\n*   `IllegalArgumentException`\n*   `NumberFormatException`\n\
  *   `IndexOutOfBoundsException`\n*   `ArrayIndexOutOfBoundsException`\n*   `StringIndexOutOfBoundsException`\n\
  *   `NullPointerException`\n\n在接下来的图 7.8 中，有一个源代码展示了未检查异常：\n\n![](img/Figure_7.8.png)\n\
  \n图 7.8: 未检查异常示例\n\n在图 7.8 前面的示例中，由于除以零错误发生了一个 `ArithmeticException`，但程序可以正常编译，在运行时它会产生异常。这就是为什么它被称为未检查异常。在大多数情况下，未检查异常代表了不可恢复的编程逻辑错误。例如，如果你尝试使用一个未赋值对象的引用变量来访问对象，就会触发\
  \ `NullPointerException`。当你访问超出数组限制的数组元素时，会抛出类似 `IndexOutOfBoundsException` 类型的异常。这些是软件中必须解决的逻辑缺陷。未检查异常可以在程序执行过程的任何时候发生。Java\
  \ 并不强制你创建代码来捕获未检查异常，以避免笨地误用 `try` 和 `catch` 代码块。在下一节中，将表格列出检查异常和未检查异常之间的区别。\n\n\
  # 检查异常与未检查异常的区别\n\n在下面的表 7.1 中，根据异常的性质及其处理方式对检查异常和未检查异常进行了区分：\n\n| 检查异常 | 未检查异常\
  \ |\n| --- | --- |\n| 编译器负责处理此类类型的异常。 | 编译器的任务是不检查此类异常。 |\n| 继承自 `java.lang.Exception`\
  \ 类 | 继承自 `java.lang.RuntimeException` 类 |\n| 由代码本身处理 | 由代码处理 |\n| 如果存在未处理的异常，程序无法编译。\
  \ | 即使存在未处理的异常，程序也能成功编译。 |\n\n表 7.1: 检查异常与未检查异常的区别\n\n# 用户定义异常\n\n根据此语境，我们讨论了最重要的异常。Java\
  \ 允许用户编写派自内置类的自定义异常类。`Exception` 类继承了 `Throwable` 类的所有方法。Java 包含了许多内置异常来处理常见错误，但另一方面，开发者可以设计称为自定义异常的唯一异常。开发者通过设计自定义异常来提高代码可读性、将业务逻辑与异常处理分离并处理异常情况。在下面的图\
  \ 7.9 中，给出了用户定义异常的概念：\n\n![](img/Figure_7.9.png)\n\n图 7.9: 检查异常示例\n\n上述代码的输出如下：\n\
  \n![](img/Figure_7.10.png)\n\n图 7.10: 检查异常的输出\n\n# 错误与异常的区别\n\n学习错误和异常之间的基本区别对应的\n\
  \n| 错误 (Error) | 异常 (Exception) |\n| --- | --- |\n| 错误指定发生了某些影响。 | 异常是发生的事件 |\n\
  | 错误是未检查的 | 异常分为已检查和未检查的。 |\n| 程序员无法恢复错误。 | 程序员可以借助纠正和必要的行动来控制这些场景。 |\n\n表 7.2:\
  \ Java 中错误与异常的区别\n\n# 异常处理的操作\n\n有与异常处理相关的五个关键字，分别是 `try`、`catch`、`finally`、`throws`\
  \ 和 `throw`。为了在异常发生时处理异常，抛出异常的行将在 `try` 块内执行。`try` 块后面跟着一个或多个 `catch` 子句，子句包含处理异常的代码。每个\
  \ `catch` 子句都有一个关联的异常类型。当异常发生时，处理将在第一个匹配异常类型的 `catch` 子句处继续。`finally` 块是你放置无论是否发生异常都必须运行代码的地方。包含\
  \ `finally` 语句的代码块是防止资源泄漏的关键工具。在关闭文件或恢复资源的情况下，将代码放置在 `finally` 块中，以确保资源始终被恢复。\n\n\
  异常处理机制由以下三个操作组成：\n\n*   **声明异常的操作**：根据规范，方法必须在方法签名部分指定该方法可能从方法体中抛出的检查异常类型，这通过借助\
  \ `throws` 关键字来实现。\n*   **抛出异常的操作**：当 Java 操作遇到异常情况时，具有错误语句的方法应创建一个适当的 `Exception`\
  \ 对象，并借助 `throw` 语句将该对象抛给 Java 运行时系统。\n\n所有的 Java 方法都使用 `throw` 语句来抛出异常。包含 `throw`\
  \ 的语句需要一个参数：一个 `throwable` 对象。\n\n\n\n\n\n# 异常捕获的操作\n\n当方法抛出异常时，JVM 会扫描调用堆栈以寻找所需的异常处理器。特定的异常处理器只能处理一种类型的异常。处理指定类的异常处理器也可以处理其子类。在那种情况下，如果在调用堆栈中没有找到（匹配的）异常处理器，应用程序将退出。\n\
  \n现在，在讨论了错误和异常的定义及类型之后，我们将介绍 Java 中 `try-catch-finally` 块块的概念。\n\n## 使用 try-catch-finally\
  \ 块进行异常处理\n\n关于 `try` 块和 `catch` 块有一些重要的点，列举如下。程序员在创建应用程序时必须记住这些属性。\n\n*   `try`\
  \ 块可能会导致错误条件并抛出异常。\n*   它可能包含一个或多个可能产生异常的语句。\n*   紧接 `try` 块之后插入一个 `catch` 块。\n\
  *   在 Java 中，`try` 和 `catch` 块之间不允许有程序代码。\n* 异常发生后的语句永远不会执行。\n*   程序中可以存在嵌套的 `try`\
  \ 块。如果内部 `try` 块没有任何 `catch` 语句，控制将传递给存在 `catch` 块的外部 `try` 块。\n*   可以存在多个 `catch`\
  \ 块。根据代码中出现的异常类型相应的调用 `catch` 块。\n\n我们选择处理异常有两个目的：首先，它允许我们解决错误；其次，它停止程序的自动终止。现在，在下一节将连续给出\
  \ `try-catch-finally` 语句的实际源代码，以便更好地理解。\n\n## 单 try-catch 块示例\n\n在下面的图 7.11 中，展示了\
  \ `try…catch` 块的简单编码示例：\n\n![](img/Figure_7.11.png)\n\n图 7.11：单 try-catch 块示例\n\n\
  上述代码的输出如下：\n\n![](img/Figure_7.12.png)\n\n图 7.12：try-catch 块的输出\n\n在图 7.11 的上述代码中，我们展示了一段源代码来处理运行时发生的错误，尝试在\
  \ `try` 代码块内部编写代码。在 `try…code` 块之后，包含一个 `catch` 子句，代表你想要捕获的异常类型。你必须注意到 `try` 代码块内部的程序代码\
  \ `System.out.println(\"This will not be printed\")` 永远不会执行。\n\n## 单 try-多 catch\
  \ 块示例\n\n图 7.13 中提供了一段短代码，演示了如何使用单个 `try-catch` 块处理多个异常：\n\n![](img/Figure_7.13.png)\n\
  \n图 7.13：带有多个异常的单 try-catch 块示例\n\n上述代码的输出如下：\n\n![](img/Figure_7.14.png)\n\n图 7.14：带有多个异常的单\
  \ try-catch 块的输出\n\n在前面的图 7.13 中，一段代码抛出了多个异常，如 `ArrayIndexBoudsException` 和 `ArithmeticException`。为了处理这种情况，你可以使用两个或多个\
  \ `catch` 子句，每个处理不同的异常类型。在异常抛出时，会按照特定顺序检查每个 `catch` 语句，并执行第一个与异常类型相似的 `catch` 语句。如果执行了一个\
  \ `catch` 语句，那么其他 `catch` 语句将被跳过，例如 `catch(ArithmeticException e){System.out.println(e);}`，执行将在\
  \ `try-catch` 块之后继续。\n\n## 嵌套 try-catch 块示例\n\n图 7.15 提供的 Java 代码演示了如何使用嵌套 `try-catch`\
  \ 块处理多个异常：\n\n![](img/Figure_7.15.png)\n\n图 7.15：嵌套 try-catch 块示例\n\n上述代码的输出如下：\n\
  \n![](img/Figure_7.16.png)\n\n图 7.16：嵌套 try-catch 块的输出\n\n该程序在一个 `try` 块中嵌套了另一个\
  \ `try` 块。程序的运行如下：当使用命令行参数值零执行程序时，外部 `try` 块会产生除零异常，因为它将变量 `a` 的值初始化为 0。使用命令行参数\
  \ 1 执行程序会在嵌套的 `try` 块内产生 `ArrayIndexOutOfBoundsException`。\n\n## throw 关键字示例\n\n\
  在目前讨论的示例中，异常是在代码中捕获并由 JVM 抛出的。然而，在某些情况下可以通过 `throw` 语句显式地抛出异常。`throw` 语句的通用语法所示：\n\
  \n```\nthrow ThrowableInstance;\n```\n\n其中，`ThrowableInstance` 是 `Throwable` 类型的对象或\
  \ `Throwable` 类的子类。像 `int` 或 `char` 等数据类型不能被视为异常。同样，非 `Throwable` 类的 `String` 和\
  \ `Object` 也被视为异常。在图 7.17 中，给出了带有 `throw` 关键字的源代码：\n\n![](img/Figure_7.17.png)\n\
  \n图 7.17：throw 关键字示例\n\n上述代码的输出如下：\n\n![](img/Figure_7.18.png)\n\n图 7.18：throw 关键字输出\n\
  \n## throws 关键字示例\n\n`throws` 子句用于指定在方法外部抛出的异常类型。如果引起异常的方法不想处理该异常，它必须为调用者方法使用 `throw`\
  \ 关键字。`throws` 子句声明了方法可能抛出的异常类型列表。`throws` 关键字用于受检异常（checked Exceptions）。在图 7.19\
  \ 中展示了该示例：\n\n![](img/Figure_7.19.png)\n\n图 7.19：throws 关键字示例\n\n上述代码的输出如下：\n\n\
  ![](img/Figure_7.20.png)\n\n图 7.20：throws 关键字输出\n\n从前面的示例可以得出，`FileNotFoundException`\
  \ 是由 `main()` 方法抛出的。`main()` 方法没有处理该异常。它在运行时被处理。因此，我们可以得出 `throws` 关键字只能抛出受检异常\n\
  \n## throw 和 throws 关键字之间的区别\n\n在下面的表 7.3 中，给出了 `throw` 和 `throws` 关键字的差异及语法：\n\n\
  | Throw | Throws |\n| --- | --- |\n| `throw` 关键字写在方法内部，用于在需要时逻辑上抛出异常。 | `throws`\
  \ 关键字写在方法签名中。当方法包含某些导致异常的语句时，是必须。 |\n| `throw` 关键字用于一次显式地只抛出一个异常。 | `throws` 关键字可以用于声明多个异常的列表，用逗号分隔。根据异常类型的出现情况，如果声明匹配，则自动抛出异常。\
  \ |\n| `throw` 关键字用于未检异常（unchecked exceptions）。 | `throws` 关键字仅用于受检异常（checked Exceptions）。\
  \ |\n| ```java\nclass TstExp7 {static void cal(int i){if (i==5){Throw new ArithmeticException(\"\
  Termination\");}else{System.out.println(\"Its ok\");}}public static void main(String\
  \ args[]) {try{cal(5);}catch(ArithmeticException e){System.out.println(e);}}}\n\
  ``` | ```java\nvoid calculation() throws ArithmeticException, NullPointerException{//\
  \ 可能会出现异常的语句。throw new ArithmeticException();}\n``` |\n\n表 7.3：Java 中 throw 和 throws\
  \ 关键字的区别\n\n## Finally 关键字\n\n\n\n\n\n如果一个方法在进入时打开文件并在退出时关闭它，就会出现问题。你不希望关闭文件的代码被异常处理机制跳过。`finally`\
  \ 关键字正是为了解决这个问题设计的。`finally` 关键字产生一个代码块，该块会在 `try-catch` 块之后、后续代码之前执行。无论情况如何，是否抛出异常，`finally`\
  \ 块都会运行。即使没有 catch 语句匹配异常，`finally` 代码块也会被执行。示例见下图 7.21：\n\n![](img/Figure_7.21.png)\n\
  \n图 7.21：Finally 块的示例\n\n上述代码的输出如下：\n\n![](img/Figure_7.22.png)\n\n图 7.22：Finaly\
  \ 块的输出\n\n## final, finally 和 finalize 之间的区别\n\n`Final`、`Finally` 和 `Finalize` 之间的重要区别列在下方的表\
  \ 7.4 中：\n\n| Final | Finally | Finalize |\n| --- | --- | --- |\n| 它是一个关键字 | 它是一个代码块\
  \ | 它是一个方法 |\n| 它限制了成员、方法或类的重写。 | 无论是否抛出异常，`finally` 块都会运行。即使没有 catch 语句匹配异常，`finally`\
  \ 块代码块也会被执行。 | `finalize()` 只在垃圾回收之前被调用。 |\n| 语法`Final int a=10;` | 语法`Finally{…}`\
  \ | 语法`finalize(){..}` |\n\n表 7.4：Java 中 Final、Finally 和 Finalize 关键字的区别\n\n## 异常的优势\n\
  \n在下一节中，将用伪代码详细讨论异常的不同优势。\n\n### 分离开错误处理代码的优势\n\n异常允许你将发生异常情况时的具体处理方法与程序的主逻辑分离来。传统编程中的错误检测、报告和处理等机制经常会导致复杂的“面条代码”。考虑以下伪代码，它完全将文件读取到内存中：\n\
  \n```\nRead_file {\nopening the file;\ndetermining its size;\nallocating that much\
  \ memory;\nreading the file into memory;\nclosing the file;\n}\n```\n\n异常允许你按照主流程编写代码，并处理异常情况。如果\
  \ `Read_file` 方法使用异常来代替传统的错误管理方案，代码看起来如下所示：\n\n```\nRead_file {\n  try {\n    opening\
  \ the file;\n    determining its size;\n    allocating that much memory;\n    reading\
  \ the file into memory;\n    closing the file;\n  } catch (File_open_failed) {\n\
  \    Do_something;\n  } catch (Size_determination_failed) {\n    Do_something;\n\
  \  } catch (Memory_allocation_failed) {\n    Do_something;\n  } catch (Read_failed)\
  \ {\n    Do_something;\n  } catch (File_close_failed) {\n    Do_something;\n  }\n\
  }\n```\n\n请注意，异常并不能免除检测、报告和处理错误任务上付出的努力，但它们有助于更有效地组织工作。\n\n### 将错误向整个堆栈传播的优势\n\n\
  作为异常的第二个优势，它是将错误报告沿方法调用堆栈向上传播的能力。在下面的示例中，`Read_file` 方法被放在主程序创建的一系列嵌套方法调用的第三位置：\n\
  \n```\nMethd1 {\ncall Methd2;\n}\n\nMethd2 {\ncall Methd3;\n}\n\nMethd3 {\nCall_read_file;\n\
  }\n```\n\n在方法内部抛出的任何异常都可以被避免，允许调用堆栈中更靠的方法捕获它们。结果，只有与错误有关的技术需要关注错误检测，如下所示：\n\n```\n\
  Methd1 {\n  try {\n    call Methd2;\n  } catch (exception e) {\n    Do_error_processing;\n\
  \  }\n}\n\nMethd2 throws exception {\n  call Methd3;\n}\n\nMethd3 throws exception\
  \ {\n  Call_read_file;\n}\n```\n\n然而，如伪代码所示，避免异常需要在中间技术方面做出一些努力。方法可以抛出的任何检查异常都必须在它的\
  \ `throws` 子句中定义。\n\n### 分组和区分错误类型\n\n考虑到程序内部抛出的所有异常都是对象，异常的分组或分类是类层次结构的逻辑结果。`IOException`\
  \ 及其后继类是 Java 平台 `java.io` 中指定的系列相关异常类的示例。最通用的异常是 `IOException`，它描述了 I/O 期间可能发生的任何类型的错误。它的后代表示更具体的错误。例如，`FileNotFoundException`\
  \ 表示磁盘上无法找到文件。\n\n方法可以通过编写特定的异常处理器来处理非常特定的异常。根据 `FileNotFoundException` 类没有后代的事实，指定的指定的处理机制只能处理一种类型的异常，如\
  \ `catch (FileNotFoundException e)`。\n\n方法可以利用编写特定的异常处理器来处理非常特定的异常。根据 `FileNotFoundException`\
  \ 类没有后代的事实，指定的指定的处理机制只能处理一种类型的异常，如 `catch (FileNotFoundException e)`。\n\n... 异常处理器的能力是捕获所有\
  \ I/O 错误，例如 `FileNotFoundException`。\n\n## 异常处理与方法重写\n\n如果父类方法没有声明异常，子类重写方法不能声明检查异常。示例见下图\
  \ 7.23：\n\n![](img/Figure_7.23.png)\n\n图 7.23：子类重写方法尝试抛出检查异常的示例\n\n上述代码的输出如下：\n\n\
  ![](img/Figure_7.24.png)\n\n图 7.24：子类重写方法尝试抛出检查异常的输出\n\n如果父类方法没有声明异常，子类的重写方法不能声明检查异常，但可以声明运行时异常。示例见下图\
  \ 7.25：\n\n![](img/Figure_7.25.png)\n\n图 7.25：子类重写方法尝试抛出运行时异常的示例\n\n上述代码的输出如下：\n\
  \n![](img/Figure_7.26.png)\n\n图 7.26：子类重写方法尝试抛出运行时异常的输出\n\n如果父类方法声明了异常，子类的重写方法可以声明相同的子类异常或异常，但不能声明父类异常。例如，在下方的图\
  \ 7.27 中，子类重写方法声明相同的异常：\n\n![](img/Figure_7.27.png)\n\n图 7.27：父类子类重写方法抛出相同类型异常的示例\n\
  \n上述代码的输出如下：\n\n![](img/Figure_7.28.png)\n\n图 7.28：父类子类重写方法抛出相同类型异常的输出\n\n## 结论\n\
