  \n# 第 3 章 类、对象和方法的概念\n\n## 引言\n\n本章结合了日常生活中的示例和插图来解释类、对象和方法的概念。模型、蓝图或设计就是类。在本章中，将展示类的特征和类类型。引入了对象的概念，即类的实例。本章还阐述了对象产生的原因。为了帮助理解，列出了类和对象之间的区别。接下来，介绍了方法的概念。在面向对象编程（OOP）中，它们被称为类内部的函数。在这种情况下，展示了方法调用过程。与类名相同的特殊方法被称为构造函数。通过代码示例来说明构造函数的概念。本章还涵盖这一术语以及方法重载的重要概念。\n\
  \n## 结构\n\n* 引入类\n* 引入对象\n* 构造函数\n* Java 中的方法重载\n* Java 中的 `this` 关键字\n\n## 目标\n\
  \n本章将让读者理解面向对象编程的类和对象概念以及它们的区别。本章将完整地涵盖类和对象，并配有适当的插图以及从语法到实现的讨论。\n\n## 引入类\n\n类是对象的组。例如，水果是一个类，而芒果是一个对象。类是包含所有数据的用户定义类型。\n\
  \n图 3.1 带有数据成员的类\n\n```\nimages/3.1\n```\n\n## 类属性\n\n类的属性如下：\n\n* 类定义了结构。\n* 它提供了封装。\n\
  * 它作为蓝图、模型或设计。\n* 可以 `private`、`public` 和 `protected` 等访问修饰符。\n* 它是一个逻辑概念。\n\n##\
  \ 类组件\n\n类的组件如下：\n\n* **字段**：被称为成员变量或属性。例如 `Name`、`RollNo`、`Marks`。\n* **构造函数**：与类名相同的特殊方法，在创建对象时自动调用。例如\
  \ `A()`，其中 `A` 是类。\n* **方法**：这些是行为或成员函数。它告诉对象如何运行。例如 `disp()`、`getData()`。\n\n##\
  \ 类类型\n\nJava 类的类型如下：\n\n* **类类 (Final class)**：这种类型的类不能被继承，也就是说，禁止子类类的生成。它使用 `Final`\
  \ 关键字创建。\n* **抽象类 (Abstract class)**：这种类型的类不能实例化。也就是说，不允许生成对象，仅作为基类使用。它使用 `abstract`\
  \ 关键字创建。这些存在仅仅是为了为派生类提供公共属性和方法。此类类被称为抽象类。\n* **具体类 (Concrete class)**：Java 中的具体类是指所有方法已实现的类。创建对象的类被称为具体类。要制作具体类，你需要扩展抽象类并实现所有抽象方法。具体类只能扩展一个类（抽象类或其他），但可以实现多个接口。\n\
  * **POJO 类**：纯 Java 对象（POJO）类定义了私有数据以及用于访问这些私有数据的公开 GET/SET 方法。\n* **单例类 (Singleton\
  \ class)**：它允许你的类只有一个实例。主要目标是控制对象的创建。单例通常控制数据库连接或套接字资源的访问。设计单例类：\n    1. 将构造函数变为\
  \ `private`。\n    2. 编写一个返回类型为该单例类对象的静态方法。\n\n### 图 3.2 Java 中单例类的源码\n\n图 3.2 提供了在\
  \ Java 中创建单例类的简单示例。它通过私有构造函数 `SingletonEx()` 限制了创建对象的数量。\n\n```\nimages/Figure_3.2.png\n\
  ```\n\n\n\n\n### 内部类\n\n*   内部类：在 Java 中，你可以在另一个类内部定义类，这被称为嵌套类。\n\n示例：\n\n```java\n\
  Class ClassA {\n    ...\n    Class NestedClassA {\n        ...\n    }\n}\n```\n\n\
  嵌套类分为两类：非静态和静态。非静态嵌套类被称为内部类，而声明为 `static` 的嵌套类被称为静态嵌套类。\n\n### 对象的引入\n\n利用 `new`\
  \ 运算符可以构造对象。对象具有状态和行为。汽车的状态可能是它的颜色或型号。汽车的加速可以被视为它的行为。对象是一个物理实体或运行时的实体，例如人、笔、椅子、桌子或计算机。对象的表示如图\
  \ 3.3 所示：\n\n![](img/Figure_3.3.png)\n\n图 3.3：对象的表示\n\n### 对象的组件\n\n对象的组成部分如下：\n\
  \n*   状态：由对象的属性表示。它反映了对象的特征。\n*   行为：由对象的方法表示。它也反映了对象与其他对象的交互。\n*   标识性：它为对象提供唯一的名称，并使一个对象能够与其他对象进行交互。\n\
  \n### 类的创建\n\n让我们来看类的创建语法：\n\n```java\nClass Classname\n{\n    type instance_variable1;\n\
  \    type instance_variable2;\n    type methodname1(parameter_list)\n    {\n   \
  \     //方法体\n    }\n    type methodname2(parameter_list)\n    {\n        //方法体\n\
  \    }\n}\n```\n\n你必须编写 `class` 关键字，后面紧跟类名，如 `Student`、`Employee` 或 `Car`。之后，将添加\
  \ `{` 和 `}` 用于类的声明和初始化，类体写在 `{` 和 `}` 之间。数据成员和方法将在类体内定义并初始化。类名应该始终以大写字母 `Student`\
  \ 开始。\n\n现在，让我们考虑图 3.4 中的示例：\n\n![](img/Figure_3.4.png)\n\n图 3.4：带有数据成员和方法的 Java\
  \ 类声明\n\n类的定义包含作为数据成员的 `roll` 和 `steam_name`，`get_details()` 是方法。\n\n### 对象的创建\n\
  \n利用 `new` 运算符构造对象。对象具有自己的状态和行为。例如，自行车的状态可能是它的 `engine_type` 或 `manufacture_id`。`speedUp`\
  \ 可以被视为自行车的行为。\n\n### 对象的创建语法\n\n`new` 运算符创建一个类的对象并返回该对象的对象的引用。\n\n示例：\n\n```\n\
  Student std1= new Student();\n```\n\n在上述示例中，`Student` 是类名，`std1` 是对象名，它是指向 `Student`\
  \ 对象的引用。它是一个内存引用，知道对象存储在内存中的位置。`new` 运算符负责创建对象。`Student()` 是用于初始化对象的默认构造函数。创建对象的代码如图\
  \ 3.5 所示，输出如下：\n\n![](img/Figure_3.5_(2).png)\n\n图 3.5：类和对象的创建示例\n\n接下来的图 3.6 显示了代码段：\n\
  \n![](img/3.6.png)\n\n图 3.6：上述类和对象创建代码的输出\n\n在图 3.5 中，创建了类 `Student`，并有两个对象即 `std1`\
  \ 和 `std2`，具有三个属性 `roll`、`name` 和 `stream_name`。每个对象都有其自己的属性值（如 `roll`、`name` 和\
  \ `stream_name`），这些被称为实例方法。此外，还有一个方法 `get_details()` 显示每个对象的属性值。要访问属性和方法，我们必须在对象名后使用点\
  \ (`.`) 运算符，如 `std1.roll` 或 `std1.get_details()`。让我们在表 3.1 中考虑 Java 类和对象之间的区别：\n\
  \n| Java 类 | Java 对象 |\n| --- | --- |\n| 它是一个蓝图 | 它是类的实例 |\n| 它是表示对象行为的代码。 | 对象代表状态和行为\
  \ |\n| 类充当计划或模型。 | 对象是实现。 |\n| 它是逻辑上的 | 它具有物理存在 |\n| 它通过 `class` 关键字创建 | 它通过 `new`\
  \ 关键字创建 |\n| 创建时不时不分配内存 | 在创建对象时不分配内存 |\n| `class Abc{//body of the class}` | `Abc\
  \ obj=new Abc();` |\n\n表 3.1：Java 中类和对象的区别\n\n### 对象的优点\n\n对象提供了许多益处，包括：\n\n*  \
  \ 模块化：对象的源代码可以与其他对象的源代码分开创建和维护。一旦创建了对象，就可以很容易地在系统中移动。\n*   信息隐藏：通过仅与对象的方法和属性交互，其实现细节对外部世界是隐藏的。\n\
  *   代码复用：你可以在程序中利用已经存在的对象（可能是由其他开发者构建的）。\n*   可插拔性和易于调试：你可以轻松地从程序中删除一个对象，并在发现它有问题时换成另一个。在现实世界中，这就像修理机械问题。与其更换整台机器，不如更换故障螺丝。\n\
  *   垃圾回收：垃圾回收的想法是自动回收内存。检查内存以检测未使用部分，然后删除不需要的对象。\n\n### Java 方法的组件\n\nJava 方法是用于执行操作的语句集合。其组件如下：\n\
  \n*   返回值：指定方法返回值的类型。例如，如果方法的返回类型为 `int`，则它返回一个整数值。如果方法不返回值，则返回类型为 `void`。\n*  \
  \ 方法名：在程序中引用特定方法的标识符。\n*   方法体：包括执行某些任务的语句，如局部变量的声明。方法体包含在大括号 `{}` 之中。\n*   访问修饰符：`public`、`private`、`protected`。\n\
  *   括号中的参数列表：输入参数的逗号分隔列表，前面带有数据类型，位于括号 `()` 中。如果没有参数，必须使用空括号。\n*   异常列表：异常是一种意外事件。例如\
  \ `IOException`。\n\n### 方法命名规范\n\n虽然方法名可以是任何合法标识符，但按照习惯，方法名应该是小写的动词，或者是以小写动词开头的多单词名称，随后是形容词、名词等。\n\
  \n在多单词名称中，第二个及后续每个单词的首字母应该大写。\n\n示例：\n\n`walk()`，`walkFast()`，`getForeground()`，`setBackground()`，`compareTo()`，`setY()`，`isEmpty()`\n\
  \n### Java 方法分类\n\nJava 中的方法可以大致分为两类：\n\n\n\n\n\n*   **预定义方法**：Java 中的预定义方法是在 Java\
  \ 类库中预先定义的方法。它们也被称为标准库方法或内置方法。我们可以在应用程序中的任何时候通过调用它们来直接使用这些方法。例如 `length()`、`equals()`、`compareTo()`、`sqrt()`\
  \ 以及其他预定义方法。\n\n  让我们考虑图 3.7 中的预定义方法示例：\n\n  ![](img/Figure_3.7.png)\n\n  图 3.7：Java\
  \ 中预定义方法 `sqrt()` 的示例\n\n*   **用户定义方法**：这类方法可以由程序员为了特定目的而定义。其语法如下：\n\n```java\n\
  Int sumCal(int aNum)\n{\n    int K=aNum+10;// 方法体\n    return K;// 返回语句\n}\n```\n\
  \n在代码块中，`int` 是返回类型，`sumCal` 是方法名，`aNum` 是传递给方法的参数。在表 3.2 中，给出了 Java 方法的语法和示例：\n\
  \n  | 方法语法 | 方法示例 |\n  | :--- | :--- |\n  | `returnType methodName(){// 方法体}` |\
  \ `int addNumbers(int a, int b){int sum = a + b;// 返回值 return sum;}` |\n\n  表 3.2：Java\
  \ 方法的语法和示例\n\nJava 中的方法还可以分为以下几类：\n\n* 静态方法\n* 实例方法\n\n### 静态方法\n\n静态方法定义的第一行称为“签名”，它为方法和每个参数变量指定了名称。它还指定了每个参数变量的类型以及方法的返回类型。紧随签名之后的是方法体，封装在花括号中。它还可以包含一个返回语句。\n\
  \n静态方法的调用无非是方法名后跟其参数，参数之间用逗号隔开并括在括号中。\n\n静态方法的属性如下：\n\n*   它可以接受多个参数，因此可以有多个参数变量。\n\
  *   你可以在 `.java` 文件中定义任意数量的静态方法。这些方法是独立的，可以按照任何顺序出现在文件中。一个静态方法可以调用同一文件中的任何其他静态方法，或调用\
  \ Java 库中的任何静态方法（如 `Math`）。\n*   可以进行重载。\n*   允许有多个返回语句。\n*   它将向调用者返回单个返回值。\n*\
  \   特别地，在静态方法中声明的变量的作用范围仅限于该方法体。因此，你无法在一个静态方法中引用另一个静态方法中声明的变量。\n\n### 实例方法\n\n对象包含的方法（即子程序）被称为实例方法。逻辑上，实例方法是对象的一部分。不是类方法的方法被称为实例方法。还可能存在两种类型的方法，定义在所示：\n\
  \n*   **抽象方法**：它没有方法体。它是不完整的。方法体将写在子类中。\n  示例：`abstract void disp();`\n*   **工厂方法**：根据工厂设计模式，定义一个接口（Java\
  \ 接口或抽象类）来用于创建对象，并允许子类决定要实例化哪一个类。实际上，工厂方法负责对象的创建。\n\n### 调用用户定义方法\n\n要调用方法，我们必须先创建该类的对象，然后在对象名后使用点（（`.`）运算符。在下面的示例中，图\
  \ 3.8 中的 `obj` 是类 `DEmoMethod` 的对象引用。要访问成员函数 `addNumbers()`，我们必须在对象名 `obj` 之后使用点（（`.`）运算符。代码见图\
  \ 3.9：\n\n  ![](img/Figure_3.8.png)\n\n  图 3.8：Java 中用户定义方法的调用\n\n### 构造函数\n\n类拥有构造函数，用于根据类蓝图构建对象。构造函数的声明类似于方法声明，区别在于它们使用类名且没有返回类型。对象的实例变量由构造函数进行初始化。\n\
  \n构造函数的属性如下：\n\n*   构造构造函数的名称必须与类名相同。\n*   它们不返回值。\n*   在创建对象时，构造函数会被隐式地触发（调用）。\n\
  *   构造函数用于初始化实例变量。\n*   构造函数可以重载。\n*   构造函数不能是静态的（static）。\n*   构造函数不能是最终的（final）。\n\
  *   私有构造函数禁止用户显式地进行实例化。它可以禁用编译器向类中添加的默认构造函数。\n*   后期绑定不适用于构造函数。\n*   构造函数永远不会被继承。\n\
  \n下一节将解释构造函数的一些主要用法。首先，构造函数用于初始化实例变量。让我们通过图 3.9 中的两个示例来正确理解这一概念：\n\n  ![](img/Figure_3.9.png)\n\
  \n  图 3.9：Java 中构造函数的使用前后的对比\n\n在图 3.9 的前述代码中，如果我们没有初始化实例变量 `i`，它将根据数据类型取默认值。在第一列中，构造函数使用了零作为默认值。现在，在第二列中，我们使用了构造函数\
  \ `A()` 将初始化为 10。这实际上是默认构造。输出见图 3.10：\n\n  ![](img/Figure_3.10.png)\n\n  图 3.10：构造函数的使用前后的对比\n\
  \n其次，当你创建对象时，构造函数会被隐式地调用。让我们看看图 3.11 中构造函数是如何被调用的：\n\n  ![](img/Figure_3.11.png)\n\
  \n  图 3.11：构造函数的隐式调用\n\n在图 3.11 的上述代码中，`test t = new test()` 是创建 `test` 类对象的语句。现在可以看到，即使没有显式调用\
  \ `test()` 方法，`System.out.println(\"Constructor is called\")` 语句也会执行并产生输出。因此，在通过\
  \ `test t = new test()` 创建对象时，构造函数会被调用，见图 3.12](#ch03.xhtml_fig3-12)。\n\n  ![](img/Figure_3.12.png)\n\
  \n  图 3.12：构造函数的隐式调用\n\n### Java 中的构造函数类型\n\nJava 中有两种类型的构造函数：\n\n* 默认构造函数（无参数构造函数）\n\
  * 参数化构造函数\n\n### 默认构造函数\n\n你不需要为类提供任何构造函数，但必须小心。编译器为任何没有构造函数的类提供无参数默认构造函数。该默认构造函数会调用父类的无参数构造函数。在这种情况下，如果父类没有无参数构造函数，编译器将会，因此你必须验证它是否存在。如果你的类没有显式的父类，那么它有一个隐式的父类\
  \ `object`，具有无参数构造函数。如果类中没有构造函数，编译器会自动创建一个默认构造函数，如图 3.13 所示：\n\n  ![](img/Figure_3.13.png)\n\
  \n  图 3.13：Java 中默认构造函数的示例\n\n默认构造函数用于为对象提供默认值，例如 0、`null` 等，取决于类型。让我们考虑图 3.14 中的一个默认构造函数的示例：\n\
  \n  ![](img/Figure_3.14.png)\n\n  图 3.14：Java 中默认构造函数的示例\n\n\n\n\n\n在图 3.15 中，给出了前面代码的输出。\n\
  \n![](img/Figure_3.15.png)\n\n图 3.15：Java 中默认构造函数的实现输出\n\n在图 3.15 的前述编码示例中，变量 `k`\
  \ 的值通过隐式调用默认构造函数 `DefaultCons()` 初始化为零。\n\n## 参数化构造函数\n\n具有特定数量参数的构造函数称为参数化构造函数。参数化构造函数根据这些参数设置对象的属性。代码见图\
  \ 3.16。\n\n![](img/Figure_3.16.png)\n\n图 3.16：Java 中参数化构造函数的示例\n\n在图 3.17 中，给出了前面代码的输出：\n\
  \n![](img/Figure_3.17.png)\n\n图 3.17：Java 中参数化构造函数的示例\n\n在图 3.16 的前述示例中，使用 `TstCons2(int\
  \ i,String n)` 在对象创建时（如 `TstCons2 s1=new TstCons2(1,\"A\")` 和 `TstCons2 s1=new TstCons2(2,\"\
  B\")`）自动设置对象属性 `id` 和 `name` 的值。输出见图 3.17。\n\n## 构造函数重载\n\nJava 中存在构造函数重载的概念。在 Java\
  \ 类中可以存在同相同但参数声明不同的构造函数。这被称为构造函数重载。它们可以执行不同的任务。Java 编译器使用指定的参数列表来区分它们。源码见图 3.18：\n\
  \n![](img/Figure_3.18.png)\n\n图 3.18：Java 中构造函数重载的示例\n\n前面代码的输出见图 3.19：\n\n![](img/Figure_3.19.png)\n\
  \n图 3.19：Java 中构造函数重载的示例\n\n在图 3.18 的前述代码中，构造函数 `ConsOver()` 被重载以执行不同的工作，例如赋值以及对两个类型分别为\
  \ integer 和 double 的数字进行加法和乘法。输出见前述图 3.19。\n\n## Java 中的方法重载\n\n在 Java 中，只要参数声明不同，就可以同一个类中定义两个或多个相同名的方法。发生这种情况时，这些方法被称为重载，该过程被称为方法重载。方法重载是\
  \ Java 称为多态的方法之一。一个简单的例子是 `PrintStream` 类的 `print()` 方法。表 3.3 描述了具有不同参数的 `print()`\
  \ 方法：\n\n| 方法（参数） | 意义 |\n| :--- | :--- |\n| print(char) | 打印字符。 |\n| print(double)\
  \ | 打印双精度浮点数。 |\n| print(int) | 打印整数。 |\n| print(String) | 打印字符串。 |\n\n表 3.3：具有不同参数的\
  \ `print()` 方法描述，重载的方法可能在三个特征上有所不同：\n\n*   参数类型：\n    `void MultiDemo(int a, int\
  \ b)`\n    `void MultiDemo(double a, double b)`\n*   参数数量：\n    `int MultiDemo(int\
  \ a, int b)`\n    `int MultiDemo(int a, int b, int c)`\n*   参数顺序：\n    `void MultiDemo(int\
  \ a, int b)`\n    `void MultiDemo(int b, int a)`\n\n示例：方法重载的源码见图 3.20：\n\n![](img/Figure_3.20.png)\n\
