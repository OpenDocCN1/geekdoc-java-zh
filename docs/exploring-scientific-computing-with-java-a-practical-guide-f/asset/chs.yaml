  \n### 访问数组元素](#contents.xhtml_sc4_110a)\n\n你可以通过引用索引来访问数组元素。例如，以下语句访问了 `cars` 中第一个元素的值：\n\
  \n```\nString[] cars = {\"Volvo\", \"BMW\", \"Ford\"};\nSystem.out.println(cars[0]);\n\
  ```\n\n你也可以借助循环来访问数组元素。可以使用 `for` 循环并使用 `length` 属性来指定循环运行的次数。\n\n```\nString[]\
  \ cars = {\"Volvo\", \"BMW\", \"Ford\"};\nfor (int i = 0; i<cars.length; i++)\n\
  {\n    System.out.println(cars[i]);\n}\n```\n\n## Java 中的二维数组](#contents.xhtml_sc3_111a)\n\
  \n数组的数组被称为多维数组。当你希望以表格形式存储数据（例如，带有行和列的表格）时，多维数组会很有帮助。将每个数组放在它自己的大括号对中以生成二维数组，如下方的代码所示：\n\
  \n```\nint arr[][]={{1,2,3},\n{4,5,6},\n{7,8,9}\n};\n```\n\n在前面的代码段中，`[][]` 意味着我们将创建一个二维数组，`arr`\
  \ 是一个数组变量，`int` 是一个数据类型。\n\n```\nint arr[][]=new int[3][3];\narr[0][0]=10;\narr[0][1]=20;\n\
  arr[0][2]=30;\narr[1][0]=40;\narr[1][1]=50;\narr[1][2]=60;\narr[2][0]=70;\narr[2][1]=80;\n\
  arr[2][2]=90;\n```\n\n为了初始化二维数组，我们必须使用行和列数作为索引值。要创建一个三乘三的数组，我们必须根据行和列索引指定 9 个值。前面的代码段演示了这一点，该二维数组名为\
  \ `arr`。\n\n在表 4.3 中，二维数组可以用带有行、列号和数组索引的表格形式表示：\n\n| Col | 0 | 1 | 2 |\n| :--- |\
  \ :--- | :--- | :--- |\n| Row | | | |\n| 0 | 10 arr[0][0] | 20 arr[0][1] | 30 arr[0][2]\
  \ |\n| 1 | 40 arr[1][0] | 50 arr[1][1] | 60 arr[1][2] |\n| 2 | 70 arr[2][0] | 80\
  \ arr[2][1] | 90 arr[2][2] |\n\n表 4.3: 二维数组的表示\n\n### 创建二维数组](#contents.xhtml_sc4_112a)\n\
