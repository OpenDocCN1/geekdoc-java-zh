  \n* `add()`：用于向给定的 vector 中追加元素\n* `addElement()`：用于将指定的组件添加到 `vector` 的末尾。\n* `removeElement()`：用于从列表中删除指定的项\n\
  * `insertElementAt(item, n)`：在指定位置插入项。\n* `copyInto()`：用于将 `vector` 的组件复制到指定的数组中。\n\
  * `size()`：用于获取给定 `vector` 中的组件数量。\n* `clear()`：用于删除此 vector 中的所有元素。\n* `capacity()`：用于获取此\
