  \n\n\n\n\n在 Java 中，同时运行多个线程的过程被称为多线程。最小的处理单元是线程，它是一个轻量级的子进程。为了实现多任务处理，多进程和多线程都得到了利用。由于线程使用共享内存空间，因此多线程优于多进程。不分配独立的内存区域具有两个优点：节省内存和减少线程上下文切换所花费的时间。大多数游戏、动画等都使用了\
  \ Java 多线程技术。假设某位权威人士想为 Java 构建一个实验室（LAB）。为此，需要开发者、画家、电工来完成三项不同的工作，即：\n\n* 开发\n\
  * 绘画\n* 布线\n\n因此，我们可以将每项工作看作一项独立的任务。它被称为线程。在编程中，线程是一个轻量级进程。它可以被视为程序的独立流，如图所示：\n\n\
  ![](img/Figure_6.1.png)\n\n图 6.1：多线程示例\n\n下一节将解释线程生命周期的概念。\n\n### 线程生命周期](#contents.xhtml_sc2_177a)\n\
  \n在给定的时间点，线程只能处于一种状态。线程可以处于以下状态之一：\n\n* **NEW**（新建）：尚未启动的线程处于此状态。\n* **RUNNABLE**（可运行）：在\
  \ Java 虚拟机中执行的线程处于此状态。可运行线程的线程状态。处于运行状态的线程正在 Java 虚拟机中执行，但它可能正在等待系统的其他资源（如处理器）。\n\
  * **BLOCKED**（阻塞）：此条件是指线程在等待监视器锁时阻塞。等待监视器锁阻塞是线程状态。停滞的线程在进入同步块或函数之前正在等待监视器锁，或者在调用\
  \ `Object.wait` 后再次进入。\n* **WAITING**（等待）：无限等待另一个线程执行特定动作的线程处于此状态。\n* **TIMED_WAITING**（超时等待）：等待另一个线程执行动作的最长时间为指定等待时间的线程处于此状态。\n\
  * **TERMINATED**（终止）：已退出的线程处于此状态。\n\n线程生命周期详见下图 6.2：\n\n![](img/Figure_6.2.png)\n\
  \n图 6.2：线程生命周期\n\n下一节将概述线程创建的过程。\n\n### 创建线程](#contents.xhtml_sc3_178a)\n\n要创建一个线程，可以使用线程类的对象实例化。然而，Java\
  \ 定义了两种实现这一目标的方法：\n\n* 你可以实现 Runnable 接口\n* 你可以扩展 Thread 类本身\n\n首先，介绍使用 Runnable\
  \ 接口创建线程的方法。\n\n### 使用 Runnable 接口创建线程](#contents.xhtml_sc4_179a)\n\n要实现 `Runnable`，类只需要实现一个名为\
  \ `run()` 的单方法，其声明如下：`public void run()`。在 `run()` 内部，你将定义构成新线程的代码，如下所示：\n\n```java\n\
  class TstThrd1 implements Runnable{\n    public void run(){\n        System.out.println(\"\
  TstThrd1 is running\");\n    }\n}\n```\n\n在前面的代码示例中，在你创建一个实现 `Runnable` 的类 `TstThrd1`\
  \ 后，你将在该类内部实例化一个 `Thread` 类型的对象。`Thread` 定义了几个构造函数。我们将使用的那个所示如下：\n\n`Thread(Runnable\
  \ threadOb)`：在这个构造函数中，`threadOb` 是实现 `Runnable` 接口的类的实例。这定义了线程执行的起始点。\n\n```java\n\
  TstThrd1 th2=new TstThrd1();\nThread t1 =new Thread(th2);\n```\n\n新线程创建后，在调用它的 `start()`\
  \ 方法之前，它不会开始运行，该方法定义在 `Thread` 内部。本质上，`start()` 执行了对 `run()` 的调用。`start()` 方法通过\
  \ `t1.start()` 被调用。在下表中展示了该过程：\n\n```java\nclass TstThrd1 implements Runnable {\n\
  \    public void run() {\n        System.out.println(\"TstThrd1 is running\");\n\
  \    }\n    public static void main(String args[]) {\n        TstThrd1 th2=new TstThrd1();\n\
  \        Thread t1 =new Thread(th2);\n        t1.start();\n    }\n}\n```\n\n输出：\n\
  \n![](img/Figure_6.3.png)\n\n图 6.3：Runnable 接口示例\n\n在下一节中，我们将通过示例概述如何通过扩展 Thread\
  \ 类来创建线程。\n\n### 扩展线程](#contents.xhtml_sc4_180a)\n\n创建线程的第二种方法是创建一个扩展 `Thread` 的类，然后创建该类的实例。扩展类必须重写\
  \ `run()` 方法，该方法是新线程的入口。它还必须调用 `start()` 来开始新线程的执行。在表 6.1 中演示了该过程：\n\n| `import\
  \ java.lang.Thread;` |\n| `class Thrd1 extends Thread{public void run() {for(int\
  \ i = 1; i<=5; i++) {System.out.println(\"Thread1\" + \" \"+i);}}}}` | `class Thrd2\
  \ extends Thread{public void run(){for(int j = 1; j <=5; j++){System.out.println(\"\
  Thread2\" + \" \"+j);}}` | `class Thrd3 extends Thread{public void run(){for(int\
  \ k = 1; k <=5; k++){System.out.println(\"Thread3\" + \" \"+k);}}` |\n| `public\
  \ class TstThrd{public static void main(String args[]){Thrd1 th1 = new Thrd1();th1.start();Thrd2\
  \ th2 = new Thrd2();th2.start();Thrd3 th3 = new Thrd3();th3.start();}}` | 输出：`images/1.png)`\
  \ |\n\n表 6.1：Thread 类示例\n\n在讨论了线程创建后，我们立即转向线程优先级及其实现方式。\n\n### Runnable 接口与线程类的对比](#contents.xhtml_sc3_181a)\n\
  \n在这一节中，我们将以分点的形式介绍 Runnable 接口与线程类的对比：\n\n* **Java 不支持多继承**：当我们实现 `Runnable` 接口时可以扩展其他类，但当我们扩展\
  \ `Thread` 类时无法扩展其他类。因此，实现 `Runnable` 提供了扩展其他类的选项。建议使用 `Runnable`。\n* **线程安全性**：当我们实现\
  \ `Runnable` 接口时，多个线程共享同一个对象，但当我们扩展 `Thread` 类时，每个线程都分配到一个独立的对象。\n* **继承属性**：当我们扩展\
  \ `Thread` 时，会继承 `Thread` 类的所有特征，但当我们实现 `Runnable` 接口时没有进一步的特征，因为 `Runnable` 只有一个抽象函数\
  \ `run()`。因此，实现 `Runnable` 接口意味着执行轻量级操作。\n* **接口的使用**：Java 建议面向接口编程。因此，我们实现 `Runnable`\
  \ 而不是扩展线程。此外，`Thread` 类实现了 `Runnable`。\n* **除非修改类的基本行为否则不要扩展**：只有当你想要更改 `run()`\
  \ 方法和其他方法时，才扩展 `Thread` 类。如果你只想更改 `run()` 方法，实现 `Runnable` 接口是最佳选择，因为它只有一个抽象方法（`run()`）。除非要更改核心行为，否则不要扩展\
  \ `Thread` 类。\n* **实现 Runnable 时的代码灵活性**：当我们扩展 `Thread` 首先会继承所有的线程特性，我们的类成为 `Thread`\
  \ 的直接子类，因此执行的任何操作都在 `Thread` 类中。然而，当我们实现 `Runnable` 时，我们建立新线程并将运行对象作为参数传递，可以将运行对象传递给\
  \ `executorService`，并做更多事情。因此，使用 `Runnable` 时有更多的可能性，从而增加了代码的灵活性。\n\n### 线程优先级](#contents.xhtml_sc2_182a)\n\
  \n\n\n\n\nJava 为每个线程分配一个优先级，这规定了它相对于其他线程的处理方式。一个线程相对于另一个线程的相对优先级通过优先级表示，优先级是一个整数。\n\
  \n为了确定何时从一个运行中的线程切换到下一个线程，将使用线程的优先级。此时进行上下文切换是合适的。以下是确定是否发生上下文切换的简易指南：\n\n*   线程可以主动放弃控制权。这通过显式\
  \ `yielding`（让出）、`sleeping`（睡眠）或在等待处理的 I/O 上阻塞（blocking on pending I/O）来实现。在这种情况下，将检查所有其他线程，并将\
  \ CPU 分配给就绪运行的高优先级线程。\n*   线程可能会被高优先级线程抢占。在这种情况下，一个不让出处理器的低优先级线程无论正在执行什么，只会被高优先级线程直接抢占。基本上，只要有高优先级线程想要运行，它就会运行。这被称为抢占式多任务处理。\n\
  \n当两个优先级相同的线程竞争 CPU 周期时，情况会稍微复杂一些。对于 Windows 等操作系统，同优先级的线程会自动以轮询方式进行时间片划分。对于其他类型的操作系统，同优先级的线程必须主动向同级线程让出控制权。如果它们这样做，其他线程将无法运行。\n\
  \n### 设置线程优先级\n\n线程调度器使用优先级来决定何时允许每个线程运行。高优先级线程比低优先级线程获得更多的 CPU 时间。线程优先级的数值范围是 1\
  \ 到 10。`Thread` 类中定义了三个用于优先级的静态变量，如下：\n\n*   `public static int MIN_PRIORITY`: 线程可以拥有的最低优先级。值为\
  \ 1。\n*   `public static int NORM_PRIORITY`: 线程在未显式定义时的默认优先级。值为 5。\n*   `public\
  \ static int MAX_PRIORITY`: 线程的最高优先级。值为 10。\n\nJava 允许使用 `Thread` 的成员方法 `setPriority()`\
  \ 来设置线程的优先级。\n\n例如，`ThreadName.setPriority(intNumber);` /* `intNumber` 是设置线程优先级的整数值。*/\n\
  \n所以，你可以写 `ThreadName.setPriority(5);`\n\n你也可以写以下内容：\n\n*   `ThreadName.setPriority(Thread.MIN_PRIORITY);`\
  \ 优先级设置为 1，或者\n*   `ThreadName.setPriority(Thread.NORM_PRIORITY);` 优先级设置为 5\n* \
  \  `ThreadName.setPriority(Thread.MAX_PRIORITY);` 优先级设置为 10\n\n你也可以使用 `Thread` 的方法\
  \ `getPriority()` 获取当前优先级。例如，`System.out.println(th1.getPriority());`\n\n在 [表 6.2]\
  \ 中，给出了实现优先级的概念：\n\n| `import java.lang.Thread;` |\n| :--- |\n| `class Thrd1 extends\
  \ Thread{public void run(){for(int i = 1; i<=5; i++){System.out.println(\"Thread1\"\
  \ + \" \"+i);}}}}` | `class Thrd2 extends Thread{public void run(){for(int j = 1;\
  \ j <=5; j++){System.out.println(\"Thread2\" + \" \"+j);}}}}` | `class Thrd3 extends\
  \ Thread{public void run(){for(int k = 1; k<=5; k++){System.out.println(\"Thread3\"\
  \ + \" \"+k);}}}` |\n\n```java\nclass Thrd1 extends Thread{\n    public void run(){\n\
  \        for(int i = 1; i<=5; i++){\n            System.out.println(\"Thread1\"\
  \ + \" \"+i);\n        }\n    }\n}\nclass Thrd2 extends Thread{\n    public void\
  \ run(){\n        for(int j = 1; j <=5; j++){\n            System.out.println(\"\
  Thread2\" + \" \"+j);\n        }\n    }\n}\nclass Thrd3 extends Thread{\n    public\
  \ void run(){\n        for(int k = 1; k<=5; k++){\n            System.out.println(\"\
  Thread3\" + \" \"+k);\n        }\n    }\n}\n```\n\n```java\npublic class Tst {\n\
  \    public static void main(String[] args){\n        Thrd1 th1 = new Thrd1();\n\
  \        Thrd2 th2 = new Thrd2();\n        Thrd3 th3 = new Thrd3();\n        th1.setPriority(10);\n\
  \        th2.setPriority(5);\n        th3.setPriority(1);\n        th1.start();\n\
  \        th2.start();\n        th3.start();\n    }\n}\n```\n\n\n\n\n\n*   `void\
  \ stop()`: 用于停止线程。\n*   `void notify()`: 用于向等待特定对象的某一个线程发送通知。\n*   `void notifyAll()`:\
  \ 用于向特定对象的所有等待线程发送通知。\n\n以下是两个重要的方法 `join()` 和 `isAlive()`，并已通过示例进行了描述。\n\n### thread\
  \ 中的 join() 和 isAlive() 方法](#contents.xhtml_sc3_188a)\n\n有两种方法可以判断线程是否已完成。首先，你可以在线程上调用\
  \ `isAlive()`。该方法由 `Thread` 定义，其通用形式所示：\n\n```\nfinal Boolean isAlive( )\n```\n\n\
  如果调用它的线程仍在运行，则 `isAlive()` 方法返回 `true`。否则返回 `false`。虽然 `isAlive()` 偶尔很有用，但你更常用的用于等待线程完成的方法是\
  \ `join()`，所示如下：\n\n```\nfinal void join( ) throws InterruptedException\n```\n\n\
  该方法会一直等待直到调用它的线程终止为止。它的名称源于调用线程等待指定的线程加入它的这一概念。`join()` 的其他形式允许你指定等待指定线程终止的最大时间。在表\
  \ 6.4 中提供了这些示例：\n\n| import java.lang.Thread;class Thrd1 extends Thread{public void\
  \ run(){for(inti = 1; i<=5; i++){System.out.println(\"Thread1\" + \" i is \"+i);}}}\
  \ | class Thrd2 extends Thread{public void run(){for(int j = 1; j <=5; j++){System.out.println(\"\
  Thread2\" + \" j is \"+j);}}} |\n\n| public class TstThrd6{ public static void main(String\
  \ args[]){Thrd1 th1 = new Thrd1();Thrd2 th2 = new Thrd2();th1.start();th2.start();System.out.println(th1.isAlive());\
  \ /* it will return true*/System.out.println(th2.isAlive());try{th1.join(); }catch(InterruptedExceptionie){}\
  \ }} |\n\n| Output:![](img/Figure_6.7_(1).png) |\n\n表 6.4：`Thread` 中 `join()` 和\
  \ `isAlive()` 的示例\n\n现在，我们将从 `Thread.sleep()` 方法、重命名线程以及通过多线程执行单个任务方面提供四个线程编程示例。\n\
  \n### 带有正超时值的方法 sleep()](#contents.xhtml_sc3_189a)\n\n`Thread.sleep()` 会导致当前线程暂停执行指定的时间。这是为应用程序的其他线程或可能在计算机系统上运行的其他应用程序提供处理器时间的有效手段。\n\
  \n现在，我们将展示带有正超时值的 `sleep()` 源码：\n\n```java\nclass TstThrd10 extends Thread{\npublic\
  \ void run(){\nfor(int i=1;i<5;i++){\ntry{\nif (i==3)\n{\nSystem.out.println(\"\
  The thread is sleeping when the value of i is 3\");\nSystem.out.println(\"...........\"\
  );\nThread.sleep(1500);\ncontinue;\n}\n}}catch(InterruptedException e){System.out.println(e);}\n\
  System.out.println(\"The value of i is \"+ i);\n}\n}\npublic static void main(String\
  \ args[]){\nTstThrd10 t1=new TstThrd10();\nTstThrd10 t2=new TstThrd10();\nt1.start();\n\
  t2.start();\n}\n}\n```\n\n代码的输出如下：\n\n![](img/Figure_6.8_(1).png)\n\n图 6.4：带有正超时值的\
  \ `sleep()`\n\n在在上述示例中，`Thread.sleep(1500)` 方法被用于暂停执行指定的 1500 毫秒。为了为了描述这种情况，当变量值变为\
  \ 3 时我们使用语句 `System.out.println(\"...........\")`，线程在输出中打印 ........... 后将暂停 1500\
  \ 毫秒。\n\n### 带有负超时值的方法 sleep()](#contents.xhtml_sc3_190a)\n\n`Thread.sleep()` 的参数值单位是毫秒，但不能为负数，否则会导致\
  \ `IllegalArgumentException`。示例如下：\n\n```java\nclass TstThrd9 extends Thread{\n\
  public void run(){\nfor(int i=1;i<5;i++){\ntry{\nif (i==3)\n{\nSystem.out.println(\"\
  The thread is sleeping when the value of i is 3\");\nThread.sleep(-500);\ncontinue;\n\
  }\n}\n}catch(InterruptedException e){System.out.println(e);}\nSystem.out.println(\"\
  The value of i is \"+ i);\n}\n}\npublic static void main(String args[]){\nTstThrd9\
  \ t1=new TstThrd9();\nTstThrd9 t2=new TstThrd9();\nt1.start();\nt2.start();\n}\n\
  }\n```\n\n上一个程序的输出如下：\n\n![](img/Figure_6.9.png)\n\n图 6.5：带有负超时值的 `sleep()` 标题\n\
  \n在上述的代码示例中，当变量 `i` 的值为 3 时产生异常。这是由于 `Thread.sleep()` 方法的负值 -500。\n\n### 重命名线程的程序](#contents.xhtml_sc3_191)\n\
  \n以下程序演示了 `getName()` 和 `setName()` 方法的使用：\n\n```java\nclass TstThread7 extends\
  \ Thread{\npublic void run(){\nSystem.out.println(\"Thread name is: \" + getName());\n\
  }\npublic static void main(String args[]){\nTstThread7 t1 = new TstThread7();\n\
  t1.start();\nt1.setName(\"New-Name\");\nt1.start();\n}\n}\n```\n\n上一个程序的输出如下：\n\n\
  ![](img/Figure_6.10.png)\n\n图 6.6：如何给线程命名\n\n在程序中，有两个线程对象 `t1` 和 `t2`。通过 `getName()`\
  \ 和 `setName()` 方法显示 Thread-0 和 Thread-1。现在我们使用语句 `t1.setName(\"Subhajit\")` 设置名称，输出反映了变化。\n\
  \n### 多线程执行单个任务的程序](#contents.xhtml_sc3_192)\n\n在以下编程示例中，多线程执行一个简单任务：\n\n```java\n\
  class TstThread8 extends Thread{\npublic void run(){\nSystem.out.println(\"Same\
  \ task is doing\");\n}\npublic static void main(String args[]){\nTstThread8 t1=new\
  \ TstThread8();\nTstThread8 t2=new TstThread8();\nTstThread8 t3=new TstThread8();\n\
  t1.start();\nt2.start();\nt3.start();\n}\n}\n```\n\n上一个程序的输出如下：\n\n![](img/Figure_6.11.png)\n\
  \n图 6.7：多线程执行一个简单任务\n\n在上述示例中，有三个线程 `t1`、`t2` 和 `t3` 执行相同的任务。通过线程类，我们创建了三个不同的线程对象。然后使用\
  \ `start()` 方法调用每个独立线程的工作。\n\n### 线程同步](#contents.xhtml_sc2_193a)\n\n已经提到 Java 线程在相同的内存空间中运行，因此线程之间的通信很容易。线程间通信允许线程相互对话或相互等待。再次，由于程序中的所有线程共享相同的内存空间，两个线程可能会访问对象的相同变量和方法。例如，一个线程向共享对象中存储数据而另一个线程读取数据，如果第一个线程在第二个线程读取之前没有完成数据存储，就会出现同步问题。因此，我们需要确保一次只有一个线程进程访问数据。Java\
  \ 为这种同步提供了独特的语言级支持。在本节中，我们将学习 Java 中如何实现同步机制和线程间通信。\n\n\n\n\n为了解决临界区问题，一个常用的概念是监视器（monitor）。监器是一个用作互斥锁的对象，称为\
  \ `mutex`。在任何时刻，只有一个线程可以拥有监器。当一个线程获取锁时，被称为它进入了监器。所有所有尝试进入已锁监器的线程都将被挂起，直到所有线程退出监器。然而，在\
  \ Java 中，并没有这样的监器。事实上，所有的 Java 对象都有其与其关联的隐式监视器。在这里，关键字 `synchronized` 被用于指定哪些方法或语句块可以受到免受并发访问的保护。通过这种方式，当在考虑线程的情况下设计类时，类设计者决定了哪些方法不应允许并发执行。当带有\
  \ `synchronized` 方法的类被实例化时，新对象将获得它自己的隐式监视器。线程在 `synchronized` 方法内部期间，所有其他尝试调用同一实例上任何其他\
  \ `synchronized` 方法的线程都必须等待。为了退出监器并将对象的控制权交给下一个等待线程，监视器所有者只需要从方法返回即可。\n\n假设我们想要维护客户的银行账户。可能会发生多种交易，例如向账户存款某些金额和从账户提取某些金额等。现在，对于给定的账户，如果两个或多个交易同时发生，则每次只允许一次交易，而不是同时处理交易，这样永远不会发生数据不一致的情况。因此，我们需要对交易进行同步。\n\
  \n例如：下面的 Java 展示了银行中的交易如何并发执行：\n\n```java\nclass AccDetail {\n\n    public int Abalance;\n\
  \    public int accNo;\n\n    void disp Balance() {\n        System.out.println(\"\
  \ The Acc No is \" + accNo + \" and The Balance is \" + Abalance);\n    }\n\n  \
  \  synchronized void deposit(int amt){\n        Abalance = Abalance + amt;\n   \
  \     System.out.println( \" The amount \"+ amt + \" deposited\");\n        dispBalance();\n\
  \    }\n\n    synchronized void withdraw(int amt){\n        Abalance = Abalance\
  \ - amt;\n        System.out.println( \" The amount \"+ amt + \" is withdrawn\"\
  );\n        dispBalance();\n    }\n}\n\nclass TransDeposit implements Runnable{\n\
  \    int amt;\n    AccDetail accountX;\n\n    TransDeposit(AccDetail x, int amt){\n\
  \        accountX = x;\n        this.amt = amt;\n        new Thread(this).start();\n\
  \    }\n\n    public void run(){\n        accountX.deposit(amt);\n    }\n}\n\nclass\
  \ TransWithdraw implements Runnable{\n    int amt;\n    AccDetail accountY;\n\n\
  \    TransWithdraw(AccDetail y, int amt) {\n        accountY = y;\n        this.amt\
  \ = amt;\n        new Thread(this).start();\n    }\n\n    public void run(){\n \
  \       accountY.withdraw(amt);\n    }\n}\n\nclass TransactionDemo{\n    public\
  \ static void main(String args[]) {\n        AccDetail objAcc = new AccDetail();\n\
  \        objAcc.Abalance = 5000;\n        objAcc.accNo = 4568;\n        System.out.println(\"\
  \ The account number is \"+ objAcc.accNo );\n        System.out.println(\" The initial\
  \ balance is \"+ objAcc.Abalance );\n        TransDeposit t1;\n        TransWithdraw\
  \ t2;\n        t1 = new TransDeposit(objAcc, 500);\n        t2 = new TransWithdraw(objAcc,900);\n\
  \    }\n}\n```\n\n上述程序的输出如下：\n\n![](img/Figure_6.12.png)\n\n图 6.8: Java 应用展示了银行中交易是如何发生的\n\
  \n在前面的示例中，在 `AccDetail` 类中，关键字 `synchronized` 被用于 `void deposit()` 和 `void withdraw()`\
  \ 方法，以便这两个方法永远不会在同一个对象实例上同时运行。`TransDeposit` 和 `TransWithdraw` 两个类实现了 `Runnable`\
  \ 接口，并且 使用了两次 `void run()` 方法来调用 `deposit()` 和 `withdraw()` 方法，以便以同步的方式完成从同一个账户进行存款和提款的两个任务。\n\
  \n## 线程间通信\n\n线程之间有三种相互通信的方法。第一种是通过通用的共享数据。同一个程序中的所有线程共享相同的内存空间。如果一个对象可以被各种线程访问，那么这些线程共享对该对象数据成员的访问，从而相互通信。\n\
  \n线程通信的第二种方法是使用线程控制方法。有三种方法可以供线程相互通信：`suspend()`、`resume()`、`join()`。这些方法可以用于调用者线程等待被调用线程的完成。\n\
  \n线程通信的第三种方法是使用三个方法：`wait()`、`notify()` 和 `notifyAll()`；这些方法定义在 `java.lang` 包的 `Object`\
  \ 类中。实际上，这三个方法提供了一种优雅的进程间通信机制来处理 Java 中的死锁情况。由于程序中存在多线程，当一个持有监器锁的线程被挂起或等待另一个线程完成时，可能会发生死锁。如果另一个线程正在等待进入同一个监器，两个线程都将永远等待。这三个方法的用法简述如下：\n\
  \n*   `wait()`：此方法告诉调用线程放弃监器并让调用线程等待，直到发生超时或另一个线程调用了同一线程的 `notify()` 或 `notifyAll()`\
  \ 方法。\n*   `notify()`：此方法唤醒在同一对象上调用了 `wait()` 的唯一（第一个）等待线程。\n*   `notifyAll()`：此方法将唤醒在同一对象上调用了\
  \ `wait()` 的所有线程。\n\n## 结论\n\n不同的现实应用实际上基于多线程。在本章中，概述了线程的概念。学习者将对线程有更好的理解，这对于在共享环境中工作非常有有用。本章还通过银行交易的小应用描述了线程同步的另一个概念，以展示它实际上是什么以及如何结合的。\n\
  \n### 示例问题\n\n1. 用例子定义 Java 中的多线程（布鲁姆分类-1）\n2. 比较并对比 Java 中的 `Thread` 和 `Runnable`\
