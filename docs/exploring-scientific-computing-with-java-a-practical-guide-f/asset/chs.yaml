  # 第 1 章：Java 编程简介](#contents.xhtml_ch01a)\n\n## 引言](#contents.xhtml_sc2_1a)\n\n\
  本章将介绍 Java 的演变与特征，以及 Java 编程与 C、C++ 的对比分析。概述了 Java 程序语法的详细信息及所需的规范。本章还通过实际案例介绍了面向对象编程至关重要的特性。此外，通过字节码图讨论了\
  \ Java 虚拟机 (`JVM`)、Java 开发包 (`JDK`) 和 Java 运行环境 (`JRE`) 之间的关系。\n\n## 结构](#contents.xhtml_sc2_2a)\n\
  \n本章涵盖了以下主题：\n\n* Java Java\n* Java 历史\n* Java 特性\n* `JVM`、`JRE` 和 `JDK` 之间的关系\n\
  * 字节码\n\n## 目标](#contents.xhtml_sc2_3a)\n\n本章旨在涵盖 Java 编程的历史，通过编程语言家族树追溯其起源。它还探索了从过程化向面向对象编程的转变，并强调了转变的原因。本章解释了\
  \ C、C++ 和 Java 编程结构之间的区别，并结合示例强调了 Java 在面向对象背景下的特性。此外，它探索了 Java 虚拟机的架构，重点关注字节码操作。目的是让读者对\
  \ Java 的演变、原理和运行环境有全面的理解。\n\n## 介绍 Java](#contents.xhtml_sc2_4a)\n\n每个人经常使用语言作为交流模式，向他人传达思想和论点。人工创建的编程语言指导机器（尤其是计算机）的行为。语法（程序代码的语法）和语义（程序代码的含义）原则被用于设计编程语言，就像人类语言分别用于指定其结构和含义一样。编程语言用于准确定义算法，并便于有关组织和处理信息的通信。编程语言的目标是让人们能够向计算机提供指令，允许机器以预定和期望的方式运行。编程语言的家族树如图\
  \ 1.1 所示：\n\n![](img/Figure_1.1.png)\n\n图 1.1：重要编程语言的家族树\n\n现在考虑 2022 年最流行的语言。如图\
  \ 1.2 所示，根据职位要求。根据 Web 应用开发的情况，Java 是第二最常用的编程语言。\n\n![](img/Figure_1.2.png)\n\n\
  图 1.2：2022 年热门编程语言\n\nJava 是一种通用语言，通常被称为强类型语言。它通常用于面向对象编程。Java 程序代码通常被编译为 `JVM`\
  \ 规范中定义的字节码指令集和二进制表示。用 Java 编写程序代码可以分为 Applications、Apps、Applets 或 Servlets。\n\n\
  在计算机上本地独立运行的 Java 程序被称为应用程序（Applications）。Applications 和 apps 类似，尽管 app 一词通常用于描述运行在移动设备（如手机手机）上的软件。Applets\
  \ 是通过互联网下载并由 `JVM` 运行的 Java 程序，该 `JVM` 通常包含在浏览器中。\n\nServlet 程序是为 Web 服务器创建并为网站提供功能的\
  \ Java 程序。即使在现代 Web 开发中，这种 Java 程序也经常被使用。在下一节中，我们将简要讨论 Java 的历史。\n\n## Java 历史](#contents.xhtml_sc2_5a)\n\
  \nSun Microsystems 在 20 世纪 90 年代初期创建了 Java，并一直发展至今。一个由 James Gosling 领导的团队为消费级电子设备开发一种编程语言，该语言最初被称为\
  \ Oak，后来被更名为 Java。图 1.3 展示了 Java 语言早期历史中的一些重要年份：\n\n![](img/Figure_1.3.png)\n\n\
  图 1.3：Java 历史\n\n## 从过程化编程向 OOP 的转变](#contents.xhtml_sc3_6a)\n\n采用面向对象编程 (OOP) 而不是过程化编程有几个原因，如下：\n\
  \n* 在过程化编程中，系统数据和更改数据的操作通常是分开的。面向对象编程的主要优点是，数据以及更改数据或代码的操作都包含在对象内部。与属性和行为经常分离的过程化或结构化设计不同，面向对象设计将特性和行为整合到单个对象中。\n\
  \n* 将面向对象模型与过程化编程相比，我们可以说，在合理设计方面，不存在所谓的全局数据。在面向对象系统中，这种特性保证了高水平的数据完整性。面向对象编程中使用属性和方法来描述数据和行为。数据隐藏是指限制对特定属性或方法的访问的做法。\n\
  \n让我们检查过程化编程和面向对象编程语言之间的差异，如表 1.1 所示：\n\n| 过程化 (Procedural) | 面向对象 (OOP) |\n| :---\
  \ | :--- |\n| 编程基于任务或过程 | 使用对象而非任务 |\n| 任务被称为问题的一个小部分 | 对象代表人、表或时钟。它具有函数和特性 |\n\
  | 它遵循自顶而下的方法 | 它遵循自底向上的方法 |\n| 不支持访问修饰器 | 支持访问修饰器 |\n| 添加新的数据和函数容易 | 添加新的数据和函数很简单\
  \ |\n| 由于缺乏适当的数据隐藏方法，安全性较低 | 它具有数据隐藏概念，因此安全性更高 |\n| 函数的重要性大于数据 | 数据的重要性大于函数 |\n\
  | 不支持继承概念 | 支持三种模式的继承：公共、私有和受保护 |\n| 示例：C、Fortran、VB 和 Pascal | 示例：Simula、Smalltalk、C++\
  \ 和 Java |\n\n表 1.1：过程化方法与 OOP 方法的对比\n\n## C、C++ 和 Java 编程的比较](#contents.xhtml_sc3_7a)\n\
  \nC、C++ 和 Java 语言之间存在若干差异，其中一些差异如表 1.2 所示：\n\n| C | C++ | Java |\n| :--- | :---\
  \ | :--- |\n| C 只能编译，不能解释 | C++ 只能编译，不能解释 | Java 语言可以被编译也可以解释 |\n| C 支持按值传递和引用传递\
  \ | C++ 支持按值传递和引用传递 | Java 仅支持按值传递技术 |\n\n\n\n\n\n| C 不支持运算符重载和方法重载 | C++ 支持运算符重载和方法重载\
  \ | Java 只支持方法重载 |\n| :--- | :--- | :--- |\n| C 支持 goto 语句 | C++ 支持 goto 语句 | Java\
  \ 不支持 goto 语句 |\n| C 中没有继承的概念 | C++ 支持单继承和多重继承 | Java 使用 `extend` 关键字支持单继承、多级继承和层次继承\
  \ |\n| C 支持结构体（Structure）和联合体（Union） | C++ 支持结构体（Structure）和联合体（Union） | Java 不支持结构体联合体\
  \ |\n| 在 C 中，运行时错误由程序员处理 | 在 C++ 中，运行时错误由程序员处理 | 在 Java 中，运行时错误由系统处理 |\n| C 使用 `#include`\
  \ 将头文件附加到程序 | C++ 使用 `#include` 将头文件附加到程序 | Java 使用 `import` 关键字将库类附加到程序 |\n| C\
  \ 中没有命名空间的概念 | C++ 使用命名空间的概念。C++ 中没有包（package）的概念 | Java 使用包的概念。没有命名空间的概念。\n\nTable\
  \ 1.2: C、C++ 和 Java 语言的比较\n\n## Java 的特性\n\n设计 Java 的主要目标是使程序本质上具有移植性、简单安全。在 Java\
  \ 编程语言的不同重要特性中，列举如下：\n\n### 易用\n\nJava 语法非常简单，易于理解和学习。在图 1.4 中，我们讨论了与使用 `test` 类打印\
  \ Hello 消息相关的简单 Java 程序的术语。在 Java 程序中，`public` 和 `static` 关键字可以写在 `main()` 方法之前的\
  \ `static public`，这意味着顺序并不强制一致。例如：`static public void main(String args[])` 是一个有效的声明。\n\
  \n![](img/Figure_1.4.png)\n\n图 1.4: 简单 Java 程序的语法\n\n我们可以按照代码所示，以任何可接受的形式声明字符串数组：\n\
  \n```java\nclass test\n{\n    public static void main(String[] args)\n    {\n  \
  \      System.out.println(“Hello”);\n    }\n}\n```\n\n### 编译与解释\n\nJava 程序的编译过程是将程序员编写的可读文本代码（作为程序文件，即源代码）转换为字节码表示，这些字节码是\
  \ Java 虚拟机（`JVM`）架构无关（即平台无关）的指令。\n\n一旦你的程序成功转换为 Java 字节码，你就可以任何 `JVM` 或任何 Web 浏览器中解释并运行\
  \ Java 程序。Java 是两阶段系统，如图 1.5 所示。\n\n阶段 1：Java 编译器将源代码翻译成字节码指令。\n\n阶段 2：Java 解释器生成机器可以直接执行的机器码。\n\
  \n![](img/Figure_1.5.png)\n\n图 1.5: Java 程序的编译与解释\n\n### 面向对象\n\n对象一术语指的是物理实体或运行时实体，如笔、椅子、桌、电脑、手表等。使用类和对象创建程序的方法或范式被称为面向对象编程。通过引入一些概念，程序的创建和维护变得更加简单。Java\
  \ 是一种面向对象的语言，Java 中几乎一切都是对象。因此，我们能够将各种对象与数据和动作结合起来创建我们的程序。\n\n### 类和对象\n\n类是创建对象的模型、蓝图或原型。本节定义了一个模拟现实对象状态和行为的类。它刻意关注基础知识，展示了即使是简单的类也能清晰地建模状态和行为。类和对象的语法如下：\n\
  \n```java\nclass A\n{\n    void disp()\n    {\n        System.out.println(\"Object\
  \ of class A created\");\n    }\n}\n\nclass test\n{\n    public static void main(String\
  \ args[])\n    {\n        A ObjA=new A();\n        ObjA.disp();\n    }\n}\n```\n\
  \n在前面的代码中，`A` 是一个类，`ObjA` 是 `A` 类的一个对象。前面代码的输出如图 1.6 所示：\n\n![](img/Figure_1.6.png)\n\
  \n图 1.6: 类和对象的创建\n\n### 数据抽象\n\n隐藏某些细节仅向用户显示必要信息的技巧被称为数据抽象。换，用户不需要学习对象如何工作，而是被提供关于它实际执行功能的知识。抽象属性可以通过抽象类或接口来实现。实现数据抽象的编码示例见图\
  \ 1.7：\n\n![](img/Figure_1.7.png)\n\n图 1.7: 借助抽象类和接口的数据抽象\n\n在前面的代码中，类 `A` 充当抽象类，包含一个没有方法体的抽象方法，该方法在子类\
  \ `B` 中定义。抽象类规定了子类（如子类 `B`）必须遵循的协议和指南。\n\n在前面的代码中，类 `C` 实现了接口 `I`，包含一个方法 `f()`，该方法必须在实现类\
  \ `C` 中实现。\n\n### 多态\n\n以多种形式创建的能力被称为多态。假设一个人根据情况表现不同。人类是相同的，但在不同的语境下表现不同。多态有两种类型：一种是编译时多态，另一种是运行时多态。通过方法重载的概念来实现编译时多态，而通过重写的方法来实现运行时多态。编码示例见图\
  \ 1.8：\n\n![](img/Figure_1.8.png)\n\n图 1.8: 使用方法重载和重写实现多态\n\n在前面的示例中，`testAdd()`\
  \ 方法被重载以分别相两个数字和三个数字。在另一个示例中，`disp()` 方法在两个不同的类中被重写。\n\n### 继承\n\n对象可以通过继承获取或继承另一个对象的属性，这也允许进行层次分类。这背后的原理是，我们可以在现有类之上开发新类；换句话说，当你继承一个现有类时，你可以复用它的字段和方法。父子关系通过继承来表示。以下代码演示了\
  \ Java 编程中如何实现继承概念：\n\n```java\nclass Base\n{\n    int i=10;\n}\n\nclass Derived\
  \ extends Base\n{\n    System.out.println(“the value of i is”+i);\n}\n\nclass test5\n\
  {\n    public static void main(String args[])\n    {\n        Derived objD=new Derive();\n\
  \        objD.disp();\n    }\n}\n```\n\n以下是前面代码的输出：\n\n![](img/Figure_1.9.png)\n\
  \n图 1.9: 使用基类和派生类的单继承示例\n\n### 平台独立性\n\n\n\n\nJava 的平台无关性是最显著的特征之一。为一个操作系统创建的应用可以在任何其他操作系统上运行。当\
  \ Java 应用程序被编译时，会创建一个包含字节码的 `File` 类。`JVM` 从代码中读取这些字节。尽管这些字节码是在 Windows 平台上生成的，但它们可以在\
  \ Linux 环境中使用。\n\n考虑到 Java 的关键点，它是一种与架构无关的语言（也称为平台无关语言），但 `JVM` 是依赖于架构的。因此，所有的 `JVMs`\
  \ 都是为不同的操作系统设计的，而字节码（与架构无关）是相同的，并且能够在不同的操作系统上运行。这就是 Java 具有平台无关性的原因。该概念如图 1.10 所示：\n\
  \n![](img/Figure_1.10.png)\n\n图 1.10：在不同平台上解释“.class”文件\n\n## 健壮性与安全性\n\nJava 是一种健壮的语言。Java\
  \ 程序的健壮性取决于三个因素。首先，Java 对所有数据类型都有严格的编译和运行时检查。其次， Java 具有良好的异常处理机制。第三，Java 的内存管理非常强大。Java\
  \ 拥有自动垃圾回收系统来回收未使用的内存。安全性特性表明 Java 提供了针对病毒和恶意程序的广泛保护，因为 `JVM` 在程序执行时具有很强的安全检查。它确保了不会发生损坏，且安全性不会被破坏。\n\
  \n## 多线程\n\nJava 中的多线程编程功能允许你编写同时执行几个不同任务的程序。多线程的思想在代码代码所示：\n\n```java\nimport java.lang.Thread;\n\
  \nclass Thrd1 extends Thread\n{\n    public void run() {\n        for(int i = 1;\
  \ i <=5; i++) {\n            System.out.println(\"Thread1\" + \" \"+i);\n      \
  \  }\n    }\n}\n\npublic class test6\n{\n    public static void main(String args[])\n\
  \    {\n        Thrd1 th1 = new Thrd1();\n        th1.start();\n    }\n}\n```\n\n\
  前面的代码段仅演示了如何为打印 `Thread1` 下的变量值创建线程。输出如图 1.11 所示：\n\n![](img/Figure_1.11.png)\n\n\
  图 1.11：从主线程创建线程 1 正在运行\n\n## 分布式\n\n分布式编程允许程序员使用分布在互联网上并相互连接的多台计算机来提高程序的执行速度。Java\
  \ 是为分布式互联网环境设计的，因为它管理 TCP/IP 协议。\n\n## Java 作为网络语言\n\nJava 有时被称为互联网语言，因为第一个基于 Java\
  \ 的应用程序软件是 Web 浏览器 `HotJava`，它允许用户执行 Internet Applet。用户可以使用 `HotJava` 和 Java 编程语言在本地创建\
  \ Applet。\n\n## Java 作为通信工具\n\n用于网络连接的不同类定义在 `java.net` 中。`java` 程序可以使用 `TCP` 或\
  \ `UDP` 等协议在互联网上进行通信。`Socket`、`URL`、`URLConnection` 和 `ServerSocket` 等类使用 `TCP`\
  \ 在网络上进行通信。`MulticastSocket`、`DatagramPacket` 和 `DatagramSocket` 类则用于 `UDP`。Java\
  \ Communications 3.0 API 是一个 Java 扩展，有助于为智能卡、嵌入式系统、销售点设备、金融服务设备、传真机、调制解调器、显示终端和机器人设备等技术开发平台无关的通信应用。\n\
  \n## 人机界面\n\n允许操作员与控制器通信的硬件或软件被称为人机界面（HMI）。`HMI` 可以是任何带有按钮和指示灯的物理控制面板，也可以是运行带有彩色图形显示的特殊\
  \ `HMI` 软件的工业电脑。\n\n作为 `HMI` 的应用，自动化面板中的 Web 面在工业 4.0 的背景下变得越来越重要。在 Cannon 的 L1/C1\
  \ 自动化面板中，支持 Java 和 HTML5 的 浏览器被用于优化通信。\n\n## JVM、JRE 和 JDK 之间的关系\n\n为了理解 `JVM`、`JRE`\
  \ 和 `JDK` 之间的关系，我们必须理解 `JVM` 及其架构。Java 虚拟机是一个抽象的计算机器。像真实的计算机器一样，它有一组指令集并在运行时操作各种内存区域。\n\
  \n## Java 虚拟机\n\n`JVM` 被称为解释生成的字节码的解释器。`JVM` 提供了一个可以在其中执行字节码的运行时环境。`JVM` 是依赖平台的。作为抽象机器的\
  \ `JVM` 物理不存在，但 `JRE` 。`JVM` 执行以下任务：\n\n* 加载代码 [加载类文件]\n* 验证代码 [验证类文件]\n* 执行代码 [执行实际代码]\n\
  * 提供运行时环境\n\n让我们在下一段中讨论上述任务列表的详细解释。\n\n假设在源代码中，`main()` 方法拥有 `f1()` 和 `f2()` 方法。`main`\
  \ 方法存储在文件 `Test1.java` 中，`Func1()` 存储在文件 `Test2.java` 中，`Func2()` 存储在文件 `Test3.java`\
  \ 中，如图 1.12 所示：\n\n![](img/Figure_1.12.png)\n\n\n\n\n## 表 1.3: 从源代码生成的字节码\n\n每个程序中都有一个内部的操作数栈。某些字节码指令会对当前正在执行的方法对应的操作数栈进行操作。在将这些值推入栈后，将对它们进行处理。一旦进入栈中，这些值就可以作为操作的输入。\n\
  \n考虑一个例子，假设我们想相数字 1 和 2。这两个值必须首先通过执行字节码指令 `iconst_1` 和 `iconst_2` 被推入操作数栈。在栈中有了这两个数字后，`iadd`\
  \ 指令现在可以通过从栈顶弹出（pop）这两个值来消耗它们。结果，该指令将所消耗值之和推回栈中。详细的逐步操作请见下方的图 1.16：\n\n![](img/Figure_1.16.png)\n\
  \n### 图 1.16: 如何使用操作数栈执行字节码\n\n## 结论](#contents.xhtml_sc2_26a)\n\n在本章中，以语言作为一种通信工具，定义了编程语言的概念。还给出了\
  \ Java 编程的历史。讨论了从过程化范式到面向对象范式的转变。通过代码示例学习了 Java 编程的所有重要特征。并讨论并解释了 `JVM`、`JRE` 和\
  \ `JDK` 之间的联系。\n\n在下一章中，我们将详细讨论数据类型、运算符、条件语句和循环的概念。\n\n## 习题](#contents.xhtml_sc2_27a)\n\
