  \ 的表示\n\n前一个程序的输出为：\n```\nimages/Figure11.9\n```\n`Tic-tac-toe` 的输出\n\n### AES 加密与解密\n\
  `Cipher` 类提供了加密和解密的密码算法功能。它成了 Java 加密扩展（JCE）框架的核心。\n\n为了创建 `Cipher` 对象，应用程序调用 `Cipher.getInstance()`\
  \ 方法，并向其传递请求的转换格式。可选地可以指定提供者的名称。例如，以下转换格式是有效的：\n```\nCipher c = Cipher.getInstance(\"\
  AES/CBC/PKCS5Padding\");\n```\n\n使用 `CFB` 和 `OFB` 等模式，块算法可以使用小于实际块大小的单元加密数据。在请求此类模式时，可以通过在模式名称后附加数字来可选地指定每次处理的位数，如\
  \ `AES/CFB8/NoPadding` 和 `AES/OFB32/PKCS5Padding` 转换所示。如果未指定此类数字，则使用提供者特定的默认值。因此，通过使用\
  \ `CFB8` 或 `OFB8` 等 8 位模式，可以将块算法转换为面向字节的流加密。\n\n\n\n\n如带有关联数据的认证加密（AEAD）等模式为机密数据和未加密的附加关联数据（AAD）提供真实性保证。（有关\
  \ AEAD 和如 GCM/CCM 等 AEAD 算法的更多信息，请参见 RFC 5116。）在计算认证标签（类似于 Mac）时，可以使用机密数据和 AAD 数据。该标签在加密期间附加到密文中，并在解密时进行验证。\n\
  \n`KeyGenerator` 类提供了秘密（对称）密钥生成器的功能。密钥生成器是使用该类的 `getInstance` 类方法之一构造的。`KeyGenerator`\
  \ 对象是可重用的，也就是说，在生成密钥后，可以重用同一个 `KeyGenerator` 对象生成更多密钥。\n\n生成密钥有两种方式：与算法无关的方式和特定算法的方式。两者之间的唯一区别在于对象的初始化：\n\
  \n*   **算法无关初始化**：所有密钥生成器都共享密钥大小和随机性源的概念。此 `KeyGenerator` 类中有一个 `init` 方法，它接收这两个通用共享的类型参数。还有一个方法仅接收一个\
  \ `keysize` 参数，并使用优先级最高的已安装提供者的 `SecureRandom` 实现作为随机性源（如果没有已安装的提供者提供 `SecureRandom`\
  \ 实现，则使用系统提供的随机性源），还有一个仅接收一个随机性源。\n\n    由于在调用上述算法无关的 `init` 方法时没有指定其他参数，如何处理与每个密钥关联的特定算法参数（如果有），取决于提供者。\n\
  \n*   **特定算法初始化**：对于已经存在一组特定算法参数的情况，有两个带有 `AlgorithmParameterSpec` 参数的 `init` 方法。其中一个还有一个\
  \ `SecureRandom` 参数，而另一个则使用优先级最高的已安装提供者的 `SecureRandom` 实现作为随机性源（如果没有已安装的提供者提供 `SecureRandom`\
  \ 实现，则使用系统提供的随机性源）。\n\n    如果客户端没有显式地初始化 `KeyGenerator`（通过调用 `init` 方法），每个提供者必须提供（并文档）一个默认初始化。\n\
  \nJava 平台的每个实现都要求支持以下标准 `KeyGenerator` 算法，其密钥大小如括号中所示：\n\n*   AES (128)\n*   DES\
  \ (56)\n*   DESede (168)\n*   HmacSHA1\n*   HmacSHA256\n\n秘密（对称）密钥。此接口的目的是对所有秘密密钥接口分组（并提供类型安全）。\n\
  \n此接口的提供者实现必须重写继承自 `Object` 的 `equals` 和 `hashCode` 方法，以便根据底层的密钥材料而不是引用来比较秘密密钥。实现应当重写来自\
  \ `Destroyable` 接口的默认 `destroy` 和 `isDestroyed` 方法，以便使敏感的密钥信息被销毁、清除，或者在此类信息不可变的情况下被取消引用。最后，由于\
  \ `SecretKey` 是 `Serializable` 的，实现还应该重写 `ObjectOutputStream.writeObject(java.lang.Object)`\
  \ 以防止已销毁的密钥被序列化。\n\n实现此接口的密钥返回 `RAW` 字符串作为其编码格式（参见 `getFormat`），并返回 `getEncoded`\
  \ 方法调用结果的原始密钥字节。（`getFormat` 和 `getEncoded` 方法继承自父接口 `Key`。）\n\n用于密钥规范和算法参数规范的 `javax.crypto.spec`\
  \ 类和接口。\n\n密钥规范是构成密钥的密钥材料的透明表示。密钥可以以特定算法的方式指定，也可以以算法无关的编码格式（如 ASN.1）指定。此包包含 Diffie-Hellman\
  \ 公钥和私钥的密钥规范，以及 DES、Triple DES 和 PBE 秘密密钥的密钥规范。\n\n算法参数规范是用于算法的参数集的透明表示。此包包含用于 Diffie-Hellman、DES、Triple\
  \ DES、PBE、RC2 和 RC5 算法的算法参数规范。\n\n*   PKCS #1：RSA 密码学规范，版本 2.2 (RFC 8017)\n*   PKCS\
  \ #3：Diffie-Hellman 密钥协商标准，版本 1.4，1993 年 11 月。\n*   PKCS #5：基于密码的加密标准，版本 1.5，1993\
  \ 年 11 月。\n*   联邦信息处理标准出版（FIPS PUB）46-2：数据加密标准 (DES)\n\n`GCMParameterSpec` 指定了使用伽罗斯/计数模式（GCM）模式的\
  \ `Cipher` 所需参数集。\n\n简单的分组密码模式（如 CBC）通常只需要初始化向量（如 `IvParameterSpec`），但 GCM 需要这些参数：\n\
  \n*   IV：初始化向量 (IV)\n*   tLen：认证标签 T 的长度（位）\n\n除了此处描述的参数外，其他 GCM 输入/输出（AAD、密钥、分组密码、明文/密文和认证标签）在\
  \ `Cipher` 类中处理。\n\n有关 AEAD 算法的更多信息，请参见 RFC 5116 以及 NIST 特别出版 800-38D，NIST 分组密码模式建议：伽罗斯/计数模式\
  \ (GCM) 和 GMAC。\n\nGCM 规范规定 `tLen` 只能取值 {128, 120, 112, 104, 96}，或者对于某些应用 {64, 32}。此类可以指定其他值，但并非所有的\
  \ CSP 实现都支持它们。\n\n此类 `Base64`完全由获取 Base64 编码器和解码器的静态方法组成。此类的实现支持 RFC 4648 和 RFC\
  \ 2045 规定的以下 Base64 类型。\n\n*   Basic：使用 RFC 4648 和 RFC 2045 表 1 中规定的 Base64 字母表进行编码和解码。编码器不添加任何换行符（行分隔符）。解码器拒绝包含\
  \ Base64 字母表之外字符的数据。\n*   URL and Filename safe：使用 RFC 4648 表 2 中规定的 URL 和文件名安全\
  \ Base64 字母表进行编码和解码。编码器不添加任何换行符（行分隔符）。解码器拒绝包含 Base64 字母表之外字符的数据。\n*   MIME：使用 RFC\
  \ 2045 表 1 中规定的 Base64 字母表进行编码和解码。编码输出必须以每行不超过 76 个字符的形式表示，并使用回车 \\r 紧跟换行符 \\n 作为行分隔符。编码输出末尾不添加行分隔符。解码操作忽略所有不在\
  \ base64 字母表中的行分隔符或其他字符。\n\n除非另有说明，向此类的方法传递 `null` 参数将导致抛出 `NullPointerException`。\n\
  \n\n\n\n不可变的任意精度整数。所有操作的行为都如同 `BigIntegers` 是以补码形式表示的（类似于 `Java` 的原始整数类型）。`BigInteger`\
  \ 提供了 `Java` 所有原始整数操作符的对应物，以及 `java.lang.Math` 中的所有相关方法。此外，`BigInteger` 还提供了模运算、最大公约数（GCD）计算、素性测试、质数生成、位操作以及其他杂操作。\n\
  \n算术操作的语义模拟了《Java 语言规范》中定义的 `Java` 整数算术操作符。例如，除以零会抛出 `ArithmeticException`，负数除以正数会得到负数（或零）余数。`Spec`\
  \ 中关于溢出的所有细节都被忽略了，因为 `BigIntegers` 会创建得足够大以容纳操作的结果。\n\n移位操作的语义扩展了 `Java` 移位操作符，允许负位移距离。负位移距离的右移会导致左移，反之亦然。省略了无符号右移运算符（`>>>`），因为该操作与此此类提供的无限字长抽象结合时意义不大。\n\
  \n按位逻辑操作的语义完全模拟了 `Java` 的位整数操作符。二元运算符（`and`、`or`、`xor`）在执行操作之前，隐含地对两个操作数中较短的一个进行符号扩展。\n\
  \n比较操作执行符号整数比较，类似于 `Java` 关系和相等操作符执行的操作。\n\n提供了模运算操作来计算剩余、执行幂运算以及计算倒数。这些方法始终返回一个非负结果，范围在\
  \ 0 到 `(modulus - 1)` 之间（包含边界）。\n\n位操作在操作数补码表示的单个位上进行。如有必要，会对操作数进行符号扩展以包含指定的位。任何单位操作都无法产生与操作的\
  \ `BigInteger` 符号不同的 `BigInteger`，因为它们只影响单个位，而此此类提供的无限字长抽象确保了每个 `BigInteger` 前面有无限多个虚拟符号位。\n\
  \n为了简洁和清晰，在 `BigInteger` 方法的描述中全程使用了伪代码。伪代码表达式 `(i + j)` 是一个值为 `BigInteger i` 与\
  \ `BigInteger j` 之和的 `BigInteger` 的简写。伪代码表达式 `(i == j)` 是当且仅当 `BigInteger i` 表示与\
  \ `BigInteger j` 相同的值时为真的简写。其他伪代码表达式也以类似的方式解释。\n\n此类 `SecureRandom` 提供了一个密码学强随机数生成器（RNG）。\n\
  \n密码学强随机数至少符合 `FIPS 140-2`《加密模块安全要求》第 4.9.1 节指定的统计随机数生成器测试。此外，`SecureRandom` 必须产生非确定性输出。因此，传递给\
  \ `SecureRandom` 对象的任何种子材料必须是不可预测的，且所有的 `SecureRandom` 输出序列必须是如描述的密码学强序列。\n\n调用者通过无参构造函数或其中一个\
  \ `getInstance` 方法获取 `SecureRandom` 实例：\n\n```\nSecureRandom random = new SecureRandom();\n\
  ```\n\n许多 `SecureRandom` 实现采用伪随机数生成器（PRNG）的形式，这意味着它们使用确定性算法从真随机种子产生伪随机序列。其他实现可能会产生真随机数，而另一些则可能结合了这两种技术。\n\
  \n`SecureRandom` 的典型调用者通过以下方法检索随机字节：\n\n```\nSecureRandom random = new SecureRandom();\n\
  byte bytes[] = new byte[20];\nrandom.nextBytes(bytes);\n```\n\n调用者还可以调用 `generateSeed`\
  \ 方法生成指定数量的种子字节（例如为其他随机数生成器种子）：\n\n```\nbyte seed[] = random.generateSeed(20);\n\
  ```\n\n使用 `RSA` 算法的加密和解密过程如下：\n\n![](img/Figure_11.13.png)\n\n图 11.13：使用 Java 程序表示\
