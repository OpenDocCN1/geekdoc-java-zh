  \ Java 代码并提供解决方案。（布鲁姆分类-5）\n\n### 单选题\n\n1. 在 Java 中实现继承需要哪个关键字？\n   1. 多个线程同时运行被称为\
  \ Java 多线程。\n   2. 多个线程同时挂起被称为 Java 多线程。\n   3. 同时运行一个线程被称为 Java 多线程。\n   4. 挂挂起一个线程被称为\
  \ Java 多线程。\n\n2. `Thread` 是一个 _______\n   1. 类\n   2. 对象\n   3. 接口\n   4. 方法\n\n\
  3. 使用 `Runnable` 接口在 Java 中使用的关键字 ___________。\n   1. This\n   2. Super\n   3. Extend\n\
  \   4. implement\n\n4. `MIN_PRIORITY` 意味着\n   1. 1\n   2. 2\n   3. 5\n   4. 10\n\
  \n5. 如果被调用的线程仍在运行，则 `isAlive()` 方法返回 ______。\n   1. True\n   2. False\n\n6. `notify()`\
  \ 用于 ______\n   1. 为等待特定对象的唯一线程发送通知。\n\n\n\n\n2. 向多个等待特定对象的线程发送通知。\n\n3. 不向仅一个等待特定对象的线程发送通知。\n\
  \n4. 无\n\n### 7. `join()` 方法 _____________\n\n1. 不会等到调用它的线程结束为止等待。\n2. 等到调用它的线程结束为止等待。\n\
  3. 等到它开始运行的线程开始运行为止等待。\n4. 等到调用它的线程恢复执行为止等待。\n\n### 8. `final` 变量用于可以更改变量值的地方\n\n\
  1. 正确\n2. 错误\n\n### 9. `yield()` 用于 _________。\n\n1. 限制该类被进一步扩展\n2. 当它可以被子类化时\n\
  3. 它在本质上是抽象的\n4. 用于实现继承概念\n\n### 10. `public` 访问修饰符用于：\n\n1. 基类可以被同一包中的子类和非子类访问\n\
  2. 基类可以被其他包中的子类访问\n3. 基类可以被其他包中的非子类访问\n4. 以上所有\n\n#### 答案\n\n1. a\n2. a\n3. d\n\
  4. a\n5. a\n6. a\n7. b\n8. b\n9. b\n10. d\n\n#### 参考\n\n1. [`www.dspmuranchi.ac.in/pdf/Blog/JAVA%20thread.pdf`](http://www.dspmuranchi.ac.in/pdf/Blog/JAVA%20thread.pdf)\n\
