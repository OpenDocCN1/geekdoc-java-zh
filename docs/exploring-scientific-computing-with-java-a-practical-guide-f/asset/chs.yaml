  \n`String` 是不可变的。一旦创建了 `String` 对象，其内容就无法更改。下面的图展示了 `String` 类不可变性的示例：\n\n![](img/Figure_4.17.png)\n\
  \n图 4.17：不可变字符串类的示例\n\n在前面的图 4.17 中，我们已经证明了字符串一旦创建就无法更改。`String s1` 的内容一旦创建就永远不会改变。当创建一个新对象\
  \ `String s2` 时，将为其分配新的内存地址。即使我们调用 `concat()` 方法，也会分配新的内存位置。为了证明这一属性，我们使用了 `System`\
  \ 类的 `identityHashCode()`，它返回对象的内存地址。\n\n![](img/Figure_4.18.png)\n\n图 4.18：不可变字符串类的输出\n\
  \n在前面的图 4.18 中，`String s1` 的内存地址与 `String s2` 的内存地址不同，`1072408673` 与 `1531448569`。此外，语句\
  \ `String s3=s1.concat(s2)`并不指向之前创建的对象 `s1`，而是为 `String s3` 创建了新的内存。语句 `System.identityHashCode(s3)`\
  \ 返回新的内存地址 `1867083166`，证明了 Java 中 `String` 是不可变的属性。\n\n## 作为引用类型的 String\n\n引用类型为用户提供了访问存储在内存中的项的方法，并持有这些对象的引用。`java.lang`\
  \ 类型的子类包含了所有引用类型 `Object`。Java 的基本类型和引用类型在几个方面有所不同。表 4.11 给出了引用类型与基本类型的对比：\n\n|\
  \ 引用类型 | 基本类型 |\n| :--- | :--- |\n| 所有引用类型都是 `java.lang` 的子类。 | `boolean`, `byte`,\
  \ `short`, `int`, `long`, `float`, `double`。 |\n| 内存位置存储引用。 | 内存位置存储数据。 |\n| 当引用类型赋值给另一个时，它复制引用。\
  \ | 当基本类型赋值给另一个时，它复制实际值。 |\n\n表 4.11：引用类型与基本类型的对比\n\n## StringBuffer 类\n\n`StringBuffer`\
