  4. b\n5. a\n6. c\n7. a\n8. c\n9. b\n10. a\n\n参考文献\n1. c\n2. a\n3. c\n4. b\n5. a\n\
  6. c\n7. a\n8. c\n9. b\n10. a\n\n\n\n\n\n# 访问修符\n\n## 目标\n\n本章的主要目标是提供从继承角度理解代码如何重用的概念。将以代码重用性为目标讨论继承的必要性。随后，将通过适当的图和源代码展示不同类型的继承。接下来，将通过示例介绍方法重写（Method\
  \ Overriding）的概念。这对于理解同一个方法在不同情况下如何产生不同行为至关重要。将通过适当的示例解释与重写相关的最重要的概念——动态方法分发（Dynamic\
  \ Method Dispatch）。然后，将演示如何使用 `final` 关键字以不同的方式保护继承。通过 `final` 类、`final` 方法和 `final`\
  \ 数据成员，可以限制继承属性属性。因此，学习者将学习如何使用 `final` 关键字的概念来限制继承属性。本章还将提供关于抽象类（Abstract Class）以及如何在\
  \ Java 中实现它以仅作为基类的简要介绍。在本章中，我们还将介绍继承的概念，以及它如何帮助在 Java 中实现多重继承。最后，将通过图示和示例讨论 Java\
  \ 中可用的访问修符概念。\n\n## 继承引言\n\n在本节中，我们将通过一个非常简单的示例介绍继承的概念。根据定义，我们可以说当一个对象获取了父对象的所有属性和行为时，就称为继承。它提供了代码重用性。在接下来的图\
  \ 5.1 中，给出了一个简单的代码示例：\n\n![](img/Figure_5.1.png)\n\n图 5.1: 继承示例\n\n以下是上述代码的输出：\n\
  \n![](img/Figure_5.2.png)\n\n图 5.2: 继承示例的输出\n\n在前面的图 5.1 中，我们正尝试展示一个非常基础的生活示例，因为我们从父母那里继承了姓氏。在给示例中，姓氏被作为\
  \ `String` 类型的 `lname` 定义在基类 `father` 中。派生类 `chld` 继承了基类的属性 `lname`，基类有一个属性 `fname`。然后通过创建\
  \ `chld` 类的对象 `c1`，我们将孩子的显示为 `SubhajitAdhikari`。\n\n接下来，下面的图表示了继承中使用的术语：\n\n![](img/Figure_5.3.png)\n\
  \n图 5.3: 继承中使用的术语\n\n正如我们在图 5.3 中看到的，孩子从父亲那里继承属性。同样，在 Java 中，有两个类，例如：\n\n* 父类（超类或基类）\n\
  * 子类（子类或派生类）\n\n继承属性的类被称为子类，而属性被继承的类是使用 `extend` 关键字被称为父类。在接下来的图 5.4 中，演示了这一概念：\n\
  \n![](img/Figure_5.4.png)\n\n图 5.4: Java 中带语法的继承示例\n\n在前面的图 5.4 中，有两个类：`Base` 类和\
  \ `Derived` 类。该图还提供了如何在 Java 编程中实现继承的语法说明。`Derived` 类使用 `extends` 关键字来继承 `Base`\
  \ 类的属性和行为。在下一节中，将讨论继承中使用的重要术语。\n\n## 继承中使用的术语\n\n以下术语最适合描述继承：\n\n* **子类 (Sub class)**：`Subclass`\
  \ 是继承另一个类的类。它也被称为派生类、扩展类或子类。\n* **超类 (Super class)**：`Super class` 是子类从中继承特征的类。它也被称为基类或父类。\n\
  \n`extends` 关键字扩展一个类（表示类继承自另一个类）。现在，将在下一节中讨论 OOP 中继承属性的必要性。\n\n## 继承的必要性\n\n继承所需的第一个原因是，当一个类仅仅是另一个类的修改时，相同代码的重复最少。另一个原因是可以通过继承以下形式实现代码的本地化：\n\
  \n* 如果你在父类中修复漏洞，它会自动在子类中修复。\n* 如果你在父类中添加功能，它会自动添加到子类中。\n* 同一操作出现不同且不一致实现的几率更低。\n\
  \n在对继承的基本概念进行详细讨论后，我们现在将理解 Java 语言中可能的各种继承类型。\n\n## Java 中的继承类型\n\nJava 中存在四种继承类型，如下：\n\
  \n* 单继承 (Single inheritance)\n* 多级继承 (Multi-level inheritance)\n* 层级继承 (Hierarchical\
  \ inheritance)\n* 多重继承 (Multiple inheritance - 通过接口实现)\n\n在本节中，我们将讨论前三种基本的继承类型以及它们的图示表示。你可以在图\
  \ 5.5 中看到源代码：\n\n![](img/Figure_5.5.png)\n\n图 5.5: 不同继承类型的示例\n\n## 单继承\n\n当一个类从其基类派生出来时，这种继承被称为单继承。在单继承中，只允许一个基类和一个子类。该概念在图\
  \ 5.5 中进行了解释。源代码在接下来的图 5.6 中提供：\n\n![](img/Figure_5.6.png)\n\n图 5.6: 单继承示例\n\n以下是上述代码的输出：\n\
  \n![](img/Figure_5.7.png)\n\n图 5.7: 继承的输出\n\n在前面的图 5.6 中，我们取了两个类，其中一个代表基类 `A`，一个代表派生类\
  \ `B`。基类 `A` 只有一个属性或数据成员，类型为 `String`，赋值为 `Fish` 并继承到派生类 `B` 中。在派生类 `B` 中定义的 `think()`\
  \ 方法中通过继承的概念重用了数据成员 `st`。\n\n## 多级继承\n\n在这种继承类型中，派生类是从另一个派生类创建的，并可以有任何层级。多级继承是从另一个本身源自另一个类的类派生出来的过程，即一个具有多个父类但在不同层级源自它们的类。示例在接下来的图\
  \ 5.8 中提供：\n\n![](img/Figure_5.8.png)\n\n图 5.8: 多级继承示例\n\n以下是上述代码的输出：\n\n![](img/Figure_5.9.png)\n\
  \n图 5.9: 多级继承的输出\n\n\n\n\n\n多个子类可以使用一种名为层次继承（hierarchical inheritance）的继承来继承单个父类的方法和属性。由于层次继承，子类不需要担心单独开发父类已经可以访问的方法和属性。相反，它们只需要构造所属类特有的方法和属性。因此，代码冗余也减少了，因为很少出现重复。所以，层次继承使得代码更具重用性、减少冗余、模块化且易于理解。示例见以下\
  \ 图 5.10：\n\n![](img/Figure_5.10.png)\n\n图 5.10: 层次继承的示例\n\n以下是前述代码的输出：\n\n![](img/Figure_5.11.png)\n\
  \n图 5.11: 层次继承的输出\n\n在之前的述示例 图 5.10 中，`eat()` 方法在 `B` 和 `C` 等所有派生类中都是可用的。我们可以使用\
  \ `B` 和 `C` 的对象调用此方法，因此输出 `A is eating` 出现了两次。此外，类 `C` 有一个新方法 `join()`，根据继承的概念，我们也可以调用它。让我们讨论继承的优点。\n\
  \n## 继承的优点](#contents.xhtml_sc2_152a)\n\n继承有三个基本优点，例如：\n\n*   代码重用性：通过继承，基类的公共方法可以在派生类中重用。\n\
  *   数据隐藏：基类的私有数据无法被派生类修改。\n*   方法重写（Overriding）：通过继承，我们能够在派生类中重写基类的方法。\n\n在对继承进行详细讨论后，下一节将讨论最相关的概念——方法重写。\n\
  \n## 方法重写](#contents.xhtml_sc2_153a)\n\n如果在父类和子类中定义了具有相同签相同方法，则被称为方法重写（method overriding）。在从子类调用时，始终会呈现子类的方法。假设我们知道\
  \ `Bank` 是一个提供获取利率功能的类。然而，利率根据不同的银行而异：`SBI`、`ICICI` 或 `AXIS`。这样，假设方法 `calInterest()`\
  \ 可以被重写到三个类 `SBI`、`ICICI` 和 `AXIS` 中，具有相同的名称和签名以提供不同的利率。现在让我们讨论重写的规则。\n\n## 方法重写的规则](#contents.xhtml_sc3_154a)\n\
  \n以下是方法重写的规则：\n\n*   方法名应相同。\n*   参数列表应相同。\n*   实现不同。\n*   方法的返回类型相同。\n\n方法重写的示例见以下\
  \ 图 5.12：\n\n![](img/Figure_5.12.png)\n\n图 5.12: 方法重写的示例\n\n以下是前述代码的输出：\n\n![](img/Figure_5.13.png)\n\
  \n图 5.13: 方法重写的输出\n\n在之前的 图 5.12 示例中，`disp()` 方法在基类 `A` 和子类 `B` 中分别定义了具有相同的名称和签名。当使用子类\
  \ `B` 的实例（即 `obj`）调用方法时，它重写了父类的方法。这就是为什么输出是 `In class B` 的原因，这是子类版本，而不是父类版本的 `disp()`\
  \ 方法。\n\n## 动态方法分派](#contents.xhtml_sc2_155a)\n\n父类引用变量可以指向子类对象。在运行时，Java 使用这一事实来解析对重写方法的调用。Java\
  \ 根据运行时调用时所引用的对象类型来选择执行该方法的哪一个版本。当引用了多个类型的对象时，会调用重写方法的不同版本。动态方法分派的示例见以下 图 5.14：\n\
  \n![](img/Figure_5.14.png)\n\n图 5.14: 动态方法分派的示例\n\n以下是前述代码的输出：\n\n![](img/Figure_5.15.png)\n\
  \n图 5.15: 动态方法分派的输出\n\n在之前的 图 5.14 程序中，创建了一个名为 `A` 的父类以及它的两个子类，分别称为 `B` 和 `C`。子类\
  \ `B` 和 `C` 重写了在 `A` 中定义的 `disp()`。在 `main()` 方法内部，声明了类型为 `A`、`B` 和 `C` 的对象。还声明了一个类型为\
  \ `A` 的引用 `r`。程序随后将每个类型对象的引用赋值给 `r`，并使用该引用调用 `disp()`。如输出所示，执行的 `disp()` 版本取决于调用时所引用的对象类型。如果是由引用变量\
  \ `r` 的类型决定的，你将看到三次对 `A` 对象 `disp()` 方法的调用。\n\n## super 关键字](#contents.xhtml_sc2_156a)\n\
  \n如果你的方法重写了其父类的一个方法，你可以通过使用关键字 `super` 调用被重写的方法。你也可以使用 `super` 来引用隐藏的字段（尽管不建议隐藏字段）。它可以用于引用直接父类的方法。示例见以下\
  \ 图 5.16：\n\n![](img/Figure_5.16.png)\n\n图 5.16: super 关键字的示例\n\n以下是前述代码的输出：\n\n\
  ![](img/Figure_5.17.png)\n\n图 5.17: super 关键字的输出\n\n在之前的 图 5.16 中，给出了 `super` 关键字的源码。我们可以看到子类\
  \ `B` 中的 `super.disp()` 调用了直接父类 `A` 的 `disp()` 方法。因此，输出是 `Inside class B` `Inside\
  \ class A`。`super` 的另一个应用是调用父类的构造函数。调用父类构造函数的语法见 图 5.18。然而，它必须是子类构造函数内部的第一行代码：\n\
  \n![](img/Figure_5.18.png)\n\n图 5.18: 调用父类构造函数的 super 关键字\n\n以下是前述代码的输出：\n\n![](img/Figure_5.19.png)\n\
  \n图 5.19: 示例的输出\n\n从之前的 图 5.18 中，我们可以观察到父类构造函数 `super()` 的调用必须是子类构造函数的第一行。在子类 `B`\
  \ 中，构造函数 `B()` 内部 `super()` 必须是第一行，第二行代码可以是任何内容，如 `String s=\"hii\";`。\n\n## final\
  \ 关键字](#contents.xhtml_sc2_157a)\n\n对于类、属性和方法，`final`关键字是一种防止更改的非访问修饰符（无法继承或重写）。当变量（如\
  \ `PI`）应该始终存储相同的值时，`final`关键字非常有用（3.14159）。\n\n`final`关键字相对于变量、类和方法的使用将在后续节中讨论。\n\
  \n## final 变量](#contents.xhtml_sc3_158a)\n\n如果你将任何变量标记为 `final`，则无法更改该变量的值。它是一个常量。示例见以下\
  \ 图 5.20：\n\n![](img/Figure_5.20.png)\n\n图 5.20: final 变量的示例\n\n以下是前述代码的输出：\n\n\
  ![](img/Figure_5.21.png)\n\n图 5.21: final 变量的输出\n\n\n\n\n\n## 图 5.22: final 类的示例\n\
  \n以下是上述代码的输出：\n\n![](img/Figure_5.23.png)\n\n图 5.23: final 类的输出\n\n你可能想这样做，原因如下：\n\
  \n* 为了通过防止系统颠覆来增加系统安全性，以及\n* 出于良好的面向对象设计考虑。\n* **安全性**：创建一个类的子类，然后用它替换原始类，是黑客用来破坏系统的一种方法。虽然子类的外观和感觉与原始类相似，但它的运行方式大不相同，甚至可能造成损害或访问个人数据。你可以将你的类声明为\
  \ `final`，以阻止这种形式的颠覆，并结果导致停止任何子类的创建。正是由于这个原因，`String` 类是一个 `final` 类。该类必须确保每当方法或对象使用\
  \ `String` 时，接收到的都是精确的 `Java.lang.String` 而不是其他类型的字符串，因为它对 Java 平台的功能至关重要。这保证了任何字符串都不会具有任何特殊、不一致、不想要或意外的特征。\n\
  \n    如果你尝试编译 `final` 类的子类，编译器将拒绝构建你的程序并产生错误信息。此外，Java 运行时系统会确保不会发生字节码级别的颠覆。通过确保一个类不是\
  \ `final` 类的子类，实现了这一点。\n* **设计**：一个类也可能为了面向对象的设计目的而声明为 `final`。你可能认为你的类是完美的，或者它不应该有任何子类。\n\
  \n## final 方法\n\n类的一个或部分方法可以被指定为 `final`。如果一个方法不能被子类重写，则在方法定义通过 `final` 关键字指示。这是通过\
  \ `Object` 类实现的，该类有几个 `final` 方法。由于方法的实现不应被更改，并且对于维护对象的一致性至关重要，你可能希望将其声明为 `final`。示例见下面的\
  \ 图 5.24：\n\n![](img/Figure_5.24.png)\n\n图 5.24: final 方法的示例\n\n以下是上述代码的输出：\n\n\
  ![](img/Figure_5.25.png)\n\n图 5.25: final 方法的输出\n\n## 抽象类 (Abstract class)\n\n被声明为\
  \ `abstract` 的类可能包含或不包含 `abstract` 方法。虽然它们不能从零创建，但抽象类可以被子类化。当创建一个抽象类的子类时，它通常会为父类的每个\
  \ `abstract` 方法提供实现。示例见下面的 图 5.26：\n\n![](img/Figure_5.26.png)\n\n图 5.26: 抽象类的示例\n\
  \n以下是上述代码的输出：\n\n![](img/Figure_5.27.png)\n\n图 5.27: 抽象类的输出\n\n抽象类具有以下属性：\n\n* 抽象类必须用\
