  \n## Java 中的 this 关键字\n\n有时，方法需要引用调用它的对象。为了允许这一点，Java 定义了 `this` 关键字。`this` 关键字可以在任何方法内部使用以引用当前对象。也就是说，`this`\
  \ 始终是对调用该方法的对象的引用。你可以在允许引用当前类对象的任何地方使用 `this`。`this` 关键字的源码见图 3.22：\n\n![](img/Figure_3.22.png)\n\
