  \ c)` | 将指定的字符追加到此 Writer 中。 |\n| `append(CharSequence csq)` | 将指定的字符序列追加到此 writer。\
  \ |\n| `append(CharSequence csq, int start, int end)` | 将指定的字符序列的子序列追加到此 Writer\
  \ 中。 |\n| `close()` | 关闭流，先刷新。 |\n\n\n\n\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `flush()`\
  \ | 刷新流。 |\n| `write(char[] cbuf)` | 写入字符数组。 |\n| `write(char[] cbuf, int off, int\
  \ len)` | 将字符插入到数组的特定区域。 |\n| `write(int c)` | 写入单个字符。 |\n| `write(String str)`\
