  \n1. 什么是 Stream（流）？\n    1. 一个包是一系列有序的数据\n    2. 流（stream）是一系列有序的数据\n    3. 文件夹是一系列无序的数据\n\
  \    4. 流（stream）是一系列无序的数据\n\n2. 在这些流中，哪些类与字符流兼容？\n    1. `Character Stream`（字符流）\n\
  \    2. `OutputStream`\n    3. `InputStream`\n    4. 以上都不是\n\n3. 从文件中读取字符的 `FileReader`\
  \ 类方法是如何工作的？\n    1. `gets()`\n    2. `scanf()`\n    3. `write()`\n    4. `read()`\n\
  \n4. 流可以被广括地分类为 ____ 种类。\n    1. 1\n    2. 2\n    3. 3\n    4. 4\n\n5. `java.io`\
  \ 包中的 `FileWriter` 类用于以字符形式向文件写入数据。\n    1. 正确\n    2. 错误\n\n6. `BufferedReader`\
  \ 类是\n    1. 用于从基于字符的输入流中读取文本\n    2. 用于从基于字节的输入流中读取文本\n    3. 用于从基于字符的输出流中读取文本\n\
  \    4. 无\n\n7. `readLine()` 用于 _____。\n    1. 它用于读取一行文本。\n    2. 它用于写入一行文本。\n \
  \   3. 它用于复制一行文本。\n    4. 无\n\n8. `nextInt()` 用于 ________ 。\n    1. 它用于从键盘读取一个整数值。\n\
  \    2. 它用于从键盘读取一个双精度值（double）。\n    3. 它用于从键盘读取一个字符串值\n    4. 无\n\n9. `PrintWriter`\
  \ 类 ____。\n    1. 向文本输出流打印对象的格式化表示\n    2. 向文本输入流打印对象的格式化表示\n    3. 向文本输出流打印值的格式化表示\n\
  \    4. 向文本输出流打印数据类型的格式化表示\n\n10. `createNewFile()` 方法\n    1. 修改一个空文件\n    2. 创建一个空文件\n\
  \    3. 删除一个空文件\n    4. 无\n\n#### 答案\n\n1. b\n2. a\n3. d\n4. b\n5. a\n6. a\n7. a\n\
