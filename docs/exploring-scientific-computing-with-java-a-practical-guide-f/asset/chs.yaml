  \ 类输出..\n\n## Java 中 Vector 的优缺点](#contents.xhtml_sc4_132a)\n\n`Vector` 在多线程环境下使用是安全的，因为它是同步的。不需要担心设置一个可以容纳所有项目的初始大小，因为\
  \ `vector` 可以随着元素的添加或删除动态地增长或缩小。如果你需要处理使用 `Vector` 的旧 Java 代码，它是一个合适的选择，因为它从 Java\
  \ 诞生起就是其一部分并且仍然受到支持。\n\n`Vector` 的同步可能会导致其性能低于于其他集合类型，例如 `ArrayList`。尽管 `Vector`\
  \ 仍然可用，但可能更难找到它的示例和帮助，因为较新开发的 Java 代码经常使用更现代的集合类。如果你不需要同步功能，利用 `Vector` 的同步机制将增加代码的开销。\n\
  \n## StringTokenizer 类](#contents.xhtml_sc2_133a)\n\n文本处理通常包括解析格式化的输入字符串。解析是将文本划分为一组离散的部分或标记（tokens），这些标记在特定的顺序上可以传达语义含义。`StringTokenizer`\
  \ 类提供了此解析过程的第一步，通常称为词法器（词法分析器）或扫描器。使用 `StringTokenizer`，你需要指定一个输入字符串和一个包含分隔符的字符串。分隔符是分隔标记的字符。分隔符字符串中的每个字符都被视为有效的分隔符。例如，`,;:`\
  \ 将分隔符设置为逗号、分号和冒号。然后你可以像下面的命令所示创建 `StringTokenizer` 对象：\n\n```\nStringTokenizer\
  \ st = new StringTokenizer(in, \"=;\");\n```\n\n一旦你创建了 `StringTokenizer` 对象，就可以使用\
  \ `nextToken()` 方法来提取连续的标记。`hasMoreTokens()` 方法在有更多标记需要提取时返回 true。\n\n下图是一个创建 `StringTokenizer`\
  \ 来解析键值对的示例：\n\n![](img/Figure_4.25.png)\n\n图 4.25：`StringTokenizer` 类的代码示例\n\n\
  该程序的输出见下图：\n\n![](img/Figure_4.26.png)\n\n图 4.26：`StringTokenizer` 类输出\n\n## StringTokenizer\
  \ 类方法描述](#contents.xhtml_sc3_134a)\n\n现在我们讨论 `StringTokenizer` 类的一些方法。其中一些如下：\n\n\
  * `int countTokens()`：使用当前的分隔符确定待解析的标记数量并返回结果。\n* `Boolean hasMoreTokens()`：如果字符串中剩余一个或多个标记则返回\
  \ true，否则返回 false。\n* `String nextToken()`：返回下一个标记字符串。\n\n## 包装类](#contents.xhtml_sc2_135a)\n\
  \nJava 中的包装类用于将基本类型（`int`、`char`、`float` 等）转换为相应的对象。八种基本数据类型 `byte`、`short`、`int`、`long`、`float`、`double`、`char`\
  \ 和 `Boolean` 不是对象。包装类用于将基本数据类型转换为对象，例如 `int` 转换为 `Integer` 等。\n\n![](img/Figure_4.27.png)\n\
  \n图 4.27：转换为对象的包装类代码示例\n\n基本数据类型到其对象表示的转换过程见 图 4.27 和 4.28，并了一个了一个生活示例。当从 Flipkart\
  \ 购买手机时，它将到达一个包装器内部，我们可以认为手机基本数据类型（`int k`），包装器可以是该基本数据类型的对象表示（`iob`）。然后，在到达客户手中后，进行拆包以获得原始手机，这可以类比从对象到基本类的转换。对象表示对于某些数据结构非常重要，那里只有对象允许在数据结构上执行操作。\n\
  \n![](img/Figure_4.28.png)\n\n\n\n\n\n图 4.28：用于将对象类型转换为基本类型的包装类编码示例\n\n在表 4.17 中，展示了与每个基本数据类型对应的包装类：\n\
  \n| 基本类型 | 包装类 |\n| :--- | :--- |\n| byte | `Byte` |\n| boolean | `Boolean` |\n\
  | char | `Char` |\n| double | `Double` |\n| float | `Float` |\n| integer | `Integer`\
  \ |\n| long | `Long` |\n| short | `Short` |\n\n表 4.17：基本类型及其对应的包装类类型\n\n让我们在下一节通过示例讨论自动装箱和自动拆箱的概念。\n\
  \n自动装箱和拆箱\n\n自动装箱（Autoboxing）是 Java 编译器在基本类型与其对应的对象之间完成的自动转换。自动装箱和拆箱功能自动地将基本类型转换为对象，将对象转换为基本类型。基本类型到对象的自动转换被称为自动装箱，反之则被称为自动拆箱。在图\
  \ 4.29 中，语句 `Integer iob=10;` 将整数类型（基本数据类型）数据 10 隐式转换为其包装类对象 `iob`。这是 Java 编程中自动装箱功能的示例。\n\
  \n![](img/Figure_4.29.png)\n\n图 4.29：自动装箱示例\n\n总结\n\n在本章中，从数组的最基础概念到字符串都展示了大量的编码示例。数组的声明和初始化过程已通过带有索引值对的图表进行了讨论。之后，通过示例对\
  \ `String` 详细讨论。以表格形式给出了用于 `String`的不同重要方法并附示例以便更好地理解。然后，阐述了 `String` 的属性。通过示例讨论了\
  \ `StringBuffer` 类。不仅介绍了矢量类和包装类的概念，还通过编码示例讨论了相关方法。章节末尾增加了自动装箱和自动拆箱的内容。\n\n在下一章中，将找到关于继承（Inheritance）概念的详细讨论。所有的继承类型都将通过图示进行讨论。将引入\
  \ `this`、`super` 和 `final` 关键字的概念。抽象类、接口和访问修饰符将结合源代码进行讨论。\n\n练习\n\n1. 用示例定义 Java\
