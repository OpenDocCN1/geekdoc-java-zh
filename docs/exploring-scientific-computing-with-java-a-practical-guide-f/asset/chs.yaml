  \ 错误\n5. `StringBuffer` 类是可变的。\n    1. 正确\n    2. 错误\n6. `String st=new String(\"\
  Java program\");`\n   使用上述编码语句创建了多少对象？\n    1. 0\n    2. 1\n    3. 2\n    4. 3\n\
