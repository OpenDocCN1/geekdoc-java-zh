  md: '# INTRODUCTION


    and identification used by actors themselves (Barth 1969:10), Tengger are not
    an ethnic group distinct from other Javanese since, again, they themselves insist
    they are Javanese. Despite some differences of speech, etiquette, and most importantly,
    social interaction between Tengger and their Javanese neighbors displays none
    of the “boundary maintenance mechanisms” (Barth 1969:19) associated with genuine
    terethic relations. The distinctive qualities of Tengger society reveal themselves
    not in interaction with outsiders, but in the less visible world of the village.


    In a certain sense, in fact, the Tengger situation resembles that discussed by
    Leach (1954) in his classic analysis of Burma, where there too it is difficult
    to assume a near correspondence between borders of “society” and those of “culture.”
    Tengger share most of their technology, agricultural skills, and even everyday
    life with their mountain neighbors. Political and social processes are discussed
    throughout the region in much the same vocabulary. Even many aspects of ritual
    social organization (Chapter 10)—the invitation of guests, the mobilization of
    festival lavish, the exchange of food gifts—have counterparts in neighboring Javanese
    communities. If it is easy to distinguish Tengger religious ritual from Muslim
    Javanese rites, therefore, it is less easy to talk about an integral and autonomous
    Tengger culture separate from that larger Java. A similar problem arises in trying
    to define the borders of Tengger society. The boundaries of social action differ
    for the various activities in which Tengger engage, and much of social action
    interaction with non-Tengger. Formal economic and political ties, for example,
    extend beyond the region, and in most respects are stronger than those found among
    Tengger communities. There is no distinct politico-economic infrastructure, in
