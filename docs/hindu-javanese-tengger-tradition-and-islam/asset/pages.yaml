    # Form and Meaning in Village Slametans


    There is a certain doctrinal anonymity about village slametans. Each is called
    by a distinct name, occurs for different occasions, has as its own offerings and
    prayers, and shows a slightly different style of organization. With the exception
    of Karo, public comments on the importance and meaning of these rituals present
    all of them as so many variations on a single theme. All are intended, to tell,
    village lands, ensure the abundance of its water, protect the living, and as always,
    affirm the bond of the living with the dead. The emphasis in describing the rites,
    in other words, is on their practical consequences, not their cosmology or interior
    symbolic detail. In theory, it is assumed that each rite must in some sense be
    different from the others. But how or why it is never explained in terms of the
    nature of the ritual work accomplished or the specific deities for which the rites
    might be intended. As far as villagers are concerned, all ritual invoke the same
    nameless assortment of deities, despite the fact that there are four or five pujan
    during the year and that the priest''s prayers identify four and five deities
    with the wind directions (neither villagers nor identify the pujan with the worship
    of any particular deity. Inasmuch as villagers take note of ritual detail, they
    focus on the way in which each ritual is celebrated in different places and that
    it involves different types of festing or festivity. It is, in other words, the
    sociology of ritual performance to which villagers pay particular attention.


    All of the village rites are organized around a common redistributive pattern:
    foods are collected at the house of the village dignitary (the priest or the chief),
    or sometimes at the village shrine, where they are blessed and presented as offerings
    by the priest to the gods, and then afterward a portion of the offerings is consumed
    by the officials who have “witnessed” the ceremony, while another portion is made
    into tempting offerings. The pujan illustrates this pattern clearly, and also
    shows to what degree ordinary villagers are drawn into the ceremony. The morning
    of a pujan day, village brings a small team of uncooked foods (usually some rice,
    sugar, and bananas, with a small coin as well) to the village priest''s house.
    Helped by youths recruited for the pujan celebration, the priest''s wife takes
    the foods and throughout the remainder of the day prepares them either for offerings
    or the meal that village officials celebrate that night at the conclusion of the
    priest''s ceremony. (In a few northern Tengger villages, the pujan meal is now
    limited to the priest and his assistants). When, in the evening of the ritual
    gathering, offerings are ready and the table prepared for the village


