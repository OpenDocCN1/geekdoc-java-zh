    # Formal Roles and Organization


    Like other Javanese, Tengger refer to the territory and population of a rural
    community as a desa. Prior to the end of the nineteenth century, most Tengger
    desa consisted of a single nucleated settlement sharing certain resources and
    social obligations: agricultural lands, a group of pamong village officials, a
    village priest, a spirit shrine, a cemetery,'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# VILLAGE WORLD CONCEPTS


    spring or stream, a system of cooperative labor (*kerja bakti*) for village maintenance,
    and an assortment of religious festivals financed by the community. The social
    integrity of the traditional *desa* was disrupted at the end of the nineteenth
    century. At that time, the colonial government attempted to simplify rural administration
    throughout Java by consolidating smaller *desa* into larger administrative villages,
    called *kalurahan*. In Tengger, most of the new administrative villages incorporated
    two or three of the earlier nucleated villages retain their old names, as well
    as most of their earlier corporate resources. The larger administrative village,
    however, has its own chief (*petinggi* in Javanese, *urah* in Indonesian) and
    secondary officials, identical to those associated with village administration
    in other areas of Java (except that there is no Islamic religious official). The
    modern administrative village is responsible for such things as public buildings,
    schools, and the public lands provided as compensation for village officials.
    Government-sponsored programs as boy scouts and family planning are also coordinated
    by the administrative village, not of each desa.


    For many activities, the traditional nucleated *desa* remains the primary locus
    of social organization. Kin ties, task groups, and ritual exchange (Chapter 10)
    are mostly organized within its borders. Until recently, people from outside the
    *desa* were barred from renting or buying village land, a restriction that has
    been abolished in most communities since independence. Road construction, increasing
    social stratification, and educational mobility are likely to reduce the integrity
    of Tengger communities. By Javanese standards, however, Tengger villages remain
    remarkably vital, and are characterized by a greater overlap of economic, kinship,
    and ritual ties than is typical of lowland communities. It is important to note,
    that the internal organization of Tengger communities has never made them impermeable
    to change from the outside. Since the nineteenth century, all Tengger communities
    have absorbed large numbers of non-Tengger immigrants. The modern Tengger community
    was thus never "closed corporate" (Wolf 1967) as that its social organization
    has not effectively excluded outsiders as much as it has influenced their manner
    of assimilation, once arrived.


    The distinctive nature of Tengger village organization is, first of all, in the
    poetry of formal groups, titles, status distinctions, honorary names, and other
    social markers that might formally define the status of one person or group against
    another. This social "poverty" is a relative fact, of course, in this case relative
    to the surrounding Javanese society. In the traditional Tengger village, one found
    no corporate organization'
