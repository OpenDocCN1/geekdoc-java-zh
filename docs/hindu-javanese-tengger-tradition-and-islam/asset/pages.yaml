    It was not the force of cultural means alone, however, that focused these people
    on their ritual tradition. The tradition was embedded in a larger system of social
    practice. The roles of priest and chief, ritual savings and exchange, restrictions
    on agricultural production and consumption, the role of religious festivals in
    the expression of social status—these and other things combined to create a system
    in which ritual performance was the culmination of general social rhythms. It
    was an ongoing and reflexive interaction between social activity in these upland
    farming communities and cultural ideas as to the populist nature of Tengger identity
    and the role of the priesthood in it. The interaction helped to recreate a social
    environment in which received cultural truths as the ancestral nature of the tradition
    appeared consonant with the communitarian notions of social reality. Social practice
    and cultural ideas seemed wonderfully well integrated with one other; or so it
    seemed in those communities where the tradition was preserved. In a changing Java,
    however, the processes sustaining ritual reproduction could be undermined with
    small shifts in consumption, a change of village leadership, or the erosion of
    popular faith. “Change, or its potential, is thus inherent in all moments of social
    production” (Gidens 1979:114), because society is animated by forces more complex
    than the intentions of its actors, and cultural meaning is dependent upon more
    received symbolism.


    To understand Tengger tradition has therefore required that we move beyond simple
    hermeneutic appreciation of its meanings to an investigation of the social and
    historical conditions that made shared meanings possible and other mysteries left
    unsaid. Central among those historical conditions was, of course, the ongoing
    Islamization of Java, especially the growth of a revitalized rural Islam in the
    nineteenth and twentieth centuries. Within Tengger society itself, however, the
    ritual tradition was socially organized in such a way that the cultural impact
    of these developments was unique. Popular notions as to the nature of tradition
    were constructed in the course of an ongoing dialogue with the surrounding society.
    The liturgy itself, however, was sustained in a very different social field, in
    which literacy, restricted social access, and a socialized faith helped to give
    the formal forms of the liturgy a fixity that popular religious culture lacked.
