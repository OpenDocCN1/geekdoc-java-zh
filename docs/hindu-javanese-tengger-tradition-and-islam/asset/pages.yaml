    any precise doctrinal formulation. As is the case for any other Javanese, *karma*
    suggests the general idea that behavior in this life somehow affects one''s fate
    in the next. For most people, why this is the case has more to do with a moral
    sense of balance than it does a notion of agential judgment. Few people see *karma*
    as something regulated by a supreme being; it is a matter of life’s general equilibrium.
    A small minority of Tengger in traditional Bali communities link the concept of
    *karma* to reincarnation (*nitis*). However, as in Bali (Belo 1953:1), it is generally
    thought that one is reborn into one''s family line rather than into any number
    of human or nonhuman conditions. The concept of reincarnation is now being promoted
    by Hindu reformists, however, it seems to have long a rather uncommon view on
    what happens after death. Some earlier observers of Tengger society (cf. Jasper
    1926) have stated that no Tengger believes in reincarnation, but this seems an
    overstatement, judging by contemporary opinion in Buddha communities.


    There is one minority belief as to the nature of the afterlife deserves merit.
    In villages of southern Tengger, people tell that spirits of the dead go to two
    places: either Mt. Bromo or Mt. Semeru. All ordinary people go to Bromo. Priests
    and chiefs, however, can go to Semeru, if they have been blessed prior to death
    in a ceremony called the *pembaron* or rite of “renewal” (see Appendix). According
    to this view, the distinction between commoners and village nobles is maintained
    in the afterlife in a fashion that is radical, at least from the perspective of
