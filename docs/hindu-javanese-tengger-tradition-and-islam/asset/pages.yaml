    As throughout Java, Death in Tengger is something to be received calmly and smoothly,
    without grimness or melodrama. Death is supposed to be a ‘calm, demonstrations,
    almost languid letting go’ (C. Geertz 1973:153). But there are, of course, particularly
    at the death of a young adult or spouse—when grief breaks through with sad weeping
    or hysteria. Display is considered unhealthy and spiritually dangerous, however,
    it is so discouraged. When they speak of the proper attitude towards death, Tengger
    rarely use the rather higherflown intellectual statements in less populist corners
    of Java. They rely little on such terminology as the flattening of emotion and
    withdrawal from its disturbing force (see C. Geertz 1960:70). They speak instead
    of attitudes linked to activities, in the world, as the concept of nrima, the
    mute or protesting acceptance of things over which one has no control. The practical
    corollary of this attitude is, among others, that villagers attempt involve sinking
    in activities like food preparation and the reception of guests; busy work or
    routine is the best practical guide for a calm spirit. The spirit of the deceased
    is kept particularly busy. If a woman, she walks elbow-to-elbow with other women
    in the kitchen; if a man, he is expected to stay out in the front room with guests,
    seeing to it that they are quickly given hot coffee, cigarettes, and sweets.


    The emphasis on a funeral is thus a quick, orderly, and unassuming dispatching
    of the soul of the dead person, coupled with as quick return as possible to everyday
    routine for the living. The priest and his assistants play the most important
    role in this orderly dispatch. Upon arrival at the house of the deceased, the
    priest takes a small bamboo'
