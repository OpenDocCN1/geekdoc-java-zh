    # THE SETTING: HISTORY AND IDENTITY


    # The Region in Java


    Java forms an island mass 1,000 kilometers east to west and 90 to 200 kilometers
    north to south. The east-west spine of the island is defined by a chain of thirty
    volcanic mountains and limestone plateaus, between which lie fertile lowland basins.
    The valleys provide the natural setting for some of the world''s finest wet-rice
    lands, and in an earlier era provided Java''s inland principalities with agricultural
    bounty unrivaled throughout the Indonesian archipelago (C. Geertz 1963:39; Ricklefs
    1981:15).


    Java''s Eastern Salient (the Oosthoek or East Hook) forms the narrow extremity
    of the island. Beginning just to the east of what is today the Malang-Surabaya
    highway, the region extends eastward 180 kilometers to the Bali strait, across
    which the smaller island of Bali is visible. Drier, more rugged, and without the
    major rivers of central Java, the Eastern Salient resembles the more mountainous
    terrain typical of the small islands to the east of Java. A tight series of mountains
    dominate the landscape, creating the impression of lowland terrains always craning
    their neck to gaze upward at towering mountains. The valley basins in this corner
    of Java are narrower than those to the west; river courses twist and turn, bearing
    the waters that sustain wet-rice communities. The longer dry season, and less
    abundant water resources make wet-rice agriculture less extensive than in regions
    of Central Java.


    The Tengger massif lies in the western section of the Eastern Salient, about 40
    kilometers to the east of Malang, and 50 kilometers to the south of the north
    coast ports of Probolinggo and Pasuruan. The mountain terrain in the Tengger highlands
    is most rugged Semeru, an active volcano and Java''s highest mountain (3,670 meters).
    Its northern border overlooks the fertile and densely populated lands of Java''s
    north coast plain. The eastern slopes of the highlands are drier and less fertile
    than the luxuriant slopes of the west and southwest; the southern slopes are still
    thickly forested and largely unpopulated, due to Mt. Semarang''s periodic activity.
    In all but this southern region and protected forest lands, the thick woodlands
    that used to cover the region''s mountain ridges (Domis


