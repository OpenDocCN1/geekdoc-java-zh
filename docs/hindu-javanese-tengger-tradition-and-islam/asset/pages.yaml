    # Myth and Ritual Meaning


    The effort to interpret any religious ritual immediately encounters two problems:
    what things to emphasize in what is an almost infinitely detailed stream of social
    behavior, and whose perspective to adopt when we speak of an actor''s experience.
    The first problem can be resolved least in part in the course of confronting the
    second, since an interpretive account of ritual action tasks as one of its central
    concerns the exploration of those things the actors in a ritual performance regard
    being of central importance. This actor-oriented approach to the problem of meaning
    does not exclude investigation of things that may not figure directly in actors''
    experience of a cultural event. In analyzing the Kasada rite, for example, it
    is helpful to note that its imagery of a sacred mountain at the center of the
    world is a familiar theme in Southeast Asian Indic tradition (von Heine Geldern
    1942; C. Geertz 1980:227; Hall 1981:247). Here in Tengger, however, the association
    of such an axis-of-the-world with royalty or political hierarchy—an association
    common in Old Java and other areas of Southeast Asia—is entirely absent. This
    sacred mountain has an ancestral face. Such observation sheds light on Tengger
    tradition, although it does not directly contribute to our understanding of the
    ritual''s meaning for contemporary Tengger.


    From a more sociological perspective, one can examine the segregation of roles
    and responsibilities in a ritual to find clues as to what the social organization
    of the event affects actors'' perspective on the rite and its symbolism. The core
    Kasada ceremony, vividly illustrates the profoundly different roles of priests
    and people in Tengger religious ceremony. The priests alone perform the initial
    incense announcement to the gods back in the village. At Mt. Bromo, they alone
    occupy center ritual stage. It is their chief acts as master of ceremonies, and
    as a group who incense, announce the offerings, and recite the prayers that invoke
    deity. Throughout all of this activity, there is no point-for-point account on
    the part of ordinary villagers. Their role is primary to bear prayers, and sitting
    quietly in small groups, most are at great a distance to hear or see clearly the
    priests'' ritual invocation. Although there is in the Kasada rite the kind of
    “situational focus” (Irvine 1979:779) commonly associated with formal social events,
    the focus is not socially organized in such a manner as to draw ordinary villagers
    into the specific detail of the liturgy.


