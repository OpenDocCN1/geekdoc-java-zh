    Ritual paraphylhernalia in modern Tengger also suggest a link between this region
    and other religious centers on the island. Each Tengger possesses a small holy
    water beaker (the prasen), referred to in ethnographic literature as a ''zodiacbeaker''
    it is decorated with carved images of animals and other objects associated with
    the Indic zodiac or rasi (see Jasper 1926; Rouffier 1921:299; Kohlberg 1897).
    Most Tengger rituals are inscribed with a date, ranging from 1243 to 1352 Saka,
