    # INTRODUCTION


    Identity in an Islamizing Java


    In the summer of 1977 I traveled to the island of Java to participate in an Indonesian
    language program in the East Javanese city of Malang, Malang is a city of about
    one million people, situated in a densely populated wet-rice valley between about
    60 kilometers from Java''s north coast, and just to the west of a rugged mountain
    region known as the Tengger highlands. During the three months of the language
    program, I took advantage of weekends and holidays to make short jaunts into the
    mountains, in hope of learning more about the region''s inhabitants and to help
    choose a village for ethnographic research the following year. The mountain Javanese
    I hoped to study are known as wong Tengger (“Tengger people”), and number just
    40 thousand on this island of almost 100 million people. Tengger have long been
    of interest to students of Southeast Asian civilization. They alone have preserved
    a non-Islamic piety over the five centuries since the fall of Java''s last Hindu-Buddhist
    kingdom. Ethnographic information on Tengger culture, however, has sometimes left
    unclear the question as to whether Tengger are in fact Hindu, Buddhist, animist,
    or kejawen “Javanists.”¹ Indeed, some reports have indicated that in modern times
    Tengger have converted to Islam.


    > ¹ An estimated 90 percent of ethnic Javanese are Muslim. Religious styles within
    the Muslim community, however, vary significantly, and at times are a source of
    communal tensions (see Jay 1963; Geertz 1960; Rickfels 1979). Postwar American
    scholarship on Java identified two different categories of Javanese Muslim. The
    first, as santri, includes those who follow the ritual and ethical prescriptions
    of Islam in a strict manner. The second, as abangan, referred to in Java''s Muslim
    community who are less strict in their performance of orthodoxy, and are influenced
    by ascetic and ritual styles to some degree related to pre-Islamic past (see Geertz
    1960; Geertz 1963; Jay 1963, 19). In the Religion of Java, Clifford Geertz suggested
    that these styles (and a third with Java''s priyayi aristocracy) were loosely
    correlated with social and economic class. More, a number of scholars have taken
    issue with this correlation, pointing out that variation in religious orthodoxy
    occurs across class lines (Koenjanjingrat 1963; Rickfels 1979; Dhofier 1978).
    Some of these same criteria have qualified the santri-abangan distinction further.
    Note that within both the orthodox and abangan communities, there is another line
    of differentiation between people of conservative and those of modern tendency.
    Critics have also noted that the terms santri and abangan are not used in a uniform
    fashion'
