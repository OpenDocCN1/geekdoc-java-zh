    PRIEST AND PRIESTLY FAITH


    No role so fundamentally expresses the distinctiveness of Tengger ritual tradition
    as does that of the dkun priest. Although he shares his title with that of “the
    general magical specialist in traditional society” (C. Geertz 1960:87), the Tengger
    dkun is heir to a role different from that of his lowland counterpart. The priest
    in Tengger involves none of the spirit mediumship, sorcery, herbalism, massage,
    or medicine associated with the lowland duk. The Tengger dkun is one among a community
    of village priests preserving a non-Islamic liturgical tradition in the Mt. Bromo
    region of East Java.


    The Tengger priest may not have been referred to as a dkun. In the above-mentioned
    prayer of world origins (purwabumi), the priest is referred to in one passage
    as a resi pujangga, a title with which at least some elder Tengger are also familiar.
    The title is of extraordinary comparative interest because it is still used in
    modern Balinese to refer to the non-Brahmanic sengguh priest who recites a purwabumi
    prayer similar to that of the Tengger priest (as Hooykaas 1974). The fact that
    in modern Javan the Tengger priest is popularly known as a dkun rather than a
    resi pujangga is consistent with the general tendency in Tengger to speak of local
    tradition in terms similar to those used in other areas of modern Javan. The common
    title does not hide the fact, however, that the Tengger dkun''s role is quite
    different from that of the general Javanese dkun, is a way which underscores the
    non-Islamic character of this popular priestly tradition.


    > Ngelmu: Ambiguous Knowledge


    In general Javanese identify a dkun as a person learned in traditional lore, techniques,
    or forms of esoteric knowledge. The title is applied to specialists in a wide
    range of fields, including midwifery, massage, spirit mediumship, herbalism, numerology,
    sorcery, and black and white magic (C. Geertz 1960:86). What all specialists have
    in common is their mastery of some kind of ngmu or ilmu, that is, esoteric knowledge
    par excellence, involving the ability to see beyond outward appearance into the
    hidden reality of things. Mystically inclined Javanese sometimes contrast this
    form of knowledge with iliah, or the knowledge of external, perceptible realities.
