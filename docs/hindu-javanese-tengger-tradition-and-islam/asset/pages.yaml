    # Prayer and Ritual Labor


    Ritual is the core of priestly tradition, and prayer is the heart of ritual.

    "The offerings may be insufficient and people''s understanding less than

    complete," a southern Tengger priest once explained to me, "but what

    is important is the correct recitation of prayer (*japa*). It is the priest''s

    prayer appeal that is communicated to the spirits through the medium

    of incense smoke, and prayer invites them to descend, consume the

    essence of the offerings, and, through their presence, bless the living.

    There is little in this ritual routine that allows for improvisation or

    innovation. Despite prayer imagery which suggests that the priest

    is possessed by a deity, for example, the priest at no point in his

    performance looks possessed or is otherwise in a state of psychic dis-association.
    In fact, one finds in Tengger almost no counterpart

    to the possession behavior so common in Bali (Belo 1950). Occasionally

    villager may be dreamed of a deceased relative, or even more rarely, by

    the high deities invoked in priestly liturgy. Interaction with those spirits

    is left to the priest, and he approaches them exclusively through the

    medium of the liturgy, which is itself precisely formalized. Improvisation

    in its performance would not simply be out of place, but wrong—an

    deviation from the tried and true ways of religious tradition.


    The main body of the priest''s prayers are referred to as *japa* or *japamantra*.⁴
    *Japa* is a Sanskrit word, which refers to a kind of prayer recited

    in an incantational, repetitive fashion (Gonda 1975:287). The term has

    a more general meaning in Tengger and other areas of Java, where it

    refers to prayers thought to have originated in ancient times and to be

    capable of having thus constrain or coercive power, either by virtue

    of their own word or by virtue of the spirits to whom they appeal.

    Tengger japa has another characteristic: they are always performed in

    conjunction with a prescribed gesture or ritual movement, such as the


