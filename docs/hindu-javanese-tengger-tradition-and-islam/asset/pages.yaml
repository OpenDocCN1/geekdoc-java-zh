    Government administration of the region underscores this lack of lateral integration
    between Tengger communities. The higher levels of that administration are at no
    point organized to coincide with a distinctly Tengger region. For example, Tengger
    communities are today scattered in four separate regencies or administrative districts
    (kabupaten): Pasuruan, Probolinggo, Malang, and Lumajang. Only a small corner
    of each actually extends into the mountain territory where Tengger settlement
    is located. Each district includes a larger number of non-Tengger than Tengger
    villages within its overall borders, and none of the districts has ever been directed
    by an administrator of Tengger background.


