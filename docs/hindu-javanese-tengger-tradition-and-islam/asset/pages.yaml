    # Conclusion: Social Change and Religious Reform


    They make peculiar bedfellows, this alliance of Balinese reformists and Tengger
    mountain folk. The dispute over prayer reform illustrates the tensions between
    the policies of the two groups. The Balinese parisada had intended the prayer
    reform initiated in the Tengger community would be carried out in all Hindu villages
    of the region. Tengger adat had to be “perfected” (disempurnakan) by introducing
    true religion (agama) into its ritual forms. The great majority of Tengger parisada,
    however, have balked at the proposal, effectively preventing its application to
    other villages now for almost ten years. They have reacted enthusiastically with
    parisada programs that expand religious activity to include education and popular
    prayer. But they have consistently it to rework existing rites. It is for them
    already religious.


    The changes introduced by the Tengger parisada are genuine nonetheless, and promise
    to guide religious development in much of the region over the next generation.
    The problems confronting the movement are great. It is unclear, for example, whether
    the remaining priests join forces with their Hindu brethren. Hence, as the programs
    for education and religious reform gain momentum, the cultural distance between
    Hindu and Buda Tengger may become dangerously large. One senses, moreover, that
    the resistance of some Buda priests not be entirely ideological. At least some
    of the hold-outs are located in communities more affected by nineteenth-century
    immigration than the Tengger northwest. These are communities in which the tale
    of Ajisaka and Mohammad is still popularly regarded as the only definitive charter
    on the relation of Tengger affiliation to Islam. Were the priest or village chief
    to go ahead with Hindu affiliation, some villagers might defeat, rejecting Tengger
    religion entirely. One senses this may be a fear among some Buda priests.


    Overpopulation, landlessness, and increasing economic differentiation within communities
    may also erode the sense of common ways and ancestral solidarity upon which Tengger
    traditionally relied. In this light, some of the parisada’s more radical reforms
    may begin to have greater appeal. Even Buda Tengger spoke to me at times of the
    need to reduce ritual expense so that more villagers could afford to sponsor rites.
    As new and more expensive forms of nonritual consumption compete for the limited
    resources of households (Hefner 1983b), and as social prestige comes to be expressed
    in ways other than ritual lavishness alone, less economically demanding forms
    of religious devotion—like the prayer gatherings already popular in Wonokriti—may'
