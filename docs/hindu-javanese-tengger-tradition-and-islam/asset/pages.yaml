    the resi himself. There is some evidence to suggest that the resi is at times
    involved with the worship of upper-world deities as well. The resi prepares water,
    all activity that presumes the ability to invoke beneficial upper-world deities.
    Hoookayas comments, in addition, that the resi buangga is not in the presence
    of pedanda “one should not be astonished” (which is to say that it is astonishing,
    given the resi’s identification as a lower-world specialist) to see him perform
    ceremonies elsewhere associated with high-status pedanda (Hoookayas 1973:16).


    The best evidence that the Balinese resi is not exclusively concerned with the
    spiritual netherworld is the purwab prayer itself. As in the Tengger priest’s
    version of this prayer, the resi’s work is here clearly identified with the transformation
    of the demon gods Kala and Durga back into their beneficial form as Sima and Uma.
    This goal is accomplished in the course of a long account that links the transformation
    to the very origins of the world and its ever-present balance of spirit forces.
    “Exorcism” occurs, but it is not a simple act of exorcism, as one might expect
    after having heard that the resi is a specialist of netherworld spirits. The resi’s
    rite is as much concerned with elevated Indic spirits as any pedanda’s ceremony,
    at least to judge by the evidence of the resi’s prayers.


    Why is the Balinese resi identified with the lower world? What does its identity
    say about Tengger and Bali? It is impossible to say with absolute certainty exactly
    how the Tengger and Balinese resi may have once been related. Equally importantly,
    whatever identity each priest may had five centuries ago would have depended on
    the relationship of each to other categories of priests in the countryside and
    courts. On this point precise ethnohistical data is lacking.


    There is an additional clue, however, to the earlier identity of the'
