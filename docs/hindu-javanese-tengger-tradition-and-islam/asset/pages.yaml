    hill community from which I would begin my thirteen-kilometer hike through mountain
    forests to the southern Tengger community of Ngadas. I had deliberately selected
    a southern route to the highlands, having been told that villages in this region
    (to the south of Mt. Bromo) were the most isolated of some twenty-eight upland
    communities identified as ‘Tengger.’ No sooner had I left the village of Gubukklakah,
    however, than encountered the first of two surprises. A road crew was working
    just above the village, cutting the dense mountain forest, and laying the stone
    foundation for what would eventually be an unpaved road linking the lowlands with
    the remote corner of the Tengger highlands. Road workers commented that in one
    year such rugged terrain would be accessible from Malang with a half-day’s ride.


    My second surprise occurred several hours later, as I neared the end of my ascent.
    Climbing above a dense mountain fog, I could see neat vegetables on steep hillsides
    just ahead. Beyond them the whitewashed houses of Ngadas, clustered at the top
    of a ridge overlooking a narrow mountain valley cultivated with onions, cabbage,
    potatoes, and maize. Contrary to what I had expected, the village looked much
    like the Javanese community from which I had set out several hours earlier. The
    village was more uniform in style and more solidly constructed than those in lower-lying
    communities, mountain pine replacing bamboo as the primary construction material.
    The streets had the odor of horse manure rather than truck exhaust. Nonetheless,
    the village for the most part looked quite similar to those in non-Tengger regions
    of mountain Java.


    My arrival in the village attracted a small group of friendly children, peering
    shyly behind doors and corners, and gleefully whispering “londo!” (Dutch!). Before
    announcing myself at the village chief’s house, I decided to take advantage of
    the evening sun and walk briefly around the settlement, in hope of spotting a
    temple or religious shrine. Stories of exotic religious practices, my own recent
    trip to the nearby Hindu island of Bali, and landowners'' disagreement as the
    nature of Tengger region had made me curious as to what type of religious building
    the community might have. All I managed to find, however, was a small shrine set
    on a hillside above the village, its trees uncut neatly fenced, with a small offering
    table at its center. The shrine looked no different, in other words, from any
    number of similar danyang village shrines found in many East Javanese communities.
