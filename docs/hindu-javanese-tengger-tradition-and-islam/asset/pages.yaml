    **The Problem of Land in History** The recent history of land control in Tengger
    can be roughly divided into three periods, each of which corresponds to a different
    stage in the development of rural economy in Tengger, and to problems of cultural
    identity related to that development. Although detailed accounts of agriculture
    in nineteenth-century Tengger society are lacking, it appears that to the middle
    of the last century the region''s population was sparse, relatively abundant,
    and agricultural technique extensive was. As in many other areas of mountain Java,
    swidden cultivation was the dominant form of agriculture, and maize was the primary
    staple. Reports from early nineteenth-century Tengger indicated that residents
    of the region traded extensively with landowners for the textiles, metal goods,
    and manufactured items that, even at this time, Tengger did not produces themselves.
    As is still the case, maize—although the most extensive cultivation—was produced.
    Hence villagers cultivated plots of vegetable crops ( onions, potatoes, cabbage,
    carrots) as cash crops for sale in lowland markets.


    The mid-nineteenth century marked the beginning of the swidden system throughout
    Tengger. Warfare and administrative policies in colonial Java had large numbers
    of people from Central Java and Madura to the sparsely populated terrains of the
    Eastern Salient (Chapter 2), a process that continued under the Culture System
    with the introduction of coffee cultivation into Java''s mountain "waste lands"
    (C. Geertz 1963:53; Carey 1979). Land scarcity in the more densely populated terrains
    of northern Tengger (and, by the end of the century, in all of Tengger) resulted
    in the development of a dual cultivation system, combining fixed-field cultivation
    of nearby fields with swidden cultivation of distant forests and lands. The development
    of a more intensive form of dry-field agriculture was reinforced at the end of
    the nineteenth century, when the colonial government closed off sections of forest
    land in an effort to diminish what by that time already a serious problem of flooding
    and water control in lowland areas. A stricter cultivation policy was further
    implemented with the surveying of village lands and the deeding of land to individual
    households in the first and second decades of the twentieth century. From this
    on, swidden cultivation was restricted to a few forest lands, periodically opened
    by the forestry department for cultivation by local farmers in exchange for land
    reforestation.


