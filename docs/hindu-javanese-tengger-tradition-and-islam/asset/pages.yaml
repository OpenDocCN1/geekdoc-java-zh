    # The Ritual Work


    An entas-entas is a three-day affair. The first two days consist largely of ritual
    invocations and offerings similar to those seen in most other Tengger rites. Family
    and guardian spirits are invoked the first night. Their arrival is greeted with
    communal meal talking, for which (in most villages) the village chief and other
    officials are supposed to be present, as dignitaries to greet the spirits. If
    there is to be tayban entertainment, it is restricted this first night to village
    officials, the priest, dignitaries from neighboring communities and the lowlands,
    and close kin of the ritual spirits.


