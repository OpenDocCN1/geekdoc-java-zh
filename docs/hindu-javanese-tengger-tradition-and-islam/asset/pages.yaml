  md: '# LIFE PASSAGE AND RITUAL


    **The Fate of the Soul** Death is an event fraught with uncertainty and at least
    the possibility of terror and confusion, and it is a well-known theme in the anthropology
    of religion funerary ritual helps to impose order and meaning on a potentially
    traumatic event. It is important to recognize, however, that the kind of order
    a funeral imposes is not determined solely by the rite itself, and no amount of
    symbolic analysis can reveal its meaning unless the rite is situated in relation
    to the knowledge and experience actors bring to it. Funary ritual draws on knowledge
    larger than itself. In the case of the Tengger funeral, however, this means that
    the rite not only summarizes what is known, but also points to a number of unknowns,
    areas of uncertainty or dispute in culturally shaped understanding.


    Even superficial examination of the Tengger funeral reveals its unambiguous familiarity,
    in least in certain respects. Death inaugurates a cycle of ritual preparation
    similar to that seen in other ritual events. Things fall quickly into place: neighbors
    bring food and for the fire, women go about the business of food preparation,
    male households receive guests. The Tengger response to death is not to exclude
    the grievers from the crowd, but to draw them immediately into it—into what is
    for Tengger the most sociable of events, the *slametan festival*. Death itself
    holds abstract territories. The corpse is in the front room, and it is washed
    and clothed in a crowd of onlookers. Despite prayer references to the impurity
    and pollution of death, villagers do not think that contact with the body is polluting;
    the danger lies not in the corpse, but with spirits attracted to it. These are
    especially capable of attacking people emotionally distraught by the loss of a
    loved one; hence the emphasis placed on calm and the ready return to everyday
    routine is of spiritual importance. As the funeral process moves to the cemetery,
    many take turning the litter on which the deceased is carried, and there is much
    conversation. Laughter is considered out of place. To express one''s condolences
    to the family of the deceased, it is understood, would be ludicrous, drawing attention
    to personal pain rather than diverting one''s attention away. There are no post-mortem
    taboos for spouse or children, no funeral exchanges or mandatory visits from kin
    to the family of the deceased. To live alone is, of course, a sadness, and both
    widows and widowers are expected to remarry as quickly as possible. Many elderly
    women have no such opportunity, however, and they may live or move in a married
    child; no widower is capable of cooking for himself, so older men either remarry
    quickly or move in their children.


    Priestly ritual imposes this sense of routine familiarity on the passage of the
    deceased. The soul of the deceased is blessed, given of-'
