    # Concepts of Tradition


    Throughout Java and Islamic areas of the Indonesian archipelago, the most common
    term for referring to a region''s manners, tastes, customs, and beliefs is the
    Arabic-derived term *adat*. Adat is often posed in opposition to *agama*, a Sanskrit-derived
    term that means "religion or divine precept." *Adat* is similarly distinguished
    from *hukum*, an Arabic loan word for judgment, command, or law. Whatever the
    term with which it is contrasted, the distinctive characteristic of adat, at least
    for orthodox Muslims, is that the beliefs and practices to which it refers are
    not divinely inspired. Adat is a social fact, a matter of human believed beliefs,
    etiquette, and life ways. Given the historical and social distinctiveness of different
    people, it is inevitable that *adat* customs vary from region to region. Precisely
    because of this variation, however, adat is quite different from religion. Religion
    is a matter of divine commandment. It is God-given, not man-made; hence it must
    stand above the vagaries of regional custom and local ways. Where the two conflict,
    reform Muslims insist, custom must be reformed in a fashion that does not violate
    religious imperatives. The man-made cannot stand above the variety enjoined.


