  md: '# APPENDIX


    if on occasion the resi turns around and performs rites that the more exalted
    pedanda may not think appropriate.


    In Java, the destruction of Majapahit insured that, if he survived, the Tengger
    priest would not suffer the same problems of status as common in Bali. The collapse
    of the Hindu-Javanese state replaced the dynamic of the exemplary center state
    with that of religious antagonism. Central Java, of course, had exemplary centers,
    and these may have limited influence at times on the Eastern Salient, but the
    Tengger priesthood could look to no earthly counterpart in an Islamizing Java.
    In the eyes of its neighbors, the Tengger priesthood was one more rural variation
    on a ritual theme elaborated all the more gloriously at the court, a relic of
    past and heathen vows.


    There is no clearer evidence of this tension than the Kasada myth. The center
    to which this myth directs a people''s attention is court but a mountain people''s
    spiritual ancestor. This origin seeks to shield Tengger from the outside rather
    than proclaim the common glories of a shared tradition. This is not to suggest,
    of course, that in classical Java the priesthood of the Mt. Bromo region did not
    identify themselves as descendants of the spirit of the mountain. The priesthood
    spoke, however, of another true, consistent with the Sivaite concerns of larger
    Java. The destruction of Majapahit insured, in effect, the ancestral myth would
    be more compelling than that of Sivaite.


    Even at, however, the Kasada myth may retain a trace of outer truths. The ancestral
    guardian of the mountains, Dewa Kusuma, may at one time have been a compromise
    between priestly and popular culture. A dewa is, after all, a rather curious title
    for a mere human ancestor. In Indic tradition elsewhere Kusuma Dewa (''god of
    the flowers-ancestor'') is Kama, the god of love, desire, and flowers. The name
    is also used in Bali as a subtitle for the pamangku priest''s manual (Hooakas
    1973:12). In tradition however, the kusuma or flower reference may have been drawn
    from closer to it. In Banten, we have seen, the tuwuhan offering is composed of
    stalks, flowers, and leaves. The tuwuhan acts, moreover, as a kind of Siva-stand,
    since it is Guru-Siva whom the priest invites to it. In the banten prayers, the
    priest speaks of "receiving the authority of the flowers" in practically the same
    breath that he asks Siva to enter him and give him spiritual power. It is tempting
    easily to suggest that at one time Siva, diety of the flower stand, may have also
    been known as Dewa Kusuma, "god of the flowers."


    The destruction of Java''s Hindu-Buddhist courts and ecclesiastical communities
    indirectly ensured the Tengger priest could escape'
