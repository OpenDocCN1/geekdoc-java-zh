    # Identity and Social Interaction


    Throughout Java, people of one region opposed to another are called “people (tiyang,
    wong) of so and so”—wong Yogya, wong Banten, wong Malang, wong Tengger. With each
    designation there is the suggestion that regional variation also entails sociocultural
    difference, much as in other areas of the world. Yogya people, for instance, live
    in the area around the most of Central Java''s courts. Yogya''s people, it is
    thought, are more mannered, their talk is softer, their food sweeter, and their
    young women shy and more alluring than say, people from the East Javanese city
    of Malang, wong Malang. Regionalism always hints at social difference. From this
    perspective, to the tourist brochures sometimes published on the area, Tengger
    is not an ethnic or tribal group (suku) apart from other Javanese. There are no
    real boundary mechanisms (Barch 1969) used in Tengger interaction with outsiders
    to signal allegiance to a specific identity. In interaction with outsiders, Tengger
    appears to adopt general Javanese styles, and show a remarkable lack of conservatism
    in dress, aspirations, and educational attitudes. These are distinctly Tengger
    linguistic and interaction styles, but these are shared in the intimacy of the
    village sphere, not in interaction with non-Tengger.


