    the village, as is common in the lowlands, but always outside of it on a hillside
    on a direct line leading from the village to Mt. Bromo. In a few Tengger villages,
    this Bromo orientation is replaced by a southern skewing, that is, the shrine
    lies on a hill to the south. The directional orientation is in both cases remarkable,
    because a number of other activities show a similar directional skewing. This
    was the orientation, for example, in the Kasada ritual, which moves from village
    to Mt. Bromo. More interestingly, priests in ritual always pray facing in the
    direction of Mt. Bromo—except in handful of villages where they face to the south.
