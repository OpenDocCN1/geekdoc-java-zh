    Sole celebrant of regional and village rites, the Tengger priest is not alone
    in celebration of ritual events. As is the case throughout Java, villages have
    two other ritual specialists, the midwife or ‘baby dukan’ (dukun bayi) and the
    “circumcision expert” (calak, dukun sunat). The status of the each in the Tengger
    community bears testimony to the unfinished, and sometimes awkward, accommodation
    of the priestly to more widespread Javanese customs.


    Both the midwife and circumcision specialist perform services more or less similar
    to those performed by their lowland counterparts. The midwife, for example, is
    responsible for pre- and post-natal care of mother and child. She assists the
    mother during birth, cleans and bathes the child, as throughout Java and much
    of Indonesia, sees to it that the placenta and umbilical cord are washed and given
    a proper burial. The latter items are considered the “younger siblings” of the
    newborn whose amniotic fluid and blood are referred to as “elder siblings.” Together,
    all four compose the “four siblings” (duor mpat) of child, spirits who act as
    guardians (but also sometimes peasants) over one’s life. Similar notions are found
