    invocation of guardian and family spirits, much as occurs in Karo and other large
    rites, at which time the bride and groom ritualized respect to the spirits of
    their deceased relatives. The bond between the living and the dead is thus reaffirmed.
    With this invocation, the priestly services come to a close, and the social festivities
    of dining, drinking, and dancing being.


    The Tengger wedding ceremony nearly summarizes the contrasting conceptualization
    of tradition and religion among Tengger and Islamic Javanese. In Tengger, the
    *pernikahan* or legal ceremony is little more than a formality. For the most part
    it is a secular ceremony, in the sense that it neither incense nor offering, and
    thus invokes no deities and brings no blessing. It is the *walagara* that bears
    the burden of spiritual appeal and is thus the most religious of wedding ceremonies.
    The case is otherwise in the Islamic lowlands. Although the ceremonial meeting
    of bride and groom is rich in symbolism (see C. Geertz 1960:57) and social drama,
    it is, for people speaking at high levels of generalization—not a religious ceremony
    as such, but *custom*. The key moments in the Muslim wedding are the *pernikahan*
    and the *kenduren* prayer meal that precedes it, rites which include Islamic prayer
    and little distinctly Javanese symbolism. In short—and again viewing the ceremonies
    from the perspective of general ideological commentary—the ceremonial meeting
    of bride and groom has as such. In Tengger, by contrast, the religiosity of the
    customary meeting of bride and groom has been preserved by secularizing the legal
    ceremony (the *pernikahan* burns no incense and invokes no spirits) and preserving
    an explicit spirit in the ritualized meeting of bride and groom. Although the
    symbolism mobilized in the lowland event appears richly elaborate, and although,
    for some syncretic Javanese, it may express deeply spiritual themes, it is almost
    never referred to as “religion” as such. This is not the case in the Tengger wedding,
    where the imagery of fertility, ancestry are all easily recognized as expressive
    of primary religious concerns: ancestry, descent, and the continuity of the world
    of the living with that of the dead.


