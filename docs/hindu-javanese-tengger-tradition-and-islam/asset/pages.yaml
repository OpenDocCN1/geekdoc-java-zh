    # Early History


    In Old Javanese the term tengger means “highlands,” and thus the phrase tengger
    in an earlier period would have meant “highland person(s).” The tengger is no
    longer used in this way in modern Javanese, but is partially preserved in the
    Indonesian language as a verb, tengger, “to perch or sit above.” In the modern
    Javanese language, the term is used only as a proper noun to refer to the region
    and people of the Tengger highlands.³


    The earliest references to the Mt. Bromo region date from the first quarter of
    the tenth century. A stone charter dated 851 Saka (A.D. 929) granting the village
    of Lingangas autonomy in matters of taxation Walandt⁴ Charters from neighboring
    communities during this period also suggest the presence of cult activity related
    to Mt. Bromo. One such charter identifies the deity as Sang Hyang Swayambu, or
    the god Brahma. The association of Brahma with Mt. Bromo is also evident in the
    mountain''s name itself, Bromo or Brama being a Javanese variant of the name.
    In Indonesian Hindu, Brahma was frequently identified as the god of fire. In the
    fourteenth-century Tantu Panggegalaran, moreover, Brahma is referred to as a “blacksmith,
    and the very spot where he forged iron is the volcano Brahma” (Gonda 1952:132).


