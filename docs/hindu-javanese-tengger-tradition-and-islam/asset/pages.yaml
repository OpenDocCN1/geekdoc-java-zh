  md: '# PREFACE


    I visited the Tengger region with a series of short weekend visits during the
    summer of 1977, and I returned to do field work from December 1978 to July 1980.
    The field project was supported by a Fulbright-Hays Fellowship and a grant from
    the National Science Foundation, and I am very grateful to both of these excellent
    programs. The nineteen-month study began with eleven months of residence in a
    southern Tengger village, and ended with eight more in the northwest. In the interim,
    I also carried out research on household economy in a third community, also located
    in the south, and made several one-week visits to two Islamic communities between
    the Tengger northwest and two more to the south. In the interest of villagers''
    privacy, I have not used their real names at any point in the present book. In
    addition, when it seemed proper, I have referred to villages with pseudonyms,
    indicating in the text when I am doing so. In expressing my thanks to the people
    of these communities, I am thus left in the awkward position of referring to them
    collectively and anonymously. From beginning to end this research depended upon
    the kindness of the many people in my villages who took a sympathetic interest
    in this foreigner living among them. For them and other Tengger, I hope this work
    helps to correct the entirely erroneous myth that Tengger is backward and closed
    to the modern world, or somehow less Javanese. Their tradition has its roots in
    Javanese civilization, Tengger is very actively participating in the development
    of a modern Indonesia.


    Two small points of detail. The Javanese-language transcriptions presented in
    this book use a standard Indonesian orthography, rather than the more phonetic
    variant used in many Javanese texts. Second, I should note that this is the first
    of two monographs that I hope to publish on Tengger and Java. The second will
    more directly address aspects of political and economic change in the region,
    comparing with other areas of Indonesia. In the present work, therefore, I have
    often not pursued economic issues beyond their relevance for understanding the
    problem of Tengger identity and tradition in Java. I hope that readers interested
    in my brief comments on moral economy and social change will understand that the
    present monograph is a necessary preliminary for the latter.


    Finally, I wish to thank my wife, Nancy Smith-Hefner, who carried ethnolinguistic
    research in a Tengger community far distant (or so it felt) from my own villages,
    but managed nonetheless to provide the intellectual and emotional support necessary
    for a long-term project like this one. I relied extensively on her linguistic
