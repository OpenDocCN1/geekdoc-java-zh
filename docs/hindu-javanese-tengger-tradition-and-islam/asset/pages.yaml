    other than that of the family and the village itself. Nor were there, or are there
    today, castes, status groups, social clubs, or religious societies. Contrary to
    the pattern in some rural Javanese communities (see Koenjaringrat 1967:267; Jay
    1969:313). Tengger do not distinguish actual descendants of the village''s founders
