    The center of the Tengger massif is dominated by a vast but now inactive volcanic
    crater, 9 kilometers in diameter, with grass-covered walls climbing 400 meters
    from a desertlike central basin known as the “sand sea” (segara wedi). At the
    center of this enormous chasm stands a cluster of five small mountain peaks, each
    of which also rises 400 meters above the crater floor. Four of these five peaks
    are covered with a thick growth of elephant grass and bush. The fifth, known as
    Mt. Bromo, stands at the northern corner of this mountain cluster, and is without
    any grass cover. An active volcano, Mt. Bromo’s peak has been torn away, replaced
    by a steaming and bubbling crater hole. One imperial Western visitor to the area
    described Bromo as “awesome and awful” of “nothingness and destruction ... a monstrous
    sea of cinder" (Leclerc 1897:214). Judging by the etymology of the terms used
    to designate the terrain, early Hindu visitors to the region must have been similarly
    advised by the landscape. They gave it name that it links to the famous “sand
    sea” of Indian literature, a place of purgatorial passage to the Mt. Meru heavens.


    Today Tengger communities lie scattered in a narrow band below the rim of the
    volcanic crater, at altitudes ranging from 1,400 to 2,400 meters and at distances
    of 5 to 10 kilometers from the center of the sand sea itself. The altitude is
    high enough to keep temperatures in the 70s (Fahrenheit) and to drop nightly into
    the 40s, with two or three nights of frost each year. There are twenty-eight official
    villages (kalurahan) in this region, consisting of more than twice that of numbered
    settlement sites. A century ago the number of Tengger communities was greater,
