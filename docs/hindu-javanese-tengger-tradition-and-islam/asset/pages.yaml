    # Karo and All-Souls


    In Javanese the word karo means "second," "two," "both," or "with." In Tengger,
    the proper noun Karo refers in addition to the second month of the Tengger calendar
    year and the ritual which occupies most of that month. Karo is a ritual invocation
    of ancestors and guardian deities large—large as the village, in every village
    which calls itself Tengger. Karo is exceptional not only because its festivities
    extend but because, more than any other village ritual, it draws villagers directly
    into the detail of the celebration. There are two levels of ritual performance:
    one that is sponsored by the village as a whole, and another that is the responsibility
    of each individual household. The village as a whole makes the initial appeal
    to guardian deities and family spirits, but during the central days of the celebration
    those same spirits are invoked to individual homes, home after home, until the
    priest has worked in every household, and all villagers renewed their ties with
    the spirits of the family


    There is a small variation in the form the ceremonies in each village. Different
    villages begin the celebration, for example, at different dates by tradition.
    In the northeast and northwest, in addition, there are commencement ceremonies
    that draw together several villages in traditional dancing. In general, however,
    most Tengger communities begin the Karo festivities with a semenjena that announces
    the impeding liminal period of ritual activity. Several days after this opening
    ceremony (which is usually a private affair celebrated at the priest’s house),
    each household brings a contribution of food and money (called turun, pupon) to
    the house of the village chief, where the portion of the food offerings is set
    out in a mountainlike pile and blessed by the priest. In the week that follows,


