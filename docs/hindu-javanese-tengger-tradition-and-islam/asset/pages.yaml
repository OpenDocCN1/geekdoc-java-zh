    force in community organization. A household expresses its piety and social distinction
    through festivity. This duty is all the more incumbent upon wealthier villagers.
    A portion of their wealth is regularly consumed in elaborate ritual festivals
    that exhaust savings in several nights of festival glory. Private wealth is thus
    channeled into an acceptable public good, one that honors the gods, demonstrates
    a family''s social excellence, and supports the maintenance of the ritual system
    as a whole.


    All of this makes for what appears to be a well-integrated ritual, status, and
    economic system. This mode of integration has been one source of the ritual tradition''s
    cultural resilience in an Islamizing Java. As with most systems, the persistence
    of this one depends upon a network of contingencies far more complex than may
    be recognized, by any single actor. Changes in one sphere of activity may unintentionally
    bring changes in another. As we shall see, since Indonesian independence the continuing
    investment of wealthy villagers in traditional ritual consumption has set in motion
    a process of ritual inflation that threatens to diminish ritual sponsorship among
    the less affluent. Festival elaboration, combined with increasing socioeconomic
    differentiation, has in fact eroded the popular base of ritual social organization,
    and promises to promote fundamental adjustments in Tengger religion and self-perception.


    # Festival Scale and Labor


    Whenever spirits are invited to a ritual site, some kind of communion ceremony
    must be celebrated afterwards by the priest and ritual sponsors. In small rites,
    this may involve no more than the priest''s perfunctory consumption of a few handfuls
    of rice. In large ceremonies, however, the same function is served by several
    days of feasting and entertainment. It is the latter type of ritual festival with
    which I am concerned in this chapter, since it is the large festivals that are
    supported by ritual giving and play a central role in the economic and status
    system of the village. The most important of these large festivals are those associated
    with the wedding walacara and the entasas purification of the dead. No other rites
    rival these in the size and expense of their accompanying festivities. None plays
    as a central role in the expression of social distinction.


    The social scale and expense of these rites vary significantly. When one of their
    children marries, all parents are obliged to sponsor a walacara accompanied by
    some kind of social festivity. Since this ritual obligation falls equally upon
    everyone, the expense of this rite varies widely. The entas-entas, by contrast,
    is more consistently expensive,


