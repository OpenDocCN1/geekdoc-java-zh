    ferings, and finally dispatched to the heavens in a ritual structurally identical
    to that used in all invocation of family spirits. The role played by householders
    in this rite is equally well known: the final invocation of the soul, the spirit
    pauses mid-course in the rite, inviting householders to pay their respects to
    the soul of a person who was, perhaps only hours earlier, a living loved one.
    Kim and piously bow to the soul of their dead relative, temporarily resident in
    the petra figurine. The gesture they make (sembah bati) is the same as in Karo,
    the entasentas, and other invocation of the ancestral dead. Personal loss is thus
    quickly drawn into ritualized pattern. The spirit of the deceased is at once close,
    present in the petra, and irreversibly distant, ascending into a spiritual world
    with which intercourse is only possible through ritual form. The soul joins the
    community of other family and village spirits, spirits invited again and to one''s
    home for the rest of one''s life. The ritual reciprocity of elder to youth is
    reversed, as now it is the child honors parents and ensures elders'' spiritual
    welfare. This cycle of social and spiritual interdependence that underlies villagers''
    conceptions as to the nature of the afterlife. The souls of the dead, is known,
    in contact with the living until time has erased their memory and their individual
    identity is lost. Distant ancestors join the assembly of guardian spirits with
    the welfare of the village as a whole. The individual gives way to a more anonymous
    and collective relationship.


    This vision of the afterlife accords with ritual practice. Where there is little
    precedent for cultural ideas, concepts tend to be vaguer and subject to much more
    dispute. Some people, for example, say that there is judgment after death, a rendering
    of one''s happiness in the afterlife performed by an agent of God that is critical
    in determining one''s happiness. Other villagers, however, reject this idea of
    judgment after death, insisting that everyone receives a “place”(panggon) in heaven
    (khayangan) regardless of one''s activities in this life. According to this, the
    most popular view of the afterlife, heaven is a kind of social community, in which
    these things are related like in the next. A minority of villagers take this notion
    even further, suggesting that heaven has its own desa village organization, complete
    with pamong officials, village chiefs, and priests. This vision of heaven, a native
    Durkheimism, is rejected by virtually all Tengger priests.


    In traditional Tengger villages, unlike those influenced by the Hindu reform movement,
    little effort is made to establish some kind of doctrinal orthodoxy on matters
    not specifically addressed by ritual practice; hence there are a variety of ideas
    as to the nature of the afterlife. Many villagers speak of karmic law (hukum karma),
    but the idea is rarely extended into


