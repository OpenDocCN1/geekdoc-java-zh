    # The Priest’s Ritual Estate


    With the exception of one northwestern village (which, as a result of disputes
    over a generation ago, now has three priests), each community in the Tengger region
    has only one priest at any time, and this man is heir to a variety of ritual implements
    more or less standardized throughout the Tengger region. These include: an incense
    brazier (prapen); a bronze holy water peater (prasen); a ritual cord (sampet)
    made of batik or bright cloth, wrapped around the waist and shoulders in important
    liturgies; a ritual shift known as the baju antakusuma, now longer worn but preserved
    as a ritual heirloom; a petungan calendar for determining auspicious dates; and
    palm-leaf books (kropak) of prayers and ritual lore. Many priests also offer other
    ceremonial items, including maps, pots other pieces of old priestly clothing,
    and old bronze bells, a few of which are decorated with a thunderbolt associated
    with Hindu priests in Old Java. Some of these implements provide additional clues
    as the relationship of Tengger to an earlier Javanese Hindu tradition. The decorations
    and dates stamped on the holy water breaker suggest that in the fourteenth century
    Tengger priests were linked to a popular Shivaite priesthood found in other areas
    of Java and Bali (Chapter 2, Appendix). The ritual cord of Tengger priests similarly
    resembles what was used by Hindu priests in pre-Islamic Java (see Louhuizen-de
    Leeuw 1972:160). The petungan calendar also shows parallels with the old Hindu-Balinese
    calendar (compare Menscha 1879 with Goris 1960:113). The baju antakusuma, although
    a shirt of the same name is found in Old Java and Bali (Scholte 1921), is found
    in Javanese *wayang* and Central Javanese court tradition tradition (Jasper 1926:26).
    The historical associations of these ritual implements are not known by modern
    Tengger, of course, but further confirm that their tradition has roots in the
    religion of Old Java.


    The Tengger priest is helped in ritual services by three assistants, whose activities
    once again distinguish the priest from lowland dukuns and highlight the priest’s
    exclusive ritual authority. The first and most important of the assistants is
    known as the wong sepuh, literally, “elder,” but in this context appropriately
    translated as “ritual elder.” One of the wong sepuh’s most important responsibilities
    is the fabrication and eventual cremation of the petra, or flower figurines to
    which family spirits are invoked. His role as petra caretaker is indicative of
    the ritual elder’s general responsibilities. It is he, in effect, who charged
    with the care and attention of family spirits once they have been invoked to a
    ritual


