    toward Mt. Bromo, but a few prayed toward the more widely accepted "south." This
    explained the confusion over southern skewing as opposed to Mt. Bromo directionalism,
    but it left unexplained why Mt. Bromo would have been identified as south in the
    first place.


    Such a link between mountains and a directional system is not without precedent
    in Indonesian tradition. In Bali, particularly, the four cardinal directions are
    similarly defined in relation to the mountain lying at the center of the island.
    Whereas in Tengger to move downward is to go south, in Bali movement toward the
    mountain is identified as "north." In both cases, all the other cardinal directions
    then adjust themselves to this mountain anchor. The parallelism between the two
    systems is thus restricted at best. And it still leaves unexplained the basic
    question as to why Mt. Bromo would be identified with south.


