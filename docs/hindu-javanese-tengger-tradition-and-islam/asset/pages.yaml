    Despite variation in minor detail, the basic pattern of the Karo cycle—repeated
    invocation of guardian deities and the residing presence of family spirits over
    a two- or three-week period—is remarkably consistent across Tengger. There are
    two points of variation worth noting, each year, in the northwest and in the northeast,
    the Karo season begins with a traditional dance known as the *sodaran* (from *sodor*,
    "spear, staff"). The dance is only performed during Karo, and only in these villages.
    Its style varies considerably between the northeast and northwest (Hefner 1982),
    but its overall movement—and exegesis—is the same in both communities. The dancers
    are men. For of the dance they carry bamboo poles (*sodor*). In the northwest
    these poles are filled with various agricultural seeds; in the northeast, they
    are simply adorned with red and white cloth (color symbolism associated with male
    and female, fertility). The dance form is relatively simple: holding the poles
    out before them, the men (first a dancer, then groups of men) advance towards
    dancers at the other side of the room, repeat the in-out movement three times.
    On the third and final approach, the dancers walk past each other, turn around,
    and face each other again, only to repeat the same advance-and-retreat pattern.
    This goes on for some time, embellished with various movements and formal utterances
    from the side of the dance floor. The dance finally culminates with a rising crescendo
    of *gamelan* drum and gong, at a feverish pace, during which the dancers shake
    the poles they carry against the bamboo poles shattering, their seed contents
    spilling out onto the ground. In the northeast, by contrast, the poles are not
    broken. Throughout the dance, however, two village chiefs sit to the side of the
    dance floor, one dressed as a groom, the other dressed in a woman’s scarf to look
    like a bride. In both the northwest and northeast, the male dancers themselves
    are referred to as “bride and groom” (*manten*), and the dance is thus said to
    represent the sexual interaction of male and female.


    The second major point of variation in the Karo proceedings is also a pole event,
    but different from the *sodaran*—this time whip fighting with rattan sticks (*ujungan*).
    This occurs in a few Tengger villages at the end of the *nyadhan* festivities.
    The *ujungan* is a beautiful martial art, combining the skills of dancing, boxing,
    and fencing. Young men usually volunteer for the contest.'
