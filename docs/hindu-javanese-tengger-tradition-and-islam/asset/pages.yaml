    two Tengger communities still (and many forty years ago), there is a different
    directional system from that used elsewhere in Java, although the words for the
    compass points are the same. In Tengger communities, the direction of Mt. Bromo
    from a village is was always referred to as "south." All compass points adjusted
    themselves accordingly, so that, while all communities agreed that Mt. Bromo was
    "south," the other directions varied according to where one stood in relation
    to the volcano. The fact that Tengger used to identify the direction of Mt. Bromo
    as south, helps to resolve the problem of why some priests today pray toward Mt.
