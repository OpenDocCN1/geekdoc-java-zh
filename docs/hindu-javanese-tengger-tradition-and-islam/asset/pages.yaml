    In the final years of the eighteenth century, Dutch officials made several visits
    to the pacified Tengger highlands, surveying the region, noting its curious customs,
    and assessing its economic potential. In 1875, a small rest hostel was established
    in the northwest Tengger village of Tosari, and cultivation of European vegetables
    was introduced (Rouffier 1921:301). Reports on the region applauded the lack of
    crime, adultery, and opium, and described the people as simple and trustworthy.
    Dutch visitors also noted the fertility of the area''s rich volcanic soil and
    the disturbing lack of local population to make good commercial use of it (Jasper
    1926:11). Almost a century of warfare throughout the Eastern Salient had radically
    depopulated the region. With rich soil but little population, the Tengger region
    was booty not yet ready to yield its reward. Coffee cultivation apparently was
    not yet known in the region (Rouffier 1921:301). The crop''s introduction into
    the area at the end of the eighteenth century would eventually allow the colonial
    government to make good use of this fertile mantle land at the same time solving
    the problem of the area''s depopulation.


    # Tengger in the Nineteenth and Twentieth Centuries


    At the beginning of the nineteenth century, Java''s population probably stood
    around 5 million people. By 1850, it had reached to 10 million; by 1900, 28 million;
    by 1930 42 million, and onward to today''s population approaching 100 million.7
    By comparison with today''s population, therefore, Java at the beginning of the
    nineteenth century was still rather sparsely populated, with vast forest and wetland
    areas.


    Estimates of Tengger population at this time vary significantly, they all present
    a picture of very underpopulated territory. In the second decade of the nineteenth
    century, Raffles placed the Tengger population at 1,200 people scattered about
    forty villages (Raffles 1965:1:332). An 1830 estimate Tengger population at 3,000
    in-


