    Two social facts, however, make the Tengger situation distinctive. The first is
    that these ideas of equality and nonexclusivity in the village are key themes
    of Tengger ritual tradition, at least as it is popularly understood. Lowland cults
    of guardian ancestors and territorial spirits provide a very similaronance of
    spiritual and social idioms, but particularly over the past century, the role
    of such cults has been seriously qualified with the role of a revitalized Islam.
    In Tengger, the parallelism between popular concepts of social order and the spiritual
    world provides the ritual heritage with a compelling element of social depth.
    Here, as everywhere, religious idioms are powerfully compelling not by virtue
    of their internal logic, but because they are capable of tapping and articulating
    more general sentiments as to the moral nature of social existence.


    The second distinctive aspect of these themes of Tengger interaction is that,
    in this area of Java, informal and nonexclusive styles have a special identity:
    they are “Tengger.” There is a parallel here with the Tengger dialect of Javanese.
    The dialect, social idioms in Tengger tend to emphasize nondifferentiating and
    nonexclusive patterns of interaction. Contrary to sometimes rarefied stereotypes
    of Javanese society, many of these patterns are found in the rural locals, as
    Jay’s (1966) work shows so. The status of such values is quite different in the
    two regions however, by virtue of the fact that less differentiating styles in
    low society are in effect “marginalized” through their identification as less
    formal, less polite, and more powerful than elaborate social styles. Tengger culture
    resists this hierarchical displacement by taking the same values and identifying
    them as “Tengger”—thereby giving them an integral, self-referential quality that
    the same values in the lowlands back. To speak Tengger ngoko, to be aggressively
    undifferentiating in interaction, is not to be coarse and rural, but to be “Tengger.”
    Local customs are not mere shadows of forms projected more brilliantly in the
    city, at the court, or in more circles, but are complete and valuable in themselves—the
