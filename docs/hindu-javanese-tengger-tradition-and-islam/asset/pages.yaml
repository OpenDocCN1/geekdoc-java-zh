    Agriculture is thus the main activity. From the perspective of its labor input,
    agriculture is primarily a household affair. At least under the subsistence system
    that dominated Tengger agriculture until recently, labor involves little large-scale
    mobilization. The traditional subsistence crop of maize and market vegetables
