    # THE ECONOMICS OF RITUAL

    REPRODUCTION


    Since examining village organization in Chapter 4, our discussion has focused
    on the organization and meaning of Tengger ritual in a changing Java. The problem
    of how this or any other ritual system reproduces itself through time, however,
    involves more than these already complex questions as to how people make sense
    of their tradition and identity. Ritual is a mode of social practice. It is thus
    an activity that depends not only on ritual meaning and spiritual intent, but
    also on the mobilization of people and resources in patterned social process.
    This periodic mobilization may be constrained by political and economic considerations
    other than those of religion alone. This same activity may have social consequences
    quite apart from those religiously intended, consequences that nonetheless return
    to the social environment as constraints and “causal influences on human action”
    (Giddens 1979:7). Here in Tengger, as we will see, ritual affects and is affected
    by village social and economic organization. The requirements and consequences
    of ritual extend across social fields. They link the cultural imperatives of the
    ritual tradition to the more mundane concerns of status, power, and economic morality.
    Through this arrangement, ritual acquires a peculiar social momentum, motivated
    by concerns other than ritual piety alone. At the same time, however, social and
    economic activities are affected by religious concerns. As a result of both inferences,
    ritual maintains its central role in Tengger social life.


    This arrangement is important for understanding the larger themes of Tengger ritual
    culture. Many of them—the ancestral bias of popular commentary, the general lack
    of an exegetical tradition, the belief that all villagers are equal and alike
    (pada-pada)—have been reinforced by ritual’s role in community life. Ritual is
    also linked, however, to social hierarchy. In communities otherwise known throughout
    Java for their lack of socioeconomic differentiation, ritual has always been an
    arena where the expression of social distinction is considered acceptable. People
    of social standing are, quite simply, big ritual sponsors. They are also supposed
    to be generous donors, since festival celebration depends on a complex system
    of gift giving ritual sponsors. The practical linkages implicit in this arrangement
    are important for understanding why the ritual tradition has remained such a


    216'
