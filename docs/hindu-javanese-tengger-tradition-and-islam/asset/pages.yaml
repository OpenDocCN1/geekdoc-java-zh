    The shift to greater reliance upon sumbangan gifts in ritual capital formation
    represented a practical recognition that the burden of ritual savings could no
    longer be divided among members of the village community. Whereas the bowo''s
    demand for contribution is, or was, generalized (all guests pay, and most people
    used to pay the same amount), the sumbangan system in effect segregates villagers
    into networks of exchange partners. The wealthy tend to exchange with the wealthy,
    and the poor with the poor, since people of similar economic standing are likely
    to have similar capital needs and capabilities to respond to those. Tengger still
    point to the importance of bowo and sumbangan as evidence that the village is
    one of community, but this egalitarian idiom overlooks the fact that the festival
    system has changed profoundly over the years, largely in reaction to larger developments
    in the socioeconomic organization of the community as a whole. Moreover, these
    changes in the economic organization of ritual festivals continue in a manner
    that may ultimately help to redefine public attitudes on ritual performance itself.


    # Recent Changes in Ritual Economy


    Viewed from the perspective of its socioeconomic organization, Tengger ritual
    shows once again how much it is a total social fact touching all facets of economic,
    political, and cultural life. There is no independent church to sponsor ritual
    festivity in these communities. Households linked in complex networks of giving
    and receiving assume responsibility for the task of accumulating the social and
    capital resources required for household festivals. And this of course is the
    critical strength and weakness of the ritual system. Where ritual exchange is
    strong, the festival cycle is likely to be strong; where it is weak, ritual performance
    itself may be imperiled. Comparison of sumbangan-organization in three villages
    (see Table 7) reveals how profound can be the differences in size of sumbangan
    networks.


    Examining the figures first from the perspective of differences of land wealth
    within the village, it is clear that in all communities the land wealthy have
    an average number of exchange partners twice as large as that of the poor. This
    only confirms a general impression the poor be less active in festival events,
    either as sponsors or workers, than are the more affluent. In a social system
    stressing the substantiation of relationships through the exchange of resources,
    the poor have less to give, and a good deal to gain socially. One hears this in
    conversation with the village poor. They tend to restrict their sumbangan exchange
    to immediate kin.


