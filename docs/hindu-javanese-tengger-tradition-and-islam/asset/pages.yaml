    # VILLAGE RITUAL AND ISLAM


    The *slametan* or ritual festival stands above all events in the community uniquely
    “Tengger.” No other event attracts such attention; none consumes such wealth;
    and none benefit from such an elaborate system of organization and etiquette.
    To define it, a *slametan* in Tengger is a public religious ceremony involving
    priestly invocation and worship of deities, the witnessing of that event by persons,
    and at least in most instances, some kind of meal communion or social festival
    to celebrate the occasion. From a religious perspective, the key moment in all
    is the priest’s invocation of the deities. Without their presence, there is no
    blessing and, thus, no reason for celebration.


    At first sight is an irony in this identification of the *slametan* as a distinctive
    feature of Tengger identity. A ritual of the same name is found throughout Java,
    except in reform Muslim communities where it has been abolished. “At the center
    of the whole Javanese religious system,” Clifford Geertz has written (1960:11),
    “lies a simple, formal, dramatic and furtive ritual: the *slametan* ... the Javanese
    version of what is perhaps the world’s most common ritual, the communal feast.”
    The irony, however, is only superficial. What Tengger regard as a *slametan* differs
    significantly from the lowland event of the same name. The precise nature of that
    difference illustrates well the non-Islamic quality of Tengger ritual, and, by
    implication, the degree to which popular Javanese tradition elsewhere has accommodated
    to Islam.


