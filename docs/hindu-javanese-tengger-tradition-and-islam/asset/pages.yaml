    # Mythic Word and World


    With the earlier Kasada myth, the Ajisaka tale is a story of two cultural traditions
    told through the interaction of personages: Ajisaka and Mohammad, Buda and Islam.
    The story moves the main actors through a series of episodes that provide important,
    at times implicit, comment on the quality of their relationship. Personal relationship
    is here of course symptomatic of a larger cultural process. The myth is not merely
    a tale of Ajisaka and Buda, but of the evolution of Javanese culture.


    From the start we hear sounds of a new order and the evolution of the demise of
    the old. It is, the story begins, the time of Ki Kures. Despite the honorific
    Javanese title (ki), Kures is recognizable as a character from a less-'
