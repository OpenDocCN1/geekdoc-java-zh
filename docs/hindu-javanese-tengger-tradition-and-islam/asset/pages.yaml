  md: '# APPENDIX


    Tengger priest. Besides the title of resi puja, Tengger priests could, until quite
    recently, receive another ritual title, the baru or tiyang baru (“baru person”).
    This title was restricted to those who underwent an initiation ceremony in life,
    the purpose of which was to allow one to “die and be reborn,” purified of all
    sin. Priests who knew of the ceremony compared its purification to an entas-entas,
    saying it was being purified in an entas-entas before death. The *baru* ceremony
    is no longer practiced, and I came across it in field work only in the course
    of tracking down related historical information in discussions with elderly villagers.
    The eldest priest in the Tengger south said that the rite was last performed in
    the 1930s; he lost his father’s prayer notes for the rite in 1946, when Dutch
    forces swept through the village and burned a hill out which an assortment of
    holy texts had been stored. His efforts to obtain copies of the prayer ended in
    failure. Northern priests (as my own inquiries confirmed) told them they had never
    heard of the ceremony; one southern priest had, but had lost the prayers for the
    rite several decades back, during a crisis related to the village conversion to
    Islam. According to both priests'' accounts, and—the ritual alliance again—village
    chiefs could undergo the *baru* ceremony. If this is true, it makes less clear
    just what the relation is between the baru and resi roles; only that it is not
    exclusively a priestly role. What is clear about the *baru* role in Tengger, however,
    is that it entailed spiritual privileges. Baru people were the only ones whose
    were allowed to ascend to Mt. Semeru at death; ordinary priests and villagers
    went to Mt. Bromo. This identification of social and spiritual hierarchy is, of
    course, consistent with Indic tradition where in Southeast Asia. In Bali, for
    example, royalty (unlike commoners) are supposed to ascend directly to heaven.
    It may well have been the radically undemocratic overtones of the rite in Tengger
    that contributed to its demise in modern times.


    The historic interest of the *baru* role, however, is that a similar title is
    identified in Old Javanese literature as “one of the groups of men officiating
    in popular (Shiwaite) ceremonies” (Pigeaud 1962:105). Although Pigeaud himself
    not link the baru priests to what were known as mandala communities, one is tempted
    to suggest that in Tengger there may have such a relationship. The tone of the
    Tengger priest''s old prayers, their lack of reference to non-Indic deities, and
    their appeals to Siva and Uma (or Kala and Durga) suggest that in Tengger a cult
    of Siva and Uma may have been superimposed on a preexisting mountain tradition.
    The *mandala* image, moreover, appears frequently in the Tengger priest’s prayers,
    and it is easy to speculate'
