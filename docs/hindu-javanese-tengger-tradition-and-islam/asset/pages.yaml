    The implication here is that, above all for an understanding of cultural change,
    we must take apart our concept of culture by examining the way in which different
    forms of knowledge are sustained, and dependent upon, different forms of social
    organization. Cultural change is often uneven because the social arrangements
    that sustain different types of knowledge respond quite differently to pressures
    from within or outside a society.


    I have attempted to explore some of the general implications of this point in
    the present work. They suggest, among other things, the distinction between “oral”
    and “literate” culture is too grossly technological. No tradition is purely “oral”;
    in the simplest societies people use a variety of artifacts, mnemonics, and activities
    to shape and transmit knowledge. Not all “oral” culture is equally homeomorphic.”
    Moreover, the cultural survival of a tradition is always determined by more intellectual
    technology. The sacred scriptures of world religions have achieved their historical
    preeminence not by virtue of literate technology alone, but because social and
    political groups committed to their truth have succeeded in maintaining a role
