    of the fourteenth century, the height of Majapahit''s religious renaissance. Similar
    zodiacbeakers have been found in many areas of East Java, but none besides those
    in Tengger. The distribution of such a standardized ritual suggests that religious
    activity in the Mt.romo region was probably only coordinated with in other areas
    of Old Java and even Bali (see Appendix).


