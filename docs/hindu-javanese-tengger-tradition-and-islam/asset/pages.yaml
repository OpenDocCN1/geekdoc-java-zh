    Bowo payments in the south tended to average Rp 500 for women and Rp 750-1,000
    for men; payments were about twice that in the northwest. A high-status individual
    such as the village chief usually makes a bowo payment about twice that of the
    average amount. All in all, the amount of capital accumulated by the bowo payments
    is substantial, although it represents a smaller proportion of total festival
    expense than was the case for sumbangan (see Table 6).


    As a proportion of total expense, bowo contributions amount about one-half the
    total volume of sumbangan contributions. Both forms of festival exchange represent
    in effect regulated systems of ritual capital. But their social organization is
    quite different, and their role in ritual capital formation appear to have been
    reversed in the years since the Great Depression of the 1930s. Prior to that time,
    villagers say, bowo payments tended to be more evenly distributed than they are
    today. With the occasional exception of the village chief or priest, all contributed
    the same amount of bowo money, and they did without bothering to record just who
    paid what. Sumbangan contributions were also made in earlier times, although were
    not as large as they are today. The bowo was the most important source of capital
    for festivals. The economic chaos of world depression, Japanese occupation, and
    Indonesian independence all contributed to the eventual demise of this less stratified
    system of ritual exchange. Cash was alternately a scarce resource for villagers,
    and worthless one meaningless by the ravages of inflation. It was during the depression,
    villagers say, that some people became unable to make bowo gifts at festivals,
    and the amount paid by any one person came to vary according to one’s means. Indeed,
    the festival system as a whole suffered throughout this period. Few villagers
    sponsored elaborate festivities. When, after thirty years of neglect, the festival
    system revived in the late 1950s, it emerged in a more stratified form. Wealthy
    villagers, in particular, came to rely more heavily upon sumbangan contributions
    than bowo payments in accumulating the capital required for large festivals. The
    recording of bowo and sumbangan payments—an innovation introduced into the region
    in the late 1930s—became the norm.


