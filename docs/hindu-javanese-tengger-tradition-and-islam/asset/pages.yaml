    Ordinary villagers thus “know” more than is expressed in myth or folk commentary.
    In a certain sense, however, this knowledge must be in buckets. Since it receives
    no public sanction, an individual’s understanding of the liturgy remains an unspoken
    truth, an unshared meaning. There is a tension between public discourse and personal
    inference, at least for some people. This does not mean that the symbolism internal
    to the liturgy is “meaningless.” It indicates, however, “internalized” by actors
    in their presence, or that the same cultural symbolism is equally meaningful to
    everyone. In our eagerness to explore the meaning of things in another society,
    we sometimes forget that a material symbol (be a ritual object or phonic sign)
    is never itself a “meaning.” Between the cultural object and its “meaning,” the
    signifier and the signified, there is always a human subject, who must engage
    in active reconstruction for the symbol to yield a “meaning.” This interpretive
    work depends upon more than the words and actions performed; it evokes knowledge
    and sentiments born of a wider and always ongoing socialization. This socialization
    itself has a history and social organization, which ensures that, by Bourdieu
    has noted, no cultural tradition is in fact “the undivided property of the whole
    symbol” (Bourdieu 1973:73). One’s biography and social position influence what
    one brings to cultural performance, and what one is likely to see. One such social
    organization of knowledge in Tengur ensures that certain aspects of the tradition
    were elevated to the status of public truths, whereas others became unspeakable
    sacred mysteries.


