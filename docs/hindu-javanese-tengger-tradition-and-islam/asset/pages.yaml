    differs significantly from lowland wet-rice cultivation. Maize can be planted,
    weeded, and harvested in a piecemeal fashion. There is a general need to coordinate
    planting and harvesting with the wet and dry seasons of the Eastern Salient (which
    in this area are pronounced), but there are few of the strict constraints of precision
    timing required by wet rice agriculture. Harvesting can be accomplished over several
    days by a small group of workers. At least on the small scale of cultivation of
    subsistence agriculture, vegetable crops can be planted and harvested in a similarly
    piecemeal fashion. Indeed, this was the traditionally preferred practice, since
