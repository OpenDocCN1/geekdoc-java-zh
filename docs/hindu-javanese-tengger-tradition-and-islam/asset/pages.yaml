    At first sight, one of the most striking things about this myth is that, although
    it purports to explain the origin and meaning of the Kasada festival, it seems
    to pay remarkably little attention to many of the most conspicuous features of
    the rite itself. The myth makes no mention of the priests, the detail of the liturgy,
    or the initiation ceremony that sometimes accompanies the Mt. Bromo rite. Rather
    than myth “expressing” the same themes as seem to occupy the rite (as some theories
    of myth and ritual might), the Kasada tale appears preoccupied with sociological
    issues in no way evident in ritual performance. In particular, it tells a story
    of social relationships, relationships that themselves speak to the question of
    Tengger identity and its relation to Islam. Kasada story is a moral tale that
    legitimates tradition by linking it to founding ancestors, and insisting on the
    importance of both for the living.


    These larger themes are developed almost unconsciously, through the arrangement
    and rearrangement of family ties between characters in the tale. The first such
    rearrangement of social relationships is between Dadap Putri, a Majapahit priest,
    and Rara, a daughter in search of her father (also a priest). Both actors are
    Majapahit, and both are from non-Muslim families, that ease actors’ transition
    into a new relationship, that of adopted father to daughter. We hear few other
