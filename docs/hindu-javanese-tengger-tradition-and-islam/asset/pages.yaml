    # Tengger and Non-Tengger in the Aji Tale


    Few of the terms in the Ajisaka tale appear distinctively Tengger. The tale abounds
    with Islamic references, and makes almost no mention of specifically Tengger practices
    or beliefs. Indeed, comparative and historical evidence suggests that the tale
    is not an orthogenetic product of Tengger tradition. I recorded variants of the
    same tale in kejajawan Muslim communities far to the south of the Tengger highlands.
    There are nineteenth-century versions of the same tale in the National Museum
    in Jakarta, most of which come from non-Tengger areas of Java.² The central narrative
    of the Ajisaka tale appears to be popular in lowland areas of the Eastern Salient
    before it was adopted by Tengger.


