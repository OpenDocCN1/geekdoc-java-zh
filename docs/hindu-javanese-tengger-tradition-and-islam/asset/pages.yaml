    # The Kasada Myth in Javanese Tradition


    With all cultural products, the visible text here assumes a less visible corpus
    of knowledge and an assortment of axioms as to the nature of the world. The Kasada
    myth does not create its images from nothing, nor does it establish its moral
    authority in the simple act of its enunciation. The text assumes a larger cultural
    universe and a shared body of experience. It then attempts to take and rework
    these in the service of a more distinctive cultural manage.


    At its most general level, for example, the Kasada myth employs an assortment
    of cultural ideas that Tengger share with their non-Tengger neighbors. The symbolism
    of mountains, gods, and ancestors, for example, is a powerful one in Javanese
    tradition. In ancient Java, mountains appear to have been identified as the celestial
    abode of the ancestors; in Hindu-Buddhist times, this symbolism was accommodated
    by Indian cosmology by identifying the mountains as the home of Hindu deities
    (Paud 1962:IV:8). Even in contemporary Islamic, one occasionally hears that the
    Hindu gods did not die with the coming of Islam, they simply retired to mountaintop
    abodes.


    This same linkage of mountains and supernatural power takes a what difference
    form today in the lowland villages the Tengger highlands. Throughout the region,
    Mt. Bromo and Mt. Semeru are often referred to as the domains of especially powerful
    territorial spirits. These are the spirits, for example, who are thought by syncretic
    lowlanders to control the flow of life-giving waters from the mountains to the
    village below. The identification of mountains with water and fertility is


