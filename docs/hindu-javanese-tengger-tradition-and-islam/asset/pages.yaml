    # The Ritual Background


    The date for an entas-entas has to be determined six or more months in advance
    of the rite''s actual celebration. The priest is responsible for choosing the
    exact date, which he fixes according to numerological and calendrical information
    he obtains from his petungan book. He also sets a date for the performance of
    a semenenga ritual announcement, which in effect opens preparations for the ceremony.
    The semenenga for an entas-entas usually occurs five or six months in advance
    of the rest of the purification rite. It is only after this preliminary incense
    announcement that the husband and wife are sponsors of the upcoming entas-entas
    visit their ritual exchange partners, politely requesting aid in the meeting of
    the festival, and thus securing the return of the hundreds or thousands of dollars
    and gifts earlier made to exchange partners (Chapter 10). To use the repayment
    for anything other than the ritual preparations, or to fail to perform the entas-entas
    after having announced it to the gods, is considered a grievous sin.


    General preparations for the entas-entas begin several weeks prior to the actual
    celebration. Gifts of cash and good in exchange partners, and there are several
    days of festive cooperative labor (sayan) to collect wood for the festival''s
    kitchen fires, to build the veranda (tarop) under which guests will dance and
    dine, to whitewash house walls, to extend the kitchen and add additional stoves,
    to make rice and maize flour for sweets, and, in, to prepare the hundreds of things
    necessary for the upcoming festivities. Technical preparation for the priestly
    liturgy begins only one day prior to the festival. The priest''s ritual assistants
    help in the cooking and composition of sajenan offerings, and the fabrication
    of the flower figurines (petra) to which the souls of the ancestral dead will
    be invoked. The petra figurines are the responsibility of the wong sepuh, or of
    the priest''s elder ritual assistant (Chapter 9). Each petra stands about eighteen
    inches high, and is made from long fibrous leaf known as tlok or klodok which
    is doubled over to form the doll''s body, and ruffled at the base to make its
    fit. The face is made from a four-centimeter square of white palm leaf decorated
    with small incisions to make geometric eyes, a nose, and mouth. A small bouquet
    of edelweiss, mixed with marigold, creates the petra''s hair.


    Petra are prepared for three categories of spirit guests: the family souls to
    be purified for ascent to heaven, an equal number of family souls who come as
    “witnesses” (saksi) to the ritual purification, but who are themselves not ritually
    purified, and a special guardian deity the soul of a deceased whose duty it is
    to witness the purification'
