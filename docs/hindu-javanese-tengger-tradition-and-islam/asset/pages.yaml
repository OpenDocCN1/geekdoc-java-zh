    yard or garden land between buildings, and no trees to obscure vision of the surrounding
    countryside. Houses are built on terraces (gampegan), the defensive functions
    of which appear to have consisted of the good view they gave of the countryside
    and the fact that they made passage through the village difficult except by way
    of the main road.


    The extension of colonial administration in the highlands beginning in the late
    eighteenth century facilitated a gradual relaxation of regional tensions, a relocation
    of some villages, and a dispersion of later settlements. Occasional violence still
    plagued some communities, however. Even in the 1830s, Dutch reports indicate that
    some Tengger villages were attacked by bandits (Jasper 1926); village histories
    in one southern village will recount that in the mid-nineteenth century the entire
    village was temporarily deserted after a particularly vicious brig raid left the
    village chief and several other men died. Shortly after this period, however,
    the population began to increase throughout the area, largely as a consequence
    of landowners'' immigration. Mountain “ lands lands were opened to the cultivation
    of coffee, tea, and other crops. Lower-lying Tengger settlements were surrounded
    by more dispersed communities of Madure and Javanese.


    For the most part, Tengger villages today differ in appearance from neighboring
    non-Tengger mountain communities. The earlier style of Tengger house with its
    narrow front veranda, and a single long back room (Raffles 1965:1:330); Domis
    1832:331) has in this century given way to a dizzying variety of house styles,
    ranging from simple wooden shacks to large plaster and plate-glass houses built
    by carpenters in urban highlands. The distinctive wooden carvings once seen in
    Tengger (Jasper 1926:6) have also but disappeared in favor of a more finished,
    lowland-style home. As in dress and other decorative fashions, Tengger here displays
    little social conservatism, eagerly imitating styles first developed in the lowlands.


    More remarkable perhaps is the fact that Tengger villages have no temples statues,
    shrines, or other structures that might announce to an outsider the non-Islamic
    faith of the community. When visiting the village of residence, one lowland lamented
    what he called the absence of indigenous art. Tengger villages, he complained,
    looked “just like a Javanese village.” The ubiquitous aestheticism of Hindu Bali
    finds no counterpart in these villages. Elder villagers report that in earlier
    decades status and religious implements had been found in fields and forests,
    but none remain today. The exceptions are the priest’s ritual implements, brought
