    organization. Priestly liturgy and “official” doctrine are subject to different
    social pressures, and different tempos of change, because each medium is embedded
    in a social environment subject to different practical contingencies. Per-forming
    and transmitting the liturgy, Tengger priests are subject to a different sort
    of cultural accountability that are the accounts of popular ritual tradition.
    This is critical nexus—the in which different forms of cultural knowledge are
    subject to different social controls—that provides clues for understanding the
    uneven quality of Tengger ritual reproduction through time.


    # Work and Word: The Purification Viewed from Its Prayers


    The division of ritual labor in Tengger effectively creates a parallel segregation
    of experience. Lay villagers cannot study the prayers of the liturgy in the ways
    that priests must. As the dispute over the meaning of the entas-entas indicates,
    however, the separation of roles and ex-periences is not absolute. Some people
    have regular opportunities to witness the liturgy from close up. Rituals like
    the palukatan have, in unusually explicit gestural symbolism that lends to at
    least speculative interpretation. Finally, some priests recite their prayers more
    clearly than other priests, so portions of many prayers are intelligible for people
    within hearing range who bother to pay attention. The segregation of lay villagers
    from the liturgy’s rich language and gestural symbolism is, therefore, by no means
    absolute. As we shall moreover, there is considerable evidence that villagers
    know a good deal more than they are willing or encouraged to say.


    All of these considerations make more problematic the question of the cultural
    status of priestly prayer. Is it irrelevant to the rite’s cultural meaning? Or
    indeed, should prayer be considered the very key to ritual’s truth? Traditional
    philological approaches to literate liturgical religions'
