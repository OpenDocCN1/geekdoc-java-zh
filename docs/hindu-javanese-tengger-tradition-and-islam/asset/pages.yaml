    # VILLAGE WORLD AND VILLAGE CONCEPTS


    Village organization in Tengger is not rent with the ambiguity of social forces
    that characterize the region as a whole. Social activity within each Tengger community
    is characterized by a much greater overlap of political, economic, and ritual
    bonds than is found elsewhere. Although, as in other modern Javanese communities,
    local government has been formally integrated into a national political administration,
    villages still exercise corporate control over a variety of resources and activities,
    including land, water rights, cooperative labor, and ritual. Government-sponsored
    programs are usually implemented at a local level by the officials of each community.
    With the exception of the priesthood, there exists no formal system of kinship,
    polity, caste, or status between individuals or groups in different villages.
    In short, the village is the locus of a number of primary social activities. Ritual
    does not have to swim against the organizational control of local life; it reinforces
    it.


    In addition, at the community level many of the distinctive ideas on the popular
    meaning of the ritual tradition are forged and made compelling. In particular,
    the ancestral ideals so important in popular commentary on the ritual tradition
    are given an experiential depth. On a practical level, there are important functional
    linkages between ritual and other social practices that recreate a social environment
    in which elevated idioms appear consonant with the general order of social life.
    It is above all in the village, in other words, that Tengger come to regard the
    priestly tradition as a popular heritage. The imprint of ritual ideas reveals
    other lessons as well, however, lessons which suggest that in preserving its popular
    role, the ritual tradition may have acquired new meanings and neglected earlier
    ones.


    # Settlement as Adaptation and Symbol


    The political instability that plagued the Tengger region through the end of the
    eighteenth century (Chapter 2) played an important role in the location of old
    settlement sites. Villages founded prior to the territory’s pacification still
    tend to be situated on hillsides and valley walls, high above the fields cultivate,
    and often un distant from the springs to which they go for water. Old settlements
    are also densely nucleated. Houses are separated by only a few feet, with no'
