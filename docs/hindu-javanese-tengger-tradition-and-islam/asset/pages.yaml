    # Reading Ritual Form


    There is nothing like it, this third day of the entas-entas purification. No other
    rite rivals the complexity of its prayers, the scale of its offerings, or the
    drama of its performance. The billowing incense smoke, the priest''s melodic incantation,
    the gamelan accompaniment, the density of offerings—all these have their counterpart
    in Tengger rites, but never with such an explosion of imagery and detail. The
    richness of that detail alone is sufficient to indicate that, whatever its precise
    meaning, something very important is occurring in the entas-entas. What that,
    however, is not an issue on which Tengger agree. With so many of its core rites,
    the inconsistency of which is the subject of conflicting interpretations suggests
    once again that the cultural meaning attributed to a rite is not determined in
    any simple way by the verbal and gestural symbolism embodied in ritual ceremony.


    At most general level of conception, on the spiritual purpose of an entas-entas.
    The first, espoused in villages of southern and northeastern Tengger, suggests
    that the rite must be performed by a soul or group of souls to achieve final peace
    in heaven (khayangangan). Without the rite''s performance, a soul is condemned
    to wander endlessly forever, lacking a secure resting spot in the afterlife and
    thus bothering those of its living descendants who should have insured the spirit''s
    purification and ascent into heaven. According to this view, in short, all of
    the dead must be purified in an entas-entas; hence if a family is too poor to
    sponsor the ceremony, it is supposed to make arrangements with relatives so that
    the souls of its relatives can be purified by incorporation in someone else''s
    ceremony.


    The second opinion as to the purpose of the entas-entas, espoused almost exclusively
    in villages of the Tengger northwest, insists that for fear from being a spiritual
    obligation upon all families, the rite need not be, and should, performed by those
    villagers sufficiently affluent to afford its substantial expense. The whole point
    of the ritual, according to this view, is to pay homage to one''s family elders,
    giving them the ritual attention that they gave their children and relatives when
