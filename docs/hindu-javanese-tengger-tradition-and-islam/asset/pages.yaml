  md: '# ISLAMIZATION AND REFORM


    Tengger, for example, may never have been a politically autonomous “traditional”
    society, and its religion was never merely “local.” Originating in a dialogue
    with Java’s earlier Indic community, and later molded by the challenge of Islam,
    Tengger religion, like so many in modern world history, fits neither of the two
    ideal types. Like other religious traditions nurtured at the margins of larger
    societies, it is something else, and can only be understood by recognizing the
    formative importance of its interaction with the society. Tengger has always been
    much part of Java.


    The development of Tengger religious culture illustrates how many of the dynamics
    of religious change in Java as a whole. The collapse of the island’s Hindu-Buddhist
    states destroyed the political foundation for what had once been the islandwide
    Hindu religious community. Tengger had been part of that community, and its tradition
    quite clearly shows that at the Sivaite-Hindu community had its roots into the
    countryside (see Appendix). In the centuries following Majapahit’s collapse, Java’s
    Hindu-Buddhist ecclesiastical communities slowly disappeared. Their sources of
    cult patronage were eliminated, and so too were many of the literary and aesthetic
    traditions upon which the cultural intelligibility of their appeals depended.
    Elements of the Indic heritage survived, of course, and particularly in isolated
    areas of the Eastern Salient, some might appear to have continued operating right
    up to the present century. Moreover, throughout Islamic Java, village traditions
    preserved cults of ancestors and territorial spirits, a religious cosmology consonant
    with the political realities of a loosely integrated rural society and with the
    practical preoccupations of peasantry. The exemplary influence of Java’s courts,
    regional and inland commerce, and the growth of the Islamic community itself,
    however, all created the social foundation for a less parochial religious tradition,
    and thus nurtured the continuing growth of Islam. These developments climaxed
    in the nineteenth century, when colonial penetration, the demise of the traditional
    aristocracy, and improved communications with the rest of the Islamic world (Kartodirdjo
    1972; Ricklefs 1981) created the conditions for the construction of a new national
    identity, which is a key term. From the perspective of the Tengger mountains,
    there can be no doubt that one of the most important processes of the past century
    has been the uneven but powerfully continuous Islamization of vast areas of Java’s
    countryside.


    Although its social organization was primarily anchored in the village, it is
    important to remember that the cultural appeal of Tengger religion was never purely
    local. It thus sought to identify with a religious com-'
