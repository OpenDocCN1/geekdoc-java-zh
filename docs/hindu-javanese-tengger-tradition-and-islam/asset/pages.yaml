    The structure is not really a temple—it has no altar, statues, or interior decoration,
    and it is only large enough to accommodate the village priest, his assistants,
    and a ritual witness or two. During village rites (in communities that use all),
    the priest performs services inside the structure, while the women who bear offerings
    to the ceremony stand outside, out of sight and sound of the priest’s celebration.
    Religious architecture thus replicates social hierarchy. Since men do not carry
    ritual offerings in Tengger, they usually do not attend these village ceremonies
    at all, except in communities influenced by Hindu reform.


    There is thus in the layout of the village that might provide a clue to its religious
    tradition. At a less visible level, however, clues exist, particularly in a variety
    of things that repeatedly seem to turn the attention of the community toward Mt.
    Bromo. Such an orientation is evident, for example, in the open-sided ancestral
    shrine known as the *sanggar* (“place of worship.”) not to be confused with the
    *sanggar pagamujan*. The primary purpose of this shrine is to serve as a touchdown
    for guardian spirits invoked to the village. From this perspective, the shrine
    functions much like a Balinese temple (*pura*) (see Belo 1953:2). In appearance,
    however, there is little similarity between the two. The Tengger shrine is a natural
    setting, little reworked, with none of the *pura*’s sculpture, columns, walls,
    or pavilions. It is just a small, open-air yard located at the base of several
    large trees, with a small offering made of wood at its center. The Tengger shrine
    is virtually indistinguishable from similar shrines (*danyang, sanggar*) found
    throughout rural Java, usually dedicated to village ancestors or territorial shrines
    (C. Geertz 1960:26).


