  md: '# INTRODUCTION


    The "ethnic isolation" explanation of Tengger tradition, however, fails to take
    seriously Tengger claims that their tradition is Javanese, and ignores historical
    evidence that clearly indicates that Tengger have long been affected by developments
    in larger Java. Under closer scrutiny, the ritual tradition can provide provid
    insight into the social organization of at least one popular tradition in pre-Islamic
    Java. In particular, the Tengger example clearly indicates that by Majapahit time
    forms of Sivaism had their roots deep into at least certain areas of the Javanese
    countryside. Investigation of the same tradition, however, reveals how profoundly
    it has been affected by the challenge of Javanese Islam. Although the ritual tradition
    Tengger is preserved unto within this mountain region, the cultural conditions
    to which it has responded are similar to in many areas of rural Java, particularly
    those in the extreme eastern portion of the island (Chapter 2). From this perspective,
    the Tengger story is not that of an isolated ethnic group affected by developments
    in larger Java. It speaks to developments that have transformed all of Javanese
    society, and are reworking it still today.


    My point of departure in the chapters that follow is the world of contemporary
    Tengger. Where there is historical analysis, it begins through investigation of
    the cultural present. While attempting to avoid the speculative errors that have
    plagued many analyses of Tengger tradition, I have nonetheless relied on historical
    information throughout this work, and regard it as a vital element in any effort
    to understand the ethnographic present. This method is related in part to the
    "genetic" theoretical approach I have found useful in organizing my investigation,
    which I discuss below. The method is also inspired by my sense that Tengger are
    themselves intensely preoccupied with the image of their past, and draw heavily
    on it in formulating their present definition of self. In the general sense, I
    should note, I have written this work as an anthropologist speaking to them and
    others who share an interest in Java''s rich cultural heritage, and the processes
    shaping its redefinition today.


    # Cultural Reproduction


    The problems involved in understanding Tengger tradition and identity begin as
    soon as we attempt to define the social character of this population. The Tengger
    region is not a self-contained political entity, and probably has not for most
    of its history. According to the conventional categories of social anthropology
    (Nadel 1951:87; Leach 1954:5), therefore, Tengger should not be regarded as a
    distinct "society." Similarly, if we take as our primary criterion the categories
    of ascription'
