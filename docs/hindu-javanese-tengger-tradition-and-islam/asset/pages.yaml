  md: '# INTRODUCTION


    such diverse opinion among Muslim Javanese, and why they should be considered
    culturally distinct.

    Other excursions that summer and nineteen months of ethnographic research (December
    1978 to July 1980) helped me to understand better what Tengger are, why their
    identity is so problematic, and what their tradition reveals aboutavanese religious
    history and culture. By their own account, Tengger is neither a primitive tribe
    nor an ethnic group distinct from other Javanese. Like others they call themselves
    “Javanese people”(wong jawa). Only on certain occasions theyify identification
    by also referring to themselves as “Tengger people”(wong tanger). According to
    their folk traditions, Tengger are descendants of non-Islamic Javanese who fled
    to the mountains above Majapahit, the last major Hindu-Buddhist kingdom in Java,
    when that court fell to Islamic forces from neighboring principalities at the
    beginning of the sixteenth century. They fled, it is said, so to preserve a religion
    called agama Buda (Buddhist religion). More recently, many Teng identified this
    religious tradition as agama Hindu (Hindu religion).


    Majapahit’s collapse marked a turning point in Javanese cultural history. The
    kingdom was the island’s last influential Hindu-Buddhist state, and was thus a
    long line of Indic principalities, over a thousand-year period, had propagated
    Southeast Asian variants of Sivaism and Buddhism on the island. After Majapahit’s
    fall, several small Hindu-Buddhist courts in the extreme east of the island (across
    the straits from Bali) survived into the eighteenth century (Geraud1967:1; Ricklefs1981.96).
    These had little influence, however, on developments in Java’s cultural heartland.
    There Majapahit’s successors preserved much of the political pomp and ceremony
    of the pre-Islamic courts, and cultivated an aesthetic and mystical tradition
    strongly influenced by the earlier civilization (Pigeaud1967:18; Reefs1979:110).
    Whatever the Indic traps of these later courts, the fact remains that Majapahit’s
    demise ultimately resulted in the dismantling of the island’s once extensive of
    Hindu-Buddhist communities. A portion of that community’s elite fled with Hindu
    Javanese nobility to the neighboring island of Bali, which preserved a Hindu tradition
    to the present day (Covarrias1937; Hooyakas1977). Java itself, however, all conspicuous
    non-Islamic clerical disappeared.


    It is difficult to say what immediate impact Majapahit’s fall had on popular religious
    organization in Java. The countryside had probably always been unevenly influenced
    by the Indic fashions of the courts. Even at the height of Majapahit’s glory,
    for example, rural social or-'
