    a familiar blend of communitarianism and hierarchy. The communitarian side, the
    one to which villagers most consistently refer, every household is expected to
    contribute offerings to the performance, and everyone benefits from the spiritual
    blessing. Villagers also emphasize the egalitarian nature of ater-ater exchange.
    Unlike the more common pattern of the lowlands, elders give food gifts to youths
    and to elders, in no particular order of precedence. Similarly, each household
    is enjoined to exchange food gifts with all of its neighbors, regardless of wealth
