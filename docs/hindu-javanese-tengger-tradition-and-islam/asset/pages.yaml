    \ deities and chthonic powers is great. . . Probably the mandala people . . .\
    \ men, women, and children, a rule living in remote districts in the wooded hills\
    \ of the interior of the country, engaged in agriculture. . . . Their being mentioned\
    \ together with jangasans . . is suggestive of a close connection with the common\
    \ agriculturalists.\n\nWhether the priests and people of the Mt. Bromo region\
    \ lived in mandala communities or not, a similar integration of religious specialists\
    \ in rural communities may very well existed in Old Tengger.\n\nThis historical\
    \ speculation can be used to raise general questions concerning the changing historical\
    \ roles of the Tengger and Balinese resi. Viewed from the perspective of their\
    \ prayers, both are celebrants of some popular role of Sivaite worship. They differ\
    \ not so much in the contents of their liturgy as in popular conception of their\
    \ roles. The Balinese resi, quite simply, is low in the peasantry hierarchy, whereas\
    \ the Tengger priest has come to be identified as the preeminent celebrant of\
    \ a whole people's ritual tradition. This contrast summarizes a larger world of\
    \ differences related to the social development of Indic tradition in popular\
    \ Java and Bali. The Balinese resi's status is respect of developments and all\
    \ other priestly roles have been defined by the push and pull of court hegemony.\
    \ The courts set the standards by which ritual is assessed, and noncourly ritual\
    \ is defined as inferior to that of court \"exemplary centers.\" The courts have\
    \ their special priests, as well, the pedanda, through whom they celebrate \"\
    stupendous ceremonies, tooth fillings, temple dedications, pilgrages, and blood\
    \ sacrifices, mobilizing hundreds and thousands of people and great quantities\
    \ of wealth\" (C. Geertz 1980:13). The process, as Geertz notes, sustains a political\
    \ hierarchy and reproduces the orders of its prominence. The pedanda sits to the\
    \ side of the court, and his court role sets standards of exemplarity for all\
    \ the realm. Pedanda not only officiate the island's most prestigious ceremonies,\
    \ but also trace their descent back to Javanese Majahit, spend years obscure Sanskrit\
    \ texts, and, in short, outcelebrate all types of ritual celebrants on this little\
    \ island. This, of course, is the key to the resi bujangga's low ritual status.\
    \ It is the brilliance of high-caste pedanda, not the contents of the resi's prayers,\
    \ which ensures that in the presence of pedanda the resi bujangga is identified\
    \ as a netherworld specialist. But \"one should not be astonished\""
