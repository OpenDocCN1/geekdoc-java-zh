    festival. The first is also known as sumbangan, although it is recognized as an
    entirely different type of exchange than the sumbangan discussed above. Betek
    and sinoman festival laborers claim that they are "em-barrassaed" (isin) to come
    "empty-handed", even if they have already made a formal sumbangan contribution
    to the sponsors. Hence women always arrive bearing a few additional kilograms
    of sugar or rice, whereas men bring a carton or two of good quality cigarettes.
    Although the total value of such goods be substantial (averaging from one to three
    dollars per person), they are not recorded in a notebook. They are received free
    gifts, given "voluntarily" (sukarela) rather than with an eye to ritual investment.


    There is, however, another form of exchange, which the formal sumbangan discussed
    earlier, is recorded in a notebook, although the social restrictions on it are
    less complex than those surrounding the sumbangan. This exchange, as the bowo,
    always takes the form of a cash payment made by the guest to the host during the
    course of a festival. Variants of the bowo are found throughout Java (see Geertz
    1960:66; Jay 1969:218), although the exact terms of reciprocity vary. In the most
    common pattern, a male guest at the end of a slametan meal discreetly hands an
    envelope containing money to the host. This is intended to help defray the costs
    of the slametan, and will be repaid with a similar amount of money whenever the
    guest hosts a slametan festival. The Tengger bowo differs from this pattern in
    several keys, is repaid by both male and female guests. More importantly, it is
    made in full view of other guests, usually at a table where friends of the festival
    host sit the name of the donor, or his or her village of residence, and the amount
    given.


    Bowo relationships are not really recognized social alliances like the formal
    sumbangan exchange. The surplus need not returned when the bowo is repaid, the
    relationship need not be perpetuated. Bowo partners are not identified as "siblings"
    in the same fashion as banging partners are. Bowo-ing, in words, is more a basic
    responsibility than it is a formal mechanism of social alliance. No guest to a
    festival with bowo would dare of leaving without paying. A host may, refuse bowo
    payments, particularly where he considers his meal too small to merit bowo (which,
    in theory, is supposed to help defray the costs of the meal), or if he does not
    want to incur bowo debts himself. The exact amount individual gives varies according
    to one''s social status, relationship to the festival sponsors, and elaborateness
    of the event itself. Guests always pay a larger bowo if a bull has been slaughtered
    to provide meat, and larger yet if there is some form of entertainment such as
    dancing or theater.'
