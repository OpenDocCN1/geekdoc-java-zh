    of these rites throughout the Tengger region provides strong testimony to the
    historical integrity of the tradition and its religious social foundation. The
    complex of rites is found in no other area of modern Java. Indeed, in Islamizing
    Buda communities, one of the first steps taken toward Islamization is inevitably
    the dismantling of this Tengger ceremonial complex and its replacement with village
    rites deemed more appropriately "Javanese" (Chapter 11).'
