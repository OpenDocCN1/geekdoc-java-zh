    A *japa* is thus not just words, but a conjunction of spiritually efficacious
    words and actions. A liturgy is, in effect, a sequence of *japa*; the most familiar
    such sequence is of incense announcement, invocation, purification, and obeisance,
    seen at the beginning of most rites.⁵


    The prayers used in such a ritual sequence more or less invariant from rite to
    rite, with the exception of one short passage in the incense announcement by which
    the priest mentions the date of the rite and the names of his sponsors. Only after
    completing this opening prayer sequence can priest turn to the prayers for the
    particular ritual event at hand, such as blessing a newborn, marrying a couple,
    or purifying the dead. Each of these ritual labors, in turn, has its own sequence
    of *japa*.


