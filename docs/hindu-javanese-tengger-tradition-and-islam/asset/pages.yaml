    # The End of Buda: The Besuki Example


    Besuki (a pseudonym) is a community of 3,000 people living in rolling foothills
    30 kilometers to the city of Malang, and about 12 kilometers from the nearest,
    higher-lying Tengger community. Besuki has been an important drop-off point for
    Tengger produce since the end of the last century, and until the 1950s it had
    a substantial Buda community with strong ties to Tengger. Indeed, up the first
    decades of the twentieth century, many Besuki referred to themselves as Tengger.
    Since the early nineteenth century, however, there had also a large number of
    Madurese and Javanese Muslims residing in the community, who were more reluctant
    to identify themselves fully with the customs of the region. Temperate climate,
    an altitude (900 meters) well suited for cultivation of commercial crops, and
    proximity to major markets all combined to make Besuki an attractive frontier
    area for immigrants from Central and East Java. According to village legend, the
    first founders of the village were a man from Central Java and a woman from Tengger,
    of whom arrived in the village at the end of the eighteenth century. The man brought
    a water buffalo and the woman Tengger potatoes. From its beginning, therefore,
    Besuki was identified as a mixture of uplands and lowlands, the Tengger element


