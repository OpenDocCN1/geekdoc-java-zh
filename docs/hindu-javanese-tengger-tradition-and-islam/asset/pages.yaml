    It would be a serious error, then, to assume that myth is an accurate reflection
    of what people really know. We risk impoverishing our understanding of people
    if we directly equate the truths of a myth or ideology with their thought, or
    the actual content of their knowledge. Clearly all of these things are related,
    but the relation is far more complex than some analyses of myth might suggest.
    Important reason for this is the constraints to which myth responds are quite
    different, and more sociohistorical, than those that depict the formalized, and
    less conscious, processes of a person. Accounts like the Kasada tale are intended
    to be public documents. They serve a practical function in public culture as landmarks
    for public discussion and as guides for collective self-definition. They are subject
    to a rigorous process of evaluation and social control. Inevitably, people understand
    much more than elevated to prominence in this fashion. Why should the Kasada tale
    have emphasized the themes of ancestry and territory while ignoring each publicly
    revealed detail of priestly rite? The answer to this question requires that we
    investigate more than the internal structure of a cultural discourse. The discourse
    is informed by history and social dialogue to cultural politics. It must be understood
    as situated speech, parole, not as a timeless system of rules, a langue.


