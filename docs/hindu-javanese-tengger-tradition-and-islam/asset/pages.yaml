    There is a subtle cultural message implicit in the division of ritual labor between
    priests and their assistants. Priests prepare offerings, announce no ritual events,
    and do not even carry their ritual implements outside of the liturgy itself. They
    leave the care and feeding of family spirits, invoked in liturgy, to the ritual
    elder. Ritual is thus organized in a way which suggests the priest’s job is to
    attend guardian duties, while his assistants busy themselves with the technical
    trivia of ritual preparation and the entertainment of family spirits. As in other
    aspects of ritual tradition, the division of ritual places guardian deities above
    other spirits, and identifies the priest as the sole person qualified to act as
    their ritual mediator.


