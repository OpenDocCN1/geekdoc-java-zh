  md: '# INTRODUCTION


    ganization does not appear to have greatly influenced by caste concepts. In courtly
    literature, the notion of caste was not used in a fashion consistent with Indian
    usage (Pigeaud 1962:IV:468). Literature from the fourteenth century suggests that
    the countryside had a pattern of social organization, with communities of freeholding
    peasants standing adjacent to villages of indentured bondmen, monastic communities
    of Buddhist and Siamese clergy, and perhaps several regions of semi-autonomous
    tribes (Pigeaud 1962:IV:472). Some of the more isolated non-Islamic religious
    communities may have survived into the eighteenth century (Pigeaud 1967:I:54;
    Schrieke 1955:II:336). Dutch colonialism, religious migration, and the rise of
    a revitalized Islam, however, would eventually sweep these aside. The resi, baru,
    biku, and other priestly specialists of popular Javanese Hindu-Buddhism disappeared
    in a progressively Islamizing countryside.


    This historical background helps to underscore the peculiarity of Tengger tradition
    in modern Java. Five centuries after Majapahit’s fall, Tengger are the only Javanese
    people to have preserved a regionally based, explicitly non-Islamic tradition.
    Each year from the region gather at the base of a volcano located at the center
    of the highlands to take part in a ceremony established by the ancestors who fled
    Majapahit’ collapse (see Chapter 3). During the second month each year, Tengger
    villages in addition celebrate an annual festival intended to bless sacred dualities
    as land and water, earth and sky, male and female, and according to some, Buda
    and Islam (Chapters 5, 6). Rites of life passage in Tengger are also celebrated
    in a non-Islamic fashion, and show strong resemblance to popular ritual in Hindu
    Bali (Chapters 7, 8).


    What distinguishes these rites from those celebrated by kejavan Muslims is the
    fact that Tengger ceremony is always built around formal


