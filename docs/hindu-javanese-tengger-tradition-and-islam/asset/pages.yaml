    From the colonial government''s perspective, the coffee crop was enormously attractive.
    It could grow in Java''s extensive mountain highlands, where water was often insufficient
    for irrigation agriculture and population still. In theory, its cultivation did
    not interfere with food crops, and it made accessible a previously underdeveloped
    ecological niche. Other hill crops such as tea, pepper, and indigo were also introduced
    into highland areas like Tengger, but none achieved the spectacular success of
    coffee. Suddenly, the Dutch once regarded as Java''s mountain “waste lands” offered
    unlimited opportunities—as long as sufficient numbers of workers could be induced
