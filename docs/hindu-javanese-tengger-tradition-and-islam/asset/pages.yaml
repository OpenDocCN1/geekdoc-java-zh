    # Symbolism and the Work of Interpretation


    The expressive power of ritual symbolism has been a popular theme in anthropological
    study of religion. Clifford Geertz, for example, writes that ritual symbols “sum
    up . . . what is known about the world is, the quality of the emotional life it
    supports, and the way one ought to behave in it” (C. Geertz 1973b:127). He characterizes
    the religious perspective in terms of commitment and faith, arguing that “the
    acceptance of authority that underlies the religious perspective that the ritual
    embodies from the enactment of ritual itself” (C. Geertz 1973a:113). Other anthropologists
    have similarly suggested that ritual performances “dramatize basic assumptions
    of fact and value in the culture . . . shaping actors in such a way that they
    wind up appropriating cultural meaning as personally held orientations” (Ortner
    1978:2, 5).


    In the chapters that follow, I have found it useful to examine rituals as cultural
    performance, and to investigate their cultural status as objects of knowledge.
    The fact that the same rituals here in Tengger appear to mean different things
    to different people, however, raises serious questions as how ritual symbolism
    acquires the expressive force attributed to it, and in what way it, in fact, meaningful.
    At issue here are fundamental questions as to the nature of what we sometimes
    all casually refer to as “cultural knowledge.”


    The lack of integration between liturgy and popular commentary is, in fact, more
    complicated than it appears at first sight. Although public commentaries (especially
    myth) sound generally consistent with the religious idioms of kejavan Java, in
    private discussion many villagers are more circumspect. They readily acknowledge
    that more occurs in ritual performances than is explained in myth or popular comment.
    The liturgy, they, contains truths so powerful to be apprehended by any but the
    most spiritually adept. In private conversation, some villagers also feel a better
    understanding of the liturgy than is ever expressed in mystic text. More is seen
    and in rite than is ever acknowledged in public discourse.


