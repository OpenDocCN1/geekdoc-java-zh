  md: '# INTRODUCTION


    Friends in Malang provided me with conflicting reports as to what I should expect
    to see in Tengger. Several university acquaintances commented that Tengger were
    backward, suspicious of outsiders, and from the perspective of Java’s cultural
    history, insignificant, since they had no courts, distinctive art, or literature.
    Other people in the Malang area said that Tengger were "still primitive." They
    worship rocks, trees, and evil spirits, one university student noted, and are
    barely able to speak Javanese. Another friend warned me that the spirits of the
    Tengger region are dangerous, and advised me to wear a Christian religious medallion.
    "The spirits are helpless if they see you a Muslim or Christian." They youths
    in Malang neighborhood who claimed to have attended the annual Tengger festival
    at the base of the Bromo volcano provided even stranger information. Tengger,
    they insisted, threw live animals into the volcano’s smoldering crater.


    Other lowlanders with whom I spoke, however, adopted a rather different attitude
    toward Tengger. In a market town just below the Tengger highlands, a woman rice
    trader explained that Tengger are "good people, honest, and straightforward, as
    all Javanese were, but no longer." On hearing that I was traveling to the highlands,
    an urban floor in a bus station in the north city of Probolinggo asked me to make
    a similar evaluation."Their religion," he confessed, "is the original religion
    (agama asli) of Java. It is like that in which I secretly believe. But I live
    here among the Muslims and do nothing.


    Braced, for an excursion into the exotic, I left Malang one clear morning headed
    for the village of Bubuklahak, a non-Tengger


