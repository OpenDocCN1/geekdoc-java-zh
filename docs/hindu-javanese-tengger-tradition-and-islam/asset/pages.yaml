    intuitions developed in a socialization larger than the cultural performance itself.
    In our effort to understand the significance of a tradition, therefore, there
    can be no detour around society or history. Differences of social position, biography,
    and cognition affect all people''s experience. Rather than ignoring these things
    by collapsing them under a single concept of stereotyped meaning, our task is
    to disentangle, and learn more of their complexity by attending to the contingencies
    of their social genesis. We need not despair in the face of such a task, or throw
    our hands up at the impossibility of penetrating other minds. Thought may not
