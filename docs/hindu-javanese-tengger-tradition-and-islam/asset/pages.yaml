    These and other figures indicate that there are real socioeconomic inequalities
    in Tengger communities, and that these inequalities have a noticeable impact on
    patterns of welfare and social life. Political and economic developments that
    transform the social character of the Tengger community could, at some point,
    undermine the communitarian appeal of this popular tradition. Radical social inequality
    could make the kinship idiom of village life an empty slogan. The question here
    is not simply economic: it is cultural and moral as well, having to do with the
    way in which economic realities are popularly perceived and constrained by generalized
    notions of property and the public good.


    For modern Tengger this is an important but difficult issue, because much evidence
    indicates that Tengger society today is in the midst of profound economic, social,
    and moral readjustments. I discuss some of the more general changes in Chapters
    10 and 11. For the moment, I focus on the more traditional economic scheme, at
    the time of my research, was still operativeative of Tengger, and even where it
    is not, forms the background to present-day developments. What I am particularly
    concerned with here is the “moral economy” (Scott 1976) of Tengger economic life,
    the way in which economic production, consumption, and distribution are influenced
    by local social arrangements, and cultural notions as to the proper uses of wealth.
    The cultural contours of this moral economy, I should note, differ from those
    sometimes postulated for other areas of Southeast Asia, including lowland Java.
    In particular, the moral constraints on economic activity here are not concerned
    with the provision of “subsistence guarantees” (Scott 1976) as such, but with
    the movement of wealth into socially sanctioned ritual spheres. The remainder
    of this chapter I will focus on this problem in relation to labor relations of
    production; in Chapter 10 I will return to the problem of consumption. In both
    domains one sees a complex of economic, ritual, and social activity that is at
    the heart of the priestly tradition’s practical role, and resilience, in the life
    of these mountain communities.


