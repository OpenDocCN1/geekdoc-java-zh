    LIFE PASSAGE AND RITUAL


    Until recently, the household was the only corporate social group operating within
    the Tengger village, and slametans celebrating the birth, growth, and life passage
    of its members were the only organized ritual activities besides those of the
    village itself. New corporate groups have been introduced into the village since
    Indonesian independence—scout clubs, farmers’ co-ops, and the like—and now on
    this occasion they may sponsor ritual events. The Hindu reform movement has, in
    addition, sought to develop more congregational models of worship less immediately
    dependent on household and village socioeconomic organization. Prior to these
    innovations, however ritual activity in the Tengger community occurred only if
    sponsored by some body, and only the village as a whole or individual households
    ever acted as ritual sponsors. Sponsorship of household rituals was in turn, linked
    to the rhythms of the household and family cycle.


    In terms of spiritual intent, the distinction between village and household slametans
    is only relative. They use many of the same sajenan offerings, and thus in theory,
    fulfill many of the same spiritual events: blessing village lands, ensuring the
    abundant flow of water, guarding the welfare of the people. The priest begins
    with kind of rites, moreover, with much the same prayer of announcement and invocation,
    securing the blessing of the village as before he mentions the concerns of any
    single household or individual sponsor. In ritual, private interest and public
    welfare are always linked. The reality of this ritual is Tengger commentary on
    the moral importance of the ritual tradition.


    There are various household rites, ranging in scale from simple-minute services
    involving the presentation of a single sajenan offering, to three-, four-, or
    five-day events involving dozens of offerings, hundreds of guests, elaborate fasting,
    and entertainment. The large events run rural hamlets into veritable towns, attracting
    visitors from distant villages and peddlers hauling their goods from lowland cities.
    The scale ultimately depends on the nature of the ritual and the financial means
    of the sponsoring household (Chapter 10). The type of ritual performed, of course,
    depends upon the nature of the ritual task at hand. The core life-passage rites
    are celebrated by most Tengger households, but beyond these there are rarer and
    more specialized ritual events. There'
