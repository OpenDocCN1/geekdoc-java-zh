    one that marks an individual''s passage into adult social life and the most esteemed
    of adult social activities, ritual festivity. Not to engage in such exchange is,
    in effect, to isolate oneself from village social life, and to risk remaining
    a social juvenile.



    The relationship established between exchange partners is strictly dyadic. Each
    relationship has its own history, and each individual has his or her own list
    of exchange partners. Even spouses may keep separate records of their exchange
    partners, although this practice is less common among couples long married. Each
    instance of exchange is fairly recorded in the recipient''s *sumbangan* book.
    In places where few people own books or magazines, the ancient villagers tell
    nothing less than amazing. Books are organized like an accountant''s ledger, columns
    for the name of each donor, his village of residence, the item given, and (in
    some cases) its equivalent cash value. When money is received, the account is
    recorded in kilograms of rice—and sometimes into equivalent value in terms—an
    accounting practiced to provide checks against inflation, in which of modern Indonesia''s
    history has rendered a very unstable standard of value. At the completion of a
    festival, a host usually examines his records of gift earlier to exchange partners,
    he recalculates his new debt by subtracting the value of the earlier gift from
    that just received, leaving the amount now owed to the exchange partner. Illiterate
    villagers often have this done by a relative, friend, or the village school teacher.



    As described thus far, this ritual credit system is similar to that seen in other
    areas of Java where the *slametan* tradition is strong. Several additional features
    of the work distinguish it from its lowland counterparts. First, the amount returned
    for an earlier gift is always supposed to exceed the value of that contribution.
    If I, for example, were to give 50 kilograms of rice to an individual, who would
    later return payment on that gift with 50 kilograms plus an additional 20 or 30,
    or some other item in excess of the original gift''s value. This surplus return
    on the earlier payment is not interest on a loan, with a new gift, designed to
    keep the exchange relationship open. Villagers insist that "slingship of the exchange
    must not be broken." To make payments in a tie-for-tat fashion is a serious affront
    to the good faith of exchange partners, for it suggests that one no longer wishes
    to maintain the social relationship that exchange partnership ideally entails.
    Only in old age is it proper to close exchange relationships, after one''s children
    are married and one can thus retire from the bustling camaraderie of *slametan*
    festivity.



