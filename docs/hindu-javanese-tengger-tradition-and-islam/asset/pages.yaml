    in part results from the fact that reform Islam tends to regard all spirits not
    explicitly recognized in Islam as devils adopted by all or the majority of Javanese,
    but it has helped to cast further doubt the legitimacy of dukuns and the spirits
    to which they appeal.


    A general lack of ambivalence distinguishes the role of Tengger priest from that
    of the similarly lacked dukun. The Tengger dukun deals with shady spirits peripheral
    to religion, but with spirit popularly regarded as the very progenitors of society.
    The priest is initiated into his role not behind closed, but in front of thousands
    of fellow Tengger during the Kasada ceremonies at Mt. Bromo. His ritual authority
    is, in turn, much less a personal matter, and more product of his training in
    a ritual tradition without any single individual with Tengger society as a whole.
    There are other indices of the Tengger priest’s ritual preeminence and the lack
    of ambivalence surrounding his role. During the seventh month (wulan kapitu) of
    his calendar year, for example, the priest (sometimes accompanied by a assistant
    and a few other villagers) withdraws from social interaction, refrains from sexual
    intercourse, and purifies his body, so as to renew his ability to recite jumpa-mantra
    prayers. He fasts during certain days of the month, and on others eats only white
    foods such as rice or maize meal. Here again people explain the priest’s role,
    and the necessity of his spiritual regimen, “represents” the village before the
    gods. It is he who masters the language with which they can be addressed, and
