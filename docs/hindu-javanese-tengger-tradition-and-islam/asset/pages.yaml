    have often not bothered to ask how social actors experience sacred texts.⁵

    Many scholars have provided us with fine translations of religious documents from
    other societies. But they have often been less capable of indicating to what degree
    such translations correspond to the actual experience of members of that religious
    community in which the religious texts are employed. The philological approach
    to sacred literature makes good sense when one is primarily concerned with tracing
    the historical diffusion of religious traditions over wide social territories.
    This, for example, is one of the important concerns of Dutch pilgrims in Bali,
    where scholars have been rightfully curious to know how much Balinese literature
    can be traced back to an Indian counterpart. If our concern is with the way in
    which actors make sense of religious texts, however, our analysis cannot be restricted
    to textual reconstruction or linear translation. This is particularly true in
    such a context as Tengger, where the tradition is designed to be invehiled in
    oral performances to suit social pragmatics much more complex than an individual''s
    reading of a text. All of this throws into doubt any assumption that the meaning
    of prayer texts is the same for all actors, and reducible to simple translation.


