    # The Sumbangan Ritual Exchange System


    No Tengger institution clearly expresses the curious mix of egalitarian idioms
    and practical hierarchy of Tengger communities as the ritual exchange system (sumbangan,
    gentenan). The system serves to reduce economic differentiation within the village
    while at the same time enhancing status inequality. In supplying the capital for
    ritual festivals, it liberates social relationships, drawing villagers into a
    cycle of giving and receiving at the heart of village social interaction and the
    ritual tradition alike.


    The principles upon which the exchange system is based are consistent throughout
    the villages of the Tengger region. Just prior to marriage, young men and women
    begin to give gifts of money and goods to relatives and friends sponsoring slametan
    festivals. After marriage, a couple gradually expands its network of sumbangan
    partners, in preparation for the time that the couple too will sponsor festivities.
    Gifts are often solicited by ritual sponsors, usually at the same time that the
    sponsors invite a man and a woman to work as laborers at the upcoming ritual festival.
    Other times, however, a couple takes the initiative in the exchange by sending
    unsolicited gifts of goods or money to the home of ritual sponsors prior to a
    major festival. Engaging in such sumbangan exchange is a basic social responsibility,'
