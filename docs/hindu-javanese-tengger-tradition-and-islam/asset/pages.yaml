    guidance, an unqualified student exposed to ngelmu risks mental disorder or physical
    harm.


    In part of the exclusive manner in which it is imparted, and in part of the shady
    character of the spirit forces with which it is associated, many Javanese regard
    ngelmu and its dukun practitioners with deep suspicion, and at least in some instances,
    ever contempt. Clifford Geertz has noted that there is a widespread belief that
    dukuns "inevitably die a violent death" (1960-95). Many dukuns refuse to be referred
    to as duknis precisely because of the ambivalence surrounding the role. The degree
    of such ambivalence, however, varies significantly according to the specific skill
    a dukun is thought to have mastered. Masseurs and herbalists, for example, tend
    to be regarded as technical experts more than magical occultists. Some may chant
    a phrase or two as they go about their business, but in general their ilmu is
    largely practical, of the visible world rather than the occult. These dukuns excuse
    little antipathy. The Javanese midwife (dukun bayi, see Chapter 7) is also a technical
    expert, performing services related to pre- and post-natal care; hence she attracts
    relatively little suspicion. Traditionally, however, many Javanese midwives recited
    spells and prayers during various phases of their work. This aspect of the midwife’s
    role has come to be regarded by at least modern Muslims with a good deal more
    ambivalence, since many of the most commonly recited prayers address spirits of
    the body, earth, and as not recognized in Islam. As a result of this tension,
    modern village leaders in Muslim communities to the west of the Tengger highlands
    have in recent years sought to reeducate Javanese midwives and provide services
    of non-Islamic prayer.


    Dukun involved in magic, curing, mediumship, and sorcery tend to be regarded most
    ambivalent. As Clifford Geertz has noted (1960-96), this tension is in part a
    product of the inevitability of the dukun-patient relationship. The patient is
    dependent upon the dukun, yet uncertain of the outcome of the interaction. Given
    the secrecy that surrounds the utilized by these dukuns, the status of the dukun’s
    powers is itself a potential source of anxiety for the patient. The most powerful
    of dukuns are often thought to interact “both with God and with devils . . . engaging
    in devout supplications to a high God and in dubious contracts with less elevated
    spirits’'
