    RITUAL FORM AND MEANING:

    THE ENTAS-ENTAS PURIFICATION


    As with so much of their ritual tradition, when asked by outsiders the purpose
    of the *entas-entas* ritual, Tengger almost invariably respond by identifying
    it with a lowland Javanese rite. An *entas-entas*, they comment, is a *newuyu*,
    which is to say, a commemorative *kenduren* prayer meal held one thousand days
    after an individual’s death. Whatever the strategic intent of such a comment,
    the fact is that all but the most general sense the parallels between a *newuyu*
    and an *entas-entas* are rather restricted. An *entas-entas* is, to be sure, a
    post-mortem ritual, but its form and meaning are very different from that of the
    *newuyu*. In Old Javanese and Tengger dialect, the word *entas* means to go upward
    or ascend.¹ The Tengger *entas-serves* does not simply to commemorate the death,
    but to aid in their prayer to heaven. The rite remembers not a single individual,
    but the collective dead of a family. It is held, therefore, not one thousand days
    after an individual’s death, but whenever an adult family has amassed the substantial
    capital required to sponsor this ritual and its extensive festivities. The ceremony
    is organized, finally, not around a *kenduren* prayer meal, but around what are
    the most complex and powerful of the Tengger priest’s liturgies. Its prayers are
    the longest, its offerings the most abundant, and its ritual the most powerful
    of any household ritual performed by a priest. No other ceremony so exhaustively
    reveals the phases of Tengger tradition and its differences with lowland ritual
    tradition.


    All of the interpretive tensions of Tengger ritual tradition are prominent here,
    as well. The ancestral bias of popular cosmology, the lack of integration between
    priestly liturgy and popular myth, and the widespread faith that the liturgy contains
    truths for common-understanding—all of these features of Tengger cultural interpretation
    acquire added depth in light of the *entas-entas*. From an outside analytic perspective
    as well, the rite provides insight into what the priestly tradition may once have
    been, and why it becomes what it is today.",


    ¹ The term *entas* has similar connotations in Balinese, and is similarly used
    to describe the ritual purification of souls for their ascent to the heavens (cf.
    Corravubias 1937:298; Hooykaas 1973:10).


