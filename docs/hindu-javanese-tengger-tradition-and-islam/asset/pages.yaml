    Resi Priesthood in Tengger and Bali, a Comparative Note


    I have not attempted in the present work to make a systematic comparison of Tengger
    and Balinese ritual tradition. Since the analysis has raised questions on the
    history and origins of the Tengger priesthood, however, it may be worthwhile to
    add a brief and somewhat speculative comment on parallels between the Tengger
    priest and a similar Balinese celebrant, the *resi buyangga*. The comparison suggests
    that there are indeed important relationships between Tengger and Bali, and summarizes
    nearly neatly the contrast between popular Indic tradition in Bali and that in
    a Java islamic becoming.


    In the *purwabami* priest (Chapter 8), the Tengger priest is referred to as *resi
    buyangga*. A similar title (*resi buyangga*) is still used in modern Bali to refer
    to a popular ritual celebrant who bears strong resemblance to the Tengger priest.
    The Balinese resi is a low-caste (that is, non-Brahman and non-triwangansa) or
    commoner priest. He performs no courtly ritual, but serves the 93 percent of Balinese
    population of commoner caste (Hookyakas 1964:243). The resi role is restricted
    to people of sengguh birth, a commoner title, but only those *sengguhu* actually
    ordained as priests are said to be *resi buyangga*. Like high-water—mainstay of
    Balinese ritual—and is also entitled to wear a priestly robe and mitre (Hookyakas
    1973:15). The specialty for which the resi is most famous, however, is his role
    as exorcist of demons in the annual ritual of silence (*nyepi*). In the course
    of these ceremonies, highcaste priests give worship to the Indic gods of the heavens
    while, just to the side of them, *resi buyangga* present offerings to the demons
    of the lower world. The resi’s services are to banish these demons from villages
    around the island for another year (Hookyakas 1974:53; Covarrubias 1937:281).


    What makes the resi''s role of such comparative interest is it is that he recites
    the “prayer of word origins” (*purwabumi*) also found, in a somewhat shorter form,
    in the Tengger purification of the dead (*entas-entas*, Chapter 9). Comparision
    of the two prayers reveals line-by-line parallels that are nothing less than astounding,
    given the fact that Balinese and Tengger tradition have probably not had direct
    cultural contacts for several hundred years. The prayer provides com'
