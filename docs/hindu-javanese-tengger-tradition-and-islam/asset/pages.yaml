    that on a less elevated level of commentary, villagers understand more of the
    ritual tradition than myth bothers to mention. They are familiar, for example,
    with the general Javanese symbolism of mountains, spirits, and water. They understand
    the logic of priestly prayer, with its pattern of announcement, invocation, offering,
    and worship. They appreciate that these rituals require a specialist capable of
