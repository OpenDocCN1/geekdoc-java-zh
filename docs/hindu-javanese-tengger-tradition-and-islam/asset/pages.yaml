    # Conclusion


    Tengger villages present an interesting variation on Javanese themes. What at
    first looks like structural anomie, a poverty of formal roles and statuses, under
    closer inspection turns out to be a neatly meshed world of persons at once familiar
    and, through a variety of practical arrangements, committed to a tradition called
    "Tengger." The absence of formal groups and statuses, the lack of precision in
    kinship attendance, the emphasis on personal names, the relative unimportance
    of marriage as a mechanism of social alliance, the identification of the village
    as one body of relatives, the stewardship roles of priest and petinggi, and the
    peculiar restrictions on economic activity—all of these things help to give the
    formal idioms of ritual life an air of experiential realism and interpretive depth.
    This is the background against which an interpretation of popular Tengger tradition
    must be set, for it is through more diffuse and ongoing social experience that
    Tengger themselves come to witness and appreciate their ritual heritage. This,
