    Arabia. Here in the Aji tale, however, Kures is a simpler symbol of a precultural
    past, at a time when people “could do nothing.” Ki Kures is a forager; he and
    his family are miserably poor. His name gives hint of a larger impending religious
    order. It is Kures''s poverty that creates the condition for the first important
    relationship introduced in the myth. Ki Kures will meet the great naga-serpent,
    Antaboga, and become his servant.


    Two worlds have met. Related to the naga-serpent found in much Asian folklore
    (cf. Tambiah 1970:169), Antaboga in Java-Balinese tradition is nothing other than
    the world spirit who lost at the founding of the world (Covarrubias1937). In this
    narrative, however, his role is less vast; whatever he have meant once to Tengger
    Javanese, Antaboga now figures in no other popular tales. In this tale, Antaboga
