    iprocity is no simple reflection of some primary social reality, but it is itself
    a constituent element in the formation of social relations. Parents’ ritual responsibilities
    toward their children are among the most important and, outside of food and shelter,
    financially demanding of all they must meet in providing parental care.


    As children grow, marry, and receive the largest portion of their inheritance,
    parents begin to withdraw from the ritual exchange circuit (Chapter 10) so important
    in village social life. Ideally, they are supposed to live on but a small portion
    of their remaining farm land, so that children may live from the larger portion.
    So to avoid economic dependence, parents may attempt to retain a larger portion
    of their wealth. To do so to the detriment of one’s married children is considered
    extremely improper, however. One is in age, dearly loved, like a child, rather
    irrelevant to the primary social scheme. Having withdrawn from the ritual exchange
    system, an old person feels too embarrassed to attend ritual festivals, since
    coming “empty handed” is considered improper. By sixty or so, men also tend to
    stop dancing tayuban, leaving the floor to still young enough to enjoy its graces
    and tillation.


    Death finishes an elder’s social limbo. It also opens a new cycle of ritual reciprocity,
    as the parent becomes the object of his child’s ritual blessing. Death itself
    triggers a flurry of activity in the village. A family reports a death immediately
    to the village priest and chief. Village officials are then supposed to go quite
    quickly to the house of the deceased, to pay their respects and make sure that
    preparations for the burial are well under way. In least small and mid-sized Tengger
    communities, everyone who hears of the death is also supposed to proceed to the
    house of the deceased. Neighbor women bearing food for the ritual meal, which,
    in all, must be shared after the priest completes the ceremony. The household
    of the deceased is not supposed to have to supply food for the funeral meal. Moments
    after word of the death has been heard around the village, the household is bustling
    with food preparation, conversation, and the reception of guests.


    The corpse is placed in the front room of the house, a short-legged sleeping platform,
    and is covered with a plain cloth and, above this, a finer batik cover. A white
    ceremonial cloth (majajang)—always present in ceremonies involving the invocation
    or departure of family spirits—is hung on the wall of the platform. On top of
    the platform sit a small lamp (‘to clear the way of the soul in its journey’),
    food plates like those prepared for all family spirits, a dish for coin gifts
    from visitors, and a large bundle of muslin cloth in which the corpse will eventually
    be wrapped for burial. Guests enter the room and proceed


