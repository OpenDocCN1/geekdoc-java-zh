    <head>\n<title>JSTL x:transform</title>\n</head>\n<body>\n<h3>set var:</h3>\n\
    <c:set var=\"xmltext\">\n<books>\n<book>\n<name>History</name>\n<author>Zara</author>\n\
    <price>100</price>\n</book>\n<book>\n<name>History</name>\n<author>Nuha</author>\n\
    <price>2000</price>\n</book>\n</books>\n</c:set>\n<c:import url=\"http://localhost:8080/style.xsl\"\
    \ var=\"xslt\"/>\n<x:transform xml=\"${xmltext}\" xslt=\"${xslt}\"/>\n</body>\n\
    </html>\n```\n\nThe following result will be displayed -\n\nBooks Info:\nHistory\
    \ Zara 100\nHistory Nuha 2000\n\nTo know more about XML processing using JSTL,\
    \ you can check JSP Standard Tag Library.\n\n# Chapter - 31 : JavaBeans\n\nA JavaBean\
    \ is a specially constructed Java class written in Java and coded according to\
    \ the JavaBeans API specifications. Following are the unique characteristics that\
    \ distinguish a JavaBean from other Java classes\n\n- 1. It provides a default,\
    \ no-argument constructor.\n- 2. It should be serializable and can implement the\
    \ Serializable interface.\n- 3. It may have a number of properties that can be\
    \ read or written.\n- 4. It may have a number of \"getter\" and \"setter\" methods\
    \ for the properties.\n\n# JavaBeans Properties\n\nA JavaBean property is a named\
    \ attribute that can be accessed by the user of the object. The attribute can\
    \ be of any Java data type, including the classes that you define. A JavaBean\
    \ may be read, write, read only, or write only. JavaBean properties are accessed\
    \ through two methods in the JavaBean's implementation class —\n\n| S.No. | Method\
    \ & Description |\n|---|---|\n| 1 | getPropertyName() For example, if the property\
    \ is firstName, your method name would getFirstName() to read the property. This\
    \ method is called accessor. setPropertyName() For example, if the property is\
    \ firstName, your method name would be setName() to write that property. This\
    \ method is called mutator. |\n\nA read-only attribute will have only a getPropertyName()\
    \ method, and a write-only attribute will have only a setPropertyName() method.\n\
    \n# JavaBeans Example\n\nConsider a student class with properties —\n\n```java\n\
    package com.tutorial.point;\npublic class StudentsBean implements java.io.Serializable\
    \ {\n    private String firstName = null;\n    private String lastName = null;\n\
    \    private int age = 0;\n\n    public StudentsBean() {\n    }\n    public String\
    \ getFirstName() {\n        return firstName;\n    }\n    public String getLastName()\
    \ {\n        return lastName;\n    }\n    public int getAge() {\n        return\
    \ age;\n    }\n    public void setFirstName(String firstName) {\n        this.firstName\
    \ = firstName;\n    }\n    public void setLastName(String lastName) {\n      \
    \  this.lastName = lastName;\n    }\n    public void setAge(Integer age) {\n \
    \       this.age = age;\n    }\n}\n```\n\n# Accessing JavaBeans\n"
