    # Chapter - 28 : Standard Tag Library (JSTL) Tutorial


    In this chapter, we will understand the different tags in JSP. The JavaServer
    Pages Tag Library (JSTL) is a collection of useful JSP tags which encapsulates
    the core functionality common to many JSP applications.


    JSTL has support for common, structural tasks such as iteration and conditions,
    for manipulating XML documents, internationalisation tags, and SQL tags. It also
    provides a framework for integrating the existing custom tags with the JSTL tags.'
  - '[PAGE 84]


    # Install JSTL Library


    To begin working with JSP tags you need to first install the JSTL library. If
    you are using the Apache Tomcat container, then follow these two steps –


    **Step 1** – Download the binary distribution from Apache Standard Taglib and
    unpack the compressed file.


    **Step 2** – To use the Standard Taglib from its **Jakarta Taglibs distribution**,
    simply copy the JAR files in the distribution''s ''lib'' directory to your application''s
    **webapps\ROOT\WEB-INF** directory.


    To use any of the libraries, you must include a <taglib> directive at the top
    of each JSP uses the library.


    # Classification of The JSTL Tags


    The JSTL tags can be classified, according to their functions, into the following
    JSTL tag library groups that can be used when creating a JSP page –


    +   1. Core Tags

    2. Formatting tags

    3. SQL tags

    4. XML tags

    5. JSTL Functions


    # Core Tags


    The group of tags are the most commonly used JSTL tags. Following is the syntax
    to include the JSTL Core library in your JSP –


    ```

    <%@taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core">

    ```


    Following table lists the Core JSTL Tags


    | S.No. | Tag & Description |

    | 1 | <c:out>

    >Like <%= ..>, but for expressions. |

    | 2 | <c:set>

    >Sets the result of an expression evaluation in a ''scope'' |

    | 3 | <c:remove>

    >Removes a scoped variable (from a particular scope, specified). |

    | 4 | <c:catch>

    >Catches any Throwable that occurs in its body and optionally exposes it. |

    | 5 | <c:if>

    >Simple conditional tag which evaluates its body if the supplied condition is
    true. |

    | 6 | <c:choose>

    >Simple conditional tag that establishes a context for mutually exclusive operations,
    marked by <when> and <otherwise>. |

    | 7 | <c:when>

    >Subtag of <choose> that includes its body if condition evaluates to ''true''.
    |'
  - '[PAGE 85]


    8 <c:otherwise>

    Subtag of <c:choose> that follows the <c:when> tags and runs only if all of the

    prior conditions evaluated to ''false''.


    9 <c:import>

    Retrieves an absolute or relative URL and exposes its contents to either the page,
    a

    String in ''var'', or a Reader in ''varReader''.


    10 <c:forEach>

    The basic iteration tag, accepting many different collection types and supporting

    subsetting and other functionality.


    11 <c:forTokens>

    Iterates over tokens, separated by the supplied delimiters.


    12 <c:param>

    Adds a parameter to a containing ''import'' tag''s URL.


    13 <c:redirect>

    Redirects to a new URL.


    14 <c:url>

    Creates a URL with optional query parameters


    # Formatting Tags


    The JSTL formatting tags are used to format and display text, the date, the time,
    and

    numbers for internationalised Websites. Following is the syntax to include Formatting

    library in your JSP -


    ```

    <@taglib prefix="fmt" uri="http://java.sun.com/jsp/jstl/fmt %>

    ```


    Following table lists out the Formatting JSTL Tags –


    | S.No. | Tag & Description |

    |---|---|

    | 1 | <fmt:formatNumber> To render numerical values with specific precision or
    format. |

    | 2 | <fmt:parseNumber> Parses the string representation of a number, currency,
    or percentage. |

    | 3 | <fmt:dateFormat> Formats a date and/or time using the supplied styles and
    pattern. |

    | 4 | <fmt:parseDate> Parses the string representation of a date and/or time |

    | 5 | <fmt:bundle> Loads a resource bundle to be used by its tag body. |

    | 6 | <fmt:setLocale> Stores the given locale in the locale configuration variable.
    |

    | 7 | <fmt:setBundle> |'
- md: "\nLoads a resource bundle and stores it in the named scoped variable by the\
    \ bundle configuration variable.\n\n- <fmt:timeZone>\nSpecifies the time zone\
    \ for time formatting or parsing actions nested in its body.\n\n- <fmt:setTime>\n\
    Stores the given time zone in the time zone configuration variable\n\n- <fmt:message>\n\
    Displays an internationalised message.\n\n- <fmt:requestEncoding>\nSets the request\
    \ character encoding\n\n# SQL Tags\n\nThe JSP SQL tag library provides tags for\
    \ interacting with relational databases (RDBMSs) such as Oracle, MySQL or Microsoft\
    \ SQL Server.\n\nFollowing is the syntax to include JSTL SQL library in your JSP\
    \ – `<%@ taglib prefix=\"sql\" uri=\"http://java.sun.com/jsp/jstl/sql\">`\n\n\
    Following table lists the SQL JSTL Tags –\n\n| S.No. | Tag & Description |\n|---|---|\n\
    | 1 | <sql:setDataSource> Creates a simple DataSource suitable only for prototyping\
    \ |\n| 2 | <sql:query> Executes the SQL query defined in its body or through the\
    \ sql attribute. |\n| 3 | <sql:update> Executes the SQL update defined in its\
    \ body or through the sql attribute. |\n| 4 | <sql:param> Sets a parameter in\
    \ an SQL statement to the specified value. |\n| 5 | <sql:dateParam> Sets a parameter\
    \ in an SQL statement to the specified java.util.Date value. |\n| 6 | <sql:transaction>\
    \ Provides nested database action elements with a shared Connection, set up to\
    \ execute all statements as one transaction. |\n\n# XML tags\n\nThe JSTL tags\
    \ provide a JSP-centric way of creating and manipulating the XML documents. Following\
    \ is the syntax to include the JSTL XML library in your JSP.\n\nThe JSTL XML tag\
    \ library has custom tags for interacting with the XML data. This includes parsing\
    \ the XML, transforming the XML data, and the flow control based on the XPath\
    \ expressions.\n\n```jsp\n<%@taglib prefix=\"x\" uri=\"http://java.sun.com/jsp/jst/xml\"\
    \ %>\n```\n\nBefore proceeding with the examples, you will need to copy the two\
    \ XML and XPath-rated libraries into your `<Tomcat Installation Directory>\\lib`\
    \ -\n\n- 1. Xercesimpl.jar - Download from https://www.apache.org/dist/xerces/j/\n\
    - 2. xalan-j - Download from http://xml.apache.org/xalan-j/index.html\n\nFollowing\
    \ is the list of JSTL Tags —\n\n| S.No. | Tag & Description |\n|---|---|\n| 1\
    \ | <x:out> Like <%= ... %>, for XPath expressions. |\n| 2 | <x:parse> Used to\
    \ parse the XML data specified either via an attribute or in the tag body. |\n\
    | 3 | <x:set> Sets a variable to the value of an XPath expression. |\n| 4 | <x:if>\
    \ Evaluates a test XPath expression and if it is true, it processes its body.\
    \ If the condition is false, the body is ignored. |\n| 5 | <x:forEach> To loop\
    \ over nodes in an XML document. |\n| 6 | <x:choose> Simple conditional tag that\
    \ establishes a context for mutually exclusive conditional operations, marked\
    \ by <when> and <otherwise> tags. |\n| 7 | <x:when> Subtag of <choose> includes\
    \ its body if its expression evaluates to 'true'. |\n| 8 | <x:otherwise> Subtag\
    \ of <choose> that follows the <when> tags and runs only if all of the prior conditions\
    \ evaluates to 'false'. |\n| 9 | <x:transform> Applies an XSL transformation on\
    \ a XML document |\n\n# JSTL Functions\n\nJSTL includes a number of standard functions,\
    \ of which there are common string manipulation functions. Following is the syntax\
    \ to include JSTL Functions library in your JSP -\n\n```jsp\n<%@taglib prefix=\"\
    fn\" uri=\"http://java.sun.com/jsp/jst/functions\" %>\n```\n\nFollowing table\
    \ lists out the various JSTL Functions —\n\n| S.No. | Function & Description |\n\
    |---|---|\n| 1 | fn:contains() | Tests if an input string contains the specified\
    \ substring. |\n| 2 | fn:containsIgnoreCase() | Tests if an input string contains\
    \ the specified substring in case insensitive way. |\n| 3 | fn:endsWith() | Tests\
    \ if an input string ends with the specified suffix. |\n| 4 | fn:escapeXml() |\
    \ Escapes characters that can be interpreted as XML markup. |\n| 5 | fn:indexOf()\
    \ | Returns the index within a string of the first occurrence of a specified substring.\
    \ |\n| 6 | fn:join() | Joins all elements of an array to a string. |\n| 7 | fn:length()\
    \ | Returns the number of items in a collection, or the number of characters in\
    \ a string. |\n| 8 | fn:replace() | Returns a string resulting from replacing\
    \ in an input string all occurrences with a given string. |\n| 9 | fn:split()\
    \ | Splits a string into an array of substrings. |\n| 10 | fn:startsWith() | Tests\
    \ if an input string starts with the specified prefix. |\n| 11 | fn:substring()\
    \ | Returns a subset of a string. |\n| 12 | fn:substringAfter() | Returns a subset\
    \ of a string following a specific substring. |\n| 13 | fn:substringBefore() |\
    \ Returns a subset of a string before a specific substring. |\n| 14 | fn:toLowerCase()\
    \ | Converts all of the characters of a string to lowercase. |\n| 15 | fn:toUpperCase()\
    \ | Converts all of the characters of a string to uppercase. |\n| 16 | fn:trim()\
    \ | Removes white spaces from both ends of a string. |\n\n# Chapter 9: Database\
    \ Access\n\nIn this chapter, we will discuss how to access databases with JSP.\
    \ We assume you have a good understanding of how JDBC works. Before starting with\
    \ database access through JSP, make sure you have a proper environment setup.\
    \ For more detail on how to access databases using JDBC and its setup you can\
    \ go through our Tutorial.\n\n# Create Table\n\nTo create the Employees table\
    \ in the TEST database, use the following steps –\n\nStep 1\n`cd:\\Program Files\\\
    MySQL\\bin`\n\nStep 2\nLogin to the database as follows –\n`C:\\Program Files\\\
    MySQL\\bin> mysql -u root -p`\nEnter password: ***\n\nStep 3\nCreate the Employees\
    \ table in TEST database as follows –\n```sql\nmysql> create table Employees (\n\
    id int not null,\nage int not null,\nfirst varchar (255),\nlast varchar (255)\n\
    );\nQuery OK;\n```\n\n# Create Data Records\n\nLet us create a few records in\
    \ that table as –\n\n```sql\nmysql> INSERT INTO Employees VALUES (100, 18, 'Zara',\
    \ 'Ali');\nQuery OK, 1 row affected (0 sec)\n\nmysql> INSERT INTO Employees VALUES\
    \ (101, 25, 'Mahnaz', 'Fatma');\nQuery OK, 1 row affected (0 sec)\n\nmysql> INSERT\
    \ INTO Employees VALUES (102, 30, 'Zaid', 'Khan');\nQuery OK, 1 row affected (0\
    \ sec)\n\nmysql> INSERT INTO Employees VALUES (103, 28, 'Sumit', 'Mittal');\n\
    Query OK, 1 row affected (0 sec)\n```\n\n# SELECT Operation\n\nFollowing example\
    \ shows how we can execute the SQL statement using JSTL in JSP programming –\n\
    \n```jsp\n<%@page import=\"java.io.*,java.util.*,java.sql.*\"%>\n<%@page import=\"\
    javax.servlet.http.*,javax.servlet.*\" %>\n<%@taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<%@taglib uri=\"http://java.sun.com/jsp/jst/sql\" prefix=\"\
    sql\" %>\n```\n\n```jsp\n<html>\n<head>\n<title>SELECT Operation</title>\n</head>\n\
    \n<body>\n<sql:setDataSource var=\"snapshot\" driver=\"com.mysql.jdbc.Driver\"\
    \n  url=\"jdbc:mysql://localhost/TEST\"\n  user=\"root\" password=\"pass123\"\
    />\n\n<sql:query dataSource=\"${snapshot}\" result=\"result\">\nSELECT * from\
    \ Employees;\n</sql:query>\n\n<table border=\"100%\">\n<tr>\n<th>Emp ID</th>\n\
    <th>First Name</th>\n<th>Last Name</th>\n<th>Age</th>\n</tr>\n\n<c:forEach var=\"\
    row\" items=\"${result.rows}\">\n<tr>\n<td><c:out value=\"${row.id}\"/></td>\n\
    <td><c:out value=\"${row.first}\"/></td>\n<td><c:out value=\"${row.last}\"/></td>\n\
    <td><c:out value=\"${row.age}\"/></td>\n</tr>\n</c:forEach>\n</table>\n\n</body>\n\
    </html>\n```\n\nAccess the above JSP, the following result will be displayed -\n\
    \n| Emp ID | First Name | Last Name | Age |\n|---|---|---|---|\n| 100 | Zara |\
    \ Ali | 18 |\n\n# INSERT Operation\n\nFollowing example shows how we execute the\
    \ SQL INSERT statement using JSTL in JSP programming –\n\n```jsp\n<%@page import=\"\
    java.io.*,java.util.*,java.sql.*\"%>\n<%@page import=\"javax.servlet.http.*,javax.servlet.*\"\
    \ %>\n<%@taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\"%>\n<%@taglib\
    \ uri=\"http://java.sun.com/jsp/jstl\" prefix=\"sql\"%>\n```\n\n```jsp\n<html>\n\
    <head>\n<title>INSERT Operation</title>\n</head>\n<body>\n<sql:setDataSource var=\"\
    snapshot\" driver=\"com.mysql.jdbc.Driver\"\nurl=\"jdbc:mysql://localhost/TEST\"\
    \nuser=\"root\" password=\"pass123\"/>\n<sql:update dataSource=\"${snapshot}\"\
    \ var=\"result\">\nINSERT INTO Employees VALUES (104, 2, 'Nuha', 'Ali');\n</sql:update>\n\
    \n<sql:query dataSource=\"${snapshot}\" var=\"result\">\nSELECT * FROM Employees;\n\
    </sql:query>\n\n<table border=\"1\" width=\"100%\">\n<tr>\n<th>Emp ID</th>\n<th>First\
    \ Name</th>\n<th>Last Name</th>\n<th>Age</th>\n</tr>\n<c:forEach var=\"row\" items=\"\
    ${result.rows}\">\n<tr>\n<td><c:out value=\"${row.id}\"/></td>\n<td><c:out value=\"\
    ${row.first}\"/></td>\n<td><c:out value=\"${row.last}\"/></td>\n<td><c:out value=\"\
    ${row.age}\"/></td>\n</tr>\n</c:forEach>\n</table>\n\n</body>\n</html>\n```\n"
  mdcn: "\n加载资源包并通过包的配置变量将其存储在命名的作用域变量中。\n\n- <fmt:timeZone>\n为嵌套在其体内的时间格式化或解析操作指定时区。\n\
    \n- <fmt:setTime>\n将给定的时区存储在时区配置变量中。\n\n- <fmt:message>\n显示国际化消息。\n\n- <fmt:requestEncoding>\n\
    设置请求字符编码\n\n# SQL 标签\n\nJSP SQL 标签库提供了用于与关系型数据库（RDBMS）如 Oracle、MySQL 或 Microsoft\
    \ SQL Server 交互的标签。\n\n以下是在 JSP 中引入 JSTL SQL 库的语法—— `<@ taglib prefix=\"sql\"\
    \ uri=\"http://java.sun.com/jsp/jstl/sql\">`\n\n下表列出了 SQL JSTL 标签：\n\n| 序号 | 标签与描述\
    \ |\n|---|---|\n| 1 | <sql:setDataSource> 创建一个仅适用于原型制作的简单 DataSource |\n| 2 |\
    \ <sql:query> 执行在体内或通过 sql 属性定义的 SQL 查询。 |\n| 3 | <sql:update> 执行在体内或通过 sql 属性定义的\
    \ SQL 更新。 |\n| 4 | <sql:param> 将 SQL 语句中的参数设置为指定指定的值。 |\n| 5 | <sql:dateParam>\
    \ 将 SQL 语句中的参数设置为指定的 java.util.Date 值。 |\n| 6 | <sql:transaction> 提供具有共享连接的嵌套数据库操作元素，配置为将所有语句作为一个事务来执行。\
    \ |\n\n# XML 标签\n\nJSTL 标签提供了一种以 JSP 为中心创建和操作 XML 文档的方法。以下是在 JSP 中引入 JSTL XML\
    \ 库的语法。\n\nJSTL XML 标签库拥有用于与 XML 数据交互的自定义标签。这包括解析 XML、转换 XML 数据以及基于 XPath 表达式的流控制。\n\
    \n```jsp\n<%@taglib prefix=\"x\" uri=\"http://java.sun.com/jsp/jst/xml\" %>\n\
    ```\n\n在继续后续示例之前，您需要将两个 XML 和 XPath 相关的库复制到您的 `<Tomcat 安装目录>\\lib` 中——\n\n- 1.\
    \ Xercesimpl.jar - 从 https://www.apache.org/dist/xerces/j/ 下载\n- 2. xalan-j -\
    \ 从 http://xml.apache.org/xalan-j/index.html 下载\n\n以下是 JSTL 标签列表——\n\n| 序号 | 标签与描述\
    \ |\n|---|---|\n| 1 | <x:out> 类似于 <%= ... %>，用于 XPath 表达式。 |\n| 2 | <x:parse>\
    \ 用于解析通过属性或标签主体指定的 XML 数据。 |\n| 3 | <x:set> 将变量设置为 XPath 表达式的值。 |\n| 4 | <x:if>\
    \ 评估测试 XPath 表达式，如果为真，则处理其正文。如果条件为假，则忽略该正文。 |\n| 5 | <x:forEach> 用于遍历 XML 文档中的节点。\
    \ |\n| 6 | <x:choose> 简单条件标签，为互斥的条件操作建立上下文，由 <when> 和 <otherwise> 标签标记。 |\n| 7\
    \ | <x:when> <choose> 的子标签，如果其表达式求值为 'true' 则包含其正文。 |\n| 8 | <x:otherwise> <choose>\
    \ 的子标签，跟在 <when> 标签之后，仅当所有先前的条件求值为 'false' 时才运行。 |\n| 9 | <x:transform> 对 XML\
    \ 文档应用 XSL 转换 |\n\n# JSTL 函数\n\nJSTL 包含许多标准函数，其中包含常用的字符串处理函数。以下是在 JSP 中引入 JSTL\
    \ 函数库的语法——\n\n```jsp\n<%@taglib prefix=\"fn\" uri=\"http://java.sun.com/jsp/jst/functions\"\
    \ %>\n```\n\n下表列出了各种 JSTL 函数——\n\n| 序号 | 函数与描述 |\n|---|---|\n| 1 | fn:contains()\
    \ 测试输入字符串是否包含指定的子字符串。 |\n| 2 | fn:containsIgnoreCase() 忽略大小写地测试输入字符串是否包含指定的子字符串。\
    \ |\n| 3 | fn:endsWith() 测试输入字符串是否以指定的后缀结束。 |\n| 4 | fn:escapeXml() 转义可以解释为 XML\
    \ 标记的字符。 |\n| 5 | fn:indexOf() 返回字符串中首次出现指定子字符串的索引。 |\n| 6 | fn:join() 将数组的所有元素连接成一个字符串。\
    \ |\n| 7 | fn:length() 返回集合中的项数或字符串中的字符数。 |\n| 8 | fn:replace() 返回将输入字符串中所有指定出现替换后的字符串。\
    \ |\n| 9 | fn:split() 将字符串拆分为子字符串数组。 |\n| 10 | fn:startsWith() 测试输入字符串是否以指定的前缀开头。\
    \ |\n| 11 | fn:substring() 返回字符串的子集。 |\n| 12 | fn:substringAfter() 返回指定子字符串之后的字符串子集。\
    \ |\n| 13 | fn:substringBefore() 返回指定子字符串之前的字符串子集。 |\n| 14 | fn:toLowerCase()\
    \ 将字符串的所有字符转换为小写。 |\n| 15 | fn:toUpperCase() 将字符串的所有字符转换为大写。 |\n| 16 | fn:trim()\
    \ 字符串两端的空格。 |\n\n# 第 9 章：数据库访问\n\n在本章中，我们将讨论如何使用 JSP 访问数据库。假设您已经熟悉了 JDBC 的工作原理。在通过\
    \ JSP 访问数据库之前，请确保已正确配置环境。关于如何使用 JDBC 访问数据库的更多细节，可以参考我们的教程。\n\n# 创建表\n\n要在 TEST\
    \ 数据库中创建 Employees 表，请使用以下步骤——\n\n步骤 1\n`cd \\Program Files\\MySQL\\bin`\n\n步骤\
    \ 2\n如下登录数据库——\n`C:\\Program Files\\MySQL\\bin> mysql -u root -p`\n输入密码：***\n\n\
    步骤 3\n如下所示在 TEST 数据库中创建 Employees 表——\n```sql\nmysql> create table Employees (\n\
    id int not null,\nage int not null,\nfirst varchar (255),\nlast varchar (255)\n\
    );\nQuery OK;\n```\n\n# 创建数据\n\n让我们在表中创建几条记录——\n\n```sql\nmysql> INSERT INTO Employees\
    \ VALUES (100, 18, 'Zara', 'Ali');\nQuery OK, 1 row affected (0 sec)\n\nmysql>\
    \ INSERT INTO Employees VALUES (101, 25, 'Mahnaz', 'Fatma');\nQuery OK, 1 row\
    \ affected (0 sec)\n\nmysql> INSERT INTO Employees VALUES (102, 30, 'Zaid', 'Khan');\n\
    Query OK, 1 row affected (0 sec)\n\nmysql> INSERT INTO Employees VALUES (103,\
    \ 28, 'Sumit', 'Mittal');\nQuery OK, 1 row affected (0 sec)\n```\n\n# SELECT 操作\n\
    \n以下示例展示了如何在 JSP 编程中使用 JSTL 执行 SQL 语句——\n\n```jsp\n<%@page import=\"java.io.*,java.util.*,java.sql\"\
    %>\n<%@page import=\"javax.servlet.http.*,javax.servlet.*\" %>\n<%@taglib uri=\"\
    http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<%@taglib uri=\"http://java.sun.com/jsp/jst/sql\"\
    \ prefix=\"sql\" %>\n```\n\n```jsp\n<html>\n<head>\n<title>SELECT 操作</title>\n\
    </head>\n\n<body>\n<sql:setDataSource var=\"snapshot\" driver=\"com.mysql.jdbc.Driver\"\
    \n  url=\"jdbc:mysql://localhost/TEST\"\n  user=\"root\" password=\"pass123\"\
    />\n\n<sql:query dataSource=\"${snapshot}\" result=\"result\">\nSELECT * from\
    \ Employees;\n</sql:query>\n\n<table border=\"100%\">\n<tr>\n<th>Emp ID</th>\n\
    <th>First Name</th>\n<th>Last Name</th>\n<th>Age</th>\n</tr>\n\n<c:forEach var=\"\
    row\" items=\"${result.rows}\">\n<tr>\n<td><c:out value=\"${row.id}\"/></td>\n\
    <td><c:out value=\"${row.first}\"/></td>\n<td><c:out value=\"${row.last}\"/></td>\n\
    <td><c:out value=\"${row.age}\"/></td>\n</tr>\n</c:forEach>\n</table>\n\n</body>\n\
    </html>\n```\n\n访问上述 JSP，将显示以下结果——\n\n| Emp ID | First Name | Last Name | Age\
    \ |\n|---|---|---|---|\n| 100 | Zara | Ali | 18 |\n\n# INSERT 操作\n\n以下示例展示了我们如何在\
