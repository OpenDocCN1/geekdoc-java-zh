    \ | --- | --- | --- |\n| 100 | Zara | Ali | 18 |\n| 101 | Mahnaz | Fatma | 25\
    \ |\n| 102 | Zaid | Ali | 30 |\n\n# Chapter - 30 : XML Data\n\nWhen you send the\
    \ XML data via HTTP, it makes sense to use JSP to handling and outgoing XML documents;\
    \ for example, RSS documents. As an XML document is merely a bunch of text, creating\
    \ one through a JSP is much easier than creating an HTML document.\n\n## Sending\
    \ XML from a JSP\n\nYou can send the XML content using JSPs the same way you send\
    \ HTML. The only difference is that you must set the content type of your page\
    \ to text/xml. To set the content type, use `<@page` like this:\n\n```jsp\n<%@page\
    \ contentType=\"text/xml\"%>\n```\n\nFollowing example will show how to send XML\
    \ content to the browser -\n\n```jsp\n<%@page contentType=\"text/xml\"%>\n<books>\n\
    <book>\n<name>History</name>\n<author>Zara</author>\n<price>100</price>\n</book>\n\
    </books>\n```\n\nAccess the above XML using different browsers to see the presentation\
    \ of the above XML.\n\n## Processing XML in JSP\n\nBefore you proceed with XML\
    \ processing using JSP, you will need to copy the following two libraries into\
    \ your \"Tomcat/lib\":\n\n- Xerces.jar - Download it from https://www.apache.org/dist/xerces/\n\
    - xalan.jar - Download it from https://www.apache.org/dist/xalan/\n\nLet us put\
    \ the following content in books.xml:\n\n```xml\n<books>\n<book>\n<name>History</name>\n\
    <author>Zara</author>\n<price>100</price>\n</book>\n<book>\n<name>History</name>\n\
    <author>Nuha</author>\n<price>2000</price>\n</book>\n</books>\n```\n\nTry the\
    \ following main.jsp, keeping in the same directory:\n\n```jsp\n<%@ taglib prefix=\"\
    c\" uri=\"http://java.sun.com/jsp/jst/core\" %>\n<%@ taglib prefix=\"x\" uri=\"\
    http://java.sun.com/jsp/jst/xml\" %>\n<html>\n<head>\n<title>JSTL x:parse</title>\n\
    </head>\n<body>\n<h3>Books Info</h3>\n<c:import var=\"bookInfo\" url=\"books.xml\"\
    />\n<x:parse xml=\"${bookInfo}\" var=\"output\"/>\nThe price of the first book\
    \ is <c:out select=\"${output/books[1]/name}\" /><br/>\nThe price of the second\
    \ book is <c:out select=\"${output/books[2]/price}\" />\n</body>\n</html>\n```\n\
    \nAccess the above JSP using http://localhost:8080/main.jsp, the following result\
    \ will be displayed -\n\nBooks Info:\nThe title of the first book is: History\n\
    The price of the second book: 2000\n\n## Formatting XML with JSP\n\nConsider the\
    \ following XSL stylesheet style.xsl:\n\n```xml\n<?xml version=\"1.0\"?>\n<xsl:stylesheet\
    \ xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\" version=\"1.0\">\n<xsl:output\
    \ method=\"html\" indent=\"yes\"/>\n<xsl:template match=\"\">\n<html>\n  <body>\n\
    \    <xsl:apply-templates/>\n  </body>\n</html>\n</xsl:template>\n<xsl:template\
