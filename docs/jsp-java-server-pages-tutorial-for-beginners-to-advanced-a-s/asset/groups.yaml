    ## Locale Specific Currency


    You can use the java.text.NumberFormat class and its static getCurrencyInstance()
    method to format a number, as a long or double type, in a locale specific currency.
    Following is the example which shows how format currency specific to a given locale


    ```jsp

    <%@ page import = "java.io.*,java.util.Locale" %>

    <%@ page import = "java.servlet.*,java.servlet.http.*" %>

