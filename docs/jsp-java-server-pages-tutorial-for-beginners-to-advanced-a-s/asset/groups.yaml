    an uploader form. Following are the important points to be noted –


    +   1. The form **method** attribute should be set to **POST** method and GET
    method can not be used.


    +   2. The form **doctype** attribute should be set to **multipart/form-data**.


    +   3. The form **action** attribute should be set to a JSP file which would handle
    file uploading at the backend server. Following example is using **uploadFile.jsp**
    program file to upload file.'
