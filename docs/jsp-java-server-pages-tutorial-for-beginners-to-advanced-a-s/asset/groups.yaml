    For example, a server response header looks like the following –

    HTTP/1.1 200 OK

    Content-Type: text/html

    Header2: ...

    ...

    HeaderN: ...

    (Blank Line)


    ```

    <!doctype...

    <head>...</head>

    <body>

    </body>

    </html>

    ```


    The status line consists of the HTTP version (HTTP/1.1 in the example), a status
    code (200 in the example), and a very short message corresponding to the status
    code (OK in the example).


    Following table lists out the HTTP status codes and associated messages that might
    be returned from the Web Server


    | Code | Description |

    |---|---||

    | 100 | Continue | Only part of the request has been received by the server, as
    long as it has not been rejected, the client should continue with the request
    |

    | 101 | Switching Protocols | The server switches protocol. |

    | 200 | OK | The request is OK |

    | 201 | Created | The request is complete, and a new resource is created |

    | 202 | Accepted | The request is accepted for processing, but the processing
    is complete. |

    | 203 | Non-authoritative Information | |

    | 204 | No Content | |

    | 205 | Reset Content | |

    | 206 | Partial Content | |

    | 300 | Multiple Choices | A link list; the user can select a link and go to that
    location. Maximum five addresses. |

    | 301 | Moved | The requested page has moved to a new url. |'
