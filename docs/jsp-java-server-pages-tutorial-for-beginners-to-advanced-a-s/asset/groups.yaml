    The JSP expression defines the following:


    - true and false

    - Integer

    - Floating point

    - String

    - null


    ## Chapter 6: Directives


    In this chapter, we will discuss Directives. These directives provide instructions
    to the container, how to handle aspects of the JSP. Directives have the following
    form:


    ```jsp

    @directive attribute = "value"

    ```


    The blanks between the @ symbol and the directive name, and the closing %> are
    optional. There are three types of directive:


    | S.No. | Directive & Description |

    |--- |--- |

    | 1 | @page | Defines page-dependent attributes, such as language, error page,
    and buffering. |

    | 2 | @include | Includes a file during the translation phase. |

    | 3 | @taglib | Declares a tag library containing custom actions, used in the
    page |


    ## JSP - The page Directive


    The page directive is used to provide instructions to the container. These instructions
    pertain to the current JSP page. You may code page directives anywhere in your
    JSP page. By convention, page directives are coded at the top of the JSP page.


    Following is the basic syntax of the page directive:


    ```jsp

    @page attribute = "value"

    ```


    ## Attributes


    Following table lists out the attributes associated with page directive:


    | S.No. | Attribute & Purpose |

    |---|---|

    | 1 | buffer | Specifies a buffering model for the output. |

    | 2 | autoFlush | Controls the behaviour of the servlet buffer. |

    | 3 | contentType | Defines the character encoding scheme. |

    | 4 | errorPage | Defines the URL of another JSP that reports on Java runtime
    exceptions. |

    | 5 | isErrorPage | Indicates if this JSP page is a URL specified by another page''s
    errorPage attribute. |

    | 6 | extends | Specifies a superclass that the generated servlet must extend.
    |

    | 7 | import | Specifies a list of packages or classes for use in the JSP as the
    import statement does for Java classes. |

    | 8 | info | Defines a string that can be accessed with the servlet''s getInfo().
    |

    | 9 | isThreadSafe | Defines the threading model for the generated servlet. |

    | 10 | language | Defines the programming language used in the JSP page. |

    | 11 | session | Specifies whether the JSP page participates in HTTP sessions
    |

    | 12 | isELIgnored | Specifies whether or not the EL expression within the JSP
    page will be ignored. |

    | 13 | isScriptingEnabled | Determines if scripting elements are enabled for use.
    |

