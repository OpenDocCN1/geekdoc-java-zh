  mdcn: "\n\n# Internet Explorer 使用 Shift 刷新。\n\n## 第 38 章：安全\n\nJava 页面（Pages）和 Servlet（servlets）为\
    \  提供了多种机制来保护应用程序。资源是通过声明式的受保护的，通过在应用部署描述符中标识它们并为它们分配角色来实现。\n\n提供了多个层级的身份验证，范围从使用标识符和密码的普通身份验证到使用证书的复杂身份验证。\n\
    \n## 基于角色的认证\n\nServlet 规范中的身份验证机制使用名为基于角色的安全（role-based security）的技术。其思想不是在用户级别限制资源，而是创建角色并根据角色来限制资源。\n\
    \n你可以在 `tomcat-users.xml` 文件中定义不同的角色，该文件位于 Tomcat 目录下的 `conf` 中。下面是一个示例：\n\n```xml\n\
    <xml version='1.0' encoding='utf-8'?>\n<tomcat-users>\n  <role name=\"tomcat\"\
    />\n  <role name=\"role1\"/>\n  <role name=\"manager\"/>\n  <role name=\"admin\"\
    />\n  <user username=\"tomcat\" password=\"tomcat\" roles=\"tomcat\"/>\n  <user\
    \ username=\"role1\" password=\"tomcat\" roles=\"role1\"/>\n  <user username=\"\
    both\" password=\"tomcat\" roles=\"tomcat,role1\"/>\n  <user username=\"admin\"\
    \ password=\"secret\" roles=\"admin,manager\"/>\n</tomcat-users>\n```\n\n此文件定义了用户名、密码和角色之间的简单映射。注意，给用户可能拥有多个角色；例如，用户名=\"\
    both\" 属于 \"tomcat\" 且角色为 \"role1\"。\n\n一旦你识别并定义了不同的角色，就可以使用 `WEB-INF` 目录下 `web.xml`\
    \ 文件中的`<security-constraint>` 元素对不同的 Web 应用资源设置基于角色的安全限制。\n\n以下是 `web.xml` 中的示例条目：\n\
    \n```xml\n<web-app>\n...\n  <security-constraint>\n    <web-resource-name>SecuredBookSite</web-resource-name>\n\
    \    <url-pattern>/secured/*</url-pattern>\n    <http-method>GET</http-method>\n\
    \    <http-method>POST</http-method>\n  </web-resource-collection>\n  <auth-constraint>\n\
    \    <description>\n      Let only managers use this app\n    </description>\n\
    \    <role-name>manager</role-name>\n  </auth-constraint>\n  </security-constraint>\n\
    \n  <security-role>\n    <role-name>manager</role-name>\n  </security-role>\n\n\
    \  <login-config>\n    <auth-method>BASIC</auth-method>\n  </login-config>\n</web-app>\n\
    ```\n\n上述条目意味着：\n\n1. 任何对匹配 `/secured/*` URL 的 HTTP GET 或 POST 请求都将受到安全限制。\n2.\
    \ 具有 manager 角色的人员将获得访问受保护资源的权限。\n3. `login-config` 元素用于描述 BASIC 形式的身份验证。\n\n\
    如果你正在浏览包括 `/security` 目录的任何 URL，将显示请求用户名和密码的对话框。如果你提供了用户 \"admin\" 和密码 \"secret\"\
    ，那么你就可以访问匹配 `/secured/` 的 URL，因为你已经定义了允许访问此资源的 manager 角色用户。\n\n## 基于表单的认证\n\n\
    当你使用该身份验证方法时，必须提供一个登录表单来提示用户输入用户名和密码。以下是 `login.jsp` 的简单代码。这有助于创建一个相同目的的表单——\n\
    \n```html\n<html>\n<body bgcolor=\"#ffffff\">\n\n<form method=\"POST\" action=\"\
    j_security_check\">\n<table>\n  <tr>\n    <td>Login (登录)</td>\n    <td><input\
    \ type=\"text\" name=\"j_username\"></td>\n  </tr>\n  <tr>\n    <td>Password (密码)</td>\n\
    \    <td><input type=\"password\" name=\"j_password\"></td>\n  </tr>\n</table>\n\
    <input type=\"submit\" value=\"Login! (登录!)\">\n</form>\n\n</body>\n</html>\n\
    ```\n\n你必须确保登录表单必须包含 name 命名为 `j_username` 和 `j_password` 的表单元素（等等，更正：代码中写的是 `j_username`\
    \ 和 `j_password`，所以是 `j_username` 和 `j_password`）。`<form>` 标签中的 `action` 必须是 `j_security_check`。\n\
    \n必须使用 POST 作为表单方法。同时，你将不得不修改`<login-config>` 标签将 `auth-method` 指定为 FORM ——\n\n\
    ```xml\n<web-app>\n  ...\n  <security-constraint>\n    <web-resource-collection>\n\
    \      <web-resource-name>SecuredBookSite</web-resource-name>\n      <url-pattern>/secured/*</url-pattern>\n\
    \      <http-method>GET</http-method>\n      <http-method>POST</http-method>\n\
    \    </web-resource-collection>\n    <auth-constraint>\n      <description>Let\
    \ only managers use this app</description>\n      <role-name>manager</role-name>\n\
    \    </auth-constraint>\n  </security-constraint>\n  <security-role>\n    <role-name>manager</role-name>\n\
    \  </security-role>\n  <login-config>\n    <auth-method>FORM</auth-method>\n \
    \   <form-login-config>\n      <form-login-page>/login.jsp</form-login-page>\n\
    \      <form-error-page>/error.jsp</form-error-page>\n    </form-login-config>\n\
    \  </login-config>\n</web-app>\n```\n\n如果你正在浏览包括 `/security` 目录的任何 URL，将显示请求用户名和密码的对话框。如果你提供了用户\
    \ \"admin\" 和密码 \"secret\"，那么你就可以访问匹配 `/secured/` 的 URL，因为你已经定义了允许访问此资源的 manager\
    \ 角色用户。\n\n（注：原文中存在多处重复段落，已按要求去重处理）\n\n"
