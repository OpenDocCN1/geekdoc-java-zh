- md: "\n6. The web server forwards the HTTP response to your browser in terms of\
    \ static HTML content.\n7. Finally, the web browser handles the dynamically-generated\
    \ HTML page inside the HTTP response exactly as if it were a static page.\n\n\
    All the mentioned steps can be seen in the following diagram –\n\n![](img/74dc853ebf79a1ba6264764c7e97f221_13_0.png)\n\
    \nTypically, the JSP engine checks to see whether a servlet for a JSP file already\
    \ exists and whether the modification date on the JSP is older than the servlet.\
    \ If the JSP is older than its generated servlet, the JSP container assumes that\
    \ the JSP hasn't changed and that the generated servlet still matches the JSP's\
    \ contents. This makes the process more efficient than with the other scripting\
    \ languages (such as PHP) and therefore faster.\n\nIn a way, a JSP page is just\
    \ another way to write a servlet without having to be a Java programming wiz.\
    \ Except for the translation phase, a JSP page is handled exactly like a regular\
    \ servlet.\n\n## Chapter - 4 : Lifecycle\n\nIn this chapter, we will discuss the\
    \ life cycle of JSP. The key to understanding the low-level functionality of JSP\
    \ is to understand the simple life cycle they follow. This is similar\n\na JSP\
    \ life cycle is defined as the process from its creation to the destruction. A\
    \ servlet life cycle with an additional step which is required to compile a JSP\
    \ into servlet.\n\n## Paths Followed By JSP\n\nFollowing are the paths followed\
    \ by a JSP –\n\n- 1. Compilation\n2. Initialization\n3. Execution\n4. Cleanup\n\
    \nThe four major phases of a JSP life cycle are very similar to the Servlet Life\
    \ Cycle. The four phases have been described below –\n\n![](img/74dc853ebf79a1ba6264764c7e97f221_14_0.png)\n\
    \n## JSP Compilation\n\nWhen a browser asks for a JSP, the JSP engine first checks\
    \ to see whether it needs to compile the page. If the page has never been compiled,\
    \ or if the JSP has been modified since it was last compiled, the JSP engine compiles\
    \ the page.\n\nThe compilation process involves three steps –\n\n- 1. Parsing\
    \ the JSP.\n2. Turning the JSP into a servlet.\n3. Compiling the servlet.\n\n\
    ## JSP Initialization\n\nWhen a container loads a JSP it invokes the **jspinit()**\
    \ method before servicing requests. If you need to perform JSP-specific initialization,\
    \ override the **jspinit()** method –\n\n```java\npublic void jspinit() {\n  \
    \  // Initialization code...\n}\n```\n\nTypically, initialization is performed\
    \ only once and as with the servlet init method, you generally initialise database\
    \ connections, open files, and create lookup tables in the jspinit method.\n\n\
    ## JSP Execution\n\nThis phase of the JSP life cycle represents all interactions\
    \ with requests until the JSP is destroyed.\n\nWhenever a browser requests a JSP\
    \ and the page has been loaded and initialised, the JSP engine invokes the **_jspService()**\
    \ method in the JSP.\n\nThe **_jspService()** method takes an **HttpRequest**\
    \ and an **HttpResponse** as its parameters as follows –\n\n```\nvoid _jspService(HttpServletRequest\
    \ request, HttpServletResponse response) {\n    // Service handling code...\n\
    }\n```\n\nThe jspService method of a JSP is invoked on request basis. This is\
    \ responsible for generating the response for that request and this method is\
    \ also responsible for generating responses to all of the HTTP methods, i.e. GET,\
    \ POST, DELETE, etc.\n\n## JSP Cleanup\n\nThe destruction phase of the JSP life\
    \ cycle represents when a JSP is being removed from use by a container.\n\nThe\
    \ jspDestroy method is the JSP equivalent of the destroy method for servlets.\
    \ Override jspDestroy when you need to perform any cleanup, as releasing database\
    \ connections or opening files.\n\nThe jspDestroy() method has the following form\
    \ –\n\n```java\npublic void jspDestroy() {\n    // Your cleanup code goes here.\n\
    ```\n\n## Chapter - 5 : Syntax\n\nIn this chapter, we will discuss Syntax in JSP.\
    \ We will understand the basic use of syntax (i.e. elements) involved with JSP\
    \ development.\n\n## Elements of JSP\n\nThe elements of JSP have been described\
    \ below –\n\n## The Scriptlet\n\nA scriptlet can contain any number of JAVA language\
    \ statements, variable or method declarations, or expressions that are valid in\
    \ the page scripting language.\n\nFollowing is the syntax of Scriptlet –\n\n```\n\
    <% code fragment %>\n```\n\nYou can write the XML equivalent of Scriptlet –\n\n\
