    # The config Object


    The config object is an instantiation of javax.servlet.ServletConfig and is a
    direct wrapper around the ServletConfig object for the generated servlet.


    This object allows the JSP programmer access to the Servlet or JSP engine initialization
    parameters such as the paths or file locations.


    The following config method is the only one you might ever use, and its usage
    is trivial:

    `config.getServletName();`


    This returns the servlet name, which is the string contained in the <servlet-name>
    element defined in the WEB-INF/web.xml file.


    # The pageContext Object


    The pageContext object is an instance of javax.servlet.PageContext object. The
    pageContext object is used to represent the entire JSP page.


    This object is intended as a means to access information about the page while
    avoiding most of the implementation details.


    This object stores the request and response objects for each request. The application,
    config, session, and objects are derived by accessing attributes of this object.


    The pageContext object also contains information about the directives issued to
    the JSP page, including the buffering information, errorPageURL, and page scope.


    The pageContext defines several fields, including PAGE_SCOPE, REQUEST_SCOPE, SESSION_SCOPE,
    and APPLICATION_SCOPE, which support more than 40 methods, about half of which
    are inherited from the javax.servlet.jsp.JspContext class.


    One of the important methods is removeAttribute. This method accepts either one
    or two arguments. For example, `pageContext.removeAttribute("attrName")` removes
    the attribute from all scopes, while the following code removes it from the page
    scope – `pageContext.removeAttribute("attrName", PAGE_SCOPE);`


    The use of pageContext can be checked in JSP - File Uploading chapter.


    # The page Object


    This object is an actual reference to the instance of the page. It can be thought
    of as an object that represents the entire JSP page.


    The page object is really direct synonym for this object.


    # The exception Object


    The exception object is a wrapper containing the exception thrown from the previous
    page. It is typically used to generate an appropriate response to the error condition.


    We will cover the complete usage of this object in the JSP - Exception Handling
    chapter.


    # Chapter - 9 : Client Request


    In this chapter, we will discuss Client Requests in JSP. When a browser requests
    for a Webpage, it sends a lot of information to the web server. This information
    cannot be read directly because this information travels as a part of the header
    of the HTTP request. You can check HTTP Protocol for more information on this.


    Following table lists out the important header information which comes from the
    browser. This information is frequently used in web programming –


    | S.No. | Header & Description |

    | --- | --- |

    | 1 | Accept | This header specifies the MIME types that the browser or other
    clients can handle. Values of image/png or image/jpeg are the two most common
    possibilities. |

    | 2 | Accept-Charset | This header specifies the character sets that the browser
    can use to display the information. For example, ISO-8859-1. |

    | 3 | Accept-Encoding | This header specifies the types of encodings that the
    browser knows how to handle. Values of gzip or compress are the two most common
    possibilities. |

    | 4 | Accept-Language | This header specifies the client''s preferred languages
    in case the servlet produces results in more than one language. For example en-us,
    etc. |

    | 5 | Authorization | This header is used by clients to identify themselves when
    accessing password-protected webpages. |

    | 6 | Connection | This header indicates whether the client can handle persistent
    HTTP connections. Persistent connections permit the client or other browser to
    retrieve multiple files with a single request. A value of Keep-Alive means that
    persistent connections should be used. |

    | 7 | Content-Length | This header is applicable only to POST requests and gives
    the size of the POST data in bytes. |

    | 8 | Cookie | This header returns cookies to servers that previously sent them
    to the browser. |

    | 9 | Host | This header specifies the host and port as in the original URL. |

    | 10 | If-Modified-Since | This header indicates that the client wants the page
    only if it has changed after the specified date. The server sends a code, 304
    which means Not Modified header if no newer is available. |

    | 11 | If-Unmodified-Since | This header is the reverse of If-Modified-Since;
    it specifies that the operation should succeed only if the document is older than
    the specified date. |

    | 12 | Referrer | This header indicates the URL of the referring webpages. For
    example. |

    | 13 | User-Agent | This header identifies the browser and other clients. |


    # The HttpServletRequest


    The request object is an instance of javax.servlet.http.HttpServletRequest. The
    request object provides methods to get information.


    | S.No. | Method & Description |

    | --- | --- |

    | 1 | getCookies() | Returns an array containing all the Cookie objects sent.
    |

    | 2 | getHeaderNames() | Returns an enumeration of the headers. |

    | 3 | getHeader(String name) | Returns the value of the specified request header
    as a String. |

    | 4 | getParameterNames() | Returns an enumeration of the parameters. |

    | 5 | getSession() | Returns the session associated with this request. |

    | 6 | getSession(boolean create) | Returns the current session, or if there is
    no session, creates one. |

    | 7 | getLocale() | Returns the preferred Locale. |

    | 8 | getAttribute(String name) | Returns the value of the named attribute as
    an Object. |

    | 9 | getInputStream() | Retrieves the body of the request using binary data.
    |

    | 10 | getAuthType() | Returns the name of the authentication scheme used to protect
    the servlet. |

    | 11 | getCharacterEncoding() | Returns the name of the character encoding used
    in the body. |

    | 12 | getContentType() | Returns the MIME type of the body of the request. |

    | 13 | getPath() | Returns the portion of the request URI that indicates the context.
    |

    | 14 | getServletPath() | Returns the part of this request''s URL that calls the
    JSP. |

    | 15 | getMethod() | Returns the name of the HTTP method request made. |

    | 16 | getParameter(String name) | Returns the value of a request parameter as
    a String. |

    | 17 | getParameterValues(String name) | Returns an array of values for the given
    parameter. |

    | 18 | getPathInfo() | Any extra path information associated with the URL. |

    | 19 | getProtocol() | Returns the name and version of the protocol request uses.
    |

    | 20 | getQueryString() | Returns the query string that is contained in the request
    URL after the path. |

    | 21 | getRemoteAddr() | Returns the Internet Protocol (IP) address of the client
    that sent the request. |

    | 22 | getRemoteHost() | Returns the fully qualified name of the client that sent
    the request. |

    | 23 | getRemoteUser() | Returns the login of the user making this request. |

    | 24 | getURI() | Returns the part of this request''s URL from the protocol name
    up to the query string. |

    | 25 | getRequestedId() | Returns the session ID identified by the client. |

