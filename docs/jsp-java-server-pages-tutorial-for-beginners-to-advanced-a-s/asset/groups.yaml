    # # Chapter - 30 : XML Data


    When you send the XML data via HTTP, it makes sense to use JSP to handling and
    outgoing XML documents; for example, RSS documents. As an XML document is merely
    a bunch of text, creating one through a JSP is much easier than creating an HTML
    document.


    # ## Sending XML from a JSP


    You can send the XML content using JSPs the same way you send HTML. The only difference
    is that you must set the content type of your page to text/xml. To set the content
    type, use the `<@page%>` like this –


    ```

    <@page contentType = "text/xml">

    ```


    Following example will show how to send XML content to the browser -


    ```

    <@page contentType = "text/xml">

    ```


    ```

    <books>

    <book>

    ```'
