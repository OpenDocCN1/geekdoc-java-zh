    the client sent with this request. |

    | 2 | Enumeration getAttributeNames() Returns an enumeration containing the names
    of the attributes available to this request. |

    | 3 | Enumeration getHeaderNames() Returns an enumeration of all the headers this
    request contains. |

    | 4 | Enumeration getParameterNames() Returns an enumeration of String objects
    containing the names of the parameters contained in this request. |

