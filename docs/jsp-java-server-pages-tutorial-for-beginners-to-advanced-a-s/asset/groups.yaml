    7. Finally, the web browser handles the dynamically-generated HTML page inside
    the HTTP response exactly as if it were a static page.


    All the mentioned steps can be seen in the following diagram –


    ![](img/74dc853ebf79a1ba6264764c7e97f221_13_0.png)


    Typically, the JSP engine checks to see whether a servlet for a JSP file already
    exists and whether the modification date on the JSP is older than the servlet.
    If the JSP is older than its generated servlet, the JSP container assumes that
    the JSP hasn''t changed and that the generated servlet still matches the JSP''s
    contents. This makes the process more efficient than with the other scripting
    languages (such as PHP) and therefore faster.


    In a way, a JSP page is just another way to write a servlet without having to
    be a Java programming wiz. Except for the translation phase, a JSP page is handled
    exactly like a regular servlet.


    # # Chapter - 4 : Lifecycle


    In this chapter, we will discuss the life cycle of JSP. The key to understanding
    the low-level functionality of JSP is to understand the simple life cycle they
    follow. This is similar


    a JSP life cycle is defined as the process from its creation to the destruction.
    A servlet life cycle with an additional step which is required to compile a JSP
    into servlet.


    # ## Paths Followed By JSP


    Following are the paths followed by a JSP –


    +   1. Compilation

    2. Initialization

    3. Execution

    4. Cleanup


