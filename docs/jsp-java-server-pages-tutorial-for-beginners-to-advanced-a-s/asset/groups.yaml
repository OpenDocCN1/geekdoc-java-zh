    </div>

    </body>

    </html>

    ```


    ## Locale Specific Percentage


    You can use the java.text.NumberFormat class and its static getInstanceOf() method
    to get locale specific percentages. Following examples show how format percentage
    to a given locale -


    ```jsp

    <%@ page import = "java.io.*,java.util.Locale" %>

