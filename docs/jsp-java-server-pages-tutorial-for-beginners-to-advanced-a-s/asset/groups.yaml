    # # The HttpServletRequest


    The request object is an instance of a java.servlet.http.HttpServletRequest object.
    Each time a client requests a page, the JSP engine creates a new object to represent
    that request.


    The request object provides methods to get HTTP header information including form
    cookies, HTTP methods, etc.

    Following table lists out the important methods that can be used to read HTTP
    header in your JSP program. These methods are available with the HttpServletRequest
    object which represents clients to the web server.


    | S.No. | Method & Description |

    |---|---|

