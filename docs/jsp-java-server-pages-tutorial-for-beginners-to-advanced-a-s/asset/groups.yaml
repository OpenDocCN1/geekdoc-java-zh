    # Chapter - 32 : Custom Tags


    In this chapter, we will discuss the Custom Tags in JSP. A custom tag is a user-defined
    JSPnlanguage element. When a JSP page containing a custom tag is translated into
    a servlet,

    tag is converted to operations on an object called a tag handler. The Web container
    then invokes those operations when the JSP page''s servlet is executed.


    JSP tag extensions allow you to create new tags that you can insert directly into
    a JavaScript Page. The JSP 2.0 specification introduced the Simple Tag Handlers
    for writing these custom tags.


    To write a custom tag, you can simply extend the SimpleTagSupport class and override
    the doTag() method, where you can place your code to generate content for the
    tag.


    # Create "Hello" Tag


    Consider you want to define a custom tag name <ex:Hello> and you want to use it
    in the

    fashion without a body –


    <ex:Hello>


    To create a custom JSP tag, you must first create a Java class that acts as a
    tag handler.

    ow we create the HelloTag class as follows –


    ```

    package com.tutorialpoint;


    import javax.servlet.jsp.tagext.*;

    import javax.servlet.jsp.*;

    import java.io.*;


    public class HelloTag extends SimpleTagSupport {

    ```'
