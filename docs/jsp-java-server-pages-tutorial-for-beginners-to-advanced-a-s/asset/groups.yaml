    # # Chapter - 23 : Page Redirecting


    In this chapter, we will discuss page redirecting with JSP. Page redirection is
    generally used when a document moves to a new location and we need to send the
    client to this new location. This can be because of load balancing, or for simple
    randomization.


    The simplest way to request to another page is by using `sendRedirect()` method
    of response object. Following is the signature of this method –


    ```

    public void response.sendRedirect(String location)

    throws IOException

    ```


    This method sends back the response to the browser with the status code and new
    page location. You can also use the `setStatus()` and the `setHeader()` methods
    together to achieve the same redirection example


    ```

    String site = "http://www.newpage.com";

    response.setStatus(response.SC_MOVED_TEMPORARILY);

    response.setHeader("Location", site);

    ```'
  - '[PAGE 75]


    # Example


    This example shows how JSP performs page redirection to another location —


    ```

    <%@ page import = "java.io.*,java.util.*" %>

    <html>

    <head>

    <title>Page Redirection</title>

    </head>

    <body>

    <center>

    <h1>Page Redirection</h1>

    </center>

    <%

    // New location to be redirected

    String site = new String("http://www.photofuntools.com");

    response.setStatus(response.SC_MOVED_TEMPORARILY);

    response.setHeader("Location", site);

    %>

    </body>

    </html>

    ```


    Let us now use the above code in PageRedirection.jsp and this JSP using the URL
    http://localhost:8080/PageRedirection.jsp. This would take you to the given URL
    http://www.photofuntools.com.


    # Chapter - 24 : Hits Counter


    In this chapter, we will discuss Hits Counter in JSP. A hit counter tells you
    about the number of visitors on a particular page of your web site. Usually you
    attach a hit counter with your index.jsp page assuming you first land on your
    home page.


    To implement a hit counter you can make use of the Application Implicit object
    and associated methods getAttribute() and setAttribute().


    This object is a representation of the JSP page through its entire lifecycle.
    This object is created when the JSP page is initialised and will be removed the
    JSP page by the jspDestroy() method.


    Following is the syntax to set a variable at application level —napplication.setAttribute(String
    Key, Object Value);


    You can use the above method to set a hit counter variable and reset the same
    variable. Following is the method to read the variable set by the previous method
    —napplication.getAttribute(String Key);


    Every time a user accesses your page, you can read the current value of the hit
    counter and increase it by one and again it for future use.'
