    - 2. 它应该是可序列化的，并实现 `Serializable` 接口。\n- 3. 它可能有许多可读或可写的属性。\n- 4. 它可能为属性提供许多“getter”和“setter”方法。\n\
    \n# JavaBean 属性\n\nJavaBean 属性是可以被对象用户访问的命名属性。该属性可以是任何 Java 数据类型，包括你定义的类。JavaBean\
