    # The taglib Directive


    The Java Pages API allows you to define custom JSP tags that look like HTML or
    XML

    tags a tag library is a set of user-defined tags that implement custom behaviour.


    The taglib declares that your JSP page uses a set of custom tags, identifies the

    location of the library, and provides means for identifying the custom tags in
    your JSP page.


    The taglib directive follows the syntax given below –

    <@ taglib uri="prefixOffTag" >


    Here, the uri attribute resolves to a location that the container understands
    and the

    prefix attribute informs what bits of markup are custom actions.


    You can write the XML equivalent of the above syntax as follows –

    <jsp:directive.taglib uri = "uri" prefix = "prefixOffTag" />


    For more details related to the taglib directive, check the Taglib Directive.


