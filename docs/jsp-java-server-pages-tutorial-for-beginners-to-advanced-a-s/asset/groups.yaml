    # Chapter - 35 : Exception Handling


    In this chapter, We will discuss how to handle exceptions in JSP. When you are
    writing a JSP code, you might make coding errors which can occur at any part of
    the code. There may occur the following type of errors in your JSP code –


    # Checked exceptions


    A checked exception is an exception that is typically a user error or a problem
    that cannot be foreseen by the programmer. For example, if a file is to be opened,
    but the file cannot be found, an exception occurs. These exceptions cannot simply
    be ignored at the time of compilation.'
  - "[PAGE 110]\n\n# Runtime exceptions\n\nA runtime exception is an exception that\
    \ probably could have been avoided by the programmer. As opposed to the checked\
    \ exceptions, runtime exceptions are ignored at the time of compilation.\n\n#\
    \ Errors\n\nThese are not exceptions at all, but problems that arise beside the\
    \ control of the user or the programmer. Errors are typically ignored in your\
    \ code because you can rarely do anything about an error. For example, if a stack\
    \ overflow occurs, an error will arise. These are also ignored at the time of\
    \ compilation.\n\nWe will further discuss ways to handle runtime exception/error\
    \ occuring in your JSP code.\n\n# Using Exception Object\n\nThe exception object\
    \ is an instance of a subclass of Throwable (e.g., java.lang.NullPointerException)\
    \ and is only available in error pages. Following table lists out the important\
    \ methods available in the Throwable class.\n\n| S.No. | Methods & Description\
    \ |\n| 1 | public String getMessage()\\n Returns a detailed message about the\
    \ exception that has occurred. This message is initialised in the Throwable constructor.\
    \ |\n| 2 | public Throwable getCause()\\n Returns the cause of the exception as\
    \ represented by a Throwable object. |\n| 3 | public String toString()\\n Returns\
    \ the name of the class concatenated with the result of getMessage(). |\n| 4 |\
    \ public void printStackTrace()\\n Prints the result of toString() along with\
    \ the stack trace to System.err, the error output stream. |\n| 5 | public StackTraceElement\
    \ [] getStackTrace()\n Returns an array containing each element on the stack trace.\
    \ 0 represents the top of the call stack, and the last element in the array represents\
    \ the method at the bottom of the call stack. |\n| 6 | public Throwable fillStackTrace()\\\
    n Fills the stack trace of this Throwable object with the current stack trace,\
    \ adding any previous information in the stack trace. |\n\nJSP gives you an option\
    \ to specify Error Page for each. Whenever the page throws an exception, the JSP\
    \ container automatically invokes the error page.\n\nFollowing is an example to\
    \ specify an error page for a main.jsp. To set up an error page, use <%@ page\
    \ errorPage = \"xxx\" %> directive.\n\n```\n<html>\n<head>\n<title>Error Handling\
    \ Example</title>\n</head>\n```"
