    # # Chapter - 1: Overview


    # ## What are JavaServer Pages?


    JavaServer Pages (JSP) is a technology for developing Web Pages that supports
    dynamic content. This helps developers insert java code in HTML pages by making
    use of special JSP tags, most of which start with %< and end with %>.


    A JavaServer Pages component is a type of Java servlet that is designed to fulfil
    the role of a user interface for a web application. Developers write JSPs as text
    files that combine HTML or XHTML code, XML elements, and embedded JSP actions
    and commands.


    Using JSP, you can collect input from users through Web Page forms, present records
    from a database or another source, and create Web Pages dynamically.


    JSP tags can be used for a variety of purposes, such as retrieving information
    from a database or registering user preferences, accessing JavaBeans, passing
    control between pages, and sharing information between requests, etc.


    # ## Why JSP?


    JavaServer Pages often serve the same purpose as pages implemented using the Common
    Gateway Interface (CGI). But JSP offers several advantages in comparison with
    CGI.


    +   1. Performance is significantly better because JSP allows embedding Dynamic
    Elements in HTML Pages instead of having separate CGI files.

    2. JSP are compiled before they are processed by the server unlike CGI/Perl which
    requires the server to load an interpreter and the target script each time the
    page is requested.

    3. JavaServer Pages are built on top of the Java Servlets API, so like Servlets,
    JSP also has access to all the powerful Enterprise Java APIs, including JDBC,
    JNDI, EJB, JAXP, etc.

    4. JSP can be used in combination with servlets that handle the business logic,
    the model supported by Java servlet template engines.


    Finally, JSP is an integral part of Java EE, a complete platform for enterprise
    class applications. This means JSP can play a role in the simplest applications
    to the most complex and demanding.


    # ## Advantages of JSP


    Following table lists out the other advantages of using JSP over other technologies
    —


    # ### vs. Active Server Pages (ASP)


    The advantages of JSP are twofold. First, the dynamic part is written in Java,
    not Visual Basic or other MS specific language, so it is more powerful and easier
    to use. Second, it is portable to other operating systems and non-Microsoft Web
    servers.


    # ### vs. Pure Servlets


    It is more convenient to write (and to modify!) regular HTML than to have plenty
    of printing statements that generate the HTML.


    # ### vs. Server-Side Includes (SSI)'
- md: '

    SSI is really intended for simple inclusions, not for "real" programs that use
    data, make database connections, and the like.


    ## vs. JavaScript


    JavaScript can generate HTML dynamically on the client but can hardly interact
    with the web server to perform complex tasks like database access and image processing
    etc.


    ## vs. Static HTML


    Regular HTML of, course, cannot contain dynamic information.


    ## What is Next?


    I would take you step by step to set up your environment to start with JSP. I''m
    assuming you have good hands on experience with Java Programming to proceed with
    learning JSP.


    If you are not aware of Java Programming Language, then we would recommend you
    go through your Java Tutorial to understand Java Programming.


    ## Chapter - 2 : Environment Setup


    A development environment is where you would develop your JSP programs, test them
    and finally run them.


    This tutorial will guide you to setup your JSP development environment which involves
    the following steps


    ### Setting up Java Development Kit


    This step involves downloading an implementation of the Java Software Development
    Kit (SDK) and setting up the PATH environment variable appropriately.


    You can download the SDK from Oracle''s Java site – Java SE Downloads.


    Once you download your Java implementation, follow the given instructions to install
    and configure the setup. Finally, the PATH and JAVA_HOME environment variables
    to refer to the directory that contain java and javac, typically java_install_dir/bin
    and java_install_dir respectively.


    If you are running Windows and install the SDK in jdk1.5.0_20, you need to add
    the line in your C:\autocec.bat file.


    ```

    set PATH = C:\jdk1.5.0_20;bin;%PATH%

    set JAVA_HOME = C:\jdk1.5.0_20

    ```


    Alternatively, on Windows NT/2000/XP, you can also right-click on My Computer,
    select Properties, then Advanced, followed by Environment Variables. Then, you
    would update the PATH value and press the OK button.


    On Unix (Solaris, Linux, etc.), if the SDK is installed in /usr/local/jdk1.5.0_20
    and you use the C shell, you will put the following into .shrc file.


    ```

    setenv PATH /usr/local/jdk1.5.0_20/bin:$PATH

    setenv JAVA_HOME /usr/local/jdk1.5.0_20

    ```


    Alternatively, if you use an Integrated Development Environment (IDE) like Borland
    JBuilder, IntelliJ IDEA, or Sun ONE Studio, compile and run a simple program to
    confirm that the IDE knows where you installed Java.


    ### Setting up Web Server: Tomcat


    A number of Web Servers that support JavaServer Pages and Servlets development
    are available in the market. Some web servers can be downloaded for free and Tomcat
    is one of them.


    Apache Tomcat is an open source software implementation of the JavaServer Pages
    and Servlet technologies and can act as a standalone server for testing JSP and
    Servlets, and can be integrated with the Apache Web Server. Here are the steps
    to set up Tomcat on your machine


    - 1. Download the latest version of Tomcat from https://tomcat.apache.org/

    - 2. Once you downloaded the installation, unpack the binary distribution into
    a convenient location. For example, in **C:\apache-tomcat-5.5.29 on windows**,
    or **/usr/local/apache-tomcat-5.5.29** on Linux/Unix and create **CATALINA_HOME**
    environment variable pointing to these locations.


    Tomcat can be started by executing the following commands on the Windows machine
    —

    %CATALINA_HOME%bin/startup.bat


    ```

    C:\apache-tomcat-5.5.29\bin\startup.bat

    ```


    Tomcat can be started by executing the following commands on the Unix (Solaris,
    Linux, etc.) machine —

    $CATALINA_HOME/bin/startup.sh


    ```

    /usr/local/apache-tomcat-5.5.29/bin/startup.sh

    ```


    After a successful startup, the default web-applications included with Tomcat
    will be available by visiting **http://localhost:8080/**.

    Upon execution, you will receive the following output —


    ## Apache Tomcat


    ![](img/74dc853ebf79a1ba6264764c7e97f221_11_0.png)


    If you''re seeing this page via a browser, it means you''ve setup Tomcat successfully.
    Congratulations!


    As you have guessed now, this is the default Tomcat home page. It can be found
    on the local filesystem at:


    ```

    CATALINA_HOME=/webapps/root/index.html

    ```


    If "CATALINA_HOME" is not the path to the Tomcat installation directory you''re
    seeing this page on, then you should set the CATALINA_HOME environment variable
    correctly, or ask an administrator who has gone to set it up right. Referring
    to the table, in case, please refer to the Tomcat Documentation for more detailed
    setup and administration information.


    NOTE: For security reasons, the web manager is restricted to users with role "manager".
    Users are defined in CATALINA_HOME/conf/tomcat-users.xml.


    Tomcat includes several Sample Servlets and JSPs (with associated source code),
    extensive documentation, and an introductory guide to developing web applications.


    Tomcat mailing lists are available at the Tomcat project site:


    - users@apache.org for general questions regarding configuring and using Tomcat

    - dev@apache.org for developers working on Tomcat


    For using Tomcat:


    ![](img/74dc853ebf79a1ba6264764c7e97f221_11_1)


    Further information about configuring and running Tomcat can be found here, as
    well as on the Tomcat site.


    Tomcat can be started by executing the following commands on the Windows machine
    —

    %CATALINA_HOME%bin/startup.bat


    ```

    C:\apache-tomcat-5.5.29\bin\startup.bat

    ```


    or


    Tomcat can be started by executing the following commands on the Unix (Solaris,
    Linux, etc.) machine —

    $CATALINA_HOME/bin/startup.sh


    ```

    /usr/local/apache-tomcat-5.5.29/bin/startup.sh

    ```


    ### Setting up CLPATH


    Since servlets are not part of the Java Platform, Standard Edition, you must identify
    the servlet classes to the compiler. If you are running Windows, you need to put
    the following lines in C:\autocec.bat file.


    ```

    set CATALINA_HOME = C:\apache-tomcat-5.5.29

    set CLPATH = %CATALINA_HOME%\common\lib\jsp-api.jar;%CLASPATH%

    ```


    Alternatively, on Windows NT/2000/XP, you can also right-click on My Computer,
    select Properties, then Advanced, followed by Environment Variables. Then, you
    would update the CLPATH value and press the OK button.


    On Unix (Solaris, Linux, etc.), if the SDK is installed in /usr/local/jdk1.5.0_20
    and you use the C shell, you will put the following into .shrc file.


    ```

    setenv CATALINA_HOME /usr/local/apache-tomcat-5.5.29

    setenv CLPATH $CATALINA_HOME/common/lib/jsp-api.jar:$CLASPATH

    ```


    NOTE – Assuming that your working directory is C:\jspdev (Windows) or /use/jspdev
    (Unix), then you would need to add these directories as well in CLPATH.


    ## Chapter - 3 : Architecture


    The web server needs a JSP engine, i.e., a container to process JSP pages. The
    JSP container is responsible for intercepting requests for JSP pages. This tutorial
    makes use of Apache which has a built-in JSP container to support JSP development.


    A JSP container works with the Web server to provide the runtime environment and
    other services your JSP pages. It knows how to understand the special elements
    that are part of JSPs. Following diagram shows the position of JSP containers
    and JSP files in a Web application.


    ![](img/74dc853ebf79a1ba6264764c7e97f221_12_0)


    ## JSP Processing


    The following steps explain how the web server creates the Webpage using JSP –


    - 1. With a normal page, your browser sends an HTTP request to the web server.

    - 2. The web server recognizes the HTTP request is for a JSP page and forwards
    it to a JSP engine. This is done by using URL or JSP page which ends with .jsp
    instead of .html.

    - 3. The JSP engine loads the JSP page from disk and converts it into a servlet
    content. This conversion is very simple in which all template text is converted
    to print() statements and all JSP elements are converted to Java code. This code
    implements the corresponding dynamic behaviour of the page.

    - 4. The JSP engine compiles the servlet into an executable class and forwards
    the original request to a servlet engine.

    - 5. A part of the web server called the servlet engine loads the Servlet class
    and executes it. During execution, the servlet produces an output in HTML format.
    The output is further passed on the web server by the servlet engine inside an
    HTTP response.

