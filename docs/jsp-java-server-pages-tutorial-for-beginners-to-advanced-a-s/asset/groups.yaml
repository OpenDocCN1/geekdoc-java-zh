    | 1 | getPropertyName() 例如，如果属性是 `firstName`，你的方法名将是 `getFirstName()` 以读取该属性。该方法称为访问器（accessor）。setPropertyName()\
    \ 例如，如果属性是 `firstName`，你的方法名将是 `setName()` 以写入该属性。该方法称为变变器（mutator）。 |\n\n只读属性只有\
    \ `getProperty()` 方法，只写属性只有 `setProperty()` 方法。\n\n# JavaBean 示例\n\n考虑一个带有属性的学生类：\n\
    \n```java\npackage com.tutorial.point;\npublic class StudentsBean implements java.io.Serializable\
