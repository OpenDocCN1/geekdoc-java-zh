    ## Chapter - 10 : Server Response


    In this chapter, we will discuss the Server Response in JSP. When a Web server
    responds to a HTTP request, the response typically consists of a status line,
    some response headers, a blank line, and the document. A typical response looks
    like this --


    ```

    HTTP/1.1 200 OK

    Content-Type: text/html

    Header2: ...

    ```


    ```

    HeaderN: ...

    (Blank Line)

    <!doctype ...>

    <html>

    <head>...</head>

    <body>

    ...

    </body>

    </html>

    ```


    The status line consists of the HTTP version (HTTP/1.1 in the example), a status
    code (200 in the example), and a very short message message corresponding to the
    status code (OK in the example).


    Following is a summary of the most useful HTTP 1.1 response headers which go back
    to the browser from the web server. These headers are frequently used in web programming
    –


    | S.No. | Header & Description |

    | --- | --- |

    | 1 | **Allow** | This header specifies the request methods (GET, POST, etc.)
    that the server supports. |

    | 2 | **Cache-Control** | This header specifies the circumstances in which the
    response document can be cached. It can have public, private or no-cache etc.
    Public means document is cacheable, Private means document is for a single user
    and can only be stored in proxy (nonshared) caches and no-cache means document
    should never be cached. |

    | 3 | **Connection** | This header instructs the browser whether to use persistent
    HTTP connections or not. A value of close instructs the browser not to use persistent
    connections and keep-alive means using persistent connections. |

    | 4 | **Content-Disposition** | This header lets you request that the browser
    asks the user to save the response to a file of the given name. |

    | 5 | **Content-Encoding** | This header specifies the way in which the page was
    encoded during transmission. |

    | 6 | **Content-Language** | This header signifies the language in which the document
    is written. For example, en, en-us, ru, etc. |

    | 7 | **Content-Length** | This header indicates the number of bytes in the response.
    This information is needed only if the browser is using a persistent (keep-alive)
    HTTP connection. |

    | 8 | **Content-Type** | This header gives the MIME (Multipurpose Internet Mail
    Extension) type of the response document. |

    | 9 | **Expires** | This header specifies the time at which the content should
    be considered out-of-date and no longer cached. |

    | 10 | **Last-Modified** | This header indicates when the document was last changed.
    The client can then cache the document and supply a date by an If-Modified-Since
    request header in later requests. |

    | 11 | **Location** | This header should be included with all responses that have
    a status code in the 300s. This notifies the browser of the document address.
    The browser automatically reconnects to this location and retrieves the new document.
    |

    | 12 | **Refresh** | This header specifies how soon the browser should ask for
    an updated page. You can specify time in the number of seconds after which a page
    would be refreshed. |

    | | Retry-After | This header can be used in conjunction with a 503 (Service Unavailable)
    response to tell the client how it can repeat its request. |

    | | Set-Cookie | This header specifies a cookie associated with the page. |


    ## The HttpServletResponse Object


    The response object is an instance of a javax.servlet.http.HttpServletResponse
    object. as the server creates the request object, it also creates an object to
    represent the response to the client.


    The response object also defines the interfaces for dealing with new HTTP headers.
    Through this object, the JSP programmer can add new cookies or date stamps, HTTP
    status codes etc.


    The following methods can be used to set HTTP response header in your servlet
    program. These methods represent the server response.


    | S.No. | Method & Description |

    | --- | --- |

    | 1 | String encodeURL(String url) Encodes the URL for use in the sendRedirect
    method or, if encoding is not, returns the URL |

    | 2 | String encodeRedirect(String url) Encodes the URL for use in the sendRedirect
    method or, if encoding is not, returns the URL |

    | 3 | boolean containsHeader(String name) Returns a boolean whether the named
    header has been set. |

    | 4 | boolean isCommitted() Returns a boolean if the response has been committed.
    |

    | 5 | void addCookie(Cookie cookie) Adds the cookie to the response. |

    | 6 | void addDateHeader(String name, long date) Adds a response header with the
    given name and date-value. |

    | 7 | void setHeader(String name, String value) Adds a response header with the
    given name and value. |

    | 8 | void setIntHeader(String name, int value) Adds a response header with the
    given name and integer value. |

    | 9 | void flushBuffer() Forces any content in the buffer to be written to the
    client. |

    | 10 | void reset() Clears any data that exists in the buffer as well as the status
    code. |


