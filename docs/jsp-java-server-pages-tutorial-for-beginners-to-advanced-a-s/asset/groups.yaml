    # SQL Tags


    The JSP SQL tag library provides tags for interacting with relational databases
    (RDBMSs) such as Oracle, MySQL or Microsoft SQL Server.


    Following is the syntax to include JSTL SQL library in your JSP – <%@ taglib prefix="sql"
    uri="http://java.sun.com/jsp/jstl/sql">


    Following table lists the SQL JSTL Tags –


    | S.No. | Tag & Description |

    | 1 | <sql:setDataSource> Creates a simple DataSource suitable only for prototyping
    |

    | 2 | <sql:query> Executes the SQL query defined in its body or through the sql
    attribute. |

    | 3 | <sql:update> Executes the SQL update defined in its body or through the
    sql attribute. |

    | 4 | <sql:param> Sets a parameter in an SQL statement to the specified value.
    |

    | 5 | <sql:dateParam> Sets a parameter in an SQL statement to the specified java.util.Date
    value. |

    | 6 | <sql:transaction> Provides nested database action elements with a shared
    Connection, set up to execute all statements as one transaction. |


    # XML tags


    The JSTL tags provide a JSP-centric way of creating and manipulating the XML documents.
    Following is the syntax to include the JSTL XML library in your JSP.


    The JSTL XML tag library has custom tags for interacting with the XML data. This
    includes parsing the XML, transforming the XML data, and the flow control based
    on the XPath expressions.'
