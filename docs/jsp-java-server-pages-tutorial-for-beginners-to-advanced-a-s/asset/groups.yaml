    # # Chapter - 39 : Internationalisation| i18n| l10n


    In this chapter, we will discuss the concept of Internationalisation in JSP. Before
    we proceed, let us understand the three important terms –


    +   - **Internationalisation (i18n)** – This means enabling a website to provide
    different versions of content translated into the visitor''s language or nationality.

    - **Localization (l10n)** – This means adding resources to a website to adapt
    it to a particular geographical or cultural region, for example Hindi translation
    to a web site.

    - **locale** – This is a particular cultural or geographical region. It is usually
    referred to as a language symbol followed by a country symbol which is separated
    by an'
- md: '

    underscore. For example, "en_US" represents an English locale for the US.


    There are a number of items which should be taken care of while building up a
    global Website. This tutorial will not give you detail on this but will give you
    a good example on how you can offer your Webpage in different languages to the
    internet community by differentiating their location, i.e., locale.


    A JSP can pick up an appropriate version of the site based on the requester''s
    locale and provide an appropriate site version according to the local language,
    culture and requirements. Following is the method of request object which returns
    the Locale object. java.util.Locale.getLocale()


    ## Detecting Locale


    Following are the important locale methods which you can use to detect requester''s
    location, language and of course locale. All the below methods display the country
    name and language set in the requester''s browser.


    | S.No. | Method & Description |

    |---|---|

    | 1 | **String getCountry()**

    This method returns the country/region code in upper case for this locale in ISO
    3166 2-letter format. |

    | 2 | **String getDisplayCountry()**

    This method returns a name for the locale''s country that is appropriate for display
    to the user. |

    | 3 | **String getLanguage()**

    This method returns the language code in lower case for this locale in ISO 639
    format. |

    | 4 | **String getDisplayLanguage()**

    This method returns a name for the locale''s language that is appropriate for
    display to the user. |

    | 5 | **String getISO3Country()**

    This method returns a three-letter abbreviation for this locale''s country. |

    | 6 | **String getISO3Language()**

    This method returns a three-letter abbreviation for this locale''s language. |


    ## Example


    The following example shows how to display a language and associated country for
    a request in JSP -


    ```jsp

    <%@ page import = "java.io.*,java.util.Locale" %>

    <%@ page import = "javax.servlet.*,javax.servlet.http.*" %>

    <%

    // Get the client''s Locale

    Locale locale = request.getLocale();

    String language = locale.getLanguage();

    String country = locale.getCountry();

    %>

    ```


    ```jsp

    <html>

    <head>

    <title>Detecting Locale</title>

    </head>

    <body>

    <center>

    <h1>Detecting Locale</h1>

    </center>

    <p align="center">

    <%

    out.print("Language : " + language + "<br/>");

    out.print("Country : " + country + "<br/>");

    %>

    </p>

    </body>

    </html>

    ```


    ## Languages Setting


    A JSP can output a page written in a Western European language such as English,
    Spanish, German, French, Italian, Dutch etc. Here it is important to set Content-Language
    header to display all the characters properly.


    Another important point is to display all the special characters using HTML entities;
    for example, "&241;" represents "ñ", and "&161;" represents "¡" as follows –


    ```jsp

    <%@ page import = "java.io.*;java.util.Locale" %>

    <%@ page import = "javax.servlet.*,javax.servlet.http.*" %>

    ```


    ```jsp

    // Set response content type

    response.setContentType("text/html");

    ```


