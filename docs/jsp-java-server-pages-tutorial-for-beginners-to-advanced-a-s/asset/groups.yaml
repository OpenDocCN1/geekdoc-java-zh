    # Chapter - 17 : Cookies Handling


    In this chapter, we will discuss Cookies Handling in JSP. Cookies are text files
    stored on the client computer and they are kept for various information tracking
    purposes. JSP transparently supports HTTP cookies using underlying servlet technology.


    There are three steps involved in identifying and returning users –


    +   1. Server script sets a set of cookies to the browser. For example, name,
    age, or identification number, etc.

    2. Browser stores this information on the local machine for future use.

    3. When the next time the browser sends any request to the web server then it
    sends those cookies information to the server and uses that information to identify
    the user or may for some other purpose as well.


    This chapter will teach you how to set or reset cookies, how to access them and
    delete them using JSP programs.


    # The Anatomy of a Cookie


    Cookies are usually set in an HTTP header (although JavaScript can also set a
    cookie on a browser). A JSP that sets a cookie might send headers that look like
    this –


    ```

    HTTP/1.1 200 OK

    Date: 04 Feb 2000 21:03:38 GMT

    Server: Apache/1.3.9 (UNIX) PHP/4.0b3

    Set-Cookie: name = xyz; expires = Friday, 04-Feb-2000 22:03:38 GMT; path = /;
    domain = tutorials.com

    Connection: close

    Content-Type: text/html

    ```


    As you can see, the Set-Cookie header contains a name value pair, a GMT date,
    and path. The name will be URL encoded. The expires field is an instruction to
    the browser to "forget" the cookie given that time and date.


    If the browser is configured to store cookies, it will keep this information until
    the expiry date. If the user points the browser to any page that matches the path
    and domain, it will resend the cookie to the server. The browser’s headers might
    look something like this –


    ```

    GET / HTTP/1.0

    Connection: Keep-Alive

    User-Agent: Mozilla/4.6 (X11; Linux 2.2.6-15p mac ppc)

    Host: zink.demoon.com:1126

    ```


    ```

    Accept: image/gif,/*

    Accept-Encoding: gzip

    Accept-Language: en

    Accept-Charset: iso-8859-1,*utf-8

    ```'
