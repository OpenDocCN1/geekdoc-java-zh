    # Chapter - 31 : JavaBeans


    A JavaBean is a specially constructed Java class written in Java and coded according
    to the JavaBeans API specifications.


    Following are the unique characteristics that distinguish a JavaBean from other
    Java classes


    +   - 1. It provides a default, no-argument constructor.

    - 2. It should be serializable and which can implement the Serializable interface.

    - 3. It may have a number of properties that can be read or written.

    - 4. It may have a number of "getter" and "setter" methods for the properties.'
  - "[PAGE 98]\n\n# JavaBeans Properties\n\nA JavaBean property is a named attribute\
    \ that can be accessed by the user of the object. The attribute can be of any\
    \ Java data type, including the classes that you define.\n\nA JavaBean may be\
    \ read, write, read only, or write only. JavaBean properties are accessed through\
    \ two methods in the JavaBean's implementation class —\n\n| S.No. | Method & Description\
    \ |\n|---|---|\n| 1 | getPropertyName() For example, if the property is firstName,\
    \ your method name would getFirstName() to read that property. This method is\
    \ called accessor. setPropertyName() For example, if the property is firstName,\
    \ your method name would be setName() to write that property. This method is called\
    \ mutator. |\n\nA read-only attribute will have only a getPropertyName() method,\
    \ and a write-only attribute will have only a setPropertyName() method.\n\n# JavaBeans\
    \ Example\n\nConsider a student class with properties —\n\n```\npackage com.tutorial.point;\n\
    public class StudentsBean implements java.io.Serializable {\n    private String\
    \ firstName = null;\n    private String lastName = null;\n    private int age\
    \ = 0;\n\n    public StudentsBean() {\n    }\n    public String getFirstName()\
    \ {\n        return firstName;\n    }\n    public String getLastName() {\n   \
    \     return lastName;\n    }\n    public int getAge() {\n        return age;\n\
    \    }\n    public void setFirstName(String firstName) {\n        this.firstName\
    \ = firstName;\n    }\n    public void setLastName(String lastName) {\n      \
    \  this.lastName = lastName;\n    }\n    public void setAge(Integer age) {\n \
    \       this.age = age;\n    }\n}\n```\n\n# Accessing JavaBeans"
- md: "\nThe useBean action declares a JavaBean for use in a JSP. Once declared, the\
    \ bean becomes a scripting variable that can be accessed by scripting elements\
    \ and other custom tags used in the JSP. The full syntax for the useBean tag is\
    \ as follows\n\n```\n<jsp:useBean id = \"bean's name\" scope = \"bean's scope\"\
    \ typeSpec/>\n```\n\nHere values for the scope attribute can be a page, request,\
    \ session or application based on your requirement. The value of the id attribute\
    \ may be any value as long as it is a unique name among other useBean declarations\
    \ in the same JSP.\n\nFollowing example shows how to use the useBean action\n\n\
    ```html\n<html>\n<head>\n<title>useBean Example</title>\n</head>\n<body>\n<jsp:useBean\
    \ id = \"date\" class = \"java.util.Date\" />\n<p>The date/time is <%= date %></p>\n\
    </body>\n</html>\n```\n\nYou will receive the following result --\nThe date/time\
    \ is Thu 30 11:18:11 GST 2010\n\n## Accessing JavaBeans Properties\n\nAlong with\
    \ <jsp:useBean...> action, you can use the <jsp:getProperty/> action to access\
    \ the methods. Here is the full syntax -\n\n```\n<jsp:useBean id = \"id\" class\
    \ = \"bean's class\" scope = \"bean's scope\">\n<jsp:setProperty name = \"bean's\
    \ id\" property = \"property name\" value = \"value\"/>\n<jsp:getProperty name\
    \ = \"bean's id\" property = \"property name\"/>\n</jsp:useBean>\n```\n\nThe attribute\
    \ references the id of a JavaBean previously introduced to the JSP by the useBean\
    \ action. The property attribute is the name of the get or the set methods that\
    \ should be invoked.\n\nFollowing example shows how to access the data using the\
    \ syntax -\n\n```html\n<html>\n<head>\n<title>get and set properties Example</title>\n\
    </head>\n<body>\n<jsp:useBean id = \"students\" class = \"com.tutorialspoint.StudentsBean\"\
    >\n<jsp:setProperty name = \"students\" property = \"firstName\" value = \"Zara\"\
    />\n<jsp:setProperty name = \"students\" property = \"lastName\" value = \"Ali\"\
    />\n<jsp:setProperty name = \"students\" property = \"age\" value = \"10\"/>\n\
    </jsp:useBean>\n\n<p>Student First Name:\n<jsp:getProperty name=\"students\" property=\"\
    firstName\"/>\n</p>\n\n<p>Student Last Name:\n<jsp:getProperty name=\"students\"\
    \ property=\"lastName\"/>\n</p>\n\n<p>Student Age:\n<jsp:getProperty name=\"students\"\
    \ property=\"age\"/>\n</p>\n\n</body>\n</html>\n```\n\nLet us now use StudentsBean.class\
    \ available in CLASSPATH. Access the above JSP. The following result will be displayed\
    \ –\n\nStudent First Name: Zara\n\nStudent Last Name: Ali\n\nStudent Age: 10\n\
    \n## Chapter - 3 : Custom Tags\n\nIn this chapter, we will discuss the Custom\
    \ Tags in JSP. A custom tag is a user-defined JSP language element. When a JSP\
    \ page containing a custom tag is translated into a servlet, the tag is converted\
    \ to operations on an object called a tag handler. The Web container then invokes\
    \ those operations when the JSP page's servlet is executed.\n\nJSP tag extensions\
    \ allow you to create new tags that you can insert directly into a JSP Page. The\
    \ JSP 2.0 specification introduced the Simple Tag Handlers for writing these custom\
    \ tags.\n\nTo write a custom tag, you can simply extend the SimpleTagSupport class\
    \ and override the doTag() method, where you can place your code to generate content\
    \ for the tag.\n\n## Create \"Hello\" Tag\n\nConsider you want to define a custom\
    \ tag name <ex:Hello> and you want to use it in the fashion without a body –\n\
    \n```html\n<ex:Hello>\n```\n\nTo create a custom JSP tag, you must first create\
    \ a Java class that acts as a tag handler. Now we create the HelloTag class as\
    \ follows –\n\n```java\npackage com.tutorialpoint;\n\nimport javax.servlet.jsp.tagext.*;\n\
    import javax.servlet.jsp.*;\nimport java.io.*;\n\npublic class HelloTag extends\
    \ SimpleTagSupport {\n    public void doTag() throws JspException, IOException\
    \ {\n        JspWriter out = getJspContext().getOut();\n        out.print(\"Hello\
    \ Tag!\");\n    }\n}\n```\n\nThe above code has simple coding where doTag() method\
    \ takes the current JspContext using the getJspContext() method and uses it to\
    \ send \"Hello Tag!\" to the current JspWriter object. Let us compare the above\
    \ class and copy it to a directory in the environment CLSPATH. Finally, create\
    \ the following library file: webapp/WEB-INF/custom.tld\n\n```xml\n<taglib>\n\
    \  <lib-version>1.0</lib-version>\n  <jsp-version>2.0</jsp-version>\n  <short-name>TLD</short-name>\n\
    \  <tag>\n    <name>Hello</name>\n    <class>com.tutorialpoint.HelloTag</class>\n\
    \    <body-content>empty</body-content>\n  </tag>\n</taglib>\n```\n\nLet us use\
    \ the above custom tag Hello in our JSP as follows –\n\n```jsp\n<%@ taglib prefix=\"\
    ex\" uri=\"WEB-INF/custom.tld\"%>\n<html>\n<head>\n<title>A sample custom tag</title>\n\
    </head>\n<body>\n  <ex:Hello/>\n</body>\n</html>\n```\n\nCall the above JSP and\
    \ this should produce following result –\nHello Tag!\n\n## Accessing the Tag Body\n\
    \nYou can include a message in the body of the tag as you have seen with standard\
    \ tags. Consider you want to define a custom tag named <ex:Hello> and you want\
    \ to use it in the following fashion with a body –\n\n```html\n<ex:Hello>\n  This\
    \ is message body\n</ex:Hello>\n```\n\nLet us make the following changes in the\
    \ above tag code to process the body of the tag –\n\n```java\npackage com.tutorialpoint;\n\
    import javax.servlet.jsp.tagext.*;\nimport javax.servlet.jsp.*;\nimport java.io.*;\n\
    \npublic class HelloTag extends SimpleTagSupport {\n    StringWriter sw = new\
    \ StringWriter();\n    public void doGetTag() throws JspException, IOException\
    \ {\n        getJspBody().invoke(sw);\n        getJspContext().getOut().println(sw.toString());\n\
    \    }\n}\n```\n\nHere, the output resulting from the invocation was first captured\
    \ into a StringWriter written to JspWriter associated with the tag. We need to\
    \ change TLD file as –\n\n```xml\n<taglib>\n  <lib-version>1.0</lib-version>\n\
    \  <jsp-version>2.0</jsp-version>\n  <short-name>Example TLD with Body</short-name>\n\
    \  <tag>\n    <name>Hello</name>\n    <class>com.tutorialpoint.HelloTag</class>\n\
    \    <body-content>scriptless</body-content>\n  </tag>\n</taglib>\n```\n\nLet\
    \ us now call the tag with proper body as follows –\n\n```jsp\n<%@ taglib prefix=\"\
    ex\" uri=\"WEB-INF/custom.tld\"%>\n<html>\n<head>\n<title>A sample custom tag</title>\n\
    </head>\n<body>\n  <ex:Hello>\n    This is a message body\n  </ex:Hello>\n</body>\n\
    </html>\n```\n\nYou will receive the following result –\nThis is message body\n\
    \n## Custom Tag Attributes\n\nYou can use various attributes along with your custom\
    \ tags. To accept an attribute value, a custom tag class needs to implement the\
    \ setter methods, identical to the JavaBean setter methods shown below –\n\n```java\n\
    package com.tutorialpoint;\nimport javax.servlet.jsp.tagext.*;\nimport javax.servlet.jsp.*;\n\
    import java.io.*;\n\npublic class HelloTag extends SimpleTagSupport {\n    private\
    \ String message;\n\n    public void setMessage(String msg) {\n        this.message\
    \ = msg;\n    }\n    StringBuilder sw = new StringBuilder();\n    public void\
    \ doTag() throws JspException, IOException {\n        if (message != null) {\n\
    \            /* Use message from attribute */\n            JspWriter out = getJspContext().getOut();\n\
    \            out.println(message);\n        } else {\n            /* use message\
    \ from the body */\n            getJspBody().invoke(sw);\n            getJspContext().getOut().println(sw.toString());\n\
    \        }\n    }\n}\n```\n\nThe attribute's name is \"message\", so the setter\
    \ method is setMessage(). Let us now add this attribute in the TLD using the <attribute>\
    \ element as follows –\n\n```xml\n<taglib>\n  <lib-version>1.0</lib-version>\n\
    \  <jsp-version>2.0</jsp-version>\n  <short-name>Example TLD with Body</short-name>\n\
    \  <tag>\n    <name>Hello</name>\n    <class>com.tutorialpoint.HelloTag</class>\n\
    \    <body-content>scriptless</body-content>\n    <attribute>\n      <name>message</name>\n\
    \    </attribute>\n  </tag>\n</taglib>\n```\n\nLet us use JSP with message attribute\
    \ as follows –\n\n```jsp\n<%@tag prefix=\"ex\" uri=\"WEB-INF/custom.tld\"%>\n\
    <html>\n<head>\n<title>A sample custom tag</title>\n</head>\n<body>\n<ex:Hello\
    \ message=\"This is custom tag\" />\n</body>\n</html>\n```\n\nThis will produce\
    \ the following-- the following result –\nThis is custom tag\n\nConsider including\
    \ the following properties for an attribute –\n\n| S.No. | Property & Purpose\
    \ |\n| --- | --- |\n| 1 | name: The element defines the name of an attribute.\
    \ Each attribute name must be unique for a particular tag. |\n| 2 | required:\
    \ This specifies if this attribute is required or an optional one. It would be\
    \ false for optional. |\n| 3 | rtexprvalue: Declares an expression value for a\
    \ tag attribute is valid |\n| 4 | type: Defines the java class-type of this attribute.\
    \ By default it is assumed as String |\n| 5 | description: Informational description\
    \ can be provided. |\n| 6 | fragment: Declares if this attribute value should\
    \ be treated as a JspFragment. |\n\nFollowing is the example to specify properties\
    \ related to an attribute –\n\n```xml\n<attribute>\n  <name>attribute_name</name>\n\
    \  <required>false</required>\n  <type>java.util.Date</type>\n  <fragment>false</fragment>\n\
    </attribute>\n```\n\nIf you are using attributes, then you can modify your TLD\
    \ as follows\n\n```xml\n<attribute>\n  <name>attribute_name1</name>\n  <required>false</required>\n\
    \  <type>java.util.Boolean</type>\n  <fragment>false</fragment>\n</attribute>\n\
    ```\n\n```xml\n<attribute>\n  <name>attribute_name2</name>\n  <required>true</required>\n\
    \  <type>java.util.Date</type>\n</attribute>\n```\n"
  mdcn: "\n\nuseBean 动作声明了一个用于 JSP 的 JavaBean。一旦声明完成，该 bean 就会变成一个脚本变量，可以被 JSP 中的脚本元素以及其他其他自定义标签访问。useBean\
    \ 标签的完整语法如下：\n\n```\n<jsp:useBean id = \"bean's name\" scope = \"bean's scope\"\
    \ typeSpec/>\n```\n\n根据你的需求，`scope` 属性的值可以是 `page`、`request`、`session` 或 `application`。`id`\
    \ 属性的值可以是任何值，只要它在同一个 JSP 的其他 useBean 声明中是唯一的。\n\n接下来的示例展示了如何使用 useBean 动作：\n\n\
    ```html\n<html>\n<head>\n<title>useBean Example</title>\n</head>\n<body>\n<jsp:useBean\
    \ id = \"date\" class = \"java.util.Date\" />\n<p>The date/time is <%= date %></p>\n\
    </body>\n</html>\n```\n\n你将获得以下结果 --\nThe date/time is Thu 30 11:18:11 GST 2010\n\
    \n## 访问 JavaBeans 属性\n\n除了 <jsp:useBean...> 动作外，你还可以使用 <jsp:getProperty/> 动作来访问方法。这里是完整语法：\n\
    \n```\n<jsp:useBean id = \"id\" class = \"bean's class\" scope = \"bean's scope\"\
    >\n<jsp:setProperty name = \"bean's id\" property = \"property name\" value =\
    \ \"value\"/>\n<jsp:getProperty name = \"bean's id\" property = \"property name\"\
    />\n</jsp:useBean>\n```\n\n属性引用了之前通过 useBean 动作引入 JSP 的 JavaBean 的 `id`。`property`\
    \ 属性是应该调用的 get 或 set 方法get。\n\n接下来的示例展示了如何使用该语法访问数据：\n\n```html\n<html>\n<head>\n\
    <title>get and set properties Example</title>\n</head>\n<body>\n<jsp:useBean id\
    \ = \"students\" class = \"com.tutorialspoint.StudentsBean\">\n<jsp:setProperty\
    \ name = \"students\" property = \"firstName\" value = \"Zara\"/>\n<jsp:setProperty\
    \ name = \"students\" property = \"lastName\" value = \"Ali\"/>\n<jsp:setProperty\
    \ name = \"students\" property = \"age\" value = \"10\"/>\n</jsp:useBean>\n\n\
    <p>Student First Name:\n<jsp:getProperty name=\"students\" property=\"firstName\"\
    />\n</p>\n\n<p>Student Last Name:\n<jsp:getProperty name=\"students\" property=\"\
    lastName\"/>\n</p>\n\n<p>Student Age:\n<jsp:getProperty name=\"students\" property=\"\
    age\"/>\n</p>\n\n</body>\n</html>\n```\n\n现在让我们使用 CLASSPATH 中可用 `StudentsBean.class`。访问上面的\
    \ JSP。将显示以下结果：\n\nStudent First Name: Zara\n\nStudent Last Name: Ali\n\nStudent\
    \ Age: 10\n\n## 第 3 章：自定义标签\n\n在本章中，我们将讨论 JSP 中的自定义标签。自定义标签是用户定义的 JSP 语言元素。当包含自定义标签的\
    \ JSP 页面被翻译成 servlet 时，该标签会被转换为对名为 tag handler（标签处理程序）的对象的操作。然后，当 JSP 页面的 servlet\
    \ 执行时，Web 容器会调用这些操作。\n\nJSP 标签扩展允许你创建可以直接插入 JSP 页面的新标签。JSP 2.0 规范引入了简单标签处理程序（Simple\
    \ Tag Handlers）来编写这些自定义标签。\n\n要编写自定义标签，你可以简单地扩展 `SimpleTagSupport` 类并重写 `doTag()`\
    \ 方法，在其中你可以放置用于生成标签内容的代码。\n\n## 创建 \"Hello\" 标签\n\n假设你想定义一个自定义标签名称 `<ex:Hello>`，并且你想以不带正体的方式使用它：\n\
    \n```html\n<ex:Hello>\n```\n\n要创建一个自定义 JSP 标签，必须先创建一个作为处理器的 Java 类。现在我们如下所示创建\
    \ `HelloTag` 类：\n\n```java\npackage com.tutorialpoint;\n\nimport javax.servlet.jsp.tagext.*;\n\
    import javax.servlet.jsp.*;\nimport java.io.*;\n\npublic class HelloTag extends\
    \ SimpleTagSupport {\n    public void doTag() throws JspException, IOException\
    \ {\n        JspWriter out = getJspContext().getOut();\n        out.print(\"Hello\
    \ Tag!\");\n    }\n}\n```\n\n上面的代码简单，`doTag()` 方法使用 `getJspContext()` 获取当前的 JspContext，并将\
    \ \"Hello Tag!\" 发送到当前的 JspWriter 对象。让我们将上述类拷贝到环境目录。最后，创建以下库文件：webapp/WEB-INF/custom.tld`\n\
    \n```xml\n<taglib>\n  <lib-version>1.0</lib-version>\n  <jsp-version>2.0</jsp-version>\n\
    \  <short-name>TLD</short-name>\n  <tag>\n    <name>Hello</name>\n    <class>com.tutorialpoint.HelloTag</class>\n\
    \    <body-content>empty</body-content>\n  </tag>\n</taglib>\n```\n\n让我们如下所示在\
    \ JSP 中使用上述自定义标签：\n\n```jsp\n<%@ taglib prefix=\"ex\" uri=\"WEB-INF/custom.tld\"\
    %>\n<html>\n<head>\n<title>A sample custom tag</title>\n</head>\n<body>\n  <ex:Hello/>\n\
    </body>\n</html>\n```\n\n调用上面的 JSP 将产生如下结果：\nHello Tag!\n\n## 访问标签体\n\n正如标准标签所示，你可以在标签体中包含消息。假设你想定义一个名为\
    \ `<ex:Hello>` 的自定义标签，并且你想以带有正体的方式使用它：\n\n```html\n<ex:Hello>\n  This is message\n\
    </ex:Hello>\n```\n\n让我们对上述标签代码进行以下更改以处理标签体：\n\n```java\npackage com.tutorialpoint;\n\
    import javax.servlet.jsp.tagext.*;\nimport javax.servlet.jsp.*;\nimport java.io.*;\n\
    \npublic class HelloTag extends SimpleTagSupport {\n    StringWriter sw = new\
    \ StringWriter();\n    public void doGetTag() throws JspException, IOException\
    \ {\n        getJspBody().invoke(sw);\n        getJspContext().getOut().println(sw.toString());\n\
    \    }\n}\n```\n\n在这里，调用产生的输出首先被捕获到与标签关联的 StringWriter 中。我们需要如下修改 TLD 文件：\n\n\
    ```xml\n<taglib>\n  <lib-version>1.0</lib-version>\n  <jsp-version>2.0</jsp-version>\n\
    \  <short-name>Example TLD with Body</short-name>\n  <tag>\n    <name>Hello</name>\n\
    \    <class>com.tutorialpoint.HelloTag</class>\n    <body-content>scriptless</body-content>\n\
    \  </tag>\n</taglib>\n```\n\n现在我们如下所示带正体调用标签：\n\n```jsp\n<%@ taglib prefix=\"\
    ex\" uri=\"WEB-INF/custom.tld\"%>\n<html>\n<head>\n<title>A sample custom tag</title>\n\
    </head>\n<body>\n  <ex:Hello>\n    This is a message body\n  </ex:Hello>\n</body>\n\
    </html>\n```\n\n你将获得以下结果：\nThis is message body\n\n## 自定义标签属性\n\n你可以与自定义标签一起使用各种属性。为了接受属性值，自定义标签类需要实现如下所示的\
    \ JavaBean setter 方法：\n\n```java\npackage com.tutorialpoint;\nimport javax.servlet.jsp.tagext.*;\n\
    import javax.servlet.jsp.*;\nimport java.io.*;\n\npublic class HelloTag extends\
    \ SimpleTagSupport {\n    private String message;\n\n    public void setMessage(String\
    \ msg) {\n        this.message = msg;\n    }\n    StringBuilder sw = new StringBuilder();\n\
    \    public void doTag() throws JspException, IOException {\n        if (message\
    \ != null) {\n            /* 使用属性中的消息 */\n            JspWriter out = getJspContext().getOut();\n\
    \            out.println(message);\n        } else {\n            /* 使用标签体中的消息\
    \ */\n            getJspBody().invoke(sw);\n            getJspContext().getOut().println(sw.toString());\n\
    \        }\n    }\n}\n```\n\n属性名为 \"message\"，所以 setter 方法是 `setMessage()`。现在我们使用\
    \ `<attribute>` 元素在 TLD 中添加此属性：\n\n```xml\n<taglib>\n  <lib-version>1.0</lib-version>\n\
    \  <jsp-version>2.0</jsp-version>\n  <short-name>Example TLD with Body</short-name>\n\
    \  <tag>\n    <name>Hello</name>\n    <class>com.tutorialpoint.HelloTag</class>\n\
    \    <body-content>scriptless</body-content>\n    <attribute>\n      <name>message</name>\n\
    \    </attribute>\n  </tag>\n</taglib>\n```\n\n让我们如下所示带 message 属性使用 JSP：\n\n\
    ```jsp\n<%@tag prefix=\"ex\" uri=\"WEB-INF/custom.tld\"%>\n<html>\n<head>\n<title>A\
    \ sample custom tag</title>\n</head>\n<body>\n<ex:Hello message=\"This is custom\
    \ tag\" />\n</body>\n</html>\n```\n\n这将产生以下结果--\nThis is custom tag\n\n考虑为属性包含以下属性：\n\
    \n| S.No. | Property & Purpose |\n| --- | --- |\n| 1 | name: 定义属性的名称。对于特定标签，每个属性名必须是唯一的。\
    \ |\n| 2 | required: 指定此属性是必须的还是可选的。可选为 false。 |\n| 3 | rtexprvalue: 声明标签属性的表达式值有效。\
    \ |\n| 4 | type: 定义属性的 java 类类型。默认假设为 String。 |\n| 5 | description: 可以提供信息性描述。\
    \ |\n| 6 | fragment: 声明此属性值应该被视为 JspFragment。 |\n\n以下是指定属性属性的示例：\n\n```xml\n<attribute>\n\
    \  <name>attribute_name</name>\n  <required>false</required>\n  <type>java.util.Date</type>\n\
    \  <fragment>false</fragment>\n</attribute>\n```\n\n如果你正在使用属性，可以如下修改你的 TLD：\n\n\
    ```xml\n<attribute>\n  <name>attribute_name1</name>\n  <required>false</required>\n\
    \  <type>java.util.Boolean</type>\n  <fragment>false</fragment>\n</attribute>\n\
    ```\n\n```xml\n<attribute>\n  <name>attribute_name2</name>\n  <required>true</required>\n\
    \  <type>java.util.Date</type>\n</attribute>\n```\n\n"
