    # Methods to Set HTTP Status Code


    Following methods can be used to set the HTTP Status Code in your servlet program.
    These methods are available with the HttpServletResponse object.


    | S.No. | Method & Description |

    | --- | --- |

    | 1 | **public void setStatus ( int statusCode )** this method sets an arbitrary
    status code. The setStatus method takes an int (the status code) as an argument.
    If your response includes a special status code and a document, be sure to call
    setStatus before returning any of the content with the PrintWriter |

    | 2 | **public void sendRedirect(String url)** this method generates a 302 response
    with a Location header giving the URL of the new document. |

    | 3 | **public void sendError(int code, String message)** this method sends a
    status code (usually 404) along with a short message that is automatically formatted
    inside an HTML document and sent to the client. |


    # HTTP Status Code Example


