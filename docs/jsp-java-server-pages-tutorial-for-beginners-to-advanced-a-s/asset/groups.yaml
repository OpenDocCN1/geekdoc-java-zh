    \n## 第 28 章：标准标签库 (JSTL) 教程\n\n在本章中，我们将理解 JSP 中不同的标签。Java 页面标签库 (JSTL) 是一组实用的\
    \ JSP 标签，它封装了许多 JSP 应用共同的核心功能。\n\nJSTL 支持常见的结构化任务，如迭代和条件、用于处理 XML 文档、国际化标签以及 SQL\
    \ 标签。它还提供了一个将现有自定义标签与 JSTL 标签集成框架。\n\n## 安装 JSTL 库\n\n要开始使用 JSP 标签，你首先需要安装 JSTL\
    \ 库。如果你使用的是 Tomcat 容器，请按照以下步骤操作：\n\n**步骤 1** – 下载 JSTL 分发。\n\n**步骤 2** – 将 JAR\
    \ 文件复制到你的目录。\n\n要使用任何这些标签，你需要在顶部包含 taglib 指令。\n\n## JSTL 标签分类\n\nJSTL 标签可以根据其功能分类为\n\
    \n1. 核心标签 (Core Tags)\n2. 格式化标签 (Formatting tags)\n3. SQL 标签 (SQL tags)\n4. XML\
    \ 标签 (XML tags)\n5. 函数 (Functions)\n\n## 核心标签\n\n核心标签组是最常用的标签。以下是包含核心库的语法：\n\n\
    ```jsp\n<%@taglib prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\"%>\n```\n\
    \n下表列出了核心标签\n\n| 序号. | 标签 & 描述 |\n|---|---|\n| 1 | <c:out> | 用于表达式。 |\n| 2 | <c:set>\
    \ | 在作用域内设置结果。 |\n| 3 | <c:remove> | 从特定的作用域移除变量。 |\n| 4 | <c:catch> | 捕获发生的 Throwable\
    \ 并可选地暴露。 |\n| 5 | <c:if> | 条件为真时执行主体的条件标签。 |\n| 6 | <c:choose> | 互斥操作标签，由 <when>\
    \ 和 <otherwise> 标记。 |\n| 7 | <c:when> | <choose> 的子标签，当条件为真时包含其主体。 |\n| 8 | <c:otherwise>\
    \ | <choose> 的子标签，当所有之前的条件为假时运行。 |\n| 9 | <c:import> | 获取绝对或相对 URL 并将其内容暴露给页面、String\
    \ 或 Reader。 |\n| 10 | <c:forEach> | 基础迭代标签，接受许多集合类型并支持子集功能。 |\n| 11 | <c:forTokens>\
    \ | 对由分隔符分隔的标记进行迭代。 |\n| 12 | <c:param> | 为 'import' 标签的 URL 添加参数。 |\n| 13 | <c:redirect>\
    \ | 重定向到一个 URL。 |\n| 14 | <c:url> | 创建带有可选查询参数的 URL |\n\n## 格式化标签\n\nJSTL 格式化标签用于格式国际化网站的文本、日期、时间和数字。以下是包含格式化库的语法：\n\
    \n```jsp\n<%@taglib prefix=\"fmt\" uri=\"http://java.sun.com/jsp/jstl/fmt\" %>\n\
    ```\n\n下表列出了格式化 JSTL 标签\n\n| 序号. | 标签 & 描述 |\n|---|---|\n| 1 | <fmt:formatNumber>\
    \ | 使用特定的精度或格式渲染数值值。 |\n| 2 | <fmt:parseNumber> | 解析数字、货币或百分比的字符串表示。 |\n| 3 |\
    \ <fmt:dateFormat> | 使用提供的样式和模式格式化日期和时间。 |\n| 4 | <fmt:parseDate> | 解析日期和时间的字符串表示。\
    \ |\n| 5 | <fmt:bundle> | 加载供其标签主体使用的资源包。 |\n| 6 | <fmt:setLocale> | 将给定的区域存储在区域配置变量中。\
    \ |\n| 7 | <fmt:setBundle> | |\n"
