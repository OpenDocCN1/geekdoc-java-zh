    Consider including the following properties for an attribute –


    | S.No. | Property & Purpose |

    | --- | --- |

    | 1 | name: The element defines the name of an attribute. Each attribute name
    must be unique for a particular tag. |

    | 2 | required: This specifies if this attribute is required or an optional one.
    It would be false for optional. |

    | 3 | rtexprvalue: Declares an expression value for a tag attribute is valid |

    | 4 | type: Defines the java class-type of this attribute. By default it is assumed
    as String |

    | 5 | description: Informational description can be provided. |

    | 6 | fragment: Declares if this attribute value should be treated as a JspFragment.


    Following is the example to specify properties related to an attribute –


    ```

    <attribute>

    <name>attribute_name</name>

    <required>false</required>

    <type>java.util.Date</type>

    <fragment>false</fragment>

    </attribute>

    ```


    If you are using attributes, then you can modify your TLD as follows


    ```

    <attribute>

    <name>attribute_name1</name>

    <required>false</required>

    <type>java.util.Boolean</type>

    <fragment>false</fragment>

    </attribute>

    ```


    ```

    <attribute>

    <name>attribute_name2</name>

    <required>true</required>

    <type>java.util.Date</type>

    </attribute>

    ```'
- md: "\n## Chapter - 33 : Expression Language (EL)\n\nJSP Expression Language (EL)\
    \ makes it possible to easily access application data stored in JavaBeans components,\
    \ JSP EL allows you to create expressions both (a) arithmetic and (b) logical.\
    \ Within a JSP expression, you can use integers, floating point numbers, strings,\
    \ the built-in constructs true and false for boolean values, and null.\n\n## Simple\
    \ Syntax\n\nTypically, when you specify an attribute value in a JSP tag, you simply\
    \ use a string. For example -\n\n```jsp own<jsp:setProperty name=\"box\" property=\"\
    perimeter\" value=\"100\"/>\n```\n\nJSP EL allows you to specify an expression\
    \ for any of these attribute values. A simple syntax for JSP EL is as follows\n\
    \n```\n${expr}\n```\n\nHere expr specifies the expression itself. The most common\
    \ operators in JSP EL are and and `[]`. These two operators allow you to access\
    \ various attributes of Java Beans and built-in objects.\n\nFor example, the above\
    \ syntax `<jsp:setProperty>` can be written with an expression like -\n\n```jsp\n\
    <jsp:setProperty name=\"box\" property=\"perimeter\"\nvalue=\"${2.box.width+2.height}\"\
    />\n```\n\nWhen the JSP compiles the `{}` form in an attribute, it generates code\
    \ to evaluate the expression and substitute the value of expression.\nYou can\
    \ also use the JSP EL expressions in template text for a tag. For example, the\
    \ `<jsp:text>` tag simply inserts its content within the body of a JSP. The following\
    \ `<jsp:text>` declaration inserts `<h1>Hello JSP!</h1>` into the JSP output -\n\
    \n```jsp\n<jsp:text>\n<h1>Hello JSP!</h1>\n</jsp:text>\n```\n\nYou can now include\
    \ a JSP expression in the body of a `<jsp:text>` tag (or any other tag) with the\
    \ same `{}` syntax you use for attributes. -\n\n```jsp\n<jsp:text>\nBox Perimeter:\
    \ is ${2.box.width + 2.box.height}\n</jsp:text>\n```\n\nEL expressions can use\
    \ parentheses to group subexpressions. For example, `${(1 + 2) * 3}` equals 9,\
    \ but 7.\n\nTo deactivate the evaluation of EL expressions, you specify the `isELIgnored`\
    \ attribute of the page directive - \n```jsp\n<% page isELIgnored = \"true/false\"\
    \ %>\n```\n\nThe valid values of this attribute are true and false. If it is true,\
    \ EL expressions are ignored when they appear in static text or tag attributes.\
    \ If it is false, EL expressions are evaluated by the container.\n\n## Basic Operators\
    \ in EL\n\nJSP Expression Language (EL) supports most of the arithmetic and logical\
    \ operators supported by Java. Following table lists out the most frequently used\
    \ operators –\n\n| S.No. | Operator & Description |\n|---|---|\n| 1 | . | Access\
    \ a bean property or Map entry |\n| 2 | [] | Access an array or List element |\n\
    | 3 | () | Group a subexpression to change the evaluation order |\n| 4 | + | Addition\
    \ |\n| 5 | - | Subtraction or negation of a value |\n| 6 | * | Multiplication\
    \ |\n| 7 | / or div | Division |\n| 8 | % or mod | Modulo (remainder) |\n| 9 |\
    \ == or eq | Test for equality |\n| 10 | != or ne | Test for inequality |\n| 11\
    \ | < or lt | Test for less than |\n| 12 | > or gt | Test for greater than |\n\
    | 13 | <= or le | Test for less than or equal |\n| 14 | >= or ge | Test for greater\
    \ than or equal |\n| 15 | && or and | Test for logical AND |\n| 16 | || or or\
    \ | Test for logical OR |\n| 17 | ! or not | Unary Boolean complement |\n| 18\
    \ | empty | Test for empty variable values |\n\n## Functions in JSP EL\n\nJSP\
    \ EL allows you to use functions in expressions as well. These functions must\
    \ be defined in the custom tag libraries. A function usage has the following syntax\
    \ –\n`${ns:func(param1, param2, ...)}`\n\nWhere ns is the namespace of the function,\
    \ func is the name of the function and param1 is the first parameter value. For\
    \ example, the function `fn:length`, which is part of the JSTL library. This function\
    \ can be used as follows to get the length of a string.\n\n```jsp\n${fn:length(\"\
    Get my length\")}\n```\n\nTo use a function any tag library (standard or custom),\
    \ you must install library on your server and must include the library in your\
    \ JSP using the `<taglib>` directive as explained in the JSTL chapter.\n\n## JSP\
    \ EL Implicit Objects\n\nThe JSP expression language supports the following implicit\
    \ objects –\n\n| S.No | Implicit object & Description |\n|---|---||\n| 1 | pageScope\
    \ | Scoped variables from page scope |\n| 2 | requestScope | Scoped variables\
    \ from request scope |\n| 3 | sessionScope | Scoped variables from session scope\
    \ |\n| 4 | applicationScope | Scoped variables from application scope |\n| 5 |\
    \ param | Request parameters as strings |\n| 6 | paramValues | Request parameters\
    \ as collections of strings |\n| 7 | header | HTTP request headers as strings\
    \ |\n| 8 | headerValues | HTTP request headers as collections of strings |\n|\
    \ 9 | initParam | Context-initialization parameters |\n| 10 | cookie | Cookie\
    \ values |\n\n## pageContext\n\n11 The JSP PageContext object for the current\
    \ page\n\nYou can use these objects in an expression as if they were variables.\
    \ The examples that follow will help you understand the concepts –\n\n### The\
    \ pageContext Object\n\nThe pageContext object gives you access to the pageContext\
    \ JSP object. Through the pageContext object, you can access the request object.\
    \ For example, to access the incoming query string for a request, you can use\
    \ the following expression –\n\n```jsp\n${pageContext.request.queryString}\n```\n\
    \n### The Scope Objects\n\nThe pageScope, requestScope, sessionScope, and applicationScope\
    \ variables provide access to variables stored at each scope.\n\nFor example,\
    \ if you need to explicitly access the box variable in the application scope,\
    \ you can access it through the applicationScope variable as applicationScope.box.\n\
    \n### The param and paramValues Objects\n\nThe param and paramValues objects give\
    \ you access to the parameter values normally available through the request.getParameter\
    \ and request.getParameterValues methods.\n\nFor example, to access a parameter\
    \ named order, use the expression ${param.order} or ${param[\"order\"]}\n\nFollowing\
    \ is an example to access a request parameter username\n\n```jsp\n<%@page import\
    \ = \"java.io.*,java.util.*\" %>\n<% String title = \"Accessing Request Param\"\
    ; %>\n\n<html>\n<head>\n<title><% out.print(title); %></title>\n</head>\n<body>\n\
    <!-- Content goes here -->\n</body>\n</html>\n```\n\n### The param and paramValues\
    \ Objects\n\nThe param and paramValues objects give you access to the parameter\
    \ values normally available through the request.getParameter and request.getParameterValues\
    \ methods.\n\nFor example, to access a parameter named order, use the expression\
    \ ${param.order} or ${param[\"order\"]}\n\nFollowing is an example to access a\
    \ request parameter username\n\n```jsp\n<%@page import = \"java.io.*,java.util.*\"\
    \ %>\n<% String title = \"Accessing Request Param\"; %>\n\n<html>\n<head>\n<title><%\
    \ out.print(title); %></title>\n</head>\n<body>\n<!-- Content goes here -->\n\
    </body>\n</html>\n```\n\n### The param and paramValues Objects\n\nThe param and\
    \ paramValues objects give you access to the parameter values normally available\
    \ through the request.getParameter and request.getParameterValues methods.\n\n\
    For example, to access a parameter named order, use the expression ${param.order}\
    \ or ${param[\"order\"]}\n\nFollowing is an example to access a request parameter\
    \ username\n\n```jsp\n<%@page import = \"java.io.*,java.util.*\" %>\n<% String\
    \ title = \"Accessing Request Param\"; %>\n\n<html>\n<head>\n<title><% out.print(title);\
    \ %></title>\n</head>\n</head>\n<body>\n<!-- Content goes here -->\n</body>\n\
    </html>\n```\n\n### The param and paramValues Objects\n\nThe param and paramValues\
    \ objects give you access to the parameter values normally available through the\
    \ request.getParameter and request.getParameterValues methods.\n\nFor example,\
    \ to access a parameter named order, use the expression ${param.order} or ${param[\"\
    order\"]}\n\n## Chapter - 34 : User Example\n\n## Chapter - 35 : Exception Handling\n\
    \nIn this chapter, We will discuss how to handle exceptions in JSP.\n\nJSP gives\
    \ you an option to specify Error Page for each. Whenever the page throws an exception,\
    \ the JSP container automatically invokes the error page.\n\n### Checked exceptions\n\
    \nA checked exception is an exception that is typically a user error that cannot\
    \ be foreseen. For example, if a file is to be opened, but the file cannot be\
    \ found, an exception occurs. These exceptions cannot simply be ignored.\n\n###\
    \ Runtime exceptions\n\nA runtime exception is an exception that probably could\
    \ have been avoided by the programmer. As opposed to the checked exceptions, runtime\
    \ exceptions are ignored at the time of compilation.\n\n### Errors\n\nThese are\
    \ not exceptions at all, but problems that arise beside the control of the user.\
    \ Errors are typically ignored in your code because you can rarely do anything\
    \ about. For example, if a stack overflow occurs, an error will arise.\n\n###\
    \ Using Exception Object\n\nThe exception object is an instance of a subclass\
    \ of Throwable (e.g., java.lang.NullPointerException) and is only available in\
    \ error pages. Following table lists out the important methods available in the\
    \ Throwable class.\n\n| S.No. | Methods & Description |\n|---|---|\n| 1 | public\
    \ String getMessage() | Returns a detailed message about the exception that has\
    \ occurred. This message is initialised in the Throwable constructor. |\n| 2 |\
    \ public Throwable getCause() | Returns the cause of the exception as represented\
    \ by a Throwable object. |\n| 3 | public String toString() | Returns the name\
    \ of the class concatenated with the result of getMessage(). |\n| 4 | public void\
    \ printStackTrace() | Prints the result of toString() along with the stack trace\
    \ to System.err, the error output stream. |\n| 5 | public StackTraceElement []\
    \ getStackTrace() | Returns an array containing each element on the stack trace.\
    \ 0 represents the top of the call stack, and the last element in the array represents\
    \ the method at the bottom of the call stack. |\n| 6 | public Throwable fillStackTrace()\
    \ | Fills the stack trace of this Throwable object with the current stack trace,\
    \ adding any previous information in the stack trace. |\n"
  mdcn: "\n\n## 第 33 章节：表达式语言 (EL)\n\nJSP 表达式语言 (EL) 使得能够轻松访问存储在 JavaBeans 组件中的应用程序数据，JSP\
    \ EL 允许你创建 (a) 算术表达式和 (b) 逻辑表达式。在 JSP 表达式中，你可以使用整数、浮点数、字符串、用于布尔值的内置构造 true true\
    \ 和 false，以及 `null`。\n\n## 简单语法\n\n通常，当你在 JSP 标签中指定属性值时，你直接使用字符串。例如 -\n\n```jsp\n\
    <jsp:setProperty name=\"box\" property=\"perimeter\" value=\"100\"/>\n```\n\n\
    JSP EL 允许你为这些任何一个属性值指定表达式。JSP EL 的简单语法如下\n\n```\n${expr}\n```\n\n这里 `expr` 指定的是表达式本身。JSP\
    \ EL 中最常用的运算符是 `and` 和 `[]`。这两个运算符允许你访问 Java Beans 和内置对象的各种属性。\n\n例如，上述语法 `<jsp:setProperty>`\
    \ 可以用表达式写为 -\n\n```jsp\n<jsp:setProperty name=\"box\" property=\"perimeter\"\n\
    value=\"${2.box.width+2.height}\"/>\n```\n\n当 JSP 编译属性中的 `{}` 形式时，它会生成代码来评估表达式并替换表达式的值。\n\
    你还可以在标签的模板文本中使用 JSP EL 表达式。例如，`<jsp:text>` 标签简单地将其内容插入到 JSP 的正文中。以下 `<jsp:text>`\
    \ 声明将 `<h1>Hello JSP!</h1>` 插入到 JSP 输出中 -\n\n```jsp\n<jsp:text>\n<h1>Hello JSP!</h1>\n\
    </jsp:text>\n```\n\n你现在可以使用与用于属性时相同的 `{}` 语法，在 `<jsp:text>` 标签（或任何其他标签）的正文中包含一个\
    \ JSP 表达式。-\n\n```jsp\n<jsp:text>\nBox Perimeter: is ${2.box.width + 2.box.height}\n\
    </jsp:text>\n```\n\n（注）\n\nEL 表达式可以使用括号来分组子表达式。例如，`${(1 + 2) * 3}` 等于 9，而不是 7。\n\
    \n要禁用 EL 表达式的评估，你只需指定页面指令的 `isELIgnored` 属性 - \n```jsp\n<% page isELIgnored =\
    \ \"true/false\" %>\n```\n\n该属性的有效值为 `true` 和 `false`。如果是 `true`，当 EL 表达式出现在静态文本或标签属性中时将会被忽略。如果是\
    \ `false`，EL 表达式将由容器评估。\n\n## EL 中的基本运算符\n\nJSP 表达式语言 (EL) 支持 Java 支持的大多数算术和逻辑运算符。下表列出了最常用的运算符\
    \ –\n\n| 序号 | 运算符 & 描述 |\n|---|---|\n| 1 | . | 访问 bean 属性或 Map 条目 |\n| 2 | []\
    \ | 访问数组或 List 元素 |\n| 3 | () | 分组子表达式以改变评估顺序 |\n| 4 | + | 加法 |\n| 5 | - | 减法或值的取反\
    \ |\n| 6 | * | 乘法 |\n| 7 | / or div | 除法 |\n| 8 | % or mod | 取模（余数） |\n| 9 | ==\
    \ or eq | 测试相等性 |\n| 10 | != or ne | 测试不相等性 |\n| 11 | < or lt | 测试小于 |\n| 12 |\
    \ > or gt | 测试大于 |\n| 13 | <= or le | 测试小于或等于 |\n| 14 | >= or ge | 测试大于或等于 |\n\
    | 15 | && or and | 测试逻辑与 AND |\n| 16 | || or or | 测试逻辑或 OR |\n| 17 | ! or not\
    \ | 一元布尔取反 |\n| 18 | empty | 测试变量值为空 |\n\n## JSP EL 中的函数\n\nJSP 表达式语言 (EL) 允许在表达式中使用函数。这些函数定义在自定义标签库中。函数的用法语法如下\
    \ –\n`${ns:func(param1, param2, ...)}`\n\n`ns` 是函数的命名空间，`func` 是函数名，`param1` 是第一个参数。例如，函数\
    \ `fn:length` 是 JSTL 库的一部分。该函数可以用于获取字符串的长度。\n\n```jsp\n${fn:length(\"my string\"\
    )}\n```\n\n要使用任何函数库（标准或自定义），你必须在服务器上安装库，并在 JSP 中使用 `<taglib>` 指令，如 JSTL 章节中所说明的那样\n\
    \n## JSP EL 隐式对象\n\nJSP 表达式语言支持以下隐式对象 –\n\n| 序号 | 隐式对象 & 描述 |\n|---|---|\n| 1\
    \ | pageScope | page 范围变量 |\n| 2 | requestScope | request 范围变量 |\n| 3 | sessionScope\
    \ | session 范围变量 |\n| 4 | applicationScope | application 范围变量 |\n| 5 | param |\
    \ 字符串格式的参数 |\n| 6 | paramValues | 集合格式的参数 |\n| 7 | header | 字符串格式 请求头 |\n| 8 |\
    \ headerValues | 集合格式的请求头 |\n| 9 | init | 初始化参数 |\n| 10 | cookie | Cookie 值 |\n\
    \n## pageContext\n\n当前页面的 PageContext 对象你可以像使用变量一样在表达式中使用这些对象。以下示例将帮助你理解这些概念 –\n\
    \n### pageContext 对象\n\npageContext 对象提供了对 pageContext 对象的访问。通过 pageContext 对象，你可以访问请求对象。例如，要访问请求的查询字符串，可以使用以下表达式\
    \ –\n\n```jsp\n${pageContext.request.queryString}\n```\n\n### 范围对象 (Scope Objects)\n\
    \npageScope、requestScope、sessionScope 和 applicationScope 变量提供了对每个范围内变量的访问。例如，如果你需要显式访问\
    \ application 范围中的变量，可以通过 applicationScope.box 进行访问。\n\n### param 和 paramValues\
    \ 对象\n\nparam 和 paramValues 对象提供了对通过 request.getParameter 和 request.getParameterValues\
    \ 方法通常获取的参数值的访问。例如，要访问名为 `order` 的参数，使用表达式 `${param.order}` 或 `${param[\"order\"\
    ]}`\n\n```jsp\n<%@page import = \"java.io.*,java.util.*\" %>\n<% String title\
    \ = \"Accessing Request Param\"; %>\n\n<html>\n<head>\n<title><% out.print(title);\
    \ %></title>\n</head>\n<body>\n<!-- 这里是内容 -->\n</body>\n</html>\n\n## 第 34 章节：用户示例\n\
    \n## 第 35 章节：异常处理\n\n在本章节中，我们将讨论如何在 JSP 中处理异常。\n\nJSP 提供选项为每个页面指定错误页面 (Error Page)。每当页面抛出异常时，JSP\
    \ 容器会自动调用错误页面。\n\n### 检查异常 (Checked exceptions)\n\n检查异常通常是无法预见的用户错误。例如，如果要打开一个文件但找不到该文件，就会发生异常。这些异常不能简单地忽略。\n\
    \n### 运行时异常 (Runtime exceptions)\n\n运行时异常可能是程序员本可以避免的异常。与检查异常相反，运行时异常在编译时被忽略。\n\
    \n### 错误 (Errors)\n\n这些根本不是异常，而是发生在用户控制之外的问题。错误通常在你的代码中被忽略，因为你很少能对其做什么。例如，如果发生栈溢出，就会产生错误。\n\
    \n### 使用异常对象 (Using Exception Object)\n\n异常对象是 Throwable 子类的实例（例如 `java.lang.NullPointerException`），并且仅在错误页面中可用。下表列出了\
    \ Throwable 类提供的重要方法。\n\n| 序号 | 方法 & 描述 |\n|---|---|\n| 1 | public String getMessage()\
    \ | 返回关于发生异常的详细消息。此消息在 Throwable 构造函数中初始化。 |\n| 2 | public Throwable getCause()\
    \ | 返回 Throwable 对象表示的异常。 |\n| 3 | public String toString() | 返回类名与 getMessage()\
    \ 结果拼接。 |\n| 4 | public void printStackTrace() | 将 toString() 的结果连同堆栈轨迹打印到 System.err（错误输出流）。\
    \ |\n| 5 | public StackTraceElement [] getStackTrace() | 返回包含堆栈轨迹每个元素的数组。0 表示调用栈的顶端，数组的最后一个元素表示调用栈底端的方法。\
    \ |\n| 6 | public Throwable fillStackTrace() | 用当前堆栈轨迹填充此 Throwable 对象的堆栈轨迹，添加堆栈轨迹中的任何先前信息。\
    \ |\n\n"
