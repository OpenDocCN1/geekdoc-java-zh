    </c:forEach>\n</td>\n</tr>\n```\n\n```html\n</table>\n<body>\n</html>\n```\n\n\
    Access the main.jsp, the page will be generated -\n\n## Chapter - 36 : Opps...\n\
    \n**Error:** java.lang.RuntimeException: Error condition!!!\n\n**URI:** /main.jsp\n\
    \n**Status code:** 500\n\norg.apache.jsp.main_jsp_jspService(main_jsp.jsp_JspBase.java:65)\n\
    org.apache.jasper.runtime.HttpJspBase.service(HttpJspBase.java:68)\n\n**Stack\
    \ trace:** javax.servlet.http.HttpServlet.service(HttpServlet.java:722)\norg.apache.jasper.servlet.JspServlet.service(JspServlet.java:265)\n\
    javax.servlet.http.HttpServlet.service(HttpServlet.java:722)\n\n## Using Try..Catch\
    \ Block\n\nIf you want to handle errors within the same page and want to take\
    \ some action instead of firing an error page, you can make use of the try....catch\
    \ block.\n\nFollowing is a simple example shows how to use the try...catch block.\
    \ Let us put the following code in main.jsp –\n\n```html\n<html>\n<head>\n<title>Try..Catch\
