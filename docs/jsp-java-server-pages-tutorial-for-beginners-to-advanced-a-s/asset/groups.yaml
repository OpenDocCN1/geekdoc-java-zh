    ## 对比 JavaScript


    JavaScript 可以在客户端动态生成 HTML，但很难与 Web 服务器交互以执行诸如数据库访问和图像处理等复杂任务。


    ## 对比 静态 HTML


    当然，普通的 HTML 无法包含动态信息。


    ## 接下来是什么？


    我将一步步教你如何配置环境以开始学习 JSP。我假设你在 Java 编程方面拥有良好的实战经验，以便继续学习 JSP。


    如果你不熟悉 Java 编程语言，我们建议你先阅读你的 Java 教程以了解 Java 编程。


    ## 第 2 章：环境搭建


    开发环境是你开发 JSP 程序、测试它们并最终运行它们的地方。


    本教程将引导你搭建 JSP 开发环境，其中涉及以下步骤：


    ### 搭建 Java 开发工具包 (JDK)


    这一步涉及下载 Java 软件开发包 (SDK) 的实现，并相应地设置 PATH 环境变量。


    你可以从 Oracle 的 Java 网站下载 SDK – Java SE Downloads。


    一旦下载了 Java 实现，请按照给出的说明进行安装和配置。最后，将 PATH 和 JAVA_HOME 环境变量指向包含 java 和 javac 的目录，通常分别为
    java_install_dir/bin 和 java_install_dir。


    如果你在 Windows 上运行并将 SDK 安装在 jdk1.5.0_20 中，你需要在需要在你的 C:\autocec.bat 文件中添加该行。


    ```

    set PATH = C:\jdk1.5.0_20;bin;%PATH%

    set JAVA_HOME = C:\jdk1.5.0_20

    ```


    或者，在 Windows NT/2000/XP 上，你也可以右键点击“我的电脑”，选择“属性”，然后点击“高级”，最后点击“环境变量”。然后更新 PATH
    值并点击确定 按钮。


    在 Unix（Solaris, Linux 等）上，如果 SDK 安装在 /usr/local/jdk1.5.0_20 且你使用 C shell，你会将以下内容放入
    .shrc 文件。


    ```

    setenv PATH /usr/local/jdk1.5.0_20/bin:$PATH

    setenv JAVA_HOME /usr/local/jdk1.5.0_20

    ```


    或者，如果你使用如 Borland JBuilder、IntelliJ IDEA 或 Sun ONE Studio 等集成开发环境 (IDE)，编译并运行一个简单的程序以确认
    IDE 知道你将 Java 安装在了哪里。


    ### 搭建 Web 服务器：Tomcat


    市场上有很多支持 JavaServer Pages (JSP) 和 Servlets 开发的 Web 服务器。某些 Web 服务器可以免费下载，Tomcat
    就是其中之一。


    Apache Tomcat 是 JavaServer Pages 和 Servlet 技术的开源软件实现，可以作为独立的服务器用于测试 JSP 和 Servlets，并可以与
    Apache Web 服务器集成。以下是在你的机器上设置 Tomcat 的步骤：


    - 1. 从 https://tomcat.apache.org/ 下载最新版本的 Tomcat。

    - 2. 一旦下载了安装包，请将二进制发行包解压到方便的位置。例如，在 Windows 上的 **C:\apache-tomcat-5.5.29** 或 Linux/Unix
    上的 **/usr/local/apache-tomcat-5.5.29**，并创建指向这些位置的 **CATALINA_HOME** 环境变量。


    可以通过在 Windows 机器上执行以下命令启动 Tomcat ——

    %CATALINA_HOME%bin/startup.bat


    ```

    C:\apache-tomcat-5.5.29\bin\startup.bat

    ```


    可以通过在 Unix (Solaris, Linux 等) 机器上执行以下命令启动 Tomcat ——

    $CATALINA_HOME/bin/startup.sh


    ```

    /usr/local/apache-tomcat-5.5.29/bin/startup.sh

    ```


    成功启动后，通过访问 http://localhost:8080 可以看到 Tomcat 的默认页面。![](img/74dc53ebf79a1ba626476c7e97f221_0)如果你看到此页面，说明你已成功启动了
    Tomcat。恭喜！


