    \ var=\"result\">\nSELECT * FROM Employees;\n</sql:query>\n\n<table border=\"\
    1\" width=\"100%\">\n<tr>\n<th>Emp ID</th>\n<th>First Name</th>\n<th>Last Name</th>\n\
    <th>Age</th>\n</tr>\n\n<c:forEach var=\"row\" items=\"${result.rows}\">\n<tr>\n\
    <td><c:out value=\"${row.id}\"/></td>\n<td><c:out value=\"${row.first}\"/></td>\n\
    <td><c:out value=\"${row.last}\"/></td>\n<td><c:out value=\"${row.age}\"/></td>\n\
    </tr>\n</c:forEach>\n</table>\n\n</body>\n</html>\n```\n"
