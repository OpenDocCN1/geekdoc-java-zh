    # # Chapter - 16 : Filters


    In this chapter, we will discuss Filters in JSP. Servlet and JSP Filters are Java
    classes that can be used in Servlet and JSP Programming for the following purposes
    –


    +   1. To intercept requests from a client before they access a resource at the
    back end.

    2. To manipulate requests from the server before they are sent back to the client.


    There are various types of filters suggested by the specifications –


    +   1. Authentication Filters

    2. Data compression Filters

    3. Encryption Filters

    4. Filters that trigger resource access events

    5. Image Conversion Filters

    6. Logging and Auditing Filters

    7. MIME-TYPE Chain Filters

    8. Tokenizing Filters

    9. XSL/T Filters That Transform XML Content


    Filters are deployed in the descriptor file web.xml and then map to either servlet
    or JSP names or URL patterns in your application''s deployment descriptor. The
    deployment descriptor file web.xml can be found in <Tomcat-installation-directory>\conf
    directory.


    When the JSP container starts up your application, it creates an instance of each
    filter that you have declared in the deployment descriptor. The Filters execute
    in the order that they are declared in the deployment descriptor.


    # ## Servlet Filter Methods


    A filter is simply a Java class that implements the javax.servlet.Filter interface.
    The javax.servlet.Filter interface defines three methods –


    # ### Method & Description


    | S.No. | Description |

    |---|---|

    | 1 | public void doFilter(ServletRequest, ServletResponse, FilterChain) This
    method is called by the container each time a request/response pair is passed
    through the chain due to a client request for a resource at the end of the chain.
    |

    | 2 | public void init(FilterConfig filterConfig) This method is called by the
    web container to indicate to a filter that it is placed into service. |

    | 3 | public void destroy() This method is called by the web container to indicate
    to a filter that it is taken out of service. |


    # ## JSP Filter Example


    Following example shows how to print the client’s IP address and the current date
    time, each time it would access any JSP file. This example will give you a basic
    understanding of the JSP Filter, but you can write more sophisticated filter applications
    using the concept –'
- md: "\n```java\n// Import required java libraries\nimport java.io.*;\nimport javax.servlet.*;\n\
    import java.util.*;\n```\n\n```java\n// Implements Filter class\npublic class\
    \ LogFilter implements Filter {\n    public void init(FilterConfig config) throws\
    \ Exception {\n        // Get init parameter\n        String testParam = config.getParameter(\"\
    test-param\");\n        System.out.println(\"Test Param: \" + testParam);\n  \
    \  }\n    public void doFilter(ServletRequest request, ServletResponse response,\
    \ FilterChain chain)\n        throws IOException, SQLException {\n        // Get\
    \ the IP address of the client machine\n        String ipAddress = request.getRemoteAddr();\n\
    \n        // Log the IP address and current timestamp.\n        System.out.println(\"\
    IP \" + ipAddress + \", Time \" + new Date().toString());\n\n        // Pass request\
    \ back down the filter chain\n        chain.doFilter(request, response);\n   \
    \ }\n    public void destroy() {\n        /* Called before the Filter instance\
    \ is removed\n           from service the web container*/\n    }\n}\n```\n\nCompile\
    \ LogFilter.java in the usual way and put your LogFilter.class file in `<Tomcat-installation-directory>/webapps/ROOT/WEB-INF/classes`.\n\
    \n## JSP Filter Mapping in Web.xml\n\nFilters are defined and then mapped to a\
    \ URL or JSP file name, in the same way as Servlet is defined and then mapped\
    \ to a URL pattern in web.xml. Create the entry for filter tag in the deployment\
    \ descriptor web.xml.\n\n```xml\n<filter>\n  <filter-name>LogFilter</filter-name>\n\
    \  <filter-class>LogFilter</filter-class>\n  <init-param>\n    <param-name>test-param</param-name>\n\
    \    <param-value>Initialization Parameter</param-value>\n  </init-param>\n</filter>\n\
    \n<filter-mapping>\n  <filter-name>LogFilter</filter-name>\n  <url-pattern>/*</url-pattern>\n\
    </filter-mapping>\n```\n\nThe above filter will apply to all the servlets and\
    \ JSP because we specified /* in our configuration. You can specify a particular\
    \ servlet or the JSP path if you want to apply filters on a few servlets or JSP\
    \ only.\n\nNow to call any servlet or JSP and you will see the generated log in\
    \ your web server log. You can use the Log4j logger to log the log in a separate\
    \ file.\n\n## Using Multiple Filters\n\nYour web application may define several\
    \ different filters with a specific purpose. Consider, you define two filters\
    \ AuthenFilter and LogFilter. Rest of the process will remain as explained above\
    \ except you need to create a different mapping as mentioned below -\n\n```xml\n\
    <filter>\n  <filter-name>LogFilter</filter-name>\n  <filter-class>LogFilter</filter-class>\n\
    \  <init-param>\n    <param-name>test-param</param-name>\n    <param-value>Initialization\
    \ Parameter</param-value>\n  </init-param>\n</filter>\n\n<filter>\n  <filter-name>AuthenFilter</filter-name>\n\
    \  <filter-class>Auth Filter</filter-class>\n  <init-param>\n    <param-name>test-param</param-name>\n\
    \    <param-value>Initialization Parameter</param-value>\n  </init-param>\n</filter>\n\
    \n<filter-mapping>\n  <filter-name>LogFilter</filter-name>\n  <url-pattern>/*</url-pattern>\n\
    </filter-mapping>\n\n<filter-mapping>\n  <filter-name>AuthenFilter</filter-name>\n\
    \  <url-pattern>/*</url-pattern>\n</filter-mapping>\n```\n\n## Filters Application\
    \ Order\n\nThe order of filter-mapping elements in the web determines the order\
    \ in which the web container contains the filter to the servlet or JSP. To reverse\
    \ the order of the filter, you just need to reverse the filter-mapping elements\
    \ in the web.xml file.\n\nFor example, the above example will apply the LogFilter\
    \ first and then it will apply AutFilter to any servlet or JSP; the following\
    \ example will reverse the order –\n\n```xml\n<filter-mapping>\n  <filter-name>AuthenFilter</filter-name>\n\
    \  <url-pattern>/*</url-pattern>\n</filter-mapping>\n\n<filter-mapping>\n  <filter-name>LogFilter</filter-name>\n\
    \  <url-pattern>/*</url-pattern>\n</filter-mapping>\n```\n\n## Chapter - 17 :\
    \ Cookies Handling\n\nIn this chapter, we will discuss Cookies Handling in JSP.\
    \ Cookies are text files stored on the client and they are kept for various purposes.\
    \ JSP transparently supports HTTP cookies using servlet technology. There are\
    \ three steps involved in identifying and returning users:\n\n- Server script\
    \ sets a set of cookies to the browser. For example, name, age, or identification\
    \ number, etc.\n- Browser stores this information on the local machine for future\
    \ use.\n- When the next time the browser sends any request to the web server it\
    \ sends those cookies to identify the user or some other purpose well.\n\nThis\
    \ chapter will teach you how to set or reset cookies, how to access them and delete\
    \ them using JSP programs.\n\n## The Anatomy of a Cookie\n\nCookies are usually\
    \ set in HTTP header (although JavaScript can also set a cookie on the browser).\
    \ JSP that sets a cookie might send headers like this:\n\n```http\nHTTP/1.1 200\
    \ OK\nDate: Fri, 04 Feb 2000 21:03:38 GMT\nServer: Apache/1.3 (UNIX)\nSet-Cookie:\
    \ name=xyz; expires=Fri, 04 Nov-2000 22:03:38 GMT; path=/; domain=tutorials.com\n\
    Content-Type: text/html\n```\n\nAs you can see, Set-Cookie header contains a name\
    \ value pair, expires date and path. The browser will keep this information until\
    \ the expiry date. If the user points to any page that matches the path and domain,\
    \ it will resend the cookie to the server. The browser’s headers might look something\
    \ like –\n\n```http\nGET / HTTP/1.0\nConnection: Keep-Alive\nUser-Agent: Mozilla/4.0\
    \ (compatible; Win98; NT)\nHost: demo.com:1126\nAccept: image/gif,*\nAccept-Encoding:\
    \ gzip\nAccept-Language: en\nAccept-Charset: iso-8859-1,utf-8\nCookie: name=xyz\n\
    ```\n\nA JSP script will then have access to the cookies through the request.getCookies()\
    \ which returns an array of Cookie objects.\n\n## Servlet Cookies Methods\n\n\
    Following table lists the useful methods associated with the Cookie object which\
    \ you can use while manipulating cookies in JSP:\n\n| S.No. | Method & Description\
    \ |\n| :--- | :--- |\n| 1 | **public void setDomain(String pattern)**: This method\
    \ sets the domain to which the cookie applies; for example tutorialpoint.com.\
    \ |\n| 2 | **public String getDomain()**: This method gets the domain to which\
    \ the cookie applies; for example, tutorialpoint.com. |\n| 3 | **public void setMaxAge(int\
    \ expiry)**: This method sets how much time (in seconds) should elapse before\
    \ the cookie expires. If you don't set this, the cookie will last only for the\
    \ current session. |\n| 4 | **public int getMaxAge()**: This method returns the\
    \ maximum age of the cookie, specified in seconds. By default, -1 indicating the\
