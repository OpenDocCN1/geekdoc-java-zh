    Following is the list of JSTL Tags —


    | S.No. | Tag & Description |

    |---|---|

    | 1 | <x:out> Like<%= ... >, for XPath expressions. |

    | 2 | <x:parse> Used to parse the XML data specified either via an attribute or
    in the tag body. |

    | 3 | <x:set> Sets a variable to the value of an XPath expression. |

    | 4 | <x:ifif> Evaluates a test XPath expression and if it is true, it processes
    its body. If the condition is false, the body is ignored. |

    | 5 | <x:forEach> To loop over nodes in an XML document. |

    | 6 | <x:choose> Simple conditional tag that establishes a context for mutually
    exclusive conditional operations, marked by <when> and <otherwise> tags. |

    | 7 | <x:when> Subtag of <choose> includes its body if its expression evaluates
    to ''true''. |

    | 8 | <x:otherwise> Subtag of <choose> that follows the <when> tags and runs only
    if all of the prior conditions evaluates to ''false''. |

    | 9 | <x:transform> Applies an XSL transformation on a XML document |


