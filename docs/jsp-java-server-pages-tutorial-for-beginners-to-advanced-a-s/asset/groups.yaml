  - "[PAGE 105]\n\n# Chapter - 33 : Expression Language (EL)\n\nJSP Expression Language\
    \ (EL) makes it possible to easily access application data stored in JavaBeans\
    \ components, JSP EL allows you to create expressions both (a) arithmetic and\
    \ (b) logical. Within a JSP expression, you can use integers, floating point numbers,\
    \ strings, the built-in constructs true and false for boolean values, and null.\n\
    \n# Simple Syntax\n\nTypically, when you specify an attribute value in a JSP tag,\
    \ you simply use a string. For example -\n\n```\n<jsp:setProperty name=\"box\"\
    \ property=\"perimeter\" value=\"100\"/>\n```\n\nJSP EL allows you to specify\
    \ an expression for any of these attribute values. A simple syntax for JSP EL\
    \ is as follows\n\n```\n${expr}\n```\n\nHere expr specifies the expression itself.\
    \ The most common operators in JSP EL are and []. These two operators allow you\
    \ to access various attributes of Java Beans and built-in objects.\n\nFor example,\
    \ the above syntax <jsp:setProperty> can be written with an expression like -\n\
    \n```\n<jsp:setProperty name=\"box\" property=\"perimeter\"\nvalue=\"${2.box.width+2.height}\"\
    />\n```\n\nWhen the JSP compiles the {} form in an attribute, it generates code\
    \ to evaluate the expression and substitute the value of expression.\nYou can\
    \ also use the JSP EL expressions in template text for a tag. For example, the\
    \ <jsp:text> tag simply inserts its content within the body of a JSP. The following\
    \ <jsp:text> declaration inserts <h1>Hello JSP!</h1> into the JSP output -\n\n\
    ```\n<jsp:text>\n<h1>Hello JSP!</h1>\n</jsp:text>\n```\n\nYou can now include\
    \ a JSP expression in the body of a <jsp:text> tag (or any other tag) with the\
    \ same {} syntax you use for attributes. -\n\n```\n<jsp:text>\nBox Perimeter:\
    \ is ${2.box.width + 2.box.height}\n</jsp:text>\n```\n\nEL expressions can use\
    \ parentheses to group subexpressions. For example, ${(1 + 2) * 3} equals 9, but\
    \ 7.\n\nTo deactivate the evaluation of EL expressions, you specify the isELIgnored\
    \ attribute of the page directive - \n<% page isELIgnored = \"true/false\" %>\n\
    \nThe valid values of this attribute are true and false. If it is true, EL expressions\
    \ are ignored when they appear in static text or tag attributes. If it is false,\
    \ EL expressions are evaluated by the container."
