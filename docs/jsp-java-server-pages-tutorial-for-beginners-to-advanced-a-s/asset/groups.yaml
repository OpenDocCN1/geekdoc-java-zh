    The date/time is Thu 30 11:18:11 GST 2010


    # Accessing JavaBeans Properties


    Along with <jsp:useBean...> action, you can use the <jsp:getProperty/> action
    to access the methods. Here is the full syntax -


    ```

    <jsp:useBean id = "id" class = "bean''s class" scope = "bean''s scope">

    <jsp:setProperty name = "bean''s id" property = "property name" value = "value"/>

    <jsp:getProperty name = "bean''s id" property = "property name"/>

    </jsp:useBean>

    ```


    The attribute references the id of a JavaBean previously introduced to the JSP
    by the useBean action. The property attribute is the name of the get or the set
    methods that should be invoked.


    Following example shows how to access the data using the syntax -


    ```

    <html>

    <head>

    <title>get and set properties Example</title>

    </head>

    <body>

    <jsp:useBean id = "students" class = "com.tutorialspoint.StudentsBean">

    <jsp:setProperty name = "students" property = "firstName" value = "Zara"/>

    <jsp:setProperty name = "students" property = "lastName" value = "Ali"/>

    <jsp:setProperty name = "students" property = "age" value = "10"/>

    </jsp:useBean>

    ```'
