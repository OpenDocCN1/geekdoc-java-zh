    # # Chapter - 13 : Form Processing


    In this chapter, we will discuss Form Processing in JSP. You must have come many
    situations when you need to pass some information from your browser to the web
    server and ultimately to your backend program. The browser uses two methods to
    pass this information to the web server. These methods are the GET method and
    the POST Method.


    # ## The Methods in Form Processing


    Let us now discuss the methods in Form Processing.


    # ### GET method


    The GET method sends the encoded information appended to the page request. The
    page and the encoded information are separated by the ? character as follows =

    http://www.test.com/hello?key1=value1&key2=value2


    The GET method is the default method to pass information from the browser to the
    web server and it produces a long string that appears in your browser''s Location:box.
    It is recommended that the GET method is better used. If you have a password or
    other sensitive information to pass to the server.


    The GET method has size limitation: only 1024 characters can be in a request string.'
  - '[PAGE 49]


    This information is passed using QUERY_STRING header and will be accessible through
    QUERY_STRING environment variable which can be handled using getQueryString()
    and getParameter() methods of request object.


    # POST method


    A generally reliable method of passing information to backend program is the POST
    method.


    This method packages the information in exactly the same way as the GET method,
    instead of sending it as a text string after ? in a URL it sends it as a separate
    message. This message comes to the backend program in the standard input which
    it can parse and use for your processing.


    JSP handles this type of requests using the getParameter() method to read simple
    parameters and the getInputStream() to read binary data streams coming from the
    client.


    # Reading Form Data using JSP


    JSP handles data parsing automatically using the following methods depending on
    the situation -


    +   1. getParameter() – You call the request.getParameter() method to get the
    value of a parameter.

    2. getParameterValues() – Call this method if the parameter appears more than
    one and returns multiple values, example checkbox.

    3. getParameterNames() – Call this method if you want a complete list of all parameters
    in the current request.

    4. getInputStream() – Call this method to read binary data streams coming from
    the client.


    # GET Method Example Using URL


    The following URL will pass two values to the HelloForm program using the GET
    method.


    http://localhost:8080/main.jsp?first_name=ZARA&last_name=ALI


    Below is the main.jsp program to handle input by the web browser. We are going
    to use the getParameter() method which makes it very easy to access the passed
    information -


    ```

    <html>

    <head>

    <title>Using GET Method to Read Form Data</title>

    </head>

    <body>

    <h1>Using GET Method to Read Form Data</h1>

    <ul>

    <li><b>First Name: </b>

    <%%= request.getParameter("first_name")%\n<p></p></li>

    <li><b>Last Name: </b>

    <%= request.getParameter("last_name")%>

    <p></p></li>

    </ul>

    </body>

    </html>

    ```'
- md: "\n<body>\n</html>\n```\n\nNow type http://localhost:8080/main.jsp?first_name=ZARA&last_name=ALI\
    \ in your browser's Location:box. This will generate the following result –\n\n\
    # Chapter - 14 : Using GET Method to Read Form Data\n\n* First Name: ZARA\n* Last\
    \ Name: ALI\n\n## GET Method Example Using Form\n\nFollowing is an example that\
    \ passes two values using the HTML FORM and the submit button. We are going to\
    \ use the same JSP main.jsp to handle this input.\n\n```html\n<html>\n<body>\n\
    <form action=\"main.jsp\" method=\"GET\">\nFirst Name: <input type=\"text\" name=\"\
    first_name\">\n<br />\nLast Name: <input type=\"text\" name=\"last_name\">\n<input\
    \ type=\"submit\" value=\"Submit\" />\n</form>\n</body>\n</html>\n```\n\nKeep\
    \ this HTML in a file Hello.htm and put it in <Tomcat-installation-directory>/webapps/ROOT\
    \ directory. When you access http://localhost:8080/Hello.htm, you will receive\
    \ the following output.\n\nFirst Name:\nLast Name:\n\n<p>Try to enter the First\
    \ Name and the Last Name and click the submit button to see the result on your\
    \ local machine where tomcat is running. Based on the input provided, it will\
    \ generate a similar result mentioned in the example above.\n\n## POST Method\
    \ Example Using Form\n\nLet us do a little modification in the above JSP to handle\
    \ both the GET and the POST method. Below is the main.jsp JSP program to handle\
    \ the input given by a web browser using the GET or the POST methods.\n\nIn fact\
    \ there is no change in the above JSP because the only way of passing parameters\
    \ is changed and no binary data is passed to the JSP program. File handling related\
    \ concepts will be explained in separate chapter where we need to read the binary\
    \ data stream.\n\n```html\n<html>\n<head>\n<title>Using GET and POST Method to\
    \ Read Form Data</title>\n</head>\n<body>\n<center>\n<h1>Using POST Method to\
    \ Read Data</h1>\n<ul>\n<li><p><b>First Name:</b>\n<%= request.getParameter(\"\
    first_name\")%\n</p></li>\n<li><p><b>Last Name:</b>\n<%= request.getParameter(\"\
    last_name\")%\n</p></li>\n</ul>\n</center>\n</body>\n</html>\n```\n\nFollowing\
    \ is the content of the Hello.htm file -\n\n```html\n<html>\n<body>\n<form action=\"\
    main.jsp\" method=\"POST\">\nFirst Name: <input type=\"text\" name=\"first_name\"\
    \ /><br>\nLast Name: <input type=\"text\" name=\"last_name\" />\n<input type=\"\
    submit\" value=\"Submit\" />\n</form>\n</body>\n</html>\n```\n\nLet us now keep\
    \ main.jsp and hello.htm in **Tomcat-installation directory=webappROOT directory**.\
    \ When you access http://localhost:8080/Hello.htm, you will receive the following\
    \ output.\n\nFirst Name:\nLast Name:\n\nTry to enter the First and the Last Name\
    \ and click the submit button to see the result on your local machine where tomcat\
    \ is running.\n\nBased on the input provided, you will receive similar results\
    \ as in the above examples.\n\n## Passing Checkbox Data to JSP Program\n\nCheckboxes\
    \ are used when more than one option is required to be selected.\nFollowing is\
    \ an example **HTML code, CheckBox.htm**, for a form with two checkboxes.\n\n\
    ```html\n<html>\n<body>\n<form action=\"main.jsp\" method=\"POST\" target=\"_blank\"\
    >\n<input type=\"checkbox\" name=\"maths\" checked=\"checked\" /> Maths\n<input\
    \ type=\"checkbox\" name=\"physics\" /> Physics\n<input type=\"checkbox\" name=\"\
    chemistry\" checked=\"checked\" /> Chemistry\n<input type=\"submit\" value=\"\
    Select Subject\" />\n</form>\n</body>\n</html>\n```\n\nThe above code will generate\
    \ the following result –\nMaths Physics Chemistry\nFollowing is the main.jsp JSP\
    \ program to handle the input given by the web browser for the checkbox button.\n\
    \n```html\n<html>\n<head>\n<title>Reading Checkbox Data</title>\n</head>\n<body>\n\
    <h1>Reading Checkbox Data</h1>\n<ul>\n<li><p><b>Maths Flag:</b></p>\n<% = request.getParameter(\"\
    maths\") %>\n</li>\n<li><p><b>Physics Flag:</b></p>\n<% = request.getParameter(\"\
    physics\") %>\n</li>\n<li><p><b>Chemistry Flag:</b></p>\n<% = request.getParameter(\"\
    chemistry\") %>\n</li>\n</ul>\n</body>\n</html>\n```\n\nThe above program will\
    \ generate the following result –\n\n# Chapter - 15 : Reading Checkbox Data\n\n\
    * 1. Maths Flag :: on\n* 2. Physics Flag:: null\n* 3. Chemistry Flag: on\n\n##\
    \ All Form Parameters\n\nFollowing is a generic example which uses getParameterNames()\
    \ method of HttpServletRequest to read all available form parameters. This method\
    \ returns an Enumeration that contains the parameter names in an unspecified order.\n\
    Once we have an Enumeration, we can loop down the Enumeration in the standard\
    \ manner, using the hasMoreElements() method to determine when to stop and using\
    \ the hasMoreElements() method.\n\n```html\n<%@ page import=\"java.io.*;java.util.*;\"\
    \ %>\n<html>\n<head>\n<title>Request Parameters</title>\n</head>\n<body>\n<center>\n\
    <h1>Request Parameters</h1>\n<table width=\"100%\" border=\"1\" align=\"center\"\
    >\n<tr><th>Param Name</th><th>Param Value(s)</th></tr>\n<%\n  Enumeration paramNames\
    \ = request.getParameterNames();\n  while(paramNames.hasMoreElements()) {\n  \
    \  String paramName = (String)paramNames.nextElement();\n    String paramValue\
    \ = request.getParameter(paramName);\n    out.print(\"<tr><td>\" + paramName +\
    \ \"</td><td>\" + paramValue + \"</td></tr>\");\n  }\n%>\n</table>\n</center>\n\
    </body>\n</html>\n```\n\nYou can try the above JSP to read any other form’s data\
    \ is having other objects like text box, radio button or dropdown.\n\n# Chapter\
    \ - 16 : Filters\n\nIn this chapter, we will discuss Filters in JSP. Servlet and\
    \ JSP Filters are Java classes that can be used in Servlet and JSP for the following\
    \ purposes –\n\n- 1. To intercept requests from a client before they access a\
    \ resource at the back end.\n- 2. To manipulate requests from the server before\
    \ they are sent back to the client.\n\nThere are various types of filters suggested\
    \ by the specifications –\n\n- 1. Authentication Filters\n- 2. Data compression\
    \ Filters\n- 3. Encryption Filters\n- 4. Filters trigger resource access events\n\
    - 5. Image Conversion Filters\n- 6. Logging and Auditing Filters\n- 7. MIME-TYPE\
    \ Chain Filters\n- 8. Tokenizing Filters\n- 9. XSL/T Filters Transform XML Content\n\
    \nFilters are deployed in the descriptor file web.xml and then map to either servlet\
    \ or JSP names or URL patterns in your application's deployment descriptor. The\
    \ deployment descriptor file web.xml can be found in <Tomcat-installation-directory>\\\
    conf directory.\n\nWhen the JSP container starts up your application, it creates\
    \ an instance of each filter that you have declared in the deployment descriptor.\
    \ The Filters execute in the order that are declared in the deployment descriptor.\n\
    \n## Servlet Filter Methods\n\nA filter is simply a Java class that implements\
    \ the javax.servlet.Filter interface. The javax.servlet.Filter interface defines\
    \ three methods –\n\n### Method & Description\n\n| Method | Description |\n|---|---|\n\
    | public void doFilter(ServletRequest, ServletResponse, FilterChain) | This method\
    \ is called by the container each time a request/response pair is passed through\
    \ the chain due to a client request for a resource at the end of the chain. |\n\
