    # Attributes


    Following table lists out the attributes associated with the page directive –


    | S.No. | Attribute & Purpose |

    |---|---|

    | 1 | buffer <br>Specifies a buffering model for the output stream. |

    | 2 | autoFlush <br>Controls the behaviour of the servlet output buffer. |

    | 3 | contentType <br>Defines the character encoding scheme. |

    | 4 | errorPage <br>Defines the URL of another JSP that reports on Java unchecked
    runtime exceptions. |

    | 5 | isErrorPage <br>Indicates if this JSP page is a URL specified by another
    JSP page''s errorPage attribute. |

    | 6 | extends <br>Specifies a superclass that the generated servlet must extend.
    |

    | 7 | import <br>Specifies a list of packages or classes for use in the JSP as
    the import statement does for Java classes. |

    | 8 | info <br>Defines a string that can be accessed with the servlet''s getServletInfo().
    |

    | 9 | isThreadSafe <br>Defines the threading model for the generated servlet.
    |

    | 10 | language <br>Defines the programming language used in the JSP page. |

    | 11 | session <br>Specifies whether or not the JSP page participates in HTTP
    sessions |

    | 12 | isELIgnored <br>Specifies whether or not the EL expression within the JSP
    page will be ignored. |

    | 13 | isScriptingEnabled <br>Determines if scripting elements are enabled for
    use. |


    Check for more details related to all the above attributes at Page Directive.


    # The include Directive


    The include directive is used to include a file during the translation phase.
    This directive tells the container to merge the content of other external files
    with the current JSP during the translation phase. You may code the include directives
    anywhere in your JSP page.'
