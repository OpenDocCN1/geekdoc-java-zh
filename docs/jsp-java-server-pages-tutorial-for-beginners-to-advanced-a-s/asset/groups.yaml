    author\"/></td>\n<td><xsl:value-of select=\"price\"/></td>\n</tr>\n</xsl:for-each>\n\
    </table>\n</xsl:template>\n</xsl:stylesheet>\n```\n\nNow consider the following\
    \ JSP file:\n\n```jsp\n<%@ taglib prefix=\"c\" uri=\"http://java.sun.com/jsp/jst/core\"\
