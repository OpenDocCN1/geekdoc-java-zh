    # Chapter - 25 : Auto Refresh


    In this chapter, we will discuss Auto Refresh in JSP. Consider a webpage which
    is displaying live game score or stock market status or currency exchange ratio.
    For all such types of pages, you would need to refresh your Web Page regularly
    using the refresh or reload button with your browser.


    JSP makes this job easy by providing you a mechanism where you can make a webpage
    in such a way that it would refresh automatically after a given interval.


    The simplest way of refreshing a Webpage is by using the setHeader() method of
    the response object. Following is the signature of this method –


    This method sends back the header "Refresh" to the browser with an integer value
    which indicates the time interval in seconds.


    # Auto Page Refresh Example


    In the following example, we will use the setHeader() method to set the Refresh
    header. This will help simulate a digital clock –


    ```

    <@page import "Java.io.*,java.util.*" %>

    <html>

    <head>

    <title>Auto Refresh Header Example</title>

    </head>


