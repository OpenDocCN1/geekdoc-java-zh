    In this chapter, we will discuss Implicit Objects. These are the Java objects
    available to each page.


    | S.No. | Object & Description |

    | :--- | :--- |

    | 1 | request | This is the HttpServletRequest object. |

    | 2 | response | This is the HttpServletResponse object. |

    | 3 | out | This is the JspWriter object. |

    | 4 | session | This is the HttpSession object. |

    | 5 | application | This is the ServletContext object. |

    | 6 | config | This is the ServletConfig object. |

    | 7 | pageContext | This is the pageContext object. |

    | 8 | page | This is the page object. |

    | 9 | Exception | This is the Exception object. |


    # The request Object


    The request object is an instance of javax.servlet.http.HttpServletRequest. Each
    time a client requests the JSP, the server creates a new object to represent that
    request.


    The request object provides methods to get header information including cookies.
    We can cover a complete set of methods associated with the request in a subsequent
    chapter - Client Request.


    # The response Object


    The response object is an instance of javax.servlet.http.HttpServletResponse.
    Just as the server creates the request object, it also creates an object to represent
    the response to the client.


    The response object also defines the interfaces that creating new headers. Through
    this the JSP programmer can add cookies or status codes.


    # The Out Object


    The out object is an instance of javax.servlet.jsp.JspWriter object used to send
    content in a response. The initial JSPWriter is instantiated differently depending
    on whether the page is buffered or not. Buffering can be easily turned off by
    using the buffered=''false'' attribute of the page directive.


    The JSPWriter object contains many of the same methods as the java.io.PrintWriter
    class. However, JSPWriter has many instance methods designed to deal with buffering.


    # The Session Object


    The session object is an instance of javax.servlet.http.HttpSession and behaves
    exactly the way that session objects behave under Java Servlets. The session object
    is used to track sessions between client requests. We will cover the complete
    usage of session objects in a subsequent chapter - Session Tracking.


    # The application Object


    The application object is a direct wrapper around the ServletContext object for
    the generated Servlet and in an instance of javax.servlet.ServletContext object.


    This object is a representation of the JSP page through its entire lifecycle.
    This object is created when the JSP page initialized and will be removed when
    the JSP page is removed by the jspDestroy() method.


    By adding an attribute to the application, you can ensure that all JSP files make
    up your web application have access to it. We will check the use of Application
    Objects in the JSP - Hits Counter chapter.

