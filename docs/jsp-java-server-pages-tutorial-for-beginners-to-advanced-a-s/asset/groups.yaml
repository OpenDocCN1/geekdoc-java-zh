  - "[PAGE 117]\n\n# Internet Explorer use Shift-Refresh.\n\n# Chapter - 38 : Security\n\
    \nJava Pages and servlets make several mechanisms available to Web developers\
    \ to secure applications. Resources are protected declaratively by identifying\
    \ them in the application deployment descriptor and assigning a role to them.\n\
    \nSeveral levels of authentication are available, ranging from basic authentication\
    \ using identifiers and passwords to sophisticated authentication using certificates.\n\
    \n# Role Based Authentication\n\nThe authentication mechanism in the servlet specification\
    \ uses a technique called role-based security. The idea is rather than restricting\
    \ resources at the user level, you create roles and restrict the resources by\
    \ role.\n\nYou can define different roles in file tomcat-users.xml, which is located\
    \ off Tomcat's directory in conf. An example of this is shown below\n\n```\n<xml\
    \ version='1.0' encoding='utf-8'?>\n<tomcat-users>\n  <role name=\"tomcat\"/>\n\
    \  <role name=\"role1\"/>\n  <role name=\"manager\"/>\n  <role name=\"admin\"\
    />\n  <user username=\"tomcat\" password=\"tomcat\" roles=\"tomcat\"/>\n  <user\
    \ username=\"role1\" password=\"tomcat\" roles=\"role1\"/>\n  <user username=\"\
    both\" password=\"tomcat\" roles=\"tomcat,role1\"/>\n  <user username=\"admin\"\
    \ password=\"secret\" roles=\"admin,manager\"/>\n</tomcat-users>\n```\n\nThis\
    \ file defines a simple mapping between username, password, and role. Notice that\
    \ a given user may have multiple roles; for example, username=\"both\" is in the\
    \ \"tomcat\" and role=\"role1\".\n\nOnce you have identified and defined different\
    \ roles, role-based security restrictions can be placed on different Web Application\
    \ resources using the <security-constraint> element in the web.xml file available\
    \ in the WEB-INF directory.\n\nFollowing is a sample entry in web.xml -\n\n```\n\
    <web-app>\n...\n  <security-constraint>\n    <web-resource-name>SecuredBookSite</web-resource-name>\n\
    \    <url-pattern>/secured/*</url-pattern>\n    <http-method>GET</http-method>\n\
    \    <http-method>POST</http-method>\n  </web-resource-collection>\n  <auth-constraint>\n\
    \    <description>\n  Let only managers use this app\n```"
