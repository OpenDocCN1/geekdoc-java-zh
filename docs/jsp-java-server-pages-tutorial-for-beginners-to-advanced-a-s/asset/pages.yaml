  md: "# JavaBeans Properties\n\nA JavaBean property is a named attribute that can\
    \ be accessed by the user of the object. The attribute can be of any Java data\
    \ type, including the classes that you define.\n\nA JavaBean may be read, write,\
    \ read only, or write only. JavaBean properties are accessed through two methods\
    \ in the JavaBean's implementation class —\n\n| S.No. | Method & Description |\n\
    |---|---|\n| 1 | getPropertyName() For example, if the property is firstName,\
    \ your method name would getFirstName() to read that property. This method is\
    \ called accessor. setPropertyName() For example, if the property is firstName,\
    \ your method name would be setName() to write that property. This method is called\
    \ mutator. |\n\nA read-only attribute will have only a getPropertyName() method,\
    \ and a write-only attribute will have only a setPropertyName() method.\n\n# JavaBeans\
    \ Example\n\nConsider a student class with properties —\n\n```\npackage com.tutorial.point;\n\
    public class StudentsBean implements java.io.Serializable {\n    private String\
    \ firstName = null;\n    private String lastName = null;\n    private int age\
    \ = 0;\n\n    public StudentsBean() {\n    }\n    public String getFirstName()\
    \ {\n        return firstName;\n    }\n    public String getLastName() {\n   \
    \     return lastName;\n    }\n    public int getAge() {\n        return age;\n\
    \    }\n    public void setFirstName(String firstName) {\n        this.firstName\
    \ = firstName;\n    }\n    public void setLastName(String lastName) {\n      \
    \  this.lastName = lastName;\n    }\n    public void setAge(Integer age) {\n \
    \       this.age = age;\n    }\n}\n```\n\n# Accessing JavaBeans"
