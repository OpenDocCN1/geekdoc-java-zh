    # Common Attributes


    There are two attributes that are common to all Action elements: the id attribute
    and scope attribute.


    # Id attribute


    The id attribute uniquely identifies the Action element, and allows the action
    to be referenced inside the JSP page. If the Action creates an instance of an
    object, the id value can be used to reference it through the implicit object PageContext.


    # Scope attribute


    This attribute identifies the lifecycle of the Action. The id attribute and scope
    attribute are directly related, as scope attribute determines the lifespan of
    the object associated with it. The scope has four possible values: (a) page, (c)session,
    and (d) application.


    # The <jsp:include> Action


    This action inserts files into the page being generated. The syntax looks like
    this — <jsp:include page = "relative URL" flush "true" />


    Unlike the Include directive, which inserts the file at the time the JSP page
    is translated into a servlet, this action inserts the file at the time the action
    is requested.


    Following table lists the attributes associated with the include action –


    | S.No. | Attribute & Description |

    | 1 | page |'
