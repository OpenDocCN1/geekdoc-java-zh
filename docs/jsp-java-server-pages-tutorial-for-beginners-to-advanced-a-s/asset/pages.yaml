  md: 'Apart from the mentioned options, JSP makes use of the servlet provided HttpSession
    Interface. This interface provides a way to identify a user across.


    +   1. a one page request or

    2. visit to a website or

    3. store information about that user


    By default, JSPs use session tracking and a new HttpSession object is instantiated
    for each client automatically. Disabling session tracking requires explicitly
    turning it off by setting the page directive session attribute to false as follows
    %

    <@page session="false" %>


    The JSP engine exposes the HttpSession object to the JSP author through the implicit
    session object. Since the session object is already provided to the JSP programmer,
    the programmer can immediately begin storing and retrieving data from the object
    without initialization or getSession().


    Here is a summary of important methods available through the session –


    | S.No. | Method & Description |

    |---|---|

    | 1 | **public Object getAttribute(String name)**<br>This method returns the object
    bound with the specified name in this session, or null if no object is bound under
    the name. |

    | 2 | **public Enumeration getAttributeNames()**<br>This method returns an Enumeration
    of String objects containing the names of all the objects bound to this session.
    |

    | 3 | **public long getCreationTime()**<br>This method returns the time when this
    session was created, measured in milliseconds since January 1, 1970 GMT. |

    | 4 | **public String getId()**<br>This method returns a string containing the
    unique identifier assigned to this session. |

    | 5 | **public long getLastAccessedTime()**<br>This method returns the last time
    the client sent a request associated with this session, as number of milliseconds
    since January 1, 1970 GMT. |

    | 6 | **public int getInactiveInterval()**<br>This method returns the maximum
    time interval, in seconds, that the servlet will keep this session open between
    client accesses. |

    | 7 | **public void invalidate()**<br>This method invalidates the session and
    unbind any objects bound to it. |

    | 8 | **public boolean isNew()**<br>This method returns true if the client does
    not yet know about the session or if the client chooses to join the session. |

    | 9 | **public void removeAttribute(String name)**<br>This method removes the
    object bound with the specified name from this session. |

    | 10 | **public void setAttribute(String name, Object value)** |'
