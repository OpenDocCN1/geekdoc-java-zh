    # Chapter - 3 : Architecture


    The web server needs a JSP engine, i.e, a container to process JSP pages. The
    JSP container

    is responsible for intercepting requests for JSP pages. This tutorial makes use
    of Apache

    which has a built-in JSP container to support JSP pages development.


    A JSP container works with the Web server to provide the runtime environment and
    other

    services your JSP pages. It knows how to understand the special elements that
    are part of JSPs.

    Following diagram shows the position of JSP containers and JSP files in a Web
    application.


    ![](img/74dc853ebf79a1ba6264764c7e97f221_12_0.png)


    # JSP Processing


    The following steps explain how the web server creates the Webpage using JSP –


    +   1. With a normal page, your browser sends an HTTP request to the web server.

    2. The web server recognizes the HTTP request is for a JSP page and forwards

    it to a JSP engine. This is done by using URL or JSP page which ends with .jsp
    instead of .html.

    3. The JSP engine loads the JSP page from disk and converts it into a servlet

    content. This conversion is very simple in which all template text is converted
    to

    print() statements and all JSP elements are converted to Java code. This code

    implements the corresponding dynamic behaviour of the page.

    4. The JSP engine compiles the servlet into an executable class and forwards the

    original request to a servlet engine.

    5. A part of the web server called the servlet engine loads the Servlet class
    and

    executes it. During execution, the servlet produces an output in HTML format.

    The output is further passed on the web server by the servlet engine inside an

    HTTP response.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '6. The web server forwards the HTTP response to your browser in terms of static
    HTML content.

    7. Finally, the web browser handles the dynamically-generated HTML page inside
    the HTTP response exactly as if it were a static page.


    All the mentioned steps can be seen in the following diagram –


    ![](img/74dc853ebf79a1ba6264764c7e97f221_13_0.png)


    Typically, the JSP engine checks to see whether a servlet for a JSP file already
    exists and whether the modification date on the JSP is older than the servlet.
    If the JSP is older than its generated servlet, the JSP container assumes that
    the JSP hasn''t changed and that the generated servlet still matches the JSP''s
    contents. This makes the process more efficient than with the other scripting
    languages (such as PHP) and therefore faster.


    In a way, a JSP page is just another way to write a servlet without having to
    be a Java programming wiz. Except for the translation phase, a JSP page is handled
    exactly like a regular servlet.


    # # Chapter - 4 : Lifecycle


    In this chapter, we will discuss the life cycle of JSP. The key to understanding
    the low-level functionality of JSP is to understand the simple life cycle they
    follow. This is similar


    a JSP life cycle is defined as the process from its creation to the destruction.
    A servlet life cycle with an additional step which is required to compile a JSP
    into servlet.


    # ## Paths Followed By JSP


    Following are the paths followed by a JSP –


    +   1. Compilation

    2. Initialization

    3. Execution

    4. Cleanup


    The four major phases of a JSP life cycle are very similar to the Servlet Life
    Cycle. The four phases have been described below –'
