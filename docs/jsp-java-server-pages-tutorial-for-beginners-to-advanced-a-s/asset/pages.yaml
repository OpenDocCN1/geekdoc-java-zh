    # Setting up Web Server: Tomcat


    A number of Web Servers that support JavaServer Pages and Servlets development
    are available in the market. Some web servers can be downloaded for free and Tomcat
    is one of them.


    Apache Tomcat is an open source software implementation of the JavaServer Pages
    and Servlet technologies and can act as a standalone server for testing JSP and
    Servlets, and can be integrated with the Apache Web Server. Here are the steps
    to set up Tomcat on your machine


    +   1. Download the latest version of Tomcat from https://tomcat.apache.org/

    2. Once you downloaded the installation, unpack the binary distribution into a
    convenient location. For example, in **C:\apache-tomcat-5.5.29 on windows**, or
    **/usr/local/apache-tomcat-5.5.29** on Linux/Unix and create **CATALINA_HOME**
    environment variable pointing to these locations.


    Tomcat can be started by executing the following commands on the Windows machine
    —

    %CATALINA_HOME%bin/startup.bat


    ```

    C:\apache-tomcat-5.5.29\bin\startup.bat

    ```


    Tomcat can be started by executing the following commands on the Unix (Solaris,
    Linux, etc.) machine —

    $CATALINA_HOME/bin/startup.sh


    ```

    /usr/local/apache-tomcat-5.5.29/bin/startup.sh

    ```


    After a successful startup, the default web-applications included with Tomcat
    will be available by visiting **http://localhost:8080/**.

    Upon execution, you will receive the following output —'
