    # # Chapter - 13 : Form Processing


    In this chapter, we will discuss Form Processing in JSP. You must have come many
    situations when you need to pass some information from your browser to the web
    server and ultimately to your backend program. The browser uses two methods to
    pass this information to the web server. These methods are the GET method and
    the POST Method.


    # ## The Methods in Form Processing


    Let us now discuss the methods in Form Processing.


    # ### GET method


    The GET method sends the encoded information appended to the page request. The
    page and the encoded information are separated by the ? character as follows =

    http://www.test.com/hello?key1=value1&key2=value2


    The GET method is the default method to pass information from the browser to the
    web server and it produces a long string that appears in your browser''s Location:box.
    It is recommended that the GET method is better used. If you have a password or
    other sensitive information to pass to the server.


    The GET method has size limitation: only 1024 characters can be in a request string.'
