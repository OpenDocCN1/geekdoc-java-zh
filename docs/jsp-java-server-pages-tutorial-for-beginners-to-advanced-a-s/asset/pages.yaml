  md: 'NetBeans is a free and open-source Java Integrated Development Environment
    that supports the development of standalone Java applications and Web applications
    supporting the JSP and servlet specifications and includes a JSP debugger as well.


    NetBeans supports the following debugging functionalities –


    +   1. Breakpoints

    2. Stepping through code

    3. Watchpoints


    You can refer to NetBeans documentation to understand the above debugging functionalities.


    # Using JDB Debugger


    You can debug JSP and servlets, we can debug jdb commands to debug an app or an
    application.


    To debug a JSP or servlet, you can debug sun.servlet.HttpServer, then observe
    as HttpServer executes the JSPlets in response to HTTP requests we make from a
    browser. This is very similar to how applets are debugged. The difference is that
    with applets, the actual program being debugged is sun.applet.AppletViewer.


    Most debuggers hide detail by automatically knowing how to debug applets. Until
    they do the same for JSP, you have to help your debugger by considering –


    +   1. Set your debugger''s classpath. This helps you find sun.servlet.http.Server
    and your debugger''s associated classes.

    2. Set your debugger''s classpath. This helps you find your JSP and support classes,
    ROOT:WEB-INF-classes.


    Once you have the server classpath, start debugging sun.servlet.HttpServer. You
    can set breakpoints in whatever JSP you''re interested in debugging, then use
    a web browser to make a request to the HttpServer for the given JSP

    (http://localhost:8080/JSPToDebug). The execution stops at breakpoints.


    # Using Comments


    Comments in your code can help the debugger process in various ways. Comments
    can be used in other ways in the debugging process.


    The JSP uses Java comments and single line (// ...) and multiple line (/* */)
    used to temporarily remove parts of your code. If the bug disappears, take a closer
    look at the code you commented and find out the problem.


    # Client and Server Headers


    Sometimes a JSP doesn''t behave as expected, it''s useful to look at the raw HTTP
    request and response. If you''re familiar with the structure of HTTP, you can
    read the request and see exactly what is going on with those headers.


    # Important Debugging Tips


    Here is a list of more debugging tips on JSP debugging –


    +   1. Ask a browser to show the raw content of the page it is displaying. This
    can help identifying formatting problems. It''s usually an option under the View
    menu.

    2. Make sure the browser isn''t caching a previous request''s output by forcing
    a full reload of the page. With Netscape Navigator, use Shift-Reload; with'
