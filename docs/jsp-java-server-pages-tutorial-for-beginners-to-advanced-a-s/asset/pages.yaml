    2. A person with the role of a manager is given access to the secured resources.

    3. The login-config element is used to describe the BASIC form of authentication.


    If you browsing any URL including the /security directory, the following dialog
    box will be displayed for username and password. If you provide a user "admin"
    and password "secret", then you will have access on the URL matched by /secured/
    as you have defined the user manager with the manager who is allowed to access
    this resource.


    # Form Based Authentication


    When you use the authentication method, you must supply a login form to prompt
    the user for a username and password. Following is a simple code of login.jsp.
    This helps create a form for same purpose –


    ```

    <html>

    <body bgcolor="#ffffff">


    <form method="POST" action="j_security_check">

    <table>

    <tr>

    <td>Login</td>

    <td><input type="text" name="j_username"></td>

    </tr>

    <tr>

    <td>Password</td>

    <td><input type="password" name="j_password"></td>

    </tr>

    </table>

    <input type="submit" value="Login!">

    </form>


    </body>

    </html>

    ```


    You have to make sure that the login form must contain the form elements named
    j_username and j_password. The action in the <form> tag must be j_security_check.'
