    # Chapter - 28 : Standard Tag Library (JSTL) Tutorial


    In this chapter, we will understand the different tags in JSP. The JavaServer
    Pages Tag Library (JSTL) is a collection of useful JSP tags which encapsulates
    the core functionality common to many JSP applications.


    JSTL has support for common, structural tasks such as iteration and conditions,
    for manipulating XML documents, internationalisation tags, and SQL tags. It also
    provides a framework for integrating the existing custom tags with the JSTL tags.'
