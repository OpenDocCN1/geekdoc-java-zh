  md: '# # Chapter - 1: Overview


    # ## What are JavaServer Pages?


    JavaServer Pages (JSP) is a technology for developing Web Pages that supports
    dynamic content. This helps developers insert java code in HTML pages by making
    use of special JSP tags, most of which start with %< and end with %>.


    A JavaServer Pages component is a type of Java servlet that is designed to fulfil
    the role of a user interface for a web application. Developers write JSPs as text
    files that combine HTML or XHTML code, XML elements, and embedded JSP actions
    and commands.


    Using JSP, you can collect input from users through Web Page forms, present records
    from a database or another source, and create Web Pages dynamically.


    JSP tags can be used for a variety of purposes, such as retrieving information
    from a database or registering user preferences, accessing JavaBeans, passing
    control between pages, and sharing information between requests, etc.


    # ## Why JSP?


    JavaServer Pages often serve the same purpose as pages implemented using the Common
    Gateway Interface (CGI). But JSP offers several advantages in comparison with
    CGI.


    +   1. Performance is significantly better because JSP allows embedding Dynamic
    Elements in HTML Pages instead of having separate CGI files.

    2. JSP are compiled before they are processed by the server unlike CGI/Perl which
    requires the server to load an interpreter and the target script each time the
    page is requested.

    3. JavaServer Pages are built on top of the Java Servlets API, so like Servlets,
    JSP also has access to all the powerful Enterprise Java APIs, including JDBC,
    JNDI, EJB, JAXP, etc.

    4. JSP can be used in combination with servlets that handle the business logic,
    the model supported by Java servlet template engines.


    Finally, JSP is an integral part of Java EE, a complete platform for enterprise
    class applications. This means JSP can play a role in the simplest applications
    to the most complex and demanding.


    # ## Advantages of JSP


    Following table lists out the other advantages of using JSP over other technologies
    —


    # ### vs. Active Server Pages (ASP)


    The advantages of JSP are twofold. First, the dynamic part is written in Java,
    not Visual Basic or other MS specific language, so it is more powerful and easier
    to use. Second, it is portable to other operating systems and non-Microsoft Web
    servers.


    # ### vs. Pure Servlets


    It is more convenient to write (and to modify!) regular HTML than to have plenty
    of printing statements that generate the HTML.


    # ### vs. Server-Side Includes (SSI)'
