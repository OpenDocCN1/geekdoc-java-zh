    # Functions in JSP EL


    JSP EL allows you to use functions in expressions as well. These functions must
    be defined

    in the custom tag libraries. A function usage has the following syntax –

    $ns:func(param1, param2, ...)


    Where ns is the namespace of the function, func is the name of the function and
    param1

    is the first parameter value. For example, the function fnlength, which is part
    of the JSTL

    library. This function can be used as follows to get the length of a string.


    ```

    $fn:length("Get my length")

    ```


    To use a function any tag library (standard or custom), you must install library
    on

    your server and must include the library in your JSP using the <taglib> directive
    as

    explained in the JSTL chapter.


    # JSP EL Implicit Objects


    The JSP expression language supports the following implicit objects –


    | S.No | Implicit object & Description |

    |---|---|

    | 1 | pageScope<br>Scoped variables from page scope |

    | 2 | requestScope<br>Scoped variables from request scope |

    | 3 | sessionScope<br>Scoped variables from session scope |

    | 4 | applicationScope<br>Scoped variables from application scope |

    | 5 | param<br>Request parameters as strings |

    | 6 | paramValues<br>Request parameters as collections of strings |

    | 7 | header<br>HTTP request headers as strings |

    | 8 | headerValues<br>HTTP request headers as collections of strings |

    | 9 | initParam<br>Context-initialization parameters |

    | 10 | cookie<br>Cookie values |'
