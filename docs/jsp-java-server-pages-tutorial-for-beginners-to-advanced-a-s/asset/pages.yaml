    or an existing bean was found.


    A second context in which jsp:setProperty can appear inside the body of the jsp:useBean
    element, as given below –


    ```

    <jsp:useBean id = "myName" ... />

    <jsp:setProperty name = "myName" property = "someProperty" .../>

