  md: '# Chapter - 8 : Implicit Objects


    In this chapter, we will discuss the Implicit Objects in JSP. These Objects are
    the Java objects that the JSP Container makes available to the developers in each
    page and the developer can call them directly without explicitly declared. JSP
    Implicit Objects are also called **pre-defined variables.**


    Following table lists the nine Implicit Objects that JSP supports –


    | S.No. | Object & Description |

    | --- | --- |

    | 1 | **request**

