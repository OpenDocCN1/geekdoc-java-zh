  md: "![](img/74dc853ebf79a1ba6264764c7e97f221_14_0.png)\n\n# # JSP Compilation\n\
    \nWhen a browser asks for a JSP, the JSP engine first checks to see whether it\
    \ needs to compile the page. If the page has never been compiled, or if the JSP\
    \ has been modified since it was last compiled, the JSP engine compiles the page.\n\
    \nThe compilation process involves three steps –\n\n+   1. Parsing the JSP.\n\
    2. Turning the JSP into a servlet.\n3. Compiling the servlet.\n\n# # JSP Initialization\n\
    \nWhen a container loads a JSP it invokes the **jspinit()** method before servicing\
    \ requests. If you need to perform JSP-specific initialization, override the **jspinit()**\
    \ method –\n\n```\n```java\npublic void jspinit() {\n    // Initialization code...\n\
    }\n```\n```\n\nTypically, initialization is performed only once and as with the\
    \ servlet init method, you generally initialise database connections, open files,\
    \ and create lookup tables in the jspinit method.\n\n# # JSP Execution\n\nThis\
    \ phase of the JSP life cycle represents all interactions with requests until\
    \ the JSP is destroyed.\n\nWhenever a browser requests a JSP and the page has\
    \ been loaded and initialised, the JSP engine invokes the **_jspService()** method\
    \ in the JSP.\n\nThe **_jspService()** method takes an **HttpRequest** and an\
    \ **HttpResponse** as its parameters as follows –"
