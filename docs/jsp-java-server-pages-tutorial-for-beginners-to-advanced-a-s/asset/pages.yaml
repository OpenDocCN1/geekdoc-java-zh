- img_proc: true
  md: 'The response object is an instance of a javax.servlet.http.HttpServletResponse
    object. Just as the server creates the request object, it also creates an object
    to represent the response to the client.


    The response object also defines the interfaces that deal with creating new HTTP
    headers. Through this the JSP programmer can add new cookies or date stamps, HTTP
    status codes, etc.


    We will cover a complete set of methods associated with the response object in
    a subsequent chapter – JSP - Server Response.


    # The Out Object


    The out implicit object is an instance of a javax.servlet.jsp.JspWriter object
    is used to send content in a response.


    The initial JSPWriter is instantiated differently depending on whether the page
    is buffered or not. Buffering can be easily turned off by using the buffered=''false''
    attribute of the page directive.


    The JSPWriter object contains many of the same methods as the java.io.PrintWriter
    class. However, JSPWriter has many instance methods designed to deal with buffering.
    Unlike the PrintWriter object, JSPWriter throws IOException.


    Following table lists out the important methods that we use to write boolean char,
    int, double, object, String.


    | S.No. | Method & Description |

    | 1 | out.print(dataType) <br> Print a data value |

    | 2 | out.print(dataType) <br> Print a data value then terminate the line with
    a new character. |

    | 3 | out.flush() <br> Flush the stream. |


    # The Session Object


    The session object is an instance of javax.servlet.http.HttpSession and behaves
    exactly the way that session objects behave under Java Servlets.


    The session object is used to track sessions between client requests. We will
    cover the complete usage of session objects in a subsequent chapter – JSP - Session
    Tracking.


    # The application Object


    The application object is a direct wrapper around the ServletContext object for
    the generated Servlet and in an instance of a javax.servlet.ServletContext object.


    This object is a representation of the JSP page through its entire lifecycle.
    This object is created when the JSP page initialised and will be removed when
    the JSP page is removed by the jspDestroy() method.


    By adding an attribute to the application, you can ensure that all JSP files make
    up your web application have access to it.


    We will check the use of Application Objects in the JSP - Hits Counter chapter.'
