    # The HttpServletResponse Object


    The response object is an instance of a javax.servlet.http.HttpServletResponse
    object. as the server creates the request object, it also creates an object to
    represent the response to the client.


    The response object also defines the interfaces for dealing with new HTTP headers.
    Through this object, the JSP programmer can add new cookies or date stamps, HTTP
    status codes etc.


    The following methods can be used to set HTTP response header in your servlet
    program. These methods represent the server response.


    | S.No. | Method & Description |

    |---|---|

    | 1 | String encodeRedirectURL(String url)

    Encodes the URL for use in the sendRedirect method or, if encoding is not needed,
    returns the URL unchanged |

    | 2 | String encodeURL(String url)

    Encodes the specified URL by including the session ID in it, or, if encoding is
    not needed, returns the URL unchanged. |

    | 3 | boolean containsHeader(String name)

    Returns a boolean indicating whether the named response header has already been
    set. |

    | 4 | boolean isCommitted()

    Returns a boolean indicating if the response has been committed. |

    | 5 | void addCookie(Cookie cookie)

    Adds the cookie to the response. |

    | 6 | void addDateHeader(String name, long date)

    Adds a response header with the given name and date-value. |

    | 7 | void addHeader(String name, String value)

    Adds a response header with the given name and value. |

    | 8 | void addIntHeader(String name, int integer)

    Adds a response header with the given name and integer value. |

    | 9 | void flushBuffer()

    Forces any content in the buffer to be written to the client. |

    | 10 | void reset() |'
