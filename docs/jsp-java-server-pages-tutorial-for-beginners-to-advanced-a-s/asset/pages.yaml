  md: 'SSI is really intended for simple inclusions, not for "real" programs that
    use data, make database connections, and the like.


    # vs. JavaScript


    JavaScript can generate HTML dynamically on the client but can hardly interact
    with the web server to perform complex tasks like database access and image processing
    etc.


    # vs. Static HTML


    Regular HTML of, course, cannot contain dynamic information.


    # What is Next?


    I would take you step by step to set up your environment to start with JSP. I''m
    assuming you have good hands on experience with Java Programming to proceed with
    learning JSP.


    If you are not aware of Java Programming Language, then we would recommend you
    go through your Java Tutorial to understand Java Programming.


    # Chapter - 2 : Environment Setup


    A development environment is where you would develop your JSP programs, test them
    and finally run them.


    This tutorial will guide you to setup your JSP development environment which involves
    the following steps


    # Setting up Java Development Kit


    This step involves downloading an implementation of the Java Software Development
    Kit (SDK) and setting up the PATH environment variable appropriately.


    You can download the SDK from Oracle''s Java site – Java SE Downloads.


    Once you download your Java implementation, follow the given instructions to install
    and configure the setup. Finally, the PATH and JAVA_HOME environment variables
    to refer to the directory that contain java and javac, typically java_install_dir/bin
    and java_install_dir respectively.


    If you are running Windows and install the SDK in jdk1.5.0_20, you need to add
    the line in your C:\autocec.bat file.


    ```

    set PATH = C:\jdk1.5.0_20;bin;%PATH%

    set JAVA_HOME = C:\jdk1.5.0_20

    ```


    Alternatively, on Windows NT/2000/XP, you can also right-click on My Computer,
    select Properties, then Advanced, followed by Environment Variables. Then, you
    would update the PATH value and press the OK button.


    On Unix (Solaris, Linux, etc.), if the SDK is installed in /usr/local/jdk1.5.0_20
    and you use the C shell, you will put the following into .shrc file.


    ```

    setenv PATH /usr/local/jdk1.5.0_20/bin:$PATH

    setenv JAVA_HOME /usr/local/jdk1.5.0_20

    ```'
