    | 2 | **response**

    This is the **HttpServletResponse** object associated with the response to the
    client. |

    | 3 | **out**

    This is the **PrintWriter** object used to send output to the client. |

    | 4 | **session**

    This is the **HttpSession** object associated with the request. |

    | 5 | **application**

    This is the **ServletContext** object associated with the application context.
    |

    | 6 | **config**

    This is the **ServletConfig** object associated with the page. |

    | 7 | **pageContext**

    This encapsulates use of server-specific features like higher performance Jspriters.
    |

    | 8 | **page**

    This is a synonym for **this**, and is used to call the methods defined by the
    translated servlet class. |

    | 9 | **Exception**

    The **Exception** object allows the exception data to be accessed by designated
    JSP. |


    # The request Object


    The request object is an instance of a `javax.servlet.http.HttpServletRequest`
    object. Each time a client requests the JSP engine creates a new object to represent
    that request.


    The request object provides methods to get the HTTP header information including
    data, cookies, HTTP methods etc.


    We can cover a complete set of methods associated with the request object in a
    subsequent chapter – JSP - Client Request.


    # The response Object'
