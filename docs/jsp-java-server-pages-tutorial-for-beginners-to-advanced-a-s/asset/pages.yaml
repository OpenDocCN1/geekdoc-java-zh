    # Chapter - 31 : JavaBeans


    A JavaBean is a specially constructed Java class written in Java and coded according
    to the JavaBeans API specifications.


    Following are the unique characteristics that distinguish a JavaBean from other
    Java classes


    +   - 1. It provides a default, no-argument constructor.

    - 2. It should be serializable and which can implement the Serializable interface.

    - 3. It may have a number of properties that can be read or written.

    - 4. It may have a number of "getter" and "setter" methods for the properties.'
