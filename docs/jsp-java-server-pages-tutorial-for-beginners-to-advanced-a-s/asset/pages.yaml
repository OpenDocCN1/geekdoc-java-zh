  md: "POST must be used as the form method. At the same time, you will have to modify\
    \ the <login-config> tag to specify the auth-method as FORM –\n\n```\n<web-app>\n\
    \  ...\n  <security-constraint>\n    <web-resource-collection>\n      <web-resource-name>SecuredBookSite</web-resource-name>\n\
    \      <url-pattern>/secured/*</url-pattern>\n      <http-method>GET</http-method>\n\
    \      <http-method>POST</http-method>\n    </web-resource-collection>\n    <auth-constraint>\n\
    \      <description>Let only managers use this app</description>\n      <role-name>manager</role-name>\n\
    \    </auth-constraint>\n  </security-constraint>\n  <security-role>\n    <role-name>manager</role-name>\n\
    \  </security-role>\n  <login-config>\n    <auth-method>FORM</auth-method>\n \
    \   <form-login-config>\n      <form-login-page>/login.jsp</form-login-page>\n\
    \      <form-error-page>/error.jsp</form-error-page>\n    </form-login-config>\n\
    \  </login-config>\n</web-app>\n```\n\nNow when you try to access any resource\
    \ with URL /secured/* it will display the form asking for the user id and password.\
    \ When the container sees the \"j_security_check\" action, it uses some internal\
    \ mechanism to authenticate the caller.\n\nIf the login succeeds, the container\
    \ is authorised to access the secured resource, then the container uses a session-id\
    \ to identify a login session for the caller from that point. The server sends\
    \ the cookie back to the client, and as long as the client presents this cookie\
    \ with subsequent requests, the container will know who is the caller.\n\nIf the\
    \ login fails, then the server sends back the page identified by the form-error-page\
    \ setting\n\nHere, j_security_check is the action that applications using form\
    \ login have to specify for the login form. In the same form, you should also\
    \ have a text input control called j_username and a password input control called\
    \ j_password. When you see this, the information contained in the form will be\
    \ submitted to the server, which will check name and password. How this is done\
    \ is specific.\n\nCheck Standard Realm Implementations to understand how j_security_check\
    \ works for Tomcat containers.\n\n# Programmatic Security in a Servlet/JSP"
