  md: 'The HttpServletRequest object provides the following methods, which can be
    used to mine security information at runtime –


    | S.No. | Method & Description |


    **String getAuthType()**nThe getAuthType() method returns a String object that
    represents the name of the authentication scheme used to protect the Servlet.


    **boolean isUserRole(java.String role)**nThe isUserRole() method returns a boolean
    value: if the user is in the given role or if they are not.


    **String getProtocol()**nThe getProtocol() method returns a String object representing
    the protocol that was used to send the request. This value can be checked to determine
    if a secure code was used.


    **boolean isSecure()**nThe isSecure() method returns a boolean value representing
    if the request was made using HTTPS. A value of true means that the connection
    is secure. A value of false means the request was not


    **Principal getUserPrincipal()**nThe getUserPrincipal() method returns a java.security.Principal
    object that contains the name of the current authenticated user.


    For example, a Java Page that links to pages for managers, you might have the
    following code


    ```

    <% if (request.isUserRole("manager")) { %>

    <a href="managers/mgreport.jsp">Manager Report</a>

    <a href="managers/personnel.jsp">Personnel Records</a>

    <% } %>

    ```


    By checking the user''s role in a JSP or post, you can customise the Web Page
    to show the user only the items they can see. If you need the user name as it
    was entered in the authentication form, you can call the getRemoteUser method
    in the request object.


    # # Chapter - 39 : Internationalisation| i18n| l10n


    In this chapter, we will discuss the concept of Internationalisation in JSP. Before
    we proceed, let us understand the three important terms –


    +   - **Internationalisation (i18n)** – This means enabling a website to provide
    different versions of content translated into the visitor''s language or nationality.

    - **Localization (l10n)** – This means adding resources to a website to adapt
    it to a particular geographical or cultural region, for example Hindi translation
    to a web site.

    - **locale** – This is a particular cultural or geographical region. It is usually
    referred to as a language symbol followed by a country symbol which is separated
    by an'
