    # JSP Operators


    JSP supports all the logical and arithmetic operators supported by Java. Following
    table lists out all the operators with the highest precedence appear at the top
    of the table, those with the lowest appear at the bottom.


    Within an expression, higher precedence operators will be evaluated first.


    | Category | () []. (dot operator) | Associativity |

    | --- | --- | --- |

    | Postfix | | Left to right |

    | Unary | ++ - ~ | Right to left |

    | Multiplicative* / % | Left to right |

    | Additive | + | Left to right |

    | Shift | >> >>> << | Left to right |

    | Relational | > = < <= | Left to right |

    | Equality | == != | Left to right |

    | Bitwise AND | & | Left to right |

    | Bitwise XOR | ^ | Left to right |

    | Bitwise OR | | | Left to right |

    | Logical AND | && | Left to right |

    | Logical OR | || | Left to right |

    | Conditional | ? | Right to left |

