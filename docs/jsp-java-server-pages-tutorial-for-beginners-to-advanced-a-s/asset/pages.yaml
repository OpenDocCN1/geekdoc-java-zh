  md: '# Setting Cookies with JSP


    Setting cookies with JSP involves three steps –


    # Step 1: Creating a Cookie object


    You call the Cookie constructor with a cookie name and a cookie value, both of
    which are strings.


    Cookie cookie = new Cookie("key", "value");


    Keep in mind, neither the name nor the value should contain white space or any
    of the following characters –


    []() = "" / ? @ : ;


    # Step 2: Setting the maximum age


    You use setMaxAge to specify how long (in seconds) the cookie should be valid.
    The following code will set up a cookie for 24 hours.


    cookie.setMaxAge(60*24);


    # Step 3: Sending the Cookie into the HTTP response headers


    You use response.addCookie to add cookies in the HTTP response header as follows


    response.addCookie(cookie);


    # Example


    Let us modify our Form Example to set the cookies for the last name.


    ```

    <%

    // Create cookies for first and last names.

    Cookie firstName = new Cookie("first_name", request.getParameter("first_name"));

    Cookie lastName = new Cookie("last_name", request.getParameter("last_name"));


    // Set expiry after 24 Hrs for both the cookies.

    firstName.setMaxAge(60*24);

    lastName.setMaxAge(60*24);


    // Add both the cookies in the response header.

    response.addCookie(firstName);

    response.addCookie(lastName);

    %>

    ```


    ```

    <html>

    <head>

    <title>Setting Cookies</title>

    </head>


    <body>

    <center>

    <h1>Setting Cookies</h1>

    </center>

    </body>

    </html>

    ```'
