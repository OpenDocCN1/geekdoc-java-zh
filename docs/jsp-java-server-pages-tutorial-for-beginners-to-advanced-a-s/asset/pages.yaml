    # Deleting Session Data


    When you are done with a user''s session data, you have several options –


    +   1. **Remove a particular attribute** — You can call the public **void removeAttribute(String
    name)** method to delete the value associated with a particular key.


    +   2. **Delete the whole session** — You can call the public **void invalidate()**
    method to discard an entire session.


    +   3. **Setting Session timeout** — You can call the public **void setInactiveInterval(int
    interval)** method to set the timeout for a session individually.


    +   4. **Log the user out** — The servers that support 2.4, you can call **logout**
    to log the client out of the Web server and invalidate all sessions belonging
    to the users.


    +   5. **web.xml Configuration** — If you are using Tomcat, apart from the above
    methods, you can configure the session timeout in the web.xml file as follows.


    ```

    <session-config>

    <session-timeout>15</session-timeout>

    </session-config>

    ```


    The timeout is expressed in minutes, and the default timeout which is 30 minutes
    in Tomcat.


    The **getMaxInactiveInterval()** method returns the timeout period for that session
    in seconds. If your session is configured in web.xml for 15 minutes, **getMaxInactiveInterval()**
    returns 900.


