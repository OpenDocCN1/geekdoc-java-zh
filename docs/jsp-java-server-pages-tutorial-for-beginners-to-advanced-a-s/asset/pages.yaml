    # # HTTP Header Request Example


    Following the example which uses the getHeaderNames() method of

    HttpServletRequest to read the HTTP header information. This method returns an

    Enumeration that contains the header information associated with the current HTTP

    request.


    Once we have an Enumeration, we can loop down the Enumeration in the standard\anner.
    We use the hasElements() method to determine when to stop and the

    nextElement() method to get the name of each parameter name.


    ```

    <@page import = "java.io.*,java.util.*" %%

    <html>

    <head>

    <title>HTTP Header Request Example</title>

    </head>

    <body>

    <center>

    <h2>HTTP Header Request Example</h2>

    <table width="100%" border="1" align="center">

    <tr bgcolor="#949494">

    <th>Header Name</th>

    <th>Header Value</th>

    </tr>

    <%

    Enumeration headerNames = request.getHeaderNames();

    while(headerNames.hasElements()) {

    String parameterName = (String)headerNames.nextElement();

    out.print("<tr><td>" + parameterName + "</td></tr>\n");

    String parameterValue = request.getHeader(parameterName);

    out.print("<tr><td>" + parameterValue + "</td></tr>\n");

    }

    <%

    </table>

    </center>

    </body>

    </html>\</table>

    ```'
