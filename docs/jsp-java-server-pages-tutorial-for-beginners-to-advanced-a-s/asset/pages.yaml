    # # The HttpServletRequest


    The request object is an instance of a java.servlet.http.HttpServletRequest object.
    Each time a client requests a page, the JSP engine creates a new object to represent
    that request.


    The request object provides methods to get HTTP header information including form
    cookies, HTTP methods, etc.

    Following table lists out the important methods that can be used to read HTTP
    header in your JSP program. These methods are available with the HttpServletRequest
    object which represents clients to the web server.


    | S.No. | Method & Description |

    |---|---|

    | 1 | Cookie[] getCookies() Returns an array containing all of the Cookie objects
    the client sent with this request. |

    | 2 | Enumeration getAttributeNames() Returns an enumeration containing the names
    of the attributes available to this request. |

    | 3 | Enumeration getHeaderNames() Returns an enumeration of all the headers this
    request contains. |

    | 4 | Enumeration getParameterNames() Returns an enumeration of String objects
    containing the names of the parameters contained in this request. |

    | 5 | HttpSession getSession() Returns the current session associated with this
    request, or if the request does not have a session, creates one. |

    | 6 | HttpSession getSession(boolean create) Returns the current session associated
    with this request or, if there is no current session and create is true, returns
    a new session. |

    | 7 | Locale get() Returns the preferred Locale that the client will accept content,
    based on the Accept-Language header. |

    | 8 | Object getAttribute(String name) Returns the value of the named attribute
    as an Object, or null if no attribute of the given name exists. |

    | 9 | ServletInputStream getInputStream() Retrieves the body of the request as
    binary data using a ServletInputStream. |'
