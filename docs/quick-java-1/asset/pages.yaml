  md: '# Quick Java


    +   4. Execute the class. The class does not define a main method; that is in
    the JUnit framework. When run, JUnit will produce a report that either (1) says
    all tests passed or (2) tells which tests failed.


    If you have written the tests properly, they will not ask you for input or otherwise
    interrupt the running of the tests.


    # 7.4 JUnit 5 Assertions


    A unit test is a test of a single class. It is an ordinary class that imports
    a test framework and annotates some of its methods to mark them for special processing.
    First, do the following:


    ```

    import org.junit.jupiter.api.*;

    import static org.junit.jupiter.api.Assertions.*;nimport static org.junit.jupiter.api.Assumptions;

    ```


    The first import statement makes the annotations available, the second makes the
    test methods (such as assertEquals) available, and the third makes assumptions
    (described later) available.


    Next, write the methods that will be used by JUnit. Each method should be public
    void, should take no parameters, and should have one of the following annotations:


    +   @BeforeAll annotates a static method that will be run only before any tests
    are run. This is used when the tests use expensive resources; for example, it
    might open a database.


    +   @BeforeEach annotates a method that will be run before and after every test.
    It should reset any global variables to a pristine state that the execution of
    one test does not influence the results of some other.


    +   @Test marks a method as a test method. Ideally, each test method tests a single
    method in the class being tested. Sometimes there are tests for the same method,
    testing different kinds of input. Sometimes a test method has to depend on the
    correct functioning of some methods in order to test other methods.'
