    ```


    Classes inherit all the fields and all methods of their superclasses. Every class
    has not only its own fields and methods but also every field and every method
    available to all of its superclasses. Hence, a class may contain much more information
    than is obvious from the class definition.


    For example, if you have a Person class that has a name field, and you write a
    Customer class that extends Person, then every Customer object also has a name
    field. If your Person class has a visit method, then every Customer object also
    has a visit method.


    Inherited methods can be overridden (replaced) by declaring a method with the
    same name and the same number and types of parameters; see 4.4 for more details.


    Constructors are not inherited.


    # 4.3 CASTING OBJECTS


    Recall that numeric values can be cast (converted) from one type to another. An
    int value can be put into a double variable with no trouble because a double is
    in some sense “wider” than an int. But to put a double value into an int variable,
    it must be explicitly cast to an int by putting (int) in front of the variable;
    for example, int pi = (int) Math.PI.


    Smartly, objects of one type can be put into a variable of a different type if
    and only one of the types is an ancestor (superclass) of the other. Upcasting
    is casting to an ancestor type, and can happen automatically; downcasting is casting
    to a descendant type, and an explicit cast is required. For example, if BirthdayCake
    extends Cake and Cake extends Object, then the following assignments are possible:


    ```

    BirthdayCake myCake = new BirthdayCake();

    Cake cake = myCake;

    Object obj = myCake;

    ```'
