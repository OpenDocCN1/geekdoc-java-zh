    a single statement. If you want to control more than just one statement, you must
    enclose those statements in braces, {}, to make them into a (single) compound
    statement.


    **Style:** Standard Java style is to put an opening brace at the end of a line,
    never on a line by itself. The closing brace should be indented the same amount
    as the line containing the brace.


