    \n# 10.2 SYNCHRONIZATION\n\nThere are many cases when it is desirable to have\
    \ many processes (threads) running in parallel. For example, other work could\
    \ be done while a slow database access or file transfer is in process.\n\nSubtle,\
    \ irreducible errors can result when a value is changed by one thread while being\
    \ accessed by a different thread, or when two threads try to update the same value.\
    \ To avoid this situation, Java introduces the concept of synchronization, which\
    \ simply means giving one thread temporary exclusive access to a value or set\
    \ of values.\n\nYou can synchronize on an object:\n\n```\nsynchronized (obj) {\
    \ code }\n```\n\nHere, synchronized is being used as a statement. No other code\
    \ can synchronize on object obj until the code finishes.\n\n+   Note 1: It often\
    \ makes sense to synchronize on the object you want to access or modify, but this\
    \ is not a requirement. Any object can be used for synchronization, and the code\
    \ might access or modify completely unrelated values."
