  md: '# How to Build a GUI Program ■ 167


    | GridLayout |

    | One | Two |

    | Three | Four |

    | Five | |


    FIGURE 9.3 A GridLayout.


    Since there are only a few kinds of layout managers, they are listed here:


    +   - BoxLayout — Puts components in a single row or single column.

    - CardLayout — Uses a JComboBox widget to choose which JPanel to display.

    - GridBagLayout — Allows precise control of layout, it is very difficult to use.

    - GroupLayout — Works with horizontal and vertical layouts separately.

    - SpringLayout — Allows precise control of relationships between components.


    To use a layout manager than the default, call container.setLayout(layoutManager).
    For example:


    ```

    myPanel.setLayout(new GridLayout(rows, columns));

    ```


    Once the layout manager has been determined, components can be added. The method
    to use depends on the type of layout manager.


    +   - For a flow layout, use container.add(component);

    - For a grid layout, use either container.add(component); or container.add(component.index);
    where the index is a single integer starting at 0.

    - For a border layout, use container.add(component, BorderLayout.area); where
    the area is one of NORTH, SOUTH, EAST, WEST, and CENTER. The border takes up only
    as much space as necessary to lay out their components, and the center gets all
    the remaining space.


    JTabbed (see section 9.8.4) is not a layout manager but is a good alternative
    to CardLayout.'
