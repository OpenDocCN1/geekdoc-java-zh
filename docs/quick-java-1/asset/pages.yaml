    # 5.2.4.3 Bit and Shift Operators


    Any of the integer types may be treated as a sequence of bits. If i and j are
    integer values, then the following operations are provided:


    +   - -i - inverts every bit of i, that inverts every 0 to a 1 and every 1 to
    a 0. Numerically, this is the equivalent of -i - 1.

    - i & j - "ands" the corresponding bits together. Each resultant bit is 1 if and
    only both bits are 1.

    - i | j - "ors" the corresponding bits together. Each resultant bit is 0 if and
    only both bits are 0.

    - i ^ j - "exclusive ors" the corresponding bits together. Each resultant bit
    is 1 if and only the two bits are different.

    - i << j - shifts the bits of i to the left j places. Numerically, this is the
    equivalent of i * 2³.

    - i >> j - shifts the bits of i to the right j places, with the leftmost bit (the
    sign bit) duplicated. Numerically, this is the equivalent of i / 2³.

    - i >>> j - shifts the bits of i to the right j places, with zeros coming to the
    left.


    The shorter integer types are converted to 32-bit integers before the above operations
    are performed, so the result is always an int value.


