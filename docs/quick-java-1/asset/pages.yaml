  md: '# 9.6 CREATE COMPONENTS


    A widget is a GUI control, as a button or text area, intended for the user to
    interact with it. Widgets are components; they can be added to a container such
    as a JPanel or JFrame.


    Figure 9.4 shows some of the commonly used widgets.


    | Menu | Dialogs | Help |

    |---|---|--|

    | This is a JButton | This is a JTextField | This is a TextArea; it can have multiple
    lines |

    | This is a JCheckBox | These are JRadioButtons... ...in a ButtonGroup | This
    is a JLabel |

    | JComboBox | | This is a JSpinner 20 |


    Figure 9.4 Commonly used widgets.


    An active widget is one that causes the program to do something whenever it is.
    Buttons and most menu items are active: Clicking on an active widget has an immediate
    effect.


    A passive widget is one that accepts information but doesn''t immediately do something
    with it; it just holds on the information until the program asks for it. Text
    fields, text areas, check boxes, and radio buttons are almost always passive.
    Some widgets, like combo boxes, can be either active or passive.


    A widget is made active by attaching a listener to it.


    +   * **Style rule:** Don''t confuse the user by attaching listeners to widgets
    that are almost always passive.

    * **Style rule:** When the user clicks an active widget, it should be obvious
    that some action has occurred. This can be fairly subtle; for example, many editors
    display an asterisk next to the file name when a file is modified, and remove
    the asterisk when the file is saved.'
