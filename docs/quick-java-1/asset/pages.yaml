  md: '# Quick Java


    To create a JPanel:

    JPanel panel = new JPanel(); // default: flow layout

    JPanel panel = new JPanel(layoutManager);


    # 9.5 ADD A LAYOUT MANAGER


    Every container (JFrame or JPanel) has a layout manager associated with it. You
    can use the default layout manager or specify a different one. Here are the layout
    managers we will cover in detail:


    +   - BorderLayout (see Figure 9.1) — This is the default layout manager for a
    JFrame. It provides five areas into which you can put up to five components; any
    area without a component simply disappears.


    ![](img/fb8b9ea4edf0c31c9f97e5eb4d89a6be_186_0.png)


    FIGURE 9.1 A BorderLayout.


    +   - FlowLayout (see Figure 9.2) — This is the default layout manager for a JPanel.
    It adds components from left to right, top to bottom.


    ![](img/fb8b9ea4edf0c31c9f97e5eb4d89a6be_186_1.png)


    FIGURE 9.2 A FlowLayout.


    +   - GridLayout (see Figure 9.3) — This puts components into a rectangular grid,
    with all areas being the same size and shape.'
