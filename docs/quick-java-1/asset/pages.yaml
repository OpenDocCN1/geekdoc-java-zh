    # 5.2.2 Data


    # 5.2.2.1 Wrapper Classes


    Primitive values in Java are not objects, so you can''t talk to them (send a message
    to them) the way you would to an object. To make up for this lack, each primitive
    type has a corresponding wrapper class. Those classes are: Boolean, Byte, Character
    (not Char), Double, Float, Integer (not Int), Long, and Short. The wrapper classes
    are in java.lang, which is automatically imported into every program.


    Wrapping and unwrapping happen automatically. If a method expects an Object as
    an argument, but you call it as a primitive, the primitive will automatically
    be “wrapped” into the correct kind of object. Similarly, if you to add 1 to an
    Integer object, that object will be unwrapped to an int.


    > **Trap:** If a and b are Integer (not int) values, the test a==b tests whether
    a and b are equal for values less than 128, but tests for identity (whether a
    and b are the same object) for larger values. The equals method, a.equals(b),
    tests for equality in all cases.


    Each wrapper class has some useful static constants and methods. Since they are
    static, you use them by talking to the class, in many cases providing the primitive
    as an argument to a method. For example, there is a special double value NaN (Not
    A Number), held in the static constant Double.NaN. If you have a double variable
    d and you want to know if it holds this value, you can ask Double.isNaN(d).


