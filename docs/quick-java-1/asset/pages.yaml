    # 9.8.17 Mouse Input


    All of the common widgets handle mouse events automatically. However, if you wish
    to do something special, such as point at specific parts of an image, you can
    write your own mouse listeners. There are separate listeners for clicks, movement,
    and scrolling.


    The MouseListener interface specifies five public void methods: mouseEntered,
    mouseExited, mousePressed, mouseReleased, and mouseClicked. Each of these receives
    a MouseEvent argument (see below). The only one of these methods you are likely
    to care about is mouseClicked, but MouseListener is an interface, so you have
    to provide them all, even if they don''t do anything.


    The MouseListener interface specifies two public void methods, mouseMoved and
    mouseDragged, both with a MouseEvent argument.


    The MouseEvent object has the following methods (among others):


    +   - getButton() returns one of the values MouseEvent.BUTTON1, MouseEvent.BUTTON2,
    or MouseEvent.BUTTON3.


    +   - getX() and getY() return the mouse location, in pixels, relative to the
    top-left corner of the component that has the listener. X values increase as the
    mouse pointer moves to the right, and Y values increase as the mouse pointer moves
    down.'
