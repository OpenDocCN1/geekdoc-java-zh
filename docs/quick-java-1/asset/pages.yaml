  md: '# How to Build a GUI Program ■ 169


    A tooltip is a small text message that pops up when the user hovers over a component,
    usually to give a little more information about the purpose of the component.
    Tooltips can be added to almost any component.


    ```

    widget.setToolTip("Purpose of widget");

    ```


    # 9.7 ADD LISTENERS


    Once a GUI program is started up, it typically does nothing more until an event
    occurs. If there is a listener for that event, the listener executes some block
    of code to completion, then nothing happens until the next event occurs.


    Many events are handled "automatically," by built-in listeners. If you type a
    character while the focus is on a text field, somewhere under the hood there is
    a listener that responds to the event by drawing a character in the text field.
    If you click a button, the button "depresses" (changes appearance) as the result
    of built-in listeners. However, all these built-in listeners do change the appearance
    of the text field or button. To have the button do something useful, you must
    add a listener to it that will execute some code when the button is clicked.


    Generally speaking, you shouldn''t add listeners to passive widgets like text
    fields or checkboxes. Instead, ask for their value when you need to know it.


    Different widget types have different kinds of listeners. A JButton should have
    an ActionListener, while a JSlider might have a ChangeNotifier.


    Other listeners, such as ActionListener, are functional interfaces—they define
    exactly one abstract method. For these listeners, you can simply supply a function,
    for example,


    ```

    addActionListener(event -> code);

    ```


    Other listeners are not functional interfaces, typically because they specify
    more than one method. For these, you must define a class that implements all the
    methods, and provide an object of that class—for example, see the implementation
    of KeyListener in section 9.8.16.'
