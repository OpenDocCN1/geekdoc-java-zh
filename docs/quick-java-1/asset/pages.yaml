  md: '# A Lightning Tour of Java ■ 5


    **Terminology**: You don’t “call” a method. Instead, you “send a message to an
    object,” where the “message” consists of the method name and its parameters.


    To send a message to an object, use **dot notation** like this: `object.method(parameters)`.
    For example, firstName.charAt(0).


    Literal strings are enclosed in double quotes: "Hello". Character literals are
    written in single quotes: ''a''.


    All variables must be **declared** before use; this specifies their type. They
    can also be **defined**, or given an initial value.


    ```

    int count;              // declaration

    count = 0;             // definition

    int count = 0;         // declaration + definition

    ```


    All values in an array must be of the same type. The type of the array is written
    as the type of the elements, followed by empty brackets. For example, `int[]`
    denotes an array of integers. The length of an array is not part of the declaration;
    it is part of a definition.


    ```

    int[] numbers = new int[100];

    ```


    Arrays are **zero-based**. The first element in the numbers array is numbers [0],
    and the last element is numbers [99]. The length of the array, 100, is given by
    numbers.`length`.


    The values in a newly-declared array will be zero (for numeric arrays), false
    (for boolean arrays), or null (for arrays of objects). Because characters are
    treated as numeric values, the values in an array of char will be the character
    "NULL" whose code is zero.


    # 1.4 OPERATORS


    Java has the usual arithmetic operators: + (add), - (subtract, or unary minus),
    * (multiply), / (divide), and % (remainder, or modulus). The multiplicative operators
    *, /, and % are done before the additive operators + and -. Operations of the
    same precedence are done from left to right.'
  merge: -1
  pgno: 25
