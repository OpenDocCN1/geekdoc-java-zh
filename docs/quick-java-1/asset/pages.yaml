  md: "# 3.3.1.5 While Loops\n\nA while loop is a loop with the test at the top. The\
    \ syntax is:\n\n```\nwhile (condition) {\n  statements\n}\n```\n\nFirst, the condition\
    \ is tested; if it is false, nothing more is done, and the loop exits without\
    \ ever executing the statements. If the condition is true, the statements are\
    \ executed, then the entire loop (starting with the test) is executed again.\n\
    \nFor example, the number of digits in a nonzero number can be computed:\n\n```\n\
    int countDigits(int number) {\n  count = 0;\n  while (number != 0) {\n    number\
    \ = number / 10;\n    count += 1;\n  }\n  return count;\n```\n\nThe braces indicate\
    \ a block of statements. If there is only one statement, the braces may be omitted;\
    \ however, it is good style to always include the braces.\n\nNormally, the statements\
    \ controlled by the loop must affect the condition being tested. In the above\
    \ example, number is compared to 0, and the statements in the loop change the\
    \ value of number. If the controlled statements never make the condition false,\
    \ then the loop never exits, and the program “hangs” (stops responding). This\
    \ is a kind of error commonly, if inaccurately, called an infinite loop.\n\nTwo\
    \ additional statement types, break and continue (see sections 3.3.1.11 and 3.3.1.12),\
    \ can also control the behavior of while loops. These statements can be used with\
