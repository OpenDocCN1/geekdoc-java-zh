  md: '# How to Build a GUI Program


    HERE IS THE GENERAL FORMULA FOR BUILDING a GUI program:


    +   1. Import the necessary packages.

    2. Create a window in which to display things—usually a JFrame. Optionally create
    JPanels to put in the JFrame.

    3. Use the setLayout(manager) method to choose a layout manager for each JFrame
    and JPanel. The layout manager is in charge of putting things in the correct places
    in the window or panel.

    4. Create some Components, such as buttons, panels, etc.

    5. Ask the layout manager to place the components.

    6. Write some Listeners and attach them to your components. When a user interacts
    with a component, one or more Events will occur, and your Listener can execute
    some code to handle the event.

    7. Display the window.


    # 9.1 EVENT-DRIVEN PROGRAMS


    A program without a GUI is in complete control, from beginning to end. It may
    use some dialogs to interact with the user, but the program is always in control.


    DOI: 10.1201/9781003402947-9'
