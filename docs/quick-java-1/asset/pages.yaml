  md: '# The “Inner Language” of Java ■ 43


    The break statement is not required at the end of each case, just strongly recommended.
    Without a break, control will “fall through” into the next group of statements.
    This is seldom what you want to happen. On the rare occasion that this really
    is the desired behavior, you should include a comment that the omission is intentional,
    otherwise you or someone else may “correct” this apparent problem at some later
    date.


    If the same code should be executed for one or more constants, rather than duplicating
    the code, one case **constant**: can be followed immediately by the next, for
    example:


    +   case "yes":

    case "Yes":

    case "YES":

    some statements


    In Java 14 and later, the above can be abbreviated to


    case "yes", "Yes", "YES": **some statements**.


    The default case is optional, and should come last; it will be executed if no
    earlier matching **expression** is found. If no matching **expression** is found
    and there is no default case, the switch statement exits without doing anything.


    It is good style to include a default case, even if you believe that all possibilities
    have been covered. The default case might be empty, or it could include the statement
    false; to indicate that this code should never be reached. (Assert statements
    are covered in section 3.3.2.1.)


    The **statements** may be any sequence of zero or more statements. It is not necessary
    to use braces to group the statements (including the following break statement)
    into a compound statement, although this is sometimes done.'
