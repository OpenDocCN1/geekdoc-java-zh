  md: '# 10.6.1 MVC


    MVC, or Model-View-Controller is a useful design pattern when one thread is used
    to control another thread, such as when doing animation.


    **Terminology: A design pattern** is simply a way of organizing code that has
    been found to be generally useful. MVC is considered here in order to introduce
    some useful objects and interfaces.


    **model** is the code doing the actual work of the simulation, animation, or whatever.
    It should be free of any input/output, and completely independent of both the
    view and the controller. If there is a GUI, it should be completely unknown to
    the model.


    The **view** displays information about what is going on in the model. In the
    case of an animation, it displays the current frame of the animation.


    The **controller** is used to send commands or information to the model.


    The model, view, and controller can be implemented as three separate classes,
    but in small GUI programs, it is often convenient to combine the controller and
    view into a single class.


    # 10.6.2 Controller


    The controller''s main job is to set up the GUI, so it extends JFrame and adds
    Run and **Stop** buttons. It creates the model and the view. Since the view has
    to know about the model, but the model doesn''t have to know about the view, the
    model is created first.


    ```

    model = new Model();

    view = new View(model);

    ```


    Since the ball is to bounce off the edges of the window, it has to know where
    they are. The top and left edges are at 0; the right edge is the width of the
    window, and the bottom edge is the height of the window. If the window is resized,
    the new values must be fetched and sent to the model.


    ```

