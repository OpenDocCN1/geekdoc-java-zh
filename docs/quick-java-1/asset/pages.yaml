  md: '# 192 ■ Quick Java


    **Note 2**: Synchronizing on an object prevents *only* other threads synchronizing
    on the *same* object from running. Unsynchronized code, or code synchronizing
    on other objects, is not affected.


    You can synchronize a method:


    ```

    synchronized void methodName(arguments) { code }

    ```


    In this case, synchronized is being used as a method modifier; it synchronizes
    on the object this.


    Synchronizing on an object means that the thread gets a “lock” on that object,
    and no other thread can synchronize on it until the code is released. While it
    has the lock, the thread can also use any other methods that synchronize on the
    same object. Again, there is no protection from unsynchronized code, or from code
    that synchronizes on some other object.


    The point of multithreading is to allow different threads to run at the same time,
    so long as they are not attempting to access the same objects. Synchronization
    is expensive, and it is very difficult to maintain correctness while pursuing
    efficiency.


    # 10.3 TIMERS


    A javax.swing.Timer is used to schedule code for repeated execution. The constructor
    takes two parameters: an int in milliseconds, which is used to set both the initial
    delay and the time between events; and an ActionListener (usually an anonymous
    inner class) to do something at each “tick” of the Timer.


    There are a number of messages that can be sent to a Timer, including stop(),
    start(), setDelay(ms), and restart().


    # 10.4 PROPERTY CHANGES


    A java.beans.PropertySupport object is one way that an object can inform other
    objects that it has been updated.'
