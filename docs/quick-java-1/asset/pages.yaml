  md: "# 2 Quick Java\n\nA method is like a function, except that a method belongs\
    \ to an object, and (normally) works with the fields of that object. A method\
    \ may contain declarations of variables and will contain executable statements.\n\
    \nTo summarize, here is how a project is organized:\n\n+   - packages (directories)\
    \ of files\n  - classes (generally one per file); each class contains:\n    -\
    \ fields (the data)\n    - constructors, containing declarations and statements\n\
    \    - methods, containing declarations and statements\n\nIn addition to the above,\
    \ packages in Java 9 and later can be organized into even larger units, called\
    \ modules. This is appropriate for programs with large numbers of packages. The\
    \ JDK (Java Development Kit) is huge, consisting of about a hundred modules, hundreds\
    \ of packages, and thousands of classes. The single module relevant to this book\
    \ is java.base.\n\nModules will be discussed briefly in section 5.3.9.\n\n# 1.2\
    \ FIRST GLIMPSE: THE CIRCLE CLASS\n\nThe following program demonstrates the overall\
    \ structure of a Java program and provides an initial glimpse into what a Java\
    \ program looks like.\n\n```\npackage examples.shapes;\npublic class Circle {\n\
    \    private int radius;\n\n    public Circle(int r) {\n        radius = r;\n\
    \    }\n\n    public double area() {\n        return Math.PI * Math.pow(radius,\
    \ 2);\n    }\n}\n```"
