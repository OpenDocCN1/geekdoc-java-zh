- img_proc: true
  md: '# Quick Java


    CircleApp does not have an explicit constructor (it has an implicit one, but ignore
    that for now). It does have a main method, which is the starting point for the
    program. For complex reasons, the main method is always defined as public static
    void main(String[] args)—just memorize this for now; understanding will come later.


    The main method then:


    +   - Declares a local variable size as an integer and gives it a value of 10.

    - Declares another local variable c of type Circle and uses the keyword new to
    call the Circle constructor. It gets back a newly created Circle object and assigns
    it to c.

    - As c for its area, and assigns the result to the double (floating point) variable
    area.

    - Prints the result:


    The area of a circle with radius 10 is 314.16


    # 1.3 DATA


    Every data value in Java is either a primitive or an object. There are eight kinds
    of primitives, most of them numeric types. Objects are defined by classes, and
    each class defines a new type of object.


    The four most important types of primitive are: int (integers, or whole numbers),
    double (numbers containing a decimal point), boolean (the values true and false),
    and char (individual characters).


    Two important types of object are strings and arrays. Strings are objects defined
    by the String class, while arrays are defined using a more traditional syntax
    (but they are still objects.)


    An obvious distinction between primitives and objects is that primitives have
    operations: 3 * n, big && round, and so on, while objects have methods. (Exception:
    The + operator can be used to concatenate (“add”) strings.)'
  merge: -1
