    # 3.5 OBJECTS AND CLASSES


    The syntax of classes and objects will be discussed, but it is helpful to begin
    with some understanding of what these things are.


    Before object-oriented programming, data and functions would be distributed throughout
    a program, perhaps grouped to some extent, with no formal organization. Object-oriented
    programming provides that organization.


    An object is a “thing.” Some objects represent things in the real world, such
    as a Customer or a Date. Most objects represent things in the “computer world,”
    such as a String or a HashMap. Some things are between, such as a Calendar. Each
    object has some data, called fields, describing this particular object, and it
    has some methods, defining what the object can do.'
