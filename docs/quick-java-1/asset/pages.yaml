    # 4.1.4 Fields


    A class typically contains fields (or more accurately, field declarations). This
    is where data is kept. It is the values in these fields that make one object different
    from another object of the same type.


    A field declaration looks like this:


    ```

    static access type fieldName = expression;

    ```


    If the word static is present, then there is only one copy of the variable being
    defined, and it is shared by all instances of the class. Otherwise, every object
    created from this class has its own copy of the fieldName variable. In the Password
    class mentioned earlier, every object of that type has its own password field.


    > Terminology: An object is an instance of its class, so a field belonging to
    an object is also called an instance variable. A static variable belongs to the
    class itself, and is also called a class variable.


    The access can be omitted (“package” access), or it can be either public, protected,
    or private.


    Most fields should be marked private. Any fields that are not private can be accessed
    by other classes. As a program is being developed, or later updated, other classes
    may depend on these non-private variables, and this (possible) dependency makes
    it difficult or impossible to update or modify the class without the danger of
    breaking code somewhere. Instead, all access to fields should be under the control
    of the methods in the class. This is how it is done in the Java-supplied classes,
    and how you should do it.


