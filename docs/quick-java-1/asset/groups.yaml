    operations unique to HashSet. If at some later point another implementation is
    desired, such as TreeSet, then the implementation may be changed without any harm
    to the code that uses the items variable.


    Stack, Vector, and PriorityQueue also implement the Collection interface, but
    they are classes, so objects of these types may be created directly.


    Here is a very brief summary of some of the Collection types, along with a typical
    implementing class.


    +   * Set, HashSet — a collection of values with no duplicates, in no particular
    order.

    * List, ArrayList — an ordered sequence of values, possibly with duplications.

    * Map, HashMap — a mapping of keys to values.

    * Stack — a last in, last out data structure.

    * Queue, LinkedList — a first in, last out data structure.

    * PriorityQueue — a “least” (highest priority) value out first.

    * Deque, ArrayDeque — values may be inserted and deleted at the end.

    * Vector — a resizable, array-based sequence of values.'
