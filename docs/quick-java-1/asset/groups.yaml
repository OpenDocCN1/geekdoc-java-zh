    # The “Outer Language” of Java 91


    If an inherited method is not exactly what is desired, it can be overridden (replaced)
    by a different method with the same name and number and types of parameters. To
    do this,


    +   1. Write the annotation @Override directly before the method.


    +   - An annotation is an instruction to the compiler. The @ Override annotation
    asks the compiler to check that the name and parameter list match with those of
    an inherited method because, if they don’t, you are simply defining another method,
    not overriding one.


    +   2. Write a method with the same name, same number of parameters, and same
    types of parameters (in the same order) as the method you wish to override.


    +   - The parameter names don’t have to be the same, and the overriding method
    may even have a different return type.


    +   3. Make sure the new method is at least as public as the method it overrides.
    (The sequence is private, “package,” protected, and public.) If the inherited
    method is public, any method that overrides it must also be public.


    It is a good idea, when defining your own objects, to override three of the methods
    inherited from Object:


    +   - toString() returns a String representation of this object.


    +   - equals(obj) tests if this object is equal to object obj.


    +   - hashCode() returns an int hash code for this object.


    The inherited versions of these methods are fairly useless; they exist so that
    they can be overridden. By defining them in Object, Java can be sure that every
    object has some version of these methods.


    If your class overrides an inherited method, that inherited method is still available
    to you: just prefix the method call with super. That is,


