    \ e) {\n    System.out.println(\n    \"Released: \" + e.getKeyCode());\n}\npanel.setFocusable(true);\n\
    panel.addKeyListener(listener);\n```\n\n注意事项：\n\n- 当输入一个字符时，事件处理器 keyPressed、keyTyped\
    \ 和 keyReleased 会按顺序被调用。当输入其他键（shift、option、上方向键等）时，只有 keyPressed 和 keyReleased\
    \ 会被调用。\n\n- 所有三个方法都可以使用 getKeyCode()，它返回一个 int 类型的值。\n\n# 如何构建 GUI 程序 ■ 185\n\
    \n- 仅 `keyTyped` 方法可以使用 `getKeyChar` 方法来返回字符。\n\n- Container 必须拥有“焦点”（focus）才能响应事件。通常，这通过点击它或使用\
    \ Tab 键切换到它来实现。\n\n- 要确定按了哪个键，你可以将键码与 `KeyEvent` 类中的大量常量之一进行比较，例如 VK_A、VK_SHIFT\
    \ 或 VK_DOWN。非英语键盘的布局不同，但 VK（虚拟键盘）值独立于键盘布局。\n\n# 9.8.17 鼠标输入\n\n所有通用的小部件（widgets）都会自动处理鼠标事件。然而，如果你想执行一些特殊操作，例如指向图像的特定部分，你可以编写自己的鼠标监听器。针对点击、移动和滚动有单独的监听器。\n\
    \nMouseListener 接口指定了五个公共 void 方法：mouseEntered、mouseExited、mousePressed、mouseReleased\
    \ 和 mouseClicked。这些每一个方法都接收一个 MouseEvent 参数（见下文）。这些方法中你可能唯一感兴趣的是 mouseClicked，但由于\
    \ MouseListener 是一个接口，所以你必须提供所有方法，即使它们什么都不做。\n\nMouseListener 接口还指定了两个公共 void\
    \ 方法：mouseMoved 和 mouseDragged，两者都带有一个 MouseEvent 参数。\n\nMouseEvent 对象具有以下方法（其他限于此）：\n\
    \n- getButton() 返回 MouseEvent.BUTTON1、MouseEvent.BUTTON2 或 MouseEvent.BUTTON3\
    \ 之一的值。\n\n- getX() 和 getY() 返回相对于挂载了监听器的组件的左上角的鼠标位置，以像素为单位。当鼠标指针向右移动时，X 值增加，当鼠标指针向下移动时，Y\
    \ 值增加。\n\n# 186 快速 Java\n\n- getXOnScreen() 和 getYOnScreen() 返回相对于显示器左上角的鼠标位置。\n\
    - getClickCount() 返回紧密鼠标点击的次数。\n\nMouseAdapter 类提供了上述所有方法的空实现，因此你可以扩展此类并重写任何你感兴趣使用的方法。参见第\
    \ 9.8.10 节关于 JLabel 小部件的章节，以获取使用 MouseAdapter 的示例。\n\n还有一个 MouseWheelListener\
    \ 接口。它需要一个带有 MouseWheelEvent 参数的 mouseWheelMoved 方法。由于 JScrollPane 总是更方便，这里没有涵盖该接口。\n\
    \n# 9.9 骰子掷\n\n这是一个完整的（但非常小的）Swing 应用程序：\n\n```java\nimport javax.swing.*;\nimport\
    \ javax.swing.event.*;\nimport java.awt.*;\nimport java.util.Random;\n\npublic\
    \ class DiceRoller extends JFrame {\n    static Random rand = new Random();\n\
    \    JButton rollButton;\n    JTextField result;\n\n    public static void main(String[]\
    \ args) {\n        SwingUtilities.invokeLater(new Runnable() {\n            public\
    \ void run() {\n                new DiceRoller().createShowGUI();\n          \
    \  }\n        });\n    }\n\nvoid createShowGUI() {\n    setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    rollButton = new JButton(\"Roll 'em!\");\ngetContentPane().add(rollButton, BorderLayout.NORTH);\n\
    result = new JTextField(\"You haven't rolled yet.\");\ngetContentPane().add(result,\
    \ BorderLayout.SOUTH);\npack();\nsetVisible(true);\nrollButton.addActionListener(event\
    \ -> {\n    int number = rand.nextInt(6) + 1;\n    result.setText(\"You rolled\
    \ a \" + number);\n});\n\n}\n}\n```\n\n![](img/fb8b9ea4edf0c31c9f97e5eb4d89a6be_208_0.png)\n\
    \n# 线程与动画\n\n已经以不同详细程度描述过的有用类有 StringBuilder、Scanner、Stack 和 HashMap。本节描述了对编写并发程序重要的一些额外类和方法。\n\
    \n10.1 线程\n\n线程是控制流。现代操作系统是多进程处理的：它们同时执行很多事情。线程和其他任何对象没有区别；你可以创建并操作它们。\n\n线程是一个表示控制流的对象。创建和启动\
    \ Thread 有两种方式：\n\n- 写一个扩展 Thread 的类并重写 run() 方法。\n- 创建该类的实例并发送 start() 。\n- 写一个实现\
    \ Runnable 的类并重写 run() 方法。\n- 创建该类的实例并发送 start() 。\n\n线程可以处于四种状态之一（见图 10.1）：\n\
    \n- Ready（就绪）：已就绪\n- Running（运行）：正在执行某些操作\n- Waiting（等待或阻塞）：需要某些资源\n- Dead（死亡）：永远不再执行\n\
    \n![](img/fb8b9ea4edf0c31c9f97e5eb4d89a6be_210_0.png)\n图 10.1 线程的状态\n\n执行由由调度器控制，但你可以请求它执行某些操作。调用\
    \ sleep() 就是其中一种请求。另一种是请求当前线程暂停指定的毫秒。\n\nThread.sleep(milliseconds);\n\n此调用可能会抛出\
    \ InterruptedException。\n\n```java\ntry {Thread.sleep(1000);}\ncatch (InterruptedException\
    \ e) { }\n```\n\n# 190 快速 Java\n\n警告：Java 初期版本允许一个线程通过 stop、suspend 和 resume 方法控制其他线程。这被认为是一个糟糕的想法，这些方法立即被废弃了。千万不要使用它们！\n\
    \n使用废弃方法的简单替代方案是由一个线程设置一个标记，另一个线程读取该标记。\n\n```java\nboolean okToRun = true;\n\
    secondThread.start();\n```\n\n```java\npublic void run() {\n    while (firstThread.okToRun)\
    \ {...}\n}\n```\n\n# 10.2 同步\n\n在许多情况下，让许多进程（线程）并行运行是非常必要的。例如，在执行数据库访问或文件传输时，可以进行其他工作。\n\
    \n当值被一个线程访问而被另一个线程更改，或者两个线程尝试更新同一个值时，可能会产生微妙且不可还原的错误。为了避免这种情况，Java 引入了同步的概念，简单来说就是赋予一个线程对值或一组值的临时排他访问权限。\n\
    \n你可以对对象进行同步：\n\n```java\nsynchronized (obj) { code }\n```\n\n在这里，synchronized\
    \ 被用作语句。在代码完成之前，其他代码都不能对对象 obj 进行同步。\n\n- 注意 1：对你想要访问或修改的对象进行同步通常是合理的，但并非要求。任何对象都可以用于同步，代码可能会访问或修改完全无关的值。\n\
    \n"
