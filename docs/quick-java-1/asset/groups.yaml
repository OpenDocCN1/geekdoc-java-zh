    # How to Build a GUI Program ■ 165


    Swing is built on top of AWT and uses a number of AWT packages, including most
    of the layout managers, so you need to import java.awt.*


    Most listeners also come from the AWT, so you also need to import java.awt.event.*


    A few listeners, such as DocumentListener and ListSelectionListener, are specific
    to Swing, so if you use them you need to import javax.swing.event.*


    For more complex GUIs, there are additional java.awt.something and javax.swing.something
    packages that you may need to import.


    > Note: The x in javax originally stood for “experimental,” but once Swing came
    into widespread use, it was undesirable to rename the package.


