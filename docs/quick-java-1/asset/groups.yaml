    # 3.4.15 Objects, Generics, and Stacks


    The most general type of object is Object. If you declare an array of Object,
    you can put any kind of object into it—stacks, threads, whatever. Or you can be
    more specific, and declare an array of (for example) String, and the array can
    then hold only strings.


    Along arrays, Java has various types of Collections: Stacks, Lists, HashMaps,
    and so on. Originally, any type of object could be pushed onto a Collection, and
    there was no way to be more specific. When you got a value out of the collection,
    you got an Object, and had to cast it to the correct type. For backwards compatibility,
    this style is still allowed.


    For example, Java has a Stack type (in the java.util package), with operations
    push and pop (among others).


    ```

    Stack stuff = new Stack();

    stuff.push("abacadabra");

    stuff.push(new File("abc.txt"));

    File foo = (File)stuff.pop();

    String spell = (String)stuff.pop();

    ```


    In modern code, it is preferable to be specific about what type of values are
    put into a stack. This is done by using type parameters, or generics. The type
    parameter is put into angle brackets after the object type.'
