    # Quick Java


    A cast affects the one immediately following value: (int)2 * d casts only the
    2 to an int (which it already is). To cast an expression, put parentheses around
    it: (int)(2 * d).


    As another example, consider:


    ```

    char ch = (char)(''a'' + 1); // result is ''b''

    ```


    The cast is necessary because the result type of ''a'' + 1 is int.


    When casting to a narrower type, it is the programmer''s responsibility to ensure
    that the value will fit in that narrower type, or the results will be quite unexpected.
    For example, a byte can hold only values between -128 and 127, but the cast (byte)1000
    is legal and results in -24.


    A boolean is not a numeric type, and cannot be cast to or from any other type.


    # 3.2.7 Constants


    Putting the word final in front of a variable declaration makes it into a constant;
    its value cannot be changed. For example,


    ```

    final int DAYS_IN_A_WEEK = 7;

    ```


    Java provides some built-in constants, such as Math.PI and Math.E.


    Constants help avoid the use of “magic numbers”—numbers in code whose meaning
    may not be absolutely clear. If the code 29 to a variable, the question arises,
    why 29?


    However, it is silly to name a constant after its value, for example,


    ```

    final int TWELVE = 12;

    ```


    because this does nothing to improve the clarity of the code.'
