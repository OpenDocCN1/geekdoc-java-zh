    \ void testIllegalDeposit() {\n        account.deposit(-10000);\n        assertEquals(0,\
    \ account.getBalance());\n    }\n\n    @Test\n    public void testGoodWithdrawal()\
    \ throws Exception {\n        account.deposit(100);\n        account.withdraw(35);\n\
    \        assertEquals(65, account.getBalance());\n    }\n\n    @Test\n    @DisplayName(\"\
    Exception test, old style\")\n    public void badWithdrawal() {\n        try {\n\
    \            account.withdraw(35);\n            fail(\"Did not throw exception\"\
    );\n        }\n        catch (Exception e) {\n        }\n    }\n\n    @Test\n\
    \    @DisplayName(\"Exception test, new style\")\n    public void badWithdrawal2()\
    \ {\n        assertThrows(Exception.class,\n            () -> account.withdraw(35));\n\
    \    }\n}\n```\n\n理想情况下，`Account` 中的每个方法都应该单独进行测试。这并不总是可能的。在上面的代码中，在测试取款之前必须向账户中添加资金。\n\
    \n![](img/fb8b9ea4edf0c31c9f97e5eb4d89a6be_176_0.png)\n\n# GUI 与对话框 (GUIs and\
    \ Dialogs)\n\n图形用户界面，或 GUI（读作“gooey”）提供了除了简单的文本输入和打印之外的用户交互。GUI 提供了熟悉的按钮、文本字段、菜单项等，这些是几乎所有面向用户的程序的共同特征。\n\
    \n## 8.1 简史\n\nGUI 从第一个 Java 实现起就已经可用。最初的 GUI 工具包是 AWT，即抽象窗口工具包（Abstract Window\
    \ Toolkit），它是特定平台的且非常原始。\n\n后来是 Swing，这是一个好得多的平台无关工具包。它是构建在 AWT “之上”的。\n\n第三种工具包\
    \ JavaFX 于 2008 年发布。它的初衷是替换 Swing。它在 Java 版本中仍然可用。\n\n## 8.2 对话框 (DIALOGS)\n\n\
    对话框是用于从用户处获取响应的。对话框可以是模态的或非模态的。本节展示了如何创建不同的对话框。\n\n有四种类型的对话框：\n\n- 消息框 (Message)\n\
    - 确认框 (Confirm)\n- 输入框 (Input)\n- 选项框 (Option)\n\n### 8.2.1 消息框 (Message)\n\n\
    消息对话框带有“确定”按钮。它是模态的。显示消息对话框需要：\n\n```\nJOptionPane.showMessageDialog(parent, \"\
    这是一条消息\");\n```\n\n### 8.2.2 确认框 (Confirm)\n\n确认对话框带有“是”和“否”按钮。它是模态的。显示确认对话框需要：\n\
    \n```\nint yesNo = JOptionPane.showConfirmDialog(parent, \"你真的要这样做吗？\");\nif (yesNo\
    \ == JOptionPane.YES_OPTION) {\n    System.out.println(\"已确认\");\n}\n```\n\n###\
    \ 8.2.3 输入框 (Input)\n\n输入对话框是模态的，允许用户输入单行文本。显示输入对话框需要：\n\n```\nString userName\
    \ = JOptionPane.showInputDialog(parent, \"你的名字是什么？\");\n```\n\n### 8.2.4 选项框 (Option)\n\
    \n选项对话框是模态的，返回返回数组中的索引。显示选项对话框需要：\n\n```java\nObject[] options = {\"Java\", \"\
    Python\"};\nint option = JOptionPane.showOptionDialog(parent, \"选择一个语言\", \"选择\"\
    , JOptionPane.DEFAULT_OPTION, JOptionPane.INFORMATION_MESSAGE, null, options,\
    \ options[0]);\n```\n\n### 8.2.5 颜色选择器 (Color Chooser)\n\n允许用户选择一种颜色。显示颜色选择器（ColorChooser）需要：\n\
    \n```java\nColor chosenColor = JOptionPane.showColorDialog(parent, \"选择一种颜色\"\
    , Color.WHITE);\n```\n\n### 8.2.6 加载文件框 (Load File)\n\n文件选择框用于导航到特定文件。显示文件选择框需要：\n\
    \n```\nJFileChooser chooser = new JFileChooser();\nchooser.setDialogTitle(\"加载哪个文件？\"\
    );\n```\n\n获取所选文件的读取器：\n\n```\nBufferedReader br = null;\nint result = chooser.showOpenDialog(parent);\n\
    if (result == JFileChooser.APPROVE_OPTION) {\n    File file = chooser.getSelectedFile();\n\
    \    try {\n        if (file != null) {\n            String fileName = file.getCanonicalPath();\n\
    \            FileReader fr = new FileReader(fileName);\n            br = new BufferedReader(fr);\n\
    \        }\n    } catch (IOException e) { }\n}\n```\n\n### 8.2.7 保存文件框 (Save File)\n\
    \n写入文本文件的代码与读取文件的代码相似。你需要使用保存对话框而不是打开对话框，并使用 `PrintWriter` 代替 `FileReader`。显示保存文件对话框需要：\n\
    \n```\nJFileChooser chooser = new JFileChooser();\nchooser.setDialogTitle(\"另存为文件?\"\
    );\n```\n\n"
