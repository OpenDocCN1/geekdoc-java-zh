    \ static void main(String[] args) {\n```\n\nIf you are not using an IDE, any plain\
    \ text editor (not a word processor) may be used to create a program. Each class\
    \ should be on a separate file, and the name of the file should be the name of\
    \ the class with .java extension.\n\nIf you are using Java 11 or later, you can\
    \ run a program by navigating to the folder containing the Java file and opening\
    \ a command/terminal window. In that window, enter java fileName. The file should\
    \ run and produce output.\n\nIf the above does not work, you may need to first\
    \ compile the file and then run it. To do this, execute the pair of commands:\n\
    \n```\njavac ClassName.java\njava ClassName.class\n```\n\nIf a program consists\
    \ of multiple files, any file that is used by another file must be compiled before\
    \ the file that uses it can be compiled.\n\n# 1.8 HELLO WORLD\n\nTo begin programming\
    \ as quickly as possible, you can use the following “Hello World” program as a\
    \ framework. You don't need to understand completely in order to get started.\n\
    \n```\npublic class MyClass {\n  String hello = \"Hello World\";\n  public static\
