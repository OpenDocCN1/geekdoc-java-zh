    # A Lightning Tour of Java


    HIS BOOK IS DESIGNED TO GET the experienced programmer in some other language
    to start programming in Java as quickly as possible. Consequently, this first
    chapter is very condensed and takes a great deal for granted; you do not have
    to understand or remember everything in the first reading. Later chapters will
    cover the same material more slowly and in greater detail.


    Note: Java is verbose, and code lines are often 80 to 100 characters-long. Such
    lines have been split into more but shorter lines in an attempt to improve readability.


    # 1.1 PROJECTS


    A program, or project, consists of one or more packages. A package is a directory
    or folder that contains Java files.


    Java files contain classes, usually one class per file. A class describes a new
    type of object, and bundles together the object''s fields (its data) and its methods.
    A class has one or more constructors to create new objects of that type.'
