    # 136 ■ Quick Java


    # 5.3.8 Serialization


    A serializable object is one that can be converted to a sequence of bytes, usually
    so that it can be written to a file. To read it again, it has to be deserialized.
    This allows objects to be stored on a file for future use.


    In order for an object to be serializable,


    +   It must implement the java.io. Serializable interface. This is a marker interface—one
    that doesn''t list any methods, so none have to be defined in order to implement
    it.


    +   Every field of the object must be either serializable or transient (see below).


    +   Strings, arrays, and “wrapped” primitives are all serializable, as there are
    many Java-supplied objects such as HashMap. Check the Java documentation if you
    are unsure.


    +   A field of the object is considered serializable if it is an object that has
    an no-argument constructor to initialize its fields when it is deserialized.


    +   To keep a field from being serialized, mark it as transient. This is useful
    to keep sensitive information from being stored or sent across a network. It is
    also used for fields whose value is derived from other fields. Upon deserialization,
    transient fields are given a default value.


    The basic approach to writing out an object.


    ```

    FileOutputStream file = new FileOutputStream(pathToFile);

    ObjectOutputStream stream = new ObjectOutputStream(file);

    stream.writeObject(object);

    ```


    To read a serialized object, the exact same classes used by the object must be
    present. Here’s the basic approach to reading in an object.


    ```

    FileInputStream file = new FileInputStream(pathToFile);

    ObjectInputStream stream = new ObjectInputStream(file);

    object = (type) stream.readObject();

    ```'
