    \ refactoring the code to remove it almost always results in a simpler and more\
    \ understandable program.\n\n# 3.3.1.13 Return Statements\n\nWhen a method is\
    \ defined, it must specify the type of the value to be returned. If no value is\
    \ to be returned, the keyword void must be used in place of a type name, and the\
    \ use of a return statement is optional.\nExamples:\n\n```\nint add(int a, int\
    \ b) {\n  return a + b;\n}\nvoid print(int x) {\n  System.out.println(x);\n  return;\
    \ // superfluous\n}\n```\n\nThe syntax of the return statement is either simply\n\
    \nreturn;\n\nfor a void method, or\n\nreturn expression;\n\nfor a method that\
    \ returns a value. The type of the expression must be the same as, or narrower\
    \ than, the type that the method is supposed to return.\n\nFor example, if a method\
    \ is supposed to return a double value, the return statement may use an int expression;\
    \ the result will be converted to a double as the method returns.\n\n# 3.3.1.14\
    \ Empty Statements\n\nAlthough of limited use, Java does allow the use of \"empty\"\
    \ statement, consisting of a semicolon by itself. The following statements are\
    \ equivalent:\n\n```\nfor (n = 1; n < 1000; n = 2 * n) {}\n```"
  - '[PAGE 67]


    # The “Inner Language” of Java ■ 47


    and


    ```

    for (n = 1; n < 1000; n = 2 * n);

    ```


    Either statement results in n being set to 1024.


    # 3.3.2 Statements Not in C++


    The following statements are either not in C++ at all, or they are sufficiently
    to warrant additional explanation.


    # 3.3.2.1 Assert Statements


    The assert statement is unusual in that it usually “doesn’t do anything.” Rather,
    it is a form of executable documentation: you are asserting that something is
    true. There are two forms:


    ```

    assert booleanExpression;

    assert booleanExpression : expression;

    ```


    Execution is as follows. The booleanExpression is evaluated, and if true, control
    just passes to the next statement. But if it is false, an AssertionError is thrown.
    If the second form is used, the value of the expression (which may be any type)
    is included in the error message.


    By default, assertions are treated like comments. To make assertions executable,
    use the VM flag -enableassertions or its abbreviation-.


    > Note: When running from a command line, VM (Virtual Machine) flags may be placed
    after the word java. When running from an IDE, flags will be a configuration option.


    The purpose of the assert statement is to state some condition that you believe
    will always be true at that point in the program. It should not be used to check
    for possible error conditions that you believe could happen; for that, you should
    throw an exception (see section 3.3.2.6).


    It is a good idea to get into the habit of putting in assert statements, as appropriate,
    when you write the code.'
  - "[PAGE 68]\n\n# 48 Quick Java\n\nThere is little point in using the second form\
    \ (with *expression*) unless you have something to add. For example, if you believe\
    \ that some array index i is always within the array bounds, you might say\n\n\
    ```\nassert i >= 0 && i < myArray.length:\n  \"Bad array index.\" + i;\n```\n\n\
    Finally, the idiom assert false; can be used to indicate that you believe that\
    \ a certain section of code (for example, the default case of a switch statement)\
    \ can never be reached. However, it is a syntax error to put this (or any other)\
    \ statement in a location that the Java compiler cannot know be reached, such\
    \ as immediately following a return statement.\n\n# 3.3.2.2 Print \"Statements\"\
    \n\nThere are two “statements” that can print a message to the user. They are\n\
    \n```\nSystem.out.println(value);\n```\n\nand\n\n```\nSystem.out.print(value);\n\
    ```\n\nThe difference is that print just a string representation of the value,\
    \ while println prints that string followed by a newline character. That is, the\
    \ next thing printed after a print will be on the same line, but the next thing\
    \ printed after a println will be on a new line.\n\nAlthough print and println\
    \ are used as if they were statements, they are actually methods that have the\
    \ *side effect* of displaying something on your screen. (Method calls that do\
    \ not have side effects can also be used as statements, but this is usually pointless,\
    \ since the return value is ignored.)\n\nIf the value is an object type, print\
    \ and println will call its toString() method to get a printable representation\
    \ of the object. This gives you considerable control over how your objects are\
    \ printed (see section 4.4.1)."
- md: "\n# The “Inner Language” of Java ■ 49\n\nIt is often convenient to construct\
    \ a string (using \"+”) to join the parts) directly in the parameter list of a\
    \ class to call or print println. Anything “added” to a string will be converted\
    \ to a string.\n\n```java\nSystem.out.println(\"The sum is \" + sum);\n```\n\n\
    **Technical note:** System is the name of a class in the java.lang package, and\
    \ out is an object of type PrintStream in the System class. The PrintStream has\
    \ several methods, including print and println. You don't need to know this in\
    \ order to use the methods.\n\nPrinting to the screen is easy, but getting input\
    \ from the keyboard requires the use of a Scanner object, covered in section 3.4.1.3.\n\
    \n## 3.3.2.3 Switch Statements and Expressions\n\nJava 14 introduced a significantly\
    \ improved version of the switch statement. (The old version is still available.)\
    \ The new version can be used either as a statement or as an *expression* that\
    \ returns a value. The syntax is:\n\n```java\nswitch (expression) {\n    case\
    \ constants₁ -> action₁,\n    case constants₂ -> action₂,\n    ...\n    case constantsₙ\
    \ -> actionₙ\n    default -> actiondef\n}\n```\n\nThe **expression** must result\
    \ in an integer, String, or Enum value.\n\nThe **constants** are comma-separated\
    \ lists of one or more values of the same type as **expression**. Constants may\
    \ not be duplicated.\n\nThe switch, whether used as a statement or as an expression,\
    \ evaluates the *expression*, chooses a whose *constant* is equal to that of *expression*,\
    \ and executes the one *action* associated with that constant. If no constant\
    \ matches, the default action is executed.\n\n## 50 ■ Quick Java\n\nNote: Unlike\
    \ the “classic” switch statement, there is no “fall through” to the next action.\n\
    \nWhen switch is used as a statement, each action is a single statement, possibly\
    \ a compound statement. The default case is optional; if no statement is matched\
    \ and there is no default case, the statement does nothing.\n\nWhen switch is\
    \ used as an expression, each action may be:\n\n- An expression of the correct\
    \ type to be used as the value of the switch.\n- A compound statement, containing\
    \ a statement of the form yield expression. The yield acts rather like a return\
    \ statement in a method; it causes the switch to exit with the expression as its\
    \ value.\n- A throw statement.\n\nWhen switch is used as an expression, it must\
    \ either return a value or throw an exception. In practical terms, this means\
    \ that either the default case is required, or the constants include every possible\
    \ value of an Enum.\n\nThe following nonsensical example illustrates the use of\
    \ switch as an expression.\n\n```java\nlong nonsense = switch (i) {\n  case 1\
    \ -> 1000000000000L;\n  case 2 -> 17 * x;\n  case 3, 4 -> 'a';\n  case 5 -> {\n\
    \    System.out.println(\"Five!\");\n    yield 55;\n  }\n  case 6 -> throw new\
    \ RuntimeException();\n  default -> -1;\n}\nSystem.out.println(nonsense);\n```\n\
    \n## 3.3.2.4 Pattern Matching in switch Statements\n\nAs mentioned in the previous\
    \ section, Java 14 introduced a new form of the switch statement, as well as a\
    \ switch expression, using arrows (->) instead of colons (:). Java 17 greatly\
    \ expands what switch statements and expressions can do, using pattern matching.\n\
    \n**Warning:** Pattern matching is a preview feature of Java 17. This means (1)\
    \ may change or disappear in future versions of Java, and (2) you may have to\
    \ set the enable-preview flag in order to use it.\n\nDespite the name, pattern\
    \ matching has nothing to do with regular expressions. Instead, the switching\
    \ is done on the type of an expression, and the result of the expression is assigned\
    \ to a new variable.\n\n```java\nswitch (expression) {\n    case Type1 variable1\
    \ -> action1\n    case Type2 variable2 -> action2\n    ...\n    case TypeN variableN\
    \ -> actionN\n    default -> actiondef\n}\n```\n\nThe value of the expression\
    \ must be a supertype of the case Types. When a matching Type is found, the value\
    \ of the expression is assigned to the corresponding variable, and the action\
    \ (expression or statement) is executed.\n\nUnlike earlier versions of the switch\
    \ statement, any object type may be used as a case type, including null. Primitives,\
    \ however, cannot be used.\n\nA guarded pattern allows us to perform an additional\
    \ test on the value, after its type has been selected. This has the form:\n\n\
    ```\nType variable && guard -> action\n```\n\nwhere the guard is a boolean expression\
    \ using the value of the variable. If the boolean expression is complicated, it\
    \ should be enclosed in parentheses.\n\nHere's an example, using a switch expression.\n\
    \n```java\nString s = switch (shape) {\n    case Rectangle r && r.width == r.height\
    \ ->\n      'It's a square';\n    case Rectangle r ->\n      'It's a rectangle';\n\
    \    case Triangle t ->\n      'It's a ' + t.width + 'by' +\n      t.height +\
    \ 'triangle.';\n    default -> 'It's a shape.';\n}\nSystem.out.println(s);\n```\n\
    \n## 3.3.2.5 Try-catch-finally\n\nCode that can throw a checked exception must\
    \ be in a try-catch-finally statement. Syntax is as follows:\n\n```java\ntry {\n\
    \    code that might throw an exception\n} catch (SomeExceptionType variable)\
    \ {\n    code to handle this\n} catch (SomeOtherExceptionType variable) {\n  \
    \  code to handle other\n} finally {\n    code that is always done\n}\n```\n\n\
    The default case is optional; if no statement is matched and there is no default\
    \ case, the statement does nothing. First, the try block is executed. If it completes\
    \ normally (without an exception), the catch blocks are skipped. But if an exception\
    \ or error occurs while executing the try block, execution goes immediately to\
    \ the first catch block that can handle it. There may be as many catch blocks\
    \ as needed; the finally block is usually optional. But the finally block is always\
    \ done before leaving.\n\n## 3.3.3 Reading from a File\n\nThe basic approach to\
    \ reading or writing to a text file is (1) open the file, (2) use the file, and\
    \ (3) close the file. Each of these steps raise an exception which must be handled.\n\
    \nThe FileReader class has methods that will read characters and return them as\
    \ integers. This is inconvenient, so the usual way to read files is to wrap a\
    \ BufferedReader around a FileReader object.\n\nA BufferedReader has the following\
    \ methods (among others):\n\n- readLine() reads and returns one line (as a String),\
    \ or null if the end of the file has been reached.\n\n## 3.3.2.6 Throw Statements\n\
    \nWhen Java detects that an error has occurred, it creates an object and throws\
    \ it. Your code can deliberately throw exceptions.\n\n> **Note:** This differs\
    \ from C++ in that, in Java, only Throwable types (Exceptions and Errors) can\
    \ be thrown.\n\nIn this section we consider one simple example. Suppose that if\
    \ variable is negative, it means something has gone wrong. You might write:\n\n\
    ```java\nif (b < 0) {\n  throw new Exception(\"b is negative\");\n}\n```\n\nSome\
    \ exception types are *checked*. If you execute that code could possibly throw\
    \ a checked exception, Java insists that you do something about it; it is a syntax\
    \ error if you don’t. One thing you can do is to put the offending code in the\
    \ try part.\n\nAlternatively, you can say that your method (possibly) throws the\
    \ exception. Then whatever called your code has to deal with; it’s no longer your\
    \ responsibility.\n\n```java\nint myMethod(int a, int b) throws Exception {\n\
    \    if (b < 0) {\n        throw new Exception(\"b is negative\");\n    }\n  \
    \  // other stuff\n}\n```\n"
  mdcn: "\n\n# Java 的“内部语言” ■ 49\n\n在类的参数列表中直接构造字符串（使用“+”）来连接各个部分，以调用或打印 `println`，这通常非常方便。任何“添加”到字符串上的内容都会被转换为字符串。\n\
    \n```java\nSystem.out.println(\"The sum is \" + sum);\n```\n\n**技术说明：** System\
    \ 是 java.lang 包中的一个类名，而 out 是 System 类中类型为 PrintStream 的对象。PrintStream 有多个方法，包括\
    \ print 和 println。在使用这些方法时，你不需要了解这些。\n\n打印到屏幕很容易，但从键盘获取输入需要使用 `Scanner` 对象，该内容将在\
    \ 3.4.1.3 节中介绍。\n\n## 3.3.2.3 Switch 语句和表达式\n\nJava 14 引入了显著改进的 switch 语句。（旧版本仍然可用）。新版本既可以当作语句，也可以用作返回值的*表达式*。其语法如下：\n\
    \n```java\nswitch (expression) {\n    case constants₁ -> action₁,\n    case constants₂\
    \ -> action₂,\n    ...\n    case constantsₙ -> actionₙ\n    default -> actiondef\n\
    }\n```\n\n**expression** 必须产生整数、String 或枚举（Enum）值。\n\n**constants** 是与 **expression**\
    \ 类型相同的一个或多个值的逗号分隔的列表。常量不能重复。\n\nswitch 无论用作语句还是表达式，都会求值 *expression*，选择一个 *constant*\
    \ 等于 *expression* 的常量，并执行与该常量关联的唯一 *action*。如果没有匹配的常量，则执行默认 action。\n\n## 50 ■\
    \ Java 速览\n\n注意：与“经典”的 switch 语句不同，这里不会“贯穿（fall through）”到下一个 action。\n\n当 switch\
    \ 用作语句时，每个 action 都是单个语句，也可能是复合语句。default case 是可选的；如果没有匹配到语句且没有 default case，则该语句将不执行任何操作。\n\
    \n当 switch 用作表达式时，每个 action 可以是：\n\n- 类型正确的表达式，用作 switch 的值。\n- 一个复合语句，其中包含一个形式为\
    \ `yield expression` 的语句。`yield` 的作用类似于方法中的 return 语句；它会导致 switch 以该表达式的值值退出。\n\
    - 一个 throw 语句。\n\n当 switch 用作表达式时，它必须要么返回一个值，要么抛出一个异常。在实际操作中，这意味着要么需要 default\
    \ case，要么常量包含了枚举的所有可能值。\n\n下面这个无意义的示例说明了将 switch 作为表达式使用。\n\n```java\nlong nonsense\
    \ = switch (i) {\n  case 1 -> 1000000000000L;\n  case 2 -> 17 * x;\n  case 3,\
    \ 4 -> 'a';\n  case 5 -> {\n    System.out.println(\"Five!\");\n    yield 55;\n\
    \  }\n  case 6 -> throw new RuntimeException();\n  default -> -1;\n}\nSystem.out.println(nonsense);\n\
    ```\n\n## 3.3.2.4 switch 语句中的模式匹配\n\n如上一节所述，Java 14 引入了 switch 语句的新形式以及 switch\
    \ 表达式，它们使用箭头（->）代替冒号（:）。Java 17 使用模式匹配极大地扩展了 switch 语句和表达式的功能。\n\n**警告：** 模式匹配是\
    \ Java 17 的预览功能。这意味着 (1) 它在未来的 Java 版本中可能会变化或消失，并且 (2) 你可能需要设置 `enable-preview`\
    \ 标志才能使用它。\n\n尽管名字如此，但模式匹配与正则表达式无关。相反，类型切换是基于表达式的类型进行的，并且表达式的结果被赋值给新变量。\n\n```java\n\
    switch (expression) {\n    case Type1 variable1 -> action1\n    case Type2 variable2\
    \ -> action2\n    ...\n    case TypeN variableN -> actionN\n    default -> actiondef\n\
    }\n```\n\n表达式的值必须是 case Types 的超类型。当找到匹配的 Type 时，表达式的值被赋值给相应的变量，并执行 action（表达式或语句）。\n\
    \n与早期版本的 switch 语句不同，任何对象类型都可以作为 case 类型，包括 null。然而，基本类型（Primitives）不能使用。\n\n\
    守卫模式（guarded pattern）允许我们在选择类型后对值进行额外测试。其形式如下：\n\n```\nType variable && guard\
    \ -> action\n```\n\n其中 guard 是使用变量值的布尔表达式。如果布尔表达式复杂，应该用括号括起来。\n\n这是一个使用 switch\
    \ 表达式的示例。\n\n```java\nString s = switch (shape) {\n    case Rectangle r && r.width\
    \ == r.height ->\n      'It's a square';\n    case Rectangle r ->\n      'It's\
    \ a rectangle';\n    case Triangle t ->\n      'It's a ' + t.width + 'by' +\n\
    \      t.height + 'triangle.';\n    default -> 'It's a shape.';\n}\nSystem.out.println(s);\n\
    ```\n\n## 3.3.2.5 Try-catch-finally\n\n可能抛出检查异常（checked exception）的代码必须放在 try-catch-finally\
    \ 语句中。语法如下：\n\n```java\ntry {\n    可能会抛异常的代码\n} catch (SomeExceptionType variable)\
    \ {\n    处理此异常的代码\n} catch (SomeOtherExceptionType variable) {\n    处理\n} finally\
    \ {\n    始终执行的代码\n}\n```\n\ndefault case 是可选的；如果没有匹配到语句且没有 default case，则语句不执行操作。首先执行\
    \ try 块。如果正常完成（无异常），则跳过 catch 块。如果在执行 try 块时发生异常或错误，将立即跳转到第一个可以处理它的 catch 块。可以有多个\
    \ catch 块；finally 块通常是可选的。但在离开之前始终执行 finally 块。\n\n## 3.3.3 读取文件\n\n读取或写入文本文件的基本方法是\
    \ (1) 打开文件，(2) 使用文件，(3) 关闭文件。这些步骤每个都会产生必须处理的异常。\n\nFileReader 类有读取字符并以整数形式返回的方法。这很不方便，因此读取文件通常是在\
    \ FileReader 对象包装一个 BufferedReader。\n\nBufferedReader 具有以下方法（等）：\n\n- readLine()\
    \ 读取并返回一行（String 类型），如果到达文件末尾则返回 null。\n\n## 3.3.2.6 Throw 语句\n\n当 Java 检测到发生错误时，它会创建一个对象并抛出。你的代码可以故意抛出异常。\n\
    \n> **注意：** 这与 C++ 的区别在于，在 Java 中只有 Throwable 类型（Exception 和 Error）可以被抛出。\n\n\
    在本节中我们考虑一个简单的示例。假设如果变量为负，意味着发生了问题。你可能会写：\n\n```java\nif (b < 0) {\n  throw new\
    \ Exception(\"b is negative\");\n}\n```\n\n"
