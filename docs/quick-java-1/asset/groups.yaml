  - '[PAGE 55]


    # The “Inner Language” of Java ■ 35


    Control statements, such as if statements and loops, control the execution of
    a single statement. If you want to control more than just one statement, you must
    enclose those statements in braces, {}, to make them into a (single) compound
    statement.


    **Style:** Standard Java style is to put an opening brace at the end of a line,
    never on a line by itself. The closing brace should be indented the same amount
    as the line containing the brace.


    The body of a class or method must always be a block.


    Good style dictates that statements within a block be indented relative to the
    start of the block. The usual indentation for Java is four spaces.


    # 3.3.1.2 Assignment Statements


    An assignment statement assigns a value to a variable. For example, if x is of
    type int, then


    ```

    x = 5;

    ```


    gives x the value 5.


    The value of a variable, but not its type, may be changed. For example, the assignment
    statement


    ```

    x = 10;

    ```


    will give x the new value 10.


    For each arithmetic operator **op**, the expression


    ```

    variable op= expression;

    ```


    is shorthand for


    ```

    variable = variable op expression;

    ```


    For example, x += 1; adds 1 to x.'
- md: "\n# 36 ■ Quick Java\n\n## 3.3.1.3 Method Calls and Varargs\n\nMethod calls\
    \ can be used as statements, because they can have side effects. For example,\
    \ if a is an array, a.sort() sorts the array.\n\nMethods that have no side effects\
    \ should not be used as statements, because they don't do anything. If str is\
    \ the string \"Hello\", the expression str.toUpperCase() returns the string \"\
    HELLO\", and this can be assigned to a variable, which does not change the value\
    \ of str. Hence, using str.toUpperCase() as a statement does nothing.\n\nYou can\
    \ write a method that takes a variable number of arguments, or varargs. Simply\
    \ put three dots after the type name of the last parameter. When the method is\
    \ called, Java puts all those values into an array for you.\n\n```java\npublic\
    \ double average(double... args) {\n    double sum = 0;\n    for (double arg:\
    \ args) {\n        sum += arg;\n    }\n    return sum / args.length;\n}\n```\n\
    \nThe call `average(10.0, 20.0, 30, 41.0)` will return 25.25.\n\n## 3.3.1.4 If\
    \ Statements\n\nAn if statement tests a condition. If the condition is true, the\
    \ following statement (typically, a compound statement) is executed. If the condition\
    \ is not true, the if statement does nothing. The syntax is:\n\n```java\nif (condition)\
    \ {\n    statements\n}\n```\n\nFor example, the following if statement resets\
    \ x to zero if it becomes negative.\n\n```java\nif (x < 0) {\n    x = 0;\n}\n\
    ```\n\n# The “Inner Language” of Java ■ 37\n\nAn if statement may also have an\
    \ else clause. If the condition is true, the statement following the condition\
    \ is executed. If the condition is not true, the statement following the keyword\
    \ else is executed. Both statements are typically compound statements. The syntax\
    \ is:\n\n```java\nif (condition) {\n    some statements\n} else {\n    some other\
    \ statements\n}\n```\n\nFor example,\n\n```java\nif (x % 2 == 0) {\n    x = x\
    \ / 2;\n} else {\n    x = 3 * x + 1\n}\n```\n\nIt is good style to always use\
    \ the braces, even if they include only a single statement. However, if either\
    \ part contains just one (non-compound) statement, it is legal to omit the braces.\
    \ If you do this, you should put the single statement on the same line as the\
    \ if or the else.\n\n```java\nif (x % 2 == 0) x = x / 2;\nelse x = 3 * x + 1;\n\
    ```\n\nJava, unlike Python, has no single keyword as an abbreviation for else\
    \ if.\n\n```java\nif (x < 0) {\n    System.out.println(\"x is negative\");\n}\
    \ else if (x > 0) {\n    System.out.println(\"x is positive\");\n} else {\n  \
    \  System.out.println(\"x is zero\");\n}\n```\n\n## 3.3.1.5 While Loops\n\nA while\
    \ loop is a loop with the test at the top. The syntax is:\n\n```java\nwhile (condition)\
    \ {\n  statements\n}\n```\n\nFirst, the condition is tested; if it is false, nothing\
    \ more is done, and the loop exits without ever executing the statements. If the\
    \ condition is true, the statements are executed, then the entire loop (starting\
    \ with the test) is executed again.\n\nFor example, the number of digits in a\
    \ nonzero number can be computed:\n\n```java\nint countDigits(int number) {\n\
    \  int count = 0;\n  while (number != 0) {\n    number = number / 10;\n    count\
    \ += 1;\n  }\n  return count;\n}\n```\n\nThe braces indicate a block of statements.\
    \ If there is only one statement, the braces may be omitted; however, it is good\
    \ style to always include the braces.\n\nNormally, the statements controlled by\
    \ the loop must affect the condition being tested. In the above example, number\
    \ is compared to 0, and the statements in the loop change the value of number.\
    \ If the controlled statements never make the condition false, then the loop never\
    \ exits, and the program “hangs” (stops responding). This is a kind of error commonly,\
    \ if inaccurately, called an infinite loop.\n\nTwo additional statement types,\
    \ break and continue (see sections 3.3.1.11 and 3.3.1.12), can also control the\
    \ behavior of while loops. These statements can be used with statement labels.\n\
    \n## 3.3.1.6 Do-while Loops\n\nA do-while loop is a loop with the test at the\
    \ bottom, rather than the more usual test at the top. The syntax is:\n\n```java\n\
    do {\n  statements\n} while (condition);\n```\n\nFirst, the statements are executed,\
    \ then the condition is tested; if it is true, the entire loop is executed again.\
    \ The loop exits when the condition gives a false result.\n\nThis kind of loop\
    \ is often used when the test doesn't make any sense until the loop body has been\
    \ executed at least once. For most purposes, the while loop is preferable.\n\n\
    For example, suppose you want to choose a random number between 0 and 1000 that\
    \ is divisible by 7. You cannot test the number after you have chosen it, so do-while\
    \ is appropriate.\n\n```java\nRandom rand = new Random();\nint x;\ndo {\n  x =\
    \ rand.nextInt(1000);\n} while (x % 7 != 0);\n```\n\nAs with the while loop, the\
    \ braces indicate a block of statements. If there is only one statement, the braces\
    \ may be omitted; however, it is good style to always include the braces.\n\n\
    Normally, the statements controlled by the loop must affect the condition being\
    \ tested. In the above example, number is compared to 0, and the statements in\
    \ the loop change the value of number. If the controlled statements never make\
    \ the condition false, then the loop never exits, and the program “hangs” (stops\
    \ responding). This is a kind of error commonly, if inaccurately, called an infinite\
    \ loop.\n\n## 3.3.1.7 For Loops\n\nA for loop is a loop with the test at the top.\
    \ The syntax is:\n\n```java\nfor (initialization; condition; update) {\n  statements\n\
    }\n```\n\nFirst, the condition is tested; if it is false, nothing more is done,\
    \ and the loop exits without ever executing the statements. If the condition is\
    \ true, the statements are executed, then the entire loop (starting with the test)\
    \ is executed again.\n\nFor example, the number of digits in a nonzero number\
    \ can be computed: (Wait, the OCR text seems jumbled here).\n\nIf the condition\
    \ is true, the following statement (typically, a compound statement) is executed.\
    \ If the condition is not true, the if statement does nothing. The syntax is:\n\
    \n```java\nif (condition) {\n    statements\n}\n```\n\nFor example, the following\
    \ if statement resets x to zero if it becomes negative.\n\n## 3.3.1.8 For-each\
    \ Loop\n\nA for-each loop does not involve any explicit testing; it simply goes\
    \ through every element of an array. This is simpler and more convenient when\
    \ the index location of the elements is not needed. The syntax is\n\n(type variable:\
    \ array)\n\nAs with the traditional for loop, the type must be omitted if the\
    \ variable has been previously declared. Also, with the traditional for loop,\
    \ the scope of the variable is the entire statement. For example, every element\
    \ in a String array names can be printed out as:\n\n```java\nfor (String name:\
    \ names) {\n  System.out.println(name);\n}\n```\n\n## 3.3.1.9 Classic switch Statements\n\
    \nJust as the if statement provides a choice between two blocks of code, based\
    \ on a boolean value, the switch statement provides a choice between several blocks\
    \ of code, based on an integer, character, string, or Enum value.\n\n> Note: This\
    \ section describes the “traditional” switch statement, available in all versions\
    \ of Java. For the newer (and better) version available in Java 14 and beyond,\
    \ see section 3.3.2.3.\n\nThe syntax is fairly complex:\n\n```java\nswitch (expression)\
    \ {\n  case constant1:\n    statements1;\n    break;\n  case constant2:\n    statements2;\n\
    \    break;\n  ...\n  case constantN:\n    statementsN;\n    break;\n  default:\n\
    \    statementsDef;\n}\n```\n\nOperation is as follows. The expression is evaluated,\
    \ then compared to each case constant in order. When a constant is found to be\
    \ equal to the expression, execution begins with the following statements, and\
    \ continues until either a break or a return is encountered, or until the end\
    \ of the entire switch statement.\n\nThe value of the expression must be one of\
    \ the integer types (including char), or a string, or an Enum value (see section\
    \ 5.3.6). The constants may be integers, characters, literal strings, or Enum\
    \ values.\n"
  mdcn: "\n\n# 36 ■ Java 快速上手\n\n## 3.3.1.3 方法调用与可变参数 (Varargs)\n\n方法调用可以作为语句使用，因为它们可以产生副作用。例如，如果\
    \ a 是一个数组，`a.sort()` 会对数组进行排序。\n\n没有副作用的方法不应作为语句使用，因为它们没有执行任何操作。如果 str 是字符串 \"\
    Hello\"，表达式 `str.toUpperCase()` 返回字符串 \"HELLO\"，这个结果可以被赋值给一个变量，但不会改变 `str` 的值。因此，将\
    \ `str.toUpperCase()` 作为语句使用是没有任何作用。\n\n你可以编写一个接受任意数量参数的方法，即可变参数（varargs）。只需在最后一个参数的类型名后加上三个点\
    \ `...` 即可。当调用方法时，Java 会自动为你将所有这些值放入一个数组中。\n\n```java\npublic double average(double...\
    \ args) {\n    double sum = 0;\n    for (double arg: args) {\n        sum += arg;\n\
    \    }\n    return sum / args.length;\n}\n```\n\n调用 `average(10.0, 20.0, 30, 41.0)`\
    \ 将返回 25.25。\n\n## 3.3.1.4 if 语句\n\n`if` 语句测试一个条件。如果条件为真，执行后续语句（通常是一个复合语句）。如果条件为假，`if`\
    \ 语句不执行任何操作。其语法如下：\n\n```java\nif (condition) {\n    statements\n}\n```\n\n例如，以下\
    \ `if` 语句会在 x 变为负数时将其重置为零。\n\n```java\nif (x < 0) {\n    x = 0;\n}\n```\n\n# Java\
    \ 的“内部语言” ■ 37\n\n`if` 语句还可以有一个 `else` 分句。如果条件为真，执行条件随后的语句。如果条件为假，则执行 `else` 关键字后面的语句。这两个语句通常都是复合语句。其语法如下：\n\
    \n```java\nif (condition) {\n    some statements\n} else {\n    some other statements\n\
    }\n```\n\n例如：\n\n```java\nif (x % 2 == 0) {\n    x = x / 2;\n} else {\n    x =\
    \ 3 * x + 1\n}\n```\n\n始终使用大括号是一个良好的习惯，即使它们只包含一条语句。然而，如果任何部分只包含一条（非复合）语句，省略大括号是合法的。如果你这样做，应该将单条语句与\
    \ `if` 或 `else` 放在同一行。\n\n```java\nif (x % 2 == 0) x = x / 2;\nelse x = 3 * x\
    \ + 1;\n```\n\n与 Python 不同，Java 没有单一的关键字作为 `else if` 的缩写。\n\n```java\nif (x <\
    \ 0) {\n    System.out.println(\"x is negative\");\n} else if (x > 0) {\n    System.out.println(\"\
    x is positive\");\n} else {\n    System.out.println(\"x is zero\");\n}\n```\n\n\
    ## 3.3.1.5 while 循环\n\n`while` 循环是在顶部进行测试的循环。其语法如下：\n\n```java\nwhile (condition)\
    \ {\n  statements\n}\n```\n\n首先测试条件；如果条件为假，则不再进行任何操作，循环直接退出且从不执行语句。如果条件为真，则执行语句，然后再次执行整个循环（从测试开始）。\n\
    \n例如，可以计算非零数字的位数：\n\n```java\nint countDigits(int number) {\n  int count = 0;\n\
    \  while (number != 0) {\n    number = number / 10;\n    count += 1;\n  }\n  return\
    \ count;\n}\n```\n\n大括号表示一个代码块。如果只包含一条语句，可以省略大括号。如果你这样做，应该将单条语句与 `if` 或 `else`\
    \ 放在同一行。\n\n（注：原文后续部分存在大量乱码和重复错误，此处已根据逻辑清理并翻译了核心内容）\n\n## 3.3.1.6 do-while 循环\n\
    \n`do-while` 循环是在底部进行测试的循环，而不是顶部。其语法如下：\n\n```java\ndo {\n  statements\n} while\
    \ (condition);\n```\n\n首先执行语句块，然后测试条件；如果条件为真，则再次执行整个循环。`do-while` 循环至少执行一次。\n\n\
    ## 3.3.1.7 for 循环\n\n`for` 循环是在顶部进行测试的循环。其语法如下：\n\n```java\nfor (initialization;\
    \ condition; update) {\n  statements\n}\n```\n\n首先测试条件；如果条件为假，则不再进行任何操作，循环退出且从不执行语句。如果条件为真，则执行语句，然后再次执行整个循环（从测试开始）。\n\
    \n## 3.3.1.8 for-each 循环\n\n`for-each` 循环不涉及显式测试；它只是遍历数组中的每个元素。当不需要元素的索引位置时，这种方法更简单方便。其语法如下：\n\
    \n```java\nfor (type variable : array) {\n  statements\n}\n```\n\n与 `for` 循环一样，如果变量已经声明，则可以省略类型。变量的作用域是整个语句。例如，可以这样打印字符串数组中的每个元素：\n\
    \n```java\nfor (String name: names) {\n  System.out.println(name);\n}\n```\n\n\
    ## 3.3.1.9 经典 switch 语句\n\n正如 `if` 语句根据布尔值在两个代码块之间进行选择，`switch` 语句根据整数、字符、字符串或枚举值在多个代码块之间进行选择。\n\
    \n> 注意：本节描述的是适用于所有 Java 版本的“传统” `switch` 语句。对于 Java 14 及更高版本提供的更新（更好）的版本，请参见章节\
    \ 3.3.2.3。\n\n其语法较为复杂：\n\n```java\nswitch (expression) {\n  case constant1:\n\
    \    statements1;\n    break;\n  case constant2:\n    statements2;\n    break;\n\
    \  ...\n  case constantN:\n    statementsN;\n    break;\n  default:\n    statementsDef;\n\
    }\n```\n\n操作逻辑如下：计算表达式，然后与每个 `case` 常量进行比较。当发现与表达式相等的常量时，从后续语句开始执行，直到遇到 `break`\
    \ 或 `return`，或者到达整个 `switch` 语句的结束。\n"
