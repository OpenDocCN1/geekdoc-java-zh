    # A Lightning Tour of Java ■7


    Classes marked public are available everywhere throughout the program.


    A declaration consists of a type, a name, an optional equals sign, and a value,
    and ends with a semicolon. It may be marked as public or private, and in addition,
    it may be preceded by the word static.


    ```

    public static double Avogadro = 6.0221409e+23;

    ```


    If a variable is marked with static, there is only one of it, it belongs to the
    class itself, and all objects of that class share this variable. Otherwise, it
    is an instance variable (also called a field), and every object has a separate
    copy of variable.


    A constructor is used to create new objects whose type is ClassName.


    ```

    ClassName(parameters) {

    declarations

    statements}

    ```


    A constructor is called with new ClassName(arguments). It always returns a newly
    created object; a return statement is unnecessary, and if used, it must be a "bare"
    return statement, not supplying a value. A constructor typically does little more
    than assign values to the instance variables of the new object.


    A method is a chunk of code. It is like a function, except that it belongs to
    an object (or to a class). The basic structure of a method is


    ```

    returnType methodName(parameters) {

    declarations

    statements}

    ```


    The returnType may be any primitive or object type, or the keyword void. If the
    returnType is void, the method will return when a return; statement is executed,
    or when the end of the method is reached. But if the method is to return a value,
    it must terminate with a return expression;'
