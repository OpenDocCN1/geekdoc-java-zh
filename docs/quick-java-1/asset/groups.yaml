    ```


    you would need to say


    ```

    sh = (short)(sh + 1);

    ```


    The shorthand forms op= combine arithmetic with assignment avoid the need for
    a cast. This is legal:


    ```

    sh += 1;

    ```


    ## 5.2.2.7 Arrays


    Arrays are objects, and they have length field. However, java.util.Arrays provides
    a number of useful static methods.


    - Arrays.toString(array) — Returns a string representation of the array.

    - Arrays.deepToString(array) — Returns a string representation of multidimensional
    arrays.

    - Arrays.equal(array1, array2) — Tests whether two arrays are equal.

    - Arrays.deepEqual(array1, array2) — Tests whether multidimensional arrays are
    equal.

    - Arrays.sort(array) — Sorts the array in ascending order.

    - Arrays.binarySearch(array, key) — Searches the sorted array for the key and
    returns the index at which it is found. If the key is not found, it returns negative
    -1.


    ## 5.2.2.8 Strings


    Strings are objects. There are about fifteen constructors for strings, the usual
    way to make a string is just to put characters between double quotes. Once this
    is done, you can send messages to the string the usual way.


    For example, if s is a string, you can ask how many characters it has by saying
    s.length(). You can get an uppercase version of it by asking s.toUpperCase().
    You can ask if it contains "Java" as a substring by asking s.contains("Java").
    And so on, and so on.


    It is useful to remember that strings are immutable. There is no message you can
    send to a string that will change the characters of that string. Methods like
    return a new string, but leave the original string untouched.


    Strings have an equals method you can and should use when comparing strings. If
    s and t are strings, you can ask s.equals(t) and get the results you expect. There
    are two potential traps


    > Trap #1. You can''t send a message to a null object. If s is null, s.equals(t)
    will result in an error. But if t is null and s isn''t, the method correctly returns
    false. Therefore, if you are comparing a String variable to a literal string,
    it''s better to send the equals message to the literal string, and make the variable
    an argument.


    Strings are immutable, so if you write the same string in several places in the
    program, it only needs to be stored once. Java works to intern identical strings,
    making only one copy of that string.


    > Trap #2. Because strings are intern, the test s == t (which for objects is a
    test of identity rather than equality) always works. Sometimes Java''s interning
    strategy fails, and this test will report false for equal strings. Therefore,
    don''t use == for strings.


