    \ is as follows:\n\n```\ntry {\n    code that might throw the exception\n}\ncatch\
    \ (SomeExceptionType variable) {\n    code to handle this kind of exception\n\
    }\ncatch (SomeOtherExceptionType variable) {\n    code to handle this other exception\
