    # The “Outer Language” of Java ■ 71


    Next in the class is a constructor. It has the same name, Password, as the class
    that it is in, and it will return a Password object. (Constructors do not use
    an explicit return statement.)


    Notice that the constructor has two different variables, both named password.
    One is the field, or instance variable, while the other is a parameter. This may
    look strange, but it is quite commonly done, especially in constructors. To distinguish
    between them, the name password by itself refers to the parameter, while this.password
    refers to the instance variable.


    Next is a method named matches, which will return a boolean (true or false) value.
    Because strings are objects, the matches method will compare them using equals.


    > Note: Using == to compare strings often works, it won''t work here; see section
    5.2.2.8 for an explanation. You should always use equals to compare strings.


    Finally, there is a reset method that takes two strings as parameters and tells
    whether the reset succeeded. It is not marked public, protected, or private, so
    it has package access—it can be used by any class in the same package.


    # 4.1.2 The Class Header


    The class header may be as simple as the word class followed by the name of the
    class, or it may be as complex as the following:


    ```

    access class ClassName extends SuperClass

    implements Interface1, ..., InterfaceN

    ```


    The access may be either public or omitted:


    +   - public: Can be seen and used anywhere in the project.

    - package: (default, no keyword) Can be seen and used by classes in the same package
    (directory). The package keyword, specifies which directory this class is in,
    cannot be used here.'
  - '[PAGE 92]


    # 72 Quick Java


    There are two additional access types:


    +   - protected: Can be seen and used by any classes in the same directory, and
    by any subclasses of this class, wherever they may be.

    - private: Can be seen and used only within this class and, if in an inner class,
    by its enclosing classes.


    Fields and methods can be labeled with any one of the above access types, with
    “package” as the default. Local variables of a method cannot be so labeled; they’re
    just local.


    By convention, the ClassName should begin with a capital letter. It defines a
    type; every object created from this class will be of type ClassName.


    Classes are arranged in a hierarchy, with the Object class at the root (top) of
    the hierarchy. Every class except Object extends one other class, called its superclass,
    and inherits data and methods from that superclass. If the superclass is omitted,
    Object is assumed.


    Briefly, inheritance means that if B extends class A, then all the data and methods
    in A are also part of B. B can extend what it receives from A by defining additional
    data and methods. This will be examined in section 4.2.


    The class may also implement some interfaces, as described briefly in the next
    section.


    # 4.1.3 Interfaces


    An interface is a list of methods—just the method headers, not the body. A class
    that implements an interface must supply those methods, with the same headers
    but also with a body. For example, the String class implements the CharSequence
    interface, and that interface requires the String class to supply several methods,
    among them charAt(index), length(), and isEmpty().


    A class may extend another class, thus inheriting all its fields and methods.
    Similarly, an interface may extend another interface, thus inheriting additional
    methods to be implemented.'
