    +   * *string.matches(regex)*—Tests whether this string matches the regex pattern.

    * *string.replaceFirst(regex, replacement)*—Returns a string in which the first
    substring that matches regex has been replaced by replacement.

    * *string.replaceAll(regex, replacement)*—Returns a string in which every substring
    that matches regex has been replaced by replacement.

    * *string.split(regex)*—Strings matched by regex as separators; the substrings
    separated are returned in an array.

    * *string.split(regex, limit)*—Returns an array of not more than limit matching
    substrings.


    You can use these methods without knowing the syntax of regular expressions. All
    you need to remember is that many punctuation marks have special meanings in regular
    expressions, by letters, digits, and spaces do not. So any *regex* composed only
    of letters, digits, and spaces stands for itself.


    Unfortunately, Java strings use a backslash to escape certain characters, such
    as \n for newline, while regular expressions use a backslash for certain character
    classes, as \d for a digit. This makes regular expressions somewhat hard to write
    in Java.


