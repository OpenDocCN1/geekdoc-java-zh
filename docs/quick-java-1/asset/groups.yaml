    \nThe usual reason for upcasting is to put an object into a collection of general\
    \ objects; for example, to put a birthday cake into an array of cakes. The birthday\
    \ cake does not lose its special features (candles, for example), but those features\
    \ are unavailable from a variable of the more general type Cake.\n\nWhen downcasting\
    \ an object, Java inserts an implicit check that the object really is an object\
    \ of the intended type, and throws a ClassCastException if it is not. When the\
    \ object is in a variable of the more specific type, the added features (fields\
    \ and methods) are again available.\n\nYou can test if an object is of a given\
    \ type or supertype with the instanceof operator.\n\n```\nmyCake instanceof BirthdayCake\
    \ // true\nmyCake instanceof Cake // true\nmyCake instanceof Object // true\n\
    ```\n\nAn instanceof can be used to test whether a variable can be cast to a certain\
    \ type, but it doesn't perform the cast.\n\n```\n (obj instanceof BirthdayCake)\
    \ {\n  BirthdayCake bc = (BirthdayCake) obj;\n  use bc here\n}\n```\n\nStarting\
    \ with Java 14, this can be abbreviated as\n\n```\n (obj instanceof BirthdayCake\
    \ bc) {\n  ...use bc here\n}\n```\n\n## 4.4 OVERRIDING\n\nObjects inherit methods\
    \ from their superclasses, and Object is the root superclass of all objects, therefore\
    \ every object inherits all the methods defined in the Object class.\n\n### The\
    \ “Outer Language” of Java 9\n\nIf an inherited method is not exactly what is\
    \ desired, it can be overridden (replaced) by a different method with the same\
    \ name and number and types of parameters. To do this,\n\n- 1. Write the annotation\
    \ @Override directly before the method.\n\n- An annotation is an instruction to\
    \ the compiler. The @Override annotation asks the compiler to check that the name\
    \ and parameter list match with those of an inherited method because, if they\
    \ don’t, you are simply defining another method, not overriding one.\n\n- 2. Write\
    \ a method with the same name, same number of parameters, and same types of parameters\
    \ (in the same order) as the method you wish to override.\n\n- The parameter names\
    \ don’t have to be the same, and the overriding method may even have a different\
    \ return type.\n\n- 3. Make sure the new method is at least as public as the method\
    \ it overrides. (The sequence is private, “package,” protected, and public.) If\
    \ the inherited method is public, any method that overrides it must also be public.\n\
    \nIt is a good idea, when defining your own objects, to override three of the\
    \ methods inherited from Object:\n\n- toString() returns a String representation\
    \ of this object.\n\n- equals(obj) tests if this object is equal to object obj.\n\
    \n- hashCode() returns an int hash code for this object.\n\nThe inherited versions\
    \ of these methods are fairly useless; they exist so that they can be overridden.\
    \ By defining them in Object, Java can be sure that every object has some version\
    \ of these methods.\n\nIf your class overrides an inherited method, that inherited\
    \ method is still available to you: just prefix the method call with super. That\
    \ is,\n\nsuper.methodName(parameters) will ignore the local method methodName\
    \ and use the inherited version.\n\nAn inherited field can be shadowed (hidden)\
    \ by declaring a field with the same name. This is usually done because the programmer\
    \ did not realize the field already exists; and if the shadowed field is never\
    \ needed, the mistake is harmless. When a variable is shadowed, super.fieldName\
    \ gives access to the inherited field.\n\n### 4.4.1 Overriding toString\n\nEvery\
    \ object has a toString method, inherited from Object. It is called automatically\
    \ when “adding” an object to a string and when trying to print an object. You\
    \ can also call it directly.\n\nThe inherited toString method is pretty useless.\
    \ It's primarily as a placeholder so that you can override it with a more useful\
    \ version.\n\nHere is a possible toString method for the Counter object:\n\n```java\n\
    @Override\npublic String toString() {\n    return \"My count is \" + count;\n\
    }\n```\n\nThe inherited toString method is public, therefore the version that\
    \ overrides it must be public.\n\nThe inherited toString takes no parameters and\
    \ returns a String result, so the version that overrides it must do the same.\n\
    \nIf any of these aspects do not match the inherited toString method, you may\
    \ have a valid method that overloads but doesn't override the inherited one. If\
    \ the method is annotated with @Override, this kind of error will be caught.\n\
    \nWhile a toString method can be used to present information to the user, other\
    \ methods are usually written for that purpose. The real value of toString comes\
    \ during debugging when it can show the actual contents of objects.\n\n### 4.4.2\
    \ Overriding Equals\n\nEvery object inherits an equals method from Object, but\
    \ that method actually tests for identity. According to this method, two objects\
    \ are “equal” if and only if they are the same object, occupying the same location\
    \ in memory. This is also what the == comparison operator does when applied to\
    \ objects.\n\n**Important:** For objects, == is always an identity test, not an\
    \ equality test. The equals method is also an identity test, unless it has been\
    \ overridden for that particular class of objects.\n\nContinuing to use our Counter\
    \ class as an example, here is what a typical equals method would look like:\n\
    \n```java\n@Override\npublic boolean equals(Object obj) {\n    if (obj == this)\
    \ return true;\n    if (!(obj instanceof Counter)) return false;\n    Counter\
    \ that = (Counter)obj;\n    return this.count == that.count;\n}\n```\n\n- 1. First,\
    \ we say that we are overriding some method, then we give it the same name (The\
    \ parameter may have a different name, but everything else must be the same).\n\
    - 2. Next we see if we are comparing the Counter to itself. The keyword this refers\
    \ to the object currently executing the method; that is, if we were testing c1.equals(c2),\
    \ this refers to c1.\n- 3. The == operator tests for identity; it isn’t necessary\
    \ here, but it’s a very fast test for a common situation.\n- 4. Since the method\
    \ will take any kind of object as a parameter, we probably want to return false\
    \ if the method is called with something other than a Counter.\n- 5. If we get\
    \ past the tests, we know that the parameter obj holds a Counter, but the type\
    \ of the variable obj is still Object. It would be an error to say obj.count,\
    \ because not all objects have a count field. We have to cast obj to a Counter\
    \ object and save it in a variable of type Counter in order to use it. (I like\
    \ to use the variable name that, but any other name would do.)\n- 6. Finally,\
    \ we have two Counter objects that we can compare. This test could be quite complex,\
    \ but for our simple Counter objects we'll just if their count fields are equal.\n\
    \nThe equals method should define an equivalence relation. That is, it should\
    \ have the following three properties for any objects obj1 and obj2:\n\n- Reflexive:\
    \ obj1.equals(obj1) should always be true.\n- Symmetric: obj1.equals(obj2) should\
    \ always give the same result as obj2.equals(obj1).\n- Transitive: If obj1.equals(obj2)\
    \ and obj2.equals(obj3), then it should be the case that obj1.equals(obj3).\n\n\
    Unfortunately, symmetry can only be \"mostly\" achieved. If obj1 is an object\
    \ but obj2 is null, obj1.equals(obj2) should give false, but obj2.equals(obj1)\
    \ would result in a NullPointerException. Symmetry could be achieved by making\
    \ both of these result in a NullPointerException, but that hardly seems useful.\n\
    \nFortunately, any reasonable definition of equals is likely to satisfy these\
    \ properties, insofar as they can be satisfied in Java.\n\n### 4.4.3 Overriding\
    \ hashCode\n\nThere is a “rule” in Java that if you override equals, you should\
    \ also override hashCode.\n"
