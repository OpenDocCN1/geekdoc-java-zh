    # Functional Programming


    THE BASIC IDEA OF functional programming is that functions are values, and can
    be treated as such. Functions can be stored in variables, passed as arguments
    to methods, returned as the result of a method, combined to form new functions,
    and applied in part or in full to arguments. Along with this is the data that
    is immutable; functions applied to data produce new data rather than changing
    existing data.


    There are three factors that add to the complexity of functional programming in
    Java. First, Java is designed around methods, which are associated with classes;
    functions are a recent inclusion. Second, primitives are treated differently from
    objects, which leads to a combinatorial explosion of methods. Third, Java’s data
    structures are all mutable, which is inconsistent with the general practice of
    functional programming.


