    to use depends on the type of layout manager.


    +   - For a flow layout, use container.add(component);

    - For a grid layout, use either container.add(component); or container.add(component.index);
    where the index is a single integer starting at 0.

    - For a border layout, use container.add(component, BorderLayout.area); where
    the area is one of NORTH, SOUTH, EAST, WEST, and CENTER. The border takes up only
    as much space as necessary to lay out their components, and the center gets all
    the remaining space.


