    \n```java\n{\n  x = 1; // not legal here\n  int x;\n  x = 2; // legal here\n}\n\
    x = 3; // not legal here\n```\n\nThe braces around a class or interface do not\
    \ form a block, but the body of a method is a block, so the above ordering rule\
    \ applies.\n\n### 5.2.1.2 Javadoc\n\nA documentation comment, or doc comment,\
    \ is a comment that can be used by the javadoc program to produce professional-looking\
