    # (parameters) -> statement


    +   - Each of the parameters consists of a type (int, etc.) and a name, although
    in many cases, the type declaration may be omitted or replaced with var, and Java
    will figure out the correct type.


    +   - If there is only one parameter, and the type is not specified, the parentheses
    may be omitted.


    +   - If there are no parameters, empty parentheses, (), are required.


    +   - The statement may be a compound statement (enclosed in braces) and may contain
    return statements.


    +   - Functions cannot be defined at the top level; they can only be defined within
    methods (or within another function).


    The method reference operator, ::, is a way of “wrapping” a method inside a functional
    interface, so that it can be used if it were a function.


    Essentially, x :: m is an abbreviation of x -> x.m(...), where m has an unspecified
    number of parameters. If there is more than one method m, method resolution is
    performed in the usual way, by the types and number of parameters.


    # 6.2 FUNCTIONAL INTERFACES


    A functional interface is any interface that declares exactly one abstract method,
    called it SAM (Single Abstract Method). For example, the Comparable interface
    declares compareTo(T) single abstract method, the Runnable interface declares
    run(), and the ActionListener interface declares actionPerformed(actionEvent).


    The most common use of functional literals is to pass them into methods as arguments.
    However, a method must specify the type of each its parameters. In the case of
    a function literal, the type will be the name of some kind of functional interface,
    but that isn''t obvious. Java provides 43 types of functional interfaces, each
    with an associated SAM.


    For example, suppose the lambda expression is x -> x * x, and x is an integer.
    Then the type of this lambda expression is IntUnaryOperator,'
