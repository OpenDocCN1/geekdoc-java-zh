    # 3.2 BASIC DATA TYPES


    There are eight primitive data types: char, byte, short, int, long, float, double,
    and boolean. All other values (arrays, strings, etc.) are of some class, or object,
    type. The distinction is important.


    # 3.2.1 Primitive Types


    Here are the four most important and most used primitive types:


    +   - An int is an integer, or “whole number.” It can hold numbers large enough
    for most purposes (about plus or minus two billion). To make very large numbers
    readable, you can put underscores between digits.


    +   - A double is a 64-bit “real” (floating point) number. It can hold very large
    and small numbers, with about 17 digits of accuracy. It may be written in scientific
    notation, with e or E denoting the exponent: 6.0221409 × 10²³ can be written as
    6.0221409e+23. As integers, you can put underscores between digits.


    +   - A char is a single character. Common characters can be written simply by
    enclosing them in single quotes, for example, ''a''. Some characters need to be
    represented by escape sequences, such as ''\n'' for a newline.


    +   - A boolean is a single true or false value.


    The other four primitive types (long, short, byte, and float) aren’t used in most
    programs, and will be discussed in section 5.2.2.6.


    # 3.2.2 Arrays


    An array is an ordered sequence of values, all of the same type. To access the
    individual values in an array, use the syntax arrayName[index]. Legal indices
    range from 0 (the first value in the array) to arrayName.length -1 (the last value).


    The simplest syntax for declaring an array is either:


    ```

    baseType[] arrayName;

    ```'
