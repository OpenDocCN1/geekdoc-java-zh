    \ you never use these classes, and never give your code to anyone who might, there\
    \ is no need to override hashCode; but it's cheap and easy to do, so you should\
    \ anyway.\n\nThe point to remember is that equal objects must have equal hash\
    \ codes. If you use only part of an object to test for equality, use those same\
    \ parts to create a hash code. This is absolutely necessary for classes like HashMap\
    \ to work correctly.\n\nIt is not, repeat not, the case that unequal objects must\
    \ have different hash codes. It's better if they do, relatively harmless if they\
