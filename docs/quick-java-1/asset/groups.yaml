    \ precedence are done from left to right.\n\nThere is no exponentiation operator.\
    \ Exponentiation is done by calling the pow method in the Math module: Math.pow(r,\
    \ 2).\n\nArithmetic expressions using only integers result in an integer result.\
    \ The expression involves a double, the result will be a double.\n\nJava has the\
