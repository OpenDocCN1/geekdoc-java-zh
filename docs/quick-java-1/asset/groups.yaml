    \ on how you are running Java) should be somewhere on your screen.\n\nStatements\
    \ end with a semicolon. There are two statements in the above, one to call doSomething\
    \ and one to print Hello World.\n\nThe names MyClass and doSomething (but not\
    \ main) may be replaced with names of your choosing. By convention, class names\
    \ always begin with a capital letter, and method names with a lowercase letter.\n\
    \nWith HelloWorld as a starting point, you can add methods and code to make a\
    \ useful program.\n\n![](img/fb8b9ea4edf0c31c9f97e5eb4d89a6be_32_0.png)\n\n# CHAPTER\
    \ 2\n\n# Preliminaries\n\nIT CAN BE USEFUL TO THINK OF JAVA as consisting of an\
    \ \"inner language\" and an \"outer language.\" The inner language consists of\
    \ data, methods, and statements, and is all that is needed for a small program\
    \ with only a single class. The equally complex outer language consists of all\
    \ the various kinds of classes and interfaces used to organize a large program.\n\
    \nAfter some preliminaries, the next chapter describes the inner language of Java\
    \ (which is very like C or C++), and the following chapter describes the outer\
    \ language.\n\n# 2.1 IDEs\n\n**Section summary:** The use of an IDE is strongly\
    \ recommended. If you don't already use one, IntelliJ IDEA is one of the most\
    \ beginner-friendly. You can create and run programs with nothing more than a\
    \ text editor and the command line, but doing this the hard way.\n\nAn Integrated\
    \ Development Environment (IDE) is immeasurably helpful in developing programs.\
    \ A very basic IDE integrates a text editor, a compiler, a debugger, and code\
    \ executor. A professional-level IDE will also suggest applicable methods, provide\
    \ instant documentation lookup, offer corrections for mistakes, make automatic\
    \ backups, assist in reorganizing code, and any number of other services. I have\
    \ had students tell me that they succeeded in my course only because their IDE\
    \ wrote their programs for them.\n\nThe most popular Java IDEs are Eclipse, NetBeans,\
    \ IntelliJ IDEA, and the Mac-only Xcode. All are excellent and have ardent users;\
    \ all have free versions. All can be (and are) used for a number of other languages.\
    \ Of these, IntelliJ IDEA requires no prior knowledge of the interface but simply\
    \ guides the beginning user at each step.\n\nThat said, sometimes an IDE will\
    \ simply refuse to work. This could be the result of an upgrade, so that file\
    \ versions are incompatible, or some similar problem. (I have had this problem\
