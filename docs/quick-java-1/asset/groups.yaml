    A few of the important operations on a HashMap:


    +   - map.put(key, value) — adds the key/value pair to the map, possibly replacing
    a previous value.

    - map.putIfAbsent(key, value) — adds the key/value pair to the map, unless the
    key is already in with a non-null value.

    - map.get(key) — returns the value associated with the key, or null if the key
    isn''t in the map.

    - map.OrDefault(key, defaultValue) — returns the value associated with the key,
    or defaultValue if the key isn''t in the map.

    - map.size() — returns the number of key/value pairs in the map.

    - map.clear() — removes all entries from the map.

    - map.remove(key) — deletes the key and its associated value from the map.

    - map.keySet() — returns a Set “view” of all the keys in map.


