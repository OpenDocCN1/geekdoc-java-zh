- md: "\nmodule giveModule {\n    exports com.xyz.giver;\n    exports com.xyz.secret\
    \ to takeModule;\n}\n```\n\nThis specifies that the giver package can be used\
    \ by anyone that requires it, while only the takeModule module can require the\
    \ package secret.\n\n**Note:** Windows uses backslashes rather than forward slashes\
    \ to indicate directory structure, while Java uses dots.\n\nIn this example, the\
    \ directory containing the taker package also contains this module-info.java file:\n\
    \n```\nmodule takeModule {\n    requires transitive giveModule;\n}\n```\n\nThe\
    \ optional word transitive implies that any module requires takeModule will also\
    \ have access to giveModule.\n\nModules may not have circular dependencies. If\
    \ module A requires module B, module B cannot require module A.\n\nAll the Java-supplied\
    \ packages have been organized into about 100 modules, and every module declaration\
    \ automatically requires java.base. The java.base module consists of 32 packages,\
    \ including java.lang, java.util, java.io, and java.math.\n\n## 5.3.10 Build Tools\n\
    \nJava programs must be **compiled** (turned into **byte code**) before they can\
    \ be executed. The javac **file** command will compile a single file (which must\
    \ have the .java extension) to a file of byte code with the .class extension.\n\
    \nHowever, all but the simplest programs consist of multiple classes, each on\
    \ a separate .java file. A file cannot be compiled successfully until all of the\
    \ classes it depends on have been compiled. Moreover, compilation can be time-consuming,\
    \ so we don’t want to compile everything each time one little change is made.\
    \ But if one Java file is changed and re-compiled, files that depend on it must\
    \ also be re-compiled. Re-compiling these files may lead to re-compiling still\
    \ more files.\n\nA build tool takes as input a list of file dependencies, and\
    \ compiles or re-compiles only those files that need it. Ant, Maven, and Gradle\
    \ are popular build tools. If you are using an IDE, one or both of these tools\
    \ will be built-in for you, and you can let the IDE do the work.\n\n![](img/fb8b9ea4edf0c31c9f97e5eb4d89a6be_160_0.png)\n\
    \n## Functional Programming\n\nTHE BASIC IDEA OF functional programming is that\
    \ functions are values, and can be treated as such. Functions can be stored in\
    \ variables, passed as arguments to methods, returned as the result of a method,\
    \ combined to form new functions, and applied in part or in full to arguments.\
    \ Along with this is the data that is immutable; functions applied to data produce\
    \ new data rather than changing existing data.\n\nThere are three factors that\
    \ add to the complexity of functional programming in Java. First, Java is designed\
    \ around methods, which are associated with classes; functions are a recent inclusion.\
    \ Second, primitives are treated differently from objects, which leads to a combinatorial\
    \ explosion of methods. Third, Java’s data structures are all mutable, which is\
    \ inconsistent with the general practice of functional programming.\n\n## 6.1\
    \ FUNCTION LITERALS\n\nStarting in Java 8, you can define a lambda expression\
    \ (also called a functional literal) as follows:\n\n```\n(parameters) -> expression\n\
    ```\n\nor\n\n# (parameters) -> statement\n\n- Each of the parameters consists\
    \ of a type (int, etc.) and a name, although in many cases, the type declaration\
    \ may be omitted or replaced with var, and Java will figure out the correct type.\n\
    - If there is only one parameter, and the type is not specified, the parentheses\
    \ may be omitted.\n- If there are no parameters, empty parentheses, (), are required.\n\
    - The statement may be a compound statement (enclosed in braces) and may contain\
    \ return statements.\n- Functions cannot be defined at the top level; they can\
    \ only be defined within methods (or within another function).\n\nThe method reference\
    \ operator, ::, is a way of “wrapping” a method inside a functional interface,\
    \ so that it can be used if it were a function.\n\nEssentially, x :: m is an abbreviation\
    \ of x -> x.m(...), where m has an unspecified number of parameters. If there\
    \ is more than one method m, method resolution is performed in the usual way,\
    \ by the types and number of parameters.\n\n## 6.2 FUNCTIONAL INTERFACES\n\nA\
    \ functional interface is any interface that declares exactly one abstract method,\
    \ called it SAM (Single Abstract Method). For example, the Comparable interface\
    \ declares compareTo(T) single abstract method, the Runnable interface declares\
    \ run(), and the ActionListener interface declares actionPerformed(actionEvent).\n\
    \nThe most common use of functional literals is to pass them into methods as arguments.\
    \ However, a method must specify the type of each its parameters. In the case\
    \ of a function literal, the type will be the name of some kind of functional\
    \ interface, but that isn't obvious. Java provides 43 types of functional interfaces,\
    \ each with an associated SAM.\n\nFor example, suppose the lambda expression is\
    \ x -> x * x, and x is an integer. Then the type of this lambda expression is\
    \ IntUnaryOperator, and the associated SAM is applyAsInt(int). As a trivial example,\
    \ we can define this method:\n\n```java\nvoid run(IntUnaryOperator fun, int n)\
    \ {\n    System.out.println(fun.applyAsInt(n));\n}\n```\n\nWhen we call this method\
    \ with run(x -> x * x, 12), it will print 144.\n\nFor a more interesting example,\
    \ we will define a method that applies a function to each element of an integer\
    \ array and returns an integer array of results.\n\n```java\nimport java.util.function.IntUnaryOperator;\n\
    import java.util.Arrays;\n\npublic class FunctionTest {\n    public static void\
    \ main(String[] args) {\n        FunctionTest test = new FunctionTest();\n   \
    \     int[] a = {1, 2, 3, 4, 5};\n        Mapper map = new Mapper();\n       \
    \ int[] b = map.apply(a, x -> x * x);\n        System.out.println(Arrays.toString(b));\n\
    \    }\n}\n\n@FunctionalInterface\ninterface ForEach {\n    void apply(int[] a,\
    \ IntUnaryOperator f);\n}\n\nclass Mapper implements ForEach {\n    public int[]\
    \ apply(int[] a, IntUnaryOperator f) {\n        int[] b = new int[a.length];\n\
    \        for (int i = 0; i < a.length; i++) {\n            b[i] = f.applyAsInt(a[i]);\n\
    \        }\n        return b;\n    }\n}\n```\n\n## 6.3 IMPLICIT FUNCTIONAL INTERFACES\n\
    \nFunctional interfaces don't have to be annotated with @FunctionalInterface.\
    \ Any interface that has exactly one abstract method is a functional interface.\n\
    \nOne use for this is in programming graphical user interfaces. The ActionListener\
    \ interface has one SAM, actionPerformed(ActionEvent e), and this is used by many\
    \ user interface elements, as javax.swing.JButton. The traditional way to associate\
    \ an action with a button is something like\n\n```\nmyButton.addActionListener(new\
    \ ActionListener() {\n  @Override\n  public void actionPerformed(ActionEvent e)\
    \ {\n    doSomething();\n  }\n});\n```\n\nSince ActionListener is a functional\
    \ interface, the above can be simplified to:\n\n```\nmyButton.addActionListener(e\
    \ -> doSomething());\n```\n\n## 6.4 PERSISTENT DATA STRUCTURES\n\nAn immutable\
    \ data structure is one which cannot be changed but can be modified to produce\
    \ a new data structure. For example, strings in “Pure” functional programming\
    \ makes heavy use of persistent data structures. Java does not provide any, so\
    \ this limits the value of functional programming in Java.\n"
  mdcn: "\n```\nmodule giveModule {\n    exports com.xyz.giver;\n    exports com.xyz.secret\
    \ to takeModule;\n}\n```\n\n这表示 giver 包可以被任何需要它的使用，而只有 takeModule 模块可以引用该包中的 secret\
    \ 部分。\n\n**注意：** Windows 使用反斜杠而不是正斜杠来表示目录结构，而 Java 使用点。\n\n在这个示例中，包含 taker 包的目录也包含此\
    \ module-info.java 文件：\n\n```\nmodule takeModule {\n    requires transitive giveModule;\n\
    }\n```\n\n可选关键字 `transitive` 意味着任何需要 takeModule 的模块也将访问 giveModule。\n\n模块不能有循环依赖。如果模块\
    \ A 依赖模块 B，则模块 B 不能依赖模块 A。\n\nJava 提供的所有包已组织成约 100 个模块，每个模块声明都会自动需要 `java.base`。`java.base`\
    \ 模块包含 32 个包，包括 `java.lang`、`java.util`、`java.io` 和 `java.math`。\n\n## 5.3.10\
    \ 构建工具\n\nJava 程序在执行之前必须经过**编译**（转换为**字节码**）。`javac` **file** 命令会将单个文件（必须具有 .java\
    \ 扩展名）编译为具有 .class 扩展名的字节码文件。\n\n然而，除了最简单的程序外，所有程序都包含多个类，每个类对应一个单独 .java 文件。在它所依赖的所有类都被编译之前，该文件无法成功编译。此外，编译可能非常耗时，因此我们不希望每次进行细微更改时都编译所有内容。但如果更改了一个\
    \ Java 文件并重新编译，依赖于它的文件也必须重新编译。重新编译这些文件可能会重新编译更多文件。\n\n构建工具将文件依赖列表作为输入，仅编译或重新编译那些需要的文件。Ant、Maven\
    \ 和 Gradle 是流行的构建工具。如果你正在使用 IDE，这些工具中的一个或两个将已内置在其中，你可以让 IDE 完成工作。\n\n![](img/fb8b9ea4edf0c31c9f97e5eb4d89a6be_160_0.png)\n\
    \n## 函数式编程\n\n函数式编程的**基本思想**是函数是值，可以像值一样处理。函数可以存储在变量中，作为参数传递给方法，作为方法的的结果返回，组合形成新函数，并部分或全部应用于参数。与之对应的是数据是不可变的；应用于数据的数据函数会产生新数据，而不是更改现有数据。\n\
    \n增加 Java 函数式编程复杂性的因素有三个。首先，Java 是围绕类方法设计的，而函数是最近引入的。其次，基本类型与对象的处理方式不同，这导致了方法的组合爆炸。第三，Java\
    \ 的数据结构全都是可变的，这与函数式编程的通用做法不一致。\n\n## 6.1 函数字面量\n\n从 Java 8 开始，你可以按照如下方式定义 lambda\
    \ 表达式（也称为函数字面量）：\n\n```\n(parameters) -> expression\n```\n\n或\n\n```\n(parameters)\
    \ -> statement\n```\n\n- 每个参数由一个类型（如 int 等）和一个名称组成，尽管在许多情况下，类型声明可以被省略或替换为 `var`，Java\
    \ 会推断出正确的类型。\n- 如果只有一个参数且未指定类型，可以省略括号。\n- 如果没有参数，则需要空括号 `()`。\n- 语句可以是一个复合语句（用大括号括起来），并可以包含\
    \ return 语句。\n- 函数不能定义在顶层；它们只能定义在方法内部（或另一个函数内部）。\n\n方法引用运算符 `::` 是一种将方法“封装”在函数接口内部的方法，使其可以像函数一样使用。\n\
    \n本质上，`x :: m` 是 `x -> x.m(...)` 的缩写，其中 `m` 有未指定的参数数量。如果有多个方法 `m`，将按照按照类型和参数数量进行方法解析。\n\
    \n## 6.2 函数式接口\n\n函数式接口是任何仅声明一个抽象方法的接口，称为 SAM（单个抽象方法）。例如，`Comparable` 接口声明了 `compareTo(T)`\
    \ 抽象方法，`Runnable` 接口声明了 `run()`，而 `ActionListener` 接口声明了 `actionPerformed(actionEvent)`。\n\
    \n函数字面量常用的用法是将它们作为参数传递给方法。然而，方法必须指定其每个参数的类型。对于函数字面量，类型将是某种函数接口的名称，但这并不直观。Java\
    \ 提供了 43 种函数式接口，每个接口都关联一个 SAM。\n\n例如，假设 lambda 表达式为 `x -> x * x`，且 `x` 是整数。那么该\
    \ lambda 表达式的类型是 `IntUnaryOperator`，关联的 SAM 是 `applyAsInt(int)`。作为一个简单的示例，我们可以定义这个方法：\n\
    \n```java\nvoid run(IntUnaryOperator fun, int n) {\n    System.out.println(fun.applyAsInt(n));\n\
    }\n```\n\n当我们用 `run(x -> x * x, 12)` 调用此方法时，它将打印 144。\n\n为了一个更有趣的示例，我们将定义一个方法，将函数应用于整数数组的每个元素，并返回一个结果整数数组。\n\
    \n```java\nimport java.util.function.IntUnaryOperator;\nimport java.util.Arrays;\n\
    \npublic class FunctionTest {\n    public static void main(String[] args) {\n\
    \        FunctionTest test = new FunctionTest();\n        int[] a = {1, 2, 3,\
    \ 4, 5};\n        Mapper map = new Mapper();\n        int[] b = map.apply(a, x\
    \ -> x * x);\n        System.out.println(Arrays.toString(b));\n    }\n}\n```\n\
    \n@FunctionalInterface\ninterface ForEach {\n    void apply(int[] a, IntUnaryOperator\
    \ f);\n}\n\nclass Mapper implements ForEach {\n    public int[] apply(int[] a,\
    \ IntUnaryOperator f) {\n        int[] b = new int[a.length];\n        for (int\
    \ i = 0; i < a.length; i++) {\n            b[i] = f.applyAsInt(a[i]);\n      \
    \  }\n        return b;\n    }\n}\n```\n\n## 6.3 隐式函数式接口\n\n函数式接口不必使用 `@FunctionalInterface`\
    \ 注解。任何恰好有一个抽象方法的接口都是函数式接口。\n\n它的用处之一是在图形化用户界面编程。`ActionListener` 接口有一个 SAM `actionPerformed(ActionEvent\
    \ e)`，它被许多用户界面元素使用，如 `javax.swing.JButton`。与按钮关联动作的传统方法如下：\n\n```\nmyButton.addActionListener(new\
    \ ActionListener() {\n  @Override\n  public void actionPerformed(ActionEvent e)\
    \ {\n    doSomething();\n  }\n});\n```\n\n由于 `ActionListener` 是函数式接口，上面的代码可以简化为：\n\
    \n```\nmyButton.addActionListener(e -> doSomething());\n```\n\n## 6.4 持久化数据结构\n\
    \n不可变数据结构是不可更改的，但可以通过修改来产生新的数据结构。例如，“纯”函数式编程中的字符串大量使用了持久化数据结构。Java 没有提供任何此类结构，因此这限制了\
    \ Java 中函数式编程的价值。\n\n"
