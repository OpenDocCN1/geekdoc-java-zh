    # Author


    M DAVID MATUSZEK, known to most of my students as “Dr. Dave.”


    I wrote my first program on punched cards in 1963 and immediately got hooked.


    I taught my first computer classes in 1970 as a graduate student in computer science
    at the University of Texas in Austin. I eventually got my PhD from there, and
    I''ve been teaching ever since. Admittedly, I spent over a dozen years in industry,
    even then I taught as an adjunct at Villanova University.


    I finally escaped from industry and joined the Villanova faculty full-time for
    a few years, then moved to the University of Pennsylvania, where I directed a
    Master’s in Computer and Information Technology (MCIT) program for students entering
    computer science from another discipline. Throughout my career, my main interests
    have been in artificial intelligence (AI) and programming languages. I''ve used
    a lot of programming languages.


    I retired in 2017, but I can''t stop teaching, so I''m writing a series of “quick
    start” books on programming and programming languages. I''ve written three science
    fiction novels—Ice Jockey, All True Value, and A Prophet in Paradise—and I expect
    to write more. Check them out!


    And, hey, if you''re a former student of mine, drop me a note. I''d love to hear
    from you at david.matuszek@gmail.com.'
