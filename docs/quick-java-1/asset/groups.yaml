    \ e) {\n    System.out.println(\n    \"Released: \" + e.getKeyCode());\n}\npanel.setFocusable(true);\n\
    panel.addKeyListener(listener);\n```\n\nNotes:\n\n- When a character is typed,\
    \ the event handlers keyPressed,\nkeyTyped, and keyReleased are called, in that\
    \ order. When other\nkeys (shift, option, up arrow, etc.) are typed, only keyPressed\
