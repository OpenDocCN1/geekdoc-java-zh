    The “Outer Language” of Java ■ 73


    The purpose of an interface is to provide a common set of methods used by similar
    classes. For example, StringBuilder (see section 3.4.1.2) also implements CharSequence,
    therefore it also has the methods charAt(index), length(), and isEmpty(), along
