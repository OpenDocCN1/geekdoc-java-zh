    # 76 Quick Java


    The optional documentation comment should tell the user what the method does and
    how to use it. It should describe any restrictions on the parameter values, and
    what to expect of the return value. It should not talk about how the method is
    implemented. The documentation (doc) comment may contain tags to add specific
    kinds of information: The @param tag describes a parameter, @return describes
    the result, and @throws describes an exception that may be thrown. Additional
    tags are described in section 5.2.1.2.


    The access tells what other classes can use this method. It can be public, “package”
    (default), protected, and private.


    The returnType tells what kind of value is returned by the method. If the method
    does not return a value, the keyword void is required.


    By convention, the methodName should begin with a lowercase letter. Methods may
    be overloaded; that is, there are multiple methods with the same name, so long
    as they have different numbers of parameters or different parameter types. Java
    looks at both the name and the parameters (but not the return type) to decide
    which method to use.


    Each element in the parameterList must be a variable name preceded by its type
    (for example, String password). A primitive type is passed in “by value”. The
    method gets an independent copy of the value. An object is passed in “by reference”:
    The method gets a reference to the actual object, not a copy of it (see section
    4.1.8)


    If a method does not take parameters, the parentheses must still be present.


    In the body of the method you can have declarations of variables, with or without
    an initial value, example,


    ```

    int count = 0;

    ```


    Unlike fields, variables cannot have an access specifier; local to the method,
    and cannot be seen or used outside the method. Variable declarations are usually
    first in the method body.'
