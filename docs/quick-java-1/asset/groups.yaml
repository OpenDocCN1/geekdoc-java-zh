- md: "\n# 162 Quick Java\n\nTo write to the file:\n\n```\npr.println(\"Test line\"\
    );\npr.close();\n```\n\n## 8.2.8 Custom Dialog\n\nIf none of the supplied dialogs\
    \ is exactly what you need, you can define on your own. What you need to import\
    \ will depend on what widgets you use; the following code uses javax.swing.JDialog,\
    \ javax.swing.JFrame, and several components that will be covered later.\n\nTo\
    \ create a JDialog custom dialog:\n\n```\nJFrame parent = null;\nboolean isModal\
    \ = true;\nJDialog myDialog = new JDialog(parent, isModal);\n```\n\nTo create\
    \ a custom dialog just like you would a JPanel:\n\n```\nmyDialog.add(new JLabel(\"\
    \ Your text \"), BorderLayout.CENTER);\nJButton closeButton = new JButton(\"Close\"\
    );\nmyDialog.add(closeButton, BorderLayout.SOUTH);\n```\n\nA custom dialog should\
    \ have some listeners:\n\n```\ncloseButton.addActionListener(new ActionListener()\
    \ {\n  public void actionPerformed(ActionEvent e) {\n    myDialog.setVisible(false);\n\
    \  }\n});\n```\n\nTo display the JDialog custom dialog:\n\n```\nmyDialog.pack();\n\
    myDialog.setVisible(true);\n```\n\n## How to Build a GUI Program\n\nHERE IS THE\
    \ GENERAL FORMULA FOR BUILDING a GUI program:\n\n- 1. Import the necessary packages.\n\
    - 2. Create a window in which to display things—usually a JFrame. Optionally create\
    \ JPanels to put in the JFrame.\n- 3. Use the setLayout(manager) method to choose\
    \ a layout manager for each JFrame and JPanel. The layout manager is in charge\
    \ of putting things in the correct places in the window or panel.\n- 4. Create\
    \ some Components, such as buttons, panels, etc.\n- 5. Ask the layout manager\
    \ to place the components.\n- 6. Write some Listeners and attach them to your\
    \ components. When a user interacts with a component, one or more Events will\
    \ occur, and your Listener can execute some code to handle the event.\n- 7. Display\
    \ the window.\n\n## 9.1 EVENT-DRIVEN PROGRAMS\n\nA program without a GUI is in\
    \ complete control, from beginning to end. It may use some dialogs to interact\
    \ with the user, but the program is always in control.\n\nDOI: 10.1201/9781003402947-9\n\
    \nA GUI program is different—it is event-driven. The program does some initialization,\
    \ creates the GUI, waits for something to happen—a mouse click, a key press, a\
    \ timer signal, the completion of a file transfer, and so on. Each time one of\
    \ these occurs, an event is created. There may be dozens or even hundreds of events\
    \ each second, most of which are ignored. The program defines a listener for each\
    \ event it cares about, does something in response to that event, then goes back\
    \ to “listening” for the next event of interest.\n\n## 9.2 THE EVENT DISPATCH\
    \ THREAD\n\nJava programs run in multiple threads (code executing concurrently)\
    \ and Swing is not thread safe—it does not prevent simultaneous access to data,\
    \ which can result in data corruption. Running a Swing program directly from the\
    \ main thread can result in unpredictable errors. Unless you are doing parallel\
    \ programming, all you need to know how to run Swing from a special event dispatch\
    \ thread. Here's:\n\n```\nimport javax.swing.SwingUtilities;\nimport javax.swing.JFrame;\n\
    \npublic class MyGUI extends JFrame implements Runnable {\n    public static void\
    \ main(String[] args) {\n        SwingUtilities.invokeLater(new MyGUI());\n  \
    \  }\n\n    public void run() {\n        // add components to this JFrame\n  \
    \      pack();\n        setVisible(true);\n    }\n}\n```\n\nThe name MyGUI can\
    \ be changed, but run is a method required by the Runnable interface.\n\n## 9.3\
    \ IMPORT THE NECESSARY PACKAGES\n\nThe Swing components are in javax.swing.*,\
    \ so you always need to import that for a Swing application.\n\n## How to Build\
    \ a GUI Program ■ 165\n\nSwing is built on top of AWT and uses a number of AWT\
    \ packages, including most of the layout managers, so you need to import java.awt.*\n\
    \nMost listeners also come from the AWT, so you also need to import java.awt.event.*\n\
    \nA few listeners, such as DocumentListener and ListSelectionListener, are specific\
    \ to Swing, so if you use them you need to import javax.swing.event.*\n\nFor more\
    \ complex GUIs, there are additional java.awt.something and javax.swing.something\
    \ packages that you may need to import.\n\n> Note: The x in javax originally stood\
    \ for “experimental,” but once Swing came into widespread use, it was undesirable\
