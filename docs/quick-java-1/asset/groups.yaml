    \ Ball: View 206\n\nIndex, 209\n\n# Author\n\nDAVID MATUSZE, known to most of\
    \ my students as “Dr. Dave.” I wrote my first program on punched cards in 1963\
    \ and immediately got hooked. I taught my first classes in 1970 as a graduate\
    \ student in computer science at the University of Texas in Austin. I eventually\
    \ got my PhD from there, and I've been teaching ever since. Admittedly, I spent\
    \ over a dozen years in industry, then taught as an adjunct at Villanova University.\
    \ I finally escaped from industry and joined the faculty full-time, then moved\
    \ to the University of Pennsylvania, where I directed the Master’s in Computer\
    \ and Information Technology (MCIT) program. Throughout my career, my main interests\
    \ have been in artificial intelligence (AI) and programming. I retired in 2017,\
    \ but I can't stop, so I'm writing a series of “quick start” books on programming\
    \ languages. And, hey, if you're a former student of mine, I'd love to hear from\
    \ you at davidatuszek@gmail.com.\n\n# Preface\n\nIF YOU ARE AN experienced PROGRAMMER,\
    \ this book is your guide to getting up to speed in Java. Not just the language,\
    \ but also the basics of unit testing, graphical interfaces, threads, and functional\
    \ programming. If you are coming from one of the languages, you will find most\
    \ of the object-oriented concepts are very similar, but the terminology is different.\
    \ If you are coming from C++, you will find the material familiar. If you are\
    \ coming from another language, such as Python, there is very little you can skip.\
    \ Let's get started!\n\n# Versions\n\nThis is ABOUT Java 8 and 17. Why two? Java\
    \ 8 is the last version that is free for commercial use. For these reasons, additions\
    \ to Java after version 8 will be noted as such in this book. The latest version\
    \ is probably higher. Newer versions do not throw anything away, and the language\
    \ changes gradually. In fact, Java 17 is a LTS (Long Term Support) version, along\
    \ with 11. If you are uncertain which version of Java you have, you can execute\
    \ this from the command line:\n\n```\njava -version\n```\n\nor execute the following\
    \ statement within a running program:\n\n```java\nSystem.out.println(\"java.version\"\
    );\n```\n\nSince Java 9, you can also run jshell from the command line. This program\
    \ lets you execute Java statements (such as the above) one at a time, but it's\
    \ handy for trying things out. If you have yet to download Java, it comes in two\
    \ varieties: the JRE (Java Runtime Environment) is used to run existing programs,\
    \ and the JDK (Java Development Kit), which is used to create and run programs\
    \ (the JDK contains the JRE). Since you are reading this book, you certainly want\
    \ the JDK. You can get the Java SE (Standard Edition) JDK from https://www.oracle.com/java/technologies/downloads/\
    \ Java 9 and beyond are (currently) free for personal use, but commercial users\
    \ should obtain a license from the Oracle Corporation.\n\n# A Lightning Tour of\
    \ Java\n\nYou not have to understand or remember everything in the first reading.\
    \ Later chapters will cover the same material more slowly and in greater detail.\
    \ Note: Java is verbose, and code lines are often 80 to 100 characters long. Such\
    \ lines have been split into more but shorter lines in an attempt to improve readability.\n\
    \n## 1.1 PROJECTS\n\nA program, or project, consists of one or more packages.\
    \ A package is a directory or folder that contains Java files. Java files contain\
    \ classes, usually one class per file. A class describes a new type of object,\
    \ and bundles together the object's fields (its data) and its methods. A class\
    \ has one or more constructors to create new objects of that type.\n\n## 2 Quick\
    \ Java\n\nA method is like a function, except that a method belongs to an object,\
    \ and (normally) works with the fields of that object. A method may contain declarations\
    \ of variables and will contain executable statements.\n\nTo summarize, here is\
    \ how a project is organized:\n\n- packages (directories) of files\n- classes\
    \ (generally one per file); each class contains:\n    - fields (the data)\n  \
    \  - constructors, containing declarations and statements\n    - methods, containing\
    \ declarations and statements\n\nIn addition to the above, packages in Java 9\
    \ and later can be organized into even larger units, called modules. This is appropriate\
    \ for programs with large numbers of packages. The JDK (Java Development Kit)\
    \ is huge, consisting of about a hundred modules, hundreds of packages, and thousands\
    \ of classes. The single module relevant to this book is java.base. Modules will\
    \ be discussed briefly in section 5.3.9.\n\n## 1.2 FIRST GLIMPSE: THE CIRCLE CLASS\n\
    \nThe following program demonstrates the overall structure of a Java program and\
    \ provides an initial glimpse into what a Java program looks like.\n\n```java\n\
    package examples.shapes;\npublic class Circle {\n    private int radius;\n\n \
    \   public Circle(int r) {\n        radius = r;\n    }\n\n    public double area()\
    \ {\n        return Math.PI * Math.pow(radius, 2);\n    }\n}\n```\n"
