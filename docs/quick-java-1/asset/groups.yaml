    but it''s more convenient to have this class extend JFrame.


    A JPanel is both a container (it can have components added to it) and a component
    (it can be added to containers). Each JPanel has its own layout manager. But all
    the simplest windows of a JFrame containing several JPanels, with each JPanel
    containing one or more widgets (visible GUI components).'
