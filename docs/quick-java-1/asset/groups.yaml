    # 80 ■ Quick Java


    The same thing happens when method is called. If a primitive value is given as
    an argument, the method gets a copy of that value, but if an object is given as
    an argument, the method gets a copy of that reference.


    It is seldom necessary to make a copy of an object, and there is no builtin, easy
    way to do it. If a copy must be made, probably the best way is to add a copy constructor
    in the class definition. A copy constructor is a constructor that takes an object
    of the same type as its parameter, and copies all the data values from it into
    the new object. This must be done carefully, because some of the fields of the
    copied object may be themselves to other objects.


    # 4.1.9 Constructors II


    When an object is constructed, it is actually constructed in layers, with Object
    being the foundation layer for every object.


    If you have a Customer class, and this class extends Person, and Person extends
    Object, then when you create a new Customer object, here''s what happens:


    +   - The constructor for Customer calls the constructor for Person.

    - The constructor for Person calls the constructor for Object.

    - The constructor for Object creates and returns a basic object.

    - The constructor for Person adds the data and methods needed for a Person object,
    and returns it.

    - The constructor for Customer adds the data and methods needed for a Customer
    object, and returns it.


    The result is that the Customer object inherits all the data and methods from
    Person, and all the data and methods from Object. It can use these things just
    as if they were defined here in the Customer class.


    The first action in any constructor must be to call a constructor for its superclass.
    You can write an explicit call like this: super(parameters); A call like this
    must be the very first line in your constructor because the foundation must be
    built before you can begin adding to.'
