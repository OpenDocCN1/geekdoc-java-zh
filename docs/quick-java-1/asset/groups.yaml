    Instead, each object is stored in a particular area of memory called the heap,
    where it can occupy as many bytes as it needs. What is actually stored in the
    variable is a reference to that location in the heap, typically implemented as
    a memory address.


    > Note: A reference is similar to a pointer in other languages. The main difference
    is that arithmetic cannot be done on references.


    When a primitive value is copied from one variable into another, it is duplicated.
    Each variable has its own copy of the value (see Figure 4.1).


    ![](img/fb8b9ea4edf0c31c9f97e5eb4d89a6be_99_0.png)


    After the assignment b = a, the variable b has a copy of the value from a, and
    either variable can be modified independently.


    When an object is copied from one variable into another, it is again a simple
    value that is copied; but that value is a reference to an object, the object itself
    (see Figure 4.2).


    ![](img/fb8b9ea4edf0c31c9f97e5eb4d89a6be_99_1.png)


    After the assignment obj2 = obj1, both variables refer to the same object. Either
    reference can be used to “talk to” and change the object, and the data in the
    object will be the same regardless of which reference is used to view it.'
