    # # Unit Testing


    # ## 7.1 PHILOSOPHY


    Testing is an essential part of programming. You can do *ad hoc* testing (testing
    whatever occurs to you at the moment), or you can build a *test suite* (a thorough
    set of tests that can be run at any time).


    People naturally want to minimize effort, and building a test suite is additional
    effort. However, experiments repeatedly show that writing test suites takes less
    time and effort than debugging without a test suite, and results in far more reliable
    code. In addition, the existence of a test suite makes it *much easier* to maintain
    and modify the program, particularly after a few months have passed.


    Besides, debugging is ever less fun than writing tests.


    Deadlines are often used as an excuse for not doing thorough testing—“There isn''t
    time!” This is a flawed argument, since thorough testing *reduces* total programming
    time.


    That said, programmers are human, and they will only do adequate testing if (1)
    the tests are easy to write, and even more importantly, (2) the tests are effortless
    to run. A good *test framework* such as JUnit makes both of these things possible.'
  - '[PAGE 168]


    It is very difficult to write tests for methods that were not written testing
    in mind. To be testable:


    +   - Methods should do only one thing, not a large variety of things. The simpler
    the method, the simpler the test.


    +   - Methods should be as self-contained as possible. They should not depend
    on context any more than absolutely necessary. They should not require other methods
    to execute before one. Tests that can run in isolation are much easier to write
    than those that require elaborate setup.


    +   - Methods should absolutely not require any interaction with the programmer.
    Tests that require more than a single button click to run will be much less often,
    if at all.


    +   - Methods should not do any input/output. There are advanced techniques, not
    covered here, for testing input/output methods without demanding programmer interaction.


    Fortunately, rules for writing testable methods are also rules for a good programming
    style.


    It is good practice to write the tests for a method concurrently with writing
    the method. Some even advocate the tests before writing the method, as this helps
    clarify what the method is supposed to do.


    After a method has been written and tested, additional errors may be discovered.
    There is a specific technique for dealing with this situation. First, write a
    test that demonstrates the error; then fix it. This is useful because, for whatever
    reason, some errors have a habit of recurring.


    # 7.2 WHAT TO TEST


    Testing should cover both the common cases and the edge cases, where things are
    most likely to go wrong.


    For example, if you have a method isPrime to decide whether a number is a prime,
    you might decide to test whether isPrime(28) is false and'
  - '[PAGE 169]


    # Unit Testing ■ 149


    isPrime(29) is true. Having done that, it is probably redundant and even a bit
    silly to also test whether isPrime(30) is false and isPrime(31) is true.


    You might, however, want to check that isPrime(15) is false, in case the method
    somehow decides that all odd numbers are prime. It is also worth checking that
    isPrime(2) is true, in the case the method decides that all even numbers are non-prime.
    In fact, 2 is an edge case, since it is the only prime number.


    Another edge case is isPrime(1), which should be false. Although it passes the
    general test (not divisible by any number other than itself and 1), mathematicians
    define 1 not as a prime number.


    Other edge cases are zero and negative numbers. Primality is not defined for these
    numbers, the programmer must decide what to do in these cases (and preferably,
    test that is what actually happens). If the decision is “that can’t happen anyway”,
    the appropriate thing to do is to put the statement assert n > 0; at the beginning
    of the isPrime method, and test that an inappropriate call throws an exception.


    > Reminder: assert statements (see section 3.3.2.1) are “free” in that they are
    treated just like comments, and do not add to code size or execution time, unless
    they are explicitly enabled in the run time configuration setting.


    # 7.3 JUnit


    JUnit is a well-established test framework. To use it, here’s the general approach:


    +   1. Define a class to hold the tests, and import the test framework.

    2. Include any number of test methods, annotated (preceded) by @Test. Each test
    will call one or more assertion methods.

    3. If any of the manipulate global variables, you should have a method annotated
    with @BeforeEach to initialize them.'
  - '[PAGE 170]


    # Quick Java


    +   4. Execute the class. The class does not define a main method; that is in
    the JUnit framework. When run, JUnit will produce a report that either (1) says
    all tests passed or (2) tells which tests failed.


    If you have written the tests properly, they will not ask you for input or otherwise
    interrupt the running of the tests.


    # 7.4 JUnit 5 Assertions


    A unit test is a test of a single class. It is an ordinary class that imports
    a test framework and annotates some of its methods to mark them for special processing.
    First, do the following:


    ```

    import org.junit.jupiter.api.*;

    import static org.junit.jupiter.api.Assertions.*;nimport static org.junit.jupiter.api.Assumptions;

    ```


    The first import statement makes the annotations available, the second makes the
    test methods (such as assertEquals) available, and the third makes assumptions
    (described later) available.


    Next, write the methods that will be used by JUnit. Each method should be public
    void, should take no parameters, and should have one of the following annotations:


    +   @BeforeAll annotates a static method that will be run only before any tests
    are run. This is used when the tests use expensive resources; for example, it
    might open a database.


    +   @BeforeEach annotates a method that will be run before and after every test.
    It should reset any global variables to a pristine state that the execution of
    one test does not influence the results of some other.


    +   @Test marks a method as a test method. Ideally, each test method tests a single
    method in the class being tested. Sometimes there are tests for the same method,
    testing different kinds of input. Sometimes a test method has to depend on the
    correct functioning of some methods in order to test other methods.'
  - "[PAGE 171]\n\n# Unit Testing ■ 151\n\n+   * @AfterEach annotates a method that\
    \ will run after each test. This is rarely used.\n* @AfterAll marks a static method\
    \ that executes after all tests have been run. Its purpose is to close any resources\
    \ opened by @BeforeAll.\n* @DisplayName(string) can be put before the test class\
    \ or in front of individual tests, to use string in place of the class name or\
    \ test method when reporting results.\n\nThe test methods (those annotated with\
    \ @Test) are ordinary code that contain one or more assertions. The assertions\
    \ available for use in the @Test methods include:\n\n+   * assertEquals(expected,\
    \ actual) compares values of any type. For comparing objects, it uses their equals\
    \ method.\n* assertEquals(expected, actual, delta) compares floating point numbers,\
    \ where delta is the absolute amount by which the two numbers may differ and still\
    \ be considered.\n* assertArrayEquals(array1,array2) compares two arrays. For\
    \ arrays of objects, this does a deep comparison. For arrays of floating objects,\
    \ there may be an additional delta argument.\n* assertTrue(booleanExpression)\
    \ and assertFalse(booleanExpression).\n* assertSame(object1,object2) and assertNotSame(object1,object2)\
    \ are tests of identity, that is, whether object1 and object2 are references to\
    \ the same object.\n* assertNull(object) and assertNotNull(object).\n* assertTimeout(ms,function)\
    \ fails if the function (not method) takes longer than ms milliseconds.\n    *\
    \ Example: assertTimeout(100, ( ) -> slowMethod(x, y));\n    * fail(message) and\
    \ fail(exception).\n\nAll of these tests except fail may take an optional last\
    \ message."
  - '[PAGE 172]


    Note: The fail method (which, yes, causes the test to fail) is useful for writing
    tests that use more complex logic.


    A test method may contain as many assertions as desired. However, if one fails,
    the remaining assertions in that method are not executed, so it is better not
    to have too many. Instead, write additional test methods to test different aspects
    of the method.


    If you have a class containing a number of methods, most good IDEs will write
    a skeletal test class for you, so that you only have to add the assertions.


    A test class may also contain unannotated methods. These are ignored by JUnit
    but may be used by the test methods.


    # 7.5 TESTING EXCEPTIONS


    If a method might throw an exception, you should test whether it does throw exception
    when it should. However, the obvious way of writing the test does not work.


    ```

    assertThrows(exception, methodCall); // wrong!

    ```


    The problem is that the parameters to assertThrows are evaluated before the method
    is called, so if the methodCall throws an exception, assertThrows never gets a
    chance to catch and deal with it.


    There are two ways to solve this problem. The more convenient way, in modern Java,
    is for the second argument to assertThrows to be a function that calls the method.
    Like so:


    ```

    assertThrows(exception, () -> methodCall);

    ```


    This works because the function is passed to assertThrows, which executes the
    function to cause the exception to happen. For example,


    ```

    assertThrows(ArithmeticException.class, () -> divide(0, 0));

    ```'
