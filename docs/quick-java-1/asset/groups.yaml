  - "[PAGE 90]\n\n# 70 ■ Quick Java\n\nNormally, every top-level class goes in a separate\
    \ file, and the name of the file must be the name of the class, with the extension.\
    \ java.\n\nNote: More than one top-level class can be put in a file, but only\
    \ one of them can be public, and that is the one that must be named after. However,\
    \ one class per file is the recommended organization.\n\n# 4.1.1 A Simple Class\n\
    \nWe will begin by looking at a simple example of a class; later sections will\
    \ describe each of the parts of a class in detail.\n\nThe name of the class is\
    \ Password, and each object created from the class will hold one password. The\
    \ method matches will tell us if a password is correct, and the reset method will\
    \ allow us to change it. Without further, here's the class:\n\n```\npublic class\
    \ Password {\n    private String password;\n\n    public Password(String password)\
    \ {\n        this.password = password;\n    }\n    public boolean matches(String\
    \ attempt) {\n        return attempt.equals(password);\n    }\n\n    boolean reset(String\
    \ oldPassword,\n        String newPassword) {\n        if (matches(oldPassword))\
    \ {\n            password = newPassword;\n        }\n        return password.equals(newPassword);\n\
    \    }\n}\n```\n\nThe name of the class is Password, and it is public, so it can\
    \ be seen and used anywhere in the project.\n\nThe class has a field named password,\
