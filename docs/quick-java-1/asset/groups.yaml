  - "[PAGE 113]\n\n# 4.4.2 Overriding Equals\n\nEvery object inherits an equals method\
    \ from Object, but that method actually tests for identity. According to this\
    \ method, two objects are “equal” if and only if they are the same object, occupying\
    \ the same location in memory. This is also what the == comparison operator does\
    \ when applied to objects.\n\n**Important:** For objects, == is always an identity\
    \ test, not an equality test. The equals method is also an identity test, unless\
    \ it has been overridden for that particular class of objects.\n\nContinuing to\
    \ use our Counter class as an example, here is what a typical equals method would\
    \ look like:\n\n```\n@Override\npublic boolean equals(Object obj) {\n    if (obj\
    \ == this) return true;\n    if (!(obj instanceof Counter)) return false;\n  \
    \  Counter that = (Counter)obj;\n    return this.count == that.count;\n}\n```\n\
    \n+   1. First, we say that we are overriding some method, then we give it the\
    \ exact same header as the method we are trying to override. (The parameter obj\
    \ may have a different name, but everything else must be the same).\n2. An extremely\
    \ common error is to specify the wrong type of parameter. We normally want to\
    \ compare this Counter to another Counter, so it makes senses for equals to use\
    \ a Counter parameter. However, this doesn’t work. To override a method that has\
    \ an Object parameter, the parameter must be of type Object. If it isn’t, the\
    \ method may be legal, but it will not override equals.\n3. Next we see if we\
    \ are comparing the Counter object to itself. The keyword this refers to the object\
    \ currently executing the method; that is, if we were testing c1.equals(c2), the\
    \ word this refers to is c1. The == operator tests for identity; it isn’t necessary\
    \ here, but it’s a very fast test for a common situation."
