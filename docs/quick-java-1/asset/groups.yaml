    # 14 Quick Java


    reorganizing code, and any number of other services. I have had students tell
    me that they succeeded in my course only because their IDE wrote their programs
    for them.


    The objection to a professional IDE is that it is a big, complicated program that''s
    hard to learn (comparable to Microsoft Word, for example). This is undeniably
    true. My recommendation is to get a good, full-featured IDE and use it like a
    text editor that can run your programs. There is no need to learn all its features
    right away.


    The most popular Java IDEs are Eclipse, NetBeans, IntelliJ IDEA, and the Mac-only
    Xcode. All are excellent and have ardent users; all have free versions. All can
    be (and are) used for a number of other languages. Of these, IntelliJ IDEA requires
    no prior knowledge of the interface but simply guides the beginning user at each
    step.


    That said, sometimes an IDE will simply refuse to work. This could be the result
    of an upgrade, so that file versions are incompatible, or some similar problem.
    (I have had this problem a lot with Eclipse.) Reinstalling the IDE may help. Exploring
    all the possible settings may help. And, of course, you can switch to a different
    IDE.


    There are simpler IDEs, often written specifically for students, such as BlueJ,
    JCreator, and DrJava. The advantage of a simpler IDE is that it is less intimidating.
    The disadvantage is that it does not help the programmer.


    It has been said that the hardest program to write in any language is “Hello World";
    all subsequent programs are just elaborations of this one. In the same way, once
    you successfully use a professional IDE to write and execute a program, all the
    rest is just elaboration.


