    # CHAPTER 2


    # Preliminaries


    IT CAN BE USEFUL TO THINK OF JAVA as consisting of an "inner language" and an
    "outer language." The inner language consists of data, methods, and statements,
    and is all that is needed for a small program with only a single class. The equally
    complex outer language consists of all the various kinds of classes and interfaces
    used to organize a large program.


    After some preliminaries, the next chapter describes the inner language of Java
    (which is very like C or C++), and the following chapter describes the outer language.


    # 2.1 IDEs


    **Section summary:** The use of an IDE is strongly recommended. If you don''t
    already use one, IntelliJ IDEA is one of the most beginner-friendly.


    You can create and run complex Java programs with nothing more than a text editor
    and the command line, but doing this does the hard way.


    A professional **Integrated Development Environment (IDE)** is immeasurably helpful
    in developing programs. A very basic IDE integrates a text editor, a compiler,
    a debugger, and a code executor. A professional-level IDE will also suggest applicable
    methods, provide instant documentation lookup, offer corrections for mistakes,
    make automatic version backups, assist in


