    \ 语句\n\n最常用的语句是赋值语句、块（或复合语句）、`if` 语句、`while` 循环和 `for` 循环。除块之外的所有语句都必须以分号结束。可以使用\
    \ `println` 方法产生输出。\n\n块通过大括号 `{}` 将任意数量的语句组合成单一的复合语句。\n\n赋值语句给变量赋值。如果该变量之前没有声明过，则必须指定类型；变量可以从声明处一直到最内层闭合块的结束。\n\
    \n`if` 语句测试一个布尔条件，如果条件为真，则执行语句。它可能有一个 `else` 部分，如果条件为假，则将执行不同的语句。由于每个部分只控制一个语句，因此该语句通常是一个块。\n\
    \n```\nif (2 + 2 == 2) {\n    System.out.println(\"All is well.\");\n} else {\n\
    \    System.out.println(\"What??\");\n}\n```\n\n`while` 循环评估一个布尔条件。如果条件为真，它执行一个语句（通常是一个块），然后返回测试。当测试评估为假时，退出。\n\
    \n```\nint count = 10;\nwhile (count > 0) {\nSystem.out.println(count);\ncount\
    \ = count - 1;\n}\nSystem.out.println(\"Blast off!\");\n```\n\n循环设置一个初始值，测试一个布尔条件，如果条件为真，则执行语句，执行更新，并返回测试。当测试返回假时，退出。\n\
    \n```\nfor (int i = 10; i > 0; i = i - 1) {\nSystem.out.println(i);\n}\nSystem.out.println(\"\
    Blast off!\");\n```\n\n> 注意：上述语句需要一个布尔条件作为测试。你不能使用数值值作为测试。\n\nJava 没有“打印”语句，但可以使用\
    \ `println` 方法像语句一样使用。`System.out.println(arg)` 接收单个参数并将其发送到标准输出，随后是一个换行符 `\\\
    n`。`System.out.print(arg)` 执行相同的操作，但没有换行。\n\n# 1.7 程序执行\n\n一个良好的 IDE（集成开发环境）的价值不可言喻。NetBeans、Eclipse、IntelliJ\
    \ IDEA 和 Xcode（仅限 Mac）都是优秀的选择。其中，IntelliJ IDEA 对初学者来说可能是最容易的。任何 IDE 都会提供运行你程序的简单方法。\n\
    \n程序将从公共类的 `main` 方法开始执行。`main` 方法应该具有此完全相同的头部：\n\n```\npublic static void main(String[]\
    \ args) {\n```\n\n如果你没有使用 IDE，可以使用任何纯文本编辑器（而不是文字处理器）来创建程序。每个类应该位于一个单独的文件，文件名应该是带有\
    \ `.java` 扩展的类名。\n\n如果你使用的是 Java 11 或更高版本，可以通过导航到包含 Java 文件的文件夹并打开命令行/终端窗口来运行程序。在该窗口中，输入\
    \ `java fileName`。文件应该运行并产生输出。\n\n如果上述方法不起作用，你可能需要先编译文件然后运行它。要做到这一点，请执行这一对命令：\n\
    \n```\njavac ClassName.java\njava ClassName.class\n```\n\n如果一个程序包含多个文件，任何被另一个文件使用的文件必须在使用它的文件编译之前进行编译。\n\
    \n# 1.8 HELLO WORLD\n\n为了尽快开始编程，你可以使用以下“Hello World”程序作为框架。你不需要完全理解它就可以开始。\n\n\
    ```\npublic class MyClass {\n  String hello = \"Hello World\";\n  public static\
    \ void main(String[] args) {\n    new MyClass().doSomething();\n  }\n\n  void\
    \ doSomething() {\n    System.out.println(hello);\n  }\n}\n```\n\n如果保存为名为 `MyClass.java`\
    \ 的文件，可以按照上一节中的指令执行此程序。\n\n这里有两个方法：`main` 和 `doSomething`。程序从 `main` 方法开始执行。`main`\
    \ 方法处于“静态上下文”中，这意味着它不能直接使用任何非静态的方法或变量。为了跳出静态上下文，`main` 创建了一个 `MyClass` 类型的新对象并立即调用它的\
    \ `doSomething` 方法；这里就是你放置代码的地方。在此之后，在你有需要它之前，可以忘记 `static` 这个词了。\n\n`void doSomething()`\
    \ 定义了一个名为 `doSomething` 的方法。如空括号所示，它不接受参数；如 `void` 所示，它没有返回值。方法体封装在大括号 `{}` 中，由一个对\
    \ `System.out.println` 方法的调用组成，参数为 `hello`。`println` 将 \"Hello World\" 打印到标准输出，这（取决于你如何运行\
    \ Java）应该出现在你屏幕的某个地方。\n\n语句以分号结束。上述有两个语句，一个调用 `doSomething`，另一个打印 \"Hello World\"\
    。\n\n`MyClass` 和 `doSomething` 的名称（但不是 `main`）可以替换为你选择的名称。按照习惯，类名始终大写字母开头，方法名小写字母开头。\n\
    \n以 `HelloWorld` 为起点，你可以添加方法和代码来创建一个有用的程序。\n\n![](img/fb8b9ea4edf0c31c9f97e5eb4d89a6be_32_0.png)\n\
    \n# 第 2 章\n\n# 准备工作\n\n将 Java 认为由一种“内部语言”和一种“外部语言”组成是有很有用的。内部语言由数据、方法和语句组成，对于一个只有一个类的小程序来说，这些足够了。同样复杂的外部语言由用于组织大型程序的所有各种类和接口组成。\n\
    \n在进行一些准备工作后，下一章将描述 Java 的内部语言（非常像 C 或 C++），接下来的章节将描述外部语言。\n\n# 2.1 IDE\n\n**章节摘要：**\
    \ 强烈建议使用 IDE。如果你还没有使用，IntelliJ IDEA 是最对初学者友好的工具之一。你只需要文本编辑器和命令行就可以创建并运行程序，但那样做是比较费劲的方法。\n\
    \n集成开发环境（IDE）在开发程序方面具有巨大的帮助。一个非常基础的 IDE 集成了文本编辑器、编译器、调试器和代码执行器。专业级 IDE 还会建议适用的方法、提供即时文档查询、纠正错误、自动备份、协助重组代码以及许多其他服务。我有过学生告诉我，他们是因为\
    \ IDE 为他们写了程序才通过我的课程。\n\n流行的 Java IDE 有 Eclipse、NetBeans、IntelliJ IDEA 和仅限 Mac\
    \ 的 Xcode。它们都是优秀的且拥有忠实的用户；它们都有免费版本。它们都可以（并已）用于多种语言。在这些工具中，IntelliJ IDEA 不需要预先知识，只需每一步引导初学者。\n\
    \n尽管如此，有时 IDE 会直接拒绝工作。这可能是升级导致的文件版本不兼容或其他类似问题引起的。（我在 Eclipse 上遇到过很多问题。）重装 IDE\
    \ 可能有效。探索所有可能的设置也可能有效。当然，你可以切换到不同的 IDE。\n\n还有一些简单的 IDE，通常专门为学生编写，例如 BlueJ、JCreator\
    \ 和 DrJava。简单 IDE 的优点是不令人望而畏畏。缺点是它们不帮助程序员。\n\n有人说，任何语言中最难编写的程序都是“Hello World”；之后所有的程序都是这一个程序的扩展。同样，一旦你成功使用专业\
    \ IDE 编写并运行了程序，剩下的都是扩展。\n\n# 2.2 注释和标签\n\nJava 中有三种注释。\n\n- 以 `//` 开头并持续到行尾的注释。\n\
    - 当放在代码行末尾时，它们对该行代码说明了什么。\n\n"
