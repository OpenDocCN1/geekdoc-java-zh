    # Threads and Animation


    USEFUL CLASSES THAT HAVE BEEN DESCRIBED in varying levels of detail StringBuilder,
    Scanner, Stack, and HashMap. This section describes some additional classes and
    methods that are important for writing concurrent programs and for doing animation.


    Every one of these classes is far richer than this section would suggest. Only
    the basics are described here.


    # 10.1 THREADS


    A thread is the flow of control in a program. Modern operating systems are multiprocessing:
    they do many things at the same time. This might be accomplished by assigning
    different threads to different cores, or by interrupting one thread to turn over
    execution to another. Even a simple Java program uses multiple threads and hides
    the details you don''t have to think about them. You can, however, directly create
    and manipulate threads.


    A Thread is an object representing a flow of control. When you step through a
    program, you are following a thread. Threads are just like any other object; you
    can create them and send messages to them. Every program uses threads.


    There are two ways to create another Thread and start it running:'
  - '[PAGE 210]


    # 190 ■ Quick Java


    +   * Write a class that extends Thread and overrides the public void run() method.

    * Create an object of this class.

    * Send the object the (inherited) start() message.

    * Write a class that implements Runnable and overrides the public void run() method.

    * Create an object obj of this class.

    * Create a new Thread(obj).

    * Send the Thread start() message.


    A Thread can be in one of four states (see Figure 10.1):


    +   * Ready: all set to run

    * Running: actually doing something

    * Waiting, or blocked: needs something

    * Dead: will never do anything again


    ![](img/fb8b9ea4edf0c31c9f97e5eb4d89a6be_210_0.png)


    FIGURE 10.1 States of a thread.


    Execution is controlled by the Java scheduler, but you can request it to do some
    things. A call to sleep() is one such request. Another is that you request the
    current Thread to pause for a given number of milliseconds.


    Thread.sleep(milliseconds);


    It is possible for this call to raise an InterruptedException.


