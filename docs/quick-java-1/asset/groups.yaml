    # The “Inner Language” of Java  — 59


    I feel the formal terminology awkward, so I like to say “talk” to an object. We
    “tell” it something, or “ask” it something. In the above, we said, “Hey, language,
    what is your length?” Similarly, language.charAt(0) says, “Hey, language, what
    is your first character?” and language.toUpperCase() says, “Hey, language, give
    me all caps version of yourself.”


    Unlike many objects, strings are immutable—they cannot be altered. Methods like
    toUpperCase never change the original string; they always return a new String
    object.


    # 3.4.1.2 StringBuilder Objects


    A more typical object is the StringBuilder. Strings are immutable, so if you make
    thousands of modifications to a string, you are actually creating thousands of
    new strings. This can be expensive. It is more efficient to use a mutable (modifiable)
    StringBuilder object.


    To create a new StringBuilder object (or any other kind of object), use the keyword
    new, the name of the class, and any required arguments. Like this:


    ```

    StringBuilder builder = new StringBuilder("Java");

    ```


    StringBuilder has lots of methods for changing the string data, all of which use
    the standard dot notation. For example, to add text to the end, you can say


    ```

    builder.append("Script");

    ```


    Here are a few of the methods you can use:


    +   * **charAt(index)** — returns the char at the specified **index**.

    * **insert(index, string)** — puts the *string* into the StringBuilder starting
    at the **index**.

    * **replace(start, end, string)** — replaces the characters from **start** to
    **end-1** with **string**.

    * **delete(start, end)** — deletes the characters from **start** up to, not including,
    **end**.'
