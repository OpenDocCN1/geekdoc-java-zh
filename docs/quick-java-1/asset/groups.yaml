  mdcn: "\n\n# 192 ■ 快速 Java\n\n**注意 2**: 在对象上进行同步（Synchronizing）*仅*防止在*相同*对象上进行同步的其他线程运行。未同步的代码或在其他对象上同步的代码不受影响。\n\
    \n你可以对方法进行同步：\n\n```\nsynchronized void methodName(arguments) { code }\n```\n\n\
