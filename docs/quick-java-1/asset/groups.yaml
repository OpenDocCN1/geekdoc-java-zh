  mdcn: "\nJava 的“外部语言” ■ 73\n\n接口的目的是为相似类提供一组公共方法。例如，`StringBuilder`（见 3.4.1.2 节）也实现了\
    \ `CharSequence`，因此它也拥有 `charAt(index)`、`length()` 和 `isEmpty()` 方法，以及许多 `String`\
    \ 类不具备的其他方法。\n\n接口的语法将在 5.3.2 节中描述。\n\n## 4.1.4 字段\n\n类通常包含字段（更准确地说，是字段声明）。这是存储数据的地方。正是这些字段中的值使得一个对象与相同类型的另一个对象不同。\n\
    \n字段声明的形式如下：\n\n```\nstatic access type fieldName = expression;\n```\n\n如果存在 `static`\
    \ 关键字，则定义的变量只有一个副本，并由该类的所有实例共享。否则，从该类创建的每个对象都拥有 `fieldName` 变量的副本。在前面提到的 `Password`\
    \ 类中，每个该类型的对象都有自己的 `password` 字段。\n\n> 术语：对象是其类的实例，因此属于对象的字段也称为实例变量。静态变量属于类本身，也称为类变量。\n\
