    # 5.3.3 Abstract Classes\n\nSuppose we want to write a method clear() to remove\
    \ everything from a Box object. We might write:\n\n```\npublic void clear() {\n\
    \    T thing;\n    do {\n        thing = grab();\n    } while (thing != null);\n\
    }\n```\n\nThis could go in the Box class, but what if we want to use it for other\
    \ Storage types? If we put it in the Box class, then it only works for Box objects.\
    \ We certainly don't want to put identical copies of this method in all the classes\
    \ that can use it.\n\nOne solution is to change the Storage interface into an\
    \ abstract class.\n\n```\nabstract class Storage<T> {\n    public abstract void\
    \ add(T thing); // no body\n    public abstract T grab(); // no body\n    public\
    \ void clear() {\n        T thing;\n        do {\n            thing = grab();\n\
    \        } while (thing != null);\n    }\n}\n```\n\nAn abstract class is one that\
    \ may contain abstract methods, each of which must be marked with the keyword\
    \ abstract. An abstract class is an intermediate between a class (in which all\
    \ methods are fully defined) and an interface (in which no methods are fully defined).\n\
    \nWith this change the Box, Shelf, and Cabinet classes no longer implement the\
    \ interface Storage, they extend the abstract class Storage.\n\n```\nclass Box<T>\
    \ extends Storage<T> { ... }\nclass Shelf<T> extends Storage<T> { ... }\nclass\
    \ Cabinet<T> extends Storage<T> { ... }\n```\n\nBecause abstract classes are not\
    \ complete, they cannot be used to create objects. However, they can be used as\
    \ a type, just like an interface. This allows us to write methods that take the\
    \ abstract class as a parameter, which will work for any subclass that extends\
    \ it.\n\n# 5.3.4 Final and Sealed Classes\n\nAs noted earlier, a class can be\
    \ final to prevent it from being subclassed. This is useful when you want to ensure\
    \ that the behavior of a class cannot be altered by subclasses.\n\nJava 17 also\
    \ introduced sealed classes, which allow you to restrict which classes can extend\
    \ a class.\n\n```java\nsealed class Shape permits Circle, Square, Triangle {}\n\
    final class Circle extends Shape { }\nclass Square extends Shape { }\nclass Triangle\
    \ extends Shape { }\n```\n\nThis provides a more granular control over the inheritance\
    \ hierarchy than just the final keyword.\n"
  mdcn: "\n\n在这个示例中，List 是一个接口，你无法创建 List 类型的对象；而 ArrayList 实现了 List，因此你可以创建该类型的对象。现在，你可以使用\
    \ List 接口中指定的方法（add、remove、contains 等）来操作 `names` 变量。如果你以后决定 `names` 应该是一个 Stack（一个也实现了\
    \ List 的类），你可以将声明更改为：\n\n```\nList<String> names = new Stack<String>();\n```\n\
    \n代码中不需要进行任何其他更改（可能仅取决于你需要导入的内容）。\n\n**注意：** 接口还可能包含非抽象的静态方法和默认方法。默认方法可以直接使用，也可以在实现类中被重写。这些特性在本书中没有介绍。\n\
    \n在 5.3.1 节中，我们定义了一个带有 `add` 和 `grab` 方法的 `Box` 类。我们之后可能会决定编写一个无关的 `Shelf` 类，它也有这两个方法，然后又一个带有\
    \ `add` 和 `grab` 方法的 `Cabinet` 类。这些类以完全不同的方式存储其内容，可能存储在列表或二维数组中。这些类可能具有不同的数据以及额外的、独特的方法。\n\
    \n我们可以编写一个泛型接口（我们称为 `Storage`），来指定这些类必须提供的方法。\n\n```\ninterface Storage<T> {\n\
    \    public void add(T thing); // 没有主体\n    public T grab(); // 没有主体\n}\n```\n\
    \n现在，这些类都可以实现这个新接口，并拥有它们自己的 `add` 和 `grab` 方法版本。\n\n```\nclass Box<T> implements\
    \ Storage<T> { ... }\nclass Shelf<T> implements Storage<T> { ... }\nclass Cabinet<T>\
    \ implements Storage<T> { ... }\n```\n\n# 126 快速 Java\n\n这使我们能够编写接受 `Storage`\
    \ 参数作为参数并使用该参数的 `add` 和 `grab` 方法的方法。接口名称 `Storage` 的用法就像它是父类的名称一样。\n\n```\nvoid\
    \ method rearrange(Storage<T> storage) {\n    // 使用 add 和 grab 的代码\n}\n```\n\n\
    由于 `rearrange` 适用于任何实现 `Storage` 的类，我们不需要为 `Box`、`Shelf` 和 `Cabinet` 这三个类分别编写不同的\
    \ `rearrange` 方法。\n\n定义接口的语法为：\n\n```\naccessType interface Name { ... }\n```\n\
    \n其中 `accessType` 必须是 `public` 或不指定（即“package”）。\n\n接口可以包含常量（`final` 变量）。在接口内部声明的所有变量自动都是\
    \ `public`、`static` 且 `final`，并且必须赋值。可以使用 `public`、`static` 和 `final` 关键字，但它是多余的。同样，接口中的方法也可以（冗余地）用\
    \ `abstract` 修饰符声明。\n\n在某些接口中（例如 `Collection` 接口），你会发现列为“可选”的方法。这并不意味着实现类可以省略这些方法。相反，这只是建议提供的方法可以直接抛出\
    \ `UnsupportedOperationException`。\n\n# 5.3.3 抽象类\n\n假设我们想写一个 `clear()` 方法来移除\
    \ `Box` 对象中的所有内容。我们可能会写：\n\n```\npublic void clear() {\n    T thing;\n    do {\n\
    \        thing = grab();\n    } while (thing != null);\n}\n```\n\n这可以放在 `Box`\
    \ 类中，但如果我们想对其他 `Storage` 类型使用它呢？如果我们把它放在 `Box` 类中，那么它只对 `Box` 对象有效。我们显然不想在所有可以使用它的类中都放置该方法的相同副本。\n\
    \n一种解决方案是将 `Storage` 接口更改为抽象类。\n\n```\nabstract class Storage<T> {\n    public\
    \ abstract void add(T thing); // 没有主体\n    public abstract T grab(); // 没有主体\n\
    \    public void clear() {\n        T thing;\n        do {\n            thing\
    \ = grab();\n        } while (thing != null);\n    }\n}\n```\n\n抽象类是一个可以包含抽象方法的类，每个抽象方法都必须标记有\
    \ `abstract` 关键字。抽象类是类（所有方法都完全定义）和接口（没有方法被完全定义）之间的中间产物。\n\n通过这一更改，`Box`、`Shelf`\
    \ 和 `Cabinet` 类不再实现接口 `Storage`，而是继承自抽象类 `Storage`。\n\n```\nclass Box<T> extends\
    \ Storage<T> { ... }\nclass Shelf<T> extends Storage<T> { ... }\nclass Cabinet<T>\
    \ extends Storage<T> { ... }\n```\n\n由于抽象类是不完整的，因此不能被用来创建对象。但是，它们可以像接口一样被当作类型。这允许我们编写接受抽象类作为参数的方法，该方法适用于任何扩展了它的子类。\n\
    \n# 5.3.4 Final 类和密封类 (Sealed Classes)\n\n如之前所述，类可以被声明为 `final` 以防止它被子类化。当你想要确保一个类的行为不会被子类更改时这非常有用。\n\
    \nJava 17 还引入了密封类（sealed classes），它们允许你限制哪些类可以扩展某个类。\n\n```java\nsealed class\
    \ Shape permits Circle, Square, Triangle {}\nfinal class Circle extends Shape\
    \ { }\nclass Square extends Shape { }\nclass Triangle extends Shape { }\n```\n\
    \n相比仅仅使用 `final` 关键字，这对继承层次结构提供了更细粒度的控制。\n\n"
