    or:


    ```

    baseTypeName array[];

    ```


    For example,


    ```

    int[] scores;

    ```


    This declares but does not define the scores variable. That is, its type has been
    assigned, but no value of that type has been assigned to it. An array variable
    that has been declared but defined will have the special value null, and attempting
    to use it will result in an error.


    To declare and define scores, you can say:


    ```

    int[] scores = new int[35];

    ```


    Once an array is defined, you cannot change its size. However, the size of an
    array is not part of its type, so int array of any size can be assigned to scores.
    Later, you might assign a different array, of a different size, to scores. You
    can find the size of an array by asking it for its length variable, array.length.


    Arrays created as shown above will have their elements set to 0, false, or null,
    for numeric, boolean, or object arrays, respectively. Alternatively, an array
    can be created with specific values, using the syntax new type[] {value, ...},
    for example,


    ```

    int[] ary = new int[] {3, 1, 4, 1, 6};

    ```


    or with the slightly simpler


    ```

    int[] ary2 = {3, 1, 4, 1, 6};

    ```


    The values in an array can themselves be arrays. There is a special syntax for
    this, as as in the following examples:


    ```

    double elevation[][][]; // declaration

