    # 122 ■ Quick Java


    The decrement operator, --, subtracts one from a variable, and can be used as
    a prefix or postfix operator.


    Used as a standalone statement, or as the increment (or decrement) part of a for
    loop, the prefix and postfix versions do the same thing. They behave differently
    when used as part of an expression.


    The prefix versions add or subtract one from the variable *before* using it in
    an expression. The postfix versions add or subtract one to the variable *after*
    using it in an expression. This can get very confusing; the statement


    ```

    x = x++;

    ```


    leaves x unchanged. Don’t use these operators in an expression without good reason.


    # 5.3 THE OUTER LANGUAGE


    In the earliest versions of Java, there was just one kind of class, the “top level”
