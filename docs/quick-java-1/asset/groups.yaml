    \ were not even present in the original version of Java; they are later additions.\n\
    \n## 5.1 INFORMATION HIDING\n\nInformation hiding—providing each section of code\
    \ access to only the information it needs to know—is important in programming.\n\
    \nInformation is not hidden for any nefarious reason; it is done to limit the\
    \ amount of information a human has to deal with. Think of driving a car: It would\
    \ be much more difficult if you had to pay attention to the details of timing,\
    \ gear ratios, suspension, and so on. Instead, you are given easy access to only\
    \ the information you need to drive.\n\nInformation hiding also reduces dependencies\
    \ among code. If the internal structure of an object is not available, other classes\
    \ cannot have code that depends on that structure.\n\nIn the same way, each class\
    \ and each method should provide services to the code that they use, while hiding\
    \ the details of its operation.\n\n### 5.1.1 Reasons for Privacy\n\nFields in\
    \ an object have all package access by default; I consider this to be a design\
    \ flaw in Java. Fields should be private by default. Since they are not, the programmer\
    \ should mark every field private unless there is a reason to make it public.\n\
    \nHere are five reasons for this statement:\n\n- It is the responsibility of each\
    \ class to ensure the validity (consistency) of its objects, and it does not have\
    \ full control if its variables are not private.\n- If a private variable in a\
    \ class gets an erroneous value, the error must have been caused by something\
    \ in the class, not something outside the class. This simplifies debugging.\n\
    - If all the fields of an object are private, all manipulation of an object is\
    \ centralized in the methods of that object.\n- If all the fields of an object\
    \ are private, the internal representation of that object can be changed without\
    \ affecting any other classes. For example, the representation of points on a\
    \ plane might be changed from rectangular coordinates to polar coordinates. This\
    \ is not possible if other objects are already accessing the object's fields.\n\
    - Making the fields private is a form of information hiding. It limits but also\
    \ simplifies what can be done to the other classes.\n\nFor example, consider a\
    \ class Person with an instance weight. Presumably, weight should never be negative.\
    \ If an error occurs that causes it to become negative, and the variable is private,\
    \ then we know the error must have occurred within the class Person, and nowhere\
    \ else. But if weight is not private, the error could be anywhere (in, say, a\
    \ Product that is guaranteed to help a person lose ten pounds a week).\n\n###\
    \ 5.1.2 Getters and Setters\n\nFor access to private data, getter and setter methods\
    \ are often employed. These have the standardized form\n\naccess type getName()\
    \ and access void setName(arg)\n\nThe getter and setter methods for a weight variable\
    \ might look like this:\n\n```java\npublic int getWeight() {\n    return weight;\n\
    }\n```\n\n```java\npublic void setWeight(int weight) {\n    throws IllegalArgumentException\n\
    \    if (weight < 0) {\n        throw new IllegalArgumentException();\n    }\n\
    \    this.weight = weight;\n}\n```\n\nOften these methods do nothing more than\
    \ get or set the value with the given Name, with the expectation that they may\
    \ be extended later.\n\nThe use of getters and setters does incur a slight loss\
    \ in performance. However, they give you the freedom to revise and update the\
    \ structure of your objects without having to worry about what other classes may\
    \ be accessing the fields of those objects. It also gives you a lot more flexibility.\
    \ For example, your object could lie about its weight.\n\n```java\npublic double\
    \ getPounds() {\n    return kilograms / 2;\n}\n```\n\nWhile this may seem like\
    \ a lot of typing for minor gains in safety, your IDE will create getters and\
    \ setters for you.\n\n### 5.1.3 Private Constructors\n\nIf you call a constructor,\
    \ you will get an object of that. However, there may be circumstances where you\
    \ do not want. You may have a class that contains only static methods and variables.\
    \ Another situation is when you want only one unique object to be created. In\
    \ that case, a private constructor may be a good solution.\n\n```java\npublic\
    \ class OneScanner {\n    static Scanner scanner = null;\n\n    private OneScanner()\
    \ {} // constructor\n\n    static Scanner instanceOf() {\n        if (scanner\
    \ == null) {\n            scanner = new Scanner(System.in);\n        }\n     \
    \   return scanner;\n    }\n\n    void close() {\n        scanner.close();\n \
    \       scanner = null;\n    }\n}\n```\n\n# 100 Quick\n\nThe same approach can\
    \ be used if you want to check the parameters used before actually constructing\
    \ an object.\n\n## 5.2 THE INNER LANGUAGE\n\n### 5.2.1 General\n\n#### 5.2.1.1\
    \ Ordering\n\nWithin a class, variables and methods may be declared in any order,\
    \ but the following ordering is commonly used:\n\n- static variables\n- instance\
    \ variables\n- static methods\n- instance methods\n\nWithin a block, variables\
