    \n在调用方法时也会发生相同的情况。如果将原始值作为参数传递，方法将获得该值的拷贝；如果将对象作为参数传递，方法获得的则是该引用的拷贝。\n\n通常没有必要对对象进行拷贝，而且没有内置的简单方法来实现。如果必须进行拷贝，可能最好的方法是在类定义中添加一个拷贝构造函数（copy\
    \ constructor）。拷贝构造函数是一个接收与参数类型相同的对象作为构造函数，并将其所有数据值拷贝到新对象中。这必须小心进行，因为被复制对象的某些字段本身可能指向其他对象。\n\
    \n### 4.1.9 构造函数 II\n\n当构造一个对象时，它实际上是分层构造的，Object 是每个对象的基层。\n\n如果你有一个 Customer\
    \ 类，该类继承自 Person，而 Person 继承 Object，那么当你创建一个新的 Customer 对象时，会发生以下情况：\n\n- Customer\
    \ 的构造函数调用 Person 的构造函数。\n- Person 的构造函数调用 Object 的构造函数。\n- Object 的构造函数创建并返回一个基础对象。\n\
    - Person 的构造函数添加 Person 对象所需的数据和方法并返回它。\n- Customer 的构造函数添加 Customer 对象所需的数据和方法并返回它。\n\
    \n结果是 Customer 对象继承了 Person 的所有数据和方法，以及 Object 的所有数据和方法。它可以使用这些内容，就像它们直接定义在 Customer\
    \ 类中一样。\n\n任何构造函数中的第一个动作必须是调用其父类的构造函数。你可以写一个显式调用，例如：`super(parameters);` 这样的调用必须是构造函数中的第一行，因为在开始添加内容之前必须先建立基础。\n\
    \n如果你没有显式地调用父类的构造函数，Java 会为你提供一个隐式的（不可见的）调用。如果你能看到它，它看起来像这样：`super();`\n\n**陷阱：**\
    \ 只有且仅当你没有为类编写构造函数时，Java 才会提供一个无参数的隐式构造函数。其他代码可能依赖这个隐式构造函数。如果你之后写了显式构造函数，隐式构造函数将会消失，可能会导致之前运行良好的代码出现错误。\n\
    \n如果 Person 类有一个带参数的显式构造函数，而你将 Customer 写为 Person 的子类，你必须写一个带有适当参数来调用 Person 构造函数。\n\
    \n```java\npublic class Customer extends Person {\n    private double amountOwed\
    \ = 0;\n    private String otherInfo;\n    /** 这里是构造函数 */\n    Customer(String\
    \ name, String address,\n        String otherInfo) {\n        super(name, address);\
    \ // \n        this.otherInfo = otherInfo;\n    }\n}\n```\n\n在这个示例中，Customer 对象拥有实例变量\
    \ name 和 address，因为它们继承自 Person 类。这些变量不应在 Customer 类中再次声明。\n\n你可以为一个类拥有多个构造函数，通过参数的数量/或类型来区分。每个构造函数都可以是相互独立的。通常，这些构造函数中的一个会执行大部分工作，而你可能希望其他构造函数调用它。你可以通过使用\
    \ `this` 关键字而不是 `super` 来实现这一点。\n\n如果在构造函数中将 `this(parameters)` 作为第一个动作，那么另一个构造函数将被调用，而它负责调用父类构造函数。构造函数可以这样进行“链式调用”，只有链中的最后一个构造函数会调用父类构造函数。\n\
    \n### 4.1.10 静态\n\n对象将关于某事的数据以及操作该某事的方法封装在一起。但对象是由类定义的，类可以有它自己的数据和方法。\n\n**术语：**\
    \ 类变量（class variable）是属于类本身的一个变量（字段）。类方法（class method）是不与任何对象关联的方法。这些由 `static`\
    \ 关键字标出。\n\n每个静态变量只有一个拷贝，由该类的所有对象共享。静态变量用于说明关于类的信息，而不是关于任何特定对象。\n\n假设你有一个 Customer\
    \ 类，你想跟踪你有多少个客户；让每个 Customer 对象都拥有自己的（可能不同的）howMany 值是不合理的的。解决方案是在类中添加一个 howMany\
    \ 字段，但将其设为静态。\n\n```java\npublic class Customer {\n    private String name;\n\
    \    private String address;\n    private double amountOwed = 0;\n    private\
    \ static int howMany = 0;\n\n    Customer(String name, String address) {\n   \
    \     this.name = name;\n        this.address = address;\n        howMany += 1;\n\
    \    }\n}\n```\n\n现在，由于 howMany 是类变量，我们不需要特定的对象就可以调用它；我们可以说 `Customer.howMany`。\n\
    \n**注意：** 我们不需要类的对象来使用它的静态字段和方法，但如果我们有一个对象，就可以使用它。也就是说，如果 richGuy 是一个 Customer\
    \ 对象，我们可以说 `richGuy.howMany`，同于 `poorGuy.howMany`。这可能看起来很困惑，因为它是在向特定对象发送消息，从对象的类获取响应。\n\
    \n**静态方法**（static methods，类方法的另一种名称）的工作方式相同；它们附加于类，而不是特定的对象。我们可以直接向类“对话”（发送消息），或者通过与该类的任何对象对话来间接进行。例如：\n\
    \n```java\nstatic int getHowMany() {\n    return howMany;\n}\n...\nint customers;\n\
    // 以下所有行都是等价的\ncustomers = Customer.getHowMany();\ncustomers = richGuy.getHowMany();\n\
    customers = poorGuy.getHowMany();\n```\n\n静态方法不属于任何特定的对象（实例），因此它们不能使用实例变量或实例方法；它们只能使用静态变量和静态方法。然而，如果静态方法可以访问一个对象，它就可以“对话”（向该对象发送消息），并且可以使用点号符号直接访问该对象的任何非私有字段。\n\
    \n那些不依赖于类中的任何内容，但仅仅因为每个方法都必须位于*某处*而存在的方法，也应该是静态的。\n"
