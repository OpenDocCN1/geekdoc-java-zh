    # 5.1.1 Reasons for Privacy


    Fields in an object have all package access by default; I consider this to be
    a design flaw in Java. Fields should be private by default. Since they are not,
    the programmer should mark every field private unless there is a reason to make
    it public.


    Here are five reasons for this statement:


    +   - It is the responsibility of each class to ensure the validity (consistency)
    of its objects, and it does not have full control if its variables are not private.

    - If a private variable in a class gets an erroneous value, the error must have
    been caused by something in the class, not something outside the class. This simplifies
    debugging.

    - If all the fields of an object are private, all manipulation of an object is
    centralized in the methods of that object.

    - If all the fields of an object are private, the internal representation of that
    object can be changed without affecting any other classes. For example, the representation
    of points on a plane might be changed from rectangular coordinates to polar coordinates.
    This is not possible if other objects are already accessing the object''s fields.

    - Making the fields private is a form of information hiding. It limits but also
    simplifies what can be done to the other classes.


    For example, consider a class Person with an instance weight. Presumably, weight
    should never be negative. If an error occurs that causes it to become negative,
    and the variable is private, then we know the error must have occurred within
    the class Person, and nowhere else. But if weight is not private, the error could
    be anywhere (in, say, a Product that is guaranteed to help a person lose ten pounds
    a week).


