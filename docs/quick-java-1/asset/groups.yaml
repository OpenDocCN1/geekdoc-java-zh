    \n```java\nJPanel panel = new JPanel();\npanel.setPreferredSize(new Dimension(300,\
    \ 200));\nJLabel label = new JLabel(\"Type here\");\npanel.add(label);\nadd(panel,\
    \ BorderLayout.CENTER); // to JFrame\n```\n\nTo define a KeyListener and attach\
