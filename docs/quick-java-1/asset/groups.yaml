  - "[PAGE 89]\n\n# The \"Outer Language\" of Java\n\nTHE EARLIER SECTIONS OF THIS\
    \ book focussed on what can be done within a single \"top level\" class. A typical\
    \ Java program consists of multiple top-level classes, and may use abstract classes,\
    \ interfaces, any or all of the four types of inner class, as well as the specialized\
    \ Enum class. While it is not standard terminology, you can think of this structure\
    \ as the \"outer language\" of Java.\n\n# 4.1 CLASS STRUCTURE\n\nA class defines\
    \ a type of object. It tells what data objects of that type contain and what methods\
    \ they have. Here are the most important parts of a class definition:\n\n```\n\
    access class ClassName {\n    fields\n    constructors\n    methods\n}\n```\n\n\
    Every object has a type, and the name of that type is the same as the Class. If\
