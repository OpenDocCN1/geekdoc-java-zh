    # GUIs and Dialogs


    A GRAPHICAL User Interface, or GUI (pronounced “gooey”), provides interaction
    with the user beyond simple text entry and printing. GUIs provide familiar buttons,
    text fields, menu items, and so on, common to almost all user-facing programs.


    # 8.1 A BRIEF HISTORY


    GUIs have been available from the very first Java implementation. The original
    GUI toolkit was the AWT, the Abstract Window Toolkit, which was platform-specific
    and quite primitive.


    Later Swing, a much better, platform-independent toolkit. It was built “on top
    of” AWT, and many of the AWT packages are still needed in Swing applications.


    A third toolkit, JavaFX, was released in 2008. It was originally intended to replace
    Swing. While it is still available as part of the OpenFX project, it has been
    dropped from the standard releases of Java. For this reason, our description of
    GUI programming uses Swing.


    # 8.2 DIALOGS


    A dialog is used to get a simple response from the user. Dialogs can be used without
    having to create a full-fledged GUI. To determine the location of the dialog on
    the screen, a parent component must be specified; if it is null, the dialog will
    be centered on the screen.'
  - "[PAGE 178]\n\nThere are four kinds of JOptionPane dialogs: Confirm, Input, Message,\
    \ and Option. Additional dialog types are provided for choosing a color (import\
    \ java.awt.Color), or for loading a file (various classes from java.io). You can\
    \ also create your own custom dialog.\n\nAll provided dialogs are modal, that\
    \ is, the user must respond to them before anything else can be done in the application.\
    \ Custom dialogs can be modal or nonmetal.\n\n# 8.2.1 Message Dialog\n\nA message\
    \ dialog is a modal dialog with a single OK button.\n\nTo display a JOptionPane\
    \ message dialog, import javax.swing.JOptionPane and to do the following:\n\n\
    ```\nJOptionPane.showMessageDialog(parent,\n  \"This is a message dialog.\");\n\
    ```\n\n# 8.2.2 Confirm Dialog\n\nA confirm dialog is a modal dialog with Cancel,\
    \ No, and Yes buttons. The return result will be an integer equal to one of YES_OPTION,\
    \ NO_OPTION, or CANCEL_OPTION.\n\nTo display a JOptionPane confirm dialog, import\
    \ javax.swing.JOptionPane and to do the following:\n\n```\nint yesNo = JOptionPane.showConfirmDialog(\n\
    \  parent,\n  \"Do you really want to do that?\");\nif (yesNo == JOptionPane.YES_OPTION)\
    \ {\n  System.out.println(\"Action confirmed\");\n}\n```\n\n# 8.2.3 Input Dialog\n\
    \nAn input dialog is a modal dialog that provides a place for the user to enter\
    \ a single line of text and has Cancel and OK buttons."
