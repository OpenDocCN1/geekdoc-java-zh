    \n# Threads and Animation\n\nUSEFUL CLASSES THAT HAVE BEEN DESCRIBED in varying\
    \ levels of detail StringBuilder, Scanner, Stack, and HashMap. This section describes\
    \ some additional classes and methods that are important for writing concurrent\
    \ programs.\n\n10.1 THREADS\n\nA thread is the flow of control. Modern operating\
    \ systems are multiprocessing: they do many things at the same time. Threads are\
    \ just any other object; you can create and manipulate them.\n\nA thread is an\
    \ object representing flow of control. There are two ways to create and start\
    \ Thread:\n\n- Write a class that extends Thread and overrides the void run()\
    \ method.\n- Create an object of this class and send it the start() message.\n\
    - Write a class that implements Runnable and overrides the void run() method.\n\
    - Create an object of this class and send the start() message.\n\nA Thread can\
    \ be in one of four states (see Figure 10.1):\n\n- Ready: all set to run\n- Running:\
    \ actually doing something\n- Waiting, or blocked: needs something\n- Dead: will\
    \ never do again\n\n![](img/fb8b9ea4edf0c31c9f97e5eb4d89a6be_210_0.png)\nFIGURE\
    \ 10.1 States of a thread.\n\nExecution is controlled by the Java scheduler, but\
    \ you can request it to do things. A call to sleep() is one such request. Another\
    \ is that you request the current Thread to pause for a given number of milliseconds.\n\
    \nThread.sleep(milliseconds);\n\nIt is possible for this call to raise an InterruptedException.\n\
    \n```java\ntry {Thread.sleep(1000);}\ncatch (InterruptedException e) { }\n```\n\
    \n# 190 Quick Java\n\nWarning: The very first version of Java allowed one Thread\
    \ to control other Threads with the methods stop, suspend, and resume. This was\
    \ immediately recognized as a Bad Idea, and those methods were immediately deprecated.\
    \ Never use them!\n\nA simple alternative to using deprecated methods is for one\
    \ thread to set a flag that can be read by another thread.\n\n```java\nboolean\
    \ okToRun = true;\nsecondThread.start();\n```\n\n```java\npublic void run() {\n\
    \    while (firstThread.okToRun) {...}\n}\n```\n\n# 10.2 SYNCHRONIZATION\n\nThere\
    \ are many cases when it is desirable to have many processes (threads) running\
    \ in parallel. For example, other work could be done while a slow database access\
    \ or file transfer is in process.\n\nSubtle, irreducible errors can result when\
    \ a value is changed by one thread while being accessed by a different thread,\
    \ or when two threads try to update the same value. To avoid this situation, Java\
    \ introduces the concept of synchronization, which simply means giving one thread\
    \ temporary exclusive access to a value or set of values.\n\nYou can synchronize\
    \ on an object:\n\n```java\nsynchronized (obj) { code }\n```\n\nHere, synchronized\
    \ is being used as a statement. No other code can synchronize on object obj until\
    \ the code finishes.\n\n- Note 1: It often makes sense to synchronize on the object\
    \ you want to access or modify, but this is not a requirement. Any object can\
    \ be used for synchronization, and the code might access or modify completely\
    \ unrelated values.\n"
  mdcn: "\n\n# 184 ■ 快速 Java\n\n...需要做任何操作。对于其他用途，你可能希望为你选择的 Container 添加一个 KeyListener。\n\
