    # Quick Java


    CircleApp does not have an explicit constructor (it has an implicit one, but ignore
    that for now). It does have a main method, which is the starting point for the
    program. For complex reasons, the main method is always defined as public static
    void main(String[] args)—just memorize this for now; understanding will come later.


    The main method then:


    +   - Declares a local variable size as an integer and gives it a value of 10.

    - Declares another local variable c of type Circle and uses the keyword new to
    call the Circle constructor. It gets back a newly created Circle object and assigns
    it to c.

    - As c for its area, and assigns the result to the double (floating point) variable
    area.

    - Prints the result:


    The area of a circle with radius 10 is 314.16


    # 1.3 DATA


    Every data value in Java is either a primitive or an object. There are eight kinds
    of primitives, most of them numeric types. Objects are defined by classes, and
    each class defines a new type of object.


    The four most important types of primitive are: int (integers, or whole numbers),
    double (numbers containing a decimal point), boolean (the values true and false),
    and char (individual characters).


    Two important types of object are strings and arrays. Strings are objects defined
    by the String class, while arrays are defined using a more traditional syntax
    (but they are still objects.)


    An obvious distinction between primitives and objects is that primitives have
    operations: 3 * n, big && round, and so on, while objects have methods. (Exception:
    The + operator can be used to concatenate (“add”) strings.)'
  - '[PAGE 25]


    # A Lightning Tour of Java ■ 5


    **Terminology**: You don’t “call” a method. Instead, you “send a message to an
    object,” where the “message” consists of the method name and its parameters.


    To send a message to an object, use **dot notation** like this: `object.method(parameters)`.
    For example, firstName.charAt(0).


    Literal strings are enclosed in double quotes: "Hello". Character literals are
    written in single quotes: ''a''.


    All variables must be **declared** before use; this specifies their type. They
    can also be **defined**, or given an initial value.


    ```

    int count;              // declaration

    count = 0;             // definition

    int count = 0;         // declaration + definition

    ```


    All values in an array must be of the same type. The type of the array is written
    as the type of the elements, followed by empty brackets. For example, `int[]`
    denotes an array of integers. The length of an array is not part of the declaration;
    it is part of a definition.


    ```

    int[] numbers = new int[100];

    ```


    Arrays are **zero-based**. The first element in the numbers array is numbers [0],
    and the last element is numbers [99]. The length of the array, 100, is given by
    numbers.`length`.


    The values in a newly-declared array will be zero (for numeric arrays), false
    (for boolean arrays), or null (for arrays of objects). Because characters are
    treated as numeric values, the values in an array of char will be the character
    "NULL" whose code is zero.


    # 1.4 OPERATORS


    Java has the usual arithmetic operators: + (add), - (subtract, or unary minus),
    * (multiply), / (divide), and % (remainder, or modulus). The multiplicative operators
    *, /, and % are done before the additive operators + and -. Operations of the
    same precedence are done from left to right.'
