  - "[PAGE 61]\n\n# The “Inner Language” of Java ■ 41\n\nThe braces indicate a block\
    \ of statements. If there is only one statement, the braces may be omitted; however,\
    \ it is good style to always include the braces.\n\nAlso as an example, an array\
    \ can be declared and its contents written out by:\n\n```\nint[] ary = {3, 1,\
    \ 4, 1, 6};\nfor (int i = 0; i < ary.length; i += 1) {\n  System.out.println(ary[i]);\n\
    }\n```\n\nBut less much commonly used, the initialization and the update may each\
    \ consist of two or more assignments. For example,\n\n```\nfor (int i = 1, j =\
    \ 100; i < j; j = 2 * i, j -= 1) {\n  System.out.println(\"i = \" + i + \", j\
    \ = \" \" + j);\n}\n```\n\nTwo additional statement types, break and continue,\
    \ can also control the behavior of loops. These statements, described in sections\
    \ 3.3.1.11 and 3.3.1.12, can be used with statement labels.\n\n# 3.3.1.8 For-each\
    \ Loop\n\nA for-each loop does not involve any explicit testing; it simply goes\
    \ through every element of an array, in order. This is simpler and more convenient\
    \ when the index location of the elements is not needed. The syntax is\n\n```\n\
    (type variable: array) { statements }\n```\n\nAs with a traditional for loop,\
    \ the type must be omitted if the variable has been previously declared. Also,\
    \ as with the traditional for loop, the scope of the variable is the entire for\
    \ statement. For example, every element in a String array names can be printed\
    \ out as follows:\n\n```\nfor (String name: names) {\n  System.out.println(name);\n\
    }\n```"
  - "[PAGE 62]\n\n# 42 Quick Java\n\nThe for-each loop can also be used with iterable\
    \ objects (see section 5.2.3.1).\n\n# 3.3.1.9 Classic switch Statements\n\nJust\
    \ as the if statement provides a choice between two blocks of code, based on a\
    \ boolean value, the switch statement provides a choice between several blocks\
    \ of code, based on an integer, character, string, or Enum value.\n\n> Note: This\
    \ section describes the “traditional” switch statement, available in all versions\
    \ of Java. For the newer (and better) version available in Java 14 and beyond,\
    \ see section 3.3.2.3.\n\nThe syntax is fairly complex:\n\n```\nswitch (expression)\
    \ {\n  case constant1:\n    statements1;\n    break;\n  case constant2:\n    statements2;\n\
    \    break;\n  ...\n  case constantN:\n    statementsN;\n    break;\n  default:\n\
    \    statementsDef;\n}\n```\n\nOperation is as follows. The expression is evaluated,\
    \ then compared to each case constant in order. When a constant is found to be\
    \ equal to the expression, execution begins with the following statements, and\
    \ continues until either a break or a return is encountered, or until the end\
    \ of the entire switch statement.\n\nThe value of the expression must be one of\
    \ the integer types (including char), or a string, or an Enum value (see section\
    \ 5.3.6). The constants may be integers, characters, literal strings, or Enum\
    \ values."
- md: "\n# The “Inner Language” of Java ■ 43\n\nThe break statement is not required\
    \ at the end of each case, just strongly recommended. Without a break, control\
    \ will “fall through” into the next group of statements. This is seldom what you\
    \ want to happen. On the rare occasion that this really is the desired behavior,\
    \ you should include a comment that the omission is intentional, otherwise you\
    \ or someone else may “correct” this apparent problem at some later date.\n\n\
    If the same code should be executed for one or more constants, rather than duplicating\
    \ the code, one case **constant**: can be followed immediately by the next, for\
    \ example:\n\n```java\ncase \"yes\":\ncase \"Yes\":\ncase \"YES\":\n    some statements\n\
    ```\n\nIn Java 14 and later, the above can be abbreviated to\n\n`case \"yes\"\
    , \"Yes\", \"YES\": some statements.`\n\nThe default case is optional, and should\
    \ come last; it will be executed if no earlier matching **expression** is found.\
    \ If no matching **expression** is found and there is no default case, the switch\
    \ statement exits without doing anything.\n\nIt is good style to include a default\
    \ case, even if you believe that all possibilities have been covered. The default\
    \ case might be empty, or it could include the statement false; to indicate that\
    \ this code should never be reached. (Assert statements are covered in section\
    \ 3.3.2.1.)\n\nThe **statements** may be any sequence of zero or more statements.\
    \ It is not necessary to use braces to group the statements (including the following\
    \ break statement) into a compound statement, although this is sometimes done.\n\
    \n# Quick Java\n\nHere is a contrived example:\n\n```java\nint i = 3;\nString\
    \ s;\nswitch (i) {\n    case 1:\n        s = \"one\";\n        break;\n    case\
    \ 2:\n        s = \"two\";\n        break;\n    default:\n        s = \"many\"\
    ;\n}\n```\n\nThis will result in s being set to \"many\".\n\n# 3.3.1.10 Labeled\
    \ Statements\n\nThe syntax of a labeled statement is\n\n```java\nidentifier: statement;\n\
    ```\n\nAny statement may be labeled with an identifier, but it really only makes\
    \ sense to label loop statements and switch statements. Labels are used in conjunction\
    \ with the break and continue statements.\n\n# 3.3.1.11 Break Statements\n\nA\
    \ break statement is used to prematurely exit the immediately enclosing loop (of\
    \ any kind) or switch statement.\n\nIt can also be used to exit nested loops and/or\
    \ switch statements. To do this, put a label (see previous section) on the loop\
    \ or switch statement you want to exit, and put the label after the word break:\n\
    \n```java\nbreak label;\n```\n\nGiven an array of numbers, consider the problem\
    \ of finding two different numbers that one is exactly ten times the other. The\
    \ following code solves this problem.\n\n```java\nint i, j = 0;\nint[] ary = {7,\
    \ 30, 9, 20, 3, 5};\nfor (int i = 0; i < ary.length; i += 1) {\n  for (j = 0;\
    \ j < ary.length; j += 1) {\n    if (i!=j && ary[i] == 10 * ary[j]) {\n      break;\n\
    \    }\n  }\n}\nSystem.out.println(ary[i] + \" , \" + ary[j]);\n```\n\nSome programmers\
    \ dislike the break statement, and indeed, there is usually a better way to solve\
    \ a problem without using it.\n\n# 3.3.1.12 Continue Statements\n\nA continue\
    \ statement is used to go from the middle of a loop to the beginning of the next\
    \ time through the loop. That is, the continue statement causes the enclosing\
    \ loop to return to the test of a while loop, the increment and test of a for\
    \ loop, or to the beginning of a do-while loop.\n\nIf the continue statement is\
    \ within nested loops, it can be used to go to the beginning of a particular loop.\
    \ To do this, put a label on the desired loop, and put that label after the word\
    \ continue.\n\n```java\ncontinue label;\n```\n\nThe following code computes the\
    \ average of the positive values in the array ary, ignoring the zero and negative\
    \ values.\n\n```java\nint[] ary = {10, 20, 5, -1, 30, -12, 50};\ndouble sum =\
    \ 0;\nint count = 0;\n\nfor (int i = 0; i < ary.length; i += 1) {\n  if (ary[i]\
    \ > 0) {\n    sum += ary[i];\n    count++;\n  }\n}\ndouble average = sum / count;\n\
    ```\n\n# The “Inner Language” of Java ■ 45\n\n(Note: The OCR text for page 65\
    \ was fragmented/corrupted, I have reconstructed the logic based on the provided\
    \ code snippets.)\n\n# 3.3.2.1 Assert Statements\n\nThe purpose of the assert\
    \ statement is to state some condition that you believe will always be true at\
    \ that point. It should not be used to check for possible error conditions that\
    \ you believe could happen; for that, you should throw an exception (see 3.3.2.6).\
    \ It is a good idea to get into the habit of putting in assert statements, as\
    \ appropriate, when you write the code.\n\n# The “Inner Language” of Java ■ 47\n\
    \nThere is little point in using the second form (with *expression*) unless you\
    \ have something to add. For example, if you believe that some array index i is\
    \ always within the array bounds you might say\n\n```java\nassert i >= 0 && i\
    \ < myArray.length:\n  \"Bad array index.\" + i;\n```\n\nFinally, the idiom assert\
    \ false; can be used to indicate that you believe a certain section of code (for\
    \ example, the default case of a switch statement) can never be reached. However,\
    \ it is a syntax error to put this (or any other) statement in a location that\
    \ the Java compiler cannot know be reached, such as immediately following a return\
    \ statement.\n\nThere are two forms:\n\n```java\nassert booleanExpression;\nassert\
    \ booleanExpression : expression;\n```\n\nExecution is as follows: the booleanExpression\
    \ is evaluated, and if true, control just passes to the next statement. But if\
    \ it is false, an AssertionError is thrown. If the second form is used, the value\
    \ of the expression (which may be any) is included in the error message.\n\nBy\
    \ default, assertions are treated like comments. To make assertions executable,\
    \ use the VM flag -enableassertions or its abbreviation. Note: When running from\
    \ a command line, VM (Virtual Machine) flags may be placed after the word java.\
    \ When running from an IDE, flags will be a configuration option.\n\n# 3.3.2.4\
    \ Empty Statements\n\nAn empty statement is a statement that does nothing. It\
    \ is simply a semicolon `;`. This is useful when a statement is required by the\
    \ syntax but is not needed in the logic. For example, in a `while` loop:\n\n```java\n\
    while (condition) {\n    ;\n}\n```\n\n# 3.3.2.5 Return Statements\n\nThe return\
    \ statement is used to exit from a method and optionally return a value to the\
    \ caller. If the method has a return type other than void, the return statement\
    \ must be followed by an expression of that type. If the method is void, the expression\
    \ is optional.\n\n```java\nint add(int a, int b) {\n    return a + b;\n}\n\nvoid\
    \ printMessage() {\n    return;\n}\n```\n\n# 3.3.2.2 Print \"Statements\"\n\n\
    There are two “statements” that can print a message to the user. They are\n\n\
    ```java\nSystem.out.println(value);\n```\n\nand\n\n```java\nSystem.out.print(value);\n\
    ```\n\nThe difference is that print just a string representation of the value,\
    \ while println prints that string followed by a newline character. That is, the\
    \ next thing printed after a print will be on the same line, but the next thing\
    \ printed after a println will be on a new line.\n\nAlthough print and println\
    \ are used as if they were statements, they are actually methods that have the\
    \ side effect of displaying something on your screen. (Method calls that do not\
    \ have side effects can also be used as statements, but this is usually pointless,\
    \ since the return value is ignored.)\n\nIf the value is an object type, print\
    \ and println will call its toString() method to get a printable representation\
    \ of the object. This gives you considerable control over how your objects are\
    \ printed (see section 4.4.1).\n"
  mdcn: "\n\n# Java 的“内部语言” ■ 43\n\n每个 case 末尾并不强制要求 break 语句，但强烈建议加上。如果没有 break 语句，控制流将“贯穿（fall\
    \ through）”并执行到下一组语句中。这通常不是你希望发生的情况。在确实是预期行为的少数情况下，你应该包含一个注释，说明这种省略是有意为之，否则你或其他人可能会日后的某个时间“纠正”这个明显的问题。\n\
    \n如果需要对一个或多个常量执行相同的代码，而不是重复代码，可以在一个 case **constant** 之后直接紧跟下一个 case，例如：\n\n```java\n\
    case \"yes\":\ncase \"Yes\":\ncase \"YES\":\n    some statements\n```\n\n在 Java\
    \ 14 及更高版本中，上述内容可以简写为\n\n`case \"yes\", \"Yes\", \"YES\": some statements.`\n\n\
    default case 是可选的，且应该放在最后；如果没有找到更早匹配的**expression**，则将执行它。如果没有找到匹配的**expression**\
    \ 且没有 default case，则 switch 语句将不执行任何操作直接退出。\n\n即使你认为已经涵盖了所有可能性，包含一个 default case\
    \ 也是良好的习惯。default case 可以是空的，也可以包含语句 false;，以表示这段代码永远不被触及。（assert 语句在第 3.3.2.1\
    \ 节中介绍。）\n\n**statements** 可以是零或多个语句的任何序列。没有必要使用大括号将语句（包括随后的 break 语句）组合成复合语句，尽管有时也会这样做。\n\
    \n# Java 快速上手\n\n这里有一个构造的示例：\n\n```java\nint i = 3;\nString s;\nswitch (i) {\n\
    \    case 1:\n        s = \"one\";\n        break;\n    case 2:\n        s = \"\
    two\";\n        break;\n    default:\n        s = \"many\";\n}\n```\n\n这将导致 s\
    \ 被赋值为 \"many\"。\n\n# 3.3.1.10 标记语句 (Labeled Statements)\n\n标记语句的语法是\n\n```java\n\
    identifier: statement;\n```\n\n任何语句都可以用标识符进行标记，但只有为循环语句和 switch 语句标记才有意义。标记通常与\
    \ break 和 continue 语句配合使用。\n\n# 3.3.1.11 Break 语句 (Break Statements)\n\nbreak\
    \ 语句用于提前退出直接包含它的循环（任何类型的循环）或 switch 语句。\n\n它也可以用于退出嵌套循环和/或 switch 语句。要做到这一点，在你想要退出的循环或\
    \ switch 语句上放置一个标记（参见前节），并在 break 单词之后加上该标记：\n\n```java\nbreak label;\n```\n\n\
    给定一个数字数组，考虑找到两个不同的数字，其中一个恰好是另一个的十倍。以下代码解决了这个问题。\n\n```java\nint i, j = 0;\nint[]\
    \ ary = {7, 30, 9, 20, 3, 5};\nfor (int i = 0; i < ary.length; i += 1) {\n  for\
    \ (j = 0; j < ary.length; j += 1) {\n    if (i!=j && ary[i] == 10 * ary[j]) {\n\
    \      break;\n    }\n  }\n}\nSystem.out.println(ary[i] + \" , \" + ary[j]);\n\
    ```\n\n有些程序员不喜欢 break 语句，事实上，通常有更好的方法在不使用它的解决问题。\n\n# 3.3.1.12 Continue 语句 (Continue\
    \ Statements)\n\ncontinue 语句用于从循环中间跳转到下一次循环的开始。也就是说，continue 语句会导致包含它的循环返回 while\
    \ 循环的测试、for 循环的递增和测试，或 do-while 循环的开始。\n\n如果 continue 语句位于嵌套循环中，它可以用于跳转到特定循环的开始。要做到这一点，在所需的循环上放置一个标记，并在\
    \ continue 单词之后加上该标记。\n\n```java\ncontinue label;\n```\n\n以下代码计算数组 ary 中正值的平均值，忽略零和负值。\n\
    \n```java\nint[] ary = {10, 20, 5, -1, 30, -12, 50};\ndouble sum = 0;\nint count\
    \ = 0;\n\nfor (int i = 0; i < ary.length; i += 1) {\n  if (ary[i] > 0) {\n   \
    \ sum += ary[i];\n    count++;\n  }\n}\ndouble average = sum / count;\n```\n\n\
    # Java 的“内部语言” ■ 45\n\n（注：第 65 页的 OCR 文本是碎片/损坏的，我根据提供的代码片段重构了逻辑。）\n\n# 3.3.2.1\
    \ 断言语句 (Assert Statements)\n\nassert 语句的目的是陈述你认为在该点始终为真的某些条件。它不应该被用于检查你认为可能发生的潜在错误情况；对于这种情况，你应该抛出异常（参见\
    \ 3.3.2.6）。在编写代码时，养成适当编写 assert 语句的习惯是一个好主。\n\n# Java 的“内部语言” ■ 47\n\n除非你有额外要添加的内容，否则使用第二种形式（带有\
    \ *expression* 的形式）没有太大意义。例如，如果你认为某个数组索引 i 始终在数组范围内，你可能会说：\n\n```java\nassert\
    \ i >= 0 && i < myArray.length:\n  \"Bad array index.\" + i;\n```\n\n最后，惯用写法 `assert\
    \ false;` 可用于你认为某部分代码（例如 switch 语句的 default case）永远无法被触及。然而，将此（或任何其他）语句放在 Java\
    \ 编译器无法确定能触及的地方（例如紧跟 return 语句之后）是语法错误。\n\n有两种形式：\n\n```java\nassert booleanExpression;\n\
    assert booleanExpression : expression;\n```\n\n执行过程如下：评估 booleanExpression，如果为真，控制流直接传递到下一条语句。但如果为假，则会抛出一个\
    \ AssertionError。如果使用第二种形式，表达式的值（可以是任何值）将包含在错误消息中。\n\n默认情况下，断言被视为注释。要使断言变为可执行，请使用\
    \ VM 标志 `-enableassertions` 或其缩写。注意：当从命令行运行时，VM（虚拟机）标志可以放置在 `java` 单词之后。当从 IDE\
    \ 运行时，标志将作为一个配置选项出现。\n\n# 3.3.2.4 空语句 (Empty Statements)\n\n空语句是不执行任何操作的语句。它仅仅是一个分号\
    \ `;`。当语法需要语句但逻辑上不需要时，它是很有用的。例如，在 `while` 循环中：\n\n```java\nwhile (condition) {\n\
    \    ;\n}\n```\n\n# 3.3.2.5 返回语句 (Return Statements)\n\nreturn 语句用于退出方法并可选地向调用者返回值。如果方法有返回类型不是\
    \ void，则 return 语句必须跟一个该类型的表达式。如果方法是 void，则表达式是可选的。\n\n```java\nint add(int a,\
    \ int b) {\n    return a + b;\n}\n\nvoid printMessage() {\n    return;\n}\n```\n\
    \n# 3.3.2.2 打印“语句”（Print Statements）\n\n有两个“语句”可以向用户打印消息。它们是：\n\n```java\nSystem.out.println(value);\n\
    ```\n\n和\n\n```java\nSystem.out.print(value);\n```\n\n区别在于 print 只打印值的字符串表示，而\
    \ println 在打印该字符串后会跟一个换行符。也就是说，print 之后的下一个打印内容将在同一行，而 println 之后的下一个打印内容将另起一行。\n\
    \n尽管 print 和 println 的使用方式像语句一样，但它们实际上是具有在屏幕上显示副作用的方法。（没有副作用的方法调用也可以用作语句，但这通常是没有意义的，因为返回值被忽略了。）\n\
    \n如果值是对象类型，print 和 println 将调用其 `toString()` 方法以获取对象的字符串打印表示。这让你对对象的打印方式拥有相当大的控制权（参见第\
    \ 4.4.1 节）。\n\n"
