    \ the key code to any of a large number of constants in the KeyEvent class, such\
    \ as VK_A, VK_SHIFT, or VK_DOWN. Non-English keyboards have the keys arranged\
    \ differently, but the VK (virtual keyboard) values are independent of the keyboard\
    \ arrangement.\n\n# 9.8.17 Mouse Input\n\nAll of the common widgets handle mouse\
    \ events automatically. However, if you wish to do something special, such as\
    \ point at specific parts of an image, you can write your own mouse listeners.\
    \ There are separate listeners for clicks, movement, and scrolling.\n\nThe MouseListener\
    \ interface specifies five public void methods: mouseEntered, mouseExited, mousePressed,\
    \ mouseReleased, and mouseClicked. Each of these receives a MouseEvent argument\
    \ (see below). The only one of these methods you are likely to care about is mouseClicked,\
    \ but MouseListener is an interface, so you have to provide them all, even if\
    \ they don't do anything.\n\nThe MouseListener interface specifies two public\
    \ void methods, mouseMoved and mouseDragged, both with a MouseEvent argument.\n\
    \nThe MouseEvent object has the following methods (among others):\n\n- getButton()\
    \ returns one of the values MouseEvent.BUTTON1, MouseEvent.BUTTON2, or MouseEvent.BUTTON3.\n\
    \n- getX() and getY() return the mouse location, in pixels, relative to the top-left\
    \ corner of the component that has the listener. X values increase as the mouse\
    \ pointer moves to the right, and Y values increase as the mouse pointer moves\
    \ down.\n\n# 186 Quick Java\n\n- getXOnScreen() and getYOnScreen() return the\
    \ mouse location relative to the top-left corner of the display screen.\n- getClickCount()\
    \ returns the number of closely-spaced mouse clicks.\n\nThe MouseAdapter class\
    \ provides empty versions of all of the above methods, so you can extend this\
    \ class and override any of the methods you care to use. See section 9.8.10 on\
    \ the JLabel widget for an example using a MouseAdapter.\n\nThere is also a MouseWheelListener\
    \ interface. It requires a mouseWheelMoved method with a MouseWheelEvent parameter.\
    \ Since a JScrollPane is always more convenient, this interface is not covered\
    \ here.\n\n# 9.9 DICERLLER\n\nHere is a complete (but very small) Swing application:\n\
