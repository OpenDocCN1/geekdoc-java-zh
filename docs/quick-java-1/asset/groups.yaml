    \n# 作者\n\nDAVID MATUSZE，大多数我的学生称我为“Dave 博士”。我写下我的第一本书时，正是在德克萨斯大学奥斯汀分校。我拥有计算机科学博士学位，后来在宾夕法尼亚大学担任教职。我已经在行业工作了多年，后来加入了维拉尼亚大学（MCIT）。我教\
    \ Java 已经多年了，我对人工智能和编程非常感兴趣。如果你有任何问题，请联系我：davidatusze@gmail.com。\n\n# 前言\n\n在阅读本书之前，你不需要理解或记住所有内容。本书是关于\
    \ Java 的快速入门。如果你是从其他语言转过来的，你会发现 Java 的概念是类似的。\n\n# 版本\n\n你不需要担心 Java。你可以从 https://www.oracle.com/java/technologies/downloads/\
    \ 获取 8。\n\n# Java 快速概览\n\n## 1.1 项目\n\n一个程序项目由一个或多个包组成。一个项目包含：\n\n字体 包（目录）\n-\
    \ 类（通常每个文件一个）：\n    - 字段（数据）\n    - 构造函数，包含声明和语句\n         方法，包含声明和语句\n\n## 2\
    \ 快速上手 Java\n\n方法类似于函数，不同在于方法属于对象，并且（通常）操作该对象的字段。方法可以包含变量声明，并包含可执行语句。总结一下，Java\
    \ 的组织结构如下：\n\n- 包（目录）\n- 类（通常每个文件一个）\n\n在 Java 9 之后，包可以组织成更大的单元，称为模块。这对于具有大量包的程序是合适的。JDK（Java\
