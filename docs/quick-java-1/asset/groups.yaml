    \n![](img/fb8b9ea4edf0c31c9f97e5eb4d89a6be_176_0.png)\n\n# GUIs and Dialogs\n\n\
    A GRAPHICAL User Interface, or GUI (pronounced “gooey”), provides interaction\
    \ with the user beyond simple text entry and printing. GUIs provide familiar buttons,\
    \ text fields, menu items, and so on, common to almost all user-facing programs.\n\
    \n## 8.1 A BRIEF HISTORY\n\nGUIs have been available from the very first Java\
    \ implementation. The original GUI toolkit was the AWT, the Abstract Window Toolkit,\
    \ which was platform-specific and quite primitive.\n\nLater Swing, a much better,\
    \ platform-independent toolkit. It was built “on top of” AWT, and many of the\
    \ AWT packages are still needed in Swing applications.\n\nA third toolkit, JavaFX,\
    \ was released in 2008. It was originally intended to replace Swing. While it\
    \ is still available as part of the OpenFX project, it has been dropped from the\
    \ standard releases of Java. For this reason, our description of GUI programming\
    \ uses Swing.\n\n## 8.2 DIALOGS\n\nA dialog is used to get a simple response from\
    \ the user. Dialogs can be used without having to create a full-fledged GUI. To\
    \ determine the location of the dialog on the screen, a parent component must\
    \ be specified; if it is null, the dialog will be centered on the screen.\n\n\
    There are four kinds of JOptionPane dialogs: Confirm, Input, Message, and Option.\
    \ Additional dialog types are provided for choosing a color (import java.awt.Color),\
    \ or for loading a file (various classes from java.io). You can also create your\
    \ own custom dialog.\n\nAll provided dialogs are modal, that is, the user must\
    \ respond to them before anything else can be done in the application. Custom\
    \ dialogs can be modal or non-modal.\n\n### 8.2.1 Message Dialog\n\nA message\
    \ dialog is a modal dialog with a single OK button.\n\nTo display a JOptionPane\
    \ message dialog, import javax.swing.JOptionPane and to do the following:\n\n\
    ```\nJOptionPane.showMessageDialog(parent,\n  \"This is a message dialog.\");\n\
    ```\n\n### 8.2.2 Confirm Dialog\n\nA confirm dialog is a modal dialog with Cancel,\
    \ No, and Yes buttons. The return result will be an integer equal to one of YES_OPTION,\
    \ NO_OPTION, or CANCEL_OPTION.\n\nTo display a JOptionPane confirm dialog, import\
    \ javax.swing.JOptionPane and to do the following:\n\n```\nint yesNo = JOptionPane.showConfirmDialog(\n\
    \  parent,\n  \"Do you really want to do that?\");\nif (yesNo == JOptionPane.YES_OPTION)\
    \ {\n  System.out.println(\"Action confirmed\");\n}\n```\n\n### 8.2.3 Input Dialog\n\
    \nAn input dialog is a modal dialog that provides a place for the user to enter\
    \ a single line of text and has Cancel and OK buttons.\n\nTo display a JOptionPane\
    \ input dialog, import javax.swing.JOptionPane and do the following:\n\n```\n\
    String UserName =\nJOptionPane.showDialog(\n  parent, \"What is your name?\");\n\
    ```\n\n### 8.2.4 Option Dialog\n\nAn option dialog is a modal dialog that displays\
    \ a number of buttons, each labeled with a string taken from an array of strings.\
    \ Clicking on a button returns an index into that array.\n\nTo display a JOptionPane\
    \ option dialog, import javax.swing.JOptionPane and do the following:\n\n```\n\
    Object[] options = new String[] {\"Java\", \"Python\"};\nint option = JOptionPane.showDialog(\n\
    \  parent,\n  \"Choose an option:\",\n  \"Option Dialog\");\n```\n\n### 8.2.5\
    \ Color Chooser Dialog\n\nTo declare and use a JColorChooser, import java.awt.Color\
    \ and javax.swing.JColorChooser and to do the following:\n\n```\nJColorChooser\
    \ colorChooser = new JColorChooser();\nColor chosenDialog = colorChooser.showDialog(parent,\n\
    \    \"Choose a color\",\n    Color.WHITE);\n```\n\n### 8.2.6 Load File Dialog\n\
    \nA file chooser is a dialog that can be used to navigate to a particular file,\
    \ either to read from it or to write to it. This section shows example code for\
    \ reading from a text file.\n\nNecessary imports: javax.swing.JFileChooser, java.io.File,\
    \ java.io.BufferedReader, java.io.FileReader, java.io.IOException.\n\nTo display\
    \ a JFileChooser file dialog:\n\n```\nJFileChooser chooser = new JFileChooser();\n\
    chooser.setDialogTitle(\"Load which file?\");\n```\n\nTo get a reader for the\
    \ chosen file:\n\n```\nBufferedReader br = null;\nint result = chooser.showDialog(parent);\n\
    if (result == JFileChooser.APPROVE_OPTION) {\n    File file = chooser.getSelectedFile();\n\
    \    try {\n        if (file != null) {\n            String fileName = file.getCanonicalPath();\n\
    \            FileReader fr = new FileReader(fileName);\n            br = new BufferedReader(fr);\n\
    \        }\n    } catch (IOException e) { }\n}\n```\n\nTo read the first line\
    \ of the file:\n\nSee section 3.3.3 for more ways to read from a file. Close the\
    \ FileReader and BufferedReader when you are done.\n\n### 8.2.7 Save File Dialog\n\
    \nThe code for writing to a text file is similar to the code for reading from\
    \ a file (the previous section). You need to use a save dialog instead of an open\
    \ dialog, and a PrintWriter instead of FileReader.\n\nNecessary imports: javax.swing.JFileChooser,\
    \ java.io.File, java.io.PrintWriter, java.io.FileOutputStream, and java.io.IOException.\n\
    \nTo display a JFileChooser save file dialog:\n\n```\nJFileChooser chooser = new\
    \ JFileChooser();\nchooser.setDialogTitle(\"Save file as?\");\n```\n\nTo get the\
    \ file chosen in a JFileChooser save file dialog:\n\n```\nint result = chooser.showSaveDialog(parent);\n\
    PrintWriter pr = null;\nif (result == JFileChooser.APPROVE_OPTION) {\n  File file\
    \ = chooser.getSelectedFile();\n  String fileName;\n  try {\n    if (file != null)\
    \ {\n      fileName = file.getCanonicalPath();\n      OutputStream stream = new\
    \ FileOutputStream(fileName);\n      pr = new PrintWriter(stream, true);\n   \
    \ }\n  } catch (IOException e) { }\n}\n```\n"
  mdcn: "\n\n注意：`assertThrows` 的第一个参数必须是一个类，但像 `ArithmeticException` 这样的异常是类型名称，而不是类。使用\
    \ `.class` 后缀返回类本身。\n\n如果你没有可用的函数，可以如下方式编写相同的测试：\n\n```\ntry {\n  divide(0, 0);\n\
    \  Assertions.fail();\n} catch (ArithmeticException e) { }\n```\n\n## 7.6 假设 (ASSUMPTIONS)\n\
    \n除了断言之外，JUnit 5 还提供了三种假设。\n\n- assumeTrue(booleanExpression)\n- assumeFalse(booleanExpression)\n\
    \n如果不符合条件，测试方法将直接返回而不执行该方法的剩余部分，且该测试被视为“不适用”，而不是成功或失败。\n\n- assumingThat(booleanExpression,\
    \ function)\n\n如果 `booleanExpression` 为 `true`，则将运行函数；否则，不会运行。无论何种情况，测试方法都会继续执行。\n\
    \n> 注意：函数中的断言将产生任何影响。\n\n示例：assertTrue(System.getProperty(\"os.name\")).equals(\"\
    Mac OS X\"));\n\n## 7.7 简单测试用例\n\n以下代码测试了一个非常简单的类 `Account`，它在第 4.1.7 节中用作示例。它有一个构造函数以及\
