    The System.in argument says the scanner is to take input from the keyboard. (The
    argument could also be a file, or even a string, which is nice for testing purposes.
    We don''t explore these options here.)


    A scanner can read either "tokens" or lines. A Token is any sequence of characters
    bounded by whitespace (spaces, tabs, newlines), while lines are bounded by newline
    characters.


    To read in tokens, a scanner has the methods next() (reads a token as a string),
    nextInt(), nextDouble(), and nextBoolean(). It also has methods for a number of
    other types, not including char. An InputMismatchException will result if the
    user enters a value of the wrong type.


    One way to avoid errors is to check the type of the next token by "looking ahead"
    at it, with the methods nextInt(), hasNextDouble'
