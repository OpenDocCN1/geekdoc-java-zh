  mdcn: "\n# 如何构建 GUI 程序 ■ 169\n\n工具提示（Tooltip）是用户鼠标悬停在组件上时弹出的文本消息，通常用于提供关于组件用途的额外信息。工具提示可以添加到几乎任何组件中。\n\
    \n```\nwidget.setToolTip(\"Purpose of widget\");\n```\n\n## 9.7 添加监听器 (ADD LISTENERS)\n\
    \n一旦 GUI 程序启动，在发生事件之前，它通常什么都不做。如果该事件有监听器，监听器将执行一段代码块直到完成，然后直到下一次事件发生前什么都不会发生。\n\
    \n许多事件通过内置监听器被“自动”处理。当你在焦点位于文本字段时输入字符时，在底层的某个地方有一个监听器会响应该事件，并在文本字段中绘制该字符。当你点击按钮时，由于内置监听器的作用，按钮会发生“按下”（外观改变）。然而，所有这些内置监听器确实都改变了文本字段或按钮的外观。要让按钮执行某些有用的操作，你必须向它添加一个监听器，在按钮被点击时执行某些代码。\n\
    \n通俗来说，你不应该为文本字段或复选框等被动组件添加监听器。相反，在你需要知道它们的值时再去获取其值。\n\n不同类型的组件有不同类型的监听器。`JButton`\
    \ 应该有一个 `ActionListener`，而 `JSlider` 可能有一个 `ChangeListener`。\n\n其他监听器（如 `ActionListener`）是函数接口——它们精确定义了一个抽象方法。对于这些监听器，你只需提供一个函数，例如：\n\
    \n```\naddActionListener(event -> code);\n```\n\n其他监听器不是函数接口，通常是因为它们指定了多个方法。对于这些情况，你必须定义一个实现所有方法的类，并提供该类的实例——例如参见\
    \ 9.8.16 节中 `KeyListener` 的实现。\n\n## 快速 Java\n\n你也可以为鼠标点击、鼠标移动和按键编写监听器，但除非你在做特殊处理，否则不需要这样做。\n\
    \n## 9.8 示例代码 (SAMPLE CODE)\n\nSwing 是复杂的。它有许多不同类型的组件，每种组件的处理方式都略有不同。本节采用的方法为一组较重要的组件提供完整的示例代码。在大多数情况下，代码可以通过几次简单的微调来调整。\n\
    \n当使用组件触发事件时，我的示例代码会调用一个我为了测试目的而写的 `handleEvent` 方法（未提供）。这应该被替换为你处理事件的代码。\n\n\
    ### 9.8.1 JFrame 和 JPanel\n\n创建 Swing GUI 最简单的方法是让你的主类扩展 `JFrame`。\n\n扩展你的主类：\n\
    \n```\npublic class Examples extends JFrame {...}\n```\n\n或者，创建一个新的 `JFrame`：\n\
    \n```\nJFrame myFrame = new JFrame();\n```\n\n指定当 `JFrame` 关闭时执行的标准操作：\n\n```\n\
    setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n```\n\n或使用 `HIDE_ON_CLOSE`、`DISPOSE_ON_CLOSE`\
    \ 或 `NOTHING_ON_CLOSE`。\n\n指定当 `JFrame` 关闭时执行自定义操作：\n\n```java\naddActionListener(new\
    \ Closer());\nprivate class Closer extends WindowAdapter {\n    public void windowClosing(WindowEvent\
    \ we) {\n        update(); // 你的方法\n    }\n}\n```\n\n创建一些放入 `JFrame` 的 `JPanel`：\n\
    \n```\nJPanel controlPanel = new JPanel();\nJPanel outputPanel = new JPanel();\n\
    JPanel[] panels = new JPanel[numberOfPanels];\n```\n\n更改 `JFrame` 的布局管理器：\n\n\
    ```\nsetLayout(new BorderLayout());\n```\n\n向 `JFrame` 添加组件（例如添加到 `NORTH` 区域）：\n\
    \n```\nadd(controlPanel, BorderLayout.NORTH);\n```\n\n最后一步通常是让 `JFrame` 尺寸、布局并使其可见：\n\
    \n```\npack();\nsetVisible(true);\n```\n\n上述代码假设它位于扩展了 `JFrame` 的类中。或者，你也可以创建一个\
    \ `JFrame` 并将其保存在变量中，然后向该变量发送消息。特别是 `setDefaultCloseOperation`、`getContentPane`、`pack`\
    \ 和 `setVisible` 消息应该发送给 `JFrame`。\n\n> **技术说明：** 实际上持有组件的是 `JFrame` 的“内容面板”（content\
    \ pane）；`setLayout` 和 `add` 方法会将这些调用传递给内容面板。非常旧的代码可能仍然显式地引用内容面板。\n\n### 9.8.2\
    \ JEditorPane\n\n**编辑器**（editor）是一种特殊的容器，支持编辑纯文本（text/plain）或**超文本**（text/html）。它实现了剪切、复制和粘贴的快捷键，但不支持撤销/重做。\n\
    \n其构造使用了较为复杂的嵌套。在下面的示例中，`JFrame` 包含 `JScrollPane` 滚动条，滚动条包含 `JPanel` 内容，内容包含 `JEditorPane`\
    \ 编辑器。\n\n声明并定义一个 `JEditorPane`：\n\n```\nJEditorPane editor = new JEditorPane();\n\
    ```\n\n声明并定义一个作为 `JScrollPane` 视图 `JPanel`：\n\n```\nJPanel content = new JPanel();\n\
    ```\n\n声明并定义一个持有 `JPanel` 的 `JScrollPane`：\n\n```\nJScrollPane scroller = new\
    \ JScrollPane(editor);\n```\n\n设置 `JEditorPane` 显示 HTML：\n\n```java\nEditorKit\
    \ kit = JEditorPane.createEditorKitFor(\"text/html\");\neditor.setEditorKit(kit);\n\
    ```\n\n将 `JEditorPane` 添加到内容 `JScrollPane`：\n\n```\ncontent.setLayout(new BorderLayout());\n\
    content.add(scroller, BorderLayout.CENTER);\n```\n\n通过将 `JScrollPane` 放入 `JFrame`\
    \ 并向其添加 `JEditorPane`，它可以显示文本。\n\n设置 `JEditorPane` 的文本：\n\n```java\neditor.setText(\"\
    This is a sample\");\n```\n\n### 9.8.3 JScrollPane\n\n滚动面板是为组件提供滚动条的容器。当内容大于显示区域时使用它。\n\
    \n声明并定义一个 `JScrollPane`：\n\n```\nJScrollPane scroller = new JScrollPane();\n```\n\
    \n将组件添加到 `JScrollPane`：\n\n```\nscroller.setViewportView(component);\n```\n\n\
    ### 9.8.4 JTabPane\n\n标签面板是一种允许用户通过点击标签切换不同内容的容器。\n\n声明并定义一个 `JTabPane`：\n\n```\n\
    JTabPane tabbedPane = new JTabPane();\n```\n\n向 `JTabPane` 添加一个标签：\n\n```\ntabbedPane.addTab(\"\
    Tab 1\", component1);\n```\n\n### 9.8.5 JButton\n\n按钮通常显示为包含文本的圆角矩形。按钮应该始终视为活动组件。\n\
    \n声明并定义一个 `JButton`：\n\n```java\nprivate JButton myButton = new JButton(\"Click\
    \ Me!\");\n```\n\n将 `JButton` 添加到面板：\n\n```\nsomeJPanel.add(myButton);\n```\n\n\
    ### 9.8.6 JTextField\n\n文本字段是可以输入单行文本的矩形。文本字段可以持有任意数量的字符，尽管矩形可能小到无法显示所有。\n\n声明并定义一个\
    \ `JTextField`：\n\n```java\nJTextField myJTextField = new JTextField();\n```\n\
    \n将 `JTextField` 添加到面板：\n\n```\nsomeJPanel.add(myJTextField);\n```\n\n为 `JTextField`（或其他任何\
    \ `JComponent`）添加工具提示：\n\n```\nmyJTextField.setToolTip(\"Enter name here\");\n\
    ```\n\n设置 `JTextField` 的内容：\n\n```\nmyJTextField.setText(\"Hello\");\n```\n\n\
    获取 `JTextField` 的内容：\n\n```\nString myText = myJTextField.getText();\n```\n\n\
    ### 9.8.7 JTextArea\n\n文本区域是可以输入多行文本的矩形。文本区域可以持有任意数量的文本，尽管矩形可能小到无法显示全部。\n\n"
