    \ settings may help. And, of course, you can switch to a different IDE.\n\nThere\
    \ are simpler IDEs, often written specifically for students, such as BlueJ, JCreator,\
    \ and DrJava. The advantage of a simpler IDE is that it is less intimidating.\
    \ The disadvantage is that it does not help the programmer.\n\nIt has been said\
    \ that the hardest program to write in any language is “Hello World\"; all subsequent\
    \ programs are just elaborations of this one. In the same way, once you successfully\
    \ use a professional IDE to write and execute a program, all the rest is just\
    \ elaboration.\n\n# 2.2 COMMENTS AND TAGS\n\nThere are three kinds of comments\
    \ in Java.\n\n- Comments beginning with // and continuing to the end of the line.\n\
