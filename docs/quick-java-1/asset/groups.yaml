    # 10.6 THE BOUNCING BALL


    Animation is performed by displaying a series of still images, one after the other,
    with minor changes between each image and the next. A bouncing ball is the “Hello
    world” of animation—a small disk that moves steadily across a window, and “bounces”
    (changes direction) when it encounters an edge of the window. Our version (see
    Figure 10.2) will have two buttons, Run to start the animation and Stop to pause
    it.


    ![](img/fb8b9ea4edf0c31c9f97e5eb4d89a6be_217_0.png)


    FIGURE 10.2 The Bouncing Ball example.


    Our implementation uses the MVC model, with the unimaginatively named classes
    Model, View, and Controller. The controller sets up the GUI and creates objects
    of the other two types; the model controls the position of the ball; and the view
    displays the ball in the window.


    The model is treated as a “bean” (although it does not have all the characteristics
    of a bean), and PropertyChangeEvents are used to keep the model as independent
    as possible from the rest of the code.


    In the following we mention only the main points of the Bouncing Ball program;
    the complete code is in an appendix.'
- md: "\n## 10.6.1 MVC\n\nMVC, or Model-View-Controller is a useful design pattern\
    \ when one thread is used to control another thread, such as when doing animation.\n\
    \n**Terminology: A design pattern** is simply a way of organizing code that has\
    \ been found to be generally useful. MVC is considered here in order to introduce\
    \ some useful objects and interfaces.\n\n**model** is the code doing the actual\
    \ work of the simulation, animation, or whatever. It should be free of any input/output,\
    \ and completely independent of both the view and the controller. If there is\
    \ a GUI, it should be completely unknown to the model.\n\nThe **view** displays\
    \ information about what is going on in the model. In the case of an animation,\
    \ it displays the current frame of the animation.\n\nThe **controller** is used\
    \ to send commands or information to the model.\n\nThe model, view, and controller\
    \ can be implemented as three separate classes, but in small GUI programs, it\
    \ is often convenient to combine the controller and view into a single class.\n\
    \n## 10.6.2 Controller\n\nThe controller's main job is to set up the GUI, so it\
    \ extends JFrame and adds Run and **Stop** buttons. It creates the model and the\
    \ view. Since the view has to know about the model, but the model doesn't have\
    \ to know about the view, the model is created first.\n\n```\nmodel = new Model();\n\
    view = new View(model);\n```\n\nSince the ball is to bounce off the edges of the\
    \ window, it has to know where they are. The top and left edges are at 0; the\
    \ right edge is the width of the window, and the bottom edge is the height of\
    \ the window. If the window is resized, the new values must be fetched and sent\
    \ to the model.\n\n```\nthis.addComponentListener(new ComponentAdapter() {\n@Override\n\
    public void componentResized(ComponentEvent e) {\n    model.setLimits(view.getWidth(),\n\
    \    view.getHeight());\n}\n});\n```\n\n## 10.6.3 Model\n\nThe model has four\
    \ basic variables: the x and y position of the ball, and the amount that each\
    \ of these changes from one frame (still picture) to the next. For convenience\
    \ in drawing the ball, the x and y coordinates are given as the top left corner\
    \ of a square enclosing the ball. For convenience in creating a single object\
    \ for the viewer to use, the x and y are enclosed in a Point object.\n\n```\n\
    private Point position = new Point(0, 0);\nprivate int dx = 6; // change in x\n\
    private int dy = 4; // change in y\n```\n\nThe model uses a Timer to add dx to\
    \ x and dy to y at 40-millisecond intervals, or 25 times a second. This is sufficient\
    \ to give the illusion of motion.\n\n```\ntimer = new Timer(40, new ActionListener()\
    \ {\n    @Override\n    public void actionPerformed(ActionEvent e) {\n       \
    \ makeOneStep();\n    }\n});\n```\n\nAt each step, the x position is advanced\
    \ by dx, and the y position by dy. A “bounce” occurs when the ball goes too far\
    \ to the left or too far to the right, and this is accomplished by changing the\
    \ sign of dx.\n\n```\nposition.x += dx;\nif (position.x < 0 || position.x >= xLimit)\
    \ {\n    dx = -dx;\n}\nposition.x += dx;\n```\n\nThe code for updating position.y\
    \ is almost identical.\n\nThe model represents a ball bouncing around within a\
    \ bounding box. It is irrelevant to the model that the bounding box corresponds\
    \ to the edges of a window. It is perfectly legal to draw outside a window; anything\
    \ drawn there simply isn’t visible.\n\nTo make the new position available to other\
    \ classes, the model has a PropertyChangeSupport object (named pcs). This is public\
    \ so that it can be accessed by the view class.\n\n```\npublic PropertyChangeSupport\
    \ pcs;\n```\n\nEach time the model completes a step, it tells pcs to fire off\
    \ an event containing the value of the ball’s position.\n\n```\nthis.pcs.firePropertyChange(\"\
    position\", null,\nposition);\n```\n\n## 10.6.4 View\n\nThe task of view class\
    \ is simply to clear the window and draw a ball in it each time it receives a\
    \ PropertyChangeEvent. This means it has to “listen” for those events. To do this,\
    \ it implements PropertyChangeListener.\n\n```\npublic class View extends JPanel\n\
    implements PropertyChangeListener {...}\n```\n\nIt has to provide a listener for\
    \ the events:\n\n```\n@Override\npublic void propertyChange(\n    PropertyChangeEvent\
    \ event) {\n    position = (Point) event.getNewValue();\n    repaint();\n}\n```\n\
    \nBut this isn’t enough; one more step is required: The View class is a listener,\
    \ but the same PropertyChangeSupport object used earlier must be told about it.\n\
    \n```\nmodel.pcs.addPropertyChangeListener(this);\n```\n\nYou can think of the\
    \ View as “subscribing” to the series of events sent out by pcs.\n\n## Appendix\
    \ A:\nCode for BouncingBall\n\n## BOUNCING BALL: CONTROLLER\n\n- This is an example\
    \ of the basic \"Bouncing Ball\" animation, making use of the Model-View-Controller\
    \ design pattern and the Timer and PropertyChangeSupport classes.\n\n```java\n\
    import java.awt.BorderLayout;\nimport java.awt.event.ActionEvent;\nimport java.awt.event.ActionListener;\n\
    import java.awt.event.ComponentAdapter;\nimport java.awt.event.ComponentEvent;\n\
    import java.util.Timer;\nimport java.swing.JButton;\nimport javax.swing.JPanel;\n\
    import javax.swing.JFrame;\n\npublic class Controller extends JFrame {\n    JPanel\
    \ buttonPanel = new JPanel();\n    JButton button = new JButton(\"Run\");\n  \
    \  JButton stopButton = new JButton(\"Stop\");\n    Timer timer;\n    Model model;\n\
    \    View view;\n\n    public static void main(String[] args) {\n        Controller\
    \ c = new Controller();\n        c.init();\n        c.display();\n    }\n\n  \
    \  private void init() {\n        model = new Model();\n        view = new View(model);\n\
    \    }\n\n    private void display() {\n        setLayout(new BorderLayout());\n\
    \        add(buttonPanel, BorderLayout.SOUTH);\n        buttonPanel.add(button);\n\
    \        buttonPanel.add(stopButton);\n        stopButton.setEnabled(false);\n\
    \        add(view, BorderLayout.CENTER);\n        setSize(300, 300);\n       \
    \ setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n        setVisible(true);\n\
    \        attachToComponents();\n    }\n\n    private void attachListenersToComponents()\
    \ {\n        button.addActionListener(event -> {\n            button.setEnabled(false);\n\
    \            stopButton.setEnabled(true);\n            model.start();\n      \
    \  });\n        stopButton.addActionListener(event -> {\n            button.setEnabled(true);\n\
    \            stopButton.setEnabled(false);\n            model.pause();\n     \
    \   });\n        this.addComponentListener(new ComponentAdapter() {\n        \
    \    @Override\n            public void componentResized(ComponentEvent e) {\n\
    \                model.setLimits(view.getWidth(), view.getHeight());\n       \
    \     }\n        });\n    }\n}\n\nclass Model {\n    private Point position =\
    \ new Point(0, 0);\n    private int xLimit, yLimit;\n    private int dx = 6;\n\
    \    private int dy = 4;\n    private Timer timer;\n    public PropertyChangeSupport\
    \ pcs;\n\n    public Model() {\n        pcs = new PropertyChangeSupport(this);\n\
    \        position = new Point(0, 0);\n        timer = new Timer(40, new ActionListener()\
    \ {\n            @Override\n            public void actionPerformed(ActionEvent\
    \ e) {\n                makeOneStep();\n            }\n        });\n        timer.stop();\n\
    \    }\n\n    public void setLimits(int width, int height) {\n        xLimit =\
    \ width;\n        yLimit = height;\n    }\n\n    public void start() {\n     \
    \   timer.start();\n    }\n\n    public void pause() {\n        timer.stop();\n\
    \    }\n\n    private void makeOneStep() {\n        position.x += dx;\n      \
    \  if (position.x < 0 || position.x >= xLimit) {\n            dx = -dx;\n    \
    \    }\n        position.x += dx;\n        position.y += dy;\n        if (position.y\
    \ < 0 || position.y >= yLimit) {\n            dy = -dy;\n        }\n        position.y\
    \ += dy;\n        pcs.firePropertyChange(\"position\", null, position);\n    }\n\
    }\n\nclass View extends JPanel implements PropertyChangeListener {\n    private\
    \ Model model;\n    private Point position;\n\n    public View(Model model) {\n\
    \        this.model = model;\n        model.pcs.addPropertyChangeListener(this);\n\
    \    }\n\n    @Override\n    public void propertyChange(ChangeEvent event) {\n\
    \        position = (Point) event.getNewValue();\n        repaint();\n    }\n\
    }\n```\n"
  mdcn: "\n\n## 10.6.1 MVC\n\nMVC，或模型-视图-控制器（Model-View-Controller），是在使用一个线程控制另一个线程（例如执行动画）时有用的设计模式。\n\
    \n**术语：设计模式**简单是一种被证明通用的代码组织方式。在这里引入 MVC 是为了介绍一些有用的对象和接口。\n\n**模型（model）**是执行模拟、动画或任何实际工作的代码。它不包含任何输入/输出，并且完全独立于视图和控制器。如果有\
    \ GUI，模型完全不应该感知它的存在。\n\n**视图（view）**负责显示模型中正在发生的情况的信息。在动画的情况下，它显示动画的当前帧。\n\n**控制器（controller）**用于向模型发送命令或信息。\n\
    \n模型、视图和控制器可以实现为三个独立的类，但在小型 GUI 程序中，将控制器和视图合并为一个类通常会更方便。\n\n## 10.6.2 控制器\n\n\
    控制器的主要工作是设置 GUI，因此它扩展了 JFrame 并添加了运行（Run）和**停止（Stop）**按钮。它创建了模型和视图。由于视图必须了解模型，但模型不需要了解视图，因此先创建模型。\n\
    \n```\nmodel = new Model();\nview = new View(model);\n```\n\n由于球要在窗口边缘反弹，它必须知道这些边缘在哪里。顶部和左侧边缘位于\
    \ 0；右侧边缘是窗口的宽度，底部边缘是窗口的高度。如果调整了窗口大小，必须获取新值并将其发送到模型。\n\n```\nthis.addComponentListener(new\
    \ ComponentAdapter() {\n@Override\npublic void componentResized(ComponentEvent\
    \ e) {\n    model.setLimits(view.getWidth(),\n    view.getHeight());\n}\n});\n\
    ```\n\n## 10.6.3 模型\n\n模型有四个基本变量：球的 x 和 y 位置，以及每个一个值从一帧（静态图像）到下一帧的变化量。为了方便绘制球，x\
    \ 和 y 坐标被给出为包围球的正方形的左上角。为了方便为查看器创建一个使用的单一对象，x 和 y 被封装在一个 Point 对象中。\n\n```\nprivate\
    \ Point position = new Point(0, 0);\nprivate int dx = 6; // x 的变化\nprivate int\
