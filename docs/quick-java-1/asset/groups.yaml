- md: "\n# The “Outer Language” of Java ■ 95\n\nA hash code is an arbitrary integer\
    \ assigned to an object. It has no more meaning than, say, a phone number. Hash\
    \ codes are used by a number of classes, such as HashSet and HashMap. If you never\
    \ use these classes, and never give your code to anyone who might, there is no\
    \ need to override hashCode; but it's cheap and easy to do, so you should anyway.\n\
    \nThe point to remember is that equal objects must have equal hash codes. If you\
    \ use only part of an object to test for equality, use those same parts to create\
    \ a hash code. This is absolutely necessary for classes like HashMap to work correctly.\n\
    \nIt is not, repeat not, the case that unequal objects must have different hash\
    \ codes. It's better if they do, relatively harmless if they don't. If you use\
    \ a hash code of zero for every object, your code may run a thousand times slower,\
    \ but it will still work.\n\nWe have defined two Counter objects to be equal if\
    \ they have the same count value, so the hashCode method practically writes itself.\n\
    \n```java\n@Override\npublic int hashCode() {\n  return count;\n}\n```\n\nIf you\
    \ have a Customer class with a name field, and if the name fields of two customers\
    \ have to match for them to be considered equal, you can use the hash code of\
    \ name for the hash code of your customer.\n\n```java\n@Override\npublic int hashCode()\
    \ {\n  return name.hashCode();\n}\n```\n\nIf your equals method for Customer also\
