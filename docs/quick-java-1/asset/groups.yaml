    # 102 ■ Quick Java


    documented item is genericized, the type variables can be specified with tags.
    Because javadoc produces HTML by default, HTML tags can be included in doc comments.


    A doc comment for a **class** should provide general information about what kind
    of object it represents.


    A doc comment for an **interface** should tell what capabilities it provides.


    A doc comment for a **field** should describe the data held by the field. Most
    fields should be private; javadoc can be set to include or to ignore information
    about private fields and methods.


    A doc comment for a constructor should tell how its parameters are used.


    A doc comment for a method should tell the user the method does and how to use
    it, not how it is implemented.


    Doc comments may contain javadoc tags. Here are the most common ones:


    +   * @author **Author name** (for classes and interfaces)

    * @version **date or version number** (for classes and interfaces)

    * @param **name purpose** (for describing a parameter of a method or constructor;
    use one tag for each parameter)

    * @param **typeParameter purpose** (for type parameters of genericized classes,
    methods, and constructors; use one tag for each type)

    * @return **description** (for methods, to tell what is expected of the result)

    * @throws **exceptionType description** (for exceptions possibly thrown by methods
    or constructors; use one tag for each exception type)'
  - '[PAGE 123]


    # Advanced Java ■ 103


    +   * @exception is a synonym for @throws

    * @deprecated text (should tell why this class or method should not longer be
    used, and should suggest an alternative)


    A good IDE can generate skeletal doc comments for you, so all you have to do is
    in the details.


    The doc comment for a method should begin with a verb phrase, for example, "Finds
    the median value." In other words, write the doc comment as if it began with the
    words "This method . . "


    Python programmers: Java differs from Python style, which would be to write the
    doc comment as an imperative statement: "Find the median value."


    Use this word when referring to the current object, for example, "Returns the
    numerator of this fraction."


    The @param and @return tags do not need to mention the type of the parameters
    or of the return value, javadoc will do that.


    If it is too difficult to write the doc comment for a method, or if a method is
    in sections separated by comments, this may be an indication that the method is
    trying to do too many things. A good IDE can help you break the method up into
    separate well-named methods, each with a single purpose.


    Classes are organized into packages, with each public class on a separate file.
    To provide documentation that describes the entire package, you can write a file
    with the specific name package-info.java. This file typically consists of a documentation
    comment plus one line identifying the package and its location, like so:


    ```

    documentation comment

    package full.path.to.packageName;

    ```'
