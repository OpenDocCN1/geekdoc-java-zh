- md: "\n# 84 Quick Java\n\n```java\nstatic double feetToMiles(double feet) {\n  \
    \  return feet / 5280.0;\n}\n```\n\n## 4.1.11 Escaping Static\n\nJava is object-oriented,\
    \ not \"class-oriented\". That is, objects are used a lot, and classes are used\
    \ almost entirely for defining and creating objects.\n\nHowever, a Java program\
    \ always begins in a \"static context\", the public static void main(String[]\
    \ args) method. Because it is static, it cannot use instance variables or instance\
    \ methods (which belong to some object, or \"instance\").\n\nIf what you want\
    \ to do is simple enough, you might want to just write one class with a handful\
    \ of methods. In that case, you can make every method and field static, but this\
    \ is getting annoying in a hurry. Alternatively, you can create one object of\
    \ the class that you are in, and call a non-static method on that object. That\
    \ is what we did very early in this book.\n\n```java\npublic class MyClass {\n\
    \    public static void main(String[] args) {\n        new MyClass().run();\n\
    \    }\n    void run() {\n        System.out.println(\"Hello World\");\n    }\n\
    }\n```\n\nThis program starts, as does every Java program, in the static method\
    \ main. Then it creates a new MyClass object and immediately calls that object's\
    \ run method. Everything else can proceed from the run method, and you are no\
    \ longer forced to make everything static. (I used the name \"run\" for this method,\
    \ but you can name it whatever you like.)\n\n## 4.1.12 The Main Method\n\nWe are\
    \ now in a position to explain the absurdly complex main method. It looks like\
    \ this:\n\n```java\npublic class MyClass {\n    public static void main(String[]\
    \ args) { ... }\n}\n```\n\nThe name of the class is MyClass, so it must be in\
    \ a file named MyClass.java. Compiling it results in a new file, MyClass.class,\
    \ which is ready to execute. From your favorite operating system, you or your\
    \ IDE tries to execute this file. How?\n\n- **public**: the class and the method\
    \ must both be public, that is, available from anywhere. In particular, it has\
    \ to be available to your operating system.\n- **static**: compiling the program\
    \ defines the class MyClass (and any other classes in your program), but there\
    \ are no objects yet, just classes. Since there are no objects, neither are there\
    \ any instance methods. But the main method is static and it belongs to the class\
    \ MyClass, which does already exist. Therefore, the operating system can send\
    \ the message to the class MyClass.\n- **void**: the main method does not return\
    \ a result.\n- **main**: the operating system always starts a Java program by\
    \ sending it the message main(arguments), since it is trying to run a program\
    \ on the file name MyClass.class (compiled from MyClass.java), it sends the message\
    \ to the class MyClass.\n- **More than one class can have a main method**, so\
    \ you can have more than one possible starting point in a program. For example,\
    \ you might have one program to both encode and decode messages and have a main\
    \ method in both an Encoder class and a Decoder class.\n- **(String[]) args**:\
    \ the main method can take arguments, either from the command line or from the\
    \ IDE. Arguments are separated by spaces, and code can be as strings. It's okay\
    \ if there are no arguments—zero-length arrays are legal in Java.\n\nAs an example\
    \ of the simplest Java programs you can have, suppose you have the following program\
    \ on a file named MyClass.java in a folder named MyPackage:\n\n```java\npackage\
    \ myPackage;\npublic class MyClass {\n    public static void main(String[] args)\
    \ {\n        System.out.println(args[0] + args[1]);\n    }\n}\n```\n\nIf you are\
    \ in a folder/directory containing the folder myPackage, you can compile this\
    \ program with:\n\n```bash\njavac myPackage/MyClass.java\n```\n\nYou can run it\
    \ by saying:\n\n```bash\njava myPackage/MyClass abc 123\n```\n\nAnd the result\
    \ will be:\n\nabc123\n\n## 4.1.13 A More Complete Example\n\nThe following is\
    \ a complete, if rather pointless, example of a program that uses classes and\
    \ objects.\n\nThis code is in a file named Counter.java, in a folder (directory)\
    \ named tools. The names of folders and files must exactly match the names of\
    \ packages and classes. (Your IDE will take care of this for you.) There may be,\
    \ and probably are, other classes in this same package/folder.\n\n```java\npackage\
    \ tools;\n/**\n * A simple counter class\n */\npublic class Counter {\n    private\
    \ int count; // a field\n\n    /** Constructor to make a Counter\n     * object\
    \ with an initial value.\n     */\n    public Counter(int initial) {\n       \
    \ count = initial;\n    }\n\n    /** increments the counter by n. */\n    public\
    \ void bump(int n) {\n        count += n;\n    }\n\n    /** increments the counter\
    \ by 1. */\n    public void bump() {\n        bump(1);\n    }\n\n    /** returns\
    \ the value of the counter. */\n    public int getCount() {\n        return count;\n\
    \    }\n}\n```\n\nThe class describes a new type, the Counter type.\n\nThe class\
    \ has one field, int count. Every object made from this class will have its own\
    \ count field, so you can have multiple counters keeping track of different values.\
    \ The constructor takes a parameter initial to use the value of count.\n\nThe\
    \ class has three methods, two named bump and one named get. These are declared\
    \ public so they can be used from outside the package. The bump() method adds\
    \ 1 to the count field, while the bump(int n) method adds n to the count field;\
    \ neither returns a value. The getCount returns the current value of count.\n\n\
    To complete the example, let's write a program to test our Counter class.\n\n\
    ```java\npackage tool;\nimport tools.*;\n\npublic class CounterTest {\n    public\
    \ static void main(String[] args) {\n        Counter c1 = new Counter(0);\n  \
    \      Counter c2 = new Counter(100);\n        c1.bump(2);\n        c1.bump(8);\n\
    \        c2.bump(100);\n        System.out.println(c1.getCount() + \" , \" + c2.getCount());\n\
    \    }\n}\n```\n\nThis class is in a separate folder, named toolUser. The second\
    \ line says to import, or make available, everything in the tools package.\n\n\
    The package and import statements go at the beginning of the file.\n\n## 4.2 INHERANCE\n\
    \nClasses form a treelike hierarchy, with Object at the root. Every class, except\
    \ Object, one and only one immediate superclass. The keyword extends denotes the\
    \ immediate superclass.\n\nWhen you define a class you can specify its superclass.\
    \ If you don't specify a superclass, Object is assumed. Thus, the following are\
    \ equivalent:\n\n```java\nclass Person { ... }\nclass Person extends Object {\
    \ ... }\n```\n\nClasses inherit all the fields and methods of their superclasses.\
    \ Every class has not only its own fields and methods but also every field and\
    \ method available to all its superclasses. Hence, a class may contain much more\
    \ information than is obvious from the class definition.\n\nFor example, if you\
    \ have a Person class that has a name field, and you write a Customer class that\
    \ extends Person, then every Customer object also has a name field. If your Person\
    \ class has a visit method, then every Customer object also has a visit method.\n\
    \nInherited methods can be overridden (replaced) by declaring a method with the\
    \ same name and the same number and types of parameters; see 4.4 for more details.\n\
    \nConstructors are not inherited.\n\n## 4.3 CASTING OBJECTS\n\nRecall that numeric\
    \ values can be cast (converted) from one type to another. An int value can be\
    \ put into a double variable with no trouble because a double is in some sense\
    \ “wider” than an int. But to put a double value into an int variable, it must\
    \ be explicitly cast to an int by putting (int) in front of the variable; for\
    \ example, int pi = (int) Math.PI.\n\nSmartly, objects of one type can be put\
    \ into a variable of a different type if and only one of the types is an ancestor\
    \ (superclass) of the other. Upcasting is casting to an ancestor type, and can\
    \ happen automatically; downcasting is casting to a descendant type, and an explicit\
    \ cast is required. For example, if BirthdayCake extends Cake and Cake extends\
    \ Object, then the following assignments are possible:\n\n```java\nBirthdayCake\
    \ myCake = new BirthdayCake();\nCake cake = myCake;\nObject obj = myCake;\n```\n"
  mdcn: "\n\n# 84 快速 Java\n\n```java\nstatic double feetToMiles(double feet) {\n \
