    \ it has these characteristics.\n\nBasic operation is as follows:\n\n+   1. Create\
    \ a new PropertySupportObject(bean), where bean is the object to be “watched”\
    \ or listened to.\\n2. Each time the bean completes an update, it should send\
    \ the message firePropertyChange(propertyName, oldValue, newValue) to the PropertySupportObject.\
    \ This is probably best done within the bean itself.\n    - The propertyName is\
    \ a String, the oldValue and newValue are the values of the bean object, or some\
    \ part of it.\\n    - This method will only cause a PropertyChangeEvent to occur\
    \ if the oldValue and the newValue are different.\n\n+   3. To add a listener\
    \ to the bean, send the message PropertyChangeListener(listener) to the PropertySupportObject.\
    \ Any number of listeners may be added.\n\n+   4. To listen to a bean, a class\
    \ must implement PropertyChangeListener, and override the inherited public void\
    \ propertyChange(PropertyChangeEvent event) method.\\n    - The event parameter\
    \ is the accessible fields event.propertyName, event.oldValue, and event.newValue.\
    \ The latter two are of type Object, so should be cast to the desired type.\n\n\
    It isn’t necessary for a class to have all the bean characteristics in order to\
