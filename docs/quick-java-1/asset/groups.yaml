    ## 5.2.2.5 Booleans


    Booleans are simple. There are only two boolean values, true and false. The static
    method Boolean.toString(boolean) will return one of the strings "true" or "false".


    If you have been programming in a language that allows integers to stand for booleans
    (for example, using 0 to mean "false"), that doesn''t work in Java.


    There is a method Boolean.parseBoolean(string), but it is equivalent to the simpler
    string.equals("true").


    ## 5.2.2.6 Other Primitives


    Here are the four primitive types:


    - A long is a 64-bit integer that can be up to about nineteen digits (plus minus
    nine quintillion). To write a literal long value, suffix it with L. Numbers with
    this many digits are best written with underscores; for example, 146_603_833_310_800L.

    - A short is a 16-bit integer in the range -32_768 to 32_767.

    - A byte is an 8-bit integer in the range -128 to 127.

    - A float is a 32-bit "real" (floating point) number with only about 8 digits
    of accuracy and a much smaller range of values.


    These additional primitive types exist for the purpose of saving storage or, in
    the case of long, for dealing with very large integers.


    > Note: For integer values too large even for long variables, there is a java.math.BigInteger
    class; see section 10.5 for an example that uses this class.


    Numeric types are ordered from “wider” to “narrower”: double, float, long, int,
    char, short, byte. A value of one type can be assigned to a variable of a wider
    type: floats to doubles, and so on.


    A value of one type may not “fit” into a narrower type; bits could be lost. To
    ensure that the programmer realizes to make this assignment, Java requires an
    explicit cast. Casting does not prevent errors, it just allows a questionable
    assignment. For example, the case (byte)250 is legal, and results in the value
    -6.


    Most arithmetic on short or byte values is done by promoting the values to int
