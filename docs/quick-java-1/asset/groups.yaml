    # The “Inner Language” of Java


    A JAVA PROGRAM CONSISTS OF ONE OR MORE CLASSES. This book uses “inner language,”
    to mean what happens within a single, top-level class. For simple programs, one
    class may be all that is needed.


    # 3.1 VARIABLES AND NAMING CONVENTIONS


    A variable is a name that can be assigned a value. A variable can have different
    values at different times.


    All variables must be declared. When a variable is declared, it is given a type
    that tells what kind of values it can have. It may also be given an initial value.
    An int variable can only have an integer value, a String variable can only have
    a character string as its value, and so on.


    Java is case-sensitive; that is, result, Result and RESULT are three different
    names. The names of the primitive types (int, double, etc.) are all lowercase,
    while object type names such as String are capitalized.


    An instance variable is one that is declared in a class but a separate copy of
    it is “owned” by each individual instance, or object, of that class.'
  - '[PAGE 38]


    # 18 ■ Quick Java


    A class variable, or static variable, is declared in a class using the keyword
    static. There is only one of it, not one object, and it is considered to be “owned”
    by the class itself, not by the individual objects.


    A local variable is one that is declared within a method. It is available only
    within method. Parameters to a method are also local to that method.


    A constant is a “variable” whose value cannot be changed. It is indicated by adding
    the keyword final.


    Many kinds of things in Java have names, not just variables. Proper naming and
    capitalization helps the experienced Java programmer know what kind of thing is
    being named. There are strong conventions for names:


    +   - Variable names and method names are almost abbreviated: Use employee rather
    than emp; use yearEndBonus than yebonos. (However, very common abbreviations can
    be used, as max and min.)


    +   - Variable names and method names always begin with a lowercase letter.


    +   - Variable names and class names are usually nouns. Method names are usually
    verbs, or begin with a verb.


    +   - If a name consists of multiple words, the first letter of all words except
    the first is capitalized, for example, firstName, totalCost. (One common name
    for this style is camelCase.)


    +   - Although legal, variable names never contain the underscore (unless they
    are constants) or the dollar sign.


    +   - In Java 9 and later, underscores in names are discouraged (except constants),
    and an underscore by itself is not a legal name.


    +   - The names of constants are written in all capital letters. If the constant
    name consists of multiple words, underscores are used between the words. For example,
    END_OF_LINE_MARKER.


    +   - Class names and interface names always begin with a capital letter, and
    multiword names are camel case.'
