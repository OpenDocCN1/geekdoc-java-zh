    The equals method should define an equivalence relation. That is, it should have
    the following three properties for any objects obj1 and obj2:


    +   - Reflexive: obj1.equals(obj1) should always be true.


    +   - Symmetric: obj1.equals(obj2) should always give the same result as obj2.equals(obj1).


    +   - Transitive: If obj1.equals(obj2) and obj2.equals(obj3), then it should be
    the case that obj1.equals(obj3).


    Unfortunately, symmetry can only be "mostly" achieved. If obj1 is an object but
    obj2 is null, obj1.equals(obj2) should give false, but obj2.equals(obj1) would
    result in a NullPointerException. Symmetry could be achieved by making both of
    these result in a NullPointerException, but that hardly seems useful.


    Fortunately, any reasonable definition of equals is likely to satisfy these properties,
    insofar as they can be satisfied in Java.


