    # 3.2.6 Declarations and Casting


    Every variable must be declared, along with its type and an optional initial value.
    For example,


    +   - int count = 0, size;


    +   - double min, max, average;


    +   - char c;


    Java will complain if it thinks you might be using a variable before it has been
    given a value. If Java doesn''t catch this mistake, the value used will be zero
    for numeric types or for booleans.


    A char variable can hold any of about 65000 UTF-16 characters (see section 5.2.2.4).
    Characters are stored internally as numbers, and can be used in arithmetic as
    they are integers. You can write a UTF-16 character in hexadecimal as ''\uxxxx'',
    where xxxx is a hexadecimal number in the range ''\u0000'' to ''\ffff''. For example,
    ''\u0041'' is ''A'', and ''\u03A3'' is ''Σ''.


    Among the above types, a double is considered to be wider than an int, and an
    int is wider than a char. A value of one type can be assigned to a variable of
    a wider type. That is, a char value can be assigned to an int variable or a double
    variable, and an int variable can be assigned to a double variable. This is called
    upcasting.


    To go in the other direction, that is, to assign a wider value to a narrower type
    of variable, you must cast (or downcast) to the desired type. Do this by putting
    the name of the desired type in parentheses immediately before the value. For
    example,


    ```

    int i = 0;

    d d = 2.71828;

    i = (int)d;

    System.out.println(i); // prints 2

    ```


    In the above example, the fractional part is lost.'
