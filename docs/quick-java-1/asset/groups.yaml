    # 3.4.1 Some Useful Objects


    Every Java program must have at least one class, and that class must have a public
    static void main(String[] args) method, which is where the program begins execution.
    Before we get into writing any additional classes (what I refer to as the “outer
    language” of Java), this section will introduce several predefined classes.


    Java provides a large number of packages, containing a very large number of already
    written and tested classes. This is great, because it means a lot of good code
    is ready for your use; but it also means you need to learn your way around these
    packages. For starters, there are two main packages you need to know about:


    +   * lang contains the most fundamental classes, and is automatically imported
    into any program you write.


    +   * java.util contains most of the data structures you will need.


    # 3.4.1.1 String Objects


    A string is a sequence of zero or more characters. Instead of calling a constructor,
    as is done with most objects, a string is created by putting characters inside
    double quote marks. Other than that, a string is an ordinary object. The data
    are the characters in the string, and there are a few dozen methods for working
    with that string.


    For example, suppose you have


    ```

    String language = "Java";

    ```


    You can get the length of this string by using the length() method:


    ```

    int numChars = language.length();

    ```


    To send a message to an object: Name the object, put a dot, then say what method
    you want the object to execute, and what arguments (if any) the method needs.'
