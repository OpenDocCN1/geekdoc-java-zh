    # 5.2.2.11 Regular Expressions


    A regular expression describes a pattern that describes some number of strings.
    For example, the regular expression c[au]t describes the three words "cat,"cot,"
    and "cut." Regular expressions can be used to test, search, and manipulate strings.


    Regular expressions are highly standardized and are available in many programming
    languages. If you are familiar with regular expressions, this section will tell
    you how to use them in Java; but if not, you can still use the methods with strings
    that do not contain punctuation.


    Java has a java.util.regex.Pattern class, but several methods in the String class
    take a properly formatted string (written below as regex) and treat it as if it
    were a regular expression. These methods are:'
  - '[PAGE 137]


