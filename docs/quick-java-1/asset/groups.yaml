    \ an initial value, tests a boolean condition, executes a statement if the condition\
    \ is true, executes an update, and returns to the test. It exits when the test\
    \ returns false.\n\n```\nfor (int i = 10; i > 0; i = i - 1) {\nSystem.out.println(i);\n\
    }\nSystem.out.println(\"Blast off!\");\n```\n\n> Note: The above statements require\
