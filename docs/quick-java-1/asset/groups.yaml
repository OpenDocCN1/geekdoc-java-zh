- md: "\n# Unit Testing\n\n## 7.1 PHILOSOPHY\n\nTesting is an essential part of programming.\
    \ You can do *ad hoc* testing (testing whatever occurs to you at the moment),\
    \ or you can build a *test suite* (a thorough set of tests that can be run at\
    \ any time).\n\nPeople naturally want to minimize effort, and building a test\
    \ suite is additional effort. However, experiments repeatedly show that writing\
    \ test suites takes less time and effort than debugging without a test suite,\
    \ and results in far more reliable code. In addition, the existence of a test\
    \ suite makes it *much easier* to maintain and modify the program, particularly\
    \ after a few months have passed.\n\nBesides, debugging is ever less fun than\
    \ writing tests.\n\nDeadlines are often used as an excuse for not doing thorough\
    \ testing—“There isn't time!\" This is a flawed argument, since thorough testing\
    \ *reduces* total programming time.\n\nThat said, programmers are human, and they\
    \ will only do adequate testing if (1) the tests are easy to write, and even more\
    \ importantly, (2) the tests are effortless to run. A good *test framework* such\
    \ as JUnit makes both of these things possible.\n\nIt is very difficult to write\
    \ tests for methods that were not written testing in mind. To be testable:\n\n\
    - Methods should do only one thing, not a large variety of things. The simpler\
    \ the method, the simpler the test.\n\n- Methods should be as self-contained as\
    \ possible. They should not depend on context any more than absolutely necessary.\
    \ They should not require other methods to execute before one. Tests that can\
    \ run in isolation are much easier to write than those that require elaborate\
    \ setup.\n\n- Methods should absolutely not require any interaction with the programmer.\
    \ Tests that require more than a single button click to run will be much less\
    \ often, if at all.\n\n- Methods should not do any input/output. There are advanced\
    \ techniques, not covered here, for testing input/output methods without demanding\
    \ programmer interaction.\n\nFortunately, rules for writing testable methods are\
    \ also rules for a good programming style.\n\nIt is good practice to write the\
    \ tests for a method concurrently with writing the method. Some even advocate\
    \ the tests before writing the method, as this helps clarify what the method is\
    \ supposed to do.\n\nAfter a method has been written and tested, additional errors\
    \ may be discovered. There is a specific technique for dealing with this situation.\
    \ First, write a test that demonstrates the error; then fix it. This is useful\
    \ because, for whatever reason, some errors have a habit of recurring.\n\n## 7.2\
    \ WHAT TO TEST\n\nTesting should cover both the common cases and the edge cases,\
    \ where things are most likely to go wrong.\n\nFor example, if you have a method\
    \ isPrime to decide whether a number is a prime, you might decide to test whether\
    \ isPrime(28) is false and isPrime(29) is true. Having done that, it is probably\
    \ redundant and even a bit silly to also test whether isPrime(30) is false and\
    \ isPrime(31) is true.\n\nYou might, however, want to check that isPrime(15) is\
    \ false, in case the method somehow decides that all odd numbers are prime. It\
    \ is also worth checking that isPrime(2) is true, in the case the method decides\
    \ that all even numbers are non-prime. In fact, 2 is an edge case, since it is\
    \ the only prime number.\n\nAnother edge case is isPrime(1), which should be false.\
    \ Although it passes the general test (not divisible by any number other than\
    \ itself and 1), mathematicians define 1 not as a prime number.\n\nOther edge\
    \ cases are zero and negative numbers. Primality is not defined for these numbers,\
    \ the programmer must decide what to do in these cases (and preferably, test that\
    \ is what actually happens). If the decision is “that can’t happen anyway”, the\
    \ appropriate thing to do is to put the statement assert n > 0; at the beginning\
    \ of the isPrime method, and test that an inappropriate call throws an exception.\n\
    \n> Reminder: assert statements (see section 3.3.2.1) are “free” in that they\
    \ are treated just like comments, and do not add to code size or execution time,\
    \ unless they are explicitly enabled in the run time configuration setting.\n\n\
    ## 7.3 JUnit\n\nJUnit is a well-established test framework. To use it, here’s\
    \ the general approach:\n\n1. Define a class to hold the tests, and import the\
    \ test framework.\n2. Include any number of test methods, annotated (preceded)\
    \ by @Test.\n3. Include any number of test methods, annotated (preceded) by @BeforeEach.\n\
    4. Include any number of test methods, annotated (preceded) by @AfterEach.\n\n\
    It is good practice to write the tests for a method concurrently with writing\
    \ the method. Some even advocate the tests before writing the method, as this\
    \ helps clarify what the method is supposed to do.\n\nAfter a method has been\
    \ written and tested, additional errors may be discovered. There is a specific\
    \ technique for dealing with this situation. First, write a test that demonstrates\
    \ the error; then fix it. This is useful because, for whatever reason, some errors\
    \ have a habit of recurring.\n\n## 7.4 Assertions\n\nIf you want to verify the\
    \ result of a test, you use an assertion. JUnit provides a large number of assertions.\
    \ First, import:\n\n```java\nimport org.junit.jupiter.api.Assertions.*;\nimport\
    \ static org.junit.jupiter.api.Assumptions.*;\n```\n\nThe assertions available\
    \ for use include:\n\n- assertEquals(expected, actual) compares values of any\
    \ type.\n- assertEquals(expected, actual, delta) compares floating point numbers,\
    \ where delta is the absolute amount by which two numbers may differ.\n- assertArrayEquals(array1,\
    \ array2) compares two arrays. For arrays of objects this does a deep comparison.\n\
    - assertTrue(booleanExpression) and assertFalse(booleanExpression).\n- assertSame(object1,\
    \ object2) and assertNotSame(object1, object2) are tests of identity, that is,\
    \ whether object1 and object2 are references to the same object.\n- assertNull(object)\
    \ and assertNotNull(object).\n- assertTimeout(ms, function) fails if the function\
    \ (not method) takes longer than ms milliseconds.\n    Example: assertTimeout(100,\
    \ () -> slowMethod(x, y));\n- fail(message) and fail(exception).\n\nAll of these\
    \ tests except fail may take an optional message.\n\nNote: The fail method (which,\
    \ yes, causes the test to fail) is useful for writing tests that use complex logic.\n\
    \nA test method may contain as many assertions as desired. However, if one fails,\
    \ the remaining assertions in that method are not executed, so it is better not\
    \ to have too many. Instead, write additional test methods to test different aspects\
    \ of the method.\n\nIf you have a class containing a number of methods, most good\
    \ IDEs will write a skeletal test class for you, so that you only have to add\
    \ the assertions.\n\nA test class may also contain unannotated methods. These\
    \ are ignored by JUnit but may be used by the test methods.\n\n## 7.5 TESTING\
    \ EXCEPTIONS\n\nIf a method might throw an exception, you should test whether\
    \ it does throw exception when it should. However, the obvious way of writing\
    \ the test does not work.\n\n```java\nassertThrows(exception, methodCall); //\
    \ wrong!\n```\n\nThe problem is that the parameters to assertThrows are evaluated\
    \ before the method is called, so if the methodCall throws an exception, assertThrows\
    \ never gets a chance to catch and deal with it.\n\nThere are two ways to solve\
    \ this problem. The more convenient way, in modern Java, is for the second argument\
    \ to assertThrows to be a function that calls the method. Like so:\n\n```java\n\
    assertThrows(exception, () -> methodCall);\n```\n\nThis works because the function\
    \ is passed to assertThrows, which executes the function to cause the exception\
    \ to happen. For example,\n\n```java\nassertThrows(ArithmeticException.class,\
    \ () -> divide(0, 0));\n```\n"
  mdcn: "\n\n# 单元测试\n\n## 7.1 哲学\n\n测试是编程中不可或缺的一部分。你可以进行*临时测试*（随手对当时想到的内容进行测试），也可以构建一个*测试套件*（一组可以随时运行的详尽测试）。\n\
    \n人们天性地希望尽量减少努力，而构建测试套件需要额外的投入。然而，实验反复证明，编写测试套件花费的时间和精力比没有测试套件的情况下进行调试要少，而且能产生更可靠的代码。此外，测试套件的存在使得维护和修改程序变得*容易得多*，特别是在几个月之后。\n\
    \n此外，调试总是比写测试没趣。\n\n截止日期（Deadlines）经常被用作不进行彻底测试的借口——“没时间！”这是一个错误的论点，因为彻底的测试会*减少*总的编程时间。\n\
    \n尽管如此，程序员也是人，他们只有在满足以下条件时 (1) 测试易于编写，更重要的是 (2) 测试运行毫不费力，才会进行适当的测试。一个良好的*测试框架*（如\
    \ JUnit）使得这两点都成为可能。\n\n为那些编写时没有考虑到测试的方法编写测试是非常困难的。为了具有可测试性：\n\n- 方法应该只做一件事，而不是做许多事情。方法越简单，测试就越简单。\n\
    \n- 方法应该尽可能自包含。它们对上下文的依赖不应超过绝对必要。它们不应该要求在执行自己之前先执行其他方法。可以独立运行的测试比需要复杂设置的测试容易编写得多。\n\
    \n- 方法绝对不应该与程序员进行任何交互。需要点击多次按钮才能运行的测试频率会低得多，甚至根本不会出现。\n\n- 方法不应该进行任何输入/输出。这里没有介绍的高级技术，这些技术可以在不要求程序员交互的情况下测试输入/输出方法。\n\
    \n幸运的是，编写可测试方法的规则也是良好编程风格的规则。\n\n在编写方法的同时为该方法编写测试是一种良好的实践。有些人甚至主张在编写方法之前编写测试，这有助于明确该方法应该的功能。\n\
    \n在方法被编写和测试之后，可能会发现额外的错误。处理这种这种情况有一种特定的技术。首先，编写一个能演示该错误的测试；然后修复它。这是很有用的，因为出于某种原因，某些错误有反复出现的习惯。\n\
    \n## 7.2 测试什么\n\n测试应该同时涵盖常见情况和边缘情况（后者是最容易出错的地方）。\n\n例如，如果你有一个方法 `isPrime` 用来判断一个数是否为素数，你可能决定测试\
    \ `isPrime(28)` 是否为假以及 `isPrime(29)` 是否为真。完成这些后，再测试 `isPrime(30)` 是否为假以及 `isPrime(31)`\
    \ 是否为真可能是多余的，甚至显得有点愚蠢。\n\n然而，你可能想检查 `isPrime(15)` 是否为假，以防方法以某种方式认为所有奇数都是素数。检查\
    \ `isPrime(2)` 是否为真也是值得的，以防方法认为所有偶数都不是素数。事实上，2 是一个边缘情况，因为它是唯一的素数。\n\n另一个边缘情况是\
    \ `isPrime(1)`，它应该为假。尽管它通过了通用测试（不能被自己和 1 以外的任何数整除），但数学家并没有将 1 定义为素数。\n\n其他边缘情况是零和负数。这些数没有定义素性，程序员必须决定在这些情况下怎么做（并且最好测试实际发生了了什么）。如果决定是“那根本不会发生”，适当的做法是在\
    \ `isPrime` 方法的开头放置 `assert n > 0;` 语句，并测试不当调用是否抛出异常。\n\n> 提醒：assert 语句（见第 3.3.2.1\
    \ 节）是“免费”的，因为它们被像注释一样对待。\n\n## 7.3 JUnit\n\nJUnit 是一个成熟的测试框架。要使用它，通用方法是：\n\n1.\
    \ 定义一个类来存放测试。\n2. 包含带有 `@Test` 注解的方法。\n3. 包含带有 `@BeforeEach` 注解的方法。\n4. 包含带有 `@AfterEach`\
    \ 注解的方法。\n\n在编写方法的同时为该方法编写测试 是一项良好的实践。有些人甚至主张在编写方法之前编写测试，这有助于明确该方法应该的功能。\n\n在方法被编写和测试之后，可能会发现额外的错误。处理这种情况有一种特定的技术。首先，编写一个能演示该错误的测试；然后修复它。这是很有用的，因为出于某种原因，某些错误有反复出现的习惯。\n\
    \n## 7.4 断言 (Assertions)\n\n如果你想验证结果，请使用断言。JUnit 提供了大量的断言。首先，导入：\n\n```java\n\
    import org.junit.jupiter.api.Assertions.*;\nimport static org.junit.jupiter.api.Assumptions.*;\n\
    ```\n\n可用的断言包括：\n\n- `assertEquals(expected, actual)` 比较任意类型。\n- `assertEquals(expected,\
    \ actual, delta)` 比较浮点数，其中 `delta` 是两个数字之间的绝对差异。\n- `assertArrayEquals(array1,\
    \ array2)` 比较数组。对于对象数组，它执行深度比较。\n- `assertTrue(booleanExpression)` 和 `assertFalse(booleanExpression)`。\n\
    - `assertSame(object1, object2)` 和 `assertNotSame(object1, object2)` 用于身份测试，即\
    \ object1 和 object2 是否引用同一个对象。\n- `assertNull(object)` 和 `assertNotNull(object)`。\n\
    - `assertTimeout(ms, function)` 如果函数（方法）运行时间超过 `ms` 毫秒，则失败。\n    示例：`assertTimeout(100,\
    \ () -> slowMethod(x, y));`\n- `fail(message)` 和 `fail(exception)`。\n\n所有这些测试除\
    \ `fail` 外，都可以接受一个可选的消息。\n\n注意：`fail` 方法（是的，它会导致测试失败）对于编写使用复杂逻辑的测试很有用。\n\n一个测试方法可以包含任意数量的断言。然而，如果其中一个失败，该方法中的其余断言将不会执行，因此最好不要有太多。相反，应编写额外的测试方法来测试方法的不同方面。\n\
    \n如果你有一个包含许多方法的类，大多数良好的 IDE 都会为你编写一个骨架测试类，这样你只需要添加断言即可。\n\n测试类也可以包含未注解的方法。这些方法会被\
    \ JUnit 忽略，但可以被测试方法调用。\n\n## 7.5 测试异常\n\n如果一个方法可能会抛出异常，你应该测试它在应该抛出时是否确实抛出了。然而，明显的测试写法不起作用。\n\
    \n```java\nassertThrows(exception, methodCall); // 错误！\n```\n\n问题在于 `assertThrows`\
    \ 的参数在调用方法之前就会被求值，所以如果 `methodCall` 抛出了异常，`assertThrows` 就没有机会捕获并处理它。\n\n解决这个问题有两种方法。在现代\
    \ Java 中，更方便的方法是 `assertThrows` 的第二个参数是一个调用方法的函数。如下所示：\n\n```java\nassertThrows(exception,\
    \ () -> methodCall);\n```\n\n这种方法有效，是因为函数被传递给了 `assertThrows`，由它执行该函数以导致异常的发生。例如：\n\
    \n```java\nassertThrows(ArithmeticException.class, () -> divide(0, 0));\n```\n\
    \n"
