    ## 3.4.1.4 Console


    The java.io.Console provides a much simpler way to read input from the user than
    the Scanner class, but it has a significant disadvantage: It requires the presence
    of an interactive “console.” Depending on how the Java program is being executed,
    a console may or not be present. In many cases, Console can be used when running
    from the command line, but not when running from an IDE.


    The constructor call new Console() will return null if no console is available.
    Otherwise, here are some of the operations available on the new console:


    - readLine() returns one line, as a string.

    - readLine(formatString, value, ..., value) formats and displays a string to be
    used as a prompt, then reads and returns one line.

    - Format strings are described in section 5.2.2.10. A plain string, with no interpolated
    values, can also be used.


    ## 62 ■ Quick Java


    - readPassword() returns one line in a character array (that is, a char[]), without
    displaying what is typed.

    - readPassword(formatString, value, ..., value) formats and displays a string
    to be used as a prompt, then reads and returns one undisplayed line in a character
    array. A plain string can also be used.

    - printf(formatString, value, ..., value) formats and displays a string.

    - writer() returns a PrintWriter associated with this console.

    - A Console object does not itself have print and println methods, but these messages
    can be sent to the PrintWriter returned by writer().


    ## 3.4.15 Objects, Generics, and Stacks


    The most general type of object is Object. If you declare an array of Object,
    you can put any kind of object into it—stacks, threads, whatever. Or you can be
    more specific, and declare an array of (for example) String, and the array can
    then hold only strings.


    Along arrays, Java has various types of Collections: Stacks, Lists, HashMaps,
    and so on. Originally, any type of object could be pushed onto a Collection, and
    there was no way to be more specific. When you got a value out of the collection,
    you got an Object, and had to cast it to the correct type. For backwards compatibility,
    this style is still allowed.


    For example, Java has a Stack type (in the java.util package), with operations
    push and pop (among others).


    ```

    Stack stuff = new Stack();

    stuff.push("abacadabra");

    stuff.push(new File("abc.txt"));

    File foo = (File)stuff.pop();

    String spell = (String)stuff.pop();

    ```


    In modern code, it is preferable to be specific about what type of values are
    put into a stack. This is done by using type parameters, or generics. The type
    parameter is put into angle brackets after the object type.


    ## The “Inner Language” of Java ■ 63


    Stack<String> words = new Stack<String>();

    words.push("abracabra");

    words.push(new File("abc.txt")); // not legal


    To minimize redundancy, the type parameter in the definition (that is, after the
    word new can be an empty “diamond,” <>).


    Stack<String> words = new Stack<>();


    Note: In the version of Java I am using, apparently even the “diamond” can be
    omitted, but this is not an announced feature of Java.


    As an added bonus, when you retrieve an object from a genericized collection,
    you no longer have to cast it to the correct type.


    String word = words.pop();


    The genericized type name can be used wherever an “ordinary” type name can be
    used, such as in the declaration of a method. For example,


    ```

    int find(String target,

    Stack<String> words) { ... }

    ```


    ## 3.4.1.6 Maps


    One of the most useful objects is a lookup table, or dictionary; it associates
    keys with values. For a contact list, the key might be a person’s name, and the
    value that person’s phone number.


    ```

    HashMap<String, Integer> phones = new HashMap<>();

    phones.put("Joan", 555-1212);

    ```


    Note: The above works because, although a primitive cannot be used where an object
    is required, Java will “wrap” the int value 555-1212 into an Integer object.


    A HashMap is a particular kind of Map which supports extremely fast lookups. Any
    object types can be used as keys.


    Note: If the keys are user-defined objects which have a user-defined equals method,
    then those objects must also have a user-defined hashCode method that gives equal
    hash codes for equal objects.


    A few of the important operations on a HashMap:


    - map.put(key, value) — adds the key/value pair to the map, possibly replacing
    a previous value.

    - map.putIfAbsent(key, value) — adds the key/value pair to the map, unless the
    key is already in with a non-null value.

    - map.get(key) — returns the value associated with the key, or null if the key
    isn''t in the map.

    - map.OrDefault(key, defaultValue) — returns the value associated with the key,
    or defaultValue if the key isn''t in the map.

    - map.size() — returns the number of key/value pairs in the map.

    - map.clear() — removes all entries from the map.

    - map.remove(key) — deletes the key and its associated value from the map.

    - map.keySet() — returns a Set “view” of all the keys in map.


    Note: A View is like a “window” into the object, and changes as the object changes.
    In the above, the Set returned by keySet can be used just like an “ordinary” set,
    except that changing the map will change the values.


