    \    }\n}\n```\n\nBecause anonymous inner classes occur within a method, they\
    \ break up the flow and add several lines to the method. Consequently, the actual\
    \ code within an anonymous inner class should be kept very short.\n\n# 5.3.6 Enums\n\
    \nAn enumeration is a kind of class. It has a superclass, Enum, from which it\
    \ inherits some methods. An enum has all the features of an “ordinary” class (fields,\
    \ constructors, methods, etc.), except that an enum has a fixed, finite number\
    \ of instances (objects) of the class, defined directly within the class itself.\
    \ In other words, when you define an enum, you define all its possible values,\
    \ and you cannot later create additional values.\n\nAn enum is appropriate when\
    \ you need a variable that represents one of a fixed set of values—for example,\
    \ the months of a year. They provide type safety: You cannot, for instance, assign\
    \ a Coin value to a Month variable.\n\nThe simplest form of enum consists of a\
    \ list of constants, each of which is one of the values of the enum. For example,\n\
    \n```java\nenum Weekday { SUN, MON, TUE, WED, THU, FRI, SAT }\n```\n\nMore books:\
    \ https://t.me/booksforits\n\n# 134 Quick Java\n\nThis example defines the type\
    \ Weekday and seven instances (values) of that type. Each of these is a unique\
    \ constant. Because they are unique, it is safe to compare them with == as well\
    \ as the equals method.\n\nIn the Weekday example, each of the instances (SUN,\
    \ MON, etc.) has been created by (implicitly) calling the default Weekday constructor.\
    \ As any class, you can write your own constructors; however, (1) those constructors\
    \ will be private, and (2) you call them, not by saying new, by giving the instance\
    \ name followed by a parameter list. For example,\n\n```java\npublic enum Coin\
    \ {\n    private final int value;\n    PENNY(1), NICKEL(5), DIME(10), QUARTER(25);\n\
    \    Coin(int value) { this.value = value; }\n    public int value() { return\
    \ value; }\n}\n```\n\nIn the above,\n\n- value is a field. It is a constant, but\
    \ it can be a different constant for each instance of the enum.\n- PENNY(1), NICKEL(5)\
    \ and so on, are constants, created by calls to the constructor. They must precede\
    \ constructors and methods in the enum.\n- Coin(int value) is a private constructor\
    \ that assigns a number to the value field.\n- value() is an ordinary method.\n\
    \nSome inherited methods you can use with enumerations are:\n\n- boolean equals(Object\
    \ obj) tests if this enum object is equal to obj.\n- String toString() returns\
    \ the printable name of this object, for example, \"PENNY\".\n- int ordinal()\
    \ returns the position of this object in the enumeration (starting from 0).\n\n\
    # Advanced Java ■ 135\n\n- static EnumType valueOf(String name) returns the object\
    \ whose printable name is name.\n- static EnumType[] values() returns an array\
    \ of all instances of this EnumType.\n\n# 5.3.7 Records\n\nA record is a kind\
    \ of class, available in Java since version 14. The purpose is to encapsulate\
    \ a small amount of constant data in a full-featured class. As an example,\n\n\
    ```java\nrecord Range(int min, int max) {\n```\n\nThe above is a complete record\
    \ declaration; you don't need to put anything inside the braces (although you\
    \ may wish to).\n\nFor this declaration, the compiler will generate a complete\
    \ class with:\n\n- Two private final int fields named min and max,\n- a constructor\
    \ with min and max as parameters,\n- the getter methods min() and max(), and\n\
    - the methods equals(object), hashCode(), and toString().\n\nYou can replace the\
    \ default constructor with your own, using the usual syntax for constructors.\
    \ Another option is to write a compact constructor.\n\n```java\npublic Range {\n\
    \    assert min <= max;\n}\n```\n\nA compact constructor gets its parameters from\
    \ the record declaration, and automatically saves them as private final fields.\n\
    \nYou can override any or all of the generated methods with your own, long as\
    \ they have the same signature. You can also add fields, initializers, and methods,\
    \ but they must all be static.\n\nRecords may be inner classes or local to a method.\n\
    \n# 136 ■ Quick Java\n\n# 5.3.8 Serialization\n\nA serializable object is one\
    \ that can be converted to a sequence of bytes, usually so that it can be written\
    \ to file. To read it again, it has to be deserialized. In order for an object\
    \ to be serializable,\n\n- It must implement the java.io.Serializable interface.\
    \ This is a marker interface—one that doesn't list any methods, so none have to\
    \ be defined.\n- Strings, arrays, and wrapped primitives are all serializable,\
    \ as there are many Java-supplied objects such as HashMap. Check the Java documentation\
    \ if you are unsure\n- Every field of the object must be serializable or transient\
    \ (see below). To keep a field from being stored or sent across a network, mark\
    \ it transient. This is also used for fields whose value is derived from other\
    \ fields. Upon deserialization, transient fields are given a default value.\n\n\
    The basic approach to writing out an object\n\n```java\nFileOutputStream file\
    \ = new FileOutputStream(pathToFile);\nObjectOutputStream stream = new ObjectOutputStream(file);\n\
    stream.writeObject(object);\n```\n\nTo read a serialized object, the exact same\
    \ classes used by the object must be present. Here’s the basic approach to reading\
    \ an object.\n\n```java\nFileInputStream file = new FileInputStream(pathToFile);\n\
    ObjectInputStream stream = new ObjectInputStream(file);\nobject = (type) stream.readObject();\n\
    ```\n\nThese methods can throw an IOException or a ClassNotFoundException, so\
    \ these must be handled, and the stream and file should be closed after use.\n\
    \nIf the definitions of the relevant classes change after serialization, deserialized\
    \ results can be incorrect. To ensure consistency, the serialized class should\
    \ have a version number associated with it.\n\n```java\nprivate static final long\
    \ serialVersionUID = longValue;\n```\n\n# 5.3.9 Modules\n\nA package is a collection\
    \ of related classes. A very large program, however, may consist of hundreds of\
