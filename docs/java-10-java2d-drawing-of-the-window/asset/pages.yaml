    # 12.3 LACKS AND THINGS THAT COULD BE IMPROVED


    The graphs cannot display all numbers with a reasonable result, and some of the
    graphs, for example, are mistaken for negative numbers, especially if you merge
    graphs. For example, it does not make sense to stack bar charts if the numbers
    can be negative. The conclusion is that several of the graphs have preconditions,
    the drawing functions with advantage validate and possibly raise an exception
    if the graph cannot be drawn correctly. An alternative could be to let the Drawer
    classes return 0 if the graph cannot be drawn with a sufficiently nice result
    – a strategy that is already partially implemented.'
