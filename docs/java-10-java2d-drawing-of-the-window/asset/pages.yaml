    # 4 RENDERING


    In the previous chapter, I have discussed how to define geometric shapes. In this
    chapter I will look at how Java2D renders figures. That is how the followeling
    is:


    +   1. transformation

    2. compositing

    3. clipping

    4. rendering hints


    # 4.1 TRANSFORMATIONS


    A transformation is defined by the class AffineTransform, and an affine transformation
    is a transformation that preserves parallel lines. The class Graphics2D has an
    instance of AffineTransform applicable to all geometric shapes, when rendered.
    This transformation can be changed in two ways. One can partly replace it with
    another one:


    ```

    void setTransform(AffineTransform tr)

    ```


    and you can change the existing transformation


    ```

    void transform(AffineTransform Tx)

    ```


    It is generally recommended that you use the latter approach, and examples shows
    how. The class Graphics2D also has methods that directly perform simple transformations.
    There are four types of transformations


    +   - translation (there is a parallel displacement)

    - rotation (that rotates the figure around a point)

    - scaling (that scales a figure)

    - shearing (that shears a figure)


