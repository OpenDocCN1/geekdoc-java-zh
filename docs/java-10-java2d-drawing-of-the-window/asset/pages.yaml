  md: 'JAVA 10: JAVA2D, DRAWING OF THE

    WINDOW AND IMAGE PROCESSING INTRODUCTION


    # 1.1 THE CLASS GRAPHICS2D


    Before addressing the examples I will say a few words about the class Graphics2D
    and thus slightly concerning the technique.


    The process of drawing in a window is based on a number of objects as shapes,
    images, text, etc. that able you to determine which colors individuals on a screen
    or a printer should have, and this process is called rendering, and thus rendering
    is the process to show the results of graphics primitives on an output device.
    The class Graphics2D can be perceived as Java2D''s rendering engine. In addition
    a Graphics2D object represents a graphics surface in the form of a collection
    of pixels having a color. How the object converts primitives to the pixels and
    which colors they get are determined by the state of the object, which includes
    several concepts:


    +   1. *paint*, that determines which colors to use for drawing and filling a
    shape and also including text\2. *stroke*, indicating the thickness of the line
    that shapes are drawn by the method draw()

    3. *font* to indicate how text should be rendered

    4. *transformation* specifies which primitive graphical objects should be transformed
    (moved, rotated, stretched) before being rendered, including how the logical coordinates
    must be converted to physical coordinates (by default 72 logical coordinates are
    transformed to an an inch on the physical device)

    5. *compositing* using to determine how colors are to be combined with the existing
    color on the drawing surface

    6. *clipping*, which defines restrictions on the area to be rendered (default
    is null, which means the entire drawing surface)

    7. *rendering hints*, there are techniques that tells how objects should be rendered


    There are four general methods used for rendering geometric primitive:


    +   1. *fill()*, that fills the interior of a shape

    2. *draw()*, that draws the perimeter of a shape

    3. *drawString()*, that draws a text

    4. *drawImage()*, which is used to show an image'
