  md: '# # FILLING AND STROKING


    In the previous chapter, I described how Java2D defines geometric shapes, and
    how to draw them in a window. To draw a shape includes


    +   1. how should the figure''s circumference be drawn

    2. how should the interior of the figure be filled (if there is an interior)


    and both are the subject of this chapter.


    If you have a closed shape, such as a rectangle you can draw its perimeter with
    draw(),

    y you can fill the shape with fill(). In the window below is drawn two rectangles


    ![](img/6c4faa569f96988b2c15c2a846193c23_43_0.png)


    The goal is to show how the perimeter is drawn. The first rectangle is drawn as
    follows:


    ```

    Rectangle2D rect1 = new Rectangle2D.Double(20, 20, 200, 100);

    g2d.setPaint(Color.black);

    g2d.draw(rect1);

    g2d.setPaint(Color.yellow);

    g2d.fill(rect1);

    ```


    You should note that I first draw the perimeter and then fills the rectangle with
    a yellow

    color. The result is that the perimeter is overwritten at the top and to the left
    while is

    visible on the right and at the bottom. When the frame is, 4 straight lines are
    drawn:


    +   - a line from (20, 20) to (220, 20), that is the top edge

    - a line from (20, 20) to (20, 120), that is the left edge

    - a line from (20, 120) to (220, 120), that is the bottom edge

    - a line from (220, 20) to (220, 120), that is the right edge'
