  md: "# JAVA 10: JAVA2D, DRAWING OF THE\nWINDOW AND IMAGE PROCESSING\n\nThe actual\
    \ component ChartComponent can raise a single event if the user clicks on a graph.\n\
    The component is drawn on an object of the type MultiValues, and the component\n\
    could be extended as it fires a PropertyChangeEvent for a value if a property\
    \ is changed in\nthe Multi data structure. In practice, it would typically mean\
    \ that the component\nbe redrawn, and it could also be of significance to the\
    \ layout manager that contains\nthe component.\n\nAnother question is how easy\
    \ it is to expand the library with a new graph. If it is a\nwhole new graph for\
    \ a single-valued function, it's simple. In this case, the work consists\nprimarily\
    \ of writing a new Drawer derived from SingleDrawer, adding a new graph type\n\
    to GraphType and expanding the class DrawingFactory. In addition, the MergeDrawer\
    \ class\ncan be expanded (the method merge()) to know the new type. If graphs\
    \ of the new type\ncan be merged, a Drawer derived from MultiDrawer must also\
    \ be written, and the class\nMergeDrawer has to know this Drawer. Even more extensive\
    \ is the task, if the new graph\ntype can be merged with existing graphs, which\
    \ can both cause existing Drawer types to\be changed as well as possible new Drawer\
    \ classes to be written. The conclusion is that if\nthe library is expanded with\
    \ new graphs, which can be merged with existing graphs,\nwork can be quite extensive.\n\
    \nIt may be a good practice to improve the library corresponding to the above\
    \ and optionally\nexpand with a new graph type."
