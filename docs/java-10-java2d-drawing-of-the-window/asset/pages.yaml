    As regards the line.Stroke endpoints are three possibilities:


    +   1. BasicStroke.CAP_SQUARE (that is default)

    2. BasicStroke.CAP_ROUND

    3. BasicStroke.CAP_BUTT


    The first line (the black) is drawn with default values and otherwise a stroke
    at 19. Furthermore, there is drawn a rectangle that is the line''s circumscribing
    rectangle. Concerning the endpoints, the style is CAP_SQUARE that expands the
    line with a rectangle whose length is half the line thickness. The blue line has
    corresponding the endpoint CAP_ROUND that expands the line with a half-circle
    whose radius is half the line thickness. Finally, there is CAP_BUTT that is used
    by the green line and who simply do not expand the line.


    The three figures on the right have all type GeneralPath and is drawn with a stroke
    on 19 and the option CAP_SQUARE for the endpoints, and is also defined how the
    corners will be drawn. Again, there are three options:


    +   1. JOIN_MITER (that is default)

    2. JOIN_ROUND

    3. JOIN_BEVEL


