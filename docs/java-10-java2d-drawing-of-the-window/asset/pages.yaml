    # 2 SHAPES


    In this chapter I will show how to define and draw geometric shapes, what I already
    did with

    the examples above, for example a rectangle. Its type is Rectangle2D, but it is
    an abstract class,

    and there are two concrete derived classes, which are called respectively Rectangle2D.Float

    and Rectangle2D.Double. The difference is about the figure''s attributes and where
    they are

    defined by the type float or type double. This pattern is used for all primitive
    Shape objects.


    There is a helper class, called Point2D (and Point2D.Float and Point2D.Double)
    that represents

    a point. A Point2D object has no size and can not be rendered, and an object is
    used only

    to define attributes for other objects. The basic geometric classes are shown
    in the following

    figure, and they are all defined by a common interface called Shape. This interface
    defines

    a few methods I will mention


    +   - getBounds2D(), which returns a circumscribing rectangle

    - contains(), that tests where a point or rectangle is included in the shape

    - intersects(), that tests where a rectangel overlaps the current shape


