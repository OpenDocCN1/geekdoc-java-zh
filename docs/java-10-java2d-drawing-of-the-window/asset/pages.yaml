  md: '# JAVA 10: JAVA2D, DRAWING OF THE WINDOW AND IMAGE PROCESSING


    # INTRODUCTION


    When you write a program with a graphical user interface, the programming is based
    to a large extent use of finished classes for windows, buttons, fonts, etc. From
    the start, these classes were gathered in AWT and its subpackages, and the APIs
    could be seen as two layers of classes that could be called a user interface toolkit
    and a drawing toolkit, the first layer comprised of the classes for components
    and properties of the components, while the second layer consisted of classes
    for basic geometric tools that could draw lines and squares and manipulate the
    individual pixels. Later (starting with Java 2) AWT was split into two APIs in
    the form of Swing and Java2D. This book deals with Java2D and how you in Java
    can program 2-dimensional graphics and manipulate images.


    Like other Java APIs includes Java2D a very large number of classes, but overall
    these are classes for:


    +   1. Shapes, where you can create arbitrary geometric shapes as combinations
    of straight lines, curves, rectangles, ellipses and arcs.

    2. Stroking that defines lines should be drawn in terms of width, dashed or as
    a solid stroke. Furthermore, you can specify the corners will be drawn.

    3. Filling that specifies shapes are filled. You can specify a color, a pattern
    or a gradient fill, and in fact you can also use an image.

    4. Transformations, where everything that is drawn (shapes, images, text) can
    be stretched, scaled and rotated.

    5. Alpha compositing, is the process of combining a drawing with a background
    to create figures with an partial or full transparency.

    6. Clipping is the process for limiting the part of a shape to be drawn so as
    not to draw on an unwanted area of the window.

    7. Anti-aliasing is a technique to avoid uneven lines, where you can see the individual
    pixels.

    8. Text where you can manipulate the text in the same way as other geometric shapes.

    9. Color comprising classes and methods to represent colors, so they are hardware
    independent.

    10. Images that provide the ability to manipulate images in the same way as other
    geometric shapes. It also includes classes to read images from and save images
    in files.

    11. Image processing, which includes classes to manipulate the individual pixels
    in images.

    12. Animation, which are classes that make services available, so you can animate
    geometric shapes, text and images.'
