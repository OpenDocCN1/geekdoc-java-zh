  md: '# 11 MAINTENANCE OF PROGRAMS


    Most programs must be maintained over time. This is one of the reasons why program
    design and program quality play a major role as programs with an incomprehensible
    design and code that are difficult to read are at best it may be time consuming
    to maintain a program with a bad design.


    Many programs live for many years, and this requires a program to be maintained
    at intervals. One reason may be that the program contains errors, which should
    of course corrected. These are rarely the most difficult maintenance tasks, as
    errors are usually recognized shortly after the programs are launched, and the
    errors should be corrected by the same people who have developed the program,
    and by those who have an overview of and understand the program code. Other reasons
    for maintenance is that the program needs to be expanded with new features or
    existing features should work in a different way, and for a large program that
    will be used over several or many years, there will inevitably be requests for
    changes over time. Here, the original design has a much greater significance for
    the maintenance task, as the task will typically be performed by anyone other
    than the developers who originally developed the program, and although they should
    be the same people, it is far from given that they can remember, how the program
    is written. In, one will be amazed at fast one forgets a program is written. Finally,
    a reason for maintaining a program may be that you simply want to modernize the
    program and market it as a new version, which is quite common for various standards
    programs like office and so forth.


    When there is a maintenance task either because a program needs to be expanded
    or a new version of the program has to be developed, it is typically a new development
    project. In principle, such a project is like other software development projects,
    but if it is a good quality program with a good design, and if the program is
    to be expanded or part of the program to be modified, the project can be limited
    to what needs to be expanded or changed while the rest of the program can live
    unchanged. If, on the other hand, the program has been developed without planned
    for future maintenance, there is a great risk that changes may affect side effects
    to large portions of the overall code, and in the worst case even smaller changes
    may mean that large portions of the code must be rewritten.'
