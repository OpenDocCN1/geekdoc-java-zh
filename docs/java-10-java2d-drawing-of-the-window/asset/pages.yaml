  md: '# JAVA 10: JAVA2D, DRAWING OF THE

    WINDOW AND IMAGE PROCESSING


    These operations are typically used to make an image sharper or to the opposite,
    as is

    usually blur. The result, of course, depends on the values of the matrix, but
    also of

    its size, and although in a professional photo editing program it is possible
    to determine

    these values, there are a number of standard examples, for example


    ```

    0.11 0.11 0.11

    0.11 0.11 0.11

    0.11 0.11 0.11

    ```


    that retains the light conditions and results in a blur operation, and as another
    example,

    the following can be used to make an image sharper:


    ```

    0 -1 0

    -1 5 -1

    0 -1 0

    ```


    # AffineTransformOp


    It is an operation that performs a geometric transformation of an image, but such
    that the

    operation works on each of the image''s pixels. Depending on what transformation,
    it may

    mean that the image is slightly deformed (especially rotations) – a pixel is not
    necessarily

    the same in the source and the destination. Two algorithms are used, which can

    be specified with a parameter:


    +   1. Nearest neighbor, where the color of each pixel in the destination is based
    on its

    neighbor pixels in the source. It is the most effective of the two algorithms.

    2. Bilinear interpolation, where the colors of each pixel are determined by combining

    colors of pixels in the source that overlap each other in the destination. This

    algorithm is less efficient, but provides a better result.


    # LookupOp


    It is an operation that can be used as an alternative to ConvolveOp, which is
    simpler

    to define (it is simpler to predict the effect). Here is a so-called lookup table,
    that

    inform of an array, contains the color of a pixel in the destination. The index
    of this array is

    the value of the corresponding pixel in the source, and the color of a pixel in
    the destination

    is thus determined by a lookup in the table. There is a lookup for each of the
    three values

    red, green and blue. Since there are 25 options for each color, the individual
    arrays must

    have room for 256 values.


    When creating a lookup table, it is only necessary to specify a single array,
    and the values

    in the array are then used for all three colors, but you can also specify three
    arrays.'
