  md: 'JAVA 10: JAVA2D, DRAWING OF THE WINDOW AND IMAGE PROCESSING


    IMAGES


    # 7.1 IMAGING


    Image editing applications using GIMP and Photoshop are designed to manipulate
    digital photos, and Java2D actually contains image processing features, and these
    features are the subject of the following. Now no competitor is suddenly developing
    for the above programs (it''s extremely complex programs) and more than what Java2D
    directly makes available, but the following can, if nothing else, be used to explain
    how professional programs as Photoshop and GIMP works.


    Image processing describes how digital images can be manipulated using a process,
    commonly filtering. The idea is that an image source is sent through a filter,
    and the result is a new image, the destination are in Java2D represented by a
    BufferedImage. The filter is defined by an interface called BufferedImageOp, and
    the main method that interface defines is filter(). A class that implements this
    interface is often called for an image operator. Java2D defines five such image
    operators:


    +   1. ConvolveOp, used for blurring, sharpening and marking of edges

    2. AffineTransformOp, used for geometric transformation

    3. LookupOp, used for color reduction and color inversion

    4. RescaleOp, used to make a picture brighter or darker

    5. ColorConvertOp, used to convert color spaces


    You of course also define your own image operators, which is just a class that
    implements BufferedImageOp.


    # ConvolveOp


    It is a filter that modifies each pixel in the source so the corresponding pixel
    is changed from the values of neighbor pixels. This is done by means of a so-called
    Kernel, which defines a matrix with the pixels to be used. An example might be
    the following:


    | 000 |

    | 010 |

    | 000 |'
