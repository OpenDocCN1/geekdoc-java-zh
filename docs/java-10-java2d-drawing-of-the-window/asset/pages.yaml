    // This method is defined by the interface PaintContext.\n// The method's parameters\
    \ define the area to be colored.\npublic Raster getRaster(int x, int y, int w,\
    \ int h)\n{\n```\n\n```\n// defines a Raster with w*h pixels\nWritableRaster raster\
    \ = getColorModel().createWritableRaster(w, h);\n```\n\n```\n// array to color\
    \ values,\n// there are used 4 places to each pixel (red, green, blue, alpha)\n\
    int[] data = new int[w*h * 4];\ndouble radius = radius.distance(0, 0);\n```\n\n\
    ```\n// loop over all pixels\nfor (int j = 0; j < h; j++)\nfor (int i = 0; i <\
    \ w; i++)\n{\n// the distance between the center and the current point measured\
    \ to radius\n// must max be 1\ndouble r = point.distance(x + i, y + j) / rad;\n\
    if (r > 1.0) r = 1.0;\n```\n\n```\n// pixel index\n b = (j * w + i) * 4;\n```\n\
    \n```\n// define pixel values\n// if r is close to 0, color1 is used\n// if r\
    \ is close to 1, color2 is used\n// else the two colors are mixed\ndata[b] = (int)(color1.getColor()\
    \ + r * (color2.getColor() - color1.getColor()));\ndata[b + 1] = (int)(color1.getGreen()\
    \ + r * (color2.getGreen() - color1.getGreen()));\ndata[b + 2] = (int)(color1.getBlue()\
    \ + r * (color2.getBlue() - color1.getBlue()));\ndata[b + 3] = (int)(color1.getAlpha()\
    \ + r * (color2.getAlpha() - color1.getAlpha()));\n}\n```\n\n```\n// copy the\
    \ pixel values to the Raster\nraster.setPixels(0, 0, w, h, data);\nreturn raster;\n\
    }\n```\n\nYou should note that the class is relatively general and can be used\
    \ to paint objects in other contexts. Note that the center point does not need\
    \ to be the center. Also note that you can use the same color for both values,\
