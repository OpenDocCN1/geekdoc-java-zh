    where a pixel has 8 neighbor pixels. Each of the matrix elements has a value and
    0 means

    the pixel in question does not contribute to the result, whereas 1 means that
    the pixel

    moved unchanged to the destination. The above kernel is thus the identifier and
    defines

    filter that does not affect the destination. If you want to maintain the light
    conditions,

    the sum of the matrix elements must be 1. If the sum is less than 1, the image
    darkens

    and is the sum larger than 1, the image becomes brighter. The syntax for creating
    a

    ConvolveOp object


    ```

    public ConvolveOp(Kernel kernel, int edgeHint)

    ```


    Here is the last parameter a constant that indicates what should happen with the
    edges,

    where all neighbor pixels are not necessarily found. There are two options:


    +   - public static fill in EDGE_ZERO_FILL, indicating that pixels on the edge
    are set

    nto 0 and thus become a black pixel in the destination

    - public static int EDGE_NO_OP, which indicates that pixels on the edge are

    left unchanged at the destination


