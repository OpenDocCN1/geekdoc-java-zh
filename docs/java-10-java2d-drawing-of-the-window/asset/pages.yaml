  md: '# JAVA 10: JAVA2D, DRAWING OF THE WINDOW AND IMAGE PROCESSING INTRODUCTION


    When a given figure needs to be rendered, for example on a screen, it is an approximation,
    and the shape may not necessarily be presented exactly. The screen represents
    a shape using points (pixels), and you can for example produce an exact circle
    with points (one can see that the periphery consists of points and not a bow).
    For determining the points that must be part of a specific shape, the computer
    applies one of two ways. Default is aliasing, where the points whose center within
    the figure are colored. That is, the individual pixels are either part of the
    figure, or they are not. The result is a shape in which edges occur pixelated.
    The advantage of aliasing is that it is an effective and quick to draw a shape
    and in most cases the result is fully satisfactory. The second method is called
    antialiasing, and here the computer determines for each pixel the intersection
    of the figure and the current pixel. The pixel is colored with a saturation determined
    by the degree to which it is a part of the figure. The result is a figure where
    lines and arches not to the same degree occurs pixelated. In the figure below
    the circle to the left is rendered with antialiasing, while the circle to the
    right is rendered with antialiasing.


    Also note the difference between text. The disadvantage of antialiasing is, of
    course, that it is a comprehensive rendering process, as to be carried many calculations.


    The code for the below window is the following where you primarily need to note
    how to specify that the Graphics2D object must use antialiasing:


    ![](img/6c4faa569f96988b2c15c2a846193c23_15_0.png)'
