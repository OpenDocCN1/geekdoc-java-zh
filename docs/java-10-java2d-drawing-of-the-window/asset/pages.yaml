  md: '# JAVA 10: JAVA2D, DRAWING OF THE WINDOW AND IMAGE PROCESSING


    A bar chart is drawn with vertical bars, but there is a variant in which the bars
    instead are drawn horizontally, and finally there is a variation of both the vertical
    and horizontal bar charts with a simple 3D effect.


    Finally, there is a variant of the pie chart, where the chart is drawn as a speedometer
    – just to point out that it is only the imagination (the ability to draw nice
    graphs) that limit the graphs, such a library should contain.


    The library thus contains 9 basic (or simple) graphs, which are defined by the
    following type:


    ```

    package pagraphs.charts;


    public enum GraphType { LINE, CURVE, PLOT, VBAR,

    HBAR, VBAR3D, HBAR3D, PIE, SPEED )

    ```


    In addition, for a plot graph, you can indicate which figure is used to represent
    the graph''s points, and these options are defined by the following type, where
    the names indicate which graph''s is used:


    ```

    package pagraphs.charts;


    public enum PlotType { CROSS, STAR, OPENCIRCLE, OPENSQUARE, OPENTANGLE,

    OPENRHOMBE, CLOSEDRHOMBE, CLOSEDCIRCLE, CLOSEDSQUARE, CLOSEDTRIANGLE )

    ```


    A graph as above is called simple (or single-valued) corresponding to the fact
    that in principle it is defined by two arrays:


    +   1. labels is an array of strings and represent the categories and hence the
    independent variable or the y axis

    2. values which is an array of numbers of the same length as labels and represent
    the dependent variable or the y axis


    A simple graph is thus a graph for a mathematical function, and in addition to
    the two arrays, a graph has attached other parameters, which indicates how the
    graph is to be drawn.'
