    # 4.4 RENDERING HINTS


    As the last thing in this chapter I mention rendering hints, as I have already
    mentioned with antialasing. The renderings mechanism of Graphics2D can do most
    things in one way than ever, and rendering hints are the programmer''s wants to
    respect quality, but it is not certain that the mechanism can deliver the quality
    you wishes. You can define rendering hints as key / value pairs, and the possibilities
    are shown in the following table:


    | Key | Value |

    | --- | --- |

    | KEY_ANTIALIASING | VALUE_ANTIALIAS_ON<br>VALUE_ANTIALIAS_OFF<br>VALUE_ANTIALIAS_DEFAULT
    |

    | KEY_RENDERING | VALUE_RENDER_QUALITY<br>VALUE_RENDER_SPEED<br>VALUE_RENDER_DEFAULT
    |

    | KEY_DITHERING | VALUE_DITHER_DISABLE<br>VALUE_DITHER_ENABLE<br>VALUE_DITHER_DEFAULT
    |

    | KEY_COLOR_RENDERING | VALUE_COLOR_RENDER_QUALITY<br>VALUE_COLOR_RENDER_SPEED<br>VALUE_COLOR_RENDER_DEFAULT
    |

    | KEY_FRACTIONALTMETRICS | VALUE_FRACTIONALMETRICS_ON<br>VALUE_FRACTIONALMETRICS_OFF<br>VALUE_FRACTIONALMETRICS_DEFAULT
    |

    | KEY_TEXT_ANTIALIASING | VALUE_TEXT_ANTIALIAS_ON<br>VALUE_TEXT_ANTIALIAS_OFF<br>VALUE_TEXT_ANTIALIAS_DEFAULT
    |

    | KEY_INTERPOLATION | VALUE_INTERPOLATION_BICUBIC<br>VALUE_INTERPOLATION_BILINEAR<br>VALUE_INTERPOLATION_NEAREST_NEIGHBOR
    |

    | KEY_ALPHA_INTERPOLATION | VALUE_ALPHA_INTERPOLATION_QUALITY<br>VALUE_ALPHA_INTERPOLATION_SPEED<br>VALUE_ALPHA_INTERPOLATION_DEFAULT
    |


