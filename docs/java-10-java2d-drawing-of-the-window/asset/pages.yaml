  md: "# JAVA 10: JAVA2D, DRAWING OF THE WINDOW AND IMAGE PROCESSING\n\n# 5 TEXT\n\
    \nAlso text must be drawn, and even if one works with text in relation to Swing\
    \ components, where you do not have to do anything, then text also somewhere must\
    \ be drawn, a task which Java2D has to take care of. Actually, there are attached\
    \ many details to text, which is the subject of this chapter, but basically text\
    \ objects can be manipulated in the same way as other graphic objects and shapes.\n\
    \nText contains characters encoded as uncodes, and to draw a text, for each character\
    \ the figure that represents the character must be found and rendered. Such a\
    \ figure is called a glyph, and a font contains glyphs for all the characters\
    \ that the font supports. Attached to a font you have font metrics indicating\
    \ the size of each character. For the height there are three sizes. Characters\
    \ are drawn on a baseline (the characters are standing on the baseline). Descent\
    \ indicates how much the characters fill below the baseline and ascent how much\
