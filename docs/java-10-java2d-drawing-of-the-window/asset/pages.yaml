    # 4.2 COMPOSITING


    Compositing refers to the process to put two images together and appears each
    time a shape or image is drawn. Graphics2D representing as mentioned a drawing
    surface, every time you on this surface draw, some text or image, this adds a
    new element to the drawing surface. This takes place in principle using three
    operations:


    +   1. Rasterizing produce from the current figure alpha values that you can think
    of a grid of pixels, each having an alpha value. In principle, this grid corresponds
    to the entire drawing surface and are referred to below for the source. In contrast,
    the drawing surface is called the destination.

    2. For each pixel in the source is determined the color either on the current
    Paint used by the Graphics2D object or an image.

    3. Source and destination (color and alpha value) are combined pixel by pixel
    to form the image on the drawing surface. The combination of source and destination
    is done from a compositing rule that exactly specify how color and alpha values
    has to be used.


    If, for example you look at what happens when a black figure is rendered on a
    white drawing surface and using the default compositing rule, you can describe
    the process as follows. Rasterizing convert the figure to an array of alpha values
    where pixels completely out of the shape are given the value 0.0 (interpreted
    as transparent), and the corresponding pixels in the destination will remain unchanged.
    Similarly, pixels in the interior of the figure will have the alpha value 1.0,
    and the corresponding pixels in the destination will get the same color as sources
    pixels, and the result will win in this case be a black color.


    Then there are the pixels, which is located on the edge, that get an alpha value
    between 0.0 and 1.0 (assuming some antialasing). They have a color that is a combination
    of colors of pixels in the source and destination, and in this case it will a
    combination of black and white and thus a shade of gray. The exact color is determined
    by the alpha value in the source. A pixel with an alpha value of 0.9, for example
    give a very dark gray color.


    The above is referred to as Compositing default rule, but actually others may
    be used in special cases. They are called Porter-Duff rules, but are not discussed
    here.


