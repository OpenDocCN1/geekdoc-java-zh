    \ an array of PrintService objects available, and it will all the printers found.\
    \ Using the method without parameters, you simply get all the printers computer\
    \ knows, but you can with two parameters specify which printers to return. The\
    \ two parameters are respectively a DocFlavor and a AttributeSet, where the first\
    \ indicates a MIME type, and what kind of documents should be able to print, while\
    \ the second indicates what features the printer should be able to support. As\
    \ an example from the above code, the following statement returns all printers\
    \ that can print UTF-8 HTML:\n\n```\nPrintServiceLookup.lookupPrintServices(DocFlavor.URL.TEXT_UTF_8,\
    \ null)\n```\n\nAs another example, the following statement returns all printers\
    \ that have the properties defined by the last parameter:\n\n```\nPrintServiceLookup.lookupPrintServices(null,\
    \ attrs)\n```\n\nand in this case, it would be a color printer that should support\
    \ LANDSCAPE and it should be an A3 printer.\n\nTo select a printer, you can also\
    \ use ServiceUI.printDialog(), which opens the usual print dialog. The first three\
    \ parameters indicate the parent window and the dialog box location relative to\
    \ this window. Also note the parameter, which is a PrintRequestAttributeSet, which\
    \ returns the properties of the selected printer supports. You are encouraged\
    \ to test the program on your machine. In addition, you are encouraged to investigate\
    \ the help to what constants and types are defined to specify DocFlavor and AttributeSet\
