  md: '# JAVA 10: JAVA2D, DRAWING OF THE WINDOW AND IMAGE PROCESSING PACHART


    The component is created on the basis of a MultiValues object and hence the definition
    of a graph. In addition, you must specify the font to be used and you can specify
    a gap between the individual graphs (if it is a multi-valued graph) and if an
    edge be drawn around the graph. The class has more constructors as a list of Drawer
    objects, shown above. Where there is a Drawer for each graph. These Drawer objects
    are created using the class DrawerFactory, which is a simple factory method. The
    method paintComponent() uses these Drawer objects to draw the component, and it
    is also paintComponent() which draws an edge about the component. Should an edge
    be drawn, the preferred size of the component is used, which is also determined
    using the Drawer objects. The same applies to the mouse to determine whether a
    graph is clicked. That is, the Drawer classes are absolutely key classes:


    ![](img/6c4faa569f96988b2c15c2a846193c23_171_0.png)


    Drawer is an interface that defines three methods that define the width and height
    of the nth graph in a ChartComponent, and also a method that returns a FunctionValue
    object if this Drawer is clicked. In general, a graph is drawn as a rectangular
    figure with a margin. The margin is used, for example, to the axes of the coordinate
    system, to a header text, and what the margin of the figure is used for and the
    size of the margin is so determined by the current graph (not all graphs have
    a coordinate system). SingleDrawer is an abstract class, which implements the
    interface''s functions as well as methods that determine a graph''s margin and
    draw the graph. The class also defines scaling functions, and where you should
    be aware that they only scale the graph, but not the margin. As an example, two
    graphs are shown below, where the difference only is that the second is scaled:'
