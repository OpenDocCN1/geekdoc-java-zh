  md: '# JAVA 10: JAVA2D, DRAWING OF THE WINDOW AND IMAGE PROCESSING


    When the rectangle is filled, the area where the upper left corner is (20, 20)
    while the lower right corner is (219, 119) is colored. It is important to be aware
    of this fact, and the general rule is that you have to fill a figure to draw the
    perimeter.


    You should note that I in the program above have defined the color with `setPaint()`
    instead of `setColor()`. In this case there is no particular reason for it, the
    class `Graphics2D` have a variable of type `Paint`, representing what shape or
    line should be colored. There are three options:


    +   1. Color

    2. GradientPaint

    3. TexturePaint


    The three options are illustrated below, but `Paint` is an interface that the
    class `Color` implements, and therefore you can use `setPaint()` instead of `setColor()`.


    ![](img/6c4faa569f96988b2c15c2a846193c23_44_0.png)'
