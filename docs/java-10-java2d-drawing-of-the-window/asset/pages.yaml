    to the hit object and can be referred to by the method getInsertionIndex(). The
    method getCaretShapes() returns a shape to a caret. In fact, it returns two, and
    the reason is that Java2D supports bidirectional text, and thus the text is written
    from right to left. Wherever returns above two Shape objects. With a Shape to
    a caret available it must be drawn as any other figure after a transformation.
    Here you need to specifically note the method createTransformedShape() that transforms
    you without transforming the current Graphics2D object.


