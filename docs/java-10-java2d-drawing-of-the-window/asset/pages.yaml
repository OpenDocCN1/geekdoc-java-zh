    BasicStroke.CAP_BUT, BasicStroke.JOIN_BEVEL, 0, new float[] { 10, 10, 0 })\n```\n\
    \nA dotted line is drawn by switching between a line segment and a blank segment.\
    \ The last array defines the two pieces each should be at length of 10. The last\
    \ parameter is explained by the next example (the line pink):\n\n```\nnew BasicStroke(3,\n\
    BasicStroke.CAP_BUT, BasicStroke.JOIN_BEVEL, 0, new float[] { 10, 5, 5 })\n```\n\
    \nHere this parameter indicates, how long you have to start inside the first segment.\
    \ Therefore, the first segment has only the length 5. Finally, the last example\
    \ show that you can specify multiple lengths:\n\n```\nnew BasicStroke(3, BasicStroke.CAP_BUT,\n\
    BasicStroke.JOIN_BEVEL, 0, new float[] { 5, 10, 15, 20 })\n```\n\nThat is, first\
    \ draw a line segment at 5, then a gap of 10, a segment of 15 and finally a gap\
    \ of 20. Then repeat the pattern until the entire line is drawn. The code for\
