  md: 'JAVA 10: JAVA2D, DRAWING OF THE WINDOW AND IMAGE PROCESSING


    IMAGES


    # 7.2  BUFFEREDIMAGE


    In this section, I would like to see a little more on the class BufferedImage,
    which is the class that provides the necessary services to manipulate the individual
    pixels in an image.


    A BufferedImage is the central image processing class and is derived from the
    class Image, and an object of the type BufferedImage can therefore be used as
    a parameter for drawImage(). An image and its out Image is basically nothing but
    an array of pixels in different colors. A BufferedImage can be illustrated as
    follows:


    BufferedImage


    | ColorModel | Raster | |

    | --- | --- | --- |

    | | Databuffer | SampleModel |

    | | Data arrays | |


    and basically consists of a raster and a color model. The raw data is saved as
    arrays in the raster portion, while the color model determines how data should
    be interpreted as colors. Each pixel in an image is defined by one or more values,
    called samples. For example a black and white image sample for each pixel, while
    an RGB image has 3 samples for each pixel. The buffer contains the current samples
    stored in arrays of byte or int arrays, and the raster part also has a sample
    model that defines how the buffer is organized and how to refer to a particular
    pixel in the buffer.


    The color model interprets the individual pixels samples as colors. It is a black
    and white image with one sample for each pixel it interprets as a grayscale between
    black and white, and in an RGB image, the color model uses all three samples for
    one pixel and interprets them as intensities of red, green and blue in an RGB
    color. All samples for a particular color are called a band or channel. Thus,
    an RGB image generally has 3 channels, but can also have a fourth for alpha values.


    Consider, for example, a jpg image of 4920×2768 pixels. Since there is an RGB
    image, there are three samples for each pixels stored in three byte arrays each
    with space for 13618560 bytes. Each array is organized in the order of 2768 rows
    and each row uses 4920 places.


