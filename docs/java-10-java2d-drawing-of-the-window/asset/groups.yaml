    ## 12.2 THE TEST PROGRAM


    Then there is the test program that opens a window with a JTable containing numbers
    –near the first column, which contains texts to be used as labels for graphs.
    At the top there is a toolbar with buttons. Clicking on the first button allows
    you to specify an interval for the table''s numbers, and the program will fill
    the table with random numbers within this range. Next, 19 test buttons follows,
    which opens window I I have used for testing in connection with the development
    of the library. The most interesting is the button to far right. If you select
    a rectangular area in the table (which does not include the left column) and clicking
    the button program creates a MultiValues object you can edit the properties:


    ![](img/6c4faa569f96988b2c15c2a846193c23_176_0.png)


    Here it has seen three columns and defined a multi-graph for three graphs. Double-clicking
    the column header for one of the three graphs gives you the following dialog box
    where you can define settings for the individual graphs:


    ## PACHART


    ![](img/6c4faa569f96988b2c15c2a846193c23_177_0.png)


    You can thus use the program to define different settings for the individual graphs
    and test the effect.


    Note that for practical use, the last dialog box must be adapted to the individual
    graph types, so you can only enter and select values for the properties that make
    sense for the current graph.


    ## 12.3 LACKS AND THINGS THAT COULD BE IMPROVED


    The graphs cannot display all numbers with a reasonable result, and some of the
    graphs, for example, are mistaken for negative numbers, especially if you merge
    graphs. For example, it does not make sense to stack bar charts if the numbers
    can be negative. The conclusion is that several of the graphs have preconditions,
    the drawing functions with advantage validate and possibly raise an exception
    if the graph cannot be drawn correctly. An alternative could be to let the Drawer
    classes return 0 if the graph cannot be drawn with a sufficiently nice result
    – a strategy that is already partially implemented.


    The actual component ChartComponent can raise a single event if the user clicks
    on a graph. The component is drawn on an object of the type MultiValues, and the
    component could be extended as it fires a PropertyChangeEvent for a value if a
    property is changed in the Multi data structure. In practice, it would typically
    mean that the component be redrawn, and it could also be of significance to the
    layout manager that contains the component.


    Another question is how easy it is to expand the library with a new graph. If
    it is a whole new graph for a single-valued function, it''s simple. In this case,
    the work consists primarily of writing a new Drawer derived from SingleDrawer,
    adding a new graph type to GraphType and expanding the class DrawingFactory. In
    addition, the MergeDrawer class can be expanded (the method merge()) to know the
    new type. If graphs of the new type can be merged, a Drawer derived from MultiDrawer
    must also be written, and the class MergeDrawer has to know this Drawer. Even
    more extensive is the task, if the new graph type can be merged with existing
    graphs, which can both cause existing Drawer types to be changed as well as possible
    new Drawer classes to be written. The conclusion is that if the library is expanded
    with new graphs, which can be merged with existing graphs, work can be quite extensive.


    It may be a good practice to improve the library corresponding to the above and
    optionally expand with a new graph type.

    '
