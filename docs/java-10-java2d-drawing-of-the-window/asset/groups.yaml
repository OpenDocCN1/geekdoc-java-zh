    As another example, the following program draws the same image, but this time\
    \ the clip area is defined using a text. The result is that you only see the water\
    \ and a little of the bird:\n\n# ClipImage\n\n![](img/6c4faa569f96988b2c15c2a846193c23_114_0.png)\n\
    \n```java\nclass Drawing extends JComponent\n{\n    public void paintComponent(Graphics\
    \ g)\n    {\n        Image image = PaGUI.createImageIcon(\"/clipimage/images/svane.jpg\"\
    ).getImage();\n        if (image != null)\n        {\n            Dimension d\
