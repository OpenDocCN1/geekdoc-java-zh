    \n# JAVA 10: JAVA2D, DRAWING OF THE\n\n## 7.3 THE SCREEN\n\nWhen working with\
    \ graphics you may need to determine the screen size. This can be done in several\
    \ ways, but the following program shows:\n\n```java\npackage screensize;\n\nimport\
    \ java.awt.*;\n\npublic class ScreenSize {\n    public static void main(String[]\
    \ args) {\n        Dimension screenSize = Toolkit.getDefaultToolkit().getScreenSize();\n\
    \        double width = screenSize.getWidth();\n        double height = screenSize.getHeight();\n\
    \        System.out.println(width + \"x\" + height);\n    }\n}\n```\n\n## 9. ANIMATIONS\n\
    \nAs the last topic concerns Java2D, I will look at how to work with animations.\
    \ In fact, Java2D does not support animations, and all you can do is simulate\
    \ animation of a figure by drawing the figure bit later and possibly in a new\
    \ position. Doing it (many times a second) gives you an effect that resembles\
    \ animation. If you open the program, you get the following window:\n\n![](img/6c4faa569f96988b2c15c2a846193c23_131_0.png)\n\
    \nI will not mention the code for this window as it is only three buttons and\
    \ each button opens a dialog box. The first dialog simulates an animation of a\
    \ geometric figure, the next an animation of a text, while the last simulates\
    \ an animation of an image.\n\nAt the top there is a toolbar, which includes five\
    \ checkboxes indicating whether\n\n- 1. antialiasing is used when drawing the\
    \ figure\n- 2. a transformation is performed, as a rotation about the center\n\
    - 3. a gradient paint is used (which is the case above)\n- 4. a circumference\
    \ is drawn around the figure\n- 5. where to use a clip area (there are drawn as\
    \ to)\n\nTo the right there are two buttons to start and stop the animation, and\
    \ finally there\na a slider that is used to adjust the animation speed.\n\nIn\
    \ addition to this toolbar, the dial box contains a JComponent, which is the component\n\
    simulates the animation. I do not want to display the code for the dialog, but\
    \ the\ncomponent with the drawing is defined as an inner class as:\n\n```java\n\
    class Picture extends JComponent\n{\nprivate float x;\nprivate float y;\nprivate\
    \ float deltax = rand.nextFloat();\nprivate float deltay = rand.nextFloat();\n\
    private float width;\nprivate float height;\nprivate float theta = 0;\nprivate\
    \ BufferedImage image;\nprivate java javax.swing.Timer timer;\n```\n"
