    - labels 是 String 类型的数组，用于自变量（x轴或标签轴）的文本\n- label 是 x 轴的标签，默认为空\n- grid 指定是否绘制网格线（默认为\
    \ true）\n- merge 指示图表是否应该合并为一个图表（默认为 false）\n- same 指定合并图表是否必须使用相同的 y 轴（默认为 true）——该属性仅用于合并图表\n\
    - stacked 指定合并图表是堆叠的（true）还是并排绘制（默认为 false）——该属性仅用于合并图表\n- scaleX 定义 x 轴（水平）方向的缩放（默认为\
