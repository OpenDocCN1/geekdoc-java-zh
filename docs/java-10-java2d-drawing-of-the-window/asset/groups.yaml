    ## 11 MAINTENANCE OF PROGRAMS


    Most programs must be maintained over time. This is one of the reasons why program
    design and quality play a major role as programs with an incomprehensible design
    and code that are difficult to read are at best; it may be time consuming to maintain
    a program with a bad design.


    Many programs live for many years, and this requires a program to be maintained
    at intervals. One reason may be that the program contains errors, which should
    of course be corrected. These are rarely the most difficult maintenance tasks,
    as errors are usually recognized shortly after the programs are launched, and
    the errors should be corrected by the same people who have developed the program,
    and by those who have an overview of and understand the program code. Other reasons
    for maintenance is that the program needs to be expanded with new features or
    existing features should work in a different way, and for a large program that
    will be used over several or many years, there will inevitably be requests for
    changes over time. Here, the original design has a much greater significance for
    the maintenance task, as the task will typically be performed by anyone other
    than the developers who originally developed the program, and although they should
    be the same people, it is far from given that they can remember how the program
    is written. One will be amazed at how fast one forgets how a program is written.
    Finally, a reason for maintaining a program may be that you simply want to modernize
    the program and market it as a new version, which is quite common for various
    standard programs like office and so forth.


    When there is a maintenance task either because a program needs to be expanded
    or a new version of the program has to be developed, it is typically a new development
    project. In principle, such a project is like other software development projects,
    but if it is a good quality program with a good design, and if the program is
    to be expanded or part of the program to be modified, the project can be limited
    to what needs to be expanded or changed while the rest of the program can live
    unchanged. If, on the other hand, the program has been developed without planning
    for future maintenance, there is a great risk that changes may affect side effects
    to large portions of the overall code and in the worst case even smaller changes
    may mean that large portions of the code must be rewritten.


    Fortunately, with a good design it is seldom bad but there is always reason to
    be aware that changes in a program can easily cause unintended changes elsewhere.
    Therefore, maintenance of programs must be planned to ensure that you have identified
    the consequences of the changes in question and subsequently, if possible, documentation
    is required so developers who are making changes can quickly gain an overview
    of the program''s architecture and how it is made. The start of any maintenance
    task is therefore to read the program documentation and especially the design
    to get an overview of the full code so that you know the significance of individual
    files. The result of all is that one can clearly emphasize the importance of design
    and program architecture. Otherwise, maintenance of programs is worthless.


    Regardless, maintenance of programs is not simple, and similar to development
    it also starts with analyzing the changes. In particular, it is important that
    the documentation is updated so it is clear what has been changed and finally
    the changes must be tested, with particular attention being paid to the fact that
    changes do not cause errors elsewhere.


    As an example, the rest of this chapter will contain two tasks that illustrate
    program maintenance. In one task, you need to implement some extensions of the
    calendar application from Java 8, and in the second task, you must make two changes
    to the slot machine from Java 9.


    ### PROBLEM 2


    Start by creating a copy of the Calendar project from Java 8. Take some time to
    test the program so you are sure how the program works. The task now is to add
    three features to the program:


    - The toolbar must have two new icons, and if you click on one the program should
    print a calendar for the current month, while clicking on the other program should
    print a calendar for the current year.

    - The dialog box must have an additional button and clicking on it will allow
    you to print notes.


    ### PROBLEM 3


    Start by creating a copy of the SlotMachine project from Java 9. Take some time
    to test the program so you are sure how the program works. The task is to modify
    the program:


    - In the existing version, there is no animation of the wheels, but the animation
    is simulated by displaying individual figures shortly before the next figure is
    selected. You now need to change the program so instead simulating the rotation
    of the reels with an animation in the same way as in chapter 9. The program has
    an administrator mode where a particular user has administrator right. If this
    user has logged in, the icons for administrator tools appear automatically and
    otherwise not. It is a part of the task to ensure that there is always an administrator
    and that the administrator can be deleted.


