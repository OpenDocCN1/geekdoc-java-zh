    # FOREWORD


    This book is the tenth in a series of books on software development. The programming
    language is Java, and the language and its syntax and semantics fills obviously
    much, but the books also largely focused on the process and how to develop good
    and robust applications. In the previous book, I have relatively detailed Swing,
    and the subject of this book is Java2D, which is the other half of what Java is
    available for developing applications with a graphical user interface. One can
    also think Java2D as the graphical tool that Swing uses to draw the components
    in a window. The book is relatively detailed and addresses issues that are not
    used so often in everyday programming, but the examples are, of course, and also
    the issues, to understand how the GUI works. It is similar to a few other books
    in this series where the focus is on language Java over the process, and only
    the final example focuses on system development with the Java class library. The
    book assumes knowledge of Java corresponding to the books Java 3 and 4 and to
    some extent knowledge of Swing corresponding to the book Java 2.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading about the subject and by studying sample programs, but most importantly
    by yourself to do it and write your own programs from scratch. Therefore, an important
    part of the books is that all books in the series are built around the same skeleton
    and will consist of text and examples that are placed naturally. The difference
    between exercises and problems is largely deals with repetitions of the substance
    that is presented in the text. Problems are in turn more difficult and there is
    rarely any clear solution. These are books to be read from start to finish, but
    the many examples are also important that the reader should predict the code.
    All books end with one or larger sample programs, which focus primarily on the
    process and in addition to show development of programs from varying fields.


    JAVA 10: JAVA2D, DRAWING OF THE WINDOW AND IMAGE PROCESSING


    Most books also end with an appendix dealing with a subject that would not be
    treated in the books. It is about other topics, which are necessary to have an
    introductory knowledge. If the reader is already familiar with the subject, the
    current appendix can be skipped. The programming language is, as mentioned, and
    besides the books use the following:


    - NetBeans as IDE for application development

    - MySQL as database server (from Java 6 onwards)

    - GlassFish as web server and application server (from Java 11 onwards)


    It is products that are free of charge and install, and there is even talk about
    how to write or for that matter, the title says books on software development.
    It is hope that the reader when reading the books and through the many examples
    can find inspiration for how to write good programs, but also can be used as a
    source collection with a number of solutions to concrete everyday programming
    problems you regularly face as a software developer.


    JAVA 10: JAVA2D, DRAWING OF THE WINDOW AND IMAGE PROCESSING


    # INTRODUCTION


    When you write a program with a graphical user interface, the programming is based
    to a large extent use of finished classes for windows, buttons, fonts, etc. From
    the start, these classes were gathered in AWT and its subpackages, and the APIs
    could be seen as two layers of classes that could be called a user interface toolkit
    and a drawing toolkit, the first layer comprised of the classes for components
    and properties of the components, while the second layer consisted of classes
    for basic geometric tools that could draw lines and squares and manipulate the
    individual pixels. Later (starting with Java 2) AWT was split into two APIs in
    the form of Swing and Java2D. This book deals with Java2D and how you in Java
    can program 2-dimensional graphics and manipulate images.


    Like other Java APIs includes Java2D a very large number of classes, but overall
    these are classes for:


    - 1. Shapes, where you can create arbitrary geometric shapes as combinations of
    straight lines, curves, rectangles, ellipses and arcs.

    - 2. Strokes that defines lines should be drawn in terms of width, dashed or as
    a solid stroke. Furthermore, you can specify the corners will be drawn.

    - 3. Filling that specifies shapes are filled. You can specify a color, a pattern
    or a gradient fill, and in fact you can also use an image.

    - 4. Transformations, where everything that is drawn (shapes, images, text) can
    be stretched, scaled and rotated.

    - 5. Alpha compositing, is the process of combining a drawing with a background
    to create figures with a partial or full transparency.

    - 6. Clipping is the process for limiting the part of a shape to be drawn so as
    not to draw on an unwanted area of the window.

    - 7. Anti-aliasing is a technique to avoid uneven lines, where you can see the
    individual pixels.

    - 8. Text where you can manipulate the text in the same way as other geometric
    shapes.

    - 9. Color comprising classes and methods to represent colors, so they are hardware
    independent.

    - 10. Images that provide the ability to manipulate images in the same way as
    other geometric shapes. It also includes classes to read images from and save
    images in files.

    - 11. Image processing, which includes classes to manipulate the individual pixels
    in images.

    - 12. Animation, which are classes that make services available, so you can animate
    geometric shapes, text and images.

