    \        g2d.setFont(new Font(\"Liberation Serif\", Font.BOLD, 350));\n      \
    \  g2d.drawString(\"A\", 200, 400);\n    }\n}\n```\n\n正是这个自定义的 Swing 组件。组件有一个名为\
