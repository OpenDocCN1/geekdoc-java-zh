- md: "\n## JAVA 10: JAVA2D, DRAWING OF THE WINDOW AND IMAGE PROCESSING IMAGES\n\n\
    ### IMAGES\n\nAn image is a 2-dimensional array of colors, each element being\
    \ called a pixel. In principle, it looks like any other figure, but there are\
    \ two important differences:\n\n1. pixels do not necessarily respond directly\
    \ to pixels on the drawing\n2. an image has a width and height measured in pixels\
    \ and a coordinate system that is independent of the drawing area\n\nThe basic\
    \ class is Image, and there is as follows others. The first step is to show how\
    \ to load an image so that you can display it in a window. I have actually shown\
    \ how, for example by loading an icon or pictures to playing cards, etc. As an\
    \ example, the following method reads an image from a file where the parameter\
    \ is the file's name (full pathname):\n\n```java\npublic static ImageIcon loadImageIcon(String\
    \ filename)\n{\n    return new ImageIcon(filename);\n}\n```\n\n![](img/6c4faa569f96988b2c15c2a846193c23_107_0.png)\n\
    \nThe image should be represented as an ImageIcon, and if you want to refer to\
    \ the image as an Image, the class ImageIcon has a method called getImage(). Simpler\
    \ it can hardly be. The following method does the same:\n\n```java\npublic static\
    \ BufferedImage loadImage(String filename)\n{\n    try {\n        return ImageIO.read(new\
    \ File(filename));\n    } catch (IOException e) {\n        return null;\n    }\n\
    }\n```\n\nand the main difference is that the method this time returns the image\
    \ as a BufferedImage such as you can manipulate the image directly. Note, in particular,\
    \ that a BufferedImage inherits the class Image and can be used anywhere in which\
    \ you can use an Image. Instead, if you want to read the image from the program's\
    \ jar file (which is often the case with icons and smaller images), you can use\
    \ the following method:\n\n```java\npublic static ImageIcon createIcon(String\
    \ path)\n{\n    java.net.URL imgURL = PaGUI.class.getResource(path);\n    if (imgURL\
    \ != null) return new ImageIcon(imgURL, \"\");\n    return null;\n}\n```\n\nwhere\
    \ the parameter should be the image's name relative to the package containing\
    \ the image. A variation of this method scales the image to a certain size (and\
    \ which is especially useful when loading icons) is:\n\n```java\npublic static\
    \ ImageIcon createIcon(String path, int width, int height)\n{\n    java.net.URL\
    \ imgURL = PaGUI.class.getResource(path);\n    if (imgURL != null) return new\
    \ ImageIcon(new ImageIcon(imgURL, \"\").\n    getImage().getScaledInstance(width,\
    \ height, Image.SCALE_SMOOTH), \"\");\n    return null;\n}\n```\n\nViewing an\
