    \ 窗口绘制与图像处理渲染\n\n## 4.2 混合 (COMPOSITING)\n\n混合是指将两个图像组合在一起的过程，并且每次绘制形状或图像时都会出现。如前所述，Graphics2D\
    \ 代表一个绘制表面，每当你在这个表面上绘制某些文本或图像时，都会为绘制表面添加一个新元素。这在原理上通过三个操作完成：\n\n- 1. 栅格化（Rasterizing）从从当前图形产生\
    \ alpha 值，你可以将其想象为一个像素网格，每个像素都有一个 alpha 值。原则上，这个网格对应整个绘制表面，在下文中被称为源（source）。相比之下，绘制表面被称为目标（destination）。\n\
    - 2. 对于源中的每个像素，确定其颜色是基于 Graphics2D 对象使用的当前 Paint 还是来自一张图像。\n- 3. 源和目标（颜色和 alpha\
    \ 值）逐像素组合，形成绘制表面上的图像。源和目的的组合是根据混合规则完成的，该规则精确规定了如何使用颜色和 alpha 值。\n\n例如，如果你观察在白色绘制表面上使用默认混合规则渲染一个黑色图形时会发生什么，可以将该过程描述如下：栅格化将图形转换为\
    \ alpha 值数组，完全超出形状的像素被赋予值 0.0（解释为透明），而目标中的相应像素将保持不变。同样，图形内部的像素将具有 alpha 值 1.0，目标中的相应像素将获得与源像素相同的颜色，在这种情况下结果将是黑色。\n\
    \n然后是位于边缘的像素，它们会获得一个 0.0 到 1.0 之间的 alpha 值（假设开启了某些抗锯齿）。它们的颜色是源和目标像素颜色的组合，在这种情况下，它将是黑色和白色组合，因此呈现出灰色。确的颜色由源中的\
    \ alpha 值决定。例如，alpha 值为 0.9 的像素将给出非常深的灰色。\n\n上述被称为混合默认规则，但实际上在特殊情况下可能会使用其他规则。它们被称为\
    \ Porter-Duff 规则，但此处不进行讨论。\n\n## 4.3 裁剪 (CLIPPING)\n\n有时，人们并不希望你可以在整个绘制区域上绘制。当你构建复杂形状时，通常需要确保你不会在其他图形上进行绘制，这可以通过指定裁剪区域（clip\
