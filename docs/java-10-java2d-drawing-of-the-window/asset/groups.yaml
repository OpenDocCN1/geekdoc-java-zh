    # 2.2 LINES


    I will look at the three types Line2D, QuadCurve2D and CubicCurve2D, each representing
    a line segment. Line2D represents a straight line between two points, and there
    is not much to explain. To create a Line2D object, you must only indicate the
    endpoints of the segment.


    A QuadCurve2D represents a path between two points, which has an associated control
    point so that the lines from the control point of the curve''s endpoints are tangents
    to the curve:


    ![](img/6c4faa569f96988b2c15c2a846193c23_25_0.png)


    If you need to create a QuadCurve2D, one must therefore indicate three points.
    A CubicCurve2D is in principle the same, but here there are two control points,
    for each of the two end points:


    ![](img/6c4faa569f96988b2c15c2a846193c23_25_1.png)'
