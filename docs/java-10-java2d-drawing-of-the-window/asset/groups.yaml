    \    if (action == ImageScaling.SCALEDOFIT)\n        scaleX = scaleY = Math.min(scaleX,\
    \ scaleY);\n    else if (action == ImageScaling.SCALEDOFILL)\n        scaleX =\
    \ scaleY = Math.max(scaleX, scaleY);\n    trans.setToScale(scaleX, scaleY);\n\
