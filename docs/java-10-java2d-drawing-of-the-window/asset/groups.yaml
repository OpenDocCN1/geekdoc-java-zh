    # 10.2 PRINTERSERVICES


    Java''s print API evolved continuously, when the first versions of Java does not
    have support for print and so into an advanced API with many facilities for initiating
    print jobs. As the examples shows, it is simple to write to a printer today, but
    when writing the program, one can not know which printer is located at the other
    end, and there may also be a variety of printers available with many different
    facilities. To handle these options, Java are expanded with PrintServices, and
    the following is a brief introduction to what it is.


    The principle in a print job is with the new possibilities:


    +   1. select the printer represented by a PrintService object

    2. create the job represented by a DocPrintJob object

    3. create a Doc that represents the data to be printed

    4. start the job by calling the DocPrintJob object''s print() method


