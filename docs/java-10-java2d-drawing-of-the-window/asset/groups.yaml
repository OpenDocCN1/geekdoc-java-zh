    对于理解 GUI 如何工作至关重要,\" +\n\"与本系列书籍中的几个示例相似，这些书籍 \" +\n\"是关于 Java 语言和过程的，只有最后的示例\
    \ \" +\n\"关注于使用 Java 类库进行系统开发。\" +\n\"本书假设读者已经拥有与书籍 Java 3 和 \" +\n\"Java 4 对应的\
    \ Java 知识，并在某种程度上了解对应于书籍 \" +\n\"Java 2 的 Swing 知识。\",\n};\n    private float\
