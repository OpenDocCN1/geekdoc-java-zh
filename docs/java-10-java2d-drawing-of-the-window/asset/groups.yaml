    BI挪威商学院是欧洲最大的商学院之一，招收了超过 20,000 名学生。我们的课程提供了一个充满活力且多元文化的学习环境，具有国际视野，最终为学生提供专业技能，以满足企业日益增长的需求。


    BI 提供了四种不同的两年全日制科学硕士（MSc）课程，这些课程以英语授课，旨在提供专业技能以满足市场日益增长的需求。硕士课程提供了一个充满活力且多元文化的学习环境，为你开启职业生涯提供最佳平台。


