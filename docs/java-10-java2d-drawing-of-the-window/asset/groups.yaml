    \n点击广告阅读更多信息\n\nJAVA 10: JAVA2D，窗口绘制与图像处理\n\n填充与描边\n\n![](img/6c4faa569f96988b2c15c2a846193c23_54_0.png)\n\
    \n关于线条描边（`Stroke`），端点有三种可能性：\n\n1. BasicStroke.CAP_SQUARE（默认值）\n2. BasicStroke.CAP_ROUND\n\
    3. BasicStroke.CAP_BUTT\n\n第一条线（黑色）使用默认值绘制，否则描边宽度为 19。此外，还绘制了一个该线条的外接矩形。关于端点，样式是\
    \ `CAP_SQUARE`，它通过一个长度为线条厚度一半的矩形来扩展线条。蓝线对应的端点是 `CAP_ROUND`，它通过一个半径为线条厚度一半的半圆来扩展线条。最后，绿线使用了\
    \ `CAP_BUT`，它简单地不扩展线条。\n\n右侧的三个图形都是 `GeneralPath` 类型，使用宽度为 19 的描边绘制，端点使用 `CAP_SQUARE`\
    \ 选项，并且还定义了角如何绘制。同样，有三种选项：\n\n1. JOIN_MITER（默认值）\n2. JOIN_ROUND\n3. JOIN_BEVEL\n\
    \n在 bookoon.com 下载免费电子书\n\nJAVA 10: JAVA2D，窗口绘制与图像处理\n\n橙色路径使用默认值绘制，因此样式为 `JOIN_MITER`。它通过扩展外边缘直到它们相交来混合线段。洋红色线使用\
    \ `JOIN_ROUND`，这意味着线段端点是 `CAP_ROUND`。最后，灰色路径使用 `JOIN_BEVEL`。在这里，线段端点使用 `CAP_BUT`，且外边缘被连接起来。\n\
    \n然后是三条虚线。红线使用如下定义的描边绘制：\n\n```\nnew BasicStroke(5,\nBasicStroke.CAP_BUT, BasicStroke.JOIN_BEVEL,\
    \ 0, new float[] { 10, 10, 0 })\n```\n\n点线通过在线段和空白段之间切换来绘制。最后一个数组定义了这两个部分的长度，应为\
    \ 10。最后一个参数由下一个示例（粉色线）解释：\n\n```\nnew BasicStroke(3,\nBasicStroke.CAP_BUT, BasicStroke.JOIN_BEVEL,\
    \ 0, new float[] { 10, 5, 5 })\n```\n\n在这里，该参数表示你从第一个段内部开始绘制的长度。因此，第一个段的长度仅为 5。最后，最后一个示例显示你可以指定多个值：\n\
