    Colors are treated several places in this series of books, and as a programmer,
    you usually do

    need to know more than what has already been said. Colors are formed by combining

    the values of three colors red, green and blue, why we are talking about RGB color

    encoding. In addition, an alpha value is associated, which tells the extent to
    which the

    color is transparent. Each of the four values is represented by a byte (and thus
    can

    256 different values), and internally a color is represented by a 32 bit int:


    | Alpha | Red | Blue | Green |


    The basic class to represents a color is Color, and it has been used many times
    before.

    Looking at all the previous examples, the use of colors is generally simple, but
    the reality

    that colors is the same as the text are extremely complex, and therefore this
    section as a brief

    introduction to the problems regarding colors. In short, the problems can be explained
    by

    the fact that certain colors can look different (and often do) on different screens,
    and even

    worse, if printed on a color printer. The reasons are that the computer''s color
    representation

    are relative (what does it actually mean a color is 40% red?) and that different
