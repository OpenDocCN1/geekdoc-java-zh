    \ 一直存在，但随着 Java2D 的引入，有了一个名为 `Graphics2D` 的定义类，它通过新的图形方法进行了扩展。因此，`paintComponent()`\
    \ 方法开始将参数转换为 `Graphics2D` 对象。然后该方法就可以在图形对象上进行绘制，基本上发生了以下情况：\n\n以下语句定义了使用宽度为 7\
    \ 像素的灰色画笔进行绘制，第三条语句在两个点之间绘制出一条直线：\n\n```java\ng2d.setStroke(new BasicStroke(7));\n\
