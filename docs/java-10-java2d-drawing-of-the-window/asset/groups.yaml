    \ trans = new AffineTransform();\n            PaGUI.scale(trans, image, d, ImageScaling.SCALEDTOFILL);\n\
    \            g2d.setClip(getClipping(g2d));\n            g2d.drawImage(image,\
    \ trans, this);\n        }\n        else super.paintComponent(g);\n    }\n\n \
