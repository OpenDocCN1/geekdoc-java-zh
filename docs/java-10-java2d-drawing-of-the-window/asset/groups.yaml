- md: "\n## JAVA 10: JAVA2D, DRAWING OF THE WINDOW AND IMAGE PROCESSING\n\nILayoutILayout\
    \ basically a single line of text, and if the text has to fill several lines you\
    \ have to do better, but fortunately there are helper classes that can be used.\
    \ Consider the following window. The only thing the program does is to display\
    \ a text in a window (and of course it would be trivial to do with JTextArea,\
    \ but in this case the text is drawn with a Layout.\n\n![](img/6c4faa569f96988b2c15c2a846193c23_90_0.png)\n\
    \n```java\npackage multilineprogram;\n\nimport java.awt.*;\nimport java.awt.font.*;\n\
    import javax.swing.*;\nimport java.text.*;\n\npublic class MainWindow extends\
    \ JFrame\n{\n    public MainWindow()\n    {\n        super(\"MultilineProgram\"\
    );\n        setSize(600, 400);\n        setLocationRelativeTo(null);\n       \
    \ add(new JScrollPane(new Drawing()));\n        setDefaultCloseOperation(EXIT_ON_CLOSE);\n\
    \        setVisible(true);\n    }\n}\n```\n\n```java\nclass Drawing extends JComponent\
    \ {\n    private String[] str = {\n\"Foreword\",\"This book is the tenth in a\
    \ series of books on software development. The \" +\n\"programming language is\
    \ Java, and the language and its syntax and \" +\n\"semantics obviously much,\
    \ but the books have also largely \" +\n\"focus on the process and how to develop\
    \ robust and accurate applications. \" +\n\"In the previous book, I have relatively\
    \ detailed treated Swing, and \" +\n\"the subject of this book is Java2d, which\
    \ is the other half of what \" +\n\"Java is making available for developing applications\
    \ with a graphical \" +\n\"user interface. One can also think of Java2d as the\
    \ graphical tools that \" +\n\"Swing uses to draw the components in a window.\
    \ The book is relatively \" +\n\"detailed and addressed issues that are not so\
    \ often in \" +\n\"are important to understand how the GUI works,\" +\n\"Is similar\
    \ to a few examples in this series of books where the book \" +\n\"is on language\
    \ Java over the process, and only the final example \" +\n\"focuses on system\
    \ development with the development of Java class library.\" +\n\"The book assumes\
    \ knowledge of Java corresponding to the books Java 3 and \" +\n\"Java 4 and to\
    \ some extent knowing of Swing corresponding to the book \" +\n\"Java 2.\",\n\
    };\n    private float font1 = new Font(\"Verdana\", Font.BOLD, 24);\n    private\
    \ Font font2 = new Font(\"Times New Roman\", Font.PLAIN, 14);\n    private Font\
    \ font3 = new Font(\"Times New Roman\", Font.PLAIN, 18);\n\npublic void paintComponent(Graphics\
    \ g) {\n    float height = 0;\n    Graphics2d g2d = (Graphics2d)g;\n    g2d.setRenderingHint(RenderingHints.KEY_ANTIALIASING,\n\
    RenderingHints.VALUE_ANTIALIAS_ON);\n    height = draw(g2d, new Insets(5, 5, 20,\
    \ 5), 0, new AttributedString(str[0]), font1);\n    height = draw(g2d, new Insets(0,\
    \ 5, 10, 5), height,\n    new AttributedString(str[1]), font2);\n    height =\
    \ draw(g2d, new Insets(0, 5, 10, 5), height,\n    new AttributedString(str[2]),\
    \ font3);\n    height = draw(g2d, new Insets(0, 5, 5, 5), height,\n    new AttributedString(str[3]),\
    \ font3);\n    setPreferredSize(new Dimension(0, (int)height));\n}\n\n    private\
    \ float draw(Graphics g, Insets margins, float y, AttributedString str,\nstr.addAttribute(TextAttribute.FONT,\
    \ font);\nAttributedCharacterIterator itr = str.getIterator();\nFontRenderer context\
    \ = g.getFontRenderer();\nLineBreakMeasurer lbm = new LineBreakMeasurer(itr, context);\n\
    float width = getSize(width) - margin.left - margin.right;\nfloat x = margin.left;\n\
    y += margin.top;\nwhile (lbm.getPosition() < itr.getEnd()) {\n    TextLayout textLayout\
    \ = lbm.nextLayout(width);\n    y += textLayout.getAscent();\n    textLayout.draw(g,\
    \ x, y);\n    y += textLayout.getDescent() + textLayout.getLeading();\n    x =\
    \ margin.left;\n}\ny += margin.bottom;\n```\n\n![](img/6c4faa569f96988b2c15c2a846193c23_92_0.png)\n\
    \nAbout e-Learning for Kids. Established in 2004, e-Learning is a global non-profit\
    \ foundation dedicated to fun and free learning on the Internet for children ages\
    \ 5-12 with courses in math, science, language, health and environmental. Since\
    \ 2005, more than 15 million children in over 190 countries have benefited from\
    \ e-lessons provided by us. Our volunteer staff consists of education and business\
    \ professionals from around the world committed to making a difference. Our vision\
    \ includes funding, sponsors and content. For more information, visit www.e-learningforkids.org.\n\
    \n- The number MOOC for Primary Education\n- free Digital Learning for Children\n\
    -15 Million Reached\n\n### 5.3 GLYPHS\n\nThe text is drawn as three strings in\
    \ an array, and you can think of each string as a paragraph. The most important\
    \ thing is the method draw() with a graphic object to be drawn, with the y-position\
    \ where an Insets object indicates how much air should be outside of the text.\
    \ The primary task of the method is to divide the text into lines, and in addition\
    \ to this, the method should control the y position for each line. The principle\
    \ of this example can be used if you need to write a custom component. In the\
    \ previous section I have suggested the possibilities of TextLayout, although\
    \ it is rare that you need it, but you can actually go further directly manipulate\
    \ the individual glyphs. The following program opens the window.\n\n```java\n\
    class Drawing extends JComponent\n{\n    public void paintComponent(Graphics g)\n\
    {\n        Graphics2D g2d = (Graphics2D) g;\n        g2d.setRenderingHint(RenderingHints.KEY_ANTIALIASING,\n\
    \                             RenderingHints.VALUE_ANTIALIAS_ON);\n        String\
    \ str = \"Knud den Helige\";\n        Font font = new Font(\"Serif\", Font.PLAIN,\
    \ 36);\n        FontRenderContext context = g2d.getRenderContext();\n        g2d.translate(20,\
    \ 50);\n        GlyphVector glyphs = font.createGlyphVector(context, str);\n \
    \       int length = glyphs.getphsCount();\n        for (int i = 0; i < length;\
    \ i++) {\n            Point2D p = glyphs.getGlyphPosition(i);\n            AffineTransform\
    \ trans =\n            AffineTransform.translateInstance(p.getX(), p.getY());\n\
    \            trans.rotate(i / (double) (length - 1) * Math.PI / 4);\n        \
    \    g2d.fill(trans.createTransformedShape(glyphs.getGlyphOutline(i)));\n    \
    \    }\n    }\n}\n```\n\n![](img/6c4faa569f96988b2c15c2a846193c23_94_0.png)\n\n\
    ![](img/6c4faa569f96988b2c15c2a846193c23_94_1.png)\n\n## 6 COLORS\n\nColors are\
    \ treated several places in this series of books, and as a programmer, you usually\
    \ need to know more than what has already been said. Colors are formed by combining\
    \ the values of three colors red, green and blue, why we are talking about RGB\
    \ encoding. In addition, an alpha value is associated, which tells the extent\
    \ to which the color is transparent. Each of the four values is represented by\
    \ a byte (and thus can have 256 different values), and internally a color is represented\
    \ by a 32 bit int:\n\n| Alpha | Red | Blue | Green |\n|---|---|---|---|\n\nThe\
    \ basic class to represents a color is Color, and it has been used many times\
    \ before. Looking at all the previous examples, the use of colors is generally\
    \ simple, but the reality that colors is same as the text are extremely complex,\
    \ and therefore this section as a brief introduction to the problems regarding\
    \ colors. In short, the problems can be explained by the fact that certain colors\
    \ can look different (and often do) on different screens, and even worse, if printed\
    \ on a color printer. The reasons are that the computer's color representation\
    \ are relative (what does it actually mean a color is 40% red?) and that different\
    \ hardware devices (screen and printer) do not display the same color in the same\
    \ way. I will explain a little bit below, but first an example.\n\nThe ColorProgram\
    \ application opens the following:\n\n![](img/6c4faa569f96988b2c15c2a846193c23_95_0.png)\n"
  mdcn: "\n\n## JAVA 10: JAVA2D, 窗口绘图与图像处理\n\nILayout 基本上是单行文本，如果文本需要填充几行，你必须进行更好的处理，但幸运的是有可以使用的辅助类。考虑下面的窗口。程序所做的事情是在窗口中显示文本（当然，用\
