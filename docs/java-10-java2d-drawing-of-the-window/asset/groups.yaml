    \n## JAVA 10: JAVA2D, DRAWING OF THE WINDOW AND IMAGE PROCESSING RENDERING\n\n\
    ## 4.2 COMPOSITING\n\nCompositing refers to the process to put two images together\
    \ and appears each time a shape or image is drawn. Graphics2D representing as\
    \ mentioned a drawing surface, every time you on this surface draw, some text\
    \ or image, this adds a new element to the drawing surface. This takes place in\
    \ principle using three operations:\n\n- 1. Rasterizing produce from the current\
    \ figure alpha values that you can think of a grid of pixels, each having an alpha\
    \ value. In principle, this grid corresponds to the entire drawing surface and\
    \ are referred to below for the source. In contrast, the drawing surface is called\
    \ the destination.\n- 2. For each pixel in the source is determined the color\
    \ either on the current Paint used by the Graphics2D object or an image.\n- 3.\
    \ Source and destination (color and alpha value) are combined pixel by pixel to\
    \ form the image on the drawing surface. The combination of source and destination\
    \ is done from a compositing rule that exactly specify how color and alpha values\
    \ has to be used.\n\nIf, for example you look at what happens when a black figure\
    \ is rendered on a white drawing surface and using the default compositing rule,\
    \ you can describe the process as follows. Rasterizing convert the figure to an\
    \ array of alpha values where pixels completely out of the shape are given the\
    \ value 0.0 (interpreted as transparent), and the corresponding pixels in the\
    \ destination will remain unchanged. Similarly, pixels in the interior of the\
    \ figure will have the alpha value 1.0, and the corresponding pixels in the destination\
    \ will get the same color as sources pixels, and the result will win in this case\
    \ be a black color.\n\nThen there are the pixels, which is located on the edge,\
    \ that get an alpha value between 0.0 and 1.0 (assuming some antialasing). They\
    \ have a color that is a combination of colors of pixels in the source and destination,\
    \ and in this case it will a combination of black and white and thus a shade of\
    \ gray. The exact color is determined by the alpha value in the source. A pixel\
    \ with an alpha value of 0.9, for example give a very dark gray color.\n\nThe\
    \ above is referred to as Compositing default rule, but actually others may be\
    \ used in special cases. They are called Porter-Duff rules, but are not discussed\
    \ here.\n\n## 4.3 CLIPPING\n\nSometimes one is not interested that you can draw\
    \ on the drawing area. When you build complex shapes, there is often a need to\
    \ ensure that you do not draw on other figures, and it can be ensured by specifying\
    \ a clip area. Consider the following window, which is taken from an earlier example:\n\
    \n![](img/6c4faa569f96988b2c15c2a846193c23_68_0.png)\n\nThe difference is only\
    \ that there has been added a button at the top of the window. If you click the\
    \ button, the window is redrawn, and the result is as shown below, which draw\
    \ a triangle. This is done by defined a clip area as a triangle, and it is only\
    \ that part of the component that is redrawn. Click the button once, the result\
    \ is an ellipse, as it is now defined a clip area is an ellipse. Clicking a third\
    \ time, you return to the start. It is simple to define a clip area as the code\
    \ below shows, and you should note that the area can be any Shape:\n\n![](img/6c4faa569f96988b2c15c2a846193c23_68_1.png)\n\
    \n## RENDERING\n\n| Clipping | x |\n|---|---|\n| clip |\n\n![](img/6c4faa569f96988b2c15c2a846193c23_69_0.png)\n\
