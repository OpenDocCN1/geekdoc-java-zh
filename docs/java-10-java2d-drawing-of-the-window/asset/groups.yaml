    \ all graphs (in a merge graph) are stacked (true) or drawn by side by side (false\
    \ is default) – the property is only used for a merge graph\n- scaleX defines\
    \ the scaling in the x axis (horizontal) direction (1 is default and means no\
    \ scaling)\n- scaleY defines the scaling in the y axis (vertical) direction (1\
    \ is default and means no scaling)\n- minimum, that is used for a merge graph\
    \ to calculate the minimum value for the y axis\n- maximum, that is used for a\
    \ merge graph to calculate the maximum value for the y axis\n\nThe class has the\
    \ necessary get and set methods, and to make it easier to define graphs, the class\
    \ has more constructors than shown above.\n\nAs mentioned, there are 9 different\
    \ graphs, as well as the possibility to merge multiple graphs in the same coordinate\
    \ system. The graphs are drawn using Drawer classes, which are tasked with a particular\
    \ graph as well as capturing clicks with the mouse. If you click on a graph with\
    \ the mouse, it must raise an event:\n\n+    1. if clicking on a label (on the\
    \ x axis), the name is associated with the event\n 2. if clicking on the graph\
    \ itself, the event has associated both the name on the x axis label and the corresponding\
    \ function value\n\nDownload free eBooks at bookboom.com"
- md: "\n# JAVA 10: JAVA2D, DRAWING OF THE WINDOW AND IMAGE PROCESSING\n\nAn event\
    \ has the type ChartEvent that has an argument of the following type:\n\n```java\n\
    package paragraphs.charts;\n\npublic class FunctionValue\n{\n    private final\
    \ String name;\n    private final Double value;\n\n    public FunctionValue(String\
    \ name, Double value)\n    {\n        this.name = name;\n        this.value =\
    \ value;\n    }\n\n    public boolean hasValue()\n    {\n        return value\
    \ != null;\n    }\n\n    public String getName()\n    {\n        return name;\n\
    \    }\n\n    public Double getValue()\n    {\n        return value;\n    }\n\
    }\n```\n\nHere is value null if a label is clicked. The reason is that a graph\
    \ can be multi-valued and there may be several values attached to a particular\
    \ label. A listener object for events of this type will implement the interface\
    \ ChartListener, which defines a single event handler.\n\nA graph is a custom\
    \ component:\n\n```java\npublic class ChartComponent extends JComponent implements\
    \ MouseListener\n{\n    private ArrayList<ChartListener> listeners = new ArrayList();\n\
    \    private MultiValues data;\n    private Color borderColor;\n    private int\
    \ gap;\n    private java.util.List<Drawer> drawers;\n\npublic ChartComponent(MultiValues\
    \ data, Font font, int gap, Color borderColor)\n{\n    this.data = data;\n   \
    \ this.gap = gap;\n    this.borderColor = borderColor;\n    setFont(font);\n \
    \   drawers = DrawerFactory.createDrawer(data, getFont());\n    addMouseListener(this);\n\
    \    setBackground(Color.white);\n}\n\npublic Dimension getPreferredSize()\n{\n\
    \    double width = 0;\n    double height = 0;\n    for (int n = 0; n < drawers.size();\
    \ ++n)\n    {\n      width += drawers.get(n).getWidth() + gap;\n      double h\
    \ = drawers.get(n).getHeight();\n      if (height < h) height = h;\n    }\n  \
    \  return new Dimension((int)width, (int)height);\n}\n```\n\n![](img/6c4faa569f96988b2c15c2a846193c23_169_0.png)\n\
    \nWhat do you want to do?\nNo matter what you want out of your future career,\
    \ an employer with a broad range of operations in a load of countries will always\
    \ be the ticket. Working within the Volvo Group means more than 150,000 friends\
    \ and colleagues in 80 countries over the world. We offer great graduates career\
    \ opportunities - check out the Career section at www.volvogroup.com. We look\
    \ forward to getting to know you!\n\nVOLVO\nAB Volvo (publ)\n\nVOLVO TRUCKS |\
    \ REMAN TRUCKS | MACH TRUCKS | VOLVO BUSES | VOLVO CONSTRUCTION EQUIPMENT | VOLVO\
    \ PENTA | VOLVO AIRCARS | VOLVO IT\nVOLVO FINANCIAL SERVICES | VOLVO 2P | VOLVO\
    \ PARTNERS | VOLVO PORTS | VOLVO TECHNOLOGY | VOLVO LOGISTICS | BUSINESS AREA\
    \ INDIA\n\n```java\npublic void paintComponent(Graphics g)\n{\n  Graphics2D g2d\
    \ = (Graphics2D)g;\n  Dimension size = getSize();\n  g2d.setPaint(getBackground());\n\
    \  g2d.fill(new Rectangle2D.Double(0, 0, size.width, size.height));\n  g2d.setFont(getFont());\n\
    \  DrawingTools.smoothGraphics(g2d);\n  double offset = 0;\n  if (data.isMerge(offset))\
    \ {\n    (MergeDrawer)drawers.get(0).draw(g2d, 0, 0, offset);\n  } else for (int\
    \ n = 0; n < data.size(); ++n)\n    offset += ((SingleDrawer)drawers.get(n)).draw(g2d,\
    \ n, 0, offset) + gap;\n  if (borderColor != null) {\n    g2d.setStroke(new BasicStroke(0.5f));\n\
    \    g2d.setPaint(borderColor);\n    Dimension dim = getPreferredSize();\n   \
    \ g2d.setClip(new Rectangle2D.Double(0, 0, dim.width + 1, dim.height + 1));\n\
    \    g2d.draw(new Rectangle2D.Double(0, 0, dim.width, dim.height));\n  }\n}\n\n\
    public void\npublic addChartListener(ChartListener listener)\n{\n  listeners.add(listener);\n\
    }\n\npublic void removeChartListener(ChartListener listener)\n{\n  listeners.remove(listener);\n\
    }\n\npublic void mouseClicked(MouseEvent e)\n{\n  for (int n = 0; n < drawers.size();\
    \ ++n)\n  {\n    FunctionValue functionValue =\n      drawers.get(n).get(e, e.getX(),\
    \ e.getY());\n    if (functionValue != null) {\n      ChartEvent event = new ChartEvent(this,\
    \ functionValue);\n      for (ChartListener listener : listeners) listener.chartClicked(event);\n\
    \      return;\n    }\n  }\n}\n```\n\nThe component is created on the basis of\
    \ a MultiValues object and hence the definition of graph. In addition, you must\
    \ specify the font to be used and you can specify a gap between individual graphs\
    \ (if it is multi-valued graph) and if an edge be drawn around the graph. The\
    \ class has more constructors as a list of Drawer objects, shown above. Where\
    \ there is a Drawer for each graph. These Drawer objects are created using the\
    \ class DrawerFactory, which is a simple factory. The method paintComponent()\
    \ uses these Drawer objects to draw the component, and it is also paintComponent()\
    \ which draws an edge about the component. Should an edge be drawn, the preferred\
    \ size of the component is used, which is also determined using the Drawer objects.\
    \ The same applies to the mouse to determine whether a graph is clicked. That\
    \ is, the Drawer classes are key:\n\nDrawer is an interface that defines three\
    \ methods that define the width and height of the nth graph in ChartComponent,\
    \ and also a method that returns a FunctionValue if this Drawer is clicked. In\
    \ general, a graph is drawn as a rectangular figure with a margin. The margin\
    \ is used, for example, to the axes of the coordinate system, and the margin of\
    \ the figure is used for the size so determined by the current graph (not all\
    \ graphs have coordinate system). SingleDrawer is an abstract class, which implements\
    \ the interface as well as methods that determine a graph's margin and draw the\
    \ graph. The class also defines functions where you should be aware that they\
    \ only scale the graph, not the margin. As an example, two graphs are shown below,\
    \ where the only difference is that the second is scaled:\n\n![](img/6c4faa569f96988b2c15c2a846193c23_172_0.png)\n\
    ![](img/6c4faa569f96988b2c15c2a846193c23_172_1.png)\n\nThe type of above graph\
    \ is VBAR, and there is a specific class VbarDrawer, derived from SingleDrawer.\
    \ This drawer is used to draw the above graphs. There are correspondingly other\
    \ specific Drawer classes, which are derived from SingleDrawer. As another example,\
    \ there is shown below a multi-valued graph, where the first has the type HBAR\
    \ and is drawn with HbarDrawer, while the other is of the type PIE and is drawn\
    \ with PieDrawer.\n\n![](img/6c4faa569f96988b2c15c2a846193c23_173_0.png)\n\nThe\
    \ code for these drawer classes is similar to each other and, in principle, they\
    \ are quite simple although there may be many details attached to implementing\
    \ the drawing functions. The classes use more auxiliary classes, including classes\
    \ that draw the axes. Here, especially the classes that draw the y axes are complex,\
    \ as they typically depend on the actual numbers to make a sensible decision of\
    \ the axis.\n\nThen there is MergeDrawer which is also a concrete class, but it\
    \ draws the graph using other Drawer objects. If you have a multi-valued function,\
    \ you can draw the graphs in the same coordinate system, which is what I have\
    \ called a merge graph. As an example, below is shown a merge of a LINE graph\
    \ and a VBAR graph.\n\n![](img/6c4faa569f96988b2c15c2a846193c23_174_0.png)\n\n\
    Now you cannot generally merge graphs. For example, it makes no sense to merge\
    \ a histogram (VBAR graph) and a pie graph, and it makes no sense to merge a VBAR\
    \ and a HBAR graph. The MergeDrawer class starts by dividing the graphs into some\
    \ categories similar to how they can be merged, and for each of these, a Drawer\
    \ class is defined. It leads to no less than 14 new Drawer classes, all of which\
    \ are in principle similar to the above, but instead, they are derived from the\
    \ abstract class MultiDrawer, that as a single drawer this time draws a multi-valued\
    \ graph. When there are so many MultiDrawer classes to:\n\n- that you can specify\
    \ whether merged graphs should use the same axis or use their one axis\n- that\
    \ you can specify whether bar charts be drawn by side by side or stacked\n\nSpecifically,\
    \ it corresponds to the following MultiDrawer classes:\n\n- MSCLPBDrawer, which\
    \ merges LINE, CURVE, PLOT and VBAR graphs with the same y axis\n- MDCLPBDrawer,\
    \ which merges LINE, CURVE, PLOT and VBAR graphs with different y axis\n- MSVAR3DDDrawer,\
    \ which merges VBAR3D graphs with the same y axis\n- MDVAR3DDDrawer, which merges\
    \ VBAR3D graphs with different y axis\n- MSHBARDrawer, which merges HBAR graphs\
    \ with the same y axis\n- MDHBARDrawer, which merges HBAR graphs with different\
    \ y axis\n"
