    # 2.3 GENERALPATH


    Line2D, QuadCurve2D, CubicCurve2D, Rectangle2D, RoundRectangle2D, Ellipse2D and
    Arc2D are the basic geometric primitives in Java2D, but from the above class diagram
    it appears there are two other classes, and they may be used to define more complex
    shapes.


    The class GeneralPath defines a shape by means of a number of points, where each
    of these points may be a line either of the type Line2D, QuadCurve2D or CubicCurve2D.
    A GeneralPath defines an arbitrary shape, which does not necessarily have to be
    closed or coherent. You can think of the shape on that way, that you draw it with
    a pen, and you can do two things:


    +   1. You can lift the pen and move it to a point.

    2. You can draw a line from the point where the pen is, to another point.


    For that you uses the methods: moveTo(), lineTo(), quadTo(), cubicTo() and closePath().


    The window below three shapes of the type GeneralPath where the red is formed
    by three line segments, a quad segment and a cubic segment. The two other shapes
    are solely formed by the line segments:


