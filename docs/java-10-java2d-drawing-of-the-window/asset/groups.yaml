    # Stretching


    The last of the basic transformations is called shearing, where the x-axis, y-axis,
    or both axes are stretched. The window below shows how to stretch a rectangle
    (the black rectangle). In all three cases the transformation is a parallel shift
    of a rectangle with the upper left corner in (0, 0) followed by a shear transformation.
    This means that all three transformations are a composite transformation. In principle,
    it is simple enough to compose transformations, but the result can be difficult
    to understand, and the order is of significance.


