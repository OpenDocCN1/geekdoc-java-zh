    # JAVA 10: JAVA2D, DRAWING OF THE WINDOW AND IMAGE PROCESSING


    The type of above graph is VBAR, and there is a specific class VbarDrawer, derived
    from SingleDrawer. It is this drawer that is used to draw the above graphs. There
    are correspondingly 8 other specific Drawer classes, which are derived from SingleDrawer.
    As another example, there is shown below a multi-valued graph, where the first
    has the type HBAR and is drawn with a HbarDrawer, while the other is of the type
    PIE and is drawn with a PieDrawer.


    ![](img/6c4faa569f96988b2c15c2a846193c23_173_0.png)


    The code for these 9 concrete drawer classes is similar to each other and, in
    principle, they arre quite simple, although there may of course many details attached
    to implementing the drawing functions. The classes use more auxiliary classes,
    including classes that draw the axes. Here, especially the classes that draw the
    y axes are complex, as they typically depend on the actual numbers to make a sensible
    decision of the axis.


    Then there is the MergeDrawer which is also a concrete class, but it draws the
    graph using other Drawer objects. If you have a multi-valued function, you can
    draw the graphs in the same coordinate system, which is what I have called a merge
    graph. As an example, below is shown a merge of a LINE graph and a VBAR graph.'
  - '[PAGE 174]


    # JAVA 10: JAVA2D, DRAWING OF THE WINDOW AND IMAGE PROCESSING


    ![](img/6c4faa569f96988b2c15c2a846193c23_174_0.png)


    Now you can not generally merge graphs. For example, it makes no sense to merge
    a histogram (VBAR graph) and a pia graph, and it makes no sense to merge a VBAR
    and a HBAR graph. The MergeDrawer class starts by dividing the graphs into some
    categories similar to how they can be merged, and for each of these, a Drawer
    class is defined. It leads to no less than 14 new Drawer classes, all of which
    are in principle similar to the above, but instead, they are derived from the
    abstract class MultiDrawer, that as a single drawer this time draws a multi-valued
    graph. When there are so many MultiDrawer classes to


    +   1. that you can specify whether merged graphs should use the same axis or
    use there one axis

    2. that you can specify whether bar charts be drawn by side by side or stacked


    Specifically, it corresponds to the following MultiDrawer classes:


    +   1. MSCLPBDrawer, which merges LINE, CURVE, PLOT and VBAR graphs with the same
    y axis

    2. MDCLPBDrawer, which merges LINE, CURVE, PLOT and VBAR graphs with different
    y axis

    3. MSVAR3DDDrawer, which merges VBAR3D graphs with the same y axis

    4. MDVAR3DDDrawer, which merges VBAR3D graphs with different y axis

    5. MSHBARDrawer, which merges HBAR graphs with the same y axis

    6. MDHBARDrawer, which merges HBAR graphs with different y axis'
