    \      return;\n    }\n  }\n}\n```\n\n组件基于 `MultiValues` 对象创建，因此定义了图。此外，必须指定使用的字体，并指定各个图之间的间隙（如果是多值图），以及绘制图周围的边界。该类拥有一个\
    \ `Drawer` 对象列表，如上所示，每个图都有对应的 `Drawer`。这些 `Drawer` 对象使用 `DrawerFactory` 类创建，这是一个简单的工厂。`paintComponent()`\
    \ 方法使用这些 `Drawer` 对象来绘制组件，同样的 `paintComponent()` 方法绘制组件的边界。如果绘制边界，则使用组件的理想尺寸，这同样是使用\
    \ `Drawer` 对象确定的。适用于判断图是否被点击的鼠标。也就是说，`Drawer` 类的关键在于：\n\n`Drawer` 是一个接口，定义了确定\
    \ `ChartComponent` 中第 n 个图宽度和高度的方法，以及一个当该 `Drawer` 被点击时返回 `FunctionValue` 的方法。通常，图被绘制为带有边界的矩形图形。边界用于坐标系的轴，而图形的尺寸则由当前图决定（并非所有图都有坐标系）。`SingleDrawer`\
    \ 是一个抽象类，它实现了该接口，并定义了确定图边界和绘制图的方法。该类还定义了函数，你应该注意它们只缩放图，而不是边界。例如，下方显示了两个图，区别在于第二个被缩放了：\n\
    \n![](img/6c4faa569f96988b2c15c2a846193c23_172_0.png)\n![](img/6c4faa569f96988b2c15c2a846193c23_172_1.png)\n\
    \n上述图的类型是 `VBAR`，有一个继承自 `SingleDrawer` 的特定类 `VbarDrawer`。该绘制器用于绘制上述图。相应的其他继承自\
    \ `SingleDrawer` 的特定 `Drawer` 类。另一个例子是下方显示了一个多值图，其中第一个是 `HBAR` 类型并由 `HbarDrawer`\
    \ 绘制，而另一个是 `PIE` 类型并由 `PieDrawer` 绘制。\n\n![](img/6c4faa569f96988b2c15c2a846193c23_173_0.png)\n\
    \n这些 `drawer` 类的代码彼此相似，原则上它们非常简单，尽管实现绘制函数时可能涉及许多细节。这些类使用了更多的辅助类，包括绘制轴的类。在这里，绘制\
    \ y 轴的类特别复杂，因为它们通常取决于具体的数值来做出轴的决定。\n\n然后是 `MergeDrawer`，它也是一个具体类，但它使用其他 `Drawer`\
    \ 对象绘制图。如果你有一个多值函数，你可以在同一个坐标系中绘制这些图，这就是我所说的“合并图”。例如，下方显示了 `LINE` 图和 `VBAR` 图的合并。\n\
    \n![](img/6c4faa569f96988b2c15c2a846193c23_174_0.png)\n\n现在你不能通地合并图。例如，合并直方图（`VBAR`\
    \ 图）和饼图是没有意义的，合并 `VBAR` 和 `HBAR` 图也没有意义。`MergeDrawer` 类首先将图分为若干类（类似于它们可以合并的方式），并为每种类型定义一个\
    \ `Drawer` 类。这导致了不少于 14 个新的 `Drawer` 类，所有这些类在原则上都与上述相似，但它们继承自抽象类 `MultiDrawer`，该类在此时作为单一绘制器绘制多值图。当有如此多的\
    \ `MultiDrawer` 类来满足：\n\n- 你可以指定合并后的图是使用相同的轴还是使用它们各自的轴\n- 你可以指定柱图是并排绘制还是堆叠绘制\n\
    \n具体来说，它对应于以下 `MultiDrawer` 类：\n\n- `MSCLPBDrawer`，将相同 y 轴的 `LINE`、`CURVE`、`PLOT`\
    \ 和 `VBAR` 图合并\n- `MDCLPBDrawer`，将不同 y 轴的 `LINE`、`CURVE`、`PLOT` 和 `VBAR` 图合并\n\
    - `MSVAR3DDDrawer`，将相同 y 轴的 `VBAR3D` 图合并\n- `MDVAR3DDDrawer`，将不同 y 轴的 `VBAR3D`\
    \ 图合并\n- `MSHBARDrawer`，将相同轴的 `HBAR` 图合并\n- `MDHBARDrawer`，将不同轴的 `HBAR` 图合并\n\n"
