    A Guide to Responsible Digital Reading


    Most readers understand that buying a book printed on 100%


    recycled, ancient-forest friendly paper is a more environmentally


    responsible choice than buying one printed on paper made from


    virgin timber or old-growth forests. In the same way, the choices we


    make about our electronic reading devices can help minimize the


    environmental impact of our e-reading.


