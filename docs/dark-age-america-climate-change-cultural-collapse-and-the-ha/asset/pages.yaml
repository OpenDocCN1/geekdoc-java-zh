    According to the United Nations Environment Programme some 20


    to 50 million metric tonnes of e-waste are generated worldwide


    every year, comprising more than 5% of all municipal solid waste.


    Toxic chemicals in electronics, such as lead, cadium and mercury,


    can leach into the land over time or can be released into the


    atmosphere, impacting nearby communities and the environment.


    The links below will help you to recycle your electronic devices


    responsibly.


    Electronics Take Back


    Canada - Recycle My Electronics


    United States - E-cycling central


    Of course, the greenest option is to keep your device going as long


    as possible. If you decide to upgrade, please give some thought to


    passing your old one along for someone else to use.'
