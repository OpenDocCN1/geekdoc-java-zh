  md: '# ELEMENTS OF A SMARTPHONE


    | ELEMENTS COLOUR KEY | ALKALI METAL | ALKALINE EARTH METAL | TRANSITION METAL
    | GROUP 13 | GROUP 14 | GROUP 15 | GROUP 16 | HALOGEN | LANTHIDE |


    # ## SCREEN


    # ## ELECTRONICS


    Indium tin oxide is a mixture of indium and tin in a transparent film in the screen
    that produces colours and enables the touch screen.


    Copper is used in the circuitry parts of the phone which are the major metals
    which are fashioned. Tantalum is the major capacitor component.


    ![](img/a386838adb0425174aa1325211f6f703_169_0.png)


    ![](img/a386838adb0425174aa1325211f6f703_169_1.png)


    The glass used on the monitors of smartphones is an aluminosilicate glass containing
    silica (SiO2) and alumina (MgO), which helps to strengthen it.


    Nickel is used in the microphone as well as for other electrical connections.
    Gold is also used for contacts. The magnets in the speaker and vibrator are made
    of neodymium-iron alloys.


    A variety of Rare Earth Elements are used in the components to produce the colours
    and absorb UV light penetration into the phone.


    Pure silicon is used to manufacture the chip circuits to produce non-conducting
    regions, which are layered to control the electricity.


    ![](img/a386838adb0425174aa1325211f6f703_169_2.png)


    ![](img/a386838adb0425174aa1325211f6f703_169_3.png)


    # ## BATTERY


    The majority of phones use lithium ion batteries, which are composed of lithium
    cobalt oxide as the positive electrode. Some batteries use other metals as the
    electrode. The battery''s casing is made of aluminum.


    Magnesium is used to make some phone cases, which are made of plastic containing
    flame-retardant compounds, some of which are used to reduce electromagnetic interference.


