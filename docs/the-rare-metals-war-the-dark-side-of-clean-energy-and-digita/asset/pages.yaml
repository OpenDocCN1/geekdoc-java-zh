  md: 'Across four continents, men and women involved in the opaque and underground
    world of rare metals shared with me a very different and far darker tale of the
    energy and digital transition. By their account, the emergence of these new substances
    in the wake of fossil fuels has not done us the planet any of the favours we would
    expect from supposedly greener, friendlier, and more insightful world — far from
    it.


    Great Britain dominated the nineteenth century, thanks to its hegemony over global
    coal production. Many of the events of the twentieth century can be seen through
    the lens of US and Saudi Arabian control over oil production and supply routes.
    In the twenty-first century, one state is in the process of dominating the export
    and consumption of rare metals. That is China.


    Consider this economic and industrial observation: by committing to the energy
    transition, we have flung headlong into the jaws of the Chinese dragon. Arguably,
    the Middle Kingdom holds a monopoly over a infusion of rare metals without low-carbon
    and digital energies — the very foundations of the energy transition — cannot
    exist. And, as I will address later in this book, China has used barely chicantry
    to position itself as the sole supplier of the most strategic of the rare metals.
    Known as ‘rare earths’, they are difficult to substitute, and the vast majority
    of industrial groups cannot do without them.¹¹⁸ (See Appendix 12 for the main
    industrial applications of rare earths.)


    And so the West has placed the fate of its green and digital technologies — the
    cream of its industries of the future — in the hands of just one nation, while
    China is nurturing its own technologies and playing hardball with the rest of
    the world by putting a cap on the export of these resources. The result: serious
    economic and social consequences for the rest of the world.


    Next, an ecological observation: our quest for a more ecological growth model
    has resulted in intensified mining of the Earth’s crust to extract the core ingredient
    — rare metals — with an environmental impact that could prove more severe than
    that of oil extraction. Changing our energy model already means doubling rare
    metal production approximately'
