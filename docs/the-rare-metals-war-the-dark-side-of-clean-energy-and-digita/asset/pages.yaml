  md: 'Changing the way we produce and therefore consume energy is humanity’s next
    great adventure. Political leaders, Silicon Valley entrepreneurs, proponents of
    more moderate consumption, Pope Francis, and environmental groups have urged us
    to make this change, curbing global warming and saving ourselves from a second
    flood. Never have empires, religions, and money been aligned behind a single undertaking.
    The proof of this — described by former French president Hollande as the ‘first
    universal agreement in his history’ — is neither peace treaty, no trade deal,
    no financial regulation. The Paris agreement that was signed in 2015 following
    the twenty-first conference of parties to the United Nations Framework Convention
    on Climate Change (COP 21) is, in fact, an energy treaty.


    The technologies we use every day change, but our primary need for energy will
    not. Yet, faced with the question of what resource could possibly replace oil
    and coal as we embrace a new and greener world, no one really knows the answer.
    Our nineteenth-century ancestors knew the importance of coal, and the enlightened
    man on the street in the twentieth century was well aware of the need for oil.
    But today, in the twenty-first century, we are unaware that a more sustainable
    world is largely dependent on rock-borne substances called rare metals.


    Humans have long mined the big names in primary metals: iron, gold, silver, copper,
    lead, aluminium. But from the 1970s, we turned our sights to the superb magnetic,
    catalytic, and optical properties of a cluster of lesser-known rare metals found
    in terrestrial rocks in infinitesimal amounts. Some of this large family sport
    the most exotic names: rare earths, vanadium, germanium, platinumoids, tungsten,
    antimony, beryllium, fluorine, rhenium, tantalum, niobium, to name a few. Together,
    these rare metals form a coherent subset of some thirty raw materials with a shared
    characteristic: they are often associated with nature’s most abundant metals.


    As with all elements extracted from nature in Lilliputian quantities, rare metals
    are concentrates packed with remarkable properties. It is a long and painstaking
    process, to distill orange blossom oil, but the perfume and therapeutic powers
    of a single drop of this elixir continue'
