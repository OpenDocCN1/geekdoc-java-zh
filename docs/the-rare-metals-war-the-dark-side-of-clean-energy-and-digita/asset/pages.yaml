    # A new world order


    The Rhône-Poulenc saga brings to mind those who despair of where the world is
    headed. To find a sense of order in this ‘chaos’, they latch on to clean divides:
    countries of the north and countries of the south; countries of the east and countries
    of the west (once separated by the Berlin Wall); emerging countries and developed
    countries; the Orient and the Occident; the free world versus the axis of evil;
    ‘Old Europe’ against the vibrant ‘New World’; and so on. But there may be even
    a deeper divide that began twenty years ago — one that tells the story of the
    world we are making. It did not follow a treaty in Versailles, a congress in Vienna,
    or a conference in Yalta. Rather, it is an industrial order that formed organically
    between China and the West (to polarise once more).


    It first formally acknowledged in the infamous ‘Summers Memo’, an internal document
    at the World Bank signed in 1991 by its chief economist, Lawrence Summers. He
    reportedly recommended that developed economies export their polluting industries
    to poor countries, and especially to ‘underpopulated countries in Africa [that
    are] vastly underpopulated’, as ‘the economic logic ... is impeccable’.^{25} Anxious
    to explain himself after the mess was leaked, Summers naturally pleaded intentional
    sarcasm. Yet his comments are perfectly aligned with the reality: as societies
    strive towards ‘zero risk’, all kinds of industrial activities have steadily pushed
    out of Europe and the rest of the Western world.^{26}


    Consider the example of REACH — the European regulation aimed at minimising the
    sanitary risks associated with over 30,000 chemicals found in consumer goods.^{27}
    It has vastly improved the quality of life of the European Union’s 445 million
    citizens, and especially that of industrial'
  merge: -1
