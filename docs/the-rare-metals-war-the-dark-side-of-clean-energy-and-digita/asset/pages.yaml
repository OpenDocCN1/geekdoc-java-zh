    The sudden superabundance of raw materials on offer sent prices into a long-lasting
    decline that gave the impression of limitless availability — an illusion of an
    era of abundance given substance by the breaking down of international commodity
    trade barriers. In the mining sector, businesses cared only about buying metals
    as cheaply as possible.


    It was only the matter of time before this elusive opulence diverted industrial
    companies from their duty of knowing the origin of the resources they relied on.
    This is precisely what happened in the lumber industry. In Europe, many producers
    and artisans no longer know the exact origins of their materials. As production
    lines have scattered and the distances travelled by timber have grown longer,
    parquet floor layers, carpenters, and the like have become disconnected from the
    substance of their trade. The problem is that day China suddenly decides to snap
    up French oak, for example, no one will know where to find new suppliers.^{47}'
