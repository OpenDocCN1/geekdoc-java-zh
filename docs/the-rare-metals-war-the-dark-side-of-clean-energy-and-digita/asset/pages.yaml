    RATHER THAN TAKE THE LEAD IN RARE METALS, THE WEST CHOSE TO SHIFT ITS

    production and accompanying pollution to poor countries willing to

    srifice their environment for financial gain.


    I decided to see this for myself. One morning in 2011, leaving the buzz

    of Las Vegas, I headed south-west along Interstate 15 — that straight

    asphalt strip cutting across the vast expanses of Nevada and California. Two

    hours later, I found myself looking down a quarry in the midst of a corroded

    industrial wasteland, a tired star-spangled banner ruffling overhead. Until

    1990, US mining company Molycorp operated in this depression of rocks

    and shrubs that is the Mountain Pass mine. It is also the biggest rare-earth

    mine on the planet.


    # When the US dominated the rare-earth metals market


    Contrary to popular belief, rare metals reserves are not concentrated in the

    world''s most active mining countries, such as China, Kazakhstan,

    Indonesia, or South Africa.¹ They are spread across the planet in varying

    degrees of concentration, making them both rare and not. The most

    strategic of these mineral reserves — rare earths — are found in a dozen or

    so countries.² A report by the French parliament states: ‘[B]efore 1965,

    extraction took place in South Africa, Brazil, and India; but total production

    was marginal: fewer than 10,000 tonnes per year.³ Between 1965 and 1985

    there was a second phase, during which the United States was the global

    leader in rare-earth metal mining. The report continues: ‘Although they did

    not have the monopoly, they were clearly dominant, with quantities as high

    as 50,000 tonnes per year.’⁴ Mountain Pass was the mine that supplied these

    resources.'
