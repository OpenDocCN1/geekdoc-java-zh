    Nicholas Curtis, acquired Mount Weld — one of the largest rare-earth deposits
    on the planet, located in the state of Western Australia. ‘Curtis believed these
    materials would become highly strategic given the diversity of their applications,
    be it for cars, phosphates, or televisions. He founded the junior mine house Lynas
