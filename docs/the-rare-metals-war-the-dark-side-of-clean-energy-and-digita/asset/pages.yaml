  md: 'would have had Rudyard Kipling green with envy, and drift silently over epic
    landscapes in the helium-inflated envelope of a hot-air balloon. Broadcaster TF1
    sold viewers the dream — while selling off the little attention they had left.
    At the very bottom of the screen could be seen the rectangular logo of the program’s
    official sponsor, French chemical company Rhône-Poulenc, together with the tagline:
    ‘Welcome to the world of adventure, human feats, and exploits!’


    Before its chemical arm became Rhodia in 1998 and it merged with Belgian group
    Solvay in 2011, Rhône-Poulenc was one of the two biggest rare metals chemical
    companies in the world.” In the 1980s, its factory in La Rochelle, in the west
    of France, purified between 8,000 and 10,000 tonnes of rare earths every year
    — that is, 50 cent of their global supply.


    This merits repeating: half of the most strategic rare metals — the resources
    of the future that would shape the energy and digital transition — were beneficiated
    in France. The country possessed unparalleled chemical knowledge coupled with
    superior acumen. So much, in fact, that French intelligence agencies monitored
    access at the plant just in case a Russian or Chinese guest on a working visit
    decided to indulge in a bit of industrial espionage.


    The Rochelle plant sits on a 40-hectare site along the coast west of the city.
    It is still in operation, and I was able to visit it in 2011. In the shadow of
    colossal warehouses, rare earths are separated and calcined in high-temperature
    furnaces to produce oxides (powders) that are packaged for the market. In the
    adjoining warehouses are row upon tightly packed bundles stamped with names we
    are now familiar with: cerium, dysprosium, neodymium, terbium, and so on. There
    is also an R&D laboratory, but the activity of the refinery itself is a shadow
    of its heyday twenty-five years ago.


    It’s no secret that extracting and refining rare earths produces high amounts
    of pollution. This is due to their natural association with radioactive elements,
    such as thorium and uranium. During separation of the Rochelle plant, radon was
    released, albeit in minute quantities. Former employees of the French industrial
    company insist that inhaling the weakly'
