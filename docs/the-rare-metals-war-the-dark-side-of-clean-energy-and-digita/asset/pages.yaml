  md: 'Albert Einstein left us with a powerful statement: ‘We cannot solve our problems
    with the same thinking we used when we created them.’ Only with a revolution of
    consciousness can an industrial, technical, and social revolution be meaningful.


    This book has sketched sparse evidence of consciousness in the rare metals industry:
    German manufacturers opting for more expensive tungsten to maintain the diversity
    of their supply; attempts by Chinese authorities to end the rare-earths black
    market in Jiangxi province so as to protect the resource; and in Tokyo, Professor
    Okabe’s attempts to recycle metals using salt from the high plains of Bolivia.


    For their part, consumers can do more through their own behaviour. The awareness
    is there, and every one of us already recognise the need to limit our consumption
    of electronic goods for obsolescence, to ‘eco-design’ goods for easy recycling
    and less waste, to opt for short supply loops, and to focus on saving resources.
    While moderate consumption does not necessarily lead to ‘degrowth’, the best energy
    is that which we use wisely.


    I end on this note with French engineer Christian Thomas, who leaves us with a
    comment of optimism and common sense: ‘We don’t have a rare material problem;
    we have a grey matter problem.


    Will we know how to put our grey matter towards finding the antidote to rare metals?'
