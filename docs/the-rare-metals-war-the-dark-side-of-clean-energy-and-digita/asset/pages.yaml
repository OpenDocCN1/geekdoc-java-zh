  md: '# Introduction


    FOR FOUR THOUSAND YEARS, HUMANS DEPENDENDED ON FIRE, CAPRICIOUS winds and currents,
    and manpower and horsepower to roam, build fortresses, and work the land. Energy
    was a rare and precious resource, movement was slow, economic growth sluggish.
    Progress came in fits and starts, and history tended to be made one slow step
    at a time.


    Then, from the eighteenth century, humans used the steam engine to power their
    looms, propel locomotives, and float battleships to reign over the seas. Steam
    propelled the first industrial revolution. This was the world''s first energy
    transition, and one underpinned by the use of an indispensable fuel: a black stone
    called coal.


    In the twentieth century, humans cast aside steam for another innovation: the
    petrol engine. This technology made vehicles, boats, and tanks more powerful,
    and paved the way for a new machine — the airplane — to conquer the skies. This
    second industrial revolution was also an energy transition, this time relying
    on the extraction of another resource: a rock oil petroleum.


    The disruptive effects of fossil fuels on the climate since the turn of the current
    century have driven humanity to develop new and supposedly cleaner and more efficient
    engines — wind turbines, solar panels, electric batteries — that can connect to
    high-voltage ultra-performance grids. After the steam engine and the internal-combustion
    engine, these ‘green’ technologies have shifted into a third energy and industrial
    revolution that is changing the world as we know it. Like its two predecessors,
    this revolution draws on a resource so vital that energy experts, techno-prophets,
    heads of state, and military strategists already refer to it as The Next Oil of
    the twenty-first century.


    What resource are we talking about?


    Most people don''t have the slightest idea.'
