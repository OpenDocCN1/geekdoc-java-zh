    # Rare metals: drivers of new energies


    Since the dawn of time, humans have sought to transform sources of natural energy
    (such as wind, thermal, solar) Take the windmill, for instance. Its vanes and
    rotor are driven by wind energy to actuate a mechanical mill that crushes olives
    or grain. In the steam engine, thermal energy transported by steam from water
    is converted, into pistons, into mechanical energy powerful enough to drive a
    locomotive. Thermal energy is also generated by the combustion of fuel to drive
    the pistons of a vehicle and set it in motion. In essence, we have been making
    movement-generating machines for centuries.¹ The we multiply the possibilities
    of movement, the more we can travel and trade, entrust new tasks to machines and
    robots, and make productivity gains — and therefore greater profits.


    Energy needs to be both abundant and inexpensive to ensure that machines run efficiently
    — a challenge we must overcome to satisfy our economic-growth ambitions. Thus,
    for almost three centuries we have been working tirelessly at developing new engines
    with increasingly impressive power-to-weight ratios: the more compact and less
    resource-intensive they are, the greater their mechanical output.


    Enter rare metals. While mineralogists have known of their existence since the
    eighteenth century, they garnered little interest while their industrial applications
    remained undiscovered. But from the 1970s, humans began to exploit the exceptional
    magnetic properties of some of these metals to make super magnets.⁵


    An electrical charge coming into contact with the magnetic field of a magnet generates
    a force that creates movement. The smallest of these magnets is barely the size
    of a pinhead, while the biggest magnet ever designed is four metres high, weighs
    132 tonnes, and is located at the'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Saclay Nuclear Research Centre in the Paris region. ⁶ Irrespective of their
    size, magnets are now — to a vast majority of electric engines — what pistons
    have been to steam and internal-combustion engines. Magnets have made it possible
    to manufacture billions of engines, both big and small, capable of executing certain
    repetitive movements in our stead — whether it be running a motorbike, powering
    a train, making an electric toothbrush or mobile phone vibrate, operating an electric
    window, or launching an elevator to the top of the tallest skyscraper.


