- img_proc: true
  md: 'It’s the same story for perfumes. From the 1950s, globalisation and the low
    cost of labour led to perfume-makers neglecting their flower farms in Grasse,
    in the south of France, in favour of less noble products from Egypt, India, or
    Bulgaria. ‘Perfume was sold based on concepts rather than on the quality of ingredients,’
    a professional tells me. ⁴⁸ It’s a philosophy that the perfume sector is now reconsidering.


    This is also more or less what happened in the industries use rare metals. The
    assumption still exists that resources are available in any quantity and at any
    time. Supporting this utopia are the dogmas of ‘just in time’ and ‘zero stock’.
    Taught in MBA programs over the world, and by big industrial groups, the two production
    management methods were established in 1962 by Taichi Ono, an engineer at the
    Japanese company Toyota (hence the term ‘toyotism’). ‘Just in time’ is about avoiding
    surplus stock by making the time between the manufacture of a product and its
    sale as short as possible, resulting in what is known as ‘lean manufacturing’.
    Its corollary, ‘zero stock’, outsources the management of spare parts and components
    to a multitude of contractors — thereby transferring the risks associated with
    the delivery of raw materials to these third parties.


    This complexification of supply chain logistics means that the exact origins of
    a raw material are not wholly transparent from one end of the supply chain to
    the other. Instead, participants can see no further than one level upstream and
    one level downstream. Surely this explains why, in a recent annual report, under
    the heading ‘raw materials risk’, Thales — a multinational whose rare metals-intensive
    electronics are used in aerospace, defence, security, and land transport sanctiously
    states: ‘Given the nature of its business, Thales uses few raw materials. The
    Group’s exposure to raw materials risk is therefore negligible.’ ⁴⁹


    Hypocrisy? Ignorance? Either way, toyotism has helped relieve businesses of their
    responsibility with respect to ‘metals risks’.


