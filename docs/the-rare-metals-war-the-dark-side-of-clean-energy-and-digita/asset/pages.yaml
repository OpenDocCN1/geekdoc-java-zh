  md: 'When it comes to raw materials, nature can be surprisingly generous or deeply
    parsimonious. Alongside popular species such as the poplar and pine are rare trees
    like the hairy quandong in Australia or the ghost orchid in the UK. Tulips may
    very well overflow the fields of Holland, but other flowers, such as the butterfly
    orchid, barely make an appearance in flower shops in the Netherlands. In these
    parts, the skies abound with birds like the mallard — to the delight of hunters
    across Western Europe. Then there are the more discreet, rarely sighted birds
    like the California condor in North America.


    Similarly, abundant metals like iron, copper, zinc, aluminium, and lead coexist
    with a family of some rare metals.¹ The lists published by the United States Geological
    Survey, an agency of the United States Department of the Interior, and by the
    European Commission are education in themselves: light and heavy rare-earth elements,
    germanium, tungsten, antimony, niobium, beryllium, gallium, cobalt, vanadium,
    tantalum, and other rare metals.


    They share the following traits:


    +   - They are associated with abundant metals found in the Earth’s crust, but
    in minute proportions. For instance, there is 1,200 times less neodymium and up
    to 2,650 times less gallium than there is iron.

    - Naturally, this is reflected in the markets. Rare metal production is on a minute
    scale, and is overlooked by mainstream media: every year, 160,000 tonnes of rare-earth
    metals are produced — 15,000 times less than annual iron production of two billion
    tonnes. Likewise, 600 tonnes of gallium are produced annually, which is 25,000
    times less than the 15 million tonnes of annual copper production. (See the European
    Commission’s list of ‘critical’ metals for the EU in Appendix 13.)

    - This makes these rare metals expensive: a kilogram of gallium is around US$150
    — that is, it is 9,000 times more expensive than iron. Germanium is ten times
    more expensive than gallium.'
