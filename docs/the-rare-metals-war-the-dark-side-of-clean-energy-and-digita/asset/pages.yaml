    West knew well at what cost we were accessing rare-earth metals that were more
    or less clean, and posed no risk to their future generations,’ says a French expert.
    ‘But we preferred to turn a blind eye to what was happening in China.’


    The Americans are not the only ones to have washed their hands of the affair.
    They share this responsibility with the French.


    # Hot-air balloons, adventure, and rare earths: the Rhône-Poulenc saga


    France, a leading supplier of resources for the third industrial revolution? To
    jog our memory, let’s take a look back at one of the shining periods of the humble
    television. In France, many will recall Saturday nights in the 1980s at around
    10.00 pm when everyone gathered around the box to watch Ushuaia. The show’s presenter
    was environmentalist Nicolas Hulot, France’s answer to David Attenborough. Viewers
    were transported to faraway places to encounter little-known peoples, discover
    exotic animals that'
