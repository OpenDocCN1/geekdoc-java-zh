    (*) The ''Import reliance rate'' takes into account global supply and actual EU
    sourcing in the calculation of Supply Risk, and it is calculated as follows: EU
    net imports / (EU net imports + EU domestic production).


    (**) ''Substitution index'' is a measure of the difference in substitutability
    of the material, scored and weighted across all applications, calculated separately
    for both Economic Importance and Supply Risk parameters. Values are between 0
    and 1, with 1 being the least suitable. The economic impact is corrected by the
    Substitution Index (SIEI) related to technical and cost performance of the substances
    for individual applications of each material. The supply risk is corrected by
    the Substitution Index (SISR) related to global production, criticality and co-by-production
    of the substances for individual applications of each material.

    (***) The ''End-of-life recycling input rate'' measures the rate of recycling
    from old scrap to EU demand of a given raw material, the latter equal to primary
    and secondary material inputs to the EU.


