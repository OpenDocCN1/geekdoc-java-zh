  md: 'to astounding researchers.^3 Producing cocaine deep in the Colombian jungle
    is no easier feat, yet the psychotropic effects of just one gram of the powder
    can completely deregulate your central nervous system.^4


    The same applies to the rarest of the rare elements. Eight and a half tonnes of
    rock need to be purified to produce a kilogram of vanadium; sixteen tonnes for
    a kilogram of cerium; fifty tonnes for the equivalent of gallium; and a staggering
    1,200 tonnes for one miserable kilogram of the rarest of the rare metals: lutecium.^5
    (See the periodic table of elements in Appendix 1.) These effectively form the
    ‘primary asset’ of Earth’s crust: a concentration of atoms with outstanding properties,
    fine-tuned by years of geological activity. Once processed industrially, a minute
    dose of these metals emits a magnetic field that makes it possible to generate
    more energy than the same quantity of coal or oil. And this is the key to ‘green
    capitalism’: the replacement of resources with those that do not burn and do not
    generate the slightest gram of it.


    Less pollution, and at the same time lot more energy. Telling, one of these elements
    was given the name ‘promethium’ by chemist Charles Coryell in the 1940s.^5 His
    wife, Grace Mary, suggested the name, based on the Greek myth of the Titan Prometheus,
    who was helped by the goddess Athena to break into the realm of the gods, Olympus,
    and steal the sacred fire ... to give humanity.


    The name says a great deal about the promethean power that we have acquired by
    harnessing rare metals. Like demigods, we have carved out a multitude of applications
    in two fundamental areas of the energy transition: supposedly ‘green’ technologies
    and digital technologies. Today, we are assured that the convergence of these
    two will create a better world. The first examples of this convergence (wind turbines,
    solar panels, and electric cars) are packed with rare metals to produce decarbonised
    energy that travels through high-performance electricity grids to enable power
    savings. Yet these grids are also driven by digital technology that is heavily
    dependent on these same metals. (See Appendix 11 for the main industrial applications
    of rare metals.)'
