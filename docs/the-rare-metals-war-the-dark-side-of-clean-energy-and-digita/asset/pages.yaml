  md: '# CHAPTER ONE

    The rare metals curse


    ‘WHAT DO YOU WANT? YOU HAVE NO BUSINESS HERE!’ A MAN IN HIS FORTIES pulls up to
    us in a black Audi, and stares at us menacingly. He is joined by a companion,
    equally menacing, and soon another man on a motorbike pulls up. ‘You need to leave,
    it’s dangerous. We don’t want any trouble!’

    The three men start to lose their cool; the tension is palpable. ‘Get lost!’ shouts
    the man in the Audi. He can tell that I am trying to buy time by my furtive glances
    at the tent erected incongruously on the hillside.


    ‘People still work here,’ whispered Wang Jing, a former miner and my scout. ‘I
    was sure they’d cleared these quarries ages ago!’ The scatter of new equipment
    and evacuation pipes in the area confirm my doubts. Two hundred metres away, the
    telltale tent stands beside the tailings ponds and disembowel rocky landscape.
    There can be no doubt that rare metal–refining activities are taking place at
    this camp. Where are they extracting the minerals? ‘From the mines all around,
    but also from the enormous illegal quarries flanking the hill,’ Wang Jing explains.


    Two days earlier that July 2016, I had landed at the tiny airport of Ganzhou,
    in the town in the Chinese province of Jiangxi 700 kilometres south of Beijing.
    From there, I drove south for hours on battered roads, hemmed in by row upon row
    of rice paddies, to reach the mines. The last few kilometres took me little more
    than ribbons of asphalt, weaving between rickshaws and trailers laden with rubble,
    and women wearing the traditional cao mào conical hat. Out of the foothills of
    the Nan mountains burst lotus forests and palm trees — a lush and abundant organic
    kingdom of stifling foliage pushing into the blue sky.


    I was also in the biggest rare metals mining area on the planet.


