    At the start of the decade, George Bush and Margaret Thatcher gave wing to the
    ‘peace dividend’. The fall in military spending at the end of the Cold War gave
    rise to a new era of peace and economic prosperity. One can recall the feeling
    of optimism — euphoria even — that reigned at the time. With the end of the nuclear
    arms race came demilitarisation, and the states that had built up stockpiles of
    rare metals in'
