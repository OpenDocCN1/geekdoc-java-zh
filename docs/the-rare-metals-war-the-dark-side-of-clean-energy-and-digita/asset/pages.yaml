  md: 'Six thousand years ago, when humans began to melt copper, they were able to
    put aside their stone tools for sharper and more solid implements. At best, humans
    could perfect their hunting techniques with this breakthrough until 2,000 years
    later, when the Sumerians discovered bronze — a robust alloy of copper and tin.
    This time, empires and civilisations emboldened to turn out swords, knives, and
    axes, raise armies, and enter what would be the very first arms race in history.¹⁰


    Around the twelfth century BC, in the south of modern-day Turkey, the Hittites
    melted an even lighter and more available metal — iron to forge weapons that were
    more powerful and easier to wield. This, say some historians, led ultimately to
    the European conquest of the Americas.¹¹


    Then came steel, which used in 1914 turned Europe into an industrial war. The
    iron and carbon alloy used to make shell casings, the first modern fragmentation
    grenades, harder helmets for soldiers, and armoured tanks — all of which contributed
    to the bloodbath that was the First World War.


    Every time a people, civilisation, or state masters a new metal, it leads to exponential
    technique and military progress — and deadliest conflicts. Now it is rare metals,
    and in particular rare earths that are changing the face of modern warfare. China
    knows that the master of their production and application will undeniably have
    the upper hand strategically and militarily. Targeting Magnequench and acquiring
