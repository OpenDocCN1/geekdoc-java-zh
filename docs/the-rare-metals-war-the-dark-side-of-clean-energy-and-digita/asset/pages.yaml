  md: 'From tea to black oil, nutmeg to tulips, saltpeter to coal, commodities have
    been a backdrop to every major exploration, empire, and war, often altering the
    course of history.²21 Today, rare metals are changing the world. Not only are
    they polluting the environment, but they are jeopardising economic stability and
    global security. In the twenty-first century alone, their use has consolidated
    China’s supremacy and accelerated the weakening of the West that began at the
    turn of the millennium.


    But the rare metals war is far from lost. China has made some colossal errors;
    the West can respond; and the technical progress we have yet to make is bound
    to transform how we generate wealth and energy.


    Until then, this book recounts the dark side of the story of the world that awaits
    us. It is an undercover tale of a technological odyssey that has promised so much,
    and a look behind the scenes of our lavish and ambitious quest that involves risks
    as formidable as those it sets out to resolve.'
