- pgno: 93
  md: 'The term itself, “wet bulb,” sounds innocuous—a bit fuzzy, and even a little
    funny. It’s anything but that. When heat wave temperatures in urban cities in
    America hit wet-bulb conditions, hundreds of people in the past have died in the
    middle of such heat waves that short out the power grid and cause suffocating
    conditions for populations that can’t cope with them.


    A wet-bulb temperature is essentially the combination of heat and humidity. Together
    they can be lethal, even if the heat doesn''t seem quite extreme. A wet-bulb is
    measured with a thermometer wrapped in a wet cloth, distinguishing it from the
    commonly reported dry-bulb temperature, measured in open air. It is a measure
    of how our skin can be cooled by sweating, which is how humans stay alive in the
    worst heat. But high humidity can defeat cooling system; it makes the heat that
    much more dangerous.


    Such wet-bulb heat waves don’t only affect tropical, developing countries; they’re
    a threat throughout the world. The 1995 heat wave in the Midwest killed seven
    hundred. The 2003 heat wave in Western Europe killed forty-five thousand people.
    The 2010 heat wave in western Russia killed fifty-four thousand people.


    Such wet-bulb temperatures are rare, but they might not be much longer. We''re
    already starting to see the deadly combinations (like the 2010 heat wave in Russia)
    Scientists say that not only are we starting to see such dangerous wet-bulb conditions
    occur more regularly, they''re also getting worse. In fact,’re now four times
    as likely to see such wet-bulb conditions as we were before the planet started
    changing. The sobering truth is that we used to see perhaps one wet-bulb day a
    year in America. So, we’ll start seeing twenty or thirty of those kinds of days
    each year, and tens of millions of lives will be at risk.


    A human’s core temperature is around 98.6 degrees, but the skin temperature of
    the trunk is 4–9 degrees colder, depending on how warm it is and how active a
    person is. But sweating, which helps keep the core body temperature constant,
    becomes increasingly ineffective in increasingly humid air, and can never cool
    the skin to below the wet-bulb temperature.


    A person who is physically active at a wet-bulb temperature of 80 degrees will
    have trouble maintaining a constant core temperature and risks overheating. A
    sedentary person in the shade will run into the same problem at a wet-bulb temperature
    of 92 degrees. A wet-bulb temperature of 95'
