  md: 'Yemen is the first casualty of what will almost certainly be the “water wars”
    of the future. What has happened inside Yemen is a harbinger of what will happen
    elsewhere when water scarcity drives citizens to take desperate measures.


    Here’s the truth. Even though it is surrounded by oceans on two sides, Yemen is
    running out of fresh water. This simple fact is at the root of many of its problems.
    Without water, and then food, virtually every other aspect of a society becomes
    untenable. This is what has happened to Yemen. It is the first example of what
    a water war looks like.


    Outside political and civil society observers try to warn about the growing threat
    for years—all to no avail. The time anyone was paying attention, it was too late.


    “Yemen could become the first nation to run out of water,” The Times of London
    reported in the fall of 2009—two years before political chaos ripped the country
    apart in a brutal civil war. Not only is Yemen the poorest country in the Arab
    world, it is also the most water-scarce in the Arab world—a situation that has
    been made worse by routine, multiyear droughts inflicted on the region by the
    changing climate.


    Even before climate change began to make things worse, Yemen struggled with access
    to fresh water. Groundwater from rainfall is the main source of fresh water for
    the country. Water tables have dropped precipitously in recent years that most
    parts of the country now have no viable sources of water any longer. In Sana’a,
    the state capital, the water table has dropped from 30 meters below the surface
    in the 1970s to 1,200 meters below the surface by 2012. Since few can afford the
    cost of tap water pumped to their housing, residents get water from public urban
