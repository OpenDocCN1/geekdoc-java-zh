    # # The Third Pole


    The Silk Road, which winds its way from the Mediterranean to the eastern shores
    of China and the Korean Peninsula, was once the only real trade route linking
    East and West. It was the best-known route that led through the formidable Himalayan
    mountain ranges at China’s southern border.


    One reason that historians write about the Silk Road and trade route travelers
    like Marco Polo is that they represent a journey through one of the most forbidding
    environments on the planet. The Himalayas separated East from West for thousands
    of years. The Silk Road was one of the few points of contact between the two worlds.


    The largest mountain ranges in the world cover the southern parts of China. The
    Himalayas hold the world’s tallest peaks along the country’s western borders.
    A combination of towering mountains and treacherous deserts like the Gobi kept
    early China isolated from Western civilizations for a very long period of time.


    While nearly the Himalaya region has been explored or mapped, there’s still a
    great deal we simply don’t know about that part of the world. Routes in and out
    of the deep recesses of the Himalayas are still confined to single tracks in places,
    and very few researchers or scientists have the luxury and therewithal to study
    changes over time.'
