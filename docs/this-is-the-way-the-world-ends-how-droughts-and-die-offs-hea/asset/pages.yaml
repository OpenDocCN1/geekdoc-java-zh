  md: '# PART 2


    # The Ecosystems


    Large, unprecedented regime shifts in our atmosphere, in our oceans, and at the
    ends of the earth are only beginning.


    What happens when the Arctic breaks long-term weather patterns and is warmer than
    normal? When the Sahara Desert spreads further south each year, threatening to
    swallow all of North Africa whole? Or when a section of the Great Barrier Reef
    dies due to ocean system shifts? All three are harbingers of a much bigger, cataclysmic
    story of climate change on planet Earth.


    “The Ecosystems” explains how global warming has created regime shifts, irreversibly
    changing landscapes across the world as we know them.


    What happens in the Arctic disrupts nearly all weather patterns across the Northern
    Hemisphere, may permanently alter the jet stream, and will inevitably lead to
    geopolitical shifts globally, with so many economically interested parties converging
    in the Arctic.


    With tens of thousands of farms in the Sahel being swallowed by the Sahara Desert,
    what will happen to Africa’s arable land, food reserves, and workforce ten years
    from now? How will such changes affect the numbers of climate refugees globally?
    Drive military conflicts?'
