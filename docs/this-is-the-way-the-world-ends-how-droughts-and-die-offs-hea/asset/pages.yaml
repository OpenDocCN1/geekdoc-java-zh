  md: '# Introduction


    # Harbinger


    our world is in trouble.


    While it may not appear that way in America quite yet, the signs are emerging
    here and if we’re willing to look closely enough. Spring planting seasons start
    just a bit earlier and are slightly more chaotic. Extended droughts in Texas and
    parts of the Southwest sometimes force cattle farmers to move entire herds north
    for water. Tiny creatures like the American pika are running out of options in
    the West because they’ve already moved higher up on their mountains. Police cars
    in South Florida now have to be protected for the first time to keep salt water
    from rusting them them out.


    Each one is a small, barely change in an America with bigger problems at the moment.
    More immediate questions stare us in the face when we wake up day. Can I make
    the rent payment at the end of the month? What if my car breaks down, and I can’t
    get to work? What if I get really sick and can’t pay my health-care bills, or
    I can’t visit a free health clinic for advice and treatment because it’s now hundreds
    of miles away? Will I be able to save any money? Should I be worried about people
    who aren’t like me start taking jobs where I work or move into my neighborhood?
    Should I limit places I visit because I might be attacked? Are my kids getting
    the kind of education they need?'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'These are real, immediate concerns. They crowd in on our day, pressing on us
    from all sides. We don''t have time to wonder or even worry about Monarch butterflies
    that need to keep moving north because their habitats are being disrupted. We
    have no sympathy for wealthy patrons of exclusive ski resorts whose favorite mountaintop
    playgrounds threaten the edge of insolvency because snowpacks are no longer predictable
    during the winter.


    It isn''t our problem that serious water resource issues in California’s Central
    Valley now cause thousands of itinerant migrant workers to walk miles to get fresh
    water. That’s someone’s problem and doesn''t affect us. If almonds become too
    expensive because it takes so much water to grow, we can easily buy peanuts. If
    alfalfa, which also fights for increasingly scarce water resources in California’s
    Central Valley, doesn’t make sense as food for cows, they can’t find something
    else for the source of the McDonald’s hamburgers we buy at the end of the food
    chain?


    These small changes in the American landscape largely seem our time right now.
    No one can say with absolute certainty what’s causing them. Earth is made up of
    millions of local ecosystems, interconnected in ways that none of us can fathom.
    It doesn’t seem logical that massive amounts of industrial air pollution in a
    country like China halfway around the world would have any real connection to
    our daily lives in America. Why would it? The terrible smog that envelops Beijing
    or Shanghai more and is their problem—not ours. If China buys two-thirds of all
    the soybeans growing in the world now and may be forced to buy all of them within
    a decade, what’s to us?


    The fact that hundreds of millions of people are forced to burn wood or fossil
    fuels to heat their homes and cook their meals, and barely manage to live from
    one to the next is someone else’s problem. The growing haze from coal-fired plants
    near big cities in dozens of developing nations blackens the even sky during the
    day is unfortunate, but not something we have the bandwidth to care about. The
    fact that their lives are shadowed each day by a black sky through the haze of
    smog, soot, and smoke is something other people will deal. After all, we can see
    blue, sunny skies in America anytime we feel it. We’ve forgotten this blue sky
    was a freedom we fought for in America for decades. What seems to matter'
