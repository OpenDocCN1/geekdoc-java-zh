    book, especially, has countless sources of inspiration from the hundreds of scientists,
    leaders, and colleagues I''ve had the privilege to learn from over the years.
    The science—and the obvious conclusions from that research—infuses nearly every
    paragraph.


    But I would like to offer special thanks to my oldest son, Josh, for helping me
    understand the concept of humanity''s critical next gate and for reading behind
    me in the extraordinary journey of researching and writing each and every chapter
    in this book. Thank you to my hardworking agent, Victoria Skurnick, who believes.
    Thanks as well to the brilliant Tom Dunne and Stephen Power at St. Martin’s Press
    for their thoughtful, strategic guidance that made this book so much better. And,
