    Yet it exists nevertheless.


    Great economic transformations occur in every generation—some through speculation
    (the Great Depression), some through greed (the subprime housing market collapse),
    and some, as now, through necessity.


    This new transformation will be seen most clearly in two sectors that directly
    impact hundreds of millions of consumers: transportation and utilities. By 2030,
    that transformation will be well under way.


