    # The Sahel


    The plan was simple, as was the story. The Sahara Desert was spreading throughout
    the region of North Africa known as the Sahel, the arid savanna that runs along
    the southern border of the most famous desert on the planet. More than a dozen
    countries that touched the desert in one way or another were all faced with the
    same terrible problem. The desert threatened to cripple their way of life.


    Tens of thousands of farms were at risk of being swallowed by creeping desertification.
    The region strained under a crippling drought that had lasted far than anyone
    could remember. Spring was coming earlier, and rainfall was so uncertain that
    farmers simply did not know what to expect any longer when they planted their
    crops for the coming year.


    So analysts at the United Nations and governments throughout the region came up
    with a plan—just as Chinese leaders had thought to hold back the Gobi Desert and
    other desert regions. They would plant a Great Green Wall of trees that would
    extend across all of northern Africa—3360 miles long, 10 miles wide, right through
    the middle of a dozen countries from Senegal in the west to Djibouti in the east.


    “The desert is a spreading cancer,” said Abdoulaye Wade, who was Senegal’s president
    from 2000 until 2012 and was the most prolific promoter of the Great Green Wall
    inside the halls of the United Nations and'
