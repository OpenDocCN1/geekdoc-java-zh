    # Yemen


    Yemen is a small country immediately south of Saudi Arabia, known to Americans
    largely through an endless parade of stories about terrorism, civil war, political
    chaos, and pirates.


    It was one of the seven predominantly Muslim countries included in President Donald
    Trump’s travel ban (later reduced to six when Iraq was dropped from the list).
    People trying to enter the United States from Yemen were temporarily banned by
    the American president because Yemen is known as a bleeding ground for terrorists.


    Yemen has been overrun by a brutal civil war that has destabilized the central
    government. In recent years, analysts have begun to predict that it will likely
    become the next staging ground for pirates who venture into shipping lanes to
    seize ships and ransom wealthy passengers—a practice that continues despite routine
    monitoring by U.S. and European nations. Piracy is a global economy price tag
    of nearly $18 billion every year, with higher risk for cargo, skyrocketing insurance,
    and inflated costs for traders and consumers.


    Yemen’s traditional capital, Sana’a, has been controlled by rebels opposed to
    the existing government since the start of 2015. As a result, the ruling government
    has temporarily relocated the capital to the port city of Aden on its southern
    coastline.'
