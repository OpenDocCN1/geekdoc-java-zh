    Water in the desert of Saudi Arabia is life itself. Without it, nothing else works.
    No amount of oil wealth can manufacture crops to feed the people without water.


    The kingdom has always had a distinctly difficult problem. While the land holds
    some of the largest oil reserves in the world, it also holds one of the world’s
    smallest reserves of water. There is not single lake or river in Saudi Arabia.


    For thousands of years, the people of the kingdom have drawn water from wells
    or the occasional oasis. Inrequent rainfalls replenish shallow aquifers 150 foot
    or so underground. Wells dug ten times as deep as those shallow aquifers tap into
    water reserves that are not renewed by rainfall. Once water from these deeper
    reserves is used up, they’re essentially gone forever.


