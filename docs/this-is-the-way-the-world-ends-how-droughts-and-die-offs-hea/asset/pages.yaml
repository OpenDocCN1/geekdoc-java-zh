  md: 'The ingredients for massive tropical storms are well established: a preexisting
    weather disturbance (e.g., a common storm), warm water in tropical oceans, moisture,
    and light winds. These elements are then combined into a big event—a hurricane
    or a typhoon. If this happens in the Atlantic or Northeast Pacific Oceans, it''s
    called a *hurricane*. It''s called a typhoon in the Northwest Pacific. It''s a
    *cyclone* if it happens in the South Pacific or the Indian Ocean.


    Once a tropical cyclone reaches maximum winds of 74 miles an hour or higher, it''s
    classified as a hurricane, typhoon, or cyclone. At that point, the weather event
    is likely to include violent winds, incredible waves, torrential rains, and huge
    floods. Weather forecasters rate hurricanes based on the strength of the winds.
    A Category 1 hurricane has slower wind speed. A Category 5 hurricane, which is
    rare, has winds above 155 miles an hour.²


    There is no such as a Category 6 hurricane or tropical storm. The highest level—the
    top of the scale for the most powerful, devastating hurricane or tropical storm
    capable of destroying entire cities like New Orleans or New York—is a Category
    5 storm. Meteorologists and scientists never imagined there would be a need for
    a Category 6 storm, with winds that exceed two hundred miles per hour on a sustained
    basis, sweeping away everything in its path. Until now, such a storm wasn''t possible,
    so there was no need for a new category above Category 5.


    Right now, however, there is anywhere from 5 to 8 percent more water vapor circulating
    throughout the atmosphere than there was a generation ago. This, combined with
    warmer temperatures that are driving water out from the deep ocean in places where
    hurricanes typically form, has created the potential for superstorms that we haven''t
    seen before—and aren''t prepared for.


    This combination of warmer oceans and more water in the earth''s atmosphere—whipsawed
    by sustained periods of drier and wetter conditions in regions of the world that
    create superstorms—is now starting to create storms with conditions that look
    precisely what a Category 6 hurricane would look like. We might not *call* it
    a Category 6 hurricane for now, or know where to place it on the scale, but it
    doesn''t mean that such previously unthinkable superstorms aren''t about to start
    destroying parts of civilization in countries directly in their path.'
