- pgno: 260
  md: '# Our Next Gate


    There are big, scary stories in this book, but they are necessary stories. We
    need to understand that our world is in trouble—right now, at this moment in time,
    not in some blurry, fuzzy, distant future that no one cares about because we''ll
    all be gone by the time the worst, unimaginable horrors might occur. A world that
    we have conquered and altered is beginning to turn against us. As a result, we
    are in trouble.


    These stories are vital and important because they show us in no uncertain terms
    that we need to end a vague, misguided notion once and for all—that we are somehow
    supposed to save the planet. That isn''t the challenge before us, the gate through
    which we must pass.


    Water riots led to the collapse of Yemen''s government. Saudi Arabia has largely
    run out of water and is now using its oil wealth to feed its people. The monsoon
    may be on the cusp of instability, threatening a billion people in India who rely
    on it for their water. Pakistan is poised to go to war with India over access
    to fresh water. Every country in the Horn of Africa is facing water scarcity issues
    and the people there are facing starvation—just as climate models for the subtropics
    have long predicted.


    China now imports two-thirds of the world''s soybeans because it, too, is running
    out of water in the north as the Gobi Desert swallows the land. It may import
    all of the soybeans on Earth within a decade in order to feed its'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'people. The dozen countries along the southern border of the Sahara Desert
    in Africa now face a colossal failure of epic proportions because tens of millions
    of trees they propose to plant to hold back the desert are likely to die within
    months of being planted.


    North Korea is now wholly dependent on food imports for its survival. Half of
    the people in the world, in fact, now survive on imported food because there isn’t
    enough arable land on which grow crops to feed the people. The oceans are in far
    worse shape than most people believe. Half of all species are presently local
    extinctions.


    Even the United States isn’t immune to troubles right now. A Category 6 superstorm
    could do lasting harm to any coastal city in its path. The groundwater aquifer
    that runs below California’s Central Valley—which is responsible for more than
    a third of the world’s food supply—is facing many of the same pressures seen in
    the Arabian, Indus Basin, and MurzkDjajo Basin that might be largely depleted
    now. Extended droughts and extreme precipitation events in the subtropics have
    the same impact in the American Southwest as they do in the world. Sea level rise
    along all three coastlines in America may not threaten lives immediately, but
    they have already rendered many parts of those coasts insururable.


    The reasons for the troubles in so many regions of the world are complex, interrelated,
    and in nearly all cases, wholly of our own making. Some are tied to overpopulation
    or land use. Others are examples of human cruelty, stupidity, and warmingor. All
    are overshadowed by a black sky of our own making, portending a steadily darker
    future if we don’t soon recognize the harbingers are telling us about Earth’s
    changing system.


    But, as we’ve seen, there are critical, manageable, important steps we can take
    right now that will give us the best chance to adapt to the changes we’re seeing
    ... and mitigate damage and suffering for both human beings and other species
    that share the planet with us.


    It starts with common sense.


    How is it possible, for instance, that we still don’t truly know how much water
    remains in the thirty-seven largest aquifers around the world? Engineers have
    spent decades determining how much oil is still left underground in places like
    Saudi Arabia, Iran, Iraq, and Russia. The wealth of major oil and gas multinational
    corporations like ExxonMobil, Shell,'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'Chevron, BP, and others is built on quantifying and valuing these proven reserves
    of oil. But somehow, we have no real idea how much water is in the aquifers that
    literally keep us alive?


    The groundwater contained in these aquifers is our second-most important source
    of fresh water on the planet. They contain roughly a third of the fresh water
    we need to live. The rest is found at the surface in streams, lakes, rivers, and
    wetlands or locked away in glaciers and ice caps¹


    Very recent studies by NASA scientists show that about a third of Earth’s largest
    groundwater basins, especially those that provide fresh water to vast numbers
    of people in parts of the world, are being rapidly depleted. What this means is
    simple: We’re using up our water, without knowing when it might run out.


    We need to remedy this, right now. If governments won’t take on this critical
    work, either philanthropies or corporations must. However it’s accomplished, the
    issue must be addressed swiftly. We need to know how much water we have. We can''t
    simply guess. Current estimates of some of the most critical aquifers are ridiculously
    and hopelessly useless. The overstressed Northwest Sahara Aquifer System, for
    example, what little work has been done to assess when it might run out of water
    ranges from twenty-one thousand years ... to ten.


    Jay Famiglietti, NASA’s leading expert on water resources, is right. “Available
    physical and chemical measurements are simply insufficient,” he says. “Given how
    quickly we are consuming the world’s groundwater reserves, we need a coordinated
    global effort to determine how much is left.”²


    As for the fresh water contained in the glaciers that serve as major sources of
    rivers cascading down the mountains in South Asia, it’s long past that scientists
    from China and the West begin to talk about what is truly happening to hundreds
    of glaciers in the Third Pole. Here too, we should not have to guess. We need
    to know what’s happening, or else we would see precipitous action to dam up major
    sources of water in rivers fed by those glaciers that are based on incomplete
    or even inaccurate information. Pakistan, especially, would benefit from exact
    knowledge—before India or China make political decisions that would almost certainly
    create armed conflict.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'Every academic researcher who has set out to study glacier melting in the Himalayas
    has run into the same brick wall, over and over. The data about the extent of
    glacier melting in the Himalayas and the Third Pole is inconsistent or nonexistent.
    It''s a patchwork of local knowledge, specific observation when a research team
    makes the trek to a region, or publicly available satellite data from NASA or
    the European Space Agency.


    Our collective knowledge about how the thousands of small and large glaciers in
    the region are changing is riddled with gaps. Public satellite images can only
    provide so much information. They show changes in given glacier''s surface area—but
    not the glacier''s height and mass, which is matters. Just as knowledge of the
    volume of sea ice in the Arctic is what truly matters—and not how much thin ice
    might or not be covering the sea—the same is true of the glaciers across the Himalayas
    and the Third Pole region. We need to know how much is left—and up-to-date classified
    satellite data is more fully capable of providing that information.


    While we''re at, we need answers to nearly the exact same question in the Arctic.
    We don''t need to know about ice cover. We need to know how much actual ice is
    there. We don''t know that at present, which is hard to imagine, given the strategic
    importance of the region to Russia, Canada, and the United States.


    The CIA and NSA could largely solve the glacier knowledge gap. Creative glacier
    researchers have been able to use declassified satellite images over a forty-year
    time period in order to manually compare them to field data. The ability to compare
    sparse field data to declassified satellite pictures has helped. It provides the
    first consistent look, over time, of how the glaciers across the Himalayas are
    changing—and what this means for tens of millions of people who rely on the glaciers''
    fresh water as they melt in the spring each year. But the intelligence community
    has vast resources at its disposal ... many more than it publicly available to
    scientists. Presently they''re only used in the service of war and armed conflict.
    What would matter great deal is if could see what the generals see.


    Sadly, as we''ve discovered, the CIA shut down its climate center under withering
    pressure from Republican leaders in Congress. The Pentagon is likewise being asked
    to stop monitoring distant threats from conflicts over'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'natural resources—precisely as those conflicts are beginning to boil over in
    countries like Yemen, Syria, Sudan, and elsewhere. But the intelligence community
    can make its surveillance available to scientists, who know what to do with such
    data, if asked.


    Right now, scientists are forced to put stakes in at specific locations to measure
    height and mass of glaciers year in year out. But there are obviously many, many
    glaciers in remote parts of the world where that sort of direct observation isn''t
    possible. They have no field data in lots and places of places, which means we
    are flying blind, too—just as we are in our knowledge of aquifers. The intelligence
    community can solve this problem, provided there is the political will to do so.³


    Why has the United Nations failed to recognize the clear and present dangers now
    facing environmental refugees before carefully warned and creative definitions
    that clearly have no impact whatsoever in places like the high court of New Zealand?
    It''s incomprehensible that the UN failed to formally recognize the status of
    environmental refugees. Bureaucratic mumblings and flowery words have no legal
    or official status.


    Efforts to expand the legal definition of refugees within its 1951 Convention
    Relating to the Status of Refugees have gone nowhere. The UN''s outdated and archaic
    convention on refugees recognizes economic migrants fleeing poverty and environmental
    refugees caught in a death grip between both. It''s beyond insane that the UN''s
    leadership hasn''t solved this. It needs to do so, now⁴


    During the marathon talks that culminated in the Paris Climate Accord—the first
    time in twenty-five years of failure that countries were able to finally cross
    the finish line on an international climate agreement—the United Nations put its
    Great Green Wall initiative in the Sahel and center before five thousand journalists
    covering the tasks.


    The initiative, first proposed by the African Union in 2007, was one of the great
    success stories out of the Paris Climate Accord. The World Bank committed to funding
    it. So did France. More than twenty countries in Africa have signed up. At least
    $4 billion pledged to build a ten-mile-wide swath of trees more than three thousand
    miles along a dozen countries along the southern frontier of the Sahara Desert.
    It was designed to be the largest living structure on the planet.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'The Sahel initiative has already claimed success: 15 percent of the trees it’s
    proposed have been planted, largely in Senegal. It claims that four million hectares
    of land have been restored. But, as we’ve seen, it might very well be the wrong
    solution for a very real problem. A first effort to plant fifty million trees
    in Niger failed. Most of the trees died within months. When local farmers in Niger,
    Burkina Faso, and Mali went back to their local, indigenous roots—by planting
    trees within crops and learning how to hold water at the base of these trees to
    conserve water—did the trees serve as a hedge against the advancing desert.


    The question now is whether all the vested partners—from the UN and the World
    Bank to the African Union—can change course. The solution, as we saw in Niger
    and Burkina Faso—can a return to indigenous land management at the local level,
    not a great plan to plant hundreds of millions of trees at the southern edge of
    the Sahara. One plan will succeed. The other will fail. Can the UN and its financial
    and country allies recognize the path that local farmers and communities have
    so clearly charted for them? We’ll know soon enough⁵


    Local land management solutions are very clearly at the heart of India’s salvation
    as well. Anupam Mishra’s life’s work, as discussed earlier, was devoted to just
    such an approach. Mishra, who died in December 2016, had a vision to preserve
    precious water in India that is directly counter to the mega-water projects that
    India is fond of. But Mishra’s approach is the right one. His 2009 TED talk has
    been viewed nearly a million times.⁵ It needs to be viewed one hundred million
    times.


    The Indian people performed feats of near-magic engineering in the deserts centuries
    in order to harvest and store water, Mishra says. They built ancient aqueducts
    and stepwells, which work as well today as they did hundreds of years ago.


    “Welcome to the Golden Desert,” Mishra says at the start of the TED talk. “Clouds
    seldom visit this area. But we find forty different names of clouds in this dialect
    used here. There are a number of techniques to harvest rain [but] for the desert
    society this is no program; this is their life. And they harvest rain in many
    ways.”


    Mishra spent his life studying local people and communities behind indigenous,
    time-honored, and successful rainwater harvesting techniques.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'What he discovered is that people learned how to develop wells, filter ponds,
    and catchment systems in the harshest landscapes on Earth. We once learned how
    to find water for drinking and irrigation in these extremely arid places. We desperately
    need knowledge now as India and nearly every country in the subtropics begin to
    face water scarcity challenges that threaten to tear apart the fabric of life
    as we know.


    “He saw the callous treatment of water all around him, the pollution of rivers
    by careless city dwellers and the reckless depletion of groundwater aquifers by
    farmers with electric-powered tubewell,” fellow environmentalist Ramachandra Gandhi
    of Mishra after his death. “So, he began documenting the indigenous systems of
    water harvesting that were rooted in community control and based on a careful
    understanding of the local landscape.”


    Mishra’s life’s work shows us how to build a bridge between modern water management
    technology and proven, timewom methods of harvesting water that is India’s legacy
    and heritage. He was right, when many others are wrong. We must learn from that.
    Our work, in fact, depend on it now that water scarcity is here to stay in so
    much of our world.


    There are other meaningful, important steps governments, philanthropies, businesses,
    educators, and consumers can take. We need dozens of water and infrastructure
    engineers in Jordan, for instance. We need to bring emerging, breakthrough water
    desalination technologies to market as quickly and as cost-effectively as possible.
    Local knowledge about time-honored indigenous farming techniques needs to spread
    rapidly to countries like Somalia and other countries in Africa on the edge of
    ecological collapse.


    It’s quite difficult—perhaps impossible—to hear stories about the death of great
    heritage sites like the Great Barrier Reef; the near extinction of iconic species
    like elephants, giraffes, or mountain apes; or the collapse of pollinators like
    the rosy-patched bumblebee in North America and not grow terribly despond. We
    are witnessing great tragedies and mass extinction events. In some instances,
    we may be too late. All that remains to chronicle the end.


    But in many instances, there is still much that we can do. Now that truly know
    what is happening to our great coral reefs, we can take action. While the biggest
    changes that we know are necessary—the ones to the sky'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'above us that are warming our oceans—will require a collective force of will
    that the world’s leaders have yet to display, we’ve seen that there are other
    smaller actions we can take.


    As one example, we now know that coral fish avoid places where others have left,
    and overeat the algae in places where everyone has congregated. With that knowledge,
    we can likely intervene and bring balance back to ecosystems in some coral reefs.⁸


    Now that we know the existential threats facing our iconic species, we can preserve
    them. We shouldn''t wait until are a few hundred African elephants remaining before
    moving them to protected spaces. We can assure their ability to continue to the
    plains of Africa. That means we must recognize the threat that climate changes
    pose to their habitats, along with threats from poaching, hunting, and development.


    Now that hundreds of scientists have sounded the alarm about the collapse of pollinators,
    some obvious course corrections have become clear. Pollinators clearly fail in
    monoculture environments. We need to stop requiring them to do their necessary
    work in massive, single-crop agribusiness environments and provide them with the
    sorts of diverse environments where they clearly were meant to thrive.


    It is also natural, and expected, to be terrified and depressed at the prospect
    of Category 6 superstorms capable of destroying entire coastal cities in the United
    States and around the world; over the very real threat that countries like North
    Korea or Pakistan might strike militarily against neighbors if water scarcity
    or food insecurity forces their hand; or the reality that tens of millions of
    people might die of starvation in countries throughout the subtropics as extreme
    droughts cause a scale we haven''t seen since the creation of the United Nations
    after the Second World War.


    But, even here, there are actions we can take.


    Cities like Tampa Bay or Dubai can plan against such grey swan events. Doing so,
    right now, will mitigate the damage if (or when) such events occur.


    Now that we know North Korea has no hope of growing food to feed its people because
    only 20 percent of its land is now arable, China and the United States must embrace
    environmental diplomacy. It might succeed here where everything else has failed
    since the Korean War.'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'Now that we truly know the scope of the humanitarian crisis facing Somalia,
    Sudan, Yemen, and every other nation in and around the Horn of Africa, it is impossible
    to look away. It''s not good enough to throw up our hands and bemoan the fact
    that warlords and dictators use food aid as a weapon against their own people.
    This is an engineering problem that we can fix. We need to fix it.


    Finally, we now know precisely how issues like water scarcity, food insecurity,
    extreme drought, and other natural resource constraints are intricately connected
    to civil unrest that inevitably leads to armed conflict, war, terrorism, and other
    military actions. Yemen, Syria, Egypt, Somalia, and Sudan are all clear examples.
    Political leaders need to stop ignoring the obvious, recognize the causes in the
    first place. If we do, we may not need annual military budgets of $600 billion.


    Throughout the course of our story—the human story—there have been gates we needed
    to pass through in order to keep moving forward. Our forebears migrated out of
    Africa as the ice eased their grip on continents. We learned to farm so we no
    longer needed to hunt for our food. We created civilizations built around great
    learning. We chose to stop worshipping godlike emperors and kings, assuring ourselves
    that governments served the people. Science ended great myths, enlightening us
    all. We learned how to build great machines and artifacts that now control every
    aspect of our environment.


    We, humans, have conquered the earth. We are now our masters. We control every
    aspect of the planet. There are virtually no places we have not seen or explored.
    We have been to the bottom of the deepest ocean; to the farthest reaches of the
    north and south; to the highest mountains; to the center of the blinding deserts
    and eyes of fierce hurricanes. We have tamed, and killed, every wild beast that
    roared our darkest nightmares. We have endured not one but two world wars that
    could have closed yet another gate, but we survived. the human species, made our
    way each and every challenge, through each and every gate.


    We are now standing before another gate, the most difficult one yet in the story
    of the human species. We have conquered the world. We control every aspect of
    it. But, in doing so, we have also nearly exhausted its natural resources. We
    are running out of water and places to grow food for'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'all of us. We have altered our environment in profound ways that we are only
    beginning to understand. We have darkened the sky above us and changed the oceans
    between us. And this world, our home, is beginning to turn on us, its master.


    This is the gate we must pass through if we are to move forward yet again. We
    must learn how to live together in the place that we have conquered. If we do
    not, those things that have defined the human species will begin to end. There
    are no real physical frontiers left on our planet. We have discovered them all
    and made those places our own.


    The gate that we face at present is not a question of surviving or conquering
    the planet. We have done all that and more. Now, today, we do not need to save
    the planet. We have conquered Earth. It is ours. The question before us, the gate
    we must pass through, is whether we can save ourselves as a vanished Earth begins
    to turn against us.


    In the end, the planet will be fine. We might not be.'
