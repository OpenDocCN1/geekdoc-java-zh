    # Dome of Heat


    In the summer of 2015, at the northern edge of the Persian Gulf in Iran, the city
    of Bandar Mahshahr set an unofficial national record. The Iranian city hit a heat
    index of 165 degrees Fahrenheit. It became the second-highest heat index in history.
    Dhahran, Saudi Arabia, had reached a extreme heat index of 178 degrees a few years
    earlier.


    The Bandar Mahshahr extreme heat index came in the middle of a punishing heat
    wave that waxed and waned throughout the summer in the Middle East. Other countries
    nearby saw similar heat index temperatures.¹


    Trying to function in that sort of temperature is like being forced to live and
    work inside a sauna’s cranked up with the doors sealed. If temperatures at that
    level last for days, humans can’t survive. It’s a killing heat wave.


    There are no official records for heat index temperatures, which combine heat
    and humidity. A heat index is actually a more relevant public health measure of
    temperature because it takes our ability to cool off in extreme heat into account.
    A “wet-bulb” temperature (as opposed to a “dry-bulb” temperature) takes other
    factors beyond just heat into account. Humidity is the most important factor.'
