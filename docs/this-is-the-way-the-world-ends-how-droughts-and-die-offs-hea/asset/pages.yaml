    of Bangladesh’s territory is likely to go under if sea levels rise by one meter.
    There is concern over the fate of Bangladesh’s population. India surrounds the
    country on three sides and the fence is boxing its people in. Some of the most
    vulnerable coastal districts in Bangladesh are Khulna, Satkhira, and Bagerhat,
    which lie along India’s border. Where will the people go when their homes and
    crops grow under water?”


    India’s decision to close off its border completely to Bangladesh—whether feasible
    or not—is a perfect reflection of decisions being made now by world leaders in
    the face of growing nationalist calls from voters to seal off their borders as
    civil wars and environmental calamities drive a flood of refugees to seek new
    homes.


    In 1989, after the fall of the Berlin Wall, there were only 15 border walls around
    the world. Today, there are 70 of them,” reported in 2017. More barriers between
    countries now exist than at any other time in modern history.


    There are now quite distinct worlds confronting us—both of which revolve around
    two very different sets of political morality plays. One is'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'inherently selfish and nationalistic; it leads to walls and moats to keep others
    out. The other recognizes that populations and ecosystems are interconnected in
    ways that don’t recognize borders. Political leaders (like India’s home minister
    or U.S. president Trump) can close borders to keep Bangladeshis or Mexicans out.
    Or leaders (like German chancellor Angela Merkel or French president Emmanuel
    Macron) can welcome global pacts as the Paris Climate Accord that recognize a
    common threat to the human species requiring unprecedented cooperation.


    India is clearly struggling with both of these political morality plays. Even
    as its promise to close its border with Bangladesh completely to keep refugees
    from flooding in at some point in the future, other parts of its government have
    tried to foster exactly the opposite image. India has reached out to neighboring
    countries, including Bangladesh, with grand plans for seamless travel between
    the countries in order to boost tourism and trade. They have even proposed transnational
    roads and rails between the two countries—at the time they plan to seal the border
    entirely.


    At some point, India will need to make a decision about which future it plans
    to embrace: an inward-facing nationalism that closes borders, or a globalist frame
    that embraces international trade and commerce right alongside deeply challenging
    (and global) environmental and national security threats.


    Security experts like Dr. Ramakrishnan believe there is only one real choice for
    political leaders in India and elsewhere who are, only now, waking up to the real
    challenges we are all beginning to face across the planet.


    “India cannot afford to turn a blind eye to the problem,” she says.


    Not only would that approach be inhumane but also, the impact of rising sea level
    on India could be as devastating as it is predicted to be on Bangladesh. Indeed,
    some studies have listed India along with Bangladesh among the countries ‘extreme
    risk’ from climate change.


    Rather than distance itself from Bangladesh on the climate change issue, India
    should cooperate with it. Taking down the fence is an important first step that
    Delhi must take. But dismantling walls is'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'more difficult than building them. It requires political will and a change
    in mindsets. Most of all, it requires recognizing that the India-Bangladesh fence
    has brought little security to the people of these countries. Rather is it a source
    of insecurity?


    India’s choice in the near future—like so many others—raises a deeply troubling
    question. Are we approaching the end of morals for nation-states as they choose
    to protect their citizens from the ravages of environmental collapse at the expense
    of their neighbors? Leaders will face extremely difficult decisions. Do they close
    borders and let neighbors starve or foment revolution? As food insecurity takes
    deeper root, will only those who can afford to pay for their food eat survive?
    Is fresh water a right that citizens will demand of their leaders, and will countries
    like China or India make decisions to protect that right at the expense of neighboring
    countries?


    Global multinational corporations already confront precisely these sorts of questions
    routinely now. As we saw with Nestlé, they are preparing for environmental unrest
    in nearly every country on Earth as water scarcity and fights over natural resources
    become more omnipresent and public. When multinational business interests collide
    with the interests of nations, who wins the fight?


    I sat privately with a billionaire at the Four Seasons restaurant in New York
    as he reg me with stories of wheeling and dealing over water rights in China and
    elsewhere. But would a global business profit off water scarcity? Or do the sovereign
    rights of a nation supersede the rights of that company to profit from scarcity?


    There are wars and rumors of wars in nearly every corner of the earth now. More
    and more of them match environmental and economic insecurities in some fashion.
    It isn’t a stretch to see India at war with Pakistan over water rights in the
    not-so-distant future. Yemen, Sudan, and Somalia are examples of what happens
    to a country when either the water runs out or it becomes impossible to grow enough
    to feed people.


    If Beijing really does see water shortages, China may not confine its actions
    inside its borders. It could very well decide that it has the moral right—a sovereign
    imperative—to do whatever it must secure the stuff of life for its own people
    at the expense of its neighbors.'
