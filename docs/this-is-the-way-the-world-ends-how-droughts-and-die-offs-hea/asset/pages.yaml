  md: '# The Anvil


    America was forged on the anvil of two fiery processes—scientific peer review
    and the free market. When both inevitably lead to a single opportunity, American
    leaders have never failed to grab the hammer and create something that can remake
    the planet.


    Until now.


    Democratic leaders like, and implicitly trust, the scientific peer-review process.
    When something of value emerges from that fire—and, make no mistake, all can witness
    the flames from afar—they believe and step up to the anvil.


    Republican leaders innately, deeply believe that the free market is the best and
    proper place to severely test raw elements—often in full, blinding, public display—of
    potentially game-changing, market-leading products that can drive innovation and
    economic development. When something is forged in this fiery process, they, do,
    take their place at the anvil.


    For Democrats, the scientific peer-review process isn''t merely the gold standard—it''s
    the actual process that produces the gold. So, naturally, when gold emerges, they
