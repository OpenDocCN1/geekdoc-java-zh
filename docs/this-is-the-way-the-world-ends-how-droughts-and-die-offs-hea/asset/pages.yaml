    FDR and his advisors never truly acted on this of the letters Einstein sent


    While much has been made of the Einstein letter and the famous physicist’s later
    regret at starting the process that led to the creation of the atomic bomb, the
    truth is that physicists in Germany, Britain, and the United States were all competing
    with each other and publishing in the scientific literature. It was only a matter
    of time before someone solved the nuclear fusion equation.


    The great irony—and an important point—is that Einstein’s three letters show that
    politicians and leaders generally ignore scientists and research until something
    else compels them to act. In this case, FDR and the White House staff didn’t jump
    into full-scale development and the Manhattan Project until it became apparent
    that Churchill and Britain were already committed. The science, in and of itself,
    was not sufficient enough to force FDR’s hand. Other events did so.


    In an even further irony, Einstein was never allowed to work on the Manhattan
    Project. The army denied him the clearance he needed to collaborate with some
    of his colleagues on the highly classified project. His pacifist leanings made
    him a security risk, the army concluded.⁷ Einstein actually wrote a fourth letter
    to warn FDR of the risks of using atomic'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'weapons without adequate oversight, but it didn''t reach FDR in time. President
    Roosevelt died before Einstein''s fourth letter could reach him.


    That''s the sad, true, story of the famous Einstein letter. Scientists are routinely
    ignored by political and business leaders in the United States and around the
    world—no matter how right and proficient they may be about any given subject.


    Collectively, right now, thousands of modern-day Einsteins are yelling loudly
    as much possibly can that we''re on our planet from Earth’s changing climate.
    The signs of that trouble range from massive species extinction and ocean system
    collapses to water scarcity and food insecurity that now threaten the lives of
    tens of millions of people in distant lands. But, like Einstein, they''ve become
    inmates to our collective political psyche. We''d like them to go away. Unlike
    FDR, we can''t throw a measely $6,000 at Enrico Fermi and tell him to prove the
    theory of catastrophic impacts on our planet before we decide whether to take
    the threats seriously or not.


    It''s an old story to the global media. It''s a tired, worn-out story for the
    public. It''s a deeply divided subject for politicians. It''s a largely irrelevant
    story for business leaders—at least, for now—who have to deal with quarterly earnings
    reports for their shareholders. And it''s a maddening story for scientists. Somehow,
    in some yet undiscovered fashion, we need to find our way out of this box canyon
    before it''s too late.


    There have been thousands upon thousands of peer-reviewed research papers written
    about the indisputable science of climate change. The evidence is overwhelming
    and irrefutable. Levels of greenhouse gases in the atmosphere are rising. Temperatures
    are going up. Springs are arriving earlier. Ice sheets are melting. Sea levels
    are rising. The patterns of rainfall and drought are changing. Heat waves are
    getting worse, as is extreme precipitation. The oceans are acidifying. On every
    continent and in every ocean, animals and plants are moving towards the poles.


    The science linking human activities to climate change is almost directly analogous
    to the science linking smoking to lung and cardiovascular diseases. For a long
    time, the tobacco industry paid scientists to question the science. It took years
    for scientists, journalists, and public health officials to successfully counter
    tobacco industry claims that smoking was not necessarily responsible for lung
    cancer. Eventually,'
  merge: -1
  img_proc: true
