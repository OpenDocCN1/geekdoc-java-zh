    # # Ocean Colonies


    The Great Barrier Reef is the largest living structure on Earth. It''s so massive
    satellites and astronauts can observe it quite easily from space. The immense
    coral reef system is more than 1,400 miles long and runs along the northeastern
    coast of Australia.¹ It is one of the world''s natural wonders.


    It''s also dying, before our eyes.


    A peer-reviewed study in Nature magazine in early March 2017 surprised even the
    most cynical and j marine researchers who have been warning us for almost twenty
    years that ocean reefs were in serious trouble over the world.²


    The study, which was based on aerial views of the entire reef and then compared
    to historical records of earlier bleaching events in 1998 and 2002, found that
    much of the Great Barrier Reef in its northern section was now dead. Only a cyclone
    that cleared the waters at the southern end of the reef likely saved half of it.


    The collapse and death of the Great Barrier Reef will have an enormous impact
    on the Australian economy. Tourism on the Great Barrier Reef employs seventy thousand
    people and generates $5 billion in income each year.³'
