    to fresh water. All two of the country’s aquifers run dry, prompting conflict
    to protect the sources of water until there is.


    Farther north in Africa, across the Sahel region that is seeing its desert expand,
    farmers are abandoning their land in the face of questionable growing seasons
    and sources of water and becoming part of the flood of refugees fleeing from conflict,
    violence, and economic uncertainty. These refugees don''t distinguish between
    their existential problems. They simply know they can die of environmental devastation,
    starvation, military conflicts, or economic collapse. They''re all part of one
    very large, threatening landscape forcing them from their homes into refugee camps
    or with no jobs.


    A billion people in India and elsewhere who still don''t have access to basic
    things like electricity are beginning to wonder if the monsoon season that provides
