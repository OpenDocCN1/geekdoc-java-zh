- pgno: 259
  md: 'If the monsoon does, in fact, become unstable and fresh water becomes much
    more difficult to come by, every country in Asia will face difficult and nearly
    impossible decisions that will severely test political leaders and strain relations
    among neighbors.


    If the Horn of Africa nations continue to fall further and further into despair
    over sustained drought, it isn''t conceivable that those countries will simply
    give up and sink into permanent, civil strife that simply can''t be managed by
    political or diplomatic solutions.


    Even the United States—the wealthiest nation in the history of the world—may decide
    that closing borders to both people and trade is the only path for itself. I believe
    quite strongly that this political path is inherently the wrong, immoral choice,
    but I also recognize that it is a political choice in the face of looming threats
    that seem both scary and potentially impossible to deal with.


    As environmental impacts and natural resource constraints begin to create seemingly
    impossible choices, nation-states and their political leaders will be tested in
    ways that they haven''t been before in the course of human history.


    But none of those tests are self-contained inside their own borders. The threats
    they face are global in nature. The solutions to those threats are interconnected
    and global as well. Hurricanes, droughts, water scarcity, and food insecurity
    don''t recognize borders. Whether political leaders recognize this—and choose
    to find meaningful ways to cooperate and forge a path out of the box canyon we
    find ourselves in—is another matter.'
