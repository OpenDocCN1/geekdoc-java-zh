  md: '# 1


    # # Einstein’s Warning


    Most people have heard some version of the “Einstein letter” story—about the famous
    theoretical physicist Albert Einstein warning FDR that the Nazis were about to
    develop a nuclear bomb, which so alarmed the president that he immediately started
    the Manhattan Project. From there, scientists created the atomic bombs that America
    dropped on two of Japan’s largest cities in order to end the war. That’s the story
    people have heard, in some fashion. It''s mostly wrong.


    It’s true that Einstein was convinced by his peers, such as Hungarian-born physicist
    Leo Szilard, that very smart physicists in Nazi Germany were close to the theoretical
    ability to split the atom and harness its energy. Einstein and Szilard desperately
    wanted to get President Roosevelt’s attention—to warn him of what might happen
    in the not-too-distant future should Nazi scientists succeed in that effort and
    create a weapon based on what was (at the time) a possible future built from math
    equations and theoretical physics.


    The myth is that Einstein wrote his letter to President Roosevelt, warning him
    of the grave risk; that it was given to FDR soon after he’d written it; and that
    Roosevelt and his political and military advisors were so alarmed by it that they
    immediately charged the nation’s top scientists with developing an atomic weapon
    in a race to beat the Nazis. The Einstein letter'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'triggered high-level action from the White House, swiftly leading to the Manhattan
    Project and the birth of the atomic age, the story goes.


    The truth is that Einstein actually wrote three such letters in 1939 and 1940—each
    more insistent than the previous one—laying out the potential risks should Nazi
    scientists succeed in acquiring an atomic weapon before the United States did.
    What he and Szilard described was theoretical research from German and American
    physicists published in several prominent journals in early 1939 that explained
    the potential for nuclear fission and how to exploit it to create nuclear power.
    Szilard concluded from the research that a nuclear weapon was possible, and he
    convinced Einstein.


    But Einstein was mostly an irritant to FDR and his senior White House staff with
    his warnings. FDR had a real war to consider—not some theoretical future threat.
    FDR''s political advisors did not believe the Nazis were close to splitting the
    atom and harnessing its power, and his military advisors similarly dismissed any
    potential.


    What''s more, his first letter—the one known as the famous "Einstein letter”—was
    delayed for nearly three months for political and military reasons. It was drafted
    by Szilard and Einstein in late July 1939 and then dated August 2. Their plan
    was to give it to FDR through an intermediary they believed had FDR''s ear. Germany
    invaded Poland before the letter could be delivered. It wasn''t actually delivered
    to FDR by that intermediary, Alexander Sachs, until mid-October of that year.


    “In the course of the last four months it has been probable—through the work of
    Joliot in France as well as Fermi and Szilard in America—that it was possible
    to set up a nuclear reaction in a large mass of uranium, by vast amounts of power
    and large quantities of new radium-like elements would be generated. Now it appears
    almost certain that this could be achieved in the immediate future,” Einstein
    wrote.


    “This new phenomenon would also lead to the construction of bombs, and it is conceivable—much
    less certain—that extremely powerful bombs of this type may be constructed,” he
    added. "A single bomb of this type, carried by boat and exploded in a port, might
    very well destroy the whole port together with some of the surrounding territory.
    However, such bombs might very well prove too heavy for transportation by air.”'
  merge: -1
  img_proc: true
