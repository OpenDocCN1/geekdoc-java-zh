    Scientists have been optimistic that the worst impacts might not occur until the
    end of the twenty-first century. That isn’t the case any longer.


    "Since the 1980s, rising sea surface temperatures ... have triggered unprecedented
    mass bleaching of corals, including three pan-tropical events in 1998, 2010 and
    2015," the *Nature* researchers stated.⁴


    It was the third global-scale mass bleaching event since marine scientists began
    studying the phenomenon in the 1980s. Sea surface temperatures were responsible
    for all three global-scale events, they concluded after comparing “distinctive
    geographic footprints of recurrent bleaching” on the Great Barrier Reef.


    Only “immediate global action to curb future warming (can) secure a future for
    coral reefs,” the researchers concluded in the *Nature* study.


    The lead researcher on the study, Terry Hughes from James Cook University in Australia,
    told *The New York Times* that his graduate students cried as he saw maps of the
    damage that warming ocean waters had done to the coral reef.⁵


    Coral reefs—vast and complicated living structures that are the hub of an enormous
    web of ocean life—can turn white from bleaching if the water is too warm in the
    ocean. This bleaching, in turn, can cause portions of a reef to die-off for good.


    That’s what is happening to the Great Barrier Reef and to other coral reef systems
    all over the world in the face of unremitting carbon emissions that are causing
    the planet to warm.


    "Corals are unable to cope with today’s prolonged peaks in temperatures—they simply
    haven’t been able to adapt to the higher base temperatures of the ocean,” the
