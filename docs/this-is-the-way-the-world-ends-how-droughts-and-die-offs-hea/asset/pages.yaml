  md: '# PART 1


    # The Truth


    These harbingers reveal what''s happening in our world right now—not in some remote,
    distant future.


    Irrefutable evidence that we''re in trouble from Earth’s changing climate surrounds
    us all. As the burning of fossil fuels accelerates the greenhouse effect—trapping
    heat on our planet at an ever-increasing rate—we are rapidly reaching a point
    of no return, scientists warn.


    The Truth” explores the dramatic changes to the earth’s ecosystem through rising
    greenhouse gas levels and what the ominous rise means to life as we know it. The
    effects include more frequent, longer-lasting heat waves; rapidly melting glacial
    ice and resulting rising sea levels; precipitation changes that cause devastating
    floods and prolonged droughts; the growing extinction and migration of local species
    that can’t adapt to the resulting environmental changes; and the acidification
    of oceans. Such changes already threaten the livelihood and lives of tens of millions
    in distant lands and are insidiously creeping into our own backyard.


    With a shrinking Third Pole and a sixth mass extinction under way, the planet
    is already changing dramatically right now. What happens when we reach the critical
    CO₂ threshold of 450 parts per million (ppm)—which we'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'could hit in just fifteen years or so if we remain on “business as usual” paths?
    And is there a way to rewind the clock?


    In the face of such overwhelming questions, one point is clear: By any estimation,
    CO₂ levels at 400 parts per million are infinitely safer than 450 parts per million.
    Acknowledging the dangers, understanding the stories of what’s happening right
    now, and deciding to take those threats seriously are the first steps in strategizing
    workable solutions.'
