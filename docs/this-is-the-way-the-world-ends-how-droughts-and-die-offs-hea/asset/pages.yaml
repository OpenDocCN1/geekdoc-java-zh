  md: 'What''s the first step in this emerging blueprint? It''s an easy one, but also
    one that has become increasingly difficult in the public sphere in America. We
    need to change the nature of the conversation in important and meaningful ways
    around our energy sources and their impact on Earth’s climate. They aren’t two
    separate conversations, which has been the case for at least two decades now.
    Republicans are comfortable talking about energy independence and economic freedom.
    Democrats are quite at ease with the environmental and climate change discourse.
    But the truth is now obvious. These two conversations, which have run in parallel,
    are actually the same conversation. It’s well past the time to merge these into
    one conversation. Our lives depend on it.


    What are the elements of that conversation? For starters, we need to clearly understand
    and identify the very real dangers to the planet and its species (including humans).
    We need to stop ignoring or confusing specific, current, unimpeachable research
    of our changing climate—globally, nationally, and locally. We need to recognize
    the thousands of compelling, real-life stories that personalize the climate and
    energy story so that it’s no longer an abstract, distinct threat.


    In short, we need a conversation that changes the tired, worn-out, redundant climate
    conversation to one that is relevant to every person on Earth and bypasses the
    often political overtones of the subject; presents clean-energy solutions that
    are not only possible but already in the works; encourages the development of
    a master blueprint that all organizations, businesses, and individuals can use
    to lower carbon dioxide emissions (the U.S. and China, combined, create more than
    42 percent of carbon dioxide emissions for the planet); and moves climate change
    from a debate (with fossil fuel providers on one side and environmentalists on
    the other) to a robust search for creative solutions that work.


    We also need to change the conversation from merely an “issue” or a potential
    future threat to a critical reality that impacts every single person on the planet.
    We need to turn away from “green” thinking (save the planet) to “blue” thinking
    (save humanity) and create a blueprint where we can all work together to save
