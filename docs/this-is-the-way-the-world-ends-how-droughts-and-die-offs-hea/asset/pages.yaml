    elephants are in trouble as well. They''re hunted relentlessly as their natural
    habitats are threatened through environmental changes and development. They don''t
    know why they''re in trouble. But we do. Some of the creatures that every child
    in America has heard of gone from their natural homes in just ten or fifteen years.
    Extinction rates for all manner of species on Earth are a hundred times higher
    than normal.


    Twenty years ago, only a very small percentage of the earth experienced extreme
    conditions—like a hot spot could literally kill us if we tried to stay outside
    for an extended period of time. Back then, only half of 1 percent of the earth
    experienced such extreme events that made our place on the planet dangerous or
    deadly. Today, 10 percent of the Northern Hemisphere is experiencing such heat
    events. The years of 2014, 2015, 2016, and 2017 were the hottest in the history
    of recorded civilization. Cities in the Middle East saw spikes of temperatures
    during the summer that reached almost 130 degrees Fahrenheit during the day—the
    sort of temperatures that make a place uninhabitable for humans if they last too
    long and occur too often. The central part of Australia now becomes so hot during
    the summer that weather forecasters had to add a new category to describe it.
    That region now essentially unfit for human living during the summer.


    Ecosystems in oceans around the world are under severe duress from a shift in
    the chemistry of the water that both depletes oxygen and makes it more acidic.
    Heat is killing vast swaths of living coral reefs off the coasts of'
