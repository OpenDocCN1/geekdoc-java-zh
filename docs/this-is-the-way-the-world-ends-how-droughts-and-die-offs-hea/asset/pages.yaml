  md: '# PART 5


    # The Blueprint


    We now find ourselves in a box canyon as a planet. But there is a realistic way
    out.


    In the next ten to fifteen years, life as we know it will start to change irreversibly.
    With CO2 levels rising dramatically, threatening human existence, climate change
    is no longer just an “issue.” It''s a critical reality that impacts every single
    inhabitant of this home called Earth. With that said, how can we effect lasting
    change with such an overwhelming crisis?


    The answer is in the opportunity that the crisis of climate change has created—one
    unparalleled in the world''s history. Over the next fifteen years, necessary infrastructure
    shifts will cost $90 million, revolving around energy needs. We''re going to spend
    that regardless, but how and where we spend those dollars is what matters.


    “The Blueprint” explores the current economic transformation and offers a realistic,
    doable, and innovative plan—one that works with nearly every sector of the economy,
    each country at some level, and relies on individual decisions rather than international
    treaties. It''s a path forward that prevents the worst impacts of climate change,
    provides sustainable energy—enough for the world’s energy requirements—and could
    simultaneously lead to the greatest economic resurgence in history.'
