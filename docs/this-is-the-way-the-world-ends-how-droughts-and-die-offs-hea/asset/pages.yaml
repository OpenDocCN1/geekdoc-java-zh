- pgno: 10
  md: 'of the planet right now. Tens of thousands of scientists have devoted their
    lives to studying and chronicling these changes as specifically and carefully
    as they can. They might not always tell the rest of us what the harbingers truly
    mean at the moment, but their studies are done for the best of reasons and with
    the purest motives. Those scientists are seeking the truth about what is happening
    to a world that is clearly in trouble. Their most sincere hope is that other people
    understand what they''ve discovered.


    We are living under a black sky, in a time of uncertainty. Important changes,
    great and small, are happening all around us. Those at our doorstep, outside our
    window, may seem small and inconsequential to us at present. They may seem invisible
    to us, like the carbon dioxide that is accumulating in the black sky above us,
    but they will grow year by year until we''ve reached the limit of what our atmosphere
    can hold to sustain life as we know it.


    We do indeed have a defined limit of what our black sky can hold in its carbon
    budget. Once we reach that limit, which could happen in twenty years or so, those
    tens of thousands of scientists, who have meticulously studied the chemical, biological,
    geologic, agricultural, and atmospheric effects we imposed on Earth''s system
    for decades, have collectively told us one very clear thing: When we reach the
    full extent of the carbon budget in a black sky above us in two decades or so,
    some catastrophically bad results that no one can predict might happen on the
    other side. The history of the earth says that breaking points have happened beyond
    that line in the past. No one knows when, or what, might happen if our black sky
    above us reaches a point of no return. But small changes now portend such large-scale
    unpredictable events later.


    While it''s uncomfortable for scientists and experts to talk about those changes
    and impacts, nevertheless it''s important that we try to describe them the best
    we can. We have to understand the limits of the black sky above us. We have no
    other choice, with the survival of the human race hanging in the balance. The
    changes and impacts of rising CO₂ greenhouse gases won''t happen somewhere in
    the distant future, when next generations might theoretically be able to create
    technology that can solve the problems. Instead, changes are happening and accelerating
    right now. Impacts, both small and large, can irrefutably be felt across our planet.'
