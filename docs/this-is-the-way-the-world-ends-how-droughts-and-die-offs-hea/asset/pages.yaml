  md: 'is that we have it now—not what we had to do in order to win the freedom to
    see that blue sky when we want.


    Black carbon rises into the atmosphere from millions of homes, hut stores, forest
    fires, tailpipes from trucks burning diesel oil, brick kilns, and elsewhere as
    soot. This black carbon is nearly responsible for trapping heat on Earth as its
    unseen, invisible cousin lingering over the sky—carbon dioxide—that is almost
    entirely a b-product of humankind''s efforts to find cheap energy sources from
    the beginning of the Industrial Revolution. Black carbon from soot and carbon
    dioxide from industrial activities have together created what is essentially a
    black sky above us, trapping heat and causing critical changes in weather patterns,
    ecosystems, and Earth systems.


    While the black-sky effects in America are small and imperceptible right now,
    that isn''t the case in other parts of the world. There are countries in southern
    Africa where extended, crippling droughts have forever altered the way families
    fight to live. Mothers in Madagascar are forced to boil cactus, the only plant
    that will grow now, since S cactus has virtually no nutritional value, those children
