    But none of these cataclysmic changes are happening in America. We don’t see children
    dying in southern Africa because extended droughts mean that their only food source
    is boiled cactus, a plant not enough to keep them alive. We don’t see China building
    a thousand-mile railroad through the Amazon to make sure they can import soybeans
    from Brazil and other countries in South America because they need them to feed
    their people. We can safely keep fleeing the Sahel region in Africa from ever
    coming into America because it’s much easier to make that Europe’s refugee problem


    Only small changes are occurring in America—not big enough to cause anyone to
    wonder why they’re happening or what they might mean in the near future. Most
    of the Western world, specifically the United States and all of Europe, fall within
    the “temperature” zones of Earth and are less prone to the immediate impacts from
    climate change that other parts of the world are experiencing presently. Only
    dry regions in the American Southwest—specifically where the Colorado River provides
    much of the fresh water to several states—seeing larger impacts occurring now.


    Sure, for fishermen in North Carolina who have to travel hours north to fill their
    allotment because their catch is migrating farther and further north, it is an
    inconvenience and a waste of fuel—not a catastrophe. New England lobstersters
    who plan to give up a life of that, has been in their families for generations
    because the sea is changing a small thing, hardly worthy of the nation''s attention.
    Farmers in the Midwest deal with more uncertainty during the planting season,
    but the situation isn''t a crisis by any means. Bird-watchers in all fifty states
    know that dozens of species are at risk because their habitats are changing, but
    that small concern only part of a passionate hobby. There are other bigger problems
    currently facing America.


    But here’s the thing. All of these seemingly random events are connected. The
    small changes happening are harbingers for something bigger. More consequential
    changes are coming much sooner than we know. Impacts to ecosystems great and small
    are occurring in every corner'
