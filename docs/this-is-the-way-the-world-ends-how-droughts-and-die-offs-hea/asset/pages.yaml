  md: '# 25


    # Disruption


    We are in the midst of an economic transformation unparalleled in the world''s
    history. It''s happening so quickly, and at such scale, that it''s almost unrecognizable
    to most people.


    That sea is also enmeshed in deep, polarizing, conspiratorial political fights,
    further obscuring its rise. A number of the wealthiest corporations in the history
    of the world—and some government leaders at their back and call—are bitterly opposed
