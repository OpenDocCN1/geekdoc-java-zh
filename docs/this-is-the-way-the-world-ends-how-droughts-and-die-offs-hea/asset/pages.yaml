- pgno: 36
  md: 'What do we know about the Himalayas is this: While their towering mountain
    ranges make it exceedingly difficult to carve out an existence for vast numbers
    of people, the region itself is almost the sole source of fresh water for more
    than a billion people who live in countries that exist in the shadow of these
    great mountains.


    There are thousands of glaciers throughout the entire Himalayan mountain range.
    These glaciers, combined with rainfall, feed into tributaries that cascade down
    the ranges. They are the source of Asia''s largest rivers, including the Yangtze,
    Yellow, Ganges, Mekong, and Irrawaddy Rivers.


    Because the mountainous region contains the largest area of frozen water outside
    the North and South Poles, it''s known colloquially as Earth''s Third Pole. The
    fresh water resulting from that Third Pole supports about 1.3 billion people in
    China, India, Pakistan, Afghanistan, Nepal, and Bangladesh.


