  md: 'For instance, a significant portion of the ice that covers the Arctic Ocean
    during the long winter used to be multiyear ice—which means that it was there
    over a long period of time and never really melted. That’s longer the case and
    partially explains why sea ice in the Arctic is dramatically lower than it’s ever
    been at this time of year.


    NASA satellites and scientists at the ground estimate that multiyear ice used
    to make up a fifth of the ice cover in the Arctic only thirty or forty years ago.
    By the end of 2016, it had shrunk to just 3 percent.


    The implications of this should be obvious. The planet warmed rapidly in a very
    short period of time, over decades. In the region most sensitive to that warming,
    the ice at the top of the world that used to remain all the time is presently
    disappearing almost entirely during the summer. The multiyear ice that served
    as a barrier against ice disappearing entirely is gone. We will now see essentially
    ice-free summers in the Arctic sooner than later.


    It is against this stark backdrop that an international group of scientists released
    a study in the winter of 2016—a study that laid out in painstaking detail why
    a series of imminent regime shifts could soon occur in the Arctic.


    The Arctic Resilience Report was five years in the making and a first of its kind.
    It was published by the Stockholm Environment Institute under the direction of
    the Arctic Council—an official body that includes all of the nations that interact
    with the Arctic alongside groups representing indigenous populations.


    Russia is a member of the Arctic Council. So is the United States. Dozens and
    some of the world’s best scientists who have devoted their professional lives
