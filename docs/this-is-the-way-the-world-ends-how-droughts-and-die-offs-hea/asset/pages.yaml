  md: 'Though these changes may not affect much personally—at least not yet—it’s critical
    that we care, hear, and understand the real stories of climate change across the
    globe as harbingers of a much bigger reality. The poignant stories in this book
    are all tales of our shared humanity—what we’re truly facing on a planet we’ve
    conquered at a very costly expense. Admittedly, some of the stories are disturbing,
    terrifying… even more because we humans, as a species, have created nearly all
    of the problems and crises ourselves. However, the good news is that we also have
    the capacity to solve those problems and crises before they reach a point of no
    return, if we choose to act now.


    This Is the Way World Ends is meant to change the current worn-out, redundant,
    polarizing climate change arguments to a united climate conversation that’s relevant
    to every human and focuses on a clear blueprint of real, workable solutions we
    can tackle together. That blueprint begins with understanding the real-life stories
    and scientific facts of what is happening right now across our globe. Because
    the subject matter is so large, we’ll explore it in stages.


    +   * “The Truth” explains what’s happening in our world now—not in some remote,
    distant future we all have difficulty truly caring.

    * “The Ecosystems” describes how the changes scientists and others are discovering
    already create large “regime shifts” in our oceans, the atmosphere, and at the
    ends of the earth.

    * “The Impacts” uncovers how devastating these changes are to species, cities,
    farming, and other aspects of life as we know it.

    * “The Geopolitics” shows what these changes mean in the real world—how they’re
    unfolding across every continent right now and why so many countries are on the
    edge of despair.

    * “The Blueprint” offers an inspired, realistic way out of the box canyon we now
    find ourselves in.

    * “The Future” reveals what the human species currently faces its most important
    test and what we must do to succeed this time around.


    Humans have passed every other challenge—from the creation of civilization in
    the shadow of the last Ice Age to the Industrial Revolution. Understanding the
    ever-growing black sky as a harbinger for future'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'cataclysmic events—which are closer than we might think—is our next great test
    as a species. Our challenge today may indeed be greater than those others, because
    we cannot afford to fail the test, or life as we know it will end.


    This Is the Way the World Ends explores the harbingers happening in our own backyard,
    the bigger changes occurring around the globe, and the ramifications of climate
    change to all of us. Once we truly know what we''re seeing with our own eyes in
