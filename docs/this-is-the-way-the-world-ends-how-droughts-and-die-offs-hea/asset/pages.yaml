  md: '# 24


    # A Path Forward


    Like President Roosevelt, who at first saw Albert Einstein’s warnings about Nazi
    scientists producing the first atomic bomb as a theoretical threat, some Americans
    today view climate change as a theoretical “future threat.” They put it far down
    the list of everyday concerns. Others aren’t quite sure how much of it is real.
    Yet thousands of scientists agree that these basic scientific facts are now irrefutable:


    +   1. Levels of greenhouse gases in the atmosphere have risen to levels never
    seen in human history.

    2. Temperatures are going up. The years 2014, 2015, 2016, and 2017 were the hottest
    in human history.

    3. Ice sheets are melting, and sea levels are rising.

    4. The patterns of rainfall and drought are changing. Springs are arriving earlier.

    5. Heat waves are getting worse, along with extreme precipitation.

    6. The oceans are acidifying, threatening vast parts of the food web ecosystem.

    7. On every continent and in every ocean, animals and plants are moving toward
    the poles.¹'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Thousands of peer-reviewed science papers present overwhelming evidence that,
    for scientists usually skeptical by nature, climate change is a “settled fact.”
    Human activity since the start of the Industrial Revolution is the cause. Though
    companies and nations are making moves to lower carbon dioxide emissions and fossil
    fuel consumption—reducing greenhouse gas levels—are disparate and disconnected.
    None, in isolation, will help solve our planetary emergency.²


    As Charles Keeling discovered, carbon dioxide levels have risen from 310 parts
    per million in the 1950s to more than 400 parts per million half a century later.
    The rate of increase of CO₂ levels is now doubling every decade. There is no precedent
    for this in recorded human history. The last time levels were this high, it presented
    significant challenges to every species on Earth.³


    We have no choice. We have to work together on real-world solutions. After decades
    of failure to act at a global level, civic, business, advocacy, consumer, and
    important world leaders are finally taking steps that scientists have been demanding
    since the 1980s. A blueprint is emerging—one that shows what we need to do to
    save the planet and its species, including human beings. We just need to learn
    how to follow the directions over the next ten to fifteen years to present this
    slow-moving catastrophe by altering life as we know it.


    We need to leave four-fifths of our known fossil fuel reserves in the ground and
    significantly change the way we build $90 trillion in infrastructure in the next
    fifteen years to make sure we don’t cross a potential tipping point of 450 parts
    per million of CO₂ in the atmosphere—a critical threshold beyond which the climate
    system could grow increasingly unstable. Half the species on our planet could
    disappear. Dust bowls could become commonplace. Drought and monsoons could become
    the “new normal” in parts of the world. And, unfortunately, it would take the
    human species one thousand years—or longer—to reverse the damage. Lowering fossil
    fuel consumption and reducing greenhouse gas levels can’t hurt our planet, allowing
    CO₂ and other greenhouse gases to reach critical levels in our atmosphere quite
    could mean the end of life as we know it on our planet at some point.⁴⁵'
