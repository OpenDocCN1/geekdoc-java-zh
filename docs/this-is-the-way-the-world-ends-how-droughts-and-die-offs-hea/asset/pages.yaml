  md: '# 6


    # Regime Shift


    An extraordinary thing happened in November 2016. It was thirty-seven degrees
    Fahrenheit warmer in the Arctic than it usually is in that part of the world during
    the winter. Those who study the Arctic or live there—from meteorologists to indigenous
    villagers who''ve grown accustomed to rapid changes in that region—were shocked.


    What was even more extraordinary, and made the extreme situation quite real to
    people all over North America, is that the usual cold air blasts coming down from
    the north were strangely absent that. It was seventy-two degrees on Christmas
    Eve in New York City. It''s never been that in New York during Christmas—ever.


    “The Arctic is broken,” Paul Huttner, the chief meteorologist for Minnesota Public
    Radio, wrote in an attempt to explain why temperatures in the Arctic had migrated
    south to North America, producing record-breaking temperatures everywhere in the
    United States. Taken as a whole, temperatures across North America were as much
    as twenty degrees higher than normal at the end of 2016.¹


    For scientists and others studying the long-term trends in the Arctic, and the
    impact that global warming has on both the ecosystem and the natural resources
    in the area, the temperatures during the winter of 2016 were deeply troubling.'
