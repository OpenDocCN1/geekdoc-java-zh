    # Species on the Move


    When Terry Root—a soft-spoken biodiversity expert and now a senior fellow emerita
    at Stanford University’s Woods Institute for the Environment—decided to study
    whether birds in North America were flying earlier or shifting their ranges in
    response to Earth’s changing climate system three decades ago, she wanted to know
    if birds were changing their patterns on a big, continent-wide scale. At the times,
    others were evaluating much smaller changes in local areas, including biodiversity
    research of environmental factors such as predator-prey relationships. But Root
    focused on temperature—on a continental scale. She wanted to learn whether birds
    and their ranges across North America were affected by climate changes and temperature
    fluctuations.


    What she found was that birds only migrate as far north as their metabolism will
    allow them compensate for heat overnight. Her research firmly established that
    bird species moving their ranges over time. They were coming earlier in the spring
    and leaving later in the fall. They were moving their ranges up in elevation and
    latitude, toward the poles. Root’s groundbreaking migratory bird study was the
    first definitive proof that birds and other species were responding to the changing
    climate and that humans were responsible for the changes.¹'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'At the time, no one had yet asked the question now at the very center of hundreds
    of biodiversity research projects in every corner of the planet: How will Earth’s
    changing climate affect us and every species that lives on the planet with us?
    Root’s research told a simple, elegant story that, yes, species are migrating
    away from a growing threat to their local habitats. Her study led the way to thousands
    of other biodiversity studies chronicling species great and small being forced
    to move from their homes toward the poles to escape a warming planet.


    Root was a lead author of the first biodiversity reports issued by the global
    climate body of experts (the Intergovernmental Panel for Climate Change) that
    told the world why species on the planet were starting to move north or south
    toward the poles to escape rising temperatures. She knows more about biodiversity
    and the impacts of Earth’s changing climate system on species than just anyone,
    ever.


    In 2003, Root and other leading authors decided to look at every piece of research
    done to point on species migration had been conducted since her first migratory
    bird study. What they found was that, yes, a profound shift was under way.


    > Over the past 100 years, the global average temperature has increased by approximately
    0.6 degrees Celsius and is projected to continue to rise at a rapid rate,” Root
    and other authors wrote to open that seminal 2003 study.


    Although species have responded to climatic changes throughout their evolutionary
    history, a primary concern for wild species and their ecosystems is this rapid
    rate of change.


    We gathered information on species and global warming from 143 studies for our
    meta-analyses. These analyses reveal a consistent temperature-related shift, or
    ‘fingerprint’, in species ranging from mollusks to mammals and from grasses to
    trees.


    Indeed, more than 80% of the species that show changes are shifting in the direction
    expected on the basis of known physiological constraints of species. Consequently,
    the balance of evidence from these studies strongly suggests that a significant
    impact of global warming is already discernible in animal and plant populations.'
