- pgno: 83
  md: 'Coral reefs are formed when coral skeletons accumulate over hundreds or thousands
    of years. These skeletons, made of calcium carbonate, create a complex structure
    that supports a huge diversity of marine life.^7


    Coral die-offs can occur for several reasons. Water pollution or disease can irritate
    coral skeletons, which in turn causes them to expel the brightly colored algae
    that live within the coral systems in a symbiotic relationship. Both of these
    are complicated when a coral reef is stressed by warm water.


    In fact, it’s the warming ocean water—now occurring on a long-term basis from
    climate change and a short-term basis from weather events like El Niño—that is
    the primary reason brightly colored algae are expelled. That is what turns the
    coral white, essentially “bleaching.” Once the algae are gone, the reefs essentially
    “die” as the vast diversity of life goes away.^8


    The oceans, meanwhile, absorb even more of the carbon dioxide (created when we
    burn fossil fuels) than the atmosphere, which causes other problems for ocean
    life and will accelerate planetary warming in coming years.


    For this reason, oceans may be an even earlier warning system that we''re in serious
    trouble than rising temperatures on land. That’s why dying reefs all over the
    world are a very clear signal that the changing climate system is starting to
    have profound impacts.


    Until the March 2017 study in Nature, most scientists assumed it would be thirty
    or forty years before warm oceans would begin to truly kill the great coral reef
    systems like Australia’s Great Barrier Reef.


    Not now. The Nature study was an immense wake-up call for the science community.^9


    We didn’t expect to see this level of destruction to the Great Barrier Reef for
    another 30 years,” Hughes said. “In the north, I saw hundreds of reefs—literally
    two-thirds of the reefs were dying and are now dead.^10


    Coral reefs are more than just colorful attractions that support a tourism economy
    (though they are certainly, especially in countries like Australia). If most of
    the world’s coral reefs die—which now appears to be the case, sooner than scientists
    had expected—it will have an immense and immediate impact along coastlines across
