    North Atlantic and the Gulf of Mexico and the extra precipitation that now circulates
    in the atmosphere. Both of these things—warm ocean water and extra precipitation
    capable of gathering regionally in certain parts of the world at any given time,
    depending on other factors—are new elements in a world that’s changing in real
    time, with real-world consequences. It was precisely these dual conditions that
    later fueled Hurricane Harvey, “adding to the rain that kept Houston underwater
    for days,” and Hurricane Maria, leading to floods and landslides in Puerto Rico,”
    as well as the Atlantic’s“unusually warm waters” that added to Irma’s intensity
    in fall 2017 as it destroyed islands in the Caribbean.¹


    By the time the storm made landfall in the southeastern United States in 2016,
    a few weather forecasters started to pay close attention as well. But it was still
    a local story, and not necessarily out of the ordinary. People in Louisiana, who
    are accustomed to such storms and deluges, were prepared


