- pgno: 65
  md: '“It’s about 20C [37 degrees Fahrenheit] warmer than normal over most the Arctic
    Ocean, along with cold anomalies of about the same magnitude over north-central
    Asia. This is unprecedented for November,” said Rutgers atmospheric science professor
    Francis Francis.


    “These temperatures are literally off the charts for where they should be at this
    time of year. It is pretty shocking. The Arctic has been breaking records all
    year. It is exciting but also scary,” said Francis, who has been studying ways
    in which the extreme temperature shifts in the Arctic in recent years are starting
    to have a dramatic effect on weather patterns in North America and Europe.


    Sea ice, which forms and melts each year, has declined more than 30 percent in
    the past twenty-five years. It hit the lowest levels in recorded history the same
    month that temperatures spiked so dramatically in the region. Francis is unambiguous
    about the reason—and what it means. “It’s all expected,” she said. “There is nothing
    but climate change that can cause these trends. This is all in the same direction
    and picking up speed.


    Scientists have several possible explanations for what’s happening in the Arctic,
    ranging from the aftereffects of El Niño to the way in which heat escaping from
    the Arctic Ocean is still lingering in the atmosphere. What happened in the Arctic
    in the winter of 2016 could be a pattern or simply an outlier. We may never see
    extreme temperatures like this again in part of the world—or we may start to see
    them quite often.


    Francis has researched the extraordinary way in which extreme temperatures in
    the Arctic have likely changed the jet stream—a process that may make wild temperature
    swings in North America more common and accelerate ice melting in places like
    Greenland.


    She has studied this for years, in pitched battles with other scientists who have
    begun to gradually come around her hypothesis. Her thesis is that rising temperatures
    in the Arctic, closely intertwined with the loss of sea ice, are changing the
    shape of the jet stream and altering the weather of the Northern Hemisphere.


    “We’ve been watching the Arctic very closely for years, but [2016 been] particularly
    interesting,” Francis told Yale’s E360 news service. “It’s not just the bizarre
    behavior that’s going on now, but it really started in the beginning of this year.
    It’s pretty much in record territory in terms of sea ice and high temperatures
    almost every month.'
