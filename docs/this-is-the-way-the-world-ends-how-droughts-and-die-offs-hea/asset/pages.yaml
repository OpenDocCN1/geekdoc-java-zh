    science-based effort to explain what might happen if tipping points are crossed
    in the Arctic thanks to global warming that is permanently altering the region.


    The scientists didn’t pull any punches in the report.


    “The Arctic is now changing at an unprecedented pace, on multiple levels,” wrote
    the study’s cochairs, Johan Rockström and Joel Clement. “Arctic social and biophysical
    systems are deeply intertwined with our planet’s social and biophysical systems,
    so rapid, dramatic and unexpected'
