  md: '# PART 6


    # The Future


    We currently face our most important test as a species. To succeed, here''s what
    we must do.


    In the course of our long, complex human story, we''ve had to pass through significant
    gates to keep moving forward—including surviving the Ice Age, migrating out of
    Africa, creating civilizations, building machines, exploring and conquering the
    earth, and enduring two world wars. In spite of all those challenges, we, the
    human species, survived and made our way through each and every gate.


    “The Future” reveals our new gate—one we created ourselves by exhausting the resources
    of the earth we''ve conquered—is the species'' most important test and outlines
    what we must do to succeed this time around. We can make our way through this
    new gate, too, but how we decide to do it will shape our future as a human species.


    As the number of refugees increases—whether from civil wars, persecution, or environmental
    crises—will the growing trend of nationalism cause countries to seal their borders?
    Or will leaders and lawmakers unite to solve the real challenges and global threats
    that all of us commonly share as we coexist under a black sky of our own making?


    The critical, important steps we can take right now are manageable, if we work
    together.'
