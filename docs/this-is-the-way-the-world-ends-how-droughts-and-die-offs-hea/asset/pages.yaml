    This has, Francis said, made the jet stream “wobbly” and uneven.


    With temperatures warming the Arctic, the jet stream is getting even moreobbly.
    It’s no longer the nice, smooth-flowing stream that meteorologists have grown
    accustomed to, which allows them to predict the weather. It bends in serpentine
    fashion now. It gets “stuck” in one pattern for days on end, wreaking havoc with
    local weather.


    The biggest problem is that the jet stream wobble may be permanently changing
    nearly all weather patterns across the Northern Hemisphere … making everything
    unstable, unpredictable, and disruptive. Scientists may ultimately be able to
    prove that this new jet stream created a blocking ridge off the coast of California
    that essentially locked in years of drought, which has had a profound effect on
    the nation’s agricultural breadbasket in the Central Valley.


    The Arctic is perhaps the clearest example of the wolf at our door. It is trying
    to warn us that the extremely warm temperatures in the Arctic are now affecting
    the rest of the planet. The jet stream wobble is the manifestation of that warming.
    It isn’t simply about polar bears. It’s about the human species.


    What happens in the Arctic doesn’t stay in the Arctic. Big temperature increases
    there are permanently altering the region in ways that will have untold consequences.
