    ## 练习瑜伽


    这是你可以在家里舒适的环境下进行的活动。与呼吸同步的动作对你的身心健康都有巨大的益处。有很多风格和类型的瑜伽供你选择，它们对你的健康都有帮助，所以请尝试所有的种类，直到找到适合你的一种为止。


    ## 运动


    你可能听过很多关于运动如何帮助抑郁的说法，这是因为这已被证明是有效的。当你的心率增加时，身体会释放内啡，有助于改善情绪。此外，运动还能提供其他生理益处。在抑郁期间，可能很难产生运动的动力，你可以邀请别人一起去。这将使运动和社交的好处加倍。


    ## 改变姿势


    在一个地方坐得或躺得太久会加剧抑郁。所以是时候站起来走走，或者做些改变姿势的事情了。血液循环让你感到与身体更加紧密。这可以增加信心并降低压力激素的水平。


    ## 多微笑


    抑郁症不会让你想要微笑。然而，即使是假装微笑也能改变大脑的化学变化，并让良好的化学物质流动起来。所以记住在白天微笑，帮助自己感觉好些，即使是假笑。


    ## 发挥创造力


    当你进行创造性活动时，它们可以用不同的方式使用你的大脑。这些活动有助于减轻抑郁症状。有些研究甚至显示，创造性活动产生的效果与冥想相似。发挥创意并不意味着你必须擅长它；只需尝试写作、绘画、绘画、烹饪、编织或手工制作等。


    ## 结论


    对于那些月光族的人来说，过节约的生活并在大萧条时期从祖辈那里学习是一个极好的主意。然而，对于那些单纯想要取得进步并为下一次抑郁到来做好准备的人来说，这也是一件很好的事。尽管许多人还没有准备好转向节约的生活。希望阅读本指南能帮助你下决心做出改变，并为即将到来的事情做准备。


