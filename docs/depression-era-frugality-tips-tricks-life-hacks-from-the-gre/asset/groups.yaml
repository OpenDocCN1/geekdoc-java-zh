    \  - 构建大萧条期的储藏室\n- 大萧条期的服装生活技巧\n  - 开发极简衣橱\n  - 让你的衣服更耐穿\n  - 折旧店衣物购物\n- 大萧条期的清洁生活技巧\n\
    \  - 自然且节约的清洁\n  - 用醋清洁\n  - 用小苏打清洁\n  - 用硼砂清洁\n- 大萧条期的组织与存储技巧\n  - 改造利用收纳\n \
    \ - 廉价商店组织\n- 大萧条期的家庭管理生活技巧\n- 削减家庭支出\n- 节省电费\n- 无需空调的降温\n- 家电器\n- 二手厨房小具\n- 减少纸制品\n\
    - 大萧条期的医疗与美容技巧\n- 大萧条期的医疗技巧\n- 大萧条期的美容技巧\n- 大萧条时期的娱乐生活技巧\n- 免费可做的活动\n- 预算范围内的假期\n\
    - 大萧条时期寻觅廉价或免费物品的窍门\n- 购物时如何省钱\n- 每月大促销\n- 批量购买\n- 更多关于食品省钱的想法\n- 在廉价商店购物\n- 食品储藏室\n\
    - 大萧条时期无工作赚钱的技巧\n- 额外资金储蓄\n- 存下零钱\n- 未使用的礼品卡\n- 手机应用\n- 与银行沟通\n- 变卖物品\n- 如何在线销售\n\
    - 产生副收入\n- 大萧条期的预算创意\n- 如何制定成功的预算\n\n# 预算失败的原因\n\n- 贫穷心理学\n- 人在大萧条时期是如何应对的\n-\
    \ 人现在可以如何应对\n- 节俭与廉价的区别\n- 节俭生活的好处\n- 记住这是一种选择\n- 并非全有或无\n- 需要避免的消费错误\n- 无需药物提升心情的方法\n\
    \n# 大萧条简介\n\n我们生活在一个处处充满不确定性、未来充满疑的时代。在某种意义上，我们正在重复历史。因此，我们需要从那些经历过前几代的人身上学习。我们的父母和祖辈经历过被称为“大萧条”的时期。他们通过节俭生活和学习自力更生生存了下来。我总结了一些来自我家族的教训，以便你有一份指南，帮助你在艰难时期生存下来。\n\
    \n大萧条是美国历史上从1929年到1939年的十十年时期。它仍然是美国历史上最糟糕的经济低迷之一。在大萧条的高峰，美国近四分之一的劳动力失业了。即使是那些仍在工作的人，工资也所减少。结果，许多人开始以这样的格言生活：“用光它、穿破它、制作它或不要不要。”大萧条期的家庭主妇学会了如何通过智能购物、餐食准备和明智地使用食物来延长食品预算。\n\
    \n我想出了一些最佳技巧和窍门，帮助你在生活的各个方面省钱又省力。但首先，让我们快速看看大萧条是什么，以及人们在那个时期是如何做的。\n\n# 大萧条期的食品生活技巧\n\
    \n我们将首先看的是如何应用这些技巧来帮助你充分利用居家物品，以及如何节省时间和金钱。让我们先从一些帮助你扩展预算的食品技巧开始。\n\n# 节省储藏食品费用\n\
    \n你可以使用大萧条技巧的第一个领域是扩展食品预算。你可以通过购物时省钱、经营菜园、饮食规划和储备你的储藏室来实现。在涉及到扩展食品预算时，大多数人认为他们必须放弃健康食品。事实并非如此；有几种健康食品只需不到美元就能买到，就能提供一周或更久的食物。让我们来看看一些可以廉价购买的顶级健康食品。\n\
    \n# 黑豆\n\n黑豆富含纤维、钙和叶酸。通过购买干豆并将其煮熟，你可以保留大量的抗氧化剂。烹饪它们很容易，你可以用它们来做汤。你通常可以以每磅低于30美的价格买到干豆。\n\
    \n# 鸡蛋\n\n这些是不到1美元的最全能的健康食品之一。你有多种方法可以使用它们。它们是简单的早餐，为你提供蛋白质开启新的一天。你还可以用它们制作蔬菜法姆蛋，可以在冰箱里存放几天。如果你养鸡，鸡蛋也是你可以自己获取的物品。\n\
    \n# 杏仁\n\n对于忙碌的人来说，这是一个非常棒的健康零食。你通常可以以每份20到25颗杏仁约60美分的价格买杏仁。\n\n# 鹰嘴豆\n\n这种豆富含纤维，是沙拉的绝佳补充，或者可以用来自己制作鹰嘴酱，比商店买的更便宜。你通常可以用约30美分买到半杯，或者约1美元买一罐。\n\
    \n# 燕麦片\n\n这些非常便宜，通常每磅约1美元。自制燕麦片是一个很好的廉价早餐选择，甚至可以代替面粉做饼干。\n\n# 扁心豆\n\n自制豆泥便宜且易于制作，自己制作能提供更多的健康益处。每半杯约25美分，它们为你的饮食增加了纤维和蛋白质。\n\
    \n# 米饭\n\n米饭长期以来一直是节俭型储藏室的主食。如果你是从头开始煮，情况尤为如此。你有一系列选项可以选择，大多数每磅不到美元。米饭可以作为晚餐的底、、汤中或作为单独的配菜。你可以批量烹饪，并在整个周的餐食中使用它。\n\
    \n# 小扁豆\n\n这是另一种选择，类似于豆类。你可以以每磅不到1美元的价格买到。然而，这些不需要像豆类那样浸泡，因此制备时间更短。它们可以用于汤中，也可以作为极佳的配菜。\n\
    \n# 鸡肉\n\n取决于鸡肉的部位，这可能比其他健康食品贵一点。然而，如果你想在饮食中加入肉类，这是最便宜的选择。你可以将鸡肉在冷冻室保存长六个月，并用于各种食谱。你甚至可以使用鸡骨制作高汤，供其他食谱使用。\n\
    \n"
