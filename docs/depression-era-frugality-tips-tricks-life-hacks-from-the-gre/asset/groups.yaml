    # 使用小苏打清洁


    有很多方法可以使用小苏打来清洁家居，一盒小苏打的价格便宜到足以减少你每月的清洁用品预算。小苏打是一种温和的研磨剂，可以用于厨房、浴室以及家里几乎任何地方。让我们来看看家中的一些区域以及使用小苏打清洁的技巧。


    ## 厨房


    - **水池。** 用小苏打和水调成糊。将糊涂在水池上，让其静置片刻，然后稍微揉搓并冲洗干净。这会清洁你的水池，还会让它留下一股清新的香气。


    - **灶台。** 将一份小苏打、一份水和一份盐混合成糊。用湿抹布擦拭灶台顶部，然后擦干净。你很快就能除掉粘固的食物残留、油脂和污垢。


    - **微波炉。** 将四大汤匙小苏打与一夸脱水混合，用它擦拭微波炉内部，以去除污垢和灰尘。它还能去除微波炉中的食物异味。


    - **冰箱。** 在冰箱里放一盒小苏打可以吸收异味，并保持食物清新。不过，你也可以将少量小苏打与醋混合产生泡沫状混合物，可用于擦拭冰箱的内壁和搁板。


    - **洗碗机。** 将一杯小苏打倒入洗碗机中，在没有任何餐具的情况下运行一个循环。这有助于去除清洁剂的积累。最好每月这样做一次，以将污垢降至最低。


    - **台面。** 在台面上撒上小苏打，用湿抹布擦干净。如果有污渍，你可以用小苏打和水调成糊；让它在污渍上静置约十五分钟，然后彻底刷洗并冲洗干净。


    ## 浴室


    - **浴缸。** 用喷壶装满醋，喷在浴缸的侧面和底部。在醋上撒小苏打。让它静置几分钟，然后用抹布或海绵刷洗。你会清除所有堆积的污垢。


    - **水池。** 将一杯小苏打倒入下水道，紧接着冲入一杯极热水。静置五分钟让混合物开始作用，然后倒入一加仑热水。根据你浴室水池的情况，你可能需要这样做几次，但最终，所有的头发和污垢堵塞都会被清除。你也可以每几周做一次常规维护，防止水管堵塞。


    - **发梳刷。** 调制一种小苏打和水的溶液浸泡你的刷子。浸泡约三分钟，然后冲洗干净。


    ## 其他清洁用途


    - **地板。** 在一桶温肥肥皂水中混合半杯小苏打。拖地地板，然后冲洗干净。


    - **猫砂盆。** 即使每天清理，猫砂盆也容易积累异味。每隔几天在盆内撒上小苏打，以防止产生异味。


    - **地毯。** 在家里地毯上撒上小苏打，让其静置三十分钟，然后用吸尘器去除异味。


    - **擦痕。** 在擦痕处撒上小苏打，用湿布或海绵刷洗。你可以轻松去除擦痕，你的地板将看起来焕然一新。


    - **垃圾桶。** 在垃圾桶底部撒上小苏打，防止异味积累并影响你的家居环境。


    - **车库。** 小苏打是吸收油脂溢出的极佳选择。


    - **鞋子。** 你甚至可以在鞋内撒上小苏打并让其过夜。这有助于减少鞋子和脚的臭味。


    在家里有很多使用小苏打的方法，不仅仅是清洁。由于其用途广泛，它是一种非常值得购买并备用的的好产品。


    # 使用硼碱清洁


    硼碱通常被称为洗衣增效剂，但它也可用于许多其他家居清洁用途。它是一种天然矿物，也是一种非常环保的家用清洁剂。然而，它不应食用，因此在孩子和宠物周围使用它时应该小心。让我们来看看硼碱的一些清洁用途。


    - 撒下等量的硼碱和糖混合物，防止蟑螂和蚂蚁进入室内。

    - 使用1茶匙洗洁精、1茶匙硼碱和1夸脱温水的混合液清洗家具；这有助于清除霉菌。

    - 在垃圾处理器中放入3 汤匙硼碱，让其静置一小时，然后用温水冲洗。这会在消毒和清洁垃圾处理器的同时去除异味。

    - 使用1 汤匙硼碱和温水的混合物擦洗脏的锅碗。由于硼碱没有研磨性，它会在不损坏表面材料的情况下分解污垢。

    - 在喷壶中混合2 汤匙硼碱和2 杯热水，用作全能清洁剂。

    - 混合1/4 杯硼碱和1 杯水，作为地毯污渍去除剂和除味剂。直接喷在或倒在污渍上即可。

    - 你可以使用硼碱和柠檬汁调成糊来刷洗并去除锈迹。之后只需冲洗并擦干即可。

    - 在洗碗机中加入1 汤匙硼碱将有助于去除餐具上的水渍。

    - 加入1 杯硼碱和2 杯水来清洁垃圾桶。

    - 在马桶中加入1/4到1/2 杯硼碱，用刷子刷洗后冲洗干净。


    这些都是清洁家居的一些很好的通用方法。保持家居整洁的另一个方面是保持其有序。一些大萧条时代的技巧也能对你的努力有所帮助。


    # 大萧条时代的收纳与存储生活技巧


    ![](img/5ce78655e630de1552f352fa8c4f5fd0_72_0.png)


    整理家居无疑可以让生活变得更轻松，但很少人知道它还能帮你节省大量资金。一个整洁的家会让你的财务状况保持更好的平衡。在我们讨论如何整理家居之前，让我们先花时间考虑一下如何通过家居收纳来省钱。


    除了省钱，收纳还能帮助你赚钱。你可以卖掉你发现没有使用的物品。你可能会发现你有一件非常有价值的物品只是在那里吃灰。即使你不卖掉物品，如果你捐赠你的物品，在年底可能还可以获得税收减免。


    收纳是减少浪费的关键。在涉及到整理食品储藏室时，尤为如此。当你知道厨房里有什么时，你就不可能忘记某些东西。这意味着食物不太可能过期，而且在准备饭菜时会有更多选择。


    一旦你开始整理，你会对自己拥有的这么多“东西”感到惊讶。起初这可能会让你无所适从，但它也能防止你出去购买更多。它将帮助你在想要购买东西时更好地评估它们。


    一个整洁的家也意味着你不会忘记诸如礼品卡、小支票和其他基本上等同于放在家里的钱的物品。当你保持整洁时，你就能记录这些东西并在它们过期之前使用它们。


    收纳还意味着你能够跟踪你的账单，而不会面临滞交金。通过收纳知道账单截止日期将使支付账单变得更加顺畅，因为你不会忘记。


    如果你正在建立一个储藏室以应对大萧条，那么你可能正在建立一个储备。你应该保持这个储备有序，以便知道你需要什么以及哪些快用完了。如果不进行组织，你可能会买太多某种东西，而没有空间存放。


    那么，如何以节约的方式进行收纳呢？让我们来看看收纳时省钱的两种主要方式：改造旧物品和廉价商店。


