    # Grow a Garden


    Gardening is one of the best ways to save money while putting fresh produce on
    the table. It was a very popular option during the Great Depression and often
    involved the whole community working together. In addition, starting a garden
    is something you can do with very little investment. Consider how much you could
    save by looking at three examples:


    +   1. Zucchini plants produce 10 pounds per plant but cost about $2 a pound at
    the store. Saving you $20 a plant.


    +   2. Tomatoes produce 25 pounds per plant but cost about $6 a pound at the store.
    Saving you $150 a plant.


    +   3. Bell peppers produce 4 pounds per plant but cost about $7.50 a pound at
    the store. Saving you $30 a plant.


    With just three plants alone, you can save almost $200 by planting your own garden.
    If you are going to start your own garden, there are ten top vegetables that give
    you the best return and are easy to maintain:


    +   1. Tomatoes


    +   2. Broccoli


    +   3. Peas


    +   4. Green Beans


    +   5. Carrots


    +   6. Spinach


    +   7. Lettuce


    +   8. Cucumbers


    +   9. Pumpkins


    +   10. Kale'
  - '[PAGE 25]


    With these benefits, you can see why starting a garden is a great idea. So now,
    let''s look at how you can get started with your garden.


    # Cultivating a Full Outdoor Garden


    Starting a garden doesn’t have to be a costly or involved endeavor. There are
    plenty of depression-era tips that will help you to frugally start a garden and
    gain the wonderful benefits of having one in your backyard.


    The first thing you need to do when starting a garden is to carefully plan out
    what you want to grow and the season in which you will be growing it. You should
    only grow produce that makes the most sense for your needs and the area where
    you are living. Often people don’t have a lot of space, so you’ll need to use
    what you have carefully. Also, make sure you only grow enough to cover what you’ll
    eat. If you grow nothing one will eat, then you are only wasting food and space.


    Similarly to planning your garden space, you also want to plan out what you will
    do when the harvest is ready. When the harvest is coming, plan out dinners that
    feature your harvested produce like soups and casseroles. You will be limited
    in what you can do, but this is a money-saving habit that helped many depression-era
    gardeners. If you can’t use all of your garden produces, then you should have
    a plan in place for canning or freezing excess produce for later in the year.


    For this reason, you want to plant some fall harvest vegetables that will last
    in storage. There are plenty of vegetables that you can harvest in the fall, like
    potatoes, turnips, and carrots. Root vegetables like these will extend your gardening
    season and will stay fresh as long as you can store them around 50 degrees.


    You can also extend your gardening time by building a cold frame. This will allow
    you to garden most crops well into and potentially through winter. You can build
    one yourself from repurposed items to save even money.


    Save money on the soil for your garden by making your own compost. This is a great
    way to have an organic garden on a budget. Create your own compost bin and add
    things then mix into your soil when tilling your garden'
- md: "\nat the start of the planting season. As the season progresses, add more around\
    \ your plants and hand mix with a hoe or rake in order to add nutrients to the\
    \ soil to help your plants grow. Some excellent items to include in your compost\
    \ bin include the following:\n\n- *Peels from fruits and vegetables\n- *Coffee\
    \ grounds\n- *Crushed eggshells\n- *Clippings from leaves and grass\n- *Shredded\
    \ newspaper\n- *Plant clippings like dead leaves, buds, etc.\n\n \n\nWhen you\
    \ are ready to plant, there are a few sources for your seeds. If you have more\
    \ room to plant extra plants, then you may want to consider ordering your seeds\
    \ online in bulk. This often lowers the price if you can buy in larger quantities.\
    \ Even if you don't have a large garden area, see if others in your area are into\
    \ gardening, and you can go in on a seed purchase together.\n\nAnother option\
    \ is to get your seeds through an exchange or library. Many public libraries have\
    \ a seed exchange, but you can also find individuals in local community listings\
    \ to see if there is an option near you. In addition, local seeds will be better\
    \ and easier to grow since they are adapted to your local area.\n\nLastly, you\
    \ can choose to start your seedling indoors from previously grown produce. There\
    \ are a number of seed starter kits you can use, but the concept is simple. You\
    \ want to start growing seeds in a bit of soil indoors until they are a stronger\
    \ plant and then transplant them outside in your garden. You should ideally start\
    \ your seedlings about a month to a month and half before you expect the last\
    \ frost. When growing seedlings indoors, there are a few tips to follow:\n\n-\
    \ Ensure the seeds have enough moisture and drainage.\n- Keep the seedlings near\
    \ a window, so they get a lot of light. Most plants need at least 12 hours of\
    \ light.\n- At night, cover the plants to keep them moist and encourage strong\
    \ growth.\n\n As you transplant your seedlings outside, you need to take good\
    \ care of them as they grow. Make sure you regularly prune and weed the garden.\
    \ Plants should be staked and trained to climb as needed. Nurture your plants\
    \ regularly in order to yield hearty crops that make your garden financially worthwhile.\n\
    \nYou can also use free gardening supplies to save money. Repurpose items you\
    \ would normally throw away rather than spending money on gardening tools. For\
    \ example, a milk jug can be cut down to create a scoop for the soil, and you\
    \ can use the box-spring from an old bed to make a trellis for vines to grow.\
    \ The more items you can get for free, the less you have to spend.\n\nLastly,\
    \ as you harvest your crops, make sure you save seeds for the next year. This\
    \ will save you money on seeds the following spring. Some vegetables aren't that\
    \ easy, but many plants are ideal for this. The following thirteen vegetables\
    \ practically regrow themselves:\n\n- 1. Scallions\n- 2. Garlic\n- 3. Romaine\
    \ Lettuce\n- 4. Carrots\n- 5. Basil\n- 6. Lemongrass\n- 7. Celery\n- 8. Onions\n\
    - 9. Bok Choy\n- 10. Avocado\n- 11. Sweet Potatoes\n- 12. Ginger\n- 13. Pineapple\n\
    \nIf you don't have space to plant a garden, you can still take advantage of the\
    \ money savings by growing your own food. You'll just need to do it with a container\
    \ garden.\n\n# Container Gardening\n\nContainer gardening is a great way to grow\
    \ even just a few vegetables to make produce a little more affordable at the store.\
    \ It is largely the same as regular gardening, there are a few tips that can help\
    \ you have success with your container garden.\n\n- Keep your containers light\
    \ and easy to move while saving money on the soil by filling the pot half full\
    \ of chopped up pool noodles, crushed boxes, Styrofoam, or something similar.\
    \ This will also assist with drainage.\n- Ensure the containers you use have proper\
    \ drainage. Holes in the pots, along with a layer of rock or other material, will\
    \ help enable drainage.\n- Don't use garden soil, rather use potting soil for\
    \ best results in a container garden.\n- Make sure you repot your plants as they\
    \ outgrow a planter and, if possible, switch out the soil each year.\n- Once a\
    \ month, you should fertilize your containers.\n- Put an uncooked unbroken egg\
    \ at the bottom of your container; it will provide fertilizer as it decomposes.\n\
    - Since a potted plant will dry faster, you should use a plastic liner and a soil\
    \ mix that retains water in order to keep the soil moist. Clean diapers in the\
    \ bottom of a pot is another good option.\n- *When choosing containers for your\
    \ garden, you can repurpose any number of containers into plant pots.\n\nNearly\
    \ all vegetables can be grown in containers. Some of the best plants for this\
    \ form of gardening include the following:\n\n- *Tomatoes\n- *Chili Peppers\n\
    - *Salad Greens\n- *Radishes\n- *Carrots\n- *Potatoes\n- *Onions\n- *Herbs\n\n\
    One last thing that I need to mention is succession planting. This is a great\
    \ way to get more food from your garden and ensure you have a steady food supply.\n\
    \n# Succession Planting\n\nGardening is a relatively easy way to get food. However,\
    \ if you are using it as a source of food, you may not want to wait until harvest\
    \ time for your entire crop. Wouldn't it be great to have food continuously available\
    \ throughout the summer? The best way to grow more food is through succession\
    \ planting. This is a process where you grow the same plant continually in the\
    \ same space throughout the growing season.\n\nThe best example of succession\
    \ planting is lettuce. Start by planting your lettuce seeds over a seedling mix\
    \ and water well. You can start harvesting baby leaves in about two to three weeks.\
    \ Every week you can add more seeds to the same seedling mix. This means you will\
    \ be able to harvest lettuce each week as you plant more seeds. When it comes\
    \ to lettuce, this only works for those that don’t grow a head.\n\nSuccession\
    \ planting is also great for carrots and radishes. With these, you sow seeds every\
    \ two to three weeks rather than seeding weekly. Simply plant another seed in\
    \ the hole after harvesting a carrot or radish. When you succession plant in either\
    \ of these ways, you'll double the harvest from your crops.\n\nAnother option\
    \ of succession planting is to stagger your planting schedule. For example, if\
    \ you plant tomatoes the first day, then they will all ripen at the same time.\
    \ You can start your tomato seeds a couple weeks apart so that plants will ripen\
    \ at alternating times.\n\nThese plants can be succession planted.\n\n# 7 Day\
    \ Interval Plants\n\n- Lettuce\n  - Mesclun\n  - Loose-leaf\n  - Romaine\n  -\
    \ Radicchio\n- Spinach\n\n# 14 Day Interval Plants\n\n- Beets\n- Kale\n- Kohlrabi\n\
    - Tomatoes\n- Carrots\n- *Radish\n- *Peas\n- *Bush Beans\n- *Turnips\n- *Potatoes\n\
    \n# 21 Day Interval Plants\n\n- *Arugula\n- *Carrots\n- *Cucumbers\n- *Melons\n\
    - *Squash\n\nNo matter how you grow your produce, another aspect of depression-era\
    \ savings is to use your produce effectively and have it available year-round.\
    \ Let’s look at two ways you can get the most out of your produce.\n\n# Making\
    \ the Most Out of Your Produce\n\nOnce you harvest your fruits and vegetables,\
    \ you'll want to make the excess last as long as possible. There are two ways\
    \ to do this: freezing and canning. Let's look a little more closely at how you\
    \ can do these two methods.\n\n# Freezing Fruits and Vegetables\n\nIf you find\
    \ yourself with an abundance of produce at the end of the harvest season, then\
    \ you need to preserve it as fresh as possible until you can use it. One great\
    \ way to do this is through freezing. Let's look at how this is done.\n\nFirst,\
    \ you need to prepare your produce for freezing. To do this, wash the produce\
    \ thoroughly, removing all leaves, stems, and pits. Chop your vegetables into\
    \ a desired shape/size. For example, potatoes do best when sliced, shredded, and\
    \ cubed. Carrots are in coins. Peppers and onions do best in strips. It is also\
    \ important to note that the vegetables for freezing are carrots, potatoes, peppers,\
    \ green peas, corn, zucchini, squash and onions.\n\nWhen it comes to firmer vegetables\
    \ such as green beans, asparagus, broccoli, cauliflower, potatoes, and snap peas,\
    \ you'll need the added step of blanching. You can do this by submerging them\
    \ in boiling water for three minutes. When you remove them from the boiling water,\
    \ immediately plunge them into ice water for the same period of time. Blot the\
    \ produce before freezing.\n\nFreezing fruits is slightly different. The best\
    \ fruits for freezing are strawberries, bananas, cherries, and blueberries. When\
    \ preparing fruits, you should peel or slice/chop the larger fruits, such as apples\
    \ and peaches. It is best to freeze your fruit in measured amounts using gallon\
    \ bags. This way, you only remove enough for a pie or a shake. It is important\
    \ to keep in mind that fruit will lose its form when frozen, so it is best to\
    \ use frozen fruit for pureed or baked recipes once thawed.\n"
  mdcn: '

    在种植季节开始时。随着季节的进行，在你的植物周围添加更多肥料，并用锄子或耙子手动混合，以向土壤增加养分，帮助你的植物生长。堆肥箱中包含的一些优质物品包括：


    - *水果和蔬菜的果皮*

    - *咖啡渣*

    - *压碎的蛋壳*

    - *叶子和草的剪碎物*

    - *碎报纸*

    - *植物剪碎物，如枯叶、芽芽等*


    当你准备好种植时，有几个来源可以获取种子。如果你有更多空间种植额外的植物，你可能想考虑在网上批量购买种子。如果你能大批量购买，价格通常会降低。即使你没有大面积的花园，也可以看看你所在地区是否有其他人也喜欢园艺，你们可以一起购买种子。


    另一个选项是通过交换或图书馆获取种子。。许多公共图书馆都有种子交换，但你也可以在当地社区列表中寻找个人，看看你附近是否有此类。此外，当地种子会更好且更容易生长，因为它们适应了你所在的地区。


    最后，你可以选择从之前种植的农产品在室内开始育苗。有很多育苗套装可以使用，但其原理很简单。你希望在室内的一少量土壤中开始种植种子，直到它们变成更强壮的植物，然后将它们移到花园花园。理想情况下，你应该在最后一次霜冻前一个月到一个月半开始育苗。在室内育苗时，有几个建议需要遵循：


    - 确保种子有足够的水分和排水。

    - 将幼苗放在窗户旁，让它们获得充足的光。大多数植物至少需要12小时的光照。

    - 晚上遮盖植物以保持湿润并促进强壮生长。


    当你将幼苗移到室外时，在它们生长期间需要良好地照顾它们。确保定期修剪花园和除草。根据需要为植物搭建支架并引导其攀爬。定期养护你的植物，以获得丰收的作物，让你的花园在经济上有所价值。


    你还可以使用免费的园艺用品来节省费用。重新利用你通常会扔掉的物品，而不是在园艺工具上花钱。例如，牛奶桶可以切开做成盛土铲，你可以用旧床的弹簧制作藤蔓生长的植物架。你能获得的免费物品越多，花费的钱就越少。


    最后，当你收获作物时，确保为下一年留存种子。这将为你在明年春季节省购买种子的费用。有些蔬菜并不容易，但许多植物是此的理想人选。以下十三种蔬菜几乎可以自我再生：


    - 1. 葱

    - 2. 大蒜

    - 3. 罗马ر生菜

    - 4. 胡萝卜

    - 5. 罗勒

    - 6. 香柠檬草

    - 7. 芹芹

    - 8. 洋葱

    - 9. 大白菜

    - 10. 鳄果

    - 11. 红薯

    - 12. 生姜

    - 13. 菠萝


    如果你没有空间种花园，你仍然可以通过种植自己的食物来省钱。你只需要使用容器园艺。


    # 容器园艺


    容器园艺是种植即使少数蔬菜的好方法，可以让农产品在商店里的价格更加实惠。它与普通园艺基本相同，有一些技巧可以帮助你的容器园艺取得成功。


    - 保持容器轻便易于移动，同时在盆子里填充一半切碎的池水泡沫、压扁的盒子、泡沫塑料或类似物来节省土壤费用。这也有排水。

    - 确保你使用的容器具有良好的排水性。盆上的孔加上岩石或其他材料层将有助于排水。

    - 不要使用园土，而应使用盆土以在容器园艺中获得最佳效果。

    - 当植物长出盆器时，确保为其换盆，如果可能，每年更换土壤。

    - 每个月你应该给你的容器施肥。

    - 在容器底部放一个未煮且完好的生蛋；它在分解时会提供肥料。

    - 由于盆栽植物干得更快，你应该使用塑料内衬和保水混合土来保持土壤湿润。在盆底放置干净的尿布是另一个好选择。

    - *在为你的花园选择容器时，你可以将任何数量的容器重新用作花盆。


    几乎所有的蔬菜都可以在容器中生长。适合这种园艺形式的一些最佳植物包括：


    - *番茄*

    - *辣椒*

    - *沙拉菜*

    - *萝卜根*

    - *胡萝卜*

    - *土豆*

    - *洋葱*

    - *香草*


    我还需要提到的最后一点是连续接种。这是从你的花园获得更多食物并确保你有稳定食物供应的好方法。


    # 连续接种


    园艺是获取食物的一种相对简单的方法。然而，如果你将其作为食物来源，可能不想等到整个农物的收获时间。如果整个夏天都有持续的食物供应不是太好了吗？获得更多食物的最佳方法是通过连续接种。这是一个在整个生长季节内于同一空间持续种植同一种植物的过程。


    连续接种最好的例子是生菜。从在育苗混合土上种植生菜种子并浇水开始。你可以在大约二三周后开始收获幼叶。每周你都可以在同一个育苗混合土中添加更多种子。这意味着你将能够一直收获。


    连续接种最好的例子是生菜和萝卜。


    # 7 天间隔植物


    - 生菜

    - 混合菜

    - 散叶生菜

    - 罗马生菜

    - 菊苣

    - 菠菜


    # 14 天间隔植物


    - 芝麻菜

    - 苦菊

    - 羽甘蓝

    - 萝卜根

    - 萝卜菜

    - 豌豆

    - 芜蓝


    # 21 天间隔植物


    - 芝麻菜

    - 胡萝卜

    - 黄瓜

    - 甜瓜

    - 南瓜

