    作者：\n\nDeborah Harold\n\n版权所有 © 2020 – Parma Books\n\n保留所有权利。\n\n未经版权所有者事先书面许可，或根据1976年美国版权法法第107条和第108条的规定，本书物的任何部分不得以任何形式或通过任何电子、机械、复印、录音或其他方式复制、存储在检索系统中或传输。\n\
