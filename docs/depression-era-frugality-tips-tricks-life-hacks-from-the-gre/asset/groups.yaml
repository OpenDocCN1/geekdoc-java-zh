    # Household Appliances


    Many households have common kitchen appliances like a coffee maker, dishwasher,
    microwave, etc. These appliances make life much more convenient than it was during
    the Great Depression. Yet, most people don''t realize you can use these items
    for more than their intended purposes, so you can get more for your money. Consider
    some of the ways you use your appliances that you likely never thought of before.


    # Coffee Pot


    A coffee pot can be for pretty much anything that needs hot water without having
    to use the stove. It can be a great way to water for your morning oatmeal or hot
    chocolate. It doesn''t just have to be for coffee.


    # Food Processor or Blender


    A food processor can be a great way to make pizza dough for dinner or for homemade
    peanut butter. Simply puree peanuts with a bit of honey to taste until you get
    the desired consistency.


    # Microwave


    The microwave can be used to sanitize the kitchen sponge by placing it damp in
    the microwave and zapping for 30 seconds. The microwave can also make juicing
    citrus fruits easier. Microwave lemons and limes for fifteen seconds, and getting
    the juice out will be much easier.


    # Slow Cooker or Crock Pot


    The low or warm setting on a crockpot can proof your bread. You can also use it
    to make your own soap or use it as a fondue pot.


    # Dishwasher


