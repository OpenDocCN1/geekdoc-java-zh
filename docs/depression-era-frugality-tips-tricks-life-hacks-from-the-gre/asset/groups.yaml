    half cup for about 30 cents or in a can for about a dollar.


    # Oats


    These are very affordable, often about one dollar a pound. Homemade oatmeal is
    a great cheap breakfast option and can even be used in place of flour to make
    cookies.


    # Pinto Beans


    Refried beans are cheap and easy to make on your own; and provide more health
    benefits when you do so. At about 25 cents a half-cup, they add fiber and protein
    to your diet.


    # Rice


    This has long been a frugal pantry staple. This is especially true if you cook
    it from scratch. You''ll have a range of options to choose from, and most are
    under a dollar a pound. Rice can be used as a base for dinner, in soups, or as
    its own side dish. You can cook it in bulk and use it in meals throughout the
    week.


    # Lentils


    This is another option, similar to beans. You can get them for less than a dollar
    pound. However, these don''t require soaking like beans, so they can be prepared
    in less time. They can be used in soup or make an excellent side dish.


    # Chicken


    Depending on the part of the chicken, this can be a little more expensive than
    other healthy foods. However, if you want to include meat in your diet, this can
    be the cheapest option. You can keep chicken in the freezer for up to six months,
    and it can be used in a wide variety of recipes. You can even use chicken bones
    to make broth for use in other recipes.'
