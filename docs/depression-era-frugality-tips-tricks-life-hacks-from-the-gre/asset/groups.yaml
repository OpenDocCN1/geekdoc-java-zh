    ## 擦布对比对比纸巾


    在擦拭表面和清洁房屋各个角落时，你可以选择多种重复使用的方案。你可以购买工作巾，或者使用剪开的旧床单和毯子。无论你使用哪种类型的布，都能减少浪费并对家中的物品进行循环利用来节省资金。


    只需进行微小的调整，你就可以轻松从使用一次性纸制品切换到重复使用的方案。经常这样做可以在节省每月预算的同时，帮助保护环境。


    ## 大萧条时代的医疗与美容妙招


    ![](img/5ce78655e630de1552f352fa8c4f5fd0_95_0.png)


    ## 大萧条时代的健康妙招


    现代科学和医学为人类做了很多，并持续让我们的生活变得更好。然而，在大萧条时期，我们的祖辈通常依靠智慧和节俭来保持健康。对于非紧急情况，可以考虑尝试大萧条时代的健康妙招。


    ### 虫咬


    对于昆虫咬或蜂蛰，你可以将一些小苏打水调成糊状。将糊涂在叮咬处静置。干燥后，小苏打会脱落，你可以涂抹更多的糊。


    ### 胃部不适


    聚合草茶可以缓解许多疾病，但它通常用于胃部不适。泡一些茶享用。你可以在商店购买这种茶，也可以自己种植。


    ### 发烧


    这听起来可能很奇怪，但在脚底放置新鲜洋葱片可以帮助退烧。在洋葱片上套上紧的袜子，然后轻轻按摩以帮助身体更快吸收。如果可能，每四到六小时更换一次，并持续到发烧结束。


    ### 木刺


    如果你发现皮肤里扎了木刺，这个技巧可以帮助你将其取出。从刚裂开的鸡蛋内部取出一片薄白膜。将这层膜像创可贴一样覆盖在刺部位，木刺就会浮出表面。


    ### 感冒和流感


    随着感流感季节逐年延长，手头准备润喉软膏是一个好主意。自己制作可以节省费用，并在你需要时随取可用。


    成分：


    - 20 滴茶树精油

    - 15 滴薄荷精油

    - 4 汤匙乳木果油

    - 2 ½ 汤匙椰子油

    - 4 盎司带盖或密封玻璃容器的梅森罐


    使用方法：


    - 向小汤锅中倒入半水，置于中低火上。

    - 将罐子放入水中，不要让水进入罐内。

    - 向罐中加入乳木果油。

    - 融化后，加入椰子油并搅拌均匀。

    - 等两者都融化后，将罐子从锅中取出。

    - 让混合物冷却至室温或约十五分钟。

    - 加入精油并再次搅拌。

    - 冷却至固态，然后用盖子密封。

    - 存放在凉干燥处，可保存长一年。


    ## 大萧条时代的美容妙招


    大萧条时代的女性是节俭生活运动的先驱。为了避免在化妆等奢侈品上花钱，她们做出了妥协。因此，那个时代的许多女性利用手头的日常用品找到了美容妙招。你现在也会发现这些建议对节省资金很有帮助。


    - 使用一汤匙小苏打清洗并护发头发。只需揉抹在湿发上，然后彻底冲洗。你也可以用一点生蛋黄护发，并用冷水冲洗。

    - 根据你的喜好，用一点橄榄油或凡士林保持眉毛定型。

    - 榛子可以帮助眼下浮肿。用棉球蘸一点涂在眼下，避免进入眼睛。你也可以每晚使用一点凡士林以达到相同的效果。

    - 使用盐或糖磨砂膏进行皮肤去角质。

    - 一点小苏打和椰子油可以制成廉价且有效的牙膏。


    这些只是你可以从大萧条时代女性身上学到的几个通用美容建议。在大萧条时代的健康和美容妙招中，有三种被广泛广泛：茶树油、椰子油和金缕花。手头有这些意味着你可以在有限的预算内为健康和美容做很多。让我们来看看每种的作用。


    ## 茶树油的用途


    茶树油在治疗疾病和多方面改善生活方面既简单又有效。考虑以下大萧条时期的人学习使用茶树油的领域：


    1. 一滴油加一茶匙水即可做漱口水。彻底漱口并吐出，避免吞咽。

    2. 在洗澡水中加入两汤匙茶树油可以缓解身体疼痛。

    3. 每天将几滴滴在棉球上并轻轻点在水疱上，可以舒缓它们并帮助它们消失。

    4. 将几滴油加入温热潮湿的毛巾，放在胸部十到十五分钟，有助于缓解胸部淤血。

    5. 将一滴油涂在干枯龟裂的嘴唇上，可以为唇裂提供即时缓解。

    6. 将玉米粉和茶树油调成糊涂在水痘受影响区域进行治疗并使区域干燥。

    7. 在雾化器中加入几滴茶树油，以缓解最严重的咳嗽。

    8. 在洗发水中加入七到十滴茶树油有助于刺激头皮并去除头屑。

    9. 当将两滴茶树油加一茶匙橄榄油滴入耳朵时，可以减轻耳朵感染的症状。

    10. 在棉球上蘸几滴油，涂在虫咬处可以舒缓疼痛并帮助愈合。茶树油涂对蚊子叮咬同样有效。

    11. 将茶树油加入加仑水中浸泡清洁刷子和牙刷。浸泡后根据需要重复。

    12. 用棉球蘸茶树油可以涂在痤疮影响的区域。它能舒缓皮肤并促进愈合。

    13. 将脚浸在热水中并加入几茶匙茶树油，有助于缓解脚气菌。干燥后根据需要重复。

    14. 将茶树油按摩在头皮上减轻压力并促进头发生长。

    15. 将几滴茶树油和橄榄油混合涂在剃须后可以舒缓皮肤。

    16. 每天按摩茶树油可以使粗糙的皮肤变软。

    17. 将指甲浸在几杯温水中可以消除真菌。


    如你所见，茶树油对健康和美容有很多用途。手头准备一瓶。


    ## 椰子油的用途


    椰子油一直与优质产品相关。它既有健康益也有美容用途。考虑以下大萧条时代女性学习使用椰子油的方法：


    1. 椰子油是一种简便的卸妆剂。在棉球上蘸一些，眼睛周围轻轻擦拭。

    2. 妈妈们用椰子油防止臀部发红受刺激。每次换尿布时使用一点。

    3. 在肚子和侧部涂抹几滴可以防止产生妊娠纹。

    4. 椰子油具有天然防晒指数，在皮肤上涂几点可以在没有防晒霜时作为应急防晒霜使用。

    5. 在婴儿头皮上涂几滴可以消除婴儿胎垢。

    6. 在按摩时使用椰子油会让过程更加愉快。

    7. 在头发上梳几滴椰子油可以保持头发不产生毛躁。

    8. 在晨起奶昔中加入几滴椰子油可以改善全天的代谢。

    9. 在身体磨砂膏中加入椰子油会使其闻起来很香，并增加保湿性。

    10. 椰子油可以让嘴唇变得柔软滋润。涂在干裂的嘴唇上即可立竿见效。

    11. 椰子油可用于烫伤和微伤的急救，保护伤口并帮助其更快愈合。每天涂一次，直到烫伤消失。


