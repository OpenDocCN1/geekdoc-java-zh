    the foam has dried, you can rinse with cold water. Allow it to dry completely
    before using or putting away somewhere. This method works well for cleaning both
    wood and plastic cutting boards.


    - **Coffee Pot Cleaner.** Over time the coffee pot can be very grimy. Add full-strength
    vinegar to the water reservoir and run a complete cycle. Follow by running a cycle
    of water through the pot until the vinegar smell is gone. It can take several
    cycles of water to remove the residue of vinegar, but once it does, you''ll have
    a like-new coffee pot.


    # Cleaning with Baking Soda


    There are lots of ways to use baking soda to clean your home, and a box of it
    is cheap enough to reduce your monthly budget for cleaning supplies. Baking soda
    is a mild abrasive that can be used to clean in the kitchen, bathroom, and nearly
    everywhere else in the house. Let''s look at some of the areas in your house and
    techniques for cleaning with baking soda.


    ## Kitchen


    - **Sink.** Make a paste from baking soda and water. Rub the paste on the sink
    and allow it to sit briefly before rubbing it in a little and then rinsing well.
    This will clean your sink and also leave it with a light and fresh scent.


    - **Stove.** Combine one part baking soda, one part water, and one part salt into
    a paste. Using a damp rag, scrub the top of the stove, and wipe clean. You''ll
    get rid of stuck-on food, grease, and grime in no time.


    - **Microwave.** Mix four tablespoons of baking soda with a quart of water and
    use it to wipe down the inside of the microwave in order to get rid of grime and
    dirt. It can also remove odors of food from the microwave.


    - **Refrigerator.** Keeping a box of baking soda in the refrigerator can absorb
    odors and keep things smelling fresh. However, you can also mix a little baking
    soda with vinegar to produce a bubbly mixture that can be used to wipe down the
    walls and shelves of the refrigerator.


    - **Dishwasher.** Pour a cup of baking soda into the dishwasher and run it through
    a cycle without any dishes. This will help remove detergent build-up. It is best
    to do it once a month to keep grime to a minimum.


    - **Counters.** Sprinkle baking soda on the counter and wipe clean with a damp
    rag. If there are stains, you can make a paste with baking soda and water; allow
    it to sit on the stain for about fifteen minutes before scrubbing thoroughly and
    then rinsing clean.


    ## Bathroom


    - **Bathtub.** Fill a spray bottle with vinegar and spray down the sides and bottom
    of the bathtub. Sprinkle baking soda over the vinegar. Allow it to sit for a few
    minutes, then scrub with a rag or sponge. You''ll remove all the built-up grime.


    - **Sink.** Pour one cup of baking soda down the drain and follow it with one
    cup of very hot water. Allow five minutes for the mix to start working and then
    follow with a gallon of hot water. Depending on your bathroom sink, you may have
    to do this a few times, but eventually, all the clogs of hair and grime will be
    cleared. You can also do it every couple of weeks for routine maintenance and
    keeping your pipes from clogging.


    - **Hairbrush.** Make a solution of baking soda and water to soak your brushes.
    Allow to soak for about thirty minutes and then rinse well.


    ## Other Cleaning Uses


    - **Flooring.** Mix a ½ cup baking soda in a warm bucket of soapy water. Mop the
    floor and then rinse well.


    - **Litter Boxes.** A cat litter box can easily build up odors, even if it is
    cleaned every day. Sprinkle baking soda inside the box every few days in order
    to keep it from smelling.


    - **Carpeting.** Sprinkling baking soda throughout the house on the carpet and
    allowing it to sit for thirty minutes or then vacuum to remove odors.


    - **Scuff Marks.** Sprinkle baking soda on the scuff marks and scrub with a damp
    cloth or sponge. You''ll easily remove the scuff marks, and your floor will look
    like new again.


    - **Trash Cans.** Sprinkle baking soda in the bottom of your trash cans in order
    to keep odors from building up and smelling up your home.


    - **Garage.** Baking soda is a great option for absorbing grease spills.


    - **Shoes.** You can even sprinkle baking soda inside shoes and allow it to sit
    overnight. This will help reduce smelly shoes and feet.


    There are plenty of ways to use baking soda throughout your home, not just in
    cleaning. It is a great product to purchase and have on hand for its great number
    of uses.


    # Cleaning with Borax


    Borax is commonly known as a laundry booster, but it can be used for a number
    of other household cleaning uses. It is a natural mineral and a very eco-friendly
    household cleaner. However, it shouldn''t be ingested, so you should use caution
    if using it around children and pets. Let''s look at some of the cleaning uses
    for Borax.


    - Sprinkle an equal mix of Borax and sugar in order to keep roaches and ants out
    of your home.

    - Wash out furniture with a mix of 1 teaspoon dish detergent, 1 teaspoon borax,
    and 1-quart warm water; this will help clean off mildew.

    - Put 3 tablespoons of Borax in your garbage disposal and allow it to sit for
    an hour before flushing with warm water. This will get rid of odors while sanitizing
    and cleaning your garbage disposal.

    - Use a mix of 1 tablespoon of Borax and warm water to scrub dirty pots and pans.
    Since Borax is non-abrasive, it will break down grime without damaging surface
    material.

    - Mix 2 tablespoons Borax and 2 cups hot water in a spray bottle for an all-purpose
    cleaner.

    - Mix ¼ cup Borax and 1 cup water for use as a carpet stain remover and deodorizer.
    Spray or pour directly on the stain.

    - You can use Borax and lemon juice to make a paste to scrub and remove rust.
    After just rinse and pat dry.

    - One tablespoon of Borax added to the dishwasher will help remove water spots
    from your dishes.

    - Add 1 cup Borax and 2 cups water in order to clean garbage cans.

    - Add ¼ to ½ cup Borax to the toilet bowl and scrub with a brush before flushing
    to rinse clean.


    These are some great general uses for cleaning your home. Another aspect of keeping
    your home clean is to keep it organized. There are some depression-era tips that
    can help you in this endeavor as well.


    # Depression-era Life Hacks for Organization and Storage


    ![](img/5ce78655e630de1552f352fa8c4f5fd0_72_0.png)


    Organizing your home can certainly make life easier, but not many know it can
    also save you a lot of money. An organized home will keep your finances in a better
    balance. Before we get into how to organize your home, let''s take a moment to
    consider just how you can save money with home organization.


    In addition to saving money, organization can also help you make money. You can
    sell items that you find you''re not using. You may find out you have a very valuable
    item that is simply gathering dust. Even if you don''t sell items, you may be
    able to get a tax break at the end of the year if you donate your items.


    Organization is key to becoming less wasteful. This is especially true when it
    comes to organizing your food pantry. When you know what you have in your kitchen,
    you’ll be less likely to forget about something. This means food is less likely
    to expire, and you’ll have more options when it comes to making your meals.


    As soon as you start to organize, you''ll be amazed at how much "stuff" you have.
    It can be overwhelming at first, but it will also prevent you from going out and
    purchasing more. It will help you better evaluate things when you want to make
    a purchase.


    An organized home also means you won''t forget about things like gift cards, small
    checks, and other items that are basically the same as money sitting around your
    home. When you are organized, you''ll be able to keep track of these things and
    use them before they expire.


    Organization also means you''ll be able to keep track of your bills and won''t
    be faced with late fees. Knowing when things are due with organization will make
    paying the bills smoother because you won''t forget.


    If you are building a pantry to ensure you are prepared for a depression, then
    you''re likely developing a stockpile. You should keep this stockpile organized
    in order to know what you need and what is getting low. If it isn''t organized,
    you could end up buying too much of something and have no room to store it.


    So how do you go about getting organized and doing it in a frugal way? Let''s
    look at two main ways to save money when organizing: repurposed items and the
    dollar store.

