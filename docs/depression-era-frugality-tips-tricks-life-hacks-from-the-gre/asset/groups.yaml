    reality. More importantly, they focused on spending time together and the family
    through things like board games and listening to music. Many of these things we
    can still do today.


    While the world has changed a lot since the Great Depression, not much has changed
    in how you can cope with trying times. Let’s look at how you can cope today.


    ## How People Can Cope Today


    When economic troubles arise and people start living frugally, one thing that
    can develop is known as fatigue. However, it can also lead to serious health issues
    like depression. So it is important that we take the time to look at how you can
    cope.


    ### Focus on What You Have


    Take a good look at what you already have. Oftentimes, the feeling of fatigue
    simply comes from wanting something while you have. Before you start feeling like
