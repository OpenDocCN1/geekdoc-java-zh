    # More Ideas for Saving Money on Groceries


    There are many tips and tricks you can use to shop frugally and save money when
    purchasing groceries. Perhaps one of the best tips is to purchase cheaper alternatives.
    When shopping on a budget, be sure to consider these alternatives.


    # Meats


    Buy:


    +   * Bulk Hamburger

    * Whole Chickens

    * Roasts


    Don’t Buy:


    +   * Boneless Chicken Breasts

    * Individual Pounds of Ground Beef

    * Individual Steaks


    # Canned Goods


    Buy:


    +   * Tomato Sauce

    * Tuna


    Don’t Buy:


    +   * Canned Fruits

    * Canned Vegetables

    * Canned Pasta Sauce'
  - '[PAGE 121]


    In addition to these alternatives, consider the following tips to help you save
    money when grocery shopping:


    Always have a game plan when shopping. Make a list of what you need at the store
    and stick to the list when shopping. This will prevent you from overbuying. Having
    a meal prep menu in advance and checking your home before you go ensure you only
    buy what you need and reduce money spent on buying too much food or going out
    to restaurants.


    Also, keep your eyes on the sales. Grocery stores often have weekly sales flyers
    either online or in the paper. Use these ads to create your shopping lists and
    plan your meals. If you eat a particular item often and don''t see it on sale
    so often, then stock up when you find it on sale.


    Using coupons is another great way to save. When you create a shopping list, combine
    with coupons to increase the savings. Also, keep in mind the coupon policies of
    your local supermarket. Shop on days that double coupons are allowed and keep
    an eye on coupons offered within the store itself.


    If needed, purchase frozen fruits and vegetables if they are cheaper than fresh.
    It will also reduce waste since you can portion them and store the rest in the
    freezer. Fresh produce doesn''t last as long unless you can or preserve them in
    some other way. At the same time, you should always purchase in-season produce.
    This way, you can purchase at farmer''s markets where you support the local economy
    and get a great deal on


    If possible, consider purchasing generic or store brand products. Often you pay
    for the big-named brands and can save money buying generic; often, there isn''t
    much of a difference in the ingredients. Compare the two before making a decision;
    the nutritional value and ingredients should be nearly identical.


    It is important to shop at the right time. If possible, shop earlier in the day.
    At this time, the stores are less crowded, so shopping is quicker and reduces
    your chances of purchasing more than you intended. You should also avoid shopping
    when you are hungry or tired since you are more prone to buying foods that are
    high in carbs or sugars. If you shop while hungry,'
- md: '

    you’re also prone to buying too much. It is also a good idea to shop alone if
    you can, since bringing others can almost double your spending.


    When you go shopping, you should use a smaller cart if possible. When you have
    a larger cart, you may feel the need to fill it; otherwise, you feel like you
    aren''t getting enough. Shopping with a smaller cart leaves less room for impulse
    buys.


    Lastly, consider if you can shop at non-traditional stores for groceries. In some
    areas, shopping at places like the Dollar Store for certain items can be cheaper
    than shopping at a grocery store. Let’s consider what you should purchase when
    shopping at a Dollar Store to help you save money.


    ## Shopping at the Dollar Store


    Dollar Stores are a great place to find a deal. You will likely find pretty much
    anything you need here, including food. It is a good idea to check here for certain
    items before you purchase them somewhere else. Let’s consider what you should
    purchase at a Dollar Store and what you should avoid.


    ## What to Buy at Dollar Stores


    - Cleaning Supplies

    - Frozen Foods

    - Seasonal Items

    - Packing

    - Party Supplies

    - Beauty Supplies


    ## What Not to Buy at Dollar Stores


    - Baking Soda

    - Flour

    - Sugar

    - Canned Goods

    - Vitamins

    - Beverages

    - School Supplies

    - Knives


    All these tips and tricks are good at saving your money when you go grocery shopping,
    but during the Great Depression, there were individuals who couldn’t afford any
    food. What do you do if you find yourself in this situation? There are ways to
    find food for free.


    ## Food Pantries


    Whether you fall on hard times and run out of food or a food shortage leads to
    a lack of availability in your area; there may be times when you have no way to
    get food. Frankly, there are plenty of places where you can look to find free
    food.


    ## Food Banks


    Nearly all communities have a food bank of some kind. You can utilize them to
    get food sometimes up to twice a month. They can be a great source of food when
    you are struggling and need a little help.


    ## 211


    In most places in the United States, 211 provides assistance from any phone. You
    simply need to tell them what you are looking for, and they’ll find you the right
    resources. They can help put you in contact with charities in your area that can
    help supply you with groceries.


    ## Local Churches


    Sometimes the churches in your area have a way to organize food or gift card donations
    to help families in need. While they may not have a lot to provide, they may also
    be able to point you in the direction of organizations that can help help.


    ## Forage


    Nearly anywhere you live, you can forage for food such as edible weeds, fruit,
    and mushrooms. Even in city areas, you can still find some options. It is best
    to have a guidebook on hand or keep a journal of your own with where you can find
    edible plants because you don’t want to eat the wrong plants.


    ## WIC and SNAP


    Most people have heard of these programs, and they can be a great benefit for
    those in need. In addition to signing up for these services, be sure to ask about
    programs where you can use them. Sometimes there are certain stores or farmer’s
    markets where you are able to get more for your benefits than a regular grocery
    store.


    While it is great to use these services, it will feel better when you can get
    a job and start providing for yourself and your family again. During the Great
    Depression, jobs were in short supply, and many people had to find unique ways
    to make money. Let’s see how that applies to us today.


    ## Depression-era Tips for Making Money


    Without a Job


    Everyone knows the importance of a savings account and having money set aside
    for a rainy day. However, if you have to live paycheck to paycheck, then it can
    be a little difficult to add money to your savings or set money aside. There are
    plenty of ways you can start generating some extra income and help set aside money
    to get back on your feet. Consider five ways you can add extra money to your savings.


    ## Extra Money Savings


    The most obvious thing you can do is to save half of any extra money you get.
    This could be bonuses at work, birthday gifts, or any other payments you weren''t
    expecting. Set half of these amounts aside in your savings. Often this is extra
    money you weren''t expecting as a part of your budget, so saving it wouldn''t
    be that hard. It may not seem like a lot, but even an extra $5 each time will
    add up to a large amount in your savings at the end of the year.


    ## Save Your Change


    Start paying in cash and when you come home at the end of the day, put your coin
    change in a jar. At the end of the year, you''ll be surprised how much money you
    have set aside in a jar. Depending on your bank, you may also get a bonus if you
    put your change into your savings account.


    ## Unused Gift Cards


    You probably have several gift cards lying around your house that just have a
    few dollars on them. If you have these, you may be able to cash them in at retailers
    or through gift card sales kiosks in most stores.


    ## Phone Apps


    There are plenty of apps available on your phone that allows you to save money
    on groceries and household items. This will give you extra money to save. Some
    of these apps will also give you rebates and bonuses for using their services.


    ## Talk to Your Bank


    If you have a direct deposit for your paycheck, most banks will allow you to auto-save
    a certain amount from each check when it is deposited. Some banks will also round
    up debit purchases and put the extra into your savings. This can add up easily,
    depending on how many purchases you make and the amount you have set aside from
    your paychecks. Best of all, since you don''t see the amount yourself, you won''t
    be tempted to spend it, and it will be automatically saved for you.


    If none of these options work for you, then you still have options open to you
    for getting extra money. Perhaps one of the best options is to sell items around
    your home for cash.


    ## Selling Items for Cash


    If you need to get extra money or just want to build up your savings, then look
    no further than your own home. A lot of people aren''t aware of just how many
    items in their home are worth a lot of money. Consider the common household items
    that you can sell:


    - Video games

    - Books

    - Odds and ends

    - Cell phones

    - Tools

    - Clothing (shoes, belts, purses)

    - Collectibles and knick-acks

    - Kitchen appliances and jewelry


    Once you have collected items from your home to sell, you’ll often need to head
    online to sell them. Let’s consider how you can sell stuff online to get the most
    money for your items.

