    with one cup vinegar and add to a microwave-safe bowl, Microwave on high for two
    to three minutes to make the grime easier to remove. It should wipe off completely.
    Add ¼ of a lemon to the mix if you want to make it smell clean and add a little
    shine.


    +   **Refrigerator Cleaner.** A 50/50 mix of vinegar and water can be used to
    clean out your refrigerator. It removes dirt, disinfects, and prevents “growth”
    on food that may be kept in a little too long. Plus, it will help clean out any
    lingering odors.


    +   **Clean and Disinfect Cutting Boards.** Wooden cutting boards can be difficult
    to clean without from vinegar. Sprinkle baking soda on the board and then lightly
    spray with full-strength vinegar. Once'
