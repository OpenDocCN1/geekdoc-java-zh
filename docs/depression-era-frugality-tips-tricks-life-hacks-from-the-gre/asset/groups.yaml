    ## 大萧条时代的食谱


    为了让你了解什么是大萧条时代的食谱，请看以下几个示例。你可以在网上找到无数大萧条时代的食谱，它们将帮助你最大限度地利用食物，并将一餐变为多餐，从而为你节省大量的杂货费用。


    ## 糖牛奶吐司


    配料：


    - 4 片吐司

    - 4 块黄油

    - 1 茶匙糖和肉桂粉

    - ½ 杯牛奶


    制作方法：


    - 1. 小火加热牛奶。

    - 2. 在吐司上涂抹黄油并撒上糖肉桂混合物。

    - 3. 将其撕成一口口大小的小块放入两个碗中。

    - 4. 将热牛奶淋在吐司块上。


    ## 大萧条面包


    配料：


    - 5 磅 全用面粉

    - 5 汤酵母

    - 6 茶匙盐

    - 6 杯温水


    制作方法：


    - 1. 将面粉放入大碗中。

    - 2. 在中心挖一个洞。

    - 3. 在洞中加入酵母并加入足够的水以溶解酵母。

    - 4. 酵母溶解后，开始加入更多水并与面粉混合直到形成面团。

    - 5. 在碗中稍稍揉面团。

    - 6. 让面团在温暖的地方发酵，上方松地盖一条毛巾。

    - 7. 等面团发酵到两倍大小时，按压面团并将其分成七个。

    - 8. 将面包成型并放入面包模中。

    - 9. 让面团再次发酵六十分钟，直到体积增加到两倍。

    - 10. 在面团顶部切几口。

    - 11. 在 350 华氏度下烘烤至顶部呈褐色，或根据烤箱情况烘烤约 25 分钟。


    ## 奶油碎牛肉配吐司


    配料：


    - 2 汤匙黄油

    - 2 汤匙 全用面粉

    - 1 ½ 杯温牛奶

    - 1 罐（8 盎司）干牛肉

    - 1 小撮牛辣椒粉或其他调料


    制作方法：


    - 1. 小火下，在煎锅中融化黄油。

    - 2. 一次性打入面粉搅拌成面糊。

    - 3. 一少量加入牛奶并不断搅拌，同时将火调至中大。

    - 4. 边搅拌边烹，直到浓稠。

    - 5. 煮沸，拌入牛肉和调料。

    - 6. 加热并盛放在吐司上即可。


    ## 白豆火腿汤


    配料：


    - 1 磅 白海军腰豆

    - 2 个切碎的洋葱

    - 2 杯切碎的火腿或类似物品

    - 没过食材的水

    - 盐和黑胡椒或根据口味的其他调料


    制作方法：


    - 1. 将豆子浸泡一夜，或使用快速浸泡法。

    - 2. 使用大汤锅，将豆子、洋葱和火腿混合。

    - 3. 水没过食材 1.5 英寸。

    - 4. 煮沸，然后转小火慢炖。部分盖上锅盖炖约两小时，直到豆子变软。

    - 5. 观察水位并根据需要添加更多水。

    - 6. 尝试并根据喜好添加调料。


    ## 糖奶派


    配料：


    - 3 杯 红糖

    - ¼ 杯 细糖

    - ⅓ 杯 面粉

    - 1 ¼ 杯牛奶或奶油

    - 8 英寸派皮


    制作方法：


    - 1. 将所有配料充分混合。

    - 2. 倒入派皮中。

    - 3. 点上几块黄油，根据喜好撒上肉桂和糖。

    - 4. 在 425 华氏度下烘烤十分钟。

    - 5. 将温度降至 350 华氏度，烘烤四十分钟。


    ## 建立大萧条时代的储藏室


    节约生活和应对大萧条类事件的关键之一是准备并建立充足的储藏室。这通常与你现在的储藏室有所不同。在大萧条时期，并没有很多预包装食品或零食。然而，将你现在的储藏室变得更像我们亲戚那样的，可以帮你节省大量的钱，并让你自己制作更多物品。让我们来看看一些帮助你建立大萧条时代储藏室的技巧。


    ## 储备基础物资


    当时并没有很多额外的物品或包装商品，储藏室的大部分是由我们今天经常批量购买的东西。这意味着购买更多的原材料而不是成品食品。以下是一些考虑常备的某些基础物资清单：


    - 用于制作面包或作为填充物的面粉。

    - 用于作为甜味剂的蜂蜜。

    - 用于调味的盐。

    - 玉米粉，用于制作玉米糊和玉米饼等。


    你居住的地方通常决定了什么是容易获得的。你可以在杂货店批量购买大部分这些及其他类似物品。在决定在储藏室里储备什么时，尽可能避免预制混合物。


    ## 储备豆子


    由于肉类通常很昂贵，在大萧条时期，你可能无法负担每餐都有肉；你需要找到另一个蛋白质来源，或者至少一种让肉更耐吃的方法。你可以通过制作砂锅菜、汤和煎锅菜做到。这些食谱最省钱的方法是使用豆子。购买干豆通常比罐装豆子便宜。用干豆烹饪并不困难，而且提供多种选择。


    ## 常备调料


    在自己做饭时，手头有香料是件好事。由于大多数大萧条时代的食谱非常基础，调料可以用来增加多种风味。你也可以选择自己种草药并将其脱水以后使用，以节省更多钱。


    ## 尽可能脱水


    这是利用额外物资且不让食物浪费极极方法。这也是创造常备食品的方法。购买一台脱水机，它通过脱水那些可以在储藏室中存放几个月的食物，会回本的。


    现在我们已经讨论了多种使用大萧条策略来节省食物费用的方法，让我们考虑其他我们亲戚学习如何以少胜多和节约生活的领域。让我们考虑衣服，以及你如何减少物品并延长其使用寿命。


    ## 大萧条时代的服装生活技巧


    衣服是一项可能昂贵的支出。特别是如果你住在四季分明的地区，你全年需要多种类型的衣服。然而，如果你想节约生活并省钱，你需要做三件事来帮助减少服装预算。首先，我们将看看如何建立极简主义衣橱。然后，我们将看看如何延长衣服的寿命。最后，我们将看看如何在旧货商店购买廉价衣服。


    ## 建立极简主义衣橱


    采用极简主义衣橱可以节省金和时间。这并不无聊；相反，它只是让事情变得简单，并让你少少关注消费主义。让我们看看一些你可以简化生活并采用极简主义衣橱的方法。


    首先，定义什么是极简主义衣橱很重要。虽然我们谈论的是选择较少，但你也应该确保你拥有的单品相互匹配，并且轻松搭配。这意味着你不需要为每套衣服都准备一对鞋子，或为每套衣服准备一个手包，或为每个场合准备十件连衣裙。


    对于某些来说，这个过程可能比其他人更困难。如果你喜欢购物，情况尤为如此。你需要做的第一件事是仔细观察目前拥有的物品。从移除你不再穿的物品开始。或者你也可以根据它们的功能类型来审视衣橱。


    从那里开始，你可以开始搭配物品并丢掉其他的。你是否有任何与其他东西都不百搭的衣服？是否有尺码不再合身或需要修理的衣服？这些是一些容易减少的选项。这种想法是只减少那些可以与其他服装和/或配件轻松搭配的物品。


    另一种减少服装的方法是基于你喜欢的颜色。例如，如果你喜欢穿黑色、白色和灰色，那么你衣橱中的每件单品应该匹配这些颜色。


    拥有极简主义衣橱并不意味着你只需要廉价且基础的衣服。最好的方法是注重质量而非数量。如果你只能拥有几件优质衣服，也比拥有许多质量较低的廉价衣服要好。质量更高


