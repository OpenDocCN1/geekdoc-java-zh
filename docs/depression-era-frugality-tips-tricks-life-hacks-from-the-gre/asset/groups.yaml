    As you can see from this book, people coped with the Great Depression in a variety
    of ways; but mostly by being creative and industrious. They found ways to do without
    and make do with what they had. Even though they didn’t have much, they still
    found ways to enjoy life and have some fun.


    Books were popular during the Great Depression because they allowed people to
