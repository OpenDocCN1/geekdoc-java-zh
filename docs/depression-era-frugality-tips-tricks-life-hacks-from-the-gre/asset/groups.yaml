  mdcn: '


    -   纯柠檬汁可以用于清洁家中的任何不锈钢设备。

    -   在洗涤过程中可以加入几茶匙柠檬汁，代替洗衣液来帮助清洁衣物。

    -   家中还有许多其他省钱的柠檬妙用。


    ## 硼酸 (Borax)


    硼酸是一种极的全能清洁剂、消毒剂和除味剂。硼酸可用于去除地板、墙壁、天花板和台面上的污渍。你还可以将其制成强力膏状，用于擦洗、冲洗和擦净。考虑以下硼酸在家中的几种用途：


    - 硼酸是极佳的排水清洁剂。它可以消毒垃圾处理器，消除害虫，并去除水槽的腐臭味。

    - 硼酸与水混合也是极佳的马桶清洁剂。

    - 使用硼酸清洁垃圾桶以减少家里的异味。

    - 它还是极佳的地毯污渍去除剂，同时除味。与水混合后喷洒或涂在污渍上。

    - 在洗碗机中加入一汤匙硼酸有助于去除水渍。

    - 家中还有许多其他节省资金的硼酸用途。


    ## 金金缕 (Witch Hazel)


    除了清洁，这是一种非常好的备用物品，因为它还能提供极佳的美容功效。考虑一下它在清洁中的一些用法：


    - 小苏打和金金缕可以组合成极佳的浴室清洁剂。你不会接触有害化学物质，还能获得干净的浴室。

    - 金金缕也是极佳的地板清洁剂；只需与少量热水混合即可。

    - 金金缕还是家中和汽车的极佳玻璃清洁剂。

    - 它还有许多美容及其他的家居用途。


    ## 小苏打 (Baking Soda)


    小苏打长期以来被用作有效天然的清洁剂。你可以用水将其制成膏状来清洁台面、瓷砖和地板。我们将很快讨论小苏打的主要用途。


    ## 醋 (Vinegar)


    虽然醋气味很大，但它是减少异味的极佳方法。你还可以用它去除浴室的霉菌，且窗户上不会留下痕迹。涂上醋，静置片刻，然后擦洗清洁。它也可以用于洗有霉菌的毛巾以消除异味。我们将很快讨论更多关于醋及其清洁特性的内容。


    ## 玉米淀 (Cornstarch)


    除了是大萧条时期食谱的极佳添加剂，玉米淀也是极佳的清洁剂。考虑以下几种清洁方案：


    - 玉米淀是极佳的地毯清洁剂。将其撒在污渍上并让其静置二十分钟。用刷子轻刷然后吸尘。

    - 它还是盐等污渍的极佳吸收剂，还能帮助去除异味。


    ## 肥皂 (Soap)


    基础液肥皂是居家极佳的天然清洁剂。这有几种极佳的选择：


    - 加入一汤匙到热水拖地水中，有助于擦洗水槽和浴缸。

    - 一汤匙肥皂加加仑热水可以制成极佳的地板清洁剂。

    - 洗洁精也可用于洗衣服。


    ## 酒精 (Alcohol)


    异丙醇是居家极佳的清洁剂。它也非常适合消毒表面。用它来清洁台面、水槽、浴缸和任何可能滋菌的地方。


    现在让我们仔细观察三种最常见的家用清洁产品以及它们如何帮助你节省清洁家居的费用：醋、小苏打和硼酸。


    ## 用醋清洁


    醋是你在家中开始使用的最棒的清洁剂之一。它是一种强力消毒剂，可以廉价地大批量购买。事实证明醋可以杀死大肠杆菌、沙门氏菌和金黄色葡萄菌。它还是一种天然且更安全的清洁剂。用醋清洁家居每年可以节省数百美元的清洁用品费用。当你开始用醋来清洁家居时，请考虑以下你使用醋清洁家居的方法。


    -   **清除储物室的小昆虫虫。** 在某个时候，你可能会在储物室里发现虫子。如果你正试图储备大萧条式的储物室，这是你不希望发生的事情。在杯中倒入一半杯苹果醋和两滴原味
    Dawn 洗洁精。在储物室内不盖盖放置大约一周以吸引虫子。为了防止侵害，扔掉任何坏掉的东西并用 Dawn 洗洁精清洗架子。

    -   **地板清洁。** 50/50 的醋水溶液可清洁瓷砖或油油地板。你不会看到像肥皂那样的泡沫，但你会得到干净且消毒的地板。

    -   **镜子清洁。** 1/4 杯醋混合 3/4 杯擦拭酒精可以制成极佳的窗户清洁剂，不留痕迹。将混合液喷在镜子上并用无绒布擦拭。这是消毒浴室镜子的极佳方法。

    -   **除味剂。** 如果家里有异味，可以通过在不同地方放置几碗醋来去除它们。醋会在一两天内吸收异味。另外加入几碗小苏打或将未稀释的醋倒在抹布上，在房间里挥动以加速除味过程。

    -   **清洁电脑配件。** 浸过醋的棉签是清洁键盘或显示器所有缝隙的极佳方法。永远不要直接喷在电子设备上，确保不要碰到电气元件。

    -   **去除墨水。** 喷洒原浓度醋并用无绒布擦。

    -   **清洁百叶窗。** 50/50 的醋水溶液可清洁百叶窗。你不会看到像肥皂那样的泡沫，但你会得到干净且消毒的百叶窗。

    -   **厨房去油剂。** 在某个时候，厨房需要彻底清洁。醋可以让最顽固的污渍变得容易处理。将 1/4 杯水和一杯醋混合加入碗中。喷在表面并用无绒布擦拭。

    -   **地毯洗剂。** 50/50 的醋水混合物可洗地毯。你不会看到像肥皂那样的泡沫，但你会得到干净且消毒的地毯。

    -   **预防霉菌。** 如果你的家具上有霉菌，喷洒原浓度醋。轻微喷雾并用无绒布擦拭。

    -   **皮革清洁剂。** 醋混合水是极佳的皮革清洁剂。轻微喷雾并擦掉。

    -   **木材划痕。** 苹果醋等量混合可以修复木材划痕。喷在表面并擦掉。

    -   **去除熔蜡。** 等量的醋和水可用于去除熔蜡。从擦拭开始。

    -   **马桶清洁剂和消毒剂。** 将半杯小苏打放入马桶并用马桶刷清洁。加入一杯醋。在泡沫作用停止后冲水清洁。

    -   **抛光配件。** 如果你的水龙头或其他浴室配件看起来很暗，喷洒原浓度醋并擦净。

    -   **疏通排水口。** 向排水口倒入半杯小苏打，然后倒入一杯醋。让其静置直到泡沫停止。用热水冲洗排水口。

    -   **不锈钢清洁剂。** 只要你有醋，就不需要购买专门的不锈钢清洁剂。在表面轻微喷雾并用无绒布擦拭。

    -   **烤箱和微波炉清洁剂。** 在某个时候，微波炉需要彻底清洁。醋可以让最顽固的污渍变得容易处理。将 1/4 杯水和一杯醋加入微波炉适用碗中。高火加热二到三分钟，使污垢更容易去除。

    -   **冰箱清洁剂。** 50/50 的醋水混合物可清洁你的冰箱。它可以去除污垢、消毒并防止存放过久的食物产生“生长”。

    -   **清洁和消毒菜板。** 木质菜板没有醋很难清洁。在菜板上撒小苏打，然后轻微喷洒原浓度醋。


