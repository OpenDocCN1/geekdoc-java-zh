  - '[PAGE 32]


    # Making the Most Out of Your Produce


    Once you harvest your fruits and vegetables, you''ll want to make the excess last
    as long as possible. There are two ways to do this: freezing and canning. Let''s
    look a little more closely at how you can do these two methods.


    # Freezing Fruits and Vegetables


    If you find yourself with an abundance of produce at the end of the harvest season,
    then you need to preserve it as fresh as possible until you can use it. One great
    way to do this is through freezing. Let''s look at how this is done.


    First, you need to prepare your produce for freezing. To do this, wash the produce
    thoroughly, removing all leaves, stems, and pits. Chop your vegetables into a
    desired shape/size. For example, potatoes do best when sliced, shredded, and cubed.
    Carrots are in coins. Peppers and onions do best in strips. It is also important
    to note that the vegetables for freezing are carrots, potatoes, peppers, green
    peas, corn, zucchini, squash and onions.


    When it comes to firmer vegetables such as green beans, asparagus, broccoli, cauliflower,
    potatoes, and snap peas, you''ll need the added step of blanching. You can do
    this by submerging them in boiling water for three minutes. When you remove them
    from the boiling water, immediately plunge them into ice water for the same period
    of time. Blot the produce before freezing.


    Freezing fruits is slightly different. The best fruits for freezing are strawberries,
    bananas, cherries, and blueberries. When preparing fruits, you should peel or
    slice/chop the larger fruits, such as apples and peaches. It is best to freeze
    your fruit in measured amounts using gallon bags. This way, you only remove enough
    for a pie or a shake. It is important to keep in mind that fruit will lose its
    form when frozen, so it is best to use frozen fruit for pureed or baked recipes
    once thawed.'
- md: '

    The best herbs for freezing cilantro, dill, mint, parsley, basil, and chives.
    Herbs will need to be blanched in boiling water for five to ten seconds. Dip in
    ice water at the same time and pat dry. You can dice herbs before freezing. A
    great option is to freeze herbs in an ice-cube tray with water or homemade stock
    for bouillon. Herbs are good for four to six months when frozen.


    If you don''t want to freeze your produce or don''t have room to keep a lot of
    items in the freezer, then consider the second option of canning your produce.


    # Canning


    Canning was a large part of depression-era life. Leftover produce can be canned
    as jams, salsas, sauces, purees, and fermented foods. Canning is a very delicate
    endeavor since improper canning can lead to botulism. However, if you follow proper
    canning guidelines, you''ll be safe and have plenty of food throughout the year.
    Visit the National Center for Home Food Preservation for the latest guidelines
    and to get detailed instructions on how to properly can food.


    In addition to preserving food, you can also save money with depression-era cooking
    tips. This can include proper use of food scraps, planning ahead with meal planning,
    and cooking from depression-era recipes. Let''s first look at some cooking tips
    learned from previous generations.


    # Cooking Tips


    When it comes to depression-era food saving, there was a lot of preserving and
    substituting; but there were also tips on cooking that helped make food stretch.
    They knew how to use food scraps properly, they planned out meals in advance to
    use all the ingredients available, and they made very simple recipes. Let’s look
    at some tips in all of these areas to see how they can be applied today.


    # Using Food Scraps


    Households in the United States waste more food than anywhere else along the food
    supply chain. This waste is estimated at 27 million tons. That is a lot of food
    to be wasted, and it happens for five main reasons:


    - People often purchase food with the intention of cooking and eating, but through
    a lack of planning, the food spoils or expires before it can be eaten. Also, if
    people choose to eat out rather than a planned meal at home can cause food to
    go bad.

    - Food also goes bad when it is stored improperly, whether it is in a place that
    is too cold, hot, moist, or dry.

    - Buying more food than you can cook and eat before it spoils is another main
    reason.

    - Food can be discarded prematurely because people are confused by date labels
    on food and what they really mean.

    - Lastly, not using leftovers to their fullest potential can be a cause of discarding
    spoiled food.


    One of the best ways to reduce and eliminate food waste is to change your habits
    and routines. This means buying less, using more of what you have on hand, and
    saving a bit of extra money in the process. Your circumstances will determine
    exactly what you can do, but the following are some tips to help you use your
    food scraps wisely.


    # Buy What You Can Use


    After preparing a week''s worth of meals, you''ll likely have a little bit of
    everything leftover in the refrigerator. Rather than throwing these foods out,
    use them up. Consider some ideas:


    - Save produce for use in soups later.

    - Extra cucumber can be used as a refreshing flavor for water.

    - Use milk nearing expiration to make tea or other foods that can be preserved.

    - Leftover lemons can be used for cleaning purposes.

    - Onions, garlic, and other such leftovers can be used to add savor to food dishes.

    - Apples can be made into applesauce or dessert-like apple pie.


    Leftovers can also be repurposed in a variety of ways. Cooked vegetables can be
    used in a variety of ways for other meals, as side dishes or stock for soups.
    Some examples of produce scraps you can reuse instead of throwing away include
    the following:


    - Peels, ends, and cores.

    - Tough outer leaves from cauliflower and cabbage.

    - Root vegetable tops such as carrots and beets.

    - Mushroom stems.

    - Brown or mushy pieces of fruit.

    - Small amounts of leftovers that can be made into another meal.


    While these may seem like nothing more than garbage waste, they can be used, and
    some nourishment gained if you know what to do.


    # Soup Containers


    After each meal, add your odds and ends to a container stored in the freezer.
    Eventually, there will be enough in the container to make a soup. Make sure you
    have enough room in your freezer for a larger container and then put all meat,
    vegetable, and gravy leftovers into it. Once the container is full, you can put
    all the contents in a pot with some stock and cook it into a soup. This can be
    tastier than you may think as long as you follow a few simple tips:


    - Avoid conflicting flavors and spices. To do this, you should stick to just basic
    ingredients like plain meat, potatoes, and vegetables.

    - Use a good stock for cooking your soup. Leftovers don''t provide enough flavor,
    so you''ll need a good stock as your soup base.

    - Adjust your ingredients as needed. If you don''t have enough ingredients in
    your container, you can always add more. If you have extra vegetables from a harvest
    or you have canned beans, rice, or paste, these can all help add to the soup.
    Another option is to add salt, pepper, and other spices.

    - Protect your food scraps; they will keep in the freezer for a long time but
    won''t keep forever. When you start a new batch of scraps, add a new label with
    the date. If three months have passed and the container isn''t full, then you
    should make the soup anyway.


    Another alternative is to use the contents of the soup container to make a pot
    pie. Spoon everything into a pie crust with vegetables, meat, second, and then
    broth to cover them. If you don''t have broth, you can use bouillon to make some.
    Cover the dish with a second crust and bake at 350 degrees Fahrenheit until brown.


    Some of the best items to keep in a soup container or stock bag, including the
    following:


    - Carrot peels

    - Potato peels

    - Celery leaves

    - Peapods

    - Mushroom stems

    - Onion ends

    - Corn cobs


    There are some vegetables that shouldn’t be used for soups and stocks because
    of their strong flavor. This would include the following:


    - Cabbage

    - Turnips

    - Rutabagas

    - Broccoli

    - Artichokes


    # Side Dishes


    Often the pieces of vegetables that people feel need to be wasted can be the healthiest
    and tastiest portion of the food, such as the green tops of carrots and beets,
    or the stalks of leafy vegetables. Some of the options you can include the following:


    - Carrot Tops - A pungent and herbal flavor.

    - Radish Tops - Peppery, but milder than the radish itself.

    - Turnip Greens - A slightly bitter flavor.

    - Beet Greens - a mild sweet taste.

    - Onion Tops - A slightly stronger flavor than scallions.

    - Fennel Stalks and Fronds - A delicate, licorice-like flavor.

    - Stalks of Greens - Often the same flavor as the leaves.


    Young and tender scraps can be used in salads while larger and tougher scraps
    can be added to stir-fries or sautéed to make a side dish. You can also use them
    to make a soup or quiche.


    # Smoothies


    When it comes to fruit scraps, smoothies make great options to avoid waste. They
    are very easy to make; simply use whatever you have and blend it with any type
    of milk, yogurt, or another creamy treat. With smoothies, you also don''t have
    to worry about the condition of the fruit since the texture won''t matter once
    you blend it. If the fruit isn''t sweet enough, you can add a little sweetener.


    # Lunches


    The simplest way to avoid food waste is to turn leftovers into lunch for the next
    day. Simply reheat the next day, or if you don''t have the same thing two days
    in a row, you can save it for the next day. You can use a reusable container to
    take the leftovers to work for a brown bag lunch.


    If you prefer a fresh dish, you can combine your leftovers with fresh ingredients
    to have something new. Add chicken to a salad or cheese to potatoes. If you have
    a larger amount of leftovers, you can freeze some for a second dinner later.


    # Frozen Meals


    If you don''t think you can eat leftovers within a few days, then you can put
    them in a freezer-safe container and store them. Some good containers for freezing
    leftovers include:


    - Pyrex Bowls

    - Mason Jars

    - Plastic Containers

    - Ziploc Bags

    - Freezer Wrap

