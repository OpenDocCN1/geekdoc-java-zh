    # Kitchen Gadgets Second Hand


    The cost of furnishing a kitchen can be a bit costly, but with so much use, you
    can get out of certain items; it is good to keep them on hand. Thankfully, there
    are many kitchen items that are fine to purchase used. Consider the following
    items that you can buy used at a thrift store to save money when furnishing your
    kitchen.


    # Mixing Bowls


    Quality mixing bowls are very durable, easy to clean, and often oven and dishwasher
    safe. Rather than spending a lot of money on a set of your own, look for a set
    at yard sales and thrift stores. Find ones that are glass in various sizes and
    check the bottom to ensure they are oven and dishwasher safe. Avoid bowls that
    are chipped or cracked since they can harbor bacteria.


    # Cast Iron Cookware


    Cast iron pots and pans are great for sautéing and stovetop cooking. When you
    find one, you only need to clean and season it to make it as good as new. If you
    can find them in a variety of sizes, you''ll be able to use them for all of your
    cooking needs.


    # Measuring Cups


    It is a good idea to collect an assortment of measuring cups in a variety of sizes,
    so you''ll always have them available when cooking. Having a few extra on hand
    is good in case one gets lost or broken. You often find these for under a dollar
    at thrift stores, so you''ll be able to get a complete set for cheap.


    # Timers


    Kitchen timers are great for a variety of tasks. A new one isn''t that expensive,
    but you can save even more money by getting one used. Even if you have one, you
    should have a backup if the price is right.'
  - '[PAGE 91]


    # Tablecloths


    A seasonal tablecloth is a great way to dress up your table. It''ll light up a
    room and make guests feel special. New tablecloths cost more than you may think,
    so finding a used one can be a great option. Use lemon juice to remove any stains,
    and they’ll look like new.


    # Aprons


    If you like to wear an apron while cooking, you know how quickly they can get
    dirty. Rather than paying the price for a new one, purchase a used one. You can
    wash off stains if needed.


    # Drink Pitchers


    These are great to have when making drink mixes or having guests over for a drink.
    Buy a quality glass one at a thrift store. After a good cleaning, you are ready
    to go, and you’ll be saving a hefty amount on the price.


    # Mini Grills


    You will often find these at yard sales and thrift stores. When buying new, these
    can be quite expensive, and you can save a lot of money buying one used. These
    used to be popular and can still be used, but the value has gone down, and many
    people don''t need them anymore.


    # Serving Pieces


    If you entertain guests, you should look at thrift stores for serving pieces.
    You''ll often find everything you need to entertain for far less than buying all
    the items new. Often you''ll get an entire set for the same price as a single
    new item.


    # Canisters


    Canisters are a great way to store bulk items like coffee, tea, sugar, and other
    dry goods. Buying a set of canisters from a thrift store or a garage sale is a
    great option. You can either look for a matching set or create your own unique
    set from different canisters.'
  - '[PAGE 92]


    While there are a lot of kitchen items you should buy new, there are also plenty
    of things you can buy used. Keep these in mind when you plan to furnish a kitchen.
    Another way to save on household expenses is to reduce paper products in the kitchen
    and elsewhere in the house.'
  - '[PAGE 93]


    # Reducing Paper Products


    In addition to saving money, you are also saving the environment when you choose
    to reduce the number of paper products you use. There are five main ways that
    you can use cloth rather than paper products, and they are easy to implement.
    While you''ll have to do a little more laundry, it won''t have any major difference
    in the cost of purchasing paper products.


    # Hand Towels vs. Paper Towels


    Rather than buy a roll of paper towels for your bathroom or kitchen, you can use
    cloth hand towels. Each family member can have their own towel in the bathroom.
    When you hang them to dry, they won''t harbor mold or germs, and if you use only
    them to dry your hands, there won''t be crosscontamination.


    # Cloth Napkins vs. Paper Napkins


    This is possibly one of the easiest changes to. Buy a set of cloth napkins to
    use at mealtimes. If you need a larger amount, you can save money by purchasing
    bandanas at a craft store or discount store. This is a frugal, function, and convenient
    way to reduce your use of paper napkins.


    # Cloth Diapers vs. Regular Diapers


    If you have children, this can take a bit getting used to, and it can be an investment
    at first. However, it is a great way to stay eco-friendly while also stretching
    your budget. Disposable diapers and baby wipes can add up on the budget. Using
    cloth diapers and line drying can save you a lot of money.


    # Cloth Feminine Hygiene Products vs. Traditional Products


    This can be a great natural choice, and there are plenty of options to choose
    from. Most are with similar fabrics and inserts similar to cloth diapers. The
    products are easy to use, wash, and reuse just like a cloth diaper, but without
    the bulk. This is also a great way to avoid the use of chemicals.'
