    购物时，尽可能使用较小的购物车。当你用一个大购物车时，你可能会觉得有必要把它填满；否则，你会觉得没买得不够多。使用较小的购物车购物可以为冲动消费留出更少的空间。


    最后，考虑你是否可以在非传统的商店购买日用品。在某些地区，在廉价商店（Dollar Store）购买某些物品可能比在杂货店购买更便宜。让我们考虑一下在廉价商店应该购买哪些物品，以帮助你省钱。


    ## 在廉价商店购物


    廉价商店是寻找优惠活动的好去处。你可能会在这里找到你所需的一切东西，包括食物。在其他地方购买某些物品之前，先在这里检查一下是个好主意。让我们考虑一下在廉价商店应该买什么，应该避免买什么。


    ## 在廉价商店买什么


    - 洁洁用品

    - 冷冻食品

    - 季节性商品

    - 包装材料

    - 派对用品

    - 美容用品


    ## 在廉价商店不买什么


    - 小苏打

    - 面粉

    - 糖

    - 罐头食品

    - 维生素

    - 饮料

    - 学校用品

    - 刀具


    所有这些技巧和诀窍在你去买杂货时对省钱很有帮助，但在大萧条时期，有些人是买不起食物的。如果你发现自己处于这种境地，该怎么办？有很多方法可以找到免费食物。


    ## 食物厨房


    无论你是陷入了困境用光了食物，还是食物短缺导致你所在地区供应不足，有时你可能没有办法获得食物。坦率地说，有很多地方可以去寻找免费食物。


    ## 食物银行


    几乎所有的社区都有某种形式的食物银行。你可以利用它们每月获取多多两次食物。当你陷入挣扎并需要一点帮助时，它们是极佳的食物来源。


    ## 211


    在美国的大多数地区，拨打211可以通过任何电话获得援助。你只需要告诉他们你想找什么，他们就会为你找到合适的资源。他们可以帮助你联系当地可以为你提供杂货的慈善机构。


    ## 当地教堂


    有时，你所在地区的教堂会组织食物或礼品卡捐赠来帮助有困难的家庭。虽然他们提供的可能不多，但他们可能也能指引你找到可以帮助的组织。


    ## 采集


    无论你生活在任何地方，你都可以采集食物，如可食用杂草、果实和蘑菇。即使在城市地区，你仍然可以找到一些选择。最好手里拿着一本指南，或者自己写一本日记，记录哪里可以找到可食用植物，因为你不想吃错植物。


    ## WIC 和 SNAP


    大多数人人都听过这些计划，它们对有需要的人来说是巨大的益处。除了注册这些服务外，务必询问哪些可以使用这些福利的计划。有时在某些商店或农贸市场，你通过福利所获得的商品比在普通杂货店更多。


    虽然使用这些服务很棒，但当你能找到一份工作并重新为自己和家庭提供生活保障时，感觉会更好。在大萧条时期，工作机会非常短缺，许多人不得不寻找独特的方式来赚钱。让我们看看这如何适用于今天的我们。


    ## 大萧条时期的赚钱技巧


    没有工作时


    每个人都知道储蓄账户以及为备不时之需留资金的重要性。然而，如果你必须过月光日（靠薪过日子），那么向储蓄中存钱或留钱可能会有点困难。有很多方法可以让你开始产生额外收入，并帮助存钱以重新振作。考虑五种给你的储蓄增加额外资金的方法。


    ## 额外资金储蓄


    你能做的最明显的事情是省下你任何额外资金的一半。这可能是工作奖金、生日礼物或任何你未预料到的付款。将这些金额的一半存入储蓄中。通常这些是你预算之外未预料的额外资金，所以存起来并不难。这看起来可能不多，但即使每次多存
    5 美元，到年底，你的储蓄也会积累成一大笔钱。


    ## 存下零钱


    开始用现金支付，当你晚上回家时，把硬币零钱放在罐子里。年底，你会惊讶于罐子里存了多少钱。根据你开的银行，如果你将零钱存入储蓄账户，可能还会获得一笔奖励。


    ## 未使用的礼品卡


    你家里可能散落着几张礼品卡，上面只有几美元。如果你有这些卡，你可以在大多数零售商处或通过商店里的礼品卡销售自助机兑换现金。


    ## 手机应用


    你的手机上有许多应用程序可以让你购买杂货和家居用品时省钱。这将为你提供额外的储蓄资金。某些应用程序还会对你使用其服务提供返现和奖金。


    ## 与你的银行交流


    如果你的工资是直接存款，大多数银行都允许你在每次工资存入时自动储蓄一部分金额。有些银行还会将记卡消费向上舍入并将差额存入你的储蓄。取决于你的购买次数和从工资中留出的金额，这很容易积累起来。最棒的是，由于你看不见这笔钱，你就不会产生花它的冲动，它会为你自动储蓄。


    如果这些方法都不适用于你，那么你仍然有获得额外资金的机会。也许最好的选择之一是出售家中的物品换现金。


    ## 出售物品换现金


    如果你需要获得额外资金，或者只是想增加储蓄，那么只需看你自己的家里了。很多人并没有意识到家里有多少物品是很有价值的。考虑一下你可以出售的常见家居物品：


    - 视频游戏

    - 书籍

    - 杂物

    - 手机

    - 工具

    - 服装（鞋子、腰带、包）

    - 收藏品和小摆件

    - 厨房电器和珠宝


    一旦你从家里收集齐了要出售的物品，你通常需要在网上出售它们。让我们考虑如何在线出售物品，以为你的物品争取最高价格。


