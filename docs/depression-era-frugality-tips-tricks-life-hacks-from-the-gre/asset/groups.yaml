    # Introduction to the Great Depression


    We are living in a time with uncertainty and a questionable future around every
    corner. In a way, we are repeating history. So we need to learn from those who
    lived through and survived previous generations. Our parents, grandparents, and
    in some cases, great grandparents survived a period known as the Great Depression.
    They did it by living frugally and learning to do things on their own. I''ve put
    together some of the lessons learned from my family so you can have a guide to
    help you survive during these challenging times. But first, let''s take a quick
    look at what the Great Depression was and what people did to live during those
    times.


    The Great Depression was a ten year period in American History from 1929 to 1939.
    It continues to remain one of the worst downturns in American history. In the
    preceding decade, there was a period of affluence for middle and working-class
    individuals. This previous provided people with more leisure time and started
    a consumer society. However, the economic depression of the Great Depression has
    a major impact on the daily life of families. Much the same as we see happening
    today on a smaller scale.


    At the height of the Great Depression, nearly a quarter of the US workforce was
    unemployed. Even those who were still employed had a reduction in hours and/or
    a cut in their wages. Even professionals such as doctors and lawyers see drops
    up to 40% in their income. The majority of the population was facing financial
    instability, if not complete ruin. As a result, many started living by the motto:
    “Use it up, wear it out, make it or do not without.” Many families discovered
    new ways to live a frugal life. They started gardens, patched clothes, and found
    cheaper forms of entertainment.


    Depression-era housewives learned to stretch food budgets with smart shopping,
    meal preparation, and using food scraps wisely. Pot luck became a way to share
    food and enjoy the social engagement. People started to spend more time at home
    and focused on entertainment in the forms of board games and radio.'
  - '[PAGE 8]


    Many of these hacks and solutions can still be used and applied today. After talking
    with my family and looking into what other families did during the Great Depression,
    I''ve come up with some of the best hacks, tips, and tricks to help you save money,
    time, and effort in all areas of your life. Let’s take a look at these and see
    what ones you can apply in your life to get through these new difficult times.'
  - '[PAGE 9]


