    - Plain lemon juice can be used to clean any stainless steel in the house.

    - A few teaspoons of lemon juice can be added to the wash cycle to help clean
    your laundry in place of laundry detergent.

    - There are also plenty of other frugal uses for lemon around the house.


    ## Borax


    Borax is a great all-around cleaner, disinfectant, and deodorizer. Borax can be
    used to remove stains on floors, walls, ceilings, and counters. You can also make
    it into a powerful paste that you can use to scrub, rinse, and wipe clean. Consider
    just a few uses for Borax around the house:


    - Borax is a great drain cleaner. It sanitizes the garbage disposal, eliminates
    pests, and gets rid of the decaying sink smell.

    - Borax is also a great toilet cleaner when mixed with water.

    - Use Borax to clean garbage cans to reduce odors in the home.

    - It is also a great carpet stain remover that also deodorizes. Mix with water
    and spray or apply to the stain.

    - A tablespoon of Borax added in the dishwasher will help remove water spots.

    - There are also ample other uses for Borax around the house to save money.


    ## Witch Hazel


    In addition to cleaning, this is a great item to have on hand because it can also
    offer great beauty benefits. Consider some of the ways it can be used in cleaning.


    - Baking soda and witch hazel can be combined for a great bathroom cleaner. You
    won''t have harmful chemicals, and you''ll have a clean bathroom.

    - Witch hazel is also a great floor cleaner; just mix a small amount with warm
    water.

    - Witch hazel is also a great glass cleaner in the home and your car as well.

    - There are also a number of beauty, and other household uses as well.


    ## Baking Soda


    Baking soda has long been used as an effective and natural cleaning agent. You
    can use water to make it into a paste to clean counters, tile, and floors. We''ll
    discuss the main uses for baking soda shortly.


    ## Vinegar


    While having a strong smell, vinegar is a great way to decrease. You can also
    use it to remove mildew in the bathroom and leaves no streaks on windows. Apply
    vinegar, allow it to sit, and then scrub to clean. It can also be used in the
    wash for mildew towels in order to get rid of the odor. We''ll discuss more vinegar
    and its cleaning properties soon.


    ## Cornstarch


    In addition to being a great depression-era addition to recipes, cornstarch is
    also a great cleaning agent. Consider just a few of the cleaning options available:


    - Cornstarch is a great carpet cleaner. Sprinkle it on stains and allow it to
    sit for twenty minutes. Scrub lightly with a brush and then vacuum.

    - It is also a great absorber for stains like salt, but will also help get rid
    of odors.


    ## Soap


    A great natural cleanser for the home is basic liquid soap. There are a few great
    options for this:


    - Add a tablespoon to warm mop water, and it can help with scrubbing sinks and
    tubs.

    - A tablespoon of soap with a gallon of warm water can make a great floor cleaner.

    - Liquid dish soap can also be used to wash laundry.


    ## Alcohol


    Isopropyl is a great cleaner around the home. It is also great for disinfecting
    surfaces. Use it to clean counters, sinks, tubs, and anywhere that germs are likely.


    Now let''s look closer at three of the most common household cleaning products
    and how they can save you money on cleaning your home: vinegar, baking soda, and
    borax.


    ## Cleaning with Vinegar


    Vinegar is one of the best cleaning agents you need to start using in your home.
    It is a power disinfectant that can be easily purchased in bulk for cheap. It
    has been shown that vinegar can kill E.coli, Salmonella, and Staphylococcus. It
    is also a natural and safer cleaner. Using vinegar to clean your home can save
    you hundreds a year on cleaning supplies. As you start using vinegar to clean
    the home, consider the following ways you can use vinegar to clean your home.


    - **Rid Your Pantry of Small Critters.** At some point, you are likely going to
    find critters in your pantry. If you''re trying to store up a depression-era pantry,
    this is something you don''t want to have happen. Pour one and half cups of apple
    cider vinegar in a cup with two drops of original Dawn. Leave uncovered in the
    pantry for about a week to attract bugs. To prevent infestation, toss anything
    destroyed and wash the shelves with Dawn.

    - **Floor Cleaning.** A 50/50 vinegar and water solution can be used to clean
    tile or linoleum floors. You won''t get the suds as you see with soap, but you
    will have clean and sanitized floors.

    - **Mirror Cleaning.** A mix of 1/4 cup vinegar to 3/4 cup rubbing alcohol can
    make a great cleaner for windows that leaves no streaks behind. Spray the mix
    on the mirror and wipe it with a lint-free cloth. It is a great way to disinfect
    mirrors in the bathroom.

    - **Odor Remover.** If you have smells in your home, you can remove them by setting
    a few bowls of vinegar in different places. The vinegar soaks up smells in a day
    or two. Add a few separate bowls with baking soda or your vinegar undil onto a
    rag and wave around the room to speed up the deodorizing process.

    - **Clean Computer Accessories.** A Q-tip dipped in vinegar is a great way to
    clean out all the nooks in your keyboard or monitor. Never spray it directly on
    electronics and make sure you don''t reach electrical components.

    - **Remove Ink.** Spray on full strength vinegar and wipe with a lint-free cloth.

    - **Clean Blinds.** A 50/50 vinegar and water solution can be used to clean blinds.
    You won''t get the suds as you see with soap, but you will have clean and sanitized
    blinds.

    - **Kitchen Degreaser.** At some point, the kitchen is going to need a thorough
    cleaning. Vinegar can make the toughest messes easier. Mix ¼ cup water with one
    cup vinegar and add to a bowl. Spray the surface and wipe with a lint-free cloth
    to remove grease.

    - **Carpet Shampoo.** A 50/50 mix of vinegar and water can be used to shampoo
    carpets. You won''t get the suds as you see with soap, but you will have clean
    and sanitized carpets.

    - **Mildew Prevention.** If you have mildew on your furniture, spray with full
    strength vinegar. Spray a light mist and wipe with a lint-free cloth.

    - **Leather Cleaner.** Mixing vinegar with water is a great leather cleaner. Spray
    a light mist and wipe off.

    - **Wood Scratch.** Apple cider vinegar mixed with equal parts can repair wood
    scratches. Spray on the surface and wipe off.

    - **Removed Melted Wax.** Equal parts vinegar and water can be used to remove
    melted wax. Start by wiping down.

    - **Toilet Cleaner and Disinfectant.** Put a half cup baking soda into the toilet
    bowl and clean with a toilet brush. Add one cup of vinegar. After the foaming
    action has stopped, flush to clean.

    - **Polish Features.** If your faucet or other bathroom fixtures look a little
    dull, spray on full strength vinegar and wipe clean.

    - **Unclog Drains.** Pour a half-cup baking soda down the drain and follow with
    one cup of vinegar. Allow it to sit until the foaming stops. Rinse the drain with
    a cup of hot water.

    - **Stainless Steel Cleaner.** You don''t need to buy special stainless cleaners
    as long as you have vinegar. Spray a light mist on the surface and wipe with a
    lint-free cloth.

    - **Oven and Microwave Cleaner.** At some point, the microwave is going to need
    a thorough cleaning. Vinegar can make the toughest messes easier. Mix ¼ cup water
    with one cup vinegar and add to a microwave-safe bowl. Microwave on high for two
    to three minutes to make the grime easier to remove.

    - **Refrigerator Cleaner.** A 50/50 mix of vinegar and water can be used to clean
    out your refrigerator. It removes dirt, disinfects, and prevents "growth" on food
    that may be kept in a little too long.

    - **Clean and Disinfect Cutting Boards.** Wooden cutting boards can be difficult
    to clean without vinegar. Sprinkle baking soda on the board and then lightly spray
    with full-strength vinegar.

