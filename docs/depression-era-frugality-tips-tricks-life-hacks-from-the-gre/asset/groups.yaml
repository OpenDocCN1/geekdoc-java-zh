    ## Cleaning Cloths vs. Paper Towels


    When it comes to wiping down surfaces and cleaning places around the house, you
    can choose from a variety of reusable options. You can purchase shop towels or
    use old sheets and blankets cut apart. No matter what type of cloth you use, you
    will reduce waste and upcycle items in your home to save money.


    With just a few minor adjustments, you can easily switch from using disposable
    paper products to reusable options. Doing this on a regular basis is going to
    save money on your monthly budget while helping the environment.


    ## Depression-era Healthcare and Beauty Hacks


    ![](img/5ce78655e630de1552f352fa8c4f5fd0_95_0.png)


    ## Depression-era Healthcare Hacks


    Modern science and medicine have done a lot for people, and it continues to make
    our lives better. However, during the Great Depression, our relatives often relied
    on ingenuity and thriftiness to keep themselves well. For non-emergency situations,
    consider trying the Great Depression health hacks.


    ### Bites


    For things like bug bites and bee stings, you can mix some baking soda water to
    make a paste. Apply the paste over the bite and allow it to sit. After dried,
    the baking soda flakes off, and you can apply more paste.


    ### Upset Stomach


    Comfrey tea can help ease a number of ailments, but it is typically used for upset
    stomachs. Steep some tea and enjoy a drink. You can buy the tea in stores or grow
    your own.


    ### Fever


    It may sound weird, but placing slices of fresh onion on the bottom of your feet
    can help with a fever. Slip tight-fitting socks over the onions and then gently
    massage to help your body absorb them quicker. If possible, replace every four
    to six hours and continue as long as you have a fever.


    ### Splinters


    If you find yourself with a splinter stuck in your skin, this trick is going to
    help remove it. Remove a piece of the thin, white membrane from the inside of
    a freshly cracked egg. Cover the splinter site with this membrane-like a band-aid
    overnight, and the splinter will come to the surface.


    ### Colds and Flu


    With the cold and flu season getting longer each year, it can be a good idea to
    have vapor rub on hand. Save money by making your own and having it available
    whenever you need it.


    Ingredients:


    - 20 drops Eucalyptus essential oil

    - 15 drops Peppermint essential oil

    - 4 tablespoons shea butter

    - 2 and ½ tablespoons coconut oil

    - 4-ounce mason jar with a lid or sealable glass container


    Directions:


    - Fill a small saucepan ½ full with water and place over medium/low heat.

    - Place the jar in the water without getting water into the jar.

    - Add shea butter to the jar.

    - Once melted, add the coconut oil and stir to combine.

    - Once both are melted, remove the jar from the saucepan.

    - Allow the mixture to cool to room temperature or about fifteen minutes.

    - Add the essential oils and stir again.

    - Allow to cool until solid, then seal with the lid.

    - Store in a cool, dry place, and it will be good for up to a year.


    ## Depression-era Beauty Hacks


    Women of the Depression-era were pioneers of the frugal living movement. Compromises
    were made to avoid spending money on luxuries such as makeup. As a result, many
    of the women of that era found beauty hacks with everyday items that they had
    on hand. You can find these tips helpful today to help you save money.


    - Wash and condition your hair with a tablespoon baking soda. Simply rub into
    wet hair and then rinse well. You can also condition your hair with a bit of raw
    egg yolk and rinse with cool water.

    - Keep your brows in place with a bit of olive oil or Vaseline, depending on your
    preference.

    - Hazel can help with under-eye puffness. Dab a bit under with a cotton ball and
    avoid getting it into your eyes. You can also use a bit of petroleum jelly each
    night for the same effect.

    - Exfoliate your skin with salt or sugar scrubs.

    - A bit of baking soda and coconut oil can make a cheap and effective toothpaste.


    These are just a couple of the general beauty tips you can learn from women of
    the depression-era. There are three main ingredients that have wide use in the
    health and beauty hacks from the Great Depression-era: Tea Tree Oil, Coconut Oil,
    and Witch Hazel. Having these on hands means you can do a lot for your health
    and beauty on a budget. Let''s look at what each can do.


    ## Uses for Tea Tree Oil


    Tea tree oil is simple and yet effective when it comes to treating ailments and
    making life better in a variety of ways. Consider the following areas where depression-era
    people learned to use tea tree oil.


    1. One drop of oil with a teaspoon of water makes a mouthwash. Rinse and spit
    well, avoid swallowing.

    2. Two tablespoons of tea tree oil added to bathwater can help with body aches.

    3. A few drops on a cotton ball and gently dabbed on blisters once a day will
    soothe them and help them go away.

    4. Add a few drops to a warm, damp washcloth and place on the chest for ten to
    fifteen minutes to help ease chest congestion.

    5. A drop of oil rubbed on dry and cracked lips will give instant relief to chapped
    lips.

    6. Apply a paste of cornstarch and tea tree oil to the chickenpox affected area
    to treat and dry the area.

    7. Add a few drops of tea tree oil into a vaporizer to get relief from the worst
    coughs.

    8. Adding seven to ten drops of tea tree oil to your shampoo will help stimulate
    the scalp and get rid of dandruff.

    9. Reduce the symptoms of an ear infection when you apply two drops of tea tree
    oil with one teaspoon of olive oil into the ear. Absorb the oil after two minutes
    using a dry swab.

    10. A dab of tea tree oil to flea bites can lessen the itch and increase healing.
    It also works well for other insect like mosquito bites.

    11. Tea tree oil can be used to clean hairbrushes and toothbrushes by soaking
    in a gallon of hot water and a few drops of tea tree oil. Soak, rinse, and repeat
    as needed.

    12. Tea tree oil on a cotton ball can be rubbed gently on acne affected areas.
    It will soothe the skin and lessen redness while promoting healing.

    13. Soaking your feet in hot water with a few teaspoons of tea tree oil will help
    reduce the athlete’s foot. Dry and repeat as needed.

    14. Massage tea tree oil into the scalp in order to reduce stress and promote
    hair growth.

    15. Applying a few drops of tea tree oil and olive oil together can soothe the
    skin after a shave.

    16. Any rough areas of skin can be softened by massaging tea tree oil once a day.

    17. Soaking your nails in few cups of warm water can eliminate fungus.


    As you can see, tea tree oil has many uses for health and beauty. Keep a bottle
    on hand.


    ## Uses for Coconut Oil


    Coconut oil has always been associated with nice products. It has health benefits
    as well as beauty uses. Consider the following ways depression-era women learned
    to use coconut oil.


    1. Coconut oil is an easy make-up remover. Place some on a cotton ball and brush
    gently around the eyes.

    2. Coconut oil is used by moms to keep bottoms from getting red and irritated.
    Use a little bit at each diaper change.

    3. Rubbing a few drops onto your belly and sides can prevent stretch marks.

    4. Coconut oil has natural SPF, and placing a few dabs on skin can be used as
    an emergency sunscreen if you don’t have any.

    5. A few drops on baby’s scalp can help get rid of cradle cap.

    6. Using coconut oil during a massage will make it more enjoyable.

    7. Combing a few drops of coconut oil into your hair will keep it frizz-free.

    8. Adding a few drops of coconut oil in your morning shake can improve your metabolism
    for the day.

    9. Coconut oil added to a body scrub will have it smell great and add moisturizing
    properties.

    10. Coconut oil can make your lips soft and moisturized. Apply some to chapped
    lips and see immediate results.

    11. Coconut oil can be used in first aid for burns and minor cuts, protecting
    the wound and helping it heal faster. Apply once a day until the burn is gone.

