    few dollars on them. If you have these, you may be able to cash them in at retailers
    or through gift card sales kiosks in most stores.'
  - '[PAGE 131]


    # Phone Apps


    There are plenty of apps available on your phone that allows you to save money
    on groceries and household items. This will give you extra money to save. Some
    of these apps will also give you rebates and bonuses for using their services.'
  - '[PAGE 132]


    # Talk to Your Bank


    If you have a direct deposit for your paycheck, most banks will allow you to auto-save
    a certain amount from each check when it is deposited. Some banks will also round
    up debit purchases and put the extra into your savings. This can add up easily,
    depending on how many purchases you make and the amount you have set aside from
    your paychecks. Best of all, since you don''t see the amount yourself, you won''t
    be tempted to spend it, and it will be automatically saved for you.


    If none of these options work for you, then you still have options open to you
    for getting extra money. Perhaps one of the best options is to sell items around
    your home for cash.'
  - '[PAGE 133]


    # # Selling Items for Cash


    If you need to get extra money or just want to build up your savings, then look
    no further than your own home. A lot of people aren''t aware of just how many
    items in their home are worth a lot of money. Consider the common household items
    that you can sell for cash.


    +   * Soda cans or other aluminum products can be taken to your local recycling
    center. The products are weighed, and you are given cash right away.

    * If you drink wine, then save your wine corks. You can sell them online for those
    who use them in craft projects. You may also be able to sell the empty wine bottles
    as if they are decorative or something a collector may be interested in having.

    * If you have real silver, then you can cash in it, no matter what condition.
    Go to a local jeweler who is buying silver, and after weighing it, they''ll give
    you cash for your silver.

    * Another option is jewelry that is made from gold. Again you can cash in it no
    what the condition. As with your silver, take it to a jeweler who can weigh it
    and make you an offer. This is a great way to get rid of any jewelry you don''t
    wear anymore.

    * If you had children and they''ve outgrown their clothes, you can sell these
    for cash. If you have gently used items and accessories, then most resale stores
    will give you cash for them.

    * The same also applies to your own clothing. Look for local consignment shops
    in your area and get rid of clothing you don''t wear anymore as long as it is
    in good shape. You should also go through your accessories since shoes, belts,
    and purses can be sold for cash as well.

    * Perhaps you have collectibles or knick-knacks that you don''t use or need. Collectors
    love to purchase these items, and you can often take them to local antique shops
    to see if there is any interest.'
  - '[PAGE 134]


    +   Just because a video game system is upgraded doesn’t mean there is no value
    in old video games. Gather up video games you don’t play anymore and take them
    to a buyback store or sell them online. People will often purchase video games
    for cash and may be interested in what you have to offer.


    +   Books are still popular with the right people. Sell any books you no longer
    plan to read on Amazon or other online auction sites. Collectors and avid readers
    are likely to purchase your books.


    +   Take the time to look through your closets and other storage areas. You''ll
    likely find a number of odds and ends that you didn’t know you still had. You
    can gather these items together and have a yard sale.


    +   Perhaps you''ll find old and broken cell phones hiding in these areas. Most
    don''t realize you can sell these for cash. There are plenty of people online
    that will pay cash for cell phones of all kinds.


    +   The best item that sells second hand at a great price is tools. This includes
    both power tools and hand tools. You can sell these online or in your local paper
    or online sale sites.


    +   Another great place to look is your kitchen. You''ll probably notice that
    there are a couple appliances you don’t use anymore. You’ll be able to sell most
    of these online at a great price while reducing clutter in your kitchen.


    +   Unused gift cards are a great source of cash. You can often sell them for
    about 75% of their value online. Or you can use the cards yourself.


    Once you have collected items from your home to sell, you’ll often need to head
    online to sell them. Let’s consider how you can sell stuff online to get the most
    money for your items.'
- md: '

    ## How to Sell Online


    After decluttering your home, you''ll likely have a number of excess items. While
    donating is a quick and easy way to get rid of these items, you can also sell
    some items to get some extra money. While this isn''t the most profitable option,
    it''s an easy option to get a little side money. Consider the following tips to
    help you have success when selling online.


    ## Sell Quality Items


    Think of the items you are trying to sell; or do you feel they hold value, or
    do you view them as junk? If you view them as junk, then most other people will,
    and you aren''t likely to get money for them. Never try to sell items that are
    broken, ripped, torn, or unusable; it is better to just recycle or throw away
    these items. The only exception is if it is an old item that has collectible value.


    ## Clean Things Up


    Before you look an item for sale, you should clean it up as best as you can. Remove
    any stains if possible and clean off visible dust and dirt. Clean items will always
    sell quicker and at higher prices than dirty items. Again the only exception is
    antique or vintage items that either have a natural patina or require special
    cleaning. Some of these are worth more with their natural patina if they aren''t
    cleaned.


    ## Detailed Photos


    When selling online, the photo is the main selling point. This means you needed
    detailed photos if you want your item to sell quickly for top dollar. Try to photograph
    items from every angle and then document any cosmetic issues with photos that
    are lit enough to see well. The better the listing photos, the more you are likely
    to get. Also, avoid using stock photos of items.


    ## Fair Prices


    When it comes to selling items online, one of the main reasons people aren''t
    successful is because they are pricing too close to retail. If people can purchase
    the same item, new, for just a few dollars more, then they aren''t going to want
    your used one. Rather prices should be set about 50 to 75 percent below retail
    depending on how often they are used and how well they hold up as a used item.


    ## Meet Locally If Needed


    If you are selling locally, then make sure you are willing to meet the buyer.
    You can always get more sales when you are willing to meet individuals. Just make
    sure you pick somewhere that is halfway, in public, and safe.


    ## Choose Where to Sell


    There are a Number of places online where you can sell items: eBay, OfferUp, LetGo,
    and Facebook Marketplace, to name a few. You can list your items in more than
    one place at a time, but if you do this, make sure you monitor your listing closely
    and remove an item from all locations the moment it sells.


    ## Detailed Descriptions


    Lastly, a key to selling items is to have a well-written item description. Rather
    than simply saying what the item is, you should be detailed about any issues it
    has, what you paid for it, and more relevant details. The more information you
    provide, the more people you will attract, and the faster you can sell an item.
    It is also important that you use proper grammar, so people aren''t confused by
    what you''re trying to say.


    ## Generating Side Income


    In addition to selling things online, another option for making money that was
    learned during the Great Depression is to have a side income. Our grandparents
    had to get creative when it came to finding ways to support a family. If you find
    yourself struggling to make ends today, then you''ll likely want to look for side
    jobs that will bring money based on your talents and availability. Many of the
    side jobs during the Great Depression can still be done today.


    ## Babysitting


    This classic job isn''t just for teenagers. In most states, you don''t need a
    license in order to babysit unless you are watching more than just a few kids.
    Check with your state to see how many unrelated kids under the age of 2 can be
    watched at a time. You''ll also want to see if there are any specific laws in
    your state. This is a great way to bring in extra cash, especially if you work
    from home or aren''t currently employed outside of the home.


    ## Mending Clothes


    This is a nearly forgotten talent since most of the world is used to throwing
    away old or worn items. If you can mend clothing, you could be making some decent
    side income. Most people don''t want to throw expensive items during hard times
    and will gladly pay to have them mended if it saves money on the cost of purchasing
    a replacement.


    ## Sell Items


    As we already covered, selling items you don''t need or want anymore can bring
    in money. You can sell online or hold a garage sale. You can also find free items
    in your area or at thrift stores; with a little cleaning and fixing, you can then
    sell the item for some side money.


    ## Write a Blog


    If you want to work from home and make a side income, then you can start writing
    a blog. You can even make a comfortable full-time income doing this. However,
    you will have to put in some work to make this happen. With blogging, the great
    option is that you can continue to make passive income once you get it started.


    ## Start a Business Online


    It is becoming easier to sell retail items and make a profit on sites like social
    media. With just a few clicks, you can start an online business with dropshipping
    as an option, so you don''t even need to have inventory on hand.


    ## Tutoring


    Do you have a degree in English, do you enjoy doing math, or can you play an instrument?
    In most states, no special training or license is needed in order to tutor kids
    in subjects. This can be a great side income for college students while they go
    to school or can be another great option for those who aren''t employed outside
    of the home.


    ## Housecleaning


    People are busy, and many people try to budget for a housekeeper to help reduce
    the chores they need to do. You can often make a couple hundred dollars a month
    with a few hours of cleaning. You can sometimes find regular work by cleaning
    apartment complexes after people move out or cleaning business offices. However,
    to do this, you will need to be bonded, licensed, and insured. This process doesn''t
    cost a lot and is fairly quickly.


    ## Sell Homemade Items


    Do you like crafting? If this is the case, have you considered selling these items?
    You can get good money to sit at home and do your favorite crafts and hobbies,
    what could be better? You can even personalize items for people to increase their
    chances of purchasing. The options for this side income are endless such as crafts,
    food, cakes, ice cream, soaps, etc.


    ## Complete Errands


    Sometimes people don’t have time to run errands. Other people are homebound and
    unable to get out of the house to run errands. When you run errands for others,
    you can make a little money on the side. You can also offer to deliver grocery
    food.


    ## Freelancing


    This is a great way of making money on the side. It won''t be as a blog, but it
    can be range of services such as writing, photography, etc. The best part is you
    can do most of these from home.


    ## Stock Investments


    Another great way to make some money is to invest in stocks. However, make sure
    you choose the right time to cash out.


    ## Start a Business


    While this may not seem like a depression, it can be a source of income. Just
    remember this option takes a lot of commitment.


    ## Depression-era Budgeting Ideas


    In addition to making extra money or learning to get creative with ways to support
    your family, it is also a good idea to maintain a budget. Having a budget will
    allow you to set money aside in case you need it while also ensuring your needs
    get met.


    ## How to Develop a Successful Budget


    Budgeting can be a great way to manage money, but for some, it is a difficult
    thing. It can be difficult to start since people feel it takes too time, or they’re
    not sure how to do it. Consider the following tips to help you get started on
    your way to creating a successful budget.


    ## Keep It Simple


    There are a number of electronic apps and websites that can provide you the tools
    needed to understand your budget and see what’s going in out of your bank account.
    If you have a simple budget, you’ll find the process is a lot easier. This is
    especially true if it is available on your computer.


    ## Use Broad Categories


    When setting up a budget, remember you don’t have to micromanage everything. Rather
    you can use broad categories for your most frequent expenses. For example, food,
    mortgage/rent, utilities, automobile, entertainment, savings, etc. When you are
    less specific, you are able to simplify things and make it easier to stick with
    your budget.


    ## Ensure You Can Stick with It


    If you make your budget planning overly complicated, you’re less likely to stick
    with your budget. So when starting your budget, make sure you are honest with
    yourself. If you don’t feel you can stick with a portion of your budget, think
    of a different solution.


    ## Finish the Boring Stuff First


    When creating a budget, you first need to know where your money is going. To do
    this, don’t actively budget for a month or two. Just watch where your money is
    going and make notes; be completely honest with yourself. At the end of the month,
    you can look through your notes.

    '
