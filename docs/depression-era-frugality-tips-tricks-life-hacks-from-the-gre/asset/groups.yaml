    \ to the Great Depression\n\nWe are living in a time with uncertainty and a questionable\
    \ future around every corner. In a way, we are repeating history. So we need to\
    \ learn from those who lived through previous generations. Our parents and grandparents\
    \ survived a period known as the Great Depression. They did it by living frugally\
    \ and learning to do things on their own. I've put together some of the lessons\
    \ learned from my family so you can have a guide to help you survive during challenging\
    \ times.\n\nThe Great Depression was a ten-year period in American history from\
    \ 1929 to 1939. It continues to remain one of the worst downturns in American\
    \ history. At the height of the Great Depression, nearly a quarter of the US workforce\
    \ was unemployed. Even those who were still employed had a reduction in their\
    \ wages. As a result, many started living by the motto: “Use it up, wear it out,\
    \ make it or do not.” Depression-era housewives learned to stretch food budgets\
    \ with smart shopping, meal preparation, and using food wisely. \n\nI've come\
    \ up with some of the best hacks and tricks to help you save money and effort\
    \ in all areas of life. But first, let's take a quick look at what the Great Depression\
    \ was and what people did during those times.\n\n# Depression-era Life Hacks for\
    \ Food\n\nThe first thing we are going to look at is how you can apply these hacks\
    \ to help you get the most out of items in home and how to save time and money.\
    \ Let's start by looking at some food hacks that will help you stretch your budget.\n\
    \n# Save Money on Pantry Goods\n\nThe first area where you can use depression-era\
    \ hacks is to stretch your food budget. You can do this by saving money when you\
    \ shop, grow a garden, meal plan, and stock up your pantry. When it comes to stretching\
    \ a food budget, most people think they have to cut out healthy foods. This isn't\
    \ the case; there are a few healthy foods you can purchase for less than a dollar\
    \ that provide food for a week or more. Let's look at some of the top healthy\
    \ foods you can purchase for cheap.\n\n# Black Beans\n\nBlack beans are high in\
    \ fiber, calcium, and folic acid. By purchasing them dry and boiling them you\
    \ will preserve a lot of antioxidants. Cooking them is easy, and you can use them\
    \ to make soup. You'll often be able to buy the dry beans for less than 30 cents\
    \ a pound.\n\n# Eggs\n\nThese are one of the most versatile healthy foods for\
    \ less than a dollar. There are a variety of ways you can use them. They are a\
    \ simple breakfast that gives you protein to get your day started. You can also\
    \ use them to make vegetable frittatas that can be stored for a few days in the\
    \ refrigerator. Eggs are also an item you can get on your own if you raise chickens.\n\
    \n# Almonds\n\nThis is a great healthy snack for those on the go. You can often\
    \ get almonds for about 60 cents a serving of 20 to 25 almonds.\n\n# Garbanzo\
    \ Beans\n\nHigh in fiber, these are a great addition to salads or can be used\
    \ to make your own hummus cheaper than the store-bought option. You can often\
    \ get about a half cup for about 30 cents or in a can for about a dollar.\n\n\
    # Oats\n\nThese are very affordable, often about one dollar a pound. Homemade\
    \ oatmeal is a great cheap breakfast option and can even be used in place of flour\
    \ to make cookies.\n\n# Pinto Beans\n\nRefried beans are cheap and easy to make\
    \ on your own and provide more health benefits when you do so. At about 25 cents\
    \ a half-cup, they add fiber and protein to your diet.\n\n# Rice\n\nThis has long\
    \ been a frugal pantry staple. This is especially true if you cook it from scratch.\
    \ You'll have a range of options to choose from, and most are under a dollar a\
    \ pound. Rice can be used as a base for dinner, in soups, or as its own side dish.\
    \ You can cook it in bulk and use it in meals throughout the week.\n\n# Lentils\n\
    \nThis is another option, similar to beans. You can get them for less than a dollar\
    \ a pound. However, these don't require soaking like beans, so they can be prepared\
    \ in less time. They can be used in soup or make an excellent side dish.\n\n#\
    \ Chicken\n\nDepending on the part of the chicken, this can be a little more expensive\
    \ than other healthy foods. However, if you want to include meat in your diet,\
    \ this can be the cheapest option. You can keep chicken in the freezer for up\
    \ to six months, and it can be used in a wide variety of recipes. You can even\
    \ use chicken bones to make broth for use in other recipes.\n"
