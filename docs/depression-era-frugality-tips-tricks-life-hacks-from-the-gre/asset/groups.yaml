    With so many benefits, it is easy to see why many used coconut oil on a daily
    basis. You can find it at most stores for an affordable price.


    ## Uses for Witch Hazel


    Witch hazel is a product that has a great many benefits. It has long been a frugal,
    all-natural folk remedy that became popular during the Great Depression. Consider
    the following uses for witch hazel and make up a tincture and tea to use around
    your house.


    - 1. Makeup Remover

    - 2. Hemorrhoid Relief

    - 3. Cleaning Wounds

    - 4. Reducing Swelling and Inflammation

    - 5. Treating Acne and Cleaning Oily Skin

    - 6. Reduce Varicose Veins

    - 7. Eliminate Puffiness Under Eyes

    - 8. Stop Itchiness

    - 9. Dry Poison Ivy

    - 10. Refine Pores

    - 11. Astringent and Skin Refresher

