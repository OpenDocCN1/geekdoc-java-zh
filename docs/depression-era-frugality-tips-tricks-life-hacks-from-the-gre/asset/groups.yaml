    在感到抑郁时，不要跳餐是非常重要的。稳定的血糖水平有助于你维持稳定的情绪。低血糖通常伴随着抑郁感，即使你没有临床抑郁症也是如此。


    ### 饮食均衡


    摄入可以增加大脑中血清素水平的食物以减轻抑郁症状同样重要。根据研究，这应该是高蛋白饮食，并富含 omega-3 脂肪酸的食物，如三文鱼、沙丁鱼、鲱鱼和鲭鱼。你还应该关注含有健康脂肪的食物和油，如椰子油、亚籽油、鸡蛋和牛油果。


    ### 水足


    如果你水分不足，身体就会变得疲劳。疲劳会模拟抑郁的症状。因此，确保喝足够的水是非常重要的。你可以做几件事来帮助增加水分摄入。也许你需要一个可以保持24小时水冷的瓶，或者可能你需要一个可以测量全天饮水量的瓶。无论你需要做什么，只需确保你整天保持充足的水分。


    ### 享受绿茶


    抑郁和咖啡因并不是好的组合，因为会导致情绪短暂高涨，然后是崩溃。然而，绿茶中的咖啡因与茶氨酸一起作用，防止咖啡因崩溃，同时略微提升你的情绪。它还会提高多巴胺水平，帮助你感觉更好。


