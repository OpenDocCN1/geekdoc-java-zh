    or something similar. This will also assist with drainage.


    +   - Ensure the containers you use have proper drainage. Holes in the pots, along
    with a layer of rock or other material, will help enable drainage.


    +   - Don''t use garden soil, rather use potting soil for best results in a container
    garden.


    +   - Make sure you repot your plants as they outgrow a planter and, if possible,
