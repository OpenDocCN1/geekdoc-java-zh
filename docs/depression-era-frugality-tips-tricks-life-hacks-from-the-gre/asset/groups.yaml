    - 17. Soothe Sunburn

    - 18. Prevent Razor Burn

    - 19. Remove Bug Bite Irritation

    - 20. Reduce Psoriasis and Eczema

    - 21. Disinfectant and Sanitizer


    ## Depression-era Lifehacks for Having Fun


    There are plenty of ways to become frugal in your life and save money. However,
    this doesn’t mean you can’t have fun while saving money. Even during the Great
    Depression, families found ways to have fun and enjoy life. Let’s consider how
    you can do things for free and how you can still enjoy the holiday while on a
    budget.


    ## Free Things to Do


    One thing families were great at doing during the Great Depression was finding
    ways to have fun while spending little to no money. There are plenty of options.
    First, consider things you can do within your own home to have fun.


    - 1. Play a board game

    - 2. Read a book

    - 3. Listen to a podcast or audiobook

    - 4. Do a puzzle

    - 5. Start a free online learning course

    - 6. Watch YouTube videos

    - 7. Cook your meals or bake

    - 8. Organize or clean a room

    - 9. Watch a movie

    - 10. Take up a craft

    - 11. Start a workout routine

    - 12. Look online for free items

    - 13. Have a spa day

    - 14. Take a nap

    - 15. Write a book or blog

    - 16. Start a journal

    - 17. Put together a scrapbook


    If none of these sounds appealing or if you simply are tired of staying around
    the house, then consider some free things you can do that gets you outside.


    - 1. Go for a picnic

    - 2. Take a jog

    - 3. Go to the beach

    - 4. Go fishing

    - 5. Go camping

    - 6. Take a bike ride

    - 7. Fly a kite

    - 8. Tour your city

    - 9. Take a hike

    - 10. Go swimming

    - 11. Visit an open house

    - 12. Take a free class at the community college

    - 13. Go to a free concert

    - 14. Go to the library

    - 15. Make your own scavenger hunt

    - 16. Take a drive in your car

    - 17. Play sport


    ## Holidays on a Budget


    Another area that is often important for families is being able to celebrate the
    holidays. Just because you are being frugal and living on a budget doesn''t mean
    you can''t still have a memorable holiday experience. Consider how you can enjoy
    the three main holidays of Thanksgiving, Christmas, and New Year’s on a budget.


    ### Thanksgiving


    Depending on the size of your family, Thanksgiving dinner may or may not be an
    easy thing to host frugally. However, no matter what size of dinner you are planning,
    there are ways to host a memorable and frugal dinner. Let''s look at how you can
    do this.


    Planning ahead and having a budget is the best way to have a frugal dinner. This
    also gives you time to look for the best deals and sales on things you need.


    Purchase vegetables at a farmer’s market. Often the prices of vegetables are going
    to be less at a farmer’s market. Thanksgiving dinners often have a lot of vegetable-based
    side dishes. When you save money on vegetables, you’ll find it takes a lot out
    of your budget. If you don''t have a farmer’s market in your area, then look for
    sales at the grocery stores. If you can''t find a fresh vegetable for cheap, you
    can price frozen vegetables.


    While a store-bought dessert may seem convenient, especially when you already
    have a lot of cooking to do, it can be costly. If you have the time, make your
    desserts ahead of time to save money. Not only will you save money, but homemade
    desserts also taste better.


    Have family and friends bring side dishes as a potluck. This will save you money
    as well as preparation and cooking time. It also allows people to bring a special
    dish, and everyone gets to share something unique.


    Avoid buying too much turkey by buying just enough to satisfy everyone’s needs
    with just a small amount of leftovers. Turkeys are often the most expensive item
    of Thanksgiving, and buying the right amount can save money. If you do too much,
    then make the most out of your leftovers and don’t waste food.


    Around Thanksgiving time, you’ll often find local coupons and sales. Keep an eye
    out for these deals and buy whatever you can in advance such as sparkling cider,
    boxed stuffing, and crescent rolls.


    Consider what you have at home first. You''ll often find a lot of what you need
    at home. If there are decor items missing, make a list, and stick to it. Head
    to the Dollar Store first, where you''re likely to find great savings on all the
    decor you need.


    ### Christmas


    Christmas is both a high cost but also a stressful holiday. You’re expected to
    get gifts, prepare dinner, and entertain the family. In addition, it is just after
    you’ve spent money on Thanksgiving and are trying to save money for New Year’s.
    Let’s consider how you can save on Christmas just like people during the Great
    Depression.


    The best way to start any holiday planning is with a budget. Once you have a budget,
    outline what you need to buy and use what you have at home. Make sure you stick
    within the budget. Once you go over budget, it will be difficult to get back on
    target.


    After you have a budget in mind, then you can start putting together a menu of
    what you’ll serve at Christmas dinner. This way, you can have a shopping list
    in advance. Buy anything you can in advance when it is on sale and save it. Also,
    be sure to check your pantry first and see if you already have some of the items
    you need.


    Rather than trying new or elaborate dishes for the holiday, stick with the basic
    dishes you know your family likes. This saves both money and time while reducing
    the risk of leftover food waste.


    Family should be what matters during the holidays, and you shouldn’t feel the
    need to impress anyone. So don’t spend a lot of time and money on fancy things
    like invites and decor. Rather keep things simple and basic.


    Just because you are hosting a family dinner doesn’t mean you need to pay for
    it all on your own. If you have a family member that makes a great dish, ask them
    to provide it. You can even do a potluck dinner so everyone can help out with
    the dinner.


    Christmas decor is often one area where people spend a lot of money, especially
    if they like to decorate. Consider saving money by making your own decor or set
    a strict budget for your decorating. Plus, save as many decorations as you can
    for the next year.


    Another area where a lot of money is spent on gifts. Focus on buying just one
    or two gifts per person. This will both save you, but also remind you that the
    true meaning of Christmas is spending time with family and not gifting. If you
    have a larger family, then you may want to consider drawing names and having each
    person focus on just one person.


    Depending on your party style, you may or not need help in planning frugal New
    Year Party. For some, it is just a normal night, but for others, it is time for
    a big party. If you want to party on New Year’s Eve, then consider the following
    tips to help you have a frugal one.


    While having no alcohol would certainly save your budget, this may not be a fun
    idea for some. Another option is to choose one type of drink and then find something
    that isn’t too expensive or look for wholesale clubs that may have sales on occasions.


    For most parties, you won’t need to provide more than finger foods and small cocktail
    treats. You can also plan your party for after dinner. This means most people
    will be full and not interested in food. If you do want to have more food options,
    consider making it a potluck and having everyone bring something.


    Keeping the number of people invited small can reduce costs and have a more relaxed
    atmosphere. You can also invite people digitally to save money on invites.


    If possible, use leftover decor and staples from the previous holidays. Keep fireworks
    from July 4th for New Year’s Eve and reuse things like Christmas

