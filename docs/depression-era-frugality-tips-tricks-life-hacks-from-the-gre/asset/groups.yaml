    # How People Can Cope Today


    When economic troubles arise and people start living frugally, one thing that
    can develop is known as frugal fatigue. You can begin to get worn down when you
    sacrifice for too long, live under restrictive budgets, and try to avoid spending
    money. In some cases, this is reflected by the harmless activity of spending more
    to make up for denying yourself. However, it can also lead to serious health issues
    like depression. So it is important that we take the time to look at how you can
    overcome these feelings.


    # Focus on What You Have


    Take a good look at what you already have in your life. Oftentimes, the feeling
    of fatigue simply comes from wanting something while you have something that fills
    that gap just fine. Before you start feeling like you''re denying yourself, consider
    some of the following things you probably already have in your life:


    +   * Good Food

    * Home Comforts

    * Family

    * Friends

    * Health

    * A Home

    * Books

    * Parks

    * Occasional Treats


    When you take the time to consider what you already have, you may find out you
    have more than you thought. Take the time to focus your energy on'
  - '[PAGE 149]


    being grateful for what you have rather than looking for something you don’t have.


    # Small Splurges


    Another great way to avoid fatigue is to have small splurges planned. Each month
    put some money aside for a “splurge fund.” This means you can do something fun
    once a month or keep saving up the money for a bigger splurge. Rather than waiting
    until you’re burned out and making a big splurge, you should focus on a few small
    splurges when they have the least impact on your budget. This can help you feel
    like you are enjoying life without ruining your financially frugal lifestyle.
    Consider a few small splurges you can make:


    +   - Enjoy an ice cream


    +   - Buy a new book


    +   - Go to a movie


    +   - Buy a piece of sports equipment


    +   - Get a new video game


    There is any number of small splurges you can make, and with so many coupons services
    today, you can probably even save money on your splurge to help you stay safely
    within your budget. When you take this time for yourself, you’ll be less likely
    to give up your frugal habits.


    # Use Discounts


    You can also find ways to enjoy life and avoid fatigue by finding discounted activities.
    You can find discount passes to amusement parks or join deal sites to give you
    daily access to great deals.


    There are likely great deals around town. Some cities have summer concerts in
    the park, and you can always use the library to check out books and movies. Plus,
    you can always get out for a hike, camping, or biking. There may also be free
    museum days and free days for kids to eat at local'
- md: '

    restaurants. All of these options can help you have a frugal budget while still
    having fun.


    ## The Difference Between Frugal and Cheap


    This topic has been debated, but it is actually pretty simple. You just need to
    ask yourself two questions.


    First, is the less expensive choice worth the extra time and money? If you are
    getting an item for cheaper, but you need to drive across town and spend more
    money on gas and time, then it may not be a frugal choice. It is just being cheap.


    Second, what is the quality of the less expensive item? If a less expensive item
    is so cheap that it doesn’t have value and can actually have a negative impact
    on your happiness, then you should avoid it.


    ## The Benefits of a Frugal Lifestyle


    There are a lot of benefits you can enjoy from living a frugal life. Consider
    just a few to help you see that living a frugal lifestyle is actually worth the
    time and effort you put into it.


    - A sense of satisfaction from achieving your goals.

    - Getting the best value when spending your hard-earned money.

    - Enjoying the things you already own.

    - Learning new skills.

    - Helping to preserve the natural environment.

    - Learning creative problem-solving skills.


    ## Remember it is a Choice


    You may face pressure from people who want you to live a certain way or spend
    your money on specific things. While it may not always be easy to take the frugal
    route, if you are confident in your choice to live frugally, then it can be easier.


    Keep in mind that living frugally doesn’t mean you need to pressure others to
    do the same. At the same time, you want your family and friends to respect your
    own financial choices. In some ways, frugal living can be viewed as deprivation,
    leading to a feeling of resentment. You can also choose to view frugal living
    as a happy choice. The decision is entirely up to you.


    ## It Isn’t All or Nothing


    Frugal living is about finding a balance between three things:


    1. High quality - high price versus low quality - low price

    2. Needs versus wants

    3. Consumerism versus minimalism


    However, you don’t have to live in the balance between each of these. It is okay
    to sometimes be on the cheap side of things while other times, it is okay to splurge
    on something extra expensive. The goal is to see yourself continually moving in
    a frugal living direction.


    ## Spending Errors to Avoid


    No one is expected to always make the frugal choice when it comes to spending.
    Sometimes you just need to give in to your wants, or you are in a hurry and need
    to make a quick decision that may not be the best. It is okay that this happens
    as long as you continue to meet your savings goals and don''t go into debt. Keep
    in mind you''re not looking for perfection; you''re just looking for a frugal
    trend. There are five things you need to do to avoid making spending errors.


    If you''re reading this book, you probably already have a desire or need to live
    a frugal life. However, it isn''t easy or quick to switch to this focus. When
    you are first starting to live frugally, you''ll find nearly every deal there
    is; but there are still a few traps that you fall into that can ruin your chances
    of successfully living frugally.


    ### Buying the Wrong Items in Bulk


    This is the most common trap. You see something in bulk and look at the cost.
    You quickly calculate the per-item cost, and you think it is a great savings,
    so you buy it. Then a few months later, you find you still have the majority left;
    but no desire to use it or it has expired. Anyone who has ever shopped at Costco
    knows this. So make sure you follow the tips you already mentioned when you shop
    in bulk.


    ### Losing Track of Free Trials


    Nearly everyone has signed up for a free trial at one time or another. You have
    likely also forgotten to cancel at the end of the trial period. If you''re fortunate,
    you only end up paying for an extra month of something that you didn''t use past
    the first week. Avoid this by simply setting a reminder for yourself to cancel
    any free subscriptions you signed up for.


    ### Forgetting After-Purchase Rebates


    After-purchase rebates can be a great source of saving money, but they require
    a little work. However, for most people, once they get an item home, they never
    take the time to mail-in rebate forms. Perhaps sometimes the rebate is for a reward
    other than money, and it could even be a reward you don''t want. The main thing
    is that you should focus on buying products that have in-store rebates, so you
    get all of your savings upfront.


    ### Always Read the Fine Print


    Whenever you find a deal or coupon, make sure you read the fine print. Otherwise,
    you may find out you aren''t getting that good of a deal, or perhaps you''ll end
    up paying full price since you don''t want to hassle with the hoops you have to
    jump through for the deal.


    ### Lower Quality for Cheaper Prices


    As we''ve already discussed, make sure you don''t confuse being frugal with being
    cheap. There is a big difference between these two. You need to find the balance
    between the time and effort you put into finding a deal and the actual price you
    are paying for something. You should also make sure you aren''t sacrificing quality
    in order to save some money; this is especially true if it isn''t something you
    need right away.


    Now that we''ve talked about frugal fatigue is and how to avoid it. Let''s also
    look at some ways that you can get over depression without taking medications.


    ## Ways to Boost Your Mood without Medication


    ### Do Something New


    Science has proven when you try new things, it changes your level of dopamine.
    This is a chemical in the brain that impacts pleasure and enjoyment. So what new
    stuff should you try? It is really simple; just take a new route to work, go for
    a different lunch, watch a video about a hobby and try it out, wear something
    you haven''t in a while or find new free events in your neighborhood. There are
    a lot of options.


    ### Get Outside


    Sunlight is known to boost mood and Vitamin D levels to help depression. If you
    live in a place without a lot of sun, consider buying a lightbox.


    ### Be Grateful


    Studies have shown that a daily ritual involving gratitude can have the same effect
    as chemical antidepressants. This can be accomplished by doing something as simple
    as writing down the things you are thankful for or mentally focusing on what you
    already have. Remember, in order for this to be successful, you need to have it
    as a regular practice and not something that randomly do once in a while. Set
    an alarm on your phone or use other reminders to do it each day.


    ### Be Social


    When you feel depressed, the first notion is to isolate yourself from others.
    However, it is important to avoid this desire and rather try to be as social as
    possible. When you spend time with others, it can be a big defense against depression.
    If you can''t go out and be social, then you can join online support groups or
    call someone on the phone.


    ### Eat Regularly


    It is important you don''t skip meals when feeling depressed. Stable blood sugar
    levels help you to maintain a stable mood. Low blood sugar often comes with feelings
    of depression, even if you don''t have clinical depression.


    ### Eat Right


    It is also important that you eat food that can increase serotonin levels in your
    brain in order to decrease the symptoms of depression. According to studies, this
    should be a high protein diet with foods that are rich in omega-3 fatty acids
    such as salmon, sardines, herring, mackerel, and anchovies. You should also focus
    on foods and oil with healthy fats such as coconut oil, flaxseed oil, eggs, and
    avocados.


    ### Stay Hydrated


    If you aren''t well hydrated, then your body will become fatigued. Fatigue can
    mimic the symptoms of depression. Therefore, it is important to make sure you
    are drinking enough water. There are several things you can do to help you increase
    your water intake. Perhaps you need a bottle that keeps water cold for 24 hours,
    or maybe you need a bottle that measures how much you are drinking throughout
    the day. No matter what you need to do, just make sure you are staying well hydrated
    throughout the day.


    ### Enjoy Green Tea


    Depression and caffeine aren''t a good mix since it leads to a high, followed
