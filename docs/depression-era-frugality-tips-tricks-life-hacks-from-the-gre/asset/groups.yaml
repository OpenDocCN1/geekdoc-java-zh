    ## Yogurt


    If you want to add calcium and protein to your diet, then yogurt is a great choice.
    A cup of yogurt will cost about 75 cents to a dollar. You can also save money
    by making your own yogurt.


    ## Whole Grain Pasta


    There are a number of dishes you can make with pasta, and whole-grain pasta makes
    it healthier. Whole grain pasta comes with a higher nutritional value than regular
    pasta without costing you a whole more.


    ## Popcorn


    This is another great healthy snacking option. Plain popcorn can be around a dollar
    a pound. To keep it healthy, make sure you don''t serve it with a lot of salt
    and butter.


    ## Grapes


    This is another fun and affordable snack, especially if you have kids. You can
    even freeze grapes for a great summertime snack. They are also high in antioxidants.


    ## Bananas


    At about 50 cents a pound, you can do a lot with bananas. You can eat them as
    a snack, add them to breakfast cereal, make banana bread, use them to bulk up
    smoothies, and more.


    ## Kiwi


    As long as you buy kiwi when they are in season or on sale, then you can get them
    for about 35 cents apiece. These fruits are high in fiber and Vitamin C. They
    can be eaten plain or added to smoothies and fruit salads.


    ## Watermelon


    This is an excellent summertime fruit that is rich in antioxidants. You can eat
    it plain or use it to make things like juice and popsicles. When you purchase
    them on sale, you can save a lot of money.


    ## Oranges


    At about a dollar a pound, oranges can be a cheaper alternative than orange juice
    each morning. They also give you a high amount of antioxidants and Vitamin C.


    ## Sweet Potatoes


    At about a dollar a pound, these have lots of Vitamin A and are a great alternative
    to the potato. You can use them to make fries, sweet potato pie, and more. You
    can truly create a wide range of dishes with these.


    ## Kale


    Kale chips are a great alternative to traditional chips and are about 50 cents
    a cup. Kale can also be added to smoothies for extra Vitamin A, C, and K in your
    diet.


    ## Broccoli


    Nearly any pasta dish can have broccoli added, or it can be eaten as a side dish.
    Broccoli can even be used as a main course and is about 50 cents a serving.


    ## Beets


    At about 90 cents a pound, these are one of the more affordable options. They
    can be roasted, added to smoothies, or used as a main dish in salads.


    ## Spinach


    This is a great addition to salads and smoothies. At about 50 cents per cup, you
    can use these in a variety of dishes for a healthy addition.


    ## Carrots


    These can be a healthy snack option or can be added as a staple to soups and salads.
    There are also several recipes to use carrots for side dishes.


    ## Milk


    Milk has often been raised in cost at times, but when it comes to per-ounce cost,
    it is still cheaper than juice. A cup of milk will cost less than 20 cents. Avoid
    buying the more expensive juice and eat fresh fruit instead while drinking milk
    with your breakfast.


    ## Water


    Tap water is one of the cheapest drinks available. Try to avoid flavored drinks
    and switch to water. It''ll be cheaper on your food budget and healthier. Depending
    on where you live, it may be a good idea to invest in a filter to have safer drinking
    water.


    These are just a few of the general tips to help stretch your food budget. There
    are some specific things you can do to save on the main staples, such as meat,
    dairy, seafood, coffee, and produce. Let''s look at how you can save money on
    each of these.


    ## Save Money on Meat


    Often one of the largest expenses when it comes to food is meat. There are rarely
    coupons for meat, and the prices are often variable. There are several things
    you can do to save money on your next meat purchase.


    The main thing is to remember that you can go without meat every once in a while.
    This may not seem like a way to save on meat, but it is a practical solution if
    you need to make a cut in your overall food budget. There are plenty of other
    dishes you can eat for cheap which you save up for your next grocery run when
    there might be cheaper options.


    When you look in the meat section, check for peel-off stickers on the meats. These
    are often great money-saving coupons that can help you get instant money off your
    meat purchase. You often won''t find coupons in the circular unless it is around
    the holiday time. Similarly, you should check the quick sale and manager''s special
    area of the meat department. This is often because they are close to expiring,
    and you can easily save a lot of money. Either make a meal that day or just freeze
    it until you plan your next meals.


    It can also be a good idea to try alternative cuts of meat you wouldn’t normally
    get. For example, ground turkey may be cheaper than ground beef. Often when used
    in a recipe, you won''t even notice the difference. Another option can be to make
    your own ground beef. If you ground chuck on sale, you can buy it in bulk and
    grind it with a mixer attachment or ask the meat counter to do it for you. You''ll
    save a lot of money this way.


    It also pays to buy in bulk if you can. This means frozen meats, especially when
    it comes to chicken. Avoid purchasing frozen meats that contain sodium fillers.
    If you are going to purchase fresh meats, go for the bigger packages and then
    divide and freeze yourself. For example, you can buy a whole chicken to make several
    meals out of and then use the bones for making broth or soups.


    ## Save Money on Dairy


