    ## Depression-era Recipes


    Just to give you an example of what a depression-era recipe is, take a look at
    a few examples. You can find an endless number of depression-era recipes online
    that will help you get the most out of your food and turn one meal into many saving
    you a lot of money on your groceries.


    ## Milk Toast


    Ingredients:


    - 4 toast slices

    - 4 butter pats

    - 1 tsp sugar and cinnamon

    - ½ cup milk


    Directions:


    - 1. On low, heat the milk.

    - 2. Butter the toast and sprinkle with sugar/c mix.

    - 3. Tear into bite-sized pieces and place into two bowls.

    - 4. Pour warm milk over the toast pieces.


    ## Depression Bread


    Ingredients:


    - 5 lb. all-purpose flour

    - 5 tbsp yeast

    - 6 tsp salt

    - 6 cups warm water


    Directions:


    - 1. Place flour in a large bowl.

    - 2. Make a well in the center.

    - 3. Add yeast to the well and enough water to dissolve the yeast.

    - 4. Once the yeast is dissolved, start adding more water and mixing in the flour
    until a dough forms.

    - 5. Knead the dough in the bowl a bit.

    - 6. Allow the dough to rise in a warm place with a towel loosely over the top.

    - 7. Once the dough has risen to double in size, punch down the dough and divide
    it into seven loaves.

    - 8. Shape the loaves and place in loaf pans.

    - 9. Allow the dough to rise for sixty minutes or until doubled in size.

    - 10. Make slits in the top of the dough.

    - 11. Bake at 350 degrees Fahrenheit until brown on top or about 25 minutes based
    on the oven.


    ## Creamed Chipped Beef on Toast


    Ingredients:


    - 2 tbsp butter

    - 2 tbsp all-purpose flour

    - 1 ½ cups warm milk

    - 1 8 oz jar dried beef

    - 1 pinch cayenne pepper or another seasoning


    Directions:


    - 1. Over low heat, melt butter in a medium saucepan.

    - 2. Whisk in the flour all at once to form a roux.

    - 3. Whisk in the milk a little bit at a time while increasing the heat to medium-high.

    - 4. Cook while stirring until thickened.

    - 5. Bring to a boil, stir in the beef and seasoning.

    - 6. Heat through and serve over toast.


    ## White Bean and Ham Soup


    Ingredients:


    - 1 lb. white navy beans

    - 2 chopped onions

    - 2 cups chopped ham or something similar

    - Water to cover

    - Salt and pepper or another seasoning to taste


    Directions:


    - 1. Soak the beans overnight or using the quick soak method.

    - 2. Using a large stockpot, combine beans, onion, and ham.

    - 3. Cover with water by one and a half-inch.

    - 4. Bring to a boil, then reduce the heat to a simmer. Cover partially and simmer
    for two hours or so. At least until the beans are tender.

    - 5. Watch the water level and add more as needed.

    - 6. Taste and add seasoning as desired.


    ## Sugar Milk Pie


    Ingredients:


    - 3 cups brown sugar

    - ¼ cup granulated sugar

    - ⅓ cup flour

    - 1 ¼ cup milk or cream

    - 8-inch pie shell


    Directions:


    - 1. Mix all ingredients thoroughly together.

    - 2. Pour into the pie shell.

    - 3. Dot with butter and sprinkle on cinnamon and sugar if desired.

    - 4. Bake at 425 degrees Fahrenheit for ten minutes.

    - 5. Reduce temperature to 350 degrees Fahrenheit and bake for forty minutes.


    ## Building a Depression-era Pantry


    One key to living frugally and preparing for a depression type event is to prepare
    and build an adequate pantry. This often is going to look different from your
    current pantry. Back during the Great Depression, there wasn''t a lot of pre-packaged
    foods or snacks. However, turning your current pantry into one more like our relatives
    had you save a lot of money and allow you to make more items on your own. Let''s
    look at some tips to help you build a pantry from the depression-era.


    ## Stock the Basics


    There weren''t a lot of extras or packaged goods, and most of what made up pantries
    are things we often purchase in bulk today. This means buying more ingredients
    than ready-made food. The following is a list of some basics to consider keeping
    on hand:


    - Flour for making bread or using as fillers.

    - Honey for sweetener.

    - Salt for seasoning.

    - Cornmeal for making things like grits and cornbread.


    Where you live will often determine what is easily available. You can buy most
    of these and other similar items in bulk at grocery stores. When deciding what
    to stock in your pantry, avoid pre-made mixes as much as possible.


    ## Stock Up on Beans


    Since meat is often expensive and in a depression, you may not be able to afford
    it as a part of every meal; you''ll need to find another source of protein or
    at least a way to make meat longer. You can do this by making casseroles, soups,
    and skillet meals. The best way to save money on these recipes is to use beans.
    Purchasing dried beans is often cheaper than canned beans. Cooking with dried
    beans isn’t that difficult and offers several options.


    ## Keep Seasonings on Hand


    Spices are a good thing to have on hand when cooking your own meals. Since most
    depression-era recipes were very basic, seasonings can be used to add a variety
    of flavor. You can also choose to save more money by growing your own herbs and
    dehydrating them for use later.


    ## Dehydrate Whatever You Can


    This is a great way to use extra supplies and not let food go to waste. It is
    also a way to create shelf-stable foods. Purchase a dehydrator, and it will pay
    for itself as you dehydrate foods that can then last for months in your pantry.


    Now that we’ve discussed a variety of ways to use depression-era tactics to save
    money on food let’s consider some other areas where our relatives learned to do
    with less and live frugally. Let’s consider clothing and how you can reduce what
    you have and make it last longer.


    ## Depression-era Life Hacks for Clothing


    Clothing is an item that can be costly. Especially if you live in areas with seasons,
    and you need multiple types of clothing throughout the year. However, if you want
    to live frugally and save money, you need to do three things to help reduce your
    clothing budget. First, we''ll look at how you can develop a minimalist wardrobe.
    Then we''ll look at how you can make clothes longer. Lastly, we''ll look at how
    you can purchase cheap clothes at the thrift store.


    ## Developing a Minimalist Wardrobe


    You can save money and time by adopting a minimalist wardrobe. It isn''t boring;
    rather, it just makes things easier and allows you to be less consumer focused.
    Let''s look at some ways you can simplify your life and adopt a minimalist wardrobe.


    First, it is important to define what minimalist wardrobe is. While we are talking
    about having less to choose from, you should also ensure that you have pieces
    that go well together and can be easily mixed and matched. It does mean that you
    don''t need to have a pair of shoes for each outfit or a handbag for each outfit
    or ten dresses for each occasion.


    For some, this process may be more difficult than for others. This is especially
    true if you enjoy shopping for clothes. The first thing you need to do is take
    a good look at what you currently have. Start by removing the items you no longer
    wear. Or you may choose to look through the wardrobe with an eye towards what
    types of functions they serve.


    From there, you can start pairing things and get rid of the rest. Do you have
    articles of clothing that don''t go with anything else? Are articles of clothing
    that don''t fit anymore or need repairs? These are some of the easy options to
    downsize. The idea is to downsize only items that can easily go with other articles
    of clothing and/or accessories.


    Another option for reducing your clothing is to base it on the colors you prefer
