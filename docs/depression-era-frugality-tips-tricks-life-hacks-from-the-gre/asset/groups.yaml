- md: "\n## Don’t Use the Oven\n\nIn the summer months, using the oven will quickly\
    \ make the temperature rise in your home. Rather than use your oven, consider\
    \ meals that don't need to be cooked or use other methods such as the crockpot.\
    \ Another great choice is to use a barbecue outdoors.\n\n## Speak with the Professionals\n\
    \nHave a professional come inspect your home to see if you have anything making\
    \ your home warmer. Sometimes this service can be offered through the electric\
    \ company, or you can speak with a local A/C company. A simple inspection can\
    \ often save you hundreds of dollars a year.\n\nThese are general ways to save\
    \ on household expenses. A more specific thing to consider is your household appliances.\
    \ Not only do you want to save money when purchasing and using household appliances,\
    \ but you also want to get as much life out of your appliances as possible. First,\
    \ we will consider what uses you can get from a household appliance, and then\
    \ we'll consider which kitchen appliances are best to purchase second hand to\
    \ save you additional funds.\n\n## Household Appliances\n\nMany households have\
    \ common kitchen appliances like a coffee maker, dishwasher, microwave, etc. These\
    \ appliances make life much more convenient than it was during the Great Depression.\
    \ Yet, most people don't realize you can use these items for more than their intended\
    \ purposes, so you can get more for your money. Consider some of the ways you\
    \ use your appliances that you likely never thought of before.\n\n## Coffee Pot\n\
    \nA coffee pot can be for pretty much anything that needs hot water without having\
    \ to use the stove. It can be a great way to water for your morning oatmeal or\
    \ hot chocolate. It doesn't just have to be for coffee.\n\n## Food Processor or\
    \ Blender\n\nA food processor can be a great way to make pizza dough for dinner\
    \ or for homemade peanut butter. Simply puree peanuts with a bit of honey to taste\
    \ until you get the desired consistency.\n\n## Microwave\n\nThe microwave can\
    \ be used to sanitize the kitchen sponge by placing it damp in the microwave and\
    \ zapping for 30 seconds. The microwave can also make juicing citrus fruits easier.\
    \ Microwave lemons and limes for fifteen seconds, and getting the juice out will\
    \ be much easier.\n\n## Slow Cooker or Crock Pot\n\nThe low or warm setting on\
    \ a crockpot can proof your bread. You can also use it to make your own soap or\
    \ use it as a fondue pot.\n\n## Dishwasher\n\nThe dishwasher can be used to clean\
    \ so much more than dishes. Use it to clean baseball hats, refrigerator shelves,\
    \ produce drawers, and pretty much any other item. It will save you a lot of time\
