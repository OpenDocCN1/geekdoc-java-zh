    衣服也可能更耐穿，且不需要频繁更换。


    一旦你缩减了衣物数量，就可以专注于减少配饰了。配饰对于让基础款衣物具有时尚感至关重要。例如，准备几条围巾可以为基础衬衫和毛衣增添风味。你也可以关注纯色或中性色的内搭，它们可以搭配各种服装。


    最后，你应该设定一个目标并坚持下去。 决定你想在衣柜里留多少件衣服并保持在该数量；只有当衣服旧到需要更换时，才购买新衣服。当你由于想要购买更多衣服时，应该想想你已经拥有的东西，并判断你是否真的需要那件衣服。确保你购买的每件衣服都能与衣柜里现至少三件衣服搭配。


    建立一套极简的服装系统会让你生活的这部分变得更加方便，还能省钱，因为你不会受到追随最新潮流的诱惑。然而，另一种省钱的方法是延长你选择保留的衣服寿命。


    ## 让你的衣服更耐穿


    节省衣服费的另一个好方法是让你现有的衣服保持良好状态。如果你想让衣服看起来更久一点，那么你应该考虑以下大萧条中的技巧来帮助你的衣服更耐穿。


    ## 遵循洗涤说明


    花时间阅读说明并遵循它们。这不仅有助于你的衣服保持美观，还能让它们经受更久。例如，当说明写着“低温烘干”时，用热风烘干衣服会导致纤维更容易损坏。


    ## 自行修理


    缝补衣服是大多数人不再做的事情。然而，这是一项大多数人应该掌握的重要技能，以获得衣服的最长寿命。这并不意味着你需要缝制整件衣服的技能；你只需要足够的知识来修补洞或更换纽扣。这将有助于你的衣服更耐穿。


    ## 反过来洗涤并拉上拉链


    拉链敞开会在洗衣机搅拌时导致衣服破裂。此外，洗涤时将衣服反过来可以减少外面的起球，让你的衣服继续保持良好。


    ## 黑色衣服分开洗


    将深色衣服洗在一起有助于防止褪色。深色衣服的染料容易在水中溢出。当你把黑色深色衣服洗在一起时，可以防止染料渗透到其他衣服上。


    ## 避免使用柔顺剂


    虽然柔顺剂可以让你的衣服摸起来更软、闻起来更好，但它们也可能对衣服造成伤害。大多数柔顺剂会在衣服上产生堆积物，阻止它们透气或在洗涤后无法完全清洁。


    ## 使用正确的衣架


    只使用普通的衣架会损坏衣服，尤其是当你使用廉价的塑料材质时。多花一点钱买优质的木质或丝绒衣架，让你的衣服自然悬挂。这可以防止领口、肩膀和领口的拉伸，让你的衣服保持形状更久。


    ## 分类洗涤


    就像深色衣服洗在一起一样，根据类型洗涤所有衣服很重要。当你把衣服洗在一起时，你可以让它们处于适当的洗涤周期，防止它们褪色或变暗。


    尽管你已经努力缩减规模并维持极简衣橱，但总会有需要购买一些衣服的时候。如果是如此，你仍然可以通过在旧货商店购买某些衣橱单品来保持节约。


    ## 旧货商店的衣橱购物


    准备几件简单的衣橱单品，可以让你以极低的成本创造出许多装扮。这可以让你规划搭配变得容易计划，同时节省预算。这些衣橱单品的绝佳来源是你当地的旧货商店，但你需要时间和精心才能找到它们。让我们来看看你应该准备的四种核心单品，帮助你保持极简衣橱，并通过在当地旧货商店购买来节省预算。


    ## 黑裙


    无论你喜欢哪种风格的黑裙，准备一条都可以根据场合轻松地得体或休闲。你可以用它搭配简单的 T 恤和凉鞋作为一套休闲装，也可以搭配华丽的上衣和珠宝来打造晚宴装。


    ## 牛仔夹克


    如果你想在晚上或天气微凉时穿点什么，可以将其与裙子或连衣裙搭配。牛仔夹克非常万能，所以你可以与多种搭配选择组合。


    ## 灰色西装裤


    这些是兼顾正式和休闲的功能性选择，取决于场合。这些裤子的深色调也具有包容和显瘦的效果。它们也应该是耐穿且易洗的。搭配高跟鞋和时尚的上衣，为工作或晚餐盛装。你可以轻松地进行裁缝以获得良好的合身。


    ## 白色衬衫


    基础款白色衬衫是另一个多功能选择。你可以通过珠宝等配饰增加色彩。而且白色衬衫可以轻松搭配任何裤子、裙子甚至是牛仔裤。


    ## 黑色平底鞋


    这是永不会过时的东西。你应该找一双舒适且能很好搭配牛仔裤和西装裤的鞋。简单的款式会派用场，所以当你找到一双合脚的时，务必购买。


    ## 无限围巾


    这些可以有多种穿法，并完全改变一套装扮的外观。围巾在旧货商店通常一美元就能买到，所以发现时就应该入手。这是你可以拥有几件的衣服，因为它们很小，不占地方。准备多种颜色和图案的围巾，可以搭配你所有的衣服。


    ## 深色牛仔裤


    没有什么比合身的牛仔裤更好的了。深一点的颜色是最好的，因为它耐穿且显瘦。你也可以裁缝牛仔裤，使其达到完美的长度和合合度。最好找一个优质品牌，这样你知道它是用优质材料制成的，可以使用很一段时间。


    当你需要增加衣橱内容时，去当地的旧货商店寻找这七件单品。它将节省你的预算，并让你保持衣橱的极简风格。


    除了食物和衣服，另一种省钱的方法是居家清洁。有很多廉价的清洁选择，你甚至可以自己制作产品。让我们考虑一下如何做到。


    ## 大萧条时代的清洁小妙招


    在打扫房屋时，你可能不会考虑到节约。毕竟，你只需要买清洁产品然后打扫房子，对吧？通过大萧条时代的技巧，你可以学会自然且节约地清洁家。你可以用醋、小苏打和硼砂进行清洁。你还可以通过自制清洁产品来省钱。


    ## 自然且节约地清洁


    许多人认为你需要使用化学品来清洁家里。然而，有很多天然产品可以用来清洁家里。最棒的是，大多数这些产品都很亲民，能让你节省家庭清洁预算。让我们先看看家里可以使用的各种天然清洁产品，然后我们将详细查看主要的三个选项。


    ## 盐


    提到清洁，盐可能不是你首先想到的，但它在家里有很多用途，包括：


    - 盐是天然的地毯污渍去除剂。配合苏打水，它可以去除地毯上的几乎任何污渍。先在污渍上倒苏打水，然后用盐吸干污渍和苏打水。等完全干透后可以用吸尘器吸掉。

    - 盐可以作为溢洒物的通用吸收剂。

    - 将盐和水混合可以帮助光亮你生锈的铜器。。

    - 在家里还有许多其他盐的节约用途。


    ## 柠檬


    柠檬非常适合对抗细菌。只需几滴柠檬汁就可以清洁水池、垃圾处理器和柜台。柠檬汁还可以加入醋中以制成清洁液，或加入粉末糊状溶液中以使其更有效。考虑以下几种用柠檬清洁的用途：


    - 柠檬汁和小苏打是光亮金属的极品。

    - 切开的柠檬放在有污渍的菜板上是很好的刷子，可以去除污渍。之后用温肥皂水清洗，你就能得到一个如新般的菜板。


