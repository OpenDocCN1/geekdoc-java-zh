    ## 如何在线销售


    在清理家居杂物后，你可能会有很多多余的物品。虽然捐赠是处理这些物品的一种快速简单的方法，但你也可以出售一些物品来获得额外收入。虽然这不是最有利可的选择，但它是赚取一点外快的简单方式。考虑以下技巧可以帮助你在在线销售时取得成功。


    ## 销售高质量物品


    想想你尝试出售的物品；你觉得它们有价值吗，还是把它们看作垃圾？如果你把它们看作垃圾，那么大多数人也会这么想，你可能无法为它们卖到钱。永远不要尝试出售损坏、破裂、撕裂或无法使用的物品；直接回收或丢弃这些物品更好。唯一的例外是它们是具有收藏价值的旧物品。


    ## 清洁物品


    在寻找出售物品之前，你应该尽可能地对其进行清洁。如果可能，请去除任何污渍，并清除可见的灰尘和脏垢。干净的物品总是比脏的物品卖得更快、价格更高。同样，唯一的例外是具有自然包浆或需要特殊清洁的古董或复古物品。这些物品中的如果不清洁，其自然包浆反而更值钱。


    ## 详细照片


    在线销售时，照片是主要的卖点。这意味着如果你想让物品快速以高价售出，你就需要详细的照片。尝试从每个角度为物品拍照，然后用光线充足、易于观察的照片记录任何外观问题。列表照片越好，你获得成功的概率就越高。此外，避免使用物品的库存图。


    ## 公道的价格


    谈到在线出售物品时，人们不成功的主要原因之一是他们的定价太接近零售价。如果人们只需多花几美元就能买到同样的新手物品，那么他们就不会想要你的二手物品了。相反，价格应该设定比零售价低
    50% 到 75%，取决于它们的使用频率以及作为旧物品的完好程度。


    ## 需要时在当地面谈


    如果你在本地销售，请确保你愿意与买家面谈。当你愿意与个人见面时，你总能获得更多的销售。只需确保你选择一个位于中间、公共且安全的地方即可。


    ## 选择销售地点


    网上有很多地方可以出售物品：eBay、OfferUp、LetGo 和 Facebook Marketplace 等。你可以同时在多个地方列出物品，但如果你这样做，请务必密切监控你的列表，并在物品售出的那一刻从所有地点移除。


    ## 详细描述


    最后，销售物品的关键是有一个编写良好的物品描述。与其简单地说明物品是什么，你应该详细说明它存在的任何问题、你支付了多少钱以及更多相关的细节。你提供的信息越多，吸引的人就越多，售出物品的速度就越快。使用正确的语法也很重要，这样人们就不会对你试图表达的内容感到困惑。


    ## 产生额外收入


    除了在线销售物品外，在大萧条时期学到的另一种赚钱方法是拥有一份额外收入。我们的祖辈在寻找养家的方法时必须发挥创意。如果你发现自己今天正在为生计挣扎，那么你可能想寻找根据你的才华和可用时间带来收入的兼职。大萧条期间的许多兼职在今天仍然可以做。


    ## 托儿


    这份经典工作不仅适用于青少年。在大多数州，你不需要执照就可以托儿，除非你照顾的不止几个孩子。咨询你所在的州，看看一次可以看多少个 2 岁以下不相关的儿童。你还应该查看你州是否有任何特定法律。这是一个获得额外现金的好方法，特别是如果你在家工作或目前没有在户外工作。


    ## 缝补衣服


    这是一项几乎被遗忘的才华，因为世界上大多数人都习惯了扔掉旧或破物品。如果你能缝补衣服，你就可以获得相当的额外收入。大多数人在困难时期不想扔掉贵物品，并愿意付钱进行修理，如果这能节省购买替代品的费用。


    ## 出售物品


    正如我们已经过的，出售你不再需要或想要的物品可以带来收入。你可以在线出售，也可以举办车库拍卖。你还可以在所在地区或二手商店找到免费物品；通过简单的清洁和修理，你就可以出售这些物品赚取一些外快。


    ## 写博客


    如果你想在家工作并赚取额外收入，你可以开始写博客。你甚至可以通过此获得舒适的全职收入。然而，你必须投入努力才能实现这一点。写博客的一个巨大优势是，一旦你开始，就可以继续获得被动收入。


    ## 线上创业


    在社交媒体等网站上销售零售物品并获利变得越来越容易。只需点击几次，你就可以开启以代发货作为选项的在线业务，因此甚至不需要手头备。


    ## 家教


    你有英语学位吗，你喜欢数学吗，或者你会演奏乐器吗？在大多数州，辅导孩子学习科目不需要特殊的培训或执照。这对于大学生在校期间可以是一份很好的额外收入，对于那些在户外工作的人来说也可以另一个极佳的选择。


    ## 家政清洁


    人们很忙，许多人尝试预算请一名清洁工来帮助减少他们需要做的家务。你通常可以通过几个小时的清洁每月赚取几百美元。你有时可以通过清洁人们搬走后的公寓小区或清洁商务办公室找到经常性工作。然而，要做到这一点，你需要经过担保、执照和保险。这个过程花费不高，而且速度很快。


    ## 出售手工制品


    你喜欢手工吗？如果是这样，你考虑过出售这些物品吗？你可以坐在家里做你喜欢的手工和爱好来获得不错的收入，还有什么能更好的呢？你甚至可以为人们定制个性化物品以增加他们的购买机会。这种额外收入的选项是无限的，如手工艺、食品、蛋糕、冰淇淋、肥皂等。


    ## 跑杂


    有时人们没有时间去跑杂。另一些人困在家里，无法出门跑杂。当你为别人跑杂时，你可以赚点外快。你还可以提议送送食品。


    ## 自由职业


    这是一种赚外快的好方法。它不像博客，但可以涵盖写作、摄影等一系列服务。这样做的好处是你可以在家里完成大部分工作。


    ## 股票投资


    另一种挣钱的好方法是投资股票。然而，请确保你选择正确的变现时间。


    ## 创业


    虽然这看起来不像大萧条，但它可以是一个收入来源。只需记住这需要投入。


    ## 大萧条时期的预算建议


    除了赚钱或学习用创意的方法养家，维护预算也是一个好主意。拥有预算将允许你留钱以备不时，同时确保你的需求得到。


    ## 如何制定成功的预算


    预算是管理资金的好方法，但对某些人来说是一件困难的事。开始可能会困难，因为人们觉得花费时间时间，或者不知道如何做。考虑以下技巧可以帮助你开始。


    ## 保持简单


    有很多电子应用程序和网站可以为你提供理解预算和查看银行账户收支所需的工具。如果你有一个简单的预算，你会发现这个过程变得简单得多。这在电脑上操作时尤其如此。


    ## 使用大分类


    在制定预算时，记住你不需要微管理一切。相反，你可以为你最频繁的支出使用大分类。例如，食物、房贷/租金、水电、汽车、娱乐、储蓄等。当你不具体时，你可以简化事情并更容易坚持预算。


    ## 确保你能坚持


    如果你让预算计划变得过于复杂，你就不太可能坚持预算。因此在开始预算时，请确保你对自己诚实。如果你觉得你无法坚持预算的一部分，请考虑另一种解决方案。


    ## 先完成无聊的事


    在创建预算时，你首先需要知道你的钱去向哪里。为了做到，不要在一个月两个月内主动制定预算。只需观察你的钱去向哪里并做笔记；对自己完全诚实。在月底，你可以查看你的笔记。


    '
