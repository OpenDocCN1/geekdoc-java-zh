    冷冻香菜、莳萝、薄荷、欧芹、罗勒和葱的最佳冷冻方法。这些蔬菜需要在沸水中焯烫五到十秒。同时将其浸入冰水中并拍干。你可以在冷冻前将蔬菜切碎。一个很好的选择是使用冰格盒加水或自制高汤来冷冻蔬菜。冷冻后的蔬菜可以保存四到六个月。


    如果你不想冷冻农产品，或者冰箱里没有足够的空间存放大量物品，可以考虑第二种方案：罐装农产品。


    # 罐装


    罐装是大萧条时期生活的重要组成。剩余的农产品可以制成果酱、莎莎、酱汁、泥和发酵食品。罐装是一项非常精密的工作，因为方法不当可能导致肉毒杆菌中毒。然而，如果你遵循正确的罐装指南，你就是安全的，并且全年都有足够的食物。请访问国家家庭食品保存中心（National
    Center for Home Food Preservation）获取最新指南，并获取如何正确罐装的详细说明。


    除了保存食物，你还可以通过大萧条时代的烹饪技巧来省钱。这包括善用食物碎料、通过饮食计划提前规划以及使用大萧条时代的食谱烹饪。让我们先看看从前辈那里学到的烹饪技巧。


    # 烹饪技巧


    谈到大萧条时代的节约，有很多保存和替代的方法；但也有有助于让食物“更吃”的烹饪技巧。他们知道如何善用食物碎料，提前规划饮食以利用所有可用食材，并制作非常简单的食谱。让我们来看看这些领域的某些技巧，看看它们今天如何被应用。


    # 使用食物碎料


    美国各地的家庭在食品供应链的任何一个环节浪费的食物都多于其他任何地方。这种浪费估计达2700万吨。这是一个巨大的浪费，发生的主要原因有五个：


    - 人们购买食物通常是为了烹饪和食用，但由于缺乏计划，食物在食用之前变质或过期了。此外，如果人们选择外出而不是在家里吃计划好的饭，也会导致食物变质。

    - 如果存放不当，食物也会变质，无论是在太冷、太热、太湿还是太干燥的地方。

    - 购买的食物超过了变质前能烹饪和食用的量是另一个主因。

    - 由于人们对日期标签及其真实含义感到困惑，食物可能会被过早丢弃。

    - 最后，没有充分利用剩菜可能是导致丢弃变质食物的原因。


    减少和消除食物浪费的最佳方法之一是改变你的习惯和流程。这意味着买少一点，多利用手头有的东西，并在过程中省下一些额外的钱。你的情况决定了你具体能做什么，但以下是一些帮助你明智使用食物碎料的技巧。


    - 保留蔬菜稍后做汤。

    - 多余的黄瓜可以用作水的清爽风味。

    - 使用即将过期的牛奶制作茶或其他可以保存的食物。

    - 剩余的柠檬可以用于清洁。

    - 洋葱、大蒜等此类剩余物可以用来给菜肴增加风味。

    - 苹果可以做成苹果酱或像甜点一样的苹果派。


    剩菜还可以以多种方式重新利用。煮熟的蔬菜可以用于其他餐点，作为配菜或汤底。以下是一些你可以重复利用而不是丢弃的农产品碎料示例：


    - 皮、端部和芯。

    - 花椰菜和卷心菜较硬的外叶。

    - 胡萝卜和甜菜等根根类蔬菜的顶部。

    - 蘑菇柄。

    - 变色或软烂的水果块。

    - 可以做成另一顿饭的少量剩菜。


    虽然这些看起来就像是垃圾，但如果你知道如何处理，它们就可以被使用，并获得一些营养。


    # 汤容器


    每顿饭后，将你的零碎放入储存在冰箱里的容器中。最终，容器里的东西将足够做一锅汤。确保你的冰箱有足够的空间放置较大的容器，然后将所有的肉、蔬菜和肉汁剩余放入其中。一旦容器满了，你就可以将所有内容放入一些高汤中煮成汤。只要遵循几个简单的技巧，这可能比你想象的更好吃：


    - 避免冲突的风味和香料。要做到这一点，你应该只坚持使用肉、土豆和蔬菜等基础食材。

    - 使用优质的高汤来煮汤。剩菜提供的风味不够，因此你需要优质的高汤作为汤底。

    - 根据需要调整食材。如果你容器里的食材不够，可以随时添加更多。如果你有收获的额外蔬菜，或者你有罐装豆、米饭或酱，这些都可以帮助增加汤的味道。另一个选择是添加盐、胡椒和其他香料。

    - 保护你的食物碎料；它们在冰箱里可以保存很久，但不会永远保存。当你开始新一批碎料时，贴上带有日期的新标签。如果三个月后容器还没满，那么你也应该把汤做了了。


    另一种替代方案是使用汤容器的内容做肉派。将所有东西放入饼皮中，加入蔬菜、肉、配菜，然后用肉汤覆盖。如果你没有肉汤，可以用高汤调制一些。用第二层饼皮盖住食物，在华氏度350度下烘烤至棕色。


    一些最适合放在汤容器或高汤袋中保存的物品包括：


    - 胡萝卜皮

    - 土豆皮

    - 芹芹叶

    - 豌豆

    - 蘑菇柄

    - 洋葱头

    - 玉芯


    有些蔬菜因为风味太浓，不应该做汤或汤底。这包括：


    - 卷心菜

    - 萝卜

    - 大大芜根

    - 西兰花

    - 刺 artich心


    # 配菜


    通常，人们认为需要丢弃的蔬菜部分实际上是食物中最健康、最美味的部分，例如胡萝卜和甜菜的顶部，或者叶菜的茎。你可以包括的一些选项：


    - 胡萝卜叶 - 辛辣的草本风味。

    - 萝卜叶 - 辣味，但比萝卜本身淡。

    - 芜叶 - 轻微苦味。

    - 甜菜叶 - 温和甜味。

    - 洋葱叶 - 比小葱味道稍浓。

    - 莳茴茎和叶 - 细腻的茴香味。

    - 叶菜茎 - 通常与叶子味道相同。


    幼嫩的碎料可以用于沙拉，而较大较硬的碎料可以加入炒菜作为配菜。你也可以用它们制作汤或咸派。


    # 奶昔


    对于水果碎料，奶昔是避免浪费的极佳选择。它们非常好制作；只需将你有的任何东西与任何类型的牛奶、酸奶或其他奶油类混合即可。对于奶昔，你也不必担心水果的状态，因为混合后质地就不重要了。如果水果不够甜，可以加一点甜味。


    # 午餐


    避免食物浪费最简单的方法是将剩菜变成第二天的午餐。第二天直接加热即可，如果你不想连续两天吃同样的东西，可以把它留到第二天。你可以使用重复使用的容器将剩菜带到公司当午餐吃。


    如果你更喜欢新鲜的菜肴，可以将剩菜与新鲜食材结合做出新花样。在沙拉中加入鸡肉或在土豆中加入奶酪。如果你有大量的剩菜，可以冷冻一些以后当晚餐。


    # 冷冻餐


    如果你认为在几天内吃不完剩菜，可以将它们放入冷冻安全的容器中并储存。一些适合冷冻剩菜的容器包括：


    - 玻璃碗

    - 玻璃罐

    - 塑料容器

    - 密封袋

    - 冷冻保鲜膜'
