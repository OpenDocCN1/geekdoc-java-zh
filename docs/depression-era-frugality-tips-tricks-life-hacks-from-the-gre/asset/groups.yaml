    As soon as you start to organize, you''ll be amazed at how much "stuff" you have.
    It can be overwhelming at first, but it will also prevent you from going out and
    purchasing more. It will help you better evaluate things when you want to make
    a purchase.


    An organized home also means you won''t forget about things like gift cards, small
    checks, and other items that are basically the same as money sitting around your
    home. When you are organized, you''ll be able to keep track of these things and
    use them before they expire.


    Organization also means you''ll be able to keep track of your bills and won''t
    be faced with late fees. Knowing when things are due with organization will make
    paying the bills smoother because you won''t forget things.


    If you are building a pantry to ensure you are prepared for a depression, then
    you''re likely developing a stockpile. You should keep this stockpile organized
    in order to know what you need and what is getting low. If it isn''t organized,
    you could end up buying too much of something and have no room to store it.


    So how do you go about getting organized and doing it in a frugal way? Let''s
    look at two main ways to save money when organizing: repurposed items and the
    dollar store.'
- md: '

    # Repurposed Organization


    It''s always a good idea to start thinking about spring cleaning and organizing.
    Despite a lot of the advertisements and ads, you don''t need to spend a lot of
    money on organizing tools and storage containers. You probably already have all
    you need to organize at home. The following are some general ideas for common
    items you can repurpose into organizers for your home. There are plenty more options
    available to you, but this is to help get you started. Take a look around your
    home and think about how you can repurpose items for your organizational needs.


    # Cocoa Cans/Containers


    If you use cocoa either for baking or hot chocolate, once you''re finished, be
    sure to save the can/container. You can never have enough of these. Often packaged
    goods come in containers that are made from good quality materials and can easily
    serve the container with paper and make your own design or label for a variety
    of uses around the home.


    # Wine Crates


    Not everyone has wine crates lying around the house. However, if you have an organizing
    project that would benefit from these, you can always ask your local grocery or
    liquor store to set some aside for you. You can even put these crates together
    to create storage carts.


    # Empty Bottles


    Perhaps one area in the home that has the most odds and ends floating around is
    the bathroom. There are razors, soaps, toys, etc. Clean up and organize this space
    using empty shampoo bottles to serve as containers for the smaller items in the
    area.


    There are plenty of ways to organize your home, and if you take a moment to consider
    what your needs are, you''ll likely find something to repurpose in your own home.
    Before you go to the store, take the time to consider what you need to organize
    and whether not you have a container in your home. If you do need to purchase
    containers, you can save money by going to the dollar store for your shopping.


    # Dollar Store Organization


    Reducing clutter and organizing are great ways to save time and money while also
    getting your living space to look much better. We''ve already discussed how you
    can repurpose items in your home, but maybe you don''t have all the storage containers
    you need. If this is the case, you can organize your home on a very limited budget.
    Just head to your local Dollar Store, where you can find all the storage containers
    you need for a fraction of the cost. Let''s look at how you can organize your
    home for less.


    The first step is to clean and purge as much stuff as you can. Save only items
    that are useful and fits in your current lifestyle. Once you''ve paired things
    down to a minimalist lifestyle, then you can get started on organizing everything.
    When it comes to organizing, the most important thing is to use containers that
    you can see through and allow you to organize items in a way you can see at a
    glance. Consider how various areas in your home.


    # Kitchen


    Using containers in your kitchen is a great way to organize individual packages
    of food such as oatmeal packets, granola bars, etc. Use the same size and color
    containers on each shelf for a more uniform and organized look. When you don''t
    have boxes falling and items stacked on top of each, then you won''t have less
    food waste, and you won''t waste money buying things you already have.


    You can also use containers in the refrigerator. A basket can hold small snacks,
    juice boxes, or fruits and vegetables. You won''t have to spend a lot, and you''ll
    be able to see everything better.


    If you don''t have a spice rack, consider a small shallow bin that can hold your
    spices in a cupboard near your stove for quick and easy access while cooking.


    Shallow containers can also be used to organize drawers. Have a container for
    all small items such as cords, batteries, and pens. You can also organize your
    condiments and small kitchen gadgets.


    # Bathroom


    There is plenty of space for containers in the bathroom: back of the toilet, under
    the sink, in drawers, on shelves, or in a linen closet. Organize your small items
    like travel toiletries, hair ties, makeup, and all other small-sized items. A
    basket with a handle is great for organizing cleaning supplies under the bathroom
    sink. Organizing your washcloths by rolling them and keeping them in a basket.


    # Bedroom


    Containers can be used in drawers to separate and organize socks and underwear.
    A small container on your side table can hold change, keys, and other items you
    empty from your pockets. Larger bins can be added to the closet to store seasonal
    items like hats and scarves. You can also do similar organizing under the bed
    organizers.


    # Laundry Room


    A small basic is a great place to keep wash items separate from regular laundry.
    A bin for laundry soap, fabric softener, and stain removal helps keep things organized
    and easier to clean if there is a leak. Small jars can be used to organize small
    items like clothespins and wool dryer balls.


    The possibilities are clearly endless when it comes to organizing your home. Start
    with containers you already have and then make a list of what you still need to
    organize and what types of containers you''ll likely need. Then head to the Dollar
    Store and buy what you need; you can always return and exchange if you need different
    sizes or purchase more than you need. For a small investment at a dollar store,
    you can make a big difference in the organization of your home.


    Once you have things organized, you can also start to look for ways that you can
    budget and save money within your own home. Let''s now look at some depression-era
    tips that can help you save money on household expenses.


    # Depression-era Household Management

    # Life Hacks


    ![](img/5ce78655e630de1552f352fa8c4f5fd0_78_0.png)


    When it comes to saving money on household expenses, the most important thing
    to do is set a schedule. Focus on one main task each day so you can eliminate
    things like electricity too much. It will also leave you more time for things
    like meal planning and cooking. You may have something like the following:


    - Laundry on Monday

    - Ironing on Tuesday

    - Mending on Wednesday

    - Cleaning on Thursday

    - Shopping on Friday

    - Cooking on Saturday

    - Resting on Sunday


    A schedule gives you a framework for getting bigger tasks done along with all
    the smaller daily chores you need to accomplish. It also makes things more efficient.
    Let’s consider how you can reduce the cost of household expenses.


    # Cutting Household Expenses


    During the Great Depression, they didn''t have nearly as many monthly expenses
    as we do now. Yet the principle they applied then still applies today; if you
    don''t need it, you shouldn''t be paying for it. Take a look at your monthly expenses
    and see what you can cut. Even if you use it every day, it is a luxury that you
    can''t really afford to keep? There are a number of reasons to make cuts, and
    it can be overwhelming to decide what to get rid of. However, you can make a huge
    difference to your finances by making the right cuts to household expenses. Let''s
    consider eleven of the most common areas where you can cut household expenses
    and see if any apply to you.


    # Cable


    When it comes to watching television, there are lots of options today. You don''t
    need to keep paying a high cable bill. Rather consider how much you watch television
    and what channels you view; it may be less expensive to use a digital service
    or another alternative to cable. Just sure you don''t end up paying more for streaming
    services than you did on cable. Consider your needs and determine what is best
    for your situation.


    # Credit Cards


    Interest charges on credit cards can have a big enough impact on your budget.
    However, if you have a card with an annual fee, then this is one of the first
    expenses you should attempt to cut. If possible, move the balance to another card
    with a lower interest rate and no fee. Close any accounts that have annual fees.


    # Housekeeping


    Most people may not use these services, but if you do, evaluate why you have it.
    If you legitimately need the assistance of keeping your house in order, then you
    may want to continue. However, if you have a housekeeper or maid service simply
    because you feel you don''t have the time to do it yourself, then you may need
    to do a little evaluation.

    '
  mdcn: '


    # 改造利用物品


    开始考虑春大扫除和整理一直是个好主意。尽管有很多广告和促销，但你不需要在整理工具和储物容器上花费大量金钱。你家里可能已经有了整理所需的所有物品。以下是一些常见物品的通用建议，你可以将其改造为家中的收纳工具。你还有很多其他选择，但这只是为了帮助你入门。看看你的家，思考如何根据你的收纳需求来改造物品。


    # 可可粉罐/容器


    如果你用可可粉来烘焙或制作热巧克力，用完后务必留好罐子/容器。这类东西你越多越好。包装商品通常由优质材料制成容器，你可以很容易地用纸包裹容器，并根据家中的各种用途制作你自己的设计或贴签。


    # 红酒箱


    并不是每个人家里都有红酒箱。但是，如果你有一个得益于这些木箱的整理项目，你完全可以要求当地的杂货店或酒类商店为你留一些。你甚至可以将这些木箱组合在一起制作储物车。


    # 空瓶


    家里杂碎物品最多的地方可能是浴室。那里有剃须刀、肥皂、玩具等。使用空洗发水瓶作为该区域较小物品的容器，清理并整理这个空间。


    整理家有很多方法，如果你花时间考虑自己的需求，你可能会在自己家里发现可以改造利用的物品。在去商店之前，花时间考虑你需要整理什么，以及家里是否已经有了容器。如果你确实需要购买容器，可以去廉价商店（Dollar
    Store）购物来省钱。


    # 廉价商店整理


    减少杂物和整理是节省时间和金钱的好方法，同时让你的居住空间看起来好得多。我们已经讨论了如何改造家中的物品，但也许你还没有所有需要的储物容器。如果是这样，你可以用有限的预算整理家。只需前往当地的廉价商店，你可以以极低的价格找到所需的所有储物容器。让我们看看如何以更低的成本整理家。


    第一步是尽可能地清理和丢弃物品。只保留有用且符合你目前生活方式的物品。当你将物品简化到极简主义生活后，就可以开始整理一切了。在整理时，最重要的是使用透明的容器，让你能够以一目了然的方式整理物品。考虑你家中的各个区域。


    # 厨房


    在厨房使用容器是整理单个包装食品（如燕麦片包、能量棒等）的好方法。在每个层板上使用相同尺寸和颜色的容器，获得更统一、整洁的外观。当盒子不再倒塌、物品不再堆叠时，你的食物浪费就会减少，也不会再花钱购买已经有的东西。


    你也可以在冰箱里使用容器。篮子可以装小零食、果汁盒或水果蔬菜。你不需要花很多钱，就能更清楚地看到所有东西。


    如果你没有调料架，考虑用一个小浅盒将调料品放在炉灶附近的橱子旁，以便在烹饪时快速方便地取用。


    浅容器也可用于整理抽屉。为电线、电池和笔等所有小件物品准备一个容器。你还可以整理你的调味品和小厨房小用具。


    # 浴室


    浴室里有充足的空间放置容器：马桶后后面、洗手台下方、抽屉里、架子上或亚麻布柜里。整理你的旅行洗护用品、发带、化妆品以及所有小型物品。带提手的篮子非常适合整理浴室洗手台下的清洁用品。将毛巾卷起来放在篮子里进行整理。


    # 卧室


    抽屉里的容器可以分离并整理袜子和内衣。床头柜的小容器可以装硬币、钥匙以及你从口袋里掏出的其他物品。衣柜里增加更大的箱子来存放帽子和围巾等季节性物品。你也可以利用床下收纳箱进行类似的整理。


    # 洗衣房


    一个小篮子是将洗涤物品与普通衣物分开的好地方。用于放置洗衣液、柔顺剂和去渍剂的箱有助于保持整洁，如果发生泄漏，也更容易清洗。小罐子可以整理衣架和羊毛烘干球等小物品。


    整理家的可能性显然是无限的。从你已有的容器开始，然后列出你还需要整理的物品以及你可能需要的容器类型。然后去廉价商店购买你需要的；如果你需要不同尺寸或购买过多，你随时可以退换换货。在廉价商店投入小笔资金，你就能对家里的整理产生巨大影响。


    一旦你整理好了物品，你也可以开始寻找在家里制定预算和省钱的方法。现在让我们来看一些可以帮你节省家庭开支的大萧时期贴士。


    # 大萧时期的家庭管理

    # 生活小技巧


    ![](img/5ce78655e630de1552f352fa8c4f5fd0_78_0.png)


    在节省家庭开支方面，最重要的是制定一个计划。每天专注于一个主要任务，这样就可以消除过度用电等问题。这也会为你留出更多时间处理计划饮食和烹饪。你可能会有如下安排：


    - 周一：洗衣

    - 周二：熨衣服

    - 周三：缝补

    - 周四：打扫

    - 周五：购物

    - 周六：烹饪

    - 周日：休息


    计划为你完成大任务以及所有需要完成的日常琐碎家务提供了一个框架。它也让事情变得高效。让我们考虑如何减少家庭开支。


    # 削减家庭开支


    在大萧条时期，他们的每月支出远没有我们现在这么多。然而，他们当时采用的原则今天依然适用；如果你不需要，就不应该为此付费。看看你的每月支出，看看哪些可以削减。即使你每天都使用，它是否也是一种你无法真正负担的奢侈品？削减的理由有很多，决定扔掉什么可能会让人无从从。然而，通过对家庭开支进行正确的削减，你可以对财务状况产生巨大影响。让我们考虑削减家庭开支的十一个常见领域，看看是否有适用于你。


    # 有线电视


    在看电视方面，今天有很多选择。你不需要继续支付高昂的线电视账单。相反，考虑你看多久电视以及看哪些频道；使用数字服务或其他线电视的替代方案可能更便宜。只需确保你在流媒体服务上花费的钱不比线电视多即可。考虑你的需求并决定最适合你情况的方案。


    # 信用卡


    信用卡利息对你的预算可能会产生很大影响。然而，如果你有一张有年费的卡，这是你应该尝试削减的首要支出之一。如果可能，将余额转移到利率更低且免年费的其他卡。关闭任何有年费的账户。


    # 家政


    大多数人可能不使用这些服务，但如果你使用了，请评估你使用的原因。如果你确实需要协助来保持房屋整洁，那么你可能想继续。然而，如果你仅仅是因为觉得没有时间自己做而请了家政或保洁服务，那么你可能需要进行一些评估。


