    # Understanding What Expiration Dates Mean


    The USDA estimates that about 20% of food waste comes from confusion over the
    expiration date printed on items. A product’s sell-by or expiration date is a
    recommendation for quality, not safety. Except in the case of infant formula,
    food dating is voluntary and not a federal requirement. This has led to a lot
    of confusion. Understand what the labels mean to avoid wasting food:


    +   - Best if Used By/Before - This is a time frame to indicate the best flavor
    or quality of the labeled product.

    - Sell By - This is how long a store has to display the product for inventory
    management.

    - Use By - This is the last recommended date for using the product at peak quality.

    - Freeze By - This is the last date you can freeze a product in order to maintain
    peak quality.


    With this understanding, if you handle and store food correctly, it can often
    be used well after the date food has passed. Use your own judgment when determining
    if food is safe to eat. Don’t risk illness and discard any food that smells bad
    or doesn’t look right. However, there are some foods that you can revive and consume.


    # Reviving Foods


    Stale baked goods and crispy items like bread, cereal, chips, and popcorn can
    be revived in an oven or microwave rather than being discarded.


    +   - Cereal - Spread the cereal on a baking sheet in a single layer and cook
    at 350 degrees for five to ten minutes. Watch carefully for burning.'
  - '[PAGE 42]


    After a few minutes, take it to cool. Once cooled, it will be crisp and can be
    good for another couple of days.


    +   - Popcorn - Preheat the oven to 250 degrees Fahrenheit and spread the popcorn
    in a single layer on a baking sheet. Toast it for five minutes.


    +   - Crackers and Tortilla Chips - Preheat the oven to 225 degrees Fahrenheit.
    Spread a single layer on a cookie sheet and toast for 15 to 25 minutes, flip halfway
    through. The time will vary depending on the thickness of the food and the crisping
    you desire. Watch closely to make sure it doesn''t burn.


    +   - Bread - Stale bread can be used to make croutons for salads or soups. Cut
    the bread into cubes and place them in a large bowl. Drizzle with olive oil, salt,
    and pepper or any other seasoning you prefer. Preheat the oven to 375 degrees
    Fahrenheit and line a baking sheet with parchment paper. Spread the cubes in an
    even layer and bake for fifteen to twenty minutes, tossing halfway through and
    cooking until golden brown.


    Another way to avoid food waste while saving money is through proper meal planning.
    In the depression-era, this was almost an art form, and it is becoming popular
    again. I''ll show you how to do it right so you can get the most out of your food.'
  - '[PAGE 43]


    # Meal Planning


    Many view meal planning as a time consuming and costly endeavor that isn’t worth
    the effort. However, it is not something new, and many families used it during
    the Great Depression to extend the cost savings of their food. It may be a little
    overwhelming at first, but I’m going to give you five easy steps that will make
    the process much easier for you.


    # Find Recipes


    The first thing you need is to come up with a large selection of recipes. Look
    through cookbooks and online recipes to find your selection. Be sure to choose
    ones that you and your family will enjoy, but don’t be afraid to move out of your
    comfort zone in order to try new things. After you have your recipes, find a way
    to keep them organized. There isn’t one specific way; it just needs to work for
    you.


    # Plan Your Menu


    Once you have your recipes, you can start planning a menu. Menus can span one
    week to a month or longer. The best money-saving option is to create a plan for
    a month. Start with a sheet of paper labeled for breakfast, lunch, dinner, and
    snacks. Then under each have numbers one to thirty. Write down a different recipe
    under each number. For example, you may have cereal listed for each day of the
    week except weekends. Lunch may include sandwiches, salad, and soup recipes. The
    bulk of meal planning is focused on your dinner recipes. Once you have a complete
    list, you are ready for the next phase.


    # Develop a Grocery List


    Based on your recipes on your list, start putting together a grocery list. Write
    down what you need and how much you need to cook all of the recipes on your list.
    Having a complete list means you won’t have to run out to the store for each dinner.
    Once you have a complete list, you can head out shopping. When you come home,
    put your groceries away. Don’t worry'
  - '[PAGE 44]


    about fixing things or putting things together on the same day as shopping; it’s
    a little too much to do in one day.


    # Prepare Ahead of Time


    Gather all your recipes and decide what parts you can prepare in advance. Do as
    much as you can. For example, if recipes call for ground beef, you can brown all
    the ground beef needed at one time. The goal is to complete as much of your monthly
    cooking in a single day as you can.


    # Follow Your Plan


    The last step in the process is to keep your recipes and monthly plan on hand
    for easy references. After you finish a recipe, cross it off the list. This will
    help you keep track of what you have cooked. Having an organized system will save
    you on time. Planning ahead also saves you money on your groceries because you
    aren’t having to go shopping for last-minute items.


    In addition to having a meal plan, people in the Great Depression also made use
    of simple recipes that use as little ingredients as possible. While not an exhaustive
    list, let’s look at just a few examples of depression-era recipes to get you started
    on the road to proper meal planning.'
