    制定计划，并根据你的日程每天或每周分配几项清洁任务。如果你能自己完成这些任务，不仅可以节省钱，还能给自己带来成就感。


    ## 餐点外送


    订阅餐盒既有趣又方便。在忙了一整天后，从餐厅外送食物非常方便。但你不能利用目前储藏室里有的几种简单食材或物品自己动手做吗？如果你有需要，在能够抽出时间自己做饭之前，仍然可以在杂商店购买预制菜。


    ## 用电量


    只要花一点精力，你就可以降低电费。如果可能，请确保你使用的是节能灯泡和电器。设置自动定时器，在不使用时关闭灯和电子设备。不使用时拔掉插头。最重要的是，让家人了解每个月的用电量。稍后在我们讨论节省公用事业的方法时，我们将进一步探讨这一。


    ## 用水量


    你也可以通过减少用水量来省钱。在浴室放一个计时器，以便监控淋浴时间，并练习用更少的水淋澡。确保管道中所有的泄漏处都已修复。只在满载时才洗衣服和洗碗。这些只是减少水费的几种方法。


    ## 草坪护理


    请人打理草坪是一笔不小的开，而且还会影响你的水费。网上有很多教程可以帮助你自己理草坪，此外你还可以安装维护成本少且耗水少的景观。如果你没有所有的设备，可以考虑向邻居借用或在需要时租赁。


    ## 报纸或杂志订阅


    今天几乎所有内容都可以在网上获取，因此报纸或杂志订阅可能是你并不需要的。无纸化不仅可以帮你省钱，还能减少纸浪费。如果你仍然喜欢手质版，可以考虑从当地图书馆借阅。


    ## 纸制品


    与报纸和杂志一样，如果你尽可能实现无纸化，这将减少家庭开支。考虑减少纸巾、塑料袋和餐巾等纸制品的使用。当你使用可重复的版本时，既能省钱又能减少浪费。


    ## 固定电话


    如果你还有固定电话，请花时间考虑它的优缺点，评估你是否真的需要。手机套餐正变得越来越便宜，许多人正在取消固定电话。如果你觉得仍然需要固定电话，请进行对比购物，以确保获得最便宜的套餐。


    ## 会员和和订阅


    定期查看你的会员和订阅，看看哪些是你没使用的。是否有你设置了自动扣款但已经忘记的项目？取消不使用的项目看起来可能不多，但在年底可能会累积成可观的节省。


    减少家庭开支是应对经济衰退并开始储蓄的最佳方式之一。看看这些选项，看哪些能帮到你。也许我们大家都可以节省的一个领域就是降低公用事业的成本。让我们更仔细地看看如何节省电费。


    ## 节省电费


    近年来，电价持续上涨。这会很容易影响你的月预算。你有很多方法可以帮助降低电费并过上更节约的生活，即使在炎热的夏季也是如此。


    ## 与你的电力公司交谈


    如果你注意到费率上涨，你应该做的第一件事是给你的电力公司打电话，询问是否有任何适合你家庭的计划。你必须回答一系列问题以确定你是否符合任何计划的条件。你可以询问电费平均化方案，以便每月支付一个固定的费率。这将帮助你每月省下一些钱。


    ## 关灯


    虽然这听起来像是一个显而易见的解决方案，但离开房间时也很容易忘记关灯。养成在不在房间时就关灯的习惯。睡觉时，确保所有的户外灯也已关闭。如有需要，你可以在外面安装感应灯。


    ## 避免烘干机


    如果可能，你应该把衣服挂起来晾。运行烘干机，尤其是当衣服很多时，很容易增加每月电费。使用简单的晾架是节省每月账单极极方法。


    ## 设置充电站


    如果你在家里到处都插着电子设备充电，会浪费很多电力。相反，你应该考虑设置一个带有防浪保护器的中心位置，然后放置所有的充电器。如果没有东西在充电，你应该关闭防浪保护器。虽然这每月可能节省几美元，但在年底仍会积累成可观的节省。


    ## 更好的灯泡


    传统和廉价的灯泡运行成本实际上更贵。预付较高的价格购买紧凑荧光灯，可以在每月的使用中省钱。


    ## 减少看电视时间


    有些家庭可能同时开启三台或更多电视。这会花费大量的钱。从晚餐期间、电话响起时、作业期间以及睡觉前关电视开始。在周末，你可以为看电视设置时间限制，以帮助减少用电。


    ## 定期家庭维护


    确保所有主要电器都处于最新状态，并且暖气空调运行正常，对于保持低每月电费水平至关重要。如果你需要购买新的节能电器，过时的电器有时可以通过公用事业公司的补贴进行更换。


    ## 可编程温度控器


    在加热器或空调上使用可编程温度控器，意味着它们只在你需要时运行。这只需要大约三十美元，你甚至可能从电力公司免费获得一个。


    ## 切换到太阳能


    如果你选择切换到太阳能，需要注意的是你不会立即开始省钱。通常，长期的节省可以抵消切换太阳能的成本。你还可以找到补贴计划来帮助降低切换太阳能的成本。


    ## 充分利用烹饪时间


    这就是计划规划有所帮助的地方。如果可能，避免预热烤箱。一次性做好几道菜也是好主意，以限制加热烤箱的次数。


    除了这些提示，研究如何在没有空调的情况下冷却也是个好主意。夏季运行空调的会导致电费飙升。让我们考虑如何在没有空调的情况下让家里凉爽。


    ## 无需空调降温


    在夏季，温度可以达到三位数。在管理较低电费的同时让家里凉爽并不容易。然而，你有很多方法可以在不使用空调且不增加电费的情况下保持家里凉爽。


    ## 关注天气


    今天可以从多种获取天气预报：电视、智能手机和互联网。利用这些资源关注天气。如果气温在夜间会下降，你应该打开窗户。如果你看到热浪，就开始通过关闭窗帘和保持风扇运行来提前为家里散热。


    ## 拉上窗帘


    当窗帘或其他窗帘打开时，阳光会射入室内。如果温度达到三位数，阳光很容易让你的家里升。保持窗帘关闭以保持家里凉爽。你甚至可能想考虑投资遮光帘，以显著减少进入家里的阳光。


    ## 使用吊扇


    吊扇是一项很棒的投资，而不仅仅是为了夏季。在冬天，你也可以使用吊扇将热空气从天花板推下来。吊扇购买通常非常便宜，而且易于安装。


    ## 种树


    如果家里周围没有很多阴荫，你应该考虑通过种树来增加阴荫。树木和灌木是保持家里阴凉的极佳方法。一些电力公司甚至会为客户免费提供树。

