    金缕花是一种多益处的产品。它长期以来一直是一种廉价、全天然的民间疗法，在大萧条时期变得流行。考虑以下这些金缕花的用途，并配制成浸膏剂和茶供在家里使用。\n\n\
    - 1. 卸妆\n- 2. 缓解痔疮\n- 3. 清洁伤口\n- 4. 减轻肿胀和炎症\n- 5. 治疗痘和清洁油性皮肤\n- 6. 缓解静脉曲\n- 7.\
    \ 消除眼下浮肿\n- 8. 止止痒\n- 9. 干燥毒漆\n- 10. 收敛毛孔\n- 11. 收敛与皮肤爽肤剂\n- 12. 防止毛躁的洗发水\n- 13\
    \ 平衡衡水分\n- 14. 治疗头皮屑\n- 15. 减少红肿和粉刺\n- 16. 治疗水痘水疱\n- 17. 舒缓晒伤\n- 18. 防止剃须后干燥\n\
    - 19. 消除虫咬过敏\n- 20. 减少牛屑和湿疹\n- 21. 消毒剂和杀菌剂\n\n## 大萧条时期的娱乐生活技巧\n\n有很多方法可以让你生活变得节约并节省资金。然而，这并不意味着你可以在省钱的同时放弃乐趣。即使在大萧条时期，家庭也找到了娱乐和享受生活的方法。让我们考虑一下如何免费做一些事情，以及如何在预算有限的情况下仍然享受假期。\n\
    \n## 免费活动\n\n大萧条时期，家庭非常擅长的一件事就是找到很少或不花钱就能娱乐的方法。有很多选择。首先，考虑你可以在家里做的消遣活动。\n\n- 1.\
    \ 玩桌游游戏\n- 2. 看书\n- 3. 听播客或有声书\n- 4. 做拼图\n- 5. 开始一门免费的在线学习课程\n- 6. 看 YouTube 视频\n\
    - 7. 烹饪餐点或烘焙\n- 8. 整理或打扫房间\n- 9. 看电影\n- 10. 学习一项手艺\n- 11. 开始一项锻炼计划\n- 12. 在网上寻找免费物品\n\
    - 13. 享受水疗日\n- 14. 睡午觉\n- 15. 写书或写博客\n- 16. 开始写日记\n- 17. 制作一本剪贴簿\n\n如果这些听起来都不吸引人，或者你单纯是厌倦了待在家里，那么请考虑一些可以让你去户外的免费活动。\n\
    \n- 1. 去野餐\n- 2. 去跑步\n- 3. 去海滩\n- 4. 去钓鱼 \n- 5. 去露营\n- 6. 骑自行车\n- 7. 放风筝\n- 8.\
    \ 游览你的城市\n- 9. 去徒步\n- 10. 去游泳\n- 11. 参观开放房\n- 12. 在社区学院上上免费课程\n- 13. 去听免费音乐会\n\
    - 14. 去图书馆\n- 15. 自己自己设计一场寻宝游戏\n- 16. 开车兜风\n- 17. 运动\n\n## 预算内的节日\n\n对家庭来说，另一个经常重要的领域是能够庆祝节日。仅仅因为你正在节约并按预算生活，并不意味着你仍然无法拥有一次难忘的假期体验。考虑一下你如何在预算范围内享受感恩节、圣诞节和新年这三个主要节日。\n\
    \n### 感恩节\n\n取决于你的家庭规模，感恩节晚餐可能容易或不容易以节约的方式举办。然而，无论你计划的是多大规模的晚餐，都有办法举办一场难忘且节约的晚餐。让我们来看看如何做到。\n\
    \n提前计划并制定预算是举办节约晚餐的最佳方法。这还给了你充足的时间来寻找所需物品的最佳优惠和促销。\n\n在农贸市场购买蔬菜。通常，农贸市场的蔬菜价格会更低。感恩节晚餐通常有很多以蔬菜为基础的配菜。当你在蔬菜上省时，你会发现这占用了大量的预算。如果你所在的地区没有农贸市场，请寻找超市的促销活动。如果你找不到便宜的新鲜蔬菜，可以考虑冷冻蔬菜。\n\
    \n商店买的甜点可能看起来方便，尤其是当你已经有很多烹饪工作要做时，但它可能很贵。如果你有时间，提前制作甜点以省钱。这不仅能省钱，自制的甜点味道也更好。\n\
    \n让家人朋友带配菜来聚餐（potluck）。这也能为你省钱以及准备和烹饪的时间。它还让人们可以带特色菜，每个人都能分享独特的东西。\n\n不要购买过火鸡，只买足够满足大家需求并只有少量的剩余即可。火鸡通常是感恩节最贵的物品，购买正确的数量可以省钱。如果你买得太多，就充分利用剩余食物，不要浪费食物。\n\
    \n在感恩节期间，你经常能找到当地的优惠券和促销。关注这些优惠，并提前购买任何可能的，如气泡苹果酒、盒装填料和新月角。\n\n首先考虑你家里有什么。你通常会在家里发现很多需要的东西。如果缺少装饰品，列一份清单并坚持执行。先去美元商店（Dollar\
    \ Store），在那里你可以在所需的各种装饰品上节省大量资金。\n\n### 圣诞节\n\n圣诞节既高成本又充满压力的节日。你被要求准备礼物、准备晚餐并款待家人。此外，它恰好在你感恩节花完钱并试图为新年省钱之后。让我们考虑你如何像大萧条时期的人那样在圣诞节省钱。\n\
    \n任何节日规划的最佳方式都是从预算开始。一旦有了预算，列出你需要购买的东西并使用你家里已有的东西。确保你坚持在预算内。一旦超出预算，将很难回到目标。\n\n\
    在心中有了预算后，你就可以开始制定圣诞节晚餐要供应的菜单。这样，你就可以提前准备购物清单。在促销时提前购买任何可能的物品并保存起来。此外，务必先检查你的储藏室，看看是否已经拥有一些需要的物品。\n\
    \n与其在节日期间尝试新或复杂的菜肴，不如坚持你家人家人喜欢的基础菜肴。这既省钱又省时间，同时减少了剩余食物浪费的风险。\n\n在节日期间，家人才是最重要的，你不必需要给任何人留下印象。所以不要在邀请函和装饰等花哨物品上花费大量金钱。相反，要保持简单基础。\n\
    \n仅仅因为你要举办家庭晚餐，并不意味着你需要独自买单。如果你有一位做菜很棒的家庭成员，请他们提供。你甚至可以举办聚餐晚餐，让每个人都分担晚餐。\n\n圣诞装饰通常是人们花费大量资金的领域之一，特别是如果你喜欢装饰的话。考虑通过自己制作装饰来省钱，或为你的装饰设定一个严格的预算。此外，尽可能将装饰品留到明年。\n\
    \n礼物是另一个花费大量资金的领域。专注于每人只买一两件礼物。这既能为你省钱，也能提醒你圣诞节的意义在于与家人共度时光而不是送礼物。如果你有一个较大的家庭，可能想考虑抽签，让每个人只关注一个人。\n\
    \n取决于你的派对风格，你可能需要不需要帮助计划节约的新派对。对某些人来说，这只是一个普通的晚上，但对另一些人来说，是大派对的时间。如果你想在跨年夜派对，请考虑以下帮助你举办节约派对的提示。\n\
    \n虽然没有酒精无疑可以节省，但这对某些人来说不是一个好主意。另一个选择是选择一种饮料，然后找到不贵的东西，或者寻找可能有促销活动的批发俱乐部。\n\n对于大多数派对来说，你不需要提供比手指食物和小型鸡尾酒心更多的。你也可以把派对安排在晚餐后。这意味着大多数人已经饱了，对食物不感兴趣。如果你确实想要更多的食物选择，考虑改为聚餐并让每个人带一些东西。\n\
    \n保持邀请人数较少可以减少成本并使氛围更轻松。你也可以通过数字方式邀请人们以节省邀请函的开支。\n\n如果可能，使用之前节日的剩余装饰和基础用品。将七月四日的烟花留到跨年使用，并重复使用圣诞等\n\
    \n"
