    ## 不要使用烤箱


    在夏季，使用烤箱会使家里的温度迅速升高。与其使用烤箱，不如考虑不需要烹饪的食物，或者使用如慢炖锅等其他方法。另一个极佳的选择是在户外进行烧烤。


    ## 咨询专业人士


    聘请专业人士来检查你的房屋，看看是否有任何让你的家里变得闷热的因素。有时这种服务可以通过电力公司提供，或者你也可以与当地的空调公司联系。一次简单的检查通常可以每年为你节省数百美元的开支。


    这些是节省家庭开支的通用方法。更具体需要考虑的问题是你的家电器。你不仅在购买和使用家电器时想要省钱，还希望尽可能延长家电器的使用寿命。首先，我们将考虑从家电器上获得哪些用途，然后考虑哪些厨房电器最适合购买二手的，以节省额外的资金。


    ## 家电器


    许多家庭都有常见的厨房电器，如咖啡机、洗碗机、微波炉等。这些电器让生活变得比大萧条时期方便得许多。然而，大多数人并没有意识到你可以将这些物品用于其预期用途之外的用途，这样你就能物超所值。考虑一些你可能从未想过的使用家电器的方法。


    ## 咖啡壶


    咖啡壶可以用于几乎任何不需要使用炉灶就能获得热水的情况。它是为你的早晨燕麦片或热巧克力准备水的绝佳方式。它不仅仅是用来泡咖啡。


    ## 食物加工机或搅拌机


    食物加工机是制作晚餐披萨面或自制花生酱的绝佳方法。只需将花生和少量蜂蜜混合搅拌，直到达到理想的粘稠度即可。


    ## 微波炉


    微波炉可以用来消毒厨房海绵，将潮湿的海绵放入微波炉中加热30秒。微波炉还可以让挤柑类水果变得更容易。将柠檬和青柠微波加热15秒，挤汁就会变得容易得多。


    ## 慢炖锅或电陶罐


    慢炖锅的低档或保温模式可以用来发面团。你也可以用它制作自己的肥皂，或作为火锅使用。


    ## 洗碗机


    洗碗机可以清洗比碗具多得东西。用它来清洗棒球帽、冰箱层、蔬菜抽屉以及几乎任何其他物品。由于不需要手刷，只需放入运行一个程序，就能为你节省大量时间。


    ## 华夫饼机


    你可以用它为一个人制作一份完整的早餐。在其中一半放一些培根，另一半放上土豆饼，很快就能拥有一顿丰盛的早餐。


    ## 搅拌机器人


    许多人不知道可以用它来切碎晚餐所需的肉类。将煮熟并稍微弄碎的肉放在低速档上，配合搅拌器。这将节省你晚餐时大量手工切碎的时间。它也是制作搅拌奶油的绝佳方法。


    ## 电饭煲


    你可以煮比米多多的东西。把它想象成一个小型慢炖锅，可以用来煮燕麦片等。你还可以水煮梨和苹果等水果来制作美味的甜点。


    ## 手持搅拌机


    你吃的任何餐食都可以将一部分放入锅中并加入少量液体，搅拌成泥状，就可以做成婴儿食品。这会让有孩子的家庭更容易制作自制婴儿食品，而从商店购买可能会非常贵。


    ## 咖啡磨豆机


    咖啡磨豆机是切碎草类的绝佳方法。它也可以为需要小碎块的食谱快速切碎坚果。


    现在你已经知道了厨房电器的许多用途，你就会明白为什么身边有它们很重要。然而，为了真正让他们物超所值，你应该学习哪些电器应该购买二手的。


    ## 二手厨房小配件


    装修厨房的成本可能相当高，但由于使用频率频繁，你可以从某些物品中获得价值；留着它们是好的。幸运的是，许多厨房物品购买二手的是可以的。考虑以下物品，你可以在旧货商店购买二手的，以节省装修厨房的费用。


    ## 搅拌碗


    高质量的搅拌碗非常耐用、易清洗，且通常适用于微波炉和洗碗机。与其花很多钱买一套自己的，不如在跳蚤市场和旧货商店寻找一套。寻找各种尺寸的玻璃碗，并检查底部确保它们适用于微波炉和洗碗机。避免使用有口或裂缝的碗，因为它们可能会滋生细菌。


    ## 铸铁厨具


    铸铁锅非常适合煎炒和炉灶烹饪。当你找到一个时，只需要清洗并调养就能让它像新的一样。如果你能找到各种尺寸的，你就能满足所有的烹饪需求。


    ## 量杯


    收集各种尺寸的量杯是一个好主意，这样在烹饪时就一直有可用。手头多留几个是好的，以防丢失或损坏。你经常可以在旧货商店以不到1美元的价格买到这些，所以你可以以很廉的价格买齐一套。


    ## 定时器


    厨房计时器非常适合各种任务。新的并不昂贵，但买一个二手的可以节省更多钱。即使你已经有了一个，如果价格合适，也应该准备一个备用的。


    ## 桌布


    季节性的桌布是装饰桌子的绝佳方式。它能点亮房间并让客人们感到特别。新的桌布价格比你想象的要贵，所以找一个二手的是一个很棒的选择。用柠檬汁去除任何污渍，它们看起来就会像新的一样。


    ## 围裙


    如果你喜欢在做饭时穿围裙，你就知道它们变脏有多快。与其花钱买新的，不如买二手的。如果需要，你可以清洗污渍。


    ## 饮水壶


    在制作混合饮料或邀请客人来喝饮料时，这些非常非常用。在旧货商店买一个高质量的玻璃壶。彻底清洗后就可以使用了，你将省下一大笔钱。


    ## 迷你型烤架


    你经常在跳蚤市场和旧货商店找到这些。买新的时，这些可能相当昂贵，买二手的可以节省很多钱。


    ## 餐具


    如果你招待客人，你应该寻找一套餐具。你通常以比买新的低得多的价格找到所需的一切。


    ## 储物罐


    储物罐是存放咖啡、茶、糖和其他干货的绝佳方法。从旧货商店或车库拍卖购买一套，或者用不同的储物罐打造自己独特的套装。


    虽然有很多厨房物品你应该买新的，但也有许多物品可以购买二手的。在规划厨房时考虑这些。


    ## 减少纸制品的使用


    除了省钱，当你选择减少纸制品时，你也在保护环境。有很多方法可以使用布制品代替纸制品，而且它们很容易实施。虽然你得做一些洗涤，但在购买纸产品的成本上不会有影响。


    ## 手巾 vs. 纸巾


    与其为浴室或厨房购买一卷卷纸巾，你可以使用布手巾。每个家庭成员可以在浴室使用自己的毛巾。当你把它们挂晾时，它们不会滋生霉菌或细菌，如果你只用它们擦手，就不会产生交叉感染。


    ## 布餐巾 vs. 纸餐巾


    这可能是最容易的改变之一。买一套布餐巾在用餐时使用。如果你需要大量，可以通过工艺品店或折扣店购买围巾来省钱。这是一种经济、实用且方便减少纸餐巾使用的方法。


    ## 布尿裤 vs. 普通尿布


    如果你家有孩子，这可能需要一点适应，并且可能是一笔投资。然而，它是保持环保的好方法，同时还能节省预算。一次性尿布和湿纸巾累加起来开销不小。


    ## 布卫生用品 vs. 传统产品


    这可以是一个极佳的天然选择，有很多选项供你选择。大多数采用与布尿裤类似的材料和内衬。这些产品像布尿裤一样容易使用、清洗和重复使用，但没有那么笨重。


