    现在我们已经讨论了什么是节约疲劳以及如何避免它。让我们也看看一些你可以在不服用药物的情况下克服抑郁的方法。


    ## 无需药物提升情绪的方法


    ### 做些新尝试


    科学证明，当你尝试新事物时，会改变你的多巴胺水平。这是大脑中一种影响快乐和享受的化学物质。那么应该尝试什么新事物呢？其实很简单；只需换一条路上班，去吃不同的午餐，看一个关于爱好的视频并尝试一下，穿一件久没穿过的衣服，或者在社区寻找新的免费活动。有很多选择。


    ### 去户外


    阳光已知可以提高情绪和维生素 D 水平来帮助抑郁。如果你住在阳光不充足的地方，考虑买一个光箱。


    ### 保持感恩


    研究表明，每天的感恩仪式可以产生与抗抑郁药物相同的效果。这可以通过一些简单的事情来实现，比如写下你感谢的事物，或者专注于关注你已经拥有的一切。记住，为了成功，你需要将其作为一种常规练习，而不是偶尔随机做一次。在手机上设置闹钟或使用其他提醒来每天做这件事。


    ### 社交


    当你感到抑郁时，第一个念头是与他人隔绝。然而，避免这种欲望并尝试尽可能社交是很重要的。当你与他人共度时光时，它可以成为对抗抑郁的坚有力防御。如果你无法出去社交，可以加入在线支持小组或给某打电话。


