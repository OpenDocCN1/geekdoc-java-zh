    * Whole Chickens

    * Roasts


    Don’t Buy:


    +   * Boneless Chicken Breasts

    * Individual Pounds of Ground Beef

    * Individual Steaks


    # Canned Goods


    Buy:


    +   * Tomato Sauce

    * Tuna


    Don’t Buy:


    +   * Canned Fruits

    * Canned Vegetables

    * Canned Pasta Sauce'
