  md: '# Saving on Your Electric Bill


    In recent years, electric rates have continued to climb. This can easily have
    an impact on your monthly budget. There are ways you can help lower your electric
    bill and live more frugally, even in the hotter summer months.


    # Talk with Your Electric Company


    If you notice your rates increasing, the first thing you should do is call your
    electric company and ask them if there are any programs and your household qualify
    for. You''ll have to answer a series of questions in order to determine if you
    may qualify for any programs, you can ask about averaging your electric bill,
    so you are able to pay a single flat rate each month. This will at save you a
    little each month.


    # Turn Off Lights


    While this may sound like an obvious solution, it''s also easy to forget to turn
    off lights when you leave a room. Start making your habit to turn off lights whenever
    you''re not in a room. When you go to bed, make sure all outdoor lights are off
    as well. If needed, you can set up motion lighting outside.


    # Avoid the Dryer


    If possible, you should hang your clothes out to dry. Running a dryer, especially
    for those with a lot of laundry, can easily increase the monthly electricity bill.
    Using a simple clothesline is a great way to save on your monthly bills.


    # Set up a Charging Station


    If you have electronics plugged in all over the house to charge, it can waste
    a lot of power. Rather you should consider setting up a central location with
    a power surge protector and then all the chargers. If something is not being charged,
    you should turn the surge protector off. While this may save'
