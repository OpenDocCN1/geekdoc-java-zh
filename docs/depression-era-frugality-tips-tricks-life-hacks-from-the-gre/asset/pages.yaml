  md: '# How People Coped During the Great Depression


    As you can see from this book, people coped with the Great Depression in a variety
    of ways; but mostly by being creative and industrious. They found ways to do without
    and make do with what they had. Even though they didn’t have much, they still
    found ways to enjoy life and have some fun.


    Books were popular during the Great Depression because they allowed people to
    escape from their daily lives. They also used movies as a way to get away from
    reality. More importantly, they focused on spending time together and the family
    through things like board games and listening to music. Many of these things we
    can still do today.


    While the world has changed a lot since the Great Depression, not much has changed
    in how you can cope with trying times. Let’s look at how you can cope today.'
