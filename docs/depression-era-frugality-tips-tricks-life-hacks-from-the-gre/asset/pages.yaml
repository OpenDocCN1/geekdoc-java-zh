  md: '# How to Save Money When Shopping


    Part of being frugal is knowing how to save money while shopping. The best way
    to save money is knowing what you should never pay full price for. There are certain
    things you can get for free or cheap as long as you take the time to look for
    them. Never pay full price for the following:


    +   1. Digital song downloads. Often sites will allow you to download up and coming
    artists for free. You can also find discounts on gift cards for purchasing digital
    music.


    +   2. Laundry supplies are easy to make on your own. Save money by making your
    own laundry soap and avoid the harsh chemicals.


    +   3. Electronic books. Often classic books will have expired copyrights and
    become easily available in electronic format. You can often find these at online
    bookstores. Plus, online sites like Amazon and Kindle may occasionally offer free
    downloads.


    +   4. Clothing, especially for kids. Kids outgrow clothes fast, so you shouldn''t
    pay full price for them. Rather go to thrift stores to get what you need and pass
    them along once your kids outgrow them. This will save you a lot of money, but
    it will also give you a wide selection to choose from.


    +   5. Magazines are fast becoming obsolete. If you still like to read the paper
    version, then head to the library. It also gives you a chance to get out of the
    house and have something to do for a few hours.


    +   6. Baby food can be costly, but you can save a lot of money by making your
    own. Nearly any food can be pureed in a food processor and turned into baby food.


    +   7. Toothpaste and toothbrushes can be found for free at your dentist''s office.
    You can also make your own toothpaste with baking soda to save money.'
