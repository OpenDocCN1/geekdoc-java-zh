  md: '# Generating Side Income


    In addition to selling things online, another option for making money that was
    learned during the Great Depression is to have a side income. Our grandparents
    had to get creative when it came to finding ways to support a family. If you find
    yourself struggling to make ends today, then you''ll likely want to look for side
    jobs that will bring money based on your talents and availability. Many of the
    side jobs during the Great Depression can still be done today.


    # Babysitting


    This classic job isn''t just for teenagers. In most states, you don''t need a
    license in order to babysit unless you are watching more than just a few kids.
    Check with your state to see how many unrelated kids under the age of 2 can be
    watched at a time. You''ll also want to see if there are any specific laws in
    your state. This is a great way to bring in extra cash, especially if you work
    from home or aren''t currently employed outside of the home.


    # Mending Clothes


    This is a nearly forgotten talent since most of the world is used to throwing
    away old or worn items. If you can mend clothing, you could be making some decent
    side income. Most people don''t want to throw expensive items during hard times
    and will gladly pay to have them mended if it saves money on the cost of purchasing
    a replacement.


    # Sell Items


    As we already covered, selling items you don''t need or want anymore can bring
    in money. You can sell online or hold a garage sale. You can also find free items
    in your area or at thrift stores; with a little cleaning and fixing, you can then
    sell the item for some side money.


    # Write a Blog


    If you want to work from home and make a side income, then you can start writing
    a blog. You can even make a comfortable full-time income doing'
  merge: -1
