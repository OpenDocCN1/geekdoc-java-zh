  md: '# Tablecloths


    A seasonal tablecloth is a great way to dress up your table. It''ll light up a
    room and make guests feel special. New tablecloths cost more than you may think,
    so finding a used one can be a great option. Use lemon juice to remove any stains,
    and they’ll look like new.


    # Aprons


    If you like to wear an apron while cooking, you know how quickly they can get
    dirty. Rather than paying the price for a new one, purchase a used one. You can
    wash off stains if needed.


    # Drink Pitchers


    These are great to have when making drink mixes or having guests over for a drink.
    Buy a quality glass one at a thrift store. After a good cleaning, you are ready
    to go, and you’ll be saving a hefty amount on the price.


    # Mini Grills


    You will often find these at yard sales and thrift stores. When buying new, these
    can be quite expensive, and you can save a lot of money buying one used. These
    used to be popular and can still be used, but the value has gone down, and many
    people don''t need them anymore.


    # Serving Pieces


    If you entertain guests, you should look at thrift stores for serving pieces.
    You''ll often find everything you need to entertain for far less than buying all
    the items new. Often you''ll get an entire set for the same price as a single
    new item.


    # Canisters


    Canisters are a great way to store bulk items like coffee, tea, sugar, and other
    dry goods. Buying a set of canisters from a thrift store or a garage sale is a
    great option. You can either look for a matching set or create your own unique
    set from different canisters.'
