  md: '# Spending Errors to Avoid


    No one is is expected to always make the frugal choice when it comes to spending.
    Sometimes you just need to give in to your wants, or you are in a hurry and need
    to make a quick decision that may not be the best. It is okay that this happens
    as long as you continue to meet your savings goals and don''t go into debt. Keep
    in mind you''re not looking for perfection; you''re just looking for a frugal
    trend. There are five things you need to do to avoid making spending errors.


    If you''re reading this book, you probably already have a desire or need to live
    a frugal life. However, it isn''t easy or quick to switch to this focus. When
    you are first starting to live frugally, you''ll find nearly every deal there
    is; but there are still a few traps that you fall into that can ruin your chances
    of successfully living frugally.


    # Buying the Wrong Items in Bulk


    This is the most common trap. You see something in bulk and look at the cost.
    You quickly calculate the per-item cost, and you think it is a great savings,
    so you buy it. Then a few months later, you find you still have the majority left;
    but no desire to use it or it has expired. Anyone who has ever shopped at Costco
    knows this. So make sure you follow the tips you already mentioned when you shop
    in bulk.


    # Losing Track of Free Trials


    Nearly everyone has signed up for a free trial at one time or another. You have
    likely also forgotten to cancel at the end of the trial period. If you''re fortunate,
    you only end up paying for an extra month of something that you didn''t use past
    the first week. Avoid this by simply setting a reminder for yourself to cancel
    any free subscriptions you signed up for.


    # Forgetting After-Purchase Rebates


    After-purchase rebates can be a great source of saving money, but they require
    a little work. However, for most people, once they get an item home, they never
    take the time to mail-in rebate forms. Perhaps sometimes'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'the rebate is for a reward other than money, and it could even be a reward
    you don''t want. The main thing is that you should focus on buying products that
    have in-store rebates, so you get all of your savings upfront.


    # ## Always Read the Fine Print


    Whenever you find a deal or coupon, make sure you read the fine print. Otherwise,
    you may find out you aren''t getting that good of a deal, or perhaps you''ll end
    up paying full price since you don''t want to hassle with the hoops you have to
    jump through for the deal.


    # ## Lower Quality for Cheaper Prices


    As we''ve already discussed, make sure you don''t confuse being frugal with being
    cheap. There is a big difference between these two. You need to find the balance
    between the time and effort you put into finding a deal and the actual price you
    are paying for something. You should also make sure you aren''t sacrificing quality
    in order to save some money; this is especially true if it isn''t something you
    need right away.


    Now that we''ve talked about frugal fatigue is and how to avoid it. Let''s also
