  md: '# Cooking Tips


    When it comes to depression-era food saving, there was a lot of preserving and
    substituting; but there were also tips on cooking that helped make food stretch.
    They knew how to use food scraps properly, they planned out meals in advance to
    use all the ingredients available, and they made very simple recipes. Let’s look
    at some tips in all of these areas to see how they can be applied today.


    # Using Food Scraps


    Households in the United States waste more food than anywhere else along the food
    supply chain. This waste is estimated at 27 million tons. That is a lot of food
    to be wasted, and it happens for five main reasons:


    +   People often purchase food with the intention of cooking and eating, but through
    a lack of planning, the food spoils or expires before it can be eaten. Also, if
    people choose to eat out rather than a planned meal at home can cause food to
    go bad.


    +   Food also goes bad when it is stored improperly, whether it is in a place
    that is too cold, hot, moist, or dry.


    +   Buying more food than you can cook and eat before it spoils is another main
    reason.


    +   Food can be discarded prematurely because people are confused by date labels
    on food and what they really mean.


    +   Lastly, not using leftovers to their fullest potential can be a cause of discarding
    spoiled food.


    One of the best ways to reduce and eliminate food waste is to change your habits
    and routines. This means buying less, using more of what you have on hand, and
    saving a bit of extra money in the process. Your circumstances will determine
    exactly what you can do, but the following are some tips to help you use your
    food scraps wisely.


    # Buy What You Can Use'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'After preparing a week''s worth of meals, you''ll likely have a little bit
    of everything leftover in the refrigerator. Rather than throwing these foods out,
    use them up. Consider some ideas:


    +   - Save produce for use in soups later.

    - Extra cucumber can be used as a refreshing flavor for water.

    - Use milk nearing expiration to make tea or other foods that can be preserved.

    - Leftover lemons can be used for cleaning purposes.

    - Onions, garlic, and other such leftovers can be used to add savor to food dishes.

    - Apples can be made into applesauce or dessert-like apple pie.


    Leftovers can also be repurposed in a variety of ways. Cooked vegetables can be
    used in a variety of ways for other meals, as side dishes or stock for soups.
    Some examples of produce scraps you can reuse instead of throwing away include
    the following:


    +   - Peels, ends, and cores.

    - Tough outer leaves from cauliflower and cabbage.

    - Root vegetable tops such as carrots and beets.

    - Mushroom stems.

    - Brown or mushy pieces of fruit.

    - Small amounts of leftovers that can be made into another meal.


    While these may seem like nothing more than garbage waste, they can be used, and
    some nourishment gained if you know what to do.


    # Soup Containers'
