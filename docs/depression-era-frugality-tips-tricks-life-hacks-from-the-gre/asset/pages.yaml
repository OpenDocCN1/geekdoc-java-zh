  md: '# Depression-era Healthcare Hacks


    Modern science and medicine have done a lot for people, and it continues to make
    our lives better. However, during the Great Depression, our relatives often relied
    on ingenuity and thriftiness to keep themselves well. For non-emergency situations,
    consider trying the Great Depression health hacks.


    # Bites


    For things like bug bites and bee stings, you can mix some baking soda water to
    make a paste. Apply the paste over the bite and allow it to sit. After dried,
    the baking soda flakes off, and you can apply more paste.


    # Upset Stomach


    Comfrey tea can help ease a number of ailments, but it is typically used for upset
    stomachs. Steep some tea and enjoy a drink. You can buy the tea in stores or grow
    your own.


    # Fever


    It may sound weird, but placing slices of fresh onion on the bottom of your feet
    can help with a fever. Slip tight-fitting socks over the onions and then gently
    massage to help your body absorb them quicker. If possible, replace every four
    to six hours and continue as long as you have a fever.


    # Splinters


    If you find yourself with a splinter stuck in your skin, this trick is going to
    help remove it. Remove a piece of the thin, white membrane from the inside of
    a freshly cracked egg. Cover the splinter site with this membrane-like a band-aid
    overnight, and the splinter will come to the surface.


    # Colds and Flu


    With the cold and flu season getting longer each year, it can be a good idea to
    have vapor rub on hand. Save money by making your own and having it available
    whenever you need it.'
