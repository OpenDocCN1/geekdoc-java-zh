  md: 'After a few minutes, take it to cool. Once cooled, it will be crisp and can
    be good for another couple of days.


    +   - Popcorn - Preheat the oven to 250 degrees Fahrenheit and spread the popcorn
    in a single layer on a baking sheet. Toast it for five minutes.


    +   - Crackers and Tortilla Chips - Preheat the oven to 225 degrees Fahrenheit.
    Spread a single layer on a cookie sheet and toast for 15 to 25 minutes, flip halfway
    through. The time will vary depending on the thickness of the food and the crisping
    you desire. Watch closely to make sure it doesn''t burn.


    +   - Bread - Stale bread can be used to make croutons for salads or soups. Cut
    the bread into cubes and place them in a large bowl. Drizzle with olive oil, salt,
    and pepper or any other seasoning you prefer. Preheat the oven to 375 degrees
    Fahrenheit and line a baking sheet with parchment paper. Spread the cubes in an
    even layer and bake for fifteen to twenty minutes, tossing halfway through and
    cooking until golden brown.


    Another way to avoid food waste while saving money is through proper meal planning.
    In the depression-era, this was almost an art form, and it is becoming popular
    again. I''ll show you how to do it right so you can get the most out of your food.'
