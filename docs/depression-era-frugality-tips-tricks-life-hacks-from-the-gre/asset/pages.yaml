  md: '# Remember it is a Choice


    You may face pressure from people who want you to live a certain way or spend
    your money on specific things. While it may not always be easy to take the frugal
    route, if you are confident in your choice to live frugally, then it can be easier.


    Keep in mind that living frugally doesn’t mean you need to pressure others to
    do the same. At the same time, you want your family and friends to respect your
    own financial choices. In some ways, frugal living can be viewed as deprivation,
    leading to a feeling of resentment. You can also choose to view frugal living
    as a happy choice. The decision is entirely up to you.'
