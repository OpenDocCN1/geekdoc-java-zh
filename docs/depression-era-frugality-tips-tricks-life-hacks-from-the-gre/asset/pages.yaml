- img_proc: true
  md: '# Meal Planning


    Many view meal planning as a time consuming and costly endeavor that isn’t worth
    the effort. However, it is not something new, and many families used it during
    the Great Depression to extend the cost savings of their food. It may be a little
    overwhelming at first, but I’m going to give you five easy steps that will make
    the process much easier for you.


    # Find Recipes


    The first thing you need is to come up with a large selection of recipes. Look
    through cookbooks and online recipes to find your selection. Be sure to choose
    ones that you and your family will enjoy, but don’t be afraid to move out of your
    comfort zone in order to try new things. After you have your recipes, find a way
    to keep them organized. There isn’t one specific way; it just needs to work for
    you.


    # Plan Your Menu


    Once you have your recipes, you can start planning a menu. Menus can span one
    week to a month or longer. The best money-saving option is to create a plan for
    a month. Start with a sheet of paper labeled for breakfast, lunch, dinner, and
    snacks. Then under each have numbers one to thirty. Write down a different recipe
    under each number. For example, you may have cereal listed for each day of the
    week except weekends. Lunch may include sandwiches, salad, and soup recipes. The
    bulk of meal planning is focused on your dinner recipes. Once you have a complete
    list, you are ready for the next phase.


    # Develop a Grocery List


