    - Always thaw frozen foods in the refrigerator or microwave.


    # Understanding What Expiration Dates Mean


    The USDA estimates that about 20% of food waste comes from confusion over the
    expiration date printed on items. A product’s sell-by or expiration date is a
    recommendation for quality, not safety. Except in the case of infant formula,
    food dating is voluntary and not a federal requirement. This has led to a lot
    of confusion. Understand what the labels mean to avoid wasting food:


    +   - Best if Used By/Before - This is a time frame to indicate the best flavor
    or quality of the labeled product.

    - Sell By - This is how long a store has to display the product for inventory
    management.

    - Use By - This is the last recommended date for using the product at peak quality.

    - Freeze By - This is the last date you can freeze a product in order to maintain
    peak quality.


    With this understanding, if you handle and store food correctly, it can often
    be used well after the date food has passed. Use your own judgment when determining
    if food is safe to eat. Don’t risk illness and discard any food that smells bad
    or doesn’t look right. However, there are some foods that you can revive and consume.


    # Reviving Foods


    Stale baked goods and crispy items like bread, cereal, chips, and popcorn can
    be revived in an oven or microwave rather than being discarded.


    +   - Cereal - Spread the cereal on a baking sheet in a single layer and cook
    at 350 degrees for five to ten minutes. Watch carefully for burning.'
