  md: '# Food Pantries


    Whether you fall on hard times and run out of food or a food shortage leads to
    a lack of availability in your area; there may be times when you have no way to
    get food. Frankly, there are plenty of places where you can look to find free
    food.


    # Food Banks


    Nearly all communities have a food bank of some kind. You can utilize them to
    get food sometimes up to twice a month. They can be a great source of food when
    you are struggling and need a little help.


    # 211


    In most places in the United States, 211 provides assistance from any phone. You
    simply need to tell them what you are looking for, and they’ll find you the right
    resources. They can help put you in contact with charities in your area that can
    help supply you with groceries.


    # Local Churches


    Sometimes the churches in your area have a way to organize food or gift card donations
    to help families in need. While they may not have a lot to provide, they may also
    be able to point you in the direction of organizations that can help help.


    # Forage


    Nearly anywhere you live, you can forage for food such as edible weeds, fruit,
    and mushrooms. Even in city areas, you can still find some options. It is best
    to have a guidebook on hand or keep a journal of your own with where you can find
    edible plants because you don’t want to eat the wrong plants.


    # WIC and SNAP'
