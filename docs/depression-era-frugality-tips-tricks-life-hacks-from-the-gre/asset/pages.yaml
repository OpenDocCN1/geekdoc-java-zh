  md: 'With these benefits, you can see why starting a garden is a great idea. So
    now, let''s look at how you can get started with your garden.


    # Cultivating a Full Outdoor Garden


    Starting a garden doesn’t have to be a costly or involved endeavor. There are
    plenty of depression-era tips that will help you to frugally start a garden and
    gain the wonderful benefits of having one in your backyard.


    The first thing you need to do when starting a garden is to carefully plan out
    what you want to grow and the season in which you will be growing it. You should
    only grow produce that makes the most sense for your needs and the area where
    you are living. Often people don’t have a lot of space, so you’ll need to use
    what you have carefully. Also, make sure you only grow enough to cover what you’ll
    eat. If you grow nothing one will eat, then you are only wasting food and space.


    Similarly to planning your garden space, you also want to plan out what you will
    do when the harvest is ready. When the harvest is coming, plan out dinners that
    feature your harvested produce like soups and casseroles. You will be limited
    in what you can do, but this is a money-saving habit that helped many depression-era
    gardeners. If you can’t use all of your garden produces, then you should have
    a plan in place for canning or freezing excess produce for later in the year.


    For this reason, you want to plant some fall harvest vegetables that will last
    in storage. There are plenty of vegetables that you can harvest in the fall, like
    potatoes, turnips, and carrots. Root vegetables like these will extend your gardening
    season and will stay fresh as long as you can store them around 50 degrees.


    You can also extend your gardening time by building a cold frame. This will allow
    you to garden most crops well into and potentially through winter. You can build
    one yourself from repurposed items to save even money.


    Save money on the soil for your garden by making your own compost. This is a great
    way to have an organic garden on a budget. Create your own compost bin and add
    things then mix into your soil when tilling your garden'
