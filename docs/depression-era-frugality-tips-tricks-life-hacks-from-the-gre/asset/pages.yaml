  md: '# # Selling Items for Cash


    If you need to get extra money or just want to build up your savings, then look
    no further than your own home. A lot of people aren''t aware of just how many
    items in their home are worth a lot of money. Consider the common household items
    that you can sell for cash.


    +   * Soda cans or other aluminum products can be taken to your local recycling
    center. The products are weighed, and you are given cash right away.

    * If you drink wine, then save your wine corks. You can sell them online for those
    who use them in craft projects. You may also be able to sell the empty wine bottles
    as if they are decorative or something a collector may be interested in having.

    * If you have real silver, then you can cash in it, no matter what condition.
    Go to a local jeweler who is buying silver, and after weighing it, they''ll give
    you cash for your silver.

    * Another option is jewelry that is made from gold. Again you can cash in it no
    what the condition. As with your silver, take it to a jeweler who can weigh it
    and make you an offer. This is a great way to get rid of any jewelry you don''t
    wear anymore.

    * If you had children and they''ve outgrown their clothes, you can sell these
    for cash. If you have gently used items and accessories, then most resale stores
    will give you cash for them.

    * The same also applies to your own clothing. Look for local consignment shops
    in your area and get rid of clothing you don''t wear anymore as long as it is
    in good shape. You should also go through your accessories since shoes, belts,
    and purses can be sold for cash as well.

    * Perhaps you have collectibles or knick-knacks that you don''t use or need. Collectors
    love to purchase these items, and you can often take them to local antique shops
    to see if there is any interest.'
