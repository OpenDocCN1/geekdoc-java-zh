  md: '# Extra Money Savings


    The most obvious thing you can do is to save half of any extra money you get.
    This could be bonuses at work, birthday gifts, or any other payments you weren''t
    expecting. Set half of these amounts aside in your savings. Often this is extra
    money you weren''t expecting as a part of your budget, so saving it wouldn''t
    be that hard. It may not seem like a lot, but even an extra $5 each time will
    add up to a large amount in your savings at the end of the year.'
  merge: -1
