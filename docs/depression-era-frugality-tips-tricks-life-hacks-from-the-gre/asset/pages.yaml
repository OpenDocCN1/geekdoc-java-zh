  md: '# Kitchen Gadgets Second Hand


    The cost of furnishing a kitchen can be a bit costly, but with so much use, you
    can get out of certain items; it is good to keep them on hand. Thankfully, there
    are many kitchen items that are fine to purchase used. Consider the following
    items that you can buy used at a thrift store to save money when furnishing your
    kitchen.


    # Mixing Bowls


    Quality mixing bowls are very durable, easy to clean, and often oven and dishwasher
    safe. Rather than spending a lot of money on a set of your own, look for a set
    at yard sales and thrift stores. Find ones that are glass in various sizes and
    check the bottom to ensure they are oven and dishwasher safe. Avoid bowls that
    are chipped or cracked since they can harbor bacteria.


    # Cast Iron Cookware


    Cast iron pots and pans are great for sautéing and stovetop cooking. When you
    find one, you only need to clean and season it to make it as good as new. If you
    can find them in a variety of sizes, you''ll be able to use them for all of your
    cooking needs.


    # Measuring Cups


    It is a good idea to collect an assortment of measuring cups in a variety of sizes,
    so you''ll always have them available when cooking. Having a few extra on hand
    is good in case one gets lost or broken. You often find these for under a dollar
    at thrift stores, so you''ll be able to get a complete set for cheap.


    # Timers


    Kitchen timers are great for a variety of tasks. A new one isn''t that expensive,
    but you can save even more money by getting one used. Even if you have one, you
    should have a backup if the price is right.'
