  md: '# Make Your Clothes Last Longer


    Another great way to save money on clothes is to keep the clothes you have in
    great shape. If you want to keep your clothes looking great longer, then you should
    consider the following great depression tips to help your clothes last longer.


    # Follow Care Instructions


    Take the time to read the instructions and follow them. This not only helps your
    clothes keep looking nice, but also helps them to stay a lot longer. For example,
    drying an article of clothing on the heat when it says, “tumble dry low” will
    cause the fibers to break down easier.


    # Make Your Own Repairs


    Mending clothes is something most don''t anymore. However, it is an important
    skill that most should know in order to get the longest life out of your clothing.
    This doesn''t mean you need the skills to sew entire articles of clothing; you
    just need to know enough to mend a hole or replace a button. This will help make
    your clothes last longer.


    # Wash Inside Out and Close Zippers


    Leaving a zipper open can cause ripped clothing due to the motion of the washer
    as it agitates. Also, turning clothes inside out when washing will reduce pilling
    on the visible side so your clothes will continue to look nice.


    # Wash Black Clothes Separate


    Washing your dark clothing together helps prevent fading. Dark clothes have a
    dye that tends to wash out in the water. When you wash black and dark clothing
    together, it will prevent the dye from being picked up by other clothes.


    # Avoid Fabric Softeners'
