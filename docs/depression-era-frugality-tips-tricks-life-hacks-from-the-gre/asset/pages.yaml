  md: 'After each meal, add your odds and ends to a container stored in the freezer.
    Eventually, there will be enough in the container to make a soup. Make sure you
    have enough room in your freezer for a larger container and then put all meat,
    vegetable, and gravy leftovers into it. Once the container is full, you can put
    all the contents in a pot with some stock and cook it into a soup. This can be
    tastier than you may think as long as you follow a few simple tips:


    +   - Avoid conflicting flavors and spices. To do this, you should stick to just
    basic ingredients like plain meat, potatoes, and vegetables.


    +   - Use a good stock for cooking your soup. Leftovers don''t provide enough
    flavor, so you''ll need a good stock as your soup base.


    +   - Adjust your ingredients as needed. If you don''t have enough ingredients
    in your container, you can always add more. If you have extra vegetables from
    a harvest or you have canned beans, rice, or paste, these can all help add to
    the soup. Another option is to add salt, pepper, and other spices.


    +   - Protect your food scraps; they will keep in the freezer for a long time
    but won''t keep forever. When you start a new batch of scraps, add a new label
    with the date. If three months have passed and the container isn''t full, then
    you should make the soup anyway.


    Another alternative is to use the contents of the soup container to make a pot
    pie. Spoon everything into a pie crust with vegetables, meat, second, and then
