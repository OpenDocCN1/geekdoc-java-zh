  md: '# Depression-era Life Hacks for Food


    ![](img/5ce78655e630de1552f352fa8c4f5fd0_9_0.png)


    The first thing we are going to look at is how you can apply a series of life
    hacks to help you get the most out of items in your home and how to save time
    and money doing everyday chores. Let’s start by looking at some food hacks that
    will help you stretch your food budget.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Save Money on Pantry Goods


    The first area where you can use depression-era hacks is to stretch your food
    budget. You can do this by saving money when you shop and making your food go
    further, you can grow a garden, you can meal plan, and you can stock up a depression-era
    pantry. Let''s look in-depth at each of these areas so you''ll be able to get
    the most out of your food.


    When it comes to stretching a food budget, most people think they have to cut
    out or reduce healthy foods. This isn''t the case; there are a few healthy foods
    you can purchase for less than a dollar a serving that can be stretched to make
    a range of meals and provide you with food for a week or more. Let''s look at
    some of the top healthy foods you can purchase for cheap.


    # Black Beans


    Black beans are high in fiber, calcium, and folic acid. By purchasing them dry
    and boiling, you will preserve a lot of antioxidants. Cooking them is easy, and
    you can use them to make soup. You''ll often be able to buy the dry beans for
    less than 30 cents a pound.


    # Eggs


    These are one of the most versatile healthy foods for less than a dollar. There
    are a variety of ways you can use them. They are a simple breakfast that gives
    you protein to get your day started. You can also use them to make vegetable frittatas
    that can be stored for a few days in the refrigerator. Eggs are also an item you
    can get on your own if you raise chickens.


    # Almonds


    This is a great healthy snack for those on the go. You can often get almonds for
    about 60 cents a serving of 20 to 25 almonds.


    # Garbanzo Beans'
