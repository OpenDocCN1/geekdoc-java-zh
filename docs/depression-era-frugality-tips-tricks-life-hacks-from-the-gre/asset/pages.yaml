  md: '# Building a Depression-era Pantry


    One key to living frugally and preparing for a depression type event is to prepare
    and build an adequate pantry. This often is going to look different from your
    current pantry. Back during the Great Depression, there wasn''t a lot of pre-packaged
    foods or snacks. However, turning your current pantry into one more like our relatives
    had you save a lot of money and allow you to make more items on your own. Let''s
    look at some tips to help you build a pantry from the depression-era.


    # Stock the Basics


    There weren''t a lot of extras or packaged goods, and most of what made up pantries
    are things we often purchase in bulk today. This means buying more ingredients
    than ready-made food. The following is a list of some basics to consider keeping
    on hand:


    +   * Flour for making bread or using as fillers.

    * Honey for sweetener.

    * Salt for seasoning.

    * Cornmeal for making things like grits and cornbread.


    Where you live will often determine what is easily available. You can buy most
    of these and other similar items in bulk at grocery stores. When deciding what
    to stock in your pantry, avoid pre-made mixes as much as possible.


    # Stock Up on Beans


    Since meat is often expensive and in a depression, you may not be able to afford
    it as a part of every meal; you''ll need to find another source of protein or
    at least a way to make meat longer. You can do this by making casseroles, soups,
    and skillet meals. The best way to save money on these recipes is to use beans.
    Purchasing dried beans is often cheaper than'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'canned beans. Cooking with dried beans isn’t that difficult and offers several
    options.


    # Keep Seasonings on Hand


    Spices are a good thing to have on hand when cooking your own meals. Since most
    depression-era recipes were very basic, seasonings can be used to add a variety
    of flavor. You can also choose to save more money by growing your own herbs and
    dehydrating them for use later.


    # Dehydrate Whatever You Can


    This is a great way to use extra supplies and not let food go to waste. It is
    also a way to create shelf-stable foods. Purchase a dehydrator, and it will pay
    for itself as you dehydrate foods that can then last for months in your pantry.


    Now that we’ve discussed a variety of ways to use depression-era tactics to save
    money on food let’s consider some other areas where our relatives learned to do
    with less and live frugally. Let’s consider clothing and how you can reduce what
    you have and make it last longer.'
