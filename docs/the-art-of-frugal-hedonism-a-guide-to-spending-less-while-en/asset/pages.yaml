    night until waking at 4am to realise the electric blanket was still on.


    It''s school holidays, and since Mr R works weekends and has Tuesdays, he packs
    the kids into the station wagon and heads out to the cinema to see the latest
    animation blockbuster. They''re halfway when they realise that the younger boy
    has his favourite toy at home. To avoid tears, they drive back to get it, which
    starts the older boy calling his little brother a “stupid baby”. Mr R creates
    a swift distraction by announcing that after the movie they''ll buy the new computer
