    who decided to make a donation to a charity at Christmas instead of giving each
    other. If you want to keep it small and stay away from useless tokenistic stuff,
    why not put aside a selection of the year''s best homemade preserves and pickles
    to serve as gifts? People love pickles! Such treats also have the advantage of
    a long shelf life, meaning they create no sense of obligation to eat even more
    food over Christmas.


    For many people, festive food is another area of consumption-induced strain, and
    The Perfect Christmas Meal becomes an an exhausting marathon of shopping and preparation,
    leaving (usually) the woman of the house so busy getting a parade of dishes to
    the table that she barely gets to sit down and enjoy them. And on this over-catering
