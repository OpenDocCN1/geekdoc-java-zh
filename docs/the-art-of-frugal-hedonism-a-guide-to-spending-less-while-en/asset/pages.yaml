    Permaculture Pioneers:

    Stories from

    t New Frontier


    # edited by Caroline Smith and Kerry Dawborn


    These compelling stories describe how ordinary people found the courage to embrace
    the world’s problems and move beyond fear to make a difference and empower others
    with solutions and practical actions, as inspired agents of change.


    This anthology is an inspiring addition to permaculture publications, and of interest
    to anyone concerned with social and environmental change.


    One of the book’s key messages is that everyday folk do not have to wait for experts
    and governments to lead. The experiences of the Permaculture Pioneers illustrate
    that we can all be courageous and creative. We all have the tools to empower ourselves,
    rather than simply being dragged along in a flow we feel we cannot escape.'
