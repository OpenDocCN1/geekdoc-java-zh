    enter when performing a task that is within our capabilities, but is sufficiently
    challenging that our skills are exercised close to their limits. We experience
    flow (also known as ‘being in the zone’ when an activity so fully engages our
    attention that we get lost in the moment. And while this book focuses largely
    on sensual and social pleasures, your authors would hazard to suggest that ‘flow’
