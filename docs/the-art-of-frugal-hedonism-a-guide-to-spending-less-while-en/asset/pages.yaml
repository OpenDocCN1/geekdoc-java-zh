  md: '# Further resources


    Lifestyles, real and imagined, to help you recalibrate


    +   Tales from the Green Valley (Lion Television for BBC Two, 2005). A team of
    historians and archaeologists recreate the lifestyle of a 1620s Welsh farm for
    a year and, and as hard as it is, kind of love it. In fact, they must have really
    loved it, as several of them went on to do series in the rural lifestyles of several
    other eras. Annie wants to come clean: she has watched every one of these series,
    some of them more than once.


    +   Entropia by Samuel Alexander (The Simplicity Institute, 2013). Someone had
    to be brave enough to write it: not so much a novel as an attempt at envisaging
    of what a sustainable society might look like.


    +   The Transition movement is a global network of people creating whole streets
    and towns that are moving to a lower-energy use, more community-based lifestyle.
    Their website is dense with resources.

    www.transitionnetwork.org.


    +   Welcome to Lagos (BBC, 2010). An excellent three part miniseries about how
    people make do in the slums of Lagos, Nigeria. Makes you feel spoilt rotten, grateful,
    and inspired all at once.


    +   The Supersizers Go... Wartime (Series 1, episode 1. BBC Two, 2008). Two obsessed
    Britons eat a diet from the ration boxes of World War 2. Because they’re comedians,
    they have to make lots of ‘blech’ noises while eating the austere diet, but because
