  md: '# 50. Sup at the cultural buffet


    Cultural backlashes have a way of oversteering. There was a lot to dislike about
    being a peasant, to be sure. Think superstitions, thatched roofs, hair lice, and
    17th century density. But as the potential for being middle class emerged, we
    may have gone a tad overexcited, and ditched all manner of very worthwhile things
    in our enthusiasm. Take, for instance, growing food at home. What might the neighbours
    say?! “Can’t you afford food the supermarket?” So the rise of suburbia last century
    saw everyone who anyone ditching the vegetable patch and cultivating a patch of
    lawn instead; previously an ostentatious symbol reserved for the English entry.


    Now we’re at a point where the industrial middle class experiment has been running
    for few generations. We citizens of privileged nations have immersed ourselves
    in home entertainment, a cornopia of domestic appliances, interior design, bottled
    Fijian spring water, supermarket shopping and life coaches. Who could deny that
    it has a strange and marvellous ride? But one dense with inane and passive thrills,
    giving us short attention spans, huge rates of legal and illegal drug use for
    anxiety and depression, youth suicide, obesity, existential crises and so many
    distracting cute animal YouTube videos that it’s hard to get on with having a
    life. (Although – you have seen one where the cheeky gibbon pinches the ears?
    Because that’s worst not having a life for.)


    But we digress. The point your authors would like to make is that it would be
    silly for a Frugal Hedonist to be disdainful of everything associated with middle
    class living and modern technologies – to repeat the mistake we all made when
    we rejected peasant culture in a wholesale fashion. The luxury of history is that
    we can survey what has and hasn’t worked out for various incarnations of humankind,
    and adopt a cultural mash-up approach accordingly.'
