  md: 'I recently re-read Roald Dahl’s Matilda . Matilda is a genius child born into
    a cruel, rich, idiotic family who don’t appreciate her talents. Miss Honey, Matilda’s
    kindly school teacher, does however, and in one scene Matilda visits Miss Honey’s
    home. In the kitchen, there are no taps over the sink, a shelf and a single cupboard
    are the only furniture. On the shelf is a Primus stove, and a saucepan. Miss Honey
    sends Matilda to the well for water, then asks:


    “I don’t suppose you’ve ever done that before?”


    “Never,” Matilda said. “It’s fun. How do you get enough water for your bath?”


    “I don’t take a bath,” Miss Honey said. “I wash standing up. I get a bucketful
    of water and I heat it on this little stove and I strip and wash myself over.”


    “Do you honestly do that?” Matilda asked.


    “Of course I do,” Miss Honey said. “Every poor person in England used to wash
    that way until not so very long ago. And they didn’t have a Primus. They had to
    heat the water over the fire in the hearth.”


    “Are you poor, Miss Honey?”


    “Yes,” Miss Honey said. “Very. It’s a good little stove isn’t it?” The Primus
    was roaring away with a powerful blue flame and already the water in the saucepan
    was beginning to bubble. Miss Honey got a teapot from the cupboard and put some
    tea leaves into it. She also found half a small loaf of brown bread. She cut two
    thin slices...


    Although this scene exists to describe the poverty of Miss Honey, it kindled in
    me a perverse envy for the intense simplicity of her domestic life. I have had
    periods of my life where I had to heat water to bathe. I haven’t forgotten that
    there are some days when you pine for the convenience of a hot shower, but overall,
    the pared-back quality of those times is associated with happiness for me. And
    the way that simple things swell in value when there is ‘less’ is inherent in
    this passage: the wonder at the Primus’ efficiency, the savouring of the bread
    and tea we can project happen because of their preciousness.'
