  md: '# 26. Reinvent Christmas


    Your authors realise it only happens once a year, but we reckon that reinventing
    Christmas is useful because it is so emblematic: if Christmas can be improved
    via frugality, then anything can.


    It''s been over ten years since Annie told everyone she knew that she didn''t
    want any Christmas presents and wouldn''t be buying. She made an exception for
    her one remaining grandma, said granny being old enough to maybe not get it (and
    also old enough to have done a lot of frugal-time herself, enabling her to really
    appreciate small gifts like a box of Turkish delight). Those merry souls who choose
    to vanish Christmas consumption mania often make a similar exception for children,
    but keep the presents humble filled with small treasures: packets of glitter,
    a book, novel trinkets (curly straws, a magnifying glass, chocolate coins), or
    craft materials – perfect for allowing the grown-ups to relax all day while the
    stocking''s contents are explored and put to use.


    Find the consumption grotesque, but would still like to give something? What about
    only giving non-material presents (like a voucher for a massage, a lesson of some
