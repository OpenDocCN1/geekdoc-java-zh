  md: '# 49. Give something


    Whether it''s money, help, time, or things, giving asserts that you have enough
    to spare, which keeps you coming yourself into a mindset of not having enough.
    Which helps you feel sleek and satiated within your frugality. *And* it helps
    other people. Genius.


    In fact, it''s a neat little circle of win-win, with what being frugal meaning
    you end up with more to give, and giving helping you to be a more contented frugal.
    Giving doesn''t necessarily mean soup kitchens or Oxfam, it could mean more time
    listening to and caring for a frail or lonely family member, or taking the to
    drop excess garden produce around neighbours. Or dedicating as much effort as
    is needed to help a friend through a long dark tunnel of the soul. You have more
    energy left for this stuff when you''re not frazzled by forty-hour weeks and a
    flotilla of credit card debts.


    Some people find that giving away actual cold cash keeps them honest in their
    assessment of how much of it really need (and how comparatively rich they are).
    Adam has a friend who is a simple-living, intrepid-travelling mathematics lecturer
    who regards the salary he receives as an accidental reflection of an unfairly
