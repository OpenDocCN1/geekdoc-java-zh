    himself an extra large popcorn and an icecream as consolation. After the movie
    they go to the toy store is out of stock, they drive across town to check if another
    store has it. It doesn''t, so each of the kids gets to choose something to make
    up for the disappointment.


    Mr and Mrs R had agreed that morning that there should be no takeaway lunches
