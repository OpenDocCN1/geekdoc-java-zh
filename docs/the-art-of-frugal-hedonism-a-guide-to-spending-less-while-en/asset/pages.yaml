  md: 'In eras when daily fare was very humble and featured virtually no’treat’ foods,
    a feast was anticipated with legitimate glee, typically including more animal
    protein, and energy-dense luxuries like dried fruit and honey. But we live in
    an age where meat is left to spoil in thousands of refrigerators across the country
