    Permaculture:

    Principles and Pathways

    Beyond Sustainability


    # by David Holmgren


    Permaculture co-originator David Holmgren’s seminal work, *Principles and Pathways*
    draws together and integrates 25 years of thinking and teaching to show a whole
    new way of understanding and performing a simple set of design principles.


    Relevant to every aspect of how we reorganise our lives, communities and landscapes
    to creatively adapt to ecological realities which shape human destiny.


    For the general reader this book provides refreshing perspectives on a range of
    environmental issues and shows how permaculture is much more than a system of
    gardening. For anyone seriously interested in understanding the foundations for
    sustainable design and culture, this book is essential reading.'
