  md: '![](img/c65bfef74f426d079910ef9e22fa68dc_18_0.png)


    Increasing income and declining happiness in the USA, known as the Easterlin paradox.


    Consider again the kind of shifts in consumption we''ve highlighted above. Your
    pragmatic authors certainly don''t bring them up so that we can all lash ourselves
    into a lather of personal and cultural guilt. Far from it. We mention them because
    we think there''s something marvellously liberating (!) about acknowledging the
    total arbitrariness of what is considered ‘normal’ – it essentially clears the
