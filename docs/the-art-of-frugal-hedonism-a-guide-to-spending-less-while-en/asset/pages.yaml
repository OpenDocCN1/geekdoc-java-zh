  md: 'And that’s not a bad thing. Seeking the perfect choice, says Schwartz, even
    in big decisions like colleges, “is a recipe for misery”. Research indicates that
    those of us who tend to put a lot of effort and research into our choices, actually
    get less pleasure per dollar, and are less content overall – despite usually managing
    to select a slightly superior option. This could be partly because we became inclined
    to expect perfection after a lot of careful weighing-up of pros and cons, yet
    perfection is always a concept, never a reality. But while this effect is exaggerated
    for the ultra-thorough consumer, it applies to choice-rich societies in general;
    with so much available we develop a delusion that we should always be able to
    get what we want, and feel ripped off and depressed when we don’t.


    The Frugal Hedonist does not expect perfection. The Frugal Hedonist expects that
    life will be a multi-coloured journey of pleasures and struggles and joy and adventure
    and boredom and epiphany and love and getting drenched in stores and by fires
    and sometimes eating slightly stale bread but not minding and sometimes eating
    freshly plucked raspberries being jubilant. He regards most shops and restaurants
    as giants lumps in the landscape, to save himself from adding more candidates
    to his ballot of potential consumables. She recognizes that although endless choice
    promises freedom, it also traps us in an endless series of fine-tuned decisions
    that we feel must well-made to encourage success and accurately reflect our identity.
    So, she makes broad decisions to spare her brain this grueling reality.


    Such broad decisions can be big or small. We know a family who decided years ago
    to never shop in a supermarket. Most of our friends wouldn’t think to buy bottled
    water – it’s not ongoing act of piety, they’ve just taken it off their radar as
