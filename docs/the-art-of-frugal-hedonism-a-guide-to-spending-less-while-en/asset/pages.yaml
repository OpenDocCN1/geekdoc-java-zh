    is considered a virtuous alternative to snacking on cookies. This excess-on-top-of-excess
    can lead to yet more Christmasmass stress, as attempts to resist over-indulging
    at a parade of festive season work bashes and family gatherings segue seamlessly
    into guilt and dismayed resolutions to go to the gym more often to work off the
    ‘holiday bulge’.


    What’s the alternative? If you’re feeding people, you could focus on quality instead
    of quantity to avoid ending up with piles of excess food. Make a regular-sized
    meal but base it around scrumptious and local ingredients or an old family recipe
    — that has atmosphere and stories behind it. Decorate the table; make a big deal
    out of eating. Or invert the whole tradition and have carpet picnic of nothing
    but champagne, turkey and cranberry sauce toasted sandwiches, and chocolates,
    while the whole family plays word games. The kids will love it, and there’ll hardly
    any washing up. If someone else is hosting you, don’t just bring an extra dish
    because you feel like it’s The Done Thing — offer to help cook or clean up instead.
    And if you’ve been specifically asked to bring something, avoid over-catering
