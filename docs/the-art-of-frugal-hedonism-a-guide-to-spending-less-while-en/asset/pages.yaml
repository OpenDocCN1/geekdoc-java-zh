    The Frugal Hedonist chooses a culinary path of more flair and independence. Develop
    some cooking instincts and then base your meals on whatever happens to be in season,
    cheap, or in the cupboard right now. Go totally freestyle, or if you like to use
    recipes, learn to substitute. No breadcrumbs to help bind your meatballs? Grind
    some oats in a blender and use those instead. No apple cider vinegar, but plenty
    of lemons? Lemon juice plus a pinch of sugar will probably be just fine. Most
    deliciousness is a push and pull between sweet, sour, and salty elements, with
