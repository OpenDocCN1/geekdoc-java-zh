  md: '# About this book


    Dear reader,


    We want you to have an excellent life. And we don’t think you should have to spend
    much money to do it. This book is about how.


    That doesn’t mean pages of advice on collecting discount coupons, squirreling
    away soap ends, and constructing careful budgeting strategies, because:


    +   a) Those things don’t get to the heart of the relationship between much you
    enjoy life and how you use money,


    +   b) Your authors find these things dull to think about for very long, and certainly
    didn’t want to spend two years writing a book about them.


    Instead, this book provides a selection of tips that dive right into the soft
    gooey center of how we approach feeling good , and how that affects our spending.
    It examines ways to overhaul some habits that you may have accidentally fallen
    into living in a culture that encourages consumption at every turn. It looks at
    changing those habits can generate a life that both makes more sense, and indulges
    your senses. There are some practical bits, and some science-y bits. There are
    some recipes, and some psychology. There are some serious bits, and some really
    quite preposterous bits...


    # About you


    It doesn’t matter how much money you have. This book is designed to be read by
    anyone interested in how consuming less can make life more magnificent. Or just
    anyone curious about how skilled cheapskates get away with it. You’ll find it
    particularly useful if:


    +   You’re not sure that your current spending habits are shaping a life you really
    believe in.'
  merge: -1
