  md: 'Frugavor e by Arabella Forge (Skyhorse Publishing, 2011) is a great breakdown
    of how eating tastier, more nutritious food can actually be cheaper when you do
    it right – includes recipes.


    Michaelan’s suite of food-related books The Omnivore’s Dilemma, In Defence of
    Food, Food Rules, Cooked (all published by Penguin) are great for getting you
    fired up abut really appreciating what you eat.


    The Art of Fermentation by Sandor Katz (Chelsea Green, 2012) is the bible of fermentation.
    Fermentation can be a beautiful alchemy of extending a food’s shelf life turning
    it into something more delicious (and full of probiotics).


    The Weed Forager’s Handbook by your authors, Adam Grubb and Annie Raser-Rowland
    (Hyland House, 2013) is a guide to spotting and eating edible herbs. It’s Australian
    focused, but applicable to many of the planet’s temperate areas. You will also
    find many photos of edible weeds at the accompanying website: www.eatthatweed.com


    Putting Food By by Ruth Hertzberg, Janet Greene and Beatrice Vaughan (Plume, 2010)
    is a classic guide to bottling, canning, drying, freezing and picking.


    There’s a lot of blogs out there that give suggestions for how to cook with limited
    ingredients, use up leftovers, what to freeze and not freeze etc. Here’s one that
    includes a bundle of useful info: www.thestonesoup.com'
