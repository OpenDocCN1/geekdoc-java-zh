  md: '# #23. Swot up on the history of work


    Even if you couldn’t give a rat’s bellybutton for the economy, or a goose’s toot
    for having an enviable career, all this talk of deliberately working less might
    sit uncomfortably with you. Paid work, in our culture, is considered both the
    activity in which most of life will naturally be spent, and a virtue. This is
    simply the fundamental way of the world, or are there other ways to think about
    things? How did we arrive at this way in the first place?


    From the late 16th to 18th centuries European moral value systems took a heavy
    re-modelling by Protestantism, with its emphasis on work as the focal point of
    life and the road to salvation. Forswearing pleasure and frivolity was encouraged,
    and the attainment of money was seen as a sign that you were making fine headway
    into God’s good books. Large portions of society have had to work hard for millennia,
    but now work became something to be pursued for its own noble sake.


    The industrial revolution followed hot on the heels of this shift, and with its
    gluttonous need for labour to operate its new factories, was more than happy to
    have religion encouraging a strong work ethic in the poorer classes. A fervour
    for progress became the motif of the newly respectable merchant class, and was
    celebrated in media and morality alike. In 1783 industrialist Josiah Wedgwood
    – the man behind the crockery – embodied the spirit of the age by applauding “well
    directed and long continued ... exertions, both in masters and servants,” these
    behaviours “very good in keeping my eleventh commandment – thou shalt not be idle.”'
