  md: '# Foreword Clive Hamilton


    W hat a terrific idea , a book showing how frugal living can be pleasurable. Not
    the kind of smug pleasure of the drop-out or the feeling of moral superiority
    that comes with driving a Prius (yes, that''s), but real actual sensual pleasure.


    Critics of consumerism often talk about our ''addiction'' to things, and it''s
    a good way to think about it. Once you are hooked it takes over your life – you
    do crazy things to feed your addiction (work incessantly, sacrifice relationships
    and run up debts), and the yet the last hit doesn''t really satisfy so you crave.


    Think about it: What would happen if all forms of electronic communication crashed
    overnight – no mobile phones, no text messaging, no email, nothing for the kids
    to watch on their iPads when having a ‘family dinner ‘ with their parents. Would
    people be unhappy? You bet they would. Would be screams of outrage, howls of distress,
    heart palpitations and demands that the government fix it quick.


    But after a few days, a few weeks for the real addicts, people would find that
    there are other things to do, other ways to communicate (conversation is good).
    After all, in the 1950s – hell, in the 1980s – none of these things existed. Were
    people miserable than then? In fact, all of the data that people in the 1950s
    were happier! They had fridges but no air travel, telephones but no iPhones, pets
    but no pet jewellery, barbecues but no $7000 outdoor kitchens, and fast food that
    mean fish and chips.


    Yet we have been convinced, not least by a vast marketing industry devoted specifically
    to the purpose, that we will be happy only if we have the latest gadget, a bigger
    house, a car that parks itself or a TV that swivels to face us if we shift from
    one end of the couch to the other. After all, the advertising industry exists
    to make us feel dissatisfied so that we buy more stuff.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'In recent times marketing has zeroed in on one big message: Buying this thing
    or that thing will set you free. Cars, exotic holidays, insurance, home appliances,
    name it; all of these things can liberate us, although they rarely say from what.
    The truth is that as long as we fall for these messages (and nearly all of us
    do) we are locked in a prison, the prison of consumerism, and that''s the one
    prison that the marketers can never, ever promise to free us from.


    When I look around it it''s pretty obvious who are the freest people in our communities
    – the ones who have escaped the prison of consumerism and money-hunger. They don''t
    necessarily live in huts or dumpster diving every night, but they manage to live
    self-possessed enjoyable lives with great friends and jobs they love. They do
    many things consumers do, but always in moderation (while occasionally lashing
    out, just for the hell of it). They eat well, stay fairly, give more, are socially
    engaged and stress less than most of us.


    Bastards!


    In fact, the freest and most contented people much follow the advice in The Art
    of Frugal Hedonism.


    Despite all of its pleasures, there is a downside to the kind of frugal living
    described in this book. If you practise it, some of your friends, family and colleagues
    will become cranky with you. They will tell you (or tell each other) that you
    are moralizing, putting yourself on a higher ethical plane. It doesn''t matter
    how low you play it, the chances are they will still load you with these accusations.
    The truth is that they are not cranky with you; they are cranky with themselves.


    In this situation there are two solutions – find new friends, family and colleagues,
    or slip them a copy of The Art of Frugal Hedonism.


    > ive Hamilton is the author of Growth Fetish and co-author with Richard Dennis
    of Affluenza: When Too Much Is Never Enough.'
