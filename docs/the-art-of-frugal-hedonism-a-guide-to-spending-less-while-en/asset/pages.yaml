  md: 'In 1930, evolutionary biologist Julian Huxley predicted a two-day work week.
    “The human being can consume so much and no more... When we reach the point when
    the world produces all the goods that it needs in two days, as it inevitably will,
    we must curtail our production of goods and turn our attention to the great problem
    of what to do with our new leisure.” His contemporary, John Maynard Keynes, was
    similarly concerned by what all this leisure would mean: “Man will be faced with
    ... how to use his freedom from pressing economic cares, how to occupy the leisure,
    which science and compound interest will won for him.” In his 1956 presidential
    nomination speech, Dwight D. Eisenhower described a future where “leisure ...
    will be abundant, so that all can develop the life of the spirit, of reflection,
    of, of the arts, the full realization of the good things of the world.” A 1965
    US Senate subcommittee predicted that by the year 2000 Americans would be working
    14 hours a week, with at least seven weeks of vacation time annually.


    Obviously, something went astray en route to this seemingly inevitable hammock-fest.
    In her bestseller, The Overworked American , Juliet B. Schor points out that the
    productivity of the U.S. worker has more than doubled since 1948, meaning that:
    “we could actually have chosen the four-hour day... But between 1948 and the present,
    we did not use any of the productivity dividend to reduce hours.”


    Today, there is a growing movement questioning if the weird path we took instead
