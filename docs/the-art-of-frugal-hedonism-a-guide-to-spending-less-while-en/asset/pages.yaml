    # The Art of Free Travel:

    A Frugal Family Adventure


    **by Patrick Jones and Meg Ulman**


    Patrick, Meg and their family had built a happy, sustainable life. But in late
    2013, they found themselves craving adventure: a road trip.


    But theirs was a road trip with a difference. With Zephyr (10), Woody (1) and
    their dog, they set off on a year-long cycling journey along Australia’s east
    coast, from Dalesford to Cape York and back.


    Their aim was to live cheap – guerrilla camping, hunting and foraging. They spent
    time in Aboriginal communities, joined an anti-fracking blockade, documented edible
    plants, and dodged speeding trucks on the country’s most dangerous highways. *The
    Art of Free Travel* is the remarkable story of a rule-breaking year of ethical
    living.'
