  md: '# 16. Don’t think about money


    This book has to do with many things, and one of them is definitely money. Most
    books with anything to say about improving your relationship with money will tell
    you that you need to keep budgets and spreadsheets of your earnings and expenditure.
    This is no doubt necessary for some people who are in a tangle of debt or a financial
    pickle of some other form. We''d also recommend it as a revealing short-term experiment
    if you''re the sort who frequently peers into the leathery crevasses of your wallet
    and wonders just where all that money got to, and so quickly too! If you are either
    of these people, you likely already think, and even worry, about money a fair
    bit.


    The utterly beautiful news we have for you is that for folk who have made habits
    of minimal consumption second nature, money is something they rarely think about.
    This was one of the shocking constants your authors observed when talking to Frugal
    Hedonist friends – somehow we had been somewhat sucked into the stereotype of
    the penny-pinching miser sitting up all night counting coins by the light of a
    grubby candle stub.


    It is magnificent how it works: you operate on the general basis that you don’t
    go shopping for entertainment, and you mostly just buy stuff you really need or
    value. You repair, repurpose, borrow and share things, buy fresh produce in season,
    take packed lunches (we’ll stop there before we paraphrase this entire book within
    one of its own sentences – like some kind of conceptual babushka doll) and the
    spare money just seems to gently accumulate.


    It’s actually a gorgeously exploitable paradox of living in a first world culture.
    Our wages are set to enable a ‘basic standard of living’ that is more than basic,
    so if you can get good at livin’ on actual basics, you end up with more money
    than you know what to do with! Then you get to come up with something to do with
    it, and that part is very nice too.'
