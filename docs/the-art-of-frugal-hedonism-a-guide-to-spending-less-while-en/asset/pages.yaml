- img_proc: true
  md: 'hedonism / hēdn izam/ the pursuit of or devotion to pleasure, especially to
    the

    pleasures of the senses.


    This devotion can come in many forms however, and worshipping too

    fervently at the altar of consumer hedonism can really stuff you up for all

    t other kinds.


    It takes some practice to become a ‘frugal hedonist’. If you’re used to

    pressing a button that says ‘cheese’ and having cheese come out, you

    might feel disgruntled about having to walk to the cheese mountain and

    exchange pleasantries with the cheese miners before you get your cheese.

    But imagine how much better that cheese will taste! Not to mention other

    perks, like your toned calves, the beautiful scenery on the way to the

    mountain, and your jovial friendship with a crew of talented cheese

    miners. Which is what Frugal Hedonism is all about: perceiving a more

    idimensional spectrum of pleasures, and living accordingly.


    # About your authors


    We both grew up as vagely middle-class kids, which in the 1970s and

    80s meant something more frugal than it does now. More, dirt, fewer

    screens, next to no takeaway meals, more walking to school, parents with

    bigger hair.


    Reflecting on her teenage years, your author Annie recognises that she

    was already exhibiting unusual attitudes towards extravagance. She recalls'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'a certain afternoon in her first sharehouse. She had just completed high school,
    and was working the five a.m. shift in a plastics recycling factory. Every day
    for a week she had packed a change of clothes to put on after finishing work,
    each item the same shade of furious cobalt blue, sourced from various missions
    to second-hand stores. She would emerge from the factory into the midday West
    Australian sun, and walk through the industrial precinct to the ocean, where she
    would enter a rapture at her ability to merge via camouflage in the huge blue
    sky and the ocean that reflected it. On the final day of the week the recycling
    line turned a cobalt blue pooling shaped like a clamshell. She hauled it home
    on the train, and spent the afternoon gleefully ensconced in amidst the overgrown,
    silver grass of her backyard. While clinking the cubes in her glass of blue cordial,
    she gazed at the sky, trying to dissolve any sense of her own existence. She remembers
    thinking: “This is the pinnacle of debauchery.”


    Your co-author Adam recalls being quite clear as a child toasted sandwiches cooked
    over the fire were better than any other kind of dinner. His enthusiasm for cheap
    pleasures was confirmed when his parents better jobs, and the family moved house.
    They missed their dilapidated old farm house dreadfully, and wasn''t at all impressed
    with the sterile expensive new house that smelt of paint, though of course he
    soon found a bog down to catch frogs in, so things were okay after all. Later,
    when his adolescent meant oblong, he insisted on getting the cheapest ‘pensioner’
    glasses the optometrist had in stock, refusing his parents’ offers of more fashionable
    frames. He also never once thought of asking for a car as a graduation present.


    # About your authors and this book


    As we grew older, dear reader, your authors noticed that a lot of people in our
    unbelievably affluent society were struggling to thoroughly enjoy life, despite
    having it so good. Increasingly, those people were us — notwithstanding our promising
    starts. We pledged to not have a bar of it. We would nip this trend in the bud.
    If there was a tricky trap to avoid, we would avoid it! If there was banal brainwashing
    to buck, we would buck'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'it! We wanted to live large! We wanted to stay healthy, curious, and alive
    to pleasure! And we wanted to do it without spending lots of money. Gradually,
    we became adept enough at it that people started asking questions like this:


    Q. Hello. Could you please tell me how you manage to work so little, and do so
    much cool stuff?


    Q. What the hell is your secret? You should come over sometime and give me some
    ideas about how to spend less money. I''ll make you risotto.


    Q. How much money do you actually spend in an average week?


    (We feel it''s only polite to respond to this one here, as it doesn''t come up
    in the book: About AU$105 a week, including bills but excluding rent/mortgage
    payments. The average Australian equivalent figure is AU$440 per person. It would
    be higher again if only adults were counted when calculating this average.)


    Q. Why don''t you guys write a book about how to live frugally and still have
    an excellent life?


    So here we are. To get here, we surveyed the habits of our best Frugal Hedonist
    friends and wrote them down. We sought out people who grew in cultures or eras
    that were better at turning resources into happiness than ours is and we captured
    their words in our dictaphone. We made a decoction of what we learnt, drizzled
    it over some fascinating facts and figures, and swirled the lot through our favourite
    strategies for living ludicrousously well while spending very little. We present
    the results here for your delect.'
