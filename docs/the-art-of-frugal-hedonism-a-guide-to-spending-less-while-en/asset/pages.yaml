- img_proc: true
  md: 'Don’t praise them for abiding by these expectations (although praise a job
    well-done), but make it clear how disappointed you are if they don’t fulfill them.


    **Be clear and give reasons.** When you say ‘No’ (...we are not going to buy that
    toy) or ‘You have to’ (...brush your teeth even though you don’t feel like it),
    say it with certainty, and also briefly explain why. Introduce this important
    concept: ‘In life there’s always things that we don’t like, but have to be the
    way they are. But there are always millions of things to like at the same time,
    so it’s silly to waste energy making a big stink over the bits we don’t like,
    because then we’d have no energy left to enjoy all the good bits.’ Your job is
    not to create a being who never suffers, because that’s unrealistic. It’s to create
    one who deals gracefully with suffering when it comes along, and gets the most
    of everything in between.


    **Go for frugal forms of entertainment.** Make use of some of the zillions of
    free kids’ activities to be found in most large cities, especially during school
    holidays – from museums to story hours at the local library to discovery trails
    in the botanical garden. At home, keep animals, even if it’s just mice, and give
    the kids some of the responsibility for looking after them. Tell them stories,
    do drawings, wrestle, go foraging. Let them get bored, because that’s when they
    learn to be creative about entertaining themselves. Teach them the fun of finding,
    fixing and re-appropriating old stuff. Get them involved in anything useful you’re
    doing; children love to feel like they’re growing grown-up things! And don’t forget
    how often what you enjoyed most as a kid didn’t involve any adults. So leave them
    alone. To puddle about water and dirt, sing made-up songs, play dress-ups, and
    invent imaginary worlds.'
