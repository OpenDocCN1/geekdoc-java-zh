  md: '# 46. Save (on) the children


    Your authors are not parents. We have spent a lot of time around kids, and one
    of us even worked professionally in childcare for several years, but we don''t
    pretend to grasp the challenges of parenthood well enough to splash our own frugal
    child-raising ideas about this book. Instead, we''re choosing the fact that we
    raised frugally ourselves, and have many Frugal Hedonist friends who sport miniature
    sidekicks, and sufficient proof that children aren''t an insurmountable barrier
    to living cheaply. We asked a selection of these friends about their top frugal-with-junior
    strategies. Here''s what they came up with:


    It pays to put in early. If there''s ever a phase of life to free up as much as
    you can – even that earning a pittance or letting the house go to pot – it''s
    during your child''s first five years. This is not so you have to mollycoddle
    and hover over them. This is to allow you to spend ridiculously long time making
    dinner, so that your child can help you with and start building and enjoying kitchen
    skills. It''s to leave you with enough energy to keep half an eye on them while
    they riding their tricycle up and down the sidewalk in the evening, rather than
    being so exhausted that you plonk them the grass in front of a video instead.
    It''s so you have time to look at advertisements with them and laugh at ‘how crazy
    it is all the silly things people!’ It is time to lie in the grass with them a
    trail of ants carrying huge crumbs, and let a little of their wonder rub off you
    – and to show them by your pleasure at being there, that wonder is a worthwhile
    use of time. This will help you wind up with a kid who is capable, hardy, and
    finds fun in creation as much as in consumption… making life cheaper and more
    relaxed in the long run.


    Give your child a regular sum of spending money. Explain how they could use it
    to get some things now, or to save for bigger. Then let them make the choices.
    Increase the amount of money and what they are expected to buy for themselves
    out of it every year, adding a few more tips about budgeting each time. By the
    time they are teenagers, have them totally responsible for whole areas of their
    spending (for example, their clothing, entertainment and snacks budget). This
    gets kids thinking'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'about ways to make money go further, and teaches them appreciation for what
    they consume.


    # Spend as much time in natural and outdoor environments as possible.


    If you have a garden, make sure you leave a wild, unplanned area where kids can
    wreak havoc without you getting stressed about it. Society teaches that happiness
    comes from ‘getting’, but nature-time helps kids realise it also comes from ‘doing’,
    and even from just ‘being’. Best of all, they will usually play independently
    for hours on in such places, which is brilliant for your mental health.


    If your child has grandparents, and you don’t live near them, consider moving.
    Or beg them to move closer to you. Also, as much energy as it takes into working
    out some good reciprocal arrangements: one or two days a week, you mind a friend’s
    child and they do the same for you (or increase this to three or four children
    who all play together, rotating between several different houses throughout the
    week.) Also, maximize time when you hang out with several people and a pack of
    kids. The kids disappear into their own universe of play, and only interrupt the
    adult fun if they’ve grazed their knee. A perk of both these set-ups is that kids
    have to figure out how to get along with different ages and genders, whereas at
    childcare centres or schools they end up in homogenous little cliques.


    Avoid making them special food. They eat what you eat, maybe minus the chilli
    sauce. If they refuse to eat it, don’t fret, they won’t starve. Involving them
    in cooking food makes kids much more inclined to eat it, and regularly eating
    together helps them respect and enjoy food and learn basic operation of a knife
    and fork by imitating you.


    Make rules, have expectations. You and this small person have to create a functional
    life together, or you will end up feeling blowbeaten. Make it clear that you will
    never buy candy from a supermarket checkout, no matter how big the tantrum. Make
    it clear that of course they will join in doing the housework every Saturday morning
    – involve them in discussing what chores might be best to have as their special
    jobs, and also in discussing what fun you’ll do every week when you’re finished.'
