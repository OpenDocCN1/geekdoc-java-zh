  md: '+   * You suspect that some of your consumption is having unpleasant side effects
    on your wellbeing.

    * You can enjoy the simplest things, feel that spending money in certain ways
    is almost obligatory if you want to be a fully-fledged member of society.

    * You feel like the amount of paid work you need to do doesn’t leave enough time
    or energy for the rest of life.

    * You recognize how lucky you are to live in a society of such material abundance
    and convenience as to have been unimaginable for most of human history...

    * ...but you also times feel overwhelmed by the endless choice and expectation
    that such a society brings. Confused that everything you’re supposed to do to
    take part in modern life is increasingly acknowledged to be simultaneously sabotaging
    the very future of the planet as we know it. Dang.


    If you are still trying to figure out what to do with these feelings, let this
    book be your primer for a life less dependent on the comforts of consumption,
    and more focussed on extracting maximum pleasure from the most essential parts
    of being human.


    If you’ve already started changing your life in reaction to these feelings, let
    this book be your companion in forging an existence rich with pleasures both deep
    and cheap. Let it add to your box of tricks for living frugally fantastically.
    Let it be there for when you feel that your resolve to live like that needs a
    pep talk. Or just whenever you need a charming and erudite little (modest cough!)
    to help win your less frugal friends over your way of doing things.


    # About frugality and hedonism


    Frugality is commonly seen as the domain of the hair-shirt martyr, not to be entertained
    by any sane person who can afford all Nice Stuff there is to buy. Your authors
    would like to demur. One of our biggest motivations for being frugal is hedonism.'
