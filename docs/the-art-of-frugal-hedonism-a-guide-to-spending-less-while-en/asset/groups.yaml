    # 21. Don’t be a selfish %$#


    Not over-consuming is simply the polite thing to do on a fair about finite resources.
    We will assume that you, dear reader, know a fair amount about this situation
    already, and have possibly felt waves of paralysing doom crashing about you when
    contemplating the huge cogs of industry and economy that seem to churn relentlessly
    forward choming up all that was sparkling and rich with energy and fertility stores
    laid down over millions and zillions of years. Merde!


    Despite this awareness, most of us struggle to make the connection between our
    personal habits and suck: in any visceral fashion. That’s not surprising, given
    that the chains of supply and disposal enabling our consumption are now largely
    distant or hidden. For most of human history, we have been used to social and
    environmental setups where we behave irresponsibly or greedily or lazily, life
    begins to suck: our neighbours shun us; our crops fail; all our assets go to pot;
    our animals die; our drinking water fouls. Over time we have come to trust this
    mechanism that tells us that ‘if life is really pleasant, then we can’t be doing
    anything too bad’. So now, in this warped setup, which enables us to comfortably
    and repeatedly do lazy, greedy things – causing really unimaginable harm – we
    just can’t quite believe that our behaviour could be deeply problematic, because
    our living conditions are so freaking’ pleasant.


