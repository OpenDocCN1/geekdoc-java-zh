    ## 30. People who need people are the luckiest people in the world


    Beyond sociable business and barter, lies the even-less-formal informal economy.
    A.K.A. the gift economy, reciprocity, social credit. This is where you do helpful
    stuff for people, mostly because it feels right*, but probably also with an underlying
    sense that what goes around, comes around.


    This reciprocity can be direct and conscious (bringing a bag of excess apples
    as a token of your appreciation to the neighbour who helped you find your lost
    puppy), or much more diaphanous and subconscious. Perhaps you have a friend who
    you''ve lent your chainsaw to when he needed one. One day you mention that your
    old computer has given up the ghost, and because he was planning to upgrade his
    anyway, he decides to do it sooner than later, and gives his old laptop to you
    instead of trying to hook it on eBay. In all likelihood he doesn''t consciously
    view this as a reciprocal act for all the years of chainsaw lending, but because
    you inhabit a place in his brain associated with generosity, he feels good about
    helping you out.


    Your authors have noticed a popular presumption hanging about, that being able
    to pay for whatever you need, but that you don''t have to rely on anybody else,
    is a Most Desirable State Of Affairs. But as with many things, the dose makes
    the poison: a measure of financial independence is convenient, but make money
    the dominant mode by which you satisfy needs and wants, and you start missing
    out on a whole lotta living. You can also become a lonely grouch.


    Scene 1a. Your family is moving house, but you don''t have a car or the budget
    for a renovalist service. You organise three different friends to each do a favor
    or two with you over the course of a week. You make sure your cooking stuff gets
    there on the first night, and cook a huge batch of stew, and each night you have
    dinner with the friends who''ve just helped you, sitting on make-do furniture
    in your new living room.


    One of these friends has a superbly aesthetic eye, and as you pour her a second
    glass of the wine you’ve bought to demonstrate your gratitude, the muse strikes
    and she suggests several clever ways you could tart-up your new house cheaply
    and easily. Another friend insists on staying for after dinner to help you unpack
    boxes, and after stumbling across your childhood photo album you wind up telling
    your kids stories when you were their age — they even seem gratifying riveted.
    By the end of the week, all your stuff is moved, and the house already feels like
    a home from the presence of so many people eating and laughing there.


    Scene 1b. Your family is moving house, and you hire a removalist service to come
    shift the lot.


    Scene 2a. You are cruising down Main Street in a tiny country town, looking out
    for the turn-off to the house of a friend who recently moved there. There is hardly
    a sign to be seen, so you pull alongside an old man sitting on a bench with what
    turns out to be a rooster in a cardboard box. He tells you where to find the street
    you’re after, and while you’re chatting, launches into a rheumy-eyed recollection
    of how the town once had an eccentric mayor who lived on that street, and who
    imported three reindeer that he would saddle up for his triplet daughters to take
    rides on the front lawn. You feel chuffed with this gem of local knowledge, and
    continue on your friend’s house bearing your new story as a gift.


    Scene 2b. You are cruising down Main Street in a tiny country town, on the way
    to your friend’s house. You use your car’s GPS to locate the street. You drive
    there.


    Scene 3a. You are going camping for a few days in a remote spot. You’ve rented
    a car to get there, and are borrowing a friend’s Esky (an item also known as a
    ‘cooler’ or, rather charmingly, a ‘chilly bin’). You see little excuse for buying
    one of your own, since your camping trips mostly involve hiking and eating out
    of a backpack. When you bring the Esky back to its owner after the trip, he gets
    inspired by your description of the stunning area that he decides to make a journey
    himself in a few weeks. You agree to loan him sleeping mats for the trip, and
    when you stop by to drop them off, he has a house guest staying who works in a
    university in Montreal – which just happens to be where you''re looking at applying
    for a job next year. He launches forth with all sorts of advice about the city,
    some of which helps you make a much better decision about how to make the move.
    For the camping spot, it goes on to become one of your friend''s favourite places
    in the world, and he forever warmly associates you with his discovered it.


    Scene 3b. You are going camping for a few days in a remote spot, and you drive
    down to Kmart and buy yourself an Esky to carry your spoiled food in.


    By not using money as the automatic solution to a need, we''re compelled to depend
    on other humans, leading by default to a diversity of experiences. We are also
    incited to be both sociable humans, and fair humans, because to not look after
    our connections by being dependable and would leave us with a deficit of the social
    credit needed to get help from those around us.


    Sitting in a garden may be lovely, but sitting in a garden knowing that your compost
    is helping those pumpkins grow rambunctiously, and watching the bees pollinate
    the flowers that will become the apples you will eat, is a whole other magnitude
    of lovely. Blurring the lines between your functional and social relationships
    creates a similarly rich and complex feeling of being part of an ecology that
    you look after and looks after you. That which we like is pleasant to us. That
    which we need is precious.


    > The truth about Epicurus

    Epicurus was an ancient Greek philosopher who lived from 341 to 270 BC. For most
    people, his name carries with it the stink of rich cheeses, the sloshing of wine
    pitchers, and a general association with luxury. Records tell us that he was indeed
    partial to cheese, and was a great advocate for taking full pleasure in the sensual
    world, but in a manner far removed from the excessive indulgence suggested by
    his modern reputation. In fact, he firmly believed that simple meals provided
    as much joy as opulent ones, “Do not spoil what you have by desiring what you
    have not.”


    Companionship, on the other hand, he regarded as vital: “Of all the things which
    wisdom provides to make us entirely happy, much the greatest is the possession
    of friendship.” Epicurus thought people should never eat alone, and should live
    close to a circle of friends who would nourish each other’s minds, help each other
    in daily life, and support each other in times of struggle. He candidly described
    friendship as something which starts from a point of need, or from the hope of
    mutual benefit, but then grows into sheer pleasure at having the other person
    in one’s life. also viewed friendship without some element of mutual need as being
    somewhat vacuous.


    Come on, look at those svelte cheekbones and tell us this wasn''t a man who needed
    nothing more than some watered wine and barley cakes to have a good time.


    Not one for merely bandying lofty ideas around, Epicurus created The Garden, a
    sanctuary outside Athens where those interested in studying his philosophies (including
    women – what would the neighbours say!) could live together by the Epicurean principles.
    Following his dreams obviously worked out well for him, despite developing nasty
    kidney stones that made urination impossible in his old age, he apparently never
    complained about his suffering, and even wrote a letter to a friend on his last
    day on earth that described his mental state as “blissful”.


    * Apparently, it also feels right to your body. A plethora of research on social
    connectedness shows that feeling like a member of a strong social and functional
    community – get ready for it – improves your antibody response, lowers your cortisol
    (stress hormone) levels, improves sleep, slows physiological aging, improves recovery
    after coronary heart surgery, decreases depression, mortality, morbidity, and
    obesity. Shazam!

