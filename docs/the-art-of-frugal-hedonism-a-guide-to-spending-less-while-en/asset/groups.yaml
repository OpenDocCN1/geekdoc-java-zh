    “为了闲适而休闲。”哪种翻译都暗示了在古希腊，工作本身并不被视为具有巨大内在价值的事物。


    关于逃避工作的一种现代污名，是将其与旧欧洲阶级制度中享有特权的娱乐贵族联系在一起。中世纪的下层阶级在意识形态上，似乎并不更有动力于那些不必要的工作。虽然在农业条件（或你的封建领主）恶劣的地方，劳作确实艰辛且漫长，但也有迹象表明，农民的生活可能相当欢快。


    例如，15世纪法国的记录显示，平均每四天就有一天官方假期，而且这种假期通常意味着农民的狂欢节庆。在14世纪的埃塞克斯，估计临时劳工每年的工作时间不超过120天，这并不是因为缺乏机会。埃伦·赖希在《街头跳舞：集体喜悦的历史》中写道：“从15世纪开始的时期可以被看作……一场漫长的户外派对，中间穿插着阵阵苦役。”


    手工艺人似乎也对非必要的劳动没有任何道德上的负罪感；随着工业时代的齿轮开始转动，这一事实让虔诚的人们感到痛苦。贸易评论员约翰·霍格顿在1681年叹道，织织工和丝袜制造者一旦“他们的作品卖出高价”，就不再投入劳动了，并描述他们“只要手里有一分钱，大部分时间都待在酒馆或玩九钉游戏……”


    让我们到此为止，让晕晕目眩的大脑休息一下！我们不知道你们怎么想，我们的作者实际上对“只做够支付基本需求的工作”这一概念感到有些不以为然，并将时间视为一种可以塑造的弹性物质——甚至像我们一样可以无止尽地浪费。我们挣扎着想要摆脱“持续的成就是过价值生活的关键”这种观念。但如果事实并非如此呢？我们在历史中的调情暗示，成就可能是一种被夸大的、相对现代的习惯。也许花更多时间去观察这个世界，在我们自己迷人的内心进行越野探险，并享受其他人类的内心，也是件好的。


    ![](img/c65bfef74f426d079910ef9e22fa68dc_101_0.png)


    亲爱的读者，我们是第一个承认某些工作感觉像是对时间的极佳利用的人。我们通过许多真正有意义的事情赚了钱；这些事情让我们受到学习和思考的刺激、结识迷人的人、创造我们感到自豪的事物、前往不常的地方。但我们并不认为任何人应该在从不质疑整个方程式的情况下，就把生命的大部分花在工作上。因此，我们建议从黑板前后退一步，更好地观察那些写在上面的历史故事以供你沉思。将你自己和它们一起放进调酒壶里，将它们的球体与你的球体混合在一起。然后思考一下。


    ## 减少工作的额外红利


    - 即使你热爱你的工作，如果你觉得不是被困每周工作 x 小时、每年工作 x 周、无休止，你可能会更热爱它。

    - 如果你*不*热爱你的工作，减少工作时间可以让你欣赏它的优点——社交性、它让你保持健康的方式，或者它带你去原本不会去的地方。即使是一份你认为讨厌的工作，当你减少它的时间有时也可能变得有趣——你其实并不讨厌那份工作，而是讨厌它主导你生活的程度。

    - 减少工作几乎总是能帮你省钱。你可能会减少与工作相关的支出（交通、你在其他地方不穿的衣服、一个你觉得必不可少的最新 iPad）。你可能会减少在缓解压力方面的支出（瑜伽课程、补偿性酒精或治疗账单）。你可能可以放弃一些“忙碌的触发因素”，比如频繁的外卖、省时家电，甚至是一辆车。


    当然，缩减工作生活并不总是像要求少上几个班那么简单。对于某些人来说，这需要进行严肃的人生调整：重组或职位共享你的角色、自愿降职或改变职业。如果你被沉重的房贷或车贷还款所累，可能意味着要搬到较小的房子，或者公共交通更更好的地区。


    ## 24. 带上一个包


    呃，我们不确定自己需要多少包，但当我们出去时，我们可能需要一个。如果我们买了东西，就可以把它放进包里。如果我们什么都没买，就不需要包了。但如果我们确实需要某些东西，有包比没有好。所以，当我们出门时，我们应该带一个包。这是应对可能发生的任何情况的一种简单方法。


    ![](img/c65bfef74f426d079910ef9e22fa68dc_103_0.png)


    > 没有这些东西，生活其实很好。


    ## 25. 注意你何时已经足够了


    当她在逛街时，她列了一份清单：


    ![](img/c65bfef74f426d079910ef9e22fa68dc_104_0.png)


    走向收银台时，安妮对购买这些厨具产生了反感。她脑子里有一个小声音在说：“没有这些东西，生活一直很好，为什么要买？”她把厨具放回架子上，空手离开了商店，这种感觉意外地好。那两个厨具总共只要1.98美元，所以绝对不是价格阻止了她的购买。而是意识到自己并不需要它们带来的愉悦轻盈感。


    我们在现代生活中会花费大量的精力来统计我们可能缺乏什么。大多数人脑子里都带着一个意识或无意识的“如果……更好”清单，并不断对其进行更新和修订。发现你的生活到为止过得很好，甚至可能很不错，仅仅依靠你已经拥有的东西，这会是巨大的解脱。


    这种提问的方式绕过了人类大脑中一些常见的错误。在大多数情况下，购买新物品确实会让生活的某些方面变得更容易或更美好，而我们大脑在预期这一点时并没有考虑购买的全部价格——等等。


    所以，下次你想买某东西时（无论是漏勺还是整个新厨房），你想要问自己的问题可能不是“这会让我的生活更好吗？”，而是“到目前为止，没有我的生活过得糟糕吗？”


    ![](img/c65bfef74f426d079910ef9e22fa68dc_105_0.png)

