    credit needed to get help from those around us.


    Sitting in a garden may be lovely, but sitting in a garden knowing that your compost
    is helping those pumpkins grow rambunctiously, and watching the bees pollinate
    the flowers that will become the apples you will eat, is a whole other magnitude
    of lovely. Blurring the lines between your functional and social relationships
    creates a similarly rich and complex feeling of being part of an ecology that
    you look after and looks after you. That which we like is pleasant to us. That
    which we need is precious.


    > The truth about Epicurus

    Epicurus was an ancient Greek philosopher who lived from 341 to 270 BC. For most
    people, his name carries with it the stink of rich cheeses,'
  - '[PAGE 120]


    the sloshing of wine pitchers, and a general association with luxuriant gourmandising.


    Records tell us that he was indeed partial to a spot of cheese, and was a great
    advocate for taking full pleasure in the sensual world, but in a manner far removed
    from the excessive indulgence suggested by his modern reputation. In fact, he
    firmly believed that simple meals provided as much joy as opulent ones, and saw
    extravagant desire as a surefire happiness-squisher: “Do not spoil what you have
    by desiring what you have not.”


    Companionship, on the other hand, he regarded as vital: “Of all the things which
    which wisdom provides to make us entirely happy, much the greatest is the possession
    of friendship.” Epicurus thought people should never eat alone, and should live
    close to a circle of friends who would nourish each other’s minds, help each other
    in daily life, and support each other in times of struggle. He candidly described
    friendship as something which starts from a point of need, or from the hope of
    mutual benefit, but then grows into sheer pleasure at having the other person
    in one’s life. He also viewed friendship without some element of mutual need as
    being somewhat vacuous.'
  - '[PAGE 121]


    ![](img/c65bfef74f426d079910ef9e22fa68dc_121_0.png)


    Come on, look at those svelte cheekbones and tell us this wasn''t a man who needed
    nothing more than some watered wine and barley cakes to have a good time.


    Not one for merely bandying lofty ideas around, Epicurus created The Garden, a
    sanctuary outside Athens where those interested in studying his philosophies (including
    women – what would the neighbours say!) could live together by the Epicurean principles.
    Following his dreams obviously worked out well for him, as despite developing
    nasty kidney stones that made urination impossible in his old age, he apparently
    never complained about his suffering, and even wrote a letter to a friend on his
    last day on earth that described his mental state as “blissful”.


    * Apparently, it also feels right to your body. A plethora of research on social
    connectedness shows that feeling like a member of a strong social and functional
    community – get ready for it – improves your antibody response, lowers your cortisol
    (stress hormone) levels, improves sleep, slows physiological aging, improves recovery
    after coronary heart surgery, decreases depression, mortality, morbidity, and
    obesity. Shazam!'
