    ladder comes identifying a low-tech solution , or using an object that already
    exists.


    Let’s use that couple in their old cottage to illustrate. They don’t install solar
    panels, but they do install a second-hand skylight in the main living space that
    they don’t need to use the lights as they need (low-tech, pre-existing object).
    They don’t even rip out the old gas heater to put in a new slow combustion one,
    but scarcely use it, because they fill in all the drafty chunks around the doors
    and windows, and use all the tricks mentioned in tip “44. Accclimatise to the
    seasons ” to stay warm and cool (pre-existing object, low-tech, behavioural).
    They also save energy in myriad small mills as they need when making hot drinks,
    using lids on cooking pots, and turning the oven/stove burners off early so foods
    cooking via residual heat (all behavioural). The beauty of such solutions is that
    not only are they the most resource frugal, they’re also usually the most financially
    frugal.


    # Self-sufficiency accessories


    If part of your vision for your Frugal Hedonism makeover includes doing a fair
    bit of home production, this one’s for you. In all the rampant excitement of contemplating
    your new way of life, you might feel inclined to go hog-wild buying accessories
    to ‘help you do it properly’. Preserving kits, grain mills, dehydrators, specialised
    gardening tools, ice cream/yogurt/bread makers, sprouts, fermentation crocks,
    seed-raising igloos; the potential for spending is endless. Several of these products
    are really great to use, and some of them help do the job more safely (e.g., home
    preserving kits do make it easier to sterilise the jars). None of them are particularly
    necessary however.'
