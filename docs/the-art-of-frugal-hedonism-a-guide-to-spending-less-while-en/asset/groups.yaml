    The Weed Forager''s Handbook:

    A Guide to Edible and

    Medicinal Weeds in Australia


    **by Adam Grubb and Anne Raser-Rowland**


    Step into the world of our least-adired botanical companions, peel back

    t layers of prejudice, and discover the finer side of the plants we call

    weeds. An astonishing number are either edible or medicinal, and have

    deep and sometimes bizarre connections to human history.


    But how do you distinguish a tasty sandwich-filler from its dangerous

    look-alike?


    Which of these garden familiars is the most nutritious vegetable ever

    tested by the US Department of Agriculture?


    How do you cook with delicious nettles without fear of being stung?


    This book reveals all this and more, and will forever change your concept

    of where to go looking for lunch.'
- md: '

    ## The Art of Free Travel:

    ### A Frugal Family Adventure


    **by Patrick Jones and Meg Ulman**


    Patrick, Meg and their family had built a happy, sustainable life. But in late
    2013, they found themselves craving adventure: a road trip.


    But theirs was a road trip with a difference. With Zephyr (10), Woody (1) and
    their dog, they set off on a year-long cycling journey along Australia’s east
    coast, from Dalesford to Cape York and back.


    Their aim was to live cheap – guerrilla camping, hunting and foraging. They spent
    time in Aboriginal communities, joined an anti-fracking blockade, documented edible
    plants, and dodged speeding trucks on the country’s most dangerous highways. *The
    Art of Free Travel* is the remarkable story of a rule-breaking year of ethical
    living.


    ## Permaculture Pioneers:

    ### Stories from the New Frontier


    **edited by Caroline Smith and Kerry Dawborn**


    These compelling stories describe how ordinary people found the courage to embrace
    the world’s problems and move beyond fear to make a difference and empower others
    with solutions and practical actions, as inspired agents of change.


    This anthology is an inspiring addition to permaculture publications, and of interest
    to anyone concerned with social and environmental change.


    One of the book’s key messages is that everyday folk do not have to wait for experts
    and governments to lead. The experiences of the Permaculture Pioneers illustrate
    that we can all be courageous and creative. We all have the tools to empower ourselves,
    rather than simply being dragged along in a flow we feel we cannot escape.


    ## Permaculture:

    ### Principles and Pathways

    Beyond Sustainability


    **by David Holmgren**


    Permaculture co-originator David Holmgren’s seminal work, *Principles and Pathways*
    draws together and integrates 25 years of thinking and teaching to show a whole
    new way of understanding and performing a simple set of design principles.


    Relevant to every aspect of how we reorganise our lives, communities and landscapes
    to creatively adapt to ecological realities which shape human destiny.


    For the general reader this book provides refreshing perspectives on a range of
    environmental issues and shows how permaculture is much more than a system of
    gardening. For anyone seriously interested in understanding the foundations for
    sustainable design and culture, this book is essential reading.


    ## RetroSuburbia:

    ### A Downshifter''s Guide to a Resilient Future


    **by David Holmgren**


    *RetroSuburbia* explains and illustrates patterns, designs and behavioural strategies
    applied by those already on the downshifting path to a resilient future, using
    permaculture ethics and principles.


    It offers design solutions to problems faced by those applying a more systematic,
    whole-of-household approach to retrofitting their homes, gardens and living arrangements.


    It includes some proven design specifications and pointers, references technical
    sources and case studies, but is more of a strategic guide than a technical manual.


    For more about this title visit [RetroSuburbia.com](http://RetroSuburbia.com)


