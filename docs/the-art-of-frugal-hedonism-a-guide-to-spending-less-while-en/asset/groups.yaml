    whole lot. The first few sessions in a steaming kitchen, simmering tomatillos
    into chutney, bottling quinces, stripping branches of basil to make into pesto
    for freezing, and slitting olives for brining, were pleasant enough. Put on an
    audio book and potter away. By the time Annie Annie had gotten through War and
    Peace on CD, she was beginning to pine for you, you know, some kind of life. With
    people in it.


    She got really quite cynical about the joys of home food production, until a day
    come where she took her bushel of broad beans that needed podding with her when
    she popped over to have tea with her neighbour. (Young broad bean dip is delicious
    and freezes well: pick them when they''re only fingernail-sized so they don''t
    double podding, lightly steam the poached beans after mashing up with olive oil,
    feta, lemon juice, salt and pepper.) After an hour''s casual chatting, they had
    not only caught on life events and worked out the details of the mulch delivery
    they were going to share, but all the broad beans had been podded, and no one
    had even noticing it.


    What a discovery! Apricot-bottling luncheons followed! Gregarious evenings shredding
    old telephone books while drinking apple cider and singing karaoke became a high-rotation
    activity! The devil may find work for idle variety: but from our observations,
    he is quite happy for it to be of the menial agricultural variety: put a pile
    of peas on the table to be shelled, and empty-handed company will reach for them
    as eagerly as if they were a bowl of salted peanuts. This is why people smoke?
    Need drinks to clutch at parties? A of us may be oxalic, but we are manually fixed
