  mdcn: '

    极具有**变成垃圾的潜力**。……例如，任何制作得糟糕的东西。一种新类型的保湿乳或果酱，“仅仅是想试一试看”，尽管事实上你已经有了充足的保湿乳或果酱。任何一次性的物品。又或者在你已有的五条黑裤之外，再买一条剪裁略有不同的黑裤。任何非常合乎潮流的物品。


    你可能听过以下建议，因为我们有许多人仍然忘记了这样做：“在你去买菜之前，先检查你家里已经有什么……”这不仅仅是为了避免冰箱里最后多出三罐蛋黄酱，更是为了购买能补充你已有食物的物品。如果这包括一根快速枯萎的茄子和一些需要处理的菲塔奶士，再加上冷冻室里的几块平饼和花园里的迷迭香，你可以在购物清单上加上大力和番茄酱，这样就可以把它们做成披萨。如果你买的某东西比需要的多，把一半放在冷冻室里——敲响邻居的门问问他们是否想要剩下的。如果你只需要某样东西的一点，而且知道自己可能会让剩下的在储藏室里干掉，不如考虑根本不要买（！）。


    其次，看看你正要扔掉的任何东西，评估它的实用潜力。如果它对某人可能有价值，找个捐赠的地方，或者在村里的口口相传传出它闲置了（也许可以使用专门广告此类物品的优秀网站——详情请参阅我们的“资源”部分）。和朋友一起尝试换装活动——它们会非常好玩，每个人带走的都是自己喜欢的东西，而减少了不需要的东西。旧衣服可以放入抹布袋中用于清洁或制作物品。罐子洗干净后用于罐子发挥用场的地方。旧蔬菜可以做汤；酸牛奶可以做煎饼（事实上是最好吃的煎饼）；旧水果切掉任何坏掉的部分进行炖煮。


    ![](img/c65bfef74f426d079910ef9e22fa68dc_35_0.png)


    # 避免垃圾策略 #16


    延续我们果酱的主题，不要扔掉那个还有最后厘米甜味的罐子——往里倒一点温水摇一摇让它松动，然后在炖水果时加进去。然后涂在那些煎饼上。没错！一点剩余的咖喱或炒菜可以加入米饭，再配上一些额外的蔬菜和一个煎蛋，奇迹发生！晚餐，2.0
    版本！坚硬的面包可以切成块，烤一下后丢进沙拉、汤或意面中。当一个人呆呆地望着空处看不见任何价值时，一个节俭享乐主义者看到了一顿丰盛晚餐的可能。关于这一点，请参考“与食谱保持开放关系”。


    我们的第三种消除垃圾策略并不适用于所有人，但它能帮你节省最多的钱。在废弃流中进行购物。我们的作者选择从我们拥有的东西中获取所需，我们亲切地称为“富华文化大卖的丢弃馈赠”。如果你保持留心，并耐心等待你想要的东西，家具、电器设备和建筑材料通常可以从人们留在房子外的堆积物，或从废弃品商店和垃圾场中捡到。如果那里没有，可以从一个有闲置或旧设备但不使用的的朋友那里获得。


    这种策略并不总是能带来质量最好的装备——尽管它同样可能让你得到一些真正的宝贝——但它有点像一张道德和财务上的“无赦金牌”。如果某东西在你拯救它之前注定会变成垃圾，你就不需要担心它的制造状况，或者它是否是一项“值得的投资”。而且，如果路上出现了更好的……你只需把它放回街上……


    # 还能低到什么程度？节俭的悬念！


    警告：下文中提到的几种情况涉及在标准供应渠道之外操作。如果你打算这样做，尊重你的来源是极其重要的，不要为其他可能也在使用这些资源的人破坏事情。这通常意味着：不要留下混乱，不要把所有东西都据为己有，并对任何质疑你所做的人保持礼貌。


    无耻之鸟有虫吃。如果你准备抛弃“别人会怎么想？”这个因素，通过那些本会浪费的物品来满足生活的机会就会真正展开。我们的作者认为浪费是愚蠢的，而明智是有趣的，所以我们倾向于将其抛之脑后，直接行动。


    我们从垃圾桶中救出了高质量的食物盛宴（更不用说我们数不清的许多啤酒）。我们吃过极佳的路动物（在检查了新鲜度且没有疾病后）。我们从桥下铲走了所有的袋干鸽子粪（这是曾点缀芦笋地最优质的肥料之一）。我们从路边绿植中收集了大量的落栗子（导致冷冻室里存了足够多的，我们整个冬天都在吃栗子）。


    我们有一个朋友从当地有机商店收集可堆肥的垃圾，商店节省了处理费用，而他在自己的花园里处理。作为感谢，他们现在还会送给他即将过期的乳制品，他把任何不能不用的送掉。我们还有另一个朋友在任何活动结束时加入，所有剩余的美食即将被倒进垃圾桶时。作为感谢，他们现在也会送给他即将过期的乳制品，他把任何不能不用的送掉。


