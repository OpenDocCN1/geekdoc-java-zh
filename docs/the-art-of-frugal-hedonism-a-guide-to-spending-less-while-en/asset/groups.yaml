    the majority of your adult life to paying for, shopping for, and maintaining a
    building, not having that Perfect Space For Effortlessly Entertaining Up To Twelve
    Guests (which end up using 1.73 times per year), is probably a worthwhile trade-off.


    # The Zen of non-renovating


    In the old days, people bought a house, fixed up any broken bits or peeling paint,
    and got on with life. Now, we renovate. Renovation (or ''remodeling'', as it is
    known in the U.S.) has become a truly massive industry over the last two decades.
    Home improvement expenditure in America doubled between 1995 and 2013, despite
    the population only increasing by about one fifth. It has the excuse for a lot
    of really over-zealous lifestyle television, and pretty much The Expected Thing
    To Do whenever you buy a building that is a little out of style or worn around
    the edges. Finishes, finishes and floor plans that looked dated became unacceptable,
    no matter how serviceable. Renovating the house has become another task looming
    over people ''to get around'' as soon as they can find enough money or time. More
    than ever before, houses seem to be extensions of our self-image, and hence need
    grooming if we are not to feel badly about them.'
  - '[PAGE 165]


    Your authors have long regarded folk who don''t care how their houses appear to
    other people as being somewhat enlightened – after all, there infinitely more
    important things to be admired than your style of accommodation. This gave us
    a revolutionary idea. It''s not for everyone, but we''re sure some people could
    take to it like liquid nails to a laminate-splashback. Don''t renovate. As mentioned
    in the main part of this tip, a better home doesn''t actually alter happiness
    levels, and just because something can be done, doesn''t mean it should be done.
    Perhaps that house is just fine being imperfect. (See “Notice, When when you have
    enough ” for more on this elevating ethos. Repair anything that''s non-functional,
    or will cause more work later (like rusted gutters that let the rain sheet down
    your walls and rot the woodwork). Create atmosphere with lamps, favourite pictures,
    good smells, music, may be a lick of paint. Then the rest, and get back to all
    the other stuff the world has to offer. This approach has the gigantic advantage
    that you''re unlikely to become overly precious about your domestic space, as
    so many people can''t help but do once''ve poured buckets of cash, sweat and tears
    into it.


    DISCLAIMER: Anne once spent a whole week making sequined curtains and has absolutely
    no regrets. Your authors aren''t condemning home beautification, we just don''t
    think you should do it to live up to anyone''s standards but your own.'
  - '[PAGE 166]


    # 43. Let yourself be grossed out


    Anyone who''s been drawn to pick up this book has likely felt a little grossed
    out by overconsumption at some point or another. There can indeed be something
    existentially depressing about gazing at the mountains of junk that spill out
    of people''s garages, the endless TVs dumped on the street because people have
    upgraded to the latest model, the sight of someone stuffing a final few mouthfuls
    into a stomach already fit to burst before getting up from the restaurant table.


    You might feel like a party pooper, but we say let this emotional tide rip: feeling
    disturbed is a natural, adaptive response to watching profligate resource use,
    and is a feeling worth heeding. Don''t let it eat you up, just let it become a
    tool to help remind how you don''t want to operate.'
