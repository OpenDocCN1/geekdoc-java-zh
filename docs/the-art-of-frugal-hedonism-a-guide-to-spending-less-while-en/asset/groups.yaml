    scratching our heads and saying “Hold on a minute, I think I''d like the version
    where the machines have us all doing less work please?


    Such a big question rarely has a single answer. One culprit is surely this culture
    we''ve created that equates having an insignificant work life with being bit of
    a loser. This certainly seems a bad scene – when it comes to status, our glitchy
    psyches have a tendency to endlessly fight up the ante, meaning it becomes almost
    impossible to ever feel content with what we''ve achieved. So we strive and produce,
    without stopping to consider how necessary the products of our strivings really
    are.


    Another factor may be those murky machinations of The Powers That Be. Some cultural
    commentators think that since a population whose lives are dominated by work is
    more docile, governments tend to gear policy towards this end – consciously or
    not. And that the corporation CEOs with whom our political leaders play golf have
    a similar agenda. As popular blogger David Cain puts it: “Keeping free time scarce
    means people pay a lot for convenience, gratification, and any other relief they
    can buy. It keeps them watching television, and its commercials."


