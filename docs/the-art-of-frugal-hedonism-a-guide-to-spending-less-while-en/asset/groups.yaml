    An overview of data from across the social sciences has found that once basic
    needs have been met, “increases in our stocks of material goods produce virtually
    no measurable gains in our psychological or physical well-being”, despite our
    expectations to the contrary. Experiences, on the other hand, really deliver.
    So why don’t we think of them as a good investment? Possibly because the memories,
    pleasure, human camaraderie and learning that they bestow an easily measurable
    dollar value.


    James Wallman, author of Stuffocation , has come up with five big factors that
    help explain why experiences win:


    +   1. **The hedon treadmill.** This is the process of getting used to, or even
    bored of, material acquisitions we once coveted, so that we constantly need new
    acquisitions to maintain the same level of happiness. It doesn’t happen with the
    memories or expanded sense of self that we gain from significant experiences.


    +   2. **Positive reinterpretation.** When we buy an unsatisfactory material product,
    we just tend to feel pissed off. When an experience goes wrong, it can be as worthwhile
    as it goes right. Think of time that you journeyed to the beach for a nice day
