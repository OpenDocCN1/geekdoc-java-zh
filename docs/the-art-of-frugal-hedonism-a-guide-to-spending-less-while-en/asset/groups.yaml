- md: '

    about how during wartime people got healthier, social bonds got stronger, and
    treats felt... trattier.


    Animal, Vegetable, Miracle by Barbara Kingsolver. (HarperCollins 2007). Kingsolver''s
    genius is her ability to take what could seem to some like threateningly left-wing-greeningie
    values, and present them in a way that makes apparent how much they have in common
    with classic conservative values: self-reliance, thrift, strong family and community
    bonds. This book charts the family''s year of trying to eat almost exclusively
    off of their farm. Her novels are worth reading too, and tend to cleverly wrap
    staggering ecological questions up in what can at first glance seem like easily
    digestible airport fiction.


    The Woodsman''s Cottage (series 9, episode 13, of Grand Designs. Fremantle Media,
    2003). Several people have mentioned to how much this story affected them. It''s
    about a British woodsman who, after 10 years living under canvas in the woods
    waiting for planning permission, builds a stunning handmade home.


    Possum Living by Dolly Freed (Universe Books, 1978). Written by a 19-year-old
    firecracker. Dolly explains “how to be lazy, proud, miserably, and honest, live
    well and enjoy leisure.” We don''t agree with a bunch of things she says, and
    some of her advice wouldn''t work in this era, but there''s buckets of infectious
    attitude, plus lots of self-sufficiency tips of the how-to-skin-a-rabbit variety.


    ## Questioning culture


    Affluenza: When Too Much is Never Enough by Clive Hamilton and Richard Denissen
    (Allen & Unwin, 2005). A definitive and damning overview of overconsumption in
    modern Australia, packed with jaw-dropping figures illustrating our ballooning
    consumption expectations. Also looks at changes that could get things back on
    track, both political and personal. (There is also an American book and related
    documentary, both called Affluenza, that deal with the ill effects of overconsumption
    in a more comedic style. Although now a tad dated, their content is still totally
    relevant.)


    Plenitude: The New Economics of True Wealth by Juliet Schor (Penguin Press HC,
    2010). An in-depth look at how the current economic model is fated, and how we
    could restructure labour and leisure to create one that isn''t. Makes particularly
    interesting points about how much of growth is illusory.


    Religion for Atheists: A Non-believer’s Guide to the Uses of Religion by Alain
    de Botton (2012). A fascinating investigation of how religion uses rituals and
    regular revisiting of many forms of emblematic art (from architecture to literature
    to music to painting) to help remind followers of how they want to behave and
    who they aspire to be. The book makes a case for using the same devices in secular
    society to make it easier for us to stay true to our best visions of ourselves
    in the face of petty distractions.


    The Lightbulb Conspiracy (written and directed by Cosima Dannoritzer, 2010). Documentary
    focussing on planned obsolescence, and other unpleasant aspects of how companies
    keep us buying as much as for as long as possible. If you had any doubts about
    the sheer rottenness of big business, this will cure you of them.


    ## Money


    Your Money or Your Life: 9 Steps to Transforming Your Relationship with Money
    and Achieving Financial Independence by Vicki Robin and Joe Dominguez (Penguin,
    2008) is an American book written to help you do an intensive life-audit so you
    can figure out where to downshift most usefully. Even if you don’t want to put
    your finances values through the book’s nine-step evaluation program, reading
    all the in-between bits about true hourly wages and contradictions between what
    we really want and how we spend is still worthwhile.


    > Happy Money: The Science of Smarter Spending by Elizabeth Dunn and Michael Norton
    (Simon & Schuster, 2013) is a research-based tour of spending, presenting five
    ways we can change our spending to makes ourselves happier. Very clever, potentially
    life-changing.


    Centre for Effective Altruism helps you figure out how to best give money away.
    www.centreeffectivealtruism.org. One of their projects, Giving What You Can, features
    a ‘How Rich Am I?’ calculator, which is good for bringing how wealthy we are relative
    to the average earth denizen: www.givingwhatwecan.org/get-involved/how-rich-am-i


    ## Work… and not doing so much of it


    > How to Be Idle: A Lofer’s Manifesto by Tom Hodkinson (Harper Perennial, 2007)
    is a charismatic and rambling incitement to do less, loaded with encouraging historical
    examples and quotes from laziness-loving luminaries of literature and philosophy.


    The New Economics Foundation: 21 Hours: www.neweneconomics.org/publications/entry/21-hours
    . It is also worth heading back to the NE home page and checking out the whole
    website.


    Centre for a New American Dream looks at the benefits of a shorter work week in
    a set of beautifully clear infographics. www.newdream.org/resources/infographics-shorter-workweek
    . Again, this whole site has loads of good stuff.


    ## Food


    Frugavor e by Arabella Forge (Skyhorse Publishing, 2011) is a great breakdown
    of how eating tastier, more nutritious food can actually be cheaper when you do
    it right – includes recipes.


    Michaelan’s suite of food-related books The Omnivore’s Dilemma, In Defence of
    Food, Food Rules, Cooked (all published by Penguin) are great for getting you
    fired up abut really appreciating what you eat.


    The Art of Fermentation by Sandor Katz (Chelsea Green, 2012) is a guide to fermentation.


    The Art and Science of Dumpster Diving by John Hoffman (Breakout, 1992). He doesn’t
    pull any punches, and touches on just about every form of.


    Putting Food by Ruth Hertzberg, Annie Vaughan (New South Books, 2013) is a guide
    to food.


    ## Housing


    A good website about tiny houses: www.tinylife.com


    House sitting: There are local networks for this, so just do an internet search
    for ‘house sitting’.


    Retrofitting: This Australian governmental site focuses on different aspects of
    sustainable building. www.yourhome.gov.au


    ## Personal transport


    - Car-sharing: There are lots of car-sharing networks, but no great central directory.
    Your best bet is an internet search for ‘car-sharing’ and your city’s name. There
    are two different models: the standard business model, where the fleet of cars
    are distributed throughout the suburbs, but are owned centrally by a company;
    and the peer-to-peer model, where people in the neighbourhood lease their car.


    - Car-pooling: There are car-pooling or ride-sharing networks for sharing car
    journeys. Traditionally car-pooling has been used for prearranging petrol costs
    over long journeys or for regular commutes to work. Recently smartphone technologies
    are opening up possibilities for more spontaneous journeys, and taxi-like distances,
    known as real-time ride-sharing.


    ## Travel


    > The Art of Free Travel: A Frugal Family Adventure by Patrick Jones and Meg Ulman
    (New South Books, 2015). As mentioned in ‘Have a lot of things you want to do
    with your liberty''


    - Couchsurfing is a network of people that let travellers stay with them. Hosting
    other travellers makes most likely to host you when you’re travelling. www.couchsurfing.org


    - WWOOF (Willing Workers on Organic Farms) is a loose network of organisations
    that connect travellers with hosts. Travellers can exchange farm work for food
    and board. Find regional networks at: www.wwo.net


    - HelpX ( www.helpx.net ) and Workaway ( www.workaway.info ) are similar networks
    to WWOOF, but also list properties that have nothing

