    \ We Do in Life and Business）。一本关于习惯形成细节的极具可读性的书籍。尽管书中某些章节旨在改进商业实践，但它提供了许多如何改变个人习惯的有用线索。\n\
    \n- Jonathon Haidt 写的《幸福假说》（The Happiness Hypothesis，Basic Books, 2006）。一本关于幸福科学的佳作。\n\
