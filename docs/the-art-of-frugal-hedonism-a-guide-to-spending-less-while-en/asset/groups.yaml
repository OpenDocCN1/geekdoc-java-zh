    # 34. Liberate yourself from the terror of grime


    Cosmetic and detergent companies would have us believe that if we don’t use large
    globs of their products on a frequent basis, our friends will all desert us, and
    we’ll develop a host of communicable diseases. Your authors suspect that they
    may be keeping their profit margins – rather than our best interests – at heart
    when doling out advice.


    By the time we are teenagers, most of us are convinced that a legion of body washes,
    facial wipes, pantyliners, skin serums, foot deodorisers and mouth gargles* are
    required to prevent ourselves from becoming repellent. Then there’s protecting
    ourselves from our hideous homes with kitchen wipes, surface sprays, grout bleaches
    and air fresheners. Folks, it’s all a big swindle. Even basics like soap, laundry
    detergent and dishwashing liquid can generally be used at one quarter the suggested
    rate to exactly the same effect, and all the other stuff is pretty much unnecessary.


    If you work in an office and take a bus to work, you probably don’t need to wash
    your clothes after a day’s wear. Heck, it’s unlikely that you need to wash yourself
    after a day’s wear, especially if you’re pretty healthy via your Frugal Hedonistic
    living. Don’t get us wrong here, we don’t like having the funk any more than the
    next guy, but we’ve experimented a bit and found being clean just isn’t that complex.'
  - '[PAGE 135]


    ![](img/c65bfef74f426d079910ef9e22fa68dc_135_0.png)


    Cowboys supposedly believed that washing too much could sap your vitality. Actually,
    we suspect we gleaned this ‘fact’ from some long-forgotten matinee movie, but
    funnily enough modern research is beginning to back the superstition up. Read
    the footnote!


    # So fresh and so clean


    Most people are wise to the wonders of bicarbonate soda and white vinegar for
    household cleaning, but here are a few other frugal home hygiene tips that might
    not have made it onto your radar yet:


    +   - Hanging clothes out on a sunny or breezy day instead of washing them. (For
    clothes that don’t have actual muck on them, but just need a bit of freshening).
    We have a vague idea that a granny once told us this was called ‘sunwashing’,
    which sounds a bit magical as a bonus.'
  - '[PAGE 136]


    +   Using newspaper to clean windows and mirrors. Start with a scrunched couple
    of sheets, dunk them in a bucket of water, and use them to do a good rubbing.
    Then get a sheet or two of dry stuff to work over the windows in a polishing motion.
    They get really shiny. It''s something in the ink apparently.


    +   Ash. If you produce any in your household, anywhere is grease, like a roasting
    dish, oven, or post-washing-sink. Just scoop out of the finer stuff into a container,
    dip a wet scrubber into it, and scrub-a-dub. We know it sounds odd, but it''s
    actually a traditional use of ash, plus it works.


    +   Having a rag bag. Paper towels are crazy-business. Cut the fabric into squares
    for ease of use, and toss them or wash after use, as you please. Old towels, sheets
    or cotton shirts are perfect.


    +   Putting on loud music and really throwing yourself into the elbow grease and
    exercise factor.


    +   Embracing Tom Hodkinson''s advice from his How to Be Free: "If you want a
    cleaner house, simply turn off the lights and fire a candle. Electric light is
    the enemy." He suggests avoiding pale bed linens unless you have a staff of servants,
    and eschewing white or laminate-coated furniture in favour of wood. Now that''s
    a clear chap.


    * So you''ve probably noticed by now that we have an inappropriate love of footnotes,
    but now you''ll think you cut us some slack over this one, because it really is
    a gem: lot of those ''germs'' that hygiene product advertisements love to warn
    us about are essentially to human health and happiness! We have symbiotically
    evolved with these little guys helping to do all sorts of jobs around our body
    that our own cells aren''t good at. And there are a lot of them on our job. Our
    skin contains around 50 million bacteria per square inch. There are ten more bacteria
    cells in our digestive tract than we have human cells in our body – in a healthy
    person anyway. Evidence suggests that pleasant breath and body odour, skin health,
    maintaining a healthy weight, immune system function and digestive health are
    all improved by encouraging a healthy diversity of bodily bacteria. Insufficient
    bacterial diversity may even contribute to anxiety and autism spectrum disorders.'
