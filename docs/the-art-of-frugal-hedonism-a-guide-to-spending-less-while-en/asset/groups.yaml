    # 38. Free up your frivolity


    The desire to buy unnecessary things is very strong – it can feel like an assertion
    of freedom from the parade of functional activities that constitute much of life;
    like leisure and light-heartedness in the face of too much work and worry. This
    kind of purchasing certainly can result in something that will be enjoyed, but
    often it is simply a flawed attempt to create a new life ratio of frivolity vs.
    functionality. Or to add ‘value’ to life by getting things that have a cost and
    hence the inherent implication of value.


    Ironically, many of these pleasure-purchases actually result in a later need for
    even more functional activity. It might be cupboards and drawers that require
    endless cleaning because they are overflowing with unworn clothes which need sorting/folding/washing/mending/taking
    to the charity donation bin; the extra jiggle on the belly that seems to demand
    an increased gym regime; the bigger house that needs more cleaning and repairs.
    On the most basic level, it might just be the credit card bill that needs you
    to do more overtime to pay it off.


    Living light-heartedly is an altogether different beast. It involves being a bit
    philosophical about bad things that happen, so that they don’t dominate your mind
    or outlook. Or retaining the ability to take delight in fleeting moments. Or recognizing
    that being frivolous, spontaneous or playful with other humans and within your
    own heart is a totally free you can give to yourself and the people around you
    as often as you like. This stuff is the real assertion of freedom from the drabber
    elements of daily life: don’t get it confused with frivolous spending.'
