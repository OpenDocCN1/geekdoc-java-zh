    feels like a home away from home


    We’re willing to bet fifty of our seldom-squandered dollars that half of the world’s
    psychologists would go out of business if there were more places like this.


    ## 16. Don’t think about money


    This book has to do with many things, and one of them is definitely money. Most
    books with anything to say about improving your relationship with money will tell
    you that you need to keep budgets and spreadsheets of your earnings and expenditure.
    This is no doubt necessary for some people who are in a tangle of debt or a financial
    pickle of some other form. We''d also recommend it as a revealing short-term experiment
    if you''re the sort who frequently peers into the leathery crevasses of your wallet
    and wonders just where all that money got to, and so quickly too! If you are either
    of these people, you likely already think, and even worry, about money a fair
    bit.


    The utterly beautiful news we have for you is that for folk who have made habits
    of minimal consumption second nature, money is something they rarely think about.
    This was one of the shocking constants your authors observed when talking to Frugal
    Hedonist friends – somehow we had been somewhat sucked into the stereotype of
    the penny-pinching miser sitting up all night counting coins by the light of a
    grubby candle stub.


    It is magnificent how it works: you operate on the general basis that you don’t
    go shopping for entertainment, and you mostly just buy stuff you really need or
    value. You repair, repurpose, borrow and share things, buy fresh produce in season,
    take packed lunches (we’ll stop there before we paraphrase this entire book within
    one of its own sentences – like some kind of conceptual babushka doll) and the
    spare money just seems to gently accumulate.


    It’s actually a gorgeously exploitable paradox of living in a first world culture.
    Our wages are set to enable a ‘basic standard of living’ that is more than basic,
    so if you can get good at livin’ on actual basics, you end up with more money
    than you know what to do with! Then you get to come up with something to do with
    it, and that part is very nice too.


    Thinking about money sounds annoying and dull. Worrying about money does not look
    fun at all. According to research it breaks up lots of relationships and raises
    blood pressure and all manner of other horrible things. Personally, we would much
    rather worship our bicycles, eat baked potatoes, have two (okay, three) pairs
    of jeans, and take very long holidays in warm climates.


    ## 17. Revel in the good brain chemistry of resourcefulness


    We met Lawrence through the couch surfers'' website. He said he could fix just
    about anything, to his word when he first turned up, after midnight, he immediately
    began repairing Adam''s ancient bicycle light, even managing to rewire a minuscule
    broken bulb. The bulb was worth about 50c. It was clear that Lawrence wasn''t
    found of waste. And he had a MacGyver-esque compulsion to be resourceful. Lawrence,
    it turned out, lived almost entirely without money. He traded his formidable plumbing,
    electrical and carpentry skills for board and whatever else he needed. If it wasn''t
    for his almost pathological affection for bad puns (“Are there any other kind?”
    P Ponders Am. “He was quite a pun of the art she wasn''t though?” quips Annie
    with glee), he would have been the perfect houseguest.


    Lawrence had taken to extremes of the seldom-acknowledged perks of frugality:
    a life liberally strewn with satisfying mini-challenges. Surveying your stash
    of scrap wood and pieces of glass and tin, figuring out how to build the greenhouse
    you''ve wanted for so long. Darling your first ever sock and feelinguffed that
    you just turned something into useful. Getting the alchemy of a homemade loaf
    of bread right. (Find links to help you do all these things and more in our Resources
    section!)


    Your authors have noticed this kind of accomplishments seem to induce the problem-solver
    a surge of pleased/proud feelings very similar to those of solving a sudoku, or
    getting to the next level on a computer game. Only with the added bonus of knowing
    that you just made some real stuff.


    Everyday life used to provide people with ample opportunity to experience the
    satisfaction of being canny, constructive, and creative to achieve an end, via
    the constant necessity of making things and repairing or repurposing them. Apparently,
    this feeling is so pleasurable that as those necessary activities which supplied
    it have dwindled, we have invented leisure activities to supply it in their place
    – cutting up brand new fabric to use recreational quilting, finding ‘shed’ projects
    to tinker on, building model aeroplanes, doing puzzles, games. We could even include
    sports in this list if we expand our definition of ‘mini-challenges’ to include
    drawing on physical resourcefulness to navigate and conquer a conundrum.


    According to Hungarian psychology professor Mihaly Csikszentmihalyi, the good
    buzz you get from these kinds of activities comes as much from the process as
    the output. He’s the man who coined the term ‘flow’ to describe the state we can
    enter when performing a task that is within our capabilities, but is sufficiently
    challenging that our skills are exercised close to their limits. We experience
    flow (also known as ‘being in the zone’ when an activity so fully engages our
    attention that we get lost in the moment. And while this book focuses largely
    on sensual and social pleasures, your authors would hazard to suggest that ‘flow’
    is an even more satisfying form of enjoyment.


    If flow were a drug, it would be cocaine. According to flow researcher Corinna
    Peifer, a flow experience resembles the more positive aspects of a cocaine high:
    “a rewarding feeling of high energy and alertness, accompanied by an improvement
    of concentration (and therefore performance), a carefree trust in one’s own abilities
    ... while forgetting about anything.”


    While flow is most associated with making art, navigating challenges within sport
    or game, frugal living gives you bountiful opportunity for similarly engrossing
    uses of your creative and physical abilities. Hone problem-solving skills so you
    can craft anything, developing an intuitive feel for cooking with raw ingredients,
    becoming brilliantly nimble on your bicycle, training your foraging eye to bounty


    By the way beloved reader, we don''t want to give you the impression that we''re
    merely junkies for the flow-buzz here. For just as lovely as the instant surge
    of pleasure that comes from using your wits well, is the ravishing sense of freedom
    that comes with knowing that you have them to be relied upon. The confidence that
    accompanies skills of self-reliance is a fine drug indeed — a drug of independence.
    And it just gets better the more you do it.


    ## 18. Grow your own greens


    Even if you haven''t done much gardening before, or just aren''t interested, we
    most fervently recommend growing your own salad and greens, and perhaps some herbs.*


    Here''s why: leafy greens are some of the easiest, cheapest plants to grow, yet
    are expensive to store and transport, so are disproportionately expensive to buy.
    Home-grown and picked right before use, they are definitely tastier and more nutritious,
    not to mention pesticide-free. Greens generally don''t need as much sunlight as
    many crops, don''t take up much space, and can be grown very well in pots. Finally,
    you get to harvest the amount you want, rather than paying for a whole bunch of
    thyme when you just needed a sprig, or a whole lettuce when you just wanted enough
    for a sandwich.


    * you may need to grow your greens in a raised bed if your suburb has a feral
    tortoise problem.


