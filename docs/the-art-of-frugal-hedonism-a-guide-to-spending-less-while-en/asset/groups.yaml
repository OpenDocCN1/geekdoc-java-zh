- md: '

    Shangri-La. Once we notice how easily such effects can occur, it only follows
    that we think of exploiting them by design rather than by accident.


    What a brilliant little mechanism is this! You could experiment with recalibrating
    what counts as a treat or outing. Pretend you''re on wartime rations, and eat
    only the humble of home cooking for a week – you''ll want to plan your meals and
    maybe do an initial shop for ingredients. Then make a date to go out for ice cream
    during this period. That excursion was magically transformed into an enormous
    treat! Put on your best summer ensemble to do it, and linger over every lick,
    drawing the whole event out for as long as possible.


    Imagine being so delicately calibrated that a cucumber could be your favourite
    food. The Red Tent by Anita Diamant is a fictionalized biography of Dinah, Jacob''s
    only daughter in the Book of Genesis. At one point, Dinah finds herself in the
    heat of Egypt, far from her Mesopotamian home:


    > I was fed amazing ... melons with orange flesh and melons with pink flesh, and
    there were always dates in abundance... But best of all were the cucumbers, the
    most delicious food I could imagine, green and sweet. Even in the heat of the
    sun, a cucumber kissed the tongue with the cool of the moon.


    Once your tongue has achieved cucumber-enlightenment, why not try resetting your
    relationship with technology? You could try a self-imposed ban on all information
    and entertainment technology for 48 hours (be warned, many people who do this
    are profoundly shocked by how much extra time the day suddenly seems to contain.)
    When you open that laptop again, you might find that you are satisfied by the
    thrilling omniscience of discovering what the weather will be tomorrow. Annie
    once made herself the guinea pig for an experiment using no electronic technologies
    and no artificial light for a fortnight. She was amazed by how sensitive she became
    to the atmosphics of natural light by the end of it – the twinkles, glistens,
    sheens and glows of sunlight in its various applications became deep textural
    elements of each day.


    We can also press reset on our expectation buttons. If you expect to buy takeaway
    for your midday meal every day, you may be calibrated to feel that lunch is only
    worth looking forward to if it comes from a shop. Expect instead of always bringing
    a packed lunch, and you''ll gradually forget the greasy displays in the shop windows,
    and will look forward to tucking into your roast-dinner leftovers lunchbox enormously.


    Exploiting this generous agility of your body and mind is exactly what Frugal
    Hedonists do on a life-long basis. Just as the dedicated debauchee is renowned
    for seeking out increasingly depraved experiences to satisfy an ever more demanding
    appetite, frequently making frugal choices furnishes us with a more sensitive
    palate. The basic blueprint for modern-first living is normalized hyper-abundance
    and hyper-stimulation, punctuated by desperate attempts to escape when the fallout
    becomes too distressing. These attempts usually take the form of bursts of restraint
    (like diets), or of collapse (like illness, or lie-by-a-pool-for-two-weeks-getting-drunk''
    holidays). Frugal Hedonism inverts this pattern by normalizing an elegant sufficiency
    of consumption, and then artfully dotting it with intensely relinquished abundance.
    It takes advantage of the different flavours of different modes of being, and
    sets them against each other to extract more enjoyment from each.


    # Everything’s amazing. Nobody’s happy.


    > “Everybody on every plane should constantly be going ‘Oh my God, wow! You’re
    flying. You’re … you’re sitting in a chair in the sky! But It doesn’t go back
    a lot.’ And ‘It smells really’. You know, here’s the thing: people say there’s
    delays on flights. Delays. Really? New York to California in five hours. That
    used to take thirty years to do that, and a bunch of you would die on the way
    there, and have a baby. You’d be with a whole different group of people by the
    time you got there. Now you watch a movie, you take a dump, and you’re home.”
    Louis C. K.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_41_0.png)


    One of your authors was on a plane recently where a few passengers were very excited
    about being on a chair in the sky – they were children. When they first started
    yelling “We’re going off the grouuuuund! We’re really flyyyying! We’re going inside
    a clouuuudd!” other passengers shifted about their seats, unsure whether to be
    irritated or not. Then they started smiling and craning their necks to look out
    the windows a little, and felt briefly delighted and flabbergasted by the whole
    situation.


    Obviously, the suggestions we’ve made so far are for quite small-fry recalibrations
    (although you might be surprised by the ripple effects.) If you’re hungry for
    something greater, why not try calibrating your fundamental concept of ‘middle?’
    You could kick off with a little binge about people who deliberately live at extremes
    of the low-spending spectrum, such as those who travel without money, or eat “freegan*”
    style. Perhaps watch some documentaries that look at the lifestyles and resource-use
    expectations of your average modern shanty-town dweller. Delve into the lives
    of history, whose definitions of convenience and comfort were inevitably more
    forgiving than those of their modern counterparts (see “10. Romanticise other
    eras” for more on this). Look at some of the stuff that kids get excited about,
    and question whether your capacity for noticing the “impressive” in things has
    become blinkered with age. Making these kind of mental forays now and again can
    be an invigorating reality check, and a refreshing counterbalance to whatever
    exposure you’re getting to.


    Truly hardwiring your recalibration doesn’t happen overnight. Sure, your body
    is nimble in its adaptability. Your mouth only needs a few days of practice, and
    things will usually turn out scrumptiously. But be warned, make frequent habit
    of faithful recipe replication, and you will spend money on one-off ingredients,
    many of which will have exactly two and a half teaspoons removed from the jar,
    before swiftly segmenting from essential to mouldering in the back of the fridge.


    Most deliciousness is a push and pull between sweet, sour, and salty elements,
    with a tasty fat to carry the flavour (and to help you absorb the nutrients).
    Also consider including something with bitter notes to cut richness, or an umami
    component to give robust savouriness, and things will usually work. Be patient,
    and gloat over every little increase in your capacity for pleasure. Embrace the
    spirit of self-experimentation! Don’t stop until you can wax lyrical about a!


    > * Freegan: a person who bases their diet around utilising unvalued food, usually
    motivated by a desire to reduce environmental impact. This may include rescuing
    superficially damaged food from dumpsters, harvesting from ignored fruit trees,
    wild foraging, and passing surplus produce around friends.


    # 7. Have an open relationship with recipes


    You encounter the concept of the latest famous chef’s pinenut-studded hotcakes
    with caramelised quince compote, and feel a sudden passion to possess it, just
    like The One In The Picture. It may almost feel important – as if your life would
    be a better life with that dish in, a meal that someone has bothered to write
    about and place in a shaft of sunlight on a scrubbed wooden table to photograph.
    It probably is quite yummy too.

    '
  mdcn: '


    世外桃源。当我们注意到这种效应如此容易发生时，自然而然会开始思考如何有意识地而非偶然地去利用它们。


    这是一个多么精妙的微小机制啊！你可以尝试重新校准什么是“奖励”或“出游”。假装自己正处于战时配给状态，连续一周只吃家里简陋的家常便菜——你会想要计划自己的餐点，可能还会为食材进行一次初期的购物。然后在这段期间定个日子去出去吃冰淇淋。那次远足就会魔术般变成一次巨大的奖励！穿上你最棒的夏装去执行，细细品味每一口，让整个活动尽可能得久。


    想象一下，自己被校准得如此细腻，以至于根黄瓜都能成为你最喜欢的食物。阿妮塔·迪亚曼特的《红帐篷》（*The Red Tent*）是关于创世记中雅各唯一的生女儿迪娜的虚构传记。在某一次，迪娜发现自己正身处埃及的炎热中，远离她美索不达米亚的家：


    > 我吃到了令人惊叹的……橙色果肉的瓜和粉色果肉的瓜，那里总有吃不完的枣……但最棒的还是黄瓜，我能想象出的最美味的食物，青绿而甜。即使在烈日的阳光下，一根黄瓜也用月亮般的清凉吻着舌尖。


    一旦你的舌头实现了“黄瓜之悟”，为什么不尝试重置你与科技的关系呢？你可以尝试自我禁欲 48 小时不使用所有信息和娱乐技术（警告你，许多这样做的人会对这一天突然多出这么多额外时间感到深感震惊）。当你再次打开那台笔记本电脑时，你可能会发现，自己会对发现明天天气如何这种心加速的“全知感”感到满足。安妮曾把自己当成实验的小白鼠，在两周内不使用任何电子技术和人造光。结束时，她惊讶地发现自己对自然光的氛围变得如此敏锐——阳光在各种应用场景中的闪烁、流光、光泽和光芒，成了每一天深邃的纹理元素。


    我们还可以对自己的预期按钮按下重置键。如果你每天午餐都打算买外卖，你可能被校准为认为只有从店里买来的午餐才值得期待。相反，尝试不要总是带便当，你会逐渐忘记商店橱窗里油腻腻的陈列，并会极其期待打开装有烤肉晚餐剩菜的午盒。


    利用你身心这种慷慨的灵活性，正是“节俭享乐主义者”（*Frugal Hedonists*）终身坚持的事情。正如狂热的放纵者以寻求日益堕落的体验来满足日益贪婪的胃口而闻名，频繁做出节约的选择为我们赋予了更敏锐的味蕾。现代优先生活的基本蓝图是常态化的过度丰饶和过度刺激，并在当后果变得过于令人痛苦时，穿插着绝望的逃离尝试。这些尝试通常表现为爆发式的节制（如节食），或崩溃（如疾病，或在泳池边躺两周、喝醉的假期）。节俭享乐主义反转了这种模式，它将消费的优雅自足常态化，然后艺术性地点缀上被刻意放弃的丰饶。它利用了不同生存模式的不同风味，并将它们相互对比，从而从每种模式中提取更多的快乐。


    # 万物皆奇妙。无人不快乐。


    > “每架飞机上的每个人都应该不断地感叹：‘噢我的天，哇！你正在飞。你正……你正坐在天空中的椅子上！但这可不怎么回不去。’而且‘它闻起来真的很香’。你知道的，重点在于：人们说航班有延误。延误。真的吗？从纽约到加州只要五个小时。在以前这需要三十年，而且你们中的许多人会在路上死掉，生个孩子。当你到达那里时，你面对的是一群完全不同的人。现在，你你看场电影，上个厕，就到家了。”
    路易·凯（Louis C. K.）


    ![](img/c65bfef74f426d079910ef9e22fa68dc_41_0.png)


    我们的一位作者最近坐在一架飞机上，几个乘客对坐在天空中的椅子感到非常兴奋——他们是孩子。当他们开始大喊“我们要离开地面啦！我们真的在飞飞啦！我们要进入云朵里啦！”时，其他乘客在座位上挪动身体，不确定是否该感到恼。然后他们开始微笑，伸长脖子向窗外看了一会儿，并对整个局面感到短暂的喜悦和惊呆。


    显然，我们目前为止提出的建议是针对相当小规模的重新校准（尽管你可能会对产生的连锁反应感到惊讶）。如果你渴望更伟大的，为什么不尝试重新校准你对“中间”的基本概念呢？你可以从沉迷那些刻意生活在低消费极端的人开始，例如那些不带钱旅行的人，或吃“免费主义食者”（*freegan*）风格食物的人。也许看一些观察普通现代人生活方式和资源使用预期的纪录片。深入了解历史人的生活，他们对便利和舒适的定义比现代人更有包容性（更多请见“10.
    浪漫化时代”）。看看那些让孩子们兴奋的事物，并质疑自己对“卓越”的感知是否已变得狭隘。偶尔进行这种精神之旅可以是一次振奋的现实检查，也是一种清新的平衡。


    '
