    is that The Economy requests the absurd: endless growth on a planet of finite
    resources. Yes, The Economy would suffer if we all started working less. Even
    the drop in hospital visits for stress-fueled diseases would register negatively
    with the GDP, as would the reduction in resources mined to keep office lights
    and photocopiers humming around the clock...


