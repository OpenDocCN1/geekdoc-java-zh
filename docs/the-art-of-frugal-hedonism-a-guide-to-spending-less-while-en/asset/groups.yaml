    # 27. Be a character


    Okay, no pressure here. This is far from an essential step to frugality, but having
    more personality is a seriously excellent substitute for constructing a persona
    via consumption patterns (like what you own, wear, eat and drive; where you live
    and holiday). You don''t have to become one of those old men who get about in
    bare feet and a pinstripe suit with a six-foot python wrapped about their necks,
    but you do have to hone-in on things you''re interested in and pursue them, develop
    your own opinions, or let some of those quirks and eccentricities that you may
    have been suppressing blossom into visible traits. People love to gossip, give
    them them gift by being worthy of it! Cultivate blithe disregard for a couple
    of your least favourite cultural conventions – it makes people feel less embarrassed
    about their own shortfalls by comparison! Be simultaneously stupendous in some
    other regards, and you''ve got yourself a package.


    Having a degree of social standing is important to all humans, whether they admit
    it or not (and is actually an important part of being successfully frugal - see
    also “30. People who need people...\”). There are more ways than one to pickle
    that particular hedgehog however, and earning a place amongst your fellow humans
    via Who You Are, rather than How Neatly Fit In, is highly effective, and often
    much cheaper.'
  - '[PAGE 111]


    # 28. It won’t be dull. We promise.


    It’s easy to assume that living without spending much will be all samey and unstimulating
    and lonesome. Gather round, readers, and let Annie tell you a tale of a poor village
    in the wilds of Transylvania...


    A couple of years ago I spent some time on a farm in a self-reliant Romanian village,
    and was utterly astonished by the degree of socialising taking place daily. I
    had envisioned life in a traditional agrarian society to be defined by days of
    long repetitive toil off in some field. Perhaps a bit of chinwag or a knees-up
    at the end of the day to relieve the boredom, if you had enough energy left or
    could get your hands on some hog. But, while in Reghin did occupy most of the
    day, it was not only diverse, so chock-full of wheeling, dealing and problem solving
    that it felt like bouts of vigorous exercise interspersed with gregarious socialising.


    A sample day might consist of rising at dawn to collect eggs, only to discover
    that the goats nudged the bar out of the stall door and escaped to graze a neighbour’s
    field instead of waiting to be tethered near the brambles the mad goat chase through
    the dewy field ensues, and the neighbour catches the goats, then returns with
    us to the house to discuss the extent of the damage done. Coffee is drunk, and
    sweet bread (in homage to the neighbour’s presence at the table) is produced in
    place of the corn porridge. Some outrageous flirting goes between the adolescents
    who have wandered in it if anyone is eating anything good, and an offer is made
    to transport the neighbour’s excess roosters to market that week (to smooth over
    the goat incident perhaps). Everyone eats and laughs, and once the visitors leave
    we set off to hoe the field up the road in preparation for potatoes.


    On the way we have to stop and lean on the fence posts of every field we pass
    to exchange lewd jokes (mostly constructed around husbands and wives and livestock),
    to update old bargains and strike new ones, and to be accused of being drunk –
    since we thought chasing goats'
