    It is easy to spending money as mental confirmation that something of value is
    being obtained. We can equally choose to relish and recognize value in experience,
    atmosphere, sensuality, or company. The more we make such choices, the less urge
    we have to treat ourselves by ‘buying something nice’ when life feels hard. That
    urge might become transformed into a yen to lie in the park on a blanket and watch
    clouds for an hour. And before you protest that such experiential pleasures take
    time that most modern humans don''t, let us remind you that time is exactly what
    you can choose to have more of when you spend less money...


    By the way, we’re not inferring that you shouldn''t relish your paid-for consumption
    – in fact it will go much further if you do. Try ordering one espresso at a café
    and making it for an hour. Revel in each drop of oily black dynamite rolling around
    your taste buds. Have occasional sips of water to refresh the flavour. People-watch
    while you luxiously observe the shifts in your brain chemistry as the caffeine
    moves in. You''ll feel astounded to witnessing tables fill and empty as people
    hurriedly consume huge meals and multiple coffees, often leaving them unfinished
    as they pay up and move on, seemingly unmoved by the experience. Yet simply by
    milking the moment for all that it''s worth, you get to leave feeling like you
    just had a seriously decadent experience.


