    疯狂的定义无疑会包括“极度丧失视角”和“反复否定生活的潜力”等特质。用这些标准衡量，消费文化：失败了。记者乔治·蒙比亚特（George Monbiot）是这样说的：


    > 如果我们的先祖被要求预测在一个物质繁荣、大多数宗教和文化禁忌失去效力的时代会发生什么，有多少人会猜到我们最喜欢的活动将不再是激烈的政治会议、戴面具的争吵、哲学辩论、狩猎野猪或冲浪巨浪，而是购物和看着别人假装自己很快乐？有多少人会预见到一场全国性的对话——在公共和私下——围绕着三个“R”展开：翻新、食谱和度假胜？有多少人会猜到，拥有难以想象的财富和自由的人们，会花时间购买洋葱眼镜和小麦草榨汁机？人生而自由，却处处受连锁店的束缚。


    这让你觉得稍微突破一下感觉很不错，不是吗？


    节俭社交的另一个需要一定定力和活力的方面，是所有那些你被要求带菜、送礼物或穿特定类型服装的场合。这类活动可能会让你那种经过“节俭享乐主义调整”的“特殊”定义被大众文化如此有力地吞噬，以至于你被误导冲向超市，带回更多的饼干和蘸酱，结果这些东西在晚上结束时只有半吃被丢在桌子上。或者逛遍商店，去猜一个你从未见过的四岁小孩生日想要什么礼物。花大钱买一双极其不自然的，以至于你永远、永远不会穿它们。


    没有什么比被这些情况束缚在世俗传统更无聊、更恼人的，那么为什么干脆不这样做呢？礼物？只有当你真心想要且确实能想出那个人想要的东西时才送。衣服？穿一件让你感觉舒服的衣服，如果你不想买，别让任何人逼你购物。食物？幸运的是，我们被大众营销的通用产品所淹没，以至于文化正在转而重新欣赏独特性和手工制品。尽管去上你亲手摘的核桃、从花园里新鲜采摘的沙拉，或者你英雄式地从街尽头那棵荒树上救下鸟类啄食的无果。你知道这些东西是多么珍贵，你也可以以此眼光将它们呈现给他人。


    足够的勇气制定自己的游戏计划可能很难，但它也可以成为力量的源泉。产生疑问时，提醒自己为什么做出你所做的决定，并为它们感到自豪。任何有能力的人都会对你对生活的喜爱感到很有趣。随着你的满足感变得清晰，你周围的人的心灵和生活，过了一段时间，你可能会发现自己并没有你最初感觉的那么疏离主流——因为主流已经向你方向迈了几步。


    > * 这个对鞋子有要求的活动也许是一场婚礼吗？甚至是你自己的。如果是这样，请考虑这一点：根据一本婚礼杂志的研究，2014年澳大利亚的一场婚礼的平均花费是65,482美元。这笔钱足够一起旅行六个月月到三年，创造惊人的终生共同记忆。或者在十二年的婚姻中，每周每周一次支付一晚的育儿嫂费用和一瓶香槟。我们说，留点给自己，办个便宜的吧。


    ## 33. 廉价旅行


    如果日常生活压力很大，休假和离开家通常意味着一件事：尽可能少做事。你渴望休息和充电，并在有时间注意时观察美。这意味着你渴望更昂贵的住宿、更少挑战的体验以及田园诗般的环境。


    如果你的生活没有那么压力，并且有时间沉浸在美中并享受元素，那么你在旅行时通常追求的是对比、趣味和冒险——而这一切都可以廉价得多地找到。


    节俭旅行的奇妙之处在于，它迫使你与访问的每一个地方变得更加亲密。你身处异国他乡。乘坐廉价的当地巴士而不是旅游观光巴士，体验每一站都会上车的各种尤克里里街艺人和罗望子小贩。诚然，巴士行驶得更慢且拐弯很多，但它给了你机会去真正吸收风景，或者瞥一眼你可能永远不会走过的街道。你在廉价的当地小吃摊用餐，而不是游客餐厅。你不仅发现了对酸甜鲶鱼的热爱，还学了一些地区方言，每当你尝试用时都能让全场大笑。


    你想访问所在州的一个国家公园。与其住在度假村里每天绕道一个不同的景点，你决定进行一次为期四天的徒步，沿途露营。你不仅变得更健康，每晚都能睡上美妙的十小时，而且日出而作意味着当你每天从帐篷向外看时，可以偷偷监视觅食的动物。你在偏僻的瀑布中沐浴，这对你疲惫流水的肌肉来说感觉极了。你注意到景观的逐渐变化，并在土壤颜色改变或地平线上闪烁着湖泊时感到兴奋。在途中，你顺着一条小径进入一个偏远的峡谷，在那里你在数百只彩虹蜻蜓的陪伴下游泳。


    你一直想去法国。与其在旅游巴士和酒店之间跳跃三周，你使用一个房屋交换网站，找到一个迷人的村庄住了三个月。不在的主人留下了他们的车，以及足够供你全家人出游的自行车。你度过了一段疯狂的田园诗时光，熟悉了所有的当地地标和美食特色，然后出发远行，在测试你进步进步的法语的同时，探索附近的一些城市。当要在回程的行李箱里塞进绝对违禁数量的卡干奶时，你意识到你已经将那个村庄的一部分永远地留在了心里。


    节俭旅行中总有一些困难的时刻。你偶尔会感到冷/热/迷路/疲惫/吃到一些无法识别的东西。但正是这些部分让你意识到自己比想象中要坚强。*而且这些是故事故事来源。*此外，那些认为全程无故障且舒适旅行的人，往往对一顿淡的饭感到恼，而不是节俭旅行者对坐错了五小时巴士感到恼。也许最重要的是，虽然昂贵的旅行提供了更高基础水平的“愉悦”，但它很少像节俭旅行那样慷慨地提供兴奋或启示的时刻。


    也许并不意外，节俭享乐主义者在定义“旅行”时相当宽容。你们的作者认为，旅行最终在于与日常生活创造对比，从而刷新你的精神并让时间显得宽广。


    去年夏天，我们两个“旅行”了十二小时。我们搭火车去离公园最近的小镇，步行10公里，发现自己处在一片宁静、炎热的景观中，那里有小植物、宝石昆虫和一条可以游泳的慢河。我们在灼热的沙地上赤脚走路，睡得更多，读读故事。当背包空了带的食物后，我们装满了那些让当地公园护林员头疼的野橄榄，再次出发。我们感到不可思议地焕然一新，而且多了一年的橄榄。


    去年夏天，我们两个“旅行”了十二小时。我们在星光开始消散时到达线路上的终点火车站，让当天的第一班火车将我们带回城市。这次冒险非常有趣、愉快且几乎免费——每人回程票只需3.20美元。当我们回来时，感觉自己已经离开了好几天。它也给了我们40公里的腿部锻炼，并在之后的几周里让生活显得更加宏伟且充满无限可能。并非所有形式的节俭旅行都适合每个人。了解你保持快乐和健康的基本需求，并选择符合这些要求的旅行配置。例如，我们有一位旅行朋友什么都吃，并且乐意睡在任何地上，但需要安静才能睡好觉。她提议睡在帐篷里而不是舒适（但嘈闹）的房间里，让她的工作交换房主感到意外，并寻找了那些是'
