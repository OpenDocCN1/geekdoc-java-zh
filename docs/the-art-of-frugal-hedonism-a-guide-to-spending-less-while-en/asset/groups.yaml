- md: '

    leisurely in order to achieve leisure.” Either translation suggests that work
    itself was not viewed as a thing of much intrinsic value in ancient Greece.


    One modern stigma around eschewing work is its association with the ludically-privileged
    aristocracy of the old European class system. The medieval lower classes seemed
    no more ideologically driven to less-necessary work. While toil was certainly
    hard and long in areas where agricultural conditions (or your feudal lords) were
    tough, there are also indications that peasant life could be quite a romp.


    Records from 15th century France, for example, show that an average of one day
    out of every four was an official holiday, frequently of a kind that meant carnival
    revelries for the peasantry. In Essex the 14th century casual labourers are estimated
    to have worked no more than 120 days a year, and not for lack of opportunity.
    Ehrenreich in Dancing in the Streets: A History of Collective Joy says that “the
    period from the fifteenth century can be seen ... as one long outdoor party, punctuated
    by bouts of hard labor.


    The artisans also appear to have been free of any moral compunction towards non-essential
    labour; a fact distressing to pious types as the cogs of the industrial age go
    grinding. John Houghton, a commentator on trade, bemoaned in 1681 the lack of
    labour put in by knitters and makers of silk stockings as soon as they “had a
    great price for their work”, and described them as spending “most of their time
    at the ale-house or nine-pins ... as long as they have a penny of money.”


    Let’s stop there, and rest our reeling heads! We don’t know about you, your authors
    actually got a bit windy over the concept of doing just enough work to pay for
    basic needs, and treating time as a malleable substance to be shaped – even endlessly
    squandered – as we. We struggle to untether ourselves from the idea that ongoing
    achievement is essential for a worthwhile life. But what if it’s not? Our flirt
    through history hints that achievement could be an overrated, relatively modern
    habit. Maybe it would be just to spend so much, much more time looking around
    at the world, going cross-country orienteering through our own fascinating minds,
    and enjoying those of other humans.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_101_0.png)


    Beloved reader, we are the first to admit that some work feels like a marvellous
    use of time. We have earned money doing many truly rewarding things; things where
    we were stimulated by learning and thinking, meeting riveting people, creating
    stuff we were proud of, journey to unusual locations. But we don''t think that
    anyone should spend most of life working without questioning the whole equation
    first. So we suggest taking a step back from the blackboard, the better to view
    the tales from history chalked up there for your rumination. Put yourself in a
    cocktail shaker with them, and mix their globules up with your globules. Then
    have a ponder.


    ## Bonus bonuses of working less


    - Even if you love your work, you will probably love it even more if you don''t
    feel hedged into doing it x hours a week, x weeks a year, ad infinitum.

    - If you *don''t* love your work, reducing your hours can allow you to appreciate
    its good bits – sociability, the way it keeps you fit or takes you to places that
    you wouldn''t otherwise go. Even a job you thought you hated sometimes could become
    enjoyable when you do it less – you actually didn''t hate the job, but how much
    it dominated your life.

    - Working less almost always saves you money. You might spend less on work-related
    expenses (transport, clothes that you don''t wear anywhere else, an up-to-the-minute
    iPad you feel you can''t do without). You might spend less on de-stressing (yoga
    classes, remedial alcohol or therapy bills). You might be able to give up some
    ''busy-ness enablers'', like frequent takeaway food, time-saving appliances, or
    even a car.


    Of course, whittling down your working life isn''t always as straightforward as
    asking for fewer shifts per week. For some people it will require serious life
    overhauls: restructuring or job-sharing your role, volunteering for a demotion
    or changing careers. If you''re fettered by serious mortgage or car repayments,
    it might mean moving to a smaller house, or to an area with better public transport.


    ## 24. Bring a bag


    Erm, we''re not sure how much we need a bag, but when we go, we might need one.
    If we buy something, we can put it in the bag. If we don''t buy anything, we don''t
    need the bag. But if we do need something, it''s better to have the bag than not.
    So, when we''re going out, we should bring a bag with us. It''s a simple way to
    be prepared for anything that might come up.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_103_0.png)


    > Life has actually been great without those.


    ## 25. Notice when you have enough


    While she was shopping, she made a list like:


    ![](img/c65bfef74f426d079910ef9e22fa68dc_104_0.png)


    Approaching the cash register, Annie felt an aversion to buying the utensils.
    A little voice in her head was saying, “Life has actually been great without those
    for years, why buy them?” She returned the utensils to the shelf, and left the
    store empty handed, which felt surprisingly nice. The two utensils would cost
    a grand total of $1.98, so it definitely wasn''t price that prevented her from
    buying them. It was the pleasant lightness that came with recognising her true
    lack of them.


    We can spend a lot of energy in modern life tally up what we might be lacking.
    Most people carry a conscious or subconscious ‘Things would be better if...’ list
    in their heads, which they constantly update and revise. It can be phenomenally
    liberating to notice that your life has been fine so far, maybe even pretty good,
    with what you already have. (Or if it hasn''t, it''s probably not because of a
    deficit of wireless speakers or a proper toothbrush holder instead of that mug
