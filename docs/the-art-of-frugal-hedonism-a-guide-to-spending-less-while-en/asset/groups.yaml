    Your taste buds as imagined by Gray''s Anatomy (1918).

    They certainly look ready to party.


    This is how all the fancy stuff gets invented anyway! Italian peasant Z did not
    decide to squeeze the juice of unripe grapes onto meat so that it could later
    be marketed in small bottles as verjuice and make lots of dosh for gourmet food
    companies. Peasant Z did it because they recognized recognized that their dinner
    would taste better with a sour note, and had nothing else acidic on hand. Your
    authors find that our own cuisine escalates in sublimeness the more we come to
    rely on the random. A harvest of chestnuts and under-ripe apples lead to a fabulous
    goat, chestnut, and tart apple stew. A yen for Earl Grey tea provokes experiments
    with steeping a sprig of thyme in regular tea, which turns out to be super nice.


    We do use recipes for learning. A good trick is to find three recipes for something
    similar to what you want to. Then see where they overlap give you a rough idea
    of proportions. For example, we had lots of nettles and potatoes in the garden,
    and some haloumi needed using, so we looked up a few gnocchi recipes to get a
    feel for ratios and essential preparation techniques. (If we hadn''t already had
