    A crucial step in allowing this mental process to happen is to put a little time
    between the idea of buying something and actually doing it. If you''re merely
    *thinking* that you should get something, you can put it through this filter any
    old time. If you''re already in a store surging with the adrenaline of an imminent
    impulse buy, take a deep breath, step away from the throw/shoes/of the moment/wooden
    duck/milk-frother, and go about your day. Still convinced that you should buy
    the Object of Desire a week later? Go back and get it. But most likely you will
    have forgotten about it by then, and gotten on with more interesting things.


    ## More good is not always better


    > It''s not just our gear that we tend to assume we improve if we have the capacity
    to. Humans feel a strong compulsion to say ''yes'' to anything our culture has
    deemed Good, from a promotion (even if we already feel overwhelmed at work) to
    an all-expenses paid trip to speak at a conference in Barcelona (even if we are
    already too busy for comfort). Frugal Hedonism is partly about noticing when less
    might be more, and that applies to activity just as much as in the realm of consumption.
    If you''re too busy, don''t add a new commitment unless you can ditch a current
    one. If you''re already loving life, check whether saying yes to another appealing
    project could steal important time from some less visible aspects of your world.
    It''s as much about the spaces between things as it is about the things themselves,
    man...


    ## 26. Reinvent Christmas


    Your authors realise it only happens once a year, but we reckon that reinventing
    Christmas is useful because it is so emblematic: if Christmas can be improved
    via frugality, then anything can.


    It''s been over ten years since Annie told everyone she knew that she didn''t
    want any Christmas presents and wouldn''t be buying. She made an exception for
    her one remaining grandma, said granny being old enough to maybe not get it (and
    also old enough to have done a lot of frugal-time herself, enabling her to really
    appreciate small gifts like a box of Turkish delight). Those merry souls who choose
    to vanish Christmas consumption mania often make a similar exception for children,
    but keep the presents humble filled with small treasures: packets of glitter,
    a book, novel trinkets (curly straws, a magnifying glass, chocolate coins), or
    craft materials – perfect for allowing the grown-ups to relax all day while the
    stocking''s contents are explored and put to use.


    Find the consumption grotesque, but would still like to give something? What about
    only giving non-material presents (like a voucher for a massage, a lesson of some
    kind, or an afternoon of professional housecleaning). We know one circle of friends
    who decided to make a donation to a charity at Christmas instead of giving each
    other. If you want to keep it small and stay away from useless tokenistic stuff,
    why not put aside a selection of the year''s best homemade preserves and pickles
    to serve as gifts? People love pickles! Such treats also have the advantage of
    a long shelf life, meaning they create no sense of obligation to eat even more
    food over Christmas.


    For many people, festive food is another area of consumption-induced strain, and
    The Perfect Christmas Meal becomes an exhausting marathon of shopping and preparation,
    leaving (usually) the woman of the house so busy getting a parade of dishes to
    the table that she barely gets to sit down and enjoy them. And on this over-catering
    scarcely makes sense in an age and culture where most people feel like they eat
    too much on a regular basis.


    In eras when daily fare was very humble and featured virtually no-treat foods,
    a feast was anticipated with legitimate glee, typically including more animal
    protein, and energy-dense luxuries like dried fruit and honey. But we live in
    an age where meat is left to spoil in thousands of refrigerators across the country
    daily, hamburgers and milkshakes are thrown away half consumed, and dried fruit
    is considered a virtuous alternative to snacking on cookies. This excess-on-top-of-excess
    can lead to yet more Christmas stress, as attempts to resist over-indulging at
    a parade of festive season work bashes and family gatherings segue seamlessly
    into guilt and dismayed resolutions to go to the gym more often to work off the
    ‘holiday bulge’.


    What’s the alternative? If you’re feeding people, you could focus on quality instead
    of quantity to avoid ending up with piles of excess food. Make a meal that is
    easy to prepare, that allows you to be present with your guests, and that doesn''t
    leave you buried in dishes.


