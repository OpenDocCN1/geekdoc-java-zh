    # 39. Limit the burden of choice


    One long rainy day, your author Annie decided it was a perfect moviewatching type
    of afternoon, so she scrambled through the downpour and knocked on her neighbour’s
    front door. She knew this neighbour to be the possessor of hundreds of cinematic
    titles, and thought thered surely be something in his collection to tickle her
    fancy. As she scanned the seemingly endless options, she started to feel clustered,
    and also less and less excited by watching any of them. After a ridiculous amount
    of time, she left having borrowed movies that looked pretty good. She watched
    between twelve and twenty minutes of each, deciding in every case that wasn''t
    really into it, but maybe not the one would be what she was after. She felt something
    like a failure, for finding it so hard to choose, and for not being able to enjoy
    any of her choices. She remembered thoroughly enjoying second-rate movies she''d
    encountered on long-haul buses, while owning a TV with only one channel. What
    had changed? She thought about going back next door to see if there was anything
    else there might be what she was really after, but felt irrational irritation
    at her lovely neighbour for having such an immense movie collection. The whole
    exercise had a bit weary anyway. She cuddled the dog and had a snooze instead.


    Does the essence of this tale feel familiar? Perhaps you’ll recognize something
    on the street trying to decide on a dining option. Do you feel more like Thai,
    pizza or Lebanese? Thai is closest, pizza is cheaper, Lebanese seems somehow healthier.
    Distress is mounting, you’re having a strangely tense conversation with your Significant
    Other about the relative merits of what to have for dinner... Now imagine you’re
    drifting off to sleep after spending the evening reading an evocative novel by
    a lonely aesthete astronomer. You’re pretty sure you should be having meandering
    poetic thoughts about our smallness in the face of the stars or something, but
    instead you’re wondering about those new shoes you bought today. Should you have
    gotten the slightly chunkier ones? Will that toe shape even with any of your pants?
    Should you have gone for black after all? Black'
