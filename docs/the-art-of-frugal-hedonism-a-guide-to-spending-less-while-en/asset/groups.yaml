    WARNING: Several situations mentioned in the following text involve operating
    outside of standard supply channels. If you are going to do this, it is incredibly
    important to be respectful of your sources and not to wreck things for other people
    who might also be using them. This usually means: don’t leave a mess, don’t take
    everything for yourself, and be polite to anyone who questions what you are doing.


    The shameless bird gets the worm. If you’re prepared to do away with the ‘But
    will people think?’ factor, the opportunities for meeting life’s needs via stuff
    that would otherwise go to waste really unfold. Your authors think waste is dumb
    and being wisely is fun, so we tend to throw out of the window and just get in
    there.


    We have rescued banquets of quality food from dumpsters (not to mention many cases
