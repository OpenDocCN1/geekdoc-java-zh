    Fido 那条越用越旧的窝。孩子们在房间里看 DVD，R 先生把衣服放入烘干机，并在洗碗机里装满了早餐餐具。然后，他在网上预订了周末庆祝 R 太太 40 岁生日去悉尼的机票，并等妻子回家，这样她就可以去健身房，并在回路上顺便买条狗窝。


    R 太太忘记了直接回来的承诺，中途停下来买东西，买了一些特殊的儿童多装组合，并无意中在一条漂亮的丝绸裙上花了比她整周赚得更多的钱。她不确定自己会不会穿，也知道自己需要瘦一点才能穿得合，但它确实美极了。在妻子晚归后，R
    先生匆忙忙地去健身房，结果忘记了鞋。他不想回去，决定在路上买新双鞋——考虑到他坚持健身计划执行得很好，他也许值得升级一下。锻炼完后，他拿了一瓶电解质饮料一根蛋白棒，回到家里。每个人都很累，所以他们决定点泰式外卖当晚餐（把剩下的烤羊肉扔了），调高暖气，开始享受一个舒适的夜晚。


    你认为这一天是奢侈的吗？在描述的这一天，R 家庭显然并不觉得自己在过着高品质生活——或者说过着满意的生活。他们只是在努力度过另一天，而这种方式在数亿人看来是*正常*的。


    两百年前，R 家庭每个成员在这一天消耗的资源对普通人来说是无法追踪的，甚至对教皇和国王来说都是挑战。单从能源消耗来看，即使在最近的 1950 年，社会经济地位相似的家庭在典型一天中的用量也只有这个数字*不足半*。


    | | 1950年 | (2000/2010年代) |

    |---|---|---|

    | 人均居住面积 | 27 m² | 83 m² |

    | 仅住一人的家庭百分比 | 10% | 25% |

    | 每人道路车辆行驶里程 | 4,900 km | 16,200 km |

    | 在家准备食物的百分比 | 75% | 50% |

    | 有空调的房屋百分比 | 10% | 87% |

    | 电影院爆米花典型供应分量 | 3 杯 | 16 杯！ |

    | 家庭债务（占家庭年收入的比例） | 约 50% | 约 200% |


    一些来自美国的数据供你思考。在其他英语国家的人变得过于自大之前，你们的数据看起来也没好到哪。


    奇迹的是，那些 1950 年的中产阶级人士并没有在清醒时间里抱怨这种痛苦的匮乏——他们觉得和今天的 R 家庭一样人很正常。事实上，有一项美国研究表明，1950
    年的公民自认为比现代人更快乐。


    这种对比说明了，我们对“财富”和“适度消费”的概念在多大程度上是通过与周围的人比较来定义的。即使是那些最不认同“攀比阔邻（keeping up with the
    Joneses）”这句话的人，也无法不根据同龄人所做的以及大众（和社交）媒体建议人们所做的某种模糊标准来衡量自己。


    ![](img/c65bfef74f26d079910efe22fa68dc18.png)


    收入增加而幸福感下降的现象，被称为伊斯特林悖论（Easterlin paradox）。


    再次考虑我们上面强调的消费变化。我们务实的作者提到这些，并不是为了让我们陷入个人和文化的负罪感中。绝非如此。我们提到它们是因为我们认为承认所谓的“正常”具有完全任意性是非常令人释放的（！）——这实际上为我们建立自己的正常扫清了道路。突然，我们觉得可以自由地在那个范围内跳舞，无论这种享乐主义（Frugal
    Hedonist）把我们带何方……


    # 2. 享受（Relish）


    “享受（Relish）”是一个值得思考的词。它听起来几乎是不可理喻的，因为它暗示了过度的感官刺激。我们务实的作者认为，这种对生活乐趣的充分投入是我们节俭盔甲中最精良的技能。


    人类充满了神经末梢。为什么要浪费它们呢？Annie 记得小时候她和好朋友在散装食品店里来来去，手伸进装干豆的大桶里，感受不同品种有多好玩。她似乎记得自己可能被要求……

