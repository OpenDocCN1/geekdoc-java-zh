    # 6. Recalibrate your fickle senses


    Humans have embarrassingly fickle brains. And tongues and eyes and noses. Avoid
    sugar for a week, and suddenly the juicy explosion of a ripe peach is transformed
    into the most gorgeous ambrosia your taste buds could imagine. Don''t watch TV
    for a month, and disappearing into a book soon becomes the most captivating escapism
    conceivable.


    ‘Recalibrate’ is an incredibly useful word for the Frugal Hedonist, particularly
    because all of us have at one time or another experienced shifts in what we perceive
    as pleasurable. Maybe it was the time that we had a dodgy stomach and had to live
    on dry crackers for far too many, then couldn''t believe how good of a minestrone
    tasted afterwards (and found yourself happily eating more simply for a while to
    follow...?). Maybe it was the time that the power went out for several hours,
    and then the lights seemed too bright and the stereo seemed too loud when they
    came back on (and you decided to only leave one lamp switched on for the rest
    of the evening...).


    The element of restriction in such scenarios undoubtedly boosts their ‘reset-effect’.
    Adopting a consumption rhythm of lean-lavish-lean certainlyifies pleasure. But
    it is not restriction that lies at the heart of this effect. It is contrast. And
    there is no reason why the activities that provide contrast can''t be enjoyable
    in themselves.


    Think of that time you went for an amazing walk up a mountain, and the sandwich
    that you reached the top struck you as the most satisfying thing you had ever
    eaten. An icy cold beer with a friend tasted about four times as good after a
    gratifyingly sweaty day of working in the garden however. Watching a cheesy sitcom
    might seem dreary if you do it all the time, but after an engrossing stint going
    hard at some complex mental work, it can seem like wonderful primary-coloured
    surrealism. Bathing regularly with hot water and soap can feel like a task as
