    ## 41. Self-propel


    Sure that dial on the speedometer goes up to a tantalising 240 kilometres (150
    miles) an hour. But how fast does your car really go, on average? We’re not alluding
    merely to stick stuck in traffic here. To truly calculate the ‘effective speed’
    of our vehicles we need to include all the hours we put in at the office to cover
    fuel, registration and other running costs… with that speedometer sitting right
    on zero all the while. One Australian study calculates for every hour spent driving
    a Toyota Landcruiser, average owner spends 1.5 hours working to pay for it. The
    study also points out that if the owner had to pay for their car’s ‘externalities’
    – those costs borne by society – of CO2 emissions, traffic congestion and the
    cost of road accidents, they’d need to work another 0.6 hours for every hour behind
    the wheel. That puts the effective speed of a Landcruiser at 9 kilometres (5.7
    miles) per hour. So not convenient at all, he? A bicycle, by the way, with its
    far lower purchase, running, and externality costs, clocks in a relatively speedy
    18 kilometres (11 miles) per.


    In Australia, the annual registration, running and depreciation costs of a mid-range
    newish car are around $12,000 per year. And that’s excluding all parking tickets.
    Let’s be generous and estimate that in the case of an older car, lower depreciation
    costs could knock that figure right down to $7,000. Even for this bottom-end figure
    you could take $20 taxi rides every week, and pay for a rental car plus hundred
    dollars worth of petrol for fourteen weeks per year, and still come out ahead.
    By way of further comparison, Adam’s total transport costs in the year of writing
    this were $610, which included a major bicycle service, weekly public transport,
    and multiple train trips to the country. So even if you add a bit of depreciation
    on the bike, there’s still a handy bit of pocket change left out of our hypothetical
    seven grand.


    Some folks we know, Paul and Nikki, have worked out another transport configuration.
    They didn’t like being forced when they wanted to take their kids places, so they
    bought a ‘cargo’ bike – like a grownup tricycle with a tray in the front deep
    enough for a couple of toddlers or a mega-load of shopping. It worked so well
    that they almost got rid of their car. But they still wanted it for occasional
    trips. So instead, they use a network called Car Next Door to share their car
    with the neighbours. Car sharing is a rapidly growing business. The biggest network
    in the US is Zipcar, and co-founder Robin Chase says, “Each Zipcar replaces 15
    personal cars. And each driver drives about 80% less because they’re paying the
    full cost all at once in real time.” So when Paul was asked by his council to
    enter a ‘design your dream streetscape’ competition, he found himself calculating
    that if all his street’s residents joined share-car networks, they would only
    use about six cars between them: “Our street is 200 metres by 8 metres. That’s
    1,600 square metres of space. ... So my dream makeover? Dig the whole road up
    except for two five-car parks at each end that hold share cars and some visitor
    parking. By my reckoning that would enable the planting of 150-odd fruit and nut
    trees plus companion planting, which should provide most of the [perishable] food
    for the street.” If car sharing continues on its current trajectory, these kinds
    of visions might soon be sounding very sane.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_157_0.png)


    Parking lots and parks in Houston, Texas. The black-bordered white boxes are vacant
    land or parking lots. The cross-hatched areas are parks (the kind with trees and
    grass).


    ![](img/c65bfef74f426d079910ef9e22fa68dc_158_0.png)


    ![](img/c65bfef74f426d079910ef9e22fa68dc_158_1.png)


    Cars need a lot of space: three people travelling by car (assuming single occupancy)
    vs. three people travelling by bicycle.


    It may be impossible to do what you currently do, vs. and where you currently
    do it, without heavy use of a car. Morning routines that involve dropping kids
    off, collecting dry cleaning, then crossing town to get to work, often can''t
    be done by public transport or bike. But then, major savings, like getting rid
    of a car (or switching to a smaller one and using it half as much), sometimes
    require major life reshaping. It is usually worth it. You will be astonished by
    how much more money you have. You get to know your neighbourhood better, because
    you walk down the streets rather than pulling out of the driveway in a bubble.
    You can gaze dreamily out the window on a train. You can also read books (not
    so good while driving) and witness heartwarming scenes, like teenage goths helping
    old ladies wrestle their walking frames through the doors. You’re more focussed
    and take fewer sick days at school or work if you walk or ride to get there.*
    Going car-free does mean planning errands in blocks, and on really rainy nights
    you might settle for cranking up the Michael Jackson for a boogie in your living
    room instead of cycling to that Zumba class two suburbs away, but then you probably
    don’t need to do.


    One of your authors'' favourite things about not having a car is how you come
    to regard your legs as having serious transportation capacity. Humans used to
    hunt antelope by running them down, for crying out loud! We knew a man who spent
    some time teaching agricultural workshops in Peru, and he described how grandmothers
    would show up for class in this mountainous location, having thought nothing of
    taking a three day walk to get there.


    We are made to move, and both body and mind seem to thrive on the gentle, rhythmic
    motion that is walking. Kinks in your body sort themselves out. Your brain’s problem-solving
    and creative capacities seem heightened while using your feet to carry you somewhere
    you''d normally take a bus to. It may take a couple of hours, but you''ll arrive
    enlivened and mentally refreshed, plus you’ll relate to that journey differently
    ever after.


    All this said, your authors actually think cars are amazing machines, so long
    as they are treated as the use-only-when-needed objects that anything so socially
    and personally should be. If you do decide you have to keep one, try using this
    simple test for whether to use it: imagining there was only a pool of rentable
    vehicles, would you go to the effort and expense of hiring one for the occasion
    in question, or would you come up with an alternative?


    ## In praise of walking


    > “Walking ... is how the body measures itself against the earth.”

    ~ Rebecca Solnit, Wanderlust: A History of Walking


