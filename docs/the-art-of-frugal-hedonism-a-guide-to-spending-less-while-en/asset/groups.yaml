    ## 自由旅行的艺术：

    ### 一场节俭家庭冒险


    **作者：Patrick Jones 和 Meg Ulman**


    Patrick、Meg 和他们的家人经营了幸福且可持续的生活。但在 2013 年底，他们发现自己渴望冒险：一场公路旅行。


    但他们的公路旅行却与众不同。带着 Zephyr（10岁）、Woody（1岁）和他们的狗，他们开启了一场为期一年的澳大利亚东海岸自行车骑行，从达尔斯福德（Dalesford）到约克角角（Cape
    York）折返。


    他们的目标是低成本生活——游击露营、狩猎和采集。他们曾在澳洲社区度过时光，加入反水力压裂的封锁行动，记录了食用植物，并在国家最危险的高速公路上躲避超速卡车。《自由旅行的艺术》是一个关于打破规则的伦理生活的一非凡故事。


    ## 永续农业先驱：

    ### 来自新边疆的故事


    **编辑：Caroline Smith 和 Kerry Dawborn**


    这些引人胜的故事描述了普通人如何找到勇气拥抱世界问题，超越恐惧，通过解决方案和实际行动来改变并赋能他人，成为受启发的变革推动者。


    这部选集是永续农业出版物中令人启发的补充，对任何关注社会和变化的人都具有吸引。


    该书的核心信息之一是，普通人不必等待专家和政府的领导。永续农业先驱们的经历说明，我们都可以变得勇敢且富有创意。我们都有工具来赋能自己，而不是简单地拖入我们感到无法逃脱的洪流中。


    ## 永续农业：

    ### 原则与路径

    超越可持续性


    **作者：David Holmgren**


    永续农业的共同创始人 David Holmgren 的开创性著作《原则与路径》（*Principles and Pathways*）汇并整合了25年的的思考与教学，展示了理解和执行一组简单设计原则的全新方式。


    这与我们如何重新组织生活、社区和景观的每个方面都相关，以创造性地适应塑造人类命运的生态现实。


    对于普通读者来说，这本书为一系列环境问题提供了新颖视角，并展示了永续农业远不仅仅是一个园艺系统。对于任何认真感兴趣于理解可持续设计和文化基础的人来说，这本书都是必读之作。


    ## 复古郊：

    ### 减速主义者的韧性未来指南


    **作者：David Holmgren**


    *RetroSuburbia*（复古郊）解释并说明了那些已经在通韧性未来道路上的人，利用永续农业伦理和原则所应用的模式、设计和行为策略。


    它为那些通过更系统、全家庭方法改造其房屋、花园和生活安排的人所面临的问题提供了设计解决方案。


    它包含了一些经过证明的设计规范和提示，引用了技术来源和案例研究，但它更多是一本战略指南，而非技术手册。


    有关此书的更多信息，请访问 [RetroSuburbia.com](http://RetroSuburbia.com)


