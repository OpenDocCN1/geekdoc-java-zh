    would have been more versatile, but you loved stitching detail on the brown...


    A little choice is very nice. A large range of choices encourages perennial dissatisfaction
    with whatever you have chosen, no matter how satisfactory it is — you might not
    have picked the best option, after all! According to Barry Schwartz, psychologist
    and author of the Paradox of Choice, when choice abounds, we feel as if things
    don''t turn out so great because we made poor decisions, because there weren''t
    just any great options available. Hence ‘luxury’ of choice often comes with a
    sense of pressure making the right one, which can lead to anxiety and regret.
    To top it all off, research has shown that the process of attempting to constantly
    evaluate and decide between options — as we do day long in affluent societies
    creates serious mental fatigue. (Post-lunch slump? Maybe it''s not the carbs.
    You just need to switch to a sandwich bar with fewer potential combinations of
    drink + bread-variety + filling!


    The fantastic news for Frugal Hedonists is that by consuming less, the range of
    consumer decisions you have to confront on a daily basis plummets. If you always
    make your own salad dressing, you’ll never find yourself in the supermarket gazing
    bleakly at the 93 varieties on the shelf. If you buy secondhand, and take pleasure
    in taking your luck where it comes, you’ll never find yourself standing in the
    Ikea checkout line in tormented indecision about whether to sprint back and swap
    that set of towels for the darker blue ones before it is too late. If you usually
    put together your bicycles out of salvaged parts, you’ll never have deliberate
    whether a retro cruiser or an Italian road bike would better reflect your personal
    style. If you have already decided that your current bathroom is totally adequate,
    you’ll never find yourself trawling online shower screen catalogues for six hours
    straight in search of the Perfect One.'
