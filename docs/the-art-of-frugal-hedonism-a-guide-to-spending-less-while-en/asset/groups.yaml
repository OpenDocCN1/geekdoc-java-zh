    Why does this conundrum exist at all? From a tender age society encourages us
    to lay aside our impetus to do things for their own sake (''intrinsic'' motivation),
    and instead to do much of what we do for external reasons. As a young child you
    were most certainly an intrinsically-motivated learner, and spent most of your
    waking hours fascinated by the world, and inventing endless adventures in pursuit
    of discovering how it all worked. Soon however, schooling converted into something
    you did for external motivations: grades, and punishments.


    Working life then continues to reinforce this pattern of doing things for external
    motivations. What''s more, shaping your life around employment is a short cut
    not only to motivation and structure, but to social and personal validity . Once
    adapted to this set-up, people can find that as they might pine for holidays and
    crave more ''downtime'', they aren''t actually overflowing with ideas for what
    to do with this time when they get it. And fair enough. It would be a stressful
    existence to be constantly dreaming up things you would like to do if you don''t
    expect to ever have time to do them.


    We''d like to make a suggestion, dear reader: if you do alter your lifestyle to
    give yourself control over your own time, and then find yourself disinclined to
    act without external pressures, cut yourself some slack for a while. If you feel
    deeply decoupled from your lust for learning, and your intrinsic motivation to
    cha-cha with life has gone la-la, expect to feel a little bored and lost.


