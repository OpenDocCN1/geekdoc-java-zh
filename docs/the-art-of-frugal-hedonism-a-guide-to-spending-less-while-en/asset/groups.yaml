    As fond as your authors’ memories of that evening, its occurrence does tend to
    bring home how lacking in easily-identifiable, free, communal spaces many modern
    cities are. You may have an even more challenging time finding one if you live
    in a rural area – although if you can nurse a drink for an hour or so, the country
    pub can be a better cheap social space than you’d find in most cities. Check out
    the pointers in the box below and see if you can come up with any. If you can’t,
    why not start one of your own? Your local council may even be prepared to help.


    While it’s definitely tricky to find public spaces that meet all the above criteria,
    your authors have noticed that it’s possible to somewhat satiate the urge to ‘be
    in the world, and gazing comfortably at it’, in other ways. Choose to focus on
    your surroundings rather than on a handheld electronic device while travelling
    on public transport, or waiting for a friend on the steps of a public building.
    Do a spot of people-watching, look at the tops of buildings and trees, let your
    brain be loose. Walk more slowly down the street, and survey the sights. Simply
    by sitting back and looking outwards, we can replicate the mental state we are
    chasing when we go into public spaces and pay for something as an excuse to feel
    leisurely there.


    # Doesn’t this sound tops?


    Ray Oldenberg, who coined the term, says a good third place should include the
    following characteristics:


    +   - cheap or free

    - easy to get to for many

    - welcoming and comfortable

    - occupants have little or no obligation to be

    - no emphasis on anyone’s social or economic status

    - both new and familiar faces should be found there

    - a playful mood, where conversation is the main activity'
