    \ 拍摄。\n\n## 许可密钥\n\nCC BY = 知识共享署名许可\nCC BY-SA = 知识共享署名-相同方式许可\n详细信息请见 www.creativecommonscommons.org\n\
    \n## 作者简介\n\nAnnie Raser-Rowland\n\nAnnie 在报税报表上填写“主业”一栏时可能会写下“园艺师”，但她认为自己首先是一个审美者。（她通常也会在“收入”一栏写下非常小的数字，却认为自己极其富有。）她从感官世界中获得巨大的快乐，并将在不破坏它的前提下享受它视为作为人的主要目标。她热衷于帮助他人这样做，放弃了艺术创作，转而教人们如何可持续地食自足。她曾在多个国家从事永续农业项目，合著了《澳大利亚野草采集者手册：食用与药用杂草指南》，并在墨尔本\
