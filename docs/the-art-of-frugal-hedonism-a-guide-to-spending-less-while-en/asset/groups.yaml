    ![](img/c65bfef74f426d079910ef9e22fa68dc_140_0.png)


    HRH Prince Charles in 2007 test drives a Saab BioPower convertible which runs
    up to 85% ethanol. A few months earlier, the Earth Policy Institute had reported
    that, "The grain required to fill a 25-gallon fuel tank of a sport utility vehicle
    with ethanol just once would feed one person for a whole year." Lesson: it is
    rare to find any real alternative to simply consuming less.


    There is an irony too, about buying stuff to help you with not buying stuff. Much
    more fun in general is to equip yourself with the knowledge to let you do it using
    things you already have. Before embarking on a new project, do a little research
    to acquaint yourself with the underlying principles, then apply that knowledge
    to your sauerkraut-making or seed-raising or whatever it is. Knowledge is true
    self-sufficiency. Old jars are a great help.


    That way, if you discover that you''re not that into making sauerkraut after all,
    there is no great loss. Alternatively, if you discover that you love bottling
    tomatoes and you''ve done it in jars sterilised in the oven for three years running,
    and may have even borrowed a friend''s preserving kit for test drive, then buying
    a second hand kit online could be a great decision.


    ## Superfoods


    You might feel like handing over chunky money for coconut water, vitamins, spirulina
    power bars, and goji berry powder is a worthwhile exception to your frugal ways;
    an investment in your health. You’re probably wrong. Don’t forget that the distributors
    of health food products are companies too, who often work very hard to create
    a lot of media spin around some very small, cherry-picked studies. If you have
    specific deficiencies that need fixing, maybe go there. Apart from that, most
    of us would probably do better by simply eating a diversity of fresh, whole foods
    with utmost relish, while not overeating, moving a lot, and having a really good
    time.


    ## #37. Figure out what you really enjoy spending money on


    Ice cream, ice cream, travel, ice cream, whiskey, ice cream. Ice cream. But each
    to their own. Across-the-board frugality is a deeply satisfying challenge for
    some personality types, but for many readers of this book, your consumption habits
    a good, hard eyeballing will lead to more of a thoughtful tweaking here, a painless
    pairing there, and an unabashed prioritising right in the sweet spot.


    Would you like your authors to use ridiculous pseudonyms to discuss a couple of
    our own friends by way of example? Happy to oblige.


    **Rufus Scrub and Jean Door** both work part time. They do jobs that, although
    not their dream jobs, are in their chosen fields. They don''t take many holidays,
    possibly because they aren''t overworked, and very much enjoy books, vigorous
    conversation, and staying at home and drinking wine in the garden. Sometimes in
    a paddling pool. While playing darts.


    They probably wouldn''t nominate themselves as particularly frugal, but they have
    chosen to evolve life habits that minimize their costs and maximize their pleasures,
    rather than working more. They are very computer-adapt, and save money by sourcing
    a lot of books, movies etc. cheaply. They also get a kick out of using their skills
    to fix and improve their computers, audio gear, phones, and anything electrical
    around the house. They build some of their technology out of components, allowing
    a better standard of equipment for less money.


    They have similar skills with bicycles, which they use to go everywhere, and maintain
    in good condition. They have no car. They buy minimal clothes and home accessories,
    valuing scavenged furniture and simple, stylish clothing.


    They are passionate about food and drink, and have a small but intensely productive
    vegetable garden to provide better quality fresh ingredients. They preserve a
    few things like lemons and onions, not to save money, so that they can have the
    best pickled onions and preserved lemons – though save money it does. They brew
    their own beer because they love figuring out how to make excellent beer, and
    so that they can be generous with it when friends appear.


    They also buy in bulk stuff they use a lot of, like good anchovies or olives.
    In some cases they split a bulk of something like olive oil with other foodie
    friends, saving them all money and packaging while getting a better product.


    They don’t skimp on the things that make them really happy. Eating out at amazing
    venues, classy gin, the most decadent cheese. Nor on those things that both make
    them happy, and make their lives more functional, like parts for their bikes or
    computers, cooking equipment or music.


    These fine cats are just one example of the very modern concept of ‘pick-n-mix’
    frugality that we suspect would not work nicely, but be a relief for many people
    who are exhausting themselves trying to ‘have it all’.


    Having it probably isn’t as great as it’s cracked-up to anyway. There is something
    inarguably dull about striving to pick every body considered appropriate for your
    social demographic. And at the extreme end of the got-it-all spectrum, you have
    heard about the therapy bills those ‘enviable’ types with designer lounge suites
    and private pilates instructors are racking up? Choose patching for mental and
    fiscal health today!!!


    > The prize for the most enjoyable use of money goes to... Experiences. Research
    is now backing up what most philosophers have been hinting at since the year dot:
    experiences are a better investment than stuff.


    An overview of data from across the social sciences has found that once basic
    needs have been met, “increases in our stocks of material goods produce virtually
    no measurable gains in our psychological or physical well-being”, despite our
    expectations to the contrary. Experiences, on the other hand, really deliver.
    So why don’t we think of them as a good investment?


    James Wallman, author of Stuffocation, has come up with five big factors that
    help explain why experiences win:


    - **The hedon treadmill.** This is the process of getting used to, or even bored
    of, material acquisitions so that we constantly need new acquisitions to maintain
    the same level of happiness. It doesn’t happen with the memories or expanded sense
    of self we gain from significant experiences.

    - **Positive reinterpretation.** When we buy an unsatisfactory material product,
    we just tend to feel pissed off. When an experience goes wrong, it can be as worthwhile
    as it goes right. Think of time that you journeyed to the beach for a nice day
    of swimming, but forgot your bathers. You mustered the courage to swim in your
    underwear, and then did Olympic sprints between the ocean and your towel in the
    hope that no one would notice what you were wearing. The friend who came with
    you laughed all day long, laughed when you related the story to people that evening,
    they laughed about it, and you felt a little bit braver to boot. This effect can
    be even found with experiences that were quite grueling at the time, as noted
    by Seneca (the ancient Roman philosopher) when he said, “Things that were hard
    to bear sweet to remember.”

    - Much harder to compare experiences than it is material goods. And even harder
