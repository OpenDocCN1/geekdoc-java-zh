    If you''re an average English-speaking Westerner, and you were to power your current
    lifestyle with human muscle power (e.g., with slaves), how many people would you
    need? Answer: around 114 healthy slaves would have to work around the clock to
    move your car, heat your house and power your appliances. Frankly, those lovely
    coalmines and oil wells mean we don''t need to worry about pesky things like the
    welfare or uprisings of these ‘energy slaves’. On the other hand, fossil fuels
    aren’t turning out to be so free either...


    Don’t be fooled though dear reader. Cause and effect are as real when it comes
    to personal consumption, as they were that time your poor high school chemistry
    teacher made an inspired bid for your hormonally-racted attention by dripping
    water onto powdered iodine and zinc, causing purple smoke to spew forth in a bat-out-of-hell
    way quite appealing to your moody teenage aesthetics! Here are three examples
    of small personal behaviours that are cumulatively wreaking death and destruction.
    Yet they could all be changed without even making a dent in our incredibly high
    standards of living. (The figures are from your authors’ native Australia, but
    U.S. and U.K. stats are not so different.)


    More than a third of all car trips in Australian cities are under three kilometres.
    Many of these are to supermarkets. Every time we permit ourselves this kind of
    driving (instead of walking, riding, or planning shopping around one trip a week
    instead of four) we produce unnecessary CO2 and pollutants. You know, that stuff
    is causing unseasonal droughts, floods, fires and hurricanes, and giving everyone
    respiratory disorders.


    Many of us habitually set thermostat a couple of degrees unnecessarily high in
    winter and low in summer (see also "44. Acclimatise to the seasons"), dumping
    even more CO2 and pollutants into the atmosphere. Wearing woolly sweaters and
    jumpers all winter may be a tad annoying, but so is losing all your crops (if
    you''re a farmer), and also having no ice to stand on any more (if you''re a polar
    bear).


    As a nation we not only eat, but we throw away an average of about 135 kilograms
    of food per year. (See "5. Hate waste" for more on this.) This occurs via habits
    like not using leftovers, buying one-off ingredients for recipes, and eating out
    at restaurants where the exaggerated servings force the poor diner to leave food
    on the plate. This food equates to millions of tonnes of fertilisers and synthesised,
    not to mention all the water inputs and the oil and other resources used for processing,
    packaging and transport.


    It''s not as though any of us chose to be born into this distorted situation,
    where everything is arranged to encourage us to constantly consume beyond the
    planet''s needs. But that doesn''t mean we can''t do anything about it. Like adopting
    the more streamlined consumption habits of a Frugal Hedon. The sooner we do so,
    the less damage will be left behind, and the more eons-long pleasure, on a Whole-Planet-With-All-Its-Monkeys-And-Trees-Small-Albino-Whales
    level, there will be left to share.


    > It may seem like there is a lot of repeating in this book about the careless
    use of food. Here''s why for Australians, around 28% of our personal greenhouse
    emissions are caused by the production and distribution of the food we buy (by
    comparison, electricity, gas heating and other energy used in the home only account
    for 16%). Over half of our personal water use also comes courtesy of the food
    system. In fact, these figures are underestimates, as they don''t include driving
    to the shops or home refrigeration and cooking when assessing food''s resource
    toll.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_92_0.png)


    ## 22. Remember the world of 1950s'' sci-fi


    Sometimes your authors like to think of frugality as a way for everyone to get
    what we was once the expected result of mechanisation and labour-saving devices:
    more leisure time. For much of last century, people were very optimistic about
    this. It did seem likely, given the appearance on the scene of some nifty inventions
    which simplified daily tasks and increased comfort – electric lights, vacuum cleaners,
    quick-dry stretch textiles... “Surely", thought humanity, “we will now cease to
    ruin our eyes sewing by candlelight, reclaim those hours once spent sweeping brooms
    around, and move about like gazelles in our flexible clothing!”


    Instead, we encountered the paradox where we made doing stuff easier and faster,
    and then just developed ever-escalating standards of normalised consumption expectations,
    and more industries to cater to them. And that meant we had just so much work
    to do as ever.


    Consuming less enables not only you, but your fellow humans, to work less. Imagine
    that when you buy a washing machine – what a fabulous invention you buy a good
    quality one that lasts. You look after it, only wash your clothes when they are
    dirty, use only when you have a full load, and use minimal eco-friendly detergent.


    You have not saved yourself money, but you have reduced the labour load of the
    people who mine the component materials, make, sell, and distribute washing machines.
    You have also shaved some time off the working day for the people at the waste
    water treatment plant, those doing environmental clean-up of ocean pollution problems,
    and those who dispose of white goods at the landfill. Imagine this effect via
    all your consumption choices!


    Unlike the smoky Runnernersque cityscapes anticipated by the sci-fi of the eighties,
    fifties’ sci-fi veered towards visions of verdant hills dotted with transparent
    dwellings under a crystal blue sky. Here again, doing work can help us redirect
    back towards our utopian ideals. Data indicates that households with higher work
    hours have higher carbon footprints. Being time-stressed makes people behave in
    more intensive ways (travelling faster, eating out, doing more convenience’ shopping).
    Countries with higher work hours have higher carbon footprints — because of the
    time-stressed households that comprise them, and because more activity demands
    more resource use.


    Just like ecological health, human health gets gradually eroded by keeping our
    noses too firmly to the grindstone. (And heaven knows your 1950s sci-fi utopia
    white suit won’t look half as fetching with anxiety etched into your forehead...
    or type II diabetes giving you.) Long work hours are associated with elevated
    stress — now acknowledged to be so bad for our bodies and minds that prominent
    investigator George P. Chronic estimates that it likely accounts for more half
    of the US’s healthcare-related expenses. The Japanese, notorious for their culture’s
