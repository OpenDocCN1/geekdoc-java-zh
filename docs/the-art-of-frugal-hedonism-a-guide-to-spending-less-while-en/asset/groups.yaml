    We can spend a lot of energy in modern life tally up what we might be lacking.
    Most people carry a conscious or subconscious ‘Things would be better if...’ list
    in their heads, which they constantly update and revise. It can be phenomenally
    liberating to notice that your life has been fine so far, maybe even pretty damn
    good, with what you already have. (Or if it hasn''t, it''s probably not because
    of a deficit of wireless speakers or a proper toothbrush holder instead of that
    mug with the pictures of Smurfs on it that you''ve always used to keep toothbrushes
    in.)


    So, the question you might want to ask yourself next time you are about to buy
    something (whether it''s a slotted spoon or a whole new kitchen), is not ‘Will
    this make my life better?’ but ‘Has my life so far been bad without this in it?’


    ![](img/c65bfef74f426d079910ef9e22fa68dc_105_0.png)


    This line of questioning circumvents some common bugs in the human brain. In most
    cases a new purchase *does* make some small aspect of life easier or nicer, and
    our brains anticipate this without factoring in the complete price of our purchases
    — be it-stress, over-stuffed cupboards, reduced creativity, or getting pudgy.
