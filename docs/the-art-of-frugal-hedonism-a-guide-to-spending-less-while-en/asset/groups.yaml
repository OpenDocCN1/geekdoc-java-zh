    # 31. Have a fine ol’ peasant time


    ![](img/c65bfef74f426d079910ef9e22fa68dc_122_0.png)


    Coloured engraving from William Combe''s A History of Madeira (1821)


    It was a bit of a revelation actually, the point at which your authors realised
    sitting around doing things with our hands while talking to people felt twice
    as nice as just sitting around talking to people. Even better, this handy discovery
    came at a bit of a low point in our journey into more concerted self-reliance.


    We had begun to notice that all the food-bearing vegetation we had so excitedly
    surrounded our house, and had coddled into superb health with endless loads of
    autumn leaves and worm castings, making much more food than we could eat. We gave
    some away, swapped some, and then started trying to preserve the rest. And it
    took *hours*. Entire days in some cases – to strip a fruit tree, cut out any bird-peck
    holes, stew and bottle the whole lot. The first few sessions in a steaming kitchen,
    simmering tomatillos into chutney, bottling quinces, stripping branches of basil
    to make into pesto for freezing, and slitting olives for brining, were pleasant
    enough. Put on an audio book and potter away. By the time Annie Annie had gotten
    through War and Peace on CD, she was beginning to pine for you, you know, some
    kind of life. With people in it.


    She got really quite cynical about the joys of home food production, until a day
    come where she took her bushel of broad beans that needed podding with her when
    she popped over to have tea with her neighbour. (Young broad bean dip is delicious
    and freezes well: pick them when they''re only fingernail-sized so they don''t
    double podding, lightly steam the poached beans after mashing up with olive oil,
    feta, lemon juice, salt and pepper.) After an hour''s casual chatting, they had
    not only caught on life events and worked out the details of the mulch delivery
    they were going to share, but all the broad beans had been podded, and no one
    had even noticing it.


    What a discovery! Apricot-bottling luncheons followed! Gregarious evenings shredding
    old telephone books while drinking apple cider and singing karaoke became a high-rotation
    activity! The devil may find work for idle variety: but from our observations,
    he is quite happy for it to be of the menial agricultural variety: put a pile
    of peas on the table to be shelled, and empty-handed company will reach for them
    as eagerly as if they were a bowl of salted peanuts. This is why people smoke?
    Need drinks to clutch at parties? All of us may be oxalic, but we are manually
    fixed too?


    Talk travels extra well when the hands are busy. Perhaps the shapes we are making
    with our fists and fingers help to spawn sympathetic shapes in the brain, sending
    thoughts off into more novel directions. Perhaps the sense that there is a background
    activity also narrating the space, removes just the perfect amount of pressure
    from conversation to allow a more luxuriant rhythm to develop. Perhaps it is the
    simple fact that for a fair chunk of human history, much of our conversational
    time must have been associated with long evenings of Whittling, sewing and weaving
    – all the small manual tasks of DIY human culture than can be brought inside once
    the day has dwindled and done by fire or lamplight in a companionable fashion.


    People love an activity that provides a social framework. It is one of life’s
    most fundamental pleasures to spend time with other human beings while engaging
    in a challenge or accomplishing a task. Bowling alleys and boardgames; barn-raisings
    and beer brewing. Your authors habitually mingle our productive time with our
    social time. On the smallest scale, making this happen involves keeping a stash
    of mending, seed-sorting, or other simple handwork within easy reach to idle work
    on while chatting with unexpected visitors. On the bigger scale, it involves everything
    from passata-making days (of the kind traditional Italian families are famed for),
    right through to ‘nerd nights’, where a group of friends hang out and investigate
    a topic they are all interested in.


    # 32. Put on your favourite power anthem, and be the zeitgeist


    As much as the great novels of the ages celebrate outsiders; as near as to our
    hearts as many of us clutch our anti-heroes of music and our historical rebels,
    ain''t no one ever pretended it''s easy being different. Operating somewhat to
    the side of the endorsed mainstream is always going to require a little fancy
    footwork, a little determination, and a little practice.


    One struggle you may face as a frugalist in a culture of constant splurging, is
    good old-fashioned jealousy. Depending on your personal Achilles heel, you might
    find yourself gazingingly through the shiny windows of restaurants, envying all
    the fancy food the people are eating. You might ogle shoes, or cars, or trendy
    bicycles, or thoughtlessly consumed chocolate bars in the fists of people next
    to you on buses. All that stuff is nice; why the heck wouldn''t you want it?


    Well, let your ogling eye do a little memory trawl. Let it recall the tired, shut-down
    rows of faces on the train in rush hour. Let it envisage the desperate pumping
    of the blobby limbs through the gym window trying to regain some of their animal
    litess. Let it observe the contrived self-consciousness of the doggedly-fashionable.
    Let it, if you dare, recapture the powerless anxiety in the faces of people at
    the last party you went to as they moved into a conversation about how hectic
    things are, how frustrating their job is, how tight money is right now. At this
    point, you''ll probably notice that you''re gazing covetously again – at your
    own life! And that your spirit is soaring up, up, from the ashes of jealousy,
    up into the phoenix-hood of glee at how much you love the way you live.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_126_0.png)


    The phoenix of glee, feeling just super about tropical fruit and tambourines,
    amongst other things.


    Depending on what slice of society you inhabit, cutting your consumption will
    almost certainly disconcert a few people. They will make uncomfortable jokes when
    you bring coffee to work in a thermos, don’t order dessert when eating out because
    you’re already full, show up at an event even pink-cheeked and windswept after
    riding through stormy weather to get there. Not uncommon is the technically complimentary
    but subtextually alienating “Omigod, you’re so good…


    This soon evaporates. People are simply disconcerted by what is unfamiliar, so
    as you persist in your new behaviours, they will become familiar, and once again
    largely invisible. A few observers will generally become curious enough along
    the way to ask you what you''re doing what you''re doing, especially when they
    notice you turning down, losing weight, or talking about the amazing weekend you
    had in the mountains digging a snow cave because your tent collapsed in a storm.
    You explain that you''re experimenting paring back here and see so far, if it
    gives you more freedom to choose what you do with life. That so, the trade-offs
    seem worth it. Most people respect this. Many will ask for tips. And the rest
    can jump in a lake. It''s your life, after all.


    If your pre-Frugal Hedonism socialising revolved mostly around eating out, bars,
    and movies; it''s time to seed your social life with a new crop of cheap thrills.
    Bring people wild berry picking with you! Invite them along to catch a train to
    the beach for the day. Hold a story-telling night. Play ultimate Frisbee, or chess.
    Make a date to do it weekly. Invite people round for casual dinners, lunches,
    breakfasts and picnics. Offer or ask someone you know for help with taking up
    the cuffs of a pair of pants, an IT problem, or a trombone lesson. Then eat lunch
    together.


    Your authors will not tell a lie; we went through a teething period where we didn''t
    replace enough of the fiscally-demand social events we were turning down with
    cheaper ones. But as we noted the diminished state of our social lives, we pulled
    our socks up, grabbed ourselves by the lapels of our secondhand jackets, and started
    roping friends into events like the ones listed above. People seemed to welcome
    our stingy catch style with willing relief, and it hasn''t been a problem since.


