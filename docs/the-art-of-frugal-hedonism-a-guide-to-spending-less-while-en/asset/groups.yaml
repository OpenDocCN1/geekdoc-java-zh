    如果你是一个普通的英语国家西方人，且要用人体力量来维持你现在的生活方式（例如依靠奴隶），你需要的多少个人？答案是：大约 114 个健康的奴隶需要全天候地工作，才能移动你的汽车、加热你的房屋并为你的家电器供电。坦率地说，那些迷人的煤矿和油井意味着我们不需要担心这些“能源奴隶”的福利或起义之类的烦人事情。另一方面，化石燃料也并非真的廉价……


    不过，亲爱的读者，别被欺骗了。在个人消费方面，因果关系就像当年你那可怜的高中化学老师一样真实：他向粉末碘和锌中滴入水，试图博取你受荷尔蒙驱动的注意力，导致紫色烟雾极快地喷涌而出，那对你当时心性多变的青少年审美来说极具吸引力！以下是三个小个人行为的例子，它们正累积地造成着毁灭性的破坏。然而，所有这些行为可以在不影响我们极高生活标准的情况下被改变。（这些数据来自我们作者的家乡澳大利亚，但美国和英国的统计数据也大相相同。）


    澳大利亚城市超过三分之一的汽车行程在三公里以内。其中许多是去超市。每当我们允许自己这种驾驶方式（而不是步行、骑行，或计划每周通过一次完成购物，而不是四次）时，我们就产生了不必要的二氧化碳和污染物。你知道的，那些物质正在导致反季节的干旱、洪水、火灾和飓风，并让每个人患上呼吸系统疾病。


    我们许多人习惯性地在冬天不必要地将恒温器调高几度，在夏天调低（另另见“44. 适应季节”），向大气中排放了更多的二氧化碳和污染物。整个冬天都穿毛衣和开衫可能有点烦恼，但失去所有的作物（如果你是农场主），再也没有冰可以站（如果你是极地熊）同样令人苦恼。


    作为一个国家，我们不仅吃东西，而且平均每年扔掉约 135 公斤食物。（更多信息请参见“5. 厌恶浪费”。）这通过多种习惯发生，如不吃剩菜、为食谱购买一次性食材，以及在餐厅用餐，那里夸张的份量迫使可怜的食客在盘中留下食物。这些食物等同于数百万吨肥料和合成，更不用说加工、包装和运输所使用的所有水资源、石油和其他资源。


    并不是我们中的任何一个人选择出生在这个扭曲的境地，这里的一切安排都在鼓励我们不断过度消耗地球资源。但这并不意味着我们无能为力。例如采用节俭享乐主义者（Frugal
    Hedon）那种更精简的消费习惯。我们越早这样做，留下的破坏就越少，留给后世那种“拥有所有猴子、树木和小白鲸的完整星球”级别的快乐就越越多。


    > 这本书中关于浪费食物的内容似乎有很多重复。这是因为对于澳大利亚人来说，我们大约有 28% 的个人温室气体排放是由购买的食物的生产和分配造成的（相比之下，家庭使用的电力、天然气加热和其他能源仅占  6%）。我们一半以上的个人用水也归功于食品系统。事实上，这些数字是低估的，因为在评估食物的资源成本时，它们没有包括开车去商店或家中的冷藏和烹饪。


    ![](img/c65bfef74f426d079910ef9e22fa68dc_92_0.png)


    ## 22. 记住 1950 年代的科幻世界


    有时我们作者们喜欢把节俭视为一种让每个人获得曾是机械化和省力设备预期结果的方式：更多的空闲时间。在上世纪的大部分时间里，对此非常乐观。考虑到一些简化日常任务并增加舒适度的精妙发明的问世——电灯、吸尘器、速干伸缩织物……这看起来确实很有可能。人类曾想：“我们现在再也不用借着烛光缝纫而坏了眼睛了，夺回曾经花在扫地上的时间，并穿着灵活的衣服像羚羊一样移动了！”


    相反，我们遇到了一个悖论：我们让事情变得更简单、更快，然后就此发展出了不断升级的常态消费预期标准，以及更多迎合这些标准的行业。这意味着我们要做的工作依然和以前一样多。


    减少消费不仅让你，也让你的同类工作更少。想象一下当你买了一台洗衣机——多么不起的发明，你买了一台耐用的优质产品。你爱它，只在衣服脏了时洗涤，只在满载时使用，并使用极少量的环保洗衣剂。


    你并没有给自己省钱，但你减少了那些开采原材料、制造、销售和配送洗衣机的人的工作。你还为水处理厂的人、清理海洋污染的人以及在垃圾场处理白色家电的人节省了时间。通过你所有的消费选择产生这种影响！


    与 80 年代科幻作品中预言的烟雾缭绕的城市景观不同，50 年代的科幻转向了绿水山山点缀着透明房屋、水晶蓝天空的愿景。在这里，减少工作可以帮助我们回到乌托邦理想。数据表明，工作时间越长的家庭碳足迹越大。压力状态会让人们以更密集的方式行为（出行更快、外用餐、进行更多便利购物）。工作时间越长的国家碳足迹越大——因为构成这些国家的压力型家庭，也因为更多的活动需要更多的资源消耗。


    就像生态健康一样，人类健康也会因为埋头苦干而逐渐侵蚀。（而且天知道，你的 50 年代科幻乌托邦西装如果额头上刻着焦虑……或二型糖尿病，看起来就不看了。）长时间工作与压力增加有关——压力现在被认为对我们的身心如此有害，以至于著名调查员乔治·P·克尼估计它可能占美国医疗支出的一半以上。以强度工作文化闻名的日本人，甚至为过死有一个专门的词：过劳。


    1914 年，亨利·福特发现工业革命留下的“时间越长越好”的遗产（见我们的下一条建议“23. 学习工作历史”）实际上损害了他的制造工厂的生产力。他缩短了工作时间，随之而来的利润令人惊叹。现代生产力研究不断证实了福特的发现。他们雇佣企业客户确保员工经常休息、使用分配的假期并且不带工作回家，这一切都是为了生产力。奇怪的是，现在似乎没有人愿意听了。自
    70 年代以来，英语国家的工作时间一直在增加；周末已成为一个危险的概念，每周 55 小时工作加上无薪加班是许多职业的常态。许多欧洲国家已经反对这种全投入的工作周。例如，德国或荷兰的平均工人每年工作比美国同事少整整
