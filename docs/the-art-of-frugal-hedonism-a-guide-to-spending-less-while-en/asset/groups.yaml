    # 18. Grow your own greens


    Even if you haven''t done much gardening before, or just aren''t interested, we
    most fervently recommend growing your own salad and cooking greens, and perhaps
    some herbs.*


    Here''s why: leafy greens are some of the easiest, cheapest plants to grow, yet
    are expensive to store and transport, so are disproportionately expensive to buy.
    Home-grown and picked right before use, they are definitely tastier and more nutritious,
    not to mention pesticide-free. Greens generally don''t need as much sunlight as
    many crops, don''t take up much space, and can be grown very well in pots. Finally,
    you get to harvest the amount you want, rather than paying for a whole bunch of
    thyme when you just needed a sprig, or a whole lettuce when you just wanted enough
    for a sandwich.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_82_0.png)


    > Note: you may need to grow your greens in a raised bed if your suburb has a
    feral tortoise problem.'
- md: '

    Almost anyone can find a good spot to grow parsley, mint, spring onions and chives.
    For Mediterranean herbs however (like rosemary, thyme, oregano, bay and sage),
    only go there if you can give them at least five hours of sunshine a day.


    ## 19. Get in touch with your inner hunter-gatherer


    If it so happens that a dark cloud hovers stubbornly over your green thumb, there
    is still one genre of plants you will likely excel at growing: weeds. This needn''t
    be the curse it might seem, for the majority of leafy weeds are marvellous edible
    greens themselves. Amaranth, dandelion, mallow, purslane – even if you don''t
    know the names, you''re likely to recognise these globally ubiquitous pop-up plants.
    Most have been used in traditional cooking for thousands of years, and are actually
    more nutritious than cultivated plants.


    Such a fine and fun skill is the hunt for wild greens that we have written a book
    on the topic (The Weed Forager''s Handbook). As a bonus, if you make supplementing
    your diet this way a habit, you might just find that you have also begun to feed
    the fundamental Homo sapiens instinct to roam-and-pluck with something much more
    honest than another pair of shoes you really didn''t need. While connecting with
    your ancestral cave-self, you may discover that you are connecting more intimately
    with your neighbourhood. The pursuit of wild foods not only furnishes you with
    a heightened awareness of the seasons, but has a way of leading you into corners
    of your garden or suburb that you would never have visited.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_85_0.png)


    Here''s one of our favourites to whet your appetite: purslane (Portulaca oleracea).

    Use it like the Mexicans, cooked into scrambled eggs, or like the Greeks, in a
    simple salad with tomatoes, red onion and parsley.


    On one occasion, while we out harvesting edible weeds on an overgrown vacant block,
    your authors grew languid and felt compelled to stop and lounge in the warm summer
    grass. Adam decided to use a large abandoned suitcase as a chair, then dozed off
    in its surprisingly comfortable embrace – a hazy magical experience tempered only
    slightly by waking up later feeling a little disoriented, cold, and abandoned,
    as Annie had long since headed home. Annie counters that Adam was looking so peaceful
    she couldn''t possibly wake him, and anyway it''s a nice neighbourhood, and she
    had food in the oven she had to check on, and what is the whole point of this
    anecdote anyway? (Can we say at this point that co-authoring is a sometimes-challenging
    process...)


    ## 20. Indulge your curiosity


    Papa has brought presents from his trip to market! There is a hair ribbon, a piece
    of slingshot rubber, and a stick of hard candy which little Alice and Samuel carefully
    divide. Thrilling acquisitions to be sure, just as thrilling as Papa’s description
    of the orphaned baby kangaroo that the grocer’s has taken on the care of. The
    children rain down questions about how it drinks its milk, where it sleeps, how
    long its tail, and whether it has any fur. The answers are stashed away greedily
    for future contemplation.


    Most people love the feeling of getting something new, but forget that it can
    come as easily from discovery as from consumption. A fascinating fact, an anecdote,
    learning how to do something, having an experience you’ve never had before, hearing
    some gossip – anything that extends our picture of the universe we’re part of.


    Craving novelty or stimulation? Don’t buy another shirt or scan the papers for
    a new café to. Instead, learn the name of three plants in your garden and what
    their Latin names mean. Use the internet to teach yourself a dance move. Read
    something by a writer you’ve always meant to get acquainted with. Take a free
    tour of a public building. Ask an eloquent friend to tell you about their childhood.
    Look up five uses for sour milk apart from the one listed in tip “5. Hate waste
    of this book. Go to the library and find out the history of your suburb, street,
    or maybe even the past residents of your home. Take a photo of the night sky every
    night for a fortnight, and see how it changes. Draw a picture of your cat… using
    your toes.


    Indulging your curiosity isn''t only a less expensive way of getting that ‘Feeling’,
    it is deep hedonism. As your understandings amass, you begin to sense the world
    around you as a dense and majestic cathedral of thrumming, interconnected functions
    and stories. Plus, you can reveal whole-heartedly in these riches as you accrue
    them, knowing that they require no wardrobe space or loan repayments!


    ![](img/c65bfef74f426d079910ef9e22fa68dc_87_0.png)


    This is a baby ladybird! It''s not as pretty as its parents, but it sure eats
    a lot of aphids.


    Knowledge can function in lieu of material goods in other ways too. Your authors
    would much rather someone showed up for afternoon tea bearing a piping hot tale
    of something riveting than clutching a bag of danishes, and we''re certain many
    others feel the same way. Converting your thoughts or discoveries into something
    tellable not only entertains and enriches your audience, but it clarifies and
    cements them for you, the teller, so too. You''re forced to do a little ordering
    of the information in your head, noting its most crucial and captivating details.
    You might spot a few missing links that you''d like to fill in, or even a revelation
    you''ve come to. The whole process is an art worth cultivating.


    Indulging your curiosity can be as simple as diving for a dictionary every time
    stumble across a word you don''t know. However, it drives you further afield,
    into the world of experience. Doing a long distance bike trip, eating a whole
    habanero chilli, experimenting with barefoot running, or going to midnight mass,
    all because you''re curious what things are like. Studies repeatedly indicate
    that experiences deliver more and longer lasting happiness than things do. (See
    our box under "37. Figure out what you really do enjoy spending money on" for
    more on this.)


    Chasing experiential curiosity can be expensive, and is an area where your authors
    sometimes ignore frugality. We''ve forked out big bucks to take a hot air balloon
    trip, do a short course with a world-class expert, or go to a mind-blowing theatre
    show. We don''t regret a penny of it though, not only because of what we do to
    indulge our curiosity is free, but because being curious saves us from the costly
    compulsion to browse for new purchases as a source of stimulation and novelty.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_88_0.png)


    We don''t have a cat, so here are some pictures we drew of each other with our
    toes instead.


    ## 21. Don’t be a selfish


    Not over-consuming is simply the polite thing to do on a finite resources. We
    will assume that you, dear reader, know a fair amount about this situation already,
    and have possibly felt waves of paralysing doom crashing about you when contemplating
    the huge cogs of industry and economy that seem to churn relentlessly forward
    coming up all that was sparkling and rich with energy and fertility stores laid
    down over millions and zillions of years.


    Despite this awareness, most of us struggle to make the connection between our
    personal habits and suck: in any visceral fashion. That’s not surprising, given
    that the chains of supply and disposal enabling our consumption are now largely
    distant or hidden. For most of human history, we have been used to social and
    environmental setups where we behave irresponsibly or greedily or lazily, life
    begins to suck: our neighbours shun us; our crops fail; all our assets go to pot;
    our animals die; our drinking water fouls. Over time we have come to trust this
    mechanism that tells us that ‘if life is really pleasant, then we can’t be doing
    anything too bad’. So now, in this warped setup, which enables us to comfortably
    and repeatedly do lazy, greedy things – causing really unimaginable harm – we
    just can’t quite believe that our behavior could be deeply problematic, because
    our living conditions are so freaking pleasant.


    Energy slaves


