- md: '

    given that you have to step outside your own self-critical internal monologue
    and really pay attention to someone to cheer them up. Volunteering in the community,
    or simply providing support to family and friends, has in fact been shown to correlate
    with increased longevity, decreased distress, and increased feelings of meaning.
    A University of California study found that volunteering for at least two organizations
    was as beneficial as exercising four times a week in terms of reducing mortality
    rates. One study in the 1980s even found that just watching Mother Teresa do charitable
    things increased onlookers'' immune system antibodies. In several studies, results
    indicated that caring or spending money on others conferred more health and happiness
    benefits than being cared for or spending money on yourself.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_184_0.png)


    | | spent on self | spent on stranger |

    |---|---|---|

    | $5 | same as before | happier |

    | $20 | same as before | happier |


    Students were given envelopes with either $5 or $20 in them, and instructions
    to either spend it on themselves or on a stranger (such as treating a stranger
    to a cup of coffee). The next day, those that spent the money on a stranger reported
    feeling happier, whereas those that spent it on themselves felt no different (regardless
    of how much money they were given).


    ## 50. Sup at the cultural buffet


    Cultural backlashes have a way of oversteering. There was a lot to dislike about
    being a peasant, to be sure. Think superstitions, thatched roofs, hair lice, and
    17th century density. But as the potential for being middle class emerged, we
    may have gone a tad overexcited, and ditched all manner of very worthwhile things
    in our enthusiasm. Take, for instance, growing food at home. What might the neighbours
    say?! “Can’t you afford food the supermarket?” So the rise of suburbia last century
    saw everyone who anyone ditching the vegetable patch and cultivating a patch of
    lawn instead; previously an ostentatious symbol reserved for the English entry.


    Now we’re at a point where the industrial middle class experiment has been running
    for few generations. We citizens of privileged nations have immersed ourselves
    in home entertainment, a cornopia of domestic appliances, interior design, bottled
    Fijian spring water, supermarket shopping and life coaches. Who could deny that
    it has a strange and marvellous ride? But one dense with inane and passive thrills,
    giving us short attention spans, huge rates of legal and illegal drug use for
    anxiety and depression, youth suicide, obesity, existential crises and so many
    distracting cute animal YouTube videos that it’s hard to get on with having a
    life. (Although – you have seen one where the cheeky gibbon pinches the ears?
    Because that’s worst not having a life for.)


    But we digress. The point your authors would like to make is that it would be
    silly for a Frugal Hedonist to be disdainful of everything associated with middle
    class living and modern technologies – to repeat the mistake we all made when
    we rejected peasant culture in a wholesale fashion. The luxury of history is that
    we can survey what has and hasn’t worked out for various incarnations of humankind,
    and adopt a cultural mash-up approach accordingly.


    Adam corresponded for some time with a well-travelled West Papuan tribesman who
    said the quite thing he liked about the modern world was the internet. We''re
    not quite so extreme. We''d add to the list: recorded music, lightweight tents,
    stick mixers, strings of little coloured lights, bicycles, occasional air travel,
    and sneakers. From other eras we''ll take physically active lifestyles, for luxuriant
    contemplation and conversation, knowing how to recognize food in the landscape,
    time without screens, and finding quiet grassy hollows to take a nap with your
    head resting in the crook of your arm. Among other things.


    Make your own list. Really assess what you think works and is worthwhile in modern
    culture, and what you think other times and other peoples did better (or were
    better off without). Think about creating a chimera life based on your evaluation.
    Maybe you''ll move to a tiny apartment, get rid of your TV, take up letter writing
    and amateur circus in the evenings, and spend six months of every year bicycle
    touring with a bag of oats in your pannier and the best lightweight rain gear
    technology can supply. Maybe you''ll become a modern monk-scholar who spends your
    days in deep reverent study at a warm, well-lit library, and your nights helping
    to feed the hungry from a soup van, before skateboarding home on the quiet midnight
    freeways, nibbling on feral-goat jerky. We''d like to have some home-grown dandelion
    coffee with you in our kitchen decorated with golden glitter while listening to
    Scandinavian synth pop on our solar powered laptop when you do...


    ## 51. Look up, think about constellations. Look down, think about magma.


    Sometimes when you are feeling drenched by the details of your own life, it''s
    time to pack a suitcase for your myopia, and send it on holiday.


    Look up. There is so infinitely much matter than you out there, hurling forth
    glowing plumes, imploding into vortexes, converging into gaseous balls, then shattering
    into incandescent rain. It is endless and eternal and entropic and generative
    and holy in the most religion-irrelevant sense of the word.


    Look down. There is the great grinding, shifting, melting foundry for all the
    yawning canyons and toothed peaks and rift valleys. There is the alchemical trinity
    of moisture, mineral, and organic debris that has the power to birth new life,
    and which informs the composition of your bones, the structure of your extracellular
    matrix, the very viscosity of your blood.


    Remembering where and what you are should not be the end of feeling like an insignificant
    speck. You are woven of this stuff, starlight and magma, Anne says it''s moving
    with panache, grinning slightly, dreaming. Adam says it''s moving with impressiveness,
    of fuckedness, a player in an unfolding story. The naked apes that discovered
    fossil fuels and created a global civilisation with music.


    It’s not as if you can keep this stuff in mind all the time. But make a nook in
    your brain that remembers it, and you can step into it whenever you want to put
    things back in. Going there can give you giant feelings zizzing through your body.
    It is also likely to make you less needy, and maybe a bit euphoric. Sounds a bit
    like being a Frugal Hedonist.


    ## Further resources


    Lifestyles, real and imagined, to help you recalibrate


    - Tales from the Green Valley (Lion Television for BBC Two, 2005). A team of historians
    and archaeologists recreate the lifestyle of a 1620s farm for a year and, as hard
    as it is, kind of love it. In fact, they must have really loved it, as several
    of them went on to do series in the rural lifestyles of other eras. Annie wants
    to come clean: she has watched every one of these series, some of them more than
    once.

    - Entropia by Samuel Alexander (The Simplicity Institute, 2013). Someone had to
    be brave enough to write it: not so much a novel as an attempt at envisaging of
    what a sustainable society might look like.

    - The Transition movement is a global network of people creating whole streets
    and towns that are moving to a lower-energy use, more community-based lifestyle.
    Their website is dense with resources: www.transitionnetwork.org.

    - Welcome to Lagos (BBC, 2010). An excellent three part miniseries about how people
    make do in the slums of Lagos, Nigeria. Makes you feel spoilt rotten, grateful,
    and inspired all at once.

    - The Supersizers Go... Wartime (Series 1, episode 1. BBC Two, 2008). Two obsessed
    Britons eat a diet from the ration boxes of World War 2. Because they’re comedians,
    they have to make lots of ‘blech’ noises while eating the austere diet, but because
    they are comedians, it is also hilarious, and there’s interesting stuff to take
    away.

