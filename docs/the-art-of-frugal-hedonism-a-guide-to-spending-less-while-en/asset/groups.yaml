  mdcn: "\n与农业或园艺有关。所以，如果你不想干铲子活，你可以寻找招建筑工、保姆、练习语言等等的地方。他们还有在线系统的优势，可以对房主进行评分和评价。\n\
    \n- **Warm Showers** 类似于自行车游客版的 Couchsurfing。\n  www.warmshowers.org\n\n- **换宿（House-swaps）**。对于较长的逗留，你通常可以获得免费住宿，有时作为照顾宠物等的回报。一个网站是：www.homeexchange.com\n\
    \n- 它非常有名。**Airbnb** 是人们出租住宿的地方，包括在他们外出时出租自己的房子。它满足各种预算的需求。www.airbnb.com\n\n\
    - **搭便车（Hitchhiking）** 是我们最喜欢的出行方式之一。这个页面（在 Wikitravel 上）——一个优秀的免费旅行信息协作来源——充满了出色的建议：\n\
    \  www.wikitravel.org/en/Tips_for_hitchhiking.\n  **Hitchwiki** 充满了用户生成的信息，涵盖每个城镇的建议以及搭便车点的互动地图和经验分享。www.hitchwiki.org\n\
    \n- **Sleeping in Airports** 是一份用户生成的指南——正如你可能推测的那样——关于在机场睡觉的。www.sleepinginairports.net\n\
    \n## 共享与免费物品\n\n- **StreetBank** 是一个与邻居分享工具和其他物品的网站。www.streetbank.com\n\n- Freecycle\
    \ 是一个当地小组网络，人们在其中提供不再需要的免费物品。www.freecycle.org\n\n## 维修/制作物品\n\n- Instructables\
    \ 拥有数千个 DIY 项目和修理教程，从面霜配方到拖拉机修理无有包。www.instructables.com\n\n- iFixit 是一个互相帮助修理东西的在线社区。规模虽小但正在增长。www.ifigit.com\n\
    \n- Repair Café（维修咖啡）是一个全球性的场所网络，你可以在那里找到工具并修理损坏的物品——它们始于阿姆斯特丹，现在已有750 多处，尽管目前阶段在澳大利亚只有几家。www.repaircafe.org\n\
    \n## 随机趣闻\n\n- Barry Schwartz 写的《选择的悖论》（Paradox of Choice，Echo, 2003）。关于过多的消费者选择如何令我们感到不快乐的非常有趣的视角。\n\
