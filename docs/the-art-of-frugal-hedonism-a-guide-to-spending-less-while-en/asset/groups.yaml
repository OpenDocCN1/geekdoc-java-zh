    # 36. Undercomplicate things


    Over the years, your authors have become wise in a couple of specific consumption
    genres that can lure a Frugal Hedonist. They do this by their very aura of investments
    in a longer-term good life. If you are a reformed big-spender who is transitioning
    to Frugal Hedonism: alert! You are particularly at risk of accidentally replacing
    your previous consumption habits with new ones, and the following three categories
    are prime contenders.


    Eco-tech products


    Surely it is justifiable — nay, even noble — to spend your hard-earned money on
    a new water-efficient washing machine. Or a set of bamboo fibre sheets, or a hybrid
    car. But while these purchases carry the bonus of supporting worthwhile new products
    and industries, don''t kill yourself that you''re ever going to get, is almost
    always the one that you (or somebody else) already have . The greenest product
    you''re ever going to get, the energy costs that go into making and distributing
    are by even energy-efficient, sustainably-sourced new objects is very high. Generally
    much higher than whatever energy you will save by using that object rather than
    continuing to maintain and use an object until it is truly worn out.


    Mini-example? The guy who buys a fully-biodegradable plant-gum-based waterproof
    sheath to protect his phone when he goes fishing is less green than if he had
    just wrapped it in an old plastic bag. Mega-example? The couple that pour all
    their money into building a brand new eco-home, complete with non-toxic paints,
    passive solar design and state-of-the-art composting toilet are being less green
    than if they had kept caring for and living in the old cottage that was on the
    land they bought it.


    Before hitting the eco-product catalogues, explore your other resourcefrugal options!
    The gold class response is to change your behaviour as to avoid or reduce the
    need to consume in the first place. Next on the'
