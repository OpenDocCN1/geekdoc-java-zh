    # 12. Enjoy excess


    We have virtually no evidence to support our claims here, but your authors suspect
    it''s mighty unwholesome to live by any ethos 365 days a year. Your neural pathways
    need regular shake-ups to keep them nice and elastic, so we advocate periodic
    abandonment of all forms of regular behaviour.


    There is a risk for some frugalists of becoming fixated on only consuming the
    necessary minimums, or only doing what is functional. This may be frugality, but
    it is not Frugal Hedonism. The Frugal Hedonist regularly prioritises and indulges
    in the unnecessary! Frolicking in the ocean for hours, making leisurely life,
    falling asleep in the park all afternoon, or staying up until dawn to finish a
    gripping book. This kind of abandon is, if anything, more available to the person
    who is not burying themselves in a stupor of fiscally-supplied indulgences. Your
    authors suggest using the extra time and inventiveness you acquire as a Frugal
    Hedonist to be behaviourally excessive and frivolous as often as desired. Here
    are some sample possibilities:


    +   - Devote an entire summer''s day to wandering the streets and alleyways of
    your neighbourhood samplinghanging fruit.

    - Get up in pre-dawn blackness on a morning when you don''t have to, set yourself
    up somewhere reverential, and watch the sun come up.

    - Eat spaghetti bolognese with your fingers... or without using your hands at
    all.

    - Listen to opera at maximum volume, in the bath, or the dark. Or maybe that kind
    of death metal sounds strangely similar to opera.


    There is however, also a special place in Frugal Hedonism for really abandoning
    yourself to excessive consumption now and again. Firstly, we think it satiates
    a very basic human urge to blow material moderation to Timbuktu once in a while.
    Secondly, it is beautifully protective against'
- md: '

    twinges of jealousy that may rear up as you watch the consumer society around
    you incessantly gorging itself – when you get to throw limits to the wind now
    and again, but suffer none of the damage that comes with ongoing over-consumption,
    you truly do feel like you''re getting the best of both worlds. One of your authors
    likes to satisfy this need with an occasional session of staying up into the small
    hours and watching English murder mysteries while dunking chocolate biscuits in
    whisky. There are clavier options available, of course. A friend of ours an oyster
    farmer in the family, and sometimes brings home a whole backlog of the ones that
    are under commercial weight, dish them out to guests sprawled on a blanket in
    her garden until no one can eat another oyster.


    An excess of a single ingredient actually seems to make excess even more excessive,
    and this factor makes seasonal gifts a perfect starting point for consumption
    bonanzas. We hosted a banana party when our palms last produced more than we could
    ever eat by ourselves. We dragged half the pot plants in the garden to make a
    jungle, stuck up some monkey pictures, and requested that our guests wear yellow
    and bring something that could be combined with bananas. We ended up with flambés,
    daiquiris, and banana-peanut-butter jaffles having been eaten to Hawaiianian music,
    as people shared odd banana trivia and waxed surprisingly lyrical over their personal
    relationships with the yellow curvy fruit.


    Cultural events of material excess can also be good. Think Halloween trick-or-treating,
    and Easter egg hunts – the latter at least being available to adults as to children.
    Don''t just fall prey to engaging in holiday-themed shopping for the whole month
    leading up to the occasion, as retailers now encourage so unabashedly. After all,
    pulses of excessive consumption only become valuable if your life is otherwise
    one of material leanness. In this context, they offer the intoxication of breaking
    all the rules, and acquire their proper glory. They can also make us feel quite
    relieved about a return to regular life… once the stomach ache wears off.


    ## Ready, aim, gazpacho!


    ![](img/c65bfef74f426d079910ef9e22fa68dc_63_0.png)


    La Tomatina, the annual tomato-throwing festival in the Valencian town of Buñol,
    is the world’s largest food fight, with an estimated 150,000 tomatoes being hurled
    into a pulp throughout the day. This frenzy of profligacy is hardly an extension
    of a year-round culture of excess. It actually occurs in a region where the inhabitants
    have little choice but to be frugal with resources in their daily lives (the average
    income per capita in the region, even adjusted for purchasing power, is around
    half that of the United States).


    The festivities take place on the last Wednesday in summer, kicking off with the
    *palo jamón*: a game in which revellers attempt to topple a ham off a greasy,
    while the crowd cheers and dances. With the touching of the ham, trucks carrying
    the tomatoes enter the square, and the fight begins. After an hour of impassioned
    tomato tossing, the streets are a red river. Water hoses signal the end of the
    fight, and the thickly coated celebrators are washed down.


    Most traditional cultures have feast days and other frenies of material excess
    incorporated into their calendar. Perhaps they understood the value of devoting
    some resources to occasions of extravagance, to invert the material conservatism
    that has been the necessary mode of day-to-day life for most of human history.
    Possibly our psychological craving for such events goes right back to the influxes
    of super-abundant meat that would have followed a large kill in hunter-gatherer
    societies. Groups who still live this way have been noted to engage in marathon
    dance sessions on the day a kill is brought home.


    We’re pretty sure that partying has so often gone with abundance partly because
    it’s nice to have a full belly, but there is a possible further function of the
    feast-fiesta. Making your occasions of profligate consumption into a good hoo-ha,
    or a conscious ritual, highlights them in your memory, where they act as strong
    confirmation to your psyche that you have ‘enough’ (just as giving does — see
    “49. Give something”). It often seems that the rampant consumption that characterizes
    modern affluent culture is a response to a feeling of never quite having ‘enough’.
    So ironically, peppering your life with punctuation marks of emphatic excess may
    be an excellent defence against hankering after every sugary or shiny commodity
    that prances your way.


    ## 13. Listen to the Habit Scientists.

    Yes, they have those now.


    We are creatures of habit, and a very adaptive trait it is too. Mental processes
    burn up a heck of a lot of (historically) precious kilojoules, so evolution has
    designed us to favour even flawed automatic behaviours over repeatedly using time
    and energy to think about what would be good to do in every individual situation.


    Giving these entrenched behaviours a makeover isn''t always easy. As if the sound
    of your evolutionary brain yelling at you for kilojoules whenever you try to change
    a teeny tiny habit wasn''t putting enough, consider this: although self-discipline
    is now talked about as though it were a fundamental personality component, it
    hasn''t been much of a player until the last few centuries of our evolution. When
    your basic activities are absolutely necessary to provide you with food and shelter
    for the immediate future, there is unlikely to be any fanning along the lines
    of ‘Oh, golly, can I really be foraging today?’ Also no need to manifest the discipline
    to CONST NOT EAT CHOCOLATE CAKE, or to not play World of Warcraft for nineteen
    hours straight. We are surrounded by a kaleidoscopic wealth of tantalizing hyper-stimulation
    and easy calories, but we haven''t had a long time to get very good at this discipline
    thing.


    The happy news is that research has indicated that willpower functions like a
    muscle, and the more you exercise, the stronger it gets. With other muscles, your
    progression to Schwarzenegger will get better if you start off with stuff you
    can handle, and build up gradually. willpower trumps big (Arnold may disagree
    with this) in terms of life-knock effects: studies have shown that people who
    consciously flex willpower in one area – sticking to an exercise plan for example
    – tend to automatically use it more in other aspects of their lives – not oversleeping
    perhaps.*


    However, habit scientists suggest that relying solely on willpower to change ingrained
    habits is fallible. If you’re rundown or unwell your willpower loses oomph, just
    as your physical ones do. The trick, apparently, is to not even attempt using
    sheer force of will to resist behaviours that you want to change. Instead, notice
    the urge, and then put a different behaviour there in response to it.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_66_0.png)


    Perhaps when you have a crummy day at your job, your urge for pleasure and escapism
    leads to spending big on beer and watching inane TV all evening. If you’d like
    to change this habit, try acknowledging the urge and then invent a response that
    you feel better about. Perhaps eating soup and buttery toast while re-reading
    a favourite book in bed. Putting punk rock on your headphones and going for a
    frenzied walk to a hill you like to watch the sunset. Invent these substitutions
    in times when you’re feeling potent and inspired, and you’ve experienced a pleasure
    rush from them enough times, they become new habits, and you’ll go to them gladly
    when you’re wilted-of-will.


    ### Seize the day


    Habits are dogged things, whereas the rush of motivation that comes with epiphany
    is fleeting, no matter how vivid it may feel at the time. So if you are ever feeling
    inspired to revamp some aspect of your life (perhaps?, dare we be soptuous, by
    something within these very pages?), you likely have a wee window of opportunity
    to convert inspiration into action.


    You might begin by jotting down a few specific, realistic changes you’d like to
    turn into habits, or bits of your life that you think could be rejged. Starting
    with realisable goals means you can witness the success and effects of your choices
    pretty quickly, leading to positive reinforcement and a heady sense of mastery
    over your own behaviour.


    Or you could divide straight in! Insert Frugal Hedonism by deciding not to go
    to that café for breakfast morning; go for a decadent long stroll instead, and
    pick up enough eggs and cream to make deluxe omelets for a whole week of breakfasts.
    You''ve already saved twenty bucks, gotten some exercise, and had a daddy morning.


    If you’re feeling bolder, set the ball rolling on something grand. Something that
    sabotages the chance of relapse. Give yourself one week to calculate whether you
    could manage without... ooh, your car, for example... If you decide by the end
    of that time you can tweak all the vital elements to make it work, sell the thing.
    Another fantastic strategy for taking some of the load of habit change off your
    willpower muscle is to make a few blanket decisions, thereby sidestepping hundreds
    of small willpower-sapping ones – see “39. Limit the burden of choice” for more
    on this.

