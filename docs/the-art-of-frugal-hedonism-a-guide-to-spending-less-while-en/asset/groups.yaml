    # The Artist as Family


    One of the hallmarks of a practised Frugal Hedon is that people are constantly
    asking them how they manage to take so many holidays. A Frugal Hedon tends to
    work for as long as feels right, then decides to pop off to walk across Mongolia
    for a year. It can understandably make other a tad peevish, as the Frugal Hedon
    was likely only working part time in the first place. And probably generally seemed
    to enjoy their time at work – maybe because they chose their job based on what
    they were interested in, rather than how money it could make.


    Let’s meet a couple who no doubt elicit many perplexed questions about their unusual
    work/life ratio. We think their most recent advent perfectly demonstrates how
    having things you’re passionate about doing, can be an amazing motivation for
    living frugal...


    Meg and Patrick have two children (Zeph, 11 and Woody, 1) and a Jack Russell terrier.
    The whole family (including the dog) recently spent a year travelling eastern
    Australia from bottom to top and back again by bicycle. Throughout the 6000 kilometre
    trip they sourced as much of their food as possible by foraging, hunting and banter.
    The journey was about'
  - '[PAGE 31]


    having an incredible time together, but also aimed to demonstrate that a family
    can travel on next to no money, without relying on fossil fuels or the industrial
    food system. Being just as devoted as your authors are to sharing their tricks
    for living it up on the cheap, they''ve written a book about their experience
    – see our Further Resources section for details.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_31_0.png)


    They didn''t get a credit card to help pay for this trip, nor did they put in
    any overtime. In fact they have scarcely had time for paid work for a while now,
    so busy they have been producing art, a baby, a thesis, and dedicating untold
    hours to several community organisations in their small rural town. They can afford
    to be so giving with their time (and to go on adventures) because for several
    years their whole family’s annual expenditure has been about AUD $20,000 – around
    one quarter of the Australian household average.'
