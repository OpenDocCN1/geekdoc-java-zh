    -   * What''s more, if we unquestioningly adopt an entire cultural template of
    behaviours, we can save even the initial brain-energy that we''d need to create
    habits we actually want . No wonder we feel compelled to just ''go with the flow''!


    -   ** One clause here: just as you probably wouldn''t pump iron like never before
    AND AND enter an arm wrestling tournament on the same day, really flexing your
    willpower muscle in any given area depletes your daily allowance of it, even though
    you''re building your willpower fitness in the long term. So if you''ve sworn
    you''ll finish your tax return before dinner tonight, don''t plan on skipping
    dessert too, because you might not have enough discipline for number crunching
    and dietary restraint all at once.


    ## 14. Don’t buy drinks


    We don’t mean Never, but we do mean almost Never. In general, those drink bastards
    charge you mostly for the bottle and branding, or for the service if you’re in
    a café or restaurant. If the tap water in your area is safe to drink, bottled
    water is absurd (and not only from a financial point of view), and fizzy drinks
    and juices are basically sugar. They frequently cost nearly half as much as your
    meal, and add relatively nutritionless calories while they’re at.


    Keep a bottle of water in your bag instead, and refill it from the nearest tap
    when it’s low. If you’re having a sit-down meal, don’t just automatically find
    something on the menu because the waitperson says “… and to drink?” Order a drink
    only if you really want, and ask for a glass of water otherwise. People are often
    shocked by how much money they can save this way, and with little sense of suffering.


    Exceptions we personally like to make are for ritualistic drinks that stand in
    place of eating out. Perhaps a random vino at an outdoor table as the sun goes
    down, the buying of which gives you license to sit and watch the passing crowds
    for a while.


    For alcohol more generally, drinking at home (or on a friend’s porch, or on a
    picnic blanket placed in a suitably salubrious location) is obviously cheaper,
    especially if you enjoy brewing your own. If we plan on having a couple of drinks,
    your authors tend to shun pubs or bars in favour of these ‘teenage’ locations
    – it was fun then, and it’s fun now! We also highly recommend getting a second-hand
    scarf or something, so you can feel luxurious while drinking cheap gin.


    | FOOD | DRINK |

    |---|---|---|

    | VERY CLASSY RESTAURANT | Main $54 | Cheapest glass of wine $23 |

    | CLASSY RESTAURANT | Main $26 | Cheapest glass of wine $9 |

    | HIP CAFÉ | Lunch $17.50 | Fresh juice $6.50 |

    | VIETNAMESE SOUP BAR | Large soup $9.80 | Juice $3.50 |

    | CONVENIENCE STORE | Sandwich $5 | Medium soft drink $4.40 |

    | FAST FOOD RESTAURANT | Hamburger $4.80 | Medium soft drink $2.75 |


    Actual sample prices from some venues around Melbourne, Australia. We rest our
    case!


    What comes next is pretty cheeky. Your cunning authors are about to sneak a whole
    extra frugal strategy in the ‘Don’t buy drinks’ heading. It is actually one of
    the top money-saving strategies in this entire book, but we suspected some of
    you might avoid reading it if it announced itself: if you really want to spend
    less, eat out less.


    Current generations are eating out more than previous ones, laying out serious
    money for the privilege (and contributing to current weight and food-waste crises
    via the ingredient profile and size of meals prepared away from home). If you''re
    a dab hand in the kitchen, cooking at home in a creative cloud of steam and spices
    produces dishes at least tasty as what you get when you go out, and for a tenth
    of the price. Eating out less also makes it into much more of a treat when you
    do do it. Find a couple of cheap places that you really like, so that you get
    maximum bang for your dining buck – like a noodle bar that churns them out and
    fresh and has a two-for-one deal on Monday nights that you can make an occasion
    out of and again.


    We''ve already sung the praises of the packed lunch, so we won’t go there again
    now, but don’t forget the packed snack! If you know you’re going to be out and
    about for a long stretch, some hardy food items like an apple and a few nuts into
    your bag so you''re not forced to blow on tiny tubs of overpriced sugary yoghurt
    from convenience stores. The essential attitude change inherent in all the above
    suggestions is that food, by default, comes from home, and getting it from elsewhere
    is a deliberate indulgence, not just what happens whenever you need to eat. The
    savings resulting from this mental shift can be huge. Which can directly contribute
    to you working less, and having time for more experiences that don’t involve trawling
    Urbanspoon for hours...


