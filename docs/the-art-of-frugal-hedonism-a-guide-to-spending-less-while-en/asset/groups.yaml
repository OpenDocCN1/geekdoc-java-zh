    ![](img/c65bfef74f426d079910ef9e22fa68dc_177_0.png)


    **Expect phases.** Once kids start trying to define their own identity within
    society and their peer group, buying stuff often becomes a tool they want to use
    to help with this process. Firstly, remind yourself that in hindsight most people
    reflect on having been brought up frugally as a really good thing – and are even
    though your child may be convinced that they are suffering unbearable deprivation
    right now, that feeling is unlikely to last. Secondly, if you do not end up making
    some concessions at this point, don''t beat yourself about it: parenting is tough
    enough as it is. Thirdly, if you are feeling horrified by the consumption-crazed
    demon you appear to have spawned, comfort yourself with the fact that you have
    taught your offspring to be questioning and thoughtful by discussing things with
    them. You''ve modelled the values you''d like them to have, so they will be pretty
    likely to turn into a good adult once they find their feet.


    **Finally, use having kids as a reason to be more** Frugally Hedonic. They make
    you look at the world with freshly wondrous eyes, and are themselves utterly fascinating
    creatures being in the moment for, you’re already part way there. They also make
    a mockery out of any attempts to pursue material perfection, so that’s handy.


    On a whole different note, everyone should feel okay about questioning whether
    they want to reproduce at all, and if so, how many times. Obviously it’s a whole
    different ballgame from deciding whether to buy a new car or not, but the pressure
    to have a child, or to have a second one to ‘keep the first one company’, can
    have something in common with the social pressures surrounding other lifestyle
    expectations. It’s a terrible state of affairs that in an era of overpopulation
    people are made to feel defensive about not having children. If it is a real yearning
    in your heart of hearts, that’s one story. But if it ain’t, there are plenty of
    other amazing life experiences to have, and ways to contribute to the world.


    # 47. Don’t give up just because you gave in


    Darling reader, we are very much for the rampant enjoying of things, and not that
    interested in self-flagellation. We think it''s good policy to stick with this
    approach even if you have a frugal blowout. A slightly ironic bonus of being a
    Frugal Hedonist is that if you do occasionally find yourself with an extravagant
    consumption craving, and you size it up and decide to go for it, you get to do
    it without the post-spending regret that eats at so many people. After all, it''s
    a rare event, and both your bank balance and waistline (imagining it''s a hot
    fudge sundae you''re yearning for) are in fine fettle.


    Curiously, we''ve also found that if you size up your craving and then decide
    instead to make it disappear in a puff of smoke using only the power of your mind,
    it feels almost like a magic trick, and is pretty much fantastic as giving in.


    # 48. Bow down before the nanna and get ahead of the curve


    One stereotype of frugalism is the elderly person who grew up before material
    excess became the norm, and to this day saves teabags for repeated uses, repairs
    plastic bags with sticky tape, and washes their hair with vinegar.


    They lived through times in which was highly functional behaviour, particularly
    if they are old enough to remember the Great Depression. But by retaining such
    habits into an age of abundance, they attract patronising smiles, and even ridicule.


    In these pages your authors have not lingered on ethical or environmental reasons
    for being frugal. We started writing this book because people kept asking us how
    we seemed to always be having a good time while saving so much money, and it struck
    us as a question worth answering. But it is also one that will likely become increasingly
    important into this point that population growth, resource constraints, and a
    shaky global economy will soon put pressure on most of us to consume less. In
    many cases, much, less.


    So isn''t it possible that there might occur a flipping of the Pancake of Scorn?
    That prolacity may replace frugality as the embarrassingly outdated mode?


    Attempting to hold onto high-consumption, wasteful behaviours into a future where
    they are increasingly acknowledged as dysfunctional would likely earmark people
    for ridicule. Or worse. The adjectives associated with overconsumption – greedy,
    spoilt, selfish, piggy – are sharp barbers than any reserved for the intensely
    frugal. An era of resource constraints is an era where it is more evident that
    one person’s wastage is another’s want. So living in constant excess might make
    you decidedly unpopular.


    Trending: already unpopular and only likely to get more so...


    - People who run air conditioning 24/7 in summer, meaning passers-by (who aren''t
    using any fossil fuel themselves, given that they are walking down the street
    rather than driving in a temperature-controlled car) get blasted with an extra
    gust of heat coming out of each aircon vent. These people also raise the temperature
    of the whole area for everyone else.

    - People who drive their kids back and forth to school in huge SUVs (rather than
    walking, riding, or carpooling in a reasonable vehicle), using up our dwindling
    oil supplies for the convenience, blowing fumes into the faces of every cyclist
    sitting behind them in traffic, and meaning that by the time we are all old there
    might be no way to boil a kettle for a cuppa apart from chopping wood to make
    a fire.

    - People who accept plastic cutlery, bags and cardboard carry trays for their
    plastic and paper containers of takeaway food and drink, and then cram the whole
    lot in a bin after eating for it ten minutes, meaning that none of us will have
    the simple luxury of highly functional plastic objects (like sealed food containers)
    for as long into the future. Or for that matter, the pleasure of looking at forested
    landscapes, rather than rubbish dumps.


    If such a shift is to occur, it certainly seems easy to do what humans do so astonishingly
    well, and adapt, rather than clinging to old habits in petulant denial. The bonus
    is here, dear reader, that you and your Frugally Hedonistic friends, with your
    twinkling eyes, your bag of skills, and your ability to take maximum pleasure
    in words and weather, will have have the jump on the situation! You may have to
    deal with neighbours clamouring for advice on how to grow pumpkins or fix a stereo
    system, but you''ll be less likely to be traumatised by having to walk back from
    the shops carrying your groceries in a backpack. And less likely to end up sleeping
    in your car in a recession. (And even if you do, you’ll have a better chance of
    knowing how to keep yourself healthy and happy while you’re doing it!)


    ![](img/c65bfef74f426d079910ef9e22fa68dc_182_0.png)


    We did not press, however, on this subject. Bow down before the nanna! Bring the
    oldest person you know a hot beverage, and ask them how they made work in times
    of scarcity. Ask them what made them happy when they had nothing. They know how
    much things can change within a lifetime, and they might just be able to help
    you understand how much we are capable.


    # 49. Give something


    Whether it''s money, help, time, or things, giving asserts that you have enough
    to spare, which keeps you coming into a mindset of not enough. Which helps you
    feel sleek and satiated within your frugality. And it helps other people. Genius.


    In fact, giving doesn''t necessarily mean soup kitchens or Oxfam, it could mean
    more time listening to and caring for a frail or lonely family member, or taking
    to drop garden produce around neighbours. Or dedicating as much effort as is needed
    to help a friend through a long dark tunnel of the soul. You have more energy
    left for this stuff when you''re not frazzled by forty-hour weeks and a flotilla
    of credit card debts.


    Some people find that giving away actual cold cash keeps them honest in their
    assessment of how much of it really need (and how comparatively rich they are).
    Adam has a friend who is a simple-living, intrepid-travelling mathematics lecturer
    who regards the salary he receives as an accidental reflection of an unfairly
    distorted economy. Every second paycheck goes into a bank account for a school
    in India that he helped establish. He says, “It isn''t my money the way I look
    at, so how can I keep it? I don''t want it – I''d have to find a satisfying means
    of spending it. In my context that might mean going on a big long trip, but I
    do that anyway. What else I do with it? Look for a fancy new blender? If I had
    lots of money I''d have to think about how to manage it best, and I don''t want
    to have think about that.


    # Giving is the best medicine


    > Mark Twain once said, “The best way to cheer yourself up is to try to cheer
    somebody else up” which your authors reckon makes total sense,

