    Bar of Frugal Legends: Robinson Crusoe, Epicurus, Ernest Shackleton and Miss Honey.

    Now, who''s buying the first round?


    ## 11. Beware Fake Frugal


    Listen up, this is quite an important bit. Maybe it should have gone right up
    the front. Right next to the definition of frugality. Because this is actually
    a sub-clause of that very definition: if it is cheap to buy, but at the expense
    of someone or something else, it''s Fake Frugal, and it''s just not fair. Factory-farmed
    eggs, endless new clothes made by tired women in far away countries, ''value packs''
    of disposable razors that end as bobbing carpets in the North Atlantic. You get
    the gist.


    Buying cheap disposable, or crummy quality things that quickly need replacing,
    is not only Fake Frugal because it leads to spending more money later on, but
    because it leads to us all living in a very non-hedonism rubbish dump. An example
    might be those openers that only cost $2.99 but aren''t actually can openers,
    just some kind of shaped like a opener. Or all that furniture looks flash in the
    store, but lags as soon as damp weather comes along. When part of it pops off
    because somebody looks at it too hard, you can''t even nail it back on, because
    the particleboard takes on the structural integrity. You get all irritated and
    wan-feeling about the shoddiness of things, stick it in a dark corner of the garage
    hoping it will magically disappear, and go out shopping for another cupboard.


    This equation applies to health too. If the cheap bread you eat as a staple is
    stripped of nutrients that you end up with a depressed immune system, leading
    to more sick days and being forced to down pricey supplements, it''s not really
    cheap bread any more, is it?


    The price tags on foods that are produced conscientiously might seem steep compared
    to those of industrial foods. But consider this: modern first world citizens spend
    a teens percentage of our incomes on stocking our pantries compared to any other
    culture in the history of time, and we still seem to think it costs us too much*.
    When in a store deciding to buy, most of us compare prices between competing products.
    And if the organic yoghurt is a couple of dollars more, that can feel too expensive.
    Yet this is generally a warped lens to scrutinise those couple of dollars through,
    given that most of us wouldn’t notice amount of money when compared to the sums
    we spend on a muffin and coffee later on in the day, at the bottleshop on the
    way home, or going online to buy phone credit or a concert or plane ticket that
    night. Your authors did fluff around buying organic nuts for a while, while the
    price difference seemed astronomical. But once we thought about it, it still struck
    us as a fair price for a nut well-grown, so we made the switch. Now we eat fewer
    nuts, and they seem more exquisite.


    Folks of old barely wasted a scrap of food because they handed over respectable
    sums of money for it. These higher prices reflected the true ‘costs’ of producing
    food much more accurately: back when farms were all small and organic, farmers
    had preserve the health of their soil and water using methods that could be sustained
    by the local area if they wished to come on farming there; they passed on this
    ecosystem maintenance costs along with the other costs of production. For the
    last few decades, large scale industrialized farming has increasingly been deferring
    these costs (such as loss of top soil, carbon emissions and fertilizer pollution)
    to be dealt with poorer peoples and future generations. If we stop wasting money
    on food and spend it on giving farmers a better sum for their wares, it means
    they aren’t using damaging systems just to be able to make a living.


    When a merchant banker pays $300,000 for a beat-up old piece of sports or music
    memorabilia, it’s because there is a story embedded in that object that they like
    thinking about. Similarly, when we buy goods produced with real care and big-picture
    intelligence, they come with a backstory rich with positive feedback loops that
    feel damn good to think about, which makes their purchase seem like a bigger,
    more satisfying experience. By extension, if you buy things that rely on continued
    destruction or suffering for their production, you’re paying for a depressing
    backstory, you’ll probably end up blocking any awareness of… leaving you with
    no story, and a product that feels rather one-dimensional. You are also forced
    to create dark taboo corners in your mind, which are surely a hindrance to gloriously
    expansive feelings of wonder and connectivity. That''s quite a sacrifice to make!


    In a nutshell? We foolish humans cheat ourselves when we try to save money by
    buying crap stuff that requires us to spend more money replacing it, or leads
    to us living with crap health on a crap planet – since what we were trying to
    do in the first place was spent less money and have a good life. Holistic thinking
    and all that. Let''s get stuck into it.


