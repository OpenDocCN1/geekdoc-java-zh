    While flow is most notably associated with making art, navigating challenges within
    a sport, puzzle or game, frugal living gives you bountiful opportunity for similarly
    engrossing uses of your creative and physical abilities. Hone problem-solving
    skills so you can repair a motor or engine, developing an intuitive feel for cooking
