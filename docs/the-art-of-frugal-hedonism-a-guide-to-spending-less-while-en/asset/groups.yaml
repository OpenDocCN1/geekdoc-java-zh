    # 15. Find free ‘third’ places


    If you currently eat out a lot, you may go into withdrawal if you try and cut
    down, but there’s a high probability that what you are missing isn’t the food
    so as the ‘third place’ factor. This neat little term describes a place that is
    not work or home, but a third kind of place where you feel at ease, and a part
    of the greater world.


    Town squares serve this function beautifully in many cultures where they are used
    as a staple of the community’s ‘going out’ life. People set themselves up on a
    bench to watch the passing crowds, or take a leisurely stroll in arm, pausing
    to chat when they pass acquaintances. Teenagers get all teenagers in giggly group
    huddles, glancing excitedly over their shoulders to see who could glancing back.
    You might buy a cob of roasted corn on a stick, or a handful of grain to scatter
    to the pigeons, but it’s not obligatory. You feel refreshed by having been in
    the world, and stopping to drink it in. There are very few obvious noncommercial
    substitutes in your average western city.


    It took your authors some practice to establish a repertoire of non-spending-oriented
    third places. We very much like our local park, which is used heavily by the surrounding
    community, and we often lounge there at sunset and exchange pleasantries with
    people and their dogs. Maybe we bring a beer and a bag of peanuts. Maybe we don’t.
    It feels like a proper third place occasion though, and it costs zero to ten bucks.'
