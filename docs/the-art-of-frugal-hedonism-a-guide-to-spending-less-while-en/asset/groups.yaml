    就像额外获得了十个标准工作周的假期时间。尽管如此，德国仍然成功成为世界第四大经济体。


    ![](img/c65bfef74f426d079910ef9e22fa68dc_95_0.png)


    “节俭享乐主义者”认为，由于生活太好而感到受苦是荒谬的。


    那么，如果这甚至不是完成工作的最佳方式，而且它导致社会背离我们对健康、生活方式和环境的最乌托邦愿景，我们为什么每周都在盲目跟随这种工作狂热的趋势？我们为什么不挠着脑袋说：“等一下，我想想要那种机器让我们都少干活的版本，好吗？”


    如此巨大的问题很少有单一答案。一个罪祸首源无疑我们创造的这种文化，它将工作生活显得微不足道等同于是一个小失败者。这看起来确实是一个糟糕的局面——涉及到地位时，我们脆弱的心理倾向于无休止地不断加码，这意味着我们几乎不可能对所取得的成就感到满足。因此，我们努力、生产，却没有停下来考虑我们努力的成果究竟有多必要。


    另一个因素可能是那些“权势者”的阴暗操纵。一些文化评论家认为，由于生活被工作主导的人口更加顺从，政府倾向于将政策向这一目标倾斜——无论是有意还是无意。而且与我们的政治领袖一起打高尔夫球的企业执行官们也有类似的议程。正如人气博主卫·凯因（David
    Cain）所说：“保持空闲时间的稀缺意味着人们会为便利、满足以及任何他们能买到的解脱支付高昂代价。这让他们继续看电视及其广告。”


    当然，还有“经济”。这个庞然大物也许经常被提到的理由，解释了为什么我们必须继续“创造就业”、努力工作并购物——无论是否有工作需要要做或是否有我们需要购买的东西。问题在于，“经济”要求荒谬的事情：在资源有限的星球上实现无止增长。是的，如果我们都开始减少工作，“经济”将会遭受痛苦。即使是压力疾病导致的医院就诊人数下降也会对
    GDP 产生负面影响，正如为了办公室灯光和复印机24小时运转而开采的资源减少一样……


    要点在于，经济活动作为衡量人类成功和幸福的尺度从一开始就有致命缺陷，所以让我们不要根据它的需求来塑造我们对工作的态度。让我们根据我们真正需要做的工作（以维持我们一些简单的舒适）来塑造它——即那些在七十年前看起来是奢侈的种类。你好，1950年代的梦想：人们在花园里闲荡着，喝着由那些奇妙的新奇设备冷却的饮料，穿着柔软的织物，一边玩着脚一边读哲学。（抱歉，没有机器人女佣。）


    > 我们本该通向何处 vs. 我们最终落在了何处


    在20世纪的中叶，我们将拥抱技术进步所带来的自由的假设并不仅限于科幻小说的想象。


    1930年，进化生物学家朱利安·赫胥黎（Julian Huxley）预测了双日工作制。“人类能消费的量仅此而已，不会更多了……当我们达到世界在两天内生产出所有所需商品时（这不可避免地会发生），我们必须缩减对商品的生产，并将注意力转向如何处理我们新拥有的闲暇这一大问题。”他的同代人约翰·梅纳亚德·凯恩斯（John
    Maynard Keynes）同样对这一切闲暇意味着什么感到担心：“人类将面临……如何利用从紧迫的经济负担中解脱出来的自由，如何利用科学和复利为他赢来的闲暇。”在他1956年的总统竞选演说中，怀特·D·艾森豪威尔（Dwight
    D. Eisenhower）描述了一个未来，在那个未来，“闲暇……将是充裕的，这样所有人都能发展精神、反思、艺术的生活，充分实现世界上美好事物的。”1965年美国参议院一个小组委员会预测，到2000年，美国人的工作时间将减少。


