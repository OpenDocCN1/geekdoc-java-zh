- md: "\n![](img/c65bfef74f426d079910ef9e22fa68dc_44_0.png)\n\nYour taste buds as\
    \ imagined by Gray's Anatomy (1918).\nThey certainly look ready to party.\n\n\
    This is how all the fancy stuff gets invented anyway! Italian peasant Z did not\
    \ decide to squeeze the juice of unripe grapes onto meat so that it could later\
    \ be marketed in small bottles as verjuice and make lots of dosh for gourmet food\
    \ companies. Peasant Z did it because they recognized that their dinner would\
    \ taste better with a sour note, and had nothing else acidic on hand. Your authors\
    \ find that our own cuisine escalates in sublimeness the more we come to rely\
    \ on the random. A harvest of chestnuts and under-ripe lead to a fabulous goat,\
    \ chestnut, and tart apple stew. A yen for Earl Grey tea provokes experiments\
    \ with steeping a sprig of thyme in regular tea, which turns out to be super nice.\n\
    \nWe do use recipes for learning. A good trick is to find three recipes for something\
    \ similar to what you want to. Then see where they overlap and give you a rough\
    \ idea of proportions. For example, we had lots of nettles and potatoes in the\
    \ garden, and some haloumi needed using, so we looked up a few gnocchi recipes\
    \ to get a feel for ratios and essential preparation techniques. (If we hadn't\
    \ already had the flour called by all three gnocchi recipes, we would have just\
    \ made a fry-up with our ingredients instead.) Recipes are also good for trying\
    \ out whole new flavor combinations that use the raw ingredients you find yourself\
    \ with in even more artful ways – green tomato pie anyone? But, basically, in\
    \ the words attributed to Charlie Parker, “Master your instrument, master the\
    \ music, and then forget all that shit and just play.” You’ll know you’ve gotten\
    \ there when you have friends coming for dinner and you make a gravy that involves\
    \ Vegemite, with complete confidence that no one will notice.\n\n## Vegemite Gravy\n\
    \nyou can use Marmite or Promite if you are from a Non-Vegemite-Worshipping-Nation)\n\
    \nOkay, we recognize the irony of including a recipe here, but what the heck...\n\
    \n- Butter (or lard, ghee, or oil)\n- Onion, very finely chopped (optional, but\
    \ it’s nice to add some garlic or mushrooms at the end of step 5 if you don’t\
    \ use it)\n- Plain flour (if using cornfl instead, use much less and mix to a\
    \ smooth paste with a little water before putting into the pan with the fat)\n\
    - Stock made from bones/meat/vegetable scraps, or water and half a stock cube...\
    \ or just use plain water\n- Vegemite (or a glug of soy sauce)\n- Some old red\
    \ wine (or red wine vinegar)\n- Rosemary or thyme or both, finely chopped\n- Salt\
    \ and pepper\n\n1. Melt knob of butter in a frypan over medium heat, and fry onions\
    \ gently really soft, then remove them from the pan.\n2. Melt a small knob of\
    \ butter in pan, then remove from heat.\n3. Slowly mix a spoonful of flour into\
    \ the butter to make a paste (a roux).\n4. Return pan to a low heat and quickly\
    \ start stirring in some stock until you have something with a consistency like\
    \ cream.\n5. Add about a teaspoon of Vegemite, a dash of wine, the rosemary and\
    \ some salt and pepper.\n6. Cook while stirring for about 5 minutes, or until\
    \ thick and tasty.\n\n## 8. Don’t be a sucker\n\nOver half a trillion dollars\
    \ is spent globally each year on PR and advertising. If you live in the US, UK\
    \ or Australia, around $US1000 (in 2013 terms) is spent on you personally. We’d\
    \ love to save the advertisers all that needless bother, since we don’t think\
    \ much of it works on us, and simply accept a cheque. Or the equivalent value\
    \ in whisky.\n\nAnd while talking-up your product is far from a new phenomenon,\
    \ not only have ‘persuasion specialists’ now had decades to refine their nefarious\
    \ arts, but the sums currently being put at their disposal are a whole new kind\
    \ of astronomical. In Germany for example, spending on online advertising alone\
    \ is seven times the entire budget of the Nazi propaganda machine at its peak\
    \ (adjusting for inflation). And few of us would deny the power that expenditure\
    \ had to persuade people into a rotten system.\n\nAdvertisers know that appealing\
    \ to your rational side – merely promoting a product’s tangible attributes – is\
    \ not very effective. More is powerful to suggest, whether blatantly or surreptitiously,\
    \ that you don’t have everything that you deserve, or everything that you should\
    \ have in order to be acceptable. They romance you by implying that there is a\
    \ sort of life that is Right For You Personally, and that they have the stuff\
    \ to sell that goes with that life. Homemakers have a sturdy farmhouse simplicity\
    \ (because more honest way of life really resonates with you), super cute socks\
