    # 31. 享受悠闲的农夫时光


    ![](img/c65bfef74f426d079910ef9e22fa68dc_122_0.png)


    选自威廉·科姆《马德里岛史》（1821年）的彩色版画


    这实际上是一次启示：当我们的作者意识到，坐在一起一边用手做些事情一边和人们聊天，感觉比单纯地坐那里聊天要好一倍。更棒的是，这个实用的发现恰好在我们通往更有意识的自给自足旅程中的一个低谷。


    我们开始注意到，那些曾如此兴奋地围着我们房屋的所有产食植物，在经历了无尽的秋叶和蚯蚓粪的呵护下，已经长得极其健康，产出的食物远超我们能吃掉的量。我们送掉了一些，交换了一些，然后开始尝试保存剩下的。这花费了*几个小时*。在某些情况下是整整的一天——为了剥掉果树上的果、修补任何鸟啄的洞、将全部炖煮并装罐。在闷热的厨房里度过的最初几次——将西番茄煮成酸豆酱、装罐山桃、摘下罗勒枝做成青勒酱以冷冻、以及切开橄榄进行腌制——是相当愉快的。放一本有声书，一边忙碌。当安妮·安妮听完
    CD 碟片上的《战争与和平》时，她已经开始思念你了，你知道的，渴望某种生活。那种有人的生活。


    她对家庭食物生产的乐趣变得非常愤世俗俗，直到有一天，她去邻居家喝茶时，随手带了一筐需要剥壳的蚕豆。（新鲜的蚕豆非常好吃且易于冷冻：在它们只有指甲盖大时采摘，这样就不用剥两次壳；将煮过的豆与橄榄油、菲塔奶士、柠檬汁、盐和胡椒混合后轻蒸即可。）经过一小时闲闲聊天，他们不仅掌握了生活中的动态，并商好了要分担的堆肥运输细节，而且所有的蚕豆都剥完了，竟然没人注意到。


    多么伟大的发现！随后是各种杏子装罐午餐！聚会的夜晚，一边喝着苹果酒一边撕碎旧电话簿并唱卡拉 OK 变成了高频活动！魔鬼可能会为无闲的人找事做：但根据我们的观察，他非常乐意让这些事属于体力性的农活类：在桌子上放一堆豌豆等剥壳，空手的伙伴们对它们的渴望就像看到一碗盐炒花生一样。这就是为什么人们会抽烟？为什么在派对上需要手里抓着饮料？我们所有人可能都缺氧，但我们也能手动修复吗？


    当手忙碌时，谈话会变得格外顺畅。也许我们用拳头和手指摆出的形状有助于在大脑中产生共鸣的形状，将思想引向更新颖的方向。也许这种有一种背景活动同时叙述空间的感觉，恰好消除了对话中恰合适的压力，让一种更从容的节奏发展出来。也许这是一个简单的事实：在人类历史很长一段时间里，我们的大部分对话时间与长夜的木工、缝纫和编织有关——这些都是
    DIY 人类文化中的小型手工任务，在白天结束后，人们可以在火光或灯光下以一种陪伴的方式带入室内。


    人们喜欢提供社交框架的活动。在与他人共处的同时应对挑战或完成任务，是生活中最基本的快乐之一。保龄馆和棋盘游戏；盖房活动和酿啤酒。我们的作者习惯性地将生产性时间与社交时间混合。在最小尺度上，实现这一点涉及到随手准备一些缝补材料、种子分类或其他简单的手工作，以便在与意料之外的访客聊天时闲着打工。在更大的尺度上，它涉及一切，从制作番茄酱的日子（传统意大利家庭闻名的那类），到“极客之夜”，一群朋友聚在一起研究一个话题。


