- md: '

    And that’s not a bad thing. Seeking the perfect choice, says Schwartz, even in
    big decisions like colleges, “is a recipe for misery”. Research indicates that
    those of us who tend to put a lot of effort and research into our choices, actually
    get less pleasure per dollar, and are less content overall – despite usually managing
    to select a slightly superior option. This could be partly because we became inclined
    to expect perfection after a lot of careful weighing-up of pros and cons, yet
    perfection is always a concept, never a reality. But while this effect is exaggerated
    for the ultra-thorough consumer, it applies to choice-rich societies in general;
    with so much available we develop a delusion that we should always be able to
    get what we want, and feel ripped off and depressed when we don’t.


    The Frugal Hedonist does not expect perfection. The Frugal Hedonist expects that
    life will be a multi-coloured journey of pleasures and struggles and joy and adventure
    and boredom and epiphany and love and getting drenched in stores and by fires
    and sometimes eating slightly stale bread but not minding and sometimes eating
    freshly plucked raspberries being jubilant. He regards most shops and restaurants
    as giants lumps in the landscape, to save himself from adding more candidates
    to his ballot of potential consumables. She recognizes that although endless choice
    promises freedom, it also traps us in an endless series of fine-tuned decisions
    that we feel must well-made to encourage success and accurately reflect our identity.
    So, she makes broad decisions to spare her brain this grueling reality.


    Such broad decisions can be big or small. We know a family who decided years ago
    to never shop in a supermarket. Most of our friends wouldn’t think to buy bottled
    water – it’s not ongoing act of piety, they’ve just taken it off their radar as
    a way to get water. Some people identify a small handful of body and cleaning
    products that suit them, and do away with keeping an eye out for other options.
    Others have a ‘no-phones no-computers after 6pm’ rule (with the aim of removing
    the ongoing choice of whether to squeeze in a little bit more work or not). Personally,
    your authors find it hard to pin down our only blanket decisions, even though
    they must have been somewhat conscious at some stage, the whole point is that
    they just morph into habit over time, making them totally normal and effortless.
    We don’t buy magazines or newspapers, or get takeaway coffees, or take taxis (unless
    it''s an emergency), visit hair salons. It just wouldn''t occur to us to buy stuff
    like pre-mixed pancake batter, or hand-freshening tolettes, or yoghurt in tubes,
    or air deodoriser, and eggs or meat with a depressing past, or big bags of chips
    with lots of little bags of chips inside.


    Once your simple rules of engagement become second nature, they don''t usually
    require strict adherence. For example, your authors wouldn''t normally buy fast
    food from a mega-franchise, but have done it twice in the last five years. Once,
    it seemed the most perverse thing we could do immediately upon completing a book
    about foraging, and once we were stuck by a highway with no other options. We
    felt fine about these exceptions – there''s no obligation to be dogmatic about
    avoiding consumer options that you''ve decided you''re better off without. The
    point is to not have them cluttering up your brain on a daily basis, clamouring
    to be assessed for relative desirability and merit. Imagine a time where you just
    got milk in a bottle that said ‘milk’, and you didn''t have to think about milk
    any more than that. That''s what we''re sort of faking here. Relaxing, isn''t
    it?


    ## 40. Don’t be a snooty bum bum


    The title of this tip is embarrassingly uncultivated. And not unlovable.

    Which is in fact the point.


    One result of the endless variety of consumables now available is that we tend
    to hone on the subtlest minutiae of delineation between – what would appear to
    be a caveperson to – nearly identical products. Whether it’s Coke vs. Pepsi, or
    slightly varied cuts of jeans, it’s our ability to see the difference that defines
    us as a Person of Taste. But it can sure get in the way of knowing what it is
    we actually like.


    When it comes to being discerning about food and drink, there’s good evidence
    that we kid ourselves when we think we can distinguish between similar fashions.
    For instance, in 2011, British Professor Richard Wiseman (a former stage magician)
    arranged for 57 people to taste wines ranging from a £3.78 claret to a £30 champagne.
    When the participants were asked to guess if a particular wine cost less than
    £5 or more than £10, their answers were no more accurate than if they’d flipped
    a coin!


    Embarrassingly, professional wine tasters don’t fare much better. In one French
    study, all 54 wine experts failed to notice that they were tasting two identical
    white wines – except that one had been dyed red with a tasteless dye. They described
    the white using terms like ‘honey’, ‘lychee’ and an ‘straw’, and the dyed red
    wine with words like ‘coal’, ‘raspberry’ and ‘clove’. Our evaluation of flavour
    also shifts in response to hunger, room temperature, music, our moods and activities.
    And, of course, cultural values...


    Thirty years ago legions of people who now recoil in horror at anything but a
    perfect espresso were completely capable of enjoying a cup of instant coffee.
    Iceberg lettuce was a legitimate occupant of a salad bowl, whereas now only heathens
    (or, confusingly, those within the cutting-edge retro-food movement) are found
    enjoying its glacial crunch.


    The whole idea of ‘superior’ taste is a tad shaky anyway, since our sensitivity
    to odours and flavours – whether we find them pleasant or not – varies widely
    from person to person. Each of us has about 400 receptors, but pretty no two people
    outside of identical twins share the same combination. So maybe if you’re still
    a closet drinker of instant coffee you have an admirable capacity to enjoy the
    less-than-perfect.


    We once chatted with a young lady who spent a long stretch of time cohousing with
    people with Down’s syndrome. She told us that when she left, she found stultifying
    how much time and energy her friends invested in putting things through a filter
    of Cool or Right. The Down’s syndrome people simply liked whatever made them happy,
    regardless of cultural cringe.


    Adam remembers getting a hitch with a guy who’d a brain tumour removed and been
    left with a freakishly sense of smell. He drove Adam the way home, and accepted
    the offer of a bunch of coriander from the herb garden in the front yard. Deeply
    inhaling the smell of the coriander caused him to chuckle with unulterated delight,
    and when invited in, he displayed immense enjoyment in smelling everything from
    the pepper grinder to the wood of the cupboard doors. Unusual behaviour in a guest,
    but definitely a man who no one could tell what to take pleasure in.


    Okay. There are course many cases where quality really does count towards enjoyability.
    Your authors simply wouldn’t bother eating cheap chocolate, because we don’t think
    it tastes any good at all. But frequently the difference between those things
    that are out of favour with the tastemakers and those that they are applauding
    is insanely subtle, and we’d do well to just go with our guts. The Frugal Hedonist
    is a master of the art of enjoying, and you can enjoy anything you damn well.
    You don’t need to have The Best, because The Best probably isn’t inherently the
    best anyway. And even if it really, really seems like it is, it won’t by next
    year.


    But if you’re still struggling to shun your addiction to being a Person of Taste,
    try this argument from Selwyn H. Pendercast* :


    > Any idiot can appreciate the quality of something good. Only the true connoisseur
    can perfectly distinguish the fine and noble flavours amongst those dank and sulphurous.
    So that’s why I bought the cheap bottle.


    * Your authors readily confess this man to be an entirely made-up character. We
    just wanted to attribute our own quote to someone with a much fancier name.

    '
  mdcn: '

    这并不是什么坏事。施尔茨（Schwartz）认为，追求完美的选择——即使在像大学这样的重大决策上——“是痛苦的根源”。研究表明，我们这些倾向于在选择上投入大量精力和研究的人，实际上每花一钱获得的快乐反而更少，而且整体满意度也较低——尽管我们通常能选出一个稍微优越的选项。这可能部分是因为，在经过仔细权衡利弊之后，我们变得倾向于期待完美，然而完美永远是一个概念，绝非现实。虽然这种效应对于极度周全的消费者来说被放大了，但它适用于大多数选择丰富的社会；由于可用选择太多，我们产生了一种幻觉，认为自己应该总能得到想要的东西，而在没得到时就会感到被占便宜和沮郁。


    “节约享乐主义者”并不期待完美。节约享乐主义者期待生活是一场多彩的旅程，充满了快乐、挣扎、喜悦、冒险、无聊、顿悟、爱，以及在商店里淋成雨、在火炉旁，有时吃到略微干枯的面包并不介意，有时吃到新鲜采摘的树莓并感到欣喜若狂。他将大多数商店和餐厅视为景观中的巨型肿块，以避免在自己的潜在消费品清单上增加更多候选者。她意识到，尽管无限的选择承诺了自由，但它也将我们困在一系列无尽的精细决策中，我们觉得这些决策必须做得很好才能获得成功并准确反映我们的身份。因此，她做出宽泛的决策，以让她的大脑免受这种筋疲力竭的现实。这种宽泛的决策可以大，也可以小。我们认识一个家庭，他们多年前就决定永远不在超市购物。我们的大多数朋友不会考虑去买瓶装水——这并不是一种持续的虔诚行为，他们只是把这作为一种用水的方式从雷达中剔除了。有些人识别出少数适合自己的身体和清洁产品，并且不再留心寻找其他选择。其他人则有“下午6点后不玩手机不用电脑”的规则（目的是消除“要不要再挤时间工作一会儿”的持续选择）。就个人而言，你们的作者很难确定我们唯一的一成不变的决策，尽管这些决策在某个阶段可能是有意识的，但关键点在于它们随着时间的推移演变成了习惯，变得完全正常且毫不费力。我们不买杂志或报纸，不买外卖咖啡，不打车（除非是紧急情况），不去理发店。我们根本不会想到去买像预调好的煎饼糊、免洗擦脸巾、管装酸奶、空气清新剂，或者有着令人沮郁背景的蛋类或肉类，或者是里面装了很多小袋薯片的大袋装薯片。


    一旦你简单的互动规则成为你的本能，它们通常不需要严格遵守。例如，你们的作者通常不会从大型连锁店买快餐，但在过去的五年里确实买过两次。有一次，这看起来似乎是我们在读完一本关于采集食物的书后立即能做出的最违常的事；另一次我们被困在高速公路旁，无其他选择。我们对这些例外感到很好——没有义务对于那些你已经决定没有它们会得更好的消费选择抱持教条主义。关键点在于不要让它们每天在你的大脑里作乱，叫嚣着要你对它们的相对吸引力和价值进行评估。想象这样一个时代，你只是买了一瓶写着“牛奶”字样的牛奶，你再也不需要对牛奶想其他别的了。这就是我们某种程度上在伪装的东西。很轻松，不是吗？


    ## 40. 不要做一个自命的凡包


    这个建议的标题听起来令人脸脸地没教养。但并不不可爱。

    这恰恰是重点所在。


    现在可获得的消费品无限多样，结果之一是，我们倾向于关注那些在——对于一个洞穴人看来——几乎相同产品之间最细微的界限。无论是可口可乐对百事乐，还是剪裁略有不同的牛仔裤，我们看到差异的能力定义了我们是一个“有品味味的人”。但这确实会阻碍我们了解自己到底喜欢什么。


    在对食物和饮料有眼光方面，有充分证据表明，当我们认为自己能区分相似款式时，我们是在自欺欺人。例如，2011年，英国教授理查德·怀斯曼（Richard Wiseman，曾是一名舞台魔术师）安排了57个人品尝从3.78英镑的红酒到30英镑的香槟等葡萄酒。当参与者被要求猜测某特定葡萄酒的价格是低于5英镑还是高于10英镑时，他们的回答准确性并不比抛硬币高！


    令人尴尬的是，专业品酒师的表现也好不到哪儿去。在法国的一项研究中，所有54位葡萄酒专家都没有注意到他们正在品尝两种完全相同的白葡萄酒——其中一种被用无味的染料染成了红色。他们用“蜂蜜”、“荔枝”和“稻草”等词汇描述白葡萄酒，而用“煤炭”、“树莓”和“丁香”等词描述染红的葡萄酒。我们对味道的评估也会随着饥饿、房间温度、音乐、情绪和活动而变化。当然，还有文化价值观……


    三十年前，现在对除了完美的浓缩咖啡以外任何东西都感到恐惧的人群，完全有能力享受一杯溶咖啡。冰生菜曾是沙拉碗的合法常客，而现在只有异教徒（或者，令人困惑的是，那些前卫复古食物运动中的人）被发现正在享受那种冰般的脆爽。


    反正，“优越”味道的观点本身就站不住脚，因为我们对气味和味道的敏感度——无论我们认为它们是否愉快——人与人之间差异很大。我们每个人大约400个受体，但除了同生胎外，几乎没有两个人拥有相同的组合。所以，也许如果你仍然是一个秘密的溶咖啡饮用，你对不完美的事物有着钦佩的能力。


    我们曾与一位长期与唐综合症患者住在一起的年轻女士聊天。她告诉我们，当她离开时，她发现朋友们在对事物进行“酷”或“正确”筛选上投入了大量精力，这令人窒息。唐综合症患者只是喜欢任何让他们快乐的事。


    * 你们的作者坦然承认这个人是一个完全虚构的人物。我们只是想把自己的话归功于一个好听得多的名字。

