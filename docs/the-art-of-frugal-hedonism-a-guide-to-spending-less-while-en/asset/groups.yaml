    Increasingly, even those of us who like to think ourselves savvy to such tricks
    are being catered to by advertisers! Witness the evolution of products, shops,
    cafés and magazines whose branding is designed to suggest a get-away-from-the-hype
    aesthetic, loveable by discerning people who aren’t into commercialism and all
    that rubbish. Witness the recent genre is the ‘self-aware’ ad. This generally
    pokes fun at the cheap tricks of advertising, and then implies itself to be in
    a different and more honest category. Or it may hilariously confess outright that
    it is trying to suck you in - somehow making you feel like it’s okay when you
    succumb. Laughs all round.


    So what to do? One of your rather stubborn authors has has been known to mutter
    under her breath “You won’t get me that easily, you crafty devil!” when becoming
    aware that her gaze is lingering on the perfectly-pitched font of some gourmet
    packaging, but we realise that won’t work for everyone. Never fear, there are
    some other tricks you can keep up your sleeves...


    **Do the maths.** Totally invert one of the most basic strategies of advertising
    by practising this simple habit: when you see a lot of ads for something, consider
    that a large chunk of the price of that product is paying for those ads, rather
    than for product quality or value. By this logic, the more it is advertised, the
    more overpriced it is.


    **Be more content.** Okay, easier said than done, but as author Douglas Rushoff
    writes in his book *Coercion* , “the more fun you’re having in life, the more
    satisfied you are with yourself, the harder a target you are to reach.” You may
    have observed that people with an air of contentment with life, a mind fascinated
    by ideas, and strong connections with other people and the natural world are less
    susceptible to advertising. So make like a content person, and ignore the billboard!
    You are above such piffle!


    # Deep truth in advertising'
  - '[PAGE 49]


    The ancient Greek philosopher Epicurus taught that three things are essential
    for a happy life: friendship, freedom, and time for contemplation. Alain de Botton
    (a much more modern philosopher) has noted that advertisers frequently associate
    their product with one of these ingredients, slyly tapping into what people actually
    feel that their lives need more of.


    For more on Epicurus and his most frugal brand of hedonism, see our box in “30.
    People who need people...”.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_49_0.png)


    The advertising executive who commissioned this one must have been feeling nervous
    and insisted that all three of Epicurus'' principles of happiness be squeezed
    in: freedom, friendship, and contemplation.


    Just see fewer ads. Stop watching TV, at least in any form that includes commercials.
    People with small children manage to do this too, we promise. Wherever possible,
    shop at small stores and markets instead of megamalls and supermarkets. The latter
    option puts you at the mercy of a 360° environment designed specifically to encourage
    you to buy. If you need to go to one of these places, try treating the displays
    and sales posters as inconsequential wallpaper. Do the same with billboards, and
