    elevated stress — now acknowledged to be so bad for our bodies and minds that
    prominent investigator George P. Chronous estimates that it likely accounts for
    more half of the US’s healthcare-related expenses. The Japanese, notorious for
    their culture’s intense work ethic, even have a word for death by overwork: karōshi.


    In 1914, Henry Ford figured out that the ‘the-more-hours-the-better’ legacy of
