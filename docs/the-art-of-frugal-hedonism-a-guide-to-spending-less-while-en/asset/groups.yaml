    ![](img/c65bfef74f426d079910ef9e22fa68dc_44_0.png)


    这是《格氏解剖学》（1918）中所想象的味蕾。

    它们看起来确实已经准备好狂欢了。


    但无论如何，所有华丽的东西都是这样发明的！意大利农民 Z 并不是决定将未熟葡萄汁挤在肉上，以便以后将其装在小瓶中作为“果酸”（verjuice）进行销售，并为美食食品公司赚取大量资金。农民
    Z 这样做是因为他们意识到自己的晚餐如果带一点酸味会更好吃，而手里又没有其他酸性东西。你们的作者发现，我们越是依赖偶然性，我们自己的菜就越能升华境界。栗子的收获和未成熟的果实催成了一道极佳的羊肉、栗子和酸苹果炖。对伯爵红茶的渴望引发了在普通茶中浸泡一枝迷香草的实验，结果发现味道超级棒。


    我们确实使用食谱来学习。一个好技巧是找到三个与你想要的东西类似的食谱。然后看看它们在何处重叠，并给你一个大致的比例概念。例如，我们花园里有很多荨和土豆，还有一些哈罗米芝士（haloumi）需要使用，于是我们查了几道面团（gnocchi）的食谱，以感受比例和核心制备技术。（如果我们已经没有那三个面团食谱都要求的面粉，我们就会直接用这些食材做一顿煎盘菜了。）食谱也适合尝试全新的口味组合，用更具艺术感的方式处理你手头现有的食材——有人想吃绿番茄派吗？但基本上，正如归于查理·帕克克（Charlie
    Parker）的话说：“精通你的乐器，精通音乐，然后忘记所有狗事，尽管弹吧。”当你有朋友来吃晚餐，而你满怀自信做出一个含有维米酱（Vegemite）的肉汁，且完全相信没人注意到时，你就知道自己达到了境界。


    ## 维米酱肉汁 (Vegemite Gravy)


    如果你来自一个非崇拜维米酱的国家（可以使用 Marmite 或 Promite）


    好了，我们知道在这里放一个食谱很讽刺，但管他的呢……


    - 黄油（或猪脂、酥油或油）

    - 洋葱，极细碎（可选，但如果你不用它，在第 5 步末尾加入一些大蒜或蘑菇很不错）

    - 普通面粉（如果使用玉米粉，用量要少得多，并在放入有油的锅中前与少量水混合成光滑的糊状）

    - 用骨头/肉/蔬菜渣熬制的汤头，或者水加半块汤块……或者直接用白开水

    - 维米酱（或一大勺酱油）

    - 一些旧红酒（或红酒醋）

    - 迷香草或百香草或两者皆有，切碎

    - 盐和胡椒


    1. 用中火在煎锅中融化一块黄油，轻轻煎炒洋葱直到非常软，然后将其从锅中取出。

    2. 在锅中融化一小块黄油，然后离火。

    3. 将一勺面粉慢慢加入黄油中搅拌成糊（面糊 roux）。

    4. 将锅放回小火，快速开始搅拌加入一些汤头，直到它变得像奶油一样的稠度。

    5. 加入约一茶匙维米酱、少许酒、迷香草以及一些盐和胡椒。

    6. 边搅拌边煮约 5 分钟，直到变得浓稠美味。


    ## 8. 不要当个傻瓜


    全球每年在公关和广告上的支出超过 50 万亿美元。如果你住在美国、英国或澳大利亚，你个人身上会被花费大约 1000 美元（按 2013 年价值计算）。我们乐意为广告商省去这些不必要的麻烦，因为我们认为这些手段对我们没什么作用，直接接受一张支票就好。或者是等值的威士忌。


    虽然推销你的产品远非新现象，但“推销专家”们不仅花了几十年来精炼他们的阴险艺术，而且目前可用的总额是天文数字。例如，在德国，单是在线广告的支出就是整个宣传机器预算的七倍（根据通胀调整）。很少有人否认这种为了说服人们进入一个腐败系统的力量。


    广告商知道，仅仅推广产品的吸引力属性——并不有效。更有力的是，无论多么显眼或秘密地，暗示你并不拥有你应得的一切，或者你应该拥有的一切，这样是可以接受的。他们通过暗示存在这样一种生活，对你个人而言，他们拥有那些可以售卖的东西。主妇们拥有一个稳固的生活（因为更诚实的生活方式让你产生共鸣），可爱的袜子（因为你是一个俏皮的女性），巨大的电视（因为你认真对待娱乐），或者昂贵的啤酒（因为你欣赏品质的投入）（以及地区特色）。复杂的心理学被用来确保营销活动玩弄你最珍贵的愿景，让你觉得生活应该是更多的。谁能责怪身体落入了这种针对脆弱内心和不安全感的诱惑呢……


