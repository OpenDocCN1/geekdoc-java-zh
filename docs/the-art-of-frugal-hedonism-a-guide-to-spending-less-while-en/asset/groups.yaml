    If you take the above food list, add homegrown and foraged greens, herbs, and
    fruit (which conveniently, are three of the easiest things to grow and forage),
    you''ve got a lot of your bases covered. Even if you''re still buying the other
    thirty per cent of your groceries from non-organic sources, you''re doing pretty
    damn well. Top it off by paring your consumption of processed and packaged foods,
    and you''re headed towards a diet so delicious, healthy, and cheap that it will
    be the envy of chefs, nutritionists, and accountants alike...


    ![](img/c65bfef74f426d079910ef9e22fa68dc_60_0.png)


    Some truly frugal meals from your authors'' table: (L) porridge made from organic
