    # 35. And a wee tiny comment on condiments


    You can buy things marinated in oil and vinegar. You can also buy flavoured oils
    and vinegars. Ridiculous to do both! Keep the vinegar from that jar of capers
    or the oil from that jar of marinated whatever, and use it for cooking. If it
    makes you happier about it, pour it into a fresh jar and label it ''caper-infused
    white wine vinegar''.


    In general however, the frugal gourmand limits the buying of expensive premixed
    products in the first place. Especially all those ones that just combine three
    things you had in the cupboard anyway to make a dukkah, cajun spice mix or stir-fry
    sauce, or where they put some stuff in oil with a few sprigs of herbs and a chilli.
    “Why, I could do that in my sleep!” you declare upon closer inspection, and you
    feel the shackles of culinary slavery melting away.


    Even better, if you acquire enough Frugal Hedonist friends, at least a couple
    of them will have home-preserving inclinations, and will be proudly pushing jars
    of pickles and pesto upon you willy-nilly. And chutney. Be prepared for a wealth
