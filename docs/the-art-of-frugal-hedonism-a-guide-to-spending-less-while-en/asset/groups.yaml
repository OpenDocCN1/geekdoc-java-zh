    # 4. Have a lot of things you want to do with your freedom


    What came first, the frugality, or the egg that had a lot of things it was excited
    about doing? In your authors'' case, definitely the excited egg. There is no better
    incentive for being frugal than having passions you want to chase. Let''s break
    it down.


    +   1. By consuming less, you have more money to spend on doing what you really
    want to do.


    +   2. By consuming less, you have the option of doing less paid work, giving
    you more time to do what you really want to do. (Even if it happens to be chasing
    the kind of paid work that you really want to do.)


    > ! You can do a little bit of 1 and a little bit of 2 and have both the time
    and money to do the things you really want to do. Cake, and eating it.


    Back when Annie was a party-hard pop-punk, she cosetted secretive visions of herself
    travelling through Guatemala climbing volcano after volcano or decorating a whole
    house with holographic wallpaper, and knew that she''d need cash to make those
    things happen when the urge took her by the jugular. And so she taught herself
    to make the clothes she wanted out of old clothes. She made a decision to religiously
    love cheese and tomato sandwiches every day for lunch, while everyone around her
    bought takeaway kebabs. Instead of going to the pub, she cajoled friends into
    drinking boxed wine in deckchairs (illegal but lovely) and enticed strangers into
    sitting down to join in. She never made a budget, or assumption that most people
    spend money on an equally satisfying cheap or free alternative. Despite her miniscule
    income, the savings did slowly but surely pile up. Enough that she had the freedom
    to'
