    the ground before dark, and just make it in time to feed, water, and shut up all
    the animals. We are out of bread, so after washing ourselves and putting on warmer
    clothes, we stroll through the village night dotted with yellow lamplit windows
    and the melody of the creek''s rain-swollen gurgling, and spend half an hour loitering
    by the shop-which-is-also-the-pub counter, catching up on any events of the day
    that we are yet to hear of, and being regaled with tales of trees that collect
    around their roots by one of the old men in the corner.


    We leave with our bread, and also sugar to the shepherds up in the mountains who
    are looking after our sheep for the season. If this rain continues, the path up
    the mountain will grow boggy, so it is best if we hike up there tomorrow with
    the anti-tick medicine they need for our sheep. And they will appreciate sugar
    and also some onions from our garden to go with all the fresh cheese they will
    feed us. Back home we drink a large beer, talk, cook, eat, and sleep.


    Comfortably as a rich as one spent going to work and then going out to dinner
    and a movie with some friends afterwards.


    You may consider this narrative to be largely irrelevant to your own life, given
    the culture and location in which it takes place. But read on, beloved reader,
    the three tips to follow precisely on how mixing the practical with the social,
    and not sourcing all that you need via purchasing power, can help to create a
    lifestyle dense with frugal diversity no matter where you live...'
  - '[PAGE 114]


    # 29. Do business with friends


    The popularity of the phrase ‘Don’t do business with friends’ seems a particularly
    modern indulgence. Obviously such a saying can only arise in an economic system
    where we actually have the option of keeping our financial and practical interactions
    at arm’s length (along with any conviviality or conflict that may accompany them).
    More trouingly, the phrase indicates a lack of confidence in our capacities to
    communicate clearly, stand up for ourselves, forgive others, and acknowledge our
    own mistakes.


    Adam runs a permaculture education and design business with a long-term friend.
    Over time, customers have turned into friends, and in some cases, even joined
    the business. Culinary-talented friends are hired to cater for workshops, putting
    more love (and home grown produce) into the food than any professional caterer
    could. Potentially delicate issues with suppliers have been resolved while passing
    around bottles of homebrew and plates of roasted Fred… Fred being a cow raised
    by the business’s warehouse manager. Adam wouldn’t advise going into business
    with just anyone you hang out with, especially when your taste in company favours
    reckless and rebellious characters. But given the initial application of a bit
    of finer judgement, he finds there to be something truly unique about the camaraderie
    of a good working friendship. Socialising plus plus.'
  - '[PAGE 115]


    ![](img/c65bfef74f426d079910ef9e22fa68dc_115_0.png)


    Annie did this painting in return for a friend insulating her shed. She knew it
    would take twice as long to do as the work on the shed would, but it still felt
    like a fair deal, because she''d be forced to pick up her oil paints again – something
    she knew she''d enjoy.


    Annie chooses to do as much of her business with friends as possible. She reckons
    that it keeps her reasonable and honest. Behave poorly, and it will come come
    directly back to her via the ill feeling from people she sees all the time. Communicate
    poorly and she risks feeling let down by people she cares about. So she rents
    out rooms to friends in the house she amicably coowns with her ex-husband (and
    is paying off with help from a loan from her mum). She pays unemployed friends
    to help her repaint her house. She can only afford a crummy hourly rate but sweetens
    it by providing lunch, fine repartee, and a scintillating soundtrack of 80s’ mixtapes.
    She trades plants for car-favours, compost worms for singing lessons, garden designs
    for home repairs, editorial services for massages. She has sold paintings to friends
    and sewn costumes for their theatrical performances. Of course there have been
    disagreements along the way, but she has never lost a friendship or maintained
    a grievance, and has shared many more layered'
  - '[PAGE 116]


    experiences than she would have if it was all just pure sociability, or if the
    exchanges had been purely monetary.


    Joking and teasing are essential for maintaining mutual tolerance in such dealings.
    Stating the terms of any agreement at the start is crucial. Don''t be bashful
    about naming your price or engaging in playful barter with a friend – if you know
    you''re playing fair, there''s nothing to feel awkward about. Honest confessions
    early in the piece of possibly unreasonable but non-negotiable personal pedantries
    are helpful too: ''Realise it''s loco, but I''m a little obsessed about painting
    the tops of the door frames. I know they''re up there.'' Particularly useful is
    the recognition that as long as everyone is happy, exactitude is not as valuable
    as it is sometimes made out to be. A deal elegantly-struck, rather than pedantically-struck,
    can leave both parties feeling clever and content.


    Doing the kind of business with friends that is based on trade rather than money
    has a couple of extra special perks. Often both parties can trade something that
    they consider easy to give. It may be a skill that they find enjoyable to use,
    or something they don''t need, or have a surplus of. Not many people feel that
    way about money. The real icing on the cake is that by challenging money’s role
    as the fundamental unit of practical transactions, we expand our capacity to see
    value in other things in life that come to us without the use of money. And that
    way doth great riches lie…!'
