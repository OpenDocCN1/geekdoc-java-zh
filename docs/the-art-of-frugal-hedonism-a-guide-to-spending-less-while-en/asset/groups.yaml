    \ EnergyBulletin.net（现为 Resilience.org）。他还是全球生态快闪（permablitz）运动的联合创始人之一，并在墨尔本的\
    \ Triple R 电台主持名为“绿色世界末日”的每周节目。在职业计酬方面，他在澳大利亚墨尔本的 Very Edible Gardens 公司担任永续农业设计师和教育者，他与\
    \ Dan Palmer 共同经营。此外，他有时也会让 Annie 怂恿他一起写书。\n\n"
