    high potential to become waste**. . Really badly-made anything, for instance.
    A new kind of moisturiser or jam ‘just to try it’, despite the fact that you already
    have plenty of moisturiser or jam. Single-use anything. Another pair of black
    pants in a slightly different cut from the five pairs you already have. Really
    deeply in-fashion anything.


    You''ve likely heard the following advice, given that so many of us still forget
    to do it: when you''re food shopping, check what you already have before you go.
    . . This isn''t just about avoiding ending up with three jars of mayonnaise in
    the fridge, it''s about buying stuff to complement the food you''ve already got.
    If that includes a rapidly-withering eggplant and some feta cheese that needs
    using, plus a few flatbreads in the freezer and rosemary in the garden, you might
    add garlic and tomato paste to your shopping list so you can turn it into pizzas.
    If you have to buy more than you need of something, put half of it in the freezer
    – knock on your neighbours'' door and ask if they''d like the rest. If you only
    want a little of something and know you''re likely to let the rest pine in the
    pantry, consider not getting it (!) at all.


    Secondly, look at anything you are about to throw away, and assess its potential
    to be. If it might be valuable to someone, find somewhere to donate it to, or
    put the word out on the village grapevine that it''s going spare (perhaps by using
    one of the excellent websites that exist for advertising such things – our Resources
    section for details). Trying a clothes swap event with friends – they can be seriously
    fun, and everyone walks away with more stuff they like and less stuff they don''t.
    Worn-out clothes can go into a rag bag and be used for cleaning or making stuff.
    Jars get washed and used for the kind of things jars are useful for. Older vegetables
    make soup; soured milk makes pancakes (the best pancakes in fact); old fruit has
    any bad bits cut off and stewed.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_35_0.png)


    # Waste Avoidance Strategy #16


    Running with our jam motif, don’t throw away the jar with the final centimetre
    of sticky goodness still in it – swill a little warm water around in there to
    loosen it up, and add it to fruit while it''s stewing. Then put it on them pancakes.
    Yeah! Smidgens of leftover curry or stir-fry can be added to rice with a few extra
    veggies and a fried egg and abracadabra! Dinner, version 2.0! Hard ends of bread
    can be cut into cubes, toasted and thrown into salads, soups or pasta. Where one
    man gazes blankly and sees nothing of value, a Frugal Hedonist sees the makings
    of a fine supper. “Have an open relationship with recipes” for more on this.


    Our third waste-busting strategy isn’t for everyone, but it will save you the
    most money. Do your shopping in the waste stream. Our authors choose to get what
    we need from what we have fondly ‘The Grand Emporium of Affluent Culture’s Discarded
    Bounty’. If you keep your eyes peeled, and have the patience to wait for what
    you want, furniture, electrical equipment and building materials can generally
    be scavenged from the piles people leave outside their houses, or from tip shops
    and junk yards. If it isn''t available there it can be sourced courtesy of a friend
    with a spare or old one that they don’t use.


    This strategy doesn’t always result in the best quality of gear – though it can
    equally land you with some real gems – but it’s a little like an ethical and financial
    Get Out of Jail Free card. If something was destined to become waste before you
    rescued it, you don’t have to worry about the conditions under which it was made,
    or whether it is a ‘worthy investment’. What’s more, you can simply put it back
    out on the street if a better one along...


