    # 38. Free up your frivolity


    The desire to buy unnecessary things is very strong – it can feel like an assertion
    of freedom from the parade of functional activities that constitute much of life;
    like leisure and light-heartedness in the face of too much work and worry. This
    kind of purchasing certainly can result in something that will be enjoyed, but
    often it is simply a flawed attempt to create a new life ratio of frivolity vs.
    functionality. Or to add ‘value’ to life by getting things that have a cost and
    hence the inherent implication of value.


    Ironically, many of these pleasure-purchases actually result in a later need for
    even more functional activity. It might be cupboards and drawers that require
    endless cleaning because they are overflowing with unworn clothes which need sorting/folding/washing/mending/taking
    to the charity donation bin; the extra jiggle on the belly that seems to demand
    an increased gym regime; the bigger house that needs more cleaning and repairs.
    On the most basic level, it might just be the credit card bill that needs you
    to do more overtime to pay it off.


    Living light-heartedly is an altogether different beast. It involves being a bit
    philosophical about bad things that happen, so that they don’t dominate your mind
    or outlook. Or retaining the ability to take delight in fleeting moments. Or recognizing
    that being frivolous, spontaneous or playful with other humans and within your
    own heart is a totally free you can give to yourself and the people around you
    as often as you like. This stuff is the real assertion of freedom from the drabber
    elements of daily life: don’t get it confused with frivolous spending.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_147_0.png)


    Life is short. So why not channel your longing for a life less-ordinary and more
    spontaneous into footwear purchases?


    # 39. Limit the burden of choice


    One long rainy day, your author Annie decided it was a perfect movie-watching
    type of afternoon, so she scrambled through the downpour and knocked on her neighbour’s
    front door. She knew this neighbour to be the possessor of hundreds of cinematic
    titles, and thought there would surely be something in his collection to tickle
    her fancy. As she scanned the seemingly endless options, she started to feel clustered,
    and also less and less excited by watching any of them. After a ridiculous amount
    of time, she left having borrowed movies that looked pretty good. She watched
    between twelve and twenty minutes of each, deciding in every case that wasn''t
    really into it, but maybe not the one would be what she was after. She felt something
    like a failure, for finding it so hard to choose, and for not being able to enjoy
    any of her choices. She remembered thoroughly enjoying second-rate movies she''d
    encountered on long-haul buses, while owning a TV with only one channel. What
    had changed? She thought about going back next door to see if there was anything
    else there might be what she was really after, but felt irrational irritation
    at her lovely neighbour for having such an immense movie collection. The whole
    exercise had a bit weary anyway. She cuddled the dog and had a snooze instead.


    Does the essence of this tale feel familiar? Perhaps you’ll recognize something
    on the street trying to decide on a dining option. Do you feel more like Thai,
    pizza or Lebanese? Thai is closest, pizza is cheaper, Lebanese seems somehow healthier.
    Distress is mounting, you’re having a strangely tense conversation with your Significant
    Other about the relative merits of what to have for dinner... Now imagine you’re
    drifting off to sleep after spending the evening reading an evocative novel by
    a lonely aesthete astronomer. You’re pretty sure you should be having meandering
    poetic thoughts about our smallness in the face of the stars or something, but
    instead you’re wondering about those new shoes you bought today. Should you have
    gotten the slightly chunkier ones? Will that toe shape even with any of your pants?
    Should you have gone for black after all? Black would have been more versatile,
    but you loved stitching detail on the brown...


    A little choice is very nice. A large range of choices encourages perennial dissatisfaction
    with whatever you have chosen, no matter how satisfactory it is — you might not
    have picked the best option, after all! According to Barry Schwartz, psychologist
    and author of the Paradox of Choice, when choice abounds, we feel as if things
    don''t turn out so great because we made poor decisions, because there weren''t
    just any great options available. Hence ‘luxury’ of choice often comes with a
    sense of pressure making the right one, which can lead to anxiety and regret.
    To top it all off, research has shown that the process of attempting to constantly
    evaluate and decide between options — as we do day long in affluent societies
    creates serious mental fatigue. (Post-lunch slump? Maybe it''s not the carbs.
    You just need to switch to a sandwich bar with fewer potential combinations of
