    ![](img/c65bfef74f426d079910ef9e22fa68dc_169_0.png)


    When you eat seasonally your fruit bowl begins to look gratifying like the ones
    in medieval paintings.


    Our second tenet of embracing seasonal contrast saves you money too. Buying fruit
    and vegetables that are out-of-season usually costs at least twice the in-season
    price. Seasonal eating also gets you fresher produce, which not only has better
    flavour and more of its nutritional properties intact, but does way away with
    all that embodied energy of producing food in greenhouses or having it shipped
    from thousands of miles away where the weather is different. Wait for when the
    cherries start being sold by the box because the trees are so loaded with fruit
    – you might not want a whole box yourself, but use this as your heads-up that
    cherry season is truly here. In summer, look up five different recipes calling
    for lots of basil and zucchini (that''s courgette to you Brits and Kiwis). Appreciate
    how the starchy tubers that store well through winter also provide exactly the
    right ingredients for warming winter stews and mashes. Provide yourself miss fresh
    tomatoes, knowing that the imported hydroponic ones sold in the cold months taste
    kind of like squeaky rubber dolphin bath toys anyway.'
