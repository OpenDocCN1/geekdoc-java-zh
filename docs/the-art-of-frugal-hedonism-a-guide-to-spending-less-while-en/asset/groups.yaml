    # 33. Travel cheap


    If daily life is stressful, having time off work and getting away from home often
    means one thing: doing as little as possible. You are aching to rest and recharge,
    and to look at beauty while you have the time to notice it. This means you crave
    more expensive accommodation, less challenging experiences, and idyllic surrounds.


    If your life is not so pressured, and contains time for soaking beauty and enjoying
    the elements, you are generally after contrast, interest, and adventure when you
    travel – all of which can be found much more cheaply.


    The marvellous thing about frugal travel is the way that it compels you to get
    more intimate with wherever you visit. You''re in a foreign land. You take the
    cheap local bus instead of the tourist bus, and experience the full range of ukulele
    buskers and tamarind vendors that pile aboard at every stop. Sure, the bus goes
    more slowly and winds around a lot, but just gives you a chance to really absorb
    the scenery, or get a peek at streets you would probably never have gone down
    otherwise. You eat at cheap local food stalls instead of tourist restaurants.
    Not only do you discover a passion for sweet and sour catfish, but you get some
    regional slang that brings the house down every time you try it out.


    You want to visit a national park in your state. Instead of staying in the resort
    and diverting out a different scenic landmark each day, you decide to do a four-day
    walk, camping along the way. You not only get fitter and sleep for a glorious
    ten hours every night, but going to bed and getting up with the sun means you
    get secretly spy on animals grazing when you peep out of your tent every day.
    You bathed in secluded waterfalls that feel fantastic on your tired sweaty muscles.
    You notice the landscape change gradually and get excited when the soil shifts
    colour, or a lake shimmering on the horizon. At one point, you follow a small
    track up into a remote gorge, where you swim in the company of hundreds of iridescent
    dragonflies.'
  - '[PAGE 131]


    You''ve always wanted to visit France. Instead of spending three weeks hopping
    between tour buses and hotels, you use a house swap website and find a charming
    village to live in for three months. The absent owners have left you their car,
    and enough bicycles for your whole family to use for outings. You spend a deliriously
    idyllic period acquiring yourself with all the local landmarks and gastronomic
    specialities, before venturing afield to put your rapidly improving French to
    the test while exploring some nearby cities. When it comes to cram a definitely-illegal
    quantity of camembert into your suitcases for the homeward journey, you realise
    that you are going a little piece of that village stuck in your heart forever.


    There are always some difficult moments in frugal travel. You will occasionally
    be cold/hot/lost/exhausted/eat something unidentifiable. But these are the bits
    that make you realise that you''re tougher than you thought. *And the bits that
    make the best stories.* Besides, people who take a trip experiencing everything
    to be glitch-free and comfy often get annoyed by a lukewarm meal than a frugal
    traveller does by taking a bus five hours in the wrong direction. Perhaps most
    importantly of all, while pricier travel buys a higher base level of ''pleasantness'',
    it seldom provides moments of euphoria or revelation as generously as frugal travel
    does.


    Perhaps not surprisingly, the Frugal Hedonist is rather permissive when defining
    ‘travel’. Your authors think that travel is ultimately about creating a contrast
    with everyday life, thereby refreshing your mind and making time seem spacious.


    Last summer the two of us ‘travelled’ for a mere twelve hours. We decided to walk
    all night long, aiming to reach a semi-rural train station on the farthest fringe
    of the city. We selected a date with a full moon and clear skies, and took a long
    afternoon nap with an alarm clock set for sunset. After darning some strong coffee
    and throwing some sandwiches into a bag, we started walking. We were repeatedly
    captivated and distracted by small details while passing through neighbourhoods
    we had never seen before – a surreal tableau in a backlit window, a giant'
  - '[PAGE 132]


    topiary mouse in an otherwise conventional garden, completely nonsensical signage
    on a souvlaki shop, an intoxicating floral scent that had us sniffing after it
    alleyways until we located the source. we watched the streets surge from dense
    inner-urban studded with honking cars, greasy spoon eateries and the sound of
    drum solos tumbling out of bars, to light suburban with huge fragrant lawns, identical
    to kit homes, to light industrial, ramshackle cottages dotted between small fields
    of sleeping horses. We marched along the deserted moonlit train tracks singing,
    jumped when sudden kangaroos bounded across our path, paddled our aching feet
    in the cool dark silk of 3am. We arrived at the final train station on the line
    just as the stars started to evaporate, and let the first train of the day whisk
    us back to the city.


    This adventure was fascinating, enjoyable, and nearly free – $3.20 each for our
    train tickets home. We felt like we''d been away for days by the time we got back
    home. It also gave us 40km worth of leg exercise, and made life seem more magnificent
    and full of infinite potential for weeks afterwards.


    Slightly further, your authors have developed an autumn tradition of camping at
    the edge of a desert park. We can hitchh a train to the park’s closest town, walk
    for 10km and find ourselves in the middle of a quiet, hot landscape of small plants,
    jewelled insects, and a slow river to swim in. We walk barefoot in the burning
    sand a lot, sleep even more, read stories, each little. Once our backpacks are
    empty of the food we brought, we fill them with wild olives from the trees that
    are the bane of the local park rangers’ existence, and walk out again. We feel
    ridiculously rejuvenated, and have your year’s supply of olives to boot.


    Not all forms of frugal travel will suit everyone. Know what your basic requirements
    for staying happy and healthy are, and choose travel configurations that will
    meet them. For example, we have a travelling friend who eats anything and will
    happily bed down on any sort of ground, but needs quiet to sleep well. She has
    surprised her work-exchange hosts by offering to sleep in her tent rather than
    in a cosy (but noisy) room in the house, and has sought out couchsurfing hosts
    who are'
