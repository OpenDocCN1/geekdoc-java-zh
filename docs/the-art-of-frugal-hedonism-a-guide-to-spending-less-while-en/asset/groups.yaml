    # 40. Don’t be a snooty bum bum


    The title of this tip is embarrassingly uncultivated. And not unlovable.

    Which is in fact the point.


    One result of the endless variety of consumables now available is that we

    tend to hone on the subtlest minutiae of delineation between – what

    would appear to be a caveperson to – nearly identical products. Whether

    it’s Coke vs. Pepsi, or slightly varied cuts of jeans, it’s our ability to see

    the difference that defines us as a Person of Taste. But it can sure get in

    the way of knowing what it is we actually like.


    When it comes to being discerning about food and drink, there’s good

    evidence that we kid ourselves when we think we can distinguish between

    similar fashions. For instance, in 2011, British Professor Richard Wiseman

    (a former stage magician) arranged for 57 people to taste wines ranging

    from a £3.78 claret to a £30 champagne. When the participants were asked

    to guess if a particular wine cost less than £5 or more than £10, their

    answers were no more accurate than if they’d flipped a coin!

    Embarrassingly, professional wine tasters don’t fare much better. In one

    French study, all 54 wine experts failed to notice that they were tasting

    two identical white wines – except that one had been dyed red with a

    tasteless dye. They described the white using terms like ‘honey’, ‘lychee’

    an ‘straw’, and the dyed red wine with words like ‘coal’, ‘raspberry’ and

    ‘clove’. Our evaluation of flavour also shifts in response to hunger, room

    temperature, music, our moods and activities. And, of course, cultural

    values...


    Thirty years ago legions of people who now recoil in horror at anything

    but a perfect espresso were completely capable of enjoying a cup of

    instant coffee. Iceberg lettuce was a legitimate occupant of a salad bowl,

    whereas now only heathens (or, confusingly, those within the cutting-edge

    retro-food movement) are found enjoying its glacial crunch.'
  - '[PAGE 154]


    The whole idea of ‘superior’ taste sensations is a tad shaky anyway, since our
    sensitivity to odours and flavours – and whether we find them pleasant or not
    – varies widely from person to person. Each of us has about 400 odour receptors,
    but pretty no two people outside of identical twins share the same combination
    of them. So maybe if you’re still a closet drinker of instant coffee you are really
    just more receptive to its finer flavours than some other people. Either that
    or you have an admirable capacity to enjoy the less-than-perfect. Who can say?
    Certainly no one but you!


    We once chatted with a young lady who spent a long stretch of time cohousing with
    people with Down’s syndrome. She told us that when she left, she found stultifying
    how much time and energy her friends invested in putting things through a filter
    of Cool or Right they were before able to enjoy them. The Down’s syndrome people
    had simply liked whatever made them happy, regardless of cultural cringe-alibi.


    Adam remembers getting a hitchh with a guy who’d a brain tumour removed and been
    left with a freakishly powerful sense of smell. He drove Adam the way home, and
    accepted the offer of a bunch of fresh coriander from the herb garden in the front
    yard. Deeply inhaling the smell of the coriander caused him to chuckle with unadulterated
    delight, and when invited in, he displayed immense enjoyment in smelling everything
    from the pepper grinder to the wood of the cupboard doors. Unusual behaviour in
    a guest, but definitely a man who no one could tell what to take pleasure in,
    nor how to carefully moderate his opinions of things and behave with only appropriate
    levels of appreciation.


    Okay. There are course many cases where quality really does count towards enjoyability.
    Your authors simply wouldn’t bother eating cheap chocolate, because we don’t think
