    and Amazons, eating cheese and crackers, feeling nostalgic for our lost youth,
    and weeping a little. Now what? What to do next when no one is making us do it?
    Yes, you''ve spotted the glitch; freedom, when we''ve become accustomed to it,
    can be quite daunting. If you''ve already had practice dealing with this, skip
    the rest of this tip. If you feel even a flicker of existential terror, read on.


    Why does this conundrum exist at all? From a tender age society encourages us
    to lay aside our impetus to do things for their own sake (''intrinsic'' motivation),
    and instead to do much of what we do for external reasons. As a young child you
    were most certainly an intrinsically-motivated learner, and spent most of your
    waking hours fascinated by the world, and inventing endless adventures in pursuit
    of discovering how it all worked. Soon however, schooling converted into something
    you did for external motivations: grades, and punishments.


    Working life then continues to reinforce this pattern of doing things for external
    motivations. What''s more, shaping your life around employment is a short cut
    not only to motivation and structure, but to social and personal validity. Once
    adapted to this set-up, people can find that as they might pine for holidays and
    crave more ''downtime'', they aren''t actually overflowing with ideas for what
    to do with this time when they get it. And fair enough. It would be a stressful
    existence to be constantly dreaming up things you would like to do if you don''t
    expect to ever have time to do them.


    We''d like to make a suggestion, dear reader: if you do alter your lifestyle to
    give yourself control over your own time, and then find yourself disinclined to
    act without external pressures, cut yourself some slack for a while. If you feel
    deeply decoupled from your lust for learning, and your intrinsic motivation to
    cha-cha with life has gone la-la, expect to feel a little bored and lost.


    Most people will need a godly recovery time using whatever free hours their frugal
    ways have scored them to both catch up on a backlog of life-maintenance activities
    (getting a dental check-up, cleaning out the shed) and to mooch about the house
    taking naps and eating peanut butter out of the jar.


    At some point, you will start to feel itchy of spirit. This is the perfect time
    to brainstorm a list of stuff that you’d like to do. And you don’t dare leave
    anything off that list just because it doesn’t sound meaningful – most of us could
    come up with ooodles of things we do at our jobs that are almost surrealistically
    meaningless, and yet we treat those as a reasonable way to spend time. If you
    want to spend four hours a week practising throwing circus knives, that is at
    least as a legitimate use of your time as spending four hours per week formatting
    a corporate e-newsletter to meet its style requirements, knowing all the while
    that no one actually cares.


    ## The Artist as Family


    One of the hallmarks of a practised Frugal Hedon is that people are constantly
    asking them how they manage to take so many holidays. A Frugal Hedon tends to
    work for as long as feels right, then decides to pop off to walk across Mongolia
    for a year. It can understandably make other a tad peevish, as the Frugal Hedon
    was likely only working part time in the first place. And probably generally seemed
    to enjoy their time at work – maybe because they chose their job based on what
    they were interested in, rather than how money it could make.


    Let’s meet a couple who no doubt elicit many perplexed questions about their unusual
    work/life ratio. We think their most recent advent perfectly demonstrates how
    having things you’re passionate about doing, can be an amazing motivation for
    living frugal...


    Meg and Patrick have two children (Zeph, 11 and Woody, 1) and a Jack Russell terrier.
    The whole family (including the dog) recently spent a year travelling eastern
    Australia from bottom to top and back again by bicycle. Throughout the 6000 kilometre
    trip they sourced as much of their food as possible by foraging, hunting and banter.
    The journey was about having an incredible time together, but also aimed to demonstrate
    that a family can travel on next to no money, without relying on fossil fuels
    or the industrial food system. Being just as devoted as your authors are to sharing
    their tricks for living it up on the cheap, they''ve written a book about their
    experience – see our Further Resources section for details.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_31_0.png)


    They didn''t get a credit card to help pay for this trip, nor did they put in
    any overtime. In fact they have scarcely had time for paid work for a while now,
    so busy they have been producing art, a baby, a thesis, and dedicating untold
    hours to several community organisations in their small rural town. They can afford
    to be so giving with their time (and to go on adventures) because for several
    years their whole family’s annual expenditure has been about AUD $20,000 – around
    one quarter of the Australian household average.


    How do they do it? Giving up their cars was a pretty key step. Meg says: “Patrick
    saw on the RACV [the state motor vehicle association] website that it saves you
    $13,500 a year not having a car... we had two, so there was nearly thirty grand
    right there.” They cook with simple ingredients, grow their own vegetables and
    eggs, and forage wild foods. They live in a non-ostentatious house and shop at
    second-hand shops. Their generosity with their time, energy and surplus produce
    within the town’s community comes back to them, and they are amazed by how many
    of their needs end up being met by the local ‘gift economy’. They describe how
    during the months after son Woody was born every time we would leave the house
    and come back there would be things for us. Clothes, meals pretty much everything
    a new parent could need.”


    Patrick says: “Life’s become so much better living with the reduction of income.”
    Meg agrees: “Freedom wasn’t the initial motivator,” (for why they started cutting),
    but “it has become the main driver. For me, the more we give up, the more I want
    to give up.”


    ## 5. Hate waste


    As far as green furry things lurking in trash cans go, Oscar the Grouch is quite
    endearing in our opinion, but he isn''t the only good thing you can find in a
    bin. Australians throw out 20% of all food brought home – that''s one grocery
    bag in five! Almost as much is wasted by processors and retailers before it reaches
    the consumer. Likewise, a staggering 40% of all food grown or imported into the
    US is dumped. It''s not just food we''re throwing away. In the US for instance,
    around 150 million tonnes of uncycled municipal waste is collected every year.
    Rather than come up with a visualisation based on the equivalent length of blue
    whales lined up to end, we can just say this is a freaking lot


    Nature, which your authors are actually incredibly fond despite mosquitoes and
    leeches and those hot gritty windy we get in summer, has no concept of waste.
    Human societies until very recently haven''t had much concept of waste. Even our
    grandparents'' generation hardly threw away a thing – all of which shows the whole
    business as embarrassingly unnecessary. Then came bottled water, disposable cutlery,
    single-portion cheese and cracker snacks, bread and milk so that half of it is
    left to go mouldy, particleboard furniture, technology designed to become obsolete
    every year, and clothes that the culture police tell us do the same. Our grandparents
    have probably turned up the Barry Manow in heaven to block out the grunting of
    all those overworked garbage trucks down below.


    Don''t be gentle reader. By developing an allergy to wastefulness, you can not
    only diminish your role in this bizarre state of affairs, but save a surprising
    wallop of money too! We have personally noticed amongst our lower-income friends,
    the degree to which they abhor waste is one of the biggest factors in determining
    whether they have any cash left at the end of the week or not.


