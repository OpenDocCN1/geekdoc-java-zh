    # Author bios


    Annie Raser-Rowland


    Annie may write ‘horticulturalist’ when she fills out the Main Occupation box
    on her tax return, but she considers herself an aesthete first and foremost. (She
    also usually writes some very small numbers in the Earnings box, yet considers
    herself incredibly rich.) She takes immense pleasure in the sensual world, and
    sees enjoying it without destroying it to be her main aim as a human being. She''s
    been keen to help others do the same, and gave up making art in favour of teaching
    people how to feed themselves sustainably. She has worked on permaculture projects
    in flung countries, co-authored with Adam The Weed Forager’s Handbook: A Guide
    to Edible and Medicinal Weeds in Australia , and taught workshops and given innumerable
    people advice on keeping little green caterpillars away from broccoli in her role
    at CERES Environmental Park’s nursery in Melbourne. In between, she finds mountains
    to walk up and, draws pictures of her edible dog, and in her local park reading
    detective novels and eating home-grown bananas in the sunshine.


    Adam Grubb


    Adam has voluntarily spent much of his adult life as a frugalist, including stretches
    radically tiny amounts – think under $2000 annually. He loves the challenge. What''s
    more, it gives him time to do unpaid work, such as the years he spent funding
    the energy news website EnergyBulletin.net (now Resilience.org). He’s also one
    of the co-founders of the global permablitz movement of volunteer-executed garden
    makeovers, and has a weekly radio show called Greening the Apocalypse on Melbourne’s
    Triple R. For money, he is a permaculture designer and educator in his business
    Very Edible Gardens in Melbourne, Australia, which he codirects with Dan Palmer.
    Plus he lets Annie cajole him into writing books with her sometimes.'
