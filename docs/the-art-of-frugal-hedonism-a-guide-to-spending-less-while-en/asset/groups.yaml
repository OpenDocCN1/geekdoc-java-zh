    # 38. 释放你的放纵


    购买无必要物品的欲望是非常强烈的——它感觉像是从构成生活大部分部分的功能性活动游行中获得的一种自由宣言；就像在面对过量工作和忧虑时所拥有的闲适与轻松。这种购买行为确实可能带来一些可以享受的事物，但它往往只是试图创造一种“放纵
    vs. 功能性”的新型生活比例的拙劣尝试。亦或是通过获得具有成本（从而隐含了价值意义）的物品来为生活增加“价值”。


    讽刺的是，许多此类为了享乐的购买实际上导致了后期需要更多的功能性活动。可能是橱子和抽屉需要无休止的清洁，因为它们堆满了没穿过的衣服，这些衣服需要分类/折叠/洗涤/缝补或送到慈善捐赠箱；肚子上多出来的赘肉似乎要求增加健身房计划；更大的房子需要更多的清洁和维修。在最基础的层面上，可能仅仅是一张信用卡账单，需要你加班更多才能才能还清。


    轻快地生活是完全另一回事。它涉及到对发生的坏事持某种哲学态度，使它们不会主宰你的思想或观点。或者保留在转瞬即逝的时刻发现快乐的能力。或者意识到，在他人面前以及自己的内心保持放纵、自发或好玩，这是一种完全的自由，你可以随心所欲地给自己和周围的人。这些才是对日常生活中枯燥元素真正的自由宣言：不要将其与放纵性消费混淆。


    ![](img/c65bfef74f426d079910ef9e22fa68dc_147_0.png)


    生命苦短。那么，为什么不把对不平凡且自在生活的渴望投入到鞋子的购买中呢？


    # 39. 限制选择负担


    在一个阴雨天，作者安妮（Annie）决定这是一个非常适合看电影的下午，于是她穿过暴雨敲响了邻居的门。她知道这位邻居拥有数百部电影作品，心想他的收藏中一定有能合她胃口的东西。当她扫描那些看似无穷无尽的选项时，她开始感到眼花缭乱，而且对其中任何一部的兴趣越来越小。在浪费了大量时间后，她离开了，借走了几部看起来不错的电影。她每部只看了十二到二十分钟，每部都决定自己并不真的感兴趣，但也许另一部才是她想要的。她感到像个失败者，因为发现选择如此困难，而且无法享受她所选择的任何一个。她清楚地记得在长途大巴上遇到二流电影时曾非常享受，而当时她只拥有一台只有一个频道的电视。发生了什么变化？她想回邻居家里看看是否还有其他她真正想要的，但对她可爱的邻居拥有如此庞大的电影收藏感到一种不理性的烦躁。整个过程反正还是有些疲惫。她抱抱狗，转而睡了一觉。


    这个故事的精髓让你觉得熟悉吗？也许当你在街上试图决定吃什么时会产生共鸣。你想吃泰国菜、披萨还是黎巴嫩菜？泰国菜最接近，披萨更便宜，黎巴嫩菜似乎更健康。焦虑感倍增，你正和你的伴侣就晚餐的相对优劣进行着一场异常紧张的对话……现在想象一下，在读完了一个由孤独的美学天文学家写的感人小说后，你正快要入睡了。你很确定你应该对我们在星空面前的渺小产生一些漫性的诗意思考，但你却在想你今天买的那双新鞋。我应该买那种稍微粗一点的吗？那个鞋头形状配你的任何裤子吗？我到底该选黑色的吗？黑色更百搭，但你又喜欢棕色的缝线细节……


    少量的选择是很棒的。大量的选择会让你对所选的任何东西产生持久的不满，无论它有多令人满意——毕竟，你可能没有选择最佳选项！根据心理学家、《选择悖论》的作者巴里·舒尔茨（Barry
    Schwartz）来说，当选择充裕时，我们觉得结果不尽好是因为我们做了糟糕的决定，因为并不是没有好的选项可供。因此，选择的“奢侈”往往伴随着做出正确选择的压力，这可能导致焦虑和后悔。更糟糕的是，研究表明，不断评估和在选项之间做决策的过程——正如我们在富裕社会中整天做的那样——会产生严重的精神疲劳。（午后昏睡？也许不是因为碳水化合物。你只需要换一个饮料+面包种类+馅料潜在组合更少的三明治店！）


    **节俭享乐主义者**的最好消息是，通过减少消费，你每天必须面对的消费决策范围会骤减。如果你总是自己调沙拉酱，你永远不会发现自己站在超市里忧郁地盯着架子上的
    93 种类。如果你购买二手产品，并乐于随遇而安，你永远不会发现自己站在宜家的收银台队前，痛苦地纠结不决，考虑是否要在太晚之前冲回去把那套毛巾换成深蓝色的。如果你通常用回收的零件组装你的自行车，你永远不会纠结复古巡游者车还是意大利公路赛车更能反映你的个人风格。如果你已经决定现在的浴室完全足够，你永远不会发现自己连续六小时在网上浏览淋浴帘目录寻找它。


