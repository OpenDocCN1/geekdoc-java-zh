    ## 41. 自我驱动


    时速表上的那个指针确实可以达到令人向往的每小时 240 公里（150 英里）。但你的汽车平均速度到底有多快？我们在这里不仅仅是指那些被堵在交通堵中的时刻。为了真正计算我们车辆的“有效速度”，我们需要把在办公室花费的所有小时都算进去，以涵盖燃料、注册费和其他运行成本……而在此期间，速度表一直停在零上。一项澳大利亚的研究计算出，每驾驶一辆丰田陆酷洋泽的一小时，车主平均需要工作
    1.5 小时来支付这些费用。该研究还指出，如果车主必须为汽车的“外部性”付费——即那些由社会承担的成本，如二氧化碳排放、交通拥堵和交通事故成本——他们每在方向盘后坐一小时就需要额外工作
    0.6 小时。这使得陆酷洋泽的有效速度变成了每小时 9 公里（5.7 英里）。所以一点也不方便，对吧？顺便说一下，自行车由于其购买、运行和外部性成本要低得多，速度相对较快，达到了每小时
    18 公里（11 英里）。


    在澳大利亚，一辆中级较新汽车的年度注册、运行和折旧成本约为 12,000 美元。这还不包括所有的停车罚单。让我们慷慨地估计，对于旧车来说，较低的折旧成本可以将这一数字直接降到
    7,000 美元。即使是这个底线数字，你也可以每周乘坐 20 次出租车，每年支付 14 周的租车费加价值百元的汽油，而且依然能盈余。作为进一步对比，亚当（Adam）在写本文时一年的总交通成本为
    610 美元，其中包括一次大保养的自行车、每周公共交通以及多次往乡的火车旅行。所以，即使给自行车加上一点折旧费，在我们假设的七千美元中，仍然留下一笔很方便的零花钱。


