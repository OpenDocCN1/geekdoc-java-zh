    a Toyota Landcruiser, average owner spends 1.5 hours working to pay for it. The
    study also points out that if the owner had to pay for their car’s ‘externalities’
    – those costs borne by society – of CO2 emissions, traffic congestion and the
    cost of road accidents, they’d need to work another 0.6 hours for every hour behind
    the wheel. That puts the effective speed of a Landcruiser at 9 kilometres (5.7
    miles) per hour. So not convenient at all, he? A bicycle, by the way, with its
