    # # 5. Hate waste


    As far as green furry things lurking in trash cans go, Oscar the Grouch is quite
    endearing in our opinion, but he isn''t the only good thing you can find in a
    bin. Australians throw out around 20% of all food brought home – that''s one grocery
    bag in five! Almost as much is wasted by processors and retailers before it even
    reaches the consumer. Likewise, a staggering 40% of all food grown or imported
    into the US is dumped. It''s not just food we''re throwing away. In the US for
    instance, around 150 million tonnes of uncycled municipal waste is collected every
    year. Rather than come up with a visualisation based on the equivalent length
    of blue whales lined up to end end, we can just say this is a *freaking lot*.*


    Nature, which your authors are actually incredibly fond despite mosquitoes and
    leeches and those hot gritty windy we get in summer, has no concept of waste.
    Human societies until very recently haven''t had much concept of waste. Even our
    grandparents'' generation hardly threw away a thing – all of which shows the whole
    business as rather embarrassingly unnecessary. Then came bottled water, disposable
    cutlery, single-portion cheese and cracker snacks, bread and milk so that half
    of it is left to go mouldy, particleboard furniture, technology designed to become
    obsolete every year, and clothes that the culture police tell us do the same.
    Our grandparents have probably turned up the Barry Manilow in heaven to block
    out the grunting of all those overworked garbage trucks down below.


    Don''t be gentle reader. By developing an allergy to wastefulness, you can not
    only diminish your role in this bizarre state of affairs, but save a surprising
    wallop of money you too! We have personally noticed amongst our lower-income friends,
    the degree to which they abhor waste is one of the biggest factors in determining
    whether they have any cash left at the end of the week or not.


    There are three important phases to this business of becoming a non-waste. Firstly,
    look at **anything you''re about to buy**, and assess if it has'
