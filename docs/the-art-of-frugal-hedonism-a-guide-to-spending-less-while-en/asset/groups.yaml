    几乎任何人都能找到适合生长欧芹、薄荷、小葱和韭苔的地方。但对于地中海草本（如迷迭香、百里香、牛至、月桂和），只有当你每天能给它们提供至少五个小时阳光时，再去尝试。


    ## 19. 与你内心的狩猎采集者接触


    如果刚好有一朵乌云顽固地笼罩着你的园艺天赋，仍然有一类植物是你很擅长种植的：杂草。这并不像看起来那样是一种诅咒，因为大多数叶类杂草本身就是极佳的食用蔬菜。苋、蒲公英、锦葵、马齿——即使你不知道它们的名字，也可能认出这些全球通用的突发植物。它们大多数在数千年来一直用于传统烹饪，而且实际上比农作物更有营养。


    这种精妙而有趣的技能是搜寻野味，因此我们专门为这个主题写了一本书（《杂草采集者手册》）。作为额外的回报，如果你把通过这种方式补充饮食养成一种习惯，你可能会发现自己也开始了智人基本的“游荡与采摘”本能了，而这种方式比另一双你并不需要的鞋要诚实得多。在与祖先洞穴自我的连接中，你可能会发现自己与周围社区建立了更亲密的联系。对野外食物的追求不仅让你对季节有了更敏锐的感知，还能带你进入从未去过的花园或郊区的角落。


    ![](img/c65bfef74f426d079910ef9e22fa68dc_85_0.png)


    这里有一个我们最喜欢的品种，用来敞开你的胃口：马齿菜（Portulaca oleracea）。

    像墨西哥人一样使用它，炒成鸡蛋；或者像希腊人一样，与番茄、红洋葱和欧芹一起做简单的沙拉。


    有一次，当我们一个杂草丛生的空空地上采集食用杂草时，我们作者们感到精疲力竭，忍不住停下来在温暖的夏日草地上打盹。亚当决定用一个大废弃行李箱当椅子，然后在它意想不到的舒适怀抱中睡着睡了——这是一种模糊而神奇的体验，唯一的微小瑕疵是后来醒来感到有些不知所措、寒冷且被遗弃，因为安妮早已回家了。安妮反驳说亚当看起来那么平静，她绝不可能吵醒他，而且，这是一个很不错的社区，她烤箱里还有要检查的食物，而且这个轶事到底有什么意义呢？（我们现在可以说，共同创作有时是一个充满挑战的过程……）


    ## 20. 沉浸你的好奇心


    爸爸从市场之行带回了礼物！有一条发带、一根弹弓橡胶和一根硬糖，小艾莉丝和萨缪尔仔细地分着。这确实是令人兴奋的收获，就像爸爸描述的杂货店收养的那只孤儿袋鼠一样令人兴奋。孩子们接连地提问，关于它是怎么喝奶的、睡在哪里、尾巴有多长，以及它有没有毛。答案被贪婪地收藏起来，以备日后思考。


    大多数人喜欢获得新东西的感觉，但忘记了这种感觉可以同样来自发现，也可以来自消费。一个迷人的事实、一个轶事、学习某种技能、拥有一次从未过的经历、听一些八卦——任何能扩展我们对所处宇宙认知的事物。


    渴望新奇或刺激吗？不要再买一件衬衫或翻遍报纸寻找新的咖啡馆了。相反，学习你花园里三种植物的名字以及它们拉丁名称的含义。利用互联网自学一个舞步。读读你一直想结识的作家的作品。参加公共建筑的免费导览。请一位口才流的朋友给你讲述他们的童年。除了书中提示“5.
    讨厌浪费”中列出的方法外，找出酸奶的五个用途。去图书馆了解你所在社区、街道，甚至可能是你房子过去住客的历史。连续两周每晚拍一张天空照片，看看它是如何变化的。画一张你猫的……用你的脚趾。


    沉浸好奇心不仅是获得那种“感觉”的一种廉价方式，更是一种深层的享乐主义。随着你知识的积累，你开始感觉到周围的世界是一座浓密而宏伟的教堂，由跳动着的、互连的功能和故事组成。此外，当你积累这些财富时，你可以全全心地投入其中，因为你知道它们不需要衣柜空间，也不需要还贷款！


    ![](img/c65bfef74f426d079910ef9e22fa68dc_87_0.png)


    这是一只小瓢虫！它没有它的父母漂亮，但它确实吃了很多蚜虫。


    知识在其他方面也可以代替物质商品的作用。我们这些作者更希望有人带着一个关于某事的、热腾腾的精彩故事来下午茶，而不是拎着一袋丹麦酥，我们确信许多人也有同感。将你的想法或发现转化为可以讲述的内容，不仅能娱乐和丰富你的听众，也能为你（即讲述者）本身帮助你理清并巩固这些想法。你被迫对脑子中的信息进行一些排序，记录下它们最关键、最具吸引力的细节。你可能会发现几个想要填补的缺失环节，甚至是一个你获得的启示。整个过程是一门值得培养的艺术。


    沉浸好奇心可以简单到每次遇到不认识的词就去查字典。然而，它会驱使你走向远方，进入体验的世界。进行一次长途骑行、吃一整颗哈瓦辣椒、尝试赤足跑步或参加午夜弥撒，这一切是因为你好奇这些事物是什么样的。研究反复表明，经历带来的快乐比物质更多且更持久。（更多信息请参见我们在“37.
    搞清楚你真正喜欢把钱花在什么”下的框。）


    追求体验性的好奇心可能是昂贵的，这也是我们这些作者有时会忽视节约的领域。我们曾花过大价去坐热气球旅行，和世界级专家一起上一个短期课程，或者去看一场震撼心灵的剧场。但我们对此分钱都不后悔，不仅是因为我们满足好奇心所做的事情是免费的，还因为好奇心避免了我们为了寻找刺激和新奇而浏览新购物的昂贵冲动。


    ![](img/c65bfef74f426d079910ef9e22fa68dc_88_0.png)


    我们没有猫，所以这里有一些我们用脚趾画的彼此的照片。


    ## 21. 不要太自私


    在资源有限的情况下，不过度消费仅仅是出于礼貌。我们假设你，亲爱的读者，已经对这种情况有了相当的了解，并且在思考那些似乎在不停运转的工业和经济巨大齿轮时，可能曾感到一阵瘫痪的毁灭感向你袭来——这些齿轮正在吞噬数百万年甚至亿万年积累下的所有闪发光、充满能量和肥沃的储备。


    尽管有这种意识，我们大多数人仍然难以在个人习惯与“糟糕”之间建立联系：以任何直观的方式建立这种联系。这并不意外，因为支持我们消费的供应和处置链条现在在很大程度上是遥远或隐藏的。在人类历史的大部分时间里，我们习惯了这样的社会和环境：当我们行为不负责任、贪婪或懒惰时，生活就会变得糟糕：邻居躲避我们；我们的作物歉收；我们所有的作化；我们的动物死亡；我们的饮用水被污染。随着时间的推移，我们开始信任这种机制，它告诉我们“如果生活真的很愉快，那么我们做的事情一定不会太坏”。现在，在这个扭曲的设定下，这种设定让我们能够舒适且反复地做着懒惰、贪婪的事——造成了真正无法想象的伤害——我们只是无法相信自己的行为可能有严重问题，因为我们的生活条件是如此的该死。


