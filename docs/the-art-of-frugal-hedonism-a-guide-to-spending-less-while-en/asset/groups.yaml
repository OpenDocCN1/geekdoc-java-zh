    ## 44. Acclimatise to the seasons


    To acclimatise might be a bit of a banal word actually. Anticipate the coming
    of the seasons, then when they finally arrive, do little leaps of joy that you’d
    blush to be caught doing; gnash your teeth as you grow weary of their ways, then
    forgive them as (or) remind yourself of their distinct charms and their necessity.
    Just don’t try and ignore them or iron them out.


    Annie remembers her geography teacher saying that much of culture is made by landscape
    – but what is landscape made by? Weather. And a bit of tectonic plate action.
    A lot of weather. Weather carves earth over eons, and dresses it (or) in vegetation
    and water bodies. Jungle vs. tundra, monsoon vs. blizzard; they might sound a
    bit like the fight-listings in an entertainment wrestling spectacular, but they
    are greater than any such cultural slip – they are culture-makers. Give them some
    respect.


    Weather should be one of the great enhancers of life. If we heat and cool our
    buildings and cars to the same temperature run, we deny ourselves this flavour
    – of snuggling into woolly jumpersers and going a bit fetal on the couch with
    duvets and hot chocolate for entire evenings; of throwing the doors and windows
    open on the first proper spring day to let the smell of warming earth and jasmine
    rush in; briny sweat licked from your upper lip as you deplete a slab of watermelon
    on a summer’s afternoon.


    In an ideal society your authors reckon we’d all down tools when the weather gets
    too extreme. Half of what people complain about temperatures getting intense is
    the impossibility of doing anything: if sizzling heat became a cease to shut up
    shops and schools or snooze or laze around languidly gossiping over an iced tea
    (or G&T), it might get more of a warm (!) welcome. If the winter dark became a
    time for long evenings around fireplaces telling stories, and ten-hour sleeps
    that let our bodies catch up on a bit of cellular repair and restock us with dreams,
    might be a yearned-for lull in the year rather than a dreaded ordeal.


    Really want to save some pennies?


    Do you realise quite how radiant you really are, precious reader? About as radiant
    as a 100 watt light globe – that’s how much an average human body puts out while
    at rest. Add this to the heat generated by cooking and appliances (fridges, computers,
    lights), and in a mild climate, you can get a room pretty cosy over the course
    of an evening with all the doors and curtains kept snugly closed and a couple
    of people cooking dinner. If that’s not enough, try putting on clothes before
    even touching that temperature dial.


    Meanwhile, letting your body adjust to the colder months speeds up your metabolism,
    so you burn off calories while doing nothing at all. There should be an infomercial
    about it! Still, if it’s a chilly evening and you want to really rely on that
    physique, get up and do some push-ups every half an hour. The added bonus of getting
    toasty will put the pleasure back into your pecs. The extra fitness will help
    your body better regulate its temperature too.


    In the summer, keeping doors, windows and curtains closed during daylight hours
    (then throwing them open as soon as dusk arrives), sipping on icy drinks, and
    using a fan, can all keep you nice and cool for a tiny fraction of the energy
    costs of air conditioning.


    Heating and air conditioning? Set the temperature to where you still feel a touch
    warm or cool, and your body will adapt better to the season. Your pores contract
    in cold or dry weather so to sweat less. It takes them a couple of weeks to get
    around doing it properly, but they can’t do it if you spend your time in furnace-level
    temperatures. Your internal thermostat seems to adjust too: limit your use of
    heating and cooling, and although you’ll gripe the weather as much as anyone for
    the first few weeks of extreme temperatures, a month later, you might feel surprised
    to hear people talking about how unbearable it is. Obviously, this approach will
    also save you money.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_169_0.png)


    When you eat seasonally your fruit bowl begins to look gratifying like the ones
    in medieval paintings.


    Our second tenet of embracing seasonal contrast saves you money too. Buying fruit
    and vegetables that are out-of-season usually costs at least twice the in-season
    price. Seasonal eating also gets you fresher produce, which not only has better
    flavour and more of its nutritional properties intact, but does way away with
    all that embodied energy of producing food in greenhouses or having it shipped
    from thousands of miles away where the weather is different. Wait for when the
    cherries start being sold by the box because the trees are so loaded with fruit
    – you might not want a whole box yourself, but use this as your heads-up that
    cherry season is truly here. In summer, look up five different recipes calling
    for lots of basil and zucchini (that''s courgette to you Brits and Kiwis). Appreciate
    how the starchy tubers that store well through winter also provide exactly the
    right ingredients for warming winter stews and mashes. Provide yourself miss fresh
    tomatoes, knowing that the imported hydroponic ones sold in the cold months taste
    kind of like squeaky rubber dolphin bath toys anyway.


    Here’s a great recipe that uses seasonal abundance (basil, zucchini, and the delicious
    weed purslane all peak in production over the same period) and common garden herbs.
    We couldn''t fit it into our Weed Forager’s Handbook, so we’re delighted to have
    an excuse to share it here.


    ## Chilled Zucchini, Purslane and Basil Soup


    - 2 tablespoons good olive oil, plus extra for drizzling

    - 1 medium onion, chopped small

    - 2 garlic cloves, thinly sliced

    - 1 teaspoon thyme leaves

    - 1 bay leaf

    - 8 small zucchini (about 1/4 kgs), thinly sliced

    - 2 cups purslane (discard any large, tough stems – these can be pickled if like)

    - Salt to taste

    - 5 cups water

    - 3 tablespoons chopped basil

    - Freshly ground pepper


    1. In a large saucepan, heat the olive oil. Add the onion and garlic and salt
    and cook over moderate heat until soft and translucent. Stir in the thyme and
    bay leaf and cook until fragrant; about 1 minute. Add the sliced zucchini and
    the purslane, season with salt, and cook, stirring occasionally, until tender;
    about 8 minutes. Add 3 cups of the water and bring to boil, then remove the saucepan
    from the heat. Discard the bay leaf and stir in the basil. Add 2 cups of cold
    water, then allow the soup to cook a little further.

    2. Pure the soup until very smooth. Refrigerate for at least 3 hours, until thoroughly
    chilled.

    3. Season the soup with salt and pepper to taste. Ladle into shallow bowls and
    decorate with a few purslane sprigs and zucchini shavings if you like. Add a drizzle
    of olive oil and some cracked pepper and serve.


    ## 45. Some notes on style


    “If our style is masterful ... we can live on top of content, float above the
    predictable responses, social programming and hereditary circuitry, letting the
    bits of colour and electricity and light filter up to us...”


    ~ Tom Robbins, Another Road Attraction


    Your authors are believers in style over substance being legitimate an option
    as its hollowed inverse. As Ella Fitzgerald sang: “It ain’t what you do, it’s
    the way that you do it”. With some people, not caring an ounce about how they
    look is part of their charm. For others amongst us however, investing a little
    attention in looking dashing assists in conjuring the less definable aspects of
    personal style – how we move, the way we use our eyes and voices. We personally
    find heeding this layer of adding vitality and sauce to our lives can be an act
    of generosity too: most people get pleasure from physical spectacle, be it a scintillating
    colour combination, a spectacular beard, a walk with a panther-like grace, or
    an unchastened twinkle in the eyes.

