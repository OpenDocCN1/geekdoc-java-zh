    # 14. Don’t buy drinks


    We don’t mean Never, but we do mean almost Never. In general, those drink bastards
    charge you mostly for the bottle and branding, or for the service if you’re in
    a café or restaurant. If the tap water in your area is safe to drink, bottled
    water is absurd (and not only from a financial point of view), and fizzy drinks
    and juices are basically sugar. They frequently cost nearly half as much as your
    meal, and add relatively nutritionless calories while they’re at.


    Keep a bottle of water in your bag instead, and refill it from the nearest tap
    when it’s low. If you’re having a sit-down meal, don’t just automatically find
    something on the menu because the waitperson says “… and to drink?” Order a drink
    only if you really want, and ask for a glass of water otherwise. People are often
    shocked by how much money they can save this way, and with little sense of suffering.


    Exceptions we personally like to make are for ritualistic drinks that stand in
    place of eating out. Perhaps a random vino at an outdoor table as the sun goes
    down, the buying of which gives you license to sit and watch the passing crowds
    for a while.


    For alcohol more generally, drinking at home (or on a friend’s porch, or on a
    picnic blanket placed in a suitably salubrious location) is obviously cheaper,
    especially if you enjoy brewing your own. If we plan on having a couple of drinks,
    your authors tend to shun pubs or bars in favour of these ‘teenage’ locations
    – it was fun then, and it’s fun now! We also highly recommend getting a second-hand
    scarf or something, so you can feel luxurious while drinking cheap gin.'
