    # 34. 从污垢的恐惧中解脱出来


    化妆品和清洁剂公司让我们相信，如果我们不经常使用它们大块状的产品，我们的朋友都会抛弃我们，而且我们会患上各种传染病。我们的作者怀疑，它们在提供建议时，考虑的是自己的利润率，而不是我们的最大利益。


    到我们青少年时期，我们大多数人已经深信，需要大量的沐浴露、面脸巾、护垫、肤质精华、脚部除臭剂和漱口水来防止自己变得令人厌恶。然后还要用厨房湿巾、表面喷雾剂、缝隙漂白剂和空气清新剂来保护我们丑陋的家。伙计们，这完全是一个骗局。即使是肥皂、洗衣液和洗洁精等基础物品，通常也可以用建议用量的四分之一达到完全相同的效果，而所有其他东西都是没必要的。


    如果你在办公室工作并坐公交上班，你可能不需要在穿一天后洗衣服。嘿，穿一天后你甚至可能都不需要洗澡，尤其是如果你通过你的“节俭享乐主义”生活得相当健康的话。别误会，我们并不像其他人那样不喜欢身上的异味，但我们实验了一番，发现保持清洁并没有那么复杂。


    ![](img/c65bfef74f426d079910ef9e22fa68dc_135_0.png)


    据说牛仔们相信，洗得太多会消耗你的活力。实际上，我们怀疑这个“事实”是从某部早已被遗忘的午场电影中听到的，但有趣的是，现代研究已经开始支持这种迷信了。请看脚注！


    # 如此清新，如此洁净


    大多数人人都知道碳酸氢钠和白醋在家庭清洁方面的妙用，但这里还有一些你可能还没有注意到的节俭居家卫生贴士：


    - 在阳光充足或有风的日子里把衣服晾起来，而不是洗它们。（对于那些没有实际污垢、只需要稍微清新一下的衣服）。我们模糊地记得曾有一个祖母告诉我们这被称为“日光洗”，听起来还像个神奇的奖励。


    - 用报纸擦窗户和镜子。先揉皱几张报纸，将它们浸入一桶水里，用它们用力擦。然后拿一两张干的纸以抛光的动作擦拭窗户。它们会变得非常光亮。显然墨水里有门道。


    - 灰烬。如果你家里产生任何灰烬，任何有油的地方都可以，比如烤盘、烤箱或洗完水池。只需把较细的部分舀进容器里，把湿刷子浸进去，然后洗洗。我们知道这听起来很奇怪，但这实际上是灰烬的传统用途，而且确实有效。


    - 准备一个抹布袋。纸巾太疯狂了。将布料剪成正方形方便使用，用后随你喜欢扔掉或洗掉。旧毛巾、床单或棉质衬衫都是完美的选择。


    - 播放响亮的音乐，全身投入到体力劳动和运动中。


    - 接受汤姆·霍德金森（Tom Hodkinson）在他《如何自由》中的建议：“如果你想要更干净的房子，只需关掉灯点燃蜡烛。电光是敌人。”他建议避免浅色床单，除非你有佣人团队，并放弃白色或层压家具而选择木质。这真是个干脆的人。


    * 你现在可能注意到我们对脚注有不当的热爱，但现在你会觉得在这件事上放过我们了，因为这确实是一件宝贝：卫生产品广告中喜欢警告我们的许多“细菌”本质上对人类健康和幸福无害！我们与这些小家伙共生进化，它们帮助在我们身体周围完成各种我们自己细胞不擅长的工作。而且任务非常多。我们的皮肤每平方英寸含有约5000万细菌。我们胃肠道中的细菌细胞比人体内的细胞还要多十倍——至少对健康人来说是这样。证据表明，鼓励身体健康的多样性可以改善口气和体味、皮肤健康、维持健康体重、免疫系统功能和消化道健康。细菌多样性不足甚至可能导致焦虑和自闭症谱系障碍。


