    start. But why not really cast your net wide? Look at history. Look at fiction.
    Look at other animals if''s what best gets you romanticising how Jaunty-Free-And-Drinking-Only-Ice-Melt-Water-To-Quench-Your-Thirst
    you''d like to be.


    While both your authors lay claim to some impressive childhood nerd credentials,
    it is Annie who was (and still is) a certifiable library nerd. So we''ll let her
    rhapsody on the mental moulding power of the novel a while:


    I remember first reading about Ernest Shackleton''s Antarctic journeys as a young
    teenager. I was fascinated and intoxicated by how the exploration team compensated
    for their meagre rations and harsh travelling conditions by becoming more spirited
    and inventive. Then I came across Tracks , Robin Davidson''s account of his solo
    journey by camel across the arid interior of Australia in the 1970s. Then Robinson
    Crusoe , could kindle a desire to craft a bowl out of a coconut in even the most
    Gucci-clad bosom. At the same time I was lapping-up whodunnits featuring a canny
    medieval peasant asle as sleeth, and working my way through John Steinbeck''s
    dustbowl-era classics.'
  - '[PAGE 54]


    I recently re-read Roald Dahl’s Matilda . Matilda is a genius child born into
    a cruel, rich, idiotic family who don’t appreciate her talents. Miss Honey, Matilda’s
    kindly school teacher, does however, and in one scene Matilda visits Miss Honey’s
    home. In the kitchen, there are no taps over the sink, a shelf and a single cupboard
    are the only furniture. On the shelf is a Primus stove, and a saucepan. Miss Honey
    sends Matilda to the well for water, then asks:


    “I don’t suppose you’ve ever done that before?”


    “Never,” Matilda said. “It’s fun. How do you get enough water for your bath?”


    “I don’t take a bath,” Miss Honey said. “I wash standing up. I get a bucketful
    of water and I heat it on this little stove and I strip and wash myself over.”


    “Do you honestly do that?” Matilda asked.


    “Of course I do,” Miss Honey said. “Every poor person in England used to wash
    that way until not so very long ago. And they didn’t have a Primus. They had to
    heat the water over the fire in the hearth.”


    “Are you poor, Miss Honey?”


    “Yes,” Miss Honey said. “Very. It’s a good little stove isn’t it?” The Primus
    was roaring away with a powerful blue flame and already the water in the saucepan
    was beginning to bubble. Miss Honey got a teapot from the cupboard and put some
    tea leaves into it. She also found half a small loaf of brown bread. She cut two
    thin slices...


    Although this scene exists to describe the poverty of Miss Honey, it kindled in
    me a perverse envy for the intense simplicity of her domestic life. I have had
    periods of my life where I had to heat water to bathe. I haven’t forgotten that
    there are some days when you pine for the convenience of a hot shower, but overall,
    the pared-back quality of those times is associated with happiness for me. And
    the way that simple things swell in value when there is ‘less’ is inherent in
    this passage: the wonder at the Primus’ efficiency, the savouring of the bread
    and tea we can project happen because of their preciousness.'
  - '[PAGE 55]


    My love affair with literary portrayals of spirit and sass in a context of material
    scarcity has never abated. It is not the scarcity itself that matters, but rather
    the message of spunkiness, good friendships, and an amazing life are not dependent
    on buying stuff. All this romanticising – ‘advertising’ – to myself of these possibilities
    has certainly been partially responsible for some of my life direction since.
    Specifically, long distance hiking, hitchhiking and all travelling with very minimal
    funds and gear. More generally, a pleasure in thrift and resourcefulness, and
    an ongoing preference for experiences over possessions, and freedom over status.


    Many of us tell admiring, nostalgia-drenched tales about the resourcefulness and
    spirit of our grandparents in the face of harder times. We marvel at how war-time
    rationing improved people''s health and forged strong communities as neighbours
    came to rely on each other than on purchasing power for both necessities and recreation.
    We speak with a twinkle of envy about the simplicity of life in ‘the old days’,
    or the unencumbered freedom of cattle-drovers and swagmen. We digest the stories
    of long sea voyages to strange shores, or of forging a life in a new land, and
    we quietly ache to put our own tenacity to the test in such a way, if only a little.


    Partly these undercurrents of emotion come from a basic human appreciation for
    strength. They speak of a yen to feel that we are living ‘real lives’, challenged
    to capacity. Perhaps even that part of us has noticed how food is tastier, rest
    is sweeter, and love is more vivid when we aren''t so swaddled in cottonwool,
    craves a little deprivation for the sake of these stronger joys that come with
    it.


    Our ideas about what constitutes value and success shift almost eagerly in response
    to stories of such lives. It is up to each of us how much we heed these stories
    instead of those brought on by the plum polish of advertising culture, and also
    how we feed ourselves more stories.


    Check out the list of potential frugally-romantic fodder in our Further Resources
    section.'
