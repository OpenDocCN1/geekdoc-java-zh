    go spend a couple of mind-blowingly fantastic years climbing those volcanoes.


    Giving up regular untrammelled consumption actually feels quite easy when you
    have a sense that it is for the sake of a life studded with superior pleasures.
    Taking your kids on a month-long hiking trip perhaps, paying off your house, getting
    a weekly massage... or just taking time off to think or do drawings.


    The self-restraint of tempered consumption may seem at odds with current cultural
    urgings to ‘live in the moment’. However, the dominant modern angle on this philosophy
    seems not so much Buddhist-style ‘being in the moment’, but the very impulsive-suspending-compatible
    ‘living for the moment’. Funny that. Spontaneity is a glorious quality, but manifesting
    it by reliably blowing every cent you have on whatever catches your eye is not
    its most stellar manifestation. Putting money aside to enable life to change when
    you want or need it isn’t about financial prudence. It’s about not being trapped.
    It allows for spontaneity on a much grander scale.


    If you do up a life of spending less and working as it suits you, you might feel
    as though you are doing something slightly illegal, or that ‘this can’t work forever.
    It’ll come back to me later somehow’. Your authors know this because we were plagued
    by the same suspicion ourselves for many years: ‘This seems like such a good deal...
    surely we can’t just keep away with it?’s the catch?’ Decades, on we have left
    this uncertainty in the dust. We still hardly ever think about money, we still
    love most of what we do most of the time, and we still appear to be very much
    getting away with it.


