    # About frugality and hedonism


    Frugality is commonly seen as the domain of the hair-shirt martyr, not to be entertained
    by any sane person who can afford all Nice Stuff there is to buy. Your authors
    would like to demur. One of our biggest motivations for being frugal is hedonism.'
  - '[PAGE 12]


    hedonism / hēdn izam/ the pursuit of or devotion to pleasure, especially to the

    pleasures of the senses.


    This devotion can come in many forms however, and worshipping too

    fervently at the altar of consumer hedonism can really stuff you up for all

    t other kinds.


    It takes some practice to become a ‘frugal hedonist’. If you’re used to

    pressing a button that says ‘cheese’ and having cheese come out, you

    might feel disgruntled about having to walk to the cheese mountain and

    exchange pleasantries with the cheese miners before you get your cheese.

    But imagine how much better that cheese will taste! Not to mention other

    perks, like your toned calves, the beautiful scenery on the way to the

    mountain, and your jovial friendship with a crew of talented cheese

    miners. Which is what Frugal Hedonism is all about: perceiving a more

    idimensional spectrum of pleasures, and living accordingly.


    # About your authors


    We both grew up as vagely middle-class kids, which in the 1970s and

    80s meant something more frugal than it does now. More, dirt, fewer

    screens, next to no takeaway meals, more walking to school, parents with

    bigger hair.


    Reflecting on her teenage years, your author Annie recognises that she

