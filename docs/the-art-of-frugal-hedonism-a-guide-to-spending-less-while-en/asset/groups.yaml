    (you can use Marmite or Promite if you are from a Non-Vegemite-Worshipping-Nation)


    Okay, we recognize the irony of including a recipe here, but what the heck...


    +   Butter (or lard, ghee, or oil)

    Onion, very finely chopped (optional, but it’s nice to add some garlic or mushrooms
