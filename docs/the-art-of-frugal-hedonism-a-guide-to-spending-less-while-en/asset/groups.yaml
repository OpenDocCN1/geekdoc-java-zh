    ![](img/c65bfef74f426d079910ef9e22fa68dc_73_0.png)


    The library serves beautifully as a third place too. When the weather is bad it
    is positively luxurious to go hunkered down in the temperaturecontrolled environment
    for an afternoon, writing, reading or gazing idly at the humans, speculating about
    their lives. Perhaps you bump into an angular old man (why do you feel like you''ve
    seen his face somewhere before?) and he drops a book titled 101 Evil Uses for
    Cat Souls . You try to hand it back to him, but he merely pushes rudely past you.
    Minutes later, you hear a scream that is unmistakably that of Mrs Finnegan the
    head librarian. Where is Sergeant Caper the library cat anyway you wonder? And
    why is there blood on my – Sorry! We just got this book muddled with the feline
    murder mystery we''re also currently working on...


    The beach is another great third place, as is a well-used community garden, but
    you can definitely get more creative. We had a mid-winter date in a laundromat
    once, after noticing what a great view of the cityscape the big windows offered.
    A little picnic, the warmth of the dryers, classic hits FM radio for a pleasantly
    dubious soundtrack, and an endless stream of passing humanity to provoke philosophical
    pontifications. Smashing.'
