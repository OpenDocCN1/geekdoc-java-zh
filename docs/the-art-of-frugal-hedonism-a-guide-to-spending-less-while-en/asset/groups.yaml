    # 2. Relish


    ‘Relish’ is a word worth using upon . It can sound almost indecent, with its suggestion
    of immoderate sensory intensity. Your authors regard this full engagement with
    the pleasure potential of life as the very finest skill in our frugality armour.


    Humans are ripe with nerve endings. Why waste them? Your author Annie remembers
    being a kid running around the bulk foods store with her best friend, plunging
    arms into the giant bins of dry beans and rating the different varieties for fun
    they were for arm-plunging. She seems to recall that might you might be asked
    to take your business elsewhere if you try this as an adult, it does serve to
    illustrate how thickly strewn our daily lives are with sensual delights just begging
    to be noticed.


    If you are walking home on one of those scorched afternoons the heat is shimmering
    and your muscles are all warm and loose and the air is heavy with eucalyptus oils
    being baked out of the street trees, you might well choose to enjoy all that sensory
    information coming at you like a molten sledgehammer. Sound challenging? Try this
    trick: treat it as if you''d paid for the experience and all its sensory elements.
    Soak it up with relish, and notice that you do not have to buy something to actively
    consume.


    Smack your lips and make appreciative noises when you''re eating something tasty.
    Half-close your eyes when a sea breeze nips the little hairs on the back of your
    neck. Stroke your dog''s ear between thumb and forefinger and marvel at its silkiness.
    Snuggle into your bed on a cold night and actually about how good it is. Gaze
    at twinkling water until you feel a bit tipsy. Enjoy the rocking movement of the
    train. For a barefoot walk somewhere where you can curl your toes into brittle
    grass, mud or sand. Listen to music while doing nothing at all. Call it mindfulness,
    call it living in the moment, call it relishing – it’s recommended by psychiatrists,
    hedonists, Buddhist monks and cheapskates alike.'
