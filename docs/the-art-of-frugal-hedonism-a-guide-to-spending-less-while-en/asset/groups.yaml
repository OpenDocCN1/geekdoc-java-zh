    # 8. Don’t be a sucker


    Over half a trillion dollars is spent globally each year on PR and advertising.
    If you live in the US, UK or Australia, around $US1000 (in 2013 terms) is spent
    on you personally. We’d love to save the advertisers all that needless bother,
    since we don’t think much of it works on us, and simply accept a cheque. Or the
    equivalent value in whisky.


    And while talking-up your product is far from a new phenomenon, not only have
    ‘persuasion specialists’ now had decades to refine their nefarious arts, but the
    sums currently being put at their disposal are a whole new kind of astronomical.
    In Germany for example, spending on online advertising alone is seven times the
    entire budget of the Nazi propaganda machine at its peak (adjusting for inflation).
    And few of us would deny the power that expenditure had to persuade people into
    a rotten system.


    Advertisers know that appealing to your rational side – merely promoting a product’s
    tangible attributes – is not very effective. More is powerful to suggest, whether
    blatantly or surreptitiously, that you don’t have everything that you deserve,
    or everything that you should have in order to be acceptable. They romance you
    by implying that there is a sort of life that is Right For You Personally, and
    that they have the stuff to sell that goes with that life. Homemakers have a sturdy
    farmhouse simplicity (because more honest way of life really resonates with you),
    super cute socks (because you’re a playful girl type of woman), huge plasma screen
    TVs (because you take entertainment seriously), or expensive Catalan beers (because
    you appreciate that European dedication to quality product (and regional specialties).
    Complex psychology is used to ensure that the marketing plays to your most precious
    visions of the You’d like to be, and the What you feel like life should be more.
    Who could blame a body for falling prey to a seduction aimed at that vulnerable
    underbelly of dreams and insecurities…?'
