    # Spend as much time in natural and outdoor environments as possible.


    If you have a garden, make sure you leave a wild, unplanned area where kids can
    wreak havoc without you getting stressed about it. Society teaches that happiness
    comes from ‘getting’, but nature-time helps kids realise it also comes from ‘doing’,
    and even from just ‘being’. Best of all, they will usually play independently
    for hours on in such places, which is brilliant for your mental health.


    If your child has grandparents, and you don’t live near them, consider moving.
    Or beg them to move closer to you. Also, as much energy as it takes into working
    out some good reciprocal arrangements: one or two days a week, you mind a friend’s
    child and they do the same for you (or increase this to three or four children
    who all play together, rotating between several different houses throughout the
    week.) Also, maximize time when you hang out with several people and a pack of
    kids. The kids disappear into their own universe of play, and only interrupt the
    adult fun if they’ve grazed their knee. A perk of both these set-ups is that kids
    have to figure out how to get along with different ages and genders, whereas at
    childcare centres or schools they end up in homogenous little cliques.


