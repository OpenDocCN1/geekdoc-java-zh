    ![](img/c65bfef74f426d079910ef9e22fa68dc_140_0.png)


    2007年，查尔斯王子试驾了一辆可以使用高达85%乙醇燃料的萨宾BioPower敞篷车。几个月前，地球政策研究所曾报告，“给一辆运动用途车的25加仑油箱加一次乙醇，所需的粮食就足够一个人吃一整年。”教训是：想要找到任何比单纯减少消费更真实的替代方案都是罕见的。


    这里也存在一种讽刺，为了帮助你不买东西而去买东西。通常情况下，更有趣的事情是让自己掌握知识，让你能够利用已有的物品。在启动一个新项目之前，先做一点研究以熟悉底层原理，然后将这些知识应用到制作酸菜、育种或任何其他事情上。知识是真正的自给自足。旧罐子非常有帮助。


    这样一来，如果你发现自己终究并不那么喜欢制作酸菜，也没有什么大损失。相反，如果你发现自己非常喜欢装番茄，并且已经连续三年在烤箱里消毒的罐子里装过了，甚至可能借了朋友的保鲜工具进行试用，那么在网上买一套二手设备可能是一个明智决定。


    ## 超级食物


    你可能会觉得，为椰子水、维生素、螺旋藻能量棒和枸杞粉花大笔钱对你那种节约的生活方式来说是一个值得的例外；是对你健康的投资。你可能错了。不要忘记，健康食品的分销商也是公司，他们通常非常努力地围绕一些非常微小的、经过挑选的研究制造大量的媒体炒作。如果你有需要修复的特定缺陷，也许可以去那里。除此之外，我们大多数人的更好做法可能是：满怀兴致地吃多样化的新鲜、完整食物，同时不要过量，多运动，并过得真正开心。


    ## #37. 弄清楚你真正喜欢花钱买什么


    冰淇淋、冰淇淋、旅行、冰淇淋、威士忌、冰淇淋。冰淇淋。但人人有异。全面的节约对于某些性格类型来说是一个极具成就感的挑战，但对于这本书的许多读者来说，对消费习惯进行良好的、严格的观察，将导致你在这里进行更深熟的调整，在那的地方进行无痛的搭配，并在恰当的位置进行毫不掩饰的优先级排序。


    你希望你的作者使用荒谬的假名来通过例子讨论我们自己的几个朋友吗？我很乐意效劳。


    **鲁弗·斯克伯和珍·多尔** 都在兼职。他们的工作虽然不是梦想工作，但属于他们选择的领域。他们不怎么休假，可能是因为他们没有过度工作，并且非常喜欢书籍、激烈的对话，以及待在花园里喝葡萄酒。有时在戏水池里。有时在打飞镖时。


    他们可能不会自己提名为特别节约，但他们选择了进化出一种最小化成本并最大化快乐的生活习惯，而不是通过增加工作。他们非常适应电脑，通过通过廉价获取大量书籍、电影等来省钱。他们还喜欢利用技能来修理和改进他们的电脑、音频设备、手机以及家里的任何电器设备。他们用组件组装了一些技术产品，从而能花更少的钱获得更好标准的设备。


    他们在自行车方面也有类似的技能，他们骑自行车去往任何地方，并保持其良好状态。他们没有车。他们购买极少的衣服和家居配件，看重捡来的家具和简单、时尚的衣服。


    他们对食物和饮料充满热情，并有一个小但产量极高的蔬菜园，提供更高质量的新鲜食材。他们腌了一些东西，如柠檬和洋葱，并不是为了省钱，而是为了能拥有最好的腌洋葱和腌柠檬——尽管这确实省了钱。他们自己酿造啤酒，因为他们喜欢研究如何制作出色的啤酒，这样他们就可以大方地分享了。


    他们也为那些经历的体验感到快乐。


    > 金钱最快乐的用途是……体验。


    研究现在支持了大多数哲学家们一直以来暗示的观点：体验比物质是更好的投资。


    对跨社会科学数据的概述发现，一旦基本需求得到满足，“我们物质存量的增加对心理或身体健康几乎没有产生可衡量的收益”，尽管我们的预期相反。相反，体验确实能带来回报。


    '
