    How do they do it? Giving up their cars was a pretty key step. Meg says: “Patrick
    saw on the RACV [the state motor vehicle association] website that it saves you
    $13,500 a year not having a car... we had two, so there was nearly thirty grand
    right there.” They cook with simple ingredients, grow their own vegetables and
