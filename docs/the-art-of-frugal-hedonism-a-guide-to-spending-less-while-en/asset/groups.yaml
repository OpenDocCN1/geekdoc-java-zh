    ![](img/c65bfef74f426d079910ef9e22fa68dc_172_0.png)


    尽管长袜子小姐（Pippi Longstocking）从海盗父亲那里继承了一箱金子，但她仍然明白，穿上不匹配的袜子和补丁裙看起来更有型，因为这就是她的行事风格。


    遗憾的是，版权法阻止我们向你展示她的装扮，所以这里有一张她马的照片。


    你可能已经猜到了接下来的内容——毕竟你已经读了这本书的四分之五了，而且没有人能一直保持变幻莫测。没错，我们要宣布，节约并不是风格的阻碍，甚至可以提升风格！让我们跳过关于二手店是个性化时尚灵感宝库的部分吧，因为我们确定奥普拉·温斯瑞曾就这个主题做过专题节目。对于一些衣橱里的节俭行家来说，二手服装市场确实是一个无价的盟友，无论是慈善商店、在线交易、与朋友交换，还是像亚当那件帅气的衬衫那样；在暴雨中于乡村小路旁的树丛里发现的衣服（顺便说一下，那是一件完美无瑕的1200支拉夫·劳伦……安妮的眼睛在五十步外就发现了在风中飘飘的品质）。


    无论如何，穿得好主要取决于你如何将这些东西组合在一起。如果你会一点缝纫，或者和会缝纫的朋友交换人情，你就能从随处而来的碎片中变出花来。在搭配中偶尔加入一件时髦的单品，可以帮你散发出一种深谙世俗的气质（如果那是你追求的追求）。即使对于那些负担得起更多花费的人来说，这通常也是一种胜出的衣橱策略——穿着从头到脚最新的时尚装通常看起来像是你用力过度了。类似的风格崩塌也经常发生在那些在刻苦的人造晒、脱毛、发型、无休止的健身和美甲脚趾护理计划上过度用力的人身上。这类人有时会被发现正穿着一双不合脚的鞋，在不优雅和不自信中僵硬地走着，引来他们本想留下印象的人的嘲笑冷笑。


    这就是“节俭享乐主义者”关注外表时真正特别的额外奖励所在。你不仅看起来不像在用力过度，你自己的习惯和心态往往会赋予你挺拔的姿态、迷人的体魄、嘴角不会下垂的嘴以及眼中闪烁的小小火花。没有任何装扮在没有这些的情况下看起来那么好。


    > 节俭的劲头


    科学已经证明了。这非常迷人。这是因为生活得不那么贪婪会让你保持活力和灵动。向人们展示同性恋成员的相同照片，然后用不同的方式描述照片中的人物，如“储蓄者”或“消费者”。观众会根据这些描述对同一个人的吸引力给出截然不同的评分。你猜得没错，节俭主义者——在2014年密歇根大学的一项研究中——平均吸引力高出36%！根据报告，“储蓄者”被认为具有更强的通用自控力，这增加了他们的浪漫和身体吸引力……对储蓄者的偏好不受参与者年龄或关系状况的影响，并且在控制参与者性别后，这种偏好依然存在。


    所以，在第一次约会上大花大钱可能会适得其反。我们建议，通过要求打包剩菜来增加浪漫情调吧。


    ## 46. 拯救（省下）孩子


    我们的作者并不是父母。我们和孩子一起待过很多时间，其中一人甚至曾专业地从事过几年的保育工作，但我们并不假装自己足够理解为人父母的挑战，以至于在书中大谈我们自己的节俭育儿主意。相反，我们选择了我们自己也是节俭长大的事实，并且有许多拥有迷你小跟班的节俭享乐主义者朋友，也有足够的证据证明孩子并不是廉价生活的不可逾越的障碍。我们询问了这些朋友中的一些关于他们带孩子时的首要节俭策略。以下是他们的建议：


    - 尽早投入是有价值的。如果人生中有一个阶段可以让你尽可能地腾出精力——即使是赚取微薄的收入或让房子荒废——那也是孩子出生的前五年。这并不是要让你必须溺爱他们并像保姆一样时刻围着他们转。这是为了让你能花极长的时间来做饭，这样你的孩子就可以帮助你并开始建立和享受厨房技艺。这是为了让你有足够的精力在他们晚上骑着三轮车在人行道上上来时留半只眼睛看着他们，而不是由于精疲力竭而把他们丢在电视前的草地上。这是为了让你有时间和他们一起看广告，并笑道“人们的这些傻事有多疯狂！”是时候和他们一起躺在草地上，看着一队的蚂蚁搬着巨大的碎屑，让他们那一点小好奇心感染你——并通过你待在那儿的快乐来告诉他们，那种好奇心是值得投入的时间。这将帮助你培养出一个能力强、顽强，并且在创造和消费中都能发现乐趣的孩子……长远来看会让生活变得更便宜、更轻松。


