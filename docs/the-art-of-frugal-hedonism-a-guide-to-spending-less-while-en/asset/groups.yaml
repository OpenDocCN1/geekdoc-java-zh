    ## 42. Have less house


    Admittedly he’s an escaped bank robber rather than an expert on human happiness,
    but Gregory David Roberts’ words “I sometimes think that the size of our happiness
    is inversely proportional to the size of our house” are worth pondering. (He wrote
    them in his quasi-autobiographical novel, Shantaram, in response to living for
    several years in the slums of Mumbai).


    If you''ve ever lived in a tent for an extended time, you''ll probably agree that
    having no stable domestic space has some downsides. You can spend a lot of time
    each day reshuffling objects to enable cooking, washing, dressing and sleeping.
    Just having a shelf to keep your muesli after spent months re-submerging in your
    backpack after each use. Also fantastic is somewhere undercover to hang clothes
    to dry, and some space away from the elements to store writing, drawing and other
    creative materials. But after that, it''s often a case of rapidly diminishing
    returns. Stuff means work, and nowhere is this more than in the case of houses.


    Houses are the Godzilla of ‘my life will be better when I have this’. The King
    Kong of ‘people will think I’m not doing well in life if I have a humble one’.
    The Colossus of possession-care. And the absolute Goliath of expenditure. An average
    Australian home loan is for about $300,000. Add interest, and this means paying
    back around double over a typical 25-year period. What''s more, some recent studies
    into living environments have suggested that having a More Desirable Home has
    no apparent effect on overall happiness. So cross ‘move to a better house’ off
    your to-do list! Live in a cheap one and spend the money you’ve saved on working
    less, taking skiing, or helping to bring back a parrot from the brink of extinction.


    Your authors have experience of both renting and owning, and we are still very
    undecided as whether the freedoms of renting are worth trading for the security
    of ownership, with all the responsibility it entails. For while the financial
    bondage of paying off a house might turn out to be worthwhile if you choose to
    sell it, the physical bondage to cleaning, organizing, upkeep, and the seemingly
    inevitable tendency to work endlessly on the thing to make it better, can eat
    your life.


    As Frugal Hedonists we encourage and celebrate the urge to look after and cherish
    things, and improve them by creative and spirited labours. The only problem with
    applying this to houses, is that they are big things. So maybe the best solution
    is to have much smaller houses. It certainly wouldn''t be hard. Dwellings in Australia,
    America, and Canada have inflated so much over the last seventy years, that an
    average new home is now two to three times as big as those being built in most
    of Western Europe. The per-person floor space figures are equally staggering.


