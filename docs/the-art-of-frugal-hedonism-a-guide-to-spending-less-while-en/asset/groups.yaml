    newspapers, remove any catalogues and put them straight in the recycling. Finally,
    we seriously suggest avoiding any kind of lifestyle magazine or liftout like the
    pox. More on why this is so helpful is conveniently located in our very next tip.


    ## 9. Stop reading those magazines


    Surely, this is the life! Flipping through the easily digestible pages of lifestyle
    media while ingesting hollandaise sauce on it on a Sunday morning. Sometimes you
    detect a trickle of adrenaline phwo into your bloodstream as you scan the pages
    full of appealing things you could be having and doing... but probably won''t.


    The language in the columns you are skimming cos up to you, making you feel as
    if these people that write stuff, do this stuff, have this stuff and live this
    life are Your People; that you ‘get’ each other. It only follows that you should
    measure yourself by the bars they seem to be setting. That makes sense for you
    to throw about phrases ‘time-poor’ and ‘retail therapy’, because they do.


    Problem is, They are not you. In Fact They are mostly even Them, but just writers
    attempting to satisfy an expected tone, spitting out blurs about a Ethiopian fusion
    restaurant with award-winning décor, or a great new line of handbags in the shape
    of marine mammals. Meanwhile, they muddle on with their imperfect lives, eat pasta,
    and go to the shops carrying an old tote with a frayed strap, just like we all
    do.


    Very few people actually do much of the stuff that the media implies people do,
    and those who work hard to keep up. But lifestyle journalism makes it easy to
    feel that there is a world of people out there effortlessly dressing, holidaying,
    exercising, eating and thinking in certain appropriate ways, and it is in human
    nature to not want to be terribly out of line with what everyone is up to. Steer
    clear of this homogenising influence is your authors’ suggestion. Spend your Sunday
    morning breakfasts perusing odd facts about breeding piranhas in captivity instead.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_52_0.png)


    Sample facial expressions you might like to experiment with while declining to
    read lifestyle magazines. Second from the right is a pet leopard, Julian, who
    takes no interest at all in media culture.


    ## 10. Romanticise other eras


    No matter how confidently you stride through the world, leaving a mangled trail
    of snubbed advertising in your wake, a bit will still get stuck to your socks
    here and there. Escaping seduction by advertising''s lifestyle-romanticising is
    ultimately impossible to do using strength of will alone. And you certainly wouldn''t
    want to do it by rejecting romance.


    Most ads carry a subliminal message that we all have the power of self-creation,
    and what they are selling can help us with that. This can only be countered by
    replacing their suggested romantic visions of ourselves with other romantic visions.
    You might even like to call it self-administered advertising.


    Where can we find these other visions? Looking to the world around you people
    that you find inspiring in terms of strength, contentment and panache is a great
    start. But why not really cast your net wide? Look at history. Look at fiction.
    Look at other animals if it''s what best gets you romanticising how Jaunty-Free-And-Drinking-Only-Ice-Melt-Water-To-Quench-Your-Thirst
    you''d like to be.


    While both your authors lay claim to some impressive childhood nerd credentials,
    it is Annie who was (and still is) a certifiable library nerd. So we''ll let her
    rhapsody on the mental moulding power of the novel a while:


    I remember first reading about Ernest Shackleton''s Antarctic journeys as a young
    teenager. I was fascinated and intoxicated by how the exploration team compensated
    for their meagre rations and harsh travelling conditions by becoming more spirited
    and inventive. Then I came across Tracks, Robin Davidson''s account of his solo
    journey by camel across the arid interior of Australia in the 1970s. Then Robinson
    Crusoe, could kindle a desire to craft a bowl out of a coconut in even the most
    Gucci-clad bosom. At the same time I was lapping-up whodunnits featuring a canny
    medieval peasant asle as sleeth, and working my way through John Steinbeck''s
    dustbowl-era classics.


    I recently re-read Roald Dahl’s Matilda. Matilda is a genius child born into a
    cruel, rich, idiotic family who don’t appreciate her talents. Miss Honey, Matilda’s
    kindly school teacher, does however, and in one scene Matilda visits Miss Honey’s
    home. In the kitchen, there are no taps over the sink, a shelf and a single cupboard
    are the only furniture. On the shelf is a Primus stove, and a saucepan. Miss Honey
    sends Matilda to the well for water, then asks:


    “I don’t suppose you’ve ever done that before?”


    “Never,” Matilda said. “It’s fun. How do you get enough water for your bath?”


    “I don’t take a bath,” Miss Honey said. “I wash standing up. I get a bucketful
    of water and I heat it on this little stove and I strip and wash myself over.”


    “Do you honestly do that?” Matilda asked.


    “Of course I do,” Miss Honey said. “Every poor person in England used to wash
    that way until not so very long ago. And they didn’t have a Primus. They had to
    heat the water over the fire in the hearth.”


    “Are you poor, Miss Honey?”


    “Yes,” Miss Honey said. “Very. It’s a good little stove isn’t it?” The Primus
    was roaring away with a powerful blue flame and the water in the saucepan was
    beginning to bubble. Although this scene exists to describe the poverty of Miss
    Honey, it kindled in me a perverse envy for the simplicity of her life. I have
    had periods of my life where I had to heat water to bathe, but overall, the way
    simple things swell in value when there is less is inherent in this passage: the
    wonder at the Primus’ efficiency, the savouring of the bread and tea. She also
    found a small loaf of bread.

