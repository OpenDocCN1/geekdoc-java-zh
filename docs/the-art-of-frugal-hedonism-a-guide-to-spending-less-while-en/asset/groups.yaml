    Some mindfulness teachers suggest starting your journey to greater sensory engagement
    by simply pausing whatever you''re doing for five minutes, three times a day.
    Contemplate your surroundings and the feeling of being in your body with unhurried
    curiosity. Observe the contact of your feet on the ground, and the feeling of
    your head resting atop your spinal column.


    Try and sense your heart and lungs in your chest, expanding and contracting in
    that ceaselessly helpful way they have.


    Other practitioners prescribe an exercise with a raisin, where you focus on every
    detail of its appearance, texture and smell for two minutes, then spend another
    two minutes eating it. Your authors personally prefer a cumquat. There really
    is a lot going on with a cumquat.


    - Does this ring true (apologies to pun-averse readers) to you? Well there''s
    evidence for it too. Researchers from the University of Essex put strangers into
    pairs to discuss ''meaningful'' topics. For half of the pairs, a mobile phone
    was left in the the room, lying discretely on a book on a nearby desk. Those in
    the room with the phone reported feeling radically less trust, empathy and overall
    relationship quality. It wasn''t their mobile phone, it wasn''t even switched
    on, and yet it affected participants'' sense of connectedness even if they didn''t
    consciously notice the phone''s existence. One hypothesis is that a phone subconsciously
    suggests the possibility for alternative social connections, and this causes us
    to participate less fully in the here-and-now.


    # 3. Be materialistic


    ‘But what?!’ you sputterter indignantly upon reading the title of this tip, ‘Surely
    anti-materialism is the very cornerstone of buying less?’ Upping the esteem in
    which you hold consumables may indeed sound an odd path to frugality, but bear
    with us here. Even if you’re currently living a nomadic life of a small backpack,
    you probably own a selection of things that help you cook, eat, bathe, sleep,
    work, and play. And if you’d like to avoid the constant consumption involved in
    replacing those things, you’ll want to recognize their value, maintain them, and
    get things that are well-enough in the first place that they will last and are
    fixable. (See also “11. Beware Fake Frugal”).


    Obvious, huh? But also no longer standard modus operandi. Our culture actually
    seems to have become a little averse to loving things: care of objects is so uptight!
    It is fashionable. Have you ever felt somehow uncool for reminding a friend to
    wipe the blades of the pruning shears you’ve lent them with an oily rag after
    use? Or coy about mentioning to your roommate that turning the blender off before
    the motor begins to overheat will make it last longer?


    With such an abundance of cheap things to replace broken cheap things, many of
    us have lost the most basic knowledge of how to care for them, and instead have
    almost fetishized the pleasure of not bothering. As a culture we have watched
    a lot of James Bond movies where the good guys blow up luxury cars and phones
    in the line of duty, and it seems de rigueur to not care. There is a societal
    suggestion that demonstrating how we are involves an ‘I’ve got more important
    things to do with my time’ carelessness about the tawdry aspects of material things,
    like looking after them. Your authors think it’s a bit lame.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_25_0.png)


    We are living in a material world,

    so oil your bike chain regularly


    Here’s a suggestion. Perhaps after you''ve watched that James Bond movie, balance
    it out by watching The Gods Must be Crazy, which makes you feel amazed that something
    as beautiful and useful as a Coke bottle exists at all. Look at the slightly daggy
    chair at your kitchen table, and be gobsmacked by the fact that men collected
    sap oozing from subtropical trees to make the rubber for the nubs on its legs.
    Huge machines pulled the metal for its frame out of the depths of the earth and
    heated it until it glowed so as to extrude it into the right shape. Ancient oil
    was whipped into a frenzy with pigments and catalysts until it became that moulded
    plastic seat. Do this same thinking to the clock on your wall, the bread on your
    shelf, and the cheesecake in your fridge.


    Be dazzled that you even have this stuff with its stupefying lineage of effort
    and resources. Be reverential! Be grateful. Then look after it – the practice
    is sure to come back into fashion sooner or later anyway.


    ![](img/c65bfef74f426d079910ef9e22fa68dc_25_1.png)


    Forty years of honing blade – definitely a well-valued thing.


    # 4. Have a lot of things you want to do with your freedom


    What came first, the frugality, or the egg that had a lot of things it was excited
    about doing? In your authors'' case, definitely the excited egg. There is no better
    incentive for being frugal than having passions you want to chase. Let''s break
    it down.


    - 1. By consuming less, you have more money to spend on doing what you really
    want to do.

    - 2. By consuming less, you have the option of doing less paid work, giving you
    more time to do what you really want to do. (Even if it happens to be chasing
    the kind of paid work that you really want to do.)


    > ! You can do a little bit of 1 and a little bit of 2 and have both.


    Back when Annie was a party-hard, she made a decision to religiously love tomato
    sandwiches every day. Instead of going to the pub, she enticed friends into sitting
    down. Despite her miniscule income, the savings did slowly but pile up. Enough
    that she had the freedom to go spend a couple of fantastic years climbing those
    volcanoes.


    So more freedom to choose what to do with your time is one of the fabulous side
    effects of spending less. Hip, hip hoay! Let’s all go to the beach! Now let’s
    watch a movie! Or maybe three movies in a row. Now let’s sleep until eleven and
    then spend the whole day reading Swallows.

