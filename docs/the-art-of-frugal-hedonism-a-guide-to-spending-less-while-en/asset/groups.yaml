    # Foreword Clive Hamilton


    W hat a terrific idea , a book showing how frugal living can be pleasurable. Not
    the kind of smug pleasure of the drop-out or the feeling of moral superiority
    that comes with driving a Prius (yes, that''s), but real actual sensual pleasure.


    Critics of consumerism often talk about our ''addiction'' to things, and it''s
    a good way to think about it. Once you are hooked it takes over your life – you
    do crazy things to feed your addiction (work incessantly, sacrifice relationships
    and run up debts), and the yet the last hit doesn''t really satisfy so you crave.


    Think about it: What would happen if all forms of electronic communication crashed
    overnight – no mobile phones, no text messaging, no email, nothing for the kids
    to watch on their iPads when having a ‘family dinner ‘ with their parents. Would
    people be unhappy? You bet they would. Would be screams of outrage, howls of distress,
    heart palpitations and demands that the government fix it quick.


    But after a few days, a few weeks for the real addicts, people would find that
    there are other things to do, other ways to communicate (conversation is good).
    After all, in the 1950s – hell, in the 1980s – none of these things existed. Were
    people miserable than then? In fact, all of the data that people in the 1950s
    were happier! They had fridges but no air travel, telephones but no iPhones, pets
    but no pet jewellery, barbecues but no $7000 outdoor kitchens, and fast food that
    mean fish and chips.


    Yet we have been convinced, not least by a vast marketing industry devoted specifically
    to the purpose, that we will be happy only if we have the latest gadget, a bigger
    house, a car that parks itself or a TV that swivels to face us if we shift from
    one end of the couch to the other. After all, the advertising industry exists
    to make us feel dissatisfied so that we buy more stuff.'
  - '[PAGE 9]


    In recent times marketing has zeroed in on one big message: Buying this thing
    or that thing will set you free. Cars, exotic holidays, insurance, home appliances,
    name it; all of these things can liberate us, although they rarely say from what.
    The truth is that as long as we fall for these messages (and nearly all of us
    do) we are locked in a prison, the prison of consumerism, and that''s the one
    prison that the marketers can never, ever promise to free us from.


    When I look around it it''s pretty obvious who are the freest people in our communities
    – the ones who have escaped the prison of consumerism and money-hunger. They don''t
    necessarily live in huts or dumpster diving every night, but they manage to live
    self-possessed enjoyable lives with great friends and jobs they love. They do
    many things consumers do, but always in moderation (while occasionally lashing
    out, just for the hell of it). They eat well, stay fairly, give more, are socially
    engaged and stress less than most of us.


    Bastards!


    In fact, the freest and most contented people much follow the advice in The Art
    of Frugal Hedonism.


    Despite all of its pleasures, there is a downside to the kind of frugal living
    described in this book. If you practise it, some of your friends, family and colleagues
    will become cranky with you. They will tell you (or tell each other) that you
    are moralizing, putting yourself on a higher ethical plane. It doesn''t matter
    how low you play it, the chances are they will still load you with these accusations.
    The truth is that they are not cranky with you; they are cranky with themselves.


    In this situation there are two solutions – find new friends, family and colleagues,
    or slip them a copy of The Art of Frugal Hedonism.


    > ive Hamilton is the author of Growth Fetish and co-author with Richard Dennis
    of Affluenza: When Too Much Is Never Enough.'
  - '[PAGE 10]


    # About this book


    Dear reader,


    We want you to have an excellent life. And we don’t think you should have to spend
    much money to do it. This book is about how.


    That doesn’t mean pages of advice on collecting discount coupons, squirreling
    away soap ends, and constructing careful budgeting strategies, because:


    +   a) Those things don’t get to the heart of the relationship between much you
    enjoy life and how you use money,


    +   b) Your authors find these things dull to think about for very long, and certainly
    didn’t want to spend two years writing a book about them.


    Instead, this book provides a selection of tips that dive right into the soft
    gooey center of how we approach feeling good , and how that affects our spending.
    It examines ways to overhaul some habits that you may have accidentally fallen
    into living in a culture that encourages consumption at every turn. It looks at
    changing those habits can generate a life that both makes more sense, and indulges
    your senses. There are some practical bits, and some science-y bits. There are
    some recipes, and some psychology. There are some serious bits, and some really
    quite preposterous bits...


    # About you


    It doesn’t matter how much money you have. This book is designed to be read by
    anyone interested in how consuming less can make life more magnificent. Or just
    anyone curious about how skilled cheapskates get away with it. You’ll find it
    particularly useful if:


    +   You’re not sure that your current spending habits are shaping a life you really
    believe in.'
- md: '

    * You suspect that some of your consumption is having unpleasant side effects
    on your wellbeing.

    * You can enjoy the simplest things, feel that spending money in certain ways
    is almost obligatory if you want to be a fully-fledged member of society.

    * You feel like the amount of paid work you need to do doesn’t leave enough time
    or energy for the rest of life.

    * You recognize how lucky you are to live in a society of such material abundance
    and convenience as to have been unimaginable for most of human history...

    * ...but you also at times feel overwhelmed by the endless choice and expectation
    that such a society brings. Confused that everything you’re supposed to do to
    take part in modern life is increasingly acknowledged to be simultaneously sabotaging
    the very future of the planet as we know it. Dang.


    If you are still trying to figure out what to do with these feelings, let this
    book be your primer for a life less dependent on the comforts of consumption,
    and more focussed on extracting maximum pleasure from the most essential parts
    of being human.


    If you’ve already started changing your life in reaction to these feelings, let
    this book be your companion in forging an existence rich with pleasures both deep
    and cheap. Let it add to your box of tricks for living frugally fantastically.
    Let it be there for when you feel that your resolve to live like that needs a
    pep talk. Or just whenever you need a charming and erudite little (modest cough!)
    to help win your less frugal friends over your way of doing things.


    ## About frugality and hedonism


    Frugality is commonly seen as the domain of the hair-shirt martyr, not to be entertained
    by any sane person who can afford all Nice Stuff there is to buy. Your authors
    would like to demur. One of our biggest motivations for being frugal is hedonism.


    hedonism / hēdnɪzəm/ the pursuit of or devotion to pleasure, especially to the
    pleasures of the senses.


    This devotion can come in many forms however, and worshipping too fervently at
    the altar of consumer hedonism can really stuff you up for all other kinds.


    It takes some practice to become a ‘frugal hedonist’. If you’re used to pressing
    a button that says ‘cheese’ and having cheese come out, you might feel disgruntled
    about having to walk to the cheese mountain and exchange pleasantries with the
    cheese miners before you get your cheese. But imagine how much better that cheese
    will taste! Not to mention other perks, like your toned calves, the beautiful
    scenery on the way to the mountain, and your jovial friendship with a crew of
    talented cheese miners. Which is what Frugal Hedonism is all about: perceiving
    a more multidimensional spectrum of pleasures, and living accordingly.


    ## About your authors


    We both grew up as vagely middle-class kids, which in the 1970s and 80s meant
    something more frugal than it does now. More, dirt, fewer screens, next to no
    takeaway meals, more walking to school, parents with bigger hair.


    Reflecting on her teenage years, your author Annie recognises that she was already
    exhibiting unusual attitudes towards extravagance. She recalls a certain afternoon
    in her first sharehouse. She had just completed high school, and was working the
    five a.m. shift in a plastics recycling factory. Every day for a week she had
    packed a change of clothes to put on after finishing work, each item the same
    shade of furious cobalt blue, sourced from various missions to second-hand stores.
    She would emerge from the factory into the midday West Australian sun, and walk
    through the industrial precinct to the ocean, where she would enter a rapture
    at her ability to merge via camouflage in the huge blue sky and the ocean that
    reflected it. On the final day of the week the recycling line turned a cobalt
    blue pooling shaped like a clamshell. She hauled it home on the train, and spent
    the afternoon gleefully ensconced in amidst the overgrown, silver grass of her
    backyard. While clinking the cubes in her glass of blue cordial, she gazed at
    the sky, trying to dissolve any sense of her own existence. She remembers thinking:
    “This is the pinnacle of debauchery.”


    Your co-author Adam recalls being quite clear as a child toasted sandwiches cooked
    over the fire were better than any other kind of dinner. His enthusiasm for cheap
    pleasures was confirmed when his parents got better jobs, and the family moved
    house. They missed their dilapidated old farmhouse dreadfully, and wasn''t at
    all impressed with the sterile expensive new house that smelt of paint, though
    of course he soon found a bog to catch frogs in, so things were okay after all.
    Later, when his adolescent went oblong, he insisted on getting the cheapest ‘pensioner’
    glasses the optometrist had in stock, refusing his parents’ offers of more fashionable
    frames. He also never once thought of asking for a car as a graduation present.


    ## About your authors and this book


    As we grew older, dear reader, your authors noticed that a lot of people in our
    unbelievably affluent society were struggling to thoroughly enjoy life, despite
    having it so good. Increasingly, those people were us — notwithstanding our promising
    starts. We pledged to not have a bar of it. We would nip this trend in the bud.
    If there was a tricky trap to avoid, we would avoid it! If there was banal brainwashing
    to buck, we would buck it! We wanted to live large! We wanted to stay healthy,
    curious, and alive to pleasure! And we wanted to do it without spending lots of
    money. Gradually, we became adept enough at it that people started asking questions
    like this:


    Q. Hello. Could you please tell me how you manage to work so little, and do so
    much cool stuff?


    Q. What the hell is your secret? You should come over sometime and give me some
    ideas about how to spend less money.


    Q. How much money do you actually spend in a week?


    Q. Why don''t you guys write a book about how to live frugally and still have
    an life?


    So here we are. To get here, we surveyed the habits of our Frugal Hedist friends
    and wrote them down. We sought out people who grew in cultures or eras that were
