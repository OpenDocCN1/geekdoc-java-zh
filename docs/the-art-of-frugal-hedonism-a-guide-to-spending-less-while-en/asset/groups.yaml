    报纸，拿掉任何目录并把它们直接放入回收桶。最后，我们强烈建议避免任何种类的生活方式杂志或像鬼一样的插页。关于为什么这样做很有帮助，更多信息就方便地位于我们的下条建议中。


    ## 9. 停止阅读那些杂志


    这简直就是生活不是吗！在周日的早晨，翻阅着易于消化的生活类媒体页面，一边品尝上面的荷兰油酱。有时，当你浏览那些充满了引人入胜的你本可以拥有和行事的页面时，你会察觉到一股肾上腺素流入你的血液……但你可能并不会这样做。


    你所扫视的那些专栏中的语言会引起你的共鸣，让你觉得写这些东西、做这些事、拥有这些东西并过着这种生活的人是“你自己的人”；觉得你们“懂”彼此。理所当然，你应该按照他们似乎设定的标准来衡量自己。你随口说出“时间贫困”和“购物疗法”之类的词汇也是合理的，因为他们确实如此。


    问题是，他们并不是你。事实上，他们大多数时候甚至不是“他们自己”，而只是试图满足预期语调的作家，吐出关于某家拥有获奖装饰的埃塞俄比亚融合菜馆的描述，或者一系列海洋动物形状的绝佳手包。与此同时，他们继续过着不完美的生活，吃意大利面，提着一个带有一个磨损带子的旧布包逛商店，就像我们所有人一样。


    很少有人真的去做了媒体所暗示人们会做的大事，那些努力跟上脚步的人也是如此。但生活类新闻很容易让你觉得，世界上有一群人正毫不费力地穿着着、度假、运动、进食并以特定的合适方式思考，而人类天性不想与所有人的进度严重脱节。你们作者的建议是避开这种同化影响。相反，花你的周日早晨去读读关于圈养食人鱼的奇闻轶事吧。


    ![](img/c65bfef74f426d079910ef9e22fa68dc_52_0.png)


    在拒绝阅读生活类杂志时，你可能会尝试的样本面部表情。右第二个是一只宠物豹朱安（Julian），它对媒体文化完全毫无。


    ## 10. 浪漫化其他时代


    无论你如何自信地穿行于世，身后留下一片被无视广告的凌乱痕迹，总会有一些碎片粘在你的袜子上。要完全逃避广告对生活方式的浪漫化诱惑，终究仅靠意志力是不可能的。而且你绝对不想通过拒绝浪漫来实现这一点。


    大多数广告都带有一种潜意识信息，即我们都拥有自我创造的力量，而他们所卖的东西可以帮助我们实现这一点。这只能通过其他的浪漫愿景来取代他们建议的自我浪漫愿景来应对。你甚至可以称其为“自我管理广告”。


    我们去哪里寻找这些其他愿景？看看你周围的人，那些在力量、知足和格调方面带给你灵感的人，这是一个很好的开始。但为什么不把网撒得大一点呢？看看历史。看看小说。如果看其他动物最能让你浪漫化你想成为那种“悠闲、无忧且只喝融化水来解渴”的状态，那就去看它们吧。


    虽然你们两位作者都声称拥有某些令人印象深刻的童年极客背景，但Annie（Annie）才是（而且仍然是）一个认证的图书馆极客。所以，让我们让她对小说的精神塑造力量发抒一会儿吧：


    我记得青少年时期第一次读到恩内斯特·沙克莱顿的南极之旅时。探险队如何通过变得更有精神、更有创意来弥补匮乏的配给和艰苦的旅行条件，令我着迷并陶醉。然后我看到了《追踪》（Tracks），罗宾·戴维森（Robin
    Davidson）关于20世纪70年代骑骆驼穿越澳洲干旱内陆独自旅行的记录。然后《鲁滨逊逊记》，即使在穿得最精致的人内心，也能点燃用椰子做一个碗的欲望。与此同时，我沉迷于以精明的中世纪农民为主角的侦探小说，并一直在读约翰·斯坦因贝克关于尘盆时代的经典著作。


    我最近重读了罗尔德·达尔的《玛蒂达》。玛蒂达是一个天才儿童，出生在一个残酷、富有且愚蠢的家庭，她的家人并不欣赏她的才华。蜜小姐（Miss Honey），玛蒂达亲切的老师，却很欣赏。在一个场景中，玛蒂达访问了蜜小姐的家。在厨房里，水槽上方没有龙头，一个架子和一个柜子是唯一的家具。架子上有一个普鲁姆斯炉子和一个煎锅。蜜小姐让玛蒂达去井边打水，然后问：


    “我想你以前没做过那个吧？”


    “没有过，”玛蒂达说。“很有趣。你怎么弄够洗澡的水呢？”


    “我不洗，”蜜小姐说，“我站着洗。我接一桶水，放在这个小炉子上加热，然后脱光衣服，把自己洗干净。”


    “你真的是那样做的吗？”玛蒂达问。


    “当然了，”蜜小姐说，“直到以前，英国的每个穷人都是这样洗的。而且他们没有普鲁姆斯炉。他们得在壁炉的火上加热水。”


    “你穷吗，蜜小姐？”


    “是的，”蜜小姐说，“非常穷。这是一个很好的小炉子对吧？”普鲁姆斯炉正发着强有力的蓝色火焰燃烧，锅里的水开始冒泡了。尽管这个场景是为了描述蜜小姐的贫穷，但它在我心中燃起了对她简单生活的病态羡慕。我生命中曾有某些时期必须加热水来洗澡，但总来说，这种在缺失时简单事物价值倍增的感觉是蕴含在这段文字中的：对普鲁姆斯炉子效率的惊叹，对面包和茶的品味。她还找到了一个小面包。

    '
