  1\n2\n3\n4\n5\nThe sum of 5 no is 15 Average is : 3.0\n```\n\n---\n\n## 练习 5：星期几\n\
  \n显示 1 到 7 之间的星期.\n\n![](img/image0070.jpeg)\n\n### JAVA 代码\n```java\nimport java.util.Scanner;\n\
  \npublic class Exercise5 {\n    public static void main(String[] args) {\n     \
  \   Scanner in = new Scanner(System.in);\n        System.out.print(\"Input number:\
