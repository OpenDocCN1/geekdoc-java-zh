  \ Java 程序]\n- [一维数组和二维数组的相加]\n- [逐行读取文件的 Java 程序]\n\n## 计算复利的 Java 程序\n给定本金、利率时间和，使用\
  \ Java 程序我们需要找到复利。\n\n示例：\n```\nEnter Principal : 5000\nEnter Rate : 5\nEnter Time\
  \ : 3\nAmount : 5788.125000000001\nCompound Interest : 788.1250000000009\n```\n\n\
  程序\n```java\nimport java.util.Scanner;\n\npublic class CompoundInterest {\n    public\
  \ static void main(String args[]) {\n        // 在此处声明并初始化。\n        double A=0,Pri,Rate,Time,t=1,CI;\n\
  \        // 创建对象。\n        Scanner S=new Scanner(System.in);\n        // 在此处输入本金、利率、时间\n\
  \        System.out.print(\"Enter Principal : \");\n        Pri=S.nextFloat();\n\
  \        System.out.print(\"Enter Rate : \");\n        Rate=S.nextFloat();\n   \
  \     System.out.print(\"Enter Time : \");\n        Time=S.nextFloat();\n      \
  \  Rate=(1 + Rate/100);\n        for(int i=0;i<Time;i++)\n            t*=Rate;\n\
  \        A=Pri*t;\n        System.out.print(\"Amount : \" +A);\n        CI=A-Pri;\n\
  \        System.out.print(\"\\nCompound Interest : \" +CI);\n    }\n}\n```\n\n输出\n\
  第一次运行：\n```\nEnter Principal : 5000\nEnter Rate : 5\nEnter Time : 3\nAmount : 5788.125000000001\n\
  Compound Interest : 788.1250000000009\n```\n第二次运行：\n```\nEnter Principal : 10000\n\
  Enter Rate : 20\nEnter Time : 5\nAmount : 24883.199999999997\nCompound Interest\
  \ : 14883.199999999997\n```\n\n## 寻找最大数的 Java 程序\n该程序从键盘（三个整数）读取，并选择最大的数。\n\n程序\n\
  ```java\n// 在三个数中寻找最大数的 Java 程序。\nimport java.util.*;\nclass LargestFrom3 {\n  \
  \  public static void main(String []s) {\n        int a,b,c,largest;\n        //\
  \ 使用 Scanner 类读取值\n        Scanner sc=new Scanner(System.in);\n        System.out.print(\"\
  Enter first number:\");\n        a=sc.nextInt();\n        System.out.print(\"Enter\
  \ second number:\");\n        b=sc.nextInt();\n        System.out.print(\"Enter\
  \ third number:\");\n        c=sc.nextInt();\n        if ( a>b && a>c )\n      \
  \      largest=a;\n        else if ( b>a && b>c )\n            largest=b;\n    \
  \    else\n            largest=c;\n        System.out.println(\"Largest Number is\
  \ \"+largest);\n    }\n}\n```\n输出\n编译：`javac LargestFrom3.java`\n运行：`java LargestFrom3`\n\
  ```\nEnter first number:45\nEnter second number:56\nEnter third number:67\nLargest\
  \ Number is : 67\n```\n\n## 寻找所有数字之和的 Java 程序\n给定一个数字，我们需要使用 Java 程序找到所有数字之和。\n\n\
  示例 1：\n```\nInput: 852\nOutput: Sum of all digits: 15\n```\n示例 2：\n```\nInput: 256868\n\
  Output: Sum of all digits: 35\n```\n\n程序\n```java\nimport java.util.Scanner;\npublic\
  \ class AddDigits {\n    public static void main(String args[]) {\n        // 初始化并声明对象。\n\
  \        int num, rem=0, sum=0, temp;\n        Scanner scan = new Scanner(System.in);\n\
  \        // 输入数字。\n        System.out.print(\"Enter the Number : \");\n        num\
  \ = scan.nextInt();\n        // temp 用于存储数字。\n        temp = num;\n        while(num>0)\
  \ {\n            rem = num%10;\n            sum = sum+rem;\n            num = num/10;\n\
  \        }\n        System.out.print(\"Sum of all digits of \"+temp+\" is : \"+sum);\n\
  \    }\n}\n```\n输出\n第一次运行：\n```\nEnter the Number : 852\nSum of all digits of 852\
  \ is : 15\n```\n第二次运行：\n```\nEnter the Number : 256868\nSum of all digits of 256868\
  \ is : 35\n```\n\n\n\n\n\n## 练习 1：数字之和\n\n创建一个 Java 程序，接收一个 0 到 1000 之间的整数，并将其所有数字相加。\n\
  \n![](img/image00066.jpeg)\n\n### JAVA 代码\n```java\nimport java.util.Scanner;\n\n\
  public class Main {\n    public static void main(String[] Strings) {\n        Scanner\
  \ input = new Scanner(System.in);\n        System.out.print(\"Input an integer between\
  \ 0 and 1000: \");\n        int num = input.nextInt();\n        int firstDigit =\
  \ num % 10;\n        int remainingNumber = num / 10;\n        int SecondDigit =\
  \ remainingNumber % 10;\n        remainingNumber = remainingNumber / 10;\n     \
  \   int thirdDigit = remainingNumber % 10;\n        remainingNumber = remainingNumber\
  \ / 10;\n        int fourthDigit = remainingNumber % 10;\n        int sum = thirdDigit\
  \ + SecondDigit + firstDigit + fourthDigit;\n        System.out.println(\"The sum\
  \ of all digits in \" + num + \" is \" + sum);\n    }\n}\n```\n\n### 输出\n```\nInput\
  \ an integer between 0 and 1000: 565\nThe sum of all digits in 565 is 16\n```\n\n\
  ---\n\n## 练习 2：英寸到米\n\nJava 数据类型练习：英寸到米\n\n编写一个 Java 程序，接收一个英寸值并将其转换为米。\n\n### 英寸转米\n\
  - 1 英寸 = 0.025400 米\n- 2 英寸 = 0.050800 米\n- 3 英寸 = 0.076200 米\n- 4 英寸 = 0.101600\
  \ 米\n- 5 英寸 = 0.127000 米\n- 6 英寸 = 0.152400 米\n\n### JAVA 代码\n```java\nimport java.util.Scanner;\n\
  \npublic class Exercise2 {\n    public static void main(String[] Strings) {\n  \
  \      Scanner input = new Scanner(System.in);\n        System.out.print(\"Input\
  \ a value for inch: \");\n        double inch = input.nextDouble();\n        double\
  \ meters = inch * 0.0254;\n        System.out.println(inch + \" inch is \" + meters\
  \ + \" meters\");\n    }\n}\n```\n\n### 输出\n```\nInput a value for inch: 1000\n\
  1000.0 inch is 25.4 meters\n```\n\n---\n\n## 练习 4：分钟转年和天\n\n让用户输入分钟，并打印该分钟对应的年数和天数。\n\
  \n编写一个 Java 程序将分钟转换为年和天数。\n\n![](img/image00067.jpeg)\n\n### JAVA 代码\n```java\n\
  import java.util.Scanner;\n\npublic class Exercise4 {\n    public static void main(String[]\
  \ Strings) {\n        double minutesInYear = 60 * 24 * 365;\n        Scanner input\
  \ = new Scanner(System.in);\n        System.out.print(\"Input the number of minutes:\
  \ \");\n        double min = input.nextDouble();\n        long years = (long) (min\
  \ / minutesInYear);\n        int days = (int) (min / 60) % 365;\n        System.out.println((int)\
  \ min + \" minutes is approximately \" + years + \" years and \" + days + \" days\"\
  );\n    }\n}\n```\n\n### 输出\n```\nInput the number of minutes: 345789\n345689 minutes\
  \ is approximately 6 years and 210 days\n```\n\n---\n\n## 练习 27：条件语句\n\nJava 条件语句：检查数字是负数、零还是正数.\n\
