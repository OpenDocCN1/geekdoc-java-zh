    \ = {{7,8,9},{10,11,12}};\n        // 实例化第三个数组存储结果\n        int c[][] = new int[2][3];\n\
    \        for(int i=0; i<2; ++i){\n            for(int j=0; j<3; ++j){\n      \
    \          // 两个数组相加并将结果存储在第三个数组中\n                c[i][j] = a[i][j] + b[i][j];\n\
    \                System.out.println(\"Enter sum of \"+i + \" \" + j +\"index\"\
    \ +\" \" + c[i][j]);\n            }\n        }\n    }\n}\n```\n### 输出\n```\nEnter\
    \ sum of 0 0index 8\nEnter sum of 0 1index 10\nEnter sum of 0 2index 12\nEnter\
    \ sum of 1 0index 14\nEnter sum of 1 1index 16\nEnter sum of 1 2index 18\n```\n\
