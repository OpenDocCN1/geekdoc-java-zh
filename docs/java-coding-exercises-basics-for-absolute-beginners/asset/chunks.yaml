  trans: "\n\n![](img/cover00072.jpeg)\n\n# JAVA 编程\n 练习：绝对初学者的基础\n### 考试与面试指南\n**J\
    \ NEWMAN**\n\n## JAVA 练习册\n- [计算复利的 Java 程序]\n- [寻找最大数的 Java 程序]\n- [寻找所有数字之和的\
    \ Java 程序]\n- [运行应用程序的 Java 程序]\n- [使用 for 循环打印从 1 到 N 的数字]\n- [打印斐波那契数列的 Java\
    \ 程序]\n- [Java 数据类型练习]\n- [华氏度转摄氏度]\n- [相加整数中的所有数字数字]\n- [Java 数据类型练习：英寸到米]\n\
    - [让用户输入分钟]\n- [Java 条件语句：练习]\n- [检查数字是负数、零还是正数]\n- [读取数字并显示其平方]\n- [输入 5 个数字找到它们的和和平均值]\n\
    - [显示 1 到 7 之间的星期]\n- [显示 n 个自然数及其和]\n- [使用 while 循环打印从 1 到 N 的数字]\n- [将十进制转换为二进制的\
    \ Java 程序]\n- [一维数组和二维数组的相加]\n- [逐行读取文件的 Java 程序]\n\n## 计算复利的 Java 程序\n给定本金、利率时间和，使用\
    \ Java 程序我们需要找到复利。\n\n示例：\n```\nEnter Principal : 5000\nEnter Rate : 5\nEnter\
    \ Time : 3\nAmount : 5788.125000000001\nCompound Interest : 788.1250000000009\n\
    ```\n\n程序\n```java\nimport java.util.Scanner;\n\npublic class CompoundInterest\
    \ {\n    public static void main(String args[]) {\n        // 在此处声明并初始化。\n   \
    \     double A=0,Pri,Rate,Time,t=1,CI;\n        // 创建对象。\n        Scanner S=new\
    \ Scanner(System.in);\n        // 在此处输入本金、利率、时间\n        System.out.print(\"Enter\
    \ Principal : \");\n        Pri=S.nextFloat();\n        System.out.print(\"Enter\
    \ Rate : \");\n        Rate=S.nextFloat();\n        System.out.print(\"Enter Time\
    \ : \");\n        Time=S.nextFloat();\n        Rate=(1 + Rate/100);\n        for(int\
    \ i=0;i<Time;i++)\n            t*=Rate;\n        A=Pri*t;\n        System.out.print(\"\
    Amount : \" +A);\n        CI=A-Pri;\n        System.out.print(\"\\nCompound Interest\
    \ : \" +CI);\n    }\n}\n```\n\n输出\n第一次运行：\n```\nEnter Principal : 5000\nEnter\
    \ Rate : 5\nEnter Time : 3\nAmount : 5788.125000000001\nCompound Interest : 788.1250000000009\n\
    ```\n第二次运行：\n```\nEnter Principal : 10000\nEnter Rate : 20\nEnter Time : 5\nAmount\
    \ : 24883.199999999997\nCompound Interest : 14883.199999999997\n```\n\n## 寻找最大数的\
    \ Java 程序\n该程序从键盘（三个整数）读取，并选择最大的数。\n\n程序\n```java\n// 在三个数中寻找最大数的 Java 程序。\nimport\
    \ java.util.*;\nclass LargestFrom3 {\n    public static void main(String []s)\
    \ {\n        int a,b,c,largest;\n        // 使用 Scanner 类读取值\n        Scanner sc=new\
    \ Scanner(System.in);\n        System.out.print(\"Enter first number:\");\n  \
    \      a=sc.nextInt();\n        System.out.print(\"Enter second number:\");\n\
    \        b=sc.nextInt();\n        System.out.print(\"Enter third number:\");\n\
    \        c=sc.nextInt();\n        if ( a>b && a>c )\n            largest=a;\n\
    \        else if ( b>a && b>c )\n            largest=b;\n        else\n      \
    \      largest=c;\n        System.out.println(\"Largest Number is \"+largest);\n\
    \    }\n}\n```\n输出\n编译：`javac LargestFrom3.java`\n运行：`java LargestFrom3`\n```\n\
    Enter first number:45\nEnter second number:56\nEnter third number:67\nLargest\
    \ Number is : 67\n```\n\n## 寻找所有数字之和的 Java 程序\n给定一个数字，我们需要使用 Java 程序找到所有数字之和。\n\
    \n示例 1：\n```\nInput: 852\nOutput: Sum of all digits: 15\n```\n示例 2：\n```\nInput:\
    \ 256868\nOutput: Sum of all digits: 35\n```\n\n程序\n```java\nimport java.util.Scanner;\n\
