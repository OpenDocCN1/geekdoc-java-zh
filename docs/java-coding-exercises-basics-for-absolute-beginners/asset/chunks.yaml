    \n---\n\n# 将十进制转换为二进制的 Java 程序\n\n给定一个整数（十进制）数字，我们需要使用 Java 程序将其转换为二进制。\n\n###\
    \ 程序\n```java\n// Scanner 类用于用于从用户处获取输入\nimport java.util.Scanner;\nclass DecimalToBinaryConversionClass{\n\
    \    public static void main(String[] args){\n        //创建 Scanner 类对象\n     \
    \   Scanner sc = new Scanner(System.in);\n        System.out.println(\"Enter Any\
    \ Decimal Number :\");\n        //接受用户输入\n        int input_decimal_num = sc.nextInt();\n\
    \        String binary_string = \" \";\n        //循环持续到 input_decimal_num > 0\n\
    \        while(input_decimal_num > 0){\n            //将余数加到字符串变量\n           \
    \ binary_string = input_decimal_num%2 + binary_string;\n            input_decimal_num\
    \ = input_decimal_num/2;\n        }\n        //显示最终结果\n        System.out.println(\"\
    Conversion of decimal to binary is : \" + binary_string);\n    }\n}\n```\n\n###\
    \ 输出\n```\nEnter Any Decimal Number :\n30\nConversion of decimal to binary is\
    \ : 11110\n```\n\n---\n\n# Java 程序中一维数组和二维数组的加法\n\n共有 2 个程序：两个一维数组的加法，两个二维数组的加法。\n\
    \n### 1) Java 中两个一维数组的加法\n```java\nclass AddTwoArrayClass{\n    public static\
    \ void main(String[] args){\n        // 数组的声明和初始化\n        int a[] = {1,2,3,4,5};\n\
    \        int b[] = {6,7,8,9,10};\n        // 实例化第三个数组存储结果\n        int c[] = new\
    \ int[5];\n        for(int i=0; i<5; ++i){\n            //两个数组相加并将结果存储在第三个数组中\n\
    \            c[i] = a[i] + b[i];\n            //显示结果\n            System.out.println(\"\
    Enter sum of \"+i +\"index\" +\" \" + c[i]);\n        }\n    }\n}\n```\n### 输出\n\
    ```\nEnter sum of 0index 7\nEnter sum of 1index 9\nEnter sum of 2index 11\nEnter\
    \ sum of 3index 13\nEnter sum of 4index 15\n```\n\n### 2) Java 中两个二维数组的加法\n```java\n\
    class AddTwoArrayOf2DClass{\n    public static void main(String[] args){\n   \
