    ## 反叛军监狱：第一卷


    **节自老本·肯诺比的日记**


    卢克·天行者在追寻成为绝地武者的途中寻找答案时，发现了一本由绝地武师欧比旺·肯诺比写的日记。日记详述了肯诺比躲在塔图文星期间的冒险——包括在大旱灾期间，欧比旺如何从贾巴的蜂的暴徒手中救了年轻的卢克。以下是该日记的摘录。


    杰森·艾亚隆 | 迈克·梅维

    配音：克里斯·埃利奥普洛斯 | 迈克·梅维

    海瑟·安东 | 乔丹·D·怀特 | C.B. 塞布斯基

    阿塞尔·阿隆索 | 乔·奎萨达 | 丹·巴克利


    卢卡斯电影提供：

