    摘要：在本·肯诺比流放塔图文星期间，他致力于保护年轻的卢克安全；莉娅公主和萨娜·斯塔罗斯将一名重要的囚犯带到太阳点监狱，途中他们被一名执行生死任务的反叛军间谍劫持；卢克·天行者在汉赌中输掉了他们的反叛军资金后，尝试尝试走私。


