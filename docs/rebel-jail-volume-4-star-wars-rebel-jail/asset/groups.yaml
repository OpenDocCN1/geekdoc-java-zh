    \ Princess Leia and Sana Starros bring an important captive to the Sunspot Prison,\
    \ when they are abducted by a rebel spy on a mission of life and death; Luke Skywalker\
    \ tries his hand at smuggling after Han loses their rebel funds in a gamble.\n\
    \nIdentifiers: LCCN 2017941922 | ISBN 9781532114116 (volume 1) | ISBN 9781532114423\
