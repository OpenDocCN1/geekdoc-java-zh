    > REMEMBER WHEN I USED TO COMPLAIN ABOUT THE FOOD AT THE JEDI TEMPLE, MASTER?


    > THAT WAS BEFORE I HAD A SNAKE EVERY NIGHT FOR A YEAR.


    > BLARGH, IT''S A GOOD THING I''M STRONG IN THE FORCE OR I WOULDN''T BE ABLE TO
    FORCE IT DOWN.


    ![](img/2554df398c5bf7daab4dc61be88df5e7_18_0.png)

    ![](img/2554df398c5bf7daab4dc61be88df5e7_18_1.png)

    ![](img/2554df398c5bf7daab4dc61be88df5e7_18_2.png)


    # KNOCK

    KNOCK


    > BE RIGHT THERE.


    ![](img/2554df398c5bf7daab4dc61be88df5e7_18_3.png)


    > WE DON''T GET MANY VISITORS IN THE Dune SEA. HOW CAN I ...


    ![](img/2554df398c5bf7daab4dc61be88df5e7_18_4.png)


    OWEN, PLEASE. COME IN. HOW DO YOU LIKE YOUR SNAKE?


    I''M NOT STUPID, KENOBI. I RECOGNIZE I HAVE FLOWN ACROSS THE GALAXY LIKE YOU DOESN''T
    MAKE ME SOME SORT OF IGNORANT FOX.


    I KNOW WHAT YOU''VE BEEN DOING.


    YOU CAN STAY AWAY FROM MY FAMILY!


    ![](img/2554df398c5bf7daab4dc61be88df5e7_19_0.png)

    ![](img/2554df398c5bf7daab4dc61be88df5e7_19_1.png)


    EVER SINCE YOU SHOWED UP, MINE''S BEEN THE ONLY TATOINE FARM IN KILOMETERS THAT''S
    NEVER BEEN ATTACKED BY SAND PEOPLE AND THE FARM THAT WAS NEVER RAIDED BY JABBA''S
    THUGS.


    AND NOW SUDDENLY JAWAS ARE EVEN GIVING US PLATES FOR FREE.


    SOUNDS TO ME LIKE YOU''VE BEEN RATHER BLESSED, OWEN. THE FORCE WORKS IN MYSTERIOUS
    WAYS.


    NO, DO YOU CRAZY JEDI! BUT IT ENDS NOW!


    ![](img/2554df398c5bf7daab4dc61be88df5e7_19_2.png)

    ![](img/2554df398c5bf7daab4dc61be88df5e7_19_3.png)


    I TOLD YOU, I''M NOT GONNA WARP THE BOY LIKE YOU DID HIS FATHER.


    YOU BROUGHT HIM TO ME TO PROTECT, AND THAT''S WHAT I''M DOING. PROTECTING HIM
    FROM YOU.


    I''M NOT ASKING TO TRAIN THE BOY. YOU''VE MADE YOURSELF QUITE CLEAR ON THAT MATTER.


    BUT LUKE HAS THE POTENTIAL TO BEETHING, TRULY REMARKABLE. JUST AS HIS FATHER WAS,
    BEFORE HE--


    HAVEN''T YOU MURDERED ENOUGH SKYWALKERS ALREADY, KENOBI? BEFORE YOU GOT HIM KILLED!


    THIS ONE''S ONLY A BOY, A FOOLHARDY BOY WHO''S TOO MUCH LIKE HIS FATHER AS IT
    IS.


    I ONLY EVER WANTED TO HELP.


    WE BOTH KNOW WHAT HAPPENS IF HE EVER LEAVES TATOOINE HE WON''T BECOMING BACK.
    NOT ALIVE, at least.


    AND I BELIEVE I''VE MADE IT CLEAR THAT WE DON''T WANT YOUR HELP.


    > YOU''RE A DANGEROUS MAN, OBI-WAN KENOBI WHETHER YOU SEE IT OR NOT.


    > TROUBLE ALWAYS HAS A WAY OF FINDING YOU, DOESN''T IT? THOUGH I SUPPOSE IT DOESN''T
    HAVE TO LOOK VERY HARD.


    > THAT TROUBLE IS GOING TO GET SOMEONE SERIOUSLY HURT.


    > DO US A FAVOR...


    ![](img/2554df398c5bf7daab4dc61be88df5e7_21_0.png)

    > *AND KEEP TROUBLE TOSELF.*


    HE WAS RIGHT. I WASN''T VERY GOOD AT KEEPING OUT OF TROUBLE. EVEN IN THE MIDDLE
    OF A DESERT, NOT I STILL LIVED. AND IF THERE WAS ONE THING I''D GOTTEN SURPRLY
    GOOD OVER THE YEARS, OTHER THAN FINDING TROUBLE... IT WAS NOT DYING.


    JUST ASK DARTH MAUL OR GENERAL GRIEVOUS.


    ![](img/2554df398c5bf7daab4dc61be88df5e7_22_0.png)


    JUST ASK JABBA THE HUT. HO BOO! JABBA SAYS... HE WOULD FIRST LIKE A DEMONSTRATION
    OF YOUR SKILL, BEFORE AGREEING TO PAY YOUR RATHER FEE. YOU MAY BEGIN THIS DEMONSTRATION
    ONCE. OR ELSE YOU MAY BEGIN DYING.


    ![](img/2554df398c5bf7daab4dc61be88df5e7_24_0.png)


    DELIVER THIS MAN ALIVE, SO THAT JABBA MIGHT WATCH HIM IN PERSON AND YOU SHALL
    RECEIVE A GENEROUS BONUS. OR YOU MAY SIMPLY BRING US HIS. DO YOU FIND THESE TERMS
    ACCEPTABLE?


