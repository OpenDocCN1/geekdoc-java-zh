    > 大旱之后已经过去了一年。

    > 蒸气器再次嗡嗡作响。沙漠之花盛开。

    > 即使在这里，在最严酷的气候下……

    > ……生命仍在延续。

    > 一如既往常。

    > 加油，卢克！你可以的！


    哇。


    你还说我永远穿不了蘑菇台呢，比格斯。


    别太自傲了，天空小子。


    我是天为此而生的。


    你知道还有时间取消这个计划的。也许可以再来几次？在进入锯齿峡谷之前再做几次试飞。


    不行，比格斯。


    行吧，好吧……

    乞人峡谷并不合适。


    即使多年来从远处观察，也显而易见……卢克·天行者是他父亲的儿子。


    这正是我担心的。


    感受力量，感受它流经你的体内。


    如果你可以的话，卢克，也许你应该慢一点。时间很紧，不是吗？


    作为一个孩子，安金是我见过最有胆量的飞行员。


    他的儿子在力量方面可能同样强大吗？


    只有一种方法可以确定。


    我可以！这是离开这块该死岩石的关键！停止星星！


    喔呼！我们在这儿！


    我想不用说……但你余生都被禁足了。


    我知道看起来很糟，除非欧恩能修理它。我只需要一些工具和零件。


    如果你允许我进入峡谷一样？像那样，你差点死了！


    欧恩……我从一开始就不该让他修理东西的！


    现在我们没有零件了，负担不起修理。


    我告诉过你，如果你允许我飞，我会自己付钱。![](img/2554df398c5bf7daab4dc61be88df5e7_9_0.png)


    我可以赢。我已经是塔图文星同年龄段最好的飞行员了。


    我刚刚切过峡谷边缘。但下一次？没有下一次了。我说你禁足时，我是字面意思。


    习惯走路吧，卢克·天行者。因为只要我活着……你就再也不会飞了。


    自从在大旱期间与贾巴的暴徒发生冲突后，我尽力让自己隐形。变得更像一个隐士和隐居。


    贾巴仍在拼命寻找那个反抗他的人。如果我需要帮助，不能在镇上寻找。我只能在那些已经低调的人中保持我的低调……我明白了。


    我知道你最近遇到了一些麻烦。我知道我看起来不太行，但……也许我们可以互相帮助。![](img/2554df398c5bf7daab4dc61be88df5e7_11_3.png)


    贾哇人最近受遭了多次袭击。他们无法保护自己。


    仍然有希望，昆刚大师。你认为安金是天选之；在某种意义上，他确实。如果他的儿子表现出同样的能力，那么也许……欧比旺·肯诺比，雇兵，我做过更糟糕的工作……尽管克隆战争看起来是那么很久以前，那么遥远。我的战争结束了。糟糕，正如我想起的，我的战斗仍在继续。


    呜——！


    我的想法一模一样，我的朋友。![](img/2554df398c5bf7daab4dc61be88df5e7_13_0.png)


    有了光剑会容易得多，但我想需要这种练习。我不应该干涉，我知道我的命令是保护那个男孩并让他躲起来。但我不是尤达大师。我知道我还没有800年的时间来守护他。在某个时刻，卢克·天行者将不得不自谋生。有些事情告诉我，当那一天来临时……他需要学会飞行。![](img/2554df398c5bf7daab4dc61be88df5e7_14_0.png)


    花了一整晚，但我想象塔斯入侵者很快就不会再袭击这些区域了。尽管我确实在想出一个更容易击退他们的方法。


    嘿，我们不能把那个男孩躲在一个安静的天然泉世界上吗？


    噢，我的背。但值得的。至少又一天，我又觉得自己像个绝地武师了。我唯一的希望是……那种感觉我并不孤单。


    我们要留下那个机器人。你有任何会说波比语的东西吗？（等等，“等等？怎么了……”）


    不，我们只买买不起的机器人。（等等，“等等？怎么了……”）


    汉？什么……

    不，我们只买买不起的机器人。


    嘿，你在做什么？它告诉过你……你就打算把这个留在这儿吗？但是……


    ![](img/2554df398c5bf7daab4dc61be88df5e7_16_0.png)


    哈哈！谢谢你，欧恩！但这些！这些都是跳跃机的零件！那是什么？谢谢什么？卢克？


