    LC record available at http://lccn.gov/2017941922\n\n![](img/2554df398c5bf7daab4dc61be88df5e7_5_2.png)\n\
    \n> IT HAD BEEN A YEAR SINCE THE GREAT DROUGHT.\n> THE VAPORATORS WERE HUMMING\
    \ AGAIN. THE DESERT FLOWERS WERE BLOOMING.\n> EVEN HERE, IN THE HARSHEST OF CLIMATES...\n\
    > ...LIFE CARRIED ON.\n> MUCH AS IT ALWAYS HAD.\n> GO LUKE! YOU GOT THIS!\n\n\
    WOW.\n\nAND YOU SAID I'D NEVER MAKE IT THROUGH MUSHROOM MESA, BIGGS.\n\nDON'T\
    \ GET TOO COCKY, SKYBOY.\n\nI WAS BORN FOR THIS.\n\nTHERE'S STILL TIME TO CALL\
    \ THIS OFF, YOU KNOW. MAYBE MANY? A FEW MORE TEST FLIGHTS THROUGH JAGGE BEFORE.\n\
    \nNO CAN DO, BIGGS.\n\nYEAH, WELL...\nLET'S BEGGAR'S CANYON DOES'T AGREE.\n\n\
    EVEN WATCHING FROM AFAR OVER THE YEARS, IT WAS PLAIN TO SEE... LUKE SKYWALKER\
    \ WAS HIS FATHER'S SON, IN SO MANY WAYS.\n\nWHICH WAS PRECISELY WHAT WORRIED ME.\n\
    \nFEEL THE FORCE, FEEL IT FLOWING THROUGH YOU.\n\nIF YOU CAN, LUKE, MAYBE YOU\
    \ SHOULD SLOW DOWN A LITTLE. IT'S A PRETTY TIGHT SQUEEZE, YOU?\n\nANAKIN WAS THE\
    \ MOST DARING PILOT I'D EVER SEEN, AS A BOY.\n\nCOULD HIS SON POSSIBLY BE AS STRONG\
    \ IN THE FORCE?\n\nTHERE WAS ONLY ONE WAY TO KNOW FOR SURE.\n\nI CAN DO THIS!\
    \ THIS IS THE KEY TO GETTING OFF THIS STUPID ROCK TODAY! STOP THE STARS!\n\nWOOHOO!\
    \ HERE WE!\n\nI SUPPOSE IT SHOULD GO WITHOUT SAYING... BUT YOU'RE GROUNDED FOR\
    \ THE REST OF YOUR LIFE.\n\nI KNOW IT LOOKS BAD, UNLESS OWEN CAN FIX IT. I JUST\
    \ NEED SOME TOOLS AND FEW PARTS IS ALL.\n\nIF YOU LET ME ENTER THE RACE LIKE I-RACE?\
    \ LIKE, YOU NEARLY GOTSELF KILLED!\n\nOWEN... I NEVER SHOULD HAVE LET HIM FIX\
    \ THING IN THE FIRST PLACE!\n\nNOW WE'RE OUT OF SPARE, WE CAN'T AFFORD TO GET\
    \ FIXED.\n\nI TOLD YOU, I'LL PAY FOR MYSELF IF YOU LET ME RACE.\n\n![](img/2554df398c5bf7daab4dc61be88df5e7_9_0.png)\n\
    \nI CAN WIN. I'M ALREADY THE BEST PILOT MY AGE ON TATOINE.\n\nI JUST CLIPPED THE\
    \ EDGE OF THE CANYON IS ALL. BUT THE NEXT TIME? THERE WON'T BE A NEXT TIME. WHEN\
    \ I SAY YOU'RE GROUNDED, I MEAN THAT LITERALLY.\n\nGET USED TO WALKING, LUKE SKYWALKER.\
    \ BECAUSE AS LONG AS I LIVE... YOU'LL NEVER FLY AGAIN.\n\nSINCE MY RUN-IN WITH\
    \ JABBA'S THUGS DURING THE DROUGHT, I HAD TRIED MY BEST TO BECOME INVISIBLE. TO\
    \ BECOME EVEN MORE OF A HERMIT AND RECLUDE.\n\nTHE HUT WAS STILL DESPERATE TO\
    \ FIND THE MYSTERIOUS MAN WHO HAD DEFIED HIM. IF I NEEDED HELP, COULD'T RISK SEEK\
    \ IT IN TOWN. I COULD ONLY MAINTAIN MY LOW PROFILE... AMONG THOSE WHO WERE ALREADY\
    \ LOWLY.\n\nI'MUM M'MALOO.\n\nI UNDERSTAND YOU'VE HAD SOME TROUBLES RECENTLY.\
    \ I KNOW I MAY NOT LOOK LIKE MUCH, BUT... PERHAPS WE CAN BE OF ASSISTANCE TO ONE\
    \ ANOTHER.\n\n![](img/2554df398c5bf7daab4dc61be88df5e7_11_3.png)\n\nTHE JAWAS\
    \ HAD RECENTLY BEEN THE VICTIMS OF SEVERAL RAIDS. THEY WERE UNABLE TO PROTECT\
    \ THEMSELVES AGAINST.\n\nTHERE'S STILL HOPE, MASTER QUI-GON. YOU THOUGHT ANAIN\
    \ WAS THE CHOSEN ONE; PERHAPS IN A WAY, HE WAS. IF HIS SON SHOWS THE SAME ABILITIES,\
    \ THEN JUST MAYBE... OBI-WAN KENOBI, BODYGUARD FOR HIRE, I'D HAD WORSE JOBS..\
    \ THOUGH THE CLONE WARS SEEMED SO VERY LONG AGO AND VERY FAR AWAY. MY WAR HAD\
    \ ENDED. BADLY, AS I RECALLED BUT MY FIGHT CARRIED ON.\n\nRRRRRRHHHHRRRRRRGGHH!\n\
    \nMY THOUGHTS EXACTLY, MY FRIEND\n\n![](img/2554df398c5bf7daab4dc61be88df5e7_13_0.png)\n\
    \nTHIS WOULD BE FAR EASIER WITH A LIGHTSABER, BUT I SUPPOSE I COULD USE THE EXERCISE.\
    \ I SHOULDN'T HAVE BEEN INTERFERING, I KNEW THAT MY ORDERS WERE TO PROTECT THE\
    \ BOY AND KEEP HIM HIDDEN. BUT I WAS NO MASTER YODA. I KNEW I WOULD'T BE AROUND\
    \ FOR ANOTHER 800 YEARS TO WATCH OVER HIM. AT SOME POINT, LUKE SKYWALER WAS GOING\
    \ TO HAVE TO FEND FOR HIMSELF. AND SOMETHING TOLD ME THAT WHEN THAT DAY CAME...\
    \ HE WOULD NEED TO KNOW HOW TO FLY.\n\n![](img/2554df398c5bf7daab4dc61be88df5e7_14_0.png)\n\
    \nIT TOOK ALL NIGHT, BUT I IMAGINED THE TUSKEN RAIDERS WOULD'T BE RAIDING THESE\
    \ AREAS ANY SOON. THOUGH I REALLY DID TO DEVISE AN EASIER WAY TO FIGHTEN THEM\
    \ OFF.\n\nHIGH, COULD'T WE HAVE HIDDEN THE BOY ON A NICE QUIET WORLD OF NATURAL\
    \ SPRINGS?\n\nOH, MY BACK. BUT IT WAS WORTH IT. FOR ANOTHER DAY AT LEAST, I FELT\
    \ LIKE A JEDI AGAIN. MY ONLY HOPE WAS THAT... I WASN'T ALONE IN THAT FEELING.\n\
    \nWE'LL TAKE THAT ASTROMECH. DO YOU HAVE ANYTHING THAT SPEAKS BOCCEE? (Wait, \"\
    Wait? What's...\")\n\nNO, WE'RE ONLY BUYING THE DROIDS WE CAN'T AFFORD. (Wait,\
    \ \"Wait? What's...\")\n\nHUN? WHAT's...\nNO, WE'RE ONLY BUYING THE DROIDS WE\
    \ CAN'T AFFORD. \n\nHEY, WHAT ARE YOU DOING? IT TOLD YOU... YOU'RE JUST GONNA\
    \ LEAVE THIS HERE? BUT...\n\n![](img/2554df398c5bf7daab4dc61be88df5e7_16_0.png)\n\
    \nHA HA! THANKS, UNLE OWEN! BUT THESE! THESE ARE SKYHOPPER PARTS! WHAT WAS THAT?\
    \ THANKS FOR WHAT? LUKE?\n\n![](img/2554df398c5bf7daab4dc61be88df5e7_17_0.png)\n\
    ![](img/2554df398c5bf7daab4dc61be88df5e7_17_1.png)\n![](img/2554df398c5bf7daab4dc61be88df5e7_17_2.png)\n\
    ![](img/2554df398c5bf7daab4dc61be88df5e7_17_3.png)\n![](img/2554df398c5bf7daab4dc61be88df5e7_17_4.png)\n"
