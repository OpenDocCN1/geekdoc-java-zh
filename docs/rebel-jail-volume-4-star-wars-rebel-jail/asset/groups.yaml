- md: "\n# STAR WARS\n\n# STAR WARS\n\n# REBEL JAIL: VOLUME 1\n\nAARON MAYHEW\n\n\
    ![](img/2554df398c5bf7daab4dc61be88df5e7_0_0.png)\n\n## REBEL JAIL: VOLUME 1\n\
    \n**FROM THE JOURNALS OF OLD BEN KENOBI**\n\nWHILE SEARCHING FOR ANSWERS IN HIS\
    \ QUEST TO BECOME A JEDI, LUKE SKYWALKER HAS UNCOVERED A JOURNAL WRITTEN BY JEDI\
    \ MASTER OBI-WAN KENOBI. THE JOURNAL DETAILS OF KENOBI'S ADVENTURES DURING THE\
    \ TIME HE WAS IN HIDING ON TATTOOINE--INCLUDING WHEN OBI-WAN RESCUED A YOUNG LUKE\
    \ FROM JABBA THE HUT'S THUGS DURING THE GREAT DROUGHT. WHAT FOLLOWS IS EXCERPT\
    \ FROM THAT JOURNAL.\n\nJASON AARON | MIKE MAYHEW\nVO: CHRIS ELIOPULOS | MIKE\
    \ MAYHEW\nHEATHER ANTON | JORDAN D. WHITE | C.B. CEBULSKI\nAXEL ALONSO | JOE QUESADA\
