- img_proc: true
  md: 'OWEN, PLEASE. COME IN. HOW DO YOU LIKE YOUR SNAKE?


    I''M NOT STUPID, KENOBI. I RECOGNIZE I HAVE FLOWN ACROSS THE GALAXY LIKE YOU DOESN''T
    MAKE ME SOME SORT OF IGNORANT FOX.


    I KNOW WHAT YOU''VE BEEN DOING.


    YOU CAN STAY AWAY FROM MY FAMILY!


    ![](img/2554df398c5bf7daab4dc61be88df5e7_19_0.png)


    ![](img/2554df398c5bf7daab4dc61be88df5e7_19_1.png)


    EVER SINCE YOU SHOWED UP, MINE''S BEEN THE ONLY TATOINE FARM IN KILOMETERS THAT''S
    NEVER BEEN ATTACKED BY SAND PEOPLE

    AND THE FARM THAT WAS NEVER RAIDED BY JABBA''S THUGS.


    AND NOW SUDDENLY JAWAS ARE EVEN GIVING US PLATES FOR FREE.


    SOUNDS TO ME LIKE YOU''VE BEEN RATHER BLESSED, OWEN. THE FORCE WORKS IN MYSTERIOUS
    WAYS.


    NO, DO YOU CRAZY JEDI! BUT IT ENDS NOW!


    ![](img/2554df398c5bf7daab4dc61be88df5e7_19_2.png)


