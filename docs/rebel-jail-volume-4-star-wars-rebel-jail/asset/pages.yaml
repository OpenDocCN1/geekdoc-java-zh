- img_proc: true
  md: '> IT HAD BEEN A YEAR SINCE THE GREAT DROUGHT.


    > THE VAPORATORS WERE HUMMING AGAIN. THE DESERT FLOWERS WERE BLOOMING.


    > EVEN HERE, IN THE HARSHEST OF CLIMATES...


    > ...LIFE CARRIED ON.


    > MUCH AS IT ALWAYS HAD.


    > GO LUKE! YOU GOT THIS!'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'WOW.


    AND YOU SAID I''D NEVER MAKE IT THROUGH MUSHROOM MESA, BIGGS.


    DON''T GET TOO COCKY, SKYBOY.


    I WAS BORN FOR THIS.


    THERE''S STILL TIME TO CALL THIS OFF, YOU KNOW. MAYBE MANY? A FEW MORE TEST FLIGHTS
    THROUGH JAG GOUGE BEFORE.


    NO CAN DO, BIGGS.


    YEAH, WELL...


    LET''S BEGGAR''S CANYON DOESN''T DISAGREE.'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'EVEN WATCHING FROM AFAR OVER THE YEARS, IT WAS PLAIN TO SEE...


    LUKE SKYWALKER WAS HIS FATHER''S SON, IN SO VERY MANY WAYS.


    WHICH WAS PRECISELY WHAT WORRIED ME.


    FEEL THE FORCE, FEEL IT FLOWING THROUGH YOU.


    IF YOU CAN.


    ANAKIN WAS THE MOST DARING PILOT I''D EVER SEEN, EVEN AS A BOY.


    COULD HIS SON POSSIBLY BE AS STRONG IN THE FORCE?


    THERE WAS ONLY ONE WAY TO KNOW FOR SURE.


    LUKE, MAYBE YOU SHOULD SLOW DOWN A LITTLE. IT''S A PRETTY TIGHT SQUEEZE, YOU?


    I CAN DO THIS! THIS IS THE KEY TO GETTING OFF THIS STUPID ROCK SOMEDAY!


    FIRST I CONQUER BEGGARS'' CANYON NEXT STOP THE STARS!


    WOOHOO! HERE WE!'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'I SUPPOSE IT SHOULD GO WITHOUT SAYING... BUT YOU''RE GROUNDED FOR THE REST
    OF YOUR LIFE.


    I KNOW IT LOOKS BAD, UNLESS OWEN CAN FIX IT. I JUST NEED SOME NEW TOOLS AND FEW
    PARTS IS ALL.


    IF YOU LET ME ENTER THE ANCHORHEAD RACE LIKE IVE-


    RACE? LIKE, YOU NEARLY GOT YOURSELF KILLED!


    OWEN... I NEVER SHOULD HAVE LET HIM FIX THAT THING IN THE FIRST PLACE!


    NOW WE''RE OUT A SPEIDER, A SPEIDER WE CAN''T AFFORD TO GET FIXED.


    I TOLD YOU, I''LL PAY FOR MYSELF IF YOU JUST LET ME RACE.


    ![](img/2554df398c5bf7daab4dc61be88df5e7_9_0.png)'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'I CAN WIN. I''M ALREADY THE BEST BUSH PILOT MY AGE ON TATOOINE.


    I JUST CLIPPED THE EDGE OF THE CANYON IS ALL. BUT THE NEXT TIME?


    THERE WON''T BE A NEXT TIME. WHEN I SAY YOU''RE GROUNDED, I MEAN THAT LITERALLY.


    BEST GET USED TO WALKING, LUKE SKYWALKER. BECAUSE AS LONG AS I LIVE...


    "YOU''LL NEVER FLY AGAIN."


    SINCE MY RUN-IN WITH JABBA''S THUGS DURING THE DROUGHT, I HAD TRIED MY BEST TO
    BECOME INVISIBLE.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'TO BECOME EVEN

    MORE OF A HERMIT

    AND RECLUDE.


    THE HUTT WAS STILL

    DESPERATE TO FIND

    THE MYSTERIOUS

    MAN WHO HAD

    DEFIED HIM.


    ![](img/2554df398c5bf7daab4dc61be88df5e7_11_0.png)


