  md: '# # STAR WARS

    ## REBEL JAIL


    What comes next for the Rebels after the events of Vader Down? Find out as the
    adventures of Luke Skywalker and friends continue! The Rebel crew are en route
    to a prison base with a very important captive. But, unlucky for them, they aren''t
    the only ones with their eyes on this prize! And, in another tale from the Journals
    of Obi-Wan Kenobi, journey back to the Jedi''s days of exile on Tatooine. Moisture
    farmer Owen Lars may have taken in young Luke, but he refused to let Ben be part
    of the boy''s life. Now, prepare to discover the reason why!


