    RECENTLY.


    I KNOW I

    MAY NOT LOOK

    LIKE MUCH,

    BUT...


    PERHAPS

    WE CAN BE OF

    ASSISTANCE TO

    ONE ANOTHER.


    ![](img/2554df398c5bf7daab4dc61be88df5e7_11_3.png)'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'THE JAWAS HAD RECENTLY BEEN THE VICTIMS OF SEVERAL RAIDS.


    RAIDS THEY WERE: UNABLE TO PROTECT THEMSELVES AGAINST.


    THERE''S STILL HOPE, MASTER QUI-GON.


    YOU THOUGHT ANAAKIN WAS THE CHOSEN ONE; PERHAPS IN A WAY, HE WAS.


    IF HIS SON SHOWS THE SAME ABILITIES, THEN JUST MAYBE...


    OBI-WAN KENOBI, BODYGUARD FOR HIRE, I''D HAD WORSE JOBS..


    THOUGH THE CLONE WARS SEEMED SO VERY LONG AGO AND VERY FAR AWAY.


    MY WAR HAD ENDED.


    BADLY, AS I RECALLED'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'BUT MY FIGHT CARRIED ON.


    RRRRRRHHHHRRRRRRGGHH!


    MY THOUGHTS EXACTLY, MY FRIEND


    ![](img/2554df398c5bf7daab4dc61be88df5e7_13_0.png)'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'THIS WOULD BE FAR EASIER WITH A LIGHTSABER, BUT I SUPPOSE I COULD USE THE EXERCISE.


    I SHOULDN''T HAVE BEEN INTERFERING, I KNEW THAT MY ORDERS WERE TO PROTECT THE
    BOY AND KEEP HIM HIDDEN.


    BUT I WAS NO. MASTER YODA. I KNEW I WOULDN''T BE AROUND FOR ANOTHER 800 YEARS
    TO WATCH OVER HIM.


    AT SOME POINT, LUKE SKYWALER WAS GOING TO HAVE TO FEND FOR HIMSELF.


    AND SOMETHING TOLD ME THAT WHEN THAT DAY CAME...


    ...HE WOULD NEED TO KNOW HOW TO FLY.


    ![](img/2554df398c5bf7daab4dc61be88df5e7_14_0.png)'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'UTINNI!


    IT TOOK ALL NIGHT, BUT I IMAGINED THE TUSKEN RAIDERS WOULDN''T BE RAIDING THESE
    AREAS AGAIN ANY TIME SOON.


    THOUGH I REALLY DID NEED TO DEVISE AN EASIER WAY TO FRIGHTEN THEM OFF.


    HIGH, WIF! COULDN''T WE HAVE HIDDEN THE BOY ON A NICE QUIET WORLD OF NATURAL HOT
    SPRINGS?


    OH, MY BACK.


    BUT IT WAS WORTH IT.


    FOR ANOTHER DAY AT LEAST, I FELT LIKE A JEDI AGAIN.


    MY ONLY HOPE WAS THAT...'
