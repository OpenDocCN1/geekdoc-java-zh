  md: '# # REBEL JAIL: VOLUME 1


    **FROM THE JOURNALS OF OLD BEN KENOBI**


    WHILE SEARCHING FOR ANSWERS IN HIS QUEST TO BECOME A JEDI, LUKE SKYWALKER HAS
    UNCOVERED A JOURNAL WRITTEN BY JEDI MASTER OBI-WAN KENOBI. THE JOURNAL DETAILS
    OF KENOBI''S ADVENTURES DURING THE TIME HE WAS IN HIDING ON TATTOOINE--INCLUDING
    WHEN OBI-WAN RESCUED A YOUNG LUKE FROM JABBA THE HUT''S THUGS DURING THE GREAT
    DROUGHT. WHAT FOLLOWS IS EXCERPT FROM THAT JOURNAL.


    JASON AARON | MIKE MAYHEW


    VO''S CHRIS ELIOPULOS | MIKE MAYHEW


    HEATHER ANTON | JORDAN D. WHITE | C.B. CEBULSKI


    AXEL ALONSO | JOE QUESADA | DAN BUCKLEY


    FOR LUCASFILM:


    MICHAEL SIGLAIN | FRANK PARISI | RAYNE ROBERTS, PABLO HIDALGO, LEE CHEE


