    \ as binary trees by translating each binary operation to a tree with its operator\
    \ as the root and its two operands as the operator’s children. For example, (a\
    \ + b) * c can be represented as this binary tree:\n\n![image](image/138x001.png)\n\
    \nSuch a tree is called an expression tree or parse tree, because it represents\
    \ the syntactic structure of the expression.\n\nThere is a natural correspondence\
    \ between subexpressions and subtrees in expression trees. For example, (a + b)\
    \ is a subexpression of (a + b) * c, and it occurs as the left subtree of the\
    \ expression tree, since it is the left operand of the multiplication:\n\n![image](image/138x001.png)\n\
    \n### Binary Search Trees\n\nA binary search tree is a binary tree where each\
    \ node has a key, and all keys in the left subtree are smaller than the node's\
    \ key, while all keys in the right subtree are larger than the node's key.\n\n\
    The property of a binary search tree allows us to search, insert, and delete in\
    \ $O(h)$ time, where $h$ is the height of the tree. In a balanced binary search\
    \ tree, $h = O(\\log n)$, making these operations very fast.\n\n### Binary Search\
    \ Trees\n\nA binary search tree is a binary tree such that for each node $p$:\n\
    - all nodes in the left subtree have keys less than $p.key$\n- all nodes in the\
    \ right subtree have keys greater than $p.key$\n\n### Representing General Trees\
    \ as Binary Trees\n\nThe left child/right sibling representation is a way to represent\
    \ a general tree as a binary tree. In this representation:\n- The left child of\
    \ a node in the binary tree points to the first child of the general tree.\n-\
    \ The right child of a node in the binary tree points to its next sibling in the\
    \ general tree.\n\nThis allows us to represent any tree using the binary tree\
    \ structure, where each node has at most two pointers.\n\n![image](image/137x001.png)\n"
  raw: "Problems that involve searching a large number of possibilities can make it\
    \ difficult to keep track of where an algorithm “is” currently in the search space.\
    \ Example problems of this type include mazes, puzzles such as crosswords or Sudoku,\
    \ and discrete optimization problems that attempt to maximize or minimize some\
    \ quantity over a set of discrete objects. Recursive backtracking solves problems\
    \ like these by using the call stack to manage where it is and to allow backing\
    \ up to try something else if the current search path has failed.\n\nThe n-queens\
    \ problem is a puzzle that requires placing n chess queens on an n × n board so\
    \ that none of the queens attack each other. Queens are allowed to move horizontally,\
    \ vertically, or diagonally any number of squares. For example, with n = 4, the\
    \ following is not a valid solution because two queens attack each other along\
    \ a diagonal: Q\n\n![image](image/135x001.png)\n\nA recursive backtracking solution\
    \ to the n-queens problem reduces the problem to placing one queen in each column.\
    \ [Listing 7.5](#K20431_C007.xhtml_lis7.5) describes a recursive queens(board,\
    \ column) function that moves across the board from left to right, placing one\
    \ queen per column.\n\nListing 7.5: Backtracking Solution To n-Queens (Pseudocode)\n\
    \n```\n 1 If finished, display board\n```\n\n```\n 2 Else\n```\n\n```\n 3 For\
    \ each row\n```\n\n```\n 4   board[column] = row\n```\n\n```\n 5   If this is\
    \ a legal position\n```\n\n```\n 6   queens(board, column + 1)\n```\n\nWhere is\
    \ the backtracking in this code? It is managed completely by the recursion: if\
    \ queens(board, column + 1) fails to find a solution, the for-loop advances to\
    \ check the next possible row.\n\nExercises\n\n1.  Implement [Listing 7.3](#K20431_C007.xhtml_lis7.3)\
    \ as a recursive function lcs(s1, s2) to return the longest common subsequence\
    \ of strings s1 and s2.\n\n2.  Implement [Listing 7.4](#K20431_C007.xhtml_lis7.4)\
    \ as a recursive hanoi(n, src, intermed, dest) to solve the Towers of Hanoi puzzle.\
    \ Print a message like this for the middle step of the method:\n\n    ```\n  \
    \  Move disk 3 from 0 to 2.\n    ```\n\n    Do not forget a base case.\n\n3. \
    \ Determine the O() performance of the hanoi() function by counting the number\
    \ of function calls made with n disks.\n\n4.  Implement [Listing 7.5](#K20431_C007.xhtml_lis7.5)\
    \ as a recursive function queens(board, column) to solve the n-queens problem\
    \ using backtracking.\n\n5.  Explain why the recursive backtracking solution to\
    \ the n-queens problem finds all solutions to the problem, rather than just one.\n\
    \nChapter 8\n\n# Trees\n\nTrees are non-linear, hierarchical, and recursive data\
    \ structures with a wide range of applications. In fact, we have already seen\
    \ call trees in [Section 7.2](#K20431_C007.xhtml_ch7.2) as a useful model for\
    \ tracking recursive computations.\n\n## 8.1 Definitions and Examples\n\nA tree\
    \ is a (possibly empty) set of elements called nodes with one node designated\
    \ as the root. The root is connected via edges to some number of child nodes,\
    \ each of which is itself the root of a subtree. Thus, trees are naturally recursive.\
    \ A leaf is a node with no children; an internal node is any non-leaf. A branch\
    \ in a tree is a path of connected edges starting at the root and ending in a\
    \ leaf. Trees are usually drawn with the root at the top.\n\nFor example, in the\
    \ tree below, 31 is the root, 7 is a child of 5, 24 is a leaf, and 14 is an internal\
    \ node.\n\n![image](image/137x001.png)\n\nThe child relationship between nodes\
    \ in a tree naturally leads to many other familial terms for nodes, such as parent,\
    \ grandparent, sibling, ancestor, and descendant. Every node has exactly one parent,\
    \ except for the root which has no parent.\n\nThe depth or level of a node n in\
    \ a tree is defined recursively:\n\n$\\text{depth(n)} = \\left\\{ \\begin{matrix}\
    \ 1 & \\text{ifnistheroot} \\\\ {\\text{1} + \\text{depth(parent(n))}} & \\text{otherwise}\
    \ \\end{matrix} \\right.$\n\nThe height of a tree is its maximum depth. The tree\
    \ above has height 3, and node 25 is on level 2.\n\nAmong the most common trees\
    \ are binary trees in which every node has at most two children, usually named\
    \ left and right. The following examples illustrate just a few of the many uses\
    \ of binary trees.\n\n### Expression Trees\n\nArithmetic expressions can be represented\
    \ as binary trees by translating each binary operation to a tree with its operator\
    \ as the root and its two operands as the operator’s children. For example, (a\
    \ + b) * c can be represented as this binary tree:\n\n![image](image/138x001.png)\n\
    \nSuch a tree is called an expression tree or parse tree, because it represents\
    \ the syntactic structure of the expression.\n\nThere is a natural correspondence\
    \ between subexpressions and subtrees in expression trees. For example, (a + b)\
    \ is a subexpression of (a + b) * c, and it occurs as the left subtree of the\
    \ expression tree, since it is the left operand of the multiplication:\n\n![image](image/138x002.png)\n\
    \nThus, when drawing expression trees, it may be easier to start with subexpressions\
    \ and build the tree from the bottom up rather than trying to work from the top\
    \ down.\n\nExample\n\nThe expression tree corresponding to $(a - c)*d + \\frac{f}{b\
    \ + e}$ is:\n\n![image](image/138x004.png)\n\nNotice the subtrees corresponding\
    \ to subexpressions such as (a − c), (a − c) * d, and b + e.\n\n### Binary Search\
    \ Trees\n\nA binary search tree is a binary tree containing comparable values\
    \ in which the following property is true at every node p:\n\n$\\begin{matrix}\
    \ \\text{Everyvaluein} \\\\ \\text{leftsubtreeofp} \\end{matrix} < \\text{Valueatp}\
    \ < \\begin{matrix} \\text{Everyvaluein} \\\\ \\text{rightsubtreeofp} \\end{matrix}$\n\
    \nFor example, here is a small binary search tree: 23\n\n![image](image/139x002.png)\n\
    \nThe inequalities above are strict because we assume binary search trees do not\
    \ contain duplicate elements; see Exercise 6 in [Section 9.4](#K20431_C009.xhtml_ch9.4)\
    \ for the reason. We will study binary search trees in depth in [Chapter 9](#K20431_C009.xhtml_ch9).\n\
    \n### Representing General Trees as Binary Trees\n\nRequiring every node in a\
    \ tree to have at most two children might sound like a serious limitation compared\
    \ with allowing any number of children at any node. At the same time, writing\
    \ code that will store any number of children will be far more complicated than\
    \ nodes with two children, left and right.\n\nAre general trees “more powerful”\
    \ than binary trees in the sense that they can store relationships that binary\
    \ trees cannot? The answer is no: any tree can be stored as a binary tree and\
    \ converted back.\n\nThe left child/right sibling convention takes an arbitrary\
    \ tree and has each node point to its first child (if any) on the left, and its\
    \ next sibling (if any) on the right. For example, given this general tree: 15\n\
    \n![image](image/139x003.png)\n\nthe associated binary tree begins with 15 at\
    \ the root and 2 on its left as its first child. As the root, 15 has no siblings\
    \ so has no right child:[1](#K20431_C008.xhtml_f_ch08_1)\n\n![image](image/139x004.png)\n\
    \nThen 2 has 46 on the left as its first child and 33 on the right as its next\
    \ sibling:\n\n![image](image/140x001.png)\n\nThe entire associated binary tree\
    \ is:\n\n![image](image/140x002.png)\n\nExercises\n\n1.  In a binary expression\
    \ tree, what type of node are operators always in?\n\n2.  In a binary expression\
    \ tree, what type of node are operands always in?\n\n3.  Draw a binary expression\
    \ tree for each of these arithmetic expressions:\n\n    1.  (a) $x + y + z*w -\
    \ \\frac{v}{u}$\n\n    2.  (b) $\\frac{a*b}{c} - d + f*g + h$\n\n    3.  (c) $(x\
    \ + y + z)*\\frac{w - v}{u}$\n\n    4.  (d) $\\frac{x*y}{z - w + v*u}$\n\n4. \
    \ For each of these lists of elements, draw three binary search trees of different\
    \ heights containing exactly these items:\n\n    1.  (a) 19, 27, 38, 42, 48, 49,\
    \ 62\n\n    2.  (b) 6, 10, 61, 77, 81, 84, 94\n\n    3.  (c) 27, 48, 56, 61, 63,\
    \ 76, 89\n\n5.  Determine the maximum height of a binary search tree with n nodes.\n\
    \n6.  Determine the minimum height of a binary search tree with n nodes.\n\n7.\
    \  Draw the associated binary tree for each of these general trees using the left\
    \ child/right sibling convention:"
