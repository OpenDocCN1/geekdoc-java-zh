  trans: "\n此时，10 位于队列头部，30 位于队列末尾，因此实例变量应该跟踪这些位置：\n\n![image](img/090x002.png)\n\n\
    如果下一个操作是入队（enqueue）40，那么它将进入队列的末尾：\n\n![image](img/090x003.png)\n\n像这样入队新项的代码非常简单：\n\
    \n```\ndata[++rear] = item;\n```\n\n如果下一个操作是出队（dequeue），则应该返回 10 然后将 `front` 加\
    \ 1：\n\n![image](img/091x001.png)\n\n因此，出队的代码为：\n\n```\nreturn data[front++];\n\
    ```\n\n### 问题：漂移（Drift）\n\n这个基本思想的问题在于队列在数组中逐渐向右移动。即使队列中的元素始终没有超过几个，如果有频繁的入队和出队，队列最终会超出数组的末尾：\n\
    \n![image](img/091x002.png)\n\n如果数组很大，将队列元素移回数组开头将花费大量时间，而仅仅为了少数几个元素而增加数组大小又是浪费的。更好的解决方案是让数组支持环绕（wrap\
    \ around）。\n\n### 循环数组\n\n循环数组是环形的，因此对最后一个索引的增加会回到第一个索引：\n\n![image](img/091x003.png)\n\
    \n在上面的示例中，这意味着“增加”6 会得到 0 而不是 7。\n\n取模运算符 `%` 很好地处理了这一点：\n\n```\n(6 + 1) % 7 =\
    \ 7 % 7 = 0\n```\n\n因此，在循环数组中递增的通用代码为：\n\n```\nvar = (var + 1) % array.length\n\
    ```\n\n这将是队列中的常用操作，因此保留一个存储数组当前长度的容量实例变量可能是值得的。那么，更新 `front` 和 `rear` 变为：\n\n\
    ```\nrear = (rear + 1) % capacity;\n```\n\n```\nfront = (front + 1) % capacity;\n\
    ```\n\n修改基本操作：\n\n```\ndata[++rear] = item; // 入队\n```\n\n```\nreturn data[front++];\
    \ // 出队\n```\n\n使用循环递增代替 `++` 将解决漂移问题。\n\n### 调整循环数组的大小\n\n在解决一个问题的同时，我们创建了另一个问题：调整大小现在必须考虑循环性。为了理解这个问题，假设一个队列已经使用了一段时间，按顺序队列了元素\
    \ 10, 20, . . . 50，现在它已满：\n\n![image](img/092x001.png)\n\n如果按照数组栈相同的方式调整大小（参见\
    \ Listing 3.2），那么结果将是：\n\n![image](img/092x002.png)\n\n这将行不通：队列期望 40 紧跟在 30 之后（在循环数组中是如此），尽管有空位，但在队列末尾之后没有空间（即元素\
    \ 50 之后）。因此，我们需要更改调整大小的方法，使队列的头部回到 0 槽位：\n\n![image](img/092x003.png)\n\n这看起来写起来很复杂，但只要组织得当，并不太坏。其思想是用一个变量\
    \ `i` 遍历新数组位置，同时更新第二个变量 `j`，它遍历旧的循环数组。Listing 5.1 概述了这种方法。注意在其中 for 循环如何更新 `i`，而\
    \ `j` 在循环内部为旧循环数组进行更新。\n\nListing 5.1: 调整循环数组（伪代码）\n\n```\n1 j = front\n```\n\n\
    ```\n2 for i = 0 to size - 1\n```\n\n```\n3 newData[i] = data[j]\n```\n\n```\n\
    4 j = (j + 1) % capacity\n```\n\n```\n5 Update front, rear, capacity, data\n```\n\
    \n练习要求你完成此实现以及 `ArrayQueue<E>` 类的其余。\n\n### 练习\n\n1. 解释在基本数组队列操作中使用前置和后置递增运算符的作用：\n\
    \n```\ndata[++rear] = item; // 入队\n```\n\n```\nreturn data[front++]; // 出队\n```\n\
    \n2. 确定数组队列 `front` 和 `rear` 索引的正确起始值。解释你的答案。\n\n3. 在队列的循环数组实现中：\n    1. (a) 解释为什么这个关系对于空队列和满队列都成立：\n\
    \      ```\n      (rear + 1) % capacity == front\n      ```\n    2. (b) 如果没有存储队列中项数量的\
    \ `size` 实例变量，你会如何区分空队列和满队列？概述一个策略。\n\n4. 引入循环数组部分是为了避免通过移动元素将队列重新定位到数组开头。然而，由于循环性的存在，这正是\
    \ `resize()` 方法所做的。这是一个问题吗？换句话说，使用 Listing 5.1 调整大小会影响队列的性能吗（相对于数组栈）？请解释原因。\n\n\
    5. 开发 `ArrayQueue<E>` 类，使用上述的循环数组，实现以下方法：\n    1. (a) `dequeue()`：如果队列为空，抛出 `NoSuchElement`\
    \ 异常（见 71 页）。\n    2. (b) `enqueue()`：如果队列满，将数组大小翻倍。\n    3. (c) `isEmpty()`：\n\
    \    4. (d) `peek()`：如果队列为空，抛出 `NoSuchElement` 异常。\n    5. (e) `size()`：包含一个 `size`\
    \ 变量并在需要时更新它。\n    6. (f) `resize()`：实现 Listing 5.1。\n    7. (g) 两个构造函数：一个默认的，另一个接收初始容量。默认构造函数应该调用\
    \ `this()`。\n\n6. 在 `ArrayQueue<E>` 类中添加 `main()` 方法，使用以下类型测试队列：\n    1. (a) 整数\n\
    \    2. (b) 双精度浮\n    3. (c) 字符串\n\n7. 确定 ArrayQueue 操作的 O() 时间复杂度。解释你的答案。\n \
    \   1. (a) `dequeue()`\n    2. (b) `enqueue()`：忽略调整大小。\n    3. (c) `isEmpty()`\n\
    \    4. (d) `peek()`\n    5. (e) `size()`\n\n## 5.3 继承：固定长度队列\n\n队列出现在有趣的地方，并不总是软件。例如，硬件队列是数据速率变化的系统中的常见组件：队列允许数据在处理器准备好之前聚集。\n\
    \n图形处理器单元（GPU）采用流水线架构，你可以将其想象为由流水线连接的阶段：\n\n![image](img/095x001.png)\n\n图形数据通过这些流水线移动，每个阶段都有\
    \ FIFO 队列以防止某个阶段无法跟上输入而导致阻塞。\n\n硬件队列也用于网络路由器，在处理之前保留传入的数据包。由于丢弃数据包很重要，路由器通常还有其他机制来处理满硬件队列。\n\
    \n在本节中，我们开发一个固定长度队列来模拟具有固定最大容量的队列。\n"
- fmt: "\nThis means that the `Number` class, which we have not seen yet, captures\
    \ common state and behavior of all of the numeric wrapper classes, as well as\
    \ other numeric classes.\n\nIn fact, every Java class inherits from the `Object`\
    \ class, either directly or indirectly. In other words, the `Object` class is\
    \ at the root of the entire inheritance hierarchy. We will return to the role\
    \ of the `Object` class at the end of this section.\n\n### Is-A and Has-A Relationships\n\
    \nInheritance models an is-a relationship:\n\n- A `Double` is a `Number`\n- A\
    \ `Number` is an `Object`\n- A `FixedLengthQueue` is a `Queue`\n\nAnother common\
    \ relationship is has-a, which is used when an object has a component of that\
    \ type:\n\n- An `ArrayQueue` has a `size`\n- A `Fraction` has a `numerator`\n\
    - An array has a `length`\n\nHas-a relationships are modeled by composition, which\
    \ is simply using an instance variable to store the component. Deciding between\
    \ these two types of relationships is an important part of software design.\n\n\
    ### Implementation\n\nA fixed-length queue is close to an `ArrayQueue`, except\
    \ that the size of its underlying array should never change. Thus, we implement\
    \ it in `Listing 5.2` as an extension of the `ArrayQueue` class. If an attempt\
    \ is made to enqueue when the queue is full, instead of resizing the array, the\
    \ item will be dropped and the queue will track the total number of dropped items.\n\
    \nListing 5.2: Fixed-Length Queue\n\n```java\n 1 public class FixedLengthQueue<E>\
    \ extends ArrayQueue<E> {\n 2 private int drops;\n 3\n 4 public FixedLengthQueue(int\
    \ capacity) {\n 5  super(capacity);\n 6}\n 7\n 8 @Override\n 9 public void enqueue(E\
    \ item) {\n10  if (size == capacity) {\n11  drops++;\n12 } else {\n13  super.enqueue(item);\n\
    14 }\n15 }\n16 \n17  public int drops() {\n18  return drops;\n19 }\n20}\n```\n\
    \n### Java Class Extensions\n\nThe `extends` clause is used to declare a new class\
    \ as a subclass of an existing class:\n\n```java\npublic class SubClass extends\
    \ SuperClass {...}\n```\n\nThe subclass then inherits the class members (fields,\
    \ methods, and nested classes) from the specified superclass. New instance variables\
    \ and methods may also be declared inside the subclass, as on line 2 and beginning\
    \ at line 17 of `Listing 5.2`.\n\nIf the superclass implements an interface, then\
    \ so does the subclass since it inherits the public members of the superclass.\n\
    \n### Subclass Constructors\n\nIf you write a constructor for a subclass, the\
    \ first thing it must do is call a constructor from the superclass using `super`:\n\
    \n```java\nsuper(arguments);\n```\n\nThe only time this is not required is if\
    \ the constructor is calling a different constructor of the subclass using `this()`.\
    \ The `super()` call in the constructor on line 5 assumes that a constructor with\
    \ an integer `capacity` parameter is part of the `ArrayQueue` class (see Exercise\
    \ 4).\n\n### Overriding Methods\n\nRedefining a method from the superclass in\
    \ a subclass is called overriding the method. In this case, the `enqueue()` method\
    \ is overridden beginning at line 9 in order to check the size before actually\
    \ enqueuing the item. The `@Override` annotation signals to the compiler and readers\
    \ that we intend to override an existing method rather than define a new one.\n\
    \nExisting superclass methods may be called inside the body of an overridden method\
    \ using `super`:\n\n```java\nsuper.method(arguments)\n```\n\nIn `Listing 5.2`,\
    \ once the `enqueue()` method has determined that the queue will not overflow,\
    \ the superclass method is called on line 13.\n\n### Protected Fields in the Superclass\n\
    \nOne other change (in addition to making sure there is a constructor with a capacity\
    \ parameter) needs to be made to the existing `ArrayQueue` superclass in order\
    \ for this subclass to compile. As it is, the subclass cannot use the instance\
    \ variables `size` and `capacity` because they were (or should have been) declared\
    \ `private` in `ArrayQueue`. Class members declared `private` cannot be used anywhere\
    \ outside of their class, even in a subclass.\n\nBecause it is reasonable for\
    \ a subclass to access some instance variables or internal methods, Java provides\
    \ a third visibility option, `protected`, for this situation. Protected class\
    \ members may be accessed by subclasses as well as the class itself, but not by\
    \ outside classes.\n\n### The Object Class\n\nTable 5.2 lists two of the most\
    \ important methods defined in the `Object` class. Because every class is an extension\
    \ of the `Object` class, every Java object—including arrays—inherits these methods,\
    \ along with others listed in the documentation.\n\nTable 5.2: Object Methods\n\
    \n| Method | Description |\n| :--- | :--- |\n| `boolean equals(Object o)` | True\
    \ if this object and `o` are the same object. |\n| `String toString()` | Returns\
    \ string representing this object. |\n\nThe default meaning of `equals()` for\
    \ `Objects` is the same as `==`, but classes may override `equals()` to define\
    \ their own notion of equality. The `toString()` method returns a string representation\
    \ of the object.\n"
