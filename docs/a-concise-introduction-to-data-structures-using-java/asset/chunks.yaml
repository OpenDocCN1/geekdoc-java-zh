    \n8. 使用“左孩子/右兄弟”约定，为以下每个二叉树画出对应的普通树：\n   1. (a)\n      ![image](img/141x003.png)\n\
    \   2. (b)\n      ![image](img/141x004.png)\n\n9. 画出一个一个具有五个节点的二叉树，使其在使用“左孩子/右兄弟”约定时，对应的普通树是其本身。\n\
    \n## 8.2 遍历\n\n回想，树有一个根节点和若干个孩子，每个孩子本身都是一个子树的根。这种递归结构——树由同样是树的子组件构建而成——导致了二叉树的递归遍历方法。与链表一样（参见第\
    \ 6.3 节），树的遍历是访问树中每个节点的方法。\n\n### 深度优先\n\n如果树是二叉树，那么有三种自然安排递归遍历步骤顺序的方法，取决于节点本身被访问的时机：\n\
    \n- **前序 (节点, 左, 右)** 先访问节点，再遍历左子树，最后遍历右子树。\n- **中序 (左, 节点, 右)** 先遍历左子树，访问节点，再遍历右子树。\n\
    - **后序 (左, 右, 节点)** 先遍历左子树，再遍历右子树，最后访问节点。\n\n访问节点仅指方法对每个节点需要执行的任何操作，例如打印、计数或修改节点。\n\
    \n这些遍历中的每一种都是深度优先的，因为它们在回溯到达其他节点之前，会一直向下遍历某个分支。深度优先遍历也可以定义于其他树，但我们将其范围限制在二叉树。\n\
    \n#### 示例\n\n考虑这棵二叉树：\n![image](img/142x001.png)\n\n通过手动操作，前序遍历可能是最简单的，因为当你到达每个子树时，节点首先被访问：\n\
    ![image](img/142x002.png)\n\n另一方面，中序遍历受益于自上而下的视图：\n![image](img/143x001.png)\n\
    \n如果你是从头到尾编写中序遍历而不是从上到下，那么你就需要跟踪子树何时完成。例如，在节点 54 之后，当 19 的左子树完成后，你需要记住访问节点 19。后序与中序相似，不同之处在于节点本身最后出现：\n\
    ![image](img/143x002.png)\n\n### 广度优先\n\n广度优先遍历按层访问节点：先访问第 1 层，然后是第 2 层，以此类推。与前序遍历一样，根节点在广度遍历中总是第一个被访问。广度遍历并不是自然递归的。事实上，相对于父节点之间存在的连接，广度遍历似乎在树中跳跃。\n\
    \n使用 `queue` 来跟踪下一个要访问的节点可以得到 Listing 8.1 中优秀的算法。由于在步骤 4 中可以入队任意数量的孩子，因此广度遍历算法可用于任何树。\n\
    \nListing 8.1: 广度优先遍历（伪代码）\n\n```\n1 入队根节点\n```\n```\n2 当队列为空\n```\n```\n3 出队并访问节点\n\
    ```\n```\n4 入队节点的孩子\n```\n\n#### 示例\n\n广度优先遍历手动操作非常简单，因为你只需要跨层追踪。要查看 Listing 8.1\
    \ 中的`queue` 是如何工作的，请考虑这棵小型二叉树：41\n![image](img/143x003.png)\n\n那么操作序列如下：\n\n|\
    \ 出队并访问 | 入队 | 队列内容 |\n| --- | --- | --- |\n| | 41 | 41 |\n| 41 | 32, 15 | 32,\
    \ 15 |\n| 32 | 40, 3 | 15, 40, 3 |\n| 15 | 8 | 40, 3, 8 |\n| 40 | | 3, 8 |\n|\
    \ 3 | | 8 |\n| 8 | | |\n\n#### 练习\n\n1. 描述三种递归深度优先遍历的基准情况（base case）。\n2. 在下面的树上使用每种遍历列出节点访问顺序：\n\
    \   ![image](img/144x001.png)\n   1. (a) 前序\n   2. (b) 中序\n   3. (c) 后序\n   4.\
    \ (d) 广度优先。如上例所示，使用 Listing 8.1 显示`queue`内容是如何变化的。\n3. 在下面的树上使用每种遍历列出节点访问顺序：\n\
    \   ![image](img/144x002.png)\n   1. (a) 前序\n   2. (b) 中序\n   3. (c) 后序\n   4.\
    \ (d) 广度优先。如上例所示，使用 Listing 8.1 显示`queue`内容是如何变化的。\n\n## 8.3 二叉树类\n\n回想，树有一个根节点和若干个孩子，每个孩子本身都是一个子树的根。这种递归结构——树由同样是树的子组件构建而成——导致了二叉树的递归遍历方法。与链表一样（参见第\
    \ 6.3 节），树的遍历是访问树中每个节点的方法。\n\n作为在第 9 章中实现二叉树的准备，本节开发了一个通用的 `BinaryTree` 类来表示任何树。它定义了任何树共有的基本结构：根节点、节点结构和遍历方法。然而，它将不会用于创建对象；它仅设计用于供\
    \ `BinarySearchTree` 等特定类扩展。\n\n表 8.1 给出了 `BinaryTree` 类的公共 API。（由于 `BinaryTree`\
    \ 是类而不是接口，我们不将其视为抽象数据类型。）`toString()` 方法也将被重写以返回这些遍历之一。\n\n表 8.1\n\n二叉树 API\n\
    | |\n| `String breadthFirst()` | 返回广度优先遍历。 |\n| `String inorder()` | 返回中序遍历。 |\n\
    | `String preorder()` | 返回前序遍历。 |\n| `String postorder()` | 返回后序遍历。 |\n\n### 抽象类\n\
    \nJava 抽象类正用于此类目的：提供类实现的一部分而非完整实现。抽象类不能创建对象；只能通过继承进行扩展。声明抽象类的语法是在类定义中包含 `abstract`\
    \ 关键字作为修符：\n\n```java\npublic abstract class AbstractClass {...}\n```\n\n抽象类可以是泛型的并包含类型参数。它们可以定义字段、方法和构造函数，尽管构造函数通常声明为\
    \ `protected`，因为它们不打算被直接调用。事实上，`protected` 可见性在抽象类中很常见，因为它们被设计用于扩展。\n\n### 二叉树类\n\
    \nListing 8.2 作为抽象类开始实现 `BinaryTree`。注意它对三个级别可见性的使用。`root` 和 `Node` 类（以及 `Node`\
    \ 类的组件）是 `protected` 的，以便子类可以使用。`preorder()` 方法是公共接口的一部分，并作为调用私有递归函数的封装器。即使是子类也没有需要知道该私有递归函数。\n\
    \n"
- fmt: "\nAlso notice how `toString()` is used in [Listing 8.2](#K20431_C008.xhtml_lis8.2).\
    \ The `Node` class overrides `toString()`, returning `data.toString()` on line\
    \ 24. Once this method has been written, nodes can be inserted into string expressions\
    \ with ease, as on line 10 of the recursive `preorder()` method. This allows other\
