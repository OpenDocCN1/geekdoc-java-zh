    \ 写一个泛型 Java 接口 `List<E>`。\n\n5.  假设 `ArrayList<E>` 实现了练习题 4 中的 `List<E>` 接口。\n\
    \n    1.  (a) 编写 Java 代码声明并创建一个整数数组列表 `items`，然后向 `items` 添加从 0 到 9 的值（按该顺序），以便它们以递增顺序存储。\n\
    \n    2.  (b) 编写 Java 代码声明并创建一个整数数组列表 `items`，然后向 `items` 添加从 0 到 9 的值（按该顺序），以便它们以递减顺序存储。\n\
    \n6.  描述如何使用 `List` ADT 实现栈（stack）的 `push` 和 `pop` 操作，并尽可能避免移动元素。如果无法避免移动，请解释原因。\n\
    \n7.  描述如何使用 `List` ADT 实现队列（queue）的 `enqueue` 和 `dequeue` 操作，并尽可能避免移动元素。如果无法避免移动，请解释原因。\n\
    \n## 6.2 数组实现\n\n由于其对索引的强调，`List` ADT 的数组实现似乎是理所当然的。下面开发的 `add()` 方法说明了如何处理栈和队列中没有出现过的问题：检查索引以及为新项腾出空间。练习题要求你完成\
    \ `ArrayList` 的实现。\n\n### 索引检查\n\n根据设计，列表中的元素索引为 0 到当前大小减 1 的值。因此，`List` ADT 中每个带有索引参数的方法都应该检查索引是否有效。\n\
    \n### 移动\n\n在 ArrayList 中，有两种类型的移动：为 `add()` 中的新项腾出空间，以及为 `removeAt()` 产生的空隙。\n\
    \n```java\npublic void add(int index, E item) {\n    if (index < 0 || index >\
    \ size) {\n        throw new IndexOutOfBoundsException();\n    }\n    if (size\
    \ == data.length) {\n        resize(2 * data.length);\n    }\n    // 向右移动\n  \
    \  for (int i = size - 1; i >= index; i--) {\n        data[i] = data[i - 1];\n\
    \    }\n    data[index] = item;\n    size++;\n}\n\npublic void add(E item) {\n\
    \    add(size, item);\n}\n\npublic E removeAt(int index) {\n    if (index < 0\
    \ || index >= size) {\n        throw new IndexOutOfBoundsException();\n    }\n\
    \    E item = data[index];\n    // 向左移动\n    for (int i = index; i < size - 1;\
    \ i++) {\n        data[i] = data[i + 1];\n    }\n    data[--size] = null;\n  \
    \  return item;\n}\n```\n\n### 练习题\n\n1.  解释 `add()` 方法在 `index` 等于 `size` 时是如何工作的，即向列表末尾添加。\n\
    \n2.  通过编写这些方法开发 `ArrayList<E>`：\n\n    1.  (a) `add(item)`：如果数组满了，将其长度翻倍。\n\n\
    \    2.  (b) `get()`\n\n    3.  (c) `indexOf()`：使用线性查找查找项。\n\n    4.  (d) `isEmpty()`\n\
    \n    5.  (e) `removeAt()`：将过时的引用设置为 `null`。\n\n    6.  (f) `set()`\n\n3.  练习\
    \ 2a 有两种编写方式，要么从头开始，要么调用 `add()` 方法。写出这两个版本并讨论差异。\n\n4.  修改练习 2e 中的 `removeAt()`\
    \ 方法，如果元素数量小于数组长度的四分之一，则将长度减半，但不要让长度小于 10。\n\n5.  在 `ArrayList` 类中重写 `toString()`\
    \ 方法，调用每个元素的 `toString()` 方法并将结果积累到 `StringBuilder` 中。\n\n6.  在上一个练习中，解释如果列表是泛型的，如何对每个列表项调用\
    \ `toString()`。\n\n7.  在 `ArrayList` 类中添加一个 `main()` 方法，使用以下内容测试列表：\n\n    1.\
