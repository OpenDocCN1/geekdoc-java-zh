  trans: "\n然而，结合性仅适用于具有相同优先级的运算符。在没有指定括号的情况下，首先使用运算符优先级来确定操作顺序。这些遵循标准的数学规则，因此乘法和除法的优先级高于加法和减法。请参阅\
    \ Java 文档以获取完整的优先级和结合性规则。\n\n因此，Java 中表达式的最终操作顺序是通过按顺序应用这些规则来决定的：\n\n1. 括号\n2.\
    \ 运算符优先级\n3. 相同优先级的运算符之间的结合性\n\n### 前缀、中缀和后缀\n\n奇怪的是，上述关于括号、运算符优先级和结合性的规则之所以存在，是因为我们倾向于以中缀形式编写二元运算。另外两种形式——前缀和后缀——是完全没有歧义的，并且不需要上述任何额外规则。\n\
    \n考虑简单的二元运算 `a + b`。等价的前缀和后缀形式如表 4.4 所示。我们的目标是熟悉前缀和后缀表示，以便开发一种使用栈求中缀表达式值的算法。\n\
    \n#### 表 4.4：运算符符号\n\n| 前缀 | `+ a b` | 运算符在前 |\n| :--- | :--- | :--- |\n| 中缀 |\
    \ `a + b` | |\n| 后缀 | `a b +` | 运算符在后 |\n\n#### 示例\n\n在手动翻译前缀或后缀表达式时，首先识别简单的组件（一个运算符和两个操作数）会有帮助，然后从那里开始构建。\n\
    \n例如，考虑将此前缀表达式转换为中缀：\n\n```\n - / + a b c * d + e f\n```\n\n从寻找简单的前缀组件（运算符 操作数\
    \ 操作数）开始：\n\n![image](img/f0076-01.png)\n\n现在将方框视为操作数并重复该过程：\n\n![image](img/f0076-02.png)\n\
    \n在这个阶段，我们得到了一个（大的）简单表达式，它可以被翻译为中缀：\n\n![image](img/f0076-03.png)\n\n向向内处理，将每个方框翻译为中缀：\n\
    \n![image](img/f0076-04.png)\n\n注意，当你写出中缀表达式时，某些方框必须用括号括以传递正确的表达式：\n\n```\n(a\
    \ + b) / c - d * (e + f)\n```\n\n### 后缀求值算法\n\n人们可以用类似的方法手动求后缀表达式的值，列表 4.4 使用栈来保存操作数以及最终结果，系统化了该过程。我们假设所有操作数都是整数。\n\
    \n**列表 4.4：求后缀（伪代码）**\n\n```\n1 遍历表达式中的每个项\n2 如果项是运算符\n3  弹出第二个操作数\n4  弹出第一个操作数\n\
    5  对操作数应用运算符并推送结果\n6 否则\n7  将操作数推入栈\n8 弹出结果\n```\n\n#### 示例\n\n为了查看列表 4.4 如何如何工作，请考虑后缀表达式：\n\
    \n```\n 3 5 1 - *\n```\n\n前三个项是操作数，因此它们被推入栈中：\n\n![image](img/f0077-01.png)\n\n\
    下一个项是运算符 `–`，我们遵循以下步骤：\n\n| 弹出第二个操作数 | Stack → 1 |\n| 弹出第一个操作数 | Stack → 5 |\n\
    | 对操作数应用运算符 | 5 |\n| 推送结果 | Stack 4 |\n\n注意操作数弹出的顺序：第二个操作数先出栈，是因为它们入栈的顺序顺序。现在栈的内容是：\n\
    \n![image](img/f0077-02.png)\n\n最后一项是 `*`：\n\n| 弹出第二个操作数 | Stack → 4 |\n| 弹出第一个操作数\
    \ | Stack → 3 |\n| 对操作数应用运算符 | 3 * 4 |\n| 推送结果 | Stack 12 |\n\n然后栈中包含了最终结果，准备好弹出：\n\
    \n![image](img/f0077-03.png)\n\n### 中缀转后缀算法\n\n列表 4.5 概述了一个将中缀转换为后缀的类似算法。它使用栈来保存运算符，由于第\
    \ 3 行和第 4 行的内部循环，比列表 4.4 稍微复杂。该算法假设没有括号。\n\n**列表 4.5：中缀转后缀（伪代码）**\n\n```\n1 遍历表达式中的每个项\n\
    2 如果项是运算符\n3  弹出所有相同或更高优先级的运算符\n4  并将每个运算符复制到输出\n5  将此运算符推入栈\n6 否则\n7  将操作数复制到输出\n\
    8 弹出剩余运算符并复制到输出\n```\n\n#### 示例\n\n给定中缀表达式\n\n```\n a + b / c - d\n```\n\n我们可以通过跟踪栈和累积的输出来追踪列表\
    \ 4.5。第一项 `a` 被复制到输出。第二项 `+` 被推入栈，第三项 `b` 被复制到输出。此时，我们有：\n\n![image](img/f0078-01.png)\n\
    \n下一个项是 `/`。栈顶的 `+` 优先级与当前项相同或更高，因此将其弹出并推入栈：\n\n![image](img/f0078-02.png)\n\n\
    `c` 被复制到输出，然后下一个项是 `-`：\n\n![image](img/f0078-03.png)\n\n在这种情况下，栈顶的 `/` 优先级与当前项相同或更高，因此将其弹出并复制到输出：\n\
    \n![image](img/f0079-01.png)\n\n此时栈为空，推入 `-`：\n\n![image](img/f0079-02.png)\n\n\
    d` 被复制到输出，栈中剩余的运算符被弹出并复制到输出：\n\n```\n 输出: a b c +\n```\n\n手动执行此算法最困难的部分是跟踪何时弹出运算符以及何时将其留在栈中。列表\
    \ 4.4 和 4.5 的结合为求中缀表达式提供了一个算法，我们将在下一节中开发。\n\n### 练习\n\n1. 查找这些运算符的优先级和结合性：`&&`、`++`、`<`。\n\
    2. 将这些前缀表达式转换为中缀和后缀：\n   - (a) `* + / b c d`\n   - (b) `/ - a * c e`\n   - (c)\
    \ `+ - a b c d`\n   - (d) `- a / b c e`\n3. 将这些后缀表达式转换为中缀和前缀：\n   - (a) `+ + /\
    \ /`\n   - (b) `+ * -`\n   - (c) `+ + / -`\n   - (d) `+ + + +`\n4. 将这些中缀表达式转换为前缀和后缀（不使用列表\
    \ 4.5，因为大部分有括号）：\n   - (a) `x + y + z * w - v`\n   - (b) `(x + y + z) * (w - v)\
    \ / u`\n   - (c) `x * y / (z - w + v)`\n   - (d) `(x - y) * (z + w) / (u + v)`\n\
    5. 求这些前缀表达式的值：\n   - (a) `+ 3 * / 4 2 - 6 1`\n   - (b) `/ - * + 1 3 5 6`\n   -\
    \ (c) `- 4 / + 1 3 2 7`\n   - (d) `* + 5 1 - 4 2 / 9 3`\n6. 展示列表 4.4 如何求这些后缀表达式的值，给出每一步的栈内容：\n\
    \   - (a) `1 6 4 5 * + 2 / -`\n   - (b) `6 5 * 3 + 4 2 / -`\n   - (c) `5 4 + 3\
    \ / 1 - 6 * 2`\n   - (d) `6 2 1 + / 9 1 -`\n7. 展示列表 4.5 如何将这些无括号表达式转换为后缀，给出每一步的栈内容：\n\
    \   - (a) `a + b + c + d`\n   - (b) `a + b * c - d + e`\n   - (c) `a * b + c *\
    \ d - e * f`\n   - (d) `a / b / c + d * e * f`\n"
- fmt: "\nThe `evalPostfix()` method is a little simpler than `toPostfix()`, and so\
    \ it will be outlined in the exercises. For `toPostfix()`, we first isolate the\
    \ task of determining an operator’s precedence.\n\n### Operator Precedence\n\n\
    One way to determine operator precedence is to define a rank function so that\n\
    \n$\\text{rank}(t) = \\left\\{ \\begin{array}{l} \\begin{array}{ll} 2 & {\\text{if}t\\\
    text{is}*\\text{or}/} \\\\ \\text{1} & {\\text{if}t\\text{is} + \\text{or} -}\
    \ \\end{array} \\\\ \\begin{array}{ll} {- 1} & \\text{otherwise} \\end{array}\
    \ \\end{array} \\right.$\n\nThen `rank(t) > rank(u)` means that `t` has higher\
    \ precedence than `u`, and `rank(t) = rank(u)` if `t` and `u` have the same precedence.\
    \ This `rank` function can also be used to determine whether a term is an operator\
    \ or operand, since only operators have rank greater than zero. Zero is reserved\
    \ for later use with parentheses (see Exercise 6).\n\nAs of Java 7, strings are\
    \ allowed as switch expressions, and so [Listing 4.6](#K20431_C004.xhtml_lis4.6)\
    \ uses that technique to implement the `rank` function.\n\nListing 4.6: Operator\
    \ Rank\n\n```java\n1 public class Expression {\n2 private static int rank(String\
    \ op) {\n3  switch (op) {\n4  case \"*\":\n5  case \"/\":\n6   return 2;\n7  case\
    \ \"+\":\n8  case \"-\":\n9   return 1;\n10   default:\n11   return -1;\n12 }\n\
    13}\n14}\n```\n\n### toPostfix() Implementation\n\n[Listing 4.7](#K20431_C004.xhtml_lis4.7)\
    \ uses the `rank()` function to implement the infix-to-postfix conversion algorithm\
    \ of [Listing 4.5](#K20431_C004.xhtml_lis4.5). It also uses the named constant\
    \ `SPACE` to help improve readability. Its code should be added to the `Expression`\
    \ class of [Listing 4.6](#K20431_C004.xhtml_lis4.6), in the same folder as your\
    \ stack implementations.\n\nMost of the code in the `toPostfix()` method should\
    \ look familiar: it is based on the pseudocode in [Listing 4.5](#K20431_C004.xhtml_lis4.5)\
    \ and has a structure much like the `acronym()` function in [Listing 1.4](#K20431_C001.xhtml_lis1.4),\
    \ using a loop over tokens in a string and a `StringBuilder` to efficiently accumulate\
    \ the result.\n\nListing 4.7: Infix to Postfix\n\n```java\n1 // Add to Expression\
    \ class\n2 private static final String SPACE = \" \";\n3\n4 public static String\
    \ toPostfix(String expr) {\n5 StringBuilder result = new StringBuilder();\n6 Stack<String>\
    \ operators = new ArrayStack<>();\n7 for (String token : expr.split(\"\\\\s+\"\
    )) {\n8  if (rank(token) > 0) {\n9    while (!operators.isEmpty() &&\n10     rank(operators.peek())\
    \ >= rank(token)) {\n11     result.append(operators.pop() + SPACE);\n12 }\n13\
    \   operators.push(token);\n14 } else {\n15  result.append(token + SPACE);\n16\
    \ }\n17 }\n18  while (!operators.isEmpty()) {\n19  result.append(operators.pop()\
    \ + SPACE);\n20 }\n21  return result.toString();\n22}\n```\n\n### Using Conditional\
    \ Boolean Expressions\n\nThe difficult step in [Listing 4.7](#K20431_C004.xhtml_lis4.7)\
    \ is the test in the while-loop on lines 9 and 10:\n\n```java\nwhile (!operators.isEmpty()\
    \ &&\nrank(operators.peek()) >= rank(token)) {...}\n```\n\nThe key to this expression\
    \ is its use of the conditional `&&` (AND), see page 4. The second half of the\
    \ `&&` is the main test:\n\n```java\nrank(operators.peek()) >= rank(token)\n```\n\
    \nIf the operator at the top of the stack has the same or higher precedence, it\
    \ needs to be popped, which happens in the body of the loop. The first part of\
    \ the expression protects the `peek()` in case the stack is empty: remember that\
    \ code using a stack is responsible for not peeking when the stack is empty.\n\
    \nBecause the `&&` is conditional, the second half is evaluated only if the first\
    \ half is true, in which case the stack is not empty.\n\n### evalPostfix() Implementation\n\
    \nThe algorithm to evaluate postfix is similar to the translation in `toPostfix()`,\
    \ and you will be asked to implement it in the exercises. To do that, you need\
    \ to convert operands to their value.\n\nTable 4.5 Integer Conversion Methods\n\
    \n| Method | Description |\n| --- | --- |\n| `static int parseInt(String s)` |\
    \ Converts string to integer. |\n| `static String toString(int n, int b)` | Converts\
    \ integer to string. |\n\nExercises\n\n1.  Explain why there are no `break` statements\
    \ in switch statement of [Listing 4.6](#K20431_C004.xhtml_lis4.6).\n2.  Add `isOperator()`\
    \ method to the `Expression` class that returns true if the operator is greater\
    \ than 0. Modify `toPostfix()` to use `isOperator()`.\n3.  Write an `applyOperator(operator,\
    \ op1, op2)` method that takes an operator with two operands and returns the value\
    \ of the binary computation. For example, `applyOperator(\"*\", 3, 7)` should\
    \ return 21. Use a `switch` statement, and assume all operands are integers.\n\
    4.  Write the `evalPostfix()` method for the `Expression` class. Use `applyOperator()`\
    \ from Exercise 7.\n5.  Modify Exercise 8 to perform exponentiation, using `Math.pow()`\
    \ to do the calculation. You will need to cast the result back to `int`.\n6. \
    \ Using Exercise 8, write an `eval()` method for the `Expression` class that evaluates\
    \ an infix expression by first converting it to postfix and then evaluating the\
    \ postfix. For example, `eval(\"1 + 2 * 3\")` should return 7.\n7.  A stack can\
    \ be used to determine whether an algebraic expression has properly balanced parentheses.\
    \ For example,\n\n    | Balanced | Not Balanced |\n    | --- | --- |\n    | (x\
    \ + y * (z − w)) | (x + y * (z − w) |\n    | ((x + (y)) * (z − w)) | x + y * (z\
    \ − w)) |\n\n    The idea is to scan each character in the expression, and if\
    \ the character is a left parenthesis, push it on the stack. If it is a right\
    \ parenthesis, then there should be a corresponding left parenthesis on the stack\
    \ to pop. All other characters can be ignored.\n\n    1.  (a) Write the algorithm\
    \ idea as pseudocode that returns true if the expression is balanced and false\
    \ otherwise.\n    2.  (b) Implement the parenthesis matching algorithm as a method\
    \ in the `Expression` class.\n    3.  (c) Extend the previous exercise to write\
    \ a different method in the `Expression` class that checks parentheses (), square\
    \ brackets [], and braces {}. Note that different types of parentheses need to\
    \ be properly nested: for example (x + y * [z − w]) is nested correctly, but (x\
    \ + y * [z − w)] is not.\n"
