  trans: "\n\n`Node` 类用于表示连接成链表的节点。一个典型的 `Node` 类仅包含两个字段：`data` 和 `next`，以及一个构造函数，如代码列表\
    \ 3.3 所示。\n\n代码列表 3.3: Node\n\n```\n1 public class Node {\n```\n```\n2 private\
    \ int data;\n```\n```\n3 private Node next;\n```\n```\n4\n```\n```\n5 public Node(int\
    \ data, Node next) {\n```\n```\n6  this.data = data;\n```\n```\n7  this.next =\
    \ next;\n```\n```\n8}\n```\n```\n9}\n```\n\n要实现一个栈（stack），我们只需要两种链表操作：从列表头部插入和从列表头部删除。\n\
    \n### 头部插入\n\n在链表头部插入新项需要三个步骤：\n\n1. 创建一个新节点：\n   ```\n    Node p = new Node(item,\
    \ null);\n   ```\n   ![image](img/f0058-02.png)\n\n2. 将新节点的 `next` 字段指向现有的第一个节点：\n\
    \   ```\n    p.next = head;\n   ```\n   ![image](img/f0059-01.png)\n\n3. 更新 `head`\
    \ 指向新节点：\n   ```\n    head = p;\n   ```\n   ![image](img/f0059-02.png)\n\n就是这样。按顺序查看这些步骤是有帮助的，但实际上我们可以将它们全部合并为一行代码。前两个步骤可以通过在构造函数中提供新节点的\
    \ `next` 字段来一次性完成：\n```\n Node p = new Node(item, head);\n```\n\n第三步改变了 `head`\
    \ 指向新节点，因此我们可以通过完全避免使用变量 `p` 的名称并直接将 `head` 指向新节点，来跳过这个独立步骤。因此，在链表头部插入新节点可以简化为一行代码：\n\
    ```\nhead = new Node(item, head);\n```\n\n赋值语句总是先求右侧表达式的值，然后将该值赋值左侧的变量。因此，新节点使用\
    \ `head` 的旧值作为其 `next` 字段进行创建，然后将新节点赋予 `head`。\n![image](img/f0059-03.png)\n\n\
    ### 头部删除\n\n删除链表头部的节点也是一步。只需更新 `head` 指向第二个节点即可：\n![image](img/f0060-01.png)\n\
    \n第二个节点通过 `head.next` 引用，因此代码为：\n```\nhead = head.next;\n```\n\n如果你需要从被删除的节点中恢复数据，那么这一操作必须在更改\
    \ `head` 指针之前完成。\n\n其他链表操作将在以后需要时进行讨论。\n\n### 链式实现\n\n代码列表 3.4 包含了链式栈的核心操作。练习题要求你完成它。\n\
    \n### 嵌套类\n\n由于 `IntLinkedStack` 类外部的代码没有理由感知节点，因此 `Node` 类定义在 `IntLinkedStack`\
    \ 的体内部。这使得 `Node` 类成为 `IntLinkedStack` 的一个嵌套类。嵌套类被视为其包含类的成员，就像字段和方法一样。通常，嵌套类也被声明为\
    \ `private`，因为它们是包含类的实现细节，类似于字段。嵌套类始终对其包含类可见（反之亦然），即使声明为 `private` 如此。\n\n`static`\
    \ 嵌套类无法访问包含类的实例变量。在代码列表 3.4 中，栈的唯一实例变量是 `top`，没有理由让每个节点都能访问栈顶。我们的大多数链式结构将使用 `static`\
    \ 嵌套节点类，但我们将在 6 章中看到非静态嵌套类的示例。\n\n### 空指针异常\n\n回想一下（参见第 22 页），尝试访问空引的字段或方法会产生\
    \ `NullPointerException`。由于 `p.next` 和 `p.next.next` 等表达式被频繁使用，链表代码特别容易出现空指针异常。\n\
    \n代码列表 3.4: 整数链式栈\n\n```\n 1 public class IntLinkedStack implements IntStack {\n\
    ```\n```\n 2 private Node top;\n```\n```\n 3\n```\n```\n 4 public void push(int\
    \ item) {\n```\n```\n 5  top = new Node(item, top);\n```\n```\n 6}\n```\n```\n\
    \ 7\n```\n```\n 8 public int pop() {\n```\n```\n 9  int result = top.data;\n```\n\
    ```\n10  top = top.next;\n```\n```\n11  return result;\n```\n```\n12}\n```\n```\n\
    13\n```\n```\n14 private class Node {\n```\n```\n15  private int data;\n```\n\
    ```\n16  private Node next;\n```\n```\n17\n```\n```\n18  private Node(int data,\
    \ Node next) {\n```\n```\n19  this.data = data;\n```\n```\n20  this.next = next;\n\
    ```\n```\n21}\n```\n```\n22}\n```\n```\n23}\n```\n\n"
- fmt: "\n```java\npublic interface InterfaceName<TypeParameter, ...> {...}\n```\n\
    \nor\n\n```java\npublic class ClassName<TypeParameter, ...> {...}\n```\n\nType\
    \ parameters are usually single capital letters, such as those in [Table 4.1](#K20431_C004.xhtml_Text_Anchor_tab4.1).\n\
    \nTable 4.1\nType Parameters\n\n| E | Element type in a collection |\n| :--- |\
    \ :--- |\n| K | Key in a key-value pair |\n| V | Value in a key-value pair |\n\
    | T, U, S | All-purpose |\n\nFor example,\n\n```java\npublic interface Map<K,\
    \ V> {...}\n```\n\ndefines a generic `Map` interface with two type parameters,\
    \ `K` and `V`.\n\n### Generic Stack ADT\n\nGeneric type parameters allow us to\
    \ define the generic Stack ADT in [Table 4.2](#K20431_C004.xhtml_Text_Anchor_tab4.2),\
    \ corresponding to the Integer Stack ADT in [Table 3.1](#K20431_C003.xhtml_Text_Anchor_tab3.1).\
    \ Most data structures use the `E` type parameter for elements in a collection.\n\
    \nTable 4.2\nStack ADT\n\n| | |\n| :--- | :--- |\n| `boolean isEmpty()` | Returns\
    \ true if stack has no elements in it. |\n| `E peek()` | Returns item at top of\
    \ stack without removing it. |\n| `E pop()` | Returns and removes item from top\
    \ of stack. |\n| `void push(E item)` | Adds item to top of stack. |\n| `int size()`\
    \ | Number of elements in stack. |\n\n### Type Parameters Inside Interface and\
    \ Class Definitions\n\nInside a generic class or interface definition, the type\
    \ parameter and the generic type itself may be used for declarations as if they\
    \ were regular types. (There is an important limitation with arrays that will\
    \ be addressed in the next section.) For example, [Listing 4.1](#K20431_C004.xhtml_lis4.1)\
    \ contains code for a generic `Node` class.\n\nListing 4.1: Generic Node\n\n```java\n\
    1 public class Node<T> {\n```\n```java\n2 private T data;\n```\n```java\n3 private\
    \ Node<T> next;\n```\n```java\n4\n```\n```java\n5 public Node(T data, Node<T>\
    \ next) {\n```\n```java\n6  this.data = data;\n```\n```java\n7  this.next = next;\n\
    ```\n```java\n8}\n```\n```java\n9}\n```\n\nBoth `T` and `Node<T>` are used as\
    \ types to declare variables inside the generic `Node` class.\n\n### Type Arguments\n\
    \nIn order to use a generic interface or class, a reference type must be specified\
    \ as a type argument for the type parameter. The type argument is then used as\
    \ the value of the type parameter.\n\nFor example, using the `Node` class above,\
    \ we can write:\n\n```java\nNode<String> p;\n```\n\nto declare a reference to\
    \ a `Node` that stores a string. In this case, `String` is supplied as the type\
    \ argument for the type parameter `T`. This is exactly analogous to providing\
    \ arguments to method parameters, except that types are involved.\n\n**Warning:**\
    \ Type arguments must be reference types; they cannot be primitive. To store primitive\
    \ data in a generic type, the corresponding wrapper class must be used.\n\n###\
    \ Wrapper Classes\n\nEvery primitive type has an associated class known as its\
    \ wrapper class, listed in [Table 4.3](#K20431_C004.xhtml_Text_Anchor_tab4.3).\
    \ The idea is that the primitive is “wrapped” in an object of the wrapper class\
    \ type. Wrapper objects also provide many convenience methods for working with\
    \ their values; see the Java API [[10]](#K20431_bib.xhtml_ref_10) for details.\n\
    \nTable 4.3\nWrapper Classes\n\n| Primitive Type | Wrapper Class |\n| :--- | :---\
    \ |\n| byte | Byte |\n| short | Short |\n| char | Character |\n| int | Integer\
    \ |\n| long | Long |\n| float | Float |\n| double | Double |\n| boolean | Boolean\
    \ |\n\nSince primitive types cannot be used as generic type arguments, the corresponding\
    \ wrapper class must be used instead:\n\n```java\nNode<int> p;  // incorrect --\
    \ int is not a reference type\n```\n```java\nNode<Integer> p;  // correct\n```\n\
    \nAlthough working with primitive types and wrapper classes can be awkward at\
    \ times, Java attempts to make it as convenient as possible via automatic boxing\
    \ and unboxing.\n\n### Automatic Boxing and Unboxing\n\nIf you use a primitive\
    \ value where a corresponding wrapper object is expected, Java will automatically\
    \ box the primitive in an object; similarly, it will automatically unbox a wrapped\
    \ object to a primitive when necessary.\n\nFor example, if `p` refers to a `Node<Integer>`\
    \ and `x` has type `int`, then Java automatically handles the conversions between\
    \ the `Integer p.data` and the `int x`:\n\n```java\np.data = x;  // x is automatically\
    \ boxed\n```\n```java\nx = p.data;  // p.data is automatically unboxed\n```\n\n\
    Casting can also be used to explicitly box or unbox.\n\n### Creating Generic Objects\n\
    \nBeginning with Java 7, the diamond operator `<>` is used with `new` to create\
    \ all generic objects:\n\n```java\nreferenceVariable = new ClassName<>(arguments);\n\
    ```\n\nIn other words, the type argument is not specified when creating objects,\
    \ only when declaring the type of the reference variable.\n\nFor example, the\
    \ following creates an integer node referenced by `p`:\n\n```java\nNode<Integer>\
    \ p = new Node<>(item, null);\n```\n\nEarlier versions of Java require that you\
    \ also specify the type argument (in this case, `Integer`) inside the diamond.\n\
    \n### Exercises\n\n1. Write a generic interface `Queue<E>` with two methods: `enqueue`\
    \ that takes a parameter of `E`, and `dequeue` with no parameters that returns\
    \ an element of `E`.\n2. Suppose `ArrayQueue<E>` implements `Queue<E>` from Exercise\
    \ 1. Write a Java statement to declare and create array queue `q` that contains\
    \ strings.\n3. Write a generic interface `Map<K, V>` with two methods: `put` that\
    \ takes parameters of type `K` and `V`, and `get` that takes a parameter of type\
    \ `K` and returns an item of type `V`.\n4. Suppose `LinkedMap<K, V>` implements\
    \ `Map<K, V>` from Exercise 3. Write a Java statement to declare and create linked\
    \ map `m` that uses string keys and integer values.\n5. Write a generic interface\
    \ `Stack<E>` for the generic Stack ADT in [Table 4.2](#K20431_C004.xhtml_Text_Anchor_tab4.2).\n\
    6. Suppose `ArrayStack<E>` implements `Stack<E>` from Exercise 5.\n    - (a) Write\
    \ a Java statement to declare and create array stack operands. Use the interface\
    \ to declare the type.\n    - (b) Write a Java statement to declare and create\
    \ integer stack operands. Use the interface to declare the type.\n    - (c) Write\
    \ Java code to declare and create integer stack `s`, and then push the values\
    \ 0 through 9 onto it.\n7. Suppose `s` is declared as `Stack<Integer>` using the\
    \ interface from Exercise 5. Determine whether or not there is automatic boxing\
    \ or unboxing in this code:\n```java\nfor (int i = 0; i < 100; i++) {\n    s.push(i);\n\
    }\n```\n8. Use the generic `Node` class in [Listing 4.1](#K20431_C004.xhtml_lis4.1)\
    \ to:\n    - (a) Declare and create an integer node `p` containing the value 34.\n\
    \    - (b) Declare and create a string node `q` containing the value “Java.”\n\
    \    - (c) Build a linked list of doubles pointed to by `head` containing the\
    \ values 3.14, 2.72, and 0.58.\n"
