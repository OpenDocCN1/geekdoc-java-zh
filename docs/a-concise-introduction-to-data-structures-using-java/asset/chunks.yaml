  trans: "\n\n7. 使用 `LinkedMap` 类中的 `remove()` 方法在 `LinkedHashMap` 类中实现可选的 `remove()`\
    \ 方法（参考 11.1 节中的练习 8）。\n\n8. 给出链地址法哈希表中删除元素的预期性能。\n\n## 11.4 线性探测\n\n哈希表中链地址法的替代方案是将所有条目存储在数组本身。这种方法被称为开放寻址（open\
    \ addressing）。在开放寻址中，当新元素的哈希值指向表中已填充的位置时，就会发生冲突。在这种情况下，会生成一个其他表槽的探测序列，并将新元素存储在探测序列找到的第一个空槽中，该位置在数组中用\
    \ `null` 值表示：\n\n![image](img/196x001.png)\n\n查找键遵循相同的路径：从哈希位置开始，然后使用相同的探测序列，直到找到该键或找到空槽为止。\n\
    \n### 线性探测\n\n对于大小为 `M` 的表，线性探测生成的探测序列由函数给出\n\n`i -> (i + 1) mod M`\n\n这对应于每次探测只需向右移动一个槽，必要时会绕回数组开头。\n\
    \n#### 示例\n\n如果将键 `14`、`77` 和 `32` 插入大小为 `11` 的哈希表，结果如下（为了简单起见显示了原始类型）：\n\n![image](img/196x002.png)\n\
    \n如果下一个键是 `66`，它也会哈希到 `0` 并导致冲突。使用线性探测，右侧第一个空槽是 `1`，`66` 存储在那里：\n\n![image](img/196x003.png)\n\
    \n如果下一个键是 `54`，它哈希到 `10`，它的下一个空闲位是索引 `2`：\n\n![image](img/196x004.png)\n\n注意键的聚类（cluster）倾向；这是线性探测的主要优缺点之一之一。\n\
    \n### 实现\n\n与 `LinkedMap` 的实现一样，静态嵌套类 `Entry<K, V>` 对于在使用开放寻址的哈希表中存储键值对非常有用。一个生成探测序列的独立\
    \ `probe(i)` 函数也有助于方便地更改到不同的探测方法。\n\nListing 11.1 概述了使用线性探测向哈希表插入的方法。它忽略了会强制 `λ\
    \ ≥ 1` 的条目。\n\n列表 11.1: 线性探测插入（伪代码）\n\n```\n1 If room in table\n```\n\n```\n2\
    \ Hash key\n```\n\n```\n3 While entry not null and not equal key\n```\n\n```\n\
    4 Probe to next entry\n```\n\n```\n5 If entry is null insert new entry\n```\n\n\
    ```\n6 Else update old entry\n```\n\n### 性能\n\n线性探测的性能分析比我们目前为止考虑过的任何内容都要复杂得多。我们将简单给出结果；感兴趣的读者可能会在\
    \ Knuth [[9]](#K20431_bib.xhtml_ref_9) 中找到原始论证。Sedgewick 和 Wayne [[12]](#K20431_bib.xhtml_ref_12)\
    \ 为这些计算提供了直观解释。\n\n要分析任何开放寻址方案，我们需要估计查找或插入所需的探测次数。由于我们正在使用开放寻址，负载因子 `λ` 必须小于 1；参见练习\
    \ 6 和 7。\n\n**失败查找** 失败查找会继续探测，直到找到一个 `null` 表条目。假设哈希函数均匀地分布键，失败查找的平均探测次数约为\n\n\
    $\\frac{1}{2}\\left( {1 + \\frac{1}{{(1 - \\lambda)}^{2}}} \\right)$\n\n**成功查找**\
    \ 成功查找遵循插入该元素时使用的相同路径。然而，该元素可能很早插入，路径很短，也可能很晚插入，路径很长。在这种情况下，平均探测次数约为\n\n$\\frac{1}{2}\\\
    left( {1 + \\frac{1}{1 - \\lambda}} \\right)$\n\n**插入** 插入元素需要在哈希处理后在探测序列中查找第一个空槽。这与失败查找是相同的，因此平均探测次数再次约为\n\
    \n$\\frac{1}{2}\\left( {1 + \\frac{1}{{(1 - \\lambda)}^{2}}} \\right)$\n\n###\
    \ 删除\n\n从开放寻址的表中删除元素是有问题的。为了了解为什么，请考虑第 196 页中按顺序 `14`、`77`、`32`、`66`、`54` 插入元素创建示例：\n\
    \n![image](img/198x002.png)\n\n现在假设删除 `77` 并我们查找 `54`。查找将从槽 `10` 开始，在槽 `0` 找到\
    \ `null`，因此失败。问题在于项可能会影响比被删除元素之后插入的其他元素的探测序列。\n\n处理这个问题的方法有很多，但没有完美的。一种方案是使用特殊的删除条目，查找可以将其与\
    \ `null` 区分开。另一种方案是重新哈希任何查找受删除影响的元素（参见 Listing 11.2 和练习 16）。然而，在大多数情况下，如果删除操作很重要，那么更好的解决方案是使用特殊的删除条目。\n\
    \n列表 11.2: 线性探测删除（伪代码）\n\n```\n1 Find index containing entry\n```\n\n```\n2 Delete\
    \ entry\n```\n\n```\n3 While entry is not null\n```\n\n```\n4 Probe to next entry\n\
    ```\n\n```\n5 Rehash it\n```\n\n### 其他探测序列\n\n线性探测有几种替代方案；其中最有用的之一被称为双哈希（double\
    \ hashing）。双哈希的想法是使用第二个哈希函数 `h(k)` 来确定步长，而不是总是取步长为 1。对于双哈希，`k` 的探测序列为：\n\n`i +\
    \ j * h(k) mod M`\n\n在这里 `h(k)` 与 `M` 互质很重要。\n\n### 练习\n\n1. 使用 `LinkedMap` 类中的\
    \ `remove()` 方法在 `LinkedHashMap` 类中实现可选的 `remove()` 方法（参考 11.1 节中的练习 8）。\n\n2.\
    \ 给出链地址法哈希表中删除元素的预期性能。\n\n3. 显示向大小为 `11` 的哈希表中键 `14`、`77` 和 `32` 的结果。\n\n4. 如果下一个键是\
    \ `66`，它也会哈希到 `0` 并导致冲突。使用线性探测，右侧第一个空槽是 `1`，`66` 存储在那里。\n\n5. 如果下一个键是 `54`，它哈希到\
    \ `10`，它的下一个空闲位是索引 `2`。\n\n6. 注意键的聚类倾向；这是线性探测的主要优缺点之一。\n\n7. 与 `LinkedMap` 的实现一样，静态嵌套类\
    \ `Entry<K, V>` 对于在使用开放寻址的哈希表中存储键值对非常有用。一个生成探测序列的独立 `probe(i)` 函数也有助于方便地更改到不同的探测方法。\n\
    \n8. Listing 11.1 概述了使用线性探测向哈希表插入的方法。它忽略了会强制 `λ ≥ 1` 的条目。\n\n9. 线性探测的性能分析比我们目前为止考虑过的任何内容都要复杂得多。我们将简单给出结果；感兴趣的读者可能会在\
    \ Knuth [[9]](#K20431_bib.xhtml_ref_9) 中找到原始论证。Sedgewick 和 Wayne [[12]](#K20431_bib.xhtml_ref_12)\
    \ 为这些计算提供了直观解释。\n\n10. 要分析任何开放寻址方案，我们需要估计查找或插入所需的探测次数。由于我们正在使用开放寻址，负载因子 `λ` 必须小于\
    \ 1；参见练习 6 和 7。\n\n11. **失败查找** 失败查找会继续探测，直到找到一个 `null` 表条目。假设哈希函数均匀地分布键，失败查找的平均探测次数约为\n\
    \n    $\\frac{1}{2}\\left( {1 + \\frac{1}{{(1 - \\lambda)}^{2}}} \\right)$\n\n\
    12. **成功查找** 成功查找遵循插入该元素时使用的相同路径。然而，该元素可能很早插入，路径很短，也可能很晚插入，路径很长。在这种情况下，平均探测次数约为\n\
    \n    $\\frac{1}{2}\\left( {1 + \\frac{1}{1 - \\lambda}} \\right)$\n\n13. **插入**\
    \ 插入元素需要在哈希处理后在探测序列中查找第一个空槽。这与失败查找是相同的，因此平均探测次数再次约为\n\n    $\\frac{1}{2}\\left(\
    \ {1 + \\frac{1}{{(1 - \\lambda)}^{2}}} \\right)$\n\n14. **删除** 从开放寻址的表中删除元素是有问题的。为了了解为什么，请考虑第\
    \ 196 页中按顺序 `14`、`77`、`32`、`66`、`54` 插入元素创建示例：\n\n15. 假设 `77` 被删除并我们查找 `54`。查找将从槽\
    \ `10` 开始，在槽 `0` 找到 `null`，因此失败。问题在于项可能会影响比被删除元素之后插入的其他元素的探测序列。\n\n16. 处理这个问题的方法有很多，但没有完美的。一种方案是使用特殊的删除条目，查找可以将其与\
    \ `null` 区分开。另一种方案是重新哈希任何查找受删除影响的元素（参见 Listing 11.2 和练习 16）。然而，在大多数情况下，如果删除操作很重要，那么更好的解决方案是使用特殊的删除条目。\n\
    \n17. **其他探测序列** 线性探测有几种替代方案；其中最有用的之一被称为双哈希。双哈希的想法是使用第二个哈希函数 `h(k)` 来确定步长，而不是总是取步长为\
    \ 1。对于双哈希，`k` 的探测序列为：\n\n    `i + j * h(k) mod M`\n\n    在这里 `h(k)` 与 `M` 互质很重要。\n\
    \n18. 使用线性探测向大小为 `11` 的哈希表中插入键 `14`、`77` 和 `32` 的结果。\n\n19. 如果下一个键是 `66`，它也会哈希到\
    \ `0` 并导致冲突。使用线性探测，右侧第一个空槽是 `1`，`66` 存储在那里。\n\n20. 如果下一个键是 `54`，它哈希到 `10`，它的下一个空闲位是索引\
    \ `2`。\n\n"
- fmt: "\n12. Write a `main()` method for the `LinearProbeHashMap` class that creates\
    \ a hash table, puts some values in the table, and looks them up.\n\n13. Explain\
    \ why the values of the second hash function should be relatively prime to the\
    \ table size `M` for double hashing. Hint: try some examples that are not relatively\
    \ prime to see what happens.\n\n14. Explain why values of the suggested second\
    \ hash function\n```\nh(k) = 1 + (k mod (M − 1))\n```\nare guaranteed to be relatively\
    \ prime to `M` if `M` is prime.\n\n15. Array-based implementations of stacks,\
    \ queues, and lists simply copied their contents into a larger array when their\
    \ capacity was exceeded.\n\n    1. (a) Explain why this basic strategy does not\
    \ work for a hash table using open addressing.\n    2. (b) Describe a strategy\
    \ that does work.\n\n16. Both chaining and open addressing require extra memory\
    \ beyond what the entries themselves use. Compare the extra space required for\
    \ a hash table using chaining with a table using linear probing. Does one method\
    \ have a clear advantage? Explain your reasoning.\n\n17. Implement the optional\
    \ `remove()` method in the `LinearProbeHashMap` class. Use the strategy described\
    \ earlier and outlined in [Listing 11.2](#K20431_C011.xhtml_lis11.2) of rehashing\
    \ entries whose searches might be affected by the deletion. Be careful managing\
    \ the number of entries in the table.\n\n[1](#K20431_C011.xhtml_if11_1)If you\
    \ override `hashCode()`, be sure to adhere to its contract, as specified in the\
    \ Java API. In particular, if `equals()` declares that two objects are the same,\
    \ then they must return the same `hashCode()`.\n\n[2](#K20431_C011.xhtml_if11_2)Absolute\
    \ value is the obvious thing to try, but `Math.abs()` returns a negative value\
    \ for `Integer.MIN_VALUE`. Given how `int` values are represented, this problem\
    \ with absolute value is unavoidable, and so using the more complicated bit operation\
    \ is a better choice.\n\n# Bibliography\n\n[[1]](#K20431_C001.xhtml_iref_1) Ken\
