    \ nested classes. We will see one use for this later when creating linked structures.\n\
    \n### Visibility\n\nJava allows you to specify the visibility of a class and its\
    \ members with access modifiers. These modifiers control what other sections of\
    \ code are able to use the class or its members. If a class is declared `public`,\
    \ the class may be used by any other class. In general, a `public` class should\
