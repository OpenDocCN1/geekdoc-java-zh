    \ linked structures.\n\n### Visibility\n\nJava allows you to specify the visibility\
    \ of a class and its members with access modifiers. These modifiers control what\
    \ other sections of code are able to use the class or its members. If a class\
    \ is declared public, the class may be used by any other class. In general, a\
    \ public class should be stored in a file with the same name as the class.\n\n\
    For now, we will use two access modifiers for class members:\n\n| public | Available\
    \ anywhere the class is available. |\n\n| private | May only be accessed inside\
    \ the class itself. |\n\nProtected access will be discussed in [Section 5.3](#K20431_C005.xhtml_ch5.3);\
    \ package visibility will not be used in this text.\n\nThe primary use of private\
    \ visibility is to provide encapsulation for objects, giving them an outer shell\
    \ that other classes cannot break through. This allows each class to manage its\
    \ own objects by limiting other classes to using only publicly declared members.\n\
    \n### Declaring and Initializing Fields\n\nA field declaration is simply a variable\
    \ declaration inside the body of a class that is not contained in the body of\
    \ any method definition. For example, lines 2 and 3 of [Listing 1.5](#K20431_C001.xhtml_lis1.5)\
    \ define the two fields num and den in the Fraction class. Fields are normally\
    \ declared private so that other classes are forced to use public methods to access\
    \ class or object data.\n\nFields may be initialized at the time of declaration,\
    \ or they may be assigned values by a constructor. If not initialized, fields\
    \ are given a default value based on their type: generally, numeric types are\
    \ set to 0 and object references are null. The fields num and den are not initialized,\
    \ so they are given default values which will be reset by the constructor (see\
    \ below).\n\n### Writing Methods\n\nYou are already familiar with writing methods\
    \ in classes, although prior to this section, all of our methods have been static.\
    \ As described in [Section 1.1](#K20431_C001.xhtml_ch1.1), methods must declare\
    \ their return type and the type of their parameters. Each method may also declare\
    \ its own visibility with an access modifier.\n\nInside non-static methods, the\
    \ keyword this refers to the current object on which the method was called. Thus,\
    \ inside method bodies (including constructors), this syntax:\n\n```\nthis.fieldName\n\
    ```\n\nreferences a field rather than some other variable such as a parameter\
    \ or local variable. In lines 6 and 7 of [Listing 1.5](#K20431_C001.xhtml_lis1.5),\
    \ this allows the parameters of the constructor to have the same names as the\
    \ fields, instead of requiring the programmer to choose different names for the\
    \ parameters.\n\nFor example, in line 6:\n\n![image](image/028x001.png)\n\nthis.num\
    \ on the left refers to the field named num, whereas num on the right refers to\
    \ the parameter. This is generally the only time we reuse field names; otherwise,\
    \ there is a danger that the fields will be hidden by local variables or parameters.\
    \ There is no need to use this if there is no name conflict.\n\n### Writing Constructors\n\
    \nRecall from the previous section that constructors are used with new in order\
    \ to create new objects. Thus, the primary purpose of a constructor is to set\
    \ up new objects in a valid state, meaning that its fields have meaningful values.\
    \ In the case of the Fraction class, there are no natural default values for the\
    \ numerator and denominator, so values for the numerator and denominator must\
    \ be specified when the fraction is created. Thus, instead of using field initializers,\
    \ we write constructors to provide convenient means for fraction objects to be\
    \ created.\n\nConstructors always have the same name as the class and do not have\
    \ a return type. They may specify their own visibility.\n\n### Overloading Methods\
    \ and Constructors\n\nJava allows defining more than one version of a method or\
    \ constructor as long as each version has a unique signature. The signature of\
    \ a method is its name and list of parameter types. Neither the return type nor\
    \ parameter names are part of a signature. Defining multiple versions of a method\
    \ is called overloading the method.\n\nIn [Listing 1.5](#K20431_C001.xhtml_lis1.5),\
    \ the constructor is overloaded; the signatures of the two constructors are:\n\
    \n```\n Fraction(int, int)\n```\n\n```\n Fraction(int)\n```\n\nWhen overloading\
    \ constructors, this() may be used as the first statement of a constructor in\
    \ order to call a different constructor:\n\n```\nthis(arguments);\n```"
