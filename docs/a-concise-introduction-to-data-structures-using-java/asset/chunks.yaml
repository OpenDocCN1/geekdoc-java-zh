    Chapman & Hall/CRC\n计算教科书系列\n系列主编：John Impagliazzo，霍夫斯特大学荣誉教授\nAndrew McGettrick，斯特拉斯莱德大学计算机与信息科学系\n\
    \n## 目标与范围\n\n该系列涵盖了计算传统领域，以及相关的技术领域，如软件工程、人工智能、计算机工程、信息系统和信息技术。该系列将涵盖本科和研究生的教科书，通常遵循专业协会的全球课程标准。编辑鼓励具有想象力的新想法和提案，并乐于帮助和鼓励新作者。编辑欢迎以下提案：对计算的方面提供突破性且富有想象力的视角；在新的颖令人兴奋的背景下介绍主题；为新兴领域（如多媒体、安全和移动系统）开启机会；捕捉计算新兴领域的新进展和应用；以及为计算提供支持的主题，如数学、统计、生命和物理科学以及商业。\n\
    \n## 已出版书目\n\n*   Pascal Hitzler, Markus Krötzsch, and Sebastian Rudolph, 语义网技术基础\n\
    *   Uvais Qidwai and C.H. Chen, 数字图像处理：基于 MATLAB® 的算法方法\n*   Henrik Bærbak Christensen,\
    \ 灵活可靠的软件：使用模式和敏捷开发\n*   John S. Conery, 计算探索：计算机科学导论\n*   Lisa C. Kaczmarczyk,\
    \ 计算机与社会：向善的计算\n*   Mark J. Johnson, Python 编程简要介绍\n*   Paul Anderson, Web 2.0\
    \ 及以后：原理与技术\n*   Henry M. Walker, 计算之道，第二版\n*   Mark C. Lewis, 使用 Scala 的编程艺术入门\n\
    *   Ted Herman, Python 计算功能性起步\n*   Mark J. Johnson, Java 数据结构简要介绍\n\n致 Lyn\n\n\
    # 前言\n\n欢迎！\n\n本书介绍了 Java™ 中的数据结构。它假设读者已具备一些先前的编程经验，但不一定是 Java 方面的。\n\n数据结构是创建任何重大软件的基石。正如小型程序由函数、循环和\
    \ if 语句组成一样，大型程序使用栈、队列、列表和映射。熟悉如何使用、设计、实现和分析这些结构，是通往熟练软件开发者道路上的重要一步。\n\n关于学习这些材料的一条建议：尽可能多做练习。编写程序的好处之一是，你可以运行它们来查看解决方案是否有效。这种快速反馈是无价的。\n\
    \n阅读愉快。\n\n## 给导师的话\n\n本书旨在支持一门侧重于基础数据结构的计算机科学第二门课程。它采取了发展性方法来增强学生的学习：\n\n*  \
    \ 在开头提供了更多的代码和指导，让学生适应 Java 并开始学习数据结构。随着学生熟悉领域并变得更加独立，提供的代码会减少，并用伪代码概述更多的算法。\n\
    *   重要概念被逐渐引入，并随着深度的增加进行回顾。例如，在整数栈的背景下引入链表，因此插入和删除仅在头部进行。接下来，它们被用于构建队列，增加了对泛型和尾部指针的支持。最后，列表\
    \ ADT 的链实现使用了双链、虚拟节点以及在列表任何位置的插入和删除。到此为止，学生已经对他们处理链表代码的能力建立了信心。\n\n"
- fmt: "\n*   The organization of topics is designed throughout to reinforce this\
    \ developmental approach. For example, [Chapter 3](#K20431_C003.xhtml_ch3) develops\
    \ an `int`-based stack interface, array implementation, and linked implementation.\
    \ This allows students to concentrate on stack essentials before tackling fully\
    \ generic stacks in [Chapter 4](#K20431_C004.xhtml_ch4). The `List` ADT follows\
    \ stacks and queues for the same reason: students are better prepared to handle\
    \ its complexity (particularly `iterators`) after learning stacks and queues first.\n\
    *   Each section introduces only one or (rarely) two new concepts, allowing students\
    \ to focus on the new ideas without becoming overwhelmed. This is particularly\
    \ important during the first half of the course for newcomers to Java.\n\nOther\
    \ features include:\n\n*   Clear, concise explanations of the essential content\
    \ students need to learn\n*   An introductory chapter to the basics of Java, allowing\
    \ students for whom Java is not their first language to quickly get up to speed\n\
    *   Partial implementations of data structures so that instructors can develop\
    \ some methods as examples, and students can write other methods as exercises\n\
    *   Introduction to topics students will likely see later in other courses, such\
    \ as call stacks, analyzing recursive functions, sorting, inheritance, and abstract\
    \ classes\n*   Sections designed to fit approximately one class period each\n\n\
    For the most part, standard Java coding practices are followed, but there are\
    \ a handful of exceptions:\n\n*   `Arrays` are copied by hand, largely to support\
    \ learning to resize circular arrays in the queue implementation.\n*   `Java`\
    \ collections are not used, because students are learning to build their own.\
    \ Most interfaces are close to their `java.util` counterparts, though.\n*   The\
    \ unnamed package is used since these applications are all relatively small, and\
    \ it simplifies file management for beginners.\n*   The `@Override` annotation\
    \ is not used for implementations of interface methods, because that use of the\
    \ term “override” seems likely to confuse beginners.\n\nWith the exception of\
    \ [Chapters 10](#K20431_C010.xhtml_ch10) and [11](#K20431_C011.xhtml_ch11), which\
    \ can be interchanged, chapters are designed to be read in order. [Section 5.3](#K20431_C005.xhtml_ch5.3)\
    \ should probably not be skipped because it introduces inheritance and the `Object`\
    \ class.\n\nJava source files and other resources are posted at\n\n[http://www.central.edu/go/datastructures/](http://www.central.edu)\n\
    \n## Feedback\n\nPlease send any comments or suggestions to [johnsonm@central.edu](mailto:johnsonm@central.edu?Subject=EPUB%20Query%20for%209781466589896).\
    \ I look forward to hearing from you.\n\n## Acknowledgments\n\nThanks to all of\
    \ the students from COSC 130 for making this course so much fun. I hope you can\
    \ see and appreciate all of the improvements you inspired. Thanks to Randi Cohen,\
    \ editor at Chapman & Hall/CRC Press, for her ongoing support; I truly appreciate\
    \ it. And thanks to my colleagues at Central College, including Mark Babcock,\
    \ director of the college-community chorus, for his regular use of the technique\
    \ “only one new thing at a time.”\n\n# About the Author\n\nMark J. Johnson is\
    \ professor of computer science and mathematics at Central College in Pella, Iowa,\
    \ where he holds the Ruth and Marvin Denekas Endowed Chair in Science and Humanities.\
    \ Mark is a graduate of the University of Wisconsin-Madison (Ph.D., mathematics)\
    \ and St. Olaf College. He is the author of A Concise Introduction to Programming\
    \ in Python, also published by Chapman & Hall/CRC Press.\n\n# Chapter 1\n\n# A\
    \ Brief Introduction to Java\n\nBefore beginning our study of data structures,\
    \ we take a quick tour of the main features of the Java programming language.\
    \ More advanced features of Java will then be introduced as they are needed. This\
    \ chapter assumes that you have some programming experience but not necessarily\
    \ in Java.\n\nA current Java Development Kit (`JDK`) is required to develop software\
    \ in Java. All of the examples in this text were written using Java SE 7.\n\n\
    ## 1.1 Basics\n\nWe begin with an example that computes factorials in [Listing\
    \ 1.1](#K20431_C001.xhtml_lis1.1).\n\nListing 1.1: Factorial\n\n```\n 1 public\
    \ class NumericFunctions {\n```\n\n```\n 2 public static int factorial(int n)\
    \ {\n```\n\n```\n 3  int result = 1;\n```\n\n```\n 4  for (int i = 2; i <= n;\
    \ i++) {\n```\n\n```\n 5  result *= i;\n```\n\n```\n 6 }\n```\n\n```\n 7  return\
    \ result;\n```\n\n```\n 8}\n```\n\n```\n 9\n```\n\n```\n10 public static void\
    \ main(String[] args) {\n```\n\n```\n11  for (int n = 1; n <= 10; n++) {\n```\n\
