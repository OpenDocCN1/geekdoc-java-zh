  trans: "\n\n`evalPostfix()` 方法比 `toPostfix()` 简单一些，因此它将在练习题中概述。对于 `toPostfix()`，我们首先将确定运算符优先级的任务分离出来。\n\
    \n### 运算符优先级\n\n确定运算符优先级的一种方法是定义一个等级函数，使得：\n\n$\\text{rank}(t) = \\left\\{ \\\
    begin{array}{l} \\begin{array}{ll} 2 & {\\text{if}t\\text{is}*\\text{or}/} \\\\\
    \ \\text{1} & {\\text{if}t\\text{is} + \\text{or} -} \\end{array} \\\\ \\begin{array}{ll}\
    \ {- 1} & \\text{otherwise} \\end{array} \\end{array} \\right.$\n\n那么 `rank(t)\
    \ > rank(u)` 表示 `t` 的优先级高于 `u`，如果 `t` 和 `u` 优先级相同，则 `rank(t) = rank(u)`。这个 `rank`\
    \ 函数还可以用于判断一个项是运算符还是操作数，因为只有运算符的等级大于零。零被预留以后以后配合括号使用（参见练习题 6）。\n\n从 Java 7 开始，字符串允许作为\
    \ switch 表达式，因此列表 4.6 使用了该技术来实现 `rank` 函数。\n\n列表 4.6：运算符等级\n\n```java\n1 public\
    \ class Expression {\n2 private static int rank(String op) {\n3  switch (op) {\n\
    4  case \"*\":\n5  case \"/\":\n6   return 2;\n7  case \"+\":\n8  case \"-\":\n\
    9   return 1;\n10   default:\n11   return -1;\n12 }\n13}\n14}\n```\n\n### toPostfix()\
    \ 实现\n\n列表 4.7 使用 `rank()` 函数来实现列表 4.5 中的中缀转后缀表达式的算法。它还使用了命名常量 `SPACE` 来帮助提高可读性。其代码应该被添加到列表\
    \ 4.6 的 `Expression` 类中，与你的栈实现位于同一个文件夹。\n\n`toPostfix()` 方法中的大部分代码看起来很熟悉：它基于列表\
    \ 4.5 中的伪代码，其结构类似于列表 1.4 中的 `acronym()` 函数，使用了对字符串中 token 的循环，并使用 `StringBuilder`\
    \ 来高效地累积结果。\n\n列表 4.7：中缀转后缀\n\n```java\n1 // Add to Expression class\n2 private\
    \ static final String SPACE = \" \";\n3\n4 public static String toPostfix(String\
    \ expr) {\n5 StringBuilder result = new StringBuilder();\n6 Stack<String> operators\
    \ = new ArrayStack<>();\n7 for (String token : expr.split(\"\\\\s+\")) {\n8  if\
    \ (rank(token) > 0) {\n9    while (!operators.isEmpty() &&\n10     rank(operators.peek())\
    \ >= rank(token)) {\n11     result.append(operators.pop() + SPACE);\n12 }\n13\
    \   operators.push(token);\n14 } else {\n15  result.append(token + SPACE);\n16\
    \ }\n17 }\n18  while (!operators.isEmpty()) {\n19  result.append(operators.pop()\
    \ + SPACE);\n20 }\n21  return result.toString();\n22}\n```\n\n### 使用条件布尔表达式\n\n\
    列表 4.7 中的困难步骤是第 9 行和第 10 行 while 循环中的测试：\n\n```java\nwhile (!operators.isEmpty()\
    \ &&\nrank(operators.peek()) >= rank(token)) {...}\n```\n\n该表达式的关键在于使用了条件 `&&`（与），参见第\
    \ 4 页。`&&` 的后部分是主测试：\n\n```java\nrank(operators.peek()) >= rank(token)\n```\n\n\
    如果栈顶运算符具有相同或更高的优先级，则需要将其弹出，这发生在循环体中。表达式的第一部分保护了 `peek()`，以防栈为空：记住，使用栈的代码负责在栈空时不进行\
    \ `peek()` 操作。\n\n由于 `&&` 是有条件的，只有在前半部分为真时才会评估后半部分，在这种情况下栈不为空。\n\n### evalPostfix()\
    \ 实现\n\n求后缀表达式的算法与 `toPostfix()` 中的翻译类似，你将在练习题中被要求实现它。为了这一点，你需要将操作数转换为它们的值。\n\n\
    表 4.5 整数转换方法\n\n| 方法 | 说明 |\n| --- | --- |\n| `static int parseInt(String s)`\
    \ | 将字符串转换为整数。 |\n| `static String toString(int n, int b)` | 将整数转换为字符串。 |\n\n\
    练习题\n\n1. 解释为什么列表 4.6 的 switch 语句中没有 `break` 语句。\n2. 在 `Expression` 类中添加 `isOperator()`\
    \ 方法，如果运算符大于 0 则返回 true。修改 `toPostfix()` 以使用 `isOperator()`。\n3. 编写一个 `applyOperator(operator,\
    \ op1, op2)` 方法，该方法接收一个运算符和两个操作数并返回二元运算的结果。例如，`applyOperator(\"*\", 3, 7)` 应返回\
    \ 21。使用 `switch` 语句，并假设所有操作数都是整数。\n4. 为 `Expression` 类编写 `evalPostfix()` 方法。使用练习题\
    \ 7 中的 `applyOperator()`。\n5. 修改练习题 8 以执行幂，使用 `pow()` 进行计算。你需要将结果转换回 `int`。\n\
    6. 使用练习题 8，为 `Expression` 类编写一个 `eval()` 方法，通过首先将中缀表达式转换为后缀然后再求值来评估表达式。例如，`eval(\"\
    1 + 2 * 3\")` 应返回 7。\n7. 栈可以用于判断代数表达式的括号是否平衡。例如：\n\n| 平衡 | 不平衡 |\n| --- | ---\
    \ |\n| (x + y * (z − w)) | (x + y * (z − w) |\n| ((x + (y)) * (z − w)) | x + y\
    \ * (z − w)) |\n\n该算法是扫描表达式中的每个字符，如果字符是左括号，将其推入栈中。如果是右括号，则栈中应该有一个对应的左括号可以弹出。所有其他字符都可以忽略。\n\
    \n    1. (a) 以伪代码形式编写算法思想，如果表达式平衡则返回 true，否则返回 false。\n    2. (b) 将括号匹配算法实现为 `Expression`\
    \ 类中的方法。\n    3. (c) 扩展上一个练习，在 `Expression` 类中编写一个不同的方法来检查圆括号 ()、方括号 [] 和大括号 {}。注意不同类型的括号需要正确嵌套：例如\
    \ (x + y * [z − w]) 是正确嵌套的，但 (x + y * [z − w)] 则不是。\n\n"
- fmt: "\nThe close counterpart of a stack is a queue. In (primarily) British usage,\
    \ a queue is a waiting line. In computer science, a queue is a data structure\
    \ that acts like a waiting line, in which items are removed from the front of\
    \ the line, and new items are added to the rear of the line. A queue is a first-in,\
    \ first-out (FIFO) data structure, because the first element in will be the first\
    \ one out.\n\n![image](image/085x001.png)\n\nAdding to the rear of a queue is\
    \ called `enqueuing`, and removing from the front of a queue is called `dequeuing`\
    \ (pronounced “DQ-ing”). The front is drawn on the left here to match the linked\
    \ lists we are about to consider.\n\n### Queue ADT\n\nThe Queue abstract data\
    \ type in [Table 5.1](#K20431_C005.xhtml_Text_Anchor_tab5.1) is very similar to\
    \ the Stack ADT. The exercises ask you to write the ADT as a Java interface.\n\
    \nTable 5.1\n\nQueue ADT\n\n| `E dequeue()` Returns and removes item from front\
    \ of queue. |\n| `void enqueue(E item)` Adds item to rear of queue. |\n| `boolean\
    \ isEmpty()` Returns true if queue has no elements in it. |\n| `E peek()` Returns\
    \ item at front of queue without removing it. |\n| `int size()` Number of elements\
    \ in queue. |\n\nLike a stack, a queue is a linear structure, meaning that elements\
    \ are stored in an ordered sequence, and so queues may be implemented with either\
    \ arrays or linked lists. As with stacks, the goal is to make all operations O(1)\
    \ if we can. The linked implementation is somewhat simpler than the array version,\
    \ so we begin with it.\n\n### Linked Implementation\n\nSince a linked list has\
    \ a natural “front” at the head, we begin by imagining the front of the queue\
    \ at the beginning of the list:\n\n![image](image/086x001.png)\n\nThen we need\
    \ to work out how to efficiently provide the two main operations in the ADT:\n\
    \nDequeuing will be easy in O(1) time, because removing from the beginning of\
    \ a linked list is just a single reference change. It is the same as popping from\
    \ a linked stack.\n\nEnqueuing is more difficult because we need to add new elements\
    \ to the end of the list. Moving to the end of the list (known as traversing the\
    \ list) will take O(n) time, so that should be avoided. We can enqueue efficiently\
    \ if we keep a separate tail pointer pointing to the last node in the list.\n\n\
    The last node in a queue is the rear of the list, so we keep a second instance\
    \ variable named `rear`:\n\n![image](image/086x002.png)\n\nEnqueuing a new item\
    \ will then require adding a new node after `rear`.\n\n### Insertion After a Node\n\
    \nBecause it is no more difficult, we solve the more general problem of adding\
    \ a new node after any given node `p`, not just after the last node.\n\n![image](image/086x003.png)\n\
    \nThe steps are similar to those for inserting at the front of a linked list (see\
    \ page 58):\n\n1. Create a new node:\n\n   ```\n   Node q = new Node<>(item, null);\n\
    \   ```\n\n   ![image](image/087x001.png)\n\n2. Set the next field of the new\
    \ node to point to the node after `p`:\n\n   ```\n   q.next = p.next;\n   ```\n\
    \n   ![image](image/087x002.png)\n\n3. Change `p.next` to point to the new node:\n\
    \n   ```\n   p.next = q;\n   ```\n\n   ![image](image/087x003.png)\n\nAs before,\
    \ these steps can be combined into one:\n\n```\np.next = new Node<>(item, p.next);\n\
    ```\n\n### Deletion After a Node\n\nAlthough we will not need this operation for\
    \ queues, deleting the node after a given node `p` is similar to inserting a new\
    \ node after `p` because it is also just a change to `p.next`. Instead of pointing\
    \ to a new node, though, `p.next` is updated to refer to the node that follows,\
    \ which is pointed to by `p.next.next`.\n\n![image](image/087x004.png)\n\n```\n\
    p.next = p.next.next;\n```\n\nThe node to be deleted, pointed to by `p.next`,\
    \ must exist, or the reference to `p.next.next` will cause a null pointer exception.\n\
    \n### Managing the Tail\n\nThe only remaining issue is to be careful to update\
    \ the `rear` pointer during enqueuing and dequeuing. The `rear` pointer begins\
    \ null, like the front.\n\nEnqueue: If the queue is empty, create a node and set\
    \ both front and `rear` to point to it. Otherwise, add a new node after `rear`\
    \ and then update `rear` to point to the new node.\n\nDequeue: Items are removed\
    \ from the front, so the only time the `rear` pointer is involved is if the last\
    \ item is being dequeued. In that case, `rear` should be set to null.\n\nYou will\
    \ be asked to implement the `LinkedQueue<E>` class in the exercises.\n\n### Exercises\n\
    \n1. Show the results of these operations on an initially empty integer queue\
    \ named `q`. Draw the queue contents after each operation, making clear where\
    \ the front is, and give the return value of each non-void method.\n\n    1. (a)\
    \ `q.enqueue(5)`\n      `q.enqueue(8)`\n      `q.peek()`\n      `q.enqueue(3)`\n\
    \      `q.dequeue()`\n      `q.enqueue(10)`\n      `q.size()`\n      `q.enqueue(4)`\n\
    \      `q.dequeue()`\n\n    2. (b) `q.enqueue(1)`\n      `q.dequeue()`\n     \
    \ `q.enqueue(2)`\n      `q.dequeue()`\n      `q.enqueue(3)`\n      `q.dequeue()`\n\
    \      `q.size()`\n      `q.enqueue(4)`\n      `q.peek()`\n      `q.dequeue()`\n\
    \n    3. (c) `q.enqueue(10)`\n      `q.enqueue(20)`\n      `q.enqueue(30)`\n \
    \     `q.enqueue(40)`\n      `q.peek()`\n      `q.enqueue(50)`\n      `q.dequeue()`\n\
    \      `q.size()`\n      `q.dequeue()`\n\n2. Decide whether a queue would be an\
    \ appropriate data structure for each of these types. Assume that when a task\
    \ arrives, it would be enqueued, and when a task is chosen on, it would be dequeued.\
    \ Explain your answers.\n\n    1. (a) Tasks that may be done in any order.\n \
    \   2. (b) Tasks where the next one to on is always the one that been waiting\
    \ longest.\n    3. (c) Tasks where the next one to on is always the most recently\
    \ received.\n    4. (d) Tasks that need to be done in the order they arrive.\n\
    \    5. (e) Tasks that may need sorting.\n\n3. Write a generic Java interface\
    \ `Queue<E>` for the ADT in [Table 5.1](#K20431_C005.xhtml_Text_Anchor_tab5.1).\n\
    \n4. Develop the `LinkedQueue<E>` class, implementing `Queue<E>` from Exercise\
    \ 3. Write these members:\n\n    1. (a) Private `Node<T>` class Include a second\
    \ constructor that only takes one parameter, the data, and sets the next field\
    \ to null.\n    2. (b) `dequeue()` Throw a `NoSuchElementException` from `java.util`\
    \ if the queue is empty (see page 55).\n    3. (c) `enqueue()`\n    4. (d) `isEmpty()`\n\
    \    5. (e) `peek()` Throw a `NoSuchElementException` if the queue is empty.\n\
    \    6. (f) `size()` Include a size instance variable and update it where necessary.\n\
    \n5. Add a `main()` method to the `LinkedQueue<E>` class to test the queue with:\n\
    \n    1. (a) Integers\n    2. (b) Doubles\n    3. (c) Strings\n\n6. Determine\
    \ the O() time complexity of `LinkedQueue` operations. Explain your answers.\n\
    \n    1. (a) `dequeue()`\n    2. (b) `enqueue()`\n    3. (c) `isEmpty()`\n   \
    \ 4. (d) `peek()`\n    5. (e) `size()`\n\n7. As described above, the `enqueue`\
    \ method has to treat an empty queue as a special case. To avoid this, a dummy\
    \ node can be created at the front of the list containing no data. This simplifies\
    \ enqueuing, but requires rewriting other methods to take the dummy node into\
    \ account. Write a `DummyLinkedQueue<E>` implementation of `Queue<E>` using this\
    \ approach. Discuss the tradeoffs.\n\n### 5.2 Array Implementation\n\nThe linked\
    \ queue was a bit more complicated than its stack counterpart, requiring a second\
    \ tail pointer to enqueue efficiently. In a similar way, the array implementation\
    \ of a queue will require extra work to achieve O(1) performance. The main ideas\
    \ are similar to an array stack, though, so we begin by ignoring the complications.\n\
    \n### Basic Idea\n\nAs with the array implementation of a stack, it is helpful\
    \ to begin by imagining a few elements being added to a queue. Suppose 10, 20,\
    \ and 30 are enqueued in that order; then it is natural to store them at the beginning\
    \ of the array (shown as primitives to simplify the pictures):\n\n![image](image/090x001.png)\n"
