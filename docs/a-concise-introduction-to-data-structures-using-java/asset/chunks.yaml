    \ outlines a recursive hanoi(n, src, intermed, dest) based on these ideas.\n\n\
    Listing 7.4: Towers of Hanoi (Pseudocode)\n\n```\n 1 Move n-1 disks from src to\
    \ intermed using dest\n```\n\n```\n 2 Move disk n from src to dest\n```\n\n```\n\
    \ 3 Move n-1 disks from intermed to dest using src\n```\n\n### Backtracking"
