    \ `n`**：当 `n < 100` 时，算法 `B` 运行快，但这并不是其整体性能的良好指标。对于大的 `n`，它的速度比 `A` 慢得多。\n\n**关注最高幂**：`n`\
    \ 列和算法 `A` 的列增长趋势非常相似，`B` 和 `C` 的列也是如此。这些组合的共同点是它们 `n` 的最高幂：对于 `n` 和 `A`，它们是 `n`\
    \ 本身；对于 `B` 和 `C`，是 `n²`。\n\n**忽略其他细节**：比较算法 `B` 和 `C` 的增长情况。`0.1n² + n + 28`\
    \ 中的系数和较小项并没有与 `n²` 本身产生显著差异。\n\n从现实角度考虑，表格应该持续到更大的 `n`，达到数百万甚至千万级。你可以想象那会是什么样子。\n\
    \n### 大 O 表示法 (Big-O Notation)\n\n大 O 表示法捕捉了算法或数学函数在大 `n` 情况下的整体行为。如果存在一个常数 `c`，使得对于所有的大\
    \ `n`，\n\n我们说 `g(n)` 是 `O(f(n))`\n\n```\ng(n) <= c · f(n)\n```\n\n如果一个算法需要 `g(n)`\
    \ 步，且 `g(n)` 是 `O(f(n))`，则该算法被认为是 `O(f(n))`。不过，我们不会使用这个精确的定义，而是应用上述推导的原则，关注最高幂并忽略其他细节。\n\
    \n例如，\n\n算法 `A` 是 `O(n)`，因为 `10n+25` 是 `O(n)`。最高幂是 `n`，我们忽略了系数 `10` 和低项。\n\n算法\
    \ `B` 是 `O(n²)`，因为 `0.1n² + n + 28` 是 `O(n²)`。最高幂是 `n²`，我们忽略了系数和两个低项。\n\n算法 `C`\
    \ 是 `O(n²)`，因为 `n²` 本身就是 `O(n²)`。\n\n注意 `O()` 如何捕捉我们对哪些算法具有“相同”性能的直觉。\n\n使用 `O()`\
    \ 表示法分析算法的运行时间被称为研究其时间复杂度，而空间复杂度描述的是内存需求。大多数算法具有 [表 2.1] 中的一种时间复杂度，按速度从快到慢排序。\n\
    \n**表 2.1：常见时间复杂度**\n\n| `O(1)` | 常数级 |\n| `O(log n)` | 对数级 |\n| `O(n)` | 线性级\
    \ |\n| `O(n log n)` | |\n| `O(n²)` | 平方级 |\n| `O(n³)` | 立方级 |\n\n### 计数对象\n\n\
    取决于情况，分析算法的人可能会计算不同的内容，例如指令、比较或元素交换。我们通常按指令来考虑，但使用 `O()` 的好处之一是，最终我们的具体选择可能不会影响结果。\n\
    \n### 最好、最坏和平均情况\n\n算法在不同数据集上的表现可能非常不同。因此，我们可能对其中任何一种感兴趣：\n\n- **最好情况性能**假设数据的排列使得算法处于最优。\n\
    - **最坏情况性能**假设数据的排列对于该特定算法尽可能糟糕。\n- **平均情况性能**是对所有可能的数据集取平均。\n\n通常，最好情况性能没有帮助，因为它更多是取决于运气。\n\
    \n由于其官方定义中的不等式 (`g(n) <= c f(n)`)，大 O 表示法最适用于最坏情况分析。说一个算法是 `O(n)` 意味着它的性能不会比线性差。\n\
    \n### 性能测量\n\n确定时间复杂度的有效对应方法是在实际机器上测量算法的性能。性能测量通过测量代码在特定机器上执行所需的时间，对算法性能问题采用实证方法。\n\
    \n在 Java 中可以使用 [表 2.2] 提供的 `currentTimeMillis()` 函数测量执行时间。由于它是另一个类（`System` 类）的静态方法，因此必须带有\
    \ `System.` 前缀进行调用（见第 30 页）。\n\n**表 2.2：系统计时**\n\n| `static long currentTimeMillis()`\
    \ |\n| 当前毫秒级时间。 |\n\n该思想是在运行算法的前后，立即检查时钟上的时间：\n\n```\nlong start = System.currentTimeMillis();\n\
    ```\n\n```\n# 在此处执行算法\n```\n\n```\nlong elapsed = System.currentTimeMillis() -\
    \ start;\n```\n\n注意只对所讨论算法进行计时。鉴于目前计算机的速度，循环多次执行然后计算平均时间是常见操作。\n\n这种方法的好处是作为抽象分析的现实检查。如果你的分析是正确的，那么实际时间将会证实它。然而，要注意影响实际性能的因素，例如缓存。\n\
    \n`O()` 分析的优势在于不依赖于特定的编译器。\n\n### 练习\n\n1. 根据 `O()` 分类这些数学函数：\n   - (a) `n`\n\
