  trans: "\n通过声明一个数组类型的变量并没有创建实际的数组。这是因为数组类型是引用类型，因此声明一个数组类型变量只是为该变量预留了存储空间，以便最终存储指向实际数组的引用。创建数组是一个单独的步骤。\n\
    \n### 创建数组\n\n创建数组有两种主要方法：使用初始化器或使用 `new`。当数组包含数量较少的已知项时，初始化器是合适的，例如代码列表 1.3 中的第\
    \ 10 行。数组初始化器的语法为：\n\n```\narrayRef = {item, item, ..., item};\n```\n\n更多情况下，通常使用\
    \ `new` 配合类型和方括号来创建一个指定大小的数组：\n\n```\narrayRef = new type[N];\n```\n\n在这里，配合 `new`\
    \ 使用的类型必须与声明数组变量时使用的类型兼容，且 `N` 指定新数组的大小（也称为其长度）。使用 `new` 创建的数组，每个索引都从默认初始值开始。对于数值类型，默认值为\
    \ 0；对于引用类型，默认值是空引用（参见第 1.4 节）。\n\n数组的长度可以通过其 length 字段访问：\n\n```\narrayRef.length\n\
    ```\n\n例如，请参代码列表 1.3 中的第 3 行。数组的长度在创建时就已经固定了，永远无法改变。然而，数组变量可以随时重新赋值以指向长度不同的数组对象。\n\
    \n### 访问数组元素\n\n数组中的项通过其索引或在数组中的位置访问。索引从 0 开始计数，因此包含 9 个项的数组（如代码列表 1.3 中的 `data`）索引为\
    \ 0 到 8。我们如下视化数据数组：\n\n![image](img/017x001.png)\n\n数组中索引为 `i` 的项使用方括号访问：\n\n\
    ```\narrayRef[i]\n```\n\n例如，`data[2]` 是 7，`data[7]` 是 42。\n\nJava 对所有数组访问执行自动边界检查。如果使用了无效的索引，将抛出\
    \ `ArrayIndexOutOfBoundsException`，这通常会停止程序的执行。\n\n### 增强型 for 循环\n\nJava 集合（包括数组）支持简化的\
    \ `for` 语句，允许遍历集合中的每个项。这被称为增强型 for 循环（enhanced for-loop），语法如下：\n\n```\nfor (type\
    \ variable : collection) {\n    body;\n}\n```\n\n该循环为集合中的每个项执行一次。在循环体内部，每个项都存储在\
    \ `variable` 中。为 `variable` 指定的类型必须与集合中每个项的类型匹配。\n\n例如，考虑代码列表 1.3 中 `main()` 方法中的\
    \ `data` 数组。它被声明为 `int[]`，因此使用该数组的增强 for 循环的项类型应该是 `int`。此循环打印数组中的所有项：\n\n```\n\
    for (int item : data) {\n    System.out.println(item);\n}\n```\n\n在不需要数组索引的情况下，增强型\
    \ for 循环非常好用。\n\n### 线性搜索\n\n代码列表 1.3 中的方法解决了搜索问题：\n\n> 给定一个数组 `data` 和一个特定值 `target`，确定\
    \ `target` 是否作为元素出现在 `data` 中。如果存在，返回它出现的最小索引；否则，返回 −1。\n\n我们通过产生一个算法来解决搜索问题。算法是用于解决特定问题的特定计算步骤的序列。注意，这个定义包含了几个模糊的术语；对于我们的目的，算法简单来说就是一个解决问题的程序。\n\
    \n线性搜索（也称为顺序搜索）通过从项 0 开始逐个检查数组中的每个元素，并跟踪当前索引来解决搜索问题。如果找到了该项，则返回相应的索引；否则，如果在查看了每个元素后仍未找到该项，则返回\
    \ -1。\n\n由于题目说明要返回找到元素时的索引，我们需要遍历索引，而不是遍历数组中的元素。\n\n### 练习题\n\n1. 写一个 Java 语句来声明这些每个数组引用：\n\
    \    - (a) 一个名为 `counts` 的 `int` 数组\n    - (b) 一个名为 `times` 的 `double` 数组\n  \
    \  - (c) 一个名为 `visible` 的 `boolean` 数组\n    - (d) 一个名为 `names` 的 `String` 数组\n\
    2. 使用初始化器写一个 Java 语句来声明并创建这些数组：\n    - (a) 一个名为 `counts` 的 `int` 数组，内容为 18, 3,\
    \ 9, 22, 11, 4。\n    - (b) 一个名为 `times` 的 `double` 数组，内容为 1.52, 1.98, 1.44, 1.63,\
    \ 1.67。\n    - (c) 一个名为 `visible` 的 `boolean` 数组，内容为 T, F, F, T, F。\n    - (d)\
    \ 一个名为 `names` 的 `String` 数组，内容为 “Alice,”Bob,”Carol,”Dave.”\n3. 写一个 Java 语句来声明这些每个数组引用并创建它们：\n\
    \    - (a) 一个长度为 10 的名为 `counts` 的 `int` 数组\n    - (b) 一个长度为 40 的名为 `times` 的\
    \ `double` 数组\n    - (c) 一个长度为 100 的名为 `visible` 的 `boolean` 数组\n    - (d) 一个长度为\
    \ 100 的名为 `names` 的 `String` 数组\n4. 使用增强 for 循环打印这些每个中的每一个项：\n    - (a) 一个名为 `counts`\
    \ 的 `int` 数组\n    - (b) 一个名为 `times` 的 `double` 数组\n    - (c) 一个名为 `visible` 的\
    \ `boolean` 数组\n    - (d) 一个名为 `names` 的 `String` 数组\n5. 使用代码列表 1.3 来：\n    -\
    \ (a) 确定 `main` 参数的名字和类型。\n    - (b) 解释为什么第 3 行使用小于而不是等于。\n    - (c) 跟踪第 12 行\
    \ `linearSearch()` 的执行过程。\n    - (d) 跟踪第 14 行 `linearSearch()` 的执行过程。\n6. 解释在\
    \ `linearSearch()` 第 4 行使用 `==` 是可行的。替换为 `equals()` 可以吗？\n7. 在代码列表 1.3 中添加增强 for\
    \ 循环来搜索数组中的每个元素。\n8. 为 `ArrayFunctions` 类写一个 `sum(int[] data)` 方法，返回数组元素的和。在 `main()`\
    \ 中测试你的实现。\n9. 为 `ArrayFunctions` 类写一个 `max(int[] data)` 方法，返回给定数组中的最大值。假设数组不为空，并在\
    \ `main()` 中测试你的实现。\n10. 为 `ArrayFunctions` 类写一个 `min(int[] data)` 方法，返回给定数组中的最小值。假设数组不为空，并在\
    \ `main()` 中测试你的实现。\n11. 为 `ArrayFunctions` 类写一个 `display(int[] data)` 方法，将给定数组的内容打印在一行中。对每个元素使用\
    \ `print()`，但最后以一个 `println()` 结束，以便未来的输出单独成行。在 `main()` 中测试你的实现。\n\n## 1.4 使用对象\n\
    \nJava 是一种面向对象的编程语言，因此学习使用对象是成功适应该语言的关键之一。到为止你已经看到了两种对象，字符串和数组。每一个都有些独特；本节使用更具代表性的示例来传递通用思想。\n\
    \n对象由类定义。在本节中，我们关注如何使用对象；在下一节中，我们将如何编写自己的类。除了使用新对象外，代码列表 1.4 结合了最后两个节的一些思想。在查看其中使用\
    \ `StringBuilder` 类和 `split()` 方法之前，我们考虑了使用 Java 对象涉及的一些通用问题。\n\n### 声明对象引用\n\n\
    对象引用的声明与原始类型变量相同：\n\n```\ntype referenceVariable;\n```\n\n代码列表 1.4: 缩写\n\n```\n\
    1  // 添加到 StringFunctions 类：\n```\n"
- fmt: "\n```java\n2\n3  public static String acronym(String phrase) {\n4  StringBuilder\
    \ result = new StringBuilder();\n5  for (String token : phrase.split(\"\\\\s+\"\
    )) {\n6   result.append(token.toUpperCase().charAt(0));\n7 }\n8 return result.toString();\n\
    9 }\n```\n\nThe type that a reference is declared with defines the methods and\
    \ fields that may be used via the reference. However, as with strings and arrays,\
    \ declaring a reference variable does not create an object for the variable to\
    \ refer to, and a reference cannot “do” anything until it refers to an object.\
    \ Once an object has been created, we often talk about the reference variable\
    \ as if it is the object that it references.\n\n### Creating Objects\n\nObjects\
    \ are created in Java using `new` and the class constructor:\n\n```\nreferenceVariable\
    \ = new ClassName(arguments);\n```\n\nConstructors always have the same name as\
    \ their class, and may take zero or more parameters. In [Listing 1.4](#K20431_C001.xhtml_lis1.4),\
    \ a `StringBuilder` object is created by calling the constructor on line 4, and\
    \ that object is then referenced by the variable `result`.\n\n### Accessing Fields\
    \ and Calling Methods\n\nObjects store their data in fields defined by the class\
    \ from which they were created. Fields are accessed using dot notation:\n\n```\n\
    object.field\n```\n\nWe saw this notation in the last section for accessing the\
    \ `length` field of an array.\n\nMethods are operations that may be performed\
    \ on or with the data stored in the object’s fields. Methods are called using\
    \ the same dot notation:\n\n```\nobject.method(arguments)\n```\n\nThere were several\
    \ examples of `String` method calls in [Section 1.2](#K20431_C001.xhtml_ch1.2),\
    \ and line 6 of [Listing 1.4](#K20431_C001.xhtml_lis1.4) calls the `append()`\
    \ method on the `StringBuilder` object `result`. It is also worth noting that\
    \ `print()` and `println()` are method calls on the `System.out` object.\n\nAccessing\
    \ a field or method of a reference variable using a dot is sometimes called dereferencing\
    \ the variable. Only variables declared with reference types can be dereferenced.\
    \ If you try to dereference a variable declared with a primitive type, you well\
    \ get an error.\n\n### Object References\n\nRecall that reference types point\
    \ to the object they refer to using a reference, rather than directly storing\
    \ data like primitives. Given these assignments:\n\n```\nint x = 17;\n```\n\n\
    ```\nString s = \"This is a string\";\n```\n\nit is helpful to imagine the difference\
    \ like this:\n\n![image](image/022x001.png)\n\nbecause the actual contents of\
    \ `s` are a reference to the string object. Java references are also called pointers\
    \ because they point to objects; be aware, however, that in other languages there\
    \ may be differences between pointers and references. If another reference is\
    \ created and given the same value as `s`:\n\n```\nString t = s;\n```\n\nthen\
    \ both references point to the same object:\n\n![image](image/022x002.png)\n\n\
    Recall (page 8) that Java passes all method parameters by value. This means that\
    \ for object references, parameters always get a copy of the reference (in the\
    \ same way that `t` is a copy of the reference `s` in our example here), but the\
    \ reference points to the actual object. Generally, this is exactly what you expect\
    \ and need.\n\nThere is one literal reference, `null`, which refers to no object.\
    \ Trying to access a field or method of a `null` reference will generate a `NullPointerException`.\n\
    \n### Using equals()\n\nWe can say a bit more now about the difference between\
    \ `==` and `equals()` for reference types. With all object types (including strings),\
    \ `==` and `!=` check whether or not the two references refer to the same object.\
    \ The `equals()` method, on the other hand, is defined by classes such as `String`\
    \ to check whether or not the objects have the same content.\n\nThus, most of\
    \ the time, when comparing objects, you want to compare their contents and therefore\
    \ use `equals()`. Direct comparisons with `==` are used mostly with primitive\
    \ types.\n\nThere is one caveat: Java arrays do not implement `equals()` to compare\
    \ their contents. If you need to compare the contents of arrays, use the `equals()`\
    \ method from the `java.util.Arrays` class.\n\n### Destroying Objects\n\nThere\
    \ is no explicit way to destroy an object in Java after it has been created. Instead,\
    \ Java has a system of automatic garbage collection that is allowed to reclaim\
    \ memory once it is no longer being used. The garbage collector determines that\
    \ an object is no longer being used when there is no way to reach it by following\
    \ active references in the program. This automatic system is nice; other languages\
    \ may require you to take out your own trash.\n\nHowever, there still may be times\
    \ when we need to eliminate references to objects that are no longer being used.\
    \ In general, if `x` is a reference to an object we no longer need, then setting\
    \ `x` to `null` will alert the garbage collector that the object can be deleted\
    \ (assuming no other references point to it).\n\n### StringBuilders\n\nRecall\
    \ that string concatenation is inefficient because strings are immutable (see\
    \ [Section 1.2](#K20431_C001.xhtml_ch1.2)). `StringBuilder` objects are specifically\
    \ designed to perform efficient string accumulation. Because they are mutable,\
    \ their contents can change and so they do not require creating new objects for\
    \ every concatenation.\n\nThe `StringBuilder` object referenced by `result` in\
    \ [Listing 1.4](#K20431_C001.xhtml_lis1.4) is created on line 4 by calling a constructor\
    \ with new. Once the object exists, the StringBuilder methods listed in [Table\
    \ 1.6](#K20431_C001.xhtml_Text_Anchor_tab1.6) can be called on it.\n\nTable 1.6\n\
    \nStringBuilder\n\n| void append(String s)Appends s to current contents. |\n|\
    \ String toString()Converts contents to string. |\n\n### String Tokenizing\n\n\
    A common task is to break a given string into a collection of tokens. In [Listing\
    \ 1.4](#K20431_C001.xhtml_lis1.4), we need each word in the phrase. In that case,\
    \ the tokens are the individual words, separated by whitespace.\n\nThe `split()`\
    \ method, given in [Table 1.7](#K20431_C001.xhtml_Text_Anchor_tab1.7), provides\
    \ a convenient method for tokenizing strings, returning a String array that contains\
    \ the tokens. The `split()` method breaks a string into tokens at each occurrence\
    \ of the expression passed as its parameter. For example,\n\n```\n \"Name:Address:City:State:Zip\"\
    .split(\":\")\n```\n\nreturns the array\n\n```\n {\"Name\", \"Address\", \"City\"\
    , \"State\", \"Zip\"}\n```\n\nThe split expression \":\" is not kept as part of\
    \ any of the tokens.\n\nTable 1.7\n\nString Tokenizing\n\n| String[] split(String\
    \ expr)Returns an array of strings created by splitting this string at each occurrence\
    \ of expr. |\n\nThe split expression can be any regular expression. The regular\
    \ expression used in [Listing 1.4](#K20431_C001.xhtml_lis1.4) matches any string\
    \ of one or more characters of whitespace (spaces, tabs, or newlines). It works\
    \ like this: the pattern `\\s` matches any single whitespace character. But to\
    \ use the pattern `\\s` in a string literal (as here), the backslash must be escaped\
    \ with another backslash; thus the string literal `\\\\s` matches any one character\
    \ of whitespace. Appending a `+` to a pattern matches one or more occurrences\
    \ of the pattern, and so, `\\\\s+` matches any set of one or more characters of\
    \ whitespace.\n\n### Exercises\n\n1.  Suppose `Random` is the name of a Java class\
    \ with a constructor that takes no parameters. Write a Java statement to declare\
    \ and create a `Random` object named `gen`.\n2.  Suppose `Thread` is the name\
    \ of a Java class with a constructor that takes no parameters. Write a Java statement\
    \ to declare and create a `Thread` object named `t`.\n3.  Suppose `Button` is\
    \ the name of a Java class with a constructor that takes a string parameter for\
    \ the button’s label. Write a Java statement to declare and create a `Button`\
    \ object named `goButton` labeled “Go.”\n4.  Determine the values of these Java\
    \ expressions:\n\n    1.  (a) ”This sentence has long gaps.”.split(\"\\\\s+\"\
    )\n"
