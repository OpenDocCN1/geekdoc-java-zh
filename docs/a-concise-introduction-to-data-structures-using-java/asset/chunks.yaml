    \ (next != null) next.prev = prev;\n```\n\n![image](image/114x002.png)\n\nThe\
    \ complete removeAt() method is in [Listing 6.2](#K20431_C006.xhtml_lis6.2).\n\
    \n### Traversals\n\nWalking through the nodes of a linked list is known as traversing\
    \ the list. The idea of a full traversal is simple: start at the front of the\
    \ list (or perhaps skip the dummy node) and keep following next pointers until\
    \ you reach null. The Java implementation is a nice for-loop:\n\n```\nfor (Node<T>\
    \ p = head; p != null; p = p.next) {\n```\n\n```\n// work with node pointed to\
    \ by p\n```\n\n```\n}\n```\n\nRecall that the three components of the for are\
    \ initialize, test, and increment, and those are exactly the steps needed for\
    \ traversal.\n\n### Indexed Access\n\nBecause linked lists do not have direct\
    \ indexed access to each element, it will be helpful to write a private getNode()\
    \ method that returns the node for a given index. The getNode() method does a\
    \ partial traversal until reaching the desired index.\n\n[Listing 6.2](#K20431_C006.xhtml_lis6.2)\
    \ gives the implementation of getNode() and illustrates its use in removeAt().\
    \ Rather than skipping the dummy node, the index −1 is allowed in case the dummy\
    \ node is needed by other methods. Because getNode() will only be called by code\
    \ internal to the class, it can assume the target index is valid. Remember that\
    \ nodes are an implementation detail of the linked list and so should not be returned\
    \ by public methods.\n\nListing 6.2: Linked List Deletion and Helper\n\n```\n\
    \ 1 public E removeAt(int index) {\n```\n\n```\n 2 if (index < 0 || index >= size)\n\
    ```\n\n```\n 3   throw new IndexOutOfBoundsException();\n```\n\n```\n 4 Node<E>\
    \ p = getNode(index);\n```\n\n```\n 5 Node<E> prev = p.prev;\n```\n\n```\n 6 Node<E>\
    \ next = p.next;\n```\n\n```\n 7 E result = p.data;\n```\n\n```\n 8 prev.next\
    \ = next;\n```\n\n```\n 9 if (next != null) next.prev = prev;\n```\n\n```\n 10\
    \ size--;\n```\n\n```\n 11 return result;\n```\n\n```\n 12}\n```\n\n```\n 13\n\
    ```\n\n```\n 14 private Node<E> getNode(int index) {\n```\n\n```\n 15 // assumes\
    \ -1 <= index < size. -1 is dummy.\n```\n\n```\n 16 Node<E> p = head;\n```\n\n\
    ```\n 17 for (int i = -1; i < index; i++) {\n```\n\n```\n 18  p = p.next;\n```\n\
    \n```\n 19}\n```\n\n```\n 20 return p;\n```\n\n```\n 21}\n```\n\n### Performance\n\
    \nAs an example of analyzing linked list operations, consider the performance\
    \ of the removeAt() method in [Listing 6.2](#K20431_C006.xhtml_lis6.2) in terms\
    \ of n, the number of items in the list. It appears to be a simple sequence of\
    \ a fixed number of steps, which would be O(1). But one of those steps is a call\
    \ to getNode(), which traverses the list. Thus, the performance of removeAt()\
    \ is O(n) because the traversal may take up to n steps.\n\n### Using Nodes and\
    \ References\n\nOne last piece of advice for navigating linked list code: at times,\
    \ you will need to distinguish between a reference and the node it refers to.\
    \ For example, using single links for simplicity, we often view the node after\
    \ the node referenced by p “as” p.next:\n\n![image](image/115x001.png)\n\nBut\
    \ if you need to change p.next, the reference p.next lives in the node pointed\
    \ to by p, along with p.data:\n\n![image](image/115x002.png)\n\nUnderstanding\
    \ this difference between a reference and the node it refers to will help you\
    \ write correct code.\n\nExercises\n\n1.  Explain why getNode() was not used to\
    \ find prev and next in the removeAt() method of [Listing 6.2](#K20431_C006.xhtml_lis6.2).\
    \ Could it have been used?\n\n2.  Describe the circumstances (i.e., which node\
    \ or nodes are being deleted) when the if-statement at line 9 prevents a null\
    \ pointer exception in [Listing 6.2](#K20431_C006.xhtml_lis6.2).\n\n3.  Rewrite\
    \ the removeAt() method of [Listing 6.2](#K20431_C006.xhtml_lis6.2) to use compound\
    \ expressions instead of the separate variables prev and next.\n\n4.  Develop\
    \ the LinkedList<E> class implementing the List<E> interface by writing these\
    \ class members. Use double links and a dummy node.\n\n    1.  (a) Private Node<T>\
    \ class Include a default constructor taking no parameters that sets all three\
    \ fields to null.\n\n    2.  (b) add(item)\n\n    3.  (c) add(index, item)\n\n\
    \    4.  (d) get()"
