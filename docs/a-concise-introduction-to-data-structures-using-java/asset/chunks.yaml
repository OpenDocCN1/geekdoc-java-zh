    \ also work?\n\n8.  Add an enhanced for-loop to main() in [Listing 1.3](#K20431_C001.xhtml_lis1.3)\
    \ that searches for every element in the array data.\n\n9.  Write a sum(int[]\
    \ data) method for the ArrayFunctions class that returns the sum of the elements\
    \ in the given array. Test your implementation in main().\n\n10.  Write a max(int[]\
    \ data) method for the ArrayFunctions class that returns the value of the largest\
    \ element in the given array. Assume the array is nonempty, and test your implementation\
    \ in main().\n\n11.  Write a min(int[] data) method for the ArrayFunctions class\
    \ that returns the value of the smallest element in the given array. You may assume\
    \ the array is nonempty. Test your implementation in main().\n\n12.  Write a display(int[]\
    \ data) method for the ArrayFunctions class that prints the contents of the given\
    \ array on one line. Use print() for each element, but finish with a final println()\
    \ so that future output appears on its own line. Test your implementation in main().\n\
    \n## 1.4 Using Objects\n\nJava is an object-oriented programming language, and\
    \ so, learning to use objects is one of the keys to successfully adapting to the\
    \ language. You have seen two types of objects so far, strings and arrays. Each\
    \ of those is somewhat unique; this section uses a more representative example\
    \ to convey the general ideas.\n\nObjects are defined by classes. In this section,\
    \ we focus on how to use objects; in the next section, we look at how to write\
    \ our own classes. In addition to using a new object, [Listing 1.4](#K20431_C001.xhtml_lis1.4)\
    \ ties together some ideas from the last two sections. Before looking at the details\
    \ of how the StringBuilder class and the split() method are used in it, we consider\
    \ some general issues involved in using Java objects.\n\n### Declaring Object\
    \ References\n\nObject references are declared in the same way as primitive variables:\n\
    \n```\ntype referenceVariable;\n```\n\nListing 1.4: Acronym\n\n```\n1  // Add\
    \ to class StringFunctions:\n```"
