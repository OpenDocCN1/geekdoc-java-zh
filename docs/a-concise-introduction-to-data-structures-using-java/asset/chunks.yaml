  trans: "\n然而，如果数组是排序过的，则可以使用更高效的分治策略。该策略将目标值与数组的中间元素进行比较。由于数组是排序的，如果目标值小于中间元素，就可以排除数组的整个上半部分。同样，如果目标值大于中间元素，则排除下半部分。重复这一过程就得到了被称为二分查找的算法。\n\
    \n## 实现\n\n二分查找是十分精妙的，这种精妙体现在要为所有情况编写出正确的代码可能是困难的。1 列表 2.3 中的实现确保了如果目标值在数组中，它一定会被包含在索引\
    \ `left` 和 `right` 之间：\n\n![image](img/f0043-01.png)\n\n在每个阶段，都会检查该范围中间的元素，如果\
    \ `left` 大于 `right`，算法停止。\n\n列表 2.3: 二分查找\n\n```\n1 // Add to class ArrayFunctions\n\
    ```\n\n```\n2 public static int binarySearch(int[] data, int target) {\n```\n\n\
    ```\n3 int left = 0;\n```\n\n```\n4 int right = data.length - 1;\n```\n\n```\n\
    5 while (left <= right) {\n```\n\n```\n6  int mid = (left + right) / 2;\n```\n\
    \n```\n7  if (target == data[mid]) {\n```\n\n```\n8  return mid;\n```\n\n```\n\
    9 } else if (target < data[mid]) {\n```\n\n```\n10  right = mid - 1;\n```\n\n\
    ```\n11 } else {\n```\n\n```\n12  left = mid + 1;\n```\n\n```\n13 }\n```\n\n```\n\
    14 }\n```\n\n```\n15  return -1;\n```\n\n```\n16}\n```\n\n### 示例追踪\n\n二分查找中最困难的部分是在目标值不在\
    \ `data[mid]` 时，更新 `left` 或 `right`。通过手工追踪错复杂的代码是理解其工作原理的好方法。例如，假设我们在这个排序数组中搜索\
    \ 15：\n\n![image](img/f0044-01.png)\n\n在算法开始时，我们有：\n\n```\n left: 0   right: 8\
    \   mid: 4\n```\n\n由于 `target` 大于 `data[mid]`，`left` 变为 `mid + 1`（即 5），然后计算下一个\
    \ `mid`（记住整数除法会向零截断）：\n\n```\n left: 5   right: 8   mid: 6\n```\n\n在这种情况下，`target`\
    \ 小于 `data[mid]`，因此 `right` 变为 5：\n\n```\n left: 5   right: 5   mid: 5\n```\n\n\
    最后一步可能会出乎意料。由于 `target < data[mid]`，`right` 被设置为 `mid - 1`：\n\n```\n left: 5 \
    \  right: 4\n```\n\n并且停止了二分查找。\n\n### 二分查找分析\n\n列表 2.3 因为第 5 行循环的重复次数未知，看起来很难分析。然而，我们可以通过假设数组大小\
    \ `n` 是 2 的幂来简化最坏情况分析。\n\n如果 `n = 2^k`，那么在最坏情况下，二分查找将数组对半大约 `k` 次。为了理解为什么，请观察每次迭代后目标必须所在的区域\
    \ `data[left...right]` 的近似大小：\n\n|  | `data[left..right]` 的大小 |\n| --- | --- |\n\
    | 迭代 1 次后 | $2^{k-1}$ |\n| 迭代 2 次后 | $2^{k-2}$ |\n| 迭代 3 次后 | $2^{k-3}$ |\n| .\
    \ . . |  |\n| 迭代 k 次后 | $2^{k-k} = 2⁰ = 1$ |\n\n这意味着在最坏情况下，循环运行大约 `k` 次，因此对于 $n\
    \ = 2^k$，二分查找的复杂度为 $O(k)$。为了得到一个关于 `n` 的表达式，我们利用以下事实：\n\n如果 `n = 2^k`，则 `k = \\\
    log_2 n`\n\n因此，二分查找是一个 $O(\\log n)$ 算法。\n\n### 练习\n\n1. 展示在数组\n    ```\n    {2,\
    \ 5, 7, 10, 22, 31, 34, 40}\n    ```\n    中搜索以下元素时，二分查找是如何工作的。显示 `left`、`right`\
    \ 和 `mid` 的值的变化。\n\n    1. (a) 31\n    2. (b) 2\n    3. (c) 17\n    4. (d) 50\n\
    \    5. (e) 1\n    6. (f) 34\n\n2. 展示在数组\n    ```\n    {10, 13, 24, 36, 37, 41,\
    \ 44, 66, 86, 100}\n    ```\n    中搜索每个元素时，二分查找是如何工作的。显示 `left`、`right` 和 `mid`\
    \ 的值的变化。\n\n    1. (a) 25\n    2. (b) 24\n    3. (c) 86\n    4. (d) 99\n    5.\
    \ (e) 100\n    6. (f) 8\n\n3. 确定线性查找和二分查找哪个更快？\n\n4. 解释二分查找的最坏情况时间复杂度。\n\n5. 什么是栈（stack）？\n\
    \n6. 栈的一个实际应用场景。\n\n7. 栈和队列（queue）的区别是什么？\n\n8. 如何使用链表实现栈？\n\n9. 如何使用数组实现栈？\n\n\
    10. 栈的 `push` 和 `pop` 操作的复杂度是多少？\n\n"
- fmt: "\nThus, all Java classes support abstract data types via their public methods\
    \ and documentation. But there is more.\n\n## Java Interfaces\n\nJava interfaces\
    \ allow us to express ADTs directly in code. Java interfaces contain method declarations,\
    \ describing what an object can do, but no implementation code. It is up to classes\
    \ to implement the interface and provide code for implementation.\n\nThe syntax\
    \ to define an interface simply uses the keyword `interface` instead of `class`:\n\
    \n```\npublic interface InterfaceName {\n```\n\n```\n // field declarations (must\
    \ be static final)\n```\n\n```\n // method declarations\n```\n\n```\n}\n```\n\n\
    All declarations inside an interface are assumed to be public. Interfaces may\
    \ also define nested classes and other interfaces, but those techniques are beyond\
    \ the scope of this text.\n\n[Listing 3.1](#K20431_C003.xhtml_lis3.1) shows how\
    \ to write the Integer Stack ADT from [Table 3.1](#K20431_C003.xhtml_Text_Anchor_tab3.1)\
    \ as a Java interface.\n\nListing 3.1: Integer Stack Interface\n\n```\n1 public\
    \ interface IntStack {\n```\n\n```\n2 boolean isEmpty();\n```\n\n```\n3 int peek();\n\
    ```\n\n```\n4 int pop();\n```\n\n```\n5 void push(int item);\n```\n\n```\n6 int\
    \ size();\n```\n\n```\n7}\n```\n\nNormally, documentation comments would be included\
    \ in [Listing 3.1](#K20431_C003.xhtml_lis3.1) to explain what each method is intended\
    \ to do. Then `javadoc` would convert those comments into a form like [Table 3.1](#K20431_C003.xhtml_Text_Anchor_tab3.1).\
    \ We omit documentation comments to help focus attention on the code.\n\n## Interface\
    \ Types\n\nInterfaces define new data types in Java, much like classes. Interface\
    \ types fall into the family of reference types:\n\n![image](image/f0050-01.png)\n\
    \nOne of the main purposes of an interface like `IntStack` is to use the type\
    \ to declare variables. The declaration\n\n```\n IntStack s;\n```\n\nallows `s`\
    \ to call any of the methods in `IntStack`. However, because it contains no implementation\
    \ code, an interface may not be used to create objects. That means `s` cannot\
    \ call any methods until it refers to an object that implements the interface.\n\
    \n## Classes Implement Interfaces\n\nClasses that implement an interface must\
    \ provide all of the methods listed in the interface, and those methods must be\
    \ declared public. The syntax to declare that a class implements an interface\
    \ uses the `implements` keyword:\n\n```\npublic class ClassName implements InterfaceName\
    \ {...}\n```\n\nA class may implement more than one interface by separating the\
    \ interface names with commas.\n\nOnce a class implements an interface, it can\
    \ be used to create objects that interface variables refer to. For example, if\
    \ the class `IntArrayStack` implements `IntStack`, then this is valid:\n\n```\n\
    \ IntStack s = new IntArrayStack();\n```\n\n```\n s.push(10);\n```\n\n```\n System.out.println(s.pop());\
    \ // output 10\n```\n\nIf the `IntArrayStack` class has public members other than\
    \ in the interface, the variable `s` cannot use them because it was declared with\
    \ type `IntStack`.\n\n## Programming to Interfaces\n\nIn general, try to declare\
    \ variables with interface types rather than class types. This technique, known\
    \ as programming to the interface, allows greater flexibility because it does\
    \ not tie your code down to particular implementations. If you declare variables\
    \ with interface types, then changing to a new implementation for that variable\
    \ reference is usually just a matter of calling a different constructor, such\
    \ as:\n\n```\n IntStack s = new IntLinkedStack();\n```\n\nNo subsequent code using\
    \ `s` should have to change because it is already using the interface.\n\n## Exercises\n\
    \n1. Show the results of these operations on an initially empty `IntStack s`.\
    \ Draw the stack contents after each operation, making clear where the top is,\
    \ and indicate the return value of all non-void methods.\n\n    1. (a) `s.push(5)`\n\
    \n        `s.push(8)`\n\n        `s.peek()`\n\n        `s.push(3)`\n\n       \
    \ `s.pop()`\n\n        `s.push(10)`\n\n        `s.size()`\n\n        `s.push(4)`\n\
    \n        `s.pop()`\n\n        `s.pop()`\n\n        `s.isEmpty()`\n\n    2. (b)\
    \ `s.push(1)`\n\n        `s.pop()`\n\n        `s.push(2)`\n\n        `s.peek()`\n\
    \n        `s.pop()`\n\n        `s.push(3)`\n\n        `s.size()`\n\n        `s.pop()`\n\
    \n        `s.push(4)`\n\n        `s.pop()`\n\n        `s.isEmpty()`\n\n    3.\
    \ (c) `s.push(10)`\n\n        `s.push(20)`\n\n        `s.push(30)`\n\n       \
    \ `s.peek()`\n\n        `s.push(40)`\n\n        `s.push(50)`\n\n        `s.size()`\n\
    \n        `s.pop()`\n\n        `s.pop()`\n\n        `s.pop()`\n\n        `s.isEmpty()`\n\
    \n2. Decide whether or not a stack would be an appropriate data structure for\
    \ each of these types of task lists. Assume that when a new task arrives, it would\
    \ be `pushed`, and when a task is chosen to work on, it would be `popped`. Explain\
    \ your answers.\n\n    1. (a) Tasks that may need to be done in any order.\n\n\
    \    2. (b) Tasks where the next one to work on is always the one that has been\
    \ waiting the longest.\n\n    3. (c) Tasks where the next one to work on is always\
    \ the most recently received.\n\n    4. (d) Tasks that need to be done in the\
    \ order they are received.\n\n    5. (e) Tasks that need to be shuffled.\n\n3.\
    \ Explain the difference between a class and an interface in your words.\n\n4.\
    \ Suppose `IntArrayStack` and `IntLinkedStack` implement the `IntStack` interface.\
    \ Write Java statement for each of these tasks:\n\n    1. (a) Declare `s` to be\
    \ `IntStack`.\n\n    2. (b) Set `s` to refer to new `IntLinkedStack`.\n\n    3.\
    \ (c) Declare `t` to be `IntArrayStack`.\n\n5. Suppose `s` refers to `IntStack`\
    \ object. Write Java code to accomplish these tasks:\n\n    1. (a) Add the value\
    \ `100` to the top of `s`.\n\n    2. (b) Remove and print the value at the top\
    \ of `s`.\n\n    3. (c) Print the value at the top of `s` without removing it.\n\
    \n    4. (d) Remove every item in `s` until it is empty.\n\n6. Write a Java interface\
    \ named `Runnable` with one void method `run` that takes no parameters.\n\n7.\
    \ Write a Java interface named `Queue` with two methods: a void method `enqueue`\
    \ that takes `int` parameter, and a method `dequeue` with no parameters that returns\
    \ `int`.\n\n8. Suppose `LinkedQueue` and `ArrayQueue` both implement the `Queue`\
    \ interface. Write single Java statements for each of these:\n\n    1. (a) Declare\
    \ `q1` that refers to new `ArrayQueue`.\n\n    2. (b) Declare `q2` that refers\
    \ to new `LinkedQueue`.\n\n    3. (c) Call `enqueue` on `q1` with the value `19`.\n\
    \n    4. (d) Store the result of calling `dequeue` on `q2` in variable `result`.\n\
    \n## 3.2 Array Implementation\n\nIn this section and the next, we write two different\
    \ implementations of `IntStack`. The first uses an array.\n\nSuppose we plan to\
    \ use an array to store the contents of a stack, and that we begin with an empty\
    \ stack and push the integers 10, 20, and 30 (in that order). Then there are two\
    \ natural options: store the top element at the front of the array or in the back.\n\
    \nTop at front\n\n![image](image/f0052-01.png)\n\nTop in back\n\n![image](image/f0053-01.png)\n\
    \nTo get a feel for how these two options work, suppose the next operation is\
    \ to push 40.\n\nTop at front The existing items have to shift to make room for\
    \ the new element:\n\n![image](image/f0053-02.png)\n\n> Shifting (and therefore\
    \ pushing) takes O(n) time, because each element has to move one space to the\
    \ right. Popping is also O(n) because after removing the top, the remaining elements\
    \ have each shift one space left. Notice that it may also be difficult to know\
    \ when the stack is empty.\n\nTop in back In this case, 40 can go directly to\
    \ slot 3:\n\n![image](image/f0053-03.png)\n\n> This takes O(1) time, as does popping,\
    \ because no shifting is required. The stack is empty whenever `top` is −1.\n\n\
    Given its superior performance, [Listing 3.2](#K20431_C003.xhtml_lis3.2) begins\
    \ the implementation of an integer stack using the second approach. As is, it\
    \ will not compile because the class does not completely implement the `IntStack`\
    \ interface. You will be asked to complete the `IntArrayStack` class in the exercises.\n\
    \n### Throwing Exceptions\n"
