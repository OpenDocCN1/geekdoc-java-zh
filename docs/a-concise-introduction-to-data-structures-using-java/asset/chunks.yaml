    \ Tasks that may need to be done in any order.\n\n    2.  (b) Tasks where the\
    \ next one to work on is always the one that has been waiting the longest.\n\n\
    \    3.  (c) Tasks where the next one to work on is always the most recently received.\n\
    \n    4.  (d) Tasks that need to be done in the order they are received.\n\n \
    \   5.  (e) Tasks that may need to be shuffled or sorted.\n\n4.  Write a generic\
    \ Java interface `List<E>` for the `List` ADT.\n\n5.  Suppose `ArrayList<E>` implements\
    \ the `List<E>` interface from Exercise 4.\n\n    1.  (a) Write Java code to declare\
    \ and create an integer array list `items`, and then add the values 0 through\
    \ 9 to `items` (in that order) so that they are stored in increasing order.\n\n\
    \    2.  (b) Write Java code to declare and create an integer array list `items`,\
    \ and then add the values 0 through 9 to `items` (in that order) so that they\
    \ are stored in decreasing order.\n\n6.  Describe how to implement `push` and\
    \ `pop` operations for a stack using the `List` ADT, trying to avoid shifting\
    \ elements if at all possible. If it is not possible to avoid shifting, explain\
    \ why.\n\n7.  Describe how to implement `enqueue` and `dequeue` operations for\
    \ a queue using the `List` ADT, trying to avoid shifting elements if at all possible.\
    \ If it is not possible to avoid shifting, explain why.\n\n## 6.2 Array Implementation\n\
    \nWith its emphasis on indexing, an array implementation of the `List` ADT should\
    \ seem natural. The `add()` method developed below illustrates how to address\
    \ two issues that did not arise with stacks and queues: checking indices and shifting\
    \ to make room for the new item. Exercises ask you to finish the `ArrayList` implementation.\n\
    \n### Index Checking\n\nBy design, elements in a list have indices 0 through the\
    \ one less than the current size. Therefore, every method in the `List` ADT with\
    \ an index parameter has the responsibility to check that the index is valid before\
    \ performing its operation. Any invalid index should result in an `IndexOutOfBoundsException`.\n\
    \nThe `add()` method is slightly different than other methods that only access\
    \ existing elements, since it is allowed to use the size of the list as an index.\n\
    \n### Shifting in an ArrayList\n\nTwo types of shifting are needed in an array\
    \ list: making room for a new item in `add()`, and closing the gap created by\
    \ `removeAt()`. To get the code right, pay attention to where the open slot is\
    \ and decide which element has to move first.\n\nFor `add(index, item)`, assuming\
    \ there is room for the new item, the opening is on the right, and so the item\
    \ in slot `size - 1` has to move first:\n\n![image/109x01.png]\n\nThis suggests\
    \ starting the loop at `size - 1` and decrementing:\n\n```\nfor (int i = size\
    \ - 1; i >= index; i--) {\n    data[i + 1] = data[i];\n}\n```\n\nIn that case,\
    \ `i` represents the index being copied. To close the gap in `removeAt(index)`,\
    \ the opposite needs to happen:\n\n![image/109x02.png]\n\nIn this case, the opening\
    \ is on the left, and the item at `index + 1` needs to move first. This demonstrates\
    \ index checking for the `add()` method.\n\n```\npublic void add(int index, E\
    \ item) {\n    if (index < 0 || index > size) {\n        throw new IndexOutOfBoundsException();\n\
    \    }\n    if (size == data.length) {\n        resize(2 * data.length);\n   \
    \ }\n    // shift right to make space\n    for (int i = size - 1; i >= index;\
    \ i--) {\n        data[i + 1] = data[i];\n    }\n    data[index] = item;\n   \
    \ size++;\n}\n```\n\n### Exercises\n\n1.  Explain how the array list `add()` works\
    \ when `index` equals `size`; i.e., when adding to the end of the list.\n\n2.\
    \  Develop the `ArrayList<E>` class implementing the `List<E>` interface by writing\
    \ these methods:\n\n    1.  (a) `add(item)`: Double the length of the array if\
    \ it is full.\n\n    2.  (b) `get()`\n\n    3.  (c) `indexOf()`: Use linear search\
    \ to find the first occurrence of the item.\n\n    4.  (d) `isEmpty()`\n\n   \
    \ 5.  (e) `removeAt()`: Set the obsolete reference (see page 71) to `null`.\n\n\
    \    6.  (f) `set()`\n\n3.  Exercise 2a can be written in two ways, either from\
    \ scratch or by calling the `add()` method. Write both versions and discuss the\
    \ differences.\n\n4.  Modify the `removeAt()` method from Exercise 2e to reduce\
    \ the array length by half if the number of elements in the list is less than\
    \ or equal to one-fourth the current length of the array, but do not let the array\
    \ have a length smaller than 10.\n\n5.  Override the `toString()` method in the\
    \ `ArrayList` class by calling the `toString()` method of each element and accumulating\
    \ the results in a `StringBuilder`.\n\n6.  In the previous exercise, explain how\
    \ you know `toString()` can be called on every list item if the list is generic.\n\
    \n7.  Add a `main()` method to the `ArrayList` class to test the list with:\n\n\
    \    1.  (a) Integers\n\n    2.  (b) Doubles\n\n    3.  (c) Strings\n\n8.  Determine\
    \ the O() performance of each of these `ArrayList` methods. Explain your answers.\n\
    \n    1.  (a) `add(item)`: Ignore resizing.\n\n    2.  (b) `add(index, item)`:\
    \ Ignore resizing.\n\n    3.  (c) `get()`\n\n    4.  (d) `indexOf()`\n\n    5.\
    \  (e) `isEmpty()`\n\n    6.  (f) `removeAt()`: Ignore resizing from Exercise\
