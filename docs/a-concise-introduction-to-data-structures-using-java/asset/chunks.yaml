    \    ```java\n    for (int i = 0; i < n; i++) {\n        items.add(i);\n    }\n\
    \    ```\n    2. (b)\n    ```java\n    for (int i = 0; i < n; i++) {\n       \
    \ items.add(0, i);\n    }\n    ```\n\n## 6.4 迭代器\n\n节 6.3 中的练习 10a 暴露了 `LinkedList`\
    \ 实现中一个意外之外的缺陷：尽管遍历链表是高效的，但如果我们在 `for` 循环中使用 `get()`，就会变得低效。换句话说，`LinkedList`\
    \ 的公共接口没有提供高效遍历列表的方法。迭代器允许我们解决这个问题，并支持 Java 的增强型 for 循环。\n\n### 迭代器 (Iterators)\n\
    \nJava 迭代器是一个设计用于遍历集合中项的对象。表 6.2 中的 `java.util.Iterator` 接口定义了迭代器的功能。\n\n表 6.2：`java.util.Iterator`\
    \ 接口\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `boolean hasNext()` | 如果迭代器还有另一个元素，则返回\
    \ true。 |\n| `E next()` | 返回下一个元素并使迭代器前进。 |\n| `void remove()` | （可选）删除 `next()`\
    \ 返回的最后一个元素。每次调用 `next()` 只能调用一次。 |\n\n使用迭代器的代码应该在调用 `next()` 之前调用 `hasNext()`，以确保有可用元素。如果当\
    \ `hasNext()` 为 false 时调用 `next()`，则会抛出 `java.util.NoSuchElementException`。不支持\
    \ `remove()` 方法的迭代器必须让 `remove()` 方法抛出 `UnsupportedOperationException`。\n\n###\
    \ 可迭代对象 (Iterables)\n\n可以提供迭代器的集合被称为“可迭代的”（iterable），并实现了表 6.3 中的 `Iterable` 接口。这意味着它提供了一个公共的\
    \ `iterator()` 方法，返回一个实现了 `Iterator<E>` 接口的对象。该对象通常由私有内部类定义。\n\n表 6.3：`Iterable`\
    \ 接口 \n\n| 方法 | 说明 |\n| :--- | :--- |\n| `Iterator<E> iterator()` | 返回此集合的迭代器。\
    \ |\n\n可迭代对象的术语可能很难理解，尤其是刚开始时。为链表开发特定的迭代器将会有帮助。\n\n### 链表迭代器 (Linked List Iterator)\n\
    \n反复调用 `get()` 来遍历链表的问题在于，`getNode()` 每次都必须从列表开头重新开始。链表迭代器将通过记住当前所在的位置来避免这个问题。\n\
    \n迭代器将是一个与列表独立的对象，带有一个指向列表的指针。为了简单起见，显示了单链。\n\n![image](img/119x001.png)\n\n为了实现这一点，`LinkedListIterator`\
    \ 类需要一个实例变量 `next`，它是指向列表中下一个项的引用。它的方法如下（参见表 6.2 中的接口）：\n\n`LinkedListIterator`\
    \ 类需要一个实例变量 `next`，它是指向列表中下一个项的引用。它的方法将是（参见[表 6.2]中的接口）：\n\n`next()` 将获取元素，将 `next`\
    \ 移动到下一个，然后返回结果。`hasNext()` 将测试 `next` 是否不空。列表 6.3 显示了如何将这些部分组合在一起。\n\n列表 6.3：列表迭代器\n\
    \n```java\nimport java.util.Iterator;\n\npublic Iterator<E> iterator() {\n   \
    \ return new LinkedListIterator();\n}\n\nprivate class LinkedListIterator implements\
    \ Iterator<E> {\n    private Node<E> next = head.next; // 跳过哑节点\n\n    public\
    \ boolean hasNext() {\n        return next != null;\n    }\n\n    public E next()\
    \ {\n        if (!hasNext()) throw new NoSuchElementException();\n        E result\
    \ = next.data;\n        next = next.next;\n        return result;\n    }\n\n \
    \   public void remove() {\n        throw new UnsupportedOperationException();\n\
    \    }\n}\n```\n\n### 隐私问题 (Privacy Issues)\n\n迭代器可以这样拥有列表的指针似乎很奇怪。之所以有效，部分是迭代器类嵌套在列表类内部；换句话说，外部类无法这样做。第二个注意点是迭代器类也是私有的，因此外部世界只能通过公共\
    \ `iterator()` 方法访问迭代器。该方法和迭代器公共接口严格控制了迭代器的使用方式。\n\n这里还使用了一种新机制允许迭代器访问链表的节点：迭代器类不是静态的。这是我们第一个内部类的示例。\n\
    \n### 内部类 (Inner Classes)\n\n从节 3.3 回顾，我们的嵌套类被声明为静态，是因为它们不需要访问包含类的任何实例变量。你可能已经注意到列表\
    \ 6.3 中的嵌套类不是静态的。内部类是非静态嵌套类，它确实可以访问包含对象的实例变量。在[列表 6.3]中，迭代器需要访问链表的头部，因此它必须是内部类而不是静态嵌套类。\n\
    \n### 扩展接口 (Extending Interfaces)\n\n另一个点对于完成此实现非常有用。回顾（参见第 50 页）一个类可以实现多个接口，因此我们可以这样指示\
    \ `LinkedList` 实现了 `Iterable`：\n\n```java\npublic class LinkedList<E> implements\
    \ List<E>, Iterable<E> ...\n```\n"
- fmt: "\nHowever, it is reasonable to expect all lists to be iterable, and this can\
    \ be done with interface inheritance. The `extends` keyword allows interfaces\
    \ to inherit from each other in the same way as classes:\n\n```\npublic interface\
    \ SubInterface extends SuperInterface {...}\n```\n\nThe subinterface inherits\
    \ all methods from the superinterface and then adds new methods of its own. Therefore,\
    \ to require all lists to be iterable, we extend the interface:\n\n```java\n public\
    \ interface List<E> extends Iterable<E> {...}\n```\n\n### Using Iterators\n\n\
    The motivation for creating an iterator was the inefficiency of this loop for\
    \ a linked list:\n\n```\n for (int i = 0; i < items.size(); i++) {\n System.out.println(items.get(i));\n\
    \ }\n```\n\nRewriting the loop to use an iterator looks like this, assuming `items`\
    \ is an `Integer` list:\n\n```\n Iterator<Integer> it = items.iterator();\n while\
    \ (it.hasNext()) {\n System.out.println(it.next());\n }\n```\n\nThis provides\
    \ the `O(n)` traversal we were seeking. It is a common enough task that Java provides\
    \ the enhanced for-loop (see page 18) for even more convenience. The same loop\
    \ can be written as:\n\n```\n for (Integer item : items) {\n System.out.println(item);\n\
    \ }\n```\n\nThe enhanced for uses the `iterator` to get the same `O(n)` performance\
    \ while hiding all of the iterator details. All that is required to use it is\
    \ that the object have an `iterator()` method, which is the same as implementing\
    \ the `Iterable` interface ([Table 6.3](#K20431_C006.xhtml_Text_Anchor_tab6.3)).\n\
    \n### Exercises\n\n1. Explain why a linked list iterator allows traversing the\
    \ list in `O(n)` time.\n2. Modify the `List<E>` interface to extend `Iterable<E>`.\n\
    3. Incorporate the modifications in this section to the `LinkedList` class so\
    \ that it implements the `Iterable` interface. Test the implementation by explicitly\
    \ using the iterator and with an enhanced for-loop.\n4. Without an iterator, an\
    \ `ArrayList` already provides efficient traversals of its elements. Even so,\
    \ describe an advantage of modifying `ArrayList` to support the `Iterable` interface.\n\
    5. Modify the `ArrayList` class from [Section 6.2](#K20431_C006.xhtml_ch6.2) to\
    \ support the `Iterable` interface. Test the implementation with an enhanced for-loop.\
    \ Hint: draw a diagram like the one on page 119 and follow the steps used there\
    \ for linked lists.\n\n# Chapter 7\n\n# Recursion\n\n## 7.1 Mathematical Functions\n\
    \nConsider the factorial function:\n\n$n! = n \\cdot (n - 1) \\cdot (n - 2) \\\
    cdots 2 \\cdot 1$\n\nThe “$\\dots$” in this expression is a bit informal, even\
    \ though we intuitively know what it means. One way to precisely define factorial\
    \ looks like this:\n\n$n! = \\left\\{ \\begin{matrix} 1 & {\\text{if}n = 0} \\\
    \\ {n \\cdot (n - 1)} & {\\text{if}n > 0} \\end{matrix} \\right.$\n\nIf we use\
    \ this definition to evaluate $3!$, it unravels like this:\n\n$\\begin{array}{l}\
    \ \\begin{array}{lll} {\\text{3}!} & = & {\\text{3} \\cdot \\text{2}!} \\\\ &\
    \ = & {\\text{3} \\cdot \\text{(2} \\cdot \\text{1}!\\text{)}} \\\\ & = & {\\\
    text{3} \\cdot \\text{(2} \\cdot \\text{(1} \\cdot \\text{0}!\\text{))}} \\end{array}\
    \ \\\\ {\\begin{array}{lll} & = & 3 \\end{array} \\cdot (2 \\cdot (1 \\cdot 1))\\\
    begin{array}{lll} & = & 6 \\end{array}} \\end{array}$\n\nNotice that the first\
    \ part of the definition causes the unraveling to stop.\n\nThis definition is\
    \ recursive because it defines factorial in terms of another factorial; in this\
    \ case, $n!$ is defined in terms of $(n-1)!$. Recursive definitions have two key\
    \ features:\n\n- **Recursive steps use smaller arguments.** In this example, the\
    \ factorial of $n$ is computed using the smaller argument $n - 1$.\n- **Base cases\
    \ cause recursion to stop.** Here, the base case is that $0!$ is defined to be\
    \ $1$. There is never any recursion in a base case—that is what causes the recursion\
    \ to stop. More than one base case may be necessary if the recursive step uses\
    \ more than one smaller argument.\n\n### Recursive Functions in Java\n\nLike most\
    \ modern programming languages, Java supports recursion by allowing functions\
    \ to call themselves. In fact, the mathematical definition of $n!$ above translates\
    \ almost directly into the Java of [Listing 7.1](#K20431_C007.xhtml_lis7.1).\n\
    \nListing 7.1: Recursive Factorial\n\n```java\n 1 public class Recursion {\n 2\
    \ public static int factorial(int n) {\n 3   if (n <= 1) return 1;\n 4   return\
    \ n * factorial(n - 1);\n 5}\n 6}\n```\n\nIn code, base cases are normally tested\
    \ first.\n\n### Tracing Recursive Calls\n\nTracing a recursive function is like\
    \ unraveling the mathematical definition, except in this case we stop earlier:\n\
    \n![image/124x001.png)\n\nWhen `factorial(1)` returns 1, that allows the call\
    \ `factorial(2)` to return 2.\n\n![image/124x002.png)\n\nwhich then allows the\
    \ call `factorial(3)` to return 6.\n\n### Natural Recursions\n\nThe following\
    \ structures are natural for recursion because they can be defined recursively:\n\
    \n- Natural numbers (the nonnegative integers) usually call themselves on smaller\
    \ values.\n- Strings usually call themselves on substrings.\n- Lists usually call\
    \ themselves on sublists.\n- Linked lists via the `next` pointer.\n\nAny object\
    \ types in Java used for recursion usually include a test for null. Trees are\
    \ another naturally recursive structure we will study in [Chapter 8](#K20431_C008.xhtml_ch8).\n\
    \n### Exercises\n\n1. Use this recursive definition of `add(m, n)` to: $\\text{add}(m,n)\
    \ = \\left\\{ \\begin{matrix} m & {\\text{if}n = 0} \\\\ {m + \\text{add}(m,n\
    \ - 1)} & {\\text{if}n > 0} \\end{matrix} \\right.$\n   - (a) Trace the call `add(1,\
    \ 3)`\n   - (b) Implement `add(m, n)` as a recursive function for integers m and\
    \ n.\n2. Use this recursive definition of `mul(m, n)` to: $\\text{mul}(m,n) =\
    \ \\left\\{ \\begin{matrix} 0 & {\\text{if}n = 0} \\\\ {m \\cdot \\text{mul}(m,n\
    \ - 1)} & {\\text{if}n > 0} \\end{matrix} \\right.$\n   - (a) Trace the call `mul(2,\
    \ 4)`\n   - (b) Implement `mul(m, n)` as a recursive function for integers m and\
    \ n.\n3. Use this recursive definition of `pow(m, n)` to: $\\text{pow}(m,n) =\
    \ \\left\\{ \\begin{matrix} 1 & {\\text{if}n = 0} \\\\ {m \\cdot \\text{pow}(m,n\
    \ - 1)}} & {\\text{if}n > 0} \\end{matrix} \\right.$\n   - (a) Trace the call\
    \ `pow(3, 3)`\n   - (b) Implement `pow(m, n)` as a recursive function for integers\
    \ m and n.\n4. Write a recursive Java function `length(s)` that computes the length\
    \ of the string `s`.\n5. Write a recursive Java function `reverse(s)` that returns\
    \ the string `s` in reverse.\n6. Write a recursive Java function `fib(n)` that\
    \ computes the nth term in the Fibonacci sequence ![image/125x004.png] where each\
    \ term is the sum of the two before it.\n7. Write a recursive Java function to\
    \ implement Euclid’s algorithm for computing the greatest common divisor `gcd(m,\
    \ n)`, which is the largest integer k dividing both m and n. (See also Exercise\
    \ 8 in [Section 1.1](#K20431_C001.xhtml_ch1.1).) The recursive version of Euclid’s\
    \ algorithm is based on these two facts:\n   - `gcd(m, n) = gcd(n, m mod n)`\n\
    \   - `gcd(m, 0) - m`\n   Notice that `m mod n` is always less than `n`.\n8. Write\
    \ a recursive Java function `bits(n)` that returns a string representing the nonnegative\
    \ integer `n` in binary. Hint: the last bit is `n % 2`, and you can get the other\
    \ bits with recursion on `n / 2`. You may need more than one base case.\n\n##\
    \ 7.2 Visualizing Recursion\n"
