    \ to finish the implementation.\n\nListing 8.2: Binary Tree\n\n```\n 1 public\
    \ abstract class BinaryTree<E> {\n```\n\n```\n 2  protected Node<E> root;\n```\n\
    \n```\n 3\n```\n\n```\n 4  public String preorder() {\n```\n\n```\n 5 return preorder(root);\n\
