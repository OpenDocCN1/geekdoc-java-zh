    \n9.  Draw a binary tree with five nodes that is its own associated general tree\
    \ using the left child/right sibling convention.\n\n## 8.2 Traversals\n\nRecall\
    \ that a tree has a root and then some number of children, each of which is itself\
    \ the root of a subtree. This recursive structure—that trees are built from subcomponents\
    \ that are also trees—leads to recursive traversal methods for binary trees. As\
    \ with linked lists (see [Section 6.3](#K20431_C006.xhtml_ch6.3)), a traversal\
    \ of a tree is a method that visits every node in the tree.\n\n### Depth-First\n\
    \nIf the tree is binary, then there are three ways to naturally order the steps\
    \ of a recursive traversal, depending on when the node itself is visited:\n\n\
    Preorder (node, left, right) visits the node, traverses the left subtree, and\
    \ traverses the right subtree.\n\nInorder (left, node, right) traverses the left\
    \ subtree, visits the node, and traverses the right subtree.\n\nPostorder (left,\
    \ right, node) traverses the left subtree, traverses the right subtree, and visits\
    \ the node.\n\nVisiting a node just refers to whatever a method needs to do with\
    \ each node, such as printing, counting, or modifying the node.\n\nEach of these\
    \ traversals is depth-first because it traverses all the way down some branch\
    \ before backtracking to reach other nodes. Depth-first traversals may be defined\
    \ for other trees, as well, but we limit our use to binary trees.\n\nExample\n\
    \nConsider this binary tree:\n\n![image](image/142x001.png)\n\nBy hand, the preorder\
    \ traversal is probably easiest because nodes are visited first as you reach each\
    \ subtree:\n\n![image](image/142x002.png)\n\nInorder traversal, on the other hand,\
    \ benefits from a top-down view:\n\n![image](image/143x001.png)\n\nIf you write\
    \ inorder traversals from beginning to end rather than top-down, then you need\
    \ to keep track of when subtrees are finished. For example, after node 54, when\
    \ the left subtree of 19 is finished, then you need to remember to visit the 19\
    \ node. Postorder is similar to inorder except that the node itself comes last:\n\
    \n![image](image/143x002.png)\n\n### Breadth-First\n\nA breadth-first traversal\
    \ visits nodes in level order: level 1 first, then level 2, and so on. Like preorder\
    \ traversals, the root will always be visited first in a breadth-first traversal.\
    \ Breadth-first traversals are not naturally recursive. In fact, relative to the\
    \ connections that exist between parents and children, a breadth-first traversal\
    \ appears to jump around the tree.\n\nUsing a queue to keep track of the next\
    \ nodes to visit leads to the nice algorithm in [Listing 8.1](#K20431_C008.xhtml_lis8.1).\
    \ Because any number of children may be enqueued in step 4, the breadth-first\
    \ traversal algorithm may be used with any tree.\n\nListing 8.1: Breadth-First\
    \ Traversal (Pseudocode)\n\n```\n 1 Enqueue root\n```\n\n```\n 2 While queue is\
    \ not empty\n```\n\n```\n 3  Dequeue and visit node\n```\n\n```\n 4  Enqueue children\
    \ of node\n```\n\nExample\n\nBreadth-first traversals are easy by hand because\
    \ you just trace across the levels. To see how the queue works in [Listing 8.1](#K20431_C008.xhtml_lis8.1),\
    \ consider this small binary tree: 41\n\n![image](image/143x003.png)\n\nThen the\
    \ sequence of operations looks like this:\n\n| Dequeue and Visit | Enqueue | Queue\
    \ Contents |\n\n| --- | --- | --- |\n\n|  | 41 | 41 |\n\n| 41 | 32, 15 | 32, 15\
    \ |\n\n| 32 | 40, 3 | 15, 40, 3 |\n\n| 15 | 8 | 40, 3, 8 |\n\n| 40 |  | 3, 8 |\n\
    \n| 3 |  | 8 |\n\n| 8 |  |  |\n\nExercises\n\n1.  Describe the base case for the\
    \ three recursive depth-first traversals.\n\n2.  List the order in which nodes\
    \ are visited using each of these traversals on the tree below:\n\n    ![image](image/144x001.png)\n\
    \n    1.  (a) Preorder\n\n    2.  (b) Inorder\n\n    3.  (c) Postorder\n\n   \
    \ 4.  (d) Breadth-first Show how the queue contents change using [Listing 8.1](#K20431_C008.xhtml_lis8.1),\
    \ as in the example above.\n\n3.  List the order in which nodes are visited using\
    \ each of these traversals on the tree below:\n\n    ![image](image/144x002.png)\n\
    \n    1.  (a) Preorder\n\n    2.  (b) Inorder\n\n    3.  (c) Postorder\n\n   \
    \ 4.  (d) Breadth-first Show how the queue contents change using [Listing 8.1](#K20431_C008.xhtml_lis8.1),\
    \ as in the example on page 143.\n\n4.  Give preorder, postorder, and inorder\
    \ traversals of your answers to Exercise 3 from [Section 8.1](#K20431_C008.xhtml_ch8.1).\n\
    \n5.  Describe the effect of each of the depth-first traversals on a binary expression\
    \ tree.\n\n6.  Draw a binary expression tree corresponding to each of these:\n\
    \n    1.  (a) Postorder traversal is: a b c d e * + / -\n\n    2.  (b) Postorder\
    \ traversal is: a b * c + d e / -\n\n    3.  (c) Preorder traversal is: / - a\
    \ b * + c d e\n\n    4.  (d) Preorder traversal is: + - a * b c / d e\n\n7.  Give\
    \ preorder, postorder, and inorder traversals of your answers to Exercise 4 from\
    \ [Section 8.1](#K20431_C008.xhtml_ch8.1).\n\n8.  Describe the effect of an inorder\
    \ traversal on a binary search tree.\n\n9.  Draw a binary search tree corresponding\
    \ to each of these:\n\n    1.  (a) Breadth-first traversal is: 142 41 191 752\
    \ 532 787 408 743 962 373\n\n    2.  (b) Breadth-first traversal is: 81 26 561\
    \ 509 921 265 586 899 693 779\n\n    3.  (c) Breadth-first traversal is: 654 209\
    \ 833 208 318 679 99 521 422 461\n\n10.  [Listing 8.1](#K20431_C008.xhtml_lis8.1)\
    \ shows how a queue is used for a breadth-first traversal. Is there a natural\
    \ role for a stack in the depth-first traversals? If so, describe it; if not,\
    \ explain why not.\n\n## 8.3 Binary Tree Abstract Class\n\nAs a prelude to implementing\
    \ binary search trees in [Chapter 9](#K20431_C009.xhtml_ch9), this section develops\
    \ a general BinaryTree class to represent any binary tree. It defines the basic\
    \ structure common to any binary tree: a root, a node structure, and traversal\
    \ methods. However, it will not be used for creating objects. It is designed only\
    \ to be extended by more specific classes like BinarySearchTree.\n\n[Table 8.1](#K20431_C008.xhtml_Text_Anchor_tab8.1)\
    \ gives the public API of the BinaryTree class. (Since BinaryTree is a class and\
    \ not an interface, we are not considering it an ADT.) The toString() method will\
    \ also be overridden to return one of these traversals.\n\nTable 8.1\n\nBinary\
    \ Tree API\n\n| String breadthFirst()Returns breadth-first traversal of this tree.\
    \ |\n\n| String inorder()Returns preorder traversal of this tree. |\n\n| String\
    \ preorder()Returns preorder traversal of this tree. |\n\n| String postorder()Returns\
    \ preorder traversal of this tree. |\n\n### Abstract Classes\n\nJava abstract\
    \ classes are intended for exactly this purpose: providing part of a class implementation\
    \ but not a complete one. An abstract class may not be used to create objects;\
    \ it can only be extended via inheritance. Objects are created by concrete classes\
    \ that extend the abstract class and are not abstract themselves.\n\nThe syntax\
    \ for declaring an abstract class is to include the abstract keyword as a modifier\
    \ in the class definition:\n\n```\npublic abstract class AbstractClass {...}\n\
    ```\n\nAbstract classes may be generic and include type parameters. They may define\
    \ fields, methods, and constructors, although constructors are usually declared\
    \ protected because they are not meant to be called directly. In fact, protected\
    \ visibility is common in abstract classes because they are designed to be extended.\n\
    \n### Binary Tree Class\n\n[Listing 8.2](#K20431_C008.xhtml_lis8.2) begins the\
    \ BinaryTree implementation as an abstract class. Notice its use of all three\
    \ levels of visibility. The root and Node class (along with the components of\
    \ the Node class) are protected so they can be used by subclasses. The preorder()\
    \ method is part of the public interface and acts as a wrapper to call a private\
    \ recursive function. Not even subclasses have a need to know about the private\
    \ recursive function."
