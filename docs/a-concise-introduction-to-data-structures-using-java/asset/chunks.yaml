    \ \\end{matrix} < \\text{valueatp} < \\begin{matrix} \\text{Everyvaluein} \\\\\
    \ \\text{rightsubtreeofp} \\end{matrix}$\n\nThe recursive algorithm for searching\
    \ a binary search tree is based on comparing the search key to a node’s data value,\
    \ beginning at the root. If the key matches the node’s data value, it is found;\
