  trans: "\n此表达式的类型必须与方法的返回类型兼容。当遇到 `return` 语句时，方法将立即停止执行并将表达式的值返回给其调用者。由于这种行为，在\
    \ `void` 方法中可以使用不带表达式的 `return` 语句返回到调用者处，而无需执行方法内的任何后续代码。\n\n方法参数（如 `factorial()`\
    \ 中的 `n`）必须声明它们的类型。参数是通过值传递的，这意味着方法接收的是作为参数传递的值的副本。对于原始数据类型，这意味着方法可以修改其参数的副本而不影响调用者。引用参数将在将在第\
    \ 1.4 节中简要讨论。\n\n由于 Java 代码需要包含在类定义内部，因此无法在类之外定义函数（这在 C 或 Python 等语言中是很常见的）。如果你发现自己想在\
    \ Java 中写一个独立函数，那么通常你想要写的是一个静态方法，例如列表 1.1 中的 `factorial()` 和 `main()`。声明这些方法为\
    \ `static` 的原因将在第 1.5 节中解释。\n\n### 注释\n\nJava 注释有三种：\n\n包含在 `/*` 和 `*/` 之间的多行文本会被编译器忽略，用于阅读你代码的人。\n\
    \n文档多行注释：以 `/**` 开头的多行注释是文档注释，用于描述随后的类或方法。\n\n单行注释：跟在 `//` 之后到行尾的任何文本都被视为注释，通常用于解释一小段代码。\n\
    \n`jjavadoc` 工具将文档注释转换为与 Java 库文档风格相同的 Web 页面。本文未包含文档注释，以便代码本身更易读。\n\n### 编译和运行\
    \ Java 程序\n\n要运行列表 1.1，请将代码保存为名为 `NumericFunctions.java` 的文件。使用以下命令将此 Java 源代码编译为\
    \ Java 字节码：\n\n```\n % javac NumericFunctions.java\n```\n\n字节码类似于低级机器语言，不同之处在于它由针对\
    \ Java 虚拟机（JVM）而非特定 CPU 的指令组成。编译器将生成的字节码存储在名为 `NumericFunctions.class` 的文件中。一旦创建了此字节码文件，就可以可以使用命令执行程序：\n\
    \n```\n % java NumericFunctions\n```\n\n这将自动调用来自 `NumericFunctions` 类的 `main()`\
    \ 方法，只要该方法被声明为 `public static void` 且带有一个 `String[]` 参数（如第 10 行所示）。集成开发环境（IDE）如\
    \ Netbeans 或 Eclipse 可以让你方便地编辑、编译和运行 Java 程序，而无需从命令行操作。jGRASP [[7]](#K20431_bib.xhtml_ref_7)\
    \ 是一种专门为学习数据结构设计的 IDE。\n\n### 练习\n\n1. 假设 `int` 变量 `x` 和 `y` 的值分别为 5 和 10。在运行以下每个\
    \ Java 语句后，给出 `x` 和 `y` 的值，每次运行都从 `x` 和 `y` 的原始值开始：\n    1. (a) `x = ++y;`\n \
    \   2. (b) `x = −−y;`\n    3. (c) `x = y++;`\n    4. (d) `x = y--;;`\n2. 编写 `for`-循环来产生以下值：\n\
    \    1. (a) `i = 1, 2, 3, . . . , 100`\n    2. (b) `j = 0, 1, 2, 3, . . . , 9`\n\
    \    3. (c) `m = 0, 2, 4, 6, . . . , 100\\.`（提示：增量步可以是复合赋值。）\n    4. (d) `n =\
    \ 1, 2, 4, 8, . . . , 1024.`\n3. 编写三个不同的 `for`-循环，每个循环执行执行循环体十次。不要只更改循环变量名；要更改\
    \ `for`-循环的所有三个部分。\n4. 修改列表 1.1 中的 `main()` 以包含对 `factorial(0)` 的调用。解释为什么返回了正确的结果（0!\
    \ = 1）。\n5. 修改列表 1.1 中的 `main()` 以包含带有负 `n` 的 `factorial(n)` 调用。程序会崩溃吗？解释其行为，重点关注第\
    \ 4 行的 `for`-循环。\n6. 修改列表 1.1 中的 `main()` 以计算到 `n = 20` 的阶乘。\n    1. (a) 确定返回正确值的最大\
    \ `n`。\n    2. (b) 解释为什么计算出某些错误值。提示：32 位有符号 `int` 可以存储 −2³¹ 到 23³¹ − 1 之间的值。\n\
    \    3. (c) 修改 `factorial()` 函数使用 `long` 类型，以便能够计算更大的阶乘。确定返回正确值的最大 `n`。\n7. 编写一个\
    \ Java 函数来计算 `n >= 0` 的阶乘。\n8. 编写一个 `gcd` 函数，使用 `for`循环来计算 `s` 和 `n` 的最大公约数，假设\
    \ `s` 和 `n` 是整数。\n9. 修改 `factorial()` 函数使用 `long` 类型，以便能够计算更大的阶乘。\n10. 编写一个 `gcd`\
    \ 函数，使用 `while` 循环来计算 `s` 和 `n` 的最大公约数。当循环停止时，`gcd` 是 `s` 和 `n` 的最大公约数。\n11. 编写一个\
    \ `gcd` 函数，使用 `for` 循环来计算 `s` 和 `n` 的最大公约数。返回 `s` 和 `n` 的最大公约数。\n"
- fmt: "\n# String Methods\n\n| Method | Description |\n| :--- | :--- |\n| `char charAt(int\
    \ i)` | Character at position `i`. |\n| `int indexOf(String s)` | Index of first\
    \ occurrence of `s` in this string, `-1` if not found. |\n| `int indexOf(String\
    \ s, int start)` | Index of first occurrence of `s` in this string starting at\
    \ index `start`, `-1` if not found. |\n| `int length()` | Number of characters\
    \ in string. |\n| `String substring(int i)` | Substring starting at index `i`.\
    \ |\n| `String substring(int i, int j)` | Substring from index `i` to `j - 1`.\
    \ |\n| `String toLowerCase()` | Returns copy in all lowercase. |\n| `String toUpperCase()`\
    \ | Returns copy in all uppercase. |\n| `String trim()` | Returns copy with whitespace\
    \ removed from each end. |\n\nStrings can be thought of as sequences of characters,\
    \ indexed beginning at 0, such as:\n\n| 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |\n| :---\
    \ | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| A | | s | t | r | i |\
    \ n | g |\n\nSeveral of the methods in [Table 1.4](#K20431_C001.xhtml_Text_Anchor_tab1.4)\
    \ are based on this indexing.\n\nIt is important to notice that methods whose\
    \ names sound like they might change the string (`toLowerCase()`, `trim()`, etc.)\
    \ do not change the string they are called on. This is because strings are immutable;\
    \ they never change. Instead, such methods always return a modified copy of the\
    \ original string.\n\nConsult the Java API documentation [[10]](#K20431_bib.xhtml_ref_10)\
    \ for a complete list of string methods.\n\n## Comparing Strings\n\nIn general,\
    \ reference types must be compared differently than primitives, both for equality\
    \ and inequalities. We will learn about those differences gradually, but for now,\
    \ we concentrate on how to compare strings. [Table 1.5](#K20431_C001.xhtml_Text_Anchor_tab1.5)\
    \ lists the main string comparison methods.\n\n### Table 1.5: String Comparisons\n\
    \n| Method | Description |\n| :--- | :--- |\n| `int compareTo(String s)` | Returns\
    \ negative if this string comes alphabetically before `s`, zero if equal, and\
    \ positive if alphabetically after. |\n| `int compareToIgnoreCase(String s)` |\
    \ Same as `compareTo()` except ignores upper and lowercase. |\n| `boolean equals(Object\
    \ o)` | Returns true if `o` is a string with the same contents as this string.\
    \ |\n| `boolean equalsIgnoreCase(String s)` | Returns true if `s` has the same\
    \ contents as this string, ignoring case. |\n\nThere are two basic rules for comparing\
    \ strings:\n\n* Use `equals()` if you want to know if two strings have the same\
    \ contents. Do not use `==`. Notice that line 7 in [Listing 1.2](#K20431_C001.xhtml_lis1.2)\
    \ uses `equals()` to compare each piece with the target.\n* Use `compareTo()`\
    \ if you want to compare strings with respect to their alphabetical order. Do\
    \ not try to use `<`, `>`, or other numeric comparisons.\n\nBe careful: the compiler\
    \ will allow you to use `==` with strings, but that will almost never be what\
    \ you want. On the other hand, the compiler will not allow you to use other comparisons\
    \ with strings.\n\nThe `compareTo()` method is based on the ASCII codes of the\
    \ characters in the strings, and so uppercase letters precede their lowercase\
    \ equivalents. For example:\n\n```\n\"apple\".equals(\"banana\")    // false\n\
    ```\n\n```\n\"apple\".compareTo(\"banana\")    // negative\n```\n\n```\n\"apple\"\
    .compareTo(\"BANANA\")    // positive\n```\n\n```\n\"apple\".compareToIgnoreCase(\"\
    BANANA\")  // negative\n```\n\nDo not worry about the precise values returned\
    \ by the `compareTo()` methods: in programs, you will just need to test if values\
    \ are positive or negative.\n\nThe difference between `equals()` and `==` applies\
    \ to all Java objects, not just strings, and so we will come back to that distinction\
    \ in [Section 1.4](#K20431_C001.xhtml_ch1.4). Later, in [Section 5.3](#K20431_C005.xhtml_ch5.3),\
    \ we will explain the reason that the parameter to `equals()` is an `Object`.\
    \ For now, just think of it as a second string.\n\n## Exercises\n\n1. Suppose\
    \ `s = \"data structures\"`. Give the value of each of these expressions:\n  \
    \  * (a) `s.length()`\n    * (b) `s.charAt(5)`\n    * (c) `s.indexOf(\"a\")`\n\
    \    * (d) `s.indexOf(\"m\")`\n    * (e) `s.indexOf(\"struct\")`\n    * (f) `s.indexOf(\"\
    t\", 3)`\n    * (g) `s.indexOf(\"t\", 7)`\n    * (h) `s.indexOf(\"d\", 0)`\n \
    \   * (i) `s.indexOf(\"d\", 1)`\n    * (j) `s.substring(5)`\n    * (k) `s.substring(1,\
    \ 3)`\n    * (l) `s.toUpperCase()`\n2. Suppose `t = \"Java programming language\"\
    ``. Give the value of each of these expressions:\n    * (a) `t.length()`\n   \
    \ * (b) `t.charAt(0)`\n    * (c) `t.indexOf(\"s\")`\n    * (d) `t.indexOf(\"n\"\
    )`\n    * (e) `t.indexOf(\"gram\")`\n    * (f) `t.indexOf(\"g\", 9)`\n    * (g)\
    \ `t.indexOf(\"g\", 16)`\n    * (h) `t.indexOf(\"r\", 6)`\n    * (i) `t.indexOf(\"\
    r\", 7)`\n    * (j) `t.substring(5)`\n    * (k) `t.substring(5, 12)`\n    * (l)\
    \ `t.toUpperCase()`\n3. Suppose `s = \"stack\"`, `t = \"queue\"`, and `u = \"\
    Stack\"`. Give the value of each of these:\n    * (a) `s.equals(t)`\n    * (b)\
    \ `!s.equals(u)`\n    * (c) `!s.equalsIgnoreCase(u)`\n    * (d) `s.equalsIgnoreCase(u)`\n\
    4. Suppose `s = \"stack\"`, `t = \"queue\"`, and `u = \"Stack\"`. Decide whether\
    \ each of these is positive, negative or zero:\n    * (a) `s.compareTo(t)`\n \
    \   * (b) `s.compareTo(u)`\n    * (c) `s.compareToIgnoreCase(u)`\n    * (d) `s.compareToIgnoreCase(u)`\n\
    5. Suppose `s` is a reference to a string \"abcd\". Write expressions to return:\n\
    \    * (a) `s.length()`\n    * (b) `s.charAt(2)` (as in \"abcd\" is \"c\")\n \
    \   * (c) `s.substring(2, 4)`\n    * (d) `s.substring(3)`\n6. Suppose `s` and\
    \ `t` are references to strings:\n    * (a) Write an if-statement that will execute\
    \ its body only when `s` and `t` have the same contents.\n    * (b) Write an if-statement\
    \ that will execute its body only when `s` and `t` have different contents.\n\
    \    * (c) Write an if-statement that will execute its body only when `s` comes\
    \ before `t`.\n7. Modify line 7 of [Listing 1.2](#K20431_C001.xhtml_lis1.2) to\
    \ use `==` instead of `equals()`. Describe the results.\n8. Modify [Listing 1.2](#K20431_C001.xhtml_lis1.2)\
    \ to write a method called `countIgnoreCase()` that ignores case. Test your method\
    \ in `main()`.\n9. Write a version of `count()` from [Listing 1.2](#K20431_C001.xhtml_lis1.2)\
    \ called `count2()` that uses a `while`-loop and the `indexOf()` string method\
    \ to search for the target. Use the version of `indexOf()` with two parameters.\
    \ Add your function to `StringFunctions` and test your method in `main()`.\n10.\
    \ Determine how the value of the string `compareTo()` method is computed, either\
    \ through experimentation or by consulting the Java documentation.\n\n## 1.3 Arrays\n\
    \nArrays are a simple data structure that provide a basis for creating many of\
    \ the other, complex structures we will study. They also provide a second example\
    \ of a reference type. [Listing 1.3](#K20431_C001.xhtml_lis1.3) demonstrates the\
    \ use of arrays with a standard search technique known as linear search.\n\n```\n\
    public class ArrayFunctions {\n  public static int linearSearch(int[] data, int\
    \ target) {\n    for (int i = 0; i < data.length; i++) {\n      if (target ==\
    \ data[i]) return i;\n    }\n    return -1;\n  }\n\n  public static void main(String[]\
    \ args) {\n    int[] data = {3, 14, 7, 22, 45, 12, 19, 42, 6};\n    System.out.println(\"\
    Search for 7: \" + linearSearch(data, 7));\n    System.out.println(\"Search for\
    \ 100: \" + linearSearch(data, 100));\n  }\n}\n```\n\nAn array is an ordered collection\
    \ of variables, all of the same type. A reference to an array then allows accessing\
    \ any variable in the collection by its index.\n\n### Declaring Array References\n\
    \nThe declaration:\n\n```\ntype[] arrayRef;\n```\n\ndeclares `arrayRef` to be\
    \ a reference to an array in which each variable has the specified type. Thus,\
    \ `data` is declared to be an array of `int` variables in line 10 of [Listing\
    \ 1.3](#K20431_C001.xhtml_lis1.3).\n"
