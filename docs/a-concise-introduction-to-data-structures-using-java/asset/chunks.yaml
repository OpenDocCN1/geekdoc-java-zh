    \ 中测试。\n\n9. 为 `StringFunctions` 类编写一个 Java 方法 `reverse(String s)`，返回一个由 `s` 中的字符按反序排列组成的字符串。例如，`reverse(”abc”)`\
    \ 应该返回字符串 `”cba”。在 `main()` 中测试你的方法。\n\n10. 为 `ArrayFunctions` 类添加一个新的 `linearSearch()`\
