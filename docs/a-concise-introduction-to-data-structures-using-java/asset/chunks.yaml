    ## Aims and Scope


    This series covers traditional areas of computing, as well as related technical
    areas, such as software engineering, artificial intelligence, computer engineering,
    information systems, and information technology. The series will accommodate textbooks
    for undergraduate and graduate students, generally adhering to worldwide curriculum
    standards from professional societies. The editors wish to encourage new and imaginative
    ideas and proposals, and are keen to help and encourage new authors. The editors
    welcome proposals that: provide groundbreaking and imaginative perspectives on
    aspects of computing; present topics in a new and exciting context; open up opportunities
    for emerging areas, such as multi-media, security, and mobile systems; capture
    new developments and applications in emerging fields of computing; and address
    topics that provide support for computing, such as mathematics, statistics, life
    and physical sciences, and business.


    ## Published Titles


    *   Pascal Hitzler, Markus Krötzsch, and Sebastian Rudolph, Foundations of Semantic
    Web Technologies

    *   Uvais Qidwai and C.H. Chen, Digital Image Processing: An Algorithmic Approach
    with MATLAB®

    *   Henrik Bærbak Christensen, Flexible, Reliable Software: Using Patterns and
    Agile Development

    *   John S. Conery, Explorations in Computing: An Introduction to Computer Science

    *   Lisa C. Kaczmarczyk, Computers and Society: Computing for Good

    *   Mark J. Johnson, A Concise Introduction to Programming in Python

    *   Paul Anderson, Web 2.0 and Beyond: Principles and Technologies

    *   Henry M. Walker, The Tao of Computing, Second Edition

    *   Mark C. Lewis, Introduction to the Art of Programming Using Scala

    *   Ted Herman, A Functional Start to Computing with Python

    *   Mark J. Johnson, A Concise Introduction to Data Structures using Java


    To Lyn


    # Preface


    Welcome!


    This text presents an introduction to data structures in Java™. It assumes some
    prior programming experience but not necessarily in Java.


    Data structures are the building blocks used to create any significant piece of
    software. Just as smaller programs are made with functions, loops, and if-statements,
    large-scale programs use stacks, queues, lists, and maps. Becoming familiar with
    how to use, design, implement, and analyze these structures is an important step
    on the path to becoming a skilled software developer.


    One piece of advice for learning this material: do as many of the exercises you
    can. One of the nice things about writing programs is that you can run them to
    see if your solutions work or not. That quick feedback is invaluable.


    Enjoy.


    ## To Instructors


    This text is designed to support a second course in computer science with an emphasis
    on elementary data structures. It takes a developmental approach to enhance student
    learning:


    *   More code and guidance are provided at the beginning, allowing students to
    adapt to Java and begin learning data structures. As students become familiar
    with the landscape and more independent, less code is given and more algorithms
    are outlined in pseudocode.

    *   Important concepts are introduced gradually and revisited with increasing
    depth. For example, linked lists are introduced in the context of an integer stack
    so that insertion and deletion are only at the front. Next they are used to build
    a queue that adds support for generics and a tail pointer. Finally, the linked
    implementation of the list ADT uses double links, a dummy node, and insertion
    and deletion anywhere in the list. By this point, students have built confidence
    in their ability to navigate linked list code.

