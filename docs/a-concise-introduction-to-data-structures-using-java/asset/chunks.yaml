    \ tree.\n\n    8.  (h) Determine the predecessor and successor of 27 in the tree.\n\
    \n    9.  (i) Determine the predecessor and successor of 68 in the tree.\n\n2.\
    \  Give one reason the binary tree Node class in [Listing 8.2](#K20431_C008.xhtml_lis8.2)\
    \ includes a parent reference.\n\n3.  Describe the base case(s) for the recursion\
    \ in the findNode() method of [Listing 9.1](#K20431_C009.xhtml_lis9.1).\n\n4.\
    \  Could the predNode() method of [Listing 9.2](#K20431_C009.xhtml_lis9.2) be\
    \ written recursively? Explain why or why not.\n\n5.  Implement the following\
    \ methods in the BinarySearchTree class:\n\n    1.  (a) min() Write a private\
    \ minNode(n) that returns the node with the smallest item in the subtree rooted\
    \ at n.\n\n    2.  (b) max() Write a private maxNode(n) that returns the node\
    \ with the largest item in the subtree rooted at n.\n\n    3.  (c) succ() Write\
    \ a private succNode(n) that returns the node containing the successor of n. Note:\
    \ minNode() is needed for succNode().\n\n    4.  (d) toString() Override the BinaryTree\
    \ definition to force an inorder traversal.\n\n6.  If your solution to Exercise\
    \ 5a used a recursive minNode(), write a non-recursive version, or vice versa.\n\
    \n7.  If your solution to Exercise 5b used a recursive maxNode(), write a non-recursive\
    \ version, or vice versa.\n\n8.  Explain why each of these binary search tree\
    \ queries is O(h), where h is the height of the tree:\n\n    1.  (a) Search\n\n\
    \    2.  (b) Minimum\n\n    3.  (c) Maximum\n\n    4.  (d) Predecessor\n\n   \
    \ 5.  (e) Successor\n\n## 9.2 Insertion\n\nInserting into a binary search tree\
    \ follows the same pattern as search. In fact, an unsuccessful search ends at\
    \ a null pointer that is exactly where the item should be inserted. This idea\
    \ is the basis for the add() method of the BinarySearchTree class.\n\nFor example,\
    \ to insert 24 in this binary search tree, the search path ends left of 26: 49\n\
    \n![image](image/156x001.png)\n\nAs with queries from the previous section, the\
    \ public method add() will call a private addNode().\n\nThe add() method handles\
    \ a null item or changing the root. It should do the following:\n\n```\nIf the\
    \ item to insert is null, do nothing\n```\n\n```\nIf the root is null, insert\
    \ item at root\n```\n\n```\nElse start addNode at the root\n```\n\nThe private\
    \ addNode() method is outlined in [Listing 9.3](#K20431_C009.xhtml_lis9.3). It\
    \ has the same structure as findNode(), except that it checks for a null child\
    \ before making its recursive calls. If the child in the correct direction is\
    \ null, that is the place to insert a new node.\n\nUnlike findNode() and predNode(),\
    \ addNode() is a void method because its purpose is to insert a new node rather\
    \ than to return a particular node. You will be asked to implement this algorithm\
    \ in the exercises.\n\nListing 9.3: Binary Search Tree Insertion (Pseudocode)\n\
    \n```\n 1 // Assume item != null and n != null\n```\n\n```\n 2 If item < n.data\n\
    ```\n\n```\n 3 If no left child, insert as n.left\n```\n\n```\n 4 Else call recursively\
    \ on n.left\n```\n\n```\n 5 Else if item > n.data\n```\n\n```\n 6 If no right\
    \ child, insert as n.right\n```\n\n```\n 7 Else call recursively on n.right\n\
    ```\n\n```\n 8 Else do nothing (to prevent inserting duplicates)\n```\n\n### Java\
    \ Assertions\n\nNotice the comment on line 1 of [Listing 9.3](#K20431_C009.xhtml_lis9.3).\
    \ If the public add() method has done its job as described above, then neither\
    \ the item nor the node n are null at the start of addNode(). Furthermore, those\
    \ conditions should continue to be true at the start of any recursive call of\
    \ addNode(). Such a boolean condition that is expected to be true at the start\
    \ of a method call is known as a precondition of the method.\n\nUnfortunately,\
    \ comments are not executable, so there is nothing preventing the programmer from\
    \ making a mistake and violating the precondition. A Java assert statement essentially\
    \ makes the comment executable:\n\n```\nprivate void addNode(E item, Node<E> n)\
    \ {\n```\n\n```\n assert item != null && n != null;\n```\n\n```\n ...\n```\n\n\
    ```\n}\n```\n\nThe syntax of an assertion is simple:\n\n```\nassert booleanCondition;\n\
    ```"
