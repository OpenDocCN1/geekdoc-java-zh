  trans: "\n*   主题的组织贯穿始终旨在强化这种发展方法。例如，第 3 章 开发了基于 `int` 的栈接口、数组实现和链表实现。这使得学生在处理 第\
    \ 4 章 中的完全泛型栈之前，专注于栈的核心内容。`List` ADT 位于栈和队列之后的原因相同：学生在学习栈和队列后，能更好地处理它的复杂性（特别是\
    \ `iterators`）。\n*   每个章节只介绍一个或（极少数）两个新概念，让学生专注于新思想，而不至于无从从心。这对于 Java 初学者来说在课程的前半部分尤为重要。\n\
    \n其他特点包括：\n\n*   对学生需要学习的核心内容进行清晰、简洁的解释\n*   Java 基础知识的介绍章节，让那些 Java 不是其第一门语言的学生能够快速上手\n\
    *   数据结构的部分实现，以便教师可以编写一些方法作为示例，而学生可以编写其他方法作为练习\n*   介绍学生以后在其他课程中可能会看到的内容，例如调用栈、分析递归函数、排序、继承和抽象类\n\
    *   每个章节的设计大约适合一节课的时间\n\n在大多数情况下，本书遵循了标准的 Java 编码规范，但有少数例外：\n\n*   `Arrays` 是手动复制的，很大程度上是为了支持在队列实现中学习调整循环数组的大小\n\
    *   没有使用 `Java` 集合，因为学生正在学习构建自己的。尽管如此，大多数接口与 `java.util` 中的对应项非常相似。\n*   使用了未命名包，因为这些应用程序都相对小，这简化了初学者的文件管理。\n\
    *   接口方法的实现没有使用 `@Override` 注解，因为对“覆盖”一词的使用似乎可能会困惑学者。\n\n除了第 10 章和第 11 章可以互换外，章节设计要求顺序阅读。第\
    \ 5.3 节 可能不应该跳过，因为它介绍了继承和 `Object` 类。\n\nJava 源文件和其他资源发布在：\n\n[`www.central.edu/go/datastructures/`](http://www.central.edu)\n\
    \n## 反馈\n\n请将任何意见或建议发送至 johnsonm@central.edu。期待您的回复。\n\n## 致谢\n\n感谢 COSC 130 的所有学生让这门课程如此有趣。我希望你们能看到并欣赏你们所激发的所有的改进。感谢\
    \ Chapman & Hall/CRC Press 的编辑 Randi Cohen 一直以来的；我深表感谢。感谢我在 Central College 的同事，包括学院-社区合唱团的主任\
    \ Mark Babcock，感谢他经常使用“一次只学一个新事物”的技术。\n\n# 关于作者\n\nMark J. Johnson 是爱荷华州佩拉中央学院（Central\
    \ College）的计算机科学与数学教授，在那里担任 Ruth and Marvin Denekas 科学与人文教授。Mark 毕业于威斯康星大学麦迪逊分校（数学博士学位）和圣奥拉夫学院。他是《A\
    \ Concise Introduction to Programming in Python》的作者，该书也由 Chapman & Hall/CRC Press\
    \ 出版。\n\n# 第 1 章\n\n# Java 简介\n\n在开始学习数据结构之前，我们将快速浏览 Java 编程语言的主要特征。随后，将在需要时引入\
    \ Java 更高级的特性。本章假设你已经有一些编程经验，但不一定是 Java Java。\n\n开发 Java 软件需要当前的 Java 开发工具包 (`JDK`)）。本文中的所有示例都是使用\
    \ Java SE 7 编写的。\n\n## 1.1 基础\n\n我们从列表 1.1 中的一个计算阶乘示例开始。\n\n列表 1.1：阶乘\n\n```\n\
    \ 1 public class NumericFunctions {\n```\n\n```\n 2 public static int factorial(int\
    \ n) {\n```\n\n```\n 3  int result = 1;\n```\n\n```\n 4  for (int i = 2; i <=\
    \ n; i++) {\n```\n\n```\n 5  result *= i;\n```\n\n```\n 6 }\n```\n\n```\n 7  return\
    \ result;\n```\n\n```\n 8}\n```\n\n```\n 9\n```\n\n```\n10 public static void\
    \ main(String[] args) {\n```\n\n```\n11  for (int n = 1; n <= 10; n++) {\n```\n\
    \n```\n12  System.out.print(n);\n```\n\n```\n13  System.out.print(\" \");\n```\n\
    \n```\n14  System.out.println(factorial(n));\n```\n\n```\n15 }\n```\n\n```\n16}\n\
    ```\n\n```\n17}\n```\n\n虽然这是一个简短的程序，但它说明了 Java 语言的许多特性。因此，这一节比大多数章节都要长一点，所以不要试图在第一次阅读时就记住所有内容。相反，请注意这里的内容，关注与你预期不同的之处。\n"
- fmt: "\nThe most commonly used primitive types are `int`, `double`, and `boolean`.\
    \ [Table 1.2](#K20431_C001.xhtml_Text_Anchor_tab1.2) shows the literal values\
    \ that can be assigned to variables that have been declared with primitive types.\n\
    \n### Table 1.2: Primitive Literal Values\n\n| type | description |\n| :--- |\
    \ :--- |\n| integer | Optional `0x` (hex), `0` (octal), or `0b` (binary) |\n|\
    \ long | Suffix `L` |\n| floating pt | Optional `e` for base 10 exponent |\n|\
    \ float | Suffix `f` |\n| boolean | `true` or `false` |\n| char | Single quotes\
    \ |\n\nNotice that a stray `0` prefix on an integer constant will cause the value\
    \ to be interpreted in octal, which is base 8.\n\nCasting can be used to translate\
    \ between primitive numeric types (excluding boolean). A cast tells the compiler\
    \ to treat the expression as though it has the specified type. The syntax of a\
    \ cast is:\n\n```\n(type) expression\n```\n\nCasting a floating-point value to\
    \ an integer truncates the fractional part. For example,\n\n```\nint i = (int)\
    \ 7.2913; // sets i to 7\n```\n\n### Operators\n\nJava has the standard arithmetic\
    \ operators `+`, −`, `*`, and `/` for numeric types. There is no exponentiation\
    \ operator. Integer division truncates toward zero, so `5 / 2` is `2` and `-5\
    \ / 2` is `-2`. The remainder operator is `%`, defined so that `m % n` is the\
    \ remainder after dividing `m` by `n`. For example, `5 % 2` is `1`. For integer\
    \ `m` and `n`, the following relationship is guaranteed:\n\n```\n(m / n) * n +\
    \ m % n == m\n```\n\nBe aware that `m % n` can be negative: for example, `-5 %\
    \ 2` is `-1` because\n\n```\n(-5 / 2) * 2 + -5 % 2 == -2 * 2 + -1 == -5\n```\n\
    \nThe remainder operator is also sometimes called a modulus or mod operator, but\
    \ that is technically inaccurate because modulus values are never negative.\n\n\
    Testing equality is done with `==` or `!=` (not equals). Other comparisons are\
    \ `<`, `>`, `<=`, and `>=`. Each of these produces a boolean result, either `true`\
    \ or `false`. Boolean values may be combined with the boolean operators `&&` (AND)\
    \ or `||` (OR). Any boolean value may be negated by putting a `!` (NOT) in front\
    \ of it.\n\nThe boolean operators `&&` (AND) and `||` (OR) are conditional, meaning\
    \ that they only evaluate the second expression if necessary. For example, if\
    \ `j` is negative in this expression:\n\n```\nj >= 0 && key < data[j]\n```\n\n\
    then the second part, `key < data[j]`, will not be evaluated because the final\
    \ result is already known to be false. Conditional evaluation is also known as\
    \ short-circuiting the boolean operator.\n\n### Increment and Decrement\n\nNumeric\
    \ variables may be increased by one with the increment operator:\n\n```\nvariable++\n\
    ```\n\nThere is also a decrement operator `--`. Increment and decrement may be\
    \ used in a stand-alone statement or as part of a larger expression. When present\
    \ in an expression in the postfix form shown above, with the `++` after the variable,\
    \ the increment or decrement happens after retrieving the value of the variable.\n\
    \nIn prefix form:\n\n```\n++variable\n```\n\nthe increment (or decrement) is done\
    \ before determining the value of the variable.\n\nFor example,\n\n```\nint x\
    \ = 10;\n```\n\n```\nint y = x++;\n```\n\nchanges `x` to `11` and assigns the\
    \ value `10` to `y` because the increment is done after `x` is evaluated in the\
    \ second line.\n\n### Statements and Blocks\n\nExecutable Java code is a sequence\
    \ of statements, each ending with a semicolon. Braces `{}` may be used to group\
    \ statements into blocks. Braces are also known as squigglies or curly brackets.\
    \ No semicolons are put after braces.\n\nBlocks usually define the bodies of classes,\
    \ methods, loops, and if-statements. In general, a block may be used anywhere\
    \ a single statement can occur—and vice versa—because technically a block is considered\
    \ a single compound statement. For example, an if-statement may be written with\
    \ a block:\n\n```\nif (test) {\n    body;\n}\n```\n\nor with a single statement:\n\
    \n```\nif (test)\n    singleStatement;\n```\n\nHowever, because of the danger\
    \ of adding new statements to the single-statement form without remembering to\
    \ include the braces, it is better to write single-statement bodies on the same\
    \ line:\n\n```\nif (test) singleStatement;\n```\n\nThe example statements that\
    \ follow use the block form.\n\n### Assignment\n\nAn assignment statement evaluates\
    \ the expression on the right and assigns that value to the variable on the left:\n\
    \n```\nvariable = expression;\n```\n\nThe type of the expression must be compatible\
    \ with the type of the variable. Shorthands are available for many common assignments.\
    \ For example, the `*=` in line 5 of [Listing 1.1](#K20431_C001.xhtml_lis1.1):\n\
    \n```\nresult *= i;\n```\n\nis an abbreviation of the assignment:\n\n```\nresult\
    \ = result * i;\n```\n\nSimilar shorthands are available for `+=`, `-=`, and `/=`.\n\
    \n### Control Statements\n\nStatements are executed in a Java program one after\
    \ the other, in the order they appear. The control statements that follow change\
    \ the order in which other statements are executed; in other words, they control\
    \ the flow of execution.\n\n### If Statements\n\nAn if-statement allows conditional\
    \ execution by only executing its body if the test is true:\n\n```\nif (test)\
    \ {\n    body;\n}\n```\n\nThe test inside parentheses must produce a boolean value.\
    \ There is an optional `else`.\n\n### While Loops\n\nA while-loop repeatedly executes\
    \ its body until the test is false:\n\n```\nwhile (test) {\n    body;\n}\n```\n\
    \n### For Loops\n\nA for-loop adds initialization and increment steps:\n\n```\n\
    for (initialize; test; increment) {\n    body;\n}\n```\n\nThis loop works approximately\
    \ like the while-loop:\n\n```\ninitialize;\nwhile (test) {\n    body;\n}\nincrement;\n\
    ```\n\nThe `initialize` step may declare new variables, and any variables declared\
    \ in this way have scope limited to the for-loop.\n\n### Switch\n\nA `switch`\
    \ is an alternative to a long sequence of if if statements.\n\n```\nswitch (expression)\
    \ {\n    case value1:\n        statements;\n    case value2:\n        statements;\n\
    \    ...\n    default:\n        statements;\n}\n```\n\nThe `default` case is optional.\
    \ When a `switch` executes, control jumps to the matching `case` if there is one,\
    \ and then execution continues from that point, with `case` statements themselves\
    \ having no effect. In other words, execution does not automatically stop at the\
    \ end of a case. Thus, most switch statements have a `break` statement at the\
    \ end of every case, in order to cause execution to skip the remaining cases.\n\
    \n### Output Statements\n\nOutput is generated by the `System.out` functions in\
    \ [Table 1.3](#K20431_C001.xhtml_Text_Anchor_tab1.3).\n\n### Table 1.3: System.out\
    \ Print Methods\n\n| Method | Description |\n| :--- | :--- |\n| `System.out.print(item)`\
    \ | Prints item without appending newline. |\n| `System.out.println(item)` | Prints\
    \ item, appending newline (`\\n`). |\n\nOther output functions offering more flexibility\
    \ are available; consult the Java documentation or tutorials for details on their\
    \ use.\n\n### Methods\n\nFunctions in Java are usually referred to as methods\
    \ because they must be written inside a class. The general format of a method\
    \ declaration is:\n\n```\nmodifiers returnType name(parameterType parameter, ...)\
    \ {\n    body;\n}\n```\n\nThe `factorial()` method in [Listing 1.1](#K20431_C001.xhtml_lis1.1)\
    \ has modifiers `public static`, return type `int`, and one parameter named `n`\
    \ of type `int`. Method modifiers will be discussed in [Section 1.5](#K20431_C001.xhtml_ch1.5).\
    \ A method declares its return type to indicate the type of data it will return.\
    \ The `void` return type indicates that no value will be returned. Thus, the `factorial()`\
    \ method returns an `int`, whereas the `main()` method returns nothing.\n\nValues\
    \ are returned from non-void methods with a `return` statement:\n\n```\nreturn\
    \ expression;\n```\n"
