    \    q.peek()\n\n        q.enqueue(50)\n\n        q.dequeue()\n\n        q.size()\n\
    \n        q.dequeue()\n\n        q.dequeue()\n\n2.  Decide whether or not a queue\
    \ would be an appropriate data structure for each of these types of task lists.\
    \ Assume that when a new task arrives, it would be enqueued, and when a task is\
    \ chosen to work on, it would be dequeued. Explain your answers.\n\n    1.  (a)\
    \ Tasks that may need to be done in any order.\n\n    2.  (b) Tasks where the\
    \ next one to work on is always the one that has been waiting the longest.\n\n\
    \    3.  (c) Tasks where the next one to work on is always the most recently received.\n\
    \n    4.  (d) Tasks that need to be done in the order they are received.\n\n \
    \   5.  (e) Tasks that may need to be shuffled or sorted.\n\n3.  Write a generic\
    \ Java interface Queue<E> for the Queue ADT in [Table 5.1](#K20431_C005.xhtml_Text_Anchor_tab5.1).\n\
    \n4.  Develop the LinkedQueue<E> class, implementing the Queue<E> interface from\
    \ Exercise 3 with a linked list as described in this section. Write these members:\n\
    \n    1.  (a) Private Node<T> class Include a second constructor that only takes\
    \ one parameter, the data item, and sets the next field to null.\n\n    2.  (b)\
    \ dequeue() Throw a NoSuchElement exception from java.util if the queue is empty\
    \ (see page 55).\n\n    3.  (c) enqueue()\n\n    4.  (d) isEmpty()\n\n    5. \
    \ (e) peek() Throw a NoSuchElement exception if the queue is empty.\n\n    6.\
    \  (f) size() Include a size instance variable and update it where necessary.\n\
    \n5.  Add a main() method to the LinkedQueue<E> class to test the queue with:\n\
    \n    1.  (a) Integers\n\n    2.  (b) Doubles\n\n    3.  (c) Strings\n\n6.  Determine\
    \ the O() time complexity of these LinkedQueue operations. Explain your answers.\n\
    \n    1.  (a) dequeue()\n\n    2.  (b) enqueue()\n\n    3.  (c) isEmpty()\n\n\
    \    4.  (d) peek()\n\n    5.  (e) size()\n\n7.  As described above, the enqueue\
    \ method has to treat an empty queue as a special case. To avoid this, a dummy\
    \ node can be created at the front of the list containing no data. This simplifies\
    \ enqueuing, but requires rewriting other methods to take the dummy node into\
    \ account. Write a DummyLinkedQueue<E> implementation of Queue<E> using this approach.\
    \ Discuss the tradeoffs.\n\n## 5.2 Array Implementation\n\nThe linked queue was\
    \ a bit more complicated than its stack counterpart, requiring a second tail pointer\
    \ to enqueue efficiently. In a similar way, the array implementation of a queue\
    \ will require extra work to achieve O(1) performance. The main ideas are similar\
    \ to an array stack, though, so we begin by ignoring the complications.\n\n###\
    \ Basic Idea\n\nAs with the array implementation of a stack, it is helpful to\
    \ begin by imagining a few elements being added to a queue. Suppose 10, 20, and\
    \ 30 are enqueued in that order; then it is natural to store them at the beginning\
    \ of the array (shown as primitives to simplify the pictures):\n\n![image](image/090x001.png)"
