    插入排序常被纸牌玩家用来整理手牌牌牌。其核心思想是将数据分为两个部分：左部分是数据的已排序子集，而右部分包含待排序的项。在算法的每一步中，我们从右部分取出下一个元素，并将其插入到左部分，使得左部分保持有序状态。


    ### 示例


    给定数组


    ![image](img/f0038-01.png)


    首先将第一个元素视为已排序的（尽管它只有一个元素）：


    ![image](img/f0038-02.png)


    然后取右半部分的下一个元素，并将其插入到左侧正确的排序位置。在这种情况下，`14` 可以停留在原处，因为 `3 < 14`。


    ![image](img/f0039-01.png)


    下一个元素 `7` 需要插入到 `3` 和 `14` 之间。这需要保存 `7`，将 `14` 复制到第 2 个槽，然后将 `7` 复制到第 1 个槽：


    ![image](img/f0039-02.png)


    此过程持续持续，直到右侧没有元素为止，此时数组已排序完成。这种一次插入一个元素的方法是增量策略的一个示例。


    ### 实现


    代码列表 2.1 在 Java 中实现了针对整数数组的插入排序。请密切注意内部循环，它移动数组中的元素，以便 `key` 能够插入到正确的位置。


    代码列表 2.1：插入排序


    ```

    1 // Add to class ArrayFunctions

    ```


    ```

    2 public static void insertionSort(int[] data) {

    ```


    ```

    3 for (int i = 1; i < data.length; i++) {

    ```


    ```

    4  int key = data[i];

    ```


    ```

    5  int j = i - 1;

    ```


    ```

    6  while (j >= 0 && key < data[j]) {

    ```


    ```

    7  data[j + 1] = data[j];

    ```


    ```

    8  j--;

    ```

    ```

    9 }

    ```


    ```

    10  data[j + 1] = key;

    ```


    ```

    11 }

    ```


    ```

    12}

    ```


    ### 最坏情况分析


    插入排序在 `for` 循环内部有一个 `while` 循环。这使得分析变得困难，因为我们需要确定内部循环运行的次数。


    第 3 行的外部循环在长度为 `n` 的数组上运行 `n - 1` 次。第 6 行的内部循环取决于数据。在最坏的情况下，数组将是倒序的，每一个项都必须移动最大的距离。在这种情况下，项
    `i` 将导致 `while` 循环运行 `i` 次。因此，最坏情况下的内部循环总迭代次数为：


    1 + 2 + ··· + (n − 1)


    问题是：这个表达式用 `O()` 表示是什么？这种求和在算法分析中频繁出现，因此知道如何处理它们是有益。


    寻找此求和的一种启发式方法是从外向内对元素进行配对：


    ![image](img/f0040-01.png)


    每对之和为 `n`，共有 $\frac{n - 1}{2}$ 对，因此总和为


    $\text{pairsum} \times \text{Numberofpairs} = \frac{n(n - 1)}{2}$


    即为 `O(n2)`。


    ### 生成随机数据


    如果没有生成随机测试数据的能力，测试插入排序（以及许多其他方法）将非常困难。代码列表 2.2 展示了如何使用 Java 库之一生成随机值。它创建一个生成器对象，然后请求生成器提供放入数组的数值。


    代码列表 2.2：随机数据


    ```

    1 // Add to class ArrayFunctions:

    ```


    ```

    2

    ```


    ```

    3 import java.util.Random;

    ```


    ```

    4

    ```


    ```

    5 public static void randomFill(int[] data, int max) {

    ```


    ```

    6 Random gen = new Random();

    ```


    ```

    7 for (int i = 0; i < data.length; i++) {

    ```


    ```

    8  data[i] = gen.nextInt(max);

    ```


    ```

    9}

    ```


    ```

    10}

    ```


    生成器在第 6 行创建，并在第 8 行调用其 `nextInt()` 方法来填充下一个数组值。


    ### 使用 Java 库


    使用 Java 库的标准做法是在文件的顶部导入所需的库类：


    ```

    import library.name;

    ```


    在 代码列表 2.2 中，使用的库名称是 `java.util`，第 3 行导入的类名是 `Random`。该类的全名是 `java.util.Random`，事实上，这个名称可以在任何时间使用而无需导入。尽管如前提到的，在类定义文件的顶部导入此类名称是一个好主意。


    `java.util.Random` 类的一些实例方法列在表格 2.3 中。


    表格 2.3 `java.util.Random`


    | 方法 | 描述 |

    | :--- | :--- |

    | `nextDouble()` | 返回 0.0 到 1.0（不包含）之间的伪随机 `double` 值。 |

    | `nextGaussian()` | 返回均值为 0.0、标准差为 1.0 的正态分布伪随机 `double` 值。 |

    | `nextInt()` | 返回 0（包含）到 `Integer.MAX_VALUE`（不包含）之间的伪随机 `int` 值。 |

    | `nextInt(int bound)` | 返回 0（包含）到指定值（不包含）之间的伪随机 `int` 值。 |


    ### 练习


    1. 将代码列表 2.1 中的 `insertionSort` 添加到 `ArrayFunctions` 类中。密切注意内部循环，它移动数组中的元素，以便
    `key` 能够插入到正确的位置。

    2. 分析插入排序的最坏情况。

    3. 分析插入排序的平均性能。

    4. 分析插入排序的最佳情况。

    5. 在 `ArrayFunctions` 类中实现代码列表 2.2 中的 `randomFill`。

    6. 使用 `java.util.Random` 的 `nextInt()` 方法填充数组的随机值。

    7. 在 `ArrayFunctions` 类中编写一个 `isSorted(int[] data)` 方法，如果数组已排序则返回 true，否则返回 false。

    8. 编写一个重载的 `randomFill(int[] data)` 版本，不限制其填充的随机整数的大小。

    9. 测量插入排序的性能。从大小为 100 的数组开始，不断倍增大小直到 200,000。报告你的结果和观察。

