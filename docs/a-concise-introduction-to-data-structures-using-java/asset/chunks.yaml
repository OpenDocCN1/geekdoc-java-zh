    \n### 创建对象\n\n在 Java 中，使用 `new` 和类构造函数来创建对象：\n\n```\nreferenceVariable = new ClassName(arguments);\n\
    ```\n\n构造函数的名称始终与它们的类名相同，并且可以接受零或多个参数。在 Listing 1.4 中，通过调用第 4 行的构造函数创建了一个 `StringBuilder`\
    \ 对象，该对象随后由变量 `result` 引用。\n\n### 访问字段和调用方法\n\n对象将其数据存储在创建它的类所定义的字段中。使用点符号法访问字段：\n\
    \n```\nobject.field\n```\n\n我们在上一节中见过这种表示法，用于访问数组的 `length` 字段。\n\n方法是在对象字段中存储的数据上或对这些数据执行的操作。使用相同的点符号法调用方法：\n\
    \n```\nobject.method(arguments)\n```\n\n在 Section 1.2 中我们看到了几个 `String` 方法调用的示例，Listing\
    \ 1.4 的第 6 行调用了 `StringBuilder` 对象 `result` 的 `append()` 方法。值得注意的是，`print()` 和\
