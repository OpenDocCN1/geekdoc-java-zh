    \nThe declaration:\n\n```\ntype[] arrayRef;\n```\n\ndeclares arrayRef to be a\
    \ reference to an array in which each variable has the specified type. Thus, data\
    \ is declared to be an array of int variables in line 10 of [Listing 1.3](#K20431_C001.xhtml_lis1.3)."
