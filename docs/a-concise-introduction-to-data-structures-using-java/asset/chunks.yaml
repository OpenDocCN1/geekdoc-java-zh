  trans: "\n涉及搜索大量可能性的问题会使得跟踪算法当前在搜索空间中的位置变得困难。这类问题的示例包括迷宫、填字游戏或数独等谜题，以及试图在一组离散对象上最大化或最小化某些数量的离散优化问题。递归回溯（Recursive\
    \ backtracking）通过使用调用栈来管理当前位置，并在当前搜索路径失败时允许回溯以尝试其他路径，从而解决此类问题。\n\n`n-皇后`问题是一个谜题，要求在\
    \ `n` × `n` 的棋盘上放置 `n` 个皇后，使得任何两个皇后都互不攻击。皇后可以在水平、垂直或对角线方向移动任意数量的格子。例如，当 `n = 4`\
    \ 时，以下内容不是一个有效解，因为两个皇后在对角线上互相攻击：`Q`\n\n![image](img/135x001.png)\n\n`n-queens`问题的递归回溯解将问题简化为在每列中放置一个皇后。列表\
    \ 7.5 描述了一个递归函数 `queens(board, column)`，该函数从左到右遍历棋盘，每列放置一个皇后。\n\n列表 7.5：n-皇后问题的回溯解（伪代码）\n\
    \n```\n 1 如果完成，显示棋盘\n```\n```\n 2 否则\n```\n\n```\n 3 对于每一行\n```\n\n```\n 4   board[column]\
    \ = row\n```\n\n```\n 5   如果这是一个合法位置\n```\n\n```\n 6   queens(board, column +\
    \ 1)\n```\n\n回溯在这段代码中？它完全由递归管理：如果 `queens(board, column + 1)` 未能找到解决方案，for 循环将推进到检查下一个可能的行。\n\
    \n## 练习题\n\n1. 将 列表 7.3 实现为递归函数 `lcs(s1, s2)`，返回字符串 `s1` 和 `s2` 的最长公共子序列。\n\n\
    2. 将 列表 7.4 实现为递归函数 `hanoi(n, src, intermed, dest)` 以解决汉诺塔谜题。在方法的中间步骤打印如下所示的消息：\n\
    \n   ```\n   将盘片 3 从 0 移动到 2。\n   ```\n   不要忘记边界情况。\n\n3. 通过计算 `n` 个盘片时的函数调用次数，确定\
    \ `hanoi()` 函数的 `O()` 性能。\n\n4. 将 列表 7.5 实现为递归函数 `queens(board, column)`，使用回溯法解决\
    \ `n-皇后`问题。\n\n5. 解释为什么 `n-皇后`问题的递归回溯解能找到问题的所有解，而不仅仅是一个。\n\n## 第 8 章\n\n# 树\n\n\
    树是非线性的、层次化的且递归的数据结构，具有广泛的应用。事实上，我们已经在第 7.2 节中见过调用树，它被作为跟踪递归计算的有用模型。\n\n## 8.1\
    \ 定义与示例\n\n树是一个（可能为空的）元素集合，称为节点，其中一个节点被指定为根节点。根节点通过边连接到若干子节点，每个子节点本身又是子树的根。因此，树自然上是递归的。叶子节点是没有子节点的节点；内部节点是任何非叶子节点。树中的分支是从根开始到叶子节点的连接边的路径。树通常以根在顶端的方式绘制。\n\
    \n例如，在下方的树图中，31 是根，7 是 5 的孩子，24 是叶子节点，14 是内部节点。\n\n![image](img/137x001.png)\n\
    \n树中节点之间的父子关系自然地引出了许多其他亲属术语，如父节点、祖父、兄弟、祖先和后代。每个节点都有唯一的父节点，根节点除外没有父节点。\n\n树中节点\
    \ `n` 的深度或层次是递归定义的：\n\n$\\text{depth(n)} = \\left\\{ \\begin{matrix} 1 & \\text{如果是根节点}\
    \ \\\\ {\\text{1} + \\text{depth(parent(n))}} & \\text{否则} \\end{matrix} \\right.$\n\
    \n树的高度是其最大深度。上面的树高度为 3，节点 25 位于第 2 层。\n\n最常见的树之一是二叉树，其中每个节点最多有两个孩子，通常命名为左和右。以下示例说明了二叉树的许多用途中的几种。\n\
    \n### 表达式树\n\n算术表达式可以通过将每个二元运算转换为树来表示为二叉树，其中操作符作为根，两个操作数作为操作符的孩子。例如，(a + b) *\
    \ c 可以表示为如下的二叉树：\n\n![image](img/138x001.png)\n\n这样的树被称为表达式树或解析树，因为它表示了表达式的句法结构。\n\
    \n表达式树中的子表达式与子树之间存在自然的对应关系。例如，(a + b) 是 (a + b) * c 的子表达式，它作为左左子树出现：\n\n### 二叉搜索树\n\
    \n二叉搜索树是一种二叉树，其中对于每个节点，左子树的所有值都小于该节点的值，右子树的所有值都大于它。这种属性允许高效的搜索、插入和删除。\n\n二叉搜索树通常缩写为\
    \ `BST`。对于每个节点 $p$：\n- 左子树的所有键小于 $p.key$\n- 右子树的所有键大于 $p.key$\n\n### 二叉搜索树的操作\n\
    \n二叉搜索树的主要操作是搜索、插入和删除。\n\n- 搜索具有特定键的节点。\n- 插入新键并维护 BST 属性。\n- 删除键并根据需要重新排列树以维护\
    \ BST 属性。\n\n实现这些操作的一种方法是使用递归。\n\n### 平衡二叉搜索树\n\n虽然二叉搜索树提供了 $O(h)$ 操作，但在最坏情况下（如果树是倾斜的），高度\
    \ $h$ 可能为 $O(n)$。为了确保 $O(\\log n)$ 的性能，我们使用平衡二叉搜索树。AVL 树中任意两个子树的高度差最多为一。如果某个操作导致这种差异超过一，则执行旋转来重新平衡树。\n\
    \n红黑树是另一种自平衡的 BST。它们使用颜色方案（红色或黑色）和某些规则来确保树保持平衡。\n\n### 将通用树表示为二叉树\n\n左孩子/右兄弟表示法是将通用树表示为二叉树的一种方法。在这种表示中：\n\
    - 二叉树中节点的左孩子指向通用树的第一个孩子。\n- 二叉树中节点的右孩子指向通用树中的下一个兄弟。\n\n这允许我们使用二叉树结构表示任何树，其中每个节点最多有两个指针。\n\
    \n"
- fmt: "\n1. (a)\n   ![image](image/141x001.png)\n\n2. (b)\n   ![image](image/141x002.png)\n\
    \n8. Draw the associated general tree for each of these binary trees using the\
    \ left child/right sibling convention:\n   1. (a)\n      ![image](image/141x003.png)\n\
    \   2. (b)\n      ![image](image/141x004.png)\n\n9. Draw a binary tree with five\
    \ nodes that is its own associated general tree using the left child/right sibling\
    \ convention.\n\n## 8.2 Traversals\n\nRecall that a tree has a root and then some\
    \ number of children, each of which is itself the root of a subtree. This recursive\
    \ structure—that trees are built from subcomponents that are also trees—leads\
    \ to recursive traversal methods for binary trees. As with linked lists (see [Section\
    \ 6.3](#K20431_C006.xhtml_ch6.3)), a traversal of a tree is a method that visits\
    \ every node in the tree.\n\n### Depth-First\n\nIf the tree is binary, then there\
    \ are three ways to naturally order the steps of a recursive traversal, depending\
    \ on when the node itself is visited:\n\n- **Preorder (node, left, right)** visits\
    \ the node, traverses the left subtree, and traverses the right subtree.\n- **Inorder\
    \ (left, node, right)** traverses the left subtree, visits the node, and traverses\
    \ the right subtree.\n- **Postorder (left, right, node)** traverses the left subtree,\
    \ traverses the right subtree, and visits the node.\n\nVisiting a node just refers\
    \ to whatever a method needs to do with each node, such as printing, counting,\
    \ or modifying the node.\n\nEach of these traversals is depth-first because it\
    \ traverses all the way down some branch before backtracking to reach other nodes.\
    \ Depth-first traversals may be defined for other trees, as well, but we limit\
    \ our use to binary trees.\n\n#### Example\n\nConsider this binary tree:\n![image](image/142x001.png)\n\
    \nBy hand, the preorder traversal is probably easiest because nodes are visited\
    \ first as you reach each subtree:\n![image](image/142x002.png)\n\nInorder traversal,\
    \ on the other hand, benefits from a top-down view:\n![image](image/143x001.png)\n\
    \nIf you write inorder traversals from beginning to end rather than top-down,\
    \ then you need to keep track of when subtrees are finished. For example, after\
    \ node 54, when the left subtree of 19 is finished, then you need to remember\
    \ to visit the 19 node. Postorder is similar to inorder except that the node itself\
    \ comes last:\n![image](image/143x002.png)\n\n### Breadth-First\n\nA breadth-first\
    \ traversal visits nodes in level order: level 1 first, then level 2, and so on.\
    \ Like preorder traversals, the root will always be visited first in a breadth-first\
    \ traversal. Breadth-first traversals are not naturally recursive. In fact, relative\
    \ to the connections that exist between parents and children, a breadth-first\
    \ traversal appears to jump around the tree.\n\nUsing a `queue` to keep track\
    \ of the next nodes to visit leads to the nice algorithm in [Listing 8.1](#K20431_C008.xhtml_lis8.1).\
    \ Because any number of children may be enqueued in step 4, the breadth-first\
    \ traversal algorithm may be used with any tree.\n\nListing 8.1: Breadth-First\
    \ Traversal (Pseudocode)\n\n```\n1 Enqueue root\n```\n```\n2 While queue is not\
    \ empty\n```\n```\n3 Dequeue and visit node\n```\n```\n4 Enqueue children of node\n\
    ```\n\n#### Example\n\nBreadth-first traversals are easy by hand because you just\
    \ trace across the levels. To see how the `queue` works in [Listing 8.1](#K20431_C008.xhtml_lis8.1),\
    \ consider this small binary tree: 41\n![image](image/143x003.png)\n\nThen the\
    \ sequence of operations looks like this:\n\n| Dequeue and Visit | Enqueue | Queue\
    \ Contents |\n| --- | --- | --- |\n| | 41 | 41 |\n| 41 | 32, 15 | 32, 15 |\n|\
    \ 32 | 40, 3 | 15, 40, 3 |\n| 15 | 8 | 40, 3, 8 |\n| 40 | | 3, 8 |\n| 3 | | 8\
    \ |\n| 8 | | |\n\n#### Exercises\n\n1. Describe the base case for the three recursive\
    \ depth-first traversals.\n2. List the order in which nodes are visited using\
    \ each of these traversals on the tree below:\n   ![image](image/144x001.png)\n\
    \   1. (a) Preorder\n   2. (b) Inorder\n   3. (c) Postorder\n   4. (d) Breadth-first\
    \ Show how the `queue` contents change using [Listing 8.1](#K20431_C008.xhtml_lis8.1),\
    \ as in the example above.\n3. List the order in which nodes are visited using\
    \ each of these traversals on the tree below:\n   ![image](image/144x002.png)\n\
    \   1. (a) Preorder\n   2. (b) Inorder\n   3. (c) Postorder\n   4. (d) Breadth-first\
    \ Show how the `queue` contents change using [Listing 8.1](#K20431_C008.xhtml_lis8.1),\
    \ as in the example above.\n\n## 8.3 Binary Tree Class\n\nRecall that a tree has\
    \ a root and then some number of children, each of which is itself the root of\
    \ a subtree. This recursive structure—that trees are built from subcomponents\
    \ that are also trees—leads to recursive traversal methods for binary trees. As\
    \ with linked lists (see [Section 6.3](#K20431_C006.xhtml_ch6.3)), a traversal\
    \ of a tree is a method that visits every node in the tree.\n\nAs a prelude to\
    \ implementing binary trees in [Chapter 9](#K20431_C009.xhtml_ch9), this section\
    \ develops a general `BinaryTree` class to represent any tree. It defines the\
    \ basic structure common to any tree: a root, a node structure, and traversal\
    \ methods. However, it will not be used for creating objects; it is designed only\
    \ to be extended by specific classes like `BinarySearchTree`.\n\n[Table 8.1](#K20431_C008.xhtml_tab8.1)\
    \ gives the public API of the `BinaryTree` class. (Since `BinaryTree` is a class\
    \ and not an interface, we are not considering it an ADT.) The `toString()` method\
