    \n## 1.5 编写类\n\n类允许我们在 Java 中定义新的数据类型。由类定义的类型被称为对象类型或类类型，所有对象类型都是引用类型。Listing\
    \ 1.5 定义了一个 `Fraction` 类型。\n\n列表 1.5：Fraction 类\n\n```\n1 public class Fraction\
    \ {\n```\n\n```\n2 private int num;\n```\n\n```\n3 private int den;\n```\n\n```\n\
    4\n```\n\n```\n5 public Fraction(int num, int den) {\n```\n\n```\n6  this.num\
    \ = num;\n```\n\n```\n7  this.den = den;\n```\n\n```\n8}\n```\n\n```\n9\n```\n\
    \n```\n10 public Fraction(int n) {\n```\n\n```\n11  this(n, 1);\n```\n\n```\n\
    12}\n```\n\n```\n13\n```\n\n```\n14 public void addOn(Fraction f) {\n```\n\n```\n\
    15  num = num * f.den + den * f.num;\n```\n\n```\n16  den *= f.den;\n```\n\n```\n\
    17}\n```\n\n```\n18\n```\n\n```\n19 public static Fraction add(Fraction f1, Fraction\
    \ f2) {\n```\n\n```\n20  int n = f1.num * f2.den + f1.den * f2.num;\n```\n\n```\n\
    21  int d = f1.den * f2.den;\n```\n\n```\n22  return new Fraction(n, d);\n```\n\
    \n```\n23}\n```\n\n```\n24\n```\n\n```\n25 @Override\n```\n\n```\n26 public String\
    \ toString() {\n```\n\n```\n27  return num + \"/\" + den;\n```\n\n```\n28}\n```\n\
    \n```\n29\n```\n\n```\n30 public static void main(String[] args) {\n```\n\n```\n\
    31  Fraction f1 = new Fraction(3, 4);\n```\n\n```\n32  Fraction f2 = new Fraction(1,\
    \ 3);\n```\n\n```\n33  System.out.print(f1 + \" + \" + f2 + \" = \");\n```\n\n\
    ```\n34  System.out.println(add(f1, f2));\n```\n\n```\n35  f1.addOn(f2);\n```\n\
    \n```\n36  System.out.println(\"Using addOn() changes f1 to \" + f1);\n```\n\n\
    ```\n37}\n```\n\n```\n38}\n```\n\n### 类定义\n\n一个典型的 Java 类定义如下：\n\n```\nmodifiers\
    \ class ClassName {\n```\n\n```\n // 字段声明\n```\n\n```\n // 方法定义\n```\n\n```\n\
    }\n```\n\n大括号内的类体定义了类的成员，通常是字段和方法。也可以在类内部定义类，被称为嵌套类。我们稍后在创建链接结构时会看到它的用途。\n\n###\
    \ 可见性\n\nJava 允许使用访问修饰符指定类及其成员的可见性。这些修饰符控制了其他代码部分可以使用该类或其成员。如果一个类被声明为 `public`，则任何其他类都可以使用它。通常情况下，`public`\
    \ 类应该存储在与类同名的文件中。\n\n现在，我们将为类成员使用两个访问修饰符：\n\n| public | 处处可用。 |\n| private | 仅在类内部访问。\
    \ |\n\n访问修饰符的主要用途是封装。如果类被声明为 `public`，则任何其他类都可以使用它。通常情况下，一个 `public` 类应该存储在与类同名的文件中。\n\
    \n现在，我们将为类成员使用两个访问修饰符：\n\n| public | 处处可用。 |\n| private | 仅在类内部访问。 |\n\n访问修饰符的主要用途是封装。如果类被声明为\
    \ `public`，则任何其他类都可以使用它。通常情况下，一个 `public` 类应该存储在与类同名的文件中。\n\n### 声明和初始化字段\n\n\
    字段声明仅仅是类体中的变量。例如，在 Listing 1.5 中，`num` 和 `den` 被声明为 `private`。\n\n字段可以在声明时初始化，也可以通过构造函数赋值。因此，与其使用字段初始化器，我们编写构造函数为分数的创建提供方便的方法。\n\
    \n### 编写方法\n\n你已经熟悉了编写方法，尽管在本节之前，所有的方法都是 `static` 的。方法必须声明其返回类型和参数类型。\n\n在非静态方法内部，`this`\
    \ 关键字指向调用该方法的对象。因此，在方法体内部：\n\n```\nthis.fieldName\n```\n\n引用的是字段而不是其他变量。\n\n###\
    \ 编写构造函数\n\n回想上一节，构造函数配合 `new` 使用以创建新对象。因此，构造函数的主要目的是将新对象设置为有效状态，即其字段具有有意义的值。对于\
    \ `Fraction` 类来说，分子和分母没有自然的默认值，因此在创建分数时必须指定分子和分母的值。\n\n构造函数始终与类同名，且没有返回类型。它们可以指定自己的可见性。\n\
    \n### 方法和构造函数的重载\n\nJava 允许定义同一个方法或构造函数的多个版本，只要每个版本具有唯一的签名。方法的签名签名是它的名称和参数列表。返回类型和参数名都不属于签名的一部分。定义多个版本的方法被称为重载方法。\n\
    \n在 Listing 1.5 中，构造函数被重载了；两个构造函数的签名分别为：\n\n```\n Fraction(int, int)\n```\n\n\
    ```\n Fraction(int)\n```\n\n在重载构造函数时，可以使用 `this()` 作为构造函数的第一条语句，以便调用不同的构造函数：\n\
    \n```\nthis(arguments);\n```\n\n"
- fmt: "\nThis reduces duplication of code, usually by writing full code for the most\
    \ general constructor and then calling `this()` in the more specialized constructors.\
    \ For example, in [Listing 1.5](#K20431_C001.xhtml_lis1.5), the first constructor\
    \ is a general constructor for fractions `n/d`, while the second constructor calls\
    \ `this(n, 1)` on line 11 to create fraction objects for integers `n = n/1`.\n\
    \n### Instance and Static Methods\n\nThe syntax for method calls described in\
    \ [Section 1.4](#K20431_C001.xhtml_ch1.4) is the standard way of calling instance\
    \ methods, which are always called from an instance of a class, meaning an object:\n\
    \n```\nobject.method(arguments)\n```\n\nInstance methods have no special designation\
    \ in a class; in other words, all methods are instance methods unless declared\
    \ otherwise. In [Listing 1.5](#K20431_C001.xhtml_lis1.5), the `addOn()` and `toString()`\
    \ methods are instance methods. You can see the above calling syntax used with\
    \ the `addOn()` method in line 35. There, the `addOn()` method is called on the\
    \ instance `f1`, modifying `f1` by adding `f2` onto it.\n\nIn contrast, static\
    \ methods do not need to be called from any object.[1](#K20431_C001.xhtml_ch1fn1)\
    \ They are considered class methods rather than object methods. In fact, you can\
    \ think of “static” as a synonym for “class.” Methods are declared static with\
    \ the `static` modifer:\n\n```\nstatic returnType staticMethod(parameters) {...}\n\
    ```\n\nInside of its own class definition, a static method may be called by simply\
    \ providing the name of the method and its arguments:\n\n```\nstaticMethod(arguments)\n\
    ```\n\nThis syntax is used in the call to `add()` in line 34, where the sum of\
    \ `f1` and `f2` is printed.\n\nCompare the `add()` and `addOn()` methods to help\
    \ understand the difference between instance and static methods:\n\n`addOn()`\
    \ is an instance method so must be called from a particular fraction. It modifies\
    \ the fraction it is called on.\n\n`add()` is a static method and adds two given\
    \ fractions, returning a new fraction as the result.\n\nBecause instance methods\
    \ are more common than static methods, the term “method” will normally refer to\
    \ instance methods.\n\n### Calling Static Methods from Other Classes\n\nStatic\
    \ methods from other classes are called by prefixing the method name with the\
    \ class name:\n\n```\nClassName.staticMethod(arguments)\n```\n\n### Instance and\
    \ Static Fields\n\nAs with methods, there are also instance fields and static\
    \ fields. An instance field or instance variable is a variable for which each\
    \ object has its own separate storage. There is no special designation for instance\
    \ fields, so once again, all fields are instance fields unless specified static.\
    \ Thus, in the `Fraction` class,\n\n```\n private int num;\n```\n\n```\n private\
    \ int den;\n```\n\nboth `num` and `den` are instance variables, and so every fraction\
    \ stores its own numerator and denominator.\n\nFields may be declared static,\
    \ in which case the entire class shares a single storage location for that field.\
    \ Because of this, static fields can be thought of as class variables. Static\
    \ fields are not used as often as instance fields, so the term “field” usually\
    \ refers to instance variables.\n\n### toString() Methods\n\nAny class may provide\
    \ a `toString()` method to indicate how objects of that type should be converted\
    \ to strings. In [Listing 1.5](#K20431_C001.xhtml_lis1.5), the `toString()` method\
    \ of the `Fraction` class returns the string\n\n```\n num + \"/\" + den\n```\n\
    \nOne of the advantages of writing a `toString()` method is that it will be called\
    \ automatically by `System.out.println()` when printing an object of that type.\
    \ Thus, for example, when `f1` is printed at line 33, its output will be “3/4.”\n\
    \nWe will revisit `toString()` methods and the `@Override` annotation used in\
    \ [Listing 1.5](#K20431_C001.xhtml_lis1.5) in [Section 5.3](#K20431_C005.xhtml_ch5.3).\n\
    \n### Exercises\n\n1. Give the signatures of each of these methods from [Listing\
    \ 1.5](#K20431_C001.xhtml_lis1.5):\n    1. (a) `addOn()`\n    2. (b) `add()`\n\
    \    3. (c) `toString()`\n    4. (d) `main()`\n2. Give the signatures of each\
    \ of these methods:\n    1. (a) `factorial()` from [Listing 1.1](#K20431_C001.xhtml_lis1.1)\n\
    \    2. (b) `count()` from [Listing 1.2](#K20431_C001.xhtml_lis1.2)\n    3. (c)\
    \ `linearSearch()` from [Listing 1.3](#K20431_C001.xhtml_lis1.3)\n    4. (d) `acronym()`\
    \ from [Listing 1.4](#K20431_C001.xhtml_lis1.4)\n3. Explain why the methods listed\
    \ in Exercise 2 were declared static.\n4. Would Java allow the name of the `addOn()`\
    \ method in [Listing 1.5](#K20431_C001.xhtml_lis1.5) to be changed to `add()`?\
    \ Explain why or why not.\n5. Add code to the `main()` of [Listing 1.5](#K20431_C001.xhtml_lis1.5)\
    \ to accomplish these tasks:\n    1. (a) Declare and create a `Fraction` with\
    \ value `5/8`. Print the value of `f`.\n    2. (b) Declare and create a `Fraction`\
    \ with value `17/3`. Print the value of `g`.\n    3. (c) Declare and create a\
    \ `Fraction` with value `f + g`. Print the value of `h`.\n    4. (d) Declare and\
    \ create a `Fraction` with value `5`. Print the value of `j`.\n    5. (e) Increase\
    \ the value of `g` by `5`. Print the new value of `g`.\n6. Add these methods to\
    \ the `Fraction` class of [Listing 1.5](#K20431_C001.xhtml_lis1.5). Modify `main()`\
    \ to test your functions:\n    1. (a) `subtract(f)` to subtract `f` from this\
    \ fraction\n    2. (b) `multiplyBy(f)` to multiply this fraction by `f`\n    3.\
    \ (c) `divideBy(f)` to divide this fraction by `f`\n    4. (d) `addOn(n)` to add\
    \ integer `n` to this fraction\n7. Add these methods to the `Fraction` class of\
    \ [Listing 1.5](#K20431_C001.xhtml_lis1.5). Modify `main()` to test your functions:\n\
    \    1. (a) `subtract(f1, f2)` to compute `f1 - f2`\n    2. (b) `multiply(f1,\
    \ f2)` to compute `f1 * f2`\n    3. (c) `divide(f1, f2)` to compute `f1 / f2`\n\
    8. Write a `reduce()` method for the `Fraction` class of [Listing 1.5](#K20431_C001.xhtml_lis1.5)\
    \ that reduces this fraction to its lowest terms. Assume all terms are positive\
    \ and use the `gcd()` function.\n9. Modify the `reduce()` method from the previous\
    \ exercise to handle negative fractions correctly. Have the constructor make all\
    \ denominators are positive, so that negative fractions have a negative numerator.\
    \ Use the `Math.abs()` library function if you need absolute value. Add calls\
    \ to `reduce()` to other methods in the class where they are necessary.\n"
