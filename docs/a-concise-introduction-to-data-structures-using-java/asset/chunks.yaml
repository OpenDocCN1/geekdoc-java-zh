    \ Protected members are also accessible by classes in the same package, but named\
    \ packages are not used in this text.\n\n[2](#K20431_C005.xhtml_ich5fn2)Overriding\
    \ equals() is not as straightforward as it might seem. See Items 8 and 9 from\
    \ Bloch [[4]](#K20431_bib.xhtml_ref_4) for details.\n\nChapter 6\n\n# Lists\n\n\
    The power of stacks and queues as linear data structures lies in their limited\
    \ interface: elements may only be added or removed in specific ways. Controlling\
    \ insertion and deletion in this way allows designing for O(1) performance for\
    \ those operations.\n\nLists, on the other hand, provide a very flexible interface\
    \ that allows inserting and removing elements anywhere in the list. This flexibility\
    \ comes at a price, though: operations will no longer necessarily be O(1).\n\n\
    ## 6.1 Interface\n\nThe List ADT views its data much like an array does: elements\
    \ are accessible via consecutive indices.\n\n### List Indexing\n\nThink of references\
    \ in a list as stored at indices 0 through one less than the number of elements\
    \ in the list, just like an array:\n\n![image](image/105x001.png)\n\nThis description\
    \ implies:\n\nLists are dynamic because they continually grow and shrink as items\
    \ are added and removed. The length of a list always depends on the number of\
    \ elements in it and is not fixed like an array.\n\nThere are never gaps between\
    \ items in a list because it is defined to use indices 0 through size − 1.\n\n\
    Be aware that the list may not be implemented with an array, so this diagram is\
    \ just a way to think about how the elements are organized by the ADT. In fact,\
    \ a linked implementation will be developed in [Section 6.3](#K20431_C006.xhtml_ch6.3).\n\
    \n### List ADT\n\nWhereas the stack or queue ADTs are fairly standard, the List\
    \ abstract data type has many variations and can be quite complex. We will use\
    \ the set of methods in [Table 6.1](#K20431_C006.xhtml_Text_Anchor_tab6.1).\n\n\
    Table 6.1\n\nList ADT\n\n| void add(E item)Adds item to end of list. |\n\n| void\
    \ add(int index, E item)Inserts item at index, shifting items to right to make\
    \ room. If index = size, adds item to the end of the list. |\n\n| E get(int index)Returns\
    \ item at index. |\n\n| int indexOf(E item)Index of first occurrence of item in\
    \ list, − 1 if not found. |\n\n| boolean isEmpty()True if list has no elements.\
    \ |\n\n| E removeAt(int index)Removes and returns item at index, shifting remaining\
    \ items to left. |\n\n| E set(int index, E item)Replaces item at index, returning\
    \ the previous value. |\n\n| int size()Number of elements in list. |\n\n### Shifting\n\
