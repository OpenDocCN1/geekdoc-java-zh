  trans: "\n`List` ADT 重载了 `add()` 方法，因为提供了两个版本。当对于本质上是同一个方法，使用多一组参数可能更方便时，重载就非常有用了。在这种情况下，向列表末尾添加项可能是很常见的操作，因此它提供了一个简化的方法调用方式。\n\
    \n### 数组与列表\n\n从某种意义上说，列表（list）是一种更强大的数组（array），它可以根据需要进行增长，并在插入和删除时移动元素。因为它是一个\
    \ ADT（抽象数据类型），列表可以用多种方式实现以提供不同的性能特性。\n\n事实上，大多数 Java 编程都是使用 `java.util` 库中的列表而不是数组完成的。我们一直使用数组是为了研究不同数据结构的低级实现细节。一旦你了解了这些结构的工作原理，`List`\
    \ ADT 的实现将更加强大和方便。\n\n### 练习题\n\n1.  展示在一个名为 `items` 的初始空整数列表上执行这些操作的结果。标出所有非\
