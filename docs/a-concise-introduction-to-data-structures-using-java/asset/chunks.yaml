    \ is created. Thus, instead of using field initializers, we write constructors\
    \ to provide convenient means for fraction objects to be created.\n\nConstructors\
    \ always have the same name as the class and do not have a return type. They may\
    \ specify their own visibility.\n\nOverloading Methods and Constructors\n\nJava\
    \ allows defining more than one version of a method or constructor as long as\
