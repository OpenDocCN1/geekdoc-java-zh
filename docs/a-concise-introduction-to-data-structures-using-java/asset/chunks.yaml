    \n### 项目：集合层次结构\n\n你可能已经注意到栈、队列和列表数据结构中存在一些代码重复。抽象类可以通过定义公共字段和方法来帮助减少这种重复。决定将什么放入抽象父类中没有单一的最佳方法，但其核心思想是旨在实现一种能够度地减少重复代码的设计。\n\
    \n如果我们列出栈、队列和列表的共同点，看起来像这样：\n\n- 所有的结构都有 `size()` 和 `isEmpty()` 方法。某些结构还包含一个 `size`\
    \ 实例变量。\n- 数组结构都有一个 `data` 数组实例变量、两个构造函数和一个 `resize()` 方法。队列需要它专门的 `resize()`\
    \ 版本，并有一个单独的 `capacity` 实例变量。\n- 链式结构定义了一个私有的 `node` 类，并且至少有一个 `head` 实例变量。\n\n\
    这些共同特征建议了以下继承层次结构：\n\n![image](img/148x001.png)\n\n记住，子类在继承其父类的字段和方法之外，还可以定义新的字段和方法，并重写现有方法。\n\
    \n### 练习\n\n1. 按上述描述开发一个集合层次结构。编写必要的抽象类并修改具体类以参与该层次结构。\n\n虽然建议了一种通用方法，但你仍需要在过程中做出特定的设计决策。写一份短报告解释你所做的选择，包括你如何处理这些决策以及你考虑过的替代方案。\n\
    \n1 根的兄弟节点可以被视为同一森林中的其他根。这允许用一棵二叉树来表示整个通用树森林。\n\n# 第 9 章\n\n# 二叉搜索树\n\n接下来的几章节重点关注提供快速搜索、插入和删除的数据结构。二叉搜索树在所有三个操作上通常都具有很好的性能。回想第\
    \ 8.1 节，我们假设二叉搜索树不包含重复元素。\n\n表 9.1 列出了 `BinarySearchTree` 类的公共 API。\n\n#### 表\
    \ 9.1：二叉搜索树\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `add(item)` | 如果不存在则添加。 |\n| `contains(item)`\
    \ | 如果在树中返回真。 |\n| `min()` | 返回最小元素。 |\n| `max()` | 返回最大元素。 |\n| `pred(item)`\
    \ | 返回前驱元素。 |\n| `remove(item)` | 如果找到并移除则返回真。 |\n| `succ(item)` | 返回后继元素。 |\n\
    \n## 9.1 查询\n\n二叉搜索树是为了快速构建排序列表。\n\n### 搜索\n\n搜索二叉树的算法基于比较搜索键和节点值，从根开始。如果键匹配节点值，则找到了；否则，如果键较小则搜索左子树，较大则搜索右子树。如果当前节点为\
    \ `null`，则元素不在树中。\n\n列表 9.1 开始定义 `BinarySearchTree` 类，带有 `contains()` 方法和私有的 `findNode()`。所有的二叉搜索方法将以相同的方式编写，即公共方法调用私有方法，该私有方法可能是递归的。\n\
    \n`BinarySearchTree` 类继承自第 8.3 节中的 `BinaryTree` 类。并且像第 7.3 节中一样，类型参数 `E` 需要声明为\n\
    \n```\n<E extends Comparable<? super E>>\n```\n\n以保证元素是可以进行比较的。\n\n### 最小值和最大值\n\
    \n二叉搜索树的结构允许轻松访问树中的最大和最小元素。最小元素通过尽可能向左链接找到，而最大元素通过尽可能向右链接找到：71\n\n![image](img/153x001.png)\n"
- fmt: "\nThus, the minimum of this tree is 3 and the maximum is 99. These algorithms\
    \ can also be applied to any subtree to find the largest and smallest elements\
    \ of the subtree by simply beginning at the root of the subtree. For example,\
    \ going right as far as possible from 15 leads to 65, which is the maximum of\
    \ the subtree rooted at 15.\n\n### Predecessor and Successor\n\nThe predecessor\
    \ of an element in a binary search tree is the element that precedes it during\
    \ an inorder traversal. The successor is defined similarly as the element immediately\
    \ following. The minimum in a tree has no predecessor, and the maximum has no\
    \ successor.\n\nThe predecessor is easy to find if the node has a left subtree:\
    \ it is the maximum of the left subtree. For example, the predecessor of 71 in\
    \ the tree above is 65 because, as we found, 65 is the maximum of the left subtree\
    \ rooted at 15.\n\nHowever, if there is no left subtree, we need to move up the\
    \ tree to find the predecessor. Consider the node 82 in the same tree. The predecessor\
    \ of 82 is found by moving up toward the root using parent links until a right-child\
    \ relationship is found. In this example, the link between 82 and 88 is a left-child\
    \ relationship, but the link between 71 and 88 is a right-child. Thus, 71 is the\
    \ predecessor of 82:\n\n![image](image/153x002.png)\n\n[Listing 9.2](#K20431_C009.xhtml_lis9.2)\
    \ gives the code for both the public `pred()` method and its private helper `predNode()`.\
    \ Notice that `pred()` uses `findNode()` to get started, and then `predNode()`\
    \ uses a private `maxNode()` helper (see Exercise 5b) for the case when `n.left`\
    \ is not null.\n\nListing 9.2: Binary Search Tree Predecessor\n\n```\n 1 public\
    \ E pred(E item) {\n 2 Node<E> n = findNode(item, root);\n 3 if (n == null) return\
    \ null;\n 4 Node<E> pred = predNode(n);\n 5 return (pred != null) ? pred.data\
    \ : null;\n 6 }\n 7 \n 8 private Node<E> predNode(Node<E> n) {\n 9 if (n.left\
    \ != null) return maxNode(n.left);\n 10 Node<E> p = n.parent;\n 11 while (p !=\
    \ null && p.right != n) {\n 12 n = p;\n 13 p = n.parent;\n 14 }\n 15 return p;\n\
    \ 16 }\n```\n\n### Conditional Operator\n\nLine 5 of [Listing 9.2](#K20431_C009.xhtml_lis9.2)\
    \ uses the Java conditional operator. The conditional operator `?:` creates an\
    \ expression via this syntax:\n\n```\ntest ? valueIfTrue : valueIfFalse\n```\n\
    \nThis expression has the value `valueIfTrue` if the boolean test is true; otherwise,\
    \ it has the value `valueIfFalse`. For example, the expression in line 5:\n\n\
    ```\nreturn (pred != null) ? pred.data : null;\n```\n\nreturns `pred.data` if\
    \ `pred` is not null, and returns `null` otherwise. It is exactly equivalent to\
    \ the longer:\n\n```\nif (pred != null) {\n return pred.data;\n} else {\n return\
    \ null;\n}\n```\n\nConditional expressions are useful for assignments or return\
    \ statements like this that involve a quick test. Parentheses around the test\
    \ are optional, but those in [Listing 9.2](#K20431_C009.xhtml_lis9.2) mimic the\
    \ required parentheses in an if-statement.\n\n### Performance\n\nAll of the above\
    \ queries in a binary search tree are `O(h)`, where `h` is the height of the tree.\
    \ We postpone analyzing these operations in terms of `n`, the number of nodes\
    \ in the tree, until [Section 9.4](#K20431_C009.xhtml_ch9.4).\n\n### Exercises\n\
    \n1. Use this binary search tree to answer the questions below.\n\n   ![image](image/155x001.png)\n\
    \n   1. (a) List nodes in the order they are visited in a search for the key 14.\n\
    \   2. (b) List nodes in the order they are visited in a search for the key 51.\n\
    \   3. (c) List nodes in the order they are visited in a search for the key 22.\n\
    \   4. (d) List nodes in the order they are visited in a search for the key 69.\n\
    \   5. (e) Determine the minimum and maximum elements in the tree.\n   6. (f)\
    \ Determine the predecessor and successor of 13 in the tree.\n   7. (g) Determine\
    \ the predecessor and successor of 24 in the tree.\n   8. (h) Determine the predecessor\
    \ and successor of 27 in the tree.\n   9. (i) Determine the predecessor and successor\
    \ of 68 in the tree.\n\n2. Give one reason the binary tree `Node` class in [Listing\
    \ 8.2](#K20431_C009.xhtml_lis8.2) includes a parent reference.\n\n3. Describe\
    \ the base case(s) for `findNode()` in [Listing 9.1](#K20431_C009.xhtml_lis9.1).\n\
    \n4. Could `addNode()` of [Listing 9.2](#K20431_C009.xhtml_lis9.2) be written\
    \ recursively?\n\n5. Implement the following methods in `BinaryTree`:\n   - (a)\
    \ `min()`\n   - (b) `max()`\n   - (c) `successor()`\n   - (d) `toString()`\n\n\
    6. If your solution to 5a used recursion, write a non-recursive version, and vice\
    \ versa.\n\n7. If your solution to 5b used recursion, write a non-recursive version,\
    \ and vice versa.\n\n8. Explain why each of these search tree queries is `O(h)`,\
    \ where `h` is the height.\n\n### 9.2 Insertion\n\nInserting into a binary search\
    \ tree follows the same pattern as search. In fact, an unsuccessful search ends\
    \ at a null pointer that is exactly where the item should be inserted. For example,\
    \ to insert 24 in this binary tree, the search path ends left:\n\n![image](image/156x001.png)\n\
    \nAs with queries from the previous section, the public `add()` method of `BinaryTree`\
    \ should handle the following:\n\n- If the item is null, do nothing.\n- If the\
    \ root is null, insert item at root.\n- Else, start `addNode()` at the root.\n\
    \nThe private `addNode()` method is outlined in [Listing 9.3](#K20431_C009.xhtml_lis9.3).\
    \ It has the same structure as `findNode()`, except that it checks for a null\
    \ child before making its recursive calls. If the child in the correct direction\
    \ is null, that is the place to insert a new node.\n\nUnlike `findNode()` and\
    \ `predNode()`, `addNode()` is a `void` method because its purpose is to insert\
    \ a new node rather than return a particular node. You will be asked to implement\
    \ this algorithm in the exercises.\n\nListing 9.3: Binary Search Tree Insertion\
    \ (Pseudocode)\n\n```\n 1 // Assume item != null and n != null\n 2 If item < n.data\n\
    \ 3 If no left child, insert as n.left\n 4 Else call recursively on n.left\n 5\
    \ Else if item > n.data\n 6 If no right child, insert as n.right\n 7 Else call\
    \ recursively on n.right\n 8 Else do nothing (to prevent duplicates)\n```\n\n\
    ### Java Assertions\n\nNotice the comment on line 1 of [Listing 9.3](#K20431_C009.xhtml_lis9.3).\
    \ If the public `add()` method has done its job as described above, then neither\
    \ the item nor the node `n` are null at the start of `addNode()`. Furthermore,\
    \ those conditions should continue to be true at the start of any recursive call\
    \ of `addNode()`. Such a boolean condition that is expected to be true at the\
    \ start of a method is known as a precondition of the method.\n\nUnfortunately,\
    \ comments are not executable, so there is nothing preventing the programmer from\
    \ making a mistake and violating the precondition. A Java `assert` statement essentially\
    \ makes the comment executable:\n\n```\nprivate void addNode(E item, Node<E> n)\
    \ {\n assert item != null && n != null;\n // ...\n}\n```\n"
  raw: "Thus, the minimum of this tree is 3 and the maximum is 99\\. These algorithms\
    \ can also be applied to any subtree to find the largest and smallest elements\
    \ of the subtree by simply beginning at the root of the subtree. For example,\
    \ going right as far as possible from 15 leads to 65, which is the maximum of\
    \ the subtree rooted at 15.\n\n### Predecessor and Successor\n\nThe predecessor\
    \ of an element in a binary search tree is the element that precedes it during\
    \ an inorder traversal. The successor is defined similarly as the element immediately\
    \ following. The minimum in a tree has no predecessor, and the maximum has no\
    \ successor.\n\nThe predecessor is easy to find if the node has a left subtree:\
    \ it is the maximum of the left subtree. For example, the predecessor of 71 in\
    \ the tree above is 65 because, as we found, 65 is the maximum of the left subtree\
    \ rooted at 15.\n\nHowever, if there is no left subtree, we need to move up the\
    \ tree to find the predecessor. Consider the node 82 in the same tree. The predecessor\
    \ of 82 is found by moving up toward the root using parent links until a right-child\
    \ relationship is found. In this example, the link between 82 and 88 is a left-child\
    \ relationship, but the link between 71 and 88 is a right-child. Thus, 71 is the\
    \ predecessor of 82:\n\n![image](image/153x002.png)\n\n[Listing 9.2](#K20431_C009.xhtml_lis9.2)\
    \ gives the code for both the public pred() method and its private helper predNode().\
    \ Notice that pred() uses findNode() to get started, and then predNode() uses\
    \ a private maxNode() helper (see Exercise 5b) for the case when n.left is not\
    \ null.\n\nListing 9.2: Binary Search Tree Predecessor\n\n```\n 1 public E pred(E\
    \ item) {\n```\n\n```\n 2  Node<E> n = findNode(item, root);\n```\n\n```\n 3 \
    \ if (n == null) return null;\n```\n\n```\n 4  Node<E> pred = predNode(n);\n```\n\
    \n```\n 5  return (pred != null) ? pred.data : null;\n```\n\n```\n 6}\n```\n\n\
    ```\n 7\n```\n\n```\n 8 private Node<E> predNode(Node<E> n) {\n```\n\n```\n 9\
    \  if (n.left != null) return maxNode(n.left);\n```\n\n```\n 10 Node<E> p = n.parent;\n\
    ```\n\n```\n 11 while (p != null && p.right != n) {\n```\n\n```\n 12 n = p;\n\
    ```\n\n```\n 13 p = n.parent;\n```\n\n```\n 14 }\n```\n\n```\n 15 return p;\n\
    ```\n\n```\n 16}\n```\n\n### Conditional Operator\n\nLine 5 of [Listing 9.2](#K20431_C009.xhtml_lis9.2)\
    \ uses the Java conditional operator. The conditional operator “?:” creates an\
    \ expression via this syntax:\n\n```\ntest ? valueIfTrue : valueIfFalse\n```\n\
    \nThis expression has the value valueIfTrue if the boolean test is true; otherwise,\
    \ it has the value valueIfFalse. For example, the expression in line 5:\n\n```\n\
    return (pred != null) ? pred.data : null;\n```\n\nreturns pred.data if pred is\
    \ not null, and returns null otherwise. It is exactly equivalent to the longer\n\
    \n```\nif (pred != null) {\n```\n\n```\n return pred.data;\n```\n\n```\n} else\
    \ {\n```\n\n```\n return null;\n```\n\n```\n}\n```\n\nConditional expressions\
    \ are useful for assignments or return statements like this that involve a quick\
    \ test. Parentheses around the test are optional, but those in [Listing 9.2](#K20431_C009.xhtml_lis9.2)\
    \ mimic the required parentheses in an if-statement.\n\n### Performance\n\nAll\
    \ of the above queries in a binary search tree are O(h), where h is the height\
    \ of the tree. We postpone analyzing these operations in terms of n, the number\
    \ of nodes in the tree, until [Section 9.4](#K20431_C009.xhtml_ch9.4).\n\nExercises\n\
    \n1.  Use this binary search tree to answer the questions below.\n\n    ![image](image/155x001.png)\n\
    \n    1.  (a) List nodes in the order they are visited in a search for the key\
