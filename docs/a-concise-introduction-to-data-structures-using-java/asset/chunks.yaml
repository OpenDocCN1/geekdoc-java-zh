  raw: "When assertions are enabled, this statement throws an AssertionError if the\
    \ condition is false; otherwise, it does nothing. Assertions are disabled by default,\
    \ so to enable them, use the “-ea” or “-enableassertions” flag on the command\
    \ line or add it to the list of runtime options in your IDE.\n\nAssertions may\
    \ also be used to check postconditions, expected to be true at the end of a method\
    \ call, or more general invariants that are expected to remain true at any particular\
    \ point in the code.\n\nExercises\n\n1.  Draw the binary search tree that results\
    \ from inserting each of these sequences of elements into an empty tree:\n\n \
    \   1.  (a) 9, 10, 33, 43, 73, 47, 27, 67, 36, 49, 59, 89\n\n    2.  (b) 74, 25,\
    \ 94, 96, 67, 54, 69, 80, 38, 5, 23, 43\n\n    3.  (c) 69, 49, 59, 21, 61, 82,\
    \ 44, 91, 36, 1, 95, 74\n\n    4.  (d) 5, 38, 39, 94, 95, 85, 44, 88, 60, 33,\
    \ 1, 73\n\n    5.  (e) 98, 65, 20, 44, 49, 97, 38, 75, 29, 43, 30, 79\n\n2.  Describe\
    \ the base case(s) for the recursion in [Listing 9.3](#K20431_C009.xhtml_lis9.3).\n\
    \n3.  Implement binary search tree insertion by writing these methods in the BinarySearchTree\
    \ class:\n\n    1.  (a) add() See the discussion on page 157.\n\n    2.  (b) addNode()\
    \ Implement [Listing 9.3](#K20431_C009.xhtml_lis9.3). Use an assertion to test\
    \ the precondition, and remember to set the parent reference of the new node.\n\
    \n4.  Add assertions to the following methods in the BinarySearchTree class to\
    \ test appropriate preconditions:\n\n    1.  (a) predNode()\n\n    2.  (b) succNode()\n\
    \n5.  Write a main() method for the BinarySearchTree class to insert random integers\
    \ into a binary search tree and print the result.\n\n6.  Modify the previous exercise\
    \ to test each of these queries:\n\n    1.  (a) contains()\n\n    2.  (b) min()\n\
    \n    3.  (c) max()\n\n    4.  (d) pred()\n\n    5.  (e) succ()\n\n7.  Write a\
    \ main() method for the BinarySearchTree class to insert several strings into\
    \ a binary search tree and print the result.\n\n8.  Determine the O() performance\
    \ of binary search tree insertion in terms of h, the height of the tree. Explain\
    \ your answer.\n\n## 9.3 Deletion\n\nDeleting from a binary search tree is more\
    \ complex than other tree operations because it may have to change the internal\
    \ structure of the tree. For example, insertion is simpler because the new node\
    \ is always a leaf, which means there is no impact on the rest of the tree.\n\n\
    The first step is to understand how deletion works on paper. Remember that the\
    \ end result always has to be a valid binary search tree.\n\n### Deleting By Hand\n\
    \nThe process for deleting a node in a binary search tree depends on the number\
    \ of children it has.\n\n0 Children Deleting a leaf by hand is easy because it\
    \ doesn’t affect the rest of the tree. For example, deleting 12 in this tree simply\
    \ removes that node:\n\n![image](image/159x001.png)\n\n1 Child Deleting a node\
    \ with one child such as 51 is also not difficult, since we can move its one child\
    \ 61 up to replace it:\n\n![image](image/160x001.png)\n\n2 Children However, there\
    \ is no obvious way to delete a node with two children without disrupting the\
    \ binary search tree. Consider deleting 38 in the tree we just finished with:\n\
    \n![image](image/160x002.png)\n\nNeither of its children can take 38’s place at\
    \ the root: if 25 moves up, there would be nodes on its left that are too big,\
    \ and similarly, if 61 moves up, there would be nodes on its right that are too\
    \ small. (It is also not clear how we would handle the children of 25 or 61.)\
    \ The solution we adopt is to look elsewhere for a replacement: the inorder predecessor,\
    \ in this case, 31\\. It has the right relationship with the other elements in\
    \ the tree to take the position of 38:\n\n![image](image/160x003.png)\n\nFor the\
    \ same reason, the inorder successor could also be used.\n\nThis approach to deleting\
    \ a node n with two children involves two steps:\n\n1.  Copy the predecessor’s\
    \ value to n.\n\n2.  Delete the predecessor node.\n\nFor example, to delete 38\
    \ in this tree, find its predecessor, 31, and copy that value to where 38 was:\n\
    \n![image](image/160x004.png)\n\nThen delete the predecessor node:\n\n![image](image/161x001.png)\n\
    \nThe result is a legal binary search tree without the node 38.\n\nTo develop\
    \ the deletion algorithm, we combine the first two cases into one because they\
    \ need to do essentially the same work.\n\n### Nodes without Two Children\n\n\
    Deleting a node with one child involves replacing that node with its child. But\
    \ deleting a node with no children can be viewed in the same way: we replace that\
    \ node with one of its children—it’s just that the child happens to be null. Thus,\
    \ we develop a replace(n, child) method that replaces the given node with its\
    \ child in the tree, and allow for the fact that the child may be null.\n\nThere\
    \ are still three cases to consider, depending on the relationship of n with its\
    \ parent: it might have no parent (being the root), be a left child, or be a right\
    \ child:\n\n![image](image/161x002.png)\n\nReplacing n with child in each of these\
    \ cases is straightforward. Exercise 5b asks you to implement this replace() method.\n\
    \nPutting everything together leads to [Listing 9.4](#K20431_C009.xhtml_lis9.4),\
    \ which outlines the private recursive removeNode() helper method.\n\nListing\
    \ 9.4: Binary Search Tree Deletion (Pseudocode)\n\n```\n 1 If n.left is null\n\
    ```\n\n```\n 2  Replace n with n.right\n```\n\n```\n 3 Else if n.right is null\n\
    ```\n\n```\n 4  Replace n with n.left\n```\n\n```\n 5 Else\n```\n\n```\n 6  Find\
    \ predecessor of n\n```\n\n```\n 7  Copy data from predecessor to n\n```\n\n```\n\
    \ 8  Recursively delete predecessor\n```\n\nExercises\n\n1.  Suppose a node n\
    \ has two children in a binary search tree.\n\n    1.  (a) Explain where in the\
    \ tree the predecessor of n must be located.\n\n    2.  (b) Determine the number\
    \ of children the predecessor of n has. Explain your answer.\n\n2.  Is it always\
    \ true that the predecessor of a node in a binary search tree has no right child?\
    \ Explain why or why not.\n\n3.  Draw the binary search tree that results from\
    \ each of the deletions listed below. In each case, start over with the original\
    \ tree.\n\n    ![image](image/180x001.png)\n\n    1.  (a) Delete 45\n\n    2.\
    \  (b) Delete 75\n\n    3.  (c) Delete 5\n\n    4.  (d) Delete 20\n\n    5.  (e)\
    \ Delete 24\n\n    6.  (f) Delete 50\n\n4.  For each of these sequences of elements,\
    \ first draw the binary search tree created by inserting the sequence into an\
    \ empty tree. Then determine the order in which the elements are removed if the\
    \ root of the tree is repeatedly deleted until the tree is empty.\n\n    1.  (a)\
    \ 58, 77, 98, 30, 93, 26, 46\n\n    2.  (b) 64, 38, 6, 36, 57, 62, 40\n\n5.  Implement\
    \ binary search tree deletion in the BinarySearchTree class by writing these methods:\n\
    \n    1.  (a) remove() Finds the node to delete and then calls the private removeNode()\
    \ method, returning its (boolean) result.\n\n    2.  (b) replace() Private helper\
    \ method outlined on page 161\\. The child may be null, but if it is not null,\
    \ it will need an updated parent reference.\n\n    3.  (c) removeNode() Implement\
    \ [Listing 9.4](#K20431_C009.xhtml_lis9.4), returning true if the deletion is\
    \ successful.\n\n6.  Line 8 of [Listing 9.4](#K20431_C009.xhtml_lis9.4) suggests\
    \ using recursion to delete the predecessor.\n\n    1.  (a) Determine the maximum\
    \ number of times this recursive function could be called (to delete one element).\n\
    \n    2.  (b) Rewrite this step of removeNode() to directly remove the predecessor\
    \ without recursion.\n\n7.  Modify Exercise 5 from [Section 9.2](#K20431_C009.xhtml_ch9.2)\
    \ to remove the random items, one by one, printing the resulting tree after each\
    \ deletion. Store the entries in an array as they are inserted so that you have\
    \ them available to remove.\n\n8.  Determine the O() performance of binary search\
    \ tree deletion in terms of h, the height of the tree. Explain your answer.\n\n\
    ## 9.4 Performance"
