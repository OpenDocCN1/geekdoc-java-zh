  trans: "\n因此，所有的 Java 类都通过其公共方法和文档支持抽象数据类型。但事实远不止于。\n\n## Java 接口\n\nJava 接口允许我们直接在代码中表达\
    \ ADT。Java 接口包含方法声明，描述了对象可以做什么，但没有实现代码。由类来负责接口并提供具体的实现代码。\n\n定义接口的语法简单地使用 `interface`\
    \ 关键字而不是 `class`：\n\n```\npublic interface InterfaceName {\n```\n\n```\n // 字段声明（必须是\
    \ static final）\n```\n\n```\n // 方法声明\n```\n\n```\n}\n```\n\n接口内部的所有声明都被假设是公有的。接口还可以定义嵌套类和其他接口，但这些技术超出了本文的讨论范围。\n\
    \n列表 3.1 展示了如何将表 3.1 中的整数栈 ADT 编写成一个 Java 接口。\n\n列表 3.1：整数栈接口\n\n```\n1 public\
    \ interface IntStack {\n```\n\n```\n2 boolean isEmpty();\n```\n\n```\n3 int peek();\n\
    ```\n\n```\n4 int pop();\n```\n\n```\n5 void push(int item);\n```\n\n```\n6 int\
    \ size();\n```\n\n```\n7}\n```\n\n通常，文档注释会包含在列表 3.1 中，以解释每个方法的意图。然后 `javadoc`\
    \ 会将这些注释转换为类似表 3.1 的形式。我们省略了文档注释，以帮助读者关注代码本身。\n\n## 接口类型\n\n接口在 Java 中定义了新的数据类型，就像类一样。接口类型属于引用类型家族：\n\
    \n![image](img/f0050-01.png)\n\n像 `IntStack` 这样的接口的主要目的之一是使用该类型来声明变量。声明语句\n\n\
    ```\n IntStack s;\n```\n\n允许 `s` 调用 `IntStack` 中的任何方法。然而，由于它不包含实现代码，因此不能用于创建对象。这意味着在\
    \ `s` 指向一个实现了该接口的对象之前，它无法调用任何方法。\n\n## 类实现接口\n\n实现接口的类必须提供接口列出的所有方法，且这些方法必须声明为公有。声明一个类实现接口的语法使用\
    \ `implements` 关键字：\n\n```\npublic class ClassName implements InterfaceName {...}\n\
    ```\n\n一个类可以通过逗号分隔接口名称来实现多个接口。\n\n一旦类实现了接口，就可以用它来创建接口变量所指向的对象。例如，如果类 `IntArrayStack`实现了\
    \ `IntStack`，那么以下操作是有效的：\n\n```\n IntStack s = new IntArrayStack();\n```\n\n```\n\
    \ s.push(10);\n```\n\n```\n System.out.println(s.pop()); // 输出 10\n```\n\n如果 `IntArrayStack`\
    \ 类具有接口之外的公共成员，则变量 `s` 无法使用它们，因为它是用 `IntStack` 类型声明的。\n\n## 面向接口编程\n\n通常，尝试使用接口类型而不是类类型来声明变量。这种被称为“面向接口编程”的技术提供了更大的灵活性，因为它没有将你的代码绑定到特定的实现上。如果你用接口类型声明变量，那么为该变量引用更改新的实现通常只需调用不同的构造函数，例如：\n\
    \n```\n IntStack s = new IntLinkedStack();\n```\n\n任何使用 `s` 的后续代码都不需要更改，因为它已经在使用接口。\n\
    \n## 练习\n\n1. 显示在初始为空的 `IntStack s` 上执行这些操作的结果。在每次操作后画出栈的内容，清楚地标出栈顶，并指示所有非空方法的返回值。\n\
    \n    1. (a) `s.push(5)`\n\n        `s.push(8)`\n\n        `s.peek()`\n\n    \
    \    `s.push(3)`\n\n        `s.pop()`\n\n        `s.push(10)`\n\n        `s.size()`\n\
    \n        `s.push(4)`\n\n        `s.pop()`\n\n        `s.pop()`\n\n        `s.isEmpty()`\n\
    \n    2. (b) `s.push(1)`\n\n        `s.pop()`\n\n        `s.push(2)`\n\n     \
    \   `s.peek()`\n\n        `s.pop()`\n\n        `s.push(3)`\n\n        `s.size()`\n\
    \n        `s.pop()`\n\n        `s.push(4)`\n\n        `s.pop()`\n\n        `s.isEmpty()`\n\
    \n    3. (c) `s.push(10)`\n\n        `s.push(20)`\n\n        `s.push(30)`\n\n\
    \        `s.peek()`\n\n        `s.push(40)`\n\n        `s.push(50)`\n\n      \
    \  `s.size()`\n\n        `s.pop()`\n\n        `s.pop()`\n\n        `s.pop()`\n\
    \n        `s.isEmpty()`\n\n2. 判断对于每类任务列表，栈是否是合适的数据结构。假设当新任务到达时，它会被 `pushed`，当选择一个任务进行处理时，它会被\
    \ `popped`。解释你的答案。\n\n    1. (a) 可能需要任何顺序完成的任务。\n\n    2. (b) 下一个要处理的任务总是等待最长的任务。\n\
    \n    3. (c) 下一个要处理的任务总是最近收到的任务。\n\n    4. (d) 需要按照接收顺序完成的任务。\n\n    5. (e) 需要洗乱的任务。\n\
    \n3. 用你的话解释类和接口之间的区别。\n\n4. 假设 `IntArrayStack` 和 `IntLinkedStack` 实现了 `IntStack`\
    \ 接口。为这些每个任务编写 Java 语句：\n\n    1. (a) 声明 `s` 为 `IntStack`。\n\n    2. (b) 将 `s`\
    \ 指向新的 `IntLinkedStack`。\n\n    3. (c) 声明 `t` 为 `IntArrayStack`。\n\n5. 假设 `s`\
    \ 指向 `IntStack` 对象。编写 Java 代码完成这些任务：\n\n    1. (a) 在 `s` 的栈顶添加值 `100`。\n\n   \
    \ 2. (b) 并打印 `s` 栈顶的值。\n\n    3. (c) 在不移除的情况下打印 s 的栈顶。\n\n    4. (d) 移除 s 中的所有元素直到为空。\n\
    \n6. 定义一个名为 `Runnable` 的接口，包含一个无参数的 void `run` 方法。\n\n7. 定义一个名为 `Queue` 的接口，包含两个方法：一个接受\
    \ `int` 参数的 void `enqueue` 方法，和一个无参数并返回 `int` 的 `dequeue` 方法。\n\n8. 假设 `LinkedQueue`\
    \ 和 `ArrayQueue` 都实现了 `Queue` 接口。为这些每个编写单条 Java 语句：\n\n    1. (a) 声明 `q1` 指向新的\
    \ `ArrayQueue`。\n\n    2. (b) 声明 `q2` 指向新的 `LinkedQueue`。\n\n    3. (c) 调用 `q1.enqueue(19)`。\n\
    \n    4. (d) 将调用 `q2.dequeue()` 的结果存储在变量 `result` 中。\n\n3.2 数组实现\n\n在本节和下一节中，我们将编写\
    \ `IntStack` 的两种实现。第一个使用数组。\n\n假设我们计划使用数组来存储栈的内容，并且从空栈开始推入整数 10、20 和 30。然后有两种自然的选择：将栈顶元素存储在数组头部或末尾。\n\
    \n栈顶\n\n![image](img/f0052-01.png)\n\n栈尾\n\n![image](img/f0053-01.png)\n\n为了感受这两个选项的工作方式，假设下一次操作是推入\
    \ 40。\n\n栈顶 现有元素必须移动以为新元素腾空间：\n\n![image](img/f0053-02.png)\n\n> 移动（因此推入）需要 O(n)\
    \ 时间，因为每个元素都要向右移动一位。弹出也是 O(n)，因为移除栈顶后，剩余元素都要向左移动一位。注意，这可能很难判断栈何时为空。\n\n栈尾 在这种情况下，40\
    \ 可以直接进入 3：\n\n![image](img/f0053-03.png)\n\n> 这种操作需要 O(1) 时间，弹出也是如此，因为不需要移动。当\
    \ `top` 为 −1 时，栈为空。\n\n鉴于其优越性能，列表 3.2 开始使用第二种方法实现整数栈。目前，它无法编译，因为该类没有完整实现 `IntStack`\
    \ 接口。你将被要求在练习中完成 `IntArrayStack` 类。\n\n### 抛出异常\n\n"
