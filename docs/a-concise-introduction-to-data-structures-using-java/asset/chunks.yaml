  trans: "\n因此，该树的最小值是 3，最大值是 99。这些算法也适用于任何子树，只需从子树的根开始即可找到子树的最大和最小元素。例如，从 15 开始尽可能向右移动到达\
    \ 65，这就是以 15 为根的子树的最大值。\n\n### 前驱与后继（Predecessor and Successor）\n\n二叉搜索树中一个元素的前驱是在中序遍历中先于该元素的元素。后继的定义类似，是紧随其后的元素。树中的最小值没有前驱，最大值没有后继。\n\
    \n如果节点具有左子树，则前驱很容易找到：它是左子树的最大值。例如，上图中节点 71 的前驱是 65，因为正如我们发现的，65 是以 15 为根的左子树的最大值。\n\
    \n然而，如果没有左子树，我们需要向上移动树来寻找前驱。考虑同一棵树中的节点 82。82 的前驱是通过通过父节点链接向根移动，直到找到右子关系。在这个例子中，82\
    \ 和 88 之间的链接是左子关系，但 71 和 88 之间的链接是右子关系。因此，71 是 82 的前驱：\n\n![image](img/153x002.png)\n\
    \nListing 9.2 提供了公共方法 `pred()` 及其私有辅助方法 `predNode()` 的代码。注意 `pred()` 使用 `findNode()`\
    \ 开始，然后 `predNode()` 使用私有的 `maxNode()` 辅助方法（见练习 5b）来处理 `n.left` 不为空的情况。\n\nListing\
    \ 9.2：二叉搜索树前驱\n\n```\n 1 public E pred(E item) {\n 2 Node<E> n = findNode(item,\
    \ root);\n 3 if (n == null) return null;\n 4 Node<E> pred = predNode(n);\n 5 return\
    \ (pred != null) ? pred.data : null;\n 6 }\n 7 \n 8 private Node<E> predNode(Node<E>\
    \ n) {\n 9 if (n.left != null) return maxNode(n.left);\n 10 Node<E> p = n.parent;\n\
    \ 11 while (p != null && p.right != n) {\n 12 n = p;\n 13 p = n.parent;\n 14 }\n\
    \ 15 return p;\n 16 }\n```\n\n### 三元运算符\n\nListing 9.2 的第 5 行使用了 Java 的条件运算符。条件运算符\
    \ `?:` 通过这种语法创建一个表达式：\n\n```\ntest ? valueIfTrue : valueIfFalse\n```\n\n如果布尔测试为真，则表达式的值为\
    \ `valueIfTrue`；否则，它的值为 `valueIfFalse`。例如，第 5 行中的表达式：\n\n```\nreturn (pred !=\
    \ null) ? pred.data : null;\n```\n\n如果 `pred` 不为空，则返回 `pred.data`，否则返回 `null`。它完全等同于以下较长的写法：\n\
    \n```\nif (pred != null) {\n return pred.data;\n} else {\n return null;\n}\n```\n\
    \n条件表达式对于这种涉及快速测试的赋值或返回语句非常有用。测试周围的括号是可选的，但 Listing 9.2 中的括号模仿了 `if` 语句中要求的括号。\n\
    \n### 性能\n\n二叉搜索树中上述所有查询的复杂度均为 `O(h)`，其中 `h` 是树的高度。我们推迟到 第 9.4 节 再根据节点数量 `n` 对这些操作进行分析。\n\
    \n### 练习（Exercises）\n\n1. 使用这棵二叉搜索树回答以下问题。\n\n   ![image](img/155x001.png)\n\n\
    \   1. (a) 按照搜索键 14 时的访问顺序列出节点。\n   2. (b) 按照搜索键 51 时的访问顺序列出节点。\n   3. (c) 按照搜索键\
    \ 22 时的访问顺序列出节点。\n   4. (d) 按照搜索键 69 时的访问顺序列出节点。\n   5. (e) 确定树中的最小和最大元素。\n  \
    \ 6. (f) 确定树中 13 的前驱和后继。\n   7. (g) 确定树中 24 的前驱和后继。\n   8. (h) 确定树中 27 的前驱和后继。\n\
    \   9. (i) 确定树中 68 的前驱和后继。\n\n2. 说明 Listing 8.2 中二叉树 `Node` 类包含父节点引用的一个原因。\n\n\
    3. 描述 Listing 9.1 中 `findNode()` 的基本情况。\n\n4. Listing 9.2 中的 `addNode()` 是否可以递归实现？\n\
    \n5. 在 `BinaryTree` 中实现以下方法，这些涉及快速测试的赋值或返回语句：\n   - (a) `min()`\n   - (b) `max()`\n\
    \   - (c) `successor()`\n   - (d) `toString()`\n\n6. 如果你的 5a 解决方案使用了递归，请写出非递归版本。\n\
    \n7. 如果你的 5b 解决方案使用了递归，请写出非递归版本。\n\n8. 解释为什么这些查询的复杂度都是 `O(h)`。\n\n### 9.2 插入（Insertion）\n\
    \n向二叉搜索树插入元素与搜索相似。事实上，一次失败的搜索结束于一个空指针，这正是插入元素的位置。例如，要在树中插入 24，搜索路径向左：\n\n![image](img/156x001.png)\n\
    \n与上一节查询一样，`BinaryTree` 的公共 `add()` 方法应该处理以下情况：\n\n- 如果元素为空，则什么都不做。\n- 如果根为空，将元素插入到根。\n\
    - 否则，从根节点开始 `addNode()`。\n\n私有 `addNode()` 方法在 Listing 9.3 中概述。它与 `findNode()`\
    \ 结构相同，但在进行递归调用之前会检查子节点是否为空。如果正确方向为空，那就是插入新节点的地方。\n\n与 `findNode()` 和 `predNode()`\
    \ 不同，`addNode()` 是一个 `void` 方法，因为它的目的是插入节点而不是返回特定节点。你将在练习中实现该算法。\n\nListing 9.3：二叉搜索树插入（伪代码）\n\
    \n```\n 1 //假设 item != null 且 n != null\n 2 如果 item < n.data\n 3 如果没有左孩子，插入为 n.left\n\
    \ 4 否则递归调用 n.left\n 5 如果如果 item > n.data\n 6 如果没有右孩子，插入为 n.right\n 7 否则递归调用 n.right\n\
    \ 8 否则什么都不做（防止重复）\n```\n\n### Java 断言（Assertions）\n\n注意 Listing 9.3 第 1 行的注释。如果公共\
    \ `add()` 方法按照上述描述执行了工作，那么在 `addNode()` 开始时，元素和节点 `n` 都不为空。此外，这些条件在 `addNode()`\
    \ 的任何递归调用开始时都应该保持为真。不幸的是，注释不是可执行的，因此没有什么能防止程序员犯错并违反前言。Java 的 `assert` 语句本质上使注释变得可执行：\n\
    \n```\nprivate void addNode(E item, Node<E> n) {\n assert item != null && n !=\
    \ null;\n // ...\n}\n```\n"
- fmt: "\nWhen assertions are enabled, this statement throws an `AssertionError` if\
    \ the condition is false; otherwise, it does nothing. Assertions are disabled\
    \ by default, so to enable them, use the `-ea` or `-enableassertions` flag on\
    \ the command line or add it to the list of runtime options in your IDE.\n\nAssertions\
    \ may also be used to check postconditions, expected to be true at the end of\
    \ a method call, or more general invariants that are expected to remain true at\
    \ any particular point in the code.\n\n# Exercises\n\n1. Draw the binary search\
    \ tree that results from inserting each of these sequences of elements into an\
    \ empty tree:\n    1. (a) 9, 10, 33, 43, 73, 47, 27, 67, 36, 49, 59, 89\n    2.\
    \ (b) 74, 25, 94, 96, 67, 54, 69, 80, 38, 5, 23, 43\n    3. (c) 69, 49, 59, 21,\
    \ 61, 82, 44, 91, 36, 1, 95, 74\n    4. (d) 5, 38, 39, 94, 95, 85, 44, 88, 60,\
    \ 33, 1, 73\n    5. (e) 98, 65, 20, 44, 49, 97, 38, 75, 29, 43, 30, 79\n\n2. Describe\
    \ the base case(s) for the recursion in [Listing 9.3](#K20431_C009.xhtml_lis9.3).\n\
    \n3. Implement binary search tree insertion by writing these methods in the `BinarySearchTree`\
    \ class:\n    1. (a) `add()` See the discussion on page 157.\n    2. (b) `addNode()`\
    \ Implement [Listing 9.3](#K20431_C009.xhtml_lis9.3). Use an assertion to test\
    \ the precondition, and remember to set the parent reference of the new node.\n\
    \n4. Add assertions to the following methods in the `BinarySearchTree` class to\
    \ test appropriate preconditions:\n    1. (a) `predNode()`\n    2. (b) `succNode()`\n\
    \n5. Write a `main()` method for the `BinarySearchTree` class to insert random\
    \ integers into a binary search tree and print the result.\n\n6. Modify the previous\
    \ exercise to test each of these queries:\n    1. (a) `contains()`\n    2. (b)\
    \ `min()`\n    3. (c) `max()`\n    4. (d) `pred()`\n    5. (e) `succ()`\n\n7.\
    \ Write a `main()` method for the `BinarySearchTree` class to insert several strings\
    \ into a binary search tree and print the result.\n\n8. Determine the `O()` performance\
    \ of binary search tree insertion in terms of `h`, the height of the tree. Explain\
    \ your answer.\n\n# 9.3 Deletion\n\nDeleting from a binary search tree is more\
    \ complex than other tree operations because it may have to change the internal\
    \ structure of the tree. For example, insertion is simpler because the new node\
    \ is always a leaf, which means there is no impact on the rest of the tree.\n\n\
    The first step is to understand how deletion works on paper. Remember that the\
    \ end result always has to be a valid binary search tree.\n\n### Deleting By Hand\n\
    \nThe process for deleting a node in a binary search tree depends on the number\
    \ of children it has.\n\n**0 Children**\nDeleting a leaf by hand is easy because\
    \ it doesn’t affect the rest of the tree. For example, deleting 12 in this tree\
    \ simply removes that node:\n\n![image](image/159x001.png)\n\n**1 Child**\nDeleting\
    \ a node with one child such as 51 is also not difficult, since we can move its\
    \ one child 61 up to replace it:\n\n![image](image/160x001.png)\n\n**2 Children**\n\
    However, there is no obvious way to delete a node with two children without disrupting\
    \ the binary search tree. Consider deleting 38 in the tree we just finished with:\n\
    \n![image](image/160x002.png)\n\nNeither of its children can take 38’s place at\
    \ the root: if 25 moves up, there would be nodes on its left that are too big,\
    \ and similarly, if 61 moves up, there would be nodes on its right that are too\
    \ small. (It is also not clear how we would handle the children of 25 or 61.)\
    \ The solution we adopt is to look elsewhere for a replacement: the inorder predecessor,\
    \ in this case, 31. It has the right relationship with the other elements in the\
    \ tree to take the position of 38:\n\n![image](image/160x003.png)\n\nFor the same\
    \ reason, the inorder successor could also be used.\n\nThis approach to deleting\
    \ a node `n` with two children involves two steps:\n1. Copy the predecessor’s\
    \ value to `n`.\n2. Delete the predecessor node.\n\nFor example, to delete 38\
    \ in this tree, find its predecessor, 31, and copy that value to where 38 was:\n\
    \n![image](image/160x004.png)\n\nThen delete the predecessor:\n\n![image](image/161x001.png)\n\
    \n### Nodes without Two Children\n\nDeleting a node with one child involves replacing\
    \ it with its child. Deleting a node with no children can be viewed in the same\
    \ way: it may be null. There are still three cases to consider, depending on the\
    \ relationship of `n` with its parent:\n\n![image](image/161x002.png)\n\nPutting\
    \ everything together leads to [Listing 9.4](#K20431_C009.xhtml_lis9.4), which\
    \ outlines the `remove()` method.\n\n**Listing 9.4: Search Tree Deletion (Pseudocode)**\n\
    ```\n1 If n.left is null\n   Replace n with n.right\n2 Else n.. is is null\n \
    \  Replace n with..left\n Else\n   Find predecessor of n\n   Copy data from predecessor\
    \ to n\n   Recursively delete\n```\n\n##\n\n1.. a node `n` has two children in\
