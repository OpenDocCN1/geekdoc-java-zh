- fmt: "\nHowever, if an array is sorted, then a more efficient divide-and-conquer\
    \ strategy can be used. It compares the target with the middle item in the array.\
    \ Because the array is sorted, if the target is smaller than the middle element,\
    \ then the entire upper half of the array can be eliminated from consideration.\
    \ Similarly, the lower half is eliminated if the target was larger than the middle\
    \ item. Repeating this process leads to the algorithm known as binary search.\n\
    \n## Implementation\n\nBinary search is delicate, in the sense that it can be\
    \ difficult to write correctly for all cases.[1](#K20431_C002.xhtml_ch2fn1) The\
    \ implementation in [Listing 2.3](#K20431_C002.xhtml_lis2.3) ensures that if the\
    \ target is in the array, then it must be trapped between two indices `left` and\
    \ `right`:\n\n![image](image/f0043-01.png)\n\nAt each stage, the item in the middle\
    \ of this range is checked, and the algorithm stops if `left` is ever greater\
    \ than `right`.\n\nListing 2.3: Binary Search\n\n```\n1 // Add to class ArrayFunctions\n\
    ```\n\n```\n2 public static int binarySearch(int[] data, int target) {\n```\n\n\
    ```\n3 int left = 0;\n```\n\n```\n4 int right = data.length - 1;\n```\n\n```\n\
    5 while (left <= right) {\n```\n\n```\n6  int mid = (left + right) / 2;\n```\n\
    \n```\n7  if (target == data[mid]) {\n```\n\n```\n8  return mid;\n```\n\n```\n\
    9 } else if (target < data[mid]) {\n```\n\n```\n10  right = mid - 1;\n```\n\n\
    ```\n11 } else {\n```\n\n```\n12  left = mid + 1;\n```\n\n```\n13 }\n```\n\n```\n\
    14 }\n```\n\n```\n15  return -1;\n```\n\n```\n16}\n```\n\n### Sample Trace\n\n\
    The trickiest part of binary search is updating either `left` or `right` when\
    \ the target is not at `data[mid]`. Tracing intricate code by hand is a good way\
    \ to understand how it works. For example, suppose we search for 15 in this sorted\
    \ array:\n\n![image](image/f0044-01.png)\n\nThen at the start of the algorithm,\
    \ we have:\n\n```\n left: 0   right: 8   mid: 4\n```\n\nBecause `target` is greater\
    \ than `data[mid]`, `left` is changed to `mid + 1`, which is 5, and the next `mid`\
    \ is calculated (remember that integer division truncates toward zero):\n\n```\n\
    \ left: 5   right: 8   mid: 6\n```\n\nIn this case, `target` is less than `data[mid]`,\
    \ so `right` is changed to 5:\n\n```\n left: 5   right: 5   mid: 5\n```\n\nThe\
    \ last step may be unexpected. Since `target < data[mid]`, `right` is set to `mid\
    \ - 1`:\n\n```\n left: 5   right: 4\n```\n\nand this stops the binary search.\n\
    \n### Analysis of Binary Search\n\n[Listing 2.3](#K20431_C002.xhtml_lis2.3) looks\
    \ difficult to analyze because of the unknown number of repetitions in the loop\
    \ on line 5. However, we can simplify a worst-case analysis by assuming that the\
    \ array size `n` is a power of 2.\n\nIf `n = 2^k`, then in the worst case, binary\
    \ search will divide the array in half approximately `k` times. To see why, watch\
    \ the approximate size of the region `data[left...right]`, where the target must\
    \ be, after each iteration:\n\n|  | Size of `data[left..right]` |\n| --- | ---\
    \ |\n| After 1 iteration | $2^{k-1}$ |\n| After 2 iterations | $2^{k-2}$ |\n|\
    \ After 3 iterations | $2^{k-3}$ |\n| . . . |  |\n| After k iterations | $2^{k-k}\
    \ = 2^0 = 1$ |\n\nThis means that in the worst case, the loop runs approximately\
    \ `k` times, and so, binary search is $O(k)$ for $n = 2^k$. To obtain an expression\
    \ in terms of `n`, we use the fact:\n\nIf `n = 2^k`, then `k = \\log_2 n`\n\n\
    Thus, binary search is a $O(\\log n)$ algorithm.\n\n### Exercises\n\n1. Show how\
    \ binary search works on the array\n    ```\n    {2, 5, 7, 10, 22, 31, 34, 40}\n\
    \    ```\n    when searching for each of the elements below. Show the values of\
    \ `left`, `right`, and `mid` as they change.\n\n    1. (a) 31\n    2. (b) 2\n\
    \    3. (c) 17\n    4. (d) 50\n    5. (e) 1\n    6. (f) 34\n\n2. Show how binary\
    \ search works on the array\n    ```\n    {10, 13, 24, 36, 37, 41, 44, 66, 86,\
    \ 100}\n    ```\n    when searching for each of the elements below. Show the values\
    \ of `left`, `right`, and `mid` as they change.\n\n    1. (a) 25\n    2. (b) 24\n\
    \    3. (c) 86\n    4. (d) 99\n    5. (e) 100\n    6. (f) 8\n\n3. Determine which\
    \ is faster: linear search or binary search?\n\n4. Explain the worst-case time\
    \ complexity of binary search.\n\n5. What is a stack?\n\n6. Give a real-world\
    \ application of a stack.\n\n7. What is the difference between a stack and a queue?\n\
    \n8. How can you implement a stack using a linked list?\n\n9. How can you implement\
    \ a stack using an array?\n\n10. What is the complexity of the `push` and `pop`\
    \ operations in a stack?\n"
