- fmt: "\nThe goal of a hash table is to provide close to O(1) search and insertion\
    \ for any element. This emphasis on searching leads to a new interface, one based\
    \ on looking up the value of a key.\n\n### Maps\n\nA map is a set of key-value\
    \ pairs in which each key is associated with one value. The same value may be\
    \ paired with more than one key, but the point is that looking up a key returns\
    \ the unique value that was stored for that key. Maps are also known as associative\
    \ maps, associative arrays, dictionaries, or lookup tables.\n\nThe two main operations\
    \ of the `Map` ADT in [Table 11.1](#K20431_C011.xhtml_Text_Anchor_tab11.1) are\
    \ `put()` and `get()`. Deleting from a hash table can be complex, so `remove()`\
    \ operations are sometimes optional in maps.\n\nThe Java convention is to use\
    \ the type parameter `K` for key types and `V` for value types. The key type `K`\
    \ should be immutable so that keys do not change after they have been put into\
    \ a map.\n\n### Linked Map\n\nA linked list provides a simple implementation of\
    \ the map interface that is useful for small sets of key-value pairs. The `get()`\
    \ and `containsKey()` operations traverse the list until finding the key. The\
    \ `put()` method also needs to traverse the list to see if there is already an\
    \ entry for the key, but if not, the new entry can be inserted at the front of\
    \ the list.\n\nTable 11.1\nMap ADT\n\n| `boolean containsKey(K key)` True if key\
    \ has an entry in map. |\n| `V get(K key)` Returns value associated with key,\
    \ null if none. |\n| `boolean isEmpty()` True if map has no key-value pairs. |\n\
    | `V put(K key, V value)` Associates key with value in map. If key is already\
    \ in map, the old value is replaced and returned. Returns null for new entries.\
    \ |\n| `V remove(K key)` (Optional) Removes entry for key in map, returning associated\
    \ value or null if none. |\n| `int size()` Number of key-value pairs in map. |\n\
    \nImplementation of the `LinkedMap<K, V>` class is similar to other linked list\
    \ code we have written except for one detail: these nodes hold a key-value pair.\n\
    \n### Map Entries\n\nBecause maps hold key-value pairs, it is useful to create\
    \ a private nested `Entry<T, U>` class to hold the pairs. Then nodes are declared\
    \ as:\n\n```\nNode<Entry<K, V>>\n```\n\nand linked maps are structured like this:\n\
    \n![image](image/186x001.png)\n\n### Exercises\n\n1. Are binary search trees a\
    \ good choice to implement the `Map` interface? Explain why or why not.\n2. Write\
    \ a generic Java interface `Map<K, V>` for the `Map` ADT in [Table 11.1](#K20431_C011.xhtml_Text_Anchor_tab11.1).\n\
    3. Modify the `Map` interface from the previous exercise to include the optional\
    \ `remove()`.\n4. Show the results of these operations on an initially empty linked\
    \ map `m`. Give the return value of each non-void operation, and draw the final\
    \ linked list, showing its entry nodes as above.\n    1. (a) `m.put(5, \"five\"\
    )`\n       `m.put(3, \"three\")`\n       `m.containsKey(2)`\n       `m.put(5,\
    \ \"FIVE\")`\n       `m.put(2, \"two\")`\n       `m.get(5)`\n       `m.put(1,\
    \ \"one\")`\n       `m.size()`\n    2. (b) `m.put(1, \"one\")`\n       `m.put(2,\
    \ \"two\")`\n       `m.put(2, \"Two\")`\n       `m.put(2, \"TWO\")`\n       `m.containsKey(2)`\n\
    \       `m.put(3, \"three\")`\n       `m.get(2)`\n       `m.size()`\n5. Develop\
    \ a `LinkedMap<K, V>` implementation of the `Map` interface based on a linked\
    \ list. Include these members:\n    1. (a) `Entry<T, U>`\n    2. (b) `Node<T>`\n\
    \    3. (c) `containsKey()`\n    4. (d) `get()`\n    5. (e) `isEmpty()`\n    6.\
    \ (f) `put()`\n    7. (g) `size()`\n6. Write a `main()` method for the `LinkedMap`\
    \ class that creates a linked map, puts some values in the map, and looks them\
    \ up.\n7. Determine the `O()` performance of each of these `LinkedMap` operations:\n\
    \    1. (a) `containsKey()`\n    2. (b) `get()`\n    3. (c) `isEmpty()`\n    4.\
    \ (d) `put()`\n    5. (e) `size()`\n8. Implement the optional `remove()` method\
    \ in the `LinkedMap` class. The simplest way to do it is by keeping a `prev` pointer\
    \ to the node before `p` in the traversal.\n\n## 11.2 Hash Tables\n\nBefore describing\
    \ hash tables, we briefly consider a simpler alternative that can sometimes be\
    \ useful. In this context, table is just another term for an array.\n\n### Direct\
    \ Addressing\n\nThe simplest way to get O(1) search and insertion for a map is\
    \ if keys are relatively small nonnegative integers. Then direct addressing can\
    \ be used, where a table stores values using the integer key as the index:\n\n\
    ```\ntable[key] = value;\n```\n\nAs long as the table can be allocated large enough\
    \ to store any possible key, this strategy is simple and efficient.\n\nHowever,\
    \ if the keys are not integers or the set of all possible key values is much larger\
    \ than the desired table size, then a hash function must be used.\n\n### Hash\
    \ Tables\n\nSuppose approximately 2000 records need to be stored, and each record\
    \ has a four-digit integer key. Then direct addressing is reasonable, because\
    \ the table will not be too large. However, if each record has a nine-digit integer\
    \ key, then direct addressing is impractical. The problem is the relationship\
    \ of the number of possible key values with the desired table size:\n\n![image](image/188x001.png)\n\
    \nA hash function solves this problem by mapping keys to valid table indices:\n\
    \n`f(key) = index`\n\nA hash table is then an array that uses a hash function\
    \ to compute the indices of its table entries.\n\n### Collisions\n\nOf course,\
    \ if the number of possible key values is much larger than the table size, then\
    \ collisions, in which the hash function maps different keys to the same index,\
    \ are inevitable.\n\n![image](image/189x001.png)\n\nWe will look at two collision\
    \ resolution strategies: chaining in [Section 11.3](#K20431_C011.xhtml_Text_Anchor_tab11.3)\
    \ and linear probing in [Section 11.4](#K20431_C011.xhtml_Text_Anchor_tab11.4).\
    \ First we consider how to define hash functions.\n\n### Hash Functions\n\nThe\
    \ main job of a hash function is to distribute keys among indices in an approximately\
    \ uniform way, so that, for example, most keys do not cluster among a few. The\
    \ name comes from this purpose; a hash function should also be fast to compute\
    \ and use all aspects of the key.\n\n### Integer Keys\n\nIn a table of size `M`,\
    \ valid array indices are `0, ..., M-1`, so the most natural hash function for\
    \ integer keys is the `mod` function:\n\n`f(k) = k mod M`\n\nIn Java, the remainder\
    \ function ` % M` may be used for modulus as long as `k` is not negative. This\
    \ distinction is important for hashing: the Java remainder can be negative if\
    \ `k` is negative. (For example, `-1 % 3` is `-1`.) In addition, the table size\
    \ `M` should be chosen so that every bit in the key is used. For example, if `M\
    \ = 2^m`, then only the last `m` bits of the key are used to compute `k % M`.\
    \ Because of this, `M` is often chosen to be prime.\n\n### String and Object Keys\n\
    \nMap keys are not always integers, and in fact, are often strings. Each character\
    \ in a string can be thought of as an integer via its ASCII value. For example,\
    \ the ASCII values of the characters in the word “scrape” are:\n\n| s | c | r\
    \ | a | p | e |\n| 115 | 99 | 114 | 97 | 112 | 101 |\n\nAdding these values to\
    \ get a single integer seems reasonable, but it would cause anagrams of “scrape”\
    \ like “parsec” to hash to the same value. That should be avoided, because a good\
    \ hash function ought to take into account the order of the letters in the key,\
    \ not just which letters appear.\n\n technique used in Java is is interpret the\
    \ ASCII values as something like a base 31 integer:\n\n$\\begin{array}{l} \\begin{array}{ll}\
    \ & {\\frac{115}{31^{5}}\\frac{99}{31^{4}}\\frac{114}{31^{3}}\\frac{97}{31^{2}}\\\
    frac{112}{31}\\frac{101}{1}} \\\\ = {115 \\cdot 31^{5} + 99 \\cdot 31^{4} + 114\
    \ \\cdot 31^{3} + 97 \\cdot 31^{2} + 112 \\cdot 31 + 101} \\end{array} \\\\ \\\
    begin{array}{ll} = & 3387273908 \\end{array} \\end{array}$\n\nThis method takes\
    \ into account the order of the characters in the key, although it does produce\
    \ very large values. The choice of 31 is somewhat arbitrary as a small prime.\n"
  raw: "The goal of a hash table is to provide close to O(1) search and insertion\
    \ for any element. This emphasis on searching leads to a new interface, one based\
    \ on looking up the value of a key.\n\n### Maps\n\nA map is a set of key-value\
    \ pairs in which each key is associated with one value. The same value may be\
    \ paired with more than one key, but the point is that looking up a key returns\
    \ the unique value that was stored for that key. Maps are also known as associative\
    \ maps, associative arrays, dictionaries, or lookup tables.\n\nThe two main operations\
    \ of the Map ADT in [Table 11.1](#K20431_C011.xhtml_Text_Anchor_tab11.1) are put()\
    \ and get(). Deleting from a hash table can be complex, so remove() operations\
    \ are sometimes optional in maps.\n\nThe Java convention is to use the type parameter\
    \ K for key types and V for value types. The key type K should be immutable so\
    \ that keys do not change after they have been put into a map.\n\n### Linked Map\n\
    \nA linked list provides a simple implementation of the map interface that is\
    \ useful for small sets of key-value pairs. The get() and containsKey() operations\
    \ traverse the list until finding the key. The put() method also needs to traverse\
    \ the list to see if there is already an entry for the key, but if not, the new\
    \ entry can be inserted at the front of the list.\n\nTable 11.1\n\nMap ADT\n\n\
    | boolean containsKey(K key)True if key has an entry in map. |\n\n| V get(K key)Returns\
    \ value associated with key, null if none. |\n\n| boolean isEmpty()True if map\
    \ has no key-value pairs. |\n\n| V put(K key, V value)Associates key with value\
    \ in map. If key is already in map, the old value is replaced and returned. Returns\
    \ null for new entries. |\n\n| V remove(K key)(Optional) Removes entry for key\
    \ in map, returning associated value or null if none. |\n\n| int size()Number\
    \ of key-value pairs in map. |\n\nImplementation of the LinkedMap<K, V> class\
    \ is similar to other linked list code we have written except for one detail:\
    \ these nodes hold a key-value pair.\n\n### Map Entries\n\nBecause maps hold key-value\
    \ pairs, it is useful to create a private nested Entry<T, U> class to hold the\
    \ pairs. Then nodes are declared as:\n\n```\n Node<Entry<K, V>>\n```\n\nand linked\
    \ maps are structured like this:\n\n![image](image/186x001.png)\n\nExercises\n\
    \n1.  Are binary search trees a good choice to implement the Map interface? Explain\
    \ why or why not.\n\n2.  Write a generic Java interface Map<K, V> for the Map\
    \ ADT in [Table 11.1](#K20431_C011.xhtml_Text_Anchor_tab11.1).\n\n3.  Modify the\
    \ Map interface from the previous exercise to include the optional remove().\n\
    \n4.  Show the results of these operations on an initially empty linked map m.\
    \ Give the return value of each non-void operation, and draw the final linked\
    \ list, showing its entry nodes as above.\n\n    1.  (a) m.put(5, \"five\")\n\n\
    \        m.put(3, \"three\")\n\n        m.containsKey(2)\n\n        m.put(5, \"\
    FIVE\")\n\n        m.put(2, \"two\")\n\n        m.get(5)\n\n        m.put(1, \"\
    one\")\n\n        m.size()\n\n    2.  (b) m.put(1, \"one\")\n\n        m.put(2,\
    \ \"two\")\n\n        m.put(2, \"Two\")\n\n        m.put(2, \"TWO\")\n\n     \
    \   m.containsKey(2)\n\n        m.put(3, \"three\")\n\n        m.get(2)\n\n  \
    \      m.size()\n\n5.  Develop a LinkedMap<K, V> implementation of the Map interface\
    \ based on a linked list. Include these members:\n\n    1.  (a) Entry<T, U>\n\n\
    \    2.  (b) Node<T>\n\n    3.  (c) containsKey()\n\n    4.  (d) get()\n\n   \
    \ 5.  (e) isEmpty()\n\n    6.  (f) put()\n\n    7.  (g) size()\n\n6.  Write a\
    \ main() method for the LinkedMap class that creates a linked map, puts some values\
    \ in the map, and looks them up.\n\n7.  Determine the O() performance of each\
    \ of these LinkedMap operations:\n\n    1.  (a) containsKey()\n\n    2.  (b) get()\n\
    \n    3.  (c) isEmpty()\n\n    4.  (d) put()\n\n    5.  (e) size()\n\n8.  Implement\
    \ the optional remove() method in the LinkedMap class. The simplest way to do\
    \ it is by keeping a prev pointer to the node before p in the traversal.\n\n##\
    \ 11.2 Hash Tables\n\nBefore describing hash tables, we briefly consider a simpler\
    \ alternative that can sometimes be useful. In this context, table is just another\
    \ term for an array.\n\n### Direct Addressing\n\nThe simplest way to get O(1)\
    \ search and insertion for a map is if keys are relatively small nonnegative integers.\
    \ Then direct addressing can be used, where a table stores values using the integer\
    \ key as the index:\n\n```\n table[key] = value;\n```\n\nAs long as the table\
    \ can be allocated large enough to store any possible key, this strategy is simple\
    \ and efficient.\n\nHowever, if the keys are not integers or the set of all possible\
    \ key values is much larger than the desired table size, then a hash function\
    \ must be used.\n\n### Hash Tables\n\nSuppose approximately 2000 records need\
    \ to be stored, and each record has a four-digit integer key. Then direct addressing\
    \ is reasonable, because the table will not be too large. However, if each record\
    \ has a nine-digit integer key, then direct addressing is impractical. The problem\
    \ is the relationship of the number of possible key values with the desired table\
    \ size:\n\n![image](image/188x001.png)\n\nA hash function solves this problem\
    \ by mapping keys to valid table indices:\n\nf(key) = index\n\nA hash table is\
    \ then an array that uses a hash function to compute the indices of its table\
    \ entries.\n\n### Collisions\n\nOf course, if the number of possible key values\
    \ is much larger than the table size, then collisions, in which the hash function\
    \ maps different keys to the same index, are inevitable.\n\n![image](image/189x001.png)\n\
    \nWe will look at two collision resolution strategies: chaining in [Section 11.3](#K20431_C011.xhtml_ch11.3)\
    \ and linear probing in [Section 11.4](#K20431_C011.xhtml_ch11.4). First we consider\
    \ how to define hash functions.\n\n### Hash Functions\n\nThe main job of a hash\
    \ function is to distribute keys among indices in an approximately uniform way,\
    \ so that, for example, most keys do not cluster among just a few index values.\
    \ The name comes from this purpose; it is meant to evoke finely chopped meat and\
    \ potatoes. A hash function should also be fast to compute and use all aspects\
    \ of the key.\n\n### Integer Keys\n\nIn a table of size M, valid array indices\
    \ are 0, . . . , M − 1, so the most natural hash function for integer keys is\
    \ the mod function:\n\nf(k) = k mod M\n\nIn Java, the remainder function k % M\
    \ may be used for modulus as long as k is not negative. This distinction is important\
    \ for hashing: the Java remainder function can be negative if k itself is negative.\
    \ (For example, -1 % 3 is −1.) Thus, when using remainder as a hash function,\
    \ it is important to be sure the value k is nonnegative.\n\nIn addition, the table\
    \ size M should be chosen so that every bit in the key is used. For example, if\
    \ M = 2m, then only the last m bits of the key are used to compute k % M; see\
    \ Exercise 2\\. Because of this, M is often chosen to be prime.\n\n### String\
    \ and Object Keys\n\nMap keys are not always integers, and in fact, are often\
    \ strings. Each character in a string can be thought of as an integer via its\
    \ ASCII value. For example, the ASCII values of the characters in the word “scrape”\
    \ are:\n\n| s | c | r | a | p | e |\n\n| 115 | 99 | 114 | 97 | 112 | 101 |\n\n\
    Adding these values to get a single integer seems reasonable, but it would cause\
    \ anagrams of “scrape” like “parsec” to hash to the same value. That should be\
    \ avoided, because a good hash function ought to take into account the order of\
    \ the letters in the key, not just which letters appear.\n\nThe technique used\
    \ in Java is to interpret the ASCII values as something like a base 31 integer:\n\
    \n$\\begin{array}{l} \\begin{array}{ll} & {\\frac{115}{31^{5}}\\frac{99}{31^{4}}\\\
    frac{114}{31^{3}}\\frac{97}{31^{2}}\\frac{112}{31}\\frac{101}{1}} \\\\ = & {115\
    \ \\cdot 31^{5} + 99 \\cdot 31^{4} + 114 \\cdot 31^{3} + 97 \\cdot 31^{2} + 112\
    \ \\cdot 31 + 101} \\end{array} \\\\ \\begin{array}{ll} = & 3387273908 \\end{array}\
    \ \\end{array}$\n\nThis method takes into account the order of the characters\
    \ in the key, although it does produce very large values. The choice of 31 is\
    \ somewhat arbitrary as a small prime."
