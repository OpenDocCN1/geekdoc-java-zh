  trans: "\n\n```\n1 将根节点与最后一个元素交换\n```\n\n```\n2 更新堆的大小\n```\n\n```\n3 下堆化 (Heapify\
    \ down)\n```\n\n```\n4 返回最大的元素\n```\n\n## 下堆化 (Heapifying Down)\n\n下堆化比上堆化更复杂，因为如果违反了堆属性，我们不能只查看一个父节点——我们需要同时检查两个子节点。\n\
    \n### 示例\n\n假设在在上例中完成的堆上调用了 `remove()`。那么将返回 `77`，并且 `11` 需要移动到顶端（目前我们忽略将 `77`\
    \ 交换到最后一个位置）：\n\n![image](img/174x002.png)\n\n为了对顶部的 `11` 进行下堆化，我们需要考虑两个子节点，并决定将哪一个与\
    \ `11` 交换：`11`\n\n![image](img/175x001.png)\n\n如果 `11` 与 `51` 交换，则 `51` 和 `52`\
    \ 之间将违反堆属性；因此，我们将 `11` 与其较大的子节点 `52` 交换。这个过程重复执行，直到我们得到有效的堆。`52`\n\n![image](img/175x002.png)\n\
    \n列表 `10.3` 给出了组织 `heapifyDown(i)` 步骤的方法。主要任务是判断三个元素中哪一个是最大的：位于 `i` 处的值或它的两个子节点之一。该算法在访问子节点时需要小心不要越过堆的底部。\n\
    \n### 列表 10.3：下堆化（伪代码）\n\n```\n1 设置 largest = i\n2 如果左子节点有效且大于 largest，则 largest\
    \ = left\n3 如果右子节点有效且大于 largest，则 largest = right\n4 如果 largest != i\n5 交换 i 与\
    \ largest\n6 重复\n```\n\n### 练习题\n\n1. 将以下元素序列插入到初始为空的堆中，画出生成的最大堆：\n    1. (a)\
    \ `37, 17, 81, 74, 95, 52, 8, 83, 41`\n    2. (b) `62, 13, 66, 36, 69, 70, 39,\
    \ 95, 51`\n    3. (c) `46, 78, 96, 74, 60, 99, 23, 29, 5`\n    4. (d) `40, 60,\
    \ 57, 82, 55, 4, 6, 97, 59`\n2. 对你练习题 1 答案中的堆连续调用三次 `remove()`，画出结果产生的最大堆序列。\n\
    3. 解释为什么在在上堆化时，如果一个节点与其父节点交换，不会因为该节点的兄弟节点而违反堆属性。\n4. 在 `MaxHeap` 类中编写这些方法来实现最大堆的插入功能：\n\
    \    1. (a) `add()` 如果数组满额则调整大小。\n    2. (b) `heapifyUp()` 实现 `Listing 10.1`。\n\
    5. 在 `MaxHeap` 类中编写这些方法来实现最大堆的删除功能：\n    1. (a) `remove()` 实现 `Listing 10.2`。如果堆为空则抛出异常。\n\
    \    2. (b) `heapifyDown()` 实现 `Listing 10.3`。\n6. 使用 `MinHeap` 重复练习 4 和 5。\n\
    7. 如果你练习题 4b 中的 `heapifyUp()` 方法是递归的，请写一个非递归版本，或者反之。哪种版本更优？\n8. 如果你练习题 5b 中的 `heapifyDown()`\
    \ 方法是递归的，请写一个非递归版本，或者反之。哪种版本更优？\n9. 为 `MaxHeap` 类写一个 `main()` 方法，将随机整数插入堆中，然后移除并打印每个元素，直到堆为空。\n\
    10. 确定这些私有堆操作的 `O()` 性能。解释你的答案。\n    1. (a) `heapifyDown()`\n    2. (b) `heapifyUp()`\n\
    11. 确定这些堆操作的 `O()` 性能。解释你的答案。\n    1. (a) `add()`\n    2. (b) `isEmpty()`\n  \
    \  3. (c) `peek()`\n    4. (d) `remove()`\n    5. (e) `size()`\n12. 确定向空堆中插入 `n`\
    \ 个元素的 `O()` 性能。\n\n## 10.3 建堆与堆排序\n\n上一节的练习题 12 了向初始为空的堆插入 `n` 个元素的代价。事实证明如果初始就有所有\
    \ `n` 个元素，有一种更快的建堆方法。\n\n### 建堆 (Buildheap)\n\n`buildheap` 基于这样一个观察：如果一个节点位于两个堆之上：\n\
    \n![image](img/177x001.png)\n\n那么在该节点上调用 `heapifyDown()` 将得到一个以该节点为根的有效堆。这本质上是我们在上一节下堆化时所做的工作。`buildheap`\
    \ 从底向上工作。由于单个节点是有效的堆，从堆的底部开始下堆化可以将节点逐渐组合成越来越大的堆，直到整棵树成为一个堆。\n\n### 示例\n\n最容易观察\
    \ `buildheap` 如何工作的方法是给出一个示例。给定元素 `31, 30, 66, 5, 72, 8, 44`，在数组中以堆的形状展示，关注其最后一个元素的父节点：\n\
    \n![image](img/177x002.png)\n\n考虑这些节点，`5` 是位于两个堆之上的节点，我们在 `5` 处进行堆化：\n\n![image](img/177x003.png)\n\
    \n在上下文中，我们随后在数组中移动 `8` 的位置：\n\n![image](img/178x001.png)\n\n`8` 也是位于两个堆之上的节点，我们继续进行堆化：\n\
    \n![image](img/178x002.png)\n\n由于我们从底向上工作，这些子树已经是有效的堆：\n\n![image](img/178x003.png)\n\
    \n这个过程被转化为 `Listing 10.4` 的伪代码：\n\n### 列表 10.4：建堆（伪代码）\n\n```\n1 从最后一个元素的父节点\n\
    2 下堆化\n```\n\n### 建堆性能\n\n`buildheap` 算法执行 `n/2` 次下堆化，每次下堆化的复杂度为 $O(\\log n)$，因此其估计的工作量为\
    \ $O(n)$，这是一个线性时间。\n\n### 堆排序 (Heapsort)\n\n`heapsort` 提供了一种非常快的排序方法。在构建最大堆后，最大的元素位于根节点。通过将根节点与数组的最后一个元素交换，减小堆的大小，并对剩余部分再次下堆化，可以重复此过程直到完成排序。\n\
    \n### 示例\n\n使用 `heapsort` 处理数组 `77, 42, 17, 81, 24, 38, 50`，首先构建最大堆：\n\n![image](img/179x001.png)\n\
    \n然后 `remove()` 将 `81` 与 `24` 交换并进行堆化：\n\n![image](img/179x002.png)\n\n`81` 不再在堆中，它进入了数组的正确位置：\n\
    \n![image](img/179x003.png)\n\n这持续进行直到所有元素从堆中移除并进入排序位置：\n\n![image](img/179x004.png)\n\
    \n和 `buildheap` 一样，`Listing 10.5` 中的堆排序伪代码非常简单。\n\n### 列表 10.5：堆排序（伪代码）\n\n```\n\
    1 建堆\n2 当堆不为空\n3 移除值\n```\n\n### 练习题\n\n1. 显示对以下数组运行 `buildheap` 产生的序列和最终堆：\n\
    \    1. (a) `37, 17, 81, 74, 95, 52, 8, 83, 41`\n    2. (b) `62, 13, 66, 36, 69,\
    \ 70, 39, 95, 51`\n    3. (c) `46, 78, 96, 74, 60, 99, 23, 29, 5`\n    4. (d)\
    \ `40, 60, 57, 82, 55, 4, 6, 97, 59`\n2. 对以下初始数组显示 `heapsort` 的操作。将 `buildheap`\
