    \ on the left refers to the field named `num`, whereas `num` on the right refers\
    \ to the parameter. This is generally the only time we reuse field names; otherwise,\
    \ there is no.\n\n### Writing Constructors\n\nRecall from the previous section\
    \ that constructors are used with `new` in order to create new objects. Thus,\
    \ the primary purpose of a constructor is to set up new objects in a valid state,\
    \ meaning that its fields have meaningful values. In the case of the `Fraction`\
