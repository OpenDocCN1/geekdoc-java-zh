    \ an `ArrayList`, determine the O() performance of each of these fragments of\
    \ code. Give your answers in terms of `n`, the number of elements in `items`.\n\
    \n    1.  (a)\n\n        ```\n        for (int i = 0; i < items.size(); i++) {\n\
