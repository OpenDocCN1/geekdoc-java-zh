    \ allow the name of the addOn() method in [Listing 1.5](#K20431_C001.xhtml_lis1.5)\
    \ to be changed to add()? Explain why or why not.\n\n5.  Add code to the main()\
    \ of [Listing 1.5](#K20431_C001.xhtml_lis1.5) to accomplish these tasks:\n\n \
    \   1.  (a) Declare and create a Fraction named f with value 5/8\\. Print the\
    \ value of f.\n\n    2.  (b) Declare and create a Fraction named g with value\
    \ 17/3\\. Print the value of g.\n\n    3.  (c) Declare and create a Fraction named\
    \ h with value f + g. Print the value of h.\n\n    4.  (d) Declare and create\
    \ a Fraction named j with value 5\\. Print the value of j.\n\n    5.  (e) Increase\
    \ the value of g by 5\\. Print the new value of g.\n\n6.  Add these methods to\
    \ the Fraction class of [Listing 1.5](#K20431_C001.xhtml_lis1.5). Modify main()\
    \ to test your functions.\n\n    1.  (a) subtractOff(Fraction f) to subtract f\
    \ from this fraction\n\n    2.  (b) multiplyBy(Fraction f) to multiply this fraction\
    \ by f\n\n    3.  (c) divideBy(Fraction f) to divide this fraction by f\n\n  \
    \  4.  (d) addOn(int n) to add the integer n to this fraction\n\n7.  Add these\
    \ methods to the Fraction class of [Listing 1.5](#K20431_C001.xhtml_lis1.5). Modify\
    \ main() to test your functions.\n\n    1.  (a) subtract(Fraction f1, Fraction\
    \ f2) to compute f1 − f2\n\n    2.  (b) multiply(Fraction f1, Fraction f2) to\
    \ compute f1 * f2\n\n    3.  (c) divide(Fraction f1, Fraction f2) to compute f1\
    \ / f2\n\n8.  Write a reduce() method for the Fraction class of [Listing 1.5](#K20431_C001.xhtml_lis1.5)\
    \ that reduces this fraction to its lowest terms. Assume all terms are positive\
    \ and use the gcd() function from Exercise 8 in [Section 1.1](#K20431_C001.xhtml_ch1.1).\
    \ Add calls to the reduce() function to other methods in the class where they\
    \ are necessary.\n\n9.  Modify the reduce() method from the previous exercise\
    \ to handle negative fractions correctly. Have the constructor make sure all denominators\
    \ are positive, so that negative fractions have a negative numerator. Use the\
    \ Math.abs() library function if you need absolute value.\n\n[1](#K20431_C001.xhtml_ich1fn1)They\
    \ may be called from objects, but we will have no need to do that.\n\nChapter\
    \ 2\n\n# Algorithm Analysis\n\nAn important part of learning about data structures\
    \ is understanding their performance. There are at least two reasons:\n\nDesign\
    \ should take performance into account. What might seem like a natural and easy\
    \ to code design might be unacceptably slow.\n\nSelection of a data structure\
    \ for a particular task should also take performance into account.\n\nAs you will\
    \ see, data structures often get fast performance for some operations by sacrificing\
    \ the performance of others. Being aware of these tradeoffs is part of becoming\
    \ a good software developer.\n\nThere are also two main aspects to algorithm performance:\
    \ time and space. Time performance is simply how long it takes the algorithm to\
    \ run, whereas space is concerned with how much memory the algorithm requires.\
    \ We will concentrate mostly on time.\n\n## 2.1 Big-O Notation\n\nBig-O notation\
    \ is an example of an asymptotic notation that captures the overall behavior of\
    \ an algorithm or mathematical function for large input values. In order to get\
    \ a feel for the usefulness of asymptotic notations, it will help to look at an\
    \ example.\n\nSuppose we have three algorithms, A, B, and C, which take different\
    \ numbers of steps depending on their input size n:\n\n| Algorithm | Number of\
    \ Steps |\n\n| --- | --- |\n\n| A | 10n + 25 |\n\n| B | 0.1n2 + n + 28 |\n\n|\
    \ C | n 2 |\n\nIf we compute the number of steps each algorithm takes for different\
    \ n, the results look like this:\n\n| Input Size | Algorithm A |\n\n| --- | ---\
    \ |\n\n| 10 | 125 |\n\n| 20 | 225 |"
