    \ may be different.\n\n### Unsorted Lists\n\nAn unsorted list could be implemented\
    \ with either an array or linked list. Both display similar worst-case performance\
    \ characteristics:\n\n|  | Search | Insert | Delete |\n\n| --- | --- | --- | ---\
    \ |\n\n| Unsorted Array | O(n) | O(1) | O(n) |\n\n| Unsorted Linked List | O(n)\
    \ | O(1) | O(n) |\n\n### Sorted Lists\n\nSorted lists provide a potential advantage\
    \ over unsorted lists in searching. This gain is only for arrays, however, and\
    \ even there, comes at a cost of slower insertion:\n\n|  | Search | Insert | Delete\
    \ |\n\n| --- | --- | --- | --- |\n\n| Sorted Array | O(log n) | O(n) | O(n) |\n\
    \n| Sorted Linked List | O(n) | O(n) | O(n) |\n\n### Binary Search Trees\n\nOur\
    \ analysis of binary search trees to this point has been in terms of h, the height\
    \ of the tree. Their general performance is:\n\n|  | Search | Insert | Delete\
    \ |\n\n| --- | --- | --- | --- |\n\n| Binary Search Tree | O(h) | O(h) | O(h)\
    \ |\n\nAnalyzing these operations in terms of the number of nodes in the tree,n,\
    \ requires translating from h to n. The basic relationship between n and h is:\n\
    \nlog n < h ≤ n\n\nThis numeric relationship is expressed visually by the vastly\
    \ different shapes binary search trees can have. Consider the two extremes when\
    \ n = 7:\n\n![image](image/164x001.png)\n\nThus, the worst-case performance for\
    \ search, insert, and delete in terms of n does not look good:\n\n|  | Search\
    \ | Insert | Delete |\n\n| --- | --- | --- | --- |\n\n| Binary Search Tree (Worst\
    \ Case) | O(n) | O(n) | O(n) |\n\nThe best case is much better:\n\n|  | Search\
    \ | Insert | Delete |\n\n| --- | --- | --- | --- |\n\n| Binary Search Tree (Best\
    \ Case) | O(logn) | O(logn) | O(logn) |\n\nbut we should be skeptical of best-case\
    \ performance most of the time.\n\nIntuitively, most trees will fall somewhere\
    \ in between, but what will their performance (and shape) look like? What is the\
    \ shape of an “average” binary search tree? One approach is to consider random\
    \ elements added to an empty binary search tree. In that case,h is O(log n) (see\
    \ Cormen et al. [[6]](#K20431_bib.xhtml_ref_6) for a proof), and so we can expect\
    \ that performance with random data:\n\n|  | Search | Insert | Delete |\n\n| ---\
    \ | --- | --- | --- |\n\n| Binary Search Tree (Random) | O(log n) | O(log n) |\
    \ O(log n) |\n\nIt is important to understand this feature of binary search trees.\
    \ Their performance is generally fast for all operations,O(log n), but this bound\
    \ is not guaranteed. All that is guaranteed is O(h), and the worst case is still\
    \ O(n). Balanced binary search trees use various techniques to guarantee that\
    \ h is O(log n); see Cormen et al. [[6]](#K20431_bib.xhtml_ref_6) for the example\
    \ of red-black trees.\n\nExercises\n\n1.  Briefly explain each of the entries\
    \ for the worst-case performance of unsorted lists.\n\n2.  Briefly explain each\
    \ of the entries for the worst-case performance of sorted lists.\n\n3.  Explain\
    \ why log n < h ≤ n in any binary tree, where h is the height of the tree and\
    \ n is the number of nodes in the tree.\n\n4.  Average-case performance is easier\
    \ to analyze for unsorted and sorted lists than binary search trees.\n\n    1.\
    \  (a) Create a table of the average-case performance of search, insert, and delete\
    \ for unsorted lists, explaining each entry.\n\n    2.  (b) Create a table of\
    \ the average-case performance of search, insert, and delete for sorted lists,\
    \ explaining each entry.\n\n5.  Draw all 14 different binary search trees with\
    \ n = 4 elements, and then use them to calculate the average height of a binary\
    \ search tree of size four.\n\n6.  A simple method of allowing duplicate entries\
    \ in a binary search tree is to change the insertion algorithm in [Listing 9.3](#K20431_C009.xhtml_lis9.3)\
    \ to add duplicates in one direction:\n\n    ```\n    If data < n.data\n    ```\n\
    \n    ```\n     Insert on left\n    ```\n\n    ```\n    Else\n    ```\n\n    ```\n\
    \     Insert on right\n    ```\n\n    1.  (a) Modify your code to use this algorithm.\n\
    \n    2.  (b) Describe why this strategy may have a negative impact on performance.\n\
    \n    3.  (c) Outline a different strategy that should reduce this negative impact.\n\
    \n    4.  (d) Implement your strategy.\n\n7.  Deleting the predecessor instead\
    \ of the original node when a node has two children may have a negative impact\
    \ on performance over time.\n\n    1.  (a) Explain the reason for this effect.\n\
    \n    2.  (b) Outline a different deletion strategy that should reduce this negative\
    \ impact.\n\nChapter 10\n\n# Heaps\n\nThe heap data structure provides fast search,\
    \ insertion, and deletion by limiting the type of searches and deletions it will\
    \ do. Like binary search trees, heaps are binary trees, but they allow a looser\
    \ relationship between elements in order to guarantee their height is always O(logn).\n\
    \n## 10.1 Priority Queue Interface and Array-Based Heaps\n\nPriority queues and\
    \ heaps are closely related because heaps are often used as the underlying data\
    \ structure for the priority queue interface. However, other structures may be\
    \ used to implement priority queues, and heaps have purposes beyond just implementing\
    \ the priority queue interface.\n\n### Priority Queue Interface\n\nA priority\
    \ queue is an ordered structure in which items are removed in priority order rather\
    \ than first-in, first-out like a regular queue. We assume that priorities are\
    \ assigned by the way in which the items in the queue implement the Comparable\
    \ interface.\n\nThe main operations in a priority queue are to insert a new item\
    \ and to remove the item in the queue with highest priority. Thus, the ADT in\
    \ [Table 10.1](#K20431_C010.xhtml_Text_Anchor_tab10.1) is very similar to that\
    \ of a regular queue.\n\nIf you consider the other data structures we have studied\
    \ (see Exercise 3), none of them quite fit this interface. Heaps, on the other\
    \ hand, work nicely.\n\n### Heap Data Structure\n\nThere are actually two types\
    \ of heaps, max-heaps and min-heaps, since notions of priority can be based on\
    \ having either larger or smaller values.\n\nMax-Heaps are complete binary trees\
    \ (defined shortly) in which every element has value greater than or equal to\
    \ that of its children.\n\nTable 10.1\n\nPriority Queue ADT\n\n| void add(E item)Inserts\
    \ item into priority queue. |\n\n| boolean isEmpty()True if priority queue has\
    \ no elements. |\n\n| E peek()Returns highest priority item without removing.\
    \ |\n\n| E remove()Removes and returns highest priority item. |\n\n| int size()Number\
    \ of elements in priority queue. |\n\nMin-Heaps are complete binary trees in which\
    \ every element has value less than or equal to its children.\n\nThis requirement\
    \ that parents have a larger or smaller value than their children is known as\
    \ the heap property.\n\nThe most important consequence of the heap property is\
    \ that the largest element in a max-heap is always at the top of the heap. Similarly,\
    \ the smallest element in a min-heap is at the top. This makes finding the item\
    \ with highest priority easy in a heap.\n\n### Complete Binary Trees\n\nA complete\
    \ binary tree is a binary tree in which every level except the last has all possible\
    \ nodes, and on the last level, nodes fill in from the left. For example, the\
    \ tree on the left is complete but the tree on the right is not: * Complete\n\n\
    ![image](image/168x001.png)\n\nThe reason for defining “complete” in this way\
    \ is that it allows for an efficient array implementation.\n\n### Array-Based\
    \ Binary Trees\n\nGeneral binary trees benefit from the flexibility of a node-based\
    \ implementation because of the wide variety of shapes they can have. Putting\
    \ a tight restriction on the tree shape by requiring it to be complete leads to\
    \ an efficient, array-based alternative to using linked nodes."
