    \     for (int i = 0; i < 1000; i++) {\n       count++;\n     }\n     ```\n  \
    \ - (c):\n     ```java\n     for (int i = 0; i < n; i++) {\n       for (int j\
    \ = 0; j < n; j++) {\n         count++;\n       }\n     }\n     ```\n   - (d):\n\
    \     ```java\n     for (int i = 0; i < n; i++) {\n       for (int j = i; j <\
    \ n; j++) {\n         count++;\n       }\n     }\n     ```\n   - (e):\n     ```java\n\
    \     for (int i = 0; i < n; i++) {\n       for (int j = 0; j < 1000; j++) {\n\
    \         count++;\n       }\n     }\n     ```\n\n3. 解释一个表达式是 `O(1)` 的含义。\n4.\
    \ 解释说数组对任何元素的访问都是 `O(1)` 的含义。\n5. 根据参数 `n` 确定 [列表 1.1] 中 `factorial()` 函数的 O 性能。\n\
    6. 确定 [列表 1.3] 中 `linearSearch()` 函数的最好、最坏和平均性能。\n7. 确定练习 8 中 `sum()` 函数的最好、最坏和平均性能。\n\
    8. 确定练习 9 中 `max()` 函数的最好、最坏和平均性能。\n9. 确定练习 10 中 `min()` 函数的最好、最坏和平均性能。\n\n"
