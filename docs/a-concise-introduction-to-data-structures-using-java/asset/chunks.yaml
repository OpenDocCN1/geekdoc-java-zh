    \ the stack contents after each step:\n\n    1.  (a) 1 6 4 5 * + 2 / -\n\n   \
    \ 2.  (b) 6 5 * 3 + 4 2 / -\n\n    3.  (c) 5 4 + 3 / 1 - 6 * 2 +\n\n    4.  (d)\
    \ 6 2 1 + / 9 1 - 4 / -\n\n7.  Show how [Listing 4.5](#K20431_C004.xhtml_lis4.5)\
    \ converts these expressions without parentheses to postfix, giving the stack\
    \ contents after each step:\n\n    1.  (a) a + b + c + d\n\n    2.  (b) a + b\
    \ * c - d + e\n\n    3.  (c) a * b + c * d - e * f\n\n    4.  (d) a / b / c +\
    \ d * e * f\n\n## 4.4 Evaluating Expressions: Implementations\n\nThe goal of this\
    \ section is to implement the algorithms from [Listings 4.4](#K20431_C004.xhtml_lis4.4)\
    \ and [4.5](#K20431_C004.xhtml_lis4.5) as Java methods evalPostfix() and toPostfix().\
    \ The combination:\n\n```\n evalPostfix(toPostfix(expr))\n```\n\nwill evaluate\
    \ any infix expression. We assume all operands are integers, there are no parentheses\
    \ in the infix expression (until the exercises), and that all terms are separated\
    \ by spaces."
