  trans: "\n栈（stack）的对应结构是队列（queue）。在（主要是）英国英语用法中，queue 指的是等待队。在计算机科学中，队列是一种像等待队一样的数据结构，项从队列的头部移除，而新项被添加到队列的末尾。队列是一个先进先出（FIFO）的数据结构，因为第一个进入的元素将是第一个离开的。\n\
    \n![image](img/085x001.png)\n\n向队列的末尾添加元素被称为 `enqueuing`（入队），从队列的头部移除元素被称为 `dequeuing`（出队，读音为“DQ-ing”）。在这里将头部画在左侧，以匹配我们即将考虑的链表。\n\
    \n### 队列 ADT\n\n表 5.1 中的队列抽象数据类型（Queue ADT）与栈 ADT 非常相似。练习题要求你以 Java 接口的形式编写该 ADT。\n\
    \n表 5.1\n\n队列 ADT\n\n| `E dequeue()` 返回并移除队列头部的项。 |\n| `void enqueue(E item)`\
    \ 将项添加到队列末尾。 |\n| `boolean isEmpty()` 如果队列中没有元素，则返回 true。 |\n| `E peek()` 返回队列头部的项但不将其移除。\
    \ |\n| `int size()` 队列中元素的数量。 |\n\n和栈一样，队列是一个线性结构，这意味着元素存储在有序的序列中，因此队列可以使用数组或链表来实现。与栈一样，我们的目标是尽可能让所有操作的时间复杂度都达到\
    \ O(1)。链表的实现比数组版本稍微简单一些，因此我们从它开始。\n\n### 链表实现\n\n由于链表在头部（head）处有一个天然的“头部”，我们首先想象队列的头部位于链表的起始：\n\
    \n![image](img/086x001.png)\n\n然后，我们需要研究如何高效地提供 ADT 中的两个主要操作：\n\n出队（Dequeuing）在\
    \ O(1) 时间内很容易完成，因为从链表头部移除元素只需要改变一次引用即可。这与从链栈中弹出（pop）是一样的。\n\n入队（Enqueuing）更为困难，因为我们需要将新元素添加到链表的末尾。移动到链表的末尾（称为遍历链表）需要\
    \ O(n) 时间，因此应该避免这样做。如果我们保留一个单独的尾部指针（tail pointer）指向链表的最后一个节点，就可以高效地进行入队。\n\n队列的最后一个节点是链表的末尾，因此我们保留一个名为\
    \ `rear` 的第二个实例变量：\n\n![image](img/086x002.png)\n\n此时入队一个新项需要在 `rear` 之后添加一个新节点。\n\
    \n### 在节点后插入\n\n由于这并没困难，我们解决了一个更通用的问题：在任何给定的节点 `p` 之后添加新节点，而不仅仅是在最后一个节点之后。\n\n\
    ![image](img/086x003.png)\n\n这些步骤与在链表头部插入的步骤相似（见第 58 页）：\n\n1. 创建一个新节点：\n\n  \
    \ ```\n   Node q = new Node<>(item, null);\n   ```\n\n   ![image](img/087x001.png)\n\
    \n2. 将新节点的 `next` 字段指向 `p` 之后的节点：\n\n   ```\n   q.next = p.next;\n   ```\n\n \
    \  ![image](img/087x002.png)\n\n3. 将 `p.next` 指向新节点：\n\n   ```\n   p.next = q;\n\
    \   ```\n\n   ![image](img/087x003.png)\n\n与之前一样，这些步骤可以合并为一条：\n\n```\np.next =\
    \ new Node<>(item, p.next);\n```\n\n### 在节点后删除\n\n虽然我们在队列中不需要这种操作，但删除给定节点 `p`\
    \ 之后的节点与在 `p` 之后插入新节点类似，因为这同样仅仅是对 `p.next` 的改变。然而，`p.next` 不再指向新节点，而是更新为指向随其后的节点，而该节点由\
    \ `p.next.next` 指向。\n\n![image](img/087x004.png)\n\n```\np.next = p.next.next;\n\
    ```\n\n要删除的节点（由 `p.next` 指向）必须存在，否则对 `p.next.next` 的引用将导致空指针异常。\n\n### 管理尾部\n\n\
    唯一剩下的问题是在在入队和出队期间小心更新 `rear` 指针。`rear` 指针初始为 null，与头部一样。\n\n入队：如果队列为空，创建一个节点并将\
    \ `front` 和 `rear` 都指向它。否则，在 `rear` 之后添加一个新节点，然后更新 `rear` 指向该新节点。\n\n出队：项从头部移除，因此只有在出队最后一个项时，才会涉及\
    \ `rear` 指针。在那种情况下，`rear` 应该被设置为 null。\n\n你将被要求在练习中实现 `LinkedQueue<E>` 类。\n\n\
    ### 练习题\n\n1. 显示这些操作在一个名为 `q` 的初始空整数队列上的结果。在每次操作后画出队列的内容，标清头部在哪里，并给出每个非 void 方法的返回值。\n\
    \n    1. (a) `q.enqueue(5)`\n      `q.enqueue(8)`\n      `q.peek()`\n      `q.enqueue(3)`\n\
    \      `q.dequeue()`\n      `q.enqueue(10)`\n      `q.size()`\n      `q.enqueue(4)`\n\
    \      2. (b) `q.enqueue(1)`\n      `q.dequeue()`\n      `q.enqueue(2)`\n    \
    \  `q.dequeue()`\n      `q.enqueue(3)`\n      `q.dequeue()`\n      `q.size()`\n\
    \      `q.enqueue(4)`\n      `q.peek()`\n      `q.dequeue()`\n\n    3. (c) `q.enqueue(10)`\n\
    \      `q.enqueue(20)`\n      `q.enqueue(30)`\n      `q.enqueue(40)`\n      `q.peek()`\n\
    \      `q.enqueue(50)`\n      `q.dequeue()`\n      `q.size()`\n      `q.dequeue()`\n\
    \n2. 判断对于以下类型，队列是否是合适的数据结构。假设当任务到达时入队，当被选择时出队。解释你的答案。\n\n    1. (a) 任意顺序执行的任务。\n\
    \    2. (b) 等待最长的总是出队。\n    3. (c) 最近接收的任务总是出队。\n    4. (d) 按照到达顺序执行的任务。\n   \
    \ 5. (e) 需要排序的任务。\n\n3. 为表 5.1 中的 ADT 编写泛型接口 `Queue<E>`。\n\n4. 为练习 3 开发 `LinkedQueue<E>`\
    \ 类。编写这些成员：\n\n    1. (a) 私有 `Node<T>` 类，包含一个仅接受一个参数的第二个构造函数，并将 next 设置为 null。\n\
    \    2. (b) `dequeue()` 如果队列为空，从 `java.util` 抛出 `NoSuchElementException`（见第 55\
    \ 页）。\n    3. (c) `enqueue()`\n    4. (d) `isEmpty()`\n    5. (e) `peek()` 如果队列为空抛出\
    \ `NoSuchElementException`。\n    6. (f) `size()` 一个大小变量并在时更新它。\n\n5. 在 `LinkedQueue<E>`\
    \ 类中添加 `main()` 方法，使用以下内容测试队列：\n\n    1. (a) 整数\n    2. (b) 双浮点数\n    3. (c) 字符串\n\
    \n6. 确定 `LinkedQueue` 操作的 O() 时间复杂度。解释你的答案。\n\n    1. (a) `dequeue()`\n    2.\
    \ (b) `enqueue()`\n    3. (c) `isEmpty()`\n    4. (d) `peek()`\n    5. (e) `size()`\n\
    \n7. 如上述，`enqueue` 方法必须将空队列视为特殊情况。为了避免这种情况，可以在链表的头部创建一个空数据的虚拟节点。这简化了入队，但需要重写其他方法以考虑虚拟节点。使用这种方法实现\
    \ `Queue<E>` 的 `DummyLinkedQueue<E>`。讨论权衡。\n\n 5.2 数组实现\n\n链表队列比其对应的栈稍微复杂一点，需要第二个尾部指针来实现高效入队。类似，队列的数组实现也需要额外工作来实现\
    \ O(1) 性能。不过，主思想与数组栈相似，因此我们从忽略这些复杂性开始。\n\n### 基本思想\n\n与栈的数组实现一样，从想象几个元素添加到队列是有帮助的。假设\
    \ 10、20 和 30 按照顺序入队；那么自然地是将它们存储在数组的开头（为了简化图片，显示为原始类型）：\n\n![image](img/090x001.png)\n\
    \n"
- fmt: "\nAt this point, 10 is at the front of the queue and 30 is at the rear, so\
    \ instance variables should track those locations:\n\n![image](image/090x002.png)\n\
    \nIf the next operation is to enqueue 40, then it goes to the rear of the queue:\n\
    \n![image](image/090x003.png)\n\nCode to enqueue a new item like this is straightforward:\n\
    \n```\ndata[++rear] = item;\n```\n\nIf the next operation is dequeue, then 10\
    \ should be returned and then `front` increased:\n\n![image](image/091x001.png)\n\
    \nand so the code to dequeue is:\n\n```\nreturn data[front++];\n```\n\n### Problem:\
    \ Drift\n\nThe problem with this basic idea is that the queue gradually moves\
    \ to the right in the array. Even if the queue never has more than a few elements\
    \ in it, if there is a lot of enqueuing and dequeueing, the queue will eventually\
    \ fall off the end of the array:\n\n![image](image/091x002.png)\n\nShifting the\
    \ queue elements back to the beginning of the array would take a lot of time if\
    \ the array was large, and increasing the size of the array would be wasteful\
    \ for only a handful of items. A better solution is to teach the array to wrap\
    \ around.\n\n### Circular Array\n\nA circular array wraps around, so that incrementing\
    \ the last index wraps back around to the first index:\n\n![image](image/091x003.png)\n\
    \nIn the above example, that would mean “incrementing” 6 to get 0 instead of 7.\n\
    \nThe remainder operator `%` does this nicely:\n\n```\n(6 + 1) % 7 = 7 % 7 = 0\n\
    ```\n\nand so the general code to increment in a circular array is:\n\n```\nvar\
    \ = (var + 1) % array.length\n```\n\nThis will be a common operation in the queue,\
    \ so it might be worth keeping a capacity instance variable storing the current\
    \ length of the array. Then updating `front` and `rear` become:\n\n```\nrear =\
    \ (rear + 1) % capacity;\n```\n\n```\nfront = (front + 1) % capacity;\n```\n\n\
    Modifying the basic operations:\n\n```\ndata[++rear] = item; // enqueue\n```\n\
    \n```\nreturn data[front++]; // dequeue\n```\n\nto use circular increments instead\
    \ of `++` will solve the drifting problem.\n\n### Resizing Circular Arrays\n\n\
    By solving one problem we have created another: resizing now has to take circularity\
    \ into account. To see the problem, suppose a queue has been in use for some time,\
    \ has elements 10, 20, . . . , 50 queued in that order, and is now full:\n\n![image](image/092x001.png)\n\
    \nIf we resize in the same way as an array stack (see [Listing 3.2](#K20431_C003.xhtml_lis3.2)),\
    \ then the result would be:\n\n![image](image/092x002.png)\n\nThis will not work:\
    \ the queue expects 40 to follow 30 (because it had in the circular array), and\
    \ even though there are empty slots, there is no room after the end of the queue\
    \ (i.e., after item 50). Therefore, we need to change the resizing method so that\
    \ the front of the queue is back in slot 0:\n\n![image](image/092x003.png)\n\n\
    This looks like it would be tricky to write, but it’s not too bad with the right\
    \ organization. The idea is to loop over the new array locations with one variable\
    \ `i`, while updating a second variable `j` that loops through the old circular\
    \ array. [Listing 5.1](#K20431_C005.xhtml_lis5.1) outlines this approach. Notice\
    \ in it how the for-loop updates `i`, while `j` is updated for the old circular\
    \ array inside the loop.\n\nListing 5.1: Resize Circular Array (Pseudocode)\n\n\
    ```\n1 j = front\n```\n\n```\n2 for i = 0 to size - 1\n```\n\n```\n3 newData[i]\
    \ = data[j]\n```\n\n```\n4 j = (j + 1) % capacity\n```\n\n```\n5 Update front,\
    \ rear, capacity, data\n```\n\nThe exercises ask you to complete this implementation\
    \ and the rest of the `ArrayQueue<E>` class.\n\n### Exercises\n\n1. Explain the\
    \ use of prefix and postfix increment in the basic array queue operations:\n\n\
    ```\ndata[++rear] = item; // enqueue\n```\n\n```\nreturn data[front++]; // dequeue\n\
    ```\n\n2. Determine the correct starting values for the `front` and `rear` array\
    \ indices of an array queue. Explain your answers.\n\n3. In a circular array implementation\
    \ of a queue:\n    1. (a) Explain why this relationship is true for both empty\
    \ and full queues:\n      ```\n      (rear + 1) % capacity == front\n      ```\n\
    \    2. (b) If there were no `size` instance variable storing the number of items\
    \ in the queue, how might you tell the difference between an empty queue and a\
    \ full queue? Outline a strategy.\n\n4. Circular arrays were introduced in part\
    \ to avoid shifting elements to reposition the queue at the front of the array.\
    \ However, that is precisely what the `resize()` method does, because of circularity.\
    \ Is that a problem? In other words, does resizing with [Listing 5.1](#K20431_C005.xhtml_lis5.1)\
    \ impact the queue’s performance differently than resizing an array stack? Explain\
    \ why or not.\n\n5. Develop the `ArrayQueue<E>` class, implementing the `Queue<E>`\
    \ interface with a circular array as described in this section. Use separate `size`\
    \ and `capacity` instance variables, and write these methods:\n    1. (a) `dequeue()`\
    \ Throw a `NoSuchElement` exception if the queue is empty, and set the obsolete\
    \ reference (see page 71) to `null`.\n    2. (b) `enqueue()` Double the size of\
    \ the array if the queue is full.\n    3. (c) `isEmpty()`\n    4. (d) `peek()`\
    \ Throw a `NoSuchElement` exception if the queue is empty.\n    5. (e) `size()`\
    \ Include a `size` instance variable and update it where necessary.\n    6. (f)\
    \ Private `resize()` Implement [Listing 5.1](#K20431_C005.xhtml_lis5.1).\n   \
    \ 7. (g) Two constructors: one default, and one that takes an initial capacity\
    \ as a parameter. The default constructor should call the other constructor using\
    \ `this()`.\n\n6. Add a `main()` method to the `ArrayQueue<E>` class to test the\
    \ queue with:\n    1. (a) Integers\n    2. (b) Doubles\n    3. (c) Strings\n\n\
    7. Determine the O() time complexity of these ArrayQueue operations. Explain your\
    \ answers.\n    1. (a) `dequeue()`\n    2. (b) `enqueue()` Ignore resizing.\n\
    \    3. (c) `isEmpty()`\n    4. (d) `peek()`\n    5. (e) `size()`\n\n## 5.3 Inheritance:\
    \ Fixed-Length Queues\n\nQueues turn up in interesting places and are not always\
    \ in software. For example, hardware queues are common components in systems that\
    \ receive data at a variable rate: the queue allows items to collect in a waiting\
    \ line until the processor is ready.\n\n### Examples: GPUs and Network Routers\n\
    \nGraphics processing units (GPUs) are constructed with a pipeline architecture,\
    \ which you can imagine as a sequence of stages connected by pipelines:\n\n![image](image/095x001.png)\n\
    \nGraphics data move down these pipelines from one stage to the next, with hardware\
    \ FIFO queues at each stage to prevent stalling when one of the stages cannot\
    \ keep up with the inputs.\n\nHardware queues are also used in network routers\
    \ to hold incoming packets before they are processed. Because of the importance\
    \ of not dropping network packets, routers usually have other mechanisms including\
    \ software queues to handle full hardware queues.\n\nIn this section, we develop\
    \ a fixed-length queue to model hardware queues or other queues that have a fixed\
    \ maximum capacity.\n\n### Inheritance\n\nRather than writing a fixed-length queue\
    \ class from scratch, it would be better to take advantage of the work we’ve done.\
    \ The basic idea of inheritance is for one class (the subclass) to begin with\
    \ the state and behavior of another class (the superclass), but then be allowed\
    \ to add new variables and methods, as well as redefine how old methods work.\
    \ The new class is said to extend the old class and so is also known as an extension\
    \ of the base class.\n\n![image](image/095x002.png)\n\n### Inheritance Hierarchy\n\
    \nSub- and superclass relationships between classes create an inheritance hierarchy\
    \ with more general classes towards the top and more specific classes towards\
    \ the bottom.\n\nFor example, some of the classes you have seen so far are related\
    \ by inheritance in this way:\n\n![image](image/096x001.png)\n"
