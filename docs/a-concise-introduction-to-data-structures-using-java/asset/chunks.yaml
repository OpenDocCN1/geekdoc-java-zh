    5. 确定堆中最后一个节点的父节点索引表达式。你可以使用第 10.1 节练习 11 中的辅助函数。


    6. 为 `MaxHeap` 类实现一个公有的 `MaxHeap(E[] items)` 构造函数，用于从给定的项目数组构建堆。使用一个私有的 `buildHeap()`
    辅助方法来实现列表 10.4。假设项目数组已填满元素，并为 `MaxHeap` 类保留一个无参数的默认构造函数。


    7. 实现一个公有的静态 `heapSort(T[] items)` 方法，通过实现列表 10.5 来对给定的项目数组进行排序。


    8. 确定堆排序（heapsapsort）最坏情况的 `O()` 性能，并将其与第 2.2 节中的插入排序进行比较。解释你的答案。


    ### 项目：基于事件的模拟


    第 5 章末的项目开发了一个基于时钟的模拟，其中一个整数时钟变量跟踪时间，随着程序的运行而计数。在每个时间步，程序对下一步将发生什么做出决策。这种组织方式很自然，但也有一个局限性：程序员必须提前决定时钟跳动的频率。这个选择非常重要，因为如果跳动不够频繁，模拟可能会错过事件；而频率过高则浪费计算资源。使用事件来组织模拟而不是时钟可以消除这种困难。


    ### 事件


    基于事件的模拟将焦点从时钟转移到一组事件对象。仍然存在时间的概念，但通常没有中央时钟。相反，每个事件都有发生的时间，并按时间增加的顺序处理事件。当一个事件被处理时，该时间被认为已经“发生”，且该事件可能会产生其他更晚的事件。使用最小堆实现的优先级队列管理这些事件非常容易：事件可以在任何时间添加，且下一个事件始终位于堆的顶端。


    在基于事件的模拟中，时钟在每个事件从优先级队列处理时隐式地跳动，而不是在时钟变量中显式跳动。在某种意义上，这个时钟只有在发生事情时才会跳动。这消除了必须决定时钟应该跳动多频繁的问题。


    ### 收银台模拟


    你可能注意到，某些带有多个收银员的区域只有一个服务所有收银员的等待队列，而另一些每个收银员都有独立的等待队列。一个自然的问题是两种方法是否比另一种更有效，解决这个问题的方法之一是通过模拟。


    基于事件的收银模拟可能围绕“到达”（Arrival）和“离开”（Departure）事件展开。这两种事件都存储客户和时间，并按时间排序。离开事件还存储了正在服务客户的收银员。当“到达”事件被处理时，客户将由服务系统提供服务，该系统基于单队列或多队列。服务系统要么将客户分配给收银员，要么将客户放入队列等待。如果有多个队列，客户被放入最短的排队中。


    当客户被分配给收银员时，将根据该客户所需的服务时间创建一个新的“离开”事件。“离开”事件通知服务系统收银员已空闲，以便将等待中的客户分配给该收银员。可以通过将一组“到达”事件放入优先级队列来初始化模拟。


    ### 客户到达的建模：泊松过程


    模拟通常对其主要组件使用复杂的数学模型。收银台模拟的一个关键组件是客户何时到达的。泊松过程通常用于此目的，因为它假设到达之间没有“记忆性”：下一次客户到达之前的时间间隔不依赖于上一个客户到达之前的间隔。


    如果 `t` 是到达时间，以下算法为到达速率为 `λ` 的泊松过程计算一系列 `t` 值。0 从 `t = 0` 开始，然后对于每个客户，通过以下公式更新
    `t`：


    $t = t - \frac{1}{\lambda}\log U$


    其中 `U` 是 0 到 1 之间的随机双点数。继续此过程直到达到所需的总时间长度。详见 Ross [[11]](#K20431_bib.xhtml_ref_11)。


    ### 正态分布建模


    随机数生成器通常设计为产生均匀分布的值，这意味着每个可能值的概率相等。然而，模拟通常还需要具有近似“钟形曲线”形状的正态分布值。正态分布由其均值和标准差描述。请参考
    Ross [[11]](#K20431_bib.xhtml_ref_11) 或统计学教材获取这些术语的定义和更多信息。


    表 2.3 列出了 `java.util.Random` 类的 `nextGaussian()` 方法，用于生成正态分布的值。它假设均值为 0.0，标准差为
    1.0。配合不同的均值 `m` 和标准差 `s` 使用它，请计算：


    ```

    m + gen.nextGaussian() * s

    ```


    其中 `gen` 是 `java.util.Random` 对象。


    ### 设计


    以下类对实现此项目可能有所帮助：


    `Customer` 拥有到达时间、服务时间和可能存在的唯一客户编号的实例变量。


    `Cashier` 拥有正在服务的当前客户的实例变量。


    `Server` 是一个存储收银员数组的抽象类。它定义了一个


    ```

    assign(customer, cashier, time)

    ```


    方法用于将客户分配给特定的收银员。它还定义了三个抽象方法（见第 172 页），由具体的子类实现：


    ```

    serve(customer)

    ```


    ```

    clear(cashier, time)

    ```


    ```

    printStats()

    ```


    子类为：


    `SingleQueueServer` 使用一个队列存放所有收银员的客户。


    `MultipleQueueServer` 拥有一个队列数组。


    `Event` 是一个抽象类，拥有时间和客户的实例变量。它重写了 `compareTo()`，使得事件根据时间进行比较。它有一个抽象方法：


    ```

    process(server)

    ```


    由具体的子类定义：


    “到达”事件调用服务器的 `serve()` 方法。


    “离开”事件调用服务器的 `clear()` 方法。


    `Simulator` 是运行模拟的驱动类。


    使用这种结构，多队列收银员将需要一个队列数组。该数组的类型是泛型的：


    ```

    Queue<Customer>[] queues;

    ```


    向后看第 193 页，`Object` 类不能创建这种类型的泛型数组；相反，必须使用 `Queue` 类型然后转换为泛型类型：


    ```

    queues = (Queue<Customer>[]) new Queue[length];

    ```


