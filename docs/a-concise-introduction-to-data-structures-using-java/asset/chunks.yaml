    5. Determine an expression for the index of the parent of the last node in a heap.
    You may use the helper functions from Exercise 11 in [Section 10.1](#K20431_C010.xhtml_ch10.1).


    6. Implement a public `MaxHeap(E[] items)` constructor for the `MaxHeap` class
    that builds a heap from the given array of items. Use a private `buildHeap()`
    helper method to implement [Listing 10.4](#K20431_C010.xhtml_lis10.4). Assume
    the items array is full of elements, and keep a default constructor with no parameters
    for the `MaxHeap` class.


    7. Implement a public static `heapSort(T[] items)` method that implements [Listing
    10.5](#K20431_C010.xhtml_lis10.5) to sort the given array of items.


    8. Determine the worst-case `O()` performance of heapsapsort, and compare it with
    insertion sort from [Section 2.2](#K20431_C002.xhtml_ch2.2). Explain your answer.


    ### Project: Event-Based Simulation


    The project at the end of [Chapter 5](#K20431_C005.xhtml_ch5) developed a clock-based
    simulation in which an integer clock variable kept track of the time, ticking
    along as the program ran. At each time step, the program made decisions about
    what happened next. This organization is natural but has a limitation: the programmer
    must decide ahead of time how frequently to tick the clock. The choice is important,
    because if it doesn’t tick often enough, the simulation may miss events, whereas
    a clock frequency that is too high wastes computation. Using events to organize
    a simulation instead of a clock eliminates this difficulty.


    ### Events


    An event-based simulation shifts the focus from the clock to a set of event objects.
    There is still a notion of time, but there is often no central clock. Instead,
    each event has a time that it happens, and events are processed in order of increasing
    time. When an event is processed, that time is considered to have “happened,”
    and the event may generate other, later events. Managing these events is easy
    with a priority queue implemented with a min-heap: events may be added at any
    time and the next event is always available at the top of the heap.


    In an event-based simulation, the clock ticks implicitly when each event is processed
    from the priority queue, rather than explicitly in a clock variable. In a sense,
    this clock only ticks when something happens. This eliminates the problem of having
    to decide how frequently the clock should tick.


    ### Checkout Line Simulation


    You may have noticed that some checkout areas with multiple cashiers have a single
    waiting line that serves all cashiers, while others have separate waiting lines
    for each. A natural question is whether one of the two methods is more efficient
    than the other, and one way to approach that question is through simulation.


    An event-based checkout simulation might center around Arrival and Departure events.
    Both types of events store a customer and time, and are ordered by their time.
    Departure events also store the cashier serving the customer. When an Arrival
    event is processed, the customer is served by a service system, which is based
    on either a single queue or multiple queues. The service system either assigns
    the customer to a cashier or puts the customer in a queue to wait. If there are
    multiple queues, the customer is put in the shortest line.


    When customers are assigned to cashiers, a new Departure event is created based
    on the service time required by that customer. A Departure event notifies the
    service system that the cashier is free so that a waiting customer can be assigned
    to that cashier. The simulation can be initialized by putting a set of Arrival
    events into the priority queue.


    ### Modeling Customer Arrivals: Poisson Processes


    Simulations often employ sophisticated mathematical models for their major components.
    One of the key components of a checkout line simulation is when customers arrive.
    A Poisson process is often used for this purpose because it assumes no “memory”
    between arrivals: the time gap before the next customer arrives does not depend
    on the gap before the previous customer.


    If `t` is the arrival time, the following algorithm computes a sequence of `t`
    values for a Poisson process with arrival rate `λ` 0. Begin with `t = 0`, and
    then for each customer, update `t` via


    $t = t - \frac{1}{\lambda}\log U$




    where `U` is a random double between 0 and 1. Continue this process for the desired
    length of total time. See Ross [[11]](#K20431_bib.xhtml_ref_11) for details.


    ### Modeling Normal Distributions


    Random number generators usually are designed to produce uniformly distributed
    values, meaning that each possible value is equally likely. However, simulations
    also often require values with an approximately normal distribution with a “bell
    curve” shape. Normal distributions are described by their mean and standard deviation.
    See Ross [[11]](#K20431_bib.xhtml_ref_11) or a statistics textbook for definitions
    of these terms and more information.


    [Table 2.3](#K20431_C002.xhtml_Text_Anchor_tab2.3) lists the `nextGaussian()`
    method of the `java.util.Random` class for generating values from a normal distribution.
    It assumes a fixed mean of 0.0 and standard deviation 1.0. To use it with different
    mean `m` and standard deviation `s`, compute:


    ```

    m + gen.nextGaussian() * s

    ```


    where `gen` is a `java.util.Random` object.


    ### Design


    Here is a set of classes that may be helpful for implementing this project:


    `Customer` has instance variables for arrival time, service time, and perhaps
    a unique customer number.


    `Cashier` has instance variable for the current customer being served.


    `Server` is an abstract class storing an array of cashiers. It defines an


    ```

    assign(customer, cashier, time)

    ```


    method to assign a customer to a particular cashier. It also defines three abstract
    methods (see page 172) that are implemented by the concrete subclasses:


    ```

    serve(customer)

    ```


    ```

    clear(cashier, time)

    ```


    ```

    printStats()

    ```


    The subclasses are:


    `SingleQueueServer` uses one queue to hold customers for all cashiers.


    `MultipleQueueServer` has an array of queues.


    `Event` is an abstract class with instance variables for the time and customer.
    It overrides `compareTo()` so that events compare based on their time. It has
    one abstract method:


    ```

    process(server)

    ```


    defined by its concrete subclasses:


    Arrival events call the server’s `serve()` method.


    Departure events call the server’s `clear()` method.


    `Simulator` is a driver class to run the simulation.


    Using this structure, the multiple queue server will need an array of queues.
    The type of this array will be generic:


    ```

    Queue<Customer>[] queues;

    ```


    If you look ahead to page 193, the `Object` class cannot be used to create this
    type of generic array; instead the `Queue` type must be used and then cast to
    the generic type:


    ```

    queues = (Queue<Customer>[]) new Queue[length];

    ```

