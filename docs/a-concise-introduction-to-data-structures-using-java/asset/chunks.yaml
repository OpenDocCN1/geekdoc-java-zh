  trans: "\n该思想是将完全树存储在数组的开头，从根节点开始逐层向下。例如，在一个大小为 12 的堆中，树位置与数组索引之间存在这种对应关系：0。\n\n\
    ![image](img/169x001.png)\n\n要求树是完全的等同于确保数组元素之间没有浪费的间隙。\n\n## 示例\n\n这是一个包含 10\
    \ 个元素的最大堆示例：98\n\n![image](img/169x002.png)\n\n它的组织性似乎比二叉搜索树要少，因为例如，堆的左半部分与右半部分没有关系，除了它们都包含小于根节点的值。存储在数组中，这个堆看起来如下：\n\
    \n![image](img/169x003.png)\n\n### 父节点与节点\n\n为了维护堆属性，我们经常需要比较父与其子之间的值。因此，计算节点的数组索引与其父子节点索引之间的关系是有帮助的。使用上面的索引图，对于索引为\
    \ `i` 的节点：\n\n![image](img/169x004.png)\n\n如果堆从索引 1 开始，会得到更漂亮的公式，但这个决定会增加后续代码的复杂度。\n\
    \n### 可比较元素的泛型数组\n\n如果类型参数 `E` 继承 `Comparable` 接口，则我们用于创建泛型数组的方法将不起作用。语句\n\n```\n\
    arrayRef = (E[]) new Object[LENGTH];\n```\n\n可以编译，但如果 `E` 声明为继承 `Comparable`：\n\
    \n```\n<E extends Comparable<? super E>>\n```\n\n那么数组创建将在运行时失败，因为 `Object` 类型不保证实现\
    \ `Comparable`。\n\n解决方案是使用 `Comparable` 而不是 `Object` 来创建数组：\n\n```\narrayRef =\
    \ (E[]) new Comparable[LENGTH];\n```\n\n避免此问题的替代方案是将数组声明为类型 `Object[]` 而不是 `E[]`，但每次数组访问必须强制转换为类型\
    \ `E`。\n\n## 练习题\n\n1. 在初始名为 `pq` 的空整数优先级队列上执行这些操作的结果。给出每个非空操作的返回值，并假设较大的值具有更高。以从大到小的列表给出队列内容。\n\
    \n    - (a) `pq.add(5)`\n      `pq.add(8)`\n      `pq.peek()`\n      `pq.add(3)`\n\
    \      `pq.remove()`\n      `pq.add(10)`\n      `pq.size()`\n      `pq.add(4)`\n\
    \      `pq.remove()`\n      `pq.remove()`\n\n    - (b) `pq.add(10)`\n      `pq.add(20)`\n\
    \      `pq.add(30)`\n      `pq.add(40)`\n      `pq.peek()`\n      `pq.add(50)`\n\
    \      `pq.remove()`\n      `pq.size()`\n      `pq.remove()`\n      `pq.remove()`\n\
    \n2. 为表 10.1 中的优先级队列 ADT 写一个泛型 Java 接口 `PriorityQueue<E>`。\n\n3. 如果这些数据结构中的每一个一个用于底层实现，确定优先级队列接口中\
    \ `add()` 和 `remove()` 方法的 `O()` 最坏情况性能：\n\n    - (a) 无序数组\n    - (b) 无序链表\n \
    \   - (c) 有序数组\n    - (d) 有序链表\n    - (e) 二叉搜索树\n\n    解释你的答案。\n\n4. 解释为什么最大堆中的最大元素在顶部。\n\
    \n5. 解释为什么最小堆中的最小元素在顶部。\n\n6. 确定任何堆中最后一个元素的索引。\n\n7. 解释为什么堆的高度是 `O(log n)`。\n\n\
    8. 讨论基于节点的树和基于数组的树在内存使用上的差异。是否有一种更有优势？解释。\n\n9. 如果堆从索引 1 开始存储，确定父、左、右的关系。\n\n\
    10. 通过声明实例变量并编写这些公共方法开始实现 `PriorityQueue<E>` 的 `MaxHeap<E>` 类：\n\n    - (a) 构造函数：使用\
    \ `Comparable` 而不是 `Object` 创建数组。\n    - (b) `size()`\n    - (c) `isEmpty()`\n\
    \    - (d) `peek()`：如果堆为空则抛出 `NoSuchElementException`。\n    - (e) `toString()`\n\
    \n    其他公共方法将在下一节开发。\n\n11. 通过编写这些私有辅助方法继续练习：\n\n    - (a) `resize()`：使用 `Comparable`\
    \ 而不是 `Object` 创建数组。\n    - (b) `parent()`，`left()` 和 `right()`\n    - (c) `swap(i,\
    \ j)`：交换索引 `i` 和 `j` 处的元素。\n    - (d) `isValid(i)`：如果 `i` 是基于当前堆大小的有效堆索引返回 true。\n\
    \    - (e) `isLarger(i, j)`：如果索引 `i` 处的项大于索引 `j` 处的项则返回 true。\n\n12. 重复练习 10 和\
    \ 11，以开始 `MinHeap<E>` 的实现，将 `isLarger()` 替换为 `isSmaller()`。\n\n13. 考虑 `MaxHeap`\
    \ 和 `MinHeap` 之间共享的代码量。\n"
- fmt: "\n```\n1 Swap the root with the last item\n```\n\n```\n2 Update the heap size\n\
    ```\n\n```\n3 Heapify down\n```\n\n```\n4 Return the largest item\n```\n\n## Heapifying\
    \ Down\n\nHeapifying down is more complicated than working up because if there\
    \ is a violation of the heap property, we can’t just look to the one parent—we\
    \ need to check both children.\n\n### Example\n\nSuppose `remove()` is called\
    \ on the heap we finished with in the last example. Then `77` will be returned,\
    \ and `11` will need to move to the top (for now, we ignore swapping `77` to the\
    \ last spot):\n\n![image](image/174x002.png)\n\nTo heapify down with `11` at the\
    \ top, we need to consider both children and decide which one to swap with `11`:\
    \ `11`\n\n![image](image/175x001.png)\n\nIf `11` swaps with `51`, then the heap\
    \ property will be violated between `51` and `52`; thus, we swap `11` with its\
    \ larger child, `52`. This process is repeated until we have a valid heap. `52`\n\
    \n![image](image/175x002.png)\n\nListing `10.3` gives one way to organize the\
    \ steps in `heapifyDown(i)`. The main task is to decide which of the three items\
    \ is largest: the value at `i` or one of its two children. This algorithm needs\
    \ to be careful not to go past the bottom of the heap when accessing children.\n\
    \n### Listing 10.3: Heapify Down (Pseudocode)\n\n```\n1 Set largest = i\n2 If\
    \ left child is valid and larger than largest, largest = left\n3 If right child\
    \ is valid and larger than largest, largest = right\n4 If largest != i\n5 Swap\
    \ i with largest\n6 Repeat\n```\n\n### Exercises\n\n1. Draw the max-heap that\
    \ results from inserting these sequences of elements into an initially empty heap:\n\
    \    1. (a) `37, 17, 81, 74, 95, 52, 8, 83, 41`\n    2. (b) `62, 13, 66, 36, 69,\
    \ 70, 39, 95, 51`\n    3. (c) `46, 78, 96, 74, 60, 99, 23, 29, 5`\n    4. (d)\
    \ `40, 60, 57, 82, 55, 4, 6, 97, 59`\n2. Draw the sequence of max-heaps that result\
    \ from calling `remove()` three times on the heaps from your answers to Exercise\
    \ 1.\n3. Explain why, when heapifying up, if a node is swapped with its parent,\
    \ there is no violation of the heap property because of the node’s sibling.\n\
    4. Implement insertion for max-heaps by writing these methods in the `MaxHeap`\
    \ class:\n    1. (a) `add()` Resize if the array is full.\n    2. (b) `heapifyUp()`\
    \ Implement `Listing 10.1`.\n5. Implement deletion for max-heaps by writing these\
    \ methods in the `MaxHeap` class:\n    1. (a) `remove()` Implement `Listing 10.2`.\
    \ Throw an exception if the heap is empty.\n    2. (b) `heapifyDown()` Implement\
    \ `Listing 10.3`.\n6. Repeat Exercises 4 and 5 with `MinHeap`.\n7. If your `heapifyUp()`\
    \ method from Exercise 4b is recursive, write a non-recursive version, or vice\
    \ versa. Is one version preferable?\n8. If your `heapifyDown()` method from Exercise\
    \ 5b is recursive, write a non-recursive version, or vice versa. Is one version\
    \ preferable?\n9. Write a `main()` method for the `MaxHeap` class to insert random\
    \ integers into a heap and then remove and print each item until the heap is empty.\n\
    10. Determine the `O()` performance of these private heap operations. Explain\
    \ your answers.\n    1. (a) `heapifyDown()`\n    2. (b) `heapifyUp()`\n11. Determine\
    \ the `O()` performance of these heap operations. Explain your answers.\n    1.\
    \ (a) `add()`\n    2. (b) `isEmpty()`\n    3. (c) `peek()`\n    4. (d) `remove()`\n\
    \    5. (e) `size()`\n12. Determine the `O()` performance for inserting `n` items\
    \ into an empty heap.\n\n## 10.3 Buildheap and Heapsort\n\nExercise 12 in the\
    \ last section explored the cost of inserting `n` items into an initially empty\
    \ heap. It turns out there is a faster way to build a heap if all `n` items are\
    \ available to begin with.\n\n### Buildheap\n\nThe `buildheap` algorithm is based\
    \ on the observation that if a node is above two heaps:\n\n![image](image/177x001.png)\n\
    \nthen calling `heapifyDown()` on the node results in a valid heap rooted at that\
    \ node. This is essentially what we did in the last section when heapifying down.\
    \ `buildheap` works from the bottom up. Because single nodes are valid heaps,\
    \ heapifying down from the bottom of the heap can be used to gradually combine\
    \ nodes into larger and larger heaps, until the entire tree is a heap.\n\n###\
    \ Example\n\nIt is easiest to see how `buildheap` works with an example. Given\
    \ the elements `31, 30, 36, 5, 72, 8, 76, 44` in an array, view the array in its\
    \ heap shape, and focus on the parent of the last item in the heap, with its children:\n\
    \n![image](image/177x002.png)\n\nConsidering just these three nodes, `5` is a\
    \ node above two heaps, so we can heapify down at `5` to create a small, local\
    \ heap:\n\n![image](image/177x003.png)\n\nBack in context, we then move one spot\
    \ in the array to repeat the same process with the next node:\n\n![image](image/178x001.png)\n\
    \nThis is also a node above two heaps, so continuing to `heapifyDown` and move\
    \ left in the array results in this sequence of trees, the last of which is a\
    \ finished heap:\n\n![image](image/178x002.png)\n\nAt each stage, because we are\
    \ working from the bottom up, the two subtrees must already be valid heaps. `Listing\
    \ 10.4` translates this process into pseudocode.\n\n### Listing 10.4: Buildheap\
    \ (Pseudocode)\n\n```\n1 For each node from the parent of the last node to the\
    \ root\n2 Heapify down\n```\n\n### Buildheap Performance\n\nThe `buildheap` algorithm\
    \ heapifies `n/2` times, and each `heapify` is `O(log n)`, so an initial estimate\
    \ of the work done is $O(\\frac{n}{2}\\log n) = O(n\\log n)$. However, most of\
    \ the heapifying is done on short trees near the bottom, and a more careful calculation\
    \ that takes this into account shows the worst-case performance of `buildheap`\
    \ is $O(n)$.\n\n### Heapsort\n\n`buildheap` gives a very fast (linear time) way\
    \ to take an array of items and organize them into a heap. And though a max-heap\
    \ puts large elements at the front of the array, it turns out this organization\
    \ leads to an efficient sorting algorithm called `heapsort`. After building the\
    \ heap, `heapsort` repeatedly removes the largest item from the heap. Implementing\
    \ the `swap` from Line 1 of `Listing 10.2` puts the largest item at the end of\
    \ the array, where it belongs in sorted order.\n\n### Example\n\nConsider using\
    \ `heapsort` on the array `38, 42, 24, 17, 81, 8, 78`. The first step runs `buildheap`\
    \ to produce this heap:\n\n![image](image/179x001.png)\n\nThen the first `remove()`\
    \ swaps `81` with `24` and calls `heapifyDown()` from the root:\n\n![image](image/179x002.png)\n\
    \nRemember that `81` is no longer in the heap because the size of the heap changed\
    \ before heapifying down—it stays in the array but not the heap. The next removal\
    \ swaps `78` and `8`, and then heapifies:\n\n![image](image/179x003.png)\n\nThis\
    \ continues until all of the elements have been removed from the heap into their\
    \ sorted position in the array:\n\n![image](image/179x004.png)\n\nLike `buildheap`,\
    \ the pseudocode for `heapsort` in `Listing 10.5` is surprisingly simple.\n\n\
    ### Listing 10.5: Heapsort (Pseudocode)\n\n```\n1 Buildheap\n2 While heap is not\
    \ empty\n3 Remove max\n```\n\n### Exercises\n\n1. Show the sequence of trees and\
    \ final heap that result from running `buildheap` on each of these initial arrays:\n\
    \    1. (a) `37, 17, 81, 74, 95, 52, 8, 83, 41`\n    2. (b) `62, 13, 66, 36, 69,\
    \ 70, 39, 95, 51`\n    3. (c) `46, 78, 96, 74, 60, 99, 23, 29, 5`\n    4. (d)\
    \ `40, 60, 57, 82, 55, 4, 6, 97, 59`\n2. Show the operation of `heapsort` on each\
    \ of these initial arrays. Show the work of `buildheap` as one step.\n    1. (a)\
    \ `99, 24, 15, 91, 25, 33, 28`\n    2. (b) `7, 65, 29, 10, 39, 59, 79`\n    3.\
    \ (c) `16, 93, 67, 80, 34, 75, 5`\n    4. (d) `19, 24, 87, 83, 25, 27, 38`\n3.\
    \ Explain why, given a node above two heaps as on page 177, one call to `heapifyDown()`\
    \ results in a valid heap.\n4. Explain in your own words how `heapsort` produces\
    \ a sorted list.\n"
