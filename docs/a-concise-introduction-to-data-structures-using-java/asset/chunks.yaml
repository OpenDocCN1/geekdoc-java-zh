  trans: "\n\n哈希表的目标是为任何元素提供接近 O(1) 的搜索和插入速度。这种对搜索的强调导致了一个新的接口，一种基于查找键的值的接口。\n\n###\
    \ 映射 (Maps)\n\n映射（Map）是一组键值对集合，其中每个键都关联一个值。同一个值可以与多个键关联，但关键在于，查找一个键会返回存储为该键的唯一值。映射也被称为关联映射、关联数组、字典或查找表。\n\
    \n`Map` 抽象数据类型（ADT）在表 11.1 中的两个主要操作是 `put()` 和 `get()`。由于从哈希表中删除元素的操作可能可能是复杂的，因此在映射中\
    \ `remove()` 操作有时是可选的。\n\nJava 的惯例是使用类型参数 `K` 表示键类型，使用 `V` 表示值类型。键类型 `K` 应该是不可变的，以确保键在放入映射后不会发生变化。\n\
    \n### 链式映射 (Linked Map)\n\n链表提供了映射接口的一种简单实现，对于较小的键值对集合非常有用。`get()` 和 `containsKey()`\
    \ 操作会遍历链表直到找到键。`put()` 方法也需要遍历链表以检查该键是否已存在条目，如果没有，则可以将新条目插入到链表的头部。\n\n表 11.1\n\
    Map ADT\n\n| `boolean containsKey(K key)` 如果键在映射中有条目，则结果为真。 |\n| `V get(K key)`\
    \ 返回与键关联的值，如果没有则返回 null。 |\n| `boolean isEmpty()` 如果映射中没有键值对，则结果为真。 |\n| `V put(K\
    \ key, V value)` 在映射中将键与值关联。如果键已存在于映射中，则替换并返回旧值。对于新条目返回 null。 |\n| `V remove(K\
    \ key)` (可选) 移除映射中对应键的条目，返回关联的值，如果没有则返回 null。 |\n| `int size()` 映射中键值对的数量。 |\n\
    \n`LinkedMap<K, V>` 类的实现与我们写过的其他链表代码相似，但有一个细节不同：这些节点持有一个键值对。\n\n### 映射条目 (Map\
    \ Entries)\n\n由于映射持有键值对，创建一个私有的嵌套类 `Entry<T, U>` 来存储这些值对是有帮助的。然后节点声明为：\n\n```\n\
    Node<Entry<K, V>>\n```\n\n链式映射的结构如下：\n\n![image](img/186x001.png)\n\n### 练习题\n\
    \n1. 二分搜索树是实现 `Map` 接口的良好选择吗？说明为什么或为什么。\n2. 为表 11.1 中的 `Map` ADT 写一个泛型 Java 接口\
    \ `Map<K, V>`。\n3. 修改上一个练习中的 `Map` 接口以包含可选的 `remove()`。\n4. 显示在初始空链式映射 `m` 上执行这些操作的结果。给出每个非空操作的返回值，并画出最终的链表，如上所示其条目节点。\n\
    \    1. (a) `m.put(5, \"five\")`\n       `m.put(3, \"three\")`\n       `m.containsKey(2)`\n\
    \       `m.put(5, \"FIVE\")`\n       `m.put(2, \"two\")`\n       `m.get(5)`\n\
    \       `m.put(1, \"one\")`\n       `m.size()`\n    2. (b) `m.put(1, \"one\")`\n\
    \       `m.put(2, \"two\")`\n       `m.put(2, \"Two\")`\n       `m.put(2, \"TWO\"\
    )`\n       `m.containsKey(2)`\n       `m.put(3, \"three\")`\n       `m.get(2)`\n\
    \       `m.size()`\n5. 基于链表开发 `Map` 接口的 `LinkedMap<K, V>` 实现。包含以下成员：\n    1. (a)\
    \ `Entry<T, U>`\n    2. (b) `Node<T>`\n    3. (c) `containsKey()`\n    4. (d)\
    \ `get()`\n    5. (e) `isEmpty()`\n    6. (f) `put()`\n    7. (g) `size()`\n6.\
    \ 为 `LinkedMap` 类写一个 `main()` 方法，创建一个链式映射，向映射中放入一些值并查找它们。\n7. 确定这些 `LinkedMap`\
    \ 操作的 `O()` 性能：\n    1. (a) `containsKey()`\n    2. (b) `get()`\n    3. (c) `isEmpty()`\n\
    \    4. (d) `put()`\n    5. (e) `size()`\n8. 在 `LinkedMap` 类中实现可选的 `remove()`\
    \ 方法。最简单的方法是在遍历时保留一个指向 `p` 之前节点的 `prev` 指针。\n\n## 11.2 哈希表 (Hash Tables)\n\n在描述哈希表之前，我们简要考虑一种有时有用的简单替代方案。在这种背景下，表（table）只是数组的另一种术语。\n\
    \n### 直接寻址 (Direct Addressing)\n\n获取映射的 O(1) 搜索和插入的最简单方法是如果键是较小的非负整数。这时可以使用直接寻址，其中表使用整数存储值。\n\
    \n### 哈表 (Hash Tables)\n\n假设需要存储大约 2000 条记录，且每个记录是一个四位数整数，直接寻址是合理的。但如果键是九位数整数，直接寻址是不行的。哈表通过哈希函数映射到索引：\n\
    \n![image](img/188x001.png)\n\n冲突 (Collisions)\n\n当然，如果可能键的数量大于哈表的大小，冲突（即哈希函数将不同的键映射到相同的索引）是不可避免的。\n\
    \n![image](img/189x001.png)\n\n我们将查看两种冲突解决策略：11.3 中的链法和 11.4 中的线性探测。我们首先考虑如何定义哈希函数。\n\
    \n### 哈希函数 (Hash Functions)\n\n哈希函数的主要任务是将键均匀地分布到索引中，这样例如，大多数键不会聚集。这个名字源于此目的；哈希函数还应该是快速的且能利用键的所有方面。\n\
    \n### 整数键 (Integer Keys)\n\n在大小为 `M` 的表中，有效的数组索引为 `0, ..., M-1`，因此整数键的最自然哈希函数是取模函数：\n\
    \n`f(k) = k mod M`\n\n在 Java 中，可以使用余数函数 `% M` 取模，只要 `k` 不是负的。这种区别对于哈希很重要：如果 `k`\
    \ 为负数，Java 的余数可能是负的。（例如，`-1 % 3` 为 `-1`）。此外，表的大小 `M` 的选择应该使得键的每个位都被使用。例如，如果 `M\
    \ = 2^m`，则使用键的最后位计算 `k % M`。\n\n### 字符串和对象键 (String and Object Keys)\n\n映射键并不总是整数，事实上通常是字符串。字符串中的每个字符可以通过其\
    \ ASCII 值视为整数。例如，“scrape”单词中字符的 ASCII 值为：\n\n| s | c | r | a | p | e |\n| 115\
    \ | 99 | 114 | 97 | 112 | 101 |\n\n将这些值相加得到单个整数似乎是合理的，但会导致“scrape”的变位词（如“parsec”）映射到相同的值。这应该被避免，因为良好的哈希函数应该考虑字母的顺序，而不仅仅是出现了字母。\n\
    \nJava 使用的技巧是将 ASCII 值视为类似于基 31 的整数：\n\n$\\begin{array}{l} \\begin{array}{ll}\
    \ & {\\frac{115}{31^{5}}\\frac{99}{31^{4}}\\frac{114}{31^{3}}\\frac{97}{31^{2}}\\\
    frac{112}{31}\\frac{101}{1}} \\\\ = {115 \\cdot 31^{5} + 99 \\cdot 31^{4} + 114\
    \ \\cdot 31^{3} + 97 \\cdot 31^{2} + 112 \\cdot 31 + 101} \\end{array} \\\\ \\\
    begin{array}{ll} = & 3387273908 \\end{array} \\end{array}$\n\n这种方法考虑了键中字符的顺序，尽管它确实产生了非常大的值。选择\
    \ 31 作为一个小的素数是某种任意的。\n\n"
- fmt: "\nThe same idea can be used to combine the hash values of multiple fields\
    \ in an object.\n\n### Java Hashcodes\n\nThe Java `hashCode()` method implements\
    \ this algorithm for the `String` type. A minimal `hashCode()` definition is also\
    \ provided in the `Object` class, with the intention that it be overridden if\
    \ desired.\n\nUnfortunately, the `hashCode()` method does not always produce valid\
    \ table indices. For example,\n\n```\n\"scrape\".hashCode()\n```\n\nreturns −907693388.\
    \ Why? Because the return type of `hashCode()` is `int`, and the maximum value\
    \ of an `int` is $2^{31}-1$, which is smaller than the hashcode of “scrape” computed\
    \ above:\n\n$2^{31}-1 = 2,147,483,647 < 3,387,273,908$\n\nTherefore, the computation\
    \ overflows, in this case to a negative value.\n\nThe result is that Java hashcodes\
    \ must be forced nonnegative before using them as table indices. A reliable way\
    \ to do this is to set the first bit to 0:\n\n```\nkey.hashCode() & Integer.MAX_VALUE\n\
    ```\n\nThe bitwise `&` operator computes the bit-by-bit logical AND of the two\
    \ values; a single `|` is used for bitwise OR.\n\n### Exercises\n\n1. For each\
    \ of these contexts, decide whether direct addressing or hashing is likely to\
    \ be more appropriate. Explain your answers.\n    1. (a) About 500 records, each\
    \ with a 3-digit unique id.\n    2. (b) About 1000 records, each with an 8-digit\
    \ unique id.\n2. Make a table of values of `k` and `k % 8` in both decimal and\
    \ binary to help explain why using remainder with $M = 2^m$ only uses the last\
    \ $m$ bits of the key. Choose your own values for `k`.\n3. Give an example of\
    \ two keys that collide using the hash function\n   $f(k) = k \\bmod 97$\n4. Give\
    \ an example of two keys that collide using the hash function\n   $f(k) = k \\\
    bmod 239$\n5. Calculate the Java `hashCode()` of each of these strings by hand:\n\
    \    1. (a) \"Java\"\n    2. (b) \"table\"\n    3. (c) \"data\"\n    4. (d) \"\
    Data\"\n6. Suppose student registration data will be stored in a hash table, where\
    \ each registration entry is identified by a numeric student id, a string `departmentName`,\
    \ and a numeric `courseNumber`. Design a `hashCode()` for the registrations.\n\
    7. Suppose a calendar date is stored as three integers: `day`, `month`, and `year`.\
    \ Design a `hashCode()` for this date type.\n8. Explain what exactly happens in\
    \ this bitwise operation for a 32-bit integer `k`:\n   ```\nk & Integer.MAX_VALUE\n\
    \   ```\n9. Explain why `Math.abs()` returns a negative value (see the footnote\
    \ on page 191). You may need to do some research on integer representations.\n\
    \n### 11.3 Chaining\n\nCollisions are inevitable when hashing, and one way to\
    \ resolve collisions is to put all of the items that hash to the same index in\
    \ a linked list. This method of resolving collisions is called chaining, and each\
    \ linked list is referred to as a chain.\n\n### Implementation\n\nA natural way\
    \ to approach writing a `LinkedHashMap` implementation of a hash table with chaining\
    \ is to write the linked list code from scratch, as we have before. However, we’ve\
    \ already done this work in Section 11.1 by writing the `LinkedMap` class. So\
    \ a better idea is to just have a linked map at each index of the hash table:\n\
    \nThen each linked map is responsible for the chain at its index.\n\nWith this\
    \ structure, the basic idea for each method in the `LinkedHashMap` class is the\
    \ same:\n\n1. Use the hash function to compute an index in the hash table.\n2.\
    \ Call the corresponding method on the linked map at that index.\n\nFew complications\
    \ arise implementing this strategy. The one that may need explanation involves\
    \ generic arrays.\n\n### Generic Arrays Revisited\n\nIf each array index stores\
    \ a reference to a linked map, the table declaration in `LinkedHashMap` will need\
    \ to be something like this:\n\n```\nprivate LinkedMap<K, V>[] table;\n```\n\n\
    As we found with creating arrays for comparable types on page 170, the `Object`\
    \ class cannot be used to create this generic array. Instead, the `LinkedMap`\
    \ type must be used and then cast to the generic type:\n\n```\ntable = (LinkedMap<K,\
    \ V>[]) new LinkedMap[M];\n```\n\nThe `Object` type only works for the plain `E[]`\
    \ arrays we began with:\n\n```\ndata = (E[]) new Object[capacity];\n```\n\nAny\
    \ more specific (yet generic) type like `LinkedMap<K, V>` requires using the corresponding\
    \ non-generic `LinkedMap` type to create the array.\n\n### Performance\n\nThe\
    \ linear performance of `put()` and `get()` in a linked map may not have seemed\
    \ very promising in Section 11.1. However, as chains in a hash table, they are\
    \ impressive because we can control the length of the chains.\n\nThe key to determining\
    \ the performance of a hash table is its load factor\n$\\lambda = \\frac{n}{M}$\n\
    where $n$ is the number of items and $M$ is the table size.\n\n### Space-Time\
    \ Tradeoff\n\nA hash table is a perfect example of which you can buy faster performance\
    \ with more space: a larger table size $M$ gives a smaller $\\lambda$.\n\n###\
    \ Deletion\n\nDeleting from a hash table using chaining is routine: it just involves\
    \ removing a node from the appropriate list.\n\n### Exercises\n\n1. For each of\
    \ these contexts, decide whether direct addressing or hashing is likely to be\
    \ more appropriate. Explain your answers.\n    1. (a) About 500 records, each\
    \ with a 3-digit unique id.\n    2. (b) About 1000 records, each with an 8-digit\
    \ unique id.\n2. Make a table of values of `k` and `k % 8` in both decimal and\
    \ binary to help explain why using remainder with $M = 2^m$ only uses the last\
    \ $m$ bits of the key. Choose your own values for `k`.\n3. Give an example of\
    \ two keys that collide using the hash function\n   $f(k) = k \\bmod 97$\n4. Give\
    \ an example of two keys that collide using the hash function\n   $f(k) = k \\\
    bmod 239$\n5. Calculate the Java `hashCode()` of each of these strings by hand:\n\
    \    1. (a) \"Java\"\n    2. (b) \"table\"\n    3. (c) \"data\"\n    4. (d) \"\
    Data\"\n6. Suppose student registration data will be stored in a hash table, where\
    \ each registration entry is identified by a numeric student id, a string `departmentName`,\
    \ and a numeric `courseNumber`. Design a `hashCode()` for the registrations.\n\
    7. Suppose a calendar date is stored as three integers: `day`, `month`, and `year`.\
    \ Design a `hashCode()` for this date type.\n8. Explain what exactly happens in\
    \ this bitwise operation for a 32-bit integer `k`:\n   ```\nk & Integer.MAX_VALUE\n\
    \   ```\n9. Explain why `Math.abs()` returns a negative value (see the footnote\
    \ on page 191). You may need to do some research on integer representations.\n\
    \n3. Is a load factor $\\lambda > 1$ possible if chaining is used to resolve collisions?\
    \ Explain why or why not.\n4. Develop a `LinkedHashMap<K, V>` implementation of\
    \ the Map interface interface that uses chaining to resolve collisions. Use a\
    \ `LinkedMap` to store each chain. Include these members:\n    1. (a) Constructors\
    \ Default constructor and a second that takes a table size parameter.\n    2.\
    \ (b) `hash(key)` Private method to compute the hash function.\n    3. (c) `containsKey()`\n\
    \    4. (d) `get()`\n    5. (e) `isEmpty()`\n    6. (f) `put()`\n    7. (g) `size()`\n\
    5. Write a `main()` method for the `LinkedHashMap` class that creates a hash table\
    \ using chains, puts some values in the table, and looks them up.\n6. Explain\
    \ why the worst-case performance for inserting and searching in a hash table using\
    \ chaining is O(n).\n"
  raw: "The same idea can be used to combine the hash values of multiple fields in\
    \ an object.\n\n### Java Hashcodes\n\nThe Java hashCode() method implements this\
    \ algorithm for the String type. A minimal hashCode() definition is also provided\
    \ in the Object class, with the intention that it be overridden[1](#K20431_C011.xhtml_f11_1)\
    \ if desired.\n\nUnfortunately, the hashCode() method does not always produce\
    \ valid table indices. For example,\n\n```\n \"scrape\".hashCode()\n```\n\nreturns\
    \ −907693388\\. Why? Because the return type of hashCode() is int, and the maximum\
    \ value of an int is 231 −1, which is smaller than the hashcode of “scrape” computed\
    \ above:\n\n231−1 = 2,147,483,647 < 3,387,273,908\n\nTherefore, the computation\
    \ overflows, in this case to a negative value.\n\nThe result is that Java hashcodes\
    \ must be forced nonnegative before using them as table indices. A reliable way[2](#K20431_C011.xhtml_f11_2)\
    \ to do this is to set the first bit to 0:\n\n```\nkey.hashCode() & Integer.MAX_VALUE\n\
    ```\n\nThe bitwise & operator computes the bit-by-bit logical AND of the two values;\
    \ a single | is used for bitwise OR.\n\nExercises\n\n1.  For each of these contexts,\
    \ decide whether direct addressing or hashing is likely to be more appropriate.\
    \ Explain your answers.\n\n    1.  (a) About 500 records, each with a 3-digit\
    \ unique id.\n\n    2.  (b) About 1000 records, each with an 8-digit unique id.\n\
    \n2.  Make a table of values of k and k % 8 in both decimal and binary to help\
    \ explain why using remainder with M = 2m only uses the last m bits of the key.\
    \ Choose your own values for k.\n\n3.  Give an example of two keys that collide\
    \ using the hash function\n\n    f(k) = k mod 97\n\n4.  Give an example of two\
    \ keys that collide using the hash function\n\n    f(k) = k mod 239\n\n5.  Calculate\
    \ the Java hashCode() of each of these strings by hand:\n\n    1.  (a) \"Java\"\
    \n\n    2.  (b) \"table\"\n\n    3.  (c) \"data\"\n\n    4.  (d) \"Data\"\n\n\
    6.  Suppose student registration data will be stored in a hash table, where each\
    \ registration entry is identified by a numeric student id, a string departmentName,\
    \ and a numeric courseNumber. Design a hashCode() for the registrations.\n\n7.\
    \  Suppose a calendar date is stored as three integers: day, month, and year.\
    \ Design a hashCode() for this date type.\n\n8.  Explain what exactly happens\
    \ in this bitwise operation for a 32-bit integer k:\n\n    ```\n    k & Integer.MAX_VALUE\n\
    \    ```\n\n9.  Explain why Math.abs() returns a negative value (see the footnote\
    \ on page 191). You may need to do some research on integer representations.\n\
    \n## 11.3 Chaining\n\nCollisions are inevitable when hashing, and one way to resolve\
    \ collisions is to put all of the items that hash to the same index in a linked\
    \ list. This method of resolving collisions is called chaining, and each linked\
    \ list is referred to as a chain.\n\n![image](image/192x001.png)\n\n### Implementation\n\
    \nA natural way to approach writing a LinkedHashMap implementation of a hash table\
    \ with chaining is to write the linked list code from scratch, as we have before.\
    \ However, we’ve already done this work in [Section 11.1](#K20431_C011.xhtml_ch11.1)\
    \ by writing the LinkedMap class. So a better idea is to just have a linked map\
    \ at each index of the hash table:\n\n![image](image/192x002.png)\n\nThen each\
    \ linked map is responsible for the chain at its index.\n\nWith this structure,\
    \ the basic idea for each method in the LinkedHashMap class is the same:\n\n1.\
    \  Use the hash function to compute an index in the hash table.\n\n2.  Call the\
    \ corresponding method on the linked map at that index.\n\nFew complications arise\
    \ implementing this strategy. The one that may need explanation involves generic\
    \ arrays.\n\n### Generic Arrays Revisited\n\nIf each array index stores a reference\
    \ to a linked map, the table declaration in LinkedHashMap will need to be something\
    \ like this:\n\n```\n private LinkedMap<K, V>[] table;\n```\n\nAs we found with\
    \ creating arrays for comparable types on page 170, the Object class cannot be\
    \ used to create this generic array. Instead, the LinkedMap type must be used\
    \ and then cast to the generic type:\n\n```\n table = (LinkedMap<K, V>[]) new\
    \ LinkedMap[M];\n```\n\nThe Object type only works for the plain E[] arrays we\
    \ began with:\n\ndata = (E[]) new Object[capacity];\n\nAny more specific (yet\
    \ generic) type like LinkedMap<K, V> requires using the corresponding non-generic\
    \ LinkedMap type to create the array.\n\n### Performance\n\nThe linear performance\
    \ of put() and get() in a linked map may not have seemed very promising in [Section\
    \ 11.1](#K20431_C011.xhtml_ch11.1). However, as chains in a hash table, they are\
    \ impressive because we can control the length of the chains.\n\nThe key to determining\
    \ the performance of a hash table is its load factor\n\n$\\lambda = \\frac{n}{M}$\n\
    \nwhere n is the number of items stored in the hash table and M is the table size.\
    \ The important fact about the load factor with chaining is this:\n\n> If the\
    \ hash function distributes keys uniformly between 0 and M − 1, then the average\
    \ length of each chain is approximately λ.\n\nThis principle leads to the following\
    \ analysis:\n\nUnsuccessful Search To search for a key that is not in the table,\
    \ it takes one step to compute the hash function, and then λ steps to check every\
    \ item in that chain. Thus, the expected number of steps is O(1 + λ).\n\nSuccessful\
    \ Search A successful search is similar to an unsuccessful one, except that on\
    \ average, 3 it will only take λ/2 steps to walk down the chain to find the item.\
    \ Therefore, in this case, the expected number of steps $O(1 + \\frac{\\lambda}{\\\
    text{2}}) = O(1 + \\lambda)$.\n\nInsert Insertion in a map requires checking first\
    \ to see if the key is already present, so the expected performance of insertion\
    \ is the same as an unsuccessful search, O(1 + λ).\n\nKeep in mind that these\
    \ values are expected, based on the ability of the hash function to equally distribute\
    \ keys. The worst case for each of these operations is O(n).\n\n### Space-Time\
    \ Tradeoff\n\nA hash table is a perfect example of a data structure for which\
    \ you can buy faster performance with more space: a larger table size M gives\
    \ a smaller λ and therefore better performance. However, the value of M should\
    \ be chosen carefully, because if M is much larger than n, most of the array will\
    \ be wasted storing empty chains.\n\n### Deletion\n\nDeleting from a hash table\
    \ using chaining is routine: it just involves removing a node from the appropriate\
    \ linked list.\n\nExercises\n\n1.  Show the results of inserting the sequence\
    \ of keys below into a hash table of size M = 11 if collisions are resolved by\
