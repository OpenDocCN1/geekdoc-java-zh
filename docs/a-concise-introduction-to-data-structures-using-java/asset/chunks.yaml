    \ to check for parentheses:\n\n    ```\n     if left paren, push onto stack\n\
    \    ```\n\n    ```\n     if right paren\n    ```\n\n    ```\n     pop and copy\
    \ operators to output until left paren\n    ```\n\n    ```\n     pop the left\
    \ paren\n    ```\n\n    Do not copy any parentheses to the output, and put spaces\
    \ around parentheses in infix expressions so they are seen as separate tokens.\n\
    \n7.  Write an applyOperator(operator, op1, op2) method that takes an operator\
    \ with two operands and returns the value of the binary computation. For example,\n\
    \n    ```\n     applyOperator(\"*\", 3, 7)\n    ```\n\n    should return 21\\\
    . Use a switch statement, and assume all operands are integers.\n\n8.  Write the\
    \ evalPostfix() method for the Expression class. Use the applyOperator() method\
    \ from Exercise 7.\n\n9.  Modify Exercise 8 to perform exponentiation, using Math.pow()\
    \ to do the calculation. You will need to cast the result back to an int.\n\n\
    10.  Using Exercise 8, write an eval() method for the Expression class that evaluates\
    \ an infix expression by first converting it to postfix and then evaluating the\
    \ postfix. For example,\n\n    ```\n     eval(\"1 + 2 * 3\")\n    ```\n\n    should\
    \ return 7.\n\n11.  A stack can be used to determine whether or not an algebraic\
    \ expression has properly balanced parentheses. For example,\n\n    | Balanced\
    \ | Not Balanced |\n\n    | --- | --- |\n\n    | (x + y * (z − w)) | (x + y *\
    \ (z − w) |\n\n    | ((x + (y)) * (z − w)) | x + y * (z − w)) |\n\n    The idea\
    \ is to scan each character in the expression, and if the character is a left\
    \ parenthesis, push it on the stack. If it is a right parenthesis, then there\
    \ should be a corresponding left parenthesis on the stack to pop. All other characters\
    \ can be ignored.\n\n    1.  (a) Write the algorithm idea as pseudocode that returns\
    \ true if the expression is balanced and false otherwise.\n\n    2.  (b) Implement\
    \ the parenthesis matching algorithm as a method in the Expression class.\n\n\
    \    3.  (c) Extend the previous exercise to write a different method in the Expression\
    \ class that checks parentheses (), square brackets [], and braces {}. Note that\
    \ different types of parentheses need to be properly nested: for example, (x +\
    \ y * [z − w]) is nested correctly, but (x + y * [z − w)] is not.\n\n[1](#K20431_C004.xhtml_ich3fn1)The\
    \ reasons are subtle; see Puzzle 89 from Bloch and Gafter [[5]](#K20431_bib.xhtml_ref_5).\n\
    \nChapter 5\n\n# Queues\n\n## 5.1 Interface and Linked Implementation"
