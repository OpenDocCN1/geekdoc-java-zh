    \n5.  Add binarySearch() from [Listing 2.3](#K20431_C002.xhtml_lis2.3) to the\
    \ ArrayFunctions class, and write code in main() to call binary search on a short,\
    \ sorted array of integers. Use an array initializer.\n\n6.  Test binarySearch()\
