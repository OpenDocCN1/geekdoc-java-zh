    \n```\n21 }\n```\n\n```\n22}\n```\n\n```\n23}\n```\n\nThus, every time you access\
    \ a field or method using dot notation such as\n\n![image](image/f0061-01.png)\n\
    \nask yourself how you know for sure that the reference is not null.\n\nExercises\n\
    \n1.  Look again at Exercise 1 from [Section 3.1](#K20431_C003.xhtml_ch3.1). Do\
    \ your answers to it depend on whether the list uses an array or a linked implementation?\
    \ Explain why or why not.\n\n2.  Draw a linked list containing the elements {5,\
    \ 10, 4, 8}.\n\n3.  Draw the linked list that results from running this segment\
    \ of code:\n\n    ```\n     Node head = new Node(1, null);\n    ```\n\n    ```\n\
    \     head = new Node(2, head);\n    ```\n\n    ```\n     head = new Node(3, head);\n\
    \    ```\n\n4.  Write Java statements using nodes, not stack operations, to create\
    \ a linked list with contents {7, 4, 18}.\n\n5.  Suppose p references the last\
    \ node in a linked list, so that p.next is null. Which of the following references\
    \ (if any) will generate a null pointer exception? Explain your answers.\n\n \
    \   1.  (a) p\n\n    2.  (b) p.next\n\n    3.  (c) p.next.next\n\n6.  Modify [Listing\
    \ 3.4](#K20431_C003.xhtml_lis3.4) so that it contains the same main() method as\
    \ [Listing 3.2](#K20431_C003.xhtml_lis3.2), with the constructor call replaced\
    \ by a call to IntLinkedStack(). Draw the contents of the linked list that results,\
    \ including s.top.\n\n7.  Explain why, as written in [Listing 3.4](#K20431_C003.xhtml_lis3.4),\
    \ trying to pop from an empty stack would cause a null pointer exception.\n\n\
    8.  Modify [Listing 3.4](#K20431_C003.xhtml_lis3.4) to throw an EmptyStackException\
    \ if pop() is called on an empty stack.\n\n9.  Finish the IntLinkedStack class\
    \ of [Listing 3.4](#K20431_C003.xhtml_lis3.4) by adding these methods from the\
    \ IntStack interface:\n\n    1.  (a) isEmpty()\n\n    2.  (b) peek() Throw an\
    \ exception if the stack is empty.\n\n    3.  (c) size() Add a size instance variable\
    \ and update it where necessary.\n\n10.  Modify the main() method of the IntLinkedStack\
    \ class to:\n\n    1.  (a) Pop and print each item in the stack until it is empty.\n\
    \n    2.  (b) Push and pop a large number of items.\n\n    3.  (c) Test the peek()\
    \ method.\n\n    4.  (d) Test the size() method.\n\n    5.  (e) Test the isEmpty()\
    \ method.\n\n11.  Explain why a constructor with a capacity parameter (as described\
    \ for the IntArrayStack class in Exercise 10 of [Section 3.2](#K20431_C003.xhtml_ch3.2))\
    \ is not appropriate for the IntLinkedStack class.\n\n12.  Explain why each of\
    \ these IntLinkedStack methods is O(1):\n\n    1.  (a) isEmpty()\n\n    2.  (b)\
    \ peek()\n\n    3.  (c) pop()\n\n    4.  (d) push()\n\n    5.  (e) size() Is the\
    \ performance the same if there is no size instance variable? Explain.\n\nChapter\
    \ 4\n\n# Generic Stacks\n\nThe previous chapter built an interface and two implementations\
    \ for an integer stack. Suppose now that we need a stack to hold strings. (We\
    \ are about to need one, in fact, in [Section 4.4](#K20431_C004.xhtml_ch4.4).)\
    \ With copy-paste and some careful editing, we could create a StringStack interface\
    \ and two corresponding string implementations. But then what if we need a stack\
    \ to hold some other type? You can see the problem: continuing to write new classes\
    \ and interfaces for every element type creates a lot of code that is essentially\
    \ the same. What we need is a type variable, so that each time we make a new stack,\
    \ we can specify the type that will be stored in it. This is known as generic\
    \ programming.\n\n## 4.1 Generic Types\n\n### Type Parameters\n\nA generic type\
    \ (interface or class) is defined by including one or more type parameters in\
    \ angle brackets at the end of the name of the interface or class:"
