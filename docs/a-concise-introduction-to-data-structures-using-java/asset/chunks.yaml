    \ 20, 18\n\n    3.  (c) 28, 32, 13, 78, 86, 98, 20, 57, 68, 83\n\n    4.  (d)\
    \ 47, 69, 67, 13, 20, 26, 34, 41, 56, 63\n\n2.  Show the results of inserting\
    \ the sequence of keys below into a hash table of size M = 13 if collisions are\
    \ resolved by chaining. Insert new items at the front of each chain.\n\n    1.\
    \  (a) 59, 35, 73, 10, 39, 83, 46, 72, 34, 54\n\n    2.  (b) 70, 8, 52, 95, 33,\
    \ 99, 96, 44, 20, 18\n\n    3.  (c) 28, 32, 13, 78, 86, 98, 20, 57, 68, 83\n\n\
    \    4.  (d) 47, 69, 67, 13, 20, 26, 34, 41, 56, 63\n\n3.  Is a load factor λ\
    \ > 1 possible if chaining is used to resolve collisions? Explain why or why not.\n\
    \n4.  Develop a LinkedHashMap<K, V> implementation of the Map interface that uses\
    \ chaining to resolve collisions. Use a LinkedMap to store each chain. Include\
    \ these members:\n\n    1.  (a) Constructors Default constructor and a second\
    \ that takes a table size parameter.\n\n    2.  (b) hash(key) Private method to\
    \ compute the hash function.\n\n    3.  (c) containsKey()\n\n    4.  (d) get()\n\
    \n    5.  (e) isEmpty()\n\n    6.  (f) put()\n\n    7.  (g) size()\n\n5.  Write\
    \ a main() method for the LinkedHashMap class that creates a hash table using\
    \ chains, puts some values in the table, and looks them up.\n\n6.  Explain why\
    \ the worst-case performance for inserting and searching in a hash table using\
    \ chaining is O(n)."
