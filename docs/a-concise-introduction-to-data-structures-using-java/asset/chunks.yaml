  trans: "\n在本章的开始处，我们表达了能够提供快速搜索、插入和删除功能的数据结构的目标。为了观察二叉搜索树的性能如何，回顾几个更简单的替代方案将会有帮助。下表显示了搜索的单条条目，因为成功搜索和失败搜索都表现出相似的\
    \ `O()`  性能，但请记住，在其他情况下，它们可能会有所不同。\n\n### 无序列表\n\n无序列表可以用数组或链表实现。两者都表现出相似的最坏情况性能特征：\n\
    \n|  | 搜索 | 插入 | 删除 |\n| --- | --- | --- | --- |\n| 无序数组 | `O(n)` | `O(1)` | `O(n)`\
    \ |\n| 无序链表 | `O(n)` | `O(1)` | `O(n)` |\n\n### 排序列表\n\n排序列表在搜索方面可能比无序列表具有潜在的优势。然而，这种优势仅适用于数组，而且即使如此，它也是以插入变慢为代价的：\n\
    \n|   | 搜索 | 插入 | 删除 |\n| --- | --- | --- | --- |\n| 排序数组 | `O(log n)` | `O(n)`\
    \ | `O(n)` |\n| 排序链表 | `O(n)` | `O(n)` | `O(n)` |\n\n### 二叉搜索树\n\n我们目前为止对二叉搜索树的分析是基于树的高度\
    \ `h` 的。它们的通用性能为：\n\n|  | 搜索 | 插入 | 删除 |\n| --- | --- | --- | --- |\n| 二叉搜索树 |\
    \ `O(h)` | `O(h)` | `O(h)` |\n\n根据树中节点数量 `n` 来分析这些操作，需要从 `h` 转换为 `n`。`n` 和 `h`\
    \ 之间的基本关系是：\n\n`log n < h ≤ n`\n\n这种数值关系通过二叉搜索树可能具有的巨大形状差异在视觉上表现。考虑 `n = 7` 时的两种极端情况：\n\
    \n![image](img/164x001.png)\n\n因此，从 `n` 来说搜索、插入和删除的最坏情况性能看起来并不理想：\n\n|  | 搜索 |\
    \ 插入 | 删除 |\n| --- | --- | --- | --- |\n| 二叉搜索树（最坏情况） | `O(n)` | `O(n)` | `O(n)`\
    \ |\n\n最好情况要好得多：\n\n|  | 搜索 | 插入 | 删除 |\n| --- | --- | --- | --- |\n| 二叉搜索树（最好情况）\
    \ | `O(logn)` | `O(logn)` | `O(logn)` |\n\n但大多数时候我们应该对最好情况的性能保持怀疑态度。\n\n直觉上，大多数树会处于两者之间，但它们的性能（以及形状）会是什么样的？“平均”二叉搜索树的形状是什么样的？一种方法是考虑向空的二叉搜索树中添加随机元素。在这种情况下，`h`\
    \ 是 `O(log n)`（证明请参见 Cormen 等人的 [[6]](#K20431_bib.xhtml_ref_6)），因此我们可以预期随机数据具有这种性能：\n\
    \n|  | 搜索 | 插入 | 删除 |\n| --- | --- | --- | --- |\n| 二叉搜索树（随机） | `O(log n)` | `O(log\
    \ n)` | `O(log n)` |\n\n理解二叉搜索树的这一特征非常重要。它们的性能对于所有操作来说通常很快，`O(log n)`，但这个界限并不是保证的。唯一保证的是\
    \ `O(h)`，最坏情况仍然是 `O(n)`。平衡二叉搜索树使用各种技术来保证 `h` 是 `O(log n)`；红黑树的示例请参见 Cormen 等人的\
    \ [[6]](#K20431_bib.xhtml_ref_6)。\n\n### 练习\n\n1. 简要解释无序列表最坏情况性能的每个条目。\n2. 简要解释排序列表最坏情况性能的每个条目。\n\
    3. 解释为什么在任何二叉树中 `log n < h ≤ n`，其中 `h` 是树的高度，`n` 是树中的节点数。\n4. 无序和排序列表的平均情况性能比二叉搜索树更容易分析。\n\
    \    1. (a) 创建一个无序列表搜索、插入和删除的平均情况性能表格，并解释每个条目。\n    2. (b) 创建一个排序列表搜索、插入和删除的平均情况性能表格，并解释每个条目。\n\
    5. 画出所有 `n = 4` 个元素的 14 棵不同二叉搜索树，然后用它们来计算大小为四的二叉搜索树的平均高度。\n6. 在二叉搜索树中允许重复条目的简单方法是将\
    \ Listing 9.3 中的插入算法更改为向一个方向添加重复：\n\n```\nIf data < n.data\n```\n\n```\nInsert\
    \ on left\n```\n\n```\nElse\n```\n\n```\nInsert on right\n```\n    1. (a) 修改你的代码使用这种算法。\n\
    \    2. (b) 说明为什么这种策略对性能产生负影响。\n    3. (c) 概述另一种可以减少这种负影响的策略。\n    4. (d) 实现你的策略。\n\
    7. 当节点有两个孩子时，删除前驱节点而不是原始节点可能会随着时间的推移对性能产生负影响。\n    1. (a) 解释这种影响的原因。\n    2. (b)\
    \ 概述另一种可以减少这种负影响的删除策略。\n\n# 堆\n\n堆结构提供了快速的搜索、插入和删除。像二叉搜索树一样，堆是二叉树，但它们的高度总是 `logn`。\n\
    \n## 10.1 优先级队列接口和数组堆\n\n优先级队列和堆密切相关，因为堆通常被用作优先级队列的底层数据结构。\n\n优先级队列是一种根据优先级而不是像普通队列那样先入出的结构。优先级队列接口\n\
    \n如果你考虑学习过的其他数据结构（见练习 3），没有一个完全符合该接口。而堆工作得很好。\n\n### 堆数据结构\n\n实际上有两种类型的堆：最大堆和最小堆，因为优先级可以基于较大或较小的值。\n\
    \n最大堆是完全二叉树（稍后定义），其中每个元素的值大于或等于其孩子的值。\n\n表 10.1 优先级队列 ADT\n\n| void add(E item)将元素插入优先级队列。\
    \ |\n| boolean isEmpty()如果优先级队列没有元素则返回真。 |\n| E peek()返回最高优先级元素但不移除。 |\n| E remove()移除并返回最高优先级元素。\
    \ |\n| int size()优先级队列中的元素数量。 |\n\n最小堆是完全二叉树，其中每个元素的值小于或等于其孩子的值。\n\n这种父节点比孩子更大或更小的要求被称为堆属性。\n\
    \n堆属性最重要的结果是最大堆中的最大元素位于堆的顶部。同样，最小堆中的最小元素位于顶部。这使得在堆中找到最高优先级元素变得简单。\n\n### 完全二叉树\n\
    \n完全二叉树是一种二叉树，其中除了最后一层，每一层都有所有可能的节点，而在最后一层，节点从左侧开始填充。例如，左边的树是完全的，但右边的树不是：完全\n\n\
    ![image](img/168x001.png)\n\n以此方式定义“完全”的原因是它允许高效的数组实现。\n"
- fmt: "The idea is to store the complete tree at the beginning of the array, starting\
    \ with the root and moving down by levels. For example, in a heap of size 12,\
    \ there is this correspondence between tree locations and array indices: 0.\n\n\
    ![image](image/169x001.png)\n\nRequiring the tree to be complete is the same as\
    \ making sure there are no wasted gaps between elements in the array.\n\n## Example\n\
    \nHere is an example of a max-heap with ten elements: 98\n\n![image](image/169x002.png)\n\
    \nThere appears to be less organization than in a binary search tree, because,\
    \ for example, the left half of the heap has really no relationship with the right\
    \ half, except that both contain values less than the root. Stored in an array,\
    \ this heap looks like:\n\n![image](image/169x003.png)\n\n### Parents and Children\n\
    \nTo maintain the heap property, we often need to compare the values between parents\
    \ and their children. Thus, it is helpful to work out the relationship between\
    \ the array index of a node and those of its parent and children. Using the diagram\
    \ of indices above, for the node at index `i`:\n\n![image](image/169x004.png)\n\
    \nNicer formulas result if the heap starts at index 1, but that decision complicates\
    \ other code later.\n\n### Generic Arrays of Comparable Elements\n\nThe method\
    \ we have used to create generic arrays does not work if the type parameter `E`\
    \ extends the `Comparable` interface. The statement\n\n```\narrayRef = (E[]) new\
    \ Object[LENGTH];\n```\n\ncompiles, but if `E` is declared to extend `Comparable`:\n\
    \n```\n<E extends Comparable<? super E>>\n```\n\nthen the array creation fails\
    \ at runtime because the `Object` type is not guaranteed to implement `Comparable`.\n\
    \nThe solution is to create the array using `Comparable` instead of `Object`:\n\
    \n```\narrayRef = (E[]) new Comparable[LENGTH];\n```\n\nAn alternative that avoids\
    \ this problem is to declare the array to have type `Object[]` instead of `E[]`,\
    \ but then every array access must be cast to type `E`.\n\n## Exercises\n\n1.\
    \ Show the results of these operations on an initially empty integer priority\
    \ queue named `pq`. Give the return value of each non-void operation, and assume\
    \ that larger values have higher priority. Give the queue contents as a list sorted\
    \ largest to smallest.\n\n    - (a) `pq.add(5)`\n      `pq.add(8)`\n      `pq.peek()`\n\
    \      `pq.add(3)`\n      `pq.remove()`\n      `pq.add(10)`\n      `pq.size()`\n\
    \      `pq.add(4)`\n      `pq.remove()`\n      `pq.remove()`\n\n    - (b) `pq.add(10)`\n\
    \      `pq.add(20)`\n      `pq.add(30)`\n      `pq.add(40)`\n      `pq.peek()`\n\
    \      `pq.add(50)`\n      `pq.remove()`\n      `pq.size()`\n      `pq.remove()`\n\
    \      `pq.remove()`\n\n2. Write a generic Java interface `PriorityQueue<E>` for\
    \ the Priority Queue ADT in [Table 10.1](#K20431_C010.xhtml_Text_Anchor_tab10.1).\n\
    \n3. Determine the `O()` worst-case performance for the `add()` and `remove()`\
    \ methods in the Priority Queue interface if each of these data structures were\
    \ to be used for the underlying implementation:\n\n    - (a) Unsorted array\n\
    \    - (b) Unsorted linked list\n    - (c) Sorted array\n    - (d) Sorted linked\
    \ list\n    - (e) Binary search tree\n\n    Explain your answers.\n\n4. Explain\
    \ why the largest element in a max-heap is at the top.\n\n5. Explain why the smallest\
    \ element in a min-heap is at the top.\n\n6. Determine the index of the last element\
    \ in any heap.\n\n7. Explain why the height of a heap is `O(log n)`.\n\n8. Discuss\
    \ the difference in memory usage between node-based and array-based trees. Is\
    \ there an advantage one way or the other? Explain.\n\n9. Determine the parent,\
    \ left, and right relationships if the heap is stored beginning at index 1 instead\
    \ of 0.\n\n10. Begin the `MaxHeap<E>` class implementing `PriorityQueue<E>` by\
    \ declaring instance variables and writing these public methods:\n\n    - (a)\
    \ Constructor(s) Create arrays using Comparable instead of Object.\n    - (b)\
    \ `size()`\n    - (c) `isEmpty()`\n    - (d) `peek()` Throw a `NoSuchElementException`\
    \ if the heap is empty.\n    - (e) `toString()`\n\n    The other public methods\
    \ will be developed in the next section.\n\n11. Continue the previous exercise\
    \ by writing these private helper methods:\n\n    - (a) `resize()` Create arrays\
    \ using Comparable instead of Object.\n    - (b) `parent()`, `left()`, and `right()`\n\
    \    - (c) `swap(i, j)` Swaps elements at indices `i` and `j`.\n    - (d) `isValid(i)`\
    \ Returns true if `i` is a valid heap array index based on the current size of\
    \ the heap.\n    - (e) `isLarger(i, j)` Returns true if the item at index `i`\
    \ is strictly greater than the item at index `j` using `compareTo()`.\n\n12. Repeat\
    \ Exercises 10 and 11 to begin a `MinHeap<E>` implementation, replacing `isLarger()`\
    \ with `isSmaller()`.\n\n13. Consider the amount of duplicate code shared between\
    \ `MaxHeap` and `MinHeap`.\n\n--- Wait, the user provided the text to be paginated\
