  trans: "\n\n这减少了代码的重复，通常通过为最通用的构造函数编写完整代码，然后在更具体的构造函数中调用 `this()` 来实现。例如，在 Listing\
    \ 1.5 中，第一个构造函数是分数 `n/d` 的通用构造函数，而第二个构造函数在第 11 行调用 `this(n, 1)` 来为整数 `n = n/1`\
    \ 创建分数对象。\n\n### 实例方法与静态方法\n\n第 1.4 节描述的方法调用语法是调用实例方法的标准方式，实例方法始终从类的实例（即对象）进行调用：\n\
    \n```\nobject.method(arguments)\n```\n\n实例方法在类中没有特殊标记；换句话说，除非另有声明，否则所有方法都是实例方法。在\
    \ Listing 1.5 中，`addOn()` 和 `toString()` 方法都是实例方法。你可以看到第 35 行中 `addOn()` 方法使用了上述调用语法。在那里，`addOn()`\
    \ 方法在实例 `f1` 上被调用，通过向其添加 `f2` 来修改 `f1`。\n\n相反，静态方法不需要从任何对象调用。1 它们被视为类方法而非对象方法。事实上，你可以将“static”视为“class”（类）的同义词。使用\
    \ `static` 修饰符声明静态方法：\n\n```\nstatic returnType staticMethod(parameters) {...}\n\
    ```\n\n在其自身的类定义内部，可以通过直接提供方法名及其参数来调用静态方法：\n\n```\nstaticMethod(arguments)\n```\n\
    \n这种语法用于第 34 行对 `add()` 的调用，其中打印了 `f1` 和 `f2` 的和。\n\n比较 `add()` 和 `addOn()` 方法有助于理解实例方法和静态方法的区别：\n\
    \n`addOn()` 是实例方法，因此必须从特定的分数调用。它会修改被调用的分数。\n\n`add()` 是静态方法，它将两个给定的分数，并返回一个新的分数作为结果。\n\
    \n因为实例方法比静态方法常见，所以“method”（方法）一词通常指实例方法。\n\n### 从其他类调用静态方法\n\n来自其他类的静态方法通过在方法名前加上类名来调用：\n\
    \n```\nClassName.staticMethod(arguments)\n```\n\n### 实例字段与静态字段\n\n方法一样，也有实例字段和静态字段。实例字段或实例变量是指每个对象都有自己的独立存储的变量。实例字段没有特殊标记，因此再次，除非指定为\
    \ static，否则所有字段都是实例字段。因此，在 `Fraction` 类中：\n\n```\n private int num;\n```\n\n```\n\
    \ private int den;\n```\n\n`num` 和 `den` 都是实例变量，因此每个分数都存储自己的分子和分母。\n\n字段可以声明为\
    \ static，在这种情况下，整个类共享该字段的单一存储位置。由于此，静态字段可以被认为是类变量。静态字段的使用频率不如实例字段高，因此“field”（字段）一词通常指实例变量。\n\
    \n### toString() 方法\n\n任何类都可以提供 `toString()` 方法，以指示该类型的对象应如何转换为字符串。在 Listing 1.5\
    \ 中，`Fraction` 类的 `toString()` 方法返回字符串\n\n```\n num + \"/\" + den\n```\n\n编写 `toString()`\
    \ 方法的优势之一是当打印该类型的对象时，`System.out.println()` 会自动调用它。因此，例如当第 33 行打印 `f1` 时，它的输出将是“3/4”。\n\
    \n我们将在第 5.3 节中再次回顾 Listing 1.5 中使用的 `toString()` 方法和 `@Override` 注解。\n\n### 练习题\n\
    \n1. 给出 Listing 1.5 中每个方法的签名：\n    1. (a) `addOn()`\n    2. (b) `add()`\n    3.\
    \ (c) `toString()`\n    4. (d) `main()`\n2. 给出每个方法的签名：\n    1. (a) 来自 Listing\
    \ 1.1 的 `factorial()`\n    2. (b) 来自 Listing 1.2 的 `count()`\n    3. (c) 来自 Listing\
    \ 1.3 的 `linearSearch()`\n    4. (d) 来自 Listing 1.4 的 `acronym()`\n3. 解释为什么练习\
    \ 2 中列出的方法被声明为 static。\n4. Java 是否允许将 Listing 1.5 中的 `addOn()` 方法名更改为 `add()`？请解释原因。\n\
    5. 在 Listing 1.5 的 `main()` 中添加代码以完成以下任务：\n    1. (a) 声明并创建一个 5/8 的 `Fraction`。打印\
    \ `f` 的值。\n    2. (b) 声明并创建一个 17/3 的 `Fraction`。打印 `g` 的值。\n    3. (c) 声明并创建一个\
    \ `f + g` 的 `Fraction`。打印 `h` 的值。\n    4. (d) 声明并创建一个 5 的 `Fraction`。打印 `j` 的值。\n\
    \    5. (e) 将 `g` 的值增加 5。打印 `g` 的新值。\n6. 在 Listing 1.5 的 `Fraction` 类中添加这些方法。修改\
    \ `main()` 以测试你的函数：\n    1. (a) `subtract(f)` 从此分数减去 `f`。\n    2. (b) `multiplyBy(f)`\
    \ 将此分数乘以 `f`。\n    3. (c) `divideBy(f)` 将此分数除以 `f`。\n    4. (d) `addOn(n)` 为此分数加上整数\
    \ `n`。\n7. 在 Listing 1.5 的 `Fraction` 类中添加这些方法。修改 `main()` 以测试你的函数：\n    1. (a)\
    \ `subtract(f1, f2)` 计算 `f1 - f2`。\n    2. (b) `multiply(f1, f2)` 计算 `f1 * f2`。\n\
    \    3. (c) `divide(f1, f2)` 计算 `f1 / f2`。\n8. 为 Listing 1.5 的 `Fraction` 类编写一个\
    \ `reduce()` 方法，将该分数约化为最形式。假设所有项均为正并使用 `gcd()` 函数。\n9. 修改上练习中的 `reduce()` 方法以正确处理负分数。让构造函数确保所有分母均为正，从而使负分数具有负分子。如果需要绝对值，请使用\
    \ `Math.abs()` 库函数。在类的其他方法中必要的地方添加 `reduce()` 的调用。\n\n"
- fmt: "\n| 40 | 425 |\n| 80 | 825 |\n| 160 | 1625 |\n| 320 | 3225 |\n| 640 | 6425\
    \ |\n| 1280 | 12825 |\n| 2560 | 25625 |\n| 5120 | 51225 |\n| 10240 | 102425 |\n\
    \nIt appears that over the long run, algorithms `B` and `C` behave similarly,\
    \ and that algorithm `A` is faster than both of them.\n\nWe can extract these\
    \ principles from the table:\n\n**Focus on large `n`**: Algorithm `B` is fastest\
    \ for `n < 100`, but that is not a good indicator of its overall performance.\
    \ It is much slower than `A` for large `n`.\n\n**Focus on highest power**: The\
    \ columns for `n` and algorithm `A` grow very similarly, as do the columns for\
    \ `B` and `C`. What these pairs have in common is their highest power of `n`:\
    \ for `n` and `A` it is `n` itself; for `B` and `C` it is `n^2`.\n\n**Ignore other\
    \ detail**: Compare the growth of algorithms `B` and `C`. The coefficients and\
    \ smaller terms in `0.1n^2 + n + 28` do not create an important difference with\
    \ `n^2` itself.\n\nTo be realistic, the table should have continued for much larger\
    \ `n`, into the millions and tens of millions. You can imagine what that would\
    \ look like.\n\n### Big-O Notation\n\nBig-O notation captures this overall behavior\
    \ of an algorithm or mathematical function for large `n`. We say that `g(n)` is\
    \ `O(f(n))` if there is a constant `c` so that for all large `n`,\n\n```\ng(n)\
    \ <= c · f(n)\n```\n\nAn algorithm is considered `O(f(n))` if it takes `g(n)`\
    \ steps and `g(n)` is `O(f(n))`. However, rather than using this precise definition,\
    \ we will apply the principles derived above to focus on highest powers and ignore\
    \ other detail.\n\nFor example,\n\nAlgorithm `A` is `O(n)` because `10n+25` is\
    \ `O(n)`. The highest power is `n` and we ignore the coefficient `10` and lower\
    \ term.\n\nAlgorithm `B` is `O(n^2)` because `0.1n^2 + n + 28` is `O(n^2)`. The\
    \ highest power is `n^2` and we ignore the coefficient and both lower terms.\n\
    \nAlgorithm `C` is `O(n^2)` because `n^2` is itself `O(n^2)`.\n\nNotice how `O()`\
    \ captures the sense we had of which algorithms had the “same” performance.\n\n\
    Analyzing an algorithm’s running time using `O()` notation is known as studying\
    \ its time complexity, while space complexity describes memory requirements. Most\
    \ algorithms have one of the time complexities in [Table 2.1], ordered from fastest\
    \ to slowest.\n\n**Table 2.1: Common Time Complexities**\n\n| `O(1)` | Constant\
    \ |\n| `O(log n)` | Log |\n| `O(n)` | Linear |\n| `O(n log n)` | |\n| `O(n^2)`\
    \ | Quadratic |\n| `O(n^3)` | Cubic |\n\n### What to Count\n\nDepending on the\
    \ situation, someone analyzing an algorithm might count different things, such\
    \ as instructions, comparisons, or element swaps. We will generally think in terms\
    \ of instructions, but one of the benefits of using `O()` is that in the end,\
    \ our specific choice probably won’t affect the result.\n\n### Best, Worst, and\
    \ Average Case\n\nAlgorithms may perform very differently on different data sets.\
    \ Thus, we may be interested in any of these:\n\n- **Best-case performance** assumes\
    \ that the data is arranged in such a way that the algorithm performs optimally.\n\
    - **Worst-case performance** assumes that the data is arranged as badly as possible\
    \ for this particular algorithm.\n- **Average-case performance** averages over\
    \ all possible data sets.\n\nNormally, best-case performance is not very helpful\
    \ because it is more about luck than anything else.\n\nBecause of the inequality\
    \ in its official definition (`g(n) <= c f(n)`), big-O notation is ideally suited\
    \ for worst-case analysis. Saying that an algorithm is `O(n)` means that its performance\
    \ is no worse than linear.\n\n### Performance Measurement\n\nA useful counterpart\
    \ to determining time complexity is to measure an algorithm’s performance on an\
    \ actual machine. Performance measurement takes an empirical approach to the question\
    \ of algorithm performance by measuring the time it takes for code to execute\
    \ on a particular machine.\n\nExecution time can be measured in Java with the\
    \ `currentTimeMillis()` function given in [Table 2.2]. Because it is a static\
    \ method from another class (the `System` class), this method must be called with\
    \ a `System.` prefix (see page 30).\n\n**Table 2.2: System Timing**\n\n| `static\
    \ long currentTimeMillis()` |\n| Current time in milliseconds. |\n\nThe idea is\
    \ to check the time on a clock immediately before and immediately after running\
    \ the algorithm:\n\n```\nlong start = System.currentTimeMillis();\n```\n\n```\n\
    # execute algorithm here\n```\n\n```\nlong elapsed = System.currentTimeMillis()\
    \ - start;\n```\n\nBe careful to only time the algorithm in question. Given the\
    \ speed of current computers, it is common to loop over several executions and\
    \ then calculate the average time.\n\nAn advantage of this approach is that it\
    \ can be a reality check for an abstract analysis. If your analysis is correct,\
    \ then real performance times should confirm it. However, beware of machine factors\
    \ that may impact actual performance, especially caches.\n\nAn advantage of `O()`\
    \ analysis is that it does not depend on the particular compiler.\n\n### Exercises\n\
    \n1. Classify these mathematical functions according to `O()`:\n   - (a) `n`\n\
    \   - (b) `n^2`\n   - (c) `n^3`\n   - (d) `100`\n   - (e) `n^2`\n   - (f) `n log\
    \ n`\n   - (g) `n/2`\n\n2. Determine the O() performance of each segments of code:\n\
    \   - (a):\n     ```java\n     for (int i = 0; i < n; i++) {\n       count++;\n\
    \     }\n     ```\n   - (b):\n     ```java\n     for (int i = 0; i < 1000; i++)\
    \ {\n       count++;\n     }\n     ```\n   - (c):\n     ```java\n     for (int\
    \ i = 0; i < n; i++) {\n       for (int j = 0; j < n; j++) {\n         count++;\n\
    \       }\n     }\n     ```\n   - (d):\n     ```java\n     for (int i = 0; i <\
    \ n; i++) {\n       for (int j = i; j < n; j++) {\n         count++;\n       }\n\
    \     }\n     ```\n   - (e):\n     ```java\n     for (int i = 0; i < n; i++) {\n\
    \       for (int j = 0; j < 1000; j++) {\n         count++;\n       }\n     }\n\
    \     ```\n\n3. Explain what it means for an expression to be `O(1)`.\n4. Explain\
    \ what it means to say an array provides `O(1)` access to any element.\n5. Determine\
    \ the O() performance of the `factorial()` function in [Listing 1.1] in terms\
    \ of its parameter `n`.\n6. Determine the O() best-case, worst-case, and average\
    \ performance of the `linearSearch()` function in [Listing 1.3].\n7. Determine\
    \ the O() best-case, worst-case, and average performance of the `sum()` function\
    \ from Exercise 9.\n8. Determine the O() best-case, worst-case, and average performance\
    \ of the `max()` function from Exercise 10.\n9. Determine the O() best-case, worst-case,\
    \ and average performance of the `min()` function from Exercise 11.\n"
