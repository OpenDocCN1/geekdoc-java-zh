  trans: "\n\n```java\nfor (int i = 0; i < 100; i++) {\n    q.enqueue(i);\n}\nSystem.out.println(q.drops());\n\
    ```\n\n9. 使用继承，编写一个 `FixedLengthStack<E>` 类来表示一个固定大小的栈，当栈满时会丢弃入栈元素。包括对父类进行任何必要的更改。\n\
    \n## 项目：固定长度队列模拟\n\n对于固定长度队列，产生了一个自然的问题：在流量流量下，队列的大小有多重要？如果有很多项目被丢弃，是否值得投资一个更大的队列？如果是的话，需要多大？这个项目开发了一个模拟程序，以帮助回答这类问题。\n\
    \n### 模型\n\n想象一个通用的“处理器”，它有一个输入队列用于接收任务并处理任务，类似于 GPU 或网络路由器的阶段。每个任务都有一个给定的整数长度，表示在处理器上完成所需的时间。如果处理器正在忙于一个任务并接收到另一个任务，它将使用固定长度队列来存储等待的任务。一旦处理器完成一个任务，它就会开始处理队列中的下一个任务。没有可工作的处理器被认为是空闲的。\n\
    \n`Table 5.3` 列出了模拟处理器的一组公共方法。任务简单地用完成它们所需的整数时间来表示。\n\nTable 5.3: 模拟处理器\n\n| 方法\
    \ | 描述 |\n| :--- | :--- |\n| `void addTask(int taskTime)` | 接受给定长度的新任务。如果空闲，则该任务成为当前任务；否则，将任务添加到队列。\
    \ |\n| `int drops()` | 队列丢弃的项目数量。 |\n| `boolean free()` | 如果未在处理任务且队列为空，则为真。 |\n\
    | `void tick()` | 模拟一个时间步。如果忙碌，则对当前任务执行一个单位的工作。如果当前任务完成，则检查队列以寻找下一个开始的任务。 |\n\n\
    ### 基于时钟的模拟\n\n模拟通常使用整数计数器来模拟时钟，计数器的增加或减少对应于时钟的一次跳动（tick）。此处理器模拟将在特定时间内 `minTime`\
    \ 内随机生成新任务，然后继续运行直到所有任务完成。`Listing 5.3` 描述了使用时钟变量 `t` 组织模拟的一种方式。\n\nListing 5.3:\
    \ 基于时钟的模拟（伪代码）\n\n```\n1 t = 0\n2 while (t < minTime or processor is busy)\n3\
    \ if (t < minTime) 向向处理器随机添加新任务\n4 在处理器上模拟一个时间步\n5 t++\n```\n\n### 随机任务\n\n基于模拟的程序使用各种技术来生成随机事件序列。我们将使用以下简化模型来模拟处理器的随机任务序列：在模拟的每个时间步中，有\
    \ `taskChance`（在 0 和 1 之间）的概率创建一个新的随机任务。每个任务需要的处理时间为 1 到固定上限 `maxTaskTime` 之间的某个随机整数步数。`Listing\
    \ 5.4` 用伪代码概述了这一过程。\n\nListing 5.4: 生成随机任务（伪代码）\n\n```\n1 r = random double from\
    \ [0, 1)\n2 if (r < taskChance)\n3 taskTime = random int from 1 to maxTaskTime\n\
    4 将长度为 taskTime 的任务添加到处理器\n```\n\n### 练习题\n\n1. 编写一个 `Processor` 类来表示单个处理器，实现\
    \ `Table 5.3` 中的公共方法。`Processor` 构造函数应该接受一个指定其固定长度队列容量的参数。\n\n2. 编写一个 `QueueSimulator`\
    \ 类来驱动一个处理器的模拟。包含一个公共方法：\n\n```java\nvoid run(int queueLength, int minTime, int\
    \ maxTaskTime, double taskChance)\n```\n\n实现 `Listing 5.3`。它应该调用一个实现 `Listing\
    \ 5.4` 的独立方法。在 `run()` 方法结束时，显示处理的任务数、丢弃任务的百分比以及处理器完成所需的额外时间（超出 `minTime`）。考虑使用\
    \ `System.out.format()` 方法获得良好的输出。\n\n3. 使用上一个练习中的 `QueueSimulator` 来探索拥堵可以预测的情况，例如\
    \ `taskChance = 0.3` 且 `maxTaskTime = 10`。使用 `minTime = 10000` 和 5 到 500 之间的队列长度。根据模拟器讨论不同队列长度的影响。这符合你的预想吗？\n\
    \n[1] 保护成员也可以被同一包中的类访问，但本文没有使用命名包。\n\n[2] 重写 `equals()` 并不像看起来那么简单。参见 Bloch 的第\
    \ 8 和第 9 项。\n\n# 第 6 章：列表\n\n栈和队列作为线性结构的强大在于它们的访问限制。相反，列表提供了一个灵活的接口，允许在任何地方插入和删除。这种灵活性是有代价的：性能可能会受到。\n\
    \n## 6.1 接口\n\nList ADT 对数据的看法类似于数组：元素可以通过索引访问。\n\n### 索引\n\n将列表想象成动态的：它们存储在索引\
    \ 0 到元素数量减一的索引上。\n\n### List ADT\n\n栈和队列通过顶部（栈）或前端和尾部（队列）限制对其内容的访问。由于 List ADT\
    \ 允许在任何时间访问任何元素，某些列表方法会影响列表中其他项目的索引。`add()` 和 `removeAt()` 都会导致除添加或删除之外的元素位置发生变化。例如，如果列表包含\n\
    \n```\n5, 8, 2, 1, 4, 7\n```\n\n那么操作 `add(3, 6)` 会导致列表变为\n\n```\n5, 8, 2, 6, 1,\
    \ 4, 7\n```\n\n6 之后的元素现在的索引都与之前不同。同样，`removeAt(1)` 返回 8（位置 1 的项目）并修改列表为\n\n```\n\
    5, 2, 6, 1, 4, 7\n```\n\n再次记住，列表可能不是用数组实现的，因此可能没有实际移动。从 ADT 角度变化的是列表中某些元素的位置。虽然栈或队列\
    \ ADT 非常标准，列表抽象类型有很多变体并可能非常复杂。我们将使用 `Table 6.1` 中的方法。\n\nTable 6.1: List ADT\n\
    \n| 方法 | 描述 |\n| :--- | :--- |\n| `void add(E item)` | 将项目添加到末尾。 |\n| `void add(int\
    \ index, E item)` | 在索引处插入项目，向右移动元素以腾空间。如果 `index = size`，则将项目添加到末尾。 |\n| `E get(int\
    \ index)` | 返回索引处的元素。 |\n| `int indexOf(E item)` | 项目在列表中首次出现的索引，未找到则返回 -1。 |\n\
    | `boolean isEmpty()` | 如果列表为空，则为真。 |\n| `E removeAt(int index)` | 删除并返回索引处的项目，向左移动剩余元素。\
    \ |\n| `E set(int index, E item)` | 替换索引处的项目，返回旧值。 |\n| `int size()` | 列表中的元素数量。\
    \ |\n\n### 移动\n\n"
- fmt: "\nThe `List` ADT overloads the `add()` method since two versions are given.\
    \ Overloading is useful when more than one set of parameters may be convenient\
    \ for what is essentially the same method. In this case, adding an item to the\
    \ end of a list will likely be common, so it is given a simplified method call.\n\
    \n### Arrays and Lists\n\nIn a sense, a list is a more powerful array that will\
    \ grow as needed and shift elements for insertion and deletion. And because it’s\
    \ an ADT, a list can be implemented in a variety of ways to provide different\
    \ performance characteristics.\n\nIn fact, most Java programming is done with\
    \ lists from the `java.util` library rather than arrays. The reason we have been\
    \ using arrays is to study the low-level implementation details of different data\
    \ structures. Once you know how those structures work, implementations of the\
    \ `List` ADT are more powerful and convenient.\n\n### Exercises\n\n1.  Show the\
