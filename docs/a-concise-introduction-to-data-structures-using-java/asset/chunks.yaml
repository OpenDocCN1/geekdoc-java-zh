    \ not use top at all; all calculations should be done in terms of size.) Discuss\
    \ the tradeoffs between these two approaches.\n\n## 3.3 Linked Implementation\n\
    \nAlthough the array implementation may seem natural, it is not the only way to\
    \ build a stack. Think again about the reason we didn’t keep the top of the stack\
    \ at the front of the array implementation (pages 52–53): pushing and popping\
    \ required shifting elements in the array to either make room or close gaps. A\
    \ linked implementation allows us to insert or remove items at any location without\
    \ having to shift elements already in place. The tradeoff is that linked structures\
    \ lack the direct, indexed access to every item that arrays have.\n\n### Linked\
    \ Lists\n\nThe simplest linked structure is a linked list, a collection of nodes\
    \ in which each node points to the node that follows it. We will use nodes with\
    \ two fields: data to hold whatever it is we are storing in the list, and a next\
    \ reference that refers to the next node in the list:\n\n![image](image/f0057-01.png)\n\
    \nNodes link together to form a list:\n\n![image](image/f0057-02.png)\n\nA head\
    \ pointer is used to point to the front of the list, and the end of the list is\
    \ indicated by a node with a null reference in its next field.\n\n![image](image/f0058-01.png)\n\
    \nUsing a linked list to implement stacks will allow us to keep the top of the\
    \ stack at the front of the list, where it is easy to add and remove items without\
    \ having to move any of the other stack contents. Only a few references will need\
    \ to change.\n\n### Nodes"
