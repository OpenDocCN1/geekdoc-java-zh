    \ may override equals() to define their own notion of equality.[](#K20431_C005.xhtml_ch5fn2)2\
    \ The signature of an overridden method must not change, so this explains why\
    \ the String equals() method (see [Section 1.2](#K20431_C001.xhtml_ch1.2)) takes\
    \ an Object parameter instead of a String.\n\nThe Object implementation of toString()\
    \ returns the class name and the object’s hashcode (see [Section 11.2](#K20431_C011.xhtml_ch11.2))\
    \ in hexadecimal. When a class like the Fraction class in [Section 1.5](#K20431_C001.xhtml_ch1.5)\
    \ defines a toString() method, it is overriding the Object definition.\n\nFinally,\
    \ recall from [Section 4.2](#K20431_C004.xhtml_ch4.2) that the Object class was\
    \ used to create generic arrays, which were then cast to the type E[]. The reason\
    \ this works is that no matter what E is, it inherits from Object, and so an E\
    \ object “is a” Object.\n\nExercises\n\n1.  Use [Listing 5.2](#K20431_C005.xhtml_lis5.2)\
    \ to:\n\n    1.  (a) List the new instance variables (if any) in the FixedLengthQueue\n\
    \n        class.\n\n    2.  (b) List the new methods (if any) in the FixedLengthQueue\
    \ class.\n\n    3.  (c) List the methods (if any) from ArrayQueue that have been\
    \ overridden.\n\n2.  Describe the difference between overloading and overriding\
    \ a method in Java.\n\n3.  Explain why we chose to have FixedLengthQueue extend\
    \ ArrayQueue rather than LinkedQueue. Could extending LinkedQueue be made to work?\
    \ Explain why or why not.\n\n4.  Modify ArrayQueue to work with the FixedLengthQueue\
    \ class by making these changes:\n\n    1.  (a) Implement Exercise 5g from [Section\
    \ 5.2](#K20431_C005.xhtml_ch5.2) if you have not done so already to have an ArrayQueue\
    \ constructor with an integer capacity parameter.\n\n    2.  (b) Change the visibility\
    \ of size and capacity so they may be used by the subclass.\n\n5.  Decide whether\
    \ inheritance, composition, neither, or both seem appropriate for each of these\
    \ related classes. If inheritance fits, indicate the subclass and superclass;\
    \ if composition, indicate which object is the instance variable in the other\
    \ class. Explain your answers.\n\n    1.  (a) A Person class and an Employee class\
    \ in a human resources system.\n\n    2.  (b) An Employee class and a Department\
    \ class in a human resources system.\n\n    3.  (c) An Employee class and a Manager\
    \ class in a human resources system.\n\n    4.  (d) A Shape class and a Sphere\
    \ class in a graphics system.\n\n    5.  (e) A Cube class and a Sphere class in\
    \ a graphics system.\n\n6.  Add a main() method to the FixedLengthQueue<E> class\
    \ to test the queue with:\n\n    1.  (a) Integers\n\n    2.  (b) Doubles\n\n \
    \   3.  (c) Strings\n\n7.  Determine the O() time complexity of these FixedLengthQueue\
    \ operations. Explain your answers.\n\n    1.  (a) dequeue()\n\n    2.  (b) enqueue()\n\
    \n    3.  (c) isEmpty()\n\n    4.  (d) peek()\n\n    5.  (e) size()\n\n8.  Consider\
    \ the following code. Does it compile and run? If so, give the output; if not,\
    \ explain why not and how to fix it.\n\n    ```\n     Queue<Integer> q = new FixedLengthQueue<>(50);\n\
    \    ```"
