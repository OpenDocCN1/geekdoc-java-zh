    \    }\n    ```\n    2. (b)\n    ```java\n    for (int i = 0; i < n; i++) {\n\
    \        items.add(0, i);\n    }\n    ```\n\n## 6.4 Iterators\n\nExercise 10a\
    \ in [Section 6.3](#K20431_C006.xhtml_ch6.3) exposes an unexpected flaw of the\
    \ `LinkedList` implementation: even though traversing a linked list is efficient,\
    \ it becomes inefficient if we use `get()` in a `for`-loop. In other words, the\
    \ public interface of `LinkedList` provides no way to efficiently traverse the\
    \ list. Iterators allow us to rectify this problem and support Java’s enhanced\
    \ for-loop at the same time.\n\n### Iterators\n\nA Java iterator is an object\
    \ designed for iterating through the items of a collection. The `java.util.Iterator`\
    \ interface in [Table 6.2](#K20431_C006.xhtml_Text_Anchor_tab6.2) defines the\
    \ functionality of an iterator.\n\nTable 6.2: `java.util.Iterator` Interface\n\
    \n| Method | Description |\n| :--- | :--- |\n| `boolean hasNext()` | True if iterator\
    \ has another element. |\n| `E next()` | Returns next element and advances iterator.\
    \ |\n| `void remove()` | (Optional) Deletes last element returned by `next()`.\
    \ May only be called once per call to `next()`. |\n\nCode using an iterator should\
    \ call `hasNext()` before calling `next()` to be sure there is an element available.\
    \ If `next()` is called when `hasNext()` is false, a `java.util.NoSuchElementException`\
    \ is thrown. Iterators that do not support the `remove()` method must have the\
    \ `remove()` method throw an UnsupportedOperationException`.\n\n### Iterables\n\
    \nA collection that can provide an iterator is called iterable and implements\
    \ the `Iterable` interface in [Table 6.3](#K20431_C006.xhtml_Text_Anchor_tab6.3).\
    \ That means it provides a public `iterator()` method returning an object that\
    \ implements the `Iterator<E>` interface. This object is often defined by a private\
    \ inner class.\n\nTable 6.3: `Iterable` Interface\n\n| Method | Description |\n\
    | :--- | :--- |\n| `Iterator<E> iterator()` | Returns an iterator for this collection.\
    \ |\n\nThe terminology of iterables can be difficult to follow, especially at\
    \ first. Developing a specific iterator for linked lists will help.\n\n### Linked\
    \ List Iterator\n\nThe problem with repeatedly calling `get()` to traverse a linked\
    \ list is that `getNode()` has to start back over at the beginning of the list\
    \ every time. The linked list iterator will avoid this by remembering where it\
    \ is.\n\nThe iterator will be a separate object from the list, with a pointer\
    \ into the list. Single links are shown for simplicity.\n\n![image](image/119x001.png)\n\
    \nTo do this, the `LinkedListIterator` class will need one instance variable,\
    \ `next`, that is a reference to where the next item in the list is. Its methods\
    \ will be (see the interface in [Table 6.2](#K20431_C006.xhtml_Text_Anchor_tab6.2)).\n\
    \n`next()` will get the element to by `next`, move `next` to the next, and then\
    \ return the result. `hasNext()` will test that `next` is not null. [Listing 6.3](#K20431_C006.xhtml_lis6.3)\
    \ shows how to put these pieces together inside the `LinkedList` class.\n\nListing\
    \ 6.3: List Iterator\n\n```java\nimport java.util.Iterator;\n\npublic Iterator<E>\
    \ iterator() {\n    return new LinkedListIterator();\n}\n\nprivate class LinkedListIterator\
    \ implements Iterator<E> {\n    private Node<E> next = head.next; // skip dummy\n\
    \n    public boolean hasNext() {\n        return next != null;\n    }\n\n    public\
    \ E next() {\n        if (!hasNext()) throw new NoSuchElementException();\n  \
    \      E result = next.data;\n        next = next.next;\n        return result;\n\
    \    }\n\n    public void remove() {\n        throw new UnsupportedOperationException();\n\
    \    }\n}\n```\n\n### Privacy Issues\n\nIt might seem strange that the iterator\
    \ can have a pointer into the linked list like this. Part of what makes it work\
    \ is that the iterator class is nested inside the list class; in other words,\
    \ an outside class could not do this. The second thing to notice is that the iterator\
    \ class is also private, so the outside world can only access the iterator through\
    \ the public `iterator()` method. That method and the public interface of the\
    \ iterator itself tightly control how the iterator can be used.\n\nThere is also\
    \ a new mechanism being used here that gives the iterator access to the nodes\
    \ in the linked list: the iterator class is not static. It is our first example\
    \ of an inner class.\n\n### Inner Classes\n\nRecall from [Section 3.3](#K20431_C003.xhtml_ch3.3)\
    \ that our nested classes have been declared static because they do not need access\
    \ to any of the instance variables of their containing class. You may have noticed\
    \ that the nested class in [Listing 6.3](#K20431_C006.xhtml_lis6.3) is not static.\
    \ An inner class is a non-static nested class, and it does have access to the\
    \ instance variables of its containing object. In [Listing 6.3], the iterator\
    \ needs access to the head of the linked list, and so it must be an inner class\
    \ rather than a static nested class.\n\n### Extending Interfaces\n\nOne other\
    \ point will be useful for completing this implementation. Recall (see page 50)\
    \ that a class may implement more than one interface, so we might indicate that\
    \ `LinkedList` implements `Iterable` like this:\n\n```java\npublic class LinkedList<E>\
    \ implements List<E>, Iterable<E> ...\n```\n"
