  trans: "\n在本节中，我们将介绍两种可视化递归的技术，这些技术可以帮助你理解递归函数是如何工作的：调用树和调用栈。调用栈还将开始向你解释泛指函数调用是如何实现的。\n\
    \n## 递归调用树 (Recursive Call Trees)\n\n调用树图展示了由递归函数调用产生的一系列调用。它泛化了上一节中描述的追踪递归函数的思路，它不再追踪返回值或计算过程，而是只跟踪不同的函数调用。调用树通常是针对\
    \ `n` 画的，而不是追踪特定的值，以便理解函数的整体行为。调用树的目的通常是统计函数调用的总数。\n\n对于简单的递归函数，调用树是单一的链。例如，`factorial(n)`\
    \ 的树如下：\n\n![image](img/126x001.png)\n\n这表示对 `factorial(n)` 的递归调用生成了大约 `n` 次函数调用。\n\
    \n如果一个递归函数调用自己超过一次，就会形成一个调用树。例如，调用上一节练习 6 中的递归斐波那契函数 `fib(5)` 会生成这棵树：\n\n![image](img/127x001.png)\n\
    \n## 分析递归函数 (Analyzing Recursive Functions)\n\n调用树为递归函数的时间复杂度提供了一些直观感受：例如，在斐波那契函数的情况下，大量的调用意味着大量的工作量！\n\
    \n在简单的情况下，如果每个函数调用仅需 `O(1)` 步（如阶乘函数所示），那么统计函数调用次数就能得到总工作量。对于阶乘函数，由于每次调用都是 `O(1)`\
    \ 且树生成了 `n` 次调用，总工作量为 `O(n)`。\n\n使用递归关系分析递归函数的更高级技术将在随后的课程中进行学习。\n\n## 实现递归 (Implementing\
    \ Recursion)\n\n想象一下 `fib(100)` 甚至 `fib(10)` 的调用树。递归函数在处理所有这些函数调用时，是如何跟踪自己所处位置的？当函数返回时，它们的返回值去了何处？这些问题的答案在于大多数语言中函数调用是如何底的。\n\
    \n## 函数调用栈 (Function Call Stack)\n\n每当进行函数调用时，内存中一段被称为“栈帧”（stack frame）的区域会被推入调用栈。调用栈就是一个普通的栈，恰好存放栈帧；它也被称为运行时栈（run-time\
    \ stack），栈帧有时也被称为激活记录（activation records）。\n\n函数在活动期间可以使用它的栈帧内存，当函数调用结束时，它的栈帧就会被弹出。通常，函数的返回值（如果有）将存放在一个特殊的寄存器中，或者留在栈顶。\n\
    \n通常情况下，栈帧包含以下基本信息：\n\n![image](img/128x001.png)\n\n调用者推送参数值和返回地址，然后被调用的函数为它的局部变量推留空间。当被调用的函数执行完毕时，帧被弹出，并使用返回地址跳转回调用它的地方。这就是函数在上述意义上如何知道自己“身在何处”。\n\
    \n这种实现函数调用的通用方法使得不需要任何特殊支持来支持递归。当函数调用自己时，它只需在栈上推入一个带有适当值的新帧。然而，栈可用内存通常是有限的。任何没有基准情况的递归（或简单的产生过多的调用）都会导致栈溢出错误（stack\
    \ overflow）。\n\n## 可视化调用栈 (Visualizing the Call Stack)\n\n`factorial` 方法没有局部变量，因此我们可以通过以下调用栈视图序列来追踪对\
    \ `factorial(3)` 的调用，只显示每个帧内部 `n` 的参数值和留在栈顶的返回值：\n\n![image](img/128x002.png)\n\
    \n最终值 `6` 留在栈顶，供任何调用它的方法使用。\n\n## 堆栈轨迹 (Stack Traces)\n\nJava 运行时环境会在异常后打印堆栈轨迹（stack\
    \ trace），以便你看到问题是如何发生的。堆栈轨迹仅显示当前调用栈上的函数，从顶端开始。许多调试器还允许在程序执行期间查看调用栈。\n\n## 练习 (Exercises)\n\
    \n1. 为上一节练习 1 中的 `add(m, n)` 函数画一棵调用树。使用该树确定该函数的 `O()` 性能。\n2. 为上一节练习 2 中的 `mul(m,\
    \ n)` 函数画一棵调用树。使用该树确定该函数的 `O()` 性能。\n3. 为上一节练习 3 中的 `pow(m, n)` 函数画一棵调用树。使用该树确定该函数的\
    \ `O()` 性能。\n4. 编写一个递归版本的 `pow(m, n)` 来计算 `n > 0` 时的 `m^n$，其复杂度为 `O(log n)`。\n\
    5. 统计 `fib(100)` 的调用树中 `fib(1)` 和 `fib(2)` 出现的次数。提示：画出树的上部，统计 `fib(100)`、`fib(99)`、`fib(98)`、……\
    \ 每一个出现的次数。寻找模式；该模式在 `n = 1` 处发生细微变化。要看到这种变化，再次查看 `fib(5)` 的树。\n6. 展示在评估 `factorial(4)`\
    \ 过程中调用栈是如何变化的。\n7. 展示调用上一节练习中的这些递归函数时调用栈是如何变化的：\n    - (a) `add(7, 3)`\n    -\
    \ (b) `mul(5, 4)`\n    - (c) `pow(2, 3)`\n    - (d) `length(\"abc\")`\n    - (e)\
    \ `reverse(\"Java\")`\n    - (f) `gcd(10, 6)`\n\n## 7.3 递归与通用搜索 (Recursive and\
    \ Generalized Searches)\n\n线性搜索和二分搜索都是递归的良好候选者。它们各检查一个元素，如果不是目标，则继续在较小的列表中搜索。较小列表使用相同的过程，因此可以通过调用相同的递归方法来实现。\n\
    \n1.3 节中的线性搜索和 2.3 节中的二分搜索都是为整数数组设计的。当我们回顾它们时，将这些搜索泛到其他类型。\n\n### 公共包装方法 (Public\
    \ Wrapper Methods)\n\n编写线性和二分搜索的递归版本只需要一个新概念。递归函数通过在更小的参数上调用自己来工作，但线性和二分搜索的参数没有留下这种空间：\n\
    \n```\nlinearSearch(data, target)\n```\n\n```\nbinarySearch(data, target)\n```\n\
    \n此外，这些方法的用户不需要知道（除非影响性能）这些方法是通过递归实现的，因此我们不想更改公共方法的参数列表。\n\n解决方案是使用公共方法作为包装器，调用带有额外参数的私有方法来驱动它们的递归：\n\
    \n![image](img/130x001.png)\n\n私有方法中的新参数控制当前正在搜索的数组部分，这是递归过程中需要改变的部分。二分搜索需要两个参数，因为它可以从两端工作，而线性搜索只从一端搜索。\n\
    \n所有包装方法的作用用新参数的初始值启动递归。\n\n### 通用线性搜索：对象 (Generalized Linear Search: Objects)\n\
    \n列表 1.3 中的线性搜索仅适用于整数数组。为了将其泛化，我们只需要能够判断目标是否等于数组项。由于 `equals()` 方法在 `Object` 类中定义（见第\
    \ 23 页），我们可以在 `Object` 类型上定义线性搜索，这样它就可以适用于任何对象类型的数组。\n\n### 通用二分搜索：可比较对象 (Generalized\
    \ Binary Search: Comparables)\n"
- fmt: "\nBinary search requires more than testing for equality: we need to be able\
    \ to compare elements with respect to an ordering that works like less than or\
    \ greater than. Recall that Java strings have a `compareTo()` method (see [Table\
    \ 1.5](#K20431_C001.xhtml_Text_Anchor_tab1.5)) that makes exactly this type of\
    \ comparison by returning a positive, negative, or zero integer value. Any type\
    \ with such a `compareTo()` method implements the generic Java `Comparable<T>`\
    \ interface in [Table 7.1](#K20431_C007.xhtml_Text_Anchor_tab7.1).\n\n#### Table\
    \ 7.1: Comparable Interface\n\n| `int compareTo(T other)` Returns negative if\
    \ this object is considered less than other, zero if equal, and positive if greater.\
    \ |\n\nFor example, the `String` class implements `Comparable<String>`. In general,\
    \ classes that implement `Comparable` should also override `equals()` in a way\
    \ that is consistent with `compareTo()`.\n\nThe generalized binary search is designed\
    \ to work with any type implementing the `Comparable` interface.\n\n#### Generic\
    \ Methods\n\nBecause the `Comparable` interface is generic, to write a generalized\
    \ binary search using that interface, we need to know how to declare a method\
    \ with a generic type in it. All of the other generic methods we have written\
    \ have inside generic classes.\n\nJava allows methods to introduce a generic type\
    \ parameter; this is called declaring a generic method. The type variables go\
    \ in between the method modifiers and the return type, like this:\n\n```\nmodifiers\
    \ <T> returnType name(parameters) {...}\n```\n\nThis allows the type parameter\
    \ to be used anywhere in the rest of the method definition. For example,\n\n```\n\
    public static <T> int binarySearch(T[] data, T target) {...}\n```\n\ndefines `binarySearch()`\
    \ so that the array type has to match the target type.\n\nWe still need to specify\
    \ that elements of type `T` are comparable. The rough idea is expressed like this:\n\
    \n```\n<T extends Comparable<T>>\n```\n\nThis says that objects of type `T` implement\
    \ the `Comparable` interface. However, because of inheritance, that requirement\
    \ is too restrictive. The right declaration is:\n\n```\n<T extends Comparable<?\
    \ super T>>\n```\n\nSee [Chapter 11](#K20431_C011.xhtml_ch11) of The Java Programming\
    \ Language [[1]](#K20431_bib.xhtml_ref_1) if you are interested in the details.\n\
    \nListing 7.2 shows how all of these ideas work together, providing a complete\
    \ implementation of recursive binary search as a generic method with public wrapper.\n\
    \n**Generalized Recursive Binary Search**\n\n```java\n 1 public static <T extends\
    \ Comparable<? super T>> int\n2   binarySearch(T[] data, T target) {\n3 return\
    \ binarySearch(data, target, 0, data.length - 1);\n4}\n\n5\n6 private static <T\
    \ extends Comparable<? super T>> int\n7   binarySearch(T[] data, T target, int\
    \ low, int high) {\n8 if (low > high) return -1;\n9 int mid = (low + high) / 2;\n\
    10 int result = target.compareTo(data[mid]);\n11 if (result == 0) {\n12   return\
    \ mid;\n13} else if (result < 0) {\n14   return binarySearch(data, target, low,\
    \ mid - 1);\n15} else {\n16   return binarySearch(data, target, mid + 1, high);\n\
    17}\n18}\n```\n\n#### Integer[] and int[]\n\nFinally, because these generalized\
    \ methods are written for object types, they require arrays of objects rather\
    \ than arrays of primitive types. In other words, the new versions of linear and\
    \ binary search will not work on `int[]` arrays. Java automatically boxes and\
    \ unboxes individual elements, but it will not automatically convert between `int[]`\
    \ arrays and `Integer[]` arrays.\n\n#### Exercises\n\n1. Suppose the `Integer`\
    \ array `data` contains:\n```\n8, 28, 31, 35, 39, 40, 44, 51\n```\nDraw the call\
    \ tree for each of these calls to the private recursive binary search function\
    \ in [Listing 7.2](#K20431_C007.xhtml_lis7.2):\n   1. (a) `binarySearch(data,\
    \ 32, 0, 7)`\n   2. (b) `binarySearch(data, 51, 0, 7)`\n   3. (c) `binarySearch(data,\
    \ 5, 0, 7)`\n2. Implement recursive linear search on `Object` types.\n3. Write\
    \ a `main()` method to test recursive linear search from Exercise 2 on an array\
    \ of:\n   1. (a) Integers\n   2. (b) Doubles\n   3. (c) Strings\n4. Write a `main()`\
    \ method to test `binarySearch()` from [Listing 7.2](#K20431_C007.xhtml_lis7.2)\
    \ on an array of:\n   1. (a) Integers\n   2. (b) Doubles\n   3. (c) Strings\n\
    5. Determine the `O()` performance of linear search.\n6. Determine the `O()` performance\
    \ of binary search.\n7. Generalize insertion sort (not recursively) from [Section\
    \ 2.1](#K20431_C007.xhtml_lis2.1) to work with `Comparable`.\n8. Generalize selection\
    \ sort (not recursively) from [Section 2.2](#K20431_C007.xhtml_lis2.2) to work\
    \ with `Comparable`.\n9. Modify the `Fraction` class from [Listing 1.5](#K20431_C007.xhtml_lis1.5)\
    \ to implement the `Comparable` interface.\n\n#### 7.4 Applications\n\nThe problems\
    \ we solved with recursion all have simple solutions. The point of those examples\
    \ was to get comfortable with recursion without too much complication.\n\n#####\
    \ Longest Subsequence\n\nGiven a string `s`, a subsequence of `s` is any string\
    \ obtained by deleting any number of characters from `s` (including none). For\
    \ example, \"acf\" is a subsequence of \"abcdef\" because 'd' and 'e' were deleted.\n\
    \nThe longest subsequence problem asks to find the longest string `lcs(s1, s2)`\
    \ that is a subsequence of both `s1` and `s2`. This problem arises naturally in\
    \ genetics when determining how similar strands of DNA are.\n\nA recursive `lcs(s1,\
    \ s2)` is described in [Listing 7.3](#K20431_C007.xhtml_lis7.3). This recursive\
    \ solution is very inefficient. However, it is the basis of a much more efficient\
    \ solution using dynamic programming that you may see in a later course.\n\n**Longest\
    \ Subsequence (Pseudocode)**\n\n```java\n1 If s1 or s2 is empty, return the empty\
    \ string\n2 If first characters match\n3 Return matching character + lcs(rest\
    \ of s1, rest of s2)\n4 Else\n5 Return longer of lcs(s1, rest of s2) and lcs(rest\
    \ of s1, s2)\n```\n\n##### Towers of Hanoi\n\nThe Towers of Hanoi is a puzzle\
    \ with three posts and a stack of disks on one of the posts that decrease in radius\
    \ as they go up.\n\nThe object is to move all of the disks from post 0 to post\
    \ 2 following these rules: (1) only one disk may be moved from one post to another\
    \ per turn, and (2) a disk may never be moved onto a smaller disk.\n\nThe key\
    \ insight for solving this puzzle is that if we could recursively move disks 1–3\
    \ to post 1, then disk 4 could move to post 2. A second recursive call could then\
    \ finish by moving disks 1–3 from post 1 to post 2. To make this work, both the\
    \ number of disks and the roles of each post need to be able to change for each\
    \ recursive call. That means the recursive function needs parameters for the number\
    \ of disks, as well as which post is used for each role: source, intermediate,\
    \ and destination.\n\n[Listing 7.4](#K20431_C007.xhtml_lis7.4) outlines a recursive\
    \ `hanoi(n, src, intermed, dest)` based on these ideas.\n\n**Towers of Hanoi (Pseudocode)**\n\
    \n```java\n1 Move n-1 disks from src to intermed using dest\n2 Move disk n from\
    \ src to dest\n3 Move n-1 disks from intermed to dest using src\n```\n"
