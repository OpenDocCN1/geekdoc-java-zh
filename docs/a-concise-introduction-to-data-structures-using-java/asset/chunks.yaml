    \n有一个字面量引用 `null`，它不引用任何对象。尝试访问 `null` 引用的字段或方法将产生 `NullPointerException`。\n\n\
    ### 使用 equals()\n\n现在我们可以多说一点关于引用类型 `==` 和 `equals()` 之间的区别。对于所有对象类型（包括字符串），`==`\
    \ 和 `!=` 检查两个引用是否指向同一个对象。另一方面，`equals()` 方法由 `String` 等类定义，用于检查对象是否具有相同的内容。\n\n\
    因此，在大多数情况下，当比较对象时，你希望比较它们的内容，因此使用 `equals()`。与 `==` 的直接比较主要用于基本类型。\n\n有一个例外：Java\
    \ 数组没有实现 `equals()` 方法来比较它们的内容。如果你需要比较数组的内容，请使用 `java.util.Arrays` 类中的 `equals()`\
    \ 方法。\n\n### 销毁对象\n\n在 Java 中，对象被创建后没有显式的方法可以销毁它。相反， Java 有一套自动垃圾回收系统，允许在内存不再被使用时回收该内存。当无法通过追踪程序中的活动引用到达某个对象时，垃圾回收器就会判定该对象不再在使用。这种自动系统非常棒；其他语言可能需要你自己处理垃圾。\n\
    \n然而，有时我们可能需要消除对不再使用的对象的引用。通常情况下，如果 `x` 是指向我们不再需要的对象的引用，那么将 `x` 设置为 `null` 将通知垃圾回收器该对象可以删除（假设没有其他引用指向它）。\n\
