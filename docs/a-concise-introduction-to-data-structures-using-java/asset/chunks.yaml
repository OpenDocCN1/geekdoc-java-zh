  trans: "\n\n最常用的原始类型是 `int`、`double` 和 `boolean`。表 1.2 显示了可以赋值给声明为原始类型变量的字面量。\n\n\
    ### 表 1.2：原始字面量值\n\n| 类型 | 描述 |\n| :--- | :--- |\n| integer | 可选的 `0x` (十六进制),\
    \ `0` (八进制), 或 `0b` (二进制) |\n| long | 后缀 `L` |\n| floating pt | 可选的 `e` 用于底数为\
    \ 10 的指数 |\n| float | 后缀 `f` |\n| boolean | `true` 或 `false` |\n| char | 单引号 |\n\
    \n请注意，整数常量上多余的 `0` 前缀会导致该值被解释为八进制（基数为 8）。\n\n强制转换可用于在原始数值类型之间进行转换（布尔类型外）。强制转换告诉编译器将表达式处理为具有指定的类型。强制转换的语法为：\n\
    \n```\n(type) expression\n```\n\n将浮点值强制转换为整数会截断小数部分。例如，\n\n```\nint i = (int)\
    \ 7.2913; // 将 i 设置为 7\n```\n\n### 运算符\n\nJava 为数值类型提供了标准的算术运算符 `+`、`-`、`*` 和\
    \ `/`。没有幂运算符。整数除法向零截断，因此 `5 / 2` 等于 `2`，`-5 / 2` 等于 `-2`。取余运算符为 `%`，定义为 `m % n`\
    \ 是 `m` 除以 `n` 后的余数。例如，`5 % 2` 为 `1`。对于整数 `m` 和 `n`，保证以下关系：\n\n```\n(m / n) *\
    \ n + m % n == m\n```\n\n注意 `m % n` 可以是负数：例如，`-5 % 2` 为 `-1`，因为\n\n```\n(-5 /\
    \ 2) * 2 + -5 % 2 == -2 * 2 + -1 == -5\n```\n\n取余运算符有时也称为模（modulus）或 mod 运算符，但技术上是不准确的，因为模值永远为负数。\n\
    \n测试相等性使用 `==` 或 `!=`（不等于）。其他比较运算符有 `<`、`>`、`<=` 和 `>=`。这些运算符每个产生一个布尔结果（truetrue\
    \ 或 `false`）。布尔值可以使用布尔运算符 `&&`（与）或 `||`（或）结合。任何布尔值都可以通过在其前面加上 `!`（非）来取反。\n\n布尔运算符\
    \ `&&`（与）和 `||`（或）是条件性的，这意味着它们只在必要时才评估第二个表达式。例如，如果在该表达式中 `j` 为负数：\n\n```\nj >=\
    \ 0 && key < data[j]\n```\n\n那么第二部分 `key < data[j]` 将不会被评估，因为最终结果已经确定为假。条件评估也被称为布尔运算符短路。\n\
    \n### 递增与递减\n\n数值变量可以通过递增运算符加一：\n\n```\nvariable++\n```\n\n还有一个递减运算符 `--`。递增和递减可以单独作为语句使用，也可以作为较大表达式的一部分。当以上述后置形式出现在表达式中时（`++`\
    \ 位于变量之后），递增或递减会在获取变量值之后发生。\n\n在前置形式中：\n\n```\n++variable\n```\n\n递增（或递减）在确定变量值之前完成。\n\
    \n例如，\n\n```\nint x = 10;\n```\n\n```\nint y = x++;\n```\n\n会将 `x` 变为 `11` 并将值\
    \ `10` 赋值给 `y`，因为递增是在第二行评估 `x` 之后完成的。\n\n### 语句与块\n\n可执行的 Java 代码是语句的序列，每个语句都以分号结束。大括号\
    \ `{}` 可将语句分组为块。大括号也被称为波浪线（squigglies）或花括号。大括号后面不需要加分号。\n\n块通常定义类、方法、循环和 if 语句的体。通常，块可以使用任何单个语句出现的地方——反之亦然——因为从技术上讲，块被视为单一的复合语句。例如，if\
    \ 语句可以使用块来写：\n\n```\nif (test) {\n    body;\n}\n```\n\n或者使用单个语句：\n\n```\nif (test)\n\
    \    singleStatement;\n```\n\n然而，由于在单语句形式中添加新语句而可能忘记包含大括号的危险，最好将单语句体写在同一行上：\n\n\
    ```\nif (test) singleStatement;\n```\n\n接下来的示例语句使用了块形式。\n\n### 赋值\n\n赋值语句计算右侧的表达式并将该值赋值给左侧的变量：\n\
    \n```\nvariable = expression;\n```\n\n表达式的类型必须与变量的类型兼容。许多常见的赋值都有简写形式。例如，列表 1.1\
    \ 第 5 行中的 `*=`：\n\n```\nresult *= i;\n```\n\n是赋值的缩写：\n\n```\nresult = result *\
    \ i;\n```\n\n`+=`、`-=` 和 `/=` 也有相似的简写形式。\n\n### 控制语句\n\nJava 程序中的语句按照它们出现的顺序一个一个执行。控制语句改变语句的执行顺序。\n\
    \n### if 语句\n\nif 语句允许在测试为真时条件执行执行体：\n\n```\nif (test) {\n    body;\n}\n```\n\n\
    测试内容必须产生一个布尔值。有一个可选 `else`。\n\n### while 循环\n\nwhile 循环在测试为假之前重复执行执行体：\n\n```\n\
    while (test) {\n    body;\n}\n```\n\n### for 循环\n\nfor 循环增加了初始化和递增步骤：\n\n```\n\
    for (initialize; test; increment) {\n    body;\n}\n```\n\n此循环原理类似于 while 循环：\n\
    \n```\ninitialize;\nwhile (test) {\n    body;\n}\n```\n\n### switch\n\nswitch\
    \ 是长串 if 语句的替代方案。\n\n```\nswitch (expression) {\n    case value1:\n        statements;\n\
    \    case value2:\n        statements;\n    ...\n    default:\n        statements;\n\
    }\n```\n\n`default` 情况是可选的。当 switch 执行时，控制跳转到匹配的 case，然后从该点继续，case 语句本身没有影响。换句话说，执行不会在\
    \ case 结束自动停止。因此，大多数 switch 语句在每个 case 的末尾都有 `break` 语句，以便跳过剩余的 case。\n\n### 输出语句\n\
    \n输出由 表 1.3 中的 `System.out` 函数生成。\n\n### 表 1.3：System.out 方法\n\n| 方法 | 描述 |\n\
    | :--- | :--- |\n| `System.out.print(item)` | 打印项目不换行 |\n| `System.out.println(item)`\
    \ | 打印项目并追加换行 (`\\n`) |\n\n还有其他更灵活的输出函数可用，详情请咨询 Java 文。\n\n### 方法\n\nJava 中的函数通常被称为方法，因为它们必须写在类内部。方法定义的通用格式为：\n\
    \n```\nmodifiers returnType name(parameterType parameter, ...) {\n    body;\n\
    }\n```\n\n列表 1.1 中的 `factorial()` 方法具有修饰符 `public static`、返回类型 `int` 以及类型为 `int`\
    \ 的名为 `n` 的参数。方法修饰符将在 1.5 节 中讨论。方法声明其返回类型以指示它将返回的数据类型。`void` 返回类型表示不返回任何值。因此，`factorial()`\
    \ 方法返回 `int`，而 `main()` 方法不返回内容。\n\n非 void 方法通过 `return` 语句返回值：\n\n```\nreturn\
    \ expression;\n```\n\n"
- fmt: "\nThe type of this expression must be compatible with the method’s return\
    \ type. When a return statement is reached, the method immediately stops execution\
    \ and returns the value of the expression to its caller. Because of this behavior,\
    \ a return statement with no expression may be used in a void method to return\
    \ to the caller without executing any more code within the method.\n\nMethod parameters\
    \ such as `n` in `factorial()`, must declare their type. Parameters are passed\
    \ by value, meaning that the method receives a copy of the value that is passed\
    \ as the argument. For primitive types, this means that a method can modify its\
    \ copy of the parameter without affecting the caller. Reference parameters will\
    \ be considered briefly in [Section 1.4](#K20431_C001.xhtml_ch1.4).\n\nSince Java\
    \ code needs to be inside a class definition, there is no way to define a function\
    \ outside of a class, as is common in, say, C or Python. If you find yourself\
    \ wanting to write a stand-alone function in Java, then generally what you want\
    \ to write is a static method, such as `factorial()` and `main()` in [Listing\
    \ 1.1](#K20431_C001.xhtml_lis1.1). The reason for declaring these methods static\
    \ will be explained in [Section 1.5](#K20431_C001.xhtml_ch1.5).\n\n### Comments\n\
    \nJava comments come in three varieties:\n\nMultiple line Text contained between\
    \ `/*` and `*/` is ignored by the compiler and meant for others who read your\
    \ code.\n\nDocumentation Multiple line comments beginning with `/**` are documentation\
    \ comments that describe the following class or method.\n\nSingle line Any text\
    \ that follows `//` to the end of the line is treated as a comment, usually to\
    \ explain a short section of code.\n\nThe jjavadoc tool converts documentation\
    \ comments into Web pages that follow the same style as the Java library documentation.\
    \ Documentation comments are not included in this text so that the code itself\
    \ will be easier to read.\n\n### Compiling and Running Java Programs\n\nTo run\
    \ [Listing 1.1](#K20431_C001.xhtml_lis1.1), save the code in a file named `NumericFunctions.java`.\
    \ This Java source code is compiled to Java bytecode with the command:\n\n```\n\
    \ % javac NumericFunctions.java\n```\n\nBytecode is like a low-level machine language,\
    \ except that it consists of instructions for the Java Virtual Machine or JVM\
    \ rather than a particular CPU. The compiler stores the generated bytecode in\
    \ a file named `NumericFunctions.class`. Once this bytecode file has been created,\
    \ the program may be executed with the command:\n\n```\n % java NumericFunctions\n\
    ```\n\nThis will automatically call the `main()` method from the `NumericFunctions`\
    \ class, as long as that method is declared `public static void` with a `String[]`\
    \ parameter, as on line 10\\. Integrated development environments (IDEs) such\
    \ as Netbeans or Eclipse make it easy to edit, compile, and run Java programs\
    \ without having to work from the command line. jGRASP [[7]](#K20431_bib.xhtml_ref_7)\
    \ is an IDE specifically designed for learning data structures.\n\n### Exercises\n\
    \n1. Suppose the `int` variables `x` and `y` have the values 5 and 10, respectively.\
    \ Give the value of both `x` and `y` after each of these Java statements runs,\
    \ starting over with the original values of `x` and `y` each time:\n    1. (a)\
    \ `x = ++y;`\n    2. (b) `x = −−y;`\n    3. (c) `x = y++;`\n    4. (d) `x = y--;;`\n\
    2. Write `for`-loops to produce the following values:\n    1. (a) `i = 1, 2, 3,\
    \ . . . , 100`\n    2. (b) `j = 0, 1, 2, 3, . . . , 9`\n    3. (c) `m = 0, 2,\
    \ 4, 6, . . . , 100\\.` (Hint: the increment step can be a shorthand assignment.)\n\
    \    4. (d) `n = 1, 2, 4, 8, . . . , 1024.`\n3. Write three different `for`-loops\
    \ that will each execute their body ten times. Do not just change the name of\
    \ the loop variable; change all three parts of the `for`-loop.\n4. Modify `main()`\
    \ in [Listing 1.1](#K20431_C001.xhtml_lis1.1) to include a call to `factorial(0)`.\
    \ Explain why the correct result (0! = 1) is returned.\n5. Modify `main()` in\
    \ [Listing 1.1](#K20431_C001.xhtml_lis1.1) to include calls to `factorial(n)`\
    \ with negative `n`. Does the program crash? Explain its behavior, focusing on\
    \ the `for`-loop on line 4.\n6. Modify `main()` in [Listing 1.1](#K20431_C001.xhtml_lis1.1)\
    \ to compute factorials up to `n = 20`.\n    1. (a) Determine the largest `n`\
    \ for which the correct value is returned.\n    2. (b) Explain why some incorrect\
    \ values are computed. Hint: a 32-bit signed `int` can hold values between −2³¹\
    \ and 23³¹ − 1.\n    3. (c) Modify the `factorial()` function to use the `long`\
    \ data type so that larger factorials can be accurately computed. Determine the\
    \ largest `n` for which the correct value is returned by your modified function.\n\
    7. Write a Java function `pow(m, n)` that computes `mn` for integers `m` and `n`,\
    \ assuming `n ≥ 0`. Use a loop to repeatedly multiply by `m`. Add the `pow()`\
    \ function to the `NumericFunctions` class and include code in `main()` to compute\
    \ `pow(m, n)` for all `m` and `n` between 1 and 9.\n8. Write a Java function to\
    \ implement Euclid’s algorithm for computing the greatest common divisor `gcd(m,\
    \ n)`, which is the largest integer `k` dividing both `m` and `n`. One form of\
    \ Euclid’s algorithm is:\n```\nwhile n < 0\n```\n```\nreplace n with m % n\n```\n\
    ```\nreplace m with the previous value of n\n```\nWhen the loop stops, the `gcd`\
    \ is in `m`. Add the `gcd()` function to the `NumericFunctions` class and include\
    \ code in `main()` to compute `gcd(m, n)` for all `m` and `n` between 2 and 10.\n\
    \n## 1.2 Strings\n\nIn this section, we look at an example in [Listing 1.2](#K20431_C001.xhtml_lis1.2)\
    \ featuring the Java `String` type. Although we will only use strings occasionally,\
    \ they provide a natural first example of a reference type in Java.\n\nListing\
    \ 1.1: Count Substrings\n\n```\n 1 public class StringFunctions {\n```\n```\n\
    \ 2 public static int count(String s, String target) {\n```\n```\n 3  int count\
    \ = 0;\n```\n```\n 4  int n = target.length();\n```\n```\n 5  for (int i = 0;\
    \ i <= s.length() - n; i++) {\n```\n```\n 6  String piece = s.substring(i, i +\
    \ n);\n```\n```\n 7  if (piece.equals(target)) count++;\n```\n```\n 8 }\n```\n\
    ```\n 9  return count;\n```\n```\n10}\n```\n```\n11\n```\n```\n12 public static\
    \ void main(String[] args) {\n```\n```\n13  System.out.println(\"Number of this's:\
    \ \" +\n```\n```\n14  count(\"this and this and that and this\", \"this\"));\n\
    ```\n```\n15}\n```\n```\n16}\n```\n\nThe `String` class in Java provides support\
    \ for working with character text. As you may have noticed, string literals are\
    \ contained in double quotes.\n\n### Concatenation\n\nStrings may be combined\
    \ via concatenation using `+` or the shorthand `+=`. Thus, the sequence\n\n```\n\
    String s = \"abc\";\n```\n```\ns += \"def\";\n```\n\nresults in s having the value\
    \ ”abcdef”.\n\nHowever, strings are immutable, meaning that once a `String` has\
    \ been created its contents can never change. What happens behind the scenes,\
    \ then, when executing\n\n```\ns += \"def\"\n```\n\nis that a new `String` object\
    \ is created with the value ”abcdef”, and the reference `s` is changed to point\
    \ to this new string instead of the old one that contained “abc”. Thus, string\
    \ concatenation is relatively inefficient because it repeatedly generates new\
    \ `String` objects. We will see a more efficient technique for building strings\
    \ in [Section 1.4](#K20431_C001.xhtml_ch1.4).\n\nConcatenation may also be used\
    \ to combine strings with other types that are capable of being converted to strings.\
    \ This conversion is done automatically, as in lines 13 and 14 of [Listing 1.2](#K20431_C001.xhtml_lis1.2).\
    \ In that example, the `int` returned by `count()` is automatically converted\
    \ to a string so that it can be concatenated with the literal string ”Number of\
    \ this’s ”.\n\n### String Methods\n\nRecall that primitive types provide storage\
    \ for a simple piece of data, such as an integer or float. References that point\
    \ to objects are capable of more advanced behaviors, including method calls. We\
    \ will discuss general object behavior in [Section 1.4](#K20431_C001.xhtml_ch1.4);\
    \ for now, [Listing 1.2](#K20431_C001.xhtml_lis1.2) demonstrates calling a few\
    \ of the string methods from [Table 1.4](#K20431_C001.xhtml_Text_Anchor_tab1.4).\n\
    \nTable 1.4\n"
