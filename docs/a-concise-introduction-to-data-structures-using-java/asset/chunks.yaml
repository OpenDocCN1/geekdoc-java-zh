    \ 11 to begin a MinHeap<E> implementation, replacing isLarger() with isSmaller().\n\
    \n13.  Consider the amount of duplicate code shared between MaxHeap and MinHeap.\
    \ Reduce the duplication with an abstract Heap class (see [Section 8.3](#K20431_C008.xhtml_ch8.3)).\n\
    \n    Define an abstract method isHigher(i, j) in the Heap class. Abstract methods\
    \ have no method body; just a declaration that forces any concrete subclass to\
    \ provide that method. The declaration looks like this:\n\n    ```\n    visibility\
    \ abstract returnType methodName(params);\n    ```\n\n    In this case, the concrete\
    \ subclasses should override isHigher() by calling either isLarger() or isSmaller().\n\
    \n    The point of this abstract method is that it can be called in Heap class\
    \ methods, representing that item i is higher in the heap than item j, even though\
    \ it won’t be defined until later by concrete subclasses.\n\n## 10.2 Insertion\
    \ and Deletion\n\nThe key to understanding insertion and deletion in heaps is\
    \ their shape: because heaps must always be complete binary trees, there is only\
    \ one slot where a new node can be added and one slot that can be removed.\n\n\
    In the following, we assume heaps are max-heaps; min-heaps work similarly.\n\n\
    ### Insertion and Heapifying Up\n\nIn order to stay complete, a heap must grow\
    \ at the next open location in the underlying array:\n\n![image](image/172x001.png)\n\
    \nHowever, this might violate the heap property. If it does, that means the new\
    \ node is larger than its parent. If we swap the new node with its parent, then\
    \ any sibling must be ok, and the only possible heap violation is now between\
    \ the parent and its parent. Continuing this process, called heapifying up, works\
    \ up the tree until we have a legal heap.\n\nExample\n\nConsider inserting 51\
    \ into the max-heap below. It begins in the first open space:\n\n![image](image/173x001.png)\n\
    \nThe heap property is violated between 51 and 11, so they swap. At that point,\
    \ 51 is again larger than its new parent, 23, so they also swap:\n\n![image](image/173x002.png)\n\
    \nNow 51 is smaller than its parent, and the heap is valid.\n\n[Listing 10.1](#K20431_C010.xhtml_lis10.1)\
    \ outlines the algorithm to heapify up from the node i in pseudocode. It is important\
    \ to check that the parent index is valid so that the algorithm does not attempt\
    \ to go past the top of the heap.\n\nListing 10.1: Heapify Up (Pseudocode)\n\n\
    ```\n 1 If parent(i) is valid and i is larger than parent(i)\n```\n\n```\n 2 \
    \ Swap i with parent(i)\n```\n\n```\n 3  Repeat\n```\n\n### Deletion\n\nDeleting\
    \ from a max-heap means removing and returning the largest element, which is always\
    \ stored at the root. However, in order to maintain the shape of a complete binary\
    \ tree, the node that is actually deleted must be at the end of the heap, not\
    \ the beginning. Therefore, we plan to copy the value from the last node to the\
    \ root and heapify down instead of up.\n\n![image](image/174x001.png)\n\nThis\
    \ is similar to the strategy used for deleting in binary search trees: we copy\
    \ a value from somewhere else and delete that node instead.\n\nOne step in the\
    \ deletion algorithm is easy to miss, and so the process is outlined in [Listing\
    \ 10.2](#K20431_C010.xhtml_lis10.2). It is important to change the heap size before\
    \ heapifying down; otherwise, the last element may participate in the heapification.\
    \ Line 1 specifies swapping the first and last item instead of just copying the\
    \ last item for the sake of heapsort in the next section.\n\nListing 10.2: Heap\
    \ Deletion (Pseudocode)"
