    Insertion sort is often used by card players to sort their hands. The idea is
    to view the data in two sections: the left section is a sorted subset of the data,
    while the right section contains items that remain to be sorted. At each step
    of the algorithm, we take the next element from the right section and insert it
    into the left, in such a way that the left section remains sorted.


    ### Example


    Given the array


    ![image](image/f0038-01.png)


    begin by viewing the first element as sorted (on its own):


    ![image](image/f0038-02.png)


    Then take the next element in the right half and insert it in its proper, sorted
    place on the left. In this case, `14` can stay where it is because `3 < 14`.


    ![image](image/f0039-01.png)


    The next element, `7`, needs to be inserted between `3` and `14`. This requires
    saving the `7`, copying `14` into slot 2, and then copying `7` into slot 1:


    ![image](image/f0039-02.png)


    This process continues until there are no elements on the right, in which case
    the array is sorted. Inserting one element at a time in this way is an example
    of an incremental strategy.


    ### Implementation


    [Listing 2.1](#K20431_C002.xhtml_lis2.1) implements insertion sort for integer
    arrays in Java. Pay close attention to the inner loop, which shifts elements in
    the array so that the `key` can be inserted at its proper location.


    Listing 2.1: Insertion Sort


    ```

    1 // Add to class ArrayFunctions

    ```


    ```

    2 public static void insertionSort(int[] data) {

    ```


    ```

    3 for (int i = 1; i < data.length; i++) {

    ```


    ```

    4  int key = data[i];

    ```


    ```

    5  int j = i - 1;

    ```


    ```

    6  while (j >= 0 && key < data[j]) {

    ```


    ```

    7  data[j + 1] = data[j];

    ```


    ```

    8  j--;

    ```

    ```

    9 }

    ```


    ```

    10  data[j + 1] = key;

    ```


    ```

    11 }

    ```


    ```

    12}

    ```


    ### Worst-Case Analysis


    Insertion sort has a `while`-loop inside a `for`-loop. That makes it difficult
    to analyze because we need to determine how many times the inner loop runs.


    The outer loop on line 3 runs `n - 1` times on an array of length `n`. The inner
    loop on line 6 depends on the data. In the worst case, the array will be in reverse
    sorted order, and every item will have to move the largest possible distance.
    In that case, item `i` will cause the `while`-loop to run `i` times. Therefore,
    the total number of inner loop iterations in the worst case is:


    1 + 2 + ··· + (n − 1)


    The question is: what is this expression in terms of `O()`? Sums like this occur
    frequently in algorithm analysis, so it is good to know how to handle them.


    A heuristic for finding this sum is to pair its elements from the outside in:


    ![image](image/f0040-01.png)


    Each pair sums to `n`, and there are $\frac{n - 1}{2}$ pairs, so the total is


    $\text{pairsum} \times \text{Numberofpairs} = \frac{n(n - 1)}{2}$


    which is `O(n2)`.


    ### Generating Random Data


    It would be difficult to test insertion sort (and many other methods) without
    the ability to generate random test data. [Listing 2.2](#K20431_C002.xhtml_lis2.2)
    shows how to use one of the Java libraries to generate random values. It creates
    a generator object, and then asks the generator for each value to put in the array.


    Listing 2.2: Random Data


    ```

    1 // Add to class ArrayFunctions:

    ```


    ```

    2

    ```


    ```

    3 import java.util.Random;

    ```


    ```

    4

    ```


    ```

    5 public static void randomFill(int[] data, int max) {

    ```


    ```

    6 Random gen = new Random();

    ```


    ```

    7 for (int i = 0; i < data.length; i++) {

    ```


    ```

    8  data[i] = gen.nextInt(max);

    ```


    ```

    9}

    ```


    ```

    10}

    ```


    The generator is created in line 6, and its `nextInt()` method is called in line
    8 to fill in the next array value.


    ### Using Java Libraries


    To use Java libraries, it is standard practice to import the library classes that
    you need at the top of your file:


    ```

    import library.name;

    ```


    In [Listing 2.2](#K20431_C002.xhtml_lis2.2), the name of the library being used
    is `java.util`, and the name imported on line 3 is the class `Random`. The full
    name of the class is `java.util.Random`, and in fact, this name can be used at
    any time without an import. As mentioned, though, it is a good idea to import
    such names at the top of your class definition files.


    A few instance methods from the `java.util.Random` class are listed in [Table
    2.3](#K20431_C002.xhtml_tab2.3).


    Table 2.3 `java.util.Random`


    | Method | Description |

    | :--- | :--- |

    | `nextDouble()` | Returns a pseudorandom `double` value between 0.0 and 1.0 (exclusive).
    |

    | `nextGaussian()` | Returns a pseudorandom `double` value from a normal distribution
    with mean 0.0 and standard deviation 1.0. |

    | `nextInt()` | Returns a pseudorandom `int` value between 0 (inclusive) and `Integer.MAX_VALUE`
    (exclusive). |

    | `nextInt(int bound)` | Returns a pseudorandom `int` value between 0 (inclusive)
    and the specified value (exclusive). |


    ### Exercises


    1. Add `insertionSort` from [Listing 2.1](#K20431_C002.xhtml_lis2.1) to the `ArrayFunctions`
    class. Pay close attention to the inner loop, which shifts elements in the array
    so that the `key` can be inserted at its proper location.

    2. Analyze the worst-case analysis of insertion sort.

    3. Analyze the average-case performance of insertion sort.

    4. Analyze the best-case performance of insertion sort.

    5. Implement `randomFill` from [Listing 2.2](#K20431_C002.xhtml_lis2.2) in the
    `ArrayFunctions` class.

    6. Use the `nextInt()` method from `java.util.Random` to fill an array with random
    values.

    7. Write an `isSorted(int[] data)` method in the `ArrayFunctions` class that returns
    true if the array is sorted and false otherwise.

    8. Write an overloaded version of `randomFill(int[] data)` that does not limit
    the size of the random integers it fills with.

    9. Measure the performance of insertion sort. Begin with an array of size 100
    and double the size up to 200,000. Report your results and observations.

