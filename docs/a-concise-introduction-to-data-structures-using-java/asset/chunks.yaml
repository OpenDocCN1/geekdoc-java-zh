  trans: "\n二分查找不仅需要测试相等性：我们还需要能够根据类似于“小于”或“大于”的顺序来比较元素。回想 Java 字符串有一个 `compareTo()`\
    \ 方法（参见表 1.5），该方法通过返回正整数、负整数或零来恰好实现这种类型的比较。任何具有此类 `compareTo()` 方法的类型都实现了表 7.1\
    \ 中的泛型 Java `Comparable<T>` 接口。\n\n#### 表 7.1: Comparable 接口\n\n| `int compareTo(T\
    \ other)` 如果此对象认为小于其他对象则返回负数；相等则返回零；大于则返回正数。 |\n\n例如，`String` 类实现了 `Comparable<String>`。通常情况下，实现\
    \ `Comparable` 的类也应该重写 `equals()`，使其与 `compareTo()` 保持一致。\n\n泛型二分查找的设计适用于实现 `Comparable`\
    \ 接口的任何类型。\n\n#### 泛型方法\n\n由于 `Comparable` 接口是泛型的，为了使用该接口编写泛型化的二分查找，我们需要知道如何在方法中声明泛型类型。我们之前编写的所有其他泛型方法都是位于泛型类内部的。\n\
    \nJava 允许方法引入泛型类型参数；这被称为声明泛型方法。类型变量放在方法修饰符和返回类型之间，如下：\n\n```\nmodifiers <T> returnType\
    \ name(parameters) {...}\n```\n\n这允许类型参数在方法定义的其余任何地方使用。例如，\n\n```\npublic static\
    \ <T> int binarySearch(T[] data, T target) {...}\n```\n\n这定义了 `binarySearch()`，使得数组类型必须与目标类型匹配。\n\
    \n我们仍然需要指定 `T` 类型的元素是可比较的。粗略的想法表达如下：\n\n```\n<T extends Comparable<T>>\n```\n\n\
    这表示类型为 `T` 的对象实现了 `Comparable` 接口。然而，由于继承机制，该要求过于严格。正确的声明是：\n\n```\n<T extends\
    \ Comparable<? super T>>\n```\n\n如果你对细节感兴趣，请参阅《Java 语言编程》的第 11 章[#K20431_C011.xhtml_ch11]\
    \ [[1]](#K20431_bib.xhtml_ref_1)。\n\n列表 7.2 显示了所有这些思想是如何协同工作的，提供了一个带有公共包装方法的泛型方法——递归二分查找的完整实现。\n\
    \n**泛型递归二分查找**\n\n```java\n 1 public static <T extends Comparable<? super T>>\
    \ int\n2   binarySearch(T[] data, T target) {\n3 return binarySearch(data, target,\
    \ 0, data.length - 1);\n4}\n\n5\n6 private static <T extends Comparable<? super\
    \ T>> int\n7   binarySearch(T[] data, T target, int low, int high) {\n8 if (low\
    \ > high) return -1;\n9 int mid = (low + high) / 2;\n10 int result = target.compareTo(data[mid]);\n\
    11 if (result == 0) {\n12   return mid;\n13} else if (result < 0) {\n14   return\
    \ binarySearch(data, target, low, mid - 1);\n15} else {\n16   return binarySearch(data,\
    \ target, mid + 1, high);\n17}\n18}\n```\n\n#### Integer[] 和 int[]\n\n最后，由于这些泛型方法是为对象类型编写，它们需要对象数组而不是原始类型数组。也就是说，线性查找和二分查找的新版本将无法作用于\
    \ `int[]` 数组。Java 会自动对单个元素装箱和拆箱，但它不会自动在 `int[]` 数组和 `Integer[]` 数组之间转换。\n\n####\
    \ 练习题\n\n1. 假设 `Integer` 数组 `data` ：\n```\n8, 28, 31, 35, 39, 40, 44, 51\n```\n\
    为列表 7.2 中对私有递归二分查找函数的每次调用绘制调用树：\n   1. (a) `binarySearch(data, 32, 0, 7)`\n  \
    \ 2. (b) `binarySearch(data, 51, 0, 7)`\n   3. (c) `binarySearch(data, 5, 0, 7)`\n\
    2. 在 `Object` 类型上实现递归线性查找。\n3. 编写一个 `main()` 方法，对以下数组测试练习 2 中的递归线性查找：\n   1. (a)\
    \ 整数 (Integers)\n   2. (b) 双精度浮数 (Doubles)\n   3. (c) 字符串 (Strings)\n4. 编写一个 `main()`\
    \ 方法，对以下数组测试列表 7.2 中的 `binarySearch()`：\n   1. (a) 整数 (Integers)\n   2. (b) 双精度浮数\
    \ (Doubles)\n   3. (c) 字符串 (Strings)\n5. 确定线性查找的 `O()` 性能。\n6. 确定二分查找的 `O()` 性能。\n\
    7. 将第 2.1 节中的插入排序（非递归）泛化，使其适用于 `Comparable` 类型。\n8. 将第 2.2 节中的选择排序（非递归）泛化，使其适用于\
    \ `Comparable` 类型。\n9. 修改列表 1.5 中的 `Fraction` 类以实现 `Comparable` 接口。\n\n#### 7.4\
    \ 应用\n\n我们用递归解决的问题都有简单的解决方案。这些示例的目的是为了让大家在不引入太多复杂性的过情况下熟悉递归。\n\n##### 最长子序列\n\n\
    给定一个字符串 `s`，`s` 的子序列是通过从 `s` 中删除任意数量的字符（包括一个都不删除）而得到的任何字符串。例如，“acf\" 是 \"abcdef\"\
    \ 的一个子序列，因为 'd' 和 'e' 被删除了。\n\n最长子序列问题要求找到最长的字符串 `lcs(s1, s2)`，它是 `s1` 和 `s2`\
    \ 的共同子序列。这个问题在遗传学确定 DNA 链的相似程度时自然出现。\n\n列表 7.3 描述了一个递归的 `lcs(s1, s2)`。这个递归解决方案效率很低。但是它是你在后续课程中可能会基于动态规划的更高效解决方案的基础。\n\
    \n**最长子序列（伪代码）**\n\n```java\n1 如果 s1 或 s2 为空，返回空字符串\n2 如果第一个字符匹配\n3 返回匹配字符 + lcs(rest\
    \ of s1, rest of s2)\n4 否则\n5 返回 lcs(s1, rest of s2) 和 lcs(rest of s1, s2) 中较长的一个\n\
    ```\n"
- fmt: "\nProblems that involve searching a large number of possibilities can make\
    \ it difficult to keep track of where an algorithm “is” currently in the search\
    \ space. Example problems of this type include mazes, puzzles such as crosswords\
    \ or Sudoku, and discrete optimization problems that attempt to maximize or minimize\
    \ some quantity over a set of discrete objects. Recursive backtracking solves\
    \ problems like these by using the call stack to manage where it is and to allow\
    \ backing up to try something else if the current search path has failed.\n\n\
    The `n-queens` problem is a puzzle that requires placing `n` chess queens on an\
    \ `n` × `n` board so that none of the queens attack each other. Queens are allowed\
    \ to move horizontally, vertically, or diagonally any number of squares. For example,\
    \ with `n = 4`, the following is not a valid solution because two queens attack\
    \ each other along a diagonal: `Q`\n\n![image](image/135x001.png)\n\nA recursive\
    \ backtracking solution to the `n-queens` problem reduces the problem to placing\
    \ one queen in each column. [Listing 7.5](#K20431_C007.xhtml_lis7.5) describes\
    \ a recursive `queens(board, column)` function that moves across the board from\
    \ left to right, placing one queen per column.\n\nListing 7.5: Backtracking Solution\
    \ To n-Queens (Pseudocode)\n\n```\n 1 If finished, display board\n```\n```\n 2\
    \ Else\n```\n\n```\n 3 For each row\n```\n\n```\n 4   board[column] = row\n```\n\
    \n```\n 5   If this is a legal position\n```\n\n```\n 6   queens(board, column\
    \ + 1)\n```\n\nWhere is the backtracking in this code? It is managed completely\
    \ by the recursion: if `queens(board, column + 1)` fails to find a solution, the\
    \ for-loop advances to check the next possible row.\n\n## Exercises\n\n1. Implement\
    \ [Listing 7.3](#K20431_C007.xhtml_lis7.3) as a recursive function `lcs(s1, s2)`\
    \ to return the longest common subsequence of strings `s1` and `s2`.\n\n2. Implement\
    \ [Listing 7.4](#K20431_C007.xhtml_lis7.4) as a recursive `hanoi(n, src, intermed,\
    \ dest)` to solve the Towers of Hanoi puzzle. Print a message like this for the\
    \ middle step of the method:\n\n   ```\n   Move disk 3 from 0 to 2.\n   ```\n\
    \   Do not forget a base case.\n\n3. Determine the `O()` performance of the `hanoi()`\
    \ function by counting the number of function calls made with `n` disks.\n\n4.\
    \ Implement [Listing 7.5](#K20431_C007.xhtml_lis7.5) as a recursive function `queens(board,\
    \ column)` to solve the `n-queens` problem using backtracking.\n\n5. Explain why\
    \ the recursive backtracking solution to the `n-queens` problem finds all solutions\
    \ to the problem, rather than just one.\n\n## Chapter 8\n\n# Trees\n\nTrees are\
    \ non-linear, hierarchical, and recursive data structures with a wide range of\
    \ applications. In fact, we have already seen call trees in [Section 7.2](#K20431_C007.xhtml_ch7.2)\
    \ as a useful model for tracking recursive computations.\n\n## 8.1 Definitions\
    \ and Examples\n\nA tree is a (possibly empty) set of elements called nodes with\
    \ one node designated as the root. The root is connected via edges to some number\
    \ of child nodes, each of which is itself the root of a subtree. Thus, trees are\
    \ naturally recursive. A leaf is a node with no children; an internal node is\
    \ any non-leaf. A branch in a tree is a path of connected edges starting at the\
    \ root and ending in a leaf. Trees are usually drawn with the root at the top.\n\
    \nFor example, in the tree below, 31 is the root, 7 is a child of 5, 24 is a leaf,\
    \ and 14 is an internal node.\n\n![image](image/137x001.png)\n\nThe child relationship\
    \ between nodes in a tree naturally leads to many other familial terms for nodes,\
    \ such as parent, grandparent, sibling, ancestor, and descendant. Every node has\
    \ exactly one parent, except for the root which has no parent.\n\nThe depth or\
    \ level of a node `n` in a tree is defined recursively:\n\n$\\text{depth(n)} =\
    \ \\left\\{ \\begin{matrix} 1 & \\text{ifnistheroot} \\\\ {\\text{1} + \\text{depth(parent(n))}}\
    \ & \\text{otherwise} \\end{matrix} \\right.$\n\nThe height of a tree is its maximum\
    \ depth. The tree above has height 3, and node 25 is on level 2.\n\nAmong the\
    \ most common trees are binary trees in which every node has at most two children,\
    \ usually named left and right. The following examples illustrate just a few of\
    \ the many uses of binary trees.\n\n### Expression Trees\n\nArithmetic expressions\
    \ can be represented as binary trees by translating each binary operation to a\
    \ tree with its operator as the root and its two operands as the operator’s children.\
    \ For example, (a + b) * c can be represented as this binary tree:\n\n![image](image/138x001.png)\n\
    \nSuch a tree is called an expression tree or parse tree, because it represents\
    \ the syntactic structure of the expression.\n\nThere is a natural correspondence\
    \ between subexpressions and subtrees in expression trees. For example, (a + b)\
    \ is a subexpression of (a + b) * c, and it occurs as the left subtree of the\
    \ expression tree, since it is the left operand of the multiplication:\n\n![image](image/138x001.png)\n\
    \n### Binary Search Trees\n\nA binary search tree is a binary tree in which for\
    \ every node, all values in the left subtree are less than the node's value, and\
    \ all values in the right subtree are greater. This property allows for efficient\
    \ searching, insertion, and deletion.\n\nA binary search tree is a binary tree\
    \ such that for each node $p$:\n- all nodes in the left subtree have keys less\
    \ than $p.key$\n- all nodes in the right subtree have keys greater than $p.key$\n\
    \nA binary search tree is often referred to by the abbreviation `BST`.\n\nThe\
    \ property of a binary search tree allows us to search, insert, and delete in\
    \ $O(h)$ time, where $h$ is the height of the tree. In a balanced binary search\
    \ tree, $h = O(\\log n)$, making these operations very fast.\n\nA binary search\
    \ tree is a type of binary tree where each node has a key, and all keys in the\
    \ left subtree are smaller than the node's key, while all keys in the right subtree\
    \ are larger than the node's key.\n\nThe property of a binary search tree allows\
    \ us to search, insert, and delete in $O(h)$ time, where $h$ is the height of\
    \ the tree. In a balanced binary search tree, $h = O(\\log n)$, making these operations\
    \ very fast.\n\n### Operations on Binary Search Trees\n\nThe primary operations\
    \ on a binary search tree are search, insert, and delete.\n\n- Search finds a\
    \ node with a specific key.\n- Insert adds a new key while maintaining the BST\
    \ property.\n- Delete removes a key and rearranges the tree as necessary to maintain\
    \ the BST property.\n\nOne way to implement these operations is using recursion.\n\
    \n```\ndef search(root, key):\n    if root is None:\n        return None\n   \
    \ if root.key == key:\n        return root\n    if key < root.key:\n        return\
    \ search(root.left, key)\n    else:\n        return search(root.right, key)\n\
    ```\n\n```pythondef insert(root, key):\n    if root is None:\n        return Node(key)\n\
    \    if key < root.key:\n        root.left = insert(root.left, key)\n    elif\
    \ key > root.key:\n        root.right = insert(root.right, key)\n    return root\n\
    ```\n\n```python\ndef delete(root, key):\n    if root is None:\n        return\
    \ None\n    if key < root.key:\n        root.left = delete(root.left, key)\n \
    \   elif key > root.key:\n        root.right = delete(root.right, key)\n    else:\n\
    \        if root.left is None:\n            return root.right\n        elif root.right\
    \ is None:\n            return root.left\n        temp = min_value(root.right)\n\
    \        root.key = temp.key\n        root.right = delete(root.right, temp.key)\n\
    \    return root\n```\n\n### Balancing Binary Search Trees\n\nWhile binary search\
    \ trees offer $O(h)$ operations, the height $h$ can be $O(n)$ in the worst case\
    \ (e.g., if the tree is skewed). To ensure $O(\\log n)$ performance, we use balanced\
    \ binary search trees.\n\nAn AVL tree is a self-balancing binary search tree where\
    \ the heights of the two child subtrees of any node differ by at most one. If\
    \ an operation causes this difference to exceed one, rotations are performed to\
    \ rebalance the tree.\n\nRed-black trees are another type of self-balancing BST.\
    \ They use a coloring scheme (red or black) and certain rules to ensure the tree\
    \ remains approximately balanced.\n\n### Representing General Trees as Binary\
    \ Trees\n\nThe left child/right sibling representation is a way to represent a\
    \ general tree as a binary tree. In this representation:\n- The left child of\
    \ a node in the binary tree points to the first child of the general tree.\n-\
    \ The right child of a node in the binary tree points to its next sibling in the\
    \ general tree.\n\nThis allows us to represent any tree using the binary tree\
    \ structure, where each node has at most two pointers.\n\n![image](image/137x001.png)\n\
    \nThe child relationship between nodes in a tree naturally leads to many other\
    \ familial terms for nodes, such as parent, grandparent, sibling, ancestor, and\
    \ descendant. Every node has exactly one parent, except for the root which has\
    \ no parent.\n\nThe depth or level of a node `n` in a tree is defined recursively:\n\
    \n$\\text{depth(n)} = \\left\\{ \\begin{matrix} 1 & \\text{ifnistheroot} \\\\\
    \ {\\text{1} + \\text{depth(parent(n))}} & \\text{otherwise} \\end{matrix} \\\
    right.$\n\nThe height of a tree is its maximum depth. The tree above has height\
    \ 3, and node 25 is on level 2.\n\nAmong the most common trees are binary trees\
    \ in which every node has at most two children, usually named left and right.\
