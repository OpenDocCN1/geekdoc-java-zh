    \ 2.2](#K20431_C002.xhtml_ch2.2) to sort the random data.\n\n7.  It may seem as\
    \ though lines 10 and 12 in [Listing 2.3](#K20431_C002.xhtml_lis2.3) are unnecessary\
    \ optimizations. Replace those lines of code with the simpler alternatives:\n\n\
    \    ```\n     right = mid;\n    ```\n\n    and\n\n    ```\n     left = mid;\n\
    \    ```\n\n    Describe the result.\n\n[1](#K20431_C002.xhtml_ich2fn1)See Column\
    \ 4 from Bentley [[2]](#K20431_bib.xhtml_ref_2). An interesting blog post by Bloch\
    \ [[3]](#K20431_bib.xhtml_ref_3) points out an error even in that version. The\
    \ same error is in [Listing 2.3](#K20431_C002.xhtml_lis2.3) because this code\
    \ is intended for beginners, but interested readers are encouraged to find and\
    \ fix it.\n\nChapter 3\n\n# Integer Stacks\n\nWe now turn to the study of data\
    \ structures. A data structure is just a way of storing data, along with a set\
    \ of operations for manipulating that data. If you have used anything like a list,\
    \ map, array, or dictionary, then you already have some experience with data structures.\
    \ Our purpose here is to begin a systematic study of common data structures, focusing\
    \ on their use, implementation, and performance. More advanced features of Java\
    \ will also be described as we need them along the way.\n\nWe begin with a simple\
    \ data structure known as a stack.\n\n## 3.1 Stack Interface\n\nA stack is an\
    \ abstraction of a vertical stack of physical objects. For example, imagine a\
    \ tall stack of books. It is hard to pull a book out from the middle or bottom\
    \ of the stack. However, it is easy to add a new book to the top of the stack;\
    \ this is called pushing onto the stack. And it is similarly easy to remove the\
    \ top book from the stack, which is called popping the top of the stack.\n\n![image](image/f0047-01.png)\n\
    \nStacks only allow these two ways of adding and removing items: pushing onto\
    \ the top and popping from the top. Stacks are also known as a last-in, firstout\
    \ (LIFO) data structures, because the last element inserted will be the first\
    \ one removed.\n\n[Table 3.1](#K20431_C003.xhtml_Text_Anchor_tab3.1) gives a complete\
    \ list of Integer Stack methods. With it, you can begin writing code using stacks.\
    \ Types described in this way, via a list of public methods, are known as abstract\
    \ data types.\n\nTable 3.1\n\nInteger Stack ADT\n\n| boolean isEmpty()Returns\
    \ true if stack has no elements in it. |\n\n| int peek()Returns item at top of\
    \ stack without removing it. |\n\n| int pop()Returns and removes item from top\
    \ of stack. |\n\n| void push(int item)Adds item to top of stack. |\n\n| int size()Number\
    \ of elements in stack. |\n\n### Abstract Data Types\n\nAn abstract data type\
    \ (ADT) defines the operations of a data type, also known as its interface, without\
    \ specifying the implementation of those operations. This creates an abstraction,\
    \ where interface is separated from implementation in order to hide the details\
    \ of the implementation:\n\n![image](image/f0048-01.png)\n\nAbstract data types\
    \ are usually described by their application programming interface (API), which\
    \ is a list of the public methods available for that type. [Table 3.1](#K20431_C003.xhtml_Text_Anchor_tab3.1)\
    \ gives the API of the Integer Stack ADT.\n\nIn fact, you already have experience\
    \ with this idea. Think about the Java objects you have used so far, such as String,\
    \ StringBuilder, or Random objects. You did not need to know how any of these\
    \ objects were implemented in order to use them, as long as you knew their public\
    \ interfaces. And the Java API documentation [[10]](#K20431_bib.xhtml_ref_10)\
    \ provides exactly this information—the public interface or API—for all Java library\
    \ classes."
