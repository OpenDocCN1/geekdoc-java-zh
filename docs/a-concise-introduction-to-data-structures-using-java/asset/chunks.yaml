  trans: "\n当启用断言（assertions）时，如果条件为假，此语句将抛出 `AssertionError`；否则，什么都不做。断言默认是禁用的，因此要启用它们，请在命令行使用\
    \ `-ea` 或 `-enableassertions` 标志，或将其添加到 IDE 的运行时选项列表中。\n\n断言也可以用于检查后置条件（postconditions），即在方法调用结束时预期为真，或者在代码中任何特定点预期为真的通用不变性（invariants）。\n\
    \n# 练习题\n\n1. 将以下元素序列分别插入空树中，画出生成的二叉搜索树：\n    1. (a) 9, 10, 33, 43, 73, 47, 27,\
    \ 67, 36, 49, 59, 89\n    2. (b) 74, 25, 94, 96, 67, 54, 69, 80, 38, 5, 23, 43\n\
    \    3. (c) 69, 49, 59, 21, 61, 82, 44, 91, 36, 1, 95, 74\n    4. (d) 5, 38, 39,\
    \ 94, 95, 85, 44, 88, 60, 33, 1, 73\n    5. (e) 98, 65, 20, 44, 49, 97, 38, 75,\
    \ 29, 43, 30, 79\n\n2. 描述 Listing 9.3 中递归的边界情况。\n\n3. 通过在 `BinarySearchTree` 类中编写这些方法来实现二叉搜索树的插入：\n\
    \    1. (a) `add()` 参见第 157 页的讨论。\n    2. (b) `addNode()` 实现 Listing 9.3。使用断言来测试前置条件，并记得设置新节点的父引用。\n\
    \n4. 为 `BinarySearchTree` 类中的以下方法添加断言，以测试适当的前置条件：\n    1. (a) `predNode()`\n \
    \   2. (b) `succNode()`\n\n5. 为 `BinarySearchTree` 类编写一个 `main()` 方法，将随机整数插入二叉搜索树并打印结果。\n\
    \n6. 修改之前的练习以测试以下每个查询：\n    1. (a) `contains()`\n    2. (b) `min()`\n    3. (c)\
    \ `max()`\n    4. (d) `pred()`\n    5. (e) `succ()`\n\n7. 为 `BinarySearchTree`\
    \ 类编写一个 `main()` 方法，将几个字符串插入二叉搜索树并打印结果。\n\n8. 根据树的高度 `h`，确定二叉搜索树插入的 `O()` 性能。解释你的答案。\n\
    \n# 9.3 删除\n\n从二叉搜索树中删除节点比其他的树操作更复杂，因为它可能需要改变树的内部结构。例如，插入操作就更简单，因为新节点始终是叶子节点，这意味着对树的其余部分没有影响。\n\
    \n第一步是理解在纸上删除是如何工作的。记住，最终结果必须是一个有效的二叉搜索树。\n\n### 手动删除\n\n在二叉搜索树中删除节点的过程取决于它拥有的孩子数量。\n\
    \n**0 个孩子**\n手动删除叶子节点很容易，因为它不会影响树的其余部分。例如，在 във树中删除 12 只需移除该节点：\n\n![image](img/159x001.png)\n\
    \n**1 个孩子**\n删除像 51 这样只有一个孩子的节点也不困难，因为我们可以将其唯一的孩子 61 向上移动来取代它：\n\n![image](img/160x001.png)\n\
    \n**2 个孩子**\n然而，没有可以在破坏二叉搜索树的情况下删除具有两个子节点的节点。考虑在我们刚刚完成的树中删除 38：\n\n![image](img/160x002.png)\n\
    \n它的两个孩子都无法在根节点处取代 38 的位置：如果 25 向上移动，其左侧会出现过大的节点；同样，如果 61 向上移动，其右侧会出现过小的节点。（同样也不清楚我们该如何处理\
    \ 25 或 61 的孩子。）我们采用的解决方案是在别处寻找替代品：中序前驱（inorder predecessor），在这种情况下是 31。它与树中的其他元素具有正确的关系，可以取代\
    \ 38 的位置：\n\n![image](img/160x003.png)\n\n出于相同的原因，也可以使用中序后继。\n\n这种删除具有两个孩子的节点\
    \ `n` 方法涉及两个步骤：\n1. 将前驱的值复制到 `n`。\n2. 删除前驱节点。\n\n例如，要删除此树中的 38，找到它的前驱 31，并将该值复制到\
    \ 38 所在的位置：\n\n![image](img/160x004.png)\n\n然后删除前驱：\n\n![image](img/161x001.png)\n\
    \n### 无两个孩子的节点\n\n删除具有一个孩子的节点涉及用它的孩子替换它。删除没有孩子的节点也可以以相同的方式看待：它可能为空。仍然有三种情况，取决于\
    \ `n` 与父节点的关系：\n\n![image](img/161x002.png)\n\n将所有内容整合有助于 Listing 9.4，它概述了 `remove()`\
    \ 方法。\n\n**Listing 9.4: 树删除（伪代码）**\n```\n如果 n.left 为空\n   用 n.right 替换 n\n否则如果\
    \ n.right 为空\n   用 n.left 替换 n\n否则\n   找到 n 前驱\n   将前驱的数据复制到 n\n   递归删除\n```\n"
- fmt: "\nWe began this chapter by expressing the goal of a data structure that provides\
    \ fast search, insertion, and deletion. To see how well binary search trees perform,\
    \ it will help to review a few simpler alternatives. The tables below show a single\
    \ entry for searches because both successful and unsuccessful searches exhibit\
    \ similar `O()` performance, but keep in mind that in other circumstances, they\
    \ may be different.\n\n### Unsorted Lists\n\nAn unsorted list could be implemented\
    \ with either an array or linked list. Both display similar worst-case performance\
    \ characteristics:\n\n|  | Search | Insert | Delete |\n| --- | --- | --- | ---\
    \ |\n| Unsorted Array | `O(n)` | `O(1)` | `O(n)` |\n| Unsorted Linked List | `O(n)`\
    \ | `O(1)` | `O(n)` |\n\n### Sorted Lists\n\nSorted lists provide a potential\
    \ advantage over unsorted lists in searching. This gain is only for arrays, however,\
    \ and even there, comes at a cost of slower insertion:\n\n|   | Search | Insert\
    \ | Delete |\n| --- | --- | --- | --- |\n| Sorted Array | `O(log n)` | `O(n)`\
    \ | `O(n)` |\n| Sorted Linked List | `O(n)` | `O(n)` | `O(n)` |\n\n### Binary\
    \ Search Trees\n\nOur analysis of binary search trees to this point has been in\
    \ terms of `h`, the height of the tree. Their general performance is:\n\n|  |\
    \ Search | Insert | Delete |\n| --- | --- | --- | --- |\n| Binary Search Tree\
    \ | `O(h)` | `O(h)` | `O(h)` |\n\nAnalyzing these operations in terms of the number\
    \ of nodes in the tree, `n`, requires translating from `h` to `n`. The basic relationship\
    \ between `n` and `h` is:\n\n`log n < h ≤ n`\n\nThis numeric relationship is expressed\
    \ visually by the vastly different shapes binary search trees can have. Consider\
    \ the two extremes when `n = 7`:\n\n![image](image/164x001.png)\n\nThus, the worst-case\
    \ performance for search, insert, and delete in terms of `n` does not look good:\n\
    \n|  | Search | Insert | Delete |\n| --- | --- | --- | --- |\n| Binary Search\
    \ Tree (Worst Case) | `O(n)` | `O(n)` | `O(n)` |\n\nThe best case is much better:\n\
    \n|  | Search | Insert | Delete |\n| --- | --- | --- | --- |\n| Binary Search\
    \ Tree (Best Case) | `O(logn)` | `O(logn)` | `O(logn)` |\n\nbut we should be skeptical\
    \ of best-case performance most of the time.\n\nIntuitively, most trees will fall\
    \ somewhere in between, but what will their performance (and shape) look like?\
    \ What is the shape of an “average” binary search tree? One approach is to consider\
    \ random elements added to an empty binary search tree. In that case, `h` is `O(log\
    \ n)` (see Cormen et al. [[6]](#K20431_bib.xhtml_ref_6) for a proof), and so we\
    \ can expect that performance with random data:\n\n|  | Search | Insert | Delete\
    \ |\n| --- | --- | --- | --- |\n| Binary Search Tree (Random) | `O(log n)` | `O(log\
    \ n)` | `O(log n)` |\n\nIt is important to understand this feature of binary search\
    \ trees. Their performance is generally fast for all operations, `O(log n)`, but\
    \ this bound is not guaranteed. All that is guaranteed is `O(h)`, and the worst\
    \ case is still `O(n)`. Balanced binary search trees use various techniques to\
    \ guarantee that `h` is `O(log n)`; see Cormen et al. [[6]](#K20431_bib.xhtml_ref_6)\
    \ for the example of red-black trees.\n\n### Exercises\n\n1. Briefly explain each\
    \ of the entries for the worst-case performance of unsorted lists.\n2. Briefly\
    \ explain each of the entries for the worst-case performance of sorted lists.\n\
    3. Explain why `log n < h ≤ n` in any binary tree, where `h` is the height of\
    \ the tree and `n` is the number of nodes in the tree.\n4. Average-case performance\
    \ is easier to analyze for unsorted and sorted lists than binary search trees.\n\
    \    1. (a) Create a table of the average-case performance of search, insert,\
    \ and delete for unsorted lists, explaining each entry.\n    2. (b) Create a table\
    \ of the average-case performance of search, insert, and delete for sorted lists,\
    \ explaining each entry.\n5. Draw all 14 different binary search trees with `n\
    \ = 4` elements, and then use them to calculate the average height of a binary\
    \ search tree of size four.\n6. A simple method of allowing duplicate entries\
    \ in a binary search tree is to change the insertion algorithm in [Listing 9.3](#K20431_C009.xhtml_lis9.3)\
    \ to add duplicates in one direction:\n\n```\nIf data < n.data\n```\n\n```\nInsert\
    \ on left\n```\n\n```\nElse\n```\n\n```\nInsert on right\n```\n    1. (a) Modify\
    \ your code to use this algorithm.\n    2. (b) Describe why this strategy may\
    \ have a negative impact on performance.\n    3. (c) Outline a different strategy\
    \ that should reduce this negative impact.\n    4. (d) Implement your strategy.\n\
    7. Deleting the predecessor instead of the original node when a node has two children\
    \ may have a negative impact on performance over time.\n    1. (a) Explain the\
    \ reason for this effect.\n    2. (b) Outline a different deletion strategy that\
    \ should reduce this negative impact.\n\n# Heaps\n\nThe heap structure provides\
    \ fast search, insertion, and deletion. Like binary search trees, heaps are binary\
    \ trees, but they allow their height is always `logn`.\n\n## 10.1 Priority Queue\
    \ Interface and Array-Based Heaps\n\nPriority queues and heaps are closely related\
    \ because heaps are often used as the underlying data structure for the priority\
    \ queue.\n\nA priority queue is an ordered structure in which items are removed\
    \ in priority rather than first-in, first-out like a regular queue. Priority Queue\
    \ Interface\n\nIf you consider the other data structures we have studied (see\
    \ Exercise 3), none of them quite fit this interface. Heaps, on the other hand,\
    \ work nicely.\n\n### Heap Data Structure\n\nThere are actually two types of heaps,\
    \ max-heaps and min-heaps, since notions of priority can be based on either larger\
    \ or smaller values.\n\nMax-Heaps are complete binary trees (defined shortly)\
    \ in which every element has value greater than or equal to that of its children.\n\
    \nTable 10.1 Priority Queue ADT\n\n| void add(E item)Inserts item into priority\
    \ queue. |\n| boolean isEmpty()True if priority queue has no elements. |\n| E\
    \ peek()Returns highest priority item without removing. |\n| E remove()Removes\
    \ and returns highest priority item. |\n| int size()Number of elements in priority\
    \ queue. |\n\nMin-Heaps are complete binary trees in which every element has value\
    \ less than or equal to its children.\n\nThis requirement that parents have a\
    \ larger or smaller value than their children is known as the heap property.\n\
    \nThe most important consequence of the heap property is that the largest element\
    \ in a max-heap is always at the top of the heap. Similarly, the smallest element\
    \ in a min-heap is at the top. This makes finding the item with highest priority\
    \ easy in a heap.\n\n### Complete Binary Trees\n\nA complete binary tree is a\
    \ binary tree in which every level except the last has all possible nodes, and\
    \ on the last level, nodes fill in from the left. For example, the tree on the\
    \ left is complete but the tree on the right is not: Complete\n\n![image](image/168x001.png)\n\
    \nThe reason for defining “complete” in this way is that it allows for an efficient\
    \ array implementation.\n\n### Array-Based Binary Trees\n\nGeneral binary trees\
    \ benefit from the flexibility of a node-based implementation because of the wide\
    \ variety of shapes they can have. Putting a tight restriction on the tree shape\
    \ by requiring it to be complete leads to an efficient, array-based alternative\
    \ to using linked nodes.\n"
