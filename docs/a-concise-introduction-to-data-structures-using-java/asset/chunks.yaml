  trans: "\n\n# 字符串方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `char charAt(int i)` | 索引\
    \ `i` 处的字符。 |\n| `int indexOf(String s)` | `s` 在此字符串中首次出现的索引，若未找到则返回 `-1`。 |\n\
    | `int indexOf(String s, int start)` | 从索引 `start` 开始，`s` 在此字符串中首次出现的索引，若未找到则返回\
    \ `-1`。 |\n| `int length()` | 字符串中字符的数量。 |\n| `String substring(int i)` | 从索引\
    \ `i` 开始的子字符串。 |\n| `String substring(int i, int j)` | 从索引 `i` 到 `j - 1` 的子字符串。\
    \ |\n| `String toLowerCase()` | 返回全小写的副本。 |\n| `String toUpperCase()` | 返回全大写的副本。\
    \ |\n| `String trim()` | 返回去除了两端空白字符的副本。 |\n\n字符串可以被视为字符的序列，索引从 0 开始，例如：\n\n|\
    \ 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\
    \ :--- | :--- |\n| A | | s | t | r | i | n | g |\n\n表 1.4 中的几个方法是基于这种索引的。\n\n\
    需要注意的是，名称听起来可能可能会更改字符串的方法（如 `toLowerCase()`、`trim()` 等）并不会改变它们被调用的字符串。这是因为字符串是不可变的（immutable）；它们永远不会改变。相反，此类方法总是返回原始字符串的一个修改后的副本。\n\
    \n请参阅 Java API 文档 [[10]](#K20431_bib.xhtml_ref_10) 以获取完整的字符串方法列表。\n\n## 比较字符串\n\
    \n通常情况下，引用类型的比较方式与基本类型不同，无论对于相等性还是不相等性都是如此。我们将逐渐学习这些差异，但目前我们重点关注如何比较字符串。表 1.5\
    \ 列出了主要的字符串比较方法。\n\n### 表 1.5: 字符串比较\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `int compareTo(String\
    \ s)` | 如果此字符串在字母顺序上于 `s` 之前则返回负数，相等则返回零，在字母顺序上之后则返回正数。 |\n| `int compareToIgnoreCase(String\
    \ s)` | 与 `compareTo()` 相同，但忽略忽略大小写。 |\n| `boolean equals(Object o)` | 如果 `o`\
    \ 是一个与此字符串内容相同的字符串，则返回 true。 |\n| `boolean equalsIgnoreCase(String s)` | 如果 `s`\
    \ 与此字符串内容相同（忽略大小写），则返回 true。 |\n\n比较字符串有两个基本规则：\n\n* 如果你想知道两个字符串的内容是否相同，请使用 `equals()`。不要使用\
    \ `==`。注意，代码列表 1.2 中的第 7 行使用了 `equals()` 来比较每个片段与目标。\n* 如果你想按照字母顺序比较字符串，请使用 `compareTo()`。不要尝试使用\
    \ `<`、`>` 或其他的数值比较。\n\n注意：编译器允许你对字符串使用 `==`，但那几乎不是你想要的。另一方面，编译器不允许你对字符串使用其他的比较方法。\n\
    \n`compareTo()` 方法是基于字符串中字符的 ASCII 编码的，因此大写字母在它们对应的小写等效字母之前。例如：\n\n```\n\"apple\"\
    .equals(\"banana\")    // false\n```\n\n```\n\"apple\".compareTo(\"banana\") \
    \   // negative\n```\n\n```\n\"apple\".compareTo(\"BANANA\")    // positive\n\
    ```\n\n```\n\"apple\".compareToIgnoreCase(\"BANANA\")  // negative\n```\n\n不要担心\
    \ `compareTo()` 方法返回的精确值：在程序中，你只需要测试值是正的还是负的即可。\n\n`equals()` 和 `==` 之间的差异适用于所有的\
    \ Java 对象，而不仅仅是字符串，因此我们将在第 1.4 节 中回到这一区别。稍后，在第 5.3 节中，我们将解释 `equals()` 的参数是 `Object`\
    \ 的原因。现在只需将其视为第二个字符串即可。\n\n## 练习\n\n1. 假设 `s = \"data structures\"`。给出以下每个表达式的值：\n\
    \    * (a) `s.length()`\n    * (b) `s.charAt(5)`\n    * (c) `s.indexOf(\"a\")`\n\
    \    * (d) `s.indexOf(\"m\")`\n    * (e) `s.indexOf(\"struct\")`\n    * (f) `s.indexOf(\"\
    t\", 3)`\n    * (g) `s.indexOf(\"t\", 7)`\n    * (h) `s.indexOf(\"d\", 0)`\n \
    \   * (i) `s.indexOf(\"d\", 1)`\n    * (j) `s.substring(5)`\n    * (k) `s.substring(1,\
    \ 3)`\n    * (l) `s.toUpperCase()`\n2. 假设 `t = \"Java programming language\"`。给出以下每个表达式的值：\n\
    \    * (a) `t.length()`\n    * (b) `t.charAt(0)`\n    * (c) `t.indexOf(\"s\")`\n\
    \    * (d) `t.indexOf(\"n\")`\n    * (e) `t.indexOf(\"gram\")`\n    * (f) `t.indexOf(\"\
    g\", 9)`\n    * (g) `t.indexOf(\"g\", 16)`\n    * (h) `t.indexOf(\"r\", 6)`\n\
    \    * (i) `t.indexOf(\"r\", 7)`\n    * (j) `t.substring(5)`\n    * (k) `t.substring(5,\
    \ 12)`\n    * (l) `t.toUpperCase()`\n3. 假设 `s = \"stack\"`，`t = \"queue\"`，`u\
    \ = \"Stack\"`。给出以下每个值：\n    * (a) `s.equals(t)`\n    * (b) `s.equals(u)`\n  \
    \  * (c) `s.equalsIgnoreCase(t)`\n    * (d) `s.equalsIgnoreCase(u)`\n4. 假设 `s\
    \ = \"stack\"`，`t = \"queue\"`，`u = \"Stack\"`。判断以下每个值是正、负还是零：\n    * (a) `s.compareTo(t)`\n\
    \    * (b) `s.compareTo(u)`\n    * (c) `s.compareToIgnoreCase(t)`\n    * (d) `s.compareToIgnoreCase(u)`\n\
    5. 假设 `s` 是字符串 \"abcd\"。通过以下表达式返回：\n    * (a) `s.length()`\n    * (b) `s.charAt(2)`\n\
    \    * (c) `s.substring(2, 4)`\n    * (d) `s.substring(3)`\n6. 假设 `s` 和 `t` 是字符串：\n\
    \    * (a) 写一个 if 语句，当 `s` 和 `t` 内容相同时执行。\n    * (b) 写一个 if 语句，当 `s` 和 `t` 内容不同时执行。\n\
    \    * (c) 写一个 if 语句，当 `s` 在字母顺序上于 `t` 之前时执行。\n7. 修改代码列表 1.2 中的第 7 行，使用 `==` 代替\
    \ `equals()`。描述结果。\n8. 修改代码列表 1.2 以编写一个忽略大小写的 `countIgnoreCase()` 方法。在 `main()`\
    \ 中测试它。\n9. 编写代码列表 1.2 的 `count2()` 版本，使用 `while` 循环和字符串 `indexOf()` 方法来搜索目标。使用两个参数的\
    \ `indexOf()` 版本。将你的函数添加到 `StringFunctions` 并在 `main()` 中测试。\n10. 通过实验或查询文档确定字符串\
    \ `compareTo()` 方法的值。\n\n## 1.3 数组\n\n数组是一种简单的数据结构，为我们将要学习的其他复杂结构提供了基础。它们也是引用类型的第二个示例。代码列表\
    \ 1.3 展示了如何使用数组结合标准搜索技术——线性搜索。\n\n```\npublic class ArrayFunctions {\n  public\
    \ static int linearSearch(int[] data, int target) {\n    for (int i = 0; i < data.length;\
    \ i++) {\n      if (target == data[i]) return i;\n    }\n    return -1;\n  }\n\
    \n  public static void main(String[] args) {\n    int[] data = {3, 14, 7, 22,\
    \ 45, 12, 19, 42, 6};\n    System.out.println(\"Search for 7: \" + linearSearch(data,\
    \ 7));\n    System.out.println(\"Search for 100: \" + linearSearch(data, 100));\n\
    \  }\n}\n```\n\n"
- fmt: "\nNo actual array is created by declaring a variable with an array type. This\
    \ is because array types are reference types, and so declaring an array type variable\
    \ simply sets aside storage for this variable to eventually hold a reference to\
    \ an actual array. Creating the array is a separate step.\n\n### Creating Arrays\n\
    \nThere are two main ways to create an array: with an initializer or using `new`.\
    \ An initializer is appropriate when the array contains a small number of known\
    \ items, as in line 10 of [Listing 1.3](#K20431_C001.xhtml_lis1.3). The syntax\
    \ of an array initializer is:\n\n```\narrayRef = {item, item, ..., item};\n```\n\
    \nMore often, `new` is used with a type and square brackets to create an array\
    \ of a given size:\n\n```\narrayRef = new type[N];\n```\n\nHere the type used\
    \ with `new` must be compatible with the type that was used to declare the array\
    \ variable, and `N` specifies the size of the new array, also known as its length.\
    \ An array created with `new` begins with the default initial value at each index.\
    \ For numeric types, the default is zero; for reference types the default is the\
    \ null reference (see [Section 1.4](#K20431_C001.xhtml_ch1.4)).\n\nThe length\
    \ of an array is accessible in its length field:\n\n```\narrayRef.length\n```\n\
    \nSee, for example, line 3 in [Listing 1.3](#K20431_C001.xhtml_lis1.3). The length\
    \ of an array is fixed at the time it is created and can never change. However,\
    \ an array variable can be reassigned at any time to point to a different array\
    \ object that has a different length.\n\n### Accessing Array Elements\n\nItems\
    \ in an array are accessed by their index or location in the array. Indices are\
    \ numbered starting at 0, so an array with 9 items in it such as data in [Listing\
    \ 1.3](#K20431_C001.xhtml_lis1.3) has indices 0 through 8. We visualize the data\
    \ array like this:\n\n![image](image/017x001.png)\n\nThe item at index `i` in\
    \ an array is accessed using square brackets:\n\n```\narrayRef[i]\n```\n\nFor\
    \ example, `data[2]` is 7, and `data[7]` is 42.\n\nJava performs automatic bounds\
    \ checking on all array accesses. If an invalid index is used, an `ArrayIndexOutOfBoundsException`\
    \ is thrown, generally stopping execution of your program.\n\n### Enhanced For-Loop\n\
    \nJava collections, including arrays, support a simplified for statement that\
    \ allows looping over each item in the collection. Known as the enhanced for-loop,\
    \ the syntax is:\n\n```\nfor (type variable : collection) {\n    body;\n}\n```\n\
    \nThis loop will execute once for each item in the collection. Inside the body\
    \ of the loop, each item is stored in `variable`. The type specified for the `variable`\
    \ has to match the type of each item in the collection.\n\nFor example, consider\
    \ the `data` array from the `main()` method in [Listing 1.3](#K20431_C001.xhtml_lis1.3).\
    \ It is declared as `int[]`, and so the item type for an enhanced for-loop using\
    \ that array should be `int`. This loop prints all of the items in the array:\n\
    \n```\nfor (int item : data) {\n    System.out.println(item);\n}\n```\n\nThe enhanced\
    \ for-loop is quite nice in situations when you do not otherwise need the array\
    \ indices.\n\n### Linear Search\n\nThe method in [Listing 1.3](#K20431_C001.xhtml_lis1.3)\
    \ solves the search problem:\n\n> Given an array `data` and a particular value\
    \ `target`, determine whether or not `target` appears as an element in `data`.\
    \ If it does, return the smallest index where it occurs; otherwise, return −1.\n\
    \nWe solve the search problem by producing an algorithm. An algorithm is a specific\
    \ sequence of computable steps designed to solve a particular problem. Notice\
    \ that this definition contains several vague terms; for our purposes, an algorithm\
    \ will simply be a program that solves a problem.\n\nLinear search, also known\
    \ as sequential search solves the search problem by examining each element in\
    \ the array, one at a time beginning at item 0, keeping track of the current index.\
    \ If the item is found, the corresponding index is returned; otherwise, if after\
    \ looking at every element the item has not been found, it returns −1.\n\nBecause\
    \ the problem statement specifies returning the index where the element is found,\
    \ we need to loop over indices rather than, say, the elements in the array.\n\n\
    ### Exercises\n\n1. Write a Java statement to declare each of these array references:\n\
    \    - (a) An `int` array named `counts`\n    - (b) A `double` array named `times`\n\
    \    - (c) A `boolean` array named `visible`\n    - (d) A `String` array named\
    \ `names`\n2. Use an initializer to write a Java statement to declare and create\
    \ each of these arrays:\n    - (a) An `int` array named `counts` with contents\
    \ 18, 3, 9, 22, 11, 4.\n    - (b) A `double` array named `times` with contents\
    \ 1.52, 1.98, 1.44, 1.63, 1.67.\n    - (c) A `boolean` array named `visible` with\
    \ contents T, F, F, T, F.\n    - (d) A `String` array named `names` with contents\
    \ “Alice,” “Bob,” “Carol,” “Dave.”\n3. Write a Java statement to declare each\
    \ of these array references and create each:\n    - (a) An `int` array named `counts`\
    \ of length 10\n    - (b) A `double` array named `times` of length 40\n    - (c)\
    \ A `boolean` array named `visible` of length 100\n    - (d) A `String` array\
    \ named `names` of length 100\n4. Use an enhanced for-loop to print every item\
    \ in each of these:\n    - (a) An `int` array named `counts`\n    - (b) A `double`\
    \ array named `times`\n    - (c) A `boolean` array named `visible`\n    - (d)\
    \ A `String` array named `names`\n5. Use [Listing 1.3](#K20431_C001.xhtml_lis1.3)\
    \ to:\n    - (a) Determine the name and type of the parameter to `main()`.\n \
    \   - (b) Explain why the for-loop on line 3 uses less than rather than less or\
    \ equal to.\n    - (c) Trace the execution of the first call to `linearSearch()`\
    \ on line 12.\n    - (d) Trace the execution of the second call to `linearSearch()`\
    \ on line 14.\n6. Explain why it works to use `==` in line 4 of `linearSearch()`.\
    \ Would substituting `equals()` also work?\n7. Add an enhanced for-loop to `main()`\
    \ in [Listing 1.3](#K20431_C001.xhtml_lis1.3) that searches for every element\
    \ in the array.\n8. Write a `sum(int[] data)` method for the `ArrayFunctions`\
    \ class that returns the sum of the elements in the array. Test your implementation\
    \ in `main()`.\n9. Write a `max(int[] data)` method for the `ArrayFunctions` class\
    \ that returns the value of the largest element in the given array. Assume the\
    \ array is nonempty, and test your implementation in `main()`.\n10. Write a `min(int[]\
    \ data)` method for the `ArrayFunctions` class that returns the value of the smallest\
    \ element in the given array. Assume the array is nonempty, and test your implementation\
    \ in `main()`.\n11. Write a `display(int[] data)` method for the `ArrayFunctions`\
    \ class that prints the contents of the given array on one line. Use `print()`\
    \ for each element, but finish with a final `println()` so that future output\
    \ appears on its own line. Test your implementation in `main()`.\n\n## 1.4 Using\
    \ Objects\n\nJava is an object-oriented programming language, and so, learning\
    \ to use objects is one of the keys to successfully adapting to the language.\
    \ You have seen two types of objects so far, strings and arrays. Each of those\
    \ is somewhat unique; this section uses a more representative example to convey\
    \ the general ideas.\n\nObjects are defined by classes. In this section, we focus\
    \ on how to use objects; in the next section, we look at how to write our own\
    \ classes. In addition to using a new object, [Listing 1.4](#K20431_C001.xhtml_lis1.4)\
    \ ties together some ideas from the last two sections. Before looking at the details\
    \ of how the `StringBuilder` class and the `split()` method are used in it, we\
    \ consider some general issues involved in using Java objects.\n\n### Declaring\
    \ Object References\n\nObject references are declared in the same way as primitive\
    \ variables:\n\n```\ntype referenceVariable;\n```\n\nListing 1.4: Acronym\n\n\
    ```\n1  // Add to class StringFunctions:\n```\n"
