    \ a short array of integers.\n\n8.  Add randomFill() from [Listing 2.2](#K20431_C002.xhtml_lis2.2)\
    \ to the ArrayFunctions class. Include code in main() to test insertion sort on\
    \ an array of 100 random integers.\n\n9.  Write an isSorted(int[] data) method\
    \ in the ArrayFunctions class that returns true if the array is sorted and false\
    \ otherwise. Use it in main() to test insertion sort.\n\n10.  Write an overloaded\
    \ version of randomFill(int[] data) that does not limit the size of the random\
    \ integers it fills the array with. Test your method in main().\n\n11.  Measure\
    \ the performance of insertion sort on random integers. Begin with an array of\
    \ size n = 100 and double the array size up to 200,000\\. Use the version of randomFill()\
    \ from Exercise 10\\. Report your results and observations.\n\n12.  Test these\
    \ methods from the exercises of [Section 1.3](#K20431_C001.xhtml_ch1.3) on random\
    \ integer arrays of size 100:\n\n    1.  (a) sum() method from Exercise 9.\n\n\
    \    2.  (b) max() method from Exercise 10.\n\n    3.  (c) min() method from Exercise\
    \ 11.\n\n    4.  (d) display() method from Exercise 12.\n\n13.  Selection sort\
    \ is another natural sorting method that begins by finding the smallest element\
    \ in the array and swapping it with the first. Then the second-smallest element\
    \ is found and swapped with the second, and so on until the array is sorted.\n\
    \n    1.  (a) Show the operation of selection sort on the arrays in Exercise 3.\n\
    \n    2.  (b) Implement a selectionSort() method in the ArrayFunctions class with\
    \ tests in main().\n\n    3.  (c) Determine the O() time complexity of selection\
    \ sort.\n\n    4.  (d) Measure the performance of selection sort as in Exercise\
    \ 11.\n\n    5.  (e) Compare selection sort with insertion sort in terms of how\
    \ sensitive the performance of each is to the order of the original data.\n\n\
    ## 2.3 Searching: Binary Search\n\nWe have already seen one search algorithm:\
    \ linear search in [Section 1.3](#K20431_C001.xhtml_ch1.3). It works by checking\
    \ each item, one by one, until it finds the search target. Linear search has O(n)\
    \ performance, which is reasonable if the list of elements is not too long."
