    \n### 对象引用\n\n回想引用类型使用引用指向它们所引用的对象，而不是像基本类型那样直接存储数据。给定以下赋值：\n\n```\nint x = 17;\n\
    ```\n\n```\nString s = \"This is a string\";\n```\n\n像这样想象区别是有帮助的：\n\n![image](img/022x001.png)\n\
    \n因为 `s` 的实际内容是对字符串对象的引用。Java 引用也被称为指针，因为它们指向对象；但请注意，在其他语言中指针和引用之间可能存在差异。如果创建了另一个引用并赋予它与\
