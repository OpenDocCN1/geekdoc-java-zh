  trans: "\n\n这意味着 `Number` 类（我们尚未见过）捕获了所有数值包装类以及其他数值类的共同状态和行为。\n\n事实上，每个 Java 类都直接或间接地继继承自\
    \ `Object` 类。换句话说，`Object` 类是整个继承层次结构的根节点。我们将在本节末尾回到 `Object` 类的作用。\n\n### Is-A\
    \ 和 Has-A 关系\n\n继承模型了“是”（is-a）关系：\n\n- `Double` 是一个 `Number`\n- `Number` 是一个 `Object`\n\
    - `FixedLengthQueue` 是一个 `Queue`\n\n另一种常见的关系是“拥有”（has-a），当一个对象拥有该类型的组件时就会使用：\n\
    \n- `ArrayQueue` 拥有一个 `size`\n- `Fraction` 拥有一个 `numerator`\n- 数组有一个 `length`\n\
    \nHas-a 关系通过组合（composition）建模，这只是简单地使用实例变量来存储组件。在这两种关系之间做出选择是软件设计的重要组成部分。\n\n\
    ### 实现\n\n固定长度队列类似于 `ArrayQueue`，其不同之处在于其底层数组的大小永远不会改变。因此，我们在 `Listing 5.2` 中将其实现为\
    \ `ArrayQueue` 类的扩展。如果在队列满时尝试入队，项将被丢弃，而不是调整数组大小，并且队列将跟踪丢弃项的总数。\n\nListing 5.2:\
    \ 固定长度队列\n\n```java\n 1 public class FixedLengthQueue<E> extends ArrayQueue<E>\
    \ {\n 2 private int drops;\n 3\n 4 public FixedLengthQueue(int capacity) {\n 5\
    \  super(capacity);\n6}\n 7\n 8 @Override\n 9 public void enqueue(E item) {\n\
    10  if (size == capacity) {\n11  drops++;\n12 } else {\n13  super.enqueue(item);\n\
    14 }\n15 }\n16 \n17  public int drops() {\n18  return drops;\n19 }\n20}\n```\n\
    \n### Java 类扩展\n\n`extends` 子句用于声明一个新类为现有类的子类：\n\n```java\npublic class SubClass\
    \ extends SuperClass {...}\n```\n\n子类随后从指定的父类继承类成员（字段、方法和嵌套类）。子类内部也可以声明新的实例变量和方法，如\
    \ `Listing 5.2` 中的第 2 行和从第 17 行开始的内容。\n\n如果父类实现了一个接口，子类也会实现，因为它继承了父类的公共成员。\n\n\
    ### 子类构造函数\n\n如果你为子类编写了一个构造函数，它必须做的第一件事是使用 `super` 调用父类的构造函数：\n\n```java\nsuper(arguments);\n\
    ```\n\n唯一不需要这样做的情况是构造函数正在使用 `this()` 调用子类的另一个构造函数。第 5 行构造函数中的 `super()` 调用假设一个带有整数类型\
    \ `capacity` 参数的构造函数是 `ArrayQueue` 类的一部分（见练习 4）。\n\n### 方法重写\n\n在子类中重新定义父类的方法称为方法重写（overriding）。在这种情况下，我们从第\
    \ 9 行开始重写了 `enqueue()` 方法，以便在实际入队项之前检查大小。`@Override` 注解向编译器和读者表明，我们打算重写一个现有方法，而不是定义一个新方法。\n\
    \n在重写的方法体内部可以使用 `super` 调用现有的父类方法：\n\n```java\nsuper.method(arguments)\n```\n\n\
    在 `Listing 5.2` 中，一旦 `enqueue()` 方法确定队列不会溢出，就会在第 13 行调用父类方法。\n\n### 父类中的受保护字段\n\
    \n除了确保有一个带有容量参数的构造函数外，还需要对现有的 `ArrayQueue` 父类进行另一个更改，以便该子类能够编译。目前，子类无法使用实例变量 `size`\
    \ 和 `capacity`，因为它们在 `ArrayQueue` 中被（或应该）声明为 `private`。声明为 `private` 的类成员无法在该类的任何地方使用，即使在子类中。\n\
    \n由于子类访问某些实例变量或内部方法是合理的，Java 为这种情况提供了第三种可见性选项 `protected`。受保护的类成员可以被子类以及类本身访问，但不能类类。\n\
    \n### Object 类\n\n表 5.2 列出了 `Object` 类中定义的两个最重要的方法。由于每个类都是 `Object` 类的扩展，每个 Java\
    \ 对象（包括数组）都继承了这些方法以及文档中列出的其他方法。\n\n表 5.2: Object 方法\n\n| 方法 | 描述 |\n| :--- | :---\
    \ |\n| `boolean equals(Object o)` | 如果此对象和 `o` 是同一个对象，则为真。 |\n| `String toString()`\
    \ | 返回此对象的字符串。 |\n\n`Objects` 的 `equals()` 含义与 `==` 相同，但类可以重写 `equals()` 来定义它们自己的相等性概念。`toString()`\
    \ 方法返回对象的字符串表示。\n\n"
- fmt: "\n```java\nfor (int i = 0; i < 100; i++) {\n    q.enqueue(i);\n}\nSystem.out.println(q.drops());\n\
    ```\n\n9. Using inheritance, write a `FixedLengthStack<E>` class to represent\
    \ a fixed-size stack that drops pushed elements if the stack is full. Include\
    \ any necessary changes to the superclass.\n\n## Project: Fixed-Length Queue Simulation\n\
    \nA natural question arises with fixed-length queues: how important is the size\
    \ of the queue under heavy traffic? If many items are being dropped, is it worth\
    \ investing in a larger queue? If so, how large? This project develops a simulation\
    \ to help answer questions like these.\n\n### Model\n\nImagine a generic “processor”\
    \ with an input queue that receives tasks and processes them, like the stages\
    \ in a GPU or a network router. Each task has a given integer length of time that\
    \ it will take to complete on the processor. If the processor is busy with one\
    \ task and receives another, it uses a fixed-length queue to store the waiting\
    \ tasks. Once a processor finishes a task, it begins working on the next task\
    \ in its queue. A processor with no work to do is considered free.\n\n`Table 5.3`\
    \ lists a set of public methods for a simulated processor. Tasks are represented\
    \ simply by the integer amount of time they take to complete.\n\nTable 5.3: Simulated\
    \ Processor\n\n| Method | Description |\n| :--- | :--- |\n| `void addTask(int\
    \ taskTime)` | Accepts new task of given length of time. If free, this becomes\
    \ the current task; otherwise, adds task to queue. |\n| `int drops()` | Number\
    \ of items dropped by queue. |\n| `boolean free()` | True if not processing a\
    \ task and queue is empty. |\n| `void tick()` | Simulates one time step. If busy,\
    \ does one unit of work on current task. If current task finishes, checks queue\
    \ for next one to start. |\n\n### Clock-Based Simulations\n\nSimulations often\
    \ use an integer counter to simulate a clock, where incrementing or decrementing\
    \ the counter corresponds to one tick of the clock. This processor simulation\
    \ will randomly generate new tasks for a certain amount of time `minTime` and\
    \ then continue running until all tasks are finished. `Listing 5.3` describes\
    \ one way to organize the simulation with a clock variable `t`.\n\nListing 5.3:\
    \ Clock-Based Simulation (Pseudocode)\n\n```\n1 t = 0\n2 while (t < minTime or\
    \ processor is busy)\n3 if (t < minTime) randomly add new task to processor\n\
    4 simulate one time step on processor\n5 t++\n```\n\n### Random Tasks\n\nSimulation-based\
    \ programs use a variety of techniques to generate random sequences of events.\
    \ We will use the following simplified model to simulate a random series of tasks\
    \ for the processor: during each time step of the simulation, there is probability\
    \ `taskChance` (between 0 and 1) of creating a new random task. Each task will\
    \ require processing time of some random integer number of steps between 1 and\
    \ a fixed upper limit `maxTaskTime`. `Listing 5.4` outlines this procedure in\
    \ pseudocode.\n\nListing 5.4: Generate Random Tasks (Pseudocode)\n\n```\n1 r =\
    \ random double from [0, 1)\n2 if (r < taskChance)\n3 taskTime = random int from\
    \ 1 to maxTaskTime\n4 add task with length taskTime to processor\n```\n\n### Exercises\n\
    \n1. Write a `Processor` class to represent a single processor, implementing the\
    \ public methods from `Table 5.3`. The `Processor` constructor should take a parameter\
    \ specifying the capacity of its fixed-length queue.\n\n2. Write a `QueueSimulator`\
    \ class to drive the simulation of one processor. Include one public method:\n\
    \n```java\nvoid run(int queueLength, int minTime, int maxTaskTime, double taskChance)\n\
    ```\n\nthat implements `Listing 5.3`. It should call a separate method implementing\
    \ `Listing 5.4`. At the end of the `run()` method, display the number of tasks\
    \ processed, the percentage of tasks dropped, and the amount of extra time (beyond\
    \ `minTime`) needed for the processor to finish. Consider the `System.out.format()`\
    \ method for nice output.\n\n3. Use the `QueueSimulator` from the previous exercise\
    \ to explore a situation when overcrowding is predictable, such as with `taskChance\
    \ = 0.3` and `maxTaskTime = 10`. Use `minTime = 10000` and queue lengths between\
    \ 5 and 500. Discuss the impact of different queue lengths according to the simulator.\
    \ Is it what you expected?\n\n[1] Protected members are also accessible by classes\
    \ in the same package, but named packages are not used in this text.\n\n[2] Overriding\
    \ `equals()` is not as straightforward as it might seem. See Items 8 and 9 from\
    \ Bloch.\n\n# Chapter 6: Lists\n\nThe power of stacks and queues as linear structures\
    \ lies in their limited access. Lists, on the other hand, provide a flexible interface\
    \ that allows inserting and removing anywhere. This flexibility comes at a price:\
    \ performance may suffer.\n\n## 6.1 Interface\n\nThe List ADT views its data much\
    \ like an array: elements are accessible via indices.\n\n### Indexing\n\nThink\
    \ of lists as dynamic: they are stored at indices 0 through one less the number\
    \ of elements.\n\n### List ADT\n\nStacks and queues limit access to their contents,\
    \ either through the top (stack) or front and rear (queue). Because the List ADT\
    \ allows accessing any element at any time, some list methods affect the indices\
    \ of other items in the list. Both `add()` and `removeAt()` cause elements other\
    \ than those added or removed to change position. For example, if a list contains\n\
    \n```\n5, 8, 2, 1, 4, 7\n```\n\nthen the operation `add(3, 6)` results in the\
    \ list\n\n```\n5, 8, 2, 6, 1, 4, 7\n```\n\nThe elements after 6 all now have a\
    \ different index than they did prior to the `add()`. Similarly, `removeAt(1)`\
    \ returns 8 (the item in slot 1) and modifies the list to\n\n```\n5, 2, 6, 1,\
    \ 4, 7\n```\n\nAgain, remember that the list may not be implemented with an array,\
    \ so no actual shifting may occur. What changes from the perspective of the ADT\
    \ are the index locations of some of the elements in the list. Whereas the stack\
    \ or queue ADTs are fairly standard, the List abstract type has many variations\
    \ and can be quite complex. We will use the set of methods in `Table 6.1`.\n\n\
    Table 6.1: List ADT\n\n| Method | Description |\n| :--- | :--- |\n| `void add(E\
    \ item)` | Adds item to end of list. |\n| `void add(int index, E item)` | Inserts\
    \ item at index, shifting items to right to make room. If `index = size`, adds\
    \ item to the end of list. |\n| `E get(int index)` | Returns item at index. |\n\
    | `int indexOf(E item)` | Index of first occurrence of item in list, −1 if not\
    \ found. |\n| `boolean isEmpty()` | True if list has no elements. |\n| `E removeAt(int\
    \ index)` | Removes and returns item at index, shifting remaining items to left.\
    \ |\n| `E set(int index, E item)` | Replaces item at index, returning the previous\
    \ value. |\n| `int size()` | Number of elements in list. |\n\n### Shifting\n"
