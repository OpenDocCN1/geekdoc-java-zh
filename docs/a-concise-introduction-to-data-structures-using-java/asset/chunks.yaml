    \nTable 3.2\n\n`java.util` Exceptions\n\n| | |\n|---|---|\n| `EmptyStackException`\
    \ | Indicates the stack is empty. |\n| `NoSuchElementException` | Indicates the\
    \ requested element does not exist. |\n\n### Resizing the Array\n\nRecall that\
    \ once an array has been created, its length can never be changed. Therefore,\
    \ if `push()` is called when the array is full, we need to create a new array,\
    \ copy the existing stack items into the new array, and then set `data` to refer\
    \ to the new array. We put this work into a private `resize()` method in [Listing\
    \ 3.2](#K20431_C003.xhtml_lis3.2). By doubling the length each time the array\
    \ becomes full, we minimize the impact of resizing on the performance of `push()`.\
    \ However, calculating that precise effect is beyond the scope of this text.\n\
