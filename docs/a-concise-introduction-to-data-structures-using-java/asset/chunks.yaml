  trans: "\n然而，期望所有列表都是可迭代的是合理的，这可以通过接口继承来实现。`extends` 关键字允许接口像类一样相互继承：\n\n```\npublic\
    \ interface SubInterface extends SuperInterface {...}\n```\n\n子接口继承了父接口的所有方法，然后添加了自己的新方法。因此，为了要求所有列表都是可迭代的，我们扩展了接口：\n\
    \n```java\n public interface List<E> extends Iterable<E> {...}\n```\n\n### 使用迭代器\n\
    \n创建迭代器的动机是因为这种循环在链表上的效率很低：\n\n```\n for (int i = 0; i < items.size(); i++) {\n\
    \ System.out.println(items.get(i));\n }\n```\n\n假设 `items` 是一个 `Integer` 列表，重写循环以使用迭代器如下：\n\
    \n```\n Iterator<Integer> it = items.iterator();\n while (it.hasNext()) {\n System.out.println(it.next());\n\
    \ }\n```\n\n这提供了我们寻求的 `O(n)` 遍历。这是一个非常常见的任务，Java 提供了增强型 for 循环（参见第 18 页）为了更加方便。相同的循环可以写为：\n\
    \n```\n for (Integer item : items) {\n System.out.println(item);\n }\n```\n\n\
    增强型 for 循环使用 `iterator` 获取相同的 `O(n)` 性能，同时隐藏了所有的迭代器细节。使用它只需要对象拥有一个 `iterator()`\
    \ 方法，这与实现 `Iterable` 接口是相同的（表 6.3）。\n\n### 练习\n\n1. 解释为什么链表迭代器允许以 `O(n)` 时间遍历列表。\n\
    2. 修改 `List<E>` 接口以扩展 `Iterable<E>`。\n3. 将本节的修改整合到 `LinkedList` 类中，使其实现 `Iterable`\
    \ 接口。显式使用迭代器和增强型 for 循环来测试实现。\n4. 在没有迭代器的情况下，`ArrayList` 已经提供了对其元素的高效遍历。尽管如此，描述修改\
    \ `ArrayList` 以支持 `Iterable` 接口的优势。\n5. 修改来自第 6.2 节 的 `ArrayList` 类以支持 `Iterable`\
    \ 接口。使用增强型 for 循环测试实现。提示：画一个类似于第 119 页的图，并遵循那里用于链表的步骤。\n\n# 第 7 章\n\n# 递归\n\n\
    ## 7.1 数学函数\n\n考虑阶乘函数：\n\n$n! = n \\cdot (n - 1) \\cdot (n - 2) \\cdots 2 \\cdot\
    \ 1$\n\n这个表达式中的“$\\dots$”有点不正式，尽管我们直观上知道它的含义。精确定义阶乘的一种方法如下：\n\n$n! = \\left\\\
    { \\begin{matrix} 1 & {\\text{if}n = 0} \\\\ {n \\cdot (n - 1)} & {\\text{if}n\
    \ > 0} \\end{matrix} \\right.$\n\n如果我们使用这个定义来计算 $3!$ ，它的展开过程如下：\n\n$\\begin{array}{l}\
    \ \\begin{array}{lll} {\\text{3}!} & = & {\\text{3} \\cdot \\text{2}!} \\\\ &\
    \ = & {\\text{3} \\cdot \\text{(2} \\cdot \\text{1}!\\text{)}} \\\\ & = & {\\\
    text{3} \\cdot \\text{(2} \\cdot \\text{(1} \\cdot \\text{0}!\\text{))}} \\end{array}\
    \ \\\\ {\\begin{array}{lll} & = & 3 \\end{array} \\cdot (2 \\cdot (1 \\cdot 1))\\\
    begin{array}{lll} & = & 6 \\end{array}} \\end{array}$\n\n注意，定义的第一个部分会导致展开停止。\n\
    \n这个定义是递归的，因为它通过另一个阶乘来定义阶乘；在这种情况下，$n!$ 是根据 $(n-1)!$ 定义的。递归定义有两个关键特征：\n\n- **递归步骤使用更小的参数。**\
    \ 在例子中，$n$ 的阶乘是使用较小的参数 $n - 1$ 计算的。\n- **基准情况导致递归停止。**在这里，基准情况是 $0!$ 被定义为 $1$。基准情况中永远不会递归——这就是导致递归停止的原因。如果递归步骤使用了多个较小的参数，则可能需要多个基准情况。\n\
    \n### Java 中的递归函数\n\n与大多数现代编程语言一样，Java 通过允许函数调用自己来支持递归。事实上，上述 $n!$ 的数学定义几乎直接翻译成了列表\
    \ 7.1 中的 Java。\n\n列表 7.1：递归阶乘\n\n```java\n 1 public class Recursion {\n 2 public\
    \ static int factorial(int n) {\n 3   if (n <= 1) return 1;\n 4   return n * factorial(n\
    \ - 1);\n 5}\n 6}\n```\n\n在代码中，通常测试基准情况。\n\n### 追踪递归调用\n\n追踪递归函数就像展开数学定义，但在这种我们停止得更早：\n\
    \n![image/124x001.png)\n\n当 `factorial(1)` 返回 1 时，允许 `factorial(2)` 返回 2。\n\n\
    ![image/124x002.png)\n\n随后允许 `factorial(3)` 返回 6。\n\n### 自然递归\n\n以下结构是自然的递归，因为它们可以被递归地定义：\n\
    \n- 自然数（非负整数）通常递归调用自己。\n- 字符串通常递归调用子字符串。\n- 列表通常递归调用子列表。\n- 链表通过 `next` 指针递归调用自己。\n\
    \nJava 中用于递归的任何对象类型通常包含对 null 的测试。树是我们将在第 8 章学习的另一种自然递归结构。\n\n### 练习\n\n1. 使用\
    \ `add(m, n)` 的递归定义：$\\text{add}(m,n) = \\left\\{ \\begin{matrix} m & {\\text{if}n\
    \ = 0} \\\\ {m + \\text{add}(n - 1)} & {\\text{if}n > 0} \\end{matrix} \\right.$\n\
    \   - (a) 追踪调用 `add(1, 3)`\n   - (b) 为整数 $m$ 和 $n$ 实现递归函数 `add(m, n)`。\n2. 使用\
    \ `mul(m, n)` 的递归定义：$\\text{mul}(m,n) = \\left\\{ \\begin{matrix} 0 & {\\text{if}n\
    \ = 0} \\\\ {m \\cdot \\text{mul}(m, n - 1)}} & {\\text{if}n > 0} \\end{matrix}\
    \ \\right.$\n   - (a) 追踪调用 `mul(2, 4)`\n   - (b) 为整数 $m$ 和 $n$ 实现递归函数 `mul(m,\
    \ n)`。\n3. 使用 `pow(m, n)` 的递归定义：$\\text{pow}(m,n) = \\left\\{ \\begin{matrix}\
    \ 1 & {\\text{if}n = 0} \\\\ {m \\cdot \\text{pow}(m, n - 1)}} & {\\text{if}n\
    \ > 0} \\end{matrix} \\right.$\n   - (a) 追踪调用 `pow(3, 3)`\n   - (b) 为整数 $m$ 和\
    \ $n$ 实现递归函数 `pow(m, n)`。\n4. 写一个递归 Java 函数 `length(s)` 计算字符串 `s` 的长度。\n5. 写一个递归\
    \ Java 函数 `reverse(s)` 返回反转后的字符串 `s`。\n6. 写一个递归 Java 函数 `fib(n)` 计算斐波那契数列![image/125x004.png]中的第\
    \ n，其中每一项都是前两项之和。\n7. 写一个递归 Java 函数实现欧几里得算法以计算公约数 `gcd(m, n)`，它是整除 $m$ 和 $n$ 的最大整数\
    \ $k$。（参见第 1.1 节中的练习 8。）欧几里得算法的递归版本基于这两个事实：\n   - `gcd(m, n) = gcd(n, m mod n)`\n\
    \   - `gcd(m, 0) = m`\n   注意 `m mod n` 始终小于 `n`。\n8. 写一个递归 Java 函数 `bits(n)` 返回表示非负整数\
    \ `n` 的二进制字符串。提示：最后一位是 `n % 2`，你可以通过递归 `n / 2` 获取其他位。你可能需要多个基准情况。\n\n## 7.2 可视化递归\n\
    \n"
- fmt: "\nIn this section, we look at two techniques for visualizing recursion that\
    \ can help you follow how recursive functions work: call trees and the call stack.\
    \ The call stack will also begin to explain how function calls are implemented\
    \ in general.\n\n## Recursive Call Trees\n\nA call tree diagrams the set of calls\
    \ that are generated by a recursive function call. It generalizes the idea of\
    \ tracing a recursive function described in the previous section by not following\
    \ return values or calculations but only tracking the different function calls.\
    \ Call trees are also often drawn for `n` rather than tracing a specific value,\
    \ in order to understand the overall behavior of the function. The point of a\
    \ call tree is usually to count the total number of function calls.\n\nFor simple\
    \ recursive functions, the call tree is a single chain of calls. For example,\
    \ the tree for `factorial(n)` is:\n\n![image](image/126x001.png)\n\nThis indicates\
    \ that a recursive call to `factorial(n)` generates approximately `n` function\
    \ calls.\n\nIf a recursive function calls itself more than once, a tree of calls\
    \ results. For example, calling the recursive Fibonacci function `fib(5)` from\
    \ Exercise 6 in the previous section generates this tree:\n\n![image](image/127x001.png)\n\
    \n## Analyzing Recursive Functions\n\nThe call tree gives some intuition for the\
    \ time complexity of a recursive function: for example, in the case of the Fibonacci\
    \ function, a lot of calls means a lot of work!\n\nIn simple cases, if each function\
    \ call has `O(1)` steps, as in the case of the factorial function, then counting\
    \ the function calls gives us the total amount of work. For the factorial function,\
    \ since each call is `O(1)` and the tree generates `n` calls, the total work is\
    \ `O(n)`.\n\nMore advanced techniques for analyzing recursive functions using\
    \ recurrence relations are studied in later courses.\n\n## Implementing Recursion\n\
    \nImagine the call tree for `fib(100)`, or even `fib(10)`. How does a recursive\
    \ function keep track of where it is as it works through all of those function\
    \ calls? As functions return, where do their return values go? The answers to\
    \ these questions lie in how functions calls are implemented in most languages.\n\
    \n## Function Call Stack\n\nEvery time a function call is made, a section of memory\
    \ called a stack frame is pushed on to the call stack. The call stack is just\
    \ a regular stack that happens to hold stack frames; it is also known as the run-time\
    \ stack, and the frames are sometimes called activation records.\n\nA function\
    \ is able to use its stack frame memory while it is active, and then when the\
    \ function call finishes, its stack frame is popped. Usually, the return value\
    \ of the function (if any) will be put in a special register or left at the top\
    \ of the stack.\n\nIn general, stack frames contain the following basic information:\n\
    \n![image](image/128x001.png)\n\nThe caller pushes the argument values and return\
    \ address, and then the function being called pushes space for its local variables.\
    \ When the function that was called finishes, the frame is popped and the return\
    \ address is used to jump back to where it had been called from. This is how a\
    \ function knows “where it is,” in the sense asked above.\n\nThis general method\
    \ for implementing function calls makes it so that nothing special is required\
    \ to support recursion. When a function calls itself, it simply pushes a new frame\
    \ on the stack with the appropriate values. There is generally a limited amount\
    \ of memory available for the stack, however. Any recursion without a base case\
    \ (or simply generating too many calls) will result in a stack overflow error.\n\
    \n## Visualizing the Call Stack\n\nThe `factorial` method has no local variables,\
    \ and so we can trace a call to `factorial(3)` with this sequence of views of\
    \ the call stack, showing only the argument value of `n` inside each frame and\
    \ return values left on the top of the stack:\n\n![image](image/128x002.png)\n\
    \nThe final value `6` is left on the top of the stack for whatever method called\n\
    \n## Stack Traces\n\nThe Java run-time environment will print a stack trace after\
    \ an exception, to allow you to see how the problem occurred. A stack trace simply\
    \ shows the functions currently on the call stack, beginning at the top. Many\
    \ debuggers also allow you to view the call stack during program execution.\n\n\
    ## Exercises\n\n1. Draw a call tree for the `add(m, n)` function in Exercise 1\
    \ of the previous section. Use the tree to determine the `O()` performance of\
    \ the function.\n2. Draw a call tree for the `mul(m, n)` function in Exercise\
    \ 2 of the previous section. Use the tree to determine the `O()` performance of\
    \ the function.\n3. Draw a call tree for the `pow(m, n)` function in Exercise\
    \ 3 of the previous section. Use the tree to determine the `O()` performance of\
    \ the function.\n4. Write a recursive version of `pow(m, n)` to compute `m^n`\
    \ for `n > 0` that is `O(log n)`.\n5. Count the number of times `fib(1)` and `fib(2)`\
    \ appear in the call tree of `fib(100)`. Hint: draw the top of the tree, and count\
    \ the number of times each of `fib(100)`, `fib(99)`, `fib(98)`, . . . appear.\
    \ Look for a pattern; the pattern changes slightly at `n = 1`. To see that change,\
    \ look again at the tree for `fib(5)`.\n6. Show how the call stack changes during\
    \ the evaluation of `factorial(4)`.\n7. Show how the call stack changes as a result\
    \ of calling these recursive functions from the exercises in the previous section:\n\
    \    - (a) `add(7, 3)`\n    - (b) `mul(5, 4)`\n    - (c) `pow(2, 3)`\n    - (d)\
    \ `length(\"abc\")`\n    - (e) `reverse(\"Java\")`\n    - (f) `gcd(10, 6)`\n\n\
    ## 7.3 Recursive and Generalized Searches\n\nBoth linear and binary searches are\
    \ good candidates for recursion. They each check one element, and if it is not\
    \ the target, continue searching on a smaller list. The same process is used on\
    \ the smaller list, and so it may be accomplished by calling the same recursive\
    \ method.\n\nLinear search from [Section 1.3](#K20431_C001.xhtml_ch1.3) and binary\
    \ search in [Section 2.3](#K20431_C002.xhtml_ch2.3) were also both designed for\
    \ int arrays. As we revisit them, we generalize these searches to work with other\
    \ types.\n\n### Public Wrapper Methods\n\nThere is really only one new concept\
    \ needed to write recursive versions of linear and binary search. Recursive functions\
    \ work by calling themselves on smaller parameters, but the parameters to linear\
    \ and binary search leave no room for that:\n\n```\nlinearSearch(data, target)\n\
    ```\n\n```\nbinarySearch(data, target)\n```\n\nFurthermore, the users of these\
    \ search methods should not know or care (unless it affects performance) whether\
    \ these methods are implemented by recursion or not, and so we do not want to\
    \ change the parameter lists of the public methods.\n\nThe solution is to use\
    \ the public methods as wrappers that call private recursive methods with additional\
    \ parameters to drive their recursion:\n\n![image](image/130x001.png)\n\nThe new\
    \ parameters in the private methods control the section of the array currently\
    \ being searched, which is what needs to change during the recursion. Binary search\
    \ needs two parameters because it can work in from both ends, whereas linear search\
    \ only searches from one end.\n\nAll the wrapper methods do is get the recursion\
    \ started with initial values for the new parameters.\n\n### Generalized Linear\
    \ Search: Objects\n\nThe linear search in [Listing 1.3](#K20431_C001.xhtml_lis1.3)\
    \ works only with int arrays. To generalize it, we only need to be able to tell\
    \ if the target equals an array item. Because the `equals()` method is defined\
    \ in the `Object` class (see page 23), we can define linear search on the `Object`\
    \ type and then it will work for arrays using any object type.\n\n### Generalized\
    \ Binary Search: Comparables\n"
