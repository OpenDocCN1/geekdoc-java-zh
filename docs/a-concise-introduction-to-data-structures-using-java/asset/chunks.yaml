- fmt: "\n7. Implement the optional `remove()` method in the `LinkedHashMap` class\
    \ using the `remove()` method from the `LinkedMap` class (Exercise 8 in [Section\
    \ 11.1](#K20431_C011.xhtml_ch11.1)).\n\n8. Give the expected performance of deleting\
    \ from a hash table using chaining.\n\n## 11.4 Linear Probing\n\nAn alternative\
    \ to chaining in a hash table is to store all entries in the array itself. This\
    \ approach is called open addressing. Collisions occur in open addressing when\
    \ a new element hashes to a location that is already filled in the table. In this\
    \ case, a probe sequence of other table slots is generated, and the new element\
    \ is stored in the first open slot found by the probe sequence, indicated by a\
    \ `null` value in the array:\n\n![image](image/196x001.png)\n\nSearching for a\
    \ key follows the same path: it starts at the hashed location and then uses the\
    \ same probe sequence until either the key or an open slot is found.\n\n### Linear\
    \ Probing\n\nThe probe sequence generated by linear probing for a table of size\
    \ `M` is given by the function\n\n`i -> (i + 1) mod M`\n\nwhich corresponds to\
    \ simply moving one slot to the right for each probe, wrapping around to the beginning\
    \ of the array if necessary.\n\n#### Example\n\nIf the keys `14`, `77`, and `32`\
    \ are inserted into a hash table of size `11` the result is (showing primitives\
    \ for simplicity):\n\n![image](image/196x002.png)\n\nIf the next key is `66`,\
    \ it will also hash to `0` and cause a collision. Using linear probing, the first\
    \ open slot to the right is `1`, and `66` is stored there:\n\n![image](image/196x003.png)\n\
    \nIf the next key is `54`, it hashes to `10`, and the next open spot for it is\
    \ index `2`:\n\n![image](image/196x004.png)\n\nNotice the tendency for keys to\
    \ cluster; this is one of the primary disadvantages of linear probing.\n\n###\
    \ Implementation\n\nAs with the `LinkedMap` implementation, a static nested `Entry<K,\
    \ V>` class is useful for storing key-value pairs in a hash table using open addressing.\
    \ A separate `probe(i)` function that generates the probe sequence is also helpful\
    \ to allow easily changing to a different probing method.\n\n[Listing 11.1](#K20431_C011.xhtml_lis11.1)\
    \ outlines the method for inserting into a hash table using linear probing. It\
    \ ignores entries that would force `λ ≥ 1`.\n\nListing 11.1: Insertion with Linear\
    \ Probing (Pseudocode)\n\n```\n1 If room in table\n```\n\n```\n2 Hash key\n```\n\
    \n```\n3 While entry not null and not equal key\n```\n\n```\n4 Probe to next entry\n\
    ```\n\n```\n5 If entry is null insert new entry\n```\n\n```\n6 Else update old\
    \ entry\n```\n\n### Performance\n\nThe performance of linear probing is much more\
    \ complicated to analyze than anything else we have considered to this point.\
    \ We will simply state the results; interested readers may find the original arguments\
    \ in Knuth [[9]](#K20431_bib.xhtml_ref_9). Sedgewick and Wayne [[12]](#K20431_bib.xhtml_ref_12)\
    \ give some intuition for the calculations.\n\nTo analyze any open addressing\
    \ scheme, we need to estimate the number of probes required for a search or insertion.\
    \ And because we are using open addressing, the load factor `λ` must be less than\
    \ one; see Exercises 6 and 7.\n\n**Unsuccessful Search** An unsuccessful search\
    \ keeps probing until finding a `null` table entry. Assuming the hash function\
    \ distributes keys evenly, the average number of probes for an unsuccessful search\
    \ is approximately\n\n$\\frac{1}{2}\\left( {1 + \\frac{1}{{(1 - \\lambda)}^{2}}}\
    \ \\right)$\n\n**Successful Search** A successful search follows the same path\
    \ that was used to insert the element. However, the element may have been inserted\
    \ early with a very short path or later with a longer path. In this case, the\
    \ average number of probes is approximately\n\n$\\frac{1}{2}\\left( {1 + \\frac{1}{1\
    \ - \\lambda}} \\right)$\n\n**Insertion** Inserting an element requires searching\
    \ for the first open slot in the probe sequence after hashing. This is the same\
    \ as an unsuccessful search and so the average number of probes is again approximately\n\
    \n$\\frac{1}{2}\\left( {1 + \\frac{1}{{(1 - \\lambda)}^{2}}} \\right)$\n\n###\
    \ Deletion\n\nDeleting elements from a table using open addressing is problematic.\
    \ To see why, consider the example from page 196 created by inserting elements\
    \ in the order `14`, `77`, `32`, `66`, `54`:\n\n![image](image/198x002.png)\n\n\
    Now suppose `77` is deleted and we search for `54`. The search will begin at slot\
    \ `10`, find `null` in slot `0`, and therefore fail. The problem is that items\
    \ can affect the probe sequence of other elements inserted later than the element\
    \ being deleted.\n\nThere are ways to handle this problem, but none of them are\
    \ ideal. One option is to use a special deleted entry that searches can distinguish\
    \ from `null`. Another option is to rehash any elements whose searches would be\
    \ affected by the deletion (see [Listing 11.2](#K20431_C011.xhtml_lis11.2) and\
    \ Exercise 16). However, in most cases, if deletion is important, then a better\
    \ solution is to use a special deleted entry.\n\nListing 11.2: Deletion with Linear\
    \ Probing (Pseudocode)\n\n```\n1 Find index containing entry\n```\n\n```\n2 Delete\
    \ entry\n```\n\n```\n3 While entry is not null\n```\n\n```\n4 Probe to next entry\n\
    ```\n\n```\n5 Rehash it\n```\n\n### Other Probe Sequences\n\nThere are several\
    \ alternatives to linear probing; one of the most useful is known as double hashing.\
    \ The idea in double hashing is to use a second hash function `h(k)` to determine\
    \ step size instead of always taking steps of size 1. For double hashing, the\
    \ probe sequence for `k` is:\n\n`i + j * h(k) mod M`\n\nHere it is important for\
    \ `h(k)` to relatively prime to `M`.\n\n### Exercises\n\n1. Implement the optional\
