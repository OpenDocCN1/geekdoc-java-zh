    \ into account. To see the problem, suppose a queue has been in use for some time,\
    \ has elements 10, 20, . . . , 50 queued in that order, and is now full:\n\n![image](image/092x001.png)\n\
    \nIf we resize in the same way as an array stack (see [Listing 3.2](#K20431_C003.xhtml_lis3.2)),\
    \ then the result would be:\n\n![image](image/092x002.png)\n\nThis will not work:\
    \ the queue expects 40 to follow 30 (because it had in the circular array), and\
    \ even though there are empty slots, there is no room after the end of the queue\
    \ (i.e., after item 50). Therefore, we need to change the resizing method so that\
    \ the front of the queue is back in slot 0:\n\n![image](image/092x003.png)\n\n\
    This looks like it would be tricky to write, but it’s not too bad with the right\
    \ organization. The idea is to loop over the new array locations with one variable\
    \ i, while updating a second variable j that loops through the old circular array.\
    \ [Listing 5.1](#K20431_C005.xhtml_lis5.1) outlines this approach. Notice in it\
    \ how the for-loop updates i, while j is updated for the old circular array inside\
    \ the loop.\n\nListing 5.1: Resize Circular Array (Pseudocode)\n\n```\n 1 j =\
    \ front\n```\n\n```\n 2 for i = 0 to size - 1\n```\n\n```\n 3 newData[i] = data[j]\n\
    ```\n\n```\n 4 j = (j + 1) % capacity\n```\n\n```\n 5 Update front, rear, capacity,\
    \ data\n```\n\nThe exercises ask you to complete this implementation and the rest\
    \ of the ArrayQueue<E> class.\n\nExercises\n\n1.  Explain the use of prefix and\
    \ postfix increment in the basic array queue operations:\n\n    ```\n     data[++rear]\
    \ = item; // enqueue\n    ```\n\n    ```\n     return data[front++]; // dequeue\n\
    \    ```\n\n2.  Determine the correct starting values for the front and rear array\
    \ indices of an array queue. Explain your answers.\n\n3.  In a circular array\
    \ implementation of a queue:\n\n    1.  (a) Explain why this relationship is true\
    \ for both empty and full queues:\n\n        ```\n         (rear + 1) % capacity\
    \ == front\n        ```\n\n    2.  (b) If there were no size instance variable\
    \ storing the number of items in the queue, how might you tell the difference\
    \ between an empty queue and a full queue? Outline a strategy.\n\n4.  Circular\
    \ arrays were introduced in part to avoid shifting elements to reposition the\
    \ queue at the front of the array. However, that is precisely what the resize()\
    \ method does, because of circularity. Is that a problem? In other words, does\
    \ resizing with [Listing 5.1](#K20431_C005.xhtml_lis5.1) impact the queue’s performance\
    \ differently than resizing an array stack? Explain why or why not.\n\n5.  Develop\
    \ the ArrayQueue<E> class, implementing the Queue<E> interface with a circular\
    \ array as described in this section. Use separate size and capacity instance\
    \ variables, and write these methods:\n\n    1.  (a) dequeue() Throw a NoSuchElement\
    \ exception if the queue is empty, and set the obsolete reference (see page 71)\
    \ to null.\n\n    2.  (b) enqueue() Double the size of the array if the queue\
    \ is full.\n\n    3.  (c) isEmpty()\n\n    4.  (d) peek() Throw a NoSuchElement\
    \ exception if the queue is empty.\n\n    5.  (e) size() Include a size instance\
    \ variable and update it where necessary.\n\n    6.  (f) Private resize() Implement\
    \ [Listing 5.1](#K20431_C005.xhtml_lis5.1).\n\n    7.  (g) Two constructors: one\
    \ default, and one that takes an initial capacity as a parameter. The default\
    \ constructor should call the other constructor using this().\n\n6.  Add a main()\
    \ method to the ArrayQueue<E> class to test the queue with:\n\n    1.  (a) Integers\n\
    \n    2.  (b) Doubles\n\n    3.  (c) Strings\n\n7.  Determine the O() time complexity\
    \ of these ArrayQueue operations. Explain your answers.\n\n    1.  (a) dequeue()\n\
    \n    2.  (b) enqueue() Ignore resizing.\n\n    3.  (c) isEmpty()\n\n    4.  (d)\
    \ peek()\n\n    5.  (e) size()\n\n## 5.3 Inheritance: Fixed-Length Queues\n\n\
    Queues turn up in interesting places and are not always implemented in software.\
    \ For example, hardware queues are common components in systems that receive data\
    \ at a variable rate: the queue allows items to collect in a waiting line until\
    \ the processor is ready for more input. Both graphics processing units and network\
    \ routers use hardware queues to manage incoming data in this way.\n\n### Examples:\
    \ GPUs and Network Routers\n\nGraphics processing units (GPUs) are constructed\
    \ with a pipeline architecture, which you can imagine as a sequence of stages\
    \ connected by pipelines:\n\n![image](image/095x001.png)\n\nGraphics data move\
    \ down these pipelines from one stage to the next, with hardware FIFO queues at\
    \ each stage to prevent stalling when one of the stages cannot keep up with the\
    \ inputs coming into it.\n\nHardware queues are also used in network routers to\
    \ hold incoming packets before they are processed. Because of the importance of\
    \ not dropping network packets, routers usually also have other mechanisms including\
    \ software queues to handle full hardware queues.\n\nIn this section, we develop\
    \ a fixed-length queue to model hardware queues or other queues that have a fixed\
    \ maximum capacity. Given such a queue, attempting to enqueue into a full queue\
    \ will result in the item being dropped, like a dropped network packet.\n\n###\
    \ Inheritance\n\nRather than writing a fixed-length queue class from scratch,\
    \ it would be better to take advantage of the work we’ve already done. The basic\
    \ idea of inheritance is for one class (the subclass) to begin with the state\
    \ and behavior of another class (the superclass), but then be allowed to add new\
    \ variables and methods, as well as redefine how old methods work. The new class\
    \ is said to extend the old class and so is also known as an extension of the\
    \ base class.\n\n![image](image/095x002.png)\n\n### Inheritance Hierarchies\n\n\
    Sub- and superclass relationships between classes create an inheritance hierarchy\
    \ with more general classes towards the top and more specific classes towards\
    \ the bottom.\n\nFor example, some of the classes you have seen so far are related\
    \ by inheritance in this way:\n\n![image](image/096x001.png)"
