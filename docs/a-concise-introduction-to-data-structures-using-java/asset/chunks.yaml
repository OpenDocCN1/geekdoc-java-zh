    \ to things that are different from what you expected.\n\n(I will now output the\
    \ final formatted content).\n\n[content]\n*   The organization of topics is designed\
    \ throughout to reinforce this developmental approach. For example, [Chapter 3](#K20431_C003.xhtml_ch3)\
    \ develops an `int`-based stack interface, array implementation, and linked implementation.\
    \ This allows students to concentrate on stack essentials before tackling fully\
    \ generic stacks in [Chapter 4](#K20431_C004.xhtml_ch4). The `List` ADT follows\
    \ stacks and queues for the same reason: students are better prepared to handle\
    \ its complexity (particularly `iterators`) after learning stacks and queues first.\n\
    *   Each section introduces only one or (rarely) two new concepts, allowing students\
    \ to focus on the new ideas without becoming overwhelmed. This is particularly\
    \ important during the first half of the course for newcomers to Java.\n\nOther\
    \ features include:\n\n*   Clear, concise explanations of the essential content\
    \ students need to learn\n*   An introductory chapter to the basics of Java, allowing\
    \ students for whom Java is not their first language to quickly get up to speed\n\
    *   Partial implementations of data structures so that instructors can develop\
    \ some methods as examples, and students can write other methods as exercises\n\
    *   Introduction to topics students will likely see later in other courses, such\
    \ as call stacks, analyzing recursive functions, sorting, inheritance, and abstract\
    \ classes\n*   Sections designed to fit approximately one class period each\n\n\
    For the most part, standard Java coding practices are followed, but there are\
    \ a handful of exceptions:\n\n*   `Arrays` are copied by hand, largely to support\
    \ learning to resize circular arrays in the queue implementation.\n*   `Java`\
    \ collections are not used, because students are learning to build their own.\
    \ Most interfaces are close to their `java.util` counterparts, though.\n*   The\
    \ unnamed package is used since these applications are all relatively small, and\
    \ it simplifies file management for beginners.\n*   The `@Override` annotation\
    \ is not used for implementations of interface methods, because that use of the\
    \ term “override” seems likely to confuse beginners.\n\nWith the exception of\
    \ [Chapters 10](#K20431_C010.xhtml_ch10) and [11](#K20431_C011.xhtml_ch11), which\
    \ can be interchanged, chapters are designed to be read in order. [Section 5.3](#K20431_C005.xhtml_ch5.3)\
    \ should probably not be skipped because it introduces inheritance and the `Object`\
    \ class.\n\nJava source files and other resources are posted at\n\n[http://www.central.edu/go/datastructures/](http://www.central.edu)\n\
    \n## Feedback\n\nPlease send any comments or suggestions to [johnsonm@central.edu](mailto:johnsonm@central.edu?Subject=EPUB%20Query%20for%209781466589896).\
    \ I look forward to hearing from you.\n\n## Acknowledgments\n\nThanks to all of\
