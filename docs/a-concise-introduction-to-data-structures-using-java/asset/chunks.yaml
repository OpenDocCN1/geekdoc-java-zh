    \ Mark is a graduate of the University of Wisconsin-Madison (Ph.D., mathematics)\
    \ and St. Olaf College. He is the author of A Concise Introduction to Programming\
    \ in Python, also published by Chapman & Hall/CRC Press.\n\nChapter 1\n\n# A Brief\
    \ Introduction to Java\n\nBefore beginning our study of data structures, we take\
    \ a quick tour of the main features of the Java programming language. More advanced\
    \ features of Java will then be introduced as they are needed. This chapter assumes\
    \ that you have some programming experience but not necessarily in Java.\n\nA\
    \ current Java Development Kit (JDK) is required to develop software in Java.\
    \ All of the examples in this text were written using Java SE 7.\n\n## 1.1 Basics\n\
    \nWe begin with an example that computes factorials in [Listing 1.1](#K20431_C001.xhtml_lis1.1).\n\
    \nListing 1.1: Factorial\n\n```\n 1 public class NumericFunctions {\n```\n\n```\n\
    \ 2 public static int factorial(int n) {\n```\n\n```\n 3  int result = 1;\n```\n\
    \n```\n 4  for (int i = 2; i <= n; i++) {\n```\n\n```\n 5  result *= i;\n```\n\
    \n```\n 6 }\n```\n\n```\n 7  return result;\n```\n\n```\n 8}\n```\n\n```\n 9\n\
    ```\n\n```\n10 public static void main(String[] args) {\n```\n\n```\n11  for (int\
    \ n = 1; n <= 10; n++) {\n```\n\n```\n12  System.out.print(n);\n```\n\n```\n13\
    \  System.out.print(\" \");\n```\n\n```\n14  System.out.println(factorial(n));\n\
    ```\n\n```\n15 }\n```\n\n```\n16}\n```\n\n```\n17}\n```\n\nAlthough this is a\
    \ short program, it illustrates a number of features of the Java language. This\
    \ section is therefore a bit longer than most, so don’t necessarily try to remember\
    \ everything on first reading. Instead, notice what is here, pay attention to\
    \ things that are different from what you expected, and plan to refer back to\
    \ this section as questions arise.\n\nThe Java Tutorial [[13]](#K20431_bib.xhtml_ref_13)\
    \ is a good resource for learning Java, as is The Java Programming Language [[1]](#K20431_bib.xhtml_ref_1).\
    \ The authoritative Java reference is the Java Language Specification [[8]](#K20431_bib.xhtml_ref_8).\n\
    \n### Classes\n\nAlmost all Java code is contained inside class definitions, as\
    \ in [Listing 1.1](#K20431_C001.xhtml_lis1.1). Class names are capitalized, and\
    \ every class is usually stored in its own file, named ClassName.java. For now,\
    \ concentrate on the code inside the two method definitions, factorial() and main().\
    \ Later, in [Section 1.5](#K20431_C001.xhtml_ch1.5), we will look more closely\
    \ at the structure of Java class definitions.\n\n### Types and Variables\n\nEvery\
    \ variable in Java may only store one type of data, and that type must be declared\
    \ before the variable can be used. A variable declaration looks like this:\n\n\
    ```\ntype variableName;\n```\n\nDeclaration is usually combined with initialization\
    \ to give the variable a value, as in line 3 of [Listing 1.1](#K20431_C001.xhtml_lis1.1):\n\
    \n```\ntype variableName = initialValue;\n```\n\nThis is because local variables,\
    \ which are defined inside blocks such as method bodies, are not given a value\
    \ until you assign one.\n\nEvery declaration limits the scope of the variable\
    \ that is declared. The scope of a variable is the area of a program in which\
    \ the variable may be used. A variable’s scope is limited to the set of braces\
    \ that its declaration occurs in (known as a block; see below). We generally follow\
    \ the principle of making the scope of a variable as small as possible; for example,\
    \ the scope of the variable i in [Listing 1.1](#K20431_C001.xhtml_lis1.1) is the\
    \ for-loop in lines 4–6.\n\nVariables that are declared with the final modifier\
    \ are constant and can never change once they have been set. Constants are usually\
    \ written in all capital letters with underscores between words.\n\n### Primitive\
    \ and Reference Types\n\nThere are two main kinds of types: primitive and reference.\
    \ Variables declared with a primitive type store their data directly at the variable’s\
    \ location in memory. All other types in Java are reference types. References\
    \ can be thought of as pointers to objects rather than storage for the objects\
    \ themselves. We concentrate on primitive types in this section, and then gradually\
    \ introduce reference types throughout the rest of this chapter.\n\n### Primitive\
    \ Types\n\nJava has eight primitive data types, listed in [Table 1.1](#K20431_C001.xhtml_Text_Anchor_tab1.1).\n\
    \nTable 1.1\n\nPrimitive Types\n\n| byte | 8-bit integer |\n\n| short | 16-bit\
    \ integer |\n\n| char | character (16-bit unsigned integer) |\n\n| int | 32-bit\
    \ integer |\n\n| long | 64-bit integer |\n\n| float | 32-bit floating point |\n\
    \n| double | 64-bit floating point |\n\n| boolean | true or false |"
