  trans: "\n\nListing 3.2 的第 18 行演示了如何处理从空栈中弹出元素的操作。如果没有该 `if`-语句，尝试从空栈中弹出元素将导致 `ArrayIndexOutOfBoundsException`。然而，使用栈的人应该知道他们不能从空栈中弹出元素，我们提供了\
    \ `isEmpty()` 方法来帮助他们进行检查。也没有办法可以“修复”这个错误——如果栈是空的，没有什么是可以被弹出的。\n\nListing 3.2:\
    \ 整数数组栈\n\n```java\n 1 import java.util.EmptyStackException;\n```\n\n```\n 2 \n\
    ```\n\n```\n 3 public class IntArrayStack implements IntStack {\n```\n\n```\n\
    \ 4 private int top = -1;\n```\n\n```\n 5 private int[] data;\n```\n\n```\n 6\
    \ private static final int DEFAULT_CAPACITY = 10;\n```\n\n```\n 7\n```\n\n```\n\
    \ 8 public IntArrayStack() {\n```\n\n```\n 9  data = new int[DEFAULT_CAPACITY];\n\
    ```\n\n```\n10}\n```\n\n```\n 11\n```\n\n```\n 12  public void push(int item)\
    \ {\n```\n\n```\n 13  if (top == data.length - 1) resize(2 * data.length);\n```\n\
    \n```\n 14  data[++top] = item;\n```\n\n```\n 15 }\n```\n\n```\n 16 \n```\n\n\
    ```\n 17  public int pop() {\n```\n\n```\n 18  if (isEmpty()) throw new EmptyStackException();\n\
    ```\n\n```\n 19  return data[top--];\n```\n\n```\n 20 }\n```\n\n```\n 21\n```\n\
    \n```\n 22  private void resize(int newCapacity) {\n```\n\n```\n 23  int[] newData\
    \ = new int[newCapacity];\n```\n\n```\n 24  for (int i = 0; i <= top; i++) {\n\
    ```\n\n```\n 25  newData[i] = data[i];\n```\n\n```\n 26 }\n```\n\n```\n 27  data\
    \ = newData;\n```\n\n```\n 28 }\n```\n\n```\n 29\n```\n\n```\n 30  public static\
    \ void main(String[] args) {\n```\n\n```\n 31  IntStack s = new IntArrayStack();\n\
    ```\n\n```\n 32  for (int i = 0; i < 5; i++) {\n```\n\n```\n 33  s.push(i);\n\
    ```\n\n```\n 34 }\n```\n\n```\n 35 }\n```\n\n```\n 36}\n```\n\n在这种情况下，我们通过抛出异常将问题交还给调用者：\n\
    \n```java\nthrow new ExceptionName();\n```\n\n抛出异常会导致当前方法立即停止执行，并给调用者机会（以及责任）来处理此错误。在这种情况下，空栈异常比通用的数组索引异常更具信息量。\n\
    \nTable 3.2 列出了 `java.util` 库中提供的两种异常。由于它们来自库，请在使用在使用之前导入这些异常。\n\n表 3.2\n\n`java.util`\
    \ 异常\n\n| | |\n|---|---|\n| `EmptyStackException` | 表示栈是空的。 |\n| `NoSuchElementException`\
    \ | 表示请求的元素不存在。 |\n\n### 调整数组大小\n\n记住，一旦创建了数组，其长度永远无法更改。因此，当数组满时调用了 `push()`，我们需要创建一个新数组，将现有的栈元素复制到新数组中，然后将\
    \ `data`指向新数组。我们将这项工作放入 Listing 3.2 中的一个私有 `resize()` 方法中。通过在每次数组满时将长度翻倍，我们可以最大限度地减少调整大小对\
    \ `push()`性能的影响。然而，计算这种精确的影响超出了本文的范围。\n\nJava 有内置的复制数组系统方法，在生产代码中应该使用，但我们手动这样做是为了练习处理数组。此外，队列数组实现将需要自己专门的调整大小方法。\n\
    \n### 练习题\n\n1. 编写 Java 代码声明一个名为 `s` 的 `IntStack` 变量，它指向一个 `IntArrayStack`，然后将值\
    \ 10, 20, 30 和 40 压入 `s`。\n\n2. 编写 Java 代码声明一个名为 `operands` 的 `IntStack` 变量，它指向一个\
    \ `IntArrayStack`，然后将值 17, 0, −12 和 101 压入 `operands`。\n\n3. 使用 Listing 3.2：\n\
    \    1. (a) 解释为什么 `top` 的初始值为 -1。\n    2. (b) 解释为什么 `DEFAULT_CAPACITY` 变量被声明为\
    \ `final` 和 `static`。\n    3. (c) 解释第 14 行中使用前置递增。\n    4. (d) 解释第 19 行中使用后置递减。\n\
    \    5. (e) 解释为什么如果没有第 18 行，对空栈调用 `pop()` 会导致 `ArrayIndexOutOfBoundsException`。\n\
    \n4. 假设 `s` 是一个 `IntArrayStack` 的引用。解释 `s.size()` 和 `s.data.length` 之间的差异。\n\n\
    5. 在 `s`（`IntArrayStack` 的引用）压入值 10, 20, 30 和 40 后，画出 `s.data` 的内容。\n\n6. 通过添加以下\
    \ `IntStack` 方法完成 `IntArrayStack` 类：\n    1. `isEmpty()`\n    2. `peek()`\n  \
    \  3. `size()`\n\n7. 修改 Listing 3.2：\n    1. (a) 如果栈为空，则抛出 `EmptyStackException`。\n\
    \    2. (b) 如果请求元素元素，则将长度减半。\n    3. (c) 报告栈中的元素数量。\n\n8. 修改 Listing 3.2：\n  \
    \  1. (a) 在 `push()` 使用前置递增。\n    2. (b) 在 `pop()` 使用后置递减。\n\n9. 修改 Listing 3.2：\n\
    \    1. (a) 在 `push()` 使用前置递增。\n    2. (b) 在 `pop()` 使用后置递减。\n    3. (c) 报告栈中的元素数量。\n\
    \n10. 修改 Listing 3.2：\n    1. (a) 在 `push()` 使用前置递增。\n    2. (b) 在 `pop()` 使用后置递减。\n\
    \    3. (c) 报告栈中的元素数量。\n\n11. 修改 Listing 3.2：\n    1. (a) 在 `push()` 使用前置递增。\n\
    \    2. (b) 在 `pop()` 使用后置递减。\n    3. (c) 报告栈中的元素数量。\n\n12. `IntArrayStack` 类不再使用\
    \ `top` 实例变量，而是可以使用一个存储元素数量的 `size` 实例变量。重写 Listing 3.2 以使用 `size` 实例变量而不是 `top`。讨论这两种方法之间的权衡。\n\
    \n"
- fmt: "\nA `Node` class is used to represent the nodes that link together to form\
    \ linked lists. A typical `Node` class has only its two fields, `data` and `next`,\
    \ and a constructor, as in [Listing 3.3](#K20431_C003.xhtml_lis3.3).\n\nListing\
    \ 3.3: Node\n\n```\n1 public class Node {\n```\n```\n2 private int data;\n```\n\
    ```\n3 private Node next;\n```\n```\n4\n```\n```\n5 public Node(int data, Node\
    \ next) {\n```\n```\n6  this.data = data;\n```\n```\n7  this.next = next;\n```\n\
    ```\n8}\n```\n```\n9}\n```\n\nTo implement a stack, we only need two linked list\
    \ operations: insert and remove from the front of the list.\n\n### Insertion at\
    \ Front\n\nInserting a new item at the front of a linked list takes three steps:\n\
    \n1. Create a new node:\n   ```\n    Node p = new Node(item, null);\n   ```\n\
    \   ![image](image/f0058-02.png)\n\n2. Set the `next` field of the new node to\
    \ point to the existing first node:\n   ```\n    p.next = head;\n   ```\n   ![image](image/f0059-01.png)\n\
    \n3. Update `head` to point to the new node:\n   ```\n    head = p;\n   ```\n\
    \   ![image](image/f0059-02.png)\n\nThat’s it. It helps to see these steps in\
    \ sequence, but we can actually combine them all into one line of code. The first\
    \ two steps can be done in one by providing the `next` field of the new node to\
    \ the constructor:\n```\n Node p = new Node(item, head);\n```\n\nThe third step\
    \ changed `head` to point to the new node, so we can bypass that as a separate\
    \ step by avoiding the name `p` altogether and just setting `head` to point to\
    \ the new node. Thus, inserting a new node at the front of a linked list boils\
    \ down to one line of code:\n```\nhead = new Node(item, head);\n```\n\nAssignment\
    \ statements always evaluate the expression on the right first and then assign\
    \ that value to the variable on the left. Thus, the new node is created using\
    \ the old value of `head` as its `next` field, and then `head` is assigned to\
    \ the new node.\n![image](image/f0059-03.png)\n\n### Deletion at Front\n\nDeleting\
    \ a node at the front of a linked list is also one step. Just update `head` to\
    \ point to the second node:\n![image](image/f0060-01.png)\n\nThe second node is\
    \ referenced by `head.next`, and so the code is:\n```\nhead = head.next;\n```\n\
    \nIf you need to recover data from the node that was deleted, then that has to\
    \ happen before the `head` pointer is changed.\n\nOther linked list operations\
    \ will be discussed later as we need them.\n\n### Linked Implementation\n\n[Listing\
    \ 3.4](#K20431_C003.xhtml_lis3.4) contains the core operations of a linked stack.\
    \ The exercises ask you to finish it.\n\n### Nested Classes\n\nBecause code outside\
    \ the `IntLinkedStack` class has no reason to know about nodes, the `Node` class\
    \ is defined inside the body of `IntLinkedStack`. That makes the `Node` class\
    \ a nested class of `IntLinkedStack`. Nested classes are considered members of\
    \ their containing class, just like fields and methods. Usually, nested classes\
    \ are also declared `private` because they are implementation details of the containing\
    \ class, similar to fields. Nested classes are always visible to their containing\
    \ class (and vice versa), even when declared `private`.\n\nA `static` nested class\
    \ has no access to the instance variables of the containing class. In [Listing\
    \ 3.4](#K20431_C003.xhtml_lis3.4), the only instance variable of the stack is\
    \ `top`, and there is no reason for every node to have access to the top of the\
    \ stack. Most of our linked structures will use `static` nested node classes,\
    \ but we will see an example of a non-static nested class in [Chapter 6](#K20431_C006.xhtml_ch6).\n\
    \n### Null Pointer Exceptions\n\nRecall (see page 22) that attempting to access\
    \ a field or method of a null reference generates a `NullPointerException`. Linked\
    \ list code is particularly susceptible to null pointer exceptions because of\
    \ how often expressions like `p.next` and `p.next.next` are used.\n\nListing 3.4:\
    \ Integer Linked Stack\n\n```\n 1 public class IntLinkedStack implements IntStack\
    \ {\n```\n```\n 2 private Node top;\n```\n```\n 3\n```\n```\n 4 public void push(int\
    \ item) {\n```\n```\n 5  top = new Node(item, top);\n```\n```\n 6}\n```\n```\n\
    \ 7\n```\n```\n 8 public int pop() {\n```\n```\n 9  int result = top.data;\n```\n\
    ```\n10  top = top.next;\n```\n```\n11  return result;\n```\n```\n12}\n```\n```\n\
    13\n```\n```\n14 private class Node {\n```\n```\n15  private int data;\n```\n\
    ```\n16  private Node next;\n```\n```\n17\n```\n```\n18  private Node(int data,\
    \ Node next) {\n```\n```\n19  this.data = data;\n```\n```\n20  this.next = next;\n\
    ```\n```\n21}\n```\n```\n22}\n```\n```\n23}\n```\n"
