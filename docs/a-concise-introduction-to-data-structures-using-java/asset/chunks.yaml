  trans: "\n\n同样的思路也可以用于组合对象中多个字段的哈希值。\n\n### Java Hashcodes\n\nJava `hashCode()`\
    \ 方法为 `String` 类型实现了这种算法。`Object` 类中也提供了一个最小的 `hashCode()` 定义，其意图是在需要时对其进行重写。\n\
    \n遗憾的是，`hashCode()` 方法并不总是产生有效的表索引。例如，\n\n```\n\"scrape\".hashCode()\n```\n\n\
    返回 −907693388。为什么？因为 `hashCode()` 的返回类型是 `int`，而 `int` 的最大值为 $2^{31}-1$，这小于于上面计算出的“scrape”的哈希值：\n\
    \n$2^{31}-1 = 2,147,483,647 < 3,387,273,908$\n\n因此，计算发生了溢出，在这种情况下溢为了一个负值。\n\n\
    结果是，在将 Java 哈希值作为表索引之前，必须将其强制转换为非负数。实现此点的可靠方法是将第一位设置为 0：\n\n```\nkey.hashCode()\
    \ & Integer.MAX_VALUE\n```\n\n位运算符 `&` 计算两个值之间的按位逻辑“与”；单个 `|` 用于按位“或”。\n\n###\
    \ 练习题\n\n1. 对于以下每种情况，判断直接寻址或哈希法可能更合适。解释你的答案。\n    1. (a) 约 500 条记录，每条记录有一个 3 位的唯一\
    \ ID。\n    2. (b) 约 1000 条记录，每条记录有一个 8 位的唯一 ID。\n2. 分别用十进制和二进制列出 `k` 和 `k % 8`\
    \ 的值表，以解释为什么使用 $M = 2^m$ 取余数只使用键的最后 $m$ 位。为 `k` 自行选择值。\n3. 给出一个使用哈希函数 $f(k) =\
    \ k \\bmod 97$ 会发生冲突的两个键示例。\n4. 给出一个使用哈希函数 $f(k) = k \\bmod 239$ 会发生冲突的两个键示例。\n\
    5. 手动计算这些字符串的 Java `hashCode()`：\n    1. (a) \"Java\"\n    2. (b) \"table\"\n\
    \    3. (c) \"data\"\n    4. (d) \"Data\"\n6. 假设学生注册数据将存储在哈希表中，每个注册条目由一个数字学生 ID、一个字符串\
    \ `departmentName` 和一个数字 `courseNumber` 标识。为这些注册信息设计一个 `hashCode()`。\n7. 假设一个日期被存储为三个整数：`day`、`month`\
    \ 和 `year`。为这种日期类型设计一个 `hashCode()`。\n8. 解释对于 32 位整数 `k`，这个位运算操作究竟发生了什么：\n   ```\n\
    k & Integer.MAX_VALUE\n   ```\n9. 解释为什么 `Math.abs()` 返回一个负值（参见第 191 页的脚注）。你可能需要对整数表示进行一些研究。\n\
    \n### 11.3 链法 (Chaining)\n\n在哈希时，冲突是不可避免的，解决冲突的方法之一是将所有哈希到相同索引的项放入链表中。这种解决冲突的方法称为链法，每个链表被称为一条链（chain）。\n\
    \n### 实现\n\n编写带有链法的哈希表 `LinkedHashMap` 实现的一种自然方法是像以前一样从零开始编写链表代码。然而，我们在第 11.1\
    \ 节通过编写 `LinkedMap` 类已经完成了这项工作。因此，更好的主意是在哈希表的每个索引处放置一个链式 map：\n\n然后每个链式 map 负责其索引处的链。\n\
    \n通过这种结构，`LinkedHashMap` 类中每个方法的的基本思想是相同的：\n\n1. 使用哈希函数计算哈希表中的索引。\n2. 调用该索引处链式\
    \ map 的对应方法。\n\n实现此策略时很少出现复杂情况。唯一可能需要解释的是涉及泛型数组。\n\n### 重新回顾泛型数组\n\n如果每个数组索引存储指向链式\
    \ map 的引用，那么 `LinkedHashMap` 中的表声明将需要如下所示：\n\n```\nprivate LinkedMap<K, V>[] table;\n\
    ```\n\n正如我们在第 170 页为可比较类型创建数组时发现的，`Object` 类不能用于创建这种泛型数组。相反，必须使用 `LinkedMap` 类型，然后转换为泛型类型：\n\
    \n```\ntable = (LinkedMap<K, V>[]) new LinkedMap[M];\n```\n\n`Object` 类型仅适用于我们开始时的普通\
    \ `E[]` 数组：\n\n```\ndata = (E[]) new Object[capacity];\n```\n\n任何更具体的（尽管是泛型的）类型如\
    \ `LinkedMap<K, V>` 都需要使用相应的非泛型 `LinkedMap` 类型来创建数组。\n\n### 性能\n\n链式 map 中 `put()`\
    \ 和 `get()` 的线性性能在第 11.1 节中可能看起来并不很有前景。然而，作为哈希表中的链，它们是令人深刻的，因为我们可以控制链的长度。\n\n\
    决定哈希表性能的关键是它的负载因子\n$\\lambda = \\frac{n}{M}$\n其中 $n$ 是项数，$M$ 是表的大小。\n\n### 时间权衡\n\
    \n哈希表是一个完美的例子，说明你可以通过更多的空间来换取更快的性能：更大的表大小 $M$ 会产生较小的 $\\lambda$。\n\n### 删除\n\n\
    使用链法从哈希表中删除元素是常规操作：它只需涉及从相应的列表中移除节点。\n\n### 练习题\n\n1. 对于以下每种情况，判断直接寻址或哈希法可能更合适。解释你的答案。\n\
    \    1. (a) 约 500 条记录，每条记录有一个 3 位的唯一 ID。\n    2. (b) 约 1000 条记录，每条记录有一个 8 位的唯一\
    \ ID。\n2. 分别用十进制和二进制列出 `k` 和 `k % 8` 的值表，以解释为什么使用 $M = 2^m$ 取余数只使用键的最后 $m$ 位。为\
    \ `k` 自行选择值。\n3. 给出一个使用哈希函数 $f(k) = k \\bmod 97$ 会发生冲突的两个键示例。\n4. 给出一个使用哈希函数 $f(k)\
    \ = k \\bmod 239$ 会发生冲突的两个键示例。\n5. 手动计算这些字符串的 Java `hashCode()`：\n    1. (a) \"\
    Java\"\n    2. (b) \"table\"\n    3. (c) \"data\"\n    4. (d) \"Data\"\n6. 假设学生注册数据将存储在哈希表中，每个注册条目由一个数字学生\
    \ ID、一个字符串 `departmentName` 和一个数字 `courseNumber` 标识。为这些注册信息设计一个 `hashCode()`。\n\
    7. 假设一个日期被存储为三个整数：`day`、`month` 和 `year`。为这种日期类型设计一个 `hashCode()`。\n8. 解释对于 32\
    \ 位整数 `k`，这个位运算操作究竟发生了什么：\n   ```\nk & Integer.MAX_VALUE\n   ```\n9. 解释为什么 `Math.abs()`\
    \ 返回一个负值（参见第 191 页的脚注）。你可能需要对整数表示进行一些研究。\n\n3. 如果使用链法解决冲突，负载因子 $\\lambda > 1$\
    \ 是否可能？解释为什么或为什么。\n4. 开发一个使用链法解决冲突的 `LinkedHashMap<K, V>`。使用 `LinkedMap` 存储每个链。包含这些成员：\n\
    \    1. (a) 构造函数 默认构造函数和第二个接受表大小参数的构造函数。\n    2. (b) `hash(key)` 计算哈希函数的私有方法。\n\
    \    3. (c) `containsKey()`\n    4. (d) `get()`\n    5. (e) `isEmpty()`\n    6.\
    \ (f) `put()`\n    7. (g) `size()`\n5. 为 `LinkedHashMap` 类写一个 `main()` 方法，创建一个使用链的哈希表，在表中放入一些值，并查找它们。\n\
