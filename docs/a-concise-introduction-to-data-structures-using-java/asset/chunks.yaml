    \ editor at Chapman & Hall/CRC Press, for her ongoing support; I truly appreciate\
    \ it. And thanks to my colleagues at Central College, including Mark Babcock,\
    \ director of the college-community chorus, for his regular use of the technique\
    \ “only one new thing at a time.”\n\n# About the Author\n\nMark J. Johnson is\
    \ professor of computer science and mathematics at Central College in Pella, Iowa,\
