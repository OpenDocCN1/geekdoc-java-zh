    ```\n\n```\n}\n```\n\n3. (c)\n\n```\nwhile (!items.isEmpty()) {\n```\n\n```\n\
    System.out.println(items.removeAt(items.size() - 1));\n```\n\n```\n}\n```\n\n\
    10. Assuming `items` is an empty `ArrayList`, determine the `O()` performance\
    \ of each of these fragments of code. Give your answers in terms of `n`.\n\n1.\
    \ (a)\n\n```\nfor (int i = 0; i < n; i++) {\n```\n\n```\nitems.add(i);\n```\n\n\
    ```\n}\n```\n\n2. (b)\n\n```\nfor (int i = 0; i < n; i++) {\n```\n\n```\nitems.add(0,\
    \ i);\n```\n\n```\n}\n```\n\n## 6.3 Linked Implementation\n\nIn contrast to the\
    \ array implementation of the `List` ADT, a linked list implementation may seem\
    \ less natural. Linked lists are good at moving from one node to the next rather\
    \ than directly to a particular index. However, keep in mind that the array implementation\
    \ has its own awkwardness: any time an element is inserted or removed from the\
    \ list, other items have to shift in the array. A linked implementation never\
    \ has to shift elements, since it can simply reassign pointers.\n\nTwo linked\
    \ list options are helpful for the `List` ADT: using a dummy node and double links.\n\
    \n### Dummy Nodes\n\nCompare the steps for inserting and removing at the front\
    \ of a linked list (pages 58–60) with inserting and removing after a node (pages\
    \ 86–88). The front of the list is different from everywhere else because it requires\
    \ changing the head of the list.\n\nUnlike stacks and queues, the `List` ADT allows\
    \ inserting and removing anywhere in the list, so it would be helpful to not have\
    \ to write a special case for the front of the list. We can do this by creating\
    \ a dummy node at the front of the list:\n\n![image](image/112x001.png)\n\nThen\
    \ every insertion or deletion will occur “after a node,” and the head will never\
    \ change. The dummy node contains no data; its purpose is just to simplify insertion\
    \ and deletion code. If a dummy node is used, other nodes are sometimes referred\
    \ to as regular nodes.\n\n### Double Links\n\nThe linked lists we have used to\
    \ this point are known as singly-linked lists because each node has a single link\
    \ to the next node. A doubly-linked list has two pointers in each node, one to\
    \ the previous node and one to the next:\n\n![image](image/113x001.png)\n\nSingle\
    \ links were sufficient for stacks and queues (and are also sufficient for the\
    \ `List` ADT), but there is some convenience in using double links for insertion\
    \ and deletion in the middle of a list.\n\nBe careful, though: double links make\
    \ it easier to write code that generates null pointer exceptions. The reason is\
    \ that compound expressions such as `p.next.prev` and `p.prev.next` become common.\
    \ The key to writing such expressions was given in [Section 3.3](#K20431_C003.xhtml_ch3.3):\
    \ make sure that variables being dereferenced are not null. In a compound expression,\
    \ there are two references to check:\n\n![image](image/113x002.png)\n\n### Deletion\
    \ with Double Links\n\nTo illustrate the use of double links, we develop the code\
    \ to delete a given node `p`.\n\n![image](image/113x003.png)\n\nTo avoid compound\
    \ expressions for now, assign references to the node before `p` and the node after\
    \ `p`:\n\n```\nNode<E> prev = p.prev;\n```\n\n```\nNode<E> next = p.next;\n```\n\
    \nThe main step is the same as for deleting the node after `prev` (see page 87):\n\
    \n```\nprev.next = next;\n```\n\nUpdating `prev.next` results in this change to\
    \ the diagram:\n\n![image](image/114x001.png)\n\nIf there is a dummy node, that\
    \ step is safe, because `prev` must exist. However, there is no guarantee that\
    \ `next` is not null, and so the second connection requires a check first:\n\n\
    ```\n if (next != null) next.prev = prev;\n```\n\n![image](image/114x002.png)\n\
    \nThe complete `removeAt()` method is in [Listing 6.2](#K20431_C006.xhtml_lis6.2).\n\
    \n### Traversals\n\nWalking through the nodes of a linked list is known as traversing\
    \ the list. The idea of a full traversal is simple: start at the front of the\
    \ list (or perhaps skip the dummy node) and keep following `next` pointers until\
    \ you reach `null`. The Java implementation is a nice `for`-loop:\n\n```\nfor\
    \ (Node<T> p = head; p != null; p = p.next) {\n// work with node pointed to by\
    \ p\n}\n```\n\nRecall that the three components of the `for` are initialize, test,\
    \ and increment, and those are exactly the steps needed for traversal.\n\n###\
    \ Indexed Access\n\nBecause linked lists do not have direct indexed access to\
    \ each element, it will be helpful to write a private `getNode` method. The `getNode()`\
    \ method traverses the list returning the node for a given index. [Listing 6.2](#K20431_C006.xhtml_lis6.2)\
    \ gives the implementation.\n\n### Performance\n\nAs an example of analyzing linked\
    \ list operations, consider the performance of `removeAt()` method in [Listing\
    \ 6.2](#K20431_C006.xhtml_lis6.2) in terms of `n`, the number of items in the\
    \ list. It appears to be a simple sequence of a fixed number of steps, which would\
    \ be O(1). But one of those steps is a call to `getNode()`, which traverses the\
    \ list. Thus, the performance of `removeAt()` is O(n).\n\n### Using Nodes and\
    \ References\n\nOne last piece of advice for navigating linked list code: at times,\
    \ you will need to distinguish between a reference and the node it refers to.\
    \ For example, using single links for simplicity, we often view the node after\
    \ the node referenced by `p` as `p.next`:\n\n![image](image/115x001.png)\n\nBut\
    \ if you need to change `p.next`, the reference `p.next` lives in the node pointed\
    \ to by `p`, along with `p.data`:\n\n![image](image/115x002.png)\n\nUnderstanding\
    \ this difference between a reference and the node it refers to will help you\
    \ write correct code.\n\n### Exercises\n\n1. Explain why `getNode()` was not used\
    \ to find `prev` and `next` in the `removeAt()` method of [Listing 6.2](#K20431_C006.xhtml_lis6.2).\
    \ Could it have been used?\n\n2. Describe the circumstances (i.e., which node\
    \ or nodes are being deleted) when the if-statement at line 9 prevents a null\
    \ pointer exception in [Listing 6.2](#K20431_C006.xhtml_lis6.2).\n\n3. Rewrite\
    \ the `removeAt()` method of [Listing 6.2](#K20431_C006.xhtml_lis6.2) to use compound\
    \ expressions instead of the separate variables `prev` and `next`.\n\n4. Develop\
    \ the `LinkedList<E>` class implementing the `List<E>` interface by writing these\
    \ class members. Use double links and a dummy node.\n\n    1. (a) Private `Node<T>`\
    \ class Include a default constructor taking no parameters that sets all three\
    \ fields to `null`.\n\n### Listing 6.2: Deletion\n\n```\npublic E removeAt(int\
    \ index) {\n  if (index < 0 || index >= size)\n    throw new IndexOutOfBoundsException();\n\
    \  Node<E> p = getNode(index);\n  Node<E> prev = p.prev;\n  Node<E> next = p.next;\n\
    \  E result = p.data;\n  prev.next = next;\n  if (next != null) next.prev = prev;\n\
    \  size--;\n  return result;\n}\n```\n\n### Listing 6.2: Helper\n\n```java\nprivate\
    \ Node<E> getNode(int index) {\n  Node<E> p = head;\n  for (int i = 0; i < index;\
    \ i++) {\n    p = p.next;\n  }\n  return p;\n}\n```\n"
