  trans: "\n\n12. 为 `LinearProbeHashMap` 类编写一个 `main()` 方法，创建一个哈希表，向表中存入一些值并查找它们。\n\
    \n13. 解释为什么对于双哈希法，第二个哈希函数的值应该与表大小 `M` 互质。提示：尝试一些互不互质的例子，看看会发生什么。\n\n14. 解释为什么当\
    \ `M` 是质数时，建议的第二个哈希函数\n```\nh(k) = 1 + (k mod (M − 1))\n```\n的值被保证与 `M` 互质。\n\n\
    15. 基于数组的栈、队列和列表实现在容量超出时，只是简单地将其内容复制到更大的数组中。\n\n    1. (a) 解释为什么这种基本策略对于使用开放寻法的哈希表不可行。\n\
    \    2. (b) 描述一种可行的策略。\n\n16. 链法法和开放寻址都需要条目本身之外的额外内存。比较使用链法法的哈希表与使用线性探测法的表所需的额外空间。是否其中某种方法具有明显的优势？说明你的理由。\n\
    \n17. 在 `LinearProbeHashMap` 类中实现可选的 `remove()` 方法。使用之前在 Listing 11.2 中概述的策略，对可能受删除影响的搜索条目进行重新哈希。注意管理表中的条目数量。\n\
    \n1 如果你重写了 `hashCode()`，请务必遵守 Java API 中指定的约定。特别是，如果 `equals()` 声明两个对象相同，那么它们必须返回相同的\
