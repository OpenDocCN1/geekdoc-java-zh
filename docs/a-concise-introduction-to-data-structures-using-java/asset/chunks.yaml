    \ toString() {\n```\n\n```\n 24   return data.toString();\n```\n\n```\n 25}\n\
    ```\n\n```\n 26 }\n```\n\n```\n 27}\n```\n\n### Exercises\n\n1. Add these public\
    \ methods to the `BinaryTree` class in [Listing 8.2](#K20431_C008.xhtml_lis8.2):\n\
    \    1. (a) `inorder()` Use a private recursive traversal.\n    2. (b) `postorder()`\
    \ Use a private recursive traversal.\n    3. (c) `toString()` Call one of the\
    \ traversals.\n\n2. Write a public `breadthFirst()` traversal method for the `BinaryTree`\
    \ class in [Listing 8.2](#K20431_C008.xhtml_lis8.2). Implement the algorithm from\
    \ [Listing 8.1](#K20431_C008.xhtml_lis8.1), using your own `queue` class and a\
    \ `StringBuilder` to accumulate the results. Set up the queue to store `Node<E>`\
    \ objects, and be careful not to put `null` entries in the queue.\n\n3. The call\
    \ to `trim()` in line 11 of [Listing 8.2](#K20431_C008.xhtml_lis8.2) cleans up\
    \ some extra spaces, but it can still leave different numbers of internal spaces\
    \ between items in `preorder` and `postorder` traversals. Fix this problem so\
    \ that there is always one space between elements in the traversals.\n\n### Project:\
    \ A Collection Hierarchy\n\nYou may have noticed some code duplication with the\
    \ stack, queue, and list data structures. Abstract classes can help reduce that\
    \ duplication by defining common fields and methods. There is no one best way\
    \ to decide what goes into an abstract superclass, but the idea is to aim for\
    \ a design that minimizes duplicate code.\n\nIf we map out what was common among\
    \ stacks, queues, and lists, it looks something like this:\n\n- All of the structures\
    \ had `size()` and `isEmpty()` methods. Some also included a `size` instance variable.\n\
    - Array structures all had a `data` array instance variable, two constructors,\
    \ and a `resize()` method. The queue needed its own specialized version of `resize()`\
    \ and had a separate `capacity` instance variable.\n- Linked structures defined\
    \ a private `node` class and had at least a `head` instance variable.\n\nThese\
    \ common features suggest the following inheritance hierarchy:\n\n![image](image/148x001.png)\n\
    \nRemember that in addition to inheriting fields and methods from their superclass,\
    \ subclasses may define new fields and methods, as well as override existing methods.\n\
    \n### Exercises\n\n1. Develop a Collection hierarchy as described above. Write\
    \ the necessary abstract classes and modify the concrete classes to participate\
    \ in the hierarchy.\n\nAlthough a general approach is suggested, you will still\
    \ need to make specific design decisions along the way. Write a short report explaining\
    \ the choices you make, including how you approached those decisions and the alternatives\
    \ you considered.\n\n[1](#K20431_C008.xhtml_if_ch08_1) Siblings of the root could\
    \ be considered other roots in the same forest. This allows an entire forest of\
    \ general trees to be represented by one binary tree.\n\n# Chapter 9\n\n# Binary\
    \ Search Trees\n\nThe next several chapters focus on data structures that provide\
    \ fast search, insertion, and deletion. Binary search trees generally give very\
    \ good performance on all three of these operations. Recall from [Section 8.1](#K20431_C008.xhtml_ch8.1)\
    \ that we assume binary search trees do not contain duplicate elements.\n\n[Table\
    \ 9.1](#K20431_C009.xhtml_Text_Anchor_tab9.1) lists the public API of the `BinarySearchTree`\
    \ class.\n\n#### Table 9.1: Binary Search Tree\n\n| Method | Description |\n|\
    \ :--- | :--- |\n| `add(E item)` | Adds item if not present. |\n| `contains(E\
    \ item)` | True if item in tree. |\n| `min()` | Returns smallest item in tree.\
    \ |\n| `max()` | Returns largest item in tree. |\n| `pred(E item)` | Returns predecessor\
    \ of item in tree. |\n| `remove(E item)` | True if item found and removed from\
    \ tree. |\n| `succ(E item)` | Returns successor of item in tree. |\n\n## 9.1 Queries\n\
    \nBinary search trees are built for fast searching using an algorithm just like\
    \ [sorted list](#K20431_C008.xhtml_ch8.1).\n\n### Search\n\nThe algorithm for\
