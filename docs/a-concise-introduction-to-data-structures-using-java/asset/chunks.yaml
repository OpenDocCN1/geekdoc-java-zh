    \ define the two fields `num` and `den` in the `Fraction` class. Fields are normally\
    \ declared `private` so that other classes are forced to use `public` methods\
    \ to access class or object data.\n\nFields may be initialized at the time of\
    \ declaration, or they may be assigned values by a constructor. If not initialized,\
    \ fields are given a default value based on their type: generally, numeric types\
    \ are set to 0 and object references are `null`. The fields `num` and `den` are\
    \ not initialized, so they are given default values which will be.\n\n### Writing\
    \ Methods\n\nYou are already familiar with writing methods in classes, although\
    \ prior to this section, all of our methods have been static. As described in\
    \ [Section 1.1](#K20431_C001.xhtml_ch.1), methods must declare their return type\
    \ and the type of their parameters. Each method may also declare its visibility.\n\
    \nInside non-static methods, the keyword `this` refers to the current object on\
    \ which the method was called. Thus, inside method bodies (including constructors),\
    \ this syntax:\n\n```\nthis.fieldName\n```\n\nreferences a field rather than some\
