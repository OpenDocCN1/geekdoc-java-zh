    \ = next;\n```\n\n```\n13 }\n```\n\n```\n14}\n```\n\n```\n15}\n```\n\n在制作泛型 `ArrayStack<E>`\
    \ 时还有几点困难。主要问题由于泛型数组的局限性。\n\n### 泛型数组\n\n`IntArrayStack` 中的数据数组类型为 `int[]`，因为我们在栈中存储的是整数。为了制作泛型数组栈，数据数组需要存储类型为\
    \ `E`（即泛型类型参数）的值。\n\n泛型类型可以用于声明数组类型：\n\n```\nprivate E[] data;\n```\n\n然而，泛型类型不能用于创建数组：\n\
    \n![image](img/f0071-01.png)\n\n禁止创建泛型数组的原因是，编译器需要知道数组元素的类型 `E` 以生成正确的代码，但 `E`\
    \ 的值在每个泛型数组栈被创建时才会被指定。\n\n最简单的解决方案是创建一个 `Object` 数组并将其强制转换为泛型类型：\n\n```\nE[] arrayRef\
    \ = (E[]) new Object[LENGTH];\n```\n\n此类型强制转换（见第 3 页）告诉编译器将该数组视为 `E[]` 类型。由于我们计划只推入和弹出\
    \ `E` 类型的元素，这不会成为问题。`Object` 类的性质稍后将在 第 5.3 节 中解释；目前，将其视为可以是任何对象的类型即可。\n\n一旦以这种方式创建并转换了数组，就可以被视为具有\
    \ `E[]` 类型。\n\n### 未检查的强制转换\n\n遗憾的是，编译器无法验证将 `Object[]` 数组强制转换为泛型 `E[]` 数组是安全的，因此它会产生未检查的转换（unchecked\
    \ cast）警告。（如果警告没有指定未检查的转换发生的位置，请使用 `-Xlint:unchecked` 标志重新编译。）\n\n与其忽略警告，更好的解决方案是在使用类型强制转换的方法开始处添加以下注解来消除（squelch）该警告，从而告诉编译器——在这种情况下——我们知道自己在做什么：\n\
    \n```\n@SuppressWarnings(\"unchecked\")\n```\n\n当然，这种注解应该谨慎使用。\n\n### 过时引用\n\n\
    最后，由于泛型类型参数必须是引用类型，在数组中存储对象引用而非基本类型产生了一个新问题。虽然这并不严重，但在任何在数组中存储引用的数据结构中都可能发生相同的问题。现在处理它有助于建立关于基本类型和对象类型差异的直觉。\n\
    \n考虑一个初始容量为 7 的数组栈在推入 0 到 6 的整数时看起来像什么样：\n\n![image](img/f0072-01.png)\n\n然后弹出直到栈空（当栈顶为\
    \ −1）：\n\n![image](img/f0072-02.png)\n\n我们没有删除任何被弹出的项，因为没有理由这样做：没有使用额外的内存，而且栈不允许访问栈顶之外的项。\n\
    \n然而，对于对象引用来说，情况是不同的。如果我们推入然后弹出相同数量的对象，那么即使当栈恢复为空时，它们的引用仍然是活跃的：\n\n![image](img/f0072-03.png)\n\
    \n栈阻止了对其中任何一个对象的访问，但这些对象的内存无法被垃圾回收，因为它们仍然被活跃的引用指向。正如第 23 页所述（以及 Bloch 著作第 6 项，来自\
    \ [[4]](#K20431_bib.xhtml_ref_4)），解决方案是在这些引用不再需要时将它们设置为 `null`。\n\n但是，不要沉迷于将所有引用都设置为\
    \ `null`；这是一个相对少见的问题。虽然将弹出的条目设置为 `null` 是一种良好的做法，但不要依赖它来确定哪些数组条目被用于栈。`top` 实例变量应该始终被用于判断栈顶的位置。\n\
    \n### 泛型数组栈\n\n将这些部分结合起来得到了 列表 4.3，这是泛型 `ArrayStack<E>` 类的开头。你将在练习中被要求编写 `ArrayStack<E>`\
    \ 类的剩余部分。\n\n列表 4.3：泛型数组栈\n\n```\n1 public class ArrayStack<E> implements Stack<E>\
    \ {\n```\n\n```\n2 private E[] data;\n```\n\n```\n3 private int top = -1;\n```\n\
    \n```\n4 private final int CAPACITY = 10;\n```\n\n```\n5\n```\n\n```\n\n```\n\
    6 @SuppressWarnings(\"unchecked\")\n```\n\n```\n7 public ArrayStack() {\n```\n\
    \n```\n8 data = (E[]) new Object[CAPACITY];\n```\n\n```\n9 }\n```\n\n```\n10 public\
    \ E pop() {\n```\n\n```\n11 E result = data[top];\n```\n\n```\n12 data[top--]\
    \ = null;\n```\n\n```\n13 return result;\n```\n\n```\n14 }\n```\n\n```\n15\n```\n\
    \n### 练习\n\n1. 通过编写以下方法完成 列表 4.2 中的 `LinkedStack<E>` 实现：\n   - `isEmpty()`\n \
    \  - `peek()` 如果栈为空则抛出异常。\n   - `pop()` 如果栈为空则抛出异常。\n   - `push()`\n   - `size()`\n\
    \n2. 在 `LinkedStack<E>` 类中添加 `main()` 方法来测试该栈：\n   - 整数\n   - 浮点数\n   - 字符串\n\n\
    3. 确定 `LinkedStack<E>` 方法的 O() 复杂度：\n   - `isEmpty()`\n   - `peek()`\n   - `pop()`\n\
    \   - `size()`\n\n4. 通过编写以下方法完成 列表 4.3 中的 `ArrayStack<E>` 类：\n   - `isEmpty()`\n\
    \   - `peek()` 如果栈为空则抛出异常。\n   - `push()` 如果数组满则长度翻倍。\n   - `size()`\n   - `private\
    \ resize()`\n   - 带有容量参数的第二个构造函数。使用 `this()` 修改现有构造函数。\n   - `pop()` 如果栈为空则抛出异常。\n\
    \   - `pop()` 如果栈中元素少于长度四分之一则将长度减半。\n\n5. 在 `ArrayStack<E>` 类中添加 `main()` 方法来测试该栈：\n\
    \   - 整数\n   - 浮点数\n   - 字符串\n\n6. 确定 `ArrayStack<E>` 方法的 O() 复杂度：\n   - `isEmpty()`\n\
    \   - `peek()`\n   - `pop()` 忽略调整大小。\n   - `size()`\n\n## 4.3 表达式评估：背景\n\n栈在求值表达式时特别有用。事实上，如果我们将评估过程分为两个阶段，栈在两个步骤中都是关键组件。为了描述这个过程，我们首先需要一些术语。\n\
    \n### 二元运算\n\n加法、减法、乘法和除法等运算被称为二元运算，因为它们每个结合两个操作数。虽然我们认为表达式 1 + 2 + 3 + 4 结合了多个操作数，但在\
    \ Java 等编程语言中，该表达式实际上是两个两个评估一次，从左侧分组：\n\n((1 + 2) + 3) + 4\n\n数学上的加结合律保证了所有分组产生相同的结果；Java\
    \ 选择这种分组是因为它将加法视为从左到右结合的。\n"
- fmt: "\nHowever, associativity only applies to operators with the same precedence.\
    \ Operator precedence is used first to determine the order of operations when\
    \ parentheses have not been specified. These follow normal mathematical rules,\
    \ so multiplication and division have higher precedence than addition and subtraction.\
    \ Consult the Java documentation for a complete list of precedence and associativity\
    \ rules.\n\nThus, the final order of operations for an expression in Java is determined\
    \ by applying each of these in order:\n\n1. Parentheses\n2. Operator precedence\n\
    3. Associativity among operators with the same precedence\n\n### Prefix, Infix,\
    \ and Postfix\n\nStrangely enough, all of the above rules for parentheses, operator\
    \ precedence, and associativity exist because we prefer writing binary operations\
    \ in infix form. Two other forms, prefix and postfix, are completely unambiguous\
    \ and require none of those additional rules.\n\nConsider the simple binary operation\
    \ `a + b`. Equivalent prefix and postfix forms are shown in [Table 4.4](#K20431_C004.xhtml_Text_Anchor_tab4.4).\
    \ Our goal is to become familiar with prefix and postfix notations in order to\
    \ develop an algorithm for evaluating infix expressions using stacks.\n\n####\
    \ Table 4.4: Operator Notations\n\n| Prefix | `+ a b` | Operator first |\n| :---\
    \ | :--- | :--- |\n| Infix | `a + b` | |\n| Postfix | `a b +` | Operator last\
    \ |\n\n#### Example\n\nWhen translating prefix or postfix expressions by hand,\
    \ it can be helpful to identify simple components first, with one operator and\
    \ two operands, and then build up from there.\n\nFor example, consider translating\
    \ this prefix expression to infix:\n\n```\n - / + a b c * d + e f\n```\n\nBegin\
    \ by finding the simple prefix components (operator operand operand):\n\n![image](image/f0076-01.png)\n\
    \nNow treat the boxes as operands and repeat the process:\n\n![image](image/f0076-02.png)\n\
    \nAt this stage, we are have one (large) simple expression that can be translated\
    \ to infix:\n\n![image](image/f0076-03.png)\n\nWork your way inward, translating\
    \ each box to infix:\n\n![image](image/f0076-04.png)\n\nNotice that when you write\
    \ the infix expression, some of the boxes must be written with parentheses to\
    \ convey the correct expression:\n\n```\n(a + b) / c - d * (e + f)\n```\n\n###\
    \ Evaluating Postfix Algorithm\n\nOne can evaluate postfix expressions by hand\
    \ in a similar way, and [Listing 4.4](#K20431_C004.xhtml_lis4.4) systemizes that\
    \ process using a stack to hold the operands and, eventually, the final result.\
    \ We will assume all operands are integers.\n\n**Listing 4.4: Evaluate Postfix\
    \ (Pseudocode)**\n\n```\n1 For each term in expression\n2 If term is an operator\n\
    3  Pop second operand\n4  Pop first operand\n5  Apply operator to operands and\
    \ push result\n6 Else\n7  Push operand onto stack\n8 Pop result\n```\n\n#### Example\n\
    \nTo see how [Listing 4.4](#K20431_C004.xhtml_lis4.4) works, consider the postfix\
    \ expression:\n\n```\n 3 5 1 - *\n```\n\nThe first three terms are operands so\
    \ they are pushed onto the stack:\n\n![image](image/f0077-01.png)\n\nThe next\
    \ term is the operator `–`, so we follow these steps:\n\n| Pop second operand\
    \ | Stack → 1 |\n| Pop first operand | Stack → 5 |\n| Apply operator to operands\
    \ | 5 |\n| Push result | Stack 4 |\n\nNotice the order the operands are popped:\
    \ the second operand comes off the stack first because of the order in which they\
    \ were pushed. The stack contents are now:\n\n![image](image/f0077-02.png)\n\n\
    The last term is `*`:\n\n| Pop second operand | Stack → 4 |\n| Pop first operand\
    \ | Stack → 3 |\n| Apply operator to operands | 3 * 4 |\n| Push result | Stack\
    \ 12 |\n\nand then the stack contains the final result, ready to be popped:\n\n\
    ![image](image/f0077-03.png)\n\n### Infix to Postfix Algorithm\n\n[Listing 4.5](#K20431_C004.xhtml_lis4.5)\
    \ outlines a similar algorithm to translate infix to postfix. It uses a stack\
    \ to hold operators and is slightly more complex than [Listing 4.4](#K20431_C004.xhtml_lis4.4)\
    \ because of the inner loop in lines 3 and 4. This algorithm assumes there are\
    \ no parentheses.\n\n**Listing 4.5: Infix to Postfix (Pseudocode)**\n\n```\n1\
    \ For each term in expression\n2 If term is an operator\n3  Pop all operators\
    \ of same or higher precedence\n4  and copy each to output\n5  Push this operator\
    \ onto stack\n6 Else\n7  Copy operand to output\n8 Pop remaining operators and\
    \ copy to output\n```\n\n#### Example\n\nGiven the infix expression\n\n```\n a\
    \ + b / c - d\n```\n\nwe can trace [Listing 4.5](#K20431_C004.xhtml_lis4.5) by\
    \ keeping track of the stack and accumulated output. The first term, `a`, is copied\
    \ to output. The second, `+`, is pushed onto the stack, and the third, `b`, is\
    \ copied to output. At this point, we have:\n\n![image](image/f0078-01.png)\n\n\
    The next term is the operator `/`. The `+` on top of the stack does not have the\
    \ same or higher precedence as this term, so nothing is popped and `/` is pushed:\n\
    \n![image](image/f0078-02.png)\n\nThe `c` is copied to output, and then the next\
    \ term is `-`:\n\n![image](image/f0078-03.png)\n\nIn this case, `/` on the top\
    \ of the stack has the same or higher precedence than the current term, so it\
    \ is popped and copied to output. The same is true for `+`, so it is popped and\
    \ copied to output:\n\n![image](image/f0079-01.png)\n\nAt this point, the stack\
    \ is empty, so `-` is pushed:\n\n![image](image/f0079-02.png)\n\nFinally, the\
    \ `d` is copied to output and any remaining operators on the stack are popped\
    \ and copied to the final output:\n\n```\n Output: a b c / + -\n```\n\nThe most\
    \ difficult part of doing this algorithm by hand is keeping track of when to pop\
    \ operators and when to leave them on the stack. The combination of [Listings\
    \ 4.4](#K20431_C004.xhtml_lis4.4) and [4.5](#K20431_C004.xhtml_lis4.5) gives an\
    \ algorithm for evaluating infix expressions, which we develop code for in the\
    \ next section.\n\n### Exercises\n\n1. Look up the precedence and associativity\
    \ of these Java operators: `&&`, `++`, `<`, `==`.\n2. Convert these prefix expressions\
    \ to infix and postfix:\n   - (a) `* + / - a b c d e`\n   - (b) `/ - a b * + c\
    \ d e`\n   - (c) `+ - a * b c / d e`\n   - (d) `- a / b * c + d e`\n3. Convert\
    \ these postfix expressions to infix and prefix:\n   - (a) `a b c d e * + / -`\n\
    \   - (b) `a b * + d e / -`\n   - (c) `a b c + / d e - f / -`\n   - (d) `a b +\
    \ c / d - e * +`\n4. Convert these infix expressions to prefix and postfix (without\
    \ using [Listing 4.5](#K20431_C004.xhtml_lis4.5), since most have parentheses):\n\
    \   - (a) `x + y + z * w - v / u`\n   - (b) `(x + y + z) * (w - v) / u`\n   -\
    \ (c) `x * y / (z - w + v * u)`\n   - (d) `(x - y) * (z + w) / (u + v)`\n5. Evaluate\
    \ these prefix expressions:\n   - (a) `+ 3 * / 4 2 - 6 1`\n   - (b) `/ - * + 1\
    \ 3 5 6`\n   - (c) `- 4 / + 1 3 2 7`\n   - (d) `* + 5 1 - 4 2 / 9 3`\n6. Show\
    \ how [Listing 4.4](#K20431_C004.xhtml_lis4.4) evaluates these postfix expressions,\
    \ giving the stack contents after each step:\n   - (a) `1 6 4 5 * + 2 / -`\n \
    \  - (b) `6 5 * 3 + 4 2 / -`\n   - (c) `5 4 + 3 / 1 - 6 * 2`\n   - (d) `6 2 1\
    \ + / 9 1 -`\n7. Show how [Listing 4.5](#K20431_C004.xhtml_lis4.5) converts these\
    \ expressions without parentheses to postfix, giving the stack contents after\
    \ each step:\n   - (a) `a + b + c + d`\n   - (b) `a + b * c - d + e`\n   - (c)\
    \ `a * b + c * d - e * f`\n   - (d) `a / b / c + d * e * f`\n"
