    ```\n\n或者\n\n```java\npublic class ClassName<TypeParameter, ...> {...}\n```\n\n\
    类型参数通常是单个大写字母，例如表 4.1 所示所示。\n\n表 4.1\n类型参数\n\n| E | 集合中的元素类型 |\n| :--- | :---\
    \ |\n| K | 键值对中的键 |\n| V | 键值对中的值 |\n| T, U, S | 通用 |\n\n例如，\n\n```java\npublic\
    \ interface Map<K, V> {...}\n```\n\n定义了一个带有两个类型参数 `K` 和 `V` 的泛型 `Map` 接口。\n\n\
    ### 泛型栈 ADT\n\n泛型类型参数允许我们定义表 4.2 中的泛型栈 ADT，它对应于表 3.1 中的整数栈 ADT。大多数数据结构使用 `E` 类型参数作为集合中的元素。\n\
    \n表 4.2\n栈 ADT\n\n| | |\n| :--- | :--- |\n| `boolean isEmpty()` | 如果栈中没有元素则返回\
    \ true。 |\n| `E peek()` | 返回栈顶部的元素但不将其移除。 |\n| `E pop()` | 返回并移除栈顶部的元素。 |\n| `void\
    \ push(E item)` | 将元素添加到栈顶部。 |\n| `int size()` | 栈中元素的数量。 |\n\n### 接口和类定义内部的类型参数\n\
    \n在泛型类或接口定义内部，类型参数和泛型类型本身可以像普通类型一样用于声明。（数组有一个重要的局限性，将在下一节中讨论。）例如，代码列表 4.1 包含了泛型\
    \ `Node` 类的代码。\n\n代码列表 4.1：泛型 Node\n\n```java\n1 public class Node<T> {\n```\n\
    ```java\n2 private T data;\n```\n```java\n3 private Node<T> next;\n```\n```java\n\
    4\n```\n```java\n5 public Node(T data, Node<T> next) {\n```\n```java\n6  this.data\
    \ = data;\n```\n```java\n7  this.next = next;\n```\n```java\n8}\n```\n```java\n\
    9}\n```\n\n`T` 和 `Node<T>` 都被用作类型在泛型 `Node` 类内部声明变量。\n\n### 类型参数\n\n为了使用泛型接口或类，必须指定一个引用类型作为类型参数的类型参数。该类型参数随后被用作类型参数的值。\n\
    \n例如，使用上面的 `Node` 类，我们可以写：\n\n```java\nNode<String> p;\n```\n\n来声明一个存储字符串的 `Node`\
    \ 引用。在这种情况下，`String` 被作为类型参数 `T` 的类型参数。这与为方法参数提供参数完全相似，不同在于这里涉及到类型。\n\n**警告：**\
    \ 类型参数必须是引用类型；不能是基本数据类型。要在泛型类型中存储基本类型数据，必须使用相应的包装类。\n\n### 包装类\n\n每个基本类型都有一个关联类，称为包装类，列在表\
    \ 4.3 中。其思想是将基本类型“封装”在包装类类型的对象中。包装对象还为处理其值提供了许多便利方法；详情请参阅 Java API [[10]](#K20431_bib.xhtml_ref_10)。\n\
    \n表 4.3\n包装类\n\n| 基本类型 | 包装类 |\n| :--- | :--- |\n| byte | Byte |\n| short | Short\
    \ |\n| char | Character |\n| int | Integer |\n| long | Long |\n| float | Float\
    \ |\n| double | Double |\n| boolean | Boolean |\n\n由于基本类型不能作为泛型类型参数，必须使用相应的包装类：\n\
    \n```java\nNode<int> p;  // 错误 -- int 不是引用类型\n```\n```java\nNode<Integer> p; \
    \ // 正确\n```\n\n虽然处理基本类型和包装类有时会很笨拙，但 Java 尝试通过自动装箱和自动拆箱使其尽可能方便。\n\n### 自动装箱和拆箱\n\
    \n如果你在需要相应包装对象的地方使用基本值，Java 将自动将基本类型装箱为对象；同样，在需要时它会自动将封装的对象拆箱为基本类型。\n\n例如，如果 `p`\
    \ 指向 `Node<Integer>` 且 `x` 的类型为 `int`，则 Java 会自动处理 `Integer p.data` 和 `int x`\
    \ 之间的转换：\n\n```java\np.data = x;  // x 被自动装箱\n```\n```java\nx = p.data;  // p.data\
    \ 被自动拆箱\n```\n\n转换也可以显式装箱或拆箱。\n\n### 创建泛型对象\n\n从 Java 7 开始，使用菱形运算符 `<>` 配合 `new`\
    \ 创建所有泛型对象：\n\n```java\nreferenceVariable = new ClassName<>(arguments);\n```\n\
    \n换句话说，创建对象时不指定类型参数，而是在声明类型时指定的。\n\n例如，以下代码创建一个由 `p` 引用的整数节点：\n\n```java\nNode<Integer>\
    \ p = new Node<>(null);\n```\n\n早期版本的 Java 要求在菱形内部也指定类型参数（此处为 `Integer`）。\n\n\
    ### 习题\n\n1. 写一个泛型接口 `Queue<E>`，包含两个方法：`enqueue`接收一个 `E` 类型参数，`dequeue` 无参数并返回一个\
    \ `E` 类型。\n2. 假设 `ArrayQueue<E>` 实现了练习 1 中的 `Queue<E>`。编写 Java 语句声明并创建一个包含字符串的数组队列\
    \ `q`。\n3. 写一个泛型接口 `Map<K, V>`，包含两个方法：`put`接收 `K` 和 `V` 类型参数，`get`接收一个 `K` 类型参数并返回一个\
    \ `V` 类型的项目。\n4. 假设 `LinkedMap<K, V>` 实现了练习 3 中的 `Map<K, V>`。编写 Java 语句声明并创建一个使用字符串键和整数值的链表映射\
    \ `m`。\n5. 为表 4.2 中的泛型栈写一个泛型接口 `Stack<E>`。\n6. 假设 `ArrayStack<E>` 实现了练习 5 中的 `Stack<E>`。\n\
    \    - (a) 编写 Java 语句声明并创建数组栈。使用接口声明类型。\n    - (b) 编写 Java 语句声明并创建整数栈。使用接口声明类型。\n\
    \    - (c) 编写 Java 代码声明并创建整数栈 `s`，并将 0 到 9 的值推入栈。\n7. 假设 `s` 使用练习 5 中的接口声明为 `Stack<Integer>`。判断此代码是否存在自动装箱或自动拆箱：\n\
    ```java\nfor (int i = 0; i < 100; i++) {\n    s.push(i);\n}\n```\n8. 使用代码列表 4.1\
    \ 中的泛型 `Node` 类：\n    - (a) 声明并创建一个包含值 34 的整数节点 `p`。\n    - (b) 声明并创建一个包含字符串“Java”的节点\
    \ `q`。\n    - (c) 构建由 `head` 指向的包含值 3.14、2.72 和 0.58 的双精度链表。\n\n"
- fmt: "\nThus, the `LinkedStack<E>` class should begin as in [Listing 4.2](#K20431_C004.xhtml_lis4.2).\
    \ The type parameter `E` should be used for defining all the methods in the `LinkedStack<E>`\
    \ class—`T` is only used to define the static `Node` class. The exercises ask\
    \ you to complete the `LinkedStack<E>` implementation.\n\nListing 4.2: Generic\
    \ Linked Stack\n\n```\n1 public class LinkedStack<E> implements Stack<E> {\n```\n\
    \n```\n2 private Node<E> top;\n```\n\n```\n3\n```\n\n```\n4 // use E here\n```\n\
    \n```\n5\n```\n\n```\n6 private static class Node<T> {\n```\n\n```\n7   private\
    \ T data;\n```\n\n```\n8   private Node<T> next;\n```\n\n```\n9\n```\n\n```\n\
    10  private Node(T data, Node<T> next) {\n```\n\n```\n11  this.data = data;\n\
    ```\n\n```\n12  this.next = next;\n```\n\n```\n13 }\n```\n\n```\n14}\n```\n\n\
    ```\n15}\n```\n\nThere are a few more difficulties in making a generic `ArrayStack<E>`.\
    \ The main issue is due to a limitation of generic arrays.\n\n### Generic Arrays\n\
    \nThe data array in an `IntArrayStack` has type `int[]` because we store integers\
    \ in the stack. To make a generic array stack, the data array will need to store\
    \ values of type `E`, the generic type parameter.\n\nGeneric types may be used\
    \ to declare array types:\n\n```\nprivate E[] data;\n```\n\nHowever, generic types\
    \ may not be used to create arrays:\n\n![image](image/f0071-01.png)\n\nThe reason\
    \ creating generic arrays is prohibited is that the compiler needs to know the\
    \ array element type `E` in order to generate the correct code, but the value\
    \ of `E` will not be specified until each array stack is created.\n\nThe simplest\
    \ solution is to create an `Object` array and cast it to the generic type:\n\n\
    ```\nE[] arrayRef = (E[]) new Object[LENGTH];\n```\n\nThe cast (see page 3) tells\
    \ the compiler to treat the array as if it were of type `E[]`. Because we plan\
    \ to only push and pop elements of type `E`, this will not be a problem. The nature\
    \ of the `Object` class will be explained later in [Section 5.3](#K20431_C005.xhtml_ch5.3);\
    \ for now, think of it as a type that can be any object at all.\n\nOnce the array\
    \ has been created and cast in this way, it can be treated as if it has type `E[]`.\n\
    \n### Unchecked Casts\n\nUnfortunately, the compiler cannot verify that casting\
    \ an `Object[]` array to a generic `E[]` array is safe, and so it will produce\
    \ an unchecked cast warning. (If the warning does not specify where the unchecked\
    \ cast occurred, recompile with the `-Xlint:unchecked` flag.)\n\nRather than ignoring\
    \ the warning, a better solution is to squelch it by informing the compiler that—in\
    \ this case—we know what we are doing by putting the following annotation above\
    \ the beginning of the method where the cast is used:\n\n```\n@SuppressWarnings(\"\
    unchecked\")\n```\n\nOf course, this annotation should be used sparingly.\n\n\
    ### Obsolete References\n\nFinally, because generic type arguments must be reference\
    \ types, a new issue arises from storing object references in the array instead\
    \ of primitive types. Although it is not serious, the same problem can occur with\
    \ any data structure that stores references in an array. Attending to it now will\
    \ help build your intuition about the differences between primitive and object\
    \ types.\n\nConsider what an array stack with initial capacity of 7 looks like\
    \ if we push the integers 0 through 6:\n\n![image](image/f0072-01.png)\n\nand\
    \ then pop until the stack is empty (when the top is −1):\n\n![image](image/f0072-02.png)\n\
    \nWe did not delete any of the items that were popped because there was no reason\
    \ to: no additional memory is used, and the stack does not allow any access to\
    \ items past the top.\n\nThe situation is different, however, with object references.\
    \ If we push and then pop the same number of objects, then their references will\
    \ still be active even when the stack is back to being empty:\n\n![image](image/f0072-03.png)\n\
    \nThe stack prevents accessing any of those objects, but the objects’ memory cannot\
    \ be garbage collected, because it is still pointed to by active references. As\
    \ noted on page 23 (and Item 6 from Bloch [[4]](#K20431_bib.xhtml_ref_4)), the\
    \ solution is to set those references to null once they are no longer needed.\n\
    \nHowever, do not get carried away setting all of your references to null; this\
    \ is a relatively rare problem. And although setting popped entries to null is\
    \ good practice, do not rely on it to determine which array entries are being\
    \ used for the stack. The `top` instance variable should always be used to decide\
    \ where the top of the stack is.\n\n### Generic Array Stack\n\nPutting these pieces\
    \ together results in [Listing 4.3](#K20431_C004.xhtml_lis4.3), a start to the\
    \ generic `ArrayStack<E>` class. You will be asked to write the rest of the `ArrayStack<E>`\
    \ class in the exercises.\n\nListing 4.3: Generic Array Stack\n\n```\n1 public\
    \ class ArrayStack<E> implements Stack<E> {\n```\n\n```\n2 private E[] data;\n\
    ```\n\n```\n3 private int top = -1;\n```\n\n```\n4 private final int CAPACITY\
    \ = 10;\n```\n\n```\n5\n```\n```\n\n```\n6 @SuppressWarnings(\"unchecked\")\n\
    ```\n\n```\n7 public ArrayStack() {\n```\n\n```\n8 data = (E[]) new Object[CAPACITY];\n\
    ```\n\n```\n9 }\n```\n\n```\n10 public E pop() {\n```\n\n```\n11 E result = data[top];\n\
    ```\n\n```\n12 data[top--] = null;\n```\n\n```\n13 return result;\n```\n\n```\n\
    14 }\n```\n\n```\n15\n```\n\n### Exercises\n\n1. Complete the `LinkedStack<E>`\
    \ implementation from [Listing 4.2](#K20431_C004.xhtml_lis4.2) by writing these\
    \ methods:\n   - `isEmpty()`\n   - `peek()` Throw an exception if the stack is\
    \ empty.\n   - `pop()` Throw an exception if the stack is empty.\n   - `push()`\n\
    \   - `size()`\n\n2. Add a `main()` method to the `LinkedStack<E>` class to test\
    \ the stack with:\n   - Integers\n   - Doubles\n   - Strings\n\n3. Determine the\
    \ O() performance of each of `LinkedStack<E>` methods:\n   - `isEmpty()`\n   -\
    \ `peek()`\n   - `pop()`\n   - `size()`\n\n4. Complete the `ArrayStack<E>` class\
    \ from [Listing 4.3](#K20431_C004.xhtml_lis4.3) by writing these methods:\n  \
    \ - `isEmpty()`\n   - `peek()` Throw an exception if the stack is empty.\n   -\
    \ `push()` Double the length of the array if the array is full.\n   - `size()`\n\
    \   - `private resize()`\n   - A second constructor with starting capacity parameter.\
    \ Modify the existing constructor using `this()`.\n   - `pop()` throw an exception\
    \ if the stack is empty.\n   - `pop()` reduce the length of the array by half\
    \ if the number of elements in the stack is less than or equal to one-fourth the\
    \ length.\n\n5. Add a `main()` method to the `ArrayStack<E>` class to test the\
    \ stack with:\n   - Integers\n   - Doubles\n   - Strings\n\n6. Determine the O()\
    \ performance of each of `ArrayStack<E>` methods:\n   - `isEmpty()`\n   - `peek()`\n\
    \   - `pop()` Ignore resizing.\n   - `size()`\n\n## 4.3 Evaluating Expressions:\
    \ Background\n\nStacks are particularly useful for evaluating numeric expressions.\
    \ In fact, if we break the evaluation process into two stages, a stack is the\
    \ key component in both steps. In order to describe this process, we need some\
    \ terminology first.\n\n### Binary Operations\n\nArithmetical operations like\
    \ addition, subtraction, multiplication, and division are called binary operations\
    \ because they each combine two operands. While we might think the expression\
    \ 1 + 2 + 3 + 4 combines more than two operands, in a programming language such\
    \ as Java, this expression is actually evaluated two terms at a time, grouping\
    \ from the left:\n\n((1 + 2) + 3) + 4\n\nMathematically, the associative properties\
    \ of addition guarantee that all groupings produce the same result; Java chooses\
    \ this grouping for addition because it treats addition as left-to-right associative.\
    \ Other operations, such as assignment, are right-to-left associative, meaning\
    \ that this code:\n\n```\nx = y = z = 10;\n```\n\nis evaluated right-to-left as:\n\
    \n```\nx = (y = (z = 10));\n```\n"
