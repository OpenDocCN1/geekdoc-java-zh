    \ specimens, and\ntissues for molecular genetic analysis, the bulk of\nthese collections\
    \ typically contain 'wet' specimens that\nhave preserved in formalin and post-fixed\
    \ in alcohol for\nlong-term storage. However access to this material is\ncommonly\
    \ impeded by stringent storage requirements, which\ninvolve hazardous, fragile\
    \ storage containers (glass),\n cramped storage facilities. Access is also further\
    \ limited\nby the desire of curators to maintain the long-term integrity\n\n>\
