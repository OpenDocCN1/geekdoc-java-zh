    measuring with Matlab and Psychtoolbox synchronized displays (i.e., native software),
    an average latency of 49.88, SD=26.3, was obtained. The measurement error in Java,
    Flash and JavaScript segments seem acceptable for many applications.


    # ScriptRT


    We developed a software library that supports programming response latencies in
    Flash, called ScriptRT (online at http://reactions.scriptrt.com/). ScriptRT runs
    as a plugin or in a browser. It is programmed in Apache Flash and then compiled
    into Flash pages that can be distributed online and in HTML pages.


    Flash is a combination of XML-based markup language (XML) and a scripting language
    (ActionScript). Flash was started by Adobe, but now the Apache Foundation. ScriptRT
    is also released under the Apache license. ScriptRT is built on open source and
    free software. To develop ScriptRT, researchers need to implement the Flash SDK
    (for OS X and Windows), ScriptRT library [19], a text editor, a Flash-enabled
    browser, and a scripting engine on top of.


    The philosophy of ScriptRT is to allow the programming of a response latency using
    a simple set of markup tags in an XML file, at the same time allowing the programming
    of additional functionality. The ScriptRT markup tags and their functionality
    are defined in the ScriptRT library, which is used to compile the studies into
    Flash.


    The concept of markup is inspired by, but not limited to, free software DMX. Studies
    are programmed as a combination of blocks, which consist of items, for which they
    are made up of frames. A frame represents what is displayed on a single screen
    at one time. An item can consist of one or more frames. For instance, an item
    may contain a blank frame, a frame with an asterisk to signal the next trial,
    a frame with a frame, and a frame with a timer. Frames change order within items.
    Similarly, a block can be made up of one or multiple items. However, the order
    of items within a block can change (randomization). In this case, attributes affect
    what the user perceives.


    Each of these structures is created with XML tags: A frame is created with <Frame>...</Frame>,
    items are created with <Item>...</Item>, and blocks are created with <TestPart>...</TestPart>.
    Blocks that do not collect response latencies (e.g., instructions) are created
    with <Part>...</Part>.


    These XML tags are defined by the ScriptRT library. In combination with ScriptRT-specific
    tags, tag <Text>...</Text> can be used to present text in a frame. As result,
    every ScriptRT code is a mix of tags from the ScriptRT library and standard Flash
    tags. An item from a Test kind could be: <Item id="keyboard.B.press" positive="keyboard.Q.press"
    backgroundColor="#00ff00" color="#000000"> <Item id="id" type="<


    ```

    <Frame response="Time.2000" protocol="false">

    <mx:Text verticalCenter="0" horizontalCenter="0" fontSize="44" text="+\ />

    </Frame>

    <Item id="true" id="test100">

    <mx:Text verticalCenter="0" horizontalCenter="0" fontSize="34" color="#0ffff00"
    text="red"/>

    </Item>

    <TestPart>

    ```


    In this example, the <TestPart> sets the defaults for this block, including the
    randomization of items (questions Q and P), randomization of background and text.
    With this block one two items are created. The type of item is marked with a plus
    sign, which means that the answer will be correct if counted as positive. The
    first trial starts 2000 ms after the asterisk, which is what the user expects
    from the regular Flash library. The second frame shows on screen until an answer
    is given. In this example, all XML tags like <Text> are defined by ScriptRT (That
    is why the example points to a definition of attributes in the opening <Application>
    tag and not here). Here Figure 1 shows an example of a structure of complex element.


    ```

    <Application version="1.0" encoding="utf-8">

    xmlns:mx="http://www.adobe.com/flash/mx">

    <TestPart>

    <Part />

    <Instruction />

    </Part>

    <TestPart>

    <Frame>

    <mx:Text color="#0ffff00" text="red"/>

    </Frame>

    <Item>

    <Frame>

    <mx:Text color="#000000" text="blue"/>

    </Frame>

    </Item>

    </TestPart>

    </Application>

    ```


    Figure 1. Outline of a Stroop implemented in ScriptRT.


    Excerpt from ScriptRT source code implementing a Stroop task. This shows preference
    sets (1–2), and create instruction screen and an instruction screen (3–5) as well
    as one experimental trial with frames (6–12). Tags 1 and 12 are Apache Flash tags.
    The text is defined in the Application tag with the mx: prefix. All other tags
    are part of the ScriptRT library (in the Application part).


    Other blocks of ScriptRT studies are tags for instructions, feedback, and branching.
    A list is provided in Table 1. Each branching, any of these elements can be used
    without coding additional ActionScript. Information on the ScriptRT library is
    available in the manual [19].'
