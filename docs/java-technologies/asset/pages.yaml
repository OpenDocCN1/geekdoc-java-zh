    The caveat at ARLO''s data-driven approach is that it requires a large amount
    of data and image processing. For grain classification between black and white
    spruce pollen (Experiment 2), the system requires 14,784 trained images. Using
    expert-defined features could have been utilized in a system that would achieve
    the same level of accuracy, but would require more input into the labeling of
    training.


    # DISCUSSION


    Our results demonstrate ARLO''s ability to solve a difficult pollen classification
    problem using an adaptive machine learning approach. Decomposing the classification
    problem into a foreground/background classification problem and a separate species
    classification problem provided by ARLO allows for a general representation (a
    pollen grid or pixel line) and parameter adaptation to the given problem complexity
    and the methodology described in our training examples, should be easily generalized.


    The features that our system discovers are not the traditional features of pollen
    morphology that would be recognized by a palynologist. Instead, low-level image-based
    features, such as simple pixel representations, are used. One of such pixel representation
    is color. The system uses a representation of color and decides how much influence
    color has. If the color is not informative, it does not hold significant weight.


    The results of our first experiment indicate that ARLO is capable of training
    on reference specimens, which represent data that can be derived without a high
    degree of expertise. In our experiments, low-level expertise was required to represent
    the relationship between pollen features and an image; with training, undergraduates
    could do this. Human experts were not used to provide “ground truth” for training
    the species classifier. This potentially makes the collection of training datasets
    highly efficient. The first experiment also demonstrated that these unique samples
    from individuals that were not represented in the testing samples, demonstrating
    ARLO''s ability to tolerate morphological variability that may have been unique
    to an individual. Again allows for an automated approach to


