  md: "# 38 Java Technologies\n\nImmunofluorescence microscopy is one of the widely\
    \ used methods to investigate hypotheses and the associated proteins coupled to\
    \ synaptic events. By measuring changes in attributes such as size, and punctency,\
    \ researchers are able to study how subcellular distribution and the localized\
    \ levels of molecules change at synapses. For example, PSD-95 a postsynaptic protein\
    \ frequently used as excitatory synapse marker, Changes in punctency correlate\
    \ with synaptic intensity and synaptic strength [12]. Therefore, analysis is a\
    \ crucial tool for understanding molecular organization of synaptic function.\
    \ Quantitative analysis is very difficult. Measurement of attributes must be performed\
    \ by manually counting and tracing each individual along neural structures, such\
    \ as dendritic and dendritic spines.\n\nImage analysis software, such as MetaMorph\
    \ (Molecular Detection and Measurement), is used for these measurements. These\
    \ programs are powerful tools for image analysis but are also designed to be versatile,\
    \ so for performing specialized tasks such as puncta, can be cumbersome as some\
    \ types of measurements must be reorganized and manually analyzed. For example,\
    \ another problem is that the software automated particle detection algorithm\
    \ often detect adjacent clusters as single objects, forcing user intervention\
    \ or manual detection. Finally, these programs are not optimized for analyzing\
    \ large sets and with different settings (which should be met) and for each image,\
    \ which increases the time spent analyzing.\n\nA number of software for the automated\
    \ analysis of morphometric data of neurons, particularly dendritic spines [15-18].\
    \ However, to the best of our knowledge, only one has been made to improve the\
    \ efficiency of quantifying proteins by a software automated analysis: SynD [19].\
    \ SynD is a MatLab-based program that automatically quantifies and measures properties\
    \ of neurons labeled with a marker (typically GFP) as a function of distance from\
    \ the cell body. SynD fully automated strategy has been reported to increase the\
    \ efficiency of analysis by approximately 90%. However, the SynD on cell-fill\
    \ markers for the automatic selection of \"regions\" prevents the analysis of\
    \ images lacking only dendrites. Also, this prevents the contamination of synaptic\
    \ protein levels in transferred neurons from neighboring non-transferred neurons,\
    \ which serve as the control. Furthermore, SynD excels at quantifying the puncta\
    \ density of proteins within the entire neuron but becomes less efficient at measuring\
    \ and comparing fluorescent intensity when restricted to specific sub-regions\
    \ of the neuron.\n\nIn this report we present new software, SynPal, designed for\
    \ the rapid analysis of neurons acquired from confocal or fluorescent microscopy.\
    \ The primary function of the software is the automatic and rapid quantification\
    \ of puncta attributes, but in addition, the software also allows for additional\
    \ simple morphometric analysis of neurons, such as measurements of dendritic length,\
    \ spine density, spine configuration, and spine density.\n\n# MATERIALS AND METHODS\n\
    \n# Dissociated Neuron Cell and Immunocytochemistry\n\nThe use of vertebrate animals\
    \ in this research has been approved by the IACUC of the Medical College of Wisconsin.\
    \ For euthanasia of rats, gas administration was used, and death was assured by\
    \ a secondary method of thoracotomy. Primary neuronal cultures were prepared as\
    \ described in [20]. Twenty (20) rats were transfected with $\beta$-galactosidase\
    \ (B-Gal) using Lipofectamine 2000, and fixed for immunocytochemistry two days\
    \ post-trans.\n\n# Image Acquisition\n\nImages were acquired using a confocal\
    \ scanning microscope (Nano-D-Eclipse C1). 11 typical sections were scanned with\
    \ a width of 0.33 $\\mu$m. Gains from each channel were adjusted to optimize signal\
    \ to less than 20% of all puncta. Gain settings were kept constant for all images\
    \ acquired under the experimental protocol.\n\n# Image Conversion\n\nImages acquired\
    \ from Nano-D Eclipse C1 produced an IDS file containing data in 48-bit RGB format\
    \ and an ICS description file for image management and stacking. 3D stacks were\
    \ first converted into 2D RGB format with maximal projection using a built-in\
    \ Image\n\n# Software Requirement\n\nSynPal is a cross-platform Java-based application,\
    \ and thus operating system-independent. The software (SynPal-installation) can\
    \ be downloaded from http://dropbox.com/s/zive55fd229/SynPal. To use SynPal, the\
    \ Java runtime environment must be installed from http://www.java.com/en/download/index.jsp.\
    \ The instructions for the installation and running of the software are described\
    \ in the SynPal User Manual. The software is designed to handle up to 3 GB uncompressed\
    \ files of TIFF or GIF formats. Since Java does not have limitations on memory,\
    \ SynPal uses the Java Advanced Imaging API for all the images. The source code\
    \ is released under the General Public Licence, and is available upon\n\n# Proof-of-principle\
    \ Data Analysis\n\nTo compare the manual quantification of puncta, eight images\
    \ of neurons stained for PSD-95 and B-gal were used. For dendritic spines,, images\
    \ from twelve EGFP-transfected hippocampal neurons were used. Guides for"
