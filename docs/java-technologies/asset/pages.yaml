    object (Fig. 2A, b). The dendrite allows the user to specify a short region of
    dendrite to be analyzed. There are two types of dendrite objects: the first automatically
    generated a rectangle surrounding the dendrite (Fig. 2A, b), the second allows
    the user to specify the region surrounding the "freehand" manner


