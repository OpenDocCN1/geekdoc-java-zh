    # DISCUSSION


    # Design and Implementation


    Most RNA-Seq data give over 20 million reads from one experiment. When the reads
    have been mapped using a large set of genomic coordinates is a non-trivial algorithmic
    problem. The algorithms should be fast to find a reasonable amount of time. Then,
    S-MART should be used on a standard computer with limited RAM, extra care has
    to be brought to the minimum amount of memory. To solve these problems, we store
    the data into SQL.table, and we need to retrieve the coordinates efficiently as
    per Kent et al. [11]. A B-tree index is used


    The algorithms have been implemented as a library of Python objects mapping the
    sequences and the genome annotations to be compared—these can be translated, transposable
    elements, transcription factor binding sites etc. The implementation handles the
    set of genomic coordinates


