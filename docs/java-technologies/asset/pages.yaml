    Rather, we find that there are developers in the core of the social network who,
    with few commits, are highly central.


    # DISCUSSION


    Our findings undermine the idealistic belief that open-source development is a
    very collaborative movement. Rather, we find that in the analyzed Software Foundation
    projects were created by a small, but very active, developers, separate separates.


    We concluded that the analyzed Apache Foundation projects experience high levels
    of inequalities in contributors'' activities measured as commits. The contingency
    table shows that a small group of contributors is responsible for the majority
    of commits, which is reinforced by the high levels of the Gini index among the
    analyzed projects of project size and commit participation.


    One advantage of our analysis is the research of group projects. The selected
    263 cases represent a homogeneous group of Apache Software Foundation projects
    developed under the highly respected Apache Foundation brand. Apache Foundation
    projects are considered to be the best organized and the most reliable projects
    among all OSS.


