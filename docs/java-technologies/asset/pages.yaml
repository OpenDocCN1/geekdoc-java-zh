  md: '# Choosing a Software License


    Determining which license will work best for you can require some thought, and
    depends not on specific attributes of your software, but also on your particular
    goals. Both FOSS and proprietary licenses generally require attribution and include
    transparent works such as disclaimers of warranty, they differ in aspects both
    philosophical and practical.


