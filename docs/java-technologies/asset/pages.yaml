    During early implementation of the LRE window selection parameters, it became
    apparent that a method for assessing the overall quantitative precision could
    be developed. The approach taken based on the variance of target quantities generated
    by technical replicates; that is, the CV of the F,L values


    An important objective for setting the lower limit of the LRE window was to include
    inclusion of aberrant cycles. An objective method taking from the cycle generated
    by the LRE, and comparing it with the average $F_G$ value generated by the cycles
    within the LRE. If the difference is below a specified value, defined as the $F_L$,
    threshold (Figure 9), the LRE window includes. This process is repeated until
    a cycle is encountered that exceeds the $F_L$ threshold. The Tabular Summary located
    within the profile editing window provides a numerical perspective on the process
    (Figure 11).'
