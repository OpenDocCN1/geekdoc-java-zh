  md: '# Java Technologies


    ScriptRT is used in its current form to implement many paradigms, and it is under
    further development. Its source code is available, and we invite contributions
    to it. We will continue to develop it, program enhancements online, and empirically
    test them.


    # AUTHOR CONTRIBUTIONS


    Conceived and designed the experiments: TWS CMC DL. Performed the experiments:
    TWS CMC. Analyzed the data: TWS CMC. Contributed reagents/materials/analysis tools:
    TWS. Wrote the paper: TWS CMC DL.


    # CONCLUSION


    ScriptRT is a software library that allows programming response latency using
    Apache Flex and Adobe Flash. ScriptRT offers the building blocks for response
    pattern matching in XML, while additional functionality can be added with a programming
    language. The tested report herein shows that it, in its present form, is a viable
    software for standard response latency patterns. Our evidence suggests that for
    a robust paradigm like Scriptop, ScriptRT is comparable to all other options (i.e.,
    Java, and JavaScript).


    Future research will run really studies with a variety of software in environments,
    for using Flash and JavaScript to get more precise measures, on a desktop computer
    and with replications in lib with precision equipment. Flash and ScriptRT as any
    component in this mix, is fully accessible, and thus allows us to run large studies.


    # REFERENCES


    We contend that response latency studies consider an overwhelming number of problems
    that could trouble current psychology research: First, many have low power. Each
    experiment can be affected by the additional noise through thought power which
    might be different when compared to native PC software. Second, many studies are
    conducted by sampling people from Western, industrialized, rich, and modern societies
    [31]. Using naturally resources restricts the study to people who are comfortable
    with using computers and the Internet, but it may go a long way towards getting
    more cultural variability into cognitive and social sciences. Finally, reality
    increasing latency patterns are especially difficult to replicate because of natural
    limitations [32], [33].


    ScriptRT is being used by various researchers for their needs. It is well enough
    and accessible for the average researcher. Because ScriptRT is an open source
    framework for use with other open source programs, we look forward to grow its
    merit in many directions, with wide applications. The results obtained and reported
    in this article and the expansion possibilities allowed by the software''s open
    source nature make us confident that ScriptRT will gain researchers'' interest
    and we hope that its usage will be widespread.


