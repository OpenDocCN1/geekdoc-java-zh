    coming with a clear idea of what licenses are available, which one you want, and
    who, will be involved by your TTO staff and result in a more favorable outcome
    for you.


    Because of the requirements of your project, these licenses are the easiest to
    adapt and modify, they allow the most freedom and unrestricted incorporation of
    your code into other software—including copyleft or commercial software.


    Once you''ve contacted your TTO, the process generally begins by helping the staff
    understand the "who, what, why, where and how" of your work; how it works, how
    it will be inserted into it, what is its worth, and why the funding came from,
    and other similar. Our TTO will assist you in understanding all possible options—everything
    from placing the project in the public domain to creating a company to commercialize
    it


