    # MOTIVATION, RESEARCH QUESTIONS, AND HYPOTHES


    The goal of this article is to improve our understanding of the OSS participation
    by using user commits from a large group of the Apache Foundation Open Source
    projects.


    # OPEN-SOURCE CONTRIBUTORS


    Open-source contributors can be divided into five groups based on the nature of
    their involvement. Some are responsible for technical aspects and key code matters.
    Maintainers are responsible for keeping the project up to date, coding and commenting.
    Others actively respond to problems, fixing the issues. Bug reporters provide
    issue descriptions. Finally, newcomers play the role of users, supporting others
    with documentation and instructions [23,24]. Researchers have also examined, in
    their papers, the participation of Open-Source developers [25]. Self-reported
    studies have measured developers'' activity, showing differences in time spent
    on commits (e.g., 14.13 hours/week, 11.10 hours/week and 5.6 hours/week [26]).


    Research Question:


    What is the structure of the Apache Software Foundation projects distribution?


    Hypothesis:


    The contributions in the Apache Software Foundation projects measured in commits
    are highly unequal, the vast majority of projects are created by a minor but very
    active part of the open-source community.


