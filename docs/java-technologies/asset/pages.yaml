  md: '# 184 Java Technologies


    be applied to some parts of the code and not others. The GLPL and MPL are considered
    a compromise between the strong copyleft of GPL and permissive licenses like BSD/MIT.


    In general, permissively licensed code is forward compatible with any other license
    type. However, only permissive licenses, like the BSD and MIT, can feed into other
    permissive licenses. Restrictive licenses like the GPL are compatible with permissive
    licenses but must adopt the restrictive license from them. Proprietary licenses
    can incorporate permissively licensed code, but by definition are incompatible
    with any downstream license. Grey areas that are not permitted without explicit
    licensing agreements can become problematic.


    # Compatibility, Proliferation, Fragmentation, and Directionality


    A fundamental goal of FOSS is to promote the free exchange of ideas and technology
    without infringing the rights of others. Ideally, licensed code under like-minded
    FOSS terms should freely create products. Compatibility is the attribute of software
    licenses that allows terms of freedom or mutually exclusive requirements. Some
    FOSS licenses contain terms that are "incompatible" with other FOSS licenses limiting
    ability to combine code.


    Directionality is an important reason why, if you are trying to integrate code
    written by others with yours, you want to be aware of what code you are incorporating.
    When attempting to combine code from multiple projects under different license
    types, issues of compatibility can become very complex.


    # ## Form "Bespoke" Licenses


    FOSS license are generally licensed, meaning that their terms are standardized
    and a developer need only apply them (Figure 1). This standardization is critical
    to ensure that FOSS strategies maximize compatibility and minimize the cost of
    administration and development. Conversely, bespoke licenses are custom-tailed
    for each individual project. Tailored licenses allow greater control but require
    more resources to develop and administer and are likely to be incompatible with
    other licensing schemes. Nearly all permissive licenses are bespoke.


    In general the more restrictive the license, the less compatible it is with others.
    Permissive software, by design, cannot be incorporated into others without a separate
    licensing agreement.


    License compatibility is further complicated, however, in its directionality.
    Bidirectionality refers to the difference between integrating into (upstream,
    or backward) or out of (downstream, or forward)compatible. For example, a permissive
    license like the BSD is forward-compatible with any other kind of license, but
    backward-compatible with only permissive licenses. Likewise, a copyleft license
    like the GPL is incompatible (upstream) both permissive and GPL-xl code, but the
    resulting software may only be licensed (downstream) under the GPL.


    # Hybrid and Multi-Licensed Software


    These licenses differ from single licensing in allowing others rights to choose
    which code best serve their needs on a case-by-case basis. One form of multi-permissive
    licenses allows users to select multiple licenses by the right owners. Another
    is when owners enter into "side agreements" that do not enforce copyleft provisions,
    so that each of the licenses remains within the open source community through
    the partial duplication of share-alike licenses.


    MySQL and Oracle Berkeley DB (1) (JDB) are two known examples of multi-licensed
    software and are both free for use, distribution, and modification under open
    source licenses. However, each of these is offered for a fee under additional
    licenses more amenable to proprietary business strategies.


    # FOSS LICENSES AND COMMERCIALIZATION


    It is a common misconception that FOSS licensing prevents precommercialization.
    In fact, OSI-approved [3] FOSS licenses cannot discriminate commercial use. This
    is one reason why independent IITOs have sometimes preferred a "bespoke-non-free-use."
    Though FOSS licenses preclude charging for the license itself, developers are
    free to charge a fee for additional services such as support, priority feature,
    development, consultation, etc. Hybrid licensing schemes (see above) offer further
    avenues for FOSS commercialization.'
