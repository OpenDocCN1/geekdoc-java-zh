    by our decision to vary each variable during optimization. This was a pragmatic
    decision given the computational constraints of the analysis. Despite what this
    affects our results, however, if we agree with values within the middle of the
    range of possible specimens, we do not anticipate that further optimization would
    perform significantly. Additionally, the algorithm performance on the datasets
    are decent, yet it is not possible to use gradient based parameters. Given these
    constraints, our use of a coordinate descent approach falls within the norms of
    standard practice


