    graph $G=(V, A)$, where the set of vertices $V$ is the set of all$Components$,
    and the set of arcs $A$ is a set of all Relations. The weights are not assigned
    to any arc but weights can be used to reflect the reliability of the extracted
    triplet. Note that the graph is not necessarily connected and it may not contain
    isolated vertices.


    Since the extracted structure can contain a large number of vertices and many
    unconnected components it is possible to use scalable network methods, e.g., Barnes
    H-but simulation [70]. We employed a freely available platform network visualization
    component provided by the Sigma library [23], and allows for the visualisation
    and interactive exploration of large graphs. For example, a triplet network consisting
