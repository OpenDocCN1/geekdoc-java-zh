  md: '# CHAPTER 10 ARCHILD: HIERARCHICAL VISUALIZATION OF LINKAGE DISEQUILIBRI IN
    HUMAN POPULATIONS


    Rossella Melchiotti,¹² Olaf Rötzschke,¹ and Michael Poidinger¹


    ¹Singapore Immunology Network (SiGN), Agency for Science, Technology and Research
    (ASTAR), Singapore, Singapore


    ²Doctoral School in Translational and Molecular Medicine (DIMET), University of
    Milano-Bocca, Milan, Italy


    # ABSTRACT


    Linkage equilibrium (LD) is an essential metric for selecting single-nucleotide
    polymorphisms (SNPs) in genetic studies and identifying causal variants from significant
    tag SNPs. The explosion in the number of polymorphisms that can now be genotyped
    by commercial arrays makes the interpretation of triangular correlation plots,
    commonly used for visualizing LD, extremely difficult in particular when large
    genomics needs to be considered or when SNPs in perfect LD are not just scattered
    across a genomic region. We developed ArchILD, a user-friendly graphical application
    for the hierarchical visualization of LD in human populations. The software provides
    a powerful framework for linking patterns with a particular focus on blocks of
    SNPs in perfect linkage as defined by r2. Thanks to its integration with the UCSC
    Genome Browser, LD plots can be easily overlaid with additional data on regulation,
    conservation and expression. ArchILD is an intuitive solution for the visualization
    of LD across large or highly polymorphic genomic regions. Its use and integration
    with the UCSC facilitates the interpretation of association results and enables
    a more informed selection of SNPs for genetic studies.


    # INTRODUCTION


    The development and fusion of high-throughput technologies for the analysis of
    genetic variants, such as single-nucleotide polymorphism (SNPs) microarrays and
    next-generation sequencing, has led to a substantial increase in the number of
    variants that can be studied in population-based studies [1]. Commercially available
    microarray platforms can now measure up to 5 million SNPs on a single chip.


    > A large number of variants are not independent but correlated through linkage
    equilibrium (LD), the non-random associations of alleles at two loci. Known LD
    plays an important role in the selection of SNPs to be tested for association
    with a particular phenotype. This metric in fact be used to alleviate the burden
    of multiple testing by pruning out redundant information. It is also useful for
    identifying possible causal variants from relevant polymorphisms.


    The completion of the HapMap Project [2] and the 1000 Genomes Project [6] has
    provided a high-density map of genetic variation across the major human populations
    making it possible to evaluate patterns of LD on a genome-wide scale.


    Citation: Melchiotti R, Rötzschke O, Poidinger M. ArchILD: Hierarchical Visualization
    of Linkage Disequilibrium in Human Populations. true S-J, PLoS ONE. 2014;9(e98671.
    doi:10.1371/journal.pone.098671.'
