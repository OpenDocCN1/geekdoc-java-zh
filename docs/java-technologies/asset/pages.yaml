    # Quality Coding Standards


    The main objective of the coding standards is maintainability. Other important
    things that relate to the strength of the quality standards include simplicity,
    consistency, portability, extensibility, clarity, and correctness [51][52]. Structure
    [41] shows that production of code quality should be elevated to a central role
    in software development. In doubt, the programmer should favor clarity for clarity
    over efficiency [37]. The style of writing directly impacts the readability and
    understandability of the output [38]. By enforcing these standards we can save
    cost of code review and minimize the human density and obviously minimize the
    possibility of bad coding practices and greatly improve the readability of our
    source code. Documentation, indentations, naming conventions, and parentheses
    are many considered as quality coding standards attributes [37][38][39][40]. Certainly,
    it is imperative to introduce the novice programmers about the coding standards
    from the beginning [5].


    There exist coding standards like QPC TM, MISRA-C++ [46] which provide a guideline
    for writing quality code. In work, we evaluate the quality code from the standards
    of the project we consider the following parameters: (i) support for comments;
    (ii) avoidance of dangling else; (iii) use of proper naming convention; (iv) use
    of parentheses in expressions.

    All programmers are encouraged to comment the tricky logic implemented in a particular
    part of the code. Comments are also used to provide different types of comments
    supported by programming languages. Generally, different types of comments are
    useful, but the coding standards discourage comments as they are prone to errors.
    One serious problem in block comment is that the novice programmer may accidentally
    end the block comment which may swallow the code. It will be swallowed as shown
