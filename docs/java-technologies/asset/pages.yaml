    # The three LRE datasets.


    Another concept to LRE quantification is referred to as a "reaction setup", which
    encompasses all the factors impacting the optics of an assay. These include the
    reaction vessel and the enzyme formulation, optical characteristics of the instrument,
    which as whole determine the fluorescence intensity of an assay. A key aspect
    of absolute quantification is calibration in the fluorescence intensity of an
    assay which is quantified by amplification of a known quantity of lambda DNA,
    greatly called an absolute calibration factor (ACF) that is unique to a reaction
    setup [5], [7].


    # User Interface


    The user interface is organized into three panels, each containing windows that
    provide functions for viewing and/or editing of each of the three LRE database
    types (Figure 2). The explorer panel windows allow creation, opening and closing
    of databases. Once a file is opened, data is presented as a tree, or profiles
    within a run, with displaying information about the data element its label (Figure
    3). When a data element is selected, the corresponding editor window displays
    the data element, which can be edited (Figure 4). The sorting panel makes it possible
    for profiles to be organized across multiple runs to be viewed/edited or exported
    as a group (Figure 5).


    Note that the LRE help set provides descriptions of how LRE quantification is
    conducted, with guidelines on how to implement LRE-based assays. Demonstration
    database files are also provided to assist in illustrating how the LRE analyzer
    functions, with insights into the capabilities of LRE quantification.


    ![](img/a8d82052b482a3d31e63eb8a0b9a0c4c_32_0.png)


    Figure 2 The user interface is organized into three panels.'
