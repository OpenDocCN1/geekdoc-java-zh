    Data Tier. In the context of a running IQM instance all persistent and transient
    data, e.g., a single image, a collection of signals, or other labels, are managed
    by software components attributed to the data tier. Data items are the most basic
    unit where operations can be executed. They may be stored in a temporary directory
    in order to save memory for the processing routine. Thus, data tiers play an important
    role in file access providing functionality for decoding and encoding contents.
    Data is loaded and parsed into a flexible data model, which manages the original
    data item as well as its low-level properties such as names and paths.


