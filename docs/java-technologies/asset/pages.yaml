  md: '# A JAVA PROGRAM FOR LRE-BASED REAL-TIME QPCR THAT ENABLES LARGE-SCALE ABSOLUTE
    QUANTIFICATION


    Robert G. Routledge


    Natural Resources Canada, Canadian Forest Service, Quebec, Canada


    # ABSTRACT


    # Background


    Linear regression of efficiency (LRE) introduced a new paradigm for real-time
    qPCR that enables large-scale absolute quantification by eliminating the need
    for standard curves. Developed through the application of sigmoid mathematics
    to SYBR Green I-based assays, target quantity is derived from fluorescence readings
    within the central region of an amplification profile. However, a major challenge
    of implementing LRE quantification is the intensive nature of the analysis.


    # Findings


    Utilizing the extensive resources that are available for developing Java-based
    software, the LRE Analyzer was written using the NetBeans IDE, and is built on
    top of the modular architecture and windowing system provided by the NetBeans
    Platform. This fully featured application determines the number of target molecules
    in a sample with or no intervention by the user, in addition to providing extensive
    database capabilities. MS Excel is used to import data, allowing LRE quantification
    to be conducted with any real-time PCR instrument that provides access to the
    raw fluorescence readings. An extensive help also provides an in-depth introduction
    to LRE, in addition to guidelines on how to implement LRE quantification.


    # Conclusions


    The LRE Analyzer provides the automated analysis and data storage capabilities
    required by large-scale qPCR projects wanting to exploit the many advantages of
    absolute quantification. Foremost is the universal perspective afforded by absolute
    quantification, among other attributes, provides the ability to directly compare
    quantitative data produced by different assays and/or instruments. Furthermore,
    absolute quantification has important implications for gene expression profiling
    in that it provides the foundation for comparing transcript quantities by any
    gene with within, and between samples.


    > Citation: Rutledge RG (2011) A Java Program for LRE-Based Real-time qPCR enables
    Large-Scale Absolute Quantification. PLoS ONE 6(3): e17636. doi:10.1371/journal.pone.017636'
