    A study by Reynolds and Stewart measured the validity of Flash to measure reaction
    times accurately in online experiments [23]. They found that measurements based
    on Flash under conditions were 10-40 ms slower than those by a native application[24].
    The difference was 30 ms greater when tests were conducted outside the laboratory.
    The following year, they assessed the mobile version of Flash (Adobe Flash) and
    found that estimates of reaction times were substantially lower in the mobile
    version (60-80 ms) compared to the desktop analogue. They observed that the distribution
    of these measurements varied in different devices [25]. Schubert et al. also found
    a 10-35 ms lag in response times when using their Flash-based experiments over
    online platforms such as E-Prime and DMX2 [26]. Finally, Reynolds and Stewart
    conducted a measurement accuracy in Flash and HTML/JavaScript experiments. They
    found that Flash and JavaScript''s precision and response time measurement were
    similar within the system, but varied greatly across different hardware systems
    [27].


