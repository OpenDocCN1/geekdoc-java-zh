    # Proprietary Licensing


    This strategy is familiar from the "click-through" agreements that govern commercial
    software packages. The primary purpose of proprietary software is to limit the
    use of software to the rights owners'' business strategy. As a result, proprietary
    licenses are often verry restrictive. They typically allow the use of the software
    only for its stated purpose, only on a single computer, forbids users from copying,
    redistributing, or allowing others to work with, and prevents the creation of
    derivatives using parts of the work. Proprietary licenses are typically distributed
    only in binary and forbid examination of the program code or reverse engineering
    any part of the program. In academic settings, proprietary software may occasionally
    release source code for "information purposes only" to scientific publishing and
    peer-review requirements (Table 1).


    # Types of Software Licenses


    Colloquially speaking, the spectrum of software strategies can be divided into
    three categories: "proprietary," "free and open source," or a hybrid of the two.


