  md: '# SYNPANAL: SOFTWARE FOR RAPID QUANTIFICATION OF THE DENSITY AND INTENSITY
    OF PROTEIN PUNCTA FROM FLUORESCENCE MICROSCOPY IMAGAGES OF NEURONS


    Eric Danielson¹, and Sang H. Lee¹²


    Department of Pharmacology and Toxicology, Medical College of Wisconsin, Milwaukee,
    Wisconsin, United States of America

    ²Neuroscience Research Center, Medical College of Wisconsin, Milwaukee, Wisconsin,
    United States of America Virginia Tech Carillion Research Institute, United States
    of America


    ABSTRACT

    Continuous modification of the protein composition at synapses is a driving force
    for the plastic changes of synaptic strength, and provides the fundamental molecular
    mechanism of synaptic plasticity and information storage in the brain. Studying
    protein turnover is not only for understanding learning and memory, but also has
    direct implication for pathological conditions like aging, neurodegenerative diseases,
    and psychiatric disorders. Proteins involved in synaptic transmission and synaptic
    plasticity are typically concentrated at synapses of neurons and appear as puncta
    (clusters) in fluorescence microscopy images. Quantitative measurement of the
    changes in protein density, intensity, and sizes of synapses provides valuable
    information on their function in synaptic transmission and development. Unfortunately,
    puncta quantification is very labor intensive and time consuming. In this article,
    we describe a software tool designed for the rapid semi-automatic detection and
    quantification of synaptic puncta from 2D immunofluorescence images generated
    by confocal scanning microscopy. The software, dubbed SynPanel (for Synaptic Punct
    Analysis), streamlines data quantification for puncta density and intensity, thereby
    increases data analysis throughput compared to current methods. SynPanel is stand-alone
    software written with the JAVA programming language, and is portable and platform-free.


    INTRODUCTION

    The human brain is made up of billions of interconnected neurons that can form
    thousands of connections(synapses) with other neurons. [1–3]. Abilities such as
    cognition, emotions, learning and memory are possible due to the complex interconnectivity
    between neurons [2], [4], [5].


    Current models show that information storage at synapses through structural and
    molecular rearrangements of synapses with multiples of proteins being added to/or
    removed from them [6–8]. Therefore, studying the dynamic turnover of proteins
    at synapses is one of the hottest topics in the field of molecular biology and
    neuroscience, which is directly relevant to understanding learning and memory,
    and therefore important for synaptic/circuit development, mental retardation with
    aging and neurodegenerative diseases, and pathological bases of psychiatric diseases
    [9]–[12].


    Citation: Daniel E, Lee SH SynPanel: Software for Rapid Quantification of the
    Density and Intensity of Protein Puncta from Fluorescence Microscopy Images of
    Neurons. PLoS ONE 9:e115298; doi:10.1371/journal.pone.0115298'
