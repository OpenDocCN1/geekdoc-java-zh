  md: '# IQM: AN EXTENSIBLE AND PORTABLE OPEN SOURCE APPLICATION FOR IMAGE AND SIGNAL
    ANALYSIS IN JAVA


    Philipp Kainz, Michael Mayrrhofer-Reinhartshuber, Helmut Amhammer


    Institute of Biophysics, for Physiological Medicine, Medical University of Graz,
    Graz, Australia


    # ABSTRACT


    Image and signal analysis applications are substantial in scientific research.
    Open source and commercial packages provide a wide range of functions for image
    and signal analysis, which are sometimes supported well by the communities in
    the corresponding fields. Commercial software packages have the major drawback
    of being expensive and having undisclosed source code, which hampers extending
    the functionality if there is no plugin interface or similar option available.
    However, both variants cover possible use cases and custom developments are unavoidable,
    requiring open source applications. In this paper we describe IQM, a completely
    free, portable and open source (GPU+PL3) image and signal analysis toolkit written
    in pure Java. IQM does not depend on any natively installed libraries and is rather
    now enough. Currently, a continuously growing number of 50 image and 16 signal
    analysis algorithms are available. The modular architecture is designed for the
    development of most complex works more flexibly than competing. Using a Gro script
    demonstrate IQM''s image and signal processing capabilities in the proof-of-principle
    approach and provide examples to illustrate the framework and scripting interface.
    IQM integrates with the popular ImageJ processing software and is aiming at complementing
    functionality rather than competing with existing open source. Machine learning
    can be integrated into more complex algorithms via the WEKA software package,
    as well, enabling the development of transparent and robust methods for image
    and signal analysis.


    # INTRODUCTION


    Researchers are often confronted with situations, where readily available software
    packages may not meet current requirements in an out-of-the-box configuration,
    are not available or license fees are too expensive. Furthermore,


    source code is often undisclosed and there is no opportunity to change or adapt
    others of applications. This is a commonly known issue and researchers have to
    write their own code for each specific problem [1].


    Due to drawbacks of commercial software, the number of open source users has increased
    during the last decade. More permissive licenses and the advantage of cross platform
    compatibility contribute to the increase in popularity of open source users, who
    can now choose from a broader variety of software to fit particular use cases
    and enhance the outcome of their research [2].


    > Citation: Kainz P., Mayrrhofer-Reinhartshuber, M Amhammer H (2015) IQM: Extensible
    and Portable Open Source Application for Image and Signal Analysis in Java. PLoS
    ONE 10(6):e116329. doi:10.1371/journal.pone.016329'
