  md: '# AN EVALUATION FRAMEWORK AND COMPARATIVE ANALYSIS OF THE WIDELY USED FIRST
    PROGRAMMING LANGUAGES


    Muhammad Shoaib Farooq,1,2 Sher Afzal Khan,1 Farooq Ahmad,2 Saeed Islam,3 and
    Adnan Abidid2


    +   1Department of Computer Science, Abdul Wali Khan University, Mardan, Pakistan

    2Faculty of Information Technology, University of Central Punjab, Lahore, Pakistan

    3Department of Mathematics, Abdul Wali Khan University, Mardan, Pakistan


    # ABSTRACT


    Computer programming is the core of computer science curriculum. Several programming
    languages have been used to teach the first course in computer programming, and
    such languages are referred as first programming language (FPL). The pool of programming
    languages has been evolving with the development of new languages, and from this
    pool different languages have been used as FPL at different times. Though the
    selection of an appropriate FPL is very important, there is a controversial issue
    in the presence of many choices. Many efforts have been made for designing a good
    FPL, however, there is no way to evaluate and compare the existing languages so
    to find the most suitable. In this article we have proposed a framework to evaluate
    the imperative, and object oriented languages for their suitability as appropriate
    FPL. Furthermore, based on the proposed framework we have devised a customizable
    scoring function to compute a quantitative suitability score for a language, which
    reflects its conformance to the proposed framework. Last, we have also evaluated
    the performance of the widely used FPLs to the proposed framework, and have computed
    their suitability scores.


    # INTRODUCTION


    Computer programming holds a central importance in the computing curricula. The
    selection of a programming language for an introductory course of computer programming
    has always been pivotal as well as contentious [1], such a language is generally
    referred as First Programming Language (FPL). Purpose of the first course in computer
    programming is provide conceptual knowledge to beginners for "understanding


    the fundamental programming constructs" in such a way that they should be able
    to solve a problem [2][3]. The literature survey [78],[79],[80],[81] that many
    different programming languages have been used as FPL During the 1990s, Professor
    Richard Rea of University of Michigan State has been making a list of the languages
    used as FPL by different universities and institutes [4]. Later on, this has been
    updated until 2006 by Frances Seoy [79], and another version of this list has
    been compiled [78]. A summary of number of languages used as FPL at different
    times is presented in Table 1, which has been compiled by getting data from [41],[78],[79],[80].
    It clearly reflects that Pascal remained dominant FPL for a whole decade (1990s)
    [78], while Ada and Modula-2 remained constant during this time. C++ gained popularity
    in late 90s, whereas Java and Python started to


    > Citation: Faraooq MS, Khan SA, Ahmad F, Islam S, Adnan A. An Evaluation Framework
    and Comparative Analysis of the Widely Used First Programming Languages. Suleman
    H, et al. PLoS ONE 2014(9):e08841. 10.1371/journal.pone.008841.'
