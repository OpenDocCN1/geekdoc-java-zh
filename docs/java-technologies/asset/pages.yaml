    # INTRODUCTION


    Producing a graphical visualisation of a phylogenetic tree is a common need of
    researchers involved in studies of computational biology and molecular evolution.
    Phylogenies can be inferred from many types of data, e.g. protein/DNA alignments,
    results of clustering and Inference hierarchies, using specialists packages such
    as Philip [1], Paup [2 and others]. The phylogenies produced by these software
    packages are normally saved in a computer-readable format for analysis and visualization.
    One of the simplest and most common data formats for representation of a tree
    is the Newick [3] standard. This format is an effective way of storing information
    on branch lengths, node names and topology in compressed and easy to parse. When
    a tree is produced, it may be required in various ways, depending on the requirements
    of the user. Some users simply require a graphic for a publication or a slide,
    and for others there is often a demand to investigate one large tree in


    great detail or alternatively to look briefly at many trees.


    We introduce TreeVector, a Java based phylogenetic tool which aims to address
    the diversity and changing needs of the user and take advantage of the standards
    and technologies which are appropriate to this type of graphical visualisation.


    # RESULTS


    TreeVector uses Scalable Vector Graphics (SVG) as its primary output. SVG is an
    XML format for showing two-dimensional vector graphics, and is supported by the
    majority of modern web browsers. This format is well suited to online visualisation,
    as it can be implemented and explored in a web browser, small files (for a tree
    of 677 nodes, size is 32KB compared to 1.6 megabytes for a page), and can be animated
    and linked using web scripts such as JavaScript and CSS (See Figure 1


