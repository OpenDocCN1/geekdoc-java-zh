    8. Put_Line("Pass!");

    9. else

    10. Put_Line("Fail!");

    11. end;

    12. end Compound;

    ```


    Figure 24 If statement in Ada.


    Another consideration for the evaluation of readability is that the forms and
    meaning of construct should not be apparent or content dependent [21]. In our
    FPLs most of the languages adapt to this, however, and do not conform to this
