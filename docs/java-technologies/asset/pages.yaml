    ⁴Department of Plant Biology, School of Integrative Biology, University of Illinois,
    Urbana, United States of America


    # ABSTRACT


    Discriminating between black and white spruce (Picea mariana and Picea glauca)
    is a difficult pathological problem that, if solved, would provide valuable data
    for paleoclimate reconstructions. We developed an open-source visual recognition
    software (ARLO, Automated Recognition with Layered Optimization) of differentiating
    these two species at accuracy with human experts. The system applies simple pattern
    recognition and machine learning to classify and discover pollen features, defined
    by features of lines and pixels of pollen at different dimensions, coloring, and
    resolution. It allows to a given problem by solving for the most effective combination
    of feature representation and learning strategy. This result is in a powerful
    and flexible framework for image classification. We worked with images acquired
    using an automated scanner. We first applied a hash-based "pollen spotting" to
    segment pollen grains from the slide background. We next ARLO''s ability to reconstruct
    black and white spruce pollen using artificially constructed slides of known ratios.
    We then developed a more scalable hash-based method of image analysis that also
    distinguish between pollen of spruce with an estimated accuracy of 83.6%, comparable
    to human expert performance. Our results demonstrate the capability of machine
    learning systems to automate taxonomic classifications in pollen analysis, and
    with simple image representations suggest that our approach is generalizable to
    many other recognition problems


    # INTRODUCTION


    The morphological discrimination of closely related, often congeneric, species
    is a fundamental problem in pollen analysis, contributing to the low taxonomic
    resolution of pollen and spore record [1–4]. A critical example is the discrimination


    of black and white spruce (Picea mariana and Picea glauca), which has challenged
    researchers since the beginnings of North American geology [3, 5–8]. Although
    the methods of pollen grains are general, the two species occupy ecological niches.
    White spruce extends to well-drained upland soils, while black spruce populates
    poorly drained woodlands and peats [9]. Consequently, changes in the landscape
    reflects climatic conditions, making the two species of pollen important in the
    reconstruction of North American Late Quaternary paleoclimates [10, 11].


    Citation: Tcheng DK, Nayak AK, Fowlkes CC, Punyasasana SW (2016) Visual Recognition
    for Binary Classification and Its Application to Spruce Pollen Identification.
    PLOS ONE 11(2): e014879. doi:10.1371/journal.pone.0014879'
