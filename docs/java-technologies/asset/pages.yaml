    # Animations in the HTML5 era


    HTML5 provides a wide variety of mechanisms to create animations. Developers can
    use application programming interfaces (APIs) to create declarative animations
    such as Cascading Sheets (CSS) or Scalable Vector Graphics (SVG), Multimedia Integration
    Language (SCIL), or procedural animations with SVG, JavaScript, or WebGL. The
    well-known inaccuracy of JavaScript timers can be avoided via the User Timing
    API for script applications (requestAnimationFrame). Using the timing control
    for script-based APIs, developers request updates to the browser, or try to figure
    out when is the best moment to do them. Considering all of the running animations
    using this API, it is in a better position to run the animations as smoothly as
    possible. In the following paragraphs, we give an overview of these web technologies.


    # Silverlight


    Silverlight is Microsoft'' answer to the struggle of Flash. Therefore, Silverlight
    is also a technology for developing RIAs that run in a virtual machine on run.
    The Silverlight virtual machine is available for the majority of web-users on
    Windows and Mac OS. Microsoft provides unofficial UI support for GNU, Linux, FreeBSD
    and other operating systems. The advantage of Silverlight over the aforementioned
    technologies is its integration with other technologies based on Microsoft. However,
    the lack of multipatform support (officially only Windows Windows) and the popularity
    of a competing technology such as Adobe Flash, has relegated us to scenarios where
    Microsoft Silverlight technologies are used exclusively.


    # CSS Animations


    This API allows the animation of HTML elements using CSS. Developers develop and
    create CSS animation set of keyframes with transitions between them. The CSS Transitions
    API provide a way to define a transition function (e.g., linear, ease-in, cubic-bezier)
    to perform a transition of a CSS-styled HTML element. These two-dimensional (e.g.,
    scale, rotate) or three-dimensional (e.g) rotate) transforms are defined by the
    CSS Transitions API. and serve to provide semantic information about the animation
    to the web-user (so they can then decide which animation). In addition, CSS Animation
    JavaScript event is a good practice to increase the responsiveness of the web.
    The main disadvantage is its lack of defining animations. CSS Animations are limited
    to combination of CSS and Transforms.


    # Native code


    When the main goal is to maximize the accuracy and precision of animations, it
    might be to rely on native code for those-users that allow possibility. However,
    Mobile Native [13] and Geko NAPI [14] however, giving native privileges to native
    user agents might not be a good security policy. Currently, they are used to wrap
    applications within environments where security problems are avoided and isolated.
    However, both technologies are limited to specific user-agents (Microsoft Internet
    Explorer in the age of Chrome, and Geko-based browsers, which Mozilla Firefox
    is the most prominent example, in case of NAPI). Therefore, they are far from
    being multipatform solutions. The third option for native, Google Native Client
    [15], aims to solve both problems, providing an execution environment automatically
    protected and supported by multiple platforms, but this is in the early stages.


    # SVG with SMI


    SVG is a XML dialect for creating vector images. Among its many features, the
    it includes the ability to use JavaScript or use SMI to create declarative animations.
    The disadvantages of using SVG are similar to the advantages of using CSS animations:
    it provides semantic information about the animation, avoids JavaScript timers,
    and creates animations that can be used outside the browser. In addition, support
    for SVG in browsers is improving. The recent interest in SVG do HTML5, browser
    vendors have devoted more effort to comply with the CSS Animations standard than
    their support of SVG with SMI.'
