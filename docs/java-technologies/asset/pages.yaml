  md: '# CHAPTER

    17 A QUICK GUIDE TO SOFTWARE LICENSING FOR THE SCIENTIST-PROGRAMMER


    Andrew Morin,¹ Jennifer Urban,² and Piotr Sliz¹


    ¹Department of Biological Chemistry and Molecular Pharmacology, Harvard Medical
    School, Boston, Massachusetts, United States of America

    ²Samelson Law, Technology & Public Policy Clinic, School of Law, University of
    California Berkeley, California, United States of America


    Computing is ubiquitous in every domain of scientific research. Software is the
    means by which scientists harness the power of computers, and many scientific
    computing relies on software conceived and developed by other researchers. The
    task of creating scientific software, however, does not end with the publication
    of computed results. Making the developed software available for inspection and
    by others is essential for reproducibility and the ability to build upon previous
    work [1, 2]. In fulfilling expectations, scientist-programmers are required to
    be not only scientists and coders, but also knowledgeable in legal strategies
    for licensing software. The complex landscape of software licensing can be overwhelming
    even for sophisticated programmers.


    developers and users in hundreds of biomedical research laboratories worldwide.
    As facilitator and middleman between developers and endusers, we commonly assist
    in the dissemination and use of scientifically generated software. Through research
    and advocacy, the Samelson Law, Technology and Public Policy Clinic works with
    software developers and other creators on licensing issues, particularly at creating
    "open access" to scientific literature. We provide guidance on software licensing
    with a focus on the particular needs of the scientist developer. The aim of this
    guide is to help scientists ensure their owing when choosing software licenses.


    As practitioners in the scientific community and technology law field have witnessed
    firsthand the confusion and difficulties with licensing scientifically generated
    software. SBGrid.org is a consortium of scientific software


    # WHY SOFTWARE LICENSES ARE IMPORTANT


    Licenses are important for setting specific terms for software which may be modified,
    reused, or distributed. Based on the copyright protection automatically granted
    to original works, a software license—essentially a form of permissions from the
    copyright holder—may include specific "conditions" of, and are important part
    of the legal binding contract between program author (or rights owners) and enduser.


    Citation: Morin A, Urban J, Sliz P (2012) A Quick Guide to Software Licensing
    for the Scientist-Programmer. PLoS Comput Biol 8(7):e102598. doi:10.1371/journal.pcbi.102598'
