    16.67ms it produced a mean number of missed frames below 0, which was significantly
    better than using the loop technique, which is implemented in ActionScript (setInterval,
    polling, and timer) and yielded worse results in all of our tests.


    Regarding Java, the performance observed in Chrome 17 and Internet Explorer 9
    (around 1 missed) showed much better results on Mozilla Firefox (10ms, over 0.4
    missed frames in all conditions). This result is because since Java is built on
    a virtual machine with reduced interaction with the HTML document which we embedded.


    Finally, despite its reduced popularity among users and the low number of web
    applications for Silverlight, its performance was quite similar to that of Flash.
