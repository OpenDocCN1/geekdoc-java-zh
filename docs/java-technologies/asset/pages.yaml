    As the cost of maintaining collections becomes increasingly expensive, the community
    is faced with the problem of how to preserve with limited resources. One approach
    to this problem is to leverage recent advances in imaging, software, and hardware
    technologies to develop digital libraries [4]. In particular, a digital library
    would provide a complete set of tools to collect, visualize, analyze, and disseminate
    high resolution data over time. Developing a comprehensive program that integrates
    all of these aspects is a significant technical and organizational task. We present
    our current progress on the development of the Fish Library project (DFL), which
    aims to develop such a program with a particular focus on aquatic imaging using
    the Marine Vessel of Oceanography (MVC) of the Scripps Institute of Oceanography
    (SIO). However, we have focused on a particular imaging modality and a selection
    of specimens, the methods and infrastructure used, which were demonstrated by
    results of research projects that have been developed, and by the techniques used
