  md: '# CHAPTER 19 TREEVECTOR: SCALABLE, INTERACTIVE, PHYLOGENETIC TREES FOR THE
    WEB


    Ralph Pethica¹, Gary Barker², Tim Kovacs¹, Julian Gough¹


    +   1 Computer Science Department, University of Bristol, Bristol, United Kingdom

    2 School of Biological Sciences, University of Bristol, Bristol, United Kingdom


    # ABSTRACT


    Background

    Phylogenetic trees are complex data forms that need to be graphically displayed
    to be human-readable. Traditional techniques of plotting phylogenetic trees focus
    on rendering a single static image, but increases in the production of biological
    data and large-scale analyses deman scalable, browsable, and interactive trees.


    # Methodology/Principal Findings:


    We introduce TreeVector, a Scalable Vector Graphics-and Java-based method that
    allows trees to be integrated and viewed seamlessly in standard web browsers with
    no extra software required, and can be modified and linked using standard technologies.
    There are now many bioinformatics servers and databases with a range of dynamic
    processes and updates to cope with the increasing volume of data. TreeVector is
    designed as a framework to integrate with these processes and produce user-customized
    phylogenies automatically. We also address the strengths of phylogenetic trees
    as part of a linked-in browsing process rather rather than an end graphic for.


    # Conclusions/Significance


    TreeVector is fast and easy to use and is available to download precompiled, but
    is also open source. It can also be run from the web server listed below or the
    user''s own web server. It has already been deployed on two recognized and widely
    used database sites.


    Citation: Pethica R, Barker G, Trough J (2010) TreeVector: Scalable, Interactive,
    Phylogenetic Trees for the Web. PLoS ONE 5(1): e8934. doi:10.1371/journal.pone.0008934'
