    # MATERIALS AND METHODS


    # Selection and Preparation of Specimens for MRI


    A critical overlooked aspect of scanning specimens using high resolution MRI is
    the undesirable effect that tissue preservation and storage practices can have
    on the MRI response of and the generation of MRI artifacts, particularly at field.
    For example, since MRI is based on the behavior of water molecules, preservation
    methods that reduce the amount of water and lipids can significantly reduce the
    MRI signal and contrast of tissues as well shrinkage. While fishes do not require
    any preparation for MRI, and many museum fishes have been ever immersed directly
    in their alcohol storage [27], quality can be significantly enhanced if fishes
    undergo some degree of preservation. In order to mitigate image artifacts and
    increase the quality and uniformity of images among specimens, we have developed
    a standardized protocol for preparing MVC fishes for MRI. However, the utilization
    of these methods with specific specimens is at the discretion of collection managers.


    Fishes were obtained from the MVC where they were typically fixed in 10% formalin
