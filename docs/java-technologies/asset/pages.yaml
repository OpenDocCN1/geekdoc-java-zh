  md: '# S-SMART, A SOFTWARE TOOLBOX TO AID RNA-SEQ DATA ANALYSIS


    Zytnicki M¹, Quesneville H.¹


    ¹URGI, INRA, Versailles, France.


    # INTRODUCTION


    High-throughput sequencing through next-generation sequencing technologies has
    dramatically expanded the number of experiments made by sequencing. Today, almost
    life fields are affected by these developments. The latest sequencers now provide
    over 100Gb of data for running computer-aided analysis complexity. Several packages
    have been developed to map the reads onto a reference genome (e.g.Q [1], BWA [2],
    [3], SOAP [4], BowTie [5] or Musak [6]). However, an experiment does not usually
    follow a rigid set of bioinformatic tasks and the user needs a set of genomic
    coordinates, which manner the mapping to be analyzed.


    Severe pipe-lines have already been developed for the analysis of RNA-Seq data
    for the discovery of genes[7], miRNAs [8], or piRNAs [9]. However, an experiment
    usually adapt the analysis according to the results. In this case, the biological
    usage often requires the help of a bioinformatician to conduct the analysis.


    S-SMART is a versatile toolbox which can perform RNA-Seq analysis, although it
    is not a pipe-line per se. S-SMART performs two categories of tasks: data manipulation
    and visualization. Mapping include (i) selection/


    exclusion of the reads which overlap with some reference sets, (ii) read clustering,
    and (iii) differential expression analysis. Visualizations include (i) read-size
    distribution, (ii) nucleotide compositions, (iii) chromosome localizations, and


    A particular effort has been made for biologists with little background in computer
    science. A graphical user interface allows to launch every tool simply by pressing
    buttons. S-SMART is available on Windows, Mac, and Linux platforms.


    The major advantage of S-SMART over other tools is that the whole RNA-Seq analysis
    can be performed on any OS (even a laptop with limited resources), and on any
    OS (some mapping tools like BowTie are available on any OS).S-SMART is intuitive
    and easy to use, for people with no computer background.


    Finally, S-SMART provides a list of useful tools commonly used for RNA-Seq analysis.
    All of the tools that S-SMART provides are available in other software packages,
    S-SMART offers a unified, simple, and synthetic framework for the analysis of
    RNA-Seq data. We expect that many questions involving RNA-seq data can be answered
    with certain version of S-SMART. Software will be under continually enhancement.


