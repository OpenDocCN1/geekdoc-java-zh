    # WRITE PROGRAMS FOR PEOPLE, NOT COMPUTERS


    Scientific software need to write code that both experts can easily read and edit
    and other programmers (the author''s self). If software cannot be easy to read
    and understand, it is much harder to know that it is actually doing and what it
    intends to do. To be productive, software developers must consider many aspects
    of human computing in account; as human memory is limited, human attention is
    finely tuned, and human attention is short [33]–37].


    # Box 1. Summary of Best Practices


    +   1. Write programs for people, not computers.

    a. A program should not require readers to hold more than a half of facts in memory
    at once.

    b. Make names consistent, distinctive, and meaningful.

    c. Make code style and formatting consistent.

    2. Let the code be readable.

    a. Make the make testable.

    b. Save recent changes in a file for re-use.

    c. Use a build tool to automate workflows.

    3. Work in small teams with frequent feedback and course correction.

    a. Use a version control system.

    b. Put everything that has been created manually in version control.

    4. Don''t repeat yourself (or others).

    a. Every piece of data must have a single representation in the system.

    b. Modularize code rather than copying and pasting.

    c. Re-use code instead of rewriting.

    5. Plan for mistakes.

    a. Add assertions to programs to check their operation.

    b. Use an off-the-shelf unit testing library.

    c. Use a symbolic debugger.


    First, a program should not require readers to hold more than a handful of facts
    in memory at once (1). Human memory can only hold a handful of items at once,
    where each item is either a single fact or names ''aggregating'' several facts
    [34], which limits the total number of items needed to accomplish a task. The
    primary way to accomplish this is to break programs up into easily understandable
    functions, each of which constructs a simple, easily task. This makes each piece
    of the program easier to understand in the same way that breaking up a simple
    paper using sentences and paragraphs makes it easier to read.


    Second, scientists should make names consistent, distinctive, and meaningful (1b).
    If people use descriptive names, or names that are very similar, like results
    and results, it is likely to cause confusion.


    Third, scientists should make code style and formatting consistent (1). If parts
    of a paper use different formatting and capitalization, it would be hard to read.
    If different parts of a program are indented differently, or if programmers mix
    CamelNaming and pothole_case_naming, code takes longer to read and makes more
    mistakes [35]–[36].


