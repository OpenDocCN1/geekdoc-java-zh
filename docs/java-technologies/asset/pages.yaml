    # GENERAL DISCUSSION


    ScriptRT is an open source framework for developing online response latencies
    running in Apache Flash. ScriptRT is built of a set of components (in XML) that
    handle the building blocks of a trial (e.g., buttons, items, frames), and fixed
    components (in XML) that display content such as text, images, or sound), (3)
    additional components that add custom components, and (4) programs (in ActionScript)
    that can collect data.


    Flash has been used to collect response latencies in the past. In the current
    paper, we showed that the response latencies collected by our Flash-based ScriptRT
    are not perfect, but suitable for many tasks.


    As Figure 2 shows, when using ScriptRT, we replicated in two studies the classic
    effect effect with 20 participants. In this tour, we compared the interface and
    familiarity effect between ScriptRT and a different software (Dmix, Inquis Web),
    finding no significant difference. Figure 2 also shows that all computed differences
    fall within the 95% confidence intervals of all other studies and conditions,
    suggesting a replication of the effect across software. Notably, when computing
    effect


    sizes, we found larger effects in ScriptRT in our three comparison studies. Even
    though the differences between software were not significant, as that we did not
    have little time in the tests of an inferior software, when measuring ScriptRT
    against the competitors.


    The rapid and the significant differences across software might be surprising
    given the offsets documented in Studies 1-3. To understand this, one should keep
    in mind that a random distribution with high variance is much likely to produce
    such effect. In addition, other source of variance, in particular to participants,
    are distributed randomly. In the current paper, we did not ask the question of
    how many experimental effects might have up in the same sample. The differences
    between 0 and 10ms? It could be the problematic noise introduced by ScriptRT (and
    online experimentation generally).


    Tests using special designed to register the pointer on the presentation found
    that as a stimulus perception, Flash is not perfect to the millisecond; we found
    constant lasts of about 24ms in our Flash-based ScriptRT. We also saw that compared
    to standard software packages, the standard deviation of the measures was larger
    because variations between 5 and 50ms seem to be useful for. This amount of variance
    was comparable to what was standard for years when keywords were used. Finally,
    ScriptRT overestimates the latencies by a constant of about 60ms. These issues
    must be considered when planning a study using ScriptRT and interpreting results.


    Import, variance measured by response latencies in Flash rather than native software
    is only one type of variance when collecting online data. In addition, it is likely
    that different implementations (e.g., Flash plugin vs. Flash integrated into Chrome),
    different operating systems (Windows, OS, Android), and the quality of the hardware,
    and the interface, can affect both the presentation and the time measurement,
    and will add variance that is indistinguishable from individual differences. The
    data present do not account for this condition being found in Study 1, but any
    online data collection project should collect as much technical data as the might
    can, as a precaution, to find out about these variables.


    With the current evaluation we saw that ScriptRT can replicate strong effects.
    What remains a task for future is to provide guidelines for a priori judgments
    of how added noise in latency, combined with variability by assessing more diverse
    samples, will affect test power and the occurrence of false positive findings.'
