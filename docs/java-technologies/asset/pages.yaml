    # BioGraph tool: its Implementation and Availability


    This section discusses the implementation of the BioGraph methodology and the
    availability of the BioGraph tool. We have implemented the BioGraph methodology
    in a general framework which is modular and extensible, and provides functionalities
    at three levels of generality. The first level provides core data structures such
    as Corpus,Document, and Triplet, and the low-level language processing functions
    as sentence splitting,


    tokenization, and parsing. The second level contains the triplet extraction algorithm,
    its custom vocabulary structure, and utility functions of which are algorithm-specific.
    The third level provides post-processing such as normalization and filtering,
    and exporting of the results as text, XML and graph others.


    Our framework is implemented using the Python programming language, and with the
    publicly available Language Toolkit [67] software for natural language processing
    and the GENIA tag; LTK is a native Python suite of libraries and for natural language
    processing while the GENIA tag provides part-of speech, tagging, and entity recognition
    for biomedical texts. In order to access the GENIA tag, we developed a natural
    language-environment wrapper that turns the standalone program into a Python library,
    thus allows for any easy integration with the rest of the framework. In our framework,
    also integrates the Biome tool [23] for graph construction and visualisation in
    zoom-out, as well as the relocation of the graph triplets and arcs.


    In the triplet extraction, the LTK library provides sentence splitting while the
    GENIA tag provides POS and parsing forming the backbone of our application. Because
    of modularity, the software libraries allows various language processing tasks
    to be easily integrated.


