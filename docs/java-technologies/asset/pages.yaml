    Another form of kinetic distortion is found to be by commercial enzyme formations,
    referred to as "profile airing" (Figure 13). These profiles do not conform well
    to the model and can thus cause inaccurate quantification. Enzyme formations found
    to be effective for LRE analysis include Qiagen QuantIT, Agile Brilliant II, and
    Invitogen SYBR, although others are likely to be effective. It should be noted
