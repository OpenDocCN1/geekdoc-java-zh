    [49] – ''don''t repeat yourself'' which applies to both data and code.


    For data, this holds that every piece of data has a single authoritative reference
    in the system (4a). Physical constants should be defined exactly once the entire
    program is using the same value; data files should have a single canonical version,
    every geographic location from data which has been collected defined by its latitude
    and longitude, and so.


    The DRY principle applies to code at two scales. At small scales, modularize code
    has been shown to reduce error rates (4b). By using ''void code'', change is fixed
    once and takes effects everywhere, making the mental model of the program (i.e.,
    ''this is one function'') remains accurate. As a side effect, modular code allows
    to remember its functionality as a single mental model, which in turn makes code
    easier to understand. Modular code also be more reusable for other projects.


