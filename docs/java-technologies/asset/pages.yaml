    University of Cape Town, Cape Town, South Africa,

    ² European Bioinformatics Institute, Hinxton, United Kingdom


    # INTRODUCTION


    The integration of information is essential in any research project as a variety
    of data is generated in experiments, and must be analysed and validated in the
    context of the latest available knowledge-base. In Bioinformatics, this has proven
    to be a challenge, and for this reason multiple software solutions have been proposed,
    e.g. service oriented architectures, data integration, warehousing, view integration,
    etc.


    The Distributed Annotation System (DAS) is a widely used system in the bioinformatics
    field, and provides a method for taking data from more than one web-based resource,
    and displaying in a single view. DAS data can be integrated from multiple, heterogeneous
    databases in a standardised and portable format [2]. In this way, laboratories
    and research groups adopting the protocol can easily share, visualise and compare
    data. The DAS architecture is service-oriented and is comprised of three components:
    Registry, Sources and Clients. The DAS Registry (http://www.


    dasregistry.org) acts as a directory providing information about registered sources.


    DAS Sources provide an interface to access and retrieve biological data, and DAS
    Clients, such as Dastyy [3], Dalliance [4] and myKoyoView [5], provide a unified
    view of biological information, collecting data from multiple sources.


    A regular flow of information in DAS is shown in Figure 1. The client requests
    information about a protein that can be specified by its accession number or identifier.
    The client communicates with the DAS registry in order to retrieve a list of available
    sources providing information about that product. Once the client has retrieved
    this list, it queries the source providing the sequence or structure of proteins
    that it describes. The DAS source provides not only the sequence but also meta-data
    such as the version. In this way client can ascertain retrieved annotations to
    the original request. At this point, the client retrieves features, images from
    the available DAS sources. These annotations may be applicable to specific subsections
    of the sequence (e.g. the location of active sites or peptides) or may be applied
    to the entire sequence (e.g. related publications or taxonomy). Finally, the client
    organises and displays the annotations.


    Citation: Salazar GA, García IJ, Jones P, et al. MyDAS, An Extensible Java Server.
    Haslan NI, et al. PLOS One. 2012;7(e44180). doi:10.1371/journal.pone.004180.


