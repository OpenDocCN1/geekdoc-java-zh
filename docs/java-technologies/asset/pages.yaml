    # Evaluation of BioGraph Results


    The performance of BioGraph was evaluated on 50 full length articles with manually
    annotated correct triplets. The performance of information extraction is evaluated
    by calculating the precision and recall as follows: Recall=TP/(TP+N) and Precision=TP/(TP+FP),
    where TP are the true positives, TN are negatives, FP are false positives, TP+FP
    is the number of triplets extracted by BioGraph regardless of whether they are
    correct or not. The results achieved by BioGraph on the annotated triplets are
