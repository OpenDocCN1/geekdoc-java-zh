    # INTRODUCTION


    are automatically stored and executed across all computers to avoid redundancy.

    Progress in computer science and technology has largely promoted the development
    of genetic research in the past decades. Next-generation sequencing (NGS) is particularly
    notable technology for genomics and computational biology research. The explosive
    growth of NGS data has already revealed considerable problems for data management,
    computational resources and under long execution times. To address these issues
    associated with processing of large-scale datasets, MapReduce [2] and its implementation,
    Hadoop [3], were introduced. MapReduce is a framework that handles huge datasets
    in parallelizing by a large number of clusters, in which scalability can be dynamically
    allocated. In the programming model of MapReduce, developers only need to focus
    on implementing their programs with appropriate mapper and reducer functions.
