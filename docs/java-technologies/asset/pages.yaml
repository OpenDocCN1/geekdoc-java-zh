  md: '# Future Directions


    Current functions of SynPanel are limited to synaptic puncta detection, fluorescent
    intensity analysis, and dimensional analysis of 24 bit RBG images. We intend to
    continue improving the software by enhancing SynPanel''s capabilities and image
    compatibility. Incorporations of new features such as co-localization measurement,
    orientation of puncta quantification into the generic regions, particle tracking,
    and microtubule categorization are under development. Furthermore, the software
    is open-sourced, we welcome the inputs from the scientific community for any suggestions
    and modifications.


    # CONCLUSIONS


    Accurate measure of protein levels at synapses is a crucial tool for understanding
    how synaptic proteins contribute to signaling. Our software aims to increase the
    efficiency and reliability of analysis and provide additional advantages. First,
    the software is Java based and therefore, it can be installed on Windows, Mac,
    or Linux systems. Secondly, the software is small (~5 MB) in size and easily portable.
    Lastly, the software is freely available for any use in academic lab.


