    # ## INTRODUCTION


    Scientists spend an increasing amount of time building and using software. Most
    scientists are never taught how to do this efficiently. As a result, many of tools
    and practices allow to write more reliable and manageable code with less effort.
    We describe a set of best practices for scientific software development that have
    solid foundations in research and experience, and that improve scientists'' productivity
    and the reliability of their software.


    Software is important to modern scientific research as telescopes and test tools.
    From groups that develop computational problems, to traditional laboratory field
    work more and more of science revolves around developing algorithms, managing
    and analyzing large amounts of data that are generated in single research projects,
    combining datasets to address synthetic problems, and other computational tasks.


    Scientists typically develop their own software for these purposes because doing
    requires substantial domain-


    specific knowledge is an asset. As a result, recent trends show that scientists
    spend 30% or more of their time developing software[1],[2]. However, 90% or more
    of them are primarily self-taught[1], and therefore lack exposure to basic software
    development practices such as writing maintainable code, version control and issue
    trackers, code reviews, unit testing, and task automation.


    Software is just another kind of experimental apparatus and should be built, checked
    as any physical apparatus. However, while most scientists can validate their theory
    and field equipment, most not know how reliable their software is [4],[5]. This
    can lead to serious errors affecting the consensus conclusions of published research
    [6]: high-profile retractions, technical comments, and corrections to de-identified
    scientific results published in Science [7],[8], PNAS [9], the Journal of Molecular
    Biology [10], Ecology Letters [11],[12], the Journal of Mammology [13], the American
    College of Cardiology [14], Hypertension [15], and the American Economic Review
    [16].


    In addition software is often used for more than a single project, and is reused
    by other scientists, computing errors can have disproportionate impacts on the
    scientific process. This type of cascading impact caused


