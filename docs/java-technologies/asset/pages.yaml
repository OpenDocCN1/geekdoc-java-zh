    # Peak Overlap Clustering


    # Data Availability


    Most ChIP-Seq analysis programs calculate the overlap of peaks in a non-symmetric
    way. Problems arise when one peak region overlaps multiple peaks in another experiment.
    For examples, clustering with a symmetric overlap algorithm is desirable. PAPST
    generates a novel overlap algorithm where the overlap sets are symmetric (Overlap(A,B)
    = Overlap(B,A)). This approach achieves this by reducing the number of nodes to
    be drawn when a peak is with overlapping peaks in the opposite set (Figure 7).
    When applied to predict multiple peaks, PAPST generates a matrix of overlap values
    that is suitable for clustering. R was used to perform the clustering, and ChIP-seq
    experiments were used to visualize the resulting profiles using Wehtower method.
    Before clustering, the data were normalized to have a mean of zero and unit variance.
    Details are available in the supplementary materials and tutorials.


    “Software and test data can be downloaded at github.com/papst/papst."


