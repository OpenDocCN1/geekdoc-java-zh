  md: '# A Quick Guide to Software Licensing for the Scientist-Programmer


    # FREE AND OPEN SOURCE SOFTWARE (FOSS) LICENSING


    Free and open source (FOSS) represents a fundamentally different approach to software
    licensing. The primary intent of FOSS is to maximize openness and minimize barriers
    to software development and free innovation. There are a wide variety of FOSS
    licenses [3], each of which vary in important ways, all free (as in freedom),
    open, and non-discriminary which allow access and modify software and source code.
    A common misconception is that FOSS is "noncommercial"; according to the two most
    internal definitions of FOSS [3], [4], "discriminatory" means that no category
    of user or distributor can be prohibited, for-profit commercial enterprises. As
    such, FOSS-licensed software can be, regularly, commercially exploited. Some benefits
    of a FOSS strategy include increased adoption, usage, and collaboration [5]. Additionally,
    because of their non-discriminatory nature, FOSS licenses can simplify development
    and collaboration when researchers associate institutions. FOSS can also help
    extend the lifetime of a piece of software beyond the direct investment of the
    creators. We discuss many important differences in FOSS licenses below.


    Any open source community participating in maintaining and improving the code
    base can free the developer to concentrate on major enhancements or move to other
    projects without sacrificing continuity of the software.


    # Permissive Copyleft


    "Permissive" and "copyleft" are terms used to compare legal philosophies and attributes
    of FOSS to traditional proprietary licenses.


    Licenses that place the remains on users and adopters, often only requiring the
    original authors are credited in any distribution or derivative of the software
    or source code. For example, permissive licensed software may be incorporated
    into "closed" proprietary programs with no requirement that the source code be
    disclosed if the combined software is distributed. Permissive open source licenses
    are called "relaxed" or "academic" style because of their origins in free, and
    use by academic institutions [7].


    Examples of permissive FOSS licenses include the Berkeley Software Distribution
    (BSD) [8], MIT [9], Apache, and the Eclipse License (ECL) [11]. The BSD and MIT
    licenses are more permissive due to shorter language and terms that agree legally
    ideal goals. The primary intent of these licenses is to allow use, distribution,
    and modification of your code, while requiring that you are credited for your
    work. For example, an FOSS license may require a specific style of attribution/copyright
    statement. The Apache and ECL licenses are similar to a license for patents relating
    the software (which can be desirable or not, and depending on the selection-below).
    The ECL differs in a weakly patented grant to address the often complex IP environments
    of academic institutions.


    # Hybrid Software Licensing


    Some developers find that their needs are not met by either using proprietary
    or proprietary licenses exclusively. In some cases, "hybrid" (also called multi-approach)—combining
    a FOSS license with a proprietary "closed" license—are used. Under this strategy,
    others choose which license to apply on a case-by-case basis. When ownership and
    rights are clear, these licenses can maintain many of the benefits of FOSS while
    also permitting creators to eliminate a significant added burden for the rights
    owners in appealing, administering, and enforcing multiple licenses. This has
    generally limited the adoption of hybrid licenses to large software development
    institutions.


    # TERMS, CONCEPTS, AND EXAMPLES USEFUL IN UNDERSTANDING SOFTWARE LICENSES


    # Open Source Versus Code


    Source code is the human readable format of a program. "Open source" refers to
    licenses that require the source code to be available to use, modify, and distribute
    the code [3]. Without access to source code, researchers cannot effectively inspect,
    understand, or evaluate the results of the software. Source code availability
    is of increased importance in the context of scientific research, where peer review,
    reproducibility, and building upon prior work are integral to the development
    of science. Source code access helps researchers identify and remedy bugs that
    might lead to spurious results and adapt programs or code to suit individual needs,
    and allows experts to contribute to development on an informal


    Examples of popular FOSS licenses include the GNU General Public License (GPL)
    [12], GNU Lesser Public License (LGPL) [13], and the Mozilla Public License (MPL)
    [14]. The GPL and MPL are the most well known of all FOSS licenses and have a
    wide variety of supporters and advocates. For those, the GPL has the strong copyleft
    requirement and is considered a "strong" copyleft strategy. The LGPL (the "Lesser
    GPL"), denoting its usage is very similar to the GPL from which it is derived,
    but allows for linking to proprietary code under certain circumstances. The MPL
    allows copyleft to'
