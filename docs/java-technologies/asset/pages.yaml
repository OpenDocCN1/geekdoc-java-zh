  md: '# Java Technologies


    ![](img/a8d82052b482a3d31e63eb8a0b9a0c4c_167_0.png)


    Figure 1 Flow of information in DAS.


    DAS servers may implement a number of functions (called capabilities in DAS) depending
    on the information provided. The main DAS capabilities are:


    +   * Source: A list of data sources on the server.

    * Entry Points: A list of molecule accession numbers described by a DAS source.

    * Sequence: Corresponding to a given segment.

    * Types: A list of annotations type.

    * Features: A list of annotations for a segment.

    * Stylesheet: Server-side formatting on the retrieved annotations.

    * Structure: Protein structure, including metadata and coordinates.


    At the beginning of 2011 DAS Registry reached the milestone of 1000. Each of these
    servers has to follow the DAS protocol, which allows the implementation of variety
    of common features such as purpose of argument, exception handling, creation with
    HTTP protocol, and each source must also implement the interface with the actual
    data source. Ideally, implementing a new data source does not require the re-working
    of this common functionality.


    In this paper we introduce MyDAS, a server that facilitates the publishing of
    biological data. Our protocol allows users to group their data in the context
    of existing information without requiring them to understand the full DAS Protocol.
    All need to develop an adapter to specify how to access the data. This adapter
    is used by MyDAS to create the necessary HTTP interfaces to support all the capabilities,
    such as querying by segment or recovering the types of annotations.


    In the following sections we describe MyDAS, how to use it, its architecture,
    existing alternatives, and present some examples of current DAS services built
    upon MyDAS.


    # ANALYSIS


    In a simplified way, MyDAS is to DAS what the Apache Web Server is to the Web.
    When issued with a request, the output from Apache is typically an HTML file,
    whereas in MyDAS output is an XML document based the DAS specification. In Apache,
    when a non standard response is required, it makes use of various technologies
    (such as PHP, JSP or ASP) to create a custom HTML document. The functionality
    of the middleware can be enhanced by an adapter created by the owner of the interface.
    For superior customization without the need for a detailed understanding of the
    protocol.


    # Publishing Data with MyDAS


    When using MyDAS to publish biological data, the following series of steps are
    suggested as a guide: define the type of source you want to publish; implement
    an adapter to process this data; configure and run MyDAS in a web server. This
    allows the data to be accessed by a DAS client. Below is a more detailed explanation:


    # Define the type of the source


    In the DAS protocol there are number of types of source available, as reference,
    annotation or alignment sources. MyDAS allows us to choose between several interfaces
    that represent those types, the user is asked to implement the correct methods
    according to each type of DAS source.'
