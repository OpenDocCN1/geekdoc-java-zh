    # Discussion


    In Study 1 we used a well performing benchmark: DMDX in combination with an Arduino
    Leonardo board that detected stimulus with a light sensor and elapsed a keyboard
    response as response. DMDX detected this elapsed response with a low standard
    deviation of half a millisecond.


    Not surprisingly, ScriptingRT was less precise. Three browsers, measured latency
    ranges had between 18 and 47 ms, and their averages differed. On the other hand,
    the SD of their responses was 7 ms in all, a second percent. That value is higher
    than keyboard and response time. In addition, the constant added by ScriptingRT
    was so much. This suggests that using ScriptingRT should focus primarily on differences
    between RTs and when interpreting absolute latency.


    For researchers using ScriptingRT knowing the size and nature of the offset is
    useful. It is instructive to know how this is produced. Several delays may feed
    into it. ScriptingRT measures the latency as the command to display the stimulus
    is issued, but also the presentation on the screen, the registration of the key
    by the operating system and the activation of a key event in the Flashboard. A
    third delay may occur between the firing of the event and the recording of a time
    in ScriptingRT.


    We conclude not that ScriptingRT is less precise in measurement of latency than
    a naturally specialized latency solution. Furthermore, different results belong
    to somewhat different averages. Nevertheless, the benefit produced by ScriptRT
    seems acceptable.


