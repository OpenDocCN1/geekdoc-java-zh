    capable of analyzing ChIP-seq peaks both on gene-defined genomic regions (promoters,
    exons, introns, gene bodies) and on peak-defined genomic regions, making it a
    genome-wide data analysis platform. The peak-centric and gene-centric features
    allow easy customization to any set of user-defined genomic regions of interest,
