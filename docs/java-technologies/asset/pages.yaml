  md: "# ZODET: Software for the Identification, Analysis and Visualisation of Outliers\
    \ in Microarray...\n\nTwo adjustable thresholds (which have to be met) are used\
    \ to identify the outliers: (i) the significance level of the standardised of\
    \ the expression levels from the experimental sample, compared to the average\
    \ (mean) expression levels of the control group; and (ii) the (log)fold change\
    \ between the expression level of the experimental sample and the control group.\
    \ Furthermore, caution should be used to ensure the normality of the data, especially\
    \ when using small sizes (e.g., less than 30).\n\n+   - Volcano plot (Figure 2B)\
    \ highlighting the outlier probes with fold-change and log-(p,value) on the horizontal\
    \ and vertical axes, respectively. Under and over expressed outliers are colored\
    \ green and red\n- Heatmap of outlier probes for each individual (Figure 2B):\
    \ the probes are clustered in the outlier expression data, using hierarchical\
    \ clustering in the heatmap.function from the ggplot package (https://ggplot2.tidyverse.org/reference/heatmap/);\n\
    - Gene lists: containing identified values, probe IDs and names of the identified\
    \ genes.\n\nTo assess the standardised deviation of the experimental sample values\
    \ from the control group, a Z-Score is calculated for each probe (or group) on\
    \ the microarray:\n\n```\nZ = (E - μ) / σ\n```\n\nWhere: E is the expression level\
    \ of the gene for the experimental sample; and μ and σ are the mean and standard\
    \ deviation of the expression of genes in the control group. From the Z-scores,\
    \ p-values are calculated with reference to a normal distribution where the p-value\
    \ is the probability that the distribution of the control falls within the distribution\
    \ of the control groups. These p-values adjusted for multiple hypothesis testing,\
    \ per group, using the Bonferroni correction can be used. The default p-value\
    \ threshold is 0.01, which can be modified after each analysis run.\n\nThe fold-change\
    \ between the expression level of the experimental sample, and the control group,\
    \ is calculated for each probe on the array using the following:\n\n```\nfoldC\
    \ = E / μ\n```\n\nThis provides an additional measure of the difference in the\
    \ expression level of the experimental and the control groups and determines whether\
    \ the potential outlier is over or under relative to the control group. In equation\
    \ (2): foldC is the fold change; E is the expression level of the sample and μ\
    \ is the mean expression of the control group. To accurately estimate the probe,\
    \ all class genes used as input to the software should be in normal format. The\
    \ software is designed not to require any microarray platform specific and can\
    \ be used for any transformed microarray expression data (e.g., from Affymetrix,\
    \ other arrays). The default fold-change threshold is 1, which can be modified\
    \ before each analysis run.\n\nTo interpret the visualisations of the results\
    \ a number of clearly formatted graphs and tables are generated by the software\
    \ analysis, including:\n each individual (Figure 2B):\n\n+   - Scatter plot of\
    \ the correlation between the individual and mean control group values, with over\
    \ expressed outlier probes colored green and red respectively (Figure 2B);\n\n\
