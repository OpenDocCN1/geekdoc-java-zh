  md: '# RED: A JAVA-MYSQL SOFTWARE FOR IDENTIFYING AND VISUALIZING RNA EDITING SITES
    USING RULE-BASED AND STATISTICAL FILTERS


    Yongmei Sun¹, Xing Li¹, Di Wu¹, Qi Pan², Yuefeng Ji¹, Hong Ren², Keyue Ding²²


    +   1 School of Information and Communication Engineering, Beijing University
    of Posts & Telecommunications, Beijing, P. R. China.

    2 Key Laboratory of Molecular Biology for Infectious Diseases (Ministry of Education),
    Institute for Viral Hepatitis, Department of Infectious Diseases, The Second Affiliated
    Hospital, Chongqing Medical University, Chongqing


    # ABSTRACT


    RNA editing is one of the post- or co-transcriptional processes that lead to amino
    acid substitutions in protein sequences, alternative pre-mRNA splicing, and changes
    in expression levels. Although several methods have been used to identify RNA
    editing sites, there remains challenges to be addressed in distinguishing RNA
    editing sites from its counterparts on genomic and textural artifacts. In addition,
    there lacks a software framework to identify and visualize potential RNA editing
    sites. Here, we present a software —''RED'' (RNA editing sites Detector) — for
    the validation and visualization of RED sites by graphical user interface (GUI).
    To improve performance, we use MySQL database management system (DBMS) for high-throughput
    data storage and query. In the analysis of sample data-set with 28 experimentally
    validated C–RNA editing sites, RED had sensitivity and specificity of 0.64 and
    0.65. In comparison, REDTools had a better sensitivity (0.75) but similar specificity
    (0.5). RED is an easy-to-use, platform-independent Java-based software, and can
    be applied to RNA-seq data or without sequencing data. The package is freely available
    under the GPL3 license at http://github.com/sourceforge/red/projects/rededitor.


    # INTRODUCTION


    RNA editing is one of the post- or co-transcriptional processes with modification
    of RNA nucleotides from the genome sequence. In humans, the major types of RNA
    editing are deaminations (A→I) editing and editing


    to uracil (C→U), mediated by ADAR enzymes and APOBEC1 deaminase. I and U are interpreted
    as guanine and thymine (T) during splicing and translation, these changes in coding-sequences
    can lead to codon changes and alter functional properties of proteins [2]. In
    addition, RNA editing the introns can affect alternative splicing, and editing
    of untranslated regions (UTRs) can lead to retention of mRNA inside the nucleus.


    RNA editing has been linked to a wide range of human diseases, including cancer,
    neurological disorders, metabolic diseases, viral infection, and autoimmune disorder
    [3].


    Citation: Sun Y, Li X, Du D, Pan Q, Ji R, Ren H, et al. (2016) A Java-MySQL for
    Identifying and Visualizing RNA Editing Sites Using Rule-Based and Statistical
    Tools. PLoS ONE 11(3):e0150465, doi:10.1371/journal.pone.0150465 *Wei*'
