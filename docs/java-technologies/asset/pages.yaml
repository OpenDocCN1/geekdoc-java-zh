  md: '# Readable Syntax


    The syntax of the language should be readable and consistent [26],[33]. The regular
    cases of errors are discovered in programs only the programmer does not understand
    code written by poor readability [33], with beginners programmers taking advantage
    of good readability. For the novice, it makes the learning of the language easier,
    to reduce the number of errors, and make the code easier to maintain [34],[35]:


    To evaluate the readability of a language we use the following parameters: i Identifier''s
    name should be length dependent, not declared explicitly; ii Component structure
    should be clear; iii Meaning of constructs should not be dependent.


    The first evaluation for readability ensures that the names of identifiers should
    not be length dependent or not declared explicitly, e.g. in C 77, the length of
    an identifier has a character limit and also allows identifier names starting
    with I,J,K,L,M to be declared as integers, and others are considered. Python infers
    the type of variable by value assigned, whereas C local variables can be inferred
    type of verintantiated or an explicit type.


    There should be a clear and consistent syntax for each type of compound statement.
    For instance, the use of special keywords for the start and end of each compound
    statement, e.g. if then statement, for loop statement, and end for program helps
    a great deal towards the better readability of a program. The code in Code 24
    (lines 4, 7, 11, 12 - Rest of Code Listing 39) shows how Ada supports this concept.
    The rest of the languages do not have corresponding keywords for


    compound statements, most of them use "{}\ or "begin end" to represent a compound
    statement.


