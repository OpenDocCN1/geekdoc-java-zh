    ![](img/a8d82052b482a3d31e63eb8a0b9a0c4c_118_0.png)


    **Figure 1** A pipe-line for the discovery of piRNAs clusters, using S-MART.


    The Piwi-interacting RNAs (piRNAs) are RNAs of 28-30-nucleotides in length, which
    formed RNA-protein complexes with Piwi proteins. These piRNA complexes have been
    linked to transcriptional silencing of transposable elements in germ cells all
    have presented a pipe-line to discover the clusters of piRNAs using ChIP-Seq data


    Suppose that we have a set of reads from immunoprecipitation of piwi (file 1)
    and we want to find clusters of piRNAs. We have mapped them to the genome, by
    using Bowtie (file 2)


    We first remove the reads of sizes greater than 30, or less than 28, to exclude
    small RNA (file 3). We cluster the data and piRNAs usually gather in clusters
    (file 4), and we find the clusters with at least 10 reads


    Since some piRNA target elements, it is possible that a cluster contains only
    unique mapping reads. This is problematic because we are not sure that the cluster
    is actually present. To solve this, we extract all of the reads that mapped only
    once (file 6) and the clusters that contain at least one read (file 7). The clusters
    can finally cluster along the chromosome (file 8), and the list can be written
    in an Excel file (file 9).


