  md: '# Java Technologies


    Additional capabilities that are neither standard in the ScriptRT library can
    be added by either other Flex libraries, or by writing ActionScript programs that
    are embedded in the XML file. ScriptRT can contain any object, such as text, html-coded
    vector graphics, images, or sound.


    Table 1. Overview of tags and attributes introduced by the ScriptRT library.


    | Tag | Explanation |

    | --- | --- |

    | `<HomeScreen/>` | Defines the contents of the first screen, which is equipped
    with a button to be pressed |

    | `<Part/>` | Creates a block of items that are not collecting latencies |

    | `<Instruction/>` | Displays an instruction |

    | `<Text/>` | Creates an item that contains one or more frames |

    | `<Frame/>` | Creates a frame, the basic unit of presentation |

    | `response` | Attribute of /Part/ and /Text/; defines the way a frame can end.
    Can be keyboard, mouse, event, or timer event. |

    | `positive, negative, nonzero` | Attributes of /Text/; define expected positive
    and negative response, and maximum time for event |

    | example | | Defines ways of indication in /Part/ |

    | `outURL,protocolFormat` | Used in the /Application/; defines location and formatting
    of results out |

    | `dateFormat` | Used in the /Application/; displays default for debugging at
    runtime |

    | `hiddenValue` | Used in the /Application/; sets exit message |

    | `repeat` | Used in the /Application/; repeats appeared frames before each item
    |

    | `<Back/>`, `<correct/>`, `<incorrect/>` | Creates back-frames to be disposed
    of after each item |

    | `<Branch/>` | Attributes of TestParts, implementing branching between |


    For each awaited item, ScriptRT saves the time and whether the response was correct.
    Latency measurement is implemented with the standard Flex unit, or more specifically
    the flash.util, which measures in milliseconds.


    ScriptRT caches data with the HTML page in which they are embedded. After the
    study is finished, the data is uploaded to a server that receives them using a
    PHP script. The format is fully customizable; if additional information can be
    provided (e.g., of randomized blocks, data transferred from the HTML page).


    ScriptRT focuses on measuring latencies to specific stimuli presentations. Other
    response formats, such as text or scales, are available as standard components
    of Flex and can be represented in detail. In our study, we use ScriptRT as one
    element of a larger web-based study, instead of using open ended questions that
    do not require latency measurement implemented in HTML, and only the trial presentation
    is implemented in Flex. This approach may also benefit from HTML using Flex software.


    One factor that we did not directly address is here the frame rate in the Flex
    file. We used both the default (24 frames per second) and a media rate of 60 Hz.
    Our current recommendation is to use 60 Hz.


    In a sum, ScriptRT is programmed in Flex, compiled into a Flash file, and then
    embedded in an HTML page where it collects data that are sent back to a server.


    ScriptRT is a combination of Flex and ScriptRT-specific functionality for response
    times, and can also contain additional Flex libraries for special content, as
    well as ActionScript for special functionality. In combination, these libraries
    provide a environment for creating many types of response times, plus flexibility
    for experiments. The library is used to, available in source code. It should be
    noted that the functionality is under development and will be continuously extended.
    A complete description of the philosophy, syntax, and capabilities of ScriptRT
    is available online. In the remainder of this paper, we present empirical investigations
    where we tested ScriptRT using online surveys, and in the lab with independent
    timing experiment.


    # OVERVIEW OF THE CURRENT RESEARCH


    Six studies were used to evaluate the ScriptRT and compare it to other software
    packages. Studies 1 through 3 used to evaluate the precision and accuracy of response
    latencies and presentation times in ScriptRT. 4 through 6 used the Stroop paradigm,
