    # Pollen species: Optimization


    Optimizing the parameters to construct grid examples directly affects the types
    of patterns the pollen classifier detects. Griding determines the scale of patterns.
    Grid size and color quantization determine the number of possible hashes, which
    affects the complexity of the classifier. To achieve high accuracy, we used an
    automated method to tune these pollen models by cross-validation. For a given
    set of parameters, we generated a model from training and tested the performance
    of the system on validation data. By searching over the estimated scale of the
    parameters that would yield the highest accuracy identifications on, unseen tests.


    To reduce the number of combinations to a tractable number, we computed a 64-bit
    hash code for each grid. To do this, we used a fixed matrix of 64-bit dimensions
    N the number of pixels in the grid and Q the number of intensity levels. For each
    of the pixels in a grid example (as defined above), we summed the random number
    tables and patterns in the grid to produce a hash. The hash is then derived from
    the 64-bit hash code using modulo by aB, the number of bins for accumulating class
    statistics. In this experiment, B = 2,048,000, this means we counted 2 million
