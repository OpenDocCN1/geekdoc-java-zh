    # Learning System Overview


    # Slide Scanning and Mapping


    We used a Hamamatsu NanoZoom microscope to scan batches of pollen slides at its
    highest possible optical magnification (400x, 0.23 um/pixel). This is the standard
    for pollen analysis using light microscopy. We manually set the scanning area
    so pollen sample on each slide could be scanned. For each slide, 6 axis (z-) planes
    were scanned at 1 um intervals, producing an opticallyed 3D representation of
    the entire sample. Image data were acquired from the microscope at a rate of about
    100 MB per minute. With cooperation from RMW, we developed Java code to convert
    the NanoZoom images into image objects using 2D array bytes to store and format.
    Image storage for the original raw and formatted images was up to 5 TB in total.
    We chose to use the raw images to accelerate the speed of image scanning and processing
    over demands. Due to the size of the uncompressed images, we are unable to share
    the full image dataset online. However, the original reference and constructed
    ratio slides, raw image scans, and subsampled images are available by request
    from the corresponding author.


    ![](img/a8d82052b482a3d31e63eb8a0b9a0c4c_90_0.png)


    Figure 1. System Overview.


    Slides were scanned using Hamamatsu the NanoZoom microscope. During the first
    pass, ARLO extracted image windows that experts tagged as ''pollen'' or ''not
    pollen''. Using this implementation, ''Pollen spotting'' was used to distinguish
    pollen pixels from the background of an image. We used a set of random from the
    pool of samples from which these were drawn in Experiments 1 and 2. ARLO windows
    with pollen content were used to build a pollen species classification model,
    which was used to predict species ratios in the slides Experiment 1 and to produce
    species classifications in Experiment 2. See test for details.'
