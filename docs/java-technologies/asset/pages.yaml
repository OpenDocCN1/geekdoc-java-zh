    # # CONCLUSIONS AND OUTLOOK


    Even though the accuracy and precision of HTML5 technologies still remain for
    improvement, we can continue the continuous development in the future of the new
    standards built by HTML5 indicates a promising future for applications that require
    accurate and precision presentation of content.


    # ## Implications for Web-based research


    As mentioned in the introduction, the results of this study have implications
    for current implementation in behavioral and social contexts. Some experimental
    paradigms require the accurate and precision of very basic visual format. For
    instance, using static and rapidly changing stimuli with 10 and 100 ms [5]. However,
    our results show that not all technologies are equally valid to deploy when experiments
    are conducted. Given the variable performance of experiments, researchers should
    carefully decide which technologies to use, depending on the requirements of their
    experiments. They should also report the specific details of the timing mechanics
    in the Methods section of their paper. Without this, their findings might not
    be comparable to researchers on similar but not identical experiments.


    We concluded that all the tested declarations are the most effective alternative
    at intervals around 500 ms, as they yield a low number of missed frames (means
    between 0.0 and 1.5 with standard deviations from 0.459 to 1.70). They are also
    stable (with a main effect of size or important intervals involving this factor)
    and independent of the performance of JavaScript (it does not overload the event
    and is not affected by it). The conclusion could be that using the combination
    of SVG and Canvas in Chrome precludes good performance


    The performance of well around the HTML5 standard (Canvas, SVG, and WebGL) is
    very similar to that of previous web technologies (means of missed frames between
    0.06 and 1.50 with standard deviations between 0.252 and 1.505, compared to means
    between 0.00 and 2.18 and standard deviations between 0.109 and 3.182).'
