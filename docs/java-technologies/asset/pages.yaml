    # Workflow


    Following the completion of a run, fluorescence readings are edited into an Excel
    workbook. The LRE Analyzer provides templates for manual data import (Figure 6),
    along with support for importing data from Applied Biosystems 7500 and Stratagene
    MX3000 instruments (support for additional controls be added depending on demand
    and available resources). The primary requirement for data import is to link each
    amplification profile to the sample used to generate it, and to designate which
    are calibration profiles. The data is then read into the LRE Analyzer, which conducts
    analysis for each profile, including automated retrieval of amplicon size from
    an import database. Although it is possible to manually adjust the analysis by
    adjusting the LRE window, testing has shown that automated analysis can routinely
    generate quantitative accuracies in the ±15-30% range. Target quantities can be
    exported into an Excel workbook by run, sample, or amplicon (Figure 7).


