    # Co-localization analysis to identify enhancers and screen for common TF bindings


    Efficient co-localization analysis, both peak-centric and gene-centric, is the
    key feature of PAPST. ESC enhancers are characterized by co-occurrence of transcription
    factors Oct4, Sox2, and Nanog [17]. Young''s lab has used this occupancy of the
    master TFs as a main criterion to identify 8794 enhancers including 231 super
    enhancers [16]. We used PAPST, which-peak-analysis, to map ChIP-Seq data (both
    BWTIE mapping and MACS calling) and co-localize by the three master TFs. After
    merging-co-localized regions were identified by PAPST, a total of 8787 enhancer
    regions were identified, which overlap 95% and 39%, respectively, of the 8861
    total enhancers and 231 super enhancers by the paper set of genomic coordinates
    as defined by the binding peaks of a transcription factor, PAPST can be used to
    identify unlimited number of co-localized transcription factors andor histone
    modifications, or any other defined genomic regions of interest.


    # Analysis of peak intensity within the genomic regions of enhancers versus typical
    enhancers


    PAPST can generate quantitative data for extended co-localization analysis. ESC
    enhancers show higher levels of active enhancer epigenetic marker H3K27ac compared
    to non-endogenous ESCs with co-promoter occupancy of Oct4, Sox2, and Nanog [16].
    We used PAPST to perform total based peak signal normalization of ChIP-Seq peaks
    for Oct4, Sox2, Nanog, Medator (Med1), and H3K27ac. Next PAPST was used to generate
    normalized read counts of these factor enhancer regions and in typical-enhancer
    regions, which indicate significantly higher levels of these key factors than
    those of the typical (enh-) values: Oct4 2.26e-33, Sox2 1.58e-31, and H3K27ac
    4.17e-12 We used W-test. PAPST is also used to generate the percentage of enhancers
    occupied by H3K27ac and Med1 compared to typical enhancers (Figure 4). In these
    applications of PAPST (the Performance and Usability section below for the timings),
    co-localized peaks are not only identified, but can also be investigated quantitatively.


