    only one commit, as in our judgment they do not qualify. Our approach is typical
    for this type of research [44].


    # COMMIT


    To analyze the contributor activity distribution, we measure the number of commits
    submitted by the individual contributors. The collective open-source development
    process consists of commits submitted to the unified repository supported by the
    source control system. A commit represents a synchronization/exchange of code
    with a remote repository and a submission of the programmer''s changes. A simple
    software modification, such as adding, modifying or removing lines of code, adding
    or removing files, which in the documentation files, are typical examples of commits.
    Because of the nature of software repositories and their accessibility, commits
    have been subject to numerous software development studies [32-43]. While many
    researchers claim to classify the value of commits by their size or number of
    received commits, we intend to measure only the contributor''s activity, not the
    value of their work [45,46].


    # DATA SOURCE


    We used data from OpenHub.net (formerly OpenHub)—the open-source projects registry.
    This article is based on the June 2014 snapshot of the Apache database, which
    contains over 664 thousand open-source projects. OpenHub provides information
    about projects, including name, main programming language, date of creation. Additionally,
    the registry provides information about individual contributors and commits. OpenHub
    retrieves the project directly from open-source repositories using most popular
    version control systems as Git, SVN, Mercurial, and Bitbucket.


    # DATA COLLECTION


    To collect the Apache Software Foundation projects, we developed a Java-based
    program that queries the OpenHub using the REST-API based. Our program queries
    the OpenHub using "apache" as project identification key, then iterates over the
    unique project ID. Using the project ID, the program executes queries and collects
    details about individual contributors. The initial query returned not only the
    open-source project matching apache, but all related projects that could extend,
    or use Apache projects. For the final analysis we have decided to create a unified
    criteria to prepare a clean dataset.


