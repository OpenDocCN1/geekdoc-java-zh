    is not well covered. Further research is needed to identify the causes, and mitigation
    of, inconsistencies in image quality that are frequently encountered when scanning
    specimens in particular. This can help determine the potential benefits of specific
    contrast agents and scanning protocols, to enhance MRI results and reduce artifacts.
    Ideally, better methods for preserving specimens for MRI could be adopted by making
    selection prior to exposure. For instance, fixing specimens in fresh quantities
    of ten or more could prevent the injection of alcohols formed during chemical
    fixation and stabilize pH. This would allow specimens to remain in fixed long
    enough to ensure tissue fixation while minimizing the loss of mineralized (which
    can be an issue when using unbuffered formalin). Improved methods for record collection
    and preservation of specimens greatly assist in the selection of suitable candidates
