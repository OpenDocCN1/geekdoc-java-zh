    # Research rationale


    The Web was born in the research world and it has been closely linked to the research
    world. Researchers from various disciplines use the Web to conduct experiments,
    and social sciences are increasingly interested in continuing experiments over
    the Internet. With laboratory experiments it is relatively easy to access large
    samples on the Internet. Researchers have little control over which participants
    take part in online experiments. Online researchers do not know whether the participants
    perform the task or correctly understand the instructions. The pioneers of Internet-based
    research have been paying a high level of scepticism in the evaluation of studies.
    Therefore, they conducted numerous studies comparing social and psychological
    effects in the use of the Internet compared to laboratory-based experiments. However,
    the overall conclusion is that the advantages of performing online experiments
    outweigh their few disadvantages [11].


    Among the studies that argue methodological concerns are those that require precise
    and accurate presentation of stimuli and response measurements. As mentioned,
    there are several studies on the suitability of web technologies for online experiments
    [27], [22]. However, there is a need to update the results and conclusions obtained
    in these studies. During the last decade, studies of the suitability of some web
    technologies that have not been paying the same attention and the available data
    is more than 10 years old. Some of the earlier conclusions may not stand long.
    Therefore, an update of these measurements is necessary and thus performed in
    this work.


    At the same time, the Web has evolved into the most prominent platform for developing
    applications. Nearly every service is available through the Web. The apparent
    similarity


    To achieve our goal, we have conducted three studies. In Study 1, we analysed
    the accuracy and precision of animations that use different mechanisms in Flash.
    In this study, each timer was evaluated in consecutive tests to determine degrees
    of accuracy and precision over time. In Study 2, we analysed several web technologies
    with a focus (i.g., HTML5) to provide new data and a baseline to compare the results
    of our study with previously published results. In Study 3, we compared the combinations
    of modern web technologies (i.e., related to HTML5) to create animations (CSS
    Animations, and SVG) and procedural (SVG with JavaScript, Canvas, and WebGL animations).


    # Study 1: Analysis of precision timing mechanisms in Flash


    The aim of Study 1 is to find out which of the combinations between timing mechanisms
    and frame rates in Adobe Flash is the most accurate and precise. Once, we used
    this timing mechanism and frame rate measurement to analyse each animation in
    consecutive tests to see if there is degradation of accuracy and precision as
    a function of time.


