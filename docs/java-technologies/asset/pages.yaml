  md: '# PREVIOUS APPROACHES TO ONLINE RESPONSE-LATENCY MEASUREMENT


    The typical response latency study presents the participant with a number of trials,
    between 50 and 300, and asks for fast responses as possible which requires skill
    and for the participant to vary widely, and consequently the responses can vary,
    from 400 to 200 ms for most tasks. The factors of interest are typically manipulated
    within experiments, and latency differences in the literature range from tens
    to millions.


    In an online-based survey, only a participant with stable network connection is
    required. Such studies, where the computer is doing little besides answering questions
    and sending back the answers to the server. However, in order to collect response
    latencies many individual trials are needed to be executed on the computer (i.e.,
    client-side). This is because communication between clients and servers varies
    in time and amount of values, and would introduce too much noise.


    Thus, to run a response latency study online, one needs some program that runs
    on the participants computer, and presents the trials and collects the latencies.
    Several technologies have been used to create such programs: JavaScript, HTML,
    and native (Windows PC or Mac) that is downloaded. We briefly review some approaches,


    # Java Programs


    Most approaches to measure response latency in online studies have been based
    on Java. Adeaço, Eichardt[6] evaluated the performance of latency measurement
    by Java. Nosek, Banaji, and Greenwald[7] reported latencies which the Implicit
    Attention Test (IAT), a robust screening tool. Of the nine reported IATs showed
    response latency differences between the critical blocks that were between 95
    and 301 ms, with SDs lower than 22 ms. Cohens and working with Java, Mayo, and
    Greco[8] implemented a psycholinguistic study. Using a self-reading paradigm that
    produces latencies between 1000 and 2000 ms, they studied previously run in the
    lab. They observed that this have the power to detect latency differences above
    185 ms. With Barton, Locke, and Berlin [9] implemented Tjavato, a Java-based open-source
    program for psychological studies, without an evaluation of its measurement precision.


    # Flash Programs


    It is worth noting that all recent online IATs are by "Project Impl" [10] implemented
    in Flash, replacing Java. Reimers and Reiter [11] worked with whether participants
    completed a binomial choice paradigm with 30 trials in the lab using a test in
    C++, or with Flash the same program from the outside. They found that Flash added
    a delay of about 30 ms, with no standard deviation to the distribution of latencies,


    # Scripting Programs: JavaScript and HTML


    JavaScript and HTML have been used by Mason [12] to implement a modern open source
    version of the IAT. Evaluation of that implementation has been published by Tyler
    and Peck [13] who relied on JavaScript to measure response latencies, and showed
    median mean of values. Currell, Crumpdon, and Gurek [14] reported realistic reaction
    times with JavaScript programs and participants recruited found replication of
    the Amazon Turk [15]. They found several paradigms (Stop, task-switching, flanker
    task, Simon, Posner kuy). They observed that over stimulus precision could be
    achieved down to 80 ms, but not more.


    # Native Windows Programs


    Two original PC-based packages were designed to collect response latencies that
    have methods to extend their data collection. The commercial software Insight
    enables online studies. To run a study, one must download one executable file
    or an executable app in a Java Web Language. Similarly, the free software package
    DMDK5[16] offers a test method which executes on the client machine. The advantage
    is that well performing code executed on the client - machine is in fact the same
    code is used for desktop testing, which the machines running will much more well-managed
    lag, avoiding error [17]. The disadvantage is, because security concerns, anti-virus
    software, and browser restrictions make it difficult, and possibly limit these
    applications to where participants know the entity constructing it well enough
    (e.g., to students of a university.


    # Comparison and Summary


    In sum, JavaScript, and Flash have been used to measure response latencies. The
    published evaluation that all three can be successfully used, but also that can
    be increased in comparison to native programming on a PC, which can serve as an


    The best of each approaches to native programs showed that aware has been published
