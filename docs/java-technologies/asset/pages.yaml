    To quantify the number of possible grid examples, we quantized the pixel intensity
    values. The original pixel intensity values, ranging from 0 to 127, were reduced
    by a quantization factor between 1 and 127 using integer division, yielding Q
    intensity levels for each color channel (Figure 4). A sampled grid of N pixels
    quantized to K possible colors can occur on N^K configurations, so with a small
    grid and quantization factor we can have over 10^6 possible grid examples. For
    example a table with N=8 x 8, K=4 x 4 we would have more than 10^11 combinations.


    Once the count h was computed, it was used as an index in two arrays containing
    counts for positive and negative examples (Figure 2). During training, if a human
    expert classified the pixel p from which h was a positive intensity value, the
    value of the positive count at the count array was incremented, the value of the
    negative count at the count array was incremented.


    After training, the pattern count arrays, number tables, and patterns contained
    all the needed information to classify new examples and comprised the learning
    machine model. During testing, a candidate pixel was formed from the same parameters
    used for training (Figure 2). A hash was then calculated using the same random
    number tables, and the values corresponding to its index in both pattern counts.
    If the value of the positive count array was greater than the value of the negative
    count, the candidate pixel was classified as a positive example, as pollen. Otherwise,
    it was classified as a negative example, as the background. Storing the pattern
    count arrays and number tables for a set of parameters took up to 32 MB of space.


