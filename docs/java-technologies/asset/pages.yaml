  md: '# CHAPTER 21 PRESENTATION ACCURACY OF THE WEB REVISITED: ANIMATION METHODS
    IN THE HTML5 ERA


    Garaizar P¹, Vadillo MA², López-de-Ipiña D¹.


    ¹Deusto Institute of Technology, DeustoTech., Universidad de Deusto, Bilbao, Spain.

    ²Department of Experimental Psychology, University College London, London, United
    Kingdom.


    ABSTRACT

    Using the Web to run behavioural and social experiments quickly has become increasingly
    popular in recent years, but there is some controversy about the suitability of
    using the Web for these objectives. Several studies have analysed the accuracy
    and precision of different web technologies in order to determine their limitations.
    This paper updates the evidence about presentation accuracy and precision of the
    Web and extends the study of the accuracy and precision in the presentation of
    multimedia stimuli to HTML5-based solutions, which were previously untested. The
    accuracy and precision in the presentation of visual content in classic web technologies
    is acceptable for use in online experiments, although some results suggest that
    these technologies be used with caution in certain circumstances. Declarative
    animations on CSS are the best alternative when animation intervals are above
    50 milliseconds. The performance of procedural web based on the HTML5 standard
    is similar to that of previous web technologies. These technologies are being
    progressively adopted by the scientific community and have promising futures,
    which makes their use advisable over obsolete technologies.


    INTRODUCTION

    Computers have been an indispensable tool for scientific research since the advent
    of the computer, not only by their computing power, but also due to their ability
    to present multimedia information. Prior to the popularity of graphical user interfaces,
    computers have been used to present visual stimuli in tasks subject to strict
    constraints. The success of the Web as a primary medium of communication facilitated
    the creation of the first experimental applications on web technologies.


    Given the great diversity of web technologies, user-agents, and operating systems,
    there is some controversy over the suitability of the Web for these objectives.
    For this purpose, several studies have analysed the accuracy and precision of
    different web technologies in order to determine their limitations. However, existing
    work has not been explored (comprehensively), and did not examine different options
    for controlling display in HTML5 (e.g., WebGL). This paper seems to [2], [3].
    The aim of this paper is to: (1) to update the evidence about presentation accuracy
    and precision of the Web in the presentation of multimedia stimuli, and (2) to
    extend these studies to HTML5-related technologies which have remained untested.
    The results of the present study have implications for researchers interested
    in developing online


    Citation: Garaizar P, Vadillo MA, López-de-Ipiña D (2014) Presentation Accuracy
    of the Web Revisited: Animation Methods in the HTML5 Era. PLoS 9(10): e10982.
    doi:10.1371/journal.pone.0109812


    *'
