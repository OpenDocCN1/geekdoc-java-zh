    techniques is interested in publishing the assembled sequences, and therefore
    publishing data as a reference is more important.


    MyDas, an Extensible Java DAS Server 147


    # Configure and deploy


    An instance of MyDas can run multiple data sources. There configuration file where
    uses the location of the adapter and meta information about the source, such as
    name, origin and version. General aspects of the server are the same file (e.g.
    low compression, include XML stylesheets, etc.).


    In order to publish the information, MyDas must be installed in an internet-web
    machine, where the data will be only locally accessible.


    # Create an adapter


    A MyDas adapter is a Java class that represents the DAS and provides an interface
    between the source and the rest of MyDas components. Some programming skills are
    required to create an adapter, as the nature and the data varies from source to
    source. Depending on the interface used in the previous step, different methods
    need to be implemented. MyDas then uses these to respond to DAS commands.


    These methods allow MyDas access to the origin of information (databases, text
    files, servers, etc.) and to map that information onto the DAS model. For example,
    if the information is stored in a database, the adapters indicate which tables
    correspond to the segments, and which field to its id, name, etc.


    # Design and Implementation


    MyDas is a Java Servlet Application accepting HTTP requests, typically with one
    request for each command in the DAS specification. Responses are XML documents.
    MyDas is a Java 1.6 application, and it runs on a Java servlet container as Tomcat
    (tomcat.apache) or Jetty (jetty.eclipse.org/jetty/).


    Figure 2 The architecture of MyDas, representing the core (which is installed
    in any installation) external components that should be defined for each particular
    adapter to each kind of data. This division was created with the goal of providing
    DAS service developers with a platform of common methods to deploy their data
    as a DAS service. Every source has details about its storage system (e.g. a relational
    database or flat file), and the strategy used to query the data (e. g. pre-indexing).


    ![](img/a8d82052b482a3d31e63eb8a0b9a0c4c_168_0.png)


    Figure 2 MyDas Architecture.


    The configuration makes the user options available to both the MyDas core and
    the data source elements. The configuration file is used to define the DAS sources,
    including data such as the URI, title, the path to the data source adapter and
    also provides a method of defining general options such as the styles (XSLT) to
    display the data in a web browser.


    In facilitate the implementation of data sources, a template project is available,
    with examples of both reference and annotation sources.


    MyDas includes a Java object that represents the different elements that are retrieved
    by a DAS source. This must then be used by the source developer when creating
    an adapter. In this way, MyDas is able to deploy heterogeneous data into DAS.


    # RESULTS


    # Showroom


    MyDas is an extensible server that has been designed with ease of development
    in mind. Where, MyDas uses the same terminology in the DAS specification, with
    the consequence that DAS service providers will experience a learning curve when
    implementing a MyDas service for the first time. MyDas is being adopted by different
    data providers, including UniProt, InterPro and PRIDE'
