  md: '# Java Technologies


    Our proposed framework comprises of two main categories which include technical
    and environmental feature sets. The technical feature set covers the language
    theoretical aspects, whereas, the environmental feature set helps evaluating


    external factors. These factors have been presented in Table 2. The feature sets
    in this framework not only help in evaluating the suitability of FPL, but also
    include comprehensive guideline for designing a new FPL.


    Table 2 Evaluation Framework.


    | Technical Features | High Level |

    |---|---|

    | Orthogonality | |

    | Strongly Typed | |

    | Enforceability of Good Habits | |

    | Security | |

    | Feature Uniformity | |

    | Less Effort for writing simple programs | |

    | Environmental Features | Demand in Industry |

    | Contemporary Features | |

    | Easy Transition | |

    | Readable Syntax | |

    | Quality Coding | |

    | User Friendly Integrated Development |


    Firstly, we have discussed each technical feature separately, which have then
    been followed by the discussion of onenvironmental features, individually. We
    discuss each feature using the following inlets: (i) define a feature; (ii) discuss
    its suitability for the evaluation of an FPL; (iii) define its evaluation criteria;
    and (iv) evaluate each language in Table 1 to refer to each measurable features
    for that feature.


    defining documents; and the implementation of these features in the widely used
    compilers of language, essentially with similar semantics.


    # Technical Features


    In this section we discuss each technical feature in detail. These technical features
    have been evaluated by considering a language''s conformance to their defining
    sub-features. Furthermore, these features have also been rated against the aforementioned
    qualitative values.


