    # Pollen spotting: Algorithm.


    We used a hash-based machine-learning algorithm that computes a numeric feature,
    a "hash code", an index for each pixel based on features of its neighborhood [24,
    25]. Each hash code identifies the "shape class", or category, to which the pixel
    belongs and is an integer from 1 to N, where $N$ is a parameter to be optimized.
    The optimal number of shape classes the algorithm can recognize depends on the
    complexity of the classification problem and the number of training examples available.
    For high accuracy, more different shape classes are used, or more complex hash
    code (shape classes) is justified. Connecting hash codes of interest for learning
    individuals involves (1) identifying pixels, (2) reducing the resolution of pixels
    (quantization), (3) computation of randomly ordered 64-bit hash codes, and (4)
    the range of hash codes by modulus division.


    ![](img/a8d82052b482a3d31e63eb8a0b9a0c4c_91_1.png)


