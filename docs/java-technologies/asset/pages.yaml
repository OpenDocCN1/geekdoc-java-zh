    a noun, verb, adjective, adverb, chunking is the process of grouping the syntactically
    coherent units of words such as noun phrase (NP) and verb phrase (VP). The process
    of POS tagging and chunking biological texts was used in the GENIA tagger. The
    output is the chunks of, such as Noun Phrase (NP), Verb Phrase (VP). Each chunk
    labels the phrase levels according to the Budgeting Guidelines. Project publicly
    accessible phrase level tag types: http://biontology.stanford.edu/PennTreeTags.html.
    The sentence labeled with chunks is the input to the triplet extraction module.


