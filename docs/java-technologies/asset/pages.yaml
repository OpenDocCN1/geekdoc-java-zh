    library creation and management, and has great potential for data assimilation
    from sources, not only newly acquired from specimens (the MVC), but also for acquisition
    of data from other modalities (CT, x-ray, photography, genetics, etc.), from other
    groups or projects, or from scanning across species. This digital infrastructure
    also provides great flexibility in data acquisition.


