    # Optical read precision is critical for start cycle selection


    Although a primary objective is to maximize the size of the LRE window by starting
    the start cycle as early in possible, optical read precision becomes a major limitation.
    This is because LRE is based on cycle difference which is calculated by dividing
    the fluorescence ($F_C$) by the fluorescence produced by the preceding cycle ($F_{C-1}$):


    ```

    $E_C = \frac{F_C}{F_{C-1}} \times 100\$

    ```


    produced by replicated readers. As the "A-Rep Lo" $E_C$, averaging the variance
    generated by all the replication sets within a run, provided such a general estimate.
    This not only is useful for selecting an optimal minimum $F_C$, but also for assessing
    the overall performance of an assay. Although the scope of this study, has, among
    other things, large differences in instrument performance, provide differences
    in optical accuracy. A simpler method would be to lower to the minimum $F_C$,
    until the average $F_C$ reaches a minimum, although this should only be taken
    as a general guideline, except in exceptions which have been encountered.


    Due to this ratio-based determination, the accuracy of $E_C$ determination depends
    on the precision of fluorescence readings, which is referred to as "precision";
    accuracy of cycle selection can be dramatically compromised when reaction fluorescence
    is below the lower limit of the instrument''s capacity. Large differences in this
    lower limit between instruments, by the arbitrary nature of the fluorescence units
    used in real-time PCR, presented major challenges for selection of the start cycle.


    # Defining the top of the LRE window was


    A major source of quantitative error encountered during early attempts to apply
    mathematical methods to PCR using nonlinear regression (sigmoidal fitting or SCF)
    were distortions within the region of a profile. To maximize quantitative accuracy,
    we used a method to exclude aberrant cycles from the analysis. The recursive nature
    of LRE analysis provided a simple method for identifying aberrant cycles [5],
    which are both in the F, and LRE plots (Figure 10)


    ![](img/a8d82052b482a3d31e63eb8a0b9a0c4c_36_0.png)


