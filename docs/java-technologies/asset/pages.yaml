  md: '100


    Java Technologies


    Triangular correlation plots for the visualization of pairwise linkage disequilibrium
    implemented in Haplov [7], are the most method used to report LD in population-based
    studies [8]. The extensive number of variants available on commercial arrays makes
    the interpretation of triangular correlation plot difficult when SNPs are in high
    linkage but not between other SNPs. The complexity of triangular plots increases
    with the size of the region being analyzed, so it is therefore necessary to develop
    various ways to plot LD for genome regions with a high density of SNPs or correlations.


    We conceived a new way of visualizing LD blocks across the genome as SNPs in perfect
    LD (r=1) can be hierarchically clustered based on their pairwise linkage. ArchLD
    is the implementation of this new concept in a Java application which integrates
    the UCSC Genome Browser [9] with a powerful tool and interface for building LD
    blocks.


    SNPs were obtained using the iVover tool used by the project and were computed
    using the PLINK [15] on all SNPs sequenced by the 1000 Genome Pilot Project (60,
    CEU, CHJBT and Y [6]). Each population was analyzed independently. Collecting
    LD information and SNP annotations were managed on the server side using MySQL
    v 5.7.


    # IMPLEMENTATION


    ArchLD comes in two versions: a client-server application (ArchLD) for the analysis
    of LD across the four populations sequenced by the 1000 Genome Pilot Project (CEU,
    CHB, JBT and Y [6]) and a standalone application (ArchLDCustom) for the analysis
    of LD case studies.


    ArchCustom is implemented in Java v1.6. Clustering of LD blocks is performed by
    a local instance of R using the same algorithm described as ArchLD. Connections
    to the MySQL database are configured through the local path of Haplov and R and
    need to be set before any analysis. All the computations are run locally. LD can
    be utilized using an instance of the UCSC Genome Browser [9] or be exported as
    BED files.


    Blocks of SNPs in perfect LD (r=1), individuals (14 distinct sequences) are clustered
    based on their pairwise LD matrices obtained using the software Haplov [7] on
    the populations provided by the 1000 Genome Pilot Project [6]. Due to the low
    number of CHB and JPT samples selected by the consortium (30 samples each) when
    the two populations have been merged as previously done by others [6], this allows
    for an comparison of LD patterns according to their similar size. The software
    was used to include all 1022 individuals in project [1].


    All graphical interfaces are generated using the library for Java [1].


    ArchLDCustom computes LD clusters from genomic datasets imported by the user.
    The software accepts pedigree data and metadata in the standard format used by
    Haplov [7]. Each chromosome must be loaded independently and R values are estimated
    using the software Haplov.


    # RESULTS


    # LD Structures


    LD sets, clusters of SNPs in perfect LD (r=1), can be built from four distinct
    elements: genes, SNPs, chromosomes (ArchLD only) and genomic regions (ArchLDCustom).


    In both versions of the software blocks are visualized in an integrated instance
    of the UCSC Genome Browser [9].


    ArchLD is implemented as a client-server application developed in Java v1.6 (client-side)
    and EE v1.7 server. All computations are executed by a Java servlet deployment
    using Tomcat (v7.0). Hierarchical clustering of LD blocks is performed using R
    v2.15.1 by the function hclust from the package [stats] utilizing an agglomeration
    method based on [12]. The distance matrix for the analysis is defined by LD matrices
    as 1-r.


    Gene-chromosomal clusters are composed of LD blocks with at least one SNP located
    inside or in proximity of it. The maximum distance between the gene start/end
    and the SNP needs to be included in the analysis by the user. The tool uses three
    identifiers for genes: Name Ent, Ref IDs and HU gene symbols.


    SNP-chromosomal clusters contain all LD blocks located on a specific region. Region-centered
    architectures focus on the genomic dataset imported by the user. Only SNPs imported
    in the file are used to build clusters.'
