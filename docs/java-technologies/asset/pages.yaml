    for scanning microscopy, also offers fractal analysis of images. It includes a
    tool for box-counting, a triangulation, a variance, or power spectrum method for
    the estimation of fractal dimensions [30].


    All mentioned software applications can be used without a high-level graphical
    user interface. Some of them provide command-line interfaces for integration in
    external tools and tasks. IQM expresses several characteristics that are not expressed
    by the mentioned software applications and which we will emphasize throughout
    the present paper:


    +   - Combined image and signal analysis from a high level GUI in one tool

    - Convenient management of images and signals in a clearly graphical user interface
    (GUI)

    - Advanced and versatile stack processing of images in data series or parallel

    - Interactive evaluation of image and signal processing algorithms in a "preview"
    mode

    - Integrated comprehensive fractal and signal analysis

    - We are not providing a library of image processing algorithms all of the mentioned
    products, but in the simple exploration of algorithms in a user-friendly environment,
    where results remain reproducible.


    # Intended Audience


    With this paper we address to researchers and software engineers in life science,
    medical science, computer science, and natural sciences. We provide a free, extensible,
    and cross-platform application for the development and exploration of image and
    signal processing algorithms


    Additionally, IQM can be used in education courses to visualize and demonstrate
    the basics of simple as as sophisticated algorithms. These algorithms can be tested
    with students using their Java programming skills. It is also offering proper
    tools for the exploration of essential principles. It is better to develop individual
    applications for each task and most of the time one would have to pay a costly
    license fee for commercial products.


    With IQM, we address these problems by providing an open source and cross-platform
    software in one of the leading programming languages for application development.
    The advantages of IQM are furthermore, that it is freely available and that the
    software offers a framework for the integration of both image and signal analysis.


    # Installation


    IQM is written in Java, it remains portable to all operating systems, where a
    Java Virtual Machine (JVM) runs. The installation of the compiled IQM software
    package is common to all operating systems and quite straightforward. However,
    the presence of a JVM is prerequisite. Each binary distribution of IQM can be
    downloaded from project for different operating systems, where the Java have been
    available for system integration in Windows, Linux and Mac OS. After downloading,
    no explicit installation is required and the application can be launched immediately
    in the standard configuration. For more detailed installation instructions are
    referred to IQM''s user guide.'
