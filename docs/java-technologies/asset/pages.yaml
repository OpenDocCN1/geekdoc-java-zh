    \ for Functional Magnetic Resonance Imaging, University of California San Diego,\
    \ La Jolla,\nCalifornia, United States of America\n\n# ABSTRACT\n\nMuseum fish\
    \ collections possess a wealth of anatomical and morphological data that are essential\
    \ for documenting\nunderstanding biodiversity. Accessing specimens for research,\
    \ however, is not practically and frequently\nconflicts with the need to maintain\
    \ the physical integrity of specimens and the collection as a whole. Non-invasive\n\
    thidimensional (3D) digital imaging serves as a critical role in facilitating\
    \ the digitization of these specimens for\nanatomical and morphological analysis,\
    \ which is a facilitating factor for online storage and sharing of this\nimaging\
    \ data. We present an online archive of high-resolution, high-contrast, magnetic\
    \ resonance imaging (MRI) scans of the soft\nanatomy of any fish preserved in\
    \ the Marine Vertebrate Collection of Scripps Institute of Oceanography.\nWe have\
    \ imaged and uploaded MRI data for over 300 marine and freshwater species, developed\
    \ a data and\nretrieval system with web-based image analysis and visualization\
    \ tool, and integrated these into the public FISH\ndabase and associated metadata\
    \ freely. We show that MRI is a powerful and potent method for\naccurately depicting\
    \ the inside soft-tissue anatomy of preserved fishes in sufficient detail for\
    \ large-scale comparative\ndigital morphology. These 3D volumes require a sophisticated\
    \ computational and archival interface\nin order to be accessible to researchers\
    \ and educators.\n\n# INTRODUCTION\n\nNatural history collections possess a wealth\
    \ of anatomical,\nmorphological, genetic and geographic data that are essential\
    \ for\ndocumenting and undisturbed biodiversity [1–3]. Although\n\nsome of the\
