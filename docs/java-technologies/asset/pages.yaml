  md: '# A Program for LRE-Based Real-Time qPCR that Enables Large-Scale Absolute
    Quantification


    Of greater significance is that these datasets reveal RT values of 13.0%, 10.1%,
    and 9.5%, respectively. This indicates that these RT reactions were within the
    range of LRE quantification (i.e. error of measurement), which demonstrates the
    high level of repeatability that can be achieved with reverse transcription. It
    is also important that these target quantities were generated using the methods
    provided by us which require less or no intervention.


    Figure 14 provides an example of a key attribute of absolute quantification, which
    is the ability to assess quantitative accuracy using dilution assay (LDA), that
    provides the ability to construct quantification from fluorescence and optical
    parameters on real-time qPCR is based [5]. This indicated that for two of the
    targets, RT quantification agreed within 12% of that quantity provided by LDA,
    and consistent with previously reported[5], [7].


    Finally, the LRE analyzer provides an open source platform that facilitates data
    storage and sharing. For example, the LRE databases could be provided as supplementary
    data that in turn allow access to raw data in an organized format, easy to access.


    # DISCUSSION


    One of the most striking features of using the LRE analyzer is the evaluation
    of lately ranges of data generated over multiple runs. Central to this is the
    versatility provided by absolute quantification, which allows targets to be compared
    not only across different runs, but also across different assays and instruments.
    The relative quantification upon which conventional methods rely is based on a
    single point that defines the order of magnitude. The called "quantitative" (Cq)
    [10], a major limitation of this approach is that Cq is specific. In order to
    directly compare values, some form of normalization is required, such as using
    normalization gene expression standards [11], or normalization to a reference
    gene(12).


    Absolute quantification eliminates the need for normalization avoids assay-specific
    differences, which ensures that the number of target molecules becomes independent
    of assay implementation. An important implication of this principle is that assay
    performance can be defined in terms of quantitative accuracy, which is how a quantitative
    determination correlates with the actual number of target molecules. The ease
    of absolute quantification provided by LRE, combined with the automated data processing
    provided by the LRE analyzer, could greatly enhance the efficiency and reliability
    of qPCR without circumventing the limitations associated with conventional methods.


