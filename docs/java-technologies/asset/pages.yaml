  md: '# An Evaluation Framework and Comparative Analysis of the Widely Used Programming
    Languages


    The major focus of this work is to figure out how to evaluate the suitability
    of a FPL. To this, we have proposed a framework for the evaluation of FPL, which
    is mainly based on technical and operational features. The novelty of this work
    is that while evaluating languages we have not only relied on research literature,
    but have also strongly included the general programming rules to evaluate the
    most of features. We have also defined a scoring based on the defined framework.
    This scoring is customizable to be tuned to the user''s preference. The other
    of this work is have evaluated and ranked widely used FPLs using our proposed
    framework. Therefore we have considered different and oriented programming languages
    and ranked them from top to bottom. It is evident from Table 1 that Ada, C++,
    C+, Java, Modular-2, and Pascal have been the most used FPLs, whereas Python and
    C which have been widely popular as FPLs. The survey by Scheme is also mentioned
    in this paper but we did not consider it in our comparison as it is not part of
    our evaluation.


    The rest of the paper is organized as follows: the related work. The proposed
    framework has been discussed in the section "Proposed Framework and Comparative
    Analysis of Commonly used FPLs", where we have not only presented the evaluation
    for each language but also the considered FPLs over. The scoring function for
    the suitability of the programming languages has been presented in the section
    "Scoring Function". Finally, we present the conclusion and future directions of
    this work.


    # Related Work


    Formal evaluation aspects of the programming languages are few and far, with most
    evidence has gathered in anecdotal. Some approaches have been proposed to evaluate
    the quantitative score for FPL, for instance, [5] described a list of criteria
    for evaluation and assessment. However, this criterion has not been discussed
    with technical details of the methods involved, which have been used for evaluation
    and scoring purposes.


    Clark [8] used questionnaires to evaluate a programming language. He has demonstrated
    that a questionnaire evaluating the cognitive dimensions can be a useful and valuable
    tool for evaluating the suitability of a programming language. But, focusing on
    cognitive aspects does not allow comprehensive evaluation or assessment as aspects.


    Gupta [6] discussed requirements for programming languages for beginners, which
    is effectively a requirement for an analysis of FPL. However, there is no assessment
    framework for evaluation of a language for its suitability as an introductory
    FPL. Similarly [13],[14] present language evaluation based on intrinsic and extrinsic
    criterion for suitability of introductory programming. Intrinsic criterion is
    related to language technical aspects such as safety, syntax, visual vs. technical,
    compiled vs interpreted. Extrinsic criterion is related to external factors (student,
    industry


    trend), (supporting, text books) and introductory programming course (design,
    algorithm social skills). These criterion and relevant parameters have been discussed
    on a scale level and need to be further proposed so to evaluate the languages.


    Mcver [7] proposed a method for comprehensive evaluation based on the suitability
    of programming language. The interaction of programmer with similar language IDE
    was recorded and analyzed for all types of errors made by programmer. The better
    evaluation with similar IDEs; however focuses on IDE and undermines the other
    factors. Kiling [42] claims that several tools to support and improve the learning
    and teaching of programming have been used, and searched for many years, but the
    problem persists.


    Analysis of research in this area is the comparative evaluation of languages that
    are widely used by FPL. For instance, a comparison of Modular-2, Fort77, Pascal
    and C is considered in [10]. Philipp] compared C and Java from the view of departments,
    bugs and productivity errors. Hamdaj evaluated the suitability of Java and C and
    Ada''s with their conformance to the requirements of "Steelman" has been presented
    in [45]. Another method of research, presented in [12] in [15],[16],[17] by favored
    members, are those who discussed the suitability of languages, usability, and
    way of programming for languages Like Python. These articles present the evaluation
    of languages based on their experiences. Another but gone gone of work is to get
    the real data about the behavior of the novice programmers [44]


    The above discussion reveals that many efforts have been carried to evaluate and
    compare FPLs, yet not to address the question of the suitability of a comprehensive
    method to evaluate a language as an appropriate FPL, which helps in comparing
    the suitability of different languages as FPL. In this work, focus on defining
    a comprehensive framework for assessment of languages with all relevant and in
    details. The novelty of this work is that after defining the evaluation parameters,
    we have also presented the characteristics to evaluate each language, and utilize
    others approach to improve the general programming language rules for purpose.
    This effectiveness has been verified in performance evaluation of a language,
    as may be used to compare the suitability of different languages as an appropriate
    FPL. We have also scored the widely used FPLs using our framework. Furthermore,
    we have also developed a aggregation function so to quantify and rank the FPLs
    based on the given.


    # Proposed Framework and Comparative Analysis of Commonly Used FPLs


    In this section we proposed our framework for the suitability analysis of an FPL.
    The suitability analysis of popular FPLs on the parameters defined in analysis,
    has also been presented. To this end, we analyze each language and a quality score
    based on its conformance to each factor related to a parameter.'
