  md: '# Java Technologies


    We developed the open-source ARLO (Automatic Recognition with Layer Optimization)
    to classify image classification problems such as the identification of black
    and white nuclei. The program applies pattern recognition and machine learning
    to the identification and counting of cells. In the field of pathology, analyses
    are often limited by the rate of data collection [12]. Automation has potential
    to increase sample sizes and speeds, thereby freeing the pathological researcher
    to focus on the analysis and interpretation of patterns [13].


    Automated pattern recognition has been a subject of machine learning since its
    inception in the 1990s [14]. Three general approaches to building machine learning
    systems for image recognition have evolved since time. These approaches follow
    a continuum, based on the amount of background knowledge embedded in the system.
    On one extreme are deductive systems, which are guided by human expertise. These
    models are often called "expert systems," and require effort of expert knowledge
    to develop these types of systems. In the context of pathology, recognition is
    derived from image features such as shape, size, orientation, extremity, and thickness
    [15, 16]. A deductive system would recognize these features and implement the
    expert rules. Learning would be avoided because the system applies pre-defined
    logic, i.e., through human rules. Unlike inductive systems, which are guided by
    human knowledge (in the form of expert features or rules) to solve the problem
    [17]. It is instead given only classified examples (as known as the ground truth).
    The system creates its own rules using the classified examples and learning function
    to classify cell species. Many inductive systems also take some image from which
    an expert identifies features and the system inductively learns the relative importance
    of these features in producing classifications (e.g., [3, 18]).


    The methodology for pathology classification presented in this paper does not
    involve any open-problem classification in the form of rules or features from
    human experts. The system is given classified examples of black and white nuclei
    and derives its features for classification. In this respect, the system learns
    from previous examples to model the behavior of nuclei [3, 19, 20]. The key difficulty
    is the choice of learning systems and features used. The features that the system
    discovers are not the relevant features of pathology that would be recognized
    by a pathologist. Instead, simple pixel grid-based representations are used to
    generalize to a wide range of visual recognition problems beyond problem classification.
    This generalizability, however, comes at a cost. A considerable amount of computation
    is spent in learning these features from examples.


    The two-tier, or two-step, methodology we developed uses machine learning to learn
    segment grains from


    the background slice, classify pixels, and report ratios. We used ARLO to conduct
    two experiments that utilized two sets of algorithms and optimization procedures.
    The first was computationally intensive and focused on reconstructing black and
    white nuclei. Instead of segmenting individual grains, we trained and tested our
    classification at model level. This allowed us to directly compare our automated
    counts with human counts. To achieve comparable results, we used intensive optimization
    techniques, which were not scalable because we used an instance-based machine
    learning with N complexity (where N is the number of samples). This was too expensive
    to process even a limited number of samples. Our second analysis focused on maximizing
    classification accuracy at the grain level. Instead of reporting ratios, we represented
    each species in a given window. Our analysis was more scalable because we used
    a hash-based machine learning algorithm.


    In our work, we have an inductive approach to create machine learning models that
    accurately recognize features of focal pollen grains. The caveat of this approach
    is that we had no absolute measure of classification accuracy. Our training samples
    for the focus analyzed examples that were classified by a human expert. However
    we had no mechanism for verifying the accuracy of the expert identifies. In contrast,
    for the ratio method, we had the ground truth which should be evident because
    the pollen slices used for learning (or training) were created by human counting,
    with known counts of each species. This method eliminates error in the training
    data and allows us to rigorously evaluate our classification system to a greater
    extent than was possible in our work.


    # MATERIALS AND METHODS


    # Ethics Statement


    Pollen was collected with permission from male cones of trees on land in Minnesota.
    To our knowledge, no permits were required for these collections, which were completed.
    Neither Picea mariana nor Picea glau is protected.


    # Sample Slice Preparation


    Pollen was collected from multiple cones of black spruce and white spruce (Picea
    stroba) from three trees of spruce Duluth and Grand Rapids, Minnesota, 46.6368°N,
    -92.9038°W, 47.0953°N, -93.5701°W, 48.6251°N, -93.52611°W in May 2011. Trees were
    collected from this location and we created 12 reference slices (slides containing
    grains from a single tree). Two individuals per species were represented; each
    had three duplicate slices. These slides provided a balanced machine learning
    training'
