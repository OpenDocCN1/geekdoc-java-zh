    The PDS model topology represents a faithful representation of current knowledge
    on the topology of plant defence signalling against the plant-virus interaction.
    More specifically, we have chosen to base our model on the constant interaction
    between toviruses and TCV. In Arabidopsis, the resistance to TCV is regulated
    by the R protein [49], which initiates a signaling cascade leading to plant defence
    responses. Activation of R protein stimulates accumulation of SA. Arabidopsis
