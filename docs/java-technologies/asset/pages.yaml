    # INTRODUCTION


    Chip-Seq, one of the most powerful research applications of Next Generation Sequencing
    (NGS) technology, is fundamental to the investigation of TF-to-DNA interactions
    and histone modifications. A ChIP-Seq data analysis pipeline includes a) mapping
    reads to a genome, b) calling significant peaks, and c) draw-stream analysis of
    peaks including co-localization analysis and assignment of peaks to other genomic
    regions. There are well-established mapping programs [1–3] and a large number
    of ChIP-seq programs [4–8] specialized peak-callers with robust normalization
    features [9]. However, availability of easy-to-use powerful platforms for post
    calling and analysis is limited. Adding this is particularly important for scientists
    who in many cases, are responsible for making biological sense of the data. Chojnovicki
    et al. [10] have recently highlighted the lack of packages for post-peak calling
    and the need for more user-friendly software to empower a greater


    of researchers in the community. Their program, ChIPP, is the only downstream
    ChIP analysis package with a cross platform graphical interface. That program
    focuses on visualization of raw data as histograms and viewing quality check information.
    Two other recently developed tools, with MACS2 [11] and ChIP-viewer [12], are
    web-based. The first is peak-centric-only, and the latter brings some features
    of popular Linux command tools such as HOMER [13] and BEDTools [14]. Online tools
    such have the advantage of easy use and support more devices. However, this advantage
    comes at the cost of flexibility, longer response times from the server, and fewer
    customization features. In comparison, a stand-alone tool gives the user more
    customization and control over the data analyzed, as demonstrated by the Java
    platform genomics GCV [15].


