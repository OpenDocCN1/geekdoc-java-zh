    # User-Friendly Integrated Development Environment


    In order to evaluate the user friendly integrated environment (IDE) we consider
    the following parameters: i) structured editor; ii) pretty printer; iii) syntax
    checker; iv) novice programming environment. Every programming language has a
    great variety integrated environment [7]. These environments facilitate both novice
    and seasoned programmer, to write and visualize the code; however,


    Structured editing feature in source editor code helps the programmer avoid syntactic
    errors and correction by suggestions. This helps the novice programmer to concentrate
    on solving problem while focusing on syntactic issues [72][73]. All considered
    FPLs support this feature.


    Pretty printer handles the formatting of source code, also known as beautify,
    and indentation, coloring, font size style, block collapse and expansion. The
    inclusion of such features in the text editor helps the novice programmer a great
    deal to improve the readability of a program [74][75]. Except Fortran, all languages
    have the support of pretty printers.


    Static editing involves the identification of unused variables, unused functions,
    and violation of custom naming


    conventions. This helps increasing the conformance of code to the coding standards.
    There are several check tools for Java (Checkstyle, FindBags, GrammarTech Code
    Smar), C/C++(cpp, clint, Lin-PC), Pascal (Understand), Ada (AdaControl, LBR Testbed)
    and Python(PyPylint). Except all other considered FPLs practice static checking.


    The debuggers allow to examine the code of variables at a certain point by stopping
    the execution of a program most widely offered features of a debugger are to add
    watch, breakpoints, run step by step, and continue execution at different locations.
    This helps the novice programmer to find errors in their program. It is highly
    recommended that novice programmers should learn debuggingstrategies [77][177].
    All considered FPLs should be equipped with debuggers.


    Visual programming environment is also important in terms of teaching and learning
    an FPL. There are rich and richer novice programming environments for many considered
    FPLs. The list of them is as follows: [83] Java (Learning, Blockly, C++-(Block;
    Fortran(GO),), Java, BlockCourseMaster, GreenCode, Jellet), and Python(Althon,
    Python Turtle). Some of the IDEs support drag and dropping coding (Block) objects
    which help the novices to write code without syntax errors. Table 19 shows the
    ratings of considered programming languages based on the provision of user friendly
    IDEs.'
