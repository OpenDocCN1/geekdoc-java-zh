  md: 'ROC curves are plotted based on simulated for a range of up- and down-regulated
    probes from a set of 20,000 probes.


    Interestingly, most methods consistently performed well when identifying the up-regulated
    true positives in the simulated dataset, resulting in an area under the ROC curve
    (AUC) of 1.0 (Figure 3). When identifying the down-regulated probes, ZODET, clearly
    outperforming the GTI methods with average AUC of 0.99 and 0.98 (respectively).
    While the GTI method is specifically designed to identify probes that are over-expressed
    relative to the control group, ZODET detects both under- and over-expressed outliers
    equally.


    In summary, the two methods performed equally when identifying the up-regulated
    outliers from the simulated dataset, ZODET is also able to detect down-regulated
    outliers to a high level of accuracy.


    # Identification of outlier genes in a monocified microarray dataset


    An example microarray dataset is used on our webpage (http://www.ucl.ac.uk/molecular-medicine/publications/outlier-analysis).
    This dataset consists of two files: (1) "EXPERIMENT DATA" file-containing the
    expression data, microarray collected from 40 samples split into two groups labeled
    control (A1 to 20) and experimental (B1 to 20); and (2) "EXPERIMENT INFORMATION"
    file-containing associated experimental features. The technical specifications
    of these input files are provided in the supplementary material.


    A ZODET analysis was performed with the thresholds of a fold change >1.75 and
    p<0.0001. Combining the ZODET analysis results from B1 to B20 identified up- and
    14 down-regulated probes in this population (Table 1). Three probes corresponding
    to genes were identified significantly in more individuals within the experimental
    cohort. Three individuals were found to be over-expressed compared to control
    group E128 (GPR128 (ENSG0123595)18078) or chemokine (Ccl3) motif-like 3 (CCL3.1)
    (ENSG1177352). These probes were found to be down-regulated in three or more individuals
    in the experimental population. 2-5-oligoadylate synthase 1 (OAS1 (ENSG015882))
    and RPS23 (RPS23 (ENSG117459)) were significantly identified in three and two
    of the three tests, respectively. However, ZODET (ENSG0174018) was found to be
    a recognized single polymorphism (SNP) rs337383 which accounts for the three down-regulated
    outliers identified in the experimental cohort. The SNP result results in probe
    polarisation and no genuine reduction in gene expression. PCR verification should
