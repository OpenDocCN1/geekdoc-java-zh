  md: '# Conclusion


    These findings suggest GDAE-Lab is so easily enhanced by users familiarized with
    adopted procedures for calculations of energy profile using oxygen uptake lactate
    during exercise. By providing availability of the software and our source code
    we hope to facilitate future result.


    # INTRODUCTION


    The establishment of the amount of energy expenditure during exercise has been
    considered of key importance to strategy development at both health [1] and athletic
    performance [2]. Over the past century, many methods have reported in literature
    in order to assess energy profiles during dynamic exercise [3.4]. It has been
    argued that whole-body oxygen uptake (VO$_2$) are considered to represent aerobic
    system (AT$_{max}$). On the other hand, there is no unbiased method accepted as
    standard to estimate anaerobic system construction [5]. It has been proposed that
    measurement of blood lactate could provide biophysical relevant although being
    an invasive procedure, the sample size too small to be biopsy for the determination
    of maximum amount of ATP that can be estimated in an inaccurate estimate [6].
    Thus, alternative methods using whole-body physiological variables have been proposed
    in order to estimate the anaerobic system (AT$_{max}$ and LT$_{max}$ during dynamic
    exercises.


    Among many methods using whole-body physiological variables to estimate AT$_{max}$
    and LT$_{max}$ of the post-exercise VO$_2$ and lactate accumulation during exercise
    has probably been most used widely [2,8]. While AT$_{max}$ is assessed by the
    determination of the fastest component of exercise post-exercise oxygen consumption
    [10,11], LT$_{max}$ is assessed by calculating the anaerobic threshold [12]. Furthermore,
    the previous studies have demonstrated that this non-invasive method has the property
    to properly assess the energy output by the anaerobic system compared with other
    traditional methods such as maximal accumulated oxygen [8] and Wingate test [9].
    Furthermore, this method also has the advantage of allowing establishment of the
    energy profile using portable metabolic system such as weight training [22], treadmill
    [13], and bike [14]. The convenience of this method is especially important because
    the increase of knowledge with regard to energy systems contributions during real
    life might provide a greater effectiveness of training strategies to improve both
    health and athletic performance.


    Although this method provides many methodological advantages the use of some functional
    methods that may be unusual for some exercise physiologists. For example, in order
    to determine the VO$_2$ kinetics during exercise is necessary to fix the post-exercise
    kinetics using a bi- or mono-exponential model [8,9]. In addition, the area used
    to represent the AT$_{max}$ has been determined using a ramp protocol [14,17,8].
    In addition, the AT$_{max}$ and LT$_{max}$ can be determined using a single interactive
    spreadsheet computer program (e.g. Excel), the determination of


    AT$_{max}$ is substantially more complex because it is necessary to choose appropriate
    equations and first-estimated values for each parameter for those are not automatically
    provided. Given that computer capabilities have been improved over the last decades,
    an array of exercise software packages has assisted in these analyses. However,
    because available software packages are not and explicitly chosen for each exercise
    type they might be costly, time-consuming,requiring-error-prone in use. Unfortunately,
    the lack of direct available software methods for different exercise methods hinders
    the metabolic profile during exercise.


    Thus, the aim of the present study was to develop software with an easy-to-use
    interface to calculate the energy systems contribution and energy expenditure
    during exercise, using measurements of VO$_2$ and lactate accumulation. In addition,
    we described GDAE-Lab''s development system, advantages, limitations, and future
    directions for this software. A direct comparison with conventional commercial
    software and measurement of reliability of the GDAE-Lab across different physiologists
    were also provided


    # MATERIALS AND METHODS


    # Participants


    Eleven males of physical education (25.1 ± 6years; height 175.3 ± 8 cm; weight
    74.1 ± 6 kg), accustomed to exercise, volunteered to participate in this study.
    The participants had practiced national sports (soccer, cycling) for one year.
    The participants were free of neuromuscular and cardiovascular disorders and not
    taking any medications during the time of data collection. They received a verbal
    explanation of the potential benefits, risks, and informed consent before participating
    in the study. The study was conducted in accordance with the Helsinki Declaration
    of 1975, and was approved by the Ethics Committee for Human Studies of the University
    of Peruambuco (number 0394123)


    # Experimental design


    The participants visited the laboratory on three separate sessions: 1) a maximal
    incremental test to determine the ventilatory threshold and maximum oxygen uptake
    (VO,max); 2) a cycling workload-test at moderate demand (90% ventilatory threshold);
    3) a cycling workload-test at severe domain (110% VO,max). These workload-test
    were performed in a counterbalanced order. Each test was performed in different
    sessions, at least 48 hours apart.'
