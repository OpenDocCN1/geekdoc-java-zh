    created a "grid example" (for Figure 2). The grid consisted of a group of pixels
    centered on the pixel of interest (p). The size of the pixels and the spacing
    between them was grid size and spacing respectively. The grid size could be as
    small as 1 x 1 (a single pixel) or as large as 1000 x 1000 (the whole image).
    With the smallest size, the grid consisted of only the pixel of interest (p),
    but with larger grid sizes, neighboring pixels were included. We considered grids
