    # Triplet extraction.


    The aim of the triplet extraction is to find the triplets in the form of (subject,
    predicate, object). If the predicate is in active form, the subject is the part
    of the noun phrase (NP), and object is the part of the noun phrase (NP) after
    the predicate. The opposite holds for passive form. Triplet extraction is one
    method that labels the VP (or) triplet from the sentence with which the chunk
    was extracted and the article PubMed Center ID. Triplet extraction is performed
    using rules with the help of a manually developed components and reactions:


