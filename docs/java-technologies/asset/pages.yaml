    Code can be edited before or after it has been committed to a shared version repository.
    If it shows not have been done in order to code into the repository, they will
    not be done at all [27]. We recommend that people use pre-generate code reviews
    (ra).


    An extreme form of code review is pair programming, in which developers sit together
    writing code. One (the driver) writes the code, the other (the navigator) provides
    real-time feedback and is free to track issues and design concerns. Some found
    that pair programming improves productivity, but programmers find it intrusive.
    We recommend that teams use pair programming when bringing new someone up to speed.


    Once a team grows beyond a certain size, it becomes difficult to keep track of
    what needs to be reviewed, or who is doing what. Teams can avoid duplicated effort
    and dropped balls if they use an issue tracking tool (tk) to maintain a list of
    tasks to be performed and fixed [68]. This helps anticipated work and makes it
    easier to be transferred between people. Free hosting services like GitHub include
    tracking tools, and many good standalone tools exist as well as Trac (trace.org).


    Software Canary. This type of training has proven effective at adoption of these
    tools in scientific settings [17], [69].


    For computing to achieve the level of rigor that is expected throughout other
    parts of science, it is necessary to adopt the tools and approaches that are known
    to improve the quality of software and the efficiency with which it is produced.
    To facilitate this, universities and funding agencies need to support train the
    scientists in the use of these tools and the investment of time and money in building
    software infrastructure. Both approaches by institutions and will improve our
    confidence in the capabilities of computational science and will allow us to make
    progress on important scientific questions that would otherwise be possible.


