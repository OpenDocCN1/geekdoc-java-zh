    between research communities from science and biology [13].


    # Organization of this Paper


    After giving a introduction to the field of open source research software and
    stating the rationale behind the development of IQ, the remainder of this paper
    is organized as follows:


    +   - We review open source applications for image analysis and the intended use
    of this paper in the current section. Furthermore, a brief installation guide
    is provided Then the subsequent sections provide an overview of IQ''s key components,
    describe the functionality, and the system and function architecture. A state-of-the-art
    analysis is presented, demonstrating how users can benefit from the unique characteristics
    of image and signal analysis in a single portable open source tool.


    +   - CellProfiler: The cellprofiler.org: The CellProfiler framework (current
    version: 2.0, Python) has many applications in biology and focus on user-automated
    methods of photographs, to extract quantitative information from biological images
    [16-19]. Additionally, a free and open source software CellProfiler (version 2.0)
    is available for such exploration and analysis of large, high-dimensional data,
    with included machine learning techniques [20].


    We demonstrate how the IQ framework can be extended via plugins and how it integrates
    with open source processing and machine learning. The structure of plugins is
    explained using an example of an image plugin. Then we introduce the scripting
    interface of IQ and demonstrate its workflow. Finally we will discuss possible
    future developments of IQ and open source software tools.


    This paper is supported by the source code used in the experiment and example,
    as well as the syntax-highlighted version of the script. For further details on
    sections, we kindly refer the reader to the supporting information as well as
    the detailed user guide available from the project website http://sf.net/projects/iqm/files/3.2/IQ3.2_userguide.pdf.


    +   - OpenCV, endocr.org: The image analysis plugin (current version: 2.3.2, Java)
    can be used for image acquisition from light and fluorescence microscopy as well
    as for post-processing. Main features are the support of high-dimensional microscopy
    data and the ability for handling large datasets up to 100 gigabytes [22].'
