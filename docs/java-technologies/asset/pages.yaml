    # DISCUSSION


    ArchiLD is a powerful software for producing highly interpretable plots that can
    be used to tag SNPs in the context of association studies or to prioritize SNPs
    for functional studies. Its integration with the UCSC Genome Browser [9] makes
    it easy to overlay additional information about regulation, conservation strategies,
    phenotype and disease associations aiding users in the interpretation of their
    results.'
