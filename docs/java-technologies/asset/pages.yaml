  md: '# CHAPTER 6 SCRIPTINGRT: A SOFTWARE LIBRARY FOR COLLECTING RESPONSE LATENCIES
    IN ONLINE STUDIES OF COGNITION


    Thomas W. Schubert¹,2, Carla Murteira², Elizabeth C. Collins², Diniz Lopes²


    1 Department of Psychology, University of Oslo, Oslo, Norway,

    2 Centro de Investigac,a''o e Interenc,a''o Social, Instituto universit''rio de
    Lisboa (ISCTE-IUL), Lisbon, Portugal


    # ABSTRACT


    ScriptingRT is a new open source tool to collect response latencies in online
    studies of human cognition. ScriptingRT provides the building blocks of latency
    studies, which are then combined with generic Apache Flex programming. Six studies
    evaluate the performance of ScriptingRT empirically. Studies 1-3 use specialized
    hardware to measure variance of response time measurement and stimulus presentation
    timing. Studies 4–6 implement a Stroop paradigm and run it both online and in
    the laboratory, comparing ScriptingRT to other response software. Altogether,
    the studies show that Flash programs developed in ScriptingRT showed a small lag
    and an increased variance in response latencies. However, this did not significantly
    influence measured effects: We conclude that ScriptingRT can be used to test latency
    online experiments.


    # INTRODUCTION


    There are pervasive current trends in how to collect data in psychological studies:
    One is to take advantage of the Internet and collect data using various methods,
    especially online questionnaires. These offer easier access to diverse participant
    sampling, exception of hard-to-reach samples, and the addition of items to previous
    answers. The other long-standing trend is to use response latencies as indices
    of cognitive processing. Measures are utilized to examine individual differences
    between participants, and differences experienced by experimental manipulations
    [1]–[3].


    However, with a few notable exceptions, these two have not been merged: Only fraction
    of online research measures response latencies in trials that last a second or
    less. The reason is either of a technical nature, or other attempts to bridge
    the gulf demonstrate the still falling short in many ways. The projects that have
    bridged the gulf, however, show the great potential of online response latency
    collection.


    In the present work, we offer a fresh approach to the problem. We design, implement
    an approach to measuring response latencies online that is based on open source
    or free technology, namely Adobe Flex [4–6], concepts that are improved by the
    free response latency software DMIX [5]. The software that we developed is open
    source and modular, inviting contributions from other laboratories and researchers.


    Citation: Schubert WT, Murteira C, Collins EC, Lopes D (2013) ScriptingRT: A Software
    Library for Collecting Response Latencies in Online Studies of Cognition. PLoS
    ONE 8(6):e6769. doi:10.1371/journal.pone.06769'
