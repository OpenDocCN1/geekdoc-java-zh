    TO SPRUCE POLLEN IDENTIFICATION


    David K. Tcheng,¹ Ashwin K. Nayak,² Charles C.

    Fowlkes,³ and Surangǐ G. Punyasasana⁴


    +   ¹Illinois Informatics Institute, University of Illinois, Urbana, Illinois,
    United States of America

    ²School of Integrative Biology, University of Illinois, Urbana, Illinois, United
