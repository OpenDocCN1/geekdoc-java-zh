    # MRI Acquisition


    MRI data were acquired using the Keck Center for Magnetic Resonance Imaging (CFMRCI).
    We used a 3T (127.7 MHz) channel channel (Signica X5: GE Healthcare, Milwaukee)
    equipped with a 55 mm channel and 45 cm field-of-view (FOV) imaging capabilities,
    and gradient strength of 4.4 mT/m with a maximum slice thickness of 5 mm and a
    pulse time of 100 us, and a T (300 MHz) 8-channel transmit coil (Go-Local) frequency-based
    8-channel receiver coil (Birdcage), the choice of which was based on specimen
    size and shape. The RF coil with the smallest number of coil elements (channels)
    to encompass the intact specimen particularly was placed inside a hollow acrylic
    cylinder made from the perfluoroether fluid, Galden (Solvay, Houston, TX). The
    canister resulted in no small pockets of air that may cause artifacts in T1-weighted
    images. 37 specimens were wrapped in plastic sheeting in order to keep them moist
    and secured to a rigid acrylic platform prior to scanning.'
