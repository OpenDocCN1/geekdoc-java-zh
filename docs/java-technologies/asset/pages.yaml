    # # Methodology and Apparatus


    In this study we used the same approach as in previous studies. We installed three
    different operating systems in the computer above: 1) Windows 7 32-bit; 2) Ubuntu
    Linux 10.04 LTS “Linux 32-bit”; and 3) Apple Mac X 10.7. We chose these because
    they were the best versions of each system at the times the tests were conducted.
    We used two user-agents compatible with the three tested: Google Chrome and Mozilla
    Firefox. We used the latest version available when the test was conducted (Chrome
    17 and Mozilla Firefox 10).


    To prevent non-gradual black-white keyframe transitions, varying the duration
    of each keyframe with values 500, 100, 50, 30, 6, and 1 to 66 ms (i.e., we used
    200-200 pixel at the centre of the screen). In each case, we recorded 60-second
    sequences, but only 5000 frames were recorded for each interval (500, 100, 50,
    and 16.67ms), web technology (SVG, Canvas, WebGL), user-agent (Chrome, Mozilla
    Firefox) and operating system (Windows, Mac, X/Linux).


    We tested animations in HTML5 using CSS Animations and SVG with SVG, prepared
    animations were made with SVG, Canvas and WebGL. In all cases, we used the API
    for the Control of Procedural animations (i.e., requestAnimationFrame). These
    animations were tested in Chrome 17 and Mozilla Firefox 10 on Microsoft Windows
    7, Ubuntu Linux 10.04, and Apple Mac X 10.7. These user-agents were chosen because
    they were available for the three systems and they were compatible with the technologies
    mentioned so.


    We defined animations using two methods: the first run at 0ms (which indicates
    the first frame of the animation sequence) sets the background colour of the device
    to white, the next run (at keyframe) sets it back to black. The total duration
    of animation is the value of the tested interval. For a 100ms test, a duration
    of 200ms is defined, so that 50% of the total duration is given. Given that a
    1ms non-gradual transition from black to white was needed, we set the step function
    to linear. In the case of SVG with SVG, it was necessary to prepare two different
    versions for each user-agent, because Chrome 17 does not support cross-references
    in the definition of an animation''s onset. Because of this, we unrolled the animation
    loops for SVG in this test using user-agent specific scripts. SVG files do not
    follow the animation scripts


