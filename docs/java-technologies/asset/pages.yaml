    tool, we have developed a collection of web services that exposes the relevant
    functions of the tool. The services were implemented using the OpenARS framework
    [43] server. Currently, the web service document (WSDL) and its related XML schema
    define three data structures: create_dictionary, create_sentence, split_sentences,
