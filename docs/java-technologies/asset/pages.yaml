    # MATERIALS AND METHODS


    # Manual Model Topology Construction


    The literature inspected for the manual model construction was selected by the
    domain experts. We have focused on scientific papers related to the PSD field.
    Ideally, a citation in one or two scientific papers was required for the inclusion
    of information into the graph. If the information was available online, we checked
    the publication quality (e.g. high impact, author''s relevance in this field)
    before including it into the model. The information about biosynthetic pathways
    and other data was acquired from different databases as KEGG [18] and TAIR[41].
    KEGG was used as a backbone for building the metabolic pathways, the biosynthesis
    of hormones and the metabolites involved in this process. Additional reactions
    and genes involved were implemented according to the Aracycle database. TAIR provided
    gene information, and synonym names were acquired from iHOOP [42] and TAIR [41].


    # Principal Conversion of the PSD Topology to the Edge-Labeled Graph


    The triplet method for automatically extracting knowledge from the literature
    results in a graph of triplets (component, reaction, triplet) and our aim was
    to enhance the manually constructed PSD model topology with automatically extracted
    triplets to convert the manifold topology into the format. This is the edge-labeled
    graph format where nodes represent components and edges represent the reactions.
    This conversion was performed by decomposing the reaction of two components resulting
    in a joint point, into two relations, one for each component connected to the
    product.


