  md: '# 50 Java Technologies


    # DISCUSSION


    We have described software for the identification, analysis and visualisation
    of genes and individual samples in microarray data via a user-friendly GUI. This
    method implements a z-score based on the level of expression of individual samples,
    for a particular gene, from an normal distribution of control samples. This differs
    from the GTI method, which calculates a score for each gene related to the proportion
    of samples in a sample group that have gene expression. An advantage of ZODET
    software is the flexible implementation of a z-score based outlier method, which
    has been specified for individuals with limited bioinformatics expertise through
    a GUI.


    Since the GTI method was previously shown to compare to other outlier detection
    methods we benchmark the performance of ZODET to this method [4]. We found that
    ZODET performs similarly to the GTI when identifying up-regulated genes in a large
    simulated dataset containing different numbers of outliers and varying population.
    ZODET was also shown to perform with a very high accuracy and very low false positive
    rate when identifying genes and samples compared to regulated outliers.


    In addition other methods that use gene expression between groups could be used
    to identify genes that have biological relevance [14]–17. In general these approaches
    are more robust and direct change in expression, whereas outlier analysis methods,
    such as ZODET, identify an individual or small group subsets within the experimental
    environment.


    We have demonstrated the power of the method to detect genes of interest in a
    dataset from a cohort of many microarray datasets obtained from human subjects.
    In particular, some over- and under- genes identified by ZODET were shown to result
    from genetic mutations. A questionable result of the TGF-FGF28 translocation has
    not been reported. However, a previous report shows that the OAS1 single site
    mutation results in the loss of the OAS1 enzyme (p46) and generation of a dual-functional
    antiviral/antiapoptotic isoform (p68) and a normal isoform (p52) with no RNA motif
    (11). We have finally identified that this form of analysis could be of benefit
    in the study of certain hereditary diseases. This form of analysis can also provide
    disease-relevant findings, such as the identification of rTPM53 expression changes
    in prostate cancer.


    Of particular note was the advantage of ZODET to identify outlier genes that could
    significantly up- down regulated compared to the controls. ZODET is also capable
    of identifying an individual gene expression abnormality in one experimental subject,
    which may allow the identification of rare genetic events that have high disease
    prevalence. These properties provide an important


    addition to other used outlier detection methods, such as CPA and GTI, which concentrate
    on the identification of up-regulated or amplified genes in subgroups of patients.
    Each of those outlier detection methods has advantages and disadvantages and they
    could be effectively utilised in combination with each other, although we have
    not attempted to do so in this study.


