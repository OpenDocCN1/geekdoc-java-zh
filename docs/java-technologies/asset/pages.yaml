    # CONCLUSION


    We have outlined a series of recommended best practices for scientific computing
    based on extensive research, as our collective experience. These practices can
    be implemented individually or as work group; separately, they improve the productivity
    of scientific programming and the reliability of the code, and we produce results
    and confidence in them.


    In conclusion, we believe these practices are crucial for reproducible research;
    if software is not versioned, controlled, and tested, the chances of authors (much
    less anyone else) being able to create results are remote.


    Our 24 recommendations are beginning, not an end. Individuals and groups who have
    incorporated them into their work will lead to more adopted practices at Software
    Canary (software-carpentry.org).


    Research shows that the time of implementing these tools in scientific computing
    is immediately offset by the gains in the productivity of research [17]. So, we
    recommend that regardless may seem intimidating to implement, Fortunately, the
    reinforcement effort is less than the cost of adding each component separately.
    Nevertheless, we do not recommend implementing all of these recommendations at
    once, but suggest that these tools be implemented incrementally over a period
    of time.


