  md: '# ZODET: SOFTWARE FOR THE

    IDENTIFICATION,

    ANALYSIS AND

    VISUALISATION OF OUTLIER

    GENES IN MICROARRAY

    EXPRESSION DATA


    Roden DL¹, Sewell GW¹, Lobley A¹, Levine AP¹, Smith AM¹, Segal AW¹.


    ¹Division of Medicine, University College London, London, United Kingdom.


    # ABSTRACT


    # Summary


    Complex human diseases can show significant heterogeneity between patients with
    the same phenotypic disorder. Our outlier detection strategy was developed to
    identify variants at the level of gene transcription that are of potential biological
    and phenotypic importance. We describe a graphical software package (z-score outlier
    detection (ZODET)) that uses whole genome microarray data. Mean and standard deviation
    of gene expression in a healthy control cohort is used to detect both over- and
    under-expressed probes in individual test subjects. We compared the potential
    of ZODET to detect outliers in gene expression datasets with a previously described
    statistical method, gene tissue index (GTI), using a simulated dataset and a publicly
    available monocyte-derived microarray dataset. Together, these results support
    ZODET as a novel approach to identify outliers of potential pathogenic relevance
    in complex human diseases. The algorithm is implemented using R packages and Java.


    # INTRODUCTION


    Many human diseases, such as inflammatory bowel disease and type diabetes, are
    multifactorial disorders with genetic and environmental determinants. Substantial
    heterogeneity regards to causation and progression exists between individual patients
    with the same phenotypic disorder. It has postulated that rare or few genetic
    variants, structural rearrangements such as deletions, insertions, translocations,
    and epigenetic variation could be important


    the pathogenesis of these complex disorders and account for the observed heterogeneity
    [1]. All of these are incompletely addressed by genome wide association studies
    (GWAS). Many of these changes would be expected to be associated with alterations
    in gene expression possibly of large biological effect, ultimately giving rise
    to phenotypic abnormalities. Recent reported population-scale human sequence data
    with transcriptomic data and identification of rare variants associated with outlier
    gene expression. They found that across different developmental stages, an individual
    would be expected to have hundreds of rare variants with large effects on gene
    expression. The examination of significantly over-expressed genes in individual
    patients (or subgroups of patients) has successfully been employed in the field
    of cancer genomics [3]. There are


    Citation: Roden DL, Sewell GW, Lobley A, Levine AP, Smith AM, Segal AW (2014)
    ZODET: Software for the Identification, Analysis and Visualisation of Genes in
    Microarray Expression Data. PLoS ONE 9(3):e08113; doi:10.1371/journal.pone.008113'
