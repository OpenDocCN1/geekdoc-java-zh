  md: '# Java Technologies


    Yaeow et al. suggested that an A–RNA editing may provide an additional epigenetic
    mechanism to reverse cancer development and progression. In a recent report, Chen
    [5] found that an A–RNA editing of AZINI, at a non-synonymous substitution (ser367ly)
    of AZINI, is increased in hepatocellular carcinoma specimens. It is noted that
    the editing AZINR increases editing during progression, and potentially to advance
    hepatocellular carcinoma with recurrence and metastasis [5]. The edited form of
    AZINI has a stronger affinity to antiryme, and the result inhibit cell proliferation.
    Sharma [6] identified transcripts of hundreds of genes undergoing-specific C–U
    editing in response to hypoxia.


    The RNA event can be detected by site-specific RNA sequencing, comparison of genomic
    DNA with RNA [7], and (RNA-seq) [8, 9]. With the advent of next-generation sequencing,
    several hundred RNA sites have been identified by comparing DNA sequences from
    seven individuals [10]. Using RNA-seq data alone RNA sites can be identified with
    high confidence. However, there remain challenges in identifying true RNA editing
    sites that must be de-convoluted from their origins, as well as technical artifacts
    (e.g., sequencing or read-mapping errors) [12, 13].


    Several tools have been designed to detect high throughput RNA editing. Picardi
    and [14] provided a suite of scripts in RedTools to identify RNA editing using
    DNA sequencing data. Redtools requires a command line tool; it requires input
    in binary sequence (BAM) format, detects RNA editing candidates by pre-aligned
    RNA-seq and DNA sequencing reads, explores the RNA editing potential of RNA-experiments
    by looking at clusters, and performs the detection of RNA editing candidates using
    RNA data. Dizenzo et al. [15] used a web-based tool of ‘VIRGO’ to map A–G matches
    between genomic and experience sequence tags as A-candidate editing sites. The
    RDDchecker (https://github.com/joshsoftware/rdchecker/) is a Perl tool for predicting
    RNA-DNA differences that might be caused by post-translational editing of RNA.
    Short reads were analyzed to detect variant sites and a variety of filters, such
    as known SNPs. The program handles both RNA-seq and DNA sequencing data, however
    potential RNA editing sites cannot be identified in RNA-seq alone. RCARE [16]
    is a web-based tool for search, annotating, and visualizing RNA-DNA differences
    based on known knowledge of RNA-editing and provides evidence for improving the
    reliability of RDD sites. However, the RCARE cannot be used to identify potentially
    novel RNA editing sites. Zheng, Zhang and Xiao [17] presented a method (GIREM)
    by catalyzing the mutual information of the mismatched pairs in the RNA-seq to
    distinguish RNA editing sites and SNPs, and a generalized linear model (GML) was
    trained to enhance predictive power for identifying RNA-editing sites using RNA-seq
    data alone. However, a computational software


    (or tool) for the identification and visualization of RNA editing sites has to
    be relied.


    Here, we present a MySQL software ‘RED’ to detect and visualize potential RNA
    editing sites. Using RNA-seq alone (i.e., novo mode), or both RNA-seq and DNA
    sequencing data (i.e., DNA-RNA mode), RED can identify potential RNA editing sites
    using multiple rule-based and statistical filters. All potential RNA editing sites
    were shown at the genome level, and a given site was identified and validated.
    We evaluated the performance and utility of RED by analyzing two data sets: (1)
    C–U editing and whole-genome sequencing data in the liver tissue from a patient
    of hepatocellular carcinoma. The application is suitable to next-generation sequencing
    data related to the identification and visualization of RNA editing sites.


    # DESIGN AND IMPLEMENTATION


    The framework for the design and development of ‘RED’ is shown in Figure 1. Multiple
    rule-based and statistical filters [13] provide spurious RNA editing sites, and
    a graphical interface (GUI) to visualize RNA editing sites at the genome and site
    levels. RED editing identifies the de novo mode or the DNA-RNA mode if DNA data
    can be available. RED uses a non-GUI/command line interface.


    ![](img/a8d82052b482a3d31e63eb8a0b9a0c4c_23_0.png)


    Figure 1. A computational framework to design RED.


    If DNA-seq data is available, potential RNA-editing sites can be identified by
    DNA-RNA mode; otherwise by novo mode. Rule-based and statistical filters are integrated
    into the framework.'
