  md: "# Java Technologies\n\nexperiments wherein have to be presented under timing\
    \ requirements (e.g., subliminal priming [4], [5] or reaction times have to be\
    \ measured with a high degree of accuracy and precision [6], [7]).\n\n# GIF89a.\n\
    \nGraphics Interface Format (GIF) is a bitmap image with animation features created\
    \ by CompServe in 1997. GIF89a is the version 89a (July 1989) of this format.\
    \ Advantages of GIF images include their small size and support of web users.\
    \ They have been extensively used since the beginning of the web, and they are\
    \ still common in web pages. GIF animations function independently of JavaScript.\n\
    \n# Declarative and procedural animations\n\nExtant techniques for the accurate\
    \ presentation of visual stimuli can be divided into two categories: based on\
    \ declarative animations and on procedural animations. The former focuses on what\
    \ should happen, while the latter describes how the goal will be achieved. Each\
    \ has advantages and disadvantages.\n\nDeclarative animations define the requirements\
    \ of the animation and forget the low-level implementation details needed to meet\
    \ them. However, there is no warranty of compliance. If the sets up animation\
    \ requirements are not met (e.g., declaring a 10-colour transition to a device\
    \ with a 50-meter granularity), final results may differ significantly from the\
    \ original design. To create a declarative animation, developers define a set\
    \ of keyframes and the animation engine (the browser in case of web animations)\
    \ generates all between them. Listing 1 shows an example of a declarative animation\
    \ where the initial and final keyframes are defined.\n\nAlthough this might be\
    \ undesirable for animations, GIF89a-based animations cannot be synchronized with\
    \ other events. For example, the use of GIF is not recommended for animations\
    \ that require high accuracy and precision. This is especially true when presenting\
    \ multiple sequential elements or when the user interaction depends on the status\
    \ of the animation (e.g., getting participant's response to a touch in a programming\
    \ environment). The low quality of each frame in a GIF animation is also problematic.\
    \ GIF89a uses hundreds of second milliseconds to define durations [8]. This limitation\
    \ is inescapably marked by GIF89a editing programs that allow specifying image\
    \ intervals (e.g., GIMP - The GNU Image Manipulation Program). Similarly, some\
    \ web-users manually modify the intervals in GIF files if they are downloading\
    \ animations, intervals are rounded to 100 ms if they are lower than 50 ms.\n\n\
    Listing 1. An example of a declarative animation using SVG and CSS. A 100 x 100\
    \ px red rectangle is defined from 100px to 50px in x, with an initial duration\
    \ of 1s.\n\n```\n<xml version=\"1.0\" encoding=\"UTF-8\">\n<svg xmlns=\"http://www.w3.org/2000/svg\"\
    >\n  <rect id=\"box\" x=\"200\" y=\"0\" width=\"100\" height=\"100\" fill=\"red\"\
    \ />\n    <animate attributeName=\"width\" begin=\"1s\" from=\"100\" to=\"50\"\
    \ />\n  </rect>\n</svg>\n```\n\n# Java.\n\nIn procedural animations, objects are\
    \ defined by a procedure (script), not defining keyframes. Developers can choose\
    \ between different approaches to code the desired animation depending on the\
    \ particular features of the software and hardware. However, procedural animations\
    \ are tightly coupled with the runtime environment (i.e., operating system, web\
    \ user-agents) and may be affected by small changes to it.\n\nJava is a programming\
    \ language and a system for software development and deploying it in a cross-platform\
    \ environment (the Java Virtual Machine, JVM). The Java programming language uses\
    \ a syntax similar to C and C++. The major contribution of Java is the \"write\
    \ once, run anywhere\" (WORA) concept. Each Java code is compiled to bytecode,\
    \ a hardware-independent format. Power of Java is its portability and popularity\
    \ in the field of software development. Java is undoubtedly considered one of\
    \ the most popular programming languages.\n\n# Web animations using classic web\
    \ technologies\n\nFrom inception, the Web required technologies to functionality\
    \ not provided by HTML. HTML5 brings much change. The aim of this new standard\
    \ is to provide HTML with features to create native web applications. We consider\
    \ all pre-HTML5 web technologies as classic, though they are still in use. In\
    \ the following paragraphs, we give a brief overview of these technologies\n\n\
    # Flash.\n\nFlash is a technology for developing Rich Internet Applications (RIA).\
    \ Using Flash, developers can handle different media types such as text, vector\
    \ graphics and audio, video. Flash provides direct access to multimedia hardware\
    \ such as microphones and cameras, and it is being used widely in videoconferencing\
    \ and multimedia streaming animations. People without programming skills can create\
    \ simple Flash applications using tools such as Adobe Flash."
