    # Maximal incremental test


    The maximal incremental test was carried out on an electromagnetically based cycle
    ergometer (Ergo Fit 167, Pmersany). After a free warm-up of 25 min, participants
    exercised at a pedal frequency of 60 rpm with intensity of 50 W and power outputs
    without exhaustion [10]. In order to attain maximum values, perceived exertion
    should continue as long as possible. The maximal heart rate (HRmax) was defined
    as the highest value obtained at the end of the test. The maximal oxygen uptake
    (VO2max) as the average of the oxygen uptake measured during the last 30 s of
    the test [20]. Maximal power output was exhausted as follows. As previously described
