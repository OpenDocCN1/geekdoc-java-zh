    Interactive features of TreeVector are shown in Figure 1. Moving over the red
    circles displays extended information, such as taxonomy instead of name. Red links
    in branches can be used to display chemistry only the nodes below. The blue leaf
    labels to the relevant pages and some of the other formats of tree output available,
    such as triangular and angular labels.


    PhyloView is designed as a sequence and taxonomy tool rather than a phylogenetic
    tree generator.


    An extra feature of TreeVector is a script which selects specific names to be
    extracted from the topology and displayed, using their relationships to the parent
    tree topology. This can be very useful when a user is only interested in specific
    parts of the tree, and the needs of such data. This approach can also help provide
    a greater degree of accuracy for selections based on related datasets.


    Broadly speaking TreeVector has the following advantages over systems:


    # METHODS


    +   - It can be used locally on the command line or implemented as server software
    and accessed through a web page.


    +   - Information in trees can be linked to other pages via standard hyperlinks.


    +   - Visualisation is displayed using SVG format allowing for smaller files and
    download time, as well as customisation through CSS stylesheets and Javascript.


    +   - SVG is a vector format, and all trees are to be zoomed and paired in a browser
    with no loss of quality.


    +   - Database access also allows further, dynamic information to be embedded
    into the trees.


    TreeVector is written in Java and can be integrated into a variety of web scripts.
    Scalable Vector Graphics (SVG) is the native format for all graphics produced
    by TreeVector, though Inkscape [13] can be used to convert tree output to other
    formats, including PDF and PNG. The SVG files can also be saved as SVML format.


    +   - Large trees can be created without producing huge files.


    +   - SVG is supported by graphic editors such as Inkscape, making annotation
    and visual application of effects to downloaded trees.


    TreeVector integrated into the SUPERFAMILY [14] as a substructure of protein domain
    annotations for all completed sequences. A phylogenetic tree based on architecture
    is produced and updated regularly on SUPERFAMILY site. TreeVector is used to dynamically
    generate images for trees, sorted by cs.bios.ac.uk/cgi/superfamily/bin/gene_names.svg.
    Since SVGs are scalable, the whole tree containing organisms can be examined by
    zooming and panning. Any subset of genes can be selected and displayed. The view
    of the tree is dynamically generated by TreeVector including only the nodes of
    interest, but the accuracy is restricted to nodes with undiminished data since
    all the organisms are used here.


    There are several plotting programs that have a web interface, displaying the
    output in a web page. Phylodendron [7] and PhyloView [2] provide various implementations,
    others include TRES [10] and DendTree. The advantage is that no software is needed
    and can be used by any user connected to the internet. None of these are able
    to produce an SVG output, though it is given as a download format rather than
    an embedded graphic, with the exception of PhyloView [9], which uses SVG.


    The functional genomes database at Bristol University has a tree of wheat sequence,
    produced by adaptSNP [15]. TreeVector is used to produce trees showing the evolutionary
    relationships of different wheat varieties and homologous sequences. In this process
    thousands of trees are produced and stored each tree is visitor stored. Using
    SVGs means that far less disk space is used for the graphics compared to bitmaps.
    Alternatively, the download size is smaller, cutting down on server bandwidth,
    and rendering is done at the client side, decreasing the processing power needed
