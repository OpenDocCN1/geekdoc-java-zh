    # Computational Work


    Our goal in developing ARLO is to build a machine learning framework capable of
    high-order analysis of biological images. Because our approach is computationally
    intensive, we intend to leverage computing resources available through the US
    National Foundation''s Extreme Science and Engineering Discovery network (XDE).
    XDE supercomputers with high disk IO, some nodes could simultaneously process
    image data. We granted a 50,000 CPU hour startup allocation on the ''Lonesdale''
    cluster of their next generation supercomputer- ''Stampede''.


    We manually constructed 22 slides with kerat of black and white pollen to test
    system performance (Table 1). We excluded individual grains placed on slides using
    an eyelash affixed to probe. Six unique individuals (were not represented in the
    reference set) were used to construct the slides, with three individuals per species.
    The use of unique individuals allowed us to train the system to account for variability
    among individuals. We tested pollen from a single species or a single cone [21],
    and the use of multiple individuals allowed us to account for the greatest range
    of morphological variability. By this design, the performance of the system was
    measured, on identification of pollen from unseen individuals, creating a challenging
    recognition problem than we tested in previous optimization of machine learning
    to pollen ([i. t., 19]).


    ARLO analyzes slides hierarchically in two passes (Figure 1). During the first
    pass, it identifies important points in an image. We call this first pass ''pollen
    spotting'' because ARLO is efficient distinguishing pollen pixels from segmentation
    (of original image). In the second pass, ARLO classifies these pixels into one
    of the pre-defined classes supplied by the user. For this paper, ARLO classified
    these pixels as either black or white. Through process, ARLO optimizes its own
    control parameters, leaving classification strategy with the highest accuracy
    solution for the problem. The code for ARLO is available through SourceForge:
    https://sourceforge.net/projects/arlo/files/APPS/


