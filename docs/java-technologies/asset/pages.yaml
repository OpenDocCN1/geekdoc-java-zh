    in collecting reaction times in Web developed experiments should make sure they
    are using the most accurate technologies for the testing of stimuli.


    # LIMITATIONS OF PRESENT RESEARCH


    The current study has attempted to analyse all the possibilities offered by new
    web technologies to create and accurate animations. The huge amount of tests to
    carry out with rapid development of these technologies made difficult, if not
    impossible, to offer results and conclusions about the latest versions of these
    technologies. The competition among the main developers of users-agents (Google,
    Microsoft, Mozilla, Apple) has resulted in a plethora of updates, which are hard
    to keep current (e.g., Mozilla Firefox since last three years has published twenty-five
    new versions.


    Something similar is happening at a slower pace with operating systems which share
    release periods, e.g. Ubuntu Linux. The new release of browsers and operating
    systems will inevitably lag behind software. Research performed over the Internet
    delegates the software update to the participant in the experiment. For this,
    the results presented in this study are valid and useful not only for those who
    use technologies only in their labs, but also for research experiments.


    Ideally, someone would provide an open access database constantly updated with
    the precision and accuracy of web technologies used for online. Our contribution
    to this envisaged is already published in the Open Source Framework (OSF). Both
    the tests and results can be downloaded from our repository.


    Another issue has to do with the hardware in which the tests have been taken.
    In previous studies (see [18]), particularly the software was analysed using different
    hardware to assess the variability of results between systems. Taking into account
    the level of control that researchers have over the hardware used by the participants
    in their experiment, it is valuable to have data about the variability among hardware
    systems. Our study focused on whatever, undertaking an analysis of a wide range
    of technologies used, over an number of combinations of users-agents and operations.
    Studies such as those by Harris and Stewart [20] claim that to offer Internet
    researchers an insight into which technologies are most suitable for each type
    of experiment. However, other researchers will continue our work and analyse these
    technologies on different hardware equipment in order to collaboratively contribute
    to the public, open access database maintained in the previous approach.


    Even having constantly updated database information about the precision and accuracy
    of the web technologies, it is important to recall that following the recommendations
    of this study does not prevent researchers from conducting their tests in their
    experimental setups. The purpose of the analysis presented here is


    guide researchers which web technologies are appropriate for a given study. After
    selecting one of these technologies, it is the responsibility of researchers to
    verify the accuracy and precision of their technologies that present plentiful
    variations of hardware, software and connectivity that may occur among their participants.


