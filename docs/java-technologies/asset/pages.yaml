    \ AND OUTCOME\n\nIn this paper, we have presented IQM, a versatile and open source\
    \ software application. We have provided insight for image and signal analysis\
    \ and an overview of the most important user interface components. IQM can be\
    \ used as a tool for sophisticated image processing workflows without including\
    \ editing skills, which is a proof-of-principle. A comprehensive set of implementations\
    \ along the methods is demonstrated to integrate image and signal analysis, which\
    \ cannot be found in other free software packages. Another unique characteristic\
    \ of IQM is the on-demand virtual processing, where memory can be saved for actual\
    \ processing tasks, and can be annotated on multiple annotation layers using ROI\
