    # Scoring Function


    In this section we formally define a simple scoring function for the evaluation
    of a programming language as an appropriate FPL. This function helps in computing
    a quantitative score for each language, which satisfies each criterion of length
    of the language as an approach. Previously, Parker [5] proposed a method to compute
    quantitative suitability for an FPL. The criterion presented in this work has
    not been discussed with sufficient technical details of the environment, which
    can be used for evaluation and scoring purposes. Our proposed scoring function
    further considers the environmental features of the proposed framework, and assigns
    a language based on its conformance to the criterion each parameter. We map all
    qualitative measures for each considered to a quantitative score using criterion
    given in Table 20. The value of 1 is easy to intuitive, and 0 means no conformance
    to the criterion of a feature. In the same, the other mappings are also supported
    for criterion used for qualitative measures as the mapping of 0.66 represents
    supported, and similarly, the mapping of 0.33 represents partially supported,
    and 0 represents not supported. The technical term "High Level", and environmental
    parameter "Industry" are considered here, as they are frequently used terms in
    the literature. We have adjusted their quantitative values to bring the values
    by dividing all by the maximum for each sub-feature. In this way, we make the
    score of these features compatible with the rest of features.


    Consider a language $L$ for which we need to compute the suitability $L_S$, based
    on its characteristics. As mentioned above, the proposed framework categorizes
    the evaluation criterion into two categories: technical and environmental. While
    computing the score we have grouped all parameters in one block, we map the qualitative
    measure to quantitative score for each parameter, using Table 20. We define the
    score of a language $L$ as $L_S^L$.


    We can also discuss in the process that the evaluation of certain parameters,
    for example, "integrated environment", "contemporary features", etc. have different
    characteristics, which while mapping the qualitative measures onto the quantitative
    score, the result score of each parameter may become unbounded, as theoretically
    speaking, there may be any number of sub-features for each parameter. In order
    to restrict the score of each parameter in a closed interval, and to fulfill the
    aforementioned objective, we normalize the score by dividing the value by the
    maximum possible score for that parameter. As an example, the parameter "user
    IDE" is evaluated on the basis of 5 sub-features, and for each parameter we calculate
    a maximum score of 1, then it is divided by 5. This results in the scoring value
    for each parameter within the given interval.


    | Qualitative Measurement | Quantitative Score |

    |---|---|

    | Fully Supported (Fully) | 1 |

    | Mostly Supported (Mostly) | 0.66 |

    | Partially Supported (Partially) | 0.33 |

    | Not Supported (No) | 0 |


    Table 20 Mapping of the qualitative measure onto the quantitative score.


    In reality every user may have different priorities for each parameter. Therefore,
    we define a weight for each parameter which a user may assign to it to prioritize
    it. In an example, one may be interested in "user IDE" as the "orthogonality"
    of a language, in which the scoring function allows us to assign a higher weight
    to one parameter and to the other. By default, each parameter $i$ carries weight,
    i.e. $w_i=1$. The score for parameter $i$ is computed by multiplying the weight
    $w_i$ with the score $L_{S,i}^L$ for the language $L$. In order to compute the
    overall suitability $L_S^L$ for a language $L$, we define a simple score aggregation
    function. This function sums the score of a language against every parameter,
    and the final score is computed as follows:'
