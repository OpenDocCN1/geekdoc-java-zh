    # CONCLUSION AND FUTURE DIRECTIONS


    In this article we have proposed a comprehensive framework for the evaluation
    of a programming language FPL. This framework mainly consists of two categories
    of features, namely technical and environmental features. The technique deals
    with the language aspects, the environmental features discuss the external factors.
    We have defined each feature and its corresponding sub-scoring features, and furthermore,
    we have presented a scoring function to quantify the quality of an FPL. In addition
    to this, using this language and scoring function, we have computed the scoring
    scores for widely used FPLs. We have also used different parameters settings for
    setting the scoring criteria to allow users to customize the weight of different
    features, which reflects the flexibility of our proposed scoring function. This
    function not only helps in the evaluation of a language as an FPL, but can also
    be used as a guideline for designing new FPLs.


    *Xing Wei*'
