    # Analytical strategy


    Jostmann & Keele (2003) found the Stroop effect, the difference between congruent
    and incongruent responses. We decided to focus our analyses on the combined effect
    of facilitation and facilitation effect (the component of congruent and incongruent
    trials) because we assumed no interference between stimuli. In our experiment,
    facilitation effects were much smaller and not significant, while interference
    effect was significant. The difference between congruent and incongruent trials
    was significant, and we found no evidence of variance, and we thus dropped it
    from our reports for effect (analyses test results and color factors can be confirmed
    by the authors).


    We report the effect of each statistical test, the 95% confidence interval for
    the difference, and an effect size. The significance tests and confidence intervals
    were computed by submitting the data to a model (also known as mixed-effects model).
    We assumed that individual response latencies are those of individual stimuli,
    instead of aggregating them to create scores, which is traditional practice. Mixed
    models have recently become recommended over others for being more conservative,
    and because of enhanced modeling options [28], [29]. However, effect size estimation
    is difficult in mixed models. For this reason, after reporting the effect size
    estimated from the model, we reported the effect sizes in the main report here.


    ScriptRT produced a constant delay of 24 ms in its presentation. This delay was
    independent of the programmed presentation duration. Likewise, there was a standard
    deviation of 11 ms that did not depend on the programmed program and the standalone
    player did not have this.


