    # Experiment: Reconstructing Species


    The goal of our first experiment was to predict pollen species of the slides given
    during the training (reference slides). This training was accomplished on pollen
    material from individuals that were not represented in the testing set. Given
    the potential morphological variation in pollen from different individuals and
    samples due to biological and seasonal variability [21, 23–29] made the training
    process more challenging than most previously reported machine pollen experiments.


    # Species: Algorithm.


    In order to learn from the training examples, the pollen species classifier had
    to determine which profiles in the training set were the most effective at discriminating
    between pollen species. To accomplish this, we randomly selected one from each
    training set and evaluated. This selected profile could be thought of as a "rule"
    that can be used to classify other profiles by how close they are to the "near-rule".
    For example, the Manhattan distance between each pollen profile and the rule was
    calculated. The profiles were selected if the distance was less than a threshold
    (known as the "near-far" threshold, optimization defined below) were considered
    "near-far" profiles, and the profiles that were further considered to be "far".
    The prediction made by the rule is simply based on training examples for each
    species that fell in near or far.


    # Species: Training example


    Using instead of grids to train our classifier as we did in pollen spotting, we
    used lines of pixels. In our previous work, we found that a simplified version
    of these was the most effective between two species [3]. Our approach was based
    on a single type of feature, which we called a "profile". A profile was a line
    of pixels that satisfied two constraints: (1) it had been identified as all pollen
    pixels by our species classifier and (2) it had been identified as information
    content greater than a given threshold. We defined information content as:


    ```

    IC = \sum_{i=1}^{n} |x_i - x_{i-1}|

    ```


    where n = number of pixels in a profile and x = intensity value of pixel at position
    i. This metric correlates well with the areas that are in focus or high contrast.
    The rationale was to focus the machine''s attention on the regions regions of
    interest. If the information content of a profile was greater than or equal to
    a threshold of 0.5 intensity units per profile, the profile was considered high
    contrast (or focus). These selected profiles were used as training examples for
    classification.


    For the experiments reported we used a line of pixels. To reduce computational
    complexity and algorithm time, we did the following: (1) only the red color band
    of each was used (not all RGB colors), (2) only vertical lines were considered
    (not orientations), and (3) only every 5th z-plane was used for training and testing.
    With a z-plane selected, the orientation was fixed. In our previous work, we used
    vertical, horizontal and diagonal lines both forwards and backwards [3]. The pixel
    layout in memory, it was most efficient to read vertical pixel lines. Limiting
    the analysis to only these z-planes would have yielded even higher system accuracy
    if all color bands, line orientations, and z-planes were analyzed, but we were
    limited by CPU time. Training examples were generated only from the 12 training
    slides. The generated 205,407,234 training examples using this method


    # Species: optimization.


    Model accuracy depended on several parameters that we varied to maximize. They
    included the following: (1) pixel length, (2) "info-content" (3) "near-far" threshold,
    and (4) number of profiles used to make the decision.


    Pixel length was optimized by starting with a length of 1, and increasing by 2
    until the highest accuracy was found. The "info-content" of a pixel line was measured
    by measuring the absolute value of the values between differences adjacent pixel
    intensity values. The "info-content" was qualitatively determined by dividing
    the line length with different thresholds. The optimized "info-content" was compared
    to all images prior to example generation, only the in-regions of pollen grains
    were used. The "near-far" threshold was optimized for each learner, searching
    for the threshold between 1 and the largest possible distance between profiles.
    If the pixel line length was 2, the maximum distance between two pixels was 510
    intensity units (twice 255 in the 8-bit image format), the maximum possible distance
    between two pixels was 32,640 intensity units. To determine the optimal number
    of profiles to'
