    # BioGraph Methodology and Implementation


    Manual construction of the PD topology is a time-consuming process, since a limited
    amount of data was available in the biological database. A large body of literature
    was necessary in order to build a PD network structure to capture the most recent
    findings. The BioGraph methodology was developed with the purpose of automated
    information extraction from biological literature, aimed at constructing the manually
    developed PD topology.


