    # MATERIALS AND METHODS


    # Data, reading, and peak calling


    The raw data was collected from NCBI GEO sequences GSE44268 [18] and GSE11431
    [17]. Reads were mapped with Bowtie 0.1.2-3] against mouse genome m9. For the
    clustering, mapping data from the original paper were lifted to mm10 using liftOver
    from UCSC Genome Browser [25]. Peaks were called with MACS 1.4.2 [8]. The specific
    parameters used with Bowtie and MACS were as close to those used in the original
    papers as possible. The boxplots and the clustering were made with R.


