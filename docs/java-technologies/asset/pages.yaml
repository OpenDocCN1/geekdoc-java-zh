    # RESULTS AND DISCUSSION


    Manual analysis of synaptic proteins can take up to 10 minutes per image with
    a width of 5-15 microns per condition. For experiments involving multiple conditions,
    analysis of one sets may take several hours. Because of this, a more efficient
    analysis was desired. SynPal has been designed to handle the repetitive tasks
    and duties that accompanies manual quantification, while allowing the user to
    control which regions generate and what data is included.


    # Semi-automated Punct Detection


    A major reducing issue in efficiency in Image and MetaMorph was the need to count
    and trace puncta. Manual puncta counting is accomplished by locating distinct
    clusters of 4 or more adjacent puncta above the threshold. The threshold is adjusted
    to value to exclude background without losing as much fluorescent signal as possible.
    Image and MetaMorph found particle density as they could not be used to calculate
    density and could only apply to a single region of interest at a time. Additionally,
    the size and fluorescence of the puncta can be highly variable depending on the
    protein being analyzed and the quality of the antibodies used. For identification
    of puncta that are in close proximity as a large cluster when the threshold is
    low, artificially reducing the puncta density (Fig. 1). The particle detection
    algorithms in Image and MetaMorph often merge adjacent puncta into a single cluster,
    artificially inflating the puncta density. To correct for this, large puncta density
    values can be determined. The amount of time reexamination of large puncta increases
    the time needed to analyze images.


    ![](img/a8d82052b482a3d31e63eb8a0b9a0c4c_60_0.png)


    # Data Output


    In MetaMorph and Image, all of the data from measurements from a single image
    is in a spreadsheet style format. When analyzing neurons, there are multiple situations
    where this becomes inconvenient. The first is when data from different types of
    measurement must be used in a specific manner. For example, to quantify the puncta
    density from a neuron two types of measurement must be performed; the length of
    multiple dendritic segment and the number of puncta in the corresponding segment.
    In Image and MetaMorph, this is not easy


