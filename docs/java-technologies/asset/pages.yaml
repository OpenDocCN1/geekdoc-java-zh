    # Implementing a strategy re window selection


    In addition to controlling the mathematical required for LRE quantification [5],
    [7], devising a method for automated LRE window selection was essential for the
    general efficacy and reliability of the LRE. As described in Figure 8, the LRE
    window consists of the cycles that are included in the LRE analysis of a profile.
    The basic strategy was to select the first cycle of the LRE window (referred to
    as the “start cycle”), which defines the bottom of the LRE window, and to start
    with a default window of three cycles. The LRE window is expanded by adding cycles
    to the top of the LRE window, and until a cycle is encountered that exceeds a
    specified threshold based on conformity to the LRE model.


    ![](img/a8d82052b482a3d31e63eb8a0b9a0c4c_35_0.png)


    Figure 8 Defining the LRE window.'
