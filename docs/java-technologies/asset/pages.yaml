  md: '# Java Technologies


    Real-time qPCR has provided the foundation for the plethora of applications in
    basic research, biomedical diagnostics and pathogen detection [1], [2]. Nevertheless,
    the relative quantification of conventional qPCR methods are based on the potential
    of real-time qPCR from being realistic. The difficulty is of implementing absolute
    quantification, without the necessity of constructing target-specific standard
    curves [4]. This makes absolute quantification for large-scale applications far
    more feasible.


    under a GNU GPL, in addition to a website that provides supporting information
    (https://sites.google.com/site/MS Windows operating system has been tested using
    the Mac OS and Unix systems (and been confirmed to run on JRE 1.6 installed).


    # INTRODUCTION


    Originating from the analysis of sinusoidal materials to model qPCR amplification,
    linear regression of expression (LRE) provides an alternative to real-time qPCR,
    in which absolute quantification can be conducted without standard curves [5],
    [6]. In addition to enabling large-scale absolute quantification, LRE proves compatible
    with complex samples; extensive testing has demonstrated the ability to achieve
    accuracies of ~15-30%, even down to a single molecule.


    Despite the capabilities of LRE, attempts to perform manual data analysis using
    JS Expert can quickly become untenable. This turn to developing software for automated
    applications, which led to the production of a small Java program that LRE quantification
    [5]. Unfortunately, my program was limited to one amplification profile at a time,
    and provided no ability to store data. Taking advantage of the resources that
    are available made it possible to extend this small program into a fully featured
    application. The LRE Analyzer, this program provides the automated data analysis
    and database capabilities for implementing large-scale qPCR applications.


    The LRE Analyzer can be installed by downloading the files provided at the open
    source project website (http://code.google.com/lrepr), which also includes demonstration
    files.


    # cdna quantification


    RNA extraction and transcription were conducted as previously described [5], [7].
    Data presented in the demonstration databases were generated using an Applied
    TaqMan in a 7500 instrument (ramping). QPCR in 200 nl reaction volume performed
    on 96 well plates (Agilent with MicroAmp film (Applied Systems), and amplified
    by a cycling regime of 15 min at 95°C, followed by 50 cycles of 95°C - 65°C -
    12 min extension. Limitation durations were conducted as previously described
    [5], [7].


    # RESULTS


    The LRE Analyzer stores data in three independent databases, maintained with distinct
    extensions: *exp*, *cal, and *amp* representative. An importance of *exp over
    conventional qPCR methods is construction of an amplification profile from their
    replicate profile (i.e technical replicates generated by averaging over each cycle,
    the fluorescence readings can greatly increase the precision of the fluorescence
    readings, which is essential for some instruments). Note that average profiles
    are automatically constructed during data import and are presented in the report.
    However, an important qualification is that the replicate profiles may not fall
    below 10 molecules per reaction, due to the effect of Poisson distribution [7].
    In such situations, target quantification must be determined by averaging the
    quantities produced by each individual profile.


    # METHODS


    # Implementation


    The LRE Analyzer was written in Java using the NetBeans IDE (http://netbeans.org),
    utilizing the modular architecture and windowing system provided by the NetBeans
    Platform. The database object (http://db4.com) is used for data storage and Excel
    (http://excel.toolsource.org). The program source code and installation files
    have been published as an open project at Google Code (http://code.google.com/lrepr)


    ![](img/a8d82052b482a3d31e63eb8a0b9a0c4c_31_0.png)


    Figure 1. The LRE Analyzer databases.'
