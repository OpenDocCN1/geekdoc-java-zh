    # Conclusions and Future Work


    With the DFL database, we are able to efficiently present complex 3D data for
    a vast array of specimens over the internet, thereby increasing the accessibility
    of anatomical data from museum specimens to a broad audience. Three-dimensional
    virtual digital imaging offers great potential for museum collections and research.
    It facilitates comparative analysis of digital data that can be explored with
    a wide variety of sophisticated methods for morphological analysis, visualization,
    and re-analyzed when newer methods are developed. These benefits come at the cost
    of increasingly sophisticated and (expensive) methods that often require specialized
    staff, specimen preparation methods to enhance contrast while mitigating imaging
    artifacts, extremely complex data that require advanced computational methods
    for visualization and analysis, data storage, and retrieval. At present, the DFL
    project utilizes a wide range of sophisticated visualization and analysis in collaboration
    with others. We, implementing these for efficient-line use is significantly more
    complicated than implementing them on the users’ cost hardware, tools which will
    be of every need. We emphasize, that we have developed a functional infrastructure
    in which visualization and analysis are directly linked and accessible via the
    web. This infrastructure will further future transformations. Importantly, we
    view archival, dissection, visualization and computational issues as-interrelated
    and have developed their implementation in concept. In this paper we have described
    our effort to accomplish this within the context of a single imaging method (MRI)
    for a specific group of organisms (fish) from a single scientific collection (MVC).
