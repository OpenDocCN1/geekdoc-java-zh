  \ 8` 时，如果 `8 > 1`，则 `i = i-1 = 10-1 = 7`（注：此处原文有笔误，应为 8-1）。\n- ...\n- 在第 9 次迭代，当\
  \ `i = 2` 时，如果 `10 > 1`，则 `i = i-1 = 10-1 = 9`（注：此处原文有笔误）。\n- 第 10 次迭代，当 `i = 10`\
