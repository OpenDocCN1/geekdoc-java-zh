  \ 类型可以取两个可能的值：`true` 或 `false`。默认值为 `false`。该数据类型用于跟踪条件。在 Java 中，`boolean` 是字面量\
  \ `true` 或 `false`，占用 1 字节。`boolean` 类型的变量可以赋值为一个或评估为 `true` 或 `false` 的表达式。我们不应该将\
  \ `true` 或 `false` 作为变量名。与 C 和 C++ 不同，Java 中的 `boolean` 数据类型并不意味着 `true` 是 1 而 `false`\
  \ 是 0。图 3.6 突出了 `boolean` 数据类型的关键点。`boolean` 数据类型允许算术运算。\n\n### 下面是一些有效的布尔（boolean）表示...\n\
