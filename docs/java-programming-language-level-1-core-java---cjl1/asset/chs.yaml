  \ / 1F ; // float 之间可以进行除法等算术运算\nFloat fe5 = 1.2f / 1.0f ; // float 之间可以进行除法等算术运算\n\
  float fe6 = 9 - 8 ; // float 之间可以进行减法等算术运算\nfloat fe7 = 9f + 8f ; // float 之间可以进行加法等算术运算\n\
