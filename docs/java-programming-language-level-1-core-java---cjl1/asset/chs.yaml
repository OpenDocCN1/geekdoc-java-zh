  \ 被声明并包含了右侧三元运算的结果。在右侧，`num > 0` 为假，因此赋值 `else` 部分 `\"Negative\"`。因此，输出为 `-8 is\
  \ a Negative Number`。\n\n\n\n\n在 RHS（右值）中，`num` 是一个负数，使得第一个条件不成立，第二个条件将把值存储在变量 `postiveOrNegative`\
