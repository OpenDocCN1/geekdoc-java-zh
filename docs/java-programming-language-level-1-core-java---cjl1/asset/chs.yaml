  Float fe9 = (-12F)\n%\n(-5f) ; // 语句可以单独一行\nfe10 = (\n-\n12F\n)\n%\n(\n-\n5F\n)\
  \ ; // 语句的每个部分都可以单独一行\n```\n\n### 以下是部分无效的 float 实表达式...\n\n```java\nfloat five1\
