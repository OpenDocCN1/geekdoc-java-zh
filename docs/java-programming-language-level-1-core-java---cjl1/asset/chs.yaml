  ◆◆◆\n\n# 5. Java 第一个程序\n\n在本章中，我们将编写第一个程序。请程序结构及其各种语法、不同的程序场景、输出程序以及基于场景的程序。\n\n\
  ### 1) 程序结构：\n\nJava 程序是计算机用于执行特定功能或任务的指令和语句集合。\n\n在第 1 章中，我们理解了程序、编程语言和编程的含义。\n\
  \n程序由结构组成。不同的元素构成了程序的结构。\n\n包 (Packages)、类 (classes)、方法和语句构成了 Java 程序的结构。\n\n一个程序可以包含任意数量的包、类、方法和语句。目前，重点关注理解程序结构。我们将在本章稍些时候详细学习所有这些元素。\n\
  \n图 5.1 显示了由不同包组成的 Java 程序的结构。\n\n在这里，一个 Java 程序包含两个包：`Package1` 和 `Package2`。\n\
