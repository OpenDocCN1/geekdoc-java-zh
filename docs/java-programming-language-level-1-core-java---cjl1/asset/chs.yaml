  在此程序中，`main()` 方法内部使用了 `do-while` 循环，声明了一个类型为 `int` 的变量 `table` 并将其初始化为 `7`。为了控制\
  \ `do-while` 循环的迭代，声明了一个类型为 `int` 的变量 `i` 并将其初始化为 `1`。声明了一个类型为 `int` 的变量 `multiplication`\
  \ 来存储第 7 表的结果。\n\n在 `do-while` 循环中，第一次迭代始终会在没有任何验证的情况下执行，以便 `multiplication` 值将得到更新。在每次迭代中，变量\
  \ `multiplication` 将根据 `i` 的值保持更新并存储更新后的结果，`sysout` 语句将打印从 1 到 10 的 7 表的 `multiplication`\
  \ 值。\n\n在这里情况下，由于 `i` 的最大值可以是 `10`，因此总迭代次数将仅为 `10` 次。为了更清晰地了解循环的工作原理，让我们理解下面的迭代场景：\n\
