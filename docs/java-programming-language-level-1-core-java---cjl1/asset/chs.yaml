  five7 = 14F + (8f) ; Error: Float should not be used alone\n```\n\n#### b) double\n\
  \n`double` 数据类型的范围从 `4.9E-324` 到 `1.7976931348623157E308`。\n\n它的最小值为 `4.9E-324`。\n\
  \n它的最大值为 `1.7976931348623157E308`。\n\n`double` 占据的字节数为 8 字节。\n\n`double` 的默认值为 `0.0`\
  \ 或 `0.0d` 或 `0.0D`。\n\n`double` 数据类型通常用于像 `float` 这样的小数值。\n\n不带小数点的数字默认被处理为 `double`。\n\
  \n`double` 和 `Double` 都可以用于表示 `double` 数据类型。\n\n`double` 类型可以表示不带后缀 `d` 或 `D` 的小数值。\n\
  \n如果我们希望将其视为 `float`，则需要在末尾添加后缀 `F` 或 `f` 以使其成为 `float`。\n\n图 3.4 也强调了 `double`\
  \ 数据类型的关键要点。\n\n以下是声明 Java `double` 整数类型表示的最简单语法……\n\n```java\ndouble variable_name\
  \ = value;\ndouble variable_name = valued;\ndouble variable_name = valueD;\nDouble\
  \ variable_name = valued;\nDouble variable_name = valueD;\n```\n\n在赋值过程中，被赋值的 `double`\
  \ 值不应超过变量的范围。\n\n以下是部分有效的 `double` 实数类型表示……\n\n```java\ndouble d1 = 8.2 ; // double\
  \ 可以用于表示不带后缀 d 的 double 类型，且在范围内\ndouble d2 = 9.0 ; // double 可以用于表示不带后缀 d 的 double\
  \ 类型，且在范围内\ndouble d3 = 9.5f ; // double 也可以用于表示后缀 f 的 float 类型，但应在范围内\nDouble d4\
  \ = 1.2 ; // Double 可以在不带任何后缀的情况下代替 double 使用\ndouble d5 = 12345789.201245789 ;\
  \ // double 可以用于表示不带后缀 d 的 double 类型，且在范围内\nDouble d6 = 12345789.2d ; // Double\
  \ 可表示带有后缀 d 的 double 类型\nDouble d7 = 12345789.2D ; // Double 可表示带有后缀 D 的 double\
  \ 类型\ndouble d8 = 8 ; // double 可以表示不带任何小数的 double\n```\n\n更多 `double` 实数类型的表示……\n\
  \n```java\ndouble d9 = 12345789.201245789 ; // 语句可以单独成行\nDouble d10 = 12345789.2D\
  \ ; // 语句可以单独成行\n```\n\n以下是部分无效的 `double` 实数类型表示……\n\n```java\nDouble div1 = 12345789.2\
  \ D ; // 整数和后缀之间不允许空格\ndouble div2 = 12345789.2 d ; // 整数和后缀之间不允许空格\n```\n\n更多无效的\
