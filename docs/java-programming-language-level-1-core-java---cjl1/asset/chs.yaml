  \ {\n    public static void main(String[] args) {\n        int num = 8 ;\n     \
  \   String evenOrOdd = (num % 2 == 0) ? \"Even\" : \"Odd\";\n        System.out.println(num\
  \ + \" is \" + evenOrOdd);\n    }\n}\n```\n输出:\n8 is Even\n\n解释：\n在这个程序中，变量 `num`\
  \ 定义为 `int` 并初始化为 8。问题是检查数字是否为偶数。变量 `evenOrOdd` 被声明并包含了右侧三元运算的结果。在右侧，`num % 2 ==\
  \ 0` 为真，因此赋值为 `\"Even\"`。因此，输出为 `8 is Even`。\n\n### 2) 编写一个 Java 程序来检查数字是正数还是负数。\n\
  \n```java\npublic class PositiveNegativeNumberProgram_2 {\n    public static void\
