  \    System.out.println(num + \" is either divisible by 3 and an \" + \"odd number\
  \ or consists of 4-Digit\");\n        }\n        else\n        {\n            System.out.println(num\
  \ + \" is neither divisible by 3 and an \" + \"odd number nor consists of 4-Digit\"\
  );\n        }\n    }\n}\n```\n\n**输出：**\n`999` is either divisible by 3 and an odd\
  \ number or consists of 4-Digit\n\n**解释：**\n在这个程序中，声明了一个类型为 `int` 的变量 `num` 并初始化为\
  \ `999`。题目要求检查一个数字是否能被 3 整除且为奇数，或者是一个 4 位数。在 `if` 检查中，有不同的条件。第一个括号将被验证，因为 `num`\
  \ 为 `999`，对 `3` 取模等于 `0` 且对 `2` 取模不等于 `0`，所以这里条件为真。在第二个括号中中，`num = 999` 并不是 4 位数，因此该条件为假。然而，由于使用了\
  \ `OR` 运算符，只要任意一个条件为真，就会执行 `if` 块。`else` 块将被跳过，`if` 块的 `sysout` 语句将打印 `num` 的值和消息。因此，输出为\
  \ `999` 能被 3 整除且为奇数或者是 4 位数。\n\n## 3) 编写一个 Java 程序，检查一个字母是元音还是辅音。考虑 `char` 为 `'S'`。\n\
