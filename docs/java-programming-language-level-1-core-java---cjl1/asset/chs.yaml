- "# Java 语言编程，入门 级（核心 Java - CJL1）\n\n\n\n![](img/image_rsrc2XA5.jpg)\n\n\n![](img/image_rsrc2XA6.jpg)\n\
  \n\n![](img/image_rsrc2XA7.jpg)\n\n# 献辞\n![](img/image_rsrc2XA8.jpg)\n\n# 前言\n本书的目的不仅是教授\
  \ Java 编程，更是赋予学生一种可以开启新机会的技能。通过尽早开始，学生可以加速成长，成为能力且独立的学习者，探索传统教育领域之外的世界。\n\n本书的编写具有针对性，考虑到\
  \ 11 到 17 岁的学生应该能够非常容易地理解 Java 编程的基础。为了做到这一点，从第一级开始复习了相关概念，因此学生应该关注基础概念并将它们实现为程序。\n\
  \n学生甚至可以在移动设备上尝试程序，每个示例都已涵盖，并且可以在移动设备上运行，因为他们许多人可能没有钱买电脑或笔记本电脑。因此，他们没有理由不尝试编程了。\n\
  \n每个概念和示例都以节奏适中的速度进行解释，留出了足够的理解时间，并提供了解释以便他们能够独立理解。然而，如果个人在任何概念上需要帮助，可以提交他们的问题寻求协助。\n\
  \n# 致谢\n本书独特地关注早期编程语言学习，旨在激发并培养学生对计算机学习和工程的兴趣。对于那些热衷于技能发展计划的人来说，这是一本理想的资源。本书的灵感来自许多孩子，包括\
  \ Gungun、Nidhi、Srishty、Mithi、Golu 和 Om，他们表达了学习 Java 的渴望但缺乏易获取的资源。他们的宝贵投入帮助了内容的形成，确保它解决了常见的学习差距并促进了对每个概念的全面理解。\n\
  \n我的编程语言之旅始于 Yashavant Kanetkar 先生那些富有见地的书籍。他的著作为我理解基础概念奠定了基础，对此，我深表感谢。他的影响对塑造这本书起了关键性作用，我努力通过使用简单的语言、提供分步骤说明以及包含大量的示例和练习，使即使是\
  \ 6 年级学生也能读懂。\n\n我想起了我的家人，特别是我的母亲、父亲和姐姐，他们提供了一个环境让我专注于我的工作。他们对我能力的坚定支持和相信一直我不断的灵感源泉，激励我创建一种资源，在他们的学习旅程中赋能并激励他人。\n\
  \n\n# 1. 引言\n要学习编程，我们必须首先理解基础术语，以便为成为优秀的程序员建立更好的概念基础。在引言部分，我只关注与计算机及其语言相关的那些基础术语。随着我们逐章通过章节，每个概念将变得更加清晰。\n\
  \n1) **语言**：用于相互交流的词或表达式被称为`语言`。`语言` 可以是口语的也可以是非口语的。在日常生活中，我们经常以这两种方式说话或表达自己。如果我们想说什么，我们会选择我们熟悉的任何语言，无论是英语、印地语还是任何其他语言。如果我们口头传达任何信息，那就属于`口语语言`，有时我们想通过提供方向、信号或书面手册来传达消息。这类语言是我们在不说话或说任何事情的情况下表达自己，属于`非口语语言`。\n\
  \n现在，消息可以是任何传递的东西。同样，有计算机理解的语言形式被称为`编程语言`。`编程语言`是计算机理解的一种语言。我们稍后将看到更多语言。\n\n# 2.\
  \ 对象\n任何具有状态和属性的东西都称为`对象`。每个对象都有身份、行为和状态。像`铅笔`、`吉他`、`书籍`和`汽车`都是图 1 所示的`对象`示例。\n\n\
  ![](img/image_rsrc2XA9.jpg)\n\n其他`对象`示例还有`手表`、`笔记本电脑`、`电脑`、`手机`等。对象占据空间，像汽车或书籍具有状态，如重量、颜色和大小，如图\
  \ 2 所示。\n\n![](img/image_rsrc2AC.jpg)(image_rsrc2AB.jpg)\n\n# 3. 指令\n`指令`规定了如何执行特定任务。`指令`用于通信，以便任何特定任务被执行或完成。在现实生活中，父母指导我们在吃饭前洗手；同样，通过指令指导计算机执行特定任务。\n\
  \n# 4. 语句\n在 Java 中，每个`语句`都是告诉计算机要做什么的指令。我们通过以计算机理解的形式传递多个语句来指导计算机。以下是`语句`的示例：\n\
  \n```java\nint sum = 3 + 4;\nint div = 5 / 4;\n```\n\n# 5. 程序\n`程序`是计算机用于执行特定功能或任务的指令和语句。我们将看到从第\
  \ 5 章开始的许多程序`。\n\n# 6. 编程语言\n`编程语言`是计算机理解以执行特定任务的程序。有不同类型的`编程语言`如下所示：\n\n- Java\n\
  - C\n- C++\n- Python\n- Ruby\n\n在图 1.3 中，根据受欢迎程度显示了几种语言。\n\n![](img/image_rsrc2XAD.jpg)\n\
  \n# 7. 编程\n编写计算机程序的过程活动被称为`编程`，如图 1.4 所示。\n\n![](img/image_rsrc2XAE.jpg)\n\n# 8.\
  \ 程序员\n`程序员`是理解并编写`程序`的人。任何知道如何编写`程序`的人都是`程序员`，如图 1.5 所示。\n\n![](img/image_rsrc2XAE.jpg)\n\
  \n# 9. 代码\n`代码`是`编程`的每一部分。我们写的每个语句都采取`代码`的形式。\n\n\n\n\n## 10) 编码 (Coding)\n编写代码的行为。编码涉及将自然语言翻译成计算机脚本，使得开始编码变得更加简单快捷。\n\
  \n编码（Coding）与编程（Programming）之间的区别如图 1.6 所示。\n\n![](img/image_rsrc2XAF.jpg)\n\n##\
  \ 11) 编码员 (Coder)\n编写代码和进行编码的人被称为编码员。\n\n## 12) 计算机语言 (Computer Language)\n计算机语言是我们与计算机通信的语言。这些是人类使用的所有通信形式，计算机通过语言理解它们。\n\
  \n![](img/image_rsrc2XAG.jpg)\n\n计算机语言有不同的类型，如图 1.7 所示。\n\n![](img/image_rsrc2XAH.jpg)\n\
  \n### a) 过程化编程语言\n过程化语言是由函数、指令和语句组成的计算机编程语言，它们规定了计算机解决问题所采取的步骤。计算机过程化语言示例有 `C`、`JAVA`、`BASIC`等。我们将在第\
  \ 5 章学习函数。\n\n### b) 函数式编程语言\n在计算机科学中，函数式编程是一种编程范式，通过应用和组合函数来构建程序。\n\n函数式编程语言的示例有\
  \ `Java`、`Python`、`JavaScript`等。\n\n### c) 脚本编程语言\n脚本语言广泛应用于应用程序。\n\n脚本编程语言的示例有\
  \ `bash`、`Ruby`、`Node js`、`Python` 和 `Perl`。\n\n### d) 逻辑编程语言\n逻辑编程是一种基于逻辑的编程范式。这意味着逻辑编程语言具有遵循逻辑以表达事实和规则的句子。\n\
  \n逻辑编程语言的示例是 `Prolog`。\n\n### e) 面向对象编程语言\n这种语言非常著名且应用广泛，因为它能够清晰地表示现实世界的对象及其问题。\n\
  \n它基于对象的概念，对象可以包含数据和代码。它被称为 OOPs，因为它们是围绕对象的概念构建的。`Java` 就是一种面向对象编程语言。\n\n我们将在第 2\
  \ 级（即中级课程）学习更多关于面向对象编程语言的知识。\n\n## 13) 表达式 (Expressions)\n表达式常量、变量和运算符的有效组合。表达式通过为变量赋值来执行\
  \ Java 程序的工作，并帮助控制程序的执行流。我们将在第 2 章更详细地查看常量、变量和运算符。\n\n以下是表达式的示例...\n\n```\n1/2\n\
  6 % 3\npi + (10 * 2)\n```\n\n## 14) 应用程序 (Applications)\n由于软件是一组程序，应用程序（也称为应用程序或软件）可能是为了满足任何特定需求而构建的一个特定程序或程序组。应用程序也被称为\
  \ `App` 或 `Apps`。\n\n图 1.8 显示了不同类型的应用程序。\n\n![](img/image_rsrc2XAJ.jpg)\n\n其他一些示例如下\
  \ -\n\n### a) 桌面应用\n`Microsoft Word`、`Office`、`Acrobat Reader`、`Media Player`、`Antivirus`等。\n\
  \n### b) Web 应用\n`Flipkart`、`Amazon`、`Irctc`等。\n\n### c) 移动应用\n`Game Apps`、`Facebook`、`Instagram`等。\n\
  \n应用程序最方便的例子是从 Playstore 下载的移动应用。如果我们想扫描文档，可以从 Playstore 下载 `Adobe Scan App`。如果要预订火车票，下载\
  \ `IRCTC App`；如果我们需要测试程序，可以下载 `Compiler App`。\n\n同样，我们的电脑上安装了不同的应用程序，如 `MS Word`、`Powerpoint`、`Chrome`、`Firefox`等。所有这些都属于应用程序。有许多设备正在运行\
  \ Java。\n\n图 1.9 显示了移动应用程序与桌面应用程序之间的区别。\n\n![](img/image_rsrc2XAK.jpg)\n\n## 15)\
  \ 软件 (Software)\n软件是一组计算机程序，由旨在执行多项任务的指令、数据或程序组成。\n\n我们使用的移动设备和计算机内置了软件。移动设备安装了\
  \ `Android`、`Windows`等软件。计算机设备安装了不同版本的 Windows，如 `Windows 8`、`Windows 8.1`、`Windows\
  \ 11`等。\n\n我们经常在手机上看到像软件更新之类的通知。此外，Windows 的版本也在不断发布。\n\n图 1.10 显示了制作软件的不同阶段。\n\n\
  ![](img/image_rsrc2XAM.jpg)\n\n在第一步中，如前所述，语言可以是 `Java`、`Python`、`C`等。你可以选择任何你熟悉的或已经学过的语言，并在这某些特定语言上构建软件。一旦决定了语言，我们将移动到下一步。\n\
  \n第二步是编写特定于我们选择语言的程序语句。我们必须编写计算机可以理解的语句。\n\n第三步是我们正在编写的语句；它向计算机传递执行的指令。\n\n第四步是根据我们的需求或功能编写逻辑或精确的代码。编码员是那些编写代码的人。\n\
  \n在第五步中，我们通过逻辑编写的不同代码开发出“程序”。程序员是那些编写程序的人。\n\n因此，第六步是构建应用程序的步骤。我们根据应用程序中所需的功能编写不同的程序。\n\
  \n最后，在第七步中设计软件，它可以是一个单一应用程序，也可以由不同的应用程序组成。\n\n## 16) 设备 (Device)\n设备是具有特定目的或意图的对象或系统。所有软件都安装在设备内部。在设备上，我们运行多个应用程序。借助设备，我们可以使用`手机`、平板电脑、电脑等。\n\
  \n图 1.11 显示了一个包含应用程序的移动设备。\n\n![](img/image_rsrc2XAN.jpg)](image_rsrc2AP.jpg)\n\n\
  ## 17) 内存 (Memory)\n内存是计算机存储数据或程序的电子存放地或空间。它是存储供时使用信息的地方。我们使用的设备，如`手机`、`电脑`、`U 盘`，都有与之相关的内存，就像人类的大脑。内存是计算机的基本功能之一，因为没有它，计算机无法正常运行。\n\
  \n## 18) 浏览器 (Browser)\n浏览器是一种提供查看和交互万维网上所有信息的应用程序。它是一个可以在其中搜索查询、谷歌搜索并收集所需信息的应用程序。浏览器的示例有\
  \ `Google Chrome`、`Internet Explorer`等。\n\n### 练习\n\n1) 查看下面的图表并识别图像类型（设备 / 应用程序\
  \ / 内存 / 程序 / 浏览器 / 软件 / 程序员）：\n\n![](img/image_rsrc2AR.jpg)\n\n2) 回答以下问题：\n\na)\
  \ Java 是什么语言？\nb) 有哪些著名的编程语言？\nc) Web 和桌面应用程序有什么区别？\nd) 程序和程序员有什么区别？\ne) 程序员和编程有什么区别？\n\
  \n3) 活动：\n\na) 关于学习计算机技能写 50 字左右。（仅在电脑上使用电脑键盘打字）\nb) 查询你当前正在使用的手机有多少大内存。\n\n\n\n\
  \n它由 James Gosling 设计，他被称为“Java 之父”。这门语言很大程度上借鉴了 C 和 C++ 的语法。它比 C++ 更容易使用。在 Java\
  \ 出现之前，它的名字叫 Oak。James Gosling 和他的团队将名字从 Oak 改为了 Java。\n\n### 3) Java 类型\n下面主要描述了使用\
  \ Java 编程可以创建的四种应用程序：\n\na) **独立运行应用程序** - 桌面或基于窗口的应用程序都是独立运行程序。例如 `Calculator`、`Google\
  \ Chrome`、`Notepad` 等。\n\nb) **Web 应用程序** - 在服务器上运行并创建动态页面的应用程序称为 Web 应用程序。例如 `Email`、`Online\
  \ Forms` 等。\n\nc) **企业级应用程序** - 具有分布式特性的应用程序。例如 `Banking applications`（银行应用）。\n\n\
  d) **移动应用程序** - 为移动设备创建的应用程序称为移动应用程序。例如 `MX Player`、`Game App`、`Udemy` 等。\n\n###\
  \ 4) Java 特性\nJava 用程序表示了当今世界及其问题。Java 的特性被称为 Java 术语（buzzwords）。Java 语言最重要的特性如下所示，并在图\
  \ 2.1 中显示……\n\na) **简单** - Java 非常简单，语法易于编写，并且表示真实世界的问题。\n\nb) **面向对象** - Java 是一门面向对象的编程语言。Java\
  \ 中的一切都是对象。\n\nc) **可移植性** - Java 是可移植的，因为它允许我们在任何平台上运行。它不需要任何特定的平台实现。\n\nd) **平台无关**\
  \ - Java 代码可以在多个平台上执行。例如 `Windows`、`Linux`、`Sun Solaris`、`Mac/OS` 等。\n\ne) **安全**\
  \ - Java 以安全性闻名。通过 Java，可以开发不受病毒侵害的系统。\n\nf) **高性能** - Java 比传统的解释型编程语言更快。\n\n![](img/image_rsrc2XAS.jpg)\n\
  \n### 5) Java 版本\nJava 发布了许多版本，从 `JDK 1.0`、`JDK 1.1`、`J2SE 1.2`、`J2SE 1.3`、`J2SE\
  \ 1.4`、`Java SE 5`、`Java SE 6`、`Java SE 7`、`Java SE 8` 等。\n\nJava 的第一个版本于 1996 年\
  \ 1 月发布。根据维基百科，当前版本是 `Java SE 21`，它于 2023 年 9 月发布。`Java SE 22` 预计于 2024 年 3 月发布。\n\
  \n考虑到本课程第一级的简单性，我们将在第二级（即中级课程）中详细介绍这些。此外，我们还将了解更多一些基础和复杂的术语，如 `JDK`、`Compiler`编译器、`Interpreter`解释器等。\n\
  \n**注意：** 从本章开始的所有示例以及本课程第 5 章开始的所有程序都是用 `Java SE 7` 编写的。\n\n### 6) Java 常量\n常量是编程中一个值不能改变的实体（即不可变的）。常量通常被称为字面量（literal）。如果整数常量前面没有符号，则假设它为正数。常量内部不允许有逗号或空格。\n\
  \nJava 中有几种类型的常量，例如……\n\nA) **数值型常量**\n- a) 整数常量\n- b) 实数常量\n\nB) **非数值型常量**\n-\
  \ a) 字符常量\n- b) 字符串常量\n\n图 2.2 显示了 Java 常量的层次结构。\n\n![](img/image_rsrc2XAT.jpg)\n\
  \n### a) 整数常量\n整数常量是指数字序列。在没有小数点的情况下，数字就是整数。它们是 Java 编程中的主要常量。整数常量中不应允许逗号或空格。它可以用正号或负号表示。如果整数常量前面没有符号，则默认为正数。数字和运算符之间允许有空格。它必须至少有一个数字。不能有小数点。\n\
  \n我们可以在整数常量之间执行加法、乘法、减法和除法等算术运算。整数常量之间也可以进行取模运算。\n\n**注意：** 从现在开始，将会有很多示例。在 Java\
  \ 程序中，我们经常使用注释让读者更好地理解任何代码的功能或目的。\n\n\n\n\n```text\n-0.1f // 浮点数常量可以是一个带有后缀 f 和负号的小数数字\n\
  ```\n\n以下是一些无效的实数常量...\n\n```text\n9.5 f // Error: 小数数字与后缀之间不允许有空格\nF     // Error:\
  \ 后缀不能在没有小数数字的情况下单独使用\n2\\. 0F // Error: 小数数字与数字之间不允许有空格\n8.0   // Error: 浮点常量应用后缀\
  \ f 表示\n```\n\n以下是一些有效的实数常量表达式...\n\n```text\n+ 2.0f - 1.1f // 浮点数常量之间可以进行减法等算术运算\n\
  - 2.0f * 1.1F // 浮点常量之间可以进行乘法等算术运算\n2.1f + 2.3f   // 浮点常量之间可以进行加法等算术运算\n2.1f % 2.3f\
  \   // 浮点常量之间可以进行取模运算\n```\n\n以下是一些无效的实数常量表达式...\n\n```text\n+ 2.0f - 1.1 f // Error:\
  \ 小数数字与后缀之间不允许有空格\n- 2.0 f * 1.1F // Error: 小数数字与后缀之间不允许有空格\n2.1 + 2.3f     // Error:\
  \ 浮点常量应用后缀 f 表示\n2.0F + 2.3     // Error: 浮点常量应用后缀 f 表示\n```\n\n### c) 字符常量\n\n\
  字符常量指的是单个字母、单个数字或单个特殊符号。它也代表字符转义序列和 Unicode 转义序列。\n\n它被一对单引号（`' '`）包围。两个引号都应该指向左侧。这些字符常量也被称为不可打印常量。字符常量的最大长度为一个字符。字符常量可以是一个空格。算术运算符后允许有空格。字符常量也可以表示为表达式。我们可以在字符常量之间进行加法、乘法、减法、除法等算术运算。字符常量之间也可以进行取模运算。\n\
  \n图 2.3 显示了不同的字符转义序列。我们将在第 2 （即中级课程）学习更多关于这类常量知识。\n\n![](img/image_rsrc2XAU.jpg)!(image_rsrc2XAV.jpg)\n\
  \n图 2.4 显示了不同的 Unicode 转义序列。\n\n![](img/image_rsrc2XAW.jpg)\n\n每个数字、符号和大小写字母都关联着某些\
