  \n#### C) char 数据类型：\n\n字符常量指的是单个字母、数字或特殊符号。\n\n它用单引号 (' ') 包裹。\n\n`char` 数据类型用于存储字符。\n\
  \n`char` 数据类型以 Unicode 格式表示字符。\n\nUnicode 字符编码标准是固定长度。\n\nUnicode 表示可以取最小值 `\\u0000`（或\
  \ 0）和最大值 `\\uffff`（或 65535）。\n\n`char` 数据类型也可以表示 0 到 65535 范围内的数字，无需用单引号包裹。\n\n\
  `char` 占据的字节数为 2 字节。\n\n`char` 的默认值为 `\\u0000`。\n\n`char` 必须使用小写，因为它是一个关键字。\n\n\
  以下是声明 Java `char` 整数类型表示的最简单语法……\n\n```java\nchar variable_name = value;\n```\n\n\
  图 3.5 也强调了 `char` 数据类型的关键要点。\n\n![](img/image_rsrc2XB4.jpg)\n\n我们可以在字符常量之间进行加法、乘法、减法和除法等算术运算。\n\
