  \n### 5) do-while\n\n`while` 循环和 `do-while` 循环的工作方式之间存在细微差异。这种差异在于测试条件的位置。\n\n`while`\
  \ 在执行 `while` 循环体内的任何语句之前测试条件。与之相反，`do-while` 在执行完循环内的语句后才测试条件。\n\n即使条件在第一次运行时失败，`do-while`\
  \ 也会至少执行一次其语句。而 `while` 循环如果条件在第一次运行时失败，则不会执行其语句。\n\n通用形式如下……\n\n```java\ndo\n{\n\
  \    // statements\n} while (condition);\n```\n\n#### do-while 循环的工作流程图：\n\n![](img/image_rsrc2XCB.jpg)\n\
  \n如图 7.5 所示，每当使用 `do-while` 循环编写程序时，都会发生迭代。\n\n这里的额外语法是 `do` 块，要执行的语句保存在其中。这与 `while`\
  \ 循环相似，但主要的区别在于，首先无论 `do` 循环中的语句是什么，它都会被执行。\n\n比较部分在第一次迭代不起作用。除了这个区别外，该过程与 `while`\
  \ 循环相似。`while` 条件中的比较将从第 2 次迭代开始。\n\n以下是几个代表真实生活场景的语句。可以使用 `do-while` 循环表示这些场景\n\
  \na) 在学校集会上，从总人数 150 名的学生中数出女孩人数。\nb) 在 28 个州中找到印度的州总数，这些州从字母 'M' 开始。\nc) 在你家中 15\
  \ 台电子设备中数出有多少台移动设备。\nd) 检查 35 老师中，今天有多少人开车来学校的。\ne) 在 6 个家庭成员中数出有多少人吃了早餐。\n\n##\
  \ A) 程序场景\n\n#### 场景 1\n```java\n// Java 程序带有多个语句的 while 循环\npublic class Scenario_1\
