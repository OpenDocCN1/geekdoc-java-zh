  问题描述是打印 1 到 10 中和等于 5 的所有对。\n变量 `k` 被赋值为 5。\n在外层 `for` 循环中，`i` 从 1 初始化到 10。\n内层\
  \ `for` 循环中，`j` 从 1 初始化到 10。\n通过 `if(i + j == k)` 语句检查和是否等于 5。\n如果成立，使用 `System.out.println`\
  \ 打印 `i` 和 `j`。\n\n\n\n周 : 1 天 : 7\n周 : 2 天 : 1\n周 : 2 天 : 2\n周 : 2 天 : 3\n周 : 2\
  \ 天 : 4\n周 : 2 天 : 5\n周 : 2 天 : 6\n周 : 2 天 : 7\n\n### 解释\n\n在这个程序中，`main()` 方法内部使用了嵌套循环。\n\
  \n声明了两个类型为 `int` 的变量 `weeks` 和 `days`，并分别初始化为值 2 和 7。\n\n在第一个 `for` 循环中，括号内的三个部分由分号隔开。在第一部分中，值\
  \ `i` 被初始化为 1。在第二部分中，`i` 应该小于或等于 `weeks`（即 2），在第三部分中，`i` 的值将增加 1。\n\n同样在第二个内部 `for`\
  \ 循环中，括号内的三个部分由分号隔开。在第一部分中，值 `j` 被初始化为 1。在第二部分中，`j` 应该小于或等于 `days`（即 7），在第三部分中，`j`\
  \ 的值将增加 1。\n\n内部 `for` 循环中的 `sysout` 语句会在每次迭代时打印 `i` 和 `j` 的值以及一条消息。\n\n在这里，在这种情况下，由于\
  \ `i` 的最大值为 2，`j` 的最大值为 7，因此总迭代次数将为 `2 * 7 = 14`。\n\n为了更清晰地了解循环是如何工作的，让我们理解下面的迭代场景\
  \ -\n\n当 `i = 1` 时：\n- 当 `j = 1`，如果 `1 <= 7`，则 `i = 1`，`j = 1`，因此 `j = j+1 = 1+1\
  \ = 2`。\n- 当 `j = 2`，如果 `2 <= 7`，则 `i = 1`，`j = 2`，因此 `j = j+1 = 2+1 = 3`。\n- 当\
  \ `j = 3`，如果 `3 <= 7`，则 `i = 1`，`j = 3`，因此 `j = j+1 = 3+1 = 4`。\n- 当 `j = 4`，如果\
  \ `4 <= 7`，则 `i = 1`，`j = 4`，因此 `j = j+1 = 4+1 = 5`。\n- 当 `j = 5`，如果 `5 <= 7`，则\
  \ `i = 1`，`j = 5`，因此 `j = j+1 = 5+1 = 6`。\n- 当 `j = 6`，如果 `6 <= 7`，则 `i = 1`，`j\
  \ = 6`，因此 `j = j+1 = 6+1 = 7`。\n- 当 `j = 7`，如果 `7 <= 7`，则 `i = 1`，`j = 7`，因此 `j\
  \ = j+1 = 7+1 = 8`。\n- 当 `j = 8`，如果 `8 <= 7`（不成立），内部循环将终止。\n\n同样地，`i = 2`、`i = 3`、`i\
  \ = 4` 和 `i = 5` 时也会打印相应的值。\n\n### 问题 3\n\n```java\npublic class Problem_3 {\n \
  \   public static void main(String[] args) {\n        int i = 1;\n        while(i\
  \ <= 5) {\n            int j = 1;\n            while(j <= 5) {\n               \
  \ System.out.println(i + \" \" + j);\n                j++;\n            }\n    \
  \        i++;\n        }\n    }\n}\n```\n\n**输出：**\n```\n1 1\n1 2\n1 3\n1 4\n1 5\n\
  ```\n\n### 解释\n在这个程序中，`main()` 方法内部使用了嵌套循环。\n\n对于第一个 `while` 循环，分别使用了三个部分。在第一部分中，值\
  \ `i` 被初始化为 1。在第二部分中，括号内的 `i` 应该小于或等于 5，在第三部分中，循环结束时，`i` 的值将增加 1。\n\n同样，对于第二个 `while`\
  \ 循环，分别使用了三个部分。在第一部分中，值 `j` 被初始化为 1。在第二部分中，括号内的 `j` 应该小于或等于 5，在第三部分中，循环结束时，`j` 的值将增加\
  \ 1。\n\n内部 `while` 循环中的 `sysout` 语句会在每次迭代时打印 `i` 和 `j` 的值。\n\n在这里，在这种情况下，由于 `i`\
  \ 的最大值为 5，`j` 的最大值为 5，总迭代次数将为 `5 * 5 = 25`。\n\n为了更清晰地了解循环是如何工作的，让我们理解下面的迭代场景 -\n\
  \n当 `i = 1` 时：\n- 当 `j = 1`，如果 `1 <= 5`，则 `i = 1`，`j = 1`，因此 `j = j+1 = 1+1 = 2`。\n\
  - 当 `j = 2`，如果 `2 <= 5`，则 `i = 1`，`j = 2`，因此 `j = j+1 = 2+1 = 3`。\n- 当 `j = 3`，如果\
  \ `3 <= 5`，则 `i = 1`，`j = 3`，因此 `j = j+1 = 3+1 = 4`。\n- 当 `j = 4`，如果 `4 <= 5`，则\
  \ `i = 1`，`j = 4`，因此 `j = j+1 = 4+1 = 5`。\n- 当 `j = 5`，如果 `5 <= 5`，则 `i = 1`，`j\
  \ = 5`，因此 `j = j+1 = 5+1 = 6`。\n- 当 `j = 6`，如果 `6 <= 5`（不成立），内部循环将终止。\n\n同样地，`i\
  \ = 2`、`i = 3`、`i = 4` 和 `i = 5` 时也会打印相应的值。\n\n### 问题 写一个打印所有月份的 Java 程序\n\n```java\n\
