  - ee) Nidhi 奇奇我是否可以学习 Java 编程，那么我将构建一个 App；否则，我将做到。（使用条件运算符）\n\n# 7 循环控制指令\n\n计算机的通用性在于其重复执行一组指令的能力。这涉及到重复执行程序的某部分，重复指定的次数，或者直到满足特定条件。这种重复操作是通过循环控制指令完成的。\n\
  \n### 1) 循环控制指令\n\n循环控制指令是 Java 定义的一种语法形式，允许我们多次执行一条语句或一组语句。我们有四种方法可以重复程序的一部分。它们是……\n\
  \n- a) 使用 `for` 循环\n- b) 使用 `while` 循环\n- c) 使用嵌套循环\n- d) 使用 `do-while` 循环\n\n图\
  \ 7.1 显示了不同类型的循环控制指令。\n\n![](img/image_rsrc2XC5.jpg)\n\n### 2) for 循环\n\nJava 的\
  \ `for` 循环用于多次迭代程序的一部分。迭代简单来说就是 `for` 循环的反复执行。\n\n`for` 循环内部的语句将一直执行，直到测试的条件保持真。当条件变为假时，控制权将传递到\
  \ `for` 循环体之后的第一个语句。所测试的条件可以使用关系运算符或逻辑运算符。循环内的语句可以是单行的，也可以是一个语句块。循环计数器并不非要是 `int`\
  \ 类型，它也可以是 `float`。\n\n通用形式如下……\n\n```java\nfor(initialization; condition/decrement)\n\
  {\n    // statements\n}\n```\n\n#### for 循环的工作流程：\n![](img/image_rsrc2XC6.jpg)\n\
  \n如图 7.2 所示，每当使用 `for` 循环编写程序时，就会发生某些迭代。实现 `for` 循环使用了三个部分，即初始化、比较、递增，并用分号分隔。所有这些部分都放在与\
  \ `if` 相同的括号内。\n\n- 在 `Initialization（初始化）` 部分，我们声明任何变量并对其进行值赋值。\n- 在 `Comparison（比较）`\
  \ 部分，将声明的变量与某些条件进行比较。\n- 在 `Incrementation（递增）` 部分，每次迭代时，如果第二部分为真，变量的值将根据第三部分传递的指令不断增加或减少。\n\
  - 在任何迭代中，如果比较失败，变量的当前值将保持不变，不会发生递增或递减。假设没有进一步的条件需要评估。在这种情况下，控制将到达 `for` 循环之后，并执行后续语句。\n\
  \n下面是几个表示现实生活场景的语句。这些可以使用 `for` 循环表示……\n\n- a) 在学校集会上，从总人数 150 人中数出女孩的数量。\n- b)\
  \ 在 28 个州中找到所有以 'M' 开头的印度州总数。\n- c) 在家中 15 台电子设备中数出手机的数量。\n- d) 检查今天来 35 名老师中有多少人是开车来学校的。\n\
  - e) 在 6 个家庭成员中数出有多少人吃了早餐。\n\n## A) 程序场景\n\n```java\npublic class Scenario_1\n{\n\
