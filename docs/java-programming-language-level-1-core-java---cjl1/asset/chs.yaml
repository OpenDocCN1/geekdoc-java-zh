  \ 在第 2 次迭代中，当 `i = 2` 时，如果 `2 <= 10` 则 `multiplication = 7 * 2 = 14`，因此 `i = i+1\
  \ = 2+1 = 3`。\n- 在第 3 次迭代中，当 `i = 3` 时，如果 `3 <= 10` 则 `multiplication = 7 * 3 =\
  \ 21`，因此 `i = i+1 = 3+1 = 4`。\n\n\n\n\n\n在第 10 次迭代中，当 `i = 10` 时，如果 `10 <= 10` 则\
  \ `multiplication = 7 * 10 = 70`，因此 `i = i + 1 = 10 + 1 = 11`。\n\n在第 11 次迭代中，当 `i\
  \ = 11` 时，如果 `11 <= 10` 为假，则循环终止。\n\n◆◆\n\n## 练习题\n\n### 1) 空空\na) 当 `while` 循环条件变为\
