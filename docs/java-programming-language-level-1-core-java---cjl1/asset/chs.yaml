  \       }\n        else\n        {\n            System.out.println(4);\n       \
  \ }\n    }\n}\n```\n\n### 输出\n0\n4\n\n### 解释\n在这个问题中，声明了一个类型为 `int` 的变量 `age` 并将其初始化为\
  \ `9`。\n\n首先，将执行 `sysout` 语句。\n\n在第一个 `if` 检查中，条件为假，因为在使用相等运算符比较时 `9 % 2` 不等于 `0`，将检查后续的\
  \ `else-if` 块。\n\n同样，第一个 `else-if` 条件为假，因为在使用相等运算符比较时 `9 % 5` 不等于 `0`，将检查后续的 `else-if`\
  \ 块。\n\n第二个 `else-if` 条件同样为假，因为在使用相等运算符比较时 `9 % 7` 不等于 `0`，将检查后续的块。\n\n最后，`else`\
  \ 块将被执行，`sysout` 语句将被打印。\n\n因此，输出将是 `0` 和 `4`。\n\n## D) 更多问题\n\n编写一个 Java 程序来检查候选人是否符合课程的资格。\n\
