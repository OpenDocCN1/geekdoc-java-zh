  \ Number（负数）。\n\n### 3) 编写一个 Java 程序检查一个数字是否能被 30 整除且为偶数，或者满足其中任意一个条件。\n\n```java\n\
  public class CheckDivisibleAndEvenProgram_3\n{\n    public static void main(String[]\
  \ args)\n    {\n        int num = 90 ;\n        boolean check = (num % 30 == 0 &&\
  \ num % 2 == 0) ? true : false ;\n        if(check)\n        {\n            System.out.println(num\
  \ + \" is divisible by 30 and is an \" + \"Even number\");\n        }\n        else\
  \ if(num % 30 == 0 || num % 2 == 0)\n        {\n            System.out.println(num\
  \ + \" is either divisible by 30 or \" + \"is an Even number\");\n        }\n  \
  \  }\n}\n```\n\n**输出：**\n90 is divisible by 30 and is an Even number\n\n**解释：**\n\
  在该程序中，声明了两个变量 `num` 和 `check`，分别为 `int` 类型和 `boolean` 类型。\n题目要求是检查一个数字是否能被 30 整除且为偶数，或者满足其中任意一个条件。\n\
  变量 `num` 初始化为 90，`check` 包含了 RHS 中三元运算符运算的结果。\n在 RHS 中，`num` 对 30 和 2 取模运算的结果均为\
  \ 0，因此第一个条件为真，并将结果存储在变量 `check` 中，即 `check = true`。\n因此，如果 `check` 为真，则 `if` 条件将为真，执行\
  \ `if` 块并打印 `sysout` 语句以及一条消息。\n所以，输出结果为 90 is divisible by 30 and is an Even number。\n\
  \n### C) 输出练习题\n\n#### 题 1 -\n\n```java\npublic class Problem_1\n{\n    public static\
  \ void main(String[] args)\n    {\n        int percentage = 66 ;\n        String\
  \ result = (percentage > 60) ? \"First Division\" : \"Not a First Division\";\n\
  \        System.out.println(result);\n    }\n}\n```\n**输出：**\nFirst Division\n\n\
  **解释：**\n在此题中，声明了一个类型为 `int` 的变量 `percentage` 并初始化为 66。另一个变量 `result` 被声明为 `String`\
  \ 类型，并通过表达式的结果进行更新。在表达式部分，`percentage = 66` 大于 60，因此第一个字符串（即 \"First Division\"\
  ）会被赋值给变量 `result`，`sysout` 语句将打印该变量的值。\n因此，输出为 First Division。\n\n#### 题 2 -\n\n\
  ```java\npublic class Problem_2\n{\n    public static void main(String[] args)\n\
  \    {\n        int marks = 23 ;\n        System.out.println((marks > 33) ? \"Pass\"\
  \ : \"Fail\");\n    }\n}\n```\n**输出：**\nFail\n\n**解释：**\n在此题中，声明了一个类型为 `int` 的变量\
  \ `marks` 并初始化为 23。在 `sysout` 语句中，对表达式部分，`marks = 23` 小于 33，因此 `?` 之后的第一个字符串为假，并将打印\
  \ `:` 之后的字符串（即 \"Fail\"）。\n因此，输出为 Fail。\n\n#### 题 3 -\n\n```java\npublic class Problem_3\n\
  {\n    public static void main(String[] args)\n    {\n        int x,y;\n       \
  \ x = 21;\n        y = (x > 1) ? 211 : 210 ;\n        System.out.println(\"Value\
  \ of y is : \" + y);\n        y = (x == 20) ? 211 : 210 ;\n        System.out.println(\"\
  Value of y is : \" + y);\n    }\n}\n```\n**输出：**\nValue of y is : 211\nValue of\
  \ y is : 210\n\n**解释：**\n在此题中，声明了两个类型为 `int` 的变量 `x` 和 `y`，并将 `x` 初始化为 21。现在，第一个\
  \ `y` 的值是表达式的结果，所以当 `x=21` 大于 1 时，第一个条件为真，211 被存储在 `y` 中。第一个 `sysout` 语句将带有消息打印\
  \ `y` 的值。同样，第二个 `y` 的值通过表达式的结果更新，由于 `x=20` 不等于 20，所以第一个条件为假，210 被存储在 `y` 中。第二个 `sysout`\
  \ 语句将带有消息打印更新后的 `y` 值。\n因此，输出将为 Value of y is : 211 和 Value of y is : 210。\n\n##\
