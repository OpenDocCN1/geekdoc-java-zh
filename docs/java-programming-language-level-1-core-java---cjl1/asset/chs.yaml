  \ 之间可以进行加法等算术运算\nDouble de4 = 1.2 / 1; // double 之间可以进行除法等算术运算\nDouble de5 = 1.2d\
  \ / 1.0 ; // double 之间可以进行除法等算术运算\ndouble de6 = 9 - 8 ; // double 之间可以进行减法等算术运算\n\
