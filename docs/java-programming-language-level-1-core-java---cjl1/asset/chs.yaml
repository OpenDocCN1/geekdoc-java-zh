  \ 程序，使得在不同的水果（如 APPLE、 MANGO 和 BANANA）之间，字符串应该属于 case 3。\n\n```java\npublic class\
  \ Program_1\n{\n    public static void main(String[] args)\n    {\n        String\
  \ fruit = \"APPLE\" ;\n        switch (fruit)\n        {\n            case \"MANGO\"\
  \ :\n                System.out.println(\"I am in case 1\");\n                break;\n\
  \            case \"APPLE\" :\n                System.out.println(\"APPLE is in\
  \ case 2\");\n                break;\n            case \"BANANA\" :\n          \
  \      System.out.println(\"I am in case 3\");\n                break;\n       \
  \     default :\n                System.out.println(\"APPLE is not available\");\n\
  \                break;\n        }\n    }\n}\n```\n\n**输出：**\nAPPLE is in case 2\n\
  \n**解释：**\n在 `main` 方法内部，使用的第一个语句是声明一个类型为 `String` 的变量 `fruit`，并初始化为 `\"APPLE\"\
  `。随后使用了 `switch-case`，将一个字符串发送到 `switch` 条件中以定义选择类型。在第一种情况下，使用了字符串 `\"MANGO\"`，它不等于\
  \ `\"APPLE\"`，因此该 case 将被执行。在第二种情况下，使用了字符串 `\"APPLE\"`，它等于 `\"APPLE\"`，因此该 case\
  \ 将执行，`sysout` 语句将打印输出。后续的 case 和 default 将被跳过。因此，最终输出是 APPLE is in case 2。\n\n\
  ### 2) 使用 switch case 控制指令编写一个 Java 程序，使得在数字 1、3 和 4 之间，数字 3 不应该属于任何 case，而是属于 default。\n\
  \n```java\npublic class Program_2\n{\n    public static void main(String[] args)\n\
  \    {\n        int a = 3 ;\n        switch (a)\n        {\n            case 1 :\n\
