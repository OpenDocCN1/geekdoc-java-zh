  \ `int` own Java 变量表示并初始化为 `english = 61`、`maths = 87`、`science = 52`、`computer\
  \ = 92` 和 `social = 71`。\n\n同样给定，学生的学校是小学，年级是 11。因此，这两个变量可以声明为 `String 类型的 school\
  \ = \"Primary\"` 和 `int 类型 standard = 11`。为了获取所有学科的总分和百分比，声明了两个变量 `sumOfSubjectMarks`\
  \ 和 `overallPercentage` 并初始化为 `0`。\n\n声明了三个布尔变量 `registration`、`eligibleForExam`\
  \ 和 `checkFirstEligibility` 并设置为 `false`，分别用于记录注册是否成功、是否有资格参加考试以及一等毕业资格。\n\n为了检查学生的一等毕业资格，使用了嵌套\
  \ `if` 检查。在 `if` 检查中，`school = \"Primary\"` 满足并通过，但 `standard = 11` 不等于 `10`，这表明不符合注册条件。因此，变量\
  \ `checkFirstEligibility` 的值仍为 `false`，所以 `if` 检查失败并执行 `else`，`sysout` 语句打印消息。因此，输出为\
  \ `A student is not eligible for First-Division`。\n\n\n\n\n\n如图 6.7 所示，当使用嵌套的 `if`\
  \ 条件编写程序时，必须检查某些条件。\n\n首先，在 `if` 条件之前，所有的语句都将被执行。\n\n当控制流到达 `if` 条件时，它将按照要求检查括号内的条件。\n\
  \n如果条件通过，将执行 `if` 块内部的语句。\n\n现在，如果在第一个 `if` 检查内部使用了另一个 `if` 条件，那么第二个 `if` 检查内部的条件将再次被验证。\n\
  \n如果第二个 `if` 检查内部的条件通过，将执行内层 `if` 块内部的语句。\n\n如果内层 `if` 检查的条件未通过通过，控制流将直接到达内层的 `else`\
  \ 块（该块对应于第一个 `if` 块），如果使用了 `else` 块，则执行其语句。\n\n如果内层 `if` 块没有使用 `else`，则将检查内层 `if-else`\
  \ 块之后的后续语句。\n\n如果在第一个内部 `if-else` 块之后又放置了更多条件，这些条件也将会被验证。\n\n在执行完所有内部语句后，控制流将直接到达\
  \ `else` 块之后的语句。\n\n如果使用了 `else` 块，它将被跳过，因为第一个 `if` 检查的条件已经通过。\n\n在执行 `if` 块之后，将直接执行\
  \ `else` 块之后的语句。\n\n如果第一个 `if` 检查内部的条件失败，`if` 块将不会执行，控制流将直接到达 `else` 块。\n\n`else`\
  \ 块内部的所有语句都将被执行。\n\n同样，如果执行了 `else` 块，将执行 `else` 块之后的语句。\n\n以下是代表日常使用场景的语句。可以使用嵌套的\
