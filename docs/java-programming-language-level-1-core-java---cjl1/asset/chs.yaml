  \        }\n        // Example 3\n        boolean b = true;\n        if(!b) {\n\
  \            System.out.println(3);\n        }\n        // Example 4\n        boolean\
  \ check = true;\n        if(check) {\n            System.out.println(!check);\n\
  \        }\n    }\n}\n```\n\n### 场景 2 (演示 && 运算符使用的 Java 场景)\n\n```java\n// Java\
