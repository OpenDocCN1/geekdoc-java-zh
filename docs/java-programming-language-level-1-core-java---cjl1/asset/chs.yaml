  '' + \"\"                      // Error: 字符串常量应包含在 \" \" 之间\n\"ss+++\" + '\\'' \
  \               // Error: 字符串常量应包含在 \" \" 之间\n```\n\n### 变量\n\n变量名是字母、数字、下划线（_）或货币符号（$）的任意组合。用于类、变量和方法的名称称为标识符。我们不应该创建不必要的长名称。变量名的第一个字符必须是字母或货币符号（$）。变量名内部不允许出现逗号或空格。变量名区分大小写。变量名内部不允许有空格。注意：从\
  \ Java SE7 开始，我们可以在数字中使用任意数量的下划线来提高代码的可读性。\n\n以下是部分有效的变量...\n\n```\nage        \
  \                  // 变量名可以从小写字母开始\n$salary                      // 变量名可以以美元符号开头并组合\n\
  _value                       // 变量名可以以下划线符号开头并组合\n__1_value                    //\
  \ 变量名可以以下划线符号开头并组合\n$sss                         // 变量名可以以美元符号开头并组合\nShine     \
  \                   // 变量名可以从大写字母开始\nrise                         // 变量名从小写字母开始\n\
  n                            // 变量名可以是单个小写字母\nI                            // 变量名可以是单个大写字母\n\
  II                           // 变量名可以是两个大写字母组成\n____i                        //\
  \ 变量名可以以下划线开头并组合\n____i____i                     // 变量名可以以下划线符号开头并组合\n____i$i____i\
  \                 // 变量名可以以下划线符号开头并组合\n_$                           // 变量名可以以下划线符号开头并组合\n\
  ```\n\n以下是部分无效的变量名...\n\n```\n123abc                        // Error: 变量名不能以数字开头\n\
  -salary                       // Error: 变量名不能以算术运算符开头\n$s ss                   \
  \      // Error: 变量名不能有空格\ni i                          // Error: 变量名不能有空格\n____i\
  \ ____i ____i               // Error: 变量名不能有空格\n_ $                          //\
  \ Error: 变量名不能有空格\n```\n\n### Java 关键字\n\nJava 定义了一些特定的单词。这些词也称为保留字（Reserved Words）。关键字不能用作标识符。我们使用这些关键字来编写程序。\n\
  \nJava 关键字的含义已经在 Java 中定义。保留字不能用于变量、方法名、类名或其他标识符。Java 中总共使用了 51 个关键字，如图 2.5 所示。\n\
  \n`abstract`, `assert`, `boolean`, `break`, `byte`, `case`, `catch`, `char`, `class`,\
  \ `continue`, `const`, `default`, `do`, `double`, `else`, `enum`, `extends`, `exports`,\
  \ `final`, `finally`, `float`, `for`, `goto`, `if`, `implements`, `import`, `instanceof`,\
  \ `int`, `interface`, `long`, `native`, `new`, `package`, `private`, `protected`,\
  \ `public`, `return`, `short`, `static`, `strictfp`, `super`, `switch`, `synchronized`,\
  \ `this`, `throw`, `throws`, `transient`, `try`, `void`, `volatile`, `while`\n\n\
  其中 `const` 和 `goto` 暂不使用。所有关键字都是区分大小写的，即我们在编写程序时只能使用小写字母。如果一个单词不是关键字，它在 Java 中被称为变量。`true`、`false`\
  \ 和 `null` 不是关键字，而是字面量（即常量），而保留字不能用作标识符（即变量）。\n\n## 练习题\n\n1) 填空题：\na) Java 是在 _______\
