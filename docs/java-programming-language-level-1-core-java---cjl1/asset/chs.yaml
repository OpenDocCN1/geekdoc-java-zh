  long;\nlve5 = 14L + (8L) ; // 错误：long 不能单独存在\n```\n\n#### B) 实数类型（Real Types）：\n\
  \n实数可以用 `float` 和 `double` 表示。它们之间的区别在于占用的字节数、取值范围以及精度。实数类型用于表示小数。实数类型有两种...\n\n\
  a) `float`\nb) `double`\n\n#### a) float\n\n- `float` 数据类型的范围是从 `1.40239846e-45f`\
  \ 到 `3.40282347e+38f`。\n- 它的最小值为 `1.40239846e-45f`。\n- 它的最大值为 `3.40282347e+38f`。\n\
  - `double` 占用的字节数为 4（注：此处原文可能有误，通常 double 为 8 字节）。\n- `float` 的默认值为 `0.0`、`0.0f`\
  \ 或 `0.0F`。\n- `float` 和 `Float` 都可以表示 `float` 数据类型。\n- `float` 类型不能表示没有后缀 `f` 或\
  \ `F` 的小数值。\n\n图 3.4 同样强调了 `float` 数据类型的关键点。\n\n以下是声明 Java float 整数类型表示的最简单语法...\n\
  \n```java\nfloat variable_name = value;\nfloat variable_name = valuef;\nfloat variable_name\
  \ = valueF;\nFloat variable_name = valuef;\nFloat variable_name = valueF;\n```\n\
  \n在进行赋值时，被赋值的 `float` 值不应超过变量的范围。如果 `float/double` 的值太小或太大，与其使用标准记法，不如使用指数形式来指定数字更简单。如果你需要节省内存，建议使用\
  \ `float`（而不是 `double`）。\n\n### 以下是部分有效的 float 实数类型表示...\n\n```java\nfloat f1 =\
  \ 9.5f ; // float 可以带有后缀 f 表示 float 类型 且在范围内\nFloat f2 = 234789.2f ; // Float 可以带有后缀\
  \ f 代替 float\nFloat f3 = 234789.2F ; // Float 可以带有后缀 F 代替 float\nfloat f4 = 8 ;\
  \ // float 也可以不带后缀 f 或 F 进行表示\n```\n\n### 更多有效的 float 类型表示...\n\n```java\nfloat\
  \ f5 = -\n2f ; // 语句的每个部分都可以单独一行\nfloat f6 = - 2f ; // 语句可以单独一行\nFloat f7;\nf7=\
  \ - 2F ; // 语句可以单独一行\n```\n\n### 以下是部分无效的 float 实数类型表达式...\n\n```java\nfloat fiv1\
  \ = 8.2 ; // float 类型不能表示没有后缀 f 或 F 的小数值\nfloat fiv2 = 9.0 ; // float 类型不能表示没有后缀\
  \ f 或 F 的小数值\nFloat fiv3 = 1234789.2 F ; // 小数与后缀之间不允许有空格\nfloat fiv4 = 1234789.2\
  \ f ; // 小数与后缀之间不允许有空格\n```\n\n### 更多无效的 float 类型...\n\n```java\nFloat fiv5;\n=\
  \ 2f ; // 错误：根据规则 10，如果语句在类型声明后结束，则第一个语句后的左侧应该是一个变量\nfloat fiv6;\nfiv6= 21 ; //\
  \ 错误：根据规则 9，在给变量 fiv6 赋值之前必须先声明\n```\n\n### 以下是部分有效的 float 类型表达式...\n\n```java\n\
  float fe1 = 8.2F * 1.2f ; // float 之间可以进行乘法等算术运算\nfloat fe2 = 9.0f + 8.0f ; // float\
