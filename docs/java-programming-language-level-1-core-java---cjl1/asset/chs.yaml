  \ 初始化为 1。在第二部分，`i` 应该小于 11；在第三部分，`i` 的值将加 1。\n每次迭代中，更新 `multiplication`，`System.out.println`\
  \ 打印 `table` + ` * ` + `i` + ` = ` + `multiplication`。\n\n### 3) while 循环\n\n`while`\
  \ 循环内部的语句将一直执行直到条件为真。当条件变为假时，传递到循环体之后的第一个语句。测试的条件可以使用关系或逻辑运算符。循环内的语句可以是单行，也可以是语句块。循环计数器不一定是\
  \ `int`，它也可以是 `float`。\n\n带有所有条件的 `while` 循环通用形式如下：\n\n```\n初始化\nwhile(条件) {\n \
  \   // 语句\n    递增/递减\n}\n```\n\n如如图所示，每当使用 `while` 循环编写程序时，都会发生某种迭代。与 `for` 循环一样，使用三个部分来实现\
  \ `while` 循环，即初始化、比较和递增/递减。\n\na) 在学校集会中，统计可用女生有多少位\n\n\n\n\n\n学生总数，150。\n\nb) 在\
