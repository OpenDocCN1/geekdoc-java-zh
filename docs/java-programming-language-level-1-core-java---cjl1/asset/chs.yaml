  \ 或 else、if 或但是的情况进行决策。在现实生活中，我们不断遇到必须做出多个日常决策的情况。\n\n## 1) 控制语句：\n\nJava 提供了可以控制\
  \ Java 代码流的语句。这些语句被称为控制流语句。\nJava 编译器从上到下执行代码。\n代码中的语句按照它们出现的顺序执行。\nJava 中有不同类型的控制语句……\n\
  \nA) 决策控制语句\nB) 循环控制语句\nC) Switch 控制语句\n\n在本章中，我们将介绍决策控制语句以及其他内容。\n\n## 2) 决策控制语句：\n\
  \n这种类型的指令用于编写遇到某些决策的语句。\nJava 有不同的决策制作指令……\n\na) `if` 语句\nb) `if-else` 语句\nc) 嵌套\
  \ if 语句 (Nested if-statement)\nd) `else` 子句\ne) 逻辑运算符\nf) 条件运算符\n\n图 6.1 也显示了不同类型的决策控制语句。\n\
  ![](img/image_rsrc2BM.jpg)\n\n## 3) if 语句：\n\n与大多数语言一样，Java 使用 `if` 关键字来实现决策指令。\n\
  它是所有控制流语句中最基础的。\n它评估布尔表达式，并在表达式为真时允许进入代码块。\n`if` 语句用于 Java 中评估条件。\n程序的控制根据特定条件进行转移。\n\
  `if` 语句给出一个布尔值，真或假。\n如果条件（无论是什么）为真，则执行 if 内部的语句。\n如果条件为假，则不执行该语句。\nif 关键字后面的条件可以也可以不包含在圆括号内。\n\
  \n通用形式如下……\n\n```java\nif (condition)\n    statement;\n```\n\n```java\nif (expression)\n\
  \    statement;\n```\n\n\n\n\n\n在执行完 `if` 块后，将检查 `if` 块之后的语句。\n\n如果内部的条件失败，则 `if`\
  \ 块将被执行。\n\n同样，如果 `if` 块没有被执行，即使是 `if` 块之后的语句也会被执行。\n\n以下是几个代表现实场景的语句。这些可以使用 `if`\
  \ 条件来表示……\n\na) 妈妈，如果今天学校校车没来接我怎么办？妈妈回答说爸爸会送你上学。\nb) 爸爸，如果我的同学在班级里打败了我怎么办？爸爸爸爸说，你应该去找老师并投诉这件事。\n\
  c) 老师说，如果你专注于学习，你将在考试中获得优异的成绩。\nd) Golu 说，如果我爸爸给我一个手机，我就会学习编程。\ne) Nidhi 在想，如果我能学会\
  \ Java 编程，那么我的目标就是开发一个 App。\n\n# 程序场景\n\n以下是不同的程序场景……\n\n## 场景 1 (带有或不带只有 if 条件的\
