  \ 子句：\n\n当存在多个 `else` 条件时，使用 `else-if` 语句。\n\n`else-if` 子句并没有不同；它只是将 `else` 与紧随其后的\
  \ `if` 重新排列。\n\n`else-if` 语句写在待评估的 `else-if` 条件之后的 `else-if` 块内部。\n\n`else-if` 条件必须包含可以作为布尔值评估的值。\n\
  \n`else-if` 块括号是可选的。\n\n在程序中，可以只有一个 `else-if` 块或多个 `else-if` 块，取决于条件。\n\n其通用形式如下...\n\
  \n```java\nif(condition)\n    statement;\nelse if(condition)\n    statement;\n```\n\
  \n#### else-if 流程的工作原理：\n\n![](img/image_rsrc2XBY.jpg)\n\n如图 6.9 所示，当使用 `if` 和 `else\
  \ if` 语句编写程序时，必须检查某些条件。\n\n首先，在 `if` 条件之前，所有的语句都将被执行。\n\n当控制到达 `if` 条件时，将根据需要检查括号内的条件。\n\
  \n如果条件通过，将执行 `if` 块内部的语句。\n\n所有其他 `else-if` 块将被跳过，因为 `if` 条件已经通过。\n\n在执行 `if` 块后，最后一个\
  \ `else-if` 块之后的所有语句将直接执行。\n\n如果 `if` 内部的条件失败，`if` 块将不会执行，控制将直接到达第一个 `else-if` 块。\n\
  \n现在，将验证第一个 `else-if` 的检查。\n\n如果第一个 `else-if` 检查的条件通过，将执行该块内部的语句。\n\n假设第一个 `else-if`\
  \ 内部的条件失败。在这种情况下，如果使用了后续的 `else-if` 条件，将逐一验证。\n\n如果任何特定的 `else-if` 条件通过，将执行该特定的\
  \ `else-if` 块，并跳过所有其他块。\n\n再次，这里最后一个 `else-if` 块之后的所有语句将被执行。\n\n以下是几个代表日常使用场景的语句。可以使用逻辑运算符来表示...\n\
