  ```java\npublic class CheckDivisibleEvenProgram_1 {\n    public static void main(String[]\
  \ args) {\n        int num = 130;\n        if(num % 30 == 0 && num % 2 == 0) {\n\
  \            System.out.println(num + \" is divisible by 30 and is an Even number\"\
  );\n        } else if((num % 30 == 0 && !(num % 2 == 0))) {\n            System.out.println(num\
  \ + \" is divisible by 30 but not an Even number\");\n        } else if((num % 30\
  \ != 0 && num % 2 == 0)) {\n            System.out.println(num + \" is not divisible\
  \ by 30 but is an Even number\");\n        }\n    }\n}\n```\n\n**输出：**\n`130 is\
  \ not divisible by 30 but is an Even number`\n\n**解释：**\n在此程序中，变量 `num` 被声明为 `int`\
  \ 类型并初始化为 `130`。题目要求检查一个数字是否被 30 整除以及是否为偶数。\n\n在第一个 `if` 检查中，验证结果为：`num` 为 `130`，其对\
  \ `30` 取模不等于 `0`，且对 `2` 取模等于 `0`，因此其中一个条件为假，所以 `if` 块将不会被执行。\n\n\n\n除 `2` 等于 `0`，因此一个条件为假，`if`\
  \ 块将不会执行。\n\n在第一个 `else-if` 块中，再次验证了条件。`num` 为 `30`，对 `30` 取模不等于 `0`，且对 `2` 取模等于\
  \ `0`，但 `true` 的 `NOT` 结果为 `false`，所以这里两个条件均为假，第一个 `else-if` 块将不会执行。\n\n在第二个 `else-if`\
  \ 块中，验证了条件。`num` 为 `30`，对 `30` 取模不等于 `0`，结果为 `true`，且对 `2` 取模等于 `0`，结果也是 `true`，所以这里两个条件均为\
  \ `true`；第二个 `else-if` 块将执行。`sysout` 语句将打印 `num` 的值以及消息。\n\n因此，输出为 `130` 不能被 `30`\
  \ 整除但是一个偶数。\n\n## 2) 编写一个 Java 程序，检查一个数字是否能被 3 整除且为奇数，或者是一个 4 位数。考虑数字为 `999`。\n\n\
  ```java\npublic class CheckDivisibleAndOddAndConsistsOf4DigitProgram_2\n{\n    public\
  \ static void main(String[] args)\n    {\n        int num = 999 ;\n        if((num\
