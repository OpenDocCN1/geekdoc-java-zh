  5 的乘法表：\n5\n10\n15\n20\n25\n```\n**解释：**\n在这个程序中，`main` 方法内部声明了一个类型为 `int` 的变量 `i`\
  \ 并初始化为 1。另一个类型为 `int` 的变量 `n` 被声明并初始化为 5。问题要求是打印到 5 的所有乘法表。第一个 `sysout` 语句将打印该消息。`do-while`\
  \ 循环在 `i` 小于等于 5 的情况下运行，每次打印 `n * i` 的结果并让 `i` 自增。\n\n\n\n\n在 `do-while` 循环中，第一次迭代始终会在没有任何任何验证的情况下执行，因此内部的\
  \ `sysout` 语句将打印表达式的结果，并且 `i++` 将每次迭代中增加 `i` 的值。\n\n从下一次迭代开始，`i` 将比较它是否小于等于 `5`。如果检查通过，则\
  \ `sysout` 语句将在增加 `i` 的值后打印表达式的结果。\n\n为了更清晰地了解 `do-while` 循环的工作原理，让我们理解下面的迭代场景：\n\
  \n- 在第 2 次迭代中，当 `i = 1` 时，`i = 1` 且 `i = i+1 = 1+1 = 2`。\n- 在第 2 次迭代中，当 `i = 2`\
