  \ 和 `class4` 属于 `Package2`。\n\n每个类可以有一个或多个方法。`class1` 和 `class4` 只有一个方法，而 `class2`\
  \ 和 `class3` 有两个方法。\n\n每个方法可以有一组不同的待执行语句。\n\n图 5.2 显示了项目视图 (Project View)。IDE 中的每个\
  \ Java 程序都写在项目内部。IDE 是集成开发环境，我们将在本章稍后介绍 IDE。\n\n在 IDE 中，可以创建任意数量的项目。在这里，创建了 `0-JavaInterview`\
  \ 和 `1-Java_Level_1_Beginners_Course` 项目。\n\n![](img/image_rsrc2XBB.jpg)\n\n每个项目可以包含一个或多个包。`com.Chapter_2`\
  \ 和 `com.Chapter_3` 是创建的两个包。\n\n每个包可以有任意数量带有 `.java` 扩展的文件。图中显示了六个 Java 文件，如 `CharacterConstant_3`、`Exercise`\
  \ 等其他。\n\n*(注：由于原文中存在大量重复的段落，译文已根据要求去重处理，仅保留核心内容)*\n\n\n\n\n```java\npublic static\
  \ void main(String[] args)\n```\n\n### i) static\n`main()` 方法前面总是跟着 `static` 关键字。\n\
  `static` 是一个关键字。\n如果我们将任何方法声明为 `static`，它被称为静态方法。\n图 5.3 显示了如何使用 `static` 关键字。\n\
  如果我们不在 `main()` 方法中使用配合 `static` 关键字，我们的程序将无法运行。\n`static` 用于更好的内存管理。\n我们将在第 2 级（即中级课程）学习更多关于\
  \ `static` 部分。\n\n### j) void\n`void` 是方法的返回类型。返回类型意味着输出。\n`void` 意味着方法不返回任何值。没有输出情况。\n\
  由于我们不希望从 `main()` 函数返回任何值，因此必须在 `main()` 之前使用 `void` 关键字进行指定。\n我们不能在不使用返回类型的情况下编写函数。\n\
  图 5.3 显示了如何将 `void` 作为返回类型。\n本课程第 1 级仅限于 `void` 返回类型。我们将在第 2 级（即中级课程）中看到更多返回类型，如\
  \ `int`、`float`、`double` 以及方法可以返回的其他数据类型。\n\n### k) []\n方括号 `[]` 用于数组的声明和数组元素的选择。\n\
  `Array` 任意类型的集合。我们将在第 2 级（即中级课程）学习更多关于 `Array`。\n图 5.3 显示了如何使用方括号 `[]`。\n\n### l)\
  \ String[]\n`String[] args` 或 `String args[]` 用于命令行参数。\n命令行参数是通过将参数作为方法参数传递给程序来提供输入。\n\
  在这一级，我们还没有涵盖任何通过命令行提供输入的程序。我们将在第 2 级（即中级课程）学习并查看如何使用它。\n我们使用 `String[] args` 向 `main()`\
  \ 方法传递多个参数。\n`String[] args` 意味着传递给主函数的字符序列（`Strings`）的数组。\n图 5.3 显示了如何使用 `String`\
  \ 数组来接受多个参数。我们将在第 2 级（即中级课程）学习更多关于 `Array` 的知识。\n\n### m) args\n`args` 所有传递给 `main()`\
  \ 方法的参数。\n它包含一个字符序列（`Strings`）的数组，可以在方法中使用。\n图 5.3 显示了如何传递参数。\n\n### n) System\n\
  它是一个类。因为它是一个类，所以它内部包含一个方法。\n`System` 类用于标准输入和标准输出。\n通过使用 `System` 类，我们可以打印程序的输出。\n\
  图 5.3 显示了如何将 `System` 作为类使用。\n\n### o) out\n`out` 是在 `System` 类中定义的 `static` 对象。\n\
  `out` 是 `System` 类的一个实例。\n我们将在第 2 级（即中级课程）学习静态对象和实例。\n图 5.3 显示了在何将 `out` 作为 `static`\
  \ 对象使用。\n\n### p) println()\n与其他语言不同，Java 并不包含任何在屏幕上显示输出的指令。\n所有到屏幕的输出都是通过现成的库函数实现的。其中一个函数就是\
  \ `println()`。\n`println()` 是 `PrintStream` 类的一个函数。\n每个 `println()` 函数的输出都会出现在新行。\n\
  `println()` 不仅可以打印变量的值，还可以打印表达式的结果。\n如果我们想将一个 `println()` 函数的输出分成两行，可以使用转义序列 `'\\\
  n'`。\n当我们想要在单独的行上正确格式化输出时，`'\\n'` 非常有用。\n我们也可以用 `print()` 代替 `println()`，但输出不会出现在新行中。\n\
  图 5.3 显示了在何处使用 `println()` 来打印输出。\n\n### q) Double quotes\n双引号用于封装引用的内容 `\" \"`。\n\
  双引号用于表示 `String`，并用于传递一些要在输出中打印的信息。\n图 5.3 显示了在何处使用双引号。\n\n### r) System.out.println()\n\
  当我们希望在屏幕上显示输出时，我们使用 `System.out.println()`。\n`System.out.println()` 用于打印语句。\n这里，`System`\
  \ 是一个类，`out` 是 `PrintStream` 类的对象，而 `println()` 是 `PrintStream` 类的一个方法。\n我们在双引号括号内写的任何内容将显示在字符串中。\n\
  注意：为了解释从这一章开始的所有程序，我们将使用 `sysout` 单词来代表打印输出的 `System.out.println()`。\n图 5.3 显示了在何处使用\
  \ `sysout` 语句。我们可以根据需要在一个程序的任何地方使用它。\n\n### s) Program Comments\n在 Java 中，程序中经常使用注释来解释\
  \ Java 代码，并使其更具可读性。\n这有助于读者更好地理解为什么写这段代码以及它的用途是什么。\n虽然注释不是必须的，但在程序开始处使用指示程序目的的注释是一个良好的习惯。\n\
  在程序的任何地方都可以编写任意数量的注释。\n注释不能嵌套。\n注释可以用两种方式编写：\n\n#### i) Single-line Comments（单行注释）\n\
  单行注释以两个正斜杠 (`//`) 开始。\n`//` 与行尾之间的任何文本都会被 Java 忽略（不会执行）。\n\n#### ii) Multi-line\
  \ Comments（多行注释）\n多行注释以 `/*` 开始，以 `*/` 结束。\n`/*` 与 `*/` 之间的任何文本会被 Java 忽略。\n多行注释可以跨多行划分。\n\
  \n### 6 Program Scenarios（程序场景）\n\n```java\n// Scenario 1: Single-line comment\n\
