  \ `int` 数据类型。没有用于表示 `byte` 类型的后缀（Suffixes）。`byte` 和 `Byte` 都可以表示 `byte` 数据类型。图 3.3\
  \ 也突出了 `byte` 数据类型的重要点。\n\n以下是声明 Java `byte` 整数类型表示的最简单语法……\n\n```java\nbyte variable_name\
  \ = value;\n```\n\n在赋值期间，`byte` 的值不应超过变量的范围。在需要节省内存的地方使用 `byte` 数据类型可以节省内存，因为 `byte`\
  \ 比整数小四倍。\n\n**合法的 byte 类型表示：**\n```java\nbyte b1 = 25; // byte 类型可以是 -128 到 +127\
  \ 范围内的数字\nbyte b2 = -28; // byte 类型可以是 -128 到 +127 范围内的负数数字\nbyte b3 = +27; // byte\
