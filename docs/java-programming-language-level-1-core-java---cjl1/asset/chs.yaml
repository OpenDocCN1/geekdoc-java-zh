  \            case 3 :\n                System.out.println(\"This is case 3\");\n\
  \        }\n    }\n}\n```\n\n##### 不带 case 的程序\n```java\nclass Scenario_1_1\n{\n\
  \    public static void main(String[] args)\n    {\n        int i = 3 ;\n      \
