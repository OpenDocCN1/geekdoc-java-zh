  任何任务都是通过向其传递指令（Instructions）来执行的。指令指定了如何执行任何特定任务。\n\n\n\n\n现在，`i15` 的值 21 被赋值给它的左侧（LHS）`i14`，即\
  \ `i14 = i15 = 21`。\n\n同样，`i14` 的值（现在为 21）被赋值给它的左侧 `i13`，即 `i13 = i14 = 21`。\n\n\
  `i13` 的值（现在为 21）被赋值给它的左侧 `i12`，即 `i12 = i13 = 21`。\n\n最后，`i12` 的值（为 21）现在被赋值给它的左侧\
  \ `i11`，即 `i11 = i12 = 21`。\n\n### 示例 7\n```java\nint i21 = 99, i22 = i21 + 3;\n\
  ```\n**解释：**\n声明了两个 `int` 类型的变量 `i21` 和 `i22`，并用逗号分隔。\n\n值 `99` 被赋值给变量 `i21`。现在变量\
  \ `i21` 的值是 `99`。\n\n第二个变量 `i22` 是 `i21` 和 `3` 的和。由于 `i21` 的值已经设置为 `99`，因此 `i22`\
  \ 的值是 `99 + 3 = 102`。\n\n### 示例 8\n```java\nfloat ii22 = 1.1f, ii23 = ii22 + 2.1f;\n\
  ```\n**解释：**\n声明了两个 `float` 类型的变量 `ii22` 和 `ii23`，并用逗号分隔。\n\n值 `1.1f` 被赋值给变量 `ii22`。变量\
  \ `ii22` 现在持有值 `1.1f`。\n\n第二个变量 `ii23` 是 `ii22` 和 `2.1f` 的和。由于 `ii22` 的值已经设置为 `1.1f`，因此\
  \ `ii22` 是 `1.1f` 和 `2.1f` 的和。\n\n以下是某些无效类型声明指令表示……\n\n### 示例 9\n```java\nint ii1\
  \ = ii2 = ii3 = ii4 = ii5 = 21; // 错误\n```\n**解释：**\n在这个示例中，没有给计算机关于 `ii2`、`ii3`、`ii4`\
  \ 和 `ii5` 代表什么的指令。\n\n在 Java 中，在使用任何变量之前，我们必须写一个指示变量数据类型的语句。\n\n由于赋值是从右侧开始的，在赋值值之前\
  \ `ii5` 尚未声明。因此，计算机需要说明并显示错误。\n\n### 示例 10\n```java\nint ii6 = ii7 + 99, ii7 = 1;\
  \ // 错误\n```\n**解释：**\n在这个示例中，尚未给计算机关于 `ii7` 代表什么的指令。\n\n在 Java 中，在使用任何变量之前，我们必须写一个指示变量数据类型的语句。\n\
  \n由于赋值是从右侧开始的，在加上 `99` 之前 `ii7` 尚未声明。因此，计算机需要说明并显示错误。\n\n### 示例 11\n```java\nfloat\
  \ ii8 = ii9 + 1.1f, ii9 = 2.1f; // 错误\n```\n**解释：**\n同样，如示例 10 所示，在加上 `1.1f` 之前\
  \ `ii9` 尚未声明。因此，计算机感到困惑并显示错误。\n\n![](img/image_rsrc2XB8.jpg)\n\n### 3) 算术指令\n在第\
  \ 2 章中，我们学习了如何定义变量。定义变量意味着我们正在向计算机传递关于变量及其数据类型的指令。\n\n因此，一个 Java 算术指令由 `=` 左侧的变量名以及\
  \ `=` 右侧的变量名和常量组成。我们已经见过许多如何编写算术表达式的示例。\n\n加法、减法、乘法和除法等算术运算符连接了 `=` 右侧的变量和常量。\n\n\
  `*`、`/`、`-`、`+` 是算术运算符，而 `=` 是赋值运算符。\n\n在 Java 中，变量和常量统称为操作数。执行算术语句时，右侧的操作数通过运算符进行处理，然后使用赋值运算符将结果赋值给左侧的变量。Java\
  \ 允许 `=` 左侧仅有一个变量。\n\n算术操作可以在 `ints`、`floats` 和 `chars` 上执行。没有用于执行幂运算的运算符。\n\n一个\
  \ Java 算术语句可以是三种类型之一。如下……\n\na) 整数模式算术语句\nb) 实数模式算术语句\nc) 混合模式算术语句\n\n#### a) 整数模式算术语句\n\
  这是一种算术语句，其中所有操作都是整数变量或常量。以下是一些有效的整数模式语句……\n\n**示例 1**\n```java\nint i1 = 14;\nint\
  \ i2;\ni2 = i1;\nint i3 = (i1 + i2 + 1) * 0;\n```\n**解释：**\n这展示了如何编写整数模式算术语句。所有变量\
  \ `i1`、`i2` 和 `i3` 都是 `int` 类型。在第一条语句中，`i1` 初始化为值 `14`。在第二条语句中，声明了 `i2`。在第三条语句中，`i3`\
  \ 为 `(i1 + i2 + 1) * 0`。\n\n#### b) 实数模式算术语句\n这是一种算术语句，其中所有操作都是实数常量或实数变量。以下是一些有效的实数模式语句……\n\
  \n**示例 1**\n```java\nfloat ii1 = 14.0f;\nfloat ii2;\nii2 = ii1;\nfloat ii3 = (ii1\
  \ + ii2 + 1.0f) * 0.0f;\n```\n**解释：**\n这展示了如何编写实数模式算术语句。所有变量 `ii1`、`ii2` 和 `ii3`\
  \ 都是 `float` 类型。在第一条语句中，`ii1` 初始化为值 `14.0f`。在第二条语句中，声明了 `ii2`。在第三条语句中，`ii3` 为 `(ii1\
  \ + ii2 + 1.0f) * 0.0f`。\n\n#### c) 混合模式算术语句\n这是一种算术语句，其中部分操作数是整数，部分是实数。\n\n![](img/image_rsrc2XB9.jpg)\n\
  \n### 4) 控制指令\n控制指令允许我们指定计算机执行程序中各种指令的顺序。\n\n控制指令决定了程序的控制流。\n\nJava 中有四种控制指令……\n\
  \na) 顺序控制指令\nb) 选择或决策控制指令\nc) 重复或循环控制指令\nd) 分支控制指令\n\n◆◆◆\n\n### 练习:-\n1) 空：\n\n\
