  \ 2\n```\n\n### 字符串常量\n\n字符串常量指的是双引号（`\"`）包围的任意数量字符的序列。字符可以是字母、数字、特殊字符。字符串常量可以包含任意数量的空格。算术运算符后允许有空格。如果存在字符串引号（`\"\
  `），运算符将不会执行任何操作。我们可以在字符串常量之间进行算术运算。我们不能在字符串常量之间进行减法和取模运算。\n\n是一些有效的字符串常量...\n\n\
  ```text\n\" Shine Rise \" // 字符串常量可以是中间带有空格的单词\n\"21\"         // 字符串常量可以是数字\n\"\
  \ \"          // 字符串常量可以只有一个空格\n\"\"           // 字符串常量也可以是空的\n\"A\"          //\
  \ 字符串常量可以是单个字母\n\"@$\"         // 字符串常量可以包含任意数量的符号\n\"+\"          // 字符串常量可以是单个运算符\n\
  \"21 + 1\"     // 字符串常量可以是带有符号的数字\n\"21  1\"      // 字符串常量可以是带有空格的数字\n```\n\n以下是一些无效的字符串常量...\n\
  \n```text\n' Shine ' // Error: 字符串常量应被 \" \" 包围\n\"20981' // Error: 字符串常量应被 \" \"\
  \ 包围\n```\n\n\n\n\n\n```\n\" ' // Error: 字符串常量应包含在 \" \" 之间\n```\n\n以下是部分有效的字符串常量表达式...\n\
  \n```\n\"J\" + \"A\" + \"V\" + \"A\"        // 字符串常量之间可以进行加法等算术运算\n\" s \" + \"\
