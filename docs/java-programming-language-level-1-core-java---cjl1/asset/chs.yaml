  ```\n\n以下是部分无效的字符串常量表达式...\n\n```\n\"s\" * \"a\"                    // Error: 字符串常量之间不能进行乘法等算术运算\n\
  \"s\" - \"a\"                    // Error: 字符串常量之间不能进行减法等算术运算\n\"s\" / \"a\"   \
