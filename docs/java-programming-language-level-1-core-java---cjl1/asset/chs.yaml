  \ Instructions)\n\n这是另一种特殊的控制语句，允许我们在不同的备选项之间进行选择。我们在第 6 章中已经看到了其他类型的控制指令。所有的程序也可以表示\
  \ Java 中的 `switch` 控制指令。\n\n### 1) break 语句\n\n`break` 语句用于中断任何循环或分支控制指令的执行。考虑到第\
  \ 1 级内容的简单性，我们尚未涵盖用于循环控制指令的 `break`，但我们将对 `switch` 控制语句简单介绍 `break`，因为在这里需要使用。我们将在高级课程中学习更多关于它以及相关的程序。在\
  \ `switch` 中使用 `break` 语句时，会将控制转移到 `switch` 之外。\n\n### 2) switch 控制指令:\n\nswitch\
  \ 控制指令是一种允许我们决定所提供的选项数量的控制语句。`switch` 和 `case` 是 Java 中的关键字。`switch-case-default`\
  \ 是组成该控制语句的三个关键字。我们可以在 `switch` 和 `case` 内部使用整数、布尔、`String` 和 `char` 值。\n\n通用形式如下...\n\
  \n```java\nswitch(expression)\n{    \n    case value1:\n        statements;\n  \
  \      break;\n    case value2:\n        statements;\n        break;\n    default:\n\
  \        statements;\n        break;\n}\n```\n\n- `expression` 应该返回整数、布尔、`String`\
  \ 或 `char` 类型的结果。\n- `case` 语句用在 `switch` 语句之后。\n- 至少使用一个 `case` 语句。\n- 如果每个 `case`\
  \ 有多个状态，则大括号是可选的。\n- `case` 使用没有特定顺序。可以保持任何顺序。\n- 根据传递到 `switch` 条件的变量类型，每个 `case`\
  \ 应该有一个唯一的值。\n- `default` 语句最后使用；如果任何 `case` 都不满足，将执行 `default` 语句。\n- 我们之前看到的所有\
  \ `if` 条件都可以用 `switch` 语句表示。\n- `switch` 语句也可以用在另一个 `switch` 内部，称为 `switch` 嵌套。就像我们见过的\
  \ `if-else` 嵌套和循环嵌套一样。指示 `switch` 条件流程的流程图如图 8 所示...(image_rsrc2XCC.jpg)\n\n###\
  \ 分支指令的工作原理:\n\n当我们运行一个包含 `switch` 的程序时会发生什么？首先，计算关键字 `switch` 后的表达式。它得到的值与 `case`\
  \ 语句后面的常量值进行逐一匹配。当找到匹配项时，程序执行直到遇到初始 `break` 之后的语句。遇到 `break` 时，控制转移到 `switch` 之外。如果没有找到任何匹配项，则执行任何\
  \ `default` 内容。\n\n以下是几个表示日常用途的语句。这些可以使用 `if` 条件来表示...\na) 从不同的单选题中选择一个。\nb) 妈妈，我今天应该步行、骑自行车或坐公交去学校。\n\
  c) 老师，我应该在移动设备、笔记本电脑还是平板电脑上运行程序？\n\n#### A) 程序场景 -\n\n#### 场景 1 (Java 程序或不带 case)\n\
