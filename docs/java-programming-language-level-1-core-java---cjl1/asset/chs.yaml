  \n![](img/image_rsrc2XC9.jpg)\n\n### 4) 循环的嵌套:\n与 `if` 语句可以嵌套一样，`while` 和 `for`\
  \ 循环也可以嵌套。其中一种通用形式如下：\n\n```java\nfor(initialization, condition, increment/decrement)\n\
  {\n    initialization\n    while(condition)\n    {\n        // statements\n    \
  \    increment/decrement\n    }\n}\n```\n\n#### 嵌套循环的执行流程:\n![](img/image_rsrc2XCA.jpg)\n\
  \n如图 7.4 所示，当使用嵌套的 `for` 或 `while` 循环编写程序时，都会发生迭代。如果使用了 `for` 循环，格式将与之前指定的相同。同样，`while`\
  \ 循环也将使用之前指定的格式。\n\n可以存在多个 `for` 循环的嵌套、多个 `while` 循环的嵌套，或者 `for` 循环与 `while` 循环的组合。同样，所有条件将在每次循环中进行验证，且迭代器的值将根据指定的指令不断增加或减少。\n\
  \n如图中所示，如果条件 1 失败，控制将跳出循环。如果条件 1 通过，控制将进入内部循环并验证内层循环的条件 2。同样，如果条件 2 为真，只要比较为真，循环就会继续迭代，计数器也将不断更新。当内层循环的所有迭代完成后，外层循环条件\
  \ 1 将进行递增验证。当执行内层循环时，控制将传递给外层循环检查另一个条件。同样，内层循环将开始，直到对新的更新值进行比较。这个过程一直持续到外层和内层循环的比较都满足。如果外层循环执行完毕，控制将通过外层语句，并执行后续语句。\n\
  \n以下是几个代表现实场景的语句。这些可以使用嵌套循环表示：\n- **时钟**：时钟按小时为单位旋转。每小时有 60 分钟，每分钟有 60 秒。因此这里需要三个循环。小时是外层循环；分钟是第一个内层循环，秒是分钟的第二个内层循环。\n\
  - **地球**：地球每 365 天绕太阳运行一次。地球需要 24 小时完成绕自轴旋转。因此，绕太阳运行是外层循环，完成一天是内层循环。这代表了两个循环。\n\
  - **ATM**：从 ATM 取款 50,000。ATM 每次限额为 10,000。因此，将使用五个循环来提取总金额。\n\n（注：原文后续包含大量重复的示例代码和不完整的描述，已按要求完成核心逻辑翻译。）\n\
