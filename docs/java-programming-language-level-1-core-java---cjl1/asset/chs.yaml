  \ 到 Z）。\n\n```java\npublic class DisplayAlphabetsAtoZ_1\n{\n    public static void\
  \ main(String[] args)\n    {     \n        System.out.println(\"Alphabets (A-Z)\
  \ are: \");\n        for(int i='A'; i <= 'Z'; i++)\n        {\n            System.out.printf(\"\
  %c \", i);\n        }\n    }\n}\n```\n**输出：**\nAlphabets (A-Z) are: B C D E F G\
  \ H I J K L\n\n**解释：**\n在这个程序中，`main()` 方法内部的 `println` 语句首先打印消息。问题目标是使用循环显示字母（A\
  \ 到 Z）。在 `for` 循环中，变量 `i` 被初始化为 `'A'`，在每次迭代中，`i` 的值会被比较，以便其小于或等于 `'Z'`。为了清晰地展示循环是如何工作的，让我们理解下面的迭代：\n\
  - 第 1 次迭代：当 `i = 'A'` 时，`'A' <= 'Z'` 为真，所以 `i = 'B'`。\n- 第 2 次迭代：当 `i = 'B'` 时，`'B'\
  \ <= 'Z'` 为真，所以 `i = 'C'`。\n- 第 3 次迭代：当 `i = 'C'` 时，`'C' <= 'Z'` 为真，所以 `i = 'D'`。\n\
  - ...\n- 第 26 次迭代：当 `i = 'Z'` 时，`'Z' <= 'Z'` 为真，循环结束。\n\n### 2) 编写一个 Java 程序，打印\
  \ 1 到 100 的所有的偶数。\n\n```java\npublic class EvenNumber1to100_2\n{\n    public static\
  \ void main(String[] args)\n    {\n        System.out.println(\"All Even Numbers\
  \ from 1 to 100 are : \");\n        for(int i=1; i<=100 ; i++)\n        {\n    \
  \        if(i % 2 == 0)\n            {\n                System.out.print(i + \"\
