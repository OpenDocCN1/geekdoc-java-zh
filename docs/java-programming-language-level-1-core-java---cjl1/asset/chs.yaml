  \ = 2` 且 `i = i+1 = 2+1 = 3`。\n- 在第 3 次迭代中，当 `i = 3` 时，如果 `3 < 6` 则 `i = 3` 且 `i\
  \ = i+1 = 3+1 = 4`。\n- 在第 4 次迭代中，当 `i = 4` 时，如果 `4 < 6` 则 `i = 4` 且 `i = i+1 = 4+1\
  \ = 5`。\n- 在第 5 次迭代中，当 `i = 5` 时，如果 `5 < 6` 则 `i = 5` 且 `i = i+1 = 5+1 = 6`。\n-\
  \ 在第 6 次迭代中，当 `i = 6` 时，如果 `6 < 6` 则不成立，因此循环终止。\n\nD) 更多问题 -\n编写一个 Java 程序打印 1 到\
