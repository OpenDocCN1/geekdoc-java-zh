  \      }\n            i++;\n        }\n        System.out.println(\"GCD of \" +\
  \ num1 + \" and \" + num2 + \" is : \" + gcd);\n    }\n}\n```\n\n**输出：**\n5 和 7\
  \ 的 GCD 为：1\n\n### 解释\n在此程序中，在 `main()` 方法内部，首先将变量 `num1`、`num2` 和 `gcd` 分别初始化为\
  \ 5、7 和 1。\n\n问题描述是求两个数的最大公约数。GCD 是两个数的最小公倍数。\n\n变量 `i` 被初始化为值 1，用于循环迭代。\n\n在 `while`\
  \ 循环中，会验证一个条件并比较 `i` 的值，即 `i` 应该小于或等于 `num1`（即 5）和 `num2`（即 7），因此如果比较成立，将进行 5 次迭代。\n\
  \n在 `while` 循环内部，每次迭代中，`num1` 和 `num2` 分别对 `i` 进行模运算，如果结果为 0，则该特定的 `i` 被视为两个数 `num1`\
  \ 和 `num2` 的 GCD。最后，`sysout` 语句将带有消息打印 GCD。\n\n为了更清楚地了解循环是如何工作的，让我们来看下方的迭代场景：\n\n\
