  \        }\n        else\n        {\n            System.out.println(num + \" is\
  \ not divisible by 11\");\n        }\n    }\n}\n```\n\n**输出：**\n`87 is not divisible\
  \ by 11`\n\n\n\n\n\n在此程序中，声明了一个类型为 `int` 的变量 `num` 并将其初始化为 `87`。\n\n问题是检查一个数字是否能被另一个数字整除。\n\
  \n在 `if` 检查中，验证条件 `num` 为 `87`，而它不能被 `11` 整除；条件将为 `false`，`if` 块将不会执行。\n\n因此，如果\
  \ `if` 块不可达，`else` 块中的 `sysout` 语句将打印 `num` 的值以及一条消息。\n\n因此，输出为 `87 is not divisible\
  \ by 11`。\n\n## C) 输出问题\n\n### 问题 1\n\n```java\npublic class Problem_1 {\n    public\
  \ static void main(String[] args) {\n        int num = 1;\n        if((num+1) ==\
  \ (1-num)) {\n            System.out.println(\"Equal\");\n        }\n        else\
  \ {\n            System.out.println(\"Not Equal\");\n        }\n    }\n}\n```\n\
  **输出：**\n`Not Equal`\n\n**解释：**\n在这个问题中，变量 `num` 被声明为 `int` 类型并初始化为值 `1`。\n\n在 `if`\
  \ 条件中执行了两个操作。第一个是 `(num+1)`，即给 `num` 加 `1`，第二个是用 `1` 减去 `num`。因此，`num+1` 等于 `1+1\
  \ = 2`，而 `(1-num)` 等于 `1-1 = 0`。\n\n当使用 `==` 运算符比较 `(num+1)` 和 `(1-num)` 时（即 `1\
  \ == 0`），条件将为 `false`。因此，如果第一个 `if` 检查失败，将执行 `else`，`sysout` 将打印输出。\n\n因此，输出为 `Not\
  \ Equal`。\n\n### 问题 2\n\n```java\npublic class Problem_2 {\n    public static void\
  \ main(String[] args) {\n        long num1 = 21;\n        Integer num2 = 21;\n \
  \       if(num1 == num2) {\n            System.out.println(\"Equal\");\n       \
  \ }\n        else {\n            System.out.println(\"Not Equal\");\n        }\n\
  \    }\n}\n```\n**输出：**\n`Equal`\n\n**解释：**\n在这个问题中，两个变量 `num1` 和 `num2` 分别被声明为\
  \ `long` 和 `Integer` 类型，并初始化为相同的值即 `21`。\n\n在 `if` 条件中，当使用 `==` 运算符比较 `num1` 和 `num2`\
  \ 时，由于两者相等，条件将为 `true`。因此，如果第一个检查通过，`sysout` 将打印输出，`else` 语句将不会执行。\n\n因此，输出为 `Equal`。\n\
  \n### 问题 3\n\n```java\npublic class Problem_3 {\n    public static void main(String[]\
