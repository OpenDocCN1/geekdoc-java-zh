  byte b5 = -27; // byte 可以是 -128 到 +127 范围内的 Byte\n```\n\n**更多合法的 byte 类型表示：**\n\
  ```java\nbyte b6;\nb6 = -27; // 先完成 b6 的声明，然后在单独的语句中赋值\nbyte b7 = -127; // 语句的每个部分都可以在单独的一行\n\
