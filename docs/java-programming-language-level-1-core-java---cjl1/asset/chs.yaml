  在 `while` 条件中，变量 `i` 应该大于 1，因此 `sysout` 语句将在每次迭代中打印 `i` 的值，并且 `i` 的值将减 1。\n\n为了更清晰地理解循环此处工作的，让我们理解下方的迭代\
