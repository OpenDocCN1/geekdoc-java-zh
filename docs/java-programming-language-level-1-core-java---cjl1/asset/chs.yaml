  \ eligible to take Java-Course`。\n\n### 4) if-else 语句\n\n`if-else` 语句是 `if` 语句的扩展，它使用了另一个代码块，即\
  \ `else` 块。如果 `if` 块的条件被评估为假，则执行 `else` 块。\n\n`if` 条件之后但不包含 `else` 块的语句组被称为 `if`\
  \ 块。同样，`else` 之后的语句形成了 `else` 块。`else` 正好写在 `if` 块下方。\n\n如果 `if` 块中只需要执行一条语句，`else`\
  \ 块中也只有一条语句，我们可以省略大括号。通用格式如下……\n\n```\nif (condition)\n    statement;\nelse\n  \
  \  statement;\n```\n\n#### if-else 流程原理\n\n![](img/image_rsrc2XBS.jpg)\n\n如图 6.4\
  \ 所示，当使用 `if-else` 语句编写程序时，必须检查某些条件。\n\n1. 首先，在 `if` 条件之前，所有语句都将被执行。\n2. 当控制流到达\
  \ `if` 条件时，它将根据需要检查括号内的条件。\n3. 如果条件通过，将执行 `if` 块内部的语句。由于 `if` 条件已经通过，将跳过 `else`\
  \ 块。\n4. 执行 `if` 块后，将直接执行 `else` 块之后的语句。\n5. 如果 `if` 内部的条件失败，`if` 块将不会执行，控制流将直接到达\
  \ `else` 块。`else` 块内的所有语句将被执行。\n6. 再次，如果执行了 `else` 块，将执行 `else` 块之后的语句。\n\n以下是几个代表日常使用场景的语句。可以使用\
  \ `if-else` 条件来表示……\n\n1. 妈妈，如果今天的校车没来接我怎么办？妈妈回答说，如果爸爸有空，他会送你去学校；否则，我会送你去上学。\n2.\
  \ 爸爸，如果 Rohan 在班级里打我怎么办？然后爸爸说你应该向老师投诉这件事；否则，Rohan 每隔一天就会打你一次。\n3. 老师说，如果你专注于学习，你将在考试中获得优异的成绩；否则，校长会责备你。\n\
  4. Golu 说，如果我爸爸给我一个手机，我会在他的手机上上学编程；否则，我会在朋友的手机上学。\n5. Nidhi 在想，如果我能学习 Java 编程，我就可以开发一个\
  \ App；否则我就做不到。\n\n#### A) 程序场景 -\n\n以下是不同的程序场景……\n\n###### 场景 1（带有或不带单个 if-else\
