  ```\n Shine N Rise \n21 1\nJAVA\nss+/\n++++-\n```\n\n### 问题 1\n\n```java\npublic\
  \ class Problem_1 {\n    public static void main(String[] args) {\n        int a1\
  \ = 21 ;\n        int a2 = 9999 ;\n        System.out.println((a1+2) + \" \" + (a2*0));\n\
  \        System.out.println((a1*4) + \" \" + (a2-999));\n        System.out.println((a1%3)\
  \ + \" \" + (a2/9));\n        System.out.println((a1+a2)*(a2-a1) + \" \" + (a2%a1));\n\
  \        System.out.print(\" \" + a1 + \" \" + a2);\n    }\n}\n```\n**输出:**\n```\n\
  23 0\n84 9000\n0 1111\n99979560 3\n21 9999\n```\n**解释:**\n首先，创建了两个变量 `a1` 和 `a2`\
  \ 并分别赋值为 `21` 和 `9999`。在第一个 `println` 语句中，`a1` 被加了 2，`a2` 被乘以了 0。第二个 `println` 语句中\
  \ `a1` 乘以 4，`a2` 减去 999。第三个 `println` 语句中 `a1` 对 3 取模数，`a2` 除以 9。第四个 `println` 语句计算\
  \ `(a1+a2)` 乘以 `(a2-a1)`，以及 `a2` 对 `a1` 取模数。最后打印 `a1` 和 `a2`。\n\n### 问题 2\n\n```java\n\
  public class Problem_2 {\n    public static void main(String[] args) {\n       \
  \ int first = 4 ;\n        int second = 99 ;\n        System.out.println(\"The value\
  \ of first is \" + first + \" and \" + second);\n        int third = second ;\n\
  \        second = first ;\n        first = third ;\n        System.out.println(\"\
  The value of first becomes \" + first + \" and the value of second becomes \" +\
  \ second);\n    }\n}\n```\n**输出:**\n```\nThe value of first is 4 and 99\nThe value\
  \ of first becomes 99 and the value of second becomes 4\n```\n**解释:**\n在该程序中，定义了三个\
  \ `int` 类型变量 `first`、`second` 和 `third`。`first` 和 `second` 分别初始化为 `4` 和 `99`。在这里，第一个\
  \ `println` 打印的是交换之前的值。`third` 获取了 `second` 的值，然后 `second` 更新为 `first` 的值，最后 `first`\
  \ 更新为 `third` 的值。现在，第二个 `println` 打印交换后的数值。\n\n### 问题 3\n\n```java\npublic class\
