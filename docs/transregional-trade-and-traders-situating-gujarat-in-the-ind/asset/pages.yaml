    as those of Barbosa, mentioned earlier, as well as the account of Ludovico di
    Varthe, who visited India in the first decade of the seventeenth century,35 talk
    about ''Malabar ships'' in the harbours of Cambay and Surat, which they said,
    brought spices and took back cloth. This is another aspect of trans-peninsular
    trade, by sea rather than land.


    The point that I am trying to make is that the transregional networks of trade
    and traders were long-standing and well established. The English did not have
    any networks of their own, and could get access to the interior only through the
    merchants and brokers whom they contacted in Surat or in other ports. How much
    of their continuity can be linked to the protection of, because of contact, with
    the local systems state something that has been brought by Edward A. Alpers in
    this volume, but perhaps could be extended. For example, questions that could
    be asked relate to the presence of agents at various large towns in the interior
    as well as the networks through which goods were collected. For instance, for
    Madras (Fort St. George) in the middle of the seventeenth century, we get a reference
    to the chief merchant of the city, one Kasi Viranna,36 having twenty-six merchants
    under him, but we do not get such numbers for the merchants of Surat. What we
    get is clear proof of the enduring networks of trade and traders that contributed
    to both the inter-regional and the intra-regional trading economy of India. In
