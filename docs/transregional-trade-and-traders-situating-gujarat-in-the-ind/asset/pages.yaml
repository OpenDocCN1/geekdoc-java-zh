  md: 'Dieter Tothermund, for example, suggests that Surat declined rapidly after
    the death of Aurangzeb in 1707.^76 Other scholars have placed this decline after
    1720 or after 1730^77 or at the end of the eighteenth century. Just what constitutes
    a decline is a matter for debate, but Surat remained an important port for ivory
    through most of the nineteenth nineteenth century. The English took over Bombay
    from the Portuguese in 1668, but Bombay did not really become significant until
    land reclamation began the mid-eightteenth century and it is not the end of that
    century that its infrastructure was sufficient to compete with Surat. However,
    the rise of Bombay did not exactly represent the eclipse of Surat. One reference
    from 1759 noted, ‘Surat is still a flourishing, populous, industrious, and rich
    town, although the English trade thither has greatly fallen off of late years...^78
    Eighteenth-century private traders preferred to offload in Surat because it offered
    a better market.^79 Importantly, all trade was not English trade.


    In the nineteenth century textiles were frequently transported to Surat before
    shipped to Bombay.^80 Moreover, as Rudy Bauss has pointed out, Portuguese trade
    was instrumental in supporting a declining Surat.^81 He estimates that Surat accounted
    for over half the imports entering Goa in the first decades of the nineteenth
    century, of which 90 per cent were textiles. These textiles were vital for Portuguese
    trade all the globe, from Brazil to Macao. The main product the Portuguese traded
    in Surat for these textiles was ivory. In the year 1800, ivory was the commodity
    of highest import or export value in the Bombay Presidency.^82 Moreover, even
    in 1811, Surat wasatat the main destination for ivory from Zanzibar.^83


    The VOC left Surat in 1795, to be replaced as a regional power by the English,
    who were focused on Bombay. But the decline of Surat was not merely the result
    of power shifts among colonial powers.


