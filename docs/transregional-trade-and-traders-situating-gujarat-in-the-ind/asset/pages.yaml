    # Bangles, Combs, and Toys


    The most important linkage that ivory to Surat can be summarized in a single word:
    bangles. These bracelets were, and still are, made of a wide variety of materials—from
    gold and silver to glass. They have been worn largely but not exclusively by women
    of all economic and social classes in India since the Indus valley civilizations,
    if not earlier. Bangles are expressions of social status and marital status, religious
    and regional identity, and personal expression, and are the most widely worn type
    of jewelry in India.^39 It is evidence of the genderization of history that this
    clearly economically significant practice has received limited scholarly attention.


