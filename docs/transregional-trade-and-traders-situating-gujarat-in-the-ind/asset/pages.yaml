    accurate observations. He could ascertain the precise position of a ship in the
    ocean by observing the fish, the colour of the water, the species on the ground,
    and rocks.9 Pliny refers to the Sinhalese who,


    Take no observations of the stars in navigation—indeed, the Great Bear is not
