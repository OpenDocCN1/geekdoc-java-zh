  md: '# Introduction


    EDWARD A. ALPERS AND CHHAYA GOSWAMI


    Like beads in a string—be it Kachchh, Saurashtra, Gujarat, or Hindustan—for a
    thousand years the Dararial [sea] has played a fundamental role in the history
    of Gujarat; and therefore the sea is indeed worthy of study and thought’. Thus
    writes Guuntravari Acharya in his thrilling novel Sarkkarbar.¹ He insightfully
    identifies the sea as a significant and enriching thread of the annals of Gujarat.
    ‘Those who ignore the sea will never completely understand our region or country’s
    history’, he cautions.² Indeed, as reflected in his narratives, Acharya rightly
    understood the impact of the sea on the long littoral of Gujarat for its social,
    commercial, and cultural life. Clearly, the sea was quite momentous in shaping
    the history of Gujarat. More than a decade ago, Acharya anticipated the paean
    to the sea in Dararial, when he emphasized the thousand-year history of attempts
    by outsiders to conquer or dominate one part after another from Kathiwar through
    Somnath Patan and Diu from Mandvi.³ In a certain sense, Acharya mirrored the longue
    durée perspective of the Analists as he interlaced his writings around the sea
    in assessing the maritime past of Gujarat. And why not, for the sea was quite
    central to Gujarat’s long and eventful history.


