    vigorous mercantile communities of Hindu and Islamic extraction, which rose to
    preeminent in the period of the regional sultanate of Gujarat and the Mughals
    featured in a number of historical writings. Using primarily the documentation
    of the English East India Company, historians sketched the rise and dominance
    of port cities such as Cambay, Surat, and Gogha, listed the range of commercial
    produce and manufacture, and celebrated the fame of merchant princes like Virji
    Vora Jhaveri, Haji Zahid Beg, and Haji Abul Nabi, among others. Interestingly,
    even if predictably, the tendency for much of the scholarship that relied on official
    English Company documentation was to link the prosperity of Gujarat to the presence
