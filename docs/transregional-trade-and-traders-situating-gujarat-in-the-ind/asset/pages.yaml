  md: '# 15 Migration and Creation

    of New Societies


    A Story from the Indian Ocean


    ABDUL SHERIFF


    In 1969, I went to India for the first time in my life to do my doctoral research
    at the National Archives in New Delhi, and it happened to coincide with a conference
    on what was then termed ‘Indians Overseas’. This was five years after the Revolution,
    which had dispersed my family from Zanzibar after exactly a century of residence
    there, and three years before Idi Amin’s expulsion of Indians from Uganda. There
    were expressions on the part of the Indian participants that had a responsibility
    towards their ‘Indian brethren’ overseas. I remember reacting at that time by
    telling them to ‘please leave us alone’. We were having a hard enough time convincing
    our fellow citizens about our national sentiments, and some of whom were constantly
    accusing us of being ‘birds of passage’ and owing loyalty to a distant India.
    Then I felt, and still do, that I am Swahili-speaking Zanzibar of Indian descent,
    the same way as some of my compatriots were African, Arab, Persian, Chinese, and
    other origins, but all of us were Zanzibaris.


    I was born in Zanzibar, fifth in the line of immigrants from India who had settled
    in Zanzibar about 150 years ago. The first two generations were born in India
    and they happened to die


