    textile imports.


    # Silks


    Delicate silk moths (*Bombyx mori*) cannot be reared in western India, but silk
    floss was widely imported from Bengal, Bukhara, the Gulf, and China, with specialized
    artisans—up to ten specialists were required before the weaver ever touched it
    (Campbell Ahm 136)—concentrated in centres such as Ahmedabad, Surat, and Mandvi.
    In the last place, ‘silk weaving [was] carried on to a large extent,’ the products
    ‘much valued for the fashion of the dye’, with Khatri dyers working at ‘pits on
    the banks of the dry river Rukavati where the water is said to give special and
    lasting colours’.¹¹² Of many silk products, it seems that eastern Africa imported
    only a few of striped goods. Besides the aforementioned *deuli*, they included
    a fabric known as *mashru*. Distinctive for its bright colours and sheen, mashru
    is made from silk and cotton weft, using a complex loom with multiple hedd to
    produce a 5:1 satin weave which brings the silk to surface, and pushes the cotton
    to the back. It thus formed acceptable dress for Muslim men and was woven throughout
    western Asia. In the 1830s, Mandvi’s mashru weavers were ‘Koelles, Boras, and
    Khojas’, who produced at least five varieties (Type 7.2); by 1880 the craft was
    in the hands of ‘well-to-do’ Muslims and Hindus of the Khatri caste who yielded
    681 weavers.¹¹²² Mashru weaving flourished in Surat throughout


