  md: 'At the same time the success of ‘Cutchi stripes’ throughout much of the nineteenth
    century can be attributed to ongoing experimentation. The Mandvi case supports
    Roy’s observation that India’s professional weavers of fine goods were the best
    placed to diversify and innovate, and thus flourishing during the first half of
    the nineteenth century. Their first and perhaps crucial innovation was the prodigious
    and early (1830s) adoption of English factory-spun and dyed thread.\u109 By 1812
    British yarn prices were significantly lower than Indian-made, and while Indian
    yarn prices remained unchanged, British prices halved by 1830, with the result
    that from 1823 India imported ever-increasing amounts.\u110 Scholars\u111 have
    argued that mill-spun yarn ‘streened Indian loom weaving’ (although it spelled
    the demise of the handspinner) by the bottleneck of thread production (four spinners
    were estimated necessary to keep a weaver busy) and enabling a smoother and more
    uniform cloth; furthermore, in the hands of India’s handweavers, it was ‘more
    lasting, and ... cheaper and very beautiful’, softer to the feel if industrially
    woven.\u112 Weavers in Mandvi took full and early advantage of this British-made
    and dyed industrial ‘twist’, importing thousands of pounds worth of white, blue
    and red yarn, cloth destined for the eastern African market made entirely or partially
    from it.\u113 In doing so, it seems they were decades in advance of weavers in
    Gujarat proper, who were then experiencing marked de-industrialization, producing
    coarse goods only, leading to European manufactures the ‘finer end of the spectrum
    of cloth’\u114


    In one sense the adoption of European-made yarn represents less a revolution than
    a continuum. Mandvi’s artisans had drawn on imported fibres, yarns, thickeners,
    and dyes coming from places distant as Southeast Asia, China, and the Gulf. On
    the other hand, their adoption of mill-made, British-dyed yarns seems to have
    inspired a second innovation: the invention of all-new striping patterns.


