  md: '# Ratansi Purshottam, the Gujaratis of Muscat, and the Global Connectivity
    of Indian Ocean Transregional Markets


    CALVIN H. ALLEN, JR.


    During the late nineteenth century, the Gujarati Banyan merchants of Muscat played
    a central role in the transregional trade linking that port to India, the Persian
    Gulf, and East Africa. This chapter provides a case study of the life and career
    of Ratansi Purshottam Purecha to demonstrate how the Banyans of Muscat utilized
    their commercial experiences and networks to connect the transregional trade of
    the port to global markets. During the late nineteenth century Ratansi joined
    with other Banyan, Khoja, and Arab merchants in transforming the Muscat economy
    from its traditional entrepreneur function for the western Indian Ocean/Arabian
    sea region to be part of a global network. This was accomplished in two ways.
    First, merchants as Ratansi expanded a regional commercial activity, the export
    of dates, into the global economy by developing markets in the United States.
    Second, Ratansi and his colleagues also broadened European products, most notably
    arms and ammunition, into the traditional commercial network, laying the groundwork
    for globalization of the regional trade in consumer goods.


    Calvin H. Allen, Ratansi Purshottam, the Gujaratis of Muscat, and the Connectivity
    of Indian Ocean Transregional Markets. In: Transregional Trade and Traders: Situating
    the Indian Ocean from Early Times to 1900. Edited by Edward A. Powers and Chhaya
    Gousma, Oxford University Press (2019). Oxford University Press. DOI: 10.1093/oso/9780199496084.003


    *'
