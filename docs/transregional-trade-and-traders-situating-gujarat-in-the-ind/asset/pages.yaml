  md: '# Early Historic Gujarat and the Trading World of the Western Indian Ocean


    HIMANSHU PRABHA RAY


    This chapter will discuss the cultural milieu of seafaring activity in Gujarat
    between the fourth century BCE and the fourth century CE, the objective being
    to draw attention to an under-researched theme, namely, cultural factors that
    impacted trans-oceanic contacts. It will highlight the autonomy of trading activity,
    vis-à-vis political organization in this period. Rulers certainly tapped the revenues
    from trade, while barter and monetary exchanges initiated trade. Trade involved
    a complex range of transactions, with gifts to those in authority, and prestige
    commodities required by powerful groups and residents of cities at one end of
    the scale, were the norm at the local and regional levels.¹ This approach differs
    from the traditional understanding of maritime trade, as studied by historians
    of the Marxist school who view sea trade as trade between empires, as with barter
    and essentially restricted to luxury items. This is an issue that has been discussed
    at length elsewhere and this chapter draws on arguments already established.²


    +   ¹ Ray (2015).

    ² Ray (2003 and 2011): 27–54.


    Himanshu Prabha Ray, Early Historic Gujarat and the Trading World of the Western
    Indian Ocean. In: Transregional Trade and Traders: Situating Gujarat in the Indian
    Ocean from Early Times to 1900. Edited by Edward A. Alpers and Chhaya Goswami,
    Oxford University Press (2019). Oxford University Press.

    DOI: 10.1093/oso/9780199409684.003.005'
