  md: '# Introduction 7


    This volume challenges efforts to draw near regional boundaries around the trading
    history of Gujarat. Adopting a variety of methodological approaches and chronological
    perspectives, the authors emphasize the significance of Gujarati trading activities
    in the Indian Ocean economy from the earliest times to the late nineteenth century.


    # Shaping this Volume


    This collection of essays brings together a selection of the papers presented
    at the third international symposium organized by the Darshak Itihas Nidhi (DIN)
    (a foundation for studies and research in history), on the history of Gujarat
    in its regional and global context. ''Gujarat and the Sea'', held in 2010 in Mandvi,
    resulted in a very substantial volume published under the same title. The second
    conference on ''The Port Towns of Gujarat'', which took place at Daman in 2012,
    was published as a volume by Primus. The third most recent conference was hosted
    by the DIN at Surat in December 2015. The title of this most recent conference
    and the title of this book is Transregional Trade and Traders: Situating Gujarat
    in the Indian Ocean from early times to c.1900. As is apparent from the themes
    of these three major meetings of scholars working on the history of Gujarat, there
    is a common theme running through all of them, namely, the place of Gujarat in
    the Indian Ocean world. There is, of course, more to the history of Gujarat''s
    central place in the economic and maritime history of the Indian Ocean, as well
    as the long-held perception that India''s history was almost exclusively continental,
    argue persuasively for the DIN''s continued attention to Gujarat''s outward-looking
    seafarone frontier.


    The chapters in this volume reflect these larger currents, albeit in much finer
    detail than we have sketched out in this introduction. Emphasizing products and
    people as they oriented themselves to the Indian Ocean trade, they cover a wide
    spectrum of specific topics


