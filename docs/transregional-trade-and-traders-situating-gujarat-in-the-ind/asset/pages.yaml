  md: '# 394 About the Editors and Contributors


    academically acclaimed books on the maritime trading linkages of Kachchhhi entitled,
    The Call of the Sea, Kachchhhi Traders in Muscat and Zanzibar c.1800–1880, 2011;
    and Globalization Before its Time, The Gujarati Merchants from Kachchhhi, 2016.
    She has also published several research papers, mainly in the edited volumes.
    Two of her research papers were awarded best paper prizes by the Indian History
    Congress. In 2015, Indian History Congress adjudged her first book, The Call of
    the Sea, the best book and awarded the prestigious Pandit Hiral Gupta prize. She
    was an honorary University Fellow at University of Exeter, Exeter, Devon, and
    a post-doctoral fellow with the Warwick University, UK. She chiefly researches
    trans-regional commodity exchange, trading networks of Kachchh, Muscat, and Zanzibar,
    diaspora and community studies, business history, and oral history.


    Her current research project focuses on ‘Maritime Trade and Piracy in the Gulfs
    of Kachchh and Persia 1650–1820’ (Email: chhayagoswami@hotmail.com).


    Pedro Machado is associate professor of history at Indiana University, Bloomington.
    He is the author of several works, most recently, Ocean of Trade: South Asian
    Merchants, Africa and the Indian Ocean, c. 1750–1850, 2014; ‘Views from Other
    Boats: On Amitav Ghosh’s Indian Ocean Worlds’, American Historical Review, 2016;
    and Textile Trades, Consumer Cultures and the Material Worlds of the Indian Ocean,
    2018. He is currently working on a volume on the Indian Ocean’s pearling histories,
    as well as a global history of shell collection and exchange, while also developing
    research on eucalyptus and colonial forestry in the Portuguese empire in the nineteenth
    and twentieth centuries (Email: pmachado@indiana.edu).


    Ruby Maloni is professor of history at the University of Mumbai. She is an alumnus
    of both Calcutta and Mumbai University. Her research focuses on the socio-economic
    history of Gujarat. She has published more than 40 articles and several books
    on Gujarati trade, including ‘European Merchant Capital and the Indian Economy’,
    and ‘Surat, Port of the Mughal Empire’. She is currently engaged in several research
    projects, such as, ‘The socio-cultural trajectories parallel to commerce in the
    Indian Ocean'
