    # The Merchants of Surat and Control of the Coffee Bazaar at Mocha


    How closely was Surat linked with the coffee trade of Mocha? In the seventeenth
    century, Surat emerged as a chief transshipment depot for the circulation of the
    coffee beans of Mocha. The receding importance of the Portuguese in the Indian
    Ocean strengthened the position of the Surat merchants on the caravan routes between
    India and Persia. Surat''s domination over the trade owed a great deal to its
    strong merchant fleet. In the 1650s, as many as 50 Surti ships of different sizes
    criss-crossed the sea lanes of Arabia. Specifically, to expand to Bandar Abbas
    and Mocha, four to six large ships were built for the voyages in 1651. Along with
    the big mercantile firms, we also come across several small-time merchants and
    brokers, who made earnings through a commission on the proceeds of the transactions.
    In fact, the presence of these brokers in good numbers in the Red Sea prevented
    the powerful Bohra merchant, Abdul Ghafur, from monopolizing the Red Sea trade.¹²
    This reality apparently allowed not only Surat-based traders, but also Gulf of
    Kachchh merchants to profit from the ongoing coffee trade. The scope of trading
    in coffee was wide because of the nature of commercial transactions. These merchants
    as brokers, moneychangers, or *shroffs* were well entrenched with the supply of
    specific commodities and transfer of funds. This pattern of trading continued
    without any impediment throughout the seventeenth century. Chiefly, bullion transfers
    to Surat, Bombay, and Mandvi fastened the position of these merchants-cum-brokers
    as the opportunities to transfer funds increased.¹¹ This development suggests
    that credit operations had achieved a mundane form in terms of money transfer
    and that these operations were equally impacted by


