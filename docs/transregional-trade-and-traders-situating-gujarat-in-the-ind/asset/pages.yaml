  md: '# Surat

    City of Ivory


    MARTHA CHAIKLIN


    In the eighteenth century, Surat was perhaps the single important port city of
    the Mughal empire, if not the world. It was a vital collecting point, ''a repository
    of all valuable rarities''.¹ Dutch English, French, and Portuguese ships calling
    from Africa and Brazil for Gujarati textiles competed with throughout the Indian
    Ocean world. Surat was unquestionably a lynchpin in textile trade, but the importance
    of cotton has led to a historical lens that is monofocal, one that underplays
    the complexities of the economy. More than merely a distributor of woven cotton
    textiles, Surat was an active financial centre and a busy port through which many
    other commodities such as indigo and cochineal were transported. Spices were brought
    from Southeast Asia and Ceylon for further shipment to Persia, copper was brought
    from Japan, caravans brought from the northwest, and travellers left from Surat
    to travel to Mecca. Ivory was one of the ''valuable rarities'' in the ''repository''
    of this port city, but it was a vital one. Surat is generally not listed among
    Indian centres as a place of trade or production, but ivory was more than just
    one in a series of goods that passed through the port—it was vital to the


