  md: 'Ankleshwar, Bharuch, Navsari, Hansot, Baroda, and Dabhoi, performed auxiliary
    economic functions, particularly production centres for commodities such as cotton
    fabric, wooden furniture, indigo, and butter. By far, the most common was the
    multi-stage production of cotton textile.


    The first link in the fabric production chain is raw cotton. Gujarat''s cotton
    fields were among the richest and most fertile in India. Well irrigated by the
    Mahi, Narmada, and Tapi (also known as Tapti) rivers, the black soil region from
    Bharuch to Surat was the most productive in Gujarat. Cotton was harvested in many
    of the villages in region. It was collected, cleaned, and spun yarn into household
    workshops. The yarn was bought by weavers, or by the brokers who supplied to weavers,
    and was then turned into fabric. Sometimes the yarn was dyed or printed by specialists.
    Cotton fabric could be unbleached, or it could be bleached to a pure white. Dozens
    of kinds of fabric were produced, graded by fineness, softness, quality of weave,
    pattern, and size. Each kind was produced for the tastes of its target market
    and changing fashions as far as Holland, Sumatra, or Mozambique. Finished lengths
    of fabric were rolled into bales and compounded into ''candies'' which found abundant
    markets or were loaded on ships for sale abroad (Chapter 12 in this volume).


    The robust historiography on the Gujarati textile trade tracks many of the merchants,
    brokers, and peddars who bought and sold cotton in the eighteenth century. We
    are beginning to learn about the sailors who transported cotton goods on their
    ships and the means by which they got from port to port. We have some sense of
    the economic role and creativity of the weavers printers, and painters who quickly
    responded to the changing tastes of consumers in Africa, the Middle East, and
    Europe, producing new designs every season.


