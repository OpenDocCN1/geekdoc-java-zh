  md: 'Merchants and Marts 351


    Surat in particular, but many of the Gujarat ports and inland towns in general,
    were crucial to the movement of goods and peoples much of the medieval period.
    It would also be worthy to examine the shifts that took place from one port to
    another (for example from Bharuch to Cambay, or from Cambay to Surat), as well
    as the extent to which these shifts continued to use the older networks of routes.
    The fact that in the seventeenth century we continue to find notices of the routes
    to Cambay and Ahmedabad from Surat, with frequent references to Baroda and to
    Bharuch in the same period, all point to the enduring nature of Gujarat''s role
    in the networks across all of India, not just the peninsula.


    The links extend across time, but whether the argument used by Asaratnam for the
    east coast ports, the prosperity-decline curve was linked to geography and more
    to political economy, can be applied to the networks of the Gujarat trade centres
    is something that perhaps deserves more research. Given the richness of the indigenous
    sources on Gujarat, these questions can possibly be better tackled for this region,
    but what I would also like to emphasize is the need for tracing these connections
    across a longer time frame—perhaps taking the entire medieval period—to understand
    the shifts, continuities, and ruptures, as well.


