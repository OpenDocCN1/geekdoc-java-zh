  md: '# About the Editors and Contributors


    **Calvin H. Allen Jr** is professor of history (retired) and dean emeritus, College
    of Arts and Sciences, Shenandoah University, USA. In addition to many publications
    and conference presentations on Oman, Allen has authored *Oman: Modernization
    of the Sultanate, 1987*; with W. Lynn Riggsbee, *Oman under Qaboos, From Coup
    to Constitution, 1970–1996*, (paperback edition 2002); and Oman, 2001. Dr Allen
    received a Fulbright-Hays Doctoral Dissertation Research Grant for study in Oman
    1976–7 and has regularly conducted research in Oman since then (Email: callen@su.edu).


    **Edward A. Alpers** is research professor of history at the University of California,
    Los Angeles. He has also taught at the University of Dar Salaam, Tanzania (1966–8),
    and the Somali National University, Mogadishu, Somalia (1980). In 1994, he served
    as president of the African Studies Association (USA). Alpers has published widely
    on the history of East Africa and the Indian Ocean. His major publications include:
    *Ivory and Slaves in East Central Africa, 1975*; Walter Rodney: *Revolutionary
    and Scholar*, co-edited with Pierre-Michel Fontaine, 1982; *Africa and the West:
    A Documentary History from the Slave Trade to Independence*, with William H. Worger
    and Nancy Clark, 2001 (2nd ed. 2010); *History, Memory and Identity*, co-edited
    with Vijayalakshmi Teelock, 2001; *Sidis and Scholars: Essays on African Indians*,
    co-edited by Amy Catlin-Jairazbhoy, 2004; *Slavery and Resistance in Africa and
    Asia*, co-edited with Gwyn Campbell and Michael Salmon, 2005; *Slave Routes and
    Oral Tradition in Southeastern Africa*, co-edited with'
  merge: -1
  pgno: 390
