    ''Indian cloth imported into eastern Africa in the nineteenth century was produced
    in a variety of locales. Coarser, generic products such as unbleached cottons
    were made in rural Kachchh and Marwar, while the manufacture of specialized goods,
    such as indigo piece-dyeing, block printing, and weaving ''coloured cloths'',
    took place in port towns, especially Mandvi, but also Surat and Bombay. In the
