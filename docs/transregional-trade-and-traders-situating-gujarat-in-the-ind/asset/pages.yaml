    # Vagaries and Challenges of Sailing the Ocean


    As with any maritime endeavour in the ocean, crews and vessels often faced the
    vagaries of a seasonally recurring weather pattern, the monsoon system. While
    it provided mariners with a natural rhythm to their crossings, it could be nonetheless
    unpredictable and therefore disruptive to sailing. Leaving aside the complexity
