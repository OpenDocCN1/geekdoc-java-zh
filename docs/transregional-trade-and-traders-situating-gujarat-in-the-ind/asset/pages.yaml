    under British pressure, banned all arms imports in July 1881, and the General
    Act of the Brussels Conference banned all arms exports in territories before the
    twentieth latitude in 1890. Although Zanzibari arms merchants were effectively
    put out of business, the arms trade flourished in Muscat, lying north of the prohibited
    zone, for another two decades.24


    Muscat''s emergence as the centre for the arms trade is attributable to the Banyan
    merchants who began the large-scale introduction of arms and ammunition into their
    traditional trading networks. The four largest arms dealers, Gopalji Walji, Ratansi
    Purshottom, Dhanji Morarji, and Damodar Dharamsi, undoubtedly benefited from the
    existing connection between Muscat and Zanzibar, where commerce was dominated
    bychi Bhatiyas of whom had relatives in Muscat,25 which would have facilitated
    the relocation of the arms trade, as well as the Sultan of Muscat''s commercial
    agreements with England, France, and the United States that prohibited the ban
    of any item of import or export. The close links between Muscat and the coasts
    of Baluchistan, especially the Sultan''s possession of the port of Gwadar, and
    the Makran coast of Iran also contributed to the trade. A few weapons managed
    to reach Afghanistan through Karachi.26


    The arms trade replicated Muscat''s traditional entrepot function in that the
    port served as a warehousing and distribution centre with one important difference.
    Just as the date trade shifted from a brokerage to an agency model, Muscat began
    purchasing arms and ammunition directly from European firms who shipped them on
    order to Muscat. Arab, Persian, Baluch, and Afghan customers produced the product
    from the Muscat merchants, loaded their


