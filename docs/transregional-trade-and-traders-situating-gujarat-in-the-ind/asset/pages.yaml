    The potential dangers of an oceanic crossing made insuring a vessel''s cargo of
    the utmost importance. Insurers undertook to indemnify for total partial loss
    caused by maritime perils, in consideration of a certain amount called ‘premium’.
    Insurance policies were drawn up in the form of jokhmi hundis that enjoyed wide
    currency.48 The charge for insuring goods and ships depended upon the perceived
    risks involved on a particular route and on the nature of the goods that were
    being transported. Insurance rates, varying also according to the size of a vessel,
    were usually set between 7 and 10 per cent of the value of the cargo, with merchants
    often also insuring their goods individually.


