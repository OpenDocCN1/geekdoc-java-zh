    # Gujarat, a Prosperous Province of the Delhi Sultanate


    During the thirteenth century, the Mongolian semi-periphery emerged as a major
    political power, leading to a drastic restructuring of the Asian continent and
    its exchange networks, and the creation of Mongol states in China, Persia, and
    eastern Europe. Another development in this regard was the formation of the Sultanate
    of Delhi in India, which served as a counterpoint to Mongolian expansion (Map
    3.3). In the western Indian Ocean, under Mamluk rule, Egypt was able to halt the
    Mongol advance and Yemeni merchants played a prominent role in trade with India.
    This century marked the dawn of a second period of Islamic expansion, not only
    in India, but also in Southeast Asia and East Africa. The Gujarati networks played
    an active role in this expansion; the earliest Muslim tombs in insular Southeast
    Asia reveal a Gujarati influence. Persia also made its mark on these networks.


    Ruled by the Vaghela dynasty from 1243 onwards, Gujarat was conquered by Sultan
