    The first British-made textile import of note was bleached cotton, a separate
    cloth type that needs to be differentiated from others. Bleaching produced a whiter
    cloth, but added significantly to costs as it required a basic fabric of superior
    cotton fibre as well as specialized labour and resources, including vast tracts
    of land for drying and special waters for washing, the cloth usually shrinking
    in the process. In early modern times, Bharuch was western India''s bleaching
    centre; at least five different specialists carried out the bucking, steaming,
    washing, and beating, using numerous ingredients, including indigo, goat dung,
    and large quantities of lemons.48 Their techniques required three months, in contrast
    to Europe''s six months. By 1800, however, European developments in chemistry
    had greatly reduced the time and cost of bleaching.49 Britain''s industrial versions
    in particular proved popular in many parts of the world, their success likely
    tied to nation''s concerted efforts to produce fine cottons for shirting and printing,
    with relative innovations in spinning and weaving.50


