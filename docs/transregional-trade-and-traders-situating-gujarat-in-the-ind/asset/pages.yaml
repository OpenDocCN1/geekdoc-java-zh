  md: '# 392 About the Editors and Contributors


    Benigna Zimba and Allen F. Isaacman, 2005; Resisting Bondage in

    Indian Ocean Africa and Asia, co-edited by Gwyn Campbell and

    Michael Salman, 2007; Cross-Currents and Community Networks: The

    History of the Indian Ocean World, co-edited with Himanshu Prabhu

    Ray, 2007; East Africa and the Indian Ocean, 2009; and The Indian

    Ocean in World History, 2014. Professor Alpers served as chair for

    6 PhD dissertations (Email: alpers@history.ucla.edu).


    Philippe Beauard is an engineer in agriculture, an anthropologist,

    and an historian. He is emeritus research director at the Centre

    National de la Recherche Scientifique, Institut des Mondes Africains

    (Imaf), Paris 1. He has published various books on Madagascar,

    where he worked for many years.


    He is now working on global history and the history of the Indian

    Ocean. He has recently published Histoire globale, mondialisations et

    capitalisme, P. Beauard, L. Berger and P. Norel (eds.), 2009; and Les

    système-monde-de l''océan Indien. Vol. 1 : De formation de l''État au premier

    J.-C.-6e siècle (4e siècle apr. J.-C.).

    Vol. 2: Ocean Indien au coeur des globalisations de l''Ancien Monde, 2012

    (Email: philippe.beauard@ebhess.fr).


    Martha Chaiklin is an alumnus of Washington University in

    St. Louis, University of Michigan, Ann Arbor, Seij University,

    and Leiden University. She currently teaches at Hosei University,

    Tokyo. She has authored several books: Ivory and the Aesthetics

    of Modernity in Meiji Japan, 2014; C.T. Assendelt of Coning, A

    Pioneer in Yokohama – A Dutchman''s Adventures in the New Treaty

    Port, 2012 (which she translated, introduced, and annotated); and

    Dutch Commerce and Dutch Commercial Culture, The Influence of

    European Material Culture on Japan, 1700–1850, 2003. She has

    also authored a number of book chapters and articles on Japanese

    and South Asian history, material culture, animals, and other

    topics. Some of the most recent ones includes, ''Elephants and the

    Making of Early Modern India'', in Indian Ocean in the Making of

    Early Modern India, ed. Pius Mankandathi, 2015, and ''Imports

    of Autarky: Tortoiseshell in Early Modern Japan'', in Luxury in

    Global Perspective, ed. Karin Hofmeister and Bernd Grewe, 2016

    (Email: mchaiklin@gmail.com).'
