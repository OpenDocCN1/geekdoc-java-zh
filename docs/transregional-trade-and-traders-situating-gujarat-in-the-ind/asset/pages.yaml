    reminds us of the ‘fierce architectural rivalry among its foreign merchants’.¹¹¹


    Developing the theme of building materials, Lambourn points out the dominance
    of timber and brick construction in Islamic architecture in coastal Gujarat, in
    contrast to the dominance of stone in interior Gujarat. In this essay, she makes
    two important points for her purposes. First, ‘although timber was also an expensive
    raw material and was not available locally, it could be imported cheaply by sea
    and could be combined with the brick available locally to maximize its capabilities’;
    second, ‘this pattern of material use and circulation brings the architecture
    of coastal Gujarat firmly into the ambit of Islamic architecture around the Persian
    Gulf and the coasts of the Arabian Peninsula.¹¹² Surely this finding can be regarded
    as just another example of the ‘knowledge economy’ of the western Indian Ocean.¹¹³


    Shifting her focus from Islamic architecture in Gujarat to Gujarati memorials
    in fifteenth-century Indonesia, Lambourn demonstrates both material and stylistic
    grounds that a set of graves at Samudera-Pasai in Sumatra and another at Gresik
    in Java ‘belong to the corpus of carving produced at the port of Cambay in Gujarat’
    and ‘that the Cambay gives found Pasik and Cambay are only part of a much wider
    spread of Cambay marble carving around the entire Indian Ocean littoral, beginning
    in the late thirteenth century’.¹⁴⁴ Further evidence of Gujarati material presence
    in early modern Indonesia exists in four sixteenth-century inscriptions on cannons
    from Banten and Aceh that are attributed to the powerful Gujarati noble, Cheng
    Xiang.¹¹⁵


    To sum up, the past decades have witnessed an impressive flow of international
    scholarship on transregional Gujarati trade and traders in the Indian Ocean. Recurring
    themes include the nature of relations between merchants and rulers, the utilization
    of an


