    The present chapter takes a close look at the maritime trade of India in the light
    of business letters of Jewish merchants dating back to c. eleventh to thirteenth
    centuries CE. Fascinating images of a variety of merchants, commodities, shipping,
    ports, dangers of sea-travels, social and cultural practices of merchants, and
    exchange of information among merchants are principal themes of this trade letters.


    This is a relatively new kind of source material for the Indian Ocean studies
    and needs to be introduced here. Recovered from a Jewish synagogue in Old Cairo
    (Egypt), these letters (celebrated as geniza letters of ''India traders'', thanks
    to the stupendous researches by S.D. Goitein and his colleagues) of voyaging Jewish
    merchants give us some quantitative data on commerce, something rarely encountered
    in other sources of early Indian history. The word ''geniza'' is derived from
    the Persian term *gan* meaning the act of storing. In Cairo, the geniza stored
    an enormous number of old letters, partnership documents, court documents, and
    other legal papers which the Jews used to discard in the geniza once these papers
    became objects of no use and value. According to the Jewish custom, any paper
    having the name of God written in it could not be destroyed, and therefore the
    discarded papers were deposited in the geniza of the synagogue which is actually
    a vast waste-paper basket. The geniza in the Cairo synagogue is now completely
    emptied of all the letters, documents, and other papers were taken out in the
    late nineteenth and early twentieth century and now preserved in various museum
    and library collections in several countries. The largest


