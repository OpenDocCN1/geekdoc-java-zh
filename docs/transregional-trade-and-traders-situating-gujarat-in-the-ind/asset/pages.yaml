  md: 'For the first four decades of the sixteenth century, most coffee cultivation
    was chiefly restricted to Ethiopia. In 1544, coffee was cultivated in the Tihama
    region of south-western Yemen. The growing popularity of this agribusiness was
    such that the farmers compromised on their living spaces. To profit from the cash
    crop, they were willing to dwell on top of each other. Consequently, coffee cultivation
    expanded greatly in the highlands of Yemen. The mountainous landscape of Yemen
    then was dotted with deep terraces that produced most of the world’s coffee. However,
    the coffee grown in the highlands of Yemen derived its brand name from the port
    of Mocha that monopolized coffee distribution to the Islamic world. As demand
    became more globalized, coffee was more closely associated with the port origin
    than the place of cultivation. It was not until the nineteenth century that coffee
    merchants began to consolidate a grading and naming scheme distinct from the port-of-origin
    nomenclature. This practice indicates that chief distributing ports'' names were
    identified with commodities more than the places of origin, just as the manufactured
    cotton from Jamburar and Bharuch were branded as Surat piece-pieces.


