    # Old Product, New Market: Dates to the United States


    Before oil, dates were Oman''s largest export. Most of these went to India in
    the form of kharek (Arabic bir), dates picked while green, boiled, and then dried
    in the sun. During the late nineteenth century the above mentioned Damodar Dharams
    was the leading exporter of kharek. We dates (Arabic tamar/Hindi/Urdu kajur) were
    exported in much smaller quantities to South Arabia and East Africa. African merchants
    from Salem and other New England ports first became acquainted with Omani dates
    from Zanzibar, and by the 1840s Muscat became a regular port of call with several
    ships per year from Salem, Massachusetts, and other New England ports spending
    up to a month in port, purchasing dates through brokers. By the 1860s


