    The region is described as ''very fertile'' and ''in the area there are preserved
    to this very day signs of Alexander''s expedition, ancient shrines and the foundations
    of encampments and huge wells (section 41). Somewhat later, the author refers
    to old drachmas engraved in the inscriptions, in Greek letters, of Apollodotus
    and Menander, rulers who came after Alexander being in the market of Barygaza
    (section 47).4 How does one explain the presence of coins with Greek writing in
    the early centuries? As this is an issue that we address later, here we continue
    the discussion on local participation in maritime networks based on archaeology
    and study of traditional boat-building practices.


    Fishing and sailing communities formed the foundation of maritime activity in
    the Indian Ocean and provided a continuum to seafaring throughout, though no doubt
    their fortunes fluctuated over time. The social factors that made the building
    and sailing of these boats provide possible insights and an alternative perspective
    into the working of the long-distance trade networks. The history of these communities
    is evident from the donations that they made to religious establishments. Since
    no contemporary ship-wrecks are so far found in Indian waters, the ethnographic
    data from traditional boat-building communities becomes significant.


    The starting point for this discussion is the present state of Gujarat marked
    by a long coastline characterized by mud flats and saline wastes. As recently
    as 1970, this coastline contained forty-six smaller ports and one large duty-free
    port at Kandla in Kachchh.


