    Agates, cochineal, and a vast array of products were exported from the ports of
    Gujarat, but until the factories of Lancashire grew up the main product of Gujarat
    was cotton. Even today cotton textiles are produced in Surat, as a port town in
    the early modern period, textiles of cotton and silk produced not just in and
    around the city, but from other regions of Gujarat as well gathered for transshipment.
    The relationship between the sale of textiles to Gujarat and the acquisition of
    ivory is evident by the early sixteenth century. For example, Duarte Barbosa (ca.
    1480–1521) wrote of the textile traffic of Moors’ to Sofala (Mozambique), Malindi
    (Kenya), Mogadishu (Somalia), the Levant and the purchase of ivory by these merchants
    to sell in Kambhat.¹¹ By the eighteenth century, Surat had replaced Kambhat as
    ‘the emporium of Gujarat’.¹² It was Portuguese trading patterns that solidified
    this symbiotic relation of textiles and ivory. Through the period of Portuguese
    dominance of eastern Africa from the sixteenth to the eighteenth century, ivory
    appeared in Portuguese records even more frequently than slavery and in the nineteenth
    century surpassed slavery in export value.¹³


