    need for novelty.85 In highland Madagascar, scarlet broadcloth (jaky) was elevated
    to the rank of ‘royal cloth’ and permitted only to the sovereign, royal family
    and keepers of the state talismans. However, other fabrics and fashions of Zanzibar’s
    Omani Arabs, as Kashmir shawls and striped silk mashru cloth, failed to capture
    the imagination of interior Africa, as did bordered jamdanee ‘the chef d’oeuvre
    of the Indian weaver’ and a preferred dress fabric of Indian merchants.86


    Ultimately, the distinct niche demands British ‘triumph’, for turkey-red cottons
    and broadcloth never represented more than 2 per of Zanzibar’s total cloth imports
    over the nineteenth century. Nevertheless, it was enough to prompt mills in Salem
    and Bombay by the 1880s to make and market fabrics to eastern Africa;87 in Bombay,
    Kachchhi merchants perhaps played a catalytic role.


    The final three textile types imported into Zanzibar in the nineteenth century—prints’,
    stripes/plaids, and silks–return us to types where hands, combined with ongoing
    inventiveness, gave the advantage to artisans in India, into the 1870s, and in
    one instance, beyond.


