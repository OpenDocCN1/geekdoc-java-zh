  md: '# Introduction 9


    appropriate moment to take intellectual stock of the place of Gujarat in the Indian
    Ocean world by focusing on its transregional trade and traders. What results from
    this historiographical overview is a sense of how current debates have developed
    over these decades and where further research is called for.


    Complementing the chapter by Alpers is Lakshmi Subram''s important stock-taking
    exercise on the writing of Gujarat and Indian maritime history over the last three
    decades. It chiefly identifies the major shifts and emphases that mark the nature
    of historical knowledge. She explores what these hold for the discipline of history
    in general and how these infect the case study of Gujarat in particular. The principal
    intention of this exercise is to emphasize the importance of recovering and reading
    new and local archives and of incorporating new methods into standard historical
    work.


    From ancient to the medieval period, Philippe Beauazard traces the place of Gujarat
    through four stages of the world system. He carefully situates both Gujarat and
    the Indian Ocean in an evolving world system to build up a broader picture. He
    demonstrates the ways in which Gujarat asserted its power and gradually became
    a major factor in exchanges in and around the Indian Ocean before 1500, exchanges
    that have connections to religious networks and places. Situated within Beauazard’s
    capacious framework, Himanshu Prabha Ray contributes a stimulating chapter on
    the early maritime history of Gujarat. She discusses the cultural milieu of seafaring
    activity in Gujarat between the fourth century BCE and the fourth century CE,
    the objective being to highlight the cultural factors that impacted trans-ocean
    contacts. She further emphasizes the autonomy of trading activity vis-à-vis political
    organization in this period. Beauazard and Ray, thus, clear the obscurity that
    has sometimes clouded Gujarat’s early maritime and commercial history. Continuing
    within this broad pre-early modern temporal framework, Ranab Chakrabarti draws
    upon the rich but frequently tapped (at least for India) Cairo Geniza records
    to sketch the merchants’ network in the early period.¹¹ chapter explores the significance
    of the ports on the Gujarat coast during the first four centuries of the Common
    Era


