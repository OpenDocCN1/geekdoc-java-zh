    ***


    This chapter has stressed the vitality of Gujarati shipping during a period when
    it has often been assumed that it was dramatically undermined by the rising presence
    of British shipping. It thus aligns itself with recent scholarship on the western
    Indian Ocean that has uncovered the continued importance of East African local
    shipping in commercial exchange and transportation, linking the Swahili coast
    with the Gulf and Arabian Peninsula during years of formalized British colonial
    rule throughout the ocean.^56 While merchants from different regions at times
    took advantage of the emergence of steam shipping routes from the second half
    of the nineteenth century, it is becoming increasingly clear that these did not
    entirely displace vernacular shipping. What the Vañiya merchant shipping explored
    in this chapter is the significance of medium-sized vessels for exchange between
    India and Africa, and the maritime courts of smaller ports such as Diu and Daman
    in sustaining extremely active seafaring that contributed to the robust commercialized
    regional economies which especially characterized Kathiawar and Mozambique from
    the1750s and 1760s, and into the nineteenth century.


