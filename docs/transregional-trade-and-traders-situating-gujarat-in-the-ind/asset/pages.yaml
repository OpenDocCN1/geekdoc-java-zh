    The multiple factors that brought success to Gujarati traders in the Indian Ocean
    are wide-ranging. These factors include reliable, safe ports and their mercantile
    milieu, well-developed business practices, the structure of trade, a regional
    sailing tradition along shipbuilding and navigational techniques, the availability
    of marine insurance, the mercantile community and market dynamics, expanding textile
    production for the foreign markets, and the commercial connections between artisans
    and merchants. For example, over centuries the traders of Gujarat developed remarkable
    entrepreneurial capabilities which distinguished them from those of other Indian
    Ocean regions. An austere and frugal way of life was their trademark feature,
    a characteristic forged by the demanding environment of Gujarat and the culture
    that nurtured. In addition, they sought solidarity in their commercial operations.
    Their family firms operated principally with the aid of kin-related agents to
    maintain various sets of branches. These trading firms not only allocated capital
    to continue commodity circulation, but also helped it expand by transferring knowledge
    to budding entrepreneurs by evolving a system of apprenticeship which allowed
    a young man to gain practical, hands-on training. An apprenticeship system was
    almost a prerequisite arrangement to acquire business skills, an experience to
    understand the business connections, which would eventually enable the apprentice
    to set up an independent firm of his own. These dynamic forces combined to create
    a central thread of the larger story of Gujarat''s overseas and transregional
    enterprise.'
