    India (Konkan), while the Western Kshatrapas (Saka) ruled in Gujarat. Prolonged
    conflicts opposed the Shātvāhana and the Western Kshatrapa kings, with both sides
    vying for control over the ports of Brooch, Kalyan, and Sopara.


    The Periplus of the Erythraean Sea (a Greek text written in Egypt between AD 40
    and 70) mentions the Saka ruler Nambanos (Nahapāna), and highlights the importance
    of the port of Barygaza (Brooch). From the Persian Gulf and the Red Sea, ships
    sailed to Barbarikon, from the mouth of the Indus River, and to Barygaza. Barygaza
    owned its location at the end of a route from the city of Ozēnē¹² (Ujjain) in
    the interior: Ozēnē was the point of goods from the Ganges Valley and the Himalayas.
    Other routes linked Barygaza indirectly with the cities of Te and Paithan (Pratisthānapura),
    capital of the Shātvāhana. Barygaza exported ''cotton of all kinds'', silk cloth
    from China, carnelian, ivory, spices and aromatics.¹³ "To the Persian Gulf, large
    vessels are regularly sent from Barygaza, loaded with copper and sandalwood and
    timbers of teak and logs of blackwood and ebony.''¹⁴ Gujarat sent iron and steel,
