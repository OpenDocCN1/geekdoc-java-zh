    # # Merchant Ivory


    As elephant habitat, the Indian subcontinent shows evidence of ivory use more
    or less concurrent with the earliest human habitation. A variety of ivory objects
    have been excavated from Harappan sites, including the modern region of Gujarat.
    However, for the hundred years up until ca. 1500, ivory use had rather stagnant
    in India as a whole, perhaps as a result of the constant upheaval by the expansion
    and contraction of the Delhi Sultanates. Ivory use does not disappear during this
    time period, especially not in western India. Nevertheless, the golden age of
    Surat represents equally golden age for ivory consumption in India, in general,
    and Surat, in particular.6


    After the seventh century, Surat was not dependent upon European traders for its
    prosperity. Many South Asian merchant networks had ties to Gujarat and its role
    as a Mughal port directly stimulated trade, especially with Muslim merchants received
    a lower customs duty on their wares.7 However, the participation of Europeans
    in the region created a new dynamic that affected not just the political arena,
    but trading patterns as well. Companies were, as Eric Tagliacozzo has noted, responsible
    for ‘hening the “life cycle”


