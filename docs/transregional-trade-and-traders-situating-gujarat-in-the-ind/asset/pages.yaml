    in Gujarati. The two main reasons for this insufficient investigation—sources
    and methodology. Most of the rich oral accounts of maritime Gujarat and its interaction
    with the sea are not well documented, while both printed and archival sources
    for its history are fragmented and diffused. These research problems have sometimes
    led writers to construct histories that are evidently slender and conceptually
    weak. Methodologically, to meet these challenges requires more nuanced and theoretical
    construction. Keeping these problems in mind, in recent years professionally trained
    historians and anthropologists are seeking to address these lacunae by weaving
    their studies methodically around the maritime past. Maritime history encompasses
    a number of broad themes such as marine archaeology, seafaring, shipbuilding,
    shipwrecks, port towns, and migration among others. Each of the themes challenges
    researchers to investigate several dimensions connected with them. Consequently,
    reconstructing the mercantile history and undertaking the ethnography of trade,
    traders, and commodities across the Indian Ocean require careful design and diligent
    scholarship. To be sure, it is not easy to map the transregional character of
    such histories, which is entangled within the web of exchange networks. Not least
    among these challenges is the need to consult sources in multiple languages. From
    the place of the production to the place of consumption a commodity might traverse
    several routes, regions, and seas. The entire complex process of commodity circulation
    involved a host of players, huge investments, and numerous commercial operations.
    It virtually the entirety of each society and culture that was engaged in oceanic
