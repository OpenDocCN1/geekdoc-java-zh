    The southern coast of Gujarat was one of the most prosperous parts of India (and
    consequently of the world) in the middle of the eighteenth century. Surat rose
    to prominence in the seventeenth century as the preeminent port of western India
    under the Mughals, a key location of the Indian Ocean that stretched between East
    Africa and Indonesia. There was brisk trade to and from the Red Sea and Persian
    Gulf, as there was with south and East Africa and parts of Southeast Asia. The
    English, Dutch, and French all had interests in Gujarat dating back to the early
    years of the seventeenth century. The Portuguese participated in the Gujarat trade
    by means of their ports in Diu and Daman. By the mid-eightteenth century, the
    East Company''s efforts were shifting towards the southern port of Bombay, although
    Surat and its hinterland remained important to them.


    One of the most productive towns of Surat''s hinterland was the port of Baruch,
    or Broach. An important location for the production of coarse baft fabrics, bleached
    fabrics, and yarn, Baruch''s villages and urban workshops supplied distinctive
    products to buyers in Surat and beyond. The farmlands around Baruch were equally
    profane, yielding abundant and high-quality cotton as well as rich land revenues.
    Given the abundant productivity of the region, it is little surprising that there
    were multiple claimants for local political power, especially as Mughal control
    wan in the early eighteenth century. The history of Baruch in the eighteenth century
    is a bewildering story with many colourful characters. Mughal courtiers, the Gaekwads,
    and other allies of the Peshwas, Arab and Sidi (east African-origin) fighting
    bands, Sufi lineages with farflung networks, Parsi, Jain, Muslim, and Hindu entrepreneurs,
