  md: 'Filling Hearts with Joy 185


    victory did not endure, however.32 As scholars have carefully documented,33 from
    1825 American merchants operating out of Salem, Massachusetts, established regular
    commercial relations with Zanzibar. Focused mainly on this market, and desperate
    to obtain its gum cop, ivory, and hides, these merchants went to great lengths
    to create a product that would enhance their trade prospects, introducing the
    new mills in Massachusetts to imitate Indian cotton varieties popular in eastern
    Africa. Eventually known eponymously as merikan (''American''), and valued above
    all for its durability, Massachusetts-made unbleached cottons ''pushed the similar
    English and Indian manufactured goods out of the market'';34 merchants of all
    nationalities in eastern Africa were sought to trade in and with it.35 The disruptions
    of the U.S. Civil War opened room to serious competition, notably from Bombay''s
    new textile mills to fill the gaps and by 1878 were exporting 2.8 million yards
    of the cloth to Zanzibar, 15 million yards a decade later.36


    What is not widely acknowledged is that until 1865 at least, hand-spun and -woven
    unbleached cottons from western India accounted for a significant share in this
    product category, up to 50 per cent. Goswami noted the names of several varieties
    exported from Kachchh and suggested the large quantities involved.37 From


    > 32 A multitude of factors contributed to the rejection of British unbleached
    cottons in eastern Africa. Many observers ascribed it to the fibre; the short-staple
    cotton used for cheap wares required heavy sizing with salts that were prone to
    mildew in the tropics; the compression the cotton underwent before shipping to
    England may have also compromised quality, Burton (1860:115); Forbes Watson (1866:73).
    So, the departure of British merchants from Zanzibar in 1845 hampered marketing
    and distribution, Loerer (1848).


