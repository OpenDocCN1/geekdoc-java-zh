    much a reflection of the cost of coffee as it was on foreignness. On social distinction
    in coffee consumption, Matthe¹⁴ notes that in seventeenth century Safavid Iran
    coffee drinking was confined to urban Iran, while Ralph Hatton¹⁵ throws more light
