    # Unbleached Cotton Sheeting


    Through early modern times, beaten bark cloth and hides clothed most residents
    of eastern Africa, with pockets of local handweaving and imported goods providing
    the garments of elites.28 In tandem with the global fashion craze for cotton,29
    as long-distance trade expanded and wealth rose in eastern Africa, country folk
    and the urban poor increasingly sought to replace bark and leather garments with
    plain-weave, unbleached coarse cotton vard, wearing it as rectangular body wrappers
    around the waist and chest. In the interior, certain varieties were further used
    as a commodity currency for acquiring labour, food, and other goods.30 At mid-century,
    this cloth type constituted the near majority—approximately 50 per cent—in terms
    of value of textiles to eastern Africa (Table 7.2). It was also the most easily,
    actively, and successfully admitted by western manufacturers until industrial
    means. A closer look, however, showed continued demand for the Indian handmade
    originals.


    It is certain that industrially manufactured bleached cotton made dramatic inroads
    into eastern Africa via Zanzibar. In 1811 Visiting English officers observed cotton
    cloth coming only from ‘Cutch’ and Surat, but by 1830 50 per cent of this product
    had been captured by British industrial goods.31 Manchester’s


