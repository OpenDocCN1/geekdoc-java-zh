  md: '344 Radhika Seshan


    Here, then, are some of the early mentions of the networks of trade and traders.
    In the first reference, one Indian seems to have been sent to make arrangements
    for the transport of goods and to make sure that the ''Addowaya'', the head of
    the caravan that was transporting the goods, did not delay and, more importantly,
    brought the goods directly to Swally (Swali). Apparently, there was enough trust
    in this man named ''Surianack'' so that details of this kind could be left in
    his hands. It is equally significant the mention of taking goods directly to Swally,
    so that they could be laden on the ships that were anchored there, rather than
    through Surat, where there was an ever-present fear that goods, once taken to
    Surat, would be kept under some pretext by the Governor of Surat, and the all-to-short
    sailing season would come to an end before the ships were loaded.


    With the last two quotations what is noticeable the range of contacts that existed,
    presumably both family and business. ''Jowe''(Jhav—a surname common in Maharashtra)
    was an agent—a ''vakeel''; ''Gourdas'' and ''Calliangee'' (Gurudas and Kalyanji)
    were brokers, related to Jadowe and the last named had the authority to obtain
    a varat for the transfer of funds from Burhanpur, on the north bank of the Tapt
    River in Madhya Pradesh, to Surat. Equally important, the person through whom
    the sale of the tapestry was made in the first place was a broker, probably one
    who operated from Surat, but through his people and agents in other parts of the
    Deccan area.


    Brokers were used for other things not directly concerned with the supply of goods,
    as at well. For example, in 1635, when the English were trying to establish a
    factory for themselves in Dabhol, the factor who was one, William Pitt, was instructed
    to accept the help of a broker named Vimal Das.20 A little later, the factors
    at Surat informed that Vimal Das had assured the English at Dabhol that they would
    not be affected by the incursions of the Mughals into as the Mughal army would
    not cross the mountainous area to come as far as Dabhol.21 There seems to be implied
