  md: '# 368 Abdul Sheriff


    As I was growing up, and this was true of most of the other Ithnaasheris at the
    time, the language that we were using at home to communicate with each other and
    even with our mothers and grand-mothers was Swahili. I was once invited by a friend
    to lunch, and at the dining table I found him speaking in Gujarati with his father
    and switching to Swahili when speaking with his mother, although he was from another
    Gujarati family who spoke the purest Gujarati amongst us. Recently I went to a
    shop in Zanzibar to buy a lamp and told the Bohora shopkeeper, what I needed,
    in Swahili. His reply was; ‘Sha mate Gujarati nathi bolto?’ (Why are you not talking
    in Gujarati?). I merely laughed and told him that I was a Jangbairo (Zanzibari)
    Ithnaasheri, and if I spoke Gujarati, he would laugh at me. My step-mother had
    grown up speaking Swahili at home, but had gone to the Arya Samaj School where
    she had learnt Gujarati to speak, read, and write. Her youngest brother had learnt
    to write in the Gujarati script at the ESM was very poor in speaking it. He later
    migrated to Australia, and my step-mother once received a letter from him that
    was written in Swahili, but in the Gujarati script (Figure 15.4).


    It was against this trend of indigenization that in the mid-1950s my father was
    suddenly gripped with a fear that he began a long and sustained campaign to force
    us to speak Gujarati at home. For me the campaign came at the wrong time when
    I was becoming a strong Zanzibari nationalist after the Suez crisis of 1956. I
    used to argue with him, when I could, that if a mother tongue is one I naturally
    use to speak with my stepmother and grandmother, then Swahili is our mother tongue.


    ***


    Let me conclude this story about my family and myself in the text of a longer
    and larger history of movement, migration, and assimilation from all the coasts
    around the Indian Ocean, creating cosmopolitan communities such as the Swahili.
    In my introduction, I had stated that I considered myself a Swahili-speaking Zanzibari
    of Indian origin, but not part of an Indian diaspora in Zanzibar. I had also said
    that my father was buried in Pakistan, a predominantly Muslim country with an
    Indic culture where he had sought refuge after the Zanzibar Revolution, because
    he said ‘did not want to be'
