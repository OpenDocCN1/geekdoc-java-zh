    Iraq and India and were buried near Karbala in Iraq which had become their spiritual
    home. The next three generations were born in Zanzibar: my grandfather lies buried
    in our family graveyard in Zanzibar; my father was buried in Pakistan where he
    had sought refuge after the Zanzibar Revolution; and myself—I now live in a small
    house in our family graveyard, and I wish to lie with my ancestors.


    In a nutshell, that is a history of a transnational family. The Indian Ocean has
    been cross-crossed for thousands of years by all the maritime people from the
    Swahili in the west, Arabs, Persians, and Indians in the centre, Malays and Indonesians
    of the Southeast Asian archipelago. Most of these people who moved were not religious
    refugees, slaves, or conquerors, although some were. Most of them were in fact
    ordinary sailors, petty shopkeepers (dukawallas), traders, merchants, and those
    seeking employment from them, having been crossing the open seas in search of
    economic opportunities from time immemorial. In such a history of routine movement
    of people with the annual monsoons, many them ended settling away from their original
    homes to make a new life for themselves, interacting and even intermarrying with
    the local people, and becoming part of new societies around the rim of the Indian
    Ocean.


    The question that arises is how do we characterize these people—is it their origin
    that remains the enduring stamp on their foreheads as diasporas from somewhere
    else, as has become the vogue in modern academia? A diaspora is not any community
    that finds itself at a particular time away from its original home. Everybody
    has come from somewhere else at some time, and with a loose definition of the
    term, all of us will have to consider ourselves part of the original diaspora
    from either heaven with Adam and Eve, or Olduvai Gorge in northern Tanzania where
    our evolutionary ancestor Zinjanthropus may have originated.


    To have any meaning, the concept has to have a more precise definition, implying
    a whole bundle of sentiments of attachment to a supposed original homeland as
    a true home: traumatic experience which may intensify attachment to their original
    homeland, as in the classic example of the Jewish diaspora; lacking integration
    into'
