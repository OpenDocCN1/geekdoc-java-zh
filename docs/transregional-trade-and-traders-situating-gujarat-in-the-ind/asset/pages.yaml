  md: '# Pattern-Dyed Cottons (''Prints'')


    Often called ''prints'' for the sake of convenience, pattern-dyed cottons times
    were made not by applying colour directly to the cloth surface, but by painting
    or block printing mordants (dye receptors) and/or resists (for example, wax) onto
    the surface of woven cloth and then immersing it in different dye baths. India
    was the undisputed global master of the art$^{89}$ Simply preparing the cloth
    to take the dyes required several days of washing and bleaching with dung. Castes
    specialized in carving wooden blocks, preparing the basic fabric, stamping mordants
    and resists, manipulating the various dyes baths, then washing, bleaching, drying,
    and calendaring to finish the piece. Altogether, they added 50 to 75 per cent
    of the value of final cloth price. Europeans studied and experimented for centuries
    to imitate these techniques, but only made major advances in the late eighteenth
    century by mechanically and directly printing colour onto cloth, with London and
    Lancashire capturing global markets, processes further accelerated from the late
    1850s with the invention of aniline dyes$^{90}$


    A variety of evidence shows Zanzibar''s imported cloth in the nineteenth century
    were of two very different technical and stylistic types, the one made in western
    India and the other in Europe, consumed in roughly equal proportion.$91}$ Together,
    before 1880, they did not account for more than 4 per cent in value of cloth imports.


    On the one hand, eastern Africa in the first three quarters of the nineteenth
    century continued to consume large numbers of rectangular wrappers handprinted
    in western India. Certainly, by mid-century, and likely early, they constituted
    the primary dress of Swahili women, who wore one piece over the chest and another
    over the head. These Indian ''prints'' came in two varieties, known as Swahili
    msutu and kisutu, the second to be ''inferior'' to the


