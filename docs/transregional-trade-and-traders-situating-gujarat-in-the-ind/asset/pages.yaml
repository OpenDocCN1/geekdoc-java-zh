  md: '# 3 Gujarat and Long-Distance Trade in the Indian Ocean Region before the Sixteenth
    Century


    PHILIPPE BEAUJARD


    Northwestern India, and particularly Gujarat, played a crucial role in the history
    of the ancient world by building connections with various Indian Ocean regions.
    These included the Persian Gulf, southern Arabia, the Red Sea and the Horn of
    Africa on the one side, and southern India, Sri Lanka, and Southeast Asia on the
    other. Gujarat benefited from its agricultural potential, and acted as a hub for
    various areas. This explains both its success and the constant efforts by regional
    powers to control it. In this chapter I will attempt to demonstrate the ways in
    which Gujarat proved to assert its power and gradually become a major actor in
    exchanges in and around the Indian Ocean, exchanges that also have connections
    to religious networks and places.


    # The Rise of Long-Distance Trade during First Millennium BC


    We do not have much evidence for maritime or land trade following the collapse
    of the Indus civilization, but some ports must have


