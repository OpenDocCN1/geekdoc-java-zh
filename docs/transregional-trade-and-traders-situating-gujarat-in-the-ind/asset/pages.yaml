    painters (also identified as ''printers''), washermen, and bleachers. Good-quality
    packing ensured the safety of goods during long voyages by sea to avoid dampness
    and spillage of the goods. Merchants regularly complained about the behaviour
    of these groups. While merchants were forced to pay money in advance, to get the
    goods in time (before the shipping season started) according to the conditions
    of the contract, they could be betrayed in terms of quality and late delivery
    of goods. Brokers or artisans and collateral service providers bore the brunt
    of such complaints in case of delay in assignment, poor quality, or damaged goods.
    On the other hand, there were plenty of chances for cheating on the part of employers
    too. There were issues constantly negotiated upon both sides, and ample information
    on the subject suggests that the textile industry was the most dominant among
    all the industries of the period. It is a noticeable fact that most of the complaints
    registered against any of the groups of artisans were related to weavers, washers,
    and painters. On the other hand, these people also protested frequently against
    the exploitation on the part of their employers or the brokers who acted as mediators.
    Nevertheless, despite all these tensions and pressures, the textile industry continued
    to grow.


    Inumerable works are available on the growth of the textile industry India after
    the arrival of the Europeans in the subcontinent, including the techniques of
    production and varieties of cloth. Excellent writings on the volume and organization
    of trade are also available in plenty.¹ In this chapter I attempt to understand
    the relationship between artisans and service providers and the merchants in the
    light of contemporary European accounts, with special reference to the English
    in the region of Gujarat. The discussion is centred on how they were engaged and
    to work or forced to make adjustments between indigenous practices and changing
    needs of the time as determined by the European commercial companies. I will also
    examine the difficulties both parties, employers and producers, faced in balancing
    output to demand.


