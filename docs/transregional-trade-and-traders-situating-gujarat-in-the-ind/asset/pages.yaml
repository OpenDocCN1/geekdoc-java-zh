    # Surat and Ivory


    Surat became a major international entrepôt in the seventeenth century. It was
    arguably also the single most important port for ivory trade in Asia, and perhaps
    the world until until it was eclipsed by Bombay sometime in the nineteenth century.
    Enormous amounts of elephant ivory from nearly every source on the planet, including
    African sources from Mozambique, Zanzibar, Guinea, and the Cape, and Southeast
    Asian sources like Siam and Sumatra were brought to Surat by Indian merchants,
    caravans and Western traders to respond to a rise in consumption of ivory throughout
    India. The rise and fall of Surat cannot be directly attributed to ivory, but
    was instrumental to Surat''s economic viability until it was no longer available.


    Located on the Tapt River, Surat was part of an economic hive around the Gulf
    of Khambhat that consisted of Daman and Diu, Bhavnagar, Bharuch, and Khambhat.
    Surat had ancient roots as a port, but began to thrive in the sixteenth century
    as silting of the river made more or less inaccessible by water causing Mughal
    patronage to gradually shift there. According to Abbé Raynal (1713–96) enabled
    Surat to gain the ''valuable prerogative'' by which all the treasures of newly
    improved industry (craft production) were collected. The repeated predations of
    the Portuguese in Rander and the result-ing fortification of Surat certainly contributed
    to this prosperity, as much as the decline of Khambhat due to alluvium.


    However, none of these factors adequately explain the interconnection between
    the prosperity of Surat and ivory. Relatively distant elephant habitat, with no
    ancient tradition of ivory carving, it is not logical as a location as, say perhaps,
    Transancore. As Bombay bureauc and businessman Henry Briggs (1824–72) wrote, ''Half
    a dozen


