  md: '# Surat 233


    Silt gradually filled the river, making it necessary for ships to dock farther
    and farther distant; Walter Hamilton notes in 1820 that ships had to anchor twenty
    miles below Surat.84 The great fire of 1837 raged for two days and destroyed as
    many as 9,373 houses, marking the end of Surat as an important maritime power,
    but the handicrafts produced it continuing significance.


    Eventually, Bombay did usurp the vitality of Surat as an ivory destination but
    this shift was much slower than one would suppose based on scholarly assessments
    of demise ranging across the eighteenth century. The shift away from Surat was
    in part due to English administrative decisions. Specifically, in the nineteenth
    century, customs on ivory tusks was 5 cent in Surat, but only three and a half
    cent in Bombay, driving traffic to the latter.85 Craftsmen follow their patrons,
    and as Bombay grew the number of craftsmen in Surat decreased. By the end of the
    nineteenth century, was ‘no great demand’ in Surat for works of ivory. Objects
    from European mass production competed with local products.86


    Ultimately, it was the decline of ivory imports through Surat that marked the
    end of Surat as a major entrepot. Surat remained prominence as an ivory carving
    centre into the twentieth century but was eclipsed by newer centres in other regions
    of India like Delhi and Murshidabad. In 1900, art school principal and artist
    Cecil Burns87 of Bombay noted that ‘in Surat no great demand exists for ivory’,
    but that was ‘in consequence of such goods, whether for use or ornamental, being
    sold at higher prices’.88 Burns did not include bangles in this assessment, which
    nevertheless notes were produced in Surat and widely known. Even in 1932 one survey
    listed twenty-five Surat craftsmen of ivory, making things such as bangles, buttons,
    rings, combs and stick handles, ear ornaments, and chains. Ivory no longer shipped
    directly to Surat and to be obtained from Bombay, but the few remaining artisans
    made a good living at it, despite the pressure from cheap celluloid imitations
    from Germany


