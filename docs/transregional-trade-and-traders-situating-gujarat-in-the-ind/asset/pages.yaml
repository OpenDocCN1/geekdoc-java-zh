    # The Many ‘Cloths’ of the Eastern African Trade


    The commercial boom in the western Indian Ocean that followed in the wake of the
    Napoleonic Wars has been mapped in considerable detail.^22 Around 1832, the sultan
    of Oman—with the close support of Kachchhi merchants and their capital—moved his
    to the small island of Zanzibar laying off-present Tanzania, to create a centralized
    entreôt for mainland eastern Africa’s ivory, gum, hides, slaves, and Zanzibar’s
    own cultivated cloves, and the foreign goods—especially cloth, beads and wire—sought
    in return. Simultaneously, increasing numbers of merchants from New England and
    Hamburg flocked to Zanzibar, attracted by its export goods and the secure trading
    conditions. Finding themselves dependent on the same ‘Indian cloth’ as their Asian
    and African counterparts to these goods, it was not long before western traders
    sought to substitute them with industrial imitations.


    A study of import/export records for Zanzibar and caravan packing lists for the
    interior reveals that over time seven basic types of cloth were consistently in
    demand: unbleached cottons, bleached cottons, indigo dyed cotton, ‘red cloth’,
    printed cloths, striped/checked cloths, and silks. Table 7.1 presents the known
    kinds of cloth exported to, and imported into Zanzibar, regrouped according to
    these categories, together with contemporary descriptions of them. In addition
