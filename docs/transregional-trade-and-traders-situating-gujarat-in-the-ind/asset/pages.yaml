    Nishat Manohar teaches in the Department of History & Culture, Jamia Millia Islamia,
    New Delhi, India. He specializes in medieval Indian history and has published
    papers on mysticism, artisans, and urban wage earners, landed aristocracy in pre-Mughal
    India, and various other themes based on information contained in the Persian
    texts and European travellers’ accounts of the sixteenth–eighteenth century. She
    has published a monograph entitled Social Life Inside the English Factories in
    India during the Seventeenth Century (Email: nmanzar@jmi.ac.in).


    Himanshu Prab Ray was chairperson of the National Monuments Authority, Ministry
    of Culture, New Delhi, until August 2015, and as the recipient of the Annelie
    Maier Research Award (2014–19) of the Humboldt Foundation she is honorary professor,
    Ludwig Maximillian Munich. Jawaharlal Nehru University, New Delhi. Her research
    interests include maritime history and archaeology of the Indian Ocean, the history
    of archaeology in south and southeast Asia, and the archaeology of religion in
    South Asia. She is series editor, Archaeology and Religion in South Asia.


    Her books on maritime contacts include: Beyond Trade: Cultural Roots of India’s
    Ocean, 2015; The Archaeology of Seafaring in Ancient South Asia, 2003; The Winds
    of Change: Buddhism and the Maritime Links of Early South Asia, 1994; Oxford India
    Paperbacks, 1999; 2000; as edited volumes, Bridging the Gulf: Maritime Cultural
    Heritage of the Western Indian Ocean, 2016; Satish Chandra and Himanshu Prab Ray
    eds, The Identity and History: From the Bay of Bengal to the South China Sea,
    2013; H.P. Ray and E.A. Alpers eds, Cross Currents and Community Networks: Encapsulating
    the History of the Indian Ocean World, 2007; H.P. Ray and J.F. Salles eds, Tradition
    and Archaeology: Early Maritime Contacts in the Indian Ocean, 1996; Updated edition
    2012 (Email: hprayju@vsnl.com).


