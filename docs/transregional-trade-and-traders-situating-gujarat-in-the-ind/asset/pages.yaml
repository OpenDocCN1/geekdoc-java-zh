    Contary to the usual view of Indians as ‘birds of passage’, within fifteen months
    of beginning to trade at Zanzibar, Dewji Jamal considered a permanent home there.
    In April 1866, he bought a plot of land in the Malindi quarter to build our ancestral
    three-storey building where he lived, and where my grandfather, father, and I
    were born. While building this house, he bought another house in the same area
    from a Bahraini Shia to live in.¹²


    Although he had come from India, the house he built was not a Gujarati haveli
    for ivory, the one built by Jairam Sewji, or a Gujarati shop-front house that
    had begun to sprout along the bazaar streets. It resembles an Omani mansion familiar
    to local builders who must built it. It was a typical free-standing multi-storey
    square structure with rooms along the four sides with a courtyard in the center
    to allow light and breeze to penetrate into the interior of the house (Figure
    15.2). However, it did not have an elaborately carved wooden door that was a characteristic
    feature of the Arab landowners mansions. Dewji Jamal was a merchant, and he was
    more interested in security and investing his capital to expand his business rather
    than conspicuous consumption—a so-called ‘Protestant ethic’ according to Weber.
    The door therefore is not carved at all, but with heavy cross-bars that protected
    the family even through the Revolution.


    Again contrary to the popular conception of Indians living in their ghettos, Dewji
    Jamal selecting the site of his house does seem to have been influenced by a desire
