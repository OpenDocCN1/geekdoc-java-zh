    From ancient times market prices influenced the movement of goods and seem to
    have favoured the import of Egyptian copper into Barygaza, which in turn exported
    copper to Apologos (copper was also produced in northwestern India). Precious
    metal prices favoured the import of Egyptian gold and silver coins into Barygaza.
    Such coins commanded ''an exchange, at some profit, against the local currency''.¹⁸


    Indians from Gujarat and other parts of India were also present on the Arab coasts,¹⁹
    in Socotra and the Red Sea. Black Ware from Gujarat been unearthed at Berenike,
    Myos Hormos and Aila, and northwestern Indian rice-tempered wares have been identified
    at Berenike and Sumhuram.²⁰ Ras Hafun (Somalia)—the Opônē of the Periplus—a site
    dated between AD 100 and 500 had yielded ceramics from Gujarat and the Persian
    Gulf.²¹


    During the second century AD, the Kushans added Gujarat to their empire. The Kushan
    empire had contacts with Sri Lanka via Gujarat. This period saw a new expansion
    of Buddhism that was partly linked to trade. Thapar² emphasizes the interconnections
    between the royal families, the Buddhist community, and the sreni guilds of craftsmen
    and merchants in various parts of India. An inscription at Nasik (Maharashtra)
    dated to AD 42 reveals an investment made by the son-in-law of the Indo-Scythian
    king Nahapāna with weavers'' guilds, with the interest passed on to the monks
    of a monastery.²³ Third-century documents from north-western India in Saka territory
    show that monasteries functioned as financial institutions, receiving deposits
    and practising loans with interest.²⁴


    The world-system experienced a recession from the third century onwards, due to
    a combination of factors both external and internal to the cores, as global climate
    change, over-extension of the empires, and epidemics. This recession was accompanied
    by large-scale population movements in Eurasia. Four empires collapsed


