  md: '# Introduction


    merchants, other Gujarati ports like Porbandar and Somnath gained notoriety as
    ports of trade. During the Early Historic Era (ca. 100 BCE–300 CE), the port of
    Barygaza (the antecedent of modern Bharuch or Broach) gained renown for its multitude
    of products and its diverse population. Following the rise of Islam in seventh
    century Hijaz, Arabia, Barygaza was replaced by Khambhat (Cambay) as the dominant
    global commercial entreôt centre as its ancient predecessor. By the time the Portuguese
    intruded into the Indian Ocean and reached India at the beginning of the sixteenth
    century, Cambay was acknowledged as the western Indian Ocean equivalent to Melaka
    in the east. In the early modern period, as the Portuguese were pushed out by
    both the Dutch and the English East India companies, Surat emerged as the dominant
    maritime commercial port, eventually to be superseded in the late eighteenth century
    by Bombay (now Mumbai, Maharashtra). At the same time, however, several ports
    in the Gulf of Kachchh, notably Mandvi, Bhavnagar, Porbandar, Okha, and Dwarka,
    rose in significance with the decline of Surat. Whatever otherwise one wants to
    believe about the history of Gujarat, the incontable fact remains that the Indian
    Ocean for thousands of years played a vital role in the shaping of its history.
    Perhaps it is this very rich history of the ports of Gujarat that stimulated Acharya
    to remark: ‘From the time of Harivansh (Ramayana/Mahabharata) to the invasion
    of Alexander and from his invasion till day Gujarat’s sailors hoisted their flags
    on the eighty-four ports.... Those who plotted to plunder the wealth of Hindustan
    attempted to control the ports of Gujarat.


    Acharya was among those few who understood the importance of perceiving Gujarat’s
    past through the vistas of the sea. Continuing the literary genre formed by Acharya,
    certain Gujarati novelists and amateur historians, namely, Dungarshi Dharamsi,
    Zaverchand Meghani, Manubhai Pandhi, Van Pandhi, Jayant Khatri, Narayan D. Kharwa,
    Ramji Jethva, and Hasmukh Aboti attempted to interweave their writings around
    the sea. Sadly, historical accounts of Gujarat through the prism of the sea are
    still under-researched, especially,


