  md: '# 234 Martha Chaiklin


    and Japan.89 Thus, according to the Times of India Directory of 1964, ‘ivory bangles
    are the major handicrafts for which Surat is famous not only throughout India
    but even abroad''.90


    To summarize, ivory was a vital component of the prosperity of Surat. The administrative
    measures set in place by the English at Bombay sapped vital trade from Surat and
    became a significant factor in its decline. Equally important was competition
    from new materials like celluloid and plastic, the materials that replaced ivory
    for most people. The view through an ivory loupe, however, shows a vital port
    well through the nineteenth century. To paraphrase Douglas Haynes,91 Surat without
    ever collapsing. African ivory has been banned in India since 1990, but bangles,
    although of other materials, are still manufactured in Surat. Ivory may have gone
    but its legacy lives on.


