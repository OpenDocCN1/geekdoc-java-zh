  md: '# Gujarat in the History of the Indian Ocean


    Navigating Maritime Pasts


    LAKSHMI SUBRAMANIAN


    How ow was history written in Gujarat? How has the history of Gujarat been organized
    in professional history circles, especially after independence? The questions
    are of importance for two reasons. One, the increasing claims to history writing
    in recent years that have not only complicated existing disciplinary protocols
    but have also opened up new ways of thinking about regional imagination in popular
