  md: '# Coffee Mocha


    From the Highlands of Yemen to Surat, Muscat, and Mandvi


    CHHAYA GOSWAMI


    Coffee is one of the most important agricultural commodities in the world. How
    it became such a significant item of world trade has been studied by many historians,
    but the rise of coffee as a chief commodity of circulation in eighteenth-century
    Muscat and its linkage to Mandvi are not much documented. From the time of its
    rise to prominence in the seventeenth century, Surat''s polygonal trading network
    across the Indian Ocean was a source of strength and dynamism. Although the sea-borne
    trade of the Gulf of Kachchh was considerable, the ports of Kachchh and Kathiawar
    tend to be overlooked in the contemporary sources compared to Surat, where European
    commercial activity was based. In this chapter I interested to explain how Surat''s
    control over the coffee trade was challenged with the entry of maritime players
    from Muscat and Mandvi and how they subsequently influenced rerouting of the trading
    networks of the Arabian and Red Seas. This part of the story also involves how
    Bombay''s commercial links with Muscat and Mandvi in the eighteenth century worked
    to marginalize Surat in the Red Sea and the Persian Gulf coffee trade. Before
    I discuss this transformation I look first at the wider setting of the coffee
    trade in the western Indian Ocean.


    Chhaya Goswami, Coffee Mocha: From the Highlands of Yemen to Surat, Muscat, and
    Mandvi. In Transregional Trade and Traders: Situating Gujarat in the Indian Ocean
    from Early Times to 1900. Edited by Edward A. Edwards and Chhaya Goswami, Oxford
    University Press (2019). DOI:10.1093/oso/9780199046803.*'
