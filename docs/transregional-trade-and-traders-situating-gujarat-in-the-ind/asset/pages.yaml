    Transregional Trade: Situating Gujarat in the Indian Ocean from Early Times to
    1900. Edited by Edward A. Edwards and Chhaya Goswami, Oxford University Press
    (2019). Oxford University Press. DOI: 10.1093/9780199496032.003'
