    the pre-colonial period was the centrality of Gujarat as the premier maritime
    region enjoyed in the trade of the Indian Ocean. This derived largely from the
    commercial potential of the region and its innate ability to draw on a huge range
    of valuable produce and from the natural advantage it enjoyed in terms of the
