  md: '# Engaging Weavers in Gujarat


    Weavers were known as *min''a bāft* or *nūr bāft*. An Indian term *patbuniya*
    has also been used for them by a seventeenth-century autographer named Banarsidas.$^2$
    Many centres of textile production that emerged in Gujarat gained widespread recognition
    in the seventeenth century because of the steady and gradually increasing demand
    of textiles and other goods in the international market. The arrival of the two
    dominant companies—the Dutch East India Company (VOC) and the English East India
    Company (EEIC)—gave a boost to the textile industry is a commonly known fact.
    The textile industry itself be divided into two major categories: cotton and silk.
    Centres of weaving textiles were located in almost all parts of India, while some
    specific centres were also recognized for manufacturing silk. Gujarat was one
    of the regions where both textile industries flourished. Ahmedabad, Baroda, Surat,
    Baroch [Bharuch], Navsari, Gandev, and Ankleshwar are the names of places which
    are repeatedly noted in the contemporary sources. Among the varieties of cotton,
    Gujarat was mainly known for a fine quality of calico known as *bfta* (plain cloth,
    usually in colour), and printed cotton goods called chintz (*chhīnt*); for silk,
    it was *patola* that made the region globally celebrated. While cotton goods were
    in greater demand depending upon the quality and variety, silk was procured by
    the merchants for specific destinations and clientele. However, European and Asian
    merchants picked all kinds of textiles for national and international markets.


    The method of procuring textiles underwent a change with increase in demand. While
    in the early years of the arrival of the companies associated with them purchased
    the pieces directly from the market, growing competition forced them to go for
    the *dādāni$^3$ system, called the ‘putting out system’ by modern scholars.$^4$
    Excellent báftas were prepared in Baroch, a city that was known for having a large
    population of energetic and productive weavers. Surat was one of the greatest
    centres of textile production. The entire


