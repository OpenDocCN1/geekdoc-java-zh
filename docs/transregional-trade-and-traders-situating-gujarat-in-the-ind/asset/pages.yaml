  md: 'Lakshmi Subramanian is a historian specializing in modern India with more than
    30 years of teaching and research experience. Her areas of expertise include the
    social and economic history of trade networks and communities in the Indian Ocean
    and the social history of music and performance in south Asia. She has access
    to a number of Indian languages including French and English. She has worked from
    a number of archives in Mumbai, Delhi, Kolkata, London, and Edinburgh and has
    a keen interest in the trading histories of the Indian littoral.


    Her works include Three Merchants of Bombay, 2012; A History of India 1707–1857,
    2010; Veena Dhanammal The Making of a Legend, 2009; and Ports, Towns and Cities:
    A Historical Tour of the Indian Littoral, 2008 (Email: nilgiri98@gmail.com).'
