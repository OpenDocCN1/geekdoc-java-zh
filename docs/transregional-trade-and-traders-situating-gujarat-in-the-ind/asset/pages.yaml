    the subject, three relevant matters need to be stated. First, there is an unmistable
    continuity in the maritime linkages of Gujarat over not merely centuries but millennia,
    in terms of both coastal and high-sea (blue water) voyages, notwithstanding the
    shifts in the locations of premier ports which must have been served by their
    (i) respective hinterlands and forelands, (ii) feeder/subsidiary ports, and (iii)
    seafaring communities. The second point of note is the interlocking of the agricultural
    material milieu (undoubtedly), the mainly of the economic life) and the commercial
    activities, both inland and maritime. The third point is about the nature of our
    principal source—the letters of the Jewish


