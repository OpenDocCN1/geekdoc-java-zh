    people belonging to different communities and even classes coincided. As late
    as the 1870s the resident mission doctor James Christie wrote, ''mongo huts are
    not confined to any distinct part of the city'',15 and the explorer Stanley said,
    ''Melindi is a medley of tall white houses and low sheds.''16 When the British
    carried out a detailed survey of the town in 1892, they found that there were
    over 1,500 stone houses, more than 5,000 huts on this peninsula, and that richer
    people and their stone houses existed check by jowl with poor people in their
    huts.''17


    However, with the establishment of colonial rule in 1890, British building regulations
    began to realign the population of the town along racial and class lines according
    to their conception of a colonial town. They tried to demarcate the town clearly
    to separate it from the triangular peninsula from the growing ''native quarter''
    on the ''Other Side'' (Ngambo), with the creek cordon sanitaire between them.''18
    Citizens on the peninsula were required to plaster their houses and roof with
    corrugated iron sheets on the argument that thatch roofs were prone to fire. Those
    who could not afford to do so were exiled to the ''Other Side.'' By the time I
    was growing up in the 1950s, the town had been socially divided. I remember only
    one ''African'' who lived in our immediate neighbourhood. This is how the so-called
    Zanzibar Stone Town came about, a British creation and not a standard feature
    of Swahili towns as claimed by western anthropologists and historians.''19


    Colonial racial policies were not alone in bringing about concentration of different
    communities in different parts of the town. The fact that Indians were largely
    restricted to trade by British anti-slavery policies meant they tended to be largely
    confined to the town, and were concentrated along these few bazaar streets across
