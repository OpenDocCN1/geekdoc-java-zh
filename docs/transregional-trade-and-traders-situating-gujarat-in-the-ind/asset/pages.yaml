    British pressure to suppress the arms trade continued through the 1890s, and in
    1898 compelled Sultan Faisal b. Turki to require British subjects and protected
    persons in Muscat to register all arms transactions. The number of arms dealers
    grew rapidly thereafter as the Banyan dealers sought Arab partners so as to bypass
    the regulations. In 1899 European merchants, beginning with the French Goguyer
    in March,28 began transferring operations from Jibuti. The trade continued to
    thrive, in May 1908 the Brussels Conference reconvened. Ratansir expressed his
    concern to the German arms dealer Moritz Magnus, who replied:


    > We have carefully noted what you are writing about the conference held in this
    moment in Belgium, but we think your apprehensions are going to far. There are
    too many interests connected to the Arms Trade, & are too good businessmen, as
    spoil this important commerce of which even their subjects are taking profit of
    in a considerable manner.29


    Despite Magnus'' assurances, Ratansi sought to protect his investment with an
    insurance policy that would cover the value of any arms that were in transit should
    a ban on exports/imports be implemented. Scharte and Hammer''s insurance broker
    would not write a policy.30 British pressure on Sultan Faisal continued, and in
    1912 he agreed to a warehousing scheme that effectively abolished the trade.


