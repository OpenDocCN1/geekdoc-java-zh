  md: '# Gujarat in the Indian Ocean


    The long-held belief that India''s maritime frontier was more or less irrelevant
    to the dominant forces in the sub-continent''s history, no longer prevails. In
    light of India''s extensive littoral, stretching 7,517 kilometres from the mouth
    of the Ganga in the east to the Gulf of Kachchh in the west,⁴ it is surprising
    to consider how pervasive and enduring this misconception was. From the of Bengal
    to the Arabian Sea, standing on the shores of Coromandel, Malabar, Konkan, Gujarat,
    or Kachchh, Indians have for millennia looked to the sea for at least part of
    their livelihood. Salt production, fishing, and even piracy (always so defined
    by those being attacked) constituted integral components of coastal societies.
    Coastal India also played a pivotal role in the larger currents of Indian Ocean
    commerce; whether or not its inhabitants were frequently drawn into the more global
    orbit of movement that marks the history of the Indian Ocean world. Among all
    of the major coastal zones of India, it is Gujarat that stands out for experiencing
    the longest recorded history of such continental contacts and exchanges. As far
    back in time as the third millennium BCE, there exists convincing evidence in
    the material remains discovered by archaeologists of maritime, contacts between
    the civilizations of Mesopotamia and that of Harappa. Over centuries, such contacts
    extended to the Red Sea and north-east Africa, marked by the anonymous botanical
    exchange of plants and animals between Africa, Arabia, and South Asia. With interruptions
    occasioned by global climate change and regional political developments, maritime
    connections were refashioned by both Indian and foreign sailors on a regular basis.


    Blessed with numerous safe harbours and accessible ports, as well as a vast and
    richly enriched hinterland, Gujarat was absolutely central to the history of Indian
    Ocean maritime exchange involving not only goods, but also people and ideas. Although
    the Gulf of Khambhat became the favoured destination of overseas


