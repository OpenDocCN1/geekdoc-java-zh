  md: '# About the Editors and Contributors


    Ranabir Chakravarti is professor of ancient history, Centre for Historical Studies,
    Jawaharlalarlal Nehru University, New Delhi, India; he specializes in the social
    and economic history with a particular interest in the Indian Ocean maritime history.
    A regular contributor to referred journals, Chakravarti has authored/edited books,
    including: A Sourcebook of Indian Civilization, 2000; Trade in Early India, 2005;
    Trade and Traders in Early Indian Society, 2007; Indo-Judaic Studies in the Twentyfirst
    Century: A View from the Margin, 2007; and Exploring Early India, 2013. He has
    also annotated the text, How to Defeat the Saraces, 2012. Chakravarti was elected
    the presidential president (Ancient India) of the Indian History Congress (72nd
    session, Patjala) in 2011. He has presided over the Ancient India section of Punjab
    History Congress (2011, Punjabi University, Patjala). Ranabir Chakravarti delivered
    the Anniversary Commemorative Lecture, ‘India and the Indian Ocean: Issues in
    Trade and Politics up to c. 1500 CE’, under the auspices of the Maritime History
    Society, Mumbai, in May 2014 (Email: ranabirallatase@gmail.com).


    Sarah Fe is curator of Eastern Hemisphere Textiles at the Royal Ontario Museum,
    Toronto, Canada. She holds degrees in anthropology and African studies from the
    University of Oxford and the National School of Oriental Studies, Paris.


    Her primary research focus is Madagascar and its textile arts and trades, on which
    she has published extensively. Under the auspices of a 5-year grant from the Social
    Science and Humanities Research Council (SSHRC), she is currently conducting studies
    on the joined hand-weaving of the western Indian Ocean world. The first results
    of this work have been published in Textile History, 2017, and in the volume she
    co-edited with Pedro Machado and Gwyn Campbell, Textile Trades, Consumer Cultures
    and the Material Worlds of the Indian Ocean: An Ocean of Cloth, 2018.


    She serves as an affiliated faculty at the University of Toronto and is a research
    associate at the Indian Ocean World Centre, McGill University (Email: sarahf@rom.on.ca).


    Chhaya Goswami is the head of the Department of History, S.K. Somaiya College,
    Mumbai, India. She specializes in the maritime history of South Asia and the western
    Indian Ocean. She has authored two'
