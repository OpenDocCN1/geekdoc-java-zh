    be dried and was not, therefore, exported to India, and as mentioned above, it
    was considered a low-quality fruit locally. However, once the export market opened
    up, fards became the most valuable dates in the market with fard offshoots selling
    for double that of other varieties. In the 1880s ‘demand for it to plant this
    kind in their gardens to the exclusion of others''²¹ and found that they could
    sell all that they could harvest.²2 The stiff competition, both in Muscat and
    the United States between Muscat and North Africa, kept fairly stable with most
    of the rise from $US.01 in 1880 to $US.04 a pound in 1910 attributable to the
    decline in value of the Maria Teresa Dollar due to a decline in silver prices.²³


    A third, and more long-term, impact was changed in the reputation of the fard
    date locally. As Paul Popopoe related above, the fard was not even considered
    among the top five dates in Oman in the nineteenth century. International market
    demand completely reversed local opinion as the perceived quality of the date
    became linked to its premium price. Today, the fard, if at least one goes by Omani
    marketing as represented by what is featured at its airport duty free shop, is
    among the Sultanate''s natural delicacies.


