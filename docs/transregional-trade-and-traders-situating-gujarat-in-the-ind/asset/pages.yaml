    Gujarati traders in this eastern region of the Indian Ocean world. She explains
    that the profitable trade in pepper and spices in the eastern archipelago was
    virtually impossible without the role of cotton textiles from Gujarat.


    Gujarati shipping played a vital role in profitably connecting the ports of the
    Indian Ocean. In the eighteenth century, when the demand for the ships increased,
    the size of the Gujarat fleet comprising a range of ocean-going vessels also increased.
    Taking the strength of Diu''s and Daman''s mercantile shipping into account, Pedro
    Machado argues that apart from overstating the disruptive effects of the ''decline''
    of the Eurasian empires—a notion bound with European justifications for conquest—this
    view has exaggerated the diminution of Gujarati shipping in the ocean by largely
    overlooking the continued expanded presence of medium-sized ocean-going ships
    in the western Indian Ocean into the nineteenth century.


    By focusing on Ahmedabad, Baroda, and other inland trading depots, Radhika Seshan
    traces merchant''s connections to the interior. She highlights the accessibility,
    contact, and reach of Gujarati merchants to different places in India, with particular
    reference to the connections across Deccan and the peninsula.


    Finally, and turning away from the world of commodities and networks, Abdul Sheriff''s
    chapter addresses the question of migration and diaspora in an unusually personal
    essay. Traders showed prodigious flexibility in the settlement and adaptation
    to distant spaces. During their transient or permanent stays, they stayed between
    the dichotomy of old and new identities and also from ''rootlessness'' and reconnection
    to the place of origin. Focusing on the subject of family and personal identity,
    Sheriff''s chapter looks critically at the context of wider migrations and settlements
    across the Indian Ocean by all sorts of people (especially traders). He is interested
    in how and why they migrated, how they became indigenous and part of constantly
    evolving new societies. Why, he asks, am I a Swahili-Zanzibari of Indian origin,
    rather than a diasporic Gujarati, and what does this indigenous identity mean?
    His is a perspective that complicates our understanding of ''diaspora'' that is
    often lacking in the existing literature on Gujaratis or Indians overseas.'
