  md: '# # Reaching Across Land and Sea

    nThe Transregional Networks of a Local Man*


    SAMIRA SHEIKH


    Gujarat has a long and spectacular history of transregional trade and traders.
    Prior to 1900, Gujarati traders travelled the length and breadth of the Indian
    Ocean and great expanses of overland territory. Gujarati products could be found
    across the globe. I will not attempt to recapitulate this history, aspects of
    which are recounted in many important volumes, including this one. Instead, this
    chapter narrates the story of someone who was neither a trader nor a transregional
    agent. He was a local player in Gujarat''s tangled politics of the late eighteenth
    century who probably never travelled more than a few hundred kilometres from his
    hometown of Bharuch. Nevertheless, as I hope to demonstrate, his life and his
    business interests were inextricably connected with Gujarat''s far-flung transregional
    trade. Drawing from his life and actions, I will argue that Gujarat''s politics,
    even in the hinterland and even when ostensibly far removed from the Indian Ocean
    trade world, were deeply


    > * I am grateful to Darshak Itih Nidhi and Hasmukh Shah for the invitation to
    the conference at Surat. I particularly thank Chhaya Goswami-Bhatt for making
    arrangements and for invaluable help with the research for this project.


    Samira Sheikh, Reaching Across Land and Sea: The Transregional Networks of a Local
    Man. In: Transregional Trade and Traders: Situating Gujarat in the Indian Ocean
    from Early Times to 1990. Edited by Edward A. Alpers and Chhaya Goswami, Oxford
    University Press (2019).

