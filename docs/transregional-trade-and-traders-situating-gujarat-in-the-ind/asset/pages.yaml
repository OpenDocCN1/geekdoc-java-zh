  md: '# Coffee in Legend, Landscape, and Use


    We do not have much information on the use of coffee before the early 1500s, but
    what is commonly known is that there was a modest trade in coffee between Ethiopia
    and Yemen in the middle of the fifteenth century. Seingly, coffee was cultivated
    in Ethiopia and distributed through the Red Sea. This stimulant received religious
    sanction when the documented use of coffee was found among Sufi societies in the
    late fifteenth century. Thereafter, coffee was used as a devotional aid in Sufi
    dhikr ceremonies, which Sufi devotees would meet at night and perform rituals
    meant to elevate their consciousness towards the divine.¹ In these ceremonies,
    coffee was regarded as a useful aid to worship since it allowed the devotee to
    perform the rituals well into the night.² The Yemeni legend of Sheikh Ali Omar
    Shadhili gives some interesting clues regarding early commercial interaction with
    southern Arabia and the Red Sea. The legend attributes the foundation of Mocha
    to Shadhili''s religious life and teaching, but it also specifically indicates
    that in Shadhili''s Indian ships offloaded their cargo of merchandise to Mocha
    before heading to Jeddah.³ According to the legend, the crew of a ship from India,
    and bound to Jeddah, visited Shadhili lived. As an act of hospitality Shadhili
    offered them coffee. The aromatic coffee also helped refresh a merchant from sea
    sickness. Shadhili then encouraged the visitors to dispose of their cargo for
    sale and prophesied that a commercial town would emerge where the cargo was offloaded
    and then these merchants would visit Mocha once and again to trade. The Arabs,
    who had gathered at the shore to listen to Shadhili, bought the entire Indian
    cargo and the ship''s company returned, well pleased, to their homeland and spread
    abroad news of Sheikh Shadhili.⁴ The existence of the Shadhili gate in the architectural
    setting of Mocha is regarded as corroboration of this legend.⁵


