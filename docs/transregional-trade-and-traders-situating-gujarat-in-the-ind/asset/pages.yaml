    Most of the Indians and Arabs in Zanzibar migrated through ordinary processes
    of history and while they may retain memories, certain cultural traits, even language,
    their evolution as communities did not stop at the point of emigration, but continued
    through several generations after their settlement in East Africa through inter-cultural
    relations with other people to create new cosmopolitan societies all around the
    rim of the Indian Ocean. They interacted with local people not only in the market
    place, but also as neighbours, learning their languages and even adopting and
