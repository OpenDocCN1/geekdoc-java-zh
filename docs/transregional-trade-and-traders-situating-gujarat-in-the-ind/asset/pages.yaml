  md: 'Early Historic Gujarat and the Trading World of the Western Indian Ocean 101


    Maritime activity by its very nature was mobile, cut across political frontiers,
    and as a result created its own networks of communication and information transfer.
    It has suggested elsewhere that in the early historic period, one significant
    use of writing was for establishing.³ The shared culture extended across not only
    South Asia, but also the Indian Ocean was part of a literate tradition that included
    Buddhist and Jain monks, navigators, and trading and crafts groups. A significant
    feature of this maritime landscape was the religious shrine and it is the role
    of the shrine that has the focus of discussion here.


    This chapter is in three sections: the first highlights internal routes across
    Gujarat that linked the coasts to interior towns and villages and will place Gujarat
    within the early historic sailing world of the western Indian Ocean to the Red
    Sea. The second section underscores the wider linkages of Gujarat with the Gandhara
    and Greater Gandhara region as evident from the routes mentioned in texts, as
    the first century Periplus Maris Erythrae written in coined Greek, which mentions
    remnants of Alexander''s campaign being preserved in Gujarat, while the final
    section addresses the theme of cultural integration through the institution of
    the religious shrine or Hindu temple, especially with reference to those located
    on or near the west coast of India. The larger issue is to shift focus from the
    Roman Empire and luxury trade to providing a context for the local and regional
    networks of Gujarat, both overland with north-west India and across the seas with
    the Persian Gulf, as also to highlight the cultural factors that motivated travel
    and seafaring activity in western India.


    # The Early Historic Maritime Networks of Gujarat


    The Periplus Maris Erythrae provides the first detailed description of local boats
    in the Indian Ocean in the early centuries CE and several types extending from
    the East African coast to the west coast of India are noted. For example, sewn
    boats and dugouts used for fishing are mentioned along the East African coast
    (section 15);


