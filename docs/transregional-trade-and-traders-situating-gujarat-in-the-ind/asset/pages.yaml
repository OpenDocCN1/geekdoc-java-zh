    Bullion, especially gold, was essential for trade with Indian merchants.¹14 At
    the same time, European mercantilist philosophies measured wealth in gold and
    silver. In the late fifteenth and early sixteenth centuries, neither the Dutch
    nor the English had access to the gold and silver mines that would later become
    significant. Moreover, there was only limited demand for English broadcloth and
    Dutch lately in Asia. This created an unfavourable balance of trade that Company
    merchants sought to address through various kinds of so-called trade, that is,
    the transport and sale of extra-European products. Ivory was perhaps the most
    significant of these products employed as a counterance to the dependency on bullion
    necessary to trade in India.¹15 Unlike other products like spices and textiles,
    moisture was conducive to the preservation of ivory and it travelled at sea. Ivory
    also offered high value for relatively little cargo space. Moreover, ivory for
    textiles was part of the Portuguese trading model and thus, when the Dutch and
    English Companies sought to horn in on this trade they imitated Portuguese trade
    patterns, even if they had different ivory sources and textile outlets.


    An understanding of the need for ivory to trade in India is apparent in Company
    trade from early on. For example, the cargo of the unsuccessful Sixth Voyage (1610)
    headed by Sir Henry Middleton (d. 1613) consisted of ‘elephant’s teeth with lead,
    tin, quicksilver, vermilion, sword blades, red lead, cloth, keyboards, and red
    caps.¹16 Although Middleton failed, the English East India Company (EIC) successfully
    established a presence at Surat in 1612 through the efforts of Thomas Best (1567–1639).
    Surat was really the first foothold that the English Company made in India and
    in the seventeenth century was central to English trading in Asia.


