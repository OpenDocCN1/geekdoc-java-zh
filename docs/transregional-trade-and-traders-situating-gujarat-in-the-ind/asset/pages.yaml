  md: '# Archaeology of Early Historic Gujarat


    The characteristic ceramic of Gujarat was the Red Polished Ware (RPW) dated between
    50 BCE and 300 CE, which marks technological refinement over earlier pottery and
    represents a major change in the economic life of the region. RPW sherds have
    been found at almost 400 coastal and inland sites and represent a wide variety
    of rim shapes with 160 stylistic variations in jars alone.¹12 The map of RPW shows
    least four coastal clusters at the sites of Porbander, Somnath, Una, and Talaja.¹13
    Thus, it is evident that these coastal centres by no means existed in isolation,
    but on the contrary maintained a symbiotic relationship with agricultur based
    at inland centres. The products of farms and forests provided cargoes for the
    sailing ships and sustained trade with other centres among the coasts. RPW was
    produced by local potters to meet the requirements of their neighbours, the farmers
    and merchants, and was produced in a variety of shapes. The fine-lipped ceramic
    indicates expanding trade networks associated with expanding agricultural activities
    and settlements, as also sea-going trade.


    Archaeological exploration in Gujarat has provided for twenty-two early historic
    sites located in a linear pattern along the Shetruni river and a multi-tier settlement
    hierarchy. The site of Hathab was the largest site, located close to the sea with
    an area of over 40 hectares, while eleven measured 3–12 hectares. It is significant
    that thirteen sites were located in the black soil zone, six were situated close
    to the coast. The site of Patri, situated 3–4 kilometres inland, was known for
    extraction of salt.¹14 Archaeological excavations conducted at Hathab in 2001–2
    indicate continuous settlement at the site from fourth century BCE to sixth century
    CE.


    Amreli is another important archaeological site located upstream of the survey
    area on the Thebi, a tributary of the Shetruni, and excavations conducted here
    have yielded continuous occupation of the site from the first century BCE to the
    eighth century CE.¹15 Several objects


