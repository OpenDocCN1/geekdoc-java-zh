  md: '# Merchants and Marts 347


    What were the terrestrial routes that were used? Jean Deloches works25 on mapping
    the routes of southern India, and his studies of, among other things, Roman trade
    routes, or on transport systems prior to steam navigation,26 are of tremendous
    importance in trying to understand the networks of routes that existed across
    the southern part of the peninsula. When we get into the medieval period, there
    is, of course, much more information that is available on the aspect of terrestrial
    routes, particularly from the travel accounts, rather than those that exist for
    interpersonal networks. These have unfortunately not been studied in great detail
    for the inter-regional trade of India, though we do have studies of Armenian merchants,
    in particular, for the larger Asian trade networks.27 However, there is information
    available on the routes that were used, even if not details about the specific
    merchants who used. Broadly speaking, these routes can be separated according
    to the direction that they took inland. I must again point out here that I will
    be discussing routes with reference to Surat in particular, this does not mean
    that all routes began or terminated at that part. Rather, Surat was one of the
    chief marts of the western part of India, thanks in the main to its immense hinterland;
    but obviously, all ports could tap into their specific hinterlands.


    The first route was connected to the north, into the province of Gujarat. This
    had long been known as an area of rich resources and production, particularly
    of agates, carnelian beads and cotton cloth, much of the trade of which was centred
