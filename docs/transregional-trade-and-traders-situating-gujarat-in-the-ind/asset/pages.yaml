    within and across cities, and therefore help to obtain a better understanding
    of the kinds of mercantile networks that operated within the country.


    The other aspect that I propose to focus on is that of routes. I should perhaps
    emphasise that discussion of routes raises the possibility of identifying two
    kinds of networks—the physical ones, used by merchants, pilgrims, soldiers, and
    other, the less tangible ones of personal connections. Such personal connections
    clearly existed, and were indelibly part of the business practices of the time,
    as can be seen, for instance, in the quotation given above, where the English
    factor was to call on the services of Virji Vora’s agent. How far across India
    these personal networks existed is a question that still needs to be asked, is
    the question of how effective these routes were, in maintaining the internal economy
    of the country at a high level.


    One possible answer to the extent and durability of these networks can be provided
    through the existence of the bills of exchange. Irfan Habib24 has discussed the
    rates of exchange on Surat and Burhanpur in considerable detail and the English
    record makes references to the hundis and varats. Yet another dimension of these
    linkages is one that appears in the eighteenth century in particular, when in
    Bengal the House of Jagat She became very important in the newly emerging Bengal
    Sultanate. The bankers of this house had originally moved to Bengal from Gujarat,
    via Agra, Delhi, and later Benares. Here we have clear indication of both mobility
