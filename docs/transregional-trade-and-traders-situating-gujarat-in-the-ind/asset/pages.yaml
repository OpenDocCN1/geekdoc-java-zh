  md: '270 Calvin H. Allen, Jr.


    The Western Indian Ocean regional commercial network, encompassing Western India,
    the Arabian Peninsula, and East Africa, has been linked to the wider Eastern Hemisphere
    commercial network indirectly for hundreds of years via the Silk Road, Arabian
    and African caravan routes, and the Indian Ocean monsoon system. After 1500 these
    links became more direct with the entry of European merchants into the Indian
    Ocean and also expanded into the Western Hemisphere to become a global system.


    # Ratansi Purushottam


    The Purecha family is part of the great Gujarati commercial class found throughout
    the Arabian Sea basin that included Hindu Bhatias and Lohanas and Muslim Khojas,
    Bohras, Memons, and Sonoras. The Purechas are Batias who claim origins in Porbander,
    but the family eventually settled in Mandvi, Kuth. Natha Makund Purecha began
    trading in Muscat in the eighteenth century and eventually established a commercial
    house there, and after 1838¹ Natha’s sons, grandsons, and great grandsons all
    followed him to Muscat, and his great grandson Ratansi Purushottam settled at
    the port in 1857 as a boy of fourteen or fifteen in order to obtain business experience
    at the Natha Makund Company, then managed by his uncle. Ratansi worked as a clerk
    for ten years until 1867 when he established his eponymous company, Ratansi Purushottam,
    probably with capital borrowed from the Imamate of Azzan by Qais Al Bu Sa’id (1868–71)
    by the Banyan population of Muscat declined. In 1871 Ratansi acquired two business
    houses, and by the 1880s Ratansi Purushottam was one of the major commercial houses
    in Muscat².


    Ratansi began his career serving as a broker visiting merchants in selling imported
    cargoes and purchasing items for export


