    The area around Junagarh provides a fertile stretch and as we will

    discuss later, it formed a core region in the early period. This area was

    also the location for royal inscriptions and religious shrines. Other

    find-spots of amphorae shards include coastal centers as Dwarka,

    Somnathpattana, Nagara, and Valabhi, among others. Sites such as

    Valabhi developed into political centres by the middle of the first mil-

    ennium CE. In contrast, others like Somnathpattana and Dwarka

    were sacred pilgrim centres of great sanctity. At Somnathpattana, the

    beginnings of historical settlement date back to the fourth century BCE,

