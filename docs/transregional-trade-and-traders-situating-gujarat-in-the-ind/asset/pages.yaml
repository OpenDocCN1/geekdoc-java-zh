    NISHAT MANZAR


    # ## Textile Industry in the Seventeenth Century


    It is evident from the contemporary sources that the volume of trade between India
    and European countries multiplied in the seventeenth century with the energetic
    participation of the Dutch and the English East India Companies. They were all
    quite organized in their schedule of shipping, negotiating the prices of commodities
    for the purpose of both selling and purchasing, ordering for goods, or engaging
    the artisans and brokers. Maintaining good relations with the authorities also
    required a lot of calculation. Initially, like their predecessors (the Portuguese),
    they invested primarily in spices. Gradually however, they realized that investment
    in textiles would be of great benefit for their respective companies.


    In view of tremendous competition with their fellow Europeans and with Asian merchants,
    engaging weavers was a tedious task and brokers were generally employed to look
    after their clients'' interests. As weavers were to be provided with a muster
    to prepare pieces according to certain specifications, pieces were often collected
    after proper finish and it required the services of


