  md: '# 12 Gujarati Merchant Diaspora in South East Asia (Sixteenth and Seventeenth
    Centuries)


    RUBY MALONI


    Gujarati commerce has always operated within a wide geographical framework. The
    dynamics of this trade reached an unprecedented level of sophistication, with
    efforts at every level to optimize commercial profits, in the early modern era.
    Gujarat was concentric to the Indian Ocean world. Complex grids of long-distance
    Asian trade stretching across the seas had existed before the coming of Europeans.
    The sixteenth and seventeenth centuries witnessed the fine tuning of long-distance
    trading systems. In the different regions of South East Asia, the Indo-Portuguese
    network of trade flourished in the sixteenth century, to be followed by the English
    and the Dutch in the seventeenth. A form of equilibrium to be established between
    European and Asian traders, both quite indispensable to the other. On the highways
    of the spice trade connecting Gujarat with a range of South East Asian port cities
    and maritime states, Gujarati merchants sailed, both in collaboration and competition.
    The Gujarati merchant diaspora in this region played a significant role in the
    formation of intricate patterns of trade practices, traditions, and routes operating
    in the Indian Ocean.


    Ruby Maloni, Gujarati Merchant Diaspora in South East Asia (Sixteenth and Seventeenth
    Centuries). In Transregional Trade and Traders: Situating Gujarat in the Indian
    Ocean from Early Times to 1900. Edited by Edward A. Alpers and Chhaya Goswami,
    Oxford University Press (2019). Oxford University Press.

    DOI: 10.1093/oso/9780199406084.003.013'
