  md: '# Early Historic Gujarat and the Trading World of the Western Indian Ocean
    103


    The Kharavas have traditionally been the premier sailing community with a long
    history of navigational skills and expertise at sea. Twelve villages in Kachchhh
    and Saurashtra are designated to them, starting from Koteshwar in Kachchhh to
    Mandvi, Bey Island, Porbandar, Veraval, and so on. However, ship-building is by
    no means restricted to these twelve villages and is undertaken in small villages
    all along the coastline⁵


    Archaeological investigation in western India has provided information on several
    long-lasting coastal settlements. For example, the site of Mandvi on the estuary
    of the Rukmavati River at the entrance to the Gulf of Kachchh has been known as
    a port town with links to Oman and the East African coast archaeological exploration
    conducted in the nineteenth century. In addition to a range of ceramics, important
    finds include local and regional coins, as well a Byzantium Solid of Heraclius
    dated to 638 CE and an Arab Umayyad din of 716 CE⁶


    Writing in 1836, Alexander Burns described maritime activities at Mandvi as follows:


    The principal seaport of Kutch is Mandavee, which stands in lat 22° 51''N and
    long. 69° 34''E close to the Gulf. It has no fewer than 250 villages belonging
    to it, and boasts a population of 50,000 souls, which is about one-eighth of the
    whole province of Kutch. It is an open roadway with a creek. From Mandavee a maritime
    communication is kept up with Zanguebar and the whole coast of Africa, with the
    Red Sea and Arabia with the Persian Gulf, Mekrom and Sinde and with India as far
    as Ceylon. The vessels used in this extensive measure vary from 100 to 800 carriers
    or from 25 to 200 tons. They carry a large lateen sail, have two masts and are
    never deck⁷


