    # Gujarat, a Preeminent Power in the Indian Ocean during the Fifteenth Century
    (Beginning of the Fourth Cycle of the World-System)


    The late fourteenth century saw a revival in the world-system, attested to the
    reconstruction of China under the Ming emperor Hongwu and the Timurid expansion.
    This new growth was also spurred by the rising Ottoman Empire, by the big states
    emerging in India following the collapse of the Delhi Sultanate, by active Indian
    Ocean city-states such as Malacca, Calicut, and Hormuz, and by a fast-developing
    Europe.


    In 1391, Gujarat became an independent sultanate. Taking advantage of internal
    disorder within the Delhi Sultanate, the Turki-Mongol chief Timur Lang (1398–9)
    invaded northern India and seized Delhi. A new dynasty took power at Delhi, the
    Sayyid (1414–51), that pledged its allegiance to Timur. An Afghan dynasty, the
    Lodi, succeeded the Sayyid, and established its domination over northern India.


