  md: 'Another gendered object, widely used but even studied than bangles, is combs.
    Combs were a widespread and ancient use for ivory, including in Assyria, Phoenicia,
    ancient China, and the Indus Valley. Ivory was desirable as a comb material because
    it is tough enough to allow reasonably durable fine teeth and looks very attractive
    against dark hair. Although less representative of Surat than the Punjab, Sikh
    used ivory combs. Woman of high caste in that also always wore ivory combs.69
    More significantly perhaps, combs ivory were widely worn by upper-class married
    Hindu women.70 According to Company official and art critic Birdwood (1832–1917),‘carved
    ivory combs [were] found in every Indian bazaar’ and ‘most artistic in form and
    detail’.71 Requiring more skill to produce bangles, combs were another ivory object
    with associations to Surat.

    George Kunz claimed that,‘Were not for the constant and extensive demand for the
    ever-popular “Bangles” and also for combs, would not have used of use for the
    ivory she retains....72 The many beautiful objects found in museums believe this
    exaggeration and other things were produced in Surat as well. These included inlaid
    boxes (from the eighteenth century), dice, spinning tops, bells, chessboards,
    reliefs of ivory, and carved vegetables.73 Objects such as these are generally
    more in the realm of the mundane than of fine works of art, but they tell of the
    character of Gujarati craft and the ties of Surat to distant regions.


