    In late December 1788, the Gujarati merchant Kunwarji Narsinh and his partners
    were displeased with the returns on their trade to Muscat. Writing to the Portuguese
    governor of Diu—the small island off the coast of the Kathawar peninsula that
    was part of the administrative edifice of the Estado da India and from which they
    conducted their business throughout the western Indian Ocean—the merchants expressed
    dismay at the more than 40 per cent loss their shipments had suffered when their
    vessel had a stopover at Muscat enroute to Mozambique island, located at the southern
    end of the Swahili coast. If the Oman port had provided Vaniyā merchants from
    Diu as well as Daman—the latter part of Portuguese imperial structure—with commercial
    opportunities for their mercantile and shipping networks, by the 1780s they were
    struggling to find profitable ventures there. The diminishing importance of Muscat
    for these Vaniyā merchants and vessels reflected a broader reorientation away
    from the southern Arabian peninsula and Red Sea over that of the eighteenth century
    and towards Africa.¹ This had been caused by a


