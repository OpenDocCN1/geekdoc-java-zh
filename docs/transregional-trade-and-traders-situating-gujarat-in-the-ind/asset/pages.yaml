    Trading relations between north-western India and the Persian Gulf embedded the
    transregional interactions, which formed distinct pockets within the larger Indian
    Ocean. Traders from these regions were successful in creating their own key positions
    in the trading world of the Indian Ocean. Their oceanic trading helped them to
    orient their landward interface with the rest of the population and the source
    of their export merchandise. Along enriching the regions with the commodities
    and creating a vibrant consumer culture, the traders were harbingers of cross-cultural
    ethics. While the seashore communities had much to learn from the outside world
    they were also connected to their landward communities which created an interesting
    blending of the seaboard and landward ethos and cultures. Samira Sheikh investigates
    this feature of the Gujarati past Di of Bharuch, Lallubhai. Lallubhai Diwan''s
    career within overlapping circles of influence, some deeply local, others radiating
    into the trade networks of the Arabian Sea. By probing the personal history of
    an individual who remained resolutely local in his activities, she argues for
    the critical intersection of maritime and agricultural history, two aspects of
    the Indian past that are usually treated as entirely distinct analytical domains.


