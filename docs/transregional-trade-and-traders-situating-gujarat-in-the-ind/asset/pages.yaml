    As a merchant, in 1890 Indians proposed to set up a school for their children
    and were encouraged by the British Consul after whom the Euan-Smith Madressa was
    named. Nevertheless, because of the religious devotion of the Indians, they could
    not agree on a single syllabus for religious instruction, and the ESM therefore
    remained as a non-denominational Indian school. The medium of instruction was
    Gujarati in the lower primary level but increasingly English at the higher levels.\31
    Although the Ismaili and Bohora Shia communities insisted on setting up their
    own primary and secondary schools to ensure adherence to their own religious tenets,
    the centrally organized Ithnaasheri community was able to establish classes for
    the first three years of primary education before we joined the ESM. This exposed
    me to the other Indian communities in Zanzibar from a very young age, though not
    to the Arab and Swahili children for whom the British had established a separate
    government school.


    The government had also created a single secondary school for all races which
    was highly competitive, and only a small number of the children from the primary
    schools were able to get a place at the Government Boys Secondary School and a
    separate school for girls. It was my good fortune to get admission to this non-racial
    school where my classmates were Arabs, Shirazis (indigenous inhabitants of Zanzibar
    claiming ancient Persian origin), and Swahilis as well as Indians. My desk-mate
    was a Shirazi and my closest life-long friend was an Arab. The language of instruction
    was primarily English, while Arabic, Swahili, or Gujarati was required as a second
    language. Thus, in addition to the indigenization that Christie had described
    in the 1870s, my own experience by the 1950s was multi-racial, and our common
    spoken language was Swahili.


