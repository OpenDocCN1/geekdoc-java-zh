    Her most recent publication is an edited book, Narratives, Routes and Intersections
    in the Pre-modern Asian World, 2016 (Email: seshan.radhika@gmail.com).


    Samira Sheikh is an associate professor of history at Vanderbilt University, USA.
    Educated at Maharaja Sayajirao University of Baroda; Jawahar Nehru University,
    New Delhi; and the University of Oxford, she studies the history of Gujarat roughly
    from 1400 to 1800. She is the author of Forging a Region: Sultans, Traders and
    Pilgrims in Gujarat, 1200–1500, and co-editor of two collections of essays. She
    is currently working on a study of a Gujarati businessman-politician of the eighteenth
    century (Email: samira.sheikh@vanderbilt.edu).


    Abdul Sheriff studied at UCLA (BA, MA, 1961–6) and SOAS, London (PhD, 1966–71).
    He taught history at the University of Dar Salaam (1969–92). In 1993, he was appointed
    advisor and principal curator of the Zanzibar Museums, and helped establish the
    Palace and House of Wonders museums. From 2007, he was executive director of the
    Zanzibar Indian Ocean Research Institute until 2012 when he retired.


    He has been a research director of the Indian Ocean Center, McGill University,
    Canada; held a Post-Doctoral Fellowship at the University of Wisconsin, Madison,
    Wisconsin (1974/5); Wissenschaftskolleg zu Berlin, Germany (2002/3); Centre of
    the Modern Orient, Berlin, Germany (1994, 1999–2000); Technical University of
    Lisbon, Portugal (1998); and University of Bergen, Norway (1996–8).


    Professor Sheriff has published a number of academically acclaimed books, including
    Slaves, Spices & Ivory in Zanzibar, 1987; Zanzibar Stone Town: An Architectural
    Exploration, 1998; The Dhow Cultures of the Indian Ocean, 2010; and has edited,
    The History & Conservation of Zanzibar Stone Town, 1995 (Email: asheriff@zitec.org).'
