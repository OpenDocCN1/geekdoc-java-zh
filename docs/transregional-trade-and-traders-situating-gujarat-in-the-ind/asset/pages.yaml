    in India. From being a ceremonial drink of Sufi mystics, in the course of a century,
    coffee became part of the social and architectural fabric of the Islamic countries.¹²
    Coffee was a symbol of hospitality and social too. Coffee drinking also reflected
    social stratification. Mandana Limbert¹³ argues that only the most powerful coffee
