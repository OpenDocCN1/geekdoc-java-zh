  md: '# Edward A. Alpers Chhaya Goswami


    themes. At the conference, papers were grouped together in manageable chronological
    or thematic headings: ‘Situating Gujarat in the Indian Ocean in the early times’,
    ‘Gujarat Trading Networks in the Arabian Sea,’ ‘Gujarat Traders in the Eastern
    Seas,’ ‘Gujarat in Maritime History,’ ‘Trading World of Gujarat Traders in the
    Western Indian Ocean,’ ‘Indian Ocean Commodities and Local Markets: Circulation
    and Consumption,’ and ‘Inter-regional Trading Network of Gujarat and Foreign Traders’.
    What worked for time-restricted conference sessions does not work, however, for
    a published volume. In order to achieve greater coherence for our book and to
    encourage greater intellectual cross-fertilization on papers, we have organized
    the chapters into three broad sections: Historiography, Method Sources; Commodities;
    and Trading Networks and Diaspora.


    # Historiography, Method, Sources


    To be sure, the three keywords for this section inform every contribution to the
    volume, as they do for the work of all historians. Nevertheless, these chapters
    throw a sharper light on these broad topics, each in its own way. The first chapter
    is an expanded version of Edward Alpers’ specifically historiographical keynote
    address to the conference. In surveying the past four decades of historical scholarship
    (primarily in English), including the contribution of archaeologists on Gujarat
    and the Indian Ocean before 1900, Al identifies several lively controversies and
    sustained debates that have emerged over these years. He also recommends greater
    multidisciplinary collaboration in reconstructing this aspect of Gujarat’s past.
    As Alpers notes, the last four decades have witnessed a significant production
    of first-rate scholarship on Gujarat’s Indian Ocean trade and its merchants, both
    indigenous and foreign. Spanning two intellectual generations of scholars, the
    most recent work has raised a host of new perspectives and challenging questions
    for future research on that past. From a different perspective, India’s recent
    turn to the sea by building up its national navy and seeking to assert its presence
    as an Indian Ocean maritime power also raises a number of important policy issues
    for the present and future. Thus, although the contributions to this book are
    strictly historical and focus on the ancient, medieval, and early modern periods,
    2015 was for both reasons—scholarly and political—an'
