  md: '# 370 Abdul Sheriff


    a minority again''; but he ended up part of a Zanzibari minority in Pakistan.


    Another refugee there was Sir Tayabali Karimjee, whose ancestors moved to Zanzibar
    early in the nineteenth century. On the eve of Zanzibar''s independence in 1958,
    he built a palatial home there as an expression of his continued commitment to
    his homeland, as well as the charitable Karimee Hospital and the Sports Club which
    were for the general public. During the Revolution his home was nationalized and
    vandalized, and is now the State House where the President of Zanzibar lives.
    The hospital was renamed V. I. Lenin Hospital, and then again re-designated Mnazi
    Mmoja Hospital. Broken hearted, he went to Karachi where he just said before his
    death in 1987: ''I don''t belong here; I am waiting for the bus to Zanzibar.


    One of my maternal uncles was a successful lawyer in Zanzibar who was forced by
    the Revolution to shift to Dar Salaam and later to Belize before ultimately settling
    comfortably in Australia. Yet, when he came to Zanzibar after many years, he first
    knelt to kiss the ground, and then told me—regardless of sectarian differences—he
    had vowed to say prayers in every mosque in Zanzibar town, of which there were
    more than fifty. Until today, when he talks about Zanzibar, one can almost see
    his heart bleeding.


    For many Zanzibaris, the traumatic memory that attaches them to their homeland
    is not Mother India or Arabia. Rather, it is the much more recent experience of
    the Zanzibar Revolution in the generation that experienced it (and I assume the
    intense attention to Zanzibar in the mass expulsion of Asians from Uganda by Idi
    Amin affected that community as portrayed in the film Mississippi Masala). If
    anything, they are part of a Zanzibari diaspora. There is a question of how long
    diasporic memory will last—a generation or two, I would suspect, judging from
    the feelings of our children and grandchildren born after the trauma, and living
    in more comfortable circumstances elsewhere and being assimilated in their turn
    in Oman or the West, unless it is cultivated deliberately to perpetuate a claim
    over many generations.


