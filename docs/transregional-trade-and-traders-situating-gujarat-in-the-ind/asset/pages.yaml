    Kachchhh-based sources, however, never mention silk weaving in the context of
    the African export trade. Indeed, Surat was the most likely origin: Burton¹¹¹⁹
    described the *deuli* as ‘a Surat silk’, and Guillain¹¹²⁰, too, named Surat and
