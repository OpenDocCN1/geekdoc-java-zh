    ## 6.1 关于颜色


    在物理世界中，颜色是由电磁波表示的光，而光的颜色由光的波长决定。人眼利用特殊的细胞来捕捉这些波长并将这些印象转换到大脑中——实际上，是通过捕获红、绿、蓝三种颜色的强度来实现的，这与计算机处理
    RGB 颜色的方式相似。然而，我们的眼睛远比计算机优越。屏幕必须将三种颜色值转换为特定的颜色，这是通过使用特殊功能实现的，但这些功能无法形成所有的颜色，因此计算机屏幕或打印机上的颜色始终是真实颜色的近似值。


    色彩空间（Color room）是在特定设备上显示的颜色族。例如，屏幕有一族它可以显示的颜色。这些颜色由红、绿、蓝三种颜色的强度组成，在实践中，每种颜色有
    256 个值。由于红、绿、蓝光的变化以及制造商电子元件的差异，两个不同的屏幕并没有相同的色彩空间。尽管两个屏幕使用 RGB 形式的相同颜色编码，但颜色仍然会变化，且每个屏幕都有自己的色彩空间。某些打印机使用不同的颜色编码，结合了青色、品洋色、黄色和黑色，这使得情况变得更加复杂。这种编码被称为
    CMYK，这样的打印机拥有的是 CMYK 色彩空间。因此，RGB 颜色必须转换为 CMYK 颜色才能在打印机上显示，换句话说，应该将当前显示的色彩空间转换为另一个设备的色彩空间。总而言之，不同的色彩空间显示颜色的方式不同。


    为了解决这些问题，工业界致力于定义绝对色彩空间，以精确定义什么是红色、什么是绿色、什么是蓝色。其中一种被称为 `sRGB`（标准 RGB），它是 Java
    2D 默认使用的，它将颜色转换为这种色彩空间。


    这有助于解决颜色问题，但它无法补偿硬件和所用色彩配置（color profiles）之间的差异。它是一个将颜色从 `sRGB` 等标准色彩空间转换为特定物理设备色彩空间的表格。因此，每个物理设备都有自己的色彩配置。例如，这适用于屏幕，为了让颜色看起来正确，你可以校准屏幕，这意味着调整色彩配置，使得从特定颜色空间到配置的转换是正确的。这并不容易，需要实践和知识，但从事打印工作的人花了大量精力正确校准他们的设备。


    对于许多应用程序（大多数），与色彩空间和色彩配置相关都是无趣的。如果一个程序必须绘制一个图形，那么该图形在另一个屏幕上显示的颜色略有不同并不重要，但如果你必须显示照片，这就非常重要。在这里，颜色应该是正确的，如果你在为成像编写软件，那么上述内容就是重要的。尽管我不想进一步探讨该主题，但
    Java 2D 类型同时适用于色彩空间和色彩配置，这些类型拥有用于处理颜色细节的方法。


    为了结束关于颜色的这一节，我将展示一个用渐变画填充椭圆的程序，但与我之前展示的不同，它必须是一个从椭圆中心到边缘混合两种颜色的渐变画。该程序打开一个如下所示的窗口：


