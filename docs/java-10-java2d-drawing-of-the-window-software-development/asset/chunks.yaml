    ## 5.3 Glyphs


    In the previous section I have suggested the possibilities of a *TextLayout*,
    and although it is rare that you need the class’s possibilities, there are examples,
    for example if you want to develop your own components. It is relatively complex
    to use a *TextLayout*, but you can actually go even further down and directly
    manipulate the individual glyps. Rarely – if ever – you will need it, but the
    following program should show that it is possible. The program opens the window
    shown on the next page. If you have a string, then the class *Font* has a method
    that returns a so-called *GlyphVector*, which is a collection consisting of the
    *Glyph* objects defined by that string. These objects, each of which are a *Shape*
    object, can then be manipulated in the same way as any other shape.


