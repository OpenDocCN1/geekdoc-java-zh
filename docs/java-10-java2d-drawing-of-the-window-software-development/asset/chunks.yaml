  trans: "\n窗口显示了一个矩形（其大小随窗口变化），由一个 `GradientPaint` 填充，该填充沿左上角的对角线方向混合了白色和黑色。窗口顶部和底部分别有三个\
    \ `JSlider` 组件。它们分别被用于定义“白色”和“黑色”颜色。当你移动滑块时，结果可能如下所示。注意，当代表矩形的组件必须引用这六个 `JSlider`\
    \ 组件时，你可以通过在 `MainWindow` 中将 `Drawing` 类定义为内部类来简化工作。\n\n![](img/Image13780.jpg)\n\
    \n## 3.2 `TexturePaint` \n\n也可以用图像来填充图形。以下程序绘制了一个矩形并填充了整个窗口，矩形由一个 64x64 像素的图标重复填充组成：\n\
    \n![](img/Image13787.jpg)\n\n该项目有一个名为 `images` 的子包，其中包含了该图标（这是一个复制到此处的 png 文件，因此图片是资源，并与程序的类一起打包的）。窗口的代码如下：\n\
    \n![](img/Java_10_-_Java2D_6-11-17_50.jpg)![](img/Java_10_-_Java2D_6-11-17_51.jpg)![](img/Java_10_-_Java2D_6-11-17_52.jpg)![](img/Java_10_-_Java2D_6-11-17_53.jpg)![](img/Image13795.jpg)\n\
    \n方法 `createImage()` 创建了一个 20×20 像素的 `BufferedImage`，其中绘制了一个红圆。你可以在不从文件中加载图像的情况下创建并操作\
    \ `BufferedImage`。`BufferedImage` 在 `paintComponent()` 中创建以创建一个 `TexturePaint`，然后使用\
    \ 60 像素的描边画一个圆。\n\n除了展示如何从零开始创建 `BufferedImage` 之外，示例还展示了图形的边界本身就是一个 `Shape`，可以通过\
    \ `draw()` 方法使用 `Paint` 对象进行填充。\n\n## 3.3 Strokes（描边）\n\n在上面的示例中，我展示了如何定义一个 `BasicStroke`\
    \ 对象，从而指示了线条需要画有多厚。默认值为 1。然而，关于描边，有两点你必须了解：\n\n* 线条的端点应该是什么样的\n* 线段是如何组合在一起的，因此转角处应该是什么样的\n\
    \n这些概念仅在你需要画粗线时才有意义。最后，必须知道如何画虚线。下面的窗口显示了大部分可用选项：\n\n![](img/Image13802.jpg)\n\
    \n关于线条的端点有三种可能性：\n\n1. `BasicStroke.CAP_SQUARE`（默认值）\n2. `BasicStroke.CAP_ROUND`\n\
    3. `BasicStroke.CAP_BUTT`\n\n第一条线（黑色）使用默认值绘制，否则使用宽度为 19 的描边。此外，还绘制了一个作为该线条外接矩形的框。关于端点，样式为\
    \ `CAP_SQUARE`，它通过一个长度为线宽一半的矩形来扩展线条。蓝线对应的端点是 `CAP_ROUND`，它通过一个半径为线宽一半的半圆来扩展线条。最后，绿色线使用了\
    \ `CAP_BUTT`，它简单不扩展线条。\n\n右侧的三个图形类型均为 `GeneralPath`，并使用宽度为 19 的描边和端点选项 `CAP_SQUARE`\
    \ 进行绘制，同时也定义了转角的绘制方式。同样有三种选项：\n\n1. `JOIN_MITER`（默认值）\n2. `JOIN_ROUND`\n3. `JOIN_BEVEL`\n\
    \n橙色路径使用默认值绘制，因此样式为 `JOIN_MITER`。它通过延伸外边缘直到它们相交来组合线段。洋红色线使用 `JOIN_ROUND`，这简单意味着线段端点使用了\
    \ `CAP_ROUND`。最后，灰色路径使用了 `JOIN_BEVEL`。在这里，线段端点使用 `CAP_BUTT` 且外边缘连接在一起。\n\n然后是三条虚线。红色的线按照如下定义的描边绘制：\n\
    \n![](img/Java_10_-_Java2D_6-11-17_56.jpg)![](img/Java_10_-_Java2D_6-11-17_57.jpg)![](img/Java_10_-_Java2D_6-11-17_58.jpg)\n\
    \n## 练习 9\n\n编写一个程序，打开以下窗口：\n\n![](img/Image13810.jpg)\n\n# 4 渲染\n\n在数一章中，我讨论了如何定义几何形状。在本章中，我将查看\
    \ Java2D 是如何渲染图形的。具体如下：\n\n1. 变换 (transformation)\n2. 合成 (compositing)\n3. 裁剪\
    \ (clipping)\n4. 渲染提示 (rendering hints)\n\n## 4.1 变换\n\n变换由名为 `AffineTransform`\
    \ 的类定义，仿射变换是一种保持平行线的变换。`Graphics2D` 类拥有一个 `AffineTransform` 实例，在渲染时适用于所有几何形状。这种变换可以通过两种方式更改。\n\
    \n![](img/Java_10_-_Java2D_6-11-17_59.jpg)\n\n通常建议使用后一种方法。`Graphics2D` 类还拥有方法：\n\
    \n* `translation`（平移）\n* `rotation`（旋转，绕某点旋转）\n* `scaling`（缩放）\n* `shearing`（倾斜）\n\
    \n#### **平移 (Translation)**\n\n`TranslateDemo` 程序打开了一个如下所示的窗口。窗口绘制了四个矩形，首先画黑色的。组件的代码如下：\n\
    \n![](img/Java_10_-_Java2D_6-11-17_60.jpg)![](img/Java_10_-_Java2D_6-11-17_61.jpg)![](img/Image13819.jpg)\n\
    \n首先定义一个矩形 `rect`，使用默认设置绘制，结果是黑色矩形。接下来为当前变换添加一个引用 `start`。目标是在执行其他变换后，将绘制表面的变换重置为默认值。\n\
    \n![](img/Java_10_-_Java2D_6-11-17_611.jpg)\n\n接下来，更改 `Graphics2D` 对象的 `AffineTransform`。下一步定义当前\
    \ `AffineTransform` 的引用 `trans`，然后进行平移 (100, 50)，这用于修改 `g2d` 对象的变换，并再次绘制矩形，但这次是蓝色的。在这里，由于是复合变换，结果并不显而易见。首先执行平移\
    \ (100, 50)，它将当前的起始点 (100, 50) 移动到 (200, 100)。接着执行第一个变换，也是一次平移 (100, 50)，它将起始点\
    \ (200,100) 移动到 (300, 150)。结果是蓝色矩形的左上角位于 (320,170)。在绘制蓝色矩形后，将变换重置为默认，并使用 `AffineTransform`\
    \ 类中的静态方法定义一个新的平移。结果是绿色矩形。\n\n## 练习 10\n\n编写一个程序，创建如下窗口：\n\n![](img/Image13830.jpg)\n\
    \n其中蓝色和绿色圆必须是黄色圆的变换（平移）。\n\n#### **旋转 (Rotation)**\n\n"
