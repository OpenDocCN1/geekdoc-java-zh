    are called respectively *Rectangle2D.Float* and *Rectangle2D.Double*. The difference
    is about the figure’s attributes and where they are defined by the type *float*
    or type *double*. This pattern is used for all primitive *Shape* objects.


    There is a helper class, called *Point2D* (and *Point2D.Float* and *Point2D.Double*)
    that represents a point. A *Point2D* object has no size and can not be rendered,
    and an object is used only to define attributes for other objects. The basic geometric
    classes are shown in the following figure, and they are all defined by a common
    interface called *Shape*. This interface defines a few important methods where
    I will mention


    *   *getBounds2D()*, which returns a circumscribing rectangle


    *   *contains()*, that tests where a point or rectangle is included in the shape


    *   *intersects()*, that tests where a rectangel overlaps the current shape![](image/Image13623.jpg)


    ## 2.1 Filled shapes


    The last four are simple to use, and the difference is mainly the parameters you
    have to enter to create an object. Generally a figure is defined by a rectangle,
    that is the circumscribing rectangle which indicate the upper left corner and
    the width and height. The program *Figures* opens the following window:


    ![](image/Image13630.jpg)


    As regards the types *Rectangle2D* and *Ellipse2D* there is not much more to tell,
    but for a *RoundRectangle2D* you must beyond the circumscribing rektangle specify
    how the corners are rounded – in fact, in terms of a width and a height of a rectangle.
    Then there is the green shape, which is an *Arc2D*. First you have to define the
    circumscribing rectangle, and here one must be aware that the rectangle is the
    rectangle that circumscribes the ellipse, that the shape is a part of. In addition
    to the rectangle you must specify the angle (in degrees), where the range should
    start and how large an angle the range should span. Finally, you must specify
    how the slice should appear where there are the following options:


    *   *Arc2D.PIE*, that shows the shape in this example


    *   *Arc2D.OPEN*, which only shows the arc


    *   *Arc2D.CHORD*, that shows the arc and the chord of the arc’s end points


    The code for the above window is:


    ![](image/Java_10_-_Java2D_6-11-17_24.jpg)![](image/Java_10_-_Java2D_6-11-17_25.jpg)


    ## Exercise 3


    Make a copy of the above project, which opens the window with the four figures.
    You must change the program so that if you click on a shape, you should get a
    message box as shown below telling you which figure is clicked. Note that the
    only thing you need is to add an event handler for mouse clicks, which determines
    whether there is clicked on a figure and if so, what.


    ![](image/Image13638.jpg)


    ## 2.2 Lines


    I will then look at the three types *Line2D*, *QuadCurve2D* and *CubicCurve2D*,
    each representing a line segment. *Line2D* represents a straight line between
    two points, and there is not much to explain. To create a *Line2D* object, you
    must only indicate the endpoints of the segment.


    A *QuadCurve2D* represents a path between two points, which has an associated
    control point so that the lines from the control point of the curve’s endpoints
    are tangents to the curve:


    ![](image/Image13646.jpg)


    If you need to create a *QuadCurve2D*, one must therefore indicate three points.
    A *CubicCurve2D* is in principle the same, but here there are two control points,
    one for each of the two end points:


    ![](image/Image13653.jpg)


    One must therefore specify four points to create a *CubicCurve2D*. It can be a
    little difficult to find out the result of these curves. The following program
    opens a window, as shown below. The blue curve is a *CubicCurve2D*, while the
    red is a *QuadCurve2D*. In addition to the endpoints, the drawing shows the control
    points, as well as the tangents and the purpose of the program is, that you can
    point on one of the points with the mouse and dragging it, and in that way to
    get an idea of what happens to the shapes, if you change the end points or control
    points.


    The code for the window is shown below, and you must mainly observe how to create
    respectively a *QuadCurve2D* and a *CubicCurve2D*:


    ![](image/Java_10_-_Java2D_6-11-17_27.jpg)![](image/Java_10_-_Java2D_6-11-17_28.jpg)![](image/Java_10_-_Java2D_6-11-17_29.jpg)![](image/Image13663.jpg)


