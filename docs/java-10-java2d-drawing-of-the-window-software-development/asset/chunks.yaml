    实际上，是根据矩形的宽度和高度来指定的。然后是绿色形状，它是一个 `Arc2D`。首先你必须定义外接矩形，这里必须意识到该矩形是包含该形状的椭圆的外接矩形。除了矩形外，你必须指定范围开始的角度（以度为单位）以及范围跨越的角度大小。最后，你必须指定切片显示的形式，有以下选项：


    *   `Arc2D.PIE`，在此示例中显示形状

    *   `Arc2D.OPEN`，只显示弧

    *   `Arc2D.CHORD`，显示弧和弧端点之间的弦


