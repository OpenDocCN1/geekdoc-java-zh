    # Poul Klausen


    # Java 10: Java2D, 窗口绘制


    # 软件开发


    Java 10: Java2D, 窗口绘制：软件开发

    第一版

    © 2018 Poul Klausen & bookboon.com

    ISBN 978-87-403-1947-7

    由 Ove Thomsen, EA Dania 进行同行评审


    # 前言


    本书是软件开发系列书籍中的第十本。编程语言是 Java，虽然语言及其语法和语义显然涵盖了大量内容，但这些书籍也很大程度上关注开发过程以及如何开发良好且健壮的。在上一书中，我相对详细地探讨了
    `Swing`，而本书的主题是 `Java2D`，它是 Java 用于开发具有图形用户界面（GUI）应用程序的另一部分。你也可以将 `Java2D` 视作
    `Swing` 用于在窗口中绘制组件时使用的图形工具。本书内容相对详尽，涉及了一些在日常编程中并不经常使用的问题，但当然，这些示例和问题对于理解 GUI 如何工作非常重要。它与该系列中的其他几本书相似，即重点在于
    Java 语言而非开发过程，只有最后一个示例关注了通过开发 Java 类库进行系统开发。本书假设读者已具备对应 `Java 3` 和 `Java 4` 的
    Java 知识，并在某种程度上具备对应 `Java 2` 的 `Swing` 知识。


    正如标题所示，系列书籍涉及软件开发，目标是教读者如何用 Java 开发应用程序。可以通过阅读相关主题和学习完整的示例程序来学习，但最重要的是亲自动实践并从零编写自己的程序。因此，书中的重要部分是练习和问题，读者需要在其中编写与书中讲解内容相对应的程序。系列中的所有书籍都围绕同一个骨架构建，由文本、示例、练习和问题组成，这些内容被自然地放置在正文中。练习与问题的区别在于：练习主要侧重于文中叙述内容的重复，并且对需要做什么描述得相对准确；相比之下，问题的描述较为松散，通常规模大一些，且很少有明确的最佳解决方案。这些书是要从头到尾读完的，但许多代码示例（包括练习和问题）起着核心作用，读者详细预测并学习许多示例代码至关重要，还要解决练习和问题，或者仅仅学习推荐的解决方案。


    每本书都结束于一两个较大的示例程序，主要关注开发过程以及对程序如何编写的解释。另一方面，代码仅在有限范围内出现——如果有的话——读者应该在可能测试程序时学习已完成的程序代码。除了展示比其他示例更大的程序开发外，结尾示例的目的还在于展示不同应用领域的程序示例。


    大多数书籍还以附录结束，处理书中未涉及的主题。可能是关于软件安装或其他计算机技术的主题，这些主题不属于软件开发，但需要相关的基础知识。如果读者已经熟悉该主题，可以跳过当前附录。


    如提到的，编程语言是 Java，此外书籍还使用了以下产品：


    * `NetBeans` 作为应用程序开发的 IDE

    * `MySQL` 在需要数据库服务器的情况下（从 `Java 6` 书开始）

    * `GlassFish` 作为 Web 服务器和应用程序服务器（从 `Java 11` 书开始）


    这些产品都是免费提供且可免费安装的，甚至提到了某些产品的安装可以自动完成，无需付出费力的努力和挑战。此外，网上提供了针对这三个产品的详细安装说明。这些产品支持
    Windows 和 Linux，因此无论使用 Linux 还是 Windows 并没有特殊区别。


    所有示例程序均在运行 Linux 的机器上开发和测试。事实上，这并没有产生主要影响，因为无论平台是哪一个，Java 和其他产品的工作方式都是完全相同的。书中某些地方可能会看到平台是
    Linux，这主要适用于涉及文件系统的命令。否则，对于读者来说，程序在 Linux 机器上开发并没有意义，它们也可以立即在 Windows 下运行，除非程序引用了文件系统，在此时可能需要更改文件名称。


    最后，简单介绍一下这些书**不是**什么。它们不是关于“如何编写”的教程，或者说不是 Java 的参考手册，而是正如标题所示，是关于软件开发的书籍。我希望读者在阅读书籍并通过大量示例时，能够找到关于如何编写良好程序的灵感，也可以将其作为解决方案集，提供你作为软件开发者经常面对的许多日常编程问题的解决方案示例。


    # 1 引言


    当你编写带有图形用户界面的程序时，编程在很大程度上是基于对窗口、按钮、字体等现类的使用。从开始，这些类就被汇集在 `AWT` 及其子包中，API 可以被视为两层类，称为`用户界面工具包`和`绘图工具包`；第一层由组件及其属性的类组成，而第二层由基本几何工具类组成，可以绘制线条、方形并操作单个像素。后来（从
    `Java 2` 开始），`AWT` 被拆分为两个 API，即 `Swing` 和 `Java2D`。本书涉及 `Java2D`，以及如何在 Java 中编写二维图形和操作图像。


    与其他 API 一样，`Java2D` 包含了大量的类，但总的来说，这些类用于：


    1. 形状（Shapes）：你可以组合直线、曲线、矩形、椭圆和弧来创建任意几何形状。

    2. 描边（Stroking）：定义如何根据宽度、虚线或实线绘制线条。此外，你还可以指定如何绘制角部。

    3. 填充（Filling）：指定如何填充形状。你可以指定颜色、图案或渐变填充，事实上，你也可以使用图像。

    4. 变换（Transformations）：其中所有被绘制的内容（形状、图像、文本）都可以进行拉伸、缩放和旋转。

    5. Alpha 混合（Alpha compositing）：这是将图形与背景结合的过程，以创建部分透明或全透明的图形。

    6. 裁剪（Clipping）：是一种限制形状绘制部分的选项，以免在窗口不需要的区域进行绘制。

    7. 抗锯齿（Anti-aliasing）：是一种避免不平整线条的技术，在这种情况下你可以看到单个像素。

    8. 文本（Text）：你可以像操作几何形状一样操作文本。

    9. 颜色（Color）：由表示颜色的类和方法组成，因此与硬件无关。

    10. 图像（Images）：提供了以操作其他几何形状的方式操作图像的能力。它还包括从文件读取和保存图像类。

    11. 图像处理（Image processing）：包括操作图像中单个像素的类。

    12. 动画（Animation）：是提供服务的类，让你对几何形状、文本和图像制作动画。


