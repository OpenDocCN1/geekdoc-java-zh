    The window below shows three shapes of the type `GeneralPath` where the red is
    formed by three `line` segments, a `quad` segment and a `cubic` segment. The two
    other shapes are solely formed by the `line` segments:


    ![](image/Image13685.jpg)


    Generally, it is simple enough to create a `GeneralPath`, and there is only one
    thing that is complex, namely to determine the interior of shapes. If the shape
    is bounded by a simple closed curve (as the red), there is not much to be in doubt,
    but if the shape is formed by lines that intersects, it is more difficult, and
    it can happen in two ways, which you specify with a parameter to the constructor.
    If you considers the blue figure, it is defined as `GeneralPath.WIND_EVEN_ODD`.
    The straight lines divide the shape into a number of closed regions (five in this
    case). If you have to decide which of these areas belong to the figure, you can
    draw a straight line that cuts through the figures areas:


    ![](image/Image13692.jpg)


    If you starts outside the shape and follows the line and counts a counter up by
    1 each time you pass a segment, so the rule is that an area belongs to the figure,
    if the counter is odd and does not belong, if the counter is even. The green figure
    is defined as `GeneralPath.WIND_NON_ZERO` (which incidentally is the default).
    If you here must determine if a part of the figure belongs, one can similarly
    draw a line that intersects the figure’s areas. When the line crosses one of the
    figure’s segments, the rule is that the counter is incremented by 1 if the segment
    is drawn from left to right, and decremented by 1 if the segment is drawn from
    right to left. The areas that is part of the figure, are the areas in which the
    counter is not 0.


