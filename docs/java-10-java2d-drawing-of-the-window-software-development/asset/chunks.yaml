    ## 5.2 TextLayout


    我将用 `TextLayout` 类结束关于文本的章节，它允许完全控制文本的渲染。在实践中，程序可以使用 `JTextField`、`JTextArea`
    或 `JEditorPane` 显示文本，但如果你有非常特殊的需求，这些组件并不适用，`TextLayout` 提供了额外的灵活性。在下面我将给出四个示例。`TextLayout`
    作为 `drawString()` 的替代方案，你可以将其认为一个对象


    这里使用 `TextLayout` 绘制了第一个文本（黑色文本），而另一个是从黑色文本创建的 `Shape`，由文本的所有字形组成。如果你点击文本的某个地方（例如大字母
    H），你会得到如下所示的消息框，显示了你点击的字符：


    ![](img/Image4685.jpg)


    组件代码如下：


    ```

    image/Java_10_-_Java2D_6-11-17_83.jpg)![](img/Java_10_-_Java2D_6-11-17_84.jpg)

    ```


    该类定义了一个 `TextLayout` 实例变量。它在构造函数封装了字符串 `str`。`TextLayout` 对象的构造函数需要一个 `Font` 和一个
    `FontRenderContext`。你应该注意如何创建 `FontRenderContext`。第一个参数是一个 `AffineTransform`，这里只是恒等变换，而最后一个参数指定了是否使用抗锯以及如何计算尺寸。最后，为构造函数分配一个鼠标点击监听器，我稍后会解释。


    如果你有一个 `TextLayout`，人们可以用以下方式绘制文本：


    ```

    image/Java_10_-_Java2D_6-11-17_85.jpg

    ```


    语法与你其他绘制形状或文本的方式略有不同。绘制图形后，你可以通过 `getOutline()` 方法获得一个由文本字形组成的 `Shape`。该方法拥有一个变换，告诉对象如何进行变换，然后该
    `Shape` 对象就可以像任何其他 `Shape` 对象一样被处理。在这种情况下，该图形被填充为黄色并用红色绘制。

