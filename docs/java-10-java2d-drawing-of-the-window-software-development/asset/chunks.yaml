    of the window shows the mouse coordinates when you drag the points, and the two
    curves must be drawn with a thicker line. This means that you must use a *Stroke*
    object when the curves are drawn, for example


    ![](image/Java_10_-_Java2D_6-11-17_31.jpg)


    To display the mouse coordinates you can add a *JLabel* component to the bottom
    of the window and update it every time you drag one of the points.


    ![](image/Image13670.jpg)


