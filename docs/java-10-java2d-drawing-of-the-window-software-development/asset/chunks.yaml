    在处理 Java 2D 以及通用的计算机图形时，你将有一个坐标系。窗口的左上角为 (0,0)，x 轴向右延伸，而 y 轴向下延伸。这是一个被称为 `user
    space`用户空间）的逻辑坐标系，当要在物理显示器或打印机绘制对象时，你有一个不同的坐标系，被称为 `device space”（设备空间）。因此，渲染需要将坐标从用户空间转换为设备坐标，对于屏幕，这种转换通常是直接的，用户空间中的
    1 个单位对应一个像素，但通常目标是将 72 个单位（用户空间中）转换为 1 英寸。


