  trans: '


    首先，从《Java 9》书中创建一个 `SlotMachine` 项目的副本。花些时间测试该程序，以确保你记得程序是如何运行的。


    任务是修改该程序：


    1.  在现有版本中，没有轮盘的动画，但动画是通过在选择下一个图形之前短暂地显示单个图形来模拟的。你现在需要修改程序，改为像第 9 章那样通过相同的方式动画来模拟滚轮的旋转。


    2.  该程序对机器管理员的管理方式并不理想，你可以通过点击工具栏上的图标来切换到管理员模式。应该对其进行更改，使得特定的用户（玩家）拥有管理员权限。如果该用户已登录，管理员工具的图标会自动显示，否则不显示。任务的一部分是确保始终有一个管理员，并且该管理员不能被删除。


    # 11 图表库


    通常情况下，你理解图表库是指一组可以在程序中使用的类，用于用图表来表示数字。例如直方图、柱状图、饼图等。使用此类工具的一个良好例子是电子表格，它提供了数字的不同图形化表示形式。后续项目的目标是开发这样一个库，并编写一个程序来演示如何使用该库。有许多这样的库，它们的区别在于包含哪些图表、图表的“美观”程度、可选选项，以及最重要的——库的易用性。


    该项目的意义不在于该库本身的价值（这类库多如此），而是使用 `Java2D` 的一次非常好的练习，特别是如果目标是开发“美观”的图表（无论是什么）并且如果你专注于开发一个易于使用的库时。关于后者，请记住，用户友好性并不等同于最大的灵活性，而在很大程度上是指库易于理解和使用。最后，这样一个库必须是健壮的，并且在不完整或不适当的数据的基础上使用时图表行为正常是至关重要的，而这实际上并不容易。


    在接下来，我不会重点关注过程，而是关注制作了什么以及如何使用该库。


    ## 11.1 库


    基本上，图表应该可视化与类别（标签）关联的数字。一个经典的例子是年份，每个年份都关联一个数字。当前的库基本上应该提供以下图表：


    * `Line`（折线图），图表由点之间的直线组成

    * `Histogram`（直方图）或 `bar chart`（柱状图），可能是最常用的图表

    * `Circle`（圆形图）或饼图


    这三个基本图表中的每一个都有几种变体。折线图有两种变体：


    * `Curve`（曲线图），图表被绘制为平滑曲线

    * `Plot`（散点图），图表以点绘制——每个类别（标签）一个点，这些点可以用细直线连接


    柱状图默认以垂直条形形式绘制，但有一种变体是将条形绘制为水平的，最后是垂直和水平柱状图带有简单 3D 效果的变体。


    最后，饼图还有一种变体，图表被绘制成速度计的形式——只是为了指出，只有想象力（以及绘制美观图表的能力）限制了库应该包含的图表。


    因此，该库包含 9 基础（或简单）图表，它们由以下类型定义：


    ![](img/Java_10_-_Java2D_6-11-17_163.jpg)


    此外，对于散点图，你可以指定使用哪个图形来表示图表的点，这些选项由以下类型定义，其中名称表示使用哪个图形：


    ![](img/Java_10_-_Java2D_6-11-17_1631.jpg)


    上述图表被称为简单（或单值）图表，这是因为它在原则上是由两个数组定义的：


    1.  `labels` 是一个字符串数组，表示类别，即自变量或 x 轴

    2.  `values` 是一个与 `labels` 长度相同的数字数组，表示因变量或 y 轴


    因此，简单图表是数学函数的图表，除了这两个数组外，图表还附带其他参数，指示图表应如何被绘制。


    图表也可以是多值的，这意味着每个标签有几个数字，区别在于 `values` 数组在原则上是一个二维数组。多值图表默认被绘制为若干个后续的简单图表（即作为一系列图表）。多值图表特别可以合并，这意味着各个图表绘制在同一个坐标系中——在有意义的范围内。这正是使开发后续库变得既复杂又全面的部分。


    基本上，图表是通过两个数据结构定义的。第一个称为 `SingleValues`，代表简单图表的 y 值：


    ![](img/Java_10_-_Java2D_6-11-17_164.jpg)[](image/Java_10_-_Java2D_6-11-17_165.jpg)


    简而言之，变量含义如下：


    * `label` 定义此函数的标签，通常用作 y 轴标签，默认为空

    * `header` 如果是该图表的名称或描述，默认为空

    * `type` 是此图表的类型，默认为 `VBAR`

    * `begin` 定义 y 轴上的最小值，默认为 0

    * `end` 定义 y 轴上的最大值值，默认为 0，如果 `begin` 和 `end` 均为 0，则库会自动计算

    * `points` 定义 y 轴上的间隔数，默认为 0，然后库会自动计算

    * `dec` 定义在 y 轴上使用的小数位数，默认为 0，然后库会自动计算

    * `color` 定义图表的颜色——如果未定义，则使用默认颜色

    * `plot` 定义用于散点图的图形（该值仅用于散点图）

    * `param1` 是特殊参数，其应用取决于图表类型（用于 `LINE`、`CURVE` 和 `SPEED` 图表），默认为 0

    * `param2` 是特殊参数，其应用取决于图表类型（用于 `SPEED` 图表），默认为 0

    * `onoff` 是特殊参数，其应用取决于图表类型（用于 `PIE` 和 `PLOT` 图表），默认为 `false`

    * `values` 是图表的值


    该类拥有必要的 `get` 和 `set` 方法，为了方便定义简单图表，该类比上面显示的更多的构造函数。


    `SimpleValues` 类只定义一个因变量。可以是单值或多值的图表定义如下：


    ![](img/Java_10_-_Java2D_6-11-17_166.jpg)[](image/Java_10_-_Java2D_6-11-17_167.jpg)


    初始定义了一个默认颜色数组，在未定义颜色时使用它。否则，各个属性含义如下：


    * `list` 是一个带有 `SingleValues` 类型对象的列表，定义了此图表

    * `labels` 是一个 `String` 类型数组，带有自变量轴（x 轴或标签轴）的文本

    * `label` 是 x 轴的标签，默认为空

    * `gitter` 指定是否绘制网格线（默认 `true`）或不绘制（`false`）

    * `merge` 指示是否将图表合并为一个图表（默认 `false`）

    * `same` 指定所有图表（合并图表中的）必须使用相同的 y 轴（默认 `true`）——该属性仅用于合并图表


