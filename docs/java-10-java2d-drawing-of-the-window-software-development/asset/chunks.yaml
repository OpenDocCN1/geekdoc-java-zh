- fmt: '

    - `stacked` that specifies whether `BAR` and `BAR3D` graphs should be stacked
    (`true`) or drawn side by side (`false` that is default) – the property is only
    used for a merge graph

    - `scaleX` that defines the scaling in the x axis (horizontal) direction (1 is
    default and means no scaling)

    - `scaleY` that defines the scaling in the y axis (vertical) direction (1 is default
    and means no scaling)

    - `minimum`, that is used for a merge graph to calculate the minimum value for
    the y axix

    - `maximum`, that is used for a merge graph to calculate the maximum value for
    the y axix


    The class has the necessary `get` and `set` methods, and to make it easier to
    define graphs, the class has more constructors than shown above.


    As mentioned, there are 9 different graphs, as well as the possibility to merge
    multiple graphs in the same coordinate system. The graphs are drawn using `Drawer`
    classes, which are tasked with drawing a particular graph as well as capturing
    clicks with the mouse. If you click on a graph with the mouse, it must raise an
    event:


    1. if clicking on a label (on the x axis), the name is associated with the event

    2. if clicking on the graph itself, the event has associated both the name on
    the x axis label and the corresponding function value


    An event has the type `ChartEvent` that has an argument of the following type:


    ![](image/Java_10_-_Java2D_6-11-17_169.jpg)


    Here is `value` `null` if a label is clicked. The reason is that a graph may be
    multi-valued and thus there may be several values attached to a particular label.
    A listener object for events of this type will implement the interface `ChartListener`,
    which defines a single event handler.


    A graph is a custom component:


    ![](image/Java_10_-_Java2D_6-11-17_1691.jpg)![](image/Java_10_-_Java2D_6-11-17_170.jpg)![](image/Java_10_-_Java2D_6-11-17_171.jpg)


    The component is created on the basis of a `MultiValues` object and hence the
    definition of a graph. In addition, you must specify the font to be used and you
    can specify a gap between the individual graphs (if it is a multi-valued graph)
    and if an edge must be drawn around the graph. The class has more constructors
    than shown above. Using the graph definition, the constructor creates a list of
    `Drawer` objects, where there is a `Drawer` for each graph. These `Drawer` objects
    are created using the class `DrawerFactory`, which is a simple factory class.
    The method `paintComponent()` uses these `Drawer` objects to draw the component,
    and it is also `paintComponent()` which draws an edge about the component. Should
    an edge be drawn, the preferred size of the component is used, which is also determined
    using the `Drawer` objects. The same applies to the mouse to determine whether
    a graph is clicked. That is, the `Drawer` classes are absolutely key classes:


    ![](image/Image14924.jpg)


    `Drawer` is an interface that defines three methods that define the width and
    height of the nth graph in a `ChartComponent`, and also a method that returns
    a `FunctionValue` object if this `Drawer` is clicked. In general, a graph is drawn
    as a rectangular figure with a margin. The margin is used, for example, to the
    axes of the coordinate system, to a header text, and what the margin of the figure
    is used for and thus the size of the margin is so determined by the current graph
    (not all graphs have a coordinate system). `SingleDrawer` is an abstract class,
    which implements the interface’s functions as well as methods that determine a
    graph’s margin and draw the graph. The class also defines scaling functions, and
    here you should be aware that they only scale the graph, but not the margin. As
    an example, two graphs are shown below, where the difference only is that the
    second is scaled:


    ![](image/page_173.jpg)


    The type of the above graph is `VBAR`, and there is a specific class `VbarDrawer`,
    derived from `SingleDrawer`. It is this drawer that is used to draw the above
    graphs. There are correspondingly 8 other specific `Drawer` classes, which are
    derived from `SingleDrawer`. As another example, there is shown below a multi-valued
    graph, where the first has the type `HBAR` and is drawn with a `HbarDrawer`, while
    the other is of the type `PIE` and is drawn with a `PieDrawer`:


    ![](image/Image14955.jpg)


    The code for these 9 concrete drawer classes is similar to each other and, in
    principle, they arre quite simple, although there may of course be many details
    attached to implementing the drawing functions. The classes use more auxiliary
    classes, including classes that draw the axes. Here, especially the classes that
    draw the y axes are complex, as they typically depend on the actual numbers to
    make a sensible division of the axis.


    Then there is the class `MergeDrawer` which is also a concrete class, but it draws
    the graph using other `Drawer` objects. If you have a multi-valued function, you
    can draw the graphs in the same coordinate system, which is what I have called
    a merge graph. As an example, below is shown a merge of a `LINE` graph and a `VBAR`
    graph:


    ![](image/Image14963.jpg)


    Now you can not generally merge all graphs. For example, it makes no sense to
    merge a histogram (a VBAR graph) and a pia graph. The `MergeDrawer` class starts
    by dividing the graphs into some categories, and for each of these categories,
    a `Drawer` class is defined. It leads to no less than 14 new `Drawer` classes,
    all of which look similar to the above, but instead, they are derived from the
    abstract class `MultiDrawer`, that as a single drawer this time draws a multi-valued
    graph. Specifically, it corresponds to the following `MultiDrawer` classes:


    - `MSLCPBDrawer`, which merges LINE and VBAR with the same y axis

    - `MDLCPBDrawer`, which merges LINE and VBAR with different y axis

    - `MSVBAR3DDrawer`, which merges VBAR3D with the same y axis

    - `MDVBAR3DDrawer`, which merges VBAR3D with the different y axis

    - `MSHBARDrawer`, which merges HBAR with the same y axis

    - `MDHBARDrawer`, which merges HBAR with the different y axis

    - `MSHBAR3DDrawer`, which merges HBAR3D with the same y axis

    - `MDHBAR3DDrawer`, which merges HBAR3D with the different y axis

    - `MSLCPDrawer`, which merges LINE, CURVE and PLOT with the same y axis, when
    stack of bar charts are selected

    - `MDLCPDrawer`, which merges LINE, CURVE and PLOT with the different y axis,
    when stack of bar charts are selected

    - `SVBARDrawer`, which stacks VBAR

    - `SHBARDrawer`, which stacks HBAR

    - `SVBAR3DDrawer`, which stacks VBAR3D

    - `SHBAR3DDrawer`, which stacks HBAR3


    If a multi-valued graph is merged and there is a graph that can not be merged
    with others, it is drawn as a `SingleValues` graph using the corresponding `Drawer`.


    The result of all these is that there is a lot of code related to merge of graphs,
    but the work consists primarily of writing the respective `Drawer` classes, all
    of which look similar.


