    When working with Java 2D and in general with computer graphics you have a coordinate
    system. The window’s upper left corner is (0,0), and the x axis is oriented to
    the right, while the y-axis is oriented downwards. It is a logical coordinate
    system called `user space`, and when the objects to be drawn on a physical display
    or printer, you have a different coordinate system, called `device space`. The
    rendering therefore requires a conversion of coordinates from user space to device
    coordinates, and for the screen this conversion usually is performed directly
    where 1 unit in user space corresponds to one pixel, but generally aim for conversion
    where 72 units (in user space) are converted into 1 inch.


