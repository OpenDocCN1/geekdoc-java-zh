    # 6 Colors


    Colors are treated several places in this series of books, and as a programmer,
    you usually do not need to know more than what has already been said. Colors are
    formed by combining the values of three colors red, green and blue, why wee are
    talking about RGB color encoding. In addition, an alpha value is associated, which
    tells the extent to which the color is transparent. Each of the four values is
    represented by a byte (and thus can have 256 different values), and internally
    a color is represented by a 32 bit int:


    ![](image/Image14732.jpg)


    The basic class to represents a color is *Color*, and it has been used many times
    before. Looking at all the previous examples, the use of colors is generally simple,
    but the reality is that colors as the same as text are extremely complex, and
    therefore this section as a brief introduction to the problems regarding colors.
    In short, the problems can be explained by the fact that certain colors can look
    different (and often do) on different screens, and even worse, if printed on a
    color printer. The reasons are that the computer’s color representation are relative
    (what does it actually mean a color is 40% red?) and that different hardware devices
    (screen and printer) do not display the same color in the same way. I will explain
    a little bit below, but first an example.


    The *ColorProgram* application opens the following window:


    ![](image/Image14743.jpg)


    showing 39 colored rectangles. The top row shows the color values that are defined
    as constants in the *Color* class, and above the window shows a green and a blue
