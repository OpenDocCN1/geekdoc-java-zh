    # 10 Maintenance of programs


    Most programs must be maintained over time. This is one of the reasons why program
    design and program quality play a major role as programs with an incomprehensible
    design and code that are difficult to read are almost impossible to maintain and
    at best it may be time consuming to maintain a program with a bad design.


    Many programs live for many years, and this period requires a program to be maintained
    at intervals. One reason may be that the program contains errors, which should
    of course be corrected. These are rarely the most difficult maintenance tasks,
    as errors are usually recognized shortly after the programs are launched, and
    the errors should typically be corrected by the same people who have developed
    the program, and thus by developers who have an overview of and understand the
    program code. Other reasons for maintenance is that the program needs to be expanded
    with new features or existing features should work in a different way, and for
    a large program that will be used over several or many years, there will certainly
    be requests for such changes over time. Here, the original design has a much greater
    significance for the maintenance task, as the task will typically be performed
    by anyone other than the developers who originally developed the program, and
    although they should be the same people, it is far from given that they can remember,
    how the program is written. In fact, one will be amazed at how fast one forgets
    how a program is written. Finally, a reason for maintaining a program may be that
    you simply want to modernize the program and market it as a new version, which
    is quite common for various standard programs like office suites and so forth.


    When there is a maintenance task either because a program needs to be expanded
    or a new version of the program has to be developed, it is typically a new development
    project. In principle, such a project is like other software development projects,
    but if it is a good quality program with a good design, and if the program is
    to be expanded or part of the program to be modified, the project can be limited
    to include what needs to be expanded or changed while the rest of the program
    can live on unchanged. If, on the other hand, the program has been developed without
    plained for future maintenance, there is a great risk that changes may affect
    side effects to large portions of the overall code, and in the worst case even
    smaller changes may mean that large portions of the code must be rewritten.


    Fortunately, with a good design, it is seldom so bad, but there is always reason
    to be aware that changes in a program can easily cause unintended changes elsewhere
    with errors. Therefore, maintenance of programs must be planned to ensure that
    you have identified the consequences of the changes and fully uncovered what is
    to be tested subsequently and, if possible, documentation is required, so developers
    who are making changes can quickly gain an overview of the program. The start
    of any maintenance task is therefore to read the program documentation and especially
    the design document and to get an overview of the full code so that you know the
    significance of the individual project files. The result of all that is, that
    one can not clearly emphasize the importance of design and program architecture.
    Otherwise, the program can not be maintained, and programs that can not be, it
    is in principle worthless.


    As an example, the rest of this chapter will contain two tasks that will illustrate
    program maintenance. In one task, you need to implement some extensions of the
    calendar application from the book Java 8, and in the second task, you must make
    two changes to the slot machine from the book Java 9.


