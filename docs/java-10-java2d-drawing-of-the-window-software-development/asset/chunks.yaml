    ## 7.1 Imaging


    Image editing applications like GIMP and Photoshop are designed to manipulate
    digital photos, and Java2D actually contains image processing features, and these
    features are the subject of the following. Now no new competitor is suddenly developing
    for the above programs (it’s extremely complex programs) and more than what Java2D
    directly makes available, but the following can, if nothing else, be used to explain
    how professional programs as Photoshop and GIMP works.


    Image processing describes how digital images can be manipulated using a process,
    commonly called filtering. The idea is that an image called the source is sent
    through a filter, and the result is a new image, called the destination. Both
    source and destination are in Java2D represented by a *BufferedImage*. The filter
    is defined by an interface called *BufferedImageOp*, and the main method that
    this interface defines is *filter()*. A class that implements this interface is
    often called for an image operator. Java2D defines five such image operators:


    1.  *ConvolveOp*, used for bluring, sharpening and marking of edges


    2.  *AffineTransformOp*, used for geometric transformation


    3.  *LookupOp*, used for color reduction and color inversion


    4.  *RescaleOp*, used to make a picture brighter or darker


    5.  *ColorConvertOp*, used to convert color spaces


    You can of course also define your own image operators, which is just a class
    that implements *BufferedImageOp*.


    #### **ConvolveOp**


    It is a filter that modifies each pixel in the source so the corresponding pixel
    is changed from the values of neighbor pixels. This is done by means of a so-called
    *Kernel*, which defines a matrix with the pixels to be used. An example might
    be the following:


    ![](image/Image14809.jpg)


    where a pixel has 8 neighbor pixels. Each of the matrix elements has a value and
    0 means that the pixel in question does not contribute to the result, whereas
    1 means that the pixel is moved unchanged to the destination. The above kernel
    is thus the identifier and defines a filter that does not affect the destination.
    If you want to maintain the light conditions, the sum of the matrix elements must
    be 1\. If the sum is less than 1, the image darkens and is the sum is larger than
    1, the image becomes brighter. The syntax for creating a *ConvolveOp* object is


    public ConvolveOp(Kernel kernel, int edgeHint)


    Here is the last parameter a constant that indicates what should happen with the
    edges, where all neighbor pixels are not necessarily found. There are two options:


    1.  *public static final in EDGE_ZERO_FILL*, indicating that pixels on the edge
    are set to 0 and thus become a black pixel in the destination


    2.  *public static final int EDGE_NO_OP*, which indicates that pixels on the edge
    are left unchanged at the destination


    These operations are typically used to make an image sharper or to the opposite,
    as is usually called blur. The result, of course, depends on the values of the
    matrix, but also of its size, and although in a professional photo editing program
    it is possible to determine these values, there are a number of standard examples,
    for example


    ![](image/Java_10_-_Java2D_6-11-17_118.jpg)


    #### **AffineTransformOp**


    It is an operation that performs a geometric transformation of an image, but such
    that the operation works on each of the image’s pixels. Depending on what transformation,
    it may mean that the image is slightly deformed (especially rotations) – a pixel
    is not necessarily the same in the source and the destination. Two different algorithms
    are used, which can be specified with a parameter:


    1.  *Nearest neighbor*, where the color of each pixel in the destination is based
    on its neighbor pixels in the source. It is the most effective of the two algorithms.


    2.  *Bilinear interpolation*, where the colors of each pixel are determined by
    combining the colors of pixels in the source that overlap each other in the destination.
    This algorithm is less efficient, but provides a better result.


    #### **LookupOp**


    It is an operation that can often be used as an alternative to *ConvolveOp*, which
