    # 2 图形


    在本章中，我将展示如何定义和绘制几何形状，就像我在上面的示例中做的那样，例如一个矩形。它的类型是 `Rectangle2D`，但它是一个抽象类，有两个具体的派生类，分别称为
    `Rectangle2D.Float` 和 `Rectangle2D.Double`。区别在于图形的属性以及它们是使用 `float` 类型还是 `double`
    类型定义的。这种模式用于所有原始的 `Shape` 对象。


    有一个辅助类，名为 `Point2D`（以及 `Point2D.Float` 和 `Point2D.Double`），表示一个点。`Point2D` 对象没有大小且无法渲染，该对象仅用于为其他对象定义属性。基本的几何类如图所示，它们都由一个名为
    `Shape` 的通用接口定义。该接口定义了几个重要方法，我将提到：


    *   `getBounds2D()`，返回一个外接矩形

    *   `contains()`，测试点或矩形是否包含在形状内

    *   `intersects()`，测试矩形何时与当前形状重叠


    ![](img/Image13623.jpg)


