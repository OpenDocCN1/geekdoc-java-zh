    下面的窗口显示了三种类型的 `GeneralPath` 形状，其中红色部分由三个 `line` 线段、一个 `quad` 线段和一段 `cubic` 线段组成。另外两个形状完全由
    `line` 线段组成：


    ![](img/Image13685.jpg)


    通常情况下，创建一个 `GeneralPath` 是足够简单的，只有一点是复杂的，即确定形状的内部区域。如果形状由一个简单闭合曲线边界（如红色部分），那么就没有什么可疑问的；但如果形状是由相交的线形成的，情况就会变得复杂，且它可以通过两种方式发生，你可以通过构造函数的参数来指定。如果你考虑蓝色图形，它被定义为
    `GeneralPath.WIND_EVEN_ODD`。直线将形状分为若干个闭合区域（在本例中为五个）。如果你必须判断这些区域中哪些属于该图形，可以画一条穿过图形区域的直线：


    ![](img/Image13692.jpg)


    如果你从形状外部开始并沿着线条移动，每当通过一个线段时，计数器就加 1，那么规则是：如果计数器为奇数，则该区域属于图形；如果计数器为偶数，则不属于。绿色图形被定义为
    `GeneralPath.WIND_NON_ZERO`（顺便提一下，这是默认值）。在这里必须判断图形的一部分是否属于，可以同样画一条交叉图形区域的线。当线穿过图形的某个线段时，规则是：如果线段是从左到右绘制的，计数器加
    1；如果线段是从右到左绘制的，计数器减 1。属于图形的区域即计数器不为 0 的区域。


    ![](img/Image13700.jpg)


