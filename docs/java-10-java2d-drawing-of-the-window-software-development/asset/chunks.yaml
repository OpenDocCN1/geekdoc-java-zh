    ## 9.2 PrintServices


    Java’s print API has evolved continuously, where the first versions of Java does
    not have support for print and so into an advanced API with many facilities for
    initiating print jobs. As the examples above shows, it is simple to write to a
    printer today, but when writing the program, one can not know which printer is
    located at the other end, and there may also be a variety of printers available
    with many different facilities. To handle these options, Java are expanded with
    `PrintServices`, and the following is a brief introduction to what it is.


    The principle in a print job is with the new possibilities:


    1. select the printer represented by a `PrintService` object

    2. create the job represented by a `DocPrintJob` object

    3. create a `Doc` object that represents the data to be printed

    4. start the job by calling the `DocPrintJob` object’s `print()` method


    To select a printer, you uses static methods in the `PrintServiceLookup` class:


    ```

    ![](image/Java_10_-_Java2D_6-11-17_147.jpg)![](image/Java_10_-_Java2D_6-11-17_148.jpg)

    ```


    The class `PrintServiceLookup` has a method `lookupPrintServices()` that returns
    an array of `PrintService` objects available, and it will be all the printers
    found. Using the method without parameters, you simply get all the printers the
    computer knows, but you can with two parameters specify which printers to return.
    The two parameters are respectively a `DocFlavor` and a `AttributeSet`, where
    the first indicates a MIME type, and thus what kind of documents the printer should
    be able to print, while the second indicates what other features the printer should
    be able to support. As an example from the above code, the following statement
    will return all printers that can print UTF8 encoded HTML:


    ```

    ![](image/Java_10_-_Java2D_6-11-17_1481.jpg)

    ```


    As another example, the following statement returns all printers that have the
    properties defined by the last parameter:


    ```

    ![](image/Java_10_-_Java2D_6-11-17_1482.jpg)

    ```


    and in this case, it would be a `LANDSCAPE`.


    To select a printer, you can also use `printDialog()`, which opens the usual dialog.
    The first three parameters indicate the parent and the dialog. Also note the last
    parameter, which is a `AttributeSet`, which returns the properties that the printer
    supports. You are encouraged to test the program on your machine.


    As another example, I will show a program where you can choose an image and print
    it. The program’s code is as follows:


    ```

    ![](image/Java_10_-_Java2D_6-11-17_149.jpg)![](image/Java_10_-_Java2D_6-11-17_150.jpg)![](image/Java_10_-_Java2D_6-11-17_151.jpg)

    ```


    It all happens in the method `printImage()`, which opens a `JFileChooser` dialog
    box where you can select a file. The file is opened with the method `loadImage()`,
    which returns the image as an `ImageIcon`. If an image has been opened, a `PrintService`
    object is determined for the default printer:


    ```

    ![](image/Java_10_-_Java2D_6-11-17_1511.jpg)

    ```


    and for this `PrintService`, a `DocPrintJob` is created:


    ```

    ![](image/Java_10_-_Java2D_6-11-17_1512.jpg)

    ```


    To print the image is defined an inner class `Picture`, which implements `Printable`
    and thus a page to the printer. The class looks like previous `Printable` classes
    and must implement the method `print()`, but as the entire image should be on
    the page, the graphics is scaled so that there is room for the entire image. You
    should note how the scaling is done, as it is a task that is often needed. With
    this class available, you can define the document to be printed:


    ```

    ![](image/Java_10_-_Java2D_6-11-17_1513.jpg)

    ```


    and here you should especially note the flavor parameter, whose type is which
    indicates that a single page must be printed formatted as a `Printable` object.


    I will then show a program called `PrintBook`, which prints three pages:


    ```

    ![](image/Java_10_-_Java2D_6-11-17_152.jpg)![](image/Java_10_-_Java2D_6-11-17_153.jpg)![](image/Java_10_-_Java2D_6-11-17_154.jpg)

    ```


    The three pages are defined as inner classes and are all `Printable` objects.
    The first page draws a filled circle with a radius of 50 centered at the page.
    The second page draws a frame beyond the clipping area and two diagonals. Finally,
    the last page draws a text centered at the page.

