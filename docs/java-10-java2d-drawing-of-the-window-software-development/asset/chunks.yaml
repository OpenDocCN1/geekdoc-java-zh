    and clicking on the button you get the following dialog box:


    ![](image/Image14892.jpg)


    which is Java’s default dialog box for selecting a printer and settings. If you
    click *Print*, you print a single page with the text “*Hello world* ”. The code
    for the program’s *MainView* is:


    ![](image/Java_10_-_Java2D_6-11-17_138.jpg)![](image/Java_10_-_Java2D_6-11-17_139.jpg)


    Regarding creating the window, there is nothing new, but you should note that
    the class implements the interface *Printable*, and you can generally print objects
    that implements this interface. The interface defines only a single method called
    *print()*, and this is the method that writes to the printer.


    Looking at the event handler for the button *Print*, it creates a *PrinterJob*
    object, and as the name says, it is an object that represents a pint job. Next,
    the object to be printed – in this case *this* – is associated with the method
    *printDialog()*. It is the method that opens the above print dialog box. If it
    returns *true* corresponding to clicking the *Print* button, the method *print()*
    is performed on the job object, which in turn means that the method


    ![](image/Java_10_-_Java2D_6-11-17_1391.jpg)


    is performed. The first parameter is the graphics to be drawn on, while the second
    is format of the page (defined in the dialog) and finally the last parameter is
    page number. The format defines, among other things, the clip area and the following
    statement translates the graphics to the upper left corner of the clip area:


    ![](image/Java_10_-_Java2D_6-11-17_140.jpg)


    after which the text is drawn as any other text on a *Graphics* object.


    The next example is called *PrintPages* and is an example of how to print multiple
    pages. The program has exactly the same user interface as the first example, so
    I’ll just show the code that has to do with print, but first the following method:


    ![](image/Java_10_-_Java2D_6-11-17_1401.jpg)


    which creates an *ArrayList* with objects of the type *ArrayList<String>* and
    simulates an *ArrayList* with text pages. The two parameters indicate respectively
    the total number of lines and number of lines for each page. The method is trivial
    and requires no special explanation.


    The event handler for the *Print* button is the same as in the first example and
    is not shown here, so it’s the *print()* method, where there is something to note:


    ![](image/Java_10_-_Java2D_6-11-17_1402.jpg)![](image/Java_10_-_Java2D_6-11-17_141.jpg)


    First, the height of the font used and thus the line height is determined, and
    it is used in the call of the method *createPages()* to determine the number of
    lines on the page. A *PageFormat* object defines the clip area, which is an area
    called *Imageable*, and to determine the number of lines the height of this area
    is used. Since multiple pages are printed this time, the method *print()* is called
    a corresponding number of times, and you should note that the method *createPages()*
    is called only once. The method *print()* should return *NO_SUCH_PAGE* if there
    are no more pages, and otherwise the method will return *PAGE_EXISTS*.


    The rest of the method consists of printing the lines for a single page, which
    is referred to with the variable page, which specifies the page number, but otherwise
    the method only consists of a loop that loops over all lines and where a variable
    *y* keeps track of where to print.'
