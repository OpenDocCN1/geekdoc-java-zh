    ## 7.2 BufferedImage


    在本节中，我想详细介绍一下 `BufferedImage` 类，该类提供了操作图像中单个像素所需的的服务。`BufferedImage` 是核心处理类，继承自
    `Image` 类，因此类型为 `BufferedImage` 的对象可以作为 `drawImage()` 的参数。图像（即 `Image` 对象）基本上只是不同颜色的像素数组。`BufferedImage`
    可以如下图所示：


    ![](img/Image4840.jpg)


    它本质上由一个 `raster`（栅图）和一个颜色模型组成。原始数据以数组的形式保存在栅图部分，而颜色模型决定了应如何解释数据。图像中的每个像素由一个或多个值定义，称为“样本”（samples）。例如，一张黑白图像每个像素有一个样本，而
    RGB 图像每个像素有 3 个样本。缓冲区包含存储在 `byte` 或 `int` 数组中的样本，栅图部分还定义了缓冲区如何组织以及如何引用缓冲区中的特定像素。颜色模型将单个像素解释为颜色。每个像素一个样本的黑白图像被解释为黑与白之间的灰度，而在
    RGB 图像中，颜色模型使用三个样本表示一个像素，并将其解释为红、绿、蓝的强度。特定颜色的所有样本被称为“带”（band）或“通道”（channel）。因此，RGB
    图像通常有 3 个通道，也可以有一个用于 Alpha 值的第四通道。


    例如，考虑一张 4920×2768 像素的图像。由于是 RGB 图像，像素有三个样本，存储在三个 `byte` 数组中，每个数组的空间容纳 13618560
    字节。每个数组按 2768 行顺序组织，每行使用 4920 个位置。关于 `BufferedImage` 有很多细节，并且针对上述所有组件都有专门的类。通常没有必要直接操作这些类，我只想展示一个较小的示例，说明如何使用
