    由于上一个主题涉及 Java2D，我将介绍如何在程序中处理动画。事实上，Java2D 并不支持动画，你所做的只是通过稍后绘制图形（并可能在新位置绘制它）来模拟图形的动画。频繁地执行此操作（每秒多次）会给你带来一种类似于动画的效果。`AnimationDemo`
    程序展示了部分操作方法。如果你打开该程序，你将看到以下窗口：


    ![](img/Image14869.jpg)


    我不会提到此窗口的代码，因为它只有三个按钮，每个按钮都会打开一个对话框。第一个对话框模拟几何图形的动画，下一个模拟文本的动画，而最后一个则模拟图像的动画。


    点击顶部的按钮，你将得到下面的窗口，它显示了一个相对复杂的几何图形的动画：


    ![](img/Image14876.jpg)


    顶部有一个工具栏，包含五个复选框，指示以下情况：


    1. 绘制图形时是否使用了抗锯齿

    2. 是否执行了变换（例如绕中心旋转）

    3. 是否使用了渐变画笔（上面的情况正是如此）

    4. 是否在图形周围绘制了圆周

    5. 在何处使用裁剪区域（以文本形式显示）


    右侧有两个按钮用于启动和停止动画，最后是一个用于调整动画速度的滑块。


    除了此工具栏外，对话框还包含一个 `JComponent`，它是模拟动画的组件。我不想显示对话框的代码，但带有绘图的组件被定义如下一个内部类：


    ![](img/Java_10_-_Java2D_6-11-17_133.jpg)![](img/Java_10_-_Java2D_6-11-17_134.jpg)![](img/Java_10_-_Java2D_6-11-17_135.jpg)![](img/Java_10_-_Java2D_6-11-17_136.jpg)


    首先注意，该类继承了 `JComponent`，因此它是一个组件。类变量的含义应该是自而易懂的，但请注意计时器，它是动画的“引擎”。形状通过 `createShape()`
    方法创建，该方法创建一个 `GeneralPath`，其分段是由 `point` 数组中的点定义的三次曲线。其原理是每当计时器跳动时，就会绘制图形，但首先会使用
    `delta` 数组中的值对点进行微调。点和 `delta` 都在构造函数中初始化，但除了添加了用于更改窗口大小的事件处理器外，没有太多需要注意的。该处理器应该确保在尺寸更改后图形的坐标落在窗口内。


    计时器的事件处理器被命名为 `tick()`，它修改图形的点并以 `repaint()` 结束。结果是，计时器每跳动一次，窗口就会重绘。这意味着执行了 `paintComponent()`。在这里你应该注意，它调用了许多辅助方法，这些方法为被选中的复选框设置图形对象。同样请注意，该方法通过调用
    `createShap()` 来创建图形，从而用新坐标绘制图形。


    点击主窗口中的另外两个按钮时，你将得到文本和图像的动画结果。我将不会显示这些组件的代码，因为它们在原则上与上述相同，但鼓励你尝试该程序，特别是在动画化图像时，你可能会发现程序绘制图像的速度不够快。这可能是由于当前显卡的原因，但主要因为
    `drawImage()` 方法没有达到所需的性能。


    # 9 打印


    在本章中，我将描述如何从程序写入到打印机。在我们的无纸社会中，它的作用不再像以前那样，但某些程序你仍然希望在纸上打印结果，因此有了这一章。随着 Java 的发展，向物理打印机写入内容变得更容易，此外
    Swing 的几个组件内置了打印功能，但如果你想完全控制数据的打印方式，某些细节与此任务相关。本章与本书的其他部分一样，由许多你需要编写的示例组成。


    我想从一个打开以下窗口的简单应用程序开始：


    ![](img/Image14885.jpg)


    点击按钮你将得到以下对话框：


    ![](img/Image14892.jpg)


    这是 Java 选择打印机和设置的默认对话框。如果你点击 `Print`，你将打印带有带有“Hello world”文本的单页。程序 `MainView`
    的代码如下：


    ![](img/Java_10_-_Java2D_6-11-17_138.jpg)![](img/Java_10_-_Java2D_6-11-17_139.jpg)


    关于创建窗口，没有什么新奇的，但你应该注意该类实现了 `Printable` 接口，你通常可以打印实现此接口的对象。该接口只定义了一个名为 `print()`
    的方法，这就是写入到打印机的方法。


    查看 `Print` 按钮的事件处理器，它创建了一个 `PrinterJob` 对象，正如名称所示，它是一个代表打印任务的对象。接下来，要打印的对象——在本例中为
    `this`——与 `print()` 方法关联。该方法用于打开打印对话框。如果点击 `Print` 按钮并返回 `true`，则在任务上执行 `print()`
    方法，这意味着执行：


    ![](img/Java_10_-_Java2D_6-11-17_139.jpg)


    第一个参数是要绘制的图形，第二个参数是页面格式（在对话框中定义），最后一个参数是页码。格式等内容还定义了裁剪区域，接下来的语句将图形转换到左上角：


    ![](img/Java_10_-_Java2D_6-11-17_140.jpg)


    之后在 `Graphics` 对象上绘制文本。


    下一个示例名为 `PrintPages`，是打印多个页的示例。该程序的界面与第一个示例完全相同，因此我只显示与打印相关的代码，首先是以下方法：


    ![](img/Java_10_-_Java2D_6-11-17_1401.jpg)


    它创建一个类型为 `ArrayList<String>` 的对象并模拟文本页的 `ArrayList`。两个参数分别表示总行数和每页行数。该方法非常简单，不需要特殊解释。


    `Print` 按钮的事件处理器与第一个示例相同且未显示，所以重点是 `print()` 方法，这里有一些需要注意：


    ![](img/Java_10_-_Java2D_6-11-17_1402.jpg)![](img/Java_10_-_Java2D_6-11-17_141.jpg)


    首先，确定所用字体的高度，从而确定行高，并将其用于调用 `createPages()` 方法以确定页面行数。`PageFormat` 对象定义了裁剪区域，这是一个名为
    `Imageable` 的区域，为了确定行数，使用了该区域的高度。由于这次打印多个页面，`print()` 方法被相应地调用多次，你应该注意 `createPages()`
    只被调用了一次。如果没有更多页面，`print()` 方法应返回 `NO_SUCH_PAGE`，否则该方法将返回 `PAGE_EXISTS`。


    方法的其余部分由打印单页行组成，通过变量 `page` 指定（它指定了页码），但该方法主要由一个遍历所有行的循环，其中变量 `y` 跟踪打印位置。

