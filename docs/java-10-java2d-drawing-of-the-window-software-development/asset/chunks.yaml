    ## 6.1 About colors


    In the world of physics, colors are light represented by electromagnetic waves,
    and the color of the light is determined by the wavelength of light. The human
    eye is using special cells capable of capturing these wavelengths and transforming
    these impressions into our brain, in fact, by capturing three intensities of the
    colors red, green and blue and thus a bit the same as a computer works with RGB
    colors. However, our eyes are a computer far superior. A screen must convert the
    three color values to a particular color, which is done by using special features,
    but these features can not form all colors, so colors on a computer screen or
    printer will always be approximated to the true color.


    A color room is a family of colors that can be displayed on a particular device.
    For example has a screen a certain family of colors that it can display. These
    colors are formed from the intents of the colors red, green and blue, and in practice
    there are 256 values for each color. Two different screens do not have the same
    color space due to the variations of the red, green and blue lights and variations
    of the manufacturer’s electronics. Although two screens use the same color encoding
    in the form of RGB, the colors will still vary, and the screens will each have
    their color room. It’s all complicated by some printers using a different color
    encoding, combining the colors cyan, magenta, yellow and black. This encoding
    is called CMYK, and such a printer has a CMYK color room instead. Thus, RGB colors
    must be converted to CMYK colors to be displayed on a printer, thus saying differently
    that the color room for the current display should be converted to the color room
    of another device. The sum of all is that different color rooms show the colors
    differently.


    To solve these problems, the industry has worked to define absolute color rooms
    that precisely define what is red, what is green and what is blue. One of them
    is called `sRGB` (for standard RGB), and it is used as the default by Java 2D,
    which converts colors into this color room.


    It helps to solve the problems with colors, but it does not compensate for differences
    in the hardware and used color profiles. It is a table that converts the colors
    from a standard color room like `sRGB` to the color room for a particular physical
    device. Each physical device thus has its own color profile. This applies, for
    example for a screen, and to make the colors look right, you can calibrate the
    screen, which means adjusting the color profile so that the conversion from a
    specific color space to the profile is correct. It’s not easy and requires practice
    and knowledge, but people who work with print do much to calibrate their equipment
    properly.


    For many applications (most), everything with color rooms and color profiles is
    uninteresting. If a program has to draw a figure, it is seldom important to see
    if the figure appears with a little different color on another screen, but it
    is for example if you have to show photos, where it is very important. Here the
    colors should be right and if you are writing software for imaging, the above
    is important. Although I do not want to go into the subject further, Java 2D types
    are available for both color spaces and color profiles, types that have methods
    for manipulating details for colors.


