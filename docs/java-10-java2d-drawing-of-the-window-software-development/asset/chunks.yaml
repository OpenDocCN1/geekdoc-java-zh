    a rectangular area in the table (which does not include the left column) and clicking
    the button the program creates a *MultiValues* object where you can edit the properties:


    ![](image/Image14970.jpg)


    Here it has been selected three columns and defined a multi-graph for three graphs.
    Double-clicking the column header for one of the three graphs gives you the following
    dialog box where you can define settings for the individual graphs:


    ![](image/Image14978.jpg)


    You can thus use the program to define different settings for the individual graphs
    and test the effect.


    Note that for practical use, the last dialog box must be adapted to the individual
    graph types, so you can only enter and select values for the properties that make
    sense for the current graph.


    ## 11.3 Lacks and things that could be improved


    The graphs can not display all numbers with a reasonable result, and some of the
    graphs, for example, are mistaken for negative numbers, especially if you merges
    graphs. For example, it does not make sense to stack bar charts if the numbers
    can be negative. The conclusion is that several of the graphs have preconditions,
    which the drawing functions with advantage could validate and possibly raise an
    execption if the graph can not be drawn correctly. An alternative could be to
    let the *Drawer* classes return 0 if the graph can not be drawn with a sufficiently
    nice result – a strategy that is already partially implemented.


    The actual component *ChartComponent* can raise a single event if the user clicks
    on a graph. The component is drawn based on an object of the type *MultiValues*,
    and the component could be extended as it fires a *PropertyChangeEvent* if a value
    for a property is changed in the *MultiValues* data structure. In practice, it
    would typically mean that the component should be redrawn, and it could also be
    of significance to the layout manager that contains the component.


    Another question is how easy it is to expand the library with a new graph. If
    it is a whole new graph for a single-valued function, it’s simple. In this case,
    the work consists primarily of writing a new *Drawer* derived from *SingleDrawer*,
    adding a new graph type to *GraphType* and expanding the class *DrawingFactory*.
    In addition, the *MergeDrawer* class must be expanded (the method *merge()*) to
    know the new type. If graphs of the new type can also be merged, a *Drawer* derived
    from *MultiDrawer* must also be written, and the class *MergeDrawer* has to know
    this *Drawer*. Even more extensive is the task, if the new graph type can be merged
    with existing graphs, which can both cause existing *Drawer* types to bc changed
    as well as possible new *Drawer* classes to be written. The conclusion is that
    if the library is expanded with new graphs, which can be merged with existing
    graphs, the work can be quite extensive.


    It may be a good practice to improve the library corresponding to the above and
    optionally expand with a new graph type.'
