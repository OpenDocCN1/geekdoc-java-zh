    Rotations works in principle in the same way as the parallel shift and can likewise
    be defined in three different ways. In the following example, I’ve only used one
    way, but the two other methods works just like with parallel shifts. A rotation
    rotates the coordinate system, and thereby the drawing surface about a point.
    By default it is the point `(0, 0)`, but you can also rotate about any other point,
    and the result is a parallel shift followed by a rotation. The rotation is specified
    by an angle measured in radians.


    Below is a window that rotates two rectangles (the black rectangles). One rectangle
    (the blue) is rotated ![](image/text10_1.jpg) around the zero point (upper left
    corner of the rectangle), whereas the second (the red rectangle) is rotated the
    angle ![](image/text10_2.jpg) around the rectangle’s lower right corner. The magenta
    rectangle is a rotation of another black rectangle with ![](image/text10_3.jpg)
    angle around the lower right corner.


    ![](image/Image13843.jpg)[](image/Java_10_-_Java2D_6-11-17_64.jpg)


    ## Scaling


    It is a transformation in which a figure is resized – both horizontally and vertically.
    The following example scales a rectangle:


    ![](image/Image13850.jpg)[](image/Java_10_-_Java2D_6-11-17_65.jpg)


    The rectangle that is scaled, is the black rectangle. You should note that when
    you scale a figure, it is both the figures shape and location that are changed.
    When the location is changed, it is because it is all distances from the coordinate
    system start point that is scaled. The black rectangle’s upper left corner is
    `(170, 70)`, and the blue rectangle has its left upper corner at `(340, 140)`
    and the width of `400` and the height of `200`. Similarly, the upper left corner
    of the magenta rectangle’s coordinates is `(85, 35)` and the width `100` and the
    height `50`, and the red rectangle is the only scale vertically, and its top left
    corner is `(170, 35)`. The width is unchanged `200` while the height is `50`.


    ## Exercise 11


    Create a copy of the project `ScaleDemo` (the program above). You must modify
    the program so that all scaling is based on the black rectangle’s upper left corner.


    ## Stretching


    The last of the basic transformations is called shearing, where the x-axis, y-axis,
    or both axes are stretched. The window below shows how to stretch a rectangle
    (the black rectangle). In all three cases the transformation is a parallel shift
    of a rectangle with the upper left corner in `(0, 0)` followed by a shear transformation.
    This means that all three transformations are a composite transformation. In principle,
    it is simple enough to compose transformations, but the result can be difficult
    to understand, and the order is of significance.


    ![](image/Java_10_-_Java2D_6-11-17_66.jpg)[](image/Java_10_-_Java2D_6-11-17_67.jpg)[](image/Image13858.jpg)


    ## 4.2 Compositing


    Compositing refers to the process to put two images together and appears each
    time a shape or image is drawn. `Graphics2D` representing as mentioned a drawing
    surface, and every time you on this surface draw a shape, some text or an image,
    this adds a new element to the drawing surface. This takes place in principle
    using three operations:


    1. *Rasterizing* produce from the current figure *alpha values* that you can think
    of as a grid of pixels, each having an alpha value. In principle, this grid corresponds
    to the entire drawing surface and are referred to below for the source. In contrast,
    the drawing surface is called the destination.


    2. For each pixel in the source is determined the color based either on the current
    `Paint` object used by the `Graphics2D` object or an image.


    3. Source and destination (color and alpha value) are combined pixel by pixel
    to form the image on the drawing surface. The combination of source and destination
    is done from a compositing rule that exactly specify how color and alpha values
    has to be used.


    If, for example you look at what happens when a black figure is rendered on a
    white drawing surface and using the default compositing rule, you can describe
    the process as follows. Rasterizing convert the figure to an array of alpha values
    where pixels completely out of the shape are given the value `0.0` (interpreted
    as transparent), and the corresponding pixels in the destination will remain unchanged.
    Similarly, pixels in the interior of the figure have the alpha value `1.0`, and
    the corresponding pixels in the destination will get the same color as sourcens
    pixels, and the result will in this case be a black color.


    Then there are the pixels, which is located on the edge, that get an alpha value
    between `0.0` and `1.0` (assuming the use of antialiasing). They have a color
    that is a combination of the colors of pixels in the source and destination, and
    in this case it will be a combination of black and white and thus a shade of gray.
    The exact color is determined by the alpha value in the source. A pixel with an
    alpha value of `0.9`, for example give a very dark gray color.


    The above is referred to as the compositing default rule, but actually others
    may be used in special cases. They are called *Porter-Duff rules*, but are not
    discussed here.


    ## 4.3 Clipping


    Sometimes one is not interested that you draw on the entire surface. When you
    build complex shapes, there is often a need to ensure that does not draw on other
    figures. Consider the following window, which is taken from:[](image/Image13865.jpg)


    The difference is only that has been added to the top of the window. If you click
    the button, the window is redrawn, and the result is as ellipse. Clicking a third
    time, you return to the start. It is simple to define:[](image/Image13873.jpg)[](image/Image13880.jpg)[](image/Java_10_-_Java2D_6-11-17_70.jpg)[](image/Java_10_-_Java2D_6-11-17_71.jpg)


    ## 4.4 Rendering Hints


    As the last thing in this chapter mention rendering hints, as I have already mentioned
    with antialiasing. It is an opportunity to check the quality of the figure being
    drawn. The renderings mechanism of `Graphics2D` can do most things in more than
    one way, and rendering hints are the programmer’s wants respect to quality, but
    it is not certain that the mechanism can deliver the quality you wishes. You can
    define rendering hints as key/value pairs, and the possibilities is shown in the
    following table:


    | Key | Value |

    | :--- | :--- |

    | `KEY_ANTIALIASING` | `VALUE_ANTIALIAS_ON`, `VALUE_ANTIALIAS_OFF`, `VALUE_ANTIALIAS_DEFAULT`
    |

    | `KEY_RENDERING` | `VALUE_RENDER_QUALITY`, `VALUE_RENDER_SPEED`, `VALUE_RENDER_DEFAULT`
    |

    | `KEY_DITHERING` | `VALUE_DITHER_DISABLE`, `VALUE_DITHER_ENABLE`, `VALUE_DITHER_DEFAULT`
    |

    | `KEY_COLOR_RENDERING` | `VALUE_COLOR_RENDER_QUALITY`, `VALUE_COLOR_RENDER_SPEED`,
    `VALUE_COLOR_RENDER_DEFAULT` |

    | `KEY_FRACTIONALMETRICS` | `VALUE_FRACTIONALMETRICS_ON`, `VALUE_FRACTIONALMETRICS_OFF`,
    `VALUE_FRACTIONALMETRICS_DEFAULT` |

    | `KEY_TEXT_ANTIALIASING` | `VALUE_TEXT_ANTIALIAS_ON`, `VALUE_TEXT_ANTIALIAS_OFF`,
    `VALUE_TEXT_ANTIALIAS_DEFAULT` |

    | `KEY_INTERPOLATION` | `VALUE_INTERPOLATION_BICUBIC`, `VALUE_INTERPOLATION_BILINEAR`,
    `VALUE_INTERPOLATION_NEAREST_NEIGHBOR` |

    | `KEY_ALPHA_INTERPOLATION` | `VALUE_ALPHA_INTERPOLATION_QUALITY`, `VALUE_ALPHA_INTERPOLATION_SPEED`,
    `VALUE_ALPHA_INTERPOLATION_DEFAULT` |


    So far I have only used ![](image/Java_10_-_Java2D_6-11-17_73.jpg) but I will
    later use other.

