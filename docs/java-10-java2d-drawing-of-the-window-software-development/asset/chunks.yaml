    # Poul Klausen


    # Java 10: Java2D, Drawing of the window


    # Software Development


    Java 10: Java2D, Drawing of the window: Software Development

    1st edition

    © 2018 Poul Klausen & bookboon.com

    ISBN 978-87-403-1947-7

    Peer review by Ove Thomsen, EA Dania


    # Foreword


    This book is the tenth in a series of books on software development. The programming
    language is Java, and the language and its syntax and semantics fills obviously
    much, but the books have also largely focus on the process and how to develop
    good and robust applications. In the previous book, I have relatively detailed
    treated `Swing`, and the subject of this book is `Java2D`, which is the other
    half of what Java is making available for developing applications with a graphical
    user interface. One can also think of `Java2D` as the graphical tools that `Swing`
    uses to draw the components in a window. The book is relatively detailed and addresses
    issues that are not used so often in everyday programming, but the examples are,
    of course, and also the issues are important, to understand how the GUI works.
    It is similar to a few other books in this series a book where the focus is on
    language Java over the process, and only the final example focuses on system development
    with the development of a Java class library. The book assumes knowledge of Java
    corresponding to the books `Java 3` and `Java 4` and to some extent knowledge
    of `Swing` corresponding to the book `Java 2`.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading about the subject and by studying complete sample programs, but most
    importantly by yourself to do it and write your own programs from scratch. Therefore,
    an important part of the books is exercises and problems, where the reader has
    to write programs that correspond to the substance being treated in the books.
    All books in the series is built around the same skeleton and will consist of
    text and examples and exercises and problems that are placed in the text where
    they naturally belongs. The difference between exercises and problems is that
    the exercises largely deals with repetitions of the substance that is presented
    in the text, and furthermore it is relatively accurately described what to do.
    Problems are in turn more loosely described, and are typically a little bigger
    and there is rarely any clear best solution. These are books to be read from start
    to finish, but the many code examples, including exercises and problems plays
    a central role, and it is important that the reader predict in detail studying
    the code to the many examples and also solves the exercises and problems or possibly
    just studying the recommended solutions.


    All books ends with one or two larger sample programs, which focus primarily is
    on process and an explanation of how the program is written. On the other hand
    appears the code only to a limited extent – if at all – and the reader should
    instead study the finished program code perhaps while testing the program. In
    addition to show the development of programs that are larger than the examples,
    which otherwise is presented, the aim of the concluding examples also is to show
    program examples from varying fields of application.


    Most books also ends with an appendix dealing with a subject that would not be
    treated in the books. It may be issues on the installation of software or other
    topics in computer technology, which are not about software development, but where
    it is necessary to have an introductory knowledge. If the reader already is familiar
    with the subject, the current appendix can be skipped.


    The programming language is, as mentioned Java, and besides the books use the
    following products:


    * `NetBeans` as IDE for application development

    * `MySQL` to the extent there is a need for a database server (from the book `Java
    6` onwards)

    * `GlassFish` as a web server and application server (from the book `Java 11`
    onwards)


    It is products that are free of charge and free to install, and there is even
    talk about products, where the installation is progressing all by itself and without
    major efforts and challenges. In addition, there are on the web detailed installation
    instructions for all the three products. The products are available on Windows
    and Linux, and it therefore plays no special role if you use Linux or Windows.


    All sample programs are developed and tested on machines running Linux. In fact,
    it plays no major role, as both Java and other products work in exactly the same
    way whether the platform is one or the other. Some places will be in the books
    where you could see that the platform is Linux, and this applies primarily commands
    concerning the file system. Otherwise it has no meaning to the reader that the
    programs are developed on a Linux machine, and they can immediately also run under
    Windows unless a program refers to the file system where it may be necessary to
    change the name of a file.


    Finally a little about what the books are not. It is not “how to write” or for
    that matter reference manuals in Java, but it is as the title says books on software
    development. It is my hope that the reader when reading the books and through
    the many examples can find inspiration for how to write good programs, but also
    can be used as a source collection with a number of examples of solutions to concrete
    everyday programming problems that you regularly face as a software developer.


    # 1 Introduction


    When you write a program with a graphical user interface, the programming is based
    to a large extent on the use of finished classes for windows, buttons, fonts,
    etc. From the start, these classes was gathered in `AWT` and its subpackages,
    and the APIs could be seen as two layers of classes that could be called a `user
    interface toolkit` and a `drawing toolkit`, the first layer comprised of the classes
    for components and properties of the components, while the second layer was consisted
    of classes for basic geometric tools that could draw lines and squares and manipulate
    the individual pixels. Later (starting with `Java 2`) `AWT` was split into two
    APIs in the form of `Swing` and `Java2D`. This book deals with `Java2D` and thus
    how you in Java can program 2-dimensional graphics and manipulate images.


    Like other APIs includes `Java2D` a very large number of classes, but overall
    these are classes for:


    1. `Shapes`, where you can create arbitrary geometric shapes as combinations of
    straight lines, curves, rectangles, ellipses and arcs.

    2. `Stroking` that defines how lines should be drawn in terms of width, dashed
    or as a solid stroke. Furthermore, you can specify how the corners will be drawn.

    3. `Filling` that specifies how shapes are filled. You can specify a color, a
    pattern or a gradient fill, and in fact you can also use an image.

    4. `Transformations`, where everything that is drawn (shapes, images, text) can
    be stretched, scaled and rotated.

    5. `Alpha compositing`, is the process of combining a drawing with a background
    to create figures with partial or full transparency.

    6. `Clipping` is an option for limiting the part of a shape to be drawn so as
    not draw on an unwanted area of the window.

    7. `Anti-aliasing` is a technique to avoid uneven lines, where you can see the
    individual pixels.

    8. `Text` where you can manipulate the text in the same way as other geometric
    shapes.

    9. `Color` comprising classes and methods to represent colors, so they are hardware
    independent.

    10. `Images` that provide the ability to manipulate images in the same way as
    other geometric shapes. It also includes classes to read images from and save
    images in files.

    11. `Image processing`, which includes classes to manipulate the individual pixels
    in images.

    12. `Animation`, which are classes that make services available, so you can animate
    geometric shapes, text and images.

    '
