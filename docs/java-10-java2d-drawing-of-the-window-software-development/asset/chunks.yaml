    `DocFlavor` 和 `AttributeSet`，其中第一个指示 MIME 类型，即打印机应该能够打印什么种文档，而第二个指示打印机应该支持哪些其他功能。如上述代码示例所示，以下语句将返回所有可以打印
    UTF8 编码 HTML 的打印机：


    ```

    ![](img/Java_10_-_Java2D_6-11-17_1481.jpg)

    ```


