    ## 练习 1


    编写一个你可以调用 `Java2DShapes` 的程序。该程序应该打开一个如下所示的窗口：


    ![](img/Image13582.jpg)


    该程序可以用上述相同的方式编写。三角形是由三条直线绘制的。尝试自己动手（使用 Java 文档）找出如何画圆。该类型是 `Ellipse2D`。


    ## 1.1 Graphics2D 类


    在处理示例之前，我将简单谈一下 `Graphics2D` 类，因此会稍微涉及相关技术。


    在窗口中绘图的过程基于许多对象，如形状、图像、文本等，这些对象让你能够确定屏幕或打印机上的每个像素应该具有什么颜色，这个过程被称为 `rendering`（渲染），因此，渲染是在输出设备上显示图形原语（Primitives）结果的过程。`Graphics2D`
    类可以被 Java2D 的渲染引擎。此外，`Graphics2D` 对象以像素集合的形式（每个像素都有一种颜色）表示一个图形表面。对象如何将图形原语转换为像素以及像素获得什么颜色，取决于对象的状态，该状态包含了七个概念：


    1. `paint`：决定绘制和填充形状（包括文本）时使用哪些颜色。

    2. `stroke`：指示通过 `draw()` 方法绘制形状的线条粗细。

    3. `font`：指示文本应如何渲染。

    4. `transformation`：指定原语图形对象在渲染之前应如何进行变换（移动、旋转、拉伸），包括逻辑坐标如何转换为物理坐标（默认情况下，72 个逻辑坐标转换为物理设备上的
    1 英寸）。

    5. `compositing`：用于确定颜色如何与绘图表面上的现有颜色组合。

    6. `clipping`：定义渲染区域的限制（默认是 null，意味着整个绘图表面）。

    7. `rendering hints`（渲染提示）：是告诉对象应如何被渲染的技术。


    有四种用于渲染几何原语的通用方法：


    1. `fill()`：填充形状的内部。

    2. `draw()`：绘制形状的边界。

    3. `drawString()`：绘制文本。

    4. `drawImage()`：用于显示图像。


    渲染过程由几个步骤组成，这些步骤原则上与上述四个方法独立并按以下顺序执行：


    1. `transformation`（变换）

    2. `rasterizing`（光栅化）

    3. `clipping`（裁剪）

    4. `paint`（绘制）

    5. `compositing`（合成）


    当给定的图形需要渲染（例如在屏幕上渲染）时，这是一种近似，形状并不一定能精确呈现。屏幕使用点（像素）来表示形状，例如，你无法用点产生精确的圆（人们可以看到边缘是由点组成的，而不是圆弧）。为了确定必须属于特定形状的点，计算机采用两种方法之一。默认是
    `aliasing`（锯齿算法），即中心位于图形内部的像素被着色。也就是说，单个像素要么是图形的一部分，要么不是。结果是一个边缘呈锯齿状的形状。`aliasing`
    的优点是它是绘制形状的一种有效且快速的方法，在大多数情况下，结果是完全满意的。第二种方法称为 `antialiasing`（抗锯齿），在这里计算机为每个像素确定图形与当前像素的交集。像素根据其属于图形的程度被赋予相应的饱和度着色。结果是一个线条和圆弧平滑程度不相同的图形。在底图中，左侧的圆是用锯齿算法渲染的，而右侧的圆是用抗锯齿渲染的。


    同样注意文本的差异。`antialiasing` 的缺点当然是它是一个全面的渲染过程，需要执行大量的计算。下方窗口的代码如下，你主要需要注意如何指定 `Graphics2D`
    对象必须使用抗锯齿：


    ![](img/Image13591.jpg)!(image/Java_10_-_Java2D_6-11-17_17.jpg)


    上面，我提到渲染过程包括光栅化和合成，它指示了图形像素覆盖绘图表面像素的程度。这个值被称为 `alpha value`（Alpha 值），是 0.0（不可见或透明）到
    1.0（完全覆盖或不透明）之间的数字。例如，下面的窗口了两条直线和三个矩形，其中两条线先绘制：


    ![](img/Image13599.jpg)


    第一个矩形的绘制的 alpha 值为 1，因此会完全覆盖底层的像素。结果是两条线被矩形覆盖了。中间的矩形 alpha 值为 ½，因此它没有完全覆盖线条。结果是红色部分与黑色线条和灰色背景部分混合。最后一个矩形的
    alpha 值为 0，因此完全透明，从而不可见。代码如下：


    ```

    ![](img/Java_10_-_Java2D_6-11-17_19.jpg)

    ```


    如果你测试该程序，请注意线条和矩形都随窗口的大小调整。

