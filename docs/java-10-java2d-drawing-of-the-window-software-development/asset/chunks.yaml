    此外，文本必须被绘制，尽管通常在与 Swing 组件相关的文本工作中，你不需要做任何操作，但文本也必须在某处被绘制，这项任务由 Java2D 来处理。实际上，文本包含许多细节，这正是本章的主题，但基本上文本图形对象可以像其他图形对象和形状一样进行操纵。


    文本包含编码为 Unicode 的字符，因此为了绘制文本，必须为每个字符找到并渲染代表该字符的图形。这样的图形被称为 `glyph`（字形），而字体包含了该字体支持的所有字符的字形。在字体上还附带了字体度量（font
    metrics），指示了每个字符的大小。对于高度有三种尺寸。字符绘制在基准线（baseline）上（字符站在基准线上）。`descent`（下降部）表示字符在基线以下必须填充多少空间，而
    `ascent`（升部）表示它们在基线以上可以填充多少。最后通过 `leading`（行间距）指定行之间的空间，这三个尺寸合起来称为字体高度。作为所有这些内容的示例，你可以考虑以下窗口：


    ![](img/Image14614.jpg)


    这里的黑线是基准线，黑线与红线之间的距离是 $descent$，黑线与洋红色线之间的距离是 $ascent$，洋红色线与蓝色之间的距离是 `leading`。


    组件代码所示：


    ![](img/Java_10_-_Java2D_6-11-17_74.jpg)![](img/Java_10_-_Java2D_6-11-17_75.jpg)


    在这里你应该特别注意 `FontMetrics` 类，它包含了关于字体的信息，并且你应该注意 `stringWidth()` 方法，它被用于测量字符串在当前字体中占据了多少空间。


    事实上，人们可以对文本进行更多操作，例如，你可以为文本关联一个迭代器，用它可以来操纵单个字符或字符串的一部分。`AttributedText` 程序打开了一个如下所示的窗口：


    ![](img/Image14621.jpg)![](img/Java_10_-_Java2D_6-11-17_76.jpg)![](img/Java_10_-_Java2D_6-11-17_77.jpg)


    `createImage()` 方法是一个从 jar 文件加载 `Bean.png` 文件的方法，结果是一个 48×48 像素的图标。然后是 `paintComponent()`，这次它是复杂的。首先，该方法定义了两个字体和一个字符串。你必须注意该字符串以两个逗号结尾。这里逗号并不是必不可的，但这两个字符随后会被替换为其他内容。下一步是为该字符串定义一个
    `AttributedString`（属性字符串），它是一个允许以多种方式操纵字符串的对象。首先为文本附带了一个衬线字体（serif font），然后文本通常会基于此字体进行绘制，但随后分配了一个等宽字体（mono
    font），但仅针对从第 6 位到第 13 位（包含在内）的字符，即 `Fredegod` 这个词。此外，该方法定义了该子字符串应该是红色并带有下划线的。接下来定义了一个作为
    `GeneralPath` 的 `Shape`，这是一个由两个三角形组成的图形。该图形被表示为 `ShapeGraphicAttribute`，它指示了在文本中的位置（在这里在基准线处）以及它应该被作为一个填充图形绘制。它现在被插入到文本的第
    14 个位置，以替换第一个逗号（`Fredegod` 单词后的逗号）。下一步定义了一个矩形，并以相同的方式插入到倒数第二个位置。矩形不填充任何内容，它应该显示如何在文本中添加空间。最后，图标被插入到最后。发生方式相同，只是这次使用了另一个类型为
    `ImageGraphicAttribute` 的对象。示例展示了如何构建一个非常复杂的字符串，除了上面显示的，还有许多其他选项。


