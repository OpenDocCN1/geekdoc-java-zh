    该组件在构造函数中按照指定监听鼠标点击，而处理程序测试鼠标坐标是否落在 `TextLayout` 对象范围内。这种情况通过引用对象的 `TextHitInfo`
    对象来实现，该对象返回一些重要信息，其中最重要是将鼠标坐标转换为被点击的字符。确定这一点并非易事，它是 `TextLayout` 提供的服务之一。


    下一个示例将打开以下窗口，它再次显示了使用 `TextLayout` 绘制的文本：


    ![](img/Image14693.jpg)


    程序将展示如何绘制光标（或光标/标记），以及如何使用方向键移动光标。这听起来很简单，但如果你仔细想一下，光标（通常）是绘制在两个字母之间的一条细线，计算这个字符串应该如何绘制并不简单。幸运的是，`TextLayout`
    类提供了必要的支持。组件的代码所示：


    ![](img/Java_10_-_Java2D_6-11-17_851.jpg)![](img/Java_10_-_Java2D_6-11-17_86.jpg)


    代码与之前的示例相似，但这次构造函数包含对主窗口的引用，以便为窗口关联键盘事件处理程序。事件处理程序由 `KeyHandler` 类定义，它是 `Drawing`
    类中的内部类。该类这次有一个类型为 `TextHitInfo` 的实例变量。它将显示光标必须绘制的位置，并在构造函数中初始化，然后将下一次击中绘制在索引为
    1 的字符左侧——即第一个字符处。


    然后是 `paintComponent()`，它这次定义了一个额外的渲染提示。它指示了如何进行字符边界的确定，以及其精度有多高。一旦文本绘制完成，就可以确定光标的位置：


    ![](img/Java_10_-_Java2D_6-11-17_87.jpg)


    `TextLayout` 诞生时并不带有光标，但它有一个逻辑位置，附加在 `hit` 对象上，并且可以通过 `getInsertionIndex()` 方法引用。`getCaretShapes()`
    方法返回一个光标的形状。事实上，它返回两个形状，原因是 Java2D 支持双向（`bidirectional`）文本，即文本是从右向左写入的。因此，上述方法返回两个
    `Shape` 对象。有了用于光标的 `Shape` 对象后，必须经过变换后像任何其他图形一样绘制。这里需要特别注意 `createTransformedShape()`
    方法，它可以在不转换当前 `Graphics2D` 对象的情况下转换图形。


    然后是键盘的事件处理程序，它处理涉及左、右方向键的事件。查看该处理程序很容易理解，它通过使用 `getNextRightHit()` 和 `getNextLeftHit()`
    两个方法工作。


    下一个示例与上述类似，并打开以下窗口：


    ![](img/Image14700.jpg)


    程序将展示如何使用鼠标选择文本，例如。


    ![](img/Image14708.jpg)


    如果你选择文本并释放鼠标，你将得到一个带有所选文本的消息框。


    ![](img/Java_10_-_Java2D_6-11-17_88.jpg)![](img/Java_10_-_Java2D_6-11-17_89.jpg)![](img/Java_10_-_Java2D_6-11-17_90.jpg)


    代码基本上足够简单，主要由使用两个 `TextHitInfo` 对象来确定所选文本的区域并填充相应的矩形组成。最困难的实际上是控制事件处理程序中的逻辑，即何时开始新选择以及勾选标记何时再次消失。


    `TextLayout` 基本上代表单行文本，如果文本必须填充几行，你必须做得更好，但幸运的是有可以使用辅助类。考虑以下窗口。程序所做的事情是在窗口中显示文本（当然用
    `JTextArea` 做这很轻而易举），但在情况下，文本是使用 `TextLayout` 绘制的。


    ![](img/Image14715.jpg)![](img/Java_10_-_Java2D_6-11-17_91.jpg)![](img/Java_10_-_Java2D_6-11-17_92.jpg)![](img/Java_10_-_Java2D_6-11-17_93.jpg)


    要绘制的文本定义为数组中的三个字符串，你可以将每个字符串认为是一个段落。最重要的是带有要绘制图形对象的 `draw()` 方法。该方法的参数包括：一个 `AttributedString`
    形式的段落、绘制文本时使用的字体、绘制位置的 y 位置，以及一个指示文本外部应留多少空白的 `Insets` 对象。该方法的主要任务是将文本分行，为此使用了
    `LineBreakMeasure` 类。此外，该方法应该控制每行的 y 位置。


    该组件放置在主窗口构造函数的 `JScrollPane` 中。因此，`paintComponent()` 必须定义组件的大小。


    该方法的原理可以用于支持文本换行的组件。


    ## 5.3 字体形状


    在前一节中，我暗示了 `TextLayout` 的可能性，尽管你很少需要它，但下面的程序将展示这是可能的。程序打开下一页。如果你有一个字符串，那么 `Font`
    类有一个方法返回一个所谓的 `GlyphVector`，它是 `Glyph` 对象的集合。这些对象（每个都是 `Shape`）可以像其他图形一样进行操作。


    ![](img/Java_10_-_Java2D_6-11-17_94.jpg)![](img/Java_10_-_Java2D_6-11-17_95.jpg)![](img/Image14723.jpg)


    # 6 颜色


    在系列书籍的多个地方处理了颜色，作为程序员，你通常不需要知道比所说的更多的。颜色由红、绿、蓝三种颜色的值组合形成，这就是我们讨论 RGB 编码的原因。此外还关联了一个
    alpha 值，它指示了颜色的透明程度。这四个值中的每个都由字节表示（因此可以有 256 个不同的值），内部颜色由一个 32 位整数表示：


    ![](img/Image14732.jpg)


    表示颜色的基本类是 `Color`，之前已经使用过多次。回顾所有的示例，颜色的使用通常是简单的，但现实是颜色与文本一样极其复杂，因此本节作为关于颜色问题的简要介绍。简而言之，这些问题可以解释为：某些颜色在不同的屏幕上看起来不同（通常确实如此），如果用彩色打印机打印则更糟。原因是计算机的颜色表示是相对的（一个颜色是
    40% 红到底意味着什么？），以及不同的硬件设备（屏幕和打印机）显示相同颜色的方式不同。


    `ColorProgram` 打开以下窗口：


    ![](img/Image14743.jpg)


    显示出 39 个彩色矩形。第一行显示了在 `Color` 类中定义的常量的颜色值，窗口上方显示了一个绿色和一个蓝色矩形，中间一行矩形显示了这两种颜色如何混合，使得左侧的矩形是绿色的，随着向右移动，绿色与蓝色混合，最后是蓝色的。底一行矩形（从右向左）显示了蓝色越来越透明，直到最左侧完全透明而变得不可见。

