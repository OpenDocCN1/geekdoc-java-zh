    are placed in the window by translating the graphic object. This takes place with
    a transformation, which are discussed later, but in this case the figures is placed
    by a simple translation.


    ![](image/Java_10_-_Java2D_6-11-17_40.jpg)[](image/Java_10_-_Java2D_6-11-17_41.jpg)[](image/Java_10_-_Java2D_6-11-17_42.jpg)[](image/Java_10_-_Java2D_6-11-17_43.jpg)[](image/Image13735.jpg)


    # 3 Filling and stroking


    In the previous chapter, I described how Java2D defines geometric shapes, and
    how to draw them in a window. To draw a shape includes


    1. how should the figure’s circumference be drawn

    2. how should the interior of the figure be filled (if there is an interior)


    and both are the subject of this chapter.


    If you has a closed shape, such as a rectangle you can draw its perimeter with
    `draw()`, and you can fill the shape with `fill()`. In the window below is drawn
    two rectangles


    ![](image/Image13750.jpg)


    The goal is to show how the perimeter is drawn. The first rectangle is drawn as
    follows:


    ```

    ![](image/Java_10_-_Java2D_6-11-17_44.jpg)

    ```


    You should note that I first draw the perimeter and then fills the rectangle with
    a yellow color. The result is that the perimeter is overwritten at the top and
    to the left while it is visible on the right and at the bottom. When the line
    is (220, 20) to (220, 120), the edges are:


    - (220, 20) to (220, 120) - top edge

    - (20, 20) to (20, 120) - left edge

    - (20, 120) to (220, 120) - bottom edge

    - (220, 20) to (220, 120) - right edge


    The program’s code is:


    ```

    ![](image/Java_10_-_Java2D_6-11-17_46.jpg)

    ```


    It is important to be aware of this fact, and the class `Graphics2D` have a variable
    of type `Paint`. There are three options:


    1. `Color`

    2. `GradientPaint`

    3. `TexturePaint`


    ## 3.1 GradientPaint


    You can also fill a shape (and even draw a line with) a `GradientPaint`. Here
    you mix two colors along a straight line. Consider the following window:


    ![](image/Image13757.jpg)


    showing three squares with a straight line. The straight lines are only drawn
    to explain the principle. The first figure mixes the colors red and yellow along
    the displayed line such that you start with red in the upper left and ending with
    yellow in the bottom right. The middle figure blends similar colors red and yellow,
    but this time the line does not span across the hole square. The result is that
    all before the starting of the line is red, while all after the line is yellow.
    The final shape is similar in principle, but this time the pattern is repeated.
    The component representing the three squares are:


    ```

    ![](image/Java_10_-_Java2D_6-11-17_47.jpg)

    ```


