    旋转在原理上与平移相同，并且同样可以用三种不同的方式定义。在接下来的示例中，我只使用了一种方法，但另外两种方法的作用与平移完全一样。旋转是围绕一个点旋转坐标系，从而旋转绘图表面。默认情况下，它是点
    `(0, 0)`，但你也可以围绕任何其他点进行旋转，其结果是平移后接旋转。旋转由以弧度为单位的角度指定。


    下面是一个旋转两个矩形（黑色矩形）的窗口。其中一个矩形（蓝色）以 ![](img/text10_1.jpg) 围绕零点（矩形的左上角）旋转，而另一个（红色矩形）则以
    ![](img/text10_2.jpg) 的角度围绕矩形的右下角旋转。洋红色矩形是另一个黑色矩形以 ![](img/text10_3.jpg) 的角度围绕右下角旋转后得到的。


    ![](img/Image13843.jpg)[](image/Java_10_-_Java2D_6-11-17_64.jpg)


    ## 缩放 (Scaling)


    缩放是一种图形尺寸调整的变换——包括水平方向和垂直方向。接下来的示例缩放了一个矩形：


    ![](img/Image13850.jpg)[](image/Java_10_-_Java2D_6-11-17_65.jpg)


    被缩放的矩形是黑色矩形。你应该注意，当你缩放图形时，图形的形状和位置都会发生改变。位置发生改变是因为所有距离坐标系起始点的距离都经过了缩放。黑色矩形的左上角是
    `(170, 70)`，蓝色矩形的左上角位于 `(340, 140)`，宽度为 `400`，高度为 `200`。同样，洋红色矩形的左上角坐标为 `(85,
    35)`，宽度为 `100`，高度为 `50`；红色矩形仅进行了垂直缩放，其左上角为 `(170, 35)`，宽度保持 `200` 不变，高度变为 `50`。


    ## 练习题 11


    创建项目 `ScaleDemo`（上面的程序）的副本。你必须修改程序，使得所有的缩放都基于黑色矩形的左上角进行。


    ## 伸展 (Stretching)


    最后一种基本变换被称为切变，其中 x 轴、y 轴或两个轴都被拉伸。下面的窗口展示了如何拉伸矩形（黑色矩形）。在所有三种情况下，该变换都是对左上角在 `(0,
    0)` 的矩形进行平移，然后进行一个切变变换。这意味着所有三种变换都是复合变换。在原理上，组合变换非常简单，但结果可能难以理解，且顺序至关重要。


    ![](img/Java_10_-_Java2D_6-11-17_66.jpg)[](image/Java_10_-_Java2D_6-11-17_67.jpg)[](image/Image13858.jpg)


    ## 4.2 合并 (Compositing)


    合并是将两个图像组合在一起的过程，并在每次绘制形状或图像时出现。如前所述，`Graphics2D` 代表绘图表面，每当你在这个表面上绘制形状、某些文本或图像时，就会向绘图表面添加一个新元素。这在原理上通过三种操作完成：


    1. *栅格化*(Rasterizing）从当前图形产生 *alpha 值*，你可以将其想象为一个像素网格，每个像素都有一个 alpha 值。原理上，这个网格对应整个绘图表面，在下文中被称为源（source）。相比之下，绘图表面被称为目标（destination）。


    2. 对于源中的每个像素，根据 `Graphics2D` 对象使用的当前 `Paint` 对象或图像来确定颜色。


    3. 源和目标（颜色和 alpha 值）逐像素组合，形成绘图表面上的图像。源和结果的组合是根据合并规则完成的，该规则精确规定了如何使用颜色和 alpha 值。


    例如，如果你观察当一个黑色图形渲染在白色绘图表面上并使用默认合并规则时会发生什么，可以如下描述该过程。栅格化将图形转换为 alpha 值数组，完全在形状之外的像素被赋予值
    `0.0`（解释为透明），目标中相应的像素将保持不变。同样，图形内部的像素 alpha 值为 `1.0`，目标中相应的像素将获得与源像素相同的颜色，在这种情况下结果将黑色。


    然后是位于边缘的像素，它们会获得 `0.0` 到 `1.0` 之间的 alpha 值（假设使用了抗锯化）。它们的颜色是源和目标像素颜色的组合，在这种情况下将是黑色和白色的混合，因此是灰色。确切的颜色取决于源中的
    alpha 值。例如，alpha 值为 `0.9` 的像素将给出非常深的灰色。


    上述被称为合并默认规则，但实际上在特殊情况下可能会使用其他规则。它们被称为 *Porter-Duff 规则*，但此处不进行讨论。


    ## 4.3 裁剪 (Clipping)


    有时人们并不关心是否在整个表面上绘制。当你构建复杂的形状时，通常需要确保不绘制整个表面。考虑以下内容：[](image/13865.jpg)


    ## 4.4 渲染提示 (Rendering Hints)


    本章最后最后内容是提到渲染提示，正如我之前提到抗锯化时那样。它是对绘制图形质量的一种机会。`Graphics2D` 的渲染机制可以通过多种方式实现，而渲染提示是程序员对质量的需求，但不能确定该机制能够满足你的要求。你可以将渲染提示定义为键值对，可能性如下表所示：


    | 键 | 值 |

    | :--- | :--- |

    | `KEY_ANTIALIAS` | `VALUE_ANTIALIAS_ON`, `VALUE_ANTIALIAS_OFF`, `VALUE_ANTIALIAS_DEFAULT`
    |

    | `KEY_RENDERING` | `VALUE_RENDER_QUALITY`, `VALUE_RENDER_SPEED`, `VALUE_RENDER_DEFAULT`
    |

    | `KEY_DITHERING` | `VALUE_DITHER_DISABLE`, `VALUE_DITHER_ENABLE`, `VALUE_DITHER_DEFAULT`
    |

    | `KEY_COLOR_RENDERING` | `VALUE_COLOR_RENDER_QUALITY`, `VALUE_COLOR_RENDER_SPEED`,
    `VALUE_COLOR_RENDER_DEFAULT` |

    | `KEY_FRACTIONALMETRICS` | `VALUE_FRACTIONALMETRICS_ON`, `VALUE_FRACTIONALMETRICS_OFF`,
    `VALUE_FRACTIONALMETRICS_DEFAULT` |

    | `KEY_TEXT_ANTIALIASING` | `VALUE_TEXT_ANTIALIAS_ON`, `VALUE_TEXT_ANTIALIAS_OFF`,
    `VALUE_TEXT_ANTIALIAS_DEFAULT` |

    | `KEY_INTERPOLATION` | `VALUE_INTERPOLATION_BICUBIC`, `VALUE_INTERPOLATION_BILINEAR`,
    `VALUE_INTERPOLATION_NEAREST_NEIGHBOR` |

    | `KEY_ALPHA_INTERPOLATION` | `VALUE_ALPHA_INTERPOLATION_QUALITY`, `VALUE_ALPHA_INTERPOLATION_SPEED`,
    `VALUE_ALPHA_INTERPOLATION_DEFAULT` |


