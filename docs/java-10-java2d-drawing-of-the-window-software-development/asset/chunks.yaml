    a yellow color. The result is that the perimeter is overwritten at the top and
    to the left while it is visible on the right and at the bottom. When the frame
    is drawn, 4 straight lines are drawn:


    *   a line from (20, 20) to (220, 20), that is the top edge


    *   a line from (20, 20) to (20, 120), that is the left edge


    *   a line from (20, 120) to (220, 120), that is the bottom edge


    *   a line from (220, 20) to (220, 120), that is the right edge


    When the rectangle is filled, the area where the upper left corner is (20, 20)
    while the lower right corner is (219, 119) is colored. It is important to be aware
    of this fact, and the general rule is that you have to fill a figure before to
    draw the perimeter.


    You should note that I in the program above have defined the color with *setPaint()*
    instead of *setColor()*. In this case there is no particular reason for it, but
    the class *Graphics2D* have a variable of type *Paint*, representing how a shape
    or line should be colored. There are three options:


    1.  a *Color*


    2.  a *GradientPaint*


    3.  a *TexturePaint*


    The three options are illustrated below, but *Paint* is an interface that the
    class *Color* implements, and therefore you can used *setPaint()* instead of *setColor()*.


    The second shape in the window below are drawn as follows:


    ![](image/Java_10_-_Java2D_6-11-17_46.jpg)


    and should again illustrate where the edge is drawn. In order to clarify the two
    corners of the rectangle, I have drawn two circles, both of which have a diameter
    of 5\. The first has in its center (240, 20) and thus in the upper left corner
    of the rectangle. The second circle has its center at (440, 120) and thus in the
    lower right corner of the rectangle defining the shape.


    ## 3.1 GradientPaint


    You can also fill a shape (and even draw a line with) a *GradientPaint*. Here
    you mix two colors along a straight line. Consider the following window:


    ![](image/Image13757.jpg)


    showing three squares with a straight line. The straight lines are only drawn
    to explain the principle. The first figure mixes the colors red and yellow along
    the displayed line such that you start with red in the upper left corner and ending
    with yellow in the bottom right corner. The middle figure blends similar colors
    red and yellow, but this time the line does not span across the hole square. The
    result is that all before the starting of the line is red, while all after the
    line is yellow. The final shape is similar in principle, but this time the pattern
    is repeated. The component representing the three squares are:


    ![](image/Java_10_-_Java2D_6-11-17_47.jpg)


    ## Exercise 7


    ![](image/Image13765.jpg)


    Write a program that you can call *Circles*, which paints the window as shown
    above. Here is the left ellipse is filled with a *GradientPaint* that mixes the
    colors light gray and dark gray along the horizontal diameter, while the right
    ellipse mixes the colors blue and white along the vertical diameter. The two ellipses
    must follow the window size and change when the size of the window changes.


