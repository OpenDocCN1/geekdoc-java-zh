    The rest of this book, through a number of examples treats the above 12 items,
    but first I want to show a program. The program is called `HelloJava2D` and if
    you runs the program, it opens a window, as shown below. The window draws two
    straight lines, a rectangle and a large A. The window’s code is as follows:


    ![](image/Java_10_-_Java2D_6-11-17_10.jpg)!!(image/Image13575.jpg)


    and the only thing that happens in the code is the addition of a single component
    of the type `Drawing()`. As a `JFrame` as default has a `BorderLayout`, this component
    automatically fills the whole window. The component is defined as follows:


    ![](image/Java_10_-_Java2D_6-11-17_11.jpg)


    It is thus a custom Swing component. A component has a method, called `paintComponent()`,
    and it is the method that draws the component. The method’s parameter has the
    type `Graphics`, and it is an object that provides drawing tools available and
    represents the program’s graphics. The type has been around all the time, Java
    has existed, but with the introduction of Java2D is defined a derived class called
    `Graphics2D`, which expands with new graphics methods. Therefore starts the method
    `paintComponent()` to type cast the parameter to a `Graphics2D` object. Then the
    method can draw on the graphic object, and basically the following happens.


    The following statements defines to be drawn with a gray pen with a width of 7
    pixels, and the third statement draws a straight line between two points:


    ![](image/Java_10_-_Java2D_6-11-17_111.jpg)


    The next two statements defines two geometric shapes, which are, respectively,
    a line and a rectangle:


    ![](image/Java_10_-_Java2D_6-11-17_12.jpg)


    Final the last three statements says that the color should be blue, the text should
    be drawn with a bold font at 350 points, and finally drawn a large A:


    ![](image/Java_10_-_Java2D_6-11-17_13.jpg)


    Of course one can not know that the statements should be written that way, but
    when you see the individual statements, they are easy enough to understand.


    ## Exercise 1


    Write a program that you can call `Java2DShapes`. The program should open a window,
    as shown below:


    ![](image/Image13582.jpg)


    The program can be written in the same manner as above. The triangle is drawn
    as three straight lines. Try it yourself (using the Java documentation) to find
    out how to draw a circle. The type is `Ellipse2D`.


    ## 1.1 The class Graphics2D


    Before addressing the examples I will say a few words about the class `Graphics2D`
    and thus slightly concerning the technique.


    The process of drawing in a window is based on a number of objects as shapes,
    images, text, etc. that able you to determine which colors the individual pixels
    on a screen or a printer should have, and this process is called `rendering`,
    and thus rendering is the process to show the results of graphic primitives on
    an output device. The class `Graphics2D` can be perceived as Java2D’s rendering
    engine. In addition a `Graphics2D` object represents a graphics surface in the
    form of a collection of pixels each having a color. How the object converts graphics
    primitives to the pixels and which the colors they get are determined by the state
    of the object, which includes seven concepts:


    1. `paint`, that determines which colors to use for drawing and filling a shape
    and also including text

    2. `stroke`, indicating the thickness of the line that shapes are drawn with by
    the method `draw()`

    3. `font` to indicate how text should be rendered

    4. `transformation` that specifies how primitive graphical objects should be transformed
    (moved, rotated, stretched) before being rendered, including how the logical coordinates
    must be converted to physical coordinates (by default 72 logical coordinates are
    transformed to an inch on the physical device)

    5. `compositing` used to determine how colors are to be combined with the existing
    color on the drawing surface

    6. `clipping`, which definnes restrictions on the area to be rendered (default
    is null, which means the entire drawing surface)

    7. `rendering hints`, there are techniques that tells how objects should be rendered


    There are four general methods used for rendering geometric primitive:


    1. `fill()`, which fills the interior of a shape

    2. `draw()`, that draws the perimeter of a shape

    3. `drawString()`, that draws a text

    4. `drawImage()`, which is used to show an image


    The rendering process consists of several steps which are in principle independent
    of the above four methods and performed in the following order:


    1. `transformation`

    2. `rasterizing`

    3. `clipping`

    4. `paint`

    5. `compositing`


    When a given figure needs to be rendered, for example on a screen, it is an approximation,
    and the shape may not necessarily be presented exactly. The screen represents
    a shape using dots (pixels), and you can for example not produce an exact circle
    with points (one can see that the periphery consists of points and not a bow).
    For determining the points that must be part of a specific shape, the computer
    applies one of two ways. Default is `aliasing`, where the points whose center
