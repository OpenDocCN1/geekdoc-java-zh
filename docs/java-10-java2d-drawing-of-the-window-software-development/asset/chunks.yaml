    ## 9.2 打印服务 (PrintServices)


    Java 的打印 API 在不断演进，早期的 Java 版本不支持打印，后来演变为具有许多启动打印任务设施的高级 API。如上述示例所示，今天向打印机写入内容非常简单，但在编写程序时，无法知道另一端是哪台打印机，而且可能还有多种具有不同功能的的打印机可用。为了处理这些选项，Java
    扩展了 `PrintServices`，以下是对它的简要介绍。


    打印任务中的原理具有新的可能性：


    1. 选择由 `PrintService` 对象表示的打印机

    2. 创建由 `DocPrintJob` 对象表示的任务

    3. 创建一个表示要打印数据的 `Doc` 对象

    4. 通过调用 `DocPrintJob` 对象的 `print()` 方法启动任务


    要选择打印机，你可以使用 `PrintServiceLookup` 类中的静态方法：


    ```

    ![](img/Java_10_-_Java2D_6-11-17_147.jpg)![](img/Java_10_-_Java2D_6-11-17_148.jpg)

    ```


