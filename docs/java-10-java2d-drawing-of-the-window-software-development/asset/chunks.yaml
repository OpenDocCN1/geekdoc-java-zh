    ## 7.2 BufferedImage


    In this section, I would like to see a little more on the class `BufferedImage`,
    which is the class that provides the necessary services to manipulate the individual
    pixels in an image. `BufferedImage` is the central processing class and is derived
    from the class `Image`, and an object of type `BufferedImage` can therefore be
    used as parameter for `drawImage()`. An image and thus `Image` object is basically
    nothing but an array of pixels in different colors. `BufferedImage` can be illustrated
    as follows:


    ![](image/Image4840.jpg)


    and basically it consists of a `raster` and a color model. The raw data is saved
    as arrays in the raster portion, while the color model determines how data should
    be interpreted. Each pixel in an image is defined by one or more values, called
    samples. For example a black and white image has one sample for pixel, while RGB
    image has 3 samples for each pixel. The buffer contains the samples stored in
    byte or int arrays, and the raster part also has how the buffer is organized and
    how to refer to a particular pixel in the buffer. The color model interprets the
    individual pixels as colors. A black and white image with one sample for each
    pixel is interpreted as grayscale between black and white, and in RGB image, the
    color model uses three samples for one pixel and interprets them as intensities
    of red, green and blue. All samples for a particular color are called a band or
    channel. Thus RGB image generally has 3 channels, but can also have a fourth for
    alpha values.


    Consider, for example, a image of 4920×2768 pixels. Since there is an RGB image,
    there are three samples for pixels stored in three byte arrays each with space
    for 13618560 bytes. Each array is organized in the order of 2768 rows and each
    row uses 4920 places. There are many details regarding `BufferedImage`, and there
    are classes for all of the above components. It is rarely necessary to work directly
    with these classes, and I just want to show a small example that shows how to
    directly create a picture using `BufferedImage`. The full code is as follows:


    ```

    ![](image/Java_10_-_Java2D_6-11-17_126.jpg)![](image/Java_10_-_Java2D_6-11-17_127.jpg)![](image/Java_10_-_Java2D_6-11-17_128.jpg)

    ```


    If you run the program, you will see the window on the next page. The window has
    a `BorderLayout`, where there is a panel with two buttons at the bottom, while
    the center is a `Drawing` component that draws an image. The image is a `BufferedImage`:


    ![](image/Java_10_-_Java2D_6-11-17_1281.jpg)


    The class has more constructors, but in this case a constructor has been used
    to describe the size of the image and its color model. In this case, it is a three-channel
    RGB model, but the class `BufferedImage` defines constants for a number of other
    color models. As a result, in this case, an image of 500×300 pixels is created.
    The image is drawn in `paintComponent()` and when the result is a black image,
    it is because all sample data is 0 and hence the image buffer consists of three
    arrays (of length 150000) where all values are 0.


    ![](image/Image4854.jpg)


    If you click the `Draw image` button, the `draw()` method is performed in the
    class `Drawing`. It modifies some pixels using the method `setPixel()`. It is
    available in two versions, one of which modifies a single pixel, while the other
    modifies a rectangular area of pixels in an array. The result is, as shown below:


    ![](image/Image4861.jpg)


    Of course, it is not so often that there is a need to work with an image at this
