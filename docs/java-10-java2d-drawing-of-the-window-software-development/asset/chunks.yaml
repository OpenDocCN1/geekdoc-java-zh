    ## 7.1 图像处理


    像 GIMP 和 Photoshop 这样的图像编辑应用程序旨在处理数字照片，而 Java2D 实际上包含了图像处理功能，这些功能是后续内容的主题。现在没有新的竞争对手突然开发上述程序（它们是极其复杂的程序），而且提供了比
    Java2D 直接提供的更多功能，但以下内容至少可以解释 Photoshop 和 GIMP 等专业程序是如何运作的。


    图像处理描述了如何使用过程（通常称为滤波）来处理数字图像。其思想是将称为“源”（source）的图像通过一个过滤器，结果是一个称为“目标”（destination）的新图像。源和目标在
    Java2D 中都由 `BufferedImage` 表示。过滤器由名为 `BufferedImageOp` 的接口定义，该接口定义的主方法是 `filter()`。实现此接口的类通常被称为图像算子（image
    operator）。Java2D 定义了五种这样的算子：


    1. `ConvolveOp`，用于模糊、锐化和边缘标记

    2. `AffineTransformOp`，用于几何变换

    3. `LookupOp`，用于色彩减少和色彩反转

    4. `RescaleOp`，用于使图片变亮或变暗

    5. `ColorConvertOp`，用于转换颜色空间


    你当然也可以定义自己的图像算子，它只是一个实现 `BufferedImageOp` 的类。


    ### ConvolveOp


    这是一种过滤器，它修改源中的每个像素，使得相应的像素根据邻近像素的值发生变化。这是通过所谓的“内核”（`Kernel`）实现的，内核定义了一个包含要使用的像素的矩阵。例如所示：


    ![](img/Image14809.jpg)


    其中一个像素有 8 个邻居像素。矩阵的每个元素都有一个值，0 表示该像素对结果没有贡献，而 1 意味着该像素被原封不动地移动到目标。因此，上述内核是标识符，定义了一个不影响目标的过滤器。如果你想保持光照，矩阵元素之和必须为
    1。如果之和小于 1，图像会变暗；如果之和大于 1，图像会变亮。创建 `ConvolveOp` 对象的语法为：


    ```

    public ConvolveOp(Kernel kernel, int edgeHint)

    ```


    最后一个参数是一个常量，指示在不一定找到所有邻居像素时（在边缘处）应该发生什么。有两个选项：


    1. `public static final int EDGE_ZERO_FILL`，表示边缘像素被设置为 0

    2. `public static final int EDGE_NO_OP`，表示边缘像素保持不变


    这些操作通常用于使图像变锐或或相反，通常被称为模糊。结果取决于矩阵的值，也取决于其的大小，尽管在照片编辑中可以确定这些值，但有一些标准示例，例如：


    ### AffineTransformOp


    这是一种对图像进行几何变换的操作，该操作作用于图像的每个像素。取决于变换的内容，图像可能会发生轻微变形（特别是旋转）——源和目标中的像素并不一定相同。使用了两种不同的算法，可以通过参数指定：


    1. 最近邻（Nearest neighbor），目标中每个像素的颜色基于其邻居像素。这是两种算法中效率最高的。

    2. 双线性插值（Bilinear interpolation），每个像素的颜色通过组合源像素的颜色来确定。这种算法效率较低，但效果更好。


    ### LookupOp


    这种操作通常可以作为 `ConvolveOp` 的替代方案，定义更简单（效果更容易预测）。这里有一个所谓的查找表（lookup table），它以数组的形式包含目标像素的颜色。该数组的索引是源相应像素的值，因此目标像素的颜色通过查找来确定。红、绿、蓝三个值各有一个查找。由于每种颜色都有
    256 种选择，各个数组必须容纳 256 个值。


    创建查找表时，只需要指定一个数组，数组中的值将用于所有颜色，但你也可以指定三个数组。


    ### RescaleOp


    这是一个非常简单的操作，它只是将所有颜色值乘以一个因子。应用可能不是很多，但该操作可以用于使图像变亮或相反。需要注意的是，这意味着所有值都乘以相同的因子，某些值可能会超过
    256（或小于 0），从而导致颜色变为白色或黑色。还可以指定一个偏移量（offset），即加到颜色值上的值。


    ### ColorConvertOp


    此处未演示最后的操作，但它用于将颜色从一种颜色空间转换到另一种颜色空间。


