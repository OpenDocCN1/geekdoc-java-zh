  trans: '


    - `stacked`：指定 `BAR` 和 `BAR3D` 图表应该是堆叠（`true`）还是并排绘制（`false`，默认值）——该属性仅用于合并图

    - `scaleX`：定义 x 轴（水平）方向的缩放（1 为默认值，表示不缩放）

    - `scaleY`：定义 y 轴（垂直）方向的缩放（1 为默认值，表示不缩放）

    - `minimum`：用于合并图计算 y 轴的最小值

    - `maximum`：用于合并图计算 y 轴的最大值


    该类拥有必要的 `get` 和 `set` 方法，为了方便定义图表，该类拥有比上述更多的构造函数。


    如前所述，有 9 种不同的图表，并且可以在同一个坐标系中合并多个图表。图表是通过 `Drawer` 类绘制的，这些类负责绘制特定的图表并捕获鼠标点击。如果你用鼠标点击图表，它必须抛出一个事件：


    1. 如果点击标签（在 x 轴上），则将该名称与事件关联

    2. 如果点击图表本身，则事件同时关联 x 轴标签上的名称和对应的函数值


    事件的类型为 `ChartEvent`，其参数的类型如下：


    ![](img/Java_10_-_Java2D_6-11-17_169.jpg)


    如果点击标签，则 `value` 为 `null`。这是因为图表可能是多值的，因此一个特定标签可能关联有多个值。此类类型事件的监听器对象将实现 `ChartListener`
    接口，该接口定义了单个事件处理器。


    图表是一个自定义组件：


    ![](img/Java_10_-_Java2D_6-11-17_1691.jpg)![](img/Java_10_-_Java2D_6-11-17_170.jpg)![](img/Java_10_-_Java2D_6-11-17_171.jpg)


    该组件基于 `MultiValues` 对象创建，因此取决于图的定义。此外，你必须指定使用的字体，并可以指定各个图表之间的间隙（如果是多值图表），以及是否要在图表周围绘制边框。该类拥有比上述更多的构造函数。使用图定义，构造函数会创建一个
    `Drawer` 对象的列表，其中每个图都有一个 `Drawer`。这些 `Drawer` 对象是使用 `DrawerFactory` 创建的，这是一个简单的工厂类。`paintComponent()`
    方法使用这些 `Drawer` 对象来绘制组件，同样由 `paintComponent()` 绘制组件的边框。如果绘制边框，将使用组件的首选尺寸，该尺寸也是通过
    `Drawer` 对象确定的。鼠标处理也是类似的，用于确定图是否被点击。也就是说，`Drawer` 类是核心类：


    ![](img/Image14924.jpg)


    `Drawer` 是一个接口，定义了三个方法来确定 `ChartComponent` 中第 n 个图的宽度和高度，还定义了一个当此 `Drawer` 被点击时返回
    `FunctionValue` 对象的方法。通常情况下，图表被绘制为带有边距的矩形图形。边距用于例如坐标系的轴、页头文本，以及图形边距的实际用途，因此边距的大小是由当前图表决定的（并非所有图都有坐标系）。`SingleDrawer`
    是一个抽象类，它实现了接口的功能以及确定图表边距并绘制图的方法。该类还定义了缩放函数，这里你应该注意，它们只缩放图而不缩放边距。例如，下方显示了两个图，区别仅在于第二个经过了缩放：


    ![](img/page_173.jpg)


    上述图的类型是 `VBAR`，有一个派自 `SingleDrawer` 的特定类 `VbarDrawer`。绘制上述图表正是这个绘图器。相应地，还有 8 个其他派自
    `SingleDrawer` 的特定 `Drawer` 类。另一个例子是，下方显示了一个多值图，第一个类型为 `HBAR` 并使用 `HbarDrawer`
    绘制，而另一个类型为 `PIE`，并使用 `PieDrawer` 绘制：


    ![](img/Image14955.jpg)


    这 9 个具体 `Drawer` 类的代码彼此相似，原则上它们非常简单，尽管在实现绘制函数时可能会涉及许多细节。这些类使用了更多的辅助类，包括绘制轴的类。在这里，特别是绘制
    y 轴的类非常复杂，因为它们通常依赖于数值以对轴进行合理的划分。


    然后是 `MergeDrawer` 类，它也是一个具体类，但它使用其他 `Drawer` 对象来绘制图。如果你有一个多值函数，可以在同一个坐标系中绘制这些图，这就是我所说的合并图。例如，下方显示了
    `LINE` 图和 `VBAR` 图的合并：


    ![](img/Image14963.jpg)


    现在你并不能通用合并所有的图。例如，合并直方图（VBAR 图）和饼图是没有意义的。`MergeDrawer` 类首先将图分为若干类，并为每个类别定义一个 `Drawer`
    类。这导致了不少于 14 个新的 `Drawer` 类，它们看起来与上述相似，但它们派生自抽象类 `MultiDrawer`，该类作为单一图此时负责绘制多值图。具体而言，它对应于以下
    `MultiDrawer` 类：


    - `MSLCPBDrawer`：合并具有相同 y 轴的 LINE 和 VBAR

    - `MDLCPBDrawer`：合并具有不同 y 轴的 LINE 和 VBAR

    - `MSVBAR3DDrawer`：合并具有相同 y 轴的 VBAR3D

    - `MDVBAR3DDrawer`：合并具有不同 y 轴的 VBAR3D

    - `MSHBARDrawer`：合并具有相同 y 轴的 HBAR

    - `MDHBARDrawer`：合并具有不同 y 轴的 HBAR

    - `MSHBAR3DDrawer`：合并具有相同 y 轴的 HBAR3D

    - `MDHBAR3DDrawer`：合并具有不同 y 轴的 HBAR3D

    - `MSLCPDrawer`：当选择柱状图时，合并具有相同 y 轴的 LINE、CURVE 和 PLOT

    - `MDLCPDrawer`：当选择柱状图时，合并具有不同 y 轴的 LINE、CURVE 和 PLOT

    - `SVBARDrawer`：堆叠 VBAR

    - `SHBARDrawer`：堆叠 HBAR

    - `SVBAR3DDrawer`：堆叠 VBAR3D

    - `SHBAR3DDrawer`：堆叠 HBAR3D


    如果合并多值图时存在无法与其他合并的图，则使用相应的 `Drawer` 将其作为 `SingleValues` 图绘制。


    这一切的结果是存在了大量关于图合并的代码，但工作主要主要是编写各自的 `Drawer` 类，所有这些类看起来都很相似。


