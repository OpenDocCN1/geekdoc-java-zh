    ![](img/Image13677.jpg)## 2.3 GeneralPath


    `Line2D`、`QuadCurve2D`、`CubicCurve2D`、`Rectangle2D`、`RoundRectangle2D`、`Ellipse2D`
    和 `Arc2D` 是 Java2D 中的基本几何类型，但从上面的类图中可以看出还有两个类，它们可以用于定义更复杂的形状。


    `GeneralPath` 类通过一系列点定义形状，在每两个点之间可以是类型为 `Line2D`、`QuadCurve2D` 或 `CubicCurve2D`
    的线。`GeneralPath` 定义了一个任意形状，它不必须是闭合或连贯的。你可以这样理解这种形状，就像你用笔画它一样，你可以做两件事：


    1.  抬起笔并移动到一个点。

    2.  从笔的位置画一条线到另一个点。


    为此你使用这些方法：`moveTo()`、`lineTo()`、`quadTo()`、`cubicTo()` 和 `closePath()`。

