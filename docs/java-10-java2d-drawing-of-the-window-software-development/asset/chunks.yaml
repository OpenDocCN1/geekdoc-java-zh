    ## 2.4 区域


    几何形状的最后一个类是 `Area`。它是一种结合了一个或多个形状的类型，但你可以指定它们如何相互重叠。


    下面的窗口绘制了一个重叠的圆和一个正方形。这些图形被通过 `Area` 对象用于定义另外四个图形。在这里，你应该注意创建 `Area` 对象的四个方法，还要注意它们是如何通过平移图形对象放置在窗口中的。这是通过变换实现的，变换将在稍后讨论，但在本例中，图形是通过简单的平移放置的。


