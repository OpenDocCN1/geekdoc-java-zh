    the slider is moved. If `Drawing` refers to the component with the figures, the
    event handler can be defined as an object of the following inner class:


    ![](image/Java_10_-_Java2D_6-11-17_21.jpg)


    # 2 Shapes


    In this chapter I will show how to define and draw geometric shapes, what I already
    did with the examples above, for example a rectangle. Its type is `Rectangle2D`,
    but it is an abstract class, and there are two concrete derived classes, which
    are called respectively `Rectangle2D.Float` and `Rectangle2D.Double`. The difference
    is about the figure’s attributes and where they are defined by the type `float`
    or type `double`. This pattern is used for all primitive `Shape` objects.


    There is a helper class, called `Point2D` (and `Point2D.Float` and `Point2D.Double`)
    that represents a point. A `Point2D` object has no size and can not be rendered,
    and an object is used only to define attributes for other objects. The basic geometric
    classes are shown in the following figure, and they are all defined by a common
    interface called `Shape`. This interface defines a few important methods where
    I will mention


    *   `getBounds2D()`, which returns a circumscribing rectangle

    *   `contains()`, that tests where a point or rectangle is included in the shape

    *   `intersects()`, that tests where a rectangel overlaps the current shape


    ![](image/Image13623.jpg)


    ## 2.1 Filled shapes


    The last four are simple to use, and the difference is mainly the parameters you
    have to enter to create an object. Generally a figure is defined by a rectangle,
    that is the circumscribing rectangle which indicate the upper left corner and
    the width and height. The program `Figures` opens the following window:


    ![](image/Image13630.jpg)


    As regards the types `Rectangle2D` and `Ellipse2D` there is not much more to tell,
    but for a `RoundRectangle2D` you must beyond the circumscribing rektangle specify
    how the corners are rounded – in fact, in terms of a width and a height of a rectangle.
    Then there is the green shape, which is an `Arc2D`. First you have to define the
    circumscribing rectangle, and here one must be aware that the rectangle is the
    rectangle that circumscribes the ellipse, that the shape is a part of. In addition
    to the rectangle you must specify the angle (in degrees), where the range should
    start and how large an angle the range should span. Finally, you must specify
    how the slice should appear where there are the following options:


    *   `Arc2D.PIE`, that shows the shape in this example

    *   `Arc2D.OPEN`, which only shows the arc

    *   `Arc2D.CHORD`, that shows the arc and the chord of the arc’s end points


