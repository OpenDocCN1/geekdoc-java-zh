    接着是一个测试程序，它会打开一个包含数字的 `JTable` 窗口——靠近第一列，该列包含了作为图表标签的文本。顶部有一个带有按钮的工具栏。点击第一个按钮允许你指定表格数字的间隔，然后程序将在该范围内向表格中填充随机数。接下来是
    19 个测试按钮，它们会打开我在开发该库时为了测试而用过的窗口。最有趣的是最右侧的按钮。如果你在表格中选择一个矩形区域（不包含左侧列）并点击按钮，程序会创建一个
    `MultiValues` 对象，你可以在其中编辑属性：


    ![](img/Image14970.jpg)


    在这里，选择了三列，并为三张图表定义了一个多图表。双击这三个图表之一的列标题，会弹出以下对话框，你可以在此定义各个单个图表的设置：


    ![](img/Image14978.jpg)


    因此，你可以使用该程序为单个图表定义不同的设置并测试效果。


    请注意，在实际使用中，必须对最后一个对话框根据具体的图表类型进行调整，这样你就可以仅对当前图表有意义的属性输入并选择值。


    ## 11.3 不足与可以改进之处


    图表无法以合理的结果显示所有数字，而且某些图表（例如）会被误认为负数，特别是当合并了图表时。例如，如果数字可能为负数，那么堆叠柱状图就没有意义。结论是，几个图表具有前提条件，带有
    `advantage` 类的绘图函数可以验证这些条件，并在图表无法正确绘制时可能抛出异常。另一种替代方案是，当图表无法以足够良好的结果绘制时让 `Drawer`
    类返回 0——这种策略已经部分实现。


    实际组件 `ChartComponent` 可以在用户点击图表时抛出一个单一事件。该组件基于类型为 `MultiValues`的对象进行绘制，如果 `MultiValues`
    数据结构中某个属性的值发生变化，该组件可以通过触发 `PropertyChangeEvent` 来进行扩展。在实践中，这通常意味着组件应该重绘，而且对于包含该组件的布局管理器来说也具有重要意义。


    另一个问题是如何通过新图表扩展该库的难易程度。如果是针对单值函数的全新图表，那是非常简单的。在这种情况下，工作主要包括编写一个派自 `SingleDrawer`
    的新 `Drawer`，向 `GraphType` 中添加新的图表类型，并扩展 `DrawingFactory` 类。此外，必须扩展 `MergeDrawer`
    类（`merge()` 方法）以识别新类型。如果新类型的图表也可以进行合并，则还必须编写一个派自 `MultiDrawer` 的 `Drawer`，并且 `MergeDrawer`
    类也需要获 own 这个 `Drawer`。如果新图表类型可以与现有图表合并，那么任务将更加广泛，因为这可能导致现有的 `Drawer` 类型发生变化，并可能需要编写新的
    `Drawer` 类。结论是，如果该库扩展了可以与现有图表合并的新图表，那么工作量可能会非常巨大。


    针对上述情况改进该库，并可选地扩展新的图表类型，可能是一个良好的做法。

