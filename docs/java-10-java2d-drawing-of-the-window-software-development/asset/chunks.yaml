    # 11 PaChart


    By a chart library, you usually understand a family of classes that you can use
    in a program to represent numbers using graphs. Examples are histograms, bar charts,
    pie charts, and more. A good example of using such tools is a spreadsheet that
    offers different forms of graphical representation of numbers. The aim of the
    following project is to develop such a library as well as write a program that
    can illustrate how the library can be used. There are many such libraries, and
    they differ as to which graphs there are, how “nice” the graphs are, which options
    are possible, and also as the most important how easy the library is to use.


    The purpose of the project is not so much the value of the library (there are
    so much of that kind), but it is a very good exercise in the use of `Java2D`,
    especially if the aim is to develop “nice” graphs (whatever it may be) and if
    you focus on developing a user-friendly library. Regarding the latter, keep in
    mind that user-friendliness is not the same as the greatest possible flexibility,
    but to a greater extent that the library is easy to understand and use. Finally,
    it is extremely important that such a library is robust and that the graphs behave
    sensibly if used on an incomplete or inappropriate data basis, and it is actually
    not so easy.


    In the following, I would not focus on the process, but instead what is made and
    how the library is used.


    ## 11.1 The library


    Basically, a graph should visualize numbers associated with categories (labels).
    A classic example is year numbers, where there are associated a number with each
    year. The current library should basically offer the following graphs:


    * `Line`, where a graph consists of straight lines between points

    * `Histogram` or a `bar chart`, which is probably the most commonly used graph

    * `Circle` or pie chart


    Each of these three basic graphs is available in several variants. A line graph
    has two variants:


    * `Curve`, where the graph is instead drawn as a soft curve

    * `Plot` where the graph is drawn as points – a point for each category (label),
    which may be connected with thin straight lines


    A bar chart is drawn as default with vertical bars, but there is a variant in
    which the bars instead are drawn horizontally, and finally there is a variation
    of both the vertical and horizontal bar charts with a simple 3D effect.


    Finally, there is a variant of the pie chart, where the chart is drawn as a speedometer
    – just to point out that it is only the imagination (and the ability to draw nice
    graphs) that limit the graphs, that such a library should contain.


    The library thus contains 9 basic (or simple) graphs, which are defined by the
    following type:


    ![](image/Java_10_-_Java2D_6-11-17_163.jpg)


    In addition, for a plot graph, you can indicate which figure is used to represent
    the graph’s points, and these options are defined by the following type, where
    the names indicate which figure is used:


    ![](image/Java_10_-_Java2D_6-11-17_1631.jpg)


    A graph as above is called simple (or single-valued) corresponding to the fact
    that in principle it is defined by two arrays:


    1. `labels` that is an array of strings and represent the categories and hence
    the independent variable or the x axis

    2. `values` which is an array of numbers of the same length as `labels` and represent
    the dependent variable or the y axis


    A simple graph is thus a graph for a mathematical function, and in addition to
    the two arrays, a graph has attached other parameters, which indicates how the
    graph is to be drawn.


    A graph can also be multi-valued, which means that each label has several numbers
    and the difference is that the array `values` in principle are a 2-dimensional
    array. A multi-valued graph is as default drawn as several simple graphs after
    each other (that is, as a series of graphs). A multi-valued graph may in particular
    be merged, which means that the individual graphs are drawn in the same coordinate
    system – to the extent that it makes sense. This is exactly the part that makes
    the development of the following library both complex and comprehensive.


    Basically, a graph is defined using two data structures. The first is called `SingleValues`
    and represents the y values of a simple graph:


    ![](image/Java_10_-_Java2D_6-11-17_164.jpg)[](image/Java_10_-_Java2D_6-11-17_165.jpg)


    In short, the variables means the following:


    * `label` defines a label for this function and is typical used as a label for
    the y axis, default is blank

    * `header` if a name or description for this graph, default is blank

    * `type` is the type of this graph, default is `VBAR`

    * `begin` defines the minimum value on the y axis, default is 0

    * `end` defines the maximum value on the y axis, default is 0 and if both `begin`
    and `end` are 0 the library automatically calculates the

    * `points` defines the number of intervals on the y axis, default is 0 and then
    the library automatically calculates the

    * `dec` defines the number of decimals to be used on the y axis, default is 0
    and then the library automatically calculates the

    * `color` that defines the color for the graph – if not defined a default color
    is used

    * `plot` which defines the figure used for a plot graph (the value is only used
    for a plot graph)

    * `param1` that is a special parameter whose application depends on the graph
    type (is used for `LINE`, `CURVE` and `SPEED` graph), default is 0

    * `param2` that is a special parameter whose application depends on the graph
    type (is used for a `SPEED` graph), default is 0

    * `onoff` that is a special parameter whose application depends on the graph type
    (is used for a `PIE` and a `PLOT` graph), default is `false`

    * `values` the is values for this graph


    The class has the necessary `get` and `set` methods, and to make it easier to
    define simple graphs, the class has more constructors than shown above.


    The class `SimpleValues` only defines a single dependent variable. A graph that
    can be single-valued or multi-valued is defined as follows:


    ![](image/Java_10_-_Java2D_6-11-17_166.jpg)[](image/Java_10_-_Java2D_6-11-17_167.jpg)


    Initially, an array of default colors is defined, which is used if no colors are
    defined. Otherwise, the individual properties means the following:


    * `list` is a list with objects of the type `SingleValues` which defines this
    graph

    * `labels` is an array of the type `String` with texts for the independent axis
    (x axis or label axis)

    * `label` that is a label to x axis, default is blank

    * `gitter` specifies whether to draw grid lines (`true` that is default) or not
    (`false`)

    * `merge` that indicates whether graphs should be merged into a single graph (`false`
    is default)

    * `same` that specifies whether all graphs (in a merge graph) must use the same
    y axis (`true` is default) – the property is only used for a merge graph

