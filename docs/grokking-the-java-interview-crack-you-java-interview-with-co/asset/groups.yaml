    \ If you look internal implementation of java.util.HashSet, you will find that\
    \ it adds element as key on internal map with same values.\n\n# 15) What is NavigableMap\
    \ in Java? What is a benefit over Map?\n\nNavigableMap was added in Java 1.6,\
    \ it adds navigation capability to Map data structure. It provides methods like\
    \ lowerKey() to get keys which is less than specified key, floorKey() to return\
    \ keys which is less than or equal to specified key, ceilingKey() to get keys\
    \ which is greater than equal to specified key and higherKey() to return keys\
    \ which is greater key from a Map. It also provide similar methods to entries\
    \ e.g. lowerEntry(), floorEntry(), ceilingEntry() and higherEntry(). Apart from\
    \ navigation methods, it also provides utilities to create sub-Map e.g. creating\
    \ a Map from exiting Map like tailMap, headMap and subMap. headMap() method returns\
    \ a NavigableMap whose keys are less than specified, tailMap() returns a NavigableMap\
    \ whose keys are greater than specified and subMap() gives a NavigableMap between\
    \ range, specified by toKey to fromKey.\n\n# 16) Which one you will prefer between\
    \ Array and ArrayList for Storing object and why?\n\nThough ArrayList is also\
