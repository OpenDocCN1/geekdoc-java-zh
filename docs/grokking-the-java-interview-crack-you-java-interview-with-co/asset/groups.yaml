    这里是我整理的 40 个核心 Java 相关问题，这些问题经常出现在电话面试中。这些问题涉及了重要的 Java 核心概念，例如：String、线程基础、多线程、线程间通信、Java
    集合框架、序列化、面向对象编程概念和异常处理。如果你参加过几次 Java 面试，一定已经见过其中一些问题了。


    ## 1) Java 中 String、StringBuffer 和 StringBuilder 的区别是什么？


    String 是不可变的，而 StringBuffer 和 StringBuilder 都是可变的，这意味着任何更改（例如将 String 转换为大写或修剪空白字符）都会产生另一个新实例，而不是修改原有实例。对于后者两者，StringBuffer
    是同步的，而 StringBuilder 不是同步的；事实上，它是 Java 1.5 中引入的对 StringBuffer 的替代品。


    ## 2) Java 中 extends Thread 和 implements Runnable 有什么区别？


    区别在于 Java 中你只能继承一个类，这意味着如果你扩展了 Thread 类，就会失去继承另一个类的机会；另一方面，如果你实现了 Runnable，你仍然可以继承另一个类。


    ## 3) Java 中 Runnable 接口和 Callable 接口的区别？


    在 JDK 1.5 引入 Callable 之前，Runnable 是 Java 中实现可执行任务的唯一方式。与 Runnable 类似，Callable
    也定义了一个单方法 `call()`，但与 `run()` 不同的是，它可以返回结果并抛出异常。


    ## 4) Java 中 ArrayList 和 LinkedList 的区别？


    简而言之，ArrayList 在 Java 中是由数组支持的，而 LinkedList 只是节点的集合，类似于链式数据结构。如果你知道索引，ArrayList
    还提供了随机搜索，而 LinkedList 只允许随机顺序搜索。另一方面，与 ArrayList 相比，在 LinkedList 中添加和删除元素是高效的，因为只需要修改链接，不需要对其他元素进行重排。


    ## 5) Java 中 wait 和 notify 的区别是什么？


    wait 和 notify 方法都用于线程间通信，其中 wait 用于在某个条件下暂停线程，而 notify 用于向等待的线程发送通知。这两个方法都必须在同步上下文中（例如同步方法或同步代码块）中调用。


    ## 6) Java 中 HashMap 和 Hashtable 的区别？


    虽然 HashMap 和 Hashtable 都基于哈希表数据结构，但它们之间存在细微的区别。HashMap是非同步的，而 Hashtable 是同步的，正因如此，HashMap
    比 Hashtable 快，因为它没有与同步相关的开销。另一个微小区别是 HashMap 允许 null key，而 Hashtable 不允许。


    ## 7) Java 中 TreeSet 和 TreeMap 的区别？


    虽然两者都是有序集合，但 TreeSet 本质上是一个不允许重复的 Set（集合）数据结构，而 TreeMap 是 Map 接口的实现。实际上，TreeSet
    是通过 TreeMap 实现的，就像 HashSet 使用 HashMap 实现一样。


    ## 8) 编写一个 Java 程序打印斐波那契数列？


    电话面试中的核心 Java 面试题：斐波那契数列是一个序列，其中每个数字等于前两个数字之和，即 $f(n)=f(n-1) + f(n-2)$。这个程序通常用于教学生递归，但你也可以在不使用递归的情况下解决它。请查看该问题的迭代解和递归解决方案。


    在电话面试中，这个问题并不常见，但有时面试官也想通过这类问题检查你的解决问题的能力。


    ## 9) 编写一个 Java 程序检查一个数字是否为质数？


    如果一个数字不能被除自身以外的任何数字整除，则称为质数。1 不被视为质数，因此你的检查必须从 2 开始。最简单的解决方案是检查每个数字直到数字本身，看它是否能被整除。当面试官要求你改进时，你可以说检查到数字的平方根即可。如果你能进一步改进算法，将给面试官留下更深刻印象。


    ## 10) 如何在不使用临时变量的情况下交换数字？


    这是一个老问题了。我第一次是在 2005 年看到这个，但我确定它比那还要老。这个问题的好处是，除了 XOR 技巧外，所有解决方案都有某些缺陷，这被用来测试候选人是否真的掌握了知识。


    ## 11) 如何在 Java 中检查链表是否包含循环？


    这是另一个解决问题的面试题，在电话面试和筛选轮中非常流行。这是一个测试候选人解决问题能力的极佳题目，特别是如果他没见过这个问题时。它还有一个很好的跟进问题：找到循环的起始点。


    ## 12) 编写 Java 程序在不使用 API 的情况下反转字符串？


    另一个测试候选人解决问题能力的题目。你可能在 Java 面试的电话轮中预期这类问题，但这些问题现在已经成为常态。面试官寻找的是逻辑，你不需要写出代码，但你应该能够想出解决方案。


    ## 13) Java 中 Serializable 和 Externalizable 的区别？


    Serializable 是一个标记接口（marker interface），没有定义任何方法，但 Externalizable 接口定义了两个方法，例如
    `readExternal()` 和 `writeExternal()`，允许你控制序列化过程。Serializable 使用默认的序列化过程，对于某些应用程序来说可能非常慢。


    ## 14) Java 中 transient 和 volatile 的区别？


    `transient` 关键字用于序列化，而 `volatile` 用于多线程。如果你想从序列化过程中排除一个变量，将该变量标记为 `transient`。与静态变量类似，`transient`
    变量不会被序列化。另一方面，`volatile` 变量告诉编译器多个线程对该变量感兴趣，编译器不应重排它的访问。`volatile` 变量还遵循发生于（happens-before）关系，这意味着
    volatile 变量中的任何写入都发生在任何读取之前。你还可以使用 `volatile` 让 `double` 和 `long` 变量的非原子访问变为原子性。


    ## 15) 抽象类和接口的区别？


    从 Java 8 开始，Java 中抽象类和接口之间的区别已经缩小，现在接口甚至可以通过默认方法和静态方法包含实现。顺便说一下，在 Java 中你仍然只能继承一个类，但可以实现多重继承。抽象类用于提供默认实现并仅留一些需要自定义的部分，而接口广泛用于
    API 中定义类的契约。


    ## 16) 关联（Association）、组合（Composition）和聚合（Aggregation）的区别？


    在关联、组合和聚合之间，组合的强度最强。如果部分离开整体仍然可以存在，则两个类之间的关系被称为聚合；但如果部分离开整体就无法存在，则两个类之间的关系被称为组合。在继承和组合之间，后者提供了提供了更灵活的设计。


    ## 17) Java 中 FileInputStream 和 FileReader 的区别是什么？


    FileInputStream 和 FileReader 的主要区别在于前者用于读取二进制数据，而后者用于读取文本数据，这意味着后者在 Java 中将字节转换为文本时还会考虑字符编码。


    ## 18) 在 Java 中如何将字节转换为字符？


    通过字符编码将字节转换为字符或文本数据。当你从文件或网络端点读取二进制数据时，提供一个字符编码来将这些字节转换为等效字符。选择错误的字符编码可能会因解释方式不同而改变信息的含义。


    ## 19) finally 句中可以使用 return 语句吗？会发生什么？


    是的，可以在 `finally` 块中使用 `return` 语句，但它不会阻止 `finally` 块的执行。顺便说一下，如果你在 `try` 块中使用了
    `return` 语句，那么 `finally` 块的返回值将覆盖 `try` 块的返回值。


