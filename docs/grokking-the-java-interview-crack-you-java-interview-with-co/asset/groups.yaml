    \ a way to get Synchronized copy of collection e.g. ArrayList, HashMap by using\
    \ Collections.synchronizedMap() Utility function. One Significant difference is\
    \ that Concurrent Collections has better performance than synchronized Collection\
    \ because they lock only a portion of Map to achieve concurrency and Synchronization.\n\
    \n# 6. What is the difference between Iterator and Enumeration?\n\nThis is a beginner\
    \ level collection interview questions and mostly asked during interviews of Junior\
    \ Java developer up to experience of 2 to 3 years Iterator duplicate functionality\
    \ of Enumeration with one addition of remove() method and both provide navigation\
    \ functionally on objects of Collection. Another difference is that Iterator is\
    \ more safe than Enumeration and doesn't allow another thread to modify collection\
    \ object during iteration and throws ConcurrentModificationException. See Iterator\
    \ vs Enumeration in Java for more differences.\n\n# 7. How does HashSet is implemented\
    \ in Java, How does it use Hashing?\n\nThis is a tricky question in Java because\
    \ hashing you need both key and value and there is no key for the store it in\
    \ a bucket, then how exactly HashSet store element internally. Well, HashSet is\
    \ built on top of HashMap. If you look at source code of java.util.HashSet class,\
    \ you will find that it it uses a HashMap with same values for all keys, as shown\
    \ below:\n\n```\nprivate transient HashMap map;\n\n// Dummy value to associate\
    \ with an Object in the backing Map\nprivate static final Object PRESENT = new\
    \ Object();\n\nWhen you call add() method of HashSet, it put entry in HashMap\
    \ :\n\npublic boolean add(E e) {\n    return map.put(e, PRESENT)==null;\n}\n```\n\
    \nSince keys are unique in a HashMap, it provides uniqueness guarantee of Set\
    \ interface.\n\n# 8. What do you need to do to use a custom object as a key in\
    \ Collection classes like Map or Set?\n\nThe answer is: If you are using any custom\
    \ object in Map as key, you need to override equals() and hashCode() method, and\
    \ make sure they follow their contract. On the other hand if you are storing a\
    \ custom object in Sorted Collection e.g. SortedSet or SortedMap, you also need\
    \ to make sure that your equals() method is consistent to compareTo() method,\
    \ otherwise that collection will not follow there contacts e.g. Set may allow\
    \ duplicates.\n\n# 9. The difference between HashMap and Hashtable?\n\nThis is\
    \ another Classical Java Collection interview asked on beginner's level and most\
    \ of Java developer has a predefined answer for this interview questions e.g.\
    \ HashMap is not synchronized while Hashtable is not or hashmap is faster than\
    \ hash table etc. What could go wrong is if he placed another follow-up question\
    \ like how hashMap works in Java or can you replace Hashtable with ConcurrentHashMap\
    \ etc.\n\n# 10. When do you use ConcurrentHashMap in Java?\n\nThis is another\
    \ advanced level collection interview questions in Java which normally asked to\
    \ check whether the interviewer is familiar with optimization done on ConcurrentHashMap\
    \ or not. ConcurrentHashMap is better suited for situation where you have multiple\
    \ readers and one fewer writers since Map gets locked only during the write operation.\
    \ If you have an equal number of reader and writer than ConcurrentHashMap will\
    \ perform in the line of Hashtable or synchronized HashMap.\n\n# 11. What is the\
    \ difference between Set and List in Java?\n\nAnother classic Java Collection\
    \ interviews popular on telephonic round or the first round of interview. Most\
    \ of Java programmer knows that Set doesn't allowed duplicate while List does\
    \ and List maintains insertion order while Set doesn’t. What is key here is to\
    \ show the interviewer that you can decide which collection is more suited based\
    \ on requirements.\n\n# 12. How do you Sort objects question serves two purpose\n\
    \nThis Collection interview it not only test an important programming concept\
    \ Sorting but also utility class like Collections which provide several methods\
    \ for creating synchronized collection and sorting. Sorting is implemented using\
    \ Comparable and Comparator in Java and when you call Collections.sort() it gets\
    \ sorted based on the natural order specified in compareTo() method while Collections.sort(Comparator)\
    \ will sort objects based on compare() method of Comparator.\n\n# 13. What is\
    \ the difference between Vector and ArrayList?\n\nOne beginner level collection\
    \ interview questions, this is still very popular and mostly asked in the telephonic\
    \ round. ArrayList in Java is one of the most used Collection class and the most\
    \ interviewers asked questions on ArrayList. See Difference between Vector and\
    \ ArrayList for the answer to this interview question.\n\n# 14. What is the difference\
    \ between HashMap and HashSet?\n\nThis collection interview questions is asked\
    \ in conjunction with HashMap vs Hashtable. HashSet implements java.util.Set interface\
