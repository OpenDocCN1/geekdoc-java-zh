    ## When to use the Strategy Design Pattern in Java?


    Java design pattern interview question and answers for senior and experience programmer.
    Strategy pattern is quite useful for implementing a set of related algorithms
    like compression algorithms, filtering strategies, etc. The strategy design pattern
    allows you to create Context classes, which use Strategy implementation classes
    for applying business rules.


    One good example of a Strategy pattern from JDK itself is a Collections.sort()
    method and the Comparator interface, which is a strategy interface and defines
    a strategy for comparing objects.

    Because of this pattern, we don''t need to modify the sort() method (closed for
    modification) to compare any object; at the same time, we can implement a Comparator
    interface to define a new comparing strategy (open for extension).


    This pattern is actually based upon the open-closed design principle and if you
    understand that principle then its quite easy for you to understand the Strategy
    pattern as well. It''s actually better to know about SOLID principles as many
    design patterns are based upon that.


    If you''re looking for a complete course on Object-Oriented design principles,
    I recommend checking out SOLID Principles of Object-Oriented Design by Steve Smith
    on Pluralsight. This is a useful course for anyone looking to strengthen their
    overall knowledge of software architecture.


    ## 3. What is the Observer design pattern in Java?

    When do you use the Observer pattern in Java?


    This is one of the most common Java design pattern interview questions. The observer
    pattern is based upon notification, there are two kinds of object Subject and
    Observer. Whenever there is a change in the subject''s state observer will receive
    a notification.


    ## 4. What is the difference between Strategy and State design Pattern in Java?


    This is an interesting Java design pattern interview question as both Strategy
    and State pattern has the same structure. If you look at the UML class diagram
    for both patterns, they look exactly the same, but their intent is totally different.


    The state design pattern is used to define and manage the state of an object,
    while the Strategy pattern is used to define a set of interchangeable algorithm,
    and let''s client choose one of them. So Strategy pattern is a client-driven pattern
    while Object can manage their state itself.


    ## 5. When to use the Composite design pattern in Java? Have you used it previously
    in your project?


    This design pattern question is asked on Java interview not just to check familiarity
    with the Composite pattern but also, whether a candidate has the real-life experience
    or not.


    The Composite pattern is also a core Java design pattern, which allows you to
    treat both whole and part object to treat similarly. Client code, which deals
    with a Composite or individual object, doesn''t differentiate between them, it
    is possible because the Composite class also implements the same interface as
    their individual part.


    One of the good examples of the Composite pattern from JDK is the JPanel class,
    which is both Component and Container. When the paint() method is called on JPanel,
    it internally called the paint() method of individual components and let them
    draw themselves. In the second part of this design pattern interview question,
    be truthful; if you have used, then say yes, otherwise say that you are familiar
    with the concept and used it on your own.


    ## 6. What is the Singleton pattern in Java?


    Singleton pattern in Java is a pattern that allows only one instance of Singleton
    class available in the whole application. java.lang.Runtime is a good example
    of a Singleton pattern in Java. There are lots of follow up questions on the Singleton
    pattern see 10 Java singleton interview question answers for those follow-ups.


    ## 7. Can you write thread-safe Singleton in Java?


    There are multiple ways to write thread-safe Singleton in Java, like by writing
    writing singleton using double-checked locking, by using static Singleton instance
    initialized during class loading. By the way, using Java enum to create thread-safe
    singleton is the most simple way.


    ## 8. When to use the Template method design pattern in Java?


    The Template pattern is another popular core Java design pattern interview question.
    I have seen it appear many times in real life project itself. the template pattern
    outlines an algorithm in the form of a template method and lets the subclass implement
    individual steps.


    The critical point to mention, while answering this question, is that the template
    method should be final so that the subclass can override and change the steps
    of the algorithm. Still, the same time individual steps should be abstract, so
    that child classes can implement them.


    ## 9. What is the advantage of the Factory pattern in Java? What is the advantage
    of using a static factory method to create an object?


    The Factory pattern in Java is a creation Java design pattern and a favorite on
    many Java interviews. Factory pattern used to create an object by providing static
    factory methods. There are many advantages of providing factory methods like caching
    immutable objects, easy to introduce new objects, etc. See What Factory pattern
    in Java and benefits for more details.


    ## 10. What is the difference between Decorator and Proxy pattern in Java?


    Another tricky Java design pattern question and trick here is that both Decorator
    and Proxy implements the interface of the Object they decorate or encapsulate.
    As I said, many Java design patterns can have similar or exactly the same structure,
    but they differ in their intent.


    The Decorator pattern is used to implement functionality on an already created
    object, while Proxy pattern is used for controlling access to an object.


    One more difference between Decorator and the Proxy design pattern is that the
    Decorator doesn''t create an object; instead, it gets the Object in its constructor,
    while Proxy actually creates objects. You can also read the Head First Analysis
    and Design to understand the difference between them.


    ## 11. When to use Setter and Constructor Injection in the Dependency Injection
    pattern?


    Use Setter injection to provide optional dependencies of an object while use Constructor
    injection to provide a mandatory dependency of an object, without which it cant
    work. This question is related to the Dependency Injection design pattern and
    mostly asked in the context of the Spring framework, which is now become a standard
    for developing Java application.


    Since Spring provides an IOC container, it also gives you a way to specify dependencies
    either by using setter methods or constructors. You can also take a look at my
    previous section on the same topic.


    ## 12. What is the difference between Factory and Abstract Factory in Java


    I have already answered this question in detail with my section with the same
    title. The main difference is that the Abstract Factory creates a factory while
    the Factory pattern creates objects. So both abstract the creation logic, but
    one abstract is for factory and the other for items.


    ## 13. When to use the Adapter pattern in Java? Have you used it before in your
    project?


    Use the Adapter pattern when you need to make two class works with incompatible
    interfaces. Adapter pattern can also be used to encapsulate third party code so
    that your application only depends upon Adapter, which can adapt itself when third
    party code changes or you moved to a different third party library.


    By the way, this Java design pattern question can also be asked by providing an
    actual scenario. You can further read Head First Design Pattern to learn more
    about the Adapter pattern and its real-world usage. The book is updated for Java
    8 as well, so you will learn new Java 8 ways to implement these old patterns.


    ## 14. Can you write code to implement a producer-consumer design pattern in Java?


    The Producer-consumer design pattern is a concurrency design pattern in Java,
    which can be implemented using multiple ways. If you are working in Java 5, then
    it''s better to use Concurrency until to implement producer-consumer pattern instead
    of plain wait and notify in Java. Here is an excellent example of implementing
    the producer-consumer problem using BlockingQueue in Java.


    ## 15. What is the Builder design pattern in Java? When do you use the Builder
    pattern?


    Builder pattern in Java is another creational pattern in Java and often asked
    in Java interviews because of its specific use when you need to build an object
    which requires multiple properties, some optional and some mandatory.

