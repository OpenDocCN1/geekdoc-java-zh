    # OBJECT ORIENTED PROGRAMMING INTERVIEW QUESTIONS


    Java is an object-oriented programming language and you will see a lot of object-oriented
    programming concept questions on Java interviews. The classic questions like the
    difference between an interface and abstract class are always there from the last
    couple of years more sophisticated questions based upon advanced design principles
    and patterns are also asked to check advanced OOP knowledge of the candidate.
    Object-oriented programming questions are more popular on Java interviews for
    1 to 3 years experienced programmers. It makes sense as well, as these are the
    programmers who must know the OOP basics like Abstraction, Inheritance, Composition,
    Class, Object, Interface, Encapsulation, etc.


    If you look for Java interview questions for 2 to 4 years experienced programmer,
    you will find lots of questions based upon OOP fundamentals like Inheritance and
    Encapsulation but as you gain more experience, you will see questions based on
    object-oriented analysis and design e.g. code a vending design machine or implement
    a coffeemaker in Java.


    These questions are more difficult and require not only a true understanding of
    OOP fundamentals but also about SOLID design principles and patterns.


    In this section, I am going to share with you some OOPS concept based Java interview
    questions that I have collected from friends and colleagues and they have seen
    in various Java interviews on different companies. They are mostly asked at first
    a few rounds like on screening round or on the telephonic round.


    If you are a senior Java developer then you already know answers to this question
    and I suggest you practice more on object-oriented analysis and design skill i.e.
    how to do code against a specification. If you are fresher and junior Java developer
    with 2 to 3 years experience then you must revise these questions, learn if you
    don''t know to do well on your Java Job interviews.


    # What is method overloading in OOP or Java?


    It''s one of the oldest OOPS concept questions, I have seen it in 10 years ago
    and still sees it now. When we have multiple methods with the same name but different
    functionality then it''s called method overloading. For example. System.out.println()
    is overloaded as we have a 6 or 7 println() method each accepting a different
    type of parameter.


    # What is the method overriding in OOP or Java?


    It''s one of the magic of object-oriented programming where the method is chose
    based upon an object at runtime. In order for method overriding, we need Inheritance
    and Polymorphism, as we need a method with the same signature in both superclass
    and subclass. A call to such a method is resolved at runtime depending upon the
    actual object and not the type of variable.


    # What is the method of hiding in Java?


    When you declare two static methods with same name and signature in both superclass
    and subclass then they hide each other i.e. a call to the method in the subclass
    will call the static method declared in that class and a call to the same method
    in superclass is resolved to the static method declared in the super-class.


    # Is Java a pure object-oriented language? if not why?


    Java is not a pure object-oriented programming language e.g. there are many things
    you can do without objects e.g. static methods. Also, primitive variables are
    not objects in Java.


    # What are the rules of method overloading and overriding in Java?


    One of the most important rules of method overloading in Java is that the method
    signature should be different i.e. either the number of arguments or the type
    of arguments. Simply changing the return type of two methods will not result in
    overloading, instead, the compiler will throw an error. On the other hand, method
    overriding has more rules e.g. name and return type must be the same, method signature
    should also be the same, the overloaded method cannot throw a higher exception,
    etc.


    # The difference between method overloading and overriding?


    Several differences but the most important one is that method overloading is resolved
    at compile-time and method overriding is resolved at runtime. The compiler only
    used the class information for method overloading, but it needs to know the object
    to resolved overridden method calls. This diagram explains the difference quite
    well, though:


    ![](img/1c06a0c37d4c0b23574c3d3cd48ab57f_13_0.png)


    ## Can we overload all static method in Java?


    Yes, you can overload a static method in Java. You can declare as many static
    methods of the same name as you wish provided all of them have different method
    signatures.


    ## Can we override the static method in Java?


    No, you cannot override a static method because it''s not bounded to an object.
    Instead, static methods belong to a class and resolved at compile time using the
    type of reference variable. But, Yes, you can declare the same static method in
    a subclass, that will result in method hiding i.e. if you use the reference variable
    of type subclass then new method will be called, but if you use the reference
    variable of superclass than old method will be called.


    ## Can we prevent overriding a method without using the final modifier?


    Yes, you can prevent the method overriding in Java without using the final modifier.
    In fact, there are several ways to accomplish it e.g. you can mark the method
    private or static, those cannot be overridden.


    ## Can we override a private method in Java?


    No, you cannot. the private method is only accessible and visible inside the class
    they are declared, it''s not possible to override them in subclasses. Though,
    you can override them inside the inner class as they are accessible.


    # What is the covariant method overriding in Java?


    In the covariant method overriding, the overriding method can return the subclass
    of the object returned by the original or overridden method. This concept was
    introduced in Java 1.5 (Tiger) version and it''s very helpful in case the original
    method is returning general type like Object class, because then by using the
    covariant method overriding you can return a more suitable object and prevent
    client-side typecasting. One of the practical use of this concept is when you
    override the clone() method in Java.


    # Can we change the return type of method to subclass while overriding?


    Yes, you can, but only from Java 5 onward. This feature is known as covariant
    method overriding and it was introduced in JDK 5 release. This is immensely helpful
    if the original method return super-class like clone() method return java.lang.Object.
    By using this, you can directly return the actual type, preventing client-side
    type-casting of the result.


    # Can we change the argument list of an overriding method?


    No, you cannot. The argument list is part of the method signature and both overriding
    and overridden methods must have the same signature.


    # Can we override a method that throws runtime exception without throws clause?


    Yes, there is no restriction on unchecked exceptions while overriding. On the
    other hand, in the case of checked exception, an overriding method cannot throw
    a checked exception which comes higher in type hierarchy e.g. if the original
    method is throwing IOException.lang.Exception or the overriding method cannot
    throw java.lang.Throwable.


    # How do you call a superclass version of an overriding method in a subclass?


    You can call a superclass version of an overriding method in the subclass using
    super keyword. For example to call the toString() method from java.lang.Object
    class, you can call super.toString().


    # Can we override a non-static method as static in Java?


    Yes, you can override the non-static method in Java, no problem on them but it
    should not be private final.


    # Can we override the final method in Java?


    No, you cannot override a final method in Java, the final keyword with the method
    is to prevent overriding due to security reasons. This is why the String class
    is final in Java. This concept is also used in the template design patterns where
    the template method is made final to prevent overriding.


    # Can we have a non-abstract method inside an interface?


    From Java 8 onward you can have a non-abstract method inside interface, prior
    to that it was not allowed as all method was implicitly public abstract. From
    JDK 8, you can add static and default methods inside an interface.


    # What is the default method of Java 8?


    The default method, also known as the extension method is new types of the method
    which you can add on the interface now. These method has implementation and is
    intended to be used by default. By using this method, JDK 8 managed to provide
    common functionality related to lambda expression and stream API without breaking
    all the clients implement their interfaces. If you look at Java 8 API documentation
    you will find several useful default methods on key Java interface like Iterator,
    Map, etc.

    '
