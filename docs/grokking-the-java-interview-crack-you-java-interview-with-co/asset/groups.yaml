    ## 14. 你可以将数组转换为 Stream 吗？怎么做？


    是的，在 Java 中可以将数组转换为 Stream。Stream 类提供了一个工厂方法从数组创建 Stream，例如 `Stream.of(T ...)`，它接受可变参数，这意味着你也可以像示例所示将数组传递给它：


    ```

    String[] languages = {"Java", "Python", "JavaScript"};

    Stream numbers = Stream.of(languages);

    numbers.forEach(System.out::println);


    Output:

    Java

    Python

    JavaScript

    ```


    ## 15. 什么是并行流（parallel Stream）？如何从 List 获取并行流？


    并行流可以并行执行流处理任务。例如，如果你有一个包含 100 万订单的并行流，并且正在寻找价值超过 100 万的订单，你可以使用 `filter` 来来实现。


    与顺序 Stream 不同，并行流可以启动多个线程在 Stream 的不同部分搜索这些订单，然后合并结果。


    简而言之，并行流可以并行化执行，但正如 Cay S. Horstman 在《给急躁者的 Core Java S.E. 9》中所提到的，并行存在显著的开销，只有当你进行大量数据操作时它才划算。


    以上就是一些基于 Java 8 Stream 和函数式编程概念的常见面试面试题。由于 Java 8 现在是编写 Java 代码的现代方式，越来越多的公司正在寻找具备良好
    Java 8 技能的 Java 开发者。


