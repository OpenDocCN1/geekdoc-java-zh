    ## 37) Difference between Comparator and Comparable in Java?


    This is one more basic concept, I expect every Java candidate to know. You will
    deal with them on every Java project. Several core classes in Java e.g. String,
    Integer implements Comparable to define their natural sorting order and if you
    define a value class or a domain object then you should also implement Comparable
    and define natural ordering of your object. Main difference between these two
    is that, you could create multiple Comparator to define multiple sorting order
    based upon different attribute of object. Also, in order to implement Comparable
    you must have access of the class or code, but you can use Comparator without
    having source code of class, all you need is the JAR file of particular object.
    That''s why Comparator is very powerful to implement custom sorting order and
    from Java 8 you can do it even more elegantly, as seen here.


    ## 38) How do you sort ArrayList in descending order?


    You can use Collections.sort() method with reverse Comparator, which can sort
    elements in the reverse order of their natural order e.g.


    ```java

    List<String> listOf = Arrays.asList("London", "Tokyo", "NewYork"); Collections.sort(listOf,
    Collections.reverseOrder()); System.out.println(listOf); //[Tokyo, New York, London]

    ```


    ## 39) What is the difference between PATH and CLSPATH in Java?


    PATH is an environment variable which points to Java binary which is used to run
    Java programs. CLSPATH is another environment variable which points to Java class
    files or JAR files. If a class is not found in CLSPATH then Java throws ClassNotFoundException.


    ## 40) What is the difference between Checked and Unchecked Exception in Java?


    Checked exception ensures that handling of the exception is provided and its verified
    by compiler also, while for throwing unchecked exception no special provision
    is needed e.g. throws clause. A method can throw unchecked exceptions without
    any throw clause.


