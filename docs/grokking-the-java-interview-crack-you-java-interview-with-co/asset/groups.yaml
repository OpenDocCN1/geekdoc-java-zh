    \ Suppose you are traversing a List and removing only certain elements based on\
    \ logic, then you need to use Iterator's remove() method. This method removes\
    \ current element from Iterator's perspective. If you use Collection's or List's\
    \ remove() method during iteration then your code will throw ConcurrentModificationException.\
    \ That's why it's advised to use Iterator remove() method to remove objects from\
    \ Collection.\n\n# 5. What is the difference between Synchronized Collection and\
    \ Concurrent Collection?\n\nJava 5 has added several new Concurrent Collection\
