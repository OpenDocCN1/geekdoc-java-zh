    **Make Connection:** Next step is to get connection from the database using connection
    object, which is used to send SQL statement also and get result back from the
    database.


    **Get Statement Object:** From connection object we can get statement object which
    is used to query the database.


    **Execute the Query:** Using statement object we execute the SQL or database query
    and get result set from the query.


    **Close the connection:** After getting resultset and all required operation performed,
    the last step should be closing the database connection.


    ## Question 3: What is the mean of “dirty read“ in database?


    Answer: This kind of JDBC interview question is asked on 2 to 4 years experience
    Java programmers, they are expected to be familiar with database transaction and
    isolation level etc. As the name says, it conveys the meaning of dirty read: “read
    the value which may or not be correct”. In database, when one transaction is executing
    and changing some field value at the same time some another transaction comes
    and reads the changed field value before the first transaction commit or rollback
    the value, which causes an invalid value for that field, this scenario is known
    as dirty read.


    ## Question 4: What is the 2 phase commit?


    Answer: This is one of the most popular JDBC Interview questions and asked at
    advanced level, mostly to senior Java developers on J2EE interviews. Two phase
    commit is used in distributed environment where multiple processes take part in
    distributed transaction process. In simple words, we can understand it like if
    any transaction is executing and it will affect multiple databases, then two phase
    commit will be used to make all databases synchronized with each other.


    In two phase commit, commit or rollback is done by two phases:


    - 1. Commit request phase: in this phase the main process or coordinator process
    takes vote of all other processes that they have completed their process successfully
    and are ready to commit; if all the votes are “yes” then they go ahead for the
    next phase. And if “No “ then rollback is performed.

    - 2. Commit phase: according to vote, if all the votes are yes then commit is
    done.


    Similarly, when any transaction changes multiple databases after execution of
    transaction it will issue pre-commit command on each database and all databases
    send acknowledgement and according to acknowledgement if all are positive the
    transaction will issue the commit command, otherwise rollback is done.


    ## Question 5: What are different types of Statement?


    Answer: This is another classical JDBC interview question. Variants are Difference
    between Statement, PreparedStatement and CallableStatement in Java. Statement
    object is used to send SQL query to database and get result from database, and
    we get the statement object from connection object.


    There are three types of statement:


    - 1. Statement: it''s commonly used for getting data from database, useful when
    we are using static SQL statement at runtime, it will not accept any parameter.


    ```java

    Statement stmt = conn.createStatement();

    ResultSet rs = stmt.executeQuery();

    ```


    - 2. PreparedStatement: when we are using the same SQL statement multiple times
    it is useful and it will accept parameters at runtime.


    ```java

    String SQL = "Update stock SET limit = ? WHERE stockType = ?";

    PreparedStatement pstmt = conn.prepareStatement(SQL);

    ResultSet rs = pstmt.executeQuery();

    ```


    - 3. Callable Statement: when we want to access stored procedures then callable
    statements are useful and they also accept runtime parameters. It is called like
    this:


    ```java

    CallableStatement cs = con.prepareCall("{call SHOW_SUPPLIERS()}");

    ResultSet rs = cs.executeQuery();

    ```


    ## Question 6: How cursor works in scrollable result set?


    Answer: Another tough JDBC Interview question, not many Java programmers know
    about using Cursor in Java.


    In JDBC 2.0 API a new feature is added to move cursor in resultset backward, forward
    and also in a particular row.


    There are three constants define in result set by which we can move cursor:


    - **TYPE_FORWARD_ONLY**: creates a non-scrollable result set, that is, one in
    which the cursor moves only forward.

    - **TYPE_SCROLL_INSENSITIVE**: a scrollable result set does not reflect changes
    that are made to it while it is open

    - **TYPE_SCROLL_SENSITIVE**: a scrollable result set reflects changes that are
    made to it while it is open.


    ## Question 7: What is connection pooling?


    Answer: This is also one of the most popular questions asked during JDBC Interviews.
    Connection pooling is the mechanism by which we reuse the resource connection
    objects which are needed to make connection with database. In this mechanism clients
    are not required to make connection every time and then interact with database;
    instead of that connection objects are stored in connection pool and client will
    get it from there. so it''s a best way to share server resources among the clients
    and enhance the application performance. If you use Spring framework, then you
    can also refer How to setup JDBC Connection Pool using Spring in Java.


    ## Question 8: What do you mean by cold backup, hot backup?


    Answer: This question is not directly related to JDBC but some time asked in JDBC
    interviews. The cold backup is the backup technique in which backup of files are
    taken before the database restarted. In hot backup, files and table are taken
    at the same time when database is running. A warm backup is a technique where
    the database is still running.


    ## Question 9: What are the locking system in JDBC?


    Answer: One more tough question to understand. There are 2 types of locking in
    JDBC by which we can handle:


    Optimistic locking: optimistic locking does not use exclusive locks when reading
    update.

    Pessimistic locking: pessimistic locking locks the record only when reading.


    ## Question 10: Does the JDBC-ODBC Bridge support multiple open statements?


    Answer: No, we can open only one Statement per connection using JDBC-ODBC Bridge.

