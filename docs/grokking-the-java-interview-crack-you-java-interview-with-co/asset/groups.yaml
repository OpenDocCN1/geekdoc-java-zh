    ## 18) 什么是 CopyOnWriteArrayList，它与 ArrayList 和 Vector 有什么区别？


    答案：CopyOnWriteArrayList 是 Java 1.5 中引入的一种新的 List 实现，提供了比 Synchronized List 更好的并发访问能力。实现更好的并发性是通过在每次写入时都复制
    ArrayList 并用替换原始对象来实现的，而不是使用锁。此外，CopyOnWriteArrayList 不抛出任何 `ConcurrentModificationException`。它与
    ArrayList 的区别在于它是线程安全的，而 ArrayList 不是线程安全的；在并发性方面，它与 Vector 也不同。CopyOnWriteArrayList
    通过减少读写者之间的竞争提供了更好的并发性。下面有一张比较 Java 中三种常用 List 实现（ArrayList、LinkedList 和 CopyOnWriteArrayList）性能的表格：


    | | add | remove | get | contains |

    |---|---|---|---|---|

    | ArrayList | O(1) | O(n) | O(1) | O(n) |

    | LinkedList | O(1) | O(1) | O(n) | O(n) |

    | CopyOnWriteArrayList | O(n) | O(n) | O(1) | O(n) |


    ## 19) 为什么 ListIterator 有 add() 方法而 Iterator 没有？或者为什么 add() 方法是声明在 ListIterator
    中而不是 Iterator 中。


    ListIterator 拥有 `add()` 方法是因为它能够在集合的两个方向上进行遍历或迭代。它在调用上一个和下一个元素时维护了两个指针，并且可以在不影响当前迭代的情况下添加新元素。


    ## 20) 迭代时何时会发生 ConcurrentModificationException？


    当你使用 Collection 或 List 的 `remove` 方法（例如 `remove(Object element)` 或 `remove(int
    index)`）删除对象，而不是使用 Iterator 的 `remove()` 方法时，就会发生 `ConcurrentModificationException`。根据
    Iterator 的合约，如果它检测到集合发生了结构性变化（例如添加或删除元素），一旦迭代开始，就会抛出 `ConcurrentModificationException`。以下是一些在
    Java 中避免 `ConcurrentModificationException` 的提示。


    ### Java 中的 ConcurrentModificationException


    - 1. 如果两个线程尝试同时修改同一个列表，例如：一个线程正在遍历它并从中删除元素。

    - 2. 但更常见的情况是，当你在遍历列表时使用了 ArrayList 的 `remove()` 方法。

    - 3. 遍历时，始终使用迭代器的 `remove()` 方法来删除元素。

    - 4. 不要在使用增强型 `for` 循环遍历 ArrayList 时删除元素，因为它没有暴露迭代器的 `remove` 方法，但如果你使用 ArrayList
    的 `remove()` 方法进行删除，将抛出 `ConcurrentModificationException`。


    ## 21) Set、List 和 Map 集合类之间的区别？


    `java.util.Set`、`java.util.List` 和 `java.util.Map` 定义了 Java 中三种常用的数据结构。Set 提供了唯一性保证，即你不能为其存储重复元素，它是无序的。相反，List
    是有序的集合并且允许重复元素。Map 基于哈希，并将键和值存储在一个名为 `entry` 的对象中。如果你知道键且没有发生冲突，它获取获取对象的性能为 `O(1)`。Set
    的常用实现是 HashSet，List 有 ArrayList 和 LinkedList，Map 有 HashMap、Hashtable 和 ConcurrentHashMap。Set、List
    和 Map 的另一个主要区别是 Map 没有实现 `Collection` 接口，而另外两个都实现了。有关更详细的答案，请参见 Java 中的 Set vs
    List vs Map。


    | Collection | 重复元素 | 顺序 | 位置访问 | 性能 | 实现 | 实际场景用法 |

    | --- |---|---|---|---|---|---|

    | List | 是 | 有序 | 是 | ? | ArrayList, LinkedList | ? |

    | Set | 否 | 取决于实现 | 否 | ? | HashSet, LinkedHashSet, TreeSet | ? |

    | Map | 键重复 | ? | ? | ? | HashMap, LinkedHashMap, TreeMap | ? |


    ## 22) 什么是 BlockingQueue，它与其他集合类有什么区别？


    BlockingQueue 是 `java.util.concurrent` 包中的一种队列实现。它是 Java 1.5 添加的并发集合类之一，BlockingQueue
    与其他集合类的主要区别在于除了存储外，它还提供了流控。它可以用于线程间通信，并通过 `happens-before` 保证提供了内置的线程安全。你可以使用
    BlockingQueue 来解决生产者消费者问题，这是大多数并发应用程序所需要的。


