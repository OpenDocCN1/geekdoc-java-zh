    # 20) What is the difference between the interrupted() and isInterrupted() method
    in Java?


    Main difference between interrupted() and isInterrupted() is that former clears
    the interrupt status while later does not. The interrupt mechanism in Java multi-threading
    is implemented using an internal flag known as the interrupt status. Interrupting
    a thread by calling Thread.interrupt() sets this flag. When interrupted thread
    checks for an interrupt by invoking the static method Thread.interrupted(), interrupt
    status is cleared. The nonstatic isInterrupted() method, which is used by one
    thread to query the interrupt status of another, does not change the interrupt
    status flag. By convention, any method that exits by throwing an InterruptedException
    clears interrupt status when it does so. However, it''s always possible that interrupt
    status will immediately be set again, by another thread invoking interrupt.


    # 21) Why wait and notify method are called from synchronized block?


    Main reason for calling wait and notify method from either synchronized block
    or method is that it is mandatory by Java API. If you don''t call them from synchronized
    context, your code will throw IllegalMonitorStateException. A more subtle reason
    is to avoid the race condition between wait and notify calls.


    # 22) Why should you check condition for waiting in a loop?


    Its possible for a waiting thread to receive false alerts and spurious wake up
    calls, if it doesn''t check the waiting condition in loop, it will simply exit
    even if condition is not met. As such, when a waiting thread wakes up, it cannot
    assume that the state it was waiting for is still valid. It may have been valid
    in the past, but the state may have been changed after the notify() method was
    called and before the waiting thread woke up. That''s why always better to call
    wait() method for calling wait and notify in Eclipse. To learn more about this
    question, I would recommend you to read Effective Java items on thread and synchronization.


    # 23) What is the difference between synchronized and concurrent collection in
    Java?


    Though both synchronized and concurrent collection provides thread-safe collection
    for multi-threaded and concurrent access, later is more scalable than former.
    Before Java 1.5, Java programmers had only synchronized collection which becomes
    source of contention if multiple thread access them concurrently, which hampers
    scalability of system. Java 5 introduced concurrent collections like ConcurrentHashMap,
    which not only provides thread-safety but also improves scalability by using modern
    techniques like lock stripping and partitioning internal table.


    # 24) What is the difference between Stack and Heap in Java?


    Why does someone ask this question as part of multithreading and concurrency?
    because Stack is a memory area which is closely associated with threads. To answer
    this question, both stack and heap are specific memories in Java application.
    Each thread has its own stack, which is used to store local variables, method
    parameters and call stack. Variable stored in one Thread''s stack is not visible
    to other. On another hand, the heap is a common memory area which is shared by
    all threads. Objects whether local or at any level are created inside heap. To
    improve performance thread tends to cache values from heap into their stack, which
    can create problems if that variable is modified by more than one thread, this
    is where volatile variables come into the picture. volatile suggest threads read
    the value of variable always from main memory.


    # 25) What is thread pool? Why should you thread pool in Java?


    Creating thread is expensive in terms of time and resource. If you create thread
    at time of request processing it will slow down your response time, also there
    is only a limited number of threads a process can create. To avoid both of these
    issues, a pool of thread is created when application starts-up and threads are
    reused for request processing. This pool of thread is known as "thread pool" and
    threads are known as worker thread. From JDK 1.5 release, Java API provides Executor
    framework, which allows you to create different types of thread pools e.g. single
    thread pool, which process one task at a time, fixed thread pool (a pool of fixed
    number of threads) or cached thread pool (expandable thread pool suitable for
    applications with many short lived tasks).


    # 26) Write code to solve Producer Consumer problem in Java?


    Most of the threading problem you solved in the real world are of the category
    of Producer consumer pattern, where one thread is producing task and another thread
    is consuming that. You must know how to do inter thread communication to solve
    this problem. At the lowest level, you can use wait and notify to solve this problem,
    and at a high level, you can leverage Semaphore or BlockingQueue to implement
    Producer consumer pattern.


    # 27) How do you avoid deadlock in Java? Write Code?


    Deadlock is a condition in which two threads wait for each other to take action
    which allows them to move further. It’s a serious issue because when it happen
    your program hangs and doesn’t do the task it is intended for. In order for deadlock
    to happen, following four conditions must be true:


    - Mutual Exclusion: At least one resource must be held in a non-shareable mode.
    Only one process can use the resource at any given instant of time.

    - Hold and Wait: A process is currently holding, at least, one resource and requesting
    additional resources which are being held by other processes.

    - No Pre-emption: The operating system must not de-allocate resources once they
    have been allocated; they must be released by the holding process voluntarily.

    - Circular Wait: A process must be waiting for a resource which is being held
    by another process, which in turn is waiting for the first process to release
    the resource.


    The easiest way to avoid deadlock is to prevent Circular wait, and this can be
    done by acquiring locks in a particular order and releasing them in reverse order
    so that a thread can only proceed to acquire a lock if it held the other one.


    # 28) What is the difference between livelock and deadlock in Java?


    This question is extension of previous interview question. A livelock is similar
    to a deadlock, except that the states of the threads or processes involved in
    the livelock constantly change with regard to another, without any one progressing
    further. Livelock is a special case of resource starvation. A real-world example
    of livelock occurs when two people meet in a narrow corridor, and each tries to
    be polite by moving aside to let the other pass, but they end up swaying from
    side to side without making any progress because both repeatedly move the same
    way at the same time. In short, the main difference between deadlock and deadlock
    is that in former state of process change but no progress is made.


    # 29) How do you check if a Thread holds a lock or not?


    I didn''t even know that you can check if a Thread already holds lock before this
    question hits me in a telephonic round of Java interview. There is a method called
    holdsLock() on java.lang.Thread, it returns true if and only if the current thread
    holds the monitor lock on the specified object.


    # 30) How do you take thread dump in Java?


    There are multiple ways to take thread dump of Java process depending upon operating
    system. When you take thread dump, JVM dumps state of all threads in log files
    or standard error console. In windows you can use Ctrl + Break key combination
    to take thread dump, on Linux you can use kill -3 command for same. You can also
    use a tool called jstack for taking thread dump, it operate on process id, which
    can be found using another tool called jps.


    # 31) Which JVM parameter is used to control stack size of a thread?


    This is the simple one, -Xss parameter is used to control stack size of Thread
    in Java. You can see this list of JVM options to learn more about this parameter.

