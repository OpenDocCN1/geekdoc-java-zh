    ## 32) What is the difference between synchronized and ReentrantLock in Java?


    There were days when the only way to provide mutual exclusion in Java was via
    synchronized keyword, but it has several shortcomings e.g. you can not extend
    lock beyond a method or block boundary, you can not give up trying for a lock
    etc. Java 5 solves this problem by providing more sophisticated control via Lock
    interface. ReentrantLock is a common implementation of Lock interface and provides
    re-entrant mutual exclusion Lock with the same basic behavior and semantics as
    implicit monitor lock accessed using synchronized methods and statements, but
    with extended capabilities.


    ## 33) There are three threads T1, T2, and T3? How do you ensure sequence T1,
    T2, T3 in Java?


    Sequencing in multi-threading can be achieved by different means but you can simply
    use the join() method of thread class to start a thread when another has finished
    its execution. To ensure three threads execute you need to start the last one
    e.g. T3 and then call join methods in reverse order e.g. T3 calls T2. join and
    T2 calls T1,join, these ways T1 will finish first and T3 will finish last.


    ## 34) What does yield method of Thread class do?


    Yield method is one way to request current thread to relinquish CPU so that other
    thread can get a chance to execute. Yield is a static method and only guarantees
    that current thread will relinquish the CPU but doesn''t say anything about which
    other thread will get CPU. Its possible for the same thread to get CPU back and
    start its execution again.


    ## 35) What is the concurrency level of ConcurrentHashMap in Java?


    ConcurrentHashMap achieves it''s scalability and thread-safety by partitioning
    actual map into a number of sections. This partitioning is achieved using concurrency
    level. Its optional parameter of ConcurrentHashMap constructor and it''s default
    value is 16. The table is partitioned to try to permit the indicated number of
    concurrent updates without contention.


    ## 36) What is Semaphore in Java?


    Semaphore in Java is a new kind of synchronizer. Conceptually, a semaphore maintains
    a set of permits. Each acquire() blocks if until a permit is available, and then
    takes it. Each release() adds a permit, potentially releasing blocking acquirer.
    However, no actual permit objects are used; the Semaphore keeps a count of the
    number available and acts accordingly. Semaphore is used to protect an expensive
    resource which is available in fixed number e.g. database connection in the pool.
    See this section to learn more about counting Semaphore in Java.


    ## 37) What happens if you submit a task when the queue of the thread pool is
    already filled?


    This is another tricky question on my list. Many programmers will think that it
    will block until a task is cleared its true. ThreadPoolExecutor’s submit() method
    throws RejectedExecutionException if the task cannot be scheduled for execution.


    ## 38) What is the difference between the submit() and execute() method thread
    pool in Java?


    Both methods are ways to submit a task to thread pools but there is a slight difference
    between them. execute(Runnable command) is defined in Executor interface and executes
    given task in future, but more importantly, it does not return anything. Its return
    type is void. On other hand submit() is an overloaded method, it can take either
    Runnable or Callable task and can return Future object which can hold the pending
    result of computation. This method is defined on ExecutorService interface, which
    extends Executor interface, and every other thread pool class e.g. ThreadPoolExecutor
    or ScheduledThreadPool gets these methods.


    ## 43) What is blocking method in Java?


    A blocking method is a method which blocks until the task is done, for example,
    accept() method of ServerSocket blocks until a client is connected. here blocking
    means control will not return to the caller until the task is finished. On the
    other hand, there is an asynchronous or non-blocking method which returns even
    before the task is finished.


    ## 40) Is Swing thread-safe? What do you mean by Swing thread-safe?


    You can simply this this question as No, Swing is not thread-safe, but you have
    to explain what you mean by even if the interviewer doesn''t ask about it. When
    we say swing is not thread-safe we usually refer its component, which can not
    be modified in multiple threads. All update to GUI components has to be done on
    AWT thread, and Swing provides synchronous and asynchronous callback methods to
    schedule such updates.


    ## 41) What is the difference between invokeAndWait and invokeLater in Java?


    These are two methods Swing API provides Java developers for updating GUI components
    other than Event dispatcher thread. InvokeAndWait() synchronously update GUI component,
    for example, a progress bar, once progress is made, the bar should also be updated
    to reflect that change. If progress is tracked in a different thread, it has to
    call invokeAndWait() to schedule an update of that component by Event dispatcher
    thread. On another hand, invokeLater() is an asynchronous call to update components.


    ## 42) Which method of Swing API are thread-safe in Java?


    This question is again related to swing and thread-safety though components are
    not thread-safe there is a certain method which can be safely called from multiple
    threads. I know about repaint(), and revalidate() being thread-safe but there
    are other methods on different swing components e.g. setText() method of JTextComponent,
    insert() and append() method of JTextArea class.


    ## 43) How to create an Immutable object in Java?


    This question might not look related to multi-threading and concurrency, but it
    is it. Immutability helps to simplify already complex concurrent code in Java.
    Since immutable object can be shared without any synchronization its very dear
    to Java developers. Core value object, which is meant to be immutable for performance
    and simplicity. Unfortunately there is no @Immutable annotation in Java, which
    can make your object immutable, hard work must be done by Java developers. You
    need to keep basics like initializing state in constructor, no setter methods,
    no leaking of reference, keeping separate copy of mutable object to create Immutable
    object.


    ## 44) What is ReadWriteLock in Java?


    In general, read write lock is the result of lock stripping technique to improve
    the performance of concurrent applications. In Java, ReadWriteLock is an interface
    which was added in Java 5 release. A ReadWriteLock maintains a pair of associated
    locks, one for read-only operations and one for writing. The read lock may be
    held simultaneously by multiple reader threads, so long as there are no writers.
    The write lock is exclusive. If you want to implement this interface with your
    own set of rules, otherwise you can use ReentrantReadWriteLock, which comes along
    with JDK and supports a maximum of 65535 recursive write locks and 65535 read
    locks.


    ## 45) What is busy spin in multi-threading?


    Busy spin is a technique which concurrent programmers employ to make a thread
    wait on certain condition. Unlike traditional methods e.g. wait(), sleep() or
    yield() which all involves relinquishing CPU control, instead it just runs empty
    loop. Why would someone do that? to preserve CPU caches. In a multi-core system,
    it''s possible for a paused thread to resume on a different core, which means
    rebuilding cache again. To avoid cost of rebuilding cache, programmer prefer to
    wait for much smaller time doing busy spin.


    ## 46) What is the difference between the volatile and atomic variable in Java?


    This is an interesting question for Java programmer, at first volatile and atomic
    variable look very similar, but they are different. Volatile variable provides
    you that happens-before guarantee that a write will happen before any subsequent
    write, it doesn''t guarantee atomicity. For example count++ operation will not
    become atomic just declaring count variable as volatile. On the other hand AtomicInteger
    class provides atomic method to perform such compound atomically e.g. getAndIncrement()
    is atomic replacement of increment operator. Similarly you have atomic version
    for other data type and reference variable as well.

