    # 20) Java 中 interrupted() 方法和 isInterrupted() 方法有什么区别？


    `interrupted()` 和 `isInterrupted()` 之间的主要区别在于前者会清除中断状态，而后者不会。Java 多线程中的中断机制是使用一个名为“中断状态”（interrupt
    status）的内部标志实现的。通过调用 `Thread.interrupt()` 中断线程会设置此标志。当被中断的线程通过调用静态方法 `Thread.interrupted()`
    检查中断时，中断状态会被清除。非静态的 `isInterrupted()` 方法用于一个线程查询另一个线程的中断状态，它不会改变中断状态标志。按照惯例，任何通过抛出
    `InterruptedException` 退出的方法在这样做时都会清除中断状态。然而，始终可能通过另一个线程调用 interrupt 导致中断状态立即被再次设置。


    # 21) 为什么 wait 和 notify 方法要在 synchronized 块（同步块）中调用？


    在同步块或同步方法中调用 `wait` 和 `notify` 方法的主要原因是这是 Java API 的强制性规定。如果你没有在同步上下文中调用它们，你的代码将抛出
    `IllegalMonitorStateException`。更微妙的原因是避免 `wait` 和 `notify` 调用之间的竞态条件。


    # 22) 为什么你应该在循环中检查等待条件？


    如果等待线程没有在循环中检查等待条件，可能会接收到虚假通知和虚假唤醒调用（spurious wake up），即使条件不满足，它也会直接退出。因此，当等待线程唤醒时，它不能假设它正在等待的状态仍然有效。状态在过去可能是有效的，但在调用
    `notify()` 方法之后到等待线程唤醒之前，状态可能已经发生了变化。这就是为什么在 Eclipse 中调用 `wait` 和 `notify` 时，最好总是调用
    `wait()` 方法。要了解更多此类，我建议你阅读《Effective Java》关于线程和同步的章节。


    # 23) Java 中同步集合（synchronized collection）和并发集合（concurrent collection）有什么区别？


    虽然同步集合和并发集合都为多线程和并发访问提供了线程安全的集合，但后者的可扩展性高于前者。在 Java 1.5 之前，Java 程序员只有同步集合可用，当多个线程并发访问它们时，它们会成为竞争源，从而阻碍了系统的扩展性。Java
    5 引入了并发集合，如 `ConcurrentHashMap`，它不仅提供了线程安全性，还通过使用锁分段（lock stripping）和内部表分区等现代技术提高了了可扩展性。


    # 24) Java 中栈（Stack）和堆（Heap）有什么区别？


    为什么有人会在多线程和并发面试中问这个问题？因为栈是与线程紧密关联的内存区域。回答这个问题，栈和堆都是 Java 应用程序中的特定内存。每个线程都有自己的栈，用于存储局部变量、方法参数和调用栈。存储在一个线程栈中的变量对其他线程是不可见的。另一方面，堆是所有线程共享的公共内存区域。对象（无论是局部对象还是任何层级的对象）都创建在堆内部。为了提高性能，线程倾向于将值从堆中缓存到自己的栈中，如果该变量被多个线程修改，就会产生问题，这正是
    `volatile` 变量派上用场的地方。`volatile` 建议线程始终从主内存读取变量的值。


    # 25) 什么是线程池？为什么在 Java 中你应该使用线程池？


    创建线程在时间和资源方面都是昂贵的。如果你在处理请求时才创建线程，将减慢你的响应时间，而且进程可以创建的线程数量是有限的。为了避免这些问题，在应用程序启动时创建一个线程池，并复用线程来处理请求。这个线程池被称为“线程池”，线程被称为“工作线程”。从
    JDK 1.5 发布开始，Java API 提供了 `Executor` 框架，它允许你创建不同类型的线程池，例如：单线程池（一次处理一个任务）、固定线程池（固定数量线程的池）或缓存线程池（适用于具有许多短命任务的可扩展线程池）。


    # 26) 编写代码解决 Java 中的生产者-消费者问题？


    你在现实世界中解决的大多数线程问题都属于生产者-消费者模式，其中一个线程生产任务，另一个线程消费该任务。你必须知道如何进行线程间通信来解决这个问题。在最低层面，你可以使用
    `wait` 和 `notify` 来解决这个问题；在高级层面，你可以利用 `Semaphore` 或 `BlockingQueue` 来实现生产者-消费者模式。


    # 27) 如何在 Java 中避免死锁？编写代码？


    死锁是一种两个线程互相等待对方采取行动以便自己能够继续移动的状态。这是一个严重的问题，因为当它发生时，你的程序会挂起且不执行预定任务。为了使死锁发生，必须同时满足以下四个条件：


    - 互斥（Mutual Exclusion）：至少一个资源必须以非共享模式持有。在任何给定时刻，只能有一个进程使用该资源。

    - 持有等待（Hold and Wait）：一个进程当前持有至少一个资源，并请求正由其他进程持有的额外资源。

    - 非抢夺（No Pre-emption）：操作系统一旦分配了资源就不能撤回资源；它们必须由持有进程自愿释放。

    - 循环等待（Circular Wait）：一个进程必须等待一个由另一个进程持有的资源，而该进程反过来又等待第一个进程释放资源。


    避免死锁最简单的方法是防止循环等待，这可以通过按照特定顺序获取锁并按反顺序释放锁来实现，这样线程只有在持有了另一个锁的情况下，才能继续获取某一个锁。


    # 28) Java 中活锁（livelock）和死锁（deadlock）有什么区别？


    这个问题是上一个面试问题的扩展。活锁类似于死锁，不同在于参与活锁的线程或进程的状态相对于彼此不断变化，但没有哪一个取得进一步的进展。活锁是资源饥饿（resource
    starvation）的一种特殊情况。活锁的一个现实例子是两个人在窄走廊里相遇，每个人都试图礼貌地侧身让对方通过，但他们最终只是左右摇动，由于他们反复同时向同一个方向移动而没有取得任何进展。简而言之，死锁和活锁的主要区别在于，在后者状态中进程发生了变化但没有产生进展。


    # 29) 如何检查一个线程是否持有锁？


    在这个问题出现在我的 Java 面试电话轮之前，我甚至不知道可以检查一个线程是否持有锁。`java.lang.Thread` 上有一个名为 `holdsLock()`
    的方法，当且仅当当前线程持有指定对象的显示器锁时，该方法返回 `true`。


    '
