    activities and memory status of JVM or you can redirect Garbage collection output
    to a log file for offline analysis by using -XLogGC=<PATH> JVM parameter. Anyway
    you should always enable GC options like -XX:PrintGCDDetails -X:verboseGC -XX:PrintGCTimeamps
    as it doesn''t impact application performance much but provide useful states for
    performance monitoring.


