    ## 18) What is CopyOnWriteArrayList, how it is different than ArrayList and Vector?


    Answer: CopyOnWriteArrayList is a new List implementation introduced in Java 1.5
    which provides better concurrent access than Synchronized List. better concurrency
    is achieved by Copying ArrayList over each write and replace with original instead
    of locking. Also CopyOnWriteArrayList doesn''t throw any ConcurrentModification
    Exception. Its different than ArrayList because its'' thread-safe and ArrayList
    is not thread-safe and it''s different than Vector in terms of Concurrency. CopyOnWriteArrayList
    provides better Concurrency by reducing contention among readers and writers.
    Here is a nice table which compares performance of three of popular List implementation
    ArrayList, LinkedList and CopyOnWriteArrayList in Java:


    | | add | remove | get | contains |

    |---|---|---|---|---|

    | ArrayList | O(1) | O(n) | O(1) | O(n) |

    | LinkedList | O(1) | O(1) | O(n) | O(n) |

    | CopyOnWriteArrayList | O(n) | O(n) | O(1) | O(n) |


    ## 19) Why ListIterator has added() method but Iterator doesn’t or Why to add()
    method is declared in ListIterator and not on Iterator.


    ListIterator has added() method because of its ability to traverse or iterate
    in both direction of the collection. it maintains two pointers in terms of previous
    and next call and in a position to add a new element without affecting current
    iteration.


    ## 20) When does ConcurrentModificationException occur on iteration?


    When you remove object using Collection’s or List’s remove method e.g. remove(Object
    element) or remove(int index), instead of Iterator’s remove() method than ConcurrentModificationException
    occurs. As per Iterator’s contract, if it detect any structural change in Collection
    e.g. adding or removing of the element, once Iterator begins, it can throw ConcurrentModificationException.
    Here are some tips to avoid ConcurrentModification in Java.


    ### ConcurrentModificationException in Java


    - 1. Can if two threads trying to modify one list at same time e.g. one Thread
    is iterating over it and is removing elements from it.

    - 2. But, more commonly, it also comes when you use ArrayList’s remove() method
    while iterating over List.

    - 3. Always use iterator’s remove() method to delete elements while traversing.

    - 4. Don’t delete elements when looping over ArrayList advanced for loop, because
    it doesn’t expose iterator’s remove method, but will throw ConcurrentModificationException
    if you delete using ArrayList’s remove() method.


    ## 21) Difference between Set, List and Map Collection classes?


    java.util.Set, java.util.List and java.util.Map defines three of most popular
    data structure support in Java. Set provides uniqueness guarantee i.e you can
    not store duplicate elements on it, it''s not ordered. On the other hand List
    is an ordered Collection and also allows duplicates. Map is based on hashing and
    stores key and value in an Object called entry. It provides O(1) performance to
    get object, if you know keys, if there is no collision. Popular implement of Set
    is HashSet, of List is ArrayList and LinkedList, and of Map are HashMap, Hashtable
    and ConcurrentHashMap. Another key difference between Set, List and Map are that
    Map doesn''t implement Collection interface, while other two do. For a more detailed
    answer, see Set vs List vs Map in Java


    | Collection | Duplicates | Order | Positional Access | Performance | Implementation
    | Real Scenario Usage |

    | --- |---|---|---|---|---|---|

    | List | Yes | Ordered | Yes | ? | ArrayList, LinkedList | ? |

    | Set | No | Depends on Implementation | No | ? | HashSet, LinkedHashSet, TreeSet
    | ? |

    | Map | No duplicate keys | ? | ? | ? | HashMap, LinkedHashMap, TreeMap | ? |


    ## 22) What is BlockingQueue, how it is different than other collection classes?


    BlockingQueue is a Queue implementation available in java.util.concurrent package.
    It''s one of the concurrent Collection class added on Java 1.5, main difference
    between BlockingQueue and other collection classes that apart from storage, it
    also provides flow control. It can be used in inter-thread communication and also
    provides built-in thread-safety by using happens-before guarantee. You can use
    BlockingQueue to solve Producer Consumer problem, which is what is needed in most
    concurrent applications.


