    ## 32) Java 中 synchronized 和 ReentrantLock 有什么区别？


    在 Java 中，曾经几天提供互斥的唯一方法是通过 `synchronized` 关键字，但它有几个缺点，例如：你无法在方法或块边界之外扩展锁，你无法放弃获取锁等。Java
    5 通过通过 `Lock` 接口提供更细粒度的控制解决了这个问题。ReentrantLock 是 `Lock` 接口的一种常见实现，它提供了重入互斥锁，其与使用
    `synchronized` 方法和语句访问的隐式监器锁具有相同的基本行为和语义，但具有扩展的能力。


    ## 33) 有三个线程 T1、T2 和 T3？如何在 Java 中确保 T1, T2, T3 的执行顺序？


    多线程中的排序可以通过不同的方式实现，但你可以简单地使用线程类的 `join()` 方法，在一个线程执行完毕后启动另一个线程。为了确保三个线程顺序执行，你需要启动最后一个线程（例如
    T3），然后按反方向调用 `join` 方法（例如 T3 调用 T2 的 `join`，T2 调用 T1 的 `join`）。通过这些方式，T1 将先完成，T3
    将最后完成。


    ## 34) Thread 类的 yield 方法的作用是什么？


    `yield` 方法是请求当前线程放弃 CPU 的方式之一，以便其他线程获得执行的机会。`yield` 是一个静态方法，它只保证当前线程将放弃 CPU，但没有说明哪个其他线程将获得
    CPU。同一个线程可能会重新获得 CPU 并再次开始执行。


    ## 35) Java 中 ConcurrentHashMap 的并发级别（concurrency level）是多少？


    `ConcurrentHashMap` 通过将实际的 map 分为若干个段（sections）来实现其可扩展性和线程安全。这种分区是通过 `concurrency
    level` 实现的。它是 `ConcurrentHashMap` 构造函数的可选参数，默认值为 16。该表被分区，以尝试在不发生竞争的情况下允许指定数量的并发更新。


    ## 36) Java 中的 Semaphore（信号量）是什么？


    Java 中的信号量 是一种新的同步器。从概念上讲，信号量维护一组许可（permits）。每个 `acquire()` 都会阻塞直到有可用许可，然后获取它。每个
    `release()` 会增加一个许可，可能会释放被阻塞的获取者。然而，并没有使用实际的许可对象；`Semaphore` 维护可用数量的计数并据此操作。信号量用于保护固定数量的昂贵资源，例如池中的数据库连接。参见此节以了解更多关于
    Java 中计数信号量的知识。


    ## 37) 当线程池队列已满时提交任务会发生什么？


    这是我列表中的另一个棘手问题。许多程序员会认为它会阻塞直到任务被清除，但事实并非如此。如果任务无法被调度执行，`ThreadPoolExecutor` 的
    `submit()` 方法会抛出 `RejectedExecutionException`。


    ## 38) Java 线程池中 submit() 方法和 execute() 方法有什么区别？


    这两个方法都是向线程池提交任务的方式，但它们之间存在细微差别。`execute(Runnable command)` 定义在 `Executor` 接口中，并在未来执行给定任务，但更重要的是，它不返回任何内容。它的返回类型是
    `void`。另一方面，`submit()` 是一个重载方法，它可以接受 `Runnable` 或 `Callable` 任务，并可以返回 `Future`
    对象，该对象可以持有等待中的计算结果。此方法定义在 `ExecutorService` 接口上，该接口扩展了 `Executor` 接口，其他所有线程池类（如
    `ThreadPoolExecutor` 或 `ScheduledThreadPool`）都拥有这些方法。


    ## 43) 什么是 Java 中的阻塞方法？


    阻塞方法是一种在任务完成之前会一直保持阻塞的方法，例如，`ServerSocket` 的 `accept()` 方法会阻塞直到客户端连接。这里的阻塞意味着在任务完成之前，控制权不会返回给调用者。另一方面，还有异步或非阻塞方法，它们在任务完成之前就会返回。


    ## 40) Swing 是线程安全的吗？你说的 Swing 线程安全是什么意思？


    你可以简单地回答这个问题为“不，Swing 并不是线程安全的”，但即使面试官没有问及，你也必须解释你的意思。当我们说 Swing 不是线程安全的时，我们通常指的是它的组件，这些组件不能在多个线程中被修改。对
    GUI 组件的所有更新都必须在 AWT 线程上完成，而 Swing 提供了同步和异步回调方法来调度此类更新。


    ## 41) Java 中 invokeAndWait 和 invokeLater 有什么区别？


    这些是 Swing API 为 Java 开发者提供的用于在事件分发线程（Event dispatcher thread）之外更新 GUI 组件的方法。`invokeAndWait()`
    同步更新 GUI 组件，例如，一旦有了进度，进度条也应该更新以反映该变化。如果在一个不同的线程中跟踪进度，它必须调用 `invokeAndWait()` 来由事件分发线程调度该组件的更新。另一方面，`invokeLater()`
    是更新组件的异步调用。


    ## 42) Java 中 Swing API 的哪些方法是线程安全的？


    这个问题再次与 Swing 和线程安全有关，尽管组件不是线程安全的，但存在某些方法可以从多个线程中安全地调用。我知道 `repaint()` 和 `revalidate()`
    是线程安全的，但在不同的 Swing 组件上还有其他方法，例如 `JTextComponent` 的 `setText()` 方法，`JTextArea`
    类的 `insert()` 和 `append()` 方法。


    ## 43) 如何在 Java 中创建不可变对象（Immutable object）？


    这个问题看起来可能与多线程和并发无关，但实际上它们是相关的。不可变性有助于简化 Java 中已经复杂的并发代码。由于不可变对象可以在没有任何同步的情况下共享，因此它对
    Java 开发者非常重要。核心值对象（Core value object）的设计是为了性能和简单性，应该是不可变的。遗憾的是，Java 中没有 `@Immutable`
    注解可以使你的对象变为不可变，这必须由 Java 开发者手动完成。


    ## 44) Java 中的 ReadWriteLock 是什么？


    通常情况下，读写锁是提高并发应用程序性能的锁剥离技术。在 Java 中，`ReadWriteLock` 是在 Java 5 中引入的接口。`ReadWriteLock`
    维护一对关联锁，一个用于读操作，一个用于写入。只要没有写入者，多个线程可以同时持有读锁。写锁是互斥的。如果你想按照自己的规则实现此接口，可以使用内置的 `ReentrantReadWriteLock`，它支持最多
    65535 次递归写锁和 65535 次读锁。


    ## 45) 多线程中的什么是忙旋（busy spin）？


    并发程序员采用的一种技术，用于让线程等待某些条件。与传统的方法（例如 `wait()`、`sleep()` 或 `yield()`）涉及放弃 CPU 控制不同，它只是运行空循环。为什么要这样做？为了保护
    CPU 缓存。在多核系统中，挂起的线程可能会在不同的内核上恢复，这意味着要重新构建缓存。为了避免构建缓存的代价，程序员倾向于通过忙旋等待更短的时间。


    ## 46) Java 中 volatile 变量和原子变量（atomic variable）有什么区别？


    对于 Java 程序员来说这是一个有趣的问题，起初 volatile 和原子变量看起来非常相似，但它们是不同的。`volatile` 变量为你提供了“先行发生”（happens-before）的保证，即写入发生在任何后续写入之前，但它不保证原子性。例如，仅仅将
    `count` 变量声明为 `volatile` 并不会让 `count++` 操作变成原子性的。另一方面，`AtomicInteger` 类提供了原子方法来执行此类复合操作，例如
    `getAndIncrement()` 是自增运算符的原子替换。同样，对于其他数据类型和引用变量也有对应的原子版本。


