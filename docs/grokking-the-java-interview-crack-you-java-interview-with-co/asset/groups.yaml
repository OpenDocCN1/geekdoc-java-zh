    ## 48) What is double checked locking of Singleton?


    This is one of the very popular question on Java interviews, and despite its popularity,
    chances of candidate answering this question satisfactory is only 50%. Half of
    the time, they failed to write code for double checked locking and half of the
    time they failed how it was broken and fixed on Java 1.5. This is actually an
    old way of creating thread-safe singleton, which tries to optimize performance
    by only locking when Singleton instance is created first time, but because of
    complexity and the fact it was broken for JDK 1.4, I personally don''t like it.
    Anyway, even if you not prefer this approach it''s good to know from interview
    point of view.


    ## 49) How to create thread-safe Singleton in Java?


    This question is actually follow-up of the previous question. If you say you don''t
    like double checked locking then Interviewer is to ask about alternative ways
    of creating thread-safe Singleton class. There are actually a few ways, you can
    take advantage of class loading and static variable initialization feature of
    JVM to create instance of Singleton, or you can leverage powerful enumeration
    type in Java to create Singleton.


    ## 50) List down 3 multi-threading best practice you follow?


    This is my favorite question because I believe that you must follow certain best
    practices while writing concurrent code which helps in performance, debugging
    and maintenance. Following are three best practices, I think an average Java programmer
    should follow:


    - Always give meaningful name to your thread


    This goes a long way to find a bug or trace an execution in concurrent code. OrderProcessor,
    QuoteProcessor or TradeProcessor is much better than Thread-1. Thread-2 and Thread-3.
    The name should say about task done by that thread. All major framework and even
    JDK follow this best practice.


    - Avoid locking or Reduce scope of Synchronization


    Locking is costly and context switching is even costlier. Try to avoid synchronization
    and locking as much as possible and at a bare minimum, you should reduce critical
    section. That''s why I prefer synchronized block over synchronized method because
    it gives you absolute control on the scope of locking.


    - Prefer Synchronizers over wait and notify


    Synchronizers like CountDownLatch, Semaphore, CyclicBarrier or Exchanger simplify
    coding. It''s very difficult to implement complex control flow right using wait
    and notify. Secondly, these classes are written and maintained by best in business
    and there is good chance that they are optimized or replaced by better performance
    code in subsequent JDK releases. By using higher level synchronization utilities,
    you automatically get all these benefits.


    - Prefer Concurrent Collection over Synchronized Collection


    This is another simple best practice which is easy to follow but reap good benefits.
    Concurrent collection are more scalable than their synchronized counterpart, that''s
    why its better to use them while writing concurrent code. So next time if you
    need map, think about ConcurrentHashMap before thinking Hashtable.


    ## 51) How do you force to start a Thread in Java?


    This question is like how do you force garbage collection in Java, there is no
    way though you can make a request using System.gc() but it''s not guaranteed.
    On Java multi-threading there is absolutely no way to start a thread, this is
    controlled by thread scheduler and Java exposes no API to control thread schedule.
    This is still a random bit in Java.


    ## 52) What is the fork-join framework in Java?


    The fork-join framework, introduced in JDK 7 is a powerful tool available to Java
    developer advantage of multiple processors of modern day servers. It is designed
    for work that can be broken into smaller pieces recursively. The goal is to use
    all the available processing power to enhance the performance of your application.
    One significant advantage of The fork/join framework is that it uses a work-stealing
    algorithm. Worker threads that run out of things to do steal tasks from other
    threads that are still busy.


    ## 53) What is the difference between calling wait() and sleep() method in Java
    multi-threading?


    Though both wait and sleep introduce some form of pause in Java application, they
    are the tool for different needs. Wait method is used for inter-thread communication,
    it relinquishes lock if waiting for a condition is true and wait for notification
    when due to an action of another thread waiting condition becomes false. On the
    other hand sleep() method is just to relinquish CPU or stop execution of current
    thread for specified time duration. Calling sleep method doesn''t release the
    lock held by the current thread.


    You can use this list to not only to prepare for your core Java and programming
    interviews but also to check your knowledge about basics of threads, multi-threading,
    concurrency, design patterns and threading issues like race conditions, deadlock
    and thread safety problems.


    This master list is equally useful to Java developers of all levels of experience.
    You can read through this list even if you have 2 to 3 years of working experience
    as a junior developer or 5 to 6 years as a senior developer. It’s even useful
    for freshers and beginners to expand their knowledge.


    ## COLLECTION FRAMEWORK INTERVIEW QUESTIONS


    Interview questions from Collection package or framework are most common in any
    Core Java Interview yet a tricky one. Together Collection and multithreading make
    any Java interview tough to crack and having a good understanding of Collection
    and threads will help you to excel in Java interview. I thought about writing
    interview questions on Java collection framework and important classes like ArrayList,
    HashMap, Hashtable, and newly added concurrent collections e.g. ConcurrentHashMap
    when I first wrote 10 multi-threading Interview questions but somehow this section
    got delayed. Though I have shared several questions individually in between.


    I think the main reason for this delay could be spending a lot of time for researching
    and preparing the mega list of core Java questions from last 5 years. In this
    section, we will see a mix of some beginners and advanced Java Collection interviews
    and their answers which have been asked in various Core Java interviews.


    These Java Collection framework interview questions have been collected from various
    friends and colleagues and Answers of these interview questions can also be found
    by Google. BTW, if you are preparing for Java interview then you can also take
    help from Java Programming Interview Exposed, an excellent resource to do well
    in Java interviews.


    Java Collection interview questions answers Now let''s start with interview questions
    on collections. Since collection is made of various data structures e.g. Map,
    Set and List and various implementation, mostly interviewer checks whether interviewee
    is familiar with basics of these collections or not and whether he knows when
    to use Map, Set or List. Based on Role for which interview is going on questions
    starts with beginner''s level or more advanced level. Normally 2 to 3 years experience
    counted as beginners while over 5 years comes under advanced category, we will
    see questions from both categories.


    ## 1. How does HashMap work in Java?


    This is Classical Java Collection interview questions which I have also discussed
    in my earlier section how does HashMap work in Java. This collection interview
    questions is mostly asked during AVP Role interviews on Investment-Banks and has
    a lot of follow-up questions based on the response of interviewee e.g. Why HashMap
    keys need to be immutable, what is race conditions on HashMap and how HashMap
    resize in Java.


    ## 2. What is the difference between poll() and remove() method of Queue interface?


    Though both poll() and remove() from Queue is used to remove the object and returns
    the head of the queue, there is a subtle difference between them. If Queue is
    empty() then a call to remove() method will throw Exception, while a call to poll()
    method returns null. By the way, exactly which element is removed from the queue
    depends upon queue''s ordering policy and varies between different implementation,
    for example, PriorityQueue keeps the lowest element as per Comparator or Comparable
    at head position.


    ## 3. What is the difference between fail-fast and fail-safe Iterators?


    This is relatively new collection interview questions and can become trick if
    you hear the term fail-fast and fail-safe first time. Fail-fast Iterators throws
    ConcurrentModificationException when one Thread is iterating over collection object
    and other thread structurally modify Collection either by adding, removing or
    modifying objects on underlying collection. They are called fail-fast because
    they try to immediately throw Exception when they encounter failure. On the other
    hand fail-safe Iterators works on copy of collection instead of original collection.

