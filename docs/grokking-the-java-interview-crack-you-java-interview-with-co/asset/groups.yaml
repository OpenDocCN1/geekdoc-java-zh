    # 35) What is the concurrency level of ConcurrentHashMap in Java?


    ConcurrentHashMap achieves it''s scalability and thread-safety by partitioning
    actual map into a number of sections. This partitioning is achieved using concurrency
    level. Its optional parameter of ConcurrentHashMap constructor and it''s default
    value is 16. The table is partitioned to try to permit the indicated number of
    concurrent updates without contention.


    # 36) What is Semaphore in Java?


    Semaphore in Java is a new kind of synchronizer. Conceptually, a semaphore maintains
    a set of permits. Each acquire() blocks if until a permit is available, and then
    takes it. Each release() adds a permit, potentially releasing blocking acquirer.
    However, no actual permit objects are used; the Semaphore keeps a count of the
    number available and acts accordingly. Semaphore is used to protect an expensive
    resource which is available in fixed number e.g. database connection in the pool.
    See this section to learn more about counting Semaphore in Java.'
