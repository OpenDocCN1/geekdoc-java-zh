    ## 序列化面试题


    毫无疑问，Java 是非常庞大的，有些 Java 话题很多 Java 开发者很少去探索。序列化（Serialization）就是其中之一，在实践中很少使用，但在
    Java 面试中非常流行。它也是一个很难掌握的话题，这就是为什么我在这一部分分享一些常见的 Java 序列化面试题。我不知道为什么并不是每个人都使用它，却问这么多关于序列化的问题，但我一直看到关于
    Java 序列化的问题。这些也是最难回答且令人困惑的问题，普通的 Java 开发者可能无法回答。


    我仍然记得职业生涯早期，在一家大型投资银行的 Java 面试中被问到关于 `readObject()` 和 `writeObject()` 方法。那是我第一次听到这些方法。我确定，我并不孤单，有很多
    Java 开发者在职业早期没有听过这两个方法。


    从那时起我走了很远的路，学习了许多关于 Java 序列化的知识并在现实世界中见过它们。老实说，这是 Java 一个非常复杂的功能，如果你必须处理使用序列化的代码，你更有可能弄坏它而不是修复它。


    我被分配了一个任务在我们实现了 `Serializable` 的领域类 `Order.java` 中添加一个新字段。我只添加了字段，结果在日志文件中看到了
    `NotSerializableException`，然后我意识到如果你添加的任何字段不是 `transient` 或 `static`，就必须实现 `Serializable`
    或 `Externalizable` 接口。


    有许多这样的细节，你只有通过硬读或实际操作经验才能了解。尽管如此，像《Effective Java》这本书对我帮助很大。它包含了关于这个主题的一些最好的材料，我强烈建议每个
    Java 开发者阅读这本书以及所有与 Java 序列化相关的内容。


    不再浪费你的时间了，这里是关于序列化主题的 Java 问题，不过为了充分准备，你还需要更多问题。


    ## 1. 什么是 Serializable 接口？它的目的是什么？


    `Serializable` 是一个标记接口（marker interface），它表示实现 `Serializable` 接口的类对象可以使用 JVM 的默认序列化机制存储在磁盘上，或通过网络传输。


    ## 2. Serializable 和 Externalizable 接口有什么区别？


    这两个接口都允许你的对象被序列化或转换为二进制格式，该格式可以保存到磁盘或通过网络传输，但它们之间的关键区别在于 `Serializable` 使用 JVM
    的默认序列化机制，而 `Externalizable` 提供了钩子（hooks）和回调函数，以便在序列化前后执行操作。


    ## 3. 什么是 transient 变量？它的目的是什么？


    `transient` 变量在序列化过程中不会被保存。正如其名所示，它们是瞬态的，并不是对象状态的一部分。你可以使用 `transient` 变量来排除某些字段被序列化，例如一个不可序列化的字段应该被标记为
    `transient` 或 `static`。


