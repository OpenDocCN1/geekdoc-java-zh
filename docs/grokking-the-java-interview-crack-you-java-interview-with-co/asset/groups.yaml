    # STREAM AND FUNCTIONAL PROGRAMMING INTERVIEW QUESTIONS


    The JDK 8 release has changed the way we write Java. With new functional programming
    idioms and a powerful Stream API, most of the new Java code is written in a functional
    style. This also means that Stream and Functional programming related questions
    are increasing on Java interviews. If you are not familiar with Java 8 changes,
    then it''s difficult to crack a Java interview nowadays. Though it''s not stated
    anywhere, most of the companies, particularly Investment banks like Barclays,
    Citi, and Goldman Sachs, now expect Java developers to know at least Java 8, which
    is also good, right? Java 11 is already out, and we are looking forward to Java
    12 in a couple of months, it makes sense to know at least Java 8 changes.


    All the questions are meant for Java developers and related to whatever functional
    programming concepts and tools available to Java developers in JDK 8.


    To be honest, even though these are frequently asked Java 8 Interview questions,
    they are not at all very'
  - '[PAGE 140]


    difficult and just focus on essential Java 8 concepts, rather than it''s complex
    implementation.


    They are also not functional heavy, but if you are interested in true functional
    programming something like the Scala and Haskel has implemented, I suggest you
    check the Functional Programming for Beginners course with Scala. I bought it
    for just $11 a couple of days ago, and it''s really awesome.


    Without any further ado, here is a list of some of the common yet popular functional
    programming and Stream interview questions for Java programmers. If you have any
    other Java functional programming question or anything related to JDK 8 Stream
    API, feel free to share with us, and I''ll try to find an answer for you.


    # 1. What is the difference between Collection and Stream?


    The main difference between a Collection and Stream is that Collection contains
    their elements, but Stream doesn''t. Stream work on a view where elements are
    actually stored by Collection or array, but unlike other views, any change made
    on Stream doesn''t reflect on the original Collection.'
- md: "\n## 2. What does the map() function do? why you use it?\n\nThe map() function\
    \ perform map functional operation in Java. This means it can transform one type\
    \ of object to others by applying a function.\n\nFor example, if you have a List\
    \ of String and you want to convert that to a List of Integer, you can use map()\
    \ to do so.\n\nJust supply a function to convert String to Integer e.g. parseInt()\
    \ to map() and it will apply to all elements of List and give you a List of Integer.\
    \ In other words, the map can convert one object to another.\n\nIf you want to\
    \ learn more about these methods introduced in Java S.E. 8, I suggest you take\
    \ a look at The Complete Java Masterclass course on Udemy. One of the most comprehensive\
    \ courses which cover everything Java developers need to know.\n\n- Old style\n\
    ```java\nArrays.sort(testStrings, new Comparator<String>() {\n  @Override\n  public\
    \ int compare(String s1, String s2) {\n    return(s1.length() - s2.length());\n\
    \  }\n});\n```\n- New style\n```java\nArrays.sort(testStrings, (s1, s2) -> { return(s1.length()\
    \ - s2.length()); });\n```\n\n## 3. What does the filter() method do? when you\
    \ use it?\n\nThe filter method is used to filter elements that satisfy a certain\
    \ condition that is specified using a Predicate function.\n\nA predicate function\
    \ is nothing but a function that takes an Object and returns a boolean. For example,\
    \ if you have a List of Integer and you want a list of even integers.\n\nIn this\
    \ case, you can use the filter to achieve that. You supply a function to check\
    \ if a number is even or odd, just like this function and filter will apply this\
    \ to stream elements and filter the elements which satisfy the condition and which\
    \ doesn't.\n\n## 4. What does the flatmap() function do? why you need it?\n\n\
    The flatmap function is an extension of the map function. Apart from transforming\
    \ one object into another, it can also flatten it.\n\nFor example, if you have\
    \ a list of the list but you want to combine all elements of lists into just one\
    \ list. In this case, you can use flatMap() for flattening. At the same time,\
    \ you can also transform an object like you do map() function.\n\n## 5. What is\
    \ difference between flatMap() and map() functions?\n\nEven though both map()\
    \ and flatMap() can be used to transform one object to another by applying a method\
    \ on each element.\n\nThe main difference is that flatMap() can also flatten the\
    \ Stream. For example, if you have a list of the list, then you can convert it\
    \ to a a big list by using flatMap() function.\n\nBtw, if you find trouble understanding\
    \ these functional programming methods like map, flatMap, filter, etc., I suggest\
    \ you go through From Collections to Streams in Pluralsight. It's an advanced\
    \ course in Java 8 but very good.\n\n- From the previous example\n```java\npersons.stream()\n\
    \  .map(p -> p.get())\n  .peek(System.out::println)\n  .filter(age -> age > 20)\n\
    \  .forEach(System.out::println);\n```\n\nBy the way, you would need a Pluralsight\
    \ membership to access this course, which costs around $29 monthly or $299 annually\
    \ (14% discount). I have one, and I also suggest all developers have that plan\
    \ because Pluralsight is like Netflix for Software developers.\n\nIt has more\
    \ than 5000+ good quality courses on all the latest topics. Since we programmers\
    \ have to learn new things every day, an investment of $299 USD is not bad.\n\n\
    Btw, it also offers a 10-day free trial without any obligation, which allows you\
    \ to watch 200 hours of content. You can watch this course for free by signing\
    \ for that trial.\n\n## 6. What is the difference between intermediate and terminal\
    \ operations on Stream?\n\nThe intermediate operation returns another Stream,\
    \ which means you can further call other methods of Stream class to compose a\
    \ pipeline.\n\nFor example after calling map() or flatMap() you can still call\
    \ filter() method on Stream.\n\nOn the other hand, the terminal operation produces\
    \ a result other than Streams like a value or a Collection.\n\nOnce a terminal\
    \ method like forEach or collect() is called, you cannot call any other method\
    \ of Stream or reuse the Stream.\n\n## 7. What does the peek() method do? When\
    \ should you use it?\n\nThe peek() method of Stream class allows you to see through\
    \ a Stream pipeline. You can peek through each step and print meaningful messages\
    \ on the console. It's generally used for debugging issues related to lambda expression\
    \ and Stream processing.\n\n## 8. What do you mean by saying Stream is lazy?\n\
    \nWhen we say Stream is lazy, we mean that most of the methods defined on Java.util.stream.Stream\
    \ class is lazy i.e. they will not work by just including them on Stream pipeline.\n\
    \nThey only work when you call a terminal method on the Stream and finish as soon\
    \ as they find the data they are looking for rather than scanning through the\
    \ whole set of data.\n\n## 9. What is a functional interface in Java 8?\n\nAs\
    \ the name suggests, a functional interface is an interface that represents a\
    \ function. Technically, an interface with just one abstract method is called\
    \ a functional interface.\n\nYou can also use @FunctionalInterface to annotated\
    \ a functional interface. In that case, the compiler will verify if the interface\
    \ actually contains just one abstract method or not. It's like the @Override annotation,\
    \ which prevents you from accidental errors.\n\nAnother useful thing to know is\
    \ that If a method accepts a functional interface, then you can pass a lambda\
    \ expression to it.\n\nSome examples of the functional interface are Runnable,\
    \ Callable, Comparator, and Comparable from old API and Supplier, Consumer, and\
    \ Predicate, etc. from new function API. You can learn more about those interfaces\
    \ in Java What's New in Java 8 on Pluralsight.\n\n## 10. What is the difference\
    \ between a normal and functional interface in Java?\n\nThe normal interface in\
    \ Java can contain any number of abstract methods, while the functional interface\
    \ can only contain just one abstract method.\n\nYou might be thinking why they\
    \ are called functional interfaces? Once you know the answer, it might be a little\
    \ easier for you to remember the concept.\n\nWell, they are called functional\
    \ interfaces because they wrap a function as an interface. The function is represented\
    \ by the single abstract method on the interface.\n\n## 11. What is the difference\
    \ between the findFirst and findAny() method?\n\nThe findFirst() method will return\
    \ the first element meeting the criterion i.e. Predicate, while the findAny()\
    \ method will return any element meeting the criterion, very useful while working\
    \ with a parallel stream. You can further see this article for a working example\
    \ of the findFirst() method in Java 8.\n\n## 12. What is a Predicate interface?\n\
    \nA Predicate is a functional interface that represents a function, which takes\
    \ an Object and returns a boolean. It is used in several Stream methods like filter(),\
    \ which uses Predicate to filter unwanted elements.\n\nhere is how a Predicate\
    \ function looks like:\n\n```java\npublic boolean test(T object) {\n  return boolean;\n\
    }\n```\n\nYou can see it just has one test() method which takes an object and\
    \ returns a boolean. The method is used to test condition if it passes; it returns\
    \ true otherwise false.\n\n## 13. What are Supplier and Consumer Functional interface?\n\
    \nThe Supplier is a functional interface that returns an object. It's similar\
    \ to the factory method or new(), which returns an object.\n\nThe Supplier has\
    \ get() functional method, which doesn't take any argument and return an object\
    \ of type T. This means you can use it anytime you need an object.\n\nSince it\
    \ is a functional interface, you can also use it as the assignment target for\
    \ a lambda expression or method reference.\n\nA Consumer is also a functional\
    \ interface in JDK 8, which represents an operation that accepts a single input\
    \ argument and returns no result.\n\nUnlike other functional interfaces, Consumer\
    \ is expected to operate via side-effects. The functional method of Consumer is\
    \ accept(T t), and because it's a functional interface, you can use it as the\
    \ assignment target for a lambda expression or method interface in Java 8.\n"
  mdcn: "\n\n## 2. map() 函数是做什么的？为什么要用它？\n\nmap() 函数在 Java 中执行映射函数操作。这意味着它可以通过应用一个函数将一种类型的对象转换为另一种类型。\n\
    \n例如，如果你有一个 `List<String>` 并且想将其转换为 `List<Integer>`，你可以使用 `map()` 来。\n\n只需向 `map()`\
    \ 提供一个将 `String` 转换为 `Integer` 的函数（例如 `parseInt()`），它就会应用于 List 的所有元素，并为你返回一个\
    \ `List<Integer>`。换句话说，map 可以将一个对象转换为另一个。\n\n如果你想学习更多关于 Java S.E. 8 中引入的这些方法，我建议查看\
    \ Udemy 上的《The Complete Java Masterclass》课程。这是最全面的课程之一，涵盖了 Java 开发者需要知道的所有内容。\n\
    \n- 旧样式\n```java\nArrays.sort(testStrings, new Comparator<String>() {\n  @Override\n\
    \  public int compare(String s1, String s2) {\n    return(s1.length() - s2.length());\n\
    \  }\n});\n```\n- 新样式\n```java\nArrays.sort(testStrings, (s1, s2) -> { return(s1.length()\
    \ - s2.length()); });\n```\n\n## 3. filter() 方法是做什么的？什么时候用它？\n\nfilter 方法用于过滤符合由\
    \ `Predicate` 函数指定的特定条件的元素。\n\n谓词函数（predicate function）本质上是一个接收一个 `Object` 并返回\
    \ `boolean` 值的函数。例如，如果你有一个 `List<Integer>` 想要一个偶数列表。\n\n在这种情况下，你可以使用 `filter`\
    \ 来实现该目标。你提供一个检查数字是偶数还是奇数的函数，就像这个函数一样，filter 将其应用于流元素，并过滤掉符合和不符合条件的元素。\n\n## 4.\
    \ flatmap() 函数是做什么的？为什么需要它？\n\nflatMap 函数是 `map` 函数的扩展。除了将一个对象转换为另一个对象外，它还可以对其进行平化（flatten）。\n\
    \n例如，如果你有一个嵌套列表（list of lists），但你想将所有列表的元素合并成一个列表。在这种情况下，你可以使用 `flatMap()` 进行平化。同时，你也可以像使用\
    \ `map()` 函数一样转换对象。\n\n## 5. flatMap() 和 map() 函数之间有什么区别？\n\n尽管 `map()` 和 `flatMap()`\
    \ 都可以通过在每个元素上应用方法将一个对象转换为另一个对象。\n\n主要区别是 `flatMap()` 还可以平化 `Stream`。例如，如果你有一个嵌套列表，可以使用\
    \ `flatMap()` 函数将其转换为一个大列表。\n\n顺便说，如果你发现理解 `map`、`flatMap`、`filter` 等函数式编程方法有困难，我建议学习\
    \ Pluralsight 上的《From Collections to Streams》。这是一门 Java 8 的高级课程，但非常好。\n\n- 来自上一个例子\n\
    ```java\npersons.stream()\n  .map(p -> p.get())\n  .peek(System.out::println)\n\
    \  .filter(age -> age > 20)\n  .forEach(System.out::println);\n```\n\n顺便一下，你需要\
    \ Pluralsight 会员才能访问此课程，费用每月约为 29 美元或每年 299 美元（14% 折扣）。我有一个账号，我也建议所有开发者都拥有该计划，因为\
    \ Pluralsight 就像软件开发者的 Netflix。\n\n它在所有最新主题上都有 5000 多门高质量的课程。由于我们程序员每天都要学习新事物，投资\
    \ 299 美元并不是坏主意。\n\n顺便说，它还提供无任何义务的 10 天免费试用，允许你观看 200 小时的内容。你可以通过注册试用来免费观看此课程。\n\
    \n## 6. Stream 的中间操作和终端操作之间有什么区别？\n\n中间操作（intermediate operation）返回另一个 `Stream`，这意味着你可以继续调用\
    \ Stream 类的其他方法来组合成流水线。\n\n例如，在调用 `map()` 或 `flatMap()` 之后，你仍然可以在 `Stream` 上调用\
    \ `filter()` 方法。\n\n另一方面，终端操作（terminal operation）产生 Stream 以外的结果，例如值或 `Collection`。\n\
    \n一旦调用了如 `forEach` 或 `collect()` 等终端方法，你就无法调用 `Stream` 的任何其他方法或重用该 `Stream`。\n\
    \n## 7. peek() 方法是做什么的？什么时候应该使用它？\n\nStream 类的 `peek()` 方法允许你透视流流水线。你可以查看每个步骤并在控制台上打印有意义的消息。它通常用于调试与\
    \ lambda 表达式和 Stream 处理相关的问题。\n\n## 8. 你说 Stream 是懒的（lazy）是什么什么意思？\n\n当我们说 Stream\
    \ 是懒的时，意思是 `java.util.stream.Stream` 类定义的大多数方法都是懒的，也就是说仅仅将它们包含在 Stream 流水线并不会生效。\n\
    \n它们只有在对 Stream 运行终端方法时才会工作，并且在找到正在寻找的数据时就会停止，而不是扫描整个数据集。\n\n## 9. 什么是 Java 8\
    \ 中的函数式接口？\n\n顾如其名，函数式接口是一个表示函数的接口。从技术上讲，只有一个抽象方法的接口被称为函数式接口。\n\n你还可以使用 `@FunctionalInterface`\
    \ 注解标记函数式接口。在这种情况下，编译器将验证接口是否确实只包含一个抽象方法。它类似于 `@Override` 注解，可以防止发生意外错误。\n\n另一个有用的知识是，如果一个方法接受函数式接口，你就可以向它传递\
    \ lambda 表达式。\n\n函数式接口的一些示例包括旧 API 中的 `Runnable`、`Callable`、`Comparator` 和 `Comparable`，以及新函数\
    \ API 中的 `Supplier`、`Consumer` 和 `Predicate` 等。你可以在 Pluralsight 上的《Java What's\
    \ New in Java 8》中学习更多关于这些接口的内容。\n\n## 10. Java 中普通接口和函数式接口的区别是什么？\n\nJava 普通接口可以包含任意数量抽象方法，而函数式接口只能包含一个抽象方法。\n\
    \n你可能在想为什么它们被称为函数式接口？一旦你知道了答案，记忆这个概念可能会稍微容易一点。\n\n嗯，它们被称为函数式接口是因为它们将函数封装在接口中。该函数由接口上的单个抽象方法表示。\n\
    \n## 11. findFirst 和 findAny() 方法之间有什么区别？\n\n`findFirst()` 方法将返回第一个符合标准（即 `Predicate`）的元素，而\
    \ `findAny()` 方法将返回任何符合标准的元素，这在处理并行流（parallel stream）时非常有用。你可以进一步查看此文章获取 Java\
    \ 8 `findFirst()` 方法的运行示例。\n\n## 12. 什么是 Predicate 接口？\n\n`Predicate` 是一个表示函数的函数式接口，它接收一个\
    \ `Object` 并返回一个 `boolean`。它用于多个 Stream 方法，如 `filter()`，该方法使用 `Predicate` 来过滤不需要的元素。\n\
    \n这里是 `Predicate` 函数的形式：\n\n```java\npublic boolean test(T object) {\n  return\
    \ boolean;\n}\n```\n\n你可以看到它只有一个 `test()` 方法，该方法接收一个对象并返回一个布尔值。该方法用于测试条件如果通过则返回\
    \ `true`，否则返回 `false`。\n\n## 13. 什么是 Supplier 和 Consumer 函数式接口？\n\n`Supplier`\
    \ 是一个返回对象的函数式接口。它类似于工厂方法或 `new()`，用于返回一个对象。\n\n`Supplier` 拥有 `get()` 函数方法，它不接受任何参数并返回类型为\
    \ `T` 的对象。这意味着可以在任何需要对象的地方使用它。\n\n由于它是函数式接口，你也可以将其作为 lambda 表达式或方法引用的赋值目标。\n\n\
    `Consumer` 也是 JDK 8 中的函数式接口，表示一个接受单个输入参数且无结果的操作。\n\n与其他函数式接口不同，`Consumer` 预期通过副作用进行操作。`Consumer`\
    \ 的函数方法是 `accept(T t)`，因为它是函数式接口，你可以将其作为 Java 8 中 lambda 表达式或方法引用的赋值目标。\n\n"
