    你可以使用带有反转 `Comparator` 的 `Collections.sort()` 方法，它可以按照元素自然顺序的反序对元素进行排序，例如：


    ```java

    List<String> listOf = Arrays.asList("London", "Tokyo", "NewYork"); Collections.sort(listOf,
    Collections.reverseOrder()); System.out.println(listOf); //[Tokyo, New York, London]

    ```


    ## 39) Java 中 PATH 和 CLSPATH 有什么区别？


    `PATH` 是一个环境变量，指向用于运行 Java 程序的 Java 二进制文件。`CLASPATH` 是另一个环境变量，指向 Java 类文件或 JAR
    文件。如果 `CLSPATH` 中找不到某个类，Java 将抛出 `ClassNotFoundException`。


    ## 40) Java 中受检异常（Checked Exception）和未检异常（Unchecked Exception）的区别是什么？


    受检异常确保了提供了对异常的处理，并由编译器进行验证；而对于抛出未检异常，不需要特殊的规定（例如 `throws` 子句）。一个方法可以在不使用任何 `throw`
    子句的情况下抛出未检异常。


    以上就是电话面试轮次中的 40 个 Java 核心面试题。千万不要轻视电话面试，这是你给潜在雇主留下印象的第一个机会。由于你看不见面试官，仅通过声音交流，这与面对面面试略有不同。


    所以要始终保持冷静、放松，回答问题要直接且精准，说话要缓慢，并确保你所在的环境声音不会像在封闭楼梯间那样产生回响。良好的手机、耳机以及处于良好的信号区域也非常重要。我见过很多次候选人因为无法听清或在回答之前无法理解问题而在面试中失败。我知道有些人会在那些秘密的地方参加电话面试，但如果你真的这样做，请确保你的手机连接足够良好。


    ## 多线程与并发面试题


    无论你参加任何 Java 面试，无论是高级还是初级、有经验还是应届生，不可避免会遇到几个关于线程、并发和多线程的问题。事实上，这种内置的并发支持是 Java
    编程语言最强大的优势之一，帮助它在企业界和程序员中同样大受欢迎。大多数高薪的 Java 开发者职位都要求卓越的 Java 核心多线程技能，以及在开发、调试和优化高性能低延迟
    Java 应用方面的经验。这就是为什么它是 Java 面试中最受青睐的技能之一。多线程和并发的概念也很掌握，只有具有丰富经验的优秀开发者才能有效地处理并发问题。


    在典型的 Java 面试中，面试官会慢慢从线程的基本概念开始，提问诸如：为什么需要线程、如何创建线程、哪种创建线程的方法更好（例如通过扩展 `Thread`
    类或实现 `Runnable` 接口），然后慢慢进入并发问题、开发并发 Java 应用期间面临的挑战、Java 内存模型、JDK 1.5 引入的高阶并发工具、并发
    Java 应用的原理和设计模式、经典多线程问题（例如生产者-消费者、哲学家就餐、读写或简单的有界缓冲区问题）。


    仅仅了解线程的基础知识是不够的，你必须知道如何处理死锁、竞态条件、内存不一致以及各种与线程安全相关的问题。这些技能会通过展示各种多线程和并发问题得到充分测试。


    许多 Java 开发者习惯于在面试前只看和读面试题，这并不坏，但你不应该太疏远。此外，收集问题并反复同样的练习太浪费时间了，这就是为什么我创建了这份从各种面试中收集的
    50 个 Java 多线程和并发相关问题列表。当我发现新的或最近的面试题时，我会添加。


    虽然专注于高级多线程和并发技能的 Java 面试需要良好的知识和扎实的经验，但我强烈建议 Java 程序员在面试前读两遍《Effective Java》（Effective
    Java）和《Java并发编程》（Java Concurrency in Practice）。它们不仅能帮助你更好地回答问题，还能帮助你清晰地表达你的想法。


    而且，如果你认真想要掌握 Java 多线程和并发，我还建议你在 Udemy 上查看 Michael Pogrebinsky 提供的《Java Multithreading,
    Concurrency, and Performance Optimization》课程。这是一门高级课程，旨在成为 Java 多线程、并发和并行编程的专家，并强调高性能。


    顺便说一下，我在这里没有提供某些问题的答案。为什么？因为我预计大多数 Java 开发者都知道这些问题的答案，如果不知道，通过 Google 也能找到。


    这里是我们的 Java 线程、并发和多线程热门问题列表。你可以使用这个列表为你的 Java 面试做好充分准备。


    ## 1) Java 中的线程（Thread）是什么？


    线程是一个独立的执行路径。它是利用机器中可用多个 CPU 的方法。通过使用多个线程，你可以加速 CPU 密集型任务。例如，如果一个线程完成任务需要 100
    毫秒，你可以使用 10 个线程将该任务缩短到 10 毫秒。Java 在语言层面为多线程提供了很好的支持，这也是它的核心卖点之一。


    ## 2) Java 中线程（Thread）和进程（Process）有什么区别？


    线程是进程的子集，换句话说，一个进程可以包含多个线程。两个进程运行在不同的内存空间，但所有线程共享相同的内存空间。不要将其与栈内存（stack memory）混淆，不同线程栈不同，用于存储该线程的本地数据。


    ## 3) 如何在 Java 中实现线程？


    在语言层面，在 Java 中实现线程有两种。`java.lang.Thread` 的实例代表一个线程，但它需要一个执行的任务，该任务是 `java.lang.Runnable`
    接口的实例。由于 `Thread` 类实现了 `Runnable`，你可以通过扩展 `Thread` 类或实现 `Runnable` 接口来重写 `run()`
    方法。


    ## 4) 在 Java 中何时使用 Runnable 而不是 Thread？


    这是上一个多线程面试题的后续问题。正如我们知道可以通过扩展 `Thread` 类或实现 `Runnable` 接口来实现线程，问题随之产生：哪种更好？什么时候用哪一个？如果你知道
    Java 编程语言不支持多类继承，但允许实现多个接口，那么这个问题很容易回答。这意味着，如果你还想扩展另一个类（例如 `Canvas` 或 `CommandListener`），实现
    `Runnable` 比扩展 `Thread` 更好。


    ## 6) Thread 类中 start() 方法和 run() 方法有什么区别？


    早期的一个经典的 Java 陷阱题，但仍然足以区分对 Java 线程模型的深浅理解。`start()` 用于启动新创建的线程，而 `start()` 内部调用
    `run()` 方法；直接调用 `run()` 方法则是像调用普通方法一样调用它，它会在当前线程中执行，不会启动新线程，而调用 `start()` 方法则不同。


    ## 7) Java 中 Runnable 和 Callable 有什么区别？


    `Runnable` 和 `Callable` 都代表旨在在单独线程中执行的任务。`Runnable` 从 JDK 1.0 就有了，而 `Callable`
    是在 JDK 1.5 加入的。这两者的主要区别是 `Callable` 的 `call()` 方法可以返回值并抛出异常，而这在 `Runnable` 的 `run()`
    方法是不可能的。`Callable` 返回 `Future` 对象，该对象可以持有计算结果。


    '
