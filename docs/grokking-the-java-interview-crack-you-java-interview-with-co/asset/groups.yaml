    overriding. You use the final when you don''t want subclass changing the logic
    of your method by overriding due to security reasons. This is why the String class
    is final in Java. This concept is also used in the template design patterns where
    the template method is made final to prevent overriding.


    # Can we have a non-abstract method inside an interface?


    From Java 8 onward you can have a non-abstract method inside interface, prior
    to that it was not allowed as all method was implicitly public abstract. From
    JDK 8, you can add static and default methods inside an interface.


    # What is the default method of Java 8?


    The default method, also known as the extension method is new types of the method
    which you can add on the interface now. These method has implementation and is
    intended to be used by default. By using this method, JDK 8 managed to provide
    common functionality related to lambda expression and stream API without breaking
    all the clients implement their interfaces. If you look at Java 8 API documentation
    you will find several useful default methods on key Java interface like Iterator,
    Map, etc.'
- md: '

    # What is an abstract class in Java?


    An abstract class is a class that is incomplete. You cannot create an instance
    of an abstract class in Java. They are provided to define default behavior and
    ensured that client of that class should adhere to those contract which is defined
    inside the abstract class. In order to use it, you must extend and implement their
    abstract methods. BTW, in Java, a class can be abstract without specifying any
    abstract method.


    # What is an interface in Java? What is the real user of an interface?


    Like an abstract class, the interface is also there to specify the contract of
    an API. It supports the OOP abstraction concept as it defines only abstract behavior.
    It will tell that your program will give output but how is left to implementors.
    The real use of the interface is to define types to leverage Polymorphism.


    # The difference between Abstract class and interface?


    In Java, the key difference is that abstract class can contain a non-abstract
    method but the interface cannot, but from Java 8 onward interface can also contain
    static and default methods that are non-abstract.


    ![](img/1c06a0c37d4c0b23574c3d3cd48ab57f_19_0.png)


    # Can we make a class abstract without an abstract method?


    Yes, just add abstract keyword on the class definition and your class will become
    abstract.


    # Can we make a class both final and abstract at the same time?


    No, you cannot apply both final and abstract keyword at the class at the same
    time because they are exactly opposite of each other. A final class in Java cannot
    be extended and you cannot use an abstract class without extending and make it
    a concrete class. As per Java specification, the compiler will throw an error
    if you try to make a class abstract and final at the same time.


    # Can we overload or override the main method in Java?


    No, since main() is a static method, you can only overload it, you cannot override
    it because the static method is resolved at compile time without needing object
    information hence we cannot override the main method in Java.


    # What is the difference between Polymorphism, Overloading, and Overriding?


    This is a slight tricky OOP concept question because Polymorphism is the real
    concept behind both Overloading and Overriding. Overloading is compiled time Polymorphism
    and Overriding is Runtime Polymorphism.


    # Can an interface extend more than one interface in Java?


    Yes, an interface can extend more than one interface in Java, it''s perfectly
    valid.


    # Can a class extend more than one class in Java?


    No, a class can only extend another class because Java doesn''t support multiple
    inheritance but yes, it can implement multiple interfaces.


    # What is the difference between abstraction and polymorphism in Java?


    Abstraction generalizes the concept and Polymorphism allows you to use different
    implementation without changing your code. This diagram explains the abstraction
    quite well, though:


    ![](img/1c06a0c37d4c0b23574c3d3cd48ab57f_21_0.png)


    # Object-Oriented design principle and pattern Interview Questions


    Now let''s see some OOPS concept questions based on the SOLID design principles
    and GOF design patterns that take advantage of the OOPS concept discussed here.


    What problem is solved by the Strategy pattern in Java?


    Strategy pattern allows you to introduce a new algorithm or new strategy without
    changing the code. For example, the Collections.sort() method which sorts the
    list of the object uses the Strategy pattern to compare objects. Since every object
    uses a different comparison strategy you can compare various objects differently
    without changing the sort method.


    # Which OOP concept Decorator design Pattern is based upon?


    The decorator pattern takes advantage of Composition to provide new features without
    modifying the original class. A very good to-the-point question for the telephonic
    round. This is quite clear from the UML diagram of the Decorator pattern, as you
    can see the Component is associated with a Decorator.


    ![](img/1c06a0c37d4c0b23574c3d3cd48ab57f_22_0.png)


    # When to use the Singleton design pattern in Java?


    When you need just one instance of a class and want to be globally available then
    you can use the Singleton pattern. It''s not free of cost because it increases
    the coupling between classes and makes them hard to test. This is one of the oldest
    design pattern questions from Java interviews.


    # What is the difference between State and Strategy Patterns?


    Though the structure or class diagram of State and Strategy pattern is the same,
    their intent is completely different. The state pattern is used to do something
    specific depending upon state while Strategy allows you to switch between algorithms
    without changing the code which uses it.


    # What is the difference between Association, Aggregation, and Composition in
    OOP?


    When an object is related to another object is called association. It has two
    forms, aggregation, and composition. the former is the loose form of association
    where the related object can survive individually while later is a stronger form
    of association where a related object cannot survive individually. For example,
    the city is an aggregation of people but is the composition of body parts.


    # What is the difference between Decorator, Proxy and Adapter pattern in Java?


    Again they look similar because their structure or class diagram is very similar
    but their intent is quite different. The Decorator adds additional functionality
    without touching the class, Proxy provides access control and Adapter is used
    to make two incompatible interfaces work together.


    # What is the 5 objects oriented design principle from SOLID?


    SOLID is the term given by Uncle Bob in his classic book, the Clean Code, one
    of the must-read books for programmers. In SOLID each character stands for one
    design principle:


    - S for Single Responsibility Principle

    - O for Open closed design principle

    - L for Liskov substitution principle

    - I for Interface segregation principle

    - D for Dependency inversion principle


    ![](img/1c06a0c37d4c0b23574c3d3cd48ab57f_24_0.png)


    # What is the difference between Composition and Inheritance in OOP?


    This is another great OOPS concept question because it tests what matters, both
    of them are very important from a class design perspective. Though both Composition
    and Inheritance allows you to reuse code, formerly is more flexible than later.
    Composition allows the class to get an additional feature at runtime, but Inheritance
    is static. You can not change the feature at runtime by substitution of a new
    implementation.


    That''s all about in this list of object-oriented programming or OOPS concept
    interview questions. We have seen questions from various OOPS concepts like Abstraction,
    Encapsulation, Inheritance, Composition, Aggregation, Association, Class, Object,
    and Interface, etc.


    We have also seen questions from Object-oriented design principles also known
    as SOLID principles and GOF design patterns like Strategy, State, and Factory,
    which are based upon both the object-oriented programming concept and OOP design
    principle.


    But, as I said, if you are a senior Java then you focus more on object-oriented
    analysis and design and learn how to code against a requirement. You can also
    read Cracking the Coding Interview, 6th Edition to for Object Oriented Programming
    questions.


    # INTERVIEW QUESTIONS FROM TELEPHONIC ROUND


    Here is another section about preparing for Java Interviews, this time we will
    take a look at 40 core Java questions from telephonic round of Java Programming
    interviews. Phone interviews are usually the first step to screen candidate after
    selecting his resume. Since it''s easy to call a candidate to schedule a face-to-face
    interview, book rooms and arrange for a meeting, telephonic round of interviews
    are quite popular now days. Key to success in telephonic interview is to the point
    and concise answer. Since Interviewer wants to cover lot of things on telephonic
    round, they appreciate to the point answer instead of blah blah and dragging answer
    for sake of time. Always remember, its your time to make impression so make sure
    you have good phone, fully charged and use voice modulation technique to be as
    clear as possible. Even if you don''t know the answer, think a loud, interviewer
    appreciate ability to think and some time that proves to be decisive as well.

    '
