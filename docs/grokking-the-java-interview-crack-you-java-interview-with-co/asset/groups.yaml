    # 面向对象编程面试题


    Java 是一种面向对象的编程语言，在 Java 面试中你会看到很多关于面向对象编程概念的问题。经典问题，如接口和抽象类之间的区别一直存在；近年来，面试官也会提出基于高级设计原则和模式的更复杂的问题，以检查候选者的高级
    OOP 知识。对于具有 1 到 3 年经验的程序员，面向对象编程的面试题更为常见。这很合情，因为这些程序员必须掌握抽象、继承、组合、类、对象、接口、封装等
    OOP 基础知识。


    如果你在寻找针对 2 到 4 年经验程序员的 Java 面试题，你会发现很多基于继承和封装等 OOP 基础的问题，但随着经验的增加，你将看到基于面向对象分析和设计的问题，例如：编写一个自动售卖机设计或在
    Java 中实现一个咖啡机。


    这些问题更困难，不仅要求对 OOP 基础有真正的理解，还需要掌握 SOLID 设计原则和模式。


    在本节中，我将与你分享一些基于 OOP 概念的 Java 面试题，这些题目是我从朋友和同事那里收集的，他们在不同公司的 Java 面试中遇到过。它们通常出现在面试的前几轮，比如筛选面试轮或电话面试轮。


    如果你是一名高级 Java 开发者，那么你已经知道这些问题的答案了，我建议你多练习面向对象分析和设计技能，即如何根据规范编写代码。如果你是应届生或具有 2
    到 3 年经验的初级 Java 开发者，你必须复习这些问题，如果不会就去学习，以便在 Java 面试中表现良好。


    # OOP 或 Java 中的什么是方法重载（method overloading）？


    这是最老的 OOP 概念问题之一，十年前见过，现在依然可见。当我们有多个同名但功能不同的方法时，就称为方法重载。例如，System.out.println()
    就被重载了，因为我们有 6 或 7 个 println() 方法，每个都接受不同类型的参数。


    # OOP 或 Java 中的什么是方法重写（method overriding）？


    这是面向对象编程的魔法之处，方法在运行时根据对象进行选择。为了实现方法重写，我们需要继承和多态，因为我们需要在父类和子类中具有相同签名的方法。对该方法的调用在运行时根据实际对象而不是变量的类型来解析。


    # Java 中的方法隐藏（method of hiding）是什么？


    当你在父类和子类中声明两个相同名称和签名的静态方法时，它们会互相隐藏，即对子类中方法的调用将调用该类声明的静态方法，而对父类中相同方法的调用将解析为父类中声明的静态方法。


    # Java 是纯面向对象语言吗？如果不是，为什么？


    Java 不是纯面向对象编程语言，例如，有很多事情你不需要对象就可以完成，例如静态方法。此外，原始变量在 Java 中不是对象。


    # Java 中方法重载和重写的规则是什么？


    Java 中方法重载最重要的规则之一是方法签名必须不同，即参数的数量或类型不同。仅仅改变两个方法的返回类型不会导致重载，相反，编译器将抛出错误。另一方面，方法重写有更多规则，例如：名称和返回类型必须相同，方法签名也应该相同，重写的方法不能抛出更高级别的异常等。


    # 方法重载和重写的区别？


    有几点区别，但最重要的一点是方法重载是在编译时解析的，而方法重写是在运行时解析的。编译器在方法重载时只使用类信息，但在解析重写方法调用时需要知道对象。这张图很好地解释了这种区别：


    ![](img/1c06a0c37d4c0b23574c3d3cd48ab57f_13_0.png)


    ## 可以在 Java 中重载所有的静态方法吗？


    可以，你可以在 Java 中重载静态方法。只要所有方法都具有不同的方法签名，你可以声明任意数量的同名静态方法。


    ## 可以在 Java 中重写静态方法吗？


    不可以，你不能重写静态方法，因为它不绑定到对象。相反，静态方法属于类，并在编译时使用引用变量的类型进行解析。但是，是的，你可以在子类中声明相同的静态方法，会导致方法隐藏，即：如果你使用子类类型的引用变量，将调用新方法；但如果你使用父类的引用变量，则将调用旧方法。


    ## 可以在不使用 final 修饰符的情况下防止方法重写吗？


    可以，你可以在不使用 final 修饰符的情况下防止 Java 方法重写。事实上，有几种方法可以实现这一点，例如：你可以将方法标记为 private 或 static，这些方法是无法被重写的。


    ## 可以在 Java 中重写私 方法吗？


    不可以。私 方法仅在声明它的类内部可访问和可见，在子类中无法重写。尽管如此，你可以在内部类内部重写它们，因为它们是可访问的。


    # Java 中的什么是协变方法重写（covariant method overriding）？


    在协变方法重写中，重写方法可以返回原始或重写方法返回对象的子类。这个概念是在 Java 1.5 (Tiger) 版本中引入的，当原始方法返回 Object
    类等通用类型时，它非常有帮助，因为通过协变方法重写，你可以返回更合适的对象并防止客户端的类型转换。该概念的实际应用之一是在 Java 中重写 clone()
    方法时。


    # 在重写时可以将方法的返回类型更改为子类吗？


    可以，但仅从 Java 5 开始支持。这一特性被称为协变方法重写，是在 JDK 5 发布中引入的。如果原始方法返回父类（例如 clone() 方法返回 java.lang.Object），则这非常有帮助。通过这一点，你可以直接返回实际类型，防止客户端对结果进行类型转换。


    # 可以更改重写方法的参数列表吗？


    不可以。参数列表是方法签名的一部分，重写方法和被重写方法必须具有相同的签名。


    # 可以在不使用 throws 子句的情况下重写抛出运行时异常的方法吗？


    可以，重写时对未检查异常（unchecked exceptions）没有限制。另一方面，在检查异常（checked exception）的情况下，重写方法不能抛出在类型层次中更高的检查异常，例如：如果原始方法抛出
    IOException.lang.Exception，则重写方法不能抛出 java.lang.Throwable。


    # 如何调用父类的重写方法版本？


    你可以使用 super 关键字调用子类中重写方法的父类版本。例如，调用 java.lang.Object 的 toString() 方法，可以使用 super.toString()。


    ## 在 Java 中可以将非静态方法重写为静态方法吗？


    可以，你可以在 Java 中重写非静态方法，没有问题，但它们不应该是 private 或 final。


    ## 可以重写 Java 中的 final 方法吗？


    不可以，你不能重写 final 方法，方法上的 final 关键字是为了出于安全考虑防止重写。这就是为什么 String 类在 Java 中是 final
    的。这个概念也用于模板设计模式，其中模板方法被标记为 final 以防止重写。


    # 接口内部可以有非抽象方法吗？


    从 Java 8 开始，接口内部可以有非抽象方法，在此之前是不允许的，因为所有方法都是隐式的 public abstract。从 JDK 8 开始，你可以在接口内部添加静态和默认方法。


    # Java 8 的默认方法（default method）是什么？


    默认方法也被称为扩展方法（extension method），是现在可以在接口中添加的新类型方法。这些方法具有实现，并旨在默认使用。通过使用这种方法，JDK
    8 成功提供了与 lambda 表达式和流 API 相关的功能，而没有破坏所有实现接口的客户端。如果你查看 Java 8 API 文档，你会发现 Iterator、Map
    等关键 Java 接口上有许多实用的默认方法。


    '
