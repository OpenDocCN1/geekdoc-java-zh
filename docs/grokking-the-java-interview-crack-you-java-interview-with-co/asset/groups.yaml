    # Java 中什么是抽象类（abstract class）？


    抽象类是不完整的类。在 Java 中，你不能创建抽象类的实例。它们的提供是为了定义默认行为，并确保该类的客户端必须遵循抽象类内部定义的约。为了使用它，你必须扩展并实现它的抽象方法。顺便说一下，在
    Java 中，一个类可以在不指定任何抽象方法的情况下是抽象的。


    # Java 中什么是接口（interface）？接口的真实用途是什么？


    和抽象类一样，接口也是为了指定 API 的约。它支持 OOP 抽象概念，因为它只定义了抽象行为。它会告诉你的程序将产生输出，但如何实现则取决于实现者。接口的真实用途是定义类型以利用多态性（Polymorphism）。


    # 抽象类和接口的区别是什么？


    在 Java 中，关键区别在于抽象类可以包含非抽象方法，而接口不能包含，但从 Java 8 开始，接口也可以包含非抽象的静态方法和默认方法。


    ![](img/1c06a0c37d4c0b23574c3d3cd48ab57f_19_0.png)


    # 可以在没有抽象方法的情况下让类变成抽象的吗？


    可以，只需在类定义上添加 `abstract` 关键字，你的类就会变成抽象类。


    # 我们可以让一个类同时是 final 和 abstract 的吗？


    不能，你不能同时对类应用 `final` 和 `abstract` 关键字，因为它们是完全相反的。Java 中的 `final` 类不能被扩展，而你可以在通过扩展将其转换为具体类的情况下使用抽象类。根据
    Java 规范，如果你尝试同时让一个类变为抽象和 final，编译器将抛出错误。


    # 可以在 Java 中重载或重写 main 方法吗？


    不能，由于 `main()` 是一个静态方法，你只能对其进行重载，不能重写它，因为静态方法在编译时解析，不需要对象信息，因此我们无法在 Java 中重写 `main`
    方法。


    # 多态性（Polymorphism）、重载（Overloading）和重写（Overriding）的区别是什么？


    这是一个微妙的 OOP 概念问题，因为多态是重载和重写后的真实概念。重载是编译时多态，而重写是运行时多态。


    # 在 Java 中接口可以扩展多个接口吗？


    可以，在 Java 中一个接口可以扩展多个接口，这是完全有效的。


    # 在 Java 中一个类可以扩展多个类吗？


    不能，一个类只能扩展另一个类，因为 Java 不支持多继承，但是的，它可以实现多个接口。


    # Java 中抽象（abstraction）和多态性（polymorphism）的区别是什么？


    抽象是将概念泛泛化，而多态性允许你在不改变代码的情况下使用不同的实现。这张图表很好地解释了抽象：


    ![](img/1c06a0c37d4c0b23574c3d3cd48ab57f_21_0.png)


    # 面向对象设计原则和模式面试题


    现在让我们来看基于 SOLID 设计原则和 GOF 设计模式的 OOP 概念问题，这些问题利用了这里讨论的 OOP 概念。


    Java 中的策略模式（Strategy pattern）解决了什么问题？


    策略模式允许你在不改变代码引入新算法或新策略。例如，对对象列表排序的 `Collections.sort()` 方法使用策略模式来比较对象。由于每个对象使用不同的比较策略，你可以以不同的方式比较各种对象而无需更改排序方法。


    # 装饰器模式（Decorator design Pattern）基于什么 OOP 概念？


    装饰器模式利用组合（Composition）在不修改原始类的情况下提供新功能。这是一个电话面试中非常直击要点的问题。从装饰器模式的 UML 图中可以清楚地看到，组件（Component）与装饰器（Decorator）相关联。


    ![](img/1c06a0c37d4c0b23574c3d3cd48ab57f_22_0.png)


    # 在 Java 中何时使用单例模式（Singleton design pattern）？


    当你只需要类的一个实例并希望它是全局可用的，可以使用单例模式。它并不是免费的，因为它增加了类与类之间的耦合并使它们难以测试。这是 Java 面试中最老的设计模式问题之一。


    # 状态模式（State）和策略模式（Strategy）的区别是什么


    虽然虽然模式和策略模式的结构或类图相同，但它们的意图完全不同。状态模式用于根据状态执行特定操作，而策略模式允许你在不改变使用它的代码的情况下切换算法。


    # OOP 中关联（Association）、聚合（Aggregation）和组合（Composition）的区别是什么？


    当一个对象与另一个对象相关时，被称为关联。它有两种形式：聚合和组合。前者是关联的松散形式，相关对象可以单独生存；而后者是更强的关联形式，相关对象不能单独生存。例如，城市是人的聚合，但是身体部位的组合。


    # Java 中装饰器模式（Decorator）、代理模式（Proxy）和适配器模式（Adapter）的区别是什么？


    同样，它们看起来很相似，因为它们的结构或类图非常相似，但意图大不相同。装饰器在不触碰类的情况下添加额外功能，代理提供访问控制，而适配器用于让两个不兼容的接口协同工作。


    # SOLID 中的 5 个面向对象的设计原则是什么？


    SOLID 是 Uncle Bob 在他的经典著作《整洁代码》（Clean Code）中提出的术语，这是程序员必读的书之一。在 SOLID 中，每个字母代表一个设计原则：


    - S 代表单一责任原则（Single Responsibility Principle）

    - O 代表开闭设计原则（Open-closed design principle）

    - L 代表里基夫替换原则（Liskov substitution principle）

    - I 代表接口隔离原则（Interface segregation principle）

    - D 代表依赖倒置原则（Dependency inversion principle）


    ![](img/1c06a0c37d4c0b23574c3d3cd48ab57f_24_0.png)


    # OOP 中组合（Composition）和继承（Inheritance）的区别是什么？


    这是另一个很好的 OOP 概念问题，因为它测试了什么是重要的，从类设计的角度来看，两者都非常重要。虽然组合和继承都允许重用代码，但前者比后者更灵活。组合允许类在运行时获取附加功能，而继承是静态的。你无法通过替换新实现在运行时更改功能。


    这就是这个面向对象编程或 OOP 概念面试题列表的全部内容。我们已经看到了来自各种 OOP 概念的问题，如抽象、封装、继承、组合、聚合、关联、类、对象和接口等。


    我们还看到了关于面向对象设计原则（也称为 SOLID 原则）以及 GOF 设计模式的问题，如策略、状态和工厂，这些都是基于面向对象编程概念和 OOP 设计原则的。


    但是，正如我所说，如果你是一个高级 Java 工程师，你应该更多关注面向对象的分析和设计，并学习如何根据需求编写代码。你也可以阅读《破解编码面试》第 6 版来学习面向对象编程问题。


    '
