    # 问题 8 - 如果对象 A 引用对象 B，且对象 B 引用对象 A，除此外没有指向对象 A 或 B 的其他存活引用，那么它们符合垃圾回收的条件吗？


    这个垃圾回收面试题与问题 5 “对象何时符合垃圾回收的条件”有关。如果一个对象没有存活引用，那么它就符合垃圾回收的条件。它无法从任何线程被访问，而且循环依赖不会阻止对象被垃圾回收。这意味着在这种情况下，对象
    A 和对象 B 都符合垃圾回收的条件。


    # 问题 9 - 我们可以随时强制垃圾回收器运行吗？


    答案：不能，你无法在 Java 中强制执行垃圾回收。虽然你可以通过调用 `System.gc()` 或其兄弟方法 `Runtime.getRuntime().gc()`
    来请求垃圾回收，但不能保证调用这些方法后 GC 会立即运行。


    # 问题 10 - JVM 的永久代（permanent generation space）空间会发生垃圾回收吗？


    答案：这是一个棘手的垃圾回收面试题，因为很多程序员不确定 PermGen 是否是 Java 堆空间的一部分，而且由于它维护类元数据和字符串池，不确定它是否符合垃圾回收的条件。顺便提一下，垃圾回收确实发生在
    PermGen 空间，如果 PermGen 空间满了或超过了阈值，可能会触发 Full GC。如果你查看 GC 输出，你会发现 PermGen 空间也会被回收。这就是为什么正确设置
    PermGen 空间的大小对于避免频繁的 Full GC 非常重要。你可以通过 JVM 选项 -XX:PermGenSize 和 -XX:MaxPermGenSize
    控制 PermGen 空间的大小。


    # 问题 11：如何监控垃圾回收活动？


    答案：我最喜欢的垃圾回收面试题之一，用来检查候选人是否监控过 GC 活动。你可以通过离线或实时监控垃圾回收活动。你可以使用 JConsole 和带有 Visual
    GC 插件的 VisualVM VM 来监控实时垃圾回收活动和 JVM 的内存状态，或者使用 JVM 参数 `-XLogGC=<PATH>` 将垃圾回收输出重定向到日志文件进行离线分析。无论如何，你都应该始终开启
    `-XX:PrintGCDDetails`、`-X:verboseGC` 和 `-XX:PrintGCTimeamps` 等 GC 选项，因为它们对应用性能的影响不大，但能为性能监控提供有用的状态。


