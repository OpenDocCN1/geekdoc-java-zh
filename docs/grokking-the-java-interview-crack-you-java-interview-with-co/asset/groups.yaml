    Without wasting anyymore of your time, here is a list of frequently asked Generics
    concept interview questions from Java interviews


    # 1. What is Generics in Java ? What are advantages of using Generics?


    This is one of the first interview questions asked on generics in any Java interview,
    mostly at beginners and intermediate level. Those who are coming from prior to
    Java 5 background knows that how inconvenient it was to store object in Collection
    and then cast it back to correct Type before using it. Generics prevents from
    those. it provides compile time type-safety and ensures that you only insert correct
    Type in collection and avoids ClassCastException in runtime.'
  - '[PAGE 124]


    # 2. How Generics works in Java ? What is type erasure ?


    This is one of better interview question in Generics. Generics is implemented
    using Type erasure, compiler erases all type related information during compile
    time and no type related information is available during runtime. for example
    List<String> is represented by only List at runtime.


    This was done to ensure binary compatibility with the libraries which were developed
    prior to Java 5, you don''t have access to Type argument at runtime and Generic
    type is translated to Raw type by compiler during runtime. you can get lot of
    follow question based on this Generic interview question based upon your response
    e.g. Why Generics is implemented using Type erasure or presenting some invalid
    generic code results in compiler error.


    # 3. What is Bounded and Unbounded wildcards in Generics ?


    This another another popular Java interview questions on Generics. Bounded Wildcards
    are those which impose bound on Type. there are two kinds of Bounded wildcards
    <? extends T> which impose an upper bound by ensuring that your type must be subclass
    of T and <<? super T> where its imposing lower bound by ensuring Type must be
    super class of T. This Generic Type must be instantiated with Type within otherwise
    it will result in compilation error.'
