    # 1. What is a Serializable interface? What is the purpose of it?


    Serializable is a marker interface and it indicates that the object of any class
    which implements a Serializable interface can be stored on the disc using JVM''s
    default serialization mechanisms or transferred via the network.


    # 2. What is the difference between the Serializable and Externalizable interface?


    Both interfaces allow your object to be sterilized or converted to aq binary format
    which can be saved into disc or transfers over the network but key difference
    between them is that Serializable uses default serialization mechanism of JVM
    and Externalizable provide hooks and callbacks to do things before and after realization.


    # 3. What is a transient variable? What is the purpose of it?


    Transient variables are not saved during the Serialization process. As the name
    suggests they are transient and not really part of the object''s state. You can
    use a transient variable to exclude certain fields from being serialized like
    a field that is not serializable should be either marked transient or static.'
