    ## 8) Java 中 CyclicBarrier 和 CountDownLatch 的区别是什么？


    虽然 CyclicBarrier 和 CountDownLatch 都是为了等待一个或多个事件上的线程数量，但它们的主要区别在于：一旦 CountDownLatch
    的计数归零就无法重新使用，但即使屏障被破坏（broken），你也可以重用同一个 CyclicBarrier。


    ## 9) 什么是 Java 内存模型？


    Java 内存模型是一组规则和指南，允许 Java 程序在不同的内存架构、CPU 和操作系统上表现出确定性的行为。它在多线程情况下尤为重要。Java 内存模型对一个线程的修改对其他线程可见提供了某些保证，其中之一就是
    happens-before（发生于）关系。这种关系定义了若干条规则，允许程序员预测和推理并发 Java 程序的行为。例如，happens-before 关系保证：


    - *线程中的每个动作都发生在该线程中程序顺序上靠后的每个动作之前，这被称为程序顺序规则。*

    - 对监视器锁（monitor lock）的解锁发生在对该监视器锁的任何后续锁定之前，也称为监视器锁规则。

    - 对 volatile 字段的写入发生在对该字段的任何后续读取之前，被称为 Volatile 变量规则。

    - *对线程调用 Thread.start 发生在任何其他线程检测到该线程已终止之前（无论是通过 Thread.join() 成功返回，还是通过 Thread.isAlive()
    返回 false），也称为 Thread启动规则。*

    - *一个线程对另一个线程调用 interrupt() 发生在被中断线程检测到中断之前（通过抛出 InterruptedException，或者调用 isInterrupted
    或 interrupted），俗称为 Thread 中断规则。*

    - *一个对象的 happens-before 结束发生在该对象的 finalizer（终结器）执行的开始之前，被称为 Finalizer 规则。*

    - *如果 A 发生在 B，且 B 发生在 C，那么 A 发生在 C，这意味着 happens-before 保证具有传递性。*


    我强烈建议阅读《Java 并发编程》（Java Concurrency in Practice）的第 16 章，以更详细地理解 Java 内存模型。


    ## 10) Java 中的 volatile 变量是什么？


    volatile 是一个特殊的修饰符，只能用于实例变量。在并发 Java 程序中，在没有 synchronized 关键字或锁等任何同步器的情况下，多个线程对实例变量的修改对其他线程是不可见的。volatile
    变量保证了写操作发生在任何后续读取之前：正如上一个问题中提到的“volatile 变量规则”。


    ## 11) 什么是线程安全？Vector 是线程安全的类吗？


    线程安全是对象或代码的一个属性，保证其在被多个线程以何种方式（例如读与写）执行或使用时，其行为都符合预期。例如，一个线程安全的计数器对象即使在多个线程之间共享同一个计数器实例，也不会丢失任何计数。显然，你也可以将集合类分为两类：线程安全的类非线程安全的类。Vector
    确实是一个线程安全的类，它通过同步修改 Vector 状态的方法来实现线程安全；另一方面，它的对应类 ArrayList 则不是线程安全的。


    ## 12) Java 中的竞态条件（race condition）是什么？请举一个例子。


    竞态条件是 Java 程序处于并发执行环境时导致某些细微编程 bug 的原因。正如名称所示，竞态条件由于多个线程之间的竞争产生，如果本该先执行的线程输掉了竞争并变为后执行，代码的行为就会改变，表现为非确定性的
    bug。由于线程之间竞争的随机性，这是最难发现和复现的 bug 之一。


    ## 13) 如何在 Java 中停止线程？


    我常说 Java 后期为一切提供了丰富的 API，但讽刺的是，Java 并没有提供一种万妥的停止线程的方法。JDK 1.0 中曾有一些控制方法，例如 stop()、suspend()
    和 resume()，它们由于潜在的死锁威胁在后后的版本中被弃用了。从那以后，Java API 设计者并没有努力提供一种一致、线程安全且优雅的停止线程的方法。程序员主要依靠这样一个事实：线程在完成
    run() 或 call() 方法执行后会自动停止。若要手动停止，程序员要么利用 volatile 布尔变量并在 run 方法的循环的每次迭代中进行检查，要么通过中断线程来强制取消任务。


    ## 14) 当线程发生异常时会发生什么？


    这是我在面试中见过非常有趣且棘手的 Java 问题之一。简单来说，如果不被捕获，线程将死亡；如果注册了未捕获异常处理器，则它将收到回调。ThreadUncaughtExceptionHandler
    是一个接口，定义为当线程因未捕获的异常而突然终止时调用的处理程序的嵌套接口。当线程由于因未捕获的异常即将终止时，Java 虚拟机将通过 Thread.getUncaughtExceptionHandler()
    查询该线程的 UncaughtExceptionHandler，并调用处理器的 uncaughtException() 方法，将线程和异常作为参数传递。


    ## 15) 如何在 Java 两个线程之间共享数据？


    你可以通过共享对象或并发数据结构（如 BlockingQueue）在线程之间共享数据。请看此教程学习 Java 中的线程间通信。它使用 wait 和 notify
    方法实现了生产者-消费者模式，这涉及到在两个线程之间共享对象。


    ## 16) Java 中 notify 和 notifyAll 有什么区别？


    这是核心 Java 面试中的另一个棘手问题，因为多个线程可以等待在同一个监视器锁上，Java API 设计者提供了方法，在等待条件改变时通知其中一个线程或所有线程，但他们只提供了一部分实现。notify()
    方法没有提供选择特定线程的方法，因此它只在你知道只有一个线程在等待时才有用。与此相反，notifyAll() 会向所有线程发送通知并允许它们竞争锁，这确保了至少有一个线程会继续执行。


    ## 17) 为什么 wait、notify 和 notifyAll 不在 Thread 类中？


    这是一个与设计相关的问题，检查候选人对现有系统的看法，或者他是否考虑过某些非常常见但最初看起来并不恰当的事。为了回答这个问题，你必须给出理由，说明这三个方法放在
    Object 类中是合理的，而不是 Thread 类中。一个很明显的理由是，Java 提供了对象级别的锁而不是线程级别的锁。每个对象都有锁，由线程获取。现在如果线程需要等待某个锁，那么在该对象上调用
    wait() 比在线程上调用更合理。如果将 wait() 方法声明在 Thread 类上，则不清楚线程在等待哪把锁。简而言之，由于 wait、notify
    和 notifyAll 在锁级别上操作，因此在对象类上定义它们是合理的，因为锁属于对象。


    ## 18) Java 中的 ThreadLocal 变量是什么？


    ThreadLocal 变量是 Java 程序员可用的一种特殊变量。就像实例变量是每个实例一个，ThreadLocal 变量是每个线程一个。它是实现昂创建对象线程安全的一种良好方法，例如，你可以使用
    ThreadLocal 使 SimpleDateFormat 线程安全。由于该类开销很大，在局部作用域中使用它并不好，因为每次调用都需要单独的实例。通过为每个线程提供自己的副本，你可以一箭双雕：第一，你通过重用固定数量的实例减少了昂贵对象的实例数量；第二，你在不付出同步代价或不可变性代价的情况下实现了线程安全。Thread
    local 变量的另一个好例子是 ThreadLocal 类，它减少了多线程环境中难以创建的 Random 对象的实例数量。


    ## 19) Java 中的 FutureTask 是什么？


    FutureTask 代表并发 Java 应用程序中一个可取消的异步计算。该类提供了 Future 的基础实现，带有启动和取消计算的方法、查询计算是否完成的方法，以及获取计算结果的方法。只有在计算完成后才能获取结果；如果计算尚未完成，get
    方法将会阻塞。FutureTask 对象可以用于封装 Callable 或 Runnable 对象。由于 FutureTask 也实现了 Runnable，因此它可以提交给
    Executor 执行。


    '
