    Anyway, even if you not prefer this approach its good to know from interview point
    of view.


    # 49) How to create thread-safe Singleton in Java?


    This question is actually follow-up of the previous question. If you say you don''t
    like double checked locking then Interviewer is to ask about alternative ways
    of creating thread-safe Singleton class. There are actually man, you can take
    advantage of class loading and static variable initialization feature of JVM to
    create instance of Singleton, or you can leverage powerful enumeration type in
