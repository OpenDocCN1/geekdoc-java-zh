    # Question 8 - If Object A has reference to Object B and Object B refer to Object
    A, apart from that there is no live reference to either object A or B, Does they
    eligible to Garbage collection?


    This Garbage collection interview question is related question 5 “When object
    become eligible for Garbage collection”. An object becomes eligible for Garbage
    collection if there is no live reference for it. It can not be accessible from
    any Thread and cyclic dependency doesn''t prevent Object from being Garbage collected.
    Which means in this case both Object A and Object B are eligible of Garbage collection.


    # Question 9 -Can we force the Garbage collector to run at any time?


    Answer : No, you can not force Garbage collection in Java. Though you can request
    it by calling Sytem. gc() or its cousin Runtime.getRuntime().gc(). It''s not guaranteed
    that GC will run immediately as result of calling these method.


    # Question 10 - Does Garbage collection occur in permanent generation space in
    JVM?


    Answer : This is a tricky Garbage collection interview question as many programmers
    are not sure whether PermGen space is part of Java heap space or not and since
    it maintains class Meta data and String pool, whether its is eligible for garbage
    collection or not. By the way Garbage Collection does occur in PermGen'
  - '[PAGE 118]


    space and if PermGen space is full or cross a threshold, it can trigger Full GC.
    If you look at output of GC you will find that PermGen space is also garbage collected.
    This is why correct sizing of PermGen space is important to avoid frequent full
    GC. You can control size of PermGen space by JVM options -XX:PermGenSize and -XX:MaxPermGenSize.


