    \ the other hand, ArrayList is dynamic, it automatically allocate a new array\
    \ and copies content of old array, when it resize. Another reason of using ArrayList\
    \ over Array is support of Generics. Array doesn not support Generics, and if\
    \ you store an Integer object on a String array, you will only going to know about\
    \ it at runtime, when it throws ArrayStoreException. On the other hand, if you\
    \ use ArrayList, compiler and IDE will catch this error on the spot. So if you\
    \ know size in advance and you don't need re-sizing than use array, otherwise\
