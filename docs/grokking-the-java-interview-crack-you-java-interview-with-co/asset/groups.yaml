    ## 8) What is the difference between CyclicBarrier and CountDownLatch in Java?


    Though both CyclicBarrier and CountDownLatch wait for number of threads on one
    or more events, the main difference between them is that you can not re-use CountDownLatch
    once count reaches to zero, but you can reuse same CyclicBarrier even after barrier
    is broken.


    ## 9) What is Java Memory model?


    Java Memory model is set of rules and guidelines which allows Java programs to
    behave deterministically across multiple memory architecture, CPU, and operating
    system. It’s particularly important in case of multi-threading. Java Memory Model
    provides some guarantee on which changes made by one thread should be visible
    to others, one of them is happens-before relationship. This relationship defines
    several rules which allows programmers to anticipate and reason behaviour of concurrent
    Java programs. For example, happens-before relationship guarantees:


    - *Each action in a thread happens-before every action in that thread that comes
    later in the program order, this is known as program order rule.*

    - An unlock on a monitor lock happens-before every subsequent lock on that same
    monitor lock, also known as Monitor lock rule.

    - A write to a volatile field happens-before every subsequent read of that same
    field, known as Volatile variable rule.

    - *A call to Thread.start on a thread happens-before any other thread detects
    that thread has terminated, either by successfully return from Thread.join() or
    by Thread.isAlive() returning false, also known as Thread start rule.*

    - *A thread calling interrupt() on another thread happens-before the interrupted
    thread detects the interrupt( either by having InterruptedException, or invoking
    isInterrupted or interrupted), popularly known as Thread Interruption rule.*

    - *The end of a happens-before for an object happens-before the start of the finalizer
    for that object, known as Finalizer rule.*

    - *If A happens-before B, and B happens-before C, then A happens-before C, which
    means happens-before guarantees Transitivity.*


    I strongly suggest reading Chapter 16 of Java Concurrency in Practice to understand
    Java Memory model in more detail.


    ## 10) What is volatile variable in Java?


    Volatile is a special modifier, which can only be used with instance variables.
    In concurrent Java programs, changes made by multiple threads on instance variables
    is not visible to other in absence of any synchronizers like synchronized keyword
    or locks. Volatile variable guarantees that a write will happen before any subsequent
    read: as stated: “volatile variable rule” in previous question.


    ## 11) What is thread-safety? is Vector a thread-safe class?


    Thread-safety is a property of an object or code which guarantees that executed
    or used by multiple threads in any manner e.g. read vs write it will behave as
    expected. For example, a thread-safe counter object will not miss any count same
    instance of counter is shared among multiple threads. Apparently, you can also
    divide collection classes in two category, thread-safe and non-thread-safe. Vector
    is indeed a thread-safe class and it achieves thread-safety by synchronizing methods
    which modify state of Vector, on the other hand, its counterpart ArrayList is
    not thread-safe.


    ## 12) What is race condition in Java? Given one example?


    Race condition are cause of some subtle programming bugs when Java programs are
    exposed to concurrent execution environment. As the name suggests, a race condition
    occurs due to race between multiple threads, if a thread which is supposed to
    execute first lost the race and executed second, behaviour of code changes, which
    surface as non-deterministic bugs. This is one of the hardest bugs to find and
    re-produce because of random nature of racing between threads.


    ## 13) How to stop a thread in Java?


    I always said that later Java provides rich APIs for everything but ironically
    Java doesn''t provide a sure shot way of stopping thread. There was some control
    methods in JDK 1.0 e.g. stop(), suspend() and resume() which was deprecated in
    later releases due to potential deadlock threats, from then Java API designers
    have not made any effort to provide a consistent, thread-safe and elegant way
    to stop threads. Programmers mainly rely on the fact that thread stops automatically
    as soon as they finish execution of run() or call() method. To manually stop,
    programmers either take advantage of volatile boolean variable and check in every
    iteration if run method has loops or interrupt threads to abruptly cancel tasks.


    ## 14) What happens when an Exception occurs in a thread?


    This is one of the good tricky Java question I have seen in interviews. In simple
    words, If not caught thread will die, if an uncaught exception handler is registered
    then it will get a call back. ThreadUncaughtExceptionHandler is an interface,
    defined as nested interface for handlers invoked when a Thread abruptly terminates
    due to an uncaught exception. When a thread is about to terminate due to an uncaught
    exception the Java Virtual Machine will query the thread for its UncaughtExceptionHandler
    using Thread.getUncaughtExceptionHandler() and will invoke the handler''s uncaughtException()
    method, passing the thread and the exception as arguments.


    ## 15) How do you share data between two thread in Java?


    You can share data between threads by using shared object, or concurrent data
    structure like BlockingQueue. See this tutorial to learn inter-thread communication
    in Java. It implements Producer consumer pattern using wait and notify methods,
    which involves sharing objects between two threads.


    ## 16) What is the difference between notify and notifyAll in Java?


    This is another tricky questions from core Java interviews, since multiple threads
    can wait on single monitor lock, Java API designer provides method to inform only
    one of them or all of them, once waiting condition changes, but they provide half
    implementation. There notify() method doesn''t provide any way to choose a particular
    thread, that''s why its only useful when you know that there is only one thread
    is waiting. On the other hand, notifyAll() sends notification to all threads and
    allows them to compete for locks, which ensures that at-least one thread will
    proceed further.


    ## 17) Why wait, notify and notifyAll are not inside thread class?


    This is a design related question, which checks what candidate thinks about existing
    system or does he ever thought of something which is so common but looks in-inappropriate
    at first. In order to answer this question, you have to give some reasons why
    it make sense for these three method to be in Object class, and why not on Thread
    class. One reason which is obvious that Java provides lock at object level not
    at thread level. Every object has lock, which is acquired by thread. Now if thread
    needs to wait for certain lock it make sense to call wait() on that object rather
    than on that thread. Had wait() method declared on Thread class, it was not clear
    that for which lock thread was waiting. In short, since wait, notify and notifyAll
    operate at lock level, it make sense to define it on object class because lock
    belongs to object.


    ## 18) What is ThreadLocal variable in Java?


    ThreadLocal variables are special kind of variable available to Java programmer.
    Just like instance variable is per instance, ThreadLocal variable is per thread.
    It''s a nice way to achieve thread-safety of expensive-to-create objects, for
    example you can make SimpleDateFormat thread-safe using ThreadLocal. Since that
    class is expensive, its not good to use it in local scope, which requires separate
    instance on each invocation. By providing each thread their own copy, you shoot
    two birds with one arrow. First, you reduce number of instance of expensive object
    by reusing fixed number of instances, and Second, you achieve thread-safety without
    paying cost of synchronization or immutability. Another good example of thread
    local variable is ThreadLocal class, which reduces number of instances of expensive-to-create
    Random object in multi-threading environment.


    ## 19) What is FutureTask in Java?


    FutureTask represents a cancellable asynchronous computation in concurrent Java
    application. This class provides a base implementation of Future, with methods
    to start and cancel a computation, query to see if the computation is complete,
    and retrieve the result of the computation. The result can only be retrieved when
    the computation has completed; the get methods will block if the computation has
    not yet completed. A FutureTask object can be used to wrap a Callable or Runnable
    object. Since FutureTask also implements Runnable, it can be submitted to an Executor
    for execution.

