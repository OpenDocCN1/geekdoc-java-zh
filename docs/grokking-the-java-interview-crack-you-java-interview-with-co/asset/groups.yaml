- md: '

    Here is my list of 40 core Java-based questions which frequently appear on telephonic
    round of Interview. These questions touch-based of important core java concepts
    e.g. String, Thread basics, multi-threading, inter thread communication, Java
    Collection framework, Serialization, Object-oriented programming concepts and
    Exception handling. If you have faced couple of Java interviews, you will sure
    have seen some of these questions already.


    ## 1) Difference between String, StringBuffer and StringBuilder in Java?


    String is immutable while both StringBuffer and StringBuilder is mutable, which
    means any change e.g. converting String to upper case or trimming white space
    will produce another instance rather than changing the same instance. On the later
    two, StringBuffer is synchronized while StringBuilder is not, in fact it''s a
    replacement of StringBuffer added in Java 1.5.


    ## 2) Difference between extends Thread implements Runnable in Java?


    Difference comes from the fact that you can only extend one class in Java, which
    means if you extend Thread class you lose your opportunity to extend another class,
    on the other hand if you implement Runnable, you can still extend another class.


    ## 3) Difference between Runnable and Callable interface in Java?


    Runnable was the only way to implement a task in Java which can be executed in
    parallel before JDK 1.5 adds Callable. Just like Runnable, Callable also defines
    a single call() method but unlike run() it can return values and throw exceptions.


    ## 4) Difference between ArrayList and LinkedList in Java?


    In short, ArrayList is backed by array in Java, while LinkedList is just collection
    of nodes, similar to linked data structure. ArrayList also provides random search
    if you know the index, while LinkedList only allows random sequential search.
    On the other hand, adding and removing element from middle is efficient in LinkedList
    as compared to ArrayList because it only require to modify links and no other
    element is rearranged.


    ## 5) What is difference between wait and notify in Java?


    Both wait and notify methods are used for inter thread communication, where wait
    is used to pause the thread on a condition and notify is used to send notification
    to waiting threads. Both must be called from synchronized context e.g. synchronized
    method or block.


    ## 6) Difference between HashMap and Hashtable in Java?


    Though both HashMap and Hashtable are based upon hash table data structure, there
    are subtle difference between them. HashMap is non-synchronized while Hashtable
    is synchronized and because of that HashMap is faster than Hashtable, as there
    is no cost of synchronization associated with it. One more minor difference is
    that HashMap allows a null key Hashtable doesn’t.


    ## 7) Difference between TreeSet and TreeMap in Java?


    Though both are sorted collection, TreeSet is essentially a Set data structure
    which doesn’t allow duplicate and TreeMap is an implementation of Map interface.
    In reality, TreeSet is implemented via a TreeMap, much like how HashSet is implemented
    using HashMap.


    ## 8) Write a Java program to print Fibonacci series?


    Core Java Interview Questions answers from telephonic Interview Fibonacci series
    is a series of number on which a number is equal to sum of previous two numbers
    i.e. f(n)=f(n-1) + f(n-2). This program is used to teach recursion to students
    but you can also solve it without recursion. Check out the solution for both iterative
    and recursive solution of this problem.


    In telephonic interview, this question is not that common but sometime interviewer
    also wants to check your problem solving skill using such questions.


    ## 9) Write a Java program to check if a number is Prime or not?


    A number is said prime if it is not divisible by any other number except itself.
    1 is not considered prime, so your check must start with 2. Simplest solution
    of this to check every number until the number itself to see if its divisible
    or not. When Interviewer will ask you to improve, you can say that checking until
    square root of the number. If you can further improve the algorithm, you will
    more impress your interviewer.


    ## 10) How to Swap two numbers without using temp variable?


    This question is ages old. I have first seen this question way back in 2005 but
    I am sure its even older than that. Good thing about this problem is that except
    XOR trick all solution has some flaws, which is used to test whether candidate
    really knows his stuff or not.


    ## 11) How to check if linked list contains loop in Java?


    This is another problem solving question which is very popular in telephonic and
    screening round. This is a great question to test problem solving skill of candidate,
    especially if he has not seen this question before. It also has a nice little
    followup to find the starting of the loop.


    ## 12) Write Java program to reverse String without using API?


    One more question to test problem solving skill of candidate. You wouldn''t expect
    this kind of question in telephonic round of Java interview but these questions
    have now become norms. All interviewer is looking it for logic, you don''t need
    to write the code but you should be able to think of solution.


    ## 13) Difference between Serializable and Externalizable in Java?


    Serializable is a marker interface with no methods defined but Externalizable
    interface has two methods defined on it e.g. readExternal() and writeExternal()
    which allows you to control the serialization process. Serializable uses default
    serialization process which can be very slow for some application.


    ## 14) Difference between transient and volatile in Java?


    Transient keyword is used in Serialization while volatile is used in multi-threading.
    If you want to exclude a variable from serialization process then mark that variable
    transient. Similar to static variable, transient variables are not serialized.
    On the other hand, volatile variables are signal to compiler that multiple threads
    are interested on this variable and it shouldn''t reorder its access. volatile
    variable also follows happens-before relationship, which means any write happens
    before any read in volatile variable. You can also make non atomic access of double
    and long variable atomic using volatile.


    ## 15) Difference between abstract class and interface?


    From Java 8 onwards difference between abstract class and interface in Java has
    minimized, now even interface can have implementation in terms of default and
    static method. BTW, in Java you can still extend just one class but can extend
    multiple inheritance. Abstract class is used to provide default implementation
    with just something left to customize, while interface is used heavily in API
    to define contract of a class.


    ## 16) Difference between Association, Composition and Aggregation?


    Between association, composition and aggregation, composition is strongest. If
    part exists without whole than relationship between two class is known as aggregation
    but if part cannot exists without whole than relationship between two class is
    known as composition. Between Inheritance and composition, later provides more
    flexible design.


    ## 17) What is difference between FileInputStream and FileReader in Java?


    Main difference between FileInputStream and FileReader is that former is used
    to read binary data while later is used to read text data, which means later also
    consider character encoding while converting bytes to text in Java.


    ## 18) How do you convert bytes to character in Java?


    Bytes are converted to character or text data using character encoding. When you
    read binary data from a file or network endpoint, you provide a character encoding
    to convert those bytes to equivalent character. Incorrect choice of character
    encoding may alter meaning of message by interpreting it differently.


    ## 19) Can we have return statement in finally clause? What will happen?


    Yes, you can use return statement in finally block, but it will not prevent finally
    block from being executed. BTW, if you also used return statement in try block
    then return value from finally block with override whatever is returned from try
    block.

