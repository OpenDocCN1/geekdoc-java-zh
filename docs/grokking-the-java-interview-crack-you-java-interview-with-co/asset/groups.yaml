  - '[PAGE 77]


    Why HashMap keys need to be immutable, what is race conditions on HashMap and
    how HashMap resize in Java.


    # 2. What is the difference between poll() and remove() method of Queue interface?


    Though both poll() and remove() from Queue is used to remove the object and returns
    the head of the queue, there is a subtle difference between them. If Queue is
    empty() then a call to remove() method will throw Exception, while a call to poll()
    method returns null. By the way, exactly which element is removed from the queue
    depends upon queue''s ordering policy and varies between different implementation,
    for example, PriorityQueue keeps the lowest element as per Comparator or Comparable
    at head position.


    # 3. What is the difference between fail-fast and fail-safe Iterators?


    This is relatively new collection interview questions and can become trick if
    you hear the term fail-fast and fail-safe first time. Fail-fast Iterators throws
    ConcurrentModificationException when one Thread is iterating over collection object
    and other thread structurally modify Collection either by adding, removing or
    modifying objects on underlying collection. They are called fail-fast because
    they try to immediately throw Exception when they encounter failure. On the other
    hand fail-safe Iterators works on copy of collection instead of original collection.'
- md: "\n# 4. How do you remove an entry from a Collection? and subsequently what\
    \ is the difference between the remove() method of Collection and remove() method\
    \ of Iterator, which one you will use while removing elements during iteration?\n\
    \nCollection interface defines remove(Object obj) method to remove objects from\
    \ Collection. List interface adds another method remove(int index), which is used\
