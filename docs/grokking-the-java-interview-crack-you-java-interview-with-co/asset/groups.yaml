    # 44) What is ReadWriteLock in Java?


    In general, read write lock is the result of lock stripping technique to improve
    the performance of concurrent applications. In Java, ReadWriteLock is an interface
    which was added in Java 5 release. A ReadWriteLock maintains a pair of associated
    locks, one for read-only operations and one for writing. The read lock may be
    held simultaneously by multiple reader threads, so long as there are no writers.
    The write lock is exclusive. If you want to implement this interface with your
    own set of rules, otherwise you can use ReentrantReadWriteLock, which comes along
    with JDK and supports a maximum of 65535 recursive write locks and 65535 read
    locks.


    # 45) What is busy spin in multi-threading?


    Busy spin is a technique which concurrent programmers employ to make a thread
    wait on certain condition. Unlike traditional methods e.g. wait(), sleep() or
    yield() which all involves relinquishing CPU control, instead it just runs empty
    loop. Why would someone do that? to preserve CPU caches. In a multi-core system,
    it''s possible for a paused thread to resume on a different core, which means
    rebuilding cache again. To avoid cost of rebuilding cache, programmer prefer to
    wait for much smaller time doing busy spin.'
