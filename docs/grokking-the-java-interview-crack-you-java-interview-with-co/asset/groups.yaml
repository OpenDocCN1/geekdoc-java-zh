    **Answer 3**: [1512K] which is written in bracket is total size of Young Generation,
    which include Eden and two survivor space. 1512K on left of arrow is occupancy
    of Yong Generation before GC and 64K is occupancy after GC. On the next line value
    if bracket is total heap size which is (60035K). If we subtract size of young
    generation to total heap size we can calculate size of Old Generation. This line
    also shows occupancy of heap before and after Garbage collection.


