  - '[PAGE 149]


    # 14. Can you convert an array to Stream? How?


    Yes, you can convert an array to Stream in Java. The Stream class provides a factory
    method to create a Stream from an array, like Stream.of(T ...) which accepts a
    variable argument, that means you can also pass an array to it as as shown in
    the following example:


    ```

    String[] languages = {"Java", "Python", "JavaScript"};

    Stream numbers = Stream.of(languages);

    numbers.forEach(System.out::println);


    Output:

    Java

    Python

    JavaScript

    ```


    # 15. What is the parallel Stream? How can you get a parallel stream from a List?


    A parallel stream can parallel execute stream processing tasks. For example, if
    you have a parallel stream of 1 million orders and you are looking for orders
    worth more than 1 million, then you can use a filter to do that.


    Unlike sequential Stream, the parallel Stream can launch multiple threads to search
    for those orders on the different part of Stream and then combine the result.


    In short, the parallel Stream can paralyze execution,'
  - '[PAGE 150]


    but, as Cay S. Horstman mentioned in Core Java S.E. 9 for the Impatient, there
    is significant overhead or parallelism, which only pays off if you are doing bulk
    data operation.


    That''s all about some of the common Java 8 Stream and Functional programming
    concepts based interview questions. Since Java 8 is now the modern way of writing
    Java code, more and more companies are looking for Java developers with good Java
    8 skills.'
  - '[PAGE 151]


    # # Appendix


    # My favorite tip to Crack Java Interview


    Hello guys, I want to share one tip with you which have helped me a lot on my
    Java interviews. I have given 10s of Java interviews and also taken many Java
    interviews and I have often seen used this tactic to make lasting impression on
    Interviews.


    The trick here is drive the interview to your strength. Java is vast and in a
    limited time like 1-hour interview, its not possible for anyone to cover everything.
    Interviewer often have a list of questions to screen candidates during telephonic
    round but in face-to-face round they mostly like to check the depth of candidate’s
    knowledge and that’s where you can use this tip.


    For example, if interviewer asked you about HashMap, can not only answer his question
    about HashMap but also mention related details like hashing, how equals() and
    hashCode are used, and how objects are stored in the HashMap (linked list vs binary
    tree), provided you know these topics well. When you mention these keywords, the
    interviewer are more likely to ask question on those topics and then you can showcase
    your knowledge and drive the interview.'
  - '[PAGE 152]


    The trick here is to high light the topic you know well and don’t mention anything
    addition which you don’t know well. This tip is really simple and once you start
    giving interview, you will realize that you are doing that, but if you don’t do
    it now, I suggest setup mock interviews with your friends or online and see if
    you are using tip for your benefit.


    All the best for your Java interview.'
