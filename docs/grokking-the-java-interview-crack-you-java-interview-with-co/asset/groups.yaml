  - '[PAGE 71]


    # 50) List down 3 multi-threading best practice you follow?


    This is my favorite question because I believe that you must follow certain best
    practices while writing concurrent code which helps in performance, debugging
    and maintenance. Following are three best practices, I think an average Java programmer
    should follow:


    +   - Always give meaningful name to your thread


    This goes a long way to find a bug or trace an execution in concurrent code. OrderProcessor,
    QuoteProcessor or TradeProcessor is much better than Thread-1. Thread-2 and Thread-3.
    The name should say about task done by that thread. All major framework and even
    JDK follow this best practice.


    +   - Avoid locking or Reduce scope of Synchronization


    Locking is costly and context switching is even costlier. Try to avoid synchronization
    and locking as much as possible and at a bare minimum, you should reduce critical
    section. That''s why I prefer synchronized block over synchronized method because
    it gives you absolute control on the scope of locking.


    +   - Prefer Synchronizers over wait and notify


    Synchronizers like CountDownLatch, Semaphore,'
