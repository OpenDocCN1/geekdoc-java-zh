    # 46) What is the difference between the volatile and atomic variable in Java?


    This is an interesting question for Java programmer, at first, volatile and atomic
    variable look very similar, but they are different. Volatile variable provides
    you that happens-before guarantee that a write will happen before any subsequent
    write, it doesn''t guarantee atomicity. For example count++ operation will not
    become atomic just declaring count variable as volatile. On the other hand AtomicInteger
    class provides atomic method to perform such compound operation atomically e.g.
    getAndIncrement() is atomic replacement of increment operator. It can be used
    to atomically increment current value by one. Similarly you have atomic version
    for other data type and reference variable as well.


    # 47) What happens if a thread throws an Exception inside synchronized block?


    This is one more tricky question for average Java programmer, if he can bring
    the fact about whether lock is released or not is a key indicator of understanding.
    To answer this question, no matter how you exist synchronized block, either normally
    by finishing execution or abruptly by throwing exception, thread releases the
    lock it acquired while entering that synchronized block. This is actually one
    of the reasons I like synchronized block over lock interface, which requires explicit
    attention to release lock, generally this is achieved by releasing the lock in
    a finally block.'
