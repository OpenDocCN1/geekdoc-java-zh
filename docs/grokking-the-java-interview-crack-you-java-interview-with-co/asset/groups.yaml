    # 16. 什么是 Java 中的开闭原则？


    开闭原则是 Robert C. Martin 定义的 SOLID 原则之一，他在最著名的书籍《整洁代码》（Clean Code）中被大家称为 Bob 叔叔。该原则建议代码应该对扩展开放，但对修改关闭。


    起初，这看起来可能是相互矛盾的，但一旦你探索了多态的力量，你就会发现一些可以提供该原则稳定性和灵活性的模式。


    这是该原则的一个关键例子是状态（State）和策略（Strategy）模式，其中 Context 类对修改关闭，通过通过实现新的策略状态编写新代码来提供新功能。查看此节以了解更多关于开闭原则的内容。


    # 17. 你能提供 Java SOLID 设计原则的示例吗？


    有很多 SOLID 设计模式构成了 SOLID 缩写，如下：


    - 1. 单责任原则 (SRP)

    - 2. 开闭设计原则 (OCP)

    - 3. 里基夫替换原则 (Liskov Substitution Principle)

    - 4. 接口隔离原则 (Interface Segregation Principle)

    - 5. 依赖倒置原则 (Dependency Inversion Principle)


    # 18. Java 中抽象（Abstraction）和封装（Encapsulation）有什么区别？


    尽管抽象和封装看起来相似，因为它们都隐藏了复杂性并使外部接口更加，但它们之间存在微妙的区别。抽象隐藏逻辑复杂性，而封装隐藏物理复杂性。


    | 抽象 | 封装 |

    | --- | --- |

    | 1. 抽象在设计层面解决问题。 | 1. 封装在实现层面解决问题。 |

    | 2. 抽象用于隐藏不需要的数据给出相关的数据。 | 2. 封装意味着将代码和数据隐藏在单个单元中，以保护数据不受外部世界的影响。 |

    | 3. 抽象让你关注对象在做什么，而不是怎么做。 | 3. 封装意味着隐藏对象执行某操作的内部细节或机制。 |

    | 4. 抽象-外部布局，从设计角度使用。例如：手机的外观，如它有显示屏和拨号号码的键盘按钮。 | 4. 封装-内部布局，从实现角度使用。例如：手机的内部实现细节，如键盘按钮和显示屏如何通过电路相互连接。
    |


    # 垃圾回收面试题


    垃圾回收（GC）面试题在核心 Java 和高级 Java 面试中都非常流行。除了 Java 集合和线程之外，许多棘手的 Java 问题源于垃圾回收，这些问题很难回答。在
    Java Java 面试章节中，我将分享一些在各种核心 Java 面试中遇到的 GC 问题。这些问题基于垃圾回收如何工作、不同类型的垃圾回收器，以及用于垃圾回收监控和调优的
    JVM 参数。正如我所说，GC 是任何 Java 面试的重要部分，因此确保你对 GC 有良好的掌握。另一个一个变得非常重要的点是理解和掌握垃圾回收输出的能力，越来越多的面试官正在检查候选人是否理解
    GC 输出。


    在 Java 面试期间，他们可能会提供一段 GC 输出并基于此提出各种问题，例如使用了哪种垃圾回收器、输出是来自主收集（major collection）还是
    Minor收集（minor collection）、GC 释放了多少内存、GC 后新生代和老年代的大小等等。


    我包含了一些来自 GC 输出的垃圾回收面试题和答案以提供帮助。建议在参加任何阶段的 Java 面试时，除了准备 Java 集合、多线程和编程问题外，还要准备垃圾回收。


    此外，如果你认真想要提高你的高级 JVM 技能并学习如获取和分析堆转储（heap dumps）等知识，建议你参加 Udemy 上的 Java 应用性能和内存管理课程。这是
    Java 程序员学习更多关于性能和内存管理的进阶课程之一，包括排查 Java 中的内存泄漏。


    这里是我个人收藏的一些垃圾回收面试题，这些是我根据自己的经验并帮助一些与我分享 GC 面试题的朋友和同事创建的。


    实际上，问题比我在这里分享的很多，但为了保持这个章节短小，我想只分享一些问题，如果你们觉得有用，我可以考虑第二部分的 GC 面试题。


    # 问题 1 - Java 堆的结构是什么？

    堆中的 PermGen 永久代空间是什么？


    答案：为了在任何 Java 面试的垃圾回收问题中表现更好，对 Java 堆有一个基本的理解是非常重要的。


    顺便说，堆被分为不同的代，例如新生代（new generation）、老年代（old generation）和 PermGen 空间。PermGen 空间用于存储类的元数据，PermGen
    空间的填充会导致 `java.lang.OutOfMemory: PermGen space`。记住 Java 中配置 PermGen 空间的 JVM 也是值得注意的。


    # 问题 2 - 你如何在 Java 中识别 Minor GC 和 Major GC？


    答案：如果使用 `–verbose:gc` 或 `-XX:PrintGCDetails` 启用了垃圾回收日志，Minor GC 会打印“GC”，而 Major
    GC 会打印“Full GC”。这个垃圾回收面试题基于对垃圾回收输出的理解。随着越来越多的面试官通过提问来检查候选人理解 GC 输出的能力，这个主题变得更加重要。


    # 问题 3 - ParNew 和 DefNew 新生代垃圾回收器有什么区别？


    答案：这个垃圾回收面试题最近我的一个朋友问过。回答这个问题需要比平均水平更高的 GC 知识。


    顺便说，ParNew 和 DefNew 是两个新生代垃圾回收器。ParNew 是一个与并发清除（concurrent Sweep）一起使用的多线程 GC，而
    DefNew 是与串行垃圾回收器（Serial Garbage Collector）一起使用的单线程 GC。


    如果你认真想要提高高级 JVM 技能并学习如获取和分析堆转储等知识，强烈建议你参加 Udemy 上的 Java 应用性能和内存管理课程。


    # 问题 4 - 如何找到由于调用 `System.gc()` 导致的 GC？


    答案：另一个基于 GC 输出的 GC 面试题。与 Major 和 Minor 类似，垃圾回收输出中会包含“System”一词。


    # 问题 5 - Serial 和 Throughput 垃圾回收器有什么区别？


    答案：Serial 垃圾回收器是一种“停停世界”（stop the world）GC，它在 Minor 和 Major 期间都会停止应用程序线程的运行。Serial
    垃圾回收器可以使用 JVM 选项 `-XX:UseSerialGC` 启用，它是为没有暂停时间要求且具有客户端配置的 Java 设计的。


    在 JDK 1.5 引入人体机学（ergonomics）之前，Serial GC 也是 JDK 1.4 中的默认 GC。Serial GC 最适用于线程较少的小型应用程序，而
    Throughput GC 最适用于大型应用程序。另一方面，Throughput 垃圾回收器是一个并行收集器，Minor 和 Major 收集是并行发生的，充分利用了所有可用系统资源（如多处理器）。


    Throughput 垃圾回收器可以使用 `-XX:UseParallelGC` 或 `-XX:UseOldParallelGC` 启用。


    它提高了应用程序的整体吞吐量，减少了花费在垃圾回收上的时间，但在 Full GC 期间仍会有长时间停顿。


    这是一种垃圾回收面试题，让你在回答时有机会详细地展示你的知识。我总是建议详细地回答这类问题。


    # 问题 6 – 对象在 Java 中何时变得符合垃圾回收条件？


    答案：当一个对象没有存活引用（live reference）或者或者它无法被任何存活线程访问时，该对象就符合垃圾回收条件。循环引用不被视为存活引用，如果两个对象相互指向且其中任何一个都没有存活引用，那么它们都符合
    GC 条件。此外，垃圾回收线程是一个守护线程（daemon thread），它将根据 GC 算法由 JVM 运行，并在收集所有符合 GC 条件的对象。


    # 问题 7 - Java 中的 finalize 方法是什么？垃圾回收器何时调用 Java 中的 finalize 方法？


    答案：Java 中的 finalize 方法（也称为 finalizer）是定义在 `java.lang.Object` 中的一个方法，由垃圾回收器在收集任何符合
    GC 条件的对象之前调用。`finalize()` 方法为对象提供了最后一次清理和释放剩余资源的机会。


