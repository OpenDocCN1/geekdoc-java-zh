    ## 20) Can you override static method in Java?


    No, you cannot override static method in Java because they are resolved at compile
    time rather than runtime. Though you can declare and define static method of same
    name and signature in child class, this will hide the static method from parent
    class, that''s why it is also known as method hiding in Java.


    ## 21) Difference between private, public, package and protected in Java?


    All four are access modifier in Java but only private, public and protected are
    modifier keyword. There is no keyword for package access, its default in Java.
    Which means if you don''t specify any access modifier than by default that will
    be accessible inside the same package. Private variables are only accessible in
    the class they are declared, protected are accessible inside all classes in same
    package but only on sub class outside package and public variables e.g. method,
    class or variables are accessible anywhere. This is highest level of access modifier
    and provide lowest form of encapsulation.


    ## 22) 5 Coding best practices you learned in Java?


    If you are developing on a programming language for couple of years, you sure
    knows lots of best practices, by asking couple of them, Interviewer just checking
    that you know your trade well. Here are my 5 Java best practices :


    - Always name your thread, this will help immensely in debugging.

    - Use StringBuilder for string concatenation

    - Always specify size of Collection, this will save lot of time spent on resizing

    - Always declare variable private and final unless you have good reason.

    - Always code on interfaces instead of implementation

    - Provide dependency to method instead they get by themselves, this will make
    your code unit testable.


    ## 23) Write a Program to find maximum and minimum number in array?


    This is another coding question test problem solving ability of candidate. Be
    ready for couple of follow up as well depending upon how you answer this question.
    Simplest way which comes in mind is to sort the array and then pick the top and
    bottom element.


    ## 24) Write a program to reverse Array in place?


    Another problem solving question for Java programmers. Key point here is that
    you need to reverse the array in place, which means you cannot use additional
    buffer, one or two variable will be fine. Note you cannot use any library code,
    you need to create your own logic.


    ## 25) Write a program to reverse a number in Java?


    This is an interesting program for a very junior programmer, right from the college
    to sometime puzzle developer with couple of years of experience as well. Most
    of these developer do very little coding so they found this kind of questions
    challenging. Here the trick is to get the last digit of the number by using modulus
    operator (%) and reducing number in each go by using division operator (/).


    ## 26) Write a Program to calculate factorial in Java?


    Another beginners coding problem, good for telephonic interview because you can
    differentiate a guy who can write program to the guy who can''t. It''s also good
    to see if developer is familiar with both recursive and iterative algorithm and
    pros and cons of each. You can ask lots of follow up e.g. how to improve performance
    of algorithm? Since factorial of a number is equal to number multiplied by factorial
    of previous number, you can cache those value instead of recalculating them, this
    will impress your interviewer a bit.


    ## 27) What is difference between calling start() and run() method of Thread?


    You might have heard this question before, if calling start() method calls the
    run() method eventually why not just call the run() method? Well the difference
    is, start method also starts a new thread. If you call the method directly then
    it will run on same thread not on different thread, which is what original intention
    would be.


    ## 28) Write a Program to solve Producer Consumer problem in Java?


    A very good question to check if candidate can write inter thread communication
    code or not. If a guy can write producer consumer solution by hand and point out
    critical section and how to protect, how to communicate with thread then he is
    good enough to write and maintain your concurrent Java program. This is the the
    very minimum requirement for a Java developer and that''s why I love this question,
    it also has several solution e.g. by using concurrent collections like blocking
    queue, by using wait and notify and by using other synchronizers of Java 5 e.g.
    semaphores.


    ## 29) How to find middle element of linked list in one pass?


    Another simple problem solving question for warm up. In a singly linked list you
    can only traverse in one direction and if you don''t know the size then you cannot
    write a loop to exactly find out middle element, that is the crux of the problem.
    One solution is by using two pointers, fast and slow. Slower pointer moves 1 step
    when faster pointer move to 2 steps.


    ## 30) What is difference between equals() and hashCode() in Java?


    This is usually asked as follow-up of previous question, static binding is related
    to overloaded method and dynamic binding is related to overridden method. Method
    like private, final and static are resolved using static.


    ## 31) Why is String immutable in Java?


    This question is to find out how much experience you have and what is your thinking
    towards Java API and wait notify methods are associated with thread.


    ## 32) How does HashSet works in Java?


    HashSet is internally implemented using HashMap and this is what your interviewer
    wants to hear. What is the value in case of HashSet? Well in case of HashSet a
    dummy object is used as value and key are the actual element. Since HashMap allow
    it also follows contract of set structure to not allow duplicates.


    ## 33) What is difference between synchronize and concurrent Collection in Java?


    There was time, before Java 1.5 when you have synchronized collection if you need
    them in a multi-threaded Java program. Those classes were plagued with several
    issue most importantly performance because they lock the whole collection or map
    whenever a thread reads or writes. To address those issue, Java released couple
    of Concurrent collection classes e.g. ConcurrentHashMap, CopyOnArrayList and BlockingQueue
    to provide more scalability and performance.


    ## 34) What is difference between Iterator and Enumeration in Java?


    Main difference is that Iterator was introduced in place of Enumeration. It also
    allows you to remove elements from collection while traversing which was not possible
    with Enumeration. The methods of Iterator e.g. hasNext() and next() are also more
    concise then corresponding methods in Enumeration e.g. hasMoreElements().


    ## 35) What is difference between Overloading and Overriding in Java?


    Another frequently asked question from telephonic round of Java interviews. Though
    both overloading and overriding are related with methods of same names they have
    different characteristics e.g. loaded methods must have different method signature
    than original method but overridden method must have same signature. Also, overloaded
    methods are resolved at compiled time while overridden methods are resolved at
    runtime.


    ## 36) Difference between static and dynamic binding in Java?


    This is usually asked as follow-up of previous question, static binding is related
    to overloaded method and dynamic binding is related to overridden method. Method
    like private, final and static are resolved using static binding at compile time
    but virtual methods which can be overridden are resolved using dynamic binding
    at runtime.

