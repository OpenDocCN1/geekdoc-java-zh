    # What is the covariant method overriding in Java?


    In the covariant method overriding, the overriding method can return the subclass
    of the object returned by the original or overridden method. This concept was
    introduced in Java 1.5 (Tiger) version and it''s very helpful in case the original
    method is returning general type like Object class, because then by using the
    covariant method overriding you can return a more suitable object and prevent
    client-side typecasting. One of the practical use of this concept is when you
    override the clone() method in Java.


    # Can we change the return type of method to subclass while overriding?


    Yes, you can, but only from Java 5 onward. This feature is known as covariant
    method overriding and it was introduced in JDK 5 release. This is immensely helpful
    if the original method return super-class like clone() method return java.lang.Object.
    By using this, you can directly return the actual type, preventing client-side
    type-casting of the result.


    # Can we change the argument list of an overriding method?


    No, you cannot. The argument list is part of the method signature and both overriding
    and overridden'
