  md: '# 18. What is the difference between Abstraction and Encapsulation in Java?


    Even though both Abstraction and Encapsulation look similar because both hide
    complexity and make the external interface simpler, there is a subtle difference
    between them. Abstraction hides logical complexity while Encapsulation hides Physical
    Complexity.


    | Abstraction | Encapsulation |

    | --- | --- |

    | 1. Abstraction solves the problem in the design level. | 1. Encapsulation solves
    the problem in the implementation level. |

    | 2. Abstraction is used for hiding the unwanted data and giving relevant data.
    | 2. Encapsulation means hiding the code and data into a single unit to protect
    the data from outside world. |

    | 3. Abstraction lets you focus on what the object does instead of how it does
    it | 3. Encapsulation means hiding the internal details or mechanics of how an
    object does something. |

    | 4. Abstraction- Outer layout, used in terms of design. For Example:- Outer Look
    of a Mobile Phone, like it has a display screen and keypad buttons to dial a number.
    | 4. Encapsulation- Inner layout, used in terms of implementation. For Example:-
    Inner Implementation detail of a Mobile Phone, like keypad button and Display
    Screen connect with each other using circuits. |'
