  md: '# OBJECT ORIENTED PROGRAMMING INTERVIEW QUESTIONS


    Java is an object-oriented programming language and you will see a lot of object-oriented
    programming concept questions on Java interviews. The classic questions like the
    difference between an interface and abstract class are always there from the last
    couple of years more sophisticated questions based upon advanced design principles
    and patterns are also asked to check advanced OOP knowledge of the candidate.
    Object-oriented programming questions are more popular on Java interviews for
    1 to 3 years experienced programmers. It makes sense as well, as these are the
    programmers who must know the OOP basics like Abstraction, Inheritance, Composition,
    Class, Object, Interface, Encapsulation, etc.


    If you look for Java interview questions for 2 to 4 years experienced programmer,
    you will find lots of questions based upon OOP fundamentals like Inheritance and
    Encapsulation but as you gain more experience, you will see questions based on
    object-oriented analysis and design e.g. code a vending design machine or implement
    a coffeemaker in Java.'
