  md: 'overriding. You use the final when you don''t want subclass changing the logic
    of your method by overriding due to security reasons. This is why the String class
    is final in Java. This concept is also used in the template design patterns where
    the template method is made final to prevent overriding.


    # Can we have a non-abstract method inside an interface?


    From Java 8 onward you can have a non-abstract method inside interface, prior
    to that it was not allowed as all method was implicitly public abstract. From
    JDK 8, you can add static and default methods inside an interface.


    # What is the default method of Java 8?


    The default method, also known as the extension method is new types of the method
    which you can add on the interface now. These method has implementation and is
    intended to be used by default. By using this method, JDK 8 managed to provide
    common functionality related to lambda expression and stream API without breaking
    all the clients implement their interfaces. If you look at Java 8 API documentation
    you will find several useful default methods on key Java interface like Iterator,
    Map, etc.'
