  md: '# What is the method overriding in OOP or Java?


    It''s one of the magic of object-oriented programming

    where the method is chose based upon an object at

    runtime. In order for method overriding, we need

    Inheritance and Polymorphism, as we need a method

    with the same signature in both superclass and

    subclass. A call to such a method is resolved at runtime

    dending upon the actual object and not the type o

    variable.


    # What is the method of hiding in Java?


    When you declare two static methods with same name\and signature in both superclass
    and subclass then

    they hide each other i.e. a call to the method in the

    subclass will call the static method declared in that

    class and a call to the same method is superclass is

    resolved to the static method declared in the super-

    class.


    # Is Java a pure object-oriented language? if not

    why?


    Java is not a pure object-oriented programming

    language e.g. there are many things you can do

    without objects e.g. static methods. Also, primitive

    variables are not objects in Java.'
