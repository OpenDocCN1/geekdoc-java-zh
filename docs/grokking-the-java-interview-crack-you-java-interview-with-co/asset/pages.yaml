  md: '# 4. What is SerialVersionUID in Java? Why it’s important?


    VersionUID is an identifier generated during the Serialization process if not
    defined in the class. The danger of not specifying explicitly is that the default
    logic goes generate this id depends upon class metadata like a number of fields,
    which means if you add new fields or remove fields the it will be different.


    This means, you may not be able to restore the old serialized instances with the
    new version of your code. When you define SerialVersionUID as public static final
    long constant then the default serialization mechanism doesn’t generate it, hence
    it becomes independent of class metadata.


