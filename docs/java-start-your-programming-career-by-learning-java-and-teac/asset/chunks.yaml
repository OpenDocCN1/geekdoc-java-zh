  trans: "\n\n# 算法的特征\n\n1. `Inputs and outputs` 必须精确定义。\n2. `algorithm` 中的每一步都应该是清晰且无歧义的。\n\
    3. 在解决问题的多种方法中，`Algorithm` 应该是最高效。\n4. `algorithm` 不应包含计算机代码。相反，`algorithm` 的编写方式应当使其能够在相似的编程语言中被使用。\n\
    \n# 编程中的算法示例\n\n### 编写一个算法计算用户输入的两个数之和。\n- 步骤 1：开始\n- 步骤 2：声明变量 `num1`、`num2`\
    \ 和 `sum`。\n- 步骤 3：读取值 `num1` 和 `num2`。\n- 步骤 4：将 `num1` 和 `num2` 相加并将赋值给 `sum`。\n\
    `sum←num1+num2`\n- 步骤 5：显示 `sum`\n- 步骤 6：停止\n\n### 编写一个算法找到用户输入的三个数中最大的。\n- 步骤\
    \ 1：开始\n- 步骤 2：声明变量 `a`、`b` 和 `c`。\n- 步骤 3：读取变量 `a`、`b` 和 `c`。\n- 步骤 4：如果 `a>b`\n\
    \    - 如果 `a>c`\n        - 显示 `a` 是最大的数。\n    - 否则\n        - 显示 `c` 是最大的数。\n\
    -- 否则\n    - 如果 `b>c`\n        - 显示 `b` 是最大的数。\n    - 否则\n        - 显示 `c` 是最大的数。\n\
    - 步骤 5：停止\n\n### 编写一个算法找到二次方程 `ax2+bx+c=0` 的所有根。\n- 步骤 1：开始\n- 步骤 2：声明变量 `a`、`b`、`c`、`D`、`x1`、`x2`、`rp`\
    \ 和 `ip`；\n- 步骤 3：计算判别式\n  `D←b2-4ac`\n- 步骤 4：如果 `D≥0`\n    - `r1←(-b+√D)/2a`\n\
    \    - `r2←(-b-√D)/2a`\n    - 显示 `r1` 和 `r2` 为根。\n- 否则\n    - 计算实部和虚部\n    - `rp←b/2a`\n\
    \    - `ip←√(-D)/2a`\n    - 显示 `rp+j(ip)` 和 `rp-j(ip)` 为根。\n- 步骤 5：停止\n\n### 编写一个算法计算用户输入的数字的阶乘。\n\
    - 步骤 1：开始\n- 步骤 2：声明变量 `n`、`factorial` 和 `i`。\n- 步骤 3：初始化变量\n  `factorial←1`\n\
    \  `i←1`\n- 步骤 4：读取 `n` 的值\n- 步骤 5：重复步骤直到 `i=n`\n    - 5.1：`factorial←factorial*i`\n\
    \    - 5.2：`i←i+1`\n- 步骤 6：显示 `factorial`\n- 步骤 7：停止\n\n### 编写一个算法检查用户输入的数字是否为质数。\n\
    - 步骤 1：开始\n- 步骤 2：声明变量 `n`、`i`、`flag`。\n- 步骤 3：初始化变量\n  `flag←1`\n  `i←2`\n- 步骤\
    \ 4：从用户读取 `n`。\n- 步骤 5：重复步骤直到 `i<(n/2)`\n    - 5.1 如果 `n÷i` 的余数等于 0\n        -\
    \ `flag←0`\n        - 跳到步骤 6\n    - 5.2 `i←i+1`\n- 步骤 6：如果 `flag=0`\n    - 显示\
    \ `n` 不是质数\n- 否则\n    - 显示 `n` 是质数\n- 步骤 7：停止\n\n### 编写一个算法找到直至 `term≤1000` 的斐波那契数列。\n\
    - 步骤 1：开始\n- 步骤 2：声明变量 `term` 和 `secondterm`。\n- 步骤 3：初始化变量 `term←0` `secondterm←1`\n\
    - 步骤 4：显示 `term` 和 `secondterm`\n- 步骤 5：重复步骤直到 `secondterm≤1000`\n    - 5.1：`term←secondterm`\n\
    \    - 5.2：`secondterm←secondterm+1`\n    - 5.3：`temp←term`\n    - 5.4：显示 `term`\n\
    - 步骤 6：停止\n\n# 算法解决了哪些类型的问题？\n\n排序绝不是算法所开发的唯一计算问题。算法的实际应用无处不在，并了以下示例：\n\n1. 人类基因组计划在识别人类\
    \ DNA 中所有 100,000 个基因、确定组成人类 DNA 的 30 亿个碱基对的序列、将这些信息存储在数据库中以及开发数据分析工具方面取得了巨大进展。每一个步骤都需要复杂的算法。虽然各种问题的解决方案超出了本书的范围，但许多解决这些生物问题的方法使用了书中几个章节的理念，从而使科学家能够在高效利用资源的同时完成任务。这节省了人类和机器的时间以及金钱。\n\
    \n2. 互联网让全球范围内能够快速访问和检索大量信息。在巧妙算法的帮助下，互联网网站能够管理和处理这些海量数据。必须使用算法的问题示例包括：寻找数据传输的良好路由，以及使用搜索引擎快速找到包含特定信息的页面。\n\
    \n3. 电子商务使得商品和服务能够通过电子进行谈判和交换，它依赖于个人信息（如信用卡号、密码和银行对单）的隐私性。电子商务使用的核心技术包括公钥加密和数字签名，这些都是基于数值算法和数论的。\n\
    \n4. 制造业和其他企业通常需要以后有利的方式分配稀缺资源。石油公司可能希望知道在哪里设置钻井以实现预期利润最大化。政治候选人可能想确定在哪里花钱购买竞选广告，以使赢得选举的机会最大化。航空公司可能希望以最低成本的方式将机组分配给航班，确保每班航班都有人员覆盖并符合有关机组安排的政府法规。互联网服务提供商可能希望确定在哪里放置额外资源，以便更有效地服务客户。这些都是可以使用线性规划解决的问题示例。\n\
    \n"
- fmt: "\nAlthough some of the details of these examples are beyond the scope of this\
    \ book, we do give underlying techniques that apply to these problems and problem\
    \ areas.\n\n# Algorithms as a technology\n\nSuppose computers were infinitely\
    \ fast and computer memory was free. Would you have any reason to study algorithms?\
    \ The answer is yes, if for no other reason than that you would still like to\
    \ demonstrate that your solution method terminates and does so with the correct\
    \ answer.\n\nIf computers were infinitely fast, any correct method for solving\
    \ a problem would do.\n\nYou would probably want your implementation to be within\
    \ the bounds of good software engineering practice (for example, your implementation\
    \ should be well designed and documented), but you would most often use whichever\
    \ method was the easiest to implement. Of course, computers may be fast, but they\
    \ are not infinitely fast. And memory may be inexpensive, but it is not free.\
    \ \n\nComputing time is therefore a bounded resource, and so is space in memory.\
    \ You should use these resources wisely, and algorithms that are efficient in\
    \ terms of time or space will help you do so.\n\n## Where storage lives?\n\nIt’s\
    \ useful to visualize some aspects of how things are laid out while the program\
    \ is running— in particular how memory is arranged. There are five different places\
    \ to store data:\n\n1. **Registers**. This is the fastest storage because it exists\
    \ in a place different from that of other storage: inside the processor. However,\
    \ the number of registers is severely limited, so registers are allocated as they\
    \ are needed. You don’t have direct control, nor do you see any evidence in your\
    \ programs that registers even exist (`C` & `C++`, on the other hand, allow you\
    \ to suggest register allocation to the compiler).\n2. **The stack**. This lives\
    \ in the general random-access memory (`RAM`) area, but has direct support from\
    \ the processor via its stack pointer. The stack pointer is moved down to create\
    \ new memory and moved up to release that memory. This is an extremely fast and\
    \ efficient way to allocate storage, second only to registers. The Java system\
    \ must know, while it is creating the program, the exact lifetime of all the items\
    \ that are stored on the stack. This constraint places limits on the flexibility\
    \ of your programs, so while some Java storage exists on the stack—in particular,\
    \ object references—Java objects themselves are not placed on the stack.\n3. **The\
    \ heap**. This is a general-purpose pool of memory (also in the `RAM` area) where\
    \ all Java objects live. The nice thing about the heap is that, unlike the stack,\
    \ the compiler doesn’t need to know how long that storage must stay on the heap.\
    \ Thus, there’s a great deal of flexibility in using storage on the heap. Whenever\
    \ you need an object, you simply write the code to create it by using `new`, and\
    \ the storage is allocated on the heap when that code is executed. Of course there’s\
    \ a price you pay for this flexibility: It may take more time to allocate and\
    \ clean up heap storage than stack storage (if you even could create objects on\
    \ the stack in Java, as you can in `C++`).\n4. **Constant storage**. Constant\
    \ values are often placed directly in the program code, which is safe since they\
    \ can never change. Sometimes constants are cordoned off by themselves so that\
    \ they can be optionally placed in read-only memory (`ROM`), in embedded systems.\n\
    5. **Non-RAM storage**. If data lives completely outside a program, it can exist\
    \ while the program is not running, outside the control of the program. The two\
    \ primary examples of this are streamed objects, in which objects are turned into\
    \ streams of bytes, generally to be sent to another machine, and persistent objects,\
    \ in which the objects are placed on disk so they will hold their state even when\
    \ the program is terminated. The trick with these types of storage is turning\
    \ the objects into something that can exist on the other medium, and yet can be\
    \ resurrected into a regular RAM-based object when necessary. Java provides support\
    \ for lightweight persistence, and mechanisms such as `JDBC` and `Hibernate` provide\
    \ more sophisticated support for storing and retrieving object information in\
    \ databases.\n\n## Big O Notation\n\nBig O notation is the language we use for\
    \ articulating how long an algorithm takes to run. It's how we compare the efficiency\
    \ of different approaches to a problem.\n\nImagine you have a list of 10 objects,\
    \ and you want to sort them in order. There’s a whole bunch of algorithms you\
    \ can use to make that happen, but not all algorithms are built equal. Some are\
    \ quicker than others but more importantly the speed of an algorithm can vary\
    \ depending on how many items it’s dealing with. Big O is a way of measuring how\
    \ an algorithm scales. Big O references how complex an algorithm is.\n\nBig O\
    \ is represented using something like `O(n)`. The `O` simply denoted we’re talking\
    \ about big O and you can ignore it (at least for the purpose of the interview).\
    \ `n` is the thing the complexity is in relation to; for programming interview\
    \ questions this is almost always the size of a collection. The complexity will\
    \ increase or decrease in accordance with the size of the data store.\n\nBelow\
    \ is a list of the Big O complexities in order of how well they scale relative\
    \ to the dataset:\n\n*   **O(1)/Constant Complexity**: Constant. This means irrelevant\
    \ of the size of the data set the algorithm will always take a constant time.\
    \ 1 item takes 1 second, 10 items takes 1 second, 100 items takes 1 second. It\
    \ always takes the same amount of time.\n*   **O(log n)/Logarithmic Complexity**:\
    \ Not as good as constant, but still pretty good. The time taken increases with\
    \ the size of the data set, but not proportionately so. This means the algorithm\
    \ takes longer per item on smaller datasets relative to larger ones. 1 item takes\
    \ 1 second, 10 items takes 2 seconds, 100 items takes 3 seconds. If your dataset\
    \ has 100, it takes 3 seconds.\n*   **O(n)/Linear Complexity**: The larger the\
    \ set, the time taken grows proportionately. 1 item takes 1 second, 10 items takes\
    \ 10 seconds, 100 items takes 100 seconds.\n*   **O(n log n)**: The best example\
    \ of O(n log n) is merge sort. 1 item takes 1 second, 10 items takes 33 seconds,\
    \ 100 items takes 664 seconds.\n*   **O(n²)/Quadratic Complexity**: Things are\
    \ getting slow. 1 item takes 1 second, 10 items takes 100 seconds, 100 items takes\
    \ 10000 seconds.\n*   **O(2^n): Exponential Growth!**: The algorithm takes twice\
    \ as long for every element added. 1 item takes 1 second, 10 items takes 1024\
    \ seconds, 100 items takes an astronomical number.\n\nExamples: Hopefully you’re\
    \ with me so far, let’s dive into some examples.\n"
  raw: 'Although some of the details of these examples are beyond the scope of this
    book, we do give underlying techniques that apply to these problems and problem
    areas.Algorithms as a technologySuppose computers were infinitely fast and computer
    memory was free. Would you have any reason to study algorithms? The answer is
    yes, if for no other reason than that you would still like to demonstrate that
    your solution method terminates and does so with the correct answer.If computers
    were infinitely fast, any correct method for solving a problem would do.You would
    probably want your implementation to be within the bounds of good software engineering
    practice (for example, your implementation should be well designed and documented),
    but you would most often use whichever method was the easiest to implement. Of
    course, computers may be fast, but they are not infinitely fast. And memory may
    be inexpensive, but it is not free.Computing time is therefore a bounded resource,
    and so is space in memory. You should use these resources wisely, and algorithms
    that are efficient in terms of time or space will help you do so.Where storage
    lives?It’s useful to visualize some aspects of how things are laid out while the
    program is running— in particular how memory is arranged. There are five different
    places to store data: 1\. Registers. This is the fastest storage because it exists
    in a place different from that of other storage: inside the processor. However,
    the number of registers is severely limited, so registers are allocated as they
    are needed. You don’t have direct control, nor do you see any evidence in your
    programs that registers even exist (C & C++, on the other hand, allow you to suggest
    register allocation to the compiler).  2\. The stack. This lives in the general
    random-access memory (RAM) area, but has direct support from the processor via
    its stack pointer. The stack pointer is moved down to create new memory and moved
    up to release that memory. This is an extremely fast and efficient way to allocate
    storage, second only to registers. The Java system must know, while it is creating
    the program, the exact lifetime of all the items that are stored on the stack.
    This constraint places limits on the flexibility of your programs, so while some
    Java storage exists on the stack—in particular, object references—Java objects
    themselves are not placed on the stack. 3\. The heap. This is a general-purpose
    pool of memory (also in the RAM area) where all Java objects live. The nice thing
    about the heap is that, unlike the stack, the compiler doesn’t need to know how
    long that storage must stay on the heap. Thus, there’s a great deal of flexibility
    in using storage on the heap. Whenever you need an object, you simply write the
    code to create it by using new, and the storage is allocated on the heap when
    that code is executed. Of course there’s a price you pay for this flexibility:
    It may take more time to allocate and clean up heap storage than stack storage
    (if you even could create objects on the stack in Java, as you can in C++).  4\.
    Constant storage. Constant values are often placed directly in the program code,
    which is safe since they can never change. Sometimes constants are cordoned off
    by themselves so that they can be optionally placed in read-only memory (ROM),
    in embedded systems.2 5\. Non-RAM storage. If data lives completely outside a
    program, it can exist while the program is not running, outside the control of
    the program. The two primary examples of this are streamed objects, in which objects
    are turned into streams of bytes, generally to be sent to another machine, and
    persistent objects, in which the objects are placed on disk so they will hold
    their state even when the program is terminated. The trick with these types of
    storage is turning the objects into something that can exist on the other medium,
    and yet can be resurrected into a regular RAMbased object when necessary. Java
    provides support for lightweight persistence, and mechanisms such as JDBC and
    Hibernate provide more sophisticated support for storing and retrieving object
    information in databases.Big O NotationBig O notation is the language we use for
    articulating how long an algorithm takes to run. It''s how we compare the efficiency
    of different approaches to a problem. Imagine you have a list of 10 objects, and
    you want to sort them in order.  There’s a whole bunch of algorithms you can use
    to make that happen, but not all algorithms are built equal.  Some are quicker
    than others but more importantly the speed of an algorithm can vary depending
    on how many items it’s dealing with. Big O is a way of measuring how an algorithm
    scales.  Big O references how complex an algorithm is.Big O is represented using
    something like O(n).  The O simply denoted we’re talking about big O and you can
    ignore it (at least for the purpose of the interview).  n is the thing the complexity
    is in relation to; for programming interview questions this is almost always the
    size of a collection. The complexity will increase or decrease in accordance with
    the size of the data store.Below is a list of the Big O complexities in order
    of how well they scale relative to the dataset.O(1)/Constant Complexity: Constant.
     This means irrelevant of the size of the data set the algorithm will always take
    a constant time. 1 item takes 1 second, 10 items takes 1 second, 100 items takes
    1 second. It always takes the same amount of time.O(log n)/Logarithmic Complexity: Not
    as good as constant, but still pretty good.  The time taken increases with the
    size of the data set, but not proportionately so. This means the algorithm takes
    longer per item on smaller datasets relative to larger ones.   1 item takes 1
    second, 10 items takes 2 seconds, 100 items takes 3 seconds. If your dataset has
    10 items, each item causes 0.2 seconds latency. If your dataset has 100, it only
    takes 0.03 seconds extra per item. This makes log n algorithms very scalable.O(n)/Linear
    Complexity: The larger the data set, the time taken grows proportionately.  1
    item takes 1 second, 10 items takes 10 seconds, 100 items takes 100 seconds.O(n
    log n): A nice combination of the previous two.  Normally there’s 2 parts to the
    sort, the first loop is O(n), the second is O(log n), combining to form O(n log
    n) 1 item takes 2 seconds, 10 items takes 12 seconds, 100 items takes 103 seconds.O(n^2)/Quadratic
    Complexity: Things are getting extra slow. 1 item takes 1 second, 10 items takes
    100, 100 items takes 10000.   O(2^n): Exponential Growth! The algorithm takes
    twice as long for every new element added.  1 item takes 1 second, 10 items takes
    1024 seconds, 100 items takes 1267650600228229401496703205376 seconds.Examples:Hopefully
    you’re with me so far, but let’s dive into some example algorithms for sorting
    and searching.  The important thing is to be able to explain what complexity an
    algorithm is.  Interviewers love to get candidates to design algorithms and then
    ask what the complexity of it is.1.        O(1)Irrelevant of the size, it will
    always return at constant speed. The javadoc for Queue states that it is  “constant
    time for the retrieval methods (peek, element, and size)”. It’s pretty clear why
    this is the case.  For peek, we are always returning the first element which we
    always have a reference to; it doesn’t matter how many elements follow it.  The
    size of the list is updated upon element addition/removal, and referencing this
    number is just one operation to access no matter what the size of the list is.2.       O(log
    n)The classic example is a Binary search.  You’re a massive geek so you’ve obviously
    alphabetised your movie collection. To find your copy of “Back To The Future”,
    you first go to the middle of the list. You discover the middle film is “Meet
    The Fockers”, so you then head to the movie in between the start and this film.
     You discover this is “Children of Men”. You repeat this again and you’ve found
    back to the future.Although adding more elements will increase the amount of time
    it takes to search, it doesn’t do so proportionally. Therefore it is O(log n).3.       O(n)As
    discussed in my post on collections, LinkedLists are not so good (relatively speaking)
    when it comes to retrieval.  It actually has a Big O of O(n) as in the worst case,
    to find an element T which is the last element in the list, it is necessary to
    navigate the entire list of n elements to find T. As the number of elements increases
    so does the access time in proportion.4.      O(n log n)The best example of O(n
    log n) is a merge sort. This is a divide and conquer algorithm. Imagine you have
    a list of integers. We divide the list in two again and again until we are left
    with with a number of lists with 1 item in: each of these lists is therefore sorted.We
    then merge each list with it’s neighbour (comparing the first elements of each
    every time). We repeat this with the new composite list until we have our sorted
    result.How to figure out Big O in an interview?This is not an exhaustive list
    of Big O.  Much as you can O(n2), you can also have O(n^3) (imagine throwing an
    extra loop into your bubble sort for no apparent reason).  What the list on this
    page should allow you to do is have a stab in the dark at figuring out what the
    big O of an algorithm is.  If someone is asking you this during an interview they
    probably want to see how you try and figure it out. Break down the loops and processing.'
