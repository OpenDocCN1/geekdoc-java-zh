    # 第一章 | 引言


    ## 本书关于什么？

    本书的编写是为了回答任何想要学习一种编程语言并提高生产力的人。你即使以前没有接触过任何编程语言，也可以从零开始。读完这本书，你将具备成为一名合格程序员的技能，或者至少了解阅读和编写代码涉及的内容。之后，你将掌握学习更多内容时所需的自信和知识。在开始之前，你应该具备基本的计算机技能。通过本书，你将知道至少在看代码而不感到头晕需要具备什么。


    ## 为什么要读这本书？

    你可以在网上寻找视频和教程来学习；然而，在按顺序且在一个地方学习知识时，存在一个明显的缺点。大多数 YouTube 或教程网站要么对某个话题浅尝带过，要么在一个特定主题上以乌龟的速度磨叽一小时。在线内容通常很短，没有对任何特定主题进行深入探讨。它们是不完整的，或者仍处于进行过程中。你经常发现自己要等几周另一个视频或教程发布。


    大多数关于 Java 的在线教程是分散的、无序的且缺乏性的。要找到一个好的起点很难，要找到一个连续的教程列表让你清晰地理解 Java 编程语言则更加困难。让你知道，你应该觉得学习的过程是令人兴奋的。如果不是，你将很难读完这本书。学习任何新技能都需要大量的耐心。我记得问过一位专家级程序员我该如何学习编程。他告诉我去写一个编译器。当时，这听起来很刻薄，但现在我理解了他为什么那样说。这就像告诉一个想学如何开
    F1 赛车的人直接去参加比赛一样。在这两种情况下，“学习”这部分在学习过程中被忽略了。要告诉一个想学习写代码的人从何处开始是非常困难的。


    然而，这一切确实始于你学习的准备工作。你的动力必须超出本书的内容。你可能对什么是编程有一些先入为主的想法。我无法改变这一点，但如果你有了与既有知识相反的发现，你应该愿意改变你对该话题的观点。保持开放的心态。


    计算机艺术家通常认为编程是一门与艺术不兼容的技术学科。我发现相反才是正确的。编程是一门艺术，正如文学和设计是艺术一样。编程有很多晦涩的规则，为了让任何事情运行都需要理解这些规则。


    ## 我需要学习数学吗？

    考虑到复杂的规则，编程需要复杂的数学知识吗？实际上，除非你编写数学软件，否则只需要一点几何学就很有用了。这里的大多数示例只用到了极小部分的数学来实现其目的。数学和编程在方法论上有很大重叠。学校教授的数学提供单一的解决方案。编程的结果往往有点像数学证明，但这个证明不仅仅是另一段数学。相反，你代码的证明意味着你的僵尸在追人类。计算机已经为你完成了大量的数学工作。你只需要知道使用什么数学，然后插入正确的变量即可。


    ## 作为表达形式的编程

    在编程中，词汇和意义之间存在着更深层的联系。这种联系更机械化，但同时也是灵活的。在编程语言方面，程序员喜欢称之为“表达力”（expressiveness）。你在文学中写单词时，你推断出了大部分甚至全部含义。当编程中没有隐含推理时，你就可以自由地为单词定义自己的含义，并自由地创造单词。


    艺术与代码的常见融合出现在视频游戏中。每当角色能够相互反应并对用户交互做出反应时，就能传递更丰富的体验。艺术家、动画师或环境设计师应该具备向观众传递更丰富体验的能力。角色艺术家可以向他的观众展示一个怪物；但为了真正体验这种生物，怪物应该对观众的反应做出瞪视、咆哮和攻击反应。


    ## 在你开始你的软件开发生涯之前，我强烈建议你在进入软件开发领域之前拥有这本书：

    *完全软件开发人员职业指南：如何学习你的下一种编程语言、攻克你的编程面试并获得你梦想中的编码工作* - John Sonmez 著


