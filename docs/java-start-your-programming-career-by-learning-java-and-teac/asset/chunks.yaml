    Every programmer does this habitually.![](OEBPS/image7568.jpg)It is important
    to learn how to do this since it is something that you actually need to do in
    many cases not only to learn but also to get any unfamiliar task done. Programming
    is a constant learning process. It is a language to command computers.


    Anytime you learn a new language, there will be plenty of words which you’ll have
    to look up.


    Add to this the fact that every programmer gets to make up new words, and you’ve
    got a language that you’ll always need a dictionary for.When some code is shown,
    you’ll be expected to copy that code into your project. With your fingers ready
    on the keyboard, you’ll want to get in the habit of typing.There is a reason why
    programmers are usually fast typists. This is also cause for programmers to be
    picky about what keyboard they prefer. In most cases, the projects in this book
    will be in some state where you can read text that is already in place.Most of
    the projects are in a more complete state, where you’ll be able to run them and
    see an intended result. As a programmer I’ve gotten used to searching the Internet
    for example code.Once I’ve discovered something that looks useful, I copy that
    code and paste it into a simple test case. After I’ve wrapped my head around what
    the code is doing, I rewrite it in a form that is more suited for my specific
    case.


    Even if the code involves some fun trick, I’ll learn from that code.As I learn
    new tricks, I grow as a programmer. The only way to learn new tricks is to find
    the necessity to solve a new problem for which I haven’t already figured out a
    solution. Finding solutions to problems is a fundamental part of being a programmer.5
    SKILLS SELF-TAUGHT PROGRAMMERS COMMONLY LACK1\. ALGORITHMS


    * * *


    This is classic computer science right here. Programming without knowledge of
    algorithms is like carpentry with just one kind of saw: you can get the job done,
    but it’s going to take a lot longer.You can look at an [algorithm](https://goo.gl/E2ENP8)
    as “discipline”. When you learn to write them, what you’re doing is solving a
    problem with discipline; using structure, patterns, and logical steps.When you
    don’t know how to discipline your mind, you don’t know how to write algorithms.Not
    only can you not write algorithms unless you’ve studied them, you don’t know how
    many algorithms others have written, too.I spent four days trying to figure out
    how to do a permutation. I was so proud of myself when I figured it out. Right
    up until I discovered that B.R. Heaps had figured it out in 1963.2\. DESIGN PATTERNS


    * * *


    This comes with education and/or experience. There’s more than one way to structure
    your code, and there’s a right time and a wrong time for each. You either need
    to make mistakes along the way and learn when to use each pattern, or learn from
    someone else who’s already made the mistake (a teacher).3\. PROGRAMMING PARADIGMS


    * * *


     Object-Oriented Programming  is not The Way. Neither is  Functional Programming.
    Nor  Reactive  [ ](https://en.wikipedia.org/wiki/Reactive_programming)[Programming.](https://en.wikipedia.org/wiki/Reactive_programming)
    [It is](https://en.wikipedia.org/wiki/Reactive_programming) [A Way](https://en.wikipedia.org/wiki/Reactive_programming).There
    are different ways to program, and they each have a purpose. Not only that, some
    languages are naturally better-suited for one paradigm or another.“If all you
    have is a hammer, everything looks like a nail.”Take that into self-taught programming
    and you’ll find yourself hammering in nails, screws, staples, and thumb tacks.I
    remember a self-taught .NET programmer actually telling me once, “well, it’s not
    programming unless it’s object-oriented. And that’s why I don’t consider JavaScript
    a programming language.” That’s a very, very flawed train of thought.4\. DATA
    STRUCTURES


    * * *


    Granted, your language can give you a basic idea of what the different data structures
    are. But again, that’s a basic idea.Self -taught programmers can have a tendency
    to only stick to data structures that work within theirFavorite language. Just
    because it’s not a primitive, or even a common structure in your language, that
    doesn’t mean it can’t exist. Of course, that also means that maybe it shouldn’t
    exist, either.The world is very small if it all can fit inside of an array.5\.
    TESTING


    * * *


    Maybe it’s just me, but there’s a lot of ways to test your code before pushing
    it to an environment. Learn how to do unit testing.More importantly, learn test-driven
    development.There’s a difference between testing your code, and writing testable
    code.SELF-TAUGHT PROGRAMMERS I HAVE INTERVIEWED OFTEN LACKED KNOWLEDGE IN THESE
    AREAS:


    * * *


    *   FORMAL VOCABULARY. You have to know the correct names of [data structures](https://goo.gl/E2ENP8)
    and other things by heart to by able to have an effective conversation related
    to a project in software development.


    *   TESTING. Most of the autodidacts lack knowledge or generally do not understand
    the importance of the testing process.


    *   PROGRAM PARADIGMS (and corresponding language). “If you only have a hammer,
    every problem looks like a nail”. I’ve had many of these hammer-types. They often
    just do not understand why not every problem can be solved the same way/with the
    same methodology.'
