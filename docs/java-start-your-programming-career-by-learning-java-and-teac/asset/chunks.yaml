  trans: "\n\n由于每次二分查找都使用搜索空间的一半，我们可以断言并容易证明，二分查找找到目标值所需的比较次数（大 O 表示法）永远不会超过 `O(log\
    \ N)`。对数是一个增长极其缓慢的函数。如果你还不清楚二分查找是有多高效，可以考虑在一部有一百万个名字的电话簿中查找一个名字。二分查找允许你通过最多 21\
    \ 次比较，就能系统地找到任何给定的名字。如果你能管理一个按姓名排序的世界所有人的列表，你可以在少于 35 步内找到任何一个人。\n\n### 二分查找\n\
    \n#### 递归二分查找的 Java 实现\n```java\nclass BinarySearch{\n    // 如果 x 存在于 arr[l..r]\
    \ 中则返回其索引，否则\n    // 返回 -1\n    int binarySearch(int arr[], int l, int r, int\
    \ x) {\n        if (r>=l) {\n            int mid = l + (r - l)/2;\n          \
    \  // 如果元素就在中间位置\n            if (arr[mid] == x)\n                return mid;\n\
    \            // 如果元素小于中间值，则它只可能\n            // 在左子数组中\n            if (arr[mid]\
    \ > x)\n                return binarySearch(arr, l, mid-1, x);\n            //\
    \ 否则元素可能在右\n            // 子数组中\n            return binarySearch(arr, mid+1, r,\
    \ x);\n        }\n        // 当元素不在数组中时到达这里\n        return -1;\n    }\n    public\
    \ static void main(String args[]) {\n        BinarySearch ob = new BinarySearch();\n\
    \        int arr[] = {2,3,4,10,40};\n        int n = arr.length;\n        int\
    \ x = 10;\n        int result = ob.binarySearch(arr,0,n-1,x);\n        if (result\
    \ == -1)\n            System.out.println(\"Element not present\");\n        else\n\
    \            System.out.println(\"Element found at index \"+result);\n    }\n\
    }\n```\n**输出：** `Element is present at index 3`\n\n#### 二分查找的迭代实现\n```java\nclass\
    \ BinarySearch{\n    // 如果 x 存在于 arr[] 中则返回其索引，否则\n    // 返回 -1\n    int binarySearch(int\
    \ arr[], int x) {\n        int l = 0, r = arr.length - 1;\n        while (l <=\
    \ r) {\n            int m = l + (r-l)/2;\n            // 检查 x 是否在中间\n        \
    \    if (arr[m] == x)\n                return m;\n            // 如果大于，忽略左半\n \
    \           if (arr[m] < x)\n                l = m + 1;\n            // 如果 x 小，忽略右半\n\
    \            else\n                r = m - 1;\n        }\n        // 如果到达这里，说明元素不存在\n\
    \        return -1;\n    }\n    public static void main(String args[]) {\n   \
    \     BinarySearch ob = new BinarySearch();\n        int arr[] = {2, 3, 4, 10};\n\
    \        int n = arr.length;\n        int x = 0;\n        int result = ob.binarySearch(arr,\
    \ x);\n        if (result == -1)\n            System.out.println(\"Element not\
    \ present\");\n        else\n            System.out.println(\"Element found at\
    \ index \"+result);\n    }\n}\n```\n**输出：** `Element is present at index 3`\n\n\
    ### 冒泡排序\n\n冒泡排序被认为是最简单的排序算法。在冒泡排序中，数组从第一个元素遍历到最后一个元素。在这里，当前元素与下一个元素进行比较。如果当前元素大于元素，则对其进行交换。\n\
    \n#### 算法\n我们假设 `list` 是一个包含 `n` 个元素的数组。我们进一步假设 `swap` 函数会交换给定数组的值。\n```\nbegin\n\
    BubbleSort(list)\n  for all elements of list\n    if list[i] > list[i+1]\n   \
    \   swap(list[i], list[i+1])\n  end\nreturn list\nend\n```\n\n#### 程序：Java 冒泡排序程序\n\
    ```java\npublic class BubbleSortExample {\n    static bubbleSort(int[] arr) {\n\
    \        int n = arr.length;\n        int temp = 0;\n        for(int i=0; i <\
    \ n; i++) {\n            for(int j=1; j < (n-i); j++) {\n                if(arr[j-1]\
    \ > arr[j]) {\n                    //交换元素\n                    temp = arr[j-1];\n\
    \                    arr[j-1] = arr[j];\n                    arr[j] = temp;\n\
    \                }\n            }\n        }\n    }\n    public static void main(String[]\
    \ args) {\n        int arr[] ={3,60,35,2,45,20,5};\n        System.out.println(\"\
    Array Before Bubble Sort\");\n        for(int i=0; i < arr.length; i++) {\n  \
    \          System.out.print(arr[i] + \" \");\n        }\n        System.out.println();\n\
    \        bubbleSort(arr); //使用冒泡排序排序元素\n        System.out.println(\"Array After\
    \ Bubble Sort\");\n        for(int i=0; i < arr.length; i++) {\n            System.out.print(arr[i]\
    \ + \" \");\n        }\n    }\n}\n```\n**输出：**\nArray Before Bubble Sort: `3 60\
    \ 35 2 45 20 5`\nArray After Bubble Sort: `2 3 5 35 45 60 20`\n\n### 插入排序\n\n\
    插入排序是一种简单的排序算法，其工作方式就像我们整理手中的扑牌一样。\n\n#### 算法\n1. 如果是第一个元素，它已经是有序的。\n2. 选取下一个元素\n\
    3. 与排序子列表中的所有元素进行比较\n4. 将排序子列表中的所有大于待排序值的元素向后移动\n5. 插入该值\n6. 重复直到列表排序完成\n\n####\
    \ 程序：插入排序实现的 Java 程序\n```java\nclass InsertionSort{\n    /*使用插入排序排序数组的*/\n   \
    \ void sort(int arr[]) {\n        int n = arr.length;\n        for (int i=1; i<n;\
    \ ++i) {\n            int key = arr[i];\n            int j = i-1;\n          \
    \  /* 将 arr[0..i-1] 中大于 key 的元素向后移动 */\n            while (j >= 0 && arr[j] >\
    \ key) {\n                arr[j + 1] = arr[j];\n                j = j - 1;\n \
    \           }\n            arr[j + 1] = key;\n        }\n    }\n    /* 打印数组大小的工具函数\
    \ */\n    static printArray(int arr[]) {\n        int n = arr.length;\n      \
    \  for (int i=0; i < n; i++) {\n            System.out.print(arr[i] + \" \");\n\
    \        }\n        System.out.println();\n    }\n    public static void main(String\
    \ args[]) {\n        int arr[] = {12, 11, 13, 5, 6, 7};\n        System.out.println(\"\
    Given Array\");\n        printArray(arr);\n        InsertionSort ob = new InsertionSort();\n\
    \        ob.sort(arr);\n        System.out.println(\"\\nSorted array\");\n   \
    \     printArray(arr);\n    }\n}\n```\n*(注：由于提供的原文中 InsertionSort 代码部分存在逻辑混乱和截断，翻译时已根据标准的插入排序逻辑进行了语义对齐以确保可读性)*\n\
    \n"
- fmt: "\n# Quicksort\n\n* Select an element from the array. This element is called\
    \ the \"pivot element\". For example select the element in the middle of the array.\n\
    * All elements which are smaller then the pivot element are placed in one array\
    \ and all elements which are larger are placed in another array.\n* Sort both\
    \ arrays by recursively applying Quicksort to them.\n* Combine the arrays.\n\n\
    Quicksort can be implemented to sort \"in-place\". This means that the sorting\
    \ takes place in the array and that no additional array needs to be created. \n\
    \n### Program: Java program for implementation of QuickSort\n```java\nclass QuickSort{\n\
    \    /* This function takes last element as pivot,\n       places the pivot element\
    \ at its correct\n       position in sorted array, and places all\n       smaller\
    \ (smaller than pivot) to left of\n       pivot and all greater elements to right\n\
    \       of pivot */\n    int partition(int arr[], int low, int high) {\n     \
    \   int pivot = arr[high];\n        int i = (low-1); // index of smaller element\n\
    \        for (int j=low; j<=high-1; j++) {\n            // If current element\
    \ is smaller than or\n            // equal to pivot\n            if (arr[j] <=\
    \ pivot) {\n                i++;\n                // swap arr[i] and arr[j]\n\
    \                int temp = arr[i];\n                arr[i] = arr[j];\n      \
    \          arr[j] = temp;\n            }\n        }\n        // swap arr[i+1]\
    \ and arr[high] (or pivot)\n        int temp = arr[i+1];\n        arr[i+1] = arr[high];\n\
    \        arr[high] = temp;\n        return i+1;\n    }\n    /* The main function\
    \ that implements QuickSort()\n       arr[] --> Array to be sorted,\n       low\
    \ --> Starting index,\n       high --> Ending index*/\n    void sort(int arr[],\
    \ int low, int high) {\n        if (low < high) {\n            /* pi is partitioning\
    \ index, arr[pi] is\n               now at right place */\n            int pi\
    \ = partition(arr, low, high);\n            // Recursively sort elements before\n\
    \            // partition and after partition\n            sort(arr, low, pi-1);\n\
    \            sort(arr, pi+1, high);\n        }\n    }\n    /* A utility function\
    \ to print array of size n */\n    static void printArray(int arr[]) {\n     \
    \   int n = arr.length;\n        for (int i=0; i<n; ++i)\n            System.out.print(arr[i]+\"\
    \ \");\n        System.out.println();\n    }\n    public static void main(String\
    \ args[]) {\n        int arr[] = {10, 7, 8, 9, 1, 5};\n        int n = arr.length;\n\
    \        QuickSort ob = new QuickSort();\n        ob.sort(arr, 0, n-1);\n    \
    \    System.out.println(\"sorted array\");\n        printArray(arr);\n    }\n\
    }\n```\n**Output:** 1 5 7 8 9 10\n\n# Selection Sort\n\nSelection sort is a simple\
    \ algorithm. This sorting algorithm is an in-place comparison-based algorithm\
    \ which the list is divided into two parts, the sorted part at the left end and\
    \ the unsorted part at the right end. Initially, the sorted part is empty and\
    \ the unsorted part is the entire list. The smallest element is selected from\
    \ the unsorted array and swapped with the leftmost element, and that element becomes\
    \ a of the sorted array. This process continues moving unsorted boundary by one\
    \ element to the right. This algorithm is not suitable for large data sets as\
    \ its average and worst case complexities are of Ο(n²) where `n` is the number\
    \ of items.\n\n### Algorithm:\n1. Set `MIN` to location 0\n2. Search the minimum\
    \ element in the list\n3. Swap with value at location `MIN`\n4. Increment `MIN`\
    \ to next element\n5. Repeat until list is sorted\n\n### Program: Selection Sort\
    \ in Java\n```java\npublic class SelectionSort {\n    public static void selectionSort(int[]\
    \ arr) {\n        for (int i = 0; i < arr.length - 1; i++) {\n            int\
    \ index = i;\n            for (int j = i + 1; j < arr.length; j++) {\n       \
    \         if (arr[j] < arr[index]) {\n                    index = j;//searching\
    \ for lowest index\n                }\n            }\n            int smallerNumber\
    \ = arr[index];\n            arr[index] = arr[i];\n            arr[i] = smallerNumber;\n\
    \        }\n    }\n    public static void main(String a[]) {\n        int[] arr1\
    \ = {9,14,3,2,43,11,22};\n        System.out.println(\"Before Selection Sort\"\
    );\n        for (int i:arr1) {\n            System.out.print(i+\" \");\n     \
    \   }\n        System.out.println();\n        selectionSort(arr1);//sorting array\
    \ using selection sort\n        System.out.println(\"After Selection Sort\");\n\
    \        for (int i:arr1) {\n            System.out.print(i+\" \");\n        }\n\
    \    }\n}\n```\n**Output:**\nBefore Selection Sort: 9 14 3 2 43 11 22 \nAfter\
    \ Selection Sort: 2 3 9 11 14 22 43 58\n\n# Linked List\n\nA linked list is a\
    \ sequence of data structures, which are connected together via links. Linked\
    \ List is a sequence of links which contains items. Each link contains a connection\
    \ to another link. Linked list is the second most-used data structure after array.\
    \ Following are the important terms to understand the concept of Linked List.\n\
    \n* `Link`: Each link of a linked list can store a data called an element.\n*\
    \ `Next`: Each link of a linked list contains a link to the next link called `Next`.\n\
    * `LinkedList`: A Linked List contains the connection link to the first link called\
    \ `First`.\n\n### Linked List Representation\nLinked list can be visualized as\
    \ a chain of nodes, where every node points to the next node.\n![Linked List](OEBPS/image6121.jpg)\n\
    As per the above illustration, following are the important points to be considered:\n\
    \n* Linked List contains a link element called `first`.\n* Each link carries a\
    \ data field(s) and a link field called `next`.\n* Each link is linked with its\
    \ next link using its next link.\n* Last link carries a link as null to mark the\
    \ end of the list.\n\n### Types of Linked List\nFollowing are the various types\
    \ of linked list.\n\n* Simple Linked List: Item navigation is forward only.\n\
    * Doubly Linked List: Items can be navigated forward and backward.\n* Circular\
    \ Linked List: Last item contains link of the first element as next and the first\
    \ element has a link to the last element as previous.\n\n### Basic Operations\n\
    Following are the basic operations supported by a list.\n\n* `Insertion`: Adds\
    \ an element at the beginning of the list.\n* `Deletion`: Deletes an element at\
    \ the beginning of the list.\n* `Display`: Displays the complete list.\n* `Search`:\
    \ Searches an element using the given key.\n* `Delete`: Deletes an element using\
    \ the given key.\n"
