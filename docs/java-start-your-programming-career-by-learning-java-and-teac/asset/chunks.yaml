- fmt: "\n### Compilation Errors\n\n- a class tries to extend more than one class\n\
    - Overloading or overriding is not implemented correctly\n- attempt to refer to\
    \ a variable that is not in the scope of the current block\n- an inner class has\
    \ the same name as one of one its enclosing classes\n- a class contains one or\
    \ more abstract methods and the class itself is not declared \"abstract\"\n- a\
    \ class tries to reference a private member of another class\n- trying to create\
    \ an instance of an abstract class\n- trying to change the value of an already\
    \ initialized constant (final member)\n- declare two (class or instance) members\
    \ with the same name\n\n### Runtime Errors\n\nWhen the code compiles without any\
    \ error, there is still chance that the code will fail at run time. The errors\
    \ only occurs at run time are call run time errors. Run time errors are those\
    \ that passed compiler's checking, but fails when the code gets executed. \n\n\
    There are a lot of causes may result in runtime errors, such as incompatible type-casting,\
    \ referencing an invalid index in an array, using an null-object, resource problems\
    \ like unavailable file-handles, out of memory situations, thread dead-locks,\
    \ infinite loops(not detected!), etc.\n\nThe following are some common runtime\
    \ errors:\n\n- trying to invoke a method on an uninitialized variable (`NullPointerException`)\n\
    - ran out memory (memory leaks...) (`OutOfMemoryError`)\n- trying to open a file\
    \ that doesn't exist (`FileNotFoundException`)\n- trying to pass arguments to\
    \ a method which are not within the accepted bounds (`IllegalArgumentException`)\n\
    - trying to invoke the `start()` method on a dead thread (`IllegalThreadStateException`)\n"
