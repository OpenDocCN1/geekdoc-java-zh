  trans: '

    尽管这些示例中的某些细节超出了本书的范围，但我们确实提供了适用于这些问题和问题领域的底层技术。


    # 作为技术的算法


    假设计算机的速度是无限的，且内存是免费的。你还会去学习算法吗？答案是肯定的，即使不是为了其他理由，你仍然希望证明你的解决方案能够终止，并给出正确的答案。


    如果计算机的速度是无限的，那么解决问题的任何正确方法都是可行的。


    你可能希望你的实现符合良好的软件工程实践规范（例如，你的实现应该是良好设计并带有文档的），但你大多数情况下会使用最容易实现的方法。当然，计算机可能很快，但它们不是无限快的。内存可能很廉价，但不是免费的。


    因此，计算时间是一种受限资源，内存空间也是如此。你应该明智地使用这些资源，而在时间或空间上高效的算法将帮助你做到这一点。


    ## 存储位于何处？


    可视化程序运行时内容布局的某些方面是非常有用的——特别是内存是如何排列的。数据有五个不同的存储地方：


    1. **寄存器 (Registers)**。这是最快的存储器，因为它存在于与其他存储器不同的位置：处理器内部。然而，寄存器的数量非常有限，因此根据需要分配寄存器。你无法直接控制它，在你的程序中也看到寄存器存在的任何证据（相比之下，`C`
    和 `C++` 允许你向编译器建议寄存器分配）。

    2. **栈 (The stack)**。它存储在通用随机访问内存 (`RAM`) 区域，但通过栈指针获得处理器的直接支持。栈指针向下移动创建新内存，向上移动释放该内存。这是一种极其快速高效的存储分配方式，仅次于寄存器。Java
    系统在创建程序时必须知道存储在栈上的所有项的确切生命周期。这一限制限制了程序的灵活性，因此虽然栈上存在某些 Java 存储——特别是对象引用——但 Java
    对象本身并不放置在栈上。

    3. **堆 (The heap)**。这是一个通用的内存池（同样在 `RAM` 区域），所有的 Java 对象都存储在这里。堆的优之处是，与栈不同，编译器不需要知道该存储必须在堆上保留多久。因此，使用堆上的存储具有极大的灵活性。当你需要一个对象时，只需编写使用
    `new` 的代码来创建它，当该代码执行时，存储就会分配在堆上。当然，你为这种灵活性需要付出代价：分配和清理堆存储可能比栈存储花费更多时间（如果你在 Java
    中可以在栈上创建对象的话，就像在 `C++` 中那样）。

    4. **常量存储 (Constant storage)**。常量值通常直接放在程序代码中，这是安全的，因为它们永远不会改变。有时常量会被单独隔离，以便在嵌入式系统中可以可选地放置在只读内存
    (`ROM`) 中。

    5. **非 RAM 存储 (Non-RAM storage)**。如果数据完全位于程序之外，它就可以在程序未运行时存在，不受程序的控制。这里的两个主要例子是流式对象（streamed
    objects，将对象转换为字节流，通常用于发送到另一台机器）和持久化对象（persistent objects，将对象放在磁盘上，以便在程序终止时也能保持其状态）。这类存储的技巧是将对象转换为可以在其他介质上存在的东西，并在需要时复活为普通的基于
    RAM 的对象。Java 提供了轻量级持久化的支持，而 `JDBC` 和 `Hibernate` 等机制为在数据库中存储和检索对象信息提供了更高级的支持。


    ## 大 O 表示法 (Big O Notation)


    大 O 表示法是我们用来描述算法运行所需多久的语言。它是我们比较解决问题的不同方法效率的方法。


    假设你有一个包含 10 个对象的列表，你想对它们进行顺序排序。你可以使用很多算法来实现这一目标，但并非所有算法都是同质的。某些算法比其他的快，但更重要的是，算法的速度取决于它处理的条目数量。大
    O 是衡量算法扩展性的一种方法。大 O 参考的是算法的复杂程度。


    大 O 使用类似 `O(n)` 的符号表示。`O` 仅表示我们正在讨论的是大 O，你可以忽略它（至少在面试目的上）。`n` 是复杂度所相关的变量；对于编程面试题，这几乎总是指集合的大小。复杂度将根据数据存储的大小而增加或减少。


    下面是大 O 复杂度列表，按其相对于数据集的扩展性优坏排序：


    *   **O(1)/常数复杂度 (Constant Complexity)**：常数。这意味着无论数据集的大小有多大，算法将总是花费恒定的时间。1 个项目需要
    1 秒，10 个项目需要 1 秒，100 个项目也需要 1 秒。它总是花费相同的时间。

    *   **O(log n)/对数复杂度 (Logarithmic Complexity)**：没有常数好，但仍然很不错。花费的时间随数据集的大小而增加，但不是比例增加。这意味着相对于较大数据集，算法在较小数据集上每个项目花费的时间更多。1
    个项目需要 1 秒，10 个项目需要 2 秒，100 个项目需要 3 秒。如果你的数据集有 100 个元素，它需要 3 秒。

    *   **O(n)/线性复杂度 (Linear Complexity)**：集合越大，花费的时间按比例增长。1 个项目需要 1 秒，10 个项目需要 10
    秒，100 个项目需要 100 秒。

    *   **O(n log n)**：O(n log n) 的例子是归并排序。1 个项目需要 1 秒，10 个项目需要 33 秒，100 个项目需要 664
    秒。

    *   **O(n²)/二次复杂度 (Quadratic Complexity)**：情况开始变慢了。1 个项目需要 1 秒，10 个项目需要 100 秒，100
    个项目需要 10000 秒。

    *   **O(2^n)：指数级增长 (Exponential Growth!)**：每增加一个元素，算法花费的时间翻倍。1 个项目需要 1 秒，10 个项目需要
    1024 秒，100 个项目需要一个天文数字。


    示例：希望你到目前为止都能跟上，让我们来看一些示例。


