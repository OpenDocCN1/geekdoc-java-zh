    ); \n    } \n    public int noOfLegs() { \n        return 0; \n    } \n    public\
    \ static void main(String args[]) { \n        MammalInt m = new MammalInt(); \n\
    \        m.eat(); \n        m.travel(); \n    }\n}\n```\n\n这将产生以下结果：\n输出：\n```\n\
    Mammal eats\nMammal travels\n```\n\n在重写接口中定义的方法时，需要遵循若干规则：\n\n* 实现方法中不应在接口方法声明的异常或接口方法子类的异常之外声明受检异常（Checked\
    \ exceptions）。\n* 在重写方法时，应保持接口方法的签名以及相同的返回类型或子类型。\n* 实现类本身可以是抽象的，如果是这样，则不需要实现接口方法。\n\
