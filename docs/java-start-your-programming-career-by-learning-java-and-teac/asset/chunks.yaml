- fmt: "\n# Example: Following is an example that demonstrates how to achieve Encapsulation\
    \ in Java:\n\n```java\npublic class EncapTest {\n    private String name;\n  \
    \  private String idNum;\n    private int age;\n\n    public int getAge() {\n\
    \        return age;\n    }\n\n    public String getName() {\n        return name;\n\
    \    }\n\n    public String getIdNum() {\n        return idNum;\n    }\n\n   \
    \ public void setAge(int newAge) {\n        age = newAge;\n    }\n\n    public\
    \ void setName(String newName) {\n        name = newName;\n    }\n\n    public\
    \ void setIdNum(String newId) {\n        idNum = newId;\n    }\n}\n```\n\nThe\
    \ public `setXXX()` and `getXXX()` methods are the access points of the instance\
    \ variables of the `EncapTest` class. Normally, these methods are referred as\
    \ getters and setters. Therefore, any class that wants to access the variables\
    \ should access them through these getters and setters.\n\nThe variables of the\
    \ `EncapTest` class can be accessed using the following program:\n\n```java\n\
    public class RunEncap {\n    public static void main(String args[]) {\n      \
    \  EncapTest encap = new EncapTest();\n        encap.setName(\"James\");\n   \
    \     encap.setAge(20);\n        encap.setIdNum(\"12343ms\");\n        System.out.print(\"\
    Name : \" + encap.getName() + \" Age : \" + encap.getAge());\n    }\n}\n```\n\n\
    This will produce the following result:\nOutput:\nName: James Age : 20\n\n## Benefits\
    \ of Encapsulation:\n\n- The fields of a class can be made read-only or write-only.\n\
    - A class can have total control over what is stored in its fields.\n- The users\
    \ of a class do not know how the class stores its data. A class can change the\
    \ data type of a field and users of the class do not need to change any of their\
    \ code.\n"
