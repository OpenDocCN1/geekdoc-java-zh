    此命令执行 `javac` 命令（Java 编译器），它会编译 `src/myfirstapp` 目录下的 Java 源代码。`*.java` 意味着应该编译给定目录下的所有文件。


    `myfirstapp` 目录是根源目录 `src` 下的一个包（package）。如果你在根源目录下有多个包，你将必须多次运行 Java 编译器。Java
    IDE 会自动为你处理这些工作。像 `Ant`、`Maven` 或 `Gradle` 这样的构建工具也是如此的。


    ### 运行编译后的 Java 代码


    一旦编译器完成工作，`classes` 目录将将包含编译后的 `.class` 文件。源目录的包结构（目录结构）将在类目录予以保留。你可以运行任何一个包含
    `main()` 方法的 `.class` 文件。你可以在你的 Java IDE 内部运行该 `.class` 文件，也可以从命令行运行。从命令行运行，它看起来如下：


    ```

    "c:\Program Files\Java\jdk1.8.0_25\bin\java" -cp classes myfirstapp.MyJavaApp

    ```


    `-cp classes` 标志告诉 Java 虚拟机所有的类都位于名为 `classes` 的目录下。这也被称为“类路径”（Class Path，缩写为
    `cp`）。要运行的类名是上述命令中的最后一个参数——`myfirstapp.MyJavaApp` 部分。JVM 需要知道全限定类名（所有包名加上类名）以确定相应的
    `.class` 文件的位置。


    当你运行该类时，你的命令行将看起来类似于所示（包括 Java 应用程序的输出）：


    ```

    D:\data\projects\my-first-java-app>"c:\Program Files\Java\jdk1.8.0_25\bin\java"    -cp
    classes myfirstapp.MyJavaApp

    Hello World!

    D:\data\projects\my-first-java-app>

    ```


    （注意，第一条命令不应该包含换行符。我之所以那样写只是为了方便阅读。）


    就是这样！现在你知道如何编译和执行你的 Java 应用了！如之前提到的，使用 IDE 可能会更容易，但你可能在任何想要执行代码的地方都没有 IDE。


    # 第 3 章 | 基础术语


    本节将涵盖许多基础术语以及编写规范代码的一些基本思想。Java 是许多不同编程语言之一，它们使用相同的词汇和概念来向计算机传递指令。一旦我们读完前几章，我们将接触更多与读写代码直接相关的基础知识。在达到那之前，我们需要涵盖一些适用于许多不同编程语言的术语和概念，而不仅仅是
    Java。允许将单词转换为可执行代码的方法和系统需要相当严格的规则。在写英语或在网上聊天时，我们倾向于忽略格式和标点符号。这种简洁允许了更快的沟通，但这仅仅是因为我们人类已经学习了许多新词，并能够根据上下文更好地解释网络或短信中使用的英语形式的缩写和术语。计算机并没有那么智能，能够那么轻易地解读我们的单词。


    ### 标记 (Tokens)


    在书面英语中，语言的最小元素是字母和数字。单独来说，大多数字母和数字并没有特定的意义。字母之后更大的元素是单词。每个单词都有更多的含义，但复杂的思想很难通过一个单词来表达。为了传达一个思想，我们使用句子。句子中的每个单词都有特定的用途，如下图所示。为了传达一个概念，我们使用组合成段落的句子。为了传达情感，我们使用组织成章节的许多段落。为了讲述故事，我们使用书，即章节的集合。


    ![](img/image496.jpg)


    编程具有类似的组织机制。最小的有意义的元素是 `token`（标记），接着是语句、代码块、函数，然后是类和命名空间，最后是程序，或者在我们的案例中是一个游戏。我们将从最小的元素开始，逐步编写我们自己的类。然而，在开始编写任何复杂代码之前，了解最微的元素对于理解所有部分是如何结合在一起的是非常重要的。


    ### 编写 Java


    Java 是一门基于英语的编程语言；像任何其他 C 类编程语言一样，它可以被拆分为标记，即计算机可以理解的最小意义文本片段。标记由单个字符或一系列字符组成。例如，在像下面的简单语句中有五个标记。


    ![](img/image511.jpg)


    标记可以分类为 `keyword`（关键字）、`identifier`（标识符）、`literal`（字面量）、`operator`（运算符）、`separator`（分隔符）和
    `white space`（空白）。上面的语句包含五个标记，并通过空白提供了间距。关键字 `int` 后面紧跟着标识符 `i`。接着是一个运算符 `=`，它将运算符左侧的标识符赋值为右侧字面量
    `0` 的值。最后一个标记 `;` 是 `separator`（分隔符），用于结束语句。空白和我们尚未涵盖的注释不被视为标记，尽管它们可以充当分隔符。使用适当的格式或风格是非常重要的。


    让我们来看代码示例：

    ```java

    int i = 0;      int j = 1;

    ```


    上述代码是两个语句，`separator` 防止了计算机将代码误读为单条语句。然而，编写代码的过程中涉及人类，因此代码需要让人类（或任何可能阅读你代码的生命形式）读。规范的代码意味着遵循特定的格式风格。我们将在本章稍后部分深入讨论规范代码风格。每组字符或文本都由词法分析器（有时称为扫描器
    lexer）在计算机中转换成符号。这个过程被称为标记化，或者正如计算机科学家所说，扫描器将你的代码标记为符号。一旦标记完成，符号就会被解析；这个过程将标记组织成计算机遵循的指令。


