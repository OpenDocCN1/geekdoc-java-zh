    # 与机器相关的数学问题


    他们缺乏数值数学技能，并且不理解如果不留心，浮点运算为何会让你失败。


    # 成为优秀程序员的 9 种方法！


    ## 1. 练习


    除了跟随教程之外，你应该致力于自己的项目。“最基础的一点是你实际上在去写代码。我听过有人建议，当你大学毕业时，你至少应该写过 100,000 行代码。”——
    来自 Evernote 的 Andrei Thorp。


    但你可能会问，我该如何开始呢。“我总是告诉人们，找一些你每周要做一次以上的事情，并尝试将其自动化。不要管别人是否已经解决过这个问题，为你自己制作一个工具或实用程序来解决生活中的常见问题即可。”——
    Stack Overflow 移动负责人 Kasra Rahjerdi。


    “就像任何其他技能一样，它需要练习——刻意练习，走出舒适区并学习细微差别和微妙之处——这正是区分优秀与优秀的关键。”—— WatchMeCode.net 的创建者
    Derick Bailey。Derick 是 StackOverflow 前 0.42% 的用户，还贡献过 MarionetteJS 和 BackboneJS
    等开源框架。


    失败了没关系。编码完全关乎失败和修复问题，以及学习如何做得更好。如果你不去构建东西，并且不在你已知薄弱的领域下努力，你永远不会好起来。


    如果你需要关于如何改进以及你在哪些方面做得不够好的建议，请随时向经验丰富的开发者寻求帮助，让他们通过审查你的代码或为你讲解你遇到困惑的概念来帮助你重回正轨。


    ## 2. 保持耐心


    这是显而易懂的，但你很容易因为缺乏进展而感到沮丧，并忘记你并不孤单。“成为一名优秀的程序员需要长、长的时间和许多枯燥的夜晚。在写出好的代码之前，你必须写几十万行代码。”——
    Mike Arpaia，前 Etsy 的开发人员，现在为 Facebook 构建信息安全软件。


    Mike 强调，初学者应该放弃“可以快速成为优秀开发者”的假设。但是……如果你甚至还没过教程阶段呢？如果你仍然在撞南墙，并怀疑也许自己根本不是搞编程的料呢？在急下结论之前，请记住每个人都有不同的学习风格。《Ruby
    on Rails Tutorial》的作者 Michael Hartl 指出，初应该尝试尝试不同的资源（书籍、视频等）来观察哪些能让你“开窍”。


    事实上，Reserve 的 CTO Craig Coffman 本人通过大量的尝试错误以及选择个人化且有趣的项目学到了很多。然而，由于所有有趣的挑战都是大挑战，他建议初学者从切分合理尺寸的部分开始。这样，当你失去兴趣或被困住时，你仍然会有进步感和成就感。


    ## 3. 保持兴趣


    如果你对正在做的项目感到无聊，你可能应该重新考虑学习编程的任何高远目标。或者，也许你只是在做错误的项目，或者通过错误的资源进行学习。始终通过致力于让你兴奋的个人项目来让自己保持动力。


    LGBTech 的创始人、Rails 和 RSpec 等知名开源项目的贡献者 Coraline Ada Ehmke 从从小就出于兴趣开始编写代码。然而，她在大学作为计算机科学专业的第一门课让她怀疑了自己的热忱。


    “我记得我们一个学期的项目是为 ATM 机机写软件。我感到非常无聊且没有挑战性，我决定如果工程师的生活就是这样，我不想参与其中任何部分，所以我不久后退学了。”


    然而，她继续从事她认为有趣的项目。到 1993 年时，她已经在在线并构建网站，从那以后一直在开发 Web 应用。


    ## 4. 热爱错误


    作为初学者，你可能会深陷 Bug 之中。如果你被所有的红色（报错信息）吓到，你并不孤单。曾在 Zendesk 编写过代码、现在工作于 ScienceExchange
    的 UX 工程师 Ross Chapman 承认在刚开始时是个胆胆的开发者。


    “我当时没有耐心，因为我还没准备好去热爱修复问题的挑战。但这基本上是我所有坏习惯的根源。”


    话虽如此，Ross 敦促初学者将错误视为至关重要的学习时刻。由于你的一生都在进行调试，你应该习惯错误并学会识别错误信息。“能够快速解析和理解错误信息将为你节省大量时间，并让你走得更远。你尝试过的这一事实，向你寻求帮助的人会非常感激。”——《Beginning
    jQuery》作者 Jack Franklin。


    Jack 还建议初学者起初尝试独立解决问题。当调试时遇到瓶颈时，React 的共同贡献者 Lee Byron 会通过大量使用调试工具亲自尝试理解发生了什么。


    “一旦我确切理解了发生了什么——一步一步来——我就可以将其与我预期发生的情况进行对比，隔离出令人惊讶的部分，并看看我的假设哪里错了，或者某些代码是如何导致这种意外情况的。”


    然而，错误不仅限于 Bug。有时，你会做出错误的决定，例如使用错误的数据结构。根据 Mike 的说法，在这些错误决定上吃过最终将帮助你学会何时使用某些设计模式是合理的


    ## 5. 理解事物运作的原理


