    etc. It is a good practice to group related classes implemented by you so that
    a programmer can easily determine that the classes, interfaces, enumerations,
    and annotations are related.Since the package creates a new namespace there won''t
    be any name conflicts with names in other packages. Using packages, it is easier
    to provide access control and it is also easier to locate the related classes.Creating
    a Package:While creating a package, you should choose a name for the package and
    include a package statement along with that name at the top of every source file
    that contains the classes, interfaces, enumerations, and annotation types that
    you want to include in the package.The package statement should be the first line
    in the source file. There can be only one package statement in each source file,
    and it applies to all types in the file.If a package statement is not used then
    the class, interfaces, enumerations, and annotation types will be placed in the
    current default package.Example:Let us look at an example that creates a package
    called animals. It is a good practice to use names of packages with lower case
    letters to avoid any conflicts with the names of classes and interfaces.Following
    package example contains interface named animals −/* File name : Animal.java */package
    animals;interface  Animal  {   public  void eat();   public  void travel();}Now,
    let us implement the above interface in the same package animals −package animals;/*
    File name : MammalInt.java */public  class  MammalInt  implements  Animal  { public  void
    eat()  {      System.out.println("Mammal eats");   } public  void travel()  {      System.out.println("Mammal
    travels");   } public  int noOfLegs()  {      return  0;   } public  static  void
    main(String args[])  {      MammalInt m =  new  MammalInt();      m.eat();      m.travel();   }}Now
    compile the java files as shown below −$ javac -d . Animal.java$ javac -d . MammalInt.javaYou
    can execute the class file within the package and get the result as shown below.Mammal
    eatsMammal travelsThe import Keyword:If a class wants to use another class in
    the same package, the package name need not be used. Classes in the same package
    find each other without any special syntax.Example:Here, a class named Boss is
    added to the payroll package that already contains Employee. The Boss can then
    refer to the Employee class without using the payroll prefix, as demonstrated
    by the following Boss class.package payroll;public  class  Boss  { public  void
    payEmployee(Employee e)  {      e.mailCheck();   }}What happens if the Employee
    class is not in the payroll package? The Boss class must then use one of the following
    techniques for referring to a class in a different package.


    *   The fully qualified name of the class can be used. For example −


    payroll.Employee


    *   The package can be imported using the import keyword and the wild card (*).
    For example −


    import payroll.*;


    *   The class itself can be imported using the import keyword. For example −


    import payroll.Employee;Note − A class file can contain any number of import statements.
    The import statements must appear after the package statement and before the class
    declaration.Access ModifiersAs the name suggests access modifiers in Java helps
