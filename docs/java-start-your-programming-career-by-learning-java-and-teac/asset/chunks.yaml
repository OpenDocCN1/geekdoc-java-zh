  trans: "\n\n# 插入操作\n\n在链表中添加新节点是一个多步骤的操作。我们在这里通过图示来学习这一过程。首先，使用相同的结构创建一个节点，并找到它需要插入的位置。\n\
    \n![链表插入](img/image6168.jpg)\n\n假设我们正在 `A` (`LeftNode`) 和 `C` (`RightNode`) 之间插入节点\
    \ `B` (`NewNode`)。然后将 `B.next` 指向 `C` - `NewNode.next -> RightNode;` - 它看起来应该是这样——![链表插入](img/image6177.jpg)\n\
    \n现在，左侧的节点应该指向新节点。`LeftNode.next -> NewNode;` -![链表插入](img/image6189.jpg)\n\n\
    这会将新节点放在两个节点中间。新的链表应该像这样——![链表插入](img/image6194.jpg)\n\n如果在链表开头插入节点，也应该采取类似的步骤。在末尾插入时，链表的倒数第二个节点应该指向新节点，而新节点将指向\
    \ `NULL`。\n\n# 删除操作\n\n删除也是一个多步骤的过程。我们将通过图示表示来学习。首先，使用搜索算法定位要删除的目标节点。![链表删除](img/image6201.jpg)\n\
    \n目标节点的左侧（上一个）节点现在应该指向目标节点的下一个节点 – `LeftNode.next -> TargetNode.next;` -![链表删除](img/image6213.jpg)\n\
    \n这将移除指向目标节点的链接。现在，使用以下代码我们将移除目标节点所指向的内容。`TargetNode.next -> NULL;` -![链表删除](img/image6220.jpg)\n\
    \n我们需要使用被删除的节点。我们可以将其保留在内存中，否则我们可以简单地释放内存并完全清除目标节点。![链表删除](img/image6225.jpg)\n\
    \n# 反转操作\n\n这个操作是彻底的。我们需要让头节点指向最后一个节点，并反转整个链表。![链表反转](img/image6236.jpg)\n\n首先，我们遍历到链表的末尾。它应该指向\
    \ `NULL`。现在，我们将让它指向它的上一个节点——![链表反转](img/image6241.jpg)\n\n我们必须确保最后一个节点没有丢失。因此我们将有一个\
    \ `temp` 节点，它看起来就像头节点指向最后一个节点。现在，我们将让所有左侧节点一个个指向它们的上一个节点。![链表反转](img/image6246.jpg)\n\
    \n除了头节点指向的节点（第一个节点）外，所有节点都应该指向它们的驱节点，成为它们新的继。第一个节点将指向 `NULL`。![链表反转](img/image6256.jpg)\n\
    \n我们将使用 `temp` 节点让头节点指向新的第一个节点。![链表反转](img/image6261.jpg)\n\n链表现在已经反转。\n\n# 程序\n\
    \n给定一个有序链表，你如何以排序的方式插入？\n\n## 算法\n\n假设输入的链表按升序排列。\n1) 如果链表为空，则将节点设为头节点并返回它。\n\
    2) 如果要插入节点的值小于头节点的值，则将节点插入开头并将其设置为头节点。\n3) 在循环中，找到输入节点（假设为 9）应该插入之后的合适节点。要找到合适的节点，从头节点开始，一直移动直到到达一个值大于输入节点的节点\
    \ `GN`（下方图中为 10）。`GN` 之前的节点就是合适的节点 (7)。\n4) 在步骤 3 找到的合适节点 (7) 之后插入节点 (9)。\n\n\
    ### 初始链表\n![有序链表](img/image6299.jpg)\n\n### 插入 9 之后的链表\n![更新后的有序链表](img/image6309.jpg)\n\
    \n```java\nclass LinkedList{\n    Node head; // 链表头部 head of list\n    /* 链表节点*/\n\
