    “无论你处于什么水平，我都会说这句话：永远不要在不知道代码为何运行（直到底层原理）的情况下编写任何代码。比方，要保持痴迷的好奇心。成为源代码世界的印第纳·琼斯。好奇心是工程师的一种永恒特质。我认为，如果你不带着好奇的心情盯着显示器，是无法在这个行业立足的。既要像孩子一样，又要像学者一样严谨。”——
    Ross Chapman


    可以说，仅仅有兴趣是不够的。如果你的目标是成为一名体面的专业开发者，你就必须努力理解事物是如何运作的。”


    “你可以通过筛选 StackOverflow 上的问题来开始理解你使用的工具。我从从中学到了一点东西。[那些顶部的 AngularJS 问题] 读起来非常有趣，因为
    Angular 是一个如此巨大的框架。”—— Todd Motto，AngularJS 大会演讲者，Google 开发者专家。


    Spotify 的高级基础设施工程师 Rohan Singh 强调了努力理解当前工作内容下方一个层级栈的重要性。Rohan 说：“作为软件工程师，我们所做的一切都涉及在某种抽象层面上工作。”换句话说，如果你使用某种数据库，你可以完全掌握数据库的内部机制，并期望它“能够正常工作”。


    此外，为了真正理解事物是如何运作的，你应该能够解释为什么某些技术选择比其他选择更好，并在事物运行不符合预期时能够排除故障。Rohan 在实践中通过做到这一点：尝试一点一点地学习并理解他所使用的任何平台或系统的基础——无论是
    `Python`、`Go` 还是 `Linux` 操作系统。据他所，这最终有助于你建立一个关于底层运行机制的心理模型，并拓宽你的知识基础。


    最终，你将作为工程师而成长，而且此外，通过学习如何进行“后仰式”（lean back）调试而非“前倾式”（lean in）调试，你可以更高效地进行调试。换句话说，你会后仰并深度思考底层运行机制，以找出问题可能所在。Rohan
    说：“这比使用交互式调试器或其他工具进行‘前倾式’调试要快得多，而且涉及的盲目尝试少得多。”


    事实上，来自 Evernote 的 Andrei Thorp 认为每个人应该尽早学习基础的 `C`。因为它是极简的且没有为你做太多，它迫使你从更底层去理解计算机到底是如何运作的。例如，`C`
    让你自己管理所使用的内存——这意味着以后当你使用像 `Python` 的工具时，你实际上理解 `Python` 在为你做了什么。然后，当你看到奇怪的 Bug
    时，你脑中会有这套工具箱来理解问题可能在哪里。


    ## 6. 持续学习新事物


    ***


    没有什么比做一份糟糕且平庸的编程工作更能扼杀你的职业/技艺轨迹了。去那些能让你被鼓励/迫使不断学习新技巧的地方吧，”Jonathan Henson 说道，他目前工作在
    `Amazon Web Services`。Jonathan 每年都会尝试学习一种新的编程语言、范式或技术栈。然后他会将自己投入到有机会应用这些技能的项目中。


    “我认为要学习的最重要技能是元学习（meta-learning），”Kasra 说，“在我看来，这就是工程师和程序员的区别。花 12 周时间在某门课程中精通一个框架确实有其价值，但我非常尊重（并喜欢雇用）那些能够根据任务需要即刻学习任何技能的开发者。”


    那么，学习新技能最好的方法是什么？


    阅读关于你想做的事情是一个开始。Steve Klabnik 是 `Rust` 核心团队成员，并在史上 `Rails` 贡献者列表中排名第 37，他寻找关于该主题的任何既有研究，并试图弄清楚擅长你想做的事情是如何获得结果的。最重要的一点就是去做：


    1. 尝试去做那件事，可能做得很糟糕。

    2. 弄清楚我哪里错了，我需要改进什么。

    3. 针对已识别的问题努力。

    4. 重复。”


    Bellhops 的 CTO Adam Haney 说，他学习新语言最喜欢的技巧是使用新语言的范式重新实现之前的之前的项目。例如，他会把以前用 `C++`
    编写的面向对象的代码，然后用函数式语言重新实现一遍。


    我觉得这种实践让我做好了评估新技术的准备，因为我理解底层的计算机科学原理，即使我不了解语言或框架的复杂细节。


    如果你在记忆方面感到吃力，Andrei 建议建立一个“记忆宫”。通用的想法是利用大脑强大的视觉记忆，并将其映射到更技术的数据上（如数字）。他也非常坚信像“西因德日历”（The
    Seinfeld Calendar）之类的技巧，这种方法基于 Jerry Seinfeld 的观点：你不需要每天都努力工作——你只需要每天进步一点点。“所以通过他的日历，你只需要勾选今天是否处理了该项目，”Andrei
    说，“有一些很棒的 App 可以帮助你。在 `Android` 上，我使用 `HabitBull`。随着你的连续记录（streak）越长，你越有动力坚持下去。”


    ## 7. 学习如何与他人协作


    ***


    学习新事物的另一种方法是与他人一起合作项目。


    “独行侠程序员的传奇是一个神话，”Adam 说，“几乎所有实质性项目都需要团队协作。”这意味着你需要学习将问题拆分为多个部分的技能，在代码库的不同部分之间构建良好的接口，以及在架构上进行协作。


    “与一群志同道合且能挑战你的工程师一起工作绝对会让你进入快车道，”Craig 说，“孤立工作很难让你发现自己犯了愚蠢的错误，也难以学习新事物。”


    每个人都会犯错——编程就是如此。初学者应该努力留在优秀的工程师身边并获得反馈。“不要对你的错误敏感，”Jonathan 强调道，“那是你进步的方式。承认你的错误并从中学习。”


    进行代码审查（code review）也会迫使你思考为什么那样做，并更好地理解代码。“我最喜欢的合作的工程师是那些不会在你写的代码问题上放过你的人，”Ross
    说，“我记得我第一次被挑战时，我吓得坏极了。但那天晚上我回家一直在学习，直到我知道我至少可以自信地解释如何在闭包（closures）中传递这些内容。”


    那么，你在哪里能找到可以与你结对并帮助你的导师或同伴呢？根据 Jack 的说法，当地的聚会（meetups）通常会有为任何需要的人提供免费指导的环节。其他免费资源包括
    Twitter 群组、Slack 群组和 IRC 频道。


    ## 8. 不要仅仅写代码——构建解决方案


    ***


