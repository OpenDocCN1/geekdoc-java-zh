    “编程很大程度上不在于代码，而在于理解其他学科或标准。如果你不理解对方的问题，你就无法用代码来解决他们的问题。参与项目让我接触到了小微企业、营销人员、经纪人和其他专业人士看待世界的方式。当你理解了他们目前如何解决问题时，你就能与他们合作，提出新颖更好的解决方案。”——Adam
    Haney，Bellhops 技术官。


    Ross 希望自己在职业生涯的早些能更好地欣赏 `Software Engineering`（软件工程）学科本身的严谨性和历史。如今，人们很容易投入这一职业并只专注于“编码”。尤其是在一个繁荣的市场中，作为浏览器编码员或
    Web 应用编码员，处理着巨大的动态编程语言（`Ruby`、`JavaScript`）以及极其奇特的“计算机”语言和格式（`HTML`、`CSS`），我们可能会倾向于花费所有时间去追逐掌握无数工具、框架和
    API，以便在面试中脱颖而出或在工作中获得晋升。


    但在团队中构建产品始终是一项社交活动，而且是一项具有独特挑战的活动，这些挑战大多是非技术性的。事实证明，`software engineering` 中困难的事情是决定构建什么，而不是如何构建；尽管随着
    `JavaScript` 菌丝体根结构的剧烈扩张，这一点可能变得没那么绝对了。


    Ross 说，他花了一段时间才理解，大多数的 `software engineering` 首先发生在你的脑海中。“编码很快就会变成最容易的部分。但一个顶级的工程师可以用方框、圆圈和线条画出解决方案——我知道这是一项可以习得的技能，因为我做得越来越多，而且正变得越来越好。”这种意识到编码远更多是“托腮沉思和白板设计”的感觉对他实际上产生了巨大的共鸣，他为此写了一篇博客。


    “记住，这关乎人类和我们的生活，而不仅仅是你正在编写的技术，”Derick 说，“学习人类如何思考、互动和相处。然后将你学到的知识体现在你的 `software
    architecture` 和设计中。”


    ## 9. 不要重复发明轮子


    最后，无论你变得多优秀，你的代码永远都不可能是 100% 原创的，因为许多问题在你选择的语言中已经被解决了。“保持轮子原样完全无害，”Ross 保证道，“然而，当需要提交时，你最好百分之确定你能像德云·约翰逊（Dwayne
    Johnson）那样充满魅力和自信地向团队捍卫那些代码。”


    “不要因为你不理解某个抽象就重复发明轮子，”Mike 提醒我们。然而，这并不是说重复发明轮子没有任何价值。`Clarifai` 的首席执行官 Matthew
    Zeiler 鼓励人们如果对某些东西感兴趣，就去构建已有解决方案的东西。从零开始构建工具将帮助你学习更多关于 `software engineering`、`system
    design`、`scalability` 等知识。


    ## 结论


    在学习如何开发应用或项目时，挫折无处不在，但希望以上建议能让你在成为开发者的道路上感到更有信心。# 伟大程序员的 4 个秘诀！


    ### 1. 关于职业


    *   编写可以被他人阅读、理解和操作的代码。这使你能够交接任务并承担新挑战。

    *   如果你囤积知识，你将成为这些知识的唯一守护者——在工程/业务导向的组织中，这是一种意味着风险。

    *   停止为代码或在黑客松中幸存感到自豪，这在永久性的团队中毫无意义。执行和协作将带你走远。


    ### 2. 关于解决方案和编码


    *   如果你不能向非程序员解释它，你可能过度复杂化或过度优化了。

    *   如果你画不出架构图，你可能也把它复杂化了。

    *   不要通过编写“紧凑的代码”来炫耀。


    ### 3. 关于个人进步


    *   不要成为 `Java` 或 `C/C++`（或其他）的粉丝。在长期的职业生涯中，你将学习 10 多种语言。将它们视为工具，而不是盲随的大流。

    *   总会有更优秀的程序员，而且他们很难识别。向他们所有人学习。

    *   你的价值并不由你代码的质量定义。不要那样评价自己。


    ### 4. 关于哲学


    *   编程是一门让非程序员能够比他们独立完成更多事情的艺术。

    *   计算机科学是世界上几乎每个研究领域或行业的催化剂。计算机科学让人类能够做更多、解决更多、变得更好。

    *   计算机科学 != 编程。如果你的大学只教你如何写程序，去要求退款吧。


    ## 程序员、优秀程序员与伟大程序员的区别


    *   **程序员 (Programmer)**：任何在给定足够详细的问题描述的情况下，能写出运行程序来解决问题的人。

    *   **优秀程序员 (Good programmer)**：与他人协作创建可维护的、优雅的程序，供客户使用，按时交付且缺陷率低，且几乎或没有人际关系纠葛。

    *   **伟大程序员 (Great programmer)**：优秀的程序员，他们能直觉地理解算法和架构，可以在很少监督的情况下构建自洽的大型系统，可以发明新算法，可以在不破坏现有系统的情况下重构运行系统，能够就技术和非技术问题与非技术人员进行有效且有力的沟通，理解如何克制自我表现，并将自己的技能教给他人。


    成为伟大程序员的道路是从成为一名程序员开始，然后培养成为优秀程序员所需的技能，并练习这些技能直到精通。这所需的时间取决于你的个人能力，也取决于你职业生涯中的经历和机会，以及你如何应对。


    ## 程序崩溃的 4 个原因


    有 4 个原因会导致你的程序崩溃：


    *   你的程序可能依赖某些随机因素：用户输入、随机生成的数字等。

    *   如果你的程序使用了未初始化的变量，它可能会访问不该访问的数据（访问数组越界也是如此）。

    *   你的程序可能使用了一个经常崩溃的外部库。

    *   栈溢出（Stack overflows）！


    ## 编程格言


    “语言是廉价的。Show 代码。”——Linus Torvalds


    “程序必须为了人类阅读而编写，不仅仅是为了机器执行。”——Harold Abelson, `Structure and Interpretation of
    Computer Programs`


    “今天的编程是软件工程师努力构建更大更好的防呆程序，与宇宙试图产生更大、更好的傻瓜之间的竞争。到目前为止，宇宙赢了。”——Rick Cook, `The Wizardry
    Compiled`


    “编写代码时，要假设维护代码的人是一个知道你住址的暴力狂魔”——John Woods


    “那些认为自己讨厌电脑的人，他们真正恨的是糟糕的程序员。”——Larry Niven“最好的程序是为了让计算机运行得更快，同时也让人类清晰地理解。理想的程序员像是一位散文家，使用传统的审美和文学形式，也使用数学概念来交流算法的工作原理并说服读者结果是正确的。”——Donald
    Ervin Knuth, `Selected Papers on Computer Science`


    “我不是伟大的程序员，我只是一个拥有良好习惯的优秀程序员。”——Kent Beck


    “众所周知，调试比编写程序困难两倍。所以如果你在写程序时表现得尽可能的聪明，那你以后该如何调试它呢？”——Brian W. Kernighan


