    # 重用实现


    一旦类被创建并经过了测试，它（理想情况下）应该代表一个有用的代码单元。事实证明，这种可重用性并不像许多人希望的那样那么容易实现；产生一个可重用的对象设计需要经验和洞察力。但一旦你拥有了这样的设计，它就迫不及待地想要被重用。代码重用面向对象编程语言提供的最大优势之一。


    重用一个类最简单的方法是直接使用该类的对象，但你也可以将该类的对象放在一个新的类内部。我们称这为“创建成员对象”。你的新类可以由任何数量和类型的其它对象组成，并以任何所需的组合来实现你新类中所需的功能。由于你是从现有的类组合出一个新类，这个概念被称为
    `composition` (组合)（如果组合是动态发生的，通常被称为 `aggregation` (聚合））。组合通常被称为“具有”（has-a）关系，例如“汽车有一有一个引擎”。


    ![](img/image4011.jpg) (此 UML 图表用实心菱形表示组合，表示有一辆汽车。我通常会使用更简单的形式：只需一条线，不带菱形，表示关联。5)


    组合带来了极大的灵活性。你新类的成员对象通常是私有的，使得使用该类的客户端程序员无法访问它们。这允许你更改这些成员而不而不影响现有的客户端代码。你还可以在运行时更改成员对象，以动态更改程序的行为。接将描述的继承则不具备这种灵活性，因为编译器必须对通过继承创建的类加上编译时的限制。


    由于继承在面向对象编程中如此重要，它经常被高度强调，新程序员可能会产生“继承应该在处处使用”的观念。这可能导致设计变得笨拙且过于复杂。相反，在创建新类时，你应该首先考虑组合，因为它更简单、更灵活。如果你采用这种方法，你的设计将会更加整洁。一旦你有了一些经验，什么时候需要继承将变得变得显而易见。


    # 继承


    就本身而言，对象的概念是一个方便的工具。它允许你根据概念将数据和功能封装在一起，这样你可以表示一个合适的问题空间想法，而不是被迫使用底层机器的惯用法。这些概念通过使用
    `class` 关键字作为编程语言中的基本单元来表示。


    然而，费尽周力创建一个类，然后又被迫创建一个可能具有相似功能的全新类，这似乎很遗憾。如果我们能获取现有的类，克隆它，然后对克隆进行添加和修改，就会更好。这实际上是你通过继承获得的内容，只不过如果原始类（称为
    `base class`、`superclass` 或 `parent class`）发生了变化，修改后的“克隆”（称为 `derived class`、`inherited
    class`、`subclass` 或 `child class`）也会反映这些变化。


    ![](img/image4027.jpg) (此 UML 图中的箭头从派生类指向基类。正如你所看到的，通常有一个以上的派生类。)


    类型不仅描述一组对象的约束；它还与其他类型有着关系。两个类型可以有共同的特征和行为，但一个类型的特征可能比另一个类型更多，并且可能处理更多的消息（或以不同的方式处理）。继承通过使用
    `base types` (基类型) 和 `derived types` (派生类型)的概念来表达类型之间的相似性。基类型包含了所有源自它的类型共享的特征和行为。你创建一个基类型来表示你对系统中某些对象的想法的核心。从基类型中，你派生出其他类型，以表达该核心实现的不同方式。


    例如，一台垃圾回收机对垃圾进行分类。基类型是“垃圾”，每件垃圾都有重量、价值等，并且可以被粉碎、熔化或分解。从这里，派生出了更具体的垃圾类型，这些类型可能具有额外的特征（瓶子有颜色）或行为（铝罐可以被压扁，钢罐具有磁性）。此外，某些行为可能不同（纸张的价值取决于它的类型和状况）。使用继承，你可以构建一个类型层次结构，用它的类型术来表达你正试图解决的问题。


    第二个例子是经典的“形状”示例，可能用于计算机辅助设计系统或游戏模拟。基类型是“形状”，每个形状都有尺寸、颜色、位置等。每个形状都可以绘制、擦除、移动、着色等。从这里，派生（继承）了特定的形状类型——圆形、正方形、三角形等——每个形状都可能具有额外的特征和行为。例如，某些形状可以翻转。某些行为可能不同，例如当你想要计算形状的面积时。类型层次结构体现了形状之间的相似性和差异。


    ![](img/image4035.jpg)


    用与问题相同的术语来构建解决方案非常有用，因为你不需要大量的中间模型就可以从问题的描述到解决方案的描述。对于对象，类型层次结构是主要的模型，因此你直接从现实世界中的系统描述转到代码中的系统描述。事实上，人们在面向对象设计中面临的困难之一是，从开始到结束的过程太简单了。一个习惯于寻找复杂解决方案的大脑最初会被这种简单性所困住。


    当你从一个现有类型继承时，你就创建了一个新类型……（注：原文此处有大量重复的句子，已根据核心逻辑进行了处理）。


