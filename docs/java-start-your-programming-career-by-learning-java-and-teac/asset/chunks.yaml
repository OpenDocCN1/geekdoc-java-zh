    the right to the type needed on the left.KeywordsKeywords are special words, or
    symbols, that tell the compiler to do specific things. For instance, the keyword
    class at the beginning of a line tells the compiler you are creating a class.
    A class declaration is the line of code that tells the compiler you’re about to
    create a new class. The order in which words appear is important. English requires
    sentences and grammar to properly convey our thoughts to the reader.In code, Java
    or otherwise, programming requires statements and  syntax to properly convey instructions
    to the computer.class className{// code goes here}Every class needs a name; in
    the above example we named our class className, although we could have easily
    named the class Charles. When a new class is named the name becomes a new identifier.
    This also holds true for every variable’s name, though scope limits how long and
    where the variable’s identifier exists.We have learned about variables and scope.You
    can’t use keywords for anything other than what Java expects them to be used for.
    There are exceptions, but in general, keywords provide you with specific commands.In
    the Java programming language, a keyword is one of 53 reserved words  that have
    a predefined meaning in the language; because of this, programmers cannot use
    keywords as names for variables, methods, classes, or asany other identifier.  Due
    to their special functions in the language, most integrated development environments for
    Java use syntax highlighting to display keywords in a different color for easy
    identification.List of Keywords:abstractAbstract is used to implement the abstraction
    in java. A method which doesn’t have method definition must be declared as abstract
    and the class containing it must be declared as abstract. You can’t instantiate
    abstract classes. Abstract methods must be implemented in the sub classes. You
    can’t use abstract keyword with variables and constructorsassert (added in J2SE
    1.4)Assert describes a predicate (a true–false statement) placed in a java-program
    to indicate that the developer thinks that the predicate is always true at that
    place. If an assertion evaluates to false at run-time, an assertion failure results,
    which typically causes execution to abort. Optionally enable by ClassLoader method.booleanDefines
    a boolean variable for the values "true" or "false" only.breakUsed to end the
    execution in the current loop body.byteThe byte keyword is used to declare a field
    that can hold an 8-bit signed two''s complement integer. This keyword is also
    used to declare that a method returns a value of the primitive type byte.caseA
    statement in the switch block can be labeled with one or more case or default
    labels. The switch statement evaluates its expression, then executes all statements
    that follow the matching case label;catchUsed in conjunction with a try block
    and an optional finally block. The statements in the catch block specify what
    to do if a specific type of exception is thrown by the try block.charDefines a
    character variable capable of holding any character of the java source file''s
    character set.classA type that defines the implementation of a particular kind
    of object. A class definition defines instance and class fields, methods, and inner
    classes as well as specifying the interfaces the class implements and the immediate superclass of
    the class. If the superclass is not explicitly specified, the superclass is implicitly [Object](https://docs.oracle.com/javase/8/docs/api/java/lang/Object.html).
    The class keyword can also be used in the form Class.class to get a Class object
    without needing an instance of that class.For example, String.classcan be used
    instead of doing new String().getClass().continueUsed to resume program execution
    at the end of the current loop body. If followed by a label, continue resumes
    execution at the end of the enclosing labeled loop body.defaultThe default keyword
    can optionally be used in a switch statement to label a block of statements to
    be executed if no case matches the specified value; see switch.  Alternatively,
    the default keyword can also be used to declare default values in a Java annotation.
    From Java 8 onwards, the default keyword is also used to specify that a method
    in an interface provides the default implementation of a method.doThe do keyword
    is used in conjunction with while to create a do-while loop, which executes a
    block of statements associated with the loop and then tests a boolean expression
    associated with the while. If the expression evaluates to true, the block is executed
    again; this continues until the expression evaluates to false.doubleThe double keyword
    is used to declare a variable that can hold a 64-bit double precision IEEE 754 floating-point
    number. This keyword is also used to declare that a method returns a value of
    the primitive type double.elseThe else keyword is used in conjunction with if to
    create an if-else statement, which tests a boolean expression; if the expression
    evaluates to true, the block of statements associated with the if are evaluated;
    if it evaluates to false, the block of statements associated with the else are
    evaluated.enum (added in J2SE 5.0)A Java keyword used to declare an enumerated
    type. Enumerations extend the base class Enum.extendsUsed in a class declaration
    to specify the superclass; used in an interface declaration to specify one or
    more superinterfaces. Class X extends class Y to add functionality, either by
    adding fields or methods to class Y, or by overriding methods of class Y. An interface
    Z extends one or more interfaces by adding methods. Class X is said to be a subclass
    of class Y; Interface Z is said to be a subinterface of the interfaces it extends.Also
    used to specify an upper bound on a type parameter in Generics.finalDefine an
    entity once that cannot be changed nor derived from later. More specifically:
    a final class cannot be subclassed, a final method cannot be overridden, and a
    final variable can occur at most once as a left-hand expression on an executed
    command. All methods in a final class are implicitly final.finallyUsed to define
    a block of statements for a block defined previously by the try keyword. The finally block
    is executed after execution exits the try block and any associated catch clauses
    regardless of whether an exception was thrown or caught, or execution left methodin
    the middle of the try or catch blocks using the return keyword.floatThe float keyword
    is used to declare a variable that can hold a 32-bit single precision IEEE 754
    floating-point number.  This keyword is also used to declare that a method returns
    a value of the primitive type float.forThe for keyword is used to create a for
    loop, which specifies a variable initialization, a boolean expression, and an
    incrementation. The variable initialization is performed first, and then the boolean
    expression is evaluated. If the expression evaluates to true, the block of statements
    associated with the loop are executed, and then the incrementation is performed.
    The boolean expression is then evaluated again; this continues until the expression
    evaluates to false.As of J2SE 5.0, the for keyword can also be used to create
    a so-called "enhanced for loop", which specifies an arrayor Iterable object; each
    iteration of the loop executes the associated block of statements using a different
    element in the array or Iterable.ifThe if keyword is used to create an if statement,
    which tests a boolean expression; if the expression evaluates to true, the block
    of statements associated with the if statement is executed. This keyword can also
    be used to create an if-else statement; see else.implementsIncluded in a class
    declaration to specify one or more interfaces that are implemented by the current
    class. A class inherits the types and abstract methods declared by the interfaces.importUsed
    at the beginning of a source file to specify classes or entire Java packages to
    be referred to later without including their package names in the reference. Since
    J2SE 5.0, import statements can import static members of a class.instanceofA binary
    operator that takes an object reference as its first operand and a class or interface
    as its second operand and produces a boolean result. The instanceof operator evaluates
    to true if and only if the runtime type of the object is assignment compatible
    with the class or interface.intThe int keyword is used to declare a variable that
    can hold a 32-bit signed two''s complement integer.  This keyword is also used
    to declare that a method returns a value of the primitive type int.interfaceUsed
    to declare a special type of class that only contains abstract or default methods,
    constant (static final) fields and static interfaces. It can later be implemented
    by classes that declare the interface with the implements keyword.longThe long keyword
    is used to declare a variable that can hold a 64-bit signed two''s complement
    integer. This keyword is also used to declare that a method returns a value of
    the primitive type long.nativeUsed in method declarations to specify that the
    method is not implemented in the same Java source file, but rather in another
    language.newUsed to create an instance of a class or array object. Using keyword
    for this end is not completely necessary(as exemplified by [Scala](https://en.wikipedia.org/wiki/Scala_(programming_language))),
    though it serves two purposes: it enables the existence of different namespace
    for methods and class names, it defines statically and locally that a fresh object
    is indeed created, and of what runtime type it is (arguably introducing dependency
    into the code).packageA group of types. Packages are declared with the package keyword.privateThe private keyword
    is used in the declaration of a method, field, or inner class; private members
    can only be accessed by other members of their own class.protectedThe protected keyword
    is used in the declaration of a method, field, or inner class; protected members
    can only be accessed by members of their own class, that class''s subclasses or
    classes from the same package.publicThe public keyword is used in the declaration
    of a class, method, or field; public classes, methods, and fields can be accessed
    by the members of any class.returnUsed to finish the execution of a method. It
    can be followed by a value required by the method definition that is returned
    to the caller.shortThe short keyword is used to declare a field that can hold
    a 16-bit signed two''s complement integer. This keyword is also used to declare
    that a method returns a value of the primitive type short.staticUsed to declare
    a field, method, or inner class as a class field. Classes maintain one copy of
    class fields regardless of how many instances exist of that class. static also
    is used to define a method as a class method. Class methods are bound to the class
    instead of to a specific instance, and can only operate on class fields. (Classes
    and interfaces declared as static members of another class or interface are actually
    top-level classes and are not inner classes.)strictfp (added in J2SE 1.2)A Java
    keyword used to restrict the precision and rounding of floating point calculations
    to ensure portability.superUsed to access members of a class inherited by the
    class in which it appears. Allows a subclass to access overridden methods and
    hidden members of its superclass. The super keyword is also used to forward a
    call from a constructor to a constructor in the superclass.Also used to specify
    a lower bound on a type parameter in Generics.switchThe switch keyword is used
    in conjunction with case and default to create a switch statement, which evaluates
    a variable, matches its value to a specific case, and executes the block of statements
    associated with that case. If no case matches the value, the optional block labelled
    by default is executed, if included.synchronizedUsed in the declaration of a method
    or code block to acquire the mutex lock for an object while the current thread executes
    the code.  For static methods, the object locked is the class''s Class. Guarantees
    that at most one thread at a time operating on the same object executes that code.
    The mutex lock is automatically released when execution exits the synchronized
    code. Fields, classes and interfaces cannot be declared as synchronized.thisUsed
    to represent an instance of the class in which it appears. this can be used to
    access class members and as a reference to the current instance. The this keyword
    is also used to forward a call from one constructor in a class to another constructor
    in the same class.throwCauses the declared exception instance to be thrown. This
    causes execution to continue with the first enclosing exception handler declared
    by the catch keyword to handle an assignment compatible exception type. If no
    such exception handler is found in the current method, then the method returns
    and the process is repeated in the calling method. If no exception handler is
    found in any method call on the stack, then the exception is passed to the thread''s
    uncaught exception handler.throwsUsed in method declarations to specify which
    exceptions are not handled within the method but rather passed to the next higher
    level of the program. All uncaught exceptions in a method that are not instances
    of RuntimeException must be declared using the throws keyword.transientDeclares
    that an instance field is not part of the default serialized form of an object.
    When an object is serialized, only the values of its non-transient instance fields
    are included in the default serial representation. When an object is deserialized,
    transient fields are initialized only to their default value. If the default form
    is not used, e.g. when a serialPersistentFieldstable is declared in the class
    hierarchy, all transient keywords are ignored.tryDefines a block of statements
    that have exception handling. If an exception is thrown inside the try block,
    an optional catch block can handle declared exception types. Also, an optional finally block
    can be declared that will be executed when execution exits the try block and catch clauses,
    regardless of whether an exception is thrown or not. A try block must have at
    least one catch clause or a finally block.voidThe void keyword is used to declare
    that a method does not return any value.volatileUsed in field declarations to
    specify that the variable is modified asynchronously by concurrently running threads.
    Methods, classes and interfaces thus cannot be declared volatile, nor can local
    variables or parameters.whileThe while keyword is used to create a while loop,
    which tests a boolean expression and executes the block of statements associated
    with the loop if the expression evaluates to true; this continues until the expression
    evaluates to false. This keyword can also be used to create a do-while loop;Reserved
    words for literal values:trueA boolean literal value.nullA reference literal value.falseA
    boolean literal value.Return KeywordWe need to love the return keyword. This keyword
    turns a function into data. There are a couple of conditions that need to be met
    before this will work. So far, we’ve been using the keyword void to declare the
    return type of a function. This looks like the following code fragment.void MyFunction(){//code
    here...}In this case, using return will be pretty simple.void MyFunction(){//code
    here ...return;}This function returns void. This statement has a deeper meaning.
    Returning a value makes a lot more sense when a real value, something other than
    a void, is actually returned. Let’s take a look at a function that has more meaning.The
    keyword void at the beginning of the function declaration means that this function
    does not have a return type. If we change the declaration, we need to ensure that
    there is a returned value that matches the declaration.This can be as simple as
    the following code fragment.int MyFunction(){//code here...return 1;//1 is an
    int}This function returns int 1.Declaring a function with a return value requires
    that the return type and the declaration match. When the function is used, it
    should be treated like a data type that matches the function’s return type.Are
    Errors Bad?Don’t be afraid to make mistakes. The code you write cannot break IDE
    or your computer. At least nothing you’ll learn from this book will enable you
    to do so. As a matter of fact, it is often good to produce errors. The errors
    tell us what we can and cannot do. Programmers often ask themselves, “Will the
    compiler let me do this?” which may produce an error. If not, then the programmer
    will continue his thought with“huh, I guess it will, so that means I can …”Creating
    and fixing errors tells us what the compiler expects from us. It is a sort of
    a conversation between the programmer and the computer.for example, the programmer
    asking questions in the form of a code statement and the computer replying with
    an error to the programmer who asks for things the computer can’t do.Compile Time
    and Run Time ErrorsAt compile time, when the code does not comply with the Java
    syntactic and semantics rules as described in Java Language Specification (JLS),
    compile-time errors will occurs. The goal of the compiler is to ensure the code
    is compliant with these rules. Any rule-violations detected at this stage are
    reported as compilation errors.The best way to get to know those rules is to go
    through all the sections in the JLS containing the key words "compile-time error".In
    general, these rules include syntax checking: declarations, expressions, lexical
    parsing, file-naming conventions etc;exception handling: for checked exceptions;accessibility,
    type-compatibility, name resolution: checking to see all named entities - variables,classes,
    method calls etc. are reachable through at least one of the declared path; etc.The
