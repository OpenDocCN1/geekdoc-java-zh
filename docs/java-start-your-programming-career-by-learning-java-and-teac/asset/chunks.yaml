  trans: "\n\n# Java for 循环\n\n* 初始化步骤首先执行，且仅执行一次。此步骤允许你声明并初始化任何循环控制变量，该步骤以分号（`;`）结束。\n\
    * 接下来，评估 `Boolean expression`（布尔表达式）。如果为真，则执行循环体。如果为假，则不执行循环体，控制跳转到 `for` 循环之后的语句。\n\
    * 在执行 `for` 循环的 `body`（体）后，控制跳转回更新语句。该语句允许你更新任何循环控制变量。该语句可以留空，但在末尾加一个分号。\n* 现在再次评估\
    \ `Boolean expression`。如果为真，循环执行并重复该过程（循环体、更新更新步骤、然后是布尔表达式）。当 `Boolean expression`\
    \ 为假后，`for` 循环终止。\n\n流程图：![Java For Loop](img/image3011.jpg)\n\n示例：以下是 Java 中\
    \ `for` 循环的示例代码。\n\n```java\npublic class Test {\n    public static void main(String\
    \ args[]) {\n        for(int x = 10; x < 20; x = x + 1) {\n            System.out.print(\"\
    value of x : \" + x);\n            System.out.print(\"\\n\");\n        }\n   \
    \ }\n}\n```\n\n这将产生以下结果：\n输出：\nvalue of x : 10\nvalue of x : 11\nvalue of x :\
    \ 12\nvalue of x : 13\nvalue of x : 14\nvalue of x : 15\nvalue of x : 16\nvalue\
    \ of x : 17\nvalue of x : 18\nvalue of x : 19\n\n# 循环控制语句\n\n循环控制语句改变执行的正常顺序。当执行离开作用域时，在该作用域内创建的所有自动对象都将被销毁。Java\
    \ 支持以下控制语句。\n\n* Break 语句\n* Continue 语句\n\nJava 语言中的 `break` 语句有以下两种用法：\n\n*\
    \ 当循环内部遇到 `break` 语句时，循环立即终止，程序控制从循环后的下一语句开始恢复。\n* 可用于终止 `switch` 语句中的某个 case（在下一章介绍）。\n\
    \n### 语法\nbreak 的语法是任何循环内部的单语句：`break;`\n\n流程图：![Java Break Statement](img/image3092.jpg)\n\
    \n示例：\n```java\npublic class Test {\n    public static void main(String args[])\
    \ {\n        int[] numbers = {10, 20, 30, 40, 50};\n        for(int x : numbers)\
    \ {\n            if(x == 30) {\n                break;\n            }\n      \
    \      System.out.print(x);\n            System.out.print(\"\\n\");\n        }\n\
    \    }\n}\n```\n这将产生以下结果：\n输出\n10\n20\n\n`continue` 关键字可以用任何循环控制结构。它导致循环立即跳转到循环的下迭代。\n\
    \n* 在 `for` 循环中，`continue` 关键字导致控制立即跳转到更新语句。\n* 在 `while` 循环或 `do/while` 循环中，控制立即跳转到\
    \ `Boolean expression`。\n\n### 语法\ncontinue 的语法是任何循环内部的单语句——`continue;`\n\n流程图：![Java\
    \ Continue Statement](img/image3157.jpg)\n\n示例：\n```java\npublic class Test {\n\
    \    public static void main(String args[]) {\n        int[] numbers = {10, 20,\
    \ 30, 40, 50};\n        for(int x : numbers) {\n            if(x == 30) {\n  \
    \              continue;\n            }\n            System.out.print(x);\n  \
    \          System.out.print(\"\\n\");\n        }\n    }\n}\n```\n输出：\n10\n20\n\
    40\n50\n\n# 数组\n\n数组是组织良好的的数据列表。想象一个从零开始的编号列表，每向列表添加内容时就会扩展一行。数组对于许多情况都非常有用，因为它们被视为单个数据块。例如，如果你想存储许多高分，你会想使用数组。起初，你可能想要一个包含\
    \ 10 个元素的列表。理论上，你可以使用以下代码存储每个分数。\n\n```java\nint score1;\nint score2;\nint score3;\n\
    int score4;\nint score5;\nint score6;\nint score7;\nint score8;\nint score9;\n\
    int score10;\n```\n更糟糕的是，如果你需要处理每个值，你需要创建一组通过变量名处理每个变量的代码。为了检查 `score2` 是否高于 `score1`，你必须专门编写一个函数来检查这两个变量以便交换它们的值。谢天谢地有数组。\n\
    \n数组分为两种类型：\n\n* 一维数组\n* 多维数组\n\n"
- fmt: "\n# Single Dimensional Array in java\n\n## Syntax to Declare an Array in java\n\
    `dataType[] arr;` (or) `dataType []arr;` (or) `dataType arr[];`\n\n## Instantiation\
    \ of an Array in java\n`arrayRefVar=new datatype[size];`\n\n## Example of single\
    \ dimensional java array\nLet's see the simple example of java array, where we\
    \ are going to declare, instantiate, initialize and traverse an array.\n\n```java\n\
    class Testarray{\n    public static void main(String args[]){\n        int a[]=new\
    \ int[5];//declaration and instantiation\n        a[0]=10;//initialization\n \
    \       a[1]=20;\n        a[2]=70;\n        a[3]=40;\n        a[4]=50;\n     \
    \   //printing array\n        for(int i=0;i<a.length;i++)//length is the property\
    \ of array\n            System.out.println(a[i]);\n    }\n \n}\n```\n**Output:**\n\
    ```\n10\n20\n70\n40\n50\n```\n\n## Declaration, Instantiation and Initialization\
    \ of Java Array\nWe can declare, instantiate and initialize the java array together\
    \ by: `int a[]={33,3,4,5};`//declaration, instantiation and initialization\n\n\
    Let's see the simple example to print this array.\n\n```java\nclass Testarray1{\n\
    \    public static void main(String args[]){\n        int a[]={33,3,4,5};//declaration,\
    \ instantiation and initialization\n        //printing array\n        for(int\
    \ i=0;i<a.length;i++)//length is the property of array\n            System.out.println(a[i]);\n\
    \    }\n}\n```\n**Output:**\n```\n33\n3\n4\n5\n```\n\n## Passing Array to method\
    \ in java\nWe can pass the java array to method so that we can reuse the same\
    \ logic on any array. Let's see the simple example to get minimum number of an\
    \ array using method.\n\n```java\nclass Testarray2{\n    static void min(int arr[]){\n\
    \        int min=arr[0];\n        for(int i=1;i<arr.length;i++)\n            if(min>arr[i])\n\
    \                min=arr[i];\n        System.out.println(min);\n    }\n    public\
    \ static void main(String args[]){\n        int a[]={33,3,4,5};\n        min(a);//passing\
    \ array to method\n    }\n}\n```\n**Output:** `3`\n\n---\n\n# Multidimensional\
    \ array in java\nIn such case, data is stored in row and column based index (also\
    \ known as matrix form).\n\n## Syntax to Declare Multidimensional Array in java\n\
    `dataType[][] arrayRefVar;` (or) `dataType [][]arrayRefVar;` (or) `dataType arrayRefVar[][];`\
    \ (or) `dataType []arrayRefVar[];`\n\n## Example to instantiate Multidimensional\
    \ Array in java\n`int[][] arr=new int[3][3];` //3 row and 3 column\n\n## Example\
    \ to initialize Multidimensional Array in java\n`arr[0][0]=1;`\n`arr[0][1]=2;`\n\
    `arr[0][2]=3;`\n`arr[1][0]=4;`\n`arr[1][1]=5;`\n`arr[1][2]=6;`\n`arr[2][0]=7;`\n\
    `arr[2][1]=8;`\n`arr[2][2]=9;`\n\n## Example of Multidimensional array\nLet's\
    \ see the simple example to declare, instantiate and print the 2D array.\n\n```java\n\
    class Testarray3{\n    public static void main(String args[]){\n        //declaring\
    \ and initializing 2D array\n        int arr[][]={{1,2,3},{2,4,5},{4,4,5}};\n\
    \        //printing 2D array\n        for(int i=0;i<3;i++){\n            for(int\
    \ j=0;j<3;j++){\n                System.out.print(arr[i][j]+\" \");\n        \
    \    }\n            System.out.println();\n        }\n    }\n}\n```\n**Output:**\n\
    ```\n1 2 3 \n2 4 5 \n4 4 5 \n```\n\n---\n\n# CHAPTER 8 | OBJECT ORIENTED PROGRAMMING##\
    \ Classes\nThe most important part of any Java program is the class. Classes here\
    \ are not the sort that students go to; rather, they are classes of classification.\
    \ Classes in Java appear in several different forms. Some are called partial classes,\
    \ and some classes can even appear inside another class; these classes are called\
    \ nested classes. A class is a collection of instructions and data. The instructions\
    \ can be referred to as functions or methods. The data stored in a class is called\
    \ a field or property. All of the naming aside, what’s important is what classes\
    \ do and how they’re used.\n\nClasses are flexible and easily changed, but this\
    \ flexibility is not some complexity. As we’ve seen before, the class declaration\
    \ can contain a lot more than the following example. However, much of the complexity\
    \ comes later in this book, when needed. When you approach a game or any sort\
    \ of programming task it’s important to first collect data, and then figure out\
    \ how to use the data. In most programming paradigms it’s best to start off with\
    \ variables at the beginning of your new class. For instance, in this code we\
    \ might want to know what day it is before going out:\n\n```\nTime day = today;\n\
    if (day == Friday){\n    PartyTonight = true;\n}\n```\nWe start off with getting\
    \ a day, and then deciding what to do tonight based on the day. We should refrain\
    \ from partying and then checking what the day is unless we want to show up for\
    \ work late. A class is a blueprint from which individual objects are created.\
    \ Following is a sample of a class.\n\n```java\nclass Dog {\n    String breed;\n\
    \    int age;\n    String color;\n    void barking() {\n    }\n    void hungry()\
    \ {\n    }\n    void sleeping() {\n    }\n}\n```\n\nA class can contain any of\
    \ the following variable types:\n- **Local variables**: Variables defined inside\
    \ methods, constructors or blocks are called local variables. The variable will\
    \ be declared and initialized within the method and the variable will be destroyed\
    \ when the method has completed.\n- **Instance variables**: Instance variables\
    \ are variables within a class but outside any method. These variables are initialized\
    \ when the class is instantiated. Instance variables can be accessed from inside\
    \ any method, constructor or blocks of that particular class.\n- **Class variables**:\
    \ Class variables are variables declared within a class, outside any method, with\
    \ the `static` keyword.\n\nA class can have any number of methods to access the\
    \ value of various kinds of methods. In the above example, `barking()`, `hungry()`\
    \ and `sleeping()` are methods.\n\nFollowing are some of the important topics\
    \ that need to be discussed when looking into classes of the Java Language.\n\n\
    ### Constructors\nWhen discussing about classes, one of the most important sub\
    \ topic would be constructors. Every class has a constructor. If we do not explicitly\
    \ write a constructor for a class, the Java compiler builds a default constructor\
    \ for that class. Each time a new object is created, at least one constructor\
    \ will be invoked. The main rule of constructors is that they should have the\
    \ same name as the class. A class can have more than one constructor. Following\
    \ is an example of a constructor:\n\n```java\nclass Puppy {\n    public Puppy()\
    \ {\n    }\n    public Puppy(String name) {\n        // This constructor has one\
    \ parameter, name.\n    }\n}\n```\nJava also supports Singleton Classes\n\n##\
    \ Introduction to Objects\nObject oriented programming (OOP) was invented to associate\
    \ data and logic into nicely packaged of code. When you write a class in Java\
    \ you’re creating blueprints and instructions for a new object. Any number of\
    \ objects can then be constructed based on your blueprints.mers use the term instantiate\
    \ when talking about creating an object from the class. Each instantiated object\
    \ is an instance of the class from which it was constructed. The class is not\
    \ itself one of the instances created by. The newly created object contains all\
    \ of the functions and data All programming languages provide abstractions.\n\n\
    ### Creating an Object\nThere are three steps when creating an object from a class:\n\
    - **Declaration**: A variable declaration with a variable name with an object\
    \ type.\n- **Instantiation**: The `new` keyword is used to create the object.\n\
    - **Initialization**: The `new` keyword is followed by a call to a constructor.\
    \ This call initializes the new object.\n\nFollowing is an example of creating\
    \ an object:\n\n```java\nclass Puppy {\n    public Puppy(String name) {\n    \
    \    // This constructor has one parameter, name.\n        System.out.println(\"\
    Passed Name is :\" + name );\n    }\n    public static void main(String []args)\
    \ {\n        // Following statement would create an object myPuppy\n        Puppy\
    \ myPuppy = new Puppy( \"tommy\" );\n    }\n}\n```\n**Output:** `Passed Name is\
    \ :tommy`\n\n### Accessing Instance Variables and Methods\nInstance variables\
    \ and methods are accessed via created objects. To access an instance variable,\
    \ following is the fully qualified path:\n\n```\n/* First create an object */\n\
    ObjectReference = new Constructor();\n/* Now call a variable as follows */\nObjectReference.variableName;\n\
    /* Now you can call a class method as follows */\nObjectReference.MethodName();\n\
    ```\n\nExample: This example explains how to access instance variables and methods\
    \ of a class.\n\n```java\nclass Puppy {\n    int puppyAge;\n    public Puppy(String\
    \ name) {\n        // This constructor has one parameter, name.\n        System.out.println(\"\
    Name chosen is :\" + name );\n    }\n    public void setAge( int age ) {\n   \
    \     puppyAge = age;\n    }\n    public int getAge( ) {\n        System.out.println(\"\
    Puppy's age is :\" + puppyAge );\n        return puppyAge;\n    }\n    public\
    \ static void main(String []args) {\n        /* Object creation */\n        Puppy\
    \ myPuppy = new Puppy( \"tommy\" );\n        /* Call class method to set puppy's\
    \ age */\n        myPuppy.setAge( 2 );\n        /* Call class method to get puppy's\
    \ age */\n        myPuppy.getAge( );\n        /* You can access instance variable\
    \ as well */\n        System.out.println(\"Variable Value :\" + myPuppy.puppyAge\
    \ );\n    }\n}\n```\n**Output:**\n```\nName chosen is :tommy\nPuppy's age is :2\n\
    Variable Value :2\n```\n\n### Characteristics of oriented programming\n1. **Everything\
    \ is an object**: Think of an object as a fancy variable; it stores data, but\
    \ you can “make requests” to that object.\n2. **A program is a bunch of objects\
    \ telling each other what to do**: To make a request of an object, you “send a\
    \ message” to that object. More concretely, you can think of a message as a request\
    \ to call a method that belongs to a particular object.\n3. **Each object has\
    \ its own memory made up of other**: Put another way, you create a new kind of\
    \ object by making existing objects. Thus, you can build complexity into a program\
    \ while hiding it behind the simplicity of objects.\n4. **Every object has a type**:\
    \ Using the parlance, each object is an instance of a class, in which “class”\
    \ is synonymous with “type.” The most distinguishing characteristic of a class\
    \ is “What messages can you send to it?”\n5. **All objects of a particular type\
    \ can receive the same messages**: This is actually a loaded statement, as you\
    \ will see later. Because an object of type “circle” is also an object of type\
    \ “shape,” a circle is guaranteed to accept shape messages. This means you can\
    \ write code that talks to shapes and automatically handle anything that fits\
    \ the description of a shape. This substitutability is one of the powerful concepts\
    \ in OOP.\n\nAn object has state, behavior and identity. This means that an object\
    \ can have internal data (which gives it state), methods (to produce behavior),\
    \ and each object can be uniquely distinguished from every other object—to put\
    \ this in a concrete sense, each object has a unique address in memory.\n\nAn\
    \ object has an interface: So, although what we really do in object-oriented programming\
    \ is create new data types, virtually all object-oriented languages use the `class`\
    \ keyword. When you see the word “type” think “class” and vice versa. Since a\
    \ class describes a set of objects that have identical characteristics (data elements)\
    \ and behaviors (functionality), a class is really a data type because a floating\
    \ point number, for example, also has a set of characteristics and behaviors.\
    \ The difference is that a programmer defines a class to fit a problem rather\
    \ than being forced to use an existing data type that was designed to represent\
    \ a unit of storage in a machine. You extend the programming language by adding\
    \ new data types specific to your needs. The programming system welcomes the new\
    \ classes and gives them all the care and type checking that it gives to built-in\
    \ types. The object-oriented approach is not limited to building simulations.\
    \ Whether or not you agree that any program is a simulation of the system you’re\
    \ designing, the use of OOP techniques can easily reduce a large set of problems\
    \ to a simple solution. Once a class is established, you can make as many objects\
    \ of that class as you like, and then manipulate those objects as if they are\
    \ the elements that exist in the problem you are trying to solve. Indeed, one\
    \ of the challenges of object-oriented programming is to create a one-to mapping\
    \ between the elements in the problem space and objects in the solution space.\
    \ But how do you get an object to do useful work for you? There needs to be a\
    \ way to make a request of the object so that it will do something, such as complete\
    \ a transaction, draw something on the screen, or turn on a switch. And each object\
    \ can satisfy only certain requests. The requests you can make of an object are\
    \ defined by its interface, and the type is what determines the interface. A simple\
    \ example might be a representation of a light bulb:\n\n```java\nLight lt = new\
    \ Light();\nlt.on();\n```\nThe interface determines the requests that you can\
    \ make for a particular object. However, there must be code somewhere to satisfy\
    \ that request. This, along with the hidden data, comprises the implementation.\
    \ From a procedural programming standpoint, it’s not that complicated. A type\
    \ has a method associated with each possible request, and when you make a particular\
    \ request to an object, that method is called. This process is usually summarized\
    \ by saying that you “send a message” (make a request) to an object, and the object\
    \ figures out what to do with that message (it executes code). Here, the name\
    \ of the type/class is `Light`, the name of the particular object is `lt`, and\
    \ the requests you can make of a Light object are to turn it on, turn it off,\
    \ make it brighter, or make it dimmer.\n\n## Interfaces\nAn interface is a reference\
    \ type in Java. It is similar to class. It is a collection of abstract methods.\
    \ A class implements an interface, thereby inheriting the abstract methods of\
    \ the interface. Along with abstract methods, an interface may also contain constants,\
    \ default methods, static methods, and nested types.\n"
