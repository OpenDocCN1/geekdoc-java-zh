  trans: "\n\n# 第 6 章 | 函数与运算符\n\n## 什么是函数？\n\n函数（有时也称为方法，methods）包含可以处理数据的语句。这些语句可以处理数据，也可以不处理。方法可以被其他语句访问。这种行为被称为“调用函数”或“进行函数调用”。\n\
    \n函数在不同的编程语言中看起来可能不同，但它们的工作方式大体是相同的。通常的模式是接收数据并使用逻辑来处理这些数据。函数也可能有其他名称，例如方法。主要的区别在于不同语言使用语法的方式不同。语法基本上是空格或制表符、运算符或关键字的使用。\n\
    \n归根结底，你所做的一切只是告诉编译器如何将你的指令转换为计算机解释的命令。变量和函数构成了编程的大主体。你想要记住的任何数据都存储在变量中。变量由你的函数进行处理。通常，当你将变量和函数组合在一个地方时，你将其称为一个类（class）。\n\
    \n示例：\n```java\npublic void PrintNum (){System.out.println (anotherNum);}\n```\n\
    \n在编写新函数时，在继续下一个任务之前，填充整个函数的布局是一个良好的习惯。这会让编译器感到轻松；如果将一个函数留在 `void MyFunction`\
    \ 的形式并跳到另一个函数，会让编译器困惑于你打算做什么。在这种情况下，集成开发环境（`MonoDevelop`）会不断读取和解释你正在编写的内容，类似于文字处理器中的拼写检查器。当它遇到一个没有确定形式的语句时（例如变量、函数或类定义），它对你正在编写的代码的解释将引发一个警告或错误。`MonoDevelop`\
    \ 看起来可能有点挑剔，但它正在尽力帮助。\n\n## 编写函数\n\n函数由一个声明（declaration）和一个正体（body）组成。一些程序员喜欢把这些称为方法，但撇开语义不，函数基本上是一个语句集合的容器。\n\
    \n让我们继续示例：\n```java\nvoid MyFunction (){}\n```\n\n这是一个名为 `MyFunction` 的基本函数。我们可以添加额外的关键字来修改函数的可见性。我们将看到的一个常见修饰符是\
    \ `public`。\n\n```java\npublic void MyFunction (){}\n```\n\n`public` 关键字需要出现在函数的返回类型之前。在这种情况下，它是\
    \ `void`，意味着函数不返回任何内容。但函数可以以几种不同的方式作为值。作为参考，返回 `int` 的函数看起来像这样。在具有返回类型的函数中，必须存在某种返回语句。\n\
    \n```java\npublic int MyFunction (){return 1;}\n```\n\n`public` 修饰符并不总是必要的，除非你需要让此函数对其他类可用。如果这一点不理解，你很快就会明白。函数最后总是要求的部分是参数列表（parameter\
    \ list）。留它是有效的，但为了感受参数列表中的 `arg`（或参数）看起来什么样，请看下一个示例。\n\n```java\npublic void MyFunction\
    \ (int i){}\n```\n\n目前，我们将暂缓不使用参数列表，但以后知道你看到的是什么很重要，以免产生意外。参数列表用于将信息从函数外部传递到函数内部。这就是类能够将信息从一个类发送到另一个类的方式。函数声明类似于类声明。函数是处理变量逻辑的核心。\n\
    \n## 函数作用域（Scope）\n\n变量的寿命通常是的。某些变量只存在于几行代码中。变量可能只在函数开始时产生，并在函数结束时消失。类中的变量只要类存在就一直存在。变量的寿命取决于它创建的位置。\n\
    \n示例：\n```java\npublic class Class {\n  int Class;\n  void first() {\n    int\
    \ first;\n  }\n  void second() {\n    int second;\n  }\n}\n```\n\n如果我们看上面的内容，我们可以可视化作用域是如何划分的。外层框代表谁可以看到\
    \ `Class`。在 `first()` 函数内部，我们有 `first`，它只存在于 `first` 中。同样，`second()` 可以看到 `Class`\
    \ 和 `second`，但看不到 `first`。\n\n## 参数列表\n\n当函数被调用时，它的标识符后跟参数列表会被添加到代码中。参数就像房子正门上的小槽。可能有一个用于整数、浮点数和数组的槽。门上的每个槽（或参数列表中的参数）都是一个类型，后跟一个标识符。\n\
    \n如果我们看一个基本示例，我们将看到它是如何工作的：\n```java\npublic class Example {\n  int a = 0;\n \
    \ void SetA (int i) {\n    a = i;\n  }\n}\n```\n\n`SetA (int i)` 接收一个 `int` 类型的参数。这是一个值参数（value\
    \ parameter）的简单示例；还有其他类型的参数，我们将将讨论。值参数声明了类型和一个标识符，其作用域限制在它声明的函数范围内。当你运行上面的程序并给函数\
    \ `SetA(3)` 传入 `3` 时，你将看到一个 0 后面跟着一个 3。我们可以这样做很多次，每次都允许更改我们设置的值。当然，在类里用 `a = 3`\
    \ 是容易的，但那样我们就学不到任何东西了。\n\n## 副作用（Side Effects）\n\n当一个函数直接设置它所在的类中的变量时，这被称为副作用。副作用通常是程序员试图避免的，但并不总是如此。具有副作用的函数往往在其他类中不可用。我们会找到允许我们避免使用副作用的方法，但在某些情况下，它是必要的。\n\
    \n```java\nclass MySideEffect {\n  int a = 0;\n  void SetA () {\n    a = 5;\n\
    \    }\n}\n```\n\n上面的 `SetA()` 函数设置 `int a` 为 5。当类的复杂性增加时，变量在哪里以及何时被修改变得模糊。如果函数是自包含的，测试和修复函数将变得容易得多。读取函数的功能不应该跳来跳去寻找它正在修改的变量。这回到了作用域的话题。限制函数的作用域有助于减少出错的地方。\n\
    \n```java\nclass MySideEffect {\n  int a = 0;\n  void SetA () {\n    a = 5;\n\
    \  }\n  void SetAgain () {\n    a = 10;\n  }\n}\n```\n\n副作用越多，可能出现的奇怪行为越多。如果 `Main()`\
    \ 函数期望一个值但得到了完全不同的东西，就会产生意外的行为。更糟糕，如果 `SetAgain()` 从另一个类调用，而你期望 `a` 为 5，你会遇到更多奇怪的行为。\n\
    \n## 多参数\n\n函数可以接受的参数数量没有限制。有些语言限制为不超过 16 个，这似乎是可以接受的。如果你的逻辑需要多一个参数，可能更容易将函数拆分成不同的部分。\n\
    \n```java\nint a = 0;\nvoid SetA (int i, int j) {\n  a = i * j;\n}\n```\n\n我们可以在\
    \ `SetA` 中添加第二个参数。逗号标记告诉函数列表接受另一个变量。在这个示例中，我们使用两个 `ints` 来相乘并给 `a` 赋值。在参数列表中允许使用的类型没有限制。\n\
    \n```java\nint a = 0;\nfloat b = 0;\nvoid SetA (int i, float j) {\n  a = i;\n\
    \  b = j;\n}\n```\n\n具有多个参数的函数可以做更多事情。值参数是将数据输入函数以完成某种简单任务的有效方法。\n\n## 代码块\n\n\
    块是在求值时分组在一起的语句集合。代码的求值通常由大括号控制。Java 程序员经常使用制表符来缩进不同的块，这使得不同的块更具可读性。像 Python 这样的语言依赖制表符来指示分开块。习惯制表符的使用对于编写可读的代码至关重要。接下来，我们将使用逻辑语句及其块。该语句向右缩进表示其被包含。\n\
    \n```java\nif (true) {\n  // 代码在这里\n}\n```\n\n缩进不当的花会导致代码混乱；上面的代码仍然有效，但与之前的版本相比可读性较低。大多数代码编辑工具会自动为你添加正确的缩进。这是你在编写自己的代码时必须掌握的。\n\
    \n```java\nint i = 7;\nint j = 13;\nif (i < 13) {\n  int j = 7;\n}\n```\n\n通过添加一些空间，可以让\
    \ `if` 语句更可见。在块周围添加空间对于保持可读性很重要。还有位于另一个块内部的代码块。通常它们都属于同一个块。块内部的块被称为嵌套块（nested\
    \ blocks）。\n\n```java\nif (true) {\n  // 所有代码\n  if (true) {\n    // 另一个代码块\n\
    \    // 位于更大的内部\n    // 这里更多代码\n  }\n}\n```\n\n# 逻辑与运算符\n\n逻辑允许你根据变量的变化控制函数部分的求值。使用逻辑，你将能够更改代码中哪些语句将运行。简单来说，你写的内容必须涵盖你计划的每种情况。逻辑通过几个简单的系统控制，主要是\
    \ `if` 关键字和 `if` 的变体。\n\n### 布尔值\n\nJava 中的布尔值（简称为 bools）为真（true）或假（false）。将这些想象成开启或关闭位置的开关是最容易的。将\
    \ `var` 声明为 bool，你使用如下内容。\n\n```java\npublic class Example {\n  public bool SomeBool;\n\
    }\n```\n\n### 等于运算符\n\n相等运算符创建布尔条件。有很多方法可以设置布尔变量。例如，值之间的比较是设置变量的有效手段。确定相等的 Basic\
    \ 方法是使用以下运算符：`==`。单等号和双等号的使用之间存在区别。=` 用于赋值，而 `==` 用于比较值。\n\n当你需要比较两个值时，可以使用以下概念。你需要记住这些运算符被称为相等运算符，如果你需要和程序员交流。这里的语法可能有点困惑，但有方法解决。\n\
    \n```java\nvoid Func () {\n  SomeBool = (1 == 1);\n}\n```\n\n还有其他运算符需要注意，将在本章稍些时候介绍。在这种情况下，我们是在询问两个值是否相同。为了让这一点更清晰，可以将代码拆分成多行。现在，它们看起来并不一样；但毕竟，它们包含了相同的整数值。\n\
    \n```java\nvoid Func () {\n  int a = 1;\n  int b = 1;\n  SomeBool = (a == b);\n\
    }\n```\n\n### 关系运算符\n\n布尔值也可以通过比较值来设置。用于比较两个值的运算符被称为关系运算符。我们使用 `==` 等于符号来检查值是否相同；我们也可以使用\
    \ `!=` 不等于来检查值是否不同。程序员经常检查一个值是否大于或小于另一个。他们通过使用 `>` 大于和 `<` 小于来实现。我们还可以使用 `>=`\
    \ 大于等于和 `<=` 小于等于。\n\n```java\npublic class Test {\n  public static void main(String\
    \ args[]) {\n    int a = 10;\n    int b = 20;\n    System.out.println(\"a == b\
    \ = \" + (a == b) );\n    System.out.println(\"a != b = \" + (a != b) );\n   \
    \ System.out.println(\"a > b = \" + (a > b) );\n    System.out.println(\"a < b\
    \ = \" + (a < b) );\n    System.out.println(\"b >= a = \" + (a >= b) );\n    System.out.println(\"\
    b <= a = \" + (b <= a) );\n  }\n}\n```\n\n输出：\na == b = false\na != b = true\n\
    a > b = false\na < b = true\nb >= a = true\nb <= a = false\n\n# 第 7 章 | 控制执行、循环与数组\n\
    \n## 控制执行\n\nJava 中的控制流语句允许在满足特殊条件时运行或跳过代码块。源文件中的语句通常按从到下的顺序执行。然而，控制流语句通过采用决策、循环和分支打破执行流。\n\
    \n### 真与假\n\n所有条件语句都使用条件表达式的真假来确定执行路径。条件表达式的一个示例是 `a == b`。它使用条件运算符 `==` 来检查 `a`\
    \ 的值是否等于 `b`。表达式返回真或假。上一章看到的任何关系运算符都可以产生条件语句。注意，Java 不允许将数字作为布尔值，尽管在 C 和 C++ 中是允许的（真为零，假为零）。如果你想在布尔测试中使用非布尔值，例如\
    \ `if(a)`，你必须首先通过 `if(a != 0)` 将其转换为布尔值。\n\n### if-else 语句\n\n`if-else` 语句是控制程序流最基本的方法。`else`\
    \ 是可选的，所以你可以用两种形式使用 `if`：\n\n```java\nif(Boolean-expression) {\n  // 语句\n}\nif(Boolean-expression)\
    \ {\n  // 语句\n} else {\n  // 语句\n}\n```\n\n如果布尔表达式为真，则执行 `if` 语句内部的代码块。如果不是，则\
    \ `if` 语句结束后（右大括号之后）的第一组代码将被执行。布尔表达式必须产生一个布尔结果。语句要么是以分号终止的简单语句，要么是封装在大括号内的简单语句组（复合语句）。每当使用“语句”一词，总是意味着该语句可以是简单的或复合的。\n\
    \n这是一个 `if-else` 语句的示例：\n\n```java\npublic class Test {\n  public static void\
    \ main(String args[]) {\n    int x = 10;\n    if( x < 20 ) {\n      System.out.print(\"\
    This is if statement\");\n    }\n  }\n}\n```\n\n这将产生以下结果：\n输出:This is if statement.\n\
    \n### Switch case 语句\n\n`switch` 有时被称为选择语句。`switch` 语句根据整数表达式的值从代码段中进行选择。`switch`\
    \ 语句允许对变量与值列表进行相等性测试。每个值被称为一个 `case`，并且被切换的变量在每个 `case` 中都会被检查。它的通用形式是：\n\n```java\n\
    switch(integral-selector) {\n  case integral-value1 : statement; break;\n  case\
    \ integral-value2 : statement; break;\n  default:\n    statement;\n}\n```\n\n\
    （注：此处示例中 `default` 逻辑在原文中完整，已格式格式）\n\n"
- fmt: "\n# Java For Loop\n\n* The initialization step is executed first, and only\
    \ once. This step allows you to declare and initialize any loop control variables\
    \ and this step ends with a semi colon (`;`).\n* Next, the `Boolean expression`\
    \ is evaluated. If it is true, the body of the loop is executed. If it is false,\
    \ the body of the loop will not be executed and control jumps to the next statement\
    \ past the `for` loop.\n* After the `body` of the `for` loop gets executed, the\
    \ control jumps back up to the update statement. This statement allows you to\
    \ update any loop control variables. This statement can be left blank with a semicolon\
    \ at the end.\n* The `Boolean expression` is now evaluated again. If it is true,\
    \ the loop executes and the process repeats (body of loop, then update step, then\
    \ Boolean expression). After the `Boolean expression` is false, the `for` loop\
    \ terminates.\n\nFlow Diagram: ![Java For Loop](OEBPS/image3011.jpg)\n\nExample:\
    \ Following is an example code of the `for` loop in Java.\n\n```java\npublic class\
    \ Test {\n    public static void main(String args[]) {\n        for(int x = 10;\
    \ x < 20; x = x + 1) {\n            System.out.print(\"value of x : \" + x);\n\
    \            System.out.print(\"\\n\");\n        }\n    }\n}\n```\n\nThis will\
    \ produce the following result:\nOutput:\nvalue of x : 10\nvalue of x : 11\nvalue\
    \ of x : 12\nvalue of x : 13\nvalue of x : 14\nvalue of x : 15\nvalue of x : 16\n\
    value of x : 17\nvalue of x : 18\nvalue of x : 19\n\n# Loop Control Statements\n\
    \nLoop control statements change execution from its normal sequence. When execution\
    \ leaves a scope, all automatic objects that were created in that scope are destroyed.\
    \ Java supports the following control statements.\n\n* Break Statement\n* Continue\
    \ Statement\n\nThe `break` statement in Java programming language has the following\
    \ two usages —\n\n* When the `break` statement is encountered inside a loop, the\
    \ loop is immediately terminated and the program control resumes at the next statement\
    \ following the loop.\n* It can be used to terminate a case in the `switch` statement\
    \ (covered in the next chapter).\n\n### Syntax\nThe syntax of a break is a single\
    \ statement inside any loop: `break;`\n\nFlow Diagram: ![Java Break Statement](OEBPS/image3092.jpg)\n\
    \nExample:\n```java\npublic class Test {\n    public static void main(String args[])\
    \ {\n        int[] numbers = {10, 20, 30, 40, 50};\n        for(int x : numbers)\
    \ {\n            if(x == 30) {\n                break;\n            }\n      \
    \      System.out.print(x);\n            System.out.print(\"\\n\");\n        }\n\
    \    }\n}\n```\nThis will produce the following result:\nOutput\n10\n20\n\nThe\
    \ `continue` keyword can be used in any of the loop control structures. It causes\
    \ the loop to immediately jump to the next iteration of the loop.\n\n* In a `for`\
    \ loop, the `continue` keyword causes control to immediately jump to the update\
    \ statement.\n* In a `while` loop or `do/while` loop, control immediately jumps\
    \ to the `Boolean expression`.\n\n### Syntax\nThe syntax of a continue is a single\
    \ statement inside any loop — `continue;`\n\nFlow Diagram: ![Java Continue Statement](OEBPS/image3157.jpg)\n\
    \nExample:\n```java\npublic class Test {\n    public static void main(String args[])\
    \ {\n        int[] numbers = {10, 20, 30, 40, 50};\n        for(int x : numbers)\
    \ {\n            if(x == 30) {\n                continue;\n            }\n   \
    \         System.out.print(x);\n            System.out.print(\"\\n\");\n     \
    \   }\n    }\n}\n```\nOutput:\n10\n20\n40\n50\n\n# Arrays\n\nArrays are nicely\
    \ organized lists of data. Think of a numbered list that starts at zero and extends\
    \ one line every time you add something to the list. Arrays are useful for any\
    \ number of situations because they’re treated as a single hunk of data. For instance,\
    \ if you wanted to store a bunch of high scores, you’d want to do that with an\
    \ array. Initially, you might want to have a list of 10 items. You could in theory\
    \ use the following code to store each score.\n\n```java\nint score1;\nint score2;\n\
    int score3;\nint score4;\nint score5;\nint score6;\nint score7;\nint score8;\n\
    int score9;\nint score10;\n```\nTo make matters worse, if you needed to process\
    \ each value, you’d need to create a set of code that deals with each variable\
    \ by name. To check if `score2` is higher than `score1`, you’d need to write a\
    \ function specifically to check those two variables before switching them. Thank\
    \ goodness for arrays.\n\nThere are two types of array:\n\n* Single Dimensional\
    \ Array\n* Multidimensional Array\n"
