    array   for(int i=0;i<a.length;i++)//length is the property                                               of
    array   System.out.println(a[i]);     }}   Output:  10        20              70               40               50Declaration,
    Instantiation and Initialization of Java Array:We can declare, instantiate and
    initialize the java array together by:int a[]={33,3,4,5};//declaration, instantiation
    and                                    initialization   Let''s see the simple
    example to print this array.class Testarray1{   public static void main(String
    args[]){   int a[]={33,3,4,5};//declaration, instantiation and                                    initialization   //printing
    array   for(int i=0;i<a.length;i++)//length is the property                                                of array  System.out.println(a[i]);   }}   Output:33              3              4              5Passing
    Array to method in java:We can pass the java array to method so that we can reuse
    the same logic on any array.Let''s see the simple example to get minimum number
    of an array using method.class Testarray2{   static void min(int arr[]){   int
    min=arr[0];   for(int i=1;i<arr.length;i++)    if(min>arr[i])     min=arr[i];   System.out.println(min);   }    public
    static void main(String args[]){     int a[]={33,3,4,5};   min(a);   //passing
    array to method}}   Output: 3Multidimensional array in java:In such case, data
    is stored in row and column based index (also known as matrix form).Syntax to
    Declare Multidimensional Array in java:dataType[][] arrayRefVar; (or)   dataType
    [][]arrayRefVar; (or)   dataType arrayRefVar[][]; (or)   dataType []arrayRefVar[];    Example
    to instantiate Multidimensional Array in java:int[][] arr=new int[3][3]; //3 row
    and 3 column   Example to initialize Multidimensional Array in javaarr[0][0]=1;   arr[0][1]=2;   arr[0][2]=3;   arr[1][0]=4;   arr[1][1]=5;   arr[1][2]=6;   arr[2][0]=7;   arr[2][1]=8;   arr[2][2]=9;   Example
    of Multidimensional java array:Let''s see the simple example to declare, instantiate,
    initialize and print the 2Dimensional array.class Testarray3{   public static
    void main(String args[]){   //declaring and initializing 2D array   int arr[][]={{1,2,3},{2,4,5},{4,4,5}};   //printing
    2D array   for(int i=0;i<3;i++){    for(int j=0;j<3;j++){      System.out.print(arr[i][j]+"
    ");       }    System.out.println();         }      }  }   Output: 1 2 3             2
    4 5            4 4 5CHAPTER 8 | OBJECT ORIENTED PROGRAMMINGClassesThe most important
    part of any Java program is the class. Classes here are not the sort that students
    go to; rather, they are classes in terms of classification. Classes in Java appear
    in several different forms. Some are called partial classes, and some classes
    can even appear inside of another class; these classes are called nested classes.
    A class is a collection of instructions and data. The instructions can be referred
    to as functions or methods. The data stored in a class is called a field or property.
    All of the naming aside, what’s important is what classes do and how they’re used.Classes
    are flexible and easily changed, but this flexibility is not without some complexity.
    As we’ve seen before, the class declaration can contain a lot more than the following
    example. However, much of the complexity comes later in this book, when needed.When
    you approach a game or any sort of programming task it’s important to first collect
    data, and then figure out how to use the data. In most programming paradigms it’s
    best to start off with variables at the beginning of your new class. For instance,
    in this pseudo code we might want to know what day it is before going out:Time
    day = today;if (day == Friday){PartyTonight = true;}We start off with getting
    a day, and then deciding what to do tonight based on the day. We should refrain
    from partying and then checking what the day is unless we want to show up for
    work late.A class is a blueprint from which individual objects are created.Following
    is a sample of a class.Example:public class Dog {   String breed;   int age;   String
    color;   void barking() {   }   void hungry() {   }   void sleeping() {   }}A
    class can contain any of the following variable types.Local variables: Variables
    defined inside methods, constructors or blocks are called local variables. The
    variable will be declared and initialized within the method and the variable will
    be destroyed when the method has completed.Instance variables: Instance variables
    are variables within a class but outside any method. These variables are initialized
    when the class is instantiated. Instance variables can be accessed from inside
    any method, constructor or blocks of that particular class.Class variables: Class
    variables are variables declared within a class, outside any method, with the
    static keyword.A class can have any number of methods to access the value of various
    kinds of methods.In the above example, barking(), hungry() and sleeping() are
    methods.Following are some of the important topics that need to be discussed when
    looking into classes of the Java Language.Constructors:When discussing about classes,
    one of the most important sub topic would be constructors. Every class has a constructor.
    If we do not explicitly write a constructor for a class, the Java compiler builds
    a default constructor for that class.Each time a new object is created, at least
    one constructor will be invoked. The main rule of constructors is that they should
    have the same name as the class. A class can have more than one constructor.Following
    is an example of a constructor:Examplepublic class Puppy {   public Puppy() {   }  
    public Puppy(String name) {      // This constructor has one parameter, name.   }}Java
    also supports [Singleton Classes](https://www.tutorialspoint.com/java/java_using_singleton.htm) where
    you would be able to create only one instance of a class.Introduction to ObjectsObject
    oriented programming (OOP) was invented to associate data and logic into nicely
    packaged bundles of code. When you write a class in Java you’re creating blueprints
    and instructions for a new object. Any number of objects can then be constructed
    based on your blueprints. Programmers use the term instantiate when talking about
    creating an object from the class blueprint. Each instantiated object is an instance
    of the class from which it was constructed. The class is not itself one of the
    instances created by it. The newly created object contains all of the functions
    and data written into the class.All programming languages provide abstractions.
    It can be argued that the complexity of the problems you’re able to solve is directly
    related to the kind and quality of abstraction. By “kind” I mean, “What is it
    that you are abstracting?” Assembly language is a small abstraction of the underlying
    machine. Many so-called “imperative” languages that followed (such as FORTRAN,
    BASIC, and C) were abstractions of assembly language. These languages are big
    improvements over assembly language, but their primary abstraction still requires
    you to think in terms of the structure of the computer rather than the structure
    of the problem you are trying to solve.The programmer must establish the association
    between the machine model (in the “solution space,” which is the place where you’re
    implementing that solution, such as a computer) and the model of the problem that
    is actually being solved (in the “problem space,” which is the place where the
    problem exists, such as a business). The effort required to perform this mapping,
    and the fact that it is extrinsic to the programming language, produces programs
    that are difficult to write and expensive to maintain, and as a side effect created
    the entire “programming methods” industry. The alternative to modeling the machine
    is to model the problem you’re trying to solve. Early languages such as LISP and
    APL chose particular views of the world (“All problems are ultimately lists” or
    “All problems are algorithmic,” respectively). Prolog casts all problems into
    chains of decisions. Languages have been created for constraint-based programming
    and for programming exclusively by manipulating graphical symbols. (The latter
    proved to be too restrictive.)Each of these approaches may be a good solution
    to the particular class of problem they’re designed to solve, but when you step
    outside of that domain they become awkward. The object-oriented approach goes
    a step further by providing tools for the programmer to represent elements in
    the problem space. This representation is general enough that the programmer is
    not constrained to any particular type of problem. We refer to the elements in
    the problem space and their representations in the solution space as “objects.”
    (You will also need other objects that don’t have problem-space analogs.)The idea
    is that the program is allowed to adapt itself to the lingo of the problem by
    adding new types of objects, so when you read the code describing the solution,
    you’re reading words that also express the problem. This is a more flexible and
    powerful language abstraction than what we’ve had before.1 Thus, OOP allows you
    to describe the problem in terms of the problem, rather than in terms of the computer
    where the solution will run. There’s still a connection back to the computer:
    Each object looks quite a bit like a little computer—it has a state, and it has
    operations that you can ask it to perform. However, this doesn’t seem like such
    a bad analogy to objects in the real world—they all have characteristics and behaviors.To
    simply put, OOP is the process of building objects, instancing them, and then
    using them. Using objects involves reading data, using logic on the data, and
    then carrying out tasks based on the logic.Creating an Object:As mentioned previously,
    a class provides the blueprints for objects. So basically, an object is created
    from a class. In Java, the new keyword is used to create new objects.There are
    three steps when creating an object from a class:Declaration: A variable declaration
    with a variable name with an object type.Instantiation: The ''new'' keyword is
    used to create the object.Initialization: The ''new'' keyword is followed by a
    call to a constructor. This call initializes the new object.Following is an example
    of creating an object:public class Puppy {   public Puppy(String name) {      //
    This constructor has one parameter, name.      System.out.println("Passed Name
    is :" + name );   }   public static void main(String []args) {      // Following
    statement would create an object myPuppy      Puppy myPuppy = new Puppy( "tommy"
    );   } }Output:Passed Name is :tommyAccessing Instance Variables and Methods:Instance
    variables and methods are accessed via created objects. To access an instance
    variable, following is the fully qualified path:/* First create an object */ObjectReference
    = new Constructor();/* Now call a variable as follows */ObjectReference.variableName;/*
    Now you can call a class method as follows */ObjectReference.MethodName();Example:This
    example explains how to access instance variables and methods of a class.public
    class Puppy {   int puppyAge;   public Puppy(String name) {      // This constructor
    has one parameter, name.      System.out.println("Name chosen is :" + name );   }  
    public void setAge( int age ) {      puppyAge = age;   }   public int getAge(
    ) {      System.out.println("Puppy''s age is :" + puppyAge );      return puppyAge;   }  
    public static void main(String []args) {      /* Object creation */      Puppy
    myPuppy = new Puppy( "tommy" );      /* Call class method to set puppy''s age
    */      myPuppy.setAge( 2 );      /* Call another class method to get puppy''s
    age */      myPuppy.getAge( );      /* You can access instance variable as follows
    as well */      System.out.println("Variable Value :" + myPuppy.puppyAge );   }}If
    we compile and run the above program, then it will produce the following result:Output:Name
    chosen is :tommyPuppy''s age is :2Variable Value :2Characteristics of object-oriented
    programming:These characteristics represent a pure approach to object-oriented
    programming: 1\. Everything is an object. Think of an object as a fancy variable;
    it stores data, but you can “make requests” to that object, asking it to perform
    operations on itself. In theory, you can take any conceptual component in the
    problem you’re trying to solve (dogs, buildings, services, etc.) and represent
    it as an object in your program.  2\. A program is a bunch of objects telling
    each other what to do by sending messages. To make a request of an object, you
    “send a message” to that object. More concretely, you can think of a message as
    a request to call a method that belongs to a particular object.  3\. Each object
    has its own memory made up of other objects. Put another way, you create a new
    kind of object by making a package containing existing objects. Thus, you can
    build complexity into a program while hiding it behind the simplicity of objects.  4\.
    Every object has a type. Using the parlance, each object is an instance of a class,
    in which “class” is synonymous with “type.” The most important distinguishing
    characteristic of a class is “What messages can you send to it?”  5\. All objects
    of a particular type can receive the same messages. This is actually a loaded
    statement, as you will see later. Because an object of type “circle” is also an
    object of type “shape,” a circle is guaranteed to accept shape messages. This
    means you can write code that talks to shapes and automatically handle anything
    that fits the description of a shape. This substitutability is one of the powerful
    concepts in OOP.Even more succinct description of an object is: An object has
    state, behavior and identity. This means that an object can have internal data
    (which gives it state), methods (to produce behavior), and each object can be
    uniquely distinguished from every other object—to put this in a concrete sense,
    each object has a unique address in memory.An object has an interface:So, although
    what we really do in object-oriented programming is create new data types, virtually
    all object-oriented programming languages use the “class” keyword. When you see
    the word “type” think “class” and vice versa.Since a class describes a set of
    objects that have identical characteristics (data elements) and behaviors (functionality),
    a class is really a data type because a floating point number, for example, also
    has a set of characteristics and behaviors. The difference is that a programmer
    defines a class to fit a problem rather than being forced to use an existing data
    type that was designed to represent a unit of storage in a machine. You extend
    the programming language by adding new data types specific to your needs. The
    programming system welcomes the new classes and gives them all the care and type
    checking that it gives to built-in types. The object-oriented approach is not
    limited to building simulations. Whether or not you agree that any program is
    a simulation of the system you’re designing, the use of OOP techniques can easily
    reduce a large set of problems to a simple solution.   Once a class is established,
    you can make as many objects of that class as you like, and then manipulate those
    objects as if they are the elements that exist in the problem you are trying to
    solve. Indeed, one of the challenges of object-oriented programming is to create
    a one-to one mapping between the elements in the problem space and objects in
    the solution space. But how do you get an object to do useful work for you? There
    needs to be a way to make a request of the object so that it will do something,
    such as complete a transaction, draw something on the screen, or turn on a switch.
    And each object can satisfy only certain requests. The requests you can make of
    an object are defined by its interface, and the type is what determines the interface.
    A simple example might be a representation of a light bulb:![](OEBPS/image3719.jpg)Light
    lt = new Light();lt.on();The interface determines the requests that you can make
    for a particular object. However, there must be code somewhere to satisfy that
    request. This, along with the hidden data, comprises the implementation. From
    a procedural programming standpoint, it’s not that complicated.A type has a method
    associated with each possible request, and when you make a particular request
    to an object, that method is called. This process is usually summarized by saying
    that you “send a message” (make a request) to an object, and the object figures
    out what to do with that message (it executes code). Here, the name of the type/class
    is Light, the name of this particular Light object is lt, and the requests that
    you can make of a Light object are to turn it on, turn it off, make it brighter,
    or make it dimmer. You create a Light object by defining a “reference” (lt) for
    that object and calling new to request a new object of that type. To send a message
    to the object, you state the name of the object and connect it to the message
    request with a period (dot). From the standpoint of the user of a predefined class,
    that’s pretty much all there is to programming with objects. The preceding diagram
    follows the format of the Unified Modeling Language (UML). Each class is represented
    by a box, with the type name in the top portion of the box, any data members that
    you care to describe in the middle portion of the box, and the methods (the functions
    that belong to this object, which receive any messages you send to that object)
    in the bottom portion of the box. Often, only the name of the class and the public
    methods are shown in UML design diagrams, so the middle portion is not shown,
    as in this case. If you’re interested only in the class name, then the bottom
    portion doesn’t need to be shown, either.InterfacesAn interface is a reference
    type in Java. It is similar to class. It is a collection of abstract methods.
    A class implements an interface, thereby inheriting the abstract methods of the
    interface.Along with abstract methods, an interface may also contain constants,
    default methods, static methods, and nested types. Method bodies exist only for
    default methods and static methods.Writing an interface is similar to writing
    a class. But a class describes the attributes and behaviors of an object. And
    an interface contains behaviors that a class implements.Unless the class that
    implements the interface is abstract, all the methods of the interface need to
    be defined in the class.An interface is similar to a class in the following ways:'
