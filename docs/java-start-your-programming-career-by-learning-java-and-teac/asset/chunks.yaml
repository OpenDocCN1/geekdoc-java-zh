  trans: "\n\n| ![一个执行 java 命令的命令行，该命令转而执行一个 Java 主程序。](img/image835.jpg) |\n| 执行\
    \ java 命令的命令行，该命令转而执行一个 Java 主程序。 |\n\n以下是一个命令行示例：\n```bash\njava -cp classes\
    \ myjavacode.MyClass\n```\n\n该命令的第一部分是 `java` 命令。此命令启动了 `JVM`。在某些情况下，你可能需要指定 `java`\
    \ 命令在计算机上的完整路径（通常位于 Java 安装目录的 `bin` 子目录下）。\n\n第二个和第三个参数 `-cp classes` 告诉 `JVM`\
    \ 编译后的 Java 类位于哪个目录（`cp` 表示 class path，即类路径）。在这种情况下，编译后的 Java 类位于名为 `classes`\
    \ 的目录中。\n\n第四个参数是 `JVM` 要执行的 Java 类名。注意类名中也包含了该类所属的包名（即“全限定类名”）。\n\n### 向 `main()`\
    \ 方法传递参数\n\n你可以从命令行向 `main()` 方法传递参数。此行命令行展示了如何操作：\n```bash\njava -cp classes\
    \ myjavacode.MyClass Hello World\n```\n\n当 `JVM` 执行 `myjavacode.MyClass` 的 `main()`\
    \ 方法时，作为参数传递给 `main()` 方法的 `String` 数组将包含两个 `String`：\"Hello\" 和 \"World\"。\n\n\
    `main()` 方法可以这样访问来自的参数：\n```java\npackage myjavacode;\npublic class MyClass {\n\
    \    public static void main(String[] args) {\n        System.out.println( args[0]\
    \ );\n        System.out.println( args[1] );\n    }\n}\n```\n\n注意 `args` 数组对元素\
    \ 0 和元素 1 的引用（`args[0]` 和 `args[1]`）。`args[0]` 将包含 `String`（文本）Hello，而 `args[1]`\
    \ 将包含 `String` World。变量和数组将在后续文中进行更详细的解释。如果你现在还不完全理解它们，请不要担心。\n\n### Java 主类\n\
    \n如果你的 Java 程序中只有一个 Java 类包含 `main()` 方法，那么包含 `main()` 方法的该类通常被称为 `main class`（主类）。\n\
    \n你可以在项目中拥有任意数量带有 `main()` 方法的类。但是，Java 虚拟机一次只能指示运行其中一个。你仍然可以在 Java 虚拟机执行的 `main()`\
    \ 方法内部调用其他 `main()` 方法（尽管你还没有看到如何做到），你也可以启动多个虚拟机，每个虚拟机执行一个单一的 `main()` 方法。\n\n\
    ### 访问控制\n\n所有优秀的作者（包括编写软件的人）都知道，一件作品在经过重写（通常是多次重写）之前，它是不完美的。如果你将一段代码放在抽屉里一段时间，过后再回来，你可能会发现更好的实现方法。这就是重构的主要动力之一，即通过重写运行良好的代码使其更具可读性、可理解可维护性。\n\
    \n然而，这种改变和改进代码的愿望中存在一种紧张关系。通常会有消费者（客户端程序员）依赖你代码的某些方面。你想改变它，而他们希望它保持原样。因此，面向对象设计中的一个主要考虑因素是“将变化的部分与不变的部分分离”。这对于库来说尤为重要。库的消费者必须依赖他们使用的部分，并知道当新版本的库发布时，他们不需要重写代码。另一方面，库的创建者必须有自由进行修改和改进，并确保客户端代码不受影响。\n\
    \n这可以通过约定来实现。例如，库的程序员必须同意在修改类时不删除现有的方法，因为这会破坏客户端程序员的代码。然而，相反的情况更为棘手。在字段（field）的情况下，库的创建者如何知道哪些字段被客户端程序员访问过？对于仅作为类实现部分且不供客户端程序员直接使用的方法也是如此。如果库的创建者想要移除一个旧实现并换入一个新实现呢？更改这些任何成员都可能破坏客户端程序员的代码。因此，库的创建者就像被束缚住，无法更改任何内容。\n\
    \n为了解决这个问题，Java 提供了访问修饰符（access specifiers），允许库的创建者说明哪些是客户端程序员可以使用的，哪些不可用。从“最大访问”到“最少访问”的访问控制级别依次为\
    \ `public`、`protected`、包访问（没有关键字）和 `private`。从上一个段落你可能会认为，作为库的设计者，你会希望尽可能将所有内容保持为\
    \ `private`，并只暴露你想让客户端程序员使用的方法。这是完全正确的，尽管对于那些使用其他语言（尤其是 C）并习惯于无限制访问一切的人来说，这通常是违反直觉的。\n\
    \n### Java 中的包\n\nJava 中使用包是为了防止命名冲突、控制访问、使搜索/定位以及使用类、接口、枚举和注解变得容易。一个 `Package`（包）可以定义为相关类型（类、接口、枚举和注解）的组合，提供访问保护和命名空间管理。\n\
    \nJava 中一些现有的包包括：\n\n- `java.lang`:封装了基础类\n- `java.io`:用于输入输出函数的类封装在此包中\n"
- fmt: "\nProgrammers can define their own packages to bundle group of classes/interfaces,\
    \ etc. It is a good practice to group related classes implemented by you so that\
    \ a programmer can easily determine that the classes, interfaces, enumerations,\
    \ and annotations are related. Since the package creates a new namespace there\
    \ won't be any name conflicts with names in other packages. Using packages, it\
    \ is easier to provide access control and it is also easier to locate the related\
    \ classes.\n\n## Creating a Package\nWhile creating a package, you should choose\
    \ a name for the package and include a `package` statement along with that name\
    \ at the top of every source file that contains the classes, interfaces, enumerations,\
    \ and annotation types that you want to include in the package. The `package`\
    \ statement should be the first line in the source file. There can be only one\
    \ `package` statement in each source file, and it applies to all types in the\
    \ file. If a `package` statement is not used then the class, interfaces, enumerations,\
    \ and annotation types will be placed in the current default package.\n\n### Example\n\
    Let us look at an example that creates a package called `animals`. It is a good\
    \ practice to use names of packages with lower case letters to avoid any conflicts\
    \ with the names of classes and interfaces. Following package example contains\
    \ interface named `animals` —\n\n```java\n/* File name : Animal.java */\npackage\
    \ animals;\ninterface Animal {\n    public void eat();\n    public void travel();\n\
    }\n```\n\nNow, let us implement the above interface in the same package `animals`\
    \ —\n\n```java\n/* File name : MammalInt.java */\npackage animals;\npublic class\
    \ MammalInt implements Animal {\n    public void eat() {\n        System.out.println(\"\
    Mammal eats\");\n    }\n    public void travel() {\n        System.out.println(\"\
    Mammal travels\");\n    }\n    public int noOfLegs() {\n        return 0;\n  \
    \  }\n    public static void main(String args[]) {\n        MammalInt m = new\
    \ MammalInt();\n        m.eat();\n        m.travel();\n    }\n}\n```\n\nNow compile\
    \ the java files as shown below —\n```bash\njavac -d . Animal.java\njavac -d .\
    \ MammalInt.java\n```\n\nYou can execute the class file within the package and\
    \ get the result as shown below.\n```\nMammal eats\nMammal travels\n```\n\n##\
    \ The import Keyword\nIf a class wants to use another class in the same package,\
    \ the package name need not be used. Classes in the same package find each other\
    \ without any special syntax.\n\n### Example\nHere, a class named `Boss` is added\
    \ to the `payroll` package that already contains `Employee`. The `Boss` can then\
    \ refer to the `Employee` class without using the `payroll` prefix, as demonstrated\
    \ by the following `Boss` class.\n\n```java\npackage payroll;\npublic class Boss\
    \ {\n    public void payEmployee(Employee e) {\n        e.mailCheck();\n    }\n\
    }\n```\n\nWhat happens if the `Employee` class is not in the `payroll` package?\
    \ The `Boss` class must then use one of the following techniques for referring\
    \ to a class in a different package.\n\n- The fully qualified name of the class\
    \ can be used. For example — `payroll.Employee`\n- The package can be imported\
    \ using the `import` keyword and the wild card (`*`). For example — `import payroll.*;`\n\
    - The class itself can be imported using the `import` keyword. For example — `import\
    \ payroll.Employee;`\n\n**Note** — A class file can contain any number of import\
    \ statements. The import statements must appear after the `package` statement\
    \ and before the class declaration.\n\n## Access Modifiers\nAs the name suggests\
    \ access modifiers in Java helps to restrict the scope of a class, constructor,\
    \ variable, and method or data member. There are four types of access modifiers\
    \ available in java:\n\n1. **Default** – No keyword required\n2. **Private**\n\
    3. **Protected**\n4. **Public**\n\n- Visible to the package, the default. No modifiers\
    \ are needed.\n- Visible to the class only (private).\n- Visible to the world\
    \ (public).\n- Visible to the package and all subclasses (protected).\n\n### Default\
    \ Access Modifier - No Keyword\nDefault access modifier means we do not explicitly\
    \ declare an access modifier for a class, field, method, etc. A variable or method\
    \ declared without any access control modifier is available to any other class\
    \ in the same package. The fields in an interface are implicitly `public static\
    \ final` and the methods in an interface are by default `public`.\n\n### Example\n\
    Variables and methods can be declared without any modifiers, as in the following\
    \ examples —\n```java\nString version = \"1.5.1\";\nboolean processOrder() {\n\
    \    return true;\n}\n```\n\n### Private Access Modifier – Private\nMethods, variables,\
    \ and constructors that are declared `private` can only be accessed within the\
    \ declared class itself. Private access modifier is the most restrictive access\
    \ level. Class and interfaces cannot be `private`. Variables that are declared\
    \ `private` can be accessed outside the class, if `public` getter methods are\
    \ present in the class. Using the `private` modifier is the main way that an object\
    \ encapsulates itself and hides data from the outside world.\n\n### Example\n\
    The following class uses private access control :\n```java\npublic class Logger\
    \ {\n    private String format;\n    public String getFormat() {\n        return\
    \ this.format;\n    }\n    public void setFormat(String format) {\n        this.format\
    \ = format;\n    }\n}\n```\nHere, the `format` variable of `Logger` class is `private`,\
    \ so there's no way for other classes to retrieve or set it directly. So, to make\
    \ this variable available to the outside world, we defined two public methods:\
    \ `getFormat()`, which returns the value, and `setFormat(String format)`, which\
    \ sets its value.\n\n### Public Access Modifier – Public\nA class, method, constructor,\
    \ interface, etc. declared `public` can be accessed from any other class. Therefore,\
    \ fields, methods, blocks inside a public class can be accessed from any class.\
    \ However, if the public class we are trying to access is in a different package,\
    \ then the public class still needs to be imported. Because of class inheritance,\
    \ all public methods and variables of a class are inherited by its subclasses.\n\
    \n### Example\nThe following function uses public access control —\n```java\n\
    public static void main(String[] arguments) {\n    // ...\n}\n```\nThe `main()`\
    \ method of an application has to be public. Otherwise, it could not be called\
    \ by Java interpreter (such as `java`) to run the class.\n\n### Protected Access\
    \ Modifier – Protected\nVariables, methods, and constructors, which are declared\
    \ `protected` in a superclass can be accessed only by the subclasses in other\
    \ package or any class within the package of the protected members' class. The\
    \ protected access modifier cannot be applied to class and interfaces. Methods,\
    \ fields can be declared `protected`, however methods and fields in a interface\
    \ cannot be declared `protected`. Protected access gives the subclass a chance\
    \ to use the helper method or variable, while preventing a nonrelated class from\
    \ trying to use it.\n\n### Example\nThe following parent class uses protected\
    \ access control, to allow its child class override `openSpeaker()` method —\n\
    ```java\nclass AudioPlayer {\n    protected boolean openSpeaker(Speaker sp) {\n\
    \        // implementation details\n    }\n}\nclass StreamingAudioPlayer {\n \
    \   boolean openSpeaker(Speaker sp) {\n        // implementation details\n   \
    \ }\n}\n```\nHere, if we define `openSpeaker()` method as `private`, then it would\
    \ not be accessible from any other class otherthan `AudioPlayer`. If we define\
    \ it as `public`, then it would become accessible to all the outside world. But\
    \ our intention is to expose this method to its subclass only, that’s why we have\
    \ used protected modifier.\n\n## Access Control and Inheritance\nThe following\
    \ rules for inherited methods are enforced:\n\n- Methods declared `public` in\
    \ a superclass also must be `public` in all subclasses.\n- Methods declared `protected`\
    \ in a superclass must either be `protected` or `public` in subclasses; they cannot\
    \ be `private`.\n- Methods declared `private` are not inherited at all, so there\
    \ is no rule for them.\n"
