    ## 计算机编程简史：编程是如何产生的

    ### 机械计算机：

    第一台可编程的计算机无疑是查尔斯·巴贝奇在 19 世纪 20 年代建造的巴贝奇机器。它由数万个零件组成，重达数吨，是一个可以显示单位数字的巨型计算器。它被称为差分机（Difference
    Engine），1824 年，巴贝奇获得了英国学会颁发的金奖，以修正一组记录行星运动的表格。1833 年，一位名叫阿达·洛芙莱丝（Ada Lovelace）的女士在派对会上结了巴贝奇，她被介绍了差分机。几年后，显而易见她比巴贝奇更懂机器。尽管是洛芙莱斯夫人，她写了多关于差分机运行的文档，以及它的升级版本——分析机（Analytical
    Engine）。


    ### 逻辑：

    1848 年，乔治·布尔（George Boole）给了我们布尔逻辑。在差分机和第一台通用计算机出现之间花了近一个世纪的时间。感谢乔治，我们的计算机以二进制（0
    和 1）思考，真或假。1887 年，尤金·菲尔特（Eugene Felt）制造了带有按钮的计算机；感谢他，我们有了键盘。1890 年，打字机使用了带孔的纸记录人口普查，节省了
    200 万工作量。1900 年，在特拉（Tesla）和亚历山大·格拉姆·贝尔（Alexander Graham Bell）的帮助下，现代计算机发明了晶体管。1936
    年，康拉德·齐塞（Konrad Zuse）使用带孔的磁带编写了 Z1。


    ### 计算机科学：

    1940 年代，英国科学家艾兰·图灵（Alan Turing）设计并建造了一台名为“炸弹”（Bombe）的加密解密器，在第二次世界大战期间帮助了盟军。在 1930
    年代到 1950 年代之间，约翰·冯·诺依曼（John Von Neumann）凭借他的理论告诉计算机科学家计算机可以解决任何计算，称为图灵完备性（Turing
    completeness）。1954 年，德州仪器的戈登·蒂尔（Gordon Teal）引入了基于硅的晶体管，这是今天每台计算机都在使用的电子元件。


    ### 软件：

    齐塞在完成机器后不久使用 Plankalkül（第一种高级编程语言）编写了 Z3。1952 年，格蕾丝·霍珀（Grace Hopper）创建了第一个编译器，可以将人类可读的单词翻译成机器操作。这让编程面向了一个全新的观众。在
    1950 年代到 1970 年代之间，计算机和编程语言在复杂能力方面不断增长。1958 年，约翰·麦卡锡（John McCarthy）在马诸塞理工学院（MIT）发明了
    LISP。1967 年，面向对象编程出现在 Simula 中。1970 年，命令式和过程化编程出现在 Pascal 中。


    ### 现代计算机语言：

    贝尔实验室（Bell Labs）由贝尔成立于 19 世纪 20 年代，雇了丹尼斯·里奇（Dennis Ritchie）。1974 年，里奇出版了 C 语言，它已成为最流行的编程语言。1983
    年，C++ 作为“带类的 C”出现。詹姆斯·戈斯林（James Gosling）、迈克·谢里登（Mike Sheridan）和帕特里克·诺顿（Patrick
    Naughton）在 1991 年 6 月启动了 Java 语言项目。Java 最初设计用于交互式电视，但对于当时的数字电缆行业来说太先进了。该语言最初以戈斯林办公室外的一棵橡树命名为
    Oak。后来项目名为 Green，最后命名为 Java，来自咖啡。戈斯林设计的 Java 具有 C/C++ 风格的语法，系统应用程序员会感到熟悉。太阳微系统于
    1995 年发布了第一个公共实现 Java 1.0。它承诺“一次编写，随运行”（WORA），在流行平台上提供免费的运行时。Java 相当安全并具有可配置的安全性，它允许网络和文件访问限制。主要网页浏览器很快就加入了在网页中运行
    Java Applet 的功能，Java 迅速流行。亚瑟·范霍夫（Arthur van Hoff）用 Java 重写了 Java 1.0 编译器，以严格遵守
    Java 1.0 语言规范。随着 Java 2 的出现（1998 年 12 月发布为 J2SE 1.2），新版本为不同类型的平台构建了多种配置。J2EE 包含了运行在服务器环境的企业应用程序的技术和
    API，而 J2ME 针对移动应用程序优化了 API。桌面版本被重名为 J2SE。2006 年，为了营销目的，太阳重新命名了新的 Java。


    # 第二章 |入门


    ## 什么是编程？

    这一切关于编写代码。编程是我们组织数据并使用逻辑对其进行处理的过程。数据是计算机可以存储的一切；它们可以从数字到视频游戏中的僵尸角色。你通过将文本写入称为源代码的文件来实现这一点。写入文件的源代码取代了早期机器使用的打孔卡。当数据与逻辑结合并写入单个文件时，它们被称为类（class）。类也是数据，因此可以使用更多的逻辑进行管理。


    ![class](https://4.bp.blogspot.com/-0LaVc78_c2U/WBNMx1x7OdI/AAAAAAAAGQ/dlzw-uNb7PEAZFkRM5Rqx4RqLhMVkyGKCK4B/s1600/class.png)


    类用于在计算机内存中创建对象并可以复制以拥有它们自己的生命。类用于构建对象。类中的每个数据部分都是该对象的一部分。类内部的不同数据块被称为类成员。类成员也可以逻辑块，称为函数（functions）或方法（methods）。例如，在一个有僵尸群的游戏中，每个僵尸都是从僵尸类复制或实例化的。每个僵尸在类的每个属性或数据元素上都有独特的值。这意味着生命值和位置对于每个复制对象都是唯一的。从类创建的对象被称为实例（instances）。就像家族一样，对象可以相互继承属性。有时被称为子类（subclass）的孩子继承自父类的属性。例如，从僵尸创建的类可能会继承父类对大脑的渴望。为了有用，子僵尸还可以添加新对象并更改它从父类继承的对象。结果是，现在子僵尸可能拥有父类没有的触手。


    '
- fmt: "\n# Events\nEvents command the class to take actions on its data, which is\
    \ where functions come in. `Functions`, also known as `methods`, are sections\
    \ of logic that act on data. They allow your class to create additional events\
    \ and talk to yet more objects. As the player presses the trigger and moves the\
    \ joystick around, yet more events can be raised and messages can be sent. Events\
    \ and messages allow the player to interact with your world; logic events and\
    \ objects together build your game.\n\n# What is Data?\nData, in a general sense,\
    \ is sort of like a noun. Like nouns, data can be a person, place, or thing. Programmers\
    \ refer to these nouns as objects, and these objects are stored in memory as variables.\
    \ The word `variable` infers something that might change, but this isn’t always\
    \ the case. It’s better to think of a `variable` as a space in your computer’s\
    \ memory to put information. When you play word games like `MadLibs` you might\
    \ ask for someone’s name, an object, an adverb, and a place. Your result could\
    \ turn out like “Garth ate a jacket, and studiously played at the laundry-mat.”\
    \ In this case the name, object, adverb, and place are variable types. The data\
    \ is the word you use to assign the variable with.\n\nProgrammers use the word\
    \ `type` to denote what kind of data is going to be stored. Computers aren’t fluent\
    \ in English and don’t usually know the difference between the English types `noun`\
    \ and `adjective`, but they do know the difference between letters and a whole\
    \ variety of numbers. There are many predefined types in `java` or any other language.\
    \ If you add that to the ability to create new types of data, the kinds of data\
    \ we can store is practically unlimited.\n\nThe C# built-in types are sometimes\
    \ called `POD`, or `plain old data`. The term `POD` came from the original `C++`\
    \ standard which finds its origin dating back to 1979. `POD` types have not fundamentally\
    \ changed from their original implementation. So far we’ve used the word `type`\
    \ several times. Programmers define the word `type` to describe the variety of\
    \ data to be stored.\n\n# What is a Compiler?\nGenerally compiling is a term which\
    \ is often heard by everyone who is associated with programming, even if remotely.\
    \ A compiler is a software program that transforms high-level source code that\
    \ is written by a developer in a high-level programming language into a low level\
    \ object code (binary code) in machine language, which can be understood by the\
    \ processor. The process of converting high-level programming into machine language\
    \ is known as compilation.\n\nThe processor executes object code, which indicates\
    \ when binary high and low signals are required in the arithmetic logic unit of\
    \ the processor. Let us take an example to understand what does the above definition\
    \ means. If you ask any person who is associated with programming, that what the\
    \ first program he/she wrote was, then the obvious answer would be “Hello World”.\
    \ So let us also start with the same.\n\n```c\n#include<stdio.h>\nVoid main()\
    \ {\n    printf(\"Hello, world!\");\n}\n```\n\nThis most basic program prints\
    \ or displays the words \"Hello,World!\" on the computer screen. But there is\
    \ a problem. It is not that simple. Behind the curtains there is lot of complex\
    \ things going. Let us peep inside these things. The hard truth is that our computer\
    \ cannot understand the commands/instructions contained in a source file (`helloworld.c`),\
    \ because `C` is a high-level language which means, it contains various characters,\
    \ symbols, and words that represent complex, numbers-based instructions for eg.\
    \ `printf`, `main`, header files etc. The only instructions a computer can execute\
    \ are those written in machine language, consisting entirely of numbers that is\
    \ the binary language in terms of 0 and 1. Before our computer can run our `C`\
    \ program, our `compiler` should convert our `helloworld.c` into an object file;\
    \ then a program called a `linker` should convert the object file into an executable\
    \ file.\n\nThe drawing below illustrates the process.\n![Compilers](OEBPS/image313.jpg)\n\
    \nA compiler that converts machine language into high-level natural language is\
    \ called a `decompiler`. Compilers that produce the object code meant to run on\
    \ a system are called `cross-compilers`. Finally, a compiler that converts one\
    \ programming language into another is called a language translator.\n\nA compiler\
    \ executes four major steps:\n1. **Scanning**: The scanner reads one character\
    \ at a time from the source code and keeps track of which character is present\
    \ in which line.\n2. **Lexical Analysis**: The compiler converts the sequence\
    \ of characters that appear in the source code into a series of strings of characters\
    \ (known as `tokens`), which are associated by a specific rule by a program called\
    \ a `lexical analyzer`. A `symbol table` is used by the `lexical analyzer` to\
    \ store the words in the source code that correspond to the token generated.\n\
    3. **Syntactic Analysis**: In this step, syntax analysis is performed, which involves\
    \ preprocessing to determine whether the tokens created during lexical analysis\
    \ are in proper order as per their usage. The correct order of a set of keywords,\
    \ which can yield a desired result, is called `syntax`. The compiler has to check\
    \ the source code to ensure syntactic accuracy.\n4. **Semantic Analysis**: Semantic\
    \ Analysis: The compiler ensures that the program makes sense according to the\
    \ language rules (e.g., type checking).\n\nThe `compiler` executes four major\
    \ steps... (Note: The text provided repeated some sections, the structure follows\
    \ the logical flow provided).\n\n*(Note: The input text contained several repetitive\
    \ paragraphs regarding compilers and interpreters; I have cleaned the formatting\
    \ for professional readability)*.\n\n# Programming Environment Setup\nWhen we\
    \ say Environment Setup, it simply implies a base on top of which we can do our\
    \ programming. Thus, we need to have the required software setup, i.e., installation\
    \ on our PC which will be used to write computer programs, compile, and execute\
    \ them. For example, if you need to browse Internet, then you need the following\
    \ setup on your machine:\n"
  raw: 'Events command the class to take actions on its data, which is where functions
    come in.Functions, also known as methods, are sections of logic that act on data.
    They allow your class to create additional events and talk to yet more objects.As
    the player presses the trigger and moves the joystick around, yet more events
    can be raised and messages can be sent. Events and messages allow the player to
    interact with your world; logic events and objects together build your game.What
    is Data?Data, in a general sense, is sort of like a noun. Like nouns, data can
    be a person, place, or thing. Programmers refer to these nouns as objects, and
    these objects are stored in memory as variables. The word variable infers something
    that might change, but this isn’t always the case. It’s better to think of a variable
    as a space in your computer’s memory to put information. When you play word games
    like MadLibs you might ask for someone’s name, an object, an adverb, and a place.
    Your result could turn out like “Garth ate a jacket, and studiously played at
    the laundry-mat.” In this case the name, object, adverb, and place are variable
    types. The data is the word you use to assign the variable with.Programmers use
    the word type to denote what kind of data is going to be stored. Computers aren’t
    fluent in English and don’t usually know the difference between the English types
    noun and adjective, but they do know the difference between letters and a whole
    variety of numbers. There are many predefined types in java or any other language.If
    you add that to the ability to create new types of data, the kinds of data we
    can store is practically unlimited.The C# built-in types are sometimes called
    POD, or plain old data. The term POD came from the original C++ standard which
    finds its origin dating back to 1979\. POD types have not fundamentally changed
    from their original implementation.So far we’ve used the word type several times.
    Programmers define the word type to describe the variety of data to be stored.What
    is a Compiler?Generally compiling is a term which is often heard by everyone who
    is associated with programming, even if remotely. A compiler is a software program
    that transforms high-level source code that is   written by a developer in a high-level
    programming language into a low level object code (binary code) in machine language,
    which can be understood by the processor. The process of converting high-level
    programming into machine language is known as compilation.The processor executes
    object code, which indicates when binary high and low signals are required in
    the arithmetic logic unit of the processor.Let us take an example to understand
    what does the above definition means.If you ask any person who is associated with
    programming, that what the first program he/she wrote was, then the obvious answer
    would be “Hello World”. So let us also start with the same.         #include<stdio.h>                Void
    main()                   {                    printf("Hello, world!");                }  This
    most basic program prints or displays the words "Hello,World!" on the computer
    screen. But there is a problem. It is not that simple. Behind the curtains there
    is lot of complex things going. Let us peep inside these things. The hard truth
    is that our computer cannot understand the commands/instructions contained in
    a source file     (helloworld.c), because C is a high-level language which means,
    it contains various characters, symbols, and words that represent complex, numbers-based
    instructions for eg. printf, main, header files etc. The only instructions a computer
    can execute are those written in machine language, consisting entirely of numbers
    that is the binary language in terms of 0 and 1\. Before our computer can run
    our C program, our compiler should convert our     helloworld.c into an object
    file; then a program called a linker should convert the object file into an executable
    file.The drawing below illustrates the process.![Compilers](OEBPS/image313.jpg)A
    compiler that converts machine language into high-level natural language is called
    a decompiler. Compilers that produce the object code meant to run on a system
    are called cross-compilers. Finally, a compiler that converts one programming
    language into another is called a language translator.A compiler executes four
    major steps:Scanning: The scanner reads one character at a time from the source
    code and keeps track of which character is present in which line.Lexical Analysis:
    The compiler converts the sequence of characters that appear in the source code
    into a series of strings of characters (known as tokens), which are associated
    by a specific rule by a program called a lexical analyzer. A symbol table is used
    by the lexical analyzer to store the words in the source code that correspond
    to the token generated.Syntactic Analysis: In this step, syntax analysis is performed,
    which involves preprocessing to determine whether the tokens created during lexical
    analysis are in proper order as per their usage. The correct order of a set of
    keywords, which can yield a desired result, is called syntax. The compiler has
    to check the source code to ensure syntactic accuracy.Semantic Analysis: This
    step is comprised of several intermediate steps. First, the structure of tokens
    is checked, along with their order with respect to the grammar in a given language.
    The meaning of the token structure is interpreted by the parser and analyzer to
    finally generate an intermediate code, called object code. The object code includes
    instructions that represent the processor action for a corresponding token when
    encountered in the program. Finally, the entire code is parsed and interpreted
    to check if any optimizations are possible. Once optimizations can be performed,
    the appropriate modified tokens are inserted in the object code to generate the
    final object code, which is saved inside a file.So A compiler is a program that
    reads in as input a program (in some high-level programming language) and outputs
    machine language code (for some machine architecture). The machine language code
    can subsequently be executed any number of times using different input data each
    time. As a second example, the Java                 compiler javac transforms
    a .java source file into a .class file that is written in Java bytecode, which
    is the machine language for an imaginary machine known as the Java Virtual Machine.What
    is an interpreter?An interpreter is a program that reads in as input a source
    program, along with data for the program, and translates the source program instruction
    by instruction. For example, the Java interpreter javatranslate a .class file
    into code that can be executed natively on the underlying machine. Why does Java
    typically interpret instead of compile?The main advantage of compilation is that
    you end up with raw machine language code that can be efficiently executed on
    your machine. However, it can only be executed on one type of machine architecture
    (Intel Pentium, PowerPC). A primary advantage of a compiling to an intermediate
    language like Java bytecode and then interpreting is that you can achieve platform
    independence: you can interpret the same .class file on differently types of machine
    architectures. However, interpreting the bytecode is typically slower than executing
    pre-compiled machine language code. A second advantage of using the Java bytecode
    is that it acts as a buffer between your computer and the program. This enables
    you to download an untrusted program from the Internet and execute it on your
    machine with some assurances. Since you are running the Java interpreter (and
    not raw machine language code), you are protected by a layer of security which
    guards against malicious programs. It is the combination of Java and the Java
    bytecode that yield a platform-independent and secure environment, while still
    embracing a full set of modern programming abstractions.The Java bytecode and
    the java interpreter are not inherently specific to the Java programming language.
    For example, you can use Jython to compile from the Python programming language
    into Java bytecode, and then use java to interpret it. There are similar ML, Lisp,
    and Fortran compilers that compile into JAva bytecode. You could also use the
    Unix program gcj to compile directly from a .javasource file into a machine executable
    file a.out, which can be run natively on any Sparc microprocessors. Additionally,
    you can design hardware whose machine language is the Java bytecode. Sun Microsystems
    has done exactly this, making the Java Virtual Machine not so virtual.Why not
    use a real machine language instead of the Java bytecode?The Java bytecode is
    much simpler than a typical high-level programming language. It is much easier
    to write a Java bytecode interpreter for a new type of computer than it is to
    write a full Java compiler.Programming Environment SetupWhen we say Environment
    Setup, it simply implies a base on top of which we can do our programming. Thus,
    we need to have the required software setup, i.e., installation on our PC which
    will be used to write computer programs, compile, and execute them. For example,
    if you need to browse Internet, then you need the following setup on your machine:'
