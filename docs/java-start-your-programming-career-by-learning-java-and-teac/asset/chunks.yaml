    class. You can choose the name of the class to execute, but not the name of the
    method. The method must always be called main.Here is how the main method declaration
    looks when located inside the Java class declaration from earlier:package myjavacode;public
    class MyClass {    public static void main(String[] args) {    }}The three keywords public, static and void have
