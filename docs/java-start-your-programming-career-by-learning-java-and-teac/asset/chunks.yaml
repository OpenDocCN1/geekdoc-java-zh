    # 为什么 Java 中的 `char` 占用 2 个字节？`\u0000` 是什么？


    这是因为 Java 使用的是 Unicode 系统而不是 ASCII 编码系统。`\u0000` 是 Unicode 系统的最低范围。要了解更多关于 Unicode
    的详细说明，请访问下一页。


    ## 类型


    当我们给变量赋值时，例如 `int i = 1;`，我们实际上是做出了一个有趣的假设。我们假设使用 `1` 会自动推断出一个与变量类型匹配的值类型。计算机使用多种不同的数据类型来存储数字。到目前，我们一直看到
    `int` 这个词被到处提及，好像你已经知道 `int` 是什么了。在日常生活中，我们几乎不会认为数字 `1` 和 `1.0` 甚至单词“one（一）”之间有任何区别。


    作为人类，我们可以轻松地将数字概念化为测量单位并在它们之间进行转换。但对于计算机来说，单词“one”和数字 `1` 之间的转换并不容易。关键字 `int`
    是 `integer`（整数）的缩写。整数是整数数值。整数是 Java 的内置类型。基本上，这意味着整数是 Java 的基础组成部分。其他内置类型包括 `float`、`double`、`string`、`bool`
    和 `object`。较少使用的内置类型有 `char`、`short` 和 `byte`。总共有 15 种不同的内置类型。


    所有这些类型除 `object` 和 `string` 之外，都是值类型。你能够构建的任何数据类型必须基于这些内置类型。创建所有这些 `floats`、`doubles`
    和 `bools` 的系统根于计算的起源。还记得打孔卡和带孔的纸片吗？那些是 `1s` 和 `0s` 的记录，以机械开关（开启或关闭）的形式馈给计算机进行存储的。这些模式代表了数字、指令和逻辑。


    今天，我们仍然使用同一套 `1s` 和 `0s` 系统（即二进制），只是我们不需要再在纸上打孔来告诉计算机要做什么。创建和存储指令的方法已经变得复杂许多倍，但
    `1` 和 `0` 的原理是相同的。这些被称为 `bits`（比特）；该名称的一个可能来源是在纸卡上打完所有孔后留下的小纸屑。


    ## 值类型和引用类型


    `int`、`float`、`double` 和 `bool` 是常用的值类型。这种用法模式的基础与存储和组织计算机内存的系统有关。当你提到计算机存储时，你会使用
    `megabyte`（兆字节）或 `gigabyte`（吉字节）等词。值类型的存储有特定的目的：跟踪数值。


    **注意：** 单词 `mega` 指你计算机中的组件可以存储多少百万个字节。`Giga` 指如何存储每十亿个字节。你是否想过一个字节（byte）到底是什么？一个字节被称为
    `8-bit unsigned integer`，或者说是使用 `8 bits` 组成一个数字的系统。这意味着它是一个像 `0`、`7` 或 `32,767`
    这样的整数。`unsigned`（无符号）一词表示数字不能为负数，例如 `-512`。在计算机术语中，`1` 或 `0` 被称为 `bit`。我们不会详细介绍计算机计算机如何使用比特来计数的，这是一个非常有趣的自学课题。


    然而，知道字节的范围是有限的（从 `0` 到 `255`）非常重要。我只需给你这样一个概念：如果你使用二进制而不是十进制，你的 `10` 根手指可以数到 `1023`。你的手指可以表示一个
    `10-bit unsigned integer`。计算机的计算能力曾比现在受限得多。20 世纪 80 年代年代制造的 `8-bit` 游戏机颜色数量有限，确切来说是
    `256` 色。这种限制是基于处理器能够处理的比特数量。处理器在任何时刻使用的晶体管数量有限的。不久后，浮点协处理器被引入，它们通过拥有接近 `32 bits`
    的工作空间允许了得大的数值范围。在所有这些情况下，当你使用值类型时，该数字实际上是以 `1s` 和 `0s` 存储在计算机的 RAM 中的。这应该被认为是相当不起的。


    在过去，你必须经过重火圈才能存储一个值。现在你只需要输入 `float f = 3.1415926535;`，你就可以精确测量宇宙的周长，精度达到单个原子宽度。所有这些类型的共同点是它们被存储为单个元素。大值如
    `double gigawatts = 1210000000.0;` 和 `double mint = 2.0;` 使用相同数量的内存。你的计算机不会为其中一个
    `double` 分配更多的内存空间。这些类型被称为原始类型（primitive types）。`int` 和 `float` 之间的唯一区别在于它们每次使用的比特数，分别为
    `8` 和 `32`；而 `doubles` 使用 `64 bits`。


    `string` 和 `object` 类型在存储方式上略有不同。这些类型是任意数量较小元素的组合。`string` 或 `object` 越大，占用的内存块就越大。这些类型被称为引用类型（reference
    types）。


    ## 强类型


    这与你在键盘上如何打字无关！Java 能够看到数字之间的差异。整数 `1` 与 `1.0` 是不同的，尽管我们可以认为它们的值相同。这些差异可以通过添加字母来增加。`1.0`
    和 `1f` 实际上是不同的数字。Java 是一种强类型语言。当编程语言使用强类型时，期望将不同的类型分开。为了将一种类型转换为另一种类型，我们必须告诉 Java
    使用强制转换运算符（cast）。


    ## 理解浮点数


    浮点数多年来一直是计算机的焦点。获得浮点精度是许多计算机科学家的目标。由于小数点后的可能性是无限的，使用二进制无法真正表示任何分数。一个常见的例子是 `π`，我们称之为
    `pi`。今天，计算机设置了小数点之后的数字，出现的第一个比特通常是符号位（sign bit），设置数字的正负范围。后续剩余的比特被称为尾数位（mantissa）。`float`
    值可以向任何方向移动，但它限制了能够存储的值。在特殊考虑之前，计算机无法处理任意大的数字。为了将 `float` 转换为 `int`，你需要显式地在变量之前添加
    `(int)`。


    ## 关键字


    关键字是特殊的单词或符号，告诉编译器执行特定的操作。例如，行首的 `class` 关键字告诉编译器你正在创建一个类。类声明是这样行代码，告诉编译器你正要创建一个新类。单词出现的顺序很重要。英语需要句子和语法来向读者传达我们的思想。在代码中：


    ```java

    class className {

    // 在这里编写代码

    }

    ```

    每个类都需要一个名称；在上面的示例中我们把类命名为 `className`，尽管我们可以轻松地命名为 `Charles`。当命名新类时，名称变成了一个新的标识符。对于每个变量也是如此，尽管范围限制了变量存在的时间。我们学习了变量和范围。除了
    Java 期望的用途外，通常情况下，关键字为你提供了特定的命令。在 Java 编程语言中，关键字是语言中具有预定义的保留字；因此，程序员不能将关键字作为变量、方法或任何其他标识符。由于它们在语言中的特殊功能，大多数
    Java 集成开发环境使用语法高亮以不同的颜色显示关键字以便于识别。


    ### 关键字列表


    - **abstract**: 用于在 Java 中实现抽象。没有方法定义必须声明为 `abstract`。不能实例化抽象类。抽象方法必须在子类中实现。你不能在变量和构造函数中使用
    `abstract` 关键字。

    - **assert**（J2SE 1.4 添加）：描述放在 Java 程序中的断言（真假语句），表示开发者认为断言在该处始终为真。如果断言在运行时为假，会导致断言失败，通常会导致执行终止。可选地通过
    `ClassLoader` 方法启用。

    - **boolean**: 定义仅用于 "true" 或 "false" 值的布尔变量。

    - **break**: 用于结束当前循环体的执行。

    - **byte**: `byte` 关键字用于声明一个可以持有 8 位有符号补码整数的字段。该关键字也用于声明方法返回 `byte` 原始类型的值。

    - **case**: `switch` 块中的语句可以使用一个多个 `case` 或 `default` 标签标记。`switch` 语句评估其表达式，然后执行匹配
    `case` 标签之后的所有语句。

    - **catch**: 与 `try` 块和可选的 `finally` 块结合使用。`catch` 块中的语句指定当 `try` 块抛出特定类型的异常时该做什么。

    - **char**: 定义一个能够持有 Java 源文件字符集中的任何字符的字符变量。

    - **class**: 定义特定对象实现的类型。类定义定义了实例字段和类字段、方法以及内部类，并指定了类实现的 `interfaces`（接口）和该类的直接
    `superclass`（父类）。如果没有显式指定父类，则父类隐式为 [Object](https://docs.oracle.com/javase/8/docs/api/java/lang/Object.html)。`class`
    关键字也可以以 `Class.class` 的形式使用，在不需要该类实例的情况下获取 `Class` 对象。例如，`String.class` 可以代替 `new
    String()`。

    - **continue**: 用于在当前体结束处恢复程序执行。如果后面跟着一个标签，`continue` 将恢复执行。

    - **default**: `default` 关键字可以可选地用于 `switch` 语句，标记当没有 `case` 匹配时的语句。另一种，`default`
    关键字也可以用于 Java 注解中的值。从 Java 8 开始，`default` 关键字也用于接口中的默认实现。

    - **do**: `do` 关键字与 `while` 结合使用创建 `do-while` 循环，首先执行变量初始化，然后评估表达式。如果表达式为真，则执行与循环相关的语句，然后再次评估表达式；这持续到表达式为假。

    - **double**: `double` 关键字用于声明一个可以持有 64 位精度的浮点数变量。该关键字也用于声明方法返回 `double` 原始类型的值。

    - **else**: `else` 关键字与 `if` 结合创建 `if-else` 语句，测试逻辑表达式；如果表达式为真，执行与 `if` 相关的语句；如果表达式为假，执行与
    `else` 相关的语句。

    - **enum**（J2SE 5.0 添加）：Java 关键字用于声明枚举类型。

    - **extends**: 用于类声明以指定父类；用于接口声明以指定一个或多个接口。类 `X` `extends` 类 `Y` 通过添加字段或方法来增加功能；接口
    `Z` 被称为类 `Y` 的子接口。也用于指定泛型中的类型上界。

    - **final**: 定义一个不可更改的实体。具体来说：`final` 类不能被派生，`final` 方法不能被重写，`final` 变量最多作为左侧操作数执行命令。`final`
    类中的所有方法都是 `final` 的。

    - **finally**: 用于定义由 `try` 关键字之前定义的语句块。无论抛出了异常还是捕获了异常，`finally` 块在退出 `try` 块和
    `catch` 子句后执行。

    - **float**: `float` 关键字用于声明一个可以持有 32 位单精度 IEEE 754 浮点的变量。该关键字也用于声明方法返回原始类型 `float`
    的值。

    - **for**: `for` 关键字用于创建循环，指定变量初始化、逻辑表达式和递增。首先执行初始化，然后评估表达式。如果表达式为真，执行与循环相关的语句，然后执行递增。再次评估表达式；这持续到表达式为假。从
    J2SE 5.0 开始，`for` 关键字还可以用于创建所谓的“增强 for 循环”，指定数组或 `Iterable` 对象；循环的每次迭代执行使用不同元素的关联语句块。

    - **if**: `if`


    关键字用于创建 `if` 语句，测试逻辑表达式；如果表达式为真，执行与 `if` 语句相关的块。该关键字也可以用于创建 `if-else` 语句；见 `else`。

    - **implements**: 包含在类声明中以指定当前类实现的一个或多个接口。类继承接口所声明的类型和抽象方法。

    - **import**: 用于源文件开头，指定稍后引用的类或整个 `Java-packages`（包）。从 J2SE 5.0 开始，`import` 语句可以导入类的
    `static` 成员。

    - **instanceof**: 二进制运算符，接受对象引用作为第一个操作数，类或接口作为第二个操作数并产生布尔结果。`instanceof` 运算符仅当对象的运行时类型与类或接口兼容时才为真。

    - **int**: `int` 关键字用于声明一个可以持有 32 位有符号补码整数的变量。该关键字也用于声明方法返回原始类型 `int` 的值。

    - **interface**: 用于声明一种特殊的类类型，它只包含抽象或默认方法、常量（static final）字段和 `static` 接口。它稍后可以由使用
    `implements` 关键字声明接口的类实现。

    - **long**: `long` 关键字用于声明一个可以持有 64 位有符号补码整数的变量。该关键字也用于声明方法返回原始类型 `long` 的值。

    - **native**: 用于方法声明，指定该方法不是在同一个源文件中实现的，而是在另一种语言中。

    - **new**: 用于创建类或数组的实例。为此目的使用 `new` 并非必要（如 [Scala](https://en.wikipedia.org/wiki/Scala_(programming_language))
    所示），尽管它有两个作用：它允许方法和类名存在不同的命名空间。

    - **package**: 一组类。

    - **private**: `private` 关键字用于声明一个在类内部可见的变量。

    - **protected**: `protected` 关键字用于声明在包内和子类中可见。

    - **public**: `public` 关键字用于声明一个在任何地方都可见的。

    - **return**: `return` 关键字用于从方法返回。

    - **throw**: `throw` 关键字用于抛出异常实例。

    - **throws**: `throws` 关键字用于声明方法未处理的异常，将其传递给调用者。

    - **transient**: 声明一个实例字段不是对象的默认序列化形式。

    - **static**: `static` 关键字用于声明类级别的字段或方法。

    - **strictfp**:（Java 1.1 添加）`strictfp` 确保浮点运算精度。

    - **super**: `super` 关键字用于访问父类。

    - **switch**: `switch` 关键字用于多分支语句。

    - **this**: `this` 关键字用于引用当前类的类的实例。

    - **short**: `short` 关键字用于声明一个可以持有 16 位有符号补码整数的变量。

    - **synchronized**: `synchronized` 关键字用于确保同一时刻只有一个线程执行代码块。


