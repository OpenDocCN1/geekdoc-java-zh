- fmt: "\n# Socket Client Example\n\nThe following `GreetingClient` is a client program\
    \ that connects to a server by using a socket and sends a greeting, and then waits\
    \ for a response.\n\n### Example\n// File Name `GreetingClient.java`\n```java\n\
    import java.net.*;\nimport java.io.*;\npublic class GreetingClient {\n    public\
    \ static void main(String[] args) {\n        String serverName = args[0];\n  \
    \      int port = Integer.parseInt(args[1]);\n        try {\n            System.out.println(\"\
    Connecting to \" + serverName + \" on port \" + port);\n            Socket client\
    \ = new Socket(serverName, port);\n            System.out.println(\"Just connected\
    \ to \" + client.getRemoteSocketAddress());\n            OutputStream outToServer\
    \ = client.getOutputStream();\n            DataOutputStream out = new DataOutputStream(outToServer);\n\
    \            out.writeUTF(\"Hello from \" + client.getLocalSocketAddress());\n\
    \            InputStream inFromServer = client.getInputStream();\n           \
    \ DataInputStream in = new DataInputStream(inFromServer);\n            System.out.println(\"\
    Server says \" + in.readUTF());\n            client.close();\n        } catch(IOException\
    \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n# Socket\
    \ Server Example\n\nThe following `GreetingServer` program is an example of a\
    \ server application that uses the `Socket` class to listen for clients on a port\
    \ number specified by a command-line argument.\n\n### Example\n// File Name `GreetingServer.java`\n\
    ```java\nimport java.net.*;\nimport java.io.*;\npublic class GreetingServer extends\
    \ Thread {\n    private ServerSocket serverSocket;\n    public GreetingServer(int\
    \ port) throws IOException {\n        serverSocket = new ServerSocket(port);\n\
    \        serverSocket.setSoTimeout(10000);\n    }\n    public void run() {\n \
    \       while(true) {\n            try {\n                System.out.println(\"\
    Waiting for client on port \" + serverSocket.getLocalPort() + \"...\");\n    \
    \            Socket server = serverSocket.accept();\n                System.out.println(\"\
    Just connected to \" + server.getRemoteSocketAddress());\n                DataInputStream\
    \ in = new DataInputStream(server.getInputStream());\n                System.out.println(in.readUTF());\n\
    \                DataOutputStream out = new DataOutputStream(server.getOutputStream());\n\
    \                out.writeUTF(\"Thank you for connecting to \" + server.getLocalSocketAddress()\
    \ + \"\\nGoodbye!\");\n                server.close();\n            } catch(SocketTimeoutException\
    \ s) {\n                System.out.println(\"Socket timed out!\");\n         \
    \       break;\n            } catch(IOException e) {\n                e.printStackTrace();\n\
    \                break;\n            }\n        }\n    }\n    public static void\
    \ main(String[] args) {\n        int port = Integer.parseInt(args[0]);\n     \
    \   try {\n            Thread t = new GreetingServer(port);\n            t.start();\n\
    \        } catch(IOException e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n```\n\nCompile the client and the server then start the server as follows:\n\
    ```\n$ java GreetingServer 6066\n```\nWaiting for client on port 6066...\n\nCheck\
    \ the client program as follows\nOutput:\n```\n$ java GreetingClient localhost\
    \ 6066\n```\nConnecting to localhost on port 6066\nJust connected to /127.0.0.1:6066\n\
    Server says Thank you for connecting to /127.0.0.1:6066\nGoodbye!\n\n# URL Processing\n\
    \n`URL` stands for Uniform Resource Locator and represents a resource on the Wide\
    \ Web, such as a Web page or directory. This section shows you how to write Java\
    \ programs that communicate with a `URL`. A `URL` can be broken down into parts,\
    \ as follows: `protocol://host:port/path?query#ref`. Examples of protocols include\
    \ HTTP, HTTPS, and File. The `path` is also referred to as the `filename`, and\
    \ the `host` is also called the `authority`.\n\nThe following is a URL to a web\
    \ page whose protocol is `https://www.amrood.com/index.htm?language=en#j2se`.\
    \ Notice this URL does not specify a port, in which case the default port for\
    \ the protocol is used. With HTTP, the default port is 80.\n\n## URL Class\n\n\
    The `java.net.URL` class represents a `URL` and has a complete set of methods\
    \ to manipulate `URL` in Java. The `URL` class has several constructors for creating\
    \ `URLs`, including the following:\n\n| Sr.No. | Method & Description |\n| :---\
    \ | :--- |\n| 1 | `public URL(String protocol, String host, int port, String file)\
    \ throws MalformedURLException` Creates a `URL` by putting together the given\
    \ parts. |\n| 2 | `public URL(String protocol, String host, String file) throws\
    \ MalformedURLException` Identical to the previous constructor, except that the\
    \ default port for the protocol is used. |\n| 3 | `public URL(String url) throws\
    \ MalformedURLException` Creates a `URL` from the given `String`. |\n| 4 | `public\
    \ URL(URL context, String url) throws MalformedURLException` Creates a `URL` by\
    \ parsing together the `URL` and `String` arguments. |\n\nThe `URL` class contains\
    \ many methods for accessing the various parts of the `URL` being represented.\
    \ Some of the methods in the `URL` class include the following:\n\n| Sr.No. |\
    \ Method & Description |\n| :--- | :--- |\n| 1 | `public String getPath()` Returns\
    \ the path of the `URL`. |\n| 2 | `public String getQuery()` Returns the query\
    \ part of the `URL`. |\n| 3 | `public String getAuthority()` Returns the authority\
    \ of the `URL`. |\n| 4 | `public int getPort()` Returns the port of the `URL`.\
    \ |\n| 5 | `public int getDefaultPort()` Returns the default port for the `URL`.\
    \ |\n| 6 | `public String getProtocol()` Returns the protocol of the `URL`. |\n\
    | 7 | `public String getHost()` Returns the host of the `URL`. |\n| 8 | `public\
    \ String getFile()` Returns the filename of the `URL`. |\n| 9 | `public String\
    \ getRef()` Returns the reference part of the `URL`. |\n| 10 | `public URLConnection\
    \ openConnection() throws IOException` Opens a connection to the `URL`, allowing\
    \ a client to communicate with the resource. |\n\n### Example\nThe following `URLDemo`\
    \ program demonstrates the various parts of a `URL`. A `URL` is entered on the\
    \ command line, and the `URLDemo` program outputs each part of the given `URL`.\n\
    \n// File Name: `URLDemo.java`\n```java\nimport java.net.*;\nimport java.io.*;\n\
    public class URLDemo {\n    public static void main(String[] args) {\n       \
    \ try {\n            URL url = new URL(\"https://www.amrood.com/index.htm?language=en#j2se\"\
    );\n            System.out.println(\"URL is \" + url.toString());\n          \
    \  System.out.println(\"protocol is \" + url.getProtocol());\n            System.out.println(\"\
    authority is \" + url.getAuthority());\n            System.out.println(\"file\
    \ name is \" + url.getFile());\n            System.out.println(\"host is \" +\
    \ url.getHost());\n            System.out.println(\"path is \" + url.getPath());\n\
    \            System.out.println(\"port is \" + url.getPort());\n            System.out.println(\"\
    default port is \" + url.getDefaultPort());\n            System.out.println(\"\
    query is \" + url.getQuery());\n            System.out.println(\"ref is \" + url.getRef());\n\
    \        } catch(IOException e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n```\nOutput:\n```\nURL is https://www.amrood.com/index.htm?language=en#j2se\n\
    protocol is http\nauthority is www.amrood.com\nfile name is /index.htm?language=en\n\
    host is www.amrood.com\npath is /index.htm\nport is -1\ndefault port is 80\nquery\
    \ is language=en\nref is j2se\n```\n\n## URLConnections Class Methods\n\nThe `openConnection()`\
    \ method returns a `java.net.URLConnection`, an abstract class whose subclasses\
    \ represent the various types of URL connections. For example:\nIf you connect\
    \ to a URL whose protocol is HTTP, the `openConnection()` method returns an `HttpURLConnection`\
    \ object. If you connect to a URL that represents a JAR file, the `openConnection()`\
    \ method returns a `JarURLConnection` object, etc.\n"
