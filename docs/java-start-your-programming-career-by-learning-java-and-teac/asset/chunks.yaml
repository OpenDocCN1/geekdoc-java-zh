  raw: 'Reusing the implementation:Once a class has been created and tested, it should
    (ideally) represent a useful unit of code. It turns out that this reusability
    is not nearly so easy to achieve as many would hope; it takes experience and insight
    to produce a reusable object design. But once you have such a design, it begs
    to be reused. Code reuse is one of the greatest advantages that object-oriented
    programming languages provide. The simplest way to reuse a class is to just use
    an object of that class directly, but you can also place an object of that class
    inside a new class. We call this “creating a member object.” Your new class can
    be made up of any number and type of other objects, in any combination that you
    need to achieve the functionality desired in your new class. Because you are composing
    a new class from existing classes, this concept is called composition (if the
    composition happens dynamically, it’s usually called aggregation). Composition
    is often referred to as a “has-a” relationship, as in “A car has an engine.” ![](OEBPS/image4011.jpg)(This
    UML diagram indicates composition with the filled diamond, which states there
    is one car. I will typically use a simpler form: just a line, without the diamond,
    to indicate an association.5) Composition comes with a great deal of flexibility.
    The member objects of your new class are typically private, making them inaccessible
    to the client programmers who are using the class. This allows you to change those
    members without disturbing existing client code. You can also change the member
    objects at run time, to dynamically change the behavior of your program. Inheritance,
    which is described next, does not have this flexibility since the compiler must
    place compile-time restrictions on classes created with inheritance. Because inheritance
    is so important in object-oriented programming, it is often highly emphasized,
    and the new programmer can get the idea that inheritance should be used everywhere.
    This can result in awkward and overly complicated designs. Instead, you should
    first look to composition when creating new classes, since it is simpler and more
    flexible. If you take this approach, your designs will be cleaner. Once you’ve
    had some experience, it will be reasonably obvious when you need inheritance. Inheritance:By
    itself, the idea of an object is a convenient tool. It allows you to package data
    and functionality together by concept, so you can represent an appropriate problem-space
    idea rather than being forced to use the idioms of the underlying machine. These
    concepts are expressed as fundamental units in the programming language by using
    the class keyword. It seems a pity, however, to go to all the trouble to create
    a class and then be forced to create a brand new one that might have similar functionality.
    It’s nicer if we can take the existing class, clone it, and then make additions
    and modifications to the clone. This is effectively what you get with inheritance,
    with the exception that if the original class (called the base class or superclass
    or parent class) is changed, the modified “clone” (called the derived class or
    inherited class or subclass or child class) also reflects those changes.  ![](OEBPS/image4027.jpg)(The
    arrow in this UML diagram points from the derived class to the base class. As
    you will see, there is commonly more than one derived class.) A type does more
    than describe the constraints on a set of objects; it also has a relationship
    with other types. Two types can have characteristics and behaviors in common,
    but one type may contain more characteristics than another and may also handle
    more messages (or handle them differently). Inheritance expresses this similarity
    between types by using the concept of base types and derived types. A base type
    contains all of the characteristics and behaviors that are shared among the types
    derived from it. You create a base type to represent the core of your ideas about
    some objects in your system. From the base type, you derive other types to express
    the different ways that this core can be realized. For example, a trash-recycling
    machine sorts pieces of trash. The base type is “trash”, and each piece of trash
    has a weight, a value, and so on, and can be shredded, melted, or decomposed.
    From this, more specific types of trash are derived that may have additional characteristics
    (a bottle has a color) or behaviors (an aluminum can may be crushed, a steel can
    is magnetic). In addition, some behaviors may be different (the value of paper
    depends on its type and condition). Using inheritance, you can build a type hierarchy
    that expresses the problem you’re trying to solve in terms of its types. A second
    example is the classic “shape” example, perhaps used in a computer-aided design
    system or game simulation. The base type is “shape,” and each shape has a size,
    a color, a position, and so on. Each shape can be drawn, erased, moved, colored,
    etc. From this, specific types of shapes are derived (inherited)—circle, square,
    triangle, and so on—each of which may have additional characteristics and behaviors.
    Certain shapes can be flipped, for example. Some behaviors may be different, such
    as when you want to calculate the area of a shape. The type hierarchy embodies
    both the similarities and differences between the shapes.  ![](OEBPS/image4035.jpg)Casting
    the solution in the same terms as the problem is very useful because you don’t
    need a lot of intermediate models to get from a description of the problem to
    a description of the solution. With objects, the type hierarchy is the primary
    model, so you go directly from the description of the system in the real world
    to the description of the system in code. Indeed, one of the difficulties people
    have with object-oriented design is that it’s too simple to get from the beginning
    to the end. A mind trained to look for complex solutions can initially be stumped
    by this simplicity. When you inherit from an existing type, you create a new type.
    This new type contains not only all the members of the existing type (although
    the private ones are hidden away and inaccessible), but more importantly it duplicates
    the interface of the base class. That is, all the messages you can send to objects
    of the base class you can also send to objects of the derived class. Since we
    know the type of a class by the messages we can send to it, this means that the
    derived class is the same type as the base class. In the previous example, “A
    circle is a shape.” This type equivalence via inheritance is one of the fundamental
    gateways in understanding the meaning of object-oriented programming. Since both
    the base class and derived class have the same fundamental interface, there must
    be some implementation to go along with that interface. That is, there must be
    some code to execute when an object receives a particular message. If you simply
    inherit a class and don’t do anything else, the methods from the base-class interface
    come right along into the derived class. That means objects of the derived class
    have not only the same type, they also have the same behavior, which isn’t particularly
    interesting. You have two ways to differentiate your new derived class from the
    original base class. The first is quite straightforward: You simply add brand
    new methods to the derived class. These new methods are not part of the base-class
    interface. This means that the base class simply didn’t do as much as you wanted
    it to, so you added more methods. This simple and primitive use for inheritance
    is, at times, the perfect solution to your problem. However, you should look closely
    for the possibility that your base class might also need these additional methods.
    This process of discovery and iteration of your design happens regularly in object-oriented
    programming.  Inheritance can be defined as the process where one class acquires
    the properties (methods and fields) of another. With the use of inheritance the
    information is made manageable in a hierarchical order.The class which inherits
    the properties of other is known as subclass (derived class, child class) and
    the class whose properties are inherited is known as superclass (base class, parent
    class).extends Keyword:extends is the keyword used to inherit the properties of
    a class. Following is the syntax of extends keyword.Syntaxclass Super {   .....   .....}class
    Sub extends Super {   .....   .....}Example:class  Calculation  {   int z; public  void
    addition(int x,  int y)  {z = x + y;      System.out.println("The sum of the given
    numbers:"+z);   } public  void  Subtraction(int x,  int y)  {z = x - y;      System.out.println("The
    difference between the given numbers:"+z);   }}public  class  My_Calculation  extends  Calculation  {
    public  void multiplication(int x,  int y)  {z = x * y;      System.out.println("The
    product of the given numbers:"+z);   } public  static  void main(String args[])  {      int
    a =  20, b =  10;      My_Calculation demo =  new  My_Calculation();      demo.addition(a,
    b);      demo.Subtraction(a, b);      demo.multiplication(a, b);   }}Compile and
    execute the above code as shown below.javac My_Calculation.javajava My_CalculationAfter
    executing the program, it will produce the following result:Output:The sum of
    the given numbers:30The difference between the given numbers:10The product of
    the given numbers:200In the given program, when an object to My_Calculation class
    is created, a copy of the contents of the superclass is made within it. That is
    why, using the object of the subclass you can access the members of a superclass.The
    super keyword:The super keyword is similar to this keyword. Following are the
    scenarios where the super keyword is used.'
