    ## Socket 类方法


    `java.net.Socket` 类表示客户端和服务器用于相互通信的套接字。客户端通过实例化类来获取 `Socket` 对象，而服务器则通过 `accept()`
    方法的返回值获取 `Socket` 对象。


    `Socket` 类有五个构造函数，客户端可以使用它们连接到服务器——


    | 序号 | 方法与描述 |

    | :--- | :--- |

    | 1 | `public Socket(String host, int port) throws UnknownHostException, IOException`
    - 此方法尝试连接到指定端口的服务器。如果此构造函数没有抛出异常，则说明连接成功，客户端已连接到服务器。 |

    | 2 | `public Socket(InetAddress host, int port) throws IOException` - 此方法与上一个构造函数相同，不同之处主机由
    `InetAddress` 对象表示。 |

    | 3 | `public Socket(String host, int port, InetAddress localAddress, int localPort)
    throws IOException` - 连接到指定的主机和端口。 |

    | 4 | `public Socket(InetAddress host, int port, InetAddress localAddress, int
    localPort) throws IOException` - 此方法与上一个构造函数相同，不同之处主机由 `InetAddress` 对象表示。 |

    | 5 | `public Socket()` - 创建一个未连接的套接字。使用 `connect()` 方法将此套接字连接到服务器。 |


    当 `ServerSocket` 运行 `accept()` 时，在客户端连接之前该方法不会返回。当客户端连接后，`ServerSocket` 会在未指定的端口上创建一个新的
    `Socket` 并返回该新 `Socket` 的引用。此时，客户端和服务器之间建立了一个 TCP 连接，可以开始通信。


    - `public Socket accept() throws IOException` - 等待一个入的客户端。此方法会阻塞，直到客户端连接到指定端口的服务器，或者套接字超时（假设已使用
    `setSoTimeout()` 方法设置了超时值）。否则，此方法将无限阻塞。

    - `public void setSoTimeout(int timeout)` - 设置服务器套接字在 `accept()` 期间等待客户端的超时时间。

    - `public void bind(SocketAddress host, int backlog)` - 将套接字绑定到 `SocketAddress`
    对象中指定的服务器和端口。如果你使用无参数构造函数实例化了 `ServerSocket`，请使用此方法。


    这里列出了 `Socket` 类中一些感兴趣的方法。请注意，客户端和服务器都有 `Socket` 对象，因此这些方法可以被客户端和服务器调用。


    | 序号 | 方法与描述 |

    | :--- | :--- |

    | 1 | `public void connect(SocketAddress host, int timeout) throws IOException`
    - 此方法将套接字连接到指定的主机。只有当你使用无参数构造函数实例化 `Socket` 时，才需要此方法。 |

    | 2 | `public InetAddress getInetAddress()` - 此方法返回此套接字连接的另一个计算机的地址。 |

    | 3 | `public int getPort()` - 返回套接字在远程机器上的绑定端口。 |

    | 4 | `public int getLocalPort()` - 返回套接字在本地机器上的绑定端口。 |

    | 5 | `public SocketAddress getRemoteAddress()` - 返回远程套接字的地址。 |

    | 6 | `public InputStream getgetInputStream() throws IOException` - 返回套接字的输入流。输入流与远程套接字的输出流连接。
    |

    | 7 | `public OutputStream getOutputStream() throws IOException` - 返回套接字的输出流。输出流与远程套接字的输入流连接。
    |

    | 8 | `public void close() throws IOException` - 关闭套接字，使此 `Socket` 对象不再能够再次连接到任何服务器。
    |


    ## InetAddress 类方法


    该类表示 Internet 协议（IP）地址。以下是你在进行套接字编程时可能需要的有用方法：


    | 序号 | 方法与描述 |

    | :--- | :--- |

    | 1 | `static InetAddress getByAddress(byte[] addr)` - 根据原始 IP 地址返回一个 `InetAddress`
    对象。 |

    | 2 | `static InetAddress getByAddress(String host, byte[] addr)` - 根据提供的主机名和
    IP 地址创建 `InetAddress`。 |

    | 3 | `static InetAddress getByName(String host)` - 根据主机名确定主机的 IP 地址。 |

    | 4 | `String getHostAddress()` - 返回文本形式表示的 IP 地址字符串。 |

    | 5 | `String getHostName()` - 获取此 IP 地址的主机名。 |

    | 6 | `static InetAddress getLocalHost()` - 返回本地主机。 |

    | 7 | `String toString()` - 将此 IP 地址转换为 `String`。 |


