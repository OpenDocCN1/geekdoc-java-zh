    \    }\n    /* Utility function to print a linked list */\n    void printList(Node\
    \ head) {\n        while (head != null) {\n            System.out.print(head.data\
    \ + \" \");\n            head = head.next;\n        }\n        System.out.println(\"\
    \");\n    }\n    public static void main(String[] args) {\n        LinkedList\
