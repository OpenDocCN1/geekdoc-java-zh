  trans: "\n\n# 事件\n事件（Events）命令类对其数据执行操作，这正是函数的用武之地。函数（Functions），也被称为方法（methods），是对数据操作的逻辑部分。它们允许你的类创建额外的事件并与更多的对象通信。当玩家按下触发器并移动摇杆时，可以触发更多的事件并发送消息。事件和消息允许玩家与你的世界进行交互；逻辑事件和对象共同构建了游戏。\n\
    \n# 什么是数据？\n从广义上说，数据类似于名词。和名词一样，数据可以是人、地方或物。程序员将这些名词称为对象（objects），这些对象作为变量（variables）存储在内存中。`variable`\
    \ 一词暗示了某种可能会变化的东西，但情况并非总是如此。将 `variable` 视为计算机内存中用于存放信息的空间会更好。当你玩像 `MadLibs` 这样的文字游戏时，你可能会要求某人的名字、一个物体、一个副词和一个地点。你的结果可能是“加斯吃了一件夹克，并专心地在洗衣店玩耍。”在这种情况下，名字、物体、副词和地点就是变量类型。数据就是你用来赋值给变量的单词。\n\
    \n程序员使用 `type`（类型）一词表示将存储什么种类的数据。计算机并不精通英语，通常不知道英语类型 `noun`（名词）和 `adjective`（形容词）的区别，但它们知道字母与各种数字之间的区别。`java`\
    \ 或任何其他语言中都有许多内置类型。如果加上创建新类型数据的能力，我们能够存储的数据种类实际上是无限制的。\n\nC# 的内置类型有时被称为 `POD`\
    \ 或 `plain old data`（普通旧数据）。`POD` 一词源于原始的 `C++` 标准，其起源可以追溯到 1979 年。`POD` 类型从原始实现以来没有发生根本变化。到为止，我们已经多次使用了\
    \ `type` 这个词。程序员定义 `type` 来描述要存储的数据种类。\n\n# 什么是编译器？\n通常情况下，编译（compiling）是任何与编程相关的人（即使是远程）经常听到的术语。编译器是一种软件程序，它将开发者用高级编程语言编写的高源代码转换为机器语言的级对象代码（二进制代码），这种代码可以被处理器理解。将高级编程转换为机器语言的过程被称为编译。\n\
    \n处理器执行对象代码，这些代码指示了处理器算术逻辑单元何时需要二进制高低电信号。让我们举一个例子来理解上述定义的含义。如果你问任何与编程相关的人他/她写的第一个程序是什么，那么显而易见的答案将是“Hello\
    \ World”。所以让我们也从这里开始。\n\n```c\n#include<stdio.h>\nVoid main() {\n    printf(\"\
    Hello, world!\");\n}\n```\n\n这个最基本的程序在计算机屏幕上打印或显示“Hello,World!”字。但存在一个问题。它并没有那么简单。在幕后发生着很多复杂的事情。让我们窥探这些内部。事实是，我们的计算机无法理解源文件\
    \ (`helloworld.c`) 中包含的命令/指令，因为 `C` 是一种高级语言，这意味着它包含了各种字符、符号和单词，代表复杂的、基于数字的指令，例如\
    \ `printf`、`main`、头文件等。计算机可以执行的指令只有用机器语言编写的指令，完全由数字组成，即 0 和 1 的二进制语言。在我们的计算机运行我们的\
    \ `C` 程序之前，我们的 `compiler`（编译器）应该将 `helloworld.c` 转换为对象文件；然后一个名为 `linker`（链接器）的程序应该将对象文件转换为可执行文件。\n\
    \n下面的图说明了这一过程。\n![Compilers](img/image313.jpg)\n\n将机器语言转换为高级自然语言的编译器称为 `decompiler`（反汇编译器）。产生用于在系统上运行的对象代码的编译器被称为\
    \ `cross-compilers`（交叉编译器）。最后，将一种编程语言转换为另一种编程语言的编译器被称为语言翻译器。\n\n编译器执行四个主要步骤：\n\
    1. **扫描（Scanning）**：扫描器从源代码中一次读取一个字符，并跟踪哪个字符出现在哪几行中。\n2. **词法分析（Lexical Analysis）**：编译器将源代码中出现的字符序列转换为一系列字符字符串（称为\
    \ `tokens`，即标记），这些标记由一个名为 `lexical analyzer`（词法分析器）的程序按特定规则相关联。`lexical analyzer`\
    \ 使用 `symbol table`（符号表）来存储源代码中与生成的标记相对应的单词。\n3. **语法分析（Syntactic Analysis）**：在这一步中，执行语法分析，这涉及预处理以确定词法分析期间创建的标记是否按照其用法处于正确的顺序。一组可以产生所需结果的关键字正确顺序被称为\
    \ `syntax`（语法）。编译器必须检查源代码以确保语法的准确性。\n4. **语义分析（Semantic Analysis）**：语义分析：编译器确保程序根据语言规则是合理的（例如，类型检查）。\n\
    \n`compiler` 执行四个主要步骤……（注意：提供的文本重复了关于编译器和解释器的部分内容，结构遵循所提供的逻辑流）。\n\n*注：输入文本包含几段关于编译器和解释器的重复段落；我已对格式进行了清理以提高专业可读性）*\n\
    \n# 环境设置\n当我们说环境设置（Environment Setup）时，它意味着一个我们可以在上面进行编程的基础。因此，我们需要准备好所需的软件，即在我们的\
    \ PC 上安装用于编写计算机程序、编译和执行这些程序的软件。例如，如果你需要浏览互联网，那么你的机器上需要进行以下设置：\n\n"
