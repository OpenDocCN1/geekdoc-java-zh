    \n### 学习复制与粘贴\n“优秀的艺术家创造，伟大的艺术家窃取。”这里有很多代码示例供你复制并粘贴到你的项目中。本书的内容以及所有可下载的内容也无异。这意味着你必须理解代码在做什么，以便将其解释并调整以适应你的需求。\n\
    \n每个程序员都会习惯性地这样做。学习如何这样做非常重要，因为在许多情况下，不仅是为了学习，为了完成任何陌生的任务，你实际上需要这样做。编程是一个持续的学习过程。这是一门命令计算机的语言。\n\
    \n每当你学习一门新语言时，会有大量的词汇需要你查询。\n\n此外，每个程序员都会创造新词，这让你拥有一门你永远需要查字典的语言。当显示某些代码时，你会预期将这些代码复制到你的项目中。当你的手指准备好放在键盘上，你会养成打字的习惯。程序员通常打字速度很快是有原因的。这也是为什么程序员对偏好的键盘非常挑剔的原因。在大多数情况下，书中的项目将处于一种你可以阅读已经存在的文本的状态。大多数项目处于更完整的状态，你能够运行它们并看到预期的结果。作为一个程序员，我已经习惯了在互联网上搜索示例代码。一旦我发现了看起来很有用的代码，我就会将其复制并粘贴到一个简单的测试用例中。在我理解了代码在做什么之后，我会将其重写为更适合我特定案例的形式。\n\
    \n即使代码涉及一些有趣的技巧，我也会从这些代码中学习。随着学习新技巧，我作为一个程序员也在成长。学习新技巧的唯一方法是找到解决新问题的必要性，而我\n\n"
- fmt: "\n# MACHINE RELATED MATHEMATICAL PROBLEMS\n\nThey lack numerical mathematics\
    \ skills and do not understand why floating points arithmetic can fail you if\
    \ you don’t watch out\n\n# 9 WAYS TO BECOME A GREAT PROGRAMMER!\n\n## 1. PRACTICE\n\
    \nAsides from following tutorials, you should work on your own projects. \"The\
    \ most fundamental thing is that you actually go and code. I’ve heard it recommended\
    \ that by the time you finish college, you should have written 100,000 lines at\
    \ minimum.\"— Andrei Thorp from Evernote. \n\nBut how do I get start, you may\
    \ ask. \"I always tell people to find something they’re doing more than once a\
    \ week and to try to automate it. Ignore if anyone else has solved the problem\
    \ before, and just make a tool/utility for yourself that fixes a common issue\
    \ in your life.\"— Kasra Rahjerdi, Mobile Lead at Stack Overflow.\n\n\"Like any\
    \ other skill, it takes practice – deliberate practice, stepping outside of your\
    \ comfort zone and learning the nuance and subtleties – that set apart great from\
    \ good.”— Derick Bailey, the creator of WatchMeCode.net. Derick is a top 0.42%\
    \ StackOverflow user, and has also contributed to open source frameworks such\
    \ as MarionetteJS and BackboneJS.\n\nIt’s OK to fail. Coding is all about failing\
    \ and fixing things, and about learning how to do things better. If you don’t\
    \ build things and work on areas that you know you are weak on, you’ll never get\
    \ better.\n\nIf you ever need to receive advice on how to improve and what you’re\
    \ not doing so well on, feel free to ask an experienced developer to help your\
    \ get straightened up by either reviewing your code or walking you through concepts\
    \ you are having trouble understanding.\n\n## 2. BE PATIENT\n\nNo-brainer here,\
    \ but it’s easy to get frustrated by your lack of progress and forget that you’re\
    \ not alone. \"Becoming a good programmer takes a long, long time and a lot of\
    \ tedious evenings. Before you can write good code, you have to write hundreds\
    \ of thousands of lines.\"— Mike Arpaia, a former Etsy dev who now builds information\
    \ security software for Facebook.\n\nMike stresses that beginners should give\
    \ up on the assumption that one can become an excellent developer quickly. But…\
    \ what if you’re not even past the tutorial stages yet? What if you’re still banging\
    \ your head against the wall and wondering perhaps you’re just not cut out for\
    \ programming? Before you leap to conclusions, know that everyone has a different\
    \ learning style. Author of the Ruby on Rails Tutorial, Michael Hartl, points\
    \ out that beginners should try lots of different resources (books, videos, etc.)\
    \ to see what ‘clicks’.\n\nIn fact, Craig Coffman, the CTO of Reserve, has personally\
    \ learned through a lot of trial-and-error and by picking projects that were personal\
    \ and interesting. However, since all the interesting challenges are big ones,\
    \ he suggests beginners to start with biting off reasonably-sized pieces. That\
    \ way, when you lose interest or get stuck, you still have a feeling of progress\
    \ and accomplishment.\n\n## 3. STAY INTERESTED\n\nIf you’re bored by the project\
    \ you’re working on, you should probably reconsider any lofty goals of learning\
    \ to code. Or, maybe you’re just working on the wrong project or learning through\
    \ the wrong resource. Always keep yourself motivated by working on personal projects\
    \ that excites you.\n\nCoraline Ada Ehmke, founder of LGBTech and contributor\
    \ to high-profile open source projects such as Rails and RSpec, started coding\
    \ at a young age out of interest. However, her first class in college as a Computer\
    \ Science major made her doubt her passion.\n\nI remember our semester-long project\
    \ was to write software for an ATM. I was so bored and not challenged, I decided\
    \ that if that’s what life as an engineer was like, I didn’t want any part of\
    \ it, so I dropped out soon after.\n\nHowever, she continued to work on projects\
    \ she found interesting. By 1993 she was online and building web sites, and has\
    \ been developing web apps ever since.\n\n## 4. LOVE THE ERROR\n\nAs a beginner\
    \ you’ll likely be mired in bugs. If you feel intimidated by all the red, you’re\
    \ not alone. Ross Chapman, a UX Engineer who coded for Zendesk and now working\
    \ at ScienceExchange, admits to being a scared developer when he first started\
    \ out.\n\n\"I didn’t have the patience because I wasn’t ready to love the challenge\
    \ of fixing things. But that’s pretty much where all my really bad habits come\
    \ from.\"\n\nWith that said, Ross urges beginners to embrace errors as crucial\
    \ learning moments. Since you’ll be debugging for life, you should get used to\
    \ errors and learn to recognize the error messages. \"Being able to quickly parse\
    \ and understand error messages will save you a lot of time and get you a long\
    \ way. The fact you’ve tried will be very much appreciated by the person you’re\
    \ asking for help.\"— Jack Franklin, author of “Beginning jQuery”\n\nJack also\
    \ recommends beginners to make an attempt at fixing problems on their own at first.\
    \ When hitting a wall when debugging, Lee Byron, co-contributor to React, personally\
    \ attempts to understand what’s going on by making ample usage of the debugger\
    \ tools.\n\n\"Once I understand exactly what is happening – step by step, then\
    \ I can compare that to what I expected to happen and isolate the surprising parts\
    \ and see where my assumptions were wrong or how some code led to the surprising\
    \ situation.\"\n\nErrors aren’t limited to bugs, however. Sometimes, you make\
    \ bad decisions such as using the wrong data structure. According to Mike, getting\
    \ burned by those bad decisions will eventually help you learn when it’s reasonable\
    \ to use certain design patterns\n\n## 5. UNDERSTAND HOW THINGS WORK\n"
