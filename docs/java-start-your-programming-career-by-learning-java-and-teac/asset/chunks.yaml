    Similarly, you will need the following setup to start with programming using any
    programming language.


    *   A text editor to create computer programs.

    *   A compiler to compile the programs into binary format.

    *   An interpreter to execute the programs directly.


    We recommend you to use IDE (Integrated Development Environment), the handy, dandy
    piece of software that acts as text editor, debugger and compiler all in one sometimes-bloated
    but generally useful package. Unless you''re committed to working in a text editor
    and a command prompt window (and there are compelling reasons for doing exactly
    that) you might be looking for some advice on how to choose a good IDE, the pros
    and cons of various varieties, the relative costs (financial or system resources)
    of running a particular IDE, what other languages the IDE might handle well, the
    operating system(s) it runs on and ever so much more.


    Here is the list of two most common IDE used by Programmers.


    ### [Eclipse](http://www.eclipse.org/)

    *   **Languages**: C, C++, Python, Perl, PHP, Java, Ruby and more

    *   **Price**: FREE


    Eclipse is the free and open-source editor upon which many development frameworks
    are based. It''s one of the granddaddies in its field and comes highly recommended
    by many a professional developer. Eclipse began as a Java development environment
    and has greatly expanded through a system of lightweight plugins.


    ### [NetBeans](http://netbeans.org/)

    *   **Languages**: Java, JavaScript, PHP, Python, Ruby, C, C++ and more

    *   **Price**: FREE


    NetBeans is neck-and-neck with Eclipse as the most-recommended IDE in this category.
    It''s free and open-source, supports tons of languages with more plugins coming
    all the time, and is incredibly simple to install and use, even for a beginner.


    ## Compilation and Execution


    A simple Java project contains a single directory inside which all the Java source
    files are stored. The Java files are usually not stored directly inside the source
    directory, but in subdirectories matching their package structure. Packages are
    just a way to group together source files which belong together.


    When you compile all the source code in the source, the compiler produces one
    `.class` file for each `.java` file. The `.class` contains the compiled version
    of the `.java` file. In other words, the byte code for the `.java` file.


    It is the `.class` files that the Java Virtual Machine can execute. Not the `.java`
    files. Therefore it is normal to separate the `.java` files from the `.class`
    files. This is normally done by instructing the compiler to write the `.class`
    files into a separate directory. This directory is often called `classes`, but
    again, it is not a requirement, and it depends on what build tool or IDE etc.
    you are using.


    ### Compiling the Java Source Code


    You can compile your Java source directly from your IDE (if you use an IDE). Or,
    you can use the Java compiler that comes with the Java SDK. To compile your Java
    source code from the command line with the Java compiler, do this:


    *   Open a command prompt

    *   Change directory to your project''s root directory (not the source directory)

    *   Make sure the project root directory contains a source directory and a class
    directory

    *   Type in the command below (on Windows - other OS''es will look similar though):

