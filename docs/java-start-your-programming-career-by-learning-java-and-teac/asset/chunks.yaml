- fmt: "\n# Separator Tokens\n\nThe most common separator is the `;` semicolon. This\
    \ mark of punctuation is used to end a code statement. Other separators come in\
    \ pairs.\n\nCurly braces are used in pairs to separate groups of code statements.\
    \ The opening curly brace is the `{` with the pointy end pointed to the outside\
    \ of the group; this is paired with the `}` which closes the curly brace pair.\
    \ Parentheses start with the `(` and end with the `)` while square brackets start\
    \ with `[` and end with `]`. The different opening and closing braces, brackets,\
    \ and parentheses have specific purposes and are used to help identify what they\
    \ are being used for. There are angle brackets `<` and `>` as well; these are\
    \ used to surround data types. And don’t forget both single quotes `''` and double\
    \ quotes `\"\"`, which are used in pairs as well to surround symbols called strings.\n\
    \n**NOTE:** In many word processors a beginning and an ending quote (`“` and `”`)\
    \ are often used. The lexical analyzer doesn’t recognize these smart quotes, so\
    \ the text editor for programming uses straight quote marks (`\"`) ) instead.\
    \ These subtle changes aren’t so subtle once you realize that letters, numbers,\
    \ and every other character used in programming are all parsed as American Standard\
    \ Code for Information Interchange (`ASCII`) or unicode transformation format\
    \ (`UTF-8`), `16`, or `32`.\n\nBoth `ASCII` and `UTF` are names given to the database\
    \ of characters that the computer uses to read text. Computers don’t use eyes\
    \ to read. Rather, they use a database of numbers to look up each character being\
    \ used. Therefore, to a computer `“` looks more like `0x201C` and `\"` like `0x0022`,\
    \ if we were using `UTF-16`.\n\nCurly braces are used in code to separate statements.\
    \ Parentheses are usually used to accept data. Square brackets are often used\
    \ to help identify arrays. We’ll get into arrays later, but imagine something\
    \ like a spreadsheet or a graph paper till we get to their explanation.\n\n```java\n\
    int[] arrayNumbers = {1, (int) 3.0, 9000};\n```\n\nThe above statement assigns\
    \ three numbers to an array. The curly braces contain a pair of statements separated\
    \ by a comma. The second statement in the curly braces is converting a number\
    \ with a dot (`.`) into a number without a dot in it. This will take a bit of\
    \ explanation, but it’s good to get used to seeing this sort of thing. We’ll get\
    \ to what an array is soon enough, as well as a dot operator.\n\nOften, when learning\
    \ to program you’ll see many strange tokens which might not seem to have any meaning.\
    \ It’s up to you to observe every token you come across and try to understand\
    \ what it does. If none of the statements makes sense that’s fine.\n\n# Operator\
    \ Tokens\n\nOperators are like keywords but use only a few non-word characters.\
    \ The colon or semi-colon is an operator; unlike keywords, operators change what\
    \ they do based on where they appear, or how they are used. This behavior shifting\
    \ is called operator overloading, and it’s a complex subject that we’ll get into\
    \ later. It’s also important to know that you can make up your own operators when\
    \ you need to.\n\nCommas in Java have a different meaning. They’re used to separate\
    \ different data values like:\n```java\nfor (int i = 0, j = 1; ; i++, j++)\n```\n\
    \n# Other Operator Tokens\n\nOperators in general are special characters that\
    \ take care of specific operations between variables. Notation or the order in\
    \ which operators and variables appear is normally taught with the following notation\
    \ or mathematic grammar: `a + b = c`. However, in programming the following is\
    \ preferred: `c = a + b;`; the change is made because the `=` operator in Java\
    \ works differently from its function commonly taught in math class. The left\
    \ side of the `=` operator is the assignment side, and the right side is the operation\
    \ side. This puts the emphasis on the value assigned rather than how it’s assigned.\
    \ The result is more important than how the problem is solved since the computer\
    \ is doing the math. In programming the above example should be read as “c is\
    \ assigned a plus b.” \n\n# Literals\n\nLiterals come in many different forms;\
    \ similar to operators which appear as things like `+`, `-`, or `=` literals are\
    \ the tokens that often go between them. Numbers are considered literals, or tokens\
    \ that are used in a literal manner. Numbers can be called numeric literals. When\
    \ something is put into quotes, as in “I’m a literal,” you are writing a string\
    \ literal. Literals are common throughout nearly all programming languages and\
    \ form the base of Java’s data types.\n\n# Transitive and Non-Transitive Operations\n\
    \nIn math class it’s sometimes taught how some operations are transitive and others\
    \ not. For instance `2 + 3 + 4` and `4 + 3 + 2` result in the same values. Where\
    \ each number appears between the operators doesn’t matter, so the `+` operator\
    \ is considered transitive. This concept holds true in Java. Results change when\
    \ we start to mix operators.\n\n```java\nint a = 1 + 2 - 4 + 7; //a = 6\nint b\
    \ = 7 + 4 - 2 + 1; //b = 10\n```\n\nThis code fragment shows two different results\
    \ using the same operators but with different number placement. We’ll see how\
    \ to overcome these problems later on when we start using them in our game. Operator\
    \ order is something to be aware of, and it’s important to test each step as we\
    \ build up our calculations to make sure our results end up with values we expect.\
    \ To ensure that the operations happen as you expect, either you can use parentheses\
    \ to contain operands or you can do each calculation.\n\n# CHAPTER 4 | BASIC OF\
    \ JAVA PROGRAM\n\n## Structure of Java Program\n\nJava program consists of different\
    \ sections. Some of them are mandatory but some are optional. The optional section\
    \ can be excluded from the program depending upon the requirements of the programmer.\n\
    \n### Documentation Section\nIt includes the comments to tell the program's purpose.\
    \ It improves the readability of the program.\n\n### Package Statement\nIt includes\
    \ statement that provides a package declaration.\n\n### Import statements\nIt\
    \ includes statements used for referring classes and interfaces that are declared\
    \ in other packages.\n\n### Interface Section\nIt is similar to a class but only\
    \ includes constants, method declaration.\n\n### Class Section\nThe Class section\
    \ describes the information about user-defined classes present in the program.\
    \ A class is a collection of fields (data variables) and methods that operate\
    \ on the fields. Every program in Java consists of at least one class definition.\
    \ This class definition declares the main method. It is from where execution of\
    \ program actually starts.\n\n## DOCUMENTATION Section\n\nIt includes the comments\
    \ that improve the readability of the program. A comment is a non-executable statement\
    \ that helps to read and understand program especially when programs get complex.\
    \ It is simply a message that exists only for the programmer and is ignored by\
    \ the compiler. A good program should include comments that describe the purpose\
    \ of the program, author name, date and time of creation. This section is optional\
    \ and comments may appear anywhere in the program.\n\nJava programming language\
    \ supports three types of comments:\n\n- **Single line (or end-of line) comment:**\
    \ It starts with a double slash symbol `//` and terminates at the end of the current\
    \ line. The compiler ignores everything from `//` to the end of the line. For\
    \ example:\n```java\n// Calculate sum of two numbers\n```\n\n- **Multiline Comment:**\
    \ Java programmer can use C/++ comment style that begins with `/*` and ends with\
    \ `*/`. All the text written between the delimiter is ignored by the compiler.\
    \ This style of comments can be used on part of a line, a whole line or more commonly\
    \ to define multi-line comment. For example:\n```java\n/*\ncalculate sum of two\
    \ numbers\n*/\n```\nComments cannot be nested. In other words, you cannot comment\
    \ a line that already includes traditional comment. For example:\n```java\n/*\
    \ x = y \n/* initial value */\n+ z; */\n```\nabove is wrong.\n\n- **Documentation\
    \ comments:** This comment style is new in Java. Such comments begin with delimiter\
    \ `/**` and end with `*/`. The compiler also ignores this type of comments just\
    \ like it ignores comments that use `/*` and `*/`. The main purpose of this type\
    \ of comment is to automatically generate program documentation. The `javadoc`\
    \ tool reads these comments and uses them to prepare your program's documentation\
    \ in HTML format. For example:\n```java\n/**\nThe text enclosed here will be part\
    \ of program documentation\n*/\n```\n\n## PACKAGE STATEMENT\n\nJava allows you\
    \ to group classes in a collection known as package. A package statement includes\
    \ a statement that provides a package declaration. It must appear as the first\
    \ statement in the source code file before any class or interface declaration.\
    \ This statement is optional. For example: Suppose you write the following package\
    \ declaration as the first statement in the source file.\n```java\npackage employee;\n\
    ```\nThis statement declares that all classes and interfaces defined in this source\
    \ file are part of the employee package. Only one package declaration can appear\
    \ in the source file.\n\n## IMPORT STATEMENT\n\nJava contains many predefined\
    \ classes that are stored into packages. In order to refer these standard predefined\
    \ classes in your program, you need to use fully qualified name (i.e. `Packagename.className`).\
    \ But this is a very tedious task as one need to retype the package path name\
    \ along with the classname. So a better alternative is to use an import statement.\
    \ An import statement is used for referring classes that are declared in other\
    \ packages. The import statement is written after a package statement but before\
    \ any class definition. You can import a specific class or all the classes of\
    \ the package. For example: If you want to import `Date` class of `java.util`\
    \ package using import statement then write\n```java\nimport java.util.Date;\n\
    ```\nThis statement allows the programmer to use the simple classname `Date` rather\
    \ than fully qualified classname `java.util.Date` in the code. Unlike package\
    \ statement, you can specify more than one import statement in your program. For\
    \ example:\n```java\nimport java.util.Date; /* imports only the Date class in\
    \ java.util package */\nimport java.applet.*; // imports all the classes in java\
    \ applet //package\n```\n\n## INTERFACE SECTION\n\nIn the interface section, we\
    \ specify the interfaces. An interface is similar to a class but contains only\
    \ constants and method declarations. Interfaces cannot be instantiated. They can\
    \ only be implemented by classes or extended by other interfaces. It is an optional\
    \ section and is used when we wish to implement multiple inheritance feature in\
    \ the program.\n```java\ninterface stack{\n    void push(int item); // Insert\
    \ item into stack\n    int pop(); // Delete an item from stack\n}\n```\n\n## CLASS\
    \ SECTION\n\nThe Class section describes the information about user-defined classes\
    \ present in the program. A class is a collection of fields (data variables) and\
    \ methods that operate on the fields. Every program in Java consists of at least\
    \ one class definition. This class definition declares the main method. It is\
    \ from where execution of program actually starts.\n"
