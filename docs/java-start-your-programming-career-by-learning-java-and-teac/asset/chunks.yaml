    alternative is called resumption. It means that the exception handler is expected
    to do something to rectify the situation, and then the faulting method is retried,
    presuming success the second time. If you want resumption, it means you still
    hope to continue execution after the exception is handled. If you want resumption-like
    behavior in Java, don’t throw an exception when you encounter an error. Instead,
    call a method that fixes the problem. Alternatively, place your try block inside
    a while loop that keeps reentering the try block until the result is satisfactory. Historically,
    programmers using operating systems that supported resumptive exception handling
    eventually ended up using termination-like code and skipping resumption. So although
    resumption sounds attractive at first, it isn’t quite so useful in practice. The
    dominant reason is probably the coupling that results: A resumptive handler would
    need to be aware of where the exception is thrown, and contain non-generic code
    specific to the throwing location. This makes the code difficult to write and
    maintain, especially for large systems where the exception can be generated from
    many points.Catching any exception:It is possible to create a handler that catches
    any type of exception. You do this by catching the base-class exception type Exception
    (there are other types of base exceptions, but Exception is the base that’s pertinent
    to virtually all programming activities): catch(Exception e) {   System.out.println("Caught
    an exception");}This will catch any exception, so if you use it you’ll want to
    put it at the end of your list of handlers to avoid preempting any exception handlers
    that might otherwise follow it. Since the Exception class is the base of all the
    exception classes that are important to the programmer, you don’t get much specific
    information about the exception, but you can call the methods that come from its
    base type Throwable: String getMessage( )String getLocalizedMessage( )Gets the
    detail message, or a message adjusted for this particular locale. String toString(
    ) Returns a short description of the Throwable, including the detail message if
    there is one. void printStackTrace( ) voidprintStackTrace(PrintStream)  voidprintStackTrace(java.io.PrintWriter)  Prints
    the Throwable and the Throwable’s call stack trace. The call stack shows the sequence
    of method calls that brought you to the point at which the exception was thrown.
    The first version prints to standard error, the second and third print to a stream
    of your choice (in the I/O chapter, you’ll understand why there are two types
    of streams). Throwable fillInStackTrace( ) Records information within this Throwable
    object about the current state of the stack frames. Useful when an application
    is rethrowing an error or exception (more about this shortly). In addition, you
    get some other methods from Throwable’s base type Object (everybody’s base type).
    The one that might come in handy for exceptions is getClass( ), which returns
    an object representing the class of this object. You can in turn query this Class
    object for its name with getName( ), which includes package information, or getSimpleName(
    ), which produces the class name alone. Here’s an example that shows the use of
    the basic Exception methods: public class ExceptionMethods {   public static void
    main(String[] args) {     try {      throw new Exception("My Exception");     }
    catch(Exception e) {      print("Caught Exception");       print("getMessage():"
    + e.getMessage());       print("getLocalizedMessage():" +         e.getLocalizedMessage());      print("toString():"
    + e);       print("printStackTrace():");       e.printStackTrace(System.out);     }  }}Output:Caught
    ExceptiongetMessage() : My ExceptiongetLocalizedMessage() : My ExceptiontoString():
    java.lang.Exception : My ExceptionprintStackTrace():java.lang.Exception: My Exception         at
    ExceptionMethods.main(ExceptionMethods.java:8)You can see that the methods provide
    successively more information—each is effectively a superset of the previous one. CHAPTER
    10 | Algorithms & the Big O NotationThinking in AlgorithmsAn algorithm is a detailed
    step-by-step instruction set or formula for solving a problem or completing a
    task. In computing, programmers write algorithms that instruct the computer how
    to perform a task.When you think of an algorithm in the most general way (not
    just in regards to computing), algorithms are everywhere. A recipe for making
    food is an algorithm, the method you use to solve addition or long division problems
    is an algorithm, and the process of folding a shirt or a pair of pants is an algorithm.So,
    what is a programming algorithm?You can think of a programming algorithm as a
    recipe that describes the exact steps needed for the computer to solve a problem
    or reach a goal. We''ve all seen food recipes - they list the ingredients needed
    and a set of steps for how to make the described meal. Well, an algorithm is just
    like that. In computer lingo, the word for a recipe is a procedure, and the ingredients
    are called inputs. Your computer looks at your procedure, follows it to the letter,
    and you get to see the results, which are called outputs.    A programming algorithm
    describes how to do something, and your computer will do it exactly that way every
    time. Well, it will once you convert your algorithm into a language it understands!However,
    it''s important to note that a programming algorithm is not computer code. It''s
    written in  simple English (or whatever the programmer speaks). It doesn''t beat
    around the bush--it has a start, a middle, and an end. In fact, you will probably
    label the first step ''start'' and the last step ''end.'' It includes only what
    you need to carry out the task. It does not include anything unclear, often called
    ambiguous in computer lingo, that someone reading it might wonder about.It always
    leads to a solution and tries to be the most efficient solution we can think up.
    It''s often a good idea to number the steps, but you don''t have to. Instead of
    numbered steps, some folks use indentation and write in pseudocode, which is a
    semi-programming language used to describe the steps in an algorithm. But, we
    won''t use that here since simplicity is the main thing.Qualities of a good algorithm:'
