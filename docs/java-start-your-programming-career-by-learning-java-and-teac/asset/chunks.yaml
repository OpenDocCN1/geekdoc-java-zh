  trans: "\n\n程序员可以定义自己的包来将一组类/接口等组合在一起。将你实现的相关的类进行分组是一种良好的做法，这样程序员就可以轻松确定哪些类、接口、枚举和注解是相互相关的。由于包创建了新的命名空间，因此不会与其他包中的名称发生命名冲突。使用包，可以更方便地提供访问控制，同时也更容易定位到相关的类。\n\
    \n## 创建包\n在创建包时，你应该为包选择一个名称，并在每个包含你想包含在包中的类、接口、枚举和注解类型的源文件顶部，包含一个与该名称相符的 `package`\
    \ 语句。`package` 语句应该是源文件的第一行。每个源文件中只能有一个 `package` 语句，并且它适用于文件中的所有类型。如果没有使用 `package`\
    \ 语句，则类、接口、枚举和注解类型将存放在当前的默认包中。\n\n### 示例\n让我们来看创建一个名为 `animals` 的包的示例。使用小写字母作为包名是一种良好的做法，以避免与类和接口名称发生任何冲突。接下来的包示例包含一个名为\
    \ `animals` 的接口——\n\n```java\n/* 文件名：Animal.java */\npackage animals;\ninterface\
    \ Animal {\n    public void eat();\n    public void travel();\n}\n```\n\n现在，让我们同一个包\
    \ `animals` 中实现上述接口——\n\n```java\n/* 文件名：MammalInt.java */\npackage animals;\n\
    public class MammalInt implements Animal {\n    public void eat() {\n        System.out.println(\"\
    Mammal eats\");\n    }\n    public void travel() {\n        System.out.println(\"\
    Mammal travels\");\n    }\n    public int noOfLegs() {\n        return 0;\n  \
    \  }\n    public static void main(String args[]) {\n        MammalInt m = new\
    \ MammalInt();\n        m.eat();\n        m.travel();\n    }\n}\n```\n\n现在按照如下所示编译\
    \ java 文件——\n```bash\njavac -d . Animal.java\njavac -d . MammalInt.java\n```\n\
    \n你可以执行包内的类文件并获得如下所示的结果。\n```\nMammal eats\nMammal travels\n```\n\n## import 关键字\n\
    如果一个类想要使用同一个包中的另一个类，则不需要使用包名。同一个包中的类之间无需任何特殊语法即可相互找到。\n\n### 示例\n在这里，一个名为 `Boss`\
    \ 的类被添加到已经包含 `Employee` 的 `payroll` 包中。然后 `Boss` 就可以在不使用 `payroll` 前缀的情况下引用 `Employee`\
    \ 类，如下面的 `Boss` 类所示。\n\n```java\npackage payroll;\npublic class Boss {\n    public\
    \ void payEmployee(Employee e) {\n        e.mailCheck();\n    }\n}\n```\n\n如果\
    \ `Employee` 类不在 `payroll` 包中会发生什么？那么 `Boss` 类必须使用以下技术之一来引用不同包中的类。\n\n- 可以使用类的完全限定名。例如——`payroll.Employee`\n\
    - 可以使用 `import` 关键字和通配符（`*`）导入包。例如——`import payroll.*;`\n- 使用 `import` 关键字导入类本身。例如——`import\
    \ payroll.Employee;`\n\n**注意**——一个类文件可以包含任意数量的 import 语句。\n\n"
- fmt: "\n# CHAPTER 5 | VARIABLES, DATA TYPES & KEYWORDS\n\n## Variables\nVariables\
    \ are used to store information to be referenced and manipulated in a computer\
    \ program. They also provide a way of labeling data with a descriptive name, so\
    \ our programs can be understood more clearly by the reader and ourselves. It\
    \ is helpful to think of variables as containers that hold information. Their\
    \ sole purpose is to label and store data in memory. This data can then be used\
    \ throughout your program.\n\nA variable’s name is called an identifier. For the\
    \ most part an identifier is a unique word that a programmer, or in this case\
    \ you, picks to name a variable. An identifier is always something that a programmer\
    \ invented to describe a variable; it’s like naming a new pet or a baby.\n\n###\
    \ Identifiers\nIdentifiers, which are considered symbols or tokens, are words\
    \ that you invent which you then assign a meaning. Identifiers can be as simple\
    \ as the letter `i` or as complex as `@OhHAICanIHasIdentifier01`. `identifier`\
    \ is the word that’s used to name any function, variable, or type of data you\
    \ create. When the keyword `class` is used it’s followed by another word called\
    \ an identifier. After properly identifying a function, or other chunk of data,\
    \ you can now refer to that data by its identifier. In other words, when you name\
    \ some data `Charles` you access that data by the name `Charles`.\n\n```java\n\
    class MyNewClassImWriting{}\n```\n\nVariables are created using declarations.\
    \ Declaration is defined as a formal statement or announcement.\n\nEach set of\
    \ words a programmer writes is called a statement. In English we’d use the word\
    \ sentence, but programmers like to use their own vocabulary. Declaration statements\
    \ for variables define both the type and the identifier for a variable.\n\n```java\n\
    public class Example{\n    int i;\n}\n```\n\nProgrammers use a semicolon (`;`)\
    \ rather than a period to end the statement. Therefore, if you want to sound like\
    \ a programmer you can say you can “write a statement to declare a variable of\
    \ type `int` with the identifier `i`.” Or if you want to be overly dramatic you\
    \ can proclaim “I declare a new variable of type `int` to be known as `i`!” and\
    \ so it shall be.\n\n## Variable Names\nIt’s important to know that variable identifiers\
    \ and class identifiers can be pretty much anything. There are some rules to naming\
    \ anything when programming. Here are some guidelines to help.\n\n- Long names\
    \ are more prone to typos, so keep identifiers short. \n- A naming convention\
    \ for variables should consider the following points: The variable name should\
    \ indicate what it’s used for, or at least what you’re going to do with it. This\
    \ should be obvious, but a variable name shouldn’t be misleading. Or rather, if\
    \ you’re using a variable named `radius`, you shouldn’t be using it as a character’s\
    \ velocity.\n- It’s also helpful if you can pronounce the variable’s name; otherwise\
    \ you’re likely to have issues when trying to explain your code to another programmer.\n\
    \n```java\nint someLong_complex_hardToRememberVariableName;\n```\n\nThere is an\
    \ advantage to keeping names as short as possible but still quite clear. Your\
    \ computer screen, and most computers for that matter, can only fit so many characters\
    \ on a single line. You could make the font smaller, but then you run into readability\
    \ issues when letters get too small. Consider the following function, which requires\
    \ more than one variable to work.\n\n```java\nSomeCleverFunction(TopLeftCorner\
    \ – SomeThickness + OffsetFromSomePosition, BottomRightCorner – SomeThickness\
    \ + OffsetFromSomePosition);\n```\n\nThe code above uses many long variable names.\
    \ Because of the length of each variable, the statement takes up multiple lines\
    \ making a single statement harder to read. We could shorten the variable names,\
    \ but it’s easy to shorten them too much.\n\n```java\nCleverFunc(TL–Thk+Ofst,LR–Thk+Ofst);\n\
    ```\n\nVariable names should be descriptive, so you know what you’re going to\
    \ be using them for: too short and they might lose their meaning.\n\n```java\n\
    int a;\n```\n\nWhile short and easy to remember, it’s hard for anyone else coming\
    \ in to read your code and know what you’re using the variable `a` for. This becomes\
    \ especially difficult when working with other programmers.\n\nVariable naming\
    \ isn’t completely without rules.\n\n```java\nint 8;\n```\n\nA variable name can’t\
    \ be a number. This is bad; numbers have a special place in programming as much\
    \ of it has other uses for them. IDE will try to help you spot problems. A squiggly\
    \ red line will appear under any problems it spots. And speaking of variable names\
    \ with numbers, you can use a number as part of a variable name.\n\n```java\n\
    int varNumber2;\n```\n\nThe above name is perfectly valid, and can be useful,\
    \ but conversely consider the following.\n\n```java\nint 13thInt;\n```\n\nVariable\
    \ names can’t start with any numbers. To be perfectly honest, I’m not sure why\
    \ this case breaks the compiler, but it does seem to be related to why numbers\
    \ alone can’t be used as variable names.\n\n```java\nint $; int this-that; int\
    \ (^_^);\n```\n\nMost special characters also have meanings, and are reserved\
    \ for other uses. For instance, in `JAVA` a `-` is used for subtracting; in this\
    \ case `JAVA` may think you’re trying to subtract that from this. Keywords, you\
    \ should remember, are also invalid variable names as they already have a special\
    \ meaning for `JAVA`.\n\nIn IDE (integrated Development Environment), you might\
    \ notice the word `this` is highlighted, indicating that it’s a keyword. Spaces\
    \ in the middle of a variable are also invalid.\n\n```java\nint Spaces are bad;\n\
    ```\n\nMost likely, adding characters that aren’t letters will break the compiler.\
    \ Only the underscore and letters can be used for identifier names. As fun as\
    \ it might be to use emoticons for a variable, it would be quite difficult to\
    \ read when in use with the rest of the code.\n\n```java\nint ADifferenceInCase;\
    \ int adifferenceincase;\n```\n\nThe two variables here are actually different.\
    \ Case-sensitive languages like `java` do pay attention to the case of a character;\
    \ this goes for everything else when calling things by name. Considering this:\
    \ `A` is different from `a`.\n\nAs a programmer, you need to consider what a variable\
    \ should be.\n\n## Types of Variables\nYou must declare all variables before they\
    \ can be used. Following is the basic form of a variable declaration:\n\n`data\
    \ type variable [ = value][, variable [ = value] ...`\n\nHere `data type` is one\
    \ of Java's datatypes and `variable` is the name of the variable. To declare more\
    \ than one variable of the specified type, you can use a comma-separated list.\n\
    \nExample:\n```java\nint a, b, c; // Declares three int a, b, and c.\na = 10,\
    \ b = 10; // Example of initialization\nbyteB = 22; // initializes a byte type\
    \ variable B\ndouble pi = 3.14159; // declares and assigns a double value of PI\n\
    ```\n\nJava Programming language defines mainly three kinds of variables.\n"
