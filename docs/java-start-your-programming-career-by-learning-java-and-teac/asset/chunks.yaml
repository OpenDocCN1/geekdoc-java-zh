  trans: "\n\n# 分隔符标记 (Separator Tokens)\n\n最常见的分隔符是分号 `;`。这种标点符号用于结束一个代码语句。其他的分隔符成对出现。\n\
    \n大括号成对使用，用于分隔代码语句组。左大括号为 `{`，尖端指向组的外部；它与闭合大括号对的 `}` 配对。圆括号以 `(` 开始，以 `)` 结束，而方括号以\
    \ `[` 开始，以 `]` 结束。不同的起始和结束括号、中括号和圆括号有特定的用途，用于帮助识别它们的用途。此外还有角括号 `<` 和 `>`；它们用于包围数据类型。别忘了还有单引号\
    \ `''` 和双引号 `\"\"`，它们也成对使用，用于包围被称为“字符串”（strings）的符号。\n\n**注意：** 在许多文字处理器中，通常会使用起始引号和结束引号（`“`\
    \ 和 `”`）。由于词法分析器不识别这些“智能引号”，因此编程编辑器使用直引号（`\"`）。一旦你意识到编程中使用的字母、数字和所有其他字符都被解析为美国标准信息交换代码（`ASCII`）或\
    \ Unicode 转换格式（`UTF-8`）、`16` 或 `32`，这些细微的变化就不再微妙了。\n\n`ASCII` 和 `UTF` 都是计算机读取文本时使用的字符数据库名称。计算机不使用眼睛阅读。相反，它们使用数字数据库来查找使用的每个字符。因此，如果我们使用\
    \ `UTF-16`，那么对于计算机来说，`“` 看起来更像 `0x201C`，而 `\"` 像 `0x0022`。\n\n大括号在代码中分隔语句。圆括号通常用于接收数据。方括号通常用于帮助识别数组。我们稍后会介绍数组，但在解释之前，你可以把它们想象成电子表格或坐标纸。\n\
    \n```java\nint[] arrayNumbers = {1, (int) 3.0, 9000};\n```\n\n上述语句将三个数字赋值给数组。大括号包含一对由逗号分隔的语句。大括号中的第二个语句是将带有点（`.`）的数字转换为不带点的数字。这可能需要一些解释，但习惯看到这种写法是有好处的。我们很快就会什么是数组，以及点运算符。\n\
    \n在学习编程时，你通常会看到许多奇怪的标记，它们似乎没有任何意义。这取决于你是否观察你遇到的每一个标记并尝试理解它的作用。如果没有任何语句是合逻辑的，也没关系。\n\
    \n# 运算符标记 (Operator Tokens)\n\n运算符类似于关键字，但只使用少数几个非单词字符。冒号或分号是一个运算符；与关键字不同，运算符会根据它们出现的位置或使用方式来改变其功能。这种行为的转变被称为运算符重载（operator\
    \ overloading），这是一个复杂的课题，我们稍后会讨论。同样重要的一点是，在需要时你可以创建自己的运算符。\n\nJava 中的逗号有不同的含义。它们用于分隔不同的数据值，例如：\n\
    ```java\nfor (int i = 0, j = 1; ; i++, j++)\n```\n\n# 其他运算符标记 (Other Operator\
    \ Tokens)\n\n泛而言，运算符是处理变量之间特定操作的特殊字符。运算符和变量出现的符号或顺序通常通过以下表示法或数学语法进行教学：`a + b =\
    \ c`。然而，在编程中，更倾向于以下写法：`c = a + b;`；之所以进行这种更改是因为 Java 中的 `=` 运算符的工作方式与数学课上通常教授的功能不同。`=`\
    \ 运算符的左侧是赋值侧，右侧是操作侧。这重点放在了赋值的值上，而不是如何赋值。由于计算机在进行数学计算，结果比解决问题的方法更重要。在编程中，上面的示例应该读作“将\
    \ a 加 b 的结果赋值给 c”。\n\n# 字面量 (Literals)\n\n字面量有许多不同的形式；类似于表现为 `+`、`-` 或 `=` 这种形式的运算符，字面量是经常出现在它们之间的标记。数字被认为是字面量，或者说是以字面量方式使用的标记。数字可以称为数值字面量（numeric\
    \ literals）。当某些内容被放在引号中时，如“`I’m a literal`”，你正在写的是一个字符串字面量（string literal）。字面量存在于几乎所有的编程语言中，并形成了\
    \ Java 数据类型的基础。\n\n# 传递性和非传递性操作 (Transitive and Non-Transitive Operations)\n\n\
    在数学课上，有时会教某些操作具有传递性，而另一些不是。例如，`2 + 3 + 4` 和 `4 + 3 + 2` 得到相同的值。每个数字出现在运算符之间并不重要，因此\
    \ `+` 运算符被认为是具有传递性的。这个概念在 Java 中同样适用。当我们开始混合运算符时，结果会发生变化。\n\n```java\nint a =\
    \ 1 + 2 - 4 + 7; //a = 6\nint b = 7 + 4 - 2 + 1; //b = 10\n```\n\n这段代码片段显示了使用相同运算符但数字位置不同时得到的两个不同结果。我们稍后在游戏中使用它们时将看到如何克服这些问题。运算符的顺序是需要注意的，在我们构建计算时，测试每一步都是重要的，以确保我们的结果是我们预期的值。为了确保操作按照你预期的逻辑发生，你可以使用圆括号包含操作数，或者进行每次计算。\n\
    \n# 第 4 章 | Java 编程基础 (CHAPTER 4 | BASIC OF JAVA PROGRAM)\n\n## Java 程序结构 (Structure\
    \ of Java Program)\n\nJava 程序由不同的部分组成。某些是强制性的，但另一些是可选的。根据程序员的要求，可以从程序排除可选部分。\n\
    \n### 文档部分 (Documentation Section)\n它包括注释，用于说明程序的目的。它提高了程序的可读性。\n\n### 包声明语句 (Package\
    \ Statement)\n它包括提供包声明的语句。\n\n### 导入语句 (Import statements)\n它包括用于引用在其他包中声明的类和接口的语句。\n\
    \n### 接口部分 (Interface Section)\n它类似于类，但只包含常量方法声明。\n\n### 类部分 (Class Section)\n\
    类部分描述了程序中用户定义类的信息。类是字段（数据变量）和对字段进行操作的方法的集合。Java 中的每个程序至少包含一个类定义。该类定义声明了 `main`\
    \ 方法。程序的执行实际上是从这里开始的。\n\n## 文档部分 (DOCUMENTATION Section)\n\n它包括提高程序可读性的注释。注释是非可执行的语句，有助于阅读和理解程序，特别是当程序变得复杂时。它仅仅是仅对程序员存在的消息，会被编译器忽略。一个好的程序应该包含描述目的的注释。Java\
    \ 支持以下类型的注释：\n\n- **单行注释**：它以 `//` 开始并在行结束。编译器会忽略其内容。例如：\n```java\n// 这是一个注释\n\
    ```\n\n- **多行注释**：它以 `/*` 开始并以 `*/` 结束。编译器会忽略其内容。例如：\n```java\n/* 这是一个\n多行注释 */\n\
    ```\n\n- **文档注释**：这种注释以 `/**` 开始并以 `*/` 结束。`javadoc` 工具读取这些注释并准备 HTML 格式的程序文档。例如：\n\
    ```java\n/**\n这是一个文档注释\n */\n```\n\n"
- fmt: "\n| ![A command line executing the java command, which in turn executes a\
    \ Java main program.](OEBPS/image835.jpg) |\n| A command line executing the java\
    \ command, which in turn executes a Java main program. |\n\nHere is an example\
    \ command line:\n```bash\njava -cp classes myjavacode.MyClass\n```\n\nThe first\
    \ part of this command is the `java` command. This command starts up the `JVM`.\
    \ In some cases you may have to specify the full path to where the `java` command\
    \ is located on your computer (typically inside the `bin` subdirectory of the\
    \ Java install dir).\n\nThe second and third arguments `-cp classes` tells the\
    \ `JVM` in what directory the compiled Java classes are located (`cp` means class\
    \ path). In this case the compiled Java classes are located in a directory named\
    \ `classes`.\n\nThe fourth argument is the name of the Java class the `JVM` is\
    \ to execute. Notice how the class name also contains the name of the package\
    \ the class is located in (the \"fully qualified class name\").\n\n### Passing\
    \ Arguments to the `main()` Method\n\nYou can pass arguments from the command\
    \ line to the `main()` method. This command line shows how:\n```bash\njava -cp\
    \ classes myjavacode.MyClass Hello World\n```\n\nWhen the `JVM` executes the `main()`\
    \ method of the `myjavacode.MyClass`, the `String` array passed as parameter to\
    \ the `main()` method will contain two Strings: \"Hello\" and \"World\".\n\nThe\
    \ `main()` method can access the arguments from the command line like this:\n\
    ```java\npackage myjavacode;\npublic class MyClass {\n    public static void main(String[]\
    \ args) {\n        System.out.println( args[0] );\n        System.out.println(\
    \ args[1] );\n    }\n}\n```\n\nNotice the references to element 0 and element\
    \ 1 in the `args` array (`args[0]` and `args[1]`). `args[0]` will contain the\
    \ `String` (text) Hello and `args[1]` will contain the `String` World. Variables\
    \ and arrays will be explained in more detail in later texts. Don't worry if you\
    \ don't fully understand them at this point.\n\n### The Java Main Class\n\nIf\
    \ only a single Java class in your Java program contains a `main()` method, then\
    \ the class containing the `main()` method is often referred to as the `main class`.\n\
    \nYou can have as many classes as you want in your project with a `main()` method\
    \ in. But, the Java Virtual Machine can only be instructed to run one of them\
    \ at a time. You can still call the other `main()` methods from inside the `main()`\
    \ method the Java Virtual Machine executes (you haven't seen how yet) and you\
    \ can also start up multiple virtual machines which each execute a single `main()`\
    \ method.\n\n### Access Control\n\nAll good writers including those who write\
    \ software know that a piece of work isn’t good until it’s been rewritten, often\
    \ many times. If you leave a piece of code in a drawer for a while and come back\
    \ to it, you may see a much better way to do it. This is one of the prime motivations\
    \ for refactoring, which rewrites working code in order to make it more readable,\
    \ understandable, and maintainable.\n\nThere is a tension, however, in this desire\
    \ to change and improve your code. There are often consumers (client programmers)\
    \ who rely on some aspect of your code. So you want to change it; they want it\
    \ to stay the same. Thus a primary consideration in object oriented design is\
    \ to “separate the things that change from the things that stay same.” This is\
    \ particularly important for libraries. Consumers of that library must rely on\
    \ the part they use, and know that they won’t need to rewrite code if a new version\
    \ of library comes out. On the flip side, the library creator must have the freedom\
    \ to make modifications and improvements with the certainty that client code isn’t\
    \ affected.\n\nThis can be achieved through convention. For example, the library\
    \ programmer must agree not to remove existing methods when modifying a class\
    \ since that would break the client programmer’s code. The reverse situation is\
    \ thornier, however. In the case of a field, how can the library creator know\
    \ which fields have been accessed by client programmers? This is also true with\
    \ methods that are only part of the implementation of a class and not meant to\
    \ be used directly by the client programmer. What if the library creator wants\
    \ to rip out an old implementation and put in a new one? Changing any of those\
    \ members might break a client programmer’s code. Thus the library creator is\
    \ in a strait jacket and can’t change anything.\n\nTo solve this problem, Java\
    \ provides access specifiers to allow the library creator to say what is available\
    \ to the client programmer and what is not. The levels of access control from\
    \ “most access” to “least access” are `public`, `protected`, package access (which\
    \ has no keyword), and `private`. From the previous paragraph you might think\
    \ that, as a library designer, you’ll want to keep everything as `private` as\
    \ possible, and expose only the methods that you want the client programmer to\
    \ use. This is exactly right, even though it’s often counterintuitive for people\
    \ who program in other languages (especially C) and are used to accessing everything\
    \ without restriction.\n\n### Package in java\n\nPackages are used in Java in\
    \ order to prevent naming conflicts, to control access, to make searching/locating\
    \ and usage of classes, interfaces, enumerations and annotations easier, etc.\
    \ A `Package` can be defined as a grouping of related types (classes, interfaces,\
    \ enumerations and annotations) providing access protection and namespace management.\n\
    \nSome of the existing packages in Java are:\n\n- `java.lang`: bundles the fundamental\
    \ classes\n- `java.io`: classes for input, output functions are bundled in this\
    \ package\n"
