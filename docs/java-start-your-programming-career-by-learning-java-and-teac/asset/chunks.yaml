  trans: "\n\n# 实例变量\n\n# 静态变量\n# 局部变量\n\n## 变量类型\n\n## 1) 实例变量\n实例变量是在类内部但在任何方法、构造函数或块之外声明的变量。实例变量也是对象的变量，通常被称为字段（field）或属性（property）。它们被称为对象变量。每个对象都拥有每个变量的副本，因此，如果一个对象更改了变量的值，不会影响实例变量。实例变量持有必须被多个方法、构造函数或块引用的值，或者是整个类中必须存在的对象状态的重要部分。\n\
    \n```java\nclass Student{\n    String name;\n    int age;\n}\n```\n这里 `name` 和\
    \ `age` 是 `Student` 类的实例变量。\n\n## 2) 静态变量\n静态是通过使用 `static` 关键字声明的类变量。静态变量只初始化一次。静态变量还与\
    \ `final` 关键字用于声明常量。\n\n```java\nclass Student{\n  String name;\n  int age;\n\
    \  static int instituteCode=1101;\n}\n```\n这里 `instituteCode` 是一个静态变量。`Student`\
    \ 类的每个对象将共享 `instituteCode` 属性。\n\n**关于静态变量的额外点：**\n- `static` 变量也称为类变量。\n- `static`\
    \ 保持不变。\n- 在 Java 中，这意味着它对于该类创建的所有实例来说都是常量。\n- `static` 变量不需要通过对象调用。\n- 它通过 `classname.static\
    \ variable name` 调用。\n\n**注意：** `static` 变量永远不能定义在方法内部，即它永远不可能是局部变量。\n\n**示例：**\
    \ 假设你创建了 2 个 `Student` 类的对象并从一个对象更改了静态变量的值。现在当你从另一个对象打印它时，它将显示更改后的值。这是因为它是声明为静态的，即它对于创建的每个对象都是常量。\n\
    \n```java\nclass Student{\n    int a;\n    static int id = 35;\n    void change(){\n\
    \        System.out.println(id);\n    }\n}\npublic class StudyTonight {\n    public\
    \ static void main(String[] args) {\n        Student o1 = new Student();\n   \
    \     Student o2 = new Student();\n        o1.change();\n        Student.id =\
    \ 1;\n        o2.change();\n    }\n}\n```\n**输出：**\n```\n35\n1\n```\n\n## 3) 局部变量\n\
    局部变量声明在方法、构造函数或块中。局部变量在方法、构造函数或块开始时初始化，并在结束后销毁。局部变量存在于栈中。局部变量不使用访问修饰符。\n\n```java\n\
    float getDiscount(int price){\n  float discount;\n  discount=price*(20/100);\n\
    \  return discount;\n}\n```\n这里 `discount` 是一个局部变量。\n\n**关于局部变量的额外点：**\n- 局部变量声明在方法、构造函数或块中。\n\
    - 局部变量在进入方法、构造函数、块时创建，一旦退出方法、构造函数或块，变量将被销毁。\n- 局部变量不能使用访问修饰符。\n- 局部变量仅在声明它们的方法、构造函数或块内可见。\n\
    - 局部变量在内部于栈级别实现。\n- 局部变量没有默认值，因此在第一次使用之前应该声明局部变量并分配初始值。\n\n**示例：**\n```java\n\
    public class Test {\n  public void pupAge() {\n    int age = 0;\n    age = age\
    \ + 7;\n    System.out.println(\"Puppy age is : \" + age);\n  }\n  public static\
    \ void main(String args[]) {\n    Test test = new Test();\n    test.pupAge();\n\
    \  }\n}\n```\n这里，`age` 是一个局部变量。它定义在 `pupAge()` 方法内部，其作用范围仅限于此方法。这将产生以下结果：\n\n\
    **输出：**\n```\nPuppy age is: 7\n```\n\n# Java 中的数据类型\n数据类型表示存储在变量中的不同值。在 Java 中，数据类型分为两种：\n\
    \n- 原始数据类型\n- 非原始数据类型\n\n![数据类型 in java](img/image1625.jpg)\n\n| 数据类型 | 默认值 |\
    \ 默认大小 |\n| :--- | :--- | :--- |\n| boolean | false | 1 bit |\n| char | '\\u0000'\
    \ | 2 byte |\n| byte | 0 | 1 byte |\n| short | 0 | 2 byte |\n| int | 0 | 4 byte\
    \ |\n| long | 0L | 8 byte |\n| float | 0.0f | 4 byte |\n| double | 0.0d | 8 byte\
    \ |\n\n"
- fmt: "\n# Why `char` uses 2 byte in java and what is `\\u0000`?\n\nIt is because\
    \ java uses Unicode system than ASCII code system. The `\\u0000` is the lowest\
    \ range of Unicode system. To get detail explanation about Unicode visit next\
    \ page.\n\n## Types\n\nWhen we assign a variable a value such as `int i = 1;`\
    \ we’re making an interesting assumption. We assume using `1` automatically infers\
    \ a value type that matches the variable type. Computers use a wide variety of\
    \ different types of data for storing numbers. So far we’ve been seeing the word\
    \ `int` being thrown around as though you know what an `int` is. In our everyday\
    \ lives we hardly think there’s any difference between numbers `1` and `1.0` or\
    \ even the word one. \n\nAs humans we can easily conceptualize numbers as units\
    \ of measure and converting between them. The conversion between the word one\
    \ and the number `1` isn’t so easy for a computer. The keyword `int` is short\
    \ for integer. Integers are whole number values. The integer is a Java built-in\
    \ type. Basically, this means that integers are a fundamental part of java. Other\
    \ built-in types include `float`, `double`, `string`, `bool`, and `object`. Less\
    \ commonly used built-in types are `char`, `short`, and `byte`. Altogether, there\
    \ are 15 different built-in types.\n\nAll of these, except `object` and `string`,\
    \ are value types. Every type of data you’re able to build must be based on all\
    \ of these built-in types. The system which creates all of these `floats`, `doubles`,\
    \ and `bools` is rooted in the origin of computing. Remember the punch tapes and\
    \ pieces of paper with holes in them? Those were records of `1s` and `0s` which\
    \ were fed into computers for storing in the form of mechanical switches, either\
    \ on or off. The patterns represented numbers or instructions and logic.\n\nToday,\
    \ we still use the same system of `1s` and `0s`, or binary, only we don’t need\
    \ to punch holes in paper to tell the computer what to do. The methods of creating\
    \ and storing the instructions have become many times more complex, but nonetheless\
    \ the principle of the `1` and `0` are the same. These are called bits; one possible\
    \ origin for that name is the little bits of paper that were left over from punching\
    \ all of the holes in the paper cards.\n\n## Value and Reference Types\n\nThe\
    \ `int`, `float`, `double`, and `bool` are commonly used value types. The basics\
    \ of this usage pattern relate to the system that stores and organizes the computer’s\
    \ memory. When you talk about computer storage you use the word `megabyte` or\
    \ `gigabyte`. Value types are stored with a very specific purpose in mind: to\
    \ keep track of a numeric value.\n\n**NOTE:** The word `mega` refers to how many\
    \ millions of bytes a component in your computer can store. `Giga` indicates how\
    \ every billions of bytes are being stored. Have you ever thought about what a\
    \ byte actually is? A byte is what is called an `8-bit unsigned integer`, or a\
    \ system of using `8 bits` to form a number. What this means is that it’s a whole\
    \ number like `0`, `7`, or `32,767`. The word `unsigned` indicates that the number\
    \ cannot be negative, like `-512`. A `1` or `0` in computer terms is called a\
    \ `bit`. We won’t go into detail on how computers use bits to count, and it’s\
    \ a rather fun thing to learn on your own.\n\nHowever, it’s important to know\
    \ that a byte has a limited range, from `0` to `255`. I’ll just leave you with\
    \ the idea that you could count up to `1023` on your `10` fingers if you used\
    \ binary rather than decimal. Your fingers can be used to represent a `10-bit\
    \ unsigned integer`. The computer’s calculation capabilities used to be far more\
    \ limited than they are today. An `8-bit` game console made in the 1980s had a\
    \ limited number of colors, `256` to be exact. This limitation was based on the\
    \ number of bits that the processor could handle. The processor had a limited\
    \ number of transistors which could be used at any one time. Shortly after, floating\
    \ point coprocessors were introduced, which had a much larger numeric range allowed,\
    \ by having closer to `32 bits` to work with. In all of these cases, when you\
    \ use a value type, that number is actually stored as `1s` and `0s` in your computer’s\
    \ RAM. This should be considered fairly remarkable.\n\nIn the past you’d have\
    \ to go through flaming hoops to store a value. Now you just type in `float f\
    \ = 3.1415926535;` and you can measure the circumference of the universe accurately\
    \ to within the width of a single atom. What all of these types have in common\
    \ is that they are stored as a single element. Large values like `double gigawatts\
    \ = 1210000000.0;` and `double mint = 2.0;` use the same amount of memory. Your\
    \ computer doesn’t assign one `double` or the other more space in memory. These\
    \ types are referred to as primitive types. The only difference between an `int`\
    \ and a `float` is the number of bits they use at a time, `8` and `32` respectively;\
    \ `doubles` use `64 bits`.\n\nThe `string` and `object` types differ a bit in\
    \ how they are stored. These types are a composite of any number smaller elements.\
    \ The bigger a `string` or `object` the bigger chunk of memory the computer opens\
    \ up to place that object or string. These are called reference types or sometimes\
    \ called nullable types because Java doesn’t look to a single element in memory\
    \ to get data from it.\n\n## Strong Typing\n\nThis has nothing to do with how\
    \ hard you type on the keyboard! Java sees a difference between numbers in how\
    \ they are written. A whole number like `1` is different from `1.0`, even though\
    \ we can think of them as having the same value. Some of these differences can\
    \ be added by adding a letter. Therefore `1.0` and `1f` are actually different\
    \ numbers. Java is a strongly typed language. When a programming language uses\
    \ strong types you’re expected to keep the different types separated. This means\
    \ that the two numbers are actually different types of numbers we have to convert\
    \ one of them to match the other. To convert from one type to another we have\
    \ to tell Java that we intend to make that conversion from one to `1f` by using\
    \ what’s called cast operator. Aside from changing how memory is used, types also\
    \ limit any problems might come about.\n\n## Understanding Floating Points\n\n\
    Floating point numbers have been a focus of computers for many years. Gaining\
    \ floating point accuracy was the goal of many computer scientists. Because there\
    \ are an infinite possibilities of how many numbers can follow a decimal point,\
    \ it’s impossible to truly represent any fraction using binary. A common example\
    \ is `π`, which we call `pi`. Even today computers are set loose to calculate\
    \ the hundreds of digits beyond the decimal point. Computers set aside some of\
    \ the bits of floating point number to represent where the decimal appears, the\
    \ first bit is usually the sign bit, setting the negative or positive range of\
    \ the number. The following `8 bits` is the exponent for the remaining bits are\
    \ called mantissa. A `float` value can move the decimal in either direction, but\
    \ it’s limited to the values it’s able to store. Without special considerations,\
    \ computers are not able to handle arbitrarily large numbers. To cast a `float`\
    \ into `int` you need to be more explicit. That’s why Java requires you to use\
    \ the cast and you need to add the `(int)` before the variable.\n\n## Keywords\n\
    \nKeywords are special words, or symbols, that tell the compiler to do specific\
    \ things. For instance, the keyword `class` at the beginning of a line tells the\
    \ compiler you are creating a class. A class declaration is the line of code that\
    \ tells the compiler you’re about to create a new class. The order in which words\
    \ appear is important. English requires sentences and grammar to properly convey\
    \ our thoughts to the reader. In code:\n\n```java\nclass className {\n// code\
    \ here\n}\n```\nEvery class needs a name; in the above example we named our class\
    \ `className`, although we could easily named the class `Charles`. When a new\
    \ class is named the name becomes a new identifier. This also holds true for every\
    \ variable’s name, though scope limits how long and where the variable exists.\
    \ We learned about variables and scope. You can’t use keywords for anything other\
    \ than what Java expects them to be used. There are exceptions, but in general,\
    \ keywords provide you with specific commands. In the Java programming language,\
    \ a keyword is one of reserved words that have a predefined meaning in the language;\
    \ because of this, programmers cannot use keywords as names for variables, methods,\
    \ classes, or as any other identifier. Due to their special functions in the language,\
    \ most integrated development environments for Java use syntax highlighting to\
    \ display keywords in a different color for easy identification.\n\n### List of\
    \ Keywords\n\n- **abstract**: Used to implement the abstraction in java. A method\
    \ which doesn’t have method definition must be declared as `abstract` and the\
    \ class containing it must be declared as `abstract`. You can’t instantiate abstract\
    \ classes. Abstract methods must be implemented in the subclasses. You can’t use\
    \ `abstract` keyword with variables and constructors\n- **assert** (added in J2SE\
    \ 1.4): Describes a predicate (a true–false statement) placed in a java-program\
    \ to indicate that the developer thinks that the predicate is always true at that\
    \ place. If an assertion evaluates to false at run-time, an assertion failure\
    \ results, which typically causes execution to abort. Optionally enable by `ClassLoader`\
    \ method.\n- **boolean**: Defines a boolean variable for the values \"true\" or\
    \ \"false\" only.\n- **break**: Used to end the execution in the current loop\
    \ body.\n- **byte**: The `byte` keyword is used to declare a field that can hold\
    \ an 8-bit signed two's complement integer. This keyword is also used to declare\
    \ that a method returns a value of the primitive type `byte`.\n- **case**: A statement\
    \ in the `switch` block can be labeled with one or more `case` or default labels.\
    \ The `switch` statement evaluates its expression, then executes all statements\
    \ that follow the matching `case` label.\n- **catch**: Used in conjunction with\
    \ a `try` block and an optional `finally` block. The statements in the `catch`\
    \ block specify what to do if a specific type of exception is thrown by the `try`\
    \ block.\n- **char**: Defines a character variable capable of holding any character\
    \ of the java source file's character set.\n- **class**: A type that defines the\
    \ implementation of a particular kind of object. A class definition defines instance\
    \ and class fields, methods, and inner classes as well as specifying the `interfaces`\
    \ the class implements and the immediate `superclass` of the class. If the superclass\
    \ is not explicitly specified, the superclass is implicitly [Object](https://docs.oracle.com/javase/8/docs/api/java/lang/Object.html).\
    \ The `class` keyword can also be used in the form `Class.class` to get a `Class`\
    \ object without needing an instance of that class. For example, `String.class`\
    \ can be used instead of `new String()`.\n- **continue**: Used to resume program\
    \ execution at the end of the current body. If followed by a label, `continue`\
    \ resumes execution at the end of the enclosing loop.\n- **default**: The `default`\
    \ keyword can optionally be used in a `switch` statement to label a block of statements\
    \ to be executed if no `case` matches; see `switch`. Alternatively, the `default`\
    \ keyword can also be used to declare default values in Java annotation. From\
    \ Java 8 onwards, the `default` keyword is also used to specify that a method\
    \ in an interface provides the default implementation.\n- **do**: The `do` keyword\
    \ is used in conjunction with `while` to create a `do-while` loop, which executes\
    \ a block of statements associated with the loop and then tests a boolean expression.\
    \ If the expression evaluates to `true`, the block is executed again; this continues\
    \ until the expression evaluates to `false`.\n- **double**: The `double` keyword\
    \ is used to declare a variable that can hold 64-bit precision floating point\
    \ number. This keyword is also used to declare that a method returns a value of\
    \ the primitive type `double`.\n- **else**: The `else` keyword is used in conjunction\
    \ with `if` to create an `if-else` statement, which tests a boolean expression;\
    \ if the expression evaluates to `true`, the block of statements associated with\
    \ the `if` are evaluated; if it evaluates to `false`, the block of statements\
    \ associated with the `else` are evaluated.\n- **enum** (added in J2SE 5.0): A\
    \ Java keyword used to declare an enumerated type. Enumerations extend the base\
    \ class `Enum`.\n- **extends**: Used in a class declaration to specify the superclass;\
    \ used in an interface declaration to specify one or more interfaces. Class `X`\
    \ extends class `Y` to add functionality, either by adding fields or methods,\
    \ or by overriding methods of `Y`. Class `X` is said to be a subclass of class\
    \ `Y`; Interface `Z` is said to be subinterface of the interfaces it extends.\
    \ Also used to specify an upper bound on a type parameter in Generics.\n- **final**:\
    \ Define an entity once that cannot be changed nor derived from. More specifically:\
    \ a `final` class cannot be subclassed, a `final` method cannot be overridden,\
    \ and a `final` variable can occur at most as a left-hand expression on an executed\
    \ command. All methods in a `final` class are implicitly `final`.\n- **finally**:\
    \ Used to define a block of statements for a block defined previously by the `try`\
    \ keyword. The `finally` block is executed after execution exits the `try` block\
    \ and any `catch` clauses, regardless of whether an exception was thrown or caught,\
    \ or execution left in the middle of the `try` or `catch` blocks using `return`\
    \ keyword.\n- **float**: The `float` keyword is used to declare a variable that\
    \ can hold 32-bit single precision IEEE 754 floating-point number. This keyword\
    \ is also used to declare that a method returns a value of the primitive type\
    \ `float`.\n- **for**: The `for` keyword is used to create a `for loop`, which\
    \ specifies a variable initialization, a boolean expression, and an incrementation.\
    \ The variable initialization is performed first, and then the boolean expression\
    \ is evaluated. If the expression evaluates to `true`, the block of statements\
    \ associated with the loop are executed, and then the incrementation is performed.\
    \ The boolean expression is then evaluated again; this continues until the expression\
    \ evaluates to `false`. As of J2SE 5.0, the `for` keyword can also be used to\
    \ create a so-called \"enhanced for loop\", which specifies an `array` or `Iterable`\
    \ object; each iteration of the loop executes the associated block of statements\
    \ using a different element in the `array` or `Iterable`.\n- **if**: The `if`\
    \ keyword is used to create an `if` statement, which tests a boolean expression;\
    \ if the expression evaluates to `true`, the block of statements associated with\
    \ the `if` statement is executed. This keyword can also be used to create an `if-else`\
    \ statement; see `else`.\n- **implements**: Included in a class declaration to\
    \ specify one or more `interfaces` that are implemented by the current class.\
    \ A class inherits the types and abstract methods declared by the interfaces.\n\
    - **import**: Used at the beginning of a source file to specify classes or entire\
    \ `Java-packages` to be referred to later without including their package names\
    \ in the reference. Since J2SE 5.0, `import` statements can import `static` members\
    \ of a class.\n- **instanceof**: A binary operator that takes an object reference\
    \ as its first operand and a class or interface as its second operand and produces\
    \ a boolean result. The `instanceof` operator evaluates to true if and only if\
    \ the runtime type of the object is assignment compatible with the class or interface.\n\
    - **int**: The `int` keyword is used to declare a variable that can hold a 32-bit\
    \ signed two's complement integer. This keyword is also used to declare that a\
    \ method returns a value of the primitive type `int`.\n- **interface**: Used to\
    \ declare a special type of class that only contains abstract or default methods,\
    \ constant (static final) fields and `static` interfaces. It can later be implemented\
    \ by classes that declare the interface with the `implements` keyword.\n- **long**:\
    \ The `long` keyword is used to declare a variable that can hold a 64-bit signed\
    \ two's complement integer. This keyword is also used to declare that a method\
    \ returns a value of the primitive type `long`.\n- **native**: Used in method\
    \ declarations to specify that the method is not implemented in the same source\
    \ file, but rather in another language.\n- **new**: Used to create an instance\
    \ of a class or array. Using `new` for this end is not necessary (as exemplified\
    \ by [Scala](https://en.wikipedia.org/wiki/Scala_(programming_language))), though\
    \ it serves two purposes: it enables the existence of different namespace for\
    \ methods and class names.\n- **package**: A group of types. Packages are declared\
    \ with the `package` keyword.\n- **private**: The `private` keyword is used in\
    \ the declaration of a method, field, or inner class; `private` members can only\
    \ be accessed by members of their own class.\n- **protected**: The `protected`\
    \ keyword is used in the declaration of a method, field, or inner class; `protected`\
    \ members can only be accessed by members of their own class, subclasses or classes\
    \ from the same.\n- **public**: The `public` keyword is used in the declaration\
    \ of a class, method, or field; `public` classes, methods, and fields can be accessed\
    \ by any class.\n- **return**: Used to finish the execution of a method. It can\
    \ be followed by a value required by the caller.\n- **short**: The `short` keyword\
    \ is used to declare a field that can hold 16-bit signed two's complement integer.\
    \ This keyword is also used to declare that a method returns a value of the primitive\
    \ type `short`.\n- **static**: Used to declare a field, method, or inner class\
    \ as a class field. Classes maintain one copy of fields regardless of how many\
    \ instances exist of that class. `static` is also used to define a method as a\
    \ class.\n- **strictfp** (added in J2SE 1.2): A Java keyword used to restrict\
    \ the precision and rounding of floating point calculations to ensure portability.\n\
    - **super**: Used to access members of a class inherited by the class in which\
    \ it appears. Allows a subclass to access overridden methods and hidden members\
    \ of its superclass. The `super` keyword is also used to forward a call from a\
    \ constructor to the superclass.\n- **switch**: The `switch` keyword is used in\
    \ conjunction with `case` and `default` to create a `switch statement`, which\
    \ evaluates a variable, matches its value to a specific `case`, and executes the\
    \ block of statements associated with that `case`. If no `case` matches the value,\
    \ the optional block labelled by `default` is executed, if included.\n- **synchronized**:\
    \ Used in the declaration of a method or code block to acquire the mutex lock\
    \ for an object while the current `thread` executes the code. For static methods,\
    \ the object locked is the class's. Guarantees that at most one thread at a time\
    \ operating on the same object executes that code. The mutex lock is automatically\
    \ released when execution exits the `synchronized` code. Fields, classes and interfaces\
    \ cannot be declared as `synchronized`.\n- **this**: Used to represent an instance\
    \ of the class in which it appears. `this` can be used to access class members\
    \ and as a reference to the current instance. The `this` keyword is also used\
    \ to forward a call from one constructor in a class to another constructor in\
    \ the same class.\n- **throw**: Causes the declared exception instance to be thrown.\
    \ This causes execution to continue with the first exception handler declared\
    \ by the `catch` keyword to handle assignment compatible exception type. If no\
    \ such exception handler is found in the current method, then the method returns\
    \ and the process is repeated in the calling method. If no exception handler is\
    \ found in any method call on the stack, then the exception is passed to the thread's\
    \ uncaught exception handler.\n- **throws**: Used in method declarations to specify\
    \ which exceptions are not handled within the method but rather passed to the\
    \ next higher level of the program. All uncaught exceptions in a method that are\
    \ not instances of `RuntimeException` must be declared using the `throws` keyword.\n\
    - **transient**: Declares that an instance field is not part of the default `serialized`\
    \ form of an object. When an object is serialized, only the values of its non-transient\
    \ instance fields are included in the default serial representation. When an object\
    \ is deserialized, `transient` fields are initialized only to their default value.\
    \ If the default form is not used, e.g. when `serialPersistentFields` is declared\
    \ in the class hierarchy, all `transient` keywords are ignored.\n- **try**: Defines\
    \ a block of statements that have exception handling. If an exception is thrown\
    \ inside the `try` block, an optional `catch` block can handle declared exception\
    \ types. Also, an optional `finally` block can be declared that will be executed\
    \ when execution exits the `try` block and `catch` clauses, regardless of whether\
    \ an exception is thrown or not. A `try` block must have at least one `catch`\
    \ clause or a `finally` block.\n- **void**: The `void` keyword is used to declare\
    \ that a method does not return any value.\n- **volatile**: Used in field declarations\
    \ to specify that the variable is modified asynchronously by concurrently running\
    \ threads. Methods, classes and interfaces thus cannot be declared `volatile`,\
    \ nor can local variables or parameters.\n- **while**: The `while` keyword is\
    \ used to create a `while loop`, which tests a boolean expression and executes\
    \ the block of statements associated with the loop. If the expression evaluates\
    \ to `true`, the block is executed again; this continues until the expression\
    \ evaluates to `false`.\n"
