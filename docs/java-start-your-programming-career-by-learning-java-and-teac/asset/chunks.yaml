  trans: "\n\n### 3) 链表实现\n\n它不应该接受指向头节点指针的指针。你可以假设链表永远不会为空。让函数命名为 `deleteNode()`。在一种直接的实现中，当要删除的节点是第一个节点时，函数需要修改\
    \ `head` 指针。\n\n```java\nclass LinkedList {\n    static Node head;\n    static\
    \ class Node {\n        int data;\n        Node next;\n        Node(int d) {\n\
    \            data = d;\n            next = null;\n        }\n    }\n    void deleteNode(Node\
    \ node, Node n) {\n        // 当要删除的节点是头节点时\n        if (node == n) {\n       \
    \     if (node.next == null) {\n                System.out.println(\"There is\
    \ only one node. The list \" + \"can't be made empty \");\n                return;\n\
    \            }\n            /* 将下一个节点的数据复制到头节点 */\n            node.data = node.next.data;\n\
    \            // 存储下一个节点的地址\n            n = node.next;\n            // 移除下一个节点的链接\n\
    \            node.next = node.next.next;\n            // 释放内存\n            System.gc();\n\
    \            return;\n        }\n        // 当不是第一个节点时，遵循标准的删除过程\n        // 寻找前一个节点\n\
    \        Node prev = node;\n        while (prev.next != null && prev.next != n)\
    \ {\n            prev = prev.next;\n        }\n        // 检查节点是否真的在链表中\n     \
    \   if (prev.next == null) {\n            System.out.println(\"Given node is not\
    \ present in Linked List\");\n            return;\n        }\n        // 从链表中移除节点\n\
    \        prev.next = prev.next.next;\n        // 释放内存\n        System.gc();\n\
    \        return;\n    }\n    /* 打印链表的工具函数 */\n    void printList(Node head) {\n\
    \        while (head != null) {\n            System.out.print(head.data + \" \"\
    );\n            head = head.next;\n        }\n        System.out.println(\"\"\
    );\n    }\n    public static void main(String[] args) {\n        LinkedList list\
    \ = new LinkedList();\n        list.head = new Node(12);\n        list.head.next\
    \ = new Node(15);\n        list.head.next.next = new Node(10);\n        list.head.next.next.next\
    \ = new Node(1);\n        list.head.next.next.next.next = new Node(5);\n     \
    \   list.head.next.next.next.next.next = new Node(6);\n        list.head.next.next.next.next.next.next\
    \ = new Node(2);\n        list.head.next.next.next.next.next.next.next = new Node(3);\n\
    \        System.out.println(\"Given Linked List :\");\n        list.printList(head);\n\
    \        System.out.println(\"\");\n        // 让我们删除值为 10 的节点\n        System.out.println(\"\
    Deleting node :\" + head.next.next.data);\n        list.deleteNode(head, head.next.next);\n\
    \        System.out.println(\"Modified Linked list :\");\n        list.printList(head);\n\
    \        System.out.println(\"\");\n        // 让我们删除第一个节点\n        System.out.println(\"\
    Deleting first Node\");\n        list.deleteNode(head, head);\n        System.out.println(\"\
    Modified Linked List\");\n        list.printList(head);\n    }\n}\n```\n\n**输出：**\n\
    Given Linked List: 12 15 10 11 5 6 2 3\nDeleting node 10:\nModified Linked List:\
    \ 12 15 11 5 6 2 3\nDeleting first node\nModified Linked List: 15 11 5 6 2 3\n\
    \n## 第 4 章 | 网络\n\n### 什么是网络编程？\n`network programming` 一术是指编写在多个设备（计算机）上执行的程序，这些设备都通过网络相互连接。J2SE\
    \ API 的 `java.net` 包包含了一系列类和接口，它们提供了底层的通信细节，允许你编写专注于解决当前问题的程序。\n\n`java.net` 包对两种常见的网络协议提供了支持：\n\
    \n1. **TCP**: `TCP` 代表传输控制协议（Transmission Control Protocol），它允许两个应用程序之间进行可靠的通信。TCP\
    \ 通常在互联网协议（Internet Protocol）上运行，称为 `TCP/IP`。\n2. **UDP**: `UDP` 代表用户数据报协议（User\
    \ Datagram Protocol），是一种无连接的协议，允许在应用程序之间传输数据包。\n\n本章将对以下两个主题提供良好的理解：\n\n1. **Socket\
    \ 编程**: 这是网络领域应用最广泛的概念，已进行了非常详细的解释。\n2. **URL 处理**: `URL` 代表统一资源定位符（Uniform Resource\
    \ Locator），代表万维网上的资源，例如 Web 页面或 FTP 目录\n\n### Socket 编程\nSockets 使用 TCP 提供了两台计算机之间的通信机制。客户端程序在通信的这一端创建一个\
    \ socket，并尝试将该 socket 连接到服务器。当连接建立时，服务器会在通信的另一端创建一个 socket 对象。客户端和服务器现在可以通过向 socket\
    \ 写入读取数据来通信。\n\n`java.net.Socket` 类表示一个 socket，而 `java.net.ServerSocket` 类为服务器程序提供了监听客户端并与之建立连接的机制。\n\
    \n使用 sockets 建立两台计算机之间的 TCP 连接时会发生以下步骤：\n- 服务器实例化 `ServerSocket` 对象，指定通信发生的端口号。\n\
    - 服务器调用 `ServerSocket` 类的 `accept()` 方法，等待客户端连接。\n- 在服务器等待时，客户端实例化 `Socket` 对象，指定服务器名称和要连接的端口号。如果建立，客户端现在拥有了一个可以与之通信的\
    \ `Socket` 对象。在服务器端，`accept()` 方法返回一个连接到客户端的新 socket。\n\n连接建立后，可以使用流进行通信。每个 socket\
    \ 都有 `OutputStream` 和 `InputStream`。客户端的 `OutputStream` 连接到服务器的 `InputStream$，而客户端的\
    \ `InputStream` 连接到服务器的 `OutputStream`。TCP 是一种双向通信协议，因此可以在流之间发送数据。\n\n#### ServerSocket\
    \ 类方法\n`java.net.ServerSocket` 类用于服务器应用程序获取端口并监听客户端请求。`ServerSocket` 类有四个构造函数：\n\
    \n1. `public ServerSocket(int port) throws IOException`: 尝试创建一个绑定指定端口的服务器 socket。如果端口已被程序绑定，则会发生异常。\n\
    2. `public ServerSocket(int port, int backlog) throws IOException`: 与之前的构造类似，`backlog`\
    \ 参数指定在等待队列中存储多少入站客户端。\n3. `public ServerSocket(int port, int backlog, InetAddress\
    \ address) throws IOException`: 与之前的构造类似，`InetAddress` 参数指定要绑定的本地 IP 地址。`InetAddress`\
    \ 用于可能具有多个 IP 地址的服务器，允许服务器指定在它的哪个 IP 地址上接收客户端请求。\n4. `public ServerSocket() throws\
    \ IOException`: 创建一个未绑定的服务器 socket。使用此构造函数时，在准备好绑定服务器 socket 时使用 `bind()` 方法。\n\
    \n如果 `ServerSocket` 构造函数没有抛出异常，则意味着你的应用程序已成功绑定到指定的端口并准备好处理客户端请求。以下是 `ServerSocket`\
    \ 类的一些常用方法：\n\n- `public int getLocalPort()`: 返回服务器 socket 监听的端口号。如果你在构造函数中传入\
    \ `0` 作为端口号并让服务器为你寻找端口，则此方法非常有用。\n\n"
