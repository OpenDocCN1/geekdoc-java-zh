    我们建议你使用 IDE（集成开发环境），这是一个非常方便且出色的软件，它将文本编辑器、调试器和编译器合为一体，虽然软件包有时很臃肿，但通常非常实用。除非你致力于在文本编辑器和命令行提示符窗口中工作（这样做确实有令人信服的理由），否则你可能正在寻找关于如何选择良好
    IDE 的建议、各种类型的优缺点、运行特定 IDE 的相对成本（资金或系统资源）、该 IDE 能够很好地处理其他语言、它所运行的操作系统以及更多内容。


    以下是程序员最常用的两种 IDE 列表。


    ### [Eclipse](http://www.eclipse.org/)

    *   **语言**：C, C++, Python, Perl, PHP, Java, Ruby 等

    *   **价格**：免费


    Eclipse 是许多开发框架所基于的免费开源编辑器。它是该领域的元老级产品，深受许多专业开发者的高度推荐。Eclipse 起于一个 Java 开发环境，通过轻量级插件系统得到了极大扩展。


    ### [NetBeans](http://netbeans.org/)

    *   **语言**：Java, JavaScript, PHP, Python, Ruby, C, C++ 等

    *   **价格**：免费


    NetBeans 与 Eclipse 并肩，是该类别中最受推荐的 IDE。它是免费开源的，支持大量语言并不断有新插件加入，而且对于初学者来说安装和使用极其简单。


    ## 编译与执行


    简单的 Java 项目包含一个目录，所有的 Java 源文件都存储其中。Java 文件通常不直接存储在源码目录下，而是存储在与其包结构匹配的子目录中。包是将相关的源文件分组的一种方式。


    当你编译源码中的所有代码时，编译器会为每个 `.java` 文件生成一个 `.class` 文件。`.class` 包含了编译后的 `.java` 文件。换句话说，就是
    `.java` 文件的字节码。


    Java 虚拟机执行的是 `.class` 文件，而不是 `.java` 文件。因此，将 `.java` 文件与 `.class` 文件分开是正常的。这通常通过指示编译器将
    `.class` 文件写入单独的目录来实现。该目录通常被称为 `classes`，但再次，这不是强制要求的，取决于你正在使用的构建工具或 IDE 等。


    ### 编译 Java 源码


    你可以直接从 IDE 中编译 Java 源码（如果你使用 IDE 的话）。或者，你可以使用 Java SDK 自带的 Java 编译器。要从命令行使用 Java
    编译器编译 Java 源码，请执行以下操作：


    *   打开命令行提示符

    *   切换目录到你的项目根目录（而不是源码目录）

    *   确保项目根目录包含一个源码目录和一个类目录

    *   输入下面的命令（在 Windows 上——其他操作系统也类似）：


    '
- fmt: '

    ```

    "c:\Program Files\Java\jdk1.8.0_25\bin\javac" src/myfirstapp/*.java -d classes

    ```

    This command executes the `javac` command (the Java compiler) which compiles the
    Java sources in the directory `src/myfirstapp`. The `*.java` means the compiler
    should compile all files in the given directory.


    The `myfirstapp` directory is a package under the root source directory `src`.
    If you have multiple packages under the root source directory, you will have to
    run the Java compiler multiple times. A Java IDE handles this for you automatically.
    So does build tools like `Ant`, `Maven` or `Gradle`.


    ### Running the Compiled Java Code


    Once the compiler has done its job, the `classes` directory will contain the compiled
    `.class` files. The package structure (directory structure) from the source directory
    will be preserved under the class directory. You can run any one of these `.class`
    files which have a `main()` method in it. You can run the `.class` from inside
    your Java IDE, or from the command line. From the command line it looks like this:


    ```

    "c:\Program Files\Java\jdk1.8.0_25\bin\java" -cp classes myfirstapp.MyJavaApp

    ```


    The `-cp classes` flag tells the Java Virtual Machine that all your classes are
    located under the directory called `classes`. This is also called the "Class Path"
    (hence the abbreviation `cp`). The name of the class to run is the last argument
    in the above command – the `myfirstapp.MyJavaApp` part. The JVM needs to know
    the fully qualified class name (all packages plus class name) to determine where
    the corresponding `.class` file is located.


    When you run the class, your command line will look similar to this (including
    the output from the Java app):


    ```

    D:\data\projects\my-first-java-app>"c:\Program Files\Java\jdk1.8.0_25\bin\java"    -cp
    classes myfirstapp.MyJavaApp

    Hello World!

    D:\data\projects\my-first-java-app>

    ```


    (Note, the first command should not have a line break in it. I have put that in
    only to make it easier to read.)


    That is it! Now you know how to compile and execute your Java apps! As mentioned
    earlier, it can be easier using an IDE, but you may not have an IDE everywhere
    you want to execute the code.


    # CHAPTER 3 | BASIC TERMS


    This section will cover many basic terms and some of the basic ideas behind writing
    proper code. Java is among the many different programming languages which use
    the same words and concepts to convey instructions to the computer. Once we get
    through the first few chapters, we’ll be introduced to some more of the basics
    which are directly related to reading and writing code. Before we can get to that,
    we’ll need to cover some of the terms and concepts that hold true for many different
    programming languages, not just Java. The methods and systems that allow converting
    words into executable code require fairly strict rules. When writing English or
    chatting online, we tend to ignore formatting and punctuation. The brevity allows
    for faster communication, though only because we as humans have learned many new
    words and can use context to better interpret the contractions and acronyms in
    the written form of English used online or in text messages. Computers aren’t
    so smart as to be able to interpret our words so easily.


    ### Tokens


    In written English, the smallest elements of the language are letters and numbers.
    Individually, most letters and numbers lack specific meaning. The next larger
    element after the letter is the word. Each word has more meaning, but complex
    thoughts are difficult to convey in a single word. To communicate a thought, we
    use sentences. The words in a sentence each have a specific use, as seen in the
    diagram below. To convey a concept, we use a collection of sentences grouped into
    a paragraph. And to convey emotion, we use a collection of many paragraphs organized
    into chapters. To tell a story, we use a book, a collection of chapters.


    ![](OEBPS/image496.jpg)


    Programming has similar organizational mechanisms. The smallest meaningful element
    is a `token`, followed by statements, code blocks, functions, followed by classes
    and namespaces and eventually a program, or in our case, a game. We will begin
    with the smallest element and work our way up to writing our own classes. However,
    it’s important to know the very smallest element to understand how all the parts
    fit together before we start writing any complex code.


    ### Writing Java


    Java is an English-based programming language; like any other C-like programming
    language, it can be broken into tokens, the smallest meaningful fragment of text
    that the computer can understand. Tokens are made of a single character or a series
    of characters. For instance, in a simple statement like the following there are
    five tokens.


    ![](OEBPS/image511.jpg)


    Tokens can be categorized as a `keyword`, `identifier`, `literal`, `operator`,
    `separator`, and `white space`. The above statement contains five tokens with
    spacing provided with white space. The keyword `int` is followed by the identifier
    `i`. This is followed by an operator `=` which assigns the identifier on the left
    of the operator and the value of the literal `0` on the right. The last token
    `;` is a `separator` which ends the statement. White spaces and comments, which
    we have yet to cover, are not considered tokens, although they can act as separators.
    It’s important that proper formatting or style be used.


    Let’s examine a sample of code:

    ```java

    int i = 0;      int j = 1;

    ```


    The code shown above is two statements, the `separator` keeps the computer from
    misreading the code as a single statement. However, there are humans involved
    with writing code, and thus code needs to be readable by humans, or any other
    life-form which might read your code. Proper code means following a specific formatting
    style. We’ll dive into more about proper code style later in this chapter. Each
    group of characters, or text, is converted by a lexical analyzer, sometimes called
    a lexer, in the computer and turned a symbol. This process is called tokenization,
    or as a computer scientist would say, a lexer tokenizes your code into symbols.
    Once tokenized, the symbols are parsed; this process organizes the tokens into
    instructions for the computer to follow. This unique vocabulary does frame programmers
    as a strange group of alien beings with a language all to themselves; I promise,
    however, conversations about lexical analyzers don’t come up very often when talking
    with most programmers. This may seem like a great deal of work and we are jumping
    ahead into more complex computer science topics, but all of this happens behind
    the scenes so you don’t need to see any of this taking place. It’s important to
    understand what a compiler does, and how it works so you can write code in a way
    that the computer can understand. This is why a simple typo will stop the lexer
    from building code. We’ll get to writing code to be analyzed, tokenized, and parsed
    soon enough. A computer can’t interpret or guess at what it is you’re trying to
    do. Therefore, if you mistype `int i = 0:` and not `int i = 0;` the last token
    cannot be converted by the lexer into a proper symbol, and thus this statement
    will not be parsed at all. This code results in an error before the code is even
    compiled.

