    # “一种不影响你编程思维方式的语言是不值得学习的。”

    ― 阿兰·J·珀利斯 (Alan J. Perlis)


    # “计算机程序员是宇宙的创造者，他们是法律制定者。任何剧作家、舞台导演或皇帝，无论多强大，从未行过如此绝对的权威来安排舞台或战场，并指挥如此忠实尽职的演员或军队。”

    ― 约瑟夫·魏森鲍 (Joseph Weizenbaum)


    # “如果两者都是冰冻的，那么在水上行走和根据规范开发软件都是很容易。”

    ― 爱德华·贝拉德 (Edward Berard)


    # “Perl —— 唯一在 RSA 加密前后看起来完全一样的语言。”

    ― 基斯·博斯蒂克 (Keith Bostic)


    # “你能学到的最糟糕的 own 就是你的第一门编程语言。”

    ― 阿兰·凯 (Alan Kay)


    # “计算机就像小提琴。你可以想象一个新手先尝试唱片机，然后尝试小提琴。他说，后者的听起来很糟糕。这就是我们从人文主义者和大多数计算机科学家那里听过的论点。他们说，计算机程序对于特定目的很有用，但它们并不灵活。小提琴或打字机也是如此，直到你学会如何使用它们。”

    ― 马文·明斯基 (Marvin Minsky)


    # “程序最重要的属性是它是否实现了用户的意图。”

    ― C.A.R. 霍尔 (C.A.R. Hoare)


    # “面向对象的编程提供了一种编写意大利面代码的可持续方法。它让你像堆积补丁一样堆积程序。”

    ― 保罗·格拉汉 (Paul Graham)，出自《黑客与画家：计算机时代的重大思想》


    # “四十岁时，我太老不能再自己当程序员了；写代码是年轻人的工作。”

    ― 米克尔·克莱顿 (Michael Crichton)，出自《猎物》


    # “实际上，一些最好的编程是在纸上完成的。将其放入计算机只是一个次要细节。”

    ― 马克斯·卡纳特-亚历山大 (Max Kanat-Alexander)，出自《代码简单性：软件基础》


    # “衡量程序员的标准不应该是他们的天赋和逻辑，而应是他们用例分析的完整性。”

    ― 阿兰·J·珀利斯 (Alan J. Perlis)


    # “只有当我们训练自己去思考程序，而不把它们看作可执行代码片段时，进步才可能。”

    ― 埃德格·W·迪杰斯特 (Edsger W. Dijkstra)


    # “不要因为你‘知道’它能运行就忽略涉及该 Bug 的例程或代码。证明它。在这个语境下、用这些数据、用这些边界条件证明它。”

    ― 安德鲁·亨特 (Andrew Hunt)，出自《实战程序员：从苦行手到大师》


    # “记住，代码实际上是我们最终表达需求的语言。我们可以创建更接近需求的语言。我们可以创建帮助我们解析并将这些需求组装成形式化结构的工具。但我们永远无法消除必要的精确性——所以代码将永远存在。”

    ― 罗伯特·C·马丁 (Robert C. Martin)


    # “软件测试是一项像狩猎一样的运动，它是捕虫。”

    ― 阿米特·卡兰特 (Amit Kalantri)


    # “事实证明，编程是很困难的。基本规则通常简单清晰。但建立在这些规则之上的程序往往会变得复杂到足以引入它们自己的规则和复杂性。在某种程度上，你正在构建自己的迷宫，你很可能会迷失其中。”

    ― 马里恩·哈弗贝克 (Marijn Haverbeke)


