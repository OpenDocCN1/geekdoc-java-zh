  trans: "\n\n# Java 中的单维数组\n\n## Java 中声明数组的语法\n`dataType[] arr;` (或) `dataType []arr;`\
    \ (或) `dataType arr[];`\n\n## Java 中实例化数组\n`arrayRefVar=new datatype[size];`\n\
    \n## Java 单维数组示例\n让我们来看一个 Java 数组的简单示例，其中我们将对一个数组进行声明、实例化、初始化和遍历。\n\n```java\n\
    class Testarray{\n    public static void main(String args[]){\n        int a[]=new\
    \ int[5];//声明和实例化\n        a[0]=10;//初始化\n        a[1]=20;\n        a[2]=70;\n\
    \        a[3]=40;\n        a[4]=50;\n        //打印数组\n        for(int i=0;i<a.length;i++)length\
    \ 是数组的属性\n            System.out.println(a[i]);\n    }\n \n}\n```\n**输出：**\n```\n\
    10\n20\n70\n40\n50\n```\n\n## Java 数组的声明、实例化和初始化\n我们可以通过以下方式同时声明、实例化和初始化 Java\
    \ 数组：`int a[]={33,3,4,5};`//声明、实例化和初始化\n\n让我们来看一个打印此数组的简单示例。\n\n```java\nclass\
    \ Testarray1{\n    public static void main(String args[]){\n        int a[]={33,3,4,5};//声明、实例化和初始化\n\
    \        //打印数组\n        for(int i=0;i<a.length;i++)length 是数组的属性\n          \
    \  System.out.println(a[i]);\n    }\n}\n```\n**输出：**\n```\n33\n3\n4\n5\n```\n\n\
    ## Java 中将数组传递给方法\n我们可以将 Java 数组传递给方法，这样我们就可以在任何数组上复用相同的逻辑。让我们来看使用方法获取数组中最小值的简单示例。\n\
    \n```java\nclass Testarray2{\n    static void min(int arr[]){\n        int min=arr[0];\n\
    \        for(int i=1;i<arr.length;i++)\n            if(min>arr[i])\n         \
    \       min=arr[i];\n        System.out.println(min);\n    }\n    public static\
    \ void main(String args[]){\n        int a[]={33,3,4,5};\n        min(a);//将数组传递给方法\n\
    \    }\n}\n```\n**输出：** `3`\n\n---\n\n# Java 中的多维数组\n在这种情况下，数据根据行和列索引进行存储（也称为矩阵形式）。\n\
    \n## Java 中声明多维数组的语法\n`dataType[][] arrayRefVar;` (或) `dataType [][]arrayRefVar;`\
    \ (或) `dataType arrayRefVar[][];` (或) `dataType []arrayRefVar[];`\n\n## Java 中实例化多维数组的示例\n\
    `int[][] arr=new int[3][3];` //3 行 3 列\n\n## Java 中初始化多维数组的示例\n`arr[0][0]=1;`\n\
    `arr[0][1]=2;`\n`arr[0][2]=3;`\n`arr[1][0]=4;`\n`arr[1][1]=5;`\n`arr[1][2]=6;`\n\
    `arr[2][0]=7;`\n`arr[2][1]=8;`\n`arr[2][2]=9;`\n\n## 多维数组示例\n让我们来看一个声明、实例化和打印\
    \ 2D 数组的简单示例。\n\n```java\nclass Testarray3{\n    public static void main(String\
    \ args[]){\n        //声明并初始化 2D 数组\n        int arr[][]={{1,2,3},{2,4,5},{4,4,5}};\n\
    \        //打印 2D 数组\n        for(int i=0;i<3;i++){\n            for(int j=0;j<3;j++){\n\
    \                System.out.print(arr[i][j]+\" \");\n            }\n         \
    \   System.out.println();\n        }\n    }\n}\n```\n**输出：**\n```\n1 2 3 \n2 4\
    \ 5 \n4 4 5 \n```\n\n---\n\n# 第 8 章 | 面向对象编程## 类\n任何 Java 程序最重要的部分都是类。这里的这里的类不是学生去的那种“班”，而是分类的类。Java\
    \ 中的类以几种不同的形式出现。有些被称为部分类，有些类甚至可以出现在另一个类内部；这些类被称为嵌套类。类是指令和数据的集合。指令可以称为函数或方法。存储在类中的数据被称为字段或属性。抛开命名问题，重要的是类做什么以及如何使用它们。\n\
    \n类是灵活且易于更改的，但这种灵活性并不是某种复杂度。正如我们之前看到的，类的声明可以包含比示例多多的内容。然而，许多复杂性出现在本书后面，需要的时候。当你处理游戏或任何类型的编程任务时，首先收集数据，然后弄清楚如何使用数据。在大多数编程范式中，最好的方法是在新类的开始处定义变量。例如，在这段代码中，在出门之前我们可能想知道今天是星期几：\n\
    \n```\nTime day = today;\nif (day == Friday){\n    PartyTonight = true;\n}\n```\n\
    我们从获取日期开始，然后根据日期决定做什么。我们应该避免参加派对，除非你想晚点显示。类是创建对象的蓝图。以下是一个类的示例。\n\n```java\nclass\
    \ Dog {\n    String breed;\n    int age;\n    String color;\n    void barking()\
    \ {\n    }\n    void hungry() {\n    }\n    void sleeping() {\n    }\n}\n```\n\
    \n类可以包含以下类型的变量：\n- **局部变量**：定义在方法内部的变量，当方法完成后会被声明和销毁。\n- **实例变量**：类内部但方法外部的变量，当类实例化时初始化。\n\
    - **类变量**：类中方法外部的变量，带有 `static` 关键字。\n\n## 构造函数\n在讨论类时，最重要的主题是构造函数。每个类都有构造函数。如果我们不显式地为类编写构造函数，Java\
    \ 编译器会构建默认构造函数。构造函数的规则是与类相同。类可以有多个构造函数。以下是构造函数的示例：\n\n```java\nclass Puppy {\n\
    \    public Puppy() {\n    }\n    public Puppy(String name) {\n        // 这个构造函数有一个参数\
    \ name\n    }\n}\n```\n\n## 对象简介\n面向对象编程 (OOP) 的发明是为了将数据和逻辑良好地封装在一起。当你编写 Java\
    \ 类时，你正在为新对象创建蓝图。然后根据蓝图构建许多对象。每个实例化对象都是类的实例。所有编程语言都提供了抽象。\n\n### 创建对象\n从类创建对象有三个步骤：\n\
    - **声明**：带有对象类型的变量。\n- **实例化**：使用 `new` 关键字创建对象。\n- **初始化**：`new` 关键字后跟着对构造函数的调用。此调用初始化了新对象。\n\
    \n以下创建一个对象的示例：\n\n```java\nclass Puppy {\n    public Puppy(String name) {\n  \
    \      // 这个构造函数有一个参数 name\n        System.out.println(\"Passed Name is :\" +\
    \ name );\n    }\n    public static void main(String args) {\n        // 以下语句创建一个对象\
    \ myPuppy\n        Puppy myPuppy = new Puppy( \"tommy\" );\n    }\n}\n```\n**输出：**\
    \ `Passed Name is :tommy`\n\n### 访问实例变量和方法\n实例变量和方法通过创建的对象访问。访问实例变量可以使用限定路径：\n\
    \n```\n/* 先创建一个对象 */\nObjectReference = new Constructor();\n/* 现在这样调用变量 */\nObjectReference.variableName;\n\
    /* 现在你可以这样调用类方法 */\nObjectReference.MethodName();\n```\n\n示例：此示例解释了如何访问类的实例变量和方法。\n\
    \n```java\nclass Puppy {\n    int puppyAge;\n    public Puppy(String name) {\n\
    \        // 这个构造函数有一个参数 name\n        System.out.println(\"Name chosen is :\"\
    \ + name );\n    }\n    public void setAge( int age ) {\n        puppyAge = age;\n\
    \    }\n    public int getAge( ) {\n        System.out.println(\"Puppy's age is\
    \ :\" + puppyAge );\n        return puppyAge;\n    }\n    public static void main(String\
    \ []args) {\n        /* 对象创建 */\n        Puppy myPuppy = new Puppy( \"tommy\"\
    \ );\n        /* 调用类方法设置 puppy 的年龄 */\n        myPuppy.setAge( 2 );\n        /*\
    \ 调用类方法获取 puppy 的年龄 */\n        myPuppy.getAge( );\n        /* 你也可以访问实例变量 */\n\
    \        System.out.println(\"Variable Value :\" + myPuppy.puppyAge );\n    }\n\
    }\n```\n**输出：**\n```\nName chosen is :tommy\nPuppy's age is :2\nVariable Value\
    \ :2\n```\n\n### 面向对象编程的特征\n1. **一切都是对象**：把对象看成一个高级变量；它存储数据，但你可以向该对象提出“请求”。\n\
    2. **程序是一堆互相告诉对方要做什么的对象**：要向对象提出请求，你向该对象“发送消息”。更具体地说，你可以把消息看作是调用特定对象的方法的请求。\n\
    3. **每个对象都有由其他对象组成的独立内存**：换句话说，你通过创建现有对象来创建新类型的对象。因此，你可以在程序中构建复杂性，同时将其隐藏在对象的简单性之后。\n\
    4. **每个对象都有一个类型**：使用类来定义对象类型。面向对象编程的发明是为了将数据和逻辑良好地封装在一起。每个实例化对象都是类的实例。\n\n## 单例\n\
    （此处无原文内容需要翻译）\n\n"
- fmt: "\n* An interface can contain any number of methods.\n* An interface is written\
    \ in a file with a `.java` extension, with the name of the interface matching\
    \ the name of the file.\n* The byte code of an interface appears in a `.class`\
    \ file.\n* Interfaces appear in packages, and their corresponding bytecode file\
    \ must be in a directory structure that matches the package name.\n\nHowever,\
    \ an interface is different from a class in several ways, including −\n\n* You\
    \ cannot instantiate an interface.\n* An interface does not contain any constructors.\n\
    * All of the methods in an interface are abstract.\n* An interface cannot contain\
    \ instance fields. The only fields that can appear in an interface must be declared\
    \ both `static` and `final`.\n* An interface is not extended by a class; it is\
    \ implemented by a class.\n* An interface can extend multiple interfaces.\n\n\
    ### Declaring Interfaces\nThe `interface` keyword is used to declare an interface.\
    \ Here is a simple example to declare an interface —\n\nExample:\n```java\n/*\
    \ File name : NameOfInterface.java */\nimport java.lang.*;\n// Any number of import\
    \ statements\npublic interface NameOfInterface { \n    // Any number of final,\
    \ static fields\n    // Any number of abstract method declarations\n}\n```\n\n\
    Interfaces have the following properties:\n\n* An interface is implicitly abstract.\
    \ You do not need to use the `abstract` keyword while declaring an interface.\n\
    * Each method in an interface is also implicitly abstract, so the `abstract` keyword\
    \ is not needed.\n* Methods in an interface are implicitly public.\n\nExample:\n\
    ```java\n/* File name : Animal.java */\ninterface Animal { \n    public void eat();\n\
    \    public void travel();\n}\n```\n\n### Implementing Interfaces\nWhen a class\
    \ implements an interface, you can think of the class as signing a contract, agreeing\
    \ to perform the specific behaviors of the interface. If a class does not perform\
    \ all the behaviors of the interface, the class must declare itself as abstract.\n\
    \nA class uses the `implements` keyword to implement an interface. The `implements`\
    \ keyword appears in the class declaration following the `extends` portion of\
    \ the declaration.\n\nExample:\n```java\n/* File name : MammalInt.java */\npublic\
    \ class MammalInt implements Animal { \n    public void eat() { \n        System.out.println(\"\
    Mammal eats\"); \n    } \n    public void travel() { \n        System.out.println(\"\
    Mammal travels\"); \n    } \n    public int noOfLegs() { \n        return 0; \n\
    \    } \n    public static void main(String args[]) { \n        MammalInt m =\
    \ new MammalInt(); \n        m.eat(); \n        m.travel(); \n    }\n}\n```\n\n\
    This will produce the following result:\nOutput:\n```\nMammal eats\nMammal travels\n\
    ```\n\nWhen overriding methods defined in interfaces, there are several rules\
    \ to be followed:\n\n* Checked exceptions should not be declared on implementation\
    \ methods other than the ones declared by the interface method or subclasses of\
    \ those declared by the interface method.\n* The signature of the interface method\
    \ and the same return type or subtype should be maintained when overriding the\
    \ methods.\n* An implementation class itself can be abstract and if so, interface\
    \ methods need not be implemented.\n\nWhen implementation interfaces, there are\
    \ several rules:\n\n* A class can implement more than one interface at a time.\n\
    * A class can extend only one class, but implement many interfaces.\n* An interface\
    \ can extend another interface, in a similar way as a class can extend another\
    \ class.\n"
