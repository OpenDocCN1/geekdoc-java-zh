  trans: "\n\n# 区分成员\n\n如果一个类继承了另一个类的属性，并且父类的成员名称与子类的成员名称相同，为了区分这些变量，我们使用 `super`\
    \ 关键字，如下所示。\n\n`super.variable`\n`super.method();`\n\n### 示例：\n\n```java\nclass\
    \ Super_class {\n    int num = 20; // 父类的显示方法 \n    public void display() {\n\
    \        System.out.println(\"This is the display method of superclass\");\n \
    \   }\n}\n\npublic class Sub_class extends Super_class {\n    int num = 10; //\
    \ 子类的显示方法 \n    public void display() {\n        System.out.println(\"This is\
    \ the display method of subclass\");\n    }\n    public void my_method() {\n \
    \       // 实例化子类\n        Sub_class sub = new Sub_class();\n        // 调用子类的 display()\
    \ 方法\n        sub.display();\n        // 调用父类的 display() 方法\n        super.display();\n\
    \        // 打印子类变量 num 的值\n        System.out.println(\"value of the variable\
    \ named num in sub class:\" + sub.num);\n        // 打印父类变量 num 的值\n        System.out.println(\"\
    value of the variable named num in super class:\" + super.num);\n    }\n    public\
    \ static void main(String args[]) {\n        Sub_class obj = new Sub_class();\n\
    \        obj.my_method();\n    }\n}\n```\n\n使用以下语法编译并执行上述代码：\n\n```bash\njavac\
    \ Super_Demo\njava Super_On\n```\n\n执行程序后，你将得到以下结果：\n\n### 输出\n```\nThis is the\
    \ display method of subclass\nThis is the display method of superclass\nvalue\
    \ of the variable named num in sub class:10\nvalue of the variable named num in\
    \ super class:20\n```\n\n# 继承的类型\n\n如下所示，多种类型的继承。\n\n![Types of Inheritance](img/image4253.jpg)\n\
    \n一个需要记住的重要事实是 Java 不支持多重继承。这意味着一个类不能继承多个类。因此，以下代码是非合法的：\n\n### 示例：\n```java\n\
    public class class extends Animal, Mammal{}\n```\n\n然而，一个类可以实现一个或多个接口，这帮助 Java\
    \ 消除了多重继承的不可能性。\n\n# 具有多态的可交换对象\n\n在处理类型层次结构时，你通常希望将对象视为其基类型，而不是它所属的特定类型。这允许你编写不依赖于特定类型的代码。在形状的示例中，方法操作的是通用的形状，而不关心它们是圆形、正方形、三角形还是某些尚未定义的形状。所有的形状都可以被绘制、擦除和移动，因此这些方法简单地向形状对象发送消息；它们不必担心对象如何处理该消息。\n\
    \n这种代码不受新类型的影响的影响而添加新类型是扩展面向对象程序以处理新情况的最常见方式。例如，你可以派生出一个名为 `pentagon`（五边形）的新形状子类型，而无需修改处理通用形状的方法。这种通过派生新子类型轻松扩展设计的能力是封装变化的本质方式之一。这大大改进了设计，同时降低了软件维护的成本。\n\
    \n然而，尝试将派生类型对象视为其通用基类型（将圆形视为形状、将自行车视为车辆、将海视为鸟类等）存在问题。如果一个方法要告诉一个通用形状去绘制自己，或告诉一个通用车辆去转向，或告诉一个通用鸟类去移动，编译器在编译时无法精确知道将执行哪部分代码。这正是目的所在——当消息被发送时，程序员并不想知道将执行哪部分代码；`draw`\
    \ 方法可以同样地应用于圆形、正方形或三角形，而对象将根据其特定类型执行相应的代码。\n\n如果你不需要知道将执行哪部分代码，那么当你添加一个新子类型时，它执行的代码可以不同，而无需更改调用它的方法。因此，编译器无法精确知道执行了哪部分代码，那么它在做什么呢？\n\
    \n例如，在接下来的图示，`BirdController` 对象只与通用的 `Bird` 对象工作，而不知道它们具体是什么类型。这从 `BirdController`\
    \ 的角度来看是非常方便的，因为它不需要编写特殊代码来确定正在处理的 `Bird` 的确切类型或该 `Bird` 的行为。那么在忽略 `Bird` 的特定类型的情况下调用\
    \ `move()` 时，正确的行为是如何发生的呢（`Goose`行走、飞行或游泳，而 `Penguin`行走或游泳）？\n\n![](img/image4279.jpg)\n\
    \n答案是面向对象编程中的主要转折：\n\n编译器无法在传统意义上进行函数调用。非 OOP 生成的函数调用会导致所谓的“早期绑定”（early binding），你可能没有听过这个术语，因为你从未考虑过其他方式。这意味着编译器生成一个对特定名称的调用，而运行时系统将此调用解析为执行代码的绝对地址。为了解决这个问题，面向对象的语言使用了“晚期绑定”（late\
    \ binding）的概念。当你向对象发送消息时，所调用的代码直到运行时才确定。编译器确保方法存在，并对参数和返回值进行类型检查，但它不知道要执行的具体代码。为了实现晚期绑定，面向对象的语言使用特殊的代码来代替绝对调用。该代码计算方法的地址，使用存储在对象中的信息（这一过程在多态章节中会有详细介绍）。因此，每个对象可以根据该特殊代码有不同的行为。在某些语言中，你必须显式地让方法具有晚期绑定的活性（C++\
    \ 使用 `virtual` 关键字来实现）。在这些语言中，默认方法不是动态绑定的。在 Java 中，动态绑定是默认行为，你不需要添加额外的关键字来获取多态。\n\
    \n# 第 9 章 | 异常处理\n\n使用异常处理错误\n\n捕获错误的理想时间是在编译时，甚至在运行程序之前。然而，并不是所有错误都可以在编译时检测。剩余的问题必须在运行时通过某些形式处理，允许错误产生者将信息传递给接收者。\n\
    \n目标是更有心地确保你的应用程序没有未处理的错误。异常并不难学，它是为项目提供即时利益之一。由于异常处理是 Java 报告错误的官方方式并由编译器强制执行，本章将介绍正确处理异常所需的代码，以及当出现问题时如何生成自己的异常。\n\
    \n### 概念\n\nC 和其他早期语言有多种错误处理方案，这些通常是通过约定而非编程语言的一部分建立的。通常返回一个特殊值或设置一个标志，接收者应该查看该值以判断发生了什么。然而，随着时间的推移，人们发现程序员倾向于认为自己是无敌的——即“错误可能会发生，但在我的代码中不会”。如果你足够仔细地每次调用方法都检查错误，你的代码可能会变成一个不可读的噩梦。因为这些语言仍然允许错误，处理错误的方法是创建健壮、可维护程序的主要限制。\n\
    \n解决方案是将错误处理从偶然性中提取出来并强制化。这实际上有很久的历史；异常处理的实现可以追溯到 1960 年代的操作系统，甚至是 BASIC 的 `on\
    \ error goto`。但 C++ 的异常处理基于 Ada，而 Java 的则更像 Object Pascal。\n\n“exception”（异常）一词的含义是“我遇到了例外情况”。在问题发生的地方，你可能不知道该怎么办，但你知道不能愉快地继续下去；必须停止，并在某处解决。但当前上下文中没有足够的信息来修复问题，因此你将问题交给有能力做决策的高级上下文。\n\
    \n异常的另一个显著优点是它们减少了错误处理代码的复杂性。如果没有异常，你必须在程序的多个地方检查并处理特定错误。有了异常，你不再需要在方法调用处检查错误，因为异常将保证有人捕获它。你只需要在一个地方（所谓的异常处理器）处理问题。这节省了你的代码，并将执行执行的代码与出错时执行的代码分开。通常情况下，使用异常读取、编写和调试代码会比旧的错误处理方式清晰得多。\n\
    \n### 基本异常\n\n异常状态是一个阻止当前方法或范围继续的问题。将异常状态与普通问题区分很重要，后者你在当前上下文中有足够的信息来应对困难。对于异常状态，你无法继续处理，因为你没有处理问题所需的信息。你所做的只是跳出当前上下文并将该问题交给高级上下文。这就是抛出异常时发生的情况。\n\
    \n除法是一个简单的例子。如果你将除以零，检查该状态是有值的。但分母为零意味着什么？如果这是一个意外值，你必须抛出异常而不是继续该路径。\n\n当你抛出异常时，会发生几件事。首先，异常对象以任何\
    \ Java 对象相同的方式创建：在堆上通过 `new`。然后，当前的执行路径（你无法继续的路径）停止，异常的引用从环境中弹出。此时，异常处理机制接管并开始寻找合适的继续的地方。这个合适的地方就是异常处理器，它的工作是从问题中恢复。作为一个抛出的简单示例，考虑对象引用\
    \ `t`。你可能会接收到一个未初始化的引用，因此你可能想在调用方法之前进行检查。看起来如下：\n\n```java\nif(t == null) {\n\
    \    throw new NullPointerException();\n}\n```\n\n这抛出了异常，允许你在当前上下文中放弃思考该问题的责任。异常允许你将所做的一切视为一个事务。你也可以将异常视为内置的撤销系统，因为你可以在程序中设置各种恢复点。如果程序部分失败，异常将“撤销”回到已知的稳定点。\n\
    \n### 异常参数\n\n与 Java 中的任何对象一样，始终使用 `new` 在堆上创建异常，这分配存储并调用构造函数。标准异常有两个构造函数：第一个是默认构造函数，第二个接收参数以便你可以将相关信息放在异常中。\n\
    \n```java\nthrow new NullPointerException(\"t = null\");\n```\n\n这个字符串可以使用各种方法提取。\n\
    \n### throw 关键字\n\n`throw` 关键字产生了许多有趣的结果。在用 `new` 创建异常对象后，你将引用传递给 `throw`。对象实际上从方法“返回”了，尽管该类型并不是方法设计要返回的。简单地将异常处理理解为另一种返回机制，尽管你在考虑它时遇到了麻烦。你也可以通过抛出异常退出普通范围。在任何情况下，异常对象都被返回，方法或范围退出。这里与异常发生的地方完全不同（在方法调用处，在栈的很多层之外）。此外，你可以抛出任何类型的\
    \ `Throwable`，它是异常的根类。通常，对于每种类型的错误都会抛出一个异常类。\n\n### 捕获异常\n\n要查看异常是如何被捕获的，必须首先理解保护区域。这是一个可能产生异常的代码段，后面是处理这些异常的代码。\n\
    \n### try 块\n\n如果你在方法内部并抛出异常（或者调用的另一个方法抛出了异常），你可以在那里设置一个特殊块来捕获异常。这被称为 try 块，因为你在那里“尝试”各种方法调用。`try`\
    \ 块是由 `try` 关键字之前的普通范围：\n\n```java\ntry {\n    // 可能产生异常的代码\n}\n```\n\n如果你在不支持异常处理的编程语言中仔细检查错误，你必须在每个方法调用周围设置错误测试代码，即使你多次调用同一个方法。有了异常处理，你将所有内容放在\
    \ `try` 块中并在地方捕获所有异常。这意味着你的代码更容易编写，因为代码的目标与错误检查不再混乱。\n\n### 异常处理器\n\n当然，抛出的异常必须落地。这个“地方”就是异常处理器，对于你想捕获的每种异常类型都有一个。异常处理器紧随\
    \ try 块之后，并用 `catch` 关键字标记：\n\n```java\ntry {\n    // 可能产生异常的代码\n} catch(Type1\
    \ id1) {\n    // 处理 Type1 异常\n} catch(Type2 id2) {\n    // 处理 Type2 异常\n} catch(Type3\
    \ id3) {\n    // 处理 Type3 异常\n}\n```\n\n每个 `catch` 子句（异常处理器）就像一个接受特定类型唯一参数的小方法。标识符（`id1`、`id2`\
    \ 等）可以在处理器内部使用，就像方法参数一样。有时你永远不用标识符，因为异常类型提供了足够的信息来处理异常，但标识符仍然必须在那里。处理器必须出现在 try\
    \ 块之后。如果抛出了异常，异常处理机制会寻找与类型匹配的第一个处理器。然后进入该 `catch` 子句，异常被认为已处理。只有匹配的 `catch` 子句执行；它不像\
    \ `switch` 语句在每个 case 后都需要 `break`。\n\n### 终止与恢复\n\n异常处理理论中有两种基本模型。Java 支持“终止”，即你假设错误是致命的，无法回到异常发生的地方。抛出异常的人认为没有办法挽救局面，他们不想回来。另一种被称为“恢复”（resumption）。这意味着异常处理器应该做事情来纠正局面，然后第二次重试故障方法。如果你想要恢复，意味着你仍然希望在异常处理后继续执行。如果你在\
    \ Java 中想要类似恢复的行为，遇到错误时不要抛出异常。相反，调用修复问题的方法。或者，将你的 `try` 块放在 `while` 循环中，不断重新进入\
    \ `try` 块，直到结果令人满意。\n\n从历史上看，支持异常处理的操作系统的程序员最终使用了类似终止的代码并跳过了恢复。因此，尽管恢复听起来很有吸引力，但在实践中并不实用。主要原因可能是由此导致的耦合：恢复处理器需要意识到异常是在哪里抛出的，并包含特定于位置的非通用代码。这使得代码难以编写和维护，特别是对于可以从许多点产生异常的大系统。\n\
    \n### 捕获任何异常\n\n创建一个捕获任何类型异常的处理器。你通过捕获基类异常 `Exception` 来实现（还有其他类型的基异常，但 `Exception`\
    \ 是与所有编程活动相关的基类）：\n\n```java\ncatch(Exception e) {\n    System.out.println(\"\
    Caught an exception\");\n}\n```\n\n这将捕获任何异常，所以如果你使用它，你会希望把它放在处理器列表的末尾，以避免覆盖可能后续的异常处理器。\n\
    \n由于 `Exception` 类是所有重要异常类的基类，你并没有获得关于异常的具体信息，但你可以调用其基类型 Throwable 的方法：\n\n- `String\
    \ getMessage()`\n- `String getLocalizedMessage()`：获取详细消息，或针对特定本地化调整的消息。\n- `String\
    \ toString()`：返回 `Throwable` 的短描述，包括详细消息。\n- `void printStackTrace()`\n- `void\
    \ printStackTrace(PrintStream)`\n- `void printStackTrace(java.io.PrintWriter)`：打印\
    \ `Throwable` 堆栈跟踪。调用栈显示了带你到达异常抛点的调用序列。第一个版本打印到标准错误，第二个版本打印到你选择的流（在 I/O 章中你会理解为什么有两种类型的流）。\n\
    `Throwable fillInStackTrace()`：在该 `Throwable` 对象记录当前栈帧的信息。当应用程序重新抛出错误或异常时有用（稍后会详细介绍）。\n\
    \n此外，你还从 `Throwable` 的基类型 `Object`（每个人的基类型）获得其他方法。对于异常来说可能有用的是 `getClass()`，它返回一个表示该对象的类。你可以反过来查询此\
    \ `Class` 对象通过 `getName()` 获取其名称，它包含包信息，或通过 `getSimpleName()` 获取单独的类名。\n\n这是一个显示基本\
    \ `Exception` 方法使用的示例：\n\n```java\npublic class ExceptionMethods {\n    public\
    \ static void main(String[] args) {\n        try {\n            throw new Exception(\"\
    My Exception\");\n        } catch(Exception e) {\n            print(\"Caught Exception\"\
    );\n            print(\"getMessage():\" + e.getMessage());\n            print(\"\
    getLocalizedMessage():\" + e.getLocalizedMessage());\n        }\n    }\n}\n```\n\
    *(注：此处代码中的 `print` 方法应为 `System.out.println`)*\n\n"
- fmt: "\n# Characteristics of Algorithms\n\n1. `Inputs and outputs` should be defined\
    \ precisely.\n2. Each step in `algorithm` should be clear and unambiguous.\n3.\
    \ `Algorithm` should be most effective among many different ways to solve a problem.\n\
    4. An `algorithm` shouldn't have computer code. Instead, the `algorithm` should\
    \ be written in such a way that it can be used in similar programming languages.\n\
    \n# Examples of Algorithms In Programming\n\n### Write an algorithm to add two\
    \ numbers entered by user.\n- Step 1: Start\n- Step 2: Declare variables `num1`,\
    \ `num2` and `sum`.\n- Step 3: Read values `num1` and `num2`.\n- Step 4: Add `num1`\
    \ and `num2` and assign the result to `sum`.\n`sum←num1+num2`\n- Step 5: Display\
    \ `sum`\n- Step 6: Stop\n\n### Write an algorithm to find the largest among three\
    \ different numbers entered by user.\n- Step 1: Start\n- Step 2: Declare variables\
    \ `a`, `b` and `c`.\n- Step 3: Read variables `a`, `b` and `c`.\n- Step 4: If\
    \ `a>b`\n    - If `a>c`\n        - Display `a` is the largest number.\n    - Else\n\
    \        - Display `c` is the largest number.\n-- Else\n    - If `b>c`\n     \
    \   - Display `b` is the largest number.\n    - Else\n        - Display `c` is\
    \ the greatest number.\n- Step 5: Stop\n\n### Write an algorithm to find all roots\
    \ of a quadratic equation `ax2+bx+c=0`.\n- Step 1: Start\n- Step 2: Declare variables\
    \ `a`, `b`, `c`, `D`, `x1`, `x2`, `rp` and `ip`;\n- Step 3: Calculate discriminant\n\
    \  `D←b2-4ac`\n- Step 4: If `D≥0`\n    - `r1←(-b+√D)/2a`\n    - `r2←(-b-√D)/2a`\n\
    \    - Display `r1` and `r2` as roots.\n- Else\n    - Calculate real part and\
    \ imaginary part\n    - `rp←b/2a`\n    - `ip←√(-D)/2a`\n    - Display `rp+j(ip)`\
    \ and `rp-j(ip)` as roots.\n- Step 5: Stop\n\n### Write an algorithm to find the\
    \ factorial of a number entered by user.\n- Step 1: Start\n- Step 2: Declare variables\
    \ `n`, `factorial` and `i`.\n- Step 3: Initialize variables\n  `factorial←1`\n\
    \  `i←1`\n- Step 4: Read value of `n`\n- Step 5: Repeat the steps until `i=n`\n\
    \    - 5.1: `factorial←factorial*i`\n    - 5.2: `i←i+1`\n- Step 6: Display `factorial`\n\
    - Step 7: Stop\n\n### Write an algorithm to check whether a number entered by\
    \ user is prime or not.\n- Step 1: Start\n- Step 2: Declare variables `n`, `i`,\
    \ `flag`.\n- Step 3: Initialize variables\n  `flag←1`\n  `i←2`\n- Step 4: Read\
    \ `n` from user.\n- Step 5: Repeat the steps until `i<(n/2)`\n    - 5.1 If remainder\
    \ of `n÷i` equals 0\n        - `flag←0`\n        - Go to step 6\n    - 5.2 `i←i+1`\n\
    - Step 6: If `flag=0`\n    - Display `n` is not prime\n- else\n    - Display `n`\
    \ is prime\n- Step 7: Stop\n\n### Write an algorithm to find the Fibonacci series\
    \ till `term≤1000`.\n- Step 1: Start\n- Step 2: Declare variables `term` and `secondterm`.\n\
    - Step 3: Initialize variables `term←0` `secondterm←1`\n- Step 4: Display `term`\
    \ and `secondterm`\n- Step 5: Repeat the steps until `secondterm≤1000`\n    -\
    \ 5.1: `term←secondterm`\n    - 5.2: `secondterm←secondterm+1`\n    - 5.3: `temp←term`\n\
    \    - 5.4: Display `term`\n- Step 6: Stop\n\n# What kinds of problems are solved\
    \ by algorithms?\n\nSorting by no means the only computational problem for which\
    \ algorithms have been developed. Practical applications of algorithms are ubiquitous\
    \ and include the following examples:\n\n1. The Human Genome Project has made\
    \ great progress toward the goals of identifying all 100,000 genes in human DNA,\
    \ determining the sequences of 3 billion base pairs that make up human DNA, storing\
    \ this information in databases, and developing tools for data analysis. Each\
    \ of these steps requires sophisticated algorithms. Although the solutions to\
    \ the various problems are beyond the scope of this book, many methods to solve\
    \ these biological problems use ideas from several of the chapters in this book,\
    \ thereby enabling scientists to accomplish tasks while using resources efficiently.\
    \ The savings are in time, both human and machine, and in money.\n\n2. The Internet\
    \ enables people all around the world to quickly access and retrieve large amounts\
    \ of information. With the aid of clever algorithms, sites on the Internet are\
    \ able to manage and manipulate this large volume of data. Examples of problems\
    \ that make essential use of algorithms include finding good routes on which the\
    \ data will travel, and using a search engine to quickly find pages on which particular\
    \ information resides.\n\n3. Electronic commerce enables goods and services to\
    \ be negotiated and exchanged electronically, and it depends on the privacy of\
    \ personal information such as credit card numbers, passwords, and bank statements.\
    \ The core technologies used in electronic commerce include public-key cryptography\
    \ and digital signatures, which are based on numerical algorithms and number theory.\n\
    \n4. Manufacturing and other commercial enterprises often need to allocate scarce\
    \ resources in the most beneficial way. An oil company may wish to know where\
    \ to place its wells in order to maximize its expected profit. A political candidate\
    \ may want to determine where to spend money buying campaign advertising in order\
    \ to maximize the chances of winning an election. An airline may wish to assign\
    \ crews to flights in the least expensive way possible, making sure that each\
    \ flight is covered and that government regulations regarding crew scheduling\
    \ are met. An Internet service provider may wish to determine where to place additional\
    \ resources in order to serve its customers more effectively. All of these are\
    \ examples of problems that can be solved using linear programming.\n"
