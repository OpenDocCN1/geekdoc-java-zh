- fmt: "\n# CHAPTER 6 | FUNCTIONS AND OPERATORS\n\n## What Are Functions?\n\nFunctions,\
    \ sometimes called methods, contain statements which can process data. The statements\
    \ can or cannot process data. Methods can be accessed by other statements. This\
    \ action is referred to as calling a function or making a function call.\n\nFunctions\
    \ may look different in different programming languages, but the way they work\
    \ is mostly the same. The usual pattern is taking in data and using logic to manipulate\
    \ that data. Functions may also be referred to by other names, for example, methods.\
    \ The major differences come from the different ways the languages use syntax.\
    \ Syntax is basically the use of spaces or tabs, operators, or keywords.\n\nIn\
    \ the end, all you’re doing is telling the compiler how to convert your instructions\
    \ into computer-interpreted commands. Variables and functions make up the bulk\
    \ of programming. Any bit of data you want to remember is stored in a variable.\
    \ Variables are manipulated by your functions. In general, when you group variables\
    \ and functions together in one place, you call that a class.\n\nExample:\n```java\n\
    public void PrintNum (){System.out.println (anotherNum);}\n```\n\nWhen writing\
    \ a new function, it’s good practice to fill in the entirety of the function’s\
    \ layout before continuing on to another task. This puts the compiler at ease;\
    \ leaving a function in the form `void MyFunction` and then moving on to another\
    \ function leaves the compiler confused as to what you’re planning on doing. The\
    \ integrated development environment, in this case `MonoDevelop`, is constantly\
    \ reading and interpreting what you are writing, somewhat like a spell checker\
    \ in a word processor. When it comes across a statement that has no conclusive\
    \ form, like a variable, function, or class definition, its interpretation of\
    \ the code you’re writing will raise a warning or an error. `MonoDevelop` might\
    \ seem a bit fussy, but it’s doing its best to help.\n\n## Writing a Function\n\
    \nA function consists of a declaration and a body. Some programmers like to call\
    \ these methods, but semantics aside, a function is basically a container for\
    \ a collection of statements.\n\nLet’s continue with the example:\n```java\nvoid\
    \ MyFunction (){}\n```\n\nHere is a basic function called `MyFunction`. We can\
    \ add in additional keywords to modify the function’s visibility. One common modifier\
    \ we’ll be seeing is `public`.\n\n```java\npublic void MyFunction (){}\n```\n\n\
    The `public` keyword needs to appear before the return type of the function. In\
    \ this case, it’s `void`, which means that the function doesn’t return anything.\
    \ but functions can act as a value in a few different ways. For reference, a function\
    \ that returns an `int` would look like this. A return statement of some kind\
    \ must always be present in a function that has a return type.\n\n```java\npublic\
    \ int MyFunction (){return 1;}\n```\n\nThe `public` modifier isn’t always necessary,\
    \ unless you need to make this function available to other classes. If this point\
    \ doesn’t make sense, it will soon. The last part of the function that is always\
    \ required is the parameter list. It’s valid to leave it empty, but to get a feeling\
    \ for what an `arg`, or argument in the parameter list, looks like, move on to\
    \ the next example.\n\n```java\npublic void MyFunction (int i){}\n```\n\nFor the\
    \ moment, we’ll hold off on using the parameter list, but it’s important to know\
    \ what you’re looking at later on so it doesn’t come as a surprise. Parameter\
    \ lists are used to pass information from outside of the function to the inside\
    \ of the function. This is how classes are able to send information from one to\
    \ another. Function declaration is similar to class declaration. Functions are\
    \ the meat of where logic is done to handle variables.\n\n## Function Scope\n\n\
    Variables often live an ephemeral life. Some variables exist only over a few lines\
    \ of code. Variables may come into existence only for the moment a function starts\
    \ and then disappear when the function is done. Variables in the class exist for\
    \ long as the class exists. The life of the variable depends on where it’s created.\n\
    \nExample:\n```java\npublic class Class {\n  int Class;\n  void first() {\n  \
    \  int first;\n  }\n  void second() {\n    int second;\n  }\n}\n```\n\nIf we look\
    \ at above we can visualize how scope is divided. outer box represents who can\
    \ see `Class`. Within `first()` function we have `first` that only exists within\
    \ `first`. Likewise, `second()` can see `Class` and `second` but not `first`.\n\
    \n## Parameter Lists\n\nWhen a function is called, its identifier followed by\
    \ its parameter list is added to code. Parameters are like little slots on the\
    \ front door of a house. There might be a slot for integers, floats, and arrays.\
    \ Each slot on the door, or argument in the parameter list, is a type followed\
    \ by an identifier.\n\nIf we look at a basic example, we’ll see how this works:\n\
    ```java\npublic class Example {\n  int a = 0;\n  void SetA (int i) {\n    a =\
    \ i;\n  }\n}\n```\n\n`SetA (int i)` takes in one parameter of type `int`. This\
    \ is a simple example of a value parameter; there are other types of parameters\
    \ which we’ll go into. The value parameter declares the type and an identifier\
    \ whose scope is limited to the contents of the function it’s declared with. When\
    \ you run the above program and give `3` to the parameter of the function `SetA(3)`\
    \ you’ll see a 0 followed by a 3. We can do this any number of times, and each\
    \ time we’re allowed to change what value we set to. Of course, it’s easier to\
    \ use `a = 3` in the class, but then we wouldn’t learning anything.\n\n## Side\
    \ Effects\n\nWhen a function directly sets a variable in the class the function\
    \ lives in, programmers like to call this a side effect. Side effects are usually\
    \ things that programmers try to avoid, but it’s not always practical. Writing\
    \ functions with side effects tend to prevent the function from being useful in\
    \ other classes. We’ll find other systems that allow us to avoid using side effects,\
    \ but in some cases, it’s necessary.\n\n```java\nclass MySideEffect {\n  int a\
    \ = 0;\n  void SetA () {\n    a = 5;\n  }\n}\n```\n\nThe above `SetA()` function\
    \ sets `int a` to 5. The function does have a clear purpose, setting `a`, but\
    \ there’s nothing in the function that indicates where the variable it’s setting\
    \ lives. If the variable lived in another class which `MySideEffect` inherited\
    \ from, then you wouldn’t even see the variable in this class. Once the complexity\
    \ in a class grows, where and when a variable gets changed or read becomes more\
    \ obscure. If a function remains self-contained, testing and fixing that function\
    \ becomes far easier. Reading what a function does should not involve jumping\
    \ around to find what variable it’s making changes to. This brings us back to\
    \ the topic of scope. Limiting the scope or reach of a function helps limit the\
    \ number of places where things can go wrong.\n\n```java\nclass MySideEffect {\n\
    \  int a = 0;\n  void SetA () {\n    a = 5;\n  }\n  void SetAgain () {\n    a\
    \ = 10;\n  }\n}\n```\n\nThe more functions that have a side effect, the more strange\
    \ behaviors might occur. If `Main()` function is expecting one value but gets\
    \ something entirely, you can start to get unexpected behaviors. Worse yet, if\
    \ `SetAgain()` is called from another class and you were expecting `a` to be 5,\
    \ you’re going to run into more strange behaviors.\n\n## Multiple Arguments\n\n\
    There aren’t any limits to the number of parameters that a function can accept.\
    \ Some languages limit you to no more than 16 arguments, which seems acceptable.\
    \ If your logic requires more than 16 parameters, it’s probably going to be easier\
    \ to separate your function into different parts. However, if we’re going to be\
    \ doing something simple, we might want to use more than one parameter anyway.\n\
    \n```java\nint a = 0;\nvoid SetA (int i, int j) {\n  a = i * j;\n}\n```\n\nWe\
    \ can add a second parameter to `SetA`. A comma token tells the function to accept\
    \ another variable in the parameter list. For this example, we’re using two `ints`\
    \ to multiply against one another and assign a value to `a`. There isn’t anything\
    \ limiting the types we’re allowed to use in the parameter list.\n\n```java\n\
    int a = 0;\nfloat b = 0;\nvoid SetA (int i, float j) {\n  a = i;\n  b = j;\n}\n\
    ```\n\nThe function with multiple parameters can do more. Value parameters are\
    \ helpful ways to get data into a function to accomplish some sort of simple task.\n\
    \n## Code Blocks\n\nBlocks are collections of statements grouped together when\
    \ they’re evaluated. This evaluation of code is usually controlled by an opening\
    \ and closing curly brace. Java programmers often use tabs to indent different\
    \ blocks. This makes different blocks more readable. Some languages like python\
    \ rely on the tabs to indicate separate blocks. Getting used to how tabs are used\
    \ is essential for writing readable code. Next, we’ll use a logic statement followed\
    \ by a block. The block for this statement is indented to the right to indicate\
    \ it’s confined within.\n\n```java\nif (true) {\n  // code goes here\n}\n```\n\
    \nPoorly indented curly braces make for confusing code; the above code is still\
    \ valid, but it’s less readable compared to the previous version. Most code-editing\
    \ tools will automatically add the proper number of indents for you. It’s something\
    \ you’ll have to get to when writing your own code.\n\n```java\nint i = 7;\nint\
    \ j = 13;\nif (i < 13) {\n  int j = 7;\n}\n```\n\nBy adding in some space we can\
    \ make if statement more visible. Adding space around our blocks is important\
    \ to maintain readability. There are also blocks of code that can live within\
    \ another. In general it’s all related to the same block. Blocks inside a block\
    \ are called nested blocks.\n\n```java\nif (true) {\n  // all of the code\n  if\
    \ (true) {\n    // another block of code\n    // living inside a bigger\n    //\
    \ more code here\n  }\n}\n```\n\n# Logic and Operators\n\nLogic allows you to\
    \ control what part of a function is evaluated based on changes to variables.\
    \ Using logic, you'll be able to change which statements in your code will run.\
    \ Simply put, everything you write must cover each situation you plan to cover.\
    \ Logic is controlled through a few simple systems, primarily the `if` keyword\
    \ and variations of `if`.\n\n### Booleans\n\nIn Java booleans, or bools for short,\
    \ are either true or false. It’s easiest to think of these as switches either\
    \ in on or off position. To declare a `var` as a bool, you use something like\
    \ the following.\n\n```java\npublic class Example {\n  public bool SomeBool;\n\
    }\n```\n\n### Equality Operators\n\nEquality operators create boolean conditions.\
    \ There are many ways to set a boolean variable. For instance, comparisons between\
    \ values are a useful means to set variables. The basic method to determine equality\
    \ is using the following operator: `==`. There’s a difference between use of a\
    \ single and a double equals symbol. `=` is used to assign a value whereas `==`\
    \ is used to compare values.\n\nWhen you need to compare two values you can use\
    \ the following concept. You’ll need to remember that these operators are called\
    \ equality operators, if you need to talk to a programmer. The syntax here may\
    \ look a bit confusing at first, but there are ways around that.\n\n```java\n\
    void Func () {\n  SomeBool = (1 == 1);\n}\n```\n\nThere are other operators to\
    \ be aware of. You will be introduced to the other logical operators later in\
    \ the chapter. In this case, we are asking if two number values are the same.\
    \ To make this a more clear, we can break out the code into more lines. Now, we’re\
    \ looking at `a` versus `b`. Clearly, they don’t look the same; they are different\
    \ letters after all. However, they do contain the same integer value, and that’s\
    \ what’s really being compared here.\n\n```java\nvoid Func () {\n  int a = 1;\n\
    \  int b = 1;\n  SomeBool = (a == b);\n}\n```\n\nEvaluation have a left and a\
    \ right side. The single equal to operator (`=`) separates the different sides.\
    \ The left side of the `=` is calculated and looks to the value to the right to\
    \ get its assignment. Because `1 == 1`, that is to say, 1 is equivalent to 1,\
    \ the final result of the statement is that `SomeBool` is true.\n\n### Relational\
    \ Operators\n\nBool values can also be set by comparing values. The operators\
    \ used to compare two different values are called relational operators. We use\
    \ `==`, the is equal symbol, to check if values are the same; we can also use\
    \ `!=`, or not equal, to check if variables are different. This works similarly\
    \ to `!` in the previous section. Programmers often check if one value is greater\
    \ or lesser than another. They do this by using `>`, greater than, and `<`, less\
    \ than. We can also use `>=`, greater or equal to, and `<=` less than equal to.\n\
    \n```java\npublic class Test {\n  public static void main(String args[]) {\n \
    \   int a = 10;\n    int b = 20;\n    System.out.println(\"a == b = \" + (a ==\
    \ b) );\n    System.out.println(\"a != b = \" + (a != b) );\n    System.out.println(\"\
    a > b = \" + (a > b) );\n    System.out.println(\"a < b = \" + (a < b) );\n  \
    \  System.out.println(\"b >= a = \" + (a >= b) );\n    System.out.println(\"b\
    \ <= a = \" + (b <= a) );\n  }\n}\n```\n\nOutput:\na == b = false\na != b = true\n\
    a > b = false\na < b = true\nb >= a = true\nb <= a = false\n\n# CHAPTER 7 | CONTROLING\
    \ EXECUTION, LOOPS & ARRAYS\n\n## Controlling Execution\n\nThe control flow statements\
    \ in Java allow you to run or skip blocks of code when special conditions are\
    \ met. The statements inside your source files are generally executed from top\
    \ to bottom, in the order they appear. Control flow statements, however, break\
    \ up the flow of execution by employing decision making, looping, and branching,\
    \ enabling your program.\n\n### True and false\n\nAll conditional statements use\
    \ the truth or falsehood of a conditional expression to determine the execution\
    \ path. An example of a conditional expression is `a == b`. This uses the conditional\
    \ operator `==` to see if the value of `a` is equivalent to the value of `b`.\
    \ The expression returns true or false. Any of the relational operators you’ve\
    \ seen in the previous chapter can be used to produce a conditional statement.\
    \ Note that Java doesn’t allow you to use a number as a Boolean, even though it’s\
    \ allowed in C and C++ (where truth is nonzero and falsehood is zero). If you\
    \ want to use a non-Boolean in a Boolean test, such as `if(a)`, you must first\
    \ convert it to a boolean value by using a conditional expression, such as `if(a\
    \ != 0)`.\n\n### if-else statement\n\nThe `if-else` statement is the most basic\
    \ way to control program flow. The `else` is optional, so you can use `if` in\
    \ two forms:\n\n```java\nif(Boolean-expression) {\n  // statement\n}\nif(Boolean-expression)\
    \ {\n  // statement\n} else {\n  // statement\n}\n```\n\nIf the Boolean expression\
    \ evaluates to true then the block of code inside the `if` statement will be executed.\
    \ If not, the first set of code after the end of the `if` statement (after the\
    \ closing curly brace) will be executed. The Boolean-expression must produce a\
    \ boolean result. The statement is either a simple statement terminated by a semicolon,\
    \ or a compound statement, which is a group of simple statements enclosed in braces.\
    \ Whenever the word “statement” is used, it always implies that the statement\
    \ can be simple or compound.\n\nHere is an example for the `if-else` statement:\n\
    \n```java\npublic class Test {\n  public static void main(String args[]) {\n \
    \   int x = 10;\n    if( x < 20 ) {\n      System.out.print(\"This is if statement\"\
    );\n    }\n  }\n}\n```\n\nThis will produce the following result:\nOutput:This\
    \ is if statement.\n\n### Switch case Statement\n\nThe switch is sometimes called\
    \ a selection statement. The switch statement selects from among pieces of code\
    \ based on the value of an integral expression. A `switch` statement allows a\
    \ variable to be tested for equality against a list of values. Each value is called\
    \ a `case`, and the variable being switched on is checked for each case. Its general\
    \ form is:\n\n```java\nswitch(integral-selector) {\n  case integral-value1 : statement;\
    \ break;\n  case integral-value2 : statement; break;\n  case integral-value3 :\
    \ statement; break;\n  case integral-value4 : statement; break;\n  case integral-value5\
    \ : statement; break;\n  // ...\n  default: statement;\n}\n```\n\n`integral-selector`\
    \ is an expression that produces an integral value. The switch compares the result\
    \ of `integral-selector` to each `integral-value`. If it finds a match, the corresponding\
    \ statement (a single statement or multiple statements; braces are not required)\
    \ executes. If no match occurs, the `default` statement executes. You will notice\
    \ in the preceding definition that each `case` ends with a `break`, which causes\
    \ execution to jump to the end of the switch body. This is the conventional way\
    \ to build a switch statement, but the `break` is optional. If it is missing,\
    \ the code for the following `case` executes until a `break` is encountered. Java\
    \ SE’s new enum feature helps this restriction, as enums are designed to work\
    \ nicely with `switch`.\n\nExample:\n```java\npublic class Test {\n  public static\
    \ void main(String args[]) {\n    // grade = args[0].charAt(0);\n    char grade\
    \ = 'C';\n    switch(grade) {\n      case 'A' :\n        System.out.println(\"\
    Excellent!\");\n        break;\n      case 'B' :\n      case 'C' :\n        System.out.println(\"\
    Well done\");\n        break;\n      case 'D' :\n        System.out.println(\"\
    You passed\");\n        break;\n      case 'F' :\n        System.out.println(\"\
    Better try again\");\n        break;\n      default :\n        System.out.println(\"\
    Invalid grade\");\n    }\n    System.out.println(\"Your grade is \" + grade);\n\
    \  }\n}\n```\n\nThis will produce the following result:\nOutput:Well done\nYour\
    \ grade is C\n\n## Loop\n\nThere may be a situation when you need to execute a\
    \ block of code several number of times. In general, statements are executed sequentially:\
    \ The first statement in a function is executed first, followed by the second,\
    \ and so on. Programming languages provide various control structures that allow\
    \ for more complicated execution paths. A `loop` statement allows us to execute\
    \ a statement or group of statements multiple times.\n\n### While loop\n\nIf we\
    \ want to run a specific statement more than once in a loop, we need another method.\
    \ To do this, java comes with another couple of keywords, `while` and `for`. The\
    \ `while` statement is somewhat easier to use. It needs only one `bool` argument\
    \ to determine if it should continue to execute. This statement is somewhat like\
    \ the `if` statement, only that it returns to the top of the `while` statement\
    \ when it’s done with its evaluations.\n\nThe syntax of a `while` loop is:\n```java\n\
    while(Boolean_expression) {\n  // Statements\n}\n```\n\nHere, `statement(s)` may\
    \ be a single statement or a block of statements. The `condition` may be any expression,\
    \ and `true` is any non zero value. When executing, if the `boolean_expression`\
    \ result is true, then the actions inside the loop will be executed. This will\
    \ continue as long as the expression result is true. When the condition becomes\
    \ false, program control passes to the line immediately following the loop.\n\n\
    Example:\n```java\npublic class Test {\n  public static void main(String args[])\
    \ {\n    int x = 10;\n    while( x < 20 ) {\n      System.out.print(\"value of\
    \ x : \" + x );\n      x++;\n      System.out.print(\"\\n\");\n    }\n  }\n}\n\
    ```\n\nThis will produce the following result:\nOutput:\nvalue of x : 10\nvalue\
    \ of x : 11\nvalue of x : 12\nvalue of x : 13\nvalue of x : 14\nvalue of x : 15\n\
    value of x : 16\nvalue of x : 17\nvalue of x : 18\nvalue of x : 19\n\n### For\
    \ Loop\n\nTo gain a bit more control over the execution of a loop, we have another\
    \ option. The `for` loop requires three different statements to operate. The first\
    \ statement is called an initialization, the second is a condition, and the third\
    \ is an operation.\n\nSyntax:\n```java\nfor(initialization; Boolean_expression;\
    \ update) {\n  // Statements\n}\n```\n"
