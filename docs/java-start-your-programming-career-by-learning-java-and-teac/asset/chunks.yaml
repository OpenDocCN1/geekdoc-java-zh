- fmt: "\n# 13.4 Four Secrets of Great Programmers. 355\n# 13.5 Difference between\
    \ a programmers, a good Programmer and a great programmer. . 357\n# 14) [Programming\
    \ Quotes](#part0257.xhtml)! 358\n\n# CHAPTER 1 | INTRODUCTION\n\n## What This\
    \ Book is about?\nThis book was written as an answer for anyone to pick up a programming\
    \ language and be productive. You will be able to start from scratch without having\
    \ any previous exposure to any programming language. By the end of this book,\
    \ you will have the skills to be a capable programmer, or at least know what is\
    \ involved with how to read and write code. Afterward you should be armed with\
    \ the knowledge required to feel confident in learning more. You should have general\
    \ computer skills before you get started. After this you’ll know what it takes\
    \ to at least look at code without your head spinning.\n\n## Why Read This Book?\n\
    You could go online and find videos and tutorials to learn; however, there is\
    \ a distinct disadvantage when it comes to learning things in order and in one\
    \ place. Most YouTube or tutorial websites either gloss over a topic or dwell\
    \ at a turtle’s pace for an hour on a particular subject. Online content is often\
    \ brief and doesn’t go into much depth on any given topic. It is incomplete or\
    \ still a work in progress. You’ll often find yourself waiting weeks for another\
    \ video or tutorial to come out.\n\nMost online tutorials for Java are scattered,\
    \ disordered, and in cohesive. It is difficult to find a good starting point and\
    \ even more difficult to find a continuous list of tutorials to bring you to any\
    \ clear understanding of the Java programming language. Just so you know, you\
    \ should find the act of learning exciting. If not, then you’ll have a hard time\
    \ continuing through to the end of this book. To learn any new skill, a lot of\
    \ patience is required. I remember asking an expert programmer how I’d learn to\
    \ program. He told me to write a compiler. At that time, it seemed rather mean,\
    \ but now I understand why he said that. It is like telling someone who wants\
    \ to learn how to drive Formula 1 cars to go compete in a race. In both cases,\
    \ the “learn” part was left out of the process of learning. It is very difficult\
    \ to tell someone who wants to learn to write code where to begin.\n\nHowever,\
    \ it all really does start with your preparedness to learn. Your motivation must\
    \ extend beyond the content of this book. You may also have some preconceived\
    \ notions about what a programming is. I can’t change that, but you should be\
    \ willing to change your thoughts on the topic if you make discoveries contrary\
    \ to your knowledge. Keep an open mind.\n\nComputer artists often believe that\
    \ programming is a technical subject that is incompatible with art. I find the\
    \ contrary to be true. Programming is an art, much as literature and design is\
    \ an art. Programming just has a lot of obscure rules that need to be understood\
    \ for anything to work.\n\n## Do I Need to Know Math?\nWith complex rules in mind,\
    \ does programming require the knowledge of complex mathematics? Actually, unless\
    \ you program mathematical software, only a bit of geometry is nice to have. Most\
    \ of the examples here use only a tiny bit of math to accomplish their purposes.\
    \ Mathematics and programming do overlap quite a lot in their methodology. Math\
    \ taught in schools provides a single solution. Programming results tend to behave\
    \ a bit like a math proof, but only the proof isn’t just another bit of math.\
    \ Rather, the proof of your code means that your zombies chase after humans. A\
    \ considerable amount of math required has been done for you by the computer.\
    \ It is just up to you to know what math to use, and then plug in the right variables.\n\
    \n## Programming as a Form of Expression\nThere is a deeper connection between\
    \ words and meaning in programming. This connection is more mechanical, but flexible\
    \ at the same time. In relation to a programming language, programmers like to\
    \ call this “expressiveness.” When you write words in literature, you infer most\
    \ if not all of the meaning. When programming inference isn’t implied, then you’re\
    \ free to define your own meanings for words and invent words freely. \n\nOne\
    \ common merging of art and code appears within a video game. Anytime characters\
    \ can react to each other and react to user interaction, which conveys a greater\
    \ experience. An artist, an animator, or an environment designer should have some\
    \ ability to convey a richer experience to the audience. A character artist can\
    \ show a monster to his or her audience; but to really experience the creature,\
    \ the monster should glare, grunt, and attack in reaction to the audience.\n\n\
    ## Before You Start your Career in Software Development, I Would Highly Recommend\
    \ You to Have this Book before Going into Software Development Area:\n*The Complete\
    \ Software Developer's Career Guide: How to Learn Your Next Programming Language,\
    \ Ace Your Programming Interview, and Land The Coding Job Of Your Dreams* - by\
    \ John Sonmez\n\nChoose Your Store:\n[(USA) Amazon.com](http://amzn.to/2BLi0Gu)[(UK)\
    \ Amazon.co.uk](http://amzn.to/2nwjHB8)[(INDIA) Amazon.in](http://amzn.to/2nrRxY8)[(Germany)\
    \ Amazon.de](http://amzn.to/2e7rq8r)[(France) Amazon.fr](http://amzn.to/2FDZeqa)[(Spain)\
    \ Amazon.es](http://amzn.to/2IrnU2K)[(Italy) Amazon.it](http://amzn.to/2Dwjy6P)[(Canada)\
    \ Amazon.ca](http://amzn.to/2E1zKkV)\n\n## A Brief History of Computer Programming:\
    \ How Programming Came to Be\n### Mechanical Computers:\nThe first programmable\
    \ computer is arguably the Babbage machine built by Charles Babbage in the1820s.\
    \ Being made of tens of thousands of moving parts and weighing several tons, it\
    \ was a gigantic calculator that could display 1-digit number. It was called the\
    \ Difference Engine, and in 1824, Babbage won a gold medal from the British Astronomical\
    \ Society for correcting a set of tables to chart the movement of planets through\
    \ the sky. In1833, a countess named Augusta Lovelace, commonly known as Ada Lovelace,\
    \ met Babbage at a party where she was introduced to the Difference Engine. Several\
    \ years later, it became evident that she understood the machine better than Charles.\
    \ Despite being housewife to the Earl of Lovelace, she wrote several documents\
    \ on the operation of the Difference Engine as well as its upgraded version, the\
    \ Analytical Engine.\n\n### Logic:\n1848, George Boole gave us Boolean logic.\
    \ It would take nearly a century between the Difference Engine and the first general\
    \ computer to make its appearance. Thanks to George, today our computers count\
    \ in binary (1s and 0s), and our software thinks in terms of true or false. In1887,\
    \ Eugene Felt built a computing machine with buttons; thanks to him, our computers\
    \ have keyboards. In1890, a tabulating machine used paper with holes in it representing\
    \ 1s and 0s to record the census. Back then it saved $2 million and 6 years of\
    \ work. In1900, between Nicola Tesla and Alexander Graham Bell, modern computers\
    \ were imminent with the invention of the transistor. In1936, Konrad Zuse made\
    \ Z1, another mechanical computer like of Babbage, but this time used a tape with\
    \ holes in it like the tabulating machine.\n\n### Computer Science:\n1940s, Alan\
    \ Turing, a British scientist, designed and built an encrypted decoder called\
    \ the Bombe that used electromechanical switches for helping the Allied forces\
    \ during World War II. Between the1930s and1950s, Turing informed the computer\
    \ scientists that computers can solve anything calculable, calling this concept\
    \ Turing completeness. John Von Neumann demonstrated with the help of his theory\
    \ that the computer can be built using simple components. Thanks to Tesla and\
    \ Bell, the Z3 was made of electronic parts. It included the first use of logic\
    \ while doing calculations, making it the first Turing-complete. In1954, Gordon\
    \ Teal at Texas Instruments introduced the silicon-based transistor, a key component\
    \ for building solid-state electronics that are used today in every computer.\n\
    \n### Software:\nThe Z3 was programmed using Plankalkül, the first high-level\
    \ programming language, invented by Zuse shortly after he finished the machine.\
    \ In1952, Grace Hopper created the first compiler, software that could translate\
    \ human-readable words into machine operations. For the first time, the programmer\
    \ didn’t need to know how the transistors operated in the hardware to build software\
    \ for the computer to run. This opened computer programming to a whole new audience.\
    \ Between the1950s and the1970s, computers and computer languages were growing\
    \ in terms of complexity and capability. In1958, John McCarthy invented LISP at\
    \ the Massachusetts Institute of Technology (MIT). Object oriented programming\
    \ appeared in Simula 67 in1967. Imperative and procedural programming made its\
    \ appearance in Pascal in 1970.\n\n## Modern Computer Language:\nBell Labs, started\
    \ by Bell in the1920s, hired Dennis Ritchie in1967. In1974, Ritchie published\
    \ the C programming language that has become the most popular programming language.\
    \ In1983, C++ made its appearance as “C with Classes.” James Gosling, Mike Sheridan,\
    \ and Patrick Naughton initiated the Java language project in June 1991. Java\
    \ was originally designed for interactive television, but it was too advanced\
    \ for the digital cable television industry at the time. The language was initially\
    \ called Oak after an oak tree that stood outside Gosling's office. Later the\
    \ project went by the name Green and was finally renamed Java, from Java coffee.\
    \ Gosling designed Java with a C/C++style syntax that system and application programmers\
    \ would find familiar. Sun Microsystems released the first public implementation\
    \ as Java 1.0 in 1995. It promised \"Write Once, Run Anywhere\" (WORA), providing\
    \ no-cost run-times on popular platforms. Fairly secure and featuring configurable\
    \ security, it allowed network- and file-access restrictions. Major web browsers\
    \ soon incorporated the ability to run Java applets within web pages, and Java\
    \ quickly became popular The Java 1.0 compiler was re-written in Java by Arthur\
    \ van Hoff to comply strictly with the Java 1.0 language specification. With the\
    \ advent of Java 2 (released initially as J2SE 1.2 in December 1998–1999), new\
    \ versions had multiple configurations built for different types of platforms.\
    \ J2EE included technologies and APIs for enterprise applications typically run\
    \ in server environments, while J2ME featured APIs optimized for mobile applications.\
    \ The desktop version was renamed J2SE. In 2006, for marketing purposes, Sun renamed\
    \ new Java.\n\n# CHAPTER 2 | GETTING STARTED\n\n## What Is Programming?\nIt’s\
    \ all about writing code. Programming is a process in which we organize data and\
    \ use logic to do something with them. The data are everything a computer can\
    \ store; they can range from numbers to zombie characters in a video game. You\
    \ do this by writing text into files called source code. Source code written into\
    \ files replaces punch cards used by early machines. When data are combined with\
    \ logic and then written into a single file, they’re called a class. Classes are\
    \ also data, and as such can be managed with more logic.\n\n![class](https://4.bp.blogspot.com/-0LaVc78_c2U/WBNMx1x7OdI/AAAAAAAAGQ/dlzw-uNb7PEAZFkRM5Rqx4RqLhMVkyGKCK4B/s1600/class.png)\n\
    \nClasses are used to create objects in the computer’s memory and can be duplicated\
    \ to have a life of their own. Classes are used to build objects. Each piece of\
    \ data within the class becomes a part of that object. Different chunks of data\
    \ inside a class are called class members. Class members can also be chunks of\
    \ logic called functions or methods. For Example, in a game with a horde of zombies,\
    \ each zombie is duplicated or instanced from a zombie class. Each zombie has\
    \ unique values for each attribute or data element in the class. This means hit\
    \ points, and locations are unique for each duplicate object. Objects created\
    \ from a class are called instances. Similar to families, objects can inherit\
    \ properties from one another. The child sometimes called a subclass inherits\
    \ attributes from its parent. For instance, the child created from a zombie may\
    \ inherit the parent’s hunger for brains. To be useful, the child zombie can also\
    \ add new objects and change the objects it inherited from its parent class. As\
    \ a result, now the child zombie might have tentacles that the parent didn’t have.\n"
