  trans: "\n\n*   它必须遍历整个列表吗？里面某个地方会有一个 `n`。\n*   算法的处理时间增长速度是否比数据集的大小增长速度慢？那么里面可能有一个\
    \ `log n`。\n*   是否存在嵌套循环？你可能在看 `n²` 或 `n³`。\n*   访问时间是否与数据集的大小无关（常量？`O(1)`\n\n\
    ### 示例问题\n我有一个随机数组，其中包含从 1 到 100 的数字。其中缺少了一个数字。请编写一个算法来找出这个数字，以及它缺失在哪个位置。\n\n\
    这个问题有很多变体，所有的变体都非常流行。要计算缺失的数字，我们可以简单地将所有现有的数字相加，然后用这个和减去 1 到 100 之间所有数字之和的预期结果。为了做到这一点，我们需要遍历一次列表。在此过程中，我们也可以记录下哪个位置有空格。\n\
    \n```java\npublic void findTheBlank(int[] theNumbers) {\n    int sumOfAllNumbers\
    \ = 0;\n    int sumOfNumbersPresent = 0;\n    int blankSpace = 0;\n    for (int\
    \ i = 0; i < theNumbers.length; i++) {\n        sumOfAllNumbers += i + 1;\n  \
    \      sumOfNumbersPresent += theNumbers[i];\n        if (theNumbers[i] == 0)\
    \ {\n            blankSpace = i;\n        }\n    }\n    System.out.println(\"\
    Missing number = \" + (sumOfAllNumbers - sumOfNumbersPresent) + \" at location\
    \ \" + blankSpace +\" of the array\");\n}\nnew BubbleSort().findTheBlank(new int[]\
    \ {7,6,0,1,3,2,4});\n//数组中位置 2 处缺失数字为 5\n```\n\n这个算法的大 O 复杂度是多少？\n我们的算法遍历了一次列表，所以它是简单的\
    \ `O(n)`。\n\n### 大 O 复杂度图\n![](img/image4891.jpg)\n![](img/image4896.jpg)\n\n\
    ### 数组排序算法复杂度：\n![](img/image4907.jpg)\n\n# 第 11 章 | 数据结构\n\n尽管计算机每秒可以执行数百万次数学计算，但当问题变得巨大且复杂时，性能仍然是一个重要的考虑因素。解决问题快慢的最关键的方面之一是数据在内存中的存储方式。为了说明这一点，考虑去当地图书馆寻找一本关于特定主题的书。你很可能可以使用某种电子参考资料，或者在最坏的情况下，使用卡片分类索引来确定你想要的书的标题和作者。由于书籍通常按类别分类摆放，并在每个类别内按作者姓名排序，那么然后从书架上物理选择你的书籍是一个非常直接且无痛苦的过程。\n\
    \n现在，假设你去图书馆寻找一本特定的书，但迎接你的不是整齐的书架，而是排列在房间两两侧的大大垃圾袋，每个袋子里随意地装满了书，这些书之间可能也可能没有任何关系。找到你需要的书可能需要几个小时甚至几天，这相当于漫漫长的永恒。当数据没有以适用于应用程序的高效格式存储时，软件的运行就是如此。\n\
    \n## 简单数据结构\n最简单的数据结构是原始变量。它们持有单个值，除此之外，用途有限。当需要存储许多相关值时，就会使用数组。假设本文的读者对变量和数组有坚实的理解。\n\
    \n一个稍微困难一点的概念，尽管同样是原始的，是指针。指针不持有实际值，而是持有一个内存地址，理论上该地址包含某些有用的数据。大多数经验丰富的 C++ 程序员对如何使用指针有坚实的理解，并且了解许多注意事项，而初级程序员可能会被更现代的“托管”语言所宠坏，因为这些语言（无论好坏）都会隐式地处理指针。无论如何，只要知道指针“指向”内存中的某处，本身并不存储数据就足够了。\n\
    \n思考指针的一种不那么抽象的方法是根据人类大脑如何记住（或无法记住）某些事情。很多时候，一个优秀的工程师并不一定知道某个公式/常量/方程，但当被问起时，他们可以准确地告诉你检查哪份参考文献。\n\
    \n## 数组\n数组是一种非常简单的数据结构，可以被认为是固定长度的列表。数组由于其简单性而很好用，适用于数据项数量已知（或可以通过程序确定）的情况。假设你需要一段代码来计算几个数字的平均值。\n\
    \n数组是存储单个值的的完美数据结构，因为它们没有特定的顺序，而且所需的计算除了遍历所有值之外，不需要任何特殊处理。数组的另一个大优势是它们可以通过索引进行随机访问。例如，如果你有一个包含教室里座位学生名字列表的数组，每个座位编号为\
    \ 1 到 `n`，那么 `studentName[i]` 就是读取或存储第 `i` 座学生名字的一种简便方法。\n\n数组也可以被认为是一个预先装订的笔记本。它有固定数量的页，每页包含信息，并且位于从不改变的预定义位置。\n\
    \n## 排序技术\n排序是指将数据按照特定格式排列。排序算法规定了以特定顺序排列数据。最常见的顺序是数值顺序或字典顺序。排序的重要性在于，如果数据是排序存储的，数据搜索就可以优化到非常高的水平。排序也用于以易读的格式表示数据。以下是现实生活中排序的一些例子：\n\
    \n*   电话簿：电话簿按姓名存储人们的电话号码，以便搜索。\n*   字典：字典按字母顺序存储单词，以便搜索变得容易。\n\n### 原地排序与非原地排序\n\
    排序算法可能需要额外的空间来进行比较和存储少量元素。这些算法不需要任何额外空间，排序被认为是在原地进行的，例如数组本身。这被称为原地排序。然而，在某些排序算法中，程序所需的空间多于被排序元素。使用相等或更多空间的排序被称为非原地排序。归并排序是非原地排序的示例。\n\
    \n### 稳定排序与不稳定排序\n如果排序算法在处理内容后，没有改变相同内容的出现顺序，则被称为稳定排序。\n![稳定排序](img/image4971.jpg)\n\
    如果排序算法在处理内容后，改变了相同内容的出现顺序，则被称为不稳定排序。\n![不稳定排序](img/image4981.jpg)\n当我们希望保持原始元素的顺序时（例如元组），算法的稳定性很重要。\n\
    \n### 自适应排序与非自适应排序算法\n如果排序算法能够利用待排序列表中已经“排序好”的元素，则它是自适应的。也就是说，在排序时，如果源列表中的某些元素已排序，自适应算法会考虑到这一点，并尝试不重新排列它们。非自适应算法是一种不考虑已排序元素的算法。它们尝试对每个元素都进行重新排列以确认其有序性。\n\
    \n"
- fmt: "\nIn its simplest form, binary search is used to quickly find a value in a\
    \ sorted sequence (consider a sequence an ordinary array for now). We’ll call\
    \ the sought value the `target` value for clarity. Binary search maintains a contiguous\
    \ subsequence of the starting sequence where the target value is surely located.\
    \ This is called the `search space`. The `search space` is initially the entire\
    \ sequence. At each step, the algorithm compares the median value in the search\
    \ space to the target value. Based on the comparison and because the sequence\
    \ is sorted, it can then eliminate half of the search space. By doing this repeatedly,\
    \ it will eventually be left with a search space consisting of a single element,\
    \ the target value.\n\nFor example, consider the following sequence of integers\
    \ sorted in ascending order and say we are looking for the number 55:\n\n| 0 |\
    \ 5 | 13 | 19 | 22 | 41 | 55 | 68 | 72 | 81 | 98 |\n\nWe are interested in the\
    \ location of the target value in the sequence so we will represent the search\
    \ space as indices into the sequence. Initially, the search space contains indices\
    \ 1 through 11. Since the search space is really an interval, it suffices to store\
    \ just two numbers, the `low` and `high` indices. As described above, we now choose\
    \ the median value, which is the value at index 6 (the midpoint between 1 and\
    \ 11): this value is 41 and it is smaller than the target value. From this we\
    \ conclude not only that the element at index 6 is not the target value, but also\
    \ that no element at indices between 1 and 5 can be the target value, because\
    \ all elements at these indices are smaller than 41, which is smaller than the\
    \ target value. This brings the search space down to indices 7 through 11:\n\n\
    | 55 | 68 | 72 | 81 | 98 |\n\nProceeding in a similar fashion, we chop off the\
    \ second half of the search space and are left with:\n\n| 55 | 68 |\n\nDepending\
    \ on how we choose the median of an even number of elements we will either find\
    \ 55 in the next step or chop off 68 to get a search space of only one element.\
    \ Either way, we conclude that the index where the target value is located is\
    \ 7. If the target value was not present in the sequence, binary search would\
    \ empty the search space entirely. This condition is easy to check and handle.\
    \ Here is some code to go with the description:\n\n```\nbinary_search(A, target):\n\
    \  lo = 1, hi = size(A)\n  while lo <= hi:\n      mid = lo + (hi-lo)/2\n     \
    \ if A[mid] == target:\n        return mid\n      else if A[mid] < target:\n \
    \       lo = mid+1\n      else:\n        hi = mid-1\n  // target was not found\n\
    ```\n\nComplexity:\n"
