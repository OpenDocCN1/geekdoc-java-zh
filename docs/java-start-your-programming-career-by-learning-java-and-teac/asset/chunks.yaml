- fmt: "\n# Differentiating the Members\n\nIf a class is inheriting the properties\
    \ of another class, and if the members of the superclass have the names same as\
    \ the subclass, to differentiate these variables we use the `super` keyword as\
    \ shown below.\n\n`super.variable`\n`super.method();`\n\n### Example:\n\n```java\n\
    class Super_class {\n    int num = 20; // display method of superclass \n    public\
    \ void display() {\n        System.out.println(\"This is the display method of\
    \ superclass\");\n    }\n}\n\npublic class Sub_class extends Super_class {\n \
    \   int num = 10; // display method of sub class \n    public void display() {\n\
    \        System.out.println(\"This is the display method of subclass\");\n   \
    \ }\n    public void my_method() {\n        // Instantiating subclass\n      \
    \  Sub_class sub = new Sub_class();\n        // Invoking the display() method\
    \ of sub class\n        sub.display();\n        // Invoking the display() method\
    \ of superclass\n        super.display();\n        // printing the value of variable\
    \ num of subclass\n        System.out.println(\"value of the variable named num\
    \ in sub class:\" + sub.num);\n        // printing the value of variable num of\
    \ superclass\n        System.out.println(\"value of the variable named num in\
    \ super class:\" + super.num);\n    }\n    public static void main(String args[])\
    \ {\n        Sub_class obj = new Sub_class();\n        obj.my_method();\n    }\n\
    }\n```\n\nCompile and execute the above code using the following syntax:\n\n```bash\n\
    javac Super_Demo\njava Super_On\n```\n\nOn executing the program, you will get\
    \ the following result:\n\n### Output\n```\nThis is the display method of subclass\n\
    This is the display method of superclass\nvalue of the variable named num in sub\
    \ class:10\nvalue of the variable named num in super class:20\n```\n\n# Types\
    \ of Inheritance\n\nThere are various types of inheritance as demonstrated below.\n\
    \n![Types of Inheritance](OEBPS/image4253.jpg)\n\nA very important fact to remember\
    \ is that Java does not support multiple inheritance. This means that a class\
    \ cannot extend more than one class. Therefore, the following is illegal:\n\n\
    ### Example:\n```java\npublic class class extends Animal, Mammal{}\n```\n\nHowever,\
    \ a class can implement one or more interfaces, which has helped Java get rid\
    \ of the impossibility of multiple inheritance.\n\n# Interchangeable objects with\
    \ polymorphism\n\nWhen dealing with type hierarchies, you often want to treat\
    \ an object not as the specific type that it is, but instead as its base type.\
    \ This allows you to write code that doesn’t depend on specific types. In the\
    \ shape example, methods manipulate generic shapes, unconcerned about whether\
    \ they’re circles, squares, triangles, or some shape that hasn’t even been defined\
    \ yet. All shapes can be drawn, erased, and moved, so these methods simply send\
    \ a message to a shape object; they don’t worry about how the object copes with\
    \ the message.\n\nSuch code is unaffected by the addition of new types, and adding\
    \ new types is the most common way to extend an object-oriented program to handle\
    \ new situations. For example, you can derive a new subtype of shape called `pentagon`\
    \ without modifying the methods that deal only with generic shapes. This ability\
    \ to easily extend a design by deriving new subtypes is one of the essential ways\
    \ to encapsulate change. This greatly improves designs while reducing the cost\
    \ of software maintenance.\n\nThere’s a problem, however, with attempting to treat\
    \ derived-type objects as their generic base types (circles as shapes, bicycles\
    \ as vehicles, cormorants as birds, etc.). If a method is going to tell a generic\
    \ shape to draw itself, or a generic vehicle to steer, or a generic bird to move,\
    \ the compiler cannot know at compile time precisely what piece of code will be\
    \ executed. That’s the whole point—when the message is sent, the programmer doesn’t\
    \ want to know what piece of code will be executed; the `draw` method can be applied\
    \ equally to a circle, a square, or a triangle, and the object will execute the\
    \ proper code depending on its specific type.\n\nIf you don’t have to know what\
    \ piece of code will be executed, then when you add a new subtype, the code it\
    \ executes can be different without requiring changes to the method that calls\
    \ it. Therefore, the compiler cannot know precisely what piece of code is executed,\
    \ so what does it do?\n\nFor example, in the following diagram, the `BirdController`\
    \ object just works with generic `Bird` objects and does not know what exact type\
    \ they are. This is convenient from `BirdController`’s perspective because it\
    \ doesn’t have to write special code to determine the exact type of `Bird` it’s\
    \ working with or that `Bird`’s behavior. So how does it happen that, when `move()`\
    \ is called while ignoring the specific type of `Bird`, the right behavior will\
    \ occur (a `Goose` walks, flies, or swims, and a `Penguin` walks or swims)?\n\n\
    ![](OEBPS/image4279.jpg)\n\nThe answer is the primary twist in object-oriented\
    \ programming:\n\nThe compiler cannot make a function call in the traditional\
    \ sense. The function call generated by a non-OOP causes what is called early\
    \ binding, a term you may not have heard because you’ve never thought about any\
    \ other way. It means the compiler generates a call to a specific name, and the\
    \ runtime system resolves this call to the absolute address of the code to execute.\
    \ To solve the problem, object-oriented languages use the concept of late binding.\
    \ When you send a message to an object, the code being called isn’t determined\
    \ until run time. The compiler ensures that the method exists and performs type\
    \ checking on the arguments and return value, but doesn’t know the exact code\
    \ to execute. To perform late binding, Java uses a special bit of code in lieu\
    \ of the absolute call. This code calculates the address of the method body, using\
    \ information stored in the object (this process is covered in great detail in\
    \ the Polymorphism chapter). Thus, each object can behave differently according\
    \ to that special bit of code. In some languages you must explicitly state that\
    \ you want a method to have the flexibility of late binding (C++ uses the `virtual`\
    \ keyword to do this). In these languages, by default, methods are not dynamically\
    \ bound. In Java, dynamic binding is the default behavior and you don’t need to\
    \ add any extra keywords to get polymorphism\n\n# CHAPTER 9 | EXCEPTION HANDLING\n\
    \n## Error Handling With Exception\n\nThe ideal time to catch an error is at compile\
    \ time before you even try to run the program. However, not all errors can be\
    \ detected at compile time. The rest of the problems must be handled at run time\
    \ through some formality that allows the originator of the error to pass information\
    \ to a recipient who will know how to handle the difficulty.\n\nThe goal is to\
    \ do so with more confidence that your application doesn’t have an unhandled error.\
    \ Exceptions are not terribly difficult to learn, and are one of those features\
    \ that provide immediate benefits to your project. Because exception handling\
    \ is the only official way that Java reports errors and it is enforced by the\
    \ Java compiler, there are only so many examples that can be written without learning\
    \ about exception handling. This chapter introduces you to the code you need to\
    \ write to properly handle exceptions and shows how you can generate your own\
    \ exceptions if one of your methods gets into trouble.\n\n### Concepts\n\nC and\
    \ other earlier languages had multiple error-handling schemes, and these were\
    \ generally established by convention and not as part of the programming language.\
    \ Typically, you returned a special value or set a flag, and the recipient was\
    \ supposed to look at the value or the flag and determine that something was amiss.\
    \ However, as the years passed, it was discovered that programmers who use libraries\
    \ tend to think of themselves as invincible—as in \"Yes, errors might happen to\
    \ others, but not in my code.\" So they not check for the error conditions (and\
    \ sometimes the error conditions were too silly to check for). If you were thorough\
    \ enough to check for an error every time you called a method, your code could\
    \ turn into an unreadable nightmare. Because programmers could still coax systems\
    \ out of these languages, they were resistant to admitting the truth: that this\
    \ approach to handling errors was a major limitation to creating large, robust,\
    \ maintainable programs.\n\nThe solution is to take the casual nature out of error\
    \ handling and to enforce formality. This actually has a long history; implementations\
    \ of exception handling go back to operating systems in the 1960s and even to\
    \ BASIC’s `on error goto`. But C++ exception handling was based on Ada, and Java’s\
