  trans: "\n\n# Socket 客户端示例\n\n下面的 `GreetingClient` 是一个客户端程序，它使用 socket 连接到服务器并发送问候语，然后等待响应。\n\
    \n### 示例\n// 文件名 `GreetingClient.java`\n```java\nimport java.net.*;\nimport java.io.*;\n\
    public class GreetingClient {\n    public static void main(String[] args) {\n\
    \        String serverName = args[0];\n        int port = Integer.parseInt(args[1]);\n\
    \        try {\n            System.out.println(\"Connecting to \" + serverName\
    \ + \" on port \" + port);\n            Socket client = new Socket(serverName,\
    \ port);\n            System.out.println(\"Just connected to \" + client.getRemoteSocketAddress());\n\
    \            OutputStream outToServer = client.getOutputStream();\n          \
    \  DataOutputStream out = new DataOutputStream(outToServer);\n            out.writeUTF(\"\
    Hello from \" + client.getLocalSocketAddress());\n            InputStream inFromServer\
    \ = client.getInputStream();\n            DataInputStream in = new DataInputStream(inFromServer);\n\
    \            System.out.println(\"Server says \" + in.readUTF());\n          \
    \  client.close();\n        } catch(IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n# Socket 服务端示例\n\n下面的 `GreetingServer` 程序是一个服务器应用程序示例，它使用\
    \ `Socket` 类在命令行参数指定的端口号上监听客户端。\n\n### 示例\n// 文件名 `GreetingServer.java`\n```java\n\
    import java.net.*;\nimport java.io.*;\npublic class GreetingServer extends Thread\
    \ {\n    private ServerSocket serverSocket;\n    public GreetingServer(int port)\
    \ throws IOException {\n        serverSocket = new ServerSocket(port);\n     \
    \   serverSocket.setSoTimeout(10000);\n    }\n    public void run() {\n      \
    \  while(true) {\n            try {\n                System.out.println(\"Waiting\
    \ for client on port \" + serverSocket.getLocalPort() + \"...\");\n          \
    \      Socket server = serverSocket.accept();\n                System.out.println(\"\
    Just connected to \" + server.getRemoteSocketAddress());\n                DataInputStream\
    \ in = new DataInputStream(server.getInputStream());\n                System.out.println(in.readUTF());\n\
    \                DataOutputStream out = new DataOutputStream(server.getOutputStream());\n\
    \                out.writeUTF(\"Thank you for connecting to \" + server.getLocalSocketAddress()\
    \ + \"\\nGoodbye!\");\n                server.close();\n            } catch(SocketTimeoutException\
    \ s) {\n                System.out.println(\"Socket timed out!\");\n         \
    \       break;\n            } catch(IOException e) {\n                e.printStackTrace();\n\
    \                break;\n            }\n        }\n    }\n    public static void\
    \ main(String[] args) {\n        int port = Integer.parseInt(args[0]);\n     \
    \   try {\n            Thread t = new GreetingServer(port);\n            t.start();\n\
    \        } catch(IOException e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n```\n\n编译客户端和服务端，然后如下方式启动服务端：\n```\n$ java GreetingServer 6066\n```\n\
    Waiting for client on port 6066...\n\n按照如下方式检查客户端程序\n输出：\n```\n$ java GreetingClient\
    \ localhost 6066\n```\nConnecting to localhost on port 6066\nJust connected to\
    \ /127.0.0.1:6066\nServer says Thank you for connecting to /127.0.0.1:6066\nGoodbye!\n\
    \n# URL 处理\n\n`URL` 代表统一资源定位符（Uniform Resource Locator），表示广义网上的资源，例如网页或目录。本节将向你展示如何编写与\
    \ `URL` 通信的 Java 程序。`URL` 可以被拆分为若干部分：`protocol://host:port/path?query#ref`。协议的示例包括\
    \ HTTP、HTTPS 和 File。`path` 也称为 `filename`（文件名），`host` 也称为 `authority`（权限）。下面是一个指向网页的\
    \ URL，其协议为 `https://www.amrood.com/index.htm?language=en#j2se`。注意此 URL 未指定端口，在这种情况下将使用协议的默认端口。对于\
    \ HTTP，默认端口是 80。\n\n## URL 类\n\n`java.net.URL` 类表示一个 `URL`，并拥有一套完整的方法在 Java 中操作\
    \ `URL`。`URL` 类有几个用于创建 `URLs` 的构造函数，包括以下几个：\n\n| 序号 | 方法与描述 |\n| :--- | :--- |\n\
    | 1 | `public URL(String protocol, String host, int port, String file) throws\
    \ MalformedURLException` 通过组合给定的部分创建一个 `URL`。 |\n| 2 | `public URL(String protocol,\
    \ String host, String file) throws MalformedURLException` 与上一个构造函数相同，区别在于使用了协议的默认端口。\
    \ |\n| 3 | `public URL(String url) throws MalformedURLException` 从给定的 `String`\
    \ 创建一个 `URL`。 |\n| 4 | `public URL(URL context, String url) throws MalformedURLException`\
    \ 通过共同解析 `URL` 和 `String` 参数创建一个 `URL`。 |\n\n`URL` 类包含许多方法，用于访问所表示的 `URL` 的各个部分。`URL`\
    \ 类中的一些方法包括：\n\n| 序号 | 方法与描述 |\n| :--- | :--- |\n| 1 | `public String getPath()`\
    \ 返回 `URL` 的路径。 |\n| 2 | `public String getQuery()` 返回 `URL` 的查询部分。 |\n| 3 | `public\
    \ String getAuthority()` 返回 `URL` 的权限部分。 |\n| 4 | `public int getPort()` 返回 `URL`\
    \ 的端口。 |\n| 5 | `public int getDefaultPort()` 返回 `URL` 的默认端口。 |\n| 6 | `public\
    \ String getProtocol()` 返回 `URL` 的协议。 |\n| 7 | `public String getHost()` 返回 `URL`\
    \ 的主机名。 |\n| 8 | `public String getFile()` 返回 `URL` 的文件名。 |\n| 9 | `public String\
    \ getRef()` 返回 `URL` 的引用部分。 |\n| 10 | `public URLConnection openConnection() throws\
    \ IOException` 打开到 `URL` 的连接，允许与资源通信。 |\n\n### 示例\n下面的 `URLDemo` 程序演示了 `URL` 的各个部分。`URL`\
    \ 从命令行输入，`URLDemo` 程序输出该 `URL` 的每个部分。\n\n// 文件名 `URLDemo.java`\n```java\nimport\
    \ java.net.*;\nimport java.io.*;\npublic class URLDemo {\n    public static void\
    \ main(String[] args) {\n        try {\n            URL url = new URL(\"https://www.amrood.com/index.htm?language=en#j2se\"\
    );\n            System.out.println(\"URL is \" + url.toString());\n          \
    \  System.out.println(\"protocol is \" + url.getProtocol());\n            System.out.println(\"\
    authority is \" + url.getAuthority());\n            System.out.println(\"file\
    \ name is \" + url.getFile());\n            System.out.println(\"host is \" +\
    \ url.getHost());\n            System.out.println(\"path is \" + url.getPath());\n\
    \            System.out.println(\"port is \" + url.getPort());\n            System.out.println(\"\
    default port is \" + url.getDefaultPort());\n            System.out.println(\"\
    query is \" + url.getQuery());\n            System.out.println(\"ref is \" + url.getRef());\n\
    \        } catch(IOException e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n```\n输出：\n```\nURL is https://www.amrood.com/index.htm?language=en#j2se\n\
    protocol is http\nauthority is www.amrood.com\nfile name is /index.htm?language=en\n\
    host is www.amrood.com\npath is /index.htm\nport is -1\ndefault port is 80\nquery\
    \ is language=en\nref is j2se\n```\n\n## URLConnections 类方法\n\n`openConnection()`\
    \ 方法返回一个 `java.net.URLConnection`，这是一个抽象类，其子类表示各种类型的 URL 连接。例如：\n如果你连接到一个协议为 HTTP\
