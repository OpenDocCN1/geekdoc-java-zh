    falls through to where the break would have taken it anyway. You could put a break
    at the end of the default statement with no harm if you considered it important
    for style’s sake. The switch statement is a clean way to implement multiway selection
    (i.e., selecting from among a number of different execution paths), but it requires
    a selector that evaluates to an integral value, such as int or char. If you want
    to use, for example, a string or a floating point number as a selector, it won’t
    work in a switch statement. For non-integral types, you must use a series of if
    statements. At the end of the next chapter, you’ll see that Java SE5’s new enum
    feature helps ease this restriction, as enums are designed to work nicely with
    switch.Example:public class Test {   public static void main(String args[]) {      //
    char grade = args[0].charAt(0);      char grade = ''C'';      switch(grade) {         case
    ''A'' :System.out.println("Excellent!");            break;         case ''B''
    :         case ''C'' :            System.out.println("Well done");            break;         case
    ''D'' :            System.out.println("You passed");         case ''F'' :            System.out.println("Better
    try again");            break;         default :            System.out.println("Invalid
    grade");      }      System.out.println("Your grade is " + grade);   }}This will
    produce the following result:Output:Well doneYour grade is CLoopThere may be a
    situation when you need to execute a block of code several number of times. In
    general, statements are executed sequentially: The first statement in a function
    is executed first, followed by the second, and so on. Programming languages provide
    various control structures that allow for more complicated execution paths.A loop statement
    allows us to execute a statement or group of statements multiple times and following
    is the general form of a loop statement in most of the programming languages −![Loop
    Architecture](OEBPS/image2885.jpg)Java programming language provides the following
    types of loop to handle looping requirements.While loop:If we want to run a specific
    statement more than once in a loop, we need another method. To do this, java comes
    with another couple of keywords, while and for. The while statement is somewhat
    easier to use. It needs only one bool argument to determine if it should continue
    to execute. This statement is somewhat like the if statement, only that it returns
    to the top of the while statement when it’s done with its evaluations.The syntax
    of a while loop is :while(Boolean_expression) {   // Statements}Here, statement(s) may
    be a single statement or a block of statements. The condition may be any expression,
    and true is any non zero value.When executing, if the boolean_expression result
    is true, then the actions inside the loop will be  executed. This will continue
    as long as the expression result is true.When the condition becomes false, program
    control passes to the line immediately following the loop.Flow Diagram:![Java
    While Loop](OEBPS/image2917.jpg)Here, key point of the while loop is that the
    loop might not ever run. When the expression is tested and the result is false,
    the loop body will be skipped and the first statement after the while loop will
    be executed.Example:public  class  Test  { public  static  void main(String args[])  {      int
    x =  10;      while( x <  20  )  {         System.out.print("value of x : "  +
    x );         x++;         System.out.print("\n");      }   }}This will produce
    the following result:Output:value of x : 10value of x : 11value of x : 12value
    of x : 13value of x : 14value of x : 15value of x : 16value of x : 17value of
    x : 18value of x : 19For Loop:To gain a bit more control over the execution of
    a loop, we have another option. The for loop requires three different statements
    to operate. The first statement is called an initialization, the second is a condition,
    and the third is an operation.Syntax:for(initialization; Boolean_expression; update)
    {   // Statements}Here is the flow of control in a for loop −'
