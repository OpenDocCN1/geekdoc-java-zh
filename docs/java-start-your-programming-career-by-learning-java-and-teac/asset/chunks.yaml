  trans: "\n\n# 第 5 章 | 变量、数据类型与关键字\n\n## 变量\n变量用于存储在计算机程序中被引用和操作的信息。它们还提供了一种为数据赋予描述性名称并标记的方法，以便读者和我们自己能更清晰地理解程序。将变量看作存储信息的容器是有帮助的。它们的唯一目的是是在内存中标记和存储数据。这些数据随后可以在你的整个程序中使用。\n\
    \n变量的名字被称为标识符（identifier）。在大多数情况下，标识符是程序员（在本例中就是你）选择用于为变量命名的唯一单词。标识符总是程序员为了描述变量而发明的某种东西；它就像给新宠物或宝宝命名一样。\n\
    \n### 标识符\n标识符被视为符号或标记（tokens），是你发明并随后赋予其特定含义的单词。标识符可以简单如字母 `i`，也可以复杂如 `@OhHAICanIHasIdentifier01`。`identifier`\
    \ 是用于命名你创建的任何函数、变量或数据类型的单词。当使用关键字 `class` 时，它后面会跟着另一个被称为标识符的单词。在正确识别一个函数或其他数据块后，你现在可以通过它的标识符来引用该数据。换句话说，当你将某些数据命名为\
    \ `Charles` 时，你就通过名称 `Charles` 来访问该数据。\n\n```java\nclass MyNewClassImWriting{}\n\
    ```\n\n变量是通过声明（declarations）创建的。声明被定义为正式的陈述或公告。\n\n程序员写的每一组单词被称为一条语句（statement）。在英语中我们会使用\
    \ sentence 一词，但程序员们喜欢使用自己的词汇。变量的声明语句定义了变量的类型和标识符。\n\n```java\npublic class Example{\n\
    \    int i;\n}\n```\n\n程序员使用分号（`;`）而不是句号来结束语句。因此，如果你想听起来像个程序员，你可以说你正在“写一条语句来声明一个类型为\
    \ `int` 标识符为 `i` 的变量。”或者，如果你想表现得极其戏剧化，你可以宣布：“我宣告了一个类型为 `int` 的新变量，其名为 `i`！”而它将确实如此。\n\
    \n## 变量名\n重要的是要知道变量标识符和类标识符几乎可以是任何内容。在编程时，命名任何事物都有一些规则。这里是一些可以帮助的指南。\n\n- 长的名字更容易出现拼写错误，所以保持标识符简短。\
    \ \n- 变量的命名规范应该考虑以下点：变量名应该指示它的用途，或者至少指示你打算用它做什么。这应该是而易见的，但变量名不应该具有误导性。或者说，如果你使用一个名为\
    \ `radius`（半径）的变量，你不应该把它用作角色的速度。\n- 如果你能读出变量的名字，也会帮助；否则，当你尝试向另一个程序员解释你的代码时可能会遇到问题。\n\
    \n```java\nint someLong_complex_hardToRememberVariableName;\n```\n\n将名字尽可能短但保持足够清晰是有优势的。你的计算机屏幕（以及大多数计算机）单行只能容纳有限的字符。你可以把字体调小，但当字母太小时，你就会遇到可读性问题。考虑以下函数，它需要不止一个变量才能工作。\n\
    \n```java\nSomeCleverFunction(TopLeftCorner – SomeThickness + OffsetFromSomePosition,\
    \ BottomRightCorner – SomeThickness + OffsetFromSomePosition);\n```\n\n上面的代码使用了许多长变量名。由于每个变量的长度，语句占据了多行，使得单个语句更难以阅读。我们可以缩短变量名，但也很容易将其缩短过头。\n\
    \n```java\nCleverFunc(TL–Thk+Ofst,LR–Thk+Ofst);\n```\n\n变量名应该是具有描述性的，这样你就知道要把它们用在哪里了：太短了它们可能会丢失意义。\n\
    \n```java\nint a;\n```\n\n虽然 `a` 简短且容易记忆，但其他人在阅读你的代码时很难知道你用变量 `a` 是做什么的。在与其他程序员合作时，这变得尤为困难。\n\
    \n变量命名并非完全没有规则。\n\n```java\nint 8;\n```\n\n变量名不能是数字。这是糟糕的；数字在编程中有其特殊地位，因为编程中它们有其他用途。IDE\
    \ 会尝试帮助你发现问题。在它发现的任何问题下都会出现红色的波浪线。提到带数字的变量名，你可以数字作为变量名的一部分。\n\n```java\nint varNumber2;\n\
    ```\n\n上面的名字是完全有效的，并且很有用，但相反，考虑以下情况。\n\n```java\nint 13thInt;\n```\n\n变量名不能以任何数字开头。老实说，我不确定为什么这种情况会破坏编译器，但它似乎与为什么单独的数字不能作为变量名有关。\n\
    \n```java\nint $; int this-that; int (^_^);\n```\n\n大多数特殊字符也有其含义，并被留作其他用途。例如，在\
    \ `JAVA` 中，`-` 用于减法；在这种情况下 `JAVA` 可能会认为你正试图从这个中减去那个。你应该记住，关键字也是无效的变量名，因为它们对于 `JAVA`\
    \ 已经具有特殊含义。\n\n在 IDE（集成开发环境）中，你可能会注意到单词 `this` 被高亮了，表示它是一个关键字。变量中间的空格也是无效的。\n\n\
    ```java\nint Spaces are bad;\n```\n\n可能，添加非字母字符会破坏编译器。只有下划线和字母可以用于标识符名称。虽然表情符号作为变量可能很有趣，但在代码其他部分使用时会非常难以阅读。\n\
    \n```java\nint ADifferenceInCase; int adincase;\n```\n\n这两个变量实际上是不同的。像 `java`\
    \ 这样区分大小写的语言会对字符的大小非常敏感；这对于通过名称调用其他任何事物也是如此。考虑这一点：`A` 与 `a` 不同。\n\n作为程序员，你需要考虑变量应该是什么样的。\n\
    \n## 变量类型\n你必须在使用变量之前声明它们。以下是变量声明的基本形式：\n\n`data type variable [ = value][, variable\
    \ [ = value] ...`\n\n这里 `data type` 是 Java 的数据类型之一，`variable` 是变量的名字。要声明指定类型的多个变量，可以使用逗号分隔的列表。\n\
    \n示例：\n```java\nint a, b, c; // 声明了三个 int a, b 和 c。\na = 10, b = 10; // 初始化示例\n\
    byteB = 22; // 初始化字节类型变量 B\ndouble pi = 3.14159; // 声明并赋值双精度浮值 PI\n```\n\nJava\
    \ 编程语言主要定义了三种变量。\n\n"
- fmt: "\n# Instance Variables\n\n# Static Variables\n# Local Variables\n\n## Types\
    \ of Variables\n\n## 1) Instance variables\nInstance variables are variables that\
    \ are declare inside a class but outside any method, constructor or block. Instance\
    \ variable are also variable of object commonly known as field or property. They\
    \ are referred as object variable. Each object has its own copy of each variable\
    \ and thus, it doesn't affect the instance variable if one object changes the\
    \ value of the variable. Instance variables hold values that must be referenced\
    \ by more than one method, constructor or block, or essential parts of an object's\
    \ state that must be present throughout the class. \n\n```java\nclass Student{\n\
    \    String name;\n    int age;\n}\n```\nHere `name` and `age` are instance variable\
    \ of `Student` class.\n\n## 2) Static variables\nStatic are class variables declared\
    \ with `static` keyword. Static variables are initialized only once. Static variables\
    \ are also used in declaring constant along with `final` keyword.\n\n```java\n\
    class Student{\n  String name;\n  int age;\n  static int instituteCode=1101;\n\
    }\n```\nHere `instituteCode` is a static variable. Each object of `Student` class\
    \ will share `instituteCode` property.\n\n**Additional points on static variable:**\n\
    - `static` variable are also known as class variable.\n- `static` means to remain\
    \ constant.\n- In Java, it means that it will be constant for all the instances\
    \ created for that class.\n- `static` variable need not be called from object.\n\
    - It is called by `classname.static variable name`\n\n**Note:** A `static` variable\
    \ can never be defined inside a method i.e. it can never be a local variable.\n\
    \n**Example:** Suppose you make 2 objects of class `Student` and you change the\
    \ value of static variable from one object. Now when you print it from other object,\
    \ it will display the changed value. This is because it was declared static i.e.\
    \ it is constant for every object created.\n\n```java\nclass Student{\n    int\
    \ a;\n    static int id = 35;\n    void change(){\n        System.out.println(id);\n\
    \    }\n}\npublic class StudyTonight {\n    public static void main(String[] args)\
    \ {\n        Student o1 = new Student();\n        Student o2 = new Student();\n\
    \        o1.change();\n        Student.id = 1;\n        o2.change();\n    }\n\
    }\n```\n**Output:**\n```\n35\n1\n```\n\n## 3) Local variables\nLocal variables\
    \ are declared in method, constructor or block. Local variables are initialized\
    \ when method, constructor or block start and will be destroyed once its end.\
    \ Local variable reside in stack. Access modifiers are not used for local variable.\
    \ \n\n```java\nfloat getDiscount(int price){\n  float discount;\n  discount=price*(20/100);\n\
    \  return discount;\n}\n```\nHere `discount` is a local variable.\n\n**Additional\
    \ points on Local variable:**\n- Local variables are declared in methods, constructors,\
    \ or blocks.\n- Local variables are created when the method, constructor, block\
    \ is entered and the variable will be destroyed once it exits the method, constructor,\
    \ or block.\n- Access modifiers cannot be used for local variables.\n- Local variables\
    \ are visible only within the declared method, constructor, or block.\n- Local\
    \ variables are implemented at stack level internally.\n- There is no default\
    \ value for local variables, so local variables should be declared and an initial\
    \ value should be assigned before the first use.\n\n**Example:**\n```java\npublic\
    \ class Test {\n  public void pupAge() {\n    int age = 0;\n    age = age + 7;\n\
    \    System.out.println(\"Puppy age is : \" + age);\n  }\n  public static void\
    \ main(String args[]) {\n    Test test = new Test();\n    test.pupAge();\n  }\n\
    }\n```\nHere, `age` is a local variable. This is defined inside `pupAge()` method\
    \ and its scope is limited to only this method. This will produce the following\
    \ result:\n\n**Output:**\n```\nPuppy age is: 7\n```\n\n# Data Types in Java\n\
    Data types represent the different values to be stored in the variable. In java,\
    \ there are two types of data types:\n\n- Primitive data types\n- Non-primitive\
    \ data types\n\n![datatype in java](OEBPS/image1625.jpg)\n\n| Data Type | Default\
    \ Value | Default size |\n| :--- | :--- | :--- |\n| boolean | false | 1 bit |\n\
    | char | '\\u0000' | 2 byte |\n| byte | 0 | 1 byte |\n| short | 0 | 2 byte |\n\
    | int | 0 | 4 byte |\n| long | 0L | 8 byte |\n| float | 0.0f | 4 byte |\n| double\
    \ | 0.0d | 8 byte |\n"
