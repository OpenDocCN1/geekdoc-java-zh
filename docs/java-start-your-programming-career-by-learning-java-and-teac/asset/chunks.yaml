    5 6 2 3Deleting first nodeModified Linked List: 15 11 5 6 2 3CHAPTER 4 | NETWORKINGWhat
    is network programming?The term network programming refers to writing programs
    that execute across multiple devices (computers), in which the devices are all
    connected to each other using a network.The java.net package of the J2SE APIs
    contains a collection of classes and interfaces that provide the low-level communication
    details, allowing you to write programs that focus on solving the problem at hand.The
    java.net package provides support for the two common network protocols –


    1.  TCP − TCP stands for Transmission Control Protocol, which allows for reliable
    communication between two applications. TCP is typically used over the Internet
    Protocol, which is referred to as TCP/IP.


    2.  UDP − UDP stands for User Datagram Protocol, a connection-less protocol that
    allows for packets of data to be transmitted between applications.


    This chapter gives a good understanding on the following two subjects−


    1.  Socket Programming − This is the most widely used concept in Networking and
    it has been explained in very detail.


    2.  URL Processing − URL stands for Uniform Resource Locator and represents a
    resource on the World Wide Web, such as a Web page or FTP directory


    Socket Programming:Sockets provide the communication mechanism between two computers
    using TCP. A client program creates a socket on its end of the communication and
    attempts to connect that socket to a server.When the connection is made, the server
    creates a socket object on its end of the communication. The client and the server
    can now communicate by writing to and reading from the socket.The java.net.Socket
    class represents a socket, and the java.net.ServerSocket class provides a mechanism
    for the server program to listen for clients and establish connections with them.The
    following steps occur when establishing a TCP connection between two computers
    using sockets −The server instantiates a ServerSocket object, denoting which port
    number communication is to occur on.The server invokes the accept() method of
    the ServerSocket class. This method waits until a client connects to the server
    on the given port.After the server is waiting, a client instantiates a Socket
    object, specifying the server name and the port number to connect to.The constructor
    of the Socket class attempts to connect the client to the specified server and
    the port number. If communication is established, the client now has a Socket
    object capable of communicating with the server.On the server side, the accept()
    method returns a reference to a new socket on the server that is connected to
    the client''s socket.After the connections are established, communication can
    occur using I/O streams. Each socket has both an OutputStream and an InputStream.
    The client''s OutputStream is connected to the server''s InputStream, and the
    client''s InputStream is connected to the server''s OutputStream.TCP is a two-way
    communication protocol, hence data can be sent across both streams at the same
    time. Following are the useful classes providing complete set of methods to implement
    sockets.ServerSocket Class Methods:The java.net.ServerSocket class is used by
    server applications to obtain a port and listen for client requests.The ServerSocket
    class has four constructors –


    | Sr.No. | Method & Description |


    | 1 | public ServerSocket(int port) throws IOExceptionAttempts to create a server
    socket bound to the specified port. An exception occurs if the port is already
    bound by another application. |


    | 2 | public ServerSocket(int port, int backlog) throws IOExceptionSimilar to
    the previous constructor, the backlog parameter specifies how many incoming clients
    to store in a wait queue. |


    | 3 | public ServerSocket(int port, int backlog, InetAddress address) throws IOExceptionSimilar
    to the previous constructor, the InetAddress parameter specifies the local IP
    address to bind to. The InetAddress is used for servers that may have multiple
    IP addresses, allowing the server to specify which of its IP addresses to accept
    client requests on. |


    | 4 | public ServerSocket() throws IOExceptionCreates an unbound server socket.
    When using this constructor, use the bind() method when you are ready to bind
    the server socket. |


    If the ServerSocket constructor does not throw an exception, it means that your
    application has successfully bound to the specified port and is ready for client
    requests.Following are some of the common methods of the ServerSocket class −


    | Sr.No. | Method & Description |


    | 1 | public int getLocalPort()Returns the port that the server socket is listening
    on. This method is useful if you passed in 0 as the port number in a constructor
    and let the server find a port for you. |'
