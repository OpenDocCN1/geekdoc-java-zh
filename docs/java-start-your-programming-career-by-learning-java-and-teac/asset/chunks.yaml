  trans: "\n\n# 快速排序 (Quicksort)\n\n*   从数组中选择一个元素。该元素被称为“基准元素”。例如选择数组中间的元素。\n*  \
    \ 所有小于基准元素的放在一个数组中，所有大于基准元素的放在另一个数组中。\n*   通过递归地对这两个数组应用快速排序来完成排序。\n*   合并数组。\n\
    \n快速排序可以实现为“原地”排序。这意味着排序在数组内部进行，不需要创建额外的数组。\n\n### 程序：用于实现快速排序的 Java 程序\n```java\n\
    class QuickSort{\n    /* 此函数取最后一个元素作为基准，\n       将基准元素放在排序后数组的正确位置，\n       并将所有小于（小于基准）的元素放在基准的左侧，\n\
    \       将所有大于基准的元素放在基准的右侧 */\n    int partition(int arr[], int low, int high)\
    \ {\n        int pivot = arr[high];\n        int i = (low-1); // 较元素的索引\n    \
    \    for (int j=low; j<=high-1; j++) {\n            // 如果当前元素小于或\n           \
    \ // 等于基准\n            if (arr[j] <= pivot) {\n                i++;\n        \
    \        // 交换 arr[i] 和 arr[j]\n                int temp = arr[i];\n         \
    \       arr[i] = arr[j];\n                arr[j] = temp;\n            }\n    \
    \    }\n        // 交换 arr[i+1] 和 arr[high] (或基准)\n        int temp = arr[i+1];\n\
    \        arr[i+1] = arr[high];\n        arr[high] = temp;\n        return i+1;\n\
    \    }\n    /* 实现 QuickSort() 的主函数\n       arr[] --> 需要排序的数组，\n       low -->\
    \ 起索引，\n       high --> 结束索引*/\n    void sort(int arr[], int low, int high) {\n\
    \        if (low < high) {\n            /* pi 是分区索引，arr[pi] 现在\n             \
    \  处于正确的位置 */\n            int pi = partition(arr, low, high);\n            //\
    \ 递归排序分区之前和\n            // 分区之后的元素\n            sort(arr, low, pi-1);\n     \
    \       sort(arr, pi+1, high);\n        }\n    }\n    /* 打印大小为 n 的数组的工具函数 */\n\
    \    static void printArray(int arr[]) {\n        int n = arr.length;\n      \
    \  for (int i=0; i<n; ++i)\n            System.out.print(arr[i]+\" \");\n    \
    \    System.out.println();\n    }\n    public static void main(String args[])\
    \ {\n        int arr[] = {10, 7, 8, 9, 1, 5};\n        int n = arr.length;\n \
    \       QuickSort ob = new QuickSort();\n        ob.sort(arr, 0, n-1);\n     \
    \   System.out.println(\"sorted array\");\n        printArray(arr);\n    }\n}\n\
    ```\n**输出：** 1 5 7 8 9 10\n\n# 选择排序 (Selection Sort)\n\n选择排序是一种简单的算法。这种排序算法是一种原地的比较算法，将列表分为两部分：左端的已排序部分和右端的未排序部分。初始情况下，排序部分为空，未排序部分是整个列表。从未排序数组中选择最小元素并与最左侧元素交换，该元素就成为排序数组的一部分。这个过程持续将未排序边界每次向右移动一个元素。该算法不适用于大型数据集，因为其平均和最坏情况的复杂度为\
    \ Ο(n²)，其中 `n` 是数量。\n\n### 算法：\n1. 将 `MIN` 设置为位置 0\n2. 在列表中搜索最小元素\n3. 与位置 `MIN`\
    \ 的值交换\n4. 将 `MIN` 增加到下一个元素\n5. 重复直到列表排序完成\n\n### 程序：Java 中的选择排序\n```java\npublic\
    \ class SelectionSort {\n    public static void selectionSort(int[] arr) {\n \
    \       for (int i = 0; i < arr.length - 1; i++) {\n            int index = i;\n\
    \            for (int j = i + 1; j < arr.length; j++) {\n                if (arr[j]\
    \ < arr[index]) {\n                    index = j;//寻找最低索引\n                }\n\
    \            }\n            int smallerNumber = arr[index];\n            arr[index]\
    \ = arr[i];\n            arr[i] = smallerNumber;\n        }\n    }\n    public\
    \ static void main(String a[]) {\n        int[] arr1 = {9,14,3,2,43,11,22};\n\
    \        System.out.println(\"Before Selection Sort\");\n        for (int i:arr1)\
    \ {\n            System.out.print(i+\" \");\n        }\n        System.out.println();\n\
    \        selectionSort(arr1);//使用选择排序排序数组\n        System.out.println(\"After\
    \ Selection Sort\");\n        for (int i:arr1) {\n            System.out.print(i+\"\
    \ \");\n        }\n    }\n}\n```\n**输出：**\nBefore Selection Sort: 9 14 3 2 43\
    \ 11 22 \nAfter Selection Sort: 2 3 9 11 14 22 43 58\n\n# 链表 (Linked List)\n\n\
    链表是数据结构的序列，通过链接连接在一起。链表是包含项的链接序列。每个链接都指向另一个链接。以下是理解链表概念的关键术语。\n\n* `Link`：链表的每个链接可以存储一个数据。\n\
    * `Next`：链表的每个链接包含一个指向下一个链接的链接。\n* `LinkedList`：链表包含指向第一个链接的连接链接。\n\n### 链表的表示\n\
    链表可以可视化为节点链，每个节点指向下一个节点。\n![Linked List](img/image6121.jpg)\n根据插图，以下是需要考虑的关键点：\n\
    \n* 链表包含一个名为 `first` 的链接。\n* 每个链接携带一个数据字段和一个名为 `next` 的链接字段。\n* 每个链接通过其链接字段与其下一个链接连接。\n\
    * 最后一个链接携带空链接以标记列表的结束。\n\n### 链表的类型\n以下是链表的各种类型。\n\n* 单向链表：只能向前导航。\n* 双向链表：项可以向前向后导航。\n\
    * 循环链表：最后一项包含指向第一个元素的下一个链接，而第一个元素有指向最后一个元素的上一个链接。\n\n### 基本操作\n以下是列表支持的基本操作。\n\
    \n* `Insertion`：在列表开头添加元素。\n* `Deletion`：在列表开头删除元素。\n* `Display`：显示完整列表。\n* `Search`：使用给定键搜索元素。\n\
    * `Delete`：使用给定键删除元素。\n\n"
- fmt: "\n# Insertion Operation\n\nAdding a new node in linked list is a more than\
    \ one step activity. We shall learn this with diagrams here. First, create a node\
    \ using the same structure and find the location where it has to be inserted.\n\
    \n![Linked List Insertion](OEBPS/image6168.jpg)\n\nImagine that we are inserting\
    \ a node `B` (`NewNode`), between `A` (`LeftNode`) and `C` (`RightNode`). Then\
    \ point `B.next` to `C` - `NewNode.next -> RightNode;` - It should look like this\
    \ —![Linked List Insertion](OEBPS/image6177.jpg)\n\nNow, the next node at the\
    \ left should point to the new node. `LeftNode.next -> NewNode;` -![Linked List\
    \ Insertion](OEBPS/image6189.jpg)\n\nThis will put the new node in the middle\
    \ of the two. The new list should look like this —![Linked List Insertion](OEBPS/image6194.jpg)\n\
    \nSimilar steps should be taken if the node is being inserted at the beginning\
    \ of the list. While inserting it at the end, the second last node of the list\
    \ should point to the new node and the new node will point to `NULL`.\n\n# Deletion\
    \ Operation\n\nDeletion is also a more than one step process. We shall learn with\
    \ pictorial representation. First, locate the target node to be removed, by using\
    \ searching algorithms.![Linked List Deletion](OEBPS/image6201.jpg)\n\nThe left\
    \ (previous) node of the target node now should point to the next node of the\
    \ target node – `LeftNode.next -> TargetNode.next;` -![Linked List Deletion](OEBPS/image6213.jpg)\n\
    \nThis will remove the link that was pointing to the target node. Now, using the\
    \ following code, we will remove what the target node is pointing at. `TargetNode.next\
    \ -> NULL;` -![Linked List Deletion](OEBPS/image6220.jpg)\n\nWe need to use the\
    \ deleted node. We can keep that in memory otherwise we can simply deallocate\
    \ memory and wipe off the target node completely.![Linked List Deletion](OEBPS/image6225.jpg)\n\
    \n# Reverse Operation\n\nThis operation is a thorough one. We need to make the\
    \ last node to be pointed by the head node and reverse the whole linked list.![Linked\
    \ List Reverse Operation](OEBPS/image6236.jpg)\n\nFirst, we traverse to the end\
    \ of the list. It should be pointing to `NULL`. Now, we shall make it point to\
    \ its previous node —![Linked List Reverse Operation](OEBPS/image6241.jpg)\n\n\
    We have to make sure that the last node is not the lost node. So we'll have some\
    \ `temp` node, which looks like the head node pointing to the last node. Now,\
    \ we shall make all left side nodes point to their previous nodes one by one.![Linked\
    \ List Reverse Operation](OEBPS/image6246.jpg)\n\nExcept the node (first node)\
    \ pointed by the head node, all nodes should point to their predecessor, making\
    \ them their new successor. The first node will point to `NULL`.![Linked List\
    \ Reverse Operation](OEBPS/image6256.jpg)\n\nWe'll make the head node point to\
    \ the new first node by using the `temp` node.![Linked List Reverse Operation](OEBPS/image6261.jpg)\n\
    \nThe linked list is now reversed.\n\n# Program\n\nGiven a linked list which is\
    \ sorted, how will you insert in sorted way?\n\n## Algorithm\n\nLet input linked\
    \ list is sorted in increasing order.\n1) If Linked list is empty then make the\
    \ node as head and return it.\n2) If value of the node to be inserted is smaller\
    \ than value of head node then insert the node at start and make it head.\n3)\
    \ In a loop, find the appropriate node after which the input node (let 9) is to\
    \ be inserted. To find the appropriate node start from head, keep moving until\
    \ you reach a node `GN` (10 in the below diagram) who's value is greater than\
    \ the input node. The node just before `GN` is the appropriate node (7).\n4) Insert\
    \ the node (9) after the appropriate node (7) found in step 3.\n\n### Initial\
    \ Linked List\n![SortedLinked List](OEBPS/image6299.jpg)\n\n### Linked List after\
    \ insertion of 9\n![UpdatedSortedLinked List](OEBPS/image6309.jpg)\n\n```java\n\
    class LinkedList{\n    Node head; // head of list\n    /* Linked list Node*/\n\
    \    class Node {\n        int data;\n        Node next;\n        Node(int d)\
    \ {data = d; next = null; }\n    }\n    /* function to insert a new_node in a\
    \ list. */\n    void sortedInsert(Node new_node) {\n        Node current;\n  \
    \      /* Special case for head node */\n        if (head == null || head.data\
    \ >= new_node.data) {\n            new_node.next = head;\n            head = new_node;\n\
    \        } else {\n            /* Locate the node before point of insertion. */\n\
    \            current = head;\n            while (current.next != null && current.next.data\
    \ < new_node.data) {\n                current = current.next;\n            }\n\
    \            new_node.next = current.next;\n            current.next = new_node;\n\
    \        }\n    }\n    /*Utility functions*/\n    /* Function to create a node\
    \ */\n    Node newNode(int data) {\n        Node x = new Node(data);\n       \
    \ return x;\n    }\n    /* Function to print linked list */\n    void printList()\
