    \ to head node. You may assume that the Linked List never becomes empty. Let the\
    \ function name be `deleteNode()`. In a straightforward implementation, the function\
    \ needs to modify `head` pointer when the node to be deleted is the first node.\n\
    \n```java\nclass LinkedList {\n    static Node head;\n    static class Node {\n\
    \        int data;\n        Node next;\n        Node(int d) {\n            data\
    \ = d;\n            next = null;\n        }\n    }\n    void deleteNode(Node node,\
    \ Node n) {\n        // When node to be deleted is head node\n        if (node\
    \ == n) {\n            if (node.next == null) {\n                System.out.println(\"\
    There is only one node. The list \" + \"can't be made empty \");\n           \
    \     return;\n            }\n            /* Copy the data of next node to head\
    \ */\n            node.data = node.next.data;\n            // store address of\
    \ next node\n            n = node.next;\n            // Remove the link of next\
    \ node\n            node.next = node.next.next;\n            // free memory\n\
    \            System.gc();\n            return;\n        }\n        // When not\
