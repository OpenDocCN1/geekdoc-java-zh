    everything else when calling things by name. Considering this: A is different
    from a.As a programmer, you need to consider what a variable should be named.
    It must be clear to you and anyone else with whom you’ll be sharing your work
    with. You’ll also be typing your variable name many times, so they should be short
    and easy to remember and type. The last character we discuss here is the little
    strange @ or at. The @ can be used only if it’s the first character in a variable’s
    name.int @home;int noone@home;In the second variable declared here we’ll get an
    error. Some of these less regular characters are easy to spot in your code. When
    you have a long list of variables it’s sometimes best to make them stand out visually.
    Some classically trained programmers like to use an underscore to indicate a class
    scope variable. The underscore is omitted in variables which exist only within
    a function. You would find the reason for the odd rule regarding @ when you use
    int, which is reserved as a keyword. You’re allowed to use int @int, after which
    you can assign @int any integer value. However, many programmers tend to use MyInt,
    mInt, or _ int instead of @int based on their programming upbringing.Good programmers
    will spend a great deal of time coming up with useful names for their variables
    and functions. Coming up with short descriptive names takes some getting used
    to, but here are some useful tips. Variables are oftennamed using nouns or adjectives
    as they describe an attribute related to what they’re used for.In the end once
    you start using the name of the variable throughout the rest of your code, it
    becomes harder to change it as it will need to be changed everywhere it’s used.
    Doing a global change is called refactoring, and this happens so often that there
    is software available to help you “refactor” class, variable, and function names.NOTE:You
    may also notice the pattern in which uppercase and lowercase letters are used.
    This is referred to as either BumpyCase or CamelCase. Sometimes, the leading letter
    is lowercase, in which case it will look like headlessCamelCase rather than NormalCamelCase.
    Many long debates arise between programmers as to which is correct, but in the
    end either one will do. Because Java is case sensitive, you and anyone helping
    you should agree whether or not to use a leading uppercase letter. These differences
    usually come from where a person learned how to write software or who taught that
    person. The use of intermixed uppercase and lowercase is a part of programming
    style. Style also includes how white space is used.Types of VariablesYou must
    declare all variables before they can be used. Following is the basic form of
    a variable declaration:data type variable [ = value][, variable [ = value] ...]
    ;Here data type is one of Java''s datatypes and variable is the name of the variable.             To  declare
    more than one variable of the specified type, you can use a comma-separated list.Example:int  a,
    b, c;       // Declares three int  a, b, and c.inta =  10, b =  10; // Example
    of initializationbyteB =  22; // initializes a byte type variable B.double pi
    =  3.14159; // declares and assigns a   value of PI.Java Programming language
    defines mainly three kinds of variables.'
