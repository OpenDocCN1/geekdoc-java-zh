  trans: "\n在最简单的形式下，二分查找用于快速在有序序列中找到一个值（目前将序列视为普通数组即可）。为了清晰起见，我们将要查找的值称为 `target`\
    \ 值。二分查找维护了原始序列的一个连续子序列，`target` 值一定位于其中。这被称为 `search space`（搜索空间）。`search space`\
    \ 初始为整个序列。在每一步中，算法会将搜索空间中的中间值与 `target` 值进行比较。根据比较结果，由于序列是有序的，它可以排除一半的搜索空间。通过重复这种操作，最终将剩下一个只包含单个元素的搜索空间，即\
    \ `target` 值。\n\n例如，考虑以下升序排列的整数序列，假设我们正在寻找数字 55：\n\n| 0 | 5 | 13 | 19 | 22 | 41\
    \ | 55 | 68 | 72 | 81 | 98 |\n\n我们关注的是目标值在序列中的位置，因此我们将搜索空间表示为序列的索引。初始地，搜索空间包含索引\
    \ 1 到 11。由于搜索空间实际上是一个区间，只需要存储两个数字，即 `low` 和 `high` 索引即可。如上所述，我们现在选择中间值，即索引 6 处的值（1\
    \ 和 11 之间的中点）：该值是 41，它小于 `target` 值。从此我们得出结论：索引 6 处的元素不是目标值，而且索引 1 到 5 之间的任何元素都不可能是目标值，因为这些索引上的所有元素都小于\
    \ 41，而 41 又小于 `target` 值。这使得搜索空间缩小到索引 7 到 11：\n\n| 55 | 68 | 72 | 81 | 98 |\n\n\
    以类似的方式继续，我们切掉搜索空间的后半部分，剩下：\n\n| 55 | 68 |\n\n取决于我们如何选择偶数个元素的中间值，我们可能在下一步找到 55，或者切掉\
    \ 68 以得到一个只包含一个元素的搜索空间。无论何种情况，我们都得出目标值所在的索引是 7 的结论。如果序列中不存在目标值，二分查找将完全清空搜索空间。这种情况很容易检查和处理。以下是配合描述\
    \ get 的代码：\n\n```\nbinary_search(A, target):\n  lo = 1, hi = size(A)\n  while\
    \ lo <= hi:\n      mid = lo + (hi-lo)/2\n      if A[mid] == target:\n        return\
    \ mid\n      else if A[mid] < target:\n        lo = mid+1\n      else:\n     \
    \   hi = mid-1\n  // target was not found\n```\n\n复杂度：\n"
- fmt: "\nSince each comparison binary search uses halves the search space, we can\
    \ assert and easily prove that binary search will never use more than (in big-oh\
    \ notation) `O(log N)` comparisons to find the target value. The logarithm is\
    \ an awfully slowly growing function. In case you’re not aware of just how efficient\
    \ binary search is, consider looking up a name in a phone book containing a million\
    \ names. Binary search lets you systematically find any given name using at most\
    \ 21 comparisons. If you could manage a list containing all the people in the\
    \ world sorted by name, you could find any person in less than 35 steps.\n\n###\
    \ Binary Search\n\n#### Java implementation of recursive Binary Search\n```java\n\
    class BinarySearch{\n    // Returns index of x if it is present in arr[l..r],\
    \ else \n    // return -1\n    int binarySearch(int arr[], int l, int r, int x)\
    \ {\n        if (r>=l) {\n            int mid = l + (r - l)/2;\n            //\
    \ If the element is present at the middle itself\n            if (arr[mid] ==\
    \ x)\n                return mid;\n            // If element is smaller than mid,\
    \ then it can only\n            // be present in left subarray\n            if\
    \ (arr[mid] > x)\n                return binarySearch(arr, l, mid-1, x);\n   \
    \         // Else the element can only be present in right\n            // subarray\n\
    \            return binarySearch(arr, mid+1, r, x);\n        }\n        // We\
    \ reach here when element is not present in array\n        return -1;\n    }\n\
    \    public static void main(String args[]) {\n        BinarySearch ob = new BinarySearch();\n\
    \        int arr[] = {2,3,4,10,40};\n        int n = arr.length;\n        int\
    \ x = 10;\n        int result = ob.binarySearch(arr,0,n-1,x);\n        if (result\
    \ == -1)\n            System.out.println(\"Element not present\");\n        else\n\
    \            System.out.println(\"Element found at index \"+result);\n    }\n\
    }\n```\n**Output:** `Element is present at index 3`\n\n#### Iterative implementation\
    \ of Binary Search\n```java\nclass BinarySearch{\n    // Returns index of x if\
    \ it is present in arr[], else \n    // return -1\n    int binarySearch(int arr[],\
    \ int x) {\n        int l = 0, r = arr.length - 1;\n        while (l <= r) {\n\
    \            int m = l + (r-l)/2;\n            // Check if x is present at mid\n\
    \            if (arr[m] == x)\n                return m;\n            // If greater,\
    \ ignore left half\n            if (arr[m] < x)\n                l = m + 1;\n\
    \            // If x is smaller, ignore right half\n            else\n       \
    \         r = m - 1;\n        }\n        // if we reach here, element was not\
    \ present\n        return -1;\n    }\n    public static void main(String args[])\
    \ {\n        BinarySearch ob = new BinarySearch();\n        int arr[] = {2, 3,\
    \ 4, 10};\n        int n = arr.length;\n        int x = 0;\n        int result\
    \ = ob.binarySearch(arr, x);\n        if (result == -1)\n            System.out.println(\"\
    Element not present\");\n        else\n            System.out.println(\"Element\
    \ found at index \"+result);\n    }\n}\n```\n**Output:** `Element is present at\
    \ index 3`\n\n### Bubble Sort\n\nBubble sort algorithm is known as the simplest\
    \ sorting algorithm. In bubble sort, array is traversed from first element to\
    \ last element. Here, current element is compared with the next element. If current\
    \ element is greater than the next element, it is swapped.\n\n#### Algorithm\n\
    We assume `list` is an array of `n` elements. We further assume that `swap` function\
    \ swaps the values of the given array.\n```\nbegin\nBubbleSort(list)\n  for all\
