    ## Socket Class Methods


    The `java.net.Socket` class represents the socket that both the client and the
    server use to communicate with each other. The client obtains a `Socket` object
    by instantiating one, whereas the server obtains a `Socket` object from the return
    value of the `accept()` method.


    The `Socket` class has five constructors that a client uses to connect to a server
    –


    | Sr.No. | Method & Description |

    | :--- | :--- |

    | 1 | `public Socket(String host, int port) throws UnknownHostException, IOException`
    - This method attempts to connect to the specified server at the specified port.
    If this constructor does not throw an exception, the connection is successful
    and the client is connected to the server. |

    | 2 | `public Socket(InetAddress host, int port) throws IOException` - This method
    is identical to the previous constructor, except that the host is denoted by an
    `InetAddress` object. |

    | 3 | `public Socket(String host, int port, InetAddress localAddress, int localPort)
    throws IOException` - Connects to the specified host and port. |

    | 4 | `public Socket(InetAddress host, int port, InetAddress localAddress, int
    localPort) throws IOException` - This method is identical to the previous constructor,
    except that the host is denoted by an `InetAddress` object. |

    | 5 | `public Socket()` - Creates an unconnected socket. Use the `connect()` method
    to connect this socket to server. |


    When the `ServerSocket` invokes `accept()`, the method does not return until a
    client connects. After a client does connect, the `ServerSocket` creates a new
    `Socket` on an unspecified port and returns a reference to this new `Socket`.
    A TCP connection now exists between the client and the server, and communication
    can begin.


    - `public Socket accept() throws IOException` - Waits for an incoming client.
    This method blocks until either a client connects to the server on the specified
    port or the socket times out, assuming that the time-out value has been set using
    the `setSoTimeout()` method. Otherwise, this method blocks indefinitely.

    - `public void setSoTimeout(int timeout)` - Sets the time-out value for how long
    the server socket waits for a client during the `accept()`.

    - `public void bind(SocketAddress host, int backlog)` - Binds the socket to the
    specified server and port in the `SocketAddress` object. Use this method if you
    have instantiated the `ServerSocket` using the no-argument constructor.


    Some methods of interest in the `Socket` class are listed here. Notice that both
    the client and the server have a `Socket` object, so these methods can be invoked
    by both the client and the server.


    | Sr.No. | Method & Description |

    | :--- | :--- |

    | 1 | `public void connect(SocketAddress host, int timeout) throws IOException`
    - This method connects the socket to the specified host. This method is needed
    only when you instantiate the `Socket` using the no-argument constructor. |

    | 2 | `public InetAddress getInetAddress()` - This method returns the address
    of the other computer this socket is connected to. |

    | 3 | `public int getPort()` - Returns the port the socket is bound to on the
    remote machine. |

    | 4 | `public int getLocalPort()` - Returns the port the socket is bound to on
    the local machine. |

    | 5 | `public SocketAddress getRemoteAddress()` - Returns the address of the remote
    socket. |

    | 6 | `public InputStream getInputStream() throws IOException` - Returns the input
    stream of the socket. The input stream is connected to the output stream of the
    remote socket. |

    | 7 | `public OutputStream getOutputStream() throws IOException` - Returns the
    output stream of the socket. The output stream is connected to the input stream
    of the remote socket. |

    | 8 | `public void close() throws IOException` - Closes the socket, which makes
    this `Socket` object no longer capable of connecting again to any server. |


    ## InetAddress Class Methods


    This class represents an Internet Protocol (IP) address. Here are following useful
    methods which you would need while doing socket programming –


    | Sr.No. | Method & Description |

    | :--- | :--- |

    | 1 | `static InetAddress getByAddress(byte[] addr)` - Returns an `InetAddress`
    object given the raw IP address. |

    | 2 | `static InetAddress getByAddress(String host, byte[] addr)` - Creates an
    `InetAddress` based on the provided host name and IP address. |

    | 3 | `static InetAddress getByName(String host)` - Determines the IP address
    of a host, given the host''s name. |

    | 4 | `String getHostAddress()` - Returns the IP address string in textual presentation.
    |

    | 5 | `String getHostName()` - Gets the host name for this IP address. |

    | 6 | `static InetAddress getLocalHost()` - Returns the local host. |

    | 7 | `String toString()` - Converts this IP address to a `String`. |

