    World, Java Program");This instruction will print out the text Hello World, Java
    Program to the console. If you run your Java program from the command line, then
    you will see the output in the command line console (the textual interface to
    your computer). If you run your Java program from inside an IDE, the IDE normally
    catches all output to the console and makes it visible to you somewhere inside
