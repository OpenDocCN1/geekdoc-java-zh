    red, you’re not alone. Ross Chapman, a UX Engineer who coded for [ ](https://www.zendesk.com/)[Zendesk](https://www.zendesk.com/)  and
    now working at [ ](https://www.scienceexchange.com/)[ScienceExchang](https://www.scienceexchange.com/)e,
    admits to being a scared developer when he first started out.I didn’t have the
    patience because I wasn’t ready to love the challenge of fixing things. But that’s
    pretty much where all my really bad habits come from.With that said, Ross urges
    beginners to embrace errors as crucial learning moments. Since you’ll be debugging
    for life, you should get used to errors and learn to recognize the error messages."Being
    able to quickly parse and understand error messages will save you a lot of time
    and get you a long way. The fact you’ve tried will be very much appreciated by
    the person you’re asking for help."— Jack Franklin, author of “Beginning jQuery”Jack
    also recommends beginners to make an attempt at fixing problems on their own at
    first. When hitting a wall when debugging, Lee Byron, co-contributor to React,
    personally attempts to understand what’s going on by making ample usage of the
    debugger tools.Once I understand exactly what is happening – step by step, then
    I can compare that to what I expected to happen and isolate the surprising parts
    and see where my assumptions were wrong or how some code led to the surprising
    situation.Errors aren’t limited to bugs, however. Sometimes, you make bad decisions
    such as using the wrong data structure. According to Mike, getting burned by those
    bad decisions will eventually help you learn when it’s reasonable to use certain
    design patterns5\. UNDSERSTAND HOW THINGS WORK


    * * *'
