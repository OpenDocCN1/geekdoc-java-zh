    class is a collection of fields (data variables) and methods that operate on the
    fields. Every program in Java consists of at least one class, the one that contains
    the main method. The main () method which is from where the execution of program
    actually starts and follow the statements in the order specified.The main method
    can create objects, evaluate expressions, and invoke other methods and much more.
    On reaching the end of main, the program terminates and control passes back to
    the operating system.The class section is mandatory.After discussing the structure
    of programs in Java, we shall now discuss a program that displays a string Hello
    Java on the screen.// Program to display message on the screenclass HelloJava{         public
    static void main(String args[])    {           System.out.println("Hello Java");     }}The
    main() MethodA Java program is a sequence of Java instructions that are executed
    in a certain order. Since the Java instructions are executed in a certain order,
    a Java program has a start and an end.To execute your Java program you need to
    signal to the Java Virtual Machine where to start executing the program. In Java,
    all instructions (code) have to be located inside a Java class. A class is a way
    of grouping data and instructions that belong together. Thus, a class may contain
