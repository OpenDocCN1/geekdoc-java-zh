- fmt: "\n*   Does it have to go through the entire list? There will be an `n` in\
    \ there somewhere.\n*   Does the algorithms processing time increase at a slower\
    \ rate than the size of the data set? Then there’s probably a `log n` in there.\n\
    *   Are there nested loops? You’re probably looking at `n^2` or `n^3`.\n*   Is\
    \ access time constant irrelevant of the size of the dataset?? `O(1)`\n\n### Sample\
    \ Questions\nI have an array of the numbers 1 to 100 in a random number. One of\
    \ the numbers is missing. Write an algorithm to figure out what the number is\
    \ and what position is missing.\n\nThere are many variations of this question\
    \ all of which are very popular. To calculate the missing number we can simply\
    \ add up all the numbers we do have, and subtract this from the expected answer\
    \ of the sum of all numbers between 1 and 100. To do this we have to iterate the\
    \ list once. Whilst doing this we can also note which spot has the gap.\n\n```java\n\
    public void findTheBlank(int[] theNumbers) {\n    int sumOfAllNumbers = 0;\n \
    \   int sumOfNumbersPresent = 0;\n    int blankSpace = 0;\n    for (int i = 0;\
    \ i < theNumbers.length; i++) {\n        sumOfAllNumbers += i + 1;\n        sumOfNumbersPresent\
    \ += theNumbers[i];\n        if (theNumbers[i] == 0) {\n            blankSpace\
    \ = i;\n        }\n    }\n    System.out.println(\"Missing number = \" + (sumOfAllNumbers\
    \ - sumOfNumbersPresent) + \" at location \" + blankSpace +\" of the array\");\n\
    }\nnew BubbleSort().findTheBlank(new int[] {7,6,0,1,3,2,4});\n//Missing number\
    \ = 5 at location 2 of the array\n```\n\nWhat is the big O for this algorithm?\n\
    Our algorithm iterates through our list once, so it’s simply `O(n)`.\n\n### Big-O\
    \ Complexity Chart\n![](OEBPS/image4891.jpg)\n![](OEBPS/image4896.jpg)\n\n###\
    \ Array Sorting Algorithms complexity:\n![](OEBPS/image4907.jpg)\n\n# CHAPTER\
    \ 11 | DATA STRUCTURE\n\nEven though computers can perform literally millions\
    \ of mathematical computations per second, when a problem gets large and complicated,\
    \ performance can nonetheless be an important consideration. One of the most crucial\
    \ aspects to how quickly a problem can be solved is how the data is stored in\
    \ memory. To illustrate this point, consider going to the local library to find\
    \ a book about a specific subject matter. Most likely, you will be able to use\
    \ some kind of electronic reference or, in the worst case, a card catalog, to\
    \ determine the title and author of the book you want. Since the books are typically\
    \ shelved by category, and within each category sorted by author’s name, it is\
    \ a fairly straightforward and painless process to then physically select your\
    \ book from the shelves.\n\nNow, suppose instead you came to the library in search\
    \ of a particular book, but instead of organized shelves, were greeted with large\
    \ garbage bags lining both sides of the room, each arbitrarily filled with books\
    \ that may or may not have anything to do with one another. It would take hours,\
    \ or even days, to find the book you needed, a comparative eternity. This is how\
    \ software runs when data is not stored in an efficient format appropriate to\
    \ the application.\n\n## Simple Data Structure\nThe simplest data structures are\
    \ primitive variables. They hold a single value, and beyond that, are of limited\
    \ use. When many related values need to be stored, an array is used. It is assumed\
    \ that the reader of this article has a solid understanding of variables and arrays.\n\
    \nA somewhat more difficult concept, though equally primitive, are pointers. Pointers,\
    \ instead of holding an actual value, simply hold a memory address that, in theory,\
    \ contains some useful piece of data. Most seasoned C++ coders have a solid understanding\
    \ of how to use pointers, and many of the caveats, while fledgling programmers\
    \ may find themselves a bit spoiled by more modern \"managed\" languages which,\
    \ for better or worse, handle pointers implicitly. Either way, it should suffice\
    \ to know that pointers \"point\" somewhere in memory, and do not actually store\
    \ data themselves.\n\nA less abstract way to think about pointers is in how the\
    \ human mind remembers (or cannot remember) certain things. Many times, a good\
    \ engineer may not necessarily know a particular formula/constant/equation, but\
    \ when asked, they could tell you exactly which reference to check.\n\n## Arrays\n\
    Arrays are a very simple data structure, and may be thought of as a list of a\
    \ fixed length. Arrays are nice because of their simplicity, and are well suited\
    \ for situations where the number of data items is known (or can be programmatically\
    \ determined). Suppose you need a piece of code to calculate the average of several\
    \ numbers.\n\nAn array is a perfect data structure to hold the individual values,\
    \ since they have no specific order, and the required computations do not require\
    \ any special handling other than to iterate through all of the values. The other\
    \ big strength of arrays is that they can be accessed randomly, by index. For\
    \ instance, if you have an array containing a list of names of students seated\
    \ in a classroom, where each seat is numbered 1 through `n`, then `studentName[i]`\
    \ is a trivial way to read or store the name of the student in seat `i`.\n\nAn\
    \ array might also be thought of as a pre-bound pad of paper. It has a fixed number\
    \ of pages, each page holds information, and is in a predefined location that\
    \ never changes.\n\n## Sorting Techniques\nSorting refers to arranging data in\
    \ a particular format. Sorting algorithm specifies the way to arrange data in\
    \ a particular order. Most common orders are in numerical or lexicographical order.\
    \ The importance of sorting lies in the fact that data searching can be optimized\
    \ to a very high level, if data is stored in a sorted manner. Sorting is also\
    \ used to represent data in more readable formats. Following are some of the examples\
    \ of sorting in real-life:\n\n*   Telephone Directory: The telephone directory\
    \ stores the telephone numbers of people sorted by their names, so that the names\
    \ can be searched.\n*   Dictionary: The dictionary stores words in an alphabetical\
    \ order so that searching any word becomes easy.\n\n### In-place Sorting and Not-in-place\
    \ Sorting\nSorting algorithms may require some extra space for comparison and\
    \ temporary storage of few elements. These algorithms do not require any extra\
    \ space and sorting is said to happen in-place, or for example, the array itself.\
    \ This is called in-place sorting. Bubble sort is an example of in-place sorting.\
    \ However, in some sorting algorithms, the program requires space which is more\
    \ than equal to the elements being sorted. Sorting which uses equal or more space\
    \ is called not-in-place sorting. Merge sort is an example of notin-place sorting.\n\
    \n### Stable and Not Stable Sorting\nIf a sorting algorithm, after sorting the\
    \ contents, does not change the sequence of similar content in which they appear,\
    \ it is called stable sorting.\n![Stable Sorting](OEBPS/image4971.jpg)\nIf a sorting\
    \ algorithm, after sorting the contents, changes the sequence of similar content\
    \ in which they appear, it is called unstable sorting.\n![Unstable Sorting](OEBPS/image4981.jpg)\n\
    Stability of an algorithm matters when we wish to maintain the sequence of original\
    \ elements, like in a tuple for example.\n\n### Adaptive and Non-Adaptive Sorting\
    \ Algorithm\nA sorting algorithm is said to be adaptive, if it takes advantage\
    \ of already 'sorted' elements in the list that is to be sorted. That is, while\
    \ sorting if the source list has some element already sorted, adaptive algorithms\
    \ will take this into account and will try not to re-order them. A non-adaptive\
    \ algorithm is one which does not take into account the elements which are already\
    \ sorted. They try to force every single element to be re-ordered to confirm their\
    \ sortedness.\n\nSorting and Searching\nBinary Search\nBinary search is one of\
    \ the fundamental algorithms in computer science. In order to explore it, we’ll\
    \ first build up a theoretical backbone, then use that to implement the algorithm\
    \ properly and avoid those nasty off-by-one errors everyone’s been talking about.\
    \ Finding a value in a sorted sequence\n"
