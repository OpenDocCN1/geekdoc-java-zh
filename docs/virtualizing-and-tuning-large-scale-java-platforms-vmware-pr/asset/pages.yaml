    # Partitioning


    For custom enterprise applications backed by RDBMS schema tables that are highly
    accessible during the course of a regular business day, a partitioning strategy
    improves performance to easily meet SLA requirements. These types of frequently
    accessed tables are often referred to as hot tables because of their high rate
    of data insert, update, delete, and read operations. In addition to the high rate
    of data change, it is common for these hot tables to become unmanageable within
    a single node because of their size. In such cases, you can use a vFabric SQL
    horizontal partitioning strategy to split the data volume into smaller, more manageable
    data partitions.'
