  md: '# Best Practice


    # Description


    BP 44: Enable hyperthreading and do not overcommit CPU (continued).


    If however the VMs are not sized perfectly to have 1 VM in each NUMA node, it
    might be that vSphere will determine scheduling additional VMs on the same NUMA
    node, but this is not always a good assumption by vSphere. This sometimes can
    happen if you are intermixing smaller-size JVMs with large JVMs and VMs being
    deployed on the same vSphere host. For example, if you have a topology setup as
    the one in Figure 2.4 in Chapter 2, it is possible that the VMs from the client
    tier, such end up on the NUMA node simply because vSphere scheduler detects these
    2 VMs have a high amount of chatter between them. Ideally, you should avoid this,
    by using /Numa/LocalityWeightActionAffinity set to 0, or not mix JVM and VMs on
    the same vSphere hosts. Ideally, you should have only SQL Member VMs on vSphere
    hosts that fit perfectly into the NUMA nodes so they don''t allow other VMs to
    be scheduled in, and the entire VM that fits within the NUMA node avoiding any
    other VM being scheduled in there. the enterprise application services/client
    type of JVMs can be placed on separate vSphere hosts.


    Note In VMware vSphere 5.1, there is an advanced setting parameter, and you can
    set this to 0: /Numa/LocalityWeightActionAffinity. This setting controls what
    the CPU scheduler gives to inter-VM communication when making decisions about
    assigning VMs to NUMA nodes. In most cases, leaving this at the default value
    will give the best performance. But if you happen to mix client applications with
    server applications on the same vSphere host, this setting will perhaps improve
    scalability. In the SQLFire/server topology, client VMs have a high level of communication
    between them. This biased scheduler default algorithm toward placing these VMs
    on the same NUMA node. This behavior will impede performance, and will have a
    negative impact on performance at certain load levels. As a result, the parameter
    was set to 0 to disable the use of inter-VM communication in scheduling decisions
    in the default algorithm.


    As further note on NUMA, know that one advantage of virtualizing workloads over
    physical is the NUMA optimizes vSphere. In the case of Java workloads that are
    memory intensive, especially in category 2 workloads, if not virtualized on physical
    systems, one would have to resort to numactl command for NUMA pinning, which is
    a static task that needs to be updated as the workload''s behavior changes over
    time—not a great thing to have to administer on a daily basis, while also not
    likely to perform as well as an advanced NUMA algorithm that vSphere provides.'
