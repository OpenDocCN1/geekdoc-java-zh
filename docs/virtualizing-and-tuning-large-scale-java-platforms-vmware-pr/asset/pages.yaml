    # We are on the DevOps team, and we challenged about our JVM knowledge by the
    developers. Can you help us with some preliminary information about the JVM internals
    and how it needs to be sized?


    Note if you have read through this book, and specifically Chapter 3 and Chapter
    4, you have all the information you need to convince the Java architects of how
    JVMs need to be sized. However if you want to equip yourself with some more background
    information on how the internals of the JVM works, in addition to what is discussed
    in these chapters, see Figure A-7. The left side of the diagram shows the VM and
    JVM memory diagram that has been used throughout this book. The right side of
    the diagram is an expanded view of the internals of the heap. Chapter 4 covered
    in depth to tune JVMs, and it was assumed that you have some background knowledge
    about the various sections of the JVM. The expanded view shows the Java heap configured
    with -Xmx, and then in turn the Java heap is split between the young generation
    (YoungGen) and old generation (OldGen).'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# 228 Appendix


    ![](img/c26bfb34f357e8daa09165d85110e193_261_0.png)


    Figure A-7 Expanded View of the Java Heap


    In the example, the Java heap size is 4096m, the YoungGen is 33% of the heap at
    1350m, and the OldGen is simply the difference between the heap size and the YoungGen
    (2746m, 67% of the heap -2mx). With this common configuration, the YoungGen has
    plenty of space for object churn. The YoungGen, in turn, has a section called
    the Eden space and two survivor spaces, survivor space 1 and 2.


    Objects in Java applications are created in the Eden space, and then if they are
    not referenced, the next minor GC will garbage collect them. However, the objects
    are live and being referenced, they will get copied to the first survivor space.
    This cycle continues, and if objects continue to survive in survivor space 1,
    they are moved to survivor space 2 in the next cycle. Furthermore, if objects
    continue to survivor space 2, objects will then eventually be promoted to the
    OldGen; note that some iterations of copying survivor spaces will take multiple
    times before the threshold is crossed and objects are copied over to the old generation.
    In the YoungGen, minor garbage collections are relatively quick, but still pausing;
    in the OldGen, full garbage collection shouldn''t occur as much (every few hours)
    and lasts in the minutes range depending on the size of the OldGen.'
  merge: -1
