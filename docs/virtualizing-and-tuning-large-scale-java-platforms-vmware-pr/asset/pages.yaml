  md: '# VM Timekeeping Best Practices


    Timekeeping can have an effect on Java programs if they are sensitive to accurate
    measurements over periods of time or if they need a time stamp that is within
    an exact tolerance (such as a time stamp on a shared document or data item). VMware
    Tools contains features that are installable into the guest OS to enable time
    synchronization, and the use of those tools is recommended. Table 6-3 provides
    a VM timekeeping best practice.


    Table 6-3 VM Timekeeping Best Practice


    | Best Practice | Description |

    | --- | --- |

    | BP 22: Use an NTP source | Use a common Network Time Protocol (NTP) source to
    synchronize all systems. <br> For a Linux guest OS, the following KB article has
    a list of settings: http://kb.vmware.com/kb/1006427. <br> For a Windows guest
    OS, the following KB article has a list of settings: http://kb.vmware.com/kb/1318.
    <br> For further reference, see http://www.vmware.com/files/pdf/techpaper/Timekeeping-In-VirtualMachines.pdf.
    |


    # Vertical Scalability Best Practices


    If an enterprise Java application deployed on vSphere experiences heavy CPU utilization
    and you have determined that an increase in the vCPU count will help resolve the
    saturation, you can potentially use vSphere hot add to add additional vCPU. Table
    6-4 describes a vertical scalability best practice.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# Table 6-4 Vertical Scalability Best Practice


    | Best Practice | Description |

    | :--- | :--- |

    | BP 23: Hot add or remove CPU/memory. | Check to see whether the guest OS version
    you are using supports hot add and remove of CPU and memory. |


    Because Java processes cannot immediately use all the available CPU, it is probably
    best to avoid using hot add. GC cycles in old generation and the off-the-heap
    section of the Java process may potentially use hot-added CPU, but this is not
    very predictable, and not a best practice in production systems. If the VM needs
    additional CPU cycles outside of the Java processes (for example, some other process),
    perhaps CPU hot add can be used.


    Because Java platforms, particularly in category 1, will have lots of horizontally
    scaled-out copies of any applications in JVMs, it is best to use the load-balancer
    layer to cycle the JVM that needs reconfiguration out of the distribution, and
    then adjust its configuration and place back in the load-balancer pool.


    In the young generation space of the Java heap, -XX:ParallelGCThreads=<Threads>
    controls the number of executing worker threads that are used in parallel to clean
