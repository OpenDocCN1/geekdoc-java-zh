    The clients are usually enterprise applications distributed within the organization
    and are outside the vFabric SQLFire cluster but need data access to and from the
    vFabric SQLFire cluster. The client uses a client driver that is a lightweight
    JDBC driver for Java applications, or ADO.NET for .NET applications. Thin clients
