    The key differences between VI3 and vSphere 4 focused on CPU scheduling and on
    memory enhancements, as described in the sections that follow.


    # CPU Scheduling Enhancements


    For CPU scheduling, the enhancement highlights are as follows:


    +   - Relaxed codescheduling of vCPUs, introduced in earlier versions of ESX,
    has been further fine-tuned especially for SMP VMs

    - The ESX 4.0 scheduler utilizes new finer-grained locking that reduces scheduling
    overheads in cases where frequent scheduling decisions are needed.

    - The new scheduler is aware of processor cache topology and takes into account
    the processor architecture to optimize CPU usage.

    - For I/O intensive workloads, interrupt delivery and the associated processing
    make up a large component of the virtualization overhead. The preceding scheduler
    enhancements greatly improve the efficiency of interrupt delivery and associated
    processing.


    # Memory Enhancements


    Hardware-assisted memory virtualization management in VMs differs from physical
    machines in one key aspect:


    This enhancement now uses a hardware-based memory management unit (MMU), greatly
    improving memory throughput, as illustrated in Figure 5-16. Apache Compile is
    improved by approximately 55%, Citrix XenApp by 30%, and SQL Server by 12%.'
