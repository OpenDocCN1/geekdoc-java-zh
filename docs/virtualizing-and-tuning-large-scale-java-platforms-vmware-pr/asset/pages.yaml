  md: '# TECHNICAL BEST PRACTICES AND REAL-WORLD TIPS FOR OPTIMIZING ENTERPRISE JAVA
    APPLICATIONS ON VMware vSphere


    Enterprises no longer ask, "Can Java be virtualized?" Today, they ask, "How large
    can we scale virtual Java application platforms, and how efficiently can we tune
    them?" Now, the leading expert on Java virtualization answers these questions,
    offering detailed technical information you can apply in any production or QA/test
    environment.


    Emad Benjamin has spent nine years virtualizing VMware''s own Java applications
    and working with nearly 300 leading VMware customers on projects of all types
    and sizes—from 100 JVMs to 10,000+, with from 1GB to 36GB, and including big-data
    applications built on clustered JVMs. Reflecting all this experience, he shows
    how to fully scale and tune any Java workload.


    This reference and "cookbook" identifies high-value optimization opportunities
    that apply to physical environments, virtual environments, or both. You learn
    how to rationalize and scale existing Java infrastructure, modernize architecture
    for new applications, and systematically benchmark and compare every aspect of
    virtualized Java performance. Benjamin offers real performance studies, specific
    advice, and "from-the-trenches" insights into monitoring and troubleshooting.


    # COVERAGE INCLUDES


    +   Performance issues associated with large-scale Java platforms, including consolidation,
    elasticity, and flexibility


    +   Technical considerations arising from theoretical and practical limits of
    Java platforms


    +   Building horizontal in-memory databases with VMware vFabric SQLFire to improve
    scalability and response times


    +   Tuning large-scale Java using throughput/parallel GC and Concurrent Mark and
    Sweep (CMS) techniques


    +   Designing and sizing a new virtualized Java environment


    +   Designing and sizing new large-scale Java platforms when migrating from physical
    to virtualized deployments


    +   Designing large-scale Java platforms for latency-sensitive in-memory databases


    +   Real-world performance studies: SQLFire vs RDBMS, Spring-based Java web apps,
    vFabric SpringTrader, application data, tiers, and more


    +   Best-practice considerations for each type of workload: architecture, performance,
    design, sizing, and high availability


    +   Identifying bottlenecks in the load balancer, web application server, or DB
    Server tiers


    +   Advanced vSphere performance troubleshooting with esxtop


    +   Performance FAQs: answers to specific questions customers have asked


    Emad Benjamin, principal architect at VMware, has spent the past nine years on
    Java when deployed on VMware vSphere, vFabric GemFire, and SQLFire environments.
    He is the author of Enterprise Java Applications Architecture on VMware and has
    presented on Java virtualization related topics at World, SpringOne, UberConf,
    and Novartis. Benjamin has 20 years of IT experience, including 16 years with
    Java. He is the only author with a deep background in the unique intersection
    between virtualization and Java.


