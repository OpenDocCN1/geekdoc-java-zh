  md: "# Troubleshooting Java Memory Problems\n\nConsider an example where you observe\
    \ load increases and decreases over a period of time. If memory continues to build\
    \ without reclamation (in the worst case), or a GC reclamation occurs but not\
    \ everything is reclaimed, you might have a memory leak. This is very likely if\
    \ these symptoms persist to a point where the application suffers from an OutOfMemory\
    \ error. In this case, you need to investigate the GC frequency and settings:\n\
    \n+   - To turn on GC verbose mode:\n    - verbose:gc: Prints basic information\
    \ about GC to the standard output\n    - -XX:+PrintGCTimeStamp: Prints the times\
    \ that GC executes\n    - -XX:+PrintGCDetails: Prints statistics about different\
    \ regions of memory in the JVM\n    - -Xloggc:<file>: Logs the results of GC in\
    \ the specified file\n\nTo get a graphical representation of the GC log, you can\
    \ use the GCViewer, which you can download from http://tagraum.com/gcviewer-download.html.\n\
    \n+   - Re-inspect the Xmx, -Xms, -Xss settings. Double-check each of these values\
    \ and make sure that you have the right syntax. You can specify in gigabytes (GB)\
    \ -Xmx4g or -Xmx4096m. Both are basically 4GB of heap. In production environments,\
    \ always set -Xms to Xmx and avoid any heap reaping costs at runtime.\n- If you're\
    \ using Java Development Kit (JDK) 6, you can use a tool jmap on any platform.\
    \ Running jmap may add additional load on your environment, so plan for the best\
    \ time to run it. You can also use the VisualVM tool or the Memory Analysis Tool\
    \ (MAT, http://www.eclipse.org/mat/downloads.php). The MAT tool has a leak analyzer\
    \ that proves quite useful, as discussed at http://help.eclipse.org/kepler/index.jsp?topic=org.eclipse.mat.ui/welcome.html.\n\
    - You can add -XX:+HeapDumpOutOfMemoryError to the Java command line to generate\
    \ a heap dump. You can learn more about various heap dump generation approaches\
    \ at http://wiki.eclipse.org/index.php/MemoryAnalyzer.\n- The general approach\
    \ to reproduce a memory leak during debugging is to do the following:\n    - Run\
    \ GC manually to clear the application."
  merge: -1
