    are true: |


    +   - Each thread has its first database connection, and all are in use.

    - Each thread is waiting for a second database connection, and none becomes available
    because all threads are blocked.


    +   - To prevent the deadlock in this case, increase the maximum connections value
    for the database pool by at least 1. This allows at least 1 of the waiting threads
    to obtain a second database connection and avoids a deadlock scenario.


    +   - See the server documentation for any additional JDBC pool tuning you can
    do in terms of size of the connection pool minimum/maximum, growth rate, idle
    connections, recycle and timeout parameters, and so on.


