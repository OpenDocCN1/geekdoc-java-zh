  md: '# Is a 4GB Java Heap the New 1GB? Why?


    In the past 2 years, I have conducted more than 290 customer calls and workshops
    where it was evident that 40% of workloads running on Java platforms were deployed
    on JVMs that were 1 to 4GB in size. I continue to see a huge number of less than
    1GB JVMs, approximately 40% within the customer base I interact with. The remaining
    20% vary from 4 to 360GB. A 360GB JVM is due to a monitoring system that cannot
    horizontally scale out and so the customer is forced to have a single JVM. Although
    this might seem unbelievable, it is the reality of Java production platforms today.
    The JVMs with 1GB heap cause a sprawl of JVM instances, and that becomes its own
    management headache. For example, you might want to service 1TB of heap space,
    which would mean thousands of JVM instances if you only allow a 1GB JVM heap.
    How can that possibly make sense? Couldn''t you get the ITB served with 250 JVMs
    of 4GB each? Of course you could, but because of your organization''s legacy rules
    for the 32-bit JVM days, continue to spin JVMs that are less than 1GB. More realistically,
    though, the notion that JVM may have larger GC pauses is ill conceived. That belief
    is not entirely true, but not completely false either. Yes, pauses will occur,
    but with recent advancements in 64-bit JVM and concurrent mark-sweep (CMS), the
    days of less-pause-sensitive JVMs have arrived. Not only has GC gotten lot better,
    but also the underlying server hardware has gotten better to support 4GB heap
    spaces. In fact, 4GB is a unique and magical number because JVMs these automatically
    treat the 4GB heap space as 32-bit address space within a 64-bit JVM to save on
    memory usage. This is possible because a 32-bit address range is within 4GB. In
    fact, the JVM using the -XX:+UseUncompressedOops option can be applied to Java
    heap spaces up to 32GB.


    After reading this book, you will understand alternatives and workloads suited
    for larger JVMs. Clearly, I am not advocating large JVMs for everyone, but a 4GB
    JVM is really not big anymore. Keep in mind that I am advocating a reasonable
