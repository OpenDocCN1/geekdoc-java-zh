  md: '# Peer-to-Peer Topology


    In the peer-to-peer topology, as shown in Figure 2-5, two or more intercommunicating
    vFabric SQLFire servers form a distributed system. The data is distributed according
    to the data table''s configured redundancy rules.


    > NOTE

    P-to-peer topology is a category 2 type of workload, with a dozen or so SQLFire
    JVMs communicating with each other.


    ![](img/c26bfb34f357e8daa09165d85110e193_60_0.png)


