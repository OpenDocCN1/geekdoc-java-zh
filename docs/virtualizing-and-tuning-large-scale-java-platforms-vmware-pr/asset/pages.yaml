  md: '# vFabric SQLFire Sizing Example


    The preceding sections discussed the critical sizing formulas and constraints
    that dictate sizing of an entire vFabric SQLFire data fabric, and within the data
    fabric how to size the individual vFabric SQLFire members. Consider an example
    from the schema presented in Figure 4-6, the three-step design and sizing process
    on this schema as depicted by Figure 4-5, steps A1, A2, A3, and A4.


    Step 1 of the process followed the same steps as discussed in the section "Step
    A: Determine Entity Groups," where the two customer and product entity groups
    were identified with their associated tables, partitions, replicated, and colocated
    tables.


    The then 2 rules were applied to determine whether roughly 300GB of data represents
    the "raw data transaction" that must be held in vFabric SQLFire to meet the response
    time SLAs. This type of data is also known as *fast data* because it is the portion
    of the RDBMS data that must be delivered to enterprise applications quickly. This
    is data that otherwise has reached its speed and scalability limits in the traditional
    RDBMS and it must be housed in a vFabric SQLFire data fabric to continue to meet
    fast SLAs of the specific data-consuming applications. The 300GB raw data action
    set, after applying redundancy 1, which implies one redundant copy is made available,
    300GB translates to SQLDB * 2 = 600GB. Then when you apply all the other sizing
    formulas, the size translates to approximately 1.1TB. Figure 4-12 shows an illustration
    of how we are taking about 10% of the RDBMS model as current/hot daily transaction
    data and treating it as in-memory data.


    Next, step 3 rules of the design and sizing process are applied to determine how
    to distribute the 1.1TB of data across the vFabric data members. Using a vSphere
    host machine that has 64GB of RAM, two processor sockets of eight cores each,
    approximately the 1.1TB among eight of vSphere hosts.


    At this point, there are two configurations, Option 1 and Option 2, as shown in
    Figure 4-13 and Figure 4-14, respectively. In Option 1, there are 32 VMs, and
    therefore 32 vFabric SQLFire members/JVMs, and 8 vSphere hosts. The VMs in Option
    1 yield a VM configuration of 34GB RAM and 4 vCPUs. In turn, this yields to a
    more optimal VM size that is less than the 32GB mark of the optimal operating
    range of -XX:+CompressedOops for the HotSpot JVM. This option provides the most
    efficient memory footprint by treating the JVM heap pointer addresses as by running
    within a 64-bit JVM. However, the downside of this design is that you have 32
    vFabric SQLFire members/VMs to manage within the cluster, and that need more administration
    attention. If managing a large number of vFabric SQLFire members is a concern,
    Option 2 shown in Figure 4-14, where there are 16 VMs, might be a more viable'
