    # Disk Persistence


    To provide additional data reliability, vFabric SQLFire can persist table data
    to disk as a backup to the in-memory copy or can overflow table data to disk.
    The two disk store options, overflow and persistence, can be used individually
    or together. Overflow uses disks as an extension of in-memory table management
    for both partitioned and replicated tables. Persistence stores a complete copy
    of all table data managed in each peer. Figure 2-12 shows how primary and redundant
    vFabric SQLFire members can persist to an external disk storage.'
