    in-memory databases such as vFabric GemFire and SQLFire, where individual JVM
    members within a cluster can be as large as 128GB and total cluster size can be
    up to 3 TB. With large JVMs comes the need to have a better knowledge of GC tuning.
    At VMware, we have helped many of our customers with their GC tuning activities
    over the years, even though GC tuning on physical is not different from virtual.
    The reason is that we have uniquely integrated the vFabric Java andSphere expertise
    into one spectrum, which has helped our customers optimally run many Java workloads
    onSphere. When faced with the decision of whether to vertically scale the size
    of the JVM and VM, always first consider a horizontal-scale approach; we found
    that our customers get better scalability with a horizontally-scaled platform.
    If horizontal scalability is not feasible, consider increasing the size of the
    JVM memory and hence VM memory. When opting to increase the size of the JVM by
    increasing the heap space/memory, the next point of consideration is GC tuning
    and the in-house knowledge you have to handle large JVMs.


    # NOTE


    With regard to the third limit, as of this writing, ESXi 5.1 is the GA released
    official version; however, by the time this book is published, some of these maximumSphere
    limits might change. Double-check official VMware product documentation for the
    latest maximum. Note, as well, that these VM limits cost-effective hardware would
    need such a large number of vCPUs; however, it is still assuring for those who
    need it.


    As mentioned earlier in this chapter, in the enterprise today large-scale Java
    platforms fall into one of three categories. Figure 1-2 show the various workload
    types and relative scale. A common trend is that as the size of the JVM increases
    so, too, does the required JVM GC tuning knowledge.'
