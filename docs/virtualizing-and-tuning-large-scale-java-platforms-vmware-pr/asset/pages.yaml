  md: '# Why Should I Bother with Virtualization? What Are Some Key Benefits?


    Perhaps 5 years ago, we still had some customers asking the “why virtual” question.
    In recent years, though, the benefits of virtualization have become widely understood
    as virtualization has pretty much become the standard. This standard is based
    on VMware virtualization technology, mostly because of its robustness and its
    fifth-generation maturity.


    Virtualization offers the following key benefits:


    +   **Mature, proven, and comprehensive platform:** VMware vSphere (http://www.vmware.com/products/datacenter-virtualization/vphere/overview.html)
    fifth-generation virtualization (many years ahead of any alternative). It delivers
    higher reliability, more advanced capabilities, and greater performance than competing
    solutions.


    +   **High application availability:** High-availability infrastructure remains
    complex and expensive. But VMware integrates robust availability and fault tolerance
    right into the platform to protect virtualized applications. Should a node or
    server ever fail, the VMs are automatically restarted on another machine.


    +   **Wizard-based guides for ease of installation:** VMware''s wizard-based guides
    take the complexity out of setup and configuration. You can be up and running
    in one-third the deployment time of other solutions.


    +   **Simple, streamlined management:** VMware lets you administer both your virtual
    and physical environments from a “single pane of glass” console on your web browser.
    Time-saving features such as auto-deploy, dynamic patching, and live VM migration
    reduce tasks from hours to minutes. Management becomes much faster and easier,
    boosting productivity without adding to your headcount.


    +   **Higher reliability and performance:** Our platform brings CPU and memory
    innovations with a compact, purpose-built hypervisor that eliminates the frequent
    patching, maintenance, and I/O bottlenecks of other platforms. The result is best-in-class
    reliability and consistently higher performance (for heavy workloads, two-to-one
    and three-to-one advantages over our nearest competitors).


    +   **Greater savings:** VMware outperforms virtualization solutions by providing
    50% to 70% higher VM density per host—elevating per-server utilization rates from
    15% to as high as 80%. You can run more applications on less hardware than with
    other platforms, for significantly greater savings in capital and operating costs.'
