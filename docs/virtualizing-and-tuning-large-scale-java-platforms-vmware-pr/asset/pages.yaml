  md: '# CHAPTER 1 Introduction to Large-Scale Java Platforms


    The NUMA client calculation to something more granular. The NUMA client calculation
    is controlled by NUMA.vcpu.maxPerClient, which can be set as Advanced Host Attributes
    -> Advanced Virtual NUMA Attributes, and if you were to change this to 2, then
    effectively every socket in our example will have three NUMA clients, so the fifth
    2vCPU VM will be scheduled across two NUMA clients, and potentially across two
    sockets if needed. You seldom need to get to this level of tuning, but this example
    illustrates the power of the NUMA algorithm within vSphere, which far exceeds
    any nonvirtualized Java platforms.


    In general, a virtual machine is powered on, ESXi assigns it a home node as part
    of its placement algorithm. A virtual machine runs only on processors within its
    home node, and its newly allocated memory comes from the home node. Unless a virtual
    machine''s home node changes, it uses local memory, avoiding the performance penalties
    associated with remote memory accesses to other NUMA nodes. When a virtual machine
    is powered on, it is assigned an initial home node so that the overall CPU and
    memory load across NUMA nodes remains balanced. ESXi determines these internode
    latencies at boot time and uses the information when initially placing virtual
    machines that are wider than a single NUMA node. These wide virtual machines are
    placed on NUMA nodes that are close to each other for lowest memory access latencies.
    Initial placement-only approaches are usually sufficient for systems that run
    only a single workload, such as a benchmark configuration where remains unchanged.
    However, this approach cannot guarantee performance and fairness for a datacenter-class
    system that supports changing workloads. Therefore, in addition to initial placement,
    ESXi 5.0 does dynamic migration of virtual CPUs and memory between NUMA nodes
    for improving CPU balance and increasing memory locality. ESXi combines the traditional
    initial placement with a dynamic rebalancing algorithm. Periodically (every two
    seconds by default), the system examines the nodes and determines whether it should
    rebalance the load by moving a virtual machine from one node to another.


    This calculation takes into account the resource settings for virtual machines
    and resource pools to improve performance without violating fairness or resource
    entitlements. The rebalancer selects an appropriate virtual machine and changes
    its home node to the least loaded node. When it can, the rebalancer moves a virtual
    machine that already has some memory on the destination node. From that point
    on, the virtual machine allocates memory on its new home node and runs only on
    processors in the new home node. Rebalancing is an effective solution to maintain
    fairness and ensure that all nodes are fully used. The rebalancer might need to
    move a virtual machine to a node where it has allocated little or no memory. In
    this case, the virtual machine incurs a performance penalty associated with a
    large number of remote memory accesses. ESXi can eliminate this penalty by transparent
    migrating memory from the virtual machine''s original node to its new home node.'
