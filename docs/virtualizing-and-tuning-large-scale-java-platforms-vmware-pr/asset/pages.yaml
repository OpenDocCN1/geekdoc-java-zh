    # Impact of Adjusting -Xmn


    The most critical JVM option is by far -Xmn, the young generation size. Consider
    the impact of reducing or increasing -Xmn. This section presents a description
    of the young generation internal cycle, and the impact of adjusting it:


    +   **Understanding the young generation GC cycle:** All objects are created in
    the Eden space. When minor GC occurs, the Eden space is completely cleaned, and
    all objects that survive are moved to the first survivor space S0. After some
    time, when another minor GC takes place, Eden space is cleaned again, and more
    survivors are moved to the survivor space, with some copying between survivor
    space S0 and S1. Therefore, it is critical to have ample space for Eden and sufficient
    space for survivor space. As mentioned previously, make the preliminary assumption
    that a SurvivorRatio of 8 is adequate for SurvivorSpaceSize.


    +   **Understanding the impact of reducing or increasing young generation size
    -Xmn:** If you determine that the duration of the minor GC is too long and pausing
    longer than the application threads can tolerate (by long application response
    times), it is appropriate to reduce the value of -Xmn. A long duration or pausing
    in minor GC is an indication of young generation being too large for your application.


    In Example 3-1, -Xmn is about 33% of -Xmx, which is a good starting point, and
    it depends on the scale of the heap. In smaller-JVM heap sizes less than 8GB,
    33% might make sense, but as you get to larger sizes (for example, 33% of 64GB
    implies -Xmn is 21GB, which is a significant amount of space), the 33% rule might
    make less sense.'
