    # GC Policy Selection


    Having seen much GC tuning guidance and various memory sizing considerations,
    it is important to pause for a minute and summarize. There are many GC policies
    from the various vendors, such as Oracle (HotSpot JVM and jRockit) and IBM (J9
    JVM), but all offer similar GC policies, with slight variations. Almost all of
    these policies compromise the impact of reducing latency to yield better response
    time but at the cost of memory throughput reduction, or conversely increase the
    impact of latency and thus response time for the benefit of pushing better memory
    throughout. Figure 6-7 shows this comparison and a few pros and cons.


    Within the Oracle HotSpot JVM, there are essentially four policies, as shown in
    Table 6-10. The most significant are the throughput parallel collectors and CMS.
    Both of these are used on enterprise class category 1 and 2 workloads.


    +   - improved R/T

    - reduce latency impact

    - slightly reduced throughput


    Tuning

    Decisions


    +   - improved throughput

    - longer R/T

    - increased latency

    -impact


    Increase

    Throughput


    Reduce

    Latency


