    # Why would I choose to virtualize enterprise Java applications?”


    You can improve the efficiency and availability of IT resources and applications
    through virtualization.


    Start by eliminating the “one server, one application” model and run multiple
    VMs on each physical machine. Free your IT administrators from spending so much
    time managing servers rather than innovating. About 70% of a typical IT budget
    in a nonvirtualized data center goes toward just maintaining the existing infrastructure,
    with little left for innovation.


    # Are there any performance issues?”


