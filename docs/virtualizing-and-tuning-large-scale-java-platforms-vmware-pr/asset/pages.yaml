  md: '# vFabric SQLFire Best Practices on vSphere


    vFabric SQLFire and vSphere provide a robust complement to deliver data faster
    and more reliably using x86 cost-effective commodity hardware and vSphere. Table
    6-9 describes recommended best practices when virtualizing vFabric SQLFire. This
    would also apply to any latency-sensitive in-memory workloads (in-memory databases)
    that have excessive network traffic and are memory bound.


    Table 6-9 vFabric SQLFire Best Practices on vSphere


    | Best Practice | Description |

    | --- | --- |

    | BP 44: Enable hyperthreading and do not overcommit CPU. | Always enable hyperthreading;
    vFabric SQLFire applications are typically latency sensitive that are CPU bound.
    Size based on the available physical cores.<br><br>For most production vFabric
    SQLFire servers, always size with a minimum of 2-vCPU NUMAs. However, larger 8-vCPU
    VMs might be necessary in some cases to achieve your SLAs.<br><br>Apply NUMA locality
    by sizing VMs to fit within the NUMA node. If you suspect the VM has poor NUMA
    locality, inspect the N%L counter from estop. With good NUMA locality, this should
    be 100%. |


    Note The terminology of NUMA node is equivalent to 1 CPU socket. So, for a server
    with 2 sockets, there are 2 NUMA nodes. Therefore, the available number of physical
    CPU cores and RAM are divided equally among the NUMA nodes. This is critical when
    sizing VMs to fit within one NUMA node. Refer to Figure 4.9 in Chapter 4 and the
    discussion of NUMA locality.


    For example, a 2-socket 16-core (8 cores on each socket) server with 192GB RAM
    has two NUMA nodes, each with 8 physical cores (CPUs) and 96GB RAM (1/2). When
    sizing VMs, it is important not to exceed the limits of 8 vCPUs and 96GB RAM.
    Exceeding any of these CPU and RAM maximums of each NUMA node can force the VM
    to fetch memory from a remote location, impacting performance. There are many
    vSphere CPU scheduler enhancements to avoid this, but following this example can
    help.'
  merge: -1
