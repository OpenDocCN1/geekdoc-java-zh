  md: '+   Concurrent sweeping (nonpausing): Start of sweeping of dead objects and
    where sweeping is a concurrent phase performed with all other threads.


    Figure 3-1 is a graphical representation of the configurations that use a combination
    of -XX:ParNewGC in young generation and CMS in old generation. Figure 3-1 shows
    the young generation in the blue box, sized by the -Xmn and configured to have
    -XX:ParNewGC and -XX:ParallelGCThreads. The minor GC threads run as blue arrows,
