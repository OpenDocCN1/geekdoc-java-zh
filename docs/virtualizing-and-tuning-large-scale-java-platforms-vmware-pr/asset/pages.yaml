  md: 'Figure 6-2 shows an example of category 2 workload, the characteristics of
    which are as follows:


    +   - Category 2 vSphere clusters usually consist of fewer than 20 JVMs.

    - The JVMs tend to be very large (32 to 128GB).

    - Always deploy VM for Non-Uniform Memory Access (NUMA) node and fit perfectly.

    - One JVM per VM; avoid JVM stacking

    - Choose two-socket vSphere hosts and install ample memory (128 to 512GB). This
    naturally gives you the largest NUMA banks for the same price point on RAM.

    - An example of a category 2 workload is an in-memory database, like SQLFire and
    GemFire.

    - Apply latency-sensitive best practices (BPs) by disabling interrupt coalescing
    at the physical network interface card (pNIC) and the virtual interface card (vNIC).

    - A dedicated vSphere cluster should be used, because every vSphere host has to
    be tuned to disable interrupt coalescing; other workloads sharing the same cluster
    not benefit from this. Hence, a dedicated vSphere cluster is advisable.


