  md: '# Large-Scale Java Platform Technical Considerations


    specific instance where you were comparing and contrasting platform design and
    were trying to choose between 100 JVMs versus 150 JVMs, with both cases of 100
    and 150 JVMs having the same net RAM. Clearly, the system with 150 JVMs will have
    the better flexibility and scalability. In the 150 JVM scenario, because you have
    more JVMs, it is likely that the size of the JVM is smaller compared to a system
    that has 100 JVMs. In this case, if a JVM from the 150 JVM platform encounters
    a problem, likely the impact is smaller because the JVM holds less data than the
    100 JVM scenario. So, the scale-robustness of the 150 JVMs will prove to be more
    prudent.


    If the system has been refined, the horizontal scalability advantages assumed
    previously apply. Refined here means that VM and JVM best practices have been
    applied based on a 64-bit JVM architecture having a reasonable-size JVM with an
    approximate minimum of 4GB heap space, and not fragmented legacy a 32-bit JVM
    limit of 1GB heap space. (Some legacy 32-bit JVMs could withstand greater than
    1GB, but for practical use, 32-bit JVMs have a legacy 1GB limit.)


    # Option 1 Cons


    This option is expensive because it leads to having more operating system copies,
    and licensing becomes expensive quite quickly. Administering such a system is
    more expensive because there are more VMs and JVMs to keep track of.


    No technical reason requires you to place one JVM on one VM. The only exception
    is in the case of systems that are in-memory databases (like category 2) that
    require high throughput memory from the local NUMA node. In those cases, the VMs
    are sized to fit within the NUMA node and will have only one JVM on them. Also
    note that the JVMs in in-memory databases tend to be quite large, as big as 128GB,
    as opposed to category 1 JVM sizes (typically 1 to 4GB heap space). In such as
    option 1, however, which are essentially in category 1 (as defined earlier in
    this), you have many opportunities to consolidate the JVMs and eliminate wasteful
    JVMs and VM instances.


    This is a common pattern among legacy 32-bit JVMs, where the 1GB limit of the
    32-bit JVM would have forced Java platform engineers to install more JVM instances
    to deal with increases in traffic. The downside is that you are paying for additional
    CPU/licenses. If you consolidate VMs by migrating to 64-bit JVMs and increasing
    the heap at the same time, you will save by having fewer JVMs servicing the same
    amount of traffic. Of course, the JVM size will likely increase from, for example,
    1GB to 4GB.


    # Option 2


    Option 2 involves scaling up the JVM heap size by consolidating fragmented smaller
    JVMs and also as a result consolidate VMs.'
