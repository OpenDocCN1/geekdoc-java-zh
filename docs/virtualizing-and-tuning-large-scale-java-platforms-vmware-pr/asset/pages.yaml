  md: '# Redundancy Zones


    In vFabric SQLFire, you can set up various redundancy zones so that replicas (or
    redundant copies) are not placed on the same physical hardware. You can set the
    redundancy-zone boot property of each vFabric SQLFire member to a specific redundancy
    zone name. It is common practice for these redundancy-zone names to resemble those
    of the underlying physical hardware, so that no redundant vFabric SQLFire members
    are placed on the same physical hardware/server machine as their original partition
    member.


    # Global Multisite Topology


    In vFabric SQLFire, you can set up a multisite topology that can span multiple
    data centers, for active-active, disaster recovery, and WAN distribution types
    of arrangements. You can set up a single data fabric that spans multiple sites
