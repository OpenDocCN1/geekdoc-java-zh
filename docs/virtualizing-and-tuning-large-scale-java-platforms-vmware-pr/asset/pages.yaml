  md: '# SizingvFabric SQLFire Java Platforms: Category 2 Workloads


    # NOTE


    Entity groups are logical design constructs that percolate the query usage patterns
    within the application and the schema. It is kind of grouping of various queries
    and trying to relate them to a handful of tables that are always accessed. Another
    perspective is that entity groups are a way of categorizing the access patterns
    (SQL queries) within the application to determine how the database schema is being
    used. With this information, you can establish an appropriate indexing/partitioning
    strategy. The general exercise is to determine the root primary keys that link
    all the queries or set of queries, and then use such top-level common primary
    keys by partition-by.


    # Step A: Determine Entity Groups


    The process of determining entity groups helps with establishing the partitioning
    strategy and iteratively determining how much data to keep in memory within the
    vFabric SQLFire data fabric. This method of establishing entity groups for your
    schema is a helpful design-time technique for large schemes or multiple serving
    different lines of business and data access patterns. Customers often refer to
    the vFabric SQLFire data as daily transactional data, 1 to 10 days'' worth, or
    in some cases depending on the use case being implemented. After this size is
    determined, you can determine the appropriate entity groups. The process of selecting
    what portion of the transactional data to keep and entity group selection is an
    iterative process.


    Step A can be further detailed as substeps A1, A2, A3, and A4, as outlined in
    Figure 4-5.


