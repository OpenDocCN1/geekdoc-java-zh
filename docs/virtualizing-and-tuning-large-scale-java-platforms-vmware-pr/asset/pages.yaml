    # Best Practice 3: Peer-to-Peer Multihomed Machines


    +   - An intercommunicating set of vFabric SQLFire servers that do not have clients
    accessing them, or only a very few (example, session-hop data, web content, back
    office, or back-end type of processing providing a single-hop access pattern to
    data).

    - Applications requiring a few peer clients (as opposed to hundreds in client/server
    topology) can be good candidates for peer-to-peer topology. Deploying many peers
    increases the buffering and socket outlet for every member.

    - More convenient from an administration and management perspective. With an embedded
    cluster, there is no need to manage any external processes to deploy vFabric SQLFire
    servers. For example, if you embed vFabric SQLFire in a cluster of Java application
    servers, each application server and the associated vFabric SQLFire share the
    same process.

    - If running on multihomed machines, you can specify a nondefault network adapter
    for communication. In multicast peer-to-peer situations, communication uses the
    bind-address property. This address must map to the same subnet for all vFabric
    SQLFire servers within the distributed system.'
