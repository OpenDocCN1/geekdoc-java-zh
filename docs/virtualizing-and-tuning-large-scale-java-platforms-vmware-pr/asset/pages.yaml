  md: '# Performance Studies


    This chapter looks at several performance studies that showcase performance capabilities
    of Java platforms.


    # SQLFire Versus RDBMS Performance Study


    Several customers have asked what vFabric SQLFire can do for their Java applications
    and how they can modify the architecture of the application accordingly. These
    customers typically run custom Java applications against relational database management
    systems (RDBMS) that have reached the limits of scalability and response time
    with their current architecture. They want to make the changes only if they are
    not too invasive.


    To answer these questions fairly, a customer scenario was simulated with no specific
    assumptions about specialized tuning. This is essentially what a software engineer
    might attempt when conducting an evaluation of vFabric SQLFire versus other RDBMS.
    First, a load test was run against Spring Travel with RDBMS as is. Then the Spring
    Travel schema was converted to run against vFabric SQLFire, also without tuning,
    and the results were plotted side by side, as shown in Figure 5-1.


    To demonstrate how quickly this change could be made without assumptions about
    any code intrusion/change, it was simulated that a developer might download the
    Spring Travel application, run the DDLUtils conversion utility to generate the
    vFabric SQLFire schema and the data load file, and then quickly test to see the
    performance improvements.'
  merge: -1
  pgno: 154
