    Coding practices don’t change for Java on vSphere versus Java on native.


    All tuning that you would have done for your Java on native is reusable for Java
    on vSphere.


    Most Java workloads virtualize readily, but in some instances, for very large
    transactions, CPU and memory constraints may apply. See Chapter 3, “Tuning Large-Scale
    Java Platforms,” and Chapter 4, “Designing and Sizing Large-Scale Java Platforms,”
