  md: '# Table 6-10 Oracle HotSpot JVM Policy Types


    | GC Policy Type | Description |

    | --- | --- |

    | Serial GC | Mark, sweep, and compact algorithm.<br>Both minor and full GC are
    stop-the-world threads.<br>Stop-the-world GC means that the application is stopped
    while GC is executing.<br>Not very scalable algorithm.<br>Suited for smaller <
    200MB JVMs (for example, client machines). |

    | Throughput GC (ParNewGC) | Parallel GC.<br>Similar to serial GC, but uses multiple
    worker threads in parallel to increase throughput.<br>Both young and old generation
    collection are multithreaded, but still stop-the-world.<br>The number of threads
    allocated by -XX:ParallelGCThreads=nThreads.<br>Not concurrent, meaning that when
    the GC worker threads run, they will pause your application threads. If this is
    a problem, move to CMS, where GC threads are concurrent. |

    | Concurrent GC (CMS) | Concurrent mark and sweep. Note that this is not a compacting
    collector.<br>Concurrent implies that when GC is running it doesn''t pause your
    application threads; this is the key difference from throughput/parallel GC.<br>Suited
    for applications that care more about response time than throughput.<br>CMS does
    use more heap when compared to throughput/ParallelGC.<br>CMS works on the old
    generation concurrently, but the young generation is collected using ParNewGC,
    a version of the throughput collector.<br>Has multiple phases:<br>Initial mark
    (short pause)<br>Concurrent mark (no pause)<br>Precleaning (no pause)<br>Re-mark
    (short pause)<br>Concurrent sweeping (no pause) |

    | G1 | Only in J7 and mostly experimental; it is equivalent to CMS + compacting.|'
