    However, if the workload is extremely sensitive to latency, VMware recommends
    that you disable virtual interrupt coalescing for VMXNET3 virtual NICs as follows.

    Use VMware Programmatic APIs to add the special VM configuration options as defined
    in "VMware vSphere Web Services SDK Documentation" (http://www.vmware.com/support/developer/vc-sdk/).
    Refer to the vSphere API Reference, under the VirtualMachine Managed Object Type,
    for the OptionValue[] extraConfig property of the VirtualMachineConfigInfo To
    do manually, first power off the VM. Edit your .vmx configuration file and locate
    the entries for VMXNET3, as follows:

    ```

    ethernetX.virtualDev = "vmxnet3"

    ethernetX.coalescingScheme = "disabled"

