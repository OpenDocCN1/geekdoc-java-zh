  md: '# Best Practice


    # Description


    BP 33: vSphere storage.


    Note: Typically, category 1 type of Java workloads are more CPU and memory bound
    and less storage bound, unlike databases. In category 2, for example, in-memory
    databases will track both like a Java workload and a database workload, hence
    CPU, memory, and storage best practices are key.


    VMware recommends a minimum of four paths from an ESX host to a storage area,
    which means the host requires at least two HBA ports.


    Follow vSphere best practices, refer to http://www.vmware.com/files/pdf/technical/SAN_Design_and_Deployment_Guide.pdf


    BP 34: vSphere host.


    Disable any other power-saving mode in the BIOS.


    NUMA considerations: IBM (X-Architecture), AMD (Opter-based), and Intel (Nehalem)
    Non-Uniform Memory Access (NUMA) systems are supported by vSphere. On AMD ProLiant
    DL585 Server, BIOS settings for node interleaving determine whether the system
    behaves like a NUMA system or a Uniform Memory Access (UMA) system.


    By default, vSphere NUMA scheduling and related optimizations are enabled only
    on systems with a total of at least 4 CPU cores and with at least 2 CPU cores
    per NUMA node.


    VMs with a number of vCPUs equal to or less than the number of cores in each NUMA
    node are managed by the NUMA scheduler and have the best performance.


    Hardware BIOS: Verify that the BIOS is set to enable all populated sockets, and
    enable all cores in each socket.


    Enable turbo mode if your processors support it.


    Make sure hyperthreading is enabled in the BIOS.


