    # # Enterprise Java Applications on vSphere Best Practices (Category 1)


    This section outlines the BPs as they pertain to category 1 virtualized Java platforms.


    # ## VM Sizing and Configuration Best Practices


    Enterprise Java applications are highly customizable, and consequently a performance
    test has to be conducted to establish best sizing.


    It is a best practice to establish the size of your VM in terms of vCPU, memory,
    and how many JVMs are needed by conducting a thorough performance test that mimics
    your production workload profile. The resulting VM from the vertical scalability
    (scale-up) performance test is referred to as the building block VM. The building
    block VM is a good candidate template from which scaled-out (horizontally scaled)
    VMs can be based.'
  merge: -1
