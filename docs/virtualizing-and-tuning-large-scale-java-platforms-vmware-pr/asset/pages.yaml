  md: 'Clients use two or more fault-tolerant locator processes that provide vFabric
    SQLFire member location services. The vFabric SQLFire locator process tells new
    connecting peers and then clients how to connect to existing peers who are already
    running. Locators perform both load balancing and dynamic load conditioning of
    thin client connections to vFabric SQLFire members in a client/server deployment.


    # Best Practice 2: Client/Server Topology


    Client-server topology is the most commonly used for enterprise-class applications.
    When tens to thousands of enterprise client applications need to consume data
    from the vFabric SQLFire data management system, a client/server topology is the
    most appropriate. In client server topology, the clients have full access to the
    data and can manipulate the data without needing to be part of the vFabric SQLFire
    in-memory data management system.


    In this topology, and specifically in production deployments, -mcast-port=0 to
    turn off multicast discovery and instead use the locator approach to locate vFabric
    SQLFire members.


    Always make vFabric SQLFire locators highly available by having separate instances
    running on separate physical machines within the vFabric SQLFire system. Supply-locators
    on the command line with a comma-separated list of all possible locators.


    Use client/server topology when any of the following are requirements of an enterprise-class
    application:


    +   **Dynamic server discovery**: The vFabric SQLFire server locator utility dynamically
    tracks servers and directs clients to new servers, giving clients indirection
    from explicit cluster membership information. Clients need to know how to connect
    to the locator services. They do not need to know where data servers are running
    or how many data servers are available at a given time.


    +   **Server load balancing**: The vFabric SQLFire server locator tracks current
    load information for all servers, directing new client connections to the servers
    with the least load. vFabric SQLFire provides a default load probe for your servers.
    To customize the algorithm by which server load is calculated, you can implement
    your own plug-in.


    +   **Server connection conditioning**: Client connections can be configured to
    be leased transparently and potentially be moved to different servers, which allows
    overall server utilization to be rebalanced after new servers are started. This
    helps speed conditioning in situations as adding servers or recovery from server
    crashes and other downtime.'
