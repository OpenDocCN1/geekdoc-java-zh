  md: '# “How JVMs can I stack on a single VM, and how many vCPUs should the VM use?”


    This depends on your application’s transactional throughput. VMware recommends
    that performance load test your application to determine your optimal ratio for
    the number of JVMs, number of VMs, and number of vCPUs on each VM. Also refer
    to Chapter 3 and Chapter 4.


    # “Which application servers have been proven on vSphere in production?”


    No specific application server works better with vSphere; all are good candidates.
    As many VMware customers have demonstrated, their Java environments virtualize
    well in dev, test, and production. We find the most commonly used application
    servers are Oracle WebLogic, IBM WebSphere, JBoss, Tomcat, and vFabric to, which
    are all good examples of easily virtualized application servers, along with many
    others.


    # “What kind of testing has been done to validate running WebLogic on vSphere?”


    We have several customers that have done independent performance testing of WebLogic
    running on vSphere in the insurance and hospitality industries. The results they
    achieved were equal to native in the cases of apples-to-apples comparisons, and
    in some cases performance was even better due to slight re-architecture of the
    deployment, Java version upgrade, and hardware upgrade.


    # “Which web servers have been proven on vSphere in production?”


    It has been demonstrated that both Apache Web Server and Microsoft Internet Information
    Services (IIS) run well on vSphere and in production.'
