  md: '# SQLFire Features


    (DBAs) would be familiar with this mechanism as applied on tables that get beyond
    a certain manageable performing size, which would split the tables into multiple
    tables and so on. In a similar manner, SQLFire uses a portioning mechanism to
    do similar splitting of the data, although instead of strictly across disk space
    as in an RDBMS, SQLFire splits across multiple SQLFire member JVMs (but, of course,
    with the ability to write to disk with additional persistence guarantees). You
    specify the partitioning strategy of a table in the PARTITION clause of the CREATE
    TABLE statement. The available strategies include hash partitioning on each row''s
    primary key value, hash partitioning on column values other than the primary key,
    range partitioning, and list partitioning. SQLFire maps each row of a partitioned
    table to a logical bucket. The mapping of rows to buckets is based on the partitioning
    strategy that you specify. For example, with hash partitioning on the primary
    key, SQLFire determines the logical bucket by hashing the primary key of the table.
    Each bucket is assigned to one or more members, depending on the number of copies
    that you configure for. Configuring a partitioned table with one or more redundant
    copies of data ensures that partitioned data remains available even if a member
    is. When members are added or removed, the buckets are reassigned to new members
    based on load. Losing a member in the cluster never results in reassining rows
    to buckets. You can specify the total number of buckets to use with the BUCKETS
    clause of the CREATE TABLE statement. The default number of buckets is 113.


    +   - Redundancy: This is the capability of nominating how many copies of the
    data you want SQLFire to manage for you. In production systems, a minimum of redundancy
    of one is usually expected. Redundancy is an in-memory additional copy of the
    partitioned data.


    +   - Colocation: For example, if two tables are always joined to formulate a
    business query, colocation is used to have the primary and foreign key section
    of the data located within the same partition so that queries are executed within
    one SQLFire member JVM that contains all the data needed.


    +   - Disk persistence: You can specify the data to be copied to the disk for
    additional resiliency.


    +   - Transactions: Capability to control data consistency by optimistically locking
    data at in-memory commit time. This is one of the key features that makes SQLFire
    a database.


    +   - Cache plug-in: Capability to execute custom business logic in the scenario
    that there is a cache-miss.


    +   - Listeners: in vFabric SQLFire, you can implement any number of listeners
    that can be triggered based on certain SQL DML operations that an application
    executes.'
