  md: '# Best Practice


    # Description


    BP 19: VM memory sizing (continued). For example, if -Xmx is set to 4GB, as in
    -Xmx4g, the Java process may likely require 4.5GB (This number included the heap
    and the off-the-heap section). Then, allowing at least 0.5GB for the OS, the total
    memory reservation for the VM that has this single JVM on it is 5GB reservation.


    If you have multiple JVMs (n JVMs) on a VM, VM memory = Guest OS memory + N JVM
    memory.


    It is recommended that you do not overcommit, because the JVM memory is an active
    space where objects are constantly being created and garbage collected. Such an
    active space requires its memory to be available all the time. If you overcommit,
    memory ballooning or swapping may occur and impede performance.


    An ESX host employs two distinct techniques for dynamically expanding or contracting
    the amount of memory allocated to VMs. The first method is known as memory balloon
    driver (vmemcti). This is loaded from the VMware Tools package into the guest
    OS running in a VM. The second method involves paging from a VM to a server swap
    file, without any involvement by the guest OS.


    In the page swapping method, when you power on a VM, a corresponding swap file
    is created and placed in the same location as the VM configuration file (.vmx
    file). The VM can power on only when the swap file is available. ESX hosts use
    swapping to forcibly reclaim memory from a VM when no balloon driver is available.
    The balloon driver may be unavailable either because VMware Tools is not installed
    or because the driver is disabled or not running. For optimum performance, ESX
    uses the balloon approach whenever possible. However, swapping is used when the
    driver is temporarily unable to reclaim memory quickly enough to satisfy current
    system demands. Because the memory is being swapped out to disk, a significant
    performance penalty applies when the technique is used. Therefore, it is recommended
    that the balloon driver is always enabled; however, monitor to verify that it
    is not getting invoked as that memory is overcommitted.


    Both ballooning and swapping should be prevented for Java applications. To prevent
    ballooning and swapping, refer to BP 20: Set memory reservation for VM memory
    needs.'
