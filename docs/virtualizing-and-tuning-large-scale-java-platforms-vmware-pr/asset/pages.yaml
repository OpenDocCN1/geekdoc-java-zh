  md: '# Modern Scalable Data Platforms


    Although you can modernize application architectures in various ways, the key
    trends are as follows:


    +   - Modernizing application architectures around the flexibility offered by
    the Spring Framework


    +   - Modernizing data


    As data modernization, many different approaches exist. This chapter focuses mainly
    on the increasing trend of using horizontally scalable in-memory databases to
    improve scalability and response times. VMware vFabric SQL is used here to illustrate
    the capabilities of an in-memory data management system that you can use to build
    horizontally scalable but also disk-persistent data fabric.


    > NOTE

    Discussing such workloads will also help Java platform engineers to hone their
    Java platform tuning abilities. These types of in-memory database workloads consist
    largely of category 2 workloads. Depending on which topology you choose, however,
    you might also have to deal with category 3 workloads. Understanding how to tune
    such systems will enable you to handle the hardest tuning tasks that you may encounter.
    Before delving into deep tuning, though, it is best to first understand the functionality
    of such types of workloads.'
