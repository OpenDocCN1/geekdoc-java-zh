    For simplicity, you can assume a 1:1 ratio, and add some room to reduce potential
    contention or a race for DB connections.<br>Deadlock can occur if the application
    requires more than 1 concurrent connection per thread and the database pool is
    not large enough for the number of threads. Suppose that each of the application
    requires 2 concurrent database connections and that the number of threads is equal
