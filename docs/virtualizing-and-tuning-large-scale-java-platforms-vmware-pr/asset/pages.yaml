  md: 'The following note describes how to navigate vCenter advanced performance charts.


    # NOTE


    You can view CPU, memory, disk, and network statistics for an object in the advanced-performance
    charts. These charts support additional data counters not supported in the over-view
    performance charts.


    When connected directly to an ESX/ESXi host, the advanced performance charts display
    real-time statistics and past-day statistics. To view historical data, the vSphere
    Client must be connected to a vCenter Server system.


    To access the advanced performance charts, follow these steps:


    +   - Select a host, cluster, resource pool, or VM in the Inventory panel.


    +   - Click the Performance tab.


    +   - Click Advanced.


    To view a different chart, select an option from the Switch To list. The default
    charts are configured to show the following information:


    +   - **CPU**: Shows the CPU usage in megahertz (MHz). Available for clusters,
    resource pools, hosts, and VMS.


    +   - **Memory**: Shows the amount of memory granted. Available for clusters,
    resource pools, hosts, and VMS.


    +   - **Disk**: Shows the aggregated storage performance statistics. Available
    for hosts and VMS.


    +   - **Network**: Shows the aggregated network performance statistics. Available
    for hosts and VMS.


    The amount of historical data displayed in a chart depends on the collection interval
    and collection level set for vCenter Server.


