  md: '# SizingvFabric SQLFire Java Platforms: Category 2 Workloads


    The following values are used in Figure 4-15:


    +   - The guest OS memory is approximately 0.5GB–1GB (depending on the operating
    system and other processes).


    +   - -Xmx is the JVM maximum heap size set to 30GB.


    +   - -Xss is the Java thread stack size. The default is dependent on the operating
    system and JVM, but in this case is set to 1MB.


    +   - Perm Size is an area additional to the -Xmx (maximum heap) value and contains
    class-level information.


    +   - Other Mem is additional memory required for NIO buffers, JIT code cache,
    class loaders, socket buffers (receive/send), JNI, and GC internal information.


    +   - VM memory for vFabric SQLFire = Guest OS memory + JVM memory for vFabric
    SQLFire.


    To set the sizes, follow these steps:


    +   1. Set -Xmx30g, and set -Xms30g.


    +   2. Set -XX:MaxPermSize=0.5g. This depends on the memory footprint of the class-level
    information within your Java application code.


    +   3. The other segment of NumberOfConcurrentThreads * (-Xss) depends largely
    on the NumberOfConcurrentThreads the JVM will process and on the -Xss value you
    have chosen.


    > NOTE

    Xss is dependent on the operating system and JVM. In most cases, the default is
    256K on HotSpot JVM running on a Linux OS, and could be as high as 1MB on Windows-based
    OS. If the stack is not sized correctly, you may get a StackOverflow error. If
    you see this exception, you should increase the size of the stack or investigate
    the case. Memory-sensitive workloads that consume much greater than 256K (for
    example, in the range of 1 to 4MB) can benefit from having this larger -Xss. The
    key here is that objects allocated within these larger stacks do not escape to
    other threads. As an example, we chose a 1MB stack size, 500 threads * 1MB =>
    500MB => 0.5GB.


    +   4. Assume the operating system has a requirement of 1GB.


    +   5. Total JVM memory (Java process memory) = 30GB (-Xmx) + 0.5GB (-XX:MaxPermSize)
    + (500*1MB = NumberOfConcurrentThreads * -Xss) + Other Mem.'
