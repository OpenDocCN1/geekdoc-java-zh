    # Best Practice 4: Multisite


    +   - Each distributed system in a multisite configuration operates independently
    of other connected systems. Tables that are configured for replication between
    sites must be created using identical table names and column definitions. In addition,
    gatewaysenders and receivers must be configured to assign logical gateway connections
    to physical network connections in each system. For each table that is configured
    to use a gateway sender, data manipulation language (DML) events are automatically
    forwarded to the gateway sender for other sites. The events are placed in a gateway
    queue and distributed asynchronously to remote sites. Inserts/updates and deletes
    are sent across the other sites, except when the delete is part of an expiration
    or eviction. However, queries, data definition language (DDL), transactions, and
    expirations are not distributed to the remote sites.


    +   - Each vFabric SQL distributed system that participates in WAN replication
    must use one or more locators for member discovery. WAN replication is not supported
    with multicast discovery.


    +   - WAN deployments increase the demands on a vFabric SQLFire system. To avoid
    connection starvation related to WAN messaging, always set conserve-sockets=false
    for vFabric SQLFire members that participate in a WAN deployment.


    +   - WAN-enabled tables must be present in each distributed system that you want
    to connect.


    +   - You can configure both partitioned tables and replicated tables to use a
    gateway sender. However, you must create replicated tables in the same server
