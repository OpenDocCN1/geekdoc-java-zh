  md: '# Preface


    This is the culmination of 9 years of experience in running Java on VMware vSphere,
    both at VMware and at many of VMware''s customers. In fact, many VMware customers
    run enterprise-critical Java applications on VMware vSphere and have achieved
    better total cost of ownership (TCO) and service level agreements (SLAs). In my
    first book, Enterprise Java Applications Architecture on VMware, the topic of
    Java virtualization was covered well, both from a high-level architecture perspective
    and with in-depth technical chapters on sizing and best practices. To keep that
    first book more affordable, a decision was made to hold back some of the chapters
    for a second book, what you are reading now. These two books are complementary
    in many ways. The first book has a few high-level chapters for architects, engineers,
    and managers considering Java virtualization for the first time and asking the
    high-level question “why”. This book is all about how and what to tune for optimal
    performance.


    Limiting the scope of the first book was a good idea; the book was made available
    quickly for launching your first Java virtualization projects. It has already
    been 2 years since the release date of that book, and since then nearly 300 customer
    interactions have helped further analyze the guidance offered. Some of these interactions
    have included large-scale Java platforms of significant scale and have significantly
    contributed to the greater level of detail in this book. This book discusses the
    sizing and tuning of both small-scale and large-scale virtualized Java platforms—100
    Java Virtual Machines (JVMs) to 10,000 JVMs and a JVM heap range of 1 to 128GB.
    This recent experience, combined with my 15 years of tuning Java platforms, is
    presented in this book in such way to summarize what is most practical and immediately
    applicable to the vast majority of Java workload types. You can retrofit the advice,
    deployment configuration, and garbage collection (GC) tuning knowledge gained
    from this book to effectively design and size your Java platform overall. The
    best practices highlighted throughout this book apply to physical environments,
    virtual environments, or both.


    # Motivation for Writing This Book


    I have spent the past 9 years at VMware in various capacities ensuring that all
    internal enterprise Java applications were virtualized to showcase to VMware customers
    the benefits of the approach. In time, I came to believe that a lot of the best
    practices that we learned from empirical evidence in production environments should
    be shared with the VMware community. I received lots of feedback requesting that
    I document many of the lessons learned and the various tips and tricks needed
    to successfully run enterprise Java applications on VMware. This served as the
    motivation for the first book, Enterprise Java Applications Architecture on VMware
    (https://www.createspace.com/3632131).'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Continuing on the motivation of the first book, this book (the second book)
    focuses on what to tune, how far you can tune it, and how large virtualized Java
    platforms can be. In essence, the first book had a reasonable mix of the “why
    virtualize” and “what/how to virtualize.” In contrast, this book examines “how
    large of a scale you can virtualize and how far you can drive the platform tuning.”


    It was quite exciting to write the first book, as we were trying to let the broader
    VMware customer base know that Java virtualization works absolutely and provides
    significant advantages. In this current book, we want to help those customers
    who are saying, “Now help me take it to the next level of scale.” We have spent
    the past 2 years helping customers virtualize many large-scale JVM platforms,
    some as big as 10,000 JVMs, and others in the big data platform space (with multiple
    terabytes of data kept in memory within a set of clustered JVMs). Before you dive
    into this book, remember this: This book presents many best practices, these practices
    represent optimal configuration guidance; they are not mandatory requirements.
    In our experience, we have found that most enterprise Java applications virtualize
    without having to worry too many specific configurations. In fact, of any enterprise-level
    production application, Java applications are prime “low-hanging fruit” candidates
    for virtualization. By sharing the lessons we learned, we hope that you can avoid
    some of the pitfalls we encountered in our efforts to virtualize large-scale Java
    platforms.


    Wanting to cover how to deploy Java platforms in virtual environments (while addressing
    misconceptions that the virtual platform is the problem), we built best practices
    that apply equally to both physical and virtual environments. By design, this
    book contains sections that cover best practices for physical and virtualized
    Java platforms, so as enable customers to correct any problems on their physical
    Java platform before they virtualize. Of course, this is not mandatory; customers
    may choose to keep the legacy aspect of their physical Java deployment as they
    migrate to virtualization. However, at least they have been aware of the design
    and deployment deficiencies of their physical Java platform should they wish to
    correct it in the future.


    This is an important exercise to go through, allowing us to highlight the problem
    was actually customers’ own environments. Customers could thus understand the
    cost of maintaining the legacy aspect of their physical Java platform. For example,
    we often discover that many Java physical platforms are poorly architected with
    the wrong deployment topology, many times with sprawling thousands of unnecessary
    JVMs. When we speak with customers, we walk them through the best practices and
    ensure that these environments are sized and tuned correctly, regardless of whether
    they leave their Java applications on physical environments or migrate to virtual.
    After, customers can choose to ignore our prescriptions and deploy the legacy
    aspect of their Java physical'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'platform onto the virtual equivalent without much change or intrusion on the
    codebase and platform. However, customers these days are pretty cognizant of the
    value of the best practices we are (and many others) have embraced to improve
    the Java deployment paradigm while migrating to virtual platforms.


    The lessons learned fall into the following general categories:


    +   - Things will go wrong in production; it is just a matter of when. So, you
    want to meticulously consider what could go wrong and to have a roll-forward and
    a rollback plan. The planning exercise helps to further solidify the QA test plan.
    Note that this is not specific to a virtualized environment. In fact, it is equally
    stringent requirement whether you are dealing with a physical or a virtual infrastructure.
    However, the reality is that virtualization gives you the mechanisms to quickly
    deal with issues (in contrast to a physical case in which you are restricted to
    the amount of flexibility you have to move around your compute resources)


    +   - Enterprise Java applications are the low-hanging fruit when it comes to
    virtualization.


    +   - Everyone operated in various silos at each of the Java tiers and did not
    necessarily speak the same language in terms of technology and organizational
    logistics. This was certainly the modus operandi under the old physical (nonvirtualized)
    paradigm, with these technology and organizational silos having been formed over
    the past decades. However, cross-team collaboration was a big part of virtualizing
    Java on VMware; it drove a lot of the teams to talk to each other to facilitate
    a best-of-breed design. Teams from both application development and operations
    came to the table many times.


    +   - Customers sometimes seek to rationalize the legacy aspects of their environment.
    As a consequence, customers pay additional administrative cost associated with
    sprawling-JVMs in the physical environment; if not remedied, these costs carry
    over into the virtualized system. For example, do you really need 1GB heap space
    5000 JVMs? Couldn''t they be consolidated? Absolutely, they can be, and we show
    how you can save by reducing your licensing costs and improving administration
    (because you will have fewer JVMs to manage).


    +   - Performance issues. Customers often 나서 to the conclusion that any problem
    must be a virtualization issue or a GC issue. In reality, virtualization is not
    the issue, but the GC may sometimes be an issue. If a GC issue exists, though,
    it is not specific to virtualization, and in fact the issue is always equally
    present in the physical deployment.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Preface


    +   - Big in-memory databases on physical Java platforms (1TB memory cluster,
    really)?

    Absolutely, the prime objective is to service transactions at any cost, but at
    the highest possible speed, this is the right architecture for you. I found that
    many customers were skeptical about this. The fact that they attempted to size
    these types of environments without regard for the underlying platform gave them
    a poor start. You must pay attention to the server machine architecture when sizing
    these data platforms (as discussed). The other poor practice I found with some
    customers is that they attempted to size these environments to have 30 or so JVMs.
    Well, that is not the right approach, because maintaining chatter between many
    JVMs at a high rate can cause latency over. Quite simple, these are latency-sensitive
    memory-bound workloads and perform better using a deployment paradigm of fewer
    JVMs. If you were to compare the performance of an in-memory database system that
    had 30 JVMs versus 1 with 8 larger JVMs, the configuration with 8 larger JVMs
    would be better of. The caveat is that the larger JVMs are sized correctly for
    NUMA optimization and the appropriate GC tuning has been applied.


    +   - Can in-memory databases really perform when virtualized? Over the past couple
    of years, I have seen an increase in customers virtualizing Java application servers.
    Specifically, large-scale platforms with thousands of JVMs are being virtualized.
    One unique category of workload is in-memory data management systems that require
    terabytes of memory and are latency sensitive. With these in-memory data clusters,
    we find that although there are fewer JVMs, they tend to be of large heap space,
    ranging in JVM size from 8 to 128GB(and usually fewer than 12 JVMs). Of course,
    there is nothing magical about the number 12, it could be as low as 3, or as high
    as 30. However, the more JVMs you have, the more potential latency issues you
    risk because of the additional network hops. Later in the book, you will learn
    how to size and tune these workloads.


    Many Java application developers know the development process well, how to write
    Java code, however too often that information stays with developers and is not
    shared (or translated for) application administrators. Often, the skills needed
    to run Java platforms are split between Java developers and administrators, without
    a single person understanding both purviews. This silo-silo of understanding is
    changing, though, as more individuals begin to understand how to write Java code,
    deploy it, tune the JVM, and recognize the full breadth of virtualization and
    the intricacies of the server hardware architecture. So, another goal of this
    book is to encourage readers to follow this career path as they develop this skill-set
    profile.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'I sincerely hope this book helps those with backgrounds in Java development,
    operations infrastructure, and virtualization. You can use this book both as a
    guide to combat day-to-day situations and as an aid to help compose a strategic
    architectural map of your Java platform.


    # Prerequisites


    This book assumes a high-level understanding of Java, JVM GC, server hardware
    architecture, and virtualization technologies. The information herein relates
    to running large-scale Java platforms. Although you might want to brush up on
    virtualization before diving into the material in this book, senior Java specialists
    will quickly learn enough about virtualization and visualizing Java applications
    from this book alone. In fact, by learning the answer to the following question,
    you will gain background on virtualization to continue through this book. The
    question is asked on day one by folks new to visualizing Java: “Is both operating
    system and hypervisor independent?


    This text assumes the reader has some background in the Java language and specifically
    JVM architecture. The book does best to summarize the JVM architecture, and specific
    JVM tunings, but it is not a replacement for a book dedicated to Java tuning.
    Suffice to say, vSphere administrators who are new to JVM tuning should be able
    to learn enough from this book to hold technical conversations with their Java
    counterparts. In addition, vSphere and Java administrators can apply the tuning
    advice in this book and modify it as it applies to their environment. The various
    chapters on JVM tuning advice have been written in such a way that they are less
    overwhelming than those found in other Java books, enabling vSphere and the Java
    administrators to go for quick and effective design and tuning strategy. Many
    VMware customers running Java have applied the tuning parameters discussed in
    this book and have gained immediate performance improvements.


    # What You Need to Know First


    The fact that you are reading this book means that you are halfway to correcting
    your Java platform. Perhaps you have already concluded that Java platforms cannot
    be ignored/minimized. However, even if you have just dabbled with VMware virtualization
    and Java tuning on physical systems, you are ready for this book. As a refresher
    (or an introduction for those new to the material), the following sections briefly
    introduce important concepts related to virtualizing and tuning large-scale Java
    platforms.'
  merge: -1
