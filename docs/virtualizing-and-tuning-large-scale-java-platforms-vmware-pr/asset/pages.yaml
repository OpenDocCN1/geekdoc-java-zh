    # Sizing vFabric SQLFire Java Platforms: Category 2 Workloads


    Designing and sizing is a three step-process:


    +   - Step A. Determine entity groups.


    +   - Step B. Determine the memory size of the data fabric.


    +   - Step C. Establish building block VM and JVM size and how many SQLFire members
    are needed.


    After these steps have been concluded, a load test should be used to verify the
    calculation and sizing assumptions.'
