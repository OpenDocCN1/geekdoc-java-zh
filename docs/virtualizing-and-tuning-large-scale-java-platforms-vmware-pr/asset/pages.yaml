  md: "# Tuning Large-Scale Java Platforms\n\nThere are two main garbage collection\
    \ (GC) policies: throughput/parallel GC and-concurrent mark sweep (CMS). Discussion\
    \ of others is omitted because they do not currently apply to latency-sensitive\
    \ workloads such as those found in category 2 and 3.\n\n> NOTE\n tuning category\
    \ 2 or any response-time sensitive/latency-sensitive Java platforms, using the\
    \ combination of throughput/parallel GC in young generation and CMS in old generation\
    \ often yields the most prudent memory throughput and response-time combination.\n\
    \nThe throughput/parallel GC policy is called the throughput GC because it focuses\
    \ on improved memory throughput as opposed to better response time. It is also\
    \ synonymcalled the parallel GC because it uses multiple worker threads (configured\
    \ with -XX:ParallelGCThreads=<threads>) to collect garbage. The throughput/parallel\
    \ GC is essentially a stop-the-world type of collector, and therefore the application\
    \ is paused when GC activity occurs. To minimize this effect and create a more\
    \ scalable system, multiple parallel GC threads can be configured to help parallelize\
    \ the minor GC activity.\n\nAlthough the throughput GC uses multiple worker threads\
    \ to collect garbage in the young generation, when those threads run they pause\
    \ threads, which could be problematic for latency-sensitive workloads. The combination\
    \ of -XX:ParallelGCThreads=<threads> and -Xmn (young generation size) tuning are\
    \ two key tuning options to consider adjusting up or down. GC activity might not\
    \ be as frequent in old generation, but when GC activity takes place in old generation\
    \ the application"
  merge: -1
  pgno: 96
- img_proc: true
  md: 'experiences garbage collection time that is significantly longer than that
    of the younger GC time. This is especially true if the parallel/throughput collector
    is used in old generation. To mitigate this pause problem in old generation, it
    is possible to use the concurrent mark sweep (CMS) GC in old generation while
    young generation is still being collected by the throughput/parallel collector.


    CMS refers to concurrent mark sweep. When the GC threads run, they do not pause
    the application threads because they are running concurrently alongside the threads.
    In CMS, there are multiple phases, so it is also sometimes referred to as the
    multipass collector, or mostly concurrent because it does two short pauses that
    are usually insignificant. The phases are as follows:


    +   1. Initial mark


    +   2. Marking and precleaning


    +   3. Remark


    +   4. Sweeping


    Although the CMS collector is named as the concurrent collector, it is sometimes
    more accurately referred to as the “mostly concurrent collector” because there
    are two short pausing phases, in the first initial phase and later in the remark
    phase. These pauses are of no significance to the overall cycle of CMS and therefore
    are mostly ignored from a practical concurrency versus amount of pause perspective.


    The CMS phases operate as follows:


    +   * Initial mark phase (short pausing): The beginning of tenured generation
    collection within the overall phases of CMS. This initial marking phase of CMS
    is where all the objects directly reachable from roots are marked. This is done
    with all the mutator threads stopped.


    +   * Concurrent marking phase (no pause): Threads stopped in the first initial
    mark phase are started again and all the objects reachable from the objects marked
    in the first phase are marked here.


    +   * Concurrent precleaning phase (no pause): Looks at the objects in the heap
    got updated by promotions from the young generation or got by mutator threads
    during the concurrent marking in the previous concurrent marking phase. The rescanning
    of objects concurrently in the pre-cleaning phase helps to reduce the work in
    the next “re-mark” pausing phase.


    +   * Re-mark phase (pausing): This phase rescans any residual updated objects
    in the heap, retracing them from the object graph.'
