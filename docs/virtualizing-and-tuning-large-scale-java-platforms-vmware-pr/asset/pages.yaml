    threads conducting garbage cleaning in young generation due to the -XX:ParallelGCThreads
    configuration. Each time these worker threads run to collect garbage, they pause
    the green application threads; however, having multiple threads do help to alleviate
    the problem. Naturally, the size of the young generation plays a role in this
    the duration of the minor GC increases, but it is not as often because the size
    of the young generation increases. The smaller the young generation, the more
    often GC is of shorter duration.


    ![](img/c26bfb34f357e8daa09165d85110e193_98_0.png)


    Figure 3-1 Parallel GC in Young Generation and CMS in Old Generation


    In the old generation, which cannot be directly sized, but instead is implicitly
    sized by being the difference between -Xmx and -Xmn, the GC policy is configured
    with -XX:+UseConcMarkSweepGC. This GC runs concurrently alongside application
    threads without pausing them, as depicted by the red arrow that denotes CMS activity.


    Refer to Example 3-1 and Example 3-2 (JVM options described in Table 3-1) for
    an actual demonstration with complete JVM options that use the combination of
