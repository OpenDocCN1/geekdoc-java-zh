  md: '# Best Practice 1: Common Distributed Data Platform

    When data delivery is required to be at the highest speed possible (in terms of
    milliseconds and microseconds), setting up vFabric SQLFire as an enterprise data
    fabric system is the correct approach. As shown in Figure 2-2, you introduce a
    common data delivery and consumption layer in memory for many enterprise application
    data requirements. This allows enterprise applications to benefit from the scalability,
    availability, and speed of execution features of vFabric SQLFire.


    Although vFabric SQLFire is a highly capable data platform for moving data at
    large transaction volumes (thousands of transactions per second), it has also
    been used for low-end volume (tens to hundreds of transactions per second) to
    achieve rapid improvement on enterprise application response time and database
    resiliency. vFabric SQLFire compliance with SQL-92 makes the reconfiguration of
    custom enterprise applications to use vFabric SQLFire relatively noninvasive.


    # SQLFire Topologies


    The three main setup topologies for vFabric SQLFire are as follows:


    +   - Client/server

    - Peer-to-peer

    - Multisite


    Each of these topologies can be used standalone or combined to form an extended
    full-featured distributed data management system.


    # Client/Server Topology


    A client/server topology consists of two tiers: a client tier and a server tier,
    as shown in Figure 2-4.


    The client tier communicates with the server tier to search for or update data
    objects from the server tier.'
