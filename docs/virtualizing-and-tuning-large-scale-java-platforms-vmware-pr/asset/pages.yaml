  md: '# Writers


    vFabric SQLFire writer is an event handler that synchronously handles changes
    to a table before those changes take place. The main use of a cache writer is
    to perform input validation, thereby protecting the database from improper data
    being stored. It can also be used to update an external data source before the
    data becomes visible in the table in vFabric SQLFire. A writer provides write-through
    caching with your external data source. Unlike listeners, only one writer can
    be attached to a table. When the table is about to be modified by an insert, update,
    or delete, vFabric SQLFire informs the writer of the pending operation using the
    callback. The writer can choose to disallow the operation by throwing an SQLException.
    The writer callback is called synchronously and blocks the operation if the callback
    blocks.


    In Figure 2-20, an InsertWriter is registered on the Flights table. “Insert flight
    747” triggers the callback event handler of the InsertWriter to synchronize with
    the external database first, and then performs an insert into the vFabric SQLFire
    Flights data partition. This is the key difference with vFabric SQL listeners,
    where they propagate changes to external systems after the DML has been applied
    to the vFabric SQLFire data partition. One other difference is that you can register
    multiple listeners, but only one writer.


    ![](img/c26bfb34f357e8daa09165d85110e193_83_0.png)


    Figure 2-20 An InsertWriter on the Flights Table'
