  md: 'Usually deployed on vSphere hosts that have less than 96GB of physical RAM,
    by the time you stack the JVM instances, you are likely to reach the CPU boundary
    before you can consume the entire physical RAM. For example, if instead you chose
    a vSphere host with 256GB RAM (256 / 4.5GB => 57 JVMs), this would clearly reach
    the CPU boundary because there are far too many GC cycles, with a potential chance
    of 57 GC threads to coincide at a particular time and contend for CPU resources.


    Multiple JVMs per VM is a common practice, sometimes referred to as vertical stacking
    of JVMs on a VM.


    Because category 1 Java platforms can have thousands of JVMs managing resource
    allocation, resource pools can help maintain consistent service level agreements
    (SLAs). For example, as shown in Figure 6-1, a gold and silver type of resource
    pool can be set up to service lines of business (LOBs) that have different priority
