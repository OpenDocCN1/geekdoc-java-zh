  md: 'GC tuning presented so far is usually adequate for most workloads, with some
    caveats in terms of adjusting -Xmn, ParallelGCThreads, SurvivorRatio, and stack
    size -Xss.

    The following section presents more detail for a potential GC tuning approach
    that can help guide your decisions to tune GC cycles in young and old generations.
    There are many possible approaches, but the GC approach discussed in the next
    section is quite prudent.


    # GC Tuning Approach


    Many other approaches can be applied, and JVM tuning can take many weeks of discussion
    on theory and practice. This section describes what is applicable to JVM tuning
    for latency-sensitive workloads.


    Figure 3-2 outlines a three-step tuning approach:


    +   Step A. Young generation tuning: This involves measuring frequency and duration
    of minor GC and then adjusting -Xmn and -XX: ParallelGCThreads to meet application
    response time service agreements (SLA).


