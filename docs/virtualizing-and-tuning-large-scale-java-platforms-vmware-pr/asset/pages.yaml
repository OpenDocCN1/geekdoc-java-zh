    # SpringTrader Performance Study


    In this performance study, the vFabric SpringTrader was put through extensive
    load test- ing establish its scalability, which capacity planners can use as a
    guide to how to best size a SpringTrader target Java platform. The goal of this
    workload is to simulate the load placed on the server-side application by users
    interacting with the application through the browser-based, rich Internet application
    (RIA). This means that the ordering of calls to the server-side REST application
    programming interface (API) is restricted to sequences that can be achieved by
    interacting with the RIA. The workload uses transition probabilities assigned
    to current operation/next-operation transitions to enable a general specification
    of possible user flows through the RIA. This approach allows a variety of user
    profiles and application loads to be implemented by modifying the various transition
    probabilities. The workload used can be implemented in a fairly direct manner
    using the version of the Rain workload-driver developed for SpringTrader, supporting
    asynchronous behaviors, and that make decisions based on state information retrieved
    from the server in previous operations. In the context of SpringTrader, these
    capabilities allow the implementation of the asynchronous GET request for market
    summary data and will allow the workload driver to implement sell operations using
    previously retrieved holdings data.


    The extensive performance testing results are used to guide the design and sizing
    exercise for various vFabric Reference Architecture platform scales, where the
    performance can be found (http://www.vmware.com/go/vFabric-ref-arch).'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'If, for example, designers are looking to size a vFabric Reference Architecture
    platform for small (100 concurrent user sessions), medium (1000 concurrent user
    sessions), and/or large (10,000 concurrent sessions) scale, they should be able
    to use the performance charts to size their platform accordingly. VMware expects
    architects to extend the vFabric Architecture to suit their business domain, and
    as a result, the sizing numbers will be altered to accommodate any architectural
    changes introduced. The vFabric Architecture is made of software components that
    are largely horizontally scalable, and extrapolating performance stays straightforward.


    vFabricSpringTrader (https://github.com/Fabric/springtr) is a reference application
    developed by SpringSource to provide customers with an end-to-end reference for
    developing, provisioning, and managing a distributed application. vFabric SpringTrader
    is a stock-trading web application that provides services to enable users to create
    and manage accounts, buy and sell shares of stock, and obtain information about
    their current portfolio and order history. It is a reimplementation of the Trader
    application originally developed by IBM and currently maintained by the Apache
    Geronimo project (http://geronimo.apache.org/).


    The Trader application has three components: presentation services, application
    services, and integration services. The presentation services component contains
    the static content that makes the RIA that is presented to users in their web
    browser. The application services component is a Java web application that exposes
    a REST API that is used by the RIA to execute all operations. The application
    services directly execute short running operations, such as processing of buy
    and sell orders, and pass more complex operations to the integration services
    component via an Advanced Message Queuing Protocol (AMQP) messaging backbone.
    The integration services component is also a Java web application, although it
    interacts with other components only through AMQP, not HTTP. The integration services
    also handle updates of pricing data for individual stocks. Both the application
    and integration services require access to a shared database.


    Figure 5-11 shows the SpringTrader topology based on vFabric SQL client/server
    topology discussed earlier in Chapter 2,"Modern Scalable Data Platforms." In the
    case of SpringTrader, the traditional vFabric client/server topology has been
    slightly modified to accommodate the ability asynchronous messaging of buy and
    sell stock orders through RabbitMQ. In this performance study, SpringTrader is
    essentially made of the application tier having four SpringTrader applications
    deployed on them, and two SpringTrader integration services communicating with
    RabbitMQ server. In addition, there is a distributed-memory data management system
    implemented with vFabric SQL containing two nodes in this performance example,
    shown as the SpringTrader data tier in Figure 5-11.'
