  md: '# Best Practice 7: Redundancy


    +   - When you use the REDUNDANCY 1 specification in a vFabric SQL table definition,
    vFabric SQLFire manages a redundant copy of the data in memory. In the event of
    a vFabric SQLFire member failure, vFabric SQLFire promotes the backup server to
    primary and routes all accesses to new primary, allowing for continuous fault-tolerant
    operation of enterprise applications.


    +   - Because vFabric SQLFire is a memory-oriented data management system, having
    a level of redundancy is a recommended approach. However, the redundancy level
    must be balanced against the advantages and disadvantages of increased redundancy.
    Increased redundancy provides a more robust system at the cost of performance.
    Additional redundant copies cause increased network and memory usage vFabric SQLFire
    always keeps redundant copies in sync.


