    building block as a scale-out VM causes the entire Java platform to drive excessive
    load against the database tier. In this case, you should revise the building block
    VM downward to a more reasonable configuration as 2-vCPU VM.


    Use the VM from the scale-up test as a repeatable building block for the scale-out
    test. This helps in two ways. First, it allows for a well-defined and known configuration
    to be repeated, eliminating configuration guesswork. Second, it means that all
    the nodes in your application cluster are identical, which simplifies load-balancer
    logic. The load balancer can thus distribute equally without having to know the
    configuration of the individual VMs. For example, if your VM is a 2-vCPU VM, all
    the VMs in the application cluster are 2-vCPU VMs and can potentially handle the
    same workload. If the VMs have different configurations, the load balancer requires
    a special configuration to accommodate the different VM configurations in the
    application cluster. In the following scale-out test, you are actively testing
    the capacity of a single vSphere host to see how many building JVMs or VMs can
    be afforded.


    At this point, you have selected a vSphere host from Example 2 after various discussions
    with your architects and performance engineers. This is a vSphere host made two
    eight-core sockets and 48GB of RAM, and you have decided to place eight JVMs and
    eight VMs on it. Naturally, the fewer VMs, the fewer OS copies you need to provide
