  md: '# Horizontal Scaling Versus Vertical Scaling of JVMs and VMs


    When considering horizontal scaling versus vertical scaling, you have three options,
    as Figure 1-7 shows.


    ![](img/c26bfb34f357e8daa09165d85110e193_49_0.png)


    Figure 1-7 Horizontal Versus Vertical JVM Scalability Choices


    The sections that follow detail the pros and cons of these three options.


    # Option 1


    With Option 1, JVMs are introduced into the Java platform by creating a new VM
    and deploying a new VM on it (hence, a scale-out VM and JVM model).


    # Option 1 Pros


    This option provides the best scalability because the VM and the JVM are scheduled
    out as one unit by the ESXi scheduler. It is really the VM that is scheduled by
    the ESXi, but because there is only one JVM on this VM, the net effect is that
    the VM and the JVM are scheduled as one unit.


    This option also offers the best flexibility to shut down any VM and JVM in isolation
    without impacting the rest of the Java platform. There is no doubt in relative
    terms, however, most Java platforms are horizontally scalable, and in most cases
    there are enough instances to service traffic, though JVM instances are being
    shut down. The relative comparison in terms of more instances having better scalability
    is based on having 100 JVMs and VMs versus having 150 JVMs and VMs for the exact
    same system, if for'
