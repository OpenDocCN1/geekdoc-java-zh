    This new configuration option is available only in ESXI 5.0. |


    | BP 54: Troubleshooting SYN cookies. | When troubleshooting performance problems,
    verify that you are not impacted by SYN cookies. SYN cookies are the key element
    of a technique to guard against SYN flood attacks. Daniel J. Bernstein, the technique''s
    primary inventor, defines SYN cookies as "particular cookies of initial TCP sequence
    numbers by TCP servers." In particular, the use of SYN cookies allows a server
    to avoid dropping connections when the SYN queue fills up. Instead, the server
    behaves as if the SYN queue has been enlarged. The server sends back the appropriate
    SYN+ACK response to the client but discards the SYN queue entry. If the server
    receives a subsequent ACK response from the client, the server is able to reconstruct
    the SYN queue entry using information encoded in the TCP sequence number.|'
