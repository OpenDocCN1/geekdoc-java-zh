  md: '# Chapter 7


    # Monitoring and Troubleshooting

    Primer


    The key to troubleshooting Java workloads is to understand the critical four technology
    tiers shown in Figure 7-1: the load balancer tier, the web server tier, the Java
    application server tier, and the DB server tier.


    | Load Balancer Tier | Web Server-Tier | Java App Tier | Db Server Tier |

    | :--- | :--- | :--- | :--- |

    | Load Balancers | Web Servers | Java Applications | DB Servers |

    | IT Ops Network Team | IT Ops Server Team | IT Apps /Dev Team | IT Ops & Apps
    |

    Organizational Key Stakeholder Departments


    **Figure 7-1** Four Key Technology Tiers and Stakeholders


    When troubleshooting Java application issues, many often assume that a garbage
    collection (GC) problem exists at the Java application tier. However, problematic
    issues could be present in any one of these tiers. Complicating troubleshooting
    efforts is the fact that teams from multiple operational divisions within an organization
    usually manage their own distinct technology tier, without a single administrator
    of the platform who has a holistic view. In addition to the technology challenges
    large-scale virtualization may present,'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'organizational challenges resulting from these traditional siloed technical
    approaches must be confronted:


    +   - The network operations team manages the load balancer tier. Although that
    team might have adequate load-balancer knowledge, load balancers are often just
    a part-time hobby for them. This somewhat dilettante approach creates an opportunity
    for Java architects and DevOps engineers to take the initiative and learn about
    the vendor-specific load-balancer configurations, balancing algorithms, and monitoring
    consoles.


    +   - The web tier is managed by Linux administrators (if it is Apache) or by
    the Windows Server team (if Internet Information Services [IIS]) is used. These
    Linux/Windows administrators may not have deep knowledge about how to tune web
    servers. As a Java architect, or DevOps engineer, it is important that you specialize
    in this area and understand all the design and sizing requirements of each web
    server. For example, you need to know how to determine how many web servers are
    needed. So, you must learn to analyze traffic reports from the load balancer,
    and based on the size of each transaction, determine how many and what size server
    instances are needed. See Chapter 4, “Designing and Sizing Large-Scale Platforms,”
    and Chapter 6, “Best Practices,” for more information.


    +   - The application tier is heavily architected by the development/application
    team


    +   - The DB tier is, naturally, managed by both the operations and the application
    teams because the design of the schema construct is dictated by the developers.
    However, the operations team often includes database administrators (DBAs), who
    can manage the operational aspects of the database. Having deep database (DB)
    operations knowledge is key to troubleshooting and tuning the DB.


    As a Java architect who might need to deal with both the operations and application
    teams when diagnosing critical Java issues, you need to be aware of the various
    teams managing the platform and the four key tiers shown in Figure 7-1. Invariably,
    a good Java architect becomes the force that drives change and facilitates better
    design through'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'effective communication and collaboration across all of these tiers. In many
    ways, the Java architect is the glue that holds these four tiers together.


    The good news is that (we hope) all of these tiers are fully virtualized. Therefore,
    you have one common runtime platform on VMware vSphere that unites these tiers
    and forces all teams involved to come to the discussion table. Because all of
    these tiers are on vSphere, you can generate performance charts from vCenter;
    in some extreme cases, you can use esxtop. In addition, because all four are virtual,
    you can effectively size the entire platform within one design and sizing context,
    an impossibility if half the platform is virtualized and the rest is on physical.


    # Open a Support-Request Ticket


    If you suspect the VMware vSphere is not configured optimally and is the cause
    of a bottleneck, file a support request (http://www.vmware.com/support/contacts/file-sr.html).
    In addition, you might want to do the following:


    +   - Follow the troubleshooting steps outlined in the performance-troubleshooting
    guide for ESX4.0: http://communities.vmware.com/docs/DOC-10352.

    - Verify that you have applied all the best practices discussed in Chapter 6.

    - Run the vm-support utility to collect necessary information so that VMware can
    help diagnose the problem. It is best to run this command when the symptoms first
    occur.


    NOTE

    In VMware environments, you can refer to the following paper for troubleshooting
    using vCenter Operations Manager: "How to Troubleshoot vSphere 5.x Performance
    Issues Using vCenter Operations" (http://communities.vmware.com/servlet/JiveServlet/previewBody/23094-102-1-30667/vphere5x-perfs-vcops.pdf).


    # Collecting Metrics from vCenter


    When troubleshooting any issues with the Java platform, you want to collect vCenter
    performance metrics for each of the four tiers mentioned in Figure 7-1. For Java
    platforms with primarily category 1 types of workloads, it is important to collect
    CPU, memory, net-work charts, and disk usage.'
