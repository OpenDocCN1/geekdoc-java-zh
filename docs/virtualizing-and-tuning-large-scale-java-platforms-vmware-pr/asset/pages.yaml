    | BP 53: Virtual NIC (continued). | VMXNET3 by default also supports an adaptive
    interrupt coalescing algorithm, for the same reasons that physical NICs implement
    interrupt coalescing. This virtual interrupt coalescing helps drive high throughput
    to VMs with multiple CPUs in parallelized workloads (for example, multiple threads),
