  md: '# Designing and Sizing a New Environment for a Virtualized Large-Scale Java
    Platform


    or two JVMs is a matter of your design and how comfortable the engineers involved
    are with tuning JVM heap sizes. By the time you finish reading this book, let''s
    hope that larger JVMs will not be an issue and you can easily apply them to your
    Java platform.


    The reason why we would want to prevent having to create a second JVM on top is
    because of the overhead that the second JVM would add to its additional garbage
    collection (GC) cycle. Although JVMs can handle multiple JVMs on a VM, the second
    JVM really comes at an overhead and a cost that can be prevented by trying to
    carry more transactions within one JVM. If you are able to do more within the
    first JVM you will find GC algorithms have become much better in being able to
    vertically scale up without consuming proportionally more CPU with increased heap
    size. The act of adding more JVMs on top of a VM is referred to as JVM stacking,
    meaning multiple JVMs being deployed on one VM. Instead of this, it is always
    best to have a scale-out approach, where if you decide that you need a second
    JVM, instead of placing it on top of the existing VM, creating a second VM and
    place the second JVM on the second VM. For further information about the pros
    and cons of the JVM scale-out versus scale-up (“Horizontal Scaling Vertical Scaling
    of JVMs and VMs,” in Chapter 1, “Introduction to Large-Scale Java Platforms."


