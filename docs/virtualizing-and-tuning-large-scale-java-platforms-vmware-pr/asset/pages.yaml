  md: '# Designing and Sizing Large-Scale Java Platforms


    This chapter explores various approaches to designing and sizing large-scale Java
    platforms. The three key topics discussed include the following:


    +   - How to design and size a new environment

    - How to design and size a new large-scale Java platform when migrating an existing
    physical deployment to a virtualized one

    - How to design and size large-scale Java platforms for latency-sensitive in-memory
    databases such as vFabric SQLFire


    # Designing and Sizing a New Environment for a Virtualized Large-Scale Java Platform


    When deploying completely new environments, it is important to conduct an extensive
    performance test so that any potential bottlenecks are exposed early in the lifecycle
    of the project. The three-step process is as follows:


    +   - Step 1. Establish the load profile.

    - Step 2. Establish the benchmark.

    - Step 3. Size the production environment.'
