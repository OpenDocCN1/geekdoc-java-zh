    # NOTE


    Smaller vSphere hosts may lead to the need to have larger vSphere clusters because
    you need more hosts. The sweet spot of vSphere cluster sizes is around 8 to 16,
    but there is nothing magical about this number. It is likely that category 1 workloads
    will have a larger number of vSphere hosts, with less RAM, permit plenty of opportunity
    for Distributed Resource Scheduler (DRS) to balance VM movement. In contrast,
    category 2 in-memory data-bases within vSphere clusters will have a smaller number
    of hosts (four to eight hosts, usually with very large 144 to 512GB RAM configurations).
    Naturally, in category 2, these decisions are really driven by the size of the
    data, and again you could have a larger number of hosts in a cluster, larger than
    eight, but you are most likely to have about eight. This keeps the cluster in
    closer distribution proximity, minimizing the effects of latency and being able
    to crunch more within larger JVMs that are typical of in-memory database type
    of workloads often found in category 2 workloads. Any design decision, there are
    pros and cons, and the more vSphere hosts, the better redundancy. Of course, you
    must balance this cost against realistic performance capabilities for category
    2 workloads.'
