  md: '# Best Practice


    # Description


    BP 36: Use parallel and CMS GC policy combination (continued).


    When considering reducing -XX: ParallelGCThreads, the minimum should be 2. Any
    lower than this can negatively impact the behavior of the parallel collector.
    For vFabric SQLFire types of workloads (for example, 8GB and greater), it requires
    at least a 4vCPU VM configuration, because 2 vCPUs are taken by -XX:ParallelGCThreads,
    and the other 2 vCPUs are taken by the application threads. This configuration
    rule is shown for both the VM configuration in Figure 2-16 and Figure 2-18 in
    Chapter 2 (an 8-vCPU VM has 4 ParallelGCThreads allocated). This is 50% of the
    available vCPUs in both cases. Further, when using a CMS type of configuration,
    you should always use VMs with 4 vCPUs or more. The 50% rule is a starting point,
    and if you have ample CPU cycles left and want to improve GC, consider raising
    -XX:ParallelGCThreads. This should never be greater than the number of underlying
    cores on the VM. The reason why we set this to 50 is because we want to leave
    CPU cycles for other activities, such as the old generation, off-the-heap activity,
    and any other process that may be running on the VM in addition to the Java process.
    Set -XX:CMSInitiatingOccupancyFraction=75 for high-throughput latency-sensitive
    applications that generate large amounts of garbage in the old generation, such
    as those that have high rates of updates, deletes, or evictions. This setting
    tells the concurrent collector to start a collection when tenured occupancy is
    at the given percentage. With the default setting, a high rate of tenured garbage
    creation can outperform the collector and result in OutMemoryError. Setting too
    low can affect throughput by doing unnecessary collections. Conversely, a collection
    too late can lead to concurrent mode failure, which should be avoided by lowering
    the percentage. Test to determine the best setting.


    For further guidance, refer to Table 3.1 in Chapter 3, "Tuning Large-Scale Java
    Platforms." Follow steps outlined in the section, "GC Tuning Approach," from Chapter
    3 for the GC tuning approach which you want to conduct further tuning.


    BP 37: Set initial heap equal to maximum heap.


    Set -Xms (initial heap) to -Xmx (maximum heap).


    Note Without this setting, performance can suffer if the initial heap setting
    is not adequate and the JVM responds by increasing the memory allocated, causing
    overhead at runtime.'
