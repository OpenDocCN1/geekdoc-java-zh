  md: '# Best Practices


    This chapter covers the various best practices for category 1, category 2, and
    category 3 Java platforms:


    +   - Category 1 (large number of JVMs): In this category, hundreds to thousands
    of Java Virtual Machines (JVM) are commonly deployed on the Java platform, and
    these are typically JVMs as part of a system that may be servicing millions of
    users. I have seen some customers with as many as 15,000 JVMs. Whenever you are
    dealing with thousands of JVM instances, you have to consider the manageability
    cost and whether opportunities exist to consolidate the JVM instances.


    +   - Category 2 (JVMs with a large heap size): This category usually contains
    fewer JVMs (1 to 20), but the individual JVM heap size is quite large, within
    a range of 8 to 256GB and potentially higher. These are usually JVMs that have
    in-memory databases deployed on them. In this category, garbage collection (GC)
    tuning becomes critical.


    +   - Category 3: This is a combination of the first two categories, where perhaps
    thousands of JVMs are running enterprise applications that are consuming data
    from category 2 large JVMs in the back end.


    Figure 6-1 shows an example of a category 1 workload vSphere cluster, the characteristics
    of which are made as follows:


    +   - Usually made of smaller JVMs, typically with a less-than 4GB heap size,
    and hence the total Java process memory of 4.5GB and allowing 0.5GB for OS, for
    a total of 5GB set as virtual memory (VM) memory reservation.'
  merge: -1
