  md: '# Horizontal Scalability, Clusters, and Pools Best Practices


    # Best Practice


    # Description


    BP 29: Apache server sizing.


    In httpd.conf, you can set any of the directives, such as StartServers, MinSpareThreads,
    MaxSpareThreads, ServerLimit, MaxClients, and MaxRequestsPerChild. When Apache
    processes, determine how much memory to reserve, each of these directives must
    be understood.


    MaxClients: This is the number of concurrent requests that can be serviced by
    an Apache instance. Requests exceeding this limit will be queued into a queue
    with length determined by ListenbackLog directive.


    MaxRequestsPerChild: The MaxRequestsPerChild directive sets the limit on the number
    of requests that an individual child server will handle. After MaxRequestsPerChild
    requests, the child process will die. If MaxRequestsPerChild is 0, the process
    will never expire.


    StartServers: The StartServers directive sets the number of child processes created
    on startup. Because the number of processes is dynamically controlled depending
    on the load, there is little reason to adjust this parameter.


    MinSpareThreads: Minimum number of idle threads to handle request spikes. Different
    MPMs deal with this directive differently.


    MaxSpareThreads: Maximum number of idle threads. Different MPMs deal with this
    directive differently.


    ServerLimit: For the prefork MPM, this directive sets the maximum configured value
    for MaxClients for the lifetime of the Apache process. For the worker MPM, this
    directive, in combination with ThreadLimit, sets the maximum configured value
    for MaxClients for the lifetime of the Apache process. Any attempts to change
    this directive during a restart are ignored, but MaxClients can be modified during
    restart.


    Ideally, you should not mix Apache VMs with Java VMs, although in some cases this
    may make sense if there is ample compute capacity.


    When sizing VMs for Apache processes, you face the choice of maximum scalability,
    which implies far more VMs in a scaled-out fashion. If you have an adequate number
    of VMs, it is best to size the VMs fairly large, almost as large as the NUMA node,
    from a memory and CPU perspective. Hence, follow the best practice of sizing 1
    VM per NUMA node to save on the number of memory copies you need to allocate to
    the guest OS, and instead this now spare memory can be allocated to Apache processes
    that would even more requests.'
