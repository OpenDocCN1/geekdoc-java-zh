  md: '# “Java applications platforms are multitier. Which tiers make sense to virtualize
    first?”


    At a high level, we classify the enterprise Java applications platform into the
    following tiers:


    +   - Load balancer tier

    - Web server tier

    - Java application server tier

    - DB tier


    We do not recommend any particular order, and some VMware customers virtualize
    all the tiers. However, we see a growing trend where migrations are done in phases,
    as follows:


    +   - Phase one: Migrate the web server tier to run on vSphere.

    - Phase two: Migrate the Java application server tier to run on vSphere.

    - Phase three: Migrate the DB server tier to run on vSphere.

    - Phase four: Optionally migrate the load balancer tier to run on vSphere via
    load-balancer third-party virtual appliances that run on vSphere.


    # “How does vSphere help with business continuity for enterprise Java applications?”


    VMware vCenter Recovery Manager does the following:


    +   - Provides failover to secondary site

    - Automates your recovery plans

    - Allows a fast storage-replication adapter

    - Recovers multiple sites into a single shared recovery site

    - Simulates and tests the recovery plan

    - Provides a powerful API for further scripting (http://www.vmware.com/support/developer/srm-api/srm_10_api.pdf)'
