  md: '# Enterprise Java Applications on vSphere Best Practices (Category 1)


    | Best Practice | Description |

    |---|---|

    | BP 21: Use of large pages (continued) | This implies that you have 0 large pages
    allocated and that large pages are sized at 4MB.<br><br>For example, if you want
    to size 4GB worth of large pages, you set 1000 large pages, because each page
    is 4MB. To allocate the following:|


    ```

    # echo 1000 > /proc/sys/vm/nr_hugepages | grep Huge

    ```


    You should repeat the #cat /proc/meminfo | grep Huge to see whether the 1000 pages
    were indeed allocated. Sometimes, due to the OS not having enough memory, it may
    not be able to allocate all of these pages. It usually means there are processes
    running that are consuming the memory space and that the OS was not able to lock
    on those pages. The correct action here is to keep shutting down processes until
    enough memory is available to allocate to large pages.


    Setting large pages should be done with extreme caution, because not all processes
    can use large pages. Hence, it is best to set a ratio of 60% large pages and 40%
    smaller pages of the available guest OS memory.


    If you are not using large pages on your current physical Java deployment, you
    likely do not have to turn large pages when virtualizing, but it could benefit
    performance if large pages are set correctly.


    Large pages can sometimes become an administrative overhead (as new processes,
    Java and non-Java processes, may be deployed on the VM and the guest OS), you
    have to continuously adjust the large pages allocation to accommodate these new
    processes. This can sometimes lead to a high administrative cost and is often
    error prone; well-tuned systems often can do away with having to enable large
    pages.


    For Windows operating systems, check the user manual; the steps vary from one
    version to another.'
