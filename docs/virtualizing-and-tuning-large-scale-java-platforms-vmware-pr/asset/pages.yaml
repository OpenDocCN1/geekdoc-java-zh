  md: '# CHAPTER 7 Monitoring and Troubleshooting Primer


    When looking at vCenter charts, you can inspect performance by selecting the Perfor-

    mance tab and adjusting the time range after clicking the Advanced button. vCenter
    pro-–ides —s three different memory counters (Consumed, Granted, and Active),
    as illustrated in

    Figure 7-2.


    ![](img/c26bfb34f357e8daa09165d85110e193_225_0.png)


    Figure 7-2 vCenter Performance Chart for Memory


    When reading these counters, keep the following in mind:


    +   **Consumed memory:** This is the amount of guest physical memory consumed
    by the

    VM for guest memory allocation. This does not include overhead memory. How-

    ever, if you apply the design and sizing guidelines introduced in Chapter 4, you

    should be able to apply a small overhead calculation to the amount of consumed

    memory and thus determine the actual memory used by the VM. For the most part,

    the overhead is insignificant, usually on the order of 1%. The consumed

    memory can be calculated as shown in Formula 7-1.


    > Consumed Memory = granted memory – memory saved due to memory sharing


    Formula 7-1 Consumed Memory


    +   **Granted memory:** This is the actual physical memory granted by vSphere
    to be

    mapped to the guest operating system of the VM.

    **Active memory:** This is the amount of guest operating system in use by the
    VM.

    This value is often much lower than consumed memory and granted memory.'
