  md: '# NOTE


    The only performance tuning applied to the VMware vSphere 5.1 installation was
    setting the advanced setting parameter /Num/LocalityWeightActionAffinity to 0.
    This setting controls the weight that the CPU scheduler gives to inter-VM communication
    when making decisions assigning VMs to Non-Uniform Memory Access (NUMA) nodes.
    In most cases, leaving this at the default value will give the best performance.
    In this deployment, the high level of communication between the application services
    VMs and the SQLFire data members (in-memory database) VMs based the scheduler
    toward placing these VMs on the same NUMA node. This did not improve performance,
    and had a negative impact on performance at certain load levels. As a result,
    the parameter was set to 0 to disable the use of inter-VM communication in scheduling
    decisions. Careful performance testing should be performed before changing this
    parameter in a different deployment scenario. You can find more information about
    this and other scheduler parameters in the technical paper “The CPU Scheduler
    in vSphere 5.1.”


