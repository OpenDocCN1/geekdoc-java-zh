  md: '# Enterprise Java Applications on vSphere Best Practices (Category 1)


    # vCPU for VM Best Practices


    Table 6-1 vCPU for VM Best Practices


    | Best Practice | Description |

    | --- | --- |

    | BP 16: VM sizing and VM-to-JVM ratio through a performance load test | Establish
    a workload profile and conduct a load test to measure how many JVMs you can stack
    on a particular-sized VM. In this test, establish a best-case scenario of how
    many concurrent transactions you can push through a configuration before it can
    be safely deemed as a good candidate for scaling horizontally in an application
    cluster. When in doubt, due to time pressures or lack of information about the
    application, use a 1-JVM to 2-vCPU ratio. You can achieve this by having 1 JVM
    deployed on 1 VM, or could have 2 JVMs deployed on a 4-vCPU VM. In either case,
    the 1-JVM to 2-vCPU ratio is upheld. If indeed the JVM you are deploying is fairly
    aggressive in terms of how much work it has to do, you will find that the GC overall
    takes 1 vCPU and then an additional vCPU is needed for regular user transactions.
    After deployment you find that the 1-JVM to vCPU has very low vCPU utilization,
    you can adjust the ratio by either increasing the JVM instances or by reducing
    the vCPU, or increasing the heap of the JVM. Further, if the CPU utilization is
    indeed over, it means that you are not utilizing the JVM that you have allocated,
    or you far too many horizontally scaled-JVMs and should perhaps look at consolidating
    these JVMs into fewer with higher heap size. |


    BP 17: VM vCPU CPU overcommit. For performance-critical enterprise Java application
    VMs in production, make sure that the total number of vCPUs assigned to all the
    VMs does not greater than 80% CPU utilization on the ESXi host. This best practice
    is supported by the performance study we saw in the section "The Olio Workload
    on Server and vSphere Performance Study" in Chapter 5, "Performance Studies",
    where virtualization overhead was negligible compared to physical/native CPU utilization
    was up to 80%. Further, when calculating vCPU versus CPU (pCPU), always 1 vCPU
    = 1 pCPU, but adjust up or down the vCPU in accordance with the actual pCPU utilization
    observed/consumed. If hyperthreading is enabled, always vCPU <=1.25 pCPU, but
    approach this with caution; not all workloads benefit from hyperthreading. Hyperthreading
    should always be enabled, but it should not figure into the overcommitment calculation
    unless you are benchmarking to the absolute ceiling capacity achievable on a vSphere
    host. Naturally, you would not run a vSphere host in production near ceiling capacity,
    hence why the conservative approach is taken of not accounting for additional
    CPU adjustment potentially offered by hyperthreading.'
