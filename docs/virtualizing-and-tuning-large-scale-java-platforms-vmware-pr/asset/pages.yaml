  md: '| JVM Option | Description |

    | --- | --- |

    | -XX:MaxTenuringThreshold=15 | Determines the maximum age that a young object
    is allowed to live in the young generation after each minor GC, before it is tenured
    to the old generation. The tenure of an object is increased by 1 when the object
    survives a minor GC and is copied to survivor spaces. The maximum for the HotSpot
    JVM6 is 15. A smaller value causes premature promotions to the old generation
    that can lead to more frequent old generation activity that can hurt response
    times. |

    | -XX:ParallelGCThreads=4 | Sets the number of GC worker threads in the young
    generation. The default value varies with the JVM platform. |


    This value should not be higher than 50% of the cores available to the JVM.


    There is an assumption that a single VM is running on one VM and that no other
    VM is contending for the cores available to the VM on which the VM runs.


    For example, in Option 2 shown in Figure 2-14, the vSphere cluster has 16 VMs
    and therefore 16 vFabric SQLFire members. Each VM is configured to have 68GB RAM
    and 8 vCPUs. One vFabric SQLFire member VM runs on one 8-core socket within the
    vSphere host. This implies that 8 cores are available to service the 8 vCPUs allocated
    to the VM, because -XX:ParallelGCThreads=4. Four vCPUs are consumed by the ParallelGCThreads,
    and the remaining four are available to service application threads, off-the-heap
    activity, and any other workloads that might be running on the VM, such as a monitoring
    agent.


    One minor caveat is that in the very short pausing phases of the initial mark
    (aside from the other concurrent phases) it is single threaded but finishes rather
    quickly, and then the re-mark is multithreaded. The initial mark being single
    threaded does not use any of the -XX:ParallelGCThreads allocated, but the re-mark
    phase being multiththreaded uses some of the parallel threads allocated. Because
    re-mark is a very short phase, it uses negligible parallel thread cycles.'
