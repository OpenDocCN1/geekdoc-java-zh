  md: '# Best Practice


    # Description


    BP 29: Apache web server sizing (continued).


    To calculate how much memory is needed for a VM running Apache, use the following:


    MaxClients = (Available RAM - Size all non-Apache processes) / Size of Apache
    process


    For example, if you have a vSphere host of 48GB RAM of 2 sockets, 8 cores on each,
    by applying Formula 1.2 from Chapter 1: (48GB * 0.99 - 1GB) => 23.26GB memory
    available per VM, you can also allocate 0.5GB to the guest OS. This implies that
    there is (23.26 - 0.5) => 22.76GB available to be set as memory reservation of
    the VMs. We are assuming NUMA perfect VMs are being sized to be deployed on this
    host. In this case, this means that the host will have 2 VMs with 23.26GB memory
    reserved and 8 vCPUs on each.


    Applying the Apache MaxClients formula for this example implies (23.26 - Size
    of non-Apache processes) / Size of Apache process. By taking OS memory requirements
    into account, the formula translates to (23.26 - 0.5 - Size all of non-Apache
    processes) / Size of Apache process.


    To find the Apache process size, use the following:


    ```

    ps -y|C http -sort:rss, to find process size, divide by that by 1024 to get Meks

    ```


    To inspect the overall memory and CPU situation on the guest OS, use the following:


    ```

    free -m for general overview of buffers/cache

    ```


    Vmstat 2 5 to display the number of runnable, blocked, waiting, and swap processes


    Depending on the value from MaxClients calculation above (by applying the Apache
    MaxClients formula), it depends on the memory used by the Apache processes, you
    can decide on a better StartServer value. Let''s assume 50 for StartServer, and
    assume 50 concurrent users. Each user thread will use 1 thread, which means 50
    threads (worst-case scenario is assumed here, which could be otherwise); 50K /16
    VMs => 3125 threads which means each Apache instance should have 3125 going to
    it and equal number of threads waiting to the call. This translates to 64 threads,
    and hence ThreadsPerChild = 64, MaxClients will be 3125, and Min and MaxThreads
    is 3125. Do not doubt these numbers can be adjusted by increasing/decreasing the
    number of StartServer. It will be a choice of having many processes with x number
    of threads or of having fewer processes with more threads.


    Set MinSpareThreads = MaxSpareThreads.'
