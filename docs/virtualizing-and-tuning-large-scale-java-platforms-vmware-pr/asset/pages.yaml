  md: '# Java Troubleshooting Primer 203


    +   Execute a list of methods that you suspect, and then run GC again. Calculate
    the difference in object count between before and after GC in this step, and compare
    the numbers. Repeat several times and look for code segments that have a higher
    percentage of object generation to others in relative terms. For example, if during
    the first few iterations all code sections correlate with each other consistently
    in terms of object creation, and object count, but all of the sudden code segment
    pulls ahead and starts to create lots of objects, essentially diverging from correlating
    with the other related methods in its call hierarchy, this is the suspected leak.


    +   Repeat the two preceding points, and take heap dumps or use the MAT to analyze.
    String concatenation, long-running threads, usage of thread pools, custom JDBC
    pools, custom class loaders, custom cache (especially home-brewed caching mechanisms),
    and ThreadLocal usage are often suspect code areas for memory leaks.


    If you''re using JDK 5, remember the following:


    +   - If you''re running Linux with JDK 5, you can use jmap.


    +   - If you''re using JDK 5 14 or later, you can use the -XX:+HeapDumpOnCtrlBreak
    option when starting JVM, and then use the Ctrl+Break key combination on Windows
    to dump the heap.


    # Troubleshooting Java Thread Contentions


    If you suspect that your enterprise Java application is suffering from long pauses,
    or just has general response-time issues to the point where the JVM needs to be
    restarted to resolve the issue, you might also need to inspect the Java thread
    dump. You can obtain a Java thread dump by pressing Ctrl+Break for a Windows OS
    or in Linux Kill -3 on the Java process ID. It is important to take the thread
    dump right at the point where problematic symptoms appear. This holds especially
    true if you are conducting a benchmark load test. In that case, take the thread
    dump at max load, and then inspect the behavior of the various application threads.


    Many widely used thread-analysis tools are available that interpret the thread
    dump and highlight in red the hot threads or threads waiting for a lock. You can
    begin your investigation from that point and follow the call stack.'
  merge: -1
