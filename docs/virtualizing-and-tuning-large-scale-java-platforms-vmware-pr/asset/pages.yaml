  md: '# SQLFire Best Practices and SQLFire on vSphere Best Practices


    | Best Practice | Description |


    BP 36: Use parallel and CMS GC policy combination (continued).


    When setting -XX:ParallelGCThreads, size it at 50% of the available number of
    underlying vCPU or CPU cores initially, and then adjust progressively upward if
    you need to or if you are seeking better performance and the system still has
    ample CPU cycles. The example in Figure 4-18 in Chapter 4, "Designing and Sizing
    Large-Scale Platforms," JVM is configured to run on 1 VM that resides on 1 socket
    that has 8 underlying CPU cores, and therefore 50% of the CPU compute resource
    is allocated to potentially be consumed by -XX:ParallelGCThreads. The other 50%
    on the socket remains for regular application transactions. There, 4 vCPUs are
    consumed by the ParallelGCThreads, and the remaining 4 are available to service
    application threads, concurrent generation activity, off-heap activity, and any
    other workload that might be running on the VM, such as a monitoring agent.


    One minor caveat here is that in the very pausing phases of the initial mark (aside
    from the other concurrent phases) it is single threaded but finishes rather quickly,
    and then the re-mark is multithreaded. The initial mark being single threaded
    does not use any of the -XX:ParallelGCThreads allocated, but the re-mark phase
    being multithreaded uses some of the parallel threads allocated. Because re-mark
    is a very short phase, it negligible parallel thread cycles. You can tune -XX:ParallelGCThreads
    to below 50% allocation and give more threads back to your applications. it does
    not hurt overall response time, it might be prudent to reduce -XX:ParallelGCThreads.
    Conversely, if you have exhausted young generation size tuning, -Xmn, and have
    ample CPU cycles, consider increasing beyond the 50% mark progressively in 1-thread
    increments. Load test and measure response times for the application to confirm
    the benefits of the incremental adjustment.'
