  md: '# CHAPTER 2 Modern Scalable Data Platforms


    In Figure 2-16, the updateFlights transaction proceeds to the commit state, and
    as it is about to exit the commit state it issues a lock to the appropriate data
    replicas to propagate the changes in a data consistent manner. The vFabric SQL
    Server 1 is the “row-owning member” because it acts as the transaction coordinator
    during commit by acquiring a local write lock and distributing all changes to
    the replicas.


    ![](img/c26bfb34f357e8daa09165d85110e193_77_0.png)


    **Figure 2-16** Update Flight Transaction Proceeding to Commit Changes


    vFabric SQL has no centralized transaction coordinator. Instead, the member on
    which a transaction started as the coordinator for the duration of the transaction.
    If the application updates one or more rows, the transaction coordinator determines
    which owning members are involved and acquires local “write” locks on all of the
    copies of the rows. At commit time, all changes are applied to the local datastore
    and all redundant copies. If any concurrent transaction attempts to change one
    of the rows, the local write acquisition fails for the row, and that transaction
    is automatically rolled back.


    If no persistent table is involved, there is no issue to use a two-phase commit
    to redundant distributed databases. In this case, commits are efficient, single-phase
    operations. Unlike vFabric SQL does not use write-ahead logging for transaction
    recovery in the case commit fails during replication or redundant updates to one
    or more members. The most likely failure scenario is one where the member is unhealthy
    and gets forced out of the distributed system, guaranteeing the consistency of
    the data. When the failed member comes back online, it automatically recovers
    the replicated/redundant data set and establishes coherency with the other members.
    If all copies of some data go down before the commit is issued, this condition
    is detected by the group membership system, and the transaction is rolled back
    automatically on all members.'
