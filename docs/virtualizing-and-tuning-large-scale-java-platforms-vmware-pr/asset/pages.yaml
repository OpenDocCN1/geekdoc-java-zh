  md: '# Understanding NUMA Implications on Sizing Large VMs and JVMs


    Non-Uniform Memory Access (NUMA) architecture is common on servers with multi-processor
    sockets, and it is important to understand this memory access architecture when
    sizing memory-bound and latency-sensitive systems. In the simplest terms, the
    total amount of memory available on a server machine / vSphere host is divided
    among the number of processor sockets. See Formula 4-11, where this rule has been
    captured.


    ```

    NUMA Local Memory = Total RAM on Server/Number of Sockets

    ```


    **Formula 4-11** High Throughput Fast Access Local NUMA Memory


    Figure 4-9 shows a two-socket (proc1 is socket1, proc2 is socket2) server with
    a NUMA architecture of two NUMA memory nodes. The diagram shows two vFabric SQLFire
    VMs running within their respective NUMA boundaries because they were sized to
    fit within the NUMA node. Whenever a VM is sized to exceed the amount of available
    NUMA memory from the local NUMA node, the VM is forced to fetch memory from the
    remote NUMA node, as shown by the red arrows. This remote NUMA memory access comes
    at a performance cost of reduced speed of access and reduced memory throughput
    that will impact memory-bound (latency-sensitive) workloads like those implemented
    on vFabric SQLFire.


    ![](img/c26bfb34f357e8daa09165d85110e193_141_0.png)


    **Figure 4-9** Two-Socket NUMA Server with Two vFabric SQLFire VMs (Configuration
    Option 1)'
  merge: -1
