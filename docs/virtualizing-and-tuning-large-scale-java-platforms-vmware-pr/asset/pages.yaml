  md: '# Best Practice


    # Description


    BP 55: Storage.


    Use the PVSCSI driver for I/O-intensive vFabric SQLFire workloads.

    nAlign disk partitions in the VMFS and guest OS levels.

    nProvision VMDK files as eagerzeroedthick to avoid lazy zeroing for vFabric SQLFire
    members.

    Use separate VMDKs for vFabric SQLFire persistence files, binary, and logs.

    Map a dedicated LUN to each VMDK.


    As of the Linux 2.6 kernel, the default I/O scheduler is completely fair queuing
    (CFQ). The scheduler is an effective solution for nearly all workloads. The default
    scheduler affects all disk I/O for VMDK and RDM-based virtual storage solutions.
    In virtualized environments, it is often not beneficial to schedule I/O at both
    the host and guest layers. If multiple guests use storage on a file system or
    block devices managed by the host operating system, the host might be able to
    schedule I/O more efficiently because it is aware of requests from all guests
    and knows the physical layout of storage, which might not map linearly to the
    guests'' virtual storage. Testing has shown that NOOP perform better for virtualized
    Linux guests. ESX/ESXi uses an asynchronous intelligent I/O scheduler, and for
    this reason virtual guests should see improved performance by allowing ESX/ESXi
    to handle I/O scheduling. For further information, see "Linux 2.6 Kernel-Based
    Virtual Machines Slow Disk I/O Performance" (http://kb.vmware.com/kb/2011861).


