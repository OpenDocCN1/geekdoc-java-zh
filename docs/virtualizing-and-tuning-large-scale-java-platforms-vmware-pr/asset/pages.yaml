  md: '# CHAPTER 6 Best Practices


    | Best Practice | Description |

    |--- | --- |

    | BP 41: Stack size. | In most cases, the default -Xss stack is adequate, ranging
    in size from 256KB to 1MB depending on the JVM and operating system. However,
    latency-sensitive workloads can benefit from having a large Java stack if the
    objects within a thread do not escape to other threads. Setting the Java stack
    to a larger value reduces the number of concurrent threads you can fit into the
    available RAM. This can improve transaction response times, which might be what
    you are more concerned with (as opposed to packing more, smaller stack threads
    within the same memory space). Setting the -Xss stack to a range of 1 to 4MB is
    common practice for memory-bound latency-sensitive workloads. |

    | BP 42: Perm size. | It is a common practice to set -XX:MaxPoolSize in the range
    from 128 to 512MB, the actual size can vary for your application, and appropriate
    testing should be conducted. In the HotSpot JVM, where class-level information
    is kept. the PermSize this is allocated outside the heap (that is, in addition
    to the -Xmx). |

    | BP 43: Table placements in a JVM. | Place both replicated and partitioned tables
    within 1 JVM instance (that is, within 1 data management node). This provides
    the best scalability and performance. By default, vFabric partitions each data
    point into a bucket using a hashing policy on the key. The physical location of
    the key/value pair is abstracted away from the application. In addition, no default
    relation exists between data stored in different partitioned tables. To run transactions
    on partitioned tables, you must colocate all data accessed in any single transaction
    on the same data host. In, in many cases you can get better performance if you
    colocate similar data within a table and between tables.


    For example:

    A query run on a patient, the related health records, and the insurance and billing
    information is more efficient if all of the data is grouped in a single JVM.


    A financial risk analytical application runs more quickly if all trades, risk
    sensitivities, and reference data associated with a single instrument are located
    together.


    Colocation generally improves the performance of data-intensive operations. You
    can reduce network hops for iterative operations on related data sets. You can
    usually significantly increase overall throughput for compute-heavy, data-intensive
    applications. You specify colocation through specialized vFabric SQLFire DDL keywords
    during table definition.'
