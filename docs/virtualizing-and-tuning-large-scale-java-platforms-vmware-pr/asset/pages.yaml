  md: "# vSphere 5 Performance Enhancements\n\nIn vSphere 5, a majority of enhancements\
    \ focused on improving VMotion throughput.\nBefore inspecting the performance\
    \ charts on the implemented improvements, it is important to understand the three\
    \ phases of a VMotion, which are as follows:\n\n+   - Phase 1 (guest trace phase):\
    \ Traces are placed on the guest memory pages to track any modifications by the\
    \ guest during migration.\n- Phase 2 (precopy phase):\n    - An initial copy from\
    \ source to destination in a preparation phase\n    - Iterative copy of changing\
    \ memory from source to destination\n- Phase 3 (switchover phase):\n    - VM is\
    \ momentarily quiesced on the source, the last set of memory changes are copied\
    \ to the target, and the VM is resumed on target.\n    - During this phase, the\
    \ guest briefly pauses processing.\n    - Duration is generally less than a second;\
    \ however, this could cause an abrupt increase in latency.\n\nThe improvements\
    \ are are as follows:\n\n+   - Ability to use multiple network adapters for vMotion\n\
    - Latency-aware Metro VMotion that improves performance over long latency and\
    \ increases round-trip tolerance limit for 5msec to 10msec\n- Stun During Page\
    \ Send (SDPS) ensures that VMotion will not fail due to memory convergence issues:\n\
    \    - ESXi 4.1, a precopy process will fail to make forward progress due to rapidly\
    \ changing memory and hence fail the vMotion.\n    - ESXi 5 has the enhancement\
    \ to slow down the memory changes in the source VM, so that the precopy process\
    \ can converge faster.\n\n+   - Significant improvements to reduce memory-tracing\
    \ overhead:\n    - SPECWeb2005, 12L users (generated 6Gbps traffic), +vCPU VM\
    \ with 12GB RAM.\n- 37% improvement in vMotion duration."
