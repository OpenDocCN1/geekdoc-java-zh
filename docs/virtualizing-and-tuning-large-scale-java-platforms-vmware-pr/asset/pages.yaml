  md: '# Best Practice


    # Description


    BP 20: Set memory reservation for VM memory needs. running on VMs have an active
    heap space requirement that must always be present in physical memory. Use the
    VMware vSphereClient to set the reservation equal to the needed VM memory:


    Reservation memory = VM memory = Guest OS memory + JVM memory


    Set the reservation equal to the total configured memory of the VM.


    If you have multiple JVMs (N JVMs) on a VM, VM memory = Guest OS memory + N *
    JVM memory.


    # BP 21: Use of large pages.


    Large pages have varied results, and they entirely depend on the nature of the
    workload. Performance of large pages can sometimes vary from -10% degradation
    to about 20% improvement.


    Large pages must be enabled at both the guest OS and JVM level.


    To enable large pages at the JVM level, set the -XX:+UseLargePages at the JVM
    level for Sun HotSpot.


    On the IBM JVM, it is -Xlp and JRockock -XXLargePages. You also need to enable
    this at the guest OS level. When enabling large pages at OS level, make sure to
    turn off all processes that may have negative impact due to memory resizing. A
    clean way of doing this is to shut down major processes that consume a lot of
    memory.


    To check large pages allocation, use the following:


    ```

    # /proc/meminfo | grep Huge

    HugePages_Total: 0

    HugePages_Free: 0

    HugePages_Rsvd: 0

    Hugepagesize: 4096 kB

    ```'
