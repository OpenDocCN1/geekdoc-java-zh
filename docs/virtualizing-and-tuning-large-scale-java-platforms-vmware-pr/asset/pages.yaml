  md: '# Best Practice


    # Description


    BP 54: Trouble-shooting SYN cookies (continued). To check for the presence of
    SYN cookies, use the following:


    ```

    grep SYN /var/log/messages Aug 2 12:19:06

    w1-vFabric-g1 kernel: possible SYN flooding on port

    53340.

