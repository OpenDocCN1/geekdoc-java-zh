    # ### Best Practice 9: Disk Persistence


    +   - Gateway sender, AsyncEventListener, and DBSynchronizer queues are always
    overflowed and can be persisted.

    - For best performance, locate each disk store on a separate physical disk.

    - Use persistence for gateway sender queues because those always have overflow
    enabled and the ability to persist these queues provides additional high-availability
    protection.

    - Tables can be overflowed, persisted, or both. For efficiency, place table data
    that is overflowed on one disk store on a dedicated physical disk. Place table
    data that is persisted, or persisted and overflowed, on another disk store with
    a different physical disk.

    - When calculating your disk requirements, consider your table modification patterns
    and compaction strategy. vFabric SQL creates each oplog file at the specified
    MAXSIZE. Obsolete DML operations are removed from the oplog only during compaction,
    so you need enough space to store all operations that are between compactions.
    For a mix of updates and deletes, if you use automatic compaction, a good upper
    bound for the required disk space is:

    (1 / compactionthreshold) * Data size

    where data size is the total size of all the table data you store in the disk
    store.

    Therefore, for the default COMPACTIONTHRESHOLD of 50, the disk space is roughly
    twice your data size. The compaction thread could lag behind other operations,
    causing disk use to rise above the threshold temporarily. If you disable automatic
    compaction, the amount of disk required depends on how many obsolete operations
    accumulate between manual compactions.

    - When you start your system, start all the members that have persistent tables
    in parallel. Create and use startup scripts for consistency and completeness.'
