  md: '# Large-Scale Java Platform Technical Considerations


    NOTE

    vsSphere 4.1/ESXi 4.1, the underlying physical NUMA architecture is not exposed
    by the hypervisor to the operating system, and therefore application of additional
    NUMA workloads running on such VMs cannot take specific advantage of NUMA hooks
    that they may provide. However, in vSphere5, the concept of vNUMA was introduced,
    through configuration you can expose the underlying NUMA architecture to the operating
    system, and NUMA-aware applications can take advantage of it. In Java, the -XX:+UseNUMA
    JVM option is available; however, it is compatible only with the throughput GC
    and not the CMS GC. Paradoxically, in memory-intensive cases where NUMA is a huge
    factor, latency sensitivity is a big consideration, and therefore the CMS collector
    is more suitable. This implies that you cannot use CMS and the -XX:+UseNUMA option
    together. The good news is that vSphere NUMA algorithms are usually good enough
    to provide locality, especially if you have followed good NUMA sizing best practices—such
    as sizing VMs to fit within NUMA boundaries for memory and vCPU perspective.


