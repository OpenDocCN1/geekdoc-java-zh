  md: '# NOTE


    In vSphere 5+, the ability to configure vNUM is available. This is the mechanism
    by which the hypervisor provides a configuration that enables you to expose the
    underlying NUMA architecture of the vHost to the guest OS running on the VM. This
    is so NUMA-aware applications can take additional advantage of NUMA locality for
    better memory throughput and hence higher performance. In Java, for example, there
    is the XX:+UseNUMA JVM option which will localize the execution to the NUMA node.
    However, in case of category 2 in-memory database Java platforms, this is where
    the JVMs are fairly large and NUMA awareness is critical; also to get the required
    performance and minimize impact on latency, it likely likely will need to use
    the GC. In fact, you will almost always use the combination of -XX:+ParNewGC and
    GCs. If that is the case, then as of this, the -XX:+UseNUMA flag is not supported
    when using GC. The good news is that you really don''t need to use this -XX:+UseNUMA
    flag when running on vSphere; it turns out that if you use the examples in this
    book and the vSphere NUMA optimization, locality is likely already well intact.
    If your post has NUMA locality, it should be 100%. Default vSphere NUMA locality
    is one advantage of VM virtualized workloads compared to compared workloads running
    on physical systems. On physical systems, you would have to use numactl to perform
    a manual placement of the Java process and this process is not always straightforward.
    However, on virtualized systems, usage of numactl is not required because the
    entire VM is localized within the NUMA node as long as it is sized correctly.


    In some cases, if two VMs are running on the same vHost, and these VMs have a
    high amount of chatter, the VMs could potentially fit within one NUMA node from
    a size perspective, default placing the two VMs on the same node. This type of
    biasing can also cause poorer performance and scalability numbers. Now in some
    cases to prevent the activation of the default rule, a performance tuning applied
    to them would be to leverage the advanced parameter /Numa/LocalityWeightAction/Affinity=0.
    This setting controls the weight that the CPU scheduler gives to inter-VM communication
    when making decisions about assigning VMs to NUMA nodes. For further information
    about the performance study pertaining to this conclusion, see topic 3 of the
    vFabric Reference Architecture, which you can download from http://blogs.vmware.com/vFabric/2013/02/introducing-a-new-reference-architecture-that-will-speed-knowledge-development-of-modern-cloud-applications.html.


    Figure 4-9 (Configuration Option 1) and Figure 4-10 (Configuration Option 2) provide
    the best NUMA locality, and therefore can allocate high-throughput memory to the
    vFabric SQL database far and the enterprise data-consuming applications. However,
    there are times when you want to consume the entire CPU capacity across all the
    sockets'
