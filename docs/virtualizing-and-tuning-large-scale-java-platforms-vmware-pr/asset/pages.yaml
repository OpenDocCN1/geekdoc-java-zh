  md: '# Best Practice 6: Horizontal Partitioning


    +   - Horizontal partitioning can greatly enhance scalability and performance
    of enterprise applications.

    - Most commonly, Partition By is applied on the primary key of a table.

    - vFabric SQLFire horizontal partitioning places an entire row in the same hash
    indexed bucket, and therefore all data operations against rows in the bucket are
    executed within the same memory space.

    - Test your partitioning scheme often to confirm balance for all vFabric SQLFire
    members.


    # Redundancy


    In vFabric SQLFire, you can specify how many redundant copies of specific data
    to keep. vFabric SQLFire manages the synchronization of all data changes across
    the primary copy and all backup copies. When a server fails, vFabric SQLFire automatically
    reroutes any operations that were trying to read or write from the failed member
    to the surviving members. In Figure 2-10, the redundancy clause is used as REDUNDANCY
    1 to indicate to vFabric SQLFire that one redundant copy should be copied to another
    member somewhere in the cluster.


    ```

    CREATE TABLE FLIGHTS (

    FLIGHT_ID CHAR(6) NOT NULL,

    SEGMENT NUMBER NOT NULL,

    ORIG_AIRPORT CHAR(3),

    DEST_AIRPORT CHAR(3),

    DEPART_TIME TIME,

    FLIGHT_MILES INTEGER NOT NULL),

    PARTITION BY COLUMN(FLIGHT_ID)

    REDUNDANCY 1;

    ```


    ![](img/c26bfb34f357e8daa09165d85110e193_70_0.png)


    Figure 2-10 Using Redundancy on the Flights Table'
