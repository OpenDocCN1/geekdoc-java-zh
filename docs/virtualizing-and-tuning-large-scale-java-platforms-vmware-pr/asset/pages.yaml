    # Summary of Findings


    The following findings are learned from this study:


    +   - It was relatively straightforward to use the DDLUtils utility to convert
    the schema and the data of the RDBMS associated with the Spring Travel application.


    +   - The installation of vFabric SQLFire was also straightforward.


    +   - The test results show that Spring Travel using vFabric SQLFire scaled approximately
    4x when compared to the Spring Travel application using an RDBMS.


    +   - The response times of vFabric SQLFire were 5x to 30x faster with vFabric
    SQLFire. Further, the response times on vFabric SQLFire were more stable and constant
    with increased load.


    +   - The configuration of Spring Travel with an RDBMS has a response time that
    increases linearly with increased load.


    +   - The breakpoint for the Spring Travel application against an RDBMS was at
    80% CPU utilization for about 1850 concurrent threads, when the Spring Travel
    application stopped responding. By contrast, the vFabric SQLFire version of Spring
    Travel continued to pace ahead at 98% CPU utilization and achieved 7200 concurrent
    threads.'
