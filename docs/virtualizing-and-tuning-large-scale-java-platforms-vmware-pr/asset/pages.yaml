  md: '# Option 2 Cons


    The cons for using Option 2 are as follows:


    +   - Because of the larger-size JVMs, you risk losing more data (when compared
    with the case of smaller JVMs in option 1) if a JVM crashes without proper redundancy
    or persistence of transactions in place.


    +   - Due to consolidation, you might have fewer high-availability (HA) JVM instances.


    +   - Consolidation is limited to line of business. You do not want to mix applications
    from different lines of business into the same JVM; a crash of the JVM would impact
    both lines of business if you were to mix two into one JVM.


    +   - Large JVMs may require some GC tuning.


    # Option 3


    If option 1 and option 2 are not possible, consider option 3. In this case, you
    are placing multiple JVMs on a larger VM. Now JVM-1B and JVM-2B could be JVMs
    that consolidated copies, like the ones in option 2, or nonconsolidated copies
    like in option 1. In either case, you can stack these JVMs on a larger VM, or
    multiple large JVMs for matter.


    # Option 3 Pros


    The pros for using Option 3 are as follows:


    +   - If the current platform is similar to that in option 1, it might be an advantage,
    because of logistical reasons, to keep the current number of JVMs intact in the
    deployment, but then consider building larger JVMs with multiple JVMs stacked
    on them.


    +   - Reduced number of operating system licenses.


    +   - Reduced number of VM instances.


    +   - Reduced administration cost due to having fewer VMs.


    +   - You can have dedicated JVMs for each line of business but can also deploy
    JVMs from multiple lines of business on the same VM. You should do this only if
    the cost of VM consolidation outweighs the danger of having multiple lines of
    business impacted during a VM crash.


    +   - Large VMs makes it possible to have more vCPUs for JVMs. If a VM has two
    large JVMs on it from different lines of business, for example, and they peak
    at different times, it is likely that all the vCPUs are available to the busy
    JVM, and similarly for the next JVM when its peak arrives.'
