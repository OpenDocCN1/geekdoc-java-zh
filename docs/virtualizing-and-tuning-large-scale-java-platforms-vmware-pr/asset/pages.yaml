  md: '# Table 7-1 Common esxtop Metrics


    | Display | Metric | Threshold | Description |

    | :--- | :--- | :--- | :--- |

    | CPU | %RDY | 5 | Overprovisioning of vCPU, excessive usage of virtual symmetric
    multiprocessing (vSMP), or a limit (check %MLMTD) has been set. This %RDY value
    is the sum of all vCPU %RDY for a VM. For example, if %RDY is 20 for a 1-vCPU
    VM, this is problematic because it means 1 vCPU is waiting 20% of the time for
    the VMkernel to schedule it. In contrast, if %RDY is 20 for a 4-vCPU VM, this
    is probably okay, because on average only 5% of the time the CPU cores were not
    available. You should investigate any threshold %RDY value of 10% or higher. |

    | CPU | %CSTP | 3 | Percentage of time a resource spends in a ready, co-schedule
    state. Values beyond 3 indicate excessive usage of vSMP. Decrease the number of
    vCPUs for this particular VM. |

    | CPU | %MLMTD | 0 | Percentage of time the ESXi VMkernel deliberately did not
    run the resource pool, VM, or world because doing so would violate the resource
    pool, VM, or world''s limit setting. Because the resource pool, VM, or world is
    ready to run when it is prevented from running in this way, the %MLMTD (max limited)
    time is included in %RDY time. If larger than 0, the worlds are being throttled.
    One possible cause is a limit on CPU. | CPU | %SWWT | 0 | Percentage of time a
    resource pool or world spends waiting for the ESXi VMkernel to swap memory. The
    %SWPWT (swap wait) time is included in the %WAIT time (the VM waiting on swapped
    pages to be read from disk). You may have overcommitted memory. Any value greater
    than 0 is problematic. |'
