  md: '# ## Are there any Java best practices for vSphere?


    Yes. See the best practices in Chapter 6, “Best Practices.”


    # ## How would you achieve vertical scalability of Java applications running on
    vSphere?


    Vertical scalability features of vSphere allow for compute resources to be adjusted
    at any time without need for redesign. Depending on the situation and supportability
    of the guest operating system, you can adjust CPU and memory. However, if you
    adjust the Java heap size, a JVM restart is usually required.


    # ## How would you achieve horizontal scalability of Java applications running
    on vSphere?


    Horizontal scalability enables you to rapidly create new VMs and have them service
    traffic to meet your demands. Creating VMs is easy, but to truly create a scale-out
    capacity of your application, the newly created VM must be easily introduced into
    the load balancer pool to service additional traffic.


    # ## How would you guard against server hardware failure when Java applications
    running on vSphere?


    VMware high availability (HA) can relocate the Java application server to another
    host that is active, minimizing downtime and disruption to service levels. Now
    because Java workloads are horizontally scaled out, it implies that there is more
    than one copy to service transactions, so when you power cycle JVM, other JVMs
    are still up and servicing transactions. It is true, however, that the JVM that
    you have just restarted would have lost transactions that were midstream. In such
    cases, you can consider a fault-tolerant persistence mechanism at the application
    level to guard against this.


    # ## How would you achieve high availability of Java applications running on vSphere?


    You can achieve optimal HA via VMware Distributed Resource Scheduler (DRS), which
    can be used to balance workloads automatically. VMware HA and DRS with minimal
    configuration changes can provide a robust availability solution.'
  merge: -1
  pgno: 251
