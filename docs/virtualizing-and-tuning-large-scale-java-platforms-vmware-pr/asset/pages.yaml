    # # Chapter Summary


    In this chapter, we explored how to best establish a Java platform size by conducting
    scale-up and scale-out tests to determine the building block VM and JVM. This
    building block VM and JVM then was used to establish the best size for a vSphere
    host. Once the size of a vSphere host was established, sizing a cluster to accommodate
    the traffic for your application was a relatively simple matter of linearly scaling.
    Now, of course, with linear scaling comes unforeseen bottlenecks that break the
    linearity and scalability of a system; this is why you should load test the entire
    vSphere cluster. The chapter concluded with an exploration of how to best size
    in-memory databases such as vFabric SQLFire, a category 2 and 3 type of workload.'
