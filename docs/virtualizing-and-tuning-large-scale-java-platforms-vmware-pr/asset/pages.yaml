  md: '# Best Practice


    # Description


    BP 30: Load-balancer algorithm choice and VM symmetry. Use load-balancer pool
    for web server VMs and a second pool for Java application server VMs.


    When setting up new application nodes, it is advisable to have a minimum of 3
    VMs spread across at least 3 vSphere hosts to ensure better availability. The
    reason for this is that if 1 of the VMs or vSphere hosts becomes faulty, then
    at least 2 VMs or vSphere hosts are available to provide robust high availability.
    No doubt, this is a setup for serious production systems, and is a smaller version
    of the overall active-active architecture discussed in the "Active-Active Architectures
    and Modern Data Platforms" section in Chapter 2, "Modern Scalable Data Platforms."
    For a comprehensive fault-tolerant and globally available system, review the active-active
    approach discussed in Chapter 2.


    Follow all the design and sizing guidelines discussed far in the book, and select
    the appropriate number of JVMs in 1 pool and a secondary pool for web servers.
    Direct traffic from web pool members to the members of JVM load-balancer pool
    (that is, the Java application server load-balancer pool).


    When directing traffic between web pool member and JVM pool member, session stickiness
    may be needed. Most Java applications require session stickiness to fulfill authentication
    and single sign-on requirements, or sometimes AJAX calls also need stickiness.


    Take into account the available algorithms of your load balancer. Make sure that
    all of your VMs are receiving an equal share of the traffic. Some industry standard
    algorithms are round-robin, weighted round-robin, least connections, and least
    response time. You may want to initially default to least connections and adjust
    as you see fit in your load test iterations.


    Keep your VMs symmetrical in terms of the size of compute resource. For example,
    if you decide to use 2-vCPU VMs as a repeatable, horizontally scalable building
    block, this helps with your load-balancing algorithm, working more effectively
    than if there were a pool of nonsymmetrical VMs for 1 particular application.
    That is, mixing 2-vCPU VMs with 4-vCPU VMs in 1 load-balancer-facing pool is nonsymmetrical
    and the load balancer has no notion of weighing unless you configure for it at
    the load-balancer level, which is time-consuming.'
