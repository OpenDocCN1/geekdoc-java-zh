    # NOTE


    The VMware vSphere ESXi scheduler has many NUMA optimizations that attempt to
    localize the execution of the process and fetch memory from the local NUMA node.


    Sometimes, ample memory exists on the second NUMA node after the first NUMA node
    has been used by the vFabric SQLFire member VM. In this case, you might be able
    to place a second vFabric SQLFire server on the second NUMA node, as demonstrated
    in Figure 4-9. However, due to stringent redundancy rules, for example, you opt
    not to place a second vFabric SQLFire server on the same server machine/vSphere
    host. In this case, you can instead place other enterprise applications most likely
    are the ones consuming data from the vFabric SQLFire fabric, and therefore it
    makes sense to have them deployed on the same vSphere host. The idea is to utilize
    the full available memory capacity on the vSphere host. Figure 4-10 shows this
    type of approach, where one NUMA node has the application server instances of
    the client tier that consume data from distributed cache data member that resides
    in the second NUMA node.


