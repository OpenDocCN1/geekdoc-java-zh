  md: '# Asynchronous Listeners


    The previous discussion focused on listeners and writers, which essentially are
    synchronous callback handlers. If synchronous handlers are not possible for an
    enterprise consuming application because of their potential to block, or perhaps
    there is an unreliable consuming client, asynchronous listeners are a prudent
    alternative. An AsyncEventListener instance is serviced by its own dedicated thread
    in which a callback method is invoked. Events that correspond to DML operations
    are placed in an internal queue, and the dedicated thread dispatches a batch of
    events at a time to the user-implemented callback class. The frequency of dispatch
    events is governed by the configuration of the AsyncEventListener in vFabric SQLite.


    In Figure 2-22, a TestAsyncEventListener is registered on the Flights table to
    be called back when a DML event happens. The DML events are enqueued into an event
    queue and then dequeued from the event queue based on the configured cycle. When
    the event is dequeued, it turn calls the registered TestAsyncEventListener.process()
    method.


    ![](img/c26bfb34f357e8daa09165d85110e193_85_0.png)


    Figure 2-22 An Example TestAsyncEventListener Showing a Registration and Execution
    Cycle Through an Event Queue'
