  md: '# Performance


    Customers often report improved middleware platform performance when virtualizing.
    Performance improvements are partly due to the updated hardware that customers
    will typically refresh during a virtualization project. Some performance improvement
    occurs, too, due to the robust VMware hypervisor. The VMware hypervisor has improved
    considerably in the past few years, and Chapter 5, "Performance Studies," discusses
    a few performance studies done to showcase some of the heavy workloads that were
    tested in a virtualized environment.


    # Large-Scale Java Platform Technical Considerations


    When designing large-scale Java platforms, many technical considerations come
    into play. For example, a good understanding of Java garbage collection (GC) and
    JVM architecture, hardware, and hypervisor architectures is essential to building
    good large-scale Java platforms. At a high level, GC, Non-Uniform Memory Architecture
    (NUMA), and theoretical practical memory limits are discussed. Later chapters
    provide a more detailed description, but it is imperative to start at a high-level
    understanding of the issues surrounding large-scale Java platform designs.


    # Theoretical and Practical Limits of Java Platforms


    Figure 1-1 depicts the theoretical and practical sizing limits of Java workloads,
    critical limits to remember when sizing JVM workloads.


    +   - It is important to highlight that the JVM theoretical limit is 16 exabytes;
    however, no practical system can provide this amount of memory. So, we capture
    this as the first theoretical limit.

    - The second limit is the amount of a memory guest operating system can support;
    in most practical cases, this is several terabytes (TB) and depends on the operating
    system being used.

    - The third limit is the ESXi5 1TB RAM per VM, which is ample for any workload
    that we have encountered with our customers.

    - The fourth limit (thely first practical limit) is the amount of RAM that is
    cost-effective on typical ESXi servers. We find that, on average, vSphere hosts
    have 128GB to 144GB, and at the top end 196GB to 256GB. Certainly from a feasibility
    standpoint, the hard limit is probably around 256GB. There are, of course, larger
    RAM-based vSphere hosts, such as 384GB to 1TB; however, these are probably more
    suited for 2 types of in-memory database workloads and more likely'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'suited for traditional relational database management systems (RDBMS) that
    would utilize such vast compute resources. The primary reason these systems need
    large vSphere hosts is because most (with some minor exceptions, such as Oracle
    RAC) traditional RDBMS do not scale out and mainly scale up. In the case of category
    1 and category 2, a scale-out approach is available and so the potential selection
    of a more cost-effective vSphere host configuration is afforded. In category 1
    types of Java workloads, you should consider vSphere hosts with a more reasonable
    RAM range of less than 128GB.


    +   - The limit is the total amount of RAM across the server and how this is divided
    into a number of NUMA nodes, where each processor socket will have one NUMA node
    worth of NUMA-local memory. The NUMA-local memory can be calculated as the total
    amount of RAM within the server divided by the number of processor sockets. We
    know that for optimal performance you should always size a VM within the NUMA
    node memory boundaries; no doubt, ESX has many NUMA optimizations that come into
    play, but it is always best to stay NUMA local.


    If the ESX host, for example, has 256GB of RAM across two processor sockets (that
    is, it has two NUMA nodes with 128GB (256GB/2) of RAM across each NUMA node),
    this implies that when you are sizing a VM it should not exceed the 128GB limit
    for it to be NUMA local.


    ![](img/c26bfb34f357e8daa09165d85110e193_38_0.png)


    Figure 1-1 Theoretical and Practical Limits of Java Platforms'
