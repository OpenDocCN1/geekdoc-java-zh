  md: '# CHAPTER 2 Modern Scalable Data Platforms


    +   - Install no more than one standby DBSSynchronizer (redundancy of at most
    one) for performance and memory reasons.


    +   - A DML operation may be reapplied to the RDBMS if the member with the active
    DBSSynchronizer thread fails. If the member with the active DBSSynchronizer fails
    while sending a batch of operations, some DML statements in the batch might already
    have been applied to the RDBMS. On failover, the new DBSSynchronizer resends the
    failed batch and reapplies the initial DML operations. When this occurs, the RDBMS
    can get out of sync depending on the nature of the DML operation, how it modifies
    table columns, and the presence or absence of column constraints.


    +   - If the table has any constraint (primary key, unique) defined, the following
    types of DML operations do not operate out-of-sync when reapplied during failover:


    +   - A operation that is reapplied to a table with a primary key. A primary key
    constraint violation occurs and a SQLException is thrown, but DBSSynchronizer
    ignores the exception.


    +   - A create or update operation that causes a unique constraint violation.
    Reapplying a create or update operation causes a duplicate value, violating the
    unique constraint. DBSSynchronizer ignores the SQLException that is thrown in
    this situation.


    +   - A create or update operation that causes a check constraint violation. Reapplying
    creating or an update (for example, incrementing or decrementing a column value)
    can cause a check constraint to be violated. DBSSynchronizer ignores the SQLException
    that is thrown in this situation.


    +   - If DBSSynchronizer encounters an exception while updating or committing
    to the database, the batch is retained and the DBSSynchronizer thread continues
    to try to apply the batch until it is successful.


    +   - If DML operations are executed concurrently on a vFabric SQLFire system
    that has a foreign key relationship based on parent and child table, a foreign
    key violation may occur when applying DML operations to the external database.
    This can occur even if the vFabric SQLFire system successfully executed the DML.
    Although inserts into the parent and child table occur in order in the vFabric
    SQLFire system, the inserts can reach DBSSynchronizer in reverse order. To avoid
    this behavior, perform updates to parent and child tables in a single application
    thread.'
