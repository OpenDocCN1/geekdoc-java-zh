  md: '# Best Practice 14: Asynchronous Listeners


    +   - An AsyncEventListener instance is serviced by its own dedicated thread in
    which a callback method is invoked.


    +   - Events that correspond to DML operations are placed in an internal queue,
    and the dedicated thread dispatches one batch of events to the user-implemented
    call-class. This can be very beneficial in integrating systems across the enterprise
    that might have varied reliability and response-time SLAs.


    +   - Certain data consistency problems can occur if multiple threads update data
    that is queued to an AsyncEventListener implementation. This implies that there
    is no order of events guarantee.


    # NOTE


    vFabric SQLFire preserves the order of DML statements applied to the distributed
    system (and queued to AsyncEventListeners or remote WAN sites) only for a single-thread
    of execution. Updates from multiple threads are preserved in FIFO order. Otherwise,
    vFabric SQLFire provides no "total ordering" guarantees.


    Data inconsistency can occur if multiple threads concurrently update the same
    rows of a replicated table, or if threads concurrently update related rows from
    replicated tables in a parent-child relationship. Concurrently updating the same
    row in a replicated table can result in some replicas having different values
    from other replicas. Concurrently deleting a row in a parent table and inserting
    a row in a child table can result in orphaned rows.


    When DML operations are queued to an AsyncEventListener or remote WAN site, similar
    inconsistency problems can occur with concurrent table access. For example, if
    two separate threads concurrently update rows on a parent table and child table,
    respectively, the order in which vFabric SQLFire queues those updates to an AsyncEventListener
    or WAN gateway might not match the order in which the tables were updated in the
    main distributed system. This can cause a foreign key violation in a back-end
    database (for example, using DBSSynchronizer) or in a remote WAN system that does
    not occur when the tables are initially updated. These types of out-of-order updates
    update the same key of a partitioned table. However, an application should always
    use a transaction for any operation that updates multiple rows.'
