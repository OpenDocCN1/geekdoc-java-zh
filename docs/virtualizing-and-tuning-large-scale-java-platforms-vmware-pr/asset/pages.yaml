  md: '# “We have a monitoring system that is a single JVM heap of 360GB. Can we tune
    this?”


    The first question you should ask is why the monitoring system has only one JVM.
    Wouldn''t it be a concern that there is a single point of failure? Perhaps you
    can defer your question back to the vendor of the monitoring system. Here are
    things to keep in mind:


    +   - In the meantime, you can at least virtualize it and get the benefits of
    VMware HA, just in case it needs to be somewhere else during a potential failure
    situation (so at least this way you have some level of protection).


    +   - The main trick to sizing such large JVMs is the size of the underlying Non-Uniform
    Memory Access (NUMA) nodes. As usual, always choose two-socket vSphere hosts;
    those will yield the largest NUMA nodes


    +   - If you have 1TB of memory on the host, sizing the monitoring system JVM
    process that is in question would be quite straightforward because the entire
    process would fit into a NUMA node. However, amount of memory is usually pricey,
    and not many customers have it, and certainly in this case the customer only has
    512GB across the vSphere host.


    +   - Because there is only 512GB on the vSphere host, we have to take into account
    aspects of the Java process that will run across two NUMA nodes.


    +   - The main thing is to try to fit at least one section of the Java heap within
    one NUMA node. In this case, if you apply the best practice that the young generation
    (-Xmn) should be 33% of the Java heap (-Xmx), this implies 0.33 * 360GB => 118.8,
    rounded to 118GB. This should fit into one of the NUMA nodes, but let''s double-check
    this.


    +   - The vSphere host is made of 512GB RAM and 2 sockets of 10 cores each. If
    we avoid overhead calculation, then per NUMA node memory => ((0.99 * 512) - 1)
    / 2 => 252.94, rounded up to 253GB, is the amount of local NUMA memory.


    +   - Based on this NUMA bank about 253GB, the young generation and parts of the
    old generation will fit nicely into the first NUMA node, and some will interleave
    to the next NUMA node, because the young generation is 118GB, and the old generation
    is 360 - 118 => 242GB. All of the young generation 11 * GB will fit into the NUMA
    node, and a partial section of the 242GB old generation will interleave across
    two NUMA nodes. This, of course, can be problematic, but your customer might have
    just gotten used to the type of performance offered by such a setup and accepted
    it.'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'Assuming you really need a JVM that is 360GB, you would size a single VM with
    360GB + 1GB for OS + 25%, 360GB for off-heap overhead => 360GB + 1GB + 90GB =
    451GB possible memory will be used by the Java process. Because this is a single
    VM, the vSphere NUMA scheduler will do its best to localize the execution to the
    local NUMA bank. It can also apply NUMA client methodology where the singular
    VM is actually underneath to manage NUMA interleaving


    Figure-5 illustrates one potential configuration for the 360GB JVM.


    ```

    java -Xms360g -Xmx360g -Xmn118g -Xss1024k -XX:+UseConcMarkSweepGC

    -XX:+UseParallelGC -XX:InitiatingOccupancyFraction=75

    -XX:+UseCMSInitiatingOccupancyOnly -XX:+ScavengeBeforeFullGC

    -XX:TargetSurvivorRatio=8 -XX:SurvivorRatio=8

    -XX:+UseBiasedLocking -XX:MaxTenuringThreshold=-

    -XX:+ParallelGCThreads=10 -XX:+OptimizeStringConcat

    -XX:+UseCompressedStrings -XX:+UseStringCache -XX:+DisableExplicitGC

    ```


    Figure-5 JVM Configuration of a Monitoring System for a 360GB Heap


    Every attempt should be made to size the Java process heap to fit within the NUMA
    node (as is often possible) because most heap spaces of this magnitude are underutilized.
    The other reason is the efficiency enhancement in terms of better throughput gained
    from local NUMA memory for both young generation and old generation easily exceeds
    the need to have a heap that is larger than the NUMA node. An alternative to the
    configuration in Figure A-5 is the configuration shown in Figure A-6, where we
    have reduced the heap size to fit within the NUMA node. The NUMA node is 253GB,
    allowing for 1GB for the guest OS. This implies the total Java process can have
    252GB worth of memory, now allocating 10% in this to also the off-heap section.
    It implies that the Java heap can be 0.9 * 253GB => 226GB. We then apply a young
    generation size of 33% of 226GB => 74GB, rounding to 74GB. This assumes that you
    will size the VM memory reservation to 253GB so that the entire VM process, and
    hence the entire JVM, fits into one NUMA node. The advantage of virtualizing such
    a process is to leverage all the high availability, scalability, and vMotion of
    vSphere. Additionally, vSphere NUMA optimization algorithm is available by default;
    this algorithm'
