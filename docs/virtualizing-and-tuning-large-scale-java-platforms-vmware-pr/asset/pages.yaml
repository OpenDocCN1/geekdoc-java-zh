    # Transactions


    In vFabric SQLFire, any one or more SQL statements comprise a logical unit of
    work that has transaction semantics; that is, the unit of work can be committed
    or rolled back in its entirety. The vFabric SQLFire implementation of distributed
    transaction coordination allows for linear scalability without compromising atomicity,
    consistency, isolation, and durability, which are the ACID properties. Because
    vFabric SQLFire members that participate in a transaction hold their own transaction
    state, queries on the database always see committed data, and they do not need
    to acquire locks. Therefore, reads and writes can run in parallel in the READ_COMMITTED
    isolation level.


    In the case of transactional writes, vFabric SQLFire locks each copy of a row
    that is being updated on each member. This alleviates the need for a distributed
    lock manager, and for greater scalability. Also, vFabric SQLFire uses special
    read locks for REPEATABLE_READ and foreign key checks to ensure that these rows
    do not change for the duration of a transaction. vFabric SQLFire locks generally
    fail eagerly (fail-fast) with a conflict exception if a lock cannot be obtained
    because of concurrent writes from other transactions. An exception to this fail-fast
    behavior occurs when the vFabric SQLFire member that initiates the transaction
    also has data for the transaction. In this case, vFabric SQLFire batches transactions
    on the local member for performance reasons, and conflicts might not be detected
    on other nodes until just before commit time when vFabric SQLFire flushes the
    batched data.


    When data is managed in partitioned tables, each row is implicitly owned by a
    single member for nontransaction operations. However, with distributed transactions,
    all copies of a row are treated as equivalent, and updates are routed to all copies
    in parallel. This makes the transactional behavior for partitioned tables similar
    to the behavior for replicated tables. The transaction manager works closely with
    the vFabric SQLFire'
