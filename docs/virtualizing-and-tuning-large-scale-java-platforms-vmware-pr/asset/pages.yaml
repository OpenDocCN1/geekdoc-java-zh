  md: '# Best Practice


    # Description


    BP 27: Use vSphere-aware load balancers.

    vSphere makes it easy to add resources such as host and VMs at runtime. It is
    possible to provision these ahead of time. However, it is simpler if you use a
    load balancer that can integrate with vSphere application programming interfaces
    (APIs) to detect the newly added VMs and add them to their application load-balancing
    pools without downtime.


    # Inter-Tier Configuration Best Practices


    Much of the discussion has centered on the Java process thus far, but there are
    other considerations. There are other tiers. In fact, there are four tiers: the
    load balancer tier, the web server tier, the Java application tier, and the DB
    server tier. The configurations for compute resources at each tier must translate
    to an equitable configuration at the next tier. For example, if the web server
    tier is configured to handle 100 HTTP requests per second, of these requests must
    determine how many Java application threads are needed, and in turn how many DB
    connections are needed in the JDBC pool configuration. Table 6-6 describes best
    practices for inter-tier configuration.


    # Table 6-6 Inter-Tier Configuration Best Practices


    # Best Practice


    # Description


    BP 28: Establish appropriate thread ratios that prevents bottlenecks (HTTP threads:Java
    connections ratio).

    is is the ratio of HTTP threads to Java threads to DB connections.


    Establish initial by setting up that each layer requires a 1:1:1 ratio of HTTP
    threads:Java threads:DB connections, and then based on the response time and throughput
    numbers, adjust each of these properties until you have satisfied your SLA objectives.


    For example, if you have 100 requests submitted to the web server initially, assume
    that all of these will have an interaction with Java threads, and in turn, DB
    connections. Out of reality, during your benchmark you will find that not all
    HTTP threads are submitted to the Java application server, and in turn, not all
    Java application server threads require a DB connection. That is, you may find
    your ratio for 100 requests translates to 100:25 Java threads:10 DB connections,
    and this depends on the nature of your enterprise Java application behavior. Benchmarking
    helps you establish this ratio.


    Configure a separate web pool with adequate number of web server instances in
    talk to a secondary pool that has Java application server member VMs in it. This
    will ensure horizontal scalability at both web server and Java application server
    layers.'
