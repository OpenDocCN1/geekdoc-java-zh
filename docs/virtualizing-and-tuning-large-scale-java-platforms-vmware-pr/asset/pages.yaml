  md: '# Large-Scale Java Platform Technical Considerations


    ![](img/c26bfb34f357e8daa09165d85110e193_40_0.png)


    Figure 1-2 GC Tuning Knowledge Requirements Increase with Larger JVMs


    It is important to keep the following in mind (from left to right in the figure):


    +   - JVMs with a less than 4GB heap size are the most common among workloads
    today. The 4GB is a special case because it has the default advantage of using
    32-bit address pointers within a 64-bit JVM space (and so a very efficient memory
    footprint). These require some tuning, but not a substantial amount. This workload
    falls into the realm of category 1 as defined earlier in this chapter. The default
    GC algorithm on server class machines is adequate. The only time you need to tune
