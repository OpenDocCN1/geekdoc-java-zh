  md: '# Introduction to Large-Scale Java Platforms


    This chapter defines three categories of large-scale Java platforms:


    +   - Category 1: Large number of Java Virtual Machines (JVMs) (100s–1000s of
    JVMs)

    - Category 2: Smaller number of JVMs with large heap sizes

    - Category 3: A combination of category 1 consuming data from category 2


    In addition, the chapter discusses various trends and outlines technical considerations
    to help you understand the range of technical issues associated with designing
    large-scale Java platforms.


    # Large-Scale Java Platform Categories


    Based on field interactions with customers, large-scale Java platforms typically
    fall into three main categories, as follows:


    +   - Category 1: This category is distinguished by its large number of Java Virtual
    Machines (JVMs). In this category, hundreds to thousands of JVMs are deployed
    on the Java platform, and these are typically JVMs that function within a system
    that might be servicing millions of users. I have seen some customers with as
    many as 15,000 JVMs. Whenever you are dealing with thousands of JVM instances,
    you must consider the manageability cost and whether opportunities exist to consolidate
    the JVM instances.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '**Category 2:** This category is distinguished by a smaller number of JVMs
    (usually I to 20) but with large heap size (8GB to 256GB or higher). These JVMs
    usually have in-memory databases deployed on them. In this category, garbage collection
    (GC) tuning becomes critical, as discussed in later chapters.


    **Category 3:** The third category is a combination of the first two categories,
    where perhaps thousands of JVMs run enterprise applications that are consuming
    data from category 2 types of large JVMs in the back end.


    With regard to virtualizing and tuning large-scale Java platforms, four key requirement
    trends hold true across these three categories:


    +   - Compute-resource consolidation

    - JVM consolidation

    - Elasticity and flexibility

    - Performance


    Let''s look at each one of these trends in more detail.


    # Large-Scale Java Platform Trends and Requirements


    Compute resource consolidation, JVM instance consolidation, elasticity and flexibility,
    and performance are some of the major trends that exist within large-scale Java
    platform migration projects. The following subsections examine each of these in
    more detail.


    # Compute-Resource Consolidation


    Many VMware customers find that their middleware deployments have proliferated
    and are becoming an administrative challenge with increasing costs. Customers,
    therefore, are looking to virtualization as a way of reducing the number of server
    instances. At the same time, customers are taking the consolidation opportunity
    to rationalize the number of middleware components needed to serve a particular
    load. Middleware components most commonly run within a JVM with an observed scale
    of hundreds to thousands of JVM instances and provide many opportunities for JVM
    instance consolidation. Hence, middleware virtualization provides an opportunity
    to consolidate twice—once to consolidate server instances and then to consolidate
    JVM instances. This trend is widespread; after all, every IT shop on the planet
    is considering the cost savings of consolidation.


    One customer in the hospitality sector went through the process of consolidating
    their server footprint and at the same time consolidated many smaller JVMs with
    a heap smaller'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Large-Scale Java Platform Trends and Requirements


    than 1GB. They consolidated many of these smaller 1GB JVMs into two categories:
    those that were 4GB and others that were 6GB. They performed the consolidation
    in such a manner that the net total amount of RAM available to the application
    was equal to the original amount of RAM, but with fewer JVM instances. They did
    all while improving performance and maintaining good service level agreements
    (SLAs). They also reduced the cost of administration considerably by reducing
    the number of JVM instances they had to originally manage; this refined environment
    helped them easily maintain SLAs.


    Another customer, in the insurance industry, achieved the same result, but was
    also able to overcommit CPU in development and QA environments to save on third-party
    software costs.


    # JVM Instance Consolidation


    Sometimes we come across customers that have a legitimate business requirement
    to maintain one JVM for an application and/or one JVM per a line of business.
    In these cases, you cannot really consolidate the JVM instances because doing
    so would cause intermixing of the lifecycle of one application from one line of
    business with another. However, although such customers do not benefit from eliminating
    additional JVM instances through JVM consolidation, they do benefit from more
    fully utilizing the available compute resources on the server hardware, resources
    that otherwise would have been underutilized in a nonvirtized environment


    # Elasticity and Flexibility


    It is increasingly common to find applications with seasonal demands. For example,
    many of our customers run various marketing campaigns that drive seasonal traffic
    toward their application. With VMware, you can handle this kind of traffic burst
    by automatically provisioning virtual machines (VMs) and middleware components
    when needed; you can then automatically tear down VMs when the load subsides.


    The ability to change updating/patching hardware without causing outage is paramount
    for middleware that supports the cloud era scale and uptime. VMware vMotion enables
    you to move VMs around without needing to stop applications or the VM. This flexibility
    allows virtualization of middleware while managing large-scale middleware deployments.
    One customer in the financial sector, handling millions of transactions per day,
    used vMotion quite often, without any downtime, to schedule their hardware upgrades;
    a process that otherwise would be costly to their business because of the required
    scheduled downtime.'
