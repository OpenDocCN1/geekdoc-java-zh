  md: '# Best Practice


    # Description


    BP 52: Physical NIC (continued).


    You can verify that your settings have taken effect by issuing the following command:


    ```

    # ettool -c vnicX

    ```


    Note that although disabling interrupt moderation on physical NICs is extremely
    helpful in reducing latency for latency-sensitive VMs, it can lead

    ad to some performance penalties for other VMs on the ESXi host, in addition to
    higher CPU utilization to deal with the higher rate of interrupts from the physical
    NIC.


    Disabling NIC interrupt moderation can also defeat the benefits of large receive
    offloads (LROs), because some physical NICs (such as Intel 1 Gigabit Ethernet
    NICs) that support LRO in hardware automatically disable when interrupt is disabled,
    and the ESXi implementation of software LRO has fewer packets to coalesce into
    larger packets on every interrupt. LRO is an offload for driving high throughput
    for large message transfers at reduced CPU cost. So, consider this tradeoff carefully.


    Refer to "TCP Performance May Occur in Linux Virtual Machines with LRO Enabled"
    (http://kb.vmware.com/kb/102751).


    If the vSphere host is restarted, the above configurations must be reapplied.


    BP 53: Virtual NIC.


    Follow the best practices highlighted in the "Best Practices for Performance Tuning
    of Latency-Sensitive Workloads in vSphere Virtual Machines" (http://www.vmware.com/resources/technologies/100220).


    ESXi VMs can be configured to have one of the following types of virtual NICs:
    Vlance, VMXNET, Flexible, E1000, VMXNET2 (Enhanced), and VMXNET3. This is described
    in "Choosing a Network Adapter for your Virtual Machine" (http://kb.vmware.com/kb/1001805).


    Use VMXNET3 virtual NICs for your latency-sensitive, or otherwise performance-critical,
    VMs. It is the latest generation of paravirtualized NICs designed for performance,
    and is not related to VMXNET or VMXNET2 multiqueue support, receive-side scaling,
    IPv4/IPv6 offloads, and MSI/MSI-X interrupt delivery. Modern enterprise Linux
    distributions based on 2.6.32 or newer kernels, like Red Hat Enterprise 6 and
    SUSE Linux Enterprise 11 SP1, with built-in support for VMXNET3 NICs, so it is
    unnecessary to install VMware Tools to get VMXNET3 drivers for these guest operating
    systems.'
