  md: '# Horizontal Scalability, Clusters, and Pools Best Practices


    Enterprise Java applications deployed on VMware vSphere can benefit from using
    vSphere features for horizontal scalability using vSphere host clusters, resource
    pools, host affinity, and Distributed Resource Scheduler (DRS). Specifically,
    in category 1 types of JVM workloads, where there could be hundreds or thousands
    of JVMs, having the ability to flexibly move VMs is a key feature that can help
    robustly administer such systems. Table 6-5 describes best practices for horizontal
    scalability, clusters, and pools.


    **Table 6-5** Horizontal Scalability, Clusters, and Pools Best Practices


    | Best Practice | Description |

    | --- | --- |

    | BP 24: Use vSphere host clusters. | To enable scalability, use vSphere host
    clusters.<br><br>Within category 1 of JVM workload types, if the scale of JVMs
    is fairly small (for example, fewer than 100 JVMs), this can potentially be a
    cluster that is shared with other workload types. For customers that have just
    a few hundred VMs representing their entire footprint, shared clusters are often
    the norm. However, as you look at a more typical scale of category 1 workloads
    ranging in the thousands of JVMs and VMs, the need for dedicated vSphere host
    clusters quickly emerges. |


    For larger category 1 type of workloads it is important to consider dedicated
    vSphere clusters. Within these dedicated vSphere clusters, you can have consistent
    sizing and varying levels of service that will predictably meet SLAs. These are
    also known as technology-stack-based vSphere clusters (in this case, Java clusters).
    Java vSphere clusters would have a dedicated administrative team that knows the
    Java application well.


    One way of envisioning the dedicated vSphere clusters is that they map to technology
    stacks. So, for example, you have dedicated Java vSphere clusters, and then within
    these clusters you can manage multiple resource pools that act as subclusters
    mapping to each LOB.'
