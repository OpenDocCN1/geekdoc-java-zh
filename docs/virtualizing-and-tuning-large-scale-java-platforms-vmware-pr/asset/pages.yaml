  md: '# Best Practice


    # Description


    BP 49: vMotion, DRS cluster, and vFabric SQL server.


    When you first commission the data management system, place VMware vSphere Distributed
    Resource Scheduler (DRS) in manual mode to prevent an automatic VMware vSphere
    vMotion operation that can impact response times.


    vMotion can complement vFabric SQLServer features during scheduled maintenance
    to minimize downtime impact due to hardware and software upgrades. It is a best
    practice to trigger vMotion migrations over a 10 Gigabit Ethernet network interface
    to speed up the vMotion process.


    Do not allow vMotion migrations with vFabric SQLServer locator processes; the
    latency introduced to this process can cause other members of the vFabric SQLServer
    to falsely suspect that others are dead.


    Use dedicated vFabric SQLServer vSphere DRS clusters. This is especially important
    when you consider that the physical NIC and virtual NIC are specifically tuned
    to disable interrupt coalescing on every NIC of an ESXI host in the cluster. This
    type of tuning benefits vFabric SQLServer workloads, but it can hurt other non-vFabric
    SQLServer workloads that are memory throughput bounded as opposed to latency sensitive
    in the case of vFabric SQLServer workloads.


    If using a vSphere DRS cluster is not an option, and vFabric SQLServer must run
    in a shared DRS cluster, make sure that DRS rules are set up to do not perform
    vMotion migrations on vFabric SQL VMs.


    If the restriction to vFabric SQLServer members to be excluded from vMotion migrations,
    it is preferred that all vMotion activity of vFabric SQLServer members happens
    over 10GbE, during periods of low activity and scheduled maintenance windows.


    Note In some cases, a vMotion migration might not succeed and instead fail because
    of a rapidly changing volatile memory space, which can be the case with partitioned
    tables and in cases of replicated tables. The failback is a fail-safe mechanism
    to the source VM, and it does not impact the source VM. vMotion makes this failback
    decision based on the time it takes to complete the iterative copy process that
    captures changes between the source VM to the destination VM. If the changes are
    too rapid and vMotion is not able to complete the iterative copy within the default
    100 seconds, it checks whether it can failsafe to the running source VM without
    interruption. Therefore, vMotion transfers the source VM to the destination only
    if it is certain that it can complete the memory'
