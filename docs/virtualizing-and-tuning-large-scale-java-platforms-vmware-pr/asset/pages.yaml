    # NUMA


    Non-Uniform Memory Architecture (NUMA) is a computer memory design used in multiprocessors,
    where the memory access time depends on the memory location relative to a processor.
    Under NUMA, a processor can access its own local memory faster than nonlocal memory
    (that is, memory local to another processor or memory shared between processors).


    Understanding NUMA boundaries is critical to sizing VM and JVMs. Ideally, the
    VM size should be confined to the NUMA boundaries. Figure 1-4 shows a vSphere
    host of two sockets, and hence two NUMA nodes. The workload shown is that of two
    vFabric SQLFire VMs, each VM sized to fit within the NUMA node boundaries for
    memory and CPU. If a VM is sized to exceed the NUMA boundaries, it might possibly
    interleave with the other NUMA node to fulfill the request for additional memory
    that otherwise cannot be fulfilled by the local NUMA node. The figure depicts
    memory interleaving by the red arrows (dashed curves show the interleaving), highlighting
    that this type of memory interleaving should be avoided because it may severely
    impact performance.'
