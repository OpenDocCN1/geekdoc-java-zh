  md: '# "I have conducted extensive GC sizing and tuning for our current enterprise
    Java application running on physical. Do I have to adjust anything related to
    sizing when moving this Java application to a virtualized environment?"


    No. All tuning you would perform for your Java application on physical is transferable
    to your virtual environment. However, because virtualization projects are usually
    driving a high-consolidation ratio, it is advisable that you conduct adequate
    load testing to establish your ideal compute-resource configuration for individual
    VMs, the number of JVMs within a VM, the overall number of VMs on the ESX host.


    In addition, because this type of migration involves an OS/platform change as
    well as a JVM vendor change, it is advisable to read through Chapter 3 and Chapter
    4.


    # How many and what size virtual machines will I need?


    This depends on the nature of your application. We most often see two-vCPU VMs
    as a common building block for Java applications. One of the guidelines is to
    tune your system for more scale out as opposed to scale up. This rule is not absolute;
    it depends on your organization''s architectural best practices. Smaller, more
    scaled-out VMs may provide better overall architecture, but you will incur additional
    guest OS licensing costs. If this is a constraint, you can tune toward larger
    four-vCPU VMs and stack more JVMs on them.


    # What is the correct number of JVMs per virtual machine?


    There is no one definite answer. This largely depends on the nature of your application.
    The benchmarking you can conduct determine the limit of the number of JVMs that
    can be stacked up on a single VM.


    The more JVMs you put on a single VM, the more JVM overhead and cost of initializing
    a JVM is incurred. Alternatively, instead of stacking multiple JVMs within a VM,
    you can instead increase the JVM size vertically by adding more threads and heap
    size. This can be achieved if your JVM is within an application server such as
    Tomcat. Then, instead of increasing the number of JVMs, you can increase the number
    of concurrent threads available and resources that a single Tomcat JVM services
    for your n number of applications'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'deployed and their concurrent requests per second. The limitation of how many
    applications you can stack up within a single application server instance/JVM
    is bounded by how large you can afford your JVM heap size to be and performance.
    The tradeoff of very large JVM heap size beyond 4GB needs to be tested for performance
    and GC-cycle impact. This concern is not specific to virtualization; it applies
    equally to physical server setup.


    # We would like to use the full logical CPU capacity of a host and take full advantage
    of HT."


    Let''s take the example of a Dell server R810, dual eight-core machine with hyperthread
    (HT) enabled. It means there are 16 physical CPUs, and with HT enabled the count
    is 32 logical CPUs. The ideal case here is to configure multiple VMs, choosing
    from various available vCPU configurations, as two vCPU, four vCPU, or eight vCPU.
    Aim at adhering to the following equation:


    Total vCPU = Physical CPUs + 25%


    In our example here, this means we have


    16 physical CPUs + 25% * 16 = 20 vCPUs approximately


    Now this is a cast-in-stone rule, and you can actually go higher than this in
    terms of adding, for example, 3 VMs with each being at 8-vCPU, for a total of
    24 vCPUs, and you may find the overall host CPU utilization still within the acceptable
    range for your setup. But anything beyond this and you will start to encroach
    on the limits of the host.


    > NOTE

    Even though the processor has HT, scheduling more frequently does not guarantee
    that the VM will catch up. This is because the amount of CPU resources received
    by the vCPU is affected by the activity on the other logical processor on the
    same physical core. To guarantee the vCPU that is behind catch up, ESX sometimes
    does not schedule VMs on the other logical processor, effectively leaving it idle.
    See http://kb.vmware.com/kb/1020233.'
  merge: -1
