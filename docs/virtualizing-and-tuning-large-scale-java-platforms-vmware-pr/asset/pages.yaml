    # What decisions will be made because of virtualization?


    You must determine the size of the repeatable building-block VM. By benchmarking,
    along with total-out factor. Determine how many concurrent users each single vCPU
    configuration of your application can handle, and extrapolate that to your traffic
    to determine the overall compute-resource requirement. Having a symmetrical building
    block (for example, every VM having the same number of CPUs) helps keep load distribution
    from your load balancer even. Essentially, benchmarking helps you determine how
    a large single VM should be (vertical scalability) and how many of these VMs you
    will need (horizontal scalability).


    You must pay special attention to scale-out factor, and see up to what point it
    is linear within your application running on top of VMware. Java applications
    are multithed, and bottlenecks can appear at any point along the scale-out performance
    line and quickly cause nonlinear results. The assumption of linear scalability
    may not always be true, and it is essential to test a production replica (production
    to be) of your environment to accurately size for your traffic.'
  merge: -1
