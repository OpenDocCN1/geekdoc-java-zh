  md: '# SQLFire Best Practices and SQLFire on vSphere Best Practices 16


    made of one or more vSphere clusters, dedicated or shared across other workloads.
    Obviously, if the density of JVMs is high (500+), there are likewise dedicated
    clusters at any rate; however, in category 1, workloads are always run within
    one dedicated vSphere cluster and never shared with other workloads. This category
    1 refers to one SQLFire fabric (data grid/cluster) mapped to fit within one dedicated
    vSphere cluster. The reason for the dedicated cluster is because the latency-sensitive
    tuning best practices applied to category 2 workloads may hurt category 1 workloads
    in some instances. The other reason is to do with administration and the series
    classification of category 2 workloads. Think of how you guard your virtualized
    RDBMS (typically dedicated and in a highly protected administrative zone); in
    vFabric SQLFire and category 2 this rule also applies. You only want your Java
    DevOps (Java DBAs) to administer and care about this cluster, and not some less
    workloads that may have a different access pattern and hence lifecycle behavior.


    The other distinguishing factor is that it is likely that category 1 workloads
    would have a much higher number of JVMs and nodes, and in some cases you can have
    multiple JVMs within one VM. In contrast, category 2 workloads are always configured
    one JVM to one VM. And that is why we want to configure the largest JVM and VM
    combination that fits with a NUMA node. Category 1 workloads, however, are likely
    to track CPU bound simply because of the high density of JVMs (that is, thousands
    of JVMs, each its own GC cycle, which can demand lots of CPU cycles at times).
    This is why common to see category 1 workloads deployed on four-socket vSphere
    hosts, while category 2 workloads are always configured on two-socket hosts. The
    four-socket vSphere hosts would likely have more CPU cores (when compared to two-socket
    hosts) to help category 1 workloads by providing ample CPU to the thousands of
    GC cycles, while category 2 workloads are aided by having very large NUMA bands
    with two-socket servers. These are usually NUMA memory banks that category 2 workloads
    can fully consume.


    Finally, category 1 workloads have much smaller JVM sizes than category 2, but
    this is not a cost-in-rule stone. It is to say, however, that the amount of JVM
    tuning effort in category 1 is much less than in category 2. This is especially
    true when you consider that most category 1 workloads will fit nicely within a
    scaled set of 4GB JVM instances (where 4GB is a unique and automatically 32-bit
    compressed space even though it is still within the 64-bit world, and hence requires
    vastly less tuning to get a good SLA). However, in category 2 workloads, we size
    as big a JVM as we can afford to fit within NUMA node to reduce the number of
    JVM instances in the SQL data cluster. The fewer JVMs in the cluster, the fewer
    potential network hops or or less chatter. It is also easier to administer the
    cluster when you have a handful of JVMs, even though they are large JVMs. This
    is a memory-bound workload, and it benefits from being able to quickly access
    as much local memory as possible for the fewest JVM instances.'
