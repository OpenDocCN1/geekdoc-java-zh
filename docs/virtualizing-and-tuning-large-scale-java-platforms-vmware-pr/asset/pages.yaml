  md: '# Best Practice


    # Description


    BP 38: Disable calls to System.gc().


    Set -XX:+DisableExplicitGC to disable GC. This causes calls to System.gc() to
    be ignored, hence avoiding the associated long latencies.


    BP 39: New generation size.


    Set the -Xmn value to be large enough to avoid the new generation filling up.
    Making the new generation large avoids the cost of copying objects into the old
    generation, which can impact performance.


    A common approach is to set the -Xmn size to approximately 33% of the heap''s
    maximum size (which is 33% of -Xmx for heap sizes less than 8GB). For heap sizes
    from 8 to 100GB, the 33% rule might be too high; 10% to 15% of the maximum heap
    size for these is adequate. To establish the best size for your application, you
    must load test and measure how often the new generation fills up. Based on this,
    decide whether to adjust the -Xmn value. Start at 33%, and then adjust down only
    if you notice large GC durations or pauses that are negatively impacting the application
    transaction times. If no negative impact is noticed at 33% of -Xmx initially,
    leave -Xmn at 33% of -Xmx.


    For smaller heaps, if the heap is less than 8GB, set -Xmn < 33% of -Xmx. For larger
    heaps, if the heap is much greater than 8GB, set -Xmn < 10% to 15% of -Xmx. However,
    it is difficult to apply this rule consistently on varied workload.


    A further rule to consider when sizing -Xmn is that partitioned tables most likely
    have higher numbers of short-lived objects and therefore can require a larger
    -Xmn value. Compare with replicated tables where the rate of change is minimal
    and not many short-lived objects are created, and therefore a lower -Xmn is adequate.


    Note this guidance has a caveat that depends on the behavior of the application.
    For example, if the application requires many query calls, configure a size at
    the upper end of the -Xmn range described. For mostly insert or update calls,
    configure a size in the middle of the range.


    BP 40: Using 32-bit addressing in a 64-bit JVM.


    When memory is constrained, set the -XX:+UseCompressedOops JVM option. This uses
    a 32-bit pointer address space within a 64-bit JVM for heap sizes up to 32GB.
    This can save substantial memory space (in some cases up to 50%), although the
    savings vary based on the Java types used within the application.'
