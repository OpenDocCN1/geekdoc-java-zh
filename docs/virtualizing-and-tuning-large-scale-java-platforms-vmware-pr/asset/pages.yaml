    ```


    Sending cookies.


    ```

    Aug 3 10:46:38 w1-vFabric-g1 kernel: possible SYN

    flooding on port 34327.

    ```


    Sending cookies.


    To determine whether SYN cookies are enabled (1 is on, 0 is off), use the following:


    ```

    $ cat /proc/sys/net/ipv4/tcp_syncookies

    1

    ```


    To temporarily disable SYN cookies (changes at reboot), use the following:


    ```

    # echo 0 > /proc/sys/net/ipv4/tcp_syncookies

    ```


    To permanently disable SYN cookies, add/modify the following in /etc/sysctl.conf:


    ```

    # Controls the use of TCP syncookies

    net.ipv4.tcp_syncookies = 0

    ```'
