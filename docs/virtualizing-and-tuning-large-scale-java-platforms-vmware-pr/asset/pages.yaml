  md: '| JVM Option | Description |


    | -XX:+UseParNewGC | Enables the usage of the modified parallel throughput collector
    in the young generation, with the ability to specify multiple worker GC threads.
    The parallel collection threads are configured with -XX:ParallelGCThreads=4, for
    example. This is used with CMS only. By default, this is enabled in Java 6 when
    the machine has multiple processor cores. |


    | -XX:CMSInitiatingOccupancyFraction=75 | Sets the percentage of the heap that
    must be full before the JVM starts a concurrent collection in the tenured generation.
    The default is approximately 92 in Java 6, but setting this lower allows CMS to
    run more often (all the time sometimes), but it often clears quickly avoid fragmentation.
    |


    | -XX:+UseCMSInitiatingOccupancyOnly | Enables the feature that all concurrent
    CMS cycles should start based on -XX:CMSInitiatingOccupancyFraction=75. |


    | -XX:+ScavengeBeforeFullGC | Enables the feature that forces a young generation
    collection before starting a new CMS cycle or before a full GC is attempted. |


    | -XX:TargetSurvivorRatio=80 | Sets the desired percentage of survivor space used
    after scavenge. |


    | -XX:SurvivorRatio=8 | Establishes the ratio of Eden/survivor space size. |


    | -XX:+UseBiasedLocking | Enables a technique for improving the performance of
    uncontended synchronization. An object is "biased toward the thread that first
    acquires its monitor using a monitorenter bytecode or synchronized method invocation;
    subsequent monitor-related operations performed by that thread are relatively
    much faster on multiprocessor machines. Some applications with significant amounts
    of uncontended synchronization can attain significant speedups with this flag
    enabled. Some applications with certain patterns of locking can see slowdowns,
    although attempts have been made to minimize the negative impact. |'
