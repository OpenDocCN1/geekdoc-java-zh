    with disk asynchronous PERSISTENCE. This combination of REDUNDANCY 1 and asynchronous
    PERSISTENCE on disk allows for a good combination of performance, scalability,
    and reliability for most production systems that rely heavily on vFabric SQLFire
    as a data management system.


