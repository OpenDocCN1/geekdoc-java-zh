  md: '# Best Practice 10: Transactions


    +   - vFabric SQLFire implements optimistic transactions. The transaction model
    is highly optimized for colocated data, where all of the rows updated by a transaction
    are owned by a single member.


    +   - Keep the transaction duration and the number of rows involved in the transaction
    as low as possible. vFabric SQLFire acquires locks eagerly, and long-lasting transactions
    increase the probability of conflicts and transaction failures


    +   - Understand all the transaction isolation levels offered by vFabric SQLFire.
    The vFabric SQLFire isolation levels are as follows:


    +   - NONE: By default, connections in vFabric SQLFire do not engage in transactions,
    unlike in other databases. However, this behavior does not mean that there is
    no isolation and that connections have access to uncommitted state from other
    in-process transactions. Without a transaction (isolation level set to NONE),
    vFabric SQLFire ensures first in, first out (FIFO) consistency for table updates.
    Writes performed by a single thread are seen by all processes in the order they
    were issued, but writes from different processes may be seen in a different order
    by other processes. When a table is partitioned across members of the distributed
    system, vFabric SQLFire uniformly distributes the data across members that host
    the table so that no single member becomes a bottleneck for scalability. vFabric
    SQLFire assigns ownership of a particular row (identified by a primary key) to
    a single member at any given time. When an owning member fails, the ownership
    of the row is transferred to an alternate member in a consistent manner so that
    all peer servers have a view of the new owner.


    +   - READ_UNCOMMITTED: vFabric SQLFire internally upgrades this isolation to
    READ_COMMITTED.


    +   - READ_COMMITTED: vFabric SQLFire does not allow ongoing transactional as
    well as non (isolation level NONE) operations to read uncommitted (dirty) data.
    vFabric SQLFire accomplishes this by maintaining transactional changes in a separate
    transaction state that is applied to the actual datastore for the table only at
    commit time.


    +   - REPEATABLE_READ: vFabric SQLFire supports this isolation level according
    to the ANSI SQL standard. A transaction that reads the same row more than once
    always sees the same column values for the row. REPEATABLE_READ guarantees that
    the underlying committed row in a table never changes after the first read in
    a transaction, until the transaction completes. vFabric SQLFire applies and write
    locks to copies of selected data so that reads are repeatable for the duration
    of a transaction. vFabric SQLFire does not use range locks, and phantom reads
    are still possible with this isolation level.'
