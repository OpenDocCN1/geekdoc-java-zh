    | BP 51: Guest OS. | Red Hat Enterprise Linux 5 and earlier versions incur higher
    virtualization overhead because of the high-frequency timer interrupts, frequent
    access to virtual PCI devices for interrupt handling, and an inefficient Linuxkeeping
    mechanism. By selecting a more current version of Linux, such as SUSE Linux Enterprise
    11 SP1 or Red Hat Enterprise Linux 6 based on 2.6.32 Linux kernels, or Windows
    Server 2008, you can minimize these cases of virtualization overhead. In particular,
    Red Hat Enterprise Linux 6 has a tickless kernel that does not rely on a high-frequency
    interrupt-based timer and is therefore much friendlier to virtualized latency-sensitive
    workloads. Refer to "Timekeeping Best Practices for Linux Guests (http://kb.vm.com/kb/1006427)"
    and "Timekeeping in VMware Virtual Machines (http://www.vm.com/files/pdf/Timekeeping-In-VirtualMachines.pdf)."


