  md: '# Preface


    The main design tenets of Java are based on a cross-platform language that is
    operating system independent (as long as there is an operating-system-supported
    underlying runtime). We know this runtime is the JVM, which has become a permanent
    fixture of many enterprise application platforms. You could write a Java application
    and run it on various JVMs on different operating systems (without having to recompile).
    Of course, VMware customers have one vendor-targeted JVM in production and so
    would not have to worry about moving a Java application from one JVM implementation
    to another. If they chose to do so, however, they could easily do it, primarily
    because of Java''s crossplatform and operating system independence facilitated
    by a JVM.


    So, you can reasonably conclude that the Java applications do really care which
    JVM is targeted for them to run on and are independent of the specific JVM implementation
    and operating system.


    Of course, you might ask, “What about all the different internal behaviors of
    one JVM versus another?” At the end of the day, they all adhere to the JVM spec,
    and some JVM (-XX, flags, and so on) have different names, more or less behave
    in a similar manner. The differences are not in the language, but in the way the
    Java can be optimized with various JVM options at the command line.


    Now fast forward to the infrastructure side of things. VMware ESXi is a bare-metal
    hypervisor that makes it possible to run multiple operating systems on a particular
    piece of hardware. Infrastructure administrators no longer have to worry about
    installing one kind of operating system for one piece of hardware versus another.
    VMware makes the operating system run independently of the underlying hardware
    (bare metal) and creates a degree of independence between the operating system
    and the bare metal/hardware.


    Although the answer to whether Java is both OS and hypervisor is clearly yes,
    it is due to two degrees of independence. The first degree is that of Java’s main
    tenet of cross-platform and OS independence, and the second degree is that of
    VMware ESXi making the operating system independent of the hardware that it runs
    on. In fact, when a Java application runs on an operating system that is in an
    ESXi-based VM, ESXi has no notion of whether it is a Java workload running on
    the operating system, making the ESXi hypervisor completely independent of the
    workload running on it. A further testament to this is, that because of this independence,
    no operating system changes are needed when you deploy a Java application on a
    VM.


    Conversely, the JVM doesn''t really know it is running on a VM sitting on an ESXi
    hypervisor, and to the JVM, the VM appears like any other server with compute
    resources (CPUs, RAM, and so on) presented to.


    As long as the JVM you are using is supported on the operating system on which
    your applications are running, there is no need for additional concern about or
    dependency support from the downstream VM and ESXi layers.'
