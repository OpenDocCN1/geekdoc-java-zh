- img_proc: true
  md: '# NOTE


    You can also use VisualVM to inspect thread dumps. Synchronized methods are the
    most notorious for creating blocking situations, and eventually application crashes.
    In addition, the pessimistic locking of resources when communicating with a database
    in a non-thread-safe manner can cause multiple threads to contend and interlock
    on resources. This is especially true when there aren''t enough DB connections
    to service the number of concurrent Java threads, and even more serious when DB
    connections are shared across threads when not intended to.


