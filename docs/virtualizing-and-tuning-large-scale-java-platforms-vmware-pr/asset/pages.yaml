  md: '# Virtual CPU Usage = usage in MHz / (vCPUs* core frequency)


    Formula 7-2 vCPU Usage


    +   - **Ready time:** Ready time refers to the amount of time during which the
    VM was ready but not got a scheduled time slice on the underlying physical core.
    If the CPU ready time is high and there are ample CPU cycles on the host, you
    most likely have far too many VMs allocated on this host, or perhaps a Non-Uniform
    Memory Access (NUMA) imbalance exists, where a majority of the VMs are running
    on just one NUMA node. Reducing the number of vCPUs in use by all VMs on the host
    might address the problem. Alternatively, you might want to revisit the design
    and sizing of the VMs to ensure that they are fitting correctly into the NUMA
    nodes. Our guideline for ready time is that it should not be more than 5% (for
    production applications) or 1000ms per vCPU per 20s sampling period as taken from
    vCenter. Ready time can also be caused by a CPU limit on a VM or on a resource
    pool that impacts a VM.


    For network charts (select the Network option from the Switch To drop-down in
    vCenter shown in Figure 7-3), the counters displayed are as follows:


    +   - **Network (Mbps) Sum:** Sum of the data transmitted and received across
    all virtual NIC instances connected to the virtual machine


    +   - **Network Rate (Mbps) Data Receive:** Rate at which data is received across
    each virtual network interface card (NIC) on the VM


    +   - **Network Rate (Mbps) Data Transmit Rate:** Rate at which data is transmitted
    across each virtual NIC instance of the VM


    +   - **Packets (Number) Packets Transmitted:** Number of network packets transmitted
    across each virtual NIC instance on the VM


    +   - **Packets (Number) Packets Received:** Number of network packets received
    across each virtual NIC instance on the VM


    For disk-usage charts (select the Disk option from the Switch To drop-down in
    vCenter shown in Figure 7-3), the counters displayed are as follows:


    +   - **Allocated:** Total amount of logical datastore space provisioned on the
    VM


    +   - **Used:** Amount of physical datastore space in use by the VM


    +   - **Not shared:** Amount of datastore space that belongs only to this VM and
    is not shared with other VMs'
