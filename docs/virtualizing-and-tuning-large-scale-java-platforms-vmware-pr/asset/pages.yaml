  md: 'When sizing VMs for JVMs deployment, follow the guidance in Chapter 4. If you
    find consistent peak usage the consumed memory is substantially less than the
    reserved memory (refer to the calculations in Figure 4-3, where the total reservation
    is 5GB), you can progressively adjust the reservation amount to a lower value.
    It is always best to set the reservation memory to the granted value, and the
    granted value must be larger than the Java heap (~Xmx), by approximately 25% plus
    guest OS memory requirements. Refer to Formula 4-1 for the actual calculation.
    You might sometimes be tempted to use active memory as a guide for sizing; however,
    this practice may potentially lead to memory overcommitment within the environment,
    which will hurt the performance of Java workloads in general. Specifically, these
    practices are not recommended for production-level workloads that run critical
    applications, with the caveat that some development or lower-priority QA environment
    may attempt to overcommit, with extreme sizing caution.


    The CPU (%) graph shown in Figure 7-3 presents the VM CPU usage and ready values,
    as described in the list that follows.


    ![](img/c26bfb34f357e8daa09165d85110e193_226_0.png)


    **Figure 7-3** vCenter Performance Charts for CPU


    +   * **Usage**: This is the average of actively used virtual CPU as a percentage
    of total available CPU. It is the average usage over all available vCPUs configured
    on the VM. If a vCPU shows 100%, this implies it has consumed 100% of an underlying
    physical core. Formula 7-2 shows the calculation to determine vCPU usage.'
