  md: '# Step B: Old Generation Tuning


    This step (step B from Figure 3-2) is concerned with tuning the old generation
    after measuring the frequency and duration of major/full GC. The single most important
    JVM option that influences old generation tuning is often the total heap size,
    -Xmx, and adjusting this up or down has a bearing on old generation GC behavior.
    If you increase -Xmx, you will cause the duration of full GC to take longer, but
    occur less frequently, and vice versa. The decision as when to adjust -Xmx directly
    depends on the adjustments we made in step A, where we adjusted -Xmn. When you
    increase -Xmn you cause the old generation space to be reduced, because the old
    generation is implicitly sized (not directly through a direct JVM option) as -Xmx
    minus -Xmn. The tuning decision to offset the increased -Xmn size is to proportionally
    increase -Xmx to accommodate the change. If you increased -Xmn by 5% of -Xmx,
    then -Xmx needs to be increased by 5%. If you don''t, the impact of increasing
    -Xmn on old generation is an increased full GC frequency because the old generation
    space has been reduced.


    The inverse argument also holds in the case where -Xmn is reduced; -Xmx has to
    be proportionally reduced as well. If you don''t adjust -Xmx as a result of reducing
    -Xmn, the old generation space is proportionally larger and the full GC duration
    will be longer in this case.


    In Figure 3-6, the impact of decreasing young generation size -Xmn has the effect
    of increasing the full GC duration on the old generation. The increase in the
    old generation full GC duration can be offset by decreasing -Xmx proportionally
    to the amount -Xmn was reduced.


    Figure 3-7 shows the impact of increasing the young generation size -Xmn on the
    old generation. When you increase the young generation size, it implicitly causes
    the old generation size to become smaller, causing the frequency of full GC to
    increase. One way to offset this is to proportionally increase -Xmx by the amount
    -Xmn was increased by.'
