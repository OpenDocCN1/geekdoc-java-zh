- "# Pure React：精通 React 的分步指南\n\n\n\n![](img/pure_react_cover.png)\n\n![封面图像](img/pure_react_cover.png)\n\
  \n\n\n# 简介\n\n欢迎来到 Pure React。\n\n今天的前端开发存在一个问题：它*让人无从从心*。\n\n世界上有成千上万个库，每个只负责一件小事。某些库组合演变成了事实上的标准，但却看不到任何*实际*的标准。\n\
  \nReact 生态系统在这方面尤为严重：有 `React`、`Redux`、`Webpack`、`Babel`、`React Router` 等。存在大量的模板项目（boilerplate\
  \ projects），通过将一系列选择打包在一起来让这一切变得“更容易”。人们的想法是：“如果你不需要自己做所有选择，学习起来会更简单。”\n\n但结果恰恰相反：你不仅没有被选择所淹没，反而被那些随模板项目“免费赠送”的海量代码所击垮了，而且你*完全不知道*这些代码到底在做什么。这是一个非常危险的境。\n\
  \n一次性学习所有东西会让人感到压力巨大。因此，在本书中，我们将采取一种不同的方法。一种更理智的方法。我们将学习 Pure React。\n\n> Pure React：孤立\
  \ `React` 的核心概念，不依赖 `Redux`、`Webpack` 等其他内容。\n\n当你掌握了这里包含的内容——当你通过*冷启动*的方式学会了 `React`——你将能够轻松地去学习它所有的伙伴：`Redux`、`Router`\
  \ 等。\n\n你不仅*能够*学习其他库，而且会做好充分准备。你将拥有一个坚实的基础。\n\n本书的设计初衷是让你快速从*零*开始掌握*React*，并获得最大程度的理解。\n\
  \n你在这里*不会*做的事情，是网络上许多教程中常见的做法：即你不断复制粘贴每一块代码，直到最后得到一个可以运行的应用。他们会说：“搞定！你现在懂 `React`、`Redux`\
  \ 和 `Webpack` 了！”\n\n一次性接受的东西太多了。通过这种方法，你可能会学习一两个核心概念，但基础是不稳固的。不可避免，当你坐下来编写自己的应用时，你会迷失在库和概念的森林中。\n\
  \n仅仅通过复制粘贴代码片段，你只能走得有限。\n\n而且你已经知道这一点了，否则你不会出现在这里。\n\n所以在这里我们将遵循一种不同的方法：我会向你展示一个概念，并配上示例代码。*然后*（这是最重要的部分）你将在随后的练习中*使用*那个概念，直到它变成本能。反复重复，直到我们涵盖了纯\
  \ React 的所有核心部分——这些部分并不多。\n\n## 我们将涵盖的内容\n\n我们将从大多数编程书籍开始的地方开始——Hello World。从那里开始，我们将学习如何将组件组合在一起，以及如何使用\
  \ `JSX`（React 用于在页面上渲染元素的类 HTML 语法）。\n\n一旦你掌握了如何创建静态组件，你将学习“props”，将其作为一种传递所需数据的方式，以及“propTypes”，它用于对组件所需的\
  \ props 进行文档化记录和调试。\n\n我们将涵盖 `React` 特有的“children”属性，它是构建可重用、可组合组件的强大工具。\n\n最后，你将学习“state”（状态），它与\
  \ props 有何不同，以及如何在应用程序中组织它。我们将查看如何使用表单控件和组件生命周期。\n\n## 为什么只学 React？\n\n如果没有对 `React`\
  \ 有深入的理解，同时学习 `Redux` 等库和 `Webpack` 等工具只会减慢你的学习进程。一次性深入学习所有内容是非常有吸引力的，尤其是当你心里有一个有趣的项目（或是一个截止日期）时。\n\
  \n然而，从长远来看，一次性学习所有东西会更慢。\n\n将这些库和工具想象成基础的层层。\n\n如果你在盖房子，你会为了快点完成而跳过某些步骤吗？比如，在铺好一些石头之前就开始浇混凝土？在裸地上开始盖墙？\n\
  \n或者做一个婚礼蛋糕：顶端看起来装饰起来最有趣，为什么不从那里开始呢？以后再管底部就好了！\n\n不吗？\n\n当然不。你知道那些做法会导致失败。可能违背直觉的是，它们会*减慢速度*，而不是加速。\n\
  \n那么，通过尝试*一次性*学习 `Webpack` + `Babel` + `React` + `Redux` + `Routing` + `AJAX` 来接触\
  \ React 有意义吗？这听起来难道不像是一团巨大的混乱吗？\n\n相反，最高效的方法是一个一个学习这些内容。本书将教你如何使用 `React`，然后你就可以准备好应对拼图的下一个部分了。\n\
  \n## 本书是如何运作的\n\n### 需要多长时间？\n\n`React` 的基本概念可以在几天内学会。本书涵盖了这些基础知识，并在每个主要概念后提供了练习，以强化你的理解。\n\
  \n大多数练习都是很短的。有几个比较复杂。它们背后的原理与学校作业的想法相同：通过结合重复和解决问题，将理念刻在你的脑子里。\n\n整个过程的主题是：避免被压力淹没。放弃不会带给你任何结果。慢工出细活，呃，学会\
  \ `React`。\n\n### 构建小东西并把它们丢掉\n\n这是很多人跳过的尴尬中间步骤。在没有牢牢掌握 `React` 的情况下就转向 `Redux`\
  \ 和其他库，会直接回到混乱中。\n\n但这一步并不明确：你应该构建什么？一个用于工作的原型？还是一个使用整个技术栈的大型项目？\n\n不，不是那些东西。它们要么负担太重，要么对于学习项目来说太大了。你想构建的是*小*东西。\n\
  \n### 不要构建原型\n\n（用于工作的）“原型”通常是糟糕的学习项目，因为你*心自知道*“原型”永远不会消失。它将长期处于原型阶段，演变成发布的软件，并且永远不会被丢弃。一旦某个经理看到原型看起来很棒，功能就会堆积起来。“我们以后会重构的”将是一个谎言。代码会变得臃肿且无组织。\n\
  \n当你知道它不是丢弃代码时，未来变得巨大。你开始担心……不应该有测试吗？我应该确保架构可以扩展……我必须重构这个糟摊吗？不应该有测试吗？\n\n担心架构、扩展性和“未来”是学习新技术的糟糕策略。\n\
  \n相反，如果你认为原型是可以丢弃的代码而构建它，它可能写得很。那么当你的老板看到原型看起来很棒时，他绝对不允许你用所学的最佳实践来重写它。那是导致不可维护的代码库的因素。\n\
  \n### 所以应该构建什么？\n\n本书是为了回答这个问题并帮助你解决它。短答案是：\n\n> 构建小型的、可丢弃的应用。\n\n甜点位于“Hello World”和“整个\
  \ Twitter 克隆”之间。\n\n当然，我们将从 Hello World 开始。任何自视的编程书籍都不会缺少它。\n\n随着你技能的增长，简单应用和网站（如\
  \ Reddit、Hacker News 和 Slack）的低保真复制是很好的项目。设计师称之为“临摹”，它非常棒，因为它让你免于做产品决策的烦恼。\n\n本书结束时，你将构建那些热门应用以及更多。一旦你能够清晰地“以组件思考”，它们就会快速组合——这种技能将随着你学习的进展而提高。\n\
  \n\n\n我相信，至少在开始阶段，从小型项目中获得的学习价值比大型项目或全栈项目更多。以下是我的观点。彩色条代表学习效率最密集的时期，而间隙则是你正在做自己已经掌握的事情：\n\
  \n在某个时刻，大型项目的收益会递减。当你第一次、几次使用文本输入框并必须将其连接起来以维护其状态时，你正在学习。到第十次时，它就变得无聊了。\n\n这并不是说大型项目没有价值，但我认为它们不是理想的*第一个*项目。从小处开始，构建几个小东西，然后再构建一两个大一点的东西。\n\
  \n这就是`刻意练习`（deliberate practice） 背后的理念——练习应该略高于你目前的技能水平。既不会难到让你感到沮败并放弃，也不会太简单到让你一眼看到底。\n\
  \n## 环境搭建\n\n在我们开始之前，我们需要搭建一个环境。\n\n别担心，不需要从 GitHub 克隆任何样板代码。也没有 `Webpack` 配置。\n\
  \n相反，我们正在使用由 Facebook 开发的工具 `Create React App`。它提供了一个启动项目和内置的构建工具，让你可以跳过准备工作，直接进入有趣的环节——创建你的应用程序！\n\
  \n### 前提条件\n\n### 工具\n\n*   `Node.js`（至少 v4.0，建议 >= 6）\n*   `NPM`（建议版本 >= 3）或 `yarn`\n\
  *   `Google Chrome`（或其他其他现代浏览器）\n*   `React Developer Tools`\n*   你选择的文本编辑器或 IDE\n\
  \n你需要 `Node` 和 `NPM`（或 `Yarn`）。前往 [`nodejs.org`](https://nodejs.org) 并下载最新的“Current”（当前）版本。在写本文时，它是\
  \ `v7.10.0`。\n\n任何现代浏览器都足够了。本书是基于 `Chrome` 开发的，所以我推荐使用它。如果你倾向于使用其他浏览器，我预计 JavaScript\
  \ 可以正常工作，但 CSS 可能需要进行一些微调。\n\n#### Yarn\n\n`Yarn` 是一个相对新的 JavaScript 包管理器，发布于 2016\
  \ 年 6 月。与 `NPM` 相比，它更快，并且拥有 `lock file`（锁文件）的优势，这意味着每次你运行 `yarn`（`Yarn` 相当于 `npm\
  \ install`）时，它都能可靠地安装完全相同的包。\n\n命令与 `NPM` 类似：\n\n*   安装所有包：`npm install` 或 `yarn`\n\
  *   安装特定包：`npm install --save <package>` 或 `yarn add <package>`\n*   启动开发服务器：`npm\
  \ start` 或 `yarn start`\n*   运行测试：`npm test` 或 `yarn test`\n\n我不会在书中到处充斥像“运行 `npm\
  \ start`（或 `yarn start`）”这样的内容，从现在起我只会显示 `NPM` 命令。不过，如果你想用 `Yarn`，请尽管使用。你可以从 [`yarnpkg.com`](https://yarnpkg.com)\
  \ 安装它。\n\n#### React Developer Tools\n\n可以在这里安装 `React Developer Tools`：\n\n[`github.com/facebook/react-devtools`](https://github.com/facebook/react-devtools)\n\
  \n按照说明为你的浏览器安装工具。`React dev tools` 允许你检查 `React` 组件树（而不是 `DOM` 树），并查看分配给每个组件的 `props`\
  \ 和 `state`。它对于调试极其有用。\n\n#### 知识\n\n你应该已经了解 `JavaScript`（至少 ES5）、`HTML` 和 `CSS`。我会在遇到时解释\
  \ `ES6` 特性（你不需要预先了解 ES6）。\n\n我不建议同时学习 `JavaScript` 和 `React`。\n\n如果你需要复习 JavaScript，这里有一些很好的资源：\n\
  \n*   Speaking JavaScript（书籍）：http://speakingjs.com/\n*   Exercism（练习）：http://exercism.io/languages/javascript\n\
  *   You’t Know JS（书籍）：https://github.com/getify/You-Dont-JS\n\n熟悉命令行也会很有帮助。\n\n\
  ### 项目目录\n\n你将在书中编写大量的代码。为了保持整洁，创建一个目录，命名为 `exercises` 或任何你喜欢的名称。\n\n### 安装 React\
  \ App\n\n运行此命令安装工具（`-g` 表示全局）：\n\n```\n$ npm install -g create-app\n```\n\n如果你在\
  \ Linux 或 Mac 上遇到“Permission denied”（权限拒绝）错误，你可能需要使用 `sudo` 运行：\n\n```\n$ sudo npm\
  \ install -g create-app\n```\n\n这就好了！开始编码吧。\n\n## 调试快速上手\n\n当问题出现时，请遵循以下步骤：\n\n\
  1.  不要恐慌。\n2.  手动刷新页面。有时自动刷新机制会失效。\n3.  检查浏览器控制台，手动刷新页面，并修复看到的错误。\n4.  检查运行 `npm\
  \ start` 的命令行控制台。查找并修复错误。\n\n在 Mac 的 `Chrome` 上，按下 `Option+Command+I`。在 Windows\
  \ 或 Linux 上，按下 `Ctrl+Shift+I`。然后确保你处于“Console”（控制台）标签页。\n\n如果你不知道如何打开浏览器开发者工具，请搜索“open\
  \ browser console [你的浏览器]”。\n\n## Hello World\n\n现在你已经安装了 `node`、`npm` 和 `create-react-app`。所有工具已就绪。让我们写代码吧！\n\
  \n### 第一步\n\n使用 `create-react-app` 命令创建一个项目。它将创建一个目录并安装所有必要的包，然后进入该目录。\n\n```bash\n\
  $ create-react-app react-hello\n$ cd react-hello\n```\n\n生成的项目包含一些现在不需要的文件，我们将删除它们。你也可以直接忽略它们。\n\
  \n```bash\n$ rm src/App.* src/index.css src/logo.svg\n```\n\n### 第二步\n\n打开 `src/index.js`\
  \ 文件。删除所有内容，并输入以下代码：\n\n> **手打输入？像个野人一样？** 手打输入比简单的复制粘贴更能让记忆刻在大脑子里。你正在形成新的神经元通路。这些通路有一天会理解\
  \ React 的。帮帮它们。\n\n```javascript\nimport React from 'react';\nimport ReactDOM from\
  \ 'react-dom';\n\nfunction HelloWorld() {\n  return (\n    <div>Hello World!</div>\n\
  \  );\n}\n\nReactDOM.render(\n  <HelloWorld/>,\n  document.querySelector('#root'));\n\
  ```\n\n\n\n\n\n字符串 `react` 和 `react-dom` 是重要的：它们对应于 npm 安装的模块名称。如果你熟悉 Node.js，`import\
  \ React from 'react'` 等同于 `var React = require('react')`。\n\n## 步骤 3\n\n在 `react-hello`\
  \ 目录内部，运行以下命令启动应用：\n\n```bash\n$ npm start\n```\n\n浏览器会自动打开并显示“Hello World!”\n\n\
  ## 代码是如何运行的\n\n让我们从底部看起，从 `ReactDOM.render` 调用开始。这才是真正让这一切运行起来。尽管那里有一个看起来像 HTML\
  \ 的 `<HelloWorld/>`，但这段代码是普通的 JavaScript。尝试注释掉那行代码，观察 Hello World 是如何消失的。\n\nReact\
  \ 使用“虚拟 DOM（virtual DOM）”的概念。它创建了你的组件层次结构的表示，然后通过创建真实的 DOM 元素并将其插入你指定的地方来“渲染（renders）”这些组件。在这种情况下，它是在\
  \ id 为 `root` 的元素内部。\n\n`ReactDOM.render` 接收 2 参数：你想要渲染的内容（你的组件或任何其他 React Element）以及你想要将其渲染到哪里（一个真实的\
  \ DOM 元素）。\n\n```javascript\nReactDOM.render([React Element], [DOM element]);\n\
  ```\n\n在上方，我们有一个名为 `HelloWorld` 的 `component`。编写 React 组件的主要方法是像这样编写纯函数。它们通常被称为“无状态函数组件（stateless\
  \ function components）”。\n\n创建组件还有另外 2 方法：ES6 类以及现在已废弃的 `React.createClass`。你可能在旧的\
  \ Stack Overflow 回答或旧的 GitHub 项目中看到 `createClass` 风格，因此我们将介绍它是如何工作的。但主要来说，我们将尽可能编写函数，并在需要时使用\
  \ ES6 类。\n\n`render` 函数内部的类 HTML 语法被称为 `JSX`，我们将接下来介绍它。\n\n# JSX：是什么以及为什么\n\n你可能对\
  \ React 代码注意到的几点之一是，它看起来就像组件函数返回了 HTML。这种类 HTML 的语法实际上被称为 `JSX`。\n\n## 什么是 JSX？\n\
  \nJSX 是为 React 发明的一种语法，看起来与 (X)HTML 非常相似。它允许你通过编写看起来熟悉的语法来创建元素，而不是手动编写函数调用。这种类 HTML\
  \ 的语法实际上会编译成真实的 JavaScript，我们将在下文中讨论。\n\n### JavaScript 内部包含 HTML？！\n\n在我认真研究 React\
  \ 之前，我就知道它混合了 HTML 和 JS，并且认为这很`丑陋（ugly）`。我的意思是，这违背了`多年`来的最佳实践思维，对吧？自从 `jQuery` 的暗黑时代以来，我们就知道在\
  \ JS 内部直接对元素设置 `innerHTML` 是权宜之计（hackish）且性能糟糕——更不用说充满了安全漏洞——那么为什么 React 要要再次重犯这些错误呢？\n\
  \n你有没有注意到“HTML”周围没有引号？那是因为**它不是一个字符串。** 缺少引号不仅仅是一个技巧。React `并没有（not）` 解析那个东西并将其转换为\
  \ HTML。\n\n我知道，我懂，它看起来像 HTML。但实际上，`JSX` 只是创建 DOM 元素的函数调用的一层美妙的语法糖。\n\n那么 React 在这里实际上在做什么呢？它是如何工作的？以及为什么它并不糟糕？\n\
  \n### JSX 被编译为 JavaScript\n\n你写的 `JSX` 元素实际上由一个名为 `Babel` 的工具编译为 JavaScript。`Babel`\
  \ 是一个“转编译器（transpiler）”，这是一个造词，意味着它将代码转换为所有浏览器都能理解的有效 ES5 JavaScript。每个 `JSX` 元素变成一个函数调用，其参数是它的属性（`props`）和它的内容（`children`）。\n\
  \n这是一个简单的 `JSX` 示例：\n\n```javascript\nreturn <span>Hello!</span>;\n```\n\n这里是编译器生成的\
  \ JavaScript：\n\n```javascript\nreturn React.createElement(\n  'span',\n  {},\n\
  \  'Hello!');\n```\n\n`React.createElement` 函数的签名如下：\n\n```javascript\nReact.createElement(\n\
  \  string|element,\n  [propsObject],\n  [children...])\n```\n\n`string|element`\
  \ 可以是描述 HTML 或 SVG 标签的字符串（如 `'div'` 或 `'span'`），也可以是一个组件（如 `HelloWorld`，不带引号）。\n\
  \n`propsObject` 和 `children` 是可选的，你还可以通过传递额外的参数提供多个子节点：\n\n```javascript\nReact.createElement(\n\
  \  'div',\n  {},\n  'Hello',\n  'World'\n);\n```\n\n你还可以嵌套调用：\n\n```javascript\n\
  React.createElement('div', {},\n  React.createElement('div', {}, 'Child1'),\n  React.createElement('div',\
  \ {}, 'Child2',\n    React.createElement('div', {}, 'Child2_child')\n  )\n);\n```\n\
  \n自己尝试一下！重写 `HelloWorld` 组件，调用 `React.createElement` 而不是返回 `JSX`。\n\n```javascript\n\
  function HelloWorld() {\n  return (\n    React.createElement(/* ... */)\n  );\n\
  }\n```\n\n这是一段稍微复杂一点的 `JSX`：\n\n```javascript\n<span className='song-name'>\n  {props.song.name}\n\
  </span\n```\n\n这是它编译后的样子：\n\n```javascript\nReact.createElement(\n  'span',\n  {\
  \ className: 'song-name' },\n  props.song.name\n);\n```\n\n\n\n\n将代码拆分为单独的文件并不会自动导致关注点分离。\n\
  \n这与老旧的 jQuery 故事类似。HTML 完全不知道 JavaScript 的存在，但 JS 和 HTML 之间是紧密耦合的，因为 jQuery 选择器必须了解页面的结构信息。如果结构发生了变化，代码也随之改变。\n\
  \n如果你还没有注意到，我正试图证明一个观点：模板和视图逻辑实际上可以存在于同一个文件中，而且*这样做实际上可能更有意义*。\n\n你现在不需要相信我。在学习这些示例和练习时，将这个想法留存在脑海中即可。你可能会发现（就像我一样），将逻辑和视图合并会让你的代码更容易导航、更容易编写且更容易调试。当所有相关功能都在一个地方时，你花费在文件之间跳转的时间会更短。\n\
  \n# 使用 JSX\n\n## 组件组合\n\nJSX 像 HTML 一样，允许你将元素嵌套在内部。这可能并不是什么惊喜。\n\n让我们重构之前的 `HelloWorld`\
  \ 组件，以展示组合是如何工作的。这里是原始的 `HelloWorld`：\n\n```\nfunction HelloWorld() {\n  return\
  \ (\n    <div>Hello World!</div>\n  );\n}\n```\n\n暂时保持 `HelloWorld` 组件不变，创建两个*新*组件：一个命名为\
  \ `Hello`，另一个命名为 `World`。`Hello` 应该渲染 `<span>Hello</span>`，`World` 应该渲染 `<span>World</span>`。你基本上可以复制粘贴\
  \ `HelloWorld` 组件，只需更改文本和函数名即可。\n\n动手自己尝试一下这些更改吧。我会等。\n\n……\n\n……\n\n明白了吗？实际上手打出这些内容*并亲自尝试是非常重要的！不要只是一边点头一边阅读，因为那样你实际上并不会学。看代码并想“这些都说得通，是的”是非常容易的。在你*尝试它*之前，你永远不知道自己是否内化了它。\n\
  \n你的两个新组件看起来应该是这样的：\n\n```\nfunction Hello() {\n  return <span>Hello</span>;\n}\n\
  \nfunction World() {\n  return <span>World</span>;\n}\n```\n\n现在，更新 `HelloWorld`\
  \ 组件使用你刚刚创建的两个新组件。它看起来应该是这样的：\n\n```\nfunction HelloWorld() {\n  return (\n    <div>\n\
  \      <Hello/> <World/>!\n    </div>\n  );\n}\n```\n\n假设应用仍在运行，页面应该会自动刷新。如果没有，请手动刷新，并确保应用正在运行（如果没有运行，请运行\
  \ `npm start`）。\n\n你应该能看到和之前一样的“Hello World!”。我知道这看起来很简单，但我向你保证这里有一些教训。\n\n## 用圆括号包裹\
  \ JSX\n\n以下示例依赖于你应该创建的 `Hello` 和 `World` 组件，因此在继续之前，请确保这些组件存在。\n\n首先是一个关于格式的说明。你可能会注意到我将返回的\
  \ JSX 包裹在了圆括号 `()` 中。这并不是严格必要的，但如果你省略括号，起始标签必须与 `return` 语句在同一行，这看起来有点很奇怪：\n\n```\n\
  function HelloWorld() {\n  return <div>\n    <Hello/> <World/>!\n  </div>;\n}\n\
  ```\n\n为了好玩，尝试移除括号并观察会发生什么：\n\n```\nfunction HelloWorld() {\n  return \n    <div>\n\
  \      <Hello/> <World/>!\n    </div>;\n}\n```\n\n这会在浏览器中报错：\n\n`HelloWorld(): A\
  \ valid React element (or null) must be returned. You may have returned undefined,\
  \ an array or some invalid object.`\n\n你可能还会看到关于“不可到达的代码”的警告。这是因为 JavaScript 假设你在那个\
  \ `return` 之后想要分号（因为有换行符），实际上将其变成了这样，从而返回了 `undefined`：\n\n```\nfunction HelloWorld()\
  \ {\n  return;\n    <div>\n      <Hello/> <World/>!\n    </div>;\n}\n```\n\n所以：随你喜欢如何格式化你的\
  \ JSX，但如果它是多行的，我建议将其包裹在圆括号中。\n\n### 返回单个元素\n\n注意在 `HelloWorld` 示例中，两个组件是如何包裹在一个\
  \ `<div>` 中的：\n\n```\nfunction HelloWorld() {\n  return (\n    <div>\n      <Hello/>\
  \ <World/>!\n    </div>\n  );\n}\n```\n\n这里有一个小练习：尝试移除 `<div>` 包裹并看看会发生什么。你应该得到这个错误：\n\
  \n`Adjacent elements must be wrapped in an enclosing tag`\n\n如果这看起来很意外，请记住 JSX 在运行之前会被编译为\
  \ JS：\n\n```js\n// 这段 JSX:\n  return (<Hello/> <World/>);\n\n// 变成这个 JS:\n  return\
  \ (\n    React.createElement(Hello, null) React.createElement(World, null)\n  );\n\
  ```\n\n一次返回两个东西是没有意义的。所以这引出了这条重要的规则：\n\n`组件函数必须返回单个元素。`\n\n但等等！你可以返回一个数组吗？毕竟这只是\
  \ JavaScript……\n\n```js\n// 这段 JSX:\nreturn [<Hello/>, <World/>];\n// 会变成这个 JS（注意括号）。\n\
  // 它看起来是有效的...\nreturn [\n  React.createElement(Hello, null),\n  React.createElement(World,\
  \ null)\n];\n```\n\n尝试一下！它应该会失败。在开发者控制台中，你会看到：\n\n`HelloWorld(): A valid React element\
  \ (or null) must be returned. You may have returned undefined, an array or some\
  \ object.`\n\n所以目前：你必须返回单个元素。这在 React 16 发布后将会改变。\n\n### JSX 中的 JavaScript\n\n你可以在\
  \ JSX 代码中插入真实的 JavaScript 表达式，事实上你会经常这样做。用单大括号包裹 JavaScript，如下所示：\n\n```\nfunction\
  \ SubmitButton() {\n  var buttonLabel = \"Submit\";\n  return (\n    <button>{buttonLabel}</button>\n\
  \  );\n}\n```\n\n记住这将编译为 JavaScript，这意味着大括号内的 JS 必须是一个*表达式*。表达式产生值。这些是表达式：\n\n```\n\
  1 + 2\nbuttonLabel\naFunctionCall()\naFunctionName\n```\n\n每一个产生（即返回）一个值。相比之下，“语句*不产生值且不能在\
  \ JSX 中使用。这些是语句的示例：\n\n```\nvar a = 5\nif(true) { 17; }\nwhile(i < 7) { i++ }\n\
  ```\n\n这些东西都没有产生值。`var a = 5` 定义了一个值为 5 的变量，但它并没有*返回*该值。\n\n另一种思考语句与表达式的方法是，表达式可以位于赋值的右侧，但语句不能。\n\
  \n```javascript\n// 这些不是有效的 JS:\na = var b = 5;\na = if(true) { 17; }\n```\n\n我反复强调这一点是因为它很重要，而且\
  \ React 初学者的常见障碍。\n\n## JSX 中的 “if”\n\n你可能会下一个问题是：“如果不能用 ‘if’，我该如何写条件判断？”有两种方案。\n\
  \n第一个是三元运算符（`?`）。你可以这样使用：\n\n```\nfunction ValidIndicator() {\n  var isValid = true;\n\
  \  return (\n    <span>{isValid ? 'valid' : 'not valid'}</span>\n  );\n}\n```\n\n\
  你也可以像这样使用布尔运算符，如 `&&`：\n\n```\nfunction ValidIndicator() {\n  var isValid = true;\n\
  \  return (\n    <span>\n      {isValid && 'valid'}\n      {!isValid && 'not valid'}\n\
  \    </span>\n  );\n}\n```\n\n### JSX 中的注释\n\n\n\n\n\n如果你需要在 JSX 块中放入注释，其语法看起来可能有点奇怪。请记住，JavaScript\
  \ 需要放在单大括号内。JSX 中的注释必须放在 JavaScript 块中，如下：\n\n```javascript\nfunction ValidIndicator()\
  \ {\n  var isValid = true;\n  return (\n    <span>\n      {/* 这里是一条注释 */}\n    \
  \  {isValid && 'valid'}\n      {!isValid && 'not valid'}\n      {\n        // 双斜杠注释在\n\
  \        // 多行块中是允许的。\n      }\n    </span>\n  );\n}\n```\n\n### 组件名称大写\n\n你编写的组件必须大写字母开头。这意味着要使用像\
  \ `UserList`、`Menu` 和 `SubmitButton` 这样的名称，而不是 `userList`、`menu` 和 `submitButton`。\n\
  \n在 JSX 中，以小写字母开头的组件被认为是内置的 HTML 或 SVG 元素（`div`、`ul`、`rect` 等）。\n\n早期版本的 React 保留了一个所有内置元素名称的“白名单”，以便将其与自定义元素区分开来。维护该白名单既耗时又容易出错——如果新的\
  \ SVG 元素进入规范，在 React 更新该列表之前，你无法使用它。因此他们删除了该列表，并添加了这条规则。\n\n### 关闭每个元素\n\nJSX 要求每个元素都必须关闭，类似于\
  \ XML 或 XHTML。这包括你可能习惯在 HTML5 中保持不关闭的元素，如 `<br>`、`<input>` 甚至是 `<li>`。\n\n```javascript\n\
  // 这样做：\nreturn <br/>;\nreturn <input type='password' .../>;\nreturn <li>text</li>;\n\
  \n// 不要这样做：\nreturn <br>;\nreturn <input type='password' ...>;\nreturn <li>text;\n\
  ```\n\n### 练习\n\n运行以下命令为这些练习创建一个新应用：\n\n```bash\n$ create-react-app jsx-exercises\n\
  ```\n\n打开 `src/index.js` 文件并替换内容，类似于 Hello World 示例。完成剩余部分。\n\n```javascript\nimport\
  \ React from 'react';\nimport ReactDOM from 'react-dom';\n\nfunction MyThing() {\n\
  \  // ...\n}\n\nReactDOM.render(\n  <MyThing/>,\n  document.getElementById('root')\n\
  );\n```\n\n你可以删除或忽略 `src/App*` 文件和图标。如果你没有显式地 `import`它们，它们就不会打包到你的应用中。\n\n1. 创建一个渲染此\
  \ JSX 的组件：\n\n```jsx\n<div className='book'>\n  <div className='title'>\n    The\
  \ Title\n  </div>\n  <div className='author'>\n    The Author\n  </div>\n  <ul className='stats'>\n\
  \    <li className='rating'>\n      5 stars\n    </li>\n    <li className='isbn'>\n\
  \      12-345678-910\n    </li>\n  </ul>\n</div>\n```\n\n2. 查看 JSX 如何解释空白字符。尝试渲染这些布局（将\
  \ `.` 替换为空格字符）并注意输出（提示：行首和行尾的空格以及换行符会被移除）：\n\n1. 单行\n\n```jsx\n<div>\nNewline\n\
  Test\n</div>\n```\n\n3. 空行\n\n```jsx\n<div>\nEmpty\n\nNewlines\n\nHere\n</div>\n\
  ```\n\n4. 带有换行的空格\n\n```jsx\n<div>\n&nbsp;Non-breaking\n&nbsp;Spaces&nbsp;\n</div>\n\
  ```\n\n6. 带有换行的空格\n\n```jsx\n<div>\nLine1\nLine2\n</div>\n```\n\n3. 空行\n\n4. 带有换行的空格\n\
  \n3. 空行\n\n4. 带有换行的空格\n\n4.   返回一个字符串：\n\n```javascript\nfunction Greeting() {\n\
  \  return (\n    <div>\n      \"Hello,\"\n    </div>\n  );\n}\n```\n\n\n\n\n例如，如果我们正在构建\
  \ Twitter，我们可能会从上到下地构建 `Tweet` 组件，然后将其整合到一个推文列表中，接着将该列表嵌入到页面中，最后将该页面嵌入到更大的应用程序中。`Tweet`\
  \ 可以从上到下进行构建，而较大的应用程序则可以从下而上进行构建。\n\n还有一种从自下向上构建的好主意场景，那就是你有一个用其他框架（如 `Angular`\
  \ 或 `Backbone`）编写的现有应用，并且你想用 `React` 重写它。在这种情况下，从顶部开始没有意义，因为这会对你的整个代码库产生连锁反应。\n\n\
  从底部开始是易于管理且受控的。你可以构建应用的“叶子节点”——那些微小的、封装好的部分。让它们运行起来，然后构建下一层，依此类推，直到到达顶端。到那时，如果你愿意，你可以选择将当前的框架替换为\
  \ `React`。\n\n重写时，自下而上开发的另一个优势是它非常契合 React 的单向数据流范式。由于 `React` 组件占据树的底部，而且你可以保证\
  \ `React` 组件只包含其他 `React` 组件，那么对于理解如何将数据传递给需要它的组件就变得更容易了。\n\n### 构建 Tweet 组件\n\n\
  这是我们的蓝图：\n\n![The Tweet](img/file2.png)\n\n在本节中，我们将构建一个简单的静态推文，从顶层组件 `Tweet` 开始。\n\
  \n运行以下命令使用 `Create React App` 创建一个新项目：\n\n```bash\n$ create-react-app static-tweet\
  \ && cd static-tweet\n```\n\n它给了我们几个在这里用不到的文件，所以我们可以安全地删除它们：\n\n```bash\n$ rm src/App.*\
  \ src/logo.svg\n```\n\n新生成的项目在 `public` 目录下包含一个 `index.html` 文件。通过在 `<head>` 标签内添加此行来引入\
  \ Font Awesome（写在一一行）：\n\n```html\n<link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css\"\
  >\n```\n\n我们在 `src` 目录下也有一个生成的 `index.css` 文件。打开它并将内容替换为以下内容：\n\n```css\n.tweet\
  \ {\n  border: 1px solid #ccc;\n  width: 564px;\n  min-height: 68px;\n  padding:\
  \ 10px;\n  display: flex;\n  font-family: \"Helvetica\", arial, sans-serif;\n  font-size:\
  \ 14px;\n  line-height: 18px;\n}\n```\n\n`index.js` 文件将与 Hello World 的非常相似。它基本上是一样的东西，只是把“Hello\
  \ World”换成了“Tweet”。我承诺很快会让它变得更好。将 `src/index.js` 的内容替换为以下内容：\n\n```javascript\n\
  import React from 'react';\nimport ReactDOM from 'react-dom';\nimport './index.css';\n\
  \nfunction Tweet() {\n  return (\n    <div className=\"tweet\">\n      Tweet\n \
  \   </div>\n  );\n}\n\nReactDOM.render(<Tweet/>,\n  document.querySelector('#root'));\n\
  ```\n\n这样就搞定了。像以前一样运行命令启动服务器：\n\n```bash\n$ npm start\n```\n\n页面应该渲染出像这样的内容：\n\n\
  ![Tweet](img/file4.png)\n\n这不是什么你没见过的东西。它是一个简单的组件，增加了一个特殊的 `className` 属性（或“prop”）。\n\
  \n你可能注意到的另一个新点是 `import './index.css'`，它正在将……一个 CSS 文件导入到 JavaScript 文件中？乍一看很奇怪。\n\
  \n发生的情况是，在后台，当 `Webpack` 构建我们的应用时，它看到了这个 CSS 导入并知道 `index.js` 依赖于 `index.css`。`Webpack`\
  \ 读取 CSS 文件并将其包含在包过的 JavaScript（以字符串形式）中发送到浏览器。\n\n你实际上可以在浏览器中看到这一点——打开开发者控制台，查看\
  \ Elements 选项卡，并注意到 `<head>` 下有一个我们没有放置在那里的 `<style>` 标签。它包含了 `index.css` 的内容。\n\
  \n我们将在下一节学习更多关于 props 的知识，但现在，只需把它们想象成 HTML 属性即可。大多数属性的命名与你已经熟悉的属性完全相同，但 `className`\
  \ 的特殊之处在于它的值变成了 DOM 节点上的 `class` 属性。\n\n回到我们的大纲。让我们来构建 `Avatar` 组件。在 `index.js`\
  \ 中添加组件函数：\n\n```javascript\nfunction Avatar() {\n  return (\n    <img src=\"https://www.gravatar.com/avatar/nothing\"\
  \n      className=\"avatar\"\n      alt=\"avatar\" />\n  );\n}\n```\n\n稍后我们将查看将组件提取到文件中并通过\
  \ `import` 导入它们，但为了现在保持简单，我们只把组件放在 `index.js` 中。如果你想使用自己的 Gravatar，请 [gravatar.com/gravatar](https://gravatar.com/gravatar)\
  \ 查找它的 URL。\n\n接下来我们需要更改 `Tweet` 以渲染 `Avatar`：\n\n```javascript\nfunction Tweet()\
  \ {\n  return (\n    <div className=\"tweet\">\n      <Avatar/>\n      Tweet\n \
  \   </div>\n  );\n}\n```\n\n现在给 `Avatar` 一些样式，在 `index.css` 中：\n\n```css\n.avatar\
  \ {\n  width: 48px;\n  height: 48px;\n  border-radius: 5px;\n  margin-right: 10px;\n\
  }\n```\n\n它变得好看了：\n\n![Tweet](img/file5.png)\n\n接下来我们将创建两个组件，`Message` 和 `NameWithHandle`：\n\
  \n```javascript\nfunction Message() {\n  return (\n    <div className=\"message\"\
  >\n      这少于 140 个字符。\n    </div>\n  );\n}\n\nfunction NameWithHandle() {\n  return\
  \ (\n    <span className=\"name-with-handle\">\n      <span className=\"name\">你的名字</span>\n\
  \      <span className=\"handle\">@用户名</span>\n    </span>\n  );\n}\n```\n\n如果你现在刷新，没有任何变化，因为我们还需要更新\
  \ `Tweet` 来使用这些新组件：\n\n```javascript\nfunction Tweet() {\n  return (\n    <div className=\"\
  tweet\">\n      <Avatar/>\n      <div className=\"content\">\n        <NameWithHandle/>\n\
  \        <Message/>\n      </div>\n    </div>\n  );\n}\n```\n\n现在渲染了但很丑。为名字和用户名添加一些\
  \ CSS：\n\n```css\n.name {\n  font-weight: bold;\n  margin-bottom: 0.5em;\n  margin-right:\
  \ 0.3em;\n}\n\n.handle {\n  color: #8899a6;\n  font-size: 13px;\n}\n```\n\n![Tweet](img/file6.png)\n\
  \n现在看起来更像真实的推文了！接下来，添加 `Time` 和按钮（我们稍后会讨论这种新语法）：\n\n```javascript\nconst Time =\
  \ () => (\n  <span className=\"time\">3 小时前</span>\n);\n\nconst ReplyButton = ()\
  \ => (\n  <i className=\"fa fa-reply reply-button\"/>\n);\n\nconst RetweetButton\
  \ = () => (\n  <i className=\"fa fa-retweet retweet-button\"/>\n);\n\nconst LikeButton\
  \ = () => (\n  <i className=\"fa fa-heart like-button\"/>\n);\n\nconst MoreOptionsButton\
  \ = () => (\n  <i className=\"fa fa-ellipsis-h more-options-button\"/>\n);\n```\n\
  \n这些组件看起来不像你到目前为止编写的 `function`，但它们实际上仍然函数。它们是 *箭头函数*。这里从普通的 `function` 到箭头函数的演变过程可以让你看到发生了什么：\n\
  \n\n\n\n\n```javascript\nfunction LikeButton() {\n  return (\n    <i className=\"\
  fa fa-heart like-button\"/>\n  );\n}\n\n// 这可以重写为一个\n// 匿名函数：\n\nconst LikeButton\
  \ = function() {\n  return (\n    <i className=\"fa fa-heart like-button\"/>\n \
  \ );\n}\n\n// ...它可以被转换为\n// 箭头函数：\n\nconst LikeButton = () => {\n  return (\n \
  \   <i className=\"fa fa-heart like-button\"/>\n  );\n}\n\n// 它可以进一步简化为：\n\nconst\
  \ LikeButton = () => (\n  <i className=\"fa fa-heart like-button\"/>\n);\n\n// 如果它真的非常简单，\n\
  // 你甚至可以把它写成一行：\n\nconst Hi = () => <span>Hi</span>;\n```\n\n箭头函数是编写组件的一种非常简洁的方式。函数本身就是\
  \ `() => { ... }` 部分。\n\n注意在最后几个版本中没有 `return`：当箭头函数只包含一个表达式时，它可以不带大括号编写。当不带大括号编写时，该表达式会被隐式返回。\n\
  \n在阅读这本书的过程中，你会继续使用箭头函数，所以如果它们现在看起来很陌生，也不要担心。你会习惯的。\n\n### let 和 const 关键字\n\n如果你熟悉\
  \ C 或 Java 等语言，那么你对块作用域（block scoping）并不陌生。正如你可能知道的，JavaScript 的 `var` 实际上是函数作用域的而不是块作用域。这长期以来一直令人困扰。\n\
  \nES6 添加了 `let` 和 `const` 作为两种声明块作用域变量的新方式。\n\n`let` 关键字定义了一个可变的（changeable）变量。你几乎可以在任何地方使用它来代替\
  \ `var`。\n\n`const` 定义了一个常量。如果你尝试重新赋值该变量，它将抛出错误，但值得注意的是，它并没有阻止你修改该变量内部的数据。这里有一个例子：\n\
  \n```javascript\nconst answer = 42;\nanswer = 43;   // 错误！\n\nconst numbers = [1,\
  \ 2, 3];\nnumbers[0] = 'this is fine'; // 无错误\n```\n\n使用 `const` 更多的是一种意图信号，而不是无无不击的保护方案，但它仍然很有价值。\n\
  \n现在我们已经有了所有这些新组件，再次更新 `Tweet` 来整合它们：\n\n```javascript\nfunction Tweet() {\n  return\
  \ (\n    <div className=\"tweet\">\n      <Avatar/>\n      <div className=\"content\"\
  >\n        <NameWithHandle/><Time/>\n        <Message/>\n        <div className=\"\
  buttons\">\n          <ReplyButton/>\n          <RetweetButton/>\n          <LikeButton/>\n\
  \          <MoreOptionsButton/>\n        </div>\n      </div>\n    </div>\n  );\n\
  }\n```\n\n最后，添加一些更多样式来覆盖时间和按钮部分：\n\n```css\n.time {\n  padding-left: 0.3em;\n  color:\
  \ #8899a6;\n}\n\n.time::before {\n  content: \"\\00b7\";\n  padding-right: 0.3em;\n\
  }\n\n.buttons {\n  margin-top: 10px;\n  margin-left: 2px;\n  font-size: 1.4em;\n\
  \  color: #ab8c;\n}\n\n.buttons i {\n  width: 80px;\n}\n```\n\n这里有一条相当不错的推文！![最终推文](img/file7.png)\n\
  \n你可以根据自己的心意对其进行定制：更改名称、消息，甚至是 Gravatar。很酷，对吧？\n\n“但是……等一下，”我听到你在说，“我以为我们正在构建可复用的组件呢！”\
  \ 这条推文确实很漂亮，但它只适用于显示一个人的某条消息……\n\n不用担心，因为接下来的内容是：使用 props 对组件进行参数化。\n\n# Props\n\
  \n## 组件的参数\n\nHTML 元素有“属性（attributes）”，而 React 组件有“props”（“properties 属性”的缩写）。我们已经看到组件可以被写成函数，因此理所当然地假设我们可以向这些函数传递参数。Props\
  \ 就是传递给组件的参数。\n\n### 传递 Props\n\n这段 JSX 代码正在传递一个名为 `name` 的 prop，其值为 `\"Dave\"`：\n\
  \n```jsx\n<Person name='Dave'/>\n```\n\n这是另一个例子，传递了一个值为 `\"person\"` 的 `className`\
  \ prop：\n\n```jsx\n<div className='person'/>\n```\n\nJSX 使用 `className` 而不是 `class`\
  \ 来指定 CSS 类。注意这个 `div` 是自闭合的吗？这种能力不仅仅用于 `<input/>`：在 JSX 中，每个组件都可以自闭合的。事实上，如果组件没有子元素（内容），惯例是这样写它，而不是使用结束标签。\n\
  \n在这里，我们为 `className` 传递了一个字符串，为 `age` prop 传递了一个数字，并为 `name` 传递了一个真实的 JavaScript\
  \ 表达式：\n\n```javascript\nfunction Dave() {\n  const firstName = \"Dave\";\n  const\
  \ lastName = \"Ceddia\";\n  return (\n    <Person \n      className='person'\n \
  \     age={33}\n      name={firstName + ' ' + lastName} />\n  );\n}\n```\n\n记住在\
  \ JSX 中，大括号包裹 JavaScript 表达式。大括号中的代码是真实的 JavaScript，并遵循与普通 JavaScript 相同的所有作用域规则。\n\
  \n重要一点是，大括号内的 JS 必须是表达式，而不是语句。在 JSX 表达式内部你可以做：\n\n* 数学计算、拼接：`{7 + 5}` 或 `{'Your'\
  \ + 'Name'}`\n* 函数调用：`{getFullName(person)}`\n* 三元运算符：`{name === 'Dave' ? 'me' :\
  \ 'not me'}`\n* 布尔表达式：`{isEnabled && 'enabled'}`\n\n是你不能做的：\n\n* 使用 `var` 定义新变量\n\
  * 使用 `if`、`for`、`while` 等\n* 使用 `function` 定义函数\n\n记住 JSX 会转换为 JavaScript， props\
  \ 变成对象中的键和值。这里是上面的示例转换为 JavaScript：\n\n```javascript\nfunction Dave() {\n  const\
  \ firstName = \"Dave\";\n  const lastName = \"Ceddia\";\n  return React.createElement(Person,\
  \ {\n    age: 33,\n    name: firstName + ' ' + lastName,\n    className: 'person'\n\
  \  }, null);\n}\n```\n\n适用于函数参数的所有规则适用于 JSX 表达式。你可以这样调用函数吗？\n\n```javascript\nmyFunc(var\
  \ x = true; x && 'is true');\n```\n\n当然不能！这看起来完全错误。如果你尝试将该参数传递给 JSX 表达式，你会得到：\n\n\
  ```jsx\n<Broken value={var x = true; x && 'is true'}/>\n// 编译为：\nReact.createElement(Broken,\
  \ {\n  value: var x = true; x && 'is true'\n}, null);\n```\n\n所以当你试图决定在 JSX 表达式中放入什么时，问问自己：“我可以把这个作为函数参数传递吗？”\n\
  \n### 接收 Props\n\nProps 作为第一个参数传递给组件函数，如下：\n\n```javascript\nfunction Hello(props)\
  \ {\n  return (\n    <span>Hello, {props.name}</span>\n  );\n}\n\n// 使用方式：\n<Hello\
  \ name=\"Dave\"/>\n```\n\n\n\n\n你可以将 `{ name }` 理解为“从作为第一个参数传递的对象中提取‘name’ 键”。它也可以提取多个键：\n\
  \n```javascript\nconst Hello = ({ firstName, lastName }) => (\n  <span>Hello, {firstName}\
  \ {lastName}</span>\n);\n```\n\n在实践中，props 经常使用这种解构语法编写。顺便说一下，它在函数参数外部也有效。例如，你可以像这样解构\
  \ props：\n\n```javascript\nconst Hello = (props) => {\n  const { name } = props;\n\
  \  return (\n    <span>Hello, {name}</span>\n  );\n}\n```\n\n记住，如果箭头函数的体用大括号包围，则需要一个\
  \ `return`；如果函数体包含多行，则需要大括号。\n\n### 修改 Props\n\n需要知道的一个重要点是，props 是**只读的**。接收 props\
  \ 的组件不能修改它们。\n\n如果你来自 Angular 的背景，那么这是一个变化。Angular 的双向绑定机制允许修改作用变量（Angular 版本的 props），并会自动将这些更改传播到父组件。\n\
  \n在 React 中，数据流是**单向的**。Props 是只读的，且只能**向下**传递给子。\n\n### 与父组件通信\n\n如果你不能更改 props，但需要向父组件传递某些信息，该如何操作呢？\n\
  \n如果子组件需要向父组件发送数据，父组件可以注入一个 `function` 作为 prop，如下：\n\n```javascript\nfunction handleAction(event)\
  \ {\n  console.log('Child did:', event);\n}\n\nfunction Parent() {\n  return (\n\
  \    <Child onAction={handleAction}/>\n  );\n}\n```\n\n`Child` 组件接收一个名为 `onAction`\
  \ 的 prop，它可以在任何需要向上发送数据或通知父组件事件的时刻调用它。你会注意到内置的 `button` 元素接受一个 `onClick` prop，它在按钮被点击时会调用它。我们稍后会深入研究事件处理。\n\
  \n```javascript\nfunction Child({ onAction }) {\n  return (\n    <button onClick={onAction}/>\n\
  \  );\n}\n```\n\n## 示例：带有 Props 的推文\n\n现在你对 props 有了基本的了解，让我们看看它们在实践中是如何工作的。\n\n\
  我们将取第 5 章中的静态 `Tweet` 示例，并重构它以通过 props 显示动态数据。\n\n对于这个示例，请复制 `static-tweet` 项目文件夹，这样我们就可以在不用担心旧代码的情况下工作。我们还将启动一个开发服务器（如果它仍在运行，请停止它）。\n\
  \n```bash\n$ cp -a static-tweet props-tweet && cd props-tweet\n$ npm start\n```\n\
  \n**注意：不要使用 `cp -r`，因为它不会保留符号链接，会破坏 `npm start`。**\n\n如果在复制项目后 `npm start` 命令失败，请删除\
  \ `node_modules` 文件夹并运行 `npm install`。然后再次尝试 `npm start`。\n\n打开 `src/index.js`。首先，更新\
  \ `Tweet` 组件以接收一个如下所示的 `tweet` prop。然后添加 `testTweet` 对象，将其作为我们的假数据，并更新 `ReactDOM.render`\
  \ 的调用，将 `testTweet` 对象传递到 `tweet` prop 中。\n\n进行这些更改后刷新页面，确保一切看起来和之前一样（目前不应该有任何变化）。\n\
  \n```javascript\n// 添加 { tweet } 解构\nfunction Tweet({ tweet }) {\n  return (\n \
  \   <div className=\"tweet\">\n      <Avatar/>\n      <div className=\"content\"\
  >\n        <NameWithHandle/><Time/>\n        <Message/>\n        <div className=\"\
  buttons\">\n          <ReplyButton/>\n          <RetweetButton/>\n          <LikeButton/>\n\
  \          <MoreOptionsButton/>\n        </div>\n      </div>\n    </div>\n  );\n\
  }\n\n// ...\nvar testTweet = {\n  message: \"Something about cats.\",\n  gravatar:\
  \ \"xyz\",\n  author: {\n    handle: \"catperson\",\n    name: \"IAMA Cat Person\"\
  \n  },\n  likes: 2,\n  retweets: 0,\n  timestamp: \"2016-07-30 21:24:37\"\n};\n\
  ReactDOM.render(<Tweet tweet={testTweet}/>,\ndocument.querySelector('#root'));\n\
  ```\n\n#### Avatar\n\n让我们开始将静态组件转换为接受 props 的，从 `Avatar` 开始。在 `Tweet` 的 render 方法中，替换这一行：\n\
  \n```javascript\n<Avatar/>\n```\n\n替换为这一行：\n\n```javascript\n<Avatar hash={tweet.gravatar}/>\n\
  ```\n\n这把推文的 `gravatar` 属性传递到 `hash` prop 中。现在更新 `Avatar` 使用这个 prop：\n\n```javascript\n\
  function Avatar({ hash }) {\n  var url = `https://www.gravatar.com/avatar/${hash}`;\n\
  \  return (\n    <img\n      src={url}\n      className=\"avatar\"\n      alt=\"\
  avatar\" />\n  );\n}\n```\n\n使用 ES6 解构传入 `hash` 的 Gravatar hash 被整合到 URL 中，并像以前一样传递给图像标签。这里再给你一点\
  \ ES6 知识：URL 字符串周围的反引号是 `template strings`（模板字符串）的新语法。`${hash}` 部分将被 hash 替换。这种新语法比字符串拼接（例如\
  \ `\"https://www.gravatar.com/avatar/\" + hash`）整洁得多。\n\n头像的渲染效果与之前一样。\n\n如果你喜欢，可以用自己的\
  \ hash 替换 Gravatar hash。访问 `https://gravatar.com/gravatar`，输入你的邮箱并复制 hash。（如果你没有\
  \ Gravatar 账户，可以在 `https://gravatar.com` 创建一个）。\n\n#### Message\n\n现在我们来做 `Message`。在\
  \ `Tweet` 的 render 方法中替换这一行：\n\n```javascript\n<Message/>\n```\n\n替换为这一行：\n\n```javascript\n\
  <Message text={tweet.message}/>\n```\n\n我们从推文中提取了 `message` 并将其作为 `text` 传递给 `Message`\
  \ 组件。然后更新 `Message` 组件使用新的 prop：\n\n```javascript\nfunction Message({ text }) {\n\
  \  return (\n    <div className=\"message\">\n      {text}\n    </div>\n  );\n}\n\
  ```\n\n我们不再在 div 中使用静态文本，而是渲染传递的 `text` prop。现在刷新，你会发现消息现在是“Something about cats.”。成功！\n\
  \n#### NameWithHandle 和 Time\n\n这次我们将同时转换两个组件：`NameWithHandle` 和 `Time`。更新 `Tweet`\
  \ 以传递相关数据，替换 `render` 中的这一行：\n\n```javascript\n<NameWithHandle/><Time/>\n```\n\n\
  替换为这些行：\n\n```javascript\n<NameWithHandle author={tweet.author}/>\n<Time time={tweet.timestamp}/>\n\
  ```\n\n我们还将引入一个名为 Moment.js 的库来处理日期和时间。我们将用它计算计算时间字符串（如“3 天前”）。运行此命令安装 Moment：\n\
  \n```bash\nnpm install moment --save\n```\n\n我们需要在 `index.js` 顶部导入 `Moment`，因此在顶部添加此行：\n\
  \n```javascript\nimport moment from 'moment';\n```\n\n现在更新 `NameWithHandle` 和 `Time`\
  \ 组件。你会发现 `Time` 使用了新的 `moment` 库。\n\n```javascript\nfunction NameWithHandle({ author\
  \ }) {\n  const { name, handle } = author;\n  return (\n    <span className=\"name-with-handle\"\
  >\n      <span className=\"name\">{name}</span>\n      <span className=\"handle\"\
  >@{handle}</span>\n    </span>\n  );\n}\n\nconst Time = ({ time }) => {\n  const\
  \ timeString = moment(time).fromNow();\n  return (\n    <span className=\"time\"\
  >\n      {timeString}\n    </span>\n  );\n};\n```\n\n\n\n\n在静态推文示例中，`Time` 被写为一个箭头函数，所以我保留了原有的写法。然而，因为它现在包含两条语句，它需要外层的大括号，这会导致它需要一个\
  \ `return`。当然，你可以通过将 `moment(time).fromNow()` 直接移动到 `<span>` 内部来简化，这样你就可以移除 `return`\
  \ 和大括号。这交由你决定。\n\n## 到底应该传递什么作为 Prop？\n\nProps 可以接受各种类型：数字、布尔值、字符串、对象，甚至是函数。在早期，你可能会想：是应该传递一个对象并让组件提取它所需的内容？还是应该传递组件所需的特定数据片段？\n\
  \n在这些示例中，我们传递的是特定的数据。\n\n我们也可以直接传递 `tweet` 对象本身。例如，与其其直接向 `Time` 组件传递时间戳，不如传递 `tweet`\
  \ 并让它从推文中提取时间戳。为什么不这样做呢？这里有几点原因：\n\n*   如果 `Time` 期望一个推文对象并提取出 `timestamp` 属性，那么它将无法用于推文对象以外的任何东西。如果你有一个具有名为“updated_at”的时间戳属性的用户，并想用\
  \ `Time` 组件渲染它该怎么办？嗯，你做不到，除非临时凑出一个“看起来像”带有时间戳的推文临时对象。\n\n*   `Time` 组件将了解 `tweet`\
  \ 对象的内部结构。这看起来可能不是什么大事，直到你有 10 个像这样的组件，而后端开发人员决定“timeStamp”（S 写大写）比“timestamp”看起来更好，现在你就必须更新所有这些组件。将对数据结构的知识保持在尽可能少的地方是一个好主意，这样可以降低更改的成本。\n\
  \n## Props 命名指南\n\n俗话所说：“计算机科学中有三件难事：缓存失效、命名，以及差一错误。”\n\n你为 props 选择的名称将影响组件的用方式，以及组件之间的耦合方式。想象一下，如果我们编写\
  \ `Time` 时接收一个名为 `tweetTime` 的 prop。即使我们直接传递时间戳（而不是整个推文对象），这作为 prop 名称仍然不是一个好的选择。为什么呢？\n\
  \n考虑一下当下一个开发者出现（也许是 3 周后的你），并想在应用中与推文无关的新部分复用 `Time` 组件时会发生什么。渲染结果会正常，但代码会显得很别扭。如果时间戳实际上并不属于某个推文，编写\
  \ `<Time tweetTime={timestamp}/>` 就表达了错误的意图。\n\n更有可能，开发者会查看 `Time`，看到它期望一个 `tweetTime`，然后决定不复用该组件——要么是因为他们认为它不符合需求，要么是因为他们担心其底层实现可能会发生并破坏他们的代码。\n\
  \n### 剩余的组件\n\n让我们回来转换 `Tweet` 及其子组件以使用 props。只剩下两个组件了：`RetweetButton` 和 `LikeButton`，它们需要显示转推和点赞的数量。目前，它们完全没有显示任何数字，只有一个图标。\n\
  \n修改这两行：\n\n```jsx\n<RetweetButton/>\n<LikeButton/>\n```\n\n将其改为这些行（传递计数值）：\n\n\
  ```jsx\n<RetweetButton count={tweet.retweets}/>\n<LikeButton count={tweet.likes}/>\n\
  ```\n\n然后，更新 `RetweetButton` 和 `LikeButton` 以接受新的 `count` prop 并渲染它们各自的数字：\n\n```jsx\n\
  function getRetweetCount(count) {\n  if(count > 0) {\n    return (\n      <span\
  \ className=\"retweet-count\">\n        {count}\n      </span>\n    );\n  } else\
  \ {\n    return null;\n  }\n}\n\nconst RetweetButton = ({ count }) => (\n  <span\
  \ className=\"retweet-button\">\n    <i className=\"fa fa-retweet\"/>\n    {getRetweetCount(count)}\n\
  \  </span>\n);\n```\n\n```jsx\nconst LikeButton = ({ count }) => (\n  <span className=\"\
  like-button\">\n    <i className=\"fa fa-heart\"/>\n    {count > 0 &&\n      <span\
  \ className=\"like-count\">\n        {count}\n      >}\n  </span>\n);\n```\n\n最后，样式也需要更新。去掉这些行：\n\
  \n```css\n.buttons i {\n  width: 80px;\n}\n```\n\n然后用这些代码替换它们：\n\n```css\n.reply-button,\
  \ .retweet-button,\n.like-button, .more-options-button {\n  width: 80px;\n  display:\
  \ inline-block;\n}\n\n.like-count, .retweet-count {\n  position: relative;\n  bottom:\
  \ 2px;\n  font-size: 13px;\n  margin-left: 6px;\n  font-weight: bold;\n}\n```\n\n\
  \n\n\n嗯，结果它最终会变成 `undefined`，就好像你忘记给一个普通的函数传递参数一样。这可能完全没问题，也可能导致代码崩溃的灾难（就像你忘记给一个普通的函数传递参数一样）。\n\
  \n不过，React 有一个秘密武器：`PropTypes`。\n\n当你创建一个组件时，你可以声明某些 props 是可选的或必须的，*并且*你还可以声明该\
  \ prop 预期的值类型。这里有一个示例：\n\n```javascript\nimport PropTypes from 'prop-types';\n\n\
  function Comment({ author, message, likes }) {\n  return (\n    <div>\n      <div\
  \ className='author'>{author}</div>\n      <div className='message'>{message}</div>\n\
  \      <div className='likes'>\n        {likes > 0 ? likes : 'No'} likes\n     \
  \ </div>\n    </div>\n  );\n}\nComment.propTypes = {\n  message: PropTypes.string.isRequired,\n\
  \  author: PropTypes.string.isRequired,\n  likes: PropTypes.number\n}\n```\n\n首先，注意\
  \ `PropTypes` 必须从 `prop-types` 包中显式导入。这是 React 15.5 引入的变化。如果你在使用 Create React App，你应该已经安装了这个包，但如果没有，快速运行\
  \ `npm install --save prop-types` 即可解决。\n\n接下来，注意 `propTypes` 是被设置为函数本身的一个属性。这种样式无论组件是函数、箭头函数，甚至是\
  \ ES6 类（我们稍后会看到）都有效。\n\n最后，注意 `propTypes` 属性以小写的“p”开头，而导入的 `PropTypes` 则以大写的“P”开头。\n\
  \n通过这这组 propTypes，`message` 和 `author` 是必填的，且必须是字符串。`likes` prop 是可选的，但如果提供，则必须是数字。尝试以几种不同的方式渲染它，并每次检查控制台：\n\
  \n```javascript\n<Comment author='somebody' message='a likable message' likes={1}/>\n\
  <Comment author='mr_unpopular' message='unlikable message'/>\n<Comment author='mr_unpopular'\
  \ message='another message' likes={0}/>\n<Comment author='error_missing_message'/>\n\
  <Comment message='mystery author'/>\n```\n\n如果你忘记了必填的 prop，React 会在控制台中警告你：\n\n\
  ```javascript\n<Comment author='an_error'/>\n```\n\n> Warning: Failed propType:\
  \ Required prop `message` was not specified in `Comment`.\n\n同样地，如果你传递了错误的类型，也会收到警告：\n\
  \n```javascript\n<Comment author={42}/>\n```\n\n> Warning: Failed propType: Invalid\
  \ `author` of type `number` supplied to `Comment`.\n\n这些警告信息对于调试来说是无价之宝。它告诉你犯了什么错误，并提示你应该去哪里查看！这比某些在你忘记必填属性时静默失败的框架好得多。\n\
  \n### 陷阱\n\n那么有什么陷阱呢？所有这些错误处理一定都有陷阱，对吧？某种程度上如此。propTypes 的唯一陷阱在于你必须记得声明它们。提供 `propTypes`\
  \ 是可选的，如果你没有为组件指定它们，React 不会给你任何警告。你可以选择非常勤奋地编写这些 propTypes，也可以让 linter 工具来帮你检查。ESLint\
  \ 是一个流行的选择，并且有一个 React 的 ESLint 插件，可以检查缺失的 PropTypes 以及 props 是否正确传递等问题。\n\n###\
  \ 如何进行验证，让我看看方法\n\nReact 的 `propTypes` 允许你表达许多不同的验证。默认情况下，prop 验证是可选的。如果你想让它必填，在末尾添加\
  \ `.required`。\n\n首先，有标准 JavaScript 类型的验证器：\n\n* `PropTypes.array`\n* `PropTypes.bool`\n\
  * `PropTypes.func`\n* `PropTypes.number`\n* `PropTypes.object`\n* `PropTypes.string`\n\
  \n你之前看到过 `string` 和 `number` 验证器。其他的原理相同——验证传入的是否数组、布尔值或其他内容。\n\n还有针对 `node` 和 `element`\
  \ 的验证器。`node` 是任何可以渲染的内容，意味着数字、字符串、元素或数组。`element` 是通过 JSX 或调用 `React.createElement`\
  \ 创建的 React 元素。有一个 `instanceOf` 验证器，用于检查 prop 是否是特定类的实例。它接受一个参数：`PropTypes.instanceOf(SpecificClass)`。\n\
  \n你可以使用 `oneOf` 限制为特定值：`PropTypes.oneOf(['person', 'place', 1234])`。\n\n你可以验证 prop\
  \ 是否是几种类型之一：\n\n```javascript\nPropTypes.oneOfType([\n  PropTypes.string,\n  PropTypes.boolean\n\
  ])\n```\n\n你可以验证它是否是特定类型的数组，或者其属性值为特定类型值的对象：\n\n* `PropTypes.arrayOf(PropTypes.string)`\n\
  \    * 会匹配：`['a', 'b', 'c']`\n    * 不匹配：`['a', 'b', 42]`\n* `PropTypes.objectOf(PropTypes.number)`\n\
  \    * 会匹配：`{age: 27, birthMonth: 9}`\n    * 不匹配：`{age: 27, name: 'Joe'}`\n\n你可以验证一个对象是否具有特定的\
  \ `shape`，这意味着它具有特定的属性。传递给此 prop 的对象允许拥有额外的属性，但它至少包含 shape 描述中的属性。\n\n```javascript\n\
  PropTypes.shape({\n  name: PropTypes.string,\n  age: PropTypes.number\n})\n```\n\
  \n这将匹配一个具有精确形状的对象，如下：\n\n```javascript\nperson = {\n  name: 'Joe',\n  age: 27\n\
  }\n```\n\n它也会匹配具有额外属性的对象，如下：\n\n```javascript\nperson = {\n  name: 'Joe',\n  age:\
  \ 27,\n  address: '123 Fake St',\n  validPerson: false\n}\n```\n\n这个 PropTypes `shape`\
  \ 要求对象具有 `name` 和 `age` 键，因此如果我们遗漏了其中一个，它将无法通过。这会产生警告：\n\n```javascript\nperson\
  \ = {\n  age: 27\n}\n```\n\n同样地，如果我们为这些键之一传递了错误的类型，我们将收到警告：\n\n```javascript\nperson\
  \ = {\n  name: false,  // 布尔值而非字符串\n  age: 27\n}\n```\n\n#### 必填属性\n\n任何 PropType\
  \ 验证都可以通过末尾添加 `.isRequired` 变为必填。这些都是必填的：\n\n```javascript\nPropTypes.bool.isRequired\n\
  PropTypes.oneOf(['person', 'place', 1234]).isRequired\nPropTypes.shape({\n  name:\
  \ PropTypes.string,\n  age: PropTypes.number\n}).isRequired\n```\n\n\n\n\n\n```\n\
  function customValidator(props, propName, componentName) {\n  // here, propName\
  \ === \"myCustomProp\"\n  if (props[propName].length !== 3) {\n    return new Error(\n\
  \      'Invalid prop `' + propName + '` supplied to' +\n      ' `' + componentName\
  \ + '`. Length is not 3.'\n    );\n  }\n}\n\nconst CustomTest = ({ myCustomProp\
  \ }) => (\n  <span>{myCustomProp}</span>\n);\nCustomTest.propTypes = {\n  myCustomProp:\
  \ customValidator\n}\n\n// 这将产生一个警告:\nReactDOM.render(\n  <CustomTest myCustomProp='not_three_letters'/>,\n\
  \  document.getElementById('root')\n);\n\n// 这将会工作:\nReactDOM.render(\n  <CustomTest\
  \ myCustomProp={[1, 2, 3]}/>,\n  document.getElementById('root')\n);\n\n// 这也将正常工作:\n\
  ReactDOM.render(\n  <CustomTest myCustomProp=\"abc\"/>,\n  document.getElementById('root')\n\
  );\n```\n\n## 示例：带有 PropTypes 的推文\n\n最后，让我们回到 Tweet 示例，看看 PropTypes 是如何应用到一组真实的组件的。\n\
  \n回想一下结构如下：\n\n* `Tweet`\n    * `Avatar`\n    * `NameWithHandle`\n    * `Time`\n\
  \    * `Message`\n    * `ReplyButton`\n    * `RetweetButton`\n    * `LikeButton`\n\
  \    * `MoreOptionsButton`\n\n而它看起来应该是这样的：\n\n![完成的推文](img/file8.png) \n\n从下往上，为这些组件添加\
  \ PropTypes。复制一份之前的 `props-tweet` 代码，这样我们就可以放心地进行修改了：\n\n```bash\n$ cp -a props-tweet\
  \ proptypes-tweet && cd proptypes-tweet\n$ npm start\n```\n\n按钮是一个很好的开始点。`MoreOptionsButton`\
  \ 完全不接受任何 props，所以我们不需要更改它。\n\n`LikeButton` 可以可选地接收一个 `count` prop，因此我们将为它添加一个 PropType：\n\
  \n```javascript\nconst LikeButton = ({ count }) => (\n  <span className=\"like-button\"\
  >\n    <i className=\"fa fa-heart\"/>\n    {count > 0 &&\n      <span className=\"\
  like-count\">\n        {count}\n      </span>}\n  </span>\n);\n\nLikeButton.propTypes\
  \ = {\n  count: PropTypes.number\n};\n```\n\n为了验证它是否有效，进入 `Tweet` 组件，并尝试向 `LikeButton`\
  \ 传递一个字符串而不是数字：\n\n```javascript\n//将此：\n<LikeButton count={tweet.likes}/>\n\n//\
  \ 改为：\n<LikeButton count='foo'/>\n```\n\n如果你现在刷新（或等待浏览器自动刷新），你应该会在开发者控制台中看到这样的警告：\n\
  \n> Warning: Failed propType: Invalid prop `count` of type `string` supplied to\
  \ `LikeButton`, expected `number`. Check the render method of `Tweet`.\n\n很好！一切运行正常。\n\
  \n将那行代码改回原来的样子，现在以同样的方法为 `RetweetButton` 组件添加一个 `count` PropType。这一步由你自己完成。现在去操作吧。\n\
  \n明白了吗？很好！我打赌你也能搞出 `Message` 和 `Time` 的 PropTypes（它们都接收可选的字符串）。去完成它们吧。\n\n```javascript\n\
  function NameHandle({ author }) {\n  const { name, handle } = author;\n  return\
  \ (\n    <span className=\"name\">{name}</span>\n    <span className=\"handle\"\
  >{handle}</span>\n  );\n}\n\nNameHandle.propTypes = {\n  author: PropTypes.shape({\n\
  \    name: PropTypes.string.isRequired,\n    handle: PropTypes.string.isRequired\n\
  \  }).isRequired\n};\n```\n\n### 你应该多显式？\n\n当传递给组件的对象非常简单时，写出 `shape` 是很容易的。然而，当对象变得更复杂时，你可能会怀疑这是否值得精力。答案取决于你的具体情况。如果你在某处有一个显式的\
  \ `shape`（例如在 `NameHandle` 中），那么在父组件 `Tweet` 中重复它就意义不大。如果某天 `author` 的形状发生了变化，将有两个地方需要更新。拥有第二个检查并不能带来任何好处，反而可能会浪费你的时间。\n\
  \n## PropTypes 作为文档\n\n关于 PropTypes 的最后一点：除了有助于调试之外，它们还充当了良好的文档。当你几天、一周或一个月后回到一个组件时，PropTypes\
  \ 将充当类似于“README”的角色。你不需要扫描整个代码来解读哪些 props 是必须的。\n\n### 练习\n\n谁说你必须按照网络界面来建模组件呢？现实世界的对象也是很好的练习。你将在下面构建其中一些。\n\
  \n1. 创建一个 `AddressLabel` 组件，接收一个 `person` 对象作为 prop，并按所示渲染他们的姓名和地址：\n\n```\nFull\
  \ Name\n123 Fake St.\nBoston, MA 02118\n```\n\n2. 创建一个 `Envelope` 组件，接收 `toPerson`\
  \ 和 `fromPerson` 作为 props，并使用你在练习 1 中的 `AddressLabel` 来显示发件地址和收件人地址。确保包含一个 `Stamp`！\n\
  \n![信封](img/file10.png) \n\n3. 根据此设计创建一个 `CreditCard` 组件。使用 CSS 或内联样式对其进行美化。接受一个\
  \ `cardInfo` prop，其中包含人的姓名、过期日期、信用卡号和银行名称。\n\n![信用卡](img/file11.png) \n\n4. 创建一个\
  \ `Poster` 组件，接收 `image`、`title` 和 `text` 作为 props。渲染类似下面图片的内容。可以搜索“反励海报”（demotivational\
  \ posters）来获取灵感。\n\n![海报](img/file12.png) \n\n\n\n\n我们已经看到 JSX 如何像 HTML 一样表达嵌套组件。我们也看到自定义组件可以接受\
  \ `props` 作为参数，并使用这些 `props` 来渲染内容或将其传递给子组件。\n\n这里有一个我们还没有提到过的特殊 `prop`：它被称为 `children`。\n\
  \n假设你想创建一个可复用的 `IconButton` 组件，它看起来像这样：\n\n![IconButton](img/file14.png) \n\n你可能会想象像这样使用它：\n\
  \n```\n<IconButton>Do The Thing</IconButton>\n```\n\n那个内部文本“Do The Thing”会发生什么呢？嗯，这就是\
  \ `children` prop 派上用场的地方。\n\n你必须在组件的某个地方显式地渲染 `children`。如果不这样做，它们就会被忽略。例如，如果 `IconButton`\
  \ 组件是这样的：\n\n```javascript\nfunction IconButton() {\n  return (\n    <button>\n\
  \      <i class=\"target-icon\"/>\n    </button>\n  );\n}\n```\n\n渲染出来的组件将是一个带有图标的按钮，没有任何文字。它看起来像这样：\n\
  \n![IconButton](img/file15.png) \n\n通过微小的调整，我们可以将文本放在图标之后：\n\n```javascript\nfunction\
  \ IconButton({ children }) {\n  return (\n    <button>\n      <i class=\"target-icon\"\
  />\n      {children}\n    </button>\n  );\n}\n```\n\n## 不同类型的 Children\n\n无论是一个子元素还是多个子元素，`children`\
  \ prop 始终以复数形式 `children` 。此外，`children` 的类型会根据其包含的内容而变化。\n\n当有多个子元素时，`children`\
  \ 是 `ReactElements` 数组。\n\n然而，当只有一个子元素时，它是一个单一的 `ReactElement`。这看起来可能有点奇怪：如果 `children`\
  \ 始终是一个数组，处理起来不是会更容易吗？\n\n嗯，是的，确实。但由于 `children` 使用得非常频繁，且单元素的使用场景足够常见，因此 React\
  \ 团队决定在只有一个子元素时不分配数组，以优化性能。\n\n## 处理 Children\n\nReact 提了一些实用函数来处理这种不透明的数据结构。\n\n\
  - `React.Children.map(children, function)`\n- `React.Children.forEach(children,\
  \ function)`\n- `React.Children.count(children)`\n- `React.Children.only(children)`\n\
  - `React.Children.toArray(children)`\n\n前两个 `map` 和 `forEach` 的工作方式与 JavaScript\
  \ 内置 `Array` 的方法相同。它们接受 `children`（无论是单个元素还是数组）以及一个会为每个元素调用的函数。`forEach` 遍历子元素且不返回任何内容，而\
  \ `map` 返回一个由你提供的函数所返回的值组成的数组。\n\n`count` 非常自而易懂：它返回 `children` 中项目的数量。\n\n`toArray`\
  \ 同样直观：它将 `children` 转换为一个扁平化数组，无论它之前是否是数组。\n\n`only` 返回唯一的子元素，如果存在多个子元素则会抛出异常。\n\
  \n你可以单独访问每一个子元素，因此可以对它们进行重新排序、删除某些、插入新元素、将子元素传递给更深层的子元素等等。\n\n## Children 的 PropTypes\n\
  \n如果你想让你的组件接受零、一个或多个子元素，请使用 `.node` 验证器：\n\n```javascript\npropTypes: {\n  children:\
  \ PropTypes.node\n}\n```\n\n如果你想让它只接受单个子元素，请使用 `element` 验证器：\n\n```javascript\n\
  propTypes: {\n  children: PropTypes.element\n}\n```\n\n请注意，这期望一个单一的 `React Element`\
  \ 作为子。这意味着它必须是一个自定义组件，或者像 `<div>` 这样的标签。如果你传递字符串或数字，`PropTypes.element` 将发出警告。如果你需要允许元素或字符串，可以如下使用\
  \ `oneOfType` 验证器：\n\n```javascript\npropTypes: {\n  children: PropTypes.oneOfType([\n\
  \    PropTypes.element,\n    PropTypes.string\n  ])\n}\n```\n\n与任何其他 `propType`\
  \ 一样，除非附加 `.isRequired`，否则它们都是可选的。\n\n## 与 Angular 中转插（Transclusion）的对比\n\n如果你用过\
  \ Angular，可能熟悉“转插（transclusion）”的概念，这是一个 Angular 使用的造词，意思是“获取指令的子元素并将其插入到 `ng-transclude`\
  \ 所在的位置”。\n\nReact 的 `children` prop 是一个类似的概念，但更强大，而且更容易理解。\n\n## 一个趣的示例\n\n在上面的示例中，我们简单地插入了一些文本。如果我们想做一些更具表达性的事情，比如创建我们自定义的组件层次结构呢？\n\
  \n假设我们为表达导航栏构建了某种形式的“API”：\n\n```jsx\n<Nav>\n  <NavItem>Home</NavItem>\n  <NavItem>About</NavItem>\n\
  \  <NavItem>Contact</NavItem>\n</Nav>\n```\n\n使用 `children` prop，`Nav` 可以执行诸如在每个项目之间插入分隔符的操作：\n\
  \n```javascript\nfunction Nav({ children }) {\n  let items = React.Children.toArray(children);\n\
  \  return (\n    <div\n      {for (let i = items.length - 1; i >= 1; i--) {\n  \
  \      items.splice(i, 0, <span key={i}>|</span>);\n      }\n      {items}\n   \
  \ </div>\n  );\n}\n```\n\n## 练习题\n\n现在你已经看到了 `children` 是如何工作的，这里有一些练习可以提高你的理解。\n\
  \n1. 制作一个看起来像这样的“错误框”：\n\n![An error box](img/file16.png) \n\n使用 `children` prop，调用该组件应该像这样：\n\
  \n```jsx\n<ErrorBox>\n  Something has gone wrong\n</ErrorBox>\n```\n\n可以自由使用 Bootstrap\
  \ 的模态样式，或创建你自己的。创建我们之前看到的 `NavItem` 组件。`NavItem` 应该接受一个 `url` prop 和链接文本作为子元素，然后渲染一个带有该文本并指向该\
  \ url 的锚点标签 (`<a>`) 元素。接下来，修改 `Nav` 组件以检查它的每一个子元素是否都是 `NavItem`，如果发现任何其他类型的组件，则抛出错误。作为测试，示例代码应该正常工作：\n\
  \n```jsx\n<Nav>\n  <NavItem url='/'>Home</NavItem>\n  <NavItem url='/about'>About</NavItem>\n\
  \  <NavItem url='/contact'>Contact</NavItem>\n</Nav>\n```\n\n而这段代码应该抛出错误：\n\n```jsx\n\
  <Nav>\n  <NavItem url='/'>Home</NavItem>\n  <NavItem url='/about'>About</NavItem>\n\
  \  <a href='/contact'>Contact</a>\n</Nav>\n```\n\n3. 创建一个 `Dialog` 组件，它接受 `Title`、`Body`\
  \ 和 `Footer` 组件作为子元素，所有都是可选的。`Dialog` 应该验证它的所有子元素都是这些类型之一，并应该输出像这样的内容：\n\n![A dialog](img/file17.png)\n\
  \n# 示例：GitHub 文件列表\n\n你已经掌握了几个组件。你已经见过 props 和 propTypes，并编写了一些 JSX。\n\n在我们进入状态和交互之前，我想通过一个涵盖我们目前为止所学内容的示例。这里还会涵盖一些新技巧。\n\
  \n\n\n\n考虑到这些，让我们创建一个复刻 GitHub 文件列表的新组件。这就是你在每个 GitHub 仓库顶部看到的内容：\n\n![GitHub 文件列表](img/file18.png)\
  \ \n\n## 分解组件\n\n第一步是勾勒或高亮截图中的所有组件。基本上，我们在这里做的是为设计中的 `div` 元素画框框。\n\n![高亮的 GitHub\
  \ 组件](img/file19.png) \n\n## 为组件命名\n\n一旦你决定了哪些部分作为组件，就给它们命名。对于上面的高亮部分，我想了这些名称（缩进以显示父子关系）：\n\
  \n*   `FileList`\n*   `FileListItem`\n    *   `FileName`\n    *   `FileIcon`\n \
  \   *   `CommitMessage`\n    *   `Time`\n\n## 你能复用什么吗？\n\n查看组件列表，看看你是否可以在任何地方节省自己的工作。\n\
  \n嘿，看！那个 `Time` 组件看起来和我们为 `Tweet` 写的那个非常相似。幸运的是，我们编写的 `Time` 组件是通用的，只接受时间而不是推文。我们可以在这里复用它。\n\
  \n## 每个组件需要什么数据？\n\n接下来，让我们弄清楚每个组件渲染时哪些数据。这将为每个组件提供 `props` 和 `propTypes`。\n\n尝试在不预先看代码的情况下，弄出这些每个组件的\
  \ `propTypes` 定义。\n\n`FileList` 应该接收一个 prop，`files`，它是一个文件对象的数组。\n\n`FileListItem`\
  \ 将接收一个单一的文件对象作为 `file` prop。该对象应该包含一个名称、类型、一个带有消息的提交（commit）以及一个最后修改时间。\n\n`FileName`\
  \ 将接收一个 `file` 对象，并期望它有一个 `name` 属性。\n\n`FileIcon` 将接收一个 `file` 对象，并使用它的 `type`\
  \ 属性来决定显示哪种图标。\n\n`CommitMessage` 将接收一个 `commit` 对象，该对象应该有一个 `message` 属性。\n\n最后，`Time`\
  \ 将接收一个绝对的 `time` 字符串。我们将复用为 `Tweet` 创建的 `Time` 组件，包括它的 `propTypes`。\n\n## 自顶而下还是自底而上？\n\
  \n对于这个，我们将从顶部开始向下进行。\n\n## 保持运行\n\n这是你在构建组件时应该努力的目标：确保它始终可以运行！\n\n你是否有过这样的经历：埋头写了很长时间代码，而从未运行过它？不可避免的是，当你第一次运行时总会有某些问题。\n\
  \n这令人失望，并且会让你灰打气。你最终不得不去追踪大量的语法错误、逻辑错误以及其他任何问题，才能看到你的心血变为现实。\n\n所以在在你编写时，尝试进行细小的更改，并频繁刷新。确保代码始终可用。\n\
  \n## FileList\n\n我们已经有了足够的方向来开始工作。按照我们之前做过的几次方法创建一个项目：\n\n```bash\n$ create-react-app\
  \ github-file-list && cd github-file-list\n$ rm src/App.* src/logo.svg\n```\n\n\
  从 `tweet` 项目的 `public` 目录复制 `index.html` 文件。如果你愿意，可以更改 `<title>`，但除此之外，`index.html`\
  \ 保持原样即可。\n\n打开 `src/index.js`。\n\n你还记得如何从导入开始文件，以及如何使用 `ReactDOM` 设置初始渲染调用吗？尝试凭记忆完成。如果记忆模糊，请回看\
  \ `Tweet` 的示例。\n\n创建 `FileList` 组件。为了尽可能实现最简单的功能，我们将渲染一个纯文件名的无序列表。一旦它运行正常，我们将把列表项提取到\
  \ `FileListItem` 组件中。\n\n```javascript\n// 在此处放入导入\nconst FileList = ({ files })\
  \ => (\n  <table className=\"file-list\">\n    <tbody>\n      {files.map(file =>\
  \ (\n        <tr className=\"file-list-item\" key={file.id}>\n          <td className=\"\
  file-name\">{file.name}</td>\n        </tr>\n      ))}\n    </tbody>\n  </table>\n\
  );\nFileList.propTypes = {\n  files: PropTypes.array\n};\n\nconst testFiles = [\n\
  \  {\n    id: 1,\n    name: 'src',\n    type: 'folder',\n    updated_at: \"2016-07-11\
  \ 21:21\"\n  },\n  {\n    id: 2,\n    name: 'tests',\n    type: 'folder',\n    updated_at:\
  \ \"2016-07-11 21:22\"\n  },\n  {\n    id: 3,\n    name: 'README',\n    type: 'file',\n\
  \    updated_at: \"2016-07-11 21:23\"\n  }\n];\n// 在此处放入 ReactDOM.render 调用\n//\
  \ 将 testFiles 作为 prop 传递\n```\n\n它看起来应该是这样：\n\n![FileList, 无样式](img/20.png) \n\n\
  \n\n\n\n```javascript\nconst FileList = ({ files }) => (\n  <table className=\"\
  file-list\">\n    <tbody>\n      {files.map(file =>\n        /* now we use FileListItem\
  \ here */\n        <FileListItem key={file.id} file={file}/>\n      )}\n    </tbody>\n\
  \  </table>\n);\nFileList.propTypes = {\n  files: PropTypes.array\n};\n\nconst FileListItem\
  \ = ({ file }) => (\n  /* this code has been extracted from FileList */\n  <tr className=\"\
  file-list-item\">\n    <td className=\"file-name\">{file.name}</td>\n  </tr>\n);\n\
  FileListItem.propTypes = {\n  file: PropTypes.object.isRequired\n};\n```\n\n我们还将添加一些\
  \ CSS 来让它看起来更美观。打开 `src/index.css` 并将其内容替换为以下代码：\n\n```css\n.file-list {\n  font-family:\
  \ Helvetica, sans-serif;\n  width: 980px;\n  color: #333;\n  margin: 0 auto;\n \
  \ border: 1px solid #ccc;\n  border-collapse: collapse;\n}\n\n.file-list td {\n\
  \  border-top: 1px solid #ccc;\n}\n\n.file-name {\n  padding: 4px;\n  max-width:\
  \ 180px;\n}\n```\n\n如果你还没有导入 CSS 文件，请不要忘记添加那行代码（`import './index.css'`）。\n\n![FileList](img/file21.png)\
  \ \n\n现在我们已经有了基础结构，可以将剩余的组件添加到行组件中。即 `FileIcon`、`FileName`、`CommitMessage` 和 `Time`。\n\
  \n让我们先处理 `FileIcon` 和 `FileName`，因为它们是嵌套在一起的。在看后面的内容之前，尝试自己编写代码。这个比较特殊。\n\n这是 `FileIcon`。它非常直观——是一个用普通函数编写的无状态组件。\n\
  \n```javascript\nfunction FileIcon({ file }) {\n  let icon = 'fa-file-text-o';\n\
  \  if(file.type === 'folder') {\n    icon = 'fa-folder';\n  }\n\n  return (\n  \
  \  <td className=\"file-icon\">\n      <i className={`fa ${icon}`}/>\n    </td>\n\
  \  );\n}\nFileIcon.propTypes = {\n  file: PropTypes.object.isRequired\n};\n```\n\
  \n这里是 `getFileName`，如果你仔细观察，它*不是*一个组件。\n\n```javascript\nfunction getFileName(file)\
  \ {\n  return [\n    <FileIcon file={file} key={0}/>\n    <td className=\"file-name\"\
  \ key={1}>{file.name}</td>\n  ];\n}\n```\n\n这只是一个接收 `file` 并返回元素数组的函数。组件不能在不用元素包裹的情况下返回数组。为什么要这样写呢？\n\
  \n问题在于我们正处于表格行（`<tr>`）内部，并且我们需要两个并相邻的 `<td>`，但一个真正的组件不能返回裸数组。你可以通过将 `FileIcon` 和\
  \ `FileName` 编写为独立的组件，且每个组件都返回一个 `<td>` 单元格（而不是像我们现在这样将 `FileIcon` 嵌套在 `FileName`\
  \ 内部），来完全避免这个问题。这可以说是比这种方法更好的解决方案！我之所以这样写是为了展示这种边缘情况，以防你遇到无法避免的情况。在写作时，React 16\
  \ (React Fiber) 就要问世了，它承诺解决从组件中返回多个元素的问题。你可以在 http://stackoverflow.dev/ 上跟踪 Fiber\
  \ 的进度。注意我们在这里为 `key` 传递了硬编码的值。我不是说过不要这样做吗？是的，这通常是一个坏主意，但因为这个数组*始终*会按该顺序包含 2 个元素，所以在这里不会产生问题。需要\
  \ `key` 是因为我们返回的是数组，而数组中的元素必须有一个 `key`。这里是使用 `getFileName` 函数的更新后的 `FileListItem`：\n\
  \n```javascript\nconst FileListItem = ({ file }) => (\n  <tr className=\"file-list-item\"\
  >\n    {getFileName(file)}\n  </tr>\n);\nFileListItem.propTypes = {\n  file: PropTypes.object.isRequired\n\
  };\n```\n\n好了，处理完这个奇怪的问题后，让我们添加一些 CSS 看看效果如何。\n\n```css\n.file-icon {\n  width:\
  \ 17px;\n  padding-left: 4px;\n}\n\n.file-icon .fa-folder {\n  color: #508FCA;\n\
  }\n```\n\n![With FileName and FileIcon](img/file22.png) \n\n### CommitMessage\n\n\
  接下来我们创建 `CommitMessage` 组件。这个非常直观，CSS 也是如此。我们将在 `FileListItem` 中使用 `CommitMessage`。\n\
  \n```javascript\nconst FileListItem = ({ file }) => (\n  <tr className=\"file-list-item\"\
  >\n    {getFileName(file)}\n    <CommitMessage\n      commit={file.latestCommit}\
  \ />\n  </tr>\n);\nFileListItem.propTypes = {\n  file: PropTypes.object.isRequired\n\
  };\n\nconst CommitMessage = ({ commit }) => (\n  <td className=\"commit-message\"\
  >\n    {commit.message}\n  </td>\n);\nCommitMessage.propTypes = {\n  commit: PropTypes.object.isRequired\n\
  };\n```\n\n```css\n.commit-message {\n  max-width: 442px;\n  padding-left: 10px;\n\
  \  overflow: hidden;\n}\n```\n\n![With CommitMessage](img/file23.png) \n\n注意我们传递的是\
  \ commit 本身而不是整个文件对象。`CommitMessage` 不需要了解关于文件的任何信息，了解数据结构的组件越少越好。\n\n### Time\n\
  \n我们现在添加时间功能。记住，我们可以复用推文练习中的 `Time` 组件。与其直接将 `Time` 组件复制粘贴到此文件中，我们将将其提取到单独的文件中以便其他组件也可以使用它。\n\
  \n我们需要再次 Moment.js，所以现在安装它：\n\n```\n$ npm install --save moment\n```\n\n然后创建文件 `src/time.js`\
  \ 并粘贴之前的 `Time` 组件。我们还需要在顶部添加 `import`，并在底部添加 `export`。\n\n```javascript\nimport\
  \ React from 'react';\nimport PropTypes from 'prop-types';\nimport moment from 'moment';\n\
  \nconst Time = ({ time }) => {\n  const timeString = moment(time).fromNow();\n \
  \ return (\n    <span className=\"time\">\n      {timeString}\n    </span>\n  );\n\
  };\nTime.propTypes = {\n  time: PropTypes.string.isRequired\n};\n\nexport default\
  \ Time;\n```\n\n\n\n\n\n由于我们导入的是自己的文件而不是 `node_modules` 中的内容，因此路径需要是相对路径（`./time`），而不是简单的模块名（`time`）。\n\
  \n然后，我们可以更新 `FileListItem`。注意 `Time` 不渲染 `<td>`，所以我们必须将其包裹在 `<td>` 中：\n\n```\nconst\
  \ FileListItem = ({ file }) => (\n  <tr className=\"file-list-item\">\n    {getFileName(file)}\n\
  \    <CommitMessage commit={file.latestCommit} />\n    <td className=\"age\">\n\
  \      <Time time={file.updated_at}/>\n    </td>\n  </tr>\n);\nFileListItem.propTypes\
  \ = {\n  file: PropTypes.object.isRequired\n};\n```\n\n添加一点点样式……\n\n```\n.age {\n\
  \  width: 125px;\n  text-align: right;\n  padding-right: 4px;\n}\n```\n\n它运行了！\n\
  \n![With Time](img/file24.png) \n\n但我必须说，这段代码看起来并不好看。我们用 3 种不同的方式渲染了 3 个组件，甚至为了为了规避\
  \ React 的限制而使用了奇异的 `getFileName`。如果组件看起来像这样会好得多：\n\n```\nconst FileListItem = ({\
  \ file }) => (\n  <tr className=\"file-list-item\">\n    <td><FileIcon file={file}\
  \ /></td>\n    <td><FileName file={file} /></td>\n    <td><CommitMessage commit={file.latestCommit}\
  \ /></td>\n    <td><Time time={file.updated_at} /></td>\n  </tr>\n);\nFileListItem.propTypes\
  \ = {\n  file: PropTypes.object.isRequired\n};\n```\n\n在此时，我本可以回去去修改示例，让代码看起来更好。但我把它留在这里是作为一个示例：有时候（也许是经常很多时候），代码写出来可能并不像你想象中那样干净。在你与某个决定共处一段时间之前，你可能无法完全意识到它的影响。\n\
  \n现实情况往往会产生干扰。你忘记了表格单元格必须是行的直接子元素，过度紧扣设计稿，从而导致你走上了一条产生糟糕代码的道路。\n\n但没有什么是永久的！现在是重构这段代码的完美时机（事实上，你将在练习中这样做）。\n\
  \n当你埋头苦干编写代码时……如果脑海中跳出这样一个念头：“等等！这些组件完全无法复用，因为每一个都包含一个表格单元格！”……好吧，听从你的。尽早重构，经常重构。\n\
  \n### 练习\n\n1. 重构 GitHub 文件列表示例，使所有组件都不返回表格单元格（`<td>`）。每个组件都应该返回 `<span>` 或 `<div>`。这使得它们更具可复用性，也应该极大改进\
  \ `FileList` 内部的代码。如有需要修改 CSS。\n\n2. 在实际应用中，大多数时候你希望每个文件只有一个组件。有时一个文件会包含几个相关的组件，当这些组件总是被一起使用时（如之前的\
  \ `Nav`/`NavItem` 示例），否则它们应该被分开。重构练习 1 中的代码，使用 `import` 和 `export` 将组件提取到单独的文件中。\n\
  \n3. 现在你知道如何使用 `Array` 的 `.map` 函数创建列表了。复用之前的 `Tweet` 组件并创建一个推文列表。\n\n列表无处不在。有人说，大多数\
  \ Web 应用基本上就是一组列表。实现来自网络各个网站的界面。遵循我们已经做过的几次流程——突出屏幕上哪些部分将成为组件，给它们命名，然后构建它们。\n\n\
  ### 4. Trello\n\n尝试渲染单个卡片列表。为了更多练习，并排渲染多个卡片列表。\n\n（截图来自 [`trello.com`](https://trello.com))\n\
  \n![Trello](img/file25.png) \n\n### 5. Hacker News\n\n实现故事列表。为了更多练习，也实现页眉。\n\n（截图来自\
  \ [`news.ycombinator.com/news`](https://news.ycombinator.com/news))\n\n![HN](img/file26.png)\
  \ \n\n### 6. Pinterest\n\n实现图片卡片列表。为了更多练习，也实现页眉（考虑之前的 `Nav` 和 `NavItem`）。\n\n![Pinterest](img/file27.png)\
  \ \n\n### 7. Internet\n\n你能想出一个很棒按钮大小的方法让它们变大吗？![Music](img/file28.png)\n\n# State（状态）\n\
  \n到目前为止，我们一直使用 *props* 将数据传递给组件。如果我们需要跟踪可以变化的数据呢？这就是 *state*（状态）登场的地方。为了看到状态有多用，让我们回顾之前的一个示例。这里有一个包含\
  \ `Child` 的 `Parent` 组件：\n\n```\nfunction handleAction(event) {\n  console.log('Child\
  \ says:', event);\n}\n\nfunction Parent() {\n  return (\n    <Child onAction={handleAction}/>\n\
  \  );\n}\n\nfunction Child({ onAction }) {\n  return (\n    <button onClick={onAction}>Click\
  \ Me!</button>\n  );\n}\n```\n\n但记住，函数组件是*无状态的*（stateless）。要让 `Parent` 拥有状态，它需要被转换为\
  \ ES6 `class` 组件。这是 `Parent` 的新版本，重命名为 `CountingParent`——确保更新 `ReactDOM.render`！\n\
  \n```\nclass CountingParent extends React.Component {\n  state = {\n    actionCount:\
  \ 0\n  }\n\n  handleAction = (action) => {\n    console.log('Child says', action);\n\
  \    // actionCount 增加了，\n    // 新计数替换了旧的计数\n    this.setState({\n      actionCount:\
  \ this.state.actionCount + 1\n    });\n  }\n\n  render() {\n    return (\n     \
  \ <div>\n        <Child onAction={this.handleAction}/>\n        <p>Clicked {this.state.actionCount}\
  \ times</p>\n      </div>\n    );\n  }\n}\n```\n\n行吧，也许增加一个数字并不是什么开创性的成就，但让我们看看发生了什么。\n\
  \n当组件首次实例化时，它的初始状态通过 `state = {...}` *属性初始化器*（property initializer）设置。虽然这种语法并非 ES6\
  \ 的一部分，但它被 Babel 和 Create React App 支持，并在 React 社区中广泛广泛。（另一种方法是在*构造函数*中设置初始状态，我们稍后会看到）。\n\
  \n接下来，你点击了按钮，就像它让你做的那样。按钮的 `onClick` 处理器程序被调用。在这种情况下，是 `onAction` prop，它最终调用了 `CountingParent`\
  \ 中的 `handleAction` 函数。`handleAction` 函数打印了一条消息，然后调用 `this.setState` 并传入一个描述新状态的对象。\n\
  \n\n\n\n\n`setState` 函数将更新状态，然后重新渲染组件及其所有的子组件。接下来会发生的情况是：`CountingParent` 的 `render`\
  \ 函数被调用，它会查看 `this.state.actionCount`，此时该值已经递增到了 1。或者是 2，如果你一直疯狂点击那个按钮，也可能是其他数字。\n\
  \n请注意，组件的每个实例都有自己的状态。如果你在页面上有两个 `CountingParent` 组件，它们将各自拥有一个从 0 开始并独立增加的计数器。你可以通过创建一个包含几个\
  \ `CountingParent` 的组件来自己证明这一点：\n\n```javascript\nconst Page = () => (\n  <div>\n\
  \    <CountingParent/>\n    <CountingParent/>\n    <CountingParent/>\n  </div>\n\
  );\n```\n\n确保更新 `ReactDOM.render` 调用，以渲染 `Page` 而不是 `CountingParent`。现在点击这些按钮，观察计数器如何独立地变化。\n\
  \n### 练习：重置按钮\n\n这是一个快速练习：在 `CountingParent` 中添加一个“重置（Reset）”按钮，点击它时会将计数器重置为 0。只需将\
  \ `button` 直接放在 `CountingParent` 内部即可。\n\n该功能运作后，重构你的代码，将“重置”按钮移动到 `Child` 中。\n\n\
  ## setState 是异步的\n\n我刚才骗了你了。抱歉。我暗示了 `setState` 函数会立即更新状态并调用 `render`。事实并非完全是这样。`setState`\
  \ 函数实际上是*异步的*。\n\n如果你调用了 `setState` 并立即执行 `console.log(this.state)`，它很可能会打印出旧状态，而不是你刚刚设置的那个。\n\
  \n如果你需要设置状态并立即对该更改进行操作，可以这样传递一个回调函数：\n\n```javascript\nthis.setState({name: 'Joe'},\
  \ function() {\n  // 在状态更新后\n  // 且组件重新渲染后调用\n});\n```\n\n### 函数式 setState\n\n另一种让连续的状态更新按顺序执行的方法是使用\
  \ `setState` 的*函数式*形式，如下所示：\n\n```javascript\nthis.setState((state, props) => {\n\
  \  return {\n    value: state.value + 1\n  }\n});\n```\n\n在这种形式下，你向 `setState` 传递一个函数。该函数接收当前状态和\
  \ props 作为参数，并预期返回预期的新状态。如果你连续运行几个这样的语句……\n\n```javascript\nthis.setState((state,\
  \ props) => {\n  return {\n    value: state.value + 1\n  }\n});\nthis.setState((state,\
  \ props) => {\n  return {\n    value: state.value + 1\n  }\n});\nthis.setState((state,\
  \ props) => {\n  return {\n    value: state.value + 1\n  }\n});\n```\n\n这将按照预期正常工作，最终将\
  \ `value` 增加 3。它之所以有效，是因为调用 `setState` 会按照它们调用的顺序“队列”更新，并且当它们执行时，它们接收的是最新的状态作为参数，而不是使用可能已经过时的\
  \ `this.state`。\n\n`setState` 函数式风格的一个额外好处处是，状态更新函数可以从类中提取并复用，因为它们是“纯”的——也就是说，它们只对其参数进行操作，不会修改参数，并返回一个新值。“纯”函数没有副作用，这意味着使用相同的参数多次调用它将始终返回相同的结果。\n\
  \n## 浅合并 vs 深度合并\n\n当你调用 `setState` 时，无论是使用对象调用还是使用函数形式调用，结果都是它会将你对象中的属性与当前状态进行*浅合并*。以下是其工作原理。\n\
  \n“浅合并”行为意味着如果你有这样的状态：\n\n```javascript\n{\n  score: 7,\n  user: {\n    name: \"\
  somebody\",\n    age: 26\n  },\n}\n```\n\n然后执行 `setState({ score: 8 })`，状态将变为：\n\
  \n```javascript\n{\n  score: 8,\n  user: {\n    name: \"somebody\",\n    age: 26\n\
  \  },\n}\n```\n\n如果你运行 `setState({ user: { age: 27 } })`，它会替换 `user` 对象：\n\n```javascript\n\
  {\n  score: 7,\n  user: {\n    age: 27\n  },\n}\n```\n\n## 状态中存什么\n\n你如何决定什么应该放入状态？还有其他地方可以存储持久数据吗？\n\
  \n作为一个通用规则，存储在状态中的数据应该在 `render` 某处被引用。组件状态用于存储*UI 状态*——即影响页面视觉渲染的内容。这是合理的，因为每当状态更新时，组件都会重新渲染。\n\
  \n如果修改某些数据不会在视觉上改变组件，那么这些数据就不应该放入*状态*中。以下是一些适合放入状态的内容：\n\n*   用户输入（文本框和其他表单字段的值）\n\
  *   当前或选中的项目（当前标签页、选中的行）\n*   来自服务器的数据（产品列表、页面上的“赞”数）\n*   开启/关闭状态（模态框打开/关闭、侧边栏展开/隐藏）\n\
  \n其他状态数据（如定时器的句柄）应该存储在组件实例本身。在类组件中你有一个可用的 `this` 对象，尽管使用它吧！\n\n\n\n\n适应 React 涉及到改变你解决特定问题的方式。这让我想起在马路另一侧驾驶的经历。\n\
  \n我第一次经历这种事是在访问特克斯和凯科斯群岛时。那里的车辆是左侧行驶的。我来自习惯右侧行驶的美国，这需要一点点“大脑重编程”。在离开机场时，我差点丢了命。\n\
  \n有趣的是，即使我已经学会了在普通的平坦直路上向左侧行驶，但每当出现不同的情况时，我的大脑就会回到旧习惯。\n\n转入停车场？习惯接管了主导，我开进了错误的车道。在停止标志处左转？同样的问题。在停止标志处向`right`转？你可能会认为我现在应该学会了——但并没有，对我的大脑来说，那感觉有些不同。\n\
  \n我讲这个故事是因为我在学习 React 时也有过类似的经历，我想很多其他人也是如此。\n\n向组件传递 props（就像该组件是一个函数一样）是合逻辑——我们的大脑已经习惯了。它看起来和运行起来都像\
  \ HTML 一样。\n\n将数据*向下*传递和将事件*向上*传递的想法对于简单的情况来说很快也能被理解。这是在其他地方常用的“回调”模式，所以并不那么陌生。向按钮传递一个\
  \ `onClick` 处理器是非常正常的。\n\n但当需要打开模态对话框时会发生什么？或者在角落显示一个 Growl 样式的通知？或者响应事件对图标进行动画？你可能会发现（正如我发现一样），这些命令式的、“基于事件的”事物在\
  \ React 的声明式世界中并不是得自然而然的。\n\n### 如何培养“声明式”思维\n\n如果你来自 jQuery 或 Angular 或任何其他通过调用函数来让事情发生的框架（“命令式编程”），你需要调整你的心理模型，以便有效地与\
  \ React 协作。通过练习，你会很快就适应的——你只需要几个新的示例或“模式”供你的大脑汲取素材。\n\n这里有几个。\n\n#### 展开/折叠手风琴（Accordion）控件\n\
  \n**旧方法**：点击切换按钮通过调用其 `toggle` 函数来打开或关闭手风琴。`Accordion` 知道自己是处于打开还是关闭状态。\n\n**声明式方法**：`Accordion`\
  \ 要么处于“打开”状态，要么处于“关闭”状态，我们将该信息存储在父组件状态中的一个标记里（*而不是*在 `Accordion` 内部）。我们通过传递 `isOpen`\
  \ 作为 prop 来告诉 `Accordion` 渲染方向。当 `isOpen` 为 `true` 时，它渲染为打开。当 `isOpen` 为 `false`\
  \ 时，它渲染为关闭。\n\n```javascript\n<Accordion isOpen={true}/>\n<Accordion isOpen={false}/>\n\
  ```\n\n这个例子非常简单。希望不要太烧脑。最大的变化是，在声明式的 React 方式中，展开/折叠状态存储在 `Accordion` *外部*，并作为 prop\
  \ 传入。\n\n#### 打开和关闭对话框\n\n**旧方法**：点击按钮打开模态。点击它的关闭按钮关闭它。\n\n**声明式方法**：`Modal` 是否打开*是一个状态*。它要么处于“打开”状态，要么处于“关闭”状态。所以，如果它是“打开”，我们就渲染\
  \ `Modal`。如果它是“关闭”，我们就不渲染模态。此外，我们可以向 `Modal` 传递一个 `onClose` 回调——这样，*父组件*就可以决定当用户点击关闭时会发生什么。\n\
  \n```javascript\n<div>\n  {this.state.isModalOpen &&\n    <Modal onClose={this.handleClose}/>}\n\
  </div>\n```\n\n#### 通知\n\n**旧方法**：当发生事件（如错误）时，调用通知库显示弹出框，如 `toastr.error(\"Oh no!\"\
  )`。\n\n**声明式方法**：将通知视为状态。通知可以有 0 个、1 个或 2 个……将这些存储存在一个数组中。在应用根节点附近的地方放置一个 `NotificationTray`\
  \ 组件，并向它传递要显示的消息。你可以在根组件的状态中管理消息数组，并向需要它的组件传递一个 `addNotification` prop。\n\n####\
  \ 为变化添加动画\n\n假设你有一个带有计数器的徽章，显示登录用户数量。它从 prop 获取这个数字。如果你想让徽章在数字变化时执行动画怎么办？\n\n**旧方法**：你可能会使用\
  \ jQuery 来切换一个播放动画的类，或者使用 jQuery 直接对元素执行动画。\n\n**声明式方法**：你可以通过实现 `componentWillReceiveProps`\
  \ *生命周期方法* 并比较新旧值来对 prop 的变化做出响应（你将在第 14 章中学习更多生命周期方法）。如果发生了变化，你可以将“正在动画”状态设置为 `true`。然后在\
  \ `render` 中，当“正在动画”为 `true` 时，添加执行动画的 CSS 类。当“正在动画”为 `false` 时，不添加该类。它可能像这样：\n\n\
  ```javascript\nclass Badge extends Component {\n  componentWillReceiveProps(nextProps)\
  \ {\n    if(this.props.counter !== nextProps.counter) {\n      // 现在将 animating\
  \ 设置为 true。\n      // 当状态完成后，设置一个定时器\n      // 在 200ms 后关闭。\n      this.setState({\
  \ animating: true }, () => {\n        setTimeout(() => {\n          this.setState({\
  \ animating: false });\n        }, 200);\n      });\n    }\n  }\n  render() {\n\
  \    const animatingClass = this.state.animating ? 'animating' : '';\n    return\
  \ (\n      <div className={`badge ${animatingClass}`}>\n        {this.props.counter}\n\
  \      </div>\n    );\n  }\n}\n```\n\n我只是想提醒你，这种代码方式起初可能会很奇怪，这很正常。你会发现自己在思考如何用声明式的方法实现那些命令式的模式，这需要一些时间来学习。但别担心——做几次之后就会变得非常清晰。\n\
  \n## 状态存储位置\n\n只要可能，最好保持组件是无状态的（stateless）。有时这不可能，但很多时候你认为应该放入内部状态的数据实际上可以提取到父组件，甚至更高处。\n\
  \n考虑页面上一个可以显示或隐藏的部分，比如像这样的侧边栏：\n\n![UI with a sidebar](img/file29.png)\n\n当你点击“隐藏”按钮时，侧边栏应该消失，这意味着将\
  \ `showSidebar` 标记设置为 `false`。这个标记应该存储在地方的状态中。但是在哪里？\n\n选项 1，`showSidebar` 标记可以位于\
  \ `Sidebar` 组件中。这样 `Sidebar` 就“知道”自己是否是打开的。这与*受控输入*的工作原理类似，我们将在下一章看到。\n\n选项 2，`showSidebar`\
  \ 标记可以放在父组件 `Layout` 中，父组件可以决定是否渲染 Sidebar：\n\n\n\n\n\n```javascript\nclass Layout\
  \ extends React.Component {\n  state = {\n    showSidebar: false\n  }\n\n  toggleSidebar\
  \ = () => {\n    this.setState({\n      showSidebar: !this.state.showSidebar\n \
  \   });\n  }\n\n  render() {\n    const { showSidebar } = this.state;\n    return\
  \ (\n      <div className=\"layout\">\n        {showSidebar &&\n          <Sidebar\n\
  \            onHide={this.toggleSidebar}>\n            some sidebar content\n  \
  \        </Sidebar>}\n        <Content\n          isSidebarVisible={showSidebar}\n\
  \          onShowSidebar={this.toggleSidebar}>\n          some content here\n  \
  \      </Content>\n      </div>\n    );\n  }\n}\n\nconst Content = ({\n  children,\n\
  \  isSidebarVisible,\n  onShowSidebar\n}) => (\n  <div className=\"content\">\n\
  \    {children}\n    {!isSidebarVisible && (\n      <button onClick={onShowSidebar}>\n\
  \        Show\n      </button>\n    )}\n  </div>\n));\n\nconst Sidebar = ({\n  onHide,\n\
  \  children\n}) => (\n  <div className=\"sidebar\">\n    {children}\n    <button\
  \ onClick={onHide}>\n      Hide\n    </button>\n  </div>\n));\n```\n\n通过这种方式，`Sidebar`\
  \ 内部并不“知道”自己是否可见。它要么被渲染，要么不被渲染。\n\n将状态保留在父组件中可能会感觉并不自然。乍看之下，这似乎会使 `Sidebar` 难以复用，因为你需要传递一个\
  \ `Sidebar` 在需要隐藏时可以调用的回调函数。\n\n相反，包含状态的组件越少，意味着当出现 bug 时需要查找的地方就越少。如果你需要对该状态进行任何操作（例如将其保存到\
  \ `localStorage` 以跨页面刷新持久），该逻辑只需要存在于一个组件实例中。\n\n浏览器自带 `localStorage`，你可以用它在会话之间保存数据。关闭并重新打开或刷新页面不会清除数据。你可以使用\
  \ `localStorage.setItem('showSidebar', true)` 保存 Sidebar 状态，稍后通过 `localStorage.getItem('showSidebar')`\
  \ 获取。\n\n你可以看到，如果 `Sidebar` 组件知道如何将自己的状态保存到 `localStorage`，并且应用中有多个 `Sidebar`，那么它们需要一种区分自己的方法。`localStorage`\
  \ 中单个 `showSidebar` 键会导致冲突，而 Sidebars 并不知道自己位于应用的哪个位置。\n\n也许父组件可以负责向每个 `Sidebar`\
  \ 传递一个唯一的“id”或“location”。然而，这将把“保存到哪里”的关注点分摊给父组件和 `Sidebar`。这导致了有*两个*组件需要知道保存操作，而不是一个。一个更好的设计是将所有与保存相关的逻辑都保留在一个地方，如果状态与逻辑保存在一起，那么这样做会更容易实现。\n\
  \n## 组件的“种类”\n\n在架构设计上，你可以将组件分为两类：*表示型*（Presentational，又称“哑巴”组件）和*容器型*（Container，又称“智能”组件）。\n\
  \n*表示型*组件是无状态的。它们只是简单地接收 props 并根据它们进行渲染。理想情况下，它们是纯函数，使得它们更容易测试。*容器型*组件是有状态的。它们维护状态并将回调传递给子组件。\n\
  \n## Inputs\n\n现在，可能你的第一反应是对于一个简单的输入来说，这些代码太多了。你没说错，但这种方法确实提供了强大的功能。输入有两种类型：*受控*（controlled）和*非受控*（uncontrolled）。\n\
  \n它们之所以被称为“受控的”，是因为你负责控制它们的值。在下面的示例中，我们有一个受控输入：\n\n```javascript\nclass ControlledInput\
  \ extends React.Component {\n  state = {\n    text: ''\n  }\n\n  handleChange =\
  \ (event) => {\n    this.setState({\n      text: event.target.value\n    });\n \
  \ }\n\n  render() {\n    return (\n      <input type=\"text\"\n        value={this.state.text}\n\
  \        onChange={this.handleChange} />\n    );\n  }\n}\n```\n\n它的工作原理是：在上面的示例中，尝试删除或注释掉对\
  \ `this.setState` 的调用，然后尝试在框中输入。什么都不会发生，因为值卡在了初始值上。然后，尝试更改 `this.setState` 以忽略事件数据，而是始终将文本设置为相同的值，如下所示：\n\
  \n```javascript\nclass TrickInput extends React.Component {\n  state = {\n    text:\
  \ 'try typing something'\n  }\n\n  handleChange = (event) => {\n    this.setState({\n\
  \      text: 'haha nope'\n    });\n  }\n\n  render() {\n    return (\n      <input\
  \ type=\"text\"\n        value={this.state.text}\n        onChange={this.handleChange}\
  \ />\n    );\n  }\n}\n```\n\n你会发现输入框阻止了你修改它的尝试，甚至嘲讽了你。\n\n不过，这非常强大。如果你想进行某种自定义验证或格式化，可以在\
  \ `handleChange` 函数中完成。不想让用户输入数字？在更新状态之前剔除数字即可：\n\n\n\n\n\n```javascript\nclass\
  \ NoNumbersInput extends React.Component {\n}\n```\n\n```javascript\nclass NoNumbersInput\
  \ extends React.Component {\n  // ...\n\n  handleChange = (event) => {\n    let\
  \ text = event.target.value;\n    text = text.replace(/[0-9]/g, '');\n    this.setState({\
  \ text });\n  };\n\n  // ...\n}\n```\n\n顺便提一下——`this.setState({ text })` 这种语法只是\
  \ `this.setState({ text: text })` 的 ES6 简写。在 ES6 中，如果键与变量名相同，你就不需要写两次。\n\n尝试在框中输入一些数字。尝试粘贴一个包含数字的字符串。完美！没有闪烁或出现任何异常行为。\n\
  \n你可以将输入格式化为电话号码、信用卡号，或者根据光标位置进行更改。正如我所说，它非常强大。\n\n但也许你并不关心这些。你只是想让输入框管理自己的状态。非控输入（Uncontrolled\
  \ inputs）可以做到这一点，但有几点注意事项。\n\n## 非控输入\n\n当一个输入是“非控”的（`uncontrolled`）时，它会管理自己的内部状态。因此，你可以这样在页面上放置一个\
  \ `input`（不带 `value` 属性）：\n\n```javascript\nconst EasyInput = () => (\n  <input\
  \ type=\"text\" />\n);\n```\n\n在里面输入内容，随心所欲即可。它运行正常。如果你想从中获取值，可以传递一个 `onChange`\
  \ 属性并响应事件。这样做的问题是，你无法随心所欲地提取值。你仍然需要监听变化，并在某处跟踪“最新值”。\n\n非控输入可以赋予一个 `defaultValue`\
  \ 属性，组件将使用该值进行初始化。但在该初始渲染之后，如果你想更改值，就需要使用受控输入（controlled input）。\n\n## 组件生命周期\n\n\
  每个 React 组件在屏幕上渲染时都会经历一个生命周期（lifecycle）。这里有一系列方法按照特定的顺序被调用。其中一些只运行一次，而另一些则运行多次。\n\
  \n对于你构建的大多数组件，可能不需要接入生命周期方法。当你需要它们时，它们确实有用。无论你需要通过 AJAX 请求获取数据、向 DOM 插入自己的节点，还是设置定时器，生命周期方法都是执行这些操作的地方。\n\
  \n这是组件的完整生命周期：\n\n![Lifecycle Methods](img/file30.png)\n\n### 使用\n\n接入生命周期钩子非常简单，只需向你的组件类添加相应的函数即可。生命周期方法适用于\
  \ `class` 组件，而不适用于函数组件。\n\n这是一个使用了所有生命周期方法的示例。运行它，点击按钮，并观察控制台查看它们调用的顺序。\n\n```javascript\n\
  import React from 'react';\nimport ReactDOM from 'react-dom';\n\nclass LifecycleDemo\
  \ extends React.Component {\n  state = {counter: 0};\n\n  constructor(props) {\n\
  \    super(props);\n    console.log('Constructing...');\n    console.log('State\
  \ already set to:', this.state);\n  }\n\n  componentWillMount() {\n    console.log('About\
  \ to mount...');\n  }\n\n  componentDidMount() {\n    console.log('Mounted.');\n\
  \  }\n\n  componentWillReceiveProps(nextProps) {\n    console.log('Current props:',\
  \ this.props);\n    console.log('Next props:', nextProps);\n  }\n\n  shouldComponentUpdate(nextProps,\
  \ nextState) {\n    console.log('Deciding to update');\n    return true;\n  }\n\n\
  \  componentWillUpdate(nextProps, nextState) {\n    console.log('About to update...');\n\
  \  }\n\n  componentDidUpdate() {\n    console.log('Updated.');\n  }\n\n  componentWillUnmount()\
  \ {\n    console.log('Goodbye');\n  }\n\n  handleClick = () => {\n    this.setState({\n\
  \      counter: this.state.counter + 1\n    });\n  }\n\n  render() {\n    console.log('Rendering...');\n\
  \    return (\n      <div>\n        <span>Counter: {this.state.counter}</span>\n\
  \        <button onClick={this.handleClick}>Increment</button>\n      </div>\n \
  \   );\n  }\n}\n\nReactDOM.render(<LifecycleDemo/>, document.querySelector('#root'));\n\
  ```\n\n### 挂载 (Mounting)\n\n这些方法在组件挂载时被调用一次。\n\n-   **constructor**: 这是当组件创建时第一个被调用的方法。`state`\
  \ 使用以下内容初始化……\n-   **componentWillMount**: 在组件挂载之前立即调用。\n-   **componentDidMount**:\
  \ 在首次渲染后调用。这是执行任何所需请求的好地方。\n\n### 更新 (Updating)\n\n这些方法会在每次渲染之前和之后按顺序调用。\n\n-  \
  \ **componentWillReceiveProps(nextProps)**: 传入了将接收的 `nextProps`。旧的 props 仍然可以通过\
  \ `this.props` 获取，必要时你可以调用 `this.setState`。\n-   **shouldComponentUpdate(nextProps,\
  \ nextState)**: 如果你知道 props 和 state 没有变化，这是一个防止渲染的机会。默认实现返回 `true`。如果你返回 `false`，则不会发生渲染（子组件也不会渲染），并且剩余的生命周期方法将被跳过。\n\
  -   **componentWillUpdate(nextProps, nextState)**: 在此阶段，渲染已成定局。用它在调用 `render` 之前进行任何准备工作。你**不能**在该方法内部调用\
  \ `this.setState`。\n-   **render**: 你对这个很熟悉了。它位于生命周期中 `componentWillUpdate` 和 `componentDidUpdate`\
  \ 之间的位置。\n-   **componentDidUpdate**: 渲染完成。如果需要，你可以利用这个机会操作 DOM。在此之前，DOM 节点可能仍在变动中。\n\
  \n### 卸载 (Unmounting)\n\n-   **componentWillUnmount**: 组件即将卸载。也许它的项目已从列表中移除，也许用户导航到了另一个标签页……无论如何，这个组件的时间已经数不多多了。你应该失效创建的任何定时器（使用\
  \ `clearInterval()` 或 `clearTimeout()`），禁用事件处理器（使用 `removeEventListener()`），并执行任何其他必要的清理工作。\n\
  \n\n\n\n\n你会发现这两个页面非常相似。与之前的示例相比，这个示例的组件粒度较较粗。组件将具有更大的 `render` 函数，并且其中包含了更多的“内容”。你以后可以随时进行拆分，有时在早期避免将代码抽象成极微小的片段反而更好。\n\
  \n以下是我们要构建的组件：\n\n*   App\n    *   ItemPage\n    *   CartPage\n    *   Item\n  \
  \  *   Nav\n\n## 开始构建\n\n我们将从创建一个新项目开始：\n\n```bash\n$ create-react-app shopper &&\
  \ cd shopper\n```\n\n打开 `src/App.js` 并将其内容替换为以下代码以开始：\n\n```javascript\nimport React\
  \ from 'react';\nimport Nav from './Nav';\nimport './App.css';\n\nclass App extends\
  \ React.Component {\n  renderContent() {\n    return (\n      <span>Empty</span>\n\
  \    );\n  }\n\n  render() {\n    return (\n      <div className=\"App\">\n    \
  \    <Nav/>\n        <main className=\"App-content\">\n          {this.renderContent()}\n\
  \        </main>\n      </div>\n    );\n  }\n}\n\nexport default App;\n```\n\n然后创建\
  \ `src/Nav.js` 并用以下代码开头：\n\n```javascript\nimport React from 'react';\n\nconst Nav\
  \ = () => (\n  <nav className=\"App-nav\">\n    <ul>\n      <li className=\"App-nav-item\"\
  ><a>Items</a></li>\n      <li className=\"App-nav-item\"><a>Cart</a></li>\n    </ul>\n\
  \  </nav>\n);\n\nexport default Nav;\n```\n\n启动应用并查看目前的情况：\n\n```bash\n$ npm start\n\
  ```\n\n![没有样式，看起来很糟糕](img/file35.png)\n\n它可以运行了，但需要进行样式化。打开 `src/App.css`，并将内容替换为以下内容：\n\
  \n```css\n.App {\n  max-width: 800px;\n  margin: 0 auto;\n}\n.App-nav {\n  margin:\
  \ 20px;\n  padding: 10px;\n  border-bottom: 2px solid #508FCA;\n}\n.App-nav ul {\n\
  \  padding: 0;\n  margin: 0;\n}\n.App-nav-item {\n  list-style: none;\n  display:\
  \ inline-block;\n  margin-right: 32px;\n  font-size: 24px;\n  border-bottom: 4px\
  \ solid transparent;\n}\n.App-content {\n  margin: 0 20px;\n}\n```\n\n现在好了一点：\n\n\
  ![更好了](img/file36.png)\n\n接下来，我们需要跟踪活跃的标签（tab），并决定渲染 `ItemPage` 还是 `CartPage`。为了做到这一点，我们将活跃的标签存储在\
  \ `state` 中，并让 `Nav` 触发状态更改。`App` 组件是存储此状态的最佳位置，因为 `App` 需要它来确定应该渲染哪个页面。在顶部初始化 `state`，并添加一个选择标签的函数：\n\
  \n```javascript\nclass App extends Component {\n  state = {\n    activeTab: 0\n\
  \  };\n  handleTabChange = (index) => {\n    this.setState({\n      activeTab: index\n\
  \    });\n  }\n  // ...\n}\n```\n\n现在，我们需要将 `handleTabChange` 函数传递给 `Nav`，并连同 `activeTab`\
  \ 一起它可以正确渲染。我们还将更新 `renderContent` 来显示活跃的页面：\n\n```javascript\nclass App extends\
  \ Component {\n  // ...\n  renderContent() {\n    switch(this.state.activeTab) {\n\
  \      default:\n      case 0: return <span>Items</span>\n      case 1: return <span>Cart</span>\n\
  \    }\n  }\n  render() {\n    let {activeTab} = this.state;\n    return (\n   \
  \   <div className=\"App\">\n        <Nav activeTab={activeTab} onTabChange={this.handleTabChange}\
  \ />\n        <main className=\"App-content\">\n          {this.renderContent()}\n\
  \        </main>\n      </div>\n    );\n  }\n}\n```\n\n更新 `src/Nav.js` 中的 `Nav`\
  \ 组件以使用新的 props：\n\n```javascript\nconst Nav = ({ activeTab, onTabChange }) => (\n\
  \  <nav className=\"App-nav\">\n    <ul>\n      <li className={`App-nav-item ${activeTab\
  \ === 0 && 'selected'}`}>\n        <a onClick={() => onTabChange(0)}>Items</a>\n\
  \      </li>\n      <li className={`App-nav-item ${activeTab === 1 && 'selected'}`}>\n\
  \        <a onClick={() => onTabChange(1)}>Cart</a>\n      </li>\n    </ul>\n  </nav>\n\
  );\n```\n\n然后向 `src/App.css` 底部添加一些样式：\n\n```css\n.App-nav-item a {\n  cursor: pointer;\n\
  }\n.App-nav-item a:hover {\n  color: #999;\n}\n.App-nav-item.selected {\n  border-bottom-color:\
  \ #FFAA3F;\n}\n```\n\n现在它应该是这样的：\n\n![Cart 标签被选中](img/file37.png)\n\n### 箭头函数 onClick\n\
  \n你会注意到我们在 `onClick` 中传递了一个箭头函数。初看之下这可能很奇怪。你可能会认为 `onClick={onTabChange(0)}` 看起来更好。\n\
  \n但请记住，props 在传递之前就会被求值了。如果没有箭头函数，`onTabChange` 将在 Nav 渲染时*被调用*，而不是在点击链接时调用。这不是我们想要的。将其封装在箭头函数中可以延迟执行到用户点击链接。\n\
  \n### 在 Render 中创建函数：不好？\n\n关于此的另一点：像上面的代码那样向 props 传递新函数通常不是好主意，但理解为什么可以让你在合适的地方应用这一规则。\n\
  \n创建新函数之所以不好是因为性能：不是因为函数本身昂贵，而是每次渲染时向下传递新函数意味着它始终会看到“新的” props，从而导致不必要的渲染。在以下情况下避免在\
  \ render 中创建新函数：(a) 接收 prop 的组件是纯的 (b) 你预期父组件会渲染。函数组件和扩展 `Component` 的类不是纯的。它们总是会渲染。然而，如果类扩展了\
  \ `PureComponent`，它是纯的，并在 props 未更改时会跳过渲染。避免不必要的渲染是提高 React 应用最简单的方法。上面的 `Nav` 组件可能不会频繁渲染，但为了演示，你如何去掉箭头函数呢？这里有一种实现方法：\n\
  \n```javascript\nconst Nav = ({ activeTab, onTabChange }) => (\n  <nav className=\"\
  App-nav\">\n    <ul>\n      <li className={`App-nav-item ${activeTab === 0 && 'selected'}`}>\n\
  \        <NavLink index={0} onClick={onTabChange}>Items</NavLink>\n      </li>\n\
  \      <li className={`App-nav-item ${activeTab === 1 && 'selected'}`}>\n      \
  \  <NavLink index={1} onClick={onTabChange}>Cart</NavLink>\n      </li>\n    </ul>\n\
  \  </nav>\n);\n\nclass NavLink extends React.Component {\n  handleClick = () =>\
  \ {\n    this.props.onClick(this.props.index);\n  }\n\n  render() {\n    return\
  \ (\n      <a onClick={this.handleClick}>\n        {this.props.children}\n     \
  \ </a>\n    );\n  }\n}\n```\n\n\n\n\n在这里，`handleClick` 函数只会在组件首次渲染时被创建`一次`。这解决了问题（`render`\
  \ 不再创建函数），但代价是代码变得更复杂了（需要一个完全全新的组件！）。这是一种权衡，当你在自己的项目中遇到这个问题时，它是值得考虑的。\n\n## 创建 ItemPage\n\
  \n让我们关注一下待售商品列表。我们将创建一个新组件来显示这些数据。创建一个名为 `ItemPage.js` 的文件并输入以下内容：\n\n```javascript\n\
  import React from 'react';\nimport PropTypes from 'prop-types';\nimport './ItemPage.css';\n\
  \nfunction ItemPage({ items }) {\n  return (\n    <ul className=\"ItemPage-items\"\
  >\n      {items.map(item =>\n        <li key={item.id} className=\"ItemPage-item\"\
  >\n          {item.name}\n        </li>\n      )}\n    </ul>\n  );\n}\nItemPage.propTypes\
  \ = {\n  items: PropTypes.array.isRequired\n};\n\nexport default ItemPage;\n```\n\
  \n这里没什么新奇的：我们只是在遍历项目列表并渲染它们。由于单个项目的内容将比仅仅一个“名称”更复杂，我们稍后会将它提取到自己的组件中。\n\n此组件依赖于 `ItemPage.css`，而它还不存在。创建该文件并添加以下\
  \ CSS 来样式化列表：\n\n```css\n.ItemPage-items {\n  margin: 0;\n  padding: 0;\n}\n.ItemPage-items\
  \ li {\n  list-style: none;\n  margin-bottom: 20px;\n}\n```\n\n我们需要一些待售的商品。我们将像以前一样在这里使用静态数据。\n\
  \n即使我有可以返回真实数据的服务器，我也喜欢从静态数据开始。当没有变动部件时，你可以很快地从`无`变为`有`。诚实地说，当屏幕上有我可以调整的东西时，这更有`趣`。\n\
  \n创建一个名为 `static-data.js` 的文件（在 `src` 目录下）并粘贴这段代码。\n\n```javascript\nlet items =\
  \ [\n  {\n    id: 0,\n    name: \"Apple iPad Mini 2 16GB\",\n    description: \"\
  与众不同的的 iPad。16GB, WiFi, 4G。\",\n    price: 229.00\n  },\n  {\n    id: 1,\n    name:\
  \ \"Apple iPad Mini 2 32GB\",\n    description: \"比 16GB 的更大。\",\n    price: 279.00\n\
  \  },\n  {\n    id: 2,\n    name: \"Canon T7i\",\n    description: \"具有许多兆像素的单反相机。\"\
  ,\n    price: 749.99\n  },\n  {\n    id: 3,\n    name: \"Apple Watch Sport\",\n\
  \    description: \"一只手表\",\n    price: 249.99\n  },\n  {\n    id: 4,\n    name:\
  \ \"Apple Watch Silver\",\n    description: \"另一只手表\",\n    price: 599.99\n  }\n\
  ];\nexport {items};\n```\n\n然后，我们将这些项目传递给新的 `ItemPage` 组件。回到 `App.js`，导入 `ItemPage`\
  \ 和静态的 `items` 数据。\n\n```javascript\nimport ItemPage from './ItemPage';\nimport\
  \ {items} from './static-data';\n```\n\n然后更新 `renderContent` 函数以使用新的 `ItemPage`：\n\
  \n```javascript\nclass App extends Component {\n  // ...\n  renderContent() {\n\
  \    switch(this.state.activeTab) {\n      default:\n      case 0: return <ItemPage\
  \ items={items}/>\n      case 1: return <span>购物车</span>;\n    }\n  }\n  // ...\n\
  }\n```\n\n现在，你应该能看到一些项目正在渲染了！![项目正在渲染](img/file38.png)\n\n## 创建 Item\n\n现在让我们创建真正的\
  \ `Item` 组件以供 `ItemList` 使用。它将接收一个 `item` 属性，我们还希望能够将其添加到购物车，所以它也应该接收一个 `onAddToCart`\
  \ 属性。\n\n此组件将是无状态的。它的职责是显示项目，并在点击“加入购物车”按钮时通知父组件。\n\n通过从 GitHub 的示例学习，我们不会从此组件中返回一个\
  \ `li`。我们不希望强制使用 `Item` 的用户将其放在 `<ul>` 内部。父组件可以根据需要将此项目放入 `<li>` 中。\n\n考虑到这一点，创建\
  \ `src/Item.js` 和 `src/Item.css`。在 `Item.js` 中，编写组件：\n\n```javascript\nimport React\
  \ from 'react';\nimport PropTypes from 'prop-types';\nimport './Item.css';\n\nconst\
  \ Item = ({ item, onAddToCart }) => (\n  <div className=\"Item\">\n    <div className=\"\
  Item-left\">\n      <div className=\"Item-image\" />\n      <div className=\"Item-title\"\
  >\n        {item.name}\n      </div>\n      <div className=\"Item-description\"\
  >\n        {item.description}\n      </div>\n    </div>\n    <div className=\"Item-right\"\
  >\n      <div className=\"Item-price\">\n        ${item.price}\n      </div>\n \
  \     <button\n        className=\"Item-addToCart\"\n        onClick={onAddToCart}\n\
  \      >\n        加入购物车\n      </button>\n    </div>\n  </div>\n);\nItem.propTypes\
  \ = {\n  item: PropTypes.object.isRequired,\n  onAddToCart: PropTypes.func.isRequired\n\
  };\n\nexport default Item;\n```\n\n现在让我们将其连接到 `ItemPage` 组件。在 `ItemPage.js` 中，将代码更新为如下：\n\
  \n```javascript\nimport React from 'react';\nimport PropTypes from 'prop-types';\n\
  import Item from './Item';\nimport './ItemPage.css';\n\nfunction ItemPage({ items,\
  \ onAddToCart }) {\n  return (\n    <ul className=\"ItemPage-items\">\n      {items.map(item\
  \ =>\n        <li key={item.id} className=\"ItemPage-item\">\n          <Item\n\
  \            item={item}\n            onAddToCart={() => onAddToCart(item)} />\n\
  \        </li>\n      )}\n    </ul>\n  );\n}\nItemPage.propTypes = {\n  items: PropTypes.array.isRequired,\n\
  \  onAddToCart: PropTypes.func.isRequired\n};\n\nexport default ItemPage;\n```\n\
  \n我们正在导入 `Item`，然后在 `<li>` 内部，我们现在渲染 `Item` 组件而不仅仅是项目名称。新增的是 `onAddToCart` 属性及其相关的\
  \ propType。\n\n此时，代码将无法工作，并且会出现一个关于缺少 `onAddToCart` 属性的警告。\n\n为了完成属性传递的链，我们需要在 `App`\
  \ 组件内部为 `ItemPage` 的 `onAddToCart` 属性传递某些内容。顺便说，我们可能真的会将项目添加到购物车！这需要在 `state` 中增加一个新的\
  \ `cart` 属性。\n\n让我们过一遍。首先，在 `App.js` 中，在初始状态中添加 `cart` 属性，并将其初始化为空数组：\n\n```javascript\n\
  class App extends Component {\n  state = {\n    activeTab: 0,\n    cart: []\n  }\n\
  \n  // ...\n}\n```\n\n然后更新 `renderContent` 以传递一个函数作为 `onAddToCart` 属性：\n\n\n\n\n\
  \n```javascript\nclass App extends Component {\n  // ...\n\n  renderContent() {\n\
  \    switch(this.state.activeTab) {\n      default:\n      case 0:\n        return\
  \ (\n          <ItemPage\n            items={items}\n            onAddToCart={this.handleAddToCart}\
  \ />\n        );\n      case 1:\n        return <span>Cart</span>;\n    }\n  }\n\
  \n  // ...\n}\n```\n\n函数 `this.handleAddToCart` 还没有存在，所以接下来创建它。它将接受一个项目，并将该项目添加到购物车：\n\
  \n```javascript\nclass App extends Component {\n  // ...\n\n  handleAddToCart =\
  \ (item) => {\n    this.setState({\n      cart: [...this.state.cart, item.id]\n\
  \    });\n  }\n\n  // ...\n}\n```\n\n这段代码的作用是将 `cart` 状态设置为当前购物车的副本，并加上一个新项目。\n\n\
  这里有一些新的 ES6 语法：`...this.state.cart` 是 `spread`（展开）运算符，它会将给定的数组展开为它的各个项目。以下是展开运算符的示例：\n\
  \n```javascript\n// 使用数组：\nvar a = [1, 2, 3];\nvar b = [a, 4];    // => [[1, 2,\
  \ 3], 4]\nvar c = [...a, 4]; // => [1, 2, 3, 4]\n\n// 使用对象（技术上不是 ES6）\nvar o1 =\
  \ {a: 1, b: 2};\nvar o2 = {...o1, c: 3}; // => {a: 1, b: 2, c: 3}\n```\n\n注意，数组的展开运算符正式是\
  \ ES6 的一部分，但对象的展开运算符不是。然而，`babel` 支持对象展开，而 Create React App 正在底层使用它将我们的代码转换为浏览器兼容的\
  \ ES5。\n\n###不可变的方式更新状态\n\n你可能会想……为什么不直接修改状态然后调用 `setState` 呢，像这样：\n\n```javascript\n\
  this.state.cart.push(item.id);\nthis.setState({cart: this.state.cart});\n```\n\n\
  这是一个糟糕的主意，原因有两个（尽管在上面的示例中它可以运行）。\n\n你**绝不要**直接修改（“变异”）状态或其子属性。不要执行 `this.state.something\
  \ = x`，也不要 `this.state = x`。React 依赖于你想要更改时调用 `this.setState`，这样它就会知道发生了变化并触发重新渲染。如果你绕过了\
  \ `setState`，UI 将与数据不同步。\n\n直接变异状态会导致诡异的 bug，以及难以优化的组件。\n\n这是一个示例。记住，优化 React 组件的常用方法之一是使其变成“纯”的，这意味着它只在\
  \ props 改变时才重新渲染。这可以通过扩展 `React.PureComponent` 而不是 `React.Component` 来自动实现，也可以通过手动实现\
  \ `shouldComponentUpdate` 生命周期方法来比较 `nextProps` 和当前的 props。如果 props 看起来是相同的，它将跳过渲染并节省一些时间。\n\
  \n这是一个渲染项目列表的简单组件。注意它扩展了 `React.PureComponent`：\n\n（如果你有示例代码，这段代码位于“impure-state”文件夹下。）\n\
  \n```javascript\nclass ItemList extends React.PureComponent {\n  static propTypes\
  \ = {\n    items: PropTypes.array.isRequired\n  }\n\n  render() {\n    return (\n\
  \      <ul>\n        {this.props.items.map(item =>\n          <li key={item.id}>{item.value}</li>\n\
  \        )}\n      </ul>\n    );\n  }\n}\n```\n\n现在，这里有一个小型应用程序，它渲染 `ItemList` 并允许你以变异或不可变的方式向列表添加项目：\n\
  \n```javascript\nclass App extends Component {\n  // 将 items 初始化为空数组\n  state =\
  \ {\n    items: []\n  }\n\n  // 初始化一个计数器\n  // 为每个 item ID 递增\n  nextItemId = 0;\n\
  \n  makeItem() {\n    // 创建一个新的 ID 并使用\n    // 随机数作为值\n    return {\n      id: this.nextItemId++,\n\
  \      value: Math.random()\n    };\n  }\n\n  addItemmutably = () => {\n    // 正确的方法：\n\
  \    // 复制现有的并添加一个新的\n    this.setState({\n      items: [...this.state.items, this.makeItem()]\n\
  \    });\n  }\n\n  addItemMutably = () => {\n    // 错误的方法：\n    // 变异 items 并将其设置回去\n\
  \    this.state.items.push(this.makeItem());\n    this.setState({ items: this.state.items\
  \ });\n  }\n\n  render() {\n    return (\n      <div>\n        <button onClick={this.addItemmutably}>以不可变的方式添加项目（好）</button>\n\
  \        <button onClick={this.addItemMutably}>以变异的方式添加项目（坏）</button>\n        <ItemList\
  \ items={this.state.items}/>\n      </div>\n    );\n  }\n}\n```\n\n\n\n\n\n```css\n\
  .Item {\n  display: flex;\n  justify-content: space-between;\n  border-bottom: 1px\
  \ solid #ccc;\n  padding: 10px;\n}\n.Item-image {\n  width: 64px;\n  height: 64px;\n\
  \  border: 1px solid #ccc;\n  margin-right: 10px;\n  float: left;\n}\n.Item-title\
  \ {\n  font-weight: bold;\n  margin-bottom: 0.4em;\n}\n.Item-price {\n  text-align:\
  \ right;\n  font-size: 18px;\n  color: #555;\n}\n.Item-addToCart {\n  margin-bottom:\
  \ 5px;\n  font-size: 14px;\n  border: 2px solid #FFAA3F;\n  background-color: #fff;\n\
  \  border-radius: 3px;\n  cursor: pointer;\n}\n.Item-addToCart:hover {\n  background-color:\
  \ #FFDDB2;\n}\n.Item-addToCart:active {\n  background-color: #ED8400;\n  color:\
  \ #fff;\n  outline: none;\n}\n.Item-addToCart:focus {\n  outline: none;\n}\n.Item-left\
  \ {\n  flex: 1;\n}\n.Item-right {\n  display: flex;\n  flex-direction: column;\n\
  \  justify-content: space-between;\n}\n```\n\n这样好多了：\n\n![带有样式效果](img/file40.png)\
  \ \n\n## 创建 CartPage\n\n现在我们已经可以将商品添加到购物车了，我们将构建一个渲染购物车本身的组件。\n\n创建 `src/CartPage.css`\
  \ 和 `src/CartPage.js`，并打开 `CartPage.js`。最初，代码将与 `ItemPage` 中的代码非常相似。\n\n```javascript\n\
  import React from 'react';\nimport PropTypes from 'prop-types';\nimport Item from\
  \ './Item';\nimport './CartPage.css';\n\nfunction CartPage({ items }) {\n  return\
  \ (\n    <ul className=\"CartPage-items\">\n      {items.map(item =>\n        <li\
  \ key={item.id} className=\"CartPage-item\">\n          <Item item={item} />\n \
  \       </li>\n      )}\n    </ul>\n  );\n}\nCartPage.propTypes = {\n  items: PropTypes.array.isRequired\n\
  };\n\nexport default CartPage;\n```\n\n这只是渲染了它接收到的商品。你会注意到，我们没有向 `Item` 传递 `onAddToCart`\
  \ 处理程序，这会导致 prop 警告。我们很快会修复这个问题。\n\n### 将商品传递给 CartPage\n\n购物车需要商品来显示。问题是，我们的 `cart`\
  \ 状态只包含索引，而不是实际商品。此外，当商品被多次添加时，会出现重复。我们需要将 `cart` 状态转换为适合传递给 `CartPage` 的商品数组。\n\
  \n在 `App.js` 顶 Implementation 导入 `CartPage`：\n\n```javascript\nimport CartPage from\
  \ './CartPage';\n```\n\n然后添加一个 `renderCart` 函数，并更新 `renderContent` 来调用它。\n\n```javascript\n\
  class App extends Component {\n  // ...\n  renderContent() {\n    switch(this.state.activeTab)\
  \ {\n      default:\n      case 0:\n        return (\n          <ItemPage\n    \
  \        items={items}\n            onAddToCart={this.handleAddToCart} />\n    \
  \    );\n      case 1:\n        return this.renderCart();\n    }\n  }\n  renderCart()\
  \ {\n    // 计算购物车中每种商品的数量\n    let itemCounts = this.state.cart.reduce((itemCounts,\
  \ itemId) => {\n      itemCounts[itemId] = itemCounts[itemId] || 0;\n      itemCounts[itemId]++;\n\
  \      return itemCounts;\n    }, {});\n\n    // 创建商品数组\n    let cartItems = Object.keys(itemCounts).map(itemId\
  \ => {\n      // 根据 id 查找商品\n      var item = items.find(item =>\n        item.id\
  \ === parseInt(itemId, 10)\n      );\n      // 创建一个也包含 'count' 属性的“商品”\n      return\
  \ {\n        ...item,\n        count: itemCounts[itemId]\n      }\n    });\n   \
  \ return (\n      <CartPage items={cartItems} />\n    );\n  }\n  // ...\n}\n```\n\
  \n这段代码中有些你以前可能没见过的东西。\n\n## Array.prototype.reduce\n\n`reduce` 函数的作用类似于求和操作。它接受一个可选的初始值（在此处为\
  \ `{}`），然后调用给定的函数，并将累加总和和当前数组项传入参数。函数返回的值将成为新的 `total`，然后移动到数组中的下一个项。当 `reduce`\
  \ 完成时，它返回最终的 `total`。我们正在使用 `reduce` 来构建一个对象，其键是 `itemId`，值是购物车中每种商品的数量。\n\n这是一个\
  \ `reduce` 应用的更小、更简单的示例：\n\n```javascript\nlet a = [1, 2, 3, 4];\nlet total = a.reduce((sum,\
  \ value) => {\n  return sum + value;\n}, 0);\n// 箭头函数被调用 4 次：\n//   (0, 1) => 返回\
  \ 1\n//   (1, 2) => 返回 3\n//   (3, 3) => 返回 6\n//   (6, 4) => 返回 10\n```\n\n## Object.keys\n\
  \n`Object.keys` 返回对象中所有键的数组。每当你想要遍历数组的值以创建一个聚合结果时，请考虑使用 `reduce`。\n\n\n\n\n第三种想法是将\
  \ `children` 传递给 `Item` 并让它决定将它们放在哪里。这就是我们将实现的思路。这让 `Item` 非常容易复用。如果你想要一个“加入购物车”按钮，就把它传进去。如果你想要的是添加/删除按钮，就把它们传进去。让我们来看看它是如何运作的。\n\
  \n### 重构 Item\n\n新的 `Item` 及其 `propTypes` 如下所示：\n\n```javascript\nconst Item = ({\
  \ item, children }) => (\n  <div className=\"Item\">\n    <div className=\"Item-left\"\
  >\n      <div className=\"Item-image\" />\n      <div className=\"Item-title\">{item.name}</div>\n\
  \      <div className=\"Item-description\">{item.description}</div>\n    </div>\n\
  \    <div className=\"Item-right\">\n      <div className=\"Item-price\">${item.price}</div>\n\
  \      {children}\n    </div>\n  </div>\n);\nItem.propTypes = {\n  item: PropTypes.object.isRequired,\n\
  \  children: PropTypes.node\n};\n```\n\n在曾经有 `<button>` 的地方，我们现在改用了 `{children}`。此外，`Item`\
  \ 不再需要感知 `onAddToCart` 函数，因此我们删除了它的 `propType`。\n\n如果你在此处刷新，你会发现“加入购物车”按钮已经从购物车页面*以及*商品页面中消失了。为了修复这个问题，打开\
  \ `ItemPage.js` 并将 `<button>` 作为 `Item` 的子元素传递进去：\n\n```javascript\nfunction ItemPage({\
  \ items, onAddToCart }) {\n  return (\n    <ul className=\"ItemPage-items\">\n \
  \     {items.map(item =>\n        <li key={item.id} className=\"ItemPage-item\"\
  >\n          <Item item={item}>\n            <button\n              className=\"\
  Item-addToCart\"\n              onClick={() => onAddToCart(item)}>\n           \
  \   Add to Cart\n            </button>\n          </Item>\n        </li>\n     \
  \ )}\n    </ul>\n  );\n}\n```\n\n好了，恢复正常了。现在来处理新部分：打开 `CartPage.js`，在 `Item` 内部传递加/减按钮和商品数量。我们还需要用于处理添加或删除商品时的处理函数。\n\
  \n```javascript\nfunction CartPage({ items, onAddOne, onRemoveOne }) {\n  return\
  \ (\n    <ul className=\"CartPage-items\">\n      {items.map(item =>\n        <li\
  \ key={item.id} className=\"CartPage-item\">\n          <Item item={item}>\n   \
  \         <div className=\"CartItem-controls\">\n              <button\n       \
  \         className=\"CartItem-removeOne\"\n                onClick={() => onRemoveOne(item)}&ndash;</button>\n\
  \              <span className=\"CartItem-count\">{item.count}</span\n         \
  \     <button\n                className=\"CartItem-addOne\"\n                onClick={()\
  \ => onAddOne(item)}>+</button>\n            </div>\n          </Item>\n       \
  \ </li>\n      )}\n    </ul>\n  );\n}\nCartPage.propTypes = {\n  items: PropTypes.array.isRequired,\n\
  \  onAddOne: PropTypes.func.isRequired,\n  onRemoveOne: PropTypes.func.isRequired\n\
  };\n```\n\n这些都是你之前见过的内容。在我们传递这些函数之前，代码将无法工作，所以让我们回到 `App.js` 并创建它们。在 `renderCart`\
  \ 的底部，我们需要将 props 传递给 `CartPage`：\n\n```javascript\nclass App extends Component\
  \ {\n  // ...\n  renderCart() {\n    // ...\n    return (\n      <CartPage\n   \
  \     items={this.state.cart}\n        onAddOne={this.handleAddToCart}\n       \
  \ onRemoveOne={this.handleRemoveOne} />\n    );\n  }\n  // ...\n}\n```\n\n我们已经有了\
  \ `handleAddToCart` 函数，它接收一个商品并将其 id 添加到购物车，所以我们可以在这里直接使用。我们需要创建 `handleRemoveOne`\
  \ 函数。它将接收一个商品，在购物车中找到该商品项，然后更新 `cart` 状态以移除该项。\n\n```javascript\nclass App extends\
  \ Component {\n  // ...\n  handleRemoveOne = (item) => {\n    let index = this.state.cart.indexOf(item.id);\n\
  \    this.setState({\n      cart: [\n        ...this.state.cart.slice(0, index),\n\
  \        ...this.state.cart.slice(index + 1)\n      ]\n    });\n  }\n  // ...\n\
  }\n```\n\n在这里我们使用了两次数组*展开*（spread）运算符，以避免直接修改状态。我们获取数组的左半部分（到我们要删除的商品为止），并将其与数组的右半部分（被删除商品之后的所有内容）拼接。\n\
  \n这比允许直接修改要多一点精力，但这是一个良好的习惯。如果你将来开始使用 Redux，这将尤为重要。Redux 高度依赖于不可变性。\n\n为了完善添加/删除按钮，让我们给它们添加一些样式。在\
  \ `CartPage.css` 中添加以下 CSS：\n\n```css\nCartPage-items {\n  margin: 0;\n  padding:\
  \ 0;\n}\n.CartPage-items li {\n  list-style: none;\n}\n.CartItem-count {\n  padding:\
  \ 5px 10px;\n  border: 1px solid #ccc;\n}\n.CartItem-addOne,\n.CartItem-removeOne\
  \ {\n  padding: 5px 10px;\n  border: 1px solid #ccc;\n  background: #fff;\n}\n.CartItem-addOne\
  \ {\n  border-left: none;\n}\n.CartItem-removeOne {\n  border-right: none;\n}\n\
  ```\n\n大功告成了：\n\n![Cart is working](img/file42.png)\n\n### 练习\n\n1.  如果购物车能告诉我们准备在苹果产品上花费多少美元，而不是让我们去猜就好了。在购物车页面底部添加一个“总计”，如下：\n\
  \n![Cart Total](img/file43.png)\n\n2.  当购物车为空时，页面是完全空白的。修改使其在没有商品时显示“购物车为空”，如下：\n\
  \n![Cart Total](img/file44.png)\n\n3.  在导航栏右上角显示购物车摘要，如下所示。包括商品总数和总价。确保考虑到数组中的每个项目数量可能大于\
  \ 1。作为一个奖励，让购物车摘要可点击，点击后切换到购物车页面。如果你喜欢也可以添加一个购物车图标（可以使用 Font Awesome）。\n\n![Cart\
  \ Summary](img/file45.png)\n\n4.  根据此截图构建一个简化版的 Reddit：\n\n![Reddit](img/file46.png)\n\
  \n它应该具备以下功能：\n\n*   显示投票数\n*   可运行的赞成/踩控件\n*   显示评论数\n*   按赞成数对故事进行排序\n*   标题应该是真实的链接\n\
  *   其他链接不需要具有功能（分享、保存、隐藏等）\n\n遵循我们在书中贯穿始终的流程：列出截图中的组件，决定需要保留哪些状态以及哪些组件应该拥有这些状态，然后开始构建组件。\n\
  \nReddit 的 API 是公开的，不需要密钥。你可以使用来自 http://www.reddit.com/r/reactjs.json 的静态数据——将其保存到文件中，并像我们在几个示例中做的那样导入。\n\
  \n5.  根据此 UI 构建一个简化版的 Slack：\n\n![Slack Clone](img/file47.png)\n\n它应该具备以下功能：\n\n\
  *   频道列表\n\n\n\n\n- 用户列表\n- 维护当前选中的通道或用户的状态\n- 点击通道或用户进行选择\n- 一次只能选择一个通道或用户\n- 每个通道和用户都有自己的消息历史记录\n\
  - 为每个通道生成一些虚假消息\n- 仅在选中通道或用户时，在底部显示输入框\n- 在输入框中输入内容并按 `ENTER` 键会将该消息添加到所选的通道/用户，并清空输入框\n\
  \n# 接下来该去哪里\n\n首先，恭喜你读完了这本书。我希望你在阅读过程中的乐趣，不像我写它时一样开心。\n\n话虽如此，这并不是终点。这只是你 React\
  \ 之旅的`beginning`。\n\n到目前，你已经牢牢掌握了 React 的基础知识，并且学习了一些 ES6。从这里开始，你可以继续学习 AJAX、Webpack、React\
  \ Router、Redux 或 MobX，以及你需要的任何其他内容。\n\n这里有一个建议的攻克顺序。我认为`最后`学习 Redux 是很重要的，但其他内容可以根据你的需要调整顺序。\n\
  \n## AJAX\n\n学习如何将你的应用连接到服务器是非常有趣的，因为你可以看到你的应用随着真实数据变得活跃。\n\nReact 没有内置的与服务器通信的方法，所以你需要使用\
  \ HTTP 库。有很多这样的库可供选择。我喜欢 [fetch](https://github.com/github/fetch)，因为它最终将成为 JavaScript\
  \ 标准库的一部分，但 [axios](https://github.com/mzabriskie/axios) 和 [superagent](https://github.com/visionmedia/superagent)\
  \ 也是很好的选择。\n\n你应该在何时以及何处发送 HTTP 请求？常见的做法是在 `componentDidMount` 周期方法中获取数据。当响应返回时，调用\
  \ `this.setState` 保存这些数据，并使用 `props` 将其传递给需要它的组件。\n\n就像所有状态一样，最好尽可能让它保持在组件层级结构的高处。例如，如果一个\
  \ `Page` 包含多个 `List` 组件，不要让每个 `List` 都去获取自己的数据——在 `Page` 组件中获取这些数据，并作为 `props` 传递给\
  \ `List`。\n\n## 测试\n\n测试是软件开发的重要部分。无论你决定是否使用测试驱动开发（TDD），在代码周围编写测试都能让你有信心确保一切都按预期运行。\n\
  \n有几个用于测试 React 的新工具需要学习。你需要一种方法来进行断言（Chai），可能需要一个库来设置间谍（Sinon），并且你绝对想要使用 `Enzyme`，这是一个由\
  \ Airbnb 创建的用于测试 React 组件的库。\n\n我整理了一篇帮助你开始测试 React 的文章，在这里](https://daveceddia.com/getting-started-with-tdd-in-react/)。\n\
  \n## Webpack\n\n构建工具在刚开始是一个主要的障碍，这就是为什么设置 Webpack 没有包含在本书中。如果你还没有需要自定义构建，请推迟以后学习\
  \ Webpack。\n\n我推荐阅读文章 [Webpack – The Confusing Parts](https://medium.com/@rajaraodv/webpack-the-confusing-parts-58712f8fcad9)\
  \ 来作为对 Webpack 及其思维方式的介绍。Egghead.io 也有一个关于 Webpack 很好的快速介绍，地址是 [`egghead.io/lessons/javascript-intro-to-webpack`](https://egghead.io/lessons/javascript-intro-to-webpack)。\n\
  \n你应该知道，我们一直使用的 `create-react-app` 工具有一个生产构建模式（运行 `npm run build`），它会创建一个包含压缩文件和生产环境\
  \ React 的生产优化版构建。如果你不需要自定义任何内容，Create React App 开箱即用就非常好，完全适合编写真实的生产环境 React 应用。\n\
  \n它还有一个“eject（弹出）”命令（运行 `npm run eject`），它可以提取生成的 Webpack 构建并将其暴露供你自定义。\n\n## ES6\n\
  \n你已经在书中看到了一部分内容：箭头函数、`let/const`、类（classes）、解构以及 `import`/`export`。这些是你经常会用的大部分\
  \ ES6 内容，但还有许多其他很棒的新特性，如承诺（promises）、`for..of` 循环、动态对象键、迭代器等\n\n你可以在学习的过程中掌握这些特性，但至少对所有内容进行一次快速概览是个好主意，这样你就知道哪些功能是可用的。这个\
  \ [ES6 特性概述](https://github.com/lukehoban/es6features) 是一个很好的资源。\n\n## 路由\n\n现在你已经相当熟悉了\
  \ React 是如何工作的，React Router 的概念将在此基础上构建。它利用组件来为你的应用程序布局路由，有效地将你的组件映射到 URL。查看 [React\
  \ Router on Github](https://github.com/ReactTraining/react-router) 开始吧。\n\n有些人会在脑中将\
  \ React Router 和 Redux 混为一谈——它们实际上并不相互关联或相互依赖，尽管有一个库可以将路由状态与 Redux 起来。你可以在（并且应该！）在深入学习\
  \ Redux 之前学会使用 React Router。\n\n## Redux\n\nRedux 的创建者 Dan Abramov [会告诉你](https://github.com/gaearon/react-makes-you-sad)\
  \ 不要过早给你的项目添加 Redux，这很有道理——在你遇到它能解决的问题之前，你不需要它，而且早期引入复杂度可能是灾难性的。\n\nRedux 的概念相当简单，但在理解其原理和在实际应用中使用它之间存在差距。它受到函数式编程概念的影响，如果你不熟悉这些，可能需要一些适应。\n\
  \n所以，在向大项目引入 Redux 之前，重复你在书中做的：构建小项目。将使用普通 状态的代码转换为 Redux。构建许多 Redux 实验来真正内化它的工作原理。\n\
  \n"
