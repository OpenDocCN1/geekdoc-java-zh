  `4`\n`5`\n\n## 4.9 Java 8 – forEach\n\n在 Java 8 中，我们引入了新的 `forEach` 方法来遍历集合和 Stream。在本指南中，我们将学习如何使用\
  \ `forEach()` 和 `forEachOrdered()` 方法遍历特定的集合和流。\n\n### Java 8 – 使用 forEach 遍历 Map\n\
  \n```java\nimport java.util.Map;\nimport java.util.HashMap;\n\npublic class Example\
  \ {\n    public static void main(String[] args) {\n        Map<Integer, String>\
  \ hmap = new HashMap<Integer, String>();\n        hmap.put(1, \"Monkey\");\n   \
  \     hmap.put(2, \"Dog\");\n        hmap.put(3, \"Cat\");\n        hmap.put(4,\
  \ \"Lion\");\n        hmap.put(5, \"Tiger\");\n        hmap.put(6, \"Bear\");\n\
  \        /* 使用 forEach 遍历并显示 HashMap 的每个键值对。 */\n        hmap.forEach((key,value)->System.out.println(key+\"\
  \ - \"+value));\n    }\n}\n```\n\n\n\n\n\n```java\n/* 使用 forEach 遍历 Map 并显示特定键的值\
  \ */\nhmap.forEach((key,value) -> {\n    if (key == 4) {\n        System.out.println(\"\
  Key 4 对应的 Value 是: \" + value);\n    }\n});\n\n/* 使用 forEach 遍历 Map 并显示特定值对应的键 */\n\
  hmap.forEach((key,value) -> {\n    if (\"Cat\".equals(value)) {\n        System.out.println(\"\
  Value Cat 对应的 Key 是: \" + key);\n    }\n});\n```\n\n# Java 8 – 使用 forEach 遍历 List\n\
  \n在例例中，我们使用 `forEach()` 方法遍历一个 `ArrayList`。在 `forEach` 内部，我们使用 lambda 表达式来打印列表的每个元素。\n\
  \n```java\nimport java.util.List;\nimport java.util.ArrayList;\n\npublic class Example\
  \ {\n    public static void main(String[] args) {\n        List<String> fruits =\
  \ new ArrayList<String>();\n        fruits.add(\"Apple\");\n        fruits.add(\"\
  Orange\");\n        fruits.add(\"Banana\");\n        fruits.add(\"Pear\");\n   \
  \     fruits.add(\"Kiwi\");\n        // 在 forEach 方法中使用 lambda 表达式\n        fruits.forEach(str\
  \ -> System.out.println(str));\n    }\n}\n```\n\n**输出：**\n```\nApple\nOrange\nBanana\n\
  Pear\nKiwi\n```\n\n我们也可以像这样在 `forEach()` 方法中使用方法引用：\n`fruits.forEach(System.out::println);`\n\
  \n# Java 8 – 使用 forEach 方法遍历 Stream\n\n在此例中，我们使用 `forEach()` 方法在 Java 中遍历一个 `Stream`。\n\
  \n```java\nimport java.util.List;\nimport java.util.ArrayList;\n\npublic class Example\
  \ {\n    public static void main(String[] args) {\n        List<String> names =\
  \ new ArrayList<String>();\n        names.add(\"Maggie\");\n        names.add(\"\
  Michonne\");\n        names.add(\"Rick\");\n        names.add(\"Merle\");\n    \
  \    names.add(\"Governor\");\n        names.stream() // 创建流\n            .filter(f\
  \ -> f.startsWith(\"M\")) // 过滤以 M 开头的名称\n            .forEach(System.out::println);\
  \ // 使用 forEach 显示流\n    }\n}\n```\n\n**输出：**\n```\nMaggie\nMichonne\nMerle\n```\n\
  \n# Java – Stream forEachOrdered() 方法示例\n\n对于顺序流（sequential streams），元素的顺序与源数据的顺序相同，因此无论使用\
  \ `forEach` 还是 `forEachOrdered`，输出结果都是相同的。但在处理并行流（parallel streams）时，如果顺序对你很重要，你始终始终使用\
  \ `forEachOrdered()` 方法，因为该方法保证元素的顺序与源数据一致。让我们通过示例来理解 `forEach()` 和 `forEachOrdered()`\
  \ 的区别。\n\n```java\nimport java.util.List;\nimport java.util.ArrayList;\n\npublic\
  \ class Example {\n    public static void main(String[] args) {\n        List<String>\
  \ names = new ArrayList<String>();\n        names.add(\"Maggie\");\n        names.add(\"\
  Michonne\");\n        names.add(\"Rick\");\n        names.add(\"Merle\");\n    \
  \    names.add(\"Governor\");\n        // forEach - 输出可能是任何顺序\n        System.out.println(\"\
  使用 forEach 输出\");\n        names.stream()\n            .filter(f -> f.startsWith(\"\
  M\"))\n            .parallel()\n            .forEach(n -> System.out.println(n));\n\
  \n        /* forEachOrdered - 输出将始终保持为此顺序：\n           * Maggie, Michonne, Merle\n\
  \        */\n        System.out.println(\"使用 forEachOrdered 输出\");\n        names.stream()\n\
  \            .filter(f -> f.startsWith(\"M\"))\n            .parallel()\n      \
  \      .forEachOrdered(n -> System.out.println(n));\n    }\n}\n```\n\n**输出：**\n\
  ```\n使用 forEach 输出\nMerle\nMaggie\nMichonne\n使用 forEachOrdered 输出\nMaggie\nMichonne\n\
  Merle\n```\n\n# Java 8 – Stream Collectors\n\n`Collectors` 是一个继承自 `Object` 类的最终类。在本节中，我们将看到使用\
  \ lambda 表达式、Java Streams 以及 Java 8 其他特性的 Java Stream `Collectors` 示例。\n`java.lang.Object`\
  \ | `java.util.stream.Collectors`\n\n# Java – Stream Collectors groupingBy 和 counting\n\
  \n在此例中，我们使用 `Collectors` 的 `groupBy()` 方法对列表元素进行分组，并打印每个元素的次数。\n\n```java\nimport\
  \ java.util.Arrays;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.function.Function;\n\
  import java.util.stream.Collectors;\n\npublic class Example {\n    public static\
  \ void main(String[] args) {\n        List<String> names = Arrays.asList(\"Ajith\"\
  , \"Stefen\", \"Ajith\", \"Jon\", \"Ajith\");\n        Map<String, Long> map = names.stream().collect(\n\
  \            Collectors.groupBy(Function.identity(), Collectors.counting())\n  \
  \      );\n        System.out.println(map);\n    }\n}\n```\n**输出：**\n`{Stefen=1,\
  \ Jon=2, Ajith=3}`\n\n# Java – Stream Collectors 示例：将 List 获取数据\n\n```java\nimport\
  \ java.util.stream.Collectors;\nimport java.util.List;\nimport java.util.ArrayList;\n\
  \nclass Student {\n    int id;\n    String name;\n    int age;\n    public Student(int\
  \ id, String name, int age) {\n        this.id = id;\n        this.name = name;\n\
  \        this.age = age;\n    }\n}\n\npublic class Example {\n    public static\
  \ void main(String[] args) {\n        List<Student> studentlist = new ArrayList<>();\n\
  \        // 模拟数据添加\n        studentlist.add(new Student(11, \"Jony\", 22));\n  \
  \      studentlist.add(new Student(22, \"Stefen\", 18));\n        // ... (此处省略原文中混乱的部分，已按逻辑修复)\n\
  \        \n        // 获取名称的 List\n        List<String> names = studentlist.stream()\n\
  \            .map(n -> n.name)\n            .collect(Collectors.toList());\n   \
  \     System.out.println(names);\n    }\n}\n```\n**输出：**\n`[Jony, Stefen, Lucy,\
  \ Sansa, Maggie]`\n\n# Java Collectors 示例 收集数据为 Set\n\n在此例中，我们将列表转换为流，然后使用 `Collectors.toSet()`\
  \ 方法收集特定的记录。\n\n```java\nimport java.util.stream.Collectors;\nimport java.util.List;\n\
  import java.util.ArrayList;\nimport java.util.Set;\n\nclass Student {\n    int id;\n\
  \    String name;\n    int age;\n    public Student(int id, String name, int age)\
  \ {\n        this.id = id;\n        this.name = name;\n        this.age = age;\n\
  \    }\n}\n\npublic class Example {\n    public static void main(String[] args)\
  \ {\n        List<Student> studentlist = new ArrayList<>();\n        studentlist.add(new\
  \ Student(11, \"Jony\", 22));\n        studentlist.add(new Student(22, \"Stefen\"\
  , 18));\n        studentlist.add(new Student(33, \"Lucy\", 22));\n        studentlist.add(new\
  \ Student(44, \"Sansa\", 23));\n        studentlist.add(new Student(55, \"Maggie\"\
