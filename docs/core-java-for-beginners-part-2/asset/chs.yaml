  ArrayList contains: [Steve, Matt, Govinda, John, Tomy]\n\n## 6) HashSet 和 HashMap\
  \ 的区别\n\n本文将讨论 `HashSet` 和 `HashMap` 类之间的区别。\n\n### HashSet 对比 HashMap\n\n| HASHSET\
  \ | HASHMAP |\n| :--- | :--- |\n| `HashSet` 类实现了 `Set` 接口 | `HashMap` 类实现了 `Map`\
  \ 接口 |\n| 在 `HashSet` 中我们存储对象（元素或值），例如：如果我们有一个字符串元素的 `HashSet`，那么它可以表示一组 HashSet\
  \ 元素：{\"Hello”, “Hi”, “Bye”, “Run”} | `HashMap` 用于存储键值对。简单而言之，它维护了键与值的映射（`HashMap`\
  \ 类与 `Hashtable` 大致相当，区别是非同步的且允许空值）。如果它具有整数键和字符串类型的值，那么可以这样表示 HashMap 元素：例如{1→”Hello”,\
  \ 2→”Hi”, 3→”Bye”, 4→”Run”} |\n| `HashSet` 不允许重复元素，这意味着不能在 `HashSet` 中存储重复的值。 |\
  \ `HashMap` 不允许重复键，但允许有重复的值。 |\n| `HashSet` 允许有一个 null 值 | `HashMap` 允许单个 null 键和任意数量的\
  \ null 值 |\n\n### 相同点：\n\n1) `HashMap` 和 `HashSet` 都不是同步的，这意味着除非显式同步，否则它们不适用于线程安全的操作。以下是我们可以显式同步它们的方法：\n\
  \nHashSet：\n`Set s = Collections.synchronizedSet(new HashSet(...));`\n\nHashMap：\n\
  `Map m = Collections.synchronizedMap(new HashMap(...));`\n\n2) 这两个类都不保证元素的顺序随时间推移保持不变。\n\
  \n\n\n\n\n3) 如果你查看 `HashSet` 的源码，你可能会发现它是由一个 `HashMap` 支撑的。所以基本上它在内部使用 `HashMap`\
  \ 来执行所有操作。\n\n4) 它们在添加元素、删除元素等基本操作上都提供了常数时间性能。\n\n### HashSet 示例\n\n```java\nimport\
  \ java.util.HashSet;\n\nclass HashSetDemo{\n    public static void main(String[]\
  \ args) {\n        // 创建一个 HashSet\n        HashSet<String> hset = new HashSet<String>();\n\
  \        // 将元素添加到 HashSet\n        hset.add(\"AA\");\n        hset.add(\"BB\");\n\
  \        hset.add(\"CC\");\n        hset.add(\"DD\");\n        // 显示 HashSet 元素\n\
  \        System.out.println(\"HashSet contains: \");\n        for(String temp :\
  \ hset){\n            System.out.println(temp);\n        }\n    }\n}\n```\n\n**输出：**\n\
  ```text\nHashSet contains: \nAA\nBB\nCC\nDD\n```\n\n### HashMap 示例\n\n```java\n\
  import java.util.HashMap;\n\nclass HashMapDemo{\n    public static void main(String[]\
  \ args) {\n        // 创建一个 HashMap\n        HashMap<Integer, String> hmap = new\
  \ HashMap<Integer, String>();\n        // 将元素添加到 HashMap\n        hmap.put(1, \"\
  AA\");\n        hmap.put(2, \"BB\");\n        hmap.put(3, \"CC\");\n        hmap.put(4,\
  \ \"DD\");\n        // 显示 HashMap 元素\n        System.out.println(\"HashMap contains:\
  \ \"+hmap);\n    }\n}\n```\n\n**输出：**\n```text\nHashMap contains: {1=AA, 2=BB, 3=CC,\
  \ 4=DD}\n```\n\n### 7) HashSet 和 TreeSet 的区别\n\n#### HashSet vs TreeSet\n1) 对于 `add`、`remove`、`contains`、`size`\
  \ 等操作，`HashSet` 的性能比 `TreeSet` 更快。`HashSet` 提供常数时间复杂度，而 `TreeSet` 对于此类操作提供 `log(n)`\
  \ 时间复杂度。\n2) `HashSet` 不维护元素的任何顺序，而 `TreeSet` 元素默认按升序排列。\n\n#### 相同点：\n1) `HashSet`\
  \ 和 `TreeSet` 都不包含重复元素，这意味着它们都是不重复的。\n2) 如果你需要一个排序的 Set，那么先将元素添加到 `HashSet` 然后将其转换为\
  \ `TreeSet`，比直接创建一个 `TreeSet` 并向其中添加元素更好。\n3) 这两个类都是非同步的，这意味着它们不是线程安全的，在需要线程安全操作时，应该显式地进行同步。\n\
  \n#### 示例：\n\n##### HashSet 示例\n```java\nimport java.util.HashSet;\n\nclass HashSetDemo{\n\
  \    public static void main(String[] args) {\n        // 创建一个 HashSet\n       \
  \ HashSet<String> hset = new HashSet<String>();\n        // 将元素添加到 HashSet\n   \
  \     hset.add(\"Abhi\");\n        hset.add(\"Ram\");\n        hset.add(\"Kevin\"\
  );\n        hset.add(\"Singh\");\n        hset.add(\"Rick\");\n        // 移除重复项\n\
  \        hset.add(\"Ram\");\n        // 显示 HashSet 元素\n        System.out.println(\"\
  HashSet contains: \");\n        for(String temp : hset){\n            System.out.println(temp);\n\
  \        }\n    }\n}\n```\n**输出：**\n```text\nHashSet contains: \nRick\nSingh\nRam\n\
  Kevin\nAbhi\n```\n\n##### TreeSet 示例\n```java\nimport java.util.TreeSet;\n\nclass\
  \ TreeSetDemo{\n    public static void main(String[] args) {\n        // 创建一个 TreeSet\n\
  \        TreeSet<String> tset = new TreeSet<String>();\n        // 将元素添加到 TreeSet\n\
  \        tset.add(\"Abhi\");\n        tset.add(\"Ram\");\n        tset.add(\"Kevin\"\
  );\n        tset.add(\"Singh\");\n        tset.add(\"Rick\");\n        // 移除重复项\n\
  \        tset.add(\"Ram\");\n        // 显示 TreeSet 元素\n        System.out.println(\"\
  TreeSet contains: \");\n        for(String temp : tset){\n            System.out.println(temp);\n\
  \        }\n    }\n}\n```\n**输出：**\n```text\nElements 按升序排列。\nTreeSet contains:\n\
  Abhi\nKevin\nRam\nRick\nSingh\n```\n\n## 1.18 Java 中的 TreeSet 类\n\n`TreeSet` 与 `HashSet`\
  \ 类似，不同在于它按升序排列元素，而 `HashSet` 不维护任何顺序。`TreeSet` 允许空元素，但像 `HashSet` 一样不允许。与大多数其他集合类一样，该类也不是同步的，但可以像这样显式地同步：`SortedSet\
  \ s= Collections.synchronizedSortedSet(new TreeSet(...));`\n\n在这里我们将看到 `TreeSet`\
  \ 示例以及 `TreeSet` 与其他相似集合类的区别。\n\n### TreeSet 示例：\n在这个示例中，我们有两个 `TreeSet`（`TreeSet<String>`\
  \ 和 `TreeSet<Integer>`）。我们随机向它们两个添加了值，但我们得到的结果是升序排列的。\n\n```java\nimport java.util.TreeSet;\n\
  \npublic class TreeSetExample {\n    public static void main(String args[]) {\n\
