  \n默认情况下，`TreeMap` 元素按键的升序排序的。我们可以逆序遍历 `TreeMap`，以便按键的降序显示元素。\n\n逆序显示 TreeMap 元素：\n\
  \n```java\nimport java.util.*;\n\nclass TreeMapDemo {\n public static void main(String\
  \ args[]) {\n  TreeMap<String, String> treemap = new TreeMap<String, String>(Collections.reverseOrder());\n\
  \  // 将元素放入 map 中\n  treemap.put(\"Key1\", \"Jack\");\n  treemap.put(\"Key2\", \"\
  Rick\");\n  treemap.put(\"Key3\", \"Kate\");\n  treemap.put(\"Key4\", \"Tom\");\n\
  \  treemap.put(\"Key5\", \"Steve\");\n }\n}\n```\n\n\n\n\n\n```java\nSet set = treemap.entrySet();\n\
  \nIterator i = set.iterator();\n\n// Display elements\nwhile(i.hasNext()) {\n  \
  \  Map.Entry me = (Map.Entry)i.next();\n    System.out.print(me.getKey() + \": \"\
  );\n    System.out.println(me.getValue());\n}\n}\n}\n```\n\nOutput:\n```\nKey5:\
  \ Steve\nKey4: Tom\nKey3: Kate\nKey2: Rick\nKey1: Jack\n```\n\n如你所示，元素是按键的逆序显示的。\n\
  \n关于 javadoc 中 `Collections.reverseOrder()` 的更多信息：\n\n`public static Comparator\
  \ reverseOrder():` 返回一个比较器，该比较器对实现 `Comparable` 接口的对象的集合施加自然排序的反序。（自然排序是根据对象自身的\
  \ `compareTo` 方法施加排序。）这为以反自然顺序排序（或维护）实现 `Comparable` 接口的对象的集合（或数组）提供了一种简单的惯用方法。例如，假设\
  \ `a` 是一个字符串数组。那么：`Arrays.sort(a, Collections.reverseOrder());`\n\n按反字典序（字母顺序）排序数组。返回的比较器是可序列化的。\n\
  \n返回：\n一个比较器，对实现 `Comparable` 接口的对象的集合施加自然排序的反序。\n\n## 4) 如何从 TreeMap 示例获取子 Map\
  \ – Java\n\n在这个示例中，我们将看到如何从 `TreeMap` 获取一个子映射（sub map）。我们正在使用 `TreeMap` 类的 `subMap()`\
  \ 方法。更多细节请参考下方的程序中的注释。\n\n示例：\n```java\nimport java.util.*;\n\nclass TreeMapDemo\
  \ {\n    public static void main(String args[]) {\n        // 创建一个 TreeMap\n   \
  \     TreeMap<String, String> treemap = new TreeMap<String, String>();\n\n     \
  \   // 将元素放入 map\n        treemap.put(\"Key1\", \"Jack\");\n        treemap.put(\"\
  Key2\", \"Rick\");\n        treemap.put(\"Key3\", \"Kate\");\n        treemap.put(\"\
  Key4\", \"Tom\");\n        treemap.put(\"Key5\", \"Steve\");\n        treemap.put(\"\
  Key6\", \"Ram\");\n\n        // 显示 TreeMap 元素\n        System.out.println(\"TreeMap\
  \ Contains : \" + treemap);\n\n        // 获取子 map\n        /* public SortedMap<K,V>\
  \ subMap(K fromKey,K toKey): 返回\n         * 此 map 的部分的视图，其键的范围从\n         * fromKey（包含）到\
  \ toKey（不包含）。\n         * （如果 fromKey 和 toKey 相，则返回的 map 为空。）\n         * 返回的 map\
  \ 由此 map 支撑，因此返回 map 中的\n         * 更改将反映在此 map 中，反之亦然。\n         * 返回的 map 支持此\
  \ map 支持的所有 \n         * 可选 map 操作。\n         */\n        SortedMap<String, String>\
