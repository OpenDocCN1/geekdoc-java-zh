  Item4\nItem5\nItem6\n\n# 1.9 Java 中 ArrayList 和 Vector 的区别\n\n`ArrayList` 和 `Vector`\
  \ 内部都使用 `Array` 作为数据结构。然而，它们在存储和处理数据的方式存在一些区别。在这篇文章中，我们将讨论 `ArrayList` 和 `Vector`\
  \ 之间的差异和相似之处。\n\n## ArrayList 与 Vector:\n\n1) **同步性 (Synchronization)**：`ArrayList`\
  \ 是同步的，这意味着多个线程可以同时对 `ArrayList` 进行操作。例如：如果一个线程正在 `ArrayList` 上执行 `add` 操作，在多线程环境中，另一个线程可能同时在\
  \ `ArrayList` 上执行 `remove` 操作。\n而 `Vector` 是同步的。这意味着如果一个线程正在处理 `Vector`，其他线程就无法获取它。与\
  \ `ArrayList` 不同，同一时间只有一个线程可以对 `vector` 执行操作。\n\n2) **尺寸调整 (Resize)**：`ArrayList`\
  \ 和 `Vector` 都可以动态地增长和缩小，以保持存储的最优利用，但它们调整大小的方式不同。`ArrayList` 在调整大同时增加容量的一半，而 `Vector`\
  \ 在增长时默认将自身扩大一倍。\n\n3) **性能 (Performance)**：`ArrayList` 因为是非同步的，因此提供了更好的性能。`Vector`\
  \ 操作由于是线程安全的，性能较差，处理 `Vector` 的线程会获取其锁，这使得其他线程必须等待直到锁释放。\n\n4) **快速失败 (fail-fast)**：首先让我解释一下什么是快速失败：如果集合（`ArrayList`、`vector`\
  \ 等）在创建 `iterator` 之后，通过除 `iterator` 的 `add` 或 `remove` 方法以外的任何方式被结构性修改，那么 `iterator`\
  \ 将抛出 `ConcurrentModificationException`。结构性修改指的是集合中元素的添加或删除。\n根据 `Vector` 的 JavaDoc，`Vector`\
  \ 返回的 `Enumeration` 不是快速失败的。另一方面，`ArrayList` 返回的 `iterator` 和 `listIterator` 是快速失败的。\n\
  \n5) **谁真正属于集合框架？**：`vector` 并不是集合框架的一部分，后来才被包含进来。它可以被视为遗留代码（Legacy code）。`Vector`\
  \ 没有任何是 `List` 集合无法实现的。因此，应该避免使用 `Vector`。如果需要线程安全的操作，可以像本文后续节一样将 `ArrayList` 同步，或者使用\
  \ `CopyOnWriteArrayList`，它是 `ArrayList` 的线程安全变体。\n\n这些类之间有一些相似之处，如下：\n\n1) `Vector`\
  \ 和 `ArrayList` 都使用可增长的数组数据结构。\n2) 这些类（`Vector` 和 `ArrayList`）返回的 `iterator` 和 `listIterator`\
  \ 是快速失败的。\n3) 它们都是有序集合类，因为它们维护元素的插入顺序。\n4) `Vector` 和 `ArrayList` 都允许重复值和空值。\n5)\
  \ 当发生溢出和删除时，它们都会自动增长和缩小。\n\n## 何时使用 ArrayList，何时使用 vector？\n\n这完全取决于需求。如果需要执行“线程安全”操作，`vector`\
  \ 是你的最佳选择，因为它确保同一时间只有一个线程访问集合。\n性能：同步操作与非同步操作相比消耗更多时间，因此如果不需要线程安全操作，`ArrayList`\
  \ 是更好的选择，因为由于并发处理性能将会提高。\n\n## 如何使 ArrayList 同步？\n\n如我上面所述，`ArrayList` 方法是非同步的，但如果有需要，你可以这样让它们同步：\n\
  \n```java\n// 使用 Collec.synzhonizedList 方法\nList list = Collections.synchronizedList(new\
  \ ArrayList());\n\n...\n\n// 如果你想在同步列表上使用迭代器，请这样做使用\n// 像这样。它应该在同步块中。\nsynchronized\
  \ (list) {\n    Iterator iterator = list.iterator();\n    while (iterator.hasNext())\
  \ {\n        ...\n        iterator.next();\n        ...\n    }\n}\n```\n\n## 1.10\
  \ Java 中的 HashMap\n\n## 带示例的 Java HashMap\n\n带示例的 Java HashMap\n`HashMap` 是一个基于\
  \ `Map` 的类，用于存储 `Key, value` 对，它对键的顺序没有任何保证。它与 `Hashtable` 类似，但允许空值(null)。\n\n```java\n\
  import java.util.HashMap;\nimport java.util.Map;\nimport java.util.Iterator;\nimport\
  \ java.util.Set;\n\npublic class Details {\n    public static void main(String args[])\
  \ {\n        /* 这样声明 HashMap */\n        HashMap<Integer, String> hmap = new HashMap<Integer,\
  \ String>();\n        /*向 HashMap 添加元素*/\n        hmap.put(12, \"chandren\");\n\
  \        hmap.put(2, \"Rahul\");\n        hmap.put(7, \"Singh\");\n        hmap.put(49,\
  \ \"Ajeet\");\n        hmap.put(3, \"Anuj\");\n\n        /* 使用 Iterator 显示内容*/\n\
  \        Set set = hmap.entrySet();\n        Iterator iterator = set.iterator();\n\
  \        while(iterator.hasNext()) {\n            Map.Entry mentry = (Map.Entry)iterator.next();\n\
  \            System.out.print(\"key is: \"+mentry.getKey() + \" & Value is: \");\n\
  \            System.out.println(mentry.getValue());\n        }\n\n        /* 根据键获取值*/\n\
  \        String var= hmap.get(2);\n        System.out.println(\"Value at index 2\
  \ is \"+var);\n\n        /* 根据键删除值*/\n        hmap.remove(3);\n        System.out.println(\"\
  Map key and values after removal:\");\n        Set set2 = hmap.entrySet();\n   \
  \     Iterator iterator2 = set2.iterator();\n        while(iterator2.hasNext())\
  \ {\n            Map.Entry mentry2 = (Map.Entry)iterator2.next();\n            System.out.print(\"\
  Key is: \"+mentry2.getKey() + \" & Value is: \");\n            System.out.println(mentry2.getValue());\n\
  \        }\n    }\n}\n```\n\nOutput:\nkey is: 12 & Value is: chandren\nkey is: 2\
  \ & Value is: Rahul\nkey is: 7 & Value is: Singh\nkey is: 49 & Value is: Ajeet\n\
  key is: 3 & Value is: Anuj\nValue at index 2 is: Rahul\nMap key and values after\
  \ removal:\nkey is: 12 & Value is: chandren\nkey is: 2 & Value is: Rahul\nkey is:\
  \ 7 & Value is: Singh\nkey is: 49 & Value is: Ajeet\n\n## HashMap 方法\n\n这里是 `HashMap`\
  \ 类可用的方法列表。我也在文章末尾通过示例涵盖了这些方法的用法。\n\n1) `void clear()`：它从指定的 `Map` 中删除所有的键和值对。\n\
  2) `Object clone()`：它返回 map 所有映射的副本，并用于将其克隆到另一个 map 中。\n\n\n\n\n\n3) `boolean containsKey(Object\
  \ key)`:这是一个布尔函数，根据 map 中是否找到指定的 key 来返回 true 或 false。\n\n4) `boolean containsValue(Object\
  \ Value)`: 与 `containsKey()` 方法类似，但它查找指定的 value 而不是 key。\n\n5) `Value get(Object\
  \ key)`: 它返回指定 key 对应的值。\n\n6) `boolean isEmpty()`: 它检查 map 是否为空。如果 map 中不存在任何键值映射，则此函数返回\
  \ true，否则返回 false。\n\n7) `Set keySet()`: 它返回从 map 中获取的键的集合 `Set`。\n\n8) `Value put(Key\
  \ k, Value v)`: 将键值映射插入到 map 中。在上面的示例中使用。\n\n9) `int size()`: 返回 map 的大小 – 键值映射的数量。\n\
  \n10) `Collection values()`: 它返回 map 中所有值的集合。\n\n11) `Value remove(Object key)`:\
  \ 它移除指定 key 的键值对。在上面的示例中使用。\n\n12) `void putAll(Map m)`: 将一个 map 的所有元素复制到另一个指定的\
  \ map 中。\n\n## 1.11 HashMap 教程\n\n## HashMap 基础\n\n* 如何遍历 HashMap\n* 按键和值对 HashMap\
  \ HashMap\n* 获取 HashMap 的大小\n* 从 HashMap 中移除键值映射\n* 从 HashMap 中移除所有映射\n* 如何检查 HashMap\
  \ 是否为空？\n\n### 1) 如何在 Java 中循环 HashMap\n\n在本教程中，我们将学习如何使用以下方法循环 `HashMap`：\n* For\
  \ 循环\n* While 循环 + Iterator\n\n#### 示例：\n\n在下面的示例中，我们正同时使用两种方法（for 循环和 while 循环）遍历\
  \ `HashMap`。在 while 循环中，我们使用了迭代器（iterator）。\n\n```java\npackage javabook.com;\n\n\
  import java.util.HashMap;\nimport java.util.Map;\nimport java.util.Iterator;\n\n\
  public class Details {\n    public static void main(String [] args) {\n        HashMap<Integer,\
  \ String> hmap = new HashMap<Integer, String>();\n        //向 HashMap 添加元素\n   \
  \     hmap.put(11, \"AB\");\n        hmap.put(2, \"CD\");\n        hmap.put(33,\
  \ \"EF\");\n        hmap.put(9, \"GH\");\n        hmap.put(3, \"IJ\");\n\n     \
  \   //FOR LOOP\n        System.out.println(\"For Loop:\");\n        for (Map.Entry\
  \ me : hmap.entrySet()) {\n            System.out.println(\"Key: \"+me.getKey()\
  \ + \" & Value: \" + me.getValue());\n        }\n\n        //WHILE LOOP & ITERATOR\n\
  \        System.out.println(\"While Loop:\");\n        Iterator iterator = hmap.entrySet().iterator();\n\
  \        while (iterator.hasNext()) {\n            Map.Entry me2 = (Map.Entry) iterator.next();\n\
  \            System.out.println(\"Key: \"+me2.getKey() + \" & Value: \" + me2.getValue());\n\
  \        }\n    }\n}\n```\n\n输出：\n```\nFor Loop:\nKey: 2 & Value: CD\nKey: 3 & Value:\
  \ IJ\nKey: 33 & Value: EF\nKey: 9 & Value: GH\nKey: 11 & Value: AB\nWhile Loop:\n\
  Key: 2 & Value: CD\nKey: 3 & Value: IJ\nKey: 33 & Value: EF\nKey: 9 & Value: GH\n\
  Key: 11 & Value: AB\n```\n\n### 2) 如何在 Java 中按键和值对 HashMap 进行排序\n\n众所周知，`HashMap`\
  \ 默认不保持任何顺序。如果需要，我们需要根据需求显式地排序。在本教程中，我们将学习如何使用 `TreeMap` 按键排序 `HashMap`，以及使用 `Comparator`\
  \ 按值进行排序。\n\n#### 按键排序 HashMap\n\n在示例中，我们正使用 `TreeMap` 集合类根据键对 `HashMap` 进行排序。\n\
  \n```java\npackage javabook.com;\n\nimport java.util.HashMap;\nimport java.util.Map;\n\
  import java.util.TreeMap;\nimport java.util.Set;\nimport java.util.Iterator;\n\n\
  public class Details {\n    public static void main(String[] args) {\n        HashMap<Integer,\
  \ String> hmap = new HashMap<Integer, String>();\n        hmap.put(5, \"A\");\n\
  \        hmap.put(11, \"C\");\n        hmap.put(4, \"Z\");\n        hmap.put(77,\
  \ \"Y\");\n        hmap.put(9, \"P\");\n        hmap.put(66, \"Q\");\n        hmap.put(0,\
  \ \"R\");\n\n        System.out.println(\"Before Sorting:\");\n        Set set =\
