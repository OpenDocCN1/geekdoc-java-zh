  Rahul\nSteve\nJude\nLocke\nMike\nRobert\nArrayList Elements :\nRahul\nSteve\nJude\n\
  Locke\nMike\nRobert\n\n# 在 Java 中将 Vector 转换为 String 数组\n\n## 示例:\n让我们来看下面的示例，如何将一个\
  \ `Strings` 的 `Vector` 转换为数组。我们使用 `Vector` 类的 `toString()` 方法来实现此。\n\n`public String\
  \ toString()`：它返回此 `Vector` 的字符串表示，包含每个元素的字符串表示。\n\n```java\nimport java.util.Vector;\n\
