  只能被自己和 1 整除的数字被称为质数。该程序接收输入并检查该数字是否为质数。\n\n### 示例: 检查输入数字是否为质数\n\n为了理解这个程序，你应该掌握\
  \ `for` 循环、`if-else` 语句和 `break` 语句。\n\n```java\nimport java.util.Scanner;\nclass\
  \ PrimeCheck {\n  public static void main(String args[]) {\n    int temp;\n    boolean\
  \ isPrime=true;\n    Scanner scan= new Scanner(System.in);\n    System.out.println(\"\
  Enter any number:\");\n    int num=scan.nextInt();\n    scan.close();\n    for(int\
  \ i=2; i<=num/2; i++) {\n      temp=num%i;\n      if(temp==0) {\n        isPrime=false;\n\
  \        break;\n      }\n    }\n    //如果 isPrime 为 true 则该数字是质数，否则不是\n    if(isPrime)\n\
  \      System.out.println(num + \" is a Prime Number\");\n    else\n      System.out.println(num\
  \ + \" is not a Prime Number\");\n  }\n}\n```\n\n**Output 1:**\nEnter any number:\n\
  19\n19 is a Prime Number\n\n**Output 2:**\nEnter any number:\n6\n6 is not a Prime\
  \ Number\n\n你也可以使用 `while` 循环来检查质数：\n\n只需将上述程序中的部分：\n```java\nfor(int i=2; i<=num/2;\
