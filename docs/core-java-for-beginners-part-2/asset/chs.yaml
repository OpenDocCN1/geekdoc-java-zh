  \ 类\n\n在 Java 8 中，`java.util` 包中引入了 `Optional` 类。使用该类，我们可以轻松地处理空值，从而避免 `NullPointerException`。在本教程中，我们将看到\
  \ `Optional` 类的几个示例，并在本文的末尾，我们将介绍 `Optional` 类的方法。\n\n## Optional 示例 1：使用 isPresent()\
  \ 获取值\n\n在此示例中，我们将如何使用 `isPresent()` 方法来检查 `Optional` 对象是否包含值。\n\n```java\nimport\
  \ java.util.Optional;\n\npublic class Example {\n\n public static void main(String[]\
  \ args) {\n    String name = \"Java\";\n    Optional<String> opt = Optional.ofNullable(name);\n\
  \n    // 使用 isPresent() 检查是否有值\n    if (opt.isPresent()) {\n        System.out.println(\"\
  Value: \" + opt.get());\n    } // 如果不为空则打印值\n    System.out.println(\"No value present\"\
  ); // 如果为空则打印\n  }\n}\n```\n\nOutput:\nValue: Java\n\n## Optional 示例 2：使用 get()\
  \ 获取值\n\n在此示例中，我们将展示如何使用 `get()` 方法从 `Optional` 对象中获取值。请注意，如果 `Optional` 是空的，调用\
  \ `get()` 将抛出 `NullPointerException`。\n\n```java\nimport java.util.Optional;\n\n\
  public class Example {\n\n public static void main(String[] args) {\n    String\
  \ name = null;\n    Optional<String> opt = Optional.ofNullable(name);\n\n    //\
  \ 如果为空，这里将抛出异常\n    System.out.println(\"Value: \" + opt.get());\n  }\n}\n```\n\n\
  Output:\nException in thread \"main\" java.lang.NullPointerException\nat Example.main(Example.java:9)\n\
  \n## Optional 示例 3：使用 orElse() 获取默认值\n\n在此示例中，我们将使用 `orElse()` 方法在 `Optional` 为空时提供一个默认值。\n\
  \n```java\nimport java.util.Optional;\n\npublic class Example {\n\n public static\
  \ void main(String[] args) {\n    String name = null;\n    Optional<String> opt\
  \ = Optional.ofNullable(name);\n\n    // 如果为空，则使用默认值 \"Default\"\n    System.out.println(\"\
  Value: \" + opt.orElse(\"Default\"));\n  }\n}\n```\n\nOutput:\nValue: Default\n\n\
  ## Optional 示例 4：使用 orElseGet() 获取默认值\n\n在此示例中，我们将使用 `orElseGet()` 方法。该方法在 `Optional`\
  \ 为空时通过 Lambda 表达式生成默认值，这在生成默认值开销较大时更加高效。\n\n```java\nimport java.util.Optional;\n\
  \npublic class Example {\n\n public static void main(String[] args) {\n    String\
  \ name = null;\n    Optional<String> opt = Optional.ofNullable(name);\n\n    //\
  \ 如果为空，通过表达式生成默认值\n    System.out.println(\"Value: \" + opt.orElseGet(() -> \"Default\
  \ Value\"));\n  }\n}\n```\n\nOutput:\nValue: Default Value\n\n## Optional 示例 5：使用\
  \ ifPresent() 执行操作\n\n在此示例中，我们将展示如何使用 `ifPresent()` 方法在 `Optional` 包含值时执行某些操作。\n\
  \n```java\nimport java.util.Optional;\n\npublic class Example {\n\n public static\
  \ void main(String[] args) {\n    String name = \"Java\";\n    Optional<String>\
  \ opt = Optional.ofNullable(name);\n\n    // 如果有值，则执行打印\n    opt.ifPresent(val ->\
  \ System.out.println(\"Value is: \" + val));\n  }\n}\n```\n\nOutput:\nValue is:\
  \ Java\n\n## Optional 示例 6：使用 ifPresentOrElse() 执行操作\n\n在此示例中，我们将展示如何使用 `ifPresentOrElse()`\
  \ 方法，根据 `Optional` 是否有值执行不同的操作。\n\n```java\nimport java.util.Optional;\n\npublic\
  \ class Example {\n\n public static void main(String[] args) {\n    String name\
  \ = null;\n    Optional<String> opt = Optional.ofNullable(name);\n\n    // 如果有值则打印，否则执行另一个操作\n\
  \    opt.ifPresentOrElse(\n        val -> System.out.println(\"Value is: \" + val),\n\
  \        () -> System.out.println(\"No value is present\")\n    );\n  }\n}\n```\n\
  \nOutput:\nNo value is present\n\n## Optional 示例 7：使用 map() 转换\n\n在此示例中，我们将展示如何使用\
  \ `map()` 方法对 `Optional` 中的值进行转换。\n\n```java\nimport java.util.Optional;\n\npublic\
  \ class Example {\n\n public static void main(String[] args) {\n    String name\
  \ = \"Java\";\n    Optional<String> opt = Optional.ofNullable(name);\n\n    // 使用\
  \ map 将字符串转换为长度\n    Optional<Integer> length = opt.map(String::length);\n    System.out.println(\"\
  Length: \" + length.orElse(0));\n  }\n}\n```\n\nOutput:\nLength: 4\n\n## Optional\
  \ 示例 8：使用 flatMap() 转换\n\n在此示例中，我们将展示如何使用 `flatMap()` 方法，以避免产生嵌套的 `Optional`。\n\n\
  ```java\nimport java.util.Optional;\n\npublic class Example {\n\n public static\
  \ void main(String[] args) {\n    String name = \"Java\";\n    Optional<String>\
  \ opt = Optional.ofNullable(name);\n\n    // 使用 flatMap 避免嵌套 Optional<Optional<Integer>>\n\
  \    Optional<Integer> length = opt.flatMap(s -> Optional.of(s.length()));\n   \
  \ System.out.println(\"Length: \" + length.orElse(0));\n  }\n}\n```\n\nOutput:\n\
  Length: 4\n\n\n\n\n\n```java\npublic static void main(String[] args) {\n    // 从\
  \ String 创建 Optional 对象\n    Optional<String> GOT = Optional.of(\"Game of Thrones\"\
  );\n\n    // Optional.empty() 创建一个空的 Optional 对象\n    Optional<String> nothing =\
  \ Optional.empty();\n\n    /* isPresent() 方法：检查给定的 Optional\n     * 对象是否为空。\n  \
  \   */\n    if (GOT.isPresent()) {\n        System.out.println(\"Watching Game of\
  \ Thrones\");\n    } else {\n        System.out.println(\"I am getting Bored\");\n\
  \    }\n\n    /* ifPresent() 方法：仅当给定的 Optional\n     * 对象不为空时执行该操作。\n     */\n \
  \   // 因为 GOT 不是空的，此代码将打印内容\n    GOT.ifPresent(s -> System.out.println(\"Watching\
  \ GOT is fun!\"));\n\n    // 因为 nothing 是空的，此代码将不会打印内容\n    nothing.ifPresent(s\
  \ -> System.out.println(\"I prefer getting bored\"));\n}\n```\n\nOutput:\n```\n\
  Watching Game of Thrones\nWatching GOT is fun!\n```\n\n## Java 8 – Optional orElse()\
  \ 和 orElseGet() 方法\n\n这两个方法 `orElse()` 和 `orElseGet()` 在 `Optional` 对象不为空时返回其值；如果对象为空，则会返回作为参数传递给此方法的默认值。\n\
  \n// 导入 Optional 类\n\n```java\nimport java.util.Optional;\n\npublic class Example\
  \ {\n    public static void main(String[] args) {\n        // 从 String 创建 Optional\
  \ 对象\n        Optional<String> GOT = Optional.of(\"Game of Thrones\");\n\n     \
  \   // Optional.empty() 创建一个空的 Optional 对象\n        Optional<String> nothing = Optional.empty();\n\
