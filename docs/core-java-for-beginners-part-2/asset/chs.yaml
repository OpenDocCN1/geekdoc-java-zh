  \         * 由原始 Map 支撑的，因此元素也应该\n         * 从这个 TreeMap 中移除。\n         */\n    \
  \    System.out.println(\"TreeMap Contains : \" + treemap);\n    }\n}\n```\n\nOutput:\n\
