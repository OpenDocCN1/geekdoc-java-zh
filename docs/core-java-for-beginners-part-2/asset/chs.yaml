  \ `static String copyValueOf(char[] data)`：它返回包含指定字符数组字符的字符串。\n\n#### Java – `String\
  \ copyValueOf()` 方法示例\n`copyValueOf()` 方法用于将字符数组复制到 `String`。这里需要注意的一点是，该方法不会追加\
  \ `String` 内容，而是用数组的字符序列替换现有的字符串值。\n\n它有两个变体：\n1. `static copyValueOf(char[] data)`：它将整个数组（`data`）复制到字符串。\n\
  2. `static String copyValueOf(char[] data, int offset, int count)`：使用指定的 `offset`\
  \ 和 `count` 值仅将指定的字符复制到字符串。`offset` 是需要开始复制字符的初始索引，`count` 是要复制的字符数量。例如，`offset\
  \ 2` 和 `count 3` 将被解释为：仅从第 2 个索引开始（由于索引从 0 开始，所以是第 3 个位置）复制数组的 3 个字符到相关的 `String`。\n\
  \n示例：\n在本示例中有两个字符串 `str1` & `str2` 以及一个名为 `data` 的字符数组。我们使用 `copyValueOf()` 方法的两种变体将数组复制到字符串。\n\
  ```java\npublic class CopyValueOfExample {\n    public static void main(String args[])\
  \ {\n        char[] data = {'a','b','c','d','e','f','g','h','i','j','k'};\n    \
  \    String str1 = \"Text\";\n        String str2 = \"String\";\n        // 变体 1:String\
  \ copyValueOf(char[] data)\n        str1 = str1.copyValueOf(data);\n        System.out.println(\"\
  str1 after copy: \" + str1);\n        // 变体 2:String copyValueOf(char[] data,int\
  \ offset,int count)\n        str2 = str2.copyValueOf(data, 5, 3);\n        System.out.println(\"\
  str2 after copy: \" + str2);\n    }\n}\n```\n输出:\n```\nstr1 after copy: abcdefghij\n\
  str2 after copy: fgh\n```\n\n### 36) `static String copyValueOf(char[] data, int\
  \ offset, int count)`：同上，带有 `offset` 和 `count`。\n\n### 37) `void getChars()`：它将指定范围的字符复制到目标。\n\
