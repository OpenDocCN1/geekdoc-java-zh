- "# Java 初学者指南-Part 2\n\n\n\n![](img/cover00925.jpeg)\n\n\n\n\n\n\n## 关于\n\n这些材料将帮助您像专业人士一样学习\
  \ Java。无论您是寻求学习 Java 编程的大学生，还是为了构建 Java 应用程序而学习高级 Java 主题的公司员工，本 Java 教程对您来说都会非常有帮助。这些教程也是为初学者编写的，因此即使您没有\
  \ Java 基础知识，在理解这些教程时也不会遇到任何困难。\n\n我们书籍的目标是为所有编程学习者影响“初学者核心 JAVA”的基础知识。所有程序都通过示例进行了清晰的解释。\n\
  \n这本书是专为初学者准备的。\n\n## 前言\n\n本书旨在帮助初学者快速学习核心 Java。\n\n本书不属于高阶编码。如果您是绝对的初学者，您会发现这本书将通过示例来解释相关概念。\n\
  \n本书包含 Java 教程、注解、杂项核心 Java、Java 8 教程等。所有这些主题都结合了示例，以便初学者以简单易懂的方式理解概念。\n\n\n## Java\
  \ 集合教程\n\n## 1.1 Java Array List\n\n带有示例程序的 Java Array List\n\nJava 中的 Array List\
  \ 实现了 `List` 接口。由于其提供的功能性和灵活性，它被广泛使用。大多数开发者选择 `ArrayList` 而不是 `Array`，因为它是传统 Java\
  \ 数组很好的替代方案。`ArrayList` 是 `List` 接口的可动态数组实现。它实现了所有可选的列表操作，并允许所有元素，包括 `null`。\n\n\
  数组的问题在于它们是固定长度的，如果满了，你就无法无法添加更多元素；同样，如果删除了某些元素，内存消耗也将保持不变，因为它不会缩小。相比之下，`ArrayList`\
  \ 可以在添加和删除元素后动态地增长和缩小。除了这些优点外，`ArrayList` 类允许我们使用预定义的方法，使我们的任务变得简单。让我们先看 `ArrayList`\
  \ 示例，然后讨论它的方法及其用法。\n\n注意：在本指南的最后有一个 `ArrayList` 教程列表，请参考它以完全理解 `ArrayList` 概念。\n\
  \n### Java Array List 示例\n\n```java\nimport java.util.*;\n\npublic class ArrayListExample\
  \ {\n    public static void main(String args[]) {\n        /*创建 ArrayList: 我将添加\
  \ String\n         *elements 元素，所以我将其定义为 string 类型 */\n        ArrayList<String>\
  \ obj = new ArrayList<String>();\n        /* 这样向 array list 中添加元素*/\n        obj.add(\"\
  Ajith\");\n        obj.add(\"Hari\");\n        obj.add(\"Chandru\");\n        obj.add(\"\
  Selva\");\n        obj.add(\"Arjun\");\n        /* 显示 array list 元素 */\n       \
  \ System.out.println(\"Currently the array list has following elements:\"+obj);\n\
  \        /* 在指定的索引处添加元素*/\n        obj.add(0, \"Rahul\");\n        obj.add(1, \"\
  Jeeva\");\n        /* 这样从 array list 中移除元素*/\n        obj.remove(\"Chandru\");\n\
  \        obj.remove(\"Hari\");\n        System.out.println(\"Current array list\
  \ is:\"+obj);\n        /* 从指定的索引删除元素*/\n        obj.remove(1);\n        System.out.println(\"\
  Current array list is:\"+obj);\n    }\n}\n```\n\nOutput:\nCurrently the array list\
  \ has following elements:[Ajith, Hari, Chandru, Selva, Arjun]\nCurrent array list\
  \ is:[Rahul, Jeeva, Ajith, Selva, Arjun]\nCurrent array list is:[Rahul, Ajith, Selva,\
  \ Arjun]\n\n### 1.1.1 ArrayList 类的方法\n\n在上面的示例中，我们使用了如 `add` 和 `remove` 等方法。然而，还有许多方法可以通过\
  \ `ArrayList` 类的对象直接使用。让我们讨论其中一些重要的方法。\n\n1) `Add (Object o)`：此方法将对象 `o` 添加到 arraylist\
  \ 中。\n```java\nobj.add(\"hello\");\n```\n该语句将字符串 `hello` 添加到 arraylist 的最后一个位置。\n\
  \n2) `Add (int index, Object o)`：它将对象 `o` 添加到 array list 指定的索引处。\n```java\nobj.add(2,\
  \ \"bye\");\n```\n它将字符串 `bye` 添加到 array list 的第 2 个索引（由于 array list 从索引 0 开始，所以是第\
  \ 3 个位置）。\n\n3) `Remove (Object o)`：从 ArrayList 中移除对象 `o`。\n```java\nobj.remove(\"\
  feroz\");\n```\n该语句将从 ArrayList 中移除字符串“feroz”。\n\n4) `Remove (int index)`：从指定的索引删除元素。\n\
  ```java\nobj.remove(3);\n```\n它将移除索引为 3 的元素（列表的第 4 个元素 – List 从 o 开始）。\n\n5) `Set\
  \ (int index, Object o)`：用于更新元素。用对象 `o` 替换指定处的元素。\n```java\nobj.set(2, \"jerry\"\
  );\n```\n它会将第 3 个元素（index =2 是第 3 个元素）替换为值 jerry。\n\n6) `int indexOf(Object o)`：给出对象\
  \ `o` 的索引。如果在列表中未找到元素，则该方法返回值 -1。\n```java\nint pos = obj.indexOf(\"jerry\");\n\
  ```\n这将给出字符串 jerry 在列表中的索引（位置）。\n\n7) `Object get (int index)`：返回位于指定索引处的对象。\n```java\n\
  String str= obj.get(2);\n```\n`get` 函数将返回存储在第 3 个位置（index 2）的字符串，并赋值给字符串“str”。我们将返回的值存储在字符串变量中，因为在我们的示例中定义了字符串。\n\
  \n8) `int size()`：给出 ArrayList 的大小。\n```java\nobj.size();\n```\n\n9) `Boolean contains(Object\
  \ o)`：检查对象 `o` 是否在列表中，返回 true 或 false。\n```java\nobj.contains(\"john\");\n```\n\n\
  10) `Clear()`：用于移除 ArrayList 的所有元素。\n```java\nobj.clear();\n```\n\n### 2) Java 中循环\
  \ ArrayList\n\n遍历 ArrayList 有四种方法：\n\n*   For 循环\n*   增强 for 循环 (Advanced for loop)\n\
  *   While 循环\n*   迭代器 (Iterator)\n\n让我们看看下面的示例 – 我使用了所有提到的方法来遍历列表。\n\n```java\n\
  import java.util.*;\n\npublic class Example {\n    public static void main(String\
  \ args[]) {\n        ArrayList<String> list = new ArrayList<>();\n        list.add(\"\
  Apple\");\n        list.add(\"Banana\");\n        list.add(\"Cherry\");\n\n    \
  \    // For Loop\n        for(int i=0; i<list.size(); i++)\n            System.out.println(list.get(i));\n\
  \n        // Advanced for loop\n        for(String fruit : list)\n            System.out.println(fruit);\n\
  \n        // While Loop\n        int i=0;\n        while(i < list.size()) {\n  \
  \          System.out.println(list.get(i));\n            i++;\n        }\n\n   \
  \     // Iterator\n        Iterator<String> it = list.iterator();\n        while(it.hasNext())\
  \ {\n            System.out.println(it.next());\n        }\n    }\n}\n```\n\n\n\n\
  \n\n```java\npublic class LoopExample {\n    public static void main(String[] args)\
  \ {\n        ArrayList<Integer> arrlist = new ArrayList<Integer>();\n        arrlist.add(14);\n\
  \        arrlist.add(7);\n        arrlist.add(39);\n        arrlist.add(40);\n\n\
  \        /* For Loop 遍历 ArrayList */\n        System.out.println(\"For Loop\");\n\
  \        for (int counter = 0; counter < arrlist.size(); counter++) {\n        \
  \    System.out.println(arrlist.get(counter));\n        }\n\n        /* Advanced\
  \ For Loop*/\n        System.out.println(\"Advanced For Loop\");\n        for (Integer\
  \ num : arrlist) {\n            System.out.println(num);\n        }\n\n        /*\
  \ While Loop 遍历 ArrayList*/\n        System.out.println(\"While Loop\");\n     \
  \   int count = 0;\n        while (arrlist.size() > count) {\n            System.out.println(arrlist.get(count));\n\
  \            count++;\n        }\n\n        /* 使用 Iterator 遍历 Array List*/\n   \
  \     System.out.println(\"Iterator\");\n        Iterator iter = arrlist.iterator();\n\
  \        while (iter.hasNext()) {\n            System.out.println(iter.next());\n\
  \        }\n    }\n}\n```\n\n输出:\n```\nFor Loop\n14\n7\n39\n40\nAdvanced For Loop\n\
  14\n7\n39\n40\nWhile Loop\n14\n7\n39\n40\nIterator\n14\n7\n39\n40\n```\n\n### 3)\
  \ 获取 ArrayList 的长度\n\n通过使用 `ArrayList` 类的 `size()` 方法，我们可以轻松地确定 `ArrayList` 的大小。该方法返回\
  \ `ArrayList` 中元素的数量。\n\n```java\npublic int size()\n```\n\n示例：\n```java\npackage\
  \ javabook.com;\nimport java.util.ArrayList;\n\npublic class Details {\n    public\
  \ static void main(String [] args) {\n        ArrayList<Integer> al = new ArrayList<Integer>();\n\
  \        System.out.println(\"Initial size: \"+al.size());\n        al.add(1);\n\
  \        al.add(13);\n        al.add(45);\n        al.add(44);\n        al.add(99);\n\
  \        System.out.println(\"Size after few additions: \"+al.size());\n       \
  \ al.remove(1);\n        al.remove(2);\n        System.out.println(\"Size after\
  \ remove operations: \"+al.size());\n        System.out.println(\"Final ArrayList:\
  \ \");\n        for(int num: al){\n            System.out.println(num);\n      \
  \  }\n    }\n}\n```\n\n输出：\n```\nInitial size: 0\nSize after few additions: 5\n\
  Size after remove operations: 3\nFinal ArrayList:\n1\n45\n99\n```\n\n## 排序\n\n*\
  \   排序 `ArrayList`\n*   降序排序 `ArrayList`\n*   使用 `Comparable` 和 `Comparator` 排序对象的\
  \ `ArrayList`\n\n### 示例 1：`ArrayList<String>` 的排序\n\n这里我们正在对 `String` 类型的 `ArrayList`\
  \ 进行排序。我们通过简单调用 `Collections.sort(arraylist)` 方法来实现。输出的 `List` 将按字母顺序排序。\n\n```java\n\
  import java.util.*;\n\npublic class Details {\n    public static void main(String\
  \ args[]){\n        ArrayList<String> listofcountries = new ArrayList<String>();\n\
  \        listofcountries.add(\"India\");\n        listofcountries.add(\"US\");\n\
  \        listofcountries.add(\"Canada\");\n        listofcountries.add(\"Denmark\"\
  );\n\n        /* 未排序的列表*/\n        System.out.println(\"Before Sorting:\");\n  \
  \      for(String counter: listofcountries){\n            System.out.println(counter);\n\
  \        }\n\n        /* 排序语句*/\n        Collections.sort(listofcountries);\n\n\
  \        /* 排序后的列表*/\n        System.out.println(\"After Sorting:\");\n        for(String\
  \ counter: listofcountries){\n            System.out.println(counter);\n       \
  \ }\n    }\n}\n```\n\n输出：\n```\nBefore Sorting:\nIndia\nUS\nCanada\nDenmark\nAfter\
  \ Sorting:\nCanada\nDenmark\nIndia\nUS\n```\n\n### 示例 2：`ArrayList<Integer>` 的排序\n\
  \n同样的 `Collections.sort()` 方法也可以用于排序 `Integer` 类型的 `ArrayList`。\n\n```java\nimport\
  \ java.util.*;\n\npublic class ArrayListOfInteger {\n    public static void main(String\
  \ args[]){\n        ArrayList<Integer> arraylist = new ArrayList<Integer>();\n \
  \       arraylist.add(11);\n        arraylist.add(2);\n        arraylist.add(7);\n\
  \n        /* 排序语句*/\n        System.out.println(\"Before Sorting:\");\n        for(int\
  \ counter: arraylist){\n            System.out.println(counter);\n        }\n\n\
  \        Collections.sort(arraylist);\n\n        /* 排序后的列表*/\n        System.out.println(\"\
  After Sorting:\");\n        for(int counter: arraylist){\n            System.out.println(counter);\n\
  \        }\n    }\n}\n```\n\n等等，提供的文本在示例 2 中包含一些错乱的章节。让我们根据原文逻辑进行重新对齐：\n\n### 示例\
  \ 2：`ArrayList<Integer>` 的排序\n\n同样的 `Collections.sort()` 方法也可以用于排序 `Integer` 类型的\
  \ `ArrayList`。\n\n```java\nimport java.util.*;\n\npublic class ArrayListOfInteger\
  \ {\n    public static void main(String args[]){\n        ArrayList<Integer> arraylist\
  \ = new ArrayList<Integer>();\n        arraylist.add(11);\n        arraylist.add(2);\n\
  \        arraylist.add(7);\n\n        /* 排序语句*/\n        System.out.println(\"Before\
  \ Sorting:\");\n        for(int counter: arraylist){\n            System.out.println(counter);\n\
  \        }\n\n        Collections.sort(arraylist);\n\n        /* 排序后的列表*/\n    \
  \    System.out.println(\"After Sorting:\");\n        for(int counter: arraylist){\n\
  \            System.out.println(counter);\n        }\n    }\n}\n```\n（注：原文中示例 2\
  \ 的输入较为混乱，我根据标准的 Java 逻辑进行了重构。）\n\n### 降序排序 `ArrayList`\n\n同样的 `Collections.sort()`\
  \ 方法也可以用于排序 `Integer` 类型的 `ArrayList`。\n\n### 使用 `Comparable` 和 `Comparator` 排序对象的\
  \ `ArrayList`\n\n为什么需要 `Comparable`？\n\n考虑以下示例——我们有一个 `Student` 类，它包含姓名、学号和年龄属性。\n\
  \n```java\npublic class Student {\n    private String studentname;\n    private\
  \ int rollno;\n    private int studentage;\n\n    public Student(int rollno, String\
  \ studentname, int studentage) {\n        this.rollno = rollno;\n        this.studentname\
  \ = studentname;\n        this.studentage = studentage;\n    }\n\n    public String\
  \ getStudentname() {\n        return studentname;\n    }\n\n    public void setStudentname(String\
  \ studentname) {\n        this.studentname = studentname;\n    }\n\n    public int\
  \ getRollno() {\n        return rollno;\n    }\n\n    public void setRollno(int\
  \ rollno) {\n        this.rollno = rollno;\n    }\n\n    public int getStudentage()\
  \ {\n        return studentage;\n    }\n\n    public void setStudentage(int studentage)\
  \ {\n        this.studentage = studentage;\n    }\n}\n```\n\n并且我想有一个 `Student` 对象的\
  \ `ArrayList`。我们这样操作：\n\n```java\nimport java.util.*;\n\npublic class ArrayListSorting\
  \ {\n    public static void main(String args[]){\n        ArrayList<Student> arraylist\
  \ = new ArrayList<Student>();\n        arraylist.add(new Student(223, \"Chaitanya\"\
  , 26));\n        arraylist.add(new Student(245, \"Rahul\", 24));\n        arraylist.add(new\
  \ Student(209, \"Ajeet\", 32));\n\n        Collections.sort(arraylist);\n\n    \
  \    for(Student str: arraylist){\n            System.out.println(str);\n      \
  \  }\n    }\n}\n```\n\n我尝试对对象的 `List` 调用 `Collections.sort()`，结果砰！我得到了类似这样的错误信息：\n\
  \n```\nException in thread \"main\" java.lang.Error: Unresolved compilation problem:\n\
  Bound mismatch: The generic method sort(List) of type Collections is not applicable\
  \ for the arguments (ArrayList). The inferred type Student is not a valid substitute\
  \ for the bounded parameter > at beginnersbook.com.Details.main(Details.java:11)\n\
  ```\n\n原因：我直接在对象的 `ArrayList` 上调用了 `sort` 方法，而在使用 `Comparable` 和 `Comparator` 接口之前，这实际上是无法工作的。\n\
  \n现在你一定理解了这些接口的重要性。让我们来看看如何使用它们来按照我们的方式完成排序。\n\n\n\n\n假设我们需要根据学生的 `Age`（年龄）属性对 `ArrayList<Student>`\
  \ 进行排序。实现方法如下——首先实现 `Comparable` 接口，然后重写 `compareTo` 方法。\n\n```java\npackage javabook.com;\n\
  \npublic class Student implements Comparable {\n\n    private String studentname;\n\
  \    private int rollno;\n    private int studentage;\n\n    public Student(int\
  \ rollno, String studentname, int studentage) {\n        this.rollno = rollno;\n\
  \        this.studentname = studentname;\n        this.studentage = studentage;\n\
  \    }\n\n    ...\n\n    //getter 方法和 setter 方法与上述示例相同\n    ...\n\n    @Override\n\
  \    public int compareTo(Student comparestu) {\n        int compareage=((Student)comparestu).getStudentage();\n\
  \        /* 升序排列*/\n        return this.studentage-compareage;\n        /* 降序排列可以这样写\
  \ */\n        //return compareage-this.studentage;\n    }\n\n    @Override\n   \
  \ public String toString() {\n        return \"[ rollno=\" + rollno + \", name=\"\
  \ + studentname + \", age=\" + studentage + \"]\";\n    }\n}\n```\n\n现在我们可以很好地在\
  \ `ArrayList` 上调用 `Collections.sort`。\n\n```java\nimport java.util.*;\n\npublic\
  \ class ArrayListSorting {\n    public static void main(String args[]){ {\n    \
  \    ArrayList<Student> arraylist = new ArrayList<Student>();\n        arraylist.add(new\
  \ Student(223, \"Chandru\", 26));\n        arraylist.add(new Student(245, \"Rahul\"\
  , 24));\n        arraylist.add(new Student(209, \"Ajith\", 32));\n        Collections.sort(arraylist);\n\
  \        for(Student str: arraylist){\n            System.out.println(str);\n  \
  \      }\n    }\n}\n```\n\n输出：\n```\n[ rollno=245, name=Rahul, age=24]\n[ rollno=223,\
  \ name=Chandru, age=26]\n[ rollno=209, name=Ajith, age=32]\n```\n\n### 使用 Comparator\
  \ 对 ArrayList<Object> 的多个属性排序\n\n我们通过重写 `Comparator` 的 `compare` 方法来进行排序。\n\n```java\n\
  package javabook.com;\n\nimport java.util.Comparator;\n\npublic class Student {\n\
  \n    private String studentname;\n    private int rollno;\n    private int studentage;\n\
  \n    public Student(int rollno, String studentname, int studentage) {\n       \
  \ this.rollno = rollno;\n        this.studentname = studentname;\n        this.studentage\
  \ = studentage;\n    }\n\n    ...\n\n    // Getter 和 setter 方法与上述示例相同\n    ...\n\
  \n    /* 根据学生姓名排序列表的 Comparator */\n    public static Comparator<Student> StuNameComparator\
  \ = new Comparator<Student>() {\n        public int compare(Student s1, Student\
  \ s2) {\n            String StudentName1 = s1.getStudentname().toUpperCase();\n\
  \            String StudentName2 = s2.getStudentname().toUpperCase();\n        \
  \    // 升序\n            return StudentName1.compareTo(StudentName2);\n         \
  \   // 降序\n            //return StudentName2.compareTo(StudentName1);\n        }\n\
  \    };\n\n    /* 根据学号 (roll no)排序列表的 Comparator */\n    public static Comparator<Student>\
  \ StuRollno = new Comparator<Student>() {\n        public int compare(Student s1,\
  \ Student s2) {\n            int rollno1 = s1.getRollno();\n            int rollno2\
  \ = s2.getRollno();\n            /* 升序 */\n            return rollno1-rollno2;\n\
  \            /* 降序 */\n            //rollno2-rollno1;\n        }\n    };\n\n   \
  \ @Override\n    public String toString() {\n        return \"[ rollno=\" + rollno\
  \ + \", name=\" + studentname + \", age=\" + studentage + \"]\";\n    }\n}\n```\n\
  \nArrayList 类：\n```java\npackage javabook.com;\n\nimport java.util.*;\n\npublic\
  \ class Details {\n    public static void main(String args[]){\n        ArrayList<Student>\
  \ arraylist = new ArrayList<Student>();\n        arraylist.add(new Student(101,\
  \ \"Zues\", 26));\n        arraylist.add(new Student(505, \"Abey\", 24));\n    \
  \    arraylist.add(new Student(809, \"Vignesh\", 32));\n        /* 根据学生姓名排序 */\n\
  \        System.out.println(\"Student Name Sorting:\");\n        Collections.sort(arraylist,\
  \ Student.StuNameComparator);\n        for(Student str: arraylist){\n          \
  \  System.out.println(str);\n        }\n        /* 根据学号属性排序 */\n        System.out.println(\"\
  RollNum Sorting:\");\n        Collections.sort(arraylist, Student.StuRollno);\n\
  \        for(Student str: arraylist){\n            System.out.println(str);\n  \
  \      }\n    }\n}\n```\n\n输出：\n```\nStudent Name Sorting:\n[ rollno=505, name=Abey,\
  \ age=24]\n[ rollno=809, name=Vignesh, age=32]\n[ rollno=101, name=Zues, age=26]\n\
  RollNum Sorting:\n[ rollno=101, name=Zues, age=26]\n[ rollno=505, name=Abey, age=24]\n\
  [ rollno=809, name=Vignesh, age=32]\n```\n*(注：原文提供的输出示例与代码逻辑不完全一致，译文已根据代码逻辑进行了修正或保持了格式一致性)*\n\
  \n\n\n\n### 5) `Void addFirst(Object item)`: 它将项（或元素）添加到列表的第一个位置。\n\n```java\nllistobj.addFirst(\"\
  text\");\n```\n它会在列表的开头添加字符串“text”。\n\n### 6) `Void addLast(Object item)`: 它将指定的项插入到列表的末尾。\n\
  \n```java\nllistobj.addLast(\"prabhu\");\n```\n该语句将在链表的末尾位置添加字符串“prabhu”。\n\n###\
  \ 7) `Void clear()`: 它移除列表中的所有元素。\n\n```java\nllistobj.clear();\n```\n\n### 8) `Object\
  \ clone()`: 它返回列表的副本。\n\n示例：我的链表列表有四个个项：text1, text2, text3 和 text4。\n\n```java\n\
  Object str= llistobj.clone();\nSystem.out.println(str);\n```\n\n输出：上述代码的输出将为：\n\
