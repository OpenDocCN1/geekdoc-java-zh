  \        // 一行内拼接的另一种方法\n        String str2 = \"This\";\n        str2 = str2.concat(\"\
  \ is\").concat(\" just a\").concat(\" String\");\n        System.out.println(str2);\n\
  \    }\n}\n```\n**输出：**\nWelcome to String handling\nThis is just a String\n\n###\
  \ String replace(char oldChar, char newChar)\n在将所有 `oldChar` 替换为 `newChar` 后返回更新后的字符串。\n\
  \n#### Java – String replace(), replaceFirst() and replaceAll() 方法\n在本教程中，我们将讨论\
  \ `replace()`、`replaceFirst()` 和 `replaceAll()` 方法。这些方法主要用于用另一个替换 `String` 的部分。\n\
  \n- `String replace(char oldChar, char newChar)`：它将所有 `oldChar` 字符替换为 `newChar`。例如，`\"\
  pance\".replace('p', 'd')` 将返回 dance。\n- `String replaceFirst(String regex, String\
  \ replacement)`：它将第一个符合指定正则表达式的子字符串替换为替换内容。如果表达式无效则抛出 `PatternException`。\n- `String\
  \ replaceAll(String regex, String replacement)`：它将所有符合给定正则表达式的子字符串替换为替换内容。\n\n####\
  \ 示例 1: replace() 方法\n```java\npublic class Example1 {\n    public static main(String\
  \ args[]) {\n        String str = new String(\"Site is javaBook.com\");\n      \
