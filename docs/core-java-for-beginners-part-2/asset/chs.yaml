  \nJava 8 `StringJoiner` 示例。\n\n在 Java 8 中，`java.util` 包中引入了一个新类 `StringJoiner`。使用该类，我们可以用指定的分隔符连接多个字符串，在连接多个字符串时，我们还可以为最终的字符串提供前缀和后缀。在本教程中，我们将看到\
  \ `StringJoiner` 类的几个示例，并在本文指南的末尾，我们将介绍 `StringJoiner` 类的方法。\n\n## Java StringJoiner\
  \ 示例 1：通过指定分隔符连接字符串\n\n在此示例中，我们正在使用 `StringJoiner` 拼接多个字符串。在创建 `StringJoiner` 实例时，我们指定的分隔符指定为连字符(-)。\n\
  \n```java\nimport java.util.StringJoiner; \n\npublic class Example {\n\n public\
  \ static void main(String[] args) { \n // 将连字符(-) 作为分隔符\n StringJoiner mystring\
  \ = new StringJoiner(\"-\"); \n // 使用 add() 方法连接多个字符串 \n mystring.add(\"Logan\"\
