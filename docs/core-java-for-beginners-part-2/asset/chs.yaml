  正向遍历：\nItem1\nItem2\nItem3\nItem4\nItem5\n反向遍历：\nItem5\nItem4\nItem3\nItem2\nItem1\n\
  \n## Vector 转换为 List\n\n步骤如下：\n1) 创建一个 `Vector` 并填充元素。\n2) 通过调用 `elements()` 方法转换为\
  \ `List` 对象。\n\n### 示例：\n为了解释逻辑，我们假设 `Vector` 拥有字符串元素。如果你有不同的类型，请更改代码中的泛型。\n\n```java\n\
  import java.util.Vector;\nimport java.util.List;\nimport java.util.Collections;\n\
