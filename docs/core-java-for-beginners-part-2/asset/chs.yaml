  \ 1.23 Java 集合中的 Queue 接口\n\n队列（Queue）的设计使得添加到它的元素放置在队列末尾，并从队列头部移除。这里的概念与我们日常生活中看到的队列相似，例如，当新款\
  \ iPhone 发布时，我们在苹果商店外排队，任何加入队列的人都必须站在末尾，并根据先入先出（FIFO）原则提供服务。拿到 iPhone 的人从队列头部移除。\n\
  \n![](img/image00918.jpeg)\n\nJava 集合中的 Queue 接口有两个实现：`LinkedList` 和 `PriorityQueue`，这两个类实现了\
  \ Queue 接口。Queue 是一个接口，因此我们不能实例化它，而是创建 `LinkedList` 或 `PriorityQueue` 的实例并将其赋值给\
  \ `Queue`，如下：\n`Queue q1 = new LinkedList();`\n`Queue q2 = new PriorityQueue();`\n\
  \n### 示例:\n```java\nimport java.util.*;\n\npublic class QueueExample1 {\n public\
  \ static void main(String[] args) {\n /*\n  * 我们不能创建 Queue 的实例，因为它是一个接口，\n  * 我们可以创建\
  \ LinkedList 或\n  * PriorityQueue 的实例并将其赋值给 Queue\n  */\n  Queue<String> q = new\
  \ LinkedList<String>();\n  // 向队列中添加元素\n  q.add(\"Rick\");\n  q.add(\"Maggie\");\n\
  \  q.add(\"Glenn\");\n  q.add(\"Negan\");\n  q.add(\"Daryl\");\n  System.out.println(\"\
  Elements in Queue:\"+q);\n  /*\n  * 可以使用 remove() 方法从队列中移除元素，\n  * 这将移除队列中的第一个元素\n\
  \  */\n  System.out.println(\"Removed element: \"+q.remove());\n  /*\n   * element()\
  \ 方法 - 返回队列的头部。\n   * 头部是队列的第一个元素\n   */\n  System.out.println(\"Head: \"+q.element());\n\
  \   /*\n   * poll() 方法 - 移除并返回队列的头部。\n   * 如果队列为空则返回 null\n   */\n }\n}\n```\n\n\
  \n\n\n```java\nSystem.out.println(\"poll(): \"+q.poll());\n\n/*\n * peek() 方法 -它的工作原理与\
  \ element() 方法相同，\n * 但如果队列为空，它将返回 null\n */\nSystem.out.println(\"peek(): \"+q.peek());\n\
  \n//再次显示队列中的元素\nSystem.out.println(\"Elements in Queue:\"+q);\n\n  }\n}\n```\n\n\
  ### 输出:\nElements  in Queue:[Rick, Maggie, Glenn, Negan, Daryl]\nRemoved element:\
  \ Rick\nHead: Maggie\npoll(): Maggie\npeek(): Glenn\nElements  in Queue:[Glenn,\
  \ Negan, Daryl]\n\n在上面的示例中，我使用了 `Generics`（泛型），这有助于我们指定要插入到集合中的元素类型。如你所见，我使用 `Generics`\
  \ 将 `Queue` 的类型指定为 `String`，这样它就只接受 `String` 元素。如果你尝试添加未指定类型的元素，你将得到编译错误，这为我们的程序增加了安全性，并减少了出现错误的概率。\n\
  \n### `Queue` 接口的方法\n\n- `boolean add(E e)`: 此方法将指定的元素添加到 `Queue` 的末尾。如果元素添加成功则返回\
  \ `true`，如果元素未添加则返回 `false`，这通常发生在 `Queue` 达到最大容量无法容更多元素时。\n- `E element()`: 此方法返回\
  \ `Queue` 的头部（第一个元素）。\n- `boolean offer(object)`: 这与 `add()` 方法相同。\n- `E remove()`:\
  \ 此方法移除 `Queue` 的头部（第一个元素）并返回其值。\n- `E poll()`: 此方法与 `remove()` 方法几乎相同。`poll()`\
  \ 和 `remove()` 唯一区别在于如果 `Queue` 为空，`poll()` 方法返回 `null`。\n- `E peek()`: 此方法与 `element()`\
  \ 方法几乎相同。`peek()` 和 `element()` 唯一区别在于如果 `Queue` 为空，`peek()` 方法返回 `null`。\n\n**注意：**\
  \ 我们已经看到 `queue` 如何根据 `FIFO`（先进先出）处理请求。如果我们想根据优先级而不是 FIFO 来处理请求呢？这可以通过 `PriorityQueue`\
  \ 实现，它根据我们使用 `Comparator` 设置的优先级来处理请求。\n\n## 1.24 Java 集合中的 PriorityQueue 接口\n\n\
  在上一个教程中，我们学习了 `Queue` 如何根据 `FIFO`（先进先出）处理请求。现在问题是：如果我们想根据优先级而不是 FIFO 来处理请求呢？在实际场景中，这种解决方案会更青青，因为它在本质上更动态、更高效。这可以通过\
  \ `PriorityQueue` 实现，它根据我们使用 `Comparator` 设置的优先级来处理请求。\n\n### Java PriorityQueue\
  \ 示例\n\n在此示例中，我向 `PriorityQueue` 添加了几个 `Strings`，在创建 `PriorityQueue` 时，我将 `Comparator`（命名为\
  \ `MyComparator`）传递给 `PriorityQueue` 构造函数。\n\n在 `MyComparator` Java 类中，我根据长度对 `Strings`\
  \ 进行排序，这意味着我在 `PriorityQueue` 中设置的优先级是 `String` 的长度。这样，我确保了最短的字符串会被优先处理，而不是先添加的字符串。\n\
  \n#### PriorityQueueExample.java\n```java\nimport java.util.PriorityQueue;\n\npublic\
  \ class PriorityQueueExample {\n    public static void main(String[] args) {\n \
  \       PriorityQueue<String> queue = new PriorityQueue<String>(15, new MyComparator());\n\
  \        queue.add(\"Tyrion Lannister\");\n        queue.add(\"Daenerys Targaryen\"\
  );\n        queue.add(\"Arya Stark\");\n        queue.add(\"Petyr 'Littlefinger'\
  \ Baelish\");\n\n        /*\n         * 我在这里做的是从队列中移除\n         * 优先级最高的元素并显示它。\n\
  \         * 我设置的优先级基于字符串\n         * 长度。该逻辑写在 Comparator 中。\n         */\n     \
  \   while (queue.size() != 0) {\n            System.out.println(queue.poll());\n\
  \        }\n    }\n}\n```\n\n#### MyComparator.java\n```java\nimport java.util.Comparator;\n\
  \npublic class MyComparator implements Comparator<String> {\n  @Override\n  public\
  \ int compare(String x, String y) {\n    return x.length() - y.length();\n  }\n\
  }\n```\n\n### 输出:\nArya Stark\nTyrion Lannister\nDaenerys Targaryen\nPetyr 'Littlefinger'\
  \ Baelish\n\n### PriorityQueue 类的方法\n\n- `boolean add(E e)`: 将元素添加到 `PriorityQueue`\
  \ 中。\n- `void clear()`: 此方法从 `PriorityQueue` 中移除所有元素。\n- `boolean contains(Element\
  \ e)`: 如果指定的元素存在于 `Queue` 中，此方法返回 `true`。\n- `boolean Offer(E e)`: 与 `add()` 方法相同。\n\
  - `E peek()`: 返回 `Queue` 的头部（第一个元素）。\n- `E poll()`: 移除并返回 `Queue` 的头部。\n- `boolean\
  \ remove(E e)`: 此方法从 `Queue` 中移除指定的元素，如果删除成功返回 `true`。如果指定的元素不在 `Queue` 中，则返回 `false`。\n\
  - `int size()`: 返回 `Queue` 的大小。\n- `object[] toArray()`: 返回包含所有元素的数组。\n\n## 1.25\
  \ Java 集合中的 Deque 接口\n\n`Queue` 如何根据 `FIFO`（先进先出）处理请求。现在问题是：如果我们想根据优先级而不是 FIFO 来处理请求呢？在实际场景中，这种解决方案会更受欢迎，因为它在本质上更动态、更高效。这可以通过\
  \ `PriorityQueue` 实现，它根据我们使用 `Comparator` 设置的优先级来处理请求。\n\n`Deque` 能够从两端（头部或尾部）添加或移除元素，另一方面，从\
  \ `ArrayList` 中移除最后一个元素需要 O(n) 时间，因为它需要遍历整个列表到达末尾。所以，如果你想从两端添加或移除元素，请选择 `ArrayDeque`\
  \ 而不是 `ArrayList`；如果你只想对尾部（末尾）执行操作，那么你应该选择 `ArrayList`。\n\n`Deque`（双端队列）是一个接口，允许从两端进行入队和出队。它遵循\
  \ `FIFO`（先进先出），在 `PriorityQueue` 示例中，我们看到了如何根据优先级移除元素。`Deque` 的实现包括 `LinkedList`\
  \ 和 `ArrayDeque`，我们可以这样创建 `Deque` ：\n\n#### 示例:\n```java\nimport java.util.Deque;\n\
  import java.util.ArrayDeque;\n\npublic class DequeExample {\n    public static void\
  \ main(String[] args) {\n        /*\n         * 我们可以创建 Deque 实例\n         */\n \
  \       Deque<String> dq = new ArrayDeque<>();\n\n        /*\n         * 向 Deque\
  \ 添加元素。\n         * addFirst() 将元素添加到开头\n         * addLast() 方法将其添加到末尾。\n     \
  \    */\n        dq.add(\"Glenn\");\n        dq.add(\"Negan\");\n        dq.addLast(\"\
  Maggie\");\n        dq.addFirst(\"Rick\");\n        dq.add(\"Daryl\");\n\n     \
  \   System.out.println(\"Elements in Deque:\"+dq);\n\n        /*\n         * 我们可以使用\
  \ remove() 方法从 Deque 中移除元素，\n         * 我们可以使用 removeFirst() 和 removeLast() 方法\n\
  \         * 移除首尾元素。\n         */\n        System.out.println(\"Removed element:\
  \ \"+dq.removeLast());\n\n        /*\n         * element() 方法 - 返回 Deque 的头部。  \
  \                * 是 Deque 的第一个元素\n         */\n        System.out.println(\"Head:\
  \ \"+dq.element());\n\n        /*\n         * pollLast() 方法 - 此方法移除并返回\n       \
  \  * Deque 的尾（最后一个元素）。如果 Deque 为空\n         * 则返回 null。我们也可以使用 poll() 或 pollFirst()\n\
  \         * 来移除 Deque 的第一个元素。\n         */\n        System.out.println(\"poll():\
  \ \"+dq.pollLast());\n\n        /*\n         * peek() 方法 - 它的工作原理与 element() 方法相同，\n\
  \         * 但如果 Deque 为空，它将返回 null。我们可以\n         * 使用 peekFirst() 和 peekLast()\
  \ 获取第一个和\n         * 最后一个元素\n         */\n        System.out.println(\"peek(): \"\
  +dq.peek());\n\n        //再次打印 Deque 中的元素\n        System.out.println(\"Elements\
  \ in Deque:\"+dq);\n    }\n}\n```\n\n### 输出:\nElements  in Deque:[Rick, Glenn, Negan,\
  \ Maggie, Daryl]\nRemoved element: Daryl\nHead: Rick\npoll(): Maggie\npeek(): Rick\n\
  Elements  in Deque:[Rick, Glenn, Negan]\n\n### `Deque` 接口的方法\n\n- `void addFirst(E\
  \ e)`: 将指定的元素插入到 `Deque` 的开头。\n\n\n\n\n\n`void addLast(E e)`: 将指定的元素插入到 `Deque`\
  \ 的末尾。\n\n`boolean contains(Object o)`: 如果指定的元素存在于 `Deque` 中，则返回 true。\n\n`E getFirst()`:\
  \ 返回 `Deque` 的第一个元素。\n\n`E getLast()`: 返回 `Deque` 的最后一个元素。\n\n`E peekFirst()`: 返回\
  \ `Deque` 的第一个元素，如果 `Deque` 为空则返回 null。\n\n`E peekLast()`: 返回 `Deque` 的最后一个元素，如果\
  \ `Deque` 为空则返回 null。\n\n`E pollFirst()`: 返回并移除 `Deque` 的第一个元素，如果 `Deque` 为空则返回\
  \ null。\n\n`E pollLast()`: 返回并移除 `Deque` 的最后一个元素，如果 `Deque` 为空则返回 null。\n\n`int\
  \ size()`: 返回 `Deque` 中存在的元素数量。\n\n## 1.26 Java 中的 Comparable 接口\n\n带示例的 Java Comparable\
  \ 接口\n\n`Comparable` 接口主要用于对自定义对象的数组（或列表）进行排序。\n\n实现了 `Comparable` 接口的对象的列表（和数组）可以通过\
  \ `Collections.sort()`（以及 `Arrays.sort()`）自动排序。在我们学习如何对自定义对象排序之前，让我们先来看如何对已经实现了\
  \ `Comparable` 的数组元素和包装类进行排序。\n\n### 示例：排序数组和包装类\n\n```java\nimport java.util.ArrayList;\n\
  import java.util.Arrays;\nimport java.util.Collections;\nimport java.util.List;\n\
  \npublic class Demo {\n    public static void main(String[] args) {\n        /*\n\
  \         * Integer 类实现了 Comparable\n         * 接口，所以我们可以使用 sort 方法\n         */\n\
  \        int[] arr = {11,55,22,0,89};\n        Arrays.sort(arr);\n        System.out.print(\"\
  Sorted Int Array: \");\n        System.out.println(Arrays.toString(arr));\n\n  \
  \      /*\n         * String 类实现了 Comparable\n         * 接口，所以我们可以使用 sort 方法\n \
  \        */\n        System.out.print(\"Sorted String Array: \");\n        String[]\
  \ names = {\"Steve\", \"Ajith\", \"Kyle\"};\n        Arrays.sort(names);\n     \
  \   System.out.println(Arrays.toString(names));\n\n        /*\n         * String\
  \ 类实现了 Comparable\n         * 接口，所以我们可以使用 sort 方法\n         */\n        System.out.print(\"\
  Sorted List: \");\n        List fruits = new ArrayList();\n        fruits.add(\"\
  Orange\");\n        fruits.add(\"Banana\");\n        fruits.add(\"Apple\");\n  \
  \      fruits.add(\"Guava\");\n        fruits.add(\"Grapes\");\n        Collections.sort(fruits);\n\
  \        for(String s: fruits) System.out.print(s+\", \");\n    }\n}\n```\n\n输出：\n\
  ```\nSorted Int Array: [0, 11, 22, 55, 89]\nSorted String Array: [Ajith, Kyle, Steve]\n\
  Sorted List: Apple, Banana, Grapes, Guava, Orange,\n```\n\n在上面的示例中，你已经看到对实现了 `Comparable`\
  \ 接口的数组和对象列表进行排序有多简单，你只需要调用 `Collections.sort()`（以及 `Arrays.sort()`）即可。\n\n然而，如果你想对自定义类的对象进行排序，那么你需要在自定义类中实现\
  \ `Comparable` 接口。\n\n该接口只有一个方法：\n`public abstract int compareTo(T obj)`\n\n由于该方法是抽象的，如果你实现了\
  \ `Comparable` 接口，必须在你的类中实现该方法。\n\n让我们通过一个例子来更好地理解：\n\n### 示例：通过实现 Comparable 接口排序自定义对象\n\
  \n如你所见，我在 `Author` 类中实现了 `Comparable` 接口，因为我想对该类的对象进行排序。我在 `compareTo()` 方法中写了排序逻辑，你可以根据需求编写逻辑。我想先按姓对作者名进行排序，如果姓相同，再按名排序。如果你只想按姓排序，那么\
  \ `compareTo()` 方法内部的第一行就足够了。\n\n#### Author 类\n\n```java\npublic class Author implements\
  \ Comparable<Author> {\n    String firstName;\n    String lastName;\n    String\
  \ bookName;\n\n    Author(String first, String last, String book){\n        this.firstName\
  \ = first;\n        this.lastName = last;\n        this.bookName = book;\n    }\n\
  \n    @Override\n    /*\n     * 这是我们编写排序逻辑的地方。该方法在姓\n     * 相同的情况下会自动按名进行排序。\n \
  \    */\n    public int compareTo(Author au){\n        /*\n         * 按姓排序。如果 this(关键字)\
  \ \n         * 小于 au，compareTo 应返回 < 0；如果它\n         * 大于对象 au 则返回 > 0；如果它们相等则返回\
  \ 0。\n         */\n        int last = this.lastName.compareTo(au.lastName);\n  \
  \      // 如果姓相同，则按名排序\n        return last == 0 ? this.firstName.compareTo(au.firstName)\
  \ : last;\n    }\n}\n```\n\n#### 排序类：SortAuthByNames\n\n```java\nimport java.util.ArrayList;\n\
  import java.util.Collections;\n\npublic class SortAuthByNames{\n    public static\
  \ void main(String args[]){\n        // Author 类的对象列表\n        ArrayList<Author>\
  \ al=new ArrayList<Author>();\n        al.add(new Author(\"Henry\",\"Miller\",\"\
  Tropic of Cancer\"));\n        al.add(new Author(\"Nalo\",\"Hopkinson\",\"Brown\
  \ Girl in the Ring\"));\n        al.add(new Author(\"Frank\",\"Miller\",300));\n\
  \        al.add(new Author(\"Deborah\",\"Hopkinson\",\"Sky Boys\"));\n        al.add(new\
  \ Author(\"George R. R.\",\"Martin\",\"Song of Fire\"));\n    }\n}\n```\n*(注：原文最后部分存在代码逻辑混乱，我已根据方法描述对结构进行了清理整理）*\n\
  \n## 1.27 Java 中的 Comparator 接口\n\n在上一个教程中，我们学习了如何使用 `Comparable` 接口对自定义类的对象进行排序。通过\
  \ `Comparable`，我们可以根据任何数据成员进行排序。例如，假设我们有一个 `Author` 类，包含数据成员：作者名、书名和年龄。现在如果我们想根据任何一个数据成员进行排序，可以使用\
  \ `Comparable`，但如果我们想要有多种排序选择并根据任何选择对对象进行排序，这可以通过 `Comparator` 接口来实现。我们可以创建任意数量的\
  \ `Comparator`，然后这样对一个或多个 Comparator 调用 `Collections.sort()`：\n\n```java\n// 按作者年龄排序\
  \ al\nCollections.sort(al, new AuthorAgeComparator());\n\n// 按书名排序 al\nCollections.sort(al,\
  \ new BookNameComparator());\n```\n\n它是如何工作的？为了像这样调用 `Collections.sort()` 方法，我们首先需要编写这些\
  \ Comparator 类 `AuthorAgeComparator` 和 `BookNameComparator`，连同 `Author` 类和主类。\n\n\
  完整的 Comparator 示例\n\nAuthor.java\n```java\npublic class Author implements Comparable<Author>\
  \ {\n    String firstName;\n    String bookName;\n    int auAge;\n\n    Author(String\
  \ first, String book, int age){\n        this.firstName = first;\n        this.bookName\
  \ = book;\n        this.auAge = age;\n    }\n\n    public String getFirstName()\
  \ {\n        return firstName;\n    }\n\n    public void setFirstName(String firstName)\
  \ {\n        this.firstName = firstName;\n    }\n\n    public String getBookName()\
  \ {\n        return bookName;\n    }\n}\n```\n\n\n\n\n\n```java\npublic void setBookName(String\
  \ bookName) {\n    this.bookName = bookName;\n}\n\npublic int getAuAge() {\n   \
  \ return auAge;\n}\n\npublic void setAuAge(int auAge) {\n    this.auAge = auAge;\n\
  }\n\n@Override\n/*\n * 当我们只使用 Comparable 时，这里是我们编写排序\n * 逻辑的地方。当我们在类中实现 Comparable\n\
  \ * 接口并调用 Collections.sort() 时，会调用此方法\n */\npublic int compareTo(Author au) {\n\
  \    return this.firstName.compareTo(au.firstName);\n}\n```\n\n### AuthorAgeComparator.java\n\
  ```java\nimport java.util.*;\nclass AuthorAgeComparator implements Comparator<Author>\
  \ {\n    public int compare(Author a1, Author a2) {\n        if (a1.auAge == a2.auAge)\n\
  \            return 0;\n        else if (a1.auAge > a2.auAge)\n            return\
  \ 1;\n        else\n            return -1;\n    }\n}\n```\n\n### BookNameComparator.java\n\
  ```java\nimport java.util.*;\npublic class BookNameComparator implements Comparator<Author>\
  \ {\n    public int compare(Author a1, Author a2) {\n        return a1.bookName.compareTo(a2.bookName);\n\
  \    }\n}\n```\n\n### SortingPgm.java\n```java\nimport java.util.ArrayList;\nimport\
  \ java.util.Collections;\npublic class SortingPgm {\n    public static void main(String\
  \ args[]) {\n        // Author 类对象的列表\n        ArrayList<Author> al = new ArrayList<Author>();\n\
  \        al.add(new Author(\"Henry\", \"Tropic of Cancer\", 45));\n        al.add(new\
  \ Author(\"Nalo\", \"Brown Girl in the Ring\", 56));\n        al.add(new Author(\"\
  Frank\", \"300\", 65));\n        al.add(new Author(\"Deborah\", \"Sky Boys\", 51));\n\
  \        al.add(new Author(\"George R. R.\", \"A Song of Ice and Fire\", 62));\n\
  \        /*\n         * 使用 Collections.sort() 方法对列表进行排序，\n         * 我们可以使用此方法是因为我们已经在自定义的\
  \ Author\n         * 类中实现了 Comparable 接口\n         */\n        System.out.println(\"\
  按作者姓排序:\");\n        Collections.sort(al);\n        for (Author au : al) {\n   \
  \         System.out.println(au.getFirstName() + \", \" + au.getBookName() + \"\
  , \" + au.getAuAge());\n        }\n        /* 使用 AuthorAgeComparator 排序*/\n    \
  \    System.out.println(\"按作者年龄排序:\");\n        Collections.sort(al, new AuthorAgeComparator());\n\
  \        for (Author au : al) {\n            System.out.println(au.getFirstName()\
  \ + \", \" + au.getBookName() + \", \" + au.getAuAge());\n        }\n        /*\
  \ 使用 BookNameComparator 排序*/\n        System.out.println(\"按书名排序:\");\n        Collections.sort(al,\
  \ new BookNameComparator());\n        for (Author au : al) {\n            System.out.println(au.getFirstName()\
  \ + \", \" + au.getBookName() + \", \" + au.getAuAge());\n        }\n    }\n}\n\
  ```\n\n### 输出:\n```\nSorting by Author First Name:\nDeborah, Sky Boys, 51\nFrank,\
  \ 300, 65\nGeorge R. R., A Song of Ice and Fire, 62\nHenry, Tropic of Cancer, 45\n\
  Nalo, Brown Girl in the Ring, 56\nSorting by Author Age:\nHenry, Tropic of Cancer,\
  \ 45\nDeborah, Sky Boys, 51\nNalo, Brown Girl in the Ring, 56\nGeorge R. R., A Song\
  \ of Ice and Fire, 62\nFrank, 300, 65\nSorting by Book Name:\nFrank, 300, 65\nGeorge\
  \ R. R., A Song of Ice and Fire, 62\nNalo, Brown Girl in the Ring, 56\nDeborah,\
  \ Sky Boys, 51\nHenry, Tropic of Cancer, 45\n```\n\n---\n\n# 2 Java 枚举教程及示例\n\n\
  ## 引言\n`enum` 是一种特殊的数据类型，它基本上是常量的集合。在本教程中，我们将学习如何在 Java 中使用 `enums` 以及我们可以使用它们的可能场景。\n\
  \n### 如何定义枚举\n这是我们定义一个 `enum` 的方式：\n```java\nenum Directions {\n    EAST,\n    WEST,\n\
  \    NORTH,\n    SOUTH\n}\n```\n\n### 如何为枚举类型赋值？\n我们有一个类型为 `Directions` 的变量 `dir`。该变量可以取任何可能的值（EAST,\
  \ WEST, SOUTH）。在这种情况下，它被设置为 `NORTH`：\n```java\nDirections dir = Directions.NORTH;\n\
  ```\n\n### 枚举在 if-else 语句中的用法\n这是我们如何在 `if-else` 逻辑中使用 `enum` 变量。你可以在这里分配 `EAST`,\
  \ `WEST`, `SOUTH` 中的任何值。为了示例，我将其赋值为 `NORTH`：\n```java\nDirections dir = Directions.NORTH;\n\
  if (dir == Directions.EAST) {\n    // 执行一些操作\n} else if (dir == Directions.WEST)\
  \ {\n    // 执行一些操作\n} else if (dir == Directions.NORTH) {\n    // 执行一些操作\n} else\
  \ {\n    // 对剩余常量执行某些操作\n}\n```\n\n### 枚举示例\n这是一个演示 `enums` 的示例。如果你理解了核心部分和基础，你就能根据需求编写自己的逻辑。\n\
  ```java\nenum Directions {\n    EAST,\n    WEST,\n    NORTH,\n    SOUTH\n}\n\nclass\
  \ EnumDemo {\n    public static void main(String args[]) {\n        Directions dir\
  \ = Directions.NORTH;\n        if (dir == Directions.EAST) {\n            System.out.println(\"\
  Direction: East\");\n        } else if (dir == Directions.WEST) {\n            System.out.println(\"\
  Direction: West\");\n        } else if (dir == Directions.NORTH) {\n           \
  \ System.out.println(\"Direction: North\");\n        }\n    }\n}\n```\n输出：\n\n###\
  \ 枚举在 Switch 语句中的用法\n这里是在 `switch-case` 语句中使用 `enums` 的用法示例：\n```java\nenum Directions\
  \ {\n    EAST,\n    WEST,\n    NORTH,\n    SOUTH\n}\n\nclass EnumDemo {\n    Directions\
  \ dir;\n\n    public EnumDemo(Directions dir) {\n        this.dir = dir;\n    }\n\
  \n    public void getMyDirection() {\n        switch (dir) {\n            case EAST:\n\
  \                System.out.println(\"In East Direction\");\n                break;\n\
  \            case WEST:\n                System.out.println(\"In West Direction\"\
  );\n                break;\n            case NORTH:\n                System.out.println(\"\
  In North Direction\");\n                break;\n            default:\n         \
  \       System.out.println(\"In South Direction\");\n                break;\n  \
  \      }\n    }\n\n    public static void main(String args[]) {\n        EnumDemo\
  \ obj1 = new EnumDemo(Directions.EAST);\n        obj1.getMyDirection();\n      \
  \  EnumDemo obj2 = new EnumDemo(Directions.SOUTH);\n        obj2.getMyDirection();\n\
  \    }\n}\n```\n输出：\n\n```\nIn East Direction\nIn South Direction\n```\n\n### 如何遍历枚举变量\n\
  ```java\nclass EnumDemo {\n    public static void main(String args[]) {\n      \
  \  for (Directions dir : Directions.values()) {\n            System.out.println(dir);\n\
  \        }\n    }\n}\n```\n这段代码将显示所有的常量。\n\n### 枚举字段和方法\n让我们先来看一个示例，然后进行详细讨论：\n\
  ```java\nenum Directions {\n    EAST (\"E\"),\n    WEST (\"W\"),\n    NORTH (\"\
  N\"),\n    SOUTH (\"S\");\n\n    /*\n     * 注意提示：当存在枚举字段或方法时\n     * 结尾必须有分号\n \
  \    */\n    private final String shortCode;\n\n    Directions(String code) {\n\
  \        this.shortCode = code;\n    }\n\n    public String getDirectionCode() {\n\
  \        return this.shortCode;\n    }\n}\n\nclass EnumDemo {\n    public static\
  \ void main(String args[]) {\n        Directions dir = Directions.SOUTH;\n     \
  \   System.out.println(dir.getDirectionCode());\n        Directions dir2 = Directions.EAST;\n\
  \        System.out.println(dir2.getDirectionCode());\n    }\n}\n```\n输出：\n\n```\n\
  S\nE\n```\n\n\n\n\nJava 注解（Annotations）允许我们向源代码中添加元数据信息，尽管它们本身并不是程序的一部分。注解从 `JDK\
  \ 5` 开始被引入 `java` 语言。注解对它们所标记的代码运行没有直接影响（即它不会影响程序的执行）。\n\n在本教程中，我们将涵盖以下主题：注解的用法、如何应用注解、Java\
  \ 中提供了哪些预定义的注解类型，以及如何创建自定义注解。\n\n## 注解（Annotations）的作用是什么\n\n1) **给编译器的指令**：Java\
  \ 中提供了三种内置注解（`@Deprecated`、`@Override` 和 `@SuppressWarnings`），可用于向编译器提供某些指令。例如，`@Override`\
  \ 注解用于指示编译器被注解的方法正在重写父方法。关于这些内置注解的更多详细信息和示例，将在本文的后续章节中进行讨论。\n\n2) **编译时指令**：注解可以为编译器提供编译时指令，这些指令可以进一步被软件构建工具用于生成代码、XML\
  \ 文件等。\n\n3) **运行时指令**：我们可以定义在运行时可用的注解，并通过 `java reflection`（Java 反射）访问它们，并用于在运行时给程序提供指令。我们将在本文稍后的部分通过示例来讨论这一点。\n\
  \n## 注解基础\n\n注解始终以符号 `@` 开头，后跟注解的名称。符号 `@` 告知编译器这是一个注解。\n\n例如：`@Override`\n\n在这里，`@`\
  \ 符号表示这是一个注解，而 `Override` 是该注解的名称。\n\n## 我们可以在哪里使用注解？\n\n注解可以应用于类、接口、方法和字段。例如，下面的注解被应用到该方法上。\n\
  \n```java\n@Override\nvoid myMethod() {\n // 执行某些操作\n}\n```\n\n此注解在这里具体在做什么将在下一节中解释，但简而言之，它指示编译器\
  \ `myMethod()` 是一个重写方法，该方法正在重写父类的同名方法（`myMethod()`）。\n\n## 2.2.1 Java 中的内置注解\n\n\
  Java 有三个内置注解：\n\n* `@Override`\n* `@Deprecated`\n* `@SuppressWarnings`\n\n### 1)\
  \ @Override:\n\n在子类中重写方法时，我们应该使用此注解来标记该方法。这使得代码更具可读性并避免了维护问题，例如：在更改父类的方法签名时，你必须更改子类（使用此注解的地方）中的签名，否则编译器将抛出编译错误。如果没有使用此注解，追踪这类问题将非常困难。\n\
  \n示例：\n\n```java\npublic class MyParentClass {\n    public void justaMethod() {\n\
  \        System.out.println(\"Parent class method\");\n    }\n}\n\npublic class\
  \ MyChildClass extends MyParentClass {\n    @Override\n    public void justaMethod()\
  \ {\n        System.out.println(\"Child class method\");\n    }\n}\n```\n\n### 2)\
  \ @Deprecated\n\n`@Deprecated` 注解表示被标记的元素（类、方法或字段）已过时，不应再使用。当程序使用已标记为 `@Deprecated`\
  \ 注解的方法、类或字段时，编译器会生成一个警告。当一个元素过时时，还应该使用 Javadoc 的 `@deprecated` 标签对其进行文档说明，如下例所示。注意\
  \ `@Deprecated` 和 `@deprecated` 之间的大小写区别。`@deprecated` 用于文档目的。\n\n示例：\n\n```java\n\
  /**\n* @deprecated\n* 弃用的原因\n*/\n@Deprecated\npublic void anyMethodHere() {\n //\
  \ 执行某些操作\n}\n```\n\n### 3) @SuppressWarnings\n\n此注解指示编译器忽略特定的警告。例如，在下面的代码中，我正在调用一个过时方法（假设\
  \ `deprecatedMethod()` 方法已标记了 `@Deprecated` 注解），因此编译器应该生成警告，但我使用了 `@SuppressWarnings`\
  \ 注解，这会抑制该过时警告。\n\n```java\n@SuppressWarnings(\"deprecation\")\nvoid myMethod()\
  \ {\n    myObject.deprecatedMethod();\n}\n```\n\n## 2.2.2 创建自定义注解\n\n* 使用 `@interface`\
  \ 创建注解，后跟注解名称，如下例所示。\n* 注解也可以包含元素。它们看起来看起来像方法。例如，在下面的代码中，我们有四个元素。我们不应该为这些元素提供实现。\n\
  * 所有注解都实现 `java.lang.annotation.Annotation` 接口。注解不能包含任何 `extends` 子句。\n\n```java\n\
  import java.lang.annotation.Documented;\nimport java.lang.annotation.ElementType;\n\
  import java.lang.annotation.Inherited;\nimport java.lang.annotation.Retention;\n\
  import java.lang.annotation.RetentionPolicy;\nimport java.lang.annotation.Target;\n\
  \n@Documented\n@Target(ElementType.METHOD)\n@Inherited\n@Retention(RetentionPolicy.RUNTIME)\n\
  public @interface MyCustomAnnotation {\n    int studentAge() default 18;\n    String\
  \ studentName();\n    String stuAddress();\n    String stuStream() default \"CSE\"\
  ;\n}\n```\n\n**注意**：在创建注解时设置了默认值的所有元素，在使用注解时都可以被跳过。例如，如果我将上述注解应用到类上，我会像这样做：\n\n\
  ```java\n@MyCustomAnnotation(\n    studentName=\"Chaitanya\",\n    stuAddress=\"\
  Agra, India\"\n)\npublic class MyClass {\n    ...\n}\n```\n\n你可以看到，我们没有为 `studentAge`\
  \ 和 `stuStream` 元素提供值，因为设置这些值是可选的（在注解定义中已设置了默认值，但在使用注解时可以赋值）。\n\n注意：注解中也可以包含数组元素。我们是这样使用它们的：\n\
  \n注解定义：\n\n```java\n@interface MyCustomAnnotation {\n    int count();\n    String[]\
  \ books();\n}\n```\n\n用法：\n\n```java\n@MyCustomAnnotation(\n    count=3,\n    books={\"\
  C++\", \"Java\"}\n)\npublic class MyClass {\n}\n```\n\n回到主题：在自定义注解示例中我们使用了这些注解：`@Documented`、`@Target`、`@Inherited`\
  \ 和 `@Retention`。让我们详细讨论它们。\n\n### @Documented\n\n`@Documented` 注解表示使用此注解的元素应该被\
  \ JavaDoc 文档。例如：\n\n```java\njava.lang.annotation.Documented\n\n@Documented\npublic\
  \ @interface MyCustomAnnotation {\n // 注解体\n}\n\n@Documented\npublic class MyClass\
  \ {\n // 类体\n}\n```\n在为类 `MyClass` 生成 javadoc 时，将包含注解 `@CustomAnnotation`。\n\n###\
  \ @Target\n\n它指定了哪里可以使用注解。例如：在下面的代码中，我们将目标类型定义为 `METHOD`，这意味着下面的注解只能用于方法。\n\n```java\n\
  import java.lang.annotation.ElementType;\nimport java.lang.annotation.Target;\n\n\
  @Target({ElementType.METHOD})\npublic @interface MyCustomAnnotation {\n}\n\npublic\
  \ class MyClass {\n    @MyCustomAnnotation\n    public void myMethod() {\n     \
  \   执行某些操作\n    }\n}\n```\n\n**注意**：\n\n1) 如果你不定义任何 `Target` 类型，意味着注解可以应用于任何元素。\n\
  2) 除 `ElementType.METHOD` 之外，注解还可以有以下可能的 Target 值：\n* `ElementType.METHOD`\n* `ElementType.PACKAGE`\n\
  * `ElementType.PARAMETER`\n* `ElementType.TYPE`\n* `ElementType.ANNOTATION_TYPE`\n\
  * `ElementType.CONSTRUCTOR`\n* `ElementType.LOCAL_VARIABLE`\n* `ElementType.FIELD`\n\
  \n### @Inherited\n\n`@Inherited` 注解信号类中使用的自定义注解应该被其所有的子类继承。例如：\n\n```java\njava.lang.annotation.Inherited\n\
  \n@Inherited\npublic @interface MyCustomAnnotation {\n}\n\n@MyCustomAnnotation\n\
  public class MyParentClass {\n    ...\n}\n\npublic class MyChildClass extends MyParentClass\
  \ {\n    ...\n}\n```\n\n\n\n在这里，类 `MyParentClass` 使用注解 `@MyCustomAnnotation`，该注解被标记了\
  \ `@inherited` 注解。这意味着子类 `MyChildClass` 继承了 `@MyCustomAnnotation`。\n\n### `@Retention`\n\
  \n它表示带有被注解类型的注解将保留多久。\n\n```java\nimport java.lang.annotation.Retention;\nimport\
  \ java.lang.annotation.RetentionPolicy;\n\n@Retention(RetentionPolicy.RUNTIME)\n\
  @interface MyCustomAnnotation {\n}\n```\n\n在这里我们使用了 `RetentionPolicy.RUNTIME`。还有另外两个选项。让我们来看看它们的含义：\n\
  \n- `RetentionPolicy.RUNTIME`: 注解在运行时应该是的，可以通过 `java reflection` 进行检查。\n- `RetentionPolicy.CLASS`:\
  \ 注解存在于 `.class` 文件中，但在运行时不可用。\n- `RetentionPolicy.SOURCE`: 注解存在于程序的源代码中，它既不在 `.class`\
  \ 文件中，在运行时也不可用。\n\n# 2.3 Java 正则表达式 (java regex)\n\n正则表达式用于定义 `String` 模式，这些模式可以用于文本的搜索、处理和编辑。这些表达式也被称为\
  \ `Regex`（Regular expressions 的缩写）。\n\n让我们举一个例子来更好地理解：\n\n在下面的示例中，正则表达式 `.*book.*`\
  \ 用于在文本中搜索字符串 “book”的出现。\n\n```java\nimport java.util.regex.*;\n\nclass RegexExample1{\
  \ \n    public static void main(String args[]){\n        String content = \"This\
  \ is feroz from javabook.com.\";\n        String pattern = \".*book.*\";\n     \
  \   boolean isMatch = Pattern.matches(pattern, content);\n        System.out.println(\"\
  The text contains 'book'? \" + isMatch);\n    }\n}\n```\n文本包含 'book'? true\n\n在本次教程中，我们将学习如何定义模式以及如何使用它们。`java.util.regex`\
  \ API（我们在处理正则时需要导入的包）有两个主要的类：\n1. `java.util.regex.Pattern` – 用于定义模式。\n2. `java.util.regex.Matcher`\
  \ – 用于使用模式对文本执行匹配操作。\n\n### `java.util.regex.Pattern` 类\n\n#### 1) `matches()`\n\
  我们已经在上面的示例中见过了这个方法的用法，当时我们在给定的文本中搜索了字符串 “book”。这是使用 `Regex` 在文本中搜索 `String` 的最简单、容易的方法之一。\n\
  \n```java\nString content = \"This is tutorial!\";\nString patternString = \".*tutorial.*\"\
  ;\nboolean isMatch = Pattern.matches(patternString, content);\nSystem.out.println(\"\
  The text contains 'tutorial'? \" + isMatch);\n```\n如你所示，我们使用了 `Pattern` 类的 `matches()`\
  \ 方法在给定文本中搜索模式。模式 `.*tutorial.*` 允许开头和结尾有零或多个字符。\n局限性：这种方法可以在文本中搜索模式的单次。要匹配多次出现，你应该使用\
  \ `compile()` 方法（在下一节讨论）。\n\n#### 2) `compile()`\n在上面的示例中，我们在文本中搜索了字符串 “tutorial”，那是区分大小写的搜索，然而如果你想进行\
  \ `CASE_INSENSITIVE` 搜索或者想进行多次出现匹配，你可能需要在文本中搜索它之前先使用 `compile()` 编译模式。这就是该方法在这种情况下的使用方式。\n\
  \n```java\nString content = \"This is tutorial!\";\nString patternString = \".*tuRiAl.\"\
  ;\nPattern pattern = Pattern.compile(patternString, Pattern.CASE_INSENSITIVE);\n\
  ```\n在这里我们使用了标记 `CASE_INSENSITIVE` 进行不区分大小写的搜索，还有其他几个可以用于不同目的标记。\n\n#### 3) `matcher()`\
  \ 方法\n现在是：我们获得了一个 `Pattern` 实例但如何匹配它呢？为此我们需要 `Matcher` 实例，我们可以通过 `matcher()` 方法获取它。在上一节中，我们学习了如何使用\
  \ `compile()` 方法获取 `Pattern` 实例。在这里我们将学习如何使用 `matcher()` 方法从 `Pattern` 实例获取 `Matcher`\
  \ 实例。\n\n```java\nString content = \"This is tutorial!\";\nString patternString\
  \ = \".*tuRiAl.*\";\nPattern pattern = Pattern.compile(patternString, Pattern.CASE_INSENSITIVE);\n\
  Matcher matcher = pattern.matcher(content);\nboolean isMatched = matcher.matches();\n\
  System.out.println(\"Is it a Match?\" + isMatched);\n```\n输出：Is it a Match?true\n\
  \n#### 4) `split()`\n为了根据分隔符将文本拆分为多个字符串（这里分隔符将使用 `regex` 指定），我们可以使用 `split()` 方法。实现方式如下。\n\
  \n```java\nimport java.util.regex.*;\n\nclass RegexExample2{ \n    public static\
  \ void main(String args[]){\n        String text = \"ThisIsferoz.ItISMybook\";\n\
  \        // 分隔符模式\n        String patternString = \"is\";\n        Pattern pattern\
  \ = Pattern.compile(patternString, Pattern.CASE_INSENSITIVE);\n        String[]\
  \ myStrings = pattern.split(text);\n        for(String temp:myStrings){\n      \
  \      System.out.println(temp);\n        }\n        System.out.println(\"Number\
  \ of split strings: \"+myStrings.length);\n    }\n}\n```\n输出：\nTh\nFeroz.It\nMybook\n\
  Number of split strings: 4\n输出中的第二个拆分字符串为 null。\n\n### `java.util.regex.Matcher`\
  \ 类\n我们之前已经讨论过 `Matcher` 类。让我们回顾几点：\n\n创建一个 `Matcher` 实例\n```java\nString content\
  \ = \"Some text\";\nString patternString = \".*somestring.*\";\nPattern pattern\
  \ = Pattern.compile(patternString);\nMatcher matcher = pattern.matcher(content);\n\
  ```\n\n#### 主要方法\n- `matches()`：它在整个文本上匹配正则表达式，通过 `Pattern.matcher()` 方法创建 `Matcher`\
  \ 实例时。\n```java\nboolean match = matcher.matches();\n```\n- `lookingAt()`：类似于 `matches()`，但仅在文本的开头匹配正则表达式。\n\
  - `find()`：搜索文本中的正则表达式出现情况。当我们要搜索多次出现时主要使用。\n- `start()` 和 `end()`：这两个方法通常与 `find()`\
  \ 方法配合使用。它们用于获取找到的匹配的起始结束索引。\n\n让我们举一个例子使用 `Matcher` 方法查找多次出现：\n\n```java\npackage\
  \ javabook.com;\nimport java.util.regex.*;\n\nclass RegexExampleMatcher{ \n    public\
  \ static void main(String args[]){\n        String content = \"ZZZ AA PP QQQ AAA\"\
  ;\n        String string = \"AA\";\n        Pattern pattern = Pattern.compile(string);\n\
  \        Matcher matcher = pattern.matcher(content);\n        while(matcher.find())\
  \ {\n            System.out.println(\"Found at: \"+ matcher.start() + \" - \" +\
  \ matcher.end());\n        }\n    }\n}\n```\n输出：\nFound at: 4 - 6\nFound at: 10\
  \ - 12\nFound at: 17 - 19\n\n现在我们熟悉了 `Pattern` 和 `Matcher` 类以及在文本上匹配正则表达式的过程。让我们来看看定义正则表达式有哪些各种选项：\n\
  \n#### 1) 字符串字面量\n假设你只想在文本中搜索特定的字符串，例如 “abc”，那么我们可以简单地写出如下代码：这里文本和正则相同。\n`Pattern.matches(\"\
  abc\", \"abc\")`\n\n#### 2) 字符类\n字符类将输入文本中的单个字符与字符类中的多个允许字符进行匹配。例如 `[Cc]`匹配字符串 “feroz”中所有允许的（无论是小写还是大写的\
  \ C）。几个更多例子：\n- `Pattern.matches(\"[pqr]\", \"abcd\")`：由于文本中没有 p、q 或 r，它将返回 false。\n\
  - `Pattern.matches(\"[pqr]\", \"r\")`：返回 true，因为找到了 r。\n- `Pattern.matches(\"[pqr]\"\
  , \"pq\")`：返回 false，因为文本中可以是其中一个而不能两个都有。\n\n这里是各种字符类构造的完整列表：\n- `[abc]`：如果文本拥有它们其中一个（a、b\
  \ 或 c）且仅一次，则它将匹配。\n- `[^abc]`：除 a、b 或 c 以外的任意字符 (^ 表示否定）\n- `[a-zA-Z]`：a 到 z，或 A\
  \ 到 Z，包含边界（范围）\n\n\n\n\n- `[a-d[m-p]]`: a 到 d，或 m 到 p：`[a-dm-p]` (并集)\n- `[a-z&&[def]]`:\
  \ 其中任意一个（`d`、`e` 或 `f`）\n- `[a-z&&[^bc]]`: a 到 z，但排除 b 和 c：`[ad-z]` (减法)\n- `[a-z&&[^m-p]]`:\
  \ a 到 z，且不在 m 到 p：`[a-lq-z]` (减法)\n\n# 预定义字符类 – 元字符\n\n这些类似于你在编写正则表达式时可以使用的短代码。\n\
  \n| 构造结构 | 描述 |\n| :--- | :--- |\n| `.` | 任意字符（可能匹配也可能不匹配行终止符） |\n| `\\d` | 数字：`[0-9]`\
  \ |\n| `\\D` | 非数字：`[⁰-9]` |\n| `\\s` | 空白字符：`[ \\t\\n\\x0B\\f\\r]` |\n| `\\S` |\
  \ 非空白字符：`[^\\s]` |\n| `\\w` | 单词字符：`[a-zA-Z_0-9]` |\n| `\\W` | 非单词字符：`[^\\w]` |\n\
  \n### 示例\n\n- `Pattern.matches(\"\\\\d\", \"1\")` 将返回 `true`。\n- `Pattern.matches(\"\
  \\\\D\", \"z\")` 返回 `true`。\n- `Pattern.matches(\".p\", \"qp\")` 返回 `true`，点符号(`.`)\
  \ 代表任意字符。\n\n# 边界匹配符\n\n- `^`: 匹配行的开头。\n- `$`: 匹配行的结尾。\n- `\\b`: 匹配单词边界。\n- `\\\
  B`: 匹配非单词边界。\n- `\\A`: 匹配输入文本的开头。\n- `\\G`: 匹配上一次匹配的结尾。\n- `\\Z`: 匹配输入文本的结尾，但排除最后的终止符（如果有的话）。\n\
  - `\\z`: 匹配输入文本的结尾。\n\n### 示例\n\n- `Pattern.matches(\"^Hello$\", \"Hello\")`: 返回\
  \ `true`，以 Hello 开头并以其结尾。\n- `Pattern.matches(\"^Hello$\", \"Namaste! Hello\")`:\
  \ 返回 `false`，未以 Hello 开头。\n- `Pattern.matches(\"^Hello$\", \"Hello Namaste!\")`:\
  \ 返回 `false`，未以 Hello 结尾。\n\n# 量词符\n\n| 贪婪 (Greedy) | 懒惰 (Reluctant) | 占有 (Possessive)\
  \ | 匹配规则 |\n| :--- | :--- | :--- | :--- |\n| `X?` | `X??` | `X?+` | 匹配一次 `X`，或者完全不匹配（0\
  \ 或 1 次）。 |\n| `X*` | `X*?` | `X*+` | 匹配 `X` 次或多次。 |\n| `X+` | `X+?` | `X++` | 匹配\
  \ `X` 一次或多次。 |\n| `X{n}` | `X{n}?` | `X{n}+` | 恰好匹配 `n` 次 `X`。 |\n| `X{n,}` | `X{n,?`\
  \ | `X{n,}+` | 至少匹配 `n` 次 `X`。 |\n| `X{n, m}` | `X{n, m)?` | `X{n, m)+` | 至少匹配 `n`\
  \ 次，最多 `m` 次 `X`。 |\n\n### 示例\n\n```java\nimport java.util.regex.*;\n\nclass RegexExample{\
  \ \n    public static void main(String args[]){\n        // 如果字符串完全匹配 \"tom\" 则将返回\
  \ true\n        System.out.println(Pattern.matches(\"tom\", \"Tom\")); //False\n\
  \n        /* 如果字符串完全匹配 \n         * \"tom\" 或 \"Tom\" 则返回 true\n         */\n  \
  \      System.out.println(Pattern.matches(\"[Tt]om\", \"Tom\")); //True\n      \
  \  System.out.println(Pattern.matches(\"[Tt]om\", \"Tom\")); //True\n\n        /*\
  \ 如果字符串完全匹配 \"tim\"\n         * 或 \"Tim\" 或 \"jin\" 或 \"Jin\" 则返回 true\n       \
  \  */\n        System.out.println(Pattern.matches(\"[tT]im|[jJ]in\", \"Tim\"));//True\n\
  \        System.out.println(Pattern.matches(\"[tT]im|[jJ]in\", \"jin\"));//True\n\
  \n        /* 如果字符串在任何位置\n         * 包含 \"abc\" 则返回 true\n         */\n        System.out.println(Pattern.matches(\"\
  .*abc.*\", \"deabcpq\"));//True\n\n        /* 如果字符串开头没有\n         * 数字则返回 true\n\
  \         */\n        System.out.println(Pattern.matches(\"^[^\\\\d].*\", \"123abc\"\
  )); //False\n        System.out.println(Pattern.matches(\"^[^\\\\d].*\", \"abc123\"\
  )); //True\n\n        // 如果字符串包含三个字母\n        System.out.println(Pattern.matches(\"\
  [a-zA-Z][a-zA-Z][a-zA-Z]\", \"aPz\"));//True\n        System.out.println(Pattern.matches(\"\
  [a-zA-Z][a-zA-Z][a-zA-Z]\", \"aAA\"));//True\n        System.out.println(Pattern.matches(\"\
  [a-zA-Z][a-zA-Z][a-zA-Z]\", \"apZx\"));//False\n\n        // 如果字符串包含 0 个或多个非数字\n\
  \        System.out.println(Pattern.matches(\"\\\\D*\", \"abcde\")); //True\n  \
  \      System.out.println(Pattern.matches(\"\\\\D*\", \"abcde123\")); //False\n\n\
  \        /* 边界匹配符示例\n         * ^ 表示行首\n         * $ 表示行尾\n         */\n       \
  \ System.out.println(Pattern.matches(\"^This$\", \"This is Chaitanya\")) //False\n\
  \        System.out.println(Pattern.matches(\"^This$\", \"This\")); //True\n   \
  \     System.out.println(Pattern.matches(\"^This$\", \"This is Chaitanya\"));\n\
  \    }\n}\n```\n\n## 3.1 String 类\n\n- `[a-d[m-p]]`: a 到 d，或 m 到 p：`[a-dm-p]` (并集)\n\
  - `[a-z&&[def]]`: 其中任意一个（`d`、`e` 或 `f`）\n- `[a-z&&[^bc]]`: a 到 z，但排除 b 和 c：`[ad-z]`\
  \ (减法)\n- `[a-z&&[^m-p]]`: a 到 z，且不在 m 到 p：`[a-lq-z]` (减法)\n\n这些类似于你在编写正则表达式时可以使用的短代码。\n\
  \n- 有两种创建 String 的方式：\n它是不可变的；一旦创建，不可更改。\n\n### 边界匹配符\n\n- `^` 表示行首\n- `$` 表示行尾\n\
  \n边界匹配符示例：\n```java\nSystem.out.println(Pattern.matches(\"^This$\", \"This is Chaitanya\"\
  )) //False\nSystem.out.println(Pattern.matches(\"^This$\", \"This\")); //True\n\
  System.out.println(Pattern.matches(\"^This$\", \"This is Chaitanya\"));\n```\n\n\
  ## 3.2 String 方法\n\n`String` 是字符序列。它是不可变的；一旦创建，不可更改。\n\n### String 类\n\n- `String\
  \ str = \"Welcome\";` (字面量)\n- `String str2 = new String(\"Welcome\");` (使用关键字)\n\
  \n### 示例\n\n```java\nclass Example{ \n    public static void main(String args[]){\n\
  \        //通过 java 字面量创建一个字符串\n        String str = \"javabook\";\n        char\
  \ arrch[]={'h','e','l','o'};\n        //将字符数组[]转换为字符串\n        String str2 = new\
  \ String(arrch);\n        //使用 new 创建另一个 java 字符串 str3\n        String str3 = new\
  \ String(\"Java Example\");\n\n        //显示字符串\n        System.out.println(str);\n\
  \        System.out.println(str2);\n        System.out.println(str3);\n    }\n}\n\
  ```\n\n###可用方法\n\n1. `charAt(int index)`:\n返回指定索引处的字符。索引值应在 `0` 到 `length()-1` 之间。如果索引小于\
  \ 0 或大于长度，将抛出 `IndexOutOfBoundsException`。\n\n**示例：**\n```java\npublic class CharAtExample\
  \ {\n    public static void main(String args[]) {\n        String str = \"Welcome\
  \ to string handling tutorial\";\n        char ch1 = str.charAt(0);\n        char\
  \ ch2 = str.charAt(5);\n        char ch3 = str.charAt(11);\n        char ch4 = str.charAt(20);\n\
  \n        System.out.println(\"Character at 0 index is: \"+ch1);\n        System.out.println(\"\
  Character at 5th index is: \"+ch2);\n        System.out.println(\"Character at 11th\
  \ index is: \"+ch3);\n        System.out.println(\"Character at 20th index is: \"\
  +ch4);\n    }\n}\n```\n\n2. `equals(Object obj)`:\n将字符串与指定的字符串进行比较，如果两者匹配则返回 `true`，否则返回\
  \ `false`。\n\n3. `equalsIgnoreCase(String String)`:\n忽略大小写，将字符串与指定的字符串进行比较。\n\n\n\
  \n\n\n\n在本教程中，我们将讨论 `equals()` 和 `equalsIgnoreCase()` 方法。这两个方法都用于比较两个字符串。它们唯一的区别是\
  \ `equals()` 方法在比较时考虑大小写，而 `equalsIgnoreCase()` 方法在比较时忽略大小写。例如，如果我们比较字符串“TEXT”和“text”，`equals()`\
  \ 方法将返回 `false`，但 `equalsIgnoreCase()` 将返回 `true`。\n\n`boolean equals(String str)`：大小写敏感比较\n\
  \n`boolean equalsIgnoreCase(String str)`：大小写不敏感比较\n\n### 示例 1：`equals()`\n\n```java\n\
  public class EqualsExample1{\n    public static void main(String args[]){\n    \
  \    String str1= new String(\"Hello\");\n        String str2= new String(\"Hi\"\
  );\n        String str3= new String(\"Hello\");\n        System.out.println(\"str1\
  \ equals to str2:\"+str1.equals(str2));\n        System.out.println(\"str1 equals\
  \ to str3:\"+str1.equals(str3));\n        System.out.println(\"str1 equals to Welcome:\"\
  +str1.equals(\"Welcome\"));\n        System.out.println(\"str1 equals to Hello:\"\
  +str1.equals(\"Hello\"));\n        System.out.println(\"str1 equals to hello:\"\
  +str1.equals(\"hello\"));\n    }\n}\n```\n\n**输出：**\n```\nstr1 equals to str2:false\n\
  str1 equals to str3:true\nstr1 equals to Welcome:false\nstr1 equals to Hello:true\n\
  str1 equals to hello:false\n```\n\n### 示例 2：`equalsIgnoreCase()`\n\n```java\npublic\
  \ class EqualsExample2{\n    public static void main(String args[]){\n        String\
  \ str1= new String(\"Apple\");\n        String str2= new String(\"MANGO\");\n  \
  \      String str3= new String(\"APPLE\");\n        System.out.println(\"str1 equals\
  \ to str2:\"+str1.equalsIgnoreCase(str2));\n        System.out.println(\"str1 equals\
  \ to str3:\"+str1.equalsIgnoreCase(str3));\n        System.out.println(\"str1 equals\
  \ to Welcome:\"+str1.equalsIgnoreCase(\"Welcome\"));\n        System.out.println(\"\
  str1 equals to Apple:\"+str1.equalsIgnoreCase(\"Apple\"));\n        System.out.println(\"\
  str2 equals to mango:\"+str2.equalsIgnoreCase(\"mango\"));\n    }\n}\n```\n\n**输出：**\n\
  ```\nstr1 equals to str2:false\nstr1 equals to str3:true\nstr1 equals to Welcome:false\n\
  str1 equals to Apple:true\nstr2 equals to mango:true\n```\n\n### 3) `boolean equalsIgnoreCase(String\
  \ string)`\n它的工作原理与 `equals` 方法相同，但在比较字符串时不考虑大小写。它执行的是大小写不敏感比较。\n\n**示例：** 参考第 2\
  \ 点。\n\n### 4) `int compareTo(String string)`\n该方法根据字符串中每个字符的 `Unicode` 值来比较两个字符串。\n\
  \n#### Java – String `compareTo()` 方法示例\n`compareTo()` 方法用于按字典顺序比较两个字符串。两个字符串的每个字符都会被转换为\
  \ `Unicode` 值进行比较。如果两个字符串相等，则该方法返回 `0`，否则返回一个正值或负值。如果第一个字符串在字典顺序上大于第二个字符串，则结果为正数，否则结果为负数。\n\
  \n该方法可以使用如下方式：\n\n`int compareTo(String str)`\n这里的比较是在字符串字面量之间进行的。例如：`string1.compareTo(string2)`，其中\
  \ `string1` 和 `string2` 是 `String` 字面量。\n\n`int compareTo(Object obj)`\n这是字符串与对象之间的比较。例如：`string1.compareTo(\"\
  Just a String object\")`，其中 `string1` 是字面量，其值将与方法参数中指定的字符串进行比较。\n\n#### 示例\n这里有三个\
  \ `String`，我们使用 `compareTo()` 方法对它们进行相互比较。\n\n```java\npublic class CompareToExample\
  \ {\n    public static void main(String args[]) {\n        String str1 = \"String\
  \ method tutorial\";\n        String str2 = \"compareTo method example\";\n    \
  \    String str3 = \"String method tutorial\";\n        int var1 = str1.compareTo(\
  \ str2 );\n        System.out.println(\"str1 & str2 comparison: \"+var1);\n    \
  \    int var2 = str1.compareTo( str3 );\n        System.out.println(\"str1 & str3\
  \ comparison: \"+var2);\n        int var3 = str2.compareTo(\"compareTo method example\"\
  );\n        System.out.println(\"str2 & string argument comparison: \"+var3);\n\
  \    }\n}\n```\n\n**输出：**\n```\nstr1 & str2 comparison: -16\nstr1 & str3 comparison:\
  \ 0\nstr2 & string argument comparison: 0\n```\n\n### 5) `int compareToIgnoreCase(String\
  \ string)`\n与 `compareTo` 方法相同，但在比较期间会忽略大小写。\n\n#### Java – String `compareToIgnoreCase()`\
  \ 方法示例\n`compareToIgnoreCase()` 方法与 `compareTo()` 方法相似，因为它同样按字典顺序比较两个字符串。它们之间唯一的区别是\
  \ `compareToIgnoreCase()` 在比较两个字符串时会忽略大小写（大写或小写）。与 `compareTo()` 类似，该方法也根据每个字符的\
  \ `Unicode` 值来比较字符串。当字符串相等时，它返回 `0`，否则返回一个正值或负值。\n\n`int compareToIgnoreCase(String\
  \ str)`\n\n#### 示例\n在下面的示例中，我们有三个 `String` 字面量，它们的值相同但大小写不同。`string1` 是大写的，`string2`\
  \ 是小写的，`string3` 是大写和小小写的混合。我们正在使用 `compareToIgnoreCase()` 方法比较这些字符串。\n\n```java\n\
  public class CompareExample {\n    public static void main(String args[]) {\n  \
  \      String string1 = \"HELLO\";\n        String string2 = \"hello\";\n      \
  \  String string3 = \"Hello\";\n        int var1 = string1.compareToIgnoreCase(string2);\n\
  \        System.out.println(\"string1 & str2 comparison: \"+var1);\n        int\
  \ var2 = string1.compareToIgnoreCase(string3);\n        System.out.println(\"string1\
  \ & str3 comparison: \"+var2);\n        int var3 = string1.compareToIgnoreCase(\"\
  HeLLo\");\n        System.out.println(\"string1 and HeLLo comparison: \"+var3);\n\
  \    }\n}\n```\n\n**输出：**\n```\nstring1 & str2 comparison: 0\nstring1 & str3 comparison:\
  \ 0\nstring1 and HeLLo comparison: 0\n```\n\n### 6) `boolean startsWith(String prefix,\
  \ int offset)`\n检查从指定的 `offset` 索引开始的字符串是否具有指定的前缀。\n\n#### Java – String `startsWith()`\
  \ 方法示例\n`startsWith()` 方法用于检查 `String` 的前缀。它根据指定的字符串是否为特定字符串的前缀返回布尔值 true 或 false。\n\
  \n`boolean startsWith(String str)` 如果 str 是前缀，则返回 true。\n\n`boolean startsWith(String\
  \ str, int fromIndex)` 如果字符串以 `str` 开头，则返回 true，它从指定的 `fromIndex` 开始查找。\n\n####\
  \ 示例\n```java\npublic class StartsWithExample{\n    public static void main(String\
  \ args[]){\n        String str= new String(\"quick brown fox jumps over the lazy\
  \ dog\");\n        System.out.println(\"String str starts with quick:\"+str.startsWith(\"\
  quick\"));\n        System.out.println(\"String str starts with brown:\"+str.startsWith(\"\
  brown\"));\n        System.out.println(\"substring of str(starting from 6th index)\
  \ has brown prefix: \"\n        +str.startsWith(\"brown\", 6));\n        System.out.println(\"\
  substring of str(starting from 6th index) has quick prefix: \"\n        +str.startsWith(\"\
