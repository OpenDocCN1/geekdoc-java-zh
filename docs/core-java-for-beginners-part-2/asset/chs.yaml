  \ 方法相似，但它返回的是指定 `index` 的 Unicode 代码点值，而不是字符本身。\n\n# 3.3 Java 多线程\n\n#### Java 中的多线程\n\
  \n在讨论多线程之前，让我们先讨论一下线程。线程是进程的轻量级最小部分，可以与同一进程的其他部分（其他线程）并发运行。线程是独立的，因为它们都有各自的执行路径，这就是为什么其中一个线程发生异常时不会影响其他线程的执行的原因。进程的所有线程共享公共内存。同时执行多个线程的过程被称为多线程。\n\
  \n让我们分点总结一下讨论：\n\n1. 多线程的主要目的是提供程序两个或多个部分的同时执行，以最大化地利用 CPU 时间。多线程程序包含两个或多个可以并发运行的部分。程序的每个此类部分被称为线程。\n\
  2. 线程是轻量级的子进程，它们共享公共内存空间。在多线程环境中，受益于多线程的程序利用了最大的 CPU 时间，以便将空闲时间保持在最低。\n3. 线程可以处于以下状态之一：\n\
  \   - `NEW`（新建）：尚未启动的线程处于此状态。\n   - `RUNNABLE`（可就绪）：在 Java 虚拟机中执行的线程处于此状态。\n   -\
  \ `BLOCKED`（阻塞）：等待监器锁的线程处于此状态。\n   - `WAITING`（等待）：无限等待另一个线程执行特定动作的线程处于此状态。\n  \
  \ - `TIMED_WAITING`（超时等待）：等待另一个线程执行动作的最长指定等待时间的线程处于此状态。\n   - `TERMINATED`（已终止）：退出的线程处于此状态。\n\
  \n在给定的时刻，线程只能处于一种状态。\n\n# 3.4 Java 中的线程生命周期和线程调度\n\n#### Java 中的线程生命周期\n\n* `start`\
  \ 方法创建运行线程所需的系统资源，调度线程运行，并调用线程的 `run` 方法。\n* 当发生以下事件之一时，线程会变为“不可就绪”：\n  1. 调用了 `sleep`\
  \ 方法。\n  2. 线程调用了 `wait` 方法。\n  3. 线程在 I/O 上阻塞。\n* 当 `run` 方法退出时，线程自然死亡。\n\n下图清晰地描绘了\
  \ Java 中线程生命周期的各个阶段。\n\n![thread life cycle in java](img/image00919.jpeg)\n\n####\
  \ 2. 线程调度\n\n* 在单个 CPU 上按某种顺序执行多个线程被称为调度。\n* 通常，优先级最高的就绪线程是活跃的（运行的）。\n* Java 是优先级抢占式的：\n\
  \  1. 如果一个高优先级线程醒，而一个低优先级线程正在运行。\n  2. 那么高优先级线程将立即运行。\n* 允许按需处理。\n* 高效利用 CPU。\n\n\
  ##### 调度类型\n\n* **等待与通知**\n  1. 等待[`wait()`] 和通知[`notify()`, `notifyAll()`]提供了在同一对象上同步的线程之间的通信手段。\n\
  \  - `wait()`：当在对象上调用 `wait()` 方法时，执行该代码的线程立即放弃对对象的锁，并将线程移动到 `wait` 状态。\n  - `notify()`：唤醒在同一对象上调用\
  \ `wait()` 的线程，并将线程移动到就绪状态。\n  - `notifyAll()`：唤醒在同一对象上调用 `wait()` 的所有线程。\n\n* **运行与让出**\n\
  \  `Yield()` 用于赋予相同优先级的其他线程执行的机会，即导致当前运行的线程移动到就绪状态。\n\n* **睡眠与唤醒**\n  `sleep()`\
  \ 用于使线程暂停一段时间，即将当前运行的线程移动到 Sleep 状态持续指定的时间，然后将其移动到就绪状态。`Thread.sleep(no. of milliseconds);`。\n\
  \n* **线程优先级**\n  - 当创建一个 Java 线程时，它继承创建它的线程的优先级。\n  - 你可以在创建后的任何时间使用 `setPriority`\
  \ 修改线程的优先级。\n  - 线程优先级是介于 `MIN_PRIORITY` (1) 和 `MAX_PRIORITY` (10) 之间的整数。通常线程优先级为\
  \ 5。\n\n##### isAlive() 和 join() 方法\n\n* `isAlive()` 方法用于判断线程是否仍然存活。它是判断线程已启动但尚未完成其\
  \ `run()` 方法的最佳方法。`final boolean isAlive()`\n* `Thread` 的非静态 `join()` 方法允许一个线程“连接到另一个线程的末尾”。该方法会一直等待，直到调用它的线程执行完毕。`final\
  \ void join()`\n\n##### 阻塞线程\n\n* 从流中读取内容时，如果输入不可用，线程将阻塞。\n* 线程被挂起（阻塞），直到 I/O 可用。\n\
  * 允许其他线程自动激活。\n* 当 I/O 可用时，线程再次唤醒：1. 变为“可就绪”，即进入就绪状态。\n\n##### 线程分组\n\n* 线程组提供了一种将多个线程收集到一个对象中的机制，并一次性操作这些线程，而不是单独操作。\n\
  * 要将新线程放入线程组，必须在创建线程时显式指定组：\n  - `public Thread(ThreadGroup group, Runnable)`\n\
  \  - `public Thread(ThreadGroup group, String name)`\n  - `public Thread(ThreadGroup\
  \ group, Runnable runnable, String name)`\n* 线程在创建后无法移动到新组。\n* 当 Java 首次启动时，Java\
  \ 运行时系统会创建一个名为 `main` 的 `ThreadGroup`。\n\n\n\n\n\n## 2) 通过实现 `Runnable` 接口\n\n在我们开始创建线程的程序（代码）之前，让我们来看\
  \ `Thread` 类的这些方法。我们在下面的示例中使用了其中几个方法。\n\n- `getName()`: 用于获取线程名称。\n- `getPriority()`:\
  \ 获取线程的优先级。\n- `isAlive()`: 确定线程是否仍在运行。\n- `join()`: 等待线程终止。\n- `run()`: 线程的入口点。\n\
  - `sleep()`: 使线程暂停一段时间。\n- `start()`: 通过调用其 `run()` 方法启动线程。\n\n## 方法 1：通过扩展 `Thread`\
  \ 类创建线程\n\n### 示例 1:\n\n```java\nclass MultithreadingDemo extends Thread{ \n   \
  \ public void run(){\n        System.out.println(\"My thread is in running state.\"\
  ); \n    }  \n    public static void main(String args[]){\n        MultithreadingDemo\
  \ obj=new MultithreadingDemo();  \n        obj.start(); \n    } \n}\n```\n\n**输出：**\n\
  My thread is in running state.\n\n### 示例 2:\n\n```java\nclass Count extends Thread\
  \ {\n    Count() {\n        super(\"my extending thread\");\n        System.out.println(\"\
  my thread created\" + this);\n        start();\n    }\n    public void run() {\n\
  \        try {\n            for (int i=0 ;i<10;i++) {\n                System.out.println(\"\
  Printing the count \" + i);\n                Thread.sleep(1000);\n            }\n\
