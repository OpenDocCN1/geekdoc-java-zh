  ### 序列化/同步\n\n*   序列化 HashMap\n*   同步 HashMap\n\n#### 1) 如何在 Java 中序列化 HashMap\n\
  \n`HashMap` 类默认是可序列化的，这意味着我们不需要为了符合序列化条件而实现 `Serializable` 接口。在共享完整代码之前，让我提供关于序列化和反序列化的简要信息。\n\
  \n序列化：将对象连属性和内容写入文件的过程。它内部将对象转换为字节流。\n\n反序列化：从文件中读取对象及其属性内容的过程。\n\n示例：\n\n在下面的类中，我们将\
  \ `HashMap` 内容存储在 `hashmap.ser` 序列化文件中。运行下面的代码后将生成一个 `hashmap.ser` 文件。该文件将用于下一个类进行反序列化。\n\
  \n```java\npackage javabook.com;\n\nimport java.io.*;\nimport java.util.HashMap;\n\
  \npublic class Details {\n    public static void main(String[] args) {\n       \
  \ HashMap<Integer, String> hmap = new HashMap<Integer, String>();\n        // 向\
  \ HashMap 添加元素\n        hmap.put(11, \"AB\");\n        hmap.put(2, \"CD\");\n  \
  \      hmap.put(33, \"EF\");\n        hmap.put(9, \"GH\");\n\n        // 序列化逻辑\n\
  \        ObjectOutputStream out = new ObjectOutputStream(new FileOutputStream(\"\
  hashmap.ser\"));\n        out.writeObject(hmap);\n        out.close();\n       \
  \ System.out.println(\"HashMap serialized to hashmap.ser\");\n    }\n}\n```\n\n\n\
  \n```java\nhmap.put(3, \"IJ\");\n\ntry {\n    FileOutputStream fos = new FileOutputStream(\"\
  hashmap.ser\");\n    ObjectOutputStream oos = new ObjectOutputStream(fos);\n   \
  \ oos.writeObject(hmap);\n    oos.close();\n    fos.close();\n    System.out.printf(\"\
  Serialized HashMap data is saved in hashmap.ser\");\n} catch (IOException ioe) {\n\
  \    ioe.printStackTrace();\n}\n```\n\n**输出:**\n`Serialized HashMap data is saved\
  \ in hashmap.ser`\n\n反序列化：这里我们正在重现 `HashMap` 对象，它的内容来自我们运行上述代码生成的序列化文件。\n\n```java\n\
  package javabook.com;\n\nimport java.io.*;\nimport java.util.HashMap;\nimport java.util.Map;\n\
  import java.util.Iterator;\nimport java.util.Set;\n\npublic class Student {\n  \
