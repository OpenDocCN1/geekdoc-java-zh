  \ 1 到 100 之间的质数。\n\n```java\nclass PrimeNumbers\n{\n  public static void main (String[]\
  \ args)\n  {\n    int i =0;\n    int num =0;\n    //空字符串\n  }\n}\n```\n\n\n\n\n\n\
  ```java\nString primeNumbers = \"\";\n\nfor (i = 1; i <= 100; i++) {\n  int counter\
