  \           return;\n        }\n        System.out.println(\"Deserialized HashMap..\"\
  );\n        // 使用 Iterator 显示内容\n        Set set = map.entrySet();\n        Iterator\
  \ iterator = set.iterator();\n        while (iterator.hasNext()) {\n           \
  \ Map.Entry mentry = (Map.Entry)iterator.next();\n            System.out.print(\"\
  key: \" + mentry.getKey() + \" & Value: \");\n            System.out.println(mentry.getValue());\n\
  \        }\n    }\n}\n```\n\n**输出:**\n`Deserialized HashMap..`\n`key: 9 & Value:\
  \ GH`\n`key: 2 & Value: CD`\n`key: 11 & Value: AB`\n`key: 33 & Value: EF`\n`key:\
  \ 3 & Value: IJ`\n\n## 2) 如何在 Java 中同步 HashMap（带示例）\n\n`HashMap` 是一个非同步集合类。如果我们需要对它执行线程安全的操作，就必须显式地对其进行同步。在本教程中，我们将学习如何同步\
  \ `HashMap`。\n\n### 示例：\n在例示例中，我们有一个 `HashMap<Integer, String>`，它包含整数类型的键和 `String`\
  \ 类型的值。为了对它进行同步，我们使用 `Collections.synchronizedMap(hashmap)`，它返回一个由指定的 `HashMap`\
  \ 支持的线程安全的 map。\n\n**下示例中需要注意的重要点：**\n即使我们已经显式地同步了 `HashMap`（如我们在下面的代码中所做），`Iterator`\
  \ 也应该在同步块中使用中使用。\n\n### 语法：\n```java\nMap map = Collections.synchronizedMap(new\
  \ HashMap());\n...\n\n// 这不需要在同步块中\nSet set = map.keySet();\n\n// 在 map 上进行同步，而不是在\
  \ set 上\nsynchronized (map) {\n // Iterator 必须在同步块中\n    Iterator iterator = set.iterator();\n\
  \    while (iterator.hasNext()){\n        ...\n    }\n}\n```\n\n### 完整代码：\n```java\n\
  package javabook.com;\n\nimport java.util.Collections;\nimport java.util.HashMap;\n\
  import java.util.Map;\nimport java.util.Set;\nimport java.util.Iterator;\n\npublic\
  \ class HashMapSyncExample {\n    public static void main(String args[]) {\n   \
  \     HashMap<Integer, String> hmap= new HashMap<Integer, String>();\n        hmap.put(2,\
  \ \"Arun\");\n        hmap.put(3, \"IJ\"); // 注意：根据提供的文本修正了逻辑\n        // ... 逻辑继续\n\
  \    }\n}\n```\n\n## 3) Java 中 ArrayList vs HashMap\n\n`ArrayList` 和 `HashMap` 是不同的集合。\n\
  \n### 1) 实现\n`ArrayList` 是基于列表的集合，而 `HashMap` 是基于 map 的集合。\n\n### 2) 内存消耗\n`ArrayList`\
  \ 使用的内存比 `HashMap` 少，因为它只存储元素。\n\n### 3) 顺序\n`ArrayList` 维护插入顺序。`HashMap` 不保证顺序。\n\
  \n### 4) 重复\n`ArrayList` 允许重复元素。`HashMap` 不允许重复键。\n\n### 5) 空值\n`ArrayList` 允许多个空元素。`HashMap`\
  \ 允许一个空键和多个空值。\n\n### 6) get 方法\n在 `ArrayList` 中我们可以通过索引获取元素。在 `HashMap` 中我们通过键获取元素。\n\
  \n\n\n\n# HashSet 与 HashMap 的比较\n\n| `HashSet` 类实现了 `Set` 接口 | `HashMap` 类实现了 `Map`\
  \ 接口 |\n| :--- | :--- |\n| 在 `HashSet` 中，我们存储对象（元素或值），例如：如果我们有一个包含字符串元素的 `HashSet`，那么它可以描绘一个\
  \ `HashSet` 元素集合：`{“Hello”, “Hi”, “Bye”, “Run”}` | `HashMap` 用于存储键值值对。简而言之，它维护了键和值的映射（`HashMap`\
  \ 类大致等同于 `Hashtable`，不同之处它是未同步的并且允许为 null 值）。如果 `HashMap` 具有整数类型的键和 String 类型的值，你可以像这样表示\
  \ `HashMap` 元素：例如：`{1->”Hello”, 2->”Hi”, 3->”Bye”, 4->”Run”}` |\n| `HashSet` 不允许重复元素，这意味着你不能在\
  \ `HashSet` 中存储重复的值。 | `HashMap` 不允许重复的键，但它允许重复的值。 |\n| `HashSet` 允许有一个单个 `null`\
  \ 值。 | `HashMap` 允许单个 `null` 键和任意数量的 `null` 值。 |\n\n## 相似点\n\n1) `HashMap` 和 `HashSet`\
  \ 都不是同步的，这意味着除非显式同步，否则它们不适用于线程安全操作。以下是你可以如何显式地同步它们的方法：\n\n**HashSet:**\n```java\n\
  Set s = Collections.synchronizedSet(new HashSet(...));\n```\n\n**HashMap:**\n```java\n\
  Map m = Collections.synchronizedMap(new HashMap(...));\n```\n\n2) 这两个类都不保证其元素的顺序随时间推移保持不变。\n\
  \n3) 如果你查看 `HashSet` 的源代码，可能会发现它是由一个 `HashMap` 支持的。所以基本上，它在内部使用 `HashMap` 来执行所有操作。\n\
  \n4) 它们都为基本操作（如添加元素、删除元素等）提供了常数级性能。\n\n## HashSet 示例\n\n```java\nimport java.util.HashSet;\n\
  \nclass HashSetDemo{\n public static void main(String[] args) {\n    // 创建一个 HashSet\n\
  \    HashSet<String> hset = new HashSet<String>();\n    // 向 HashSet 中添加元素\n   \
  \ hset.add(\"AA\");\n    hset.add(\"BB\");\n    hset.add(\"CC\");\n    hset.add(\"\
  DD\");\n    // 显示 HashSet 元素\n    System.out.println(\"HashSet contains: \");\n\
  \    for(String temp : hset){\n    System.out.println(temp);\n    }\n  }\n}\n```\n\
  \n**输出：**\n```\nHashSet contains:\nAA\nBB\nCC\nDD\n```\n\n## HashMap 示例\n\n```java\n\
  import java.util.HashMap;\n\nclass HashMapDemo{\n public static void main(String[]\
  \ args) {\n    // 创建一个 HashMap\n    HashMap<Integer, String> hmap = new HashMap<Integer,\
  \ String>();\n    // 向 HashMap 中添加元素\n    hmap.put(1, \"AA\");\n    hmap.put(2,\
  \ \"BB\");\n    hmap.put(3, \"CC\");\n    hmap.put(4, \"DD\");\n    // 显示 HashMap\
  \ 元素\n    System.out.println(\"HashMap contains: \"+hmap);\n  }\n}\n```\n\n**输出：**\n\
  ```\nHashMap contains: {1=AA, 2=BB, 3=CC, 4=DD}\n```\n\n## 1.15 Java 中的 TreeMap\n\
  \n## Java 中的 TreeMap 示例\n\nJava 中的 `TreeMap` 是基于红黑树的 `NavigableMap` 实现。它根据其键的自然顺序进行排序。\n\
  \n`TreeMap` 类实现了 `Map` 接口，类似于 `HashMap` 类。它们之间的主要区别是 `HashMap` 是一个无序集合，而 `TreeMap`\
  \ 是按键的升序排序的。`TreeMap` 是未同步集合类，这意味着除非显式同步，否则它不适用于线程安全操作。\n\n### TreeMap 示例\n\n在此示例中，我们将键值映射存储到\
  \ `TreeMap` 中，并在从 `TreeMap` 获取数据时，获得一个排序后的键值映射。\n\n```java\nimport java.util.TreeMap;\n\
  import java.util.Set;\nimport java.util.Iterator;\nimport java.util.Map;\n\npublic\
  \ class Details {\n public static void main(String args[]) {\n    /* 如下所示声明 TreeMap\
  \ */\n    TreeMap<Integer, String> tmap = new TreeMap<Integer, String>();\n    /*\
  \ 向 TreeMap 中添加元素*/\n    tmap.put(1, \"Data1\");\n    tmap.put(23, \"Data2\");\n\
  \    tmap.put(70, \"Data3\");\n    tmap.put(4, \"Data4\");\n    tmap.put(2, \"Data5\"\
  );\n    /* 使用 Iterator 显示内容*/\n    Set set = tmap.entrySet();\n    Iterator iterator\
  \ = set.iterator();\n    while(iterator.hasNext()) {\n     Map.Entry mentry = (Map.Entry)iterator.next();\n\
  \     System.out.print(\"key is: \"+ mentry.getKey() + \" & Value is: \");\n   \
  \  System.out.println(mentry.getValue());\n    }\n  }\n}\n```\n\n**输出：**\n```\n\
  key is: 1 & Value is: Data1\nkey is: 2 & Value is: Data5\nkey is: 4 & Value is:\
  \ Data4\nkey is: 23 & Value is: Data2\nkey is: 70 & Value is: Data3\n```\n你可以看到，我们插入的元素是按顺序的。\n\
  \n如你所见，我们插入的元素是按顺序排列的。\n\n## 1.16 TreeMap 教程\n\n- `TreeMap` 值\n- `TreeMap` 迭代器\n\
