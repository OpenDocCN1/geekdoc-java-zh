  \            .filter(n -> n.id > 22)\n            .collect(Collectors.toSet());\n\
  \n        // 遍历 Set\n        for (Student stu : students) {\n            System.out.println(stu.id\
  \ + \" \" + stu.name + \" \" + stu.age);\n        }\n    }\n}\n```\n**输出：**\n```\n\
  44 Sansa 23\n33 Lucy 22\n55 Maggie 18\n```\n\n# Java Collectors 示例 – 使用 averagingInt()\
  \ 方法获取平均年龄\n\n```java\nimport java.util.stream.Collectors;\nimport java.util.List;\n\
  import java.util.ArrayList;\n\nclass Student {\n    int id;\n    String name;\n\
