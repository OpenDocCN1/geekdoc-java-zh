  );\n    }\n}\n```\n\n\n\n\n\n```java\nSystem.out.println(\"Vector elements after\
  \ replacement: \");\n\nfor(int i=0; i < vector.size(); i++) {\n    System.out.println(vector.get(i));\n\
  }\n```\n\n**Output:**\nVector elements before replacement:\nHari\nSteve\nVince\n\
  David\nMatt\nVector elements after replacement:\nHari\nMark\nJack\nDavid\nMatt\n\
  \n## 如何设置 Vector 大小示例\n\n我们可以使用 `Vector` 类的 `setSize()` 方法来设置 `Vector` 的大小。如果新大小大于当前大小，则当前大小索引之后的所有元素将具有\
  \ `null` 值。如果新大小小于当前大小，则当前大小索引之后的元素将从 `Vector` 中删除。\n\n### 示例：\n这里 `Vector` 初始有\
  \ 5 个元素。我们将大小设置为 `10`，因此 5 个 `null` 元素被插入到 `Vector` 的末尾。\n\n在程序的后半部分，我们将大小设置为 `4`（小于当前大小\
  \ `10`），因此最后 6 个元素（包括 `null` 元素）从 `Vector` 中被删除。\n\n```java\nimport java.util.Vector;\n\
  \npublic class SetSizeExample {\n    public static void main(String[] args) {\n\
  \        // 创建一个 Vector\n        Vector<String> vector = new Vector<String>();\n\
  \        // 向 Vector 添加元素\n        vector.add(\"Walter\");\n        vector.add(\"\
  Anna\");\n        vector.add(\"Hank\");\n        vector.add(\"Flynn\");\n      \
  \  vector.add(\"Tomy\");\n        // 设置大于当前大小的大小\n        vector.setSize(10);\n\
  \        System.out.println(\"Vector size: \"+vector.size());\n        System.out.println(\"\
  Vector elements: \");\n        for(int i=0; i < vector.size(); i++){\n         \
  \   // get(i) 方法从索引 i 获取元素\n            System.out.println(vector.get(i));\n   \
  \     }\n        // 设置小于当前大小的大小\n        vector.setSize(4);\n        System.out.println(\"\
  \\nVector size: \"+vector.size());\n        System.out.println(\"Vector elements:\
  \ \");\n        for(int i=0; i < vector.size(); i++){\n            System.out.println(vector.get(i));\n\
  \        }\n    }\n}\n```\n\n**Output:**\nVector size: 10\nVector elements:\nWalter\n\
  Anna\nHank\nFlynn\nTomy\nnull\nnull\nnull\nnull\nnull\nVector size: 4\nVector elements:\n\
  Walter\nAnna\nHank\nFlynn\n\n## 1.8 Iterator/ListIterator/Enumeration\n\n* Vector\
  \ 枚举示例\n* Vector Iterator 示例\n* Vector ListIterator 示例\n\n### Java 中的 Vector 枚举示例\n\
  \n步骤如下：\n1) 创建一个 `Vector` 对象。\n2) 使用 `Vector` 类的 `add()` 方法向 vector 添加元素。\n3) 调用\
  \ `elements()` 方法获取指定 `Vector` 的枚举器 (`Enumeration`)。\n4) 使用 `Enumeration` 的 `hasMoreElements()`\
  \ 和 `nextElement()` 方法遍历 `Vector`。\n\n### 示例：完整代码\n```java\nimport java.util.Vector;\n\
  import java.util.Enumeration;\n\npublic class VectorEnumerationExample {\n    public\
  \ static void main(String[] args) {\n        // 创建一个 Vector\n        Vector<String>\
  \ vector = new Vector<String>();\n        // 向 Vector 添加元素\n        vector.add(\"\
  prabha\");\n        vector.add(\"Siva\");\n        vector.add(\"Aparna\");\n   \
  \     vector.add(\"john\");\n        vector.add(\"jack\");\n        // 获取 Vector\
  \ 元素的枚举\n        Enumeration en = vector.elements();\n        /* 使用 hasMoreElements()\n\
  \           * 和 nextElement() 方法显示 Vector 元素 */\n        System.out.println(\"Vector\
  \ elements are: \");\n        while(en.hasMoreElements())\n            System.out.println(en.nextElement());\n\
  \    }\n}\n```\n**Output:**\nVector elements are:\nprabha\nSiva\nAparna\nJohn\n\
  Jack\n\n### Java 中的 Vector Iterator 示例\n\n在这个示例中，我们将看到如何使用 `Iterator` 遍历 `Vector`。步骤如下：\n\
  1) 创建一个 `Vector`。\n2) 使用 `Vector` 类的 `add(Element E)` 方法向其添加元素。\n3) 通过调用 `Vector`\
  \ 的 `iterator()` 方法获取迭代器。\n4) 使用 `Iterator` 的 `hasNext()` 和 `next()` 方法遍历 `Vector`。\n\
  \n### 示例：\n```java\nimport java.util.Vector;\nimport java.util.ListIterator;\nimport\
  \ java.util.Iterator;\n\npublic class VectorIteratorExample {\n    public static\
  \ void main(String[] args) {\n        // 创建一个 String  Vector\n        Vector<String>\
  \ vector = new Vector<String>();\n        // 向 Vector 添加元素\n        vector.add(\"\
  Mango\");\n        vector.add(\"Banana\");\n        vector.add(\"Apple\");\n   \
  \     vector.add(\"Grapes\");\n        vector.add(\"Kiwi\");\n        // 获取迭代器\n\
  \        Iterator it = vector.iterator();\n        System.out.println(\"Vector elements\
  \ are:\");\n        while(it.hasNext()){\n            System.out.println(it.next());\n\
  \        }\n    }\n}\n```\n**Output:**\nVector elements are:\nMango\nBanana\nApple\n\
  Grapes\nKiwi\n\n### Java 中的 Vector ListIterator 示例\n\n我们可以使用 `ListIterator` 正向和反向方向遍历\
  \ `Vector`。同时，我们还可以使用其他方法执行若干操作，例如使用 `ListIterator` 方法进行显示元素、替换元素等操作。\n\n### 示例：\n\
  这里有一个 `Vector` 字符串，我们使用 `ListIterator` 对其进行遍历。\n\n```java\nimport java.util.Vector;\n\
  import java.util.ListIterator;\n\npublic class VectorListIterator {\n    public\
  \ static void main(String[] args) {\n        // 创建一个 Vector\n        Vector<String>\
  \ vector = new Vector<String>();\n        // 向 Vector 添加元素\n        vector.add(\"\
