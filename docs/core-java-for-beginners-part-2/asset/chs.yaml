  \ after replacing 'o' with 'p' :Site is javappk.com\nString after replacing 'i'\
  \ with 'K' :jaKBook.com\n\n#### 示例 2: replaceFirst() 方法\n```java\npublic class Example2\
  \ {\n    public static void main(String args[]) {\n        String str = new String(\"\
  Site is javaBook.com\");\n        System.out.print(\"String after replacing com\
  \ with net :\");\n        System.out.println(str.replaceFirst(\"com\", \"net\"));\n\
  \        System.out.print(\"String after replacing Site name:\");\n        System.out.println(str.replaceFirst(\"\
  (.*)\", \"XYZ.com\"));\n}\n}\n```\n**输出：**\nString after replacing com with net\
  \ :Site is javaBook.net\nString after replacing Site name:XYZ.com\n\n#### 示例 3:\
  \ replaceAll() 方法\n```java\npublic class Example3 {\n    public static void main(String\
  \ args[]) {\n        String str = new String(\"My .com site is javaBook.com\");\n\
  \        System.out.print(\"String after replacing all com with net :\");\n    \
  \    System.out.println(str.replaceAll(\"com\", \"net\"));\n    }\n}\n```\n**输出：**\n\
  String after replacing all com with net :My .net site is javaBook.net\n\n### boolean\
  \ contains(CharSequence s)\n检查字符串是否包含指定的字符序列。如果是返回 true，否则返回 false。如果 `s` 为 null\
  \ 则抛出 `NullPointerException`。\n\n#### Java String contains() 方法详解\nJava String contains()\
  \ 方法检查一个字符串是否是另一个字符串的一部分。如果指定的字符序列存在于给定字符串中，该方法返回 true，否则返回 false。\n\n**示例：**\n\
  ```java\nString str = \"Game of Thrones\";\n// 因为 \"Game\" 存在于给定字符串中，此将打印 \"true\"\
  \nSystem.out.println(str.contains(\"Game\"));\n\n/* 因为 \"aGme\" 不存在，字符必须以 contains\
  \ 方法指定的相同顺序\n* 出现。此将打印 \"false\"\n */\nSystem.out.println(str.contains(\"aGme\"\
  ));\n```\n\n**contains 方法的语法**\n```java\npublic boolean contains(CharSequence str)\n\
  ```\n\n\n\n\n返回类型为 `boolean`，这意味着该方法返回 `true` 或 `false`。当在给定字符串中找到字符序列时，该方法返回 `true`，否则返回\
  \ `false`。\n\n如果 `CharSequence` 为 `null`，则该方法将抛出 `NullPointerException`。\n\n例如：这样调用此方法将抛出\
  \ `NullPointerException`。\n\n```\nstr.contains(null);\n```\n\n### Java String contains()\
  \ 方法示例\n\n第二个打印语句显示 `false`，是因为 `contains()` 方法是区分大小写的。你也可以使用 `contains()` 方法进行不区分大小写的检查，我已已经在本教程的最后介绍了这一点。\n\
  \n```java\nclass  Example{ \n\n public  static  void main(String args[]){\n\nString\
  \ str = \"Do you like watching Game of Thrones\"; \n\nSystem.out.println(str.contains(\"\
  like\"));\n\n/* 这将会打印 false，因为 contains() 方法是\n* 区分大小写的。在这里我们提到了大写的字母 \"l\"\n* 在实际字符串中，该字母是\n\
  * 小写的。\n*/\n\nSystem.out.println(str.contains(\"Like\"));\n\nSystem.out.println(str.contains(\"\
  Game\"));\n\nSystem.out.println(str.contains(\"Game of\"));\n\n  }\n}\n```\n\nOutput:\n\
  ```\ntrue\nfalse\ntrue\ntrue\n```\n\n### 示例 2：在 if-else 语句中使用 Java String contains()\
  \ 方法\n\n```java\nclass  Example{ \n\n public  static  void main(String args[]){\n\
  \nString str = \"This is an example of contains()\"; \n\n/* 在 if-else 语句中使用 contains()\
  \ 方法，因为\n* 该方法返回布尔值，因此可以在需要时\n* 用于 if-else 条件。\n*/\n\nif(str.contains(\"example\"\
  )){\n\n System.out.println(\"The word example is found in given string\");\n\n}\n\
  \nelse{\n\n System.out.println(\"The word example is not found in the string\");\n\
  \n}\n\n  }\n}\n```\n\nOutput:\n```\nThe word example is found in given string\n\
  ```\n\n### 用于不区分大小检查的 Java String contains() 方法\n\n我们上面看到 `contains()` 方法是区分大小写的，但通过一个小技巧，你可以使用此方法进行不区分大小写的检查。让我们来看一个例子来理解这一点：\n\
  \n在这里，我们使用 `toLowerCase()` 方法将两个字符串都转换为小写，这样就可以使用 `contains()` 方法执行不区分大小写的检查。我们也可以像下面的示例所示，使用\
  \ `toUpperCase()` 方法来实现相同的目的。\n\n```java\nclass  Example{ \n\n public  static  void\
  \ main(String args[]){\n\nString str = \"Just a Simple STRING\";\nString str2 =\
  \ \"string\";\n\n// 将两个字符串转换为小写以进行不区分大小写的检查\n\nSystem.out.println(str.toLowerCase().contains(str2.toLowerCase()));\n\
  \n// 你也可以使用大写方法来实现相同的目的\n\nSystem.out.println(str.toUpperCase().contains(str2.toUpperCase()));\n\
  \n  }\n}\n```\n\nOutput:\n```\ntrue\ntrue\n```\n\n21) `String toUpperCase(Locale\
  \ locale)`：使用指定 locale 的规则将字符串转换为大写字符串。\n\n### Java – String toLowerCase() 和 toUpperCase()\
  \ 方法\n\n`toLowerCase()` 方法将 `String` 的字符转换为小写字母。它有两个变体：\n\n`String toLowerCase(Locale\
  \ locale)`：它使用指定 Locale 定义的规则将字符串转换为小写。\n\n`String toLowerCase()`：\n\n它等同于 `toLowerCase(Locale.getDefault())`。`Locale.getDefault()`\
  \ 获取此 Java 虚拟机实例的默认 locale 的当前值。Java 虚拟机在启动期间根据主机环境设置默认 locale。如果没有显式指定 locale，许多\
  \ locale 敏感的方法都会使用它。可以使用 `setDefault()` 方法进行更改。\n\n#### 示例：`toLowerCase()` 方法\n\n\
  ```java\nimport java.util.Locale;\n\npublic  class  LowerCaseExample{\n\n public\
  \  static  void main(String args[]){\n\n String str = new  String(\"ABC IS NOT EQUAL\
  \ TO XYZ\");\n\n // 标准转换方法\n\n System.out.println(str.toLowerCase());\n\n // 通过指定\
  \ Locale\n\n System.out.println(str.toLowerCase(Locale.FRANCE));\n\n  }\n}\n```\n\
