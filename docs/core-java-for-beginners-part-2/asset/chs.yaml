  \ 都按升序排列了。\n[ABC, Jack, Pen, String, Test]\n[0, 3, 7, 88, 101, 222]\n```\n\n## 1.19\
  \ Java 中的 LinkedHashMap\n\n`LinkedHashMap` 是 `Map` 接口的哈希表和链表实现。它与 `HashMap` 不同之处在于它维护了一个双向链表以提供可预测的迭代顺序。\n\
  \n* `HashMap` 不维护任何顺序。\n* `TreeMap` 按升序排序项。\n* `LinkedHashMap` 维护插入顺序。\n\n通过以下示例理解\
  \ `LinkedHashMap`：\n\n```java\nimport java.util.LinkedHashMap;\nimport java.util.Set;\n\
  import java.util.Iterator;\nimport java.util.Map;\n\nclass LinkedHashMapDemo {\n\
  \    public static void main(String args[]) {\n        // HashMap \n        LinkedHashMap<Integer,\
  \ String> lhmap = new LinkedHashMap<Integer, String>();\n        // 向 LinkedHashMap\
  \ 添加元素\n        lhmap.put(22, \"Abey\");\n        lhmap.put(33, \"Dawn\");\n   \
  \     lhmap.put(1, \"Sherry\");\n        lhmap.put(2, \"Karon\");\n        lhmap.put(100,\
  \ \"Jim\");\n        // 生成一个 Set\n        Set set = lhmap.entrySet();\n        //\
  \ 显示 LinkedHashMap 元素\n        Iterator iterator = set.iterator();\n        while(iterator.hasNext())\
  \ {\n            Map.Entry me = (Map.Entry)iterator.next();\n            System.out.print(\"\
  Key is: \"+ me.getKey() + \"& Value is: \"+me.getValue()+\"\\n\");\n        }\n\
  \    }\n}\n```\n**输出：**\n```text\nKey is: 22 & Value is: Abey\nKey is: 33 & Value\
  \ is: Dawn\nKey is: 1 & Value is: Sherry\nKey is: 2 & Value is: Karon\nKey is: 100\
  \ & Value is: Jim\n```\n可以看到值按照插入顺序返回。\n\n## 1.20 Java 中的 LinkedHashSet 类\n\n之前我们分享了\
  \ `HashSet` 和 `TreeSet` 的教程。`LinkedHashSet` 也是 `Set` 接口的实现，它与 `HashSet` 的不同之处如下：\n\
  \n1. `HashSet` 不维护元素的任何种顺序。\n2. `TreeSet` 按升序排序元素。\n3. `LinkedHashSet` 维护插入顺序。元素按照它们添加到\
  \ Set 的顺序排序。\n\n**示例：**\n```java\nimport java.util.LinkedHashSet;\n\npublic class\
  \ LinkedHashSetExample {\n    public static void main(String args[]) {\n       \
  \ // String 类型的 LinkedHashSet\n        LinkedHashSet<String> lhset = new LinkedHashSet<String>();\n\
  \        // 向 LinkedHashSet 添加元素\n        lhset.add(\"Z\");\n        lhset.add(\"\
  PQ\");\n        lhset.add(\"N\");\n        lhset.add(\"O\");\n        lhset.add(\"\
  KK\");\n        lhset.add(\"FGH\");\n        System.out.println(lhset);\n      \
  \  // Integer 类型的 LinkedHashSet\n        LinkedHashSet<Integer> lhset2 = new LinkedHashSet<Integer>();\n\
  \        // 添加元素\n        lhset2.add(99);\n        lhset2.add(7);\n        lhset2.add(0);\n\
  \        lhset2.add(67);\n        lhset2.add(89);\n        lhset2.add(66);\n   \
  \     System.out.println(lhset2);\n    }\n}\n```\n**输出：**\n```text\n[Z, PQ, N, O,\
  \ KK, FGH]\n[99, 7, 0, 67, 89, 66]\n```\n\n\n\n\n\n## 1.21 Java 中的 Hashtable\n\n\
  Java 中的 Hashtable 示例\n\n该类实现了一个哈希表，它将键映射到值。任何非空对象都可以作为键或值。`Hashtable` 与 `HashMap`\
  \ 类似，区别在于它是同步的。\n\n示例：\n\n```java\nimport java.util.Hashtable;\nimport java.util.Enumeration;\n\
  \npublic class HashtableExample {\n    public static void main(String[] args) {\n\
  \        Enumeration names;\n        String key;\n        // 创建一个 Hashtable\n  \
  \      Hashtable<String, String> hashtable = new Hashtable<String, String>();\n\
  \        // 向 Hashtable 添加键值值对\n        hashtable.put(\"Key1\",\"Chandru\");\n \
  \       hashtable.put(\"Key2\",\"Ajith\");\n        hashtable.put(\"Key3\",\"Peter\"\
  );\n        hashtable.put(\"Key4\",\"Ricky\");\n        hashtable.put(\"Key5\",\"\
  Mona\");\n        names = hashtable.keys();\n        while(names.hasMoreElements())\
  \ {\n            key = (String) names.nextElement();\n            System.out.println(\"\
  Key: \" +key+ \" & Value: \" + hashtable.get(key));\n        }\n    }\n}\n```\n\n\
  输出：\n```\nKey: Key4 & Value: Ricky\nKey: Key3 & Value: Peter\nKey: Key2 & Value:\
  \ Ajith\nKey: Key1 & Value:Chandru\nKey: Key5 & Value: Mona\n```\n\n### 1.21.1 Hashtable\
  \ 类的方法\n\n1) `void clear()`：从 `Hashtable` 中移除所有键值映射并使其变空。清除此哈希表，使其不包含任何键。\n2) `Object\
  \ clone()`：创建此哈希表的浅拷贝。哈希表本身的所有结构会被复制，但键和值不会被克隆。这是一个相对开销较大的操作。\n3) `boolean contains(Object\
  \ value)`：测试此哈希表中是否有某个键映射到指定的值。此操作比 `containsKey` 方法开销更大。请注意，该方法的功能上与 `containsValue`（它是集合框架中\
  \ `Map` 接口的一部分）完全相同。\n4) `boolean isEmpty()`：测试此哈希表是否没有键映射到值。\n5) `Enumeration keys()`：返回哈希表中包含的键的枚举。\n\
  6) `Object put(Object key, Object value)`：将指定的键映射到此哈希表中的指定值。\n7) `void rehash()`：增加哈希表的大小并对其其所有键进行重新哈希。\n\
  8) `Object remove(Object key)`：从此哈希表中移除指定的键（及其对应的值）。\n9) `int size()`：返回 `Hashtable`\
  \ 中存在的键值映射的数量。\n10) `String toString()`：返回哈希表的字符串等效表示。\n11) `boolean containsKey(Object\
  \ key)`：测试指定的对象是否为此哈希表中的键。\n12) `boolean containsValue(Object value)`：测试指定的对象是否为此哈希表中的值。如果哈希表中存在与\
  \ `value` 相等的值，则返回 true。如果未找到该值则返回 false。\n13) `Enumeration elements()`：返回哈希表中包含的值的枚举。\n\
  14) `Object get(Object key)`：返回指定键的映射值，如果此映射不包含该键的映射则返回 null。\n\n## 1.22 Hashtable\
  \ 教程\n\nJava 中的 Hashtable 示例\n\n该类实现了一个哈希表，它将键映射到值。任何非空对象都可以作为键或值。`Hashtable` 与\
  \ `HashMap` 类似，区别在于它是同步的。\n\n示例：\n\n```java\nimport java.util.Hashtable;\nimport\
  \ java.util.Enumeration;\n\npublic class HashtableExample {\n    public static void\
  \ main(String[] args) {\n        Enumeration names;\n        String key;\n     \
  \   // 创建一个 Hashtable\n        Hashtable<String, String> hashtable = new Hashtable<String,\
  \ String>();\n        // 向 Hashtable 添加键值值对\n        hashtable.put(\"Key1\",\"Chandru\"\
  );\n        hashtable.put(\"Key2\",\"Ajith\");\n        hashtable.put(\"Key3\",\"\
  Peter\");\n        hashtable.put(\"Key4\",\"Ricky\");\n        hashtable.put(\"\
  Key5\",\"Mona\");\n        names = hashtable.keys();\n        while(names.hasMoreElements())\
  \ {\n            key = (String) names.nextElement();\n            System.out.println(\"\
  Key: \" +key+ \" & Value: \" + hashtable.get(key));\n        }\n    }\n}\n```\n\n\
  输出：\n```\nKey: Key4 & Value: Ricky\nKey: Key3 & Value: Peter\nKey: Key2 & Value:\
  \ Ajith\nKey: Key1 & Value:Chandru\nKey: Key5 & Value: Mona\n```\n\n### 如何在 Java\
  \ 中排序 Hashtable\n\n`Hashtable` 不保留插入顺序，也不会根据键或值对插入的数据进行排序。这意味着无论你向 `Hashtable` 插入什么键值对，结果都不会以任何特定的顺序排列。\n\
  \n示例：\n\n```java\nimport java.util.*;\npublic class HashtableDemo {\n    public\
  \ static void main(String args[]) {\n        Hashtable<Integer, String> ht = new\
  \ Hashtable<Integer, String>();\n        ht.put(10, \"Chandru\");\n        ht.put(1,\
  \ \"Ajith\");\n        ht.put(11, \"Test\");\n        ht.put(9, \"Demo\");\n   \
  \     ht.put(3, \"Anuj\");\n        Set set = ht.entrySet();\n        Iterator i\
  \ = set.iterator();\n        while(i.hasNext()) {\n            Map.Entry me = (Map.Entry)i.next();\n\
  \            System.out.print(me.getKey() + \": \");\n            System.out.println(me.getValue());\n\
  \        }\n    }\n}\n```\n\n输出：\n```\n10: Chandru\n9: Demo\n3: Anuj\n1: Ajith\n\
  11: Test\n```\n正如你看到的，输出的键值对是随机的。我们既没有得到插入顺序，值也没有根据键或值排序。\n\n### 解决方案\n\n使用 `Collections.sort`\
  \ 排序 `Hashtable` 的方法，但最好的做法是使用 `LinkedHashMap` 或 `TreeMap`。\n- 使用 `LinkedHashMap`：当你想要保留插入顺序时。\n\
  - 使用 `TreeMap`：当你想对键值对进行排序时。\n\n#### 使用 LinkedHashMap\n\n```java\nimport java.util.*;\n\
  public class LinkedHashMapDemo {\n    public static void main(String args[]) {\n\
  \        LinkedHashMap<Integer, String> lhm = new LinkedHashMap<Integer, String>();\n\
  \        lhm.put(10, \"Chandru\");\n        lhm.put(1, \"Ajith\");\n        lhm.put(11,\
  \ \"Test\");\n        lhm.put(9, \"Demo\");\n        lhm.put(3, \"Anuj\");\n   \
  \     Set set = lhm.entrySet();\n        Iterator i = set.iterator();\n        while(i.hasNext())\
  \ {\n            Map.Entry me = (Map.Entry)i.next();\n            System.out.print(me.getKey()\
  \ + \": \");\n            System.out.println(me.getValue());\n        }\n    }\n\
  }\n```\n\n输出：\n```\n10: Chandru\n1: Ajith\n11: Test\n9: Demo\n3: Anuj\n```\n漂亮！我们得到了插入顺序的结果。\n\
  \n#### 使用 TreeMap\n\n如果我们想要获得排序的结果怎么办？使用 `TreeMap`。参考以下示例：\n\n```java\nimport java.util.*;\n\
  public class TreeMapDemo {\n    public static void main(String args[]) {\n     \
  \   TreeMap<Integer, String> tm = new TreeMap<Integer, String>();\n        tm.put(10,\
  \ \"Chandru\");\n        tm.put(1, \"Ajith\");\n        tm.put(11, \"Test\");\n\
  \        tm.put(9, \"Demo\");\n        tm.put(3, \"Anuj\");\n        Set set = tm.entrySet();\n\
  \        Iterator i = set.iterator();\n        while(i.hasNext()) {\n          \
  \  Map.Entry me = (Map.Entry)i.next();\n            System.out.print(me.getKey()\
  \ + \": \");\n            System.out.println(me.getValue());\n        }\n    }\n\
  }\n```\n\n输出：\n```\n1: Ajith\n3: Anuj\n9: Demo\n10: Chandru\n11: Test\n```\n正如你看到的，我们输出是根据键排序的。\n\
  \n### Hashtable Iterator 示例\n\n示例：\n下面的程序使用了多种方法（来自 `Hashtable` 类和 `Iterator` 接口）。\n\
  \n```java\nimport java.util.Hashtable;\nimport java.util.Set;\nimport java.util.Iterator;\n\
  \npublic class IterateHashtable {\n    public static void main(String[] args) {\n\
  \        String str;\n        // 创建 Hashtable 实例\n        Hashtable<String, String>\
  \ hashtable = new Hashtable<String, String>();\n        /* 向 Hashtable 添加键值对\n \
  \        * public V put(K key, V value): 将指定的键映射到此哈希表中的\n         * 指定值。键和值都不能为空。可以通过调用与原始键\n\
  \         *相同的 get 方法来检索值。\n         */\n        hashtable.put(\"A\", \"Apple\"\
  );\n        hashtable.put(\"B\", \"Orange\");\n        hashtable.put(\"C\", \"Mango\"\
  );\n        hashtable.put(\"D\", \"Banana\");\n        hashtable.put(\"E\", \"Grapes\"\
  );\n        System.out.println(\"Hashtable contains:\");\n        /* public Set<K>\
  \ keySet(): 返回键的 Set 视图\n*/\n\n        Set<String> set = hashtable.keySet();\n \
  \       Iterator<String> i = set.iterator();\n        while (i.hasNext()) {\n  \
  \          str = i.next();\n            System.out.println(str + \": \" + hashtable.get(str));\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n```java\n/* ... \n * 包含在此 map 中。该集合由 map 支持，\n\
  \ * 因此对 map 的更改将反映在集合中，\n * 反之亦然。\n */\nSet<String> keys = hashtable.keySet();\n\
  \n// 获取遍历集合条目的迭代器\nIterator<String> itr = keys.iterator();\n\n// 显示键值值对\nwhile (itr.hasNext())\
  \ {\n    // 获取 键\n    str = itr.next();\n    /* public V get(Object key): 返回指定的键的映射值，\n\
  \     * 如果此 map 不包含该键的映射，则返回 null。\n     */\n    System.out.println(\"Key: \"+str+\"\
  \ & Value: \"+hashtable.get(str));\n}\n}\n}\n```\n\n输出:\n```\nHashtable contains:\n\
  Key: A & Value: Apple\nKey: E & Value: Grapes\nKey: D & Value: Banana\nKey: C &\
  \ Value: Mango\nKey: B & Value: Orange\n```\n\n## 在 Hashtable 中检查键与值的存在性示例\n\n###\
  \ 示例：\n在这个示例中，我们将看到如何检查 Hashtable 中键和值的存在性。我们将使用以下两个方法来执行此检查：\n- `containsKey(Object\
  \ key)`：检查 Hashtable 中是否存在该键。\n- `containsvalue(Object value)`：检查 Hashtable 中是否存在该值。\n\
  \n```java\nimport java.util.Hashtable;\n\npublic class CheckKeyValueExample {\n\
  \  public static void main(String[] args) {\n    // 创建一个 Hashtable 实例\n    Hashtable<String,\
