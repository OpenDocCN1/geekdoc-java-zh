  .substring(2)` 将返回 \"aitanya\"。如果 `beginIndex` 小于 0 或大于 `String` 的长度（`beginIndex<0||>\
  \ length of String`），该方法将抛出 `IndexOutOfBoundsException`。\n- `String substring(int\
  \ beginIndex, int endIndex)`：返回从索引 `beginIndex` 到指定索引 `endIndex` 的子字符串。例如，`\"Chandru\"\
  .substring(2,5)` 将返回 \"ait\"。如果 `beginIndex` 小于 0 或者 `beginIndex > endIndex` 或者\
  \ `endIndex` 大于 `String` 的长度，该方法将抛出 `IndexOutOfBoundsException`。\n\n#### 示例：substring()\n\
  ```java\npublic class SubStringExample {\n    public static void main(String args[])\
