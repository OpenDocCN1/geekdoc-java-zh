  Size of Vector after clear(): \"+vector.size());\n    }\n}\n```\n**输出：**\n```\n\
  Current size of Vector: 5\nSize of Vector after clear(): 0\n```\n\n### 替换 Vector\
  \ 中的元素\n`public E set(int index, E element)`：用指定的元素替换此 Vector 中指定位置的元素。返回被替换的元素。\n\
  \n#### 示例：\n在此示例中，我们用新值替换 Vector 的第 2 和第 3 个元素。\n\n```java\nimport java.util.Vector;\n\
  \npublic class ReplaceElements {\n    public static void main(String[] args) {\n\
  \        // 创建一个 String 元素的 Vector\n        Vector<String> vector = new Vector<String>();\n\
  \        // 向 Vector 添加元素\n        vector.add(\"Hari\");\n        vector.add(\"\
  Steve\");\n        vector.add(\"Vince\");\n        vector.add(\"David\");\n    \
  \    vector.add(\"Matt\");\n\n        System.out.println(\"Vector elements before\
  \ replacement: \");\n        for(int i=0; i < vector.size(); i++) {\n          \
  \  System.out.println(vector.get(i));\n        }\n\n        // 替换索引 1 的元素\n    \
