  \ String.format(\"My String is: %1$s, %1$s and %2$s\", str1, str2);\n        System.out.println(fstr);\n\
  \    }\n}\n```\n**输出：**\n```\nMy String is: cool string, cool string and 88\n```\n\
  \n### 使用 string `format()` 对字符串进行左填充\n\n\n\n\n\n在本示例中，我们用 0 对数字进行左侧填充，并将数字转换为格式化后的\
  \ `String`。在上一个示例中，我们格式化了浮点数和字符串，而在本示例中，我们正在格式化一个整数。需要记住的重要点是，这些格式标记是不同的。\n\n- `%s`\
  \ – 用于字符串\n- `%f` – 用于浮点数\n- `%d` – 用于整数\n\n```java\npublic class Example{ \n  \
