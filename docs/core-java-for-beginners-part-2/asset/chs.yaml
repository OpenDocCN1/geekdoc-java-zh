  Main thread will be alive till the child thread is live\nPrinting the count 0\n\
  Printing the count 1\nMain thread will be alive till the child thread is live\n\
  Printing the count 2\nMain thread will be alive till the child thread is live\n\
  Printing the count 3\nMain thread will be alive till the child thread is live\n\
  Printing the count 4\nMain thread will be alive till the child thread is live\n\
