  \ limit)`：它分割字符串并返回匹配给定正则表达式的子字符串数组。`limit` 在这里是结果阈值。\n\n### Java – String `split()`\
  \ 方法示例\n`split()` 方法用于根据给定的分隔符/正则表达式将 `String` 分割为子字符串。该方法有两个变体：\n\n1. `String[]\
  \ split(String regex)`：它根据分隔符正则表达式分割输入的 `String` 并返回一个字符串数组。\n2. `String[] split(String\
  \ regex, int limit)`：此变体与上述变体的唯一区别在于它限制了分割后返回的字符串数量。例如，`split(\"anydelimiter\",\
  \ 3)` 将只返回包含 3 个字符串的数组，即使分隔符在字符串中出现了超过 3 次。如果 `limit` 为负数，则返回的数组将包含尽可能多的子字符串；而当\
  \ `limit` 为 0 时，返回的数组将包含所有排除结尾空字符串子字符串。\n\n如果指定的正则表达式语法无效，则会抛出 `PatternSyntaxException`。\n\
  \n#### 示例：`split()` 方法\n```java\npublic class SplitExample{\n    public static void\
  \ main(String args[]){\n        String str = new String(\"28/12/2013\");\n     \
  \   System.out.println(\"split(String regex):\");\n        String array1[]= str.split(\"\
  /\");\n        for (String temp: array1){\n            System.out.println(temp);\n\
  \        }\n        System.out.println(\"split(String regex, int limit) with limit=2:\"\
  );\n        String array2[]= str.split(\"/\", 2);\n        for (String temp: array2){\n\
  \            System.out.println(temp);\n        }\n        System.out.println(\"\
  split(String regex, int limit) with limit=0:\");\n        String array3[]= str.split(\"\
  /\", 0);\n        for (String temp: array3){\n            System.out.println(temp);\n\
  \        }\n        System.out.println(\"split(String regex, int limit) with limit=-5:\"\
  );\n        String array4[]= str.split(\"/\", -5);\n        for (String temp: array4){\n\
  \            System.out.println(temp);\n        }\n    }\n}\n```\n**输出：**\n```\n\
  split(String regex):\n28\n12\n2013\nsplit(String regex, int limit) with limit=2:\n\
  28\n12/2013\nsplit(String regex, int limit) with limit=0:\n28\n12\n2013\nsplit(String\
  \ regex, int limit) with limit=-5:\n28\n12\n2013\n```\n\n## 29) `String split(String\
  \ regex)`：与 `split(String regex, limit)` 相比，没有阈值。\n\n## 30) `String toLowerCase(Locale\
  \ locale)`：使用给定的 locale 将字符串转换为小写。\n示例：从第\n\n## 31) `public static String format()`：此方法返回一个格式化的\
  \ Java 。\n\n### Java String `format()` 方法详解\n`Java String format()` 方法用于格式化字符串。你可以用此方法做很多事情，例如我们可以使用它连接字符串，同时可以格式化输出。在本教程中，我们将看到\
  \ `format()` 的几个示例。\n\n#### 语法：\n```java\npublic static String format(Locale l,\
  \ String format, Object... args)\n```\n使用指定的 locale、格式字符串和参数返回格式化字符串。\n\n```java\n\
  public static String format(String format, Object... args)\n```\n使用指定的格式字符串和参数返回格式化字符串。\n\
  \n#### Java String `format()` 简单示例\n```java\npublic class Example{ \n    public\
