  \ regex, String replacement)`：它将第一个符合正则表达式 `regex` 的子字符串替换为指定的替换字符串。\n示例：阅读第 19\
  \ 页\n\n## 27) `String replaceAll(String regex, String replacement)`：它将所有符合正则表达式\
