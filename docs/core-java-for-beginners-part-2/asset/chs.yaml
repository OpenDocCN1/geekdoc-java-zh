  \n## 1.4 LinkedList 教程\n\n## LinkedList 基础\n\n### 如何遍历 LinkedList\n\n### 如何在 Java\
  \ 中循环 LinkedList\n\n有四种方法可以遍历 `LinkedList`：\n\n- For 循环\n- 增强 For 循环\n- Iterator\
  \ 迭代器\n- While 循环\n\n**示例：**\n在这个示例中，我们有一个 String 类型的 `LinkedList`，我们正在使用上述四种方法对其进行循环。\n\
  \n```java\npackage javabook.com;\n\nimport java.util.*;\n\npublic class LinkedListExample\
  \ {\n public static void main(String args[]) {\n /*LinkedList declaration*/\n LinkedList<String>\
  \ linkedlist=new LinkedList<String>();\n      linkedlist.add(\"Apple\");\n     \
  \ linkedlist.add(\"Orange\");\n      linkedlist.add(\"Mango\");\n /*for loop*/\n\
  \ System.out.println(\"For loop\");\n for(int num=0; num<linkedlist.size(); num++)\
  \ {System.out.println(linkedlist.get(num))}\n System.out.println(\"Advanced For\
  \ loop\");\n for(String str : linkedlist) {System.out.println(str)}\n System.out.println(\"\
  Iterator\");\n Iterator<String> it = linkedlist.iterator(); while(it.hasNext())\
  \ {System.out.println(it.next())}\n System.out.println(\"While Loop\");\n int num=0;\
  \ while(num < linkedlist.size()) {System.out.println(linkedlist.get(num)); num++;\
  \ }\n }\n}\n```\n\n\n\n\n## 链表操作\n\n```java\n// 使用 String 类型值填充链表\nlinkedlist.add(\"\
  AA\");\nlinkedlist.add(\"BB\");\nlinkedlist.add(\"CC\");\nlinkedlist.add(\"DD\"\
  );\nlinkedlist.add(\"EE\");\n\n// 显示 LinkedList 元素\nSystem.out.println(linkedlist);\n\
  \n// 在开头添加元素\nlinkedlist.addFirst(\"FIRST\");\n\n// 显示添加后的列表\nSystem.out.println(linkedlist);\n\
  \n// 在列表末尾添加元素\nlinkedlist.addLast(\"LAST\");\n\n// 显示最终的列表\nSystem.out.println(linkedlist);\n\
  ```\n\n**输出：**\n```\n[AA, BB, CC, DD, EE]\n[FIRST, AA, BB, CC, DD, EE]\n[FIRST,\
  \ AA, BB, CC, DD, EE, LAST]\n```\n\n---\n\n## 向 LinkedList 前端添加元素\n\n### 描述\n向 `LinkedList`\
  \ 的前端（头节点）添加元素的程序。\n\n### 程序\n```java\nimport java.util.LinkedList;\n\nclass LinkedListExample\
  \ {\n    public static void main(String[] args) {\n        // 创建一个 LinkedList\n\
  \        LinkedList<String> list = new LinkedList<String>();\n\n        // 添加元素\n\
  \        list.add(\"AA\");\n        list.add(\"BB\");\n        list.add(\"CC\");\n\
  \        list.add(\"DD\");\n\n        // 显示 List 元素\n        System.out.println(\"\
  LinkedList Elements:\"+list);\n\n        // 向 LinkedList 前端添加元素\n        /* public\
  \ boolean offerFirst(E e): 将指定的\n           * 元素插入到此列表的前端。\n           */\n    \
  \    list.offerFirst(\"NEW Element\");\n\n        // 显示添加元素后的列表\n        System.out.println(\"\
  LinkedList After Addition:\"+list);\n    }\n}\n```\n\n**输出：**\n```\nLinkedList Elements:[AA,\
  \ BB, CC, DD]\nLinkedList After Addition:[NEW Element, AA, BB, CC, DD]\n```\n\n\
  ---\n\n## 从 LinkedList 中移除第一个和最后一个元素\n\n### 示例\n我们使用了 `removeFirst()` 方法移除第一个元素，并使用\
  \ `removeLast()` 方法从 LinkedList 中移除最后一个元素。方法定义和描述如下：\n1. `public E removeFirst()`:\
  \ 移除并返回列表中的第一个元素。\n2. `public E removeLast()`: 移除并返回列表中的最后一个元素。\n\n### 完整代码\n```java\n\
  import java.util.LinkedList;\n\npublic class RemoveExample {\n    public static\
  \ void main(String[] args) {\n        // 创建一个 LinkedList\n        LinkedList<String>\
  \ linkedlist = new LinkedList<String>();\n\n        // 向 LinkedList 添加元素\n     \
  \   linkedlist.add(\"Item1\");\n        linkedlist.add(\"Item2\");\n        linkedlist.add(\"\
  Item3\");\n        linkedlist.add(\"Item4\");\n        linkedlist.add(\"Item5\"\
  );\n\n        // 显示移除前的元素\n        System.out.println(\"LinkedList Elements are:\"\
  );\n        for(String str: linkedlist){\n            System.out.println(str);\n\
  \        }\n\n        // 移除第一个元素\n        Object firstElement = linkedlist.removeFirst();\n\
  \        System.out.println(\"\\nElement removed: \"+firstElement);\n\n        //\
  \ 移除最后一个元素\n        Object lastElement = linkedlist.removeLast();\n        System.out.println(\"\
  Element removed: \"+lastElement);\n\n        // 移除后的 LinkedList 元素\n        System.out.println(\"\
  \\nList Elements after Remove:\");\n        for(String str2: linkedlist){\n    \
  \        System.out.println(str2);\n        }\n    }\n}\n```\n\n**输出：**\n```\nLinkedList\
  \ Elements are:\nItem1\nItem2\nItem3\nItem4\nItem5\nElement removed: Item1\nElement\
  \ removed: Item5\nList Elements after Remove:\nItem2\nItem3\nItem4\n```\n\n---\n\
  \n## 从 LinkedList 指定索引处移除元素的示例\n\n### 示例\n我们将使用 `LinkedList` 类的 `remove(int index)`\
  \ 方法来移除指定索引处的元素。方法定义和描述如下：\n`public E remove(int index)`: 移除列表中指定位置的元素。将随后的任何元素向左移动（索引减一）。返回从列表中被移除的元素。\n\
  \n```java\nimport java.util.LinkedList;\n\npublic class RemoveFromLinkedList {\n\
  \    public static void main(String[] args) {\n        // 创建一个 LinkedList\n    \
  \    LinkedList<String> linkedlist = new LinkedList<String>();\n\n        // 向 LinkedList\
  \ 添加元素\n        linkedlist.add(\"Cobol\");\n        linkedlist.add(\"JCL\");\n \
  \       linkedlist.add(\"C++\");\n        linkedlist.add(\"C#\");\n        linkedlist.add(\"\
  Java\");\n\n        // 显示替换前的元素\n        System.out.println(\"LinkedList Elements:\"\
  );\n        for(String str: linkedlist){\n            System.out.println(str);\n\
  \        }\n\n        // 移除第 3 个元素\n        Object e1 = linkedlist.remove(2);\n\
  \        System.out.println(\"\\nElement \"+e1+\" removed from the list\\n\");\n\
  \n        // 移除后的 LinkedList 元素\n        System.out.println(\"After removal:\");\n\
  \        for(String str2: linkedlist){\n            System.out.println(str2);\n\
  \        }\n    }\n}\n```\n\n**输出：**\n```\nLinkedList Elements:\nCobol\nJCL\nC++\n\
  C#\nJava\n\nElement C++ removed from the list\n\nAfter removal:\nCobol\nJCL\nC#\n\
  ```\n\n---\n\n## 从 LinkedList 中移除特定元素\n\n### 示例\n我们将使用 `remove(Object o)` 方法。关于该方法的：\n\
  `public boolean remove(Object o)`: 如果列表中包含指定的元素，则移除第一个出现的元素并返回 true；如果不包含，则返回 false。\n\
  \n```java\nimport java.util.LinkedList;\n\nclass RemoveElement {\n    public static\
  \ void main(String[] args) {\n        // 创建一个 LinkedList\n        LinkedList<String>\
  \ linkedlist = new LinkedList<String>();\n\n        // 向 LinkedList 添加元素\n     \
  \   linkedlist.add(\"Item1\");\n        linkedlist.add(\"Item2\");\n        linkedlist.add(\"\
  Item3\");\n        linkedlist.add(\"Item4\");\n        linkedlist.add(\"Item5\"\
  );\n\n        // 显示移除前的元素\n        System.out.println(\"LinkedList Elements are:\"\
  );\n        for(String str: linkedlist){\n            System.out.println(str);\n\
  \        }\n\n        // 从列表中移除 \"Item4\"\n        linkedlist.remove(\"Item4\");\n\
  \n        // 移除后的 LinkedList 元素\n        System.out.println(\"\\nAfter Remove:\"\
  );\n        for(String str2: linkedlist){\n            System.out.println(str2);\n\
  \        }\n    }\n}\n```\n\n**输出：**\n```\nLinkedList Elements are:\nItem1\nItem2\n\
  Item3\nItem4\nItem5\n\nAfter Remove:\nItem1\nItem2\nItem3\nItem5\n```\n\n---\n\n\
  ## 从 LinkedList 中移除所有元素\n\n### 描述\n示例展示了如何使用 `clear()` 方法移除 `LinkedList` 中的所有元素。\n\
  \n### 示例\n示例中我们有一个包含 5 个元素的 String 类型 `LinkedList`。我们将调用 `clear()` 并显示 LinkedList\
  \ 的元素。\n\n```java\nimport java.util.LinkedList;\n\npublic class RemoveAllExample\
  \ {\n    public static void main(String[] args) {\n        // 创建一个 LinkedList\n\
  \        LinkedList<String> linkedlist = new LinkedList<String>();\n\n        //\
  \ 向 LinkedList 添加元素\n        linkedlist.add(\"Item1\");\n        linkedlist.add(\"\
  Item2\");\n        linkedlist.add(\"Item3\");\n        linkedlist.add(\"Item4\"\
  );\n        linkedlist.add(\"Item5\");\n\n        // 显示移除前的元素\n        System.out.println(\"\
  LinkedList Elements are: \");\n        for(String str: linkedlist){\n          \
  \  System.out.println(str);\n        }\n\n        // 移除所有元素\n        linkedlist.clear();\n\
  \n        // 显示移除后的元素\n        System.out.println(\"\\nAfter clear(): \");\n   \
  \     for(String str2: linkedlist){\n            System.out.println(str2);\n   \
  \     }\n    }\n}\n```\n\n**输出：**\n```\nLinkedList Elements are: \nItem1\nItem2\n\
  Item3\nItem4\nItem5\n\nAfter clear(): \n```\n\n---\n\n## 将 List 的元素追加到 LinkedList\n\
  \n### 描述\n使用 `LinkedList` 类的 `addAll()` 方法将 `List` 的所有元素添加到 `LinkedList` 中。\n\n\
  ### 示例\n```java\nimport java.util.ArrayList;\nimport java.util.LinkedList;\nimport\
  \ java.util.List;\n\nclass LinkedListAddAll {\n    public static void main(String[]\
  \ args) {\n        // 创建一个 LinkedList\n        LinkedList<String> list = new LinkedList<String>();\n\
  \n        // 向 LinkedList 添加元素\n        list.add(\"AA\");\n        list.add(\"BB\"\
  );\n        list.add(\"CC\");\n        list.add(\"DD\");\n\n        // 显示添加前的链表\n\
  \        System.out.println(\"Before: LinkedList: \" + list);\n\n        // 创建一个包含少量元素的列表\n\
  \        List<String> arrayList = new ArrayList<String>();\n        arrayList.add(\"\
  Item1\");\n        arrayList.add(\"Item2\");\n        arrayList.add(\"Item3\");\n\
  \n        // 将列表元素追加到 LinkedList\n        list.addAll(arrayList);\n    }\n}\n```\n\
  \n\n\n\n\n```java\nlist.addAll(arrayList);\n\n // Displaying the LinkedList after\
  \ addAll\n\n System.out.println(\"After: LinkedList: \" + list);\n\n}\n\n}\n```\n\
  \nOutput:\nBefore: LinkedList: [AA, BB, CC, DD]\nAfter: LinkedList: [AA, BB, CC,\
  \ DD, Item1, Item2, Item3]\n\n## 1.5 Java 中的 Vector\n\n`Vector` 实现了 `List` 接口。和\
  \ `ArrayList` 一样，它也维护插入顺序，但在非线程环境下很少使用，因为它是同步的，这导致它在元素的搜索、添加、删除和更新方面性能较差。\n\n创建\
  \ `vector` 类对象的三种方法：\n\n### 方法 1：\n\n```java\nVector vec = new Vector();\n```\n\
  它创建一个默认初始容量为 10 的空 `Vector`。这意味着当需要将第 11 个元素插入到 `Vector` 时，`Vector` 将重新调整大小。注意：默认情况下，`vector`\
  \ 的大小会翻倍。即：在这种情况下，`Vector` 的大小在插入 10 次之前将保持为 10，一旦我们尝试插入第 11 个元素，它将变为 20（默认容量 10\
  \ 的两倍）。\n\n### 方法 2：\n\n语法：\n```java\nVector object= new Vector(int initialCapacity)\n\
  ```\n```java\nVector vec = new Vector(3);\n```\n它将创建一个初始容量为 3 的 `Vector`。\n\n###\
  \ 方法 3：\n\n语法：\n```java\nVector object= new vector(int initialcapacity, capacityIncrement)\n\
  ```\n示例：\n```java\nVector vec= new Vector(4, 6)\n```\n在这里我们提供了两个参数。初始容量为 4，`capacityIncrement`\
  \ 为 6。这意味着在插入第 5 个元素时，大小将变为 10 (4+6)，在第 11 次插入时它将变为 16 (10+6)。\n\n### Java 中 Vector\
  \ 的完整示例：\n\n```java\nimport java.util.*;\n\npublic class VectorExample {\n\n public\
  \ static void main(String args[]) {\n /* 初始容量（大小）为 2 的 Vector */\n Vector<String>\
  \ vec = new Vector<String>(2);\n\n /* 向 vector 中添加元素*/\n      vec.addElement(\"\
  Apple\");\n      vec.addElement(\"Orange\");\n      vec.addElement(\"Mango\");\n\
  \      vec.addElement(\"Fig\");\n\n /* 大小和容量增量*/\n System.out.println(\"Size is:\
  \ \"+vec.size());\n System.out.println(\"Default capacity increment is: \"+vec.capacity());\n\
  \n      vec.addElement(\"fruit1\");\n      vec.addElement(\"fruit2\");\n      vec.addElement(\"\
  fruit3\");\n\n /* 插入两次后的大小和容量增量*/\n System.out.println(\"Size after addition: \"\
  +vec.size());\n System.out.println(\"Capacity after increment is: \"+vec.capacity());\n\
  \n/*显示 Vector 元素*/\n Enumeration en = vec.elements();\n System.out.println(\"\\\
  nElements are:\");\n while(en.hasMoreElements())\n System.out.print(en.nextElement()\
  \ + \" \");\n\n  }\n}\n```\n\nOutput:\nSize is: 4\nDefault capacity increment is:\
  \ 4\nSize after addition: 7\nCapacity after increment is: 8\nElements are:\nApple\
  \ Orange Mango Fig fruit1 fruit2 fruit3\n\n### Vector 类常用的常用方法：\n\n1) `void addElement(Object\
  \ element)`：在 `Vector` 的末尾插入元素。\n2) `int capacity()`：此方法返回 vector 的当前容量。\n3) `int\
  \ size()`：返回 vector 的当前大小。\n4) `void setSize(int size)`：用指定的大小更改现有大小。\n5) `boolean\
  \ contains(Object element)`：此方法检查指定的元素是否存在于 `Vector` 中。如果找到该元素，返回 true，否则返回 false。\n\
  6) `boolean containsAll(Collection c)`：如果集合 `c` 中的所有元素都在 `Vector` 中，则返回 true。\n\
  7) `Object elementAt(int index)`：返回 `Vector` 中指定位置的元素。\n8) `Object firstElement()`：用于获取\
  \ vector 的第一个元素。\n9) `Object lastElement()`：返回数组最后一个元素。\n10) `Object get(int index)`：返回指定索引处的元素。\n\
  11) `boolean isEmpty()`：如果 `Vector` 没有元素，则此方法返回 true。\n12) `boolean removeElement(Object\
  \ element)`：从 vector 中移除指定的元素。\n13) `boolean removeAll(Collection c)`：从 vector 中移除所有于集合\
  \ `c` 中的元素。\n14) `void setElementAt(Object element, int index)`：用给元素更新指定索引的元素。\n\
  \n## 1.6 Vector 教程\n\n## Vector 基础\n* 从 `Vector` 获取子列表\n* 使用 `Collections.sort()`\
  \ 排序 `Vector`\n* 使用索引在 `Vector` 中搜索元素\n* 将一个 `Vector` 的元素复制到另一个 `Vector`\n\n## 1.6.1\
  \ Java 中获取 Vector 子列表的示例\n\n在此示例中，我们将看到如何从 `Vector` 中获取元素的子列表。我们将使用 `Vector` 类的\
  \ `subList()` 方法来实现这一点。\n\n关于该方法的更多信息（来自 javadoc）：\n`public List subList(int fromIndex,\
  \ int toIndex)`：它返回此 `List` 中从 `fromIndex`（包含）到 `toIndex`（不包含）部分的视图。（如果 `fromIndex`\
  \ 和 `toIndex` 相等，则返回的 `List` 为空。）\n\n此方法返回此 `List` 中从 `fromIndex`（包含）到 `toIndex`（不包含）部分的视图。返回的\
  \ `List` 由此 `List` 支持，因此 `List` 中的更改将反映在 `Vector` 中。`subList(fromIndex, toIndex)`\
  \ 方法返回从 `fromIndex`（包含）到 `toIndex`（不包含）的元素范围。\n\n示例：\n```java\nimport java.util.Vector;\n\
  import java.util.List;\n\npublic class SublistExample {\n\n public static void main(String\
  \ args) {\n // 步骤 1:\n Vector<String> vec = new Vector<String>();\n\n // 步骤 2: 添加元素\n\
  \      vec.add(\"Item1\");\n      vec.add(\"Item2\");\n      vec.add(\"Item3\");\n\
  \      vec.add(\"Item4\");\n      vec.add(\"Item5\");\n\n /* subList(fromIndex,\
  \ toIndex) 返回此 List 中从 fromIndex（包含）到 toIndex（不包含）部分的视图 */\n List subList = vec.subList(2,\
  \ 5);\n\n System.out.println(\"Sub list :\");\n for(int i=0; i < subList.size();\
  \ i++){\n System.out.println(subList.get(i));\n  }\n  }\n}\n```\nOutput:\nSub list\
  \ :\nItem3\nItem4\n\n## 1.6.2 使用 Collections.sort 在 Java 中排序 Vector 示例\n\n`Vector`\
  \ 维护插入顺序，这意味着它按照添加顺序显示元素。在这个示例中，我们将看到如何使用 `Collections.sort()` 升序排序 `Vector`。步骤如下：\n\
  1) 创建 `Vector` 对象\n2) 使用 `add(Element)` 方法向 `Vector` 添加元素\n3) 使用 `Collections.sort(Vector\
  \ object)` 进行排序\n4) 显示排序后的列表\n\n```java\nimport java.util.Collections;\nimport java.util.Vector;\n\
  \npublic class SortingVectorExample {\n\n public static void main(String[] args)\
  \ {\n // 创建 Vector\n Vector<String> vector = new Vector<String>();\n\n // 向 Vector\
  \ 添加元素\n      vector.add(\"Walter\");\n      vector.add(\"Anna\");\n      vector.add(\"\
  Hank\");\n      vector.add(\"Flynn\");\n      vector.add(\"Tomy\");\n\n // 默认情况下\
  \ Vector 维护插入顺序\n System.out.println(\"Vector elements before sorting: \");\n for(int\
  \ i=0; i < vector.size(); i++){\n // get(i) 方法从索引 i 获取元素\n System.out.println(vector.get(i));\n\
  \  }\n\n // 使用 Collection.sort() 对集合升序排序\n Collections.sort(vector);\n\n // 使用 Collection.sort\
  \ 显示排序后的 Vector \n System.out.println(\"Vector elements after sorting: :\");\n for(int\
  \ i=0; i < vector.size(); i++){\n System.out.println(vector.get(i));\n  }\n  }\n\
  }\n```\nOutput:\nVector elements before sorting:\nWalter\nAnna\nHank\nFlynn\nTomy\n\
  Vector elements after sorting: :\nAnna\nFlynn\nHank\nTomy\nWalter\n\n## 1.6.3 使用索引在\
  \ Vector 中搜索元素 – Java 示例\n\n1) `public int indexOf(Object o)`：返回 `Vector` 中 `Object`\
  \ 首次出现的索引。\n2) `public int indexOf(Object o, int startIndex)`：返回此 vector 中对象 `o`\
  \ 首次出现的索引，从 `startIndex`（包含）开始向前搜索。\n3) `public int lastIndexOf(Object o)`：返回 `Vector`\
  \ 中 `Object o` 最后一次出现的索引。\n\n\n\n\n\n### 4) `public int lastIndexOf(Object o, int\
  \ startIndex)`\n它返回指定元素在当前向量中最后一次出现的索引，从 `startIndex`（包含）开始向前搜索。\n\n#### 示例：\n在此示例中，我们使用了上述提到的所有四个方法来演示它们的工作原理。\n\
  \n```java\nimport java.util.Vector;\n\npublic class SearchVector {\n    public static\
  \ void main(String[] args) {\n        // 创建一个 Vector 对象\n        Vector<String>\
  \ vector = new Vector<String>();\n        // 向 Vector 添加元素\n        vector.add(\"\
  Kate\");\n        vector.add(\"Patt\");\n        vector.add(\"Kluge\");\n      \
  \  vector.add(\"Karon\");\n        vector.add(\"Patt\");\n        vector.add(\"\
  Monica\");\n        vector.add(\"Patt\");\n\n        // 这将返回第一次出现的索引\n        int\
  \ first_index = vector.indexOf(\"Patt\");\n        System.out.println(\"First Occurrence\
  \ of Patt at index: \"+first_index);\n\n        // 这将返回最后一次出现的索引\n        int last_index\
  \ = vector.lastIndexOf(\"Patt\");\n        System.out.println(\"Last Occurrence\
  \ of Patt at index: \"+last_index);\n\n        // 这将从索引 2（包含）开始搜索\n        int after_index\
  \ = vector.indexOf(\"Patt\", 2);\n        System.out.println(\"Occurrence after\
  \ index 2: \"+after_index);\n\n        // 这将从索引 6（包含）开始向后搜索\n        int before_index\
  \ = vector.lastIndexOf(\"Patt\", 6);\n        System.out.println(\"Occurrence before\
  \ index 6: \"+before_index);\n    }\n}\n```\n\n**输出：**\n```\nFirst Occurrence of\
  \ Patt at index: 1\nLast Occurrence of Patt at index: 6\nOccurrence after index\
  \ 2: 4\nOccurrence before index 6: 6\n```\n\n### 将一个 Vector 的所有元素复制到另一个 Vector 的示例\n\
  在此示例中，我们将看到如何将 Vector 的所有元素复制到另一个 Vector。此过程将用第一个向量的相应元素替换第二个向量的现有元素。例如，如果我们把向量\
  \ `v1` 复制到向量 `v2`，那么 `v2` 的第一个元素将被 `v1` 的第一个元素替换，依此类推。\n\n在下面的代码中，我们有两个向量 `va` &\
  \ `vb`，我们使用 `Collections.copy()` 方法将 `va` 的所有元素复制到 `vb`。\n\n#### 示例：\n```java\n\
  import java.util.Collections;\nimport java.util.Vector;\n\npublic class VectorCopyExample\
  \ {\n    public static void main(String args[]) {\n        // 第一个 String own Vector\n\
  \        Vector<String> va = new Vector<String>();\n        // 向第一个 Vector 添加元素\n\
  \        va.add(\"AB\");\n        va.add(\"BC\");\n        va.add(\"CD\");\n   \
  \     va.add(\"DE\");\n\n        // 第二个 Vector\n        Vector<String> vb = new\
  \ Vector<String>();\n        // 向第二个 Vector 添加元素\n        vb.add(\"1st\");\n   \
  \     vb.add(\"2nd\");\n        vb.add(\"3rd\");\n        vb.add(\"4th\");\n   \
  \     vb.add(\"5th\");\n        vb.add(\"6th\");\n\n        /*执行复制操作前显示第二个向量的元素*/\n\
  \        System.out.println(\"Vector vb before copy: \"+vb);\n\n        // 将 Vector\
  \ va 的所有元素复制到 Vector vb\n        Collections.copy(vb, va);\n\n        // 复制后显示元素\n\
  \        System.out.println(\"Vector vb after copy: \"+vb);\n    }\n}\n```\n\n**输出：**\n\
  ```\nVector vb before copy: [1st, 2nd, 3rd, 4th, 5th, 6th]\nVector vb after copy:\
  \ [AB, BC, CD, DE, 5th, 6th]\n```\n\n# 1.7 /排序/替换\n\n*   从 Vector 移除元素\n*   从 Vector\
  \ 指定索引移除元素\n*   从 Vector 移除所有元素\n*   替换 Vector 中的元素\n*   设置 Vector 大小\n\n###  Vector\
  \ 元素 – Java 示例\n`public boolean remove(Object o)`：从 Vector 中移除指定元素的第一次出现。如果 Vector\
  \ 不包含该元素，则保持不变。\n\n#### 示例：\n在此示例中，我们从 String 的 Vector 中移除两个 String 值。步骤如下：\n1)\
  \ 创建一个 Vector\n2) 使用 Vector 类的 `add(Element e)` 方法向 Vector 添加元素。\n3) 使用 Vector 的\
  \ `remove(Object o)` 方法移除元素。\n\n```java\nimport java.util.Vector;\n\npublic class\
  \ RemoveFromVector {\n    public static void main(String[] args) {\n        // 创建一个\
  \ String 元素的 Vector\n        Vector<String> vector = new Vector<String>();\n   \
  \     // 向 Vector 添加元素\n        vector.add(\"Hari\");\n        vector.add(\"Steve\"\
  );\n        vector.add(\"Vince\");\n        vector.add(\"David\");\n        vector.add(\"\
  Matt\");\n\n        System.out.println(\"Vector elements before remove(): \");\n\
  \        for(int i=0; i < vector.size(); i++) {\n            System.out.println(vector.get(i));\n\
  \        }\n\n        // 移除 Hari\n        vector.remove(\"Hari\");\n        // 移除\
  \ Matt\n        vector.remove(\"Matt\");\n\n        System.out.println(\"\\nVector\
  \ elements after remove():\");\n        for(int i=0; i < vector.size(); i++) {\n\
  \            System.out.println(vector.get(i));\n        }\n    }\n}\n```\n**输出：**\n\
  ```\nVector elements before remove(): \nHari\nSteve\nVince\nDavid\nMatt\n\nVector\
  \ elements after remove():\nSteve\nVince\n```\n\n### 使用索引移除 Vector 元素\n`public boolean\
  \ remove(Object o)`：从 Vector 中移除第一个元素的元素。如果 Vector 不包含该元素，则保持不变。返回 true 如果删除了元素，否则返回\
  \ false。\n\n#### 示例：\n在此示例中，我们从 String 的 Vector 中移除两个 String 值。步骤如下：\n1) 创建一个 Vector\n\
  2) 使用 Vector 类的 `add(Element e)` 方法向 Vector 添加元素。\n3) 使用 Vector 的 `remove(Object\
  \ o)` 方法移除元素。\n\n```java\nimport java.util.Vector;\n\npublic class RemoveFromVector\
  \ {\n    public static void main(String[] args) {\n        // 创建一个 String 元素的 Vector\n\
  \        Vector<String> vector = new Vector<String>();\n        // 向 Vector 添加元素\n\
  \        vector.add(\"Hari\");\n        vector.add(\"Steve\");\n        vector.add(\"\
  Vince\");\n        vector..(\"David\n\n        ...MattMatt\");\n\n        System...(\"\
