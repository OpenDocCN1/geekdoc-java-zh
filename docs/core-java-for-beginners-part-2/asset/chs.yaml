  \ 已删除！\n\n# 5.6 将文件压缩为 GZIP 格式\n\n以下代码将一个指定的文件压缩为 GZip 格式。在下面的示例中，我们在 `B` 盘的“Java”文件夹下有一个文本文件，我们将在同一个文件夹中压缩并生成\
  \ `GZip` 文件。\n\n```java\nimport java.io.FileInputStream;\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\nimport java.util.zip.GZIPOutputStream;\n\npublic class\
  \ GZipExample {\n    public static void main(String[] args) {\n        GZipExample\
  \ zipObj = new GZipExample();\n        zipObj.gzipMyFile();\n    }\n\n    public\
  \ void gzipMyFile() {\n        byte[] buffer = new byte[1024];\n        try {\n\
  \            // 在此处指定输出 GZip 文件的名称和路径\n            GZIPOutputStream gos = new GZIPOutputStream(new\
  \ FileOutputStream(\"B://Java/Myfile.gz\"));\n            // 在此处指定输入文件的位置\n    \
  \        FileInputStream fis = new FileInputStream(\"B://Java/Myfile.txt\");\n \
  \           // 从输入文件读取并写入输出 GZip 文件\n            int length;\n            while\
  \ ((length = fis.read(buffer)) > 0) {\n                /* public void write(byte[]\
  \ buf, int off, int len):\n                 * 将字节数组写入压缩输出流。\n                 *\
  \ 此方法将阻塞，直到所有字节都被写入。\n                 * 参数:\n                 * buf - 要写入的数据\n\
  \                 * off - 数据的起始偏移量\n                 * len - 数据的长度\n           \
  \      */\n                gos.write(buffer, 0, length);\n            }\n      \
  \      fis.close();\n            /* public void finish(): 完成向输出流\n             *\
  \ 写入压缩数据的写入，但不关闭底层的\n             * 流。\n             */\n            gos.finish();\n\
  \            gos.close();\n            System.out.println(\"File Compressed!!\"\
  );\n        } catch(IOException ioe) {\n            ioe.printStackTrace();\n   \
  \     }\n    }\n}\n```\n\nOutput:\nFile Compressed!!\n\n# 5.7 将文件复制到另一个文件\n\n为了复制文件，我们首先可以使用\
  \ `FileInputStream` 读取文件，然后可以使用 `FileOutputStream` 将读取的内容写入输出文件。\n\n### 示例\n以下代码将将“MyInputFile.txt”的内容复制到“MyOutputFile.txt”文件中。如果“MyOutputFile.txt”不存在，则程序将先创建文件，然后复制内容。\n\
  \n```java\nimport java.io.File;\nimport java.io.FileInputStream;\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\n\npublic class CopyExample {\n    public static void\
  \ main(String[] args) {\n        FileInputStream instream = null;\n        FileOutputStream\
  \ outstream = null;\n        try {\n            File infile = new File(\"C:\\\\\
  MyInputFile.txt\");\n            File outfile = new File(\"C:\\\\MyOutputFile.txt\"\
  );\n            instream = new FileInputStream(infile);\n            outstream =\
  \ new FileOutputStream(outfile);\n            byte[] buffer = new byte[1024];\n\
  \            int length;\n            /* 使用 read 和 write 方法从输入流\n             *\
  \ 向输出流复制内容\n             */\n            while ((length = instream.read(buffer))\
  \ > 0) {\n                outstream.write(buffer, 0, length);\n            }\n \
  \           // 关闭输入/输出文件流\n            instream.close();\n            outstream.close();\n\
  \            System.out.println(\"File copied successfully!!\");\n        } catch(IOException\
  \ ioe) {\n            ioe.printStackTrace();\n        }\n    }\n}\n```\n\nOutput:\n\
  File copied successfully!!\n\n上述程序使用的方法有：\n\n`read()` 方法\n```java\npublic int read(byte[]\
  \ b) throws IOException\n```\n从此输入流中读取最多 `b.length` 个字节的数据到字节数组中。此方法会阻塞，直到有可用输入。它返回读取到缓冲区的总字节数，或者如果到达文件末尾没有更多数据，则返回\
  \ -1。为了让此方法在我们的程序中工作，我们创建了它。\n\n`write()` 方法\n```java\npublic void write(byte[]\
  \ b, int off, int len) throws IOException\n```\n将字节数组写入压缩输出流。\n\n# 5.8 获取最后修改时间\n\
