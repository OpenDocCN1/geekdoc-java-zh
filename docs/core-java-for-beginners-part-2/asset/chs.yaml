  5\n输入搜索值：\n99\n99 在数组中不存在。\n\n# 6.13 Java 二分搜索程序\n\n二分搜索的 Java 程序 – 示例\n\n二分搜索的示例\n\
  \n此程序使用二分搜索算法在列表中查找元素。\n\n```java\n/* 程序：二分搜索示例\n* 编写者：feroz 来自 javabook.com\n*\
  \ 输入：元素个数、元素值、要搜索的值\n* 输出：用户输入的数字在列表中的位置*/\nimport java.util.Scanner;\n\nclass BinarySearchExample\
  \ {\n  public static void main(String args[]) {\n    int counter, num, item, array[];\n\
  \    // 获取用户输入\n    Scanner input = new Scanner(System.in);\n    System.out.println(\"\
  输入元素个数：\");\n    num = input.nextInt();\n    // 创建数组来存储所有数字\n    array = new int[num];\n\
  \    System.out.println(\"输入 \" + num + \" 个整数\");\n    // 循环将每个数字存储在数组中\n    for\
  \ (counter = 0; counter < num; counter++)\n      array[counter] = input.nextInt();\n\
  \    System.out.println(\"输入搜索值：\");\n    item = input.nextInt();\n    int low =\
  \ 0;\n    int high = num - 1;\n    while (low <= high) {\n      int mid = (low +\
  \ high) / 2;\n      if (array[mid] == item) {\n        System.out.println(item +\
  \ \"位于位置 \" + (mid + 1));\n        break;\n      } else if (array[mid] < item) {\n\
  \        low = mid + 1;\n      } else {\n        high = mid - 1;\n      }\n    }\n\
  \    if (low > high)\n      System.out.println(item + \" 在列表中不存在。\");\n  }\n}\n\
  ```\n\n**输出 1：**\n输入元素个数：\n7\n输入 7 个整数\n12\n23\n34\n45\n56\n67\n78\n输入搜索值：\n67\n\
  67 位于位置 6\n\n**输出 2：**\n输入元素个数：\n5\n输入 5 个整数\n11\n22\n33\n44\n55\n输入搜索值：\n99\n99\
