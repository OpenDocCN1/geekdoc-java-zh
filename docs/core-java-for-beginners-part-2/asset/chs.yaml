  \n\n2) `wait()` 通知调用线程释放监视器（monitor）并进入睡眠，直到其他线程进入同一个监视器并调用 `notify()`。\n\n3) `notify()`\
  \ 唤醒在同一对象上调用 `wait()` 的第一个线程。\n\n`notifyAll()` 唤醒所有在同一对象上调用 `wait()` 的线程。优先级线程将首先运行。\n\
  \n## 3.5 Java 序列化\n\n## 什么是 Java 序列化？\n\n序列化是一种将对象转换为字节流的机制，以便将其写入文件、通过网络传输或存储到数据库中。反序列化则是相反的操作。简单来说，序列化是将对象转换为字节流，而反序列化是从字节流中重建对象。Java\
  \ 序列化 API 提供了序列化和反序列化的功能。类必须实现 `java.io.Serializable` 接口才能被序列化。\n\n让我们通过一个例子来更好地理解这些概念：\n\
  \n### 示例：\n\n该类实现了 `Serializable` 接口，这意味着它可以被序列化。该类的所有字段在转换为字节流后都可以写入文件，但声明为 `transient`\
  \ 的字段除外。在下面的示例中，我们有两个 `transient` 字段，这些字段将不参与序列化。\n\nStudent.java\n\n```java\npublic\
  \ class Student implements java.io.Serializable {\n\n    private int stuRollNum;\n\
  \    private int stuAge;\n    private String stuName;\n    private transient String\
  \ stuAddress;\n    private transient int stuHeight;\n\n    public Student(int roll,\
  \ int age, String name, String address, int height) {\n        this.stuRollNum =\
  \ roll;\n        this.stuAge = age;\n        this.stuName = name;\n        this.stuAddress\
  \ = address;\n        this.stuHeight = height;\n    }\n\n    public int getStuRollNum()\
  \ {\n        return stuRollNum;\n    }\n\n    public void setStuRollNum(int stuRollNum)\
  \ {\n        this.stuRollNum = stuRollNum;\n    }\n\n    public int getStuAge()\
  \ {\n        return stuAge;\n    }\n\n    public void setStuAge(int stuAge) {\n\
  \        this.stuAge = stuAge;\n    }\n\n    public String getStuName() {\n    \
  \    return stuName;\n    }\n\n    public void setStuName(String stuName) {\n  \
  \      this.stuName = stuName;\n    }\n\n    public String getStuAddress() {\n \
  \       return stuAddress;\n    }\n\n    public void setStuAddress(String stuAddress)\
  \ {\n        this.stuAddress = stuAddress;\n    }\n\n    public int getStuHeight()\
  \ {\n        return stuHeight;\n    }\n\n    public void setStuHeight(int stuHeight)\
  \ {\n        this.stuHeight = stuHeight;\n    }\n}\n```\n\n### 3.5.1 对象的序列化\n\n\
  该类将 `Student` 类的对象写入 `Student.ser` 文件。我们使用 `FileOutputStream` 和 `ObjectOutputStream`\
  \ 将对象写入文件。\n\n注意：根据 Java 序列化的最佳实践，文件名应该带有 `.ser` 扩展名。\n\n```java\nimport java.io.FileOutputStream;\n\
  import java.io.ObjectOutputStream;\nimport java.io.IOException;\n\npublic class\
  \ SendClass {\n\n    public static void main(String args[]) {\n        Student obj\
  \ = new Student(101, 25, \"Chaitanya\", \"Agra\", 6);\n        try {\n         \
  \   FileOutputStream fos = new FileOutputStream(\"Student.ser\");\n            ObjectOutputStream\
  \ oos = new ObjectOutputStream(fos);\n            oos.writeObject(obj);\n      \
  \      oos.close();\n            fos.close();\n            System.out.println(\"\
  Serialzation Done!!\");\n        } catch (IOException ioe) {\n            System.out.println(ioe);\n\
  \        }\n    }\n}\n```\n\n输出：\nSerialzation Done!!\n\n## 3.5.2 对象的反序列化\n\n该类将在从文件中读取字节流后重建\
  \ `Student` 类的对象。观察该类的输出，学生地址（student address）和学生身高（student height）字段连续显示为 null\
  \ 和 0 值。这是因为这些字段在 `Student` 类中被声明为 `transient`。\n\n```java\nimport java.io.FileInputStream;\n\
  import java.io.ObjectInputStream;\nimport java.io.IOException;\n\npublic class AcceptClass\
  \ {\n\n    public static void main(String args[]) {\n        Student o = null;\n\
  \        try {\n            FileInputStream fis = new FileInputStream(\"Student.ser\"\
  );\n            ObjectInputStream ois = new ObjectInputStream(fis);\n          \
  \  o = (Student) ois.readObject();\n            ois.close();\n            fis.close();\n\
  \        } catch (IOException ioe) {\n            ioe.printStackTrace();\n     \
  \       return;\n        } catch (ClassNotFoundException cnfe) {\n            System.out.println(\"\
  Student Class is not found.\");\n            cnfe.printStackTrace();\n         \
  \   return;\n        }\n        System.out.println(\"Student Name:\" + o.getStuName());\n\
  \        System.out.println(\"Student Age:\" + o.getStuAge());\n        System.out.println(\"\
  Student Roll No:\" + o.getStuRollNum());\n    }\n}\n```\n\n输出：\nStudent Name:Chaitanya\n\
  Student Age:25\nStudent Roll No:101\nAddress:null\nHeight:0\n\n# 3.6 Java AWT 教程\n\
  \nAWT 代表 Abstract Window Toolkit（抽象窗口工具包）。它是用于创建图形界面（GUI）的平台相关工具。\n\n## 为什么依赖 AWT？\n\
  \nAWT 调用了按钮（button）、复选框（checkbox）等原生组件。例如，一个 AWT 按钮在不同平台上的看起来可能不同。\n\nAWT 现在很少被使用，因为它具有平台相关性和重量级的特性。AWT\
  \ 组件被认为是重量级的，因为它们是由底层操作系统（OS）生成的。例如，如果你在 AWT 中实例化文本框，意味着你实际上是在请求操作系统来创建。\n\nSwing\
  \ 是窗口应用程序的首选 API，因为它具有平台无关性和轻量级特性。Swing 构建在 AWT 之上，但它提供了与平台无关的外。除了熟悉的按钮、复选框外，Swing\
  \ 还提供了更高级的组件，如标签页、滚动面板、树等。我们将在另一个教程中详细讨论 Swing。\n\n### AWT 层次结构\n\n![AWT hierarchy](img/image0920.jpeg)\n\
  \n## 组件与容器\n\n所有如按钮、文本字段、滚动条等元素被称为组件。在 AWT 中，每个组件都有对应的类，如上图所示。为了将它们放在屏幕上的特定位置，必须将它们添加到容器中。简单来说，容器包含并控制组件的布局。容器本身也是组件（如上方层次结构所示），因此我们可以在容器内部添加容器。\n\
  \n### 容器的类型：\n\n如上所述，容器是用来添加文本字段、按钮、复选框等组件的地方。AWT 中提供了四种容器：Window（窗口）、Frame（帧）、Dialog（对话框）和\
  \ Panel（面板）。如上方层次结构所示，Frame 和 Dialog 是 Window 类的子类。\n\n- **Window**: Window 类实例没有边框也没有标题。\n\
  - **Dialog**: Dialog 类有边框和标题。Dialog 类实例在没有关联 Frame 类实例的情况下不存在。\n- **Panel**: Panel\
  \ 不包含标题栏、菜单栏或边框。它是存放组件的通用容器。Panel 类实例提供了一个可以添加组件的容器。\n- **Frame**: Frame 有标题、边框和菜单栏。它可以包含多个组件，如按钮、文本字段、滚动条等。这是开发\
  \ AWT 应用时最广泛使用的容器。\n\n## Java AWT 示例\n\n我们可以通过两种方式使用 `Frame` 创建 GUI：\n\n1) 扩展 `Frame`\
  \ 类\n2) 创建 `Frame` 类实例\n\n\n\n\n让我们来看看每一个示例的示例。\n\n## AWT 示例 1：通过扩展 Frame 类创建 Frame\n\
  \n```java\nimport java.awt.*;\n\n/* 我们在在这里扩展了 Frame 类，\n * 因此我们的类 \"SimpleExample\"\
  \ 将表现得\n * 像一个 Frame\n */\npublic class SimpleExample extends Frame{\n    SimpleExample(){\
  \ \n        Button b=new Button(\"Button!!\");\n        // 在屏幕上设置按钮位置\n        b.setBounds(50,50,50,50);\
  \  \n        //将按钮添加到 frame\n        add(b);\n        // 设置 Frame 的宽度和高度\n     \
  \   setSize(500,300);\n        // 设置 Frame 的标题\n        setTitle(\"This is my First\
  \ AWT example\");\n        // 设置 Frame 的布局\n        setLayout(new FlowLayout());\n\
  \        /* 默认情况下 frame 是不可见的，\n         * 所以我们将可见性设置为 true\n         * 以使其变得可见\n\
  \         */\n        setVisible(true);  \n    }  \n    public static void main(String\
  \ args[]){\n        // 创建 Frame 的实例\n        SimpleExample fr=new SimpleExample();\
  \  \n    }\n}\n```\n\n输出：\n\n![AWT example 1](img/image0092.jpeg)\n\n## AWT 示例 2：通过创建\
  \ Frame 类实例创建 Frame\n\n```java\nimport java.awt.*;\n\npublic class Example2 {\n\
  \    Example2() {\n        // 创建 Frame     \n        Frame fr=new Frame();     \
  \ \n        // 创建一个标签\n        Label lb = new Label(\"UserId: \");\n        //将标签添加到\
  \ frame\n        fr.add(lb);           \n        // 创建文本字段\n        TextField t\
  \ = new TextField();\n        //将文本字段添加到 frame\n        fr.add(t);\n        //设置\
  \ frame 大\n        fr.setSize(500, 300);  \n        // 设置 Frame 的布局\n        fr.setLayout(new\
  \ FlowLayout());\n        fr.setVisible(true);             \n    }\n    public static\
  \ void main(String args[]) {\n        Example2 ex = new Example2();\n    }\n}\n\
  ```\n\n输出：\n\n![AWT example 2](img/image00923.jpeg)\n\n# 3.7 Java Swing 教程\n\nSwing\
  \ 是 Java Foundation classes (JFC) 的一部分，JFC 的其他部分是 `java2D` 和抽象窗口工具包 (AWT)。AWT、Swing\
  \ 和 Java 2D 用于在 java 中构建图形用户界面 (GUI)。在本教程中，我们将主要讨论 `Swing` API，它用于在 `AWT` 之上构建 GUI，并且与\
  \ `AWT` 相比要轻量得多。\n\n### 示例\n\n在下面的示例中，我们将使用一些你目前为止在教程中还没有学过的 swing 组件。我们将在接下来的 swing\
  \ 教程中详细讨论每一个细节。\n\n下面的 swing 程序将创建一个登录界面。\n\n```java\nimport javax.swing.JButton;\n\
  import javax.swing.JFrame;\nimport javax.swing.JLabel;\nimport javax.swing.JPanel;\n\
  import javax.swing.JPasswordField;\nimport javax.swing.JTextField;\npublic class\
  \ SwingFirstExample {\n    public static void main(String[] args) {     \n     \
  \   // 创建 JFrame 的实例\n        JFrame frame = new JFrame(\"My First Swing Example\"\
  );\n        // 设置 frame 的宽度和高度\n        frame.setSize(350, 200);\n        frame.setDefaultCloseOperation(JFrame.EXIT_CLOSE);\n\
  \        /* 创建面板。这等于 HTML 中的 div 标签\n         * 我们可以创建多个面板并将它们添加到 JFrame\n     \
  \    * 的特定位置。在面板内部，我们可以添加\n         * 字段、按钮和其他组件。\n         */\n        JPanel panel\
  \ = new JPanel();  \n        //将面板添加到 frame\n        frame.add(panel);\n       \
  \ /* 调用用户定义方法向面板\n         * 添加组件。\n         */\n        placeComponents(panel);\n\
  \        // 设置 frame 的可见性为\n        frame.setVisible(true);\n    }\n    private\
  \ static void placeComponents(JPanel panel) {\n        /* 我们将在教程的后续\n         *\
  \ 部分讨论布局。现在我们将布局\n         * 设置 null\n         */\n        panel.setLayout(null);\n\
  \        // 创建 JLabel\n        JLabel userLabel = new JLabel(\"User\");\n      \
  \  /* 此方法指定了组件的位置和大小\n         * 使用 setBounds(x, y, width, height)\n         * 这里\
  \ (x,y) 是左上角的坐标\n         * 另外两个参数是组件的宽度\n         * 和高度\n         */\n        userLabel.setBounds(10,20,80,25);\n\
  \        panel.add(userLabel);\n        /* 创建文本字段，用户应该\n         * 输入用户名。\n    \
  \     */\n        JTextField userText = new JTextField(20);\n        userText.setBounds(100,20,165,25);\n\
  \        panel.add(userText);\n        // 密码标签和文本字段具有相同的过程。\n        JLabel passwordLabel\
  \ = new JLabel(\"Password\");\n        passwordLabel.setBounds(10,50,80,25);\n \
  \       panel.add(passwordLabel);\n        /* 这与文本字段类似，但它隐藏了用户\n         * 输入的数据并显示点以保护\n\
  \         * 密码，就像我们通常在登录界面上看到的那样。\n         */\n        JPasswordField passwordText\
  \ = new JPasswordField(20);\n        passwordText.setBounds(100,50,165,25);\n  \
  \      panel.add(passwordText);\n        // 创建按钮\n        JButton loginButton =\
  \ new JButton(\"Login\");\n        panel.add(loginButton);\n    }\n}\n```\n\n输出：\n\
  \n![Swing Example](img/image00924.jpeg)\n\n在上面的示例中，我们使用了几个组件。让我们先简单了解它们，然后我们将在后续部分详细讨论。\n\
  \n- `JFrame`：frame 是 `JFrame` 的实例。Frame 可以有标题、边框、菜单、按钮和其他组件。Swing 应用需要一个 frame 来添加组件。\n\
  - `JPanel`：panel 是 `JPanel` 的实例。Frame 可以有多个面板，每个面板可以有很多组件。\n- `JLabel`：label 是 `JLabel`\
  \ 的实例。Label 是文本和图像。如果你想在 frame 上显示字符串或图像，可以使用标签。\n- `JTextField`：用于捕捉用户输入，这些是用户数据的框。\n\
  - `JPasswordField`：类似于文本字段，但输入的数据会被隐藏并在 GUI 上显示点。\n- `JButton`：按钮是 `JButton` 类的实例。上面的示例有一个“Login”。\n\
  \n## 3.8 Java 自动装箱与拆箱\n\n### 带示例的 Java 自动装箱与拆箱\n\nJava 1.5 引入了基本类型与包装类之间自动转换的特殊功能。\n\
  \n**自动装箱 (Autoboxing)**：基本类型到其包装类对象的自动转换被称为自动装箱。例如——`int` 到 `Integer`、`long` 到 `Long`、`double`\
  \ 到 `Double`。\n\n**拆箱 (Unboxing)**：它只是自动装箱的反过程。将包装类的对象自动转换为其对应的基本类型被称为拆箱。例如——`Integer`\
  \ 到 `int`、`Long` 到 `long`、`Double` 到 `double`。\n\n| 基本类型 | 包装类 |\n| :--- | :---\
  \ |\n| boolean | Boolean |\n| byte | Byte |\n| char | Character |\n| float | Float\
  \ |\n| int | Integer |\n| long | Long |\n| short | Short |\n| double | Double |\n\
  \n### Java 中何时会发生自动装箱和拆箱\n\n#### 自动装箱：\n\n让我们通过几个示例案例来看看发生自动装箱的情况。\n\n**情况 1：**\n\
  \n当方法期望一个包装类对象，但作为参数传递的值是基本类型时。例如在下面的代码中，方法 `myMethod()` 期望 `Integer` 包装类对象，然而我们传递了一个基本类型\
  \ `int`。程序运行正常，因为编译器执行了自动装箱（`int` 到 `Integer` 的转换）。\n\n```java\nclass AutoboxingExample1\n\
  {\n    public static void myMethod(Integer num){\n        System.out.println(num);\n\
  \    }\n}\n```\n\n\n\n\n```java\npublic static void main(String[] args) {\n    /*\
  \ 传递了 int（基本类型），它会在运行时\n     * 转换为 Integer 对象\n     */\n    myMethod(2);\n}\n```\n\
  Output:\n`2`\n\n### 情况 2\n在某个时间点，你正将一个基本类型的值赋值给其包装类的对象。例如：以下语句是有效的，因为编译器在运行时执行自动装箱（autoboxing）。\n\
  \n```java\nInteger inum = 3; // 将 int 赋值给 Integer：自动装箱\nLong lnum = 32L; // 将 long\
  \ 赋值给 Long：自动装箱\n```\n\n### 情况 3\n处理集合框架类时：\n\n```java\nArrayList<Integer> arrayList\
  \ = new ArrayList<Integer>();\narrayList.add(11); // 自动装箱 - int 基本类型转换为 Integer\n\
  arrayList.add(22); // 自动装箱\n```\n这里 `ArrayList` 类期望一个 `Integer` 包装类对象，但我们提供了 `int`\
  \ 基本类型。\n\n## 解箱 (Unboxing)\n\n### 情况 1\n方法期望一个 `Integer` 对象（参数），但我们提供了 `int`。发生了自动转换（解箱），将\
  \ `Integer` 转换为了 `int`。\n\n```java\nclass UnboxingExample1 {\n    public static\
  \ void myMethod(int num) {\n        System.out.println(num);\n    }\n\n    public\
  \ static void main(String[] args) {\n        Integer inum = new Integer(100);\n\
  \        /* 传递了 Integer 包装类对象，它\n         * 在运行时会被转换为 int 基本类型\n         */\n  \
  \      myMethod(inum);\n    }\n}\n```\nOutput:\n`100`\n\n### 情况 2：赋值\n```java\n\
  Integer inum = new Integer(5);\nint num = inum; // 从对象到基本类型的转换\n```\n\n### 情况 3\n\
  处理集合类时：\n```java\nArrayList arrayList = new ArrayList()\nint num = arrayList.get(0);\
  \ // 因为 get 方法返回 Integer 对象，所以发生了解箱\n```\n\n## 幕后发生了什么？\n在上面的章节中，我们学习了 Java 编译器如何在基本类型和对应的包装对象之间执行自动转换。让我们讨论一下编译器在自动装箱和解箱期间到底做了什么。理解此点的最好方法是比较\
  \ Java 1.5 之前和之后的情况（装箱和解箱是在 Java 1.5 中引入的）。\n\n### 自动装箱\n**我们看到的：**\n```java\n```java\n\
  Integer number = 100;\n```\n**编译器做了什么（或者我们在 Java 1.5 之前所做的）：**\n```java\nInteger\
  \ number = Integer.valueOf(100);\n```\n\n### 解箱\n**我们看到的：**\n```java\nInteger num2\
  \ = new Integer(50);\nint inum = num2;\n```\n**编译器做了什么：**\n```java\nInteger num2\
  \ = new Integer(50);\nint inum = num2.intValue();\n```\n类似的情况也发生在其他包装类和基本类型上，如 `long`、`double`、`short`\
  \ 等。\n\n### 你应该的几点：\n在进行比较时，不要混合基本类型和对象。你可能会为此类比较得到不可预测的结果。更好的做法是：对象与对象之间进行比较（使用\
  \ `equals()` 方法），基本类型与基本类型之间进行比较（使用逻辑运算符 `==`、`<` 等）。\n\n## 3.9 Java 中的包装类\n八种基本数据类型\
  \ `byte`、`short`、`int`、`long`、`float`、`double`、`char` 和 `boolean` 不是对象，包装类用于将基本数据类型转换为对象，例如将\
  \ `int` 转换为 `Integer` 等。让我们来看一个简单的例子来理解为什么 Java 中需要包装类。\n\n例如：在 Java 中处理集合（部分部分），我们使用泛型来确保类型安全，例如\
  \ `ArrayList<Integer>` 而不是 `ArrayList<int>`。`Integer` 是 `int` 基本类型的包装类。在这种情况下，我们使用包装类是因为泛型需要对象而不是基本类型。还有其他几个原因使你倾向于使用包装类而不是基本类型，我们将在本文中也讨论它们。\n\
  \n| 基本类型 | 包装类 |\n| :--- | :--- |\n| BooleanCharByteShortIntFloatdouble | BooleanCharacterByteShortIntegerLongFloatDouble\
  \ |\n\n## 为什么在 Java 中需要包装类\n1. 如我上面提到的，我们需要包装类的一个原因是在集合 API 中使用它们。另一方面，与基本类型相比，包装对象占用的内存得多。因此，当你需要效率时，使用基本类型；当你需要对象而不是基本类型时，使用包装类。\n\
  \n基本数据类型不是对象，因此它们不属于任何类。在存储于仅支持对象的数据结构中，需要先将基本类型转换为对象，我们可以通过使用包装类来实现。\n\n**示例：**\n\
  ```java\nHashMap<Integer, String> hm = new HashMap<Integer, String>();\n```\n因此为了类型安全，我们使用包装类。这样我们就确保了这个\
  \ `HashMap` 的键将是整数类型，值将是字符串类型。\n\n2. 包装类对象允许空值，而基本数据类型不允许。\n\n**包装类示例 1：将基本类型转换为包装对象**\n\
  ```java\npublic class JavaExample{\n    public static void main(String args[]) {\n\
  \        // 将 int 基本类型转换为 Integer 对象\n        int num=100;\n        Integer obj=Integer.valueOf(num);\n\
  \        System.out.println(num+ \" \"+ obj);\n    }\n}\n```\nOutput:\n`100 100`\n\
  \n**包装类示例 2：包装对象转换为基本类型**\n```java\npublic class JavaExample{\n    public static\
  \ void main(String args[]){\n        // 创建包装对象\n        Integer obj = new Integer(100);\n\
  \        // 将包装对象转换为基本类型\n        int num = obj.intValue();\n        System.out.println(num);\n\
  \    }\n}\n```\nOutput:\n`100`\n\n## 4 Java 8 教程\n## 4.1 Lambda 表达式\n### Lambda\
  \ 表达式教程\nLambda 表达式是 Java 8 引入的新功能。Lambda 表达式是一个匿名函数。它没有名称且不属于任何类。\n\n#### Lambda\
  \ 表达式\n要创建 Lambda 表达式，我们在运算符 `->` 的左侧指定输入参数（如果有），并将表达式或语句块放在右侧。例如，Lambda 表达式 `(x,\
  \ y) -> x + y` 两个参数 `x` 和 `y` 并返回它们的和。\n\n**Lambda 表达式语法：**\n```\n(parameter_list)\
  \ -> {function_body}\n```\n\n#### Lambda 表达式与 Java 方法的区别\nJava 中的方法（或函数）包含以下主要部分：\n\
  1. `Name`\n2. `Parameter list`\n3. `Body`\n4. `return type`\n\nJava 中的 Lambda 表达式包含体和参数列表：\n\
  1. 无名称——函数是匿名的，所以我们不在乎名称\n2. `Parameter list`\n3. `Body` —— 这是函数的主要部分\n4. 无返回类型——Java\
  \ 8 编译器能够通过检查代码推断返回类型。你不需要显式说明。\n\n#### 在 Java 中何使用 Lambda\n使用 Lambda 表达式需要自定义函数接口或使用\
  \ Java 提供的函数接口。只有一个抽象方法的接口被称为函数接口（或单抽象方法接口），例如 `Runnable`、`Callable`、`ActionListener`\
  \ 等。\n\n使用函数接口：\nJava 8 之前：我们创建匿名内部类。\nJava 8 之后：你可以使用 Lambda 表达式代替匿名内部类。\n\n####\
  \ Java Lambda 表达式示例\n不使用 Lambda 表达式：在 Java 8 之前，我们使用匿名内部类来实现函数接口的唯一抽象方法。\n\n```java\n\
  import java.awt.*;\nimport java.awt.event.*;\n\npublic class ButtonListenerOldWay\
  \ {\n    public static void main(String[] args) {\n        Frame frame=new Frame(\"\
  ActionListener Before Java8\");\n        Button b=new Button(\"Click Here\");\n\
  \        b.setBounds(50,100,80,50);\n        b.addActionListener(new ActionListener(){\n\
  \            public void actionPerformed(ActionEvent e){\n                System.out.println(\"\
  Hello World!\");\n            }\n        });\n        frame.add(b);\n        frame.setSize(200,200);\n\
  \        frame.setLayout(null);\n        frame.setVisible(true);\n    }\n}\n```\n\
  \n\n\n\n通过 Lambda 表达式：与其创建匿名内部类，我们可以像下面这样创建一个 lambda 表达式：\n\n```java\nimport java.awt.*;\n\
  \npublic class ButtonListenerNewWay {\n\n    public static void main(String[] args)\
  \ {\n        Frame frame=new Frame(\"ActionListener java8\");\n        Button b=new\
  \ Button(\"Click Here\");\n        b.setBounds(50,100,80,50);\n        b.addActionListener(e\
  \ -> System.out.println(\"Hello World!\"));\n        frame.add(b);\n        frame.setSize(200,200);\n\
  \        frame.setLayout(null);\n        frame.setVisible(true);\n    }\n}\n```\n\
  \n注意：\n\n1. 如你所见，使用 lambda 表达式减少了代码量。\n2. 向后兼容性：你可以在旧代码中使用 lambda 表达式。Lambda 是向后兼容的，因此当你将项目迁移到\
  \ `java 8` 时，可以在现有的 API 中使用它们。\n\n让我们来看更多 Lambda 表达式的示例。\n\n### 示例 1：无参数的 Java Lambda\
  \ 表达式\n\n```java\n@FunctionalInterface\ninterface MyFunctionalInterface {\n    //\
  \ 一个无参数的方法\n    public String sayHello();\n}\n\npublic class Example {\n    public\
  \ static void main(String args[]) {\n        // lambda 表达式\n        MyFunctionalInterface\
  \ msg = () -> {\n            return \"Hello\";\n        };\n        System.out.println(msg.sayHello());\n\
  \    }\n}\n```\n输出：\nHello\n\n### 示例 2：单参数的 Java Lambda 表达式\n\n```java\n@FunctionalInterface\n\
  interface MyFunctionalInterface {\n    // 一个单参数的方法\n    public int incrementByFive(int\
  \ a);\n}\n\npublic class Example {\n    public static void main(String args[]) {\n\
  \        // 带有单参数 num 的 lambda 表达式\n        MyFunctionalInterface f = (num) -> num+5;\n\
  \        System.out.println(f.incrementByFive(22));\n    }\n}\n```\n输出：\n27\n\n\
  ### 示例 3：多参数的 Java Lambda 表达式\n\n```java\ninterface StringConcat {\n    public String\
  \ sconcat(String a, String b);\n}\n\npublic class Example {\n    public static void\
  \ main(String args[]) {\n        // 带有多个参数的 lambda 表达式\n        StringConcat s =\
  \ (str1, str2) -> str1 + str2;\n        System.out.println(\"Result: \"+s.sconcat(\"\
  Hello \", \"World\"));\n    }\n}\n```\n输出：\nResult: Hello World\n\n### 示例 4：使用 foreach\
  \ 循环遍历集合\n\n```java\nimport java.util.*;\npublic class Example{\n    public static\
  \ void main(String[] args) {\n        List<String> list=new ArrayList<String>();\n\
  \        list.add(\"Rock\");\n        list.add(\"Negan\");\n        list.add(\"\
  Daryl\");\n        list.add(\"Glenn\");\n        list.add(\"Carl\");\n        list.forEach(\n\
  \            // lambda 表达式\n            (names)->System.out.println(names)\n   \
  \     );\n    }\n}\n```\n\n我们可以使用 lambda 表达式遍历 Map 和其他集合类，\n\n## Lambda 表达式 – Java\
  \ 8 中遍历 Map 和 List\n\n### 在 Java 8 中使用 Lambda 表达式遍历 Map\n\n```java\npackage com.javabook;\n\
  import java.util.HashMap;\nimport java.util.Map;\npublic class IterateMapUsingLambda\
  \ {\n    public static void main(String[] args) {\n        Map<String, Integer>\
  \ prices = new HashMap<>();\n        prices.put(\"Apple\", 50);\n        prices.put(\"\
  Orange\", 20);\n        prices.put(\"Banana\", 10);\n        prices.put(\"Grapes\"\
  , 40);\n        prices.put(\"Mango\", 50);\n        /* 不使用 Lambda 遍历\n         \
  \  for (Map.Entry<String, Integer> entry : prices.entrySet()) {\n            System.out.println(\"\
  Fruit: \" + entry.getKey() + \", Price: \" + entry.getValue());\n          }\n \
  \       */\n        prices.forEach((k,v)->System.out.println(\"Fruit: \" + k + \"\
  , Price: \" + v));\n    }\n}\n```\n输出：\nFruit: Apple, Price: 50\nFruit: Grapes,\
  \ Price: 40\nFruit: Mango, Price: 50\nFruit: Orange, Price: 20\nFruit: Banana, Price:\
  \ 10\n\n### 在 Java 8 中使用 Lambda 表达式遍历 List\n\n```java\npackage com.javabook;\nimport\
  \ java.util.List;\nimport java.util.ArrayList;\npublic class IterateListUsingLambda\
  \ {\n    public static void main(String[] args) {\n        List<String> names =\
  \ new ArrayList<>();\n        names.add(\"Ajay\");\n        names.add(\"Ben\");\n\
  \        names.add(\"Cathy\");\n        names.add(\"Dinesh\");\n        names.add(\"\
  Tomy\");\n        /* 不使用 Lambda 遍历\n           Iterator iterator = names.iterator();\n\
  \           while (iterator.hasNext()) {\n            System.out.println(iterator.next());\n\
  \          }\n        */\n        names.forEach(name->System.out.println(name));\n\
  \    }\n}\n```\n输出：\nAjay\nBen\nCathy\nDinesh\nTomy\n\n## 4.2 Java 8 中的方法引用\n\n\
  方法引用是调用方法的 lambda 表达式的简写形式。例如：\n\n如果你的 lambda 表达式如下：\n```\nstr -> System.out.println(str)\n\
  ```\n那么你可以用方法引用替换它：\n```\nSystem.out::println\n```\n`::` 运算符用于分隔类和方法名。\n\n方法引用的类型：\n\
  1. 实例方法引用 – `object::method`\n2. 静态方法引用 – `Class::staticMethod`\n3. 任意对象的类方法引用 –\
  \ `ClassName::method`\n4. 构造方法引用 – `ClassName::new`\n\n### 1. 实例方法引用\n\n```java\n\
  @FunctionalInterface\ninterface MyInterface {\n    void display();\n}\n\npublic\
  \ class Example {\n    void method(){\n        System.out.println(\"Instance Method\"\
  );\n    }\n    public static void main(String[] args) {\n        Example obj = new\
  \ Example();\n        // 使用对象的方法引用\n        MyInterface ref = obj::method;\n   \
  \     // 调用接口方法\n        ref.display();\n    }\n}\n```\n输出：\nInstance Method\n\n\
  ### 2. 静态方法引用\n\n```java\nimport java.util.function.BiFunction;\nclass Multiplication{\n\
  \    public static int multiply(int a, int b){\n        return a*b;\n    }\n}\n\n\
  public class Example {\n    public static void main(String[] args) {\n        BiFunction<Integer,\
  \ Integer> product = Multiplication::multiply;\n        // 使用静态方法引用\n        int\
  \ pr = product.apply(11, 5);\n        System.out.println(\"Product of given number:\"\
  +pr);\n    }\n}\n```\n输出：\nProduct of given number:55\n\n### 3. 任意对象的类方法引用\n\n```java\n\
  import java.util.Arrays;\npublic class Example {\n    public static void main(String[]\
  \ args) {\n        String[] stringArray = {\"Stefen\", \"Rick\", \"Aditya\", \"\
  Negan\", \"Lucy\", \"Sansa\", \"Jony\"};\n        /* 任意对象的类方法引用\n           任意类型\
  \        */\n        Arrays.sort(stringArray, String::compareToIgnoreCase);\n  \
  \      for(String str: stringArray){\n            System.out.println(str);\n   \
  \     }\n    }\n}\n```\n输出：\nAditya\nJony\nLucy\nNegan\nRick\nSansa\nStefen\n\n\
  ### 4. 构造方法引用\n\n```java\n@FunctionalInterface\ninterface MyInterface {\n    Hello\
  \ display(String say);\n}\n\nclass Hello{\n    public Hello(String say){\n     \
  \   System.out.print(say);\n    }\n}\n\npublic class Example {\n    public static\
  \ void main(String[] args) {\n        // 构造方法引用\n        MyInterface ref = Hello::new;\n\
  \        ref.display(\"Hello World!\");\n    }\n}\n```\n输出：\nHello World!\n\n##\
  \ 4.3 Java 函数式接口\n\n只有一个抽象方法的接口被称为函数式接口。你可以使用 Java 提供的预定义函数式接口，也可以创建你自己的函数式接口并使用它。\n\
  \n要在 Java 中使用 lambda 表达式，你需要创建自己的函数式接口或使用 Java 提供的预定义函数式接口。在创建自己的函数式接口时，用 `@FunctionalInterface`\
  \ 注解标记它，该注解是可选的，但如果你标记了该注解的接口不符合函数式接口的规则，你应该会得到编译错误。\n\n定义函数式接口的规则是什么？\n\n函数式接口应该只有一个抽象方法。除了唯一的抽象方法外，它们可以有任意数量的默认方法静态方法。\n\
  \n示例 1：创建你自己的函数式接口\n\n```java\n@FunctionalInterface\ninterface MyFunctionalInterface\
  \ {\n    public int addMethod(int a, int b);\n}\n\npublic class javaBookClass {\n\
  \    public static void main(String[] args[]) {\n```\n\n\n\n\n\n```java\n // lambda\
  \ expression\n\n MyFunctionalInterface sum = (a, b) -> a + b;\n\n System.out.println(\"\
  Result: \"+sum.addMethod(12, 100));\n\n    }\n\n}\n```\n\nOutput:\nResult: 112\n\
  \n### 示例 2：使用预定义的函数接口\n\n```java\nimport java.util.function.IntBinaryOperator;\n\
  \npublic  class  BeginnersBookClass {\n\n public  static  void main(String args[])\
  \ {\n\n // lambda expression\n\n IntBinaryOperator sum = (a, b) -> a + b;\n\n System.out.println(\"\
  Result: \" + sum.applyAsInt(12, 100));\n\n    }\n}\n```\n\nOutput:\nResult: 112\n\
  \n### 函数式接口示例：使用匿名内部类 vs 使用 lambda 表达式\n\n在 Java 8 之前我们就已经在使用函数接口了，它们是通过创建实现这些接口的匿名内部类使用的。你一定见过诸如\
  \ `Runnable`、`ActionListener`、`Comparator` 等函数接口。它们都只有一个抽象方法。让我们来看 `ActionListener`\
  \ 的示例，看看它是如何通过匿名内部类使用的，以及它是如何使用 lambda 表达式实现的。\n\n#### ActionListener 示例：Java 8\
  \ 之前：使用匿名内部类\n\n```java\nimport javax.swing.*;\nimport java.awt.*;\nimport java.awt.event.*;\n\
  class  Example  extends  JFrame\n\n{\n\n JButton button;\n\n public  Example()\n\
  \n    {\nsetTitle(\"Button Action Example without Lambda Expression\");\nsetSize(400,300);\n\
  setVisible(true);\nsetLayout(new  FlowLayout());\nsetDefaultCloseOperation(EXIT_ON_CLOSE);\n\
  button = new  JButton(\"Button\");\nbutton.setBounds(100,100,90,40);\nbutton.addActionListener(new\
  \  ActionListener(){ \n\n public  void actionPerformed(ActionEvent e){\n\nSystem.out.println(\"\
  You clicked the button.\");\n\n  } \n});\nadd(button);\n\n    }\n public  static\
  \  void main(String args[])\n\n    {\nnew  Example();\n\n    }  \n}\n```\n\n####\
  \ ActionListener 示例：Lambda 表达式\n\n```java\nimport javax.swing.*;\nimport java.awt.*;\n\
  class  Example  extends  JFrame\n\n{\n\n JButton button;\n\n public  Example()\n\
  \n    {\nsetTitle(\"Button Action Example using Lambda Expression\");\nsetSize(400,300);\n\
  setVisible(true);\nsetLayout(new  FlowLayout());\nsetDefaultCloseOperation(EXIT_ON_CLOSE);\n\
  button = new  JButton(\"Button\");\nbutton.setBounds(100,100,90,40);\n//Lambda expression\n\
  button.addActionListener(e->\n\n System.out.println(\"You clicked the button.\"\
  ));\nadd(button);\n\n    }\n public  static  void main(String args[])\n\n    {\n\
  new  Example();\n\n    }  \n}\n```\n\n## 4.4 Java 8 接口变化\n\n#### Java 8 接口变化 –默认方法和静态方法\n\
  \n接口中的所有方法默认都是公共且抽象的。Java 8 允许接口拥有默认方法（default method）和静态方法（static method）。我们在接口引入默认方法的原因是允许开发者向接口添加新方法，而不会影响实现这些接口的类。\n\
  \n##### 为什么需要默认方法？\n\n例如，如果多个类（如 `A`、`B`、`C` 和 `D`）实现接口 `XYZInterface`，那么如果我们向 `XYZInterface`\
  \ 添加一个新方法，我们就必须修改实现该接口的所有类（`A`、`B`、`C` 和 `D`）的代码。在这个示例中，我们只有四个实现接口的类需要修改，但想象一下如果有成百个类实现一个接口，那么修改所有类代码几乎是不可能的。这就是为什么在\
  \ Java 8 中，我们引入了一个新概念“默认方法”。这些方法可以添加到任何现有的接口中，我们不需要强制在实现类中实现这些方法，因此我们可以在不破坏代码的情况下向现有接口添加这些默认方法。\n\
  \n注意：我们可以说，Java 8 引入默认方法是为了在现有接口中添加新方法，使其保持向后兼容。向后兼容是在不破坏旧代码的情况下添加新功能。\n\n接口中的静态方法与默认方法，区别在于我们不能在实现这些接口的类中重写这些方法。\n\
  \n##### Java 8 示例：接口中的默认方法\n\n`MyInterface` 中的 `newMethod()` 方法是一个默认方法，这意味着我们不需要在实现类\
  \ `Example` 中实现这个方法。通过这种方式，我们可以向现有接口添加默认方法，而无需担心实现这些接口的类。\n\n```java\ninterface\
  \  MyInterface{ \n\n /* 这是一个默认方法，所以我们不需要\n     * 在实现类\n     * 类中实现这个方法 \n     */\n\
  \ default  void newMethod(){\nSystem.out.println(\"Newly added default method\"\
  ); \n\n    } \n\n /* 已有的公共和抽象方法\n     * 我们必须在实现\n     * 类中实现这个方法。\n     */\n void\
  \ existingMethod(String str);\n} \n\npublic  class  Example  implements  MyInterface{\n\
  // 实现抽象方法\n public  void existingMethod(String str){\nSystem.out.println(\"String\
  \ is: \"+str);\n\n  }\n public  static  void main(String args[]) {\n\n Example obj\
  \ = new  Example();\n\n // 调用默认方法\nobj.newMethod();\n\n // 调用抽象方法\nobj.existingMethod(\"\
  Java 8 is easy to learn\");\n\n  }\n}\n```\n\nOutput:\nNewly added default method\n\
  String is: Java 8 is easy to learn\n\n##### 接口中的静态方法\n\n如上所述，接口中的静态方法与默认方法相似，但我们不能在实现这些接口的类中重写它们。我们也可以直接调用它们。\n\
  \n```java\ninterface  MyInterface{ \n\n /* 这是一个默认方法，所以我们不需要\n     * 在实现类\n     *\
  \ 类中实现这个方法 \n     */\n default  void newMethod(){\nSystem.out.println(\"Newly added\
  \ default method\"); \n\n    } \n\n /* 已有的公共和抽象方法\n     * 我们必须在实现\n     * 类中实现这个方法。\n\
  \     */\n void existingMethod(String str);\n\n /* 这是一个静态方法。接口中的静态方法\n     * 与默认方法相似，但我们不能在实现\n\
  \     * 类中重写它们。类似于\n     * 默认方法，我们可以安全地将它们\n     * 添加到现有接口中。\n     */\n static \
  \ void anotherNewMethod(){\nSystem.out.println(\"Newly added static method\");\n\
  \n    }\n}\n```\n\nOutput:\nNewly added static method\n\n#### Java 8 – 抽象类 vs 接口\n\
  \n随着接口默认方法的引入，看起来 Java 8 中的抽象类与接口相同。然而这并非完全正确，尽管我们现在可以在接口中拥有具体方法（带有体的方法就像就像抽象类一样），但这并不意味着它们是相同的。它们之间仍然存在一些区别，之一是抽象类可以有构造函数，而接口中没有构造函数。\n\
  \n接口的目的是提供完全抽象，而抽象类的目的是提供部分抽象。这仍然成立。接口就像类的蓝图，通过默认方法的引入，我们可以简单地说，可以在接口中添加额外功能，而不影响终端用户类。\n\
  \n默认方法与多重继承\n\n\n\n\n\n当两个具有相同签名的默认方法的接口时，可能会发生多重继承问题。让我们来看一个例子。\n\n```java\ninterface\
  \ MyInterface{\n    default void newMethod(){\n        System.out.println(\"Newly\
  \ added default method\");\n    }\n    void existingMethod(String str);\n}\n\ninterface\
  \ MyInterface2{\n    default void newMethod(){\n        System.out.println(\"Newly\
  \ added default method\");\n    }\n    void disp(String str);\n}\n\npublic class\
  \ Example implements MyInterface, MyInterface2{\n    // 实现抽象方法\n    public void\
  \ existingMethod(String str){\n        System.out.println(\"String is: \"+str);\n\
  \    }\n    public void disp(String str){\n        System.out.println(\"String is:\
  \ \"+str);\n    }\n    public static void main(String[] args) {\n        Example\
  \ obj = new Example();\n        // 调用接口的默认方法\n        obj.newMethod();\n    }\n\
  }\n```\n\n输出：\n`Error: Duplicate default methods named newMethod with the parameters\
  \ () and () are inherited from the types MyInterface2 and MyInterface.`\n\n这是因为我们在两个接口中都有相同的方法，编译器不确定应该调用哪一个。\n\
  \n### 如何解决这个问题？\n\n要解决这个问题，我们像这样在实现类中实现该方法：\n\n```java\ninterface MyInterface{\n\
  \    default void newMethod(){\n        System.out.println(\"Newly added default\
  \ method\");\n    }\n    void existingMethod(String str);\n}\n\ninterface MyInterface2{\n\
  \    default void newMethod(){\n        System.out.println(\"Newly added default\
  \ method\");\n    }\n    void disp(String str);\n}\n\npublic class Example implements\
  \ MyInterface, MyInterface2{\n    // 实现抽象方法\n    public void existingMethod(String\
  \ str){\n        System.out.println(\"String is: \"+str);\n    }\n    public void\
  \ disp(String str){\n        System.out.println(\"String is: \"+str);\n    }\n \
  \   // 重复默认方法的实现\n    public void newMethod(){\n        System.out.println(\"Implementation\
  \ of default method\");\n    }\n    public static void main(String[] args) {\n \
  \       Example obj = new Example();\n        // 调用接口的默认方法\n        obj.newMethod();\n\
  \    }\n}\n```\n\n输出：\n`Implementation of default method`\n\n## 4.5 Java 8 Stream\
  \ 教程\n\n在之前的教程中，我们学习了 Java 8 中的接口变化。在这份指南中，我们将讨论 `Stream API`，这是 Java 8 的另一个新功能。该\
  \ API 的所有类和接口都在 `java.util.stream` 包中。通过使用流，我们可以对从集合、数组、输入/输出操作返回的数据执行各种聚合操作。在查看\
  \ Java 中如何使用 stream API 之前，让我们来看一个例子来理解流的使用。\n\n## Java Stream 示例\n\n为了理解流如何工作原理，让我们先看一个不使用流的例子，然后看使用流的相同例子。\n\
  \n### 不使用 Stream 查找特定字符串\n\n```java\nimport java.util.ArrayList;\nimport java.util.List;\n\
  public class Example{\n    public static void main(String[] args) {\n        List<String>\
  \ names = new ArrayList<String>();\n        names.add(\"Ajith\");\n        names.add(\"\
  Negan\");\n        names.add(\"Adity\");\n        names.add(\"Stefen\");\n     \
  \   int count = 0;\n        for (String str : names) {\n            if (str.length()\
  \ < 6)\n                count++;\n        }\n        System.out.println(\"There\
  \ are \"+count+\" strings with length 6\");\n    }\n}\n```\n输出：\n`There are 3 strings\
  \ with length 6`\n\n### 使用 Stream 的相同示例\n\n```java\nimport java.util.ArrayList;\n\
  import java.util.List;\npublic class Example{\n    public static void main(String[]\
  \ args) {\n        List<String> names = new ArrayList<String>();\n        names.add(\"\
  Ajith\");\n        names.add(\"Negan\");\n        names.add(\"Adity\");\n      \
  \  names.add(\"Stefen\");\n        // 使用 Stream 和 Lambda 表达式\n        long count\
  \ = names.stream().filter(str->str.length()<6).count();\n        System.out.println(\"\
  There are \"+count+\" strings with length 6\");\n    }\n}\n```\n输出：\n`There are\
  \ 3 strings with length 6`\n\n### 这些代码之间有什么区别？\n\n两个例子的输出是相同的，但如果你考虑代码的性能，这些例子之间存在主要差异。在第一个例子中，我们遍历整个列表来查找长度小于\
  \ 6 的字符串。这段代码中没有并行性。在第二个例子中，`stream()` 方法返回一个包含所有名称的流，`filter()` 方法返回另一个长度小于 6 的名称流，`count()`\
  \ 方法将此流归约为结果。所有这些操作都是并行发生的，这意味着我们能够借助流来将代码并行化。使用流进行操作的并行执行比使用流进行顺序执行更快。\n\n## 如何在\
  \ Java 中使用 Stream\n\n正如我们在上面的示例所示，流的工作原理可以分为三个阶段：\n\n1. 创建一个流。\n2. 在初始流上执行中间操作，以将其转换为另一个流，并继续后续操作。在上面的例子中，`filter()`\
  \ 操作是中间操作，可以有多个一个中间操作。\n3. 在最终流上执行终端操作以获取结果。在上面的例子中，`count()` 操作是终端操作。\n\n## Java\
  \ Stream 的特性\n\n1. `Stream` 不存储元素。它只是对集合、数组或任何其他数据源执行聚合操作（如我们在上面的例子中看到的 `filter()`\
  \ 和 `count()`）以获取所需的流。\n2. 流操作是惰性的，这意味着它们在需要时才会执行。例如，我们在上面的例子中使用流过滤长度小于 6 的字符串，但它并没有更改列表的数据。\n\
  3. 如果我们想使用流显示前 2 个元素，流操作将在第二次迭代后停止。\n\n让我们看看 Java Stream 的一些示例：\n\n### Java Stream\
  \ 示例 1：迭代并显示整数\n\n```java\nimport java.util.stream.*;\npublic class Example {\n\
  \    public static void main(String[] args){\n        Stream.iterate(1, count->count+1)\n\
  \            .filter(number%3==0)\n            .limit(6)\n            .forEach(System.out::println);\n\
  \    }\n}\n```\n输出：\n`3`\n`6`\n`9`\n`12`\n`15`\n`18`\n\n### Java Stream 示例 2：合并两个流\n\
  \n```java\nimport java.util.Arrays;\nimport java.util.List;\nimport java.util.stream.Stream;\n\
  public class Example {\n    public static void main(String[] args) {\n        //\
  \ 列表 1\n        List<String> alphabets = Arrays.asList(\"A\",\"B\",\"C\");\n   \
  \     // 列表 2\n        List<String> names = Arrays.asList(\"Sansa\",\"Jony\",\"\
  Aryan\");\n        // 从两个列表创建流并将其合并为一个\n        Stream<String> opstream = Stream.concat(alphabets.stream(),\
  \ names.stream());\n        // 显示合并流的元素\n        opstream.forEach(str->System.out.print(str+\"\
  \ \"));\n    }\n}\n```\n输出：\n`A B C Sansa Jony Aryan `\n\n## 4.6 Java 8 Stream Filter\
  \ 教程\n\n## Java 8 Stream Filter 示例\n\n建议你在学习本教程之前阅读该指南。在本指南中，我们将讨论 Java stream filter。`filter()`\
  \ 是一个中间操作，它从流中读取数据并在根据给定条件转换数据后返回一个新的流。让我们先来看简单的例子，然后查看流的其他方法的 stream filter 示例。\n\
  \n### Java Stream Filter() 的简单示例\n\n在这个例子中，我们使用 `stream()` 方法从名称列表创建一个流，然后使用 `stream\
  \ filter()` 创建另一个长名称流。正如我上面提到的，stream filter 将一个流的数据转换为另一个流。\n\n```java\nimport\
  \ java.util.Arrays;\nimport java.util.List;\nimport java.util.stream.Stream;\npublic\
  \ class Example {\n```\n\n\n\n\n\n```java\npublic static void main(String[] args)\
  \ {\n    List<String> names = Arrays.asList(\"Melisandre\",\"Sansa\",\"Jony\",\"\
  Daenerys\",\"Joffery\");\n    // 创建所有名称的流\n    Stream<String> allNames = names.stream();\n\
  \    // 使用 filter() 过滤长名称来创建另一个流\n    Stream<String> longNames = allNames.filter(str\
  \ -> str.length() > 6);\n    // 显示长名称\n    longNames.forEach(str->System.out.print(str+\"\
  \ \"));\n}\n```\n输出:\n`Melisandre Daenerys Joffery`\n\n## 示例 1：Stream `filter()`\
  \ 和 `collect()`\n\n我们可以像下面的示例所示，在一行内创建一个流并应用过滤器。这里的 `collect()` 方法收集最终的流并将其转换为列表。\n\
  \n```java\nimport java.util.Arrays;\nimport java.util.List;\nimport java.util.stream.Collectors;\n\
  \npublic class Example {\n    public static void main(String[] args) {\n       \
  \ List<String> names = Arrays.asList(\"Melisandre\",\"Sansa\",\"Jony\",\"Daenerys\"\
  ,\"Joffery\");\n        List<String> longnames = names.stream() // 将列表转换为流\n   \
  \         .filter(str -> str.length() > 6) // 过滤流以创建一个新流\n            .collect(Collectors.toList());\
  \ // 收集最终的流并转换为 List\n        longnames.forEach(System.out::println);\n    }\n}\n\
  ```\n输出:\n`Melisandre`\n`Daenerys`\n`Joffery`\n\n## 示例 2：带有多个条件的 Stream `filter()`\n\
  \n在上面的示例中，我们看到 `filter()` 方法中只有一个条件。我们可以在 `filter()` 方法中使用多个条件，并使用逻辑运算符将它们连接。在接下来的示例中，我们在过滤器方法中有两个使用\
  \ `&&` 逻辑运算符连接的条件。\n\n```java\nimport java.util.Arrays;\nimport java.util.List;\n\
  import java.util.stream.Collectors;\n\npublic class Example {\n    public static\
  \ void main(String[] args) {\n        List<String> names = Arrays.asList(\"Melisandre\"\
  ,\"Sansa\",\"Jony\",\"Daenerys\",\"Joffery\");\n        List<String> longnames =\
  \ names.stream()\n            .filter(str -> str.length() > 6 && str.length() <\
  \ 8) // 多条件\n            .collect(Collectors.toList());\n        longnames.forEach(System.out::println);\n\
  \    }\n}\n```\n输出:\n`Joffery`\n\n## 示例 3：Java 中的 Stream `filter()` 和 `map()` 方法\n\
  \n```java\nimport java.util.Arrays;\nimport java.util.List;\nimport java.util.stream.Collectors;\n\
  \npublic class Example {\n    public static void main(String[] args) {\n       \
  \ List<Integer> num = Arrays.asList(1,2,3,4,5,6);\n        List<Integer> squares\
