  \ thread interrupted\");\n        }\n        System.out.println(\"My thread run\
  \ is over\" );\n    }\n}\n\nclass ExtendingExample {\n    public static void main(String\
  \ args[]) {\n        Count cnt = new Count();\n        try {\n            while(cnt.isAlive())\
