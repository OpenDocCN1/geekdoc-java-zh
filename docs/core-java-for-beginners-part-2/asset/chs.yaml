  \n### String substring(int beginIndex)\n它返回字符串的子字符串。该子字符串从指定索引处的字符开始。\n\n#### Java\
  \ – String substring() 方法示例\n`substring()` 方法用于获取特定 `String` 的子字符串。该方法有两个变体：\n\n\
