  \ `while` 循环\n2. 使用 `for` 循环\n3. 使用递归\n\n### 程序 1：使用 while 循环反转数字\n\n该程序提示用户输入数字，然后使用\
  \ while 循环反转数字。\n\n```java\nimport java.util.Scanner;\n\nclass ReverseNumber {\n\
  \    public static void main(String[] args) {\n        int num = 0;\n        int\
  \ reversenum = 0;\n        System.out.println(\"Enter your number:\");\n       \
  \ Scanner in = new Scanner(System.in);\n        // 此语句获取用户输入\n        // 获取的输入存储在数字\
  \ num 中\n        num = in.nextInt();\n        // While 循环：找到数字的反转逻辑\n        while\
  \ (num != 0) {\n            reversenum = reversenum * 10;\n            reversenum\
  \ = reversenum + num % 10;\n            num = num / 10;\n        }\n        System.out.println(\"\
  Reverse of input number is:\"+ reversenum);\n    }\n}\n```\n\n输出：\nEnter your number:14568\n\
  Reverse of input number is: 86541\n\n### 程序 2：使用 for 循环反转数字\n\n```java\nimport java.util.Scanner;\n\
  \nclass ForLoopReverse {\n    public static void main(String[] args[]) {\n     \
  \   int num = 0;\n        int reversenum = 0;\n        System.out.println(\"Enter\
  \ your number:\");\n        // 此语句获取用户输入\n        Scanner in = new Scanner(System.in);\n\
  \        // 获取的输入存储在数字 num 中\n        num = in.nextInt();\n        /* for 循环：没有初始化部分因为\
  \ num 已经\n         * 初始化，没有增减部分因为逻辑\n         * num = num/10 已经减少了 num 的值\n    \
  \     */\n        for (; num != 0; ) {\n            reversenum = reversenum * 10;\n\
  \            reversenum = reversenum + num % 10;\n            num = num / 10;\n\
  \        }\n        System.out.println(\"Reverse of specified number is:\"+ reversenum);\n\
  \    }\n}\n```\n\n输出：\nEnter your number:56789\nReverse of specified number is:\
  \ 98765\n\n### 程序 3：使用递归反转数字\n\n```java\nimport java.util.Scanner;\n\nclass RecursionReverseDemo\
