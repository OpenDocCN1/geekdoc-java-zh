  \ Key5=Item5}\nAfter: {}\n```\n\n## 1.16 Java 中的 HashSet 类\n\n### 带有 HashSet 类\n\
  该类实现了 `Set` 接口，由哈希表（实际上是 `HashMap` 实例）支撑。它不保证迭代顺序；特别是不保证顺序随时间保持不变。该类允许空元素。该类不是同步的。但是它可以显式地同步：`Collections.synchronizedSet(new\
  \ HashSet())`。\n\n**关于 HashSet 的注意事项：**\n1. `HashSet` 不维护任何顺序，元素将以随机顺序返回。\n2. `HashSet`\
  \ 不允许重复。如果你尝试向 `HashSet` 添加重复元素，旧值将被覆盖。\n3. `HashSet` 允许空值，但如果你插入多个空，它只会返回一个空。\n\
  4. `HashSet` 非同步的。\n5. 此类返回的迭代器是快速失败（fail-fast），这意味着如果在创建迭代器后，通过迭代器自身的 `remove`\
  \ 方法以外的任何方式修改了 `HashSet`，迭代器将抛出 `ConcurrentModificationException`。\n\n### 示例\n```java\n\
  import java.util.HashSet;\n\npublic class HashSetExample {\n    public static void\
  \ main(String args[]) {\n        // HashSet 声明\n        HashSet<String> hset = new\
  \ HashSet<String>();\n\n        // 将元素添加到 HashSet\n        hset.add(\"Apple\");\n\
  \        hset.add(\"Mango\");\n        hset.add(\"Grapes\");\n        hset.add(\"\
  Banana\");\n        hset.add(\"Fig\");\n\n        // 添加重复元素\n        hset.add(\"\
  Apple\");\n        hset.add(\"Mango\");\n\n        // 添加空值\n    }\n}\n```\n\n\n\n\
  \n\n```java\nhset.add(null);\nhset.add(null);\n\n//显示 HashSet 元素\nSystem.out.println(hset);\n\
  \n}\n}\n```\n\n输出:\n`[null, Mango, Grapes, Apple, Banana, Fig]`\n\n如你所见，输出中不存在所有重复的值，包括重复的\
  \ null 值。\n\n## 1.17 HashSet 教程\n\n* 删除 HashSet 中的所有元素\n* 如何遍历 HashSet\n* 将 HashSet\
  \ 转换为数组\n* 将 HashSet 转换为 TreeSet\n* 将 HashSet 转换为 List/ArrayList\n* HashSet 对比 HashMap\n\
  * HashSet 对比 TreeSet\n\n## HashSet 方法：\n\n1. `boolean add(Element e)`: 将元素 `e` 添加到列表中。\n\
  2. `void clear()`: 移除列表中所有的元素。\n3. `Object clone()`: 此方法返回 `HashSet` 的浅拷贝。\n4. `boolean\
  \ contains(Object o)`: 检查指定的对象 `o` 是否在列表中。如果找到了该对象，则返回 `true`，否则返回 `false`。\n5.\
  \ `boolean isEmpty()`: 如果 `Set` 中不存在元素，则返回 `true`。\n6. `int size()`: 返回 `Set` 中元素的数量。\n\
  7. `boolean remove(Object o)`: 从 `Set` 中移除指定的对象 `o`。\n\n## 1) 删除 HashSet 中的所有元素\n\
  \n在这里我们将看到如何一次性移除 `HashSet` 的所有元素。我们可以通过调用 `HashSet` 类的 `clear()` 方法来实现。\n\n示例：\n\
  \n```java\nimport java.util.HashSet;\n\nclass EmptyHashSetExample {\n    public\
  \ static void main(String[] args) {\n        // 创建一个 HashSet\n        HashSet<String>\
  \ hset = new HashSet<String>();\n        // 向 HashSet 添加元素\n        hset.add(\"\
  Element1\");\n        hset.add(\"Element2\");\n        hset.add(\"Element3\");\n\
  \        hset.add(\"Element4\");\n        hset.add(\"Element5\");\n        // 显示\
  \ HashSet 元素\n        System.out.println(\"Before: HashSet contains: \"+ hset);\n\
  \n        /* public void clear(): 它移除 HashSet 中的\n         * 所有元素。在此方法被调用后，\n  \
  \       * set 将变为空。\n         */\n        hset.clear();\n        // 再次显示 HashSet\
  \ 内容\n        System.out.println(\"After: HashSet contains: \"+ hset);\n    }\n\
  }\n```\n\n输出：\nBefore: HashSet contains: [Element1, Element2, Element3, Element4,\
  \ Element5]\nAfter: HashSet contains: []\n\n## 2) 如何遍历 Set/HashSet\n\n有以下两种方式遍历\
  \ `HashSet`：\n\n1) 使用 `Iterator`\n2) 不使用 `Iterator`\n\n### 示例 1：使用 Iterator\n\n\
  ```java\nimport java.util.HashSet;\nimport java.util.Iterator;\n\nclass IterateHashSet\
  \ {\n    public static void main(String[] args) {\n        // 创建一个 HashSet\n   \
  \     HashSet<String> hset = new HashSet<String>();\n        // 向 HashSet 添加元素\n\
  \        hset.add(\"Chandru\");\n        hset.add(\"Rahul\");\n        hset.add(\"\
  Tomy\");\n        hset.add(\"Rick\");\n        hset.add(\"Hari\");\n        Iterator<String>\
  \ it = hset.iterator();\n        while(it.hasNext()){\n            System.out.println(it.next());\n\
  \        }\n    }\n}\n```\n\n输出：\nChandru\nRick\nHari\nRahul\nTomy\n\n### 示例 2：不使用\
  \ Iterator 遍历\n\n```java\nimport java.util.HashSet;\nimport java.util.Set;\n\nclass\
