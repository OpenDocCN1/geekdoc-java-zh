  Hello\")` 将将字符串“Hello”拼接在字符串 `s1` 的末尾。该方法可以在单个语句中多次调用，如下：\n\n```java\nString s1=\"\
  java\";\ns1= s1.concat(\"Book\").concat(\".\").concat(\"com\");\n```\n执行上述语句后，`s1`\
  \ 的值将为 `javaBook.com`。\n\n#### 完整示例\n在此示例中，我们分享了两种拼接字符串的方法。\n```java\npublic class\
  \ ConcatenationExample {\n    public static void main(String args[]) {\n       \
  \ // 拼接的方法\n        String str1 = \"Welcome\";\n        str1 = str1.concat(\" to\
