  /* 程序：线性搜索示例\n* 编写者：feroz 来自 javabook.com\n* 输入：元素个数、元素值、要搜索的值\n* 输出：用户输入的数字在其他数字中的位置*/\n\
  import java.util.Scanner;\n\nclass LinearSearchExample {\n  public static void main(String\
  \ args[]) {\n    int counter, num, item, array[];\n    // 获取用户输入\n    Scanner input\
