  \ }\n}\n```\n\n输出：\nChandru\nRick\nHari\nRahul\nTomy\n\n## 3) 将 HashSet 转换为数组\n\n\
  这是一个将 `HashSet` 转换为数组的程序。\n\n程序\n\n```java\nimport java.util.HashSet;\nclass ConvertHashSettoArray\
