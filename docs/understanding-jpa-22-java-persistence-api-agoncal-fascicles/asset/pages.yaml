  md: '# MAPPING ENTITIES


    In the previous chapter, I went through the basics of object-relational mapping
    (ORM), which is basically mapping entities to tables and attributes to columns.
    I also introduced configuration by exception which allows the JPA provider to
    map an entity to a database table using all the defaults. But defaults are not
    suitable, especially if you map your domain model to an existing database. JPA
    comes with a rich set of metadata so you can customise the mapping.


    In this chapter, I cover elementary mapping as well as more complex mappings such
    as relationships, composition, and inheritance. A domain model is made of objects
    interacting with each other. Objects and databases have different ways to store
    relationship information (references in objects and foreign keys in databases).
    Inheritance is not a feature that relational databases naturally have, and therefore
    the mapping is not as obvious. In this chapter, I go into some detail and show
    examples that demonstrate how to map attributes, relationships, and inheritance
    from a domain model to a database.


    ![](img/c29e53007c33cf0fd2f7aed02ac4eb8b_92_0.png)'
