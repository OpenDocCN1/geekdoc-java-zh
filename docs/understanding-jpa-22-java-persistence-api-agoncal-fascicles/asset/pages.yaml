  md: '# Removing an Entity


    An entity can be removed with the EntityManager.remove() method. Once removed,
    the entity is deleted from the database, is detached from the entity manager,
    and cannot be synchronised with the database anymore. In terms of Java objects,
    the entity is still accessible until it goes out of scope and the garbage collector
    cleans it up. The code in Listing 10 shows how to remove an object after it has
    been created.


    Listing 10. Creating and Removing Customer and Address Entities


    ```

    Customer customer = new Customer("Anthony", "Balla",

    "aballa@mail.com");

    Address address = new Address("Ritherdon Rd", "London", "8QE",

    "UK");

    customer.setAddress(address);


    // Persists the object

    tx.begin();

    em.persist(customer);

    em.persist(address);

    tx.commit();


    assertNotNull(customer.getId());

    assertNotNull(address.getId());


    // Removes the object from the database

    tx.begin();

    em.remove(customer);

    tx.commit();


    // The objects are still available until GC

    assertEquals(customer.getFirstName(), "Anthony");

    assertEquals(address.getCity(), "London");


    // The entities are not in the database

    customer = em.find(Customer.class, customer.getId());

    ```'
