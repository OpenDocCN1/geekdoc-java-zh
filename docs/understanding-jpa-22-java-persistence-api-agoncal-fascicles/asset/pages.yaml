- pgno: 22
  md: '# Who Is This Fascicle For?


    Java Persistence API has its genesis in the Hibernate community. It was then specified
    in the JCP and became part of the Java EE platform.


    So, this fascicle is for the Java community as a whole. If you come from Java
    EE, you will be, of course, very familiar with JPA. But this fascicle is also
    meant to be used by the Spring community. Spring has embraced JPA since the beginning.
    So, all of the explanations and examples you''ll see in this fascicle work out
    of the box with Spring, Java EE and other Java technologies.


    And of course, Java Persistence API works on plain vanilla Java SE, so any Java
    developer can benefit from it. The only requirement to follow and understand this
    fascicle is to know Java and have some knowledge of relational database.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# How Is This Fascicle Structured?


    This fascicle concentrates on JPA 2.2. Its structure will help you to discover
    this technology as well as helping you to dive into it if you already have some
    experience of it.


    This fascicle starts with Chapter 1 by showing a few lines of JPA code. That''s
    because, as developers, we like to read code first when learning a new technology.


    Chapter 2 briefly presents Java Persistence API, the problems it addresses and
    explains the common concerns discussed throughout the fascicle. This chapter also
    looks at the standardisation side of this technology and where it comes from.


    Chapter 3 is all about showing some basic code of Java Persistence API and introducing
    its main APIs and deployment descriptors.


    Chapter 4 introduces object relational mapping (i.e. mapping Java objects to a
    relational database) and shows how we can use annotation and XML to map JPA entities
    to a relational database.


    Once entities are mapped, Chapter 5 will show you how to manage these entities:
    how to persist, remove, or find entities from a relational database.


    CRUD operations on entities are not enough. Chapter 6 explains how to use the
    powerful Java Persistence Query Language so you can query entities following different
    criteria.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Entities have a complex life cycle that is explained in Chapter 7. This chapter
    also covers callbacks and listeners.


    Chapter 8 will cover some advanced topics such as caching and concurrency access.


    Chapter 9 shows how to integrate Java Persistence API with other technologies
    such as Bean Validation, CDI, JTA and Spring.


    In Chapter 10, you''ll build a more complex application with most of the concepts
    that have been introduced throughout this fascicle.


    Chapter 10 wraps up with a summary of what you''ve learnt in this fascicle.


    Appendix A highlights the tools used throughout the fascicle and how to install
    them.


    JPA 2.2 has a long history of specifications behind it. Appendix B lists all the
    revisions of this specification.


    Appendix C points to some external references which are worth reading if you want
    to know more about JPA.


    This is not the only fascicle I have written. You''ll find the description of
    the other fascicles at Appendix D: Understanding Bean Validation 2.0, Understanding
    JPA 2.2.'
  merge: -1
  img_proc: true
