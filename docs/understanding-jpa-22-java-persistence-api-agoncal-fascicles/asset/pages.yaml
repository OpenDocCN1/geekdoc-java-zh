  md: '# Relationship Mapping


    Having collections of embeddables is an interesting way of mapping a list of data.
    But remember that embeddables do not have an identity. What if we want to map
    the fact that a CD album has been recorded by a list of musicians and each Musician
    must be identified in the database? Musician then needs to be an entity. Relationships
    between entities is an important feature in JPA.


    # Relationships in Objects


    The world of object-oriented programming abounds with classes and associations
    between classes. These associations are structural in that they link objects of
    one kind to objects of another, allowing one object to perform an action on another
    one. Several types of associations can exist between classes.


    First of all, an association has a direction. It can be unidirectional (i.e. one
    object can navigate towards another) or bidirectional (i.e. one object can navigate
    towards another and vice versa). In Java, you use the dot (.) syntax to navigate
    through objects. For example, when you write customer.getAddress().getCountry(),
    you navigate from the object Customer to Address and then to Country.


    In UML (Unified Modeling Language), to represent a unidirectional association
    between two classes, you use an arrow to indicate the'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'orientation. In Figure 4, Class1 (the source) can navigate to Class2 (the target),
    but not the inverse.


    ![](img/c29e53007c33cf0fd2f7aed02ac4eb8b_141_0.png)


    Figure 4. A unidirectional association between two classes


    To indicate a bidirectional association, no arrows are used. As demonstrated in
    Figure 5, Class1 can navigate to Class2 and vice versa. In Java, this is represented
    as Class1 having an attribute of type Class2 and Class2 having an attribute of
    type Class1.


    ![](img/c29e53007c33cf0fd2f7aed02ac4eb8b_141_1.png)


    Figure 5. A bidirectional association between two classes


    An association also has a multiplicity (or cardinality). Each end of an association
    can specify how many referring objects are involved in the association. The UML
    diagram in Figure 6 shows that Class1 refers to zero or more instances of Class2.


    ![](img/c29e53007c33cf0fd2f7aed02ac4eb8b_141_2.png)'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'Figure 6. Multiplicity on class associations


    In UML, a cardinality is a range between a minimum and a maximum number. So 0..1
    means that you will have, at a minimum, zero objects and, at a maximum, one object.
    1 means that you have one and only one instance. 1..* means that you can have
    one or many instances, and 3..6 means that you have a range between three and
    six objects. In Java, an association that represents more than one object uses
    the data types java.util.Collection, java.util.Set, java.util.List, or even java.util.Map.


    A relationship has an ownership (i.e. one side of the relationship is the owner
    of that relationship). In a unidirectional relationship, ownership is implied:
    in Figure 4, there is no doubt that the owner is Class1, but in a bidirectional
    relationship, as depicted in Figure 5, the owner has to be specified explicitly.
    For example, Class1 is the owner, which specifies the database mapping, and Class2
    is called the inverse side (the non-owning side).


    Before looking at how to map collections of entities in JPA, let''s look at the
    way relational databases store relationships.


    # Relationships in Relational Databases


    In the relational world, things are different because, strictly speaking, a relational
    database is a collection of relations (also called tables), which means anything
    you model is a table. To model an association, you don''t have lists, sets, or
    maps; you have tables.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'In JPA, when you have an association between two entities, you can model it
    in the database in two different ways: by using a foreign key (a.k.a. join column)
    or by using a join table. In database terms, a column that refers to a key of
    another table is a foreign key column.


    As an example, consider that a customer has one address. Previously, in Listing
    34, we modelled this relation as an embeddable, but let''s turn it into a one-to-one
    relationship. In Java, you would have a Customer class with an Address attribute.
    In the relational world, you could have a CUSTOMER table pointing to an ADDRESS
    table through a foreign key column (or join column), as described in Figure 7.


    ![](img/c29e53007c33cf0fd2f7aed02ac4eb8b_143_0.png)


    Figure 7. Relationship using a join column


    There is a second way of modelling - using a join table. The CUSTOMER table in
    Figure 8 doesn''t store the foreign key of the ADDRESS anymore. An intermediate
    table is created to hold the relationship information by storing the foreign keys
    of both tables.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '| CUSTOMER | JOIN TABLE |

    | --- | --- |

    | PK bigint | PK bigint |

    | FIRST_NAME varchar(255) | CUSTOMER_FK bigint |

    | LAST_NAME varchar(255) | ADDRESS_FK bigint |


    Figure 8. A relationship using a join table


    You wouldn''t use a join table to represent a one-to-one relationship, as this
    could have performance issues (you always need to access a third table to get
    the address of a customer). Join tables are generally used when you have one-to-many
    or many-to-many cardinalities. As you will see in the next section, JPA uses these
    two ways to map object associations.


    # Entity Relationships


    Now back to JPA. Most entities need to be able to reference, or have relationships
    with, other entities. This is what produces the domain model graphs that are common
    in business applications. JPA makes it possible to map associations so that an
    entity can be linked to another in a relational model. Like the elementary mapping
    annotations that you saw previously, JPA uses configuration for exception for
    associations. It has a default way of defining a relationship but, if this doesn''t
    suit your database model, you have several annotations you can use to customise
    the mapping.


    The cardinality between two entities may be one-to-one, one-many, many-to-one,
    or many-to-many. Each respective mapping is named after the cardinality of the
    source and target: @0neToOne,'
  merge: -1
  img_proc: true
