  md: '# UNDERSTANDING JAVA PERSISTENCE API


    Applications are made up of business logic, interaction with other systems, user
    interfaces etc. and data. Most of the data that our applications manipulate have
    to be stored in datastores, retrieved, processed and analysed. Datastores are
    important: they store business data, act as a central point between applications,
    and can even sometimes process data themselves (e.g. relational databases have
    triggers and stored procedures). They can take several forms, from relational
    databases to schemaless databases. But relational databases are what are important
    to us when talking about JPA.


    When developing an application in an object-oriented programming language as Java,
    this data can be represented using objects. Objects encapsulate state and behaviour
    in a nice way, but this state is only accessible when the Java Virtual Machine
    (JVM) is running: if the JVM stops or the garbage collector cleans its memory
    content, objects disappear, well as their state. Some objects need to be persistent
    and, by persistent, I mean objects are deliberately stored in a permanent datastore
    so that their state can be reused later.'
