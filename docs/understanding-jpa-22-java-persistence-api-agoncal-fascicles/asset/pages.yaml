    The single-table-per-class strategy is the default inheritance strategy, is the
    easiest to understand, and works well when the hierarchy is relatively simple
    and stable. However, it has some drawbacks; adding new entities to the hierarchy,
    or adding attributes to existing entities, migrating data, and changing indexes.
    This strategy also requires the columns of the child entities to be nullable.
    If the ISBN of the Book entity happens to be non-null, you cannot insert a CD
    anymore, because the CD entity doesn''t have an ISBN.


