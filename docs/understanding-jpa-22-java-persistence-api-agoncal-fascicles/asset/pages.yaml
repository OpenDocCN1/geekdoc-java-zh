- pgno: 53
  md: '# JPA Overview


    In the Java world, there are several frameworks and specifications to achieve
    object-relational mapping, such as Hibernate, TopLink, or Java Data Objects (JDO),
    but Java Persistence API (JPA) is the preferred technology.


    Java Persistence API (JPA) is a Java specification that manages objects stored
    in a relational database.[61] JPA gives the developer an object-oriented view
    in order to transparently use instead of tables. It also comes with a query language
    (Java Persistence Query Language, or JPQL), allowing complex queries over objects.


    JPA is just a specification that is part of Java EE and is governed by the JCP
    (Java Community Process). It is then implemented by frameworks such as EclipseLink,
    Hibernate or Open JPA.


    # A Brief History of JPA


    ORM solutions have been around for a long time, even before Java. Products such
    as TopLink originally started with Smalltalk in 1994 before switching to Java.[77]
    Commercial ORM products like TopLink have been available since the earliest days
    of the Java language. They were successful but were never standardised for the
    Java platform. A similar approach to ORM was standardised in the form of JDO (Java
    Data Objects), which failed to gain any significant market penetration.[8]'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'In 1998, EJB (Enterprise JavaBeans) 1.0 was created and later shipped with
    J2EE (Java Enterprise Edition) 1.2. It was a heavyweight, distributed component
    used for transactional business logic. Entity Bean CMP (Container-Managed Persistence)
    was introduced as optional in EJB 1.0, became mandatory in EJB 1.1, and was enhanced
    through versions up to EJB 2.1 (J2EE 1.4).[9] Persistence could only be done inside
    the container through a complex mechanism of instantiation using home, local,
    or remote interfaces. The capabilities of ORM were also very limited, as inheritance
    was difficult to map.


    Parallel to the J2EE world was a popular open source solution that led to some
    surprising changes in the direction of persistence: Hibernate, which brought back
    a lightweight, object-oriented persistent model.[[10]


    After years of complaints about Entity CMP 2. x components, and in acknowledgment
    of the success and simplicity of open source frameworks such as Hibernate, the
    persistence model of the Enterprise Edition was completely rearchitected in Java
    EE 5. JPA 1.0 was created with a lightweight approach that adopted many Hibernate
    design principles. The JPA 1.0 specification was bundled with EJB 3.0 (JSR 220).[11]
    In 2009, JPA 2.0 (JSR 317) was released with Java EE 6 and brought new APIs, extended
    JPQL, and added new functionalities such as a second-level cache, pessimistic
    locking, or the criteria API.[[12] In 2013, with Java EE 7, followed the path
    of ease of development and brought new features such as schema generation, converters
    and CDI supports in JSR 338.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '[13] Today JPA is on its version 2.2 that was shipped at the same time as Java
    EE 8.[[14]]


    # JCP and Eclipse Foundation


    The JCP (Java Community Process) is an open organisation, created in 1998 by Sun
    Microsystems, that is involved in the definition of future versions and features
    of the Java platform.[[15]] When the need for standardising an existing component
    or API is identified, the initiator (a.k.a. specification lead) creates a JSR
    (Java Specification Request) and forms a group of experts. This group, made up
    of company representatives, organisations, universities, and private individuals,
    is responsible for the development of the JSR and has to deliver:


    +   - One or more specifications that explain the details and define the fundamentals
    of the JSR,


    +   - A Reference Implementation (RI), which is an actual implementation of the
    specification, and


    +   - A Technology Compatibility Kit (TCK), which is a set of tests every implementation
    needs to pass before claiming to conform to the specification.


    Once approved by the Executive Committee (EC), the specification is released to
    the community for other projects to implement.


    This is exactly the standardisation process that followed JPA 2.2. It has been
    standardised under JSR 338, has a reference implementation (EclipseLink) and has
    a TCK.[[16]]'
  merge: -1
