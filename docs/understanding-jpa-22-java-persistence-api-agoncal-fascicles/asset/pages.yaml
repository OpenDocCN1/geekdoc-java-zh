  md: '# Merging an Entity


    A detached entity is no longer associated with a persistence context. If you want
    to manage it, you need to reattach it (i.e. merge it). Let''s take the example
    of an entity that needs to be displayed on a web page. The entity is first loaded
    from the database into the persistent layer (it is managed), it is returned from
    an invocation of a transactional bean (it is detached because the transaction
    context ends), the presentation layer displays it (it is still detached), and
    then it returns to be updated to. at that moment, the entity is detached and needs
    to be attached again, in order to synchronise its state with the database. This
    reattachment happens through the em.merge() method.


    Listing 17 simulates this case by clearing the persistence context (em.clear()),
    which detaches the entity.


    Listing 17. Clearing the Persistence Context and Merging an Entity


    ```

    Customer customer = new Customer("Anthony", "Balla",

    "aballa@mail.com");


    // Persists the object

    tx.begin();

    em.persist(customer);

    tx.commit();

    asertTrue(em.contains(customer));


    // Clears the Persistence Context

    em.clear();

    asertFalse(em.contains(customer));


    // Re-attaches the entity and updates name

    customer.setFirstName("William");

    tx.begin();

    customer = em.merge(customer);

    ```'
