- pgno: 244
  md: 'StoredProcedureQuery interface (as shown in Figure 1, both TypedQuery and StoredProcedureQuery
    extend Query). The Query interface is used in cases when the result type is Object,
    and TypedQuery is used when a typed result is preferred. StoredProcedureQuery
    is used to control stored procedure query execution.


    ![](img/c29e53007c33cf0fd2f7aed02ac4eb8b_244_0.png)


    Figure 1. Different query interfaces


    # Query API


    When you obtain an implementation of the Query, TypedQuery, or StoredProcedureQuery
