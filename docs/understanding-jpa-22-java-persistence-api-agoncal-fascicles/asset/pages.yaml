  md: '# Mapping with XML


    Now that you are more familiar with elementary mapping using annotations, let''s
    take a look at XML mapping. If you have used an object-relational framework such
    as the early versions of Hibernate, you will be familiar with how to map your
    entities in a separate XML deployment descriptors file. Since the beginning of
    this chapter, you haven''t seen a single line of XML, just annotations. JPA also
    offers, as an option, an XML syntax to map entities. I will not go into too much
    detail about the XML mapping because, nowadays, developers prefer to use annotations
    over XML mapping. But there are still some valid use cases where you could use
    a little XML instead of annotations.


    > Keep in mind that every single annotation you see in this chapter has an XML
    equivalent, and this section would be huge if I covered them all. I encourage
    you to check Chapter 12 (XML Object/Relational Mapping Descriptor) of the JPA
    2.2 specification, which covers all the XML tags in more detail.[22]


    XML deployment descriptors are an alternative to using annotations. However, although
    each annotation has an equivalent XML tag and vice versa, there is a difference
    in that the XML overrides annotations. If you annotate an attribute or an entity
    with a certain value, and at the same time you deploy an XML descriptor with a
    different value, the XML will take precedence.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'The question is, when should you use annotations over XML and why? First of
    all, a matter of taste, as it''s the behaviour of both is exactly the same. When
    the metadata are really coupled to the code (e.g. a primary key), it does make
    sense to use annotations, since the metadata are just another aspect of the program.
    Other kinds of metadata, such as the column length or other schema details, can
    be changed depending on the deployment environment (e.g. the database schema is
    different in the development, test, or production environments). A similar situation
    arises when a JPA-based product needs to support several different database vendors.
    Certain id generation, column options, and so on, may need to be adjusted depending
    on the database type in use. This may be better expressed in external XML deployment
    descriptors (one per environment) so the code doesn''t have to be modified.


    Let''s again turn to the Book entity example. This time imagine you have two environments,
    and you want to map the Book entity to the BOOK table in the development environment
    and to the BOOK_XML_MAPPING table in the test environment. The class will only
    be annotated with @Entity (see Listing 27) and not include information about the
    table it should be mapped to (i.e. it will have no @Table annotation). The @Id
    annotation defines the primary key as being auto-generated, and @Column annotation
    sets the size of the description to 500 characters long.


