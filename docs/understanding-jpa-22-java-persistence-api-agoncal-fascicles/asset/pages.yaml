  md: '# Writing the BookTest Integration Tests


    One of the major selling points of JPA is that you can easily test entities without
    requiring a running application server or live database. But what can you test?
    Entities themselves usually don''t need to be tested in isolation. Most methods
    on entities are simple getters or setters with only a few business methods. Verifying
    that a setter assigns a value to an attribute and that the corresponding getter
    retrieves the same value does not give any extra value (unless a side effect is
    detected in the getters or the setters). So, unit testing an entity has limited
    benefit.


    What about testing the database queries? Making sure that the findBookH2G2 query
    is correct? Or injecting data into the database and testing complex queries bringing
    multiple values? Thanks to in-memory database, CRUD operations and JPQL queries
    can be easily tested with JPA.


    The BookTest class, shown in Listing 8, goes under the src/test/java directory.
    It has a set of test cases to test different interactions with the Book entity.
    The Main class, BookTest needs to create an EntityManager instance using an EntityManagerFactory.
    This is done once before testing (thanks to @BeforeAll) by the init() method which
    initialises the EntityManager (with the cookbookstorePU unit) and creates a new
    transaction. The close() method releases the factory once the tests end (@AfterAll).'
