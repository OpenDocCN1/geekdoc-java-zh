    Figure 2. Entity life cycle with callback annotations


    Before inserting an entity into the database, the entity manager calls the method
    annotated with @PrePersist. If the insert does not throw an exception, the entity
    is persisted, its identity is practised, and the method annotated with @PostPersist
    is then invoked. This is the same behaviour for updates (@PreUpdate, @PostUpdate)
    and deletes (@PreRemove, @PostRemove). A method annotated with @PostLoad is called
    when an entity is loaded from the database (via an EntityManager.find() or a JPQL
    query). When the entity is detached and needs to be merged, the entity manager
    first has to check whether there are any differences with the database (@PostLoad)
    and, if so, update the data (@PreUpdate, @PostUpdate).'
