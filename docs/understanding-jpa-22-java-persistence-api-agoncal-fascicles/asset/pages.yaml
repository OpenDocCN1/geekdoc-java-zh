  md: 'You can still use @DiscriminatorColumn and @DiscriminatorValue annotations
    in the root entity to customise the discriminator column and values (the DTYPE
    column is in the ITEM table).


    The joined-subclass strategy is intuitive and is close to what you know from the
    object inheritance mechanism. By querying have have a performance impact. This
    strategy is called joined because, to reassemble an instance of a subclass, the
    subclass table has to be joined with the root class table. The deeper the hierarchy,
    the more joins needed to assemble a leaf entity. This strategy provides good support
    for polymorphic relationships but requires one or more join operations to be performed
    when instantiating entity subclasses. This may result in poor performance for
    extensive class hierarchies. Similarly, queries that cover the entire class hierarchy
    require join operations between the subclass tables, resulting in decreased performance.


    Table-per-concrete-class Strategy


    In the table-per-class (or table-per-concrete-class) strategy, each entity is
    mapped to its own dedicated table like the joined-subclass strategy. The difference
    is that all attributes of the root entity will also be mapped to columns of the
    child entity table. From a database point of view, this strategy de-normalises
    the model and causes all root entity attributes to be redefined in the tables
    of all leaf entities that inherit from it. With the table-per-concrete-class strategy,
    there is no shared table, no shared columns, and no discriminator column.'
