- pgno: 412
  md: '# Understanding Bean Validation 2.0


    Validating data is a common task that Java developers have to do and it is spread
    throughout all layers (from client to database) of an application. This common
    practice is time-consuming, error prone, and hard to maintain in the long run.
    In addition, some of these constraints are so frequently used that they could
    be considered standard (check for a null value, its size, its range etc.). It
    would be good to be able to centralise these constraints in one place and share
    them across layers. That’s when Bean Validation comes into play.


    In this fascicle, you will learn Bean Validation, use its different APIs to apply
    constraints on a bean, validate all sorts of constraints, write your own constraints
    and also a few advanced topics such as integrating Bean Validation with other
    frameworks (JPA, JAX-RS, CDI, Spring).


    ISBN: 9781980399025 | ASIN B07B2KJ41R'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# Understanding JPA 2.2


    Applications are made up of business logic, interaction with other systems, user
    interfaces etc. and data. Most of the data that our applications manipulate have
    to be stored in datastores, retrieved, processed and analysed. If this datastore
    is a database and you use an object-oriented programming language such as Java,
    then you should have a look at JPA. JPA is an Object-Relational Mapping tool that
    maps Java objects to relational databases and allows query operations.


    In this fascicle, you will learn Java Persistence API, its annotations for mapping
    entities, as well as the Java Persistence Query Language and entity life cycle
    and a few advanced topics such as integrating JPA with other frameworks (Bean
    Validation, JTA, CDI, Spring).


    ISBN: {jpa-book-isbn} | ASIN {jpa-book-asin}'
