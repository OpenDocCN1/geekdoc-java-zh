- pgno: 369
  md: '# SUMMARY


    JPA has a very comprehensive approach to object-relational mapping. It focuses
    on a simple and easy-to-use architecture but yet has a very rich and powerful
    mapping and query mechanism. Thanks to configuration by exception, not much is
    required to map entities to tables; inform the persistence provider that a class
    is actually an entity (using @Entity) and an attribute is its identifier (using
    @Id), and JPA does the rest.


    JPA has a very rich set of annotations to customise every little detail of ORM
    (as well as the equivalent XML mapping). Elementary annotations can be used on
    attributes @Basic, @Temporal etc.) or classes to customise the mapping. You can
    change the table''s name or the primary key type, or even avoid mapping with the
    @Transient annotation. With JPA, you can map collections of basic types or embeddables.
    Depending on your domain model, you can map relationships (@OneToOne, @ManyToOne
    etc.) of different directions and multiplicity. The same thing applies to inheritance
    (@Inheritance, @MappedSuperclass etc.) where you can use different strategies
    to map a hierarchy of entities and nonentities mixed together.'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'Once the mapping is done, JPA lets you query entities in an object-oriented
    way. The entity manager is central to articulating entities with persistence.
    It can create, update, find by Id, remove, and synchronise entities to the database
    with the help of the persistence context, which acts as a level-one cache. JPA
    also comes with a very powerful query language, JPQL, which is database-vendor
    independent. You can retrieve entities with a rich syntax using WHERE, ORDER BY,
    or GROUP clauses, and when concurrent access occurs with your entities, you know
    how to use versioning and when to use optimistic or pessimistic locking.


    JPA also handles the entity life cycle and how the entity manager catches events
    to invoke callback methods. Callback methods can be defined on a single entity
    and annotated by several annotations (@PrePersist, @PostPersist etc.). The method
    can also be extracted to listener classes and used by several or all entities
    (using default entity listeners). With callback methods, you see that entities
    are not just anatomic objects (objects with no business logic, just attributes,
    getters, and setters); entities can have business logic that can be invoked by
    other objects in the application, or invoked automatically by the entity manager,
    depending on the life cycle of the entity.[1]


    This is the end of the Understanding JPA 2.2 fascicle. I hope you liked it, learnt
    a few things, and more importantly, will be able to take this knowledge back to
    your projects.


    Remember that you can find all the code of this fascicle at https://github.com/agoncal/agoncal-fascicle-jpa/tree/2.2.
    If some'
  merge: -1
