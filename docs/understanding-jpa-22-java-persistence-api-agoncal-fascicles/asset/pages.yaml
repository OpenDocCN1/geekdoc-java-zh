  md: '# JTA Integration


    In Java, transaction management is done through the Java Transaction API (JTA)
    specified by JSR 907. JTA defines a set of interfaces for the application or the
    container to demarcate transaction boundaries, and it also defines APIs to deal
    with the transaction manager. The javax.transaction package defines these interfaces.


    So far, all the examples in this fascicle have been using JPA local transactions.
    Resource local transactions are used in a Java SE environment, not in a managed
    environment (Spring or Java EE). This means that the persistence.xml file we''ve
    configured the persistence unit with a transaction-type="RESOURCE_LOCAL":


    ```

    <persistence-unit name="cdbookstorePU" transaction-type="RESOURCE_LOCAL">

    ```


    Once configured, the local transactions are defined through the EntityTransaction
    API which contains basic transaction management including begin, commit and rollback:


    ```

    entityManager.getTransaction().begin();

    entityManager.getTransaction().commit();

    entityManager.getTransaction().rollback();

    ```


    Until begin is called, certain operations such as persist, merge or remove cannot
    be called. After a successful commit, the EntityManager can continue to be used,
    and all of the managed'
