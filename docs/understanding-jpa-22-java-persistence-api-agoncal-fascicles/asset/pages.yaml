  md: '# Maven 3.6.x


    All the examples of this fascicle are built and tested using Maven.[7] Maven offers
    a building solution, shared libraries, and a plugin platform for your projects,
    allowing you to do quality control, documentation, teamwork and so forth. Based
    on the "convention over configuration" principle, Maven brings a standard project
    description and a number of conventions such as a standard directory structure.
    With an extensible architecture based on plugins, Maven can offer many different
    services.


    # A Brief History of Maven


    Maven, created by Jason van Zyl, began as a subproject of Apache Turbine in 2002.
    In 2003, it was voted on and accepted as a top-level Apache Software Foundation
    project. In July 2004, Maven''s release was the critical first milestone, v1.0.
    Maven 2 was declared v2.0 in October 2005 after about six months in beta cycles.
    Maven 3.0 was released in October 2010, being mostly backwards compatible with
    Maven 2.[8]


    # Project Descriptor


    Maven is based on the fact that a majority of Java projects face similar needs
    when building applications. A Maven project needs to follow some standards as
    well as define specific features in a project descriptor, or Project Object Model
    (POM). The POM is an XML file (pom.xml) placed at the root of the project and
    contains all the metadata of the project. As shown in Listing 1, the minimum'
  merge: -1
  img_proc: true
