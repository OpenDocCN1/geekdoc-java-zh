  md: '# CDI Integration


    CDI, or Context and Dependency Injection, is a central technology in Java EE.[2]
    Its programming model turns nearly every Java EE component into an injectable,
    interceptable, and manageable bean. CDI is built on the concept of "loose coupling,
    strong typing," meaning that beans are loosely coupled, but in a strongly-typed
    way. Decoupling goes further by bringing interceptors, decorators, and events
    to the entire platform. And, at the same time, CDI brings the web tier and the
    back end together by homogenising scopes, context and life cycle management. Thanks
    to its event bus, CDI is also the standard way to extend Java EE by writing extensions
    for the platform.


    But let''s use CDI only for injection. So far, when we needed the EntityManager,
    we would programmatically create one giving an EntityManagerFactory. Once used,
    we would also need to close it.


    ```

    EntityManager emf = Persistence.createEntityManagerFactory("cdbookstorePU");EntityManager
    em = emf.createEntityManager();nem.close();

    ```


    But with CDI, we can also get the entity manager via dependency injection using
    the @Inject annotation. For that, we need to define two CDI producers: one that
    creates the EntityManagerFactory and another one to create the EntityManager.
    Listing 5 uses the JPA API to build an application-scoped entity manager factory.'
