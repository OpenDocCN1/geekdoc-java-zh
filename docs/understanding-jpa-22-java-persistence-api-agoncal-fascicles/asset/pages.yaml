    # Flushing an Entity


    With the EntityManager.flush() method, the persistence provider can be explicitly
    forced to flush the data to the database but it will not commit the transaction.
    This allows a developer to manually trigger the same process used by the entity
    manager internally to flush the persistence context.


    Listing 13. Flushing the Customer Entity to the Database


    ```

