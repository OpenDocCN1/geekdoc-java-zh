    # Stored Procedure Queries


    So far, all of the different queries (JPQL or SQL) had the same purpose: send
    a query from your application to the database that will execute it and send back
    a result. Stored procedures are different in the sense that they are actually
    stored in the database itself and executed within this database.


    A stored procedure is a subroutine available to applications that access a relational
    database. Typical usage could be extensive or complex processing that requires
    execution of several SQL statements or a data-intensive repetitive task. Stored
    procedures are usually written in a proprietary language close to SQL and are
    therefore not easily portable across database vendors. But storing the code inside
    the database, even in a nonportable way, provides many advantages, like:


    +   - Better performance due to precompilation of the stored procedure as well
    as reutilising its execution plan,

    - Keeping statistics on the code to keep it optimised,

    - Reducing the amount of data passed over a network by keeping the code on the
    server,'
