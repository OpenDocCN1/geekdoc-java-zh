    several different programs,


    +   - Stored procedures, which can be used by multiple programs

    written in different languages (not just Java),


    +   - Hiding the raw data by allowing only stored procedures to gain

    access to the data, and


    +   - Enhancing security controls by granting users permission to

    execute a stored procedure independently of underlying table

    permissions.


    Let''s take a look at a practical example: archiving old books and

    CDs. After a certain date, books and CDs have to be archived in a

