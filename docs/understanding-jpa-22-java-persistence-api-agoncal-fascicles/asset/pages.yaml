    DESTINATION column length set to 10, then the database will limit it to 10, not
    2000.


    On the other hand, updatable and insertable have an influence during runtime.
    It means that an attribute can be inserted or, updated or not, in the database.
    You can set them to false when you want the persistence provider to ensure that
