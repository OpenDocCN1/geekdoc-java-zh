  md: '# CALLBACKS AND LISTENERS


    By now, you know most of the ins and outs of entities, so let''s look at their
    life cycle. When an entity is instantiated (with the new operator), it is just
    seen as a regular POJO by the JVM (i.e. detached) and can be used as a regular
    object by the application. Then, when the entity is persisted or loaded by the
    entity manager, it is said to be managed. When an entity is managed, the entity
    manager will automatically synchronise the value of its attributes with the underlying
    database (e.g. if you change the value of an attribute using a set method while
    the entity is managed, this new value will be automatically synchronized with
    the database). Let''s discuss the entity life cycle in more detail.


