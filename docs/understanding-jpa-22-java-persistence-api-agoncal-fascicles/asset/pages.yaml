    a String is 255 (a String is mapped to a VARCHAR(255)). But keep in mind that
    the default mapping rules are different from one database to another. For example,
    a String is mapped to a VARCHAR in H2 and a VARCHAR2 in Oracle. An Integer is
    mapped to an INTEGER in H2 and a NUMBER in Oracle. The information of the underlying
    database is provided in the persistence.xml file, which you'll see later.
