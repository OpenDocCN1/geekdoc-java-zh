- pgno: 5
  md: '# FOREWORD


    Lots of Java applications use an Object-Relational Mapping (ORM) framework, like
    Hibernate or EclipseLink, to read data from and to write it to a relational database.
    As a reader of this fascicle, you might already know that both frameworks implement
    the Java Persistence API (JPA) specification and that the popular Spring Data
    JPA project integrates them into the Spring ecosystem. But don''t worry if you''ve
    never heard about the JPA specification. If that''s the case, I want to congratulate
    you on your decision to learn about it.


    JPA is one of the most popular specifications in the Java world. It defines an
    easy-to-use way to map database records to Java objects and to update the database
    records based on the changes performed on these Java objects. It also specifies
    a query language that you can use to define database queries based on your Java
    classes. All of these powerful features are relatively easy to use if you know
    the basic concepts of JPA. That''s why Hibernate and other JPA implementations
    have become so popular and are used in most enterprise Java applications.


    So, it should be evident that, as a professional Java developer or somebody who
    aspires to become one, you should have a solid understanding of JPA''s general
    concepts and capabilities.'
  merge: -1
  img_proc: true
