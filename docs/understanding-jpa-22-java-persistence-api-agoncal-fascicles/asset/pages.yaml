  md: '# QUERYING ENTITIES


    The relational database world relies on Structured Query Language, or SQL. This
    programming language is designed for managing relational data (retrieval, insertion,
    updating and deletion), and its syntax is table oriented. You can select columns
    from tables made of rows, join tables together, combine the results of two SQL
    queries through unions, and so on. There are no objects here, only rows, columns,
    and tables. In the Java world, where we manipulate objects, a language made for
    tables (SQL) has to be tweaked to suit a language made of objects (Java). This
    is where Java Persistence Language comes into play.


    JPQL (Java Persistence Query Language) is the language defined in JPA to query
    entities stored in a relational database. JPQL syntax resembles SQL but operates
    on entity objects rather than directly working with database tables. JPQL does
    not see the underlying database structure or deal with tables or columns rather
    objects and attributes. And, for that, it uses the dot (.) notation that Java
    developers are familiar with.


    ```

    The code in this chapter can be found at https://github.com/agoncal/agoncal-fascicle-jpa/tree/2.2/querying

    ```'
  merge: -1
  img_proc: true
