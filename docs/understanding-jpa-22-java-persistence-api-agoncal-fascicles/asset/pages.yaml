- pgno: 41
  md: '# Understanding Transactions


    Transaction management is an important matter for enterprises. It allows applications
    to have consistent data and to process that data in a reliable manner. Transaction
    management is a low-level concern that a business developer shouldn’t have to
    code. That’s why JTA (Java Transaction API) provides these services in a very
    simple way: either programmatically with a high level of or declaratively using
    metadata.


    A transaction is used to ensure that the data is kept in a consistent state. It
    represents a logical group of operations that must be performed as a single unit,
    also known as a unit of work. These operations can involve persisting data in
    one or several databases, sending messages to a MOM (Message-Oriented Middleware),
    or invoking web services. Companies rely on transactions every day for their banking
    and e-commerce applications or business-business interactions with partners.


    sequentially or in parallel over a relatively short period of time. Every operation
    must succeed in order for the transaction to succeed (we say that the transaction
    is committed). If one of the operations fails, the transaction fails well (the
    transaction is rolled back). In terms of code, this is what it looks like:


    ```

    entityManager.getTransaction().begin();

    entityManager.getTransaction().commit();

    entityManager.getTransaction().rollback();

    ```'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Transactions must guarantee a degree of reliability and robustness and follow
    the ACID properties. ACID refers to the four properties that define a reliable
    transaction: Atomicity, Consistency, Isolation, and Durability (described in Table
    1).


    # Table 1. ACID Properties


    | Property | Description |

    | --- | --- |

    | Atomicity | A transaction is composed of one or more operations grouped in a
    unit of work. At the conclusion of the transaction, either these operations are
    performed successfully (a commit) or none of them is performed at all (a rollback)
    if something unexpected or irrecoverable happens. |

    | Consistency | At the conclusion of the transaction, the data are left in a consistent
    state. |

    | Isolation | The intermediate state of a transaction is not visible to external
    applications. |

    | Durability | Once the transaction is committed, the changes made to the data
    are visible to other applications. |


    To explain these properties, I''ll take the classic example of a bank transfer:
    you need to debit your savings account to credit your current account.


    When you transfer money from one account to the other, you can imagine a sequence
    of database accesses: the savings account is debited using an SQL update statement,
    the current account is credited using a different update statement, and a log
    is created in a different table to keep track of the transfer. These operations
    have to be done in the same unit of work (Atomicity) because you don''t want the
    debit to occur but not the credit. From the perspective of an external application
    querying the accounts, only when both'
  merge: -1
  img_proc: true
- pgno: 43
  md: operations have been successfully performed are they visible (Isolation). With
    isolation, the external application cannot see the interim state when one account
    has been debited and the other is still not credited (if it could, it would think
    the customer has less money than they really do). Consistency is when transaction
    operations (either with a commit or a rollback) are performed within the constraints
    of the database (such as primary keys, relationships, or fields). Once the transfer
    is completed, the data can be accessed from other applications (Durability).
  merge: -1
