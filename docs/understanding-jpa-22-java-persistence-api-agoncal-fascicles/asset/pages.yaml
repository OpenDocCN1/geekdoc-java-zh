- pgno: 332
  md: "```\n@Transactional(MANDATORY)\npublic String needsATTransaction() {\n    return\
    \ \"Success\";\n}\n```\n\nThe @Transactional annotation can annotate an entire\
    \ class or one method. It takes the transaction type as a parameter. There are\
    \ several transaction types you can choose from (described in Table 1) depending\
    \ on your needs.\n\nTable 1. Transaction Types\n\n| Attribute | Description |\n\
    | --- | --- |\n| REQUIRED | This attribute (default value) means that a method\
    \ must always be invoked in a transaction. The container creates a new transaction\
    \ if the method is invoked from a nontransactional client. If the client has a\
    \ transaction context, the business method runs within the client's transaction.\
    \ You should use REQUIRED if making calls that should be managed in a transaction,\
    \ but you can't assume that the client is calling the method from a transaction\
    \ context. |\n| REQUIRES_NEW | The container always creates a new transaction\
    \ before executing a method, regardless of whether the client is executed within\
    \ a transaction. If the client is running within a transaction, the container\
    \ suspends that temporarily, creates a second one, commits or rolls back, and\
    \ then resumes the first transaction. This means that the success or failure of\
    \ the second transaction has no effect on the existing client transaction. You\
    \ should use REQUIRES_NEW when you don't want a rollback to affect the client.\
    \ |\n| SUPPORTS | The transactional method inherits the client's transaction context.\
    \ If a transaction context is available, it is used by the method; if not, the\
    \ container invokes the method with no transaction context. You should use SUPPORTS\
    \ when you have read-only access to the database table."
