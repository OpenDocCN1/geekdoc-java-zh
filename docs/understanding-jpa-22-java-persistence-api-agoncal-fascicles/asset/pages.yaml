    # Type of Classes in the Inheritance Hierarchy


    The previous examples used to explain the mapping strategies only use entities.
    Item is an entity as well as Book and CD. But entities don''t always have to inherit
    from entities. A hierarchy of classes can mix all sorts of different classes:
    entities and nonentities (or transient classes), abstract entities, and mapped
    superclasses. Inheriting from these different types of classes will have an impact
    on the mapping.


    Abstract Entity


    In the previous examples, the Item entity was a concrete class. It was annotated
    with @Entity and didn''t have an abstract keyword, but an abstract class can also
    be specified as an entity. An abstract entity differs from a concrete entity in
    that it cannot be directly instantiated with the new keyword. It provides a common
    data structure for its leaf entities (Book and CD) and follows the mapping strategies.
    Abstract entities can be queried just like concrete entities. In fact, for the
    persistence provider, abstract entities are like concrete entities but cannot
    be instantiated.


