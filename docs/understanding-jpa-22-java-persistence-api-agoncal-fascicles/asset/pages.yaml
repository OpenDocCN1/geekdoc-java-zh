    In JPA 1.0, these annotations didn''t exist. However, you were still able to store
    a list of primitive types as a BLOB in the database. Why? Because java.util.ArrayList
    implements Serializable, and JPA can map Serializable objects to BLOBs automatically.
    However, if you used java.util.List instead, you would have an exception as it
    doesn''t extend Serializable. The @ElementCollection is a more elegant and useful
    way of storing lists of basic types. Storing lists in inaccessible binary format
    makes it opaque to queries and not portable to other languages (since only Java
    runtimes can make use of the underlying serialised object - not Ruby, PHP etc.).


