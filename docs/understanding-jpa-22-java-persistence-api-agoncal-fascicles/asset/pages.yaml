  md: '# JUnit 5.x


    All the examples of this fascicle are tested using JUnit 5.x.[10] JUnit is an
    open source framework to write and run repeatable tests. JUnit features include:


    +   - Assertions for testing expected results,

    - Fixtures for sharing common test data, and

    - Runners for running tests.


    JUnit is the de facto standard testing library for the Java language, and it stands
    in a single jar file that you can download from https://junit.org/junit5 (or use
    Maven dependency management, which we do in in this fascicle). The library contains
    a complete API to help you write your unit tests and execute them. Unit and integration
    tests help your code to be more robust, bug free, and reliable.


    > The code in this chapter can be found at https://github.com/agoncal/agoncal-fascicle-commons/tree/master/junit


    # A Brief History of JUnit


    JUnit was originally written by Erich Gamma and Kent Beck in 1998. It was inspired
    by Smalltalk''s SUnit test framework, also written by Kent Beck. It quickly became
    one of the most popular frameworks'
  merge: -1
