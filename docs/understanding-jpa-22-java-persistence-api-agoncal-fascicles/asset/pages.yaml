  md: '@OneToMany, @ManyToOne, or @ManyToMany. Each annotation can be used in a unidirectional
    or bidirectional way.


    You will see that unidirectional and bidirectional are repetitive concepts that
    apply in the same way to all cardinalities. Next, you will see the difference
    between unidirectional and bidirectional relationships and then implement some
    of these combinations. I will not go through the complete catalogue of combinations
    but just focus on a subset. Explaining all the combinations would be repetitive.
    The important point is that you understand how to map cardinality and direction
    in relationships.


    # Unidirectional and Bidirectional


    From an object-modelling point of view, direction between classes is natural.
    In a unidirectional association, object A points to object B and not the other
    way round; in a bidirectional association, both objects refer to each other. However,
    some work is necessary when mapping a bidirectional relationship to a relational
    database, as illustrated by the following example.


    In a unidirectional relationship, a Customer entity has an attribute of type Address
    (see Figure 9). The relationship is one-way, navigating from one side to the other.
    Customer is said to be the owner of the relationship. In terms of the database,
    this means the CUSTOMER table will have a foreign key (join column) pointing to
    ADDRESS, and, when you own a relationship, you are able to customise the mapping
    of this relationship. For example, if you'
