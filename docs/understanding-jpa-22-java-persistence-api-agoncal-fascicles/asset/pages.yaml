  md: 'Figure 11. A bidirectional association represented with two arrows


    How do you map a pair of unidirectional relationships? Who is the owner of this
    bidirectional relationship? Who owns the mapping information of the join column
    or the join table? Unidirectional relationships have an owning side while bidirectional
    relationships have both an owning and an inverse side, which have to be explicitly
    specified with the mappedBy element of the @OneoneToOne, @OneToMany, and @ManyToOne
    annotations. mappedBy identifies the attribute that owns the relationship and
    is required for bidirectional relationships.


    By way of explanation, let''s compare the Java code (on one side) and the database
    mapping (on the other). As you can see on the left side of Figure 12, both entities
