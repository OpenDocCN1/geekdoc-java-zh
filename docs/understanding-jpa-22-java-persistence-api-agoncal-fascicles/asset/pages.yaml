    \ including the artifact's dependencies in the POM using groupId, artifactID,\
    \ version and scope in a declarative way as shown in Listing 2. If necessary,\
    \ Maven will download them to the local repository from remote repositories. Moreover,\
    \ using the POM descriptors of external artifacts, Maven will also download the\
    \ artifacts they need (so-called \"transitive dependencies\"). Therefore, the\
    \ development team doesn't have to manually add the project dependencies to the\
    \ classpath. Maven automatically adds the necessary libraries.\n\nListing 2. Maven\
    \ Dependencies\n\n```\n<dependencies>\n  <dependency>\n    <groupId>org.eclipse.persistence</groupId>\n\
    \    <artifactId>javax.persistence</artifactId>\n```"
