- pgno: 26
  md: '# The Sample Application


    Throughout the book, you will see snippets of code all belonging to the CD-BookStore
    application. This application is an e-commerce website allowing users to browse
    a catalogue of books and CDs on sale. Using a shopping cart, they can add or remove
    items as they browse the catalogue, and checkout so that they are able to pay
    and obtain a purchase order. The application has external interactions with a
    bank system to validate credit card numbers.


    The actors interacting with the system:


    +   * Employees of the company who need to manage both the catalogue of items
    and the customers'' details. They can also browse the purchase orders.


    +   * Users who are anonymous persons visiting the website and consulting the
    catalogue of books and CDs. If they want to buy an item, they need to create an
    account to become customers.


    +   * Customers who can browse the catalogue, update their account details, and
    buy items online.


    +   * The external bank to which the system delegates credit card validations.


    Figure 1 depicts the use case diagram which describes the system’s actors and
    functionalities.'
