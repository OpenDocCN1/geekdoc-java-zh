- pgno: 34
  md: "# FIRST STEP WITH JPA\n\nIf you are reading this fascicle, it's because you\
    \ are a developer. And like most developers, when you learn a new technology or\
    \ framework, you like to see some code first. So here is the very first step to\
    \ JPA.\n\nListing 1 shows a Java class representing the author of a book. An author\
    \ has a first name, a last name, a biography and an email address. Because it\
    \ is supposed to be persisted into a relational database, it also has an identifier.\n\
    \nListing 1. Java Class with JPA Annotations\n\n```\n@Entity\npublic class Author\
    \ {\n\n    @Id\n    @GeneratedValue\n    private Long id;\n    @Column(nullable\
    \ = false, length = 50)\n    private String firstName;\n    private String lastName;\n\
    \    @Column(length = 2000)\n    private String bio;\n    private String email;\n\
    \n    // Constructors, getters, setters\n}\n```"
  merge: -1
  img_proc: true
- pgno: 35
  md: 'If you look more carefully at Listing 1, you can see a few annotations: @Entity,
    @Id, @GeneratedValue and @Column. What do you think they do? Give me a hint. In
    Listing 2 we give the author a first name and a last name, and after saving the
    author object into the database, we make sure the id is not null. This means that
    the author has been persisted into a relational database, and that something has
    generated a primary key as an identifier.


    # Listing 2. The Author Is Persisted into a Relational Database


    ```

    Author author = new Author().firstName("Adams").lastName("Douglas");

    asertNull(author.getId(), "Id should be null");


    tx.begin();

    em.persist(author);

    tx.commit();


    assertNotNull(author.getId(), "Id should not be null");

    ```


    Look at what happens in Listing 3. This time, we give the author a null first
    name, and when we persist it, at commit time, a RollbackException is thrown because
    the database column doesn''t accept null values.


