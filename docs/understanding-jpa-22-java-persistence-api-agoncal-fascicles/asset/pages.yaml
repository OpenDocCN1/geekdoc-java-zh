  md: '# Binding Parameters


    Up to now, the WHERE clauses shown here have only used fixed values. In an application,
    queries frequently depend on parameters. JPQL supports two types of parameter-binding
    syntax, allowing dynamic changes to the restriction clause of a query: positional
    and named parameters.


    Positional parameters are designated by a question mark (?) followed by an integer
    (e.g. ?1). When the query is executed, the parameter numbers that should be replaced
    need to be specified.


    ```

    SELECT c

    FROM Customer c

    WHERE c.firstName = ?1 AND c.address.country = ?2

    ```


    Named parameters can also be used and are designated by a String identifier that
    is prefixed by the colon (:) symbol. When the query is executed, the parameter
    names that should be replaced need to be specified.


    ```

    SELECT c

    FROM Customer c

    WHERE c.firstName = :fname AND c.address.country = :country

    ```


    In the "Queries" section later in this chapter, you will see how an application
    binds parameters.


    # Subqueries


    A subquery is a SELECT query that is embedded within a conditional expression
    of a WHERE or HAVING clause. The results of'
  merge: -1
