  md: '# A Closer Look at JPA


    Now that you''ve run your first test, let''s have a closer look at Java Persistence
    API. This will give you some terminology that will be used in the chapters that
    follow.


    # JPA Packages


    The JPA APIs are all defined under the main javax.persistence package, either
    at the root, or under other sub-packages. Table 1 lists the main subpackages defined
    in JPA 2.2 (under the root javax.persistence package).


    Table 1. Main javax.persistence Subpackages


    | Subpackage Description |

    |---||

    | root | APIs for managing persistence and object/relational mapping |

    | criteria | Java Persistence Criteria API, allowing writing queries in an object-oriented
    way (see Chapter 6) |

    | metamodel | Java Persistence Metamodel API, bringing type-safety to the queries
    (see Chapter 6) |

    | spi | Set of internal APIs, implemented by the persistence provider |


    # Main JPA APIs


    The class diagram in Figure 3 highlights the main JPA APIs.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '![](img/c29e53007c33cf0fd2f7aed02ac4eb8b_79_0.png)


    Figure 3. Main JPA APIs


    Of course, there are many more APIs in JPA as you will see in the chapters that
    follow. But the main ones are:


    +   - Persistence: This class is the entry point for JPA. It is used to build
    an EntityManagerFactory.

    - EntityManagerFactory: This interface acts as a factory for returning initialised
    EntityManager instances.

    - EntityManager: This is the primary JPA interface used by applications to manage
    persistent objects. The EntityManager also acts as a factory for Query and TypedQuery
    instances.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '+   Entity: Entities are persistent objects annotated with @Entity.


    +   EntityTransaction: This interface allows operations on persistent objects
    to be grouped into units of work that either completely succeed or completely
    fail, leaving the datastore in its original state.


    +   Query, TypedQuery  and StoredProcedureQuery: Set of interfaces allowing the
    querying of persistent objects that meet certain criteria.


    +   CriteriaQuery: API to create queries.


    +   PersistenceException: Thrown by the persistence provider when a problem occurs.


    # Anatomy of an Entity


    As seen in Listing 5, for a class to be an entity it has to be annotated with
    @javax.persistence.Entity, which allows the persistence provider to recognise
    it as a persistent class and not just as a simple POJO. Then, the annotation @javax.persistence.Id
    defines the unique identifier of this object. Because JPA is about mapping objects
    to relational tables, objects need an Id that will be mapped to a primary key.
    An entity can also have business methods and does not need to implement any interface
    or extend any class. In fact, to be an entity, a class must follow these rules.


    +   The entity class must be annotated with @javax.persistence.Entity (or denoted
    in the XML descriptor as an entity).'
  merge: -1
  img_proc: true
- pgno: 81
  md: '+   The @javax.persistenceId annotation must be used to denote at least one
    primary key.


    +   The entity class must have a no-arg constructor that has to be public or protected.
    The entity class may have other constructors as well.


    +   The entity class must be a top-level class. An enum or interface cannot be
    designated as an entity.


    +   The entity class must not be final. No methods or persistent instance variables
    of the entity class may be final.


    +   If an entity instance has to be passed by value as a detached object (e.g.
    through a remote interface), the entity class must implement the Serializable
    interface. But that is not required by JPA.


    # Entity Life Cycle


