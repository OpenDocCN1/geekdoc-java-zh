- pgno: 193
  md: '# MANAGING ENTITIES


    Java Persistence API has two sides. The first is the ability to map objects to
    a relational database. Configuration by exception allows persistence providers
    to do most of the work without much code, but the richness of JPA also allows
    customised mapping from objects to tables using either annotation or XML descriptors.
    From simple mapping (changing the name of a column) to more complex mapping (inheritance),
    JPA offers a wide spectrum of customisations. As a result, you can map almost
    any object model to a legacy database.


    The other aspect of JPA is the ability to query these mapped objects. In JPA,
    the centralised service for manipulating instances of entities is the entity manager.
    It provides an API to create, find, remove, and synchronise objects with the database.
    It also allows the execution of different sorts of JPQL queries, such as dynamic,
    static, or native queries, against entities. Locking mechanisms are also possible
    with the entity manager.


    > The code in this chapter can be found at https://github.com/agoncal/agoncal-fascicle-jpa/tree/2.2/managing'
  merge: -1
  img_proc: true
