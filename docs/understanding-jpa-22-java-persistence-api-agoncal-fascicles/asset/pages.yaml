- pgno: 7
  md: 'But let''s get back to this fascicle.


    The JPA specification defines a vast feature set that makes working with a relational
    database simple and complex at the same time. it only takes a few annotations
    to implement robust and efficient mappings. You can then focus on your business
    code, and the JPA implementation takes care of all the nitty-gritty details.


    But it only works that way if you''re familiar with the general concepts of the
    specification. You need to know how the internal life cycle model works, which
    annotations you need to use and all the defaults that your JPA implementation
    applies.


    Antonio does a great job explaining all of it in this fascicle. He first shows
    you the necessary configuration parameters and mapping annotations that you need
    in order to start implementing your first persistence layer. After that, Antonio
    explains the different query capabilities defined by the JPA specification before
    he dives into its more advanced features, like life cycle events and caching.


    And after you''ve learned about all the features specified by the JPA specification,
    you should pay special attention to Chapter 10. There, Antonio shows you how to
    use your new knowledge to implement and test a small application so that you are
    well prepared to use JPA in your own projects.


    Thorben Janssen


    Independent Consultant and Trainer


    https://thoughts-on-java.org'
