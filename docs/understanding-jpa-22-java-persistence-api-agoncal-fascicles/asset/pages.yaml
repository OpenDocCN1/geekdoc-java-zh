  md: '# Caching


    Most specifications focus heavily on functional requirements, leaving non-functional
    ones like performance, scalability, or clustering as implementation details. Implementations
    have to strictly follow the specification but may also add specific features.
    A perfect example for JPA would be caching which was not mentioned in the specification
    until JPA 2.0.


    The entity manager is seen as a first-level cache used to process data comprehensively
    for the database and to cache short-lived entities. This first-level cache is
    used on a per-transaction basis to reduce the number of SQL queries within a given
    transaction. For example, if an object is modified several times within the same
    transaction, the entity manager will generate only one UPDATE statement at the
    end of the transaction. A first-level cache is not a performance cache.


    Nevertheless, all JPA implementations use a performance cache (a.k.a. a second-level
    cache) to optimise database access, queries, joins, and so on. As seen in Figure
    3, the second-level cache sits between the entity manager and the database to
    reduce database traffic by keeping objects loaded in memory and available to the
    whole application.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '![](img/c29e53007c33cf0fd2f7aed02ac4eb8b_306_0.png)


    Each implementation has its own way of caching objects, either by developing their
    own mechanism or by reusing existing ones (open source or commercial). Caching
    can even be distributed across several nodes - anything is possible when the specification
    ignores a topic. JPA 2.0 acknowledged that a second-level cache was needed and
    has added caching operations to the standard API. The API, shown in Listing 12,
    is very minimalist (because the goal of JPA is not to standardise a fully functional
    cache), but it allows code to query and remove some entities from the second-level
    cache in a standard manner. Like EntityManager, the java.persistence.Cache is
    an interface implemented by the persistence provider caching system.


    Listing 12. Cache API'
