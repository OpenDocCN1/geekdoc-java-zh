- pgno: 333
  md: '# MANDATORY


    The container requires a transaction before invoking the business method but should
    not create a new one. If the client has a transaction


    context, it is propagated; if not, a javax.transaction.TransactionalException
    is thrown.


    # NOT_SUPPORTED


    The transactional method cannot be invoked in a transaction context. If the client
    has no transaction context, nothing happens; if it does, the container suspends
    the client''s transaction, invokes the method, and resumes the transaction when
    the method returns.


    # NEVER


    The transactional method must not be invoked from a transactional client. If the
    client is running within a transaction context, the container throws a javax.transaction.TransactionalException.


    If so you look back at the AddressService in Listing 10, you''ll understand that
    the save() method is transactional. If the caller hasn’t created a transaction,
    then JTA will create one. On the other hand, when the needsATTransaction() method
    is invoked, it must be invoked in a transactional context that had been started
    before. If that''s not the case, a RollbackException is thrown and the transaction
    is rolled back.'
  merge: -1
