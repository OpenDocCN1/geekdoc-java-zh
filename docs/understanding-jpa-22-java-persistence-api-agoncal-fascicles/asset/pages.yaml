  md: 'SUBSTRING, TRIM, LOWER, UPPER, LENGTH, LOCATE), and date-time (CURRENT_DATE,
    CURRENT_TIME, CURRENT_TIMESTAMP) values.


    # From


    The FROM clause of a query defines entities by declaring identification variables.
    An identification variable, or alias, is an identifier that can be used in the
    other clauses (SELECT, WHERE etc.) to identify a specific entity. The syntax of
    the FROM clause consists of an entity and an alias. In the following example,
    Customer is the entity and c identification variable:


    ```

    SELECT c

    FROM Customer c

    ```


    # Where


    The WHERE clause of a query consists of conditional expression used to restrict
    the result of a SELECT, UPDATE, or DELETE statement. The WHERE clause can be a
    simple expression, or a set of conditional expressions used to filter the query.


    The simplest way to restrict the result of a query is to use the attribute of
    an entity. For example, the following query selects all customers named ''Vincent'':


    ```

    SELECT c

    FROM Customer c

    WHERE c.firstName = ''Vincent''

    ```'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'You can further restrict queries by using the logical operators AND and OR.
    The following example uses AND to select all customers named ''Vincent '', living
    in ''France'':


    ```

    SELECT c

    FROM Customer c

    WHERE c.firstName = ''Vincent'' AND c.address.country.code = ''AU''

    ```


    The WHERE clause also uses comparison operators: =, >=, >=, <=, <>, [NOT] BETWEEN,
    [NOT] LIKE, [NOT] IN, IS [NOT] NULL, [NOT] EMPTY, [NOT] MEMBER [OF]. The following
    shows an example using two of these operators:


    ```

    SELECT c

    FROM Customer c

    WHERE c.age > 18


    SELECT c

    FROM Customer c

    WHERE c.age NOT BETWEEN 40 AND 50


    SELECT c

    FROM Customer c

    WHERE c.address.country.code IN (''UK'', ''FR'')

    ```


    The LIKE expression consists of aString and optional escape characters that define
    the match conditions: the underscore (_) for single-character wildcards and the
    percent sign (%) for multi-character wildcards.


    ```

    SELECT c

    FROM Customer c

    WHERE c.email LIKE ''%mail.com''

    ```'
