  md: '# Understanding Object-Relational Mapping


    As we’ve just seen, relational databases store data in tables made of rows and
    columns. Data is identified by primary keys, which are special columns (or a combination
    of columns) designated to uniquely identify each table record. The relationships
    between tables use foreign keys and join tables with integrity constraints.


    All this vocabulary is completely unknown in an object-oriented language such
    as Java. In Java, we manipulate objects that are instances of classes. Objects
    inherit from others, have references to collections of other objects, and sometimes
    point to themselves in a recursive manner. We have concrete classes, abstract
    classes, interfaces, enumerations, annotations, methods, attributes, and so on.


    As seen in Figure 1, the principle of Object-Relational Mapping (ORM) is to bring
    the world of relational databases and objects together. ORMs are external tools
    that give an object-oriented view of relational data, and vice versa.'
