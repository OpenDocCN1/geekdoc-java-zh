  md: 'an extension of Java SE in order to facilitate the development of distributed,
    robust, powerful, and highly available applications.


    Java EE benefits from the dynamism of open source communities as well as the rigour
    of the JCP standardisation process. Today Java EE is a well-documented platform
    with experienced developers, a large community, and many deployed applications
    running on company servers. Java EE is a suite of APIs that can be used to build
    standard component-based multi-tier applications.


    In 2017, with version 8 of the platform, Java EE was donated to the Eclipse Foundation
    and renamed Jakarta EE.[18] Jakarta EE is the name of the platform governed by
    the Jakarta EE Working Group.

    19] The first version is Jakarta EE 8, which is based on the Java EE 8 technologies.
