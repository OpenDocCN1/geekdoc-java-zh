- pgno: 321
  md: '# Bean Validation Integration


    Validating data is a common task that developers have to do and it is spread throughout
    all layers of an application (from client to database). This common practice is
    time-consuming, error prone, and hard to maintain in the long run. In addition,
    some of these constraints are so frequently used that they could be considered
    standard (check for a null value, its size, its range etc.). It would be good
    to be able to centralise these constraints in one place and share them across
    layers. That’s when Bean Validation comes into play.


    Bean Validation is targeted at Java even though some attempts have been made to
    integrate other languages such as DDL or XSD.[1] It allows you to write a constraint
    once and reuse it in different application layers. Bean Validation is layer agnostic,
    meaning that the same constraint can be used from the presentation to the business
    model layer. Bean Validation is available for server-side applications as well
    as rich Java client graphical interfaces (Swing, Android, JavaFX.).


    Bean Validation allows you to apply already-defined common constraints to your
    application, and also to write your own validation rules to validate beans, attributes,
    constructors, method returned types and parameters. The API is very easy to use
    and flexible as it encourages you to define your constraints using annotations
    or XML descriptors.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'If you like the format of this fascicle and are interested in Bean Validation,
    check out the references for my Bean Validation fascicle in Appendix D.


    Bean Validation has several hooks into Java EE. One of them is its integration
    with JPA and the entity life cycle. Entities may include Bean Validation constraints
    and may be automatically validated. In fact, validation is performed automatically
    as JPA delegates validation to the Bean Validation implementation upon the-persist
    and pre-update entity life cycles.


    Listing 1 shows a Book entity with a few Bean Validation constraints (@NotNull,
    @Digits, @Size and @Positive). Bean Validation annotations are quite natural to
    read. What the code in Listing 1 expresses is that "the title of the book cannot
    be null", "the size of an ISBN should be between 8 and 13 characters", or "the
    number of pages should be a positive number". Notice also how we can mix JPA annotations
    (@Entity, @Id and @GeneratedValue) with Bean Validation annotations.


    Listing 1. Book Entity with Bean Validation Constraints


    ```

    @Entity

    public class Book {


    @Id @GeneratedValue

    private Long id;

    @NotNull

    private String title;

    @Digits(integer = 4, fraction = 2)

    private Float price;

    @Size(max = 2000)

    ```'
