- pgno: 240
  md: '# Group By and Having


    The GROUP BY construct enables the aggregation of result values according to a
    set of properties. The entities are divided into groups based on the values of
    the entity field specified in the GROUP BY clause. To group customers by country
    code and count them, use the following query:


    ```

    SELECT c.address.country.code, COUNT(c)

    FROM Customer c

    GROUP BY c.address.country.code

    ```


    GROUP BY defines the grouping expressions (c.address.country.code) over which
    the results will be aggregated and counted (count(c)). Note that expressions that
    appear in the GROUP BY clause must also appear in the SELECT clause.


    The HAVING clause defines an applicable filter after the query results have been
    grouped, similar to a secondary WHERE clause, filtering the result of the GROUP
    BY. So, if we take the previous query and add a HAVING clause, we get the total
    amount of customers in each country other than the UK.


    ```

    SELECT c.address.country.code, COUNT(c)

    FROM Customer c

    GROUP BY c.address.country.code

    HAVING c.address.country.code <> ''UK''

    ```'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'GROUP BY and HAVING can only be used within a SELECT clause (not a DELETE or
    an UPDATE).


    # Bulk Delete


    You know how to remove an entity with the EntityManager.remove() method and query
    a database to retrieve a list of entities that correspond to certain criteria.
    To remove a list of entities, you can execute a query, iterate through it, and
    remove each entity individually. Although this is a valid algorithm, it has an
    impact in terms of performance (too many database calls). There is a better way
    to do it: bulk deletes.


    JPQL performs bulk delete operations across multiple instances of a specific entity
    class. These are used to delete a large number of entities in a single operation.
    Note that entities in the first level cache are not affected by the DELETE statement.
    They will stay in the cache while their database record is deleted.


    The DELETE statement looks like the SELECT statement, as it can have a restricting
    WHERE clause and use parameters. As a result, the number of entity instances affected
    by the operation is returned. The syntax of the DELETE statement is:


    ```

    DELETE FROM <entity name> [[AS] <identification variable>

    [WHERE <where clause>]

    ```


    As an example, to delete all customers younger than 18, you can use a bulk removal
    via a DELETE statement.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '```

    DELETE FROM Customer c

    WHERE c.age < 18

    ```


    # Bulk Update


    Bulk updates of entities are accomplished with the UPDATE statement, setting one
    or more attributes of the entity subject to conditions in the WHERE clause. Like
    the DELETE statement we just saw, entities in the first level cache are not affected
    by a bulk update. They will stay in the cache while their database record is updated.


    The UPDATE statement syntax is:


    ```

    UPDATE <entity name> [[AS] <identification variable>]

    SET <update statement>, <update statement>}*

    WHERE <where clause>

    ```


    Rather than deleting all the young customers, their first name can be changed
    to "too young" with the following statement:


    ```

    UPDATE Customer c

    SET c.firstName = ''TOO YOUNG''

    WHERE c.age < 18

    ```'
