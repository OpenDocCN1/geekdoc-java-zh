  md: '# Embeddables


    In the "Composite Primary Keys" section earlier in the chapter, you saw how a
    class could be embedded and used as a primary key with the @EmbeddedId annotation.
    Embeddables are objects that don''t have a persistent identity on their own; they
    can only be embedded within an owning entity. The owning entity can have embeddables,
    either as attributes or collections. They are stored as an intrinsic part of the
    owning entity and share the same identity. This each attribute of the embedded
    object is mapped to the table of the owning entity. It is a strict ownership relationship
    (a.k.a. composition), so that if the owning entity is removed, the embedded object
    is also removed.


    This composition between two classes uses annotations. The included class uses
    the @Embeddable annotation, whereas the entity that includes the class uses @Embedded.
    Let''s take the example of a customer that has an identifier, a name, an email
    address, and an address. All these attributes could be in a Customer entity (see
    Listing 32), but for object-modelling reasons, they are split into two classes:
    Customer and Address. Because Address has no identity of its own but is merely
    part of the Customer state, it is a good candidate to become an embeddable object
    instead of an entity (see Listing 31).


    Listing 31. The Address Class Is an Embeddable'
  merge: -1
  img_proc: true
