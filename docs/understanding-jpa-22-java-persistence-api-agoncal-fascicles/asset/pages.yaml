    ![](img/c29e53007c33cf0fd2f7aed02ac4eb8b_311_0.png)


    This problem of concurrency, where the "winner" is the last one to commit, is
    not specific to JPA. Databases have had to deal with this problem for a long time
    and found different solutions to isolate one transaction from others. One common
    mechanism that databases use is to lock the row on which the SQL statement is
    executed.


    From JPA 2.1 onwards, we can use two different locking mechanisms (JPA 1.0 only
    had support for optimistic locking).


    +   - Optimistic locking don''t conflict with other transactions, allowing concurrency
    to be as permissive as possible when allowing transactions to execute.


    +   - Pessimistic locking is based on the opposite assumption, so a lock will
    be obtained on the resource before operating on it.


    As an example from everyday life that reinforces these concepts, consider "optimistic
    and pessimistic street crossing." In an area with'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'very light traffic, you might be able to cross the street without checking
    for approaching cars. But not in a busy city centre!


    JPA uses different locking mechanisms at different levels of the API. Both pessimistic
    and optimistic locks can be obtained via the EntityManager.find and EntityManager.refresh
    methods (in addition to the lock method), as well as through JPQL queries, meaning
    locking can be achieved at the EntityManager level and at the Query level with
    the methods in [jpa-listing-managing-1].


    Each of these methods takes a LockModeType as a parameter that can take different
    values (default value is NONE).


    +   - OPTIMISTIC: Uses optimistic locking.

    - OPTIMISTIC_FORCE_INCREMENT: Uses optimistic locking and forces an increment
    to the entity’s version column (see the upcoming "Versioning" section).

    - PESSIMISTIC_READ: Uses pessimistic locking without the need to reread the data
    at the end of the transaction to obtain a lock.

    - PESSIMISTIC_WRITE: Uses pessimistic locking and forces serialisation among transactions
    attempting to update the entity.

    - PESSIMISTIC_FORCE_INCREMENT: Uses pessimistic locking and forces an increment
    to the entity’s version column (see the upcoming "Versioning" section).

    - NONE: Specifies no locking mechanism should be used.'
