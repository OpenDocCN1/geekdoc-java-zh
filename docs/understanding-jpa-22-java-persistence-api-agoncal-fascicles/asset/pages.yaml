- pgno: 374
  md: '# Java 8


    Essential for the development and execution of the examples in the fascicle is
    the Java Development Kit (JDK).[1] The JDK includes several tools such as a compiler
    (javac), a virtual machine, a documentation generator (javadoc), monitoring tools
    (Visual VM) and so on.[[2] The code in this fascicle uses Java 8 (JDK 1.8).


    # Architecture


    One design goal of Java is portability, which means that programs written for
    the Java platform must run similarly on any combination of hardware and operating
    system with adequate run time support. This is achieved by compiling the Java
    language code to an intermediate representation called bytecode, instead of directly
    to a specific machine code. This bytecode is then analysed, interpreted and executed
    on the Java Virtual Machine (JVM).


    The Interpreter is the one interpreting the code. It does quickly, but executes
    slowly. The disadvantage of the interpreter is that, when one method is called
    multiple times, a new interpretation is required every time. That''s when the
    Just In Time (JIT) compiler kicks in. When the JIT finds repeated code, it compiles
    the bytecode and changes it to native code. This native code will then be used
    directly for repeated method calls, which improves the performance of the system.
    This JIT is also called the Java HotSpot (a.k.a. Java HotSpot Performance Engine,
    or HotSpot VM).[3] Then, the Garbage Collector will collect and remove unreferenced
    objects.'
  merge: -1
  img_proc: true
