- pgno: 399
  md: "Depending on the mode you want to use, you need to setup the JDBC driver accordingly.\
    \ In a JPA application you will setup the JDBC driver in the persistence.xml.\
    \ If you use H2 in a pure Java application, load the JDBC driver with Class.forName(\"\
    org.h2.Driver\"). Then, depending on the database that you target, choose the\
    \ appropriate JDBC URL:\n\n+   * Embedded\n  - jdbc:h2:~/cdbookstoreDB 'cdbookstoreDB'\
    \ in the user home directory\n  - jdbc:h2:/data/cdbookstoreDB 'cdbookstoreDB'\
    \ in the directory /data\n  - jdbc:h2:cdbookstoreDB in the current working directory\n\
    * In-Memory\n  - jdbc:h2:mem:cdbookstoreDB multiple connections in one process\n\
    \  - jdbc:h2:mem: unnamed private connection\n* Server Mode\n  - jdbc:h2:tcp://localhost/~/cdbookstoreDB\
    \ user home directory"
