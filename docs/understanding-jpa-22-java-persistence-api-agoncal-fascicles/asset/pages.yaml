- pgno: 18
  md: '# INTRODUCTION


    In the late 90s, I was working on J2EE 1.2: the very first release of the Java
    Enterprise Edition. It was also the time where companies started to realise the
    potential of the Internet for their business. For a few months, I worked for a
    famous English airline company setting up their e-commerce website. Yes, it was
    a time where you would usually buy a flight or train ticket at a travel agency.
    This revolutionary move (buying flights online) came at a technical cost: a cluster
    for static content (HTML, CSS, images), a cluster for the web tier (Servlets and
    JSPs), a cluster for Stateless EJBs, a cluster for Entity Beans, and a cluster
    for the database. And as you can imagine, load balancing, failover and sticky
    sessions for every tier were loaded with application servers. This e-commerce
    website went live... and it worked!


    Then came Struts, Spring and Hibernate. Full J2EE application servers shrank down
    to servlet containers such as Tomcat or Jetty. We could see things moving, such
    as architectures becoming stateless, failover being abandoned, migrations from
    SOAP to REST and mobile devices taking over web crawling. Other things didn''t
    change, like the good old Gang of Four design patterns, architecture design patterns,
    unit testing frameworks and building tools. We reinvented some wheels and gave
    them different names, but we'
  merge: -1
  img_proc: true
