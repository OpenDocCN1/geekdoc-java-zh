- pgno: 164
  md: 'or deferred (lazily), with a resulting impact on performance. Depending on
    your application, certain relationships are accessed more often than others, while
    some relationships are not necessarily required to be fetched all the times. In
    these situations, you can optimise performance by loading data from the database
    when the entity is initially read (eagerly) or when it is accessed (lazily). As
    an example, let''s look at some extreme cases.


    Imagine four entities linked to each other with different cardinalities (one-to-one,
    one-to-many). In the first case (see Figure 18), they all have eager relationships.
    This means that, as soon as you load Class1 (by a find by Id or a query), all
    the dependent objects are automatically loaded in memory. This can have an impact
    on the performance of your system.


    ![](img/c29e53007c33cf0fd2f7aed02ac4eb8b_164_0.png)


    Figure 18. Four entities with eager relationships


    Looking at the opposite scenario, all the relationships use a lazy fetch mode
    (see Figure 19). If you load Class1, nothing else is loaded (except the direct
    attributes of Class1, of course). You need to explicitly access Class2 (e.g. by
    using the getter method) to tell the persistence provider to load the data from
    the database, and so on. If you want to manipulate the entire object graph, you
    need to explicitly call each entity.


    ```

    class1.getClass2()..getClass3()..getClass4()

    ```'
