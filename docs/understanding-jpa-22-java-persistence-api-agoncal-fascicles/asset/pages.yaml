- pgno: 404
  md: '# JPA 2.2


    JPA 2.2 was released in 2017 with Java EE 8 but it was just a maintenance release,
    meaning that it used the same JSR as 2.1: the JSR 338,[11] A maintenance release
    means that a specification doesn''t evolve much, and therefore doesn''t need a
    new JSR. The changes made to JPA 2.2 were mostly to support Java SE 8:


    +   - Added @Repeatable meta-annotation to JPA annotations

    - Added support for CDI injection into AttributeConverter classes.

    - Added support for the mapping of the new java.time types (e.g. LocalDate, LocalTime
    etc.)

    - Added default Stream getResultStream() method to Query and TypedQuery interfaces.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# JPA 2.1


    JPA 2.1 was released in 2013 under the JSR 338 and was part of Java EE 7.[^2]
    This version brought many new features and improvements:


    +   - Schema generation: JPA 2.1 standardised database schema generation by bringing
    a new API and a set of properties (defined in the persistence.xml).


    +   - Converters: These are classes that convert between database and attribute
    representations.


    +   - CDI support: Injection into event listeners became possible.


    +   - Support for stored procedures: JPA 2.1 allowed dynamically-specified and
    named stored procedure queries.


    +   - Bulk update and delete criteria queries: Criteria API only select queries;
    from 2.1 update and delete queries were also specified.


    +   - Downcasting: The new TREAT operator allowed access to the subclass-specific
    state in queries.'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# JPA 2.0


    If JPA 1.0 was a completely new persistence model from its Entity CMP 2.x ancestor,
    JPA 2.0 was a continuation of version 1.0. JPA 2.0 was released in 2009 with Java
    EE 6 under the JSR 317,[3]


    It kept the object-oriented approach with annotation and optional XML mapping
    files. This second version brought new APIs, extended JPQL, and added these new
    functionalities:


    +   - Collections of simple data types (String, Integer etc.) and embeddable objects
    could then be mapped in separate tables. Previously, you could only map collections
    of entities.


    +   - Map support was extended so that maps could have keys and values of basic
    types, or embeddables.


    +   - Maintaining a persistent ordering was then possible with the @OrderColumn
    annotation.


    +   - Orphan removal allowed child objects to be removed from a relationship if
    the parent object is removed.


    +   - Optimistic locking was already supported, but pessimistic locking was finally
    introduced.


    +   - A brand-new Criteria API was introduced to allow queries to be constructed
    in an object-oriented manner rather than using a string-based approach.


    +   - JPQL syntax got richer (e.g. it allowed case expressions).


    +   - Embeddable objects could be nested into other embeddable'
  merge: -1
  img_proc: true
- pgno: 407
  md: 'objects and have relationships to entities.


    +   - The dot (.) navigation syntax was extended to handle embeddables with relationships
    and embeddables of embeddables.


    +   - Support for a new caching API was added.


    +   - Some properties in the persistence.xml file got standardised, increasing
    the portability of your application.'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# JPA 1.0


    Before Java EE 5, the persistent component model was called Entity Bean, or to
    be more precise, Entity Bean CMP (Container-Managed Persistence), and was associated
    with Enterprise JavaBeans (EJBs). This model of persistence lasted from J2EE 1.3
    until J2EE 1.4, but was heavyweight and finally got replaced by JPA 1.0 from Java
    EE 5 on. JPA 1.0 was created in 2006 under the JSR 220.[4]}'
  merge: -1
