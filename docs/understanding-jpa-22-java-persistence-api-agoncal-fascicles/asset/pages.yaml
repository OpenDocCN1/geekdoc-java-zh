  md: '# Type Conversion


    Thanks to configuration by exception we''ve seen that JPA uses default mapping
    rules to map a String to a VARCHAR or a Long to a BIGINT. But what if we want
    to manipulate a Long in Java and store it as a VARCHAR? What if we want to manipulate
    a Date in Java and store it as a BIGINT? Thanks to type conversion, you can convert
    a data type from one format to any other format.


    Listing 24 shows the enum CreditCardType. As we''ve seen before, by default, JPA
    will map the ordinal number of this enum to the database. Another option is to
    map the String representation of this enum using Enumerated(EnumType.STRING).


    Listing 24. CreditCardType Enumeration


    ```

    public enum CreditCardType {


    VISA,

    MASTER_CARD,

    AMERICAN_EXPRESS

    }

    ```


    But if we want to map VISA to a V, MASTER_CARD to an M and AMERICAN_EXPRESS to
    an A? Well, we need to create a converter that transforms the CreditCardType enum
    to a database column of type CHAR and vice-versa. To do so in JPA, we have to
    annotate a class with @Converter and implement the AttributeConverter interface.
    We parametrise the interface with the types of the enum interface and the database
    column. Listing 25 shows the'
