- pgno: 395
  md: '# H2 Database


    H2 is a relational database written in Java.[12] Of small footprint (1MB), H2
    is a fully functional and transactional relational database that can easily be
    embedded in any Java-based solution. H2 provides three different modes:


    +   - Embedded: Refers to H2 being started by a simple single-user Java application.
    With this option, H2 runs in the same JVM as the application. In this fascicle,
    I use this mode during integration testing.

    - In-Memory: Refers to multiple connections in one process but still in memory.

    - Server Mode: Refers to H2 being started as a separate process and providing
    multi-user connectivity. I use this mode throughout the book when running applications
    so I can see the database structure and the data.


    # A Brief History of H2


    The development of H2 started in May 2004 and was first published in December
    2005. It is somewhat related to Hypersonic SQL database.[13] In 2001, the Hypersonic
    SQL project was stopped, and the HSQQLDB Group was formed to continue working
    on the Hypersonic SQL code.[14] The name H2 stands for Hypersonic 2, however H2
    does not share code with Hypersonic SQL or HSQLDB. H2 is built from scratch.'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# Installing H2


    Installing H2 is very easy. In fact, if you only use the embedded mode, you don''t
    even have to install it: just let Maven download the dependency to your classpath
    (com.h2database:h2) and use H2 in memory.


    When using server mode, you can download the binaries for your platform, unzip
    the installation file and setup your PATH variable. [15] If you are on Mac OS
    X and if you have installed Homebrew, then installing H2 is just a matter of a
    single command.[16] Open your terminal and install H2 with the following command:


    ```

    $ brew install h2

    ```


    # Checking for H2 Installation


    Start the H2 server mode just by launching the h2 command.


    ```

    $ h2

    ```


    As seen in Figure 4, as soon as you run h2, a browser page opens with the URL
    http://localhost:8082 displaying the H2 console. This console lets you access
    a relational database using a browser interface. This is very handy for visualising
    the database structure or executing an SQL statement.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '![](img/c29e53007c33cf0fd2f7aed02ac4eb8b_397_0.png)


    Figure 4. The H2 browser console


    # The H2 Console


    Make sure you''ve started the H2 database in server mode, and check the console
    on http://localhost:8082. Then, you can enter any SQL statement to create a database,
    a table, insert data into the table, or query the data. For example Figure 5,
