- pgno: 318
  md: 'OPTIMISTIC_FORCE_INCREMENT (or READ and WRITE, respectively, but these values
    are deprecated). The only difference is that OPTIMISTIC_FORCE_INCREMENT will force
    an update (increment) to the entity''s VERSION column when the transaction is
    committed (even if the entity''s state has not been changed) while OPTIMISTIC
    only checks (and does not increment) the entity version when the transaction is
    committed.


    Applications are strongly encouraged to enable optimistic locking for all entities
    that may be concurrently accessed. Failure to use a locking mechanism may lead
    to an inconsistent entity state, lost updates, and other state irregularities.
    Optimistic locking is a useful performance optimisation that offloads work that
    would otherwise be required of the database and is an alternative to pessimistic
    locking, which requires low-level database locking.


    # Pessimistic Locking


    Pessimistic locking is based on the opposite assumption to optimistic locking,
    because a lock is eagerly obtained on the entity before operating on it. This
    is very resource restrictive and results in significant performance degradation,
    as a database lock is held using SELECT ... FOR UPDATE SQL statement to read/write
    data.


    Databases typically offer a pessimistic locking service that allows the entity
    manager to lock a row in a table to prevent another thread from updating the same
    row. This is an effective mechanism to ensure that two clients do not modify the
    same row at the same time, but it requires expensive, low-level checks inside
    the database.'
