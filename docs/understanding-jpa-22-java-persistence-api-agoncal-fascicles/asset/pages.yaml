  md: '# Queries


    You’ve just seen the JPQL syntax and how to describe statements using different
    clauses (SELECT, FROM, WHERE etc.). But how do you integrate a JPQL statement
    in your application? And what about SQL? Can you still use SQL statements? The
    answer to these questions is that you can use queries. In fact, JPA has five different
    types of queries that can be used in code, each for a different purpose.


    +   - Dynamic queries: This is the simplest form of query, consisting of nothing
    more than a JPQL query string, dynamically specified at runtime.

    - Named queries: Named queries are static and unchangeable JPQL queries.

    - Criteria API: JPA 2.0 introduced the concept of object-oriented query API to
    write type safe JPQL queries.

    - Native queries: This type of query is useful for executing a native SQL statement
    instead of a JPQL statement.

    - Stored procedure queries: JPA 2.1 brought a new API to call stored procedures.


    # Query APIs


    The central point for choosing from these five types of queries is the EntityManager
    interface (see Figure 1), which has several factory methods returning either a
    Query, a TypedQuery, or a'
  merge: -1
