  md: '# Elementary Mapping


    There are significant differences in the way Java handles data compared to the
    way a relational database handles data. In Java, we use classes to describe both
    attributes for holding data and methods to access and manipulate data. Once we
    define a class, we can create as many instances as we need with the new keyword.
    In a relational database, data is stored in non-object structures (columns and
    rows), and dynamic behaviour is stored functionally as table triggers and stored
    procedures that are not bound tightly to the data structures, as they are with
    objects. Sometimes mapping Java objects to the underlying database can be easy,
    and the default rules can be applied. At other times, these rules do not meet
    your needs, and you must customised the mapping. Elementary mapping annotations
    focus on customising the table, the primary key, and the columns, and they let
    you modify certain naming conventions or typing (not-null column, length etc.).


    # Tables


    Rules for configuration-by-exception mapping state that the entity and the table
    name are the same (a Book entity is mapped to a BOOK table, an AncientBook entity
    is mapped to an ANCIENTBOOK table etc.). This might suit you in most cases, but
    you may want to map your data to a different table, or even map a single entity
    to several tables.


    @Table'
