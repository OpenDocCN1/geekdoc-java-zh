  md: '# Inheritance Mapping


    Since their creation, object-oriented languages have used the inheritance paradigm.
    C++ allows multiple inheritance, and Java supports single-class inheritance. In
    object-oriented languages, developers commonly reuse code by inheriting the attributes
    and behaviour of root classes.


    You have just studied relationships, and relationships between entities have a
    very straightforward mapping to a relational database. This is not the case with
    inheritance. Inheritance is a completely unknown concept and not natively implemented
    in a relational world. The concept of inheritance throws in several twists when
    saving objects into a relational database.


    How do you organise a hierarchical model into a flat relational one? JPA has three
    different strategies you can choose from.


    +   * A single-table-per-class hierarchy strategy: The sum of the attributes of
    the entire entity hierarchy is flattened down to a single table (this is the default
    strategy).


    +   * A joined-subclass strategy: In this approach, each entity in the hierarchy,
    concrete or abstract, is mapped to its own dedicated table.


    +   * A table-per-concrete-class strategy: This strategy maps each concrete entity
    hierarchy to its own separate table.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Support for the table-per-concrete-class inheritance mapping strategy is still
    optional in JPA 2.2. Portable applications should avoid using it until officially
    mandated.


    Leveraging the easy use of annotations, JPA delivers declarative support for defining
    and mapping inheritance hierarchies, including entities, abstract entities, mapped
    classes, and transient classes. The @Inheritance annotation is used on the root
    entity to dictate the mapping strategy to itself and the leaf classes. JPA also
    transposes the object notion of overriding to the mapping, which allows root class
    attributes to be overridden by child classes. In Chapter 8 you will also see how
    the access type can be used with inheritance to mix field access and property
    access.


    # Inheritance Strategies


    When an entity hierarchy exists, it always has an entity as its root. The root
    entity class can define the inheritance strategy by using the strategy element
    of@Inheritance to one of the options defined in the javax.persistence.InheritanceType
    enumerated. If it doesn''t, the default single-table-per-class hierarchy strategy
    will be applied. To explore each strategy, I am going to discuss how to map a
    CD and a Book entity, both inheriting from the Item entity (see Figure 20).'
  merge: -1
  img_proc: true
