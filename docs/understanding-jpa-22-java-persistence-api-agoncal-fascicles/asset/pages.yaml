- pgno: 276
  md: '# Callbacks


    The life cycle of an entity falls into four categories: persisting, updating,
    removing, and loading, which correspond to the database operations of inserting,
    updating, deleting, and selecting, respectively. Each life cycle has a "pre" and
    "post" event (except for loading, which only has a "post" event) that can be intercepted
    by the entity manager to invoke a business method. These business methods have
    to be annotated by one of the annotations described in Table 1. These annotations
    may be applied to methods of an entity class, or a callback listener class.


    Table 1. Life Cycle Callback Annotations


    | Annotation | Description |

    | --- | --- |

    | @PrePersist | Marks a method to be invoked before EntityManager.persist() |

    | @PostPersist | Marks a method to be invoked after the entity has been persisted.
    If the entity auto-generates its primary key (with @GeneratedValue), the value
    is available in the method. |

    | @PreUpdate | Marks a method to be invoked before the entity state is updated.
    |

    | @PostUpdate | Marks a method to be invoked after a database update operation
    is performed. |

    | @PreRemove | Marks a method to be invoked before EntityManager.remove() |

    | @PostRemove | Marks a method to be invoked after the entity has been removed.
    |

    | @PostLoad | Marks a method to be invoked after an entity is loaded (with a JPQL)
    |'
