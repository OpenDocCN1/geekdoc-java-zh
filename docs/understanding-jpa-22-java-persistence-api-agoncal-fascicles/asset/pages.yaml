- pgno: 20
  md: '# Where Does This Fascicle Come From?


    Involved in J2EE since 1998, I followed its evolution and joined the Java EE expert
    group from version 6 to version 8. During that time, I wrote a book in French
    called "Java EE 5". The book was published by a French editor and got noticed.
    I was then contacted by an American editor to work on an English version. I liked
    the challenge. So, I changed the structure of the book, updated it, translated
    it, and I ended up with a "Beginning Java EE 6". A few years later, Java EE 7
    was released, so I updated my book, added a few extra chapters, and ended up with
    a "Beginning Java EE 7" that was 500 pages long.[1]. This process of writing got
    a bit painful (some text editors shouldn''t be used to write books), inflexible
    (it''s hard to update a paper frequently) and I also had some arguments with my
    editor.[2]


    Parallel to that, the history of Java EE 8 was also somewhat painful and long.
    I was still part of the Expert Group, but nobody really knew why the experts''
    mailing list was so quiet. No real exchange, real vision, no real challenges.
    That''s when I decided not to waste my time working on a Java EE 8 book. But the
    community said otherwise. I started receiving emails about updating my book. I
    used to always meet someone at a conference going "Hey, Antonio, when is your
    next book coming out?" My answer was "No way!"


    I decided to take stock. What was holding me back from writing? Clearly it was
    my editor and Java EE 8. So, I decided to get rid of both. I extracted the chapters
    I wanted from my Java EE 7 book and'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'updated them. That''s where the idea of writing "fascicles", instead of an
    entire book, came from. Then, I looked at self-publishing, and here I am at Amazon
