    Executing these queries will return either a single value or a collection of zero
    or more entities (or attributes) including duplicates. To remove the duplicates,
    the DISTINCT operator must be used. So, the query below returns all the customer
    first names without any duplicate.


    ```

    SELECT DISTINCT c.firstName

    FROM Customer c

    ```


    The result of a query may be the result of an aggregate function applied to a
    path expression. The following aggregate functions can be used in the SELECT clause:
    AVG, COUNT, MAX, MIN, SUM. The results may be grouped in the GROUP BY clause and
    filtered using the HAVING clause.


    ```

    SELECT COUNT(c)

    FROM Customer c

    ```


    Scalar expressions also can be used in the SELECT clause of a query as well as
    in the WHERE and HAVING clauses. These expressions can be used on numeric (ABS,
    SQRT, MOD, SIZE, INDEX), String (CONCAT,'
