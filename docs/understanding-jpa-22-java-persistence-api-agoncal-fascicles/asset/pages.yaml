    \n# Managing Artifacts\n\nMaven goes beyond building artifacts; it also offers\
    \ a genuine approach to archive and share these artifacts. Maven uses a local\
    \ repository on your hard drive (by default in ~/.m2/repository) where it stores\
    \ all the artifacts that the project's descriptor references. The local repository\
