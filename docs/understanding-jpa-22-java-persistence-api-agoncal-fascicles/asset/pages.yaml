    mapping values related to the table. For example, you can specify the name of
    the table in which the data will be stored, the catalogue, and the database schema.
    You can also define unique constraints to the table using @UniqueConstraint annotation
    in conjunction with @Table. If the @Table annotation is omitted, the name of the
    table will be the name of the entity. If you want to change the name to T_BOOK
    instead of BOOK, you would do as shown in Listing 1.


