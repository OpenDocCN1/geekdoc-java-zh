    the Java keyword new) and sets some values to its attributes. Up to that point,
    there is nothing special here, just pure Java code. But things change when the
    entity manager comes into play. The entity manager is the central piece of JPA
    in that it is able to create a transaction and persist the book object using the
    EntityManager.persist() method. Once the transaction is committed, the EntityManager
    is then used to create and invoke two named queries to return a book ''H2G2''
    (using the findBookH2G2 named query defined in Book on Listing 1) and the list
    of all books (findAllBooks).


