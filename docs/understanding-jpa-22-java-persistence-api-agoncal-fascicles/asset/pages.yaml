- pgno: 230
  md: '# Java Persistence Query Language


    You just saw how to manipulate entities individually with the EntityManager API.
    You know how to find an entity by Id, remove it, update its attributes, and so
    on. But finding an entity by Id is quite limiting, as you retrieve a single entity
    using its unique identifier. In practice, you may need to retrieve an entity by
    criteria other than the Id (by name, ISBN etc.) or retrieve a set of entities
    based on different criteria (e.g all customers living in the United States). This
    possibility is inherent to relational databases, and JPA has a language that allows
    this interaction: Java Persistence Query Language (JPQL).


    JPQL is used to define searches for persistent entities independent of the underlying
    database. JPQL is a query language that takes its roots in the syntax of SQL,
    which is the standard language for database interrogation. But the main difference
    is that, in SQL, the results obtained are in the form of rows and columns (tables),
    whereas JPQL results in an entity or a collection of entities. JPQL syntax is
    object oriented and therefore more easily understood by developers whose experience
    is familiar to object-oriented languages. Developers manage their entity domain
    model, not a table structure, by using the dot notation (e.g myClass.myAttribute).


    Under the hood, JPQL uses the mechanism of mapping in order to transform a JPQL
    query into language comprehensible by an SQL database. The query is executed on
    the underlying database with'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'SQL and JDBC calls, and then entity instances have their attributes set and
    are returned to the application - all in a very simple and powerful manner, using
    a rich query syntax.


    The simplest JPQL query selects all the instances of a single entity.


    ```

    SELECT b

    FROM Book b

    ```


    If you know SQL, this should look familiar to you. Instead of selecting from a
    table, JPQL selects entities, here Book. The FROM clause is also used to give
    an alias to the entity:b is an alias for Book. The SELECT clause of the query
    indicates that the result type of the query is the list of b entity (the Book).
    Executing this statement will result in a list of zero or more b (Book instances).


    To restrict the result you just add a search criteria using the WHERE clause as
    follows:


    ```

    SELECT b

    FROM Book b

    WHERE b.title = ''H2G2''

    ```


    The alias is used to navigate across entity attributes through the dot operator.
    Since the Book entity has a persistent attribute named title of type String, b.title
    refers to the title attribute of the Book entity. Executing this statement will
    result in a list of zero or more Book instances that have a title equal to ''H2G2''.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'The simplest select query consists of two mandatory parts: the SELECT and the
    FROM clause. SELECT defines the format of the query results. The FROM clause defines
    the entity or entities from which the results will be obtained, and the optional
    WHERE, ORDER BY, GROUP BY, and HAVING clauses can be used to restrict or order
    the result of a query. Listing 1 defines a simplified syntax of a JPQL


    Listing 1. Simplified JPQL Statement Syntax


    ```

    SELECT <select clause>

    FROM <from clause>

    [WHERE <where clause>]

    [ORDER BY <order by clause>]

    [GROUP BY <group clause>]

    [HAVING <having clause>]

    ```


    Listing 1 defines a SELECT statement but DELETE and UPDATE statements can also
    be used to perform delete and update operations across multiple instances of a
    specific entity class.


    # Select


    The SELECT clause follows the path expressions syntax and results in one of the
    following forms: an entity, an entity attribute, a constructor expression, an
    aggregate function, or some sequence of these path expressions. These are the
    building blocks of queries and are used to navigate on entity attributes or across
    entity relationships (or a collection of entities) via the dot (.) navigation,
    using the following syntax:'
  merge: -1
  img_proc: true
- pgno: 233
  md: '```

    SELECT [DISTINCT] <expression> [[AS] <identification variable>

    expression ::= { NEW | TREAT | AVG | MAX | MIN | SUM | COUNT }

    ```


    A simple SELECT returns an entity. For example, if a Customer entity has an alias
    called c, SELECT c will return an entity or a list of entities.


    ```

    SELECT c

    FROM Customer AS c

    ```


    The keyword AS being optional, the same query can be simplified as follows:


    ```

    SELECT c

    FROM Customer c

    ```


    But a SELECT clause can also return attributes. If the Customer entity has a first
    name, SELECT c.firstName will return a String or a collection of Strings with
    the first names.


    ```

    SELECT c.firstName

    FROM Customer c

    ```


    To retrieve the first name and the last name of a customer, you create a list
    containing the following two attributes:


    ```

    SELECT c.firstName, c.lastName

    FROM Customer c

    ```


    From JPA 2.0 onwards, an attribute can be retrieved depending on a condition (using
    a CASE WHEN...THEN...ELSE...END expression). For'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'example, instead of retrieving the price of a book, a statement can return
    a computation of the price (e.g. 50% discount) depending on the publisher (e.g.
    50% discount on Apress books, 20% discount for all other books).


    ```

    SELECT CASE b.editor WHEN ''Apress''

    THEN b.price * 0.5

    ELSE b.price * 0.8

    END FROM Book b

    ```


    If a Customer entity has a one-to-one relationship with Address, c.address refers
    to the address of the customer, and the result of the following query will return
    not a list of customers but a list of addresses:


    ```

    SELECT c.address

    FROM Customer c

    ```


    Navigation expressions can be chained together to traverse complex entity graphs.
    Using this technique, path expressions such as c.address.country.code can be constructed,
    referring to the country code of the customer''s.


    ```

    SELECT c.address.country.code

    FROM Customer c

    ```


    A constructor may be used in the SELECT expression to return an instance of a
    Java class initial with the result of the query. The class doesn''t have to be
    an entity, but the constructor must be fully qualified and match the attributes.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '```

    SELECT NEW

    org.agoncal.fascicle.jpa.querying.CustomerDTO(c.firstName,

    lastName, c.address.country.code)

    FROM Customer c

    ```


    The result of this query is a list of CustomerDTO objects that have been instantiated
    with the new operator and initialised with the first name, last name, and country
