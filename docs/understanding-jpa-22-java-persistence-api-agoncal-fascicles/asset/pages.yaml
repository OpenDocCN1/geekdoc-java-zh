    The principle of Object-Relational Mapping (ORM) is to delegate the task of creating
    a correspondence between objects and tables, to external tools or frameworks (in
    our case, JPA). The world of classes, objects, and attributes can then be mapped
    to relational databases which are made up of tables containing rows and columns.
    Mapping gives an object-oriented view to developers who can transparently use
    entities instead of tables. And how does JPA map objects to a database? As seen
    in Figure 1, this is done through metadata.


    Associated with every entity are metadata that describe the mapping. The metadata
    enable the persistence provider to recognise an entity and to interpret the mapping.
    The metadata can be written in two different formats:'
