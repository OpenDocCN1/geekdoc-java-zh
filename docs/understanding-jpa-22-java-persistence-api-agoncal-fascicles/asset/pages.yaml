  md: 'attributes. But what if you only need to store a collection of Java types such
    as Strings or Integers? Since JPA 2.0, you can easily do this without having to
    go through the trouble of creating a separate class by using the @ElementCollection
    and @CollectionTable annotations.


    We use the @ElementCollection annotation to indicate that an attribute of type
    java.util.Collection contains a collection of instances of basic types (i.e. nonidentities)
    or embeddables (more on that in the "Embeddables" section). In fact, this attribute
    can be of the following types:


    +   - java.util.Collection: Generic root interface in the collection hierarchy.

    - java.util.Set: Collection that prevents the insertion of duplicate elements.

    - java.util.List: Collection used when the elements need to be retrieved in some
    user-defined order.


    In addition, the @CollectionTable annotation allows you to customise details of
    the collection table (i.e. the table that will join the entity table with the
    basic types table) such as its name. If this annotation is missing, the table
    name will be the concatenation of the name of the containing entity and the name
    of the collection attribute, separated by an underscore.


