  md: "Of course, an entity can also have an entity as an attribute or a collection\
    \ of entities. But this requires introducing relationships between entities which\
    \ will be covered in the \"Relationship Mapping\" section.\n\nAs you've seen,\
    \ with configuration by exception, attributes are mapped using default mapping\
    \ rules. However, sometimes you need to customise parts of this mapping. That's\
    \ where JPA annotations (or their XML equivalent) come into play.\n\n# @Basic\n\
    \nThe optional @javax.persistence.Basic annotation (see Listing 10) is the simplest\
    \ type of mapping an attribute to a database column.\n\nListing 10. @Basic Annotation\
    \ Elements\n\n```\n@Target({METHOD, FIELD})\n@Retention(RUNTIME)\npublic @interface\
    \ Basic {\n\n    FetchType fetch() default EAGER;\n    boolean optional() default\
    \ true;\n}\n```\n\nThis annotation has two parameters: optional and fetch. The\
    \ optional element gives a hint as to whether the attribute may be null. It is\
    \ disregarded for primitive types. The fetch element can take two values: LAZY\
    \ or EAGER. It gives a hint to the persistence provider runtime that data should\
    \ be fetched lazily (only when the application asks for the property) or eagerly\
    \ (when the entity is initially loaded by the provider)."
  merge: -1
  img_proc: true
- pgno: 111
  md: "A hint specifies a preference on the part of the application. While a hint\
    \ defined by be observed by the provider if possible, a hint may or may not always\
    \ be observed. A portable application must not depend on the observance of a hint.\n\
    \nFor example, take the Track entity shown in Listing 11. A CD album is made up\
    \ of several tracks, and each track has a title, a description, and a WAV file\
    \ of a certain duration that you can listen to. The WAV file is a BLOB (Binary\
    \ Large Object) that can be a few megabytes long. When you access the Track entity,\
    \ you don’t want to eagerly load the WAV file; you can annotate the attribute\
    \ with @Basic(fetch = FetchType.LAZY) so the data will be retrieved from the database\
    \ lazily (only when you access the wav attribute using its getter, for example).\n\
    \nListing 11. The Track Entity with Lazy Loading on the WAV Attribute\n\n```\n\
    @Entity\npublic class Track {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.AUTO)\n\
    \    private Long id;\n    private String title;\n    private Float duration;\n\
    \    @Basic(fetch = FetchType.LAZY)\n    @Lob\n    private byte[] wav;\n    private\
    \ String description;\n\n    // Constructors, getters, setters\n}\n```"
