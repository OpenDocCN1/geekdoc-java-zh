  md: 'In 2017, most Java EE specifications were moved from the JCP to the Eclipse
    Foundation (including the JPA specification).[17] The Eclipse Foundation is an
    independent, not-for-profit corporation that acts as a steward of the Eclipse
    open source software development community. The Foundation focuses on key services
    such as intellectual property management, ecosystem development, development process,
    and IT infrastructure. It was originally created by IBM in 2001 and is now supported
    by a consortium of several software vendors.


    # Java EE and Jakarta EE


    Even if Java Persistence API does not rely on Java EE, it is strongly correlated
    with this platform. So, it is worth mentioning Java EE in JPA fascicle.


    Java EE, or Java Enterprise Edition, can be seen as an extension of the Java Standard
    Edition (Java SE). Usually, when you want to handle collections of objects, you
    don''t start by developing your own list. Instead, you use the collection API.
    Similarly, if you need a simple web application or a transactional, secure, interoperable
    and distributed application, there is no need to develop all the low-level APIs.
    Rather, you use the enterprise edition of Java. Just as Java Standard Edition
    provides an API to handle collections, Java EE provides a standard way to handle
    transactions with Java Transaction API (JTA), messaging with Java Message Service
    (JMS), or persistence with Java Persistence API (JPA). Java EE is a set of specifications
    intended for enterprise applications. It can be seen as'
