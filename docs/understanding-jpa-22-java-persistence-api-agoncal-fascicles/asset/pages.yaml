  md: 'To describe the fact that a book has a set of chapters, we could have used
    different strategies. Chapter could have been an entity, but it makes more sense
    for it to be an embeddable. An embeddable does not have an identity on its own.
    Instead, its life cycle is closely related to its embedded entity: if we remove
    a book, all the chapters are removed. And because a book has a set of ordered
    chapters, the relationship is done via a Map instead of a List or a Set. This
    way we can give a position to a chapter (e.g. the first chapter, the second chapter
    etc.). Notice the @CollectionTable annotation that indicates the name of the collection
    table, as well as @JoinColumn which redefines the name of the join column.


    A book can be written by one or many authors. And an author can write one or many
    books. The bi-directional relationship between the Book entity and the Author
    entity is a @ManyToMany annotation is used to specify the name of the table joining
    Book and Author.


