- pgno: 400
  md: '# Git


    Git is a free and open source distributed version control system designed for
    tracking changes in computer files and coordinating work on those files among
    multiple people.[17] It is primarily used for source code management in software
    development, but it can be used to keep track of changes in any set of files.
    Git was created by Linus Torvalds in 2005 for the development of the Linux kernel,
    with other kernel developers contributing to its initial development.


    Git is not really needed to run the samples in this fascicle. Even if the code
    is hosted on a public Git repository (https://github.com/agoncal/agoncal-fascicle-jpa/tree/2.2),
    you can either download the code as a zip file, or clone the repository. Only
    if you clone the repository you will need to have Git installed.


    # A Brief History of Git


    Git development began in April 2005, after many developers of the Linux kernel
    gave up access to BitKeeper, a proprietary source-control management (SCM). Linus
    Torvalds wanted a distributed system that he could use, like BitKeeper, but none
    of the available free systems met his needs. So, Linus started the development
    of Git on 3rd April 2005, announced the project on 6th April and the first merge
    of multiple branches took place on 18th April. The nascent Git was benchmarked,
    recording patches to the Linux kernel tree at the rate of 6.7 patches per second.[18]'
  merge: -1
  img_proc: true
- pgno: 401
  md: '# Installing Git


    If you are on Mac OS X and if you have installed Homebrew, then installing Git
    is just a matter of a single command.[19] Open your terminal and install Git with
    the following command:


    ```

    $ brew install git

    ```


    # Checking for Git Installation


    Once installed, check for Git by running git --version in the terminal. It should
    display the git version:


    ```

    $ git --version

    git version 2.20.1

    ```


    # Cloning Repository


    Once Git is installed, you can clone the code of the repository with a git clone
    on https://github.com/agoncal/agoncal-fascicle-jpa.git.'
