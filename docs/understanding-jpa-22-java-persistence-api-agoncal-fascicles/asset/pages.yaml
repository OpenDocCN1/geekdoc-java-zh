  md: 'context. Only entities that are contained in the persistence context are managed
    by the entity manager, meaning that changes will be reflected in the database.


    The entity manager updates or consults the persistence context whenever a method
    of the javax.persistence.EntityManager interface is called. For example, when
    a persist() method is called, the entity passed as an argument be added to the
    persistence context if it doesn''t already exist. Similarly, when an entity is
    found by its primary key, the entity manager first checks whether the requested
    entity is already present in the persistence context. The persistence context
    can be seen as a first-level cache. It''s a short-lived space where the entity
    manager stores entities before flushing the content to the database. By default,
    objects just live in the persistent context for the duration of the transaction.


    To summarise, let''s look at Figure 2 where two users need to access entities
    whose data is stored in the database. Each user has his persistence context that
    lasts for the duration of their own transaction. User 1 gets the Book entities
    with IDs equal to 12 and 56 from the database, so both books get stored in their
    persistence context. User 2 gets the entities 12 and 34. As you can see, both
    entities with ID = 12 are stored in each user''s persistence context. While the
    transaction runs, the persistence context acts like a first-level cache, storing
    the entities that can be managed by the EntityManager. Once the transaction ends,
    the persistence context ends and the entities are cleared.'
