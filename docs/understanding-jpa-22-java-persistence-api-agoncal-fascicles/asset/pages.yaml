    Concurrency and locking are key motivators for versioning.


    # Versioning


    Most software programs use versioning. In fact, even Java specifications use versioning:
    Java SE 7.0, Java SE 8.0, JPA 2.0, JPA 2.1, JAX-RS 1.0, and so on. When a new
    version of the JAX-RS specification is released, its version number is increased,
    and you need to upgrade to JAX-RS. JPA uses this exact mechanism when you need
    to version entities. So, when you persist an entity for the first time in the
    database, it will get the version number 1. Later, if you update an attribute
    and commit this change to the database, the entity version will get the number
    2, and so on. This versioning will evolve each time a change is made to the entity.'
