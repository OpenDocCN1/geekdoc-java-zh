  md: '# Mapping Annotations on Fields and Properties


    Up to now, I have shown you annotated classes (@Entity or @Table) and attributes
    (@Basic, @Column, @Temporal etc.), but the annotations applied on an attribute
    (or field) can also be set on the corresponding getter method (or property). For
    example, the annotation @Id can be set on the id attribute or on the getId() method.
    As this is largely a matter of personal preference, I tend to use property access
    (annotate the getters), as I find the code more readable. This allows me to quickly
    read the attributes of an entity without drowning in annotations. In this fascicle,
    for easy readability, I''ve decided to annotate the attributes. But in some cases
    (e.g. with inheritance), it is not simply a matter of personal taste, as it can
    have an impact upon your mapping.


