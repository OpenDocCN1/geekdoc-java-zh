- pgno: 94
  md: '# Default Mapping


    Default mapping rules are an important part of the principle known as configuration
    by exception. Java EE 5 introduced this idea (sometimes referred to as programming
    by exception or convention over configuration) and it is still heavily used today,
    especially in JPA. This means, unless specified differently, the provider should
    apply the default rules. In other words, having to supply a configuration is the
    exception to the rule. This allows you to write the minimum amount of code to
    get your application running, relying on the provider''s defaults. If you don''t
    want the provider to apply the default rules, you can customise the mapping to
    your own using metadata.


    This means that, for all the other attributes, the following default mapping rules
    will apply:


    +   The entity name is mapped to a relational table name (e.g. the Book entity
    is mapped to a BOOK table). If you want to map it to another table, you will need
    to use the @Table annotation, as you''ll see later in the "Elementary Mapping"
    section.


    +   Attribute names are mapped to a column name (e.g. the id attribute, or the
    getId() method, is mapped to an ID column). If you want to change this default
    mapping, you will need to use the @Column annotation.


    +   JDBC rules apply for mapping Java primitives to relational data types. A String
    will be mapped to VARCHAR, a Long to a BIGINT,'
  merge: -1
