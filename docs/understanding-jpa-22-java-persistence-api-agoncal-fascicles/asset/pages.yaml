  md: '# Concurrency


    JPA can be used to update persistent data, and JPQL can be used to retrieve data
    following certain criteria. All this can happen within an application running
    in a cluster with multiple nodes, multiple threads, and one single database, so
    it is quite common for tables and rows to be accessed concurrently. When this
    is the case, synchronisation must be controlled by the application using a locking
    mechanism. Whether the application is simple or complex, chances are that you
    will make use of locking somewhere in your code.


    To illustrate the problem of concurrent database access, let''s see an example
    of an application with two concurrent threads, shown in Figure 4. One thread finds
    a book by its identifier and raises the price of the book by $2. The other does
    the same thing but raises the price by $5. If you execute these two threads concurrently
    in separate transactions and manipulate the same book, you can''t predict the
    final price of the book. In this example, the initial price of the book is $10.
    Depending on which transaction finishes last, the price can be $12 or $15.'
  merge: -1
  img_proc: true
