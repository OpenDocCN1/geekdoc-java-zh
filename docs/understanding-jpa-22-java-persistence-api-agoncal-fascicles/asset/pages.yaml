  md: '# INTEGRATING JPA WITH OTHER TECHNOLOGIES


    As you''ve seen in the previous chapters, Java Persistence API can be used as
    a stand-alone technology. Just embed the required dependencies in your code, add
    mapping annotations on your entities, and query them with the javax.persistence.EntityManagerFactory
    and javax.persistence.EntityManager APIs. But one beauty of JPA is its flexibility
    and adaptability: it integrates well with other technologies such as Bean Validation,
    CDI, JTA or Spring, for example.


    > The code in this chapter can be found at https://github.com/agoncal/agoncal-fascicle-jpa/tree/2.2/integrating'
