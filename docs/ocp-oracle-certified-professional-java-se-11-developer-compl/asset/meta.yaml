- - '##'
  - 20. B, C. 只有受检异常需要被处理或声明，因此选项 B 正确，选项 F 错误。`Error` 旨在由 JVM 抛出且永远不会被程序员捕获，因此选项
    C 正确，而选项 A、D 和 E 错误。虽然程序员可以抛出或捕获 `Error`，但这是一种非常糟糕的做法。更多信息，请参阅第 10 章。
- - '##'
  - 21. B, C, F. 首先，`null` 和 `nonstatic` 不是有效的方法修饰符，因此选项 A 和 D 错误。选项 B 和 F 是正确的，因为抽象方法不能被标记为
    `private` 或 `static`，否则它们将无法被重写。选项 C 也是正确的，因为你不能在同一个方法上声明两个访问修饰符。最后，选项 E 和 G 是两组可以在方法声明中一起使用的有效修饰符。使用
    `private` 配合 `final` 是允许的，尽管它是冗余的。更多信息，请参阅第 9 章。
- - '###'
  - 2. A. 代码编译并运行没有问题，因此选项 E 和 F 错误。首先，`path1` 在移除路径符号并应用 `normalize()` 方法后简化为 `/bats/sleep.txt`。使用
    `/bats/day` 当前目录的 `path2` 变量被分配了路径值 `/bats/sleep.txt`。`toRealPath()` 方法也会移除路径符号。由于文件
    `Path` 对象代表文件系统中的相同路径，它们的 `equals()` 和 `isSameFile()` 均会返回 `true`，因此选项 A 正确。更多信息，请参阅第
    20 章。
- - '###'
  - 3. C. 只有命名模块才需要 `module-info` 文件，排除了选项 A、B、E 和 F。未命名模块无法被任何其他类型的模块读取，排除了选项 D。自动模块始终向其他模块导出所有包，因此答案是选项
    C。更多信息，请参阅第 17 章。
- - '###'
  - 4. D, F, G. 第 9 行无法编译，因为使用 `@CleaningProgram` 时缺少元素名称 `mode`。只有当注解类型声明中的元素被命名为
    `value()` 时，才能省略元素名称。第 11 行无法编译，因为注解元素必须是基本类型、`String`、`Class`、枚举、另一个注解或这些类型的数组。第
    12 行无法编译，因为元素使用关键字 `default` 来分配默认值，而不是使用等号（`=`）。更多信息，请参阅第 13 章。
- - '###'
  - 8. B, D. 如果控制台不可，`System.console()` 返回 `null`，因此选项 D 正确。相反，如果控制台可用，它将读取输入并打印结果，因此选项
    B 正确。更多信息，请参阅第 19 章。
- - '##'
  - 13. D, E. 第 10 行包含一个未处理的检查异常 `IOException`，而第 11 行包含一个未处理的检查异常 `FileNotFoundException`，因此选项
    D 正确。第 12 行无法编译，因为 `is.readObject()` 必须转换为 `Bird` 对象才能赋值给 `b`。它还无法编译，因为它包含了两个未处理的检查异常
    `IOException` 和 `ClassNotFoundException`，因此选项 E 正确。如果在第 13 行添加转换操作并更新第 8 行的 `main()`
    方法以声明各种方法。
- - '##'
  - 18. A, B, C, E. 代码在没有任何更改的情况下打印 `100`，但由于 `data` 类不是线程安全的。
- - '##'
  - 19. E. `@Deprecated` 注解表示某个方法在未来版本中可能会移除。
