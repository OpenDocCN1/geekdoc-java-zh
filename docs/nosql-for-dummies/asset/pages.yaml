  md: '# 284 Part V: Graph and Triple Stores


    In this chapter, I also extract facts from existing data, use additional facts
    from third-party sources, and use semantic data to store an audit trail of changes
    to records over time.


    # Extracting Semantic Facts


    Semantic facts are properly called assertions. For most cases


    All database software can easily handle structured information like these facts.
    This data is effectively a list of fields and their values, as I discussed in
    Chapter 19. Unstructured text, though, is very difficult for computers, and indeed
    humans, to deal with.


    Free indexing and proximity searches can help you to some extent. For example,
    a proximity search displays documents in matching terms occur, and you can infer
    a relationship between text within a document by proximity-search limits like
    NEAR queries (for example, “Adam NEAR/3 age” which means searching for where “Adam”
    is mentioned within three words of “Age”). To do anything useful, though, you
    need a more comprehensive approach.


    In this section, I describe how to analyze the text in unstructured content in
    order to extract semantic facts, so you can provide a rich query using using semantic
    technology over information extracted from text documents.


    # Extracting context with subjects


    Natural Language Processing (NLP) is the process of looking at words, phrases,
    and identifying not only things (people, places, organizations, and so on) but
    also their relationships.


    You can store this information as subjects, properties, and relationships — as
    you do in triple stores. Several pieces of software are available to help you
    do so. Here are the most popular ones:


    +   - OpenCalais: An open-source semantic extraction tool

    - Smartlogic Semaphore Server: A commercial entity extraction and enrichment tool
    that can also generate triples

    - TEMIS Luxid: Another common commercial entity extraction and enrichment tool'
  merge: -1
