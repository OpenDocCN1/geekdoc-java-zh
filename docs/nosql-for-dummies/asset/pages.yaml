    it, supports geospatial search, you can use the longitude and latitude data. You
    can also provide a full address summary or link to a Google map using longitude
    and latitude and the zip code.


    The process of adding more information to original content than just tagging it
    is called entity enrichment. It''s very useful for enhancing ordinary text data,
    and for allowing the search of that data.


    # Managing Changing Data Structures


    Each organization has many systems, each with its own data. These information
    silos are typically split by organization area. Examples include HR, customer
    sales, product quantities available, and complaints. Each of these systems is
    independent, with their application managing the data.'
