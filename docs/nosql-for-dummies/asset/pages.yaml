  md: '# How search technology gives a better column store


    Applying search technology to document stores for analytical operations is one
    example of how a hybrid approach provides additional benefits over just IT simplification.


    A column store database performs rapid aggregate calculations, and it returns
    sets of atomic data (column families) of a whole row (record). Using column stores
    requires transforming data into a row and column structure, and supporting multiple
    instances of data within some column families (avoiding cross table joins like
    in RDBMS).


    You have to do some ETL (Extract, Transform, and Load data) in order to store
    data in a way that makes it work better for the type of queries and analysis you
    do over.


    When Google approached the problem of indexing the web, what they didn''t do was
    to let the administrators of every website know they had to adopt a single structure.
    Instead, Google stored what was there, and indexed it for retrieval via search.


    By applying the same search technology to documents, hybrid NoSQL databases provide
    an in-memory cached set of ordered column values that lend themselves not only
    to fast search, range queries and sorting, but also to high-speed analytical operations.


    Because document NoSQL databases with search update their indexes during the transaction
    that updates a document, these indexes are also updated in real-time, which is
    great for any analytics platform.


    When looking at column stores for analytical operations, don''t discount hybrid
    document and search NoSQL databases, especially if the source data is already
    in XML, JSON, or other document structures.


    Document stores that also support comprehensive search features tend to provide
    a set of analytical functions. Customers, being customers, always ask to do more
    with the same feature!


    All common aggregation algorithms are present: mean, mode, median, standard deviation,
    and more — plus support for user-defined aggregate functions written in fast C++
    that work next to the data, processing the data throughout the cluster.'
