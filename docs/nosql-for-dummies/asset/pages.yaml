  md: '# Chapter 27: Types of Search Engines


    MarkLogic Server is built with data integrity and consistency foremost in its
    design, while also providing for clusters of hundreds of servers in a highly available
    cluster.


    In this section, I discuss MarkLogic Server’s approach to search indexing and
    query.


    # Universal indexing


    A useful feature to enable search to be used instantly in MarkLogic Server is
    the universal index. When a document is added to MarkLogic, certain information
    is automatically indexed without special configuration being required. This indexed
    information is


    +   * All elements and properties within the document

    * Parent-child relationships of elements within elements

    * Exact values of each element and attribute

    * Words, term searches, and phrases

    * Security permissions on the document

    * All associated properties, including collections and creation and update times,
    which are stored in an XML document


    The universal index also allows (XML or JSON) content to be added to the database
    and made immediately available for search. This is particularly useful in situations
    where you’re loading an unknown set of content and need to browse before adding
    specialized indexes.


    MarkLogic Server also includes support for text and metadata extraction for more
    than 200 binary file types, including common office document formats, email, image
    and video metadata.


    # Universal range indexes


    After you load your data and browse it via the universal index, you can start
    adding data-aware indexes, which are often referred to as secondary indexes in
    NoSQL.


    Typically, range indexes are set up on numeric and data types to provide support
    for range queries. A range query includes one or more less than and greater than
    operations.'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# 346 Part VI: Search Engines


    You set up range indices by storing an ordered set of values and a list of the
    documents they relate to — for example, ascertaining all news articles in September
    by taking a block of document ids between two date values.


    # Operating on in-memory data


    Indexes in MarkLogic Server are cached in a server''s memory, using whatever spare
    memory capacity is available. This makes operations on that data very fast. In
    addition to range queries, you can use range indexes for sorting and faceted navigation.


    You can also use range indices to perform mathematical functions over values across
    a set of results. The most common calculation is a count of the documents mentioning
    a particular value, which is used to calculate facets.


    Other operations are also supported, including summation, average (mean, mode,
    and median), standard deviation, variance. You can also write user-defined functions
    in C++ and plug them into MarkLogic Server at runtime to provide custom, complex
    range mathematical calculations. This approach is like Hadoop''s in-database MapReduce
    operation, except it''s much faster and without the baggage of a large Hadoop
    installation.


    Other operations on range indices include calculating heat map density of search
    results, which can be overlaid on a map. You can also perform co-occurrence calculations,
    which allows you to take two or more fields in each search result and see how
    often their values occur simultaneously. This is useful for discovering patterns,
    such as the link between medical products and mentions mentioned on Twitter.


    # Retrieving fine-grained results


    Most search engines provide search queries over the entire document. MarkLogic
    Server, however, allows you to specify a subset of the document and perform a
    search for it. This is particularly useful when you want to restrict the search
    to a specific section, rather than the whole document or one field. Examples include
    book summaries, comments on an article, or just the text of a tweet (tweets actually
    have dozens of fields; they''re not just a short string of text).'
  merge: -1
