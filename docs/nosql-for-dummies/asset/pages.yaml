    # Building Mission-Critical Applications


    Multiple issues are involved in putting a new solution into production. Businesses
    won''t bet the bank on it, and executives won''t bet their careers implementing
    technology that may lose data. A down day is a death day when it comes to keeping
    services online in today''s world.


    In this section, I discuss how a hybrid NoSQL database can make overall system
    architectures more robust, by minimizing the number of parts of an end to solution,
    and simplifying data management tasks.


    # Ensuring data safety


    The first order of business is ensuring that data is kept safe. When databases
    indicate that data is saved, you need to be guaranteed that it is the case. This
    guarantee requires ACID-compliant durability guarantees. Data needs to be written
    to disk, or at least to journals, in order to ensure that it is in fact safe.


    The disks need some form of built-in failover, which you can do using a redundant
    array of independent disks (RAID) on a single machine.'
