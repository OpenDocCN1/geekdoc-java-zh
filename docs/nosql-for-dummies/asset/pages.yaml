  md: '# Chapter 3: Evaluating NoSQL


    # Charting and business intelligence


    The next obvious user-interface extension involves charting and viewing table
    summaries for live management information and historical business intelligence
    analysis.


    NoSQL databases provide an easy-to-integrate REST API in their databases. This
    means you can plug in a range of application tiers, or directly connect JavaScript
    applications to these databases. A variety of excellent charting libraries are
    available for JavaScript. You can even create charts based on data in these databases,
    after installing an appropriate database connector.


    Some NoSQL databases provide an ODBC or JDBC relational database plug-in. Creating
    indexes within a grid and showing them as a relational view is a neat way to turn
    unstructured data in a NoSQL document into that data that can be analyzed with
    a business intelligence tool.


    Check whether your NoSQL database provides visualization tools or has business
    partners that can connect to these databases. In vogue tools include Tableau Server,
    which is a modern shared business intelligence server that supports publishing
    interactive reports over data in a variety of databases, including NoSQL databases.


    ![](img/2afea990c282e97644b1fafcb6223852_88_0.png)


    # Extending your data layer


    A database does one thing well: It stores data. However, because all applications
    need additional software to complete, it''s worth ensuring that your selected
    NoSQL database has the tools and partner software that provide the extended functionality
    you require.


    Not ensuring that extended functionality is supported will mean you will end installing
    several NoSQL databases at your organization. This means additional cost in terms
    of support, training and infrastructure. It''s better to be sure you select a
    NoSQL database that can meet the scope of your goals, either through its features
    or through a limited number of software products.


    The ability to extend NoSQL databases varies greatly. In fact, you might think
    that open-source software is easy to extend; however, just because its API is
    public, doesn''t mean it''s documented well to extend.


    Whether you select open-source or commercial software, be sure that the developer
