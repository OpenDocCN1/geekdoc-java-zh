  md: '# 318 Part VI: Search Engines


    # Dissecting a Search Engine


    Although the most visible part of a search engine is the little text box on a
    web page, there are many behind-the-scene features that make the text box work.


    In this section, I discuss how a search engine goes beyond the normal database
    of querying, and why you should consider search when selecting a NoSQL database.


    # Search versus query


    A search is different from a query. A query retrieves information, based on whether
    it matches the query. Querying for orders that include a specific item or items
    in a specific price range are good examples.


    On the other hand, it is inexact and doesn''t require strict adherence to a common
    data model. Terms may be required or optional, with potentially complex Boolean
    logic. A relevancy score is typically calculated rather than simply "match" or
    "not a match" in a query. These relevancy calculations are tunable and greatly
    improve a typical user''s search experience.


    Search engines also provide hints for narrowing searching. In addition to providing
    a page of results and relevancy scores for each result, you may also be presented
    with information about the whole result set, which are called facets. Facets allow,
    for example, narrowing a product search by a category, by price range, or by the
    date that the product was added.


    Facets enhance the users'' experiences by allowing them to discover ways to improve
    their original search criteria without prior knowledge of data structures.


    # Web crawlers


    When you''re trying out search, the first order of business is finding some content!
    That content can be highly structured relational database records,'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# Chapter 24: Common Features of Search Engines


    such as the content on e-commerce websites. Or it may be entirely free text, or
    something in between, such as a Microsoft Word document or a web page with some
    structure.


    You begin by crawling the authoritative source system(s). Some databases have
    built-in indexing that allows real-time indexing. The vast majority of search
    engines, though, index remote content and update their indexes periodically. These
    indexes out of date, but a lot of content stays the same, so you don''t need to
    find it within minutes after it''s published.


    Web search engines start with a list of URLs (Uniform Resource Locators). When
    crawling their URLs, they read the text on the web pages and index; they add newly
    discovered links to the queue of indexed pages. Some single type of crawler can
    discover all linked web pages on the web.


    Your organization may need to crawl a variety of systems. If so, note that many
    search engines, such as IBM OmniFind, HP Autonomy, and Microsoft FAST, have connectors
    to a variety of different sources.


    These crawlers are typically provided by stand-alone search engines. Some search
    engines are embedded within databases, like MarkLogic''s NoSQL document database.
    These embedded search engines index their own content, so they don''t include
    crawlers for other systems, which means that you must move or copy content into
    the NoSQL database in order to have it indexed.


    Although this requires more storage, the advantage of a real-time index for content
    stored in a NoSQL database may outweigh the disadvantages of a search engine.
    The primary disadvantage of a search engine is that crawling occurs on a periodic
    schedule, leading to inconsistent data results and false positives — where the
    document no longer exists or doesn''t match the search query.


    # Indexing


    After you find content, you need to decide what you want to index. You can simply
    store the document title, the link, and the date the content was last updated.
    Alternatively, you can extract the text from the content so you can list the words
    mentioned in the document.


    You can go further and store a copy of the page as it was when indexed. This is
    a particularly popular feature in Google search results — especially if a page
    was recently deleted by its author, and you still want to access the page as it
    was when indexed.'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# 320 Part VI: Search Engines


    A standard index stores a document ID followed by a list of the words mentioned
    within it. When you''re performing a query, though, this approach isn''t particularly
    useful. It''s much better to store document IDs as a list under each unique word
    mentioned. Doing so enables a search engine to quickly determine the set of documents
    that match a query.


    ![](img/2afea990c282e97644b1fafcb6223852_337_0.png)


    This is called an inverted index and is the key to having good performance. The
    more content you index, the more important it is that inverted indexes are stored
    so that query times are fast. Be sure to ask your vendor about your product''s
    index structure and at the scale that it performs well.


    Of course, you may want to index more than words. You can index date fields (updated,
    created, indexed) numbers (page count, version), phrases, or even things like
    geospatial coordinates of places mentioned in content. These are collectively
    called terms, and their lists of matching documents are called


    If a query want to perform requires that all dates, and numeric terms match, the
    search engine will perform returns results only on documents that include all
    three term lists. This is known as AND Boolean logic.


    More perhaps is OR Boolean logic, which means documents with more of the matching
    terms are given a higher relevancy score. The calculation of relevancy varies
    depending on the given situation.


    For example, you may think results on recent news are more relevant than old news
    stories. In addition to this, you may also want to attach more relevancy to those
    in which the terms you entered are more frequently in the same document. The problem
    here, though, is that a document relevant than a 20-page document that also mentions
    the same word once. One word in 20 is a high frequency within the document.


    A common way to offset relevancy problems is to calculate TF-IDF (Term Frequency-Inverse
    Document Frequency):


    +   - Term frequency is how often a term appears in a given document.

    - Inverse frequency is the total number of documents divided by the number of
    documents mentioning that term.


    There are various ways to calculate term and inverse document frequency. I mention
    it to make the point that indexing and relevancy scoring are useful features,
    and ones that simple query in most databases cannot handle on their own.'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# Chapter 24: Common Features of Search Engines 321


    # Searching


    Once you have the lovely indexes, you need a way to query them that doesn''t baffle
    your application''s users. Google is so popular because a simple text box can
    be used for both word searches and for searches for complex criteria, such as
    restricting the country of matched web pages, or the age of web pages returned.


    # Using a search grammar


    The key to making searching easy is to use an easy-to-understand text format,
    which relates to what''s called a search grammar. Most search engines provide
    a free-text Google-like grammar.


    Here you see an example of a search grammar in use:


    ```

    "grazing land AND rent site:uk -arable -scotland 2013..2014

    ```


    This example of Google search includes several terms:


    +   **Phrase:** A phrase of words that must be next to each other, like "grazing
    land".


    +   **Boolean** AND; AND joins the phrase and following word search and requires
    both match.


    +   **Word:** Typically, the word includes stems, so in this case, rent also includes
    renting, rents, and rendered.


    +   **Domain:** Here, the domain is the UK website domain name (site:uk).


    +   **Negation:** Here, pages with the words arable (for crop land) and scotland
    are excluded.


    +   **Range:** Here the date ranges for the years 2013 to 2014 are included.


    This type of query is very easy to grasp and remember for future searches. These
    rules combined with parentheses enable you to perform sophisticated searches.


    Specialist publishers often provide enhanced search services that enable users
    to query across hundreds of terms in a single search. This capability is es useful
    for niche datasets, as search news reports and filings data.


    > Many engines provide a default grammar, with allowing you to customize the grammars
    and how they''re parsed, which is a plus if you''re considering moving from one
    search engine to another one that''s scalable, but in doing so, you don''t want
    to burden the users of your application with having to learn how to use a new
    search grammar.


    ![](img/2afea990c282e97644b1fafcb6223852_338_0.png)'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# 322 Part VI: Search Engines


    Pagination

    The earlier Google search query yields over 54,000 results. There''s no point

    showing a user such as a big list! Sorting by relevancy and showing the ten

    most-relevant matches is generally enough. All search engines provide this

    capability.


    You may want the user interface you create to provide quick "skip"

    navigation to next and previous pages, and perhaps to the first page.


    # Sorting


    Sorting by relevancy is often the best bet, but in some circumstances,

    uuser may want to override the order of results. This is most common in

    publish scenarios where a user orders by "most recent" or on an

    e-commerce website where the user chooses to show the least expensive

    product first.


    Most search engine interfaces provide a drop-down menu that has helpful

    options for sorting.


    # Faceting


    A facet is an aspect of the search results that users may decide to use

    nurther narrow their searches. Facets provide user-friendly ways of traversing

    search results to find exactly what''s needed. A facet has a name and shows

    many values, each with the number of records returned that match the value

    (for example, searching for Harry Potter on Amazon shows a product type

    facet with values (55) and DVD (8)).


    Advanced faceting can include hierarchical facet values, calculated buckets

    as as "Jun 2013" and "Jul 2013" (rather than individual days) and even

    heat map regions for display as an overlay on a web map.


    # Snippeting


    For queries, you may want to show one or more sections of text

    that match the given text terms, rather than simply state that a large docu-

    ments the query. This process is called snippet.


    It''s common for search engines to include three snippets per result,

    although you can configure this along with the number of characters or

    words to return in each snippet.


    On Google, these snippets are shown with the continuation characters (...)

    separating them. Matching words are shown in bold within the snippets.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# Chapter 24: Common Features of Search Engines 323


    # Using dictionaries and thesauri


    As an extension to word stemming, you may want to support dictionaries and thesauri.
    These are particularly useful for finding synonyms.


    Law enforcement agencies, in particular, are awash with synonyms. Drug dealers
    may call narcotics "products," with each product referred to by a slang term as
    well as by its chemical or scientific name. Using a third-party thesaurus (for
    example, in OpenOffice format) or your own internally managed can add one breadth
    to a search term.


    # Indexing Data Stores


    Corporate systems house a large amount of valuable organizational data. These
    systems vary from department to department and between different classes of business.


    If you need to keep such systems in place but provide a single search capability
    over all of them, you need a search engine that can connect to these corporate
    systems.


    Alternatively, you can consolidate a variety of IT applications on a common data
    platform. This platform may have search capabilities built into the database.
    Doing so enables you to instantly update indexes, which results in proactive alerts
    as new content arrives.


    # Using common connectors


    You may want to index a variety of enterprise systems, with each containing useful
    information for your organization''s staff.


    These systems include


