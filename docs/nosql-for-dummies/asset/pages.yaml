    a few weeks out of each year, especially during the Christmas and tax-filing seasons.


    ![](img/2afea990c282e97644b1fafcb6223852_154_0.png)


    # Handling disasters


    To ensure that your data remains available when an entire datacenter goes down
    (often caused by workers mechanically digging up network cables!), you need to
    have a second datacenter with the latest information.


    You can do so with Riak by purchasing Basho''s Riak Enterprise. This edition supports
    asynchronous or timed replication of data from a primary master site to one or
    more secondary replica sites. If the primary site goes down, you can switch your
    customers and applications to one of the replica sites. Because replication is
    asynchronous, it''s still possible to lose some data, but this is the typical
    replication method used between datacenters across all types of database software.
    Asynchronous cluster-to-cluster replication provides the best tradeoff between
    primary cluster performance and data durability and consistency.


    # Evaluating Basho


    Basho offers expert consultation services for the Riak database. In the UK, Basho
    offers perpetual licenses, support, and consultation on the UK government''s G-Cloud
    store, and you can find the government''s prices online by searching for Riak
    at https://www.digitalmarketplace.service.gov.uk.


    Basho also claims to have several high-profile customers, including Best Buy,
    the Braintree payments service, Comcast, and Google (in its Bump service). Various
    media and advertisement companies, including Rovio Entertainment, creator of Angry
    Birds, are customers, too.


    At the time of this writing, Basho has offices in Washington, D.C., London, and
    Tokyo.'
