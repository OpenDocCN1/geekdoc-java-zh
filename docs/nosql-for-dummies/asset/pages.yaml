  md: '# Chapter 22: Triple Store Products 295


    Each of these situations requires management of data relationships between records
    (documents). Each one also requires linking the subject described to one or more
    source documents in your database. For example, a police report might mention
    a gang name and a meeting of three people on October 23. These facts can be extracted
    into person, organization, and event types.


    A separate document could contain the fact that this organization will be purchasing
    guns from a particular arms dealer. This linkage provides another instance and
    another event (which may not be the same as the previously mentioned event).


    These documents are not directly related. Instead, they related by way of the
    extracted facts mentioned in the text. You need to maintain the links between
    the extracted subjects and the source documents, because you may need to prove
    where the facts are for a later court case or investigation.


    For instance, say that a police department creates a document requesting an operation
    to intercept criminal activity, and it bases on the preceding kind of research.
    In that case, the police need to store the provenance of the data. The document
    may undergo multiple versions, but it''s based on material in the police report''s
    source documents.


    Once the operation is completed, each officer needs to write a statement. A final
    file is created as evidence to submit to the prosecutor''s office. This file comprises
    summary information, all source intelligence, and the officers'' statements.


    In checking evidence, the prosecutors need to know who changed what, when and
    how; with what software, and why? What was the reasoning behind an arrest (was
    it the content of other documents, for example?)


    Each individual document exists as a record in its own right, but the final submission
    exists only because these other documents are combined. This is an example of
    a compound document pattern. A prosecution file could contain an overview describing
    the contents of the file, multiple statements made by witnesses, transcripts of
    an interview of the accused, and photographs of a crime scene.


    All three databases discussed in this book allow you to store triples that relate
    to documents. After all, all you need to do is create an RDF class to represent
    a document, with a property that links to the ID of the document you''re making
    statements about. Use of these facts is left to your application.'
  merge: -1
