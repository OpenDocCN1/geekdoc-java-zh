  md: '# 66 Part I: Getting Started with NoSQL


    The one thing common to all NoSQL databases is that you can''t rely on published
    data — none of it — to figure out what the performance is likely to be on your
    data, for your own use case.


    You certainly can''t rely on a particular database vendor''s promise on performance!
    Many vendors quote high ingest speeds against an artificial use case that is not
    a realistic use of their database, as proof of their database''s supremacy.


    However, the problem is that some studies totally ignore speed. What''s the point
    in storing data if you never use it?


    These studies may be done on systems where key features are disabled. Security
    indexes may not be enabled, or perhaps ACID transaction support is turned off
    during the study so that data is stored quickly, but there''s no guarantee that
    it is safe.


    This all means that you must do your own testing, which is easy enough, but be
    sure that the test is as close to your final system. For example, there''s no
    point in testing a single server if you plan to scale to 20 servers. In particular,
    be sure to have an accurate mix of ingesting, modifying, and querying data.


    Consider asking your NoSQL vendor these questions:


    +   - Can you ensure that all signing and performance features quoted are for
    systems that ensure ACID transactions during ingest that support real-time indexing,
    and that include a realistic mix of ingest and read/query requests?

    - Does your product provide features that make it easy to increase a server''s
    capacity?

    - Does your product provide features that make it easy to remove unused server
    capacity?

    - Is your product''s data query speed limited by the amount of information that
    has to be cached in RAM?

    - Does your product use a memory map strategy that requires all indexes to be
    in RAM for adequate performance (memory mapped means the maximum amount of data
    stored is the amount of RAM installed)?

    - Can your database maintain sub-query response times while receiving high-frequency
    updates?

    - Does the system ensure that no downtime is required to add or remove server
    capacity?

    - Does the system ensure that information is immediately available for query after
    it is added to the database?'
