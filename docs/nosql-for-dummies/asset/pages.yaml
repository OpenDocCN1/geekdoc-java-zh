  md: '# Chapter 1: Introducing NoSQL: The Big Picture


    These two papers inspired many different organizations to create their NoSQL databases.
    There were so many variations that some people thought it necessary to meet and
    discuss the various approaches being taken (see “The NoSQL ‘meetup’” sidebar).


    # What NoSQL means today


    The NoSQL movement includes hundreds of NoSQL database products, which has led
    to a variety of definitions for the term — some with very common tenets, and others
    not so common. I cover these tenets in detail in Chapter 2.


    This explosion of databases happened because nonrelational approaches have been
    applied to a wide range of problems where RDBMS has traditionally been weak (as
    this book covers detail). NoSQL databases were also created for data structures
    and models that in an RDBMS required considerable management or shredding and
    the reconstitution of data in complex plumbing code.


    Each problem resulted in its own solution — and its own NoSQL database, which
    is why so many new databases emerged. Similarly, existing products providing NoSQL
    features discovered and adopted the NoSQL label, which makes the jobs of architects,
    CIOs, and IT purchasers difficult because it''s unlikely that one NoSQL database
    can solve all the issues in a particular business area.


    So, how can you know NoSQL will help you, or which NoSQL database to choose? The
    answer to these questions consume the remainder of Part I of this book by discussing
    the variety of NoSQL databases and the business problems they can solve, beginning
    with the following section that covers NoSQL features.


    # Features of NoSQL


    NoSQL books and blogs offer different opinions on what a NoSQL database is. This
    section highlights the common opinions, misconceptions, and hype and fringe opinions.'
