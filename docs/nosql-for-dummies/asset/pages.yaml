  md: '# Chapter 2: NoSQL Database Design and Terminology


    # Polyglot persistence explained


    If you need to store a web of facts, a set of documents, and shopping cart datasets,
    you cannot do so in one NoSQL database. Or when you can store them, it''s hard
    to retrieve all data with a single query. Instead, you must use a single data
    access layer to handle the various data storage demands, and that''s where polyglot
    persistence comes in.


    Polyglot persistence is the idea that a single application uses different types
    of data to use multiple databases behind that application. Nobody said down and
    decided that polyglot persistence was the way forward. It''s currently the case
    that no single database provides all the functionality of a column, key-value,
    document, or triple store.


    Unlike the relational database world where the structural support hasn''t much
    in years (except for XML field support), NoSQL databases are gradually growing
    over and covering multiple data types. For example, the Elasticsearch engine is
    positioning itself as a JSON document store. MongoDB, CouchDB, and MarkLogic have
    the concept of primary keys or URIs. In this way, they act as key-value stores
    — the value is just a document.


    If you look closely at document NoSQL databases, you can see that they provide
    some or a majority of the functionality expect from a column or key-value store.


    +   - If you''re considering a key-value store but some features are missing that
    handle specific of the data, then consider a column store.


    +   - If a column store can''t handle a very complex structure in your application,
    then consider a document store.


    +   - If you need to manage relationships or facts in your data, then you need
    features of a triple store, too.


    MarkLogic and OrientDB are interesting because they work as a document store and
    also as triple and key-value stores. Traditional relational data-rows and modern
    NoSQL column families can be represented easily as a document (JSON or XML).


    Column stores are very good at having a lexicon of data for a field across record
    instances. These lexicons can then be used to calculate aggregation values quickly
    — for example, statistical operations like mean average, standard deviation, or
    even listing unique values and their counts.


    Some document databases expose their internal field indexes for similar operations.
    MarkLogic, for example, allows a search to executed with'
