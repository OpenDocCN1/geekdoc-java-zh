- img_proc: true
  md: '# 224 Part IV: Document Databases


    The availability and popular use of XML Stylesheet Transformations (XSLT) to convert
    XML to a variety of formats, including HTML for web pages and Portable Document
    Format (PDF) documents, is a key benefit to using XML over other formats like
    JSON. The use of XML Schema Definitions (XSDs) to describe a common format for
    exchanging information is also useful.


    During the publishing process, you need to repurpose a document, into a target
    format. Publishers may do this at the proofing stage so they can be sure the output
    looks correct, which generally means these documents are generated and stored
    alongside originals in a collection of documents (MarkLogic Server) or attachments
    (Microsoft DocumentDB).


    For others, the ability to generate different formats on the fly for occasional
    use outweighs the need to create and store them in case they are requested. This
    concept is called *schema on read* because you morph the data to your target format
    — the schema — when you request the document.


    You can accomplish schema on read in MarkLogic Server using XSLT for individual
    documents, or Xinclude for merging documents, or a custom XQuery stored procedure
    to perform any transformation you like. Xinclude is a way to merge in other documents
    at query time. It''s a similar, but limited, approach to query joins in the relational
    database world.


    Microsoft provides a similar mechanism for JSON documents via Structured Query
    Language (SQL) syntax to query, or describe at query time, the structure of the
    content you want to receive.


    This query syntax is very similar to that used in a relational database management
    system''s (RDBMS) SQL syntax. It allows for repurposing of a number of related
    document sections, restricting the information returned, and specifying fixed
    values and results from aggregation functions (mean average, standard deviation,
    and so on).


    Although Microsoft describes pulling together information in a DocumentDB query
    as a join, it should be pointed out that, unlike a join in a relational database,
    DocumentDB joins are possible only within sections of the same JSON document.
    They don''t allow joining of multiple documents.'
