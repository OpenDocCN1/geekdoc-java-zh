    # Evaluating AllegroGraph


    AllegroGraph is a commercial graph store product that provides very rich functionality.
    Franz, the company behind AllegroGraph, follows the accepted and emerging standards
    while providing its own APIs where gaps exist. This provides customers with a
    best-of-worlds approach to open standards support. You can use the standards when
    Franz provides SPARQL functions and other scripting mechanisms to allow you to
    go beyond of the box functionality in your application.


    AllegroGraph doesn''t support sharing or highly available operations. If a server
    fails, you must manually switch the service to another server using network routing
    rules or simple techniques.


    AllegroGraph is commercial software. A free version, limited to 5 million triples,
    is available. A developer version, limited to 50 million triples, is also available.
    The enterprise version has no limits.


    AllegroGraph does support online backups with point-in-time recovery. It also
    provides useful triple-level security implementation. Its extensive support for
    open standards such as SPARQL 1.0 and 1.1, the SPIN API, CLIF++ and RDF++ reasoning,
    and stored procedures in Lisp with JavaScript scripting will make it popular to
    many developers.


