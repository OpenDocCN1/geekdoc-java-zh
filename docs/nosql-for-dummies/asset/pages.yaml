  md: '# 194 Part III: Bigtable Clones


    # Clustering


    The ability for a single ring (a Cassandra cluster) of Cassandra servers to spread
    across nodes, racks of servers, and geographically dispersed data-centers is a
    unique characteristic of Cassandra. Cassandra manages eventually, asynchronous
    replicas of data automatically across each of these types of boundaries. Different
    datacenters can even differ in the number of replicas for each data set, which
    is useful for different scales at each site.


    This treatment of every server holding the same data as a single dispersed cluster,
    rather than independent but connected sets of clusters, takes a bit of getting
    used to. It''s unique to the databases in this book.


    Scaling a cluster to add one-third more capacity may require some thought, because
    you need to consider its position in the ring and how adding capacity may affect
    the automatically managed replicas.


    You configure your physical Cassandra architecture by using a Gossiping Property
    File Snitch, which has nothing to do with Harry Potter''s Quidditch, unfortunately.
    This is a configuration file that defines what servers are in which racks and
    datacenters. This configuration mechanism is recommended because it allows Cassandra
    to make the best use of the available physical infrastructure.


    # Tuning consistency


    Data consistency in Cassandra is tunable; that is, it doesn''t need to always
    be eventually consistent across all replicas. The settings are up to the client
    API, and not the server.


    By writing data using the ALL setting, you can be sure that all replicas have
    the same value of data being saved. For mission-critical financial systems, for
    example, this is the approach to take.


    If you use the ALL setting for write consistency, be aware that a network partition
    anywhere in your global cluster will cause the whole system to be unavailable
    for writes!


    Other settings are — 11, in fact, for writes. These settings range from ALL to
    ANY. ANY that data will try to write to any of the replicas. If no replicas for
    that key are online, Cassandra will use hinted-handoff, which is to say that it
    will save the write on a node adjacent to a replica node that is currently unavailable.
    This provides the highest service availability for the lowest consistency guarantees.'
