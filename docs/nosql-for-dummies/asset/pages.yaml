  md: '# Chapter 2: NoSQL Database Design and Terminology


    Storage organization


    +   * **Server**: A single computer node within a cluster. Typically runs a single
    instance of a database server''s code.

    * **Cluster**: A physical grouping or servers that are managed together in the
    same data center to provide a single service. May replicate its databases to clusters
    in other data centers.

    * **Normal form**: A method of normalizing, or minimizing duplication, in data
    in an RDBMS.


    NoSQL databases typically lead to a denormalized data structure in order to provide
    faster querying or data access.


    Replication technology


    +   * **Disk replication**: Transparent replication of data between nodes in a
    single cluster to provide high-availability resilience in the case of a failure
    of a single node.

    * **Database replication**: Replication between databases in different clusters.
    Replicates all data in update order from one cluster to another. Always unidirectional.

    * **Flexible replication**: Provides application controlled replication of data
    between databases in different clusters. Updates may not arrive in the order they
    were applied to the first database. Typically involves some custom processing,
    such as prioritization of data updates to be sent next. Can be bi-directional
    with appropriate update conflict resolution.


    Search tools


    +   * **Index**: An ordered list of values in a particular record.

    * **Reverse index**: An ordered list of values (terms), and a list of primary
    keys of records that use these terms.


    Provides for efficient unstructured text search and rapid aggregation functions
    and sorting when cached in memory.


    +   * **Query**: A set of criteria that results in a list of records that match
    the query exactly, returned in order of particular field value(s).

    * **Search**: A set of criteria that results in a relevancy-ordered list that
    match the query.


    The search criteria may not require an exact match, instead returning a relevancy
    calculation weighted by closeness of the match to the criteria. This is what Google
    does when you perform a search.'
