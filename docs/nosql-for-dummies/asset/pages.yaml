  md: '# Chapter 10: Bigtable in the Enterprise


    +   - Overflow of GFS quotas: Effectively running out of disk space


    +   - Planned and unplanned hardware maintenance: Where workloads in the cluster
    are affected


    These problems affect a wide variety of distributed databases, and when assessing
    a particular database for its reliability in enterprise applications, you need
    to find out how they handle the preceding situations.


    With this information, you can identify higher-risk areas of your system, including
    whether a single point of failure (SPoF) needs to be addressed. SPOFs are the
    main cause of catastrophic service unavailability, so I spend a lot of time throughout
    this book identifying them. I recommend you address each one I talk about a live
    production service.


    # Ensuring availability


    A table in a Bigtable database is not a physical object. Instead, data is held
    within tablets. These tablets are all tagged as associated with a table name.
    Tables are distributed across many servers.


    If a server managing a tablet fails, then this needs to be managed. Typically,
    in Bigtable clones, another tablet server is elected to take over as the primary
    master for the tablets on the failed server. These tablets are shared between
    the remaining servers to prevent a single server from becoming overloaded.


    How these secondary servers are selected and how long it takes them to take over
    operations on those tablets are important issues because they can affect data
    and service availability, as shown here:


    +   - Some Bigtable clones have a master process that monitors tablet servers
    and then reallocates them if the tablets fail or become unresponsive. These masters
    are also responsible for data changes like adding or removing tables, so these
    masters respond to client requests.


    +   - On databases (for example, Hypertable), these master processes aren''t highly
    available, which means that, if the master dies, you might have a problem. Usually,
    you can start another master within seconds, but it''s important to understand
    these needs to be done to guarantee availability.'
