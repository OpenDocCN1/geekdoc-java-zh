    If you model car route planning in an RDF triple store, you can store the "journey
    segment" towns as a node (subject), with a normal property of distance. Each town
    can have a "touches" relationship to the journey segment. In this way, the queries
    are more verbose, and although they involve more node traversals, the use case
    can be solved using the RDF and SPARQL query models.


    # Optimizing for query speed


    Although you can perform property queries in Neo4j without adding dedicated indexes,
    significantly higher query speed is possible by adding indexes.


    Indexes can be configured for any property. These are scoped by the label and
    property name. If a property is used for lookup by a number of different node
    labels, you need to configure multiple indexes.


    Indexes can enforce uniqueness constraints, which allows for a useful guarantee
    when you need to generate, store, and enforce unique ID properties.


    You need to index only the properties you use in queries. If you don''t use properties
    in queries, then adding indexes for these properties won''t help your query performance;
    they''ll just take up disk space.


    # Using custom graph languages


    Neo4j provides a rich custom query language called Cypher that enables you to
    configure complex graph queries, including properties and labels attached to nodes
    and relationships.'
