  md: '# Chapter 19: Common Features of Triple and Graph Stores 263


    Generally, you don''t find these graph operations in triple stores:


    +   - **Shortest path**: Finds the minimum number of hops between two vertices
    and the route taken.


    +   - **All paths**: Finds all routes between two vertices.


    +   - **Closeness**: Given a set of vertices, returns how closely they match within
    a graph.


    +   - **Betweenness**: Given a set of vertices, returns how far apart they are
    within a graph.


    +   - **Subgraph**: Either finds a part of the graph that satisfies the given
    constraints or whether a named graph contains a specified partial graph.


    These algorithms are mathematically much harder queries to satisfy than simply
    returning a set of facts. This is because these algorithms could traverse the
    graph to an unpredictable depth of search from the first object in the database.


    Triple queries, on the other hand, are always bounded by a depth within their
    queries and operate on a known set of vertices as specified in the queries themselves.


    # Describing relationships


    Graph stores also allow their relationships, or edges, to be described using properties.
    This convention isn''t supported in RDF in triple stores. Instead, you create
    a special subject to represent the relationships itself, add the properties to
    this intermediate subject.


    This process does lead to more complex queries, but they can be handled using
    the query style shown in Listing 19-2.


    # Making a decision


    The differences between the graph and triple store data models lead to great differences
    in architecture. Because of the number of hops possible in graph queries, a graph
    store typically requires all its data to be held on a single server in order to
    make queries fastest.


    A triple store, on the other hand, can distribute its data in the same manner
    as other NoSQL databases, with a specialized triple index to allow distributed
    queries to be spread among servers in a cluster.'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# 264 Part V: Graph and Triple Stores


    In the future, it may be possible to distribute a graph store while maintaining

    speed — by detecting widely independent graphs stored alongside others\and separating
    them between servers. Alternatively, you can use graph

    analysis to find the nearest vertices and store them near each other

    ent the same server, which minimizes the number of cross-server

    relationships, and thus the queries required.


    Whether you choose a triple or graph store isn''t a question of architect-

    ture you prefer; instead, the question is which type of queries you prefer.


    The majority of data models uses triples to provide the same flexibility in

    modeling relationships as you get in schema-less NoSQL''s document models.

    They are basically schema-less relationships: You are free to add, remove,

    and edit them without informing the database beforehand of the particular

    types of relationships you''re going to add.


    Triple stores are concerned with storing and retrieving data, not returning

    complex metrics or statistics about the interconnectedness of the subjects

    themelves.


    Triple stores are also built on the open RDF set of standards and the SPARQL

    query language. Graph stores each have their own terminology, slightly

    different data models, and query operations.


    If you need to query information about the graph structure, choose a

    graph store. If you only need to query information about subjects within that

    graph, then choose a triple store.


    From this point on, I use the term triple store to refer to both triple and graph

    stores, unless stated otherwise.


    # Deciding on Triples or Quads


    The subject – predicate – object data model is a very flexible one. It allows

    y to describe individual assertions.


    There are situations though the subject – predicate – object model is

    to too simple, typically because your assertion makes sense only in a

    particular context. For example, when describing a particular patient in one

    medical trial versus another trial, or you might be describing the status of

    one person within two different social groups.


    Thankfully, you can easily model context within a triple store. Triple stores

    have the concept of a named graph. Rather than simply add all your

    assertions globally, you add them to a named part of the graph.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Chapter 19: Common Features of Triple and Graph Stores


    You can use this graph name to restrict queries to a particular subset of the
    information. In this way, you don''t need to change the underlying ontology or
    the data model used in order to support the concept of context.


    In the preceding example, you could have a different named graph for each medical
    trial or each social group. If you specify the graph name in your query, you restrict
    the context queried. If you don''t specify the named graph, you get a query across
    all your data.


    Note that each triple can be stored in only a single named graph. You must carefully
    select what you use as your context and graph name. If you don''t, you may find
    yourself in a situation where you need to use two contexts for a single set of
    triples.


    The graph name is implemented on some NoSQL databases means the triples are stored
    within a document, and the document can be linked to multiple collections. The
    collection name in these systems is synonymous with the graph name. This allows
    a little more flexibility, if it''s a "naughty" when compared to the W3C specifications.
    MarkLogic Server provides this capability if you need it.


    By creating a database for all triples in a particular application, when querying
    across them, you''re automatically saying they all have value. In most situations,
    therefore, you don''t need a context. In this situation, you can ignore the context
    of the data and just keep in terms of triples, rather than quads.


    If you need the context context and can add a property to a subject without making
    your queries complex, or altering an ontology, then do so, because this approach
    is more flexible.


    If you absolutely use context without adding your own properties outside of an
    ontology, then using the graph name for context will give you the quads you need.


    # Storing RDF


    The first standard you need to become familiar with when dealing with triples
    is the Resource Description Framework (RDF). This standard describes the components
    of the RDF data model, which includes subjects, predicates, objects, and how they
    are described.


    This standard is vast and too complex to detail in this book. The best reference
    I''ve found is Semantic Web for the Working Ontologist, Second Edition by Dean
    Allemang and James Hendler, published by Morgan Kaufmann. This book discusses
    practical ways to apply and model RDF solutions.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# 266 Part V: Graph and Triple Stores


    # Applying Standards


    | Sir Tim Berners-Lee has a lot of talented people working with him at the World
    Wide Web Consortium (W3C). These people like to create standards based on feedback
    from scholars and industry. | There is a difference between proprietary and open
    software and proprietary and open standards:

    * A proprietary (commercial) piece of software can support open standards.

    * Open-source software can invent its own data models and query languages, and
    not support standards.

    Be sure you don''t confuse the two when deciding on the total cost of ownership
    of software.


    Here are a few RDF concepts that are explained in detail in the *working ontology*:


    +   * **URI**: The unique identifier of a subject or a predicate.

    * **Namespace**: A namespace allows packing of objects in an ontology. Namespaces
    allow you to mix internal RDF constructs and third-party ontologies.

    * **RDF type**: Used to assert that a subject is an instantiation of a particular
    type. Not equivalent to a class. RDF supports inheritance between RDF types, including
    across ontologies.

    * **Subject**: The entity you are describing — *for example, physical (person,
    place)* or conceptual (meeting, event). Takes the form of a URI.

    * **Predicate**: The edge, or relationship, between the subject and the object.
    Takes the form of a URI.

    * **Object**: Another subject URI when describing relationships between subjects,
    or an intrinsic property value like an integer or string name.


    A key difference between RDF and other specifications is that there are multiple
    expression formats for RDF data, not just a single language. Common languages
    are N-Triples, Turtle, and RDF/XML.


    Which format you choose depends on the tools you''re using. A person who understands
    RDF in one format should be able to pick up another format easily enough without
    retraining.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Chapter 19: Common Features of Triple and Graph Stores


    In addition to RDF, there are other related standards in the ecosystem. Here are
    the standards you need to become familiar with:


    +   - SPARQL: Semantic querying language. Triple store equivalent of SQL. Able
    to construct new triples and return as a result set (An example of projection).


    +   - RDF Schema (known as RDFS): RDFS helps define the valid statements allowed
    for a particular schema.


    +   - OWL (the Web Ontology Language): Sometimes referred to as RDF+. A subset
    of OWL is commonly used to supplement RDF Schema.


    +   - SKOS (Simple Knowledge Organization System): W3C standard recommendation
    that describes using RDF to manage controlled vocabularies, thesauri, taxonomies,
    and folkonomies.


    These specifications allow you to define not only the data in your database but
    also the structure within that data and how it''s organized.


    You can use a triple store by utilizing a simple RDF serialization like N-Triples,
    and SPARQL to query the information contains. It''s good to know about these other
    specifications, however, when you''re designing ontologies that you share with
    the outside world.


    # Querying with SPARQL


    SPARQL is a recursive acronym that stands for SPARQL Protocol and RDF Query Language.
    SPARQL uses a variant of the Turtle language to provide a query mechanism on databases
    that store RDF information.


    SPARQL provides several modes of operation:


    +   - Select: Returns a set of matching triples from the triple store

    - Ask: Returns whether a query matches a set of triples

    - Construct: Creates new triples based on data in the triple store (similar to
    projection).


    These operations can be restricted to portions of the database using a Where clause.


    As shown in Listing 19-1, select statements can be very simple. The sample in
    listing 19-1 returns all triples in the database that match the given expression.'
  merge: -1
  pgno: 284
- img_proc: true
  md: "You can construct more complex queries to find particular subjects that match\
    \ a query across relationships in the graph, as shown in Listing 19-2.\n\n# Using\
    \ SPARQL 1.1\n\nAn update to the SPARQL standard is now very common and often\
    \ people looking to implement a triple store request the 1.1 version of the SPARQL\
    \ standard.\n\nVersion 1.1 provides a \"group by\" structuring mechanism and allows\
    \ aggregation functions to be performed over triples.\n\nListing 19-3 shows both\
    \ an aggregation function (AVG for mean average) and a GROUP BY. This query returns\
    \ the average age of purchasers for each product ordered from a website.\n\nListing\
    \ 19-3: Average Purchaser Age Query and Result\n\n```\nSELECT (AVG(?age) AS ?averageage)\
    \ WHERE {\n  ?product :title ?title\n  ?order rdf:type :order\n  ?order :has_item\
    \ ?product\n  ?order :owner ?owner\n  ?owner :age ?page\nGROUP BY ?title}\n```\n\
    \nSPARQL 1.1 also provides a HAVING clause that acts like a filter clause, except\
    \ it operates over the result of an aggregation specified in the SELECT clause,\
    \ rather than a bound variable within the WHERE clause.\n\n# Modifying a named\
    \ graph\n\nAn often overlooked specification is the W3C SPARQL 1.1 graph store\
    \ protocol. This is a single web address (called a HTTP endpoint — Hypertext Transfer\
    \ Protocol, the protocol that powers the web) allows clients to create, modify,\
    \ and delete named graphs within a triple store.\n\nThis is a simple specification\
    \ that can be easier to work with than the more complex SPARQL 1.1 Update mechanism.\
    \ The graph store protocol is easy to use because you can take any Turtle RDF\
    \ file and use a simple web request to create a graph, or add new data to an existing\
    \ graph."
  merge: -1
