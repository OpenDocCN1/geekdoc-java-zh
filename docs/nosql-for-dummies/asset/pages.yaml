    # Migrating RDBMS data


    When performing entity enrichment on NoSQL databases, it''s common to pull reference
    information from relational database management systems.


    Again, clever people who contribute to W3C working groups have covered, by way
    of a language called R2R, which stands for RDB to RDF Mapping Language. This enables
    you to define transforms to convert a relational schema to a target RDF ontology.
    R2RML and related standards are available here: www.w3.org/2001/sw/rdb2rdf


    In situations, though, you want to quickly ingest information before performing
    data refactoring or inferencing. For example, you may want to store the original
    information so that you can assert PROV-OV provenance on the data before reworking
    it.


    In this situation, you can use the Direct Mapping of relational data to RDF. You
    can find details on this standard here: www.w3.org/TR/rdb-direct-mapping


    In the past, I used direct mapping to perform a tongue-in-cheek demo to illustrate
    relational data into a triple store for inferencing and querying. You can find
    this video on YouTube at https://www.youtube.com/watch?v=4cUqMzzu0F4


    # Managing the Social Graph


