- img_proc: true
  md: '# 218 Part IV: Document Databases


    It''s also possible that you want all data replicated, but you must prioritize
    which data to replicate first. Perhaps a list of all the notes you''ve made on
    a device is replicated first, and the notes themselves are replicated later. This
    is common in certain scenarios:


    +   - Mobile synchronization: Notes are saved on a phone for offline use and then
    synced later.

    - You can run Couchbase Mobile on a phone to provide for such situations.

    - Austere sites: These include places as oil rigs, military bases with intermittent
    satellite communications, or sneaky people with laptops in remote places. MarkLogic
    Server supports these types of installations.


    This type of replication is sometimes called mobile synchronization, or flexible
    replication, or Query Based Flexible Replication (QBFR). The phrase query based
    reflects that a search query is used to bound the data to be replicated, allowing
    several priority-ordered datasets to be replicated in a push or pull manner.


    # Managing Consistency


    It''s perfectly acceptable in some applications to have a slight lag in the time
    it takes for data to become visible. Facebook posts do not appear instantly to
    all users. You can also see on Twitter that someone is following you before the
    total number of followers is updated. This is typically only a few seconds, and
    for social media that''s not a problem. However, the same isn''t true in situations
    as in the following:


    +   - Primary trading systems for billion dollar transactions

    - Emergency medical information in an emergency room

    - Target tracking information in a battle group headquarters


    It''s important to understand the differences in approaches when considering a
    database for your application. Not all NoSQL databases support full ACID guarantees,
    unlike their relational database management systems counters.


    It''s not that your either consistent or inconsistent. Instead, there''s a range
    of consistency levels. Some products support just one level; others allow you
    to select from a range of levels for each database operation. Here, cover only
    the two most extreme consistency models. Refer to specific database products for
    a complete list of the consistency guarantees you support.


    ![](img/2afea990c282e97644b1fafcb6223852_235_0.png)'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Chapter 15: Document Databases in the Enterprise


    # Using eventual consistency


    With eventual consistency, a write operation is successful on the server that
    receives it but all replicas of that data aren''t updated at the same time. They
    are updated later by system replication settings.


    Some databases provide only eventual consistency (Couchbase), whereas others allow
    tuning of consistency on a per operation base, depending on the settings of the
    originating client request (MongoDB, Microsoft DocumentDB).


    Most social networks use this consistency model for new posts. This model gives
    you very fast write operations, because you don''t have to wait for all replicas
    to be updated in order for the write operation to be complete. Inconsistency tends
    to last only a few seconds while the replicas catch up.


    # Using ACID consistency


    ACID consistency is the gold standard of consistency guarantees. For a full definition
    of ACID consistency, refer to Chapter 2. An ACID-compliant database ensures that


    +   - All data is safe in valid failure.

    - Database updates always keep the database in a valid state (no conflicts).

    - One set of operations doesn''t interfere with another set of operations.

    - Once the save completes, reading data from any replica will always give the
    new "current" result.


    Some ACID databases go further and allow changes to be executed within the same
    transaction. These changes are applied in a single set, ensuring consistency for
    all documents affected.


    Consistency is achieved by shipping all the changes you want from the server where
    a transaction is started, to each replica, applying the changes, and if all is
    well the transaction completes. If any one action fails, the entire transaction
    of changes is rolled back on all replicas. Transaction roll back ensures the data
    is kept in a consistent state.


    MarkLogic Server provides ACID transactions both on the server-side (when applying
    a set of changes in a single operation) and across several client requests in
    an application (when applying each change individually, then having a user select
    ''apply''). Microsoft''s DocumentDB provides ACID transactions only on the server-side,
    when executing a JavaScript stored procedure.'
