    # Trading consistency for speed


    In many mobile and social applications, the latest data doesn''t return with every
    query; however, that''s no great loss if, for example, you get a new follower
    on Twitter and the count of followers doesn''t update for, say, six seconds. This
    inconsistency means that the database doesn''t have to update the master node
    and the replicas (typically two) during a write operation.


    Trading consistency in a document database like MongoDB means that the database
    doesn''t have to update the master node and the replicas during a write operation.
    MongoDB also supports writing to RAM and journaling to disk, if you want durability
    of data with eventual consistency to replicas then MongoDB can be used for this.
    This allows MongoDB to provide high speeds.


    MongoDB currently locks its database file on each MongoDB instance when performing
    a write. This means only one can write at a time (although this issue will be
    addressed in version 2.8). Even worse, all reads are locked until a write completes.
    To work around this problem, run multiple instances per server (perhaps one per
    CPU cores). This approach is called micro-sharding.


    ![](img/2afea990c282e97644b1fafcb6223852_265_0.png)


    Normally you operate one instance of a NoSQL database per server and manage multiple
    shards on server (as discussed in Chapter 15) — with MongoDB micro-sharding you
    have to run multiple copies of MongoDB on each server, with a single shard. This
    is of a higher CPU and I/O load on the server.


    Consistency levels aren''t enforced by the MongoDB server; they are selected by
    the client API driver, which allows clients to selectively choose the consistency
    for their writes and reads.


    To ensure that all replicas are updated and that the data is completely flushed
    to disk before an operation completes, you can select the ALL replicas option
    for the write operation.


    Similarly, you can set read consistency options. For example, you can ask for
    a majority of replicas, or all replicas, to agree on the "current" state of a
    record for the read operation before a copy of the record is returned to the client.'
