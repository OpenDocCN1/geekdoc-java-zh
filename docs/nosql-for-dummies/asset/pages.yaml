  md: '# Part I: Getting Started with NoSQL


    # Security


    Although security is a concern for all applications, it''s a particular concern
    for certain types of applications. Earlier I talked about how a failed system
    can harm financial services and government entities; the same is true in terms
    of security for their databases.


    When to comes to security-related issues, you can choose from a variety of approaches.
    In this section, I cover issues and approaches particularly to the security of
    NoSQL databases.


    If you think that you can implement security in a layer of an application layer
    rather than in the database, you''re right. However, why spend the time, effort,
    and money required to do so if you can purchase a database with built-in security
    features?


    Doing otherwise risk making security an afterthought, with programmers spending
    most of their time on end-user features rather than fundamental system architecture
    while ensuring security of data.


    ![](img/2afea990c282e97644b1fafcb6223852_97_0.png)


    Given the amount of money you would spend writing security features and the risks
    to your reputation if you wanted to have a security breach, I recommend a security
    in depth approach. That is, buy a product with security features you need built
    in, rather than try to develop them yourself or rely on application developers
    to do so.


    # Role-based access control


    One of the most common methods of securing data is to assign each record (or document
    or graph, depending on your database type) with a set of permissions linked to
    roles. This is role-based access control, or RBAC for short.


    Consider a news release for a website that is being stored in a document (aggregate)
    NoSQL database. The editor role may update permissions for the document, whereas
    a more public role may have only read permissions.


    This use case assigning role permissions, not user permissions. Users can be assigned
    to one or more roles. Thus, users inherit permissions based on the sum of their
    roles.


    Having to create a role in order to give a user permission to perform a particular
    function may seem like extra work, but this approach is very useful. Consider
    a user who moves to another department or leaves entirely. You don''t want to
    have to look manually for every document whose permissions mention this user and
    change or remove them. Instead just change that'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# Chapter 3: Evaluating NoSQL


    user''s role assignments in a single operation. Using role-based access control
    (RBAC) is much easier for long-term maintenance of security permissions.


    Watch how databases handle permissions and role inheritance. Consider underwriters
    in an insurance company, where there may be trainee, junior, and senior underwriters,
    each with increasing access to different types of information.


    You could assign the junior permissions the trainees are assigned, plus a few
    more. Then you could assign all the junior permissions to senior underwriters,
    plus a few more. If you want to add extra permissions to all these roles, though,
    you have to make three identical changes.


    If you have five levels of roles, that has five copies. Also, every system has
    a multitude of roles like these. Personally, I am far too lazy to perform the
    same mundane task over and again. Plus, it wastes an employee''s time and the
    organization''s money.


    There is a better way: Role inheritance.


    Some systems include role inheritance. In this case, the JuniorUnderwriter role
    inherits from the Traineerole, and the SeniorUnderwriter inherits from the JuniorUnderwriter
    role. Now all you need to add a permission to all roles is to add it to only the
    SeniorUnderwriter role (the lowest level of inheritance), and all roles will inherit
    the permission. Role inheritance is much easier to understand and maintain.


    Role permission is generally implemented with OR logic. That is, if you assign
    three roles — RoleA, RoleB, and RoleC — to a record with permission, a user has
    this permission if he is RoleA OR RoleB OR RoleC. If you don''t assign read permissions
    to a record, then no user has read permissions on that record (inheritance aside,
    of course).


    # Compartment security


    For the vast majority of systems, OR logic is fine. There are some instances,
    however, where you want to use AND logic. In other words, a user must have all
    of the TopSecret, OperationBuyNoSQLDatabase and UKManagement roles in order to
    read a particular document.


    This capability is variously referred to as compartment security (MarkLogic Server)
    or cell level security (Apache Accumulo).


    In government systems, you may have several compartments. Examples include classification,
    nationality, operation, and organizational unit.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# 82 Part I: Getting Started with NoSQL


    Each compartment has several roles. Classification, for example, may have unclassified,
    confidential, secret and top secret roles linked to this compartment.


    A record is compartmentalized if it requires one or more roles that are members
    of a compartment to have a permission on the record. A record may have TopSecret:Read
    assigned to its permissions. Another record may have only British:Read assigned.
    A third record, though, may require both TopSecret:Read and British:Read.


    Compartment security is different from normal RBAC permissions in that you must
    have both TopSecret and British roles to receive the read permission (AND logic).
    Normal RBAC requires only one of these roles (OR logic).


    Although compartment security may sound like a very useful feature, it''s probably
    vital for military systems, many systems are implemented without requiring this
    feature.


    # Attribute-based access control (ABAC)


    A useful pattern for security is to apply permissions based on data within a record
    rather than separately assign permissions to the record. This could be based on
    either metadata, individual column (Bigtable clones), or element (Aggregate NoSQL
    databases) values.


    A good example is a customer name mentioning within a document. You may want to
    restrict access to all the documents mentioning customer to only those people
    with access to this customer''s information. You can restrict access to these
    documents by processing the data within the document, and applying the relevant
    security permissions based on the value of that data.


    NoSQL databases provide this capability right out of the box. That''s because
    permissions must be assigned to the record after the data is saved by the application
    before it''s available for retrieval by other applications or users. So, permission
    assignment must occur within the transaction boundary.


    Also very few NoSQL databases support ACID-compliant transactions (MarkLogic,
    FoundationDB, do for example). You can find examples of ACID NoSQL databases in
    Chapters 4 and 21, where I provide a broader discussion about ACID compliance.


    If a database doesn''t support out-of-the-box assignment of permissions based
    on data within a document but does support ACID transactions and pre-commit triggers,
    then an easy workaround is possible.'
