  md: '# Chapter 1: Introducing NoSQL: The Big Picture


    Rather than insert rows in a variety of tables in a relational database, you can
    instead store a single structure for all of this order information — say, as a
    JSON or XML document.


    This brings up question, “Do you really need relationships if all your data is
    stored in a single record?” For a lot of applications, especially ones that need
    to store extra state for point in time, such as financial transactions, the answer
    is “No.” However, if you''re experienced with relational databases, you may have
    stored the same information more than once, there''s an obvious drawback to storing
    information in this way.


    In relational database theory, the goal is to normalize your data (that is, to
    organize the fields and tables to remove duplicate data). In NoSQL databases —
    Document or Aggregate databases — you often deliberately denormalize data, storing
    some data multiple times.


    You can store, for example, “Customer Delivery Address” multiple times across
    many orders a customer makes over time, rather than store once and refer to it
    in multiple orders. Doing so may require the database extra storage, and a little
    forethought in managing in your application. Why do you do it?


    There are two advantages to storing data multiple times:


    +   - **Easy storage and retrieval**: Just save and get a single record.

    - **Query speed**: In relational databases, you join information and add constraints
    across tables at query time. This may require the database engine to evaluate
    many tables. The more query constraints you have across different tables, the
    more you reduce your query speed. (This is why RDBMS precomputed views.) In a
    NoSQL database, all the information you need to evaluate your query is in a single
    document. Therefore, you can quickly generate the list of matching documents.


    Relational views and NoSQL denormalizations are different approaches to the problem
    of data across records. In NoSQL, you may have to maintain multiple denormalizations
    representing different views of the same data. This approach increases the cost
    of storage but gives you much better query time.


    Given the ever-reducing cost of storage and the increased speed of development
    and querying, denormalized data (aka materialized views) isn''t a killer reason
    to discount NoSQL solutions. It''s just a different way to approach the same problem,
    with its advantages and disadvantages.


    ![](img/2afea990c282e97644b1fafcb6223852_32_0.png)


    Again, there is an exception to this rule! Triple stores and graph databases have
    the basic concept of relationships. The difference is that every single record
    (a triple consisting of three things — subject, predicate, and object — such as
    “Adam likes Cheese”) contains a relationship.'
