  md: '# Part I: Getting Started with NoSQL


    # A Brief History of NoSQL


    The perception of the term NoSQL has evolved since it was launched in 1998. So,
    in this section, I want to explain how NoSQL is currently defined, and propose
    a more appropriate definition for it. I even cover NoSQL history background in
    the side bars.


    # Amazon and Google papers


    NoSQL isn''t a single technology invented by a couple of guys in a garage or a
    mathematician theorizing about data structures. The concepts behind NoSQL developed
    slowly over several years. Independent groups then took those ideas and applied
    them to their own data problems, thereby creating the various NoSQL databases
    that exist today.


    # Google Bigtable paper


    In 2006


    Similar to an RDBMS model at first sight, Bigtable stores rows with a single key
    and data within related column families. Therefore, accessing all related data
    is as easy as retrieving a record by using an ID rather than a complex join, in
    relational database SQL.


    This model also shows that distributing data is more straightforward than relational
    databases. Using simple keys, related data — such as all pages on the same website
    (given as an example in Google''s paper) — can be grouped together, which increases
    the speed of analysis. You can think of Bigtable as an alternative to many tables
    with relationships. That is, with Bigtable, column families allow related data
    to be stored in a single record.


    Bigtable is designed to be distributed on commodity servers, a common theme for
    all NoSQL databases created after the information explosion caused by the adoption
    of the World Wide Web. A commodity server is one without complex bells and whistles
    — for example, Dell or HP servers with perhaps 2 CPUs, 8 to 16 cores, and 32 to
    96GB of RAM. Nothing fancy, lots of them, and cheaper than buying one big server
    (which is like putting all your eggs in one expensive basket).'
