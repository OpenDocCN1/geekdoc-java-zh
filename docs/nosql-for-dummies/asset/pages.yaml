    # Securing Cassandra


    DataSt Enterprise offers a range of security features for Cassandra. All data
    communications are encrypted over SSL, be they internal gossip data or international
    replication over servers.


    Client-to-node encryption is also supported, along with Kerberos authentication
    and internally stored authentication information.


    Particularly is the built-in support for encryption of data at rest. This feature
    has its limitations, though, the commit logs, for example, are not encrypted;
    operating system-level encryption is required for this.


    More seriously, the certificates used for encryption of data within the SSTable
    structures are stored on the same file system rather than a security device. Practically
    speaking, this means access to the underlying file system needs to be secured
    anyway. In extreme scenarios, operating system-level or disk-level management
    may be a better choice for encryption at rest.'
