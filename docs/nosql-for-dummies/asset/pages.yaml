  md: '# Chapter 17


    # Document Database Products


    In This Chapter


    +   - Replacing memcache

    - Providing a familiar developer experience

    - Delivering an end-to-end document platform

    - Creating a web application back end


    > If you''ve decided that a document-orientated, schema-free, tree-structured
    approach is for you, then you have several choices because many great and varied
    document NoSQL databases are available. But the question of course, is which one
    to use?


    Perhaps your organization requires the ability to scale out for high-speed writes.
    Maybe, instead, you have only a few documents with high-value data. Perhaps you''re
    looking for a relational database that your developers are familiar with.


    Because the fundamental designs of databases differ, there''s no one-size-fits
    all approach. These designs are neither wrong nor right; they''re just different
    because each database is designed for a different use. They become "wrong" only
    if they''re applied to the wrong type of problem.


    In this chapter, I explain how to make the choice that suits your needs.


    # Providing a Memcache Replacement


    Memcache is an in memory caching layer that is frequently used to speed up dynamic
    web applications by lowering database query load.


    In some web applications, you must provide an in-memory storage layer — to offload
    repeated reads from a back-end operational database server or,'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Part IV: Document Databases


    alternatively, to store transient user session data that lives only while a user
    is on a website.


    Memcached was the original open-source, in-memory key-value store designed for
    this purpose. It provides either an in-memory store within a single web application''s
    memory space, or a central service to provide memory caching for a number of application
    servers.


    Other similar open-source and commercial options exist. Oracle Coherence is a
    sophisticated offering, along with Software AG''s Terracotta. Hazelcast is a popular
    open-source in-memory NoSQL option. Redis can also be used for in-memory caching
    (refer to Part II for more key-value stores).


    ![](img/2afea990c282e97644b1fafcb6223852_251_0.png)


    # Ensuring high-speed reads


    The primary purpose of a memcache layer is to attain high-speed reads. With memcache,
    you don''t have to communicate over the network with a database layer that must
    read data from a disk.


    Memcache provides a very lightweight binary protocol that enables applications
    to issue commands and responses to high-speed reads and write operations.


    This protocol is also supported by other NoSQL databases. Couchbase, for instance,
    supports this protocol natively, allowing Couchbase to be used as a shared service
    drop-in replacement for memcache.


    # Using in-memory document caching


    Couchbase as a memcache replacement ensures that cached data is replicated quickly
    around multiple data centers, which is very useful, for example, when a news story
    is prompting numerous views and tweets. With Couchbase, you can prevent increasing
    the load on the server by caching this popular story in memory across many servers.


    Couchbase is a document NoSQL database, it also supports setting indexes on complex
    JSON structures. Memcache doesn''t provide this type of aggregate store structure;
    instead, it concentrates on simpler structures as sets, maps, and intrinsic types
    like strings, and so on.


    Couchbase is particularly useful when a web application retrieves a cached news
    item by a page''s URL or by the latest stories on a particular topic. Because
    Couchbase provides views and secondary indexes, you can execute exact-match queries
    against data stored in memory.


    ![](img/2afea990c282e97644b1fafcb6223852_251_1.png)'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Chapter 17: Document Database Products 235


    # Supporting mobile synchronization


    Increasingly, services such as Evernote, SugarSync, and Dropbox require that data
    be stored locally on a disconnected device (like a cell phone) for later synchronization
    to a central cloud service. These services are particularly critical when devices
    like cell phones and laptops are disconnected from a network, for oil rigs, environmental
    surveys, or on battlefields.


    The creators of such services don''t design their own communication and synchronization
    protocols, probably because doing so is costly, slow, and bug-prone. The good
    news is that Couchbase has you covered via Couchbase Mobile, which works on mobile
    devices. Its internal master-master replication protocol allows many different
    devices to sync with each other and with a central service.


    # Evaluating Couchbase


    Couchbase provides good support for high-speed writes like a key-value store,
    while also eventually storing data on disk. Its primary use is for always-on connection
    to clusters and devices.


    Couchbase, however, isn''t an ACID-compliant database. There are short windows
    of time when data is held in memory on one machine but not yet saved to disk or
    saved on other machines. This situation means less than a few seconds could be
    lost if a server fails.


    Couchbase views are the basis of indexing. If you need secondary indexes, then
    you must create a design document and one or more views. These are updated asynchronously
    after data is eventually written to disk.


    > TIP If data loss and inconsistent indexes are big issues in your situation,
    I suggest waiting for the upcoming version 3.0, which will provide streaming replicas
    between memory without waiting for disk checkpointing. It will also allow updating
    queries directly from memory. Combining these capabilities with consistent use
    of the PersistTo flag on save and the stale-false flag on read will reduce at
    the cost of speed. These settings are easy to find on the Couchbase documentation
    website (http://www.couchbase.com/documentation/), so you will have to read the
    API documentation for the details.


    ![](img/2afea990c282e97644b1fafcb6223852_252_0.png)


    Couchbase is likely hard to beat in terms of speed in the document NoSQL database
    realm. This speed comes at the cost of consistency and durability with a lack
    of automatic indexing and data querying features. Range queries (less than, greater
    than) aren''t supported at all.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# 236 Part IV: Document Databases


    Couchbase restricts you to only three replicas of data. In practice, this is probably
    as many replicas as you want, but all the same, it is a restriction.


    If speed is king in your situation — if you''re using JSON documents, if you want
    a memcache replacement, or perhaps you need a persistence layer for your next
    gazillion-dollar generating mobile app — then Couchbase be for you.


    ![](img/2afea990c282e97644b1fafcb6223852_253_0.png)


    # Providing a Familiar Developer Experience


    Developers are picky folks. We get stuck in our ways and want to use technologies
    that we''re familiar with, and not dirty or weird in some way, although esoteric
    code may just be the thing for some people, which may be there are so many different
    databases out!


    To get developers on board, you need to provide things that work the way developers
    expect them to. A database needs to be easy to start with, and it needs to provide
    powerful tools that don''t require lots of legwork — and that they can put to
    use in, say, about five minutes.


    # Indexing all your data


    Having a schema-free database is one thing, but in order to have query functionality,
    in NoSQL databases you must set indexes on specific fields. So you''re really
    "teaching" the database about the schema of your data.


    Microsoft''s DocumentDB (for JSON) and MarkLogic Server (for JSON and XML), however
    both provide a universal index, which indexes the structure of documents and the
    content of that document''s elements.


    DocumentDB provides structural indexing of JSON documents and even provides range
    queries (less, greater than operations) alongside the more basic equal/not operations.
    DocumentDB does all this automatically, without having to "teach" the database
    about the prior existence of your documents'' structure.'
