  md: '# Part V: Graph and Triple Stores


    OrientDB also enables you to create triples that relate documents based on their
    data. Say that you have a JSON order document that has a list of order items.
    These order items could have a "product-id" field related to the "-id" field within
    a document. You can configure OrientDB to automatically use this information for
    facts about their relationship. Even better, if you want to present a single order
    document containing all related data, you can request OrientDB to do so at fetch
    time.


    LogicServer provides different document and triple functionality. You can embed
    semantic facts within XML documents. These facts are still available in any standard
    semantic (SPARQL) query. Then, if the document is updated, the facts are updated.
    No need for a separate and RDF-only way to update facts. This approach is particularly
    useful when you''re using an entity enrichment process with products like TEMIS,
    SmartLogic, and OpenCalias. You can take the output from processes and store them
    as document. Here your semantic work is done — all the facts and the original
    source is indexed.


    ![](img/2afea990c282e97644b1fafcb6223852_313_0.png)


    LogicServer''s internal XML representation of facts doesn''t use RDF/ XML. This
    means you must store these in document-facts as simple:triple elements. This implementation
    detail is hidden when you use standard interfaces like the W3C Graph Store and
    SPARQL protocols.


    ArangoDB allows you to store documents and triples. It uses a document to store
    triples, much like LogicServer does. These are specific classes of documents in
    ArangoDB, though. ArangoDB doesn''t support embedding triples within documents
    like LogicServer or automatically inferring document relationships with OrientDB.


    # Combining documents in real time


    OrientDB''s capability to hold the relationships of documents to one another based
    on property values in their data is very useful. It allows you to update individual
    documents but request a full compound document as required.


    OrientDB provides a lazy loading method for fetching these documents and populating
    Java objects with this data. This makes processing the main fact fast while providing
    the entire graph of object relationships to the programmer.


    OrientDB also allows the specification of a fetch plan. This allows you to customize
    how data is loaded when following these document relationships. If you know, for
    example, that a list of related content needs only the first linked documents,
    then you can specify that. You can restrict the data returned to the field level
    for each object.'
