  md: '# Chapter 25: Search Engines in the Enterprise


    A relational database has a very different security model from an enterprise content
    management system, which in turn differs from a network file share.


    Being able to reconcile roles and users in one system with users in other systems
    is vital to ensuring the security of data. If this is not correct, then the best
    case is that only the existence of a document (for example, its title or source
    ID) is revealed in the search results. This is called a *false positive*, when
    users try to access the source document, they''re told they don''t have permission
    to do. For high-security systems, you don''t even want users to know the document
    exists!


    Now for the worst scenario. If someone uses the "right" secured words in a query,
    entry paragraphs of the should-be-secured document are revealed in the snippets
    of the search results! A "snippet" showing text that matches a query may contain
    30 words. A user could keep typing the last three words in each snippet to reveal
    the next 30 words — until the document is read!


    In an enterprise search application, it''s vital that a standard security model
    and auditing checks are created and enforced in order to prevent data leakage.
    To a certain extent, a consolidated single database is easier to secure (if security
    of records is provided by the database itself) than multiple systems linked to
    a single search engine through role mappings.


    # Creating a Search Application


    Search has become the default way we find all information on websites. You no
    longer click through departments and categories on websites you want; instead,
    you simply type a description of what you''re looking for in a search bar.


    Providing a user-friendly search experience, therefore, is vital in ensuring that
    customers find your products quickly and that the product is right for them, and
    it pays you in terms of sales.


    In this section, I discuss how users access a system, both from an interface usability
    standpoint and in common search engine features used to aid users in locating
    the most relevant results.


    # Configuring user interfaces


    Many enterprise search engines provide their own web application for searching
    through their catalogs. You can configure your application to that'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# 330 Part VI: Search Engines


    it''s branded, and you can design your navigation system according to your website''s
    user-interface styles and layout.


    Some search engines provide widgets — small pieces of JavaScript application code
    — that you can embed into your website. This is a good approach if you want fine
    control over how the site looks, but don''t want to write a web application entirely
    from scratch.


    Other search engines, especially those embedded within databases, provide an API,
    which gives you an easy way to access advanced search functionality, without having
    to create the entire user interface.


    However, for complex custom applications, you may have to live with the API approach
    and writing your own application; otherwise, your website might wind up looking
    like a competitor''s.


    # What a good search API gives you


    Users don''t just want an empty text field in which to type search text. They
    need guidance on what terms or phrases to use, and how to drill into search results.
    A good search API provides some or all of the following features:


    +   - Suggestions: Phases or criteria that appear as the user types. The suggestions
    could be phrases from search indexes or could be based on previously or commonly
    used terms.


    +   - Facets: A listing of fields and the most common values for them from the
    matching search results. They show values for particular fields in the whole search
    result (not just the results in the first page) and how common that value is.
    Facets are great for narrowing result sets.


    +   - Grammar: A rich default or configurable search grammar that is to use and
    expressive in the ease of control over the search experience that the users have
    when using it. Here are some examples:


    +   - Double quotes to specify phrases


    +   - AND or OR keywords with parentheses to indicate complex Boolean logic


    +   - The negation character (-) to exclude a search term


    +   - Snippets: For text searches. Snippets are one or more short sections of
    the matching text with the matching search terms highlighted.'
