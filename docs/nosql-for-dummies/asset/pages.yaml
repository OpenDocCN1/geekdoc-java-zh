  md: '# Chapter 30: Hybrid Databases in the Enterprise


    Many NoSQL systems don''t immediately ensure that all their data is held on a
    second node in the cluster. Many, instead, distribute data after it''s saved.
    This approach is called being eventually consistent, which could cause you to
    lose data.


    Every day and more NoSQL databases support ensuring that their replicas are up
    to date within the bounds of a database update. This requires a two-phase commit,
    which is basically committing the change locally and then to a second node (or
    more) before confirming to the client that the update transaction is complete.
    MarkLogic Server is an example of a hybrid NoSQL database that supports two-phase
    commits within a cluster.


    Between clusters are geographically dispersed, though the norm is to provide eventually
    consistent replicas. Eventual consistency between clusters is even out the lags
    or lag time for data between clusters. If you don''t even out out replicating
    to another cluster over the Internet will slow down local site database operations.
    This is the tradeoff of consistency versus lag time often made in multi datacenter
    replication.


    Using a separate cluster that is available for use only when the first cluster
    becomes unavailable is referred to as disaster recovery (DR). One or more DR sites
    can be replicated to, ensuring maximum service availability if the replicas are
    a few seconds out of date.


    Having ACID compliant replicas within a cluster provides resilience in case of
    hardware failure. Having cross site DR database replication means you don''t have
    to worry about a single site being unavailable. Ensuring your chosen hybrid NoSQL
    database supports both of these mechanisms ensures maximum service availability.


    # Operating in high-security environments


    When using separate pieces of technology and gluing them together, one of the
    more subtle (but infuriating!) problems you''ll come upon is an impedance mismatch,
    which is when different systems have a different view of the same data or concept.


    When it comes to security, this mismatch is most obvious between document databases
    and search engines. Many NoSQL databases support record-level (document) security.
    Some databases can also be used to enforce label-based access control (LBAC) within
    documents. This means part of a document may require a higher level of security
    permissions, or roles, to access others.'
  merge: -1
  pgno: 390
- img_proc: true
  md: '# 374 Part VII: Hybrid NoSQL Databases


    Separate search engines typically provide security at either the collection (set
    of documents) or document level. These two mechanisms therefore support access
    to the same information at different levels of granularity. Most of the search,
    engines updates lag behind the updates of the database they''re linked to, which
    means that indexes are also out of date.


    The best you can hope for in this case is a false positive pointer to a document.
    With a false positive pointer, a document ID or name is returned in the result
    set, showing you a document that you don''t have clearance for, or to a document
    which security labels have not yet been applied (and thus visible to all).


    The worst kind of scenario is one in which a document is marked as “Confidential”
    with a section within it marked as “Top Secret,” and the top secret portion is
    leaked. Perhaps typing a word that shows a user with confidential-level access
    the full content of that paragraph in the search snippet. The top secret section
    shows up because the user has the appropriate level of access for the document,
    but the search engine doesn''t “understand” that sections in documents may require
    higher security levels.


    A hybrid NoSQL database that enforces the same security policies, roles, and permissions
    means this mismatch is impossible. Whether you fetch a document by ID (an example
    of a database operation) or it happens to match a text phrase (an example of a
    search operation) is irrelevant. The hybrid NoSQL database will always enforce
