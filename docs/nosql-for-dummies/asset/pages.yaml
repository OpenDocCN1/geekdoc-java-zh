  md: '# 298 Part V: Graph and Triple Stores


    # Evaluating ArangoDB


    ArangoDB is the most popular NoSQL database available that has an open-source
    license and provides both document store and triple store capabilities. These
    two features aren''t deeply linked, but they can be used together, if required.


    ArangoDB claims to be an ACID-compliant database. This is true only for the master.
    ArangoDB writes to the master, but replicas receive changes on an asynchronous
    basis. As a result, client code gets an eventually consistent, non-ACID view of
    the database, unless it accesses the master.


    ArangoDB, like many NoSQL databases in this book, also supports sharding of the
    triple store. This allows very large databases to be split across (relatively)
    cheap commodity servers.


    Unlike triple stores, ArangoDB does support graph query functions such as shortest
    path and distance calculation. Careful management of sharding to ensure efficient
    performance of distributed graph queries and to avoid (relatively slow) network
    trips to other servers to complete a simple graph query.


    ArangoDB also supplies its own Annotation Query Language (AQL), eschewing support
    for RDF and W3C standards like SPARQL.


    ArangoDB is an appropriate choice if you want a single eventually consistent cluster
    that provides JSON document storage and triple store features in the same product,
    and if you need an open-source license.


    # Evaluating OrientDB


    OrientDB is a very interesting NoSQL database. It''s fully ACID-compliant and
    can run in fully serializable or read committed modes. Its high availability replicas
    are all updated with ACID consistency, ensuring that all data is saved and all
    replicas have the current view of data.


    Even more interestingly, OrientDB uses the open-source Hazelcast in-memory NoSQL
    database to provide high availability replication. I didn''t include Hazelcast
    in this book because it''s in-memory only — it doesn''t store data to disk, and
    thus isn''t fully durable. However, it''s a very promising ACID-compliant NoSQL
    technology, as evidenced by its use in OrientDB.


    ![](img/2afea990c282e97644b1fafcb6223852_315_0.png)


    ![](img/2afea990c282e97644b1fafcb6223852_315_1.png)'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# Chapter 22: Triple Store Products 299


    OrientDB has an impressive array of features. JSON, binary, and RDF storage are
    all supported. It also allows (optionally) you to enforce schema constraints on
    documents within it.


    OrientDB also has a range of connectors for both ingestion and query. Several
    Extract, Transform, and Load (ETL) connectors are available to import data from
    elsewhere (JDBC, row, and JSON). In addition, a Java Database Connectivity (JDBC)
    driver is available for querying; it allows OrientDB to be queried like any relational
    database or via the Persistence API (JPA) in the Java programming language.


    You must manage sharding by manually configuring several partitions (called clusters,
    confusing in OrientDB) and explicitly specifying which partition you want each
    record saved to. This forces a manual check on the application developer to ensure
    consistent performance cluster-wide.


    OrientDB has great support for compound JSON documents through its interleaved
    semantics and document capabilities.


    A community license is available under Apache 2 license, though most functionality
    is available only in the commercial edition. Favorable commercial licensing terms
    are also available for startups or small organizations.


    OrientDB also doesn''t support open standards integration such as RDF data import/export
    or SPARQL query language support. Instead, it provides its own customized HTTP
    and JSON-based API for these functions.


    If you need a JSON database with triple support and compound documents, then OrientDB
    could be the database for you.


    # Evaluating MarkLogic Server


    MarkLogic Server is a long-established database vendor; it emerged in 2001 as
    a provider of an XML database with enterprise search technology built in. MarkLogic
    Server predates the modern usage of the term “NoSQL”, although its architecture
    is densely similar to that of newer NoSQL databases.


    MarkLogic Server''s triple store is built upon a document NoSQL database foundation.
    Triples are stored as XML in documents. A special triple index (actually several
    indexes) ensures that queries across facts held in these documents, or embedded
    within XML documents, are available at speed in semantic (SPARQL) queries.'
