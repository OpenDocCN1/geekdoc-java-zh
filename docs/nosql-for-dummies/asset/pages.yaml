  md: '# Chapter 17: Document Database Products


    # Ensuring consistent fast reads and writes


    At the risk of repetition — boring you to tears — I say once again that providing
    very fast transaction times while maintaining ACID guarantees durability and consistency
    is no easy thing.


    Many NoSQL databases that I cover in this part of the book, and indeed entire
    book, don''t provide these guarantees in order to achieve higher throughput. Many
    mission-critical systems require these features, so, it''s worth mentioning some
    approaches to achieving these guarantees while ensuring throughput.


    Logic Server writes all data to memory and writes only a small log of the changes
    to disk, which ensures the data isn''t lost. If a server goes down, the journal
    is replayed, restoring the data. Writing a small journal, rather than all the
    content, to minimize the disk I/O requirements when writing data, increasing overall
    throughput.


    Many databases also lock information for reads and while a write operation is
    updating a particular document. MongoDB currently locks the data within a given
    instance of MongoDB: (Although this will change with upcoming versions of MongoDB.)


    To avoid this, Logic Server uses the tried-and-true approach called multi-version
    concurrency control (MVCC). Here''s what happens if you have a document at an
    internal timestamp version of 12:


    +   1. When a transaction starts and modifies the data, rather than data, an entirely
    new document is written.


    Therefore, the database doesn''t have to lock people out for reads. All reads
    that happen after the transaction begins, but before it finishes, version 12 of
    the document.


    +   2. Once the document transaction finishes, the new version is given the timestamp
    version of 13:


    +   * All reads that happen after this point are guaranteed to see only version
    13.


    +   * Replicas are also updated within the transaction, so even if the primary
    server fails, all replicas will agree on the current state of the document.'
