    It’s worth reading the small print of these vendors’ customer success stories:


    +   - If a database is used to store customer orders and transactions, then it’s
    a mission-critical enterprise system.


    +   - If a database is used behind an internal staff sharing wiki page, then it’s
    most definitely not a mission-critical application.


    Some systems fall in between the preceding definitions of enterprise and nonenterprise
    systems. Consider, for example, a database that caches thumbnail'
