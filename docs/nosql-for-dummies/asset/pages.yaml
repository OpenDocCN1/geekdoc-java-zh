  md: '# Part V: Graph and Triple Stores


    If you''re experienced with the Structured Query Language (SQL) of Relational
    Database Management Systems (RDBMS), the Cypher query language will be familiar.
    An example of a cypher query is shown in Listing 22-1, in which all actors who
    performed in any movie with the title Top Gun are found.


    # Listing 22-1 Example Cypher Query


    ```

    MATCH (a:Movie {title: ''Top Gun''})

    OPTIONAL MATCH (a)-[r:ACTS_IN]->()

    RETURN r

    ```


    This query shows an optional match query. The query returns the Top Gun movie
    node and all actors in the movie.


    Neo4j enables very sophisticated programming, including the programming of each
    loop, create, merge, and delete operation.


    ![](img/2afea990c282e97644b1fafcb6223852_323_0.png)


    Neo4j is an interesting web page on modeling (shredding) different data structures
    in a graph store. You can find it here: http://neo4j.com/docs/2.1.5/tutorial-comparing-models.html


    # Evaluating Neo4j


    Neo4j is the open-source graph store. It provides ACID-compliant transactions
    on the primary master node. Writes can be arranged at any node in a highly available
    cluster, with a two-phase commit ensuring that the master always has the latest
    copy of the data in the cluster.


    The default isolation level is read committed. This means that long-running transactions
    will see information in other transactions that occur the same time period as
    the long-running transaction. For a long, running transaction that performs the
    same query twice — once at the start of a transaction and once at the end — both
    queries in the same transaction could see different views of the data for the
    same query.


    ![](img/2afea990c282e97644b1fafcb6223852_323_1.png)


    Not all replicas are kept in sync with the master in all situations, though "optimistic
    transactional consistency." That is, if the replica updates-can''t be updated,
    the transaction still commits to the master. The replica will be updated later
    on. Thus replicas are eventually consistent.


    Neo4j provide a range of graph operations including shortest path, Dijkstra, and
    A* algorithms. Neo4j also provides a graph traversal API for managing sophisticated
    graph operations.'
