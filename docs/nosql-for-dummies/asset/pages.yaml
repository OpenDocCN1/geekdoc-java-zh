  md: '# Part I: Getting Started with NoSQL


    ACID-compliant transaction means the database is designed so that it absolutely
    will not lose data:


    ![](img/2afea990c282e97644b1fafcb6223852_35_0.png)


    +   - Each operation moves the database from one valid state to another (Atomic).

    - Everyone has the same view of the data at any point in time (Consistent).

    - Operations on the database don''t interfere with each other (Isolation).

    - When a database says it has saved data, you know the data is safe (Durable).


    Not NoSQL databases have ACID transactions. Exceptions to norm are FoundationDB,
    Neo4j, and MarkLogic Server, which provide fully serialized ACID transactions.


    So why do include ACID compliance as a not-so-common feature? The Oracle DBMS
    was released, it didn''t provide ACID compliance either. It took seven versions
    before ACID compliance was supported across multiple data-bases and tables.


