  md: '# Part V: Graph and Triple Stores


    # Cache-based sharding


    If your dataset is very large, you need to carefully manage what data is loaded
    into Neo4j''s memory to be sure you''re not constantly adding and removing data
    from the caches.


    A good way of doing so is to send particular API calls to the same server. You,
    for instance, know that user A performs a lot of operations on the same set of
    nodes. By always directing this user to the same server, you ensure that the user''s
    data is only on a single server''s cache. This approach in Neo4j is called cache-based
    sharding. Remember, it''s the cache that is sharded, not the Neo4j database itself.


