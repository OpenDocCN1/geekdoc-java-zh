  md: '# 70 Part I: Getting Started with NoSQL


    Doing results in a more granular search. It also allows faceted navigation. If
    you go to Amazon and search for Harry Potter, you''ll see categories for books,
    movies, games, and so on. The product category is an example of a facet, which
    shows you an aspect of data within the search results — that is, the most common
    values of each facet across search results, even those not on the current page.


    User interfaces can support rich explorations into data (as well as Google-esque
    searches). Users can also utilize them to save and load pre-searches.


    You can set up saved search criteria so that alerts are activated when newly added
    records match that criteria. So, if a new record arrives that matches your search
    criteria, an action occurs. Perhaps "Putin becomes-Putin-Putin/Person, or perhaps
    an email lets you a new scientific article has been published.


    Not all engines are capable of making every query an alert. Some are limited to
    text fields; others cannot do geospatial filters. Be sure you can handle the alerts
    you need to configure.


    ![](img/2afea990c282e97644b1fafcb6223852_87_0.png)


    # Aggregate functions


    Once you find relevant information, you may want to dig deeper. Depending on the
    source, you might ask how many countries have a GDP greater than $400 billion,
    or what the average age of all the members in your family tree, or where the most
    snake bites occur in Australia. These examples illustrate how analytics are performed
    over a set of search results. These are count, mean average, and geospatial map
    calculations, respectively.


    Being able to make calculations next to the data offers several advantages. The
    first advantage is that you can use the indexes to speed up things. Secondly,
    these indexes are likely to be cached in memory, making them even faster. Thirdly,
    memory indexes are particularly useful for a NoSQL database using Hadoop File
    System (HDFS) storage. HDFS doesn''t do native indexing or in-memory column stores
    for fast aggregation calculations—it requires a NoSQL database on top of this.


    Faceted navigation is an example of count-based aggregations over search results
    show up in a user interface. The same is true for a timeline showing the number
    of records that mention a particular point in time. For example, do you want to
    show results from this year, this month, or this hour?


    If you want this functionality, be sure your database has the ability to calculate
    aggregates efficiently next to the data. Most NoSQL databases do, but some don''t.'
