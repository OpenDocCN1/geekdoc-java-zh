  md: '# # Chapter 19


    # # Common Features of Triple and Graph Stores


    +   **In This Chapter**

    - Architecting triples and quads

    - Applying standards

    - Managing ontologies


    I want to begin this chapter by asking, “Why do you need a triple store or graph
    store?” Do you really need a web of interconnected data, or can you simply tag
    your data and infer relationships according to the records that share the same
    tags?


    If you have a complex set of interconnected data, then you you need to decide
    which functionality you need to support your application. Are you querying for
    data, or trying to mathematically analyze the graph itself?


    In order to get the facts, or assertions, that you require, are you manually adding
    them, importing them from another system, or determining them through logical
    rules, called *inference*? By inference, I mean that if Luke is the son of Anakin,
    and Anakin''s mother is called Shmi, then you can infer that Luke''s grandmother
    is Shmi.


    The tool you select for the job — whether it''s a simple document store with metadata
    support, a triple store, or a graph store — will flow from your answers to the
    preceding questions.


    In this chapter, I discuss the basic model of graph stores and triple stores,
    how they differ, and why you might consider using them.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Part V: Graph and Triple Stores


    # Deciding on Graph or Triple Stores


    I deliberately separated the terms graph store and triple store in this book.
    The reason is pretty simple. Although the underlying structures are the same,
    the analysis done on them is drastically different.


    This difference means that graph and triple stores, by necessity, are architected
    differently. In the future, they may share a common underpinning, but not all
    the architectural issues of distributing multiple machines have been addressed
    at this point in time.


    # Triple queries


    A triple store managed individual assertions. For most cases you can simply think
    of an assertion as a “fact.” These assertions describe subjects properties and
    the relationships between subjects. The data model consists of simple subject
    – predicate – object triples, as shown in Figure 19-1.


    ![](img/2afea990c282e97644b1fafcb6223852_277_0.png)


    This subject – predicate – object triple allows complex webs of assertions, called
    graphs, to be built up. One triple could describe the type of the subject, another
    integer property belonging to it, and another relationship to another subject.


    Figure 19-2 shows a simple graph of subjects and their relationships, but no properties
    for each subject. You can see that each relationship and type is described using
    a particular vocabulary. Each vocabulary is called an ontology.


    Each ontology describes a set of types, perhaps with inheritance and “same as”
    relationships to other types in other ontologies. These ontologies are described
    using the same triple data model in documents composed of Resource Description
    Framework (RDF) statements.


    In graph theory these subjects are called vertices, and each relationship is called
    an edge. In a graph, both vertices and edges can have properties describing them.'
  merge: -1
  pgno: 277
- img_proc: true
