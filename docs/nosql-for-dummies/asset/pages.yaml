  pgno: 243
- img_proc: true
  md: 'Some applications, however, consolidate data from a number of systems within
    an organization, as well as third party or public data, in order to provide a
    more flexible application. This provides for a rich array of information with
    to use for useful business answers.


    Organizations do not control over external data-feed formats, and they can be
    changed at any time without warning. Worse, many structures in use today change
    depending on the application that creates them, rather than the system that stores
    them.


    A good example of this is a tweet. A tweet isn''t just a 140-character message
    — hundreds of friends are behind it, and they vary depending on the application
    that created the tweet.


    In this section, I discuss how this great variety of changing data can be handled
    in a document NoSQL database.


    # Handling variety


    Storing and retrieving variable information is a key benefit of all NoSQL document
    databases. Indexing and searching their structure, though, is difficult.


    Many document databases do not perform these operations natively; they use an
    external search engine as Solr (MongoDB) or Elasticsearch (Cbase) to do so. These
    search engines typically index the text in the document or specifically configured
    elements within the document.


    Microsoft’s DocumentDB and MarkLogic Server both take a different approach. They
    have a universal index that examines the documents as they''re ingested. They
    index the structure as well as the values. This enables you to perform element-value
    queries (exact match queries) as soon as a document is stored.


    Microsoft’s implementation allows you to do range queries (less than, greater
    than, and so on) over this universal index, whereas with MarkLogic server, range
    indexes need to be configured individually.


    This extra indexing, of course, comes at a cost. It takes extra time if you want
    to keep your indexes consistent with your data. It also costs storage space for
    the indexes. Either can increase server and storage costs.


    Both Microsoft’s DocumentDB and MarkLogic Server allow you to configure your indexes
    to a fine-grained level for each database (MarkLogic) or Collection (Microsoft’s
    DocumentDB, which is akin to a “bucket” within a database that manages a set of
    documents).


    ![](img/2afea990c282e97644b1fafcb6223852_244_0.png)'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# Managing change over time


    If you change the format of documents, you need to rework your search index configurations.
    In many search engines, this forces the regeneration of the index of all your
    content! A very costly procedure, indeed.


    MarkLogic Server gets around redoing a reindexing operation by supporting indexes.
    In this way, you can query a single index that is configured to look element A
    in one document and element B in another document—the structure is different,
    but you use a single query to reference the field.


    So, for example as having a separate index for "id" within product documents and
    "prod_id" within other documents, you can have a field called "product_id" that
    will include results from both elements. Doing so would be useful if you were
    searching for a page on a website, as well as comments about page, where you could
    set up an index for "page_name."


    Having to manuallyconfigure indexes delays the handling of new types of content.
    You have to perform index changes before making use of the data. This is where
    a universal index like those in Microsoft''s DocumentDB and MarkLogic Server rarely
    pays dividends.


    Having a universal structural index allows you to search and explore the data
    you''ve ingested and then decide to perform different queries over it. You don''t
    have to manually configure the structure before loading content in order to search
    it immediately.


    Where Microsoft''s implementation has the advantage is in automatic range queries
    because you can perform less and greater than data operations over numbers and
    dates.


    Where MarkLogic''s implementation has the advantage is in providing full-text
    search over all content in addition to structure and values. This supports stemming
    "cat" and "cats" stem to "cat" and word searches and have configurable diacritic
    support for languages with interesting dots and dashes over their letters.


    MarkLogic Server also includes specialized support for many world languages and
    is configurable at runtime for specific query needs. An example is a search that
    is or isn''t case-sensitive or diacritic-sensitive or that ignores includes particular
    characters as word boundaries.'
