  md: '# Chapter 2: NoSQL Database Design and Terminology


    Aggregate functions are data combinations or analysis functions. They can be as
    simple as counting the number of results, summing them, or calculating their mean
    value. They could be more complex, though — for example, returning a complex value
    describing an overarching range of time.


    Column stores are also sometimes referred to as Big Tables or Big Table, reflecting
    their common ancestor, Google''s Bigtable.


    Perhaps the key difference between column stores and a traditional RDBMS is that,
    in a column store, each record (think row in RDBMS) doesn''t require a single
    value per column. Instead, it''s possible to model column families. A single record
    may consist of an ID field, a column family for “customer” information, and another
    column family for “order item” information.


    Each of these column families consists of several fields. One of these column
    families may have multiple “rows” in its own right. Order item information, for
    example, has multiple rows — one for each line item. These rows will contain data
    as item ID, quantity, and unit price.


    A key benefit of a column store over an RDBMS is that column stores don''t require
    fields to be present and don''t require a blank padding value like RDBMS does.
    This feature prevents the sparse data problem mentioned in Chapter 1, preserving
    disk space. An example of a variable and sparse data set is shown in Figure 2-1.


