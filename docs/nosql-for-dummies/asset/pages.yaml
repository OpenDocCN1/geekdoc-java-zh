    # The sparse data problem


    As mentioned, relational databases can suffer from a sparse data problem — this
    is why it''s possible for columns to have particular values, but often the columns
    are blank.


    Consider a contact management system, which may have a home for phone, cell phone,
    twitter ID, and other contact fields. If your phone is anything like mine, usually
    you have one or two of these fields present.


    Using RDBMS requires a null value placed in unused columns. Potentially, there
    could be 200 different fields, 99 percent with blank null values.


    RDBMS will still allocate disk space for these columns, because they could potentially
    have a value after future edits of the contact data. This is a waste of resources.
    It''s also inefficient to retrieve 198 null values over SQL in a result set.


    NoSQL databases are designed to bypass this problem. They store and index only
    what is provided by the client application. No nulls stored, and storage space
    properly allocated, but unused. You just store what you need to use.


