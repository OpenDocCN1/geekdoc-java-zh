    Neo4j is the most popular open-source graph store available today. Neo4j allows
    the storage of nodes and relationships and properties to annotate these types
    of objects. A typing system is provided by tagging nodes with labels.


    Sophisticated queries are supported with the feature-rich Cypher Query Language.
    The syntax of Cypher is easy to pick up if you''re familiar with the Structured
    Query Language (SQL) of relational database systems. Also, using the correct color
    coding in a Cypher syntax-highlighting text editor makes the queries rather pretty
    in their own right! Lots of nice brackets, parentheses, and arrows.


    Neo4j''s commercial offering — Neo4j Enterprise from Neo Technologies — provides
    functionality for mission-critical applications, including high availability,
    full and incremental backups, and systems monitoring. Neo4j specializes in providing
    an embeddable and feature-rich graph store designed for the most complex graph
    problems and for storing billions of nodes and relationships.


    In this chapter, I discuss the open source software, its commercial counterpart,
    and the company with the same name that provides support for both.


    # # Exploiting Neo4j


    Neo4j goes beyond the simpler triple store data and query model to provide support
    for advanced path-oriented algorithms. A path is any route between nodes or a
    set of traversals that match a particular query.


    In this section, I talk about Neo4j''s key benefits and why you may wish to adopt
    it for your graph store needs.'
