  md: '# Chapter 5: Key-Value Stores in the Enterprise 109


    don''t have to discover that the value customer_number=12 means Mr A Fowler —
    preventing an additional read request.


    Denormalization consumes more disk space than relational databases’ normal form,
    but greatly increases query throughput. It''s the NoSQL equivalent of a materialized
    view in a relational database. You''re sacrificing storage space for speed — the
    classic computer science tradeoff.


    For computer scientists of my generation, it''s considered heresy to keep multiple
