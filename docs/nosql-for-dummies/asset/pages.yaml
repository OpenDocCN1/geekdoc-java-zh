    systems.


    ![](img/2afea990c282e97644b1fafcb6223852_62_0.png)


    Many companies use BASE-consistency products when testing ideas because they are
    free but then migrate to an ACID-compliant paid-for database when they want to
    go live on a mission-critical system.


    The easiest way to decide whether you need ACID is to consider the interactions
    people and other systems have with your data. If you add or update data, it is
    important that the very next query is to see the change? In other words, important
    decisions hanging on the current state of the database? Would seeing slightly
    out-of-date data mean that those could be fatally flawed?


    In financial services, the need for consistency is obvious. Think of traders purchasing
    stock. They need to check the cash balance before trading to ensure they have
    the money to cover the trade. If they don''t see the correct balance, they will
    decide to spend money on another transaction. If the database they''re querying
    is only eventually consistent, they may not see a lack of sufficient funds, exposing
    their organization to financial risk.


    Similar cases can be built for ACID over BASE in health care, defense, intelligence,
    and other sectors. It all boils down to the data, though, and the importance of
    timeliness and data security.


    # Availability approaches


    Consistency is a sliding scale, not an absolute. Many NoSQL databases allow tuning
    between levels of consistency and availability, which relates to the CAP theorem.


    The CAP theorem is a computer science conjecture, now proven, that shows the list
    of options is to how the balance between consistency, availability, and partitioning
    can be maintained in a BASE database system.'
