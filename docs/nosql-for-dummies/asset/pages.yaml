  md: '# Chapter 12: Bigtable Products


    Instead, make the row something that distributes well across machines.

    A unique key with random values across the spectrum of possible values is a good
    start. Java includes a Universally Unique Identifier (UUID) class to generate
    such ID. Some Bigtables have this built-in capability, too.


    Instead, model your key values that are used as lookups for column names rather
    than row keys (you find more on this topic in the following section).


    You need to be careful, though, because different key strategies create deffer
    and read tradeoffs in terms of performance. The more random the key, the less
    adjacent rows will be stored together.


    Using a very random key means you will have a faster speed, but slower read —
    as the database scans many partitions for related data in your application. This
    may or may not be an issue depending on how interrelated rows are.


    ![](img/2afea990c282e97644b1fafcb6223852_190_0.png)


