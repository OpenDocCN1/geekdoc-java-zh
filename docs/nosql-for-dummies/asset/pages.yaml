    Because it can be interpreted directly by a JavaScript web application, JSON for
    simple web app status or preference store. If you''re logging data, store it in
    the most appropriate format for retrieval and analysis.


    Use the most appropriate structure for your application, not your database administrator.
    Also consider the effects of time on your database. You will need to modify data
    structures in the future to support new features?


    ![](img/2afea990c282e97644b1fafcb6223852_125_1.png)


