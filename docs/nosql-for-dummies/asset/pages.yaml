    For example, document NoSQL databases are often used to achieve denormalization,
    which means that, rather than follow the relational model and split data into
    constituent parts, you put all the data in a single document.


    Product orders are typical examples. An order may include a product id, a name,
    a price, the quantity ordered, customer and delivery details, and payment information.
    It makes sense to model information in a single container (document) so that all
    the information can be accessed at the same time.


    In some circumstances, though, it makes sense to treat the information as discrete
    documents. What do you do? Do you manage denormalizations ("probably" is the honest
    answer), or do you keep atomic structures, such as relational tables, and piece
    them together at query time?


    Merging at query time isn''t easy, as anyone who has written a complex system
    in relational databases can tell you: Complex inner and outer joins are hard to
    get right at query time, and it''s even harder to run them fast.


    # Generating triples from documents


    OrientDB is a nice solution to the problem of managing these document use cases.
    As well as being a full-featured NoSQL database, OrientDB gives you the ability
