  md: '# Chapter 1: Introducing NoSQL: The Big Picture


    # The first NoSQL "meetup"


    The first documented use of the term NoSQL was by Carlo Strozzi in 1998. He was
    visiting San Francisco and wanted to get some people together to talk about his
    lightweight, relational database.


    ers don''t have to worry so much about the underlying database is structured -
    developers just call functions on objects.


    Relational database management systems (RDBMS) are the dominant database today.
    If you ask computer students who have graduated within the past 20 years what
    a database is, odds they will describe a relational database.


    There''s a cost to using SQL. Complex queries are hard to debug, and it''s even
    harder to perform them well, which increases the cost of development, administration,
    and testing. Finding an alternative mechanism, to hide the complexities at least,
    looked like a good way to reduce costs and make it easier to adopt best practices.


    Carlo used the term NoSQL because data was accessed via shell scripts, rather
    than use of the Standard Structured Query Language (SQL). The original meaning
    was "No SQL." That is, instead of using SQL, it used a mechanism close to the
    developer''s source environment — in Carlo''s case, the Unix world.


    Abstractions get only so far, though. Eventually, data problems will emerge that
    require a completely different way of thinking. Existing relational technology
    didn''t work well with such problems, and the explosion of the growth of the Internet
    and World Wide Web would give rise to these issues.


    The use of this term shows a frustration among the developer community with using
    SQL. Along an open standard with massive common in the prevalent Databases of
    the time, the term NoSQL shows a desire for a better way. Or at least, a better
    way for the old developer reaching through complex and long SQL queries.


    Moreover, other things were happening. In 1991, the first public web page was
    created, just seven years before the NoSQL "meetup." Yahoo and Amazon were founded
    in 1994. eBay, Google, which we tend to think always existed, wasn''t founded
    until 1998. There was also a Google — and before, Alta Vista (which was even purchased
    and shut down by Yahoo!) and Ash Jeeves (now known as Ask.com?)


    Carlo''s meeting in San Francisco came went. Developers continued to experiment
    with alternate query mechanisms. Technology appeared to abstract complex queries
    away from the developer. A primary example is the Hibernate library in Java, which
    is driven by configuration and enables the automatic generation of value objects
    that map directly onto database tables, which means develop-


    The specification for the language used for system-to-system communication — XML
    — was released as a recommendation in 1997. The XSLT specification to transform
    XML between formats came in 1999. The web was young, wild, and people were still
    trying to figure out how to make money with. It had not changed the world.


    ![](img/2afea990c282e97644b1fafcb6223852_26_0.png)'
