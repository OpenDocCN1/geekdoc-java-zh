  md: '# Chapter 3: Evaluating NoSQL


    # Cluster scalability


    What do you do if your data grows beyond expectation? What if you release a new
    product on a particular day, and your orders go through the roof? How do you respond
    to this unforeseen situation rapidly without going over the top and wasting resources?


    Some NoSQL databases have scale-out and scale-back support. This is particularly
    useful for software as a service (SaaS) solutions on a public cloud like Amazon
    or Microsoft Azure.


    Scale out is the ability to start up a new database instance and join it to a
    cluster atomically when a certain metric is reached. An example might be CPU usage
    on query nodes going and staying above 80 percent for ten minutes.


    Cluster horizontal support should include automated features (rather than just
    alerts for system administrators) and integration to cloud management software
    like AWS. The database should also be capable of scaling on a live cluster without
    any downtime.


    Perhaps the hardest part of horizontal scaling is rebalancing once the new node
    is started. Starting a new node doesn''t get you very far with a processing issue
    unless you share the data across all nodes equally. If you don''t rebalance data
    then the server with little or no data will be lightning fast and others will
    be slow. Support for auto-rebalancing data transparently in the system solves
    this problem rapidly, and without administrator intervention.


    Auto-rebalancing can be reliably implemented only on NoSQL databases with ACID
    compliance. If you implement it on a non-ACID-compliant database, you run the
    risk that your queries will detect duplicate records, or miss records entirely,
    while rebalancing is occurring.


    Now, you''ve solved the high-usage issue and are running twice the amount of hardware
    as you were before. Your sale ends, along with the hype, and system usage reduces—but
    you''re still paying for all that hardware!


    Support for scale-back helps. It can, for example, reduce the number of nodes
    when 20 percent of the CPU is being used across nodes in the cluster. This implies
    rebalancing support (to move data from nodes to be shut down to those that will
    remain online). Having this feature greatly reduces costs on the public cloud.


    Scale-back is a complex feature to implement and is still very rare. At the time
    of this writing, MarkLogic Server can perform automatic scale-back'
