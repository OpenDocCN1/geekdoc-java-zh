  md: '# 12 Part I: Getting Started with NoSQL


    # Common features


    Four core features of NoSQL, shown in the following list, apply to most NoSQL
    databases. The list compares NoSQL to traditional relational DBMS:


    +   - Schema agnostic: A database schema is the description of all possible data
    and data structures in a relational database. With a NoSQL data-base, a schema
    isn''t required, giving you the freedom to store information without doing up-front
    schema design.

    - Nonrelational: Relations in a database establishes connections between tables
    of data. For example, a list of transaction details can be connected to a separate
    list of delivery details. With a NoSQL database, this information is stored as
    an aggregate — a single record with everything about the transaction, including
    the delivery address.

    - Commodity hardware: Some databases are designed to operate best (or) with specialized
    storage and processing hardware. With a NoSQL database, cheap off-the-shelf servers
    can be used. Adding more of these cheap servers allows NoSQL databases to scale
    to handle more data.

    - Highly distributable: Distributed databases can store and process a set of information
    on more than one device. With a NoSQL database, a cluster of servers can be used
    to hold a single large database.


    Next, I take you through the preceding terms and describe why NoSQL databases
    have each one and when it''s helpful and when it''s.


    # Schema agnostic


    NoSQL databases are agnostic. You aren''t required to do a lot of up-front design
    before you can store data in NoSQL databases. You can start coding and retrieve
    data without knowing how the database stores and works internally. (If and when
    you need advanced functionality, you can manually add further indexes or tweak
    data structures.) Schema agnosticism may be the most significant difference between
    NoSQL and relational databases.


    An alternative interpretation of schema agnostic is schema on read. You need to
    know how the data is stored only when constructing a query (a coded question that
    retrieves information from the database), so for practical purposes, this feature
    is exactly what it says: You need to know the schema on read.


    The great benefit to a schema agnostic database is that development time is shortened.
    This benefit increases as you go through multiple development releases and need
    to alter the internal data structures in the database.


    ![](img/2afea990c282e97644b1fafcb6223852_29_0.png)'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Chapter 1: Introducing NoSQL: The Big Picture


    For example, in a traditional RDBMS, you go through a process of schema redesign.
    The schema instructs the database on what data to expect. Change the data stored,
    or structures, and you must instruct the database using a modified schema. If
    you were to make a change, you''d have to spend a lot of time deciding to re-architect
    the existing data. In NoSQL databases, you simply store a different data structure.
    There''s no need to tell the database beforehand.


    You may have to modify your queries accordingly, maybe the occasional specific
    index (as an integer range index to allow less than and greater data-type queries),
    but the whole process is less painful than it is with an RDBMS.


    > Developers allowed to do whatever they want with a database! This sends down
    the spines of CIOs and DBAs. Lack of control is perceived as inherent risk. But
    it''s a lack of control only if you let developers change production systems without
    first going through a process of development, functional testing, and user-acceptance
    testing. I am not aware that this process is bypassed, so just consider this as
    a theoretical risk.


    ![](img/2afea990c282e97644b1fafcb6223852_30_0.png)


    RDBMS took off because of its flexibility and because, by using SQL, it sped up
    changing query. NoSQL databases provide this flexibility for changing both the
    schema and the query, which is one of the reasons that they will be increasingly
    adopted over time.


    > Even on query, you may not need to worry too much knowing the schema changes
    — consider an index over a field count number, where account number can be located
    anywhere in a document that is stored in a NoSQL database. You can change the
    structure and relocate where number is stored, and if the element has the same
    name elsewhere in the database, it''s still available for query changes to your
    query mechanism.


    ![](img/2afea990c282e97644b1fafcb6223852_30_1.png)


    Sometimes, you''ll also find the term schema-less mentioned, which is a stretch,
    because there aren''t many occasions when you can do a general query without knowing
    that particular fields are present — for example, a query that is purely full-text
    search doesn''t restrict itself to a particular field.


    ![](img/2afea990c282e97644b1fafcb6223852_30_2.png)


    Note that all NoSQL databases are fully schema agnostic. Some, with HBase, require
    you to stop the database to alter column definitions. They''re still considered
    NoSQL databases because not all defined fields (columns in this case) are required
    to be known in advance for each record — just the column families.


    RDBMS allows individual fields in records to be identified as null values (no
    defined value). The problem with an RDBMS is that stored data size and'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# 14 Part I: Getting Started with NoSQL


    performance are negatively affected when storage is reserved for null values just
    in case the record may at some future time have a value in that column. In Cassandra,
    you simply don''t provide that column''s data, which solves the problem.


    # Nonrelational


    Relational database management systems have been the dominant way to store application
    data for more than 20 years. A great deal of mathematical work was done to prove
    the theory that underpins them


    This underpinning describes how tables relate to each other. A single Order may
    relate to many Delivery rows, but each Delivery Address also relates to multiple
    Order rows. This is a many-to-many relationship.


    NoSQL databases don''t have this concept of relationships between their records.
    They instead denormalize data. This means that in a NoSQL data-base would have
    an Order structure with the Delivery Address embedded. This means the delivery
