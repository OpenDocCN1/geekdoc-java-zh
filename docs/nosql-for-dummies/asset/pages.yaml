  md: '# Chapter 11: Bigtable Use Cases


    # # Using a Bigtable


    In a Bigtable, you can model the same contacts application with a column family
    for each type of network (phone, social media, email, snail mail) and a column
    for each defined (home, phone, cell, phone).


    Bigtable stores only the columns you indicate on each record instance. If you
    indicate three columns — email, home phone, and cell phone — then Bigtable stores
    exactly those three values. No nulls, and no wasted space, as illustrated in Figure
    11-2.


    If you need to find all contacts with a phone number — say, at least one column
    in the column family — then you need to consider that factor. This scenario can
    happen if you''re viewing all contacts in a phone order to make a call; there''s
    no point in showing contacts without phone numbers!


    In this case, the database must support a *column* query for the column family
    and column names. Some databases, such as Hypertable, allow you to set special
    *indexes* to ensure that these types of existential queries operate quickly over
    large datasets.


    Also, keep in mind that Bigtable clones do not provide advanced matching functions
    for values but store them instead as "dumb" binary data that cannot be compared
    with data-type specific operations — for example, searching for all contact names
    (a string field) starting with "Adam F". This is a starts with query that processes
    a string value. Most Bigtable clones provide exact match fact, but do not natively
    support partial match or data-specific range queries (less than and greater).


