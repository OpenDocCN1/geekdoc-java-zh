  md: '# 312 Part V: Graph and Triple Stores


    Neo4j doesn''t, out of the box, support any of these standards; however, you can
    find a variety of third-party plug-ins and approaches that enable you to use Neo4j
    as a standards-compliant triple store.


    These plug-ins may not directly map RDF concepts onto Neo4j, so be sure to read
    about each one in depth before adopting it. Because the plug-ins aren''t officially
    supported by Neo4j, they aren''t full-featured, nor do they perform as well as
    the open standards-based support that''s built into other triple stores. You need
    to test these plugins before implementing them. They are useful as an add-on to
