  md: '# Chapter 14: Common Features of Document Databases


    Instead of a very RAM costly read-modify-update cycle, you can stream the changes
    into the document using an append operation. Moreover, the document is visible
    to queries in the system while it''s being streamed in live, rather than having
    to wait until the entire stream is complete before being made available for query.


    # Providing alternate structures in real time


    NoSQL databases don''t join to other documents like relational databases, although
    some (MarkLogic Server, OrientDB) do allow building of a merged view at the time
    a document is read.


    Instead, an approach denormalization is used. Denormalization duplicates some
    information at ingestion time in order to provide access to high-speed reads and
    queries. Duplication of data is done so that the database doesn''t have to process
    joins at query time.


    You may want to quickly produce alternative or merged views as new data arrives
    in the database. Doing so requires you to use a database trigger to post the new
    document and generate the one or more structures you need.


    Relational database management systems provide a similar concept called materialized
    views. These views trade the use of extra disk space for the fly or preempt. Prebuilt
    views have the ability to save memory and processing power at query time. They
    are, in practical terms, equivalent to adding extra denormalized documents in
    a NoSQL document database.


    Examples of using denormalization include


    +   - Updating a summary document showing the latest five news items when a new
    item arrives.


    +   - Updating multiple searchable program-availability documents on a catchup
    TV service when a new scheduling document arrives. This merges data from an episode,
    genre, brand, and scheduling of documents into multiple program-availability documents.


    +   - Taking an order document and splitting it into multiple order-item documents
    to allow a relational business intelligence tool to query at a lower granularity.


    ![](img/2afea990c282e97644b1fafcb6223852_228_0.png)'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'These use cases require the following database features:


    +   - If they''re easy to update, you can generate these alternative structures
    in a pre-commit trigger.


    This means the denormalizations are generated as the new document arrives. When
    the transaction to add documents ends, the denormalizations will become visible
    at exactly the same time.


    +   - You can use a post-commit trigger if either of the following occur:


    +   - Immediate consistency in these views isn''t required.


    +   - Ingest speed is more important than consistency.


    +   - A post-commit trigger allows the transaction to complete and guarantees
    that from that point, the denormalizations are generated. This improves the speed
    of writes at the cost of a few seconds of inconsistency.'
