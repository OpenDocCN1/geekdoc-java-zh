  md: '# 310 Part V: Graph and Triple Stores


    # Advanced path-finding algorithms


    Queries can be performed that return a set of paths. These paths can be traversed
    by specialist algorithms in order to answer complex graph questions.


    A common use for a graph store is to find the shortest path between two nodes,
    for example:


    +   - For route applications for car navigation systems

    - For social distance or influence calculations weighted by interactions between
    people on the network

    - For determining the most efficient path to route traffic through a data network


    ![](img/2afea990c282e97644b1fafcb6223852_327_0.png)


    The algorithm that''s most often used for this analysis is Dijkstra''s algorithm,
    named after Edsger Dijkstra. The Dijkstra algorithm works by analyzing each individual
    link from the source to the destination, remembering the shortest route found
    and discarding longer paths, until the shortest route is found.


    At a high-level, the algorithm works by traversing the graph starting with all
    nodes related to node A, each with a particular starting distance. The distance
    from node to its relations is added to the initial distance. As the links to non-visited
    nodes expands, nodes with too great a distance are eliminated until eventually
    the shortest path is discovered.


    The complexity of this graph traversal can sometimes be simplified by applying
    known techniques during traversal. Perhaps its to determine the estimated cost
    before traversing a whole graph—for example, assuming that highways are quicker
    than roads for long journeys. This combination of assumptions to choose the next
    path to analyze is formalized in the A* algorithm.


    Specifically, the A* algorithm used weighted comparisons based on some property
    of each connection in the graph.


    Both the A* algorithm and Dijkstra''s algorithm are supported by Neo4j. Neo4j
    also allows you to plug in your own traversal algorithms using its Framework Java
    API.


    # Scaling up versus scaling out


    It''s hard to perform well on a distributed cluster when you''re traversing a
    large number of paths between nodes, rather than pulling back properties on'
  merge: -1
