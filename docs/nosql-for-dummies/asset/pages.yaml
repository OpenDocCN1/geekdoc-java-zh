  md: '# Chapter 5


    # Key-Value Stores in the

    Enterprise


    In This Chapter


    +   - Ensuring you have enough space for your data

    - Achieving faster time to value implementations


    Key-value stores are all about fast storage and retrieval. If you need a key-value
    store, then by definition you need to scale out — massively and ensure maximum
    performance of your database. This high speed comes at the cost of more-advanced
    database features — features that would add to each request''s processing time.


    Designed for high speed means that key-value stores have a straightforward architecture
    that allows you to quickly create applications. Knowing some easy approaches can
    greatly reduce the time you spend them. For large-scale enterprise systems these
    features are a must.


    In this chapter, I cover how to ensure that not only is your key-value store fast,
    but that you can achieve productivity (and cost savings) quicker. I also mention
    how to do this while being frugal with resources, such as disk space.


    # Scaling


    Scaling is important to ensure that as your application and business grows, you
    can handle the new users and data that come online. Some aspects of scaling are
    difficult to pull off at the same time — for example, the ability to handle high-speed
    data ingestion while simultaneously maximizing the speed of reading.'
  merge: -1
