  md: '# 352 Part VI: Search Engines


    # Evaluating Elasticsearch


    Elasticsearch is a good place to start if you need to store data as JSON documents
    primarily for full-text searches or for range queries. The ELK stack allows rapid
    use of Elasticsearch for log storing, search, and analytics in an attractive and
    high-performance front end.


    Beyond log file use, though, you must plug Elasticsearch''s HTTP-based REST API
    into your programming language and user interface layer of choice. Support is
    provided for a wide range of languages.


    Elasticsearch doesn''t handle binary documents or XML natively, if these are among
    your needs, then you need to look at other solutions. No connectors are provided
    for Elasticsearch to pull in information from other corporate systems or applications.


    Elasticsearch does JSON documents better than Solr. This is especially true with
    complex nested tree structures and parent/child relationships within documents.


    Elasticsearch is also schema-less with a universal index, unlike Solr where you
    need to specifically instruct the search engine about the format and fields in
    the indexed documents. In Solr, schema changes also require a cluster restart—they
    cannot be live. In Elasticsearch, you can alter them as long as the changes don''t
    break existing indexes.


    If you have a variety of ever-changing JSON documents and need to search them,
    then Elasticsearch is a good choice.


    Microsoft''s entry into the JSON document NoSQL market with DocumentDB service
    on Azure provides a more attractive option to managing and searching JSON documents
    as it matures over the next two years. At the moment, Microsoft DocumentDB has
    no free text search capability, preferring to use Structured Query Language (SQL)
    queries from the relational database. If Microsoft were to take its FAST database
    technology and apply it to DocumentDB product with its existing universal index,
    and then allow on-premise installations, then DocumentDB will become an attractive
    alternative in large enterprise deployments.


    At the moment, though, Elasticsearch is the dominant JSON search engine, but it
    will have to adapt in order to pull ahead of Solr or MarkLogic, which both support
    a wider range of document formats.'
