    open source products undergoing rapid development at the moment, and to achieve
    scale, are integrating many of the architectural design features of NoSQL databases.
    Indeed, many search engines are often integrated into NoSQL databases to provide
    unstructured search.


    In this chapter, I discuss the uses of these search engines, and how they can
    be used alongside and instead of a NoSQL database.


    # # Using Common Open-Source Text Indexing


    Apache''s Lucene, the most popular open-source indexing and search engine technology,
    has been around since 1999. It''s written in Java and is a'
  merge: -1
