  md: '# # Chapter 25


    # # Search Engines in the Enterprise


    In This Chapter


    +   - Finding unstructured data

    - Providing a user-friendly search experience


    Providing search engine functionality for your local computer files is easy, and
    the same is true for adding basic text search to a web shop front end.


    Where things start to get really complex is when you try and provide a single
    search application over multiple sources of information. Not only are the data
    formats different but also the individual systems differ.


    Some data have text snippets in search results; others need image previews. Each
    data source displays its own set of facets about its data. Some of these facets
    (or search fields) may be similar across different systems. The security access
    rules are also different within each system, requiring a central concept of identity
    and permissions to map effectively in a search application.


    This is why enterprise search — that is, searching across a large enterprise’s
    information stores — is a difficult problem to solve. However, you can mitigate
    this complexity in a number of ways.


    In this chapter I discuss the unique issues of applying search across a large
    Enterprise, and making such a complex system accessible to end users.


    # # Searching the Enterprise


    Web search engines have long had to index web pages, images, PDF files, word documents,
    and other formats. As a result, the main issue in enterprise-search solutions
    stems from the differences between source systems’'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# 328 Part VI: Search Engines


    architectures (the systems where the content resides) and the variety of available
    data. For example, there is a great variance in the functionality needed to easily
    collect different data from a range of sources and in how to provide a consistent
    way to manage the indexes of that data.


    In this section, I talk about the variety of systems that typically contain useful
    data that needs searching, and how to recognize challenges that arise because
    of the differences between these systems.


    # Connecting to systems


    As I discuss in Chapter 24, many enterprise search engines provide out-of-the-box
    connectors for source systems; Bm OmniFind, HP Autonomy, and Microsoft FAST all
    have connectors for common systems and databases.


    These connectors provide an easy way to pull data from many sources into a single
    repository — there''s no need to code your integrations. The downside is that
    connectors are invariably on a timed basis; they do not show the live state of
    all your enterprise''s data, which is very similar to how web search engines work.


    In some cases, you may be better consolidating all your unstructured data in a
    common database platform. NoSQL document databases are ideal for this situation,
    because they provide a schema-free way to store data sourced from a variety of
    systems.


    This consolidation also means you reduce costs by replacing multiple data sources
    used to power your custom applications with a single data platform. Another side
    benefit is that you''re not duplicating the storage of data, unlike traditional
    search engines where the primary data store''s own indexes are separate from the
    search engines.


    Finally, because a database with search capabilities knows when new data arrives,
    there''s the possibility of real time, or at least improved latency, between the
    data and search indexes.


    # Ensuring data security


    An often overlooked problem is that of mapping different stores'' security models
    onto a common model used to lock down information in the search application.'
