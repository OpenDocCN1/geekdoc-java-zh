    efficiency, or to be replicated.


    Could also be used for querying. In this case, it can be thought of as a collection.


    +   - Database structure


    +   - Collection: A set of records, typically documents, that are grouped together.
    This is based on a property within the record set, but within its metadata. Assigning
    a record to a collection is usually done at creation or update time.


