  md: '# 230 Part IV: Document Databases


    To handle 24/7 operations, your database cluster needs to support


    +   - **Online backups:** Back up nodes within the cluster with no loss of service.

    - **Online upgrades:** Take a server offline (another server takes over its data),
    upgrade the offline server; then bring it back online with no service interruptions.

    - **Data replication:** If a replica server can''t take over one server''s data,
    then it can''t support online upgrades. You achieve replication through a shared
    network disk, or disk replication between servers.


    These availability constraints are peculiar to 24/7 streamed incoming data. A
    lot of databases don''t need this degree of availability. It is increasingly common
    to find that service is required 24/7, though, so you need to be aware of these
    issues.


    # Amalgamating related data


    After you successfully store the data — by the way, well done, because it''s mean
    feat! — you must join it together.


    Say that you use an ID tracing database for banking arrears collection systems.
    In this case, you want the latest internal information on customers. Perhaps you
    receive feeds of data from reporting agencies, consented email and cell phone
    records, public twitter messages (including geocoded tweets so you know where
    they were sent), and maybe even local directory or census information. The consented
    cell phone and email data typically includes names and addresses, too. (Think
    of all these forms you fill in with check boxes.)


    You want to integrate this data to provide a picture of a person and where he
    has lived. Basically, you join the public fragments of his identity. After all,
    if he moves out of his house and skips the $110,000 he owes the bank on his mortgage,
    it''s worth trying to find him!


    So, you want to create a “Person” document joining information about the particular
    person at this particular address. Maybe you find his cell phone number, email
    address, and mortgage records.


    You could then mine tweets near his house and see if any cluster at his address.
    Then look at the profile and tweets to determine whether he is living there, or
    perhaps his daughter. If it is him, attach this data to the “Person” object.'
