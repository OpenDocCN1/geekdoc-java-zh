    # Using reverse queries


    A reverse query is where you say, "Give me all saved searches that match this
    document" rather than "Give me all documents that match this search." Search engines
    that support thousands rather than a handful of search engines incorporate a special
    reverse query to ensure scalability. A reverse index is where a search is saved
    as a document and its search plan is indexed. This approach results in fast candidate
    matching when a new record arrives in the system.


    # Matchmaking queries


    You can also combine reverse queries with normal forward queries. Doing so is
    useful where a record contains search criteria as well as data. This behavior
    is customary in matchmaking queries.


    Here are some examples of matchmaking queries:


    +   - People searching for jobs have criteria for the jobs they''re seeking, equally,
    employers have criteria for the positions sought.

    - A dating website comprises information about individuals as well as the criteria
    those individuals have in making a match.'
