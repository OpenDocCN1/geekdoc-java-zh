  md: '# Introduction


    Love NoSQL both as a movement and as a technology. It''s a fast-paced, constantly
    changing area. Barely a week goes without a new NoSQL database being created to
    handle a specific real-life problem.


    As a movement, NoSQL is interesting in that it stands independently of any commercial
    organization. In fact, it was the brainchild of interested individuals who grouped
    together and shared ideas. Some core ideas came from large commercial organizations,
    including the Bigtable paper from Google and the key-value store paper from Amazon,
    but NoSQL was popularized as open source.


    The normal process in software development is that several commercial companies
    form and compete with one another and gradually the field narrows. Then, once
    the remaining companies prove their worth, they''re gobbled up by big boys like
    Oracle, IBM, and Microsoft. Open-source alternatives appear only during the later
    phases of this cycle.


    That''s not the case with NoSQL. Sure, there were a few early players (very early
    in MarkLogic''s case — back in 2001). However, the majority of publicly available
    NoSQL products were created in the open before companies incorporated them into
    their commercial products.


    This book encourages a practical approach to evaluating NoSQL as a set of technologies
    and products. The book tells you how to determine which ones might meet your needs
    and how to select the most appropriate ones. Information enables you to spot business
    and technical problems that NoSQL databases can solve.


    After reading this book, not only will you be able to identify which type of NoSQL
    database to use, but perhaps more importantly, you''ll know the questions to ask
    vendors about their software and services prior to purchasing one.


    This book discusses NoSQL in terms of real-life, complex mission-critical applications.
    Understanding complex enterprise applications allows you to see the flaws and
    benefits of each NoSQL database, and within contexts similar to the ones you see
    in your workplace.


    This book guides you through this exciting area of technology and highlights how
    you and your organization can achieve similar benefits to those described. I hope
    you enjoy your journey!'
