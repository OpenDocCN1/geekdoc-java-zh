  md: '# 2 NoSQL For Dummies


    # Foolish Assumptions


    My main aim for the book is to expose many NoSQL databases and point out their
    common features and specific use cases.


    My other aim is to point out that NoSQL databases are ready for the big time!
    I have gone to pains to point out where things can be configured to support this,
    or where gaps still exist in offerings.


    I hope that large enterprises that have not yet adopted NoSQL will be reassured
    by this book. I also hope that it will act as a call to action to NoSQL database
    vendors in hardening their offerings to support the key needs of each business
    sector and use cases in such systems.


    As this book is considering enterprise classes of problems, I have to be aware
    of things like long-term development plans, resilient systems, support, and availability
    of services.


    I''ve chosen to cover the following NoSQL databases (plus one search engine):


    +   - Riak: A key-value store

    - MongoDB: An aggregate (document) database that primarily stores JSON

    - Apache Cassandra: A column store (Bigtable clone)

    - Neo4j: A triple and graph store

    - MarkLogic: Primarily stores XML documents, also JSON, binary, text. Also provides
    in memory column indexes, a triple store and a search engine

    - Redis: An in-memory only key-value store

    - Elasticsearch: An Open Source search engine used with many NoSQL databases


    I was keen to give a background to a breadth of databases in this book. I also
    needed to make sure I wasn''t covering the same subject multiple times. I decided
    to cover one database that primarily manages each data type (document, keys/values,
    column/tables, triple/graph).


    I''m keen to ensure that I don''t give you the impression that each database in
    each data type area is created equal. Although I concentrate on just one database
    of each type, I also mention areas where other similar databases are stronger
    or weaker where appropriate.'
