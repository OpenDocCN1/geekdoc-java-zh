  md: '# 190 Part III: Bigtable Clones


    # Replicating data globally


    Cassandra is unique in allowing a cluster to be defined across geographic boundaries
    and providing tolerance of network partitions to ensure data is available worldwide
    when needed.


    A Cassandra ring is a list of servers across server racks and data centers. You
    can configure Cassandra so that a replica is on the same rack, another on a different
    rack (in that case rack''s network goes down), and maybe even another two copies
    in other data centers.


    This enables maximum replication and ensures that data can be accessed. However,
    note that all these replicated copies— whether the same data center or another
    one— are replicated synchronously. This means it''s possible for the replicas
    to disagree on the current value of a data item.


    Consistency is guaranteed by configuring the client driver accessing Cassandra.
    By using a setting of ONE, you indicate you don''t care about consistency; you''re
    happy with any case.


    By using a setting of LOCAL_QUORUM, you''re saying you want the value agreed on
    and returned by, for example, out of three servers within your local cluster.
    Specifying ALL requires that all servers in the cluster contain a copy of that
    value are in agreement.


    There are a variety of other settings to consider. A full list of the consistency
    settings may be found on the Apache Cassandra website: http://cassandra.apache.org


    # Assessing Cassandra


    Cassandra allows partitioning and writing data when its primary master is unavailable.
    It''s, therefore, not an ACID-compliant database, so in some cases, the data will
    be inconsistent or replicas disagree on the correct value.


    You need to be aware of this issue when building an application on Cassandra.
    A read repair feature is available to help with this issue, but when you use it,
    there''s a potential ten-percent loss in performance. However, this may be a good
    tradeoff for your purposes.


    Global master-master replication is a great feature to have, but given that it
    can be used asynchronously, it doesn''t provide a true "always consistent"'
