    # Effective indexing


    Storing data is one thing, finding it again is quite another! Retrieving a document
    using a document ID, or (primary) key, is supported by every NoSQL document database.


    In many situations, though, you may want a list of all comments on a web page
    or all recipes for puddings (my personal favorite!). This requires retrieving
    a list of documents not on their key but on other information within the document
    — for example, a page_id JSON property. These indexed fields are commonly referred
    to as secondary indexes. Adding an index to these fields allows you to use them
    in queries against the MongoDB database.


    In some situations, you may want to search by these fields at a time, such as
    for all pudding recipes that contain chocolate but are gluten free. MongoDB solves
    this issue by allowing you to create a compound index, which is basically an index
    for all three fields (recipe type, ingredients, gluten free), perhaps ordered
    according to the name of the recipe.


    You can create a compound index for each combination of query fields and sort
    orders you need. The flip side is that you need an index for every single combination.
    If you want to add a query term for only five-star recipes, then you need another
    compound index, maybe several for different sorting orders, too.


    Other NoSQL databases like DocumentDB and search engines solve this by making
    an intersection of the results of each individual index. In this, there''s no
    need for compound indexes, just a single index per field and a piece of mesh to
    perform an intersection on each index lookup''s document id list. This approach
    reduces the amount of administration required for the database and the space needed
    for the index on disk and memory.


