  md: '# Chapter 10: Bigtable in the Enterprise


    +   - **Write to memory with journaling.** Some databases can receive writes in
    memory, which is very fast, while also writing a small record of the changes,
    to disk to ensure that the data is durable if the server fails. This Journal is
    smaller, and thus faster to save, as applying the change itself to all the database
    structures on disk.


    # Ingesting data in parallel


    When writing large amounts of data to a database, spread the load. There''s no
    point having a 2-petabyte database spread across 100 servers if 99 percent of
    the new data is landing on only one of those servers, and so can easily lead to
    poor performance when data is being ingested.


    Bigtable solves this problem by spreading data base on its *row key* (sometimes
    called a *partition key*). Adjacent row values are kept near each other in the
    same tablets.


    To ensure that new data is spread across servers, choose a *row key* that guarantees
    new records are not located on the same tablet as a single server, but instead
    are stored on many tablets spread across all servers.


    +   - Accumulo allows you to plug in your base database implementations, which
    enables you to ensure that rows are kept together or spread across a cluster,
    depending on your needs.


    +   - Accumulo and HBase also support *locality groups*, which keep particular
    columns for the same row together. This is particularly useful forfast fast reads.
    Hypertable supports locality groups, too, with a feature called *access groups*.


    # In-memory caching


    A database system can experience extreme input and output load, as described here:


    +   - In many systems, the same data is often requested. Consider a news site
    that shows the latest news across a range of segments. In this case, it''s important
    to keep the latest stories cached, rather than go back to disk to access each
    time they''re requested.


    +   - When high-speed writes are needed, the most efficient way to handle them
    is to write all the data to an in-memory database file, and just write the journal
    (a short description of the changes) to disk, which increases throughput while
    maintaining durability in the event of a system failure.'
