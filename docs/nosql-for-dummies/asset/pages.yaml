  md: '# Chapter 15


    # # Document Databases in the Enterprise


    +   In This Chapter

    - Spreading your data across stores

    - Ensuring your data is kept safe

    - Making record versions consistent across your database cluster


    A database tells you that data is saved, then you''re likely to rely on that assurance.
    For mission-critical use cases this reliance is vital. Moreover, many industries
    don''t just want changes to their data to be accessible immediately after an update;
    they also want the indexes used to find the data kept up to date, too — reflecting
    the current state of the database.


    Another issue is the distribution of data around a database cluster. By distributing
    data, you improve the speed of writes. Distributing data though also means you
    may sacrifice the speed of read operations and also queries. This is because queries
    need to be handled by many servers. Understanding the tradeoffs for each situation
    is important.


    NoSQL databases differ from each other in how they provide the preceding features.
    They are key for enterprises that want to bet their business on new technology
    in order to gain competitive advantages.


    In this chapter, I discuss the advantages and risks of each approach to consistency
    and distribution of data in a document oriented NoSQL database.


    Remember, there’s no right or wrong way to do things; the “right” way depends
    on the situation.'
  merge: -1
