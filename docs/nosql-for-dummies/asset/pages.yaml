    # What I''m not covering


    Because the NoSQL world is awash with a range of products, I had to carefully
    select which products to include and which to exclude. Conversely, I wanted to
    provide more content than you might find in other NoSQL books.


    I mention several ideas in each type of NoSQL database and complementary technologies.
    I had to draw the line somewhere, though, here''s what''m not covering, and why:


    +   **In-memory and flash databases**: Large advances have been made in realtime
    online transaction processing (OLTP) and analytics using in-memory databases.
    In-memory databases are very specialized and are targeted to particular domains.
    I have, though, mentioned NoSQL databases that take advantage of flash or memory
    caching to reach real-time analytics.


    +   **Complex propriety**: Large multinational vendors have been included to think
    they have a solution that fits in this book. Typically, this solution involves
    integrating multiple products. I want to cover NoSQL databases that provide a
    platform, not technical jigsaw pieces that you have to cobrar together provide


    similar functionality, which is why these guys aren''t included. I do mention
    singleproduct commercial NoSQL software such as Oracle NoSQL, MarkLogic, Microsoft''s
    Document DB, and IBM Cloudant.


    +   **NoSQL**: This is a new database access paradigm. It applies the software
    design lessons of NoSQL to RDBMS, creating a new breed of products, which is great
    these products still use traditional relational math and structures, which is
    why they aren''t included. Hopefully, someone will write a For Dummies book about
    these new database!


    +   **Every NoSQL database out there**: Finally, there are just too many. I picked
    the ones you''re most likely to come across or that I believe provide the promise
    for solving mission-critical enterprise problems. I mention the key differences
    among many products in each NoSQL category, but I concentrate on one or two real-world
    examples for each to show their business value.


    # Columnar


    Column stores are similar at first appearance to relational DBMS. The concepts
    of rows and columns are still there. You also define columns before loading data
    into the database, meaning that the structure of data must be known in advance.


    However, column stores organize data differently than relational databases. Instead
    of storing data in a row for fast access, data is organized for fast column operations.
    This column-centric view makes columns ideal for running aggregate functions or
    for looking up records that match multiple columns.'
