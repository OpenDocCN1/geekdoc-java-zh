  md: '# Automatic indexing


    AllegroGraph stores seven indexes for every triple in the database. These indexes
    are composed of the subject, predicate, object, graph, and identifier \— a unique
    ID for every triple stored. The seven indexes are


    +   - SPOG: Used when the subject is known to find a list of triples.

    - POSG: Used to find unknown subjects that contain known predicates and objects.

    - OSPG: Used when only the object is known.

    - GSOPLGPOSGI: Used when a subgraph is specified, for each of the preceding three
    scenarios.

    - I: A full index of all triples by identifier. Useful for fast multi-triple actions,
    as deletions.


    All triples in AllegroGraph have these seven indexes, which helps to quickly boost
    triple (lat returning) queries and subgraph queries that require graph traversal.


    # Using the SPIN API


    The SPARQL Inferencing Notation (SPIN) API provides behavior for objects held
    within a triple store.


    SPIN allows you to define a named piece of SPARQL that can be referenced as a
    function in future SPARQL queries. An example is a SPARQL CONSTRUCT query that
    returns an ?area variable to calculate the area of an instance of a rectangle
    store.


    You create a function by associating a class with a SPIN rule, which in turn is
    an RDF representation of a SPARQL query. The SPIN API was submitted by semantic
    web researchers from Rensselaer Polytechnic Institute in New York, TopQuadrant,
    and OpenLinksW. Franz has implemented the SPIN API in its AllegroGraph store product.


    SPIN is used in AllegroGraph to


    +   - Encode SPARQL queries as RDF triples.

    - Define rules and constraints.'
