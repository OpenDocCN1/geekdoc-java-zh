- img_proc: true
  md: '# 294 Part V: Graph and Triple Stores


    But don''t be overwhelmed. Use this chapter to get a flavor of which system is
    most likely to have the functionality you need. Given the variability in this
    section, I heartily recommend carefully reading your vendor''s website, too, in
    order to discover whether all the features you need are supported.


    # Managing Documents and Triples


    Document NoSQL databases offer a rich way to store and manage variably structured
    data. Although document NoSQL databases enable grouping of data through collections
    or secondary indexes, what they don''t provide is the concept of relationships
    between records held within them.


    Document NoSQL databases also don''t allow you to detail complex relationships
    over the entities mentioned within documents — for example, people, places, organizations,
    or anything about which you''ve found information.


    ArangoDB, MarkLogic Server, and OrientDB allow you to manage documents alongside
    triples in the same database. They are all examples of distributed triple stores
    — not graph stores. Their features vary significantly, though, in which you can
    do with documents and triples.


    # Storing documents and relationships


    An obvious place to start in unpicking your requirements is by mapping the relationships
    between documents. This can be achieved through the following methods:


    +   * Provenance of data storage: This includes changes applied over time and
    links to previous versions or source documents, perhaps by using the World Wide
    Web Consortium''s (W3C) PROV Ontology (PROV-O).

    * Entity extraction: This involves storing facts extracted from free text about
    things like people, places, and organizations, along with the fact that they are
    mentioned in particular documents.

    * Management of compound documents: This includes complex documents that contain
    other documents that exist in their own right — for example, modular documentation
    that can be merged together in workbooks, online help, or textbooks.'
  merge: -1
