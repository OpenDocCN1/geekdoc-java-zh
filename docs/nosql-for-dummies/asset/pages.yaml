  md: '# 158 Part III: Bigtable Clones


    +   Other Bigtable clones (HBase, Accumulo) will have standby master processes
    running, with failover happening immediately and without the client knowing. Accumulo
    even goes as far as to have a feature - called FATE, amusing enough - that guarantees
    and replays any database structure requests if the master fails during a modification.
    It prevents schema corruption of the database.


    +   Other databases (Cassandra) use a charter protocol between all members of
    the cluster, avoiding a master process altogether. This gives Cassandra the minimum
    number of components, and allows every server in the cluster to look the same,
    all of which makes administration and setup easier, while helping guarantee availability,
    too.


    # Scalability


    Anyone can create a database that looks fast on a single machine while loading
    and querying a handful of records. However, scaling to petabytes requires a lot
    of work. In this section, therefore, I highlight features that can help you scale
    and write workloads.


    ![](img/2afea990c282e97644b1fafcb6223852_175_0.png)


    The features covered in this chapter are specific to Bigtable clones mentioned
    in this book. Many other strategies are possible to achieve scalability, including:


    +   Use distributed file storage. Shares load across physical disks/servers, which
    can be done in one of the following ways:


    +   A local RAID (Redundant Array of Disk) Array

    - A shared storage system such as HDFS (Hadoop Distributed File System)


    +   Go native. Using a compiled programming language next to an operating system
    like C++ is always faster than a bytecode or interpreted language like Java.


    Most Bigtable clones are implemented on top of Java, and Hypertable being not
    the C++ exception.


    +   Utilize fast networks. Use at least 10-Gbps switches for high-speed operations,
    especially if you''re using shared network storage.


    +   Set up separate networks. Sometimes it''s useful to keep client-to-database
    network loads separate from database-to-storage or database intra-node chatter.
    On larger clusters, intra-node chatter can also start flooding a data network
    if the network is shared. On very large clusters, it''s best to have a secondary
    net for intra-server communication to avoid this problem.'
