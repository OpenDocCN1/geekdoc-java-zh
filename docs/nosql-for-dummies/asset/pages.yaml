  md: '# # Chapter 4

    # Common Features of Key-Value Stores


    **In This Chapter**


    +   - Ensuring that your data is always available

    - Deciding on how to add keys to your data

    - Managing your data in a key-value store


    Key-value stores are no frills stores that generally delegate all value-handling
    to the application code itself. Like other types of NoSQL databases, they are
    highly distributed across a cluster of commodity servers.


    A particular benefit of key-value stores is their simplicity. Redis, for example,
    is only 20,000 lines of code! It can be embedded into an application easily and
    quickly.


    Throughput is the name of the game. Many using a key-value store will sacrifice
    database features to gain better performance. Key-value stores lack secondary
    indexes, and many of them eschew synchronized updates (thus also eschewing guaranteed
    transactional consistency) to their replicas in order to maximize throughput.


    In this chapter, I cover how to configure a key-value store to ensure that no
    what happens to the database servers in your cluster, your data is always available.


    Key-value stores also place some constraints on how you model your data for storage.
    I talk about the best strategies for this, including information on setting appropriate
    keys for your data records, and indexing strategies.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# 98 Part II: Key-Value Stores


    # Managing Availability


    As with other NoSQL database types, with key-value stores, you can trade some
    consistency for some availability. Key-value stores typically provide a wide range
    of consistency and durability models — that is, between availability and partition
    tolerance between consistent and partition tolerance.


    Some key-value stores go much further on the consistency arm, abandoning BASE
    for all ACID transactional consistency support. Understanding where to draw the
    line can help you shorten the list of potential databases to consider for your
    use case.


    # Trading consistency


    Key-value stores typically trade consistency in the data (that is, the ability
    to always read the latest copy of a value immediately after an update) in order
    to improve write times.


    Voldemort, Riak, and Oracle NoSQL are all eventually consistent key-value stores.
    They use a method called read repair. Here are the two steps involved in read
    repair.


    +   1. At the time of reading record, determine which of several available values
    for a key is the latest and most valid one.

    2. If the most recent value can''t be decided, then the database client is presented
    with all value options and is left to decide for itself.


    ![](img/2afea990c282e97644b1fafcb6223852_115_0.png)


    Good examples for using eventually consistent key-value stores include sending
    social media posts and delivering advertisements to targeted users. If a tweet
    arrives late or a five-minute-old advertisement is shown, there''s no catastrophic
    loss of data.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Chapter 4: Common Features of Key-Value Stores


    # Implementing ACID support


    Aerospike and Redis are notable exceptions to eventual consistency. Both use shared-nothing
    clusters, which means each key has the following:


    +   - A master node: Only the masters provide answers for a single key, which
    ensures that you have the latest copy.

    - Multiple slave replica nodes: These contain copies of all data on a master node.
    Aerospike provides full ACID transactional consistency by allowing modifications
    to be flushed immediately to disk before the transaction is flagged as complete
    to the database client.


    Aerospike manages to do that at very high speeds (which claims that having ACID
    increases write speed). Aerospike natively handles raw SSDs for data-writing by
    bypassing operating systems'' file system support.


    Of course, SSDs mean higher server costs. You may decide that using Redis (configured
    to flush all data to disk as it arrives) is fast enough and sufficient durability
    for your needs. The default setting in Redis is to flush data to disk every few
    seconds, leaving a small window of potential data loss if a server fails.


    Here are some examples of when you may need an ACID-compliant key-value store:


    +   - When receiving sensor data that you need for an experiment.

    - In a messaging system where you must guarantee de-receipt.


    Redis, for example, provides a Publish/Subscribe mechanism that acts as a messaging
    server back end. This feature combined with ACID support allows for durable messaging.


    # Managing Keys


    Key-value stores'' fast read capabilities stem from their use of well-defined
    keys. These keys are typically hashed, which gives a key-value store a very predictable
    way of determining which partition (and thus server) data resides on. particular
    server manages one or more partitions.


    A good key enables you to uniquely identify the single record that answers a query
    without having to look at any values within that record. A bad key will require
    that your application code interprets your record to determine if it does, in
    fact, match the query.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# 100 Part II: Key-Value Stores


    If you don''t design your key well, you may end up with one server having a disproportionately
    heavier load than the others, leading to poor performance. Using the current system-time
    as a key, for example, pushes all new data onto the last node in the cluster,
    which leads to a nightmare scenario of rebalancing. (Similar to what happens to
    me when I eat a burger. The more I place into the same large bucket — my mouth
    — the slower I get!)


    # Partitioning


    Partition design is important because some key-value stores, such as Oracle NoSQL,
    do not allow the number of partitions to be modified once a cluster is created.
    Their distribution across servers, though, can be modified. So start with a large
    number of partitions that you can spread out in the future.


    One example of partitioning is Voldemort''s consistent hashing approach, as shown
    in Figure 4-1. Here you see the same partitions spread across three servers initially
    and then across four servers later. The number of partitions stays the same, but
    their allocation is different across servers. The same is true of their replicas.


    ![](img/2afea990c282e97644b1fafcb6223852_117_0.png)


    Figure 4-1: Consistent partition allocation in Voldemort.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Chapter 4: Common Features of Key-Value Stores


    # Accessing data on partitions


    Key-value stores are highly distributed with no single point of failure. This
    means there''s no need for a master coordinating node to keep track of servers
    within a cluster. Cluster management is done automatically by a chat protocol
    between nodes in the server.


    You can use a trick in the client driver to squeeze maximum performance out of
    retrieving and storing keys and values — the client driver keeps track of which
    servers hold which range of keys. The client driver always knows which server
    to talk to.


    Most databases, NoSQL included, pass a request to all members of a cluster. Cluster
    either accepts or passes one under the hood to the correct node. This setup makes
    an extra network trip between nodes is possible, which can add to latency.


    In order to discover latency, most key-value stores'' client drivers maintain
    a metadata list of the current nodes in a cluster and partition key ranges each
    node manages. In this way, the client driver can contact the correct server, which
    makes operations faster.


    If a new node is added to a cluster and the metadata is out of date, the cluster
    informs the client driver, which then downloads the latest metadata before resending
    the request to the correct node. This maximum throughput is maintained with a
    minimum of overhead during development. Another side benefit is that there''s
    no need for a load balancer to pass queries to the next available, or least-busy,
    server — only one server (or read replica server) ever receives a client request,
    so there''s no need for load balancing.


    # Managing Data


    Once you manage the keys appropriately, you''re ready to design how to store data
    and ensure that it''s safe and always accessible for the work you need to do,
    which I explain in this section.'
  merge: -1
