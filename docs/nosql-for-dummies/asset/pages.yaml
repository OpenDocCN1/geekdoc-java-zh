    # Deciding on open-source versus commercial software


    Many people are attracted to open-source software because of the price tag and
    the availability of online communities of expertise. I use open-source software
    every day in my job — it''s essential for me, and it may be well for you.


    The good news is that you can find a lot of open-source NoSQL vendors and commercial
    companies that sell support, services, and enterprise versions of their software.


    Here are a few reasons to use open-source software in the first place:


    +   - Freely available software: This kind of software has been downloaded and
    tried by others, so some developers are at least familiar with it; and people
    spend time contributing only to the development of software they consider valuable
    or are passionate about.


    +   - Sites like StackOverflow.com: Sites like StackOverflow are full of fixes,
    and someone has probably approached these sites with problems you''re unlikely
    to encounter.


    +   - Try before you buy: With open-source software, you can become familiar with
    a free version of software before sinking your annual budget into purchasing an
    enterprise, fully supported version.'
