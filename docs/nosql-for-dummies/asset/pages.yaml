    MarkLogic Server''s trigger uses the W3C Xquery language. The following Xquery
    example is a simple trigger that, installed in MarkLogic, assigns and write permissions


    ```

    xquery version "1.0-ml";

    import module namespace

    tgr = ''http://marklogic.com/triggers/''

