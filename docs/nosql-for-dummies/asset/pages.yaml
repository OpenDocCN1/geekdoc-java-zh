    This is done either in a database or through an external mechanism LDAP or Kerberos.

    * **Permissions**: A list of roles with whether they read or update access to
    documents, URLs (directories), and code modules.

    * **Authorization by role based access control**: Users are assigned roles, and
    these are associated with permissions at the document level. User roles can be
    set in MarkLogic Server or read from an external directory server through LDAP.

    * **Compartment security**: Enforces AND on roles rather than OR logic. Basically,
    a user must have all roles attached to a named compartment in order to have permission
    on a document, rather than just role with permission. This role logic is useful
    for combining citizenship, job function, organization, and mission criteria required
