  md: '# Chapter 17: Document Database Products


    If you add two roles to a system, both with read access to the same document,
    then a user with either one of those roles can access the document.


    In some situations, though, you want to ensure that only users with all of a set
    of roles can access a document. This is called compartment security and is used
    by defense organizations worldwide.


    Consider the following compartments:


    +   - **Nationality**: British, American, Russian

    - **Organization**: CIA, NSA, DoD, UK SIS, UK NCA, FSB

    - **Classification**: Unclassified, Official, Secret, Top

    - **Compartment**: Operation Squirrel, Operation Chistase, ULTRA


    If a document has read permissions for the roles Secret, and Operation Chistase,
    then only users with all three roles have access to that document.


    Compartment security effectively enforces AND logic on roles instead of the normal
    OR logic. Roles must be in named compartments for compartment security to be enabled,
    though.


