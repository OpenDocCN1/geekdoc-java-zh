  md: '# 154 Part III: Bigtable Clones


    # Active-active clustering


    Perhaps your organization does “live” business in many locations in the world.
    If so, you need high-speed local writes to your nearest data center so all data
    centers must be writable. In this scenario, all data centers are primary-active
    data centers for their own information.


    Active-active clustering can happen at any location. All data centers are live
    all the time. Data is replicated between active sites, too, in order to provide
    for traditional disaster recovery.


    However, if the same data record is overwritten in multiple locations, you may
    be faced with having to choose between two options:


    +   - Wait for the site to write this data to all data centers, slowing down your
    transaction times.

    This option is in part A of Figure 10-1.

    - Replicate this data asynchronously, potentially losing some of the latest data
    if it is not replicated before an outage at one site.

    - This option is in part B of Figure 10-1.


    ![](img/2afea990c282e97644b1fafcb6223852_171_0.png)


    In my experience, it’s unusual to have a situation where the same record must
    be updated from multiple data centers. Normally, writing a new record locally
    and pushing that to the other sites asynchronously is sufficient. In this model,
    each site accepts writes, but only for a fixed number of partitions (primary keys).
    This still allows a global view to be generated, with a small chance of inconsistency
    with the remote replicated data. This option is in part C of Figure 10-1.


    When you absolutely need fast local data center writes across the world, a globally
    distributed database that supports full active-active clustering is needed. Cassandra
    is a Bigtable database that supports global active-active clusters while preserving
    as much speed as possible on ingest.


    # Managing time


    Many distributed databases rely on identifying the latest record by a timestamp.
    Of course, time is different across the world, and coming up with a reliable,
    globally synchronized clock is incredibly difficult. Most computer systems are
    accurate individually to the millisecond, with synchronization lag of a few milliseconds.
    For most systems this is fine, but for very large systems a more accurate time
    stamp mechanism is required.'
