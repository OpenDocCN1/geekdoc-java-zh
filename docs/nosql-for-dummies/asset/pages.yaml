    # Designing a row key


    HBase and Cassandra distribute data by row key. Each region server manages a different
    key space. This means that data distribution — and therefore, ingest and query
    performance depends on the key you choose.


    Consider an application that manages log files. You may be tempted to use the
    date and time of a message as the start of the row key. However, doing so means
    that the latest information will reside on the single server managing the highest-row
    key values.


    All of your newly ingested data will hit this single server, slowing ingest performance.
    It''s even worse if a set of monitoring dashboards are all querying for the last
    five minutes worth of data, because this single server will also have the highest
    query load. Performance suffers — and somebody may shout at you!'
