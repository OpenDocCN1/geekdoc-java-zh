  md: '# Chapter 7: Key-Value Store Products


    Riak handles writes when the primary partition server goes down using a system
    called hinted handoff. When data is originally replicated, the first node for
    a particular partition is written to, along with (by default) two of the following
    neighbor nodes.


    If the primary cannot be written to, the next node in the ring is written to.
    These writes are effectively handed off to the next node. When the primary server
    comes back up, the writes are replayed to that node before it takes over write
    operations again.


    In both of these operations, versioning inconsistencies can happen because replicas
    may be in different version states, even if only for a few milliseconds.


    Riak employs yet another system called active anti-entropy to alleviate this problem.
    This system crawls through updated values and ensures that replicas are updated
    at some point, preferably sooner than later. This helps avoid conflicts on read
    while maintaining a high ingestion speed, which avoids a two-phase commit used
    by other NoSQL databases with master-slave, shared-nothing clustering support.


    If a conflict does happen, Riak uses read pair to attempt to return only the latest
    data. Eventually, though depending on the consistency and availability settings,
    the client application may be presented with multiple versions and asked to decide
    for itself.


    In some situations, this tradeoff is desirable, and many applications intuitively
    know, based on the data presented, which version to use and which to discard.


