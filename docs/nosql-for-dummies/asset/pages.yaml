- img_proc: true
  md: '# 276 Part V: Graph and Triple Stores


    # Enabling ACID compliance


    Many of the triple and graph databases featured in this book are ACID-compliant.
    I talk about this in Chapter 2. As a reminder, ACID compliance means that a database
    must guarantee the following:


    +   - **Atomicity:** Each change, or set of changes, happens as a single unit.
    In a transaction, either all the changes are applied or all are abandoned (that
    is, a rollback occurs when the database is restored to its previous state).

    - **Consistency:** The database moves from one consistent state to another. Once
    data is added, a following request will receive view of the data.

    - **Isolation:** Each transaction is independent of other transactions running
    at the same time so, ideally, each transaction can be played one after the other
    with the same results. This arrangement is called being fully serializable.

    - **Durability:** Once data is confirmed as saved, you''re guaranteed it won''t
    be lost.


    These properties are important features for mission-critical systems where you
    need absolute guarantees for data safety and consistency. In some situations,
    relaxing these rules is absolutely fine. A good example is a tweet appearing for
    some people immediately, but for others with a few seconds delay.


    For highly interconnected systems where data is dependent on other data, or where
    complex relationships are formed, ACID compliance is a necessity. This is because
    of the unpredictable interdependency of all the subjects held in a triple store.


    Graph stores tend to guarantee ACID properties only on their primary master server.
    Because of the complex math involved, graph stores tend not to be sharded—that
    is, they do not part of their data residing on different servers. I discuss sharding
    for other NoSQL databases in Chapter 15, but in the following I talk about sharding
    in terms of consistency and


    It''s quicker for the math involved to have all the data on one server. Frankly,
    this means that you have two or more big servers, as described here:


    +   - All clients talk only to the first server, which I''ll call the master.
    Therefore, that database can easily provide ACID guarantees.


    ![](img/2afea990c282e97644b1fafcb6223852_293_0.png)'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# Chapter 20: Triple Stores in the Enterprise 277


    +   For the server''s replica(s) though, replication may ship data changes asynchronously,
    rather than within the same transaction boundary. This is normal on NoSQL databases
    and relational databases, but usually only between two separate clusters in different
    data centers rather than two servers in the same cluster.


    Graph stores changes asynchronously for the master and the replica(s) within the
    same data center. So, although graphs like Neo4j and AllegroGraph are technically
    ACID-compliant, they don''t guarantee the same-site consistency that other NoSQL
    databases covered in this book do. This is because of the two approaches to building
    a triple or graph store.


    A better option is to select either a graph store or triple store approach, based
    on the quality functionality you need.


    +   Single server for a whole database: High server costs. Other servers act as
    disaster recovery or reread replicas. You get very fast graph analysis algorithms,
    though


    +   Multiserver, sharded database: Lower server costs. Other servers are masters
    for portions of the data, and highly available replicas for others in the cluster.
    This option produces slower, complex graph functions, but you can still do SPARQL-style
    triple queries for individual records held just one single server.


    ![](img/2afea990c282e97644b1fafcb6223852_294_0.png)


    In an asynchronous, eventually consistent replica, it''s possible that, after
    a failure, some of the saved data will not be available on the replica.


    # Sharding and replication for high availability


    The simplest way to provide high availability is to replicate the data saved on
    one server to another. Doing so within the transaction boundary means that, if
    the master dies on the next CPU cycle after saving data, the data is guaranteed
    to be available on its replica(s), too.


    This is the approach ACID-compliant NoSQL databases generally take. Rather than
    these replicas sit idle, each one is a master for different parts of the entire
    triple store.


    So, if one server goes down, another server can take over the first server''s
    shards (partitions), and the service can continue uninterrupted. This is called
    a highly available service and is the approach that MarkLogic Server and OrientDB
    take.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# 278 Part V: Graph and Triple Stores


    An alternative and easier implementation is to make each replica eventually consistent
    with respect to its view of the data from the master. If a master goes down, you
    may lose access to a small frame of data, but the service as a whole remains highly
    available.


    If you can handle this level of inconsistency, then ArangoDB (from Franz, Inc.)
    may be a good open-source alternative to MarkLogic Server and OrientDB. ArangoDB
    is busy working on providing fully consistent replicas, but they''re not quite
    there yet.


    # Replication for disaster recovery


    The replication approach that graph stores provide in the same data center, and
    the replication approach three stores mentioned previously provide between data
    centers, is an eventually consistent full copy of data.


    Secondary clusters of MarkLogic Server, OrientDB, and ArangoDB are eventually
    consistent with their primary clusters. This tradeoff is common across all types
    of databases that are distributed globally.


    Primary clusters of Neo4j and AllegroGraph also employ this method between servers
    in the same site. Their master servers hold the entire database, and replica servers
    on the same site are updated with changes regularly, but asynchronously.


    In addition to replicating the master to local replicas, consider replicating
    the data to a remote replica, too, in case the primary data center is taken offline
    by a network or power interruption.


    # Storing Documents with Triples


    An emerging pattern is for document NoSQL databases to integrate triple store
    functionality. This makes sense. Document NoSQL databases typically provide


    +   - The ability to store many elements/properties within a single document

    - Concept of a collection for a group of documents

    - Ability to create specialized indexes over structures within their content

    - Ability to join different querys together to satisfy a request to match a document'
