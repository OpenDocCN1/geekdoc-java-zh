  md: '# Chapter 2: NoSQL Database Design and Terminology


    # Choosing ACID or BASE?


    As you might expect, much of the argument is because NoSQL vendors can differentiate
    themselves from their competitors by claiming a different, unique approach. It
    is interesting to note, however, the number of NoSQL vendors with ACID-compliance
    on their roadmap.


    Some NoSQL databases have ACID-compliance on their roadmap, even though they are
