  md: '150 Part III: Bigtable Clones


    # # Improving Performance


    Depending on how they''re used, you must tweak the configuration of databases
    to ensure that they perform as needed. In this section, I talk about some common
    options to keep in mind when you''re tuning a Bigtable clone.


    # ## Compressing data


    All of the Bigtable clones that I looked at for this book — HBase, Hypertable,
    Accumulo, and Cassandra support block compression, which keeps data values in
    a compressed state to reduce the amount of disk space used. Because, in general,
    Bigtables store simple binary compression.


    Several algorithms are typically supported, usually at least gzip and LZO compression.
    HBase and Cassandra, in particular several algorithms.


    Cassandra stores its data in the SSTable format, which is the same format as Google''s
    original Bigtable. This format has the advantage of using an append-only model.
    So, rather than update data in place — which requires uncompressing the current
    data, modifying it, and recompressing — data can simply be appended to the SSTable.
    This single compression activity makes fast.


    # ## Caching data


    NoSQL databases generally use an append-only model to increase the performance
    of write operations. New data is added to the storage structure, and data is marked
    for later deletion. Over time, merges happen to remove old data. Compaction is
    another word for this process.


    For write-heavy systems, this model can lead to a lot of merges, increasing the
    CPU load and lowering data write speed. Some Bigtable systems, such as Hypertable,
    provide an in-memory cache, which allows some of the merges to happen in RAM,
    reducing the load on disk and ensuring better performance for write operations.


    For read-heavy systems, reading the same data from disk repeatedly is expensive
    in terms of disk access (seek) times. Hypertable provides a read cache to mitigate
    this problem. Under heavy loads, Hypertable automatically expands this cache to
    use more of a system''s RAM.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# Filtering data


    Retrieving all records where a value is in a particular range comes at the expense
    of data reading bandwidth. Typically, a hashing mechanism on the row key is used
    to avoid reading a lot of data to filter it, you instead search a smaller portion
    of the database. Searching this value space is I/O-intensive as data increases
    to billions of records.


    Because "billions of records" isn''t an unusual case in NoSQL, a different approach
    is required. One of the most common techniques is called a Bloom filter, named
    after Burton Howard Bloom who first proposed this technique in 1970.


    A Bloom filter uses a predictable and small index space while greatly reducing
    requirements for disk access. This state is achieved because a Bloom filter is
    probabilistic; that is, it returns either Value may be in set or Value is definitely
    not in set, rather than a traditional Value is definitely in set.


    Exact value matches can then be calculated based on the results of the Bloom filter
    — a much reduced key space to search. The disk I/O is still greatly reduced, as
    compared to a traditional simple hashing mechanism that scans the entire table.


    HBase, Accumulo, Cassandra, and Hypertable all support Bloom filters.'
