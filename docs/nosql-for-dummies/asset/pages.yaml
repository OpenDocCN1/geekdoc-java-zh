  md: '# 142 Part III: Bigtable Clones


    # # Storing Data in Bigtables


    A Bigtable has tables just like an RDBMS does, but unlike RDBMS, a Bigtable generally
    don''t have relationships with other tables. Instead, complex data is grouped
    into a single table.


    A table in a Bigtable consists of groups of columns, where column families, and
    a row key. These together enable fast lookup of a single record of data held in
    a Bigtable. I discuss these elements and the data they allow to be stored in the
    following sections.


    # # Using row keys


    Every row needs to be uniquely identified. This is where a row key comes in. A
    row key is a unique string used to reference a single record in a Bigtable. You
    can think of them as being akin to a primary key or like a social security number
    for Bigtables.


    Many Bigtables don''t provide good secondary indexes (indexes over column values
    themselves), so designing a row key that enables fast lookup of records is crucial
    to ensuring good performance.


    A well-designed row key allows a record to be located without having to have your
    application read and check the applicability of each record yourself. It''s faster
    for the database to do this.


    Row keys are also used by most Bigtables to evenly distribute records between
    servers. A poorly designed row key will lead to one server in your database cluster
    receiving more load (requests) than the other servers, slowing-user-visible performance
    of your whole database service.


    # # Creating column families


    A column family is a logical grouping of columns. Although Bigtables allow you
    to vary the number of columns supported in any table definition at runtime, you
    must specify the allowed column families up front. These typically can''t be modified
    without taking the server offline. As an example, an address book application
    may use one family for Home Address. This could contain the columns Address Line
    1, Address Line 2, Area, City, County, State, Country, and Zip Code.'
