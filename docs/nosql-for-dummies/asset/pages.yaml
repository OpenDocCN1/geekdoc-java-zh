  md: '# Part I: Getting Started with NoSQL


    A very complex graph query like "Find me the subgraphs of this graph that most
    closely match these subjects" requires comparing links between many stored data
    entities (or subjects in graph speak). Because the query needs data about the
    links between items, having this data stored across many nodes results in a lot
    of network traffic.


    So, many graph databases store the entire graph on a single node. This makes queries
    fast but means that the multiserver scalabilities you get are multiple read-only
    copies of the data to assist multiple querying systems.


    Conversely, a document database like MongoDB or MarkLog may hold documents on
    a variety of servers (or database nodes). Because a query returns a set of documents,
    and each document exists only on a single node (not including replicas, of course),
    it is easy to pass a query to each of the 20 database nodes and correlate the
    results together afterward with minimum communication.


    Each document is self-contained and evaluated against the query by only the database
    node it is stored on. This is the same MapReduce distributed query pattern used
    by Hadoop MapReduce.


    Storing your information at the right level means that the queries can be evaluated
    at speed. Scheduling, genre, channel, series, and brand in a single document is
    easier to query than complex joins at query time.


    This is the old "materialized views versus joins" argument from relational database
    theorining in the NoSQL world.


    ![](img/2afea990c282e97644b1fafcb6223852_107_0.png)


    In a document database, you can denormalize the individual documents around series,
    programs, channels, and genres into a single document per combination. For example,
    "Doctor Who Series 5, Episode 1 will be shown on BBC 1 at 2000 on the March 3,
    2015," rather than a relational web of records with links that must be evaluated
    at query time.


    For an Internet catch query, querying the denormalized document set is as saying
    "Return all documents that mention ''Doctor Who'' and ''Series 5'' where the current
    time is after the airing time." No mention of joins, going off and on looking
    across multiple record (in this case document) boundaries.


    Denormalization does, create, duplication. This is a simple tradeoff between storage
    and update speed versus query speed. It is the same tradeoff you''re used to when
    creating views in relational databases, and it should be understood in the same
    way — that is, as a way to increase query performance, not a limitation of the
    database software itself.'
  merge: -1
