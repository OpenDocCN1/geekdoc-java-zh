- img_proc: true
  md: '# Chapter 9: Common Features of Bigtables 147


    called denormalization. Application developers find this approach easier to deal
    with because they can store an entire object as a row.


    A good example is an e-commerce order. You may have a column family for billing
    information, a column family for delivery information, and a column family for
    items within the order. Many order items are in a single order. Applying denormalization
    means you can operate on all data about an single entity.


    There are several benefits to this approach in a NoSQL database:


    +   - Application developers can work with an entity order as a single entity
    or object.

    - Read operations don''t need to complex joins, as in SQL, or on relational databases.

    - Write operations don''t require shredding of data (taking an aggregate structure
    and spreading it across many tables), just writing of a aggregate structure to
    a single record.


    Bigtables have HBase alternative mechanisms to denormalization:


    +   - Use a version of a value to store each actual value.

    - The number of retained versions is set at the time a column family is created,
    which means the number of items per order is limited.

    - Store the Order Items object as an aggregate, perhaps in JSON or XML.

    - Flatten some of the model keys and use composite rows key.


    This is similar to the way you store data with a relational database with joins,
    which enables fast scanning of all the data in an order.


    For a discussion of this modeling scenario, go to the HBase documentation, which
    you can find at http://hbase.apache.org/book.html#schema.casestudies.custorder.


    If you find yourself storing many values as JSON or XML "dumb" binary columns,
    consider a document database that supports secondary indexes. These document NoSQL
    databases are a much better fit for tree data models.


    ![](img/2afea990c282e97644b1fafcb6223852_164_0.png)


    ![](img/2afea990c282e97644b1fafcb6223852_164_1.png)'
