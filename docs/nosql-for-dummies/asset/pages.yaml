    In this chapter, I discuss both the Cassandra Bigtable database and the support
    that can be found from DataStax, its commercial back.


    # Designing a Modern Bigtable


    The Cassandra design team took the best bits from Amazon''s Dynamo paper on key-value
    store design and Google''s Bigtable paper on wide column store (also extended
    record store) design.


    Cassandra, therefore, provides high-speed key access to data while also providing
    flexible columns and a schema-free, join-free, wide column store. Developers who
    have used the Structured Query Language (SQL) in relational database management
    systems should find the Cassandra Query Language (CQL) familiar.'
