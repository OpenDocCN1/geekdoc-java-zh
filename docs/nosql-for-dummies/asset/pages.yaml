  md: '# Chapter 19: Common Features of Triple and Graph Stores


    SPARQL 1.1 Update is a variation of SPARQL that allows the insertion and deletion
    of triples within a named graph. It also provides graph deletion via the DROP
    operation and copy, load, move, and add operations.


    # Managing Triple Store Structures


    Triple stores provide great flexibility by allowing different systems to use the
    same data to describe things. That comes at the cost of allowing people to describe
    things in a very open and flexible way!


    RDF Schema (RDFS), OWL, and SKOS allow developers to use the familiar RDF mechanism
    to describe how these structures interrelate to each other and the existing relations
    and values.


    # Describing your ontology


    An ontology is a semantic model in place within an RDF store. A single store can
    contain information across many ontologies. Indeed, you can use two ontologies
    to describe different aspects of the same subject.


    The main tool used to describe the structures in an RDF ontology is the RDF Schema
    Language (RDFS). Listing 19-4 illustrates a simple example of an RDF Schema.


    # Listing 19-4: Some Assertions


    ```

    :title rdfs:domain :product

    :service rdfs:subClassOf :product

    :period rdfs:domain :service

    :foodstuff rdfs:subClassOf :product

    :expiry rdfs:domain :foodstuff

    ```


    Listing 19-5 shows how RDF Schema is used in practice.


    # Listing 19-5: Triples Within This RDF Schema


    ```

    :SoftwareSupport rdfs:type :service

    :SoftwareSupport :period "12 months"

    :SoftwareSupport :title "Software Support"

    :Camembert rdf:type :foodstuff

    :Camembert :title "Camembert Cheese"

    :Camembert :expiry "2014-12-24"^^xs:date

    ```'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# 270 Part V: Graph and Triple Stores


    The preceding schema implies the following:


    +   * Software support is a type of product.

    * Camembert is a type of product.

    * Both have a type in the product domain, rather than the service or food-stuff
    domains.


    Relationships within triples are directional, thus the semantic web industry''s
    frequent references to directed graphs. The relationship is from one subject to
    one object. In many situations, there is an opposite case, for example:


    +   * fatherOf (or motherOf) and sonOf

    * purchased and customer

    * ordered and customer


    The Web Ontology Language, OWL, provides extensions to RDF Schema that help model
    more complex scenarios, including that in Listing 19-6.


    # Listing 19-6: Simple Use of the OWL inverseOf Property


    ```

    :person rdf:type owl:Class .

    :fatherOf rdf:type owl:ObjectProperty;

    rdfs:domain : :person;

    rdfs:range : :person;

    owl:inverseOf : :sonOf

    :sonOf rdf:type owl:ObjectProperty;

    rdfs:domain : :person;

    rdfs:range : :person;

    owl:inverseOf : :fatherOf

    ```


    As you can see in Listing 19-6, the inverse predicate can be used to specify that
    relationships are the opposite of each other. This enables the presence of one
    relationship to infer that the other relationship also exists in the opposite
    direction.


    Of course, many more sophisticated examples are available. You can probably understand
    immediately of other ways to apply this concept.


    My personal favorite use of inferencing is to shorten paths within queries. You
    know from the preceding triples that Adam has an order, the order contains several
    items, and it has genres. So, you can infer a single fact: Adam is interested
    in databases. Being able to infer this fact can greatly simplify future queries.
    It allows a preference engine to use data without knowing how the ordering system
    is structured in the database.


    ![](img/2afea990c282e97644b1fafcb6223852_287_0.png)'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Chapter 19: Common Features of Triple and Graph Stores 271


    # Enhancing your vocabulary with SKOS


    A common requirement in using a triple store is to define concepts and how objects
    fit within those concepts. Examples include


    +   - Book categories in a library

    - Equivalent terms in the English language

    - Broadening and narrowing the focus of a concept using related terms


    SKOS is used to define vocabularies to describe the preceding scenarios'' data
    needs.


    A concept is the core SKOS type. Concepts can have preferred labels and alternative
    labels. Labels provide human readable descriptions. A concept can have a variety
    of other properties, including a note on the scope of the concept. This provides
    clarification to a user of the ontology as to how a concept should be used.


    A concept can also have relationships to narrower or broader concepts. A concept
    can also describe relationships as close matches or exact matches.


    Listing 19-7 is an example SKOS ontology used to describe customers and what class
    of customer they are with a company.


    # Listing 19-7: SKOS Vocabulary to Describe Customer Relationships


    ```

    amazon:primecustomer a skos:concept;

    skos:prefLabel "Amazon Prime Customer"@en ;

    skos:broader amazon:customer

    amamazon:customer a skos:concept;

    skos:prefLabel "Amazon Customer"@en ;

    skos:broader :customer;

    skos:narrower amazon:primecustomer

    ```


    SKOS provides a wide linkable mechanism for describing thesauri, taxonomies, folksonomies,
    and controlled vocabularies. This can provide a valuable data modeling technique.


    In particular, SKOS grants a great power to drop-down lists and hierarchical navigation
    user-interface components. So, consider SKOS for times when you need a general-purpose,
    cross-platform way to define a shared vocabulary, especially if the resulting
    data ends up in a triple store.'
  merge: -1
