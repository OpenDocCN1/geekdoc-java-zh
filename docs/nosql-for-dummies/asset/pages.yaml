    # Using simple structures


    Key-value stores are more flexible than relational databases in terms of the format
    of data. Use this flexibility to your advantage to maximize the rate of your application''s
    throughput. For example, if you''re storing map tiles, store them in hex format
    so that they can be rendered immediately in a browser.


    In your application, easy-to-use structures do not require cores of processing
    time. These structures can be simple intrinsic types like integers, strings, and
