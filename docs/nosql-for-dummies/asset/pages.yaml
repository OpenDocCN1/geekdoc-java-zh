    The DataStax OpsCenter is a monitoring tool for Cassandra. It''s available in
    a commercial version and also as a limited free version. This provides a visual
    dashboard for the health and status of only Cassandra but also the analytics and
    search extensions.


    If you''re adding new nodes to a cluster, DataStax OpsCenter gives you the ability
    to set up automated handling of cluster rebalancing. This capability greatly reduces
    the burden on database administrators.


    Also, configurable alerts and notifications can be sent, on a range of activities
    in the cluster. OpsCenter allows alerts to be fired based on, for example, when
    the CPU usage or data storage on a particular node breaches a defined performance
