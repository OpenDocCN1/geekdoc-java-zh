    # Evaluating Microsoft DocumentDB


    Microsoft DocumentDB is an impressive new entry in the document NoSQL database
    space. With tunable consistency, a managed service cloud offering, a universal
    edge for JSON documents with range query support, and JavaScript server-side scripting.
    DocumentDB is powerful for many cloud NoSQL scenarios.


    Currently, DocumentDB is only available on Microsoft Azure, and for a price. It
    doesn''t have an open-source offering, which will limit its adoption by some organizations,
    it''s likely to be attractive to Windows and .NET programmers who want to take
    advantage of the benefits of a schema-less NoSQL design with flexible consistency
    guarantees. These programmers may not want to learn the intricacies of non-Windows
    environments, like MongoDB on Red Linux, for example.


    .NET developers with exposure to SQL or NoSQL will find it easy to understand
    DocumentDB. As a result, DocumentDB will challenge MongoDB in the public cloud
    — because DocumentDB is more flexible and has better query options when a JSON
    document model is used.


    For private cloud providers and large organizations able to train people on how
    to maintain free, open-source alternatives, MongoDB will likely maintain its position.
    If Microsoft allows the purchase of DocumentDB for private clouds, this situation
    could change rapidly.


    Logic Server is likely to continue to dominate in cases of advanced queries with
    geospatial and semantic support; or where binary, text, and XML documents with
    always-ACID guarantees needs to be handled; or in high-security and defense environments.


    The same old, Microsoft should be commended for this well-thought-out and feature-rich
    NoSQL document database. This new entrant among Oracle''s NoSQL key-value store
    (refer to Part II more for Oracle NoSQL) and the Cloudant NoSQL database (which
    IBM purchased in 2014) proves that NoSQL is making the big boys of the software
    industry sit and take notice.'
