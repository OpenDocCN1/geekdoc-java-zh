- img_proc: true
  md: '# 242 Part IV: Document Databases


    3. All changes are appended as new documents to the end of a database file, both
    in-memory and on disk.


    In MarkLogic, this is called a stand. There are many stands within a forest, which
    is the unit of partitioning in MarkLogic Server. A single server manages multiple
    forests. They can be merged or migrated while the service is live, maintaining
    a constant and consistent view of the data.


    Of course, with new records being added and old records that are no longer visible
    somewhere in the stand files, an occasional cleanup operation is needed to remove
    old data. This process is generally called compaction, in MarkLogic, it''s called
    a merge operation. This is because many stands are typically merged at the same
    time as data is removed.


    Always appending data means that reads don''t have to block other requests, ensuring
    fast read speeds while still writes. This mechanism is also the basis for ACID
    guarantees for the protection of data and consistency of query and retrieval.


    MarkLogic Server also updates all indexes within the transaction boundary. Therefore,
    it''s impossible to get false positives on document updates or deletions, and
    all documents are discoverable as soon as the transaction creating them completes.
    No need to wait for a traditional search engine''s re-indexing run.


