    comparison tables with multiple products listed next to their prices and functionality.
    You might use big green marks or red crosses to help identify the options with
    least functionality; a purchaser could select the best compromise between price
    and functionality.


    This type of "beauty pageant" can be distracting. It tempts you to prioritize
    the number of functions available versus the value of those functions (or not)
    to your organization. What is needed is an assessment of the overall data needs
    of your organization. This should include weights for how important a feature
    is (critical, optional, nice to have). This analysis is more balanced, providing
    a better picture of both technical and business fit with your organization’s needs.


    This comparison mechanism is especially important when selecting a hybrid NoSQL
    database. This is because a single product likely covers a wider range'
