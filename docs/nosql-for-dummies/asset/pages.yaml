    likes of the DOD and regulators, and in the lack of a built-in permissions model.


    Accreditation and certification for public groups such as defense and sensitive
    government agencies provide assurance to both the organizations and to the public
    that best practice with writing security code has followed. If security is implemented
    at the application level, then the application and database are accredited together
    as a single system. This may not be a problem for some, but if you''re trying
    to justify the creation of a new application built on a secure database, having
