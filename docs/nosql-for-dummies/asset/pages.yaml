- img_proc: true
  md: '# 106 Part II: Key-Value Stores


    Key-value stores are great for high-speed data ingestion. If you have a known,
    predictable primary key, you can easily store and retrieve data with that key.
    It''s even better if the key is designed to ensure an even distribution of new
    data across all servers in the cluster.


    Avoid traditional approaches of an incremented number. Instead, use a Universal
    Unique Identifier (UUID). A UUID is a long alphanumeric string that is statistically
    unlikely to be in use.


    Using a UUID means that the partitions you create will each receive an even amount
    of new data. This approach evens out the ingestion load across a cluster. One
    partition will have keys starting with, for example, 0000 to 1999.


    Unfortunately, the more records you have, the more likely your keys will clash
    when using UUIDs. This is where you use a timestamp—concatenated to the UUID—to
    ensure uniqueness.


    Without complex indexing or query features, key-value stores ensure the maximum
    ingestion speed of data. The databases needed to accomplish storage are relatively
    simple, but you need to consider hardware such as the following:


    +   **Memory**: Many databases write to an in-memory storage area first and only
    checkpoint data to disk every so often.


    +   **SSD**: High-speed flash storage is great for storing large synchronous writes—for
    example, large in-memory chunks of new data that are offloaded to disk so RAM
    can be reused for new data. Using high-quality SSDs take advantage of this write
    speed advantage. Some databases, such as Aerospike, natively support SSD storage
    to provide maximum throughput.


    +   **Disk arrays**: It''s always better to have more spindles (that is, discs)
    with less capacity than one large disk. Use 10K RPM spinning discs as your final
    tier and consider a high-performance RAID card using RAID 10. RAID 10 allows newly
    written data to be split across many discs, maximizing throughput. It also has
    the handy benefit of keeping an extra copy of your data in case a hard disk fails.


    ![](img/2afea990c282e97644b1fafcb6223852_123_0.png)


    ![](img/2afea990c282e97644b1fafcb6223852_123_1.png)'
