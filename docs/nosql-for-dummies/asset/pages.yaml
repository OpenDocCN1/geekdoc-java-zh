    # C. Local and remote replicas updated asynchronously, always eventually consistent


    +   1. Write arrives->.

    2. Acknowledged immediately. Replicas only updated sometime later


    ![](img/2afea990c282e97644b1fafcb6223852_172_2.png)


    An out-of-sync clock means that one site thinks it has the latest version of a
    record, whereas in fact another somewhere in the world wrote an update just after
    the local write. Only a few applications, though, are affected by this time difference
    to the extent that data becomes inconsistent. Most records are updated by the
    same application, process, or local team of people who wrote it in the first place.
    Where this isn''t the case (like in global financial services where trades can
    be processed anywhere), synchronization is an issue.


    Google comes up with a mechanism for a reliable global timestamp called the Google
    TrueTime API, and it’s at the head of the Spanner MySQL relational database, which
    stores its data in the Bigtable NoSQL column database.


    This API describes the concept of uncertainty in terms of current time. It uses
    a time interval that’s guaranteed to include the time at which an operation happened.
    This approach better clarifies when an operation definitely or may have happened.
    The time synchronization uses atomic clocks or GPS signals.


    Many databases, except Google Bigtable itself, support the concept of a record
    timestamp. These stamps don''t rise up to the level of science that Google’s TrueTime
    API does, but they provide a close approximation that may suffice in your particular
    use case. Notably, Accumulo has its distributed time time API within a cluster.'
