  md: '# 156 Part III: Bigtable Clones


    # Reliability


    Reliability refers to a service that''s available and can respond to your requests.
    It means you''re able to access the service and your data, no matter what''s going
    on internally in a cluster.


    Conversely, if you can''t communicate with the server in the cluster and can''t
    access the data in the server, your database needs to handle the lack of communication.


    The database also needs to handle failures. What happens if the disk drive dies?
    How about a single server''s motherboard? How about the network switching covering
    a quarter of your database cluster? These are the kinds of things that keep database
    administrators up at night (and employed, come to think of it).


    In this section, I discuss how Bigtable databases provide features that alleviate
    database cluster reliability issues.


    # Being Google


    In Google''s Bigtable paper, which I introduced in Chapter 1, its authors discuss
    their observations on running a large distributed database. Bigtable powers Google
    Analytics, Google Earth, Google Finance, Orkut, and Personalized Search. These
    are large systems, and Google''s observations regarding such systems are interesting.
    In particular, they spotted various causes for system problems, as shown here:


    +   - Memory corruption: Where a system''s state becomes invalid

    - Network corruption: Where data is modified while in transit

    - Large clock skew: Where servers disagree on the "current" time

    - Hung machines: Where servers do not respond while others do

    - Extended and asymmetric network partitions: Where long network lags occurs,
    and also "split brains," where a cluster of nodes is divided into two (or more)
    clusters unevenly, each receiving requests as if the whole cluster was still operational
    and communicative

