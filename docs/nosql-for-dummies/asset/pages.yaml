  md: '# Part I: Getting Started with NoSQL


    Amazon Dynamo paper

    Amazon released a paper of its own in 2007 describing its Dynamo data storage-application.
    In Amazon''s words: "Dynamo is used to manage the state of services that have
    very high reliability requirements and need tight control over the tradeoffs between
    availability, consistency, cost-effectiveness and performance."


    The paper goes on to describe how a lot of data is stored by a primary key, how
    consistent hashing is used to partition and distribute data, and how object versioning
    is used to maintain consistency across data centers.


    The Dynamo paper basically describes the first globally distributed key-value
    store used at Amazon. Here the keys are logical IDs, and the values can be any
    binary value of interest to the developer. A very simple model, indeed.


    # The second NoSQL databases "meetup"


    | Many open-source NoSQL databases emerged in 2009. Riak, MongoDB, HBase, Accumulo,
    Hypertable, Redis, Cassandra, and Neo4j were all created between 2007 and 2009.
    These are just few NoSQL databases created during this time, so as you can see,
    a lot of systems were produced in a short period of time. However even, innovation
    moves at a breakneck speed. | Have you run into these newfashioned relational
    databases? Don''t mind trading a query language for scalability? Or perhaps you
    just like shiny new things to try out? Either way this meetup is for you. Join
    us in figuring out how these newfound Dynamo clouds and BigTables have become
    popular lately. We have gathered presenters from the most interesting projects
    to give you an introduction to the field. | This meetup included speakers from
    LinkedIn, Facebook, Powerset, Tumblestone, ZEvents, and couch.io who discussed
    Voldemort, Cassandra, HBase, Hypertable, and CouchDB, respectively. This meeting
    represented the first time that people came together to discuss these different
    approaches to nonrel databases and to brand them as NoSQL. |


    This rapidly changing environment led Eric Evans from Rackspace and Johan Eriksson
    from Last.fm to organize the first modern NoSQL meetup. Needing a title for the
    meetup that could be easily shared on social media, they chose the NoSQL tag.


    The #NoSQL hashtag is the first modern use of what we all regard as the term NoSQL.
    The description from the meetup is well worth reading in full — as the sentiment
    remains accurate today.


    > “This meetup is about open source, distributed, non relational databases”.'
