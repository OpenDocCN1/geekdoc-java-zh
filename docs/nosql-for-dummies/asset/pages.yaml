  md: '# Chapter 27: Types of Search Engines


    # Evaluating Lucene/SolrCloud


    SolrCloud provides Lucene with a highly available, failure-tolerant, distributed
    indexing and search layer. You can use SolrCloud to enable a Solr cluster to do
    the following:


    +   * Create multiple replica shard searches that can be distributed across different
    servers hosting the same information, providing faster query response times.

    * Create multiple master shards so that data can be split across multiple machines,
    which reduces the indexes per machine and optimizes write operations. It also
    increases the amount of an index that can fit into memory, which improves query
    times.


    SolCloud (Version 4 and above) operates a master-slave replication mechanism.
    This means a write happens locally and is eventually pushed to all replicas. Therefore,
    a Lucene/Solr cluster is essentially consistent—clients may not see a new or updated
    document for a while, although usually for milliseconds. This delay can be an
    issue if you absolutely need an up to date view of your data. A good example of
    this is when looking for the latest billion dollar trade you make.


    Solr also acts as a NoSQL database, allowing documents to be written and committed.
    They can also be patched without a full replacement, much as they are in document
    NoSQL databases.


    A manual commit is required to ensure that the documents are written to the transaction
    log, and thus preserved if a server failure occurs.


    SolrCloud uses Apache ZooKeeper to track the state of the cluster and to elect
    master shards in the event of server failure. This prevents a "split brain" of
    two parts of the cluster operating independently.


    Apache also recommends that you set up ZooKeeper in a highly available manner,
    over a set of servers. This is called a ZooKeeper ensemble. Apache also recommends
    doing so on dedicated hardware, because if you don''t, you will have to restart
    ZooKeeper to modify and do updates. If it is also located on a Solr machine, a
    forced failure will occur.


    ZooKeeper is required for all new database client applications to connect in order
    to determine the state of the cluster and perform a query. To ensure that your
    SolrCloud instance is highly available, you must set up a ZooKeeper ensemble across
    multiple machines. Otherwise, you''ll have a very stable SolrCloud cluster that
    no one can query!


    ![](img/2afea990c282e97644b1fafcb6223852_360_0.png)'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# 344 Part VI: Search Engines


    Solr doesn''t handle disaster recovery clusters. The current recommendation is
    to set up two SolrCloud clusters that know nothing about each other. When adding
    documents (updating indexes), you must commit changes to both clusters. As a result,
    application developers bear the burden of establishing consistency.


    SolCloud is a solid, distributed search platform, though it goes beyond what is
    provided by Lucene — it is not merely a distributed set indexes. These features
    make Solr a leading open-source search engine that will appeal to many developers
    of enterprise Java applications. SolCloud offers:


    +   * Faceted navigation and filtering

    * Geospatial search, including points and polygons

    * Structured search format as well as a free text search grammar

    * Text analytics

    * Dynamic fields, allowing new fields to be incorporated into existing indexes
    without reconfiguration of an entire system

    * Multiple search index configurations for the same field

    * Configurable caching

    * Storage of XML, JSON, CSV, and binary documents

    * Text extraction from binary documents using Apache Tika and metadata extraction
    using Apache UIMA


    Solr is accessible via an HTTP-based API, allowing any programming language to
    use the search platform''s services.


    # Combining Document Stores and Search Engines


    The way to guarantee the highest write performance of a database with a real-time,
    advanced search engine is to use a database that is a search engine. MarkLogic
    server is unique in the NoSQL database landscape being built using search engine
    indexing techniques from the start, rather than just for storing and retrieving
    data and having search indexing and query execution added on later.'
  merge: -1
