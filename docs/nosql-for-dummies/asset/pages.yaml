    - Ensuring optimum performance


    In previous chapters, I''ve focused on RDBMS features. Now, I want to talk about
    the useful features provided by Bigtables and how to improve the performance of
    your Bigtable applications.


    Bigtables clones are a type of NoSQL database that emerged from Google''s seminal
    Bigtable paper. Bigtables are a highly distributed way to manage tabular data.
    These tables of data are not related to each other like they would be in a traditional
    Relational Database Management System (RDBMS).


    Bigtables encourage the use of denormalisation — copying summary data in several
    records — for fast read speed, rather than using relationships that require CPU-costly
    data reconstitution work at query time.


    In Chapter 11, I cover the use of Bigtables; however, to make the best use of
    them, you first need to understand how they organize data and how to structure
    data for its optimal use. That''s the purpose of this chapter.


    In this chapter, I describe how Bigtable clones based on Google''s original Bigtable
    are different from RDBMS technology. I also discuss the mindset needed to understand
    and best use Bigtable NoSQL databases.'
