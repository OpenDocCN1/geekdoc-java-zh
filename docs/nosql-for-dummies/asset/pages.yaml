  md: '# Chapter 23: Neo4j and Neo Technologies 313


    # Clustering


    Neo4j''s Enterprise Edition provides support for highly available clustering.
    Neo4j master server manages the primary data store for all write operations.


    You can add other servers to the cluster to provide failover in case the master
    fails and to spread out the query load. These replicas are updated during a write
    transaction using an optimistic commit. An optimistic commit is one where you
    assume the write operation has succeeded without specifically checking for it.
    This usually happens on secondary replicas.


    ![](img/2afea990c282e97644b1fafcb6223852_330_0.png)


    If one of the replicas is unavailable, it will be updated at a later date. Therefore,
    Neo4j doesn''t guarantee ACID consistency across an entire cluster. The inconsistency
    may last for a very short window of time, but timing is important in situations
    where the master fails before a replica is updated.


    # High-performance caching


    When operating as a cluster, a client API operation can land on any Neo4j instance,
    which is okay in many cases. If you receive many queries for the same data, you
    want to cache them in memory — doing so is faster than always fetching data from
    disk.


    Neo4j provides two types of cache:


    +   - **Buffer cache**: Caches the data on disk in the same, efficiently compressed
    format.

    - This also acts as a write-through cache when you''re entering new data into
    Neo4j and journaling it to disk.

    - **Object cache**: Stores nodes, relationships and their properties in a format
    for in-memory graph traversal.

    - This supports multiple techniques, defaulting to the high-performance cache
    (hpc).


    By providing these caches, Neo4j helps to increase the speed of both high ingest
    rates and common read queries.'
  merge: -1
