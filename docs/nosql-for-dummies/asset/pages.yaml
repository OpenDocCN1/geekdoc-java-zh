- img_proc: true
  md: '# 272 Part V: Graph and Triple Stores


    # # Describing data provenance


    In the day-to-day use of databases you likely create, update, and delete data
    with abandon. In this book, you find out how to gather information from disparate
    sources and store all of it together, using document or semantic mechanisms to
    create new content or infer facts.


    In larger systems, or systems used over time, you can end up with very complicated
    interconnected pieces of information. You may receive innocent tweet that shows
    a person may be of interest to the police. Then decide months later, after examining
    lots of other data, that this person''s house should be raided.


    How do you prove that the chain of information and events you received, assessments
    you made, and decisions taken were reasonable and justified for this action to
    take place?


    Similarly, records, especially documents held in document-oriented NoSQL databases,
    are changed by people who are often in the same organization. This is even more
    the case when you''re dealing with distributed systems like a Wiki. How do you
    describe the contents that goes over time, when it changed it, and why? This kind
    of documentation is known as *data provenance*.


    You can invent a number of ways to describe these activities. However, a wonderful
    standard based on RDF has emerged to describe such changes of data time.


    The W3C (yes, people again!) PROV Ontology (PROV-O) provides a way to describe
    documents, versions of those documents, changes, the people responsible, and even
    the software or mechanism used to make the change!


    PROV-O describes Entity: The subject being created, changed, or used as input


    +   - prov:Activity: The process by which an entity is modified prov:Activity:
    The process by which an entity is modified

    - prov:Agent: The person or process carrying out the activity on an entity


    These three core classes can be used to describe a range of actions and changes
    to content. They can form the basis for systems to help prove governance is being
