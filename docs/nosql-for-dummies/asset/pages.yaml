  md: '# Part V: Graph and Triple Stores


    # Combining queries


    Once you start this joined approach between the document and semantic worlds,
    you may get to a point where you need to perform a combined query.


    With a combined query, you query both the document and the triple store in order
    to answer a question related to all the information in your database.


    A combined query could be a document provenance query where you want to return
    all documents in a particular collection that have, for example, a “genre” field
    of a particular value and that also were added by a semantically described organization
    called “Big Data Records, Inc.”


    Another possibility is that the document you''re storing is text that was semantically
    extracted and enriched. (Refer to Part IV for more on this process.) This means
    that the text in the document was analyzed, and from the text extracted, for example,
    names of people, places, and organizations and how they relate to one another.


    If this document changes, the semantic data will also change. In this case, you
    want to be able to replace the set of information extracted from the document
    and stored in the triple store. There are two mechanisms for doing so:


    +   Use a naive graph. Use the document ID, or a variation of it, for the name
    of a graph and store all extracted triples in that graph, which makes it easy
    to update the extracted metadata as a whole. This works for all triple stores.


    +   The advantage of a named graph is that it works across triple store implementations.
    The downside is that you have to manually create server-side code to execute one
    query against the triple store and against another the document store in order
    to resolve your complex provenance query.


    +   Store the triples in the document they were extracted from. If your document
    structure supports embedding different namespaces, like MarkLogic Server, you
    can store an XML representation of the triples in an element inside the document.


    This approach offers the advantage of linking all the required indexes in the
    same document ID (MarkLogic Server calls this a URI). MarkLogic Server has a built-in
    search engine that includes support for full text, range (less than, greater than)
    queries, as well as semantic (SPARQL) queries.'
