  md: '# Chapter 16: Document Database Use Cases


    To ensure that it''s the right person, store the provenance information of what
    you find, and how it was modified or generated. Why did you add the twitter id
    to the record? What evidence do you have (list of tweets)? How certain are you
    (percentage match relevance)?


    You''ll be able to see whether any of the identifying information in the last
    couple of months clusters at a new address. Perhaps a rented property in the next
    town. In this fashion, you can find the debtors new address.


    # Providing answers as documents


    Once you bring all the information together, you need to provide it in a user-friendly
    way to people who utilize your application.


    For catch-up TV services, for example, there''s no point in showing episode summaries
    or a list of all the channels and times for the past two weeks and the next six
    months they''ll be showing. Instead, it''s better to show a set of episodes that
    the user can watch now, no matter when their start and end dates occurred.


    Taking this source information and creating a different amalgamated view at different
    levels of granularity is called denormalization. This is a very common case with
    document-oriented NoSQL databases. Instead of joining at query time (as you can
    do with a relational database), you precompute the joins and store the results
    as documents, perhaps in a different collection.


    You need to pull information from the episode and availability documents, perhaps
    along series, brand, and platform (for example, Wii, web, set-box top, Apple Store)
    in order to compose the denormalized *episode-availability documents.


    The best way to think about these denormalized documents is as answer documents.
    Based on the questions users can ask, what would you expect the answer to look
    like? Given this information, you can create a set of denormalization operations
    that make sense for your application.


    If you''ve created denormalizations well, the answer documents will contain all
    the information that a user needs for a query in order to find them. These'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'documents can then be indexed for query. Alternatively, you can use a search
    engine to provide a full-text index for episode-availability searches.


    Although it takes up more space, creating denormalizations reduces query and processing
    time because only one document is read, and the query doesn''t have to process
    and join together many records in order to provide the single answer the user
    is looking for.


    Producing denormalizations is the document NoSQL database equivalent of a materialized
    view in the relational database world. Materialized views are pre-computed joins
    across tables, used to avoid joins at query time. You''re trading storage space
    for query speed and I/O workload. Depending on your application and complexity
    of the joins, this tradeoff may be worth making.'
