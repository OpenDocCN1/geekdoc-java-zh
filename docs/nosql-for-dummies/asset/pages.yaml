  md: '# Chapter 12: Bigtable Products


    # Assessing HBase


    HBase is the original and best-known Bigtable clone in the NoSQL space today,
    and it is tightly linked to Hadoop, which makes it an obvious NoSQL database candidate
    for any organization with a HBase deployment.


    However, if you''re thinking about using HBase, you need to consider several points.
    For example, HBase is written in Java, so it isn''t as fast as a database implemented
    in C++.


    Moreover, HBase isn''t transactionally consistent, so it may not be suitable for
    some-critical workloads as a primary master store of data. Also, the fact that
    HBase requires HDFS storage is a barrier for organizations that don''t use Hadoop,
    so HBase adds more complexity to an application architecture, and requires extra
    knowledge to deploy it.


    Not all of the issues from the relational database have been solved in Bigtables.
    In a Bigtable, your data is still in a table structure, requiring at least up-front
    schema design for fast operation, and it takes time to design this schema and
    get it; making data fit in a table storage model forces you to write "plumbing"
    code to convert data when reading and writing to the database.


    For example, HBase must be taken completely offline in order to create a new column
    family or new tables. This is a major barrier to ongoing agile development.


    No dedicated commercial entity backs HBase. Cloudera is the only commercial company
    you could say extensive HBase support, but it''s currently selling support for
    three NoSQL databases on top of Hadoop distribution. The three are Accumulo, MongoDB,
    and HBase. On its website, Cloudera is positioning HBase as an entry-level database
    for Hadoop.


    Be sure that HBase has all the features you need and that you can find the right
    level of support and development expertise for your rollout. You''ll likely want
    more of this support in-house with HBase, and be sure to confirm your designs
    up front during proof of concept testing.


