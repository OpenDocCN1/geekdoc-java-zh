  md: '# Chapter 15: Document Databases in the Enterprise


    Automatic sharding works for a live cluster, but if you need to scale out or scale
    back during peak periods, you''ll need to rebalance your partitions. For example,
    a new server with little data will respond quicker than one of the existing servers
    with lots of data. Using automatic sharding rebalances among the new (empty) and
    existing (crowded) servers, increasing response times.


    Rebalancing automatically, rather than based on key range for each server, is
    an easier operation — you simply move the individual documents you need in order
    to balance, rather move them around to maintain fixed range buckets on each server.
    This means fewer documents to move around, and means you move them to a less busy
    server.


    However, no approach to assigning documents is truly balanced. Some servers will,
    for reasons unknown to we mortals, perform slightly worse than others, causing
    partitions to become slightly weighted over time. Rebalancing fixes this problem.


    In some databases this rebalancing, or fixed range repartitioning, has to be initiated
    manually (Cbase). This has a performance impact across a cluster. Some document
    databases, like MarkLogic Server, perform this rebalancing live as it needs to.
    This evens out rebalancing load over time, rather than having to impact cluster
    performance when manually forced in a short time window.


    # Preventing Loss of Data


    Durability relates to keeping data intact once it''s saved. Both ACID-compliant,
    fully consistent systems and non-ACID, eventually consistent systems are capable
    of being durable.


    Durability is typically achieved by


    +   - Always writing the document to disk as it arrives before returning a successful
    response.

    - This impacts the performance of write operations.

    - Writing to memory but writing a journal of the change to disk.

    - A journal log entry is a small description of the change. It provides good performance
    while ensuring durability.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# 216 Part IV: Document Databases


    If a server writes to memory only during the transaction, with no journal log,
    then it''s possible for the server to fail before the data is saved on disk. This
    means the data in memory is lost permanently — it is not durable.


    Not all databases guarantee durability by design. Couchbase, for example, only
    writes to RAM during a write operation. An asynchronous process later writes the
    data to disk.


    You can use the PersistTo option in Couchbase to ensure that data is forced to
    disk within the bounds of a write operation.


    At the time of this writing, Couchbase 3.0 was in beta and about to be released.
    This version takes a different approach to durability. It still writes data to
    RAM, but a new approach — the Couchbase Data Change Protocol (DCP) — is used to
    stream these changes from RAM to other replicas. This can happen before the originating
    server saves the data to disk.


    By Couchbase''s own admission, there is still a small window of time in which
    data can be lost if a server failure happens. There is no way to predict or fix
    this problem when it happens because there''s no journal — the data is irreversibly
    lost.


    Most databases use a log as a good tradeoff between the performance of write operations
    and durability. MarkLogic Server and MongoDB both use journal files to ensure
    that data is durable. Microsoft DocumentDB, instead, applies the full change during
    a transaction, so a journal file is not needed.


    # Replicating data locally


    Once the data is saved durably to a disk on a single server, what happens if server
    fails? The data is safe, but inaccessible. In this situation, data replication
    within a cluster is useful.


    Replication can either occur


    +   * Within a transaction (called a two-phase commit): if within a transaction,
    then all replicas have the same current view of the updated document.


    +   * After a transaction completes: In this case, the replica will be updated
    at some point in the future. Typically, this inconsistency lasts for seconds rather
    than minutes. This is called eventually consistent replication.


    ![](img/2afea990c282e97644b1fafcb6223852_233_0.png)


    ![](img/2afea990c282e97644b1fafcb6223852_233_1.png)


    ![](img/2afea990c282e97644b1fafcb6223852_233_2.png)'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Chapter 15: Document Databases in the Enterprise


    Whichever method you use, once it''s complete, you''re guaranteed that another
    copy of the data is available elsewhere in the same cluster. If the originating
    server goes down, the data can still be returned in a query.


    # Using multiple datacenters


    What if you''re really having a bad day, and someone digs up a network or power
    cable to your entire datacenter? This is where database replication comes in.


    In database replication, the changes to an entire datacenter across a cluster
    are streamed as they happen to one or more backup clusters in a remote datacenter(s).
    Because of the network latency involved, this process generally asynchronously
    as a tradeoff between the speed of write operations and the consistency of remote
    data.


    Because this replication is asynchronous, some data may not be available at the
    second site if the first site becomes unavailable before the data is replicated.
    If new writes or updates occur at the backup site when it takes over the service,
    these changes need to be merged with the saved, but not replicated on the original
    site when you switch back. At times, this process may create a conflict with two
    "current" views of the same data that you must fix manually once inter-cluster
    communication is restored.


    # Selectively replicating data


    Sometimes you may have different needs for your own data center clusters. Perhaps
    you only want a partial set of information replicated to other live clusters,
    for reference reasons.


    A good example of this is a metadata catalog in which a description of the data
    cluster holds is replicated to other sites, not the data itself. This kind of
    catalog is useful for very large files that you don''t need to replicate to all
    sites. One-replicated file store the holds, while your NoSQL document database
    handles the metadata catalog.


    If you have a small cluster or an individual node (an austere cluster) that isn''t
    always connected, database replication isn''t a good option, over time, a backlog
    of updates could build up and have to be sent all together to the cluster when
    the austere cluster connects. This situation can cause the secondary cluster to
    struggle to catch up. An example is a ship, oil rig, or special forces soldier''s
    laptop.


    ![](img/2afea990c282e97644b1fafcb6223852_234_0.png)


    ![](img/2afea990c282e97644b1fafcb6223852_234_1.png)'
  merge: -1
