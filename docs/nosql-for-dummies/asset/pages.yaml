  md: '# Chapter 16: Document Database Use Cases 225


    # Managing Unstructured Data Feeds


    Managing unstructured data is very challenging. Unlike well-designed JSON and
    XML documents, unstructured data doesn''t provide hints to the objects it describes.
    Structures also vary greatly because human language isn''t restricted to a single
    way of writing.


    Once the data is extracted, it''s likely to be a lot of text with no structure.
    You need to figure out what the "things" mentioned are. These could be, for example,
