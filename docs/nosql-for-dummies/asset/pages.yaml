    # Range indexing and aggregate queries


    Often you don''t need to index the exact values of elements and attributes, or
    words and phrases. Instead, you need to perform a range operation like these:


    +   - Find all documents updated in the last week.

    - List all articles published in August 2009.

    - List all employees who are between 5 and 6 feet tall.

    - List all types of cheesend with a Wendy Rating greater than three stars.


    My Wendy, loves cheese!


    These are all queries that fall before or after a single value, or that lie between
    two values — a value range.


    MarkLogic stores range indexes similarly to the universal index, except that the
    values are stored in order, which makes finding lists of matching documents even
    faster.


    Rather than scanning the entire index for all values and checking that they are
    between the two limits of your range query, MarkLogic finds the lower limit value,
    the upper limit value, and aggregates the document IDs of every list of terms
    in between, which results in much faster resolution.


    These indexes are also cached in memory. They can be combined with structure,
    and term queries in a single index resolution — that is, one hit on the indexes.


    Each range index obviously has its own type. All the basic XML types are supported
