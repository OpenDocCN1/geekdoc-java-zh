  md: '# 118 Part II: Key-Value Stores


    # The Amazon Dynamo paper


    Amazon came up with the notion concept of a NoSQL key-value store when it created
    the Dynamo DB. In this database, and its accompanying published paper, introduced
    the world to highly scalable distributed key-value stores.


    Dynamo incorporated the ideas of storing all information by a single primary key,
    using consistent hashing to spread data throughout a cluster and object versioning
    to manage consistency.


    Dynamo introduced a gossip intercommunication protocol between key-value servers
    and replication techniques between servers, all with a simple data access API.
    Dynamo was designed to tradeoffs between consistency, availability, and cost-effectiveness
    of a data store.


    These have all since become standard features key-value stores.


    # High-Speed Key Access


    Key-value stores are all about speed. You can use various techniques to maximize
    speed, from caching data, to having multiple copies of data, or using the most
    appropriate storage structures.


    # Caching data in memory


    Because data is easily accessed when it''s stored in random access memory (RAM),
    choosing a key-value store that caches data in RAM can significantly speed up
    your access to data, albeit at the price of higher server costs.


    Often, though, this tradeoff is worth making. You can easily calculate what percentage
    of your stored data is requested frequently. If you know five percent is requested
    every few minutes, then take five percent of your data size and add that number
    as RAM space across your database servers.


    Bear in mind that the operating system, other applications, and the database server
    have memory requirements, too.


    # Replicating data to slaves


    In key-value stores, a particular key is stored on one of the servers in the cluster.
    This process is called key partitioning. This means that, if this key is constantly
    requested, this node will receive the bulk of requests. This node,'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'therefore, will be slower than your average request speed, potentially affecting
    the quality of service to your users.


    To avoid this situation, some key-value stores support adding read-only replicas,
    also referred to as slaves. Redis, Riak, and Aerospike are good examples. Replication
    allows the key to be stored multiple times across several servers, which increases
    response speed at the cost of more hardware.


    Some key-value stores guarantee that the replicas of the key will always have
    the same value as the master. This guarantee is called fully consistent. If an
    update happens on the master server holding the key, all the replicas are guaranteed
    to be up to date. Not all key-value stores guarantee this status (Riak, for example),
    so if it''s important to be up to date to the millisecond, choose a database whose
    replicas are fully consistent (such as Aerospike).


    ![](img/2afea990c282e97644b1fafcb6223852_136_0.png)


    # Data modeling in key-value stores


    Many key-value stores support only basic structures for their value types, leaving
    the application programmer with the job of interpreting the data. Simple data
    type support typically includes strings, integers, and binary values.


    For many use cases, this works well, but sometimes a slightly more granular access
    to data is useful. Redis, for example, supports the following data value types:


    +   * String

    * List

    * Set

    * Sorted set

    * Hash maps

    * Bit arrays

    * Hyperlog logs


    Sorted sets can be queried for matching ranges of values — much like querying
    an index of values sorted by date, which is very useful for searching for a subset
    of typed data.'
