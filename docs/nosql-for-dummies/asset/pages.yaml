    # Handling Partitions


    The word partition is used for two different concepts in NoSQL land. A data partition
    is a mechanism for ensuring that data is evenly distributed across a cluster.
    On the other hand, a network partition occurs when two parts of the same database
    cluster cannot communicate. Here I talk network partitions.


    On large clustered systems, it''s increasingly likely that a failure of one piece
    of equipment will happen. If a network switch between servers in a cluster fails,
    a phenomenon referred to as (in computer jargon) split brain occurs. In this case,
    individual servers are still receiving requests, but they can''t communicate with
    each other. This scenario can lead to inconsistency of data or simply to reduced
    capacity in data storage, as the network partition with the least servers is removed
    from the cluster (or "voted off") in true Big Brother fashion.


    # Tolerating partitions


    You have two choices when a network partition happens:


    +   - Continue, at some level, to service read and write operations.

    - "Vote off" one part of the partition and decide to fix the data later when both
    parts can communicate. This usually involves the cluster voting a data replica
    as the new master for each missing partition node.


    Riak allows you to determine how many times data is replicated (three copies,
    by default — that is, n=3) and how many servers must be queried in order for a
    read to succeed. This means that, if the primary master of a key is on the wrong
    side of a network partition, read operations can still succeed if the other two
    servers are available (that is, r=2 read availability).'
