- img_proc: true
  md: '# Chapter 20: Triple Stores in the Enterprise 279


    You can map these properties onto their equivalent triple store functionality.
    Specialized indexes are used to ensure that the triple store-specific query functionality
    is fast. These databases then simply adopt the open standards of RDF and SPARQL
    to act as a triple store to the outside world.


    Also document NoSQL databases don''t support relationships among documents. By
    applying triple store technology to these databases, you can represent a document
    as a subject, either explicitly or implicitly, and use triples to describe them,
    their metadata, relationships, and origin.


    Some of these databases, such as OrientDB, are also capable of using triples to
    describe relationships within documents. As a result, you can request a merged
    document (say a book) that is created at query time from many related documents
    (chapters, images, and so on).


    This functionality is provided in two ways, depending on the approach you take
    with the triple store:


    +   - Use a document as a representation of a subject/vertex and a relationship/edge
    (ArangoDB).

    - Use a document as a container for many triples (OrientDB, MarkLogic Server).


    Neo4j and AllegGraph don''t provide this functionality, as it focuses solely on
    providing a graph store.


    You can find more information on this hybrid approach, including additional functionality,
    in Part VII of this book.


    # Describing documents


    Some of the databases mentioned in this part (Part V), such as OrientDB and ArangoDB,
    don''t support storage of metadata about documents outside of the documents themselves.


    By creating a subject type for a document, you can grant document metadata functionality
    into these databases. This subject type can hold the ID field of the document
    and have a predicate and object for every piece of metadata required.


    You can construct this extra metadata automatically using a custom API entry point
    in the database''s APIs, or perhaps by constructing specialized triggers that
    execute when the document is saved and extracted. Alternatively, you can add this
    metadata accordingly with additional API calls from your application.


    ![](img/2afea990c282e97644b1fafcb6223852_296_0.png)


    ![](img/2afea990c282e97644b1fafcb6223852_296_1.png)'
