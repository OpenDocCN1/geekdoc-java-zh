  md: '# Chapter 22: Triple Store Products 307


    Many of the enterprise features are available only in the paid-for-Neo4j Edition
    from Neo Technology, Inc. The enterprise edition is also provided under the AGPL
    license. however, this license requires you to pay for the enterprise edition
    or license your Neo4j-based application built on it an open-source license.


    Neo4j has a startup license that is discounted, too. A community edition is freely
    available for commercial applications, but it''s severely limited. No support
    is provided in the community edition for backups, highly available clustering,
    or systems management.


    It''s also worth noting that because Neo4j is designed for heavy graph traversal
    problems, all the data of the graph must be storable in each and every node in
    the cluster. This means you must invest in significant hardware for large graphs.
    Neo4j''s documentation recommends good-quality, fast SSDs for production.


    Neo4j 2.1 included a fix, available only in the enterprise edition, for good performance
    on systems with six or more processor cores. Any server you buy will have more
    cores, so this is worth noting. It''s also worth doing significant performance
    testing at a realistic scale going in to production with your application.


    Neo4j doesn''t support the open standards of RDF or SPARQL, because it is designed
    for graph problems rather than triple storage and querying, although it can also
    be used for those tasks, too.


    If you have a sophisticated set of hard graph traversal problems or need to embed
    a graph store in a Java-based application, then Neo4j may well be a very good
    choice, given its concentration on solving hard graph problems.'
