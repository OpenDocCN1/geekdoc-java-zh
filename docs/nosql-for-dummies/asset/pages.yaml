  md: '# 372 Part VII: Hybrid NoSQL Databases


    There are various RAID levels, with the most common being


    +   - RAID 0 is a single hard disk with no data duplicated, or an array of hard
    disks exposed as a single logical disk, but still without data duplication. This
    allows higher throughput than a single hard disk, but provides no additional durability
    guarantees.

    - RAID 1 is where each disk has an exact duplicate.

    - RAID 10 is where there is a RAID 1 array of two-thirds RAID 0 arrays. This provides
    higher throughput with one exact copy of each file.

    - RAID 5 and 6 are technologies that allow multiple disks to be joined and stored
    over two or three times, but without reducing the storage space available by one-half
    or two-thirds. You achieve this level of space savings by using bits rather than
    storing full copies of the data. This comes with the disadvantage of longer times
    to rebuild a new disk after failure.

    - RAID 50 and 60 are several RAID 0 arrays configured as a single RAID 5 or 6
    array. This provides higher throughput while ensuring greater data density.


    These configurations trade off storage space, storage times, access times, and
    disk rebuild on failure times. For high performance environments, RAID 10 is typically
    used. RAID 50 is often used for high-density environments. RAID 60 takes longer
    to rebuild and requires more disks, so it''s used less than RAID 50.


    When a failure of a single hard disk occurs, files are still accessible from the
    other disks in the array. If the system has a hot standby, the system can manage
    failover without requiring administrative help.


    # Ensuring data is accessible


    There are occasions when entire systems fail or entire clusters disappear on a
    network. Workmen and excavating machines are the biggest culprits of these types
    of failures! They dig up network cables or take out the power of the entire site.


    To solve this problem, you can distribute data to other nodes (servers) in the
    same cluster and to other sites. By using multiple nodes within a cluster and
    storing multiple copies of data, you''re ensuring that a cluster is highly available.'
  merge: -1
