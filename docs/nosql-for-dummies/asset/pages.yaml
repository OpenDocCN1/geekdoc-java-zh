  md: '# Chapter 12: Bigtable Products


    This uses a GUID or similar random string as the first part of the key to ensure
    that, during ingest, the data is distributed across a cluster. This key also uses
    a timestamp qualifier for the time the page was indexed.


    Whereas, in a Bigtable, you could use the column family and name fields, too:


    ```

    Key: AB28C4F2 Column Family: com.wiley.Name: /index.html

    ```


    This allows you to be more flexible when querying, you can easily pull back all
    pages for a domain or a specific page in the domain, which you can do quickly
    because a query is based only on the exact value of a key. This approach eliminates
    having to crawl all keys for lexicographic (partial) matches.


    Cassandra doesn''t support column names. Instead, you merge the preceding column
    family and page name or use two columns (the domain with a blank value). Cassandra
    does however, allow you to index keys across values. So, in the preceding example,
    you could set up an index over key, domain, and page name.


    I can ensure that entire domain content lookups are quick because the first key
    is the partition key in Cassandra, which keeps all data together for all pages
    in the same domain.


    # Inserting data fast


    Cassandra manages its own storage, rather than farm it off to HDFS like HBase.
    As a result Cassandra offers some advantages, with the first being that it can
    manage and throttle compactions. A compaction, also called a merge, occurs so
    often as Cassandra appends data to its database files and marks data for deletion.
    This deleted data builds up over time, requiring compaction. The benefit is higher
    ingest rates. Another advantage is that Cassandra doesn''t need to go over the
    network to access data storage.


    With Cassandra, you also have the advantage of using local SSDs, by writing the
    journal to an SSD and writing data to RAM and flushing it to a spinning disk.
    This, also, is the speed of ingestion.


    You can run Cassandra with both spinning disk HDDs and SSD disks for the same
    database. Perhaps some data is read more often and other data less often. Thisので
    accessed data may be columns on the same record. Storing these individual often-read
    columns on SSDs and the rest on a spinning disk boosts speed, without you having
    to replace every disk with an expensive SSD.'
