  md: '# # Chapter 29


    # # Common Hybrid NoSQL Features


    **In This Chapter**


    +   - Combining features in one product

    - Reducing cost

    - Saving space

    - Accelerating searches


    NoSQL databases are evolving. Much as relational databases added types over time
    — like character (text) long objects (CLOB), binary objects (BLOB), and XML data
    — NoSQL databases are adding support for new types of data.


    If you read other parts of this book, by now you probably understand that a business
    problem can be solved different ways in each of the databases (key-value, Bigtable,
    triple stores, and document databases) covered in this book. storing a document
    for a unique ID, for, is a feature of both key-value stores and document databases.


    Various databases can, therefore, technically be called hybrid in that they support
    multiple paradigms of data management. I restricted the list of hybrid databases
    in this chapter to that provide significant functionality in more than one area
    — note that support for a new data type doesn''t qualify as a hybrid database
    unless common management operations related to that type of area are also provided
    — column aggregate functions in Bigtable, for. Also, document databases aren''t
    automatically classified as key-value stores even though they can technically
    store values against a unique key. Likewise, not all databases that provide in-memory
    caching of property values are column stores.


    All said, my purpose is to be that neither I nor NoSQL vendors'' marketing departments
    create confusion and leave you thinking that all NoSQL databases can provide all
    features for all kinds of problems. Instead, if you really need a hybrid approach,
    I want to help you correctly identify and select the right NoSQL solution.'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# 362 Part VII: Hybrid NoSQL Databases


    # The Death of Polyglot Persistence


    In some cases, a single application has to communicate with a mainframe system,
    a relational database management system (RDBMS), and a NoSQL database management
    system (DBMS). However, as mention in Chapter 2, the idea that a single app needs
    multiple NoSQL database management systems is temporary because NoSQL databases
    are rapidly evolving. For example, OrientDB has a database that blends triple
    store and a document database. Why buy two products if one does the same job?


    When relational database management systems first became mainstream, they tended
    to offer different advantages. For instance, some had support for triggers, whereas
    others had cascade delete capabilities. Over time, such features became standard
    in all relational database management systems. The same will be true for NoSQL
    databases as new features are added by vendors to encourage customers to choose
    their database from among


    # One product, many features


    Customers may find that they prefer a single-product approach because one rich
    product makes training developers and administering the IT landscape easier than
    using multiple databases would.


    A single product also means that you don''t have to become a coding plumber. You
    don''t have to figure out how to join two different systems together. With a single
    product, vendors generally do these things themselves.


    In OrientDB, which I discuss later in this chapter, adding an order document with
    a link to a product (say a product_id=29 value) generates a triple that links
    the order to a product document in the system. Also, OrientDB blends this data
    when the order document is requested by the application.


    The makers of OrientDB provide this mechanism through the configuration of their
    server. I think you''ll agree that not having to write code that communicates
    with two systems — one managing the relationships (triple store) and the other
