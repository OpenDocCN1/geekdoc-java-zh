- img_proc: true
  md: '# 222 Part IV: Document Databases


    Some scientific publishers, with varying degrees of copyright options, allow you
    to buy access to the images used in their publications. Say that you want to create
    a slide strictly for 30 students. In that case, the licensing requirements won''t
    be as great as they would be if you were to write and plan to market a book that
    exists published material.


    This fine-grained access to content and the associated licensing for its use signifies
    where digital publishing is today.


    # Managing content lifecycle


    I used to work in the enterprise content management (ECM) and business process
    management (BPM) software industries. One inescapable realization was that process
    and content go in hand. As lifecycle — from creation, to modification, dissemination,
    and destruction — different business actions generally need to happen.


    When you fill in a bank account opening online, an account opening starts. This
    process uses information within that form document, and a sequence of well-known
    actions, to move the document and business process through a lifecycle.


    An account opening document could have the following steps in its lifecycle:


    +   1. **Validation**: Check the form for any semantic or business rule errors.
    For example, "Don’t cover business in a particular part of the UK, such as the
    Channel Islands."


    +   2. **Identity check**: Check the identity of the user against other systems
    (for example, check the official ID and credit reports).


    +   3. **Risk assessment**: If the credit report is poor or otherwise not acceptable,
    a decision is made to manually assess by the appropriate bank employee.


    If the credit was okay, the process moves to Step 4.


    +   4. **Process for opening account**: This is a holding period during which
    appropriate systems create the bank account.


    +   5. **Waiting for customer to activate card and account**: Communications are
    sent out during account opening, and then the account activation pauses until
    the customer activates their card.


    +   6. **Opening of account is complete**: The process is successful.'
