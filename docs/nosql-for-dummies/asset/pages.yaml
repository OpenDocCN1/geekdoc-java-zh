  md: '# Chapter 3: Evaluating NoSQL


    # Developing skills


    NoSQL is such a fast-growing area that the skills required to use it can''t keep
    up, and with many different systems, there aren''t any open standards equivalent
    to those for SQL in the relational database world.


    Therefore, it''s a good idea to find and employ or contract, at the right price,
    people who have expertise in the database you select. Also, be sure that you can
    find online or in-person training. In doing so, don''t accept outliers, people''s
    LinkedIn profiles in which experience with MongoDB listed — it''s listed only
    because it''s a very popular database and the person is looking for a job when
    in fact they haven''t any proven experience with that database. So, you want to
    be sure they''re actually skilled in the database you''re using.


    # Getting value quickly


    NoSQL databases make it easy to load data, and they can add immediate value. For
    example, if early on you solve a high-value business cases, you may get financial
    and management backing for larger projects. With this background, you will be
    able to deploy new applications — potentially stealing a march on your competitors
    and having fun with awesome new databases in the process!


    So, start identifying high-value solutions for a few difficult, well-scoped, business
    problems and perform some short-term projects on them. Use a selection of NoSQL
    databases during the project''s initial phases, and check vendor-specific extensions
    can help you achieve your aims. In NoSQL, vendor lock-in is a given every product
    is so different — you may well embrace the database that fits your needs.


    Having said, the situation is improving. XML and JSON are the facto information
    exchange formats now. In the semantic technology space standards like RDF and
    SPARQL are the predominant standards. Adopting these long term enables you to
    switch vendors, but at the moment the fragmented nature of implementation of some
    of these standards means you may well be off adopting database specific extensions.


    # Finding help


    With any software product, there comes a point where you need to ask for help.
    Finding answers on Stackoverflow.com is one thing, but in a real-life project,
    you may come upon a knotty problem that''s unique to your business.'
