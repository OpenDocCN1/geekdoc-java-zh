    # Cell-level security


    Traditional approaches to security require that an application''s code handles
    security, including authenticating users, discovering their roles, and ensuring
    that they access only the records they''re supposed to. This has been the case
    with relational database management systems for years. The same is true for Bigtable
    clones, too.


