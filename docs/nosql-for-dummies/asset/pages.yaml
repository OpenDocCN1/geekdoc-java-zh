  md: '# Chapter 21: Triple Store Use Cases


    # Building a Web of Facts


    You can create a triple store that answers questions by using other peoples''
    data instead of just yours. The Resource Description Framework (RDF) standard
    was created to allow this web of interconnected data to be built. This approach
    is generally referred to as the Semantic Web.


    There’s also a growing movement of open-data publishing. This movement has led
    governments, public sector organizations, research institutions, and some commercial
    organizations to open up their information and license it to be reused.


    Combining the concepts of open-data publishing and RDF and SPARQL allows you to
    create Linked Open Data data (LOD), which is published under one license that
    refers to other sources of linked open data on other websites.


    A news article from the BBC might mention a place that is linked to the GeoNames
    geographical dataset. It could also mention a person on DBpedia — the RDF version
    of Wikipedia.


    Over time, these links develop and are changed to produce a global Semantic Web
    of information. This is the culmination of Sir Tim Berners-Lee’s vision for a
    web of interconnected data that can be navigated by computers, just as the World
    Wide Web is navigated by humans using web browsers.


    # Taking advantage of open data


    You can find many great datasets, ranging from the U.S. Geological Survey (USGS)
    data about within the United States to information about Medicare spending per
    patient, or even names of newborns since 2007 in the United States.


    Not all open data is published according to RDF specifications; therefore, it’s
    not ready to be deployed immediately in a triple store. For example:


    +   Of the 108,606 datasets on the U.S. government’s open-data website (https://www.data.gov),
    only 143 are available in RDF, whereas 13,087 are available in XML, 6,149 are
    available in JSON, and 6,606 are available in CSV.


    +   At http://data.gov.uk (the UK’s equivalent to data.gov), of the 15,287 published
    datasets, 167 are available in RDF, 265 are available in XML, 3,186 are available
    in CSV, and 22 are available in JSON.


    ![](img/2afea990c282e97644b1fafcb6223852_304_0.png)'
