  md: '# Chapter 4: Common Features of Key-Value Stores


    # Replicating data


    Storing multiple copies of the same data in other servers, or even racks of servers,
    helps to ensure availability of data if one server fails. Server failure happens
    primarily in the same cluster.


    You can operate replicas in two ways:


    +   - Master-slave: All reads and writes happen to the master. Slaves take over
    and receive requests only if the master fails.


    Master-slave replication is typically used on ACID-compliant key-value stores.
    To enable consistency, the primary store is written and all replicas are updated
    before the transaction completes. This mechanism is called a two-phase commit
    and creates extra network and processing time on the replicas.


    +   - Master-master: Reads and writes happen on all nodes managing a key. There''s
    no concept of a "primary" partition owner.


    Master-master replicas are typically eventually consistent, with the cluster performing
    an automatic operation to determine the latest value for a key and removing older,
    stale values.


    In most key-value stores, this happens slowly — at read time. Riak has the exception
    here because it has an anti-entropy service checking for consistency during normal
    operations.


    # Versioning data


    To enable automatic conflict resolution, you need a mechanism to indicate the
    latest version of data. Eventually consistent key-value stores achieve conflict
    resolution in different ways.


    Riak uses a vector-clock mechanism to predict which copy is the most recent one.
    Other key-value stores use simple timestamps to indicate staleness. When conflicts
    cannot be resolved automatically, both copies of data are sent to the client.
    Conflicting data being sent to the client can occur in the following:


    +   - Client 1 writes to replica A ''Adam: (likes: Cheese)''


    +   - Replica A copies data to replica B.'
