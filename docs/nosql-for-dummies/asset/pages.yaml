    Neo Technologies has offices in the United States, Europe, and the Far East. In
    the United States it''s based in San Mateo, California. The company has European
    offices in Malmö in Sweden; in London in the UK; Munich and Dresden in Germany,
    and in France. It also has an office in Malaysia.


    Neo Technologies provides 24/7 premium support for enterprise customers. Services
    are also available for education and for help in the design, implementation, rollout,
    and production phases of a deployment project.


    # Finding skills


    As I indicated earlier, Neo4j is the dominant graph store in the NoSQL data-base.
    It is used extensively in both the open-source community edition as well as in
    production in large enterprises.


    Many computer scientists with an interest in graph theory are familiar with Neo4j,
    both in theory and practice. Therefore, you can find a broad range of developers.


    For existing organizations, the requirement to learn Cypher will be a barrier,
    although its similarity to the SQL of relational databases will help with this
    requirement. Third-party extensions are available to link Neo4j with more common
    open standards such as RDF, SPARQL, and OWL.'
