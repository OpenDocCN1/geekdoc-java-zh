    eight items separately that it would require eight reads, normalize the data —
    write the data to the same record at ingestion time — so that only one read is
    needed. This does mean some data will be stored multiple times. An example is
    storing customer name in an order document. Although this stores the customer
    name across many orders, it means when showing a summary of the order you'
