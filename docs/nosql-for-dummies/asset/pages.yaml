  md: '# Part I: Getting Started with NoSQL


    # Developing applications on NoSQL


    One of the most common conclusions about the emergence of NoSQL databases is that
    of polyglot persistence. Polyglot persistence means that, in order to write a
    single application, the application''s developer must use multiple types of databases,
    each for its most appropriate data type.


    I am a polyglot persistence skeptic because I think multiple databases are only
    required because hybrid NoSQL databases are in their infancy, I''m not convinced
    will last; however, people are practicing implementing polyglot persistence now,
    and no discussion of NoSQL''s relevance is complete without this topic. Moreover,
    this discussion may influence decisions you make about what software to purchase
    the next 5 to 25 years.


    Martin Fowler (no relation to me, honest!) writes in his book with Pramod Sadalage,
    NoSQL Distinguished over the era of polyglot persistence. In this book describes
    how he believes polyglot persistence will be a long-term need in enterprise systems.
    Whatever the truth turns out to be, you need to be aware of the current limitations
    to data handling in NoSQL databases.


    ![](img/2afea990c282e97644b1fafcb6223852_65_0.png)


    # Polyglot persistence


    The database world has gone through a steady evolution over the last 40 years.
    When relational databases first became popular, developers wondered if they would
    require mainframe systems and would require them to write applications using data
    from both types of systems, or replace them entirely.


    Of course, mainframes still run more financial transactions than relational databases.
    These mainframes are generally hidden under corporate systems, away from the prying
    eyes of application developers. Both RDBMS and mainframe systems are used in modern
    systems such as online banking. The mainframe systems manage bank account balances
    whereas the RDBMS manage online banking user preferences and application form
    filling data.


    Using both mainframe and RDBMS databases in the same application is what we term
    polyglot persistence.


    On the other hand, you rarely see four or five different databases for the same
    application. Even when used, they are typically hidden under a data access layer,
    so an application developer learns how to set up communication with, for example,
    two SOAP (Simple Object Access protocol) web services, not two different database
    systems.'
