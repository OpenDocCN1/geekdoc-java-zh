  md: '# Chapter 27: Types of Search Engines


    # Evaluating MarkLogic


    MarkLogic Server is an enterprise NoSQL database, providing functionality demanded
    by enterprise-grade mission-critical applications. MarkLogic Server favors consistency
    and durability of data and the operation of rich functionality on data more than
    it does through speed for adding new data, and querying that data.


    If you have sophisticated search requirements including full text, free schema,
    binary content, XML and JSON, real-time alerting, and support for text, semantic
    and geographic search across hundreds of terabytes of mission-critical data, I
    recommend that you check out MarkLogic Server.


    The downside to a database that also does search is that the front-end user interface
    is lacking in functionality when compared to legacy search platforms as HP Autonomy,
    IBM OmniFind, and Microsoft FAST.


    MarkLogic does an HTTP-based API supporting document operation and structure and
    free text grammar search, but you must develop the user interface yourself.


    MarkLogic includes an application builder web application that you can use to
    configure a basic search web application. In a convenient wizard driven interface,
    the application generated by this is very simple though, always requiring customization
    via code to create a final production-ready application.


    MarkLogic provides a range of open-source language bindings, including Java, JavaScript,
    C#, Ruby on Rails, C++, and PHP. This means you can plug MarkLogic Server into
    your application stack of search.


    MarkLogic serves lag behind other enterprise search platforms in that it doesn''t
    provide natural language processing (NLP) functionality — for example, splitting
    "Hotels in London" into a product type query of "hotel" and a geospatial query
    matching hotels near to the center of London.


    Although it''s a closed-source project, MarkLogic provides detailed documentation
    and free online training courses. Meetups are also available for MarkLogic in
    the United States, Europe, and Japan.


    MarkLogic Server is the only NoSQL database product mentioned in a variety of
    analyst reports, including those covering both data management and search, from
    a range of analyst firms.'
