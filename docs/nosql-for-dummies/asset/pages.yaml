    # Describing NoSQL


    If you studied databases in school, you may have been indoctrinated in a relational
    way of thinking. Say database to most people, and they think relational database
    management system. This is natural given the past 30 years, the RDBMS has been
    so dominant.


    Getting your head around NoSQL can be a bit hard, but this book was created to
    make it as easy as possible.


    To aid you on this journey, I want to introduce some key terms that are prevalent
    in the following chapters, as well as what they mean when applied to NoSQL databases.


    +   - Database construction


    +   - Database: A single logical unit, potential spread over multiple machines,
    into which data can be added and can be queried for its contents.


    The relational term tablespace could also be applied to a NoSQL database or collection.


    +   - Data farm: a term from RDBMS referring to a read-only replica sets stored
    across a managed cluster of machines.

    In an RDBMS, these typically can have machines added without down time. In NoSQL
    clusters, it is desirable to quickly scale out.


