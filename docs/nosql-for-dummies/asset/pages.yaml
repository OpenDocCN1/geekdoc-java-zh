  md: '# Chapter 3: Evaluating NoSQL


    # Visualizing NoSQL


    Storing and retrieving large amounts of data and doing so fast is great, and once
    you have your newly managed data in NoSQL, you can do great things, as I explain
    next.


    # Entity extraction and enrichment


    You can use database triggers, alert actions, and external systems to analyze
    source data. Perhaps it''s mostly free text but mentions known subjects. These
    triggers and alert actions could highlight the text as being a Person or Organization,
    effectively tagging the content itself, and document it within.


    A good example is the content in a news article. You can use a tool like Apache
    Stanbol or OpenCalais to identify key terms. These tools may "President Putin"
    and decide this relates to a person named Vladimir Putin, who is Russian, and
    is the current president of the Russian Federation.


    Other examples include disease and medication names, organizations, topics of
    conversation, products mentioned, and a comment that was positive or negative.


    These are all examples of entity extraction (which is the process of automatically
    extracting types of objects from their textual manuals). By identifying keys,
    you can tag them or wrap them in an XML element, which helps you to search content
    more effectively.


    Entity enrichment means adding information based on the original text in adding
    identity. In the Putin example, you can turn the text word "Putin" into <Person
    id="Vladimir-Putin">President Putin</Person>. Alternatively, you can turn "London"
    into <Place lon="-0.15" lat="52.5">London</Place>.


    You can show this data in a user interface highlighted text with a link to provide
    further information about each subject.


    You can provide enrichment using free-text search, alert searching, database triggers,
    and integrations to external software such as TEMIS Luxid and SmartLogic.


    # Search and alerting


    Once you store your information, you may want to search for it. Free-text search
    is straightforward, but after performing entity extraction, you have more options.
    You can specifically search for a person named "Orange" (as in William of Orange)
    rather than search records that mention the term orange — which, of course, is
    also a color and a fruit.'
