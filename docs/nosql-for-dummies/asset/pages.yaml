  md: '# Chapter 25: Search Engines in the Enterprise


    ![](img/2afea990c282e97644b1fafcb6223852_350_0.png)


    Some search engines support N-way co-occurrences, which is particularly useful
    for discovering patterns you didn''t know existed. Examples include products mentioned
    with other products or with medical conditions on Twitter.


    All of these calculations are performed at high speeds by accessing the search
    indexes. These can be calculated as one of the following:


    +   - Part of the search results (such as facets or heat maps)

    - A separate statistical operation over the same indexes (such as co-occurrence)


    A typical way to provide analytics over a dataset is to delegate the responsibility
    to a business intelligence tool such as Cognos, Business Objects, or Tableau.
    The problem with these tools is that they typically pull information from the
    data store and perform analytics over a stored copy of the data. This is called
    a data warehouse. The problem is that the information isn''t in real time; often
    it''s updated only once in 24 hours.


    If BI tools don''t pull a copy of the data, then performing a wide ranging analysis
    affects the performance of the underlying database or search engine, which has
    obvious implications for the cost of hardware and software licenses to provide
    analytical functionality. Business intelligence (BI) tools typically charge per
    user, making the cost prohibitive for end-user applications.


    Using the built-in analytical capabilities of the database or search engine may
    be a better solution. Rather than shift vast amounts of data to a BI tool, perform
    fast calculations over an in-memory copy of the search indexes.


    Doing so enables the support of many users for both search and analytical workloads.
    Many organizations in financial services and government are looking at NoSQL databases
    with search functionality to provide near-real time analytics for their data,
    without a complex, separate BI or data warehouse infrastructure.'
