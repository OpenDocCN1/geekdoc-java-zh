  md: '# Enterprise Data Searching


    Being able to bring together disparate types of data while providing a single
    search interface is the main challenge in enterprise searches.


    In this section, I discuss challenges around discovering and providing a consistent
    search interface over the variety of information stores present in a modern enterprise.


    # Storing web data


    Web data includes the text on web pages, images shown on those pages, and files
    linked for downloads on those pages. Being able to extract text from web-page
    markup while preserving paragraphs and concepts of a summary or title are features
    of web search indexers.


    Web data also requires metadata and text to be extracted from binary files. Where
    an image was taken, on what camera, and at what resolution are now common search
    criteria.


    Similarly, being able to extract text from PDFs and Word documents and metadata
    such as author and publisher is also useful for search applications.


    # Searching corporate data


    Most corporate data is still held on people''s laptops, network file shares, or
    increasingly in email or instant messages. Understanding the similarities and
    differences between these types of data is key to creating a user-friendly search
    experience.


    A good example is searching by people. Perhaps it''s an email address within an
    email, or a person''s full name in the author field of a document, or an employee
    in an instant message. Being able to identify all these different sources as the
    same person is a useful piece of functionality in an enterprise search engine.


    As I mention in Chapter 25, reconciling the different data source''s security
    models into a single search security model and enforcing auditing are essential
    to preventing unauthorized access to corporate data in a search engine.'
  merge: -1
  pgno: 355
