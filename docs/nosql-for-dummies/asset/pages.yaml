  md: '# Chapter 2: NoSQL Database Design and Terminology


    Triple stores, therefore, provide the flexibility in storing relationships that
    other NoSQL databases provide for the data itself — namely, schema agnosticism
    and the ability to store different data and relationships without schema definition
    up front.


    So, graph and triple stores hold the promise of providing the answer to cross-record
    joins currently lacking in other NoSQL databases. A particularly good, albeit
    not widely used, example is OrientDB.


    OrientDB allows you to define attribute whose value may relate to another document.
    This is similar to the primary/foreign key relationships from the relational database
    world. What OrientDB does, is to automatically the triples to describe this relationship
    when it recognizes the data in documents.


    Furthermore, OrientDB allows you to query this data and dynamically generate a
    merged document from the result of a set of relationships held in its triple store.
    It''s a very cool approach that other NoSQL vendors are sure to begin applying
    to their own databases.


    Semantic technology also holds the promise of providing more context around search.
    Rather than return documents that mention “Thatcher”, you may want to say “Job
    Role: Thatcher” or “Politician (subclass of Person): Thatcher. This provides disambiguation
    of search terms.


    Several products exist, including Temis, Smartlogic, and Open Calais, that use
    text analytics to extract entities (people, places, and so on) and generate semantic
    assertions so they can be stored in a triple store, linked to the source text
    it describes in the NoSQL database.


    # Public cloud


    Adopting NoSQL means you will have a database that naturally fits in a cloud environment.
    Many NoSQL database products can have nodes added and removed from a cluster dynamically
    with no down time, which means that during periods of peak usage, you can deploy
    the hardware dynamically using Amazon Web Services, for example, and also add
    extra database storage or query capacity on demand, too.'
