  md: '# Chapter 13


    # Cassandra and DataStax


    +   - Creating high-speed key access to data

    - Supporting Cassandra development


    Cassandra is the leading NoSQL Bigtable clone. Its popularity is based on its
    speed and SQL-like query language for relational database type people, and the
