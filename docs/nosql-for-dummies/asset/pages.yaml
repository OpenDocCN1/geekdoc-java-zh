  md: '# 42 Part I: Getting Started with NoSQL


    # Applying Consistency Methods


    The consistency property of a database means that once data is written to a database
    successfully, quertes that follow are able to access the data and get a consistent
    view of the data. In practice, this means that if you write a record to a database
    and then immediately request record, you''re guaranteed to see it. It''s particularly
    useful for things like Amazon orders and bank transfers.


    Consistency is a sliding scale, though, and a subject deep to cover here. However,
    in the NoSQL world, consistency generally falls into one of two camps:


    +   - ACID Consistency (ACID stands for Atomicity, Consistency, Isolation, Durability):
    ACID means that once data is written, you have full consistency in records.


    +   - Eventual Consistency (BASE): BASE means that once data is written, it will
    eventually appear for reading.


    A battle has been raging between people who believe strong consistency in a database
    is not required and who believe it absolutely is required (translate people to
    NoSQL companies'' marketing departments!).


    The reality is somewhere in between. Does it matter that a person''s Facebook
    post isn''t seen by all his friends for five minutes? No, probably not. Change
    "Facebook post" to "billion-dollar-financial transaction," though, and your attitude
    changes rapidly! Which consistency approach you picks the situation. In my experience,
    though, strong consistency is always the choice in mission-critical enterprise
    system situations.


    ![](img/2afea990c282e97644b1fafcb6223852_59_0.png)


    When you finish this book, one of the things I hope you take away is the difference
    between eventual consistency (BASE) and strong consistency (ACID), which I cover
    next.


    # ACID


    ACID is a general set of principles for transactional systems, not something linked
    purely to relational systems, or even just databases, so it''s well worth knowing
    about. ACID basically means, "This database has facilities to stop from corrupting
    or losing data," which isn''t a given for all databases. In fact, the vast majority
    of NoSQL databases do not provide ACID guarantees.'
