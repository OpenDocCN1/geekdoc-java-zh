  md: '# 120 Part II: Key-Value Stores


    # Operating on data


    Redis includes operations to increment and decrement key values directly, without
    having to do a read-modify-update (RMU) set of steps. within a single transaction
    to ensure that no other application changes the value during update. These data-type
    specific operations include adding and removing items to lists and sets, too.


    You can even provide autocomplete functionality on an application''s user interface
    by using the Redis ZRANGEBY command. This command retrieves a set of keys which
    partially matches a string. So, if you were to type "NoSQL for" in the search
    bar of an application built on Redis, you would see the suggestion "NoSQL For
    Dummies."


    # Evaluating Redis


    Redis prides itself on being a very lightweight and blazingly fast key-value store.
    It was originally designed to be an in-memory key-value store, but now boasts
    disk-based data storage.


    You can use Redis to safeguard data by enabling AOF (append only file) mode and
    instructing Redis to force data to disk on each query (known as forced fsync flushing).
    AOF does slow down writes, of course, but it provides a higher level of durability
    for data. Be aware, though, that''s still possible to lose up to one of commands.


    Also, Redis only recently added support for clustering. At the time of this writing,
    Redis''s clustering support is in the beta testing phase. Fortunately, Redis uses
    a shared-nothing cluster model, with masters for particular keys and slaves that
    are never directly written to by a client; only easier for Redis to implement
    reliable clustering than it is for databases that allow writes to all replicas.


    ![](img/2afea990c282e97644b1fafcb6223852_137_0.png)


    TIP If you want a very high-speed, in-memory caching layer in front of another
    database — MongoDB or Riak are commonly used with Redis — then evaluate Redis
    as an option. As support for clustering and data durability evolves, perhaps Redis
    can overtake other back-end databases.'
