  md: '# 112 Part II: Key-Value Stores


    # Delivering web advertisements


    Although advertisements are critical to companies marketing their wares or services
    on the web, they aren''t essential to many users'' web-browsing experiences. However,
    the loading time of web pages is important to them, and as soon as a slowly delivered
    ad starts adding to a page''s load time, users start moving to alternative, faster,
    websites.


    Serving advertisements fast is, therefore, a key concern. Doing isn''t a simple
    business, though. Which advertisement is shown to which user depends on a very
    number of factors, often determined by such factors as the user''s tracked activity
    online, language, and location.


    Companies that target their advertisements to the right customers receive more
    click-throughs, and thus more profit. However, the business of targeted advertisements
    is increasingly scientific.


    Key-value stores are used mainly by web advertisement companies. (You can find
    case studies about such usage on key-value NoSQL vendors'' websites.) Utilizing
    their proprietary software, these companies use a combination of factors to determine
    what a user wants or is interested in so that they can target advertisements to
    that user effectively. You can think of this combination of factors as being a
    key, and it''s this composite key points to the most compelling advertisement.
    Everything that is needed to serve the advertisement is kept as the value within
    a key-value store.


    If you need to serve data based on a set of known factors, then a key-value store
    is an excellent match. All you need to do is set up it effectively.


    To set up the key, perform some offline analysis of which advertisements will
    be relevant to each combined profile of people. If the information you have on
    the visiting user is country, language, and favorite category of purchases on
    Amazon, then perhaps an appropriate key would be UK-english-guitars.


    This prevents having to do any complex queries at serving time — just instead
    concatenate these fields together to a key and ask for the value of that key.


    # Handling user sessions


    You can spend all the money you want on a state-of-the-art datacenter for your
    transactional data, but if your website is slow, people will say that your entire
    service is slow. In fact, when companies and governments launch new online services
    that can''t handle the load placed on them, the press eats them for breakfast.'
