    using meta tags for metadata and the body for text content. You can integrate
    other solutions with other databases to allow automatic extraction of information
    on ingest.


    Many document databases support the concept of a URI as a primary key, or a unique
    document ID. Think of this path as a file system with an innate hierarchy. Some
    databases allow you to list the documents stored under a particular, partial URI.
    In this way, you can represent a file system in a document database. Some NoSQL
    databases consider the unique ID as external to the document (MarkLogic), whereas
    others (MongoDB and Microsoft DocumentDB) use a special id property within the
    document.'
