  md: '# Using an RDBMS to store sparse data


    Null values(as opposed to empty strings) in relational databases typically consume
    a couple of bytes, which is fine normally because the field isn''t filled — when
    filled would be more like a 20-byte string for, storing an uploaded picture. Two
    bytes is better than 20 bytes.


    In some situations, though these two bytes per blank field can be a significant
    amount of wasted space. Consider a contacts application that supports usernames
    and phone numbers for every type of network — cell, home, and office phone — and
    social networks like Twitter, Facebook, and Baidu, with a column for each of the
    hundreds of options and addresses. This means hundreds of bytes wasted per record.


    If you''re like me, each contact consumes a minimum of three fields (see Figure
    11-1). If you provide a contact management service, you may be storing 297 null
    fields for the 300 fields you support. Scale this to a global application, and
    you''re looking at terabytes of wasted space.


