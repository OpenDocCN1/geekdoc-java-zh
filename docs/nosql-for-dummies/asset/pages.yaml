    # Universal Indexing


    MarkLogic Server includes a universal index of all content. All text, XML, and
    JSON document content are indexed for their structure, the elements and attributes
    present, and their values. The universal index also includes full text indexing
    with many options for including indexes for specific cases, such as 2 (Ad*) and
    3 (Ada*) wildcards.


    This universal index is MarkLogic''s secret sauce. It''s allows you to load your
    content into the database without needing to tell MarkLogic how data is structured
    before loading it.


    You load the data "as-is," and the structure, value, and text queries can immediately
    be used to search and explore your data. Later on, you can add specific range
    indexes for your application needs.


    MarkLogic Server can store binary documents efficiently, but the universal index
    doesn''t automatically process them for text searching. To do that, you need to
    enable one or more of the Content Processing Framework''s (CPF) content filtering
    pipelines.


    CPF moves documents through defined states. It''s basically a finite-state automata.
    Various pipelines are available, including for converting Word documents to Docbook
    XML and for extracting text from PDF files.


    Over 200 binary file formats are supported for extracting text, ranging from office
    formats to photos (extracting metadata about the camera, for example), and to
    other formats.


    The universal index allows very fast resolution of query terms. Each word is stored
    in a reverse index. Instead of saying, "Look through all documents and list their
    words — now, which ones include ''Fred?'' you say, "Store all words in every document,
    and keep a list of document IDs for each word."


    This term list makes search engine lookups very fast. Say that you have a complex
