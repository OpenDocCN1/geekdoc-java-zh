    \ as the Unix Time Epoch), and a personalization setting for the type to use on\
    \ the website.\n\nAlso note that the type of username has two options — string\
    \ and null, which is how you instruct Oracle NoSQL that null values are allowed.\
    \ You could have left them as a string and provided an additional configuration\
    \ parameter of \"default=\"bluesky\".\n\nOther NoSQL databases provide secondary\
    \ indexes on any arbitrary property that have a JSON content. Riak, for example,\
    \ provides secondary indexes based on document partitioning — basically, a known\
