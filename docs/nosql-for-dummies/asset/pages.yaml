  md: '# Chapter 5: Key-Value Stores in the Enterprise


    Storing all the data you need for an operation against a single key means that
    if you need the data, you have to perform only one read of the database. Minimizing
    the number of reads you need to perform a specific task reduces the load on your
    database cluster and speeds up your application.


    If you need to retrieve data by its content, use an index bucket. Suppose you
    want to retrieve all orders dispatched from Warehouse 13. (Assuming, of course,
    you''re not worried about the supernatural content of the package!)


    Key-value stores aren''t known for their secondary index capabilities. It''s sometimes
    better to create your ''term list'' store for these lookups. Using the warehouse
    ID as a key and a list containing order IDs as the value allows you to quickly
    look up all orders for a given warehouse.


    # In-memory caching


    If you''re offering all website visitors the current top-ten songs to their sales,
    many of your queries will look the same. Moreover, choosing a database that has
    an in-memory value cache will improve repeated reading of the top-ten songs information.


    Aerospike is notable for giving you the ability to dynamically reprioritize its
    use of memory, depending on whether you have a high ingest load or a high query
    load. If your load varies during the day, you may want to consider using Aerospike.


    You can also use Redis or a similar key-value store as a secondary layer for caching.
    Redis is frequently used in conjunction with NoSQL databases that don''t provide
    their own high-speed reading.


    Having a cache in front of your primary database is generally good practice. If
    you suffer a distributed denial of service (DDoS) attack, the cache will be hit
    hard, the underlying database will carry on as normal.


    # Reducing Time to Value


    Time to value is the amount of time required from starting an IT project to being
    able to realize business benefit. This can be tangible benefits in cost reduction
    or the ability to transact new business, or intangible benefits providing better
    customer service or products.'
