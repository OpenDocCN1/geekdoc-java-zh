  md: '# 16 Part I: Getting Started with NoSQL


    NoSQL is a fundamentally different approach to related data, very much different
    from RDBMS. Hence, the term nonrelational is shorthand for Non-Relational Mathematics
    Theory.


    # Highly distributable and uses commodity hardware


    In many NoSQL databases, a key design decision is to use multiple computers to
    store data for a single database, rather than have the whole database on a single
    server.


    Storing data across multiple machines and allowing it to be queried is difficult.
    You must send the query to all the servers and wait for a reply. Hopefully, you
    set up the machines so that they''re fast enough to talk to each other to handle
    distributed queries!


    The main advantage of this approach is in the case of very large datasets, because
    for storage requirements, even the largest single server could not store or process
    all the data you need. Consider all the messages on Twitter and Facebook. You
    need a distributed mechanism to effectively manage all that data, even if it''s
    mostly what people had for breakfast and cut videos.


    An advantage of distributing your database is that you can use cheaper servers,
    called commodity servers, which are cheaper than single very powerful servers.
    (However, a decent one will still cost you $10,000!) For smaller datasets, it
    may be cheaper to buy three commodity servers instead of a single, higher-powered
    server.


    Another key advantage is adding high availability is easier; you''re already halfway
    by distributing your data. If you replicate your data once or twice across servers
    in the cluster, your data will be accessible, even if one of the servers crashes,
    burns, and dies.


    Not all open-source databases support high availability unless you buy the supported,
    paid-version of the database from the company that develops it.


    An exception to the highly distributable rule is that of graph databases. In order
    effectively answer certain graph queries in a timely fashion, data needs to be
    stored on a single server. No one has solved this particular issue.


    Carefully consider whether you need a triple store or a graph store. Triple stores
    are generally distributable, whereas graph stores aren''t. Which one you need
    depends on the queries you must support. You find more on Triple and Graph Stores
    in Chapter 2.


    ![](img/2afea990c282e97644b1fafcb6223852_33_0.png)'
