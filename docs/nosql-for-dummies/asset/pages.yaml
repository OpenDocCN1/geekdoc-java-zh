    In the enterprise, hybrid databases have the advantage of moving fewer parts than
    using multiple databases in the same application. This is because they comprise
    a single system rather than separate entities that require manual integration.


    There are still difficult problems to overcome, though. In this chapter, I identify
    the key issues to consider when looking at deploying a hybrid NoSQL database in
    the enterprise.


