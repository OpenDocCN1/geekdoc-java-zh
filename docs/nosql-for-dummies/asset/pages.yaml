  md: '# Part I: Getting Started with NoSQL


    # BASE


    BASE means that than make ACID guarantees, the database has a balance of consistency
    and data availability. This is typically the case when nodes in a given database
    cluster act as primary managers of a part of the database, and other nodes hold
    read-only replicas.


    To ensure that every client sees all updates (that is, they have a consistent
    view of the data), a write to the primary node holding the data needs to lock
    until all replicas are up to date. This is called a two-phase commit — the change
    is made locally but applied and confirmed to the client only when other nodes
    are updated.


    BASE relaxes consistency, requiring only a subset of nodes holding the same data
    to be updated for the transaction to succeed. Sometimes after the transaction
    is committed, the read-only replica is updated.


    The advantage of this approach is that transactions are committed faster. Having
    readable replicas also means you can spread your data read load, making quicker
    reading.


    The downside is that clients connecting to some of the read replicas may see out-of-date
    information for an unspecified period of time. In some scenarios, this state is
    fine. If you post a message on Facebook and some of your friends don''t see it
    for a couple of minutes, it s not a huge load. If you send a payment order to
    your bank, you may want an immediate transaction.


    ![](img/2afea990c282e97644b1fafcb6223852_61_0.png)


    An alternative to read-only replicas is to have a shared-nothing cluster in which
    only one node on a cluster always serves a particular part of the database.


    Shared-nothing doesn''t mean you lose replication, though. Databases that employ
    this method typically replicate their data to a secondary area or another primary
    node or nodes — but only one node is the master for reads and writes at any time.


    Shared-nothing clusters have the advantage of a simpler consistency model but
    require a two-phase commit. This means the transaction locks while all replicas
    are updated. (An internal lock locking for other nodes gives you two phases.)


    This typically has less impact than shared data clusters with read-only replicas,
    though, because shared-replica data areas do not receive read requests for that
    part of the database. Therefore, two-phase commits are faster on a shared-nothing
    cluster than on a cluster with readable replicas.'
