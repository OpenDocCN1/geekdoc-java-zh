- img_proc: true
  md: '# Chapter 21: Triple Store Use Cases 285


    All of these tools provide entity extraction (identify things) with entity enrichment
    (add extra information about those things). They also have the ability to generate
    an output report. This report can be in a list of semantic assertions (OpenCalais)
    in RDF or XML format. You can also place these facts in a separate RDF document,
    or you can tag text inline in the original document. All these tools generate
    XML and/or RDF output.


    You can then store this output in a document database or a triple store, or you
    can utilize a hybrid of the two. Doing so facilitates an accurate semantic search.
    It also allows the information from unstructured text to be combined with other
    semantic facts ingested elsewhere (for example, DBpedia, Wikipedia''s RDF version;
    or GeoNames, a public geospatial database in RDF).


    # Forward inferencing


    Inferencing is the ability to take a set of assertions and extrapolate them to
    other assertions. You can perform backward inferencing and forward inferencing.


    Here''s an example of backward inferencing: If Leo is the son of Adam, and Adam
    is the son of Cliff, you can reason that Leo is the grandson of Cliff. You can
    "prove" a new fact by referencing others in the database. That is, in order to
    infer the new triple, you use information available earlier in the text.


    Forward inferencing, on the other hand, is the process of inferring what happens
    in the future (or be true in the future), after analysing all existing information,
    all facts that can be inferred.


    Forward inferencing is typically done at ingestion time, which does lead to slower
    performance, but it also means that you do not have to do this work at query time.
    In this respect, forward inferencing is similar in effect to the denormalization
    approach of NoSQL databases.


    Forward inferencing allows you to build quite sophisticated webs of stored and
    inferred facts, which users can employ as helpful shortcuts. A good example is
    product recommendations — for instance, "You may like product x because you liked
    y, and others who liked y also liked product x."


    If you don''t create your inferencing rules carefully, you can end up in a situation
    where inferencing gets out of hand by creating billions of triples that may not,
    in fact, be accurate! This can lead to aborted triple ingestion, poor performance,
    or a significant waste of storage.


    ![](img/2afea990c282e97644b1fafcb6223852_302_0.png)'
