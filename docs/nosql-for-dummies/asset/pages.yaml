  md: '# Chapter 26: Search Engine Use Cases 339


    # Searching application data


    Many applications include their own search functionality. You can provide a single
    search interface for this information in one of two ways. You can


    +   - Consolidate the information, or an extract, in a central search engine.

    - Federate the query, effectively performing one query on each of a set of sources
    and consolidating and interpreting the results, showing one search result to the
    user.


    Because application versions and functionality change over time, setting up and
    maintaining a federated search engine is complex. For example, each application
    provides its own subset of search functionality that may or not map well onto
    a central search grammar. You often end up with the lowest common denominator
    of functionality when implementing search federation.


    A consolidated does cost more in storage, but it allows fine control over what
    is indexed and search functionality is exposed to end users. Also, you can consolidate
    multiple databases into a single data and search platform, which reduces cost
    when compared to the search federation approach.


    # Alerting


    Users don''t want to waste their time staring at a search interface and pressing
    the refresh button. Similarly, lengthy, complex business processes that pause
    waiting for new content to arrive can be hard to manage.


    With search alerts, a search can be saved and actions can be configured to perform
    useful functionality when new content matches the search criteria arrives.


    In this section, I discuss the various interesting ways that alerting can be used
    in order to support more proactive and responsive working practices.


    # Enabling proactive working


    Imagine a senior police investigator whose job requires surveillance of all drug-related
    activity in one area of a city. This investigator can''t be effective if he has
    to scan through reports and arrests every day. A better route for'
