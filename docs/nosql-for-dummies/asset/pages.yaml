  md: "# Part V: Graph and Triple Stores\n\nEvery graph store is a triple store because\
    \ both share the same concepts. However, not every triple store is a graph store\
    \ because of the queries that each can process.\n\nA triple store typically answers\
    \ queries for facts. Listing 19-1 shows a simple query (based on the graph in\
    \ Figure 19-2) to return all facts about the first ten subjects of type person.\n\
    \n# Listing 19-1: Simple SPARQL Query\n\n```\nSELECT ?s ?p ?o WHERE {\n  ?s rdf:type\
    \ :person\n  ?s ?p ?o\n} LIMIT 10\n```\n\nIn a more complex example, you may look\
    \ for subjects who are related to other subjects through several relationships\
    \ across the graph, as illustrated in Listing 19-2.\n\n# Listing 19-2: Complex\
    \ SPARQL Query\n\n```\nSELECT ?s WHERE {\n  ?s rdf:type :person\n  ?s :knows ?s2\n\
    \  ?s2 rdf:type :person\n  ?s2 :likes :cheese\n} LIMIT 10\n```\n\nIn 19-2, you're\
    \ not looking for a directly related subject but for one separated by a single\
    \ hop (that is, a query on an object related to another object) through another\
    \ vertex, or relationship, in the graph. In Listing 19-2, you're asking for a\
    \ list of the first ten people who know someone who likes cheese.\n\nThese SPARQL\
    \ queries share one thing in common: return a list of triples as the result of\
    \ the operation. They are queries for data itself, not queries about the state\
    \ of the relationships between subjects, the size of a graph, or the degree of\
    \ separation between subjects in a graph.\n\n# Graph queries\n\nA graph store\
    \ provides the ability to discover information about the relationships or a network\
    \ of relationships. Graph stores can respond to queries for data, too, and are\
    \ also concerned with the mathematical relationships between vertices."
