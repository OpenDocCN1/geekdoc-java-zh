  md: '# 148 Part III: Bigtable Clones


    # Managing Data


    Once data is written to a database, you need to be able to manage it efficiently
    and ensure that it''s always in a consistent, known state. You also need to be
    able to alter the storage structure over time as data needs to be rebalanced across
    a cluster.


    There are several techniques available to manage data within Bigtable clones,
    and I discuss them next.


    # Locking data


    Row locking means a record cannot have any field accessed while another process
    is accessing it. Row locking is an apt feature for a record that may be updated.
    Consider a situation where two clients are trying to update information at the
    same time. Without a row lock, one client could successfully write information
    that is immediately overwritten by the second process before the next read.


    In this situation, a read-modify-update (RMU) sequence is helpful. This process
    requires that the database lock an entire row for edits until the first editing
    process is complete. However, doing so is particularly tricky if you need to update
    or create a row but your application doesn''t yet know if that row already exists.
    Should you create or update a row? The good news is that databases like HBase
    allow locking on any row key, including those that don''t yet exist.


    # Using tablets


    A tablet server is a server within a Bigtable cluster that can manage one or more
    tablets. HBase calls these HRegionServers. You use these servers to store rows
    of data that belong to a particular subset of a tablet. These subsets are contiguous
    rows as judged by their row key values.


    A typical tablet server can store from 10 to 1,000 tablets. In turn, tablets hold
    a number of rows within a particular table. Tablets, therefore, hold a group of
    records (called rows in Bigtables) for a single table within a single database.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Chapter 9: Common Features of Bigtable


    A tablet is managed by a particular tablet server. If that server goes down, another
    tablet server is assigned to manage that tablet''s data. Thus, a tablet is the
    unit of persistence within Bigtable.


    Alternative names for this mechanism exist across different Bigtable clones. HBase,
    for example, supports multiple regions per region server and multiple stores per
    region.


    # Configuring replication


    Replication is an overloaded term in NoSQL land. It can mean one of several things:


    +   - Copying data between multiple servers in case of disk failure.

    - Ensuring that read replicas copies of the latest data.

    - Keeping a disaster recovery cluster up to date with the live primary cluster.


    This definition is the one that most people will recognize as replication. I call
    this disaster recovery (DR) replication to avoid confusion.


    All DR functionality works on the premise that you don''t want to block data updates
    on the primary site in order to keep the DR site up to date. So, DR is asynchronous.
    However, the changes are applied in order so that the database can replay the
    edit logs in the correct sequence. As result, it''s possible to lose some data
    if the primary site goes down before the DR site is updated.


    This state of affairs applies to all traditional relational DBMS replication.
    The advantage, on the other hand, is very fast in the primary cluster.


    Waiting for another server to confirm that it''s updated before the client is
    that the transaction is called a two-phase commit. It is considered two phases
    because the local commit and all configured remote commits must happen before
    the client is informed of a transaction''s success.


    Replication means that changes are sent from a primary site to a secondary site.
    You can configure replication to send changes to multiple secondary sites, too.


    Replication happens between tablets or regions, not at the database level. This
    means that updates happen quickly and that the load is spread across both the
    primary and secondary clusters.


    ![](img/2afea990c282e97644b1fafcb6223852_166_0.png)


    ![](img/2afea990c282e97644b1fafcb6223852_166_1.png)'
