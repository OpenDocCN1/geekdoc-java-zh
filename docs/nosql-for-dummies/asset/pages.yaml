  md: '# 168 Part III: Bigtable Clones


    Hypertable''s value indexes do support exact match, starts with, and regular expression
    matches. If you need this functionality regularly, Hypertable may be for you.


    Bigtable clones also don''t support relationships, preferring to store multiple
    copies of data to minimize read-time processing. This is a process called denormalization.
    Although, in some situations, this approach consumes more disk space, it enables
    very efficient reads with higher throughput than most relational databases can
    provide.


    # Analyzing Log Files


    Log files are very common across a range of systems and applications. Being able
    to record these files for later analysis is a valuable feature.


    Logfile recording and analysis is a very complex business. It''s not unusual for
    every system-to-system call in mission-critical Enterprise applications to include
    tracking code. This enables the app to check for errors, invalid values, and security
    breaches, as well as the duration of each action.


    This vast information is collected from hundreds of servers. It''s then analyzed
    in real time in order to ensure that a system''s tracking capabilities are up
    to date. In this way, problems are discovered before services to users are interrupted.


    # Analyzing data in-flight


    The traditional relational database approach to analyzing data is to store it
    during the day and at regular intervals (normally overnight) to create a different
    structure of that data in a warehouse for the next day.


    For your company''s current Enterprise software sales, daily data summaries may
    be enough. On the other hand, in countries with highly regulated financial services,
    this information needs to be less than five minutes old. There''s no point in
    having a view that''s 24 hours or out of date; you need summaries as soon as they''re
    available.


    Bigtable clones are great for collecting this information. They can have flexible
    columns, so if a particular log entry does not have data for a field, it simply
    can''t be stored. (See Figure 11-3 for an example of a log entry.) Bigtable clones
    also allow you to store data in multiple structures.'
