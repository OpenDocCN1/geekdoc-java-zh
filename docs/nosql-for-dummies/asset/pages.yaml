  md: '# Chapter 3: Evaluating NoSQL


    Conversely, there are several good reasons for buying and using commercial NoSQL
    databases instead:


    +   **Documentation:** Product documentation is usually much more complete and
    in-depth than open-source software.


    +   **Support:** These companies may offer global 24/7 support and will have trainers,
    consultants, and sales engineers that can travel to your office to show how their
    software can help you — good for getting support for internal proof of concept
    and business cases.


    +   **Rationale:** These companies make money by selling software, not consulting
    services — their day rates may be lower than those add-ons and support for open
    source databases, which can reduce the cost of implementation.


    +   **Products:** Products usually have many built-in enterprise features than
    open-source ones do, which means you need fewer add-on modules and services.


    +   **Freebies:** Because of the overwhelming number of open-source options, commercial
    companies now offer free or discounted training and free, downloadable versions
    of their products that you can use and evaluate.


    # # Building versus buying


    As I alluded to earlier, many open-source NoSQL vendors make their money by offering
    commercial support and services rather than by selling software.


    Open-source NoSQL products are also very new, so not all the features you may
    need are readily available in the software. As a result, you are likely to spend
    money on paying for services to add this functionality.


    Many organizations have internal technical teams, especially in financial services
    companies and in some defense and media organizations. Because financial services
    companies take any advantage they get to make a profit, so they hire capable staff.


    Your organization may also have a skilled staff. If so, "Congratulations," because
    you''re the exception rather than the rule! If you''re in this situation, you
    may be able to add the extra features yourself, rather than buy expensive services.


    However, most organizations aren''t in this position, so it''s worth checking
    out the “additional” features in commercial software, even if they don''t provide
    every single feature you want of the box, but allow you to build features faster.'
