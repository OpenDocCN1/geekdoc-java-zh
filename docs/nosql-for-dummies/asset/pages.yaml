    A single product offers a number of advantages. If you add them up, the following-cost-saving
    measures are huge. They can easily mean half the cost of implementing a new database:


    +   - Less indexing code between your application and its persistence layer

    - Less ETL code to convert data formats between products

    - Lower software license, maintenance, and consulting costs

    - Lower training costs for developers and administrators (and a single API to
    access all your data)

    - Lower salary costs because fewer experts for each system are needed

    - Fewer moving parts with backups and maintenance, such as patches and security
    updates


