  md: '# About the Authors


    Adam Fowler is a principal sales engineer at MarkLogic Corporation, an Enterprise
    NoSQL database company, located in the UK. He previously worked for small Web
    e-forms companies like edge IPK (now part of Tememos group) and for larger vendors
    in the enterprise content management (ECM) and business process management (BPM)
    spheres as IBM FileNet.


    Working for IBM FileNet, he coauthored an IBM Redbook on IBM FileNet P8 Platform
    and Architecture and wrote much about the content, use cases, and security information
    in the book.


    He is an enterprise Java software engineer by training and worked on content management
    and student management systems for several companies and universities in the UK.


    He is passionate about enterprise class software solutions that solve really difficult
    problems for customers. He works primarily in the public sector in both civilian
    and defense areas, but has previous experience in diverse areas, including media,
    retail banking, retail insurance, and reinsurance.


    In his spare time, he’s a cadet forces for Trent Wing Air Training Corps (ATC),
    where he instructs teenagers on drill, dress, discipline, and adventure training
    activities in the UK and abroad.


    Adam lives in Chesterfield, which is a borough of Derbyshire, United Kingdom,
    and works throughout the UK. He tries to spend as much time as possible with his
    wife, Wendy, and Leo, their young labradorradger, which is a cross with a Labrador
    retriever and an English springer spaniel.


    # Dedication


    To all lovers of using new technology to solve really hard problems.


    # Authors’ Acknowledgments


    First, I want to thank my wife, Wendy, for putting up with me over the past year
    as I retreated into the study to write (and, yes, agonize over) this book. Wendy,
    I would not have finished this book without your support.


    Also, my thanks to the many great people at MarkLogic who supported me in writing
    this book and to the other passionate people working for NoSQL companies who communicated
    with me via Twitter and email to provide timely input for the book.'
