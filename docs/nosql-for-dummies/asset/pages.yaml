  md: '240 Part IV: Document Databases


    # # Providing an End-to-End Document Platform


    Storing JSON and allowing it to be retrieved and queried with strong consistency
    guarantees is a great start. However, most enterprise data is stored in XML rather
    than JSON. XML is the *lingua franca* (default language) of systems integration.
    It forms the foundation of web services and acts as a self-describing document
    format.


    +   - In addition to XML, plain text documents, delimited files like comma separated
    values (CSV), and binary documents still need to be managed. If you want to store
    these formats, extract information from them, and store metadata against the result,
    then you need a more comprehensive end-to-end solution.

    - After managing the data, you may also need to provide very advanced full text
    and geospatial and semantic search capabilities. Perhaps you also want to return
    faceted and paginated search results with matching-snippets, just like a search
    engine.

    - Perhaps you want to go further, and take the indexes of all the documents and
    conduct co-occurrence analysis. This is where you look at two elements in the
    same document and calculate how often across all documents in a query two values
    occur together — say, the product and illness fields from some we. You may discover
    that Tylenol and flu occur together. Perhaps this will lead you to start an advertisement
    campaign for this combination.

    - This analytic capability is more than summing up or counting existing fields.
    It requires more mathematical analysis that needs to be done at high speed, preferably
    over in-memory, ordered range indexes.


    Say that you then want to describe how you extracted the information, from which
    sources, who uploaded it, and what software was used. You can then code this information
    in Resource Description Framework (RDF) triples, which I discuss in Part V of
    this book.


    You may want to take all this information, repurpose it, and publish summaries
    of it. This end-to-end complete lifecycle used to manage documents and the valuable
    information within requires many features. To do so in mission-critical systems
