  md: '# Chapter 22: Triple Store Products 297


    # # Combined search


    MarkLogic Server is unique in this book in that it provides a very feature-rich
    search engine and triple store built in to the same database engine as a single
    product.


    This enables you to do some interesting content searches in MarkLogic. Consider
    a situation like the preceding example where document has triples embedded within
    it.


    You can perform a query like “Find me all police reports that mention members
    of Doggy Company, Inc., that contain the word ‘fraud,’ that were reported at locations
    in New England, and were reported between March and July 2014.” New England isn''t
    a defined region, so it is provided as a geospatial polygon (an ordered list of
    points — like connect the dot drawings).


    This search contains several types of queries:


    +   - **Gepatial**: Denotes longitude and latitude places in the document within
    the specified polygon for New England.

    - **Range**: A date match must be matched.

    - **Word/Phrase**: The word “fraud” must be mentioned. This requires full text
    indexing and stemming support. (So “frauds” would also match.)

    - **Semantic**: You’re looking for documents that mention people who are members
    of Doggy Company, Inc.


    MarkLogic uses terms to provide the types of queries listed above. Each individual
    query returns a set of document IDs. These are intersected so that only documents
    match all of the terms are returned.


    ![](img/2afea990c282e97644b1fafcb6223852_314_0.png)


    I’ve assumed AND logic between terms, but there’s nothing stopping you from defining
    very complex tree-like criteria, with queries within queries, as well as NOT and
    OR logic.


    This checking of term lists is very quick because they’re cached in memory and
    store a list of matching document IDs for each indexed value. Supporting a variety
    of composable index queries allows semantic (SPARQL) queries to also be combined
    with all the preceding query types.'
  merge: -1
