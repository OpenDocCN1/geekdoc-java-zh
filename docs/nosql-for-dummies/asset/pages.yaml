    As an example, MarkLogic Server supports fully serializable ACID transactions
    and pre-commit triggers. Following is a simple XML document that I want to parse
    for attribute-based access control:


    ```

    <MeetingReport>

    <SalesPerson>Jblogs</SalesPerson>

    <Customer>ACME</Customer>

    <Notes>Lorem Ipsum Dollar Sit Amet...</Notes>

    </MeetingReport>

