    # Periodic indexing


    These connectors are typically pull-based. That is, they run on a timed interval
    for each data source. Therefore, they’re always outdated. This isn’t an issue
    for a lot of content, so as products that are rarely updated, other regarding
    their availability. For organization’s internal processes data, though, and certainly
    for financial services or feeds of live defense data, outdated content can lead
    to financial losses or, in the latter case, the risk of harm to personnel.


    In situations, you may want to push data onto a common data platform. A NoSQL
    database is ideal for this purpose, especially where a great variety of data is
    being stored.


    If a NoSQL database has a built-in search engine, you can update its indexes at
    the same time the data is updated.


    Many NoSQL databases embed a third-party search engine like Solr but don’t provide
    live updated indexes. If you need an absolutely live set of indexes, you need
    a NoSQL database that has a built-in search engine.


