  md: '# Chapter 23: Neo4j and Neo Technologies 311


    nodes with a limited number of relations in a query. This is how Neo4j stores
    all data on a single server. Setting up replicas is possible, but each replica
    contains a full copy of the data, rather subsets of the graph. This approach differs
    from triple stores, which share the data between each server in a cluster, using
    a sharing approach instead.


    Using a single node for all data provides good query speed for complex graph operations,
    which comes at a cost – because for very large graphs, you may need to use high-specification
    server hardware instead of multiple small and inexpensive commodity servers.


    The Neo4j documentation recommends, for instance, that each server use Solid State
    Disks (SSDs) as the primary storage mechanism. Given that SSDs provide less capacity
    than traditional mechanical spinning disks, you will need more space in your server
    for SSDs. You''ll probably want to create a virtual disk array (a RAID array)
    that you can spread the write load across all disks.


    The I/O of the servers must also be capable of fully utilizing the number of SSDs
    attached to it. This typically requires a dedicated I/O controller in the server.


    Requiring high-specification hardware in order to provide greater data storage
    and query speed is an example of vertical scaling. You basically buy an ever-bigger
    (taller) server to handle more load.


    Buying double the specification of a machine may cost three times as much, much,
    whereas buying two servers of the same specification costs only twice as much.
    For this reason, vertical scaling is more costly than the horizontal scaling of
    other NoSQL databases.


    If you absolutely need high-performance graph operations and are happy to pay
    for the privilege, then the tradeoff between cost and speed may be worth it.


    # Complying with open standards


    The dominant standards in the triple store and linked (open) data world are


    +   - Resource Description Framework (RDF) for the data model

    - Web Ontology Language (OWL) for defining an ontology

    - SPARQL Protocol and RDF Query Language (SPARQL) for query'
