  md: '# 256 Part IV: Document Databases


    # Ensuring a sustainable partner


    MongoDB, Inc., now has the funding required to improve its product and market
    to organizations worldwide. With offices all over the globe, you can find official
    support, specific to your needs when using MongoDB, including regular health checks,
    presales architecture and deployment advice, and expert consulting services, all
    for a significant price, of course. If you''re working on your first major project,
    this advice can be invaluable. For example, it can help you spot ways to apply
    best practices and avoid common pitfalls.


