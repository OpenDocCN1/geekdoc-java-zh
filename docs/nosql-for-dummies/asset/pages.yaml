  md: '# 160 Part III: Bigtable Clones


    It''s best to have a system that can cope with managing both high-speed writes
    and read caching natively and automatically. Hypertable is one such database that
    proactively caches data, watching how the system is used and changing memory priorities
    automatically.


    # # Indexing


    Like key-value stores, Bigtable clones are very good at keeping track of a large
    number of keys across many, if not hundreds, of database servers. Client drivers
    for these databases cache these range assignments in order to minimize the lag
    between finding where the key is stored and requesting its value from the table
    server.


    Rather than one-value stores, a Bigtable stores multiple values, each in a column,
    with columns grouped into column families. This arrangement makes Bigtable clones
    more like a traditional database, where the database manages stores.


    However, like key-value stores, don''t generally look up or use the data type
    of their values. No Bigtable database in this book supports — out of the box —
    data types for values, which Cassandra allows secondary indexes for values. However,
    these secondary indexes simply allow the column value to be used for comparison
    in a “where” clause; they don''t speed up query times like a traditional index.


    You can apply the same workaround indexing used in key-value stores to Bigtable.
    Figure 10-2 shows simple and compound indexes.


    The shown indexing method is limited, though, because you need to know what combination
    of fields is required in order to build an index table for each combination of
    query terms. The indexes are also consistent only if the Bigtable database supports
    transactions, real time updates of the indexes during a write operation.


    If the database doesn''t support automatic index updates within a transaction
    split second, the database will hold data but have no index for it. Databases
    with transactions can update both the data table and index table(s) in a single
    atomic transaction, ensuring consistency in your database indexes. This is especially
    critical if the server you''re writing to dies after writing the value, before
    writing the index — the row value may never be searchable! In this case, you must
    check for data inconsistencies manually on failover.'
