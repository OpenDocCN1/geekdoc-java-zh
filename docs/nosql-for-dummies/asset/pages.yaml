  md: '# Chapter 10: Bigtable in the Enterprise


    # Configuring dynamic clusters


    After parallelize your data as much as possible, you may discover that you need
    to add more servers to your cluster in order to handle the load. This requires
    rebalancing the data across a cluster in order to even out the query and ingest
    loads. This rebalancing is particularly important when you need to increase the
    size of your cluster to take on larger application loads.


    You can support cluster elasticity in Bigtable clones by adding more servers and
    instructing the master, or entire cluster for master-less Bigtable clones like
    Cassandra, to redistribute the tablets across all instances. This operation is
    similar to failover in most Bigtable implementations.


    The control of the HDFS area is moved to a new server, which may have to replay
    the journal (often called the write ahead log —WAL) if the changes haven''t been
    flushed to HDFS. On some databases, like HBase, this process can take ten minutes
    to finish.


    Once you''ve scaled out, you may decide you want to scale back, especially during
    peak periods of data ingestion, you added more servers only to receive more parallel
    information. This is common for systems where information is submitted by a particular
    well known deadline, like for government tax-return deadlines. Again, this requires
    redistribution of the tablets, reversing the preceding scale out process.


    Configuring and starting this process is in many cases a manual exercise. You
    can''t join a Bigtable to a cluster and have that cluster magically reassign tablets
    without issuing a command to the cluster. Some commercial enterprise versions,
    such as DataStax Enterprise, do automate this process.


    ![](img/2afea990c282e97644b1fafcb6223852_180_0.png)'
