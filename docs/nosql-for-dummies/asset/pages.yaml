  md: '# Chapter 13: Cassandra and DataStax


    This flexibility is great if you need a single Bigtable implementation that provides
    a range of consistency and availability guarantees for different applications.
    You can use the same technology for all of these applications, rather than having
    to resort to a different database for only a small number of use cases.


    Similarly, ten different read-consistency settings are available in the client
    API. These settings mirror the write levels, with the missing setting ANY, because
    ONE means the same thing as ANY for a read operation.


    # Analyzing data


    Cassandra provides a great foundation for high-speed analytics based on near-live
    data. This is how DataStax produced an entire analytics platform as an extension
    to Cassandra.


    DataStax''s analytics extension enables rapid analysis in several situations,
    including detection of fraud, monitoring of social media and communications services,
    and analysis of advertisement campaigns, running in real time to the data.


    Batch analytics is also supported by integrating Hadoop Map/Reduce with Cassandra.
    Cassandra uses its own file system. DataStax provides a CFS alternative to HDFS
    to work around the historic single points of failure in the Hadoop ecosystem.
    This file system is compatible with Hadoop, and is accessible directly by other
    Hadoop applications.


    CFS is a Java subclass of the HadoopFileSystem class, providing the same low-level
    interface, making it interchangeable with HDFS for Hadoop applications.


    # Searching data


    With Cassandra, you can create indexes for values, which are implemented as an
    internal table in Cassandra. In this way, you don''t have to maintain your manually
    created index tables.


    A default Cassandra index will not help you in several situations:


    +   * **Typed range queries or partial matches**: Indexes are only for exact matches.

    * **Unique Values**: Where each unique value is used more than once — results
    in a very large read scan of the index, hitting query performance'
