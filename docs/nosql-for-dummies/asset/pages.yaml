  md: '# Part IV: Document Databases


    # Document Databases as Key-Value Stores


    Document databases make great key-value stores. You can use a document URI path
    to represent a composite key like those in a key-value store. You can use document
    properties/elements, or metadata fields, to control how the database partitions
    data.


    Document databases also provide a deeper level of data management functionality.
    This comes at the cost of processing time, which is why key-value stores are used
    for some JSON document storage use cases — where fast age and retrieval is more
    important than advanced management functionality.


    # Modeling values as documents


    Values can be binary information stored as a document. In many uses of a key-value
    store, though values are JSON or XML structures. If you want to do advanced processing
    or indexing of values in a JSON or XML document, then a document database may
    be a better option.


    Document databases provide in-memory caches, with (MongoDB) even providing read-only
    replicas to allow greater parallel reads of the same data. If you have data that''s
    read often, then a document database may provide speedy access to documents that''s
    equivalent to key-value stores'' access.


    ![](img/2afea990c282e97644b1fafcb6223852_225_0.png)


    Automatic caching of parts of the database is particularly useful if all your
    data can''t fit in the memory of a key-value store, such as Redis.


    # Using value information


    Once the elements/attributes (XML) or properties (JSON) — which I call elements
    from now on distinguishing them from a document''s metadata are indexed, you can
    perform data queries and aggregation processes over them.


    Document databases like MarkLogic Server and Microsoft DocumentDB provide range
    queries for their typed indexes. This means that, rather than being limited to
    "element equals X," you can say "element is less than X" or "between X and Y inclusive."'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Chapter 14: Common Features of Document Databases


    Both MarkLogic Server and Microsoft DocumentDB provide user-defined functions
    (UDFs). These are server-side functions that take the set of documents matching
    a query and perform aggregations on them.


    These aggregations can be a mean average, a standard deviation, or any other scale
    output device. These operations are very fast, typically operating on the indexes
    rather than opening each document. This operation contrasts to the Hadoop or internal
    map/reduce mechanisms of other document databases and key-value stores, which
    must load the data from disk to perform calculations.


    You can also use these indexes for fast sorting and filtering operations on result
    sets. They are immensely useful and allow for more advanced functionality. MarkLogic
    Server, for example, use range indexes as the basis for 2D geospatial search.


    # Patching Documents


    In applications, rather than update and replace a whole document, you may want
    to change part of it, or a single value. A read, modify, update (RMU) operation
    on the entire content of a document is quite expensive in processing time, and
    in many NoSQL databases isn''t ACID — meaning another operation could update the
    document between your application''s read and update steps!


    # Supporting partial updates


    A partial update is where you are updating just one of two values in a document,
    rather than replacing the whole thing. Perhaps there is a field that holds the
    number of times a document has been read, or the current product quantity in a
    warehouse.


    Examples of partial updates may be as simple as replacing one element, which is
    similar to how to recall the following query:


    ```

    UPDATE Pages view_count = view_count + 1 WHERE id = "Page2"

    ```


    If the record is modeled as a document, then a similar patch operation in MarkLogic
    Server might look like this:


    ```

    <rapi:patch xmlns:rapi="http://marklogic.com/rest-api">

    <rapi:replace select="/view_count" apply="ml.ad"></rapi:replace>

    </rapi:patch>

    ```'
