  md: '# Chapter 20


    # Triple Stores in the Enterprise


    +   In This Chapter

    - Taking care of your data

    - Managing facts about data alongside source data itself


    As with any other type of database system, there are best practices for organizing
    and setting up triple stores to ensure consistent and reliable service. There
    is a difference, though, triple stores and graph stores. That is, two different
    architectural approaches are taken in the design of triple stores and graph stores.
    These two approaches are due to different types of queries — graph wide analysis
    functions and listing records (subjects), and their properties that match some
    criteria. These differences lead to tradeoffs related to ensuring data durability,
    supporting high availability of associated services, and providing for disaster
    recovery.


    In this chapter, I discuss the issues around maintaining a consistent view of
    data across both triple stores and graph stores. I also talk about a common enterprise
    use case of using a triple store to store facts about and relationships between
    data that is managed in other systems.


    # Ensuring Data Integrity


    Most enterprises expect a database to preserve their data and protect it from
    corruption during normal operations. This can be achieved through server side
    features, or settings in a client driver. Whatever the approach, the ultimate
    aim is to store multiple copies of the latest data, ensuring that even if one
    copy is lost the data stays safe and accessible.'
  merge: -1
