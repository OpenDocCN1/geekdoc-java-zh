    # Substituting a key-value store


    Bigtable clones can be thought of as a specific subclass of key-value stores.
    You can quite run key-value workloads on a Bigtable clone, too. If you already
    have a Bigtable, you may well want to consider doing so.


    If you need blazing fast writes — in the order of 100,000 writes per second or
    more — then a key-value store performs more quickly. In most situations, you probably
    need have lighter loads, and if this is the case then Bigtable features may be
    for you. Cassandra prides itself on having features of both Bigtable and key-value
    stores, and takes its inspiration from Amazon''s Dynamo and Google''s Bigtable
    pagers. Figure 12-4 shows the differences between the two models.


    In a key-value store, you have to design your key in order to ensure evenly distributed
    data in a cluster and that lookups are fast. Bigtables have these key hierarchies
    built in with its concept of column families and column names.


    Consider that you''re using a key-value store to hold data pulled from a website
    for search indexing. You may want to store and retrieve data by the website domain,
    URL, and the timestamp you stored it.


    In a key-value store, you can design a key like this:


    ```

    AB28C4F2-com.wiley.com/~/index.html

    ```


    Figure 12-4: Key-value store


    | Traditional key-value store using a Bigtable as a key-value store. | Key | Timestamp
    | Value |

    |---|---|---|---|n| Bigtable clone | Row Key | Column Name | Timestamp | Value
