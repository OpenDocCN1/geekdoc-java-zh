  md: '# Chapter 16


    # # Document Database Use Cases


    **In This Chapter**


    +   - Distributing electronic articles

    - Controlling unstructured data feeds

    - Modifying data structures

    - Joining data streams


    Documents are all around us. From shopping orders to patient notes to books like
    this one. A world of infinite possibilities exists with documents.


    Knowing which use cases can be handled by a document NoSQL database is an increasing
    challenge. Unlike other types of NoSQL databases in this book, document database
    providers are continually adding new features that enable you to turn plain data
    storage into more functional information.


    The use cases I describe in this chapter are industry- and solution-agnostic,
    which makes sense because there are so many ways to apply document databases.
    Take each example as a suggested "recipe" and apply it to your particular data-management
    needs.


    # # Publishing Content


    The sale of online books is a big industry. People download whole books to read
    offline at their leisure or as references in their jobs, for example.


    It''s a little different with other kinds of digital publications, though. You
    can access articles in scientific journals, for example, by subscribing to the
    journal itself, by purchasing a single issue, or by downloading a single article.'
  merge: -1
