  md: '# Chapter 16: Document Database Use Cases 223


    The same process applies to publishing:


    +   1. A concept for a book is submitted to a publisher for approval.

    2. If the proposal is approved, the author generates a table of contents.

    3. The author, if new, goes through initial training.

    4. The book is written, produced in a variety of formats, and published to digital
    and print vendors.


    While these processes are happening, it''s helpful to use the document lifecycle
