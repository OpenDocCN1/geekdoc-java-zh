  md: '# 162 Part III: Bigtable Clones


    Using an additional search engine tier takes up much more storage (field values
    are stored twice) and may not be transactionally consistent if it''s updated outside
    of a database transaction. Cassandra, which ensures consistent Solr index updates,
    is the notable exception in the DataStax Enterprise version.


    Solr is a useful option for full-text indexing of JSON documents stored as values.
    But if you''re storing documents, it''s better to consider a document store.


    ![](img/2afea990c282e97644b1fafcb6223852_179_0.png)


    # Aggregating data


    In transactional database systems, individual rows are created and updated whereas
    in analytical systems, they''re queried in batches and have calculations applied
    over them.


    If you need to provide high-speed analytics for large amounts of data, then you
    need a different approach. Ideally, you want the ability to run aggregations close
    to the data itself, rather than send tons of information over the network to the
    client application to process.


    All Bigtable clones in this book support HDFS and Hadoop Map/Reduce for batch
    processing. Accumulo is prominent because it includes a native extension mechanism
    that, in practice, may prove more efficient for batch processing than Hadoop Map/Reduce.


    Accumulo iterators are plug-in extensions that you can write yourself and implement
    a variety of low-level query functionality. You can use them:


    +   - Shard data across tablet servers.

    - Sort data (for storing the most recent data first).

    - Filter data (used for attribute-based access control).

    - Aggregate data (sum, mean average, and so on).


    HBase coprocessors introduced recently in HBase 0.92 also allow similar functionality
    as Accumulo. They offer also eventually allow HBase to have similar security (visibility
    iterator) functionality as Accumulo.'
