  md: '# 46 Part I: Getting Started with NoSQL


    Eric Brewer has a lot to answer for! He came up with the CAP conjecture in 2000.
    It was later proved in 2002, and so is now a theorem. The CAP theorem in computer
    science is fundamental to how many NoSQL databases manage data.


    CAP stands for Consistency, Availability, and Partitioning, which are aspects
    of data management in databases. Here are some questions to consider when considering
    BASE and thus CAP approach:


    +   - Consistency: Is the database fully (ACID) consistent, or eventually consistent,
    or without any consistency guarantees?

    - Availability: During a partition, is data still available (that is, can a partitioned
    node still respond to requests)?

    - Partitioning: If some parts of the same database cluster communicating with
    each other, can the database still function separately and correct itself when
    communication is restored?


    The CAP theorem states that you cannot have features of all three at the same
    time. Most of the time, this is claimed to mean that you can only have two of
    the three. The reality is that it is a sliding scale. You may be able to trade
    off a little of one for more of another.


    A traditional RDBMS typically provides strong consistency. Some clustered RDBMS
    also provide good availability, but they don''t provide partitioning.


    Availability in the CAP theorem is a different concept from high availability
    used to describe services. In CAP, I''m talking about data availability.


    Also, remember that the definition of consistency in ACID isn''t the same definition
    as in CAP:


    +   - In ACID, it means that the database is always in a consistent state.

    - In CAP, it means that a single copy of the data has been updated.


    Therefore, in CAP, a system can be consistent.


    On the other hand, some NoSQL products, such as Cassandra, are partition tolerant.
    Each part of the database continues to operate if one is not communicating with
    the rest of the nodes. This typically occurs because of networking outages rather
    than outright system failure.


    When you allow part of a database to be updated when partitioned, you''re saying
    that the other part of the database cannot see this update. Consequently, allowing
    partitioning means you always lose some consistency.'
