  md: '# 342 Part VI: Search Engines


    lightweight library aimed purely at indexing text within fields and providing
    search functionality over those indexes.


    In this section, I discuss the challenges around text indexing, and software typically
    used to solve those challenges.


    # Using Lucene


    Lucene performs text indexing and search; it''s not an end-to-end search engine.
    This means its developers concentrated on building a very flexible indexing mechanism
    that supports multiple fields in an indexed document.


    Lucene does not include web crawlers, binary text, or advanced search functionality
    such as faceting. It''s purely for full-text indexing and search, which it does
    very well.


    Lucene''s key innovation is that it is an embeddable library that allows you to
    index a wide range of source data for full-text searches. It powers many engines
    and websites in its own right, being embedded into these products.


    # Distributing Lucene


    Lucene is not a distributed search server environment. Instead, you present Lucene
    with text to be indexed in fields of a document, and it allows searches to run
    against the indexes. This flexibility makes it appropriate for a wide range of
    uses.


    To provide indexing for terabytes of data, you need to select an open-source search
    engine that uses a library like Lucene for its full-indexing, and fortunately,
    there are several to choose from. The most popular ones are Apache Solr and Elasticsearch.


    These search engines approach clustering and distributed querying the same way
    NoSQL databases I talk about elsewhere in this book do. Instead of being databases,
    though, products like Solr and Elasticsearch hold document extracts and indexes
    and distribute those pieces of data.'
