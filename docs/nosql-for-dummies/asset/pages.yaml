  md: '# 144 Part III: Bigtable Clones


    Such a large store of information places unique problems on your database server
    infrastructure and applications:


    +   - Effectively splitting data among several servers to ensure even ingestion
    (adding of data) and query load

    - Handling failure of individual servers in your cluster

    - Ensuring fast data retrieval in your application without traditional RDBMS query
    joins


    This section looks at these issues in detail.


    # Partitioning your database


    Each table in a Bigtable is divided into ordered sets of contiguous rows, which
    are handled by different servers within the cluster. In order to distribute data
    across all servers, you need to pick a row key strategy that ensures good spread
    of query load.


    A good example of doing this is to use a random number as the start of your partition
    key. As each table server (a single server in a Bigtable cluster) will hold a
    specific range of keys, using a randomized start to a partition key ensures even
    data distribution across servers.


    A bad example of doing this can be found in a financial transaction database or
    log file management database. Using the timestamp as a row key that means new
    rows are added to the last table in the cluster — on a single machine. This means
    one server becomes the bottleneck for writes of new data.


    Also, it''s possible most of your client applications query recent data more than
    historical data. If this is the case, the same server will become a bottleneck
    for reads because it holds the most up-to-date data.


    Use some other mechanism to ensure that data is distributed evenly across servers
    for both reads and writes. A good random number mechanism is to use Universally
    Unique Identifiers (UUIDs). Many programming languages come with a UUID class
    to assist with this. Using a Java application with HBase, for example, means you
    have access to the Java UUID class to create unique IDs for your rows.


    ![](img/2afea990c282e97644b1fafcb6223852_161_0.png)'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Chapter 9: Common Features of Bigtable


    # Clustering


    NoSQL databases are well suited to very large datasets. Bigtable clones like HBase
    are no exception. You''ll likely want to use inexpensive commodity servers in
    a single cluster rather than one very powerful machine. This is because you can
    get overall better performance per dollar by using many commodity servers, rather
    than a vastly more costly single, powerful server.


    In addition to being able to scale up quickly, inexpensive commodity servers can
    also make your database service more resilient and thus help avoid hardware failures.
    This is because you have other servers to take over the service if a single server''s
    motherboard fails. This is not the case with a single large server.


    Figure 9-1 shows a highly available HBase configuration with an example of data
    split among servers.


    The diagram in Figure 9-1 shows two nodes (HRegionServers, which I talk about
    in the upcoming section “Using tablets”) in a highly available setup, each acting
    as a backup for the other.


    Figure 9-1: Highly available HBase setup.


    ![](img/2afea990c282e97644b1fafcb6223852_162_0.png)'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# 146 Part III: Bigtable Clones


    In many production setups, you may want at least three nodes for high availability
    to ensure two server failures close in time to one another can be handled. This
    isn''t as rare as you''d think! Advice varies per Bigtable; for example, HBase
    recommends five nodes as a minimum for a cluster:


    +   - Each region manages its own set of keys.

    Designing a row key-allocation strategy is important because it dictates how the
    load is spread across the cluster.

    - Each region maintains its own write log and in-memory store.

    In HBase, all data is written to an in-memory store, and later this store is flushed
    to disk. On disk, these stores are called stored files.

    HBase interprets store files as single files, but in reality, they''re distributed
    in chunks across a Hadoop Distributed File System (HDFS). This provides for high
    ingest and retrieval speed because all I/O operations are spread across many machines.


    To maximize data availability, by default, Hadoop maintains three copies of each
    data file. Large installations have


    +   - A primary copy

    - A replica within the same rack

    - Another replica in a different rack


    Prior to Hadoop 2.0, Namenodes could not be made highly available. These maintained
    a list of all active servers in the cluster. They were, therefore, a single point
    of failure. Since Hadoop 2.0, this limit no longer exists.


    # Denormalizing


    Rows in a particular table consist of several column families. Each column family
    can contain many columns. What Bigtables cannot do is store values as a list in
    the same column for a row, which means that you must choose to either


    +   - Store a list within the value (and serialize and load it yourself in).

    - Use a composite value for the column name, such as email|work and email|home.


    Rather than normalize your data by having multiple tables that require joining
    to get a picture of a person, you may want to use a single record with multiple
    values copied (coalesced) to a single record. This capability is


    ![](img/2afea990c282e97644b1fafcb6223852_163_0.png)'
