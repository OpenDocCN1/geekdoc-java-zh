    # Adding metadata to relationships


    Unlike the RDF data model and SPARQL query standard, Neo4j enables you to add
    properties to relationships, rather than just nodes. This is especially important
    when you need to hold information about the relationship itself. A good example
    is in-car route planning where you store each town as a node. The towns near it
    are stored as nodes, too, with a "next to" relationship between them. The distance
    between each town is stored as a property of the relationship.


