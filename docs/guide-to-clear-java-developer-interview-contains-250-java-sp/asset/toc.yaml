  - 接口隔离原则 (ISP)：该原则规定，类不应该被强制实现它未使用的接口。换句话说，我们应该将过大或过于通用的接口拆分为更小、更具体的接口。例如，与其拥有所有支付方式的单一
    `Payment` 接口，我们可以拥有如 `CreditCardPayment`、`PayPalPayment` 等独立的接口。
- - '##'
  - 依赖倒置原则 (DIP)：该原则规定高层模块不应该依赖低层模块。相反，两者都应该依赖于抽象。这意味着我们应该依赖抽象，而不是具体的实现。例如，与其在类中依赖特定的数据库实现，我们应该依赖于数据库接口，该接口可以由不同的数据库来实现。这使得测试、维护和扩展更加容易。
