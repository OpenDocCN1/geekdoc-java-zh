  md: '**Hash Table:** HashMap uses an array of buckets called a hash table to store
    key-value pairs. The size of this array plays a crucial role in performance.

    **Nodes:** Each key-value pair is stored in a "Node" object. This node contains
    the key, value, hashcode of the key, and a reference to the next node (for collision
    resolution).

    **Hash Function:** This function converts the key into an integer within the hash
    table range. A good hash function minimizes collisions, where multiple keys map
    to the same index.


    **Collision Resolution Strategy:** When collisions occur, HashMap employs a strategy
    to store additional nodes at the same index. Common strategies include chaining
    (using linked lists) and open addressing (probing for empty slots).


    # **Steps involved in operations:**


    put(key, value):


    +   - Calculate the hashcode of the key.

    - Use the hash function to find the corresponding index in the hash table.

    - If no nodes exist at that index, add a new node with the key-value pair.

    - If a collision occurs:


    +   - Chaining: Add the new node to the linked list at the index.

    - Open addressing: Probe for an empty slot using a specific strategy.


    get(key):


    +   - Calculate the hashcode of the key.

    - Use the hash function to find the corresponding index in the hash table.

    - Traverse the linked list (if chaining) or probe for the matching key (open addressing).'
