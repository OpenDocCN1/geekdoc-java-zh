    # What is the lifecycle of thread in java?


    The life cycle of a thread in Java includes several states:


    +   New: The thread is in the new state when it is first created using the new
    Thread() constructor, but before the start() method is called.


    +   Runnable: The thread is in the runnable state when the start() method is called.
    It''s now eligible to run and can be scheduled by the JVM to execute.


    +   Running: The thread is in the running state when it is currently executing.


    +   Blocked: The thread is in the blocked state when it is waiting for a resource,
    such as a lock or a semaphore.


    +   Waiting: The thread is in the waiting state when it is waiting for another
    thread to perform a specific action.


    +   Timed Waiting: The thread is in the timed waiting state when it is waiting
    for a specific period of time.


    +   Terminated: The thread is in the terminated state when it has completed execution
    or when it has been interrupted by another thread.


