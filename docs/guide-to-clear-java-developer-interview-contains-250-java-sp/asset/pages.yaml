    # Which Microservice design pattern have you used so far and why?


    Service Registry: A Service Registry is a centralized directory that microservices
    can use to locate each other''s endpoints. It helps with service discovery, load
    balancing, and failover, and makes it easier to manage a distributed system. Examples
    of service registries include Consul and Eureka.


    Circuit Breaker: A Circuit Breaker is a pattern that can help to prevent cascading
