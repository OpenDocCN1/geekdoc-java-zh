  md: '# CHAPTER 10: REST


    What are the HTTP methods in REST?


    REST (Representational State Transfer) is an architectural style for building
    web services, and it supports the following HTTP methods:


    **GET**: Used to retrieve a resource or a collection of resources. The GET method
    should be used for read-only operations and should not have any side-effects.


    **POST**: Used to create a new resource. The POST method can be used to submit
    data to the server, such as form data or JSON payloads.


    **PUT**: Used to update an existing resource. The PUT method can be used to submit
    data to the server, and it should completely replace the resource if it exists.


    **PATCH**: Used to partially update an existing resource. The PATCH method can
    be used to submit a set of changes to the server, and it should only modify the
    specified attributes of the resource.


    **DELETE**: Used to delete a resource. The DELETE method should delete the resource
    if it exists and should have no additional side-effects.


    These methods correspond to the CRUD (Create, Read, Update, Delete) operations
    that can be performed on resources in a RESTful service. The appropriate method
    should be used depending on the type of operation being performed. Additionally,
    some RESTful services may support additional methods, such as HEAD and OPTIONS,
    for performing specific operations.'
  merge: -1
  pgno: 265
