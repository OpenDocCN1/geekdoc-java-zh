  md: 'have identified the source of the leak, you can then take steps to fix the
    problem.


    It''s worth noting that, Profilers can be quite complex, it''s advisable to have
    some familiarity with Java Memory Model, Garbage Collection and JVM internals
    to effectively use them.


    # What is out of memory error?


    An "Out of Memory" error in Java occurs when the application requests more memory
    from the JVM than available. This can happen for a number of reasons, such as:


    The application is using more memory is available on the system: The JVM has a
    maximum limit on the amount of memory it can use, which is determined by the -Xmx
    command option. If the application is using more memory than this limit, an Out
    of Memory error will occur.


    Memory leaks: If an application holds onto objects that are no longer needed,
    it can cause the JVM to run out of memory. This is known as a memory leak.


    Insufficient heap size: The heap is the area of memory where the JVM stores objects.
    If the heap size is not large enough, the JVM may not be able to allocate enough
    memory for the application''s needs, resulting in an Out of Memory error.


    High usage of non-heap memory: The JVM also uses non-heap memory for things like
    class metadata, JIT compilation data and native resources. If the non-heap memory
    usage is high, it can cause Out of Memory error.


    To fix an Out of Memory error, you will need to identify the cause of the problem
    and take steps to address it. This may include increasing the amount of memory
    available to the JVM, fixing memory leaks, or optimizing the application''s memory
    usage.


    It''s worth noting that, Out of Memory errors can be challenging to debug, it''s
    advisable to use a profiler and analyse the heap dump or thread dump to understand
    the root cause of the error.'
