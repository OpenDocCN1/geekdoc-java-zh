    # What are fast and fail-safe in collection framework?


    In the collection framework, fast and fail-safe refer to two different types of
    iterators.


    Fast iterators are designed to throw a ConcurrentModificationException if the
    collection is modified while the iterator is in use. This is because fast iterators
    keep track of the current position in the collection using a modification count.
    If the collection is modified, the modification count is incremented. When the
    iterator checks the modification count, it will throw an exception if it changed,
    indicating that the collection has been modified since the iterator was created.


    Fail-safe iterators are designed to not throw an exception if the collection is
    modified while the iterator is in use. This is because fail-safe iterators operate
    on a copy of the collection, not the original collection. When the iterator is
    created, it takes a snapshot of the collection. This snapshot is used to iterate
    over the collection. If the collection is modified while the iterator is in use,
