    # What are SOLID principles, with example?


    SOLID is an acronym that represents five principles of object-oriented design
    to make software more maintainable, flexible, and easy to understand. Here are
    the explanations of the five SOLID principles, along with examples:


    **Single Responsibility Principle (SRP)**: This principle states that a class
    should have only one reason to change. In other words, a class should have only
    one responsibility or job. For example, if we have a class named User, it should
    be responsible for handling user-related functionalities such as authentication,
    user data management. It should not be responsible for other unrelated functionalities
    like sending emails or managing payment transactions.


    **Open/Closed Principle (OCP)**: This principle states that a class should be
    open for extension but closed for modification. This means that we should be able
    to add new functionalities or behaviors to a class without changing its existing
    code. For example, instead of modifying an existing Payment class to add support
    for a new payment method, we can create a new PaymentMethod class that implements
    a Payment interface and inject it into the Payment class.


    **Liskov Substitution Principle (LSP)**: This principle states that derived classes
    should be able to replace their base classes without affecting the correctness
    of the program. In other words, if we have a base class Animal and a derived class
    Dog, we should be able to use the Dog class wherever we use the Animal class.
    For example, if we have a method that takes an Animal parameter and performs'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'some action, we should be able to pass a Dog object to that method without
    any issues.


    # **Interface Segregation Principle (ISP):** This principle states that a class
    should not be forced to implement interfaces it does not use. In other words,
    we should separate interfaces that are too large or general into smaller and more
    specific interfaces. For example, instead of having a single Payment interface
    that includes all payment methods, we can have separate interfaces like CreditCardPayment,
    PayPalPayment, etc.


    # **Dependency Inversion Principle (DIP):** This principle states that high-level
    modules should not depend on low-level modules. Instead, both should depend on
    abstractions. This means that we should rely on abstractions, rather than concrete
    implementations. For example, instead of depending on a specific database implementation
    in a class, we should depend on a database interface, which can be implemented
    by different databases. This allows for easier testing, maintenance, and scalability.


    # What is Cohesion and Coupling?


    **Cohesion** refers to the degree to which the elements within a module or component
    work together to achieve a single, well-defined purpose. High cohesion means that
    the elements within a module are strongly related and work together towards a
    common goal, while low cohesion means that the elements are loosely related and
    may not have a clear purpose.


    **Coupling**, on the other hand, refers to the degree of interdependence between
    modules or components. High coupling means that a change in one module or component
    will likely affect other modules or components, while low coupling means that
    changes in one module or component will have minimal impact on other modules or
    components.


    In general, software design principles strive for high cohesion and low coupling,
    as this leads to code that is more modular, maintainable, and easier to understand
    and change.'
