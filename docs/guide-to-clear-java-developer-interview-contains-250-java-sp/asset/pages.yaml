  md: '# What are the idempotent methods in REST?


    In REST (Representational State Transfer), idempotent methods are HTTP methods
    that can be safely called multiple times without changing the result beyond the
    initial application of the method. The following HTTP methods are considered idempotent:


    ```

    GET

    PUT

    DELETE

    ```


    These methods can be called multiple times without any side effects and should
    always return the same result.

    On other hand, non-idempotent methods, such as POST, can have side effects and
    should be called only once.


    # What are the standards to follow to build a rest service?


    REST (Representational State Transfer) is a popular architectural style for building
    web services. To build a RESTful service that adheres to best practices, there
    are several standards and guidelines that can be followed, including:


    Use HTTP Verbs: RESTful services should use HTTP verbs such as GET, POST, PUT,
    and DELETE to perform operations on resources.


    URI Design: RESTful URIs should be designed to identify resources and their relationships.
    They should be self-descriptive and hierarchical, with nouns being used as resource
    names and verbs being used as resource actions.


    Use HTTP Status Codes: RESTful services should use appropriate HTTP status codes
    to indicate the result of an operation, such as 200 OK for success, 404 Not Found
    for a missing resource, and 500 Internal Server Error for a server-side error.


    Use HATEOAS: RESTful services should use HATEOAS (Hypermedia as the Engine of
    Application State) to allow clients to discover and interact with resources. HATEOAS
    uses links in the response to provide information about available actions and
    resources.'
