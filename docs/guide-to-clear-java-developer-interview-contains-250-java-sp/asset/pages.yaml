    # # What are Composition and Aggregation with examples?


    **Composition** and aggregation are two types of object-oriented programming concepts
    that describe the relationship between objects.


    Composition is a strong type of association where an object is made up of one
    or more objects of other classes. For example, a car is composed of various parts
    such as wheels, engine, transmission, etc. The car has an object of the wheel
    class, engine class, and transmission class as its member variables.


    **Aggregation** is a weak type of association where an object contains a reference
    to one or more objects of other classes. For example, a university class has a
    collection of student classes as its member variable. The student class has an
    object of the university class as its member variable.


