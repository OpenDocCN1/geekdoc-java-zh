    A typical scenario for a deadlock involves two or more threads acquiring locks
    on multiple resources in different orders. For example, Thread A may acquire a
    lock on Resource X, while Thread B acquires a lock on Resource Y. If Thread A
    attempts to acquire a lock on Resource Y while Thread B attempts to acquire a
    lock on Resource X, both threads will be blocked, waiting for the other thread
    to release the lock. This situation is known as a deadlock.


    Deadlocks can be difficult to detect and diagnose, as they typically do not result
    in any error messages or exceptions. They can lead to significant performance
    degradation or even complete program failure if not properly handled.


    To prevent deadlocks, it''s important to follow best practices for concurrent
    programming, such as avoiding nested locks, acquiring locks in a consistent order,
    and using timeouts on locks to avoid indefinite blocking. Additionally, tools
    such as deadlock detection algorithms and thread profiling tools can be used to
    identify and diagnose deadlocks in a program.


