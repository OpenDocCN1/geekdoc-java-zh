    # What are bean scopes? What are prototype and request bean scopes?


    In Spring Framework, a bean scope defines the lifecycle and the visibility of
    a bean within the Spring IoC container. Spring Framework provides several built-in
    bean scopes, each with a specific purpose and behaviour.


    The following are the most commonly used bean scopes in Spring Framework:


    +   **singleton**: This is the default scope for a bean. A singleton bean is created
    only once per Spring IoC container and is shared by all the clients that request
    it.


    +   **prototype**: A prototype bean is created every time it is requested by a
    client. This scope is useful for beans that are stateful, and the state should
    not be shared between clients.


    +   **request**: A request-scoped bean is created for each HTTP request and is
    only available to the beans that are involved in handling that request.


    +   **session**: A session-scoped bean is created for each HTTP session and is
    only available to the beans that are involved in handling that session.


    +   **application**: An application-scoped bean is created for the entire lifetime
    of the web application, and is available to all beans throughout the application.'
