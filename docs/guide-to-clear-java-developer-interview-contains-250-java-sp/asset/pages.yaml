    # Proxy Design pattern:


    The Proxy design pattern is a structural pattern that provides a surrogate or
    placeholder for another object to control access to it. The Proxy pattern allows
    you to create a representative object that can act as an intermediary between
    a client and the real object. The proxy object can perform additional functionality
    such as security checks, caching, or remote communication.


    The Proxy pattern involves the following components:


    Subject: This is the interface that both the Real Subject and the Proxy implement.
    It defines the common interface for the Real Subject and the Proxy so that the
    client can work with both objects interchangeably.


    Real Subject: This is the object that the client wants to access. It implements
    the Subject interface and provides the real implementation of the operations.'
