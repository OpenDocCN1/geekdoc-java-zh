    # What is the Difference between @Component ,@Service ,@Repository and @Controller
    annotations?


    In Spring Framework, the @Component, @Service, @Repository, and @Controller annotations
    are all used to mark classes as Spring beans, but they are typically used for
    different types of classes.


    +   @Component: This is a general-purpose annotation that can be used to mark
    any class as a Spring bean. It is typically used for classes that do not fit into
    any of the other categories, such as utility classes or classes that perform generic
    tasks.


    +   @Service: This annotation is used to mark classes that provide business services,
    such as service classes that perform business logic and interact with repositories
    to retrieve and persist data.


    +   @Repository: This annotation is used to mark classes that provide data access
    and storage services, such as classes that interact with databases, file systems,
    or other data sources.


    +   @Controller: This annotation is used to mark classes that handle incoming
    HTTP requests, such as classes that define REST controllers or MVC controllers
    in a web application.'
