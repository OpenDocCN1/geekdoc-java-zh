    How do you define the point cuts?


    AOP (Aspect-Oriented Programming) is a programming paradigm that aims to increase
    modularity by allowing the separation of cross-cutting concerns. AOP allows you
    to define reusable modules of code that can be "woven" into the main program logic
    at runtime.


    AOP is built on top of the traditional Object-Oriented Programming (OOP) model
    and allows you to define and apply additional behavior to objects and classes
    in a non-invasive way.


    AOP is based on the following concepts:


    +   Aspect: An aspect is a module of code that encapsulates a cross-cutting concern,
    such as logging, security, or transaction management.


    +   Join point: A join point is a point in the execution of a program, such as
    the execution of a method or the handling of an exception.


    +   Advice: An advice is the action taken by an aspect at a specific join point.
    There are several types of advice, as before, after, and around advice.


    +   Pointcut: A pointcut is a predicate that identifies the join points where
    advice should be applied.


    +   Weaving: Weaving is the process of applying aspects to the program, which
    is typically done at runtime.


    AOP provides a way to modularize cross-cutting concerns, it allows to separate
    the core business logic of an application from the aspects that provide additional
    functionality such as logging, security, and transaction management. This results
    in a more'
