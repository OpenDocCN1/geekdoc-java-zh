    used to execute multiple tasks concurrently. When a task is submitted to the thread
    pool, it is added to a queue and a worker thread from the pool is assigned to
    execute the task.


    The life cycle of a thread in a thread pool includes the following states:


    +   Idle: The thread is in the idle state when it is first created and waiting
    for a task to be assigned.


    +   Running: The thread is in the running state when it is executing a task.


    +   Completed: The thread is in the completed state when it has finished executing
    a task and is returned to the idle state.'
