    # How does HashMap behaves when it reaches its maximum capacity?


    When a HashMap reaches its maximum capacity, it will automatically resize itself
    to accommodate more key-value pairs. This process is called rehashing.


    During rehashing, a new internal array is created with twice the capacity of the
    original array. Each key-value pair from the old array is then hashed again and
    added to the new array at a new index, based on the new array size and the hash
    code of the key.


    Rehashing is necessary to maintain the performance of the HashMap. As the number
    of key-value pairs in the map grows, the likelihood of hash collisions increases,
    which can slow down the performance of the map. By resizing the map when it reaches
    its maximum capacity, the likelihood of collisions is reduced, and the map can
    continue to perform efficiently.


    However, rehashing can be an expensive operation, as it involves iterating through
    all the key-value pairs in the map and recalculating their hash codes. To minimize
    the number of rehashing operations, it''s important to choose an appropriate initial
    capacity and load factor for the HashMap based on the expected number of key-value
    pairs that it will hold.


