  md: '# What is the difference between Inheritance and Composition?


    Inheritance allows a class (called a subclass) to inherit properties and behaviors
    from another class (called a superclass). The subclass can then add or modify
    these properties and behaviors as needed. It''s useful for creating hierarchies
    of related classes and sharing code and functionality.


    For example, if we have an Animal class, a Mammal class, and a Cat class, the
    Cat can inherit properties and behaviors from both Animal and Mammal classes while
    adding its own specific methods.


    Benefits:


    +   - Promotes code reuse by sharing common functionalities among related classes.

    - Provides code organization by structuring classes in a hierarchy.

    - Enables specialization by adding specific features to subclasses.


    Composition allows a class to be composed of other objects. This means that a
    class has properties and use them to delegate tasks or behaviors. It''s useful
    for creating complex objects from simpler ones and enabling dynamic composition
    at runtime.


    For instance, a Car can be composed of objects such as an Engine, Wheels, Seats,
    etc. The Car class can then utilize these objects to perform various tasks.


    Benefits:


    +   - Loose coupling between classes – changes in one class usually don''t affect
    the other.

    - Greater flexibility – allows using functionalities from any class, not just
    parent-child hierarchy.

    - Promotes modularity and code clarity.


    | Feature | Inheritance | Composition |'
