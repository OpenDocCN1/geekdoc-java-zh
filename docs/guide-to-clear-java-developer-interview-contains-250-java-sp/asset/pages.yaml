    # ### What are fail-safe and fail-fast iterators?


    Fail-safe iterators do not throw ConcurrentModificationException if the underlying
    collection is modified while iterating over it. They create a snapshot of the
    collection at the time of iteration, so changes made while iterating do not affect
    the iteration.


    Fail-fast iterators, on the other hand, throw a ConcurrentModificationException
    if the underlying collection is modified while iterating over it. They check for
    modifications at every iteration, if a change is made, the exception is thrown
    immediately.


