  md: '# Java-14 Features


    # 1."Switch Expressions" (SE) instead of "Switch Statements" (SS):


    # Enhanced Switch Expressions:


    Switch expressions, introduced as a preview feature in Java 12 and finalized in
    Java 13, allowing developers to use switch statements as expressions, providing
    a more concise and expressive syntax.


    ```

    int dayOfWeek = 2;

    ```


    ```

    String dayType = switch (dayOfWeek) {

    case 1, 2, 3, 4, 5 -> "Weekday";

    case 6, 7 -> "Weekend";

    default -> throw new IllegalArgumentException("Invalid day of the week: " + dayOfWeek);

    };

    ```


    # "Yield" Statement:


    The "yield" statement was introduced in Java 14 to complement switch expressions.
    It allows you to specify a value to be returned from a switch arm, providing more
    flexibility in combining both imperative and functional styles.


    ```

    String dayType = switch (dayOfWeek) {

    case 1, 2, 3, 4, 5 -> {

    System.out.println("Working day");

    yield "Weekday";

    }

    case 6, 7 -> {

    System.out.println("Weekend");

    yield "Weekend";

    };

    ```'
