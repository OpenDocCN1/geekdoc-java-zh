  md: '# How does Oauth2.0 works?


    OAuth 2.0 is an authorization framework that lets users grant applications access
    to their data on other websites or services, without sharing their password with
    the application. It acts as a secure middlemen between you, the application you
    want to use, and the website or service that holds your data. Here''s how it works
    in nutshell:


    +   1. You want to use an application: Let''s say you want to connect your Facebook
    account to a new fitness app.


    +   2. Application redirects you: The fitness app directs you to the Facebook
    login page.


    +   3. You log in to Facebook: You enter your Facebook username and password.


    +   4. Facebook prompts authorization: Facebook asks you if you want to grant
    the fitness app access to your profile information and activities.


    +   5. You grant or deny access: You review the requested permissions and choose
    to grant or deny the app access.


    +   6. Facebook sends token to app: If you grant access, Facebook sends the fitness
    app an access token, which is like a temporary key that allows the app to access
    your data on Facebook.


    +   7. Application uses token: The fitness app uses the access token to read your
    Facebook data, such as your profile information and activities, and integrate
    it into your fitness experience.'
