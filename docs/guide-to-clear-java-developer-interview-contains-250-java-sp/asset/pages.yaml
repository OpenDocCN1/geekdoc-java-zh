    The lifecycle of a bean is the set of events that occur from its creation until
    its destruction.


    The Spring bean lifecycle can be divided into three phases: instantiation, configuration,
    and destruction.


    +   - **Instantiation**: In this phase, Spring IoC container creates the instance
    of the bean. Spring Framework supports several ways of instantiating a bean, such
    as through a constructor, a static factory method, or an instance factory method.

    - **Configuration**: In this phase, Spring IoC container configures the newly
    created bean. This includes performing dependency injection, applying any bean
    post-processors, and registering any initialization and destruction call-backs.

    - **Destruction**: In this phase, Spring IoC container destroys the bean instance.
    It is the last phase of the Spring bean lifecycle.


    In addition to these three phases, Spring Framework also provides several callbacks
    that allow developers to specify custom initialization and destruction logic for
    a bean. These callbacks include:


    +   - `@PostConstruct`: Invoked after the bean has been constructed and all dependencies
    have been injected

    - `init-method`: Specifies a method to be called after the bean has been constructed
    and all dependencies have been injected

    - `destroy-method`: Specifies a method to be called just before the bean is destroyed.

    - `@PreDestroy`: Invoked before the bean is destroyed.'
