  md: '# How to resolve this Mockito exception “Mockito cannot mock this class”?


    "Mockito cannot mock this class" exception can occur when trying to mock a class
    that Mockito cannot create a for. Mockito can only mock classes that are non-final
    and have a visible constructor.


    Here are a few reasons why you might be getting this exception:


    The class is final: Mockito cannot create mocks of final classes. You can either
    remove the "final" modifier from the class, or use a different mocking library
    that supports mocking final classes, such as PowerMock or JMock.


    The class or constructor is private: Mockito needs to be able to create an instance
    of the class using a visible constructor. If the constructor is private, you can
    use the PowerMock library to mock the constructor.


    The class is a primitive or a final class from the java.lang package: Mockito
    cannot mock primitives or final classes from the java.lang package, such as String
    or Integer. You can use a real instance of these classes or a test double like
    a spy instead of mock.


    The class is loaded by a different class loader: If the class is loaded by a different
    class loader than the test class, Mockito may not be able to create a mock of
    the class. You can try adding the class to the test classpath or use a different
    mocking library that supports mocking classes by different class loaders.


    The class is an interface: If the class is an interface, you should use the Mockito.mock()
    method instead of Mockito.mock(class).


    In general, if you are getting the "Mockito cannot mock this class" exception,
    it is a sign that you may need to refactor your code or your test in order to
    make it more testable. You may also want to consider using a different mocking
    library that supports mocking the specific class or scenario you are working with.'
