    # What is the difference between @Controller and @RestController annotation?


    The @Controller and @RestController annotations are both used in Spring to handle
    incoming HTTP requests. However, they have differences in their behavior and use
    cases.


    The @Controller annotation is used to indicate that a class defines a Spring MVC
    controller. This means that the class is responsible for handling HTTP requests
    and returning responses. Typically, a @Controller class will have methods annotated
    with @RequestMapping (or similar annotations), which define the URL paths and
    HTTP methods that the controller should handle. The methods in a @Controller class
    often return a view name or a ModelAndView object, which is then rendered by a
    resolver to generate the final response HTML.


    On the other hand, the @RestController annotation is a specialized version of
    @Controller. It combines @Controller and @ResponseBody annotations, which means
    that all methods in a @RestController class return a response body directly to
    the client. This response body is usually formatted as JSON or XML, and it can
    be a simple object, a collection, or any other serializable data. @RestController
    is typically used to build RESTful web services that expose data APIs.


