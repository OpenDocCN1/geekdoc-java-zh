  md: '# CHAPTER 8: MICROSERVICE


    What is Microservice?


    **Microservice, aka Microservice Architecture**, is an architectural style that
    structures an application as a collection of small autonomous services, modelled
    around a business domain.


    In Microservice architecture, each service is self-contained and implements a
    single business capability.


    Features of Microservice


    **Decoupling** - Services within a system are largely decoupled, so as a whole
    can be easily built, altered, and scaled.


    **Componentization** - Microservice are treated as independent components that
    can be easily replaced and upgraded.


    **Business Capabilities** - Microservice are very simple and focus on a single
    capability.


    **Autonomy** - Developers and teams can work independently of each other, thus
    increasing speed.


    **Continuous Delivery** - Allows frequent releases of software through systematic
    automation of software creation, testing, and approval.


    **Responsibility** - Microservice do not focus on applications as projects. Instead,
    they treat applications as products for which they are responsible.


    **Decentralized Governance** - The focus is on using the right tool for the right
    job. That means there is no standardized pattern or any technology pattern. Developers
    have the freedom to choose the best useful tools to solve their problems.


    **Agility** - Microservice support agile development. Any new feature can be quickly
    developed and discarded again.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# What is the advantage of Microservice over monolithic architecture?


    Challenges of monolithic architecture


    **Inflexible** - Monolithic applications cannot be built using different technologies.


    **Unreliable** - If even one feature of the system does not work, then the entire
    system does not work.


    **Unscalable** - Applications cannot be scaled easily each time the application
    needs to be updated, the complete system has to be rebuilt.


    **Blocks Continuous Development** - Many features of an application cannot be
    built and deployed at the same time.


    **Slow Development** - Development in monolithic applications takes a lot of time
    to be built since each and every feature has to be built one after the other.


    Not Fit for Complex Applications - Features of complex applications have tightly
    coupled dependencies.


    # What is the disadvantage of Microservice architecture


    **Complexity**: The overall architecture can become complex, especially when dealing
    with the coordination of many small services.


    **Increased operational overhead**: Managing and deploying many microservices
    can increase operational overhead, such as monitoring and testing.


    **Network latency**: Communication between microservices can add network latency
    and reduce performance if not properly optimized.


    **Inter-service dependencies**: Inter-service dependencies can become complex
    and difficult to manage, especially when dealing with many small services.


    **Difficulties in testing**: Testing can become more complex and time-consuming
    with a large number of microservices.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Under what circumstances is the Microservice architecture are not preferable
    to you?


    While microservices have several benefits, there are some circumstances in which
    they may not be the best option. Here are some situations in which microservices
    might not be preferable:


    Small projects: Microservices architecture is generally recommended for large
    and complex systems. If your project is small and simple, then it might not be
    worth the added complexity of implementing a microservices architecture.


    Limited resources: Implementing a microservices architecture can require a significant
    investment of resources, including time, money, and expertise. If you don''t have
    access to the necessary resources, it might not be feasible to use a microservices
    architecture.


    High latency: Since microservices communicate with each other over a network,
    there can be latency issues. If low latency is critical to your application, then
    a monolithic architecture might be a better choice.


    Interdependent services: If your services are heavily interdependent, then implementing
    a microservices architecture might not provide significant benefits. It could
    lead to additional complexity and overhead without delivering much value.


    Development team experience: A microservices architecture requires specialized
    knowledge and experience to design and implement effectively. If your development
    team is not experienced in microservices, it might not be the best option.


    # What are the design principles of Microservice?


    **Modularity:** Services should be self-contained and should have a single, well-defined
    purpose.


    **Scalability:** Services should be able to scale independently to handle increasing
    load.


    **Decentralization:** The system should be decentralized, allowing for loosely-coupled
    services.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '**High Availability:** Services should be designed to be highly available to
    ensure system reliability.


    **Resilience:** Services should be designed to handle failures gracefully.


    **Data Management:** Services should manage their own data and should not share
    a common database.


    **Statelessness:** Services should be stateless to allow for easy scaling and
    caching.


    **Independent Deployment:** Services should be deployable independently of other
    services.


    **Observability:** The system should have built-in monitoring and logging capabilities
    to allow for visibility into system behaviour.


    **Automation:** Deployment, testing, and scaling should be automated as much as
    possible.


    # Do you know the 12-factor methodology to build a Microservice?


    The 12-factor methodology is a set of guidelines for building scalable, maintainable,
    and easily deployable software-as-a-service (SaaS) applications. It''s particularly
    relevant for building Microservice-based applications, since Microservice represent
    a distributed system and can benefit from the principles of the 12-factor methodology.
    Here are the 12 factors:


    **Codebase:** One codebase per app, with multiple deploys.


    **Dependencies:** Explicitly declare and isolate dependencies.


    **Config:** Store config in the environment.


    **Backing services:** Treat backing services as attached resources.


    **Build, release, run:** Strictly separate build and run stages.


    **Processes:** Execute the app as one or more stateless processes.


    **Port binding:** Export services via port binding.


    **Concurrency:** Scale out via the process model.


    **Disposability:** Maximize robustness with fast start-up and graceful shutdown.'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'Dev/prod parity: Keep development, staging, and production as similar as possible.


    Logs: Treat logs as event streams.


    Admin processes: Run admin/management tasks as one-off processes.


    By following the principles of the 12-factor methodology, you can build microservices
    that are scalable, maintainable, and easily deployable. This can help you to deliver
    high-quality applications that meet the needs of your customers and users.


    # Why are Microservice stateless?


    Microservice are designed to be stateless for several reasons:


    **Scalability:** Stateless Microservice can be easily scaled horizontally by adding
    more instances, without having to worry about preserving state across instances.
    This makes it easier to handle increased traffic and load balancing.


    **Resilience:** Stateless microservices fail without affecting the system as a
    whole, as they don''t rely on stored state. When a stateless microservice fails,
    another instance can simply take its place, preserving the overall health of the
    system.


    **Portability:** Stateless microservices can be deployed to any environment without
    having to worry about preserving state. This makes it easier to move microservices
    between environments, as between development and production, or between data centres.


    **Simplicity:** Stateless microservices are simpler to implement, maintain, and
    test, since they don''t have to manage state. This makes it easier to build, deploy,
    and manage a system made up of many microservices.


    In summary, stateless microservices provide greater scalability, resilience, portability,
    and simplicity compared to stateful microservices. However, there may be cases
    where stateless'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'microservices are necessary, for example, when dealing with user sessions or
    long-running transactions. In these cases, it''s important to carefully manage
    state and ensure that stateful microservices are still scalable, resilient, and
    portable.


    # What is the advantage of Microservice using Spring Boot Application + Spring
    Cloud?


    Advantages of Microservice over Spring Boot Application + Spring Cloud:


    **Improved Scalability**: Microservice architecture allows for better scalability
    by allowing services to be developed, deployed and scaled independently.


    **Faster Time-to-Market**: By breaking down a monolithic application into smaller,
    self-contained services, development teams can work in parallel and iterate more
    quickly.


    **Resilience**: Microservice provide improved resilience by allowing services
    to fail independently without affecting the entire system.


    **Better Resource Utilization**: Microservice allow for better resource utilization
    as services can be deployed on the best-suited infrastructure.


    **Increased Flexibility**: Microservice architecture provides increased flexibility
    as new services can be added or existing services can be updated without affecting
    the entire system.


    **Improved Maintainability**: Microservice provide improved maintainability by
    reducing the complexity of the overall system and making it easier to identify
    and fix problems.


    **Technology Heterogeneity**: Microservice architecture enables technology heterogeneity,
    allowing for the use of different technologies for different services.


    **Improved Team Collaboration**: Microservice architecture can improve team collaboration
    by breaking down a monolithic application into smaller, self-contained services
    that can be developed by smaller, cross-functional teams.'
  merge: -1
