    # Printing a string


    Our goal with HelloWorld program is pretty modest. When it runs, we''d like it
    to print some text to this output box at the bottom of the screen.


    When we downloaded the Java SDK, we acquired a library of useful functions, one
    of which will just this. This is the println(), or print line, function. When
    our Java code executes over our function, which will do right away because it''s
    the first function in our main()''s entry point, the Java code will print some
    words to our output box. Function names are followed by open and close parentheses.
    Inside these parentheses, we put information that the functions need to complete
    their task. The println() method of, course, needs know what we would like to
    print it. In Java, a line of text is contained by double quotation marks and we
    call it a string. Let''s have our program print "Hello World!"


    ![](img/c1d82e4914fcde9feba799b8fcf6e983_31_0.png)


    # Java syntax


    You might have noticed that NetBeans has been yelling at us for a little bit.
    There''s a light bulb and a red dot on the left and some red jittering under our
    text, a lot like if we had made a spelling error in some text editors. And that''s
    really what we''ve done. We''ve made a syntax mistake clearly wrong with our Java
    code and NetBeans knows it.'
