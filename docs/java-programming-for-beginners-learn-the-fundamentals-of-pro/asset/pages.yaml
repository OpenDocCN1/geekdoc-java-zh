  md: '# Useful Java Classes


    Once line 11 was reached the exception was still propagating upwards, there was
    nothing else to handle because it had reached the top of our program. The exception
    ended by getting printed to our System.err stream and our program terminated with
    result i, which is a failure case.


    This is for debugging purposes; we knew where we had to go to figure out what
    went wrong in our program, line 11 of Exceptions.java. But, if we were creating
    a program that we were looking to release for some reasonable purpose, we generally
    wouldn''t want our program to crash whenever a minor error were to occur, especially
    an input error such as this, which is perfectly reasonable for a user to make
    from time to time. So let''s explore how we can handle exceptions.


    # Handling exceptions


    When Java is to throw an exception, it stops executing the current code block
    and jumping up levels until the exception is handled. We have moved from deep
    within the Scanner.java class ''909 line to line 11 of Exceptions.java, the piece
    in our code where, as far as we were concerned, the exception occurred. If our
    code were executed by another block of code, we haven''t handled this exception,
    instead of printing out to System.err, we''d simply throw the exception up another
    level. Due to this, they''d see 11 of Exception.java in their stack trace.


    However, sometimes it doesn''t make sense to keeping an exception. Sometimes,
    we want to handle the exception case because we know what to do with it, as in
    the case we are dealing with right now, there are nicer ways to inform the user
    of what went wrong than just providing the stack trace and exception.


    Additionally, if we handle this exception, there''s no reason that we can''t resume
    the while loop. One failed case of this loop isn''t necessarily a reason to terminate
    our program. If we''re going to handle exception cases, we''re going to make use
    of the try...catch code blocks.


    # The try and catch blocks


    In any block of code where we think an exception might be thrown and we''d like
    to handle the exception, we''re going to wrap that code in a try block. For the
    most part, this doesn''t affect how this code is executed unless an exception
    occurs within the try block. If an exception is thrown within the try block, instead
    of propagating that exception upward to the next level, the code within the following
    catch block will immediately get executed.'
