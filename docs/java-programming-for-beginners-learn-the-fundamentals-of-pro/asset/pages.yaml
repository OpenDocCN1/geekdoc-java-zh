  md: '# Data Structures


    ArrayLists have a function that takes no input, called clear(), which will erase
    our ArrayList. We can utilize this function to give our users some control over
    our program. Let''s say that if the user inputs the string CLEAR, we would like
    to erase all of the information in our ArrayList. That’s a conditional statement
    I just made, so we would use an if statement. We''d utilize the following if statement
    code inside our while loop to implement this functionality:


    ```

    ((memory.get(memory.size()-1)).equals("CLEAR")) memory.clear();"

    ```


    First, need to check the item just added to our ArrayList against the string CLEAR.
    This item will be at the very end, that is, it will be the last item with the
    highest value. Unfortunately, there’s no lastItem() function implemented for ArrayList,
    but we can essentially create one ourselves by mashing together two ArrayList
    functions: get() and size().


    First, in order to get an item from an ArrayList, we utilize the get() function.
    Note that get() is very similar to the square brackets we would utilize if we
    were accessing an item from a traditional array. Also, the get() function is going
    to take an integer value and it’s going to map that integer to the index of the
    array contained within our ArrayList.


    So, to get the item in our ArrayList, we need to know how many items are there
    in the ArrayList. Then, we want to subtract one from that value, because the last
    index of an array with the length of seven, would be six, since the array starts
    counting at zero. To get how many items are in our ArrayList, we use the size()
    function, which takes no arguments and simply gives us an integer that is the
    size of the array, that is, how many items it contains. We subtract 1 from that
    value so we can properly access the last index and not the index behind it, which
    could contain anything. Then, we wrap the whole memory.get(memory.size()-1) block,
    which accesses the last item of our ArrayList parentheses.'
