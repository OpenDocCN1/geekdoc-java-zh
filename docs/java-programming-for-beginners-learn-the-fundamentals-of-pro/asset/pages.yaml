  md: 'Sometimes when we declare an array, an array, we just want to go ahead and
    assign values to all of its memory blocks right there in the code explicitly.
    When we want to do this, rather than using the new keyword and having our computer
    space out the new memory space by telling it how long the array is, we can explicitly
    declare an array, and we explicitly declare a primitive type. For example, we
    would do this for our arrayVar variable with the following code:


    ```

    arrayVar = {''a'', ''b1'', ''c'', ''d'', ''e'', ''f'', ''g''};

    ```


    The preceding statement will create an array of length seven simply because seven
    elements are declared, and of course, it will map the values accordingly:


    | ''a'' | ''b'' | ''c'' | ''d'' | ''e'' | ''f'' | ''g'' |

    |---|---|---|---|---|---|---|n| 0 | 1 | 2 | 3 | 4 | 5 | 6 |


    Now, let''s jump into some Java code and put arrays to work.


    # Array example in NetBeans


    Alright, I think it''s time to employ our newfound knowledge and write a computer
    program. Arrays allow us to manipulate amounts of information that would be unwieldy
    to deal with at the individual element level. So, we''re going to jump right into
    hard-hitting stuff and create a cool computer program. Arrays are a big logic
    step, and if you haven''t worked with something like them before, it can take
    a little time to wrap your head around them. The good news is if you make it through
    arrays in Java, you''re probably going to be fine with anything else the language
    can throw at.


    The program I would like to write will print the English alphabet to our screen.
    We could, of course, do all of this by ourselves by just doing something along
    the lines of the following code:


    ```

    System.out.println("abcdef");

    ```


    However, employing this is pretty mind-bending and it''s not going to teach us
    much. Instead, the program that we''re going to write is to learn, store, store,
    and print out the English alphabet.'
