    ```

    Map<String, String> famousPeople = new HashMap<>();

    ```


    We begin by using the Map keyword and then, with most data structures, we tell
    Java what type of information our Map is going to take. Map takes two sets of
    information, so we''ll have to give it two information types that are comma-separated.
    The first information type is the information type for the Map''s keys, and the
    second information type is the type for the Map''s values.


    We''re going to use lastNames as our keys because we don''t want our Map to store
    multiple values in one key, and it''s much less likely that we''re going to have
    multiple identical names. Additionally, it''s a lot more valuable for us to ask
    for the first name of the famous person named Addams, rather than the last name
    of the famous person Jane, of which there are probably more. Anyway, the data
    type of lastNames is String, and the data type of firstNames is String, or as
    well.


    Next, we give our Map variable name: famousPeople. Then, we cause our Map to come
    into being by instantiating it. To do this, we use the new keyword. Map is not
    an object, actually, it''s what we call an interface. For the most part, we interact
    with interfaces and objects the same way, but we cannot simply declare an instance
    of an interface. Rather, interfaces are additional wrappings of functionality
    that we place on top of objects, the way that ArrayLists add additional functionality
    to arrays.


    So, to create a new Map, we need a simpler type of object that we can wrap the
    Map interface around. A great candidate for this is the HashMap. Therefore, we
    create our HashMap and assign our Map variable famousPeople to it. We''ll now
    interact with this famousPeople variable just as if it were an object with all
    of the Map functionality. Additionally, if we would like, we could call only the
    HashMap functionality on this object as well.'
