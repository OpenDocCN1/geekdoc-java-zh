  md: '# Java code to write XML data


    The following are the steps to be performed for writing XML data:


    +   1. Because of the way an XML document is stored, we need to convert it into
    a different format before it''s really feasible for us to print it out to a file
    in the same format which we got the original XML. To do this, we''re going to
    make use of an XML-specific class called Transformer. As a number of the classes
    we deal with XML in the document model, Transformer instances are created using
    a factory. In this case, the factory is called TransformerFactory, and like many
    factories, it exposes the newInstance() method, allowing us to create one when
    we need. Our Transformer object, which will allow us to convert our Document object
    into something streamable that we can send to a file, we''re simply going to call
    the newTransformer() method of TransformerFactory:


    ```

    TransformerFactory tf = TransformerFactory.newInstance();

    Transformer transformer = tf.newTransformer();

    StreamResult result = new StreamResult(destination);

    ```


    +   2. before Transformer can transform our XML document into something else,
    it''s going to need to know what we would like it to convert our XML document''s
    information into. This class is the StreamResult class; it''s the target for the
    information stored within our current Document object. The stream is a raw binary
    information pump that can be sent to any number of targets. In this case, our
    target is to be the destination file provided to the StreamResult constructor:


    +   3. Our Transformer object though not automatically linked to our XML document,
    and it expects us to reference our XML document in a unique manner as a DOMSource
    object. Notice that our source object (defined next) is paired with the result
    object. The Transformer object, when we provide it both these objects, will know
    how to convert one to another. Now, to create the DOMSource object, we simply
    need to pass in our XML document:


    ```

    DOMSource source = new DOMSource(doc);

    ```'
