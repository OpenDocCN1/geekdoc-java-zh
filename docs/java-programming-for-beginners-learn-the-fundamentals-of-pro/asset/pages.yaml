  md: "# Creating a superclass\n\nOnce we've come to the conclusion that books and\
    \ share certain fundamental attributes, the attributes of all literature, we can\
    \ start breaking down these classes into component parts. Our Book class, for\
    \ example, has two real variables. It has a title variable and an author variable,\
    \ which are attributes we associate with all literature. It also has a publisher\
    \ variable and a genre variable, which may not be unique only to books and which\
    \ do not necessarily consider all forms of literature to have. So can we exploit\
    \ this knowledge? Well, we can build our Book and Poem classes so that they share\
    \ their nature as pieces of literature at a fundamental level. To make this happen,\
    \ we're first going to teach our program what a piece of literature is. The following\
    \ is a step-by-step procedure for this:\n\n+   1. We'll create a brand new class\
    \ and call it Literature.\n2. We'll assign to this class the attributes that the\
    \ pieces of literature share, which we've so far declared. In our case, books\
    \ and poems are already declared as pieces, with shared titles and authors. It\
    \ makes some logical sense to make a statement that all pieces of literature will\
    \ have a title and an author:\n\n3. From here, we'll flesh out our Literature\
    \ class like we would any other. We'll give it a constructor; in this case, our\
    \ constructor will take two variables: title and author. Then, we'll assign them\
    \ to the fields, much like we did with our Poem and Book classes:\n\n```\npackage\
    \ inheritance;\npublic class Literature {\n    protected String title;\n    protected\
    \ String author;\n```\n\n```\npublic Literature(String title, String author)\n\
    {\n    this.title = title;\n    this.author = author;\n}\n```"
