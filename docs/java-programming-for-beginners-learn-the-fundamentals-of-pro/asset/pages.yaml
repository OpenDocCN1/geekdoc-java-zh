  md: "# Useful Java Classes\n\nExceptions modify the control flow of our program,\
    \ but we should never use them for anything other than catching and handling passing\
    \ exceptions. If we attempt to use them to implement logic, we'll make a program\
    \ that will quickly become confusing for us and will be immediately very confusing\
    \ for any other programmer who attempts to understand it.\n\nTo help us explore\
    \ Java exceptions, I set up a basic program for us to play with; it is something\
    \ that can fail. It is an eternal loop that does two real things. First, it takes\
