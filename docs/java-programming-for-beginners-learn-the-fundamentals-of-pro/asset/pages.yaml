  md: "# Understanding Typed Variables\n\nThe following is the output of the preceding\
    \ code:\n\n![](img/c1d82e4914fcde9feba799b8fcf6e983_45_0.png)\n\nChanging these\
    \ lines manually is kind of a pain and quickly becomes infeasible if we're writing\
    \ very complicated programs or dynamic programs that take user input.\n\n# The\
    \ solution of variables\n\nFortunately, programming gives us a way of storing\
    \ and retrieving data; this is called the variable. To declare a variable in Java,\
    \ we first have to specify what kind of variable we're going to be. Variables\
    \ come in a number of different types. In this instance, we're using content with\
    \ numbers that aren't fractions. Also, in this case, if we do not have a specified\
    \ decimal place anywhere, it's appropriate to use one of Java's primitive types.\
    \ These are essentially as base level as we can get with information we work with\
    \ in the Java programming language; just about everything else we work with in\
    \ Java is built of the primitive types.\n\nTo declare a variable of the integer\
    \ primitive type, that is, whole numbers, we use the int keyword, all lowercase.\
    \ Once we do this, we need to give our variable a name. This is a unique identifier\
    \ that we'll use to access this piece of information in future. Each variable\
    \ in our local program should have its own name. Let's call our first variable\
    \ x and our second variable y:\n\n```\npackage variables;\n\npublic class Variables\
