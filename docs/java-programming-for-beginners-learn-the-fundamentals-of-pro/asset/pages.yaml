    \ Java returned: 1\nBUILD FAILED (total 5 seconds)\n```\n\nWhen this happens,\
    \ we get red text in our console. This red text is actually going to the System.err\
    \ stream.\n\n# Analyzing the console exception messages\n\nLet's walk through\
    \ the output text and understand what it means. There are two important sections\
    \ in it. The first part of the output text, the bit that's not tabbed, is the\
    \ identifier of this exception. It lets us know that an exception has been thrown\
    \ and where it has occurred. Then it tells us what type of exception has occurred.\
    \ You will notice that this exception is found in the java.util path (the path\
    \ that the output looks very similar to whether we were importing something into\
    \ our code or directly calling to an external library). That's because this exception\
    \ is actually a Java object, and our output text is letting us know exactly what\
    \ type of object it is.\n\nThe second bit of this exception test (the part that\
    \ is tabbed) is what we call a stack trace. It's basically the pieces of our program\
    \ that Java has jumped through. The very bottom of stack trace is the location\
    \ where the exception was originally thrown; in this case, it is Scanner.java\
    \ and it is on line 909.\n\nThat's not our code; that's code written for Scanner.java,\
    \ presumably where the nextFloat () method lives or code that the nextFloat ()\
    \ method calls.\n\nStack traces are layers of code, so once InputMismatchException\
    \ occurs, Java begins to jump through these lines of code or braced units until\
    \ it reaches the top layer where code resides, that's Exceptions.java in our case.\
    \ It's the file we created, and it is at the top of the stack trace. Line 11 of\
    \ our Exception.java code file is the last place where Java was able to handle\
    \ or throw this exception."
