  md: "# Modeling with Object-Oriented Java\n\nFirst off, we could simply change the\
    \ name we assign to our method arguments to something that's not identical to\
    \ the local member name; however, sometimes, it makes sense to explicitly call\
    \ it firstName. It can be a lot easier for people who are going to use the constructor.\
    \ When we need to explicitly tell our program we're using one of Person's class\
    \ member variables, we should provide a path for it properly. The keyword will\
    \ allow us to access the class that we're currently operating in, or its object\
    \ instance, when the program runs. So, this.firstName will always reference the\
    \ member variable as opposed to the one passed in as arg. Now that we have the\
    \ syntax, we can quickly assign the argument values to the values of our member\
    \ variables:\n\n```\npublic Person(String firstName, String lastName, Calendar\
    \ birthday)\n{\n    this.firstName = firstName;\n    this.lastName = lastName;\n\
    \    this.birthday = birthday;\n}\n```\n\nNow when we save this file and go back\
    \ to our main method—that is, GettingObjectOriented.java—and run our program,\
    \ we'll get the original output showing us that our Person constructor properly\
    \ mapped these input values to the values stored in our Person object:\n\n![](img/c1d82e4914fcde9feba799b8fcf6e983_181_0.png)\n\
    \nSo this is pretty cool. We've modified the Person class so that it's much more\
    \ difficult for a programmer to make an obvious mistake and call these methods\
    \ when they're bound to fail. A programmer could still get into trouble if they\
    \ did something along the lines of modifying one of the member variables after\
    \ our person has been created."
