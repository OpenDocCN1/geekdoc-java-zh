  md: "# More Object-Oriented Java\n\nIn our case, two of these members are title\
    \ and author. The Literature class declares these members and does a good job\
    \ of managing them throughout the class's functionality. So, we can remove these\
    \ members from our Poem class and we'll still be able to access them within the\
    \ Poem class's methods. This is because the Poem class inherits its declaration\
    \ from Literature. We do to make a slight modification to get this Poem class\
    \ working as intended. When we construct an object of a class that inherits another\
    \ class, by default the constructor of the subclass, as in the preceding screenshot,\
    \ will begin by calling the constructor of the superclass:\n\n```\npackage inheritance;\n\
    public class Literature {\n    protected String title;\n    protected String author;\n\
    \n    public Literature(String title, String author) {\n        this.title = title;\n\
    \        this.author = author;\n    }\n}\n```\n\nThis confuses Java as we have\
    \ set up right now because the Poem constructor takes three variables as input\
    \ whereas the Literature constructor is only expecting two. To solve this, explicitly\
    \ call the Literature constructor within the Poem constructor, using the following\
    \ steps:\n\n+   1. When we're in a subclass, we can call the methods of our superclass\
    \ using the super keyword. So in this case, we're going to begin our Poem constructor\
    \ by simply calling the super constructor, or the Literature constructor, and\
    \ passing to it the attributes that we'd like to know:\n\n```\npublic Poem(String\
