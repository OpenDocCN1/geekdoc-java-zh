  md: "# Modifying XML data\n\nThe power of the XML I/O system is that between loading\
    \ and writing our XML document, we can freely modify the Document object dom stored\
    \ in memory. Also, changes we make to the object in Java memory will be written\
    \ to our permanent XML file. So let's get begin by making some changes:\n\n+ \
    \  We're going to use getElementsByTagName to get all the owner elements in our\
    \ XML document. This will return a NodeList object and we'll call it owners:\n\
    \nNodeList owners = dom.getElementsByTagName(\"owner\");\n\n+   2. To convert\
    \ the names of all these owners to Mike, we're going to have to loop through this\
    \ list. As a refresher, we can get the number of items in the list by calling\
    \ the getLength() function of owners, that is, our NodeList object. To access\
    \ the item we are currently iterating through, we'll use the item() function of\
    \ owners and pass in our iterative variable i to get the item at that index. Let's\
    \ once again, we'll be using here. Note that setAttribute() takes two strings\
    \ as input, we'll just assume that our XML is well formatted and inform Java that\
    \ we are, in dealing with a fully fledged XML element at this point.\n\nNext,\
    \ XML elements expose a number of methods that allow us to modify them. One of\
    \ these elements is the setAttribute() method, and what's we'll be using here.\
    \ Note that setAttribute() takes two strings as input. First, it wants to know\
    \ what attribute we'd like to modify. We're going to be modifying the name attribute\
    \ (it's the only attribute available to us here), and we're going to assign its\
    \ value to Mike:\n\n```\nfor(int i = 0; i < owners.getLength(); i++) {\n    Element\
    \ owner = (Element)owners.item(i);\n    owner.setAttribute(\"name\", \"Mike\"\
    );\n}\n```"
  merge: -1
