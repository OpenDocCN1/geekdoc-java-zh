  md: "# Data Structures\n\nSo, what value do we assign to each character so that\
    \ our computer will learn the alphabet? Well, I like to think of it this way:\
    \ when we run through the loop for the first time, the value of the first element\
    \ of our array, when i is 0, which is 97, which is the integer value of the character\
    \ a. Now, when we assign 97+i as the value of character in our array. When we\
    \ run through our loop second time, i is incremented by one, and we'll be assigning\
    \ the value 97 +1, or 98, which is the integer value of the character b:\n\n```\n\
    for(int i = 0; i < 26; i++) {\n  alpha[i] = (char)(97 + i);\n}\n```\n\nIn this\
    \ instance, Java is asking us to explicitly let know that we would like to cast\
    \ this integer value to a character and store it.\n\n# Printing the alphabet\n\
    \nNow, to finish off our program, we need to print out our alpha array. To do\
    \ this, let's make use of a nifty function in an always accessible object called\
    \ Arrays. Arrays.toString() will convert a single array, which is the kind of\
    \ array that we've created, that is capable of being converted into a string:\n\
    \n```\npublic class Alphabet {\n  public static void main(String[] args) {\n \
    \   //97\n    char[] alpha = new char[26];\n    for(int i = 0; i < 26; i++) {\n\
    \      alpha[i] = (char)(97 + i);\n    }\n    System.out.println(Arrays.toString(alpha));\n\
    \  }\n}\n```\n\nNow, if we run our program, we'll see Java's representation of\
    \ the English alphabet in array form:\n\n| Output - Alphabet (run) | Variables\
    \ | Breakpoints |\n|---|---|---|\n| run: | [a, b, c, d, e, f, g, h, i, j, k, l,\
    \ m, n, o, p, q, r, s, t, u, v, w, x, y, z] | |\n| BUILD SUCCESSFUL (total time:\
    \ 0 seconds) | | |"
