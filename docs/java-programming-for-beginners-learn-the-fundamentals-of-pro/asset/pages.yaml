  md: '# The boolean variable


    To help us with what we discussed in the preceding section, we have the boolean
    variable:


    ```

    boolean bool = true;

    ```


    In the following line of code, boolean is a primitive type in Java, and a variable
    of the boolean type can have only one of the two values: it can either true or
    false. We can set the value of our Boolean variables to be any conditional statement.
    So, if we wanted to simplify how our code looks in the actual if statement, we
    could go ahead and store these Boolean values:


    ```

    boolean bool1 = input.contains(sOne);

    boolean bool2 = input.contains(sTwo);

    ```


    We need to do this before we actually evaluate the if statement, keeping everything
    much compact and


    ```

    if((bool1 || bool2) && false)

    ```


    > Remember the name of the game is keeping our code as simple and readable as
    possible. A really long conditional might feel great to write, but sometimes,
    there''s a more elegant solution.


