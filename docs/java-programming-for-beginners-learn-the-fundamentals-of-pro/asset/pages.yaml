  md: "# Setting up your development environment\n\nIn this section, we're going to\
    \ write our first Java program, but before we start coding away,\nneed to set\
    \ up an environment that is Java-development friendly.\n\n# Installing JDK\n\n\
    To start off this process, let's download a Java Development Kit (JDK) or a Java\
    \ SDK. This\ncontains libraries and executables that allow us to do lots of different\
    \ things with Java\ncode. Most importantly, with our SDK installed, we'll be able\
    \ to compile Java code and then\nrun completed programs.\n\nYou may already have\
    \ Java installed on your machine; however, unless you've done this\nexplicitly,\
    \ you probably haven't installed a Java SDK. The version of Java an average user\n\
    has installed on their machine is called the Java Runtime Environment (JRE). This\
    \ allows\nt execution of Java programs, and Java programs won't run on environments\
    \ without the\nJRE installed. But the JRE doesn't contain any real development\
    \ tools, which we're going to\nneed. The good news is that a Java JRE and a Java\
    \ SDK can exist harmoniously. A Java JRE\nis really just a subset of the SDK,\
    \ so if we only have the Java Development Kit installed,\nwhich we're to download,\
    \ we're going to be.\n\nIf you have downloaded the Java Development Kit in the\
    \ past, when you actually go to\ninstall this kit, Java will let you know that\
    \ it's already installed and you can skip that\nportion of the section. For everyone\
    \ else, check out how to download a development kit:\n\n+   1. To begin with,\
    \ navigate to\n   www.oracle.com/technetwork/java/javase/downloads/index.html\
    \ through\nyour browser."
  merge: -1
