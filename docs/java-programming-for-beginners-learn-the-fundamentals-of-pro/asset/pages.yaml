  md: '# Working with arrays


    In this section we''re going to learn about Java arrays. Arrays are Java''s most
    basic and commonly used data structure. Data structures are tools that allow us
    to store and access sequences of information rather than using individual variables.
    Variables are great when we have one specific piece of information that we need
    in our local programming language, but data structures are used when we want to
    large or complicated sets or series of information. We''re going to start this
    section with some visual learning modes, and then we''ll jump into our NetBeans
    IDE to write some actual Java code and make use of arrays.


    # Declaring and initializing an array


    Let''s begin by taking a look at the syntax before declaring and initializing
    an array in Java. The following line of code will cause an array to come into
    being with enough space to hold seven characters:


    ```

    char[] arrayVar = new char[7];

    ```


    To the left of our assignment operator (=), the syntax looks pretty familiar,
    unlike the syntax we use when declaring any other primitive or object. We begin
    by telling Java what type of element we''re going to declare here. In this case,
    we''re declaring a character array. The empty square brackets lets Java know that
    rather than creating a single character variable, we''d like to declare an array
    type because our array is a variable just like any other. We''ll access the elements
    of the array through the array''s variable name itself, not through the individual
    variable names of the elements, which we don''t need to assign as they are stored
    in an array. Once we''ve told Java what type of array we''re going to create,
    we give our array a name. I chose this arrayVar.


    To the right of our equality operator, things look a little different. You may
    have seen the new keyword in the past when we needed to create a new instance
    of an object, not a primitive element. When we create a primitive element in Java,
    Java knows exactly how much space is needed to store the primitive element, no
    matter what its value is. However, objects and arrays can have many different
    size requirements. Because a single array variable can be assigned to arrays of
    different lengths, we''re going to tell Java how much memory to put aside for
    each of these different length arrays when we create them. When creating an object
    or an array, we use the new keyword to tell Java that it should set aside memory
    space to place what we''re about to come into being, and that thing is a character
    array of length seven.'
