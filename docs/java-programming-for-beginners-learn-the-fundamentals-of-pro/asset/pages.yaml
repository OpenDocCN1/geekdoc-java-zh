  md: '# Useful Java Classes


    Because all Java objects inherit from the Object class, we can safely assume that
    any Java object we are dealing with implements each of the methods here. Among
    these methods is the equals() method that we were just talking about and trying
    to figure out where it came from. This makes it very clear that MyClass is inheriting
    the equals() method from its Object superclass.


    The definition of the equals() method at the object level is very vague. It says,
    "Indicates whether some other object is equal to this one." To some degree, this
    vagueness leaves it to us, as programmers, to determine what equality really means
    on a class-by-class basis.


    Let''s say we come to the decision, the reasonable decision, that object1 and
    object2 should be deemed to be equal to each other if the values they contain
    are identical. If we make this decision, then the current implementation of our
    program is not quite correct because it''s currently telling us that object1 and
    object2 are not equal. In order to change this, we''re going to need to override
    the equals() method in MyClass.


    # Overriding the equals() method


    Overriding an Object class method is no more difficult than overriding the method
    for any superclass. We simply declare an identical method, and this specific method
    will be used when appropriate, we''re dealing with a MyClass object. It''s important
    for us to notice that the equals() method does not take a MyClass object as input;
    it takes any object as input. So, before we go ahead and compare this object''s
    value with the value of our current MyClass objects, we need to protect ourselves
    and make sure that the object given as input is actually a MyClass object.


    To do this, let''s check some bad cases where we would want our program to simply
    go and return false without comparing the inner values of these objects:


    +   1. If we''ve been given an object that hasn''t actually been instantiated,
    a pointer or a null pointer, we''d simply want to return false because instantiated
    MyClass object is not equivalent to nothing at all.


    +   2. The more difficult question is: Is the object we''ve been given to compare,
    an instance of MyClass? Let''s check the opposite of this; let''s confirm that
    this object is not an instance of MyClass. The instanceof keyword lets us see
    what classes an object has within its repertoire. If our instanceof statement
    does not evaluate to true, we simply want to return false because we''d be comparing
    a MyClass object with an object that is not a MyClass object.'
