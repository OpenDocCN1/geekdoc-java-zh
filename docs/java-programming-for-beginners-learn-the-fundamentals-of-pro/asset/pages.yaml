  md: '# Type casting


    We can achieve a similar result though, using what''s called a cast. This is a
    command in which we ask Java to treat a variable of one type like it another.
    Here we''re circumventing Java''s natural inclination to treat inumber1 and INumber2
    as integers. We''re stepping in and saying, "You know what Java, treat this number
    as a float," and we''re assuming some responsibility when we do this. Java will
    attempt to do what we ask, but if we choose poorly and cast one object to an object
    that it cannot, our program will crash.


    Fortunately, we''re working with primitives, and primitive types know how to act
    like another type. So, we can cast the variable INumber1 to temporarily operate
    like a floating-point number by prefixing it with (float):


    ```

    float fNumber = (float)inNumber1/inNumber2;

    ```


