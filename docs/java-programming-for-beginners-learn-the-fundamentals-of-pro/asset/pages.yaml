  md: "File Input and Output\n\n# The BufferedWriter class\n\nLastly, there's a lot\
    \ of different writers available to us in Java, FileWriter is just one of them.\
    \ I decided to show it to you here because it's pretty simple. It takes some text\
    \ and prints it to a file. Very often, however, you will see FileWriter wrapped\
    \ around a BufferedWriter class. Now the declaration of the BufferedWriter class\
    \ will look like the one given in the following code block, where BufferedWriter\
    \ is created and given FileWriter as its input.\n\nThe BufferedWriter class is\
    \ pretty cool because what it does is it intelligently takes all the commands\
    \ you give and it attempts to write the content to a file in the most efficient\
    \ way possible:\n\n```\npackage writingtofiles;\n\nimport java.io.*;\n\npublic\
    \ class WritingToFiles {\n    public static void main(String[] args) throws IOException\
    \ {\n        BufferedWriter out = null;\n        try {\n            out = new\
    \ BufferedWriter(new FileWriter(\n                \"out.txt\", true));\n\n   \
    \         for (long number : FibonacciNumbers()) {\n                out.write(String.valueOf(number)\
    \ + \"\\r\\n\");\n            }\n            System.out.println(number);\n   \
    \     }\n        } catch (IOException e) {\n            System.err.println(\"\
    File IO Failed.\");\n        }\n        finally {\n            out.close();\n\
    \        }\n    }\n```\n\nThe program we've just written is from our point of\
    \ view, doing the same thing as our existing program has been doing. In instances\
    \ where we make many small writers, BufferedWriter can be significantly faster\
    \ because where appropriate, it will intelligently collect the write commands\
    \ we give and perform them in proper blocks to maximize efficiency:\n\n```\nout\
    \ = new BufferedWriter(new FileWriter(\"out.txt\", true));\n```"
