  md: '# More Object-Oriented Java


    If this is the case, Java provides us with a system to create classes that we
    can use for inheritance purposes, we will never be able to legally instantiate
    them on their own, as we''ve done before. If we want to mark a class be of that
    type, we''re going to call it an abstract class, and in the class''s declaration,
    we simply use the abstract keyword:


    ```

    public abstract class Literature {

    ```


    Once we''ve marked a class abstract, it''s no longer a legal operation to instantiate
    this class. At face value, this is a really simple thing and primarily a "protect
    our code from ourselves and other programmers" kind of deal, but that''s not entirely
    true; rather, it is true and it''s not the only purpose of declaring a class abstract.


    Once we''ve told Java that we can never create an instance of Literature, of classes
    that use Literature as their superclass, we''re no longer restricted when setting
    up the Literature class. Because we declared Literature to be an abstract class,
    and Java will know that Literature will never be instantiated on its own, only
    when it is a superclass of a class that most Java classes have to. For example,
    we don''t need to actually declare a constructor for Literature. If Literature
    was a standard Java class, Java would not be okay with this because if we tried
    to instantiate Literature, it would have no idea of what to do. There would be
    no constructor to call. But because Literature is abstract, we can be confident
    that Literature''s subclasses will have constructors of their own. Of course,
    if we do make this change, we''re going to get rid of the references to the Literature
    constructor in our subclasses, that is, deleting the super method from the subclasses.
    Therefore, there''s definitely a trade-off associated with this change. It requires
    more code in our subclasses to have less code in our Literature subclass. In this
    particular instance, this trade-off probably isn''t worth it because we''re duplicating
    code between our Book and Poem constructors, but if the constructors for Literature
    subclasses would be assumed to be very different things, not declaring a common
    base class would make a lot of sense.


    So, in a nutshell, we architect our program, or a larger solution, so that we
    have classes that make a lot of size for architecture purposes but should never
    be created all on their own, we should declare those classes as abstract. Sometimes,
    we''ll know we''ve come across a class like this when certain common class functionalities,
    such as having a constructor, just don''t make sense for this class.'
