  md: "# Data Structures\n\nWhile it's a little out of the scope of this particular\
    \ section, the power of interfaces is that we can assign them to objects of different\
    \ types, giving common functionalities to otherwise distinct object types. But,\
    \ for now, we're mostly just interested in the power and function of Java Maps.\
    \ You'll notice that we didn't have to explicitly tell Java what type our HashMap\
    \ was going to take. This is a stylistic choice really; if we wanted to, we could\
    \ declare the types that the HashMap took:\n\n```\nMap<String, String> famousPeople\
    \ = new HashMap<String, String>();\n```\n\nHowever, since we're only going to\
    \ interact with our HashMap in terms of its functionality as a Map, simply protecting\
    \ us from adding anything but strings when we interact with our HashMap through\
    \ the variable famousPeople, which is currently our only way to access it, should\
    \ be just fine.\n\n# Assigning values to our Map\n\nOnce we set up our Map, it's\
    \ time for us to go through and fill it with information. For this, we think a\
    \ for loop will be appropriate:\n\n```\nfor(int i = 0; i < lastNames.length; i++)\
    \ {\n    famousPeople.put(lastNames[i], firstNames[i]);\n}\n```\n\nWe're going\
    \ to add a number of pairs of information to our Map, that is, one key and one\
    \ value, equal to the number of items in either of these arrays. This is because\
    \ both have the same length. Let's set up a for loop that iterates through every\
    \ index from i to the length of (lastNames-1). The i values will map to the indices\
    \ of the lastNames array, and because the firstNames array has the same length\
    \ as the lastNames array, they will map to the indices of the firstNames array.\n\
    \nNow, for each i, we're going to execute our Map.put() function. The put() function\
    \ is similar to the add() function. It inserts information into our map. However,\
    \ this function expects two pieces of information. It expects our key, which is\
    \ the value we're currently looking at in lastNames, and then it expects the associated\
    \ value, which is the value we're looking at in firstNames. Each time we execute\
    \ the famousPeople.put(lastNames[i], firstNames[i]); line of code in our for loop,\
    \ we'll be adding a new key pair to our Map."
