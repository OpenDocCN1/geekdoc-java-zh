  md: "# Branching\n\nFortunately, just like in algebra, we can ask Java to do operations\
    \ in a specific order. We do this by surrounding the blocks of our code with parentheses.\
    \ Blocks of code within parentheses will evaluate before Java leaves the parentheses\
    \ to evaluate something else:\n\n```\nif((input.contains(sOne)) || input.contains(sTwo))\
    \ && false\n```\n\nSo, after we've surrounded our | statement with parentheses,\
    \ we'll compute the | statement and then that result with false:\n\n```\npackage\
    \ complexConditionals;\nimport java.util.*;\npublic class ComplexConditionals\
    \ {\n    public static void main(String[] args) {\n        Scanner reader = new\
    \ Scanner(System.in);\n        String input = reader.next();\n        String sOne\
    \ = \"abc\";\n        String sTwo = \"z\";\n        if(input.contains(sOne) ||\
    \ input.contains(sTwo)) && false {\n            System.out.println(\"TRUE\");\n\
    \        } else {\n            System.out.println(\"FALSE\");\n        }\n   \
    \ }\n}\n```\n\nWe will now see that our preceding program always evaluates to\
    \ false here:\n\n| Output - ComplexConditionals (run) |\n| run: |\n| zabc |\n\
    | FALSE |\n| BUILD SUCCESSFUL (total time: 9 seconds) |\n\nSo complex conditionals\
    \ can get pretty complicated. If we come across something like this statement\
    \ in code, especially if it's code that we haven't written, it can take us a good\
    \ while to figure out exactly what's going on."
