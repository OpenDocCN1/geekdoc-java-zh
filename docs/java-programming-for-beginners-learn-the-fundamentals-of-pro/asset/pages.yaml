  md: '# ArrayLists


    When we need a Java data structure, we should start by asking ourselves whether
    a simple array is sufficient. If we can write our program easily and neatly using
    just an array, that might be our best option to keep our programs simple by extension.
    If you''re writing code that must run as fast as possible and use memory as efficiently
    as possible, arrays will also have very little overhead. But, in today''s development
    world, where memory efficiency and speed really aren''t concerns for your average
    program, sometimes we need to employ data structures with more built-in functionality,
    or maybe which are designed for a specific purpose.


    A data structure with additional functionality is called ArrayList. One of the
    weaknesses of traditional arrays is that when we instantiate them, we have to
    give them a specific length, so we have to know how large we want our array to
    be. An ArrayList is basically an array wrapped in some additional code that causes
    the array to increase or decrease in size to always be the size of the number
    of elements it contains.


    # An ArrayList example in NetBeans


    To see this in action, let''s write a program that would actually be a little
    more difficult to write if we just used a standard array instead of an ArrayList.
    I''d like to write a program that will take an input string from the user. It
    will store this input string with every input string the user has ever given it,
    and then print them all out each time the user inputs a new string.


    This would be really difficult to do with an array if the user ever inputs one
    more string than the array was designed to hold, our array would, in the best-case
    scenario, not accept the string; in the worst-case scenario, our program might
    crash. But, our ArrayList object will simply resize to fit the number of strings
    that it''s currently holding.'
