  md: "# Modeling with Object-Oriented Java\n\nNow, as far as the main method in our\
    \ program is concerned, the syntax of our program is once valid. Of course, if\
    \ we run this program, we're going to run into some trouble because we pass these\
    \ arguments to the Person constructor, we haven't done anything with them.\n\n\
    Now, it needs be the job of our Person constructor here, as opposed to the main\
    \ method in our Java program, to translate these parameters into the values of\
    \ the member variables of Person. So, let's do that. Let's change our Person's\
    \ className, or rather set its value, to the variable passed to this function:\n\
    \n```\npackage gettingobjectoriented;\nimport java.util.*;\npublic class Person\
    \ {\n    String firstName;\n    String lastName;\n    Calendar birthday;\n   \
    \ public Person(String firstName, String lastName, Calendar birthday)\n    {\n\
    \        firstName = firstName;\n    }\n    public String fullName()\n    {\n\
    \        return firstName + \" \" + lastName;\n    }\n\n    public int age(Calendar\
    \ today)\n    {\n        return today.get(Calendar.YEAR) - birthday.get(Calendar.YEAR);\n\
    \    }\n}\n```\n\nNow, this is a technically correct syntax that we have here;\
    \ it will do what we want it to do.\n\nThe firstName = firstName code line is\
    \ really weird, and it's pretty ambiguous if you go about reading it. After all,\
    \ the firstName variable we are talking about in each of these instances? We are\
    \ talking about Person.firstName, the member variable of this class, or we are\
    \ talking about firstName that was passed in as an argument to the constructor\
    \ method? To disambiguate this, we can do a couple of things."
