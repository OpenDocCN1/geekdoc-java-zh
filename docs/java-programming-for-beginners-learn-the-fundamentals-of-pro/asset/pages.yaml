  md: 'XML is probably a good way to start. This method returns the top-level element
    of our XML; in this case, we''re going to get the cars element, which contains
    all of the information that we''re going to need. It also contains some information
    we don''t need, like Billy’s cars, but we''ll parse that out after we''ve accessed
    it. Once we''ve imported the right libraries, we can directly reference the concept
    of an XML element within our code using the Element class. We can create a new
    Element and assign its value to the root element of our XML document:


    ```

    Element doc = doc.getDocumentElement();

    ```


    Of course, we need to go deeper. The root level of our XML document cars is not
    directly useful to us; we need the information contained within it. We only really
    want the information from one owner node (containing information about Jane’s
    cars). But because of the XML parsing works, it makes sense for us to first acquire
    both of these nodes and then find the one we''re really interested in.


    To acquire both of these nodes, we can call a method on the root XML element we''ve
    just created and stored in doc. XML elements can contain other elements within
    them; in this case, our root element contains a number of owner elements. The
    getElementsByTagName() allows us to collect a number of these inner elements.
    The tag name of an XML element is just what you would expect; it is the name we
    gave to that particular element of our XML. In this case, if we ask for all the
    elements with the tag name owner contained within our document''s root element,
    we''re going to have further down the amount of XML we''re working with, getting
    closer to the small section we desire.


    What''s returned by the getElementsByTagName() method is not a single element
    though. There are two distinct elements in this section at the highest level,
    two owners: Billy and Jane. So, the getElementsByTagNameLine() method doesn''t
    return a single element; instead, it returns a NodeList object, which is a collection
    of XML nodes:


    ```

    NodeList ownersList = doc.getElementsByTagName("owner");

    ```'
