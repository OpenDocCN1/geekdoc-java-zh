  md: "# Understanding Typed Variables\n\nThe first computers were little more than\
    \ calculators, and Java, of course, retains this functionality. For example, Java\
    \ can evaluate 1+1, which will evaluate to 2, of course. However, Java is pretty\
    \ complicated and designed to do a lot of different things, we need to provide\
    \ context to our commands. Here, we tell Java that we'd like to print the result\
    \ of\n1+1:\n\n```\npackage variables;\n\npublic class Variables {\n\n    public\
    \ static void main(String[] args) {\n        System.out.println(1+1);\n    }\n\
    \n```\n\nOur preceding program will run as expected:\n\n![](img/c1d82e4914fcde9feba799b8fcf6e983_44_0.png)\n\
    \nIn addition to some others, Java can perform all the basic arithmetic operations.\
    \ It can do addition, subtraction, multiplication (for which we use *, not X on\
    \ our keyboard), and division. If we run the following program with the input\
    \ of 2 and 3, we'll see four println() commands, all of which will give the proper\
    \ result of the calculations. We can, of course, change these numbers to be any\
    \ combination of numbers we see fit:\n\n```\npackage variables;\n\npublic class\
    \ Variables {\n\n    public static void main(String[] args) {\n        System.out.println(2+3);\n\
    \        System.out.println(2-3);\n        System.out.println(2*3);\n        System.out.println(2/3);\n\
    \    }\n\n```"
