  md: "# Basic GUI Development\n\n# Closing our application\n\nOne thing's kind of\
    \ annoying is that our program is continuing to run even after we close the associated\
    \ GUI. That's a little silly. When I press the close button on the NetBeans GUI,\
    \ NetBeans closes itself and stops running as a process on my system. We can instruct\
    \ our frame to terminate the associated process using its setDefaultCloseOperation\
    \ method. This method has the return type void and takes an integer as a value.\
    \ This integer is an enumerator, and there's lots of options available to us.\
    \ All of these options are statically declared by the JFrame class, and the one\
    \ we're looking for is EXIT_ON_CLOSE, which will exit our application when we\
    \ close our window. Build and run the program, and there goes our process, which\
    \ is not quite running in the background anymore:\n\n```\nframe.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    ```\n\nThat's our basic introduction to GUIs in Java. Creating a GUI is complicated,\
    \ but it is exciting as well it's visual and immediate; also, it is really powerful.\n\
    \nAs our program stands right now as shown in the following code is functional,\
    \ but we were to extend it, we might eventually run into some very odd and confusing\
    \ issues. What we've done now flies in the face of the recommended practices when\
    \ creating a new GUI. These recommended practices are in place to protect us from\
    \ some very low-level issues that occur when our programs become multithreaded.\n\
    \nWhat does it mean when we say that our program is multithreaded? Well, when\
    \ we create our GUI, when we cause it to come into being, our program goes from\
    \ performing a single task, which is simply executing the main method from start\
    \ to finish, to performing multiple tasks. This is because we are now executing\
    \ the following code:\n\n```\npublic gui;\nimport javax.swing.*;\nimport java.awt.*;\n\
    public class GUI {\n    public static void main(String[] args) {\n        JFrame\
    \ frame = new JFrame(\"Hello World GUI\");\n        frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \        frame.setPreferredSize(new Dimension(400, 400));\n        JLabel label\
    \ = new JLabel(\"Hi. I am a GUI.\");\n        frame.getContentPane().add(label);\n\
    \        frame.pack();\n        frame.setVisible(true);\n    }\n}\n```"
