  md: '# Basic GUI Development


    However, in addition, the code is also managing the new window we''ve created
    and any functionality performed by that window. To protect ourselves from the
    complexities of multithreaded code, it''s recommended that we create our new Swing
    GUI by allowing one of the Swing utilities to construct this GUI for asynchronously.


    In order to make this happen, we''re actually going to need to pull all of the
    code we''ve written out of our main method and place it in one place where we
    can reference it from our main method. This will be a new function as shown in
    the following code line:


    ```

    private static void makeGUI()

    ```


    We can just paste all of this code to call our new function:


    ```

    private static void makeGUI()

    {

    JFrame frame = new JFrame("Hello World");

    frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);

    frame.setPreferredSize(new Dimension(400, 400));

    JLabel label = new JLabel("Hi. I am a GUI.");

    frame.getContentPane().add(label);

    frame.pack();

    frame.setVisible(true);

    }

    ```


    # The Swing Utilities


    Now, let''s take a look at how Swing recommends we cause our GUI to come into
    being. As I said, the swing package provides us some functionality that will perform
    this vast amount of work and thinking for us. The SwingUtilities class has a static
    invokeLater method that will create our GUI when no other thread needs to be processed
    or all of the other thinking is done for a bit:


    ```

    SwingUtilities.invokeLater(null);

    ```


    This invokeLater method expects us to pass in a Runnable object to it, so we''re
    going to create one of the Runnable objects for ourselves:


    ```

    Runnable GUITask = new Runnable()

    ```'
