  md: "# Basic GUI Development\n\nThe Runnable objects are those that can be converted\
    \ into a thread of their own. They have a method that we're going to override,\
    \ called run, and the SwingUtilities.invokeLater method will call the run method\
    \ of Runnable when appropriate. When this occurs, all we want to do is call MakeGUI\
    \ method and begin executing the code that we've tested out, the one that will\
    \ create a GUI. We'll add the Override notation to be programmers and pass our\
    \ new Runnable object to the invokeLater method of SwingUtilities:\n\n```\npublic\
    \ static void main(String[] args) {\n  Runable GUITask = new Runnable(){\n   \
    \ @Override\n    public void run(){\n      MakeGUI();\n    }\n  };\n  SwingUtilities.invokeLater(GUITask);\n\
    }\n```\n\nThe preceding program and we go! The functionality is exactly the same,\
    \ and what we've done could arguably overkill for a program this small; however,\
    \ it's really good for us to take a look at what we should expect to see in a\
    \ larger software project, where things such as multithreading could become a\
    \ concern. We went through this bit quickly, let's stop and take a look at this\
    \ section once again:\n\n```\nRunable GUITask = new Runnable(){\n  @Override\n\
    \  public void run(){\n    MakeGUI();\n  }\n}\n```\n\nWhat we've done in this\
    \ bit of code is create an anonymous class. While it looks like we've created\
    \ a new Runnable object, we've really created a new subclass of Runnable object\
    \ with its own special overridden version of the run method, and we just put it\
    \ in the middle of our code. This is a powerful methodology that allows us to\
    \ cut down on the amount of code needed. Of course, if we overuse it, our code\
    \ can quickly become very complicated for us or another programmer to read and\
    \ understand."
