  md: "# Analyzing ArrayOutOfBoundsException\n\nOur program has thrown an ArrayOutOfBoundsException.\
    \ This means that we tried to access memory that our memory array did not have\
    \ access to. Specifically, we tried to look at what was at index -1 of the array.\
    \ Since arrays start at index 0, they don't have anything at index -1. Any piece\
    \ of computer's memory could be there, and security reasons, programs aren't allowed\
    \ to just looking through a computer's memory because they want to. So, why did\
    \ this happen? Why did we ask for index -1 of an array, which is never going to\
    \ be a valid index?\n\nWell, our first statement implemented the functionality\
    \ to clear our ArrayList executed just fine. Our program saw CLEAR command, understood\
    \ our first look at our array index, and cleared the array.\n\nImmediately following\
    \ this, we asked our program to again check the last item added to our array,\
    \ using the second statement. When we did, we executed memory.size()-1. First,\
    \ we asked Java about the size of our ArrayList. Because we just cleared our ArrayList,\
    \ Java told us that the size of the ArrayList was zero, that there was nothing\
    \ in it. Then we subtracted one from it to get -1. Post, we returned memory.get()\
    \ on -1. Thus, we asked Java to take a look at what was at index -1 of our array,\
    \ at which point Java said, \"Whoa! What are you doing? It's not cool, I'm going\
    \ to crash!\n\nSo, how do we solve this? Well, there's a couple of things we could\
    \ do. We should probably just check and make sure that arrays are not empty before\
    \ we run the functions in the second statement. That option looks like a few more\
    \ lines of code than I want to put. It's undoable in any sense of the word, and\
    \ I encourage you to try and implement a better solution than this yourself.\n\
    \nFor now, to get our program quickly up and running without crashing, let's change\
    \ the pair of blocks to an if...else statement as follows:\n\n```\nwhile(true)\
    \ {\n    memory.add(reader.nextLine());\n    if ((memory.get(memory.size()-1)).equals(\"\
    CLEAR\")) {\n        memory.clear();\n    } else {\n        if((memory.get(memory.size()-1)).equals(\"\
    END\")) {\n            break;\n        }\n        System.out.println(memory.toString());\n\
    \    }\n}\n```"
