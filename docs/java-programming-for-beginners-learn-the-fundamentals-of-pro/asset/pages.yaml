  md: 'XML


    Now it might make sense to combine these two XML elements so that Mike is only
    a single owner, not split it into two. That''s a little out of the scope for this
    section, but it''s an interesting question and one I want to encourage you to
    reflect on and maybe take a shot at right now.


    # Summary


    In this chapter, we saw the Java code to read an XML file into a Document object.
    We also saw how to parse XML data using Java. Finally, we saw how to write and
    modify XML data in Java.


    Congratulations! You are now a Java programmer.'
