    # # For loops


    In this section, we''re going to take a quick look at for loops. We use for loops
    to solve a common problem in Java in a very semantically elegant manner. These
    loops are appropriate when we need to iterate a variable to count how many times
    we have looped.


    To start off, I''ve written a very basic program using a while loop; it prints
    the values 1 through 100 to the window on our screen. Once you''ve hashed out
    in your mind how this while loop is working, we''ll write the same loop with for
    loop so that we could see how the for loop is more elegant in this particular
    instance. Let''s comment out our while loop so that we can still see it as shown
    in the following screenshot without having any of its code and beginning our for
    loop instead :


    ![](img/c1d82e4914fcde9feba799b8fcf6e983_106_0.png)


    The basic syntax of a for loop looks very similar to that of a while loop. We
    have the reserved keyword, two parentheses in which we''ll put some information
    about the loop, and the code block that we''re going to go through. Unlike a while
    loop, which just takes a conditional statement between these parentheses, we''re
    going to provide our for loop with a bunch of information. Because the for loop
    is designed to handle a specific case, once we give it all this information, it
    will know exactly what to do with it. This alleviates the need for us to handle
    code outside of the loop and manually increment or decrement it inside of the
    loop. It keeps the functional bit of our code, our println statement, and in more
    complicated programs, the more complicated information that may be inside the
    for loop, more isolated.


    [ 95 ]'
