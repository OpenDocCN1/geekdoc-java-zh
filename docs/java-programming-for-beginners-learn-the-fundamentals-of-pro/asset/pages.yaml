- img_proc: true
  md: "# Getting Started with Java\n\nThere are two things wrong here. The first is\
    \ that our code doesn't end with a semicolon. Java doesn't do a good job of reading\
    \ spaces and carriage returns, so we need to put semicolons at the end of every\
    \ firstly line of code for the same reason that a Morse code operator would send\
    \ the message \"stop\" at the end of every line. Let's add a semicolon at the\
    \ end of `println()` statement.\n\n```\npublic class HelloWorld {\n    public\
    \ static void main(String[] args) {\n        println(\"Hello World!\");\n    }\n\
    }\n```\n\n![](img/c1d82e4914fcde9feba799b8fcf6e983_32_0.png)\n\nNetBeans has become\
    \ a little more satisfied; the jittering has decreased, but there's still something\
    \ wrong as shown in the preceding screenshot.\n\nThe issue is that functions in\
    \ a programming language, just like files on a computer, have a location where\
    \ they exist. NetBeans isn't sure where to find the `println()` function that\
    \ we've attempted to use. So we simply need to tell NetBeans where this function\
    \ exists. The full path to the `println()` function starts from the `System` package,\
    \ which includes the `out` class, which has the definition of the `println()`\
    \ function. We write that in Java as `System.out.println(\"Hello World!\")`; as\
    \ shown in the following code.\n\nLet's get rid of the extra spaces created at\
    \ lines 5, 6, and 7, not because they would affect the way our program runs, but\
    \ because it doesn't make it look quite as nice. Now we've written our `HelloWorld`\
    \ program:\n\n```\npublic class HelloWorld {\n    public static void main(String[]\
    \ args) {\n        System.out.println(\"Hello World!\");\n    }\n}\n```"
  merge: -1
