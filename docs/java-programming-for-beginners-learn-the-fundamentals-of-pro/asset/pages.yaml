  md: "# Understanding Typed Variables\n\nLet's create a new project; we'll call it\
    \ Characters.java. We'll start our program by simply defining a single character.\
    \ We'll call it character1 and we'll assign it to the value of uppercase H:\n\n\
    ```\npackage characters;\n\npublic class Characters {\n    public static void\
    \ main(String[] args) {\n        char character1 = 'H';\n    }\n}\n```\n\nJust\
    \ as we have to use some extra syntax when defining a floating-point number explicitly,\
    \ we need some extra syntax when defining a character. To tell Java that we're\
    \ explicitly declaring a character value, we surround the literal we would like\
    \ to assign to our variable with two single quotation marks. The single quotation\
    \ marks, as opposed to double quotation marks, let know that we're working with\
    \ a character or a single letter, as opposed to trying to use an entire string.\
    \ Characters can only have entity values. If we attempt to assign the value of\
    \ Hi to character1, NetBeans and Java would both let us know that's not a valid\
    \ option:\n\n```\nchar character1 = 'Hi';\n```\n\nNow, let's move on and write\
    \ a somewhat convoluted program that will nonetheless work well for our example\
    \ purposes. Let's define five characters. We'll call them character1 through character5.\
    \ We'll assign each of them with one of the five letters of the word \"Hello\"\
    , in that order. When these characters are printed, our output will show Hello.\
    \ In the second part of our program, let's use System.out.print() to display these\
    \ letters on the screen. The System.out.print() works just the same as System.out.println(),\
    \ except that it doesn't add a carriage return at the end of our line. Lets has\
    \ the last command so that our output is separated from all of the additional\
    \ text presented in our console:\n\n```\npackage characters;\n\npublic class Characters\
    \ {\n\n    public static void main(String[] args) {\n        char character1 =\
    \ 'H';\n        char character2 = 'e';\n        char character3 = 'l';\n     \
    \   char character4 = 'l';\n        char character5 = 'o';\n    }\n```"
