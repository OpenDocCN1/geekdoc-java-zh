  md: '# Data Structures


    As mentioned earlier, for loops and arrays get along because arrays know how long
    they are. We could simply state that we would like this loop to run eight times
    (y<8), but that''s not good dynamic programming if someone were to go along and
    change the size of our chessboard, our program would now break. We can write this
    loop so that it will work for a chessboard of any size.


    To this, rather than explicitly saying our loop run eight times, we should have
    started by asking our array how long it is. To ask an array its length, we just
    need to write array.length and this returns an integer value. so simply calling
    the name of the array to use the length variable will get us the length of the
    array''s outermost segment. In this case, we''re asking our two-dimensional array,
    "How many arrays do you have? To finish this off for loop, we simply need to increment
    y after it runs each time. Then, our for loop will loop through each array that
    our 2D array contains:


    ```

    for(int y = 0; y < board.length; y++)

    {}

    ```


    Let''s do something similar for our inner loop. Because this loop will be iterating
    through the individual elements of our rows, x for the x-axis seems an appropriate
    variable name to use. Because our array is currently the same length in both segments,
    by eight array, simply using the board.length statement, would work for now. But
    once again, it''s not good dynamic programming. If someone was to go through and
    change the size of our board by ten, this program would no longer execute properly.
    Instead, at the beginning of this inner loop''s execution, let''s ask the array
    that we''ve currently accessing our outer loop how long it individually. This
    is once again makes our program robust and allows us to accommodate multiple sizes
    for our board:


    ```

    for(int x = 0; x < board[y].length; x++)

    {}

    ```


    OK, the next step in our program is to assign character values to each node in
    our array: B for black squares and W for white squares. Let''s start off by writing
    the code to make all the squares white. Our for loop will pass through each node
    in our two-dimensional array when it executes. each time we execute the code in
    our inner for loop, we''re executing it in terms of one of the single two-dimensional
    array nodes. To get this, we''re going to ask our board array what is located
    at row y and column x, and then we''ll change the value of that node:


    ```

    for(int y = 0; y < board.length; y++)

    {}

    ```


