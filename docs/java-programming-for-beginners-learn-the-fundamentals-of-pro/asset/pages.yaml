    In this chapter, we are going to learn some of the most important data structures
    in Java. We''ll look at what arrays are and how they are useful when we need to
    work with sequences of variables. We''ll write a program in NetBeans using arrays
    to understand how they work. This chapter will also walk us through the concept
    of multidimensional arrays. We''ll write a program to create a chessboard using
    a two-dimensional array.


    Next, this chapter will illustrate what ArrayLists are and how they provide increased
    functionality when compared to arrays. Finally, we''ll look at the Map data structure
    and implement it in NetBeans.


    More specifically, we''ll cover the following topics:


    +   * Arrays and their syntax

    * An array example to print the English alphabet

    * Multidimensional arrays

    * A program to create a chessboard using a 2D array

    * ArrayList and its example

    * Maps and their implementation in NetBeans'
