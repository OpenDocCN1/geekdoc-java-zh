  md: "# Branching\n\nSo are we conditional statements exactly? Well, conditional\
    \ statements allow us to send our program down different paths, executing different\
    \ lines of code depending on whether or not something is true or not. In this\
    \ chapter, we'll use conditional statements to print different responses to our\
    \ user depending on the value of the input we give us. Specifically, we'll let\
    \ them know the value they've given us is less, greater, or equal to the 10. To\
    \ start this process, let's set out our cases.\n\nIf our user provides us with\
    \ input that is greater than 10, we print out MORE. If the user provides us with\
    \ input that happens to be less than 10, we print out LESS. Of course, if we run\
    \ this program right now, we will simply print MORE or LESS, both the lines. What\
    \ we need to do is use conditional statements to make sure that only one of these\
    \ two lines executes in any program run, and that the proper line executes of\
    \ code. You may have noticed that the default project NetBeans created for us\
    \ divides our code into segments that have brackets around them.\n\nWe can further\
    \ divide our code into segments using brackets of our own. Convention dictates\
    \ that once we've created a new set of brackets, a new segment of code, we need\
    \ to add a tab before everything the brackets to make our program more readable.\n\
    \n# Using if statements\n\nOnce we've sectioned off our system.out.println statements,\
    \ we're ready to provide cases that must be true if these statements are to run.\
    \ To do this, we preface our new sections with the if statement, where if is a\
    \ Java keyword and it's followed by two parentheses between which we put the statement\
    \ to be evaluated. If Java determines that the statement we write between the\
    \ parentheses is true, the code in the following brackets will execute. If Java\
    \ determines that the statement is false, we're going to give this if statement\
    \ two pieces of input. We're going to give it the variable input, if we remember\
    \ the integer value that we get from the user, and we're going to give it the\
    \ explicit value 10, which is what we're comparing it to. Java understands the\
    \ greater (>) and the less than (<) comparison operators. So, if we make this\
    \ if statement if(input > 10), then the System.out.println command (as seen in\
    \ the following screenshot) will only run if the user has provided a value that\
    \ is greater than 10:\n\n```\nif(input > 10) {\n    System.out.println(\"MORE!\"\
    );\n} {\n    System.out.println(\"LESS!\");\n}\n```"
