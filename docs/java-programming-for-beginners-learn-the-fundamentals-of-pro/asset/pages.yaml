    # Default initialization of arrays in Java


    Now, let''s jump back into theory for the rest of this section. I misled you earlier
    when I led you to believe that our newly created arrays were filled with empty
    memory. In fact, when we declare a new array of a primitive type, that is, characters,
    integers, Booleans, floats, and so on, Java fills it with default values. For
    example, our new array of seven characters was filled by seven space characters,
    that is, what''d get if you pressed the spacebar on your keyboard:


    ![](img/c1d82e4914fcde9feba799b8fcf6e983_117_0.png)


    Similarly, an array of integers will be filled with seven zeros:


    ![](img/c1d82e4914fcde9feba799b8fcf6e983_117_1.png)


    I recommend that you boot up a Java IDE and create some empty primitive arrays
    and print them out using println to see what the default values are.


    Now we can create arrays of any object available to us. However, objects, objects,
    unlike primitives, do not have default values that they set themselves to when
    they are initialized as part of an array. This is an important thing to realize.'
