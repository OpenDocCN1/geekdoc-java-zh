  md: "# Data Structures\n\nThe value we're looking for is 97, the integer value of\
    \ a lowercase a, which is the first character in the English language. So let's\
    \ create a little comment in our program and store the value 97 for later use:\n\
    \n```\npackage alphabet;\n\npublic class Alphabet {\n    public static void main(String[]\
    \ args) {\n        // 97\n        char[] alpha = new char[26];\n    }\n}\n```\n\
    \n# Creating a for loop\n\nNow let's begin creating our for loop. For our loop\
    \ is going to run 26 times; each time it runs, take the next character in the\
    \ English alphabet and place it in our character array: alpha.\n\nTo make sure\
    \ our for loop runs exactly 26 times, we should declare a counting variable, i,\
    \ and set it to 0, that is, (i=0). Next, let's say that our for loop should continue\
    \ to run as long as the value of counting variable is less than 26, that is, it\
    \ should take values between 0 and 25 (i<26). Lastly, every time our for loop\
    \ runs, we need to increase the value of our counting variable by one so it goes\
    \ up each time, and after 26 iterations, the i<26 statement will no longer be\
    \ true and our loop will stop at (i++):\n\n```\nfor(int i = 0; i < 26; i++)\n\
    {\n}\n}\n```\n\nNow, inside our for loop, we're going to assign values to the\
    \ spaces in our character array one by one. To access one of these spaces, we\
    \ will use the name of the variable assigned to our array, that is, alpha, followed\
    \ by a number (or index) within square brackets to tell Java which character in\
    \ our array we would like to assign a value to.\n\nThe index of our array should\
    \ be different each time we run through the loop. This is the beauty of for loops.\
    \ By starting our counting variable i at 0, we can use it to map to the index\
    \ of our array. That is, we can use alpha[i] to access elements of the array one\
    \ by one. Our counting variable's value, as our loop runs, will range from 0 to\
    \ 25. The index values of our array (because computers start counting at zero)\
    \ also ranges from 0 to 25.\n\n[ 104 ]"
