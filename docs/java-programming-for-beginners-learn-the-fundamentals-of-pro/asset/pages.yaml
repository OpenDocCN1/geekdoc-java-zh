  md: '# XML


    We get started, notice that there''s a whole lot of imports necessary for this
    program. The transform classes we have imported are not necessary for anything
    we''re going to write; I have written a function called PrintXmlDocument(), which
    will print our XML document to the console window if we successfully load it.
    If you''re following along the code in this section, I recommend that you first
    import these transform classes from the start. Then, as you use additional functionality,
    go ahead and use NetBeans'' Fix Imports functionality to see exactly from the
    libraries that we are utilizing, coming from.


    So our goal here is to have an object of the Document class that contains the
    information in our cars.xml file. Once we have this Document object, all we would
    need to do to see in our console window is to call PrintXmlDocument() function
    on the Document instance.


    Unfortunately, creating this Document object is not as simple as the Document
    dom = new Document(); statement. Rather, we need to create it in a structured
    and procedural manner that properly preserve the pars nature of our XML file.
    To do this, we''ll make use of two additional classes: DocumentBuilder and DocumentFactory
    classes.


    The Document class, believe it or not, will take care of the responsibility of
    actually building the document for us. The DocumentBuilder class exists as a separate
    entity from the Document object so that, as programmers, can logically separate
    the methodology we can perform on the document itself and the additional range
    of methodology needed to create that document in the first place. Similar to the
    Document class, we can''t just instantiate the DocumentBuilder class. Instead,
    there''s a third class we''ll utilize to get DocumentBuilder, the DocumentFactory
    class. I have divided the code required to create a Document object, which stores
    our XML file, into three parts:


    +   1. The DocumentFactory class contains a static method newInstance(). Let''s
    add the following call to our first try block in the main() method. This will
    instantiate DocumentBuilderFactory for us to work from:


    ```

    DocumentBuilderFactory factory =

    DocumentBuilderFactory.newInstance();

    ```


    +   2. Once we have DocumentBuilder factory, we can acquire for ourselves a new
    DocumentBuilder object. To do this, we''re going to call the factory''s newDocumentBuilder()
    method. Let''s add it to our try block:


    ```

    Document builder = factory.newDocumentBuilder();

    ```'
