  md: '# Creating a multidimensional array


    Let''s begin by simply declaring and initializing the array we''re going to be
    using. We''ll use an array of characters for this task, giving the white squares
    the character value of W and the black squares the character value of B. Since
    a chessboard is an eight by eight grid, we''re going to declare a two-dimensional
    array of eight arrays, each of which should contain eight characters:


    ```

    char[][] board = new char[8][8];

    ```


    Let''s make things even more difficult for someone to inadvertently break in storing
    the dimensions of our board in a separate location. To do this, simply create
    a variable called boardDim, for board dimensions, assign the value 8, and then
    when we create our arrays. Arrays will be perfectly happy to use an integer in
    a variable to initialize themselves, letting us create dynamically linked arrays
    if our program calls for it. Now, if someone wants to go to this program and scale
    up our chessboard, they need to only change the value of boardDim:


    ```

    int boardDim = 8;

    char[][] board = new char[boardDim][boardDim];

    ```


    In order to assign our squares their proper values, we''re going to loop through
    this array to get each individual node and give it the value we want to have.


    # Using nested loops for multidimensional arrays


    Loops and arrays get along great because arrays always know how long they are,
    but a single for loop doesn''t allow us to meaningfully loop through a two-dimensional
    array. A for loop really just goes in one direction, and our two-dimensional arrays
    have two directions.


    To solve this, we''re going to make use of nested loops for, or a for loop within
    a for loop. Our outer for loop will loop through each array in turn, while the
    job of our inner for loop will be to loop through the nodes that arrays contain.


    A common practice when creating for loops is to use the integer variable i for
    your initial loop, and then j, k, and so on for subsequent loops. However, because
    we''re creating a chessboard, which is an actual object, I''m going to choose
    the value y as our outer loop''s counting variable. This is because our loop is
    doing iterating down the y-axis of our chessboard.'
