    Let''s say for some reason we decided that we must have seven Scanner objects
    in an array. The following statement does not create seven Scanner objects for
    us; it simply sets aside memory space:


    ![](img/c1d82e4914fcde9feba799b8fcf6e983_118_0.png)


    We can create Scanner objects and assign them to these memory spaces, but if we
    try and call one of these memory spaces and use a Scanner-specific function from
    it before we''ve assigned a Scanner object to the memory location, our program
    will crash. We''ll get what''s called NullReferenceException, which means that
    Java asked nothing to behave like a Scanner object.


    # # Multidimensional arrays


    In Java, our basic data structure is the array, which allows us to store sequences
    of light-typed information and access this through a single location in memory.
    Sometimes, however, arrays are unwieldy, and we want to use more strongly organized
    data structures so that they can be easier for humans to understand and write
    programs around. Oftimes, what''s appropriate here is a multidimensional array.


    "Multidimensional array" is a pretty scary-sounding name, but in fact the concept
    behind it is very basic. The question is what happens if we create an array of
    arrays? The following line of code shows the syntax to do just that:


    ```

    char[][] twoDimArr = new char[3][7];

    ```'
