  md: '# Preface


    Whether this is your first foray into high-level object-oriented programming languages
    such as Java, or if you''ve been programming for some time and you''re just looking
    to add Java to your repertoire, or even if you''ve never touched a line of code
    in your life, this book is designed to accommodate you. We''ll move quickly and
    we''ll not shy away from heavy subjects, but we will learn the concepts behind
    object-oriented programming as we go. I will consider the book to be successful
    if it helps you understand Java programming is about, why it is important, and
    how you start developing Java applications in NetBeans. I will be equally happy
    if Java becomes your favorite programming language!


    # This what book covers


    Chapter 1, Getting Started with Java, teaches you what Java is and shows its features.
    We will see the vastness of Java''s application by looking at various fields it
    is used in. We will walk through the steps to install the Java Development Kit.
    We will then set up a development environment called NetBeans for writing Java
    programs, and execute these programs. We''ll also see how to use NetBeans and
    write our first Java program in it. You''ll also learn to use NetBeans to detect
    errors and rectify them.


    Chapter 2, Understanding Typed Variables, shows what variables are and how they
    are important for creating better programs. We''ll look at some of the primitive
    data types of Java, int, long, float, char, and double, in detail. You''ll also
    learn about the String class and two of its manipulation methods.


    Chapter 3, Branching, basically portrays how to work with conditional if...else
    statements, running through complex conditionals using functions such as contains,
    complex, and boolean. We will go through the intricacies of switch, case, and
    break with the help of programs; we''ll also de dive into using loop functionality
    with while...while, and for loops.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Preface


    Chapter 4, Data Structures, discusses arrays and presents an example that prints
    the English alphabet using an array. Then, we''ll take a look at multidimensional
    arrays and write a program that creates a two-dimensional chess board. We''ll
    walk through what ArrayList is and how it enhances the functionality of arrays.
    We''ll write a program using ArrayList with functionality that would have been
    quite difficult to implement using an array. Finally, you''ll learn about Maps
    and implement an example to understand them better.


    Chapter 5, Functions, helps you to start with some of the basic Java functions,
    such as methods, and then move on to understanding advanced Java functions. As
    you become a more experienced programmer, you''ll begin to internalize concepts
    like these and you won''t have to worry about them explicitly when you''re writing
    day-to-day code. Now though, there are some logical shortcuts that we can use
    to keep from getting tripped up.


    Chapter 6, Modeling with Object-Oriented Java, teaches you how to create classes
    and objects in Java. We will also walk through custom classes, member variables,
    and member functions. We will also look into a very special member assigned to
    our custom classes, the constructor, and the Protected method. We also get to
    know how an abstract method works.


    Chapter 7, More Object-Oriented Java, reveals some intricacies of object-oriented
    programming, precisely using the concept of Inheritance, by creating something
    called superclass and subclass, and establishing an is-a relationship between
    them. You''ll learn how to use key aspects such as overriding subclass and superclass
    data, data structures, and the Protected method.


    Chapter 8, Useful Java Classes, presents the Calendar class, which is used to
    work with dates and times. You''ll learn about the String class in detail. We''ll
    also see what exceptions are and how to handle them to make our programs more
    robust. Then, we will walk through the Object class and some of its methods. Finally,
    we''ll take a look at primitive classes in Java.


    Chapter 9, File Input and Output, walks you through the concept of writing and
    reading data files, where we''ll see the usage of the FileWriter and FileReader
    classes and learn to free up resources using the close() method. You''ll also
    learn to catch an exception and handle it. Then, we''ll see how to use the BufferedWriter
    and ever classes to wrap the FileWriter and FileReader classes, respectively.
    Lastly, we''ll talk about one more aspect of I/O, the Serializable class. We will
    analyze what serialization is and its use with respect to serializing and deserializing
    objects.'
  merge: -1
  pgno: 13
