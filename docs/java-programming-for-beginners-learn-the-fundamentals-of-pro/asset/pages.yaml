  md: '# # Getting Started with Java


    Whether this is your first foray into high-level object-oriented programming languages,
    such as Java, or if you''ve been programming for some time and you''re just looking
    to add Java to your repertoire, or even if you''ve never touched a line of code
    in your life, this book is designed to accommodate you. We''re going to move quickly,
    and we''re not going to shy away from heavy subjects; however, we''re going to
    begin this book from the very ground up and learn about the concepts behind object-oriented
    programming as we go.


    In this chapter, we''ll understand what Java is and also look at its features.
    We''ll then follow a step-by-step process to set up a development environment
    to enable us to write and execute Java programs. Once we accomplish this, we''ll
    write our very first Java program and run it. Lastly, we''ll look at what to do
    when we get an error.


    Specifically, we''ll cover the following topics:


    +   * What is Java

    * Features and applications of Java

    * Installing JDK

    * Installing the NetBeans IDE

    * Writing HelloWorld.java

    * NetBeans'' error detection capabilities


    # ## What is Java?


    Java was developed by Sun Microsystems in 1995, but it has stood the test of time
    and remains highly relevant and widely used to this day. So what exactly is Java?
    Java is a high-level, general-purpose object-oriented programming language.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Features of Java


    The following are Java’s main features:


    +   - High level and general purpose: Rather than being created with the intention
    to accomplish one specific task, Java allows us to write computer-readable instructions
    in an open-ended environment. Because it''s not really feasible, or even desirable,
    for every computer system to have its own specialized programming language, the
    vast majority of the code is written in high-level, general-purpose languages
    as Java.

    - Object-oriented: Java is also what we call an object-oriented language. While
    we won''t get into the specifics of objects and classes until a bit later in this
    book, know for now that objects allow us to define modular entities within our
    program that make them more human-readable and much more manageable to create
    large-scale software projects. A firm grasp of object-oriented concepts is absolutely
    essential for any modern software developer.

    - Platform-independent: Lastly, Java was designed with the intention that it be
    a write once, anywhere language. This means if you and I both have systems with
    Java installed and even if our systems are not normally identical--for example,
    I''m on a Windows machine and you''re on a Mac--a Java program on my machine that
    I give to you will still run essentially the same on your machine without the
    need for it to be recompiled.


    ![](img/c1d82e4914fcde9feba799b8fcf6e983_19_0.png)'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Compiling a programming language such as Java is the act of taking the human-readable
    code that we''ve written and converting it into an interpreted machine-friendly
    code. Unfortunately, it''s usually not very friendly for humans to read or write.
    To do this, we use a program called the compiler that translates our code as text
    and converts it into machine code.


    Traditionally, we would have to recompile a program for every system that it was
    going to run on all systems have a different idea of what their machine code should
    look like. Java circumvents this issue by compiling all Java programs to the same
    type of interpreted code bytecode.


    A compiled Java program in bytecode can be run by any system in which Java is
    installed. This is because we install Java on your system, we also install a Java
    virtual machine with it that specific to system. It is this machine''s responsibility
    to convert the bytecode into the final instructions that head to the processor
    in system.


    By making the system''s responsibility to do this final conversion, Java has created
    a write once, run anywhere language where I can hand you a Java program and you
    can run it on your machine while being fairly certain that it''s going to run
    in the same manner that it did on mine. This impressive level of cross-platform
    support on a language as powerful as Java has made it one of the software developing''s
    go-to tools for quite some time.


    # Java applications


    In today''s modern times, Java is used to develop desktop applications, web servers,
    and client-side web applications. It''s the native language of the Android operating
    system, which operates on Android phones and tablets.


    Java has been used to write video games and is sometimes even ported to smaller
    devices without a traditional operating system. It remains a huge player in today''s
    technical world, and I''m looking forward to learning it with you.'
  merge: -1
  pgno: 20
