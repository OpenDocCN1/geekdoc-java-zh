  md: 'Basic GUI Development


    # Adding a button


    The source code for this GUI is so far completely autogenerated. We haven''t touched
    it at all yet; it''s just reflecting the design decisions we''ve made here. Before
    we can start writing backend code to username and password validation, our user
    is going to need a way to tell us they''ve put in a username and password and
    they''d like it to be validated. This seems like an apt job for the powerful button.
    So let''s add a button to our GUI from the Swing Controls menu. We''ll change
    its text to Submit in the Properties option, and the user will need to click on
    this button to submit their information. Now, when the button is clicked, we''d
    like it to perform some programming logic. We want to check the username and password
    fields for this section because we''re learning and doing things simply and easily;
    we''ll just check them against some hardcoded text.


    The question is how we get from GUI to Java code? Generally, we''re going to do
    this through the event-driven programming mode, where the interactions that our
    user has with the GUI define what code is executed and what backend logic occurs.
    Another way to think of this is that we set up pieces of our Java code, or methods,
    to listen for specific GUI-related events to occur and when they do. You''ll notice
    that our GUI components, or controls like our button, have a field under their
    properties Events. These are all the things that could occur in relation to our
    control here. In theory, we could bind each one of these events to a method in
    our Java source, and when a particular event occurs, either because of user interaction
    or other code we wrote, our related Java method would be called.


    # Adding functionality to our button


    Let users click on our button field and perform some coded action, we''re going
    to assign an event handler to our actionPerformed event. If we click on this field,
    we get an option already. Our GUI designer is suggesting we add a handler, namely

    jButton1ActionPerformed. That''s an awful name for a method that''s going to sit
    in our code; jButton is pretty nonsensical. However, it has been chosen because
    it is the variable name assigned to jButton in the Java code:


    ```

