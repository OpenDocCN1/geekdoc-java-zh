  md: "# Importing class libraries\n\nOne thing that's not super human-readable about\
    \ our program is the long paths to functions such as pow() and println(). Is there\
    \ a way we could shorten them? There certainly is. If the makers of Java had wanted\
    \ to, they could have allowed us to call this function by simply typing Math.pow()\
    \ in all instances. This unfortunately would have unintended side effects. For\
    \ example, if there were two libraries linked up to Java and both declared a Math.pow()\
    \ function, Java would not know which one to use. Hence, by default, we're expected\
    \ to link to libraries directly and explicitly.\n\nSo, if we'd like to be able\
    \ to type something like Math.pow(), we can import a library into the local space\
    \ where we're working. We just need to do an import command above our class and\
    \ the main() function declaration. All the import command takes input is the path\
    \ that we'd like Java to look for when it comes across a keyword, such as pow(),\
    \ that it doesn't immediately recognize. In order to allow us to employ the easier\
    \ syntax Math.pow() in our program, we simply need to type import java.lang.Math:\n\
    \n```\n```java\npackage themathlib;\n```\n\n```java\nimport java.lang.Math;\n\n\
    public class TheMathLib {\n    public static void main(String[] args) {\n    \
    \    double number = 4.321;\n        number = java.lang.Math.pow(number, 4.0);\n\
    \        System.out.println(number);\n    }\n}\n```\n```\n\nThere is some special\
    \ syntax for imports. In order to import all the libraries in java.lang To do\
    \ this, we replace .Math with .* which translates to \"import every library from\
    \ the java.lang package.\" I should probably inform you that for of us working\
    \ in NetBeans, this is done by default. However, in this case, we're going to\
    \ do it explicitly because you may have to do this working in other Java environments\
    \ as well.\n\n# Char variables\n\nPrograms that manipulate numbers are all well\
