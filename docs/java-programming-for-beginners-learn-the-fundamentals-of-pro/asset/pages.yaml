  md: "# Branching\n\nOur typical for loop takes three pieces of input. These are\
    \ as follows:\n\n+   1. First, we need to declare the variable that we're going\
    \ to be incrementing or decrementing to count the number of times we've looped.\
    \ In this case, we'll use an integer i and give it an initial value of 1. We follow\
    \ this initial statement with a semicolon. This is not a function call; it's special\
    \ syntax for the for loop.\n2. The second piece of information we specially the\
    \ conditional statement requires us to evaluate each time we're going to restart\
    \ the loop. If this conditional statement is ever not true, then our for loop\
    \ ends and continue resuming our code after the for loop block. In this case,\
    \ our conditional statement will be the same as that for the while loop. We want\
    \ our last iteration of the for loop to be when i is equal to 100, that is, when\
    \ we print out 100. Once i is no longer less than equal to 100, it's time to exit\
    \ our for loop.\n3. Just as the first piece of information we gave the for loop\
    \ saved from having to handle a variable outside the scope of the loop, the last\
    \ piece of information we give the for loop takes the place of having to manually\
    \ increment or decrement our counter inside the scope of the loop. This is the\
    \ special modification code, and whatever we provide the for loop here will run\
    \ at the end of every loop. In this case, we'd just like to increment the value\
    \ of i at the end of each looping through. I think you'll agree that this program\
    \ is much cleaner than our while loop:\n\n```\npackage forloops;\n\npublic class\
    \ Forloops {\n    public static void main(String[] args) {\n        int i=1;\n\
    \        while (i<= 100) {\n            System.out.println(i);\n            i++;\n\
    \        }\n        for(int i=1; i<=100; i++) {\n            System.out.println(i);\n\
    \        }\n    }\n}\n```\n\n[ 96 ]"
