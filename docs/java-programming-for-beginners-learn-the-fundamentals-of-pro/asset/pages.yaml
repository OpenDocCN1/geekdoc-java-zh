  md: "# Branching\n\nNow, we need to provide an if statement to make sure that our\
    \ program doesn't always print out LESS anyway.\n\nWe could use the less operator\
    \ to ask our program to print out LESS whenever the user provides input that is\
    \ less than 10. This would be good in almost all cases, but if our user provides\
    \ the input value 10, our program would not print anything. To fix this, we use\
    \ the less or equal operator to ensure that our program always responds to the\
    \ user input:\n\npackage conditionalstatements;\n\nimport java.util.*;\n\n```\n\
