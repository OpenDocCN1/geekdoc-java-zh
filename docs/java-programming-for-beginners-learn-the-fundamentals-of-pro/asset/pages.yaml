  md: '# Creating a Map


    To begin, I''ve gone ahead and imported java.util where the Map interface lives.
    Next, I''ll get rid of the last two println statements that prints the firstNames
    and lastNames arrays. Instead, at this point in code, we our firstNames and lastNames
