  md: "# Modeling with Object-Oriented Java\n\nHowever, there's a system in place\
    \ for us to protect our classes, if we choose to, having their members modified\
    \ without going through a proper protocol. Let's say that we'd like to change\
    \ our Person class so that the only time these members are ever changed is once\
    \ at the very beginning when the constructor calls. If you remember, we've been\
    \ tagging all the members of our classes with this public protection tag. Something\
    \ that's tagged public is basically viewable any piece of our program has access\
    \ to its container.\n\nHowever, we can use a couple of other protection tags.\
    \ If we were to tag all our member variables private, then they would be viewable\
    \ within the context of their current class. So, we could still use the member\
    \ variables in our Person constructor and in our fullName and age methods, but\
    \ when we attempt to access lastName outside of the actual class declaration,\
    \ it would be invalid:\n\n```\npackage gettingobjectoriented;\n\nimport java.util.*;\n\
    \npublic class Person {\n    private String firstName;\n    private String lastName;\n\
    \    private Calendar birthday;\n```\n\nWe can tag members private and then create\
    \ public methods to modify their values when appropriate. By doing so, we will\
    \ protect our objects from ever being given invalid values.\n\n# Types of constructors\n\
    \nNow, let's go back to talking about constructors before we wrap up. As with\
    \ normal methods, we can override constructors and have more than one option for\
    \ our programmer to choose from.\n\nFor example, let's say that in our program,\
    \ we want to create new people who have just been born. In this instance, it make\
    \ a lot of sense for us to construct a person by simply giving firstName and lastName\
    \ to our constructor and then having birthday as new Gregorian Calendar, which\
    \ will default to today's date:\n\n```\npackage gettingobjectoriented;\n\nimport\
    \ java.util.*;\n\npublic class Person {\n    private String firstName;\n    private\
    \ String lastName;\n```"
