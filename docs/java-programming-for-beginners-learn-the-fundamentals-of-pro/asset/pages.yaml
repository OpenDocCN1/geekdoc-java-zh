  md: "# Understanding Typed Variables\n\nThis is because String, unlike char, is\
    \ not a primitive type. String is what we call a class. Classes are the backbone\
    \ of object-oriented programming. Just as we can declare variables of a primitive\
    \ type, we can also declare variables of a class, which are called instances.\
    \ In our program, the variable is an instance of the String class. Unlike variables\
    \ of primitive types, instances of a class can contain their own special methodologies\
    \ and functions declared by the class which they are. In this section, we will\
    \ use some of these string-specific methods and functions to manipulate text.\n\
    \nBut first, let's take a look at what makes the String so special. As we know,\
    \ we can pretty much use our character variables and our characters interchangeably,\
    \ as we can with just any other primitive type. The String class also maps interchangeably\
    \ with the string literal, which is like a character literal but uses double quotation\
    \ marks and can contain many or no characters at all. Java classes do not map\
    \ to any sort of literal, and our ability to manipulate string literals through\
    \ the String class is what makes it so valuable.\n\n# The concatenation operator\n\
    \nAnother thing strings can do, which most Java classes cannot, is use of the\
    \ addition sign (+) operator. If we declare three strings (s1, s2, and s3), we\
    \ can set the value of our third string to one string plus another string. We\
    \ can even add a string literal into the mix. Then, we print s3:\n\n```\npackage\
    \ stringsinjava;\npublic class StringsInJava {\n    public static void main(String[]\
    \ args) {\n        char c = 'c';\n        String s1 = \"stringone\";\n       \
    \ String s2 = \"stringtwo\";\n        String s3 = s1+s2+\"LIT\";\n        System.out.println(s3);\n\
    \    }\n}\n```"
