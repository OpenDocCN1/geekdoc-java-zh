  md: "# Complex conditional statements\n\nIf we want to check and see whether our\
    \ input string contains both the strings, namely sOne and sTwo? There's a couple\
    \ of ways to do this, and we'll take a look at some others. But frankly, the simplest\
    \ way for our purposes is to use a complex conditional on the if input.contains(sOne)\
    \ line. Java allows us to evaluate multiple true or false statements, or Boolean\
    \ objects, at once using the && or the | operator. The && operator gives us a\
    \ true when all conditionals are compared with the && operator have evaluated\
    \ to true. The | operator gives us a true result when any of the conditionals\
    \ evaluate. In our case, we want to know whether our input string contains the\
    \ contents of sOne and sTwo, so we're going to use the && operator. This operator\
    \ works by simply providing two conditional statements on either side of it. So,\
    \ we're going to run our input.contains function on both these functions on either\
    \ side of the (input.contains(sOne) && input.contains(sTwo)), evaluate to true,\
    \ our conditional statement will be true as well:\n\n```\npackage complexconditionals;\n\
    ```\n\n```\nimport java.util.*;\n```\n\n```\npublic class ComplexConditionals\
    \ {\n    public static void main(String[] args) {\n        Scanner reader = new\
    \ Scanner(System.in);\n        String input = reader.next();\n        String sOne\
    \ = \"abc\";\n        String sTwo = \"z\";\n        if (input.contains(sOne))\
    \ {\n            System.out.println(\"TRUE\");\n        } else {\n           \
    \ System.out.println(\"FALSE\");\n        }\n    }\n}\n```"
