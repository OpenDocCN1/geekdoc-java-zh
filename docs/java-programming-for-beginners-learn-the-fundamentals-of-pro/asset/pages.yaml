  md: "XML\nNow our main() method will look as follows:\n\n```\npublic static void\
    \ main(String[] args) {\n    File xmlFile = new File(\"cars.xml\");\n    Document\
    \ dom = LoadXMLDocument(xmlFile);\n    NodeList owners = dom.getElementsByTagName(\"\
    owner\");\n    for (int i = 0; i < owners.getLength(); i++) {\n        Element\
    \ owner = (Element) owners.item(i);\n        owner.setAttribute(\"name\", \"Mike\"\
    );\n    }\n    WriteXMLDocument(dom, xmlFile);\n}\n```\n\nWhen we run our program\
    \ and check our XML file, we will see that Mike is now the owner of all these\
    \ cars are shown in the following screenshot:\n\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\" standalone=\"no\"?>\n<owner name=\"Mike\">\n  <car vin=\"LJPCCXX1100237\"\
    >\n    <make>Ford</make>\n    <model>Fusion</model>\n    <year>2014</year>\n \
    \   <color>Blue</color>\n  </car>\n  <car vin=\"LGHIALCX89880011\">\n    <make>Toyota</make>\n\
    \    <model>Tacoma</model>\n    <year>2013</year>\n    <color>Green</color>\n\
    \  </car>\n  <car vin=\"GJSIALSS2200567\">\n    <make>Dodge</make>\n    <model>Charger</model>\n\
    \    <year>2013</year>\n    <color>Red</color>\n  </car>\n</owner>\n<owner name=\"\
    Mike\">\n\n[ 294 ]"
  merge: -1
