- "# Learn Apache ANT [Java 技术]\n\n\n\n\n\n\n我想将这本书献给将使用这本书的学生们。祝你们未来职业成功，并希望你们永停止学习。\n\
  \n\n# 引言\n\nANT 代表 **Another Neat**（另一个简洁）工具。它是来自计算机软件开发公司 Apache 的基于 Java 的构建工具。在进入\
  \ Apache Ant 的细节之前，让我们先了解为什么我们需要构建工具。\n\n## 构建工具的必要性\n\n平均而言，开发者花费大量时间在构建和部署等琐碎任务上，包括：\n\
  \n- 编译代码\n- 打包二进制文件\n- 将二进制文件部署到测试服务器\n- 测试更改\n- 将代码从一个位置复制到另一个位置\n\n为了自动化和简化上述任务，Apache\
  \ Ant 非常有用。它是一个操作系统的构建和部署工具，可以从命令行执行。\n\n## Apache Ant 的历史\n\nAnt 是由软件开发者 James\
  \ Duncan Davidson 创建的，他也是 Web 服务器应用 Tomcat 的原始创建者。\n\nAnt 最初用于构建 Tomcat，并作为 Tomcat\
  \ 分发的一部分被打包。\n\n它的诞生是为了解决 Apache Make 工具相关的问题和复杂性。\n\n它在 2000 年作为 Apache 的独立项目被推广。截至\
  \ 2020 年 9 月，Apache Ant 的最新版本为 **1.10.9**。\n\n## Apache Ant 的特性\n\nApache Ant 的特性列举如下：\n\
  \n- 它是可用的最完整的 Java 构建和部署工具。\n- 它是平台中性的，可以处理平台特定的属性，例如文件分隔符。\n- 它可以执行平台特定的任务，例如使用\
  \ `touch` 命令修改文件的修改时间。\n- Ant 脚本使用纯 XML 编写。如果你已经熟悉 XML，你就可以很快学会 Ant。\n- Ant 擅长自动化处理复杂的重复性任务。\n\
  - Ant 带有一个大量的预定义任务列表。\n- Ant 提供了一个开发自定义任务的接口。\n- Ant 可以从命令行轻松调用，并可以与免费和商业 IDE 集成。\n\
  \n# 环境搭建\n\nApache Ant 根据 Apache Software License 进行分发，这是一项由开源倡议认证的完全开源许可。\n\n最新的\
  \ Apache Ant 版本（包括其完整源代码、类文件和文档）可以在 [`ant.apache.org`](https://ant.apache.org/)\
  \ 找到。\n\n## 安装 Apache Ant\n\n假设你已经在计算机上下载并安装了 Java 开发工具包 (JDK)。如果没有，请遵循 `file:///C:/java/java_environment_setup.htm`\
  \ 提供的说明。\n\n- 确保环境变量 `JAVA_HOME` 设置为 JDK 安装所在的文件夹。\n- 从 [`ant.apache.org`](https://ant.apache.org/)\
  \ 下载二进制文件。\n- 使用 Winzip、winRAR、7-zip 或类似的工具将 zip 文件解压到方便的位置 `c:\\folder`。\n- 创建一个名为\
  \ `ANT_HOME` 的新环境变量，指向 Ant 安装文件夹。在这种情况下，它是 `c:\\apache-ant-1.10.9-bin` 文件夹。\n- 将\
  \ Apache Ant 批处理路径添加到 `PATH` 环境变量中。在我们的案例中，这将是 `c:\\apache-ant-1.10.9-bin` 文件夹。\n\
  \n## 验证安装\n\n要验证 Ant 是否安装成功，在命令提示符上输入 `ant`。你应该看到下面的输出：\n\n```\nAnt(TM) version\
  \ 1.10.9 compiled on September 27 2020\n```\n\n## 安装 Eclipse\n\n教程还涵盖了 Ant 与 Eclipse\
  \ 开发环境 (IDE) 的集成。\n\n### 安装 Eclipse 的步骤\n\n- 从 [www.eclipse.org](https://www.eclipse.org/)\
  \ 下载最新的二进制文件。\n- 将二进制文件解压到方便的位置，例如 `c:\\folder`。\n- 运行 `eclipse.exe`。\n\n# 构建文件\n\
  \n通常 Ant 的构建文件 `build.xml` 位于项目根目录。然而，文件名或位置没有限制。对于本次练习，创建一个名为 `build.xml` 的文件，内容如下：\n\
  \n```xml\n<?xml version=\"1.0\"?>\n<project name=\"Hello World\" default=\"info\"\
  >\n  <target name=\"info\">\n    <echo>Hello - Welcome to Ant!</echo>\n  </target>\n\
  </project>\n```\n\n注意声明之前不应该有空行。如果你允许，执行 ant 时会出现以下错误：\n`The processing instruction\
  \ target matching is not allowed.`\n\n所有构建文件都需要 `project` 元素和至少一个 `target` 元素。\n\
  \nXML `project` 元素有三个属性：\n\n| 序序号 | 属性与描述 |\n| :--- | :--- |\n| 1 | `name`: 项目名称（可选）。\
  \ |\n| 2 | `default`: 构建脚本的默认目标。项目可以包含任意目标。此属性指定哪个目标应被视为默认目标（强制）。 |\n| 3 | `basedir`:\
  \ 项目的基础目录或根文件夹（可选）。 |\n\n目标（target）是你想要作为一个单元运行的任务集合。在我们的示例中，我们有一个简单的目标来向用户提供信息。\n\
  \n目标可以依赖于其他目标。例如，`deploy` 目标可能依赖 `package` 目标，`package` 目标可能依赖 `compile` 目标，依此类推。依赖关系使用\
  \ `depends` 属性表示。\n\n例如：\n\n```xml\n<target name=\"deploy\" depends=\"package\"\
  >\n</target>\n<target name=\"package\" depends=\"clean,compile\">\n</target>\n<target\
  \ name=\"clean\">\n</target>\n<target name=\"compile\">\n</target>\n```\n\n`target`\
  \ 元素具有以下属性：\n\n| 序序号 | 属性与描述 |\n| :--- | :--- |\n| 1 | `name`: 目标的名称（强制）。 |\n| 2\
  \ | `depends`: 此目标依赖的所有目标的逗号分隔列表（可选）。 |\n| 3 | `description`: 目标的简短描述（可选）。 |\n|\
  \ 4 | `if`: 根据条件属性的真值允许执行目标（可选）。 |\n| 5 | `unless`: 将目标添加到指定扩展点的依赖列表中。扩展点与目标类似，但它包含任何任务（可选）。\
  \ |\n\n上述示例中的 `echo` 任务是一个打印消息的简单任务。在我们的示例中，它打印了消息 **Hello World**。\n\n\n\n\n\n\
  要运行 ant 构建文件，请打开命令提示符并导航到 `build.xml` 所在的文件夹，然后输入 `ant info`。你也可以直接输入 `ant`。两种方法都可以生效，因为\
  \ `info` 是构建文件中的默认目标（target）。\n\n你应该看到如下输出：\n\n```\nC:\\>ant\nBuildfile: C:\\build.xml\n\
  info: [echo] Hello World - Welcome to Apache Ant!\nBUILD SUCCESSFUL\nTotal time:\
  \ 0 seconds\nC:\\>\n```\n\n# 属性任务 (Property Task)\n\nAnt 构建文件是用 XML 编写的，它不允许像你最喜爱的编程语言那样声明变量。然而，正如你可能想象的那样，如果\
  \ Ant 允许声明如项目名称、项目源码目录等变量，将会非常有用。\n\nAnt 使用 `property` 元素允许你指定属性。这允许属性从一个构建到另一个构建或从一个环境到另一个环境更改。\n\
  \n## Ant 属性 (Ant Properties)\n\n默认情况下，Ant 提供了以下预定义的属性，可以在构建文件中使用：\n\n| 序号 | 属性与描述\
  \ |\n| :--- | :--- |\n| 1 | `ant.file` - 构建文件的完整位置。 |\n| 2 | `ant.version` - Apache\
  \ Ant 安装的版本。 |\n| 3 | `basedir` - 构建的根目录，由项目元素中 `basedir` 属性指定。 |\n| 4 | `ant.java.version`\
  \ - Ant 使用的 JDK 版本。 |\n| 5 | `ant.project.name` - 项目的名称，由项目元素中 `name` 属性指定。 |\n\
  | 6 | `ant.project.default-target` - 当前项目的默认目标。 |\n| 7 | `ant.project.invoked-targets`\
  \ - 当前项目中被调用的目标的逗号分隔列表。 |\n| 8 | `ant.core.lib` - Ant jar 文件的完整位置。 |\n| 9 | `ant.home`\
  \ - Ant 安装的根目录。 |\n| 10 | `ant.library.dir` - Ant 库文件的根目录 - 通常是 `ANT_HOME/lib` 文件夹。\
  \ |\n\nAnt 还提供了系统属性（例如：`file.separator`）供构建文件使用。\n\n除了上述属性，用户可以使用 `property` 元素定义额外的属性。\n\
  \n以下示例展示了如何定义一个名为 `sitename` 的属性：\n\n```xml\n<? xml version = \"1.0\" ?>\n<project\
  \ name = \"Hello World Project\" default = \"info\" >\n  <property name = \"sitename\"\
  \ value = \"www.tutorialspoint.com\" />\n  <target name = \"info\" >\n    <echo>\
  \ Apache Ant version is ${ant.version} - You are at ${sitename} </echo>\n  </target>\n\
  </project>\n```\n\n在上述构建文件运行 Ant 会产生如下输出：\n\n```\nC:\\>ant\nBuildfile: C:\\build.xml\n\
  info: [echo] Apache Ant version is Apache Ant(TM) version 1.10.9\ncompiled on September\
  \ 27 2020 - You are at www.tutorialspoint.com\nBUILD SUCCESSFUL\nTotal time: 0 seconds\n\
  C:\\>\n```\n\n# 属性文件 (Property Files)\n\n如果你只需要少数几个属性，直接在构建文件中设置属性是可以的。但对于大型项目，将属性存储在单独的属性文件中是有意义的。\n\
  \n## 处处 (Benefits)\n\n将属性存储在单独文件中具有以下优点：\n\n*   它允许你重用同一个构建文件，针对不同的执行环境使用不同的属性设置。例如，可以为\
  \ DEV、TEST 和 PROD 环境单独维护构建属性文件。\n*   当你事先不知道某个属性（在特定环境中）的值时，它是很有用的。这允许你在已知属性值的其他环境中执行构建。\n\
  \n这虽然没有硬性规定，但通常属性文件被命名为 `build.properties` 并放置在 `build.xml` 文件旁边。你可以根据部署环境创建多个构建属性文件\
  \ - 例如 `build.properties.dev` 和 `build.properties.test`。\n\n构建属性文件的内容与普通的 Java 属性文件相似。每行包含一个属性。每个属性由一个名称和值对表示。\n\
  \n名称和值对由等号（`=`）分隔。强烈建议对属性进行适当的注释。注释使用井号（`#`）列出。\n\n以下示例展示了一个 `build.xml` 文件及其关联的\
  \ `build.properties` 文件：\n\n### build.xml\n\n下面是 `build.xml` 文件的示例：\n\n```xml\n\
  <? xml version = \"1.0\" ?>\n<project name = \"Hello World Project\" default = \"\
  info\" >\n  <property file = \"build.properties\" />\n  <target name = \"info\"\
  \ >\n    <echo> Apache Ant version is ${ant.version} - You are at ${sitename} </echo>\n\
  \  </target>\n</project>\n```\n\n### build.properties\n\n下面是 `build.properties`\
  \ 文件的示例：\n\n```properties\n# The Site Name\nsitename=www.tutorialspoint.com\nbuildversion=3.3.2\n\
  ```\n\n在上述示例中，`sitename` 是一个映射到网站名称的自定义属性。你可以以此方式声明任意数量的自定义属性。\n\n另一个列出的自定义属性是 `buildversion`。\n\
  \n除了上述的，Ant 还提供了许多预定义的属性，如下：\n\n# 数据类型 (Data Types)\n\nAnt 提供了许多数据类型。\n\n| 序号 |\
  \ 属性与描述 |\n| :--- | :--- |\n| 1 | `ant.file` - 构建文件的完整位置。 |\n| 2 | `ant.version`\
  \ - Apache Ant 安装的版本。 |\n| 3 | `basedir` - 构建的根目录，由项目元素中 `basedir` 属性指定。 |\n| 4\
  \ | `ant.java.version` - Ant 使用的 JDK 版本。 |\n| 5 | `ant.project.name` - 项目的名称，由项目元素中\
  \ `name` 属性指定。 |\n| 6 | `ant.project.default-target` - 当前项目的默认目标。 |\n| 7 | `ant.project.invoked-targets`\
  \ - 当前项目中被调用的目标的逗号分隔列表。 |\n| 8 | `ant.core.lib` - Ant jar 文件的完整位置。 |\n| 9 | `ant.home`\
  \ - Ant 安装的根目录。 |\n| 10 | `ant.library.dir` - Ant 库文件的根目录 - 通常是 `ANT_HOME/lib` 文件夹。\
  \ |\n\nAnt 提供了许多数据类型。不要将“数据类型”一词与编程语言中的类型混淆。\n\n## Ant 中的数据类型\n\nAnt 提供以下数据类型：\n\
  \n### 文件集 (Fileset)\n\n`fileset` 数据类型表示文件的集合。它用于根据特定模式包含或排除文件。\n\n例如，参考以下代码。此处 `src`\
  \ 属性指向源文件夹。\n\n```xml\n<fileset dir=\"${src}\" casesensitive=\"yes\">\n  <include\
  \ name=\"*.java\" />\n  <exclude name=\"*Stub*\" />\n</fileset>\n```\n\n`fileset`\
  \ 选择源文件夹中所有的 `.java` 文件，但包含“Stub”的文件。大小敏感过滤器应用于文件集，这意味着名为 `Samplestub.java` 的文件不会被排除。\n\
  \n### 模式集 (Pattern set)\n\n`pattern set` 允许根据某些模式轻松过滤文件或文件夹。可以使用以下元字符创建模式：\n\n*\
  \   `?` - 匹配一个字符。\n*   `*` - 匹配零或多个字符。\n*   `**` - 递归匹配零或多个目录。\n\n下面的示例描述了模式集的用法：\n\
  \n```xml\n<patternset id=\"java.files.without_stubs\">\n  <include name=\"src/**/*.java\"\
  \ />\n  <exclude name=\"src/**/*Stub*\" />\n</patternset>\n```\n\n随后，`patternset`\
  \ 可以如下重用在 `fileset` 中：\n\n```xml\n<fileset dir=\"${src}\" casesensitive=\"yes\"\
  >\n  <patternset refid=\"java.files.without_stubs\" />\n</fileset>\n```\n\n### 文件列表\
  \ (File list)\n\n`filelist` 数据类型与 `fileset` 相似，但有以下不同：\n\n*   它包含显式命的文件列表，不支持通配符。\n\
  *   该数据类型可以应用于存在或不存在的文件。\n\n\n\n\n让我们来看 `filelist` 数据类型的后续示例。在这里，属性 `webapp.src.folder`\
  \ 指向项目的 Web 应用源码文件夹。\n\n```xml\n<filelist id=\"config.files\" dir=\"${webapp.src.folder}\"\
  \ >\n  <file name=\"applicationConfig.xml\" />\n  <file name=\"faces-config.xml\"\
  \ />\n  <file name=\"web.xml\" />\n  <file name=\"portlet.xml\" />\n</filelist>\n\
  ```\n\n### 过滤器集 (Filter set)\n\n通过结合 `copy` 使用 `filterset` 数据类型，可以将所有文件中匹配模式的某些文本替换为替换值。\n\
  \n一个常见的示例是在发布日志文件中附加版本号，如下所示。\n\n```xml\n<copy todir=\"${output.dir}\" >\n  <fileset\
  \ dir=\"${releasenotes.dir}\" includes=\"**/*.txt\" />\n  <filterset>\n    <filter\
  \ token=\"VERSION\" value=\"${current.version}\" />\n  </filterset>\n</copy>\n```\n\
  \n在上述代码中 −\n\n*   属性 `output.dir` 指向项目的输出文件夹。\n*   属性 `releasenotes.dir` 指向项目的发布日志文件夹。\n\
  *   属性 `current.version` 指向项目的当前版本文件夹。\n*   `copy` 任务正如其名，用于将文件从一个位置复制到另一个位置。\n\n\
  ### 路径 (Path)\n\n`path` 数据类型通常用于表示类路径（class-path）。path 中的条目使用分号或冒号分隔。然而，这些字符在运行时会被执行系统的路径分隔符所替换。\n\
  \n类路径被设置为项目中 jar 文件和类的列表，如下例所示。\n\n```xml\n<path id=\"build.classpath.jar\" >\n\
  \  <pathelement path=\"${env.J2EE_HOME}/${j2ee.jar}\" />\n  <fileset dir=\"lib\"\
  \ >\n    <include name=\"**/*.jar\" />\n  </fileset>\n</path>\n```\n\n在上述提供的代码中\
  \ −\n\n*   属性 `env.J2EE_HOME` 指向环境变量 `J2EE_HOME`。\n*   属性 `j2ee.jar` 指向 J2EE 基础目录下\
  \ J2EE jar 文件的文件名。\n\n# 构建项目 (Building Projects)\n\n既然我们已经学习了 Ant 中的数据类型，现在是时候将知识付诸实践了。在本章中我们将构建一个项目。本章的目标是构建一个\
  \ Ant 文件，编译 Java 类并将它们放在 `WEB-INF\\classes` 文件夹中。\n\n考虑以下项目结构 −\n\n*   数据库脚本存储在\
  \ `db` 文件夹中。\n*   Java 源代码存储在 `src` 文件夹中。\n*   图像、js、META-INF、样式（css）存储在 `war` 文件夹中。\n\
  *   Java 页面（JSPs）存储在 `jsp` 文件夹中。\n*   第三方 jar 文件存储在 `lib` 文件夹中。\n*   Java 类文件存储在\
  \ `WEB-INF\\classes` 文件夹中。\n\n该项目将作为教程后续部分的 `Hello World` Fax 应用程序。\n\n```\nC:\\\
  work\\FaxWebApplication>tree\nFolder PATH listing\nVolume serial number is 00740061\
  \ EC1C:ADB1\nC:.\n+---db\n+---src\n. +---faxapp\n. +---dao\n. +---entity\n. +---util\n\
  . +---web\n+---war\n+---images\n+---js\n+---META-INF\n+---styles\n+---WEB-INF\n\
  +---classes\n+---jsp\n+---lib\n```\n\n这是该项目所需的 `build.xml`。让我们逐部分考虑它。\n\n```xml\n\
  <?xml version=\"1.0\" ?>\n<project name=\"fax\" basedir=\".\" default=\"build\"\
  \ >\n  <property name=\"src.dir\" value=\"src\" />\n  <property name=\"web.dir\"\
  \ value=\"war\" />\n  <property name=\"build.dir\" value=\"${web.dir}/WEB-INF/classes\"\
  \ />\n  <property name=\"name\" value=\"fax\" />\n  <path id=\"master-classpath\"\
  \ >\n    <fileset dir=\"${web.dir}/WEB-INF/lib\" >\n      <include name=\"*.jar\"\
  \ />\n    </fileset>\n    <pathelement path=\"${build.dir}\" />\n  </path>\n  <target\
  \ name=\"build\" description=\"Compile source tree java files\" >\n    <mkdir dir=\"\
  ${build.dir}\" />\n    <javac destdir=\"${build.dir}\" source=\"1.5\" target=\"\
  1.5\" >\n      <src path=\"${src.dir}\" />\n      <classpath refid=\"master-classpath\"\
  \ />\n    </javac>\n  </target>\n  <target name=\"clean\" description=\"Clean output\
  \ directories\" >\n    <delete>\n      <fileset dir=\"${build.dir}\" >\n       \
  \ <include name=\"**/*.class\" />\n      </fileset>\n    </delete>\n  </target>\n\
  </project>\n```\n\n首先，让我们声明一些属性。\n\n```xml\n<property name=\"src.dir\" value=\"\
  src\"/>\n<property name=\"web.dir\" value=\"war\"/>\n<property name=\"build.dir\"\
  \ value=\"${web.dir}/WEB-INF/classes\"/>\n```\n\n在上述代码中 −\n\n*   `src.dir` 指向源码文件夹。\n\
  *   `web.dir` 指向 web 文件夹。\n*   `build.dir` 指向输出文件夹。\n*   `src.dir` 指向源码文件夹。\n* \
  \  `web.dir` 指向 web 文件夹。\n*   `build.dir` 指向输出文件夹。\n*   `src.dir` 指向源码文件夹。\n*  \
  \ `web.dir` 指向 web 文件夹。\n*   `build.dir` 指向输出文件夹。\n*   `src.dir` 指向源码文件夹。\n*   `web.dir`\
  \ 指向 web 文件夹。\n*   `build.dir` 指向输出文件夹。\n*   `src.dir` 指向源码文件夹。\n*   `web.dir` 指向\
  \ web 文件夹。\n*   `build.dir` 指向输出文件夹。\n*   `src.dir` 指向源码文件夹。\n*   `web.dir` 指向 web\
  \ 文件夹。\n*   `build.dir` 指向输出文件夹。\n*   `src.dir` 指向源码文件夹。\n*   `web.dir` 指向 web 文件夹。\n\
  *   `build.dir` 指向输出文件夹。\n*   `src.dir` 指向源码文件夹。\n*   `web.dir` 指向 web 文件夹。\n* \
  \  `build.dir` 指向输出文件夹。\n*   `src.dir` 指向源码文件夹。\n*   `web.dir` 指向 web 文件夹。\n*  \
  \ `build.dir` 指向输出文件夹。\n*   `src.dir` 指向源码文件夹。\n*   `web.dir` 指向 web 文件夹。\n*   `build.dir`\
