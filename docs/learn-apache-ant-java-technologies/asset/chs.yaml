  \ `private`、`public`、`package` 和 `protected` 属性来实现。\n\n你还可以通过相应的属性告诉 javadoc 任务包含作者和版本信息。\n\
  \n你还可以使用 `group` 属性将包分组，以便于导航。\n\n## 整合在一起\n\n让我们继续 `Hello world` Fax 应用程序主题，并为我们的\
  \ Fax 应用程序项目添加一个文档目标（target）。\n\n下面是我们在项目中使用的一个 javadoc 任务示例。在这个示例中，我们指定 javadoc\
  \ 使用 `src.dir` 作为源目录，并将 `doc` 作为目标目录。\n\n我们还自定义了出现在 Java 文档页面上的窗口标题、页眉和页脚信息。\n\n\
  此外，我们还创建了三个组：\n\n*   一个用于源文件夹中的工具类，\n*   一个用于用户界面类，\n*   一个用于与数据库相关的类。\n\n你可能会注意到，数据包组有两个包——`faxapp.entity`\
  \ 和 `faxapp.dao`。\n\n```\n<target name = \"generate-javadoc\" >\n<javadoc packagenames\
  \ = \"faxapp.*\" sourcepath = \"${src.dir}\"\ndestdir = \"doc\" version = \"true\"\
  \ windowtitle = \"Fax Application\" >\n<doctitle> <![CDATA[= Fax Application =]]>\
  \ </doctitle>\n<bottom>\n<![CDATA[Copyright © 2011\\. All Rights Reserved.]]>\n\
  </bottom>\n<group title = \"util packages\" packages = \"faxapp.util.*\" />\n<group\
  \ title = \"web packages\" packages = \"faxapp.web.*\" />\n<group title = \"data\
  \ packages\" packages = \"faxapp.entity.*:faxapp.dao.*\" />\n</javadoc>\n<echo message\
  \ = \"java doc has been generated!\" />\n</target>\n```\n\n让我们执行 javadoc Ant 任务。它会生成\
  \ Java 文档文件并放在 `doc` 文件夹中。\n\n当执行 `javadoc target` 时，它会产生以下结果：\n\n```\nC : \\>ant\
  \ generate - javadoc\nBuildfile : C : \\build . xml\njava doc has been generated\
  \ !\nBUILD SUCCESSFUL\nTotal time : 10.63 second\n```\n\nJava 文档文件现在存在于 `doc` 文件夹中。\n\
  \n通常，javadoc 文件是在发布（release）或打包（package）目标的一部分。\n\n## 创建 JAR 文件\n\n在编译 Java 源文件之后的下一个逻辑步骤是构建\
  \ Java 归档，即 Java 归档（JAR）文件。使用 Ant 的 `jar` 任务创建 JAR 文件非常简单。\n\n## 属性\n\n`jar` 任务常用的属性如下：\n\
  \n| 序号 | 属性与描述 |\n| :--- | :--- |\n| 1 | basedir: 输出 JAR 文件的基础目录。默认情况下，它设置为项目的根目录。\
  \ |\n| 2 | compress: 建议 Ant 在创建 JAR 文件时压缩文件。 |\n| 3 | keepcompression: 虽然 `compress`\
  \ 属性适用于单个文件，但 `keepcompression` 属性执行相同的操作，只不过它适用于整个归档。 |\n| 4 | destfile: 输出 JAR\
  \ 文件的名称。 |\n| 5 | duplicate: 建议 Ant 在发现重复文件时采取的操作。你可以添加、保留或在遇到重复文件时失败。 |\n| 6 |\
  \ excludes: 建议 Ant 不要将此逗号分隔的文件列表包含在包中。 |\n| 7 | excludesfile: 与上述相同，但排除的文件使用模式指定。\
  \ |\n| 8 | inlcudes: `excludes` 的反反。 |\n| 9 | includesfile: `excludesfile` 的反反。\
  \ |\n| 10 | update: 建议 Ant 覆盖已构建的 JAR 文件中的文件。 |\n\n继续我们的 `Hello World` Fax 应用程序项目，让我们添加一个新目标来生成\
  \ jar 文件。\n\n在此之前，让我们考虑下面提供的 `jar` 任务。\n\n```\n<jar destfile = \"${web.dir}/lib/util.jar\"\
  \nbasedir = \"${build.dir}/classes\"\nincludes = \"faxapp/util/**\"\nexcludes =\
  \ \"**/Test.class\"\n/>\n```\n\n在这里，`web.dir` 属性指向 Web 源文件的路径。在我们的案例中，这是 `util.jar`\
  \ 放置的地方。\n\n示例中的 `build.dir` 属性指向构建文件夹，可以在那里找到用于 `util.jar` 的类文件。\n\n在这个示例中，我们使用来自\
  \ `faxapp.util.*` 包的类创建一个名为 `util.jar` 的 jar 文件。然而，我们排除了以 `Test` 命名的类。输出的 jar 文件将放在\
  \ web 应用程序的 lib 文件夹中。\n\n如果我们想让 `util.jar` 可可执行 jar 文件，我们需要添加带有 `Main-Class` 元属性的\
  \ `manifest`。\n\n因此，上面的示例将更新如下：\n\n```\n<jar destfile=\"${web.dir}/lib/util.jar\"\
  \nbasedir=\"${build.dir}/classes\"\nincludes=\"faxapp/util/**\"\nexcludes=\"**/Test.class\"\
  \ class=\"ts\"\n<manifest class=\"ts\">\n<attribute name=\"Main-Class\" value=\"\
  com.example.Main\"/>\n</manifest>\n``` （等待，原文中的 XML 不完整，此处保持了提供的结构）\n\n让我们执行 javadoc\
  \ Ant 任务。它生成并把 Java 文档文件放在 `doc` 文件夹中。\n\n当执行 `javadoc target` 时，它会产生以下结果：\n\n```\n\
  C : \\>ant generate - javadoc\nBuildfile : C : \\build . xml\njava doc has been\
  \ generated !\nBUILD SUCCESSFUL\nTotal time : 10.63 second\n```\n\nJava 文档文件现在存在于\
  \ `doc` 文件夹中。\n\n\n\n\n\n完全可以嵌套类、`lib`、`metainf` 和 `webinf` 目录，使它们存在于项目结构中任何位置的分散文件夹中。但是，最佳实践建议你的\
  \ Web 项目的 Web 内容结构应该类似于 WAR 文件的结构。Fax Application 项目根据这一基本原则概述了其结构。\n\n要执行 `war`\
  \ 任务，请将其封装在一个目标内部（最常见的是 `build` 或 `package` 目标），并运行它们。\n\n```xml\n<target name=\"\
  build-war\" >\n  <war destfile=\"fax.war\" webxml=\"${web.dir}/web.xml\" >\n   \
  \ <fileset dir=\"${web.dir}/WebContent\" >\n      <include name=\"**/*.*\" />\n\
  \    </fileset>\n    <lib dir=\"thirdpartyjars\" >\n      <exclude name=\"portlet.jar\"\
  \ />\n    </lib>\n    <classes dir=\"${build.dir}/web\" />\n  </war>\n</target>\n\
  ```\n\n在此文件上运行 `Ant` 将为我们创建 `fax.war` 文件。\n\n以下是运行 Ant 文件的结果如下：\n\n```\nC : \\>ant\
  \ build - war\nBuildfile : C : \\build . xml\nBUILD SUCCESSFUL\nTotal time : 12.3\
  \ seconds\n```\n\n`fax.war` 文件现在被放置在输出文件夹中。war 文件的内容将所示：\n\n`fax.war`:\n\n+---jsp\
  \ 此文件夹包含 jsp 文件\n+---css 此文件夹包含样式表文件\n+---js 此文件夹包含 javascript 文件\n+---images 此文件夹包含图像文件\n\
  +---META-INF 此文件夹包含 Manifest.Mf\n+---WEB-INF\n+---classes 此文件夹包含编译后的类\n+---lib 第三方库和工具用\
  \ jar 文件\n`WEB.xml` 定义 WAR 包的配置文件\n\n# 应用程序打包\n\n我们已经通过 `Hello World` Fax web 应用程序零散地学习了\
  \ `Ant` 的不同方面。\n\n现在，是时候将所有内容整合在一起，创建一个完整的 `build.xml` 文件了。请参考 `build.properties`\
  \ 和 `build.xml` 文件如下：\n\n### build.properties\n\n下面给出了 `build.properties` 文件内容。\n\
  \n`deploy . path = c : \\tomcat6\\webapps`\n\n### build.xml\n\n`build.xml` 文件如下：\n\
  \n```xml\n<?xml version = \"1.0\" ?>\n<project name=\"fax\" basedir=\".\" default=\"\
  usage\" >\n  <property file=\"build.properties\" />\n  <property name=\"src.dir\"\
  \ value=\"src\" />\n  <property name=\"web.dir\" value=\"war\" />\n  <property name=\"\
  javadoc.dir\" value=\"doc\" />\n  <property name=\"build.dir\" value=\"${web.dir}/WEB-INF/classes\"\
  \ />\n  <property name=\"name\" value=\"fax\" />\n  <path id=\"master-classpath\"\
  \ >\n    <fileset dir=\"${web.dir}/WEB-INF/lib\" >\n      <include name=\"*.jar\"\
  \ />\n    </fileset>\n    <pathelement path=\"${build.dir}\" />\n  </path>\n  <target\
  \ name=\"javadoc\" >\n    <javadoc packagenames=\"faxapp.*\" sourcepath=\"${src.dir}\"\
  \n      destdir=\"doc\" version=\"true\" windowtitle=\"Fax Application\" >\n   \
  \   <doctitle> <![CDATA[ <h1> = Fax Application = </h1> ]]> </doctitle>\n      <bottom>\
  \ <![CDATA[Copyright © 2011\\. All Rights Reserved.]]> </bottom>\n      <group title=\"\
  util packages\" packages=\"faxapp.util.*\" />\n      <group title=\"web packages\"\
  \ packages=\"faxapp.web.*\" />\n      <group title=\"data packages\" packages=\"\
  faxapp.entity.*:faxapp.dao.*\" />\n    </javadoc>\n  </target>\n  <target name=\"\
  usage\" >\n    <echo message=\"\" />\n    <echo message=\"${name} build file\" />\n\
  \    <echo message=\"-----------------------------------\" />\n    <echo message=\"\
  \" />\n    <echo message=\"Available targets are:\" />\n    <echo message=\"\" />\n\
  \    <echo message=\"deploy --> Deploy application as directory\"/>\n    <echo message=\"\
  deploywar --> Deploy application as a WAR file\"/>\n    <echo message=\"\" />\n\
  \  </target>\n  <target name=\"build\" description=\"Compile main source tree java\
  \ files\" >\n    <mkdir dir=\"${build.dir}\" />\n    <javac destdir=\"${build.dir}\"\
  \ source=\"1.5\"\n      target=\"1.5\" debug=\"true\"\n      deprecation=\"false\"\
  \ optimize=\"false\" failonerror=\"true\" >\n      <src path=\"${src.dir}\" />\n\
  \      <classpath refid=\"master-classpath\" />\n    </javac>\n  </target>\n  <target\
  \ name=\"deploy\" depends=\"build\" description=\"Deploy application\" >\n    <copy\
  \ todir=\"${deploy.path}/${name}\" preservelastmodified=\"true\" >\n      <fileset\
  \ dir=\"${web.dir}\" >\n        <include name=\"**/*.*\" />\n      </fileset>\n\
  \    </copy>\n  </target>\n  <target name=\"deploywar\" depends=\"build\" description=\"\
  Deploy application as a WAR file\" >\n    <war destfile=\"${name}.war\" webxml=\"\
  ${web.dir}/WEB-INF/web.xml\" >\n      <fileset dir=\"${web.dir}\" >\n        <include\
  \ name=\"**/*.*\" />\n      </fileset>\n    </war>\n  </target>\n</project>\n```\n\
  \n\n\n\n\n```xml\n<group title = \"util packages\" packages = \"faxapp.util.*\"\
  \ />\n<group title = \"web packages\" packages = \"faxapp.web.*\" />\n<group title\
  \ = \"data packages\" packages = \"faxapp.entity.*:faxapp.dao.*\" />\n</javadoc>\n\
  </target>\n\n<target name = \"usage\" >\n<echo message = \"\" />\n<echo message\
  \ = \"${name} build file\" />\n<echo message = \"-----------------------------------\"\
  \ />\n<echo message = \"\" />\n<echo message = \"Available targets are:\" />\n<echo\
  \ message = \"\" />\n<echo message = \"deploy --> Deploy application as directory\"\
  />\n<echo message = \"deploywar --> Deploy application as a WAR file\"/>\n<echo\
  \ message = \"\" />\n</target>\n\n<target name = \"build\" description = \"Compile\
  \ main source tree java files\" >\n<mkdir dir = \"${build.dir}\" />\n<javac destdir\
  \ = \"${build.dir}\" source = \"1.5\" target = \"1.5\" debug = \"true\"\ndeprecation\
  \ = \"false\" optimize = \"false\" failonerror = \"true\" >\n<src path = \"${src.dir}\"\
  \ />\n<classpath refid = \"master-classpath\" />\n</javac>\n</target>\n\n<target\
  \ name = \"deploy\" depends = \"build\" description = \"Deploy application\" >\n\
  <copy todir = \"${deploy.path}/${name}\" preservelastmodified = \"true\" >\n<fileset\
  \ dir = \"${web.dir}\" >\n<include name = \"**/*.*\" />\n</fileset>\n</copy>\n</target>\n\
  \n<target name = \"deploywar\" depends = \"build\" description = \"Deploy application\
  \ as a WAR file\" >\n<war destfile = \"${name}.war\" webxml = \"${web.dir}/WEB-INF/web.xml\"\
  \ >\n<fileset dir = \"${web.dir}\" >\n<include name = \"**/*.*\" />\n</fileset>\n\
  </war>\n<copy todir = \"${deploy.path}\" preservelastmodified = \"true\" >\n<fileset\
  \ dir = \".\" >\n<include name = \"*.war\" />\n</fileset>\n</copy>\n</target>\n\n\
  <target name = \"clean\" description = \"Clean output directories\" >\n<delete>\n\
  <fileset dir = \"${build.dir}\" >\n<include name = \"**/*.class\" />\n</fileset>\n\
  </delete>\n</target>\n```\n\n<!-- ============================================================\
  \ -->\n<!-- Tomcat tasks -->\n<!-- ============================================================\
  \ -->\n```xml\n<path id = \"catalina-ant-classpath\" >\n<!-- We need the Catalina\
  \ jars for Tomcat -->\n<!-- * for other app servers - check the docs -->\n<fileset\
  \ dir = \"${appserver.lib}\" >\n<include name = \"catalina-ant.jar\" />\n</fileset>\n\
  </path>\n\n<taskdef name = \"install\" classname = \"org.apache.catalina.ant.InstallTask\"\
  \ >\n<classpath refid = \"catalina-ant-classpath\" />\n</taskdef>\n<taskdef name\
  \ = \"reload\" classname = \"org.apache.catalina.ant.ReloadTask\" >\n<classpath\
  \ refid = \"catalina-ant-classpath\" />\n</taskdef>\n<taskdef name = \"list\" classname\
  \ = \"org.apache.catalina.ant.ListTask\" >\n<classpath refid = \"catalina-ant-classpath\"\
  \ />\n</taskdef>\n<taskdef name = \"start\" classname = \"org.apache.catalina.ant.StartTask\"\
  \ >\n<classpath refid = \"catalina-ant-classpath\" />\n</taskdef>\n<taskdef name\
  \ = \"stop\" classname = \"org.apache.catalina.ant.StopTask\" >\n<classpath refid\
  \ = \"catalina-ant-classpath\" />\n</taskdef>\n\n<target name = \"reload\" description\
  \ = \"Reload application in Tomcat\" >\n<reload url = \"${tomcat.manager.url}\"\
  \ username = \"${tomcat.manager.username}\"\npassword = \"${tomcat.manager.password}\"\
  \ path = \"/${name}\" />\n</target>\n</project>\n```\n\n在这个示例中，我们使用了 Tomcat 作为应用服务器。\n\
  \n首先，在构建属性文件（build properties file）中，我们定义了一些额外的属性，说明如下：\n\n- `appserver.home` 指向\
  \ Tomcat 应用服务器的安装路径。\n- `appserver.lib` 指向 Tomcat 安装文件夹中的库文件。\n- `deploy.path` 变量现在指向\
  \ Tomcat 中的 webapp 文件夹。\n\nTomcat 中的应用程序可以使用 Tomcat manager 应用进行停止和启动。manager 应用的\
  \ URL、用户名和密码在 `build.properties` 文件中指定。\n\n接下来，我们声明了一个包含 `catalina-ant.jar` 的新 `CLASSPATH`。通过\
  \ Apache Ant 执行 Tomcat 任务需要此 jar 包。\n\n## 任务 (Tasks)\n\n`catalina-ant.jar` 提供了以下任务：\n\
  \n| 序号 | 属性与描述 |\n| :--- | :--- |\n| 1 | InstallTask 安装一个 web 应用。类名：org.apache.catalina.ant.InstallTask\
  \ |\n| 2 | ReloadTask 重载 web 应用。类名：org.apache.catalina.ant.ReloadTask |\n| 3 | ListTask\
  \ 列出所有 web 应用。类名：org.apache.catalina.ant.ListTask |\n| 4 | StartTask 启动一个 web 应用。类名：org.apache.catalina.ant.StartTask\
  \ |\n| 5 | StopTask 停止一个 web 应用。类名：org.apache.catalina.ant.StopTask |\n| 6 | ReloadTask\
  \ 在 Tomcat 中重载应用。类名：org.apache.catalina.ant.ReloadTask |\n\n\n\n\nJUnit 是基于 Java\
  \ 开发中常用的单元测试框架。它易于使用且易于扩展。有许多 JUnit 扩展可用。如果你不熟悉 JUnit，应该从 [www.junit.org](https://junit.org/junit5/)\
  \ 下载并阅读其手册。\n\n本章将展示如何使用 Ant 执行 JUnit 测试。使用 Ant 使得通过 `junit` 任务执行测试变得直观简单。\n\n`junit`\
  \ 任务的属性如下所示 −\n\n| 序号 | 属性与描述 |\n| :--- | :--- |\n| 1 | `dir` 指定调用虚拟机（VM）的目录。当禁用\
  \ `fork` 时会忽略此属性。 |\n| 2 | `jvmCommand` 用于调用 JVM。当禁用 `fork` 时会忽略此属性。 |\n| 3 | `fork`\
  \ 在独立的 JVM 中运行测试。 |\n| 4 | `errorproperty` 当发生 JUnit 错误时设置的属性名称。 |\n| 5 | `failureproperty`\
  \ 当发生 JUnit 失败时设置的属性名称。 |\n| 6 | `haltonerror` 发生测试错误时停止执行。 |\n| 7 | `haltonfailure`\
  \ 发生失败时停止执行。 |\n| 8 | `printsummary` 建议 Ant 显示每个测试的简单统计信息。 |\n| 9 | `showoutput`\
  \ 建议 Ant 将输出发送到日志和格式化器。 |\n| 10 | `tempdir` Ant 将使用的临时文件路径。 |\n| 11 | `timeout`\
  \ 退出运行时间超过此设置（毫秒）的测试。 |\n\n让我们继续 Hello World Fax 应用程序，并添加一个 JUnit 目标（target）。\n\n\
  以下示例展示了一个简单的 JUnit 测试执行 −\n\n```xml\n<target name = \"unittest\" >\n  <junit haltonfailure\
  \ = \"true\" printsummary = \"true\" >\n    <test name = \"com.tutorialspoint.UtilsTest\"\
  \ />\n  </junit>\n</target>\n```\n\n此示例展示了在 `com.tutorialspoint.UtilsTest` junit\
  \ 类上执行 JUnit。\n\n运行上述代码会产生以下输出 −\n\n```\ntest:\n[echo] Testing the application\n\
  [junit] Running com.tutorialspoint.UtilsTest\n[junit] Tests run: 12, Failures: 0,\
  \ Errors: 0, Time elapsed: 16.2 sec\nBUILD PASSED\n```\n\n# 扩展 Ant\n\nAnt 自带了一组预定义的任务，但你可以像下面的示例所示创建你自己的任务。\n\
  \n自定义 Ant 任务应该继承 `org.apache.tools.ant.Task` 类并扩展 `execute()` 方法。\n\n下面是一个简单的示例\
  \ −\n\n```java\npackage com.tutorialspoint.ant;\n\nimport org.apache.tools.ant.Task;\n\
  import org.apache.tools.ant.Project;\nimport org.apache.tools.ant.BuildException;\n\
  \npublic class MyTask extends Task {\n    String message;\n    public void execute()\
  \ throws BuildException {\n        log(\"Message: \" + message, Project.MSG_INFO);\n\
  \    }\n    public void setMessage(String message) {\n        this.message = message;\n\
  \    }\n}\n```\n\n要执行自定义任务，你需要在 Hello World Fax 应用程序中添加以下内容 −\n\n```xml\n<target\
  \ name = \"custom\" >\n  <taskdef name = \"custom\" classname = \"com.tutorialspoint.ant.MyTask\"\
  \ />\n  <custom message = \"Hello World!\" />\n</target>\n```\n\n执行上述自定义任务会打印消息\
  \ 'Hello World!'\n\n```\nc : >ant custom\ntest :\n[ custom ] Message : Hello World\
  \ !\nelapsed : 0.2 sec\nBUILD PASSED\n```\n\n这只是一个简单的示例。你可以利用 Ant 的功能来做任何你想改进构建和部署过程的事情。\n\
  \n"
