    # Introduction


    ANT stands for **Another Neat**  Tool. It is a Java-based build tool from computer
    software development company Apache. Before going into the details of Apache Ant,
    let us first understand why we need a build tool.


    ## Need for a Build Tool


    On an average, a developer spends a substantial amount of time doing mundane tasks
    like build and deployment that include −


    *   Compiling the code


    *   Packaging the binaries


    *   Deploying the binaries to the test server


    *   Testing the changes


    *   Copying the code from one location to another


    To automate and simplify the above tasks, Apache Ant is useful. It is an Operating
    System build and deployment tool that can be executed from the command line.


    ## History of Apache Ant


    Ant was created by software developer James Duncan Davidson who is also the original
    creator of webserver application Tomcat.


    Ant was originally used to build Tomcat, and was bundled as a part of Tomcat distribution.


    It was born out of the problems and complexities associated with the Apache Make
    tool.


    It was promoted as an independent project in Apache in the year 2000. The latest
    version of Apache Ant as on September 2020 is **1.10.9** .


    ## Features of Apache Ant


    The features of Apache Ant are listed below −


    *   It is the most complete Java build and deployment tool available.


    *   It is platform neutral and can handle platform specific properties, such as
    file separators.


    *   It can be used to perform platform specific tasks such as modifying the modified
    time of a file using ''touch'' command.


    *   Ant scripts are written using plain XML. If you are already familiar with
    XML, you can learn Ant pretty quickly.


    *   Ant is good at automating complicated repetitive tasks.


    *   Ant comes with a big list of predefined tasks.


    *   Ant provides an interface to develop custom tasks.


    *   Ant can be easily invoked from the command line and it can integrate with
    free and commercial IDEs.


    # Environment Setup


    Apache Ant is distributed under the Apache Software License which is a fully-fledged
    open source license certified by the open source initiative.


    The latest Apache Ant version, including its full-source code, class files, and
    documentation can be found at  [https://ant.apache.org](https://ant.apache.org/)
    .


    ## Installing Apache Ant


    It is assumed that you have already downloaded and installed Java Development
    Kit (JDK) on your computer. If not, please follow the instructions available at **file:///C:/java/java_environment_setup.htm**


    *   Ensure that the JAVA_HOME environment variable is set to the folder, where
    your JDK is installed.


    *   Download the binaries from  [https://ant.apache.org](https://ant.apache.org/)


    *   Unzip the zip file to a convenient location c:\folder by using Winzip, winRAR,
    7-zip or similar tools.


    *   Create a new environment variable called **ANT_HOME**  that points to the
    Ant installation folder. In this case, it is **c:\apache-ant-1.10.9-bin**  folder.


    *   Append the path to the Apache Ant batch file to the PATH environment variable.
    In our case, this would be the **c:\apache-ant-1.10.9-bin\bin**  folder.


    ## Verifying the Installation


    To verify the successful installation of Apache Ant on your computer, type ant
    on your command prompt.


    You should see an output as given below −


    C:\>ant -version


    Apache Ant(TM) version 1.10.9 compiled on September 27 2020


    If you do not see the above output, then please verify that you have followed
    the installation steps properly.


    ## Installing Eclipse


    This tutorial also covers integration of Ant with Eclipse integrated development
    environment (IDE). Hence, if you have not installed Eclipse, please download and
    install Eclipse.


    ### Steps to install Eclipse


    *   Download the latest Eclipse binaries from  [www.eclipse.org](https://www.eclipse.org/)


    *   Unzip the Eclipse binaries to a convenient location, say c:\folder.


    *   Run Eclipse from c:\eclipse\eclipse.exe.


    # Build Files


    Typically, Ant''s build file, called **build.xml**  should reside in the base
    directory of the project. However, there is no restriction on the file name or
    its location. You are free to use other file names or save the build file in some
    other location.


    For this exercise, create a file called build.xml anywhere in your computer with
    the following contents −


    <? xml version = "1.0" ?>


    <project name = "Hello World Project" default = "info" >


    <target name = "info" >


    <echo> Hello World - Welcome to Apache Ant! </echo>


    </target>


    </project>


    Note that there should be no blank line(s) or whitespace(s) before the xml declaration.
    If you allow them, the following error message occurs while executing the ant
    build −


    The processing instruction target matching "[xX][mM][lL]" is not allowed.


    All build files require the project element and at least one target element.


    The XML element **project**  has three attributes which are as follows −


    | Sr.No | Attributes & Description |


    | 1 | nameThe Name of the project. (Optional) |


    | 2 | defaultThe default target for the build script. A project may contain any
    number of targets. This attribute specifies which target should be considered
    as the default. (Mandatory) |


    | 3 | basedirThe base directory (or) the root folder for the project. (Optional)
    |


    A target is a collection of tasks that you want to run as one unit. In our example,
    we have a simple target to provide an informational message to the user.


    Targets can have dependencies on other targets. For example, a **deploy**  target
    may have a dependency on the package target, the **package**  target may have
    a dependency on the compile target and so forth. Dependencies are denoted using
    the **depends**  attribute.


    For example −


    <target name = "deploy" depends = "package" >


    ....


    </target>


    <target name = "package" depends = "clean,compile" >


    ....


    </target>


    <target name = "clean" >


    ....


    </target>


    <target name = "compile" >


    ....


    </target>


    The target element has the following attributes −


    | Sr.No | Attributes & Description |


    | 1 | nameThe name of the target (Required) |


    | 2 | dependsComma separated list of all targets that this target depends on.
    (Optional) |


    | 3 | descriptionA short description of the target. (optional) |


    | 4 | ifAllows the execution of a target based on the trueness of a conditional
    attribute. (optional) |


    | 5 | unlessAdds the target to the dependency list of the specified Extension
    Point. An Extension Point is similar to a target, but it does not have any tasks.
    (Optional) |


    The **echo**  task in the above example is a trivial task that prints a message.
    In our example,it prints the message **Hello World** .'
