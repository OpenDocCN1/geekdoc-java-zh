  trans: "\n\n要运行 ant 构建文件，请打开命令提示符并导航到 `build.xml` 所在的文件夹，然后输入 `ant info`。你也可以直接输入\
    \ `ant`。两种方法都可以生效，因为 `info` 是构建文件中的默认目标（target）。\n\n你应该看到如下输出：\n\n```\nC:\\>ant\n\
    Buildfile: C:\\build.xml\ninfo: [echo] Hello World - Welcome to Apache Ant!\n\
    BUILD SUCCESSFUL\nTotal time: 0 seconds\nC:\\>\n```\n\n# 属性任务 (Property Task)\n\
    \nAnt 构建文件是用 XML 编写的，它不允许像你最喜爱的编程语言那样声明变量。然而，正如你可能想象的那样，如果 Ant 允许声明如项目名称、项目源码目录等变量，将会非常有用。\n\
    \nAnt 使用 `property` 元素允许你指定属性。这允许属性从一个构建到另一个构建或从一个环境到另一个环境更改。\n\n## Ant 属性 (Ant\
    \ Properties)\n\n默认情况下，Ant 提供了以下预定义的属性，可以在构建文件中使用：\n\n| 序号 | 属性与描述 |\n| :--- |\
    \ :--- |\n| 1 | `ant.file` - 构建文件的完整位置。 |\n| 2 | `ant.version` - Apache Ant 安装的版本。\
    \ |\n| 3 | `basedir` - 构建的根目录，由项目元素中 `basedir` 属性指定。 |\n| 4 | `ant.java.version`\
    \ - Ant 使用的 JDK 版本。 |\n| 5 | `ant.project.name` - 项目的名称，由项目元素中 `name` 属性指定。 |\n\
    | 6 | `ant.project.default-target` - 当前项目的默认目标。 |\n| 7 | `ant.project.invoked-targets`\
    \ - 当前项目中被调用的目标的逗号分隔列表。 |\n| 8 | `ant.core.lib` - Ant jar 文件的完整位置。 |\n| 9 | `ant.home`\
    \ - Ant 安装的根目录。 |\n| 10 | `ant.library.dir` - Ant 库文件的根目录 - 通常是 `ANT_HOME/lib`\
    \ 文件夹。 |\n\nAnt 还提供了系统属性（例如：`file.separator`）供构建文件使用。\n\n除了上述属性，用户可以使用 `property`\
    \ 元素定义额外的属性。\n\n以下示例展示了如何定义一个名为 `sitename` 的属性：\n\n```xml\n<? xml version = \"\
    1.0\" ?>\n<project name = \"Hello World Project\" default = \"info\" >\n  <property\
    \ name = \"sitename\" value = \"www.tutorialspoint.com\" />\n  <target name =\
    \ \"info\" >\n    <echo> Apache Ant version is ${ant.version} - You are at ${sitename}\
    \ </echo>\n  </target>\n</project>\n```\n\n在上述构建文件运行 Ant 会产生如下输出：\n\n```\nC:\\\
    >ant\nBuildfile: C:\\build.xml\ninfo: [echo] Apache Ant version is Apache Ant(TM)\
    \ version 1.10.9\ncompiled on September 27 2020 - You are at www.tutorialspoint.com\n\
    BUILD SUCCESSFUL\nTotal time: 0 seconds\nC:\\>\n```\n\n# 属性文件 (Property Files)\n\
    \n如果你只需要少数几个属性，直接在构建文件中设置属性是可以的。但对于大型项目，将属性存储在单独的属性文件中是有意义的。\n\n## 处处 (Benefits)\n\
    \n将属性存储在单独文件中具有以下优点：\n\n*   它允许你重用同一个构建文件，针对不同的执行环境使用不同的属性设置。例如，可以为 DEV、TEST 和\
    \ PROD 环境单独维护构建属性文件。\n*   当你事先不知道某个属性（在特定环境中）的值时，它是很有用的。这允许你在已知属性值的其他环境中执行构建。\n\
    \n这虽然没有硬性规定，但通常属性文件被命名为 `build.properties` 并放置在 `build.xml` 文件旁边。你可以根据部署环境创建多个构建属性文件\
    \ - 例如 `build.properties.dev` 和 `build.properties.test`。\n\n构建属性文件的内容与普通的 Java\
    \ 属性文件相似。每行包含一个属性。每个属性由一个名称和值对表示。\n\n名称和值对由等号（`=`）分隔。强烈建议对属性进行适当的注释。注释使用井号（`#`）列出。\n\
    \n以下示例展示了一个 `build.xml` 文件及其关联的 `build.properties` 文件：\n\n### build.xml\n\n下面是\
    \ `build.xml` 文件的示例：\n\n```xml\n<? xml version = \"1.0\" ?>\n<project name = \"\
    Hello World Project\" default = \"info\" >\n  <property file = \"build.properties\"\
    \ />\n  <target name = \"info\" >\n    <echo> Apache Ant version is ${ant.version}\
    \ - You are at ${sitename} </echo>\n  </target>\n</project>\n```\n\n### build.properties\n\
    \n下面是 `build.properties` 文件的示例：\n\n```properties\n# The Site Name\nsitename=www.tutorialspoint.com\n\
    buildversion=3.3.2\n```\n\n在上述示例中，`sitename` 是一个映射到网站名称的自定义属性。你可以以此方式声明任意数量的自定义属性。\n\
    \n另一个列出的自定义属性是 `buildversion`。\n\n除了上述的，Ant 还提供了许多预定义的属性，如下：\n\n# 数据类型 (Data Types)\n\
    \nAnt 提供了许多数据类型。\n\n| 序号 | 属性与描述 |\n| :--- | :--- |\n| 1 | `ant.file` - 构建文件的完整位置。\
    \ |\n| 2 | `ant.version` - Apache Ant 安装的版本。 |\n| 3 | `basedir` - 构建的根目录，由项目元素中\
    \ `basedir` 属性指定。 |\n| 4 | `ant.java.version` - Ant 使用的 JDK 版本。 |\n| 5 | `ant.project.name`\
    \ - 项目的名称，由项目元素中 `name` 属性指定。 |\n| 6 | `ant.project.default-target` - 当前项目的默认目标。\
    \ |\n| 7 | `ant.project.invoked-targets` - 当前项目中被调用的目标的逗号分隔列表。 |\n| 8 | `ant.core.lib`\
    \ - Ant jar 文件的完整位置。 |\n| 9 | `ant.home` - Ant 安装的根目录。 |\n| 10 | `ant.library.dir`\
    \ - Ant 库文件的根目录 - 通常是 `ANT_HOME/lib` 文件夹。 |\n\nAnt 提供了许多数据类型。不要将“数据类型”一词与编程语言中的类型混淆。\n\
    \n## Ant 中的数据类型\n\nAnt 提供以下数据类型：\n\n### 文件集 (Fileset)\n\n`fileset` 数据类型表示文件的集合。它用于根据特定模式包含或排除文件。\n\
    \n例如，参考以下代码。此处 `src` 属性指向源文件夹。\n\n```xml\n<fileset dir=\"${src}\" casesensitive=\"\
    yes\">\n  <include name=\"*.java\" />\n  <exclude name=\"*Stub*\" />\n</fileset>\n\
    ```\n\n`fileset` 选择源文件夹中所有的 `.java` 文件，但包含“Stub”的文件。大小敏感过滤器应用于文件集，这意味着名为 `Samplestub.java`\
    \ 的文件不会被排除。\n\n### 模式集 (Pattern set)\n\n`pattern set` 允许根据某些模式轻松过滤文件或文件夹。可以使用以下元字符创建模式：\n\
    \n*   `?` - 匹配一个字符。\n*   `*` - 匹配零或多个字符。\n*   `**` - 递归匹配零或多个目录。\n\n下面的示例描述了模式集的用法：\n\
    \n```xml\n<patternset id=\"java.files.without_stubs\">\n  <include name=\"src/**/*.java\"\
    \ />\n  <exclude name=\"src/**/*Stub*\" />\n</patternset>\n```\n\n随后，`patternset`\
    \ 可以如下重用在 `fileset` 中：\n\n```xml\n<fileset dir=\"${src}\" casesensitive=\"yes\"\
    >\n  <patternset refid=\"java.files.without_stubs\" />\n</fileset>\n```\n\n###\
    \ 文件列表 (File list)\n\n`filelist` 数据类型与 `fileset` 相似，但有以下不同：\n\n*   它包含显式命的文件列表，不支持通配符。\n\
    *   该数据类型可以应用于存在或不存在的文件。\n\n"
- fmt: "\nLet us see the following example of the filelist data type. Here, the attribute\
    \ `webapp.src.folder` points to the web application source folder of the project.\n\
    \n```xml\n<filelist id=\"config.files\" dir=\"${webapp.src.folder}\" >\n  <file\
    \ name=\"applicationConfig.xml\" />\n  <file name=\"faces-config.xml\" />\n  <file\
    \ name=\"web.xml\" />\n  <file name=\"portlet.xml\" />\n</filelist>\n```\n\n###\
    \ Filter set\n\nBy using a filterset data type along with the copy task, you can\
    \ replace certain text in all the files that matches the pattern with a replacement\
    \ value.\n\nA common example is to append the version number to the release notes\
    \ file, as shown in the following code.\n\n```xml\n<copy todir=\"${output.dir}\"\
    \ >\n  <fileset dir=\"${releasenotes.dir}\" includes=\"**/*.txt\" />\n  <filterset>\n\
    \    <filter token=\"VERSION\" value=\"${current.version}\" />\n  </filterset>\n\
    </copy>\n```\n\nIn the above mentioned code −\n\n*   The attribute `output.dir`\
