- fmt: "\nJUnit is the commonly used unit testing framework for Java-based developments.\
    \ It is easy to use and easy to extend. There are a number of JUnit extensions\
    \ available. If you are unfamiliar with JUnit, you should download it from [www.junit.org](https://junit.org/junit5/)\
    \ and read its manual.\n\nThis chapter shows how to execute JUnit tests by using\
    \ Ant. The use of Ant makes it straight forward through the `junit` task.\n\n\
    The attributes of the `junit` task are presented below −\n\n| Sr.No | Properties\
    \ & Description |\n| :--- | :--- |\n| 1 | `dir` where to invoke the VM from. This\
    \ is ignored when `fork` is disabled. |\n| 2 | `jvmCommand` used to invoke the\
    \ JVM. This is ignored when `fork` is disabled. |\n| 3 | `fork` runs the test\
    \ in a separate JVM. |\n| 4 | `errorproperty`The name of the property to set if\
    \ there is a JUnit error. |\n| 5 | `failureproperty`The name of the property to\
    \ set if there is a JUnit failure. |\n| 6 | `haltonerror`Stops execution when\
    \ a test error occurs. |\n| 7 | `haltonfailure`Stops execution when a failure\
    \ occurs. |\n| 8 | `printsummary`Advises Ant to display simple statistics for\
    \ each test. |\n| 9 | `showoutput`Advises Ant to send the output to its logs and\
    \ formatters. |\n| 10 | `tempdir`Path to the temporary file that Ant will use.\
    \ |\n| 11 | `timeout`Exits the tests that take longer to run than this setting\
    \ (in milliseconds). |\n\nLet us continue the theme of the Hello World Fax web\
    \ application and add a JUnit target.\n\nThe following example shows a simple\
    \ JUnit test execution −\n\n```xml\n<target name = \"unittest\" >\n  <junit haltonfailure\
    \ = \"true\" printsummary = \"true\" >\n    <test name = \"com.tutorialspoint.UtilsTest\"\
    \ />\n  </junit>\n</target>\n```\n\nThis example shows the execution of JUnit\
    \ on the `com.tutorialspoint.UtilsTest` junit class.\n\nRunning the above code\
    \ produces the following output −\n\n```\ntest:\n[echo] Testing the application\n\
    [junit] Running com.tutorialspoint.UtilsTest\n[junit] Tests run: 12, Failures:\
    \ 0, Errors: 0, Time elapsed: 16.2 sec\nBUILD PASSED\n```\n\n# Extending Ant\n\
    \nAnt comes with a predefined set of tasks, however you can create your own tasks,\
    \ as shown in the example below.\n\nCustom Ant Tasks should extend the `org.apache.tools.ant.Task`\
    \ class and should extend the `execute()` method.\n\nBelow is a simple example\
    \ −\n\n```java\npackage com.tutorialspoint.ant;\n\nimport org.apache.tools.ant.Task;\n\
    import org.apache.tools.ant.Project;\nimport org.apache.tools.ant.BuildException;\n\
    \npublic class MyTask extends Task {\n    String message;\n    public void execute()\
    \ throws BuildException {\n        log(\"Message: \" + message, Project.MSG_INFO);\n\
    \    }\n    public void setMessage(String message) {\n        this.message = message;\n\
    \    }\n}\n```\n\nTo execute the custom task, you need to add the following to\
    \ the Hello World Fax web application −\n\n```xml\n<target name = \"custom\" >\n\
    \  <taskdef name = \"custom\" classname = \"com.tutorialspoint.ant.MyTask\" />\n\
    \  <custom message = \"Hello World!\" />\n</target>\n```\n\nExecuting the above\
    \ custom task prints the message 'Hello World!'\n\n```\nc : >ant custom\ntest\
    \ :\n[ custom ] Message : Hello World !\nelapsed : 0.2 sec\nBUILD PASSED\n```\n\
    \nThis is just a simple example. You can use the power of Ant to do whatever you\
    \ want to improve your build and deployment process.\n"
  raw: 'JUnit is the commonly used unit testing framework for Java-based developments.
    It is easy to use and easy to extend. There are a number of JUnit extensions available.
    If you are unfamiliar with JUnit, you should download it from  [www.junit.org](https://junit.org/junit5/)
     and read its manual.


    This chapter shows how to execute JUnit tests by using Ant. The use of Ant makes
    it straight forward through the JUnit task.


    The attributes of the JUnit task are presented below −


    | Sr.No | Properties & Description |


    | 1 | dirWhere to invoke the VM from. This is ignored when fork is disabled. |


    | 2 | jvmCommand used to invoke the JVM. This is ignored when fork is disabled.
    |


    | 3 | forkRuns the test in a separate JVM. |


    | 4 | errorpropertyThe name of the property to set if there is a JUnit error.
    |


    | 5 | failurepropertyThe name of the property to set if there is a JUnit failure.
    |


    | 6 | haltonerrorStops execution when a test error occurs. |


    | 7 | haltonfailureStops execution when a failure occurs. |


    | 8 | printsummaryAdvises Ant to display simple statistics for each test. |


    | 9 | showoutputAdvises Ant to send the output to its logs and formatters. |


    | 10 | tempdirPath to the temporary file that Ant will use. |


    | 11 | timeoutExits the tests that take longer to run than this setting (in milliseconds).
    |


    Let us continue the theme of the **Hello World**  Fax web application and add
    a JUnit target.


    The following example shows a simple JUnit test execution −


    <target name = "unittest" >


    <junit haltonfailure = "true" printsummary = "true" >


    <test name = "com.tutorialspoint.UtilsTest" />


    </junit>


    </target>


    This example shows the execution of JUnit on the com.tutorialspoint.UtilsTest
    junit class.


    Running the above code produces the following output −


    test:


    [echo] Testing the application


    [junit] Running com.tutorialspoint.UtilsTest


    [junit] Tests run: 12, Failures: 0, Errors: 0, Time elapsed: 16.2 sec


    BUILD PASSED


    # Extending Ant


    Ant comes with a predefined set of tasks, however you can create your own tasks,
    as shown in the example below.


    Custom Ant Tasks should extend the **org.apache.tools.ant.Task**  class and should
    extend the execute() method.


    Below is a simple example −


    package com . tutorialspoint . ant ;


    import org . apache . tools . ant . Task ;


    import org . apache . tools . ant . Project ;


    import org . apache . tools . ant . BuildException ;


    public class MyTask extends Task {


    String message ;


    public void execute () throws BuildException {


    log ( "Message: " + message , Project . MSG_INFO );


    }


    public void setMessage ( String message ) {


    this . message = message ;


    }


    }


    To execute the custom task, you need to add the following to the **Hello World**
     Fax web application −


    <target name = "custom" >


    <taskdef name = "custom" classname = "com.tutorialspoint.ant.MyTask" />


    <custom message = "Hello World!" />


    </target>


    Executing the above custom task prints the message ''Hello World!''


    c : \>ant custom


    test :


    [ custom ] Message : Hello World !


    elapsed : 0.2 sec


    BUILD PASSED


    This is just a simple example. You can use the power of Ant to do whatever you
    want to improve your build and deployment process.'
