  raw: 'It is entirely possible to nest the classes, lib, metainf and webinf directors,
    so that they live in scattered folders anywhere in the project structure. But,
    best practices suggest that your Web project should have the Web Content structure
    that is similar to the structure of the WAR file. The Fax Application project
    has its structure outlined using this basic principle.


    To execute the war task, wrap it inside a target, most commonly, the build or
    package target, and run them.


    <target name = "build-war" >


    <war destfile = "fax.war" webxml = "${web.dir}/web.xml" >


    <fileset dir = "${web.dir}/WebContent" >


    <include name = "**/*.*" />


    </fileset>


    <lib dir = "thirdpartyjars" >


    <exclude name = "portlet.jar" />


    </lib>


    <classes dir = "${build.dir}/web" />


    </war>


    </target>


    Running Ant on this file will create the **fax.war**  file for us.


    The following outcome is the result of running the Ant file −


    C : \>ant build - war


    Buildfile : C : \build . xml


    BUILD SUCCESSFUL


    Total time : 12.3 seconds


    The fax.war file is now placed in the output folder. The contents of the war file
    will be as mentioned below −


    fax.war:


    +---jsp This folder contains the jsp files


    +---css This folder contains the stylesheet files


    +---js This folder contains the javascript files


    +---images This folder contains the image files


    +---META-INF This folder contains the Manifest.Mf


    +---WEB-INF


    +---classes This folder contains the compiled classes


    +---lib Third party libraries and the utility jar files


    WEB.xml Configuration file that defines the WAR package


    # Packaging Applications


    We have learnt the different aspects of Ant using the **Hello World**  Fax web
    application in bits and pieces.


    Now, it is time to put everything together to create a full and complete build.xml
    file.Consider **build.properties**  and **build.xml**  files as follows −


    ## build.properties


    The file is given below for build.properties.


    deploy . path = c : \tomcat6\webapps


    ## build.xml


    The build.xml file is as follows −


    <? xml version = "1.0" ?>


    <project name = "fax" basedir = "." default = "usage" >


    <property file = "build.properties" />


    <property name = "src.dir" value = "src" />


    <property name = "web.dir" value = "war" />


    <property name = "javadoc.dir" value = "doc" />


    <property name = "build.dir" value = "${web.dir}/WEB-INF/classes" />


    <property name = "name" value = "fax" />


    <path id = "master-classpath" >


    <fileset dir = "${web.dir}/WEB-INF/lib" >


    <include name = "*.jar" />


    </fileset>


    <pathelement path = "${build.dir}" />


    </path>


    <target name = "javadoc" >


    <javadoc packagenames = "faxapp.*" sourcepath = "${src.dir}"


    destdir = "doc" version = "true" windowtitle = "Fax Application" >


    <doctitle> <![CDATA[ <h1> = Fax Application = </h1> ]]> </doctitle>


    <bottom> <![CDATA[Copyright © 2011\. All Rights Reserved.]]> </bottom>


    <group title = "util packages" packages = "faxapp.util.*" />


    <group title = "web packages" packages = "faxapp.web.*" />


    <group title = "data packages" packages = "faxapp.entity.*:faxapp.dao.*" />


    </javadoc>


    </target>


    <target name = "usage" >


    <echo message = "" />


    <echo message = "${name} build file" />


    <echo message = "-----------------------------------" />


    <echo message = "" />


    <echo message = "Available targets are:" />


    <echo message = "" />


    <echo message = "deploy --> Deploy application as directory"/>


    <echo message = "deploywar --> Deploy application as a WAR file"/>


    <echo message = "" />


    </target>


    <target name = "build" description = "Compile main source tree java files" >


    <mkdir dir = "${build.dir}" />


    <javac destdir = "${build.dir}" source = "1.5"


    target = "1.5" debug = "true"


    deprecation = "false" optimize = "false" failonerror = "true" >


    <src path = "${src.dir}" />


    <classpath refid = "master-classpath" />


    </javac>


    </target>


    <target name = "deploy" depends = "build" description = "Deploy application" >


    <copy todir = "${deploy.path}/${name}" preservelastmodified = "true" >


    <fileset dir = "${web.dir}" >


    <include name = "**/*.*" />


    </fileset>


    </copy>


    </target>


    <target name = "deploywar" depends = "build" description = "Deploy application
    as a WAR file" >


    <war destfile = "${name}.war" webxml = "${web.dir}/WEB-INF/web.xml" >


    <fileset dir = "${web.dir}" >


    <include name = "**/*.*" />


    </fileset>


    </war>


    <copy todir = "${deploy.path}" preservelastmodified = "true" >


    <fileset dir = "." >


    <include name = "*.war" />


    </fileset>


    </copy>


    </target>


    <target name = "clean" description = "Clean output directories" >


    <delete>


    <fileset dir = "${build.dir}" >


    <include name = "**/*.class" />


    </fileset>


    </delete>


    </target>


    </project>


    In the above mentioned example −


    *   We first declare the path to the webapps folder in Tomcat in the build properties
    file as the **deploy.path**  variable.


    *   We also declare the source folder for the java files in the **src.dir**  variable.


    *   Then, we declare the source folder for the web files in the **web.dir**  variable. **javadoc.dir**
     is the folder for storing the java documentation, and **build.dir**  is the path
    for storing the build output files.


    *   After that, we declare the name of the web application, which is **fax**  in
    our case.


    *   We also define the master class path, which contains the JAR files present
    in the WEB-INF/lib folder of the project.


    *   We also include the class files present in the **build.dir**  in the master
    class path.


    *   The Javadoc target produces the javadoc required for the project and the usage
    target is used to print the common targets that are present in the build file.


    The above example shows two deployment targets: **deploy**  and **deploywar**
    .


    The deploy target copies the files from the web directory to the deploy directory
    preserving the last modified date time stamp. This is useful, when deploying to
    a server that supports hot deployment.


    The clean target clears all the previously built files.


    The deploywar target builds the war file and then, copies the war file to the
    deploy directory of the application server.


    # Deploying Applications


    In the previous chapter, we have learnt how to package an application and deploy
    it to a folder.


    In this chapter, we are going to deploy the web application directly to the application
    server deploy folder and then, we are going to add a few Ant targets to start
    and stop the services.


    Let us continue with the **Hello World**  fax web application. This is a continuation
    of the previous chapter; the new components are highlighted in **bold** .


    ### build.properties


    The file for build.properties is given below −


    # Ant properties for building the springapp


    appserver . home = c : \\install\\apache - tomcat - 7.0 . 19


    # for Tomcat 5 use $appserver.home}/server/lib


    # for Tomcat 6 use $appserver.home}/lib


    appserver . lib = $ { appserver . home }/ lib


    deploy . path = $ { appserver . home }/ webapps


    tomcat . manager . url = http : //www.tutorialspoint.com:8080/manager


    tomcat . manager . username = tutorialspoint


    tomcat . manager . password = secret


    ### build.xml


    The file for build.xml is as follows −


    <? xml version = "1.0" ?>


    <project name = "fax" basedir = "." default = "usage" >


    <property file = "build.properties" />


    <property name = "src.dir" value = "src" />


    <property name = "web.dir" value = "war" />


    <property name = "javadoc.dir" value = "doc" />


    <property name = "build.dir" value = "${web.dir}/WEB-INF/classes" />


    <property name = "name" value = "fax" />


    <path id = "master-classpath" >


    <fileset dir = "${web.dir}/WEB-INF/lib" >


    <include name = "*.jar" />


    </fileset>


    <pathelement path = "${build.dir}" />


    </path>


    <target name = "javadoc" >


    <javadoc packagenames = "faxapp.*" sourcepath = "${src.dir}"


    destdir = "doc" version = "true" windowtitle = "Fax Application" >


    <doctitle> <![CDATA[ <h1> = Fax Application= </h1> ]]> </doctitle>


    <bottom> <![CDATA[Copyright © 2011\. All Rights Reserved.]]> </bottom>'
