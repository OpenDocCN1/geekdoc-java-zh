    <target name = "reload" description = "Reload application in Tomcat" >


    <reload url = "${tomcat.manager.url}" username = "${tomcat.manager.username}"


    password = "${tomcat.manager.password}" path = "/${name}" />


    </target>


    </project>


    In this example, we have used Tomcat as our application server.


    First, in the build properties file, we have defined some additional properties
    which are explained below −


    *   The **appserver.home**  points to the installation path to the Tomcat application
    server.


    *   The **appserver.lib**  points to the library files in the Tomcat installation
    folder.


    *   The **deploy.path**  variable now points to the webapp folder in Tomcat.


    Applications in Tomcat can be stopped and started using the Tomcat manager application.
    The URL for the manager application, username and password are also specified
    in the build.properties file.


    Next, we declare a new CLASSPATH that contains the **catalina-ant.jar** . This
    jar file is required to execute Tomcat tasks through Apache Ant.


    ## Tasks


    The catalina-ant.jar provides the following tasks −


    | Sr.No | Properties & Description |


    | 1 | InstallTaskInstalls a web application. Class Name: org.apache.catalina.ant.InstallTask
    |


    | 2 | ReloadTaskReload a web application. Class Name: org.apache.catalina.ant.ReloadTask
    |


    | 3 | ListTaskLists all web applications. Class Name: org.apache.catalina.ant.ListTask
    |


    | 4 | StartTask1Starts a web application. Class Name: org.apache.catalina.ant.StartTask
    |


    | 5 | StopTaskStops a web application. Class Name: org.apache.catalina.ant.StopTask
    |


    | 6 | ReloadTaskReloads a web application without stopping. Class Name: org.apache.catalina.ant.ReloadTask
    |


    The reload task requires the additional parameters which are as follows −


    *   URL to the manager application.


    *   Username to restart the web application.


    *   Password to restart the web application.


    *   Name of the web application to be restarted.


    Let us issue the **deploy-war**  command to copy the webapp to the Tomcat webapps
    folder and then, let us reload the Fax Web application. The following outcome
    is the result of running the Ant file −


    C:\>ant deploy-war


    Buildfile: C:\build.xml


    BUILD SUCCESSFUL


    Total time: 6.3 seconds


    C:\>ant reload


    Buildfile: C:\build.xml


    BUILD SUCCESSFUL


    Total time: 3.1 seconds


    Once the above task is run, the web application is deployed and the web application
    is reloaded.


    # Executing Java code


    You can use Ant to execute the Java code. In the following example, the java class
    takes in an argument (administrator''s email address) and send out an email.


    public class NotifyAdministrator {


    public static void main ( String [] args ) {


    String email = args [ 0 ];


    notifyAdministratorviaEmail ( email );


    System . out . println ( "Administrator " + email + " has been notified" );


    }


    public static void notifyAdministratorviaEmail ( String email {


    //......


    }


    }


    Here is a simple build that executes this java class.


    <? xml version = "1.0" ?>


    <project name = "sample" basedir = "." default = "notify" >


    <target name = "notify" >


    <java fork = "true" failonerror = "yes" classname = "NotifyAdministrator" >


    <arg line = "admin@test.com" />


    </java>


    </target>


    </project>


    When the build is executed, it produces the following outcome −


    C : \>ant


    Buildfile : C : \build . xml


    notify : [ java ] Administrator admin@test . com has been notified


    BUILD SUCCESSFUL


    Total time : 1 second


    In this example, the java code does a simple thing which is, to send an email.
    We could have used the built in the Ant task to do that.


    However, now that you have got the idea, you can extend your build file to call
    the java code that performs complicated things. For example: encrypts your source
    code.


    # Eclipse Integration


    If you have downloaded and installed Eclipse already, you have very little to
    do to get started. Eclipse comes pre bundled with the Ant plugin, ready to use.


    Follow the simple steps, to integrate Ant into Eclipse.


    *   Make sure that the build.xml is a part of your java project, and does not
    reside at a location that is external to the project.


    *   Enable Ant View by following **Window → Show View → Other → Ant → Ant** .


    *   Open Project Explorer, drag the build.xml into the Ant View.


    Your Ant view looks similar to the one given below −


    ![Image](OEBPS/Image00000.jpg)


    Clicking on the targets, build / clean / usage will run Ant with the target.


    Clicking "fax" will execute the default target - **usage** .


    The Ant Eclipse plugin also comes with a good editor for editing build.xml files.
    The editor is aware of the build.xml schema and can assist you with code completion.


    To use the Ant editor, right click your build.xml (from the Project Explorer)
    and select Open with > Ant Editor. The Ant editor should look something similar
    to−


    ![Image](OEBPS/Image00001.jpg)


    The Ant editor lists the targets on the right hand side. The target list serves
    as a bookmark that allows you to jump straight into editing a particular target.


