  trans: "\n\n![](img/cover.jpeg)\n\n版权 © 版权所有\n\n未经出版者明确面许可，本书的任何部分均不得复制、存储在检索系统中，或以任何形式或通过任何手段（电子、机械、复印、录音或其他）进行传输。\n\
    \n我想将这本书献给将使用这本书的学生们。祝你们未来职业成功，并希望你们永停止学习。\n\n# 目录\n\n- 引言\n- 环境搭建\n- 构建文件\n-\
    \ 属性任务\n- 属性文件\n- 数据类型\n- 构建项目\n- 构建文档\n- 创建 JAR 文件\n- 创建 WAR 文件\n- 打包应用\n- 部署应用\n\
    - 执行 Java 代码\n- Eclipse 集成\n- JUnit 集成\n- 扩展 Ant\n\n# 引言\n\nANT 代表 **Another Neat**（另一个简洁）工具。它是来自计算机软件开发公司\
    \ Apache 的基于 Java 的构建工具。在进入 Apache Ant 的细节之前，让我们先了解为什么我们需要构建工具。\n\n## 构建工具的必要性\n\
    \n平均而言，开发者花费大量时间在构建和部署等琐碎任务上，包括：\n\n- 编译代码\n- 打包二进制文件\n- 将二进制文件部署到测试服务器\n- 测试更改\n\
    - 将代码从一个位置复制到另一个位置\n\n为了自动化和简化上述任务，Apache Ant 非常有用。它是一个操作系统的构建和部署工具，可以从命令行执行。\n\
    \n## Apache Ant 的历史\n\nAnt 是由软件开发者 James Duncan Davidson 创建的，他也是 Web 服务器应用 Tomcat\
    \ 的原始创建者。\n\nAnt 最初用于构建 Tomcat，并作为 Tomcat 分发的一部分被打包。\n\n它的诞生是为了解决 Apache Make\
    \ 工具相关的问题和复杂性。\n\n它在 2000 年作为 Apache 的独立项目被推广。截至 2020 年 9 月，Apache Ant 的最新版本为\
    \ **1.10.9**。\n\n## Apache Ant 的特性\n\nApache Ant 的特性列举如下：\n\n- 它是可用的最完整的 Java\
    \ 构建和部署工具。\n- 它是平台中性的，可以处理平台特定的属性，例如文件分隔符。\n- 它可以执行平台特定的任务，例如使用 `touch` 命令修改文件的修改时间。\n\
    - Ant 脚本使用纯 XML 编写。如果你已经熟悉 XML，你就可以很快学会 Ant。\n- Ant 擅长自动化处理复杂的重复性任务。\n- Ant 带有一个大量的预定义任务列表。\n\
    - Ant 提供了一个开发自定义任务的接口。\n- Ant 可以从命令行轻松调用，并可以与免费和商业 IDE 集成。\n\n# 环境搭建\n\nApache\
    \ Ant 根据 Apache Software License 进行分发，这是一项由开源倡议认证的完全开源许可。\n\n最新的 Apache Ant 版本（包括其完整源代码、类文件和文档）可以在\
    \ [`ant.apache.org`](https://ant.apache.org/) 找到。\n\n## 安装 Apache Ant\n\n假设你已经在计算机上下载并安装了\
    \ Java 开发工具包 (JDK)。如果没有，请遵循 `file:///C:/java/java_environment_setup.htm` 提供的说明。\n\
    \n- 确保环境变量 `JAVA_HOME` 设置为 JDK 安装所在的文件夹。\n- 从 [`ant.apache.org`](https://ant.apache.org/)\
    \ 下载二进制文件。\n- 使用 Winzip、winRAR、7-zip 或类似的工具将 zip 文件解压到方便的位置 `c:\\folder`。\n- 创建一个名为\
    \ `ANT_HOME` 的新环境变量，指向 Ant 安装文件夹。在这种情况下，它是 `c:\\apache-ant-1.10.9-bin` 文件夹。\n\
    - 将 Apache Ant 批处理路径添加到 `PATH` 环境变量中。在我们的案例中，这将是 `c:\\apache-ant-1.10.9-bin` 文件夹。\n\
    \n## 验证安装\n\n要验证 Ant 是否安装成功，在命令提示符上输入 `ant`。你应该看到下面的输出：\n\n```\nAnt(TM) version\
    \ 1.10.9 compiled on September 27 2020\n```\n\n## 安装 Eclipse\n\n教程还涵盖了 Ant 与 Eclipse\
    \ 开发环境 (IDE) 的集成。\n\n### 安装 Eclipse 的步骤\n\n- 从 [www.eclipse.org](https://www.eclipse.org/)\
    \ 下载最新的二进制文件。\n- 将二进制文件解压到方便的位置，例如 `c:\\folder`。\n- 运行 `eclipse.exe`。\n\n# 构建文件\n\
    \n通常 Ant 的构建文件 `build.xml` 位于项目根目录。然而，文件名或位置没有限制。对于本次练习，创建一个名为 `build.xml` 的文件，内容如下：\n\
    \n```xml\n<?xml version=\"1.0\"?>\n<project name=\"Hello World\" default=\"info\"\
    >\n  <target name=\"info\">\n    <echo>Hello - Welcome to Ant!</echo>\n  </target>\n\
    </project>\n```\n\n注意声明之前不应该有空行。如果你允许，执行 ant 时会出现以下错误：\n`The processing instruction\
    \ target matching is not allowed.`\n\n所有构建文件都需要 `project` 元素和至少一个 `target` 元素。\n\
    \nXML `project` 元素有三个属性：\n\n| 序序号 | 属性与描述 |\n| :--- | :--- |\n| 1 | `name`: 项目名称（可选）。\
    \ |\n| 2 | `default`: 构建脚本的默认目标。项目可以包含任意目标。此属性指定哪个目标应被视为默认目标（强制）。 |\n| 3 | `basedir`:\
    \ 项目的基础目录或根文件夹（可选）。 |\n\n目标（target）是你想要作为一个单元运行的任务集合。在我们的示例中，我们有一个简单的目标来向用户提供信息。\n\
    \n目标可以依赖于其他目标。例如，`deploy` 目标可能依赖 `package` 目标，`package` 目标可能依赖 `compile` 目标，依此类推。依赖关系使用\
    \ `depends` 属性表示。\n\n例如：\n\n```xml\n<target name=\"deploy\" depends=\"package\"\
    >\n</target>\n<target name=\"package\" depends=\"clean,compile\">\n</target>\n\
    <target name=\"clean\">\n</target>\n<target name=\"compile\">\n</target>\n```\n\
    \n`target` 元素具有以下属性：\n\n| 序序号 | 属性与描述 |\n| :--- | :--- |\n| 1 | `name`: 目标的名称（强制）。\
    \ |\n| 2 | `depends`: 此目标依赖的所有目标的逗号分隔列表（可选）。 |\n| 3 | `description`: 目标的简短描述（可选）。\
    \ |\n| 4 | `if`: 根据条件属性的真值允许执行目标（可选）。 |\n| 5 | `unless`: 将目标添加到指定扩展点的依赖列表中。扩展点与目标类似，但它包含任何任务（可选）。\
    \ |\n\n上述示例中的 `echo` 任务是一个打印消息的简单任务。在我们的示例中，它打印了消息 **Hello World**。\n\n"
- fmt: "\nTo run the ant build file, open up command prompt and navigate to the folder,\
    \ where the `build.xml` resides, and then type `ant info`. You could also type\
    \ `ant` instead. Both will work, because `info` is the default target in the build\
    \ file.\n\nYou should see the following output −\n\n```\nC:\\>ant\nBuildfile:\
    \ C:\\build.xml\ninfo: [echo] Hello World - Welcome to Apache Ant!\nBUILD SUCCESSFUL\n\
    Total time: 0 seconds\nC:\\>\n```\n\n# Property Task\n\nAnt build files are written\
    \ in XML, which does not allow declaring variables as you do in your favorite\
    \ programming language. However, as you may have imagined, it would be useful\
    \ if Ant allowed declaring variables such as project name, project source directory,\
    \ etc.\n\nAnt uses the `property` element which allows you to specify the properties.\
    \ This allows the properties to be changed from one build to another or from one\
    \ environment to another.\n\n## Ant Properties\n\nBy default, Ant provides the\
    \ following pre-defined properties that can be used in the build file −\n\n| Sr.No\
    \ | Properties & Description |\n| :--- | :--- |\n| 1 | `ant.file` - The full location\
    \ of the build file. |\n| 2 | `ant.version` - The version of the Apache Ant installation.\
    \ |\n| 3 | `basedir` - The basedir of the build, as specified in the `basedir`\
    \ attribute of the project element. |\n| 4 | `ant.java.version` - The version\
    \ of the JDK that is used by Ant. |\n| 5 | `ant.project.name` - The name of the\
    \ project, as specified in the `name` attribute of the project element. |\n| 6\
    \ | `ant.project.default-target` - The default target of the current project.\
    \ |\n| 7 | `ant.project.invoked-targets` - Comma separated list of the targets\
    \ that were invoked in the current project. |\n| 8 | `ant.core.lib` - The full\
    \ location of the Ant jar file. |\n| 9 | `ant.home` - The home directory of Ant\
    \ installation. |\n| 10 | `ant.library.dir` - The home directory for Ant library\
    \ files - typically `ANT_HOME/lib` folder. |\n\nAnt also makes the system properties\
    \ (Example: `file.separator`) available to the build file.\n\nIn addition to the\
    \ above, the user can define additional properties using the `property` element.\n\
    \nThe following example shows how to define a property called `sitename` −\n\n\
    ```xml\n<? xml version = \"1.0\" ?>\n<project name = \"Hello World Project\" default\
    \ = \"info\" >\n  <property name = \"sitename\" value = \"www.tutorialspoint.com\"\
    \ />\n  <target name = \"info\" >\n    <echo> Apache Ant version is ${ant.version}\
    \ - You are at ${sitename} </echo>\n  </target>\n</project>\n```\n\nRunning Ant\
    \ on the above build file produces the following output −\n\n```\nC:\\>ant\nBuildfile:\
    \ C:\\build.xml\ninfo: [echo] Apache Ant version is Apache Ant(TM) version 1.10.9\n\
    compiled on September 27 2020 - You are at www.tutorialspoint.com\nBUILD SUCCESSFUL\n\
    Total time: 0 seconds\nC:\\>\n```\n\n# Property Files\n\nSetting properties directly\
    \ in the build file is fine, if you are working with a handful of properties.\
    \ However, for a large project, it makes sense to store the properties in a separate\
    \ property file.\n\n## Benefits\n\nStoring the properties in a separate file offers\
    \ the following benefits −\n\n*   It allows you to reuse the same build file,\
    \ with different property settings for different execution environment. For example,\
    \ build properties file can be maintained separately for DEV, TEST, and PROD environments.\n\
    *   It is useful, when you do not know the values for a property (in a particular\
    \ environment) up-front. This allows you to perform the build in other environments,\
    \ where the property value is known.\n\nThere is no hard and fast rule, but typically\
    \ the property file is named as `build.properties` and is placed along-side the\
    \ `build.xml` file. You could create multiple build properties files based on\
    \ the deployment environments - such as `build.properties.dev` and `build.properties.test`.\n\
    \nThe contents of the build property file are similar to the normal java property\
    \ file. They contain one property per line. Each property is represented by a\
    \ name and a value pair.\n\nThe name and value pairs are separated by an equals\
    \ (`=`) sign. It is highly recommended that the properties are annotated with\
    \ proper comments. Comments are listed using the hash (`#`) character.\n\nThe\
    \ following example shows a `build.xml` file and its associated `build.properties`\
    \ file −\n\n### build.xml\n\nGiven below is an example for `build.xml` file.\n\
    \n```xml\n<? xml version = \"1.0\" ?>\n<project name = \"Hello World Project\"\
    \ default = \"info\" >\n  <property file = \"build.properties\" />\n  <target\
    \ name = \"info\" >\n    <echo> Apache Ant version is ${ant.version} - You are\
    \ at ${sitename} </echo>\n  </target>\n</project>\n```\n\n### build.properties\n\
    \nAn example for `build.properties` file is mentioned below −\n\n```properties\n\
    # The Site Name\nsitename=www.tutorialspoint.com\nbuildversion=3.3.2\n```\n\n\
    In the above example, `sitename` is a custom property which is mapped to the website\
    \ name. You can declare any number of custom properties in this fashion.\n\nAnother\
    \ custom property listed in the above example is `buildversion`, which, in this\
    \ instance, refers to the version of the build.\n\nIn addition to the above, Ant\
    \ comes with a number of predefined build properties, which are listed in the\
    \ previous section, but is given below once again for your reference.\n\n| Sr.No\
    \ | Properties & Description |\n| :--- | :--- |\n| 1 | `ant.file` The full location\
    \ of the build file. |\n| 2 | `ant.version` - The version of the Apache Ant installation.\
    \ |\n| 3 | `basedir` - The basedir of the build, as specified in the `basedir`\
    \ attribute of the project element. |\n| 4 | `ant.java.version` - The version\
    \ of the JDK that is used by Ant. |\n| 5 | `ant.project.name` - The name of the\
    \ project, as specified in the `name` attribute of the project element. |\n| 6\
    \ | `ant.project.default-target` - The default target of the current project.\
    \ |\n| 7 | `ant.project.invoked-targets` - Comma separated list of the targets\
    \ that were invoked in the current project. |\n| 8 | `ant.core.lib` - The full\
    \ location of the Ant jar file. |\n| 9 | `ant.home` - The home directory of Ant\
    \ installation. |\n| 10 | `ant.library.dir` - The home directory for Ant library\
    \ files - typically `ANT_HOME/lib` folder. |\n\nThe example presented in this\
    \ chapter uses the `ant.version` built-in property.\n\n# Data Types\n\nAnt provides\
    \ a number of predefined data types. Do not confuse the term \"data types\" with\
    \ those that are available in the programming language. Instead, consider them\
    \ as a set of services that are built into the product.\n\n## Data Types in Ant\n\
    \nThe following data types are provided by Apache Ant.\n\n### Fileset\n\nThe `fileset`\
    \ data type represents a collection of files. It is used as a filter to include\
    \ or exclude files that match a particular pattern.\n\nFor example, refer the\
    \ following code. Here the `src` attribute points to the source folder of the\
    \ project.\n\n```xml\n<fileset dir=\"${src}\" casesensitive=\"yes\">\n  <include\
    \ name=\"**/*.java\" />\n  <exclude name=\"**/*Stub*\" />\n</fileset>\n```\n\n\
    The `fileset` selects all `.java` files in the source folder except those contain\
    \ the word 'Stub'.The case-sensitive filter is applied to the fileset, which means\
    \ a file with the name `Samplestub.java` will not be excluded.\n\n### Pattern\
    \ set\n\nA `pattern set` is a pattern that allows to filter files or folders easily\
    \ based on certain patterns. The patterns can be created using the following meta\
    \ characters −\n\n*   `?` - Matches one character only.\n*   `*` - Matches zero\
    \ or many characters.\n*   `**` - Matches zero or many directories recursively.\n\
    \nThe following example depicts the usage of a pattern set.\n\n```xml\n<patternset\
    \ id=\"java.files.without.stubs\">\n  <include name=\"src/**/*.java\" />\n  <exclude\
    \ name=\"src/**/*Stub*\" />\n</patternset>\n```\n\nThe `patternset` can then be\
    \ reused with a `fileset` as follows −\n\n```xml\n<fileset dir=\"${src}\" casesensitive=\"\
    yes\">\n  <patternset refid=\"java.files.without.stubs\" />\n</fileset>\n```\n\
    \n### File list\n\nThe `filelist` data type is similar to the `fileset` except\
    \ the following differences −\n\n*   It contains explicitly named lists of files\
    \ and it does not support wild cards.\n*   This data type can be applied for existing\
    \ or non-existing files.\n"
  raw: 'To run the ant build file, open up command prompt and navigate to the folder,
    where the build.xml resides, and then type **ant info** . You could also type **ant**
     instead. Both will work,because **info**  is the default target in the build
    file.


    You should see the following output −


    C:\>ant


    Buildfile: C:\build.xml


    info: [echo] Hello World - Welcome to Apache Ant!


    BUILD SUCCESSFUL


    Total time: 0 seconds


    C:\>


    # Property Task


    Ant build files are written in XML, which does not allow declaring variables as
    you do in your favorite programming language. However, as you may have imagined,
    it would be useful if Ant allowed declaring variables such as project name, project
    source directory, etc.


    Ant uses the **property**  element which allows you to specify the properties.
    This allows the properties to be changed from one build to another or from one
    environment to another.


    ## Ant Properties


    By default, Ant provides the following pre-defined properties that can be used
    in the build file −


    | Sr.No | Properties & Description |


    | 1 | ant.fileThe full location of the build file. |


    | 2 | ant.versionThe version of the Apache Ant installation. |


    | 3 | basedirThe basedir of the build, as specified in the basedir attribute of
    the project element. |


    | 4 | ant.java.versionThe version of the JDK that is used by Ant. |


    | 5 | ant.project.nameThe name of the project, as specified in the name attribute
    of the project element. |


    | 6 | ant.project.default-targetThe default target of the current project. |


    | 7 | ant.project.invoked-targetsComma separated list of the targets that were
    invoked in the current project. |


    | 8 | ant.core.libThe full location of the Ant jar file. |


    | 9 | ant.homeThe home directory of Ant installation. |


    | 10 | ant.library.dirThe home directory for Ant library files - typically ANT_HOME/lib
    folder. |


    Ant also makes the system properties (Example: file.separator) available to the
    build file.


    In addition to the above, the user can define additional properties using the **property**
     element.


    The following example shows how to define a property called **sitename**  −


    <? xml version = "1.0" ?>


    <project name = "Hello World Project" default = "info" >


    <property name = "sitename" value = "www.tutorialspoint.com" />


    <target name = "info" >


    <echo> Apache Ant version is ${ant.version} - You are at ${sitename} </echo>


    </target>


    </project>


    Running Ant on the above build file produces the following output −


    C:\>ant


    Buildfile: C:\build.xml


    info: [echo] Apache Ant version is Apache Ant(TM) version 1.10.9


    compiled on September 27 2020 - You are at www.tutorialspoint.com


    BUILD SUCCESSFUL


    Total time: 0 seconds


    C:\>


    # Property Files


    Setting properties directly in the build file is fine, if you are working with
    a handful of properties. However, for a large project, it makes sense to store
    the properties in a separate property file.


    ## Benefits


    Storing the properties in a separate file offers the following benefits −


    *   It allows you to reuse the same build file, with different property settings
    for different execution environment. For example, build properties file can be
    maintained separately for DEV, TEST, and PROD environments.


    *   It is useful, when you do not know the values for a property (in a particular
    environment) up-front. This allows you to perform the build in other environments,
    where the property value is known.


    There is no hard and fast rule, but typically the property file is named as **build.properties**
     and is placed along-side the **build.xml**  file. You could create multiple build
    properties files based on the deployment environments - such as **build.properties.dev**
     and **build.properties.test** .


    The contents of the build property file are similar to the normal java property
    file. They contain one property per line. Each property is represented by a name
    and a value pair.


    The name and value pairs are separated by an equals (=) sign. It is highly recommended
    that the properties are annotated with proper comments. Comments are listed using
    the hash (#) character.


    The following example shows a **build.xml**  file and its associated **build.properties**
     file −


    ### build.xml


    Given below is an example for build.xml file.


    <? xml version = "1.0" ?>


    <project name = "Hello World Project" default = "info" >


    <property file = "build.properties" />


    <target name = "info" >


    <echo> Apache Ant version is ${ant.version} - You are at ${sitename} </echo>


    </target>


    </project>


    ### build.properties


    An example for build.properties file is mentioned below −


    # The Site Name


    sitename=www.tutorialspoint.com


    buildversion=3.3.2


    In the above example, **sitename**  is a custom property which is mapped to the
    website name. You can declare any number of custom properties in this fashion.


    Another custom property listed in the above example is the **buildversion** ,
    which, in this instance, refers to the version of the build.


    In addition to the above, Ant comes with a number of predefined build properties,
    which are listed in the previous section, but is given below once again for your
    reference.


    | Sr.No | Properties & Description |


    | 1 | ant.fileThe full location of the build file. |


    | 2 | ant.versionThe version of the Apache Ant installation. |


    | 3 | basedirThe basedir of the build, as specified in the basedir attribute of
    the project element. |


    | 4 | ant.java.versionThe version of the JDK that is used by Ant. |


    | 5 | ant.project.nameThe name of the project, as specified in the name attribute
    of the project element. |


    | 6 | ant.project.default-targetThe default target of the current project. |


    | 7 | ant.project.invoked-targetsComma separated list of the targets that were
    invoked in the current project. |


    | 8 | ant.core.libThe full location of the Ant jar file. |


    | 9 | ant.homeThe home directory of Ant installation. |


    | 10 | ant.library.dirThe home directory for Ant library files - typically ANT_HOME/lib
    folder. |


    The example presented in this chapter uses the **ant.version**  built-in property.


    # Data Types


    Ant provides a number of predefined data types. Do not confuse the term "data
    types" with those that are available in the programming language. Instead, consider
    them as a set of services that are built into the product already.


    ## Data Types in Ant


    The following data types are provided by Apache Ant.


    ### Fileset


    The fileset data type represents a collection of files. It is used as a filter
    to include or exclude files that match a particular pattern.


    For example, refer the following code. Here, the src attribute points to the source
    folder of the project.


    <fileset dir = "${src}" casesensitive = "yes" >


    <include name = "**/*.java" />


    <exclude name = "**/*Stub*" />


    </fileset>


    The fileset selects all .java files in the source folder except those contain
    the word ''Stub''.The case-sensitive filter is applied to the fileset, which means
    a file with the name Samplestub.java will not be excluded from the fileset.


    ### Pattern set


    A pattern set is a pattern that allows to filter files or folders easily based
    on certain patterns. The patterns can be created using the following meta characters
    −


    *   ? - Matches one character only.


    *   - Matches zero or many characters.


    *   ** - Matches zero or many directories recursively.


    The following example depicts the usage of a pattern set.


    <patternset id = "java.files.without.stubs" >


    <include name = "src/**/*.java" />


    <exclude name = "src/**/*Stub*" />


    </patternset>


    The patternset can then be reused with a fileset as follows −


    <fileset dir = "${src}" casesensitive = "yes" >


    <patternset refid = "java.files.without.stubs" />


    </fileset>


    ### File list


    The filelist data type is similar to the file set except the following differences
    −


    *   It contains explicitly named lists of files and it does not support wild cards.


    *   This data type can be applied for existing or non-existing files.'
