  trans: "\nJUnit 是基于 Java 开发中常用的单元测试框架。它易于使用且易于扩展。有许多 JUnit 扩展可用。如果你不熟悉 JUnit，应该从\
    \ [www.junit.org](https://junit.org/junit5/) 下载并阅读其手册。\n\n本章将展示如何使用 Ant 执行 JUnit\
    \ 测试。使用 Ant 使得通过 `junit` 任务执行测试变得直观简单。\n\n`junit` 任务的属性如下所示 −\n\n| 序号 | 属性与描述\
    \ |\n| :--- | :--- |\n| 1 | `dir` 指定调用虚拟机（VM）的目录。当禁用 `fork` 时会忽略此属性。 |\n| 2 |\
    \ `jvmCommand` 用于调用 JVM。当禁用 `fork` 时会忽略此属性。 |\n| 3 | `fork` 在独立的 JVM 中运行测试。 |\n\
    | 4 | `errorproperty` 当发生 JUnit 错误时设置的属性名称。 |\n| 5 | `failureproperty` 当发生 JUnit\
    \ 失败时设置的属性名称。 |\n| 6 | `haltonerror` 发生测试错误时停止执行。 |\n| 7 | `haltonfailure` 发生失败时停止执行。\
    \ |\n| 8 | `printsummary` 建议 Ant 显示每个测试的简单统计信息。 |\n| 9 | `showoutput` 建议 Ant 将输出发送到日志和格式化器。\
    \ |\n| 10 | `tempdir` Ant 将使用的临时文件路径。 |\n| 11 | `timeout` 退出运行时间超过此设置（毫秒）的测试。\
    \ |\n\n让我们继续 Hello World Fax 应用程序，并添加一个 JUnit 目标（target）。\n\n以下示例展示了一个简单的 JUnit\
    \ 测试执行 −\n\n```xml\n<target name = \"unittest\" >\n  <junit haltonfailure = \"\
    true\" printsummary = \"true\" >\n    <test name = \"com.tutorialspoint.UtilsTest\"\
    \ />\n  </junit>\n</target>\n```\n\n此示例展示了在 `com.tutorialspoint.UtilsTest` junit\
    \ 类上执行 JUnit。\n\n运行上述代码会产生以下输出 −\n\n```\ntest:\n[echo] Testing the application\n\
    [junit] Running com.tutorialspoint.UtilsTest\n[junit] Tests run: 12, Failures:\
    \ 0, Errors: 0, Time elapsed: 16.2 sec\nBUILD PASSED\n```\n\n# 扩展 Ant\n\nAnt 自带了一组预定义的任务，但你可以像下面的示例所示创建你自己的任务。\n\
    \n自定义 Ant 任务应该继承 `org.apache.tools.ant.Task` 类并扩展 `execute()` 方法。\n\n下面是一个简单的示例\
    \ −\n\n```java\npackage com.tutorialspoint.ant;\n\nimport org.apache.tools.ant.Task;\n\
    import org.apache.tools.ant.Project;\nimport org.apache.tools.ant.BuildException;\n\
    \npublic class MyTask extends Task {\n    String message;\n    public void execute()\
    \ throws BuildException {\n        log(\"Message: \" + message, Project.MSG_INFO);\n\
    \    }\n    public void setMessage(String message) {\n        this.message = message;\n\
    \    }\n}\n```\n\n要执行自定义任务，你需要在 Hello World Fax 应用程序中添加以下内容 −\n\n```xml\n<target\
    \ name = \"custom\" >\n  <taskdef name = \"custom\" classname = \"com.tutorialspoint.ant.MyTask\"\
    \ />\n  <custom message = \"Hello World!\" />\n</target>\n```\n\n执行上述自定义任务会打印消息\
    \ 'Hello World!'\n\n```\nc : >ant custom\ntest :\n[ custom ] Message : Hello World\
    \ !\nelapsed : 0.2 sec\nBUILD PASSED\n```\n\n这只是一个简单的示例。你可以利用 Ant 的功能来做任何你想改进构建和部署过程的事情。\n\
    \n"
