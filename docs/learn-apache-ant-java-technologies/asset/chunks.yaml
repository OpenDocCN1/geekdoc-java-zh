    \ This folder contains the image files\n+---META-INF This folder contains the\
    \ Manifest.Mf\n+---WEB-INF\n+---classes This folder contains the compiled classes\n\
    +---lib Third party libraries and the utility jar files\n`WEB.xml` Configuration\
    \ file that defines the WAR package\n\n# Packaging Applications\n\nWe have learnt\
