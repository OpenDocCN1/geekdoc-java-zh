- fmt: "\nYou could filter the javadoc process to show only the public, private, package,\
    \ or protected classes and members. This is achieved by using the `private`, `public`,\
    \ `package` and `protected` attributes.\n\nYou could also tell the javadoc task\
    \ to include the author and version information by using the respective attributes.\n\
    \nYou could also group the packages together using the `group` attribute, so that\
    \ it becomes easy to navigate.\n\n## Putting it all together\n\nLet us continue\
    \ our theme of the `Hello world` Fax application and add a documentation target\
    \ to our Fax application project.\n\nGiven below is an example javadoc task used\
    \ in our project. In this example, we have specified the javadoc to use the `src.dir`\
    \ as the source directory, and `doc` as the target.\n\nWe have also customised\
    \ the window title, the header, and the footer information that appear on the\
    \ java documentation pages.\n\nAlso, we have created three groups –\n\n* one for\
    \ the utility classes in our source folder,\n* one for the user interfaces classes,\
    \ and\n* one for the database related classes.\n\nYou may notice that the data\
    \ package group has two packages – `faxapp.entity` and `faxapp.dao`.\n\n```\n\
    <target name = \"generate-javadoc\" >\n<javadoc packagenames = \"faxapp.*\" sourcepath\
    \ = \"${src.dir}\"\ndestdir = \"doc\" version = \"true\" windowtitle = \"Fax Application\"\
    \ >\n<doctitle> <![CDATA[= Fax Application =]]> </doctitle>\n<bottom>\n<![CDATA[Copyright\
    \ © 2011\\. All Rights Reserved.]]>\n</bottom>\n<group title = \"util packages\"\
    \ packages = \"faxapp.util.*\" />\n<group title = \"web packages\" packages =\
    \ \"faxapp.web.*\" />\n<group title = \"data packages\" packages = \"faxapp.entity.*:faxapp.dao.*\"\
    \ />\n</javadoc>\n<echo message = \"java doc has been generated!\" />\n</target>\n\
    ```\n\nLet us execute the javadoc Ant task. It generates and places the java documentation\
    \ files in the `doc` folder.\n\nWhen the `javadoc target` is executed, it produces\
    \ the following outcome –\n\n```\nC : \\>ant generate - javadoc\nBuildfile : C\
    \ : \\build . xml\njava doc has been generated !\nBUILD SUCCESSFUL\nTotal time\
    \ : 10.63 second\n```\n\nThe java documentation files are now present in the `doc`\
    \ folder.\n\nTypically, the javadoc files are generated as a part of the release\
    \ or package targets.\n\n## Creating JAR files\n\nThe next logical step after\
    \ compiling your java source files, is to build the java archive, i.e., the Java\
    \ Archive (JAR) file. Creating JAR files with Ant is quite easy with the `jar`\
    \ task.\n\n## Attributes\n\nThe commonly used attributes of the `jar` task are\
    \ as follows –\n\n| Sr.No | Attributes & Description |\n| :--- | :--- |\n| 1 |\
    \ basedir: The base directory for the output JAR file. By default, this is set\
    \ to the base directory of the project. |\n| 2 | compress: Advises Ant to compress\
    \ the file as it creates the JAR file. |\n| 3 | keepcompression: While the `compress`\
    \ attribute is applicable to the individual files, the `keepcompression` attribute\
    \ does the same thing, but it applies to the entire archive. |\n| 4 | destfile:\
    \ The name of the output JAR file. |\n| 5 | duplicate: Advises Ant on what to\
    \ do when duplicate files are found. You could add, preserve, or fail the duplicate\
    \ files. |\n| 6 | excludes: Advises Ant to not include these comma separated list\
    \ of files in the package. |\n| 7 | excludesfile: Same as above, except the exclude\
    \ files are specified using a pattern. |\n| 8 | inlcudes: Inverse of `excludes`.\
    \ |\n| 9 | includesfile: Inverse of `excludesfile`. |\n| 10 | update: Advises\
    \ Ant to overwrite files in the already built JAR file. |\n\nContinuing our `Hello\
    \ World` Fax Application project, let us add a new target to produce the jar files.\n\
    \nBut before that, let us consider the `jar` task given below.\n\n```\n<jar destfile\
    \ = \"${web.dir}/lib/util.jar\"\nbasedir = \"${build.dir}/classes\"\nincludes\
    \ = \"faxapp/util/**\"\nexcludes = \"**/Test.class\"\n/>\n```\n\nHere, the `web.dir`\
    \ property points to the path of the web source files. In our case, this is where\
    \ the `util.jar` will be placed.\n\nThe `build.dir` property in this example,\
    \ points to the build folder, where the class files for the `util.jar` can be\
    \ found.\n\nIn this example, we create a jar file called `util.jar` using the\
    \ classes from the `faxapp.util.*` package. However, we are excluding the classes\
    \ that end with the name `Test`. The output jar file will be placed in the web\
    \ application lib folder.\n\nIf we want to make the `util.jar` an executable jar\
    \ file, we need to add the `manifest` with the `Main-Class` meta attribute.\n\n\
    Therefore, the above example will be updated as follows –\n\n```\n<jar destfile=\"\
    ${web.dir}/lib/util.jar\"\nbasedir=\"${build.dir}/classes\"\nincludes=\"faxapp/util/**\"\
    \nexcludes=\"**/Test.class\" class=\"ts\"\n<manifest class=\"ts\">\n<attribute\
    \ name=\"Main-Class\" value=\"com.example.Main\"/>\n</manifest>\n``` (Wait, the\
    \ source text had incomplete XML, maintaining provided structure)\n\nLet us execute\
