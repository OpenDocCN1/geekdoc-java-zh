  raw: 'You could filter the javadoc process to show only the public, private, package,
    or protected classes and members. This is achieved by using the **private** , **public**
    , **package**  and **protected**  attributes.


    You could also tell the javadoc task to include the author and version information
    by using the respective attributes.


    You could also group the packages together using the group attribute, so that
    it becomes easy to navigate.


    ## Putting it all together


    Let us continue our theme of the **Hello world**  Fax application and add a documentation
    target to our Fax application project.


    Given below is an example javadoc task used in our project. In this example, we
    have specified the javadoc to use the **src.dir**  as the source directory, and **doc**
     as the target.


    We have also customised the window title, the header, and the footer information
    that appear on the java documentation pages.


    Also, we have created three groups −


    *   one for the utility classes in our source folder,


    *   one for the user interfaces classes, and


    *   one for the database related classes.


    You may notice that the data package group has two packages -– faxapp.entity and
    faxapp.dao.


    <target name = "generate-javadoc" >


    <javadoc packagenames = "faxapp.*" sourcepath = "${src.dir}"


    destdir = "doc" version = "true" windowtitle = "Fax Application" >


    <doctitle> <![CDATA[= Fax Application =]]> </doctitle>


    <bottom>


    <![CDATA[Copyright © 2011\. All Rights Reserved.]]>


    </bottom>


    <group title = "util packages" packages = "faxapp.util.*" />


    <group title = "web packages" packages = "faxapp.web.*" />


    <group title = "data packages" packages = "faxapp.entity.*:faxapp.dao.*" />


    </javadoc>


    <echo message = "java doc has been generated!" />


    </target>


    Let us execute the javadoc Ant task. It generates and places the java documentation
    files in the doc folder.


    When the **javadoc target**  is executed, it produces the following outcome −


    C : \>ant generate - javadoc


    Buildfile : C : \build . xml


    java doc has been generated !


    BUILD SUCCESSFUL


    Total time : 10.63 second


    The java documentation files are now present in the **doc**  folder.


    Typically, the javadoc files are generated as a part of the release or package
    targets.


    # Creating JAR files


    The next logical step after compiling your java source files, is to build the
    java archive, i.e., the Java Archive (JAR) file. Creating JAR files with Ant is
    quite easy with the **jar**  task.


    ## Attributes


    The commonly used attributes of the jar task are as follows −


    | Sr.No | Attributes & Description |


    | 1 | basedirThe base directory for the output JAR file. By default, this is set
    to the base directory of the project. |


    | 2 | compressAdvises Ant to compress the file as it creates the JAR file. |


    | 3 | keepcompressionWhile the compress attribute is applicable to the individual
    files, the keepcompression attribute does the same thing, but it applies to the
    entire archive. |


    | 4 | destfileThe name of the output JAR file. |


    | 5 | duplicateAdvises Ant on what to do when duplicate files are found. You could
    add, preserve, or fail the duplicate files. |


    | 6 | excludesAdvises Ant to not include these comma separated list of files in
    the package. |


    | 7 | excludesfileSame as above, except the exclude files are specified using
    a pattern. |


    | 8 | inlcudesInverse of excludes. |


    | 9 | includesfileInverse of excludesfile. |


    | 10 | updateAdvises Ant to overwrite files in the already built JAR file. |


    Continuing our **Hello World**  Fax Application project, let us add a new target
    to produce the jar files.


    But before that, let us consider the jar task given below.


    <jar destfile = "${web.dir}/lib/util.jar"


    basedir = "${build.dir}/classes"


    includes = "faxapp/util/**"


    excludes = "**/Test.class"


    />


    Here, the **web.dir**  property points to the path of the web source files. In
    our case, this is where the util.jar will be placed.


    The **build.dir**  property in this example, points to the build folder, where
    the class files for the **util.jar**  can be found.


    In this example, we create a jar file called util.jar using the classes from the **faxapp.util.***
     package. However, we are excluding the classes that end with the name Test. The
    output jar file will be placed in the web application lib folder.


    If we want to make the util.jar an executable jar file, we need to add the **manifest**
     with the **Main-Class**  meta attribute.


    Therefore, the above example will be updated as follows −


    <jar destfile="${web.dir}/lib/util.jar"


    basedir="${build.dir}/classes"


    includes="faxapp/util/**"


    excludes="**/Test.class" class="ts"


    <manifest class="ts"


    <attribute name = "Main-Class" value = "com.tutorialspoint.util.FaxUtil" />


    </manifest class="ts"


    </jar class="ts"


    To execute the jar task, wrap it inside a target, most commonly, the build or
    package target, and execute them.


    <target name="build-jar" class="ts"


    <jar destfile="${web.dir}/lib/util.jar"


    basedir="${build.dir}/classes"


    includes="faxapp/util/**"


    excludes="**/Test.class" class="ts"


    <manifest class="ts"


    <attribute name = "Main-Class" value = "com.tutorialspoint.util.FaxUtil" />


    </manifest class="ts"


    </jar class="ts"


    </target class="ts"


    Running Ant on this file creates the util.jar file for us.


    The following outcome is the result of running the Ant file −


    C : \ class = "ts" ant build - jar


    Buildfile : C : \build . xml


    BUILD SUCCESSFUL


    Total time : 1.3 seconds


    The util.jar file is now placed in the output folder.


    # Create WAR Files


    Creating Web Archive (WAR) files with Ant is extremely simple, and very similar
    to the creating JAR files task. After all, WAR file, like JAR file is just another
    ZIP file.


    The WAR task is an extension to the JAR task, but it has some nice additions to
    manipulate what goes into the WEB-INF/classes folder, and generating the web.xml
    file. The WAR task is useful to specify a particular layout of the WAR file.


    Since, the WAR task is an extension of the JAR task, all attributes of the JAR
    task apply to the WAR task.


    | Sr.No | Attributes & Description |


    | 1 | webxmlPath to the web.xml file. |


    | 2 | libA grouping to specify what goes into the WEB-INF\lib folder. |


    | 3 | classesA grouping to specify what goes into the WEB-INF\classes folder.
    |


    | 4 | metainfSpecifies the instructions for generating the MANIFEST.MF file. |


    Continuing our **Hello World**  Fax Application project, let us add a new target
    to produce the jar files. But before that, let us consider the war task.


    Consider the following example −


    <war destfile = "fax.war" webxml = "${web.dir}/web.xml" >


    <fileset dir = "${web.dir}/WebContent" >


    <include name = "**/*.*" />


    </fileset>


    <lib dir = "thirdpartyjars" >


    <exclude name = "portlet.jar" />


    </lib>


    <classes dir = "${build.dir}/web" />


    </war>


    As per the previous examples, the **web.dir**  variable refers to the source web
    folder, i.e., the folder that contains the JSP, css, javascript files etc.


    The **build.dir**  variable refers to the output folder. This is where the classes
    for the WAR package can be found. Typically, the classes will be bundled into
    the WEB-INF/classes folder of the WAR file.


    In this example, we are creating a war file called **fax.war** . The WEB.XML file
    is obtained from the web source folder. All files from the ''WebContent'' folder
    under web are copied into the WAR file.


    The WEB-INF/lib folder is populated with the jar files from the thirdpartyjars
    folder. However, we are excluding the portlet.jar as this is already present in
    the application server''s lib folder. Finally, we are copying all classes from
    the build directory''s web folder and putting them into the WEB-INF/classes folder.


    Wrap the war task inside an Ant target (usually package) and run it. This will
    create the WAR file in the specified location.'
