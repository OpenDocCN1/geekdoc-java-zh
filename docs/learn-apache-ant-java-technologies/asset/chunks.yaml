  raw: 'Let us see the following example of the filelist data type. Here, the attribute **webapp.src.folder**
     points to the web application source folder of the project.


    <filelist id = "config.files" dir = "${webapp.src.folder}" >


    <file name = "applicationConfig.xml" />


    <file name = "faces-config.xml" />


    <file name = "web.xml" />


    <file name = "portlet.xml" />


    </filelist>


    ### Filter set


    By using a filterset data type along with the copy task, you can replace certain
    text in all the files that matches the pattern with a replacement value.


    A common example is to append the version number to the release notes file, as
    shown in the following code.


    <copy todir = "${output.dir}" >


    <fileset dir = "${releasenotes.dir}" includes = "**/*.txt" />


    <filterset>


    <filter token = "VERSION" value = "${current.version}" />


    </filterset>


    </copy>


    In the above mentioned code −


    *   The attribute **output.dir**  points to the output folder of the project.


    *   The attribute **releasenotes.dir**  points to the release notes folder of
    the project.


    *   The attribute **current.version**  points to the current version folder of
    the project.


    *   The copy task, as the name suggests, is used to copy files from one location
    to another.


    ### Path


    The **path**  data type is commonly used to represent a class-path. Entries in
    the path are separated using semicolons or colons. However, these characters are
    replaced at the runtime by the executing system''s path separator character.


    The classpath is set to the list of jar files and classes in the project, as shown
    in the example below.


    <path id = "build.classpath.jar" >


    <pathelement path = "${env.J2EE_HOME}/${j2ee.jar}" />


    <fileset dir = "lib" >


    <include name = "**/*.jar" />


    </fileset>


    </path>


    In the code given above −


    *   The attribute **env.J2EE_HOME**  points to the environment variable **J2EE_HOME**
    .


    *   The attribute **j2ee.jar**  points to the name of the J2EE jar file in the
    J2EE base folder.


    # Building Projects


    Now that we have learnt about the data types in Ant, it is time to put that knowledge
    into practice. We will build a project in this chapter. The aim of this chapter
    is to build an Ant file that compiles the java classes and places them in the
    WEB-INF\classes folder.


    Consider the following project structure −


    *   The database scripts are stored in the **db**  folder.


    *   The java source code is stored in the **src**  folder.


    *   The images, js, META-INF, styles (css) are stored in the **war**  folder.


    *   The Java Server Pages (JSPs) are stored in the **jsp**  folder.


    *   The third party jar files are stored in the **lib**  folder.


    *   The java class files are stored in the **WEB-INF\classes**  folder.


    This project forms the **Hello World**  Fax Application for the rest of this tutorial.


    C:\work\FaxWebApplication>tree


    Folder PATH listing


    Volume serial number is 00740061 EC1C:ADB1


    C:.


    +---db


    +---src


    . +---faxapp


    . +---dao


    . +---entity


    . +---util


    . +---web


    +---war


    +---images


    +---js


    +---META-INF


    +---styles


    +---WEB-INF


    +---classes


    +---jsp


    +---lib


    Here is the **build.xml**  required for this project. Let us consider it piece
    by piece.


    <? xml version = "1.0" ?>


    <project name = "fax" basedir = "." default = "build" >


    <property name = "src.dir" value = "src" />


    <property name = "web.dir" value = "war" />


    <property name = "build.dir" value = "${web.dir}/WEB-INF/classes" />


    <property name = "name" value = "fax" />


    <path id = "master-classpath" >


    <fileset dir = "${web.dir}/WEB-INF/lib" >


    <include name = "*.jar" />


    </fileset>


    <pathelement path = "${build.dir}" />


    </path>


    <target name = "build" description = "Compile source tree java files" >


    <mkdir dir = "${build.dir}" />


    <javac destdir = "${build.dir}" source = "1.5" target = "1.5" >


    <src path = "${src.dir}" />


    <classpath refid = "master-classpath" />


    </javac>


    </target>


    <target name = "clean" description = "Clean output directories" >


    <delete>


    <fileset dir = "${build.dir}" >


    <include name = "**/*.class" />


    </fileset>


    </delete>


    </target>


    </project>


    First, let us declare some properties for the source, web, and build folders.


    <property name="src.dir" value="src"/>


    <property name="web.dir" value="war"/>


    <property name="build.dir" value="${web.dir}/WEB-INF/classes"/>


    In the above mentioned example −


    *   src.dir refers to the source folder of the project, where the java source
    files can be found.


    *   web.dir refers to the web source folder of the project, where you can find
    the JSPs,web.xml, css, javascript and other web related files


    *   build.dir refers to the output folder of the project compilation.


    Properties can refer to other properties. As shown in the above example, the **build.dir**
     property makes a reference to the **web.dir**  property.


    In this example, the **src.dir**  refers to the source folder of the project.


    The default target of our project is the **compile**  target. But first, let us
    look at the **clean**  target.


    The clean target, as the name suggests, deletes the files in the build folder.


    <target name = "clean" description = "Clean output directories" >


    <delete>


    <fileset dir = "${build.dir}" >


    <include name = "**/*.class" />


    </fileset>


    </delete>


    </target>


    The master-classpath holds the classpath information. In this case, it includes
    the classes in the build folder and the jar files in the lib folder.


    <path id = "master-classpath" >


    <fileset dir = "${web.dir}/WEB-INF/lib" >


    <include name = "*.jar" />


    </fileset>


    <pathelement path = "${build.dir}" />


    </path>


    Finally, the build targets to build the files.


    First of all, we create the build directory, if it does not exist, then, we execute
    the javac command (specifying jdk1.5 as our target compilation). We supply the
    source folder and the classpath to the javac task and ask it to drop the class
    files in the build folder.


    <target name = "build" description = "Compile main source tree java files" >


    <mkdir dir = "${build.dir}" />


    <javac destdir = "${build.dir}" source = "1.5" target = "1.5"


    debug = "true" deprecation = "false" optimize = "false" failonerror = "true" >


    <src path = "${src.dir}" />


    <classpath refid = "master-classpath" />


    </javac>


    </target>


    Executing Ant on this file compiles the java source files and places the classes
    in the build folder.


    The following outcome is the result of running the Ant file −


    C : \>ant


    Buildfile : C : \build . xml


    BUILD SUCCESSFUL


    Total time : 6.3 seconds


    The files are compiled and placed in the **build.dir**  folder.


    # Build Documentation


    Documentation is a must in any project. Documentation plays a great role in the
    maintenance of a project. Java makes documentation easier by the use of the inbuilt **javadoc**
     tool. Ant makes it even easier by generating the documentation on demand.


    As you know, the javadoc tool is highly flexible and allows a number of configuration
    options. Ant exposes these configuration options via the javadoc task. If you
    are unfamiliar with javadocs, we suggest that you start with this Java Documentation
    Tutorial.


    The following section lists the most commonly used javadoc options that are used
    in Ant.


    ## Attributes


    Source can be specified using **sourcepath** , **sourcepathref**  or **sourcefiles**
    .


    *   **sourcepath**  is used to point to the folder of the source files (e.g. src
    folder).


    *   **sourcepathref**  is used to refer a path that is referenced by the path
    attribute (e.g, delegates.src.dir).


    *   **sourcefiles**  is used when you want to specify the individual files as
    a comma separated list.


    Destination path is specified using the **destdir**  folder (e.g build.dir).


    You could filter the **javadoc**  task by specifying the package names which are
    to be included. This is achieved by using the **packagenames**  attribute, a comma
    separated list of package files.'
