    \ code](#text00015.html_id_Toc67988461)\n- [Eclipse Integration](#text00016.html_id_Toc67988462)\n\
    - [JUnit Integration](#text00017.html_id_Toc67988463)\n- [Extending Ant](#text00018.html_id_Toc67988464)\n\
    \n# Introduction\n\nANT stands for **Another Neat** Tool. It is a Java-based build\
    \ tool from computer software development company Apache. Before going into the\
    \ details of Apache Ant, let us first understand why we need a build tool.\n\n\
    ## Need for a Build Tool\n\nOn an average, a developer spends a substantial amount\
    \ of time doing mundane tasks like build and deployment that include −\n\n- Compiling\
    \ the code\n- Packaging the binaries\n- Deploying the binaries to the test server\n\
    - Testing the changes\n- Copying the code from one location to another\n\nTo automate\
    \ and simplify the above tasks, Apache Ant is useful. It is an Operating System\
    \ build and deployment tool that can be executed from the command line.\n\n##\
    \ History of Apache Ant\n\nAnt was created by software developer James Duncan\
    \ Davidson who is also the original creator of webserver application Tomcat.\n\
    \nAnt was originally used to build Tomcat, and was bundled as a part of Tomcat\
    \ distribution.\n\nIt was born out of the problems and complexities associated\
    \ with the Apache Make tool.\n\nIt was promoted as an independent project in Apache\
    \ in the year 2000. The latest version of Apache Ant as on September 2020 is **1.10.9**.\n\
    \n## Features of Apache Ant\n\nThe features of Apache Ant are listed below −\n\
    \n- It is the most complete Java build and deployment tool available.\n- It is\
    \ platform neutral and can handle platform specific properties, such as file separators.\n\
    - It can be used to perform platform specific tasks such as modifying the modified\
    \ time of a file using `touch` command.\n- Ant scripts are written using plain\
    \ XML. If you are already familiar with XML, you can learn Ant pretty quickly.\n\
    - Ant is good at automating complicated repetitive tasks.\n- Ant comes with a\
    \ big list of predefined tasks.\n- Ant provides an interface to develop custom\
    \ tasks.\n- Ant can be easily invoked from the command line and it can integrate\
    \ with free and commercial IDEs.\n\n# Environment Setup\n\nApache Ant is distributed\
    \ under the Apache Software License which is a fully-fledged open source license\
    \ certified by the open source initiative.\n\nThe latest Apache Ant version, including\
    \ its full-source code, class files, and documentation can be found at [https://ant.apache.org](https://ant.apache.org/).\n\
    \n## Installing Apache Ant\n\nIt is assumed that you have already downloaded and\
    \ installed Java Development Kit (JDK) on your computer. If not, please follow\
    \ the instructions available at `file:///C:/java/java_environment_setup.htm`.\n\
    \n- Ensure that the `JAVA_HOME` environment variable is set to the folder, where\
    \ your JDK is installed.\n- Download the binaries from [https://ant.apache.org](https://ant.apache.org/).\n\
    - Unzip the zip file to a convenient location `c:\\folder` by using Winzip, winRAR,\
    \ 7-zip or similar tools.\n- Create a new environment variable called `ANT_HOME`\
    \ that points to the Ant installation folder. In this case, it is `c:\\apache-ant-1.10.9-bin`\
    \ folder.\n- Append the path to the Apache Ant batch file to the `PATH` environment\
    \ variable. In our case, this would be the `c:\\apache-ant-1.10.9-bin\\bin` folder.\n\
    \n## Verifying the Installation\n\nTo verify the successful installation of Ant,\
    \ type `ant` on your command prompt. You should see output below:\n\n```\nAnt(TM)\
    \ version 1.10.9 compiled on September 27 2020\n```\n\n## Installing Eclipse\n\
    \nThis tutorial also covers integration of Ant with Eclipse development environment\
    \ (IDE).\n\n### Steps to install Eclipse\n\n- Download the latest binaries from\
    \ [www.eclipse.org](https://www.eclipse.org/)\n- Unzip the binaries to a convenient\
    \ location, say `c:\\folder`.\n- Run `eclipse.exe`.\n\n# Build Files\n\nTypically,\
    \ Ant's build file, called `build.xml`, should reside in the base directory of\
    \ the project. However, there is no restriction on the file name or its location.\
    \ For this exercise, create a file called `build.xml` anywhere with the following\
    \ contents:\n\n```xml\n<?xml version=\"1.0\"?>\n<project name=\"Hello World\"\
    \ default=\"info\">\n  <target name=\"info\">\n    <echo>Hello - Welcome to Ant!</echo>\n\
    \  </target>\n</project>\n```\n\nNote that there should be no blank line(s) before\
    \ the xml declaration. If you allow them, the following error occurs while executing\
    \ the ant:\n`The processing instruction target matching \"[xX][mM]\" is not allowed.`\n\
    \nAll build files require the `project` element and at least one `target` element.\n\
    \nThe XML `project` element has three attributes:\n\n| Sr.No | Attributes & Description\
    \ |\n| :--- | :--- |\n| 1 | `name`: Name of the project (Optional). |\n| 2 | `default`:\
    \ The default target for the build script. A project may contain any number of\
    \ targets. This attribute specifies which target should be considered as the default\
    \ (Mandatory). |\n| 3 | `basedir`: The base directory or the root folder for the\
    \ project (Optional). |\n\nA target is a collection of tasks that you want to\
    \ run as one unit. In our example, we have a simple target to provide an informational\
    \ message to the user.\n\nTargets can have dependencies on other targets. For\
    \ example, a `deploy` target may have a dependency on the `package` target, the\
    \ `package` target may have a dependency on the `compile` target and so forth.\
    \ Dependencies are denoted using the `depends` attribute.\n\nFor example:\n\n\
    ```xml\n<target name=\"deploy\" depends=\"package\">\n</target>\n<target name=\"\
    package\" depends=\"clean,compile\">\n</target>\n<target name=\"clean\">\n</target>\n\
    <target name=\"compile\">\n</target>\n```\n\nThe `target` element has the following\
    \ attributes:\n\n| Sr.No | Attributes & Description |\n| :--- | :--- |\n| 1 |\
    \ `name`: The name of the target (Required). |\n| 2 | `depends`: Comma separated\
    \ list of all targets that this target depends on (Optional). |\n| 3 | `description`:\
    \ A short description of the target (optional). |\n| 4 | `if`: Allows the execution\
    \ of a target based on the trueness of a conditional attribute (optional). |\n\
    | 5 | `unless`: Adds the target to the dependency list of the specified Extension\
    \ Point. An Extension Point is similar to a target, but it does not have any tasks\
    \ (Optional). |\n\nThe `echo` task in the above example is a trivial task that\
    \ prints a message. In our example, it prints the message **Hello World**.\n"
