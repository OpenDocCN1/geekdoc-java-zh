    \ operator\n    - 4.4 Logical Operators\n    - 4.5 Ternocular Operator\n- 5. Java\
    \ Statement\n    - 5.1 If statements\n    - 5.2 Switch statement\n    - 5.3 While\
    \ loop statement\n    - 5.4 Do while loop\n    - 5.5 For loop statement\n- 6.\
    \ Java array\n    - 6.1 One-dimensional array\n    - 6.2 One-dimensional array\
    \ append element\n    - 6.3 One-dimensional array remove elements\n    - 6.4 Bubble\
    \ sort algorithm\n    - 6.5 Two-dimensional array\n    - 6.6 Examples: Minesweeper\n\
    - 7. Java Object-Oriented\n    - 7.1 Encapsulation\n    - 7.2 Methods Encapsulation\n\
    \    - 7.3 Construction method\n    - 7.4 Method overload\n    - 7.5 Passed by\
    \ reference\n    - 7.6 Static keyword\n    - 7.7 Code block\n    - 7.8 Inheritance\n\
    \    - 7.9 Method override\n    - 7.10 abstract class\n    - 7.11 instanceof\n\
    \    - 7.12 interface\n    - 7.13 final\n    - 7.14 enum\n    - 7.15 Polymorphism\n\
    \    - 7.16 Polymorphic Example\n    - 7.17 Internal class\n    - 7.18 Static\
    \ internal class\n    - 7.19 Basic data wrap class\n    - 7.20 Anonymous inner\
    \ class\n    - 7.21 package\n- 8. Multithreading\n    - 8.1 Thread\n    - 8.2\
    \ Runnable\n- 9. Exception\n    - 9.1 Runtime exception\n    - 9.2 Compile-time\
    \ exception\n    - 9.3 finally\n- 10. String\n    - 10.1 String assignment and\
    \ comparison\n    - 10.2 Byte and string conversion\n    - 10.3 String judgment\
    \ operation\n    - 10.4 String replacement\n    - 10.5 String search and cut\n\
    \    - 10.6 String split\n    - 10.7 StringBuffer and StringBuilder\n- 11. Common\
    \ class library\n    - 11.1 Arrays\n    - 11.2 Calendar\n    - 11.3 Date\n   \
    \ - 11.4 Math\n    - 11.5 Comparable\n    - 11.6 Comparator\n    - 11.7 Random\n\
    \    - 11.8 Timer TimerTask\n- 12. Collection data structure\n    - 12.1 List\
    \ and ArrayList\n    - 12.2 LinkedList\n    - 12.3 Iterator\n    - 12.4 Vector\n\
    \    - 12.5 Collections\n    - 12.6 Set HashSet TreeSet\n    - 12.7 Map HashMap\
    \ Hashtable\n    - 12.8 Map user login example\n    - 12.9 Stack\n    - 12.10\
    \ Generic\n    - 12.11 Generic Housing rental example\n    - 12.12 Generic about\
    \ school examples\n- 13. File IO\n    - 13.1 File\n    - 13.2 File and Folder\n\
    \    - 13.3 FileInputStream reads a file\n    - 13.4 FileOutputStream writes to\
    \ a file\n    - 13.5 FileWriter writes characters\n    - 13.6 FileReader reads\
    \ files as characters\n    - 13.7 InputStreamReader byte to character stream\n\
    \    - 13.8 File copy\n- 14. Java network programming\n    - 14.1 TCP protocol\n\
    \    - 14.2 UDP protocol\n\n# Java JDK installation\n\n- 1. Download the JDK (Java\
    \ development kit)\n\nhttps://drive.google.com/open?id=181nylTxnl0o2TmBTQ4I7ndDaa-HFFe\n\
    \nThere are 3 JDK versions. We use jdk-6u45-windows-i586.zip as an example.\n\n\
    - jdk-6u45-windows-i586.zip\n- jdk-7u79-windows-x64.zip\n- jdk-8u91-windows-x64.zip\n\
    \n- 2. Install the JDK development kit\n\nUnzip jdk-6u45-windows-i586.zip\n\n\
    Click jdk-6u45-windows-i586.exe all to the next step to complete the installation.\n\
    \n# Java(TM) SE Development Kit 6 Update 45 - Setup\n\nWelcome to the Installation\
    \ Wizard for Java™ SE Development Kit 6 Update 45\n\nThis wizard will guide you\
    \ through the installation process for the Java SE Development Kit 6 Update 45.\n\
    \nInstallation path: C:\\Program Files (x86)\\Java\\jdk1.6.0_45_\n\n# Java(TM)\
    \ SE Development Kit 6 Update 45 - Custom Setup\n\nCustom Setup\nSelect the program\
    \ features you want installed.\n\nSelect optional features to install from the\
    \ list below. You can change your choice of features after installation by using\
    \ the Add/Remove Programs utility in the Control Panel\n\n| Feature Description\
    \ |\n| :--- |\n| Java(TM) SE Development Kit 6 Update 45, including private JRE\
    \ 6 Update 45. This will require 300MB on your hard drive. |\n| Development Tools\
    \ |\n| Source Code |\n| Public JRE |\n\nInstall to:\nC:\\Program Files (x86)\\\
    Java\\jdk1.6.0_45\\\n\nConfiguring environment variables in window 7:\n\nRight\
    \ click -> My Computer -> Properties\n\n![](img/7bed215b1d3800688250023ed87bfd24_8_0.png)\n\
    \nClick Advanced System Settings\n\n![](img/7bed215b1d3800688250023ed87bfd24_9_0.png)\n\
    \nClick Advanced -> Environment Variables\n\n![](img/7bed215b1d3800688250023ed87bfd24_10_0.png)\n\
    \nClick the New button to create 3 environment variables.\n\n![](img/7bed215b1d3800688250023ed87bfd24_11_0.png)\n\
    \nJAVA_HOME=C:\\Program Files (x86)\\Java\\jdk1.6.0_45\\\nCLASSPATH=%JAVA_HOME%\\\
    lib;%JAVA_HOME%\\bin\nPATH=%JAVA_HOME%\\bin\n\n![](img/7bed215b1d3800688250023ed87bfd24_12_0.png)\n\
    \nClick Next to the next step to complete the installation.\n\n![](img/7bed215b1d3800688250023ed87bfd24_13_0.png)\n\
    \nClick OK to finish.\n"
  mdcn: "\n\n# 轻松学习\n\n# Java\n\n![](img/7bed215b1d3800688250023ed87bfd24_0_0.png)\n\
    \n初学者 Java指南\n\n# 轻松学习 Java\n\n![](img/7bed215b1d3800688250023ed87bfd24_1_0.png)\n\
    \n杨虎 (YANG HU)\n\n生活的复杂性是因为他们不懂如何化繁为简，化复杂为简单是智慧的开始。\n\n从实践本质出发，简要解释概念并生动地培养编程兴趣，本书深入分析了\
    \ Java 面对象编程，结合实践中的场景解读，体验编程的乐趣。\n\nhttp://en.verejava.com\n\nCopyright © 2019\
    \ 杨虎\n版权所有。\nISBN: 9781091940338\n\n# 目录 \n\n- 1. 安装 Java JDK\n- 2. 安装 Eclipse\n\
    - 3. Java 基础概念\n    - 3.1 HelloWorld 详细解释\n    - 3.2 标识符\n    - 3.3 变量\n    -\
    \ 3.4 数据类型\n    - 3.5 常量\n    - 3.6 数据类型转换\n- 4. Java 运算符\n    - 4.1 算术运算符\n \
    \   - 4.2 赋值运算符\n    - 4.3 关系运算符\n    - 4.4 逻辑运算符\n    - 4.5 三元运算符\n- 5. Java\
    \ 语句\n    - 5.1 If 语句\n    - 5.2 Switch 语句\n    - 5.3 While 循环语句\n    - 5.4 Do\
    \ while 循环\n    - 5.5 For 循环语句\n- 6. Java 数组\n    - 6.1 一维数组\n    - 6.2 一维数组添加元素\n\
    \    - 6.3 一维数组删除元素\n    - 6.4 泡排序算法\n    - 6.5 二维数组\n    - 6.6 示例：扫雷\n- 7. Java\
    \ 面向对象\n    - 7.1 封装\n    - 7.2 方法封装\n    - 7.3 构造方法\n    - 7.4 方法重载\n    - 7.5\
    \ 引用传递\n    - 7.6 static 关键字\n    - 7.7 代码块\n    - 7.8 继承\n    - 7.9 方法重写\n  \
    \  - 7.10 抽象类\n    - 7.11 instanceof\n    - 7.12 接口\n    - 7.13 final\n    - 7.14\
    \ 枚举\n    - 7.15 多态\n    - 7.16 多态示例\n    - 7.17 内部类\n    - 7.18 静态内部类\n    -\
    \ 7.19 基本数据类型包装类\n    - 7.20 匿名内部类\n    - 7.21 包\n- 8. 多线程\n    - 8.1 线程 (Thread)\n\
    \    - 8.2 Runnable\n- 9. 异常\n    - 9.1 运行时异常\n    - 9.2 编译时异常\n    - 9.3 finally\n\
    - 10. String\n    - 10.1 String 赋值与比较\n    - 10.2 字节与字符串转换\n    - 10.3 String\
    \ 判断操作\n    - 10.4 String 替换\n    - 10.5 String 搜索与切割\n    - 10.6 String 拆分\n\
    \    - 10.7 StringBuffer 和 StringBuilder\n- 11. 常用类库\n    - 11.1 Arrays\n    -\
    \ 11.2 Calendar\n    - 11.3 Date\n    - 11.4 Math\n    - 11.5 Comparable\n   \
    \ - 11.6 Comparator\n    - 11.7 Random\n    - 11.8 Timer TimerTask\n- 12. 集合数据结构\n\
    \    - 12.1 List 和 ArrayList\n    - 12.2 LinkedList\n    - 12.3 Iterator\n   \
    \ - 12.4 Vector\n    - 12.5 Collections\n    - 12.6 Set HashSet TreeSet\n    -\
    \ 12.7 Map HashMap Hashtable\n    - 12.8 Map 用户登录示例\n    - 12.9 Stack\n    - 12.10\
    \ 泛型 (Generic)\n    - 12.11 泛型租房示例\n    - 12.12 泛型关于学校示例\n- 13. 文件 IO\n    - 13.1\
    \ File\n    - 13.2 文件与文件夹\n    - 13.3 FileInputStream 读取文件\n    - 13.4 FileOutputStream\
    \ 写入文件\n    - 13.5 FileWriter 写入字符\n    - 13.6 FileReader 以字符形式读取文件\n    - 13.7\
    \ InputStreamReader 字节流转字符流\n    - 13.8 文件复制\n- 14. Java 网络编程\n    - 14.1 TCP\
    \ 协议\n    - 14.2 UDP 协议\n\n# 安装 Java JDK\n\n- 1. 下载 JDK (Java 开发包)\n\nhttps://drive.google.com/open?id=181nylTxnl0o2TmBTQ4I7ndDaa-HFFe\n\
    \n有 3 个 JDK 版本。我们使用 jdk-6u45-windows-i586 作为示例。\n\njdk-6u45-windows-i586\n- jdk-7u79-windows-x64\n\
    - jdk-8u91-windows-x64\n\n- 2. 安装 JDK\n\n解压 jdk-6u45-windows-i586\n\n点击 jdk-6u45-windows-i586.exe\
    \ 继续下一步完成安装。\n\n# Java(TM) SE Development Kit 6 Update 45 - 设置\n\n此向导将引导您完成 Java\
    \ Development Kit 6 Update 45 的安装。\n\n安装路径：C:\\Program Files (x86)\\Java\\jdk1.6.0_45\n\
    \n# 自定义设置\n\n选择要安装的程序功能。\n\n从列表中选择要安装的功能。安装后可以通过控制面板中的“添加或删除程序”更改功能选择。\n\n| 功能\
    \ | 说明 |\n| :--- |\n| Java(TM) SE Development Kit 6 Update 45，包含私有 JRE 6 Update\
    \ 45。这将占用您的硬盘 300MB 空间。 |\n| 开发工具 | 源代码 |\n| 公共 JRE | |\n\n安装到：\nC:\\Program Files\
    \ (x86)\\Java\\jdk1.6.0_45\\\n\n在窗口 7 中配置环境变量：\n\n右键点击 -> 电脑 -> 属性\n\n![](img/7bed215b1d3800688250023ed87bfd24_8_0.png)\n\
    \n点击高级系统设置\n\n![](img/7bed215b1d3800688250023ed87bfd24_9_0.png)\n\n点击高级 -> 环境变量\n\
    \n![](img/7bed215b1d3800688250023ed87bfd24_10_0.png)\n\n点击“新建”按钮创建 3 个环境变量。\n\n\
    ![](img/7bed215b1d3800688250023ed87bfd24_11_0.png)\n\nJAVA_HOME=C:\\Program Files\
    \ (x86)\\Java\\jdk1.6.0_45\\\nCLASSPATH=%JAVA_HOME%\\lib;%JAVA_HOME%\\bin\nPATH=%JAVA_HOME%\\\
    bin\n\n![](img/7bed215b1d3800688250023ed87bfd24_12_0.png)\n\n点击下一步完成安装。\n\n![](img/7bed215b1d3800688250023ed87bfd24_13_0.png)\n\
    \n点击完成结束。\n\n"
