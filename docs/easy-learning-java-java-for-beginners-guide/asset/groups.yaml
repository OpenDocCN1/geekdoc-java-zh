  - "[PAGE 24]\n\n# HelloWorld Detailed Explanation\n\n```\n/**\n1. // : double slashes\
    \ represent comments\n2. public : is the keyword of java\n3. class : each java\
    \ file must contain a class\n4. HelloWorld : is called the class name\n5. static\
    \ : the main method must be written to the static virtual machine to find\n6.\
    \ void : no return value\n7. main : is called the main method, the entry of the\
    \ java program.\n8. String : is a series of combinations of numeric characters\
    \ enclosed in double quotes\n9. String[] : string array\n10. args : is the parameter\
    \ of the main method\n\nCoding Standards:\n1. Class name The first word is capitalized.\
    \ If there are multiple words, the first letter of each is capitalized.\n2. java\
    \ is a case-sensitive language\n3. When writing a class body {} parenthesis must\
