- md: "\n# Easy Learning\n\n# Java\n\n![](img/7bed215b1d3800688250023ed87bfd24_0_0.png)\n\
    \nJava for Beginner's Guide\n\n# Easy Learning Java\n\n![](img/7bed215b1d3800688250023ed87bfd24_1_0.png)\n\
    \nYANG HU\n\nThe complexity of life, because they do not understand to simplify\
