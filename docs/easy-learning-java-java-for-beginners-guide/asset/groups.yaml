    \ combined with the use of scene interpretation in practice, to experience the\
    \ fun of programming.\n\nhttp://en.verejava.com\n\nCopyright © 2019 Yang Hu\n\
    All rights reserved.\nISBN: 9781091940338\n\n# CONTENTS\n\n- 1. Java JDK installation\n\
