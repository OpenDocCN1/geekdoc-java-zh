- md: "\n![](img/7bed215b1d3800688250023ed87bfd24_62_0.png)\n\n/**\nBubble sorting\
    \ algorithm:\nsort the output of the results arrays from small to large\nStep:\n\
    First sort\n1. Start from the first element.\n2. If the previous data is larger\
    \ than the latter data then swap positions until the end of the loop, the largest\
    \ data will be placed in the last position of the array.\n3. By analogy, the unsorted\
    \ n-i elements will be similar to the 1,2 process again,\nso that after the end\
    \ of the loop n times, the elements are sorted from small to large.\n*/\n\n```java\n\
    public class BubbleSort {\n    public static void sort(int[] arrays) {\n    //\
    \ The first loop n-1 times\n    for (int i = 0; i < arrays.length - 1; i++) {\n\
    \      // The second loop the number of elements to be compared each time n\n\
    \      for (int j = 0; j < arrays.length - i - 1; j++) {\n        if (arrays[j]\
    \ > arrays[j + 1]) {\n          int flag = arrays[j];\n          arrays[j] = arrays[j\
    \ + 1];\n          arrays[j + 1] = flag;\n        }\n      }\n    }\n    }\n\n\
    \    public static void main(String[] args) {\n        int[] scores = { 90, 70,\
    \ 50, 80, 60, 85 };\n\n        sort(scores);\n\n        // Output sorted scores\n\
