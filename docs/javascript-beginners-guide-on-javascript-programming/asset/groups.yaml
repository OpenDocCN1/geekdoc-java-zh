    # Chapter 15


    # JavaScript Objects


    JavaScript language is an Object Oriented Programming (OOP) based language which
    provides the following capabilities of OOPs language to the programmer.


    Encapsulation — is the concept with which we can store all the related information
    that includes data and methods, together in an object.


    Aggregation — is the concept which enables to store one object inside another
    object.


    Inheritance — is the concept that enables a class to inherit or re-use the properties
    of another class (or number of classes). It is also known as parent class.


    Polymorphism — is the concept that enables the programmer to write one function/method
    that execute different task in different ways but defined with the same name.
    Also known as method overloading.


    Objects — are composed of attributes. An attribute can be a function or a property.
    Function is considered to be a method of the object.


