    \ 9 章\n## JavaScript 决策\n\n在编写程序时，我们大多数时候会面临必须做决策的情况。决策是对程序执行期间可能出现的情况的预测，并需要根据这些情况指定某些操作。\n\
    \n在决策结构中，有一个条件，可以是单个表达式或多个表达式。该条件在求值时会产生 TRUE（真）或 FALSE（假）的结果。根据结果，我们需要确定采取何种操作以及执行哪些语句。请参考下图以清晰理解。\n\
    \n![](img/64de8c62f77548c4dca6c5e5001f0a6b_55_0.png)\n\n与其他任何编程语言一样，JavaScript\
    \ 语言支持条件语句，用于根据不同的条件执行不同的操作。以下是 JavaScript 语言支持的条件语句。\n\n- if 语句\n- if...else\
    \ 语句\n- if...else if... 语句\n- Switch case 语句\n\n让我们通过一个 JavaScript 程序来理解这些语句。\n\
    \nif 语句 — if 语句是一种基础控制语句，允许 JavaScript 代码根据所需的条件做出决策并执行语句。以下是语法。\n\n## 语法与示例\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>基础\
    \ IF 语句</title>\n</head>\n<body>\n<script type=\"text/javascript\">\nvar salary\
    \ = 10000;\nvar expenses = 12000;\nif (expenses > salary) {\ndocument.write(\"\
    <b>请开始增加收入或减少开支！</b>\");\n}\n</script>\n<p>我们处于 body 部分内部...</p>\n</body>\n```\n\
    \n## 输出\n\n当我们执行上面的 HTML 程序时，将输出如下内容。由于 “if” 语句中的条件为真，因此它将在 HTML 页面上写入给定的文本。\n\
    \n![](img/64de8c62f77548c4dca6c5e5001f0a6b_57_0.png)\n\nif...else 语句 — ‘if...else’\
    \ 语句是控制语句的另一种形式，允许 JavaScript 代码以更有控制的方式执行语句。以下是语法和示例。\n\n## 语法与示例\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>If Else 语句</title>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\nvar salary = 12000;\nvar expenses\
    \ = 10000;\nif(expenses > salary) {\ndocument.write(\"<b>请开始增加收入或减少开支！</b>\");\n\
    }\nelse {\ndocument.write(\"<b>你有足够的钱花了！</b>\");\n}\n</script>\n<p>我们处于 body 部分内部...</p>\n\
    </body>\n</html>\n```\n\n## 输出\n\n当我们执行上面的 HTML 程序时，将输出如下内容。由于 \"if\" 语句中的条件为假，因此它进入了\
    \ else 块，并在 HTML 页面上写入了给定的文本。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_58_0.png)\n\
    \nif...else if... 语句 — if...else if... 语句是 if...else 的另一种高级形式，允许 JavaScript 代码从定义的条件中做出正确的决策。它有一系列语句，其中每个语句都是最后一条语句的\
    \ else 子句的一部分。根据真条件执行语句，如果没有任何条件为真，则将执行 else 块中的代码。以下是语法示例。\n\n## 语法与示例\n\n```\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-88591\">\n<title>If Else\
    \ If 语句</title>\n</head>\n<body>\n<script type=\"text/javascript\">\nvar salary\
    \ = 12000;\nvar expenses = 10000;\nif (expenses > salary) {\ndocument.write(\"\
    <b>请开始增加收入或减少开支！</b>\");\n} else if (salary > 13000) {\ndocument.write(\"<b>你有足够的钱花了！</b>\"\
    );\n}\nelse {\n  document.write(\"<b>虽然你有足够的钱，但你需要小心！</b>\");\n}\n</script>\n\
    <p>我们处于 body 部分内部...</p>\n</body>\n</html>\n```\n\n## 输出\n\n当我们执行上面的 HTML 程序时，将输出如下内容。由于\
    \ \"if\" 语句中的条件为假，因此它进入了 else if 块，该块中另一个条件恰好为假。因此，它在 HTML 页面上写入了最后一个块中的给定文本。\n\
    \n![](img/64de8c62f77548c4dca6c5e5001f0a6b_60_0.png)\n\n## Switch case 语句\n\n\
    从 JavaScript 1.2 版本开始，开始支持 switch 语句来处理与重复的 else if 语句相同的情况。\n\nswitch 语句用于根据表达式的值提供多个不同的语句。JavaScript\
    \ 解释器会检查每个 case 是否匹配表达式，直到找到匹配项。如果没有找到匹配，则使用 default 条件。\n\n此外，在 case 代码语句末尾有一个\
    \ break 语句。如果在这里没有声明 break，解释器将继续执行后续 case 中的语句。\n\n以下是 switch case 语句的语法和示例。\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Switch\
    \ Case 语句</title>\n</head>\n<body>\n<script type=\"text/javascript\">\nvar expensecode='X';\n\
    document.write(\"进入 switch 块<br />\");\nswitch(expensecode)\n{\n case 'X': document.write(\"\
    <b>请开始增加收入或减少开支！</b>\");\n  break;\n\n case 'Y': document.write(\"<b>你有足够的钱花了！</b>\"\
    );\n  break;\n\n case 'Z': document.write(\"<b>虽然你有足够的钱，但你需要小心！</b>\");br/>\\\n\
    break;\ndefault: document.write(\"无匹配!<br/>\")\n}\ndocument.write(\"<br>退出 switch\
    \ 块<br/>\");\n</script>\n<p>我们处于 body 部分内部...</p>\n</body>\n</html>\n```\n\n##\
    \ 输出\n\n当我们执行上面的 HTML 程序时，将输出如下内容。程序在 HTML 页面上写入了匹配 case 字符 ('X') 的文本。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_62_0.png)\n\
    \n"
