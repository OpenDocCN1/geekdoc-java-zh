- md: "\nUsually, all JavaScript statements are ended with a semi-colon. But these\
    \ semi-colons are optional when each of JavaScript statements are placed on a\
    \ separate line. Using the semi-colons at the end of each JavaScript statement\
    \ is considered as a good programming practice.\n\n## Case Sensitivity\n\nJavaScript\
    \ language is a case sensitive language. It means, the keywords, variables, function\
    \ names, identifiers, etc. should be used with a consistent capitalization of\
    \ letters. E.g. the identifier learn and LEARN are different from the point of\
    \ view of the JavaScript language.\n\n## Comments in JavaScript\n\nThe following\
    \ are the comment styles which are supported in the JavaScript language.\n\n-\
    \ Single line comment is declared as // (double slash).\n- Multiple line comments\
    \ is declared as /* JavaScript Statements on the multiple line /*. It works for\
    \ single line comment as well.\n- It also recognized the HTML comment (opening\
    \ sequence) <!--—. JavaScript treats this as a single-line comment as it does\
    \ with the // comment.\n- The closing sequence --> of HTML is not recognized by\
    \ JavaScript, Therefore, it should be written as //-->.\n\nThe following is an\
    \ example that covers various JavaScript Comments.\n\n```\n<!DOCTYPE html>\n<html\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>JavaScript Comments</title>\n</head>\n\
    <body>\n<script type=\"text/javascript\">\n<!-- The opening sequence single line\
    \ comment.\n  The closing sequence HTML comment//-->\n\n// This is a single line\
    \ comment.\n\n/*\n * This is a multiple line comment in JavaScript\n*/\n</script>\n\
    </body>\n</html>\n```\n\n## Output\n\nWhen we execute the above HTML program,\
    \ the following will be the output (blank) since JavaScript interpreter has ignored\
    \ all the comments.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_19_0.png)\n\n\
    ## JavaScript Syntax\n\nLike any other programming language, JavaScript syntax\
    \ has certain set of rules in which they are constructed.\n\n## Programs in JavaScript\n\
    \nA JavaScript program is a sequence of instructions which are parsed and executed\
    \ by the browser program. These sequence of program instructions are known as\
    \ statements.\n\nJavaScript is an object oriented based programming language.\n\
    \nJavaScript statements are usually separated by semicolons, however placing a\
    \ semicolon at the end statement is optional.\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>JavaScript Syntax</title>\n<script\
    \ type=\"text/javascript\">\n  var a = 101;\n  var b = 300;\n  var sum = a + b;\n\
    </script>\n</head>\n<body>\n<script type=\"text/javascript\">\n  document.write(\"\
    sum of a + b = \"+sum);\n```\n\n</script>\n</body>\n</html>\n```\n\n## Output\n\
    \nWhen we execute the above HTML program, the following will be the output.\n\n\
    ![](img/64de8c62f77548c4dca6c5e5001f0a6b_21_0.png)\n\n## Statements in JavaScript\n\
    \nStatements in JavaScript programming language are composed of the following.\n\
    \n- Values\n- Operators\n- Expressions\n- Keywords, and\n- Comments.\n\n## Values\
    \ in JavaScript\n\nThe following are the two types of values in JavaScript.\n\n\
    - Fixed values, and\n- Variable values.\n\nLiterals are the fixed values and the\
    \ variable values are known as variables.\n\n## Literals in JavaScript\n\nThe\
    \ following are the rules for writing literals or fixed values in JavaScript.\n\
    \n- Numbers are defined with or without decimals.\n- Strings are the text that\
    \ are written within single or double quotes.\n\n## Variables in JavaScript\n\n\
    The following are the rules for writing variable values which are used to store\
    \ data values in JavaScript.\n\nJavaScript language uses the `var` keyword to\
    \ declare the variables.\n\nThe value to a variable is assigned by an equal sign.\n\
    \n## Operators in JavaScript\n\nThe following are the operators used in JavaScript\
    \ language.\n\n**Assignment operator (=)** is used to assign values to a variable.\n\
    \n**Arithmetic operators (+-* /)** are used for arithmetic operations such as\
    \ addition, subtraction, multiplication, and division.\n\n## Expressions in JavaScript\n\
    \nAny expression in JavaScript language is a combination of values, variables,\
    \ and operators. These together do de computation. The computation is called an\
    \ evaluation.\n\nAn expressions may also contain variable values such as numbers\
    \ and strings. E.g. \"Java\" + \"Script\" will concatenate to \"JavaScript\".\n\
    \nLet's understand this with the help of the following example.\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n```\n\n<title>JS Expressions</title>\n\
    <script type=\"text/javascript\">\n  var a = 101; //variable, assignment operator\
    \ and literal as number.\n\n  var b = 300;\n\n  var addition = a + b;\n\n  var\
    \ str1 = \"Java\"; //variable, assignment operator and literal as String.\n\n\
    \  var str2 = \"Script\";\n  var str3 = str1 + str2;\n\n</script>\n</head>\n<body>\n\
    <script type=\"text/javascript\">\n\n  document.write(\"Addition of a + b = \"\
    +addition\");\n  document.write(\"<br>Concat of str1 + str2 = \"+str3\");\n\n\
    </script>\n</body>\n</html>\n```\n\n## Output\n\nWhen we execute the above HTML\
    \ program, the following will be the output. The output shows the addition.\n\n\
    ## Keywords in JavaScript\n\nKeywords in JavaScript are reserved words are used\
    \ to identify the actions. In JavaScript, the identifiers are used to name.\n\n\
    ## Camel Case and JavaScript\n\nThere are the following three ways of joining\
    \ words into one.\n\n- Hyphens — e.g., first-address, second-address.\n- Underscore\
    \ — e.g., first_address, second_address.\n- Camel Case — e.g., FirstAddress, SecondAddress.\n\
    \n## Character Set in JavaScript\n\nJavaScript language uses the Unicode character\
    \ set and it covers all the characters, punctuations.\n\n## JavaScript Enabling\
    \ and Disabling\n\nWeb browsers such as Internet Explorer, Mozilla Firefox, Google\
    \ Chrome, Opera, etc. come with built-in support for JavaScript. We can enable\
    \ or disable the support manually. In this chapter we are going to discuss about\
    \ the procedure of enabling and disabling JavaScript in these browsers.\n\n###\
    \ Enabling the JavaScript support in Internet Explorer\n\nThe following are the\
    \ steps to turn on or enable JavaScript support in Internet Explorer.\n\n- Navigate\
    \ as Tools Internet Options from the menu tab.\n- From the dialog box, select\
    \ the security tab.\n- Click on the Custom Level button.\n- Scroll down the menu\
    \ and find the scripting option.\n- Select to enable the radio button under Active\
    \ scripting caption.\n- Lastly, click on the OK button to enable the JavaScript\
    \ support on IE.\n\n### Disabling the JavaScript support in Internet Explorer\n\
    \nTo turn off or disable the JavaScript support in Internet Explorer, follow the\
    \ above steps and select to disable the radio button under Active scripting caption.\n\
    \n### Enabling the JavaScript support in Mozilla Firefox\n\nThe following are\
    \ the steps to turn on or enable JavaScript support in Mozilla Firefox.\n\nOpen\
    \ a new tab and type *about:config* in the address bar.\n\nThere we will find\
    \ the following warning dialog Select and click on the button as “I’ll be careful,\
    \ I promise!” as shown below.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_27_0.png)\n\
    \nHere, we will observe the list of configure options in the browser. In the search\
    \ bar, type javascript.enabled as shown below.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_27_1.png)\n\
    \nHere, we can find the option to enable or disable the javascript by right-clicking\
    \ on the value of that option select toggle.\n\nUpon clicking toggle, if the javascript.enabled\
    \ is true then it will be converted to false. This will disable the JavaScript\
    \ support to the Mozilla Firefox browser.\n\n### Disabling the JavaScript support\
    \ in Mozilla Firefox\n\nThe following are the steps to turn off or disable the\
    \ JavaScript support in Mozilla Firefox. If javascript is disabled then it can\
    \ be enabled upon clicking toggle, after following the similar steps as explained\
    \ before.\n\n### Enabling or disabling the JavaScript support in Google Chrome\n\
    \nThe following are the steps to enable or disable the JavaScript support in Google\
    \ Chrome.\n\nClick on the Chrome menu present at the top right hand corner of\
    \ the Chrome\n"
  mdcn: "\n通常，所有的 JavaScript 语句都以分号结束。但当每个 JavaScript 语句都放置在单独的一行时，这些分号是可选的。在每个 JavaScript\
    \ 语句末尾使用分号被认为是一种良好的编程习惯。\n\n## 大写敏感\n\nJavaScript 语言是一种大小写敏感的语言。这意味着关键字、变量、函数名、标识符等在使用时字母的大小保持一致。例如，从\
    \ JavaScript 语言的角度来看，标识符 `learn` 和 `LEARN` 是不同的。\n\n## JavaScript 中的注释\n\n以下是\
    \ JavaScript 语言支持的注释样式。\n\n- 单行注释声明为 `//`（双斜杠）。\n- 多行注释声明为 `/* 位于多行的 JavaScript\
    \ 语句 */`。它也适用于单行注释。\n- 它还能识别 HTML 注释（起始序列）`<!--`。JavaScript 将其视为单行注释，就像处理 `//`\
    \ 注释一样。\n- HTML 的结束序列 `-->` 不被 JavaScript 识别，因此应写成 `//-->`。\n\n以下是一个涵盖各种 JavaScript\
    \ 注释的示例。\n\n```\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>JavaScript Comments</title>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\n<!-- 起始序列单行注释。\n  结束序列 HTML 注释//-->\n\n// 这是一个单行注释。\n\n/*\n * 这是 JavaScript\
    \ 中的一个多行注释\n*/\n</script>\n</body>\n</</html>\n```\n\n## 输出\n\n当我们执行上述 HTML 程序时，输出将是如下所示的（空白），因为\
    \ JavaScript 解释器忽略了所有注释。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_19_0.png)\n\
    \n## JavaScript 语法\n\n与任何其他编程语言一样，JavaScript 语法是由一组特定的规则构建的。\n\n## JavaScript\
    \ 程序\n\nJavaScript 程序是一系列由浏览器解析并执行的指令。这些指令序列被称为语句。\n\nJavaScript 是一种基于对象的编程语言。\n\
    \nJavaScript 语句通常用分号隔开，但在末尾放置分号是可选的。\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>JavaScript Syntax</title>\n<script type=\"\
    text/javascript\">\n  var a = 101;\n  var b = 300;\n  var sum = a + b;\n</script>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\n  document.write(\"sum of\
    \ a + b = \"+sum);\n</script>\n</body>\n</html>\n```\n\n## 输出\n\n执行上述 HTML 程序时，输出如下所示。\n\
    \n![](img/64de8c62f77548c4dca6c5e5001f0a6b_21_0.png)\n\n## JavaScript 中的语句\n\n\
    JavaScript 语言语句由以下部分组成：\n\n- 值\n- 运算符\n- 表达式\n- 关键字\n- 注释\n\n## JavaScript 中的值\n\
    \nJavaScript 中的值有两种类型：\n\n- 固定值\n- 变量值\n\n字面量（Literals）是固定值，变量值被称为变量。\n\n## JavaScript\
    \ 中的字面量\n\n在 JavaScript 中编写字面量或固定值的规则如下：\n\n- 数字（带或不带小数）\n- 字符串（写在单引号或双引号内）\n\n\
    ## JavaScript 中的变量\n\nJavaScript 语言使用 `var` 关键字来声明变量。\n\n变量的值通过等号进行赋值。\n\n## JavaScript\
    \ 中的运算符\n\nJavaScript 语言使用的运算符如下：\n\n- **赋值运算符 (=)** 用于给变量赋值。\n- **算术运算符 (+, -,\
    \ *, /)** 用于加、减、乘、除运算。\n\n## JavaScript 中的表达式\n\nJavaScript 语言中的任何表达式都是值、变量和运算符的组合。这些共同进行计算。\n\
    \n表达式也可以包含变量值，如数字和字符串。例如 \"Java\" + \"Script\" 将拼接为 \"JavaScript\"。通过以下示例理解这一点：\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>JS\
    \ Expressions</title>\n<script type=\"text/javascript\">\n  var a = 101; // 变量，赋值运算符和数字字面量。\n\
    \n  var b = 300;\n\n  var addition = a + b;\n\n  var str1 = \"Java\"; // 变量，赋值运算符和字符串字面量。\n\
    \n  var str2 = \"Script\";\n  var str3 = str1 + str2;\n\n</script>\n</head>\n\
    <body>\n<script type=\"text/javascript\">\n\n  document.write(\"Addition of a\
    \ + b = \"+addition);\n  document.write(\"<br>Concat of str1 + str2 = \"+str3);\n\
    \n</script>\n</body>\n</html>\n```\n\n## 输出\n\n执行上述 HTML 程序时，输出如下。输出显示了加法。\n\n\
    ## JavaScript 中的关键字\n\nJavaScript 中的关键字是用于标识操作保留字。在 JavaScript 中，标识符用于命名。\n\n\
    ## 驼峰法与 JavaScript\n\n将单词合并为一个字的三种方法：\n\n- 连字符 — 例如，`first-address`, `second-address`。\n\
    - 下划线 — 例如，`first_address`, `second_address`。\n- 驼峰法 — 例如，`FirstAddress`, `SecondAddress`。\n\
    \n## JavaScript 中的字符集\n\nJavaScript 语言使用 Unicode 字符集，它涵盖了所有字符和标点。\n\n## JavaScript\
    \ 的启用与禁用\n\nInternet Explorer、Mozilla Firefox、Google Chrome 等网络浏览器都内置了 JavaScript\
    \ 支持。我们可以手动启用或禁用该支持。在本章中，我们将讨论在这些浏览器中启用和禁用 JavaScript 的步骤。\n\n### 在 Internet Explorer\
    \ 中启用 JavaScript 支持\n\n以下是在 Internet Explorer 中开启或启用 JavaScript 支持的步骤：\n\n- 从菜单选项导航到“工具\
    \ (Tools)” -> “Internet  (Internet Options)”。\n- 从对话框选择“安全 (Security)”选项卡。\n-\
    \ 点击“自定义级别 (Custom Level)”按钮。\n- 向滚动菜单找到“脚本 (Scripting)”选项。\n- 选中“活动脚本 (Active\
    \ scripting)”下的单选按钮。\n- 最后，点击“确定 (OK)”按钮以启用 IE 的 JavaScript 支持。\n\n### 在 Internet\
    \ Explorer 中禁用 JavaScript 支持\n\n要关闭或禁用 Internet Explorer 中的 JavaScript 支持，请遵循上述步骤并禁用“活动脚本\
    \ (Active scripting)”下的单选按钮。\n\n### 在 Mozilla Firefox 中启用 JavaScript 支持\n\n以下是在\
    \ Mozilla Firefox 中开启或启用 JavaScript 支持的步骤：\n\n打开新标签页，并在地址栏输入 *about:config*。\n\
    \n在那里我们将看到下面的警告对话框，点击如下所示的“我会小心的，我保证！(I’ll be careful, I promise!)”按钮。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_27_0.png)\n\
    \n在这里，我们将观察浏览器中的配置列表。在搜索栏中，输入所示所示 `javascript.enabled`。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_27_1.png)\n\
    \n在这里，我们可以通过右键点击该选项的值并选择切换来启用或禁用 JavaScript。\n\n点击切换后，如果 `javascript.enabled`\
    \ 为 `true`，它将转换为 `false`。这将禁用 Mozilla Firefox 浏览器的 JavaScript 支持。\n\n### 在 Mozilla\
    \ Firefox 中禁用 JavaScript 支持\n\n以下是关闭或禁用 Mozilla Firefox 中 JavaScript 支持的步骤。如果\
    \ JavaScript 已禁用，可以按照之前的类似步骤点击切换来启用。\n\n### 在 Google Chrome 中启用或禁用 JavaScript\
    \ 支持\n\n以下是在 Google Chrome 中启用或禁用 JavaScript 支持的步骤：\n\n点击 Chrome 右角的 Chrome 菜单\n"
