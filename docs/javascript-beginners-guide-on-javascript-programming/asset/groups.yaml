    # Chapter 13


    # JavaScript Dialogue Boxes


    Dialogue boxes are used in JavaScript to raise a warning using alert, or ask for
    a confirmation, or to accept an input from the user. To support these features,
    JavaScript has three types of dialogue boxes as follows.


    +   - Alert Dialogue Box

    - Confirmation Dialogue Box.

    - Prompt Dialogue Box


    # Alert Dialog Box


    When we want to display a warning message to the users in a dialogue box, then
    we use an alert dialogue box. E.g., when we validate a form using onSubmit event
    we do not accept any input from the user and just need to display a warning message,
    in this case we use an alert box to display such a warning message. Alert box
    just has one “OK” button to click and proceed.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="ISO-8859-1">

    <title>On Submit Events</title>

    <script type="text/javascript">

    function validation() {

    if(document.form1.textbox1.value != "") {

    alert(''Validation Passed'');

    return false;

    }

    ```'
