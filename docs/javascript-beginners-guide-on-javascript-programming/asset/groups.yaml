    \ is \" + counter + \"<br/>\");\n}\ndocument.write(\"Exiting while Loop!\");\n\
    </script>\n<p>We are inside body section...</p>\n</body>\n</html>\n```\n\n## Output\n\
    \nWhen we execute the above HTML program, the following will be the output. The\
    \ counter will write 5 times on the HTML page as it held its condition true 5\
    \ times till the counter value becomes 5.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_69_0.png)\n\
    \n## For...in loop statement\n\nThe for...in loop is used only in the special\
    \ cases where there is need to loop through an object's properties. The following\
    \ is the syntax and the example for...in loop.\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>For In Statement</title>\n</head>\n\
    <body>\n<script type=\"text/javascript\">\nvar prop;\ndocument.write(\"Object\
    \ Properties of Navigator <br /> \");\ndocument.write(\"Entering the loop!\");\n\
    for (prop in navigator) {\ndocument.write(prop);\ndocument.write(\"<br/>\");\n\
    document.write(\"Exiting the loop!\");\n</script>\n<p>We are inside body section...</p>\n\
    </body>\n</html>\n```\n\n## Output\n\nWhen we execute the above HTML program,\
    \ the following will be the output. In the output, we have iterated through the\
    \ “navigator” object and displayed all the object properties of the web browser.\n\
    \n![](img/64de8c62f77548c4dca6c5e5001f0a6b_70.png)\n\n## Summary of Loops in JavaScript\n\
    \n| Loop Type | Description |\n|---|---|\n| while loop | While loop type, repeats\
    \ a statement or group of statements while a given condition is true. It tests\
    \ the condition each time it executes the loop body and exits the loop when condition\
    \ becomes false. |\n| for loop | For loop type executes a sequence of statements\
