    # While loop statement


    While loop is the most basic loop in JavaScript language. This loop execute a
    statement or piece of code block repeatedly as long as an expression is held true.
    The loop terminates, once the expression is false. The following is the syntax
    and the example of while loop statement.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="ISO-8859-1">

    <title>While Loop</title>

    </head>

    <body>

    <script type="text/javascript">

    var counter = 0;

    document.write("Entering while Loop!");

    while (counter < 5){

    document.write("Current Counter is " + counter + "<br />");

    counter++;

    }

    document.write("Exiting while Loop!");

    </script>

    <p>We are inside body section...</p>

    </body>

    </html>

    ```'
