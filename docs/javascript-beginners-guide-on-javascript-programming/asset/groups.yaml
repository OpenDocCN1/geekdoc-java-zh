- md: "\n# Confirmation Dialog Box\n\nIn JavaScript language, a confirmation dialog\
    \ box is used when we need to take user’s opinion on any option. It displays a\
    \ dialog box that has two buttons: OK button and Cancel button.\n\nWhen the user\
    \ clicks on the OK button, the window method “confirm ()” will return a true value.\
    \ Otherwise, if the user clicks on the Cancel button, then “confirm ()” method\
    \ will return a false value. The following is an example on the confirmation dialogue\
    \ box.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>Confirm Box</title>\n<script type=\"text/javascript\">\nfunction showAlert()\
    \ {\nconfirm(\"This is an confirm dialogue box example!\");\n}\n</script>\n</head>\n\
    <body>\n<p>Confirm box demo example.</p>\n<input type=\"button\" onclick=\"showAlert();\"\
    \ value=\"Call JavaScript\"/>\n</body>\n</html>\n```\n\n# Output\n\nWhen we execute\
    \ the above HTML program, the following will be the output. Here, we see a confirmation\
    \ dialogue box.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_97_0.png)\n\n# Prompt\
    \ Dialog Box\n\nIn JavaScript language, a prompt dialog box is used when we want\
    \ to pop-up a text box that accepts the user input. Thus, it allows the system\
    \ to interact with the user. The user is required to enter the required data into\
    \ the field and then click on the OK button.\n\nSuch a dialog box is displayed\
    \ by using a method known as “prompt()”. It accepts the following two parameters.\n\
    \n- A label that we want to display in the text box.\n- A default string which\
    \ is display in the text box.\n\nThe prompt dialog box has the following two buttons.\n\
    \n- The OK button.\n- The Cancel button.\n\nWhen the user clicks on the OK button,\
    \ then the window method “prompt()” will return the value which was entered by\
    \ the user in the text box. Otherwise, if the user clicks on the Cancel button,\
    \ then the window method “prompt()” will return a null value.\n\nThe following\
    \ is an example on the prompt dialogue box.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>Prompt Box</title>\n<script type=\"\
    text/javascript\">\nfunction showAlert(){\n  prompt(\"This is an prompt dialogue\
    \ box example!\");\n}\n</script>\n</head>\n<body>\n<p>Prompt dialogue box demo\
    \ example.</p>\n<input type=\"button\" onclick=\"showAlert();\" value=\"Call JavaScript\"\
    />\n</body>\n</html>\n```\n\n# Output\n\nWhen we execute the above HTML program,\
    \ the following will be the output. Here, we see a prompt dialogue box.\n\nPrompt\
    \ dialogue box demo example.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_99_0.png)\n\
    \n# Chapter 14\n\n## JavaScript Void Keyword\n\nIn JavaScript language, the void\
    \ keyword can be used as a unary operator which is appeared before its single\
    \ operand, and may be of any type. This unary operator specifies an expression\
    \ which is required to be evaluated without any return value.\n\nThe following\
    \ is the syntax and an example of the void keyword.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Void Keyword Example 1</title>\n\
    </head>\n<body>\n  <p>Click here to invoke alert!</p>\n  <a href=\"javascript:void(alert('Here\
    \ is the Void Keyword demo'))\">Click Here!</a>\n</body>\n</html>\n```\n\n###\
    \ Output\n\nWhen we execute the above HTML program, the following will be the\
    \ output. Here, we see an alert dialogue box that popped out on the click of the\
    \ responsive hyperlink (“Click Here!”). On the other hand, if void argument is\
    \ empty then there is no response in the case of the second hyperlink (“No response\
    \ link!”) as the expression “0” has no effect in JavaScript. When “0” is evaluated,\
    \ it does not load back into the current document.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_102_0.png)\n\
    \nAlternatively, the void keyword in JavaScript is also used to generate the undefined\
    \ value as shown in the following example.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>Void Example 2</title>\n<script\
    \ type=\"text/javascript\">\nfunction getVoidDemo(){\nvar x,y,z;\nx = void ( y\
    \ = 50, z = 700 );\ndocument.write('x = ' + x + ' y = ' + y + ' z = ' + z);\n\
    }\n</script>\n</head>\n<body>\n<p>Click to get the Result...</p>\n<form>\n<input\
    \ type=\"button\" value=\"Get Result\" onclick=\"getVoidDemo();\" />\n</form>\n\
    </body>\n</html>\n```\n\n# Output\n\nWhen we execute the above HTML program, the\
    \ following will be the output. Here the value of the 'x' variable is undefined,\
    \ however variables 'y' and 'z' has the value as '50' and '700' respectively.\n\
    \n![](img/64de8c62f77548c4dca6c5e5001f0a6b_103_0.png)\n\n# Chapter 15\n\n## JavaScript\
    \ Objects\n\nJavaScript language is an Object Oriented Programming (OOP) based\
    \ language which provides the following capabilities of OOPs language to the programmer.\n\
    \nEncapsulation — is the concept with which we can store all the related information\
    \ that includes data and methods, together in an object.\n\nAggregation — is the\
    \ concept which enables to store one object inside another object.\n\nInheritance\
    \ — is the concept that enables a class to inherit or re-use the properties of\
    \ another class (or number of classes). It is also known as parent class.\n\n\
    Polymorphism — is the concept that enables the programmer to write one function/method\
    \ that execute different task in different ways but defined with the.\n\n# Object\
    \ Properties in JavaScript\n\nObject properties in JavaScript can be any primitive\
    \ types (Number, String) or abstract data types (such as Object).\n\nThe following\
    \ is the syntax and example:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta\
    \ charset=\"ISO-8859-1\">\n<title>Objects Example</title>\n<script type=\"text/javascript\"\
    >\nobjectName = propertyValue;\nvar str = document;\n</script>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n# Object Methods in JavaScript\n\nObject Methods are\
    \ the functions with which the object do manipulation. In JavaScript, a function\
    \ is a standalone unit whereas a method is attached to an object.\n\nMethods can\
    \ be used to display the object contents. E.g., during this tutorial, we have\
    \ used the “write” method of the document where we pass.\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Object Method Example</title>\n\
    <script type=\"text/javascript\">\ndocument.write(\"Welcome to JavaScript!\");\n\
    </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n# User-Defined Objects in\
    \ JavaScript\n\nIn JavaScript language, all the user-defined objects as well as\
    \ the built-in objects extends to an object (similar to the JAVA language).\n\n\
    # The new Operator in JavaScript\n\nThe “new” operator is used for the creation\
    \ of an object instance. In order to create an object in JavaScript, the statement\
    \ has the new operator which is followed by the constructor method as shown below.\
    \ Here, the constructor methods are “Object ()”, “Array ()”, and “Date ()”. These\
    \ constructors are the built-in JavaScript functions.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>The New Operator</title>\n\
    <script type=\"text/javascript\">\nvar student = new Object();\n\nvar languages\
    \ = new Array(\"JavaScript\", \"Pascal\", \"Python\");\n\nvar day = new Date(\"\
    August 24, 1989\");\n\nalert(day);\n\n</script>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\n# Output\n\nWhen we execute the above HTML program, the following will\
    \ be the output. Here, we are displaying the properties of the Date object on\
    \ the alert dialogue box.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_107_0.png)\n\
    \n# The “Object ()” Constructor\n"
  mdcn: "\n\n# 确认对话框 (Confirmation Dialog Box)\n\n在 JavaScript 语言中，当我们需要对任何选项获取用户的意见时，就会使用确认对话框。它显示一个包含两个按钮的对话框：确定按钮和取消按钮。\n\
    \n当用户点击确定按钮时，窗口方法 `confirm ()` 将返回一个 `true` 值。否则，如果用户点击取消按钮，则 `confirm ()` 方法将返回一个\
    \ `false` 值。以下是确认对话框的示例。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>Confirm Box</title>\n<script type=\"text/javascript\">\n\
    function showAlert() {\nconfirm(\"This is an confirm dialogue box example!\");\n\
    }\n</script>\n</head>\n<body>\n<p>Confirm box demo example.</p>\n<input type=\"\
    button\" onclick=\"showAlert();\" value=\"Call JavaScript\"/>\n</body>\n</html>\n\
    ```\n\n# 输出 (Output)\n\n当我们执行上述 HTML 程序时，将产生如下输出。在这里，我们看到了一个确认对话框。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_97_0.png)\n\
    \n# 提示对话框 (Prompt Dialog Box)\n\n在 JavaScript 语言中，当我们想要弹出一个可以接受用户输入的文本框时，就会使用提示对话框。因此，它允许系统与用户进行交互。用户必须在字段中输入所需的数据，然后点击确定按钮。\n\
    \n这种对话框是通过使用名为 `prompt()` 的方法显示的。它接受以下两个参数：\n\n- 我们想要在文本框中显示的标签。\n- 一个在文本框中显示的默认字符串。\n\
    \n提示对话框有两个按钮：\n\n- 确定按钮。\n- 取消按钮。\n\n当用户点击确定按钮时，窗口方法 `prompt() ` 将返回用户在文本框中输入的值。否则，如果用户点击取消按钮，则窗口方法\
    \ `prompt() ` 将返回一个 `null` 值。\n\n以下是提示对话框的示例。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>Prompt Box</title>\n<script type=\"\
    text/javascript\">\nfunction showAlert(){\n  prompt(\"This is an prompt dialogue\
    \ box example!\");\n}\n</script>\n</head>\n<body>\n<p>Prompt dialogue box demo\
    \ example.</p>\n<input type=\"button\" onclick=\"showAlert();\" value=\"Call JavaScript\"\
    />\n</body>\n</html>\n```\n\n# 输出 (Output)\n\n当我们执行上述 HTML 程序时，将产生如下输出。在这里，我们看到了一个提示对话框。\n\
    \nPrompt dialogue box demo example.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_99_0.png)\n\
    \n# 第 14 章 (Chapter 14)\n\n## JavaScript void 关键字 (Void Keyword)\n\n在 JavaScript\
    \ 语言中，`void` 关键字可以作为一元运算符使用，出现在单个操作数之前，该操作数可以是任何类型。该一元运算符指定了一个需要求值但没有返回值的表达式。\n\
    \n以下是 `void` 关键字的语法和示例。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>Void Keyword Example 1</title>\n</head>\n<body>\n  <p>Click\
    \ here to invoke alert!</p>\n  <a href=\"javascript:void(alert('Here is the Void\
    \ Keyword demo'))\">Click Here!</a>\n</body>\n</html>\n```\n\n### 输出 (Output)\n\
    \n当我们执行上述 HTML 程序时，将产生如下输出。在这里，我们看到了点击响应式超链接（“Click Here!”）时弹出的警告对话框。另一方面，如果 `void`\
    \ 参数为空，则第二个超链接（“No response link!”）情况下将没有响应，因为表达式“0”在 JavaScript 中没有效果。当“0”被求值时，它不会重新加载到当前文档中。\n\
    \n![](img/64de8c62f77548c4dca6c5e5001f0a6b_102_0.png)\n\n或者，JavaScript 中的 `void`\
    \ 关键字也用于生成 `undefined` 值，如下例所示。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>Void Example 2</title>\n<script type=\"\
    text/javascript\">\nfunction getVoidDemo(){\nvar x,y,z;\nx = void ( y = 50, z\
    \ = 700 );\ndocument.write('x = ' + x + ' y = ' + y + ' z = ' + z);\n}\n</script>\n\
    </head>\n<body>\n<p>Click to get the Result...</p>\n<form>\n<input type=\"button\"\
    \ value=\"Get Result\" onclick=\"getVoidDemo();\" />\n</form>\n</body>\n</html>\n\
    ```\n\n# 输出 (Output)\n\n当我们执行上述 HTML 程序时，将产生如下输出。在这里，变量 `x` 的值为 `undefined`，但变量\
    \ `y` 和 `z` 的值分别为 `50` 和 `700`。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_103_png)\n\
    \n# 第 15 章 (Chapter 15)\n\n## JavaScript 对象 (JavaScript Objects)\n\nJavaScript\
    \ 语言是一种基于面向对象 (OOP) 的语言，提供了以下功能：\n\n**封装 (Encapsulation)**：将数据和方法存储在对象中。\n\n**聚合\
    \ (Aggregation)**：将一个对象存储在对象内部。\n\n**继承 (Inheritance)**：允许类继承其他类的属性。\n\n**多态 (Polymorphism)**：允许以不同的方式执行任务，但也称为基类。\n\
    \n# JavaScript 对象属性 (Object Properties in JavaScript)\n\nJavaScript 属性可以是任何原始类型（Number,\
    \ String）或抽象类型（如 Object）。\n\n以下是语法和示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>Objects</title>\n<script type=\"text/javascript\"\
    >\nobjectName = propertyValue;\nvar str = document;\n</script>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n# JavaScript 对象方法 (Object Methods in JavaScript)\n\n\
    对象方法是用于操作函数。在 JavaScript 中，函数是独立的单元，而方法是附加在对象上的。\n\n方法可以显示对象的内容。例如，在教程中，我们使用了\
    \ `document` 的 `write` 方法，我们传递了：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>Object Method</title>\n<script type=\"text/javascript\"\
    >\ndocument.write(\"Welcome to JavaScript!\");\n</script>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\n# JavaScript 中的自定义对象 (User-Defined Objects in JavaScript)\n\n\
    在 JavaScript 语言中，所有的自定义对象以及内置对象都是扩展（类似于 Java 语言）。\n\n# JavaScript 中的 new 运算符 (The\
    \ new Operator in JavaScript)\n\n`new` 运算符用于创建对象的实例。为了在 JavaScript 中创建对象，语句带有\
    \ `new` 运算符，后面跟着所示的构造方法。在这里，构造方法是 `Object ()`、`Array ()` 和 `Date ()`。这些构造方法是内置\
    \ JavaScript 函数。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>The New Operator</title>\n<script type=\"text/javascript\"\
    >\nvar student = new Object();\n\nvar languages = new Array(\"JavaScript\", \"\
    Pascal\", \"Python\");\n\nvar day = new Date(\"August 24, 1989\");\n\nalert(day);\n\
    \n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n# 输出 (Output)\n\n当我们执行上述\
    \ HTML 程序时，将产生如下输出。在这里，我们在警告对话框上显示了 Date 对象的属性。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_107_0.png)\n\
    \n# “Object ()” 构造函数 (The “Object ()” Constructor)\n\n"
