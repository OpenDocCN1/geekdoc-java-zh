- md: "\nAs discussed before, the constructor is a function which creates and initializes\
    \ a JavaScript object. A special constructor function known as \"Object O\" is\
    \ used to build the object in JavaScript. The value returned by the \"Object O\"\
    \ constructor is assigned to a variable known as object reference variable. The\
    \ following example demonstrates the creation of an Object in JavaScript.\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Object\
    \ Creation</title>\n<script type=\"text/javascript\">\nvar student = new Object();\n\
    student.name = \"Appy\";\nstudent.age = \"21\";\nstudent.course = \"JavaScript\"\
    ;\nfunction showDetails() {\n alert(\"Name: \"+student.name + \" Age: \"+student.age+\"\
    \nCourse: \"+student.course);\n}\n</script>\n</head>\n<body>\n<input type=\"button\"\
    \ onclick=\"showDetails();\" value=\"Get Student details!\" />\n</body>\n</html>\n\
    ```\n\nThis is to be noted that the object properties variables are not defined\
    \ with the var keyword.\n\n## Output\n\nWhen we execute the above HTML program,\
    \ the following will be the output.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_109_0.png)\n\
    \n## Defining Methods for an Object in JavaScript\n\nIn the last example, we have\
    \ demonstrated to how to use the constructor that creates the object and assigns\
    \ properties. In the following example, we are going to demonstrate an example\
    \ to define methods for an object in JavaScript.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Object Methods</title>\n\
    <script type=\"text/javascript\">\n\nfunction student(name, course){\n  this.name\
    \ = name;\n\n  this.course = course;\n}\n</script>\n</head>\n<body>\n<script type=\"\
    text/javascript\">\n  var record = new student(\"Appy\", \"JavaScript\");\n  alert(\"\
    name is : \" + record.name + \"Course is \" + record.course );\n</script>\n</body>\n\
    </html>\n```\n\n## Output\n\nWe execute the above HTML program, the following\
    \ will be the output. Here, we have added a function along with an object.\n\n\
    ![](img/64de8c62f77548c4dca6c5e5001f0a6b_110_0.png)\n\n## The ‘with’ Keyword in\
    \ JavaScript\n\nIn JavaScript, the ‘with’ keyword is used as a shorthand to refer\
    \ to an object’s properties methods.\n\nHere, the object which is specified as\
    \ an argument to with becomes the default object for the duration of the block\
    \ that follows. In this case, the properties and methods for the object can be\
    \ used without naming the object. The following is the syntax and the example.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>With\
    \ Keyword</title>\n<script type=\"text/javascript\">\n// A function that will\
    \ work as a method\n\nfunction addAge(years){\n  with(this){\n    age = years;\n\
    \  }\n}\n\nfunction student(name, course){\n  this.name = name;\n  this.course\
    \ = course;\n  this.age = 0;\n  this.addAge = addAge; // Property that is a method.\n\
    }\n</script>\n</head>\n<body>\n<script type=\"text/javascript\">\nvar record =\
    \ new student(\"Appy\", \"JavaScript\");\nrecord.addAge(21);\nalert(\"Name is\
    \ : \" + record.name + \n\"\\nCourse is : \" + record.course + \n\"\\nAge is :\
    \ \" + record.age );\n\n</script>\n</body>\n</html>\n```\n\n## Output\n\nWhen\
    \ we execute the above HTML program, the following will be the output. Here, we\
    \ have used the ‘with’ keyword to add the age later by assigning a method as a\
    \ property.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_112_0.png)\n\n## Native\
    \ Objects in JavaScript\n\nJavaScript language has many built-in or native objects.\
    \ These native objects can be accessed in the program from anywhere and they will\
    \ work in the same way on any type of browser that is operating on any type of\
    \ the operating system. The following are the important JavaScript Native Objects.\n\
    \n- JavaScript Array Object.\n- JavaScript Boolean Object.\n- JavaScript Date\
    \ Object.\n- JavaScript Math Object.\n- JavaScript Number Object.\n- JavaScript\
    \ RegExp Object.\n- JavaScript String Object.\n\n## Conclusion\n\nThank you again\
    \ for downloading this book!\n\nI hope this book was able to help you learn JavaScript\n\
    \nThe next step is to put these practices to work for you.\n\nThank you and good\
    \ luck!\n\n## Preview Of Python Programming\n\n## Chapter 1\n## Introduction to\
    \ Python Programming Language\n\nDid you know websites like YouTube and Dropbox\
    \ use Python in their source code? Python is a vast language which is easy to\
    \ understand and apply. The next step is to put these practices to work for you.\
    \ Thank you and good luck!\n"
  mdcn: "\n正如之前讨论过的，构造函数（constructor）是一个创建和初始化 JavaScript 对象的函数。一种名为 \"Object O\"\
    \ 的特殊构造函数被用于在 JavaScript 中构建对象。\"Object O\" 构造函数返回的值被赋值给一个名为对象引用变量的。下面的示例演示了如何在\
    \ JavaScript 中创建对象。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>Object Creation</title>\n<script type=\"text/javascript\"\
    >\nvar student = new Object();\nstudent.name = \"Appy\";\nstudent.age = \"21\"\
    ;\nstudent.course = \"JavaScript\";\nfunction showDetails() {\n alert(\"Name:\
    \ \"+student.name + \" Age: \"+student.age+\"\nCourse: \"+student.course);\n}\n\
    </script>\n</head>\n<body>\n<input type=\"button\" onclick=\"showDetails();\"\
    \ value=\"Get Student details!\" />\n</body>\n</html>\n```\n\n需要注意的是，对象的属性变量并没有使用\
    \ `var` 关键字来定义。\n\n## 输出\n\n当我们执行上述 HTML 程序时，输出结果将如下所示。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_109_0.png)\n\
    \n## 在 JavaScript 中为对象定义方法\n\n在上一个示例中，我们演示了如何使用构造函数创建对象并分配属性。在接下来的示例中，我们将演示如何为\
    \ JavaScript 中的对象定义方法。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>Object Methods</title>\n<script type=\"text/javascript\"\
    >\n\nfunction student(name, course){\n  this.name = name;\n\n  this.course = course;\n\
    }\n</script>\n</head>\n<body>\n<script type=\"text/javascript\">\n  var record\
    \ = new student(\"Appy\", \"JavaScript\");\n  alert(\"name is : \" + record.name\
    \ + \"Course is \" + record.course );\n</script>\n</body>\n</html>\n```\n\n##\
    \ 输出\n\n我们执行上述 HTML 程序，输出结果将如下所示。在这里，我们为对象的同时添加了一个函数。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_110_0.png)\n\
    \n## JavaScript 中的 ‘with’ 关键字\n\n在 JavaScript 中，`with` 关键字被用作引用对象属性和方法的简写。\n\n\
    在这里，作为 `with` 参数指定的对象在随后的块范围内成为默认对象。在这种情况下，无需命名对象即可使用对象的属性和方法。以下是语法和示例。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>With Keyword</title>\n\
    <script type=\"text/javascript\">\n// 一个将作为方法工作的函数\n\nfunction addAge(years){\n\
    \  with(this){\n    age = years;\n  }\n}\n\nfunction student(name, course){\n\
    \  this.name = name;\n  this.course = course;\n  this.age = 0;\n  this.addAge\
    \ = addAge; // 这是一个方法的属性。\n}\n</script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\nvar record = new student(\"Appy\", \"JavaScript\");\nrecord.addAge(21);\nalert(\"\
    Name is : \" + record.name + \n\"\\nCourse is : \" + record.course + \n\"\\nAge\
    \ is : \" + record.age );\n\n</script>\n</body>\n</html>\n```\n\n## 输出\n\n当我们执行上述\
    \ HTML 程序时，输出结果将如下所示。在这里，我们使用了 `with` 关键字通过将方法赋值为属性来后续添加年龄。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_112_0.png)\n\
    \n## JavaScript 中的原生对象\n\nJavaScript 语言有很多内置或原生对象。这些原生对象可以在程序的任何地方访问，并且在运行任何操作系统的任何浏览器上都能以相同的方式工作。以下是重要的\
    \ JavaScript Native 对象：\n\n- JavaScript Array Object（数组对象）。\n- JavaScript Boolean\
    \ Object（布尔对象）。\n- JavaScript Date Object（日期对象）。\n- JavaScript Math Object（数学对象）。\n\
    - JavaScript Number Object（数字对象）。\n- JavaScript RegExp Object（正则表达式对象）。\n- JavaScript\
    \ String Object（字符串对象）。\n\n## 结论\n\n再次感谢下载本书！\n\n希望这本书能够帮助你学习 JavaScript。\n\n\
    下一步是让这些实践付诸实际。\n\n感谢并祝你好运！\n\n## Python 编程预览\n\n## 第 1 章\n## Python 编程语言简介\n\n\
    你知道 YouTube 和 Dropbox 等网站在源代码中使用了 Python 吗？Python 是一门易于理解和应用的巨大语言。下一步是让这些实践付诸实际。感谢并祝你好运！\n"
