    \nSelect the Settings and then click on Show advanced settings present at the\
    \ end of the page.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_28_1.png)\n\nUnder\
    \ the Privacy section, click on the Content settings button as shown below.\n\n\
    # Privacy\n\nGoogle Chrome may use services to improve your browsing experience.\
    \ You may optionally disable these services.\nLearn more\n\n- Use a service to\
    \ help resolve navigation errors\n- Use a prediction service to help complete\
    \ searches and URLs typed in the address bar or the launcher search box\n- Use\
    \ a prediction service to load pages more quickly\n- Automatically provide report\
    \ details of possible security incidents to Google\n- Protect you and your device\
    \ from dangerous sites\n- Use a service to help resolve spelling errors\n- Automatically\
    \ send usage statistics and crash reports to Google\n- Send a: \"Do Not Track\"\
    \ request with your browsing traffic\n\n# Passwords and forms\n\n- Enable Autofill\
    \ to fill out web forms in a single click. Manage Autofill settings\n- Offer to\
    \ save your web passwords. Manage passwords\n\n# Web content\n\n| Font size |\
    \ Medium | Customize fonts... |\n|---|---|---|\n| Page zoom | 100% | |\n\nIn the\
    \ \"Javascript\" section on the Content settings, select \"Do not allow any site\
    \ to run JavaScript\" or \"Allow all sites to run JavaScript (recommended)\" to\
    \ disable and enable the JavaScript page on the Chrome browser respectively. The\
    \ Content settings page is shown below.\n\n# Enabling or disabling the JavaScript\
    \ support in Opera\n\nThe following are the steps to enable or disable the JavaScript\
    \ support in Opera.\n\nOpen the Opera browser and follow Tools Preferences from\
    \ the menu.\n\nThen, Select the Advanced option from the dialog box.\n\nNext,\
    \ select the Content from the listed items.\n\nFrom there, select Enable JavaScript\
    \ checkbox.\n\nLastly, click OK button to enable the JavaScript support in Opera\
    \ browser.\n\nSimilarly, to disable the JavaScript support in Opera browser, we\
    \ should not select the Enable JavaScript checkbox and click on the OK button.\n\
    \n# Warning for Non-JavaScript Browsers\n\nWhen we have to do something very important\
    \ by using the JavaScript, then we can show a warning message to the user by using\
    \ the <noscript> tags. We can add a <noscript> block immediately after the script\
    \ block as shown below.\n\n```\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>No Script tag</title>\n</head>\n<body>\n<script type=\"\
    text/javascript\">\ndocument.write(\"JavaScript Support is enabled on your browser!\"\
    );\n</script>\n<noscript>\nPlease enable JavaScript support on your browser.\n\
    </noscript>\n</body>\n</html>\n```\n\nIf any of the above browser does not support\
    \ JavaScript or JavaScript support is disabled, then the message between the <noscript></noscript>\
    \ tags will be shown on the screen.\n\n# # Chapter 6\n# JavaScript Placement\n\
    \nPlacement of JavaScript code in the HTML document is very flexible and can be\
    \ placed in the following ways.\n\n**JavaScript in <head>...</head> section**\
    \ It is the most preferred way to include the JavaScript code in the head section\
    \ of the HTML document. We can place the JavaScript code or functions in the head\
    \ section and can access these functions on the web elements events as shown below.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>JS\
    \ in head section</title>\n<script type=\"text/javascript\">\n  function showAlert()\
    \ {\n    alert(\"This is an alert from Head section!\");\n  }\n</script>\n</head>\n\
    <body>\n  <input type=\"button\" onclick=\"showAlert();\" value=\"Call JavaScript\"\
    />\n</body>\n</html>\n```\n\n# Output\n\nWhen we execute the above HTML program,\
    \ the following will be the output. In the output, we can see the alert with a\
    \ message as “This is an alert from Head section”, when we click on the button\
    \ present on the web page.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_34_0.png)\n\
    \n# JavaScript in <body>...section — we can also place the JavaScript code in\
    \ the body section of the HTML, however this approach is not preferred as we call\
    \ JavaScript functions from body section which are preferably defined in the head\
    \ section of the document.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta\
    \ charset=\"ISO-8859-1\">\n<title>JS Body</title>\n</head>\n<body>\n<script type=\"\
    text/javascript\">\ndocument.write(\"Welcome to Tutorials!\");\n</script>\n<p>Body\
    \ section of the HTML document.</p>\n</body>\n</html>\n```\n\n# Output\n\nWhen\
    \ we execute the above HTML program, the following will be the output. In the\
    \ output, we can see the text \"Welcome to Tutorials!\" written via JavaScript\
    \ on the page which is placed in its body section.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_35_0.png)\n\
    \n# JavaScript in <body> and <head> sections — in this approach, the JavaScript\
    \ code is placed in both the head and the body section of the HTML document as\
    \ shown in the following example.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>JS Head and Body</title>\n<script type=\"\
    text/javascript\">\nfunction showAlert() {\n    alert(\"This is an alert from\
    \ Head section!\");\n}\n</script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\n  document.write(\"Welcome to Tutorials!\")\n</script>\n<p>Body section of\
    \ the HTML document.</p>\n<input type=\"button\" onclick=\"showAlert()\" value=\"\
    Call JavaScript\"/>\n</body>\n</html>\n```\n\n# Output\n\nWhen we execute the\
    \ above HTML program, the following will be the output. In the output, we can\
    \ see the text “Welcome to Tutorials!” written via JavaScript on the page which\
    \ is placed in its body section. At the same time, when we click on the button,\
    \ it will display an alert message as “This is an alert from Head section”. This\
    \ is the JavaScript function called on click event of the button which is defined\
    \ in the head section of the document.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_36_0.png)\n\
    \n# JavaScript placed in an external file and include in <head>...section — it\
    \ is one of the best approach of placing all the JavaScript code in an external\
    \ file which has extension as code.js and we include this in the head section\
    \ of the HTML document. All the functions which are present in this file can be\
    \ called on various web elements defined in the body section of the document.\
    \ In the following example we have declared the function as showAlert() in a separate\
    \ file \"demo.js\" located in js directory.\n\n```javascript\nfunction showAlert(){\n\
    \    alert(\"This is an alert from Head section!\");\n}\n```\n\nWe are including\
    \ this external JavaScript file in the head section of the HTML document as shown\
    \ below.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>JS External File</title>\n<script type=\"text/javascript\" src=\"js/demo.js\"\
    ></script>\n</head>\n<body>\n  <input type=\"button\" onclick=\"showAlert()\"\
    \ value=\"Call JavaScript\" />\n</body>\n</html>\n```\n\n# Output\n\nWhen we execute\
    \ the above HTML program, the following will be the output. In the output, we\
    \ can see the alert with a message as “This is an alert from Head section”, this\
    \ is the JavaScript function called on click event of the button which is defined\
    \ in the external demo.js file and included in the head section of the HTML document.\
    \ This works the same way as if we include the JavaScript function code in the\
    \ head section of the HTML document.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_38_0.png)\n\
    \n# Chapter 7\n\n# JavaScript Variables\n\n# Datatypes in JavaScript\n\nIt is\
    \ the characteristic of every programming language to support operations on the\
    \ set of data types. These are the actual values which are defined and manipulated\
    \ in any programming language. Like any other programming language, the JavaScript\
    \ language allows us to work with the following three primitive types.\n\n- Numbers,\
    \ e.g. 1, 23, 10.50, 23.8990 etc.\n- Strings or text data, e.g. “JavaScript”,\
    \ “This is my language”, etc.\n- Boolean, as it could be either true or false.\n\
    \nApart from these three primitive datatypes, JavaScript language also defines\
    \ the following two trivial types. Each of which defines only a single value.\n\
    \n- Null.\n- Undefined.\n\nAlso, JavaScript language supports a composite data\
    \ type known as object. JavaScript objects will be covered in detail later in\
    \ this tutorial.\n\nThis is to be noted that the JavaScript language does not\
    \ make a distinction between integer values and floating-point values. JavaScript\
    \ considers all numbers as the floating-point values. JavaScript represents numbers\
    \ by using the 64-bit floating-point format which is defined by the IEEE 754 standard.\n\
    \n# Variables in JavaScript\n\nAs discussed earlier, the JavaScript language has\
    \ variables as data containers where we can place data into these containers and\
    \ then refer this data by simply naming the container. We declare JavaScript variable\
    \ with the var keyword as shown below.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_40_0.png)\n"
  mdcn: "\n如浏览器所示。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_28_0.png)\n\n选择“设置”，然后点击页面底部的“高级设置”。\n\
    \n![](img/64de8c62f77548c4dca6c5e5001f0a6b_28_1.png)\n\n在“隐私”部分下，点击下方所示的“内容设置”按钮。\n\
    \n# 隐私\n\nGoogle Chrome 可能会使用服务来改进您的浏览体验。您可以根据需要自行禁用这些服务。\n了解更多\n\n- 使用服务帮助解决导航错误\n\
    - 使用预测服务帮助完成在地址栏或启动器搜索框中输入的搜索和 URL\n- 使用预测服务更快速地加载页面\n- 自动向 Google 提供可能的安全事件的详细报告\n\
    - 保护您和您的设备免受危险网站的影响\n- 使用服务帮助解决拼写错误\n- 自动向 Google 发送使用统计和崩溃报告\n- 在您的浏览流量中发送：“请勿跟踪”请求\n\
    \n# 密码和表单\n\n- 启用自动填充以单击填写网页表单。管理自动填充设置\n- 提示保存您的网页密码。管理密码\n\n# 网络内容\n\n| 字体大小\
    \ | 中等 | 自定义字体... |\n|---|---|---|\n| 页面缩放 | 100% | |\n\n在内容设置的“Javascript”部分，选择“不允许任何网站运行\
    \ JavaScript”或“允许所有网站运行 JavaScript（推荐）”来分别禁用和启用 Chrome 浏览器上的 JavaScript 页面。内容设置页面所示。\n\
    \n# 在 Opera 中启用或禁用 JavaScript 支持\n\n以下是在 Opera 中启用或禁用 JavaScript 支持的步骤。\n\n打开\
    \ Opera 浏览器，并从菜单进入“工具 偏好”。\n\n然后，从对话框中选择“高级”选项。\n\n接下来，从列出的项目中选择“内容”。\n\n从那里，勾选“启用\
    \ JavaScript”复框。\n\n最后，点击“确定”按钮启用 Opera 浏览器的 JavaScript 支持。\n\n同样，要禁用 Opera 浏览器的\
    \ JavaScript 支持，我们不应该勾选“启用 JavaScript”复框并点击“确定”按钮。\n\n# 非 JavaScript 浏览器的警告\n\n\
    当我们需要使用 JavaScript 执行非常重要的操作时，我们可以使用 `<noscript>` 标签向用户显示警告消息。我们可以像下面所示在脚本块之后添加一个\
    \ `<noscript>` 块。\n\n```\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>No Script tag</title>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\ndocument.write(\"JavaScript Support is enabled on your browser!\");\n</script>\n\
    <noscript>\n请在您的浏览器上启用 JavaScript 支持。\n</noscript>\n</body>\n</html>\n```\n\n\
    如果上述任何浏览器不支持 JavaScript 或 JavaScript 支持被禁用，则 `<noscript></noscript>` 标签之间的消息将显示在屏幕上。\n\
    \n# # 第6 章\n# JavaScript 的放置\n\nJavaScript 代码在 HTML 文档中的放置非常灵活，可以按照以下方式放置。\n\n\
    **在 <head>...</head> 部分中放置 JavaScript** 这是在 HTML 文档的 head 部分包含 JavaScript 代码的最优选方式。我们可以在\
    \ head 部分放置 JavaScript 代码或函数，并在网页元素事件上访问这些函数，如下所示。\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>JS in head section</title>\n\
    <script type=\"text/javascript\">\n  function showAlert() {\n    alert(\"This\
    \ is an alert from Head section!\");\n  }\n</script>\n</head>\n<body>\n  <input\
    \ type=\"button\" onclick=\"showAlert();\" value=\"Call JavaScript\"/>\n</body>\n\
    </html>\n```\n\n# 输出\n\n当我们执行上述 HTML 程序时，将得到如下输出。在输出中，当我们点击网页上的按钮时，可以看到带有消息为“This\
    \ is an alert from Head section”的警报框。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_34_0.png)\n\
    \n# 在 <body>...section 部分中放置 JavaScript — 我们也可以将 JavaScript 代码放置在 HTML 的 body\
    \ 部分，但这种方法并不受推崇，因为我们从 body 部分调用 JavaScript 函数，而这些函数最好是定义在文档的 head 部分。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>JS Body</title>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\ndocument.write(\"Welcome to\
    \ Tutorials!\");\n</script>\n<p>Body section of the HTML document.</p>\n</body>\n\
    </html>\n```\n\n# 输出\n\n当我们执行上述 HTML 程序时，将得到如下输出。在输出中，我们可以看到通过 JavaScript 在位于其\
    \ body 部分页面上编写的“Welcome to Tutorials!”文本。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_35_0.png)\n\
    \n# 在 <body> 和 <head> 部分中放置 JavaScript — 在这种方法中，JavaScript 代码被同时放置在 HTML 文档的 head\
    \ 和 body 部分，如下例所示。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>JS Head and Body</title>\n<script type=\"text/javascript\"\
    >\nfunction showAlert() {\n    alert(\"This is an alert from Head section!\");\n\
    }\n</script>\n</head>\n<body>\n<script type=\"text/javascript\">\ndocument.write(\"\
    Welcome to Tutorials!\");\n</script>\n<p>Body section of the HTML document.</p>\n\
    <input type=\"button\" onclick=\"showAlert();\" value=\"Call JavaScript\"/>\n\
    </body>\n</html>\n```\n\n# 输出\n\n当我们执行上述 HTML 程序时，将得到如下输出。在输出中，我们可以看到通过 JavaScript\
    \ 在位于其 body 部分页面上编写的“Welcome to Tutorials!”文本。当点击按钮时，可以看到带有消息为“This is an alert\
    \ from Head section”的警报框。JavaScript 放置在外部文件并在 <head> 部分的方式如下。\n\n```javascript\n\
    function showAlert() {\n    alert(\"This is an alert from Head section!\");\n\
    }\n```\n\n我们将此外部文件包含在 HTML 的 head 部分，如下所示。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>Output</title>\n```\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_36_0.png)\n\
    \n# 变量变量\n\nJavaScript 变量\n\n正如之前讨论的，JavaScript 语言具有数据容器的变量，我们可以将数据放入这些容器，然后通过简单命名容器来引用这些数据。我们使用\
    \ `var` 关键字声明 JavaScript 变量，如下所示。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_40_0.png)\n"
