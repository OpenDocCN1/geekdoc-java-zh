    \ while loop except that the condition check in case of do...while loop happens\
    \ at the end of the loop. This means that the code block inside the loop will\
    \ always be executed at least once, even if the condition is false. The following\
    \ is the syntax and the example of while loop statement.\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Do While Loop</title>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\nvar counter = 0;\ndocument.write(\"\
    Entering while Loop!\");\ndo {\ndocument.write(\"Current Counter is : \" + counter\
    \ + \"<br/>\");\ncounter++;\n}\nwhile (counter < 5) {\ndocument.write(\"Exiting\
    \ while Loop!\");\n}\n</script>\n<p>We are inside body section...</p>\n</body>\n\
    </html>\n```\n\n## Output\n\nWhen we execute the above HTML program, the following\
    \ will be the output. The counter will write 5 times on the HTML page as it held\
    \ its condition true 5 times including the first no check condition.\n\n![](img/64de8c62f77548c4ca6c5e5001f0a6b_67_0.png)\n\
    \n## For loop statement\n\nThe ‘for’ loop is very important and mostly used looping\
    \ statement in JavaScript programming. The command has the following three important\
    \ parts.\n\n**Loop initialization** — it is where we initialize our counter value\
    \ to a starting value. This statement is executed before the looping begins.\n\
    \n**Test statement** — it has the actual condition which is evaluated to be true\
    \ or false. If this condition evaluates to true, the block of code inside the\
    \ loop will be executed, otherwise, if the control will exit the loop.\n\n**Iteration\
    \ statement** — it is place we increase or decrease the counter value which was\
    \ initialized in the first statement.\n\nThe good part of for is that we can put\
    \ out all of these three statement parts in a single line which is separated by\
    \ semicolons. The following is the syntax and the example.\n\n```\n<!DOCTYPE html>\n\
    <html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>For Loop</title>\n</head>\n\
    <body>\n<script type=\"text/javascript\">\ndocument.write(\"Entering while Loop!\"\
