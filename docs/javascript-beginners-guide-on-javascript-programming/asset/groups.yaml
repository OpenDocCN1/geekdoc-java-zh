    ## 第一章


    ### JavaScript 语言简介


    欢迎来到 JavaScript 的世界。它由 Brendan Eich 于 1995 年发明，直到今天仍然是全球最常用的脚本语言。它是一种高级、解释型、跨平台的开源编程语言。在这一系列教程中，我们将通过实际示例来学习
    JavaScript。在开始之前，让我们先回顾一些基础知识。


    JavaScript 是一种面向对象（OOP）脚本语言，主要用于 Web 编程。它负责让网页具有交互性；简单来说，“它告诉网页执行什么操作”。就像 HTML
    定义了网页的内容，CSS 定义了布局，JavaScript 让该网页能够正常工作。JavaScript 程序是按照编写顺序执行的指令集，因此在编码时，我们应该注意逻辑顺序。不要将
    Java 和 JavaScript 混淆，它们在设计方面技术上是两种不同的语言，但它们的标准库和语法是相同的。


    现在，让我们学习如何在你的计算机上安装这种神奇的语言，并编写我们的第一个 JavaScript 程序。


    ## 第二章


    ### 开发 IDE 环境搭建


    在整个教程中，我们将使用 eclipse 作为开发 IDE，以实际演示解释 JavaScript 程序示例。以下是安装 eclipse 并为 JavaScript
    配置开发环境的步骤。


    请遵循以下步骤：


    1. 从下方链接下载 eclipse。选择最新的稳定版本 eclipse，并确保如果你的机器是 64 位的，则选择 64 位的 eclipse。在本教程中使用
    eclipse MARS.1 版本。


    https://eclipse.org/downloads


    2. 点击 eclipse.exe 打开 eclipse，它会提示你选择一个本地目录作为其工作空间（workspace），如下方的截图所示。


    3. 在任何可用驱动器上选择或创建一个目录，点击 OK 按钮启动 eclipse。


    ![](img/64de8c62f77548c4dca6c5e5001f0a6b_9_0.png)


    4. 在 eclipse 中，导航至 File（文件）-> New（新建）-> Static Web Project（静态 Web 项目）。点击下方显示的链接。


    5. 将打开一个对话框，要求你输入项目名称。请输入项目名称并点击下方的“Finish”（完成）按钮。


    ![](img/64de8c62f77548c4dca6c5e5001f0a6b_11_0.png)


    6. 在 Eclipse 的左侧（项目资源管理器），展开项目目录并右键点击“WebContent”文件夹。若要在当前项目中添加 HTML 文件，导航至 New（新建）->
    HTML File（HTML 文件），如下所示。


    ![](img/64de8c62f77548c4dca6c5e5001f0a6b_12_0.png)


    7. 将打开一个对话框，要求你输入项目名称。请输入项目名称并点击下方的“Finish”（完成）按钮。这将向项目中添加一个 HTML 文件。


    ![](img/64de8c62f77548c4dca6c5e5001f0a6b_13_0.png)


    到此，你已完成 JavaScript 的开发工作。在下一章中，我们将使用此设置开发我们的第一个 JavaScript 程序。


    ![](img/64de8c62f77548c4dca6c5e5001f0a6b_13_1.png)


    ## 第三章


    ### 我的第一个 JavaScript 程序


    JavaScript 是一种脚本语言，可以注入到网页的任何位置 `<script>...</script>` 标签中，但通常建议放在 `<head> ...
    </head>` 标签区域。


    在解析网页上的标记文本（HTML）时，当浏览器程序遇到 `<script>` 标签，它开始解释这些标签之间（直到 `</script>`）的所有文本。<script>
    标签接受以下属性：


    Language（语言）属性指定我们正在使用的脚本语言类型。其值为“javascript”，用于 JavaScript 语言。在最新版本的 HTML 中，该属性已被废弃。


    Type（类型）属性指示所包含的脚本语言类型，其值将设置为“text/javascript”，用于 JavaScript 语言。


    # 我的第一个 JavaScript 程序


    在上一章中，我们创建了一个 html 文件 (MyFirstJavaScriptProgram.html)。让我们使用它来编写我们的第一个 JavaScript
    程序，如下所示。


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="ISO-8859-1">

    <title>My First JavaScript Program</title>

    </head>

    <body>

    ```


    ```

    <script language="javascript" type="text/javascript">

    document.write("Welcome to JavaScript First Program");


    </script>

    </body>

    </html>

    ```


    # JavaScript 代码 <body> ... </body> 标签的解释


    在这里，我们将 JavaScript 代码注入到 HTML 的 `<body> ... </body>` 标签之间。在 JavaScript 代码/脚本中，我们首先按照讨论声明了两个属性，然后通过
    document 对象的帮助，在网页上写入“Welcome to JavaScript First Program”消息。


    # 输出


    当我们执行上述 HTML 程序时，将得到以下输出。


    ![](img/64de8c62f77548c4dca6c5e5001f0a6b_16_0.png)


    # 空格与换行


    我们可以在 JavaScript 程序中自由使用空格、制表符和换行，因为浏览器解析程序在解析 JavaScript 代码时会忽略这些内容。此外，我们可以自由地对
    JavaScript 程序进行格式化和缩进，使脚本非常易于维护、阅读和理解。


