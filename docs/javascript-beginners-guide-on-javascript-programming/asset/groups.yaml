    \ just like the >> Ex: (X >>> operator, except that the bits 1) is 1. shifted\
    \ in on on the left are always zero. |\n\n## Chapter 9\n## JavaScript Decision\
    \ Making\n\nWhile writing a program, most of the time we face a situation where\
    \ we have to make a decision. Decision making is the anticipation of conditions\
    \ that could occur while execution of a program and there is a need to specify\
    \ some actions according to those conditions.\n\nIn a decision making structures,\
    \ there is a condition which is either a single expression or multiple expressions.\
    \ This condition when evaluated produce either TRUE or FALSE as outcome. Based\
    \ on the outcome, we need to determine which action to take and which statements\
    \ to execute. Refer the figure below to understand it clearly.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_55_0.png)\n\
    \nLike any other programming language, the JavaScript language supports conditional\
    \ statements which are used to perform different actions based on different conditions.\
    \ The following are the conditional statement supported by the JavaScript language.\n\
    \n- if statement.\n- if...else statement\n- if...else if... statement.\n- Switch\
    \ case statement\n\nLet's understand these statements with the help of a JavaScript\
    \ program.\n\nif statement — the if statement is a basic control statement which\
    \ allows the JavaScript code to make decisions and execute statements based on\
