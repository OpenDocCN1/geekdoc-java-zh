    ## 第 11 章

    ## JavaScript 函数


    函数可以被定义为一个组织良好且可多次复用的代码块，用于执行程序中需要高度模块化和复用性的操作。通过函数的概念，程序员可以将一个大程序拆分成许多较小的函数。


    与任何其他编程语言一样，JavaScript 语言也支持使用函数编写模块化代码的功能。从本教程开始，我们就使用了 `alert()` 和 `write()`
