    \ within a loop. In JavaScript, we can use a while loop in another while or for\
    \ loop or for loop in another while or for loop. |\n\n## Loop control statements\n\
    \nLoop control statements in JavaScript language are used to change execution\
    \ from its normal sequence. When such execution leaves a scope, all automatic\
    \ objects created in that scope are destroyed or removed.\n\nIn JavaScript language,\
    \ the following loop control statements are supported.\n\n| Control Statement\
    \ | Description |\n|---|---|\n| break statement | The break statement in JavaScript\
    \ is used to terminate the loop statement and transfers execution to the statement\
    \ immediately following the end of loop. |\n| continue statement | The continue\
    \ statement in JavaScript is used to cause the loop to skip the remainder of its\
    \ body and immediately retest its condition prior to iterating the looping body.\
    \ |\n\nLet’ understand these loop control statement in a better way with the help\
    \ of the following example.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_71_0.png)\n\
