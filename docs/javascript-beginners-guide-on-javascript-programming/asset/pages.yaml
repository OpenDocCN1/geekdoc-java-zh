  md: "# # Chapter 6\n# JavaScript Placement\n\nPlacement of JavaScript code in the\
    \ HTML document is very flexible and can be placed in the following ways.\n\n\
    **JavaScript in <head>...</head> section** It is the most preferred way to include\
    \ the JavaScript code in the head section of the HTML document. We can place the\
    \ JavaScript code or functions in the head section and can access these functions\
    \ on the web elements events as shown below.\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>JS in head section</title>\n<script\
    \ type=\"text/javascript\">\n  function showAlert({\n    alert(\"This is an alert\
    \ from Head section!\");\n  }\n</script>\n</head>\n<body>\n  <input type=\"button\"\
    \ onclick=\"showAlert();\" value=\"Call JavaScript\"/>\n```"
