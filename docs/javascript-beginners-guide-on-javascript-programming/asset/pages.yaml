    String and Boolean), or any of the abstract data types (such as an object). Object
    properties are the variables which are used internally in the object’s methods.
    They can also be used as globally visible variables therefore, can be used throughout
    the page. The following is the syntax and the example.


    ```

    <!DOCTYPE html>

    <html>

    ```'
