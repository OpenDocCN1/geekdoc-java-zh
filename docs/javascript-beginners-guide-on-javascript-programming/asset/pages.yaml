    # Native Objects in JavaScript


    JavaScript language has many built-in or native objects. These native objects
    can be accessed in the program from anywhere and they will work in the same way
    on any type of browser that is operating on any type of the operating system.
    The following are the important JavaScript Native Objects.


    +   - JavaScript Array Object.

    - JavaScript Boolean Object.

    - JavaScript Date Object.

    - JavaScript Math Object.'
