  md: '# # Chapter 1

    # Introduction to Python Programming Language


    Did you know websites like YouTube and Dropbox use Python in their source code?
    Python is a vast language which is easy to understand and apply. You can develop
    almost anything using Python. Most of the operating systems (Mac, Linux, UNIX,
    etc.) other than windows have python installed by default. It is an open source
    and free language. In this eBook, we going to learn this awesome code language
    and apply it on various examples. There are no type declaration of methods, parameters,
    functions or variables (like in other languages) in Python which makes its code
    short and simple. As mentioned earlier, this language can be used in everything,
    whether you want to build a website, a game or a search engine. The main advantage
    of using Python is that you do not have to run compiler explicitly, it is purely
    interpreted language like Perl or Shell.


    File extension which is used by Python source file is “.py” and it is a case-sensitive
    language, so “P” and “p” would be considered as two different variables. Also,
    Python figures out the variable type on its own, for example, if you use x=4 and
    y=''Python’ then it will consider x as integer and y as string. We going to learn
    all these basics in detail in further chapters. Before moving forward, few important
    points to remember:


    +   - For assigning a value “=” is used and for comparison “==” is used. Example,
    x=4, y=8, x==y

    - “print” is used to print results.

    - All the mathematical operations like +, -, *, /, % are used with numbers

    - Variable is created when a value is assigned to it. Example, a=5 create a variable
    named “a” which has an integer value of 5. There is no need to define it beforehand.

    - “+” can also be used to concatenate two string. Example, z=“Hi”, z= z + “Python”

    - For logical operations “and”, “or”, “not” are used instead of symbols.


    There are three basic data types: integer (by default for numbers), floats (a=3.125)
    and'
