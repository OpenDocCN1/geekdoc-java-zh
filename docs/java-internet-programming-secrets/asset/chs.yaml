  \ + 1];\n        if (!nextBase.equals(base)) {\n            messageError(\"Can't\
  \ deal with \" + base);\n            return false;\n        }\n        try {\n \
  \           String sub = packageName + base;\n            configureObject.attach(sub);\n\
  \            hierarchyDepth++;\n            return true;\n        } catch (ConfigurationAttachmentException\
  \ e) {\n            messageError(\"Attachment not allowed\", e);\n        } catch\
