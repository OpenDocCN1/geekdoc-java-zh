  \ applet 之间的通信。`applet`，核心逻辑。\n\n```java\nclass ListenApplet extends applet {\n\
  \    // 输出区域\n    private TextArea output;\n    // 来自 applet 的输入流\n    private Hashtable\
  \ inipes;\n\n    public void init() {\n        inpipes = new Hashtable(1);\n   \
  \     output = new TextArea(10,60);\n        output.setEditable(false);\n      \
  \  output.appendText(\"This applet listens for\\napplets.\\n\");\n    }\n    add(output);\n\
  }\n```\n\n`ListenApplet` 通过维护这些流的哈表来跟踪其 `OutputStreams`。该哈表允许多个 applet 之间的通信。`applet`，想要从数据\
  \ `applet` 说话，向调用 `ListenApplet` 的方法发起请求。名称在 HTML 中给出：\n\n```html\n<APPLET CODE=\"\
  ...\" WIDTH=### HEIGHT=###\n```\n\n通过向该 `applet` 建立链接，你可以传递回 `OutputStream`。\n\n\
  \n\n\n\n如果另一个 applet 已向流写入了数据，我们的 applet 将从流中读取数据，直到没有更多数据为止，将其转换为 `String` 并打印到\
  \ `TextArea` 中。如果你需要处理多个同步交互的 applet，最好将此方法放入一个单独的线程中。首先，我们将数据读取到一个长度为 `8` 的缓冲区中。当达到数组边界时，我们根据上一个数组长度的倍倍创建一个新数组。这种使用数组处理未知数量数据的\
  \ `a` 方法似乎比我们之前考虑过的要复杂。我们没有像之前的示例那样仅仅将数据拷贝到几个数组中，而是使用一个数组，但一旦它满了，我们就会将其长度翻倍：\n\n\
  ```java\npublic void listen(Applet a) throws IOException {\n    PipedInputStream\
  \ in = (PipedInputStream)pipes.get(a);\n    if (in==null) {\n        return;\n \
  \   }\n\n    int count = 0;\n    int arysize = 8;\n\n    byte ary[] = new byte[arysize];\n\
  \    byte b;\n\n    b = (byte)in.read();\n    // if flow not full\n    while (b!=-1)\
  \ {\n        // if we already filled our array\n        if (count==arysize) {\n\
  \            arysize = arysize*2;\n            byte temp[] = new byte[arysize];\n\
  \            // this last system called\n            // to copy an array\n     \
  \       System.arraycopy(ary,0,temp,0,count);\n            ary = temp;\n       \
  \ }\n\n        ary[count] = b;\n        count++;\n        b = (byte)in.read();\n\
  \    }\n    Stringbuffer = new String(ary,0);\n    output.appendText(\"Received:\
  \ \"+buffer);\n}\n```\n\n监听 applet 将静静地停留在网页上。需要调用第二个 applet 与它对话。以下是说话 applet 的程序。请注意，由于我们使用了扩展属性\
  \ applet `ListenApplet`，我们需要导入它。\n\n### 示例 13-6b. 说话 applet (Talking applet).\n\n\
  ```java\nimport ListenApplet;\nimport java.awt.*;\nimport java.io.*;\nimport java.applet.*;\n\
  \npublic class MasterApplet extends applet {\n    // input custom window\n    private\
  \ text area output;\n    // signal send input data\n    private button send;\n \
  \   public void init() {\n        output = new TextArea(10,60);\n        output.setEditable(true);\n\
  \        send = new Button(\"Send\");\n        add(send);\n        add(output);\n\
  \    }\n```\n\n一旦用户点击提交（Submit）按钮，就会执行方法。我们找到想要对话的 applet，并将 `TextArea` 中的内容字段发送给它：\n\
  \n```java\npublic boolean action(Event evt, Object o) {\n    if (evt.target!=send)\
  \ {\n        return false;\n    }\n\n    ListenApplet slave;\n    slave = (ListenApplet)getAppletContext().getApplet(\"\
  listen\");\n    if (slave==null) {\n        output.appendText(\"Found no listening\
  \ applet.\\n\");\n    } else try {\n        sendMessage(output.getText(),slave);\n\
  \        output.setText(\"\");\n    } catch (IOException e) {\n        output.appendText(e.toString()+\"\
  \\n\");\n    }\n    return true;\n}\n```\n\n在下文的程序中，我们尝试将字符串发送到目标（target）applet。\n\
  \n首先，我们调用 applet 获取一个 `OutputStream`。然后我们将字符串转换为字节数组并写入流中，添加换行符和结束符（EOF）字符。我们让另一个\
  \ applet 读取流内容然后关闭连接：\n\n```java\npublic void sendMessage(String s, ListenApplet\
  \ a) throws IOException {\n    PipedOutputStream out;\n    out = a.call(this);\n\
  \    byte b[] = new byte[s.length()];\n    s.getBytes(0,s.length(),b,0);\n    out.write(b);\n\
  \    byte NL = '\\n';\n    out.write(NL);\n    byte EOF = -1;\n    out.write(EOF);\n\
  \    a.listen(this);\n    a.hangup(this);\n    out.close();\n}\n```\n\n用于网页的 HTML\
  \ 代码（包含这两个 applet）如下：\n\n```html\n<APPLET CODE=\"ListenApplet.class\" WIDTH=500\
  \ HEIGHT=250 NAME=\"Listener\"></APPlet>\n<APPLET CODE=\"MasterApplet.class\" WIDTH=500\
  \ HEIGHT=250></APPLET>\n```\n\n# 接下来是什么？\n\n使用 socket 和流进行网络通信的方法已经存在多年；它仍然是网络上通信最简单、最快的方法。URL\
  \ 是近期添加到不断改进的网络通信标准中的。URL 提供了对所有需要识别的标识进行编码的能力。\n\n\n\n\n\nJava 包含了 `java.net.URL`\
  \ 类，允许你处理由 Java 原生拥有的 URL。此外，Java 对协议类型有内置支持，并为程序员提供了为新协议创建自定义支持的机会。在第 5 章“工作中的\
  \ Applet”中，我们讨论了绝对 URL 和相对 URL 的构造结构。`URL` 类的四个构造函数见表 14-2。\n\n### 表 14-2. `URL`\
  \ 类的构造函数\n\n| 构造函数 | 描述 |\n| :--- | :--- |\n| `URL(String,string,int,String)` |\
  \ 根据类型类型 `Protocol`、主机名 `hosta`、端口号 `port` 和目录位置创建绝对 URL。 |\n| `URL(String,String,String)`\
  \ | 根据类型 `Protocol`、主机名 `hosta`、端口号和目录位置创建绝对 URL。该协议的端口号由默认值决定。 |\n| `URL(String)`\
  \ | 从未解析的行字符串创建绝对 URL。 |\n| `URL(URL,String)` | 从未解析的 URL 字符串创建绝对 URL，包含相对于给定 `URL`\
  \ 的目录。 |\n\nSun 仅为少数协议开发了 `URL` 支持——`DOC`、`FILE` 和 `HTTP`。在本章稍后的“与其他协议一起工作”部分中，我们将讨论如何为新的\
  \ `URL` 类协议创建自己的支持。`URL` 类的所有公共方法见表 14-3。\n\n### 表 14-3. `URL` 类的通用方法\n\n| 方法 |\
  \ 描述 |\n| :--- | :--- |\n| `boolean equals(URL)` | 两个 `URL` 的等效性。 |\n| `String getFile()`\
  \ | 返回给定主机资源的绝对路径。 |\n| `String getHost()` | 返回主机 `host`。 |\n| `int getPort()` |\
  \ 返回端口。 |\n| `String getProtocol()` | 返回协议类型。 |\n| `String getRef()` | 返回文件特定位置的链接。\
  \ |\n\n例如，`[`WWW.vmedia.com/indexhtml#middle`](http://WWW.vmedia.com/indexhtml#middle)`\
  \ 包含 `index.html` 文件内指定位置的链接 `\"middle\"`。\n\n`sameFile(URL)` | 比较两个 URL 是否相等，忽略所有链接。\
  \ |\n`String toExternalForm()` | 打印完全准备好的 URL。 |\n`Object getContent()` | 获取给定 `URL`\
  \ 的内容。 |\n`inputstream openStream()` | 从资源返回 `InputStream`。 |\n`openConnection()`\
  \ | 为给定 `URL` 返回 `URLConnection`。 |\n`setURLStreamHandleFactory(URLStreamHandleFactory)`\
  \ | 设置 `URLStreamHandleFactory`。 |\n\n通过实现 `url` 类，我们希望访问它所指示的资源。`URL` 类为此目的提供了三个主要方法。最简单的是从\
  \ `URL` 获得的 `inputstream` 读取。这是通过 `openStream` 方法实现的：\n\n```java\nInputStream is;\n\
  try {\n    is = myURL.openStream();\n    // 从 is 读取数据\n} catch (IOException e) {}\n\
  ```\n\n在这种情况下，URL 的使用与 socket 的区别不大。主要区别在于，当使用 URL 编程时，socket 通信会在指定的端口自动打开，并执行所有的握手协议和请求程序。例如，如果你正在从标准的\
  \ HTTP URL 请求流，`URL` 会在特定服务器的端口 `80` 上打开 socket，并针对特定的目录位置发出 `GET` 命令。`openStream`\
  \ 返回的 `InputStream` 位于资源字节流的开头。下面是一个直接从 `URL` 的 `inputstream` 读取的简短示例：\n\n```java\n\
  URL myURL;\ntry {\n    myURL = new URL(getCodeBase(), \"/index.html\");\n} catch\
  \ (MalformedURLException e) {}\ntry {\n    inputstream is = myURL.openStream();\n\
  \    int i = is.read();\n    while (i != -1) {\n        // 从流读取数据\n    }\n} catch\
  \ (IOException e) {}\n```\n\n在这里，我们为 applet 的 Web 页面创建一个 `URL`，打开连接到该页面的 `InputStream`，并从\
  \ `inputstream` 读取 HTML 文件。\n\n#### 获取内容\n\n`getContent` 方法是 `URL` 类的一个很好的属性，目前使用较少。该方法打开资源流的方式与\
  \ `openStream` 方法相同，但随后尝试确定流的 MIME 类型并将流转换为 Java 对象。通过数据流的 MIME 类型，`URL` 可以数据流传递给专门为处理该类型数据创建的方法。该方法必须提取封装在相应\
  \ Java 对象类型中的数据。例如，如果我们创建了一个指向 `GIF` 图像的 `URL`，`getContent` 方法必须理解流类型为 `\"image/gif\"\
  `，并返回 `Image` 类的实例。`Image` 对象将包含 `GIF` 图像的。`getContent` 方法使用的精确机制将在本章后面的“MIME 类型和\
  \ ContentHandler”中进行解释。\n\n```java\nURL myURL;\ntry {\n    myURL = new URL(getCodeBase(),\
  \ \"/index.html\");\n} catch (MalformedURLException e) {}\ntry {\n    Object o =\
  \ myURL.getContent();\n} catch (IOException e) {}\nif (o instanceof Image) {\n \
  \   // 处理图像对象\n}\n```\n\n#### 来自 `URLConnection` 类的组合\n\n如果你使用的 URL 需要额外的输入（例如指向\
  \ CGI 脚本的 URL），或者你需要关于资源的更多信息，可以使用 `openConnection` 方法。该方法返回一个与 `URL` 关联的 `URLConnection`\
  \ 对象。`URLConnection` 类为程序员提供了关于 `URL` 所标识资源的信息和更好的管理。\n\n某些协议除了访问网络资源外，还可以发布有关资源的信息，例如\
  \ MIME 类型或资源最后修改日期。`URLConnection` 类包含了访问这些数据所需的工具方法。\n\n\n\n\n\n`URLConnection`\
  \ 类定义了许多常用方法，可以轻松访问位于给定 URL 的资源信息。这些方法在表 14-4 中给出。某些方法仅适用于 `HTTP URL`，在其他所有情况下将返回\
  \ `null` 或 `0`。\n\n表 14-4. `URLConnection` 类的信息性方法\n\n## 方法描述\n\n| 方法 |  |\n| :---\
  \ | :--- |\n| `getContentEncoding()` | 返回编码后的周末数据资源，如果未知则返回 `null`（例如 `base64`、`7bit`）。\
  \ |\n| `getContentLength()` | 返回资源以字节为单位的大小。 |\n| `getContentType()` | 返回资源的 MIME\
  \ 类型（例如 `image/gif`）。 |\n| `getDate()` | 返回资源发送的日期。 |\n| `getExpiration()` | 返回资源的有效期限。\
  \ |\n| `getHeaderField(String)` | 返回与给定字符串名称匹配头部字段。 |\n| `getHeaderField(int)` |\
  \ 返回与给定整数索引匹配头部字段。 |\n| `getHeaderFieldKey(int)` | 根据给定的索引返回头部字段名称。 |\n| `getHeaderFieldDate(String,long)`\
  \ | 返回与给定字符串名称匹配的头部字段，且识别为日期。整数参数 `long` 作为默认头部字段，如果未被识别或未找到则使用。 |\n| `getHeaderFieldInt(String,int)`\
  \ | 返回与给定行名称匹配的头部字段，且识别为整数。整数参数作为默认头部字段，如果未被识别或未找到则使用。 |\n| `getModifiedSince()`\
  \ | 返回自某以来修改过的字段。 |\n\n## HTTP 与 `URLConnection` 类\n\n为了理解 `URLConnection` 类如何与简单的\
  \ `HTTP URL` 配合，请简要考虑 HTTP 协议的内部机制。下面是一个典型的 HTTP 会话记录；第一行是客户端请求，其余所有行都是服务器响应：\n\n\
  ```http\nGET /index.html HTTP/1.0\nHTTP/1.0 200 document follows\ndate: sun, 10\
  \ Mar 1996 03:52:15 GMT\nServer: NCSA/1.4\ncontent-type: text/html\nLast modified:\
  \ Fri, 08 Mar 1996 20:24:18\ncontent-length: 4611\n<html>\n...\n</html>\n```\n\n\
  如果我们为给定示例中的 `index.html` 页面创建 `URLConnection`，方法 `getContentType` 将返回 \"text/html\"\
  ，而 `getContentLength` 方法将返回 \"4611\"。注意，使用 HTTP 确定这些值是非常容易的——服务器在 `HTTP` 头部中直接返回了它们。许多其他协议并不提供这些信息。\n\
  \n现在让我们回到 `URLConnection` 类方法的运行工具——`getContent` 方法。正当我们在 URL 上调用 `getContent` 方法时，该方法才真正开始工作。首先，`getContent`\
  \ 方法尝试通过检查 HTTP 头部、流本身或文件扩展名来确定相关内容的类型。在决定使用哪种 MIME 类型时，`getContent` 方法会根据指定的 MIME\
  \ 类型查询 `ContentHandler` 类，并传递给 `ContentHandler` 类。\n\n## MIME 类型与 `ContentHandler`\
  \ 类\n\n每个 MIME 类型都可以有自己的 `ContentHandler` 类。当我们在 URL 或 `URLConnection` 上调用 `getContent`\
  \ 时，该 `ContentHandler` 类最终会处理资源数据。`ContentHandler` 类包含一个单一的 `getContent` 方法，该方法使用\
  \ `URLConnection` 作为参数，并返回一个与资源相关的对象。\n\n例如，MIME 类型为 \"image/gif\" 的资源最可能会通过 `getContent`\
  \ 方法返回一个 `Image` 对象或 `Image` 的某些子类。根据 Java API 描述，`ContentHandler` 类是抽象的；`ContentHandler`\
  \ 类的子类为各种 MIME 类型提供了实现。下面是一个适用于任何 \"text/*\" 并不复杂的 `ContentHandler`：\n\n```java\n\
  import java.net.*;\nimport java.io.*;\n\npublic class TextContentHandler extends\
  \ ContentHandler {\n    public Object getContent(URLConnection urlc) {\n       \
  \ try {\n            inputstream is;\n            is = urlc.getInputStream();\n\
  \            DataInputStream ds;\n            ds = new DataInputStream(is);\n  \
  \          int length;\n            length = urlc.getContentLength();\n        \
  \    if (length!=-1) {\n                byte b[] = new byte[length];\n         \
  \       ds.readFully(b);\n                String s = new string(b,0);\n        \
  \    } else {\n                // length unknown\n                String s = \"\"\
  ;\n                int i = is.read();\n                while (i!=-1) {\n       \
  \             s = s+(char)i;\n                    i = is.read();\n             \
  \   }\n            }\n            return s;\n        } catch (Exception e) {\n \
  \           e.printStackTrace();\n            return null;\n        }\n    }\n}\n\
  ```\n\n`URLConnection` 如何选择适当的 `ContentHandler`？在调用 `getContent` 时，首先选择 `ContentHandler`。根据\
  \ Java 描述，`ContentHandler` 是一个接口。它包含一个单一的 `getContent` 方法，使用字符串作为参数并返回一个对象。如下：\n\
  \n```java\nimport java.net.*;\nimport java.io.*;\n\npublic class MyContentHandler\
  \ extends Object implements ContentHandlerFactory {\n    public ContentHandler createHandler(String\
  \ type) {\n        if (type.startsWith(\"text\")) {\n            return new TextContentHandler();\n\
  \        } else {\n            return null;\n        }\n    }\n}\n```\n\n## `ContentHandlerFactory`\
  \ 类\n\n我们可以为 `URLConnection` 设置 `ContentHandlerFactory`。不幸的是，applet 不能设置此方法，因为它们没有使用。幸运的是，在处理\
  \ URL 时，我们可以使用 `ContentHandler` 和 `ContentHandlerFactory`。考虑以下 applet：\n\n```java\n\
  import java.applet.*;\nimport java.net.*;\nimport java.awt.*;\nimport java.io.*;\n\
  \npublic class URLApplet extends applet {\n    private TextArea output;\n    private\
  \ ContentHandler handler;\n\n    public void init() {\n        handler = new TextContentHandler();\n\
  \        output = new TextArea(12,80);\n        output.setEditable(false);\n   \
  \     add(output);\n        show();\n        resize(500,250);\n    }\n\n    public\
  \ void start() {\n        try {\n            URL myURL = new URL(getCodeBase(),\
  \ \"/index.html\");\n            URLConnection myUC = myURL.openConnection();\n\
  \            myUC.connect();\n            Object o = handler.getContent(myUC);\n\
  \            output.setText((String)o);\n        } catch (Exception e) {\n     \
  \       handleException(e);\n        }\n    }\n\n    public void stop() {\n    \
  \    output.setText(\"\");\n    }\n\n    public void handleException(Throwable t)\
  \ {\n        System.out.println(t.toString());\n        t.printStackTrace();\n \
  \   }\n}\n```\n\n在图 14-1 中是该 applet 的截图。该 applet 在 TextArea 中读取并显示程序文本。不使用 `URL`\
  \ 类和 `URLConnection` 类的 `getContent` 方法，让我们直接调用 `ContentHandler` 类的 `getContent`。我们还可以扩展\
  \ applet 使用 `ContentHandlerFactory`。\n\n![image09312](img/image09312.gif)\n\n###\
  \ 示例 14.1.\n\n示例 14-2. 使用 `ContentHandlerFactory` 的 applet。\n\n```java\nimport java.applet.*;\n\
  import java.net.*;\nimport java.awt.*;\nimport java.io.*;\n\nimport MyContentHandlerFactory;\n\
  \npublic class URLApplet extends applet {\n    private TextArea output;\n    private\
  \ ContentHandlerFactory factory;\n\n    public void init() {\n        factory =\
  \ new MyContentHandlerFactory();\n        output = new TextArea(12,80);\n      \
  \  output.setEditable(false);\n        add(output);\n        show();\n        resize(500,250);\n\
  \    }\n}\n```\n\n\n\n\n\n```java\nString type = myUC.getContentType();\nContentHandler\
  \ handler = factory.createContentHandler(type);\nObject o = handler.getContent(myUC);\n\
  output.setText((String)o);\n} catch (Exception e) {\n    handleException(e);\n}\n\
  }\n\npublic void stop() {\n    output.setText(\"\");\n}\n\npublic void handleException(Throwable\
  \ t) {\n    System.out.println(\"CAUGHT: \" + t.toString());\n    t.printStackTrace();\n\
  \    stop();\n}\n```\n\n这个小程序的功能与示例 14-1 中的小程序非常相似，不同在于这个小程序演示了 `ContentHandlerFactory`\
  \ 的用法。首先，我们定义 `URL` 资源的 MIME 类型，然后请求该类型相应的 `ContentHandler`。现在，我们的 `ContentHandlerFactory`\
  \ 仅支持 `\"text/*\"` MIME 类型，但此后我们可以创建新的 `ContentHandler` 类并将它们添加到 `factory` 中。\n\n\
  在默认的 `ContentHandlerFactory` 上，Netscape Navigator 2.0 中使用的 `URLConnections` 类目前不支持任何\
  \ MIME 类型。通过在 `URL` 或 `URLConnection` 上调用 `getContent` 方法，我们极可能会得到一个 `InputStream`；这意味着\
  \ `ContentHandlerFactory` 不知道如何处理该资源。方法 `getContent` 返回的 `InputStream` 连接到资源；程序员被赋予了解接收到的字节的机会。随着时间的推移，该接口的其他实现将会出现。`ContentHandlerFactory`\
  \ 为 Java API 的特定方面开启了新的机会。\n\n## 从帮助流中尝试这些操作\n\n现在在小程序中为 `URLConnection` 类设置 `ContentHandlerFactory`\
  \ 受到限制的情况下，你可能想直接从与 `URLConnection` 关联的流中读取网络资源的数据。`URLConnection` 类提供了两个此目的的方法：`getInputStream`\
  \ 和 `getOutputStream`。如果你尝试在不支持它们的 `URL` 类型上调用其中一个，将得到 `UnknownServiceException`\
  \ 异常。这里是一个简单的示例：\n\n```java\nInputStream is;\nOutputStream os;\ntry {\n    is =\
  \ myConnection.getInputStream();\n    os = myConnection.getOutputStream();\n   \
  \ // 从 is 读取并写入到 os\n} catch (Exception e) {\n    // 处理异常 UnknownServiceException\n\
  }\n```\n\n## 设置 URLConnection 类\n\n配置类 `URLConnection` 存在各种设置选项。\n\n你可以更改它们的一些默认值，之后所有新的\
  \ `URLConnection` 类将获得新值作为给定设置的初始默认值。这些设置的方法描述在表 14-5 中。\n\n表 14-5. `URLConnection`\
  \ 类的设置\n\n## 方法描述\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `boolean getAllowUserInteraction()`\
  \ | 返回用户对话框标志，显示此类型的 URL 是否允许用户对话框。`setAllowUserInteraction(boolean)` 设置用户对话框标志。\
  \ |\n| `boolean getDefaultAllowUserInteraction()` | 返回用户对话框标志的默认值。`setDefaultAllowUserInteraction()`\
  \ 设置默认的用户对话框标志。 |\n| `boolean getUseCaches()` | 某些协议允许在本地缓存中使用资源。此方法返回一个布尔值，显示此类状态。`setUseCaches(boolean)`\
  \ 设置此 `URLConnection` 的缓存设置。 |\n| `boolean getDefaultUseCaches()` | 返回缓存设置的默认值。`setDefaultUseCaches(boolean)`\
  \ 设置缓存设置的默认值。 |\n| `String getRequestProperty(String)` | 返回给定行索引的属性。`setRequestProperty(String,String)`\
  \ 分配第一行索引的第二个属性。 |\n| `String getDefaultRequestProperty(String)` | 返回给定行索引的默认属性。`setDefaultRequestProperty(String,String)`\
  \ 分配第一行索引的默认属性。 |\n| `boolean getDoInput()` | 返回布尔值，表示给定的 `URLConnection` 是否接受输入（input）。`setDoInput(boolean)`\
  \ 设置输入标志。 |\n| `boolean getDoOutput()` | 返回布尔值，表示 `URLConnection` 是否支持输出数据（output）。`setDoOutput(boolean)`\
  \ 设置 DoOutput 标志。 |\n\n## 使用其他协议\n\n我们可以扩展 `URL` 类以处理非 Sun 和 Netscape 提供的其他协议。Java\
  \ API 中描述的 `URLStreamHandler` 类用于 `URL` 打开 `URLConnection` 时。`URLStreamHandler`\
  \ 任务类负责进入包含此资源的计算机必要套接字并执行所需的通信协议。与 `ContentHandler` 类一样，每个协议可能都有关联的 `URLStreamHandler`\
  \ 类。`URLStreamHandler` 类的方法见于表 14-6。\n\n表 14-6. `URLStreamHandler` 类的方法\n\n## 方法描述\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `URLConnection openConnection(URL)` | |\n| `void\
  \ parseURL(URL,String, int, int)` | 创建连接到 URL 的 `URLConnection`。对 URL 上的给定行产生分析。与\
  \ URL 在字符串中的起始和结束索引相关。 |\n| `String toExternalForm(URL)` | 返回标准字符串表示的 `URL`。 |\n\
  | `setURL(URL,String,String, int,string)` | 指定协议类型、主机、端口号、位置目录和指向 URL 的链接。 |\n\n\
  我们可以通过在 `URL` 上使用 `setStreamHandlerFactory` 方法来更改给定 URL 的默认 `StreamHandlerFactory`。此方法是静态的，因此可以在创建\
  \ URL 之前调用。该方法为所有顺序生成的 URL 设置默认的 `StreamHandlerFactory`。如果我们创建一个新的 `StreamHandlerFactory`\
  \ ，我们将希望更改它，而且还希望它用于我们的 URL 以维护它们的链接。类似于 `ContentHandlerFactory` 接口，`StreamHandlerFactory`\
  \ 接口包含单个 `createStreamHandler` 方法，该方法使用 `string` 变量参数并返回 `StreamHandler`。\n\n该行显示\
  \ `StreamHandler` 必须遵循的协议。\n\n虽然我们不允许在 Netscape Navigator 2.0 启动的小程序中为 URL 设置 `StreamHandlerFactory`。同样，这种限制的原因并不完全清楚，因为它阻止了程序员通过\
  \ FTP 或 HTTP-NG 等其他协议分发 Java 小程序。然而，可以使用直接的套接字编程创建一个通过其他协议通信的小程序，但你不能使用 Java API\
  \ 中描述的 `url`。\n\n\n\n\n\n你可能并不完全理解这一章的编写目的，因为在目前最流行的 浏览器 Netscape Navigator 2.0\
  \ 中运行 Java applet 时，大多数 `URL` 类的功能是不被允许或支持的。`URL` 类的意义在于，它们允许你在一个类中存储与特定资源通信所需的所有信息。它们创建所有的套接字，并执行通过\
  \ `HTTP` 检索资源所需的链接和标头解析。随着 `ContentHandler` 类的出现，它们可以将更复杂的资源（如视频文件或数据库文件）翻译成 Java\
  \ 对象，资源搜索 URL 的易性使得使用 URL 比独立解码字节流要高效得多。也许 Netscape 最终会允许 applet 指定自己的线程和内容处理驱动程序。否则，显然将在完善支持\
  \ Java 程序的 Netscape Navigator 中，向默认的 `ContentHandler` 添加新的新的驱动程序。\n\n# 接下来做什么？\n\
  \n在这一章中，我们描述了在使用网络资源进行编程时如何以及为何使用 URL。Java 中 `URL` 最常用的用途之一就是通过 `CGI` 与程序建立连接。\n\
  \n下一章将大幅偏离 applet。除了讨论用 Java 编写服务器外，我们还将考虑可能出现的一些问题。在 Java applet 内部使用 `CGI` 程序具有许多优点——例如，与现有接口的兼容性，以及开发的速度和简单性。然而，`CGI`\
  \ 有许多局限性；最明显的是它的不稳定性。我们将向你展示如何在 Java 中编写更强大的服务器，以及如何建议甚至编写非常困难的 `CGI` 程序。\n\n##\
  \ 第 15 章\n\n![](img/image09313.jpeg)\n\n在 Java 上开发服务器\n\n创建你自己的服务器和协议定义服务器任务\n\n\
  定义客户端-服务器交互构建 Java 服务器\n\n与套接字通信以及处理 I/O own 流处理多个连接\n\n以及多个用户 applet\n\n构建客户端通信\n\
  \n到目前为止，书的这一部分的重点是在 applet 范式中编写网络客户端。现在，我们将向后退一小步，观察更广泛的话题，包括从万维网的角度来看系统客户端-服务器。\n\
  \n当需要集中化服务时（例如在监控数据或分发数据时），就有必要编写独立的服务器。其他的应用程序服务器可能由严格控制安全和使用的数据组成。\n\n例如，在本章提出的通信程序中，服务器可以用于创建仅限选定用户访问的限制，并为用户之间的私有通信设置权限。\n\
  \n在本章中，我们将完成以下工作：\n\n* 我们实现协议。\n* 我们在动态系统客户端-服务器中构建数据流方案。\n* 我们构建用 Java 编写的服务器来实现我们的协议。\n\
  * 我们构建基于我们协议的客户端。\n\n我们决定创建一个特殊的协议，用于在两个或更多人之间进行异步会议。换句话说，我们要创建一个聊天（通信）协议。我们将我们的通信协议称为\
  \ Internet turbo Chat，或 ITC。\n\n![](img/image09314.jpeg)\n\n建议 本章中作为示例的代码段包含在随书附带的\
  \ CD-ROM 中。该光盘可供使用 Windows 95/NT 或 Macintosh 的读者；UNIX 用户应参考在线 Web 伴侣页面，该页面包含了本书的配套材料（地址\
  \ [`www.vmedia.com/java.html`](http://www.vmedia.com/java.html））。\n\n![](img/image09315.jpeg)\n\
  \n# 创建自己的服务器和协议\n\n让我们从创建协议草图开始。在设计协议时应尽量灵活性，以便以后可以添加新功能；同时，一切都定义得足够严谨以容错。首先，我们想要执行以下层级的功能：\n\
  \n* 用户任务命名；\n* 异步网络操作；\n* 指定新连接；\n* 创建服务器窗口，列出连接中的用户。\n\n“登录”过程中的需求是显而易见的：在获取系统通信访问权限之前，用户必须输入他们的名称。然后我们可以向服务器发送该用户的输入消息，而在这一端我们不需要在后台通过检查代码来更改它们。\n\
  \n让我们使用简化的方法：限制在网络上传输的数据行。`DataInputStream` 和 `PrintStream` 类上的 `readln` 和 `println`\
  \ 方法提供了一种无需编码/解码即可传输数据的良好方法。\n\n我们使用的协议非常简单。它执行初始处理。在客户端和服务器上执行 `query (transaction)\
  \ username`，然后为所有连接到服务器的其他客户端显示客户端消息。服务器只处理客户端输入的第一个内容，即他的用户名。从客户端发送到服务器的消息格式如下：这样服务器就不必解析它。这减少了延迟并提高了性能。\n\
  \n## 定义服务器任务\n\n如上所述，特殊函数通常需要专门的服务器。在案例中，我们需要执行几项特殊任务——并在服务器上监控链接。我们可以通过让每个客户端也充当简单的服务器来进一步复杂通信程序，以便实现两个程序之间的通信。但由于我们想要与两个以上的客户端通信，这种复杂性是不必要的。\n\
  \n此外，通信客户端应该越小越好，因为每个用户每次访问页面时都会随着 Web 页面加载。为了做到这一点，我们可以赋予通信服务器额外的功能，这些功能可以由服务器执行，也可以由客户端执行，例如分析输入和周末数据。\n\
  \n此外，我们还应该考虑服务器启动时产生的负载——如果服务器很慢，服务器将缓慢地完成其功能。\n\n## 定义客户端-服务器交互\n\n当需要同步更新信息时，协调是具有多个客户端的服务器的一个重要任务。例如，你想更新所有连接到服务器的客户端，向它们传递某些特殊数据或命令，你应该让他们的服务器容错，以便它在尝试传递网络数据时不会挂起。\n\
  \n在我们的通信程序中，所有客户端必须同时从服务器接收数据，这样同一个用户提交的多个字符串在其他用户看到它们时是在一起的。我们将用一个独立的线程来实现，处理到客户端的输出数据。在这种情况下，独立线程可以自由地向所有连接的客户端发送数据，而不会受限于任何然后某个特定的输入。由于我们每个线程只执行一次操作，即写入客户端数据，我们可以确定客户将在最相同的时间接收数据。为了更好地协调这种交互，我们必须考虑与时间、复杂性和服务器速度相关的问题\n\
  \n### 分发时间\n\n\n\n\n我们已经讨论过同时向客户端端口写入数据的必要性。虽然在目前无法完全实现这一点，但我们的任务是减少向所有客户端写入数据所需的时间，以便让他们产生“数据是同时传输”的印象。我们用于向已连接客户端写入数据的自由运行流可以赋予比从每个客户端读取数据的流更高的优先级。我们可以等待写入流完成，然后开始从已连接的客户端读取数据。另一个需要记在脑中的临时方面与从客户端到服务器的数据转发继有关。\n\
  \n### 连接结构\n\n多个连接的事实使得我们的通信服务器比最初看起来要困难得多。首先，我们需要注意几点——首先是每个连接的状态。如果用户在没有通知服务器的情况下中断了通信客户端，我们将收到一个延迟的连接，这会导致功能运行异常。写入线程可能会尝试向不存在的连接写入数据，而我们将继续尝试从服务器该连接读取数据。解决这个问题的办法有两个：当对已断开的连接进行操作时——抛出异常并终止连接；此外，定期对连接进行检查以进行预防性清理。这种检查和异常处理可以释放宝贵的系统资源。在我们的示例中，预防性连接检查是由\
  \ `ConnectionWatcher` 类执行的。它也运行在自己的流中，这样它就可以执行其职责而不延迟其他函数的执行。\n\n我们需要能够从已连接的客户端读取内容，而不丢失从其他链接读取的能力。如果我们使用循环简单的对每个已连接的客户端顺序执行\
  \ `readln`，我们可能会导致这样的结果：我们将等待一个不再与通信客户端交互的用户，他只是留下了程序运行并去吃饭了。要解决这个问题，你需要让整个服务器变为异步化——即为每个连接创建一个读取线程。同时，单个线程可以根据需要无限等待用户输入消息，而不会挂起服务器。当用户输入消息时，我们只需将其传递给\
  \ `entry`（然后在它自己的流中处理），然后消息将记录到每个客户端。\n\n读取线程可以立即恢复读取用户发送的另一个消息。由于每个连接都有自己的读取线程，我们不需要等待每个单独的链接完成数据读取，因此服务器变得是真正的异步了。然而，必须注意在尝试使用另一个流时不要引用被拆分的写入流和\
  \ `ConnectionWatcher`。在块程序中，对于那些可能尝试实现多次访问的块，我们使用了同步描述。\n\n如上所述，`ServerWrite` 线程向所有链接输出内容。为了“唤醒”\
  \ `ServerWriter`，使用了 `notify` 调用。当 `ServerWriter` 恢复执行时，它会检查定义的变量中是否有要发送给已连接客户端的数据。为了保持数据并避免在两个读取线程进行\
  \ `push` 调用时发生交叉，使用了先进先出（FIFO）数据结构。`FIFO` 类将在第 17 章“与 CGI 交互：Java 存储”中进行详细考虑。\n\n\
  如果我们要解析输入和输出数据，我们需要一个额外的线程，其任务是处理来自其他线程的请求、对其进行分析并转发数据。这增加了复杂性，因为这意味着我们可能为每个连接都需要这样一个额外的流。在我们的通信服务器中，我们不进行数据分析。\n\
  \n### 工作速度\n\n由于我们必须为每个连接创建一个线程，给服务器的线程数量可能会很大。在许多线程争抢两个持续存在的线程 `ServerWriter` 和\
  \ `ConnectionWatcher` 的情况下，出现了服务器运行多快的问题。如果我们预期的会有大量连接，这一点就不能忽略。我们应该在考虑其活跃使用的情况下，尽可能简化我们的这两个类。此外，如果预计会有大量客户进行通信，我们可能希望将服务器翻倍以分担负载。那时你必须处理多个服务器以及通过它们之间的数据传递，这超出了本章的范围。\n\
  \n# Java 构建服务器\n\n在这里我们实现了上一节描述的协议。让我们从通信服务器的细节讨论开始，并以相应客户端通信的简要描述结束。图 15-1 所示的通信服务器与像\
  \ Java 应用程序启动的 applet 不同。applet 范式在本章的示例中作用不大，因为我们希望服务器有一个固定的位置，并且对它从哪里接收通信有最少的限制。注意，通信服务器完全包含在一个类中——`chatserver`。唯一的例外是我们要导入的\
  \ `FIFO` 类。\n\n![](img/image09316.gif)\n\n#### 图 15.1。\n\n为了提高服务器的结构和性能，我们将广泛使用多线程属性。我们将为每个已连接的客户端创建一个单独线程，并启动其他三个线程：一个向每个已连接的客户写入数据的\
  \ `ServerWriter` 线程；一个基础流 `chatserver`，用于监听当新客户端尝试与服务器建立连接时的情况；以及一个用于清理连接的 `ConnectionWatcher`\
  \ 线程。正如我们在“关系”部分讨论的那样，我们可能需要更多额外的线程，不要害怕使用它们！线程使得管理数据流和执行复杂交互变得容易，这在考虑程序文本时将会看到。确实，流为整个系统消息增加了额外的头部（开销），但通常，当连接数不是很大时，流消耗资源。\n\
  \n注意，通信服务器程序中有大量的 `try` 和 `catch` 语句。为了使程序对错误更有抵抗力，充分利用异常处理的可能性很重要。例如，在启动连接过程中，我们执行异常处理。在更复杂的服务器中，异常对于通用函数的起着非常重要的作用。即使在发生概率较低的情况下，也应该产生异常处理。此外，异常可以用于清理、释放系统资源、调试以及对服务器通过流的严格控制。\n\
  \n基础类是 `chatserver`，它是 `Thread` 的扩展。基础类实现了如何流，是因为我们必须运行监听套接字且不会停止其他操作。此线程为每个连接创建自己的线程，并传递再次创建的客户端套接字。\n\
  \n示例 15-1a. 服务器通信程序。\n\n```java\nimport java.awt.*;\nimport java.net.*;\nimport\
  \ java.io.*;\nimport java.util.*;\nimport FIFO\n\npublic class chatserver extends\
  \ Thread\n\n{\n\n    public final int DEFAULT_PORT = 6001;\n    protected int port;\n\
  \n    protected ServerSocket server_port;\n    protected thread group CurrentConnections;\n\
  \    protected List connection_list;\n\n    protected Vector connections;\n    protected\
  \ ConnectionWatcher watcher;\n    protected ServerWriter writer;\n}\n```\n\n\n\n\
  \n```java\n//  如果发生异常，通过错误消息退出\n\npublic static void fail(Exception e, String msg)\
  \ {\n    System.err.println(msg + \": \" + e);\n    System.exit(1);\n}\n\n//  我们为听听连接创建\
  \ ServerSocket。\n//  启动流程。\n\npublic chatserver(int port) {\n    //  调用此流程\n   \
  \ super(\"server\");\n    if (port == 0) port = DEFAULT_PORT;\n    this.port = port;\n\
  \    try {\n        server_port = new ServerSocket(port);\n    } catch (IOException\
  \ e) {\n        fail(e, \"创建 server socket 时发生异常\");\n    }\n}\n\n//  为当前连接创建线程组\n\
  CurrentConnections = new ThreadGroup(\"Server Connections\");\n\n//  用于表示当前连接的 Frame\n\
  Frame f = new Frame(\"Server Status\");\nconnection_list = new List();\nf.add(\"\
  Center\", connection_list);\nf.resize(400, 200);\nf.show();\n\n//  用于存储当前连接的 vector\n\
  connections = new Vector();\n\n//  我们创建 ConnectionWatcher 流程，\n//  它等待其他流的阻塞状态。\n\
  //  它会自动启动。writer = new ServerWriter(this);\nwatcher = new ConnectionWatcher(this,\
  \ writer);\n\n//  服务器开始监听连接\nthis.start();\n\npublic void run() {\n    try {\n \
  \       while (true) {\n            Socket client_socket = server_port.accept();\n\
  \            Connection c = new Connection(client_socket, CurrentConnections, 3,\
  \ watcher, writer);\n            // 避免并发访问\n            synchronized(connections)\
  \ {\n                connections.addElement(c);\n                connection_list.addItem(c.getInfo());\n\
  \            }\n        }\n    } catch (IOException e) {\n        fail(e, \"监听连接时发生异常\"\
  );\n    }\n}\n\n//  启动服务器，监听特定端口\npublic static void main(String[] args) {\n   \
  \ int port = 0;\n    if (args.length == one) {\n        try {\n            port\
  \ = Integer.parseInt(args[0]);\n        } catch (NumberFormatException e) {\n  \
  \          port = 0;\n        }\n    }\n    new chatserver(port);\n}\n```\n\n此时，我们的服务器已经启动，并在端口\
  \ 6001 上上监听新连接。对于每个新连接，服务器会创建一个名为 `connections` 的流程，并向其传输相关参数。我们将新流程添加到 vector 中，该向量包含所有现有连接的流。\n\
  \n该 vector 稍后用于检查链接状态。`SereWriter` 也使用它向已连接的客户端写入数据。新连接被添加到 `frame` 中显示的列表中。\n\n\
  ### 来自帮助套接字的通信与来自流 I/O 的任务\n\n`Connection` 类是负责与客户端进行所有初始化操作的线程。该类将输出流驱动程序传递给 `ServerWriter`\
  \ 类，因为我们意图让此流写入已连接客户端的数据。`Connection` 类通过附加相应的输入输出组件 `socket` 来初始化输入和输出流。此外，由于该线程是专门为此连接开始工作的线程，我们在该方法中获取初始用户名。我们通过\
  \ `getInfo` 方法将用户名传递给 `chatserver` 类。\n\n示例 15-1b. 程序服务器通信。\n\n```java\nclass connection\
  \ extends Thread {\n    static int numberOfConnections = 0;\n    protected Socket\
  \ client;\n    protected ConnectionWatcher watcher;\n    protected DataInputStream\
  \ in;\n    protected PrintStream out;\n    protected ServerWriter writer;\n\n  \
  \  public Connection(Socket client_socket, ThreadGroup CurrentConnections, int priority,\
  \ ConnectionWatcher watcher, ServerWriter writer) {\n        //  分配流程名和房间组\n   \
  \     super(CurrentConnections, \"Connection number\" + numberOfConnections++);\n\
  \        this.setPriority(priority);\n        //  请求优先级流\n        // 参数本地化\n   \
  \     client = client_socket;\n        this.watcher = watcher;\n        this.writer\
  \ = writer;\n        try {\n            in = new DataInputStream(client.getInputStream());\n\
  \            out = new PrintStream(client.getOutputStream());\n            writer.OutputStreams.addElement(out);\n\
  \        }\n        //  我们将流数据合并到输入和周末流数据\n        //  socket client 并将输出流添加到 vector，该向量包含所有\n\
  \        //  周末流数据，它使用了记录流程。\n        catch (IOException e) {\n            try {\n\
  \                client.close();\n            } catch (IOException e2) {}\n    \
  \        System.err.println(\"获取套接字流时发生异常: \" + e);\n            return;\n     \
  \   }\n        //  在性能上启动流程\n        this.start();\n    }\n\n    //  method run\
  \ 执行读取行的循环，直到\n    //  由于连接断开而停止工作\n    public void run() {\n        string inline;\n\
  \        out.println(\"Welcome to Internet Turbo chat\");\n        //  向客户端发送邀请\n\
  \        try {\n            // 在连接未断开之前执行循环\n            while (true) {\n      \
  \          //  读取行\n                inline = in.readLine();\n                if\
  \ (inline == null) break;\n                //  如果为空空 - 连接断开\n                writer.outdata.push(inline);\n\
  \                //  保存字符串用于记录流程\n                synchronized(writer) {\n     \
  \               writer.notify();\n                }\n                //  并调用记录流程。注意\
  \ synchronized() 应用于 Togo，\n                //  是为了防止两个连接同时调用记录流程，\n           \
  \     //  这会导致自身形式的阻塞。\n            }\n        } catch (IOException e) {}\n    \
  \    \n        //  当连接被中断时，我们产生清理并调用 watcher，\n        //  将连接从现有连接 vector 和列表中移除。\n\
  \        //  watcher，除了 Togo，清理输出流。\n        finally {\n            try {\n    \
  \            client.close();\n            } catch (IOException e2) {}\n        \
  \    synchronized(watcher) {\n                watcher.notify();\n            }\n\
  \        }\n    }\n\n    public String getInfo() {\n        String inline = \"\"\
  ;\n        try {\n            inline = in.readLine();\n        } catch (IOException\
  \ e) {\n            System.out.println(\"捕捉异常:\" + e);\n        }\n        // ...\
  \ (逻辑继续)\n        return (inline + \" connected from: \" + client.getHostName());\n\
  \    }\n}\n```\n\n```java\nclass ServerWriter extends Thread {\n    chatserver server;\n\
  \    public Vector outputstreams;\n    public FIFO outdata;\n    private String\
  \ outputline;\n\n    //  处理 OutputStreams 和 outdata\n    //  确保功能工作的通用；这允许直接访问\n\
  \    //  分别添加或清理输出流或数据消息。\n    public ServerWriter(chatserver s) {\n        super(\"\
  Server writer\");\n        //  将此流程放入父线程组并给它命名\n        server = s;\n        OutputStreams\
  \ = new Vector();\n        outdata = new FIFO();\n        this.start();\n    }\n\
  }\n```\n\n\n\n\n\n```java\npublic synchronized void run() {\n    while (true) {\n\
  \        // 流进入无限循环，但它本身只有在\n        // 从帮助通知中再次给出条件预期时才会开始执行。\n        // 同样，我们在同步块中执行此操作，以锁定流并防止多次访问。\n\
  \        try {\n            this.wait();\n        } catch (InterruptedException\
  \ e) {\n            System.out.println(\"捕获到 Inter 异常\");\n        }\n        output\
  \ line = outdata.pop();\n        // 我们在顶部的 FIFO outdata 中获取消息，通知方法必须在那里添加消息。\n \
  \       synchronized (server.connections) {\n            // 我们仍然应该锁定流观察者，\n    \
  \        // 以免在程序工作完成之前尝试任何操作。\n            for (int i = 0; i < OutputStreams.size();\
  \ i++) {\n                PrintStream out;\n                out = (PrintStream)OutputStreams.elementAt(i);\n\
  \                out.println(outputline);\n                // 对输出流进行迭代并在每个输出流中打印消息。\n\
  \            }\n        }\n    }\n}\n```\n\n父类承担了大量工作，每当有新客户端发送消息时它都会运行。此外，它还锁定了\
  \ `ConnectionWatcher` 线程：这样做是为了确保在工作结束之前的输出数据流不会从 `ServerWriter` 的向量 `OutputStreams`\
  \ 中移除。当连接中断流时，`ConnectionWatcher` 会更改 `ServerWriter` 的向量 `OutputStreams`。\n\n示例\
  \ 15-1d。服务器通信。\n\n```java\nclass ConnectionWatcher extends Thread {\n    protected\
  \ chatserver;\n    protected ServerWriter writer;\n\n    protected ConnectionWatcher(chatserver\
  \ s, ServerWriter writer) {\n        super(s.CurrentConnections, \"ConnectionWatcher\"\
  );\n        // 将流放入父线程组并给它命名\n        server = s;\n        writer = writer;\n  \
  \      this.start();\n    }\n\n    // 此方法等待关于现有流的通知并清理列表。\n    // 此方法是同步的，因此启动时它会锁定一个对象。\n\
  \    // 这是必要的，以便方法可以在 this 上调用 wait()。\n    // 即使对象的连接永远不会调用 notify()，此方法也会每五秒运行一次，\n\
  \    // 并检查任何发生变化的所有连接。\n    // 注意，对向量 vector 以及组件 GUI 的整个访问\n    // 列表 server\n\
  \    // 都在同步块内部产生。这保护了类\n    // 防止添加新的通信，直到我们移除旧连接。\n    public synchronized void\
  \ run() {\n        // 我们锁定此流，当它开始时，\n        // 以防止多次访问。\n        while (true) {\n\
  \            // 流进入无限循环\n            try {\n                this.wait(10000);\n\
  \                // 流每二十秒“启动”一次，清除可能不存在的连接。\n            } catch (InterruptedException\
  \ e) {\n                System.out.println(\"捕获到 Inter 异常\");\n            }\n \
  \           synchronized (server.connections) {\n                // 我们遍历每个连接。\n\
  \                for (int i = 0; i < server.connections.size(); i++) {\n       \
  \             connection c;\n                    c = (Connection)server.connections.elementAt(i);\n\
  \                    if (!c.isAlive()) {\n                        // 如果连接不再存在，从\
  \ Vector 中移除它。\n                        server.connections.removeElementAt(i);\n\
  \                        writer.outdata.push(server.connection_list.getItem(i) +\
  \ \" has left chat\\n\");\n                        synchronized (writer)\n     \
  \                       writer.notify();\n                        // 我们告诉其他客户端，用户退出了。\n\
  \                        server.connection_list.delItem(i);\n                  \
  \      // 最后，从 server connections 列表中移除它。\n                        i--;\n      \
  \                  // 我们应该减少计数器，因为\n                        // 我们只在单元上减少了向量 connections。\n\
  \                    }\n                }\n            }\n        }\n    }\n}\n\
  ```\n\n到此，我们完成了服务器程序的编写。利用 Java API 中包含的各种类，我们创建了一个完全容错的多线程服务器。你可以使用聊天客户端 `http://www.vmedia.com/onlcomp/java/chapter15/ChatClient.html`\
  \ 查看此服务器的运行。现在让我们转向客户端通信。\n\n### 构建客户端通信\n\n客户端 applet 包含窗口中（图 15-2）。在创建它时，我们也将使用多线程来实现异步通信。applet\
  \ 连接到主机的端口 6001；客户端的结果是真正的异步的，因为用户在屏幕上出现新消息的同时可以输入自己的消息。\n\n```java\nimport java.io.*;\n\
