  \  }\n    }\n}\n```\n\n## 从 CIS 连接国际象棋盘\n\n我们将开发一个应用程序，它被用于实现 CIS 客户端，就像我们的棋盘一样，以及异步数据的接收器。以下是程序的文本，用于解析\
  \ CIS 输出并发布 CIS 指令。如果我们良好地设计了应用程序，这将是包含专门针对 CIS 程序的唯一章节。CIS 通过编号监控比赛，当他发送带有带有更新的棋盘的消息时，该消息中包含了编号部分。我们的主程序被设计为包含一组按游戏编号索引的棋盘。每个棋盘对应一个比赛，并位于自己的窗口中。\n\
  \n\n\n\n不要仅仅显示剩余多少时间，让我们利用 Java 语言处理流（streams）的能力，让时钟为当前活跃的玩家计算秒。`Label` 类提供了一个输出文本的通用不可编辑字段。让我们在\
  \ `stop watch` 类（`stopwatch`）中扩展它，以接收 `label`，它将显示当前时间并在每秒时递减包含该值的变量。`StopWatch`\
  \ 类的通用方法见表 18-2。\n\n### 表 18-2. 通用类 `stop watch` 的通用方法\n\n| 方法 | 描述 |\n| :--- |\
  \ :--- |\n| `set(int)` | 设置并显示剩余时间。 |\n| `start()` | 开始倒计时。 |\n| `stop()` | 停止计时。\
  \ |\n| `clear()` | 完全停止时钟。 |\n\n让我们来编写 `stopwatch` 的程序：\n\n```java\nimport java.awt.*;\n\
  \npublic class stopwatch extends label implements runnable {\n    private Thread\
  \ engine;\n    private int time=0;\n\n    public stopwatch() {\n        super();\n\
  \        engine = new thread(this);\n        engine.setPriority(3);\n    }\n\n \
  \   public StopWatch(int i) {\n        this();\n        set(i);\n    }\n\n// set\
  \ 方法用于设置秒钟上的剩余时间。它必须是同步的，因为不同的玩家对可能会尝试同时设置时间。如果 time 为负，则重置 label 以显示时间：\n    public\
  \ synchronized void set(int i) {\n        time = i;\n        if (time > 0) {\n \
  \           int min = time/60;\n            int sec = time%60;\n            if (sec\
  \ > 9) {\n                setText(\"\"+min+\":\"+sec);\n            } else {\n \
  \               setText(\"\"+min+\":0\"+sec);\n            }\n        } else {\n\
  \            setText(\"0:00\");\n        }\n    }\n\n    public void start() {\n\
  \        if (engine != null) {\n            if (!engine.isAlive()) {\n         \
  \       engine.start();\n            } else {\n                engine.resume();\n\
  \            }\n        }\n    }\n\n    public void stop() {\n        if (engine\
  \ != null) {\n            engine.suspend();\n        }\n    }\n\n    public void\
  \ clear() {\n        if (engine != null) {\n            engine.stop();\n       \
  \     engine = null;\n        }\n    }\n\n    public void run() {\n        while\
  \ (engine != null && engine.isAlive()) {\n            set(time-1);\n           \
  \ try {\n                engine.sleep(1000);\n            } catch (InterruptedException\
  \ e) {}\n        }\n    }\n}\n```\n\n### 实现 `ChessFrame`\n\n现在我们可以继续实现 `ChessFrame`。在表\
  \ 18-3 给出了 `ChessFrame` 类的通用方法。\n\n### 表 18-3. `ChessFrame` 方法\n\n| 方法 | 描述 |\n\
