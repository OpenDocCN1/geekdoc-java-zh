  \ AWT 程序。你只需要处理事件并将程序胶接在一起。\n\n# 可能的改进\n\n我们创建的只是一个会议基础 applet。要添加我们需要的所有属性，可能需要几周时间。Ultimate\
  \ Scheduler 可以做很多事情，程序将会变得非常长。如果你想扩展程序功能，可以考虑以下机会：\n\n* 添加通用的每周/每月视图。\n* 允许用户或公司设置忙日期或周末。\n\
  * 为一组人指定计算机选择特定长度的时间间隔。\n* 管理安全信息，例如定义允许安排特定日程的人员。\n* 包装电子邮件消息：\n    * 通知用户他的日程已更改。\n\
  \    * 关于重要会议或日期的警告（例如结婚纪念日）。\n* 允许安排资源的使用——例如会议室和音视频设备。\n\n"
